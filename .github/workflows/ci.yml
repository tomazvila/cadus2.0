# Cadus 2.0 merge gate in CI (C3, D9).
#
# The job runs `scripts/gate.sh`, the same script a developer runs on a laptop.
# CI adds no extra step and no weaker step. The gate holds the whole contract:
# fmt, clippy with -D warnings, the test suite, `cargo sqlx prepare --check`,
# `scripts/check_migrations.sh`, and `scripts/check_ops.sh`.
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest

    # A throwable Postgres 16 for the SQL part of the gate.
    #
    # `POSTGRES_HOST_AUTH_METHOD: trust` is required, not a convenience. The test
    # harness opens a second pool as the `cadus_app` role
    # (`crates/store/src/test_support.rs`), and `migrations/0001_roles.sql`
    # creates that role with no password. Without trust auth the `postgres:16`
    # image appends `host all all all scram-sha-256` to `pg_hba.conf`, the runner
    # reaches the service through the docker bridge, and every database-backed
    # test dies with `password authentication failed for user "cadus_app"`. The
    # gate is then red on every push and gives no signal (finding #1).
    #
    # The container is a throwaway: it holds no production data, it lives for the
    # length of one job, and only that job reaches it. It is the same throwaway
    # cluster that README.md and `test_support.rs` document for a laptop. The
    # deployment is the opposite case: `docker-compose.yml` runs the database
    # WITHOUT trust auth, because a container network is not an authentication
    # boundary.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_HOST_AUTH_METHOD: trust
        # Publish on the loopback interface only. `5432:5432` binds every
        # interface of the runner, and the service runs with trust auth, so any
        # process that reaches the runner over the network connects as the
        # superuser. The gate steps run on the runner host and reach the
        # database at `localhost:5432`, so the loopback bind is enough.
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CADUS_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/cadus2_ci

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked

      - name: Create the gate database
        run: cargo sqlx database create
        env:
          DATABASE_URL: ${{ env.CADUS_TEST_DATABASE_URL }}

      # The gate runs `cargo sqlx prepare --check`, which compiles the query
      # macros against this database. An empty database has no `users` table, so
      # the compile fails. Apply the migrations first. Run this from the
      # repository root, because `cargo sqlx migrate run` reads `migrations/`.
      - name: Migrate the gate database
        run: cargo sqlx migrate run
        env:
          DATABASE_URL: ${{ env.CADUS_TEST_DATABASE_URL }}

      - name: Run the gate
        run: scripts/gate.sh

      # The gate runs `scripts/bench.sh`, which writes the L1 and L2 numbers of
      # docs/reference/l1-budget.md to target/bench as JSON. The gate reads only
      # the p95 assertions; the review cycle reads the trend across runs, so the
      # artifact goes up on a red run too (spec section 10.2).
      - name: Upload the benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: target/bench/*.json
          if-no-files-found: warn
