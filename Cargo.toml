[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
cadus-core = { path = "crates/core" }
cadus-store = { path = "crates/store" }

tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9" }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip` is REQUIRED for M3 parity (R5). Without it, `serde_json`'s
# number parser is off by one unit in the last place on some inputs: it reads
# `0.36925854946048403` as `0.369258549460484`, which is a different `f64`. The
# 1.0 oracle reads the correctly rounded value, so the fold would diverge on the
# first such float in an event payload or a cached learner model.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# YAML for the curriculum loader (M1, C5). `serde_norway` is a maintained fork of
# the archived `serde_yaml`; it tracks serde 1.x, keeps mapping order in
# `serde_norway::Value`, and its derive support honors
# `#[serde(deny_unknown_fields)]`, which the curriculum schema needs (spec 1).
# It is the ONE YAML crate of the pure core (R3).
serde_norway = { version = "0.9.42" }
# SHA-256 for the curriculum hash (M1 U4). It is a pure computation crate:
# no network, no database, no model. `sqlx` already resolves the same version.
sha2 = { version = "0.10.9" }
# Exact arithmetic for the answer checker (M2, D6: no float in an equality
# decision). All four crates are pure computation: no network, no database, no
# model.
num-bigint = { version = "0.4.6" }
num-traits = { version = "0.2.19" }
# `num-rational` gives the exact rational of the canonical form, and
# `num-integer` gives the gcd of the content normalization (M2 U2, D6).
num-rational = { version = "0.4.2" }
num-integer = { version = "0.1.47" }

# M3 (spec section 7 traps T8/T9). `chrono` gives the calendar arithmetic of the
# UTC instants and `chrono-tz` compiles the IANA time-zone database in, so
# `local_day` needs no file at run time. Both are pure computation: no network,
# no database, no model call.
chrono-tz = { version = "0.10.4" }
# SHA-1 for `problem_text_hash` (M3 U1, spec trap T17). It is the 1.0 digest of a
# problem text; the value is a dedup key, never a security claim.
sha1 = { version = "0.10.6" }
# Seeded, reproducible randomness for the template draws (M4 U1, spec section 3.2).
# `rand_chacha` gives `ChaCha8Rng`, a counter-based stream cipher generator whose
# output depends on the seed alone, so a reviewer reproduces any served instance
# from the recorded `u64`. `default-features = false` keeps `getrandom` and the
# whole operating-system entropy path out of the pure core (R3): the core never
# takes a seed from the machine, the caller passes one.
rand_chacha = { version = "0.3.1", default-features = false }
# The `RngCore` and `SeedableRng` traits of the generator above. It is a trait
# crate: no network, no database, no model call, and no entropy source when
# `default-features = false` drops `getrandom`.
rand_core = { version = "0.6.4", default-features = false }

# M5 U2 auth primitives (spec section 3.1). All five are pure computation: no
# network, no database, no model call.
# `argon2` is the RustCrypto Argon2id implementation. `default-features = false`
# with `std` drops the crate's own `rand` path, so the one entropy source of
# `cadus-web` is the single `getrandom` call that U2 writes.
argon2 = { version = "0.5.3", default-features = false, features = ["std"] }
# The operating-system entropy of the session token and of the Argon2 salt. It
# is a syscall wrapper: no network, no process start.
getrandom = { version = "0.2.17" }
# URL-safe base64 without padding, for the 43-character session token. The
# encoder reads no table by a secret index, so it leaks no timing.
base64ct = { version = "1.8.3", features = ["alloc"] }
# Constant-time byte equality for a token compare.
subtle = { version = "2.6.1" }
# NFKC for the email normalization of spec section 3.1.
unicode-normalization = { version = "0.1.25" }

# Insertion-ordered map for the places where 1.0 relies on Python dict order
# (M3, spec trap T6): the `balances` map of `diagnostic_placed` and the ability
# delta map of the FIRe update.
indexmap = { version = "2.14.0", features = ["serde"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = { version = "1.0.104" }
thiserror = { version = "2.0.20" }

# HTTP test helpers. `tower` gives `ServiceExt::oneshot`, so a route test drives
# the router in process and needs no socket.
tower = { version = "0.5.3", features = ["util"] }
http-body-util = { version = "0.1.5" }

# Development only. The core purity test parses Cargo.toml with it.
toml = { version = "1.1.4" }

# Development only. The R4 purity tests of `cadus-web` and `cadus-worker` read
# the RESOLVED dependency graph with it. A manifest text tells one crate's own
# tables; the resolved graph tells every crate that links into the binary.
cargo_metadata = { version = "0.23.1" }

# The gate runs clippy with `-D warnings`, so these lints block a merge.
# Test code opts out with `#![cfg_attr(test, allow(...))]` in each crate root
# and `#![allow(...)]` at the top of each integration test file.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
