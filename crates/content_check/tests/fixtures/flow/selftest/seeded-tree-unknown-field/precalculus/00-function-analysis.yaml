unit: function-analysis
course: precalculus
module: "Function Analysis"
topics:
  - id: average-rate-of-change
    name: Average Rate of Change
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites: []
    knowledge_points:
      - id: kp1
        name: "Average rate from a rule or a table (clean)"
        key_prerequisites: []
        exemplars:
          - problem: "Let f(x) = x^2 + 3. Find the average rate of change of f from x = 1 to x = 4."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The average rate is the change of f divided by the change of x; f(4) - f(1) = 15. Divide 15 by 3; thus the rate is 5."
            distractor_note: "This field is not in the schema."
          - problem: "A function g has the rule g(x) = 3x + 5. Compute the average rate of change of g on the interval from x = 2 to x = 6."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The graph of g is a line, and the average rate of a line is equal to its slope. The slope of g is the coefficient of x; thus the rate is 3."
          - problem: "The height of a plant is h(t) = t^2 + 2t centimeters after t weeks. What is the average growth rate, in centimeters for each week, from t = 0 to t = 4?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute h(4) = 24 and h(0) = 0, then subtract to get 24. Divide the difference by 4; thus the rate is 6."
          - problem: "For p(x) = x^3, determine the average rate of change between x = 0 and x = 2."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The cube rule gives p(2) = 8 and p(0) = 0, and the difference is 8. Divide the difference by 2; thus the rate is 4."
          - problem: "A table gives q(1) = 10 and q(5) = 2. Evaluate the average rate of change of q from x = 1 to x = 5."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Subtract the table values in the same order as the inputs; the change of q is -8. Divide -8 by the input change 4; thus the rate is -2."
          - problem: "The average rate of change of a function r from x = 2 to x = 7 is 3, and r(2) = 4. Find r(7)."
            answer: "19"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply the rate 3 by the input change 5 to get the change of r, which is 15. Add the start value 4; thus r(7) = 19."
