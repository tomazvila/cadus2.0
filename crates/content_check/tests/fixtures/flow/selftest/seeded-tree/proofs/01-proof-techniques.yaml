    prerequisites: []
    knowledge_points:
      - id: kp1
        name: "Show the rewrite of the step, a = 7 (defect 7, file rule)"
        key_prerequisites: []
        exemplars:
          - problem: "In the induction proof that n^3 + 2n is divisible by 3, compute the value of n^3 + 2n at the base case n = 1."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The base case puts 1 in the place of n, which gives 1 + 2. Add the two numbers; thus the base value is 3."
          - problem: "The induction step for 7^n - 1 writes 7^(k+1) - 1 = 7(7^k - 1) + c. Determine the constant c."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the right side to get 7^(k+1) - 7 + c, and compare it with the left side. The constants give -7 + c = -1; thus c = 6."
          - problem: "The number 7^3 - 1 is divisible by 6. Find the quotient (7^3 - 1)/6."
            answer: "57"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the power 7^3 = 343 and subtract 1 to get 342. Divide 342 by 6; thus the quotient is 57."
          - problem: "An induction step shows that 6 divides 7^(k+1) - 1. The step starts from 7^(k+1) - 1 and must reach a form that shows the hypothesis. Which line is the correct form?"
            answer: "7(7^k - 1) + 6"
            answer_contract: {"kind": "label", "options": [["7(7^k - 1) + 6"], ["7(7^k - 1)"], ["7^k - 1 + 6"], ["7(7^k) + 6"]]}
            solution_sketch: "Expand each candidate and compare it with the start value. The option 7(7^k - 1) loses the constant, the option 7^k - 1 + 6 loses the factor, and the option 7(7^k) + 6 has the wrong sign; thus the answer is 7(7^k - 1) + 6."
          - problem: "A student proves by induction that 7^n - 1 is a multiple of 6. The student uses the induction hypothesis in exactly one place. Which statement is the induction hypothesis?"
            answer: "6 divides 7^k - 1 for one fixed k"
            answer_contract: {"kind": "label", "options": [["6 divides 7^k - 1 for one fixed k"], ["6 divides 7^(k+1) - 1"], ["6 divides 7^n - 1 for each n"], ["6 divides 7 - 1"]]}
            solution_sketch: "The hypothesis is the claim for one fixed integer k, and the step derives the next case from it. The option 6 divides 7^(k+1) - 1 is the goal, the option 6 divides 7^n - 1 for each n is the theorem, and the option 6 divides 7 - 1 is the base case; thus the answer is 6 divides 7^k - 1 for one fixed k."
          - problem: "The induction step reaches the sum 7(7^k - 1) + 6. Which reason shows that 6 divides this sum?"
            answer: "6 divides each of the two terms"
            answer_contract: {"kind": "label", "options": [["6 divides each of the two terms"], ["6 divides 7"], ["the sum is even"], ["7^k is prime"]]}
            solution_sketch: "The hypothesis gives the first term and the second term is 6 itself, so the divisor goes into each term. The option 6 divides 7 is false, the option the sum is even proves too little, and the option 7^k is prime is false; thus the answer is 6 divides each of the two terms."
