        key_prerequisites: []
        exemplars:
          - problem: "In the induction proof that n^3 + 14n is divisible by 3, compute the value of n^3 + 14n at the base case n = 1."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The base case puts 1 in the place of n, which gives 1 + 14. Add the two numbers; thus the base value is 15."
          - problem: "The induction step for 6^n - 1 writes 6^(k+1) - 1 = 6(6^k - 1) + c. Determine the constant c."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand the right side to get 6^(k+1) - 6 + c, and compare it with the left side. The constants give -6 + c = -1; thus c = 5."
          - problem: "An integer n makes 6^n - 1 a multiple of 5. State the parity of 6^n - 1 for each such n."
            answer: "odd"
            solution_sketch: "The power 6^n is even for each positive integer n, because 6 is even. Subtract 1 from an even number; thus the parity is odd."
          - problem: "The number 6^3 - 1 is divisible by 5. Find the quotient (6^3 - 1)/5."
