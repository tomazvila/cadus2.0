          - problem: "Let S(n) = n^2 + n. Evaluate S(k+1) - S(k) at k = 8."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand S(k+1) - S(k) = (k+1)^2 + (k+1) - k^2 - k, which is 2k + 2. Put 8 in the place of k; thus the value is 18."
          - problem: "An induction proof that 5 divides 6^n - 1 starts at n = 2. State the value of 6^2 - 1."
            answer: "35"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the power 6^2 = 36 with one multiplication. Subtract 1 from 36; thus the start value is 35."
