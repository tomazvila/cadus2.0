          - problem: "The average rate of change of a function r from x = 3 to x = 8 is 4, and r(3) = 5. Find r(8)."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply the rate 4 by the input change 5 to get the change of r, which is 20. Add the start value 5; thus r(8) = 25."
          - problem: "Let f(x) = x^2 + 4. Find the average rate of change of f from x = 2 to x = 6."
            answer: "8"
