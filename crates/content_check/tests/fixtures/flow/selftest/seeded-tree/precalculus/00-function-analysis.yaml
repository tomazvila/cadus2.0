          - problem: "The rate model of a tank is the product (x^3 + 27x^2 + 113x + 107)(x^3 + 59x^2 + 117x + 119). State the product as one expanded polynomial in x."
            answer: "x^6 + 86x^5 + 1823x^4 + 10052x^3 + 22747x^2 + 25966x + 12733"
