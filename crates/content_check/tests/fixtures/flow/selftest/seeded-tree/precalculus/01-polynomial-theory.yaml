unit: polynomial-theory
course: precalculus
module: "Polynomial Theory"
topics:
  - id: remainder-factor-theorems
    name: Remainder and Factor Theorems
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites: []
    knowledge_points:
      - id: kp1
        name: "Remainder and factor values (clean)"
        key_prerequisites: []
        exemplars:
          - problem: "Find the remainder when x^2 + 2x + 3 is divided by x - 2."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Remainder Theorem says that the remainder is the value of the polynomial at x = 2. The value is 4 + 4 + 3; thus the remainder is 11."
          - problem: "Let p(x) = x^3 - 1x + 20. Use the Remainder Theorem to compute the remainder of p(x) on division by x - 3."
            answer: "44"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Put 3 in the place of x, which gives 27 - 3 + 20. Add the three numbers; thus the remainder is 44."
          - problem: "The polynomial x^2 + kx + 2 has the factor x - 2. Determine k."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Factor Theorem says that the value at x = 2 is zero, so 4 + 2k + 2 = 0. Solve the linear equation 2k = -6; thus k = -3."
          - problem: "A polynomial q(x) gives q(5) = 31. What is the remainder when q(x) is divided by x - 5?"
            answer: "31"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Remainder Theorem says that the remainder on division by x - 5 is equal to q(5). The value of q(5) is given in the problem; thus the remainder is 31."
          - problem: "Evaluate p(-2) for p(x) = 2x^2 + 3x + 40, which is the remainder on division by x + 2."
            answer: "42"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Put -2 in the place of x, which gives 8 - 6 + 40. Add the three numbers; thus the remainder is 42."
          - problem: "When x^2 - 11x + 18 is divided by x - 2, the remainder is 0. Find the other root of the polynomial."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The zero remainder says that 2 is a root, and the two roots of x^2 - 11x + 18 have the sum 11. Subtract 2 from 11; thus the other root is 9."
      - id: kp2
        name: "Factor verdict in a label part with multi-word options (defect 5)"
        key_prerequisites: []
        exemplars:
          - problem: "Find the remainder when x^2 + 3x + 4 is divided by x - 3."
            answer: "22"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Remainder Theorem says that the remainder is the value of the polynomial at x = 3. The value is 9 + 9 + 4; thus the remainder is 22."
          - problem: "Let p(x) = x^3 - 2x + 21. Use the Remainder Theorem to compute the remainder of p(x) on division by x - 4."
            answer: "77"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Put 4 in the place of x, which gives 64 - 8 + 21. Add the three numbers; thus the remainder is 77."
          - problem: "The polynomial x^2 + kx + 6 has the factor x - 3. Determine k."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Factor Theorem says that the value at x = 3 is zero, so 9 + 3k + 6 = 0. Solve the linear equation 3k = -15; thus k = -5."
          - problem: "A polynomial q(x) gives q(6) = 38. What is the remainder when q(x) is divided by x - 6?"
            answer: "38"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Remainder Theorem says that the remainder on division by x - 6 is equal to q(6). The value of q(6) is given in the problem; thus the remainder is 38."
          - problem: "Evaluate p(-3) for p(x) = 3x^2 + 4x + 41, which is the remainder on division by x + 3."
            answer: "56"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Put -3 in the place of x, which gives 27 - 12 + 41. Add the three numbers; thus the remainder is 56."
          - problem: "When x^2 - 14x + 33 is divided by x - 3, the remainder is 0. Find the other root of the polynomial."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The zero remainder says that 3 is a root, and the two roots of x^2 - 14x + 33 have the sum 14. Subtract 3 from 14; thus the other root is 11."
          - problem: "A student divides x^2 - 5x + 6 by x - 2. Give the remainder r and the verdict v about the divisor."
            answer: "r = 0; v = it is a factor"
            answer_contract: {"kind": "multipart", "parts": [{"name": "r", "contract": {"kind": "exact"}}, {"name": "v", "contract": {"kind": "label", "options": [["it is a factor"], ["it is not a factor"]]}}]}
            solution_sketch: "The value at x = 2 is 4 - 10 + 6 = 0, so the remainder is 0. The Factor Theorem says that a zero remainder makes the divisor a factor; thus the verdict is it is a factor."
      - id: kp3
        name: "Theorem statements with five labels (defect 6)"
        key_prerequisites: []
        exemplars:
          - problem: "Find the remainder when x^2 + 4x + 5 is divided by x - 4."
            answer: "37"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Remainder Theorem says that the remainder is the value of the polynomial at x = 4. The value is 16 + 16 + 5; thus the remainder is 37."
          - problem: "Let p(x) = x^3 - 3x + 22. Use the Remainder Theorem to compute the remainder of p(x) on division by x - 5."
            answer: "132"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Put 5 in the place of x, which gives 125 - 15 + 22. Add the three numbers; thus the remainder is 132."
          - problem: "The polynomial x^2 + kx + 12 has the factor x - 4. Determine k."
            answer: "-7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Factor Theorem says that the value at x = 4 is zero, so 16 + 4k + 12 = 0. Solve the linear equation 4k = -28; thus k = -7."
          - problem: "A polynomial q(x) gives q(7) = 45. What is the remainder when q(x) is divided by x - 7?"
            answer: "45"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Remainder Theorem says that the remainder on division by x - 7 is equal to q(7). The value of q(7) is given in the problem; thus the remainder is 45."
          - problem: "Evaluate p(-4) for p(x) = 4x^2 + 5x + 42, which is the remainder on division by x + 4."
            answer: "86"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Put -4 in the place of x, which gives 64 - 20 + 42. Add the three numbers; thus the remainder is 86."
          - problem: "When x^2 - 17x + 52 is divided by x - 4, the remainder is 0. Find the other root of the polynomial."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The zero remainder says that 4 is a root, and the two roots of x^2 - 17x + 52 have the sum 17. Subtract 4 from 17; thus the other root is 13."
          - problem: "A polynomial p(x) is divided by x - 4. Which value is equal to the remainder?"
            answer: "p(4)"
            answer_contract: {"kind": "label", "options": [["p(4)"], ["p(-4)"], ["p(0)"], ["4p(1)"]]}
            solution_sketch: "The Remainder Theorem gives the value of the polynomial at the zero of the divisor. The option p(-4) has the wrong sign, the option p(0) is the constant term, and the option 4p(1) has no rule; thus the answer is p(4)."
          - problem: "A polynomial q(x) has q(-3) = 0. Which expression is a factor of q(x)?"
            answer: "x + 3"
            answer_contract: {"kind": "label", "options": [["x + 3"], ["x - 3"], ["3x + 1"], ["x^2 + 3"]]}
            solution_sketch: "The Factor Theorem turns the root -3 into the factor x minus the root. The option x - 3 has the wrong sign, the option 3x + 1 has a root that is not an integer, and the option x^2 + 3 has no real root; thus the answer is x + 3."
          - problem: "Which divisor gives the remainder p(5) by the Remainder Theorem?"
            answer: "x - 5"
            answer_contract: {"kind": "label", "options": [["x - 5"], ["x + 5"], ["5x"], ["x^5"]]}
            solution_sketch: "The Remainder Theorem uses the divisor x minus the input of the value. The option x + 5 gives p(-5), the option 5x gives p(0), and the option x^5 is not linear; thus the answer is x - 5."
          - problem: "A polynomial r(x) has the distinct roots 7, 8 and 9. What is the least possible degree of r(x)?"
            answer: "3"
            answer_contract: {"kind": "label", "options": [["3"], ["2"], ["4"], ["1"]]}
            solution_sketch: "Each distinct root gives one linear factor, so the degree is at least the count of the roots. The option 2 and the option 1 lose a root, and the option 4 is not the least degree; thus the answer is 3."
          - problem: "The division of s(x) by x - 6 gives the quotient c(x) and the remainder k. Which identity holds?"
            answer: "s(x) = (x - 6)c(x) + k"
            answer_contract: {"kind": "label", "options": [["s(x) = (x - 6)c(x) + k"], ["s(x) = (x + 6)c(x) + k"], ["s(x) = (x - 6)k + c(x)"], ["s(x) = c(x) + k"]]}
            solution_sketch: "The division identity is dividend equals divisor times quotient plus remainder. The option s(x) = (x + 6)c(x) + k has the wrong sign, the option s(x) = (x - 6)k + c(x) swaps the roles, and the option s(x) = c(x) + k drops the divisor; thus the answer is s(x) = (x - 6)c(x) + k."
      - id: kp4
        name: "Remainder with an item of kind none (defect 10)"
        key_prerequisites: []
        exemplars:
          - problem: "Find the remainder when x^2 + 5x + 6 is divided by x - 5."
            answer: "56"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Remainder Theorem says that the remainder is the value of the polynomial at x = 5. The value is 25 + 25 + 6; thus the remainder is 56."
          - problem: "Let p(x) = x^3 - 4x + 23. Use the Remainder Theorem to compute the remainder of p(x) on division by x - 6."
            answer: "215"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Put 6 in the place of x, which gives 216 - 24 + 23. Add the three numbers; thus the remainder is 215."
          - problem: "The polynomial x^2 + kx + 20 has the factor x - 5. Determine k."
            answer: "-9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Factor Theorem says that the value at x = 5 is zero, so 25 + 5k + 20 = 0. Solve the linear equation 5k = -45; thus k = -9."
          - problem: "A polynomial q(x) gives q(8) = 52. What is the remainder when q(x) is divided by x - 8?"
            answer: "52"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Remainder Theorem says that the remainder on division by x - 8 is equal to q(8). The value of q(8) is given in the problem; thus the remainder is 52."
          - problem: "Evaluate p(-5) for p(x) = 5x^2 + 6x + 43, which is the remainder on division by x + 5."
            answer: "138"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Put -5 in the place of x, which gives 125 - 30 + 43. Add the three numbers; thus the remainder is 138."
          - problem: "When x^2 - 20x + 75 is divided by x - 5, the remainder is 0. Find the other root of the polynomial."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The zero remainder says that 5 is a root, and the two roots of x^2 - 20x + 75 have the sum 20. Subtract 5 from 20; thus the other root is 15."
          - problem: "Explain why the remainder of x^2 + 1 on division by x - 1 is 2. Give the full argument."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "The Remainder Theorem says that the remainder is the value at x = 1. The value is 1 + 1; thus the remainder is 2."
