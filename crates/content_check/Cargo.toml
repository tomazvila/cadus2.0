[package]
name = "content_check"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "content_check"
path = "src/main.rs"

[dependencies]
cadus-core = { workspace = true }
num-bigint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }

# `num-bigint`: the shared file `../check_keys/src/mutate.rs` (a `#[path]` module)
# uses it, and cargo-machete reads the files of this crate only.
# `sqlx`, `tokio`: lane B5b uses them for `--db` and must not change this manifest.
[package.metadata.cargo-machete]
ignored = ["num-bigint", "sqlx", "tokio"]

[lints]
workspace = true
