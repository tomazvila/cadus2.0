[package]
name = "cadus-worker"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cadus_worker"
path = "src/lib.rs"

[[bin]]
name = "cadus-worker"
path = "src/bin/cadus-worker.rs"

[dependencies]
cadus-core = { workspace = true }
# M5 U10 (L6, T2). The ONE crate that reaches a model endpoint. `cadus-worker` is
# its only user, so a model call from a request handler is a compile error.
cadus-model-client = { workspace = true }
cadus-store = { workspace = true }
# M5 U10. The diagnosis payload, the tool schema and the result document are JSON
# documents. It is a data-format crate: no socket, no model.
serde_json = { workspace = true }
# M6 R1 (A2, C6). SHA-256 for the authoring prompt digest, which is 1.0's
# `template_prompt_digest` (`prompts.py:779-796`). It is a pure computation
# crate: no socket, no database, no model. `sqlx` already resolves the same
# version, so the lock file gains no crate.
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The tests build the throwaway database that the process test points the binary at.
cadus-store = { workspace = true, features = ["test-support"] }
# Test only. `tests/run.rs` sends SIGTERM to the worker process with `libc::kill`.
# A direct system call keeps the test independent of an external `kill` program.
libc = "0.2.189"
# Development only. `tests/purity.rs` reads the resolved dependency graph with
# it (R4).
cargo_metadata = { workspace = true }

[lints]
workspace = true
