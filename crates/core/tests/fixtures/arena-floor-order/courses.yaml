# `top` grounds on `mid`, which has order 2, while `base` has order 1. The floor
# of `top` is therefore the union of every course with order at or below 2
# (parity trap 12), not the topics of `mid` alone.
courses:
  - id: base
    name: Base course
    order: 1
  - id: mid
    name: Mid course
    order: 2
  - id: top
    name: Top course
    order: 3
    mastery_floor_course: mid
