[package]
name = "cadus-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cadus_core"
path = "src/lib.rs"

# R3 core purity. Keep this list at num-bigint, num-integer, num-rational,
# num-traits, serde, serde_json, serde_norway, sha2, and thiserror.
# `crates/core/tests/purity.rs` asserts the exact key set.
#
# `serde_norway` is the one YAML crate of the core: a maintained fork of the
# archived `serde_yaml`. It keeps mapping order in `Value`, and its derive support
# honors `#[serde(deny_unknown_fields)]`, which the curriculum schema needs.
#
# `num-bigint`, `num-integer`, `num-rational`, and `num-traits` give the exact
# arithmetic of the answer checker (M2, D6). They compute with big integers and
# big rationals and nothing else, so they keep the core pure.
#
# `sha2` gives the SHA-256 of the canonical dump, which is the curriculum hash
# (M1 U4, spec section 3). It computes a digest and nothing else, so it keeps the
# core pure: no network, no database, no model call.
[dependencies]
num-bigint = { workspace = true }
num-integer = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
