[package]
name = "cadus-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cadus_core"
path = "src/lib.rs"

# R3 core purity. Keep this list at chrono, chrono-tz, indexmap, num-bigint,
# num-integer, num-rational, num-traits, serde, serde_json, serde_norway, sha1,
# sha2, and thiserror. `crates/core/tests/purity.rs` asserts the exact key set.
#
# `serde_norway` is the one YAML crate of the core: a maintained fork of the
# archived `serde_yaml`. It keeps mapping order in `Value`, and its derive support
# honors `#[serde(deny_unknown_fields)]`, which the curriculum schema needs.
#
# `num-bigint`, `num-integer`, `num-rational`, and `num-traits` give the exact
# arithmetic of the answer checker (M2, D6). They compute with big integers and
# big rationals and nothing else, so they keep the core pure.
#
# `sha2` gives the SHA-256 of the canonical dump, which is the curriculum hash
# (M1 U4, spec section 3), and the SHA-256 of the config preimage, which is
# `config_hash` (M3 U1, spec trap T16). `sha1` gives `problem_text_hash` (spec
# trap T17). Both compute a digest and nothing else, so they keep the core pure:
# no network, no database, no model call.
#
# `chrono` and `chrono-tz` give the M3 time math. The core never reads a clock:
# `now` is an explicit parameter, and every instant is UTC microseconds. The
# time-zone database is compiled into `chrono-tz`, so `local_day` opens no file.
#
# `indexmap` gives the insertion-ordered map that spec trap T6 needs, where 1.0
# relies on Python dict order.
#
# `rand_chacha` and `rand_core` give the seeded draws of the template
# instantiator (M4 U1, D-O4). Both drop their default features, so `getrandom`
# and the operating-system entropy path stay out of the core: the caller passes
# a `u64` seed and the core computes from it and nothing else (R3).
[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
indexmap = { workspace = true }
num-bigint = { workspace = true }
num-integer = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
