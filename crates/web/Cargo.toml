[package]
name = "cadus-web"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cadus_web"
path = "src/lib.rs"

[[bin]]
name = "cadus-web"
path = "src/bin/cadus-web.rs"

[dependencies]
cadus-core = { workspace = true }
cadus-store = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
# M5 U6. The D-S6 document and the `?scope=` query derive their readers and
# writers with it. `serde_json` already resolves the same version, so the lock
# file gains no crate; the edge is new and `tests/purity.rs` pins it.
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The M5 U2 auth primitives (`src/auth/`). Every one is local CPU work, so it
# holds the R4 rule: the handler tier does local work and database I/O only.
argon2 = { workspace = true }
base64ct = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
unicode-normalization = { workspace = true }
# M5 U9. `BroadcastStream` adapts the diagnosis hub onto the `Stream` that
# `axum::response::sse::Sse` takes. It is a stream adapter: no network of its
# own, so it holds the R4 rule.
tokio-stream = { workspace = true }

# The HTTP tests drive the router in process and start the binary as a child
# process. `test-support` gives them a throwaway database.
[dev-dependencies]
cadus-store = { workspace = true, features = ["test-support"] }
tower = { workspace = true }
http-body-util = { workspace = true }
# Development only. `tests/purity.rs` reads the resolved dependency graph with
# it (R4).
cargo_metadata = { workspace = true }

[lints]
workspace = true
