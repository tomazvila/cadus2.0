[package]
name = "cadus-web"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cadus_web"
path = "src/lib.rs"

[[bin]]
name = "cadus-web"
path = "src/bin/cadus-web.rs"

[dependencies]
cadus-core = { workspace = true }
cadus-store = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The HTTP tests drive the router in process and start the binary as a child
# process. `test-support` gives them a throwaway database.
[dev-dependencies]
cadus-store = { workspace = true, features = ["test-support"] }
tower = { workspace = true }
http-body-util = { workspace = true }

[lints]
workspace = true
