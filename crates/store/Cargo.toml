[package]
name = "cadus-store"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cadus_store"
path = "src/lib.rs"

[[bin]]
name = "cadus-migrate"
path = "src/bin/cadus-migrate/main.rs"

[dependencies]
cadus-core = { workspace = true }
# M5 U6. `events.payload`, `learner_models.model`, and the D-S6 `web_states.doc`
# are jsonb columns, so the store reads and writes them as `serde_json::Value`.
# sqlx already resolves the same version for its `json` feature, so the lock file
# gains no crate; the edge is new and `tests/purity.rs` pins it.
serde_json = { workspace = true }
# M5 U9. `diagnosis::JobPayload` is the document the grade transaction writes and
# the worker claim reads, so it derives its reader and its writer. sqlx already
# resolves the same version, so the lock file gains no crate.
serde = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# `test-support` gates the throwaway-database helper. Production builds leave it
# off, so no test code enters the runtime binaries.
[features]
test-support = []

# The crate enables its own feature for its tests, so `tests/rls.rs` sees
# `cadus_store::test_support`.
[dev-dependencies]
cadus-store = { path = ".", features = ["test-support"] }
# Development only. `tests/purity.rs` reads the resolved dependency graph with
# it (R4).
cargo_metadata = { workspace = true }

[lints]
workspace = true
