# Cadus 2.0 -- self-host stack for ONE server (C3, R4, D9). No cloud vendor, no
# managed service. Bring it up with:
#
#   cp .env.example .env      # set SITE_ADDRESS and the three passwords
#   docker compose up -d --build
#
# That command is for the FIRST bring-up only. To upgrade a stack that already
# serves traffic, run `scripts/deploy.sh`. `docker compose up -d` recreates
# `web` and `worker` BEFORE it runs `migrate`, so a migration that fails leaves
# the site down with no running container to fall back on (finding #16).
#
# See docs/SELF_HOST.md.

name: cadus2

# ONE image, three commands. `migrate`, `web`, and `worker` all build from this
# block, so the three processes always run the same commit.
x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile

services:
  # Postgres -- the system of record. It has no `ports:` and it sits on the
  # `backend` network only, so Caddy has no route to it.
  #
  # Every role needs a password. `POSTGRES_HOST_AUTH_METHOD: trust` is absent on
  # purpose: trust auth accepts every process that reaches the port, and a
  # container network is not an authentication boundary. Under trust auth, any
  # other container on `backend` and any host user who reaches the container IP
  # connects as the superuser.
  #
  # WARNING: Do not rotate POSTGRES_PASSWORD in `.env` alone. The value is
  # write-once. The `postgres:16` image reads it at initdb only, that is on the
  # first start with an empty `db-data` volume. On a volume that already holds a
  # database the container ignores a new value, but
  # compose still writes the new value into the `migrate` DSN below. A rotation
  # of POSTGRES_PASSWORD in `.env` alone therefore recreates `web` and `worker`,
  # stops `migrate` with `password authentication failed for user "postgres"`,
  # and leaves the site down (finding #13). The two runtime passwords are NOT
  # write-once: `cadus-migrate --admin-login` writes CADUS_APP_PASSWORD and
  # CADUS_ADMIN_PASSWORD into the roles on every bring-up.
  #
  # To rotate POSTGRES_PASSWORD, change the role first and `.env` second:
  #
  #   docker compose exec db psql -U postgres -c "ALTER ROLE postgres PASSWORD '<new>'"
  #   # put the same <new> value into .env
  #   scripts/deploy.sh
  #
  # `docs/SELF_HOST.md`, section "Rotate a password", holds the full procedure
  # and the recovery for a rotation that was done in the wrong order. Never run
  # `docker compose down -v` to recover: that command destroys `db-data` and
  # every learner row with it.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cadus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - run openssl rand -hex 24}
    volumes:
      - db-data:/var/lib/postgresql/data
    # The probe goes over TCP (`-h 127.0.0.1`), because TCP is what the other
    # containers use. Without `-h`, pg_isready takes the unix socket in
    # /var/run/postgresql. The `postgres:16` entrypoint runs its initdb temp
    # server with `listen_addresses=''`, so that socket answers while port 5432
    # still refuses every connection: Docker marked `db` healthy, `migrate`
    # started, and the one-shot died with `pool timed out while waiting for an
    # open connection` (finding #15). The TCP probe cannot see the temp server.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cadus"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  # One-shot: apply migrations/, set the two role passwords, then give the admin
  # role a login.
  #
  # `cadus-migrate --admin-login` does the three steps in one process. It reads
  # DATABASE_URL and applies every pending migration. It reads
  # CADUS_APP_PASSWORD and CADUS_ADMIN_PASSWORD and runs `ALTER ROLE ...
  # PASSWORD` for cadus_app and for cadus_admin. It then runs `ALTER ROLE
  # cadus_admin LOGIN`. Migration 0001 creates cadus_admin as NOLOGIN, because a
  # BYPASSRLS role with a login is a deployment decision, not a schema fact.
  # The `worker` service connects as that role, so the deployment grants the
  # login here. A migration holds no password, because a password is deployment
  # state. Every step is idempotent, so a re-run is a no-op. The flag replaces a
  # psql call, so the image carries no database client.
  #
  # The DSN is the Postgres superuser: only a superuser creates roles, installs
  # citext, and alters a role.
  #
  # DB_STATEMENT_TIMEOUT_MS is absent from the block below on purpose.
  # `cadus-migrate` always runs without a statement bound: a migration takes as
  # long as it takes. A 5 s bound cancelled a slow CREATE INDEX or a DDL
  # statement that waited for a lock, exited the one-shot 2, and left `web` and
  # `worker` in `Created` with no operator knob to raise it (finding #1). The
  # bound applies to the `web` and `worker` pools only.
  migrate:
    <<: *app-image
    command: ["cadus-migrate", "--admin-login"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cadus
      # Database in which cadus-migrate takes the cluster-wide role lock.
      # The official image always creates `postgres`.
      CADUS_MAINTENANCE_DB: ${CADUS_MAINTENANCE_DB:-postgres}
      CADUS_APP_PASSWORD: ${CADUS_APP_PASSWORD:?set CADUS_APP_PASSWORD in .env - run openssl rand -hex 24}
      CADUS_ADMIN_PASSWORD: ${CADUS_ADMIN_PASSWORD:?set CADUS_ADMIN_PASSWORD in .env - run openssl rand -hex 24}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  # The HTTP tutor. It connects as cadus_app: NOSUPERUSER, NOBYPASSRLS, and
  # denied UPDATE/DELETE on `events`. RLS isolates the tenants (C3), and the
  # boot guard refuses a DSN whose role bypasses RLS.
  #
  # No `ports:` -- Caddy is the only ingress. The service is on both networks:
  # `frontend` to take traffic from Caddy, `backend` to reach the database.
  #
  # No `healthcheck:` -- the runtime image carries no curl and no wget, and the
  # image stays small. `docker compose logs web` prints the literal line
  # `cadus-web: listening on <address>` when the server is up, so
  # `docker compose logs web | grep 'listening on'` is the check. The end-to-end
  # check runs from the host through Caddy with
  # `curl -fsS http://localhost/api/health`.
  web:
    <<: *app-image
    command: ["cadus-web"]
    environment:
      DATABASE_URL: postgresql://cadus_app:${CADUS_APP_PASSWORD:?set CADUS_APP_PASSWORD in .env}@db:5432/cadus
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
      # cadus-web drains open connections for this long after SIGTERM, then exits 0.
      # This is ONE budget for the whole stop: the drain gets it, and the pool
      # close gets what is left of it, at least 1 s.
      SHUTDOWN_DEADLINE_SECS: ${SHUTDOWN_DEADLINE_SECS:-10}
      # Bound on every query of the pool, in milliseconds (0 = none).
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      # Client-side bound on every query, in milliseconds (0 = none). The
      # server-side bound above cancels a statement that RUNS too long. This
      # one bounds the whole call in the client, so a socket that a firewall
      # drops silently also ends. Keep it above DB_STATEMENT_TIMEOUT_MS, so the
      # server reports the timeout first and the client bound stays the backstop.
      DB_CLIENT_TIMEOUT_MS: ${DB_CLIENT_TIMEOUT_MS:-10000}
      # The origin the CSRF layer compares the browser's `Origin` header
      # against, as scheme://host. Set it in .env on every deployment behind
      # Caddy. Unset, the layer rebuilds the origin from X-Forwarded-Proto and
      # Host, and a proxy that stops sending X-Forwarded-Proto then makes every
      # browser write answer 403 cross_origin_rejected (1.0 trap W10).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # 0 (the default) serves the `__Host-cadus_session` cookie with Secure.
      # 1 serves the plain `cadus_session` cookie for local http:// only.
      CADUS_WEB_INSECURE_COOKIE: ${CADUS_WEB_INSECURE_COOKIE:-0}
      # The curriculum tree the dashboard, the graph, and the session plan
      # compose against (M5 U6, C5). The image carries it at /app/curriculum,
      # and cadus-web exits 2 when the tree does not load. Point this at a bind
      # mount to run a tree the image does not carry.
      CADUS_CURRICULUM: ${CADUS_CURRICULUM:-/app/curriculum}
      # The Argon2id parameter profile of the password hash. `prod` (the
      # default) is 3 passes over 65536 KiB with 4 lanes. `test` is a CHEAP
      # hash for a test run and never for a deployment.
      CADUS_AUTH_ARGON2_PROFILE: ${CADUS_AUTH_ARGON2_PROFILE:-prod}
      # OAuth sign-in (M5 U5). A provider is served only when both halves are
      # set AND the build installs a provider transport. This build installs
      # none, so /api/auth/oauth answers 404 and these five keys are inert.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      # The external origin of the callback URL, as scheme://host. Unset, the
      # service rebuilds it from X-Forwarded-Proto and Host.
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-}
    # Longer than the stop budget, so the process exits by itself and Docker
    # never has to send SIGKILL (exit 137). Total stop time
    # <= SHUTDOWN_DEADLINE_SECS + 1 s < stop_grace_period 20 s. The old code
    # spent the deadline twice and took 20.01 s at the default of 10 s, so the
    # container ended with exit 137 on every restart (finding #7).
    stop_grace_period: 20s
    # `migrate` must exit 0 before this service starts, so the schema is never
    # behind the code.
    #
    # WARNING: On an existing stack, do NOT upgrade with `docker compose up -d`.
    # Compose creates every container first and starts them second, so it
    # destroys the serving `web` and `worker` BEFORE `migrate` runs. A migration
    # that then fails leaves both in `Created`; `restart: unless-stopped` never
    # fires, because Docker never started them, and the site stays down
    # (finding #16). Use `scripts/deploy.sh`: it runs `migrate` first and starts
    # the new containers only after the one-shot exits 0.
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [frontend, backend]
    restart: unless-stopped

  # The async layer (R4): model calls and cross-tenant sweeps run here, never on
  # a request path. It connects as cadus_admin, which holds BYPASSRLS for the
  # cross-tenant scan. In M0 the process holds BYPASSRLS for its whole life.
  # `backend` only -- the worker takes no inbound traffic.
  worker:
    <<: *app-image
    command: ["cadus-worker"]
    environment:
      DATABASE_URL: postgresql://cadus_admin:${CADUS_ADMIN_PASSWORD:?set CADUS_ADMIN_PASSWORD in .env}@db:5432/cadus
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      # Client-side bound on every query, in milliseconds (0 = none). See the
      # `web` service above.
      DB_CLIENT_TIMEOUT_MS: ${DB_CLIENT_TIMEOUT_MS:-10000}
      # The curriculum tree the pool refill reads (D-O4, A6). The image carries
      # it at /app/curriculum, and the worker exits 2 when the tree does not
      # load. Point this at a bind mount to run a tree the image does not carry.
      CADUS_CURRICULUM: ${CADUS_CURRICULUM:-/app/curriculum}
      RUST_LOG: ${RUST_LOG:-info}
      # The seven variables of the A4 diagnosis job (M5 U10, T4, T5). They are
      # on THIS service and on no other: a model call runs in cadus-worker and
      # never on a request path (R4, L6). Compose reads `.env` for
      # interpolation only, so a key that no `environment:` block names never
      # reaches a container. Before these seven lines, the worker read an empty
      # key, built no diagnosis job, and left the queue standing for ever
      # (M5 review finding F8).
      #
      # Every reader takes a blank value as "absent" and applies the default in
      # the table of `docs/SELF_HOST.md`, section "The seven variables". An
      # empty OPENAI_API_KEY, which is what an operator who set nothing gets,
      # is the documented "call no model" deployment: the worker runs the pool
      # refill, and every learner keeps the deterministic verdict, the worked
      # solution and the re-solve instruction (A3, L2).
      #
      # OPENAI_API_KEY is the switch. A key that IS set makes the other six
      # binding, and a bad one exits the worker 2.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The endpoint. Blank means https://openrouter.ai/api/v1 (O2). A local
      # OpenAI-compatible server is the same code path.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # The model id the request names. Blank means deepseek/deepseek-v4-pro (O2).
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # The comma-separated provider order (T5). It applies to an openrouter.ai
      # endpoint, and an empty list on that endpoint exits the worker 2.
      OPENROUTER_PROVIDER_ORDER: ${OPENROUTER_PROVIDER_ORDER:-}
      # The output ceiling of one call. Blank means 600. It bounds the latency;
      # it is not a spend cap.
      DIAGNOSIS_OUTPUT_TOKENS: ${DIAGNOSIS_OUTPUT_TOKENS:-}
      # The reasoning ceiling of one call (T5). Blank means 600.
      DIAGNOSIS_REASONING_MAX_TOKENS: ${DIAGNOSIS_REASONING_MAX_TOKENS:-}
      # The T4 call cap per session. Blank means 0, and 0 is unlimited (O2).
      DIAGNOSIS_CALLS_PER_SESSION: ${DIAGNOSIS_CALLS_PER_SESSION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    restart: unless-stopped

  # Reverse proxy and automatic HTTPS. Put a real domain in SITE_ADDRESS and
  # Caddy fetches a Let's Encrypt certificate by itself. It needs ports 80 and
  # 443 open and the DNS record pointed at this server.
  # `frontend` only -- Caddy reaches `web` and has no route to `db`.
  #
  # `:?` makes an unset SITE_ADDRESS fail the whole compose command with the
  # message below, exactly as 1.0 does. A default of `:80` is worse: it turns a
  # forgotten .env into a silent http-only site on a domain that the operator
  # believes is on HTTPS. Fail loudly instead.
  #
  # CADDY_HTTP_PORT and CADDY_HTTPS_PORT set the HOST ports only. The defaults
  # are the real ports 80 and 443, which Let's Encrypt needs. Change them when
  # another stack already holds 80 and 443 on this box, for example in a test
  # bring-up beside a live site. Caddy keeps ports 80 and 443 inside the
  # container, so the Caddyfile and SITE_ADDRESS stay the same. A moved port
  # reaches no ACME server: set SITE_ADDRESS=:80 for such a bring-up.
  caddy:
    image: caddy:2
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env - your domain, or :80 for http-only}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks: [frontend]
    restart: unless-stopped

# Two segments. `frontend` (caddy <-> web) is the only path the internet-facing
# proxy sees. `backend` (migrate/web/worker <-> db) carries the database traffic
# and is unreachable from caddy. Every DSN on it carries a password, so the
# network segment is a second control and not the only one.
networks:
  frontend:
  backend:

volumes:
  db-data:
  caddy-data:
  caddy-config:
