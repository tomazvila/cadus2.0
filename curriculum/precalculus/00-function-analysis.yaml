unit: function-analysis
course: precalculus
module: "Function Analysis & Transformations"
topics:
  - id: function-transformations-shifts
    name: Vertical and Horizontal Shifts
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: function-notation
        weight: 0.7
        key: true
      - id: quadratic-graphs-vertex
        weight: 0.5
        key: true
      - id: domain-range
        weight: 0.3
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Vertical shifts
        key_prerequisites: [function-notation]
        constraints: "parent functions x^2, x^3, sqrt(x), |x| or a given polynomial; integer shifts; at least two word problems where a constant is added to or subtracted from a model"
        visuals: [{"kind":"coordinate","x_min":"-1","x_max":"6","y_min":"-1","y_max":"6","x_tick":"1","y_tick":"1","points":[{"x":"4","y":"1","label":"start"},{"x":"4","y":"4","label":"end"}],"segments":[{"from":{"x":"4","y":"1","label":null},"to":{"x":"4","y":"4","label":null}}],"caption":"A point that moves straight up along a vertical segment"}]
        exemplars:
          - problem: 'The graph of $y = x^2$ is shifted up $3$ units. What is the equation of the new graph?'
            answer: 'y = x^2 + 3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Moving a graph up $3$ units adds $3$ to every output. So the new equation is $y = x^2 + 3$.'
          - problem: 'The graph of $y = \sqrt{x}$ is moved down $4$ units. What is the equation of the new graph?'
            answer: 'y = sqrt(x) - 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Moving a graph down $4$ units subtracts $4$ from every output. So the new equation is $y = \sqrt{x} - 4$.'
          - problem: 'A tunnel arch has the profile $y = 9 - x^2$, where $x$ and $y$ are in metres. The whole arch is raised by $2$ m. What is the equation of the raised arch?'
            answer: 'y = 11 - x^2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Raising the arch by $2$ m adds $2$ to every height. So the new profile is $y = 9 - x^2 + 2 = 11 - x^2$.'
          - problem: 'The point $(2, 5)$ lies on the graph of $y = f(x)$. What point lies on the graph of $y = f(x) - 3$?'
            answer: '(2, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Subtracting $3$ lowers every output by $3$ and leaves the input alone. So $(2, 5)$ moves to $(2, 2)$.'
          - problem: 'Move the graph of $y = x^3$ down $4$ units. What is the equation of the new graph?'
            answer: 'y = x^3 - 4'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Down means every output gets smaller, so $4$ is subtracted. The equation is $y = x^3 - 4$.'
          - problem: 'A food truck''s daily profit in dollars from selling $x$ meals is $P(x) = 12x - 0.1x^2$. A new permit costs $40$ dollars each day. What is the new profit function $Q(x)$?'
            answer: 'Q(x) = 12x - 0.1x^2 - 40'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The permit lowers the profit by $40$ dollars for every number of meals. So $Q(x) = P(x) - 40 = 12x - 0.1x^2 - 40$.'
          - problem: 'The graph of $y = f(x)$ is shifted down $5$ units, and the new graph is $y = x^3 - 2x - 5$. What is the equation of the original graph?'
            answer: 'y = x^3 - 2x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The shift subtracted $5$ from $f(x)$, so adding $5$ undoes it. Then $f(x) = x^3 - 2x - 5 + 5 = x^3 - 2x$.'
          - problem: 'The graph of $y = |x| - 6$ is the graph of $y = |x|$ moved in which direction, up or down?'
            answer: 'down'
            answer_contract: {"kind": "label", "options": [["down", "downward", "downwards", "moved down", "it is moved down", "shifted down", "it moves down", "moves down"], ["up", "upward", "upwards", "moved up", "it is moved up", "shifted up", "it moves up", "moves up"]]}
            solution_sketch: 'The constant $-6$ is added to every output of $|x|$, so every output is smaller. Every point of $y = |x|$ moves down $6$ units.'
      - id: kp2
        name: Horizontal shifts
        key_prerequisites: [function-notation, quadratic-graphs-vertex]
        constraints: "emphasize the sign flip: f(x - h) moves right h; parent functions x^2, x^3, sqrt(x) or a given line; at least two word problems where one process starts later"
        try_first:
          problem: 'At which value of $x$ does $(x - 3)^2$ take its smallest value?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'A square is smallest when its bracket is zero, and $x - 3 = 0$ at $x = 3$. So the graph of $y = (x - 3)^2$ has its lowest point at $x = 3$: the graph of $y = x^2$ has moved right $3$ units, not left.'
        visuals: [{"kind":"coordinate","x_min":"-1","x_max":"7","y_min":"-1","y_max":"5","x_tick":"1","y_tick":"1","points":[{"x":"1","y":"2","label":"start"},{"x":"5","y":"2","label":"end"}],"segments":[{"from":{"x":"1","y":"2","label":null},"to":{"x":"5","y":"2","label":null}}],"caption":"A point that moves straight right along a horizontal segment"}]
        exemplars:
          - problem: 'The graph of $y = x^2$ is shifted right $2$ units. What is the equation of the new graph?'
            answer: 'y = (x - 2)^2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A shift right by $2$ units replaces $x$ with $x - 2$. So the new equation is $y = (x - 2)^2$.'
          - problem: 'The graph of $y = \sqrt{x}$ is shifted left $5$ units. What is the equation of the new graph?'
            answer: 'y = sqrt(x + 5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A shift left by $5$ units replaces $x$ with $x + 5$. So the new equation is $y = \sqrt{x + 5}$.'
          - problem: 'Move the graph of $y = x^3$ left $4$ units. What is the equation of the new graph?'
            answer: 'y = (x + 4)^3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The new graph must take at $x = -4$ the value the old graph took at $x = 0$, so the bracket is $x + 4$. The equation is $y = (x + 4)^3$.'
          - problem: 'A sensor records the signal $y = \sqrt{t}$, where $t$ is the time in seconds since it was switched on. A second sensor records the same signal but is switched on $5$ s later. What equation describes the second sensor?'
            answer: 'y = sqrt(t - 5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second sensor shows at time $t$ what the first showed $5$ s earlier, so $t$ is replaced by $t - 5$. The equation is $y = \sqrt{t - 5}$.'
          - problem: 'The point $(2, 5)$ lies on the graph of $y = f(x)$. What point lies on the graph of $y = f(x - 4)$?'
            answer: '(6, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The output $5$ now appears where $x - 4 = 2$, which is $x = 6$. So the point is $(6, 5)$.'
          - problem: 'The graph of $y = f(x)$ is shifted right $2$ units, and the new graph is $y = (x - 2)^2 + 3(x - 2)$. What is the equation of the original graph?'
            answer: 'y = x^2 + 3x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Shifting right by $2$ replaced each $x$ in $f(x)$ with $x - 2$. So $f(x)$ is the same expression with plain $x$, which is $x^2 + 3x$.'
          - problem: 'The line $y = 2x + 1$ is shifted left $3$ units. What is the equation of the new line?'
            answer: 'y = 2x + 7'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A shift left by $3$ units replaces $x$ with $x + 3$. So $y = 2(x + 3) + 1 = 2x + 7$.'
          - problem: 'A bus leaves the depot at time $t = 0$ h, and its distance from the depot is $y = 40t$ km. A second bus follows the same route at the same speed but leaves $2$ h later. What is the equation of the distance of the second bus?'
            answer: 'y = 40t - 80'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'At time $t$ the second bus has driven for $t - 2$ hours, so $t$ is replaced by $t - 2$. Then $y = 40(t - 2) = 40t - 80$.'
          - problem: 'The graph of $y = \sqrt{x - 6}$ is the graph of $y = \sqrt{x}$ moved in which direction, left or right?'
            answer: 'right'
            answer_contract: {"kind": "label", "options": [["right", "to the right", "moved right", "it is moved right", "rightward", "shifted right", "it moves right", "moves right"], ["left", "to the left", "moved left", "it is moved left", "leftward", "shifted left", "it moves left", "moves left"]]}
            solution_sketch: 'The graph of $y = \sqrt{x - 6}$ starts where $x - 6 = 0$, at $x = 6$, while $y = \sqrt{x}$ starts at $x = 0$. So every point moves $6$ units to the right.'
      - id: kp3
        name: Combined shifts and locating the new vertex
        key_prerequisites: [quadratic-graphs-vertex]
        constraints: "combine one horizontal and one vertical shift of x^2, x^3, or sqrt(x); integer shifts; vertex questions read (h, k) off vertex form; at least two word problems with a position on a grid"
        visuals: [{"kind":"curve","x_min":"-3","x_max":"5","y_min":"-3","y_max":"5","x_tick":"1","y_tick":"1","curve":{"family":"polynomial","coefficients":["-1","-2","1"]},"key_points":[{"x":"1","y":"-2","label":"vertex"}],"asymptotes":[],"caption":"A parabola with its lowest point shifted away from the origin"}]
        exemplars:
          - problem: 'The graph of $y = x^2$ is shifted right $3$ units and up $4$ units. What is the equation of the new graph?'
            answer: 'y = (x - 3)^2 + 4'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Right $3$ replaces $x$ with $x - 3$, and up $4$ adds $4$ to every output. So the equation is $y = (x - 3)^2 + 4$.'
          - problem: 'What is the vertex of $y = (x + 4)^2 - 1$?'
            answer: '(-4, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The bracket $x + 4$ is zero at $x = -4$, and the outside constant is $-1$. So the vertex is $(-4, -1)$.'
          - problem: 'The graph of $y = x^3$ is shifted right $3$ units and up $2$ units. What is the equation of the new graph?'
            answer: 'y = (x - 3)^3 + 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Right $3$ replaces $x$ with $x - 3$ inside the cube. Up $2$ adds $2$ outside it, so $y = (x - 3)^3 + 2$.'
          - problem: 'The graph of $y = \sqrt{x}$ is shifted left $5$ units and down $2$ units. What is the equation of the new graph?'
            answer: 'y = sqrt(x + 5) - 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Left $5$ replaces $x$ with $x + 5$ inside the root. Down $2$ subtracts $2$ outside it, so $y = \sqrt{x + 5} - 2$.'
          - problem: 'A parabolic arch has the profile $y = 4 - x^2$, where $x$ and $y$ are in metres. The arch is moved $6$ m to the right and stood on a $1$ m platform. What is the equation of the moved arch?'
            answer: 'y = 5 - (x - 6)^2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Moving $6$ m right replaces $x$ with $x - 6$, and the platform adds $1$ to every height. So $y = 4 - (x - 6)^2 + 1 = 5 - (x - 6)^2$.'
          - problem: 'The graph of $y = \sqrt{x}$ is shifted right $2$ units and down $3$ units. At which value of $x$ does the new graph cross the $x$-axis?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new equation is $y = \sqrt{x - 2} - 3$. Setting $y = 0$ gives $\sqrt{x - 2} = 3$, so $x - 2 = 9$ and $x = 11$.'
          - problem: 'The graph of $y = x^2$ is shifted right $5$ units and down $9$ units. At which values of $x$ does the new graph cross the $x$-axis?'
            answer: '2, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new equation is $y = (x - 5)^2 - 9$. Setting $y = 0$ gives $(x - 5)^2 = 9$, so $x - 5 = 3$ or $x - 5 = -3$, which gives $x = 8$ or $x = 2$.'
          - problem: 'A shift moves the vertex of $y = x^2$ to the point $(-4, 7)$. What is the equation of the shifted graph?'
            answer: 'y = (x + 4)^2 + 7'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The vertex $(0, 0)$ moves $4$ units left and $7$ units up. So the equation is $y = (x + 4)^2 + 7$.'
          - problem: 'The point $(1, 3)$ lies on the graph of $y = f(x)$. What point lies on the graph of $y = f(x + 2) - 4$?'
            answer: '(-1, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The input must satisfy $x + 2 = 1$, so $x = -1$. The output is $3 - 4 = -1$, so the point is $(-1, -1)$.'
          - problem: 'On a map grid, an old road follows $y = \sqrt{x}$, with $x$ and $y$ in kilometres east and north. A new road has the same shape but lies $3$ km further east and $2$ km further south. What is the equation of the new road?'
            answer: 'y = sqrt(x - 3) - 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Moving $3$ km east replaces $x$ with $x - 3$, and moving $2$ km south subtracts $2$ from $y$. So the equation is $y = \sqrt{x - 3} - 2$.'
    diagnostic_exemplar:
      problem: 'The graph of $y = x^2$ is shifted right $4$ units and down $1$ unit. What is the equation of the new graph?'
      answer: 'y = (x - 4)^2 - 1'
      answer_contract: {"kind": "polynomial_relation"}
      solution_sketch: 'A horizontal shift acts inside with the opposite sign — right $4$ replaces $x$ by $x - 4$ — while a vertical shift acts outside with its own sign.'
    anki_seeds:
      - front: "The graph of f(x - h) moves the graph of f in which direction?"
        back: "Right by h (subtracting inside shifts right)."
        type: basic

  - id: function-stretches-reflections
    name: Stretches, Compressions, and Reflections
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: function-transformations-shifts
        weight: 0.7
        key: true
      - id: function-notation
        weight: 0.4
        key: true
      - id: quadratic-graphs-vertex
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Vertical stretches and compressions
        key_prerequisites: [function-notation]
        constraints: "stretch factors 2-5 or 1/2, 1/3, 1/4; track a labeled point in both directions; at least two word problems, one of them needing a division"
        visuals: [{"kind":"coordinate","x_min":"-1","x_max":"6","y_min":"-1","y_max":"6","x_tick":"1","y_tick":"1","points":[{"x":"4","y":"1","label":"before"},{"x":"4","y":"2","label":"after"}],"segments":[{"from":{"x":"4","y":"0","label":null},"to":{"x":"4","y":"2","label":null}}],"caption":"A point that moves farther from the horizontal axis when the graph stretches"}]
        exemplars:
          - problem: 'The graph of $y = x^2$ is stretched vertically by a factor of $3$. What is the equation of the new graph?'
            answer: 'y = 3x^2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A vertical stretch by a factor of $3$ multiplies every output by $3$ and leaves the inputs alone. So the new equation is $y = 3x^2$.'
          - problem: 'The point $(2, 4)$ lies on the graph of $y = f(x)$. What point lies on the graph of $y = 3f(x)$?'
            answer: '(2, 12)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The input $2$ is unchanged, and the output $4$ is multiplied by $3$. So the point is $(2, 12)$.'
          - problem: 'The graph of $y = x^3$ is compressed vertically by a factor of $\frac{1}{2}$. What is the equation of the new graph?'
            answer: 'y = x^3/2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A vertical compression by a factor of $\frac{1}{2}$ multiplies every output by $\frac{1}{2}$. So the new equation is $y = \frac{1}{2}x^3$, which is $y = x^3/2$.'
          - problem: 'The graph of $y = \sqrt{x}$ is compressed vertically by a factor of $\frac{1}{3}$. What is the equation of the new graph?'
            answer: 'y = sqrt(x)/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every output is multiplied by $\frac{1}{3}$, and the inputs stay the same. So the new equation is $y = \frac{\sqrt{x}}{3}$.'
          - problem: 'The brightness of a lamp along a corridor is $y = 12x - x^2$ at distance $x$ metres from the start. A dimmer cuts the brightness at every point to a quarter of its value. What is the equation of the dimmed brightness?'
            answer: 'y = 3x - x^2/4'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A quarter of every brightness means every output is multiplied by $\frac{1}{4}$, which is a division by $4$. So $y = \frac{12x - x^2}{4} = 3x - \frac{x^2}{4}$.'
          - problem: 'A designer makes a model of an arch with the profile $y = 4 - x^2$ three times as tall, with the same width. What is the equation of the taller arch?'
            answer: 'y = 12 - 3x^2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The same width means the inputs stay the same, and three times as tall means every output is multiplied by $3$. So $y = 3(4 - x^2) = 12 - 3x^2$.'
          - problem: 'The graph of $y = x^2$ is stretched vertically by some factor, and the new graph passes through $(3, 45)$. What is the equation of the new graph?'
            answer: 'y = 5x^2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The new equation has the form $y = kx^2$. At $x = 3$ the output is $45 = 9k$, so $k = 5$ and the equation is $y = 5x^2$.'
          - problem: 'The graph of $y = |x|$ is stretched vertically by a factor of $4$. What is the equation of the new graph?'
            answer: 'y = 4|x|'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A vertical stretch by a factor of $4$ multiplies every output by $4$. So the new equation is $y = 4|x|$.'
          - problem: 'The point $(6, -9)$ lies on the graph of $y = 3f(x)$. What point lies on the graph of $y = f(x)$?'
            answer: '(6, -3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The output $-9$ on $y = 3f(x)$ is three times the output of $f$. So $f(6) = -9 \div 3 = -3$, and the point is $(6, -3)$.'
      - id: kp2
        name: Reflections across the axes
        key_prerequisites: [function-notation]
        constraints: "-f(x) reflects across the x-axis; f(-x) across the y-axis; at least two word problems with a mirror image; radicals written as sqrt(...) in keys"
        visuals: [{"kind":"coordinate","x_min":"-4","x_max":"4","y_min":"-4","y_max":"4","x_tick":"1","y_tick":"1","points":[{"x":"2","y":"1","label":"original"},{"x":"2","y":"-1","label":"mirror image"}],"segments":[{"from":{"x":"2","y":"1","label":null},"to":{"x":"2","y":"-1","label":null}}],"caption":"Two points on opposite sides of the horizontal axis at equal distance"}]
        exemplars:
          - problem: 'The graph of $y = x^2$ is reflected across the $x$-axis. What is the equation of the new graph?'
            answer: 'y = -x^2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A reflection across the $x$-axis changes the sign of every output. So the new equation is $y = -x^2$.'
          - problem: 'The graph of $y = \sqrt{x}$ is reflected across the $y$-axis. What is the equation of the new graph?'
            answer: 'y = sqrt(-x)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A reflection across the $y$-axis replaces $x$ with $-x$. So the new equation is $y = \sqrt{-x}$.'
          - problem: 'The graph of $y = x^3 - x$ is reflected across the $x$-axis. What is the equation of the new graph?'
            answer: 'y = -x^3 + x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The sign of the whole function changes, so $y = -(x^3 - x)$. Removing the bracket gives $y = -x^3 + x$.'
          - problem: 'The graph of $y = x^3 + 2x^2$ is reflected across the $y$-axis. What is the equation of the new graph?'
            answer: 'y = -x^3 + 2x^2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Every $x$ is replaced with $-x$, so $y = (-x)^3 + 2(-x)^2$. Since $(-x)^3 = -x^3$ and $(-x)^2 = x^2$, this is $y = -x^3 + 2x^2$.'
          - problem: 'The point $(3, -2)$ lies on the graph of $y = f(x)$. What point lies on the graph of $y = -f(x)$?'
            answer: '(3, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The graph $y = -f(x)$ is the reflection of $y = f(x)$ across the $x$-axis. So the input $3$ stays and the output $-2$ changes sign, giving $(3, 2)$.'
          - problem: 'The point $(5, 4)$ lies on the graph of $y = f(x)$. What point lies on the graph of $y = f(-x)$?'
            answer: '(-5, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The graph $y = f(-x)$ is the reflection of $y = f(x)$ across the $y$-axis. So the output $4$ stays and the input $5$ changes sign, giving $(-5, 4)$.'
          - problem: 'The height of a hill above the road is $y = 8x - x^2$ metres at distance $x$ metres from the start. A pit of the same shape is dug in the ground: at each distance it goes as far below the road as the hill goes above it. If a height below the road is negative, what is the equation of the pit?'
            answer: 'y = x^2 - 8x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The pit is the mirror image of the hill in the road, so every height changes sign. So $y = -(8x - x^2) = x^2 - 8x$.'
          - problem: 'The right half of a symmetric vase has the profile $y = \sqrt{3x}$ for $x \ge 0$, where $x$ and $y$ are in centimetres. The left half is the mirror image of the right half in the $y$-axis. What is the equation of the left half?'
            answer: 'y = sqrt(-3x)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A mirror image in the $y$-axis replaces $x$ with $-x$. So the left half is $y = \sqrt{3(-x)} = \sqrt{-3x}$, for $x \le 0$.'
          - problem: 'Reflect the graph of $y = x^2 + 3x$ across the $x$-axis. What is the equation of the new graph?'
            answer: 'y = -x^2 - 3x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A reflection across the $x$-axis changes the sign of every term, not only the first. The term $3x$ changes sign too, so the equation is $y = -x^2 - 3x$.'
          - problem: 'The graph of $y = -\sqrt{x}$ is the graph of $y = \sqrt{x}$ reflected across which axis?'
            answer: 'x-axis'
            answer_contract: {"kind": "label", "options": [["x-axis", "the x-axis", "x axis", "across the x-axis", "the x axis", "across the x axis", "reflected across the x-axis", "reflection across the x-axis"], ["y-axis", "the y-axis", "y axis", "across the y-axis", "the y axis", "across the y axis", "reflected across the y-axis", "reflection across the y-axis"]]}
            solution_sketch: 'The outputs of $y = -\sqrt{x}$ are the negatives of the outputs of $y = \sqrt{x}$. Each point $(x, y)$ moves to $(x, -y)$, which is a reflection across the $x$-axis.'
      - id: kp3
        name: Combining stretch, reflection, and shift
        key_prerequisites: [function-transformations-shifts]
        constraints: "compose a stretch (factor 2-5), at most one reflection, and one shift; track a labeled point in either direction or write the equation; at least two word problems, one of them undoing a transformation"
        exemplars:
          - problem: 'The point $(2, 3)$ lies on the graph of $y = f(x)$. What point lies on the graph of $y = 4f(x) - 5$?'
            answer: '(2, 7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The input stays $2$. The output $3$ is multiplied by $4$ to give $12$, and then $5$ is subtracted, which gives $7$. So the point is $(2, 7)$.'
          - problem: 'The point $(4, 2)$ lies on the graph of $y = f(x)$. What point lies on the graph of $y = -2f(x) + 3$?'
            answer: '(4, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The input stays $4$. The output $2$ becomes $-2 \cdot 2 = -4$, and then $3$ is added, which gives $-1$. So the point is $(4, -1)$.'
          - problem: 'The point $(3, 4)$ lies on the graph of $y = f(x)$. What point lies on the graph of $y = -2f(x + 1) + 6$?'
            answer: '(2, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The input must satisfy $x + 1 = 3$, so $x = 2$. The output is $-2 \cdot 4 + 6 = -2$, so the point is $(2, -2)$.'
          - problem: 'The transformation $y = -3f(x - 2) + 5$ moves a point of the graph of $y = f(x)$ to the point $(4, -1)$. Which point of the graph of $y = f(x)$ was moved there?'
            answer: '(2, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A point $(a, b)$ of $y = f(x)$ moves to $(a + 2, -3b + 5)$. So $a + 2 = 4$ gives $a = 2$, and $-3b + 5 = -1$ gives $b = 2$.'
          - problem: 'The graph of $y = x^2$ is carried onto the graph of $y = -2(x - 1)^2$ by a shift, a vertical stretch and a reflection. Where does the point $(3, 9)$ of the first graph land?'
            answer: '(4, -18)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The bracket $(x - 1)$ shifts the graph right $1$, so $(3, 9)$ moves to $(4, 9)$. The factor $-2$ stretches by $2$ and reflects across the $x$-axis, so the $y$-coordinate $9$ becomes $-18$. The point is $(4, -18)$.'
          - problem: 'A designer starts from the curve $y = x^2$ for the profile of a ramp. She flips it upside down, makes it twice as steep (a vertical stretch by a factor of $2$) and raises it by $8$. What is the equation of the new curve?'
            answer: 'y = -2x^2 + 8'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Flipping upside down and stretching by $2$ turns $x^2$ into $-2x^2$. Raising by $8$ adds $8$ to every output, so $y = -2x^2 + 8$.'
          - problem: 'A water sensor reports $g(t) = 4f(t) + 10$, where $f(t)$ is the true water level in centimetres at time $t$. The sensor reports $g(2) = 34$. What is the true level $f(2)$?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The report is $4f(2) + 10 = 34$. Subtracting $10$ gives $4f(2) = 24$, and dividing by $4$ gives $f(2) = 6$ cm.'
          - problem: 'The point $(1, 4)$ lies on the graph of $y = f(x)$. The point $(1, -16)$ lies on the graph of $y = -af(x) + 4$, where $a$ is a positive number. What is $a$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 1$ the second graph gives $-a \cdot 4 + 4 = -16$. So $-4a = -20$, and $a = 5$.'
          - problem: 'The graph of $y = \sqrt{x}$ is shifted left $2$ units, then reflected across the $x$-axis, and then shifted up $1$ unit. What is the equation of the new graph?'
            answer: 'y = 1 - sqrt(x + 2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Left $2$ gives $y = \sqrt{x + 2}$. The reflection changes the sign to give $y = -\sqrt{x + 2}$, and up $1$ adds $1$, so $y = 1 - \sqrt{x + 2}$.'
    diagnostic_exemplar:
      problem: 'The point $(3, 5)$ lies on $y = f(x)$. What point lies on $y = -2f(x) + 1$?'
      answer: "(3, -9)"
      solution_sketch: 'Stretch by $2$ and reflect: $-2 \cdot 5 = -10$; then shift up $1$: $-9$. The $x$-coordinate is unchanged.'
    anki_seeds:
      - front: "y = f(-x) reflects the graph of f across which axis?"
        back: "The y-axis."
        type: basic

  - id: even-odd-functions
    name: Even and Odd Functions
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: function-notation
        weight: 0.6
        key: true
      - id: function-stretches-reflections
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.4
      - id: polynomial-addition-subtraction
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Test algebraically with f(-x)
        key_prerequisites: [function-notation, evaluating-expressions]
        constraints: "polynomials only; include a 'neither' case; at most two classification items; the item must test THIS KP: Test algebraically with f(-x); two short contexts where an input is the negative of another"
        try_first:
          problem: 'For $f(x) = x^2$, find $f(-3) - f(3)$.'
          answer_contract: {"kind": "exact"}
          answer: '0'
          reveal: 'Squaring removes the sign, so $f(-3) = f(3) = 9$ and the difference is $0$. A function with $f(-x) = f(x)$ for every $x$ is called even, and testing $f(-x)$ is how we decide.'
        exemplars:
          - problem: 'Is $f(x) = x^4 + 5x^2 + 1$ even, odd, or neither?'
            answer: 'even'
            answer_contract: {"kind": "label", "options": [["even", "it is even", "an even function", "is even"], ["odd", "it is odd", "an odd function", "is odd"], ["neither", "neither even nor odd", "it is neither", "not even or odd", "it is neither even nor odd"]]}
            solution_sketch: 'Substituting $-x$ gives $f(-x) = (-x)^4 + 5(-x)^2 + 1 = x^4 + 5x^2 + 1$, which equals $f(x)$. So $f$ is even, and its graph is symmetric about the $y$-axis.'
          - problem: 'For $h(x) = x^5 - 3x^3 + 2x$, find $h(-x)$.'
            answer: '-x^5 + 3x^3 - 2x'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $-x$ for $x$: $h(-x) = (-x)^5 - 3(-x)^3 + 2(-x)$. Odd powers keep the minus sign, so this is $-x^5 + 3x^3 - 2x$.'
          - problem: 'Is $g(x) = x^2 + x$ even, odd, or neither?'
            answer: 'neither'
            answer_contract: {"kind": "label", "options": [["even", "it is even", "an even function", "is even"], ["odd", "it is odd", "an odd function", "is odd"], ["neither", "neither even nor odd", "it is neither", "not even or odd", "it is neither even nor odd"]]}
            solution_sketch: 'Substituting $-x$ gives $g(-x) = x^2 - x$. This is not $g(x) = x^2 + x$, and it is not $-g(x) = -x^2 - x$ either. So $g$ is neither even nor odd.'
          - problem: 'For $f(x) = x^3 - 4x$, simplify $f(-x) + f(x)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting $-x$ gives $f(-x) = -x^3 + 4x$. Adding $f(x) = x^3 - 4x$ gives $0$, so $f(-x) = -f(x)$ and $f$ is odd.'
          - problem: 'For $f(x) = 2x^4 - 3x^3 + 7x^2 - x + 4$, what is the coefficient of $x^3$ in $f(-x)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting $-x$ gives $f(-x) = 2x^4 + 3x^3 + 7x^2 + x + 4$, because only the odd powers change sign. The term in $x^3$ is $3x^3$, so the coefficient is $3$.'
          - problem: 'A shop''s weekly profit in dollars is $P(x) = -10x^4 + 80x^2 + 30$, where $x$ is the change in the price in dollars (negative for a price cut). What is the weekly profit after a price cut of $2$ dollars?'
            answer: '190'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'A cut of $2$ dollars means $x = -2$. Only even powers occur, so $P(-2) = P(2) = -160 + 320 + 30 = 190$ dollars.'
          - problem: 'A slider on a rail is at the position $s(t) = t^3 - 9t$ centimetres from the centre mark at $t$ seconds after noon, where a negative $t$ means a time before noon. What is its position $2$ seconds before noon?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'Two seconds before noon means $t = -2$. Then $s(-2) = (-2)^3 - 9(-2) = -8 + 18 = 10$ cm.'
          - problem: 'For $g(x) = x^4 - 2x^3 + x$, find $g(-x)$.'
            answer: 'x^4 + 2x^3 - x'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $-x$ for $x$: $g(-x) = (-x)^4 - 2(-x)^3 + (-x) = x^4 + 2x^3 - x$. This is neither $g(x)$ nor $-g(x)$, so $g$ is neither even nor odd.'
          - problem: 'For which value of $k$ is $f(x) = x^3 + kx^2 + 5x$ an odd function?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting $-x$ gives $f(-x) = -x^3 + kx^2 - 5x$, and $-f(x) = -x^3 - kx^2 - 5x$. These agree only if $kx^2 = -kx^2$, so $k = 0$.'
      - id: kp2
        name: Symmetry and using known values
        key_prerequisites: [function-stretches-reflections]
        constraints: "symmetry named as y-axis (even) or origin (odd); known-value questions give f(a) for a small integer a and ask for f(-a); at least two word problems with a time or a distance on either side of zero"
        visuals: [{"kind":"curve","x_min":"-3","x_max":"3","y_min":"-4","y_max":"4","x_tick":"1","y_tick":"1","curve":{"family":"polynomial","coefficients":["0","-4","0","1"]},"key_points":[{"x":"1","y":"-3","label":null},{"x":"-1","y":"3","label":null}],"asymptotes":[],"caption":"A curve that matches itself after a half turn about the origin"}]
        exemplars:
          - problem: 'If $f$ is an odd function and $f(2) = 7$, what is $f(-2)$?'
            answer: '-7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An odd function satisfies $f(-x) = -f(x)$. So $f(-2) = -f(2) = -7$.'
          - problem: 'The function $f(x) = x^4 - 5x^2 + 2$ is even. Find $f(-3)$.'
            answer: '38'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An even function satisfies $f(-3) = f(3)$. Then $f(3) = 81 - 45 + 2 = 38$, so $f(-3) = 38$.'
          - problem: 'The function $f(x) = 2x^3 - 3x$ is odd. Find $f(-2)$.'
            answer: '-10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An odd function satisfies $f(-2) = -f(2)$. Then $f(2) = 16 - 6 = 10$, so $f(-2) = -10$.'
          - problem: 'The function $f(x) = 3x^4 - 2x^2 + 7$ is a polynomial. Is its graph symmetric about the $y$-axis, about the origin, about the $x$-axis, or none of these?'
            answer: 'y-axis'
            answer_contract: {"kind": "label", "options": [["y-axis", "the y-axis", "about the y-axis", "y axis", "symmetric about the y-axis", "the y axis", "about the y axis", "symmetric about the y axis"], ["origin", "the origin", "about the origin", "symmetric about the origin"], ["x-axis", "the x-axis", "about the x-axis", "x axis", "symmetric about the x-axis", "the x axis", "about the x axis", "symmetric about the x axis"], ["none", "none of these", "no symmetry", "none of them"]]}
            solution_sketch: 'All the powers are even, so $f(-x) = 3x^4 - 2x^2 + 7 = f(x)$. So $f$ is even and its graph is symmetric about the $y$-axis.'
          - problem: 'The odd function $g(x) = x^3 + kx$ satisfies $g(1) = 2$. Find $g(-3)$.'
            answer: '-30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $g(1) = 1 + k = 2$ we get $k = 1$, so $g(3) = 27 + 3 = 30$. An odd function has $g(-3) = -g(3) = -30$.'
          - problem: 'The even function $h$ satisfies $h(-1) = 4t - 2$ and $h(1) = t + 13$ for a constant $t$. Find $t$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An even function has $h(-1) = h(1)$, so $4t - 2 = t + 13$. Then $3t = 15$ and $t = 5$.'
          - problem: 'The difference between the temperature and the daily average is modelled by an odd function $D(t)$, where $t$ is the time in hours after noon (negative $t$ is before noon). At $3$ hours after noon the difference is $4$ degrees Celsius. What is the difference $3$ hours before noon?'
            answer: '-4'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "celsius", "allow_omitted": true}
            solution_sketch: 'Three hours before noon is $t = -3$. For an odd function $D(-3) = -D(3) = -4$ degrees Celsius.'
          - problem: 'The height of a suspension cable above the deck is an even function $h(x)$ of the distance $x$ from the central tower, in metres, with $x$ negative to the left. The cable is $12$ m above the deck at $30$ m to the right of the tower. How high is it $30$ m to the left of the tower?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Here $h(30) = 12$. An even function has $h(-30) = h(30)$, so the cable is $12$ m high on the left side too.'
          - problem: 'The graph of an odd function passes through the point $(4, -3)$. What other point must lie on the graph?'
            answer: '(-4, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'An odd function satisfies $f(-x) = -f(x)$. So the input $4$ becomes $-4$ and the output $-3$ becomes $3$, giving $(-4, 3)$.'
    diagnostic_exemplar:
      problem: 'An odd function $f$ has $f(3) = 7$. What is $f(-3)$?'
      answer_contract: {"kind":"exact"}
      answer: '-7'
      solution_sketch: 'For an odd function, $f(-x) = -f(x)$. So $f(-3) = -7$.'
    anki_seeds:
      - front: "Algebraic tests: f is even iff f(-x) = ...; f is odd iff f(-x) = ..."
        back: "even: f(-x) = f(x); odd: f(-x) = -f(x)"
        type: basic

  - id: piecewise-absolute-value-graphs
    name: Piecewise and Absolute-Value Functions
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: function-notation
        weight: 0.6
        key: true
      - id: graphing-linear-equations
        weight: 0.5
        key: true
      - id: absolute-value
        weight: 0.5
      - id: domain-range
        weight: 0.4
      - id: function-transformations-shifts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Evaluate a piecewise function
        key_prerequisites: [function-notation]
        constraints: "two or three linear/quadratic pieces; test inputs on both sides of each breakpoint and on it; at least two word problems with a rule that changes (one of them run backwards)"
        try_first:
          problem: 'A parking garage charges $3$ dollars per hour for a stay of up to $4$ hours and a flat $12$ dollars for a longer stay. What does a stay of $6$ hours cost?'
          answer_contract: {"kind": "exact"}
          answer: '12'
          reveal: 'The price follows one rule for short stays and another rule for long stays, and the length of the stay decides which rule applies. A piecewise function writes both rules together with the inputs each one covers.'
        exemplars:
          - problem: 'Let $f(x) = \begin{cases} x + 2 & x < 0 \\ x^2 & x \ge 0 \end{cases}$. Find $f(-3)$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $-3 < 0$, the first piece applies. So $f(-3) = -3 + 2 = -1$.'
          - problem: 'Let $f(x) = \begin{cases} 2x & x < 1 \\ 5 & x \ge 1 \end{cases}$. Find $f(1)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The input $1$ satisfies $x \ge 1$, so the second piece applies. That piece is the constant $5$, so $f(1) = 5$.'
          - problem: 'Let $f(x) = \begin{cases} 3x - 2 & x < 1 \\ x + 4 & x \ge 1 \end{cases}$. Find $f(-2)$.'
            answer: '-8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $-2 < 1$, the first piece applies. So $f(-2) = 3(-2) - 2 = -8$.'
          - problem: 'Let $f(x) = \begin{cases} x^2 + 1 & x < 0 \\ 2x + 3 & x \ge 0 \end{cases}$. Find $f(2)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $2 \ge 0$, the second piece applies. So $f(2) = 2(2) + 3 = 7$.'
          - problem: 'Let $f(x) = \begin{cases} x + 1 & x < -1 \\ x^2 & -1 \le x < 2 \\ 5 - x & x \ge 2 \end{cases}$. Find $f(-1)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The input $-1$ is not less than $-1$, but it satisfies $-1 \le x < 2$. So the middle piece applies and $f(-1) = (-1)^2 = 1$.'
          - problem: 'A gym charges $25$ dollars for a month with fewer than $10$ visits. With $10$ or more visits it charges $25$ dollars plus $3$ dollars for every visit after the tenth. What is the charge for $14$ visits?'
            answer: '37'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Fourteen visits is more than $10$, so the second rule applies. There are $14 - 10 = 4$ visits after the tenth, so the charge is $25 + 3 \cdot 4 = 37$ dollars.'
          - problem: 'A phone plan costs $20$ dollars a month for up to $5$ GB of data, and $4$ dollars more for every GB beyond $5$ GB. In one month Ana pays $44$ dollars. How many GB did she use?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ana pays more than $20$ dollars, so she went beyond $5$ GB. The extra $44 - 20 = 24$ dollars buys $24 \div 4 = 6$ GB, so she used $5 + 6 = 11$ GB.'
          - problem: 'Let $f(x) = \begin{cases} 2x + 1 & x < 3 \\ x^2 - 2 & x \ge 3 \end{cases}$. For which value of $x$ is $f(x) = 7$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the first piece, $2x + 1 = 7$ gives $x = 3$, but that piece needs $x < 3$, so it is rejected. On the second piece, $x^2 - 2 = 7$ gives $x = 3$ or $x = -3$, and only $x = 3$ satisfies $x \ge 3$.'
          - problem: 'A town charges tax of $10\%$ on the first $12000$ dollars of income and $20\%$ on every dollar above $12000$. How much tax is due on an income of $30000$ dollars?'
            answer: '4800'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The first $12000$ dollars are taxed at $10\%$, which is $1200$ dollars. The other $30000 - 12000 = 18000$ dollars are taxed at $20\%$, which is $3600$ dollars, so the total is $4800$ dollars.'
      - id: kp2
        name: Absolute value as a piecewise rule
        key_prerequisites: [absolute-value, function-transformations-shifts]
        constraints: "|x - a| with integer a; piecewise rewrites ask for one branch at a time and name the side of the breakpoint; vertex questions on y = |x - a| + b; two word problems with a distance or an error"
        visuals: [{"kind":"coordinate","x_min":"-3","x_max":"5","y_min":"-3","y_max":"3","x_tick":"1","y_tick":"1","points":[{"x":"1","y":"-2","label":"vertex"}],"segments":[{"from":{"x":"-2","y":"1","label":null},"to":{"x":"1","y":"-2","label":null}},{"from":{"x":"1","y":"-2","label":null},"to":{"x":"4","y":"1","label":null}}],"caption":"A V-shaped graph made of two straight pieces that meet at the vertex"}]
        exemplars:
          - problem: 'For $x < 4$, write $|x - 4|$ without absolute value bars.'
            answer: '4 - x'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x < 4$ the inside $x - 4$ is negative. The absolute value changes its sign, so $|x - 4| = -(x - 4) = 4 - x$.'
          - problem: 'For $x \ge -7$, write $|x + 7|$ without absolute value bars.'
            answer: 'x + 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \ge -7$ the inside $x + 7$ is zero or positive. The absolute value leaves it unchanged, so $|x + 7| = x + 7$.'
          - problem: 'What is the vertex of $y = |x - 2| - 5$?'
            answer: '(2, -5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The bars turn at the point where $x - 2 = 0$, which is $x = 2$. The constant $-5$ moves the graph down, so the vertex is $(2, -5)$.'
          - problem: 'The graph of $y = |x|$ is shifted right $3$ units and down $6$ units. What is the equation of the new graph?'
            answer: 'y = |x - 3| - 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Right $3$ replaces $x$ with $x - 3$ inside the bars, and down $6$ subtracts $6$ outside them. So the equation is $y = |x - 3| - 6$.'
          - problem: 'A runner is at the position $x$ metres along a straight track, and a flag stands at the $30$ m mark. The distance from the runner to the flag is $|x - 30|$ metres. Before the runner reaches the flag, write this distance without absolute value bars.'
            answer: '30 - x'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Before the flag the runner has $x < 30$, so $x - 30$ is negative. The distance is its opposite, $-(x - 30) = 30 - x$.'
          - problem: 'A bolt should be $50$ mm long. If its actual length is $x$ mm, its length error is $|x - 50|$ mm. For which lengths is the error $0.4$ mm?'
            answer: '49.6, 50.4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The error is $0.4$ when $x - 50 = 0.4$ or when $50 - x = 0.4$. These give $x = 50.4$ and $x = 49.6$.'
          - problem: 'The graph of $y = |x - 8| + b$ passes through the point $(12, 9)$. What is its vertex?'
            answer: '(8, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x = 12$ we have $|12 - 8| = 4$, so $9 = 4 + b$ and $b = 5$. The vertex of $y = |x - 8| + 5$ is $(8, 5)$.'
          - problem: 'What is the vertex of $y = |x + 4| + 1$?'
            answer: '(-4, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The bars turn where $x + 4 = 0$, which is $x = -4$, not $x = 4$. The constant $1$ moves the graph up, so the vertex is $(-4, 1)$.'
          - problem: 'The graph of $y = |x - 3|$ is at height $5$ at two points. At which values of $x$?'
            answer: '-2, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x \ge 3$ we solve $x - 3 = 5$, which gives $x = 8$. For $x < 3$ we solve $3 - x = 5$, which gives $x = -2$.'
          - problem: 'The graph of $y = |x - 3| + b$ passes through the point $(7, 2)$. Where does it cross the $y$-axis?'
            answer: '(0, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x = 7$ we have $|7 - 3| = 4$, so $2 = 4 + b$ and $b = -2$. At $x = 0$ the height is $|0 - 3| - 2 = 1$, so the point is $(0, 1)$.'
          - problem: 'For $x < -7$, write $|x + 7|$ without absolute value bars.'
            answer: '-x - 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x < -7$ the inside $x + 7$ is negative. The absolute value changes its sign, so $|x + 7| = -(x + 7) = -x - 7$.'
          - problem: 'For $x < 3$, write $|2x - 6|$ without absolute value bars.'
            answer: '6 - 2x'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $x < 3$ the inside $2x - 6$ is negative. The absolute value changes its sign, so $|2x - 6| = -(2x - 6) = 6 - 2x$.'
      - id: kp3
        name: Where the pieces meet
        key_prerequisites: [graphing-linear-equations]
        constraints: "two linear (or one linear, one quadratic or absolute value) pieces with integer coefficients; breakpoint |x| <= 6; ask for the size of the jump or for the unknown that closes it; two word problems with a change of rule"
        visuals: [{"kind":"coordinate","x_min":"-3","x_max":"5","y_min":"-3","y_max":"5","x_tick":"1","y_tick":"1","points":[{"x":"2","y":"4","label":"top"},{"x":"2","y":"1","label":"bottom"}],"segments":[{"from":{"x":"-2","y":"0","label":null},"to":{"x":"2","y":"4","label":null}},{"from":{"x":"2","y":"1","label":null},"to":{"x":"4","y":"5","label":null}}],"caption":"Two straight pieces with a jump between them at one input"}]
        exemplars:
          - problem: 'Let $f(x) = \begin{cases} 2x & x < 1 \\ x + 3 & x \ge 1 \end{cases}$. By how much is the right piece higher than the left piece at $x = 1$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 1$ the left piece gives $2 \cdot 1 = 2$ and the right piece gives $1 + 3 = 4$. The right piece is higher by $4 - 2 = 2$.'
          - problem: 'Let $f(x) = \begin{cases} x + 5 & x < a \\ 3x + 9 & x \ge a \end{cases}$. For which value of $a$ do the two pieces meet at $x = a$?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pieces meet when $a + 5 = 3a + 9$. Then $2a = -4$, so $a = -2$.'
          - problem: 'Let $f(x) = \begin{cases} 2x - c & x < 1 \\ cx + 4 & x \ge 1 \end{cases}$. For which value of $c$ do the two pieces meet at $x = 1$?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 1$ the left piece gives $2 - c$ and the right piece gives $c + 4$. They meet when $2 - c = c + 4$, so $-2c = 2$ and $c = -1$.'
          - problem: 'Let $f(x) = \begin{cases} 2x - c & x < 1 \\ cx + 2 & x \ge 1 \end{cases}$. At $x = 1$ the right piece is $8$ units higher than the left piece. What is $c$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 1$ the left piece gives $2 - c$ and the right piece gives $c + 2$. The difference is $(c + 2) - (2 - c) = 2c$, and $2c = 8$ gives $c = 4$.'
          - problem: 'Let $f(x) = \begin{cases} x^2 - c & x < 2 \\ cx + 1 & x \ge 2 \end{cases}$. For which value of $c$ do the two pieces meet at $x = 2$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 2$ the left piece gives $4 - c$ and the right piece gives $2c + 1$. They meet when $4 - c = 2c + 1$, so $3 = 3c$ and $c = 1$.'
          - problem: 'Let $f(x) = \begin{cases} x + 1 & x < a \\ 2x - 1 & x \ge a \end{cases}$. At $x = a$ the right piece is $1$ unit higher than the left piece. What is $a$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = a$ the left piece gives $a + 1$ and the right piece gives $2a - 1$. The difference is $(2a - 1) - (a + 1) = a - 2$, and $a - 2 = 1$ gives $a = 3$.'
          - problem: 'A shop sells tiles at $5$ dollars each when a customer buys fewer than $10$ tiles, and at $4$ dollars each when a customer buys $10$ tiles or more. How many dollars cheaper is it to buy $10$ tiles than to buy $9$ tiles?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'Nine tiles cost $9 \cdot 5 = 45$ dollars. Ten tiles cost $10 \cdot 4 = 40$ dollars, so $10$ tiles are $45 - 40 = 5$ dollars cheaper than $9$ tiles.'
          - problem: 'A ramp has the height $y = 0.5x$ metres for $0 \le x < 6$ and the height $y = kx - 9$ metres for $x \ge 6$, where $x$ is the distance along the ground in metres. For which value of $k$ is there no step in the ramp at $x = 6$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 6$ the first piece gives $0.5 \cdot 6 = 3$. The second piece gives $6k - 9$, and there is no step when $6k - 9 = 3$, so $6k = 12$ and $k = 2$.'
          - problem: 'Let $f(x) = \begin{cases} |x - 2| & x < 4 \\ 7 - x & x \ge 4 \end{cases}$. By how much is the right piece higher than the left piece at $x = 4$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 4$ the left piece gives $|4 - 2| = 2$ and the right piece gives $7 - 4 = 3$. The right piece is higher by $3 - 2 = 1$.'
      - id: kp4
        name: 'Sketch y=|x| from the definition'
        key_prerequisites: [absolute-value, graphing-linear-equations]
        exemplars:
          - problem: 'The graph of $y=|x|$ passes through the point $\left(-\frac{3}{2}, k\right)$. Find $k$.'
            answer_contract: {"kind":"exact"}
            answer: '3/2'
            solution_sketch: 'For $x<0$ the rule is $|x|=-x$. So $k=-\left(-\frac{3}{2}\right)=\frac{3}{2}$.'
          - problem: 'How many points of the graph of $y=|x|$ have the $y$-coordinate $6$?'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'The equation $|x|=6$ has the solutions $x=6$ and $x=-6$. These give the points $(6,6)$ and $(-6,6)$. So the answer is 2.'
          - problem: 'The graph of $y=|x|$ has a part to the left of the $y$-axis. This part is a ray. Find the slope of this ray.'
            answer_contract: {"kind":"exact"}
            answer: '-1'
            solution_sketch: 'For $x<0$ the rule is $y=-x$. This is a line with slope $-1$. So the slope is $-1$.'
          - problem: 'The graph of $y=|x|$ consists of two rays from the origin. Find the angle between the two rays, in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '90'
            solution_sketch: 'The right ray has the direction $(1,1)$ and the left ray has the direction $(-1,1)$. The scalar product is $-1+1=0$. So the rays meet at $90^\circ$.'
          - problem: 'Find the area of the region bounded by the graph of $y=|x|$ and the line $y=3$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'The line meets the graph at $(-3,3)$ and $(3,3)$. The region is a triangle with base $6$ and height $3$. Its area is $\frac{1}{2}\cdot 6\cdot 3=9$.'
          - problem: 'Find the $x$-coordinate of the common point of the graph of $y=|x|$ and the line $y=6-x$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'For $x\ge 0$ solve $x=6-x$, which gives $x=3$. For $x<0$ solve $-x=6-x$, which has no solution. So the only common point has $x=3$.'
        constraints: 'points, rays and regions of the graph of y=|x|; the rule is x for x at least 0 and -x for x below 0; answers are numbers; no figure'
    diagnostic_exemplar:
      problem: 'Let $f(x) = |x - 1|$ for $x < 3$ and $f(x) = 6 - x$ for $x \ge 3$. Find the gap between the two pieces at $x = 3$.'
      answer: '1'
      solution_sketch: 'For $x$ just below $3$ the first piece is $x - 1$, approaching $2$; the second piece gives $6 - 3 = 3$; the gap is $3 - 2 = 1$.'
    anki_seeds:
      - front: "|x| written as a piecewise rule is..."
        back: "x for x ≥ 0; -x for x < 0"
        type: basic

  - id: average-rate-of-change
    name: Average Rate of Change
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: slope
        weight: 0.7
        key: true
      - id: function-notation
        weight: 0.6
        key: true
      - id: evaluating-expressions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Average rate of change on an interval
        key_prerequisites: [slope, function-notation]
        constraints: "(f(b) - f(a))/(b - a); polynomial functions, small integer endpoints; speeds, costs and volumes read from a context; unknown endpoint"
        try_first:
          problem: 'A sunflower is $12$ cm tall on day $2$ and $33$ cm tall on day $5$. By how many centimetres per day did it grow on average?'
          answer_contract: {"kind":"exact"}
          answer: '7'
          reveal: 'It grew $33-12=21$ cm in $5-2=3$ days, which is $7$ cm for each day. The average rate of change is the change in the output divided by the change in the input.'
        visuals: [{"kind":"curve","x_min":"-1","x_max":"8","y_min":"-1","y_max":"10","x_tick":"1","y_tick":"1","curve":{"family":"polynomial","coefficients":["0","6","-1"]},"key_points":[{"x":"1","y":"5","label":"M"},{"x":"6","y":"0","label":"N"}],"asymptotes":[],"caption":"A curve with two marked points on it"}]
        exemplars:
          - problem: 'Find the average rate of change of $f(x)=x^2$ on $[1,3]$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function values are $f(3)=9$ and $f(1)=1$. The change in $f$ is $8$ over a change in $x$ of $2$, so the average rate of change is $\frac{8}{2}=4$.'
          - problem: 'Find the average rate of change of $f(x)=x^2-3x$ on $[1,4]$.'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f(4)=16-12=4$ and $f(1)=1-3=-2$. The change in $f$ is $6$ and the width of the interval is $3$, so the average rate of change is $\frac{6}{3}=2$.'
          - problem: 'A cart moves so that its distance in metres after $t$ seconds is $s(t)=2t^2+1$. What is its average speed between $t=1$ and $t=3$?'
            answer: "8"
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The cart is at $s(3)=19$ m and at $s(1)=3$ m. It covers $16$ m in $2$ s, so its average speed is $\frac{16}{2}=8$ m/s.'
          - problem: 'Find the average rate of change of $f(x)=x^3$ on $[-1,2]$.'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values are $f(2)=8$ and $f(-1)=-1$. The change in $f$ is $8-(-1)=9$ and the width is $2-(-1)=3$, so the average rate of change is $\frac{9}{3}=3$.'
          - problem: 'A train is $120$ km from its depot at 2:00 pm and $270$ km from it at 4:30 pm. What is its average speed during this time?'
            answer: "60"
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'The train travels $270-120=150$ km in $2.5$ hours. Distance divided by time gives $\frac{150}{2.5}=60$ km/h.'
          - problem: 'What is the average rate of change of $f(x)=x^2$ on $[1,4]$?'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the change in $f$ by the width of the interval. The change is $f(4)-f(1)=16-1=15$ and the width is $4-1=3$, so the value is $\frac{15}{3}=5$.'
          - problem: 'The average rate of change of $f(x)=x^2$ on $[2,b]$ is $7$. Find $b$.'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average rate of change is $\frac{b^2-4}{b-2}=b+2$, because $b^2-4=(b-2)(b+2)$ and $b\neq 2$. Setting $b+2=7$ gives $b=5$.'
          - problem: 'A workshop makes $n$ bicycles in a week at a cost of $C(n)=n^2+20n+100$ dollars. What is the average cost of each extra bicycle when output rises from $10$ to $20$ bicycles?'
            answer: "50"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The cost is $C(20)=900$ dollars and $C(10)=400$ dollars. The extra $500$ dollars buy $10$ more bicycles, so each extra bicycle costs $\frac{500}{10}=50$ dollars on average.'
          - problem: 'A tank holds $V(t)=t^2-6t+40$ litres of water $t$ minutes after a valve opens. What is the average rate of change of the volume between $t=0$ and $t=4$?'
            answer: "-2"
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
            solution_sketch: 'The volume is $V(4)=32$ litres at the end and $V(0)=40$ litres at the start. The change is $-8$ litres in $4$ minutes, so the rate is $\frac{-8}{4}=-2$ litres per minute. The negative sign means the tank is losing water.'
      - id: kp2
        name: Non-polynomial functions and fractional answers
        key_prerequisites: [slope]
        constraints: "sqrt(x) or 1/x with endpoints chosen so f(a), f(b) are exact; answers as exact fractions; contexts with area and shared cost"
        visuals: [{"kind":"curve","x_min":"-1","x_max":"8","y_min":"-1","y_max":"8","x_tick":"1","y_tick":"1","curve":{"family":"reciprocal","a":"6","h":"0","k":"0"},"key_points":[{"x":"1","y":"6","label":"M"},{"x":"2","y":"3","label":"N"}],"asymptotes":[{"axis":"vertical","at":"0"},{"axis":"horizontal","at":"0"}],"caption":"A reciprocal curve with two marked points on it"}]
        exemplars:
          - problem: 'Find the average rate of change of $f(x)=\sqrt{x}$ on $[1,9]$.'
            answer: "1/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values are $f(9)=3$ and $f(1)=1$. The change in $f$ is $2$ over a width of $8$, so the average rate of change is $\frac{2}{8}=\frac{1}{4}$.'
          - problem: 'Find the average rate of change of $f(x)=\frac{1}{x}$ on $[1,4]$.'
            answer: "-1/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values are $f(4)=\frac14$ and $f(1)=1$. The change in $f$ is $\frac14-1=-\frac34$ over a width of $3$, so the average rate of change is $-\frac14$.'
          - problem: 'Find the average rate of change of $f(x)=\sqrt{x}$ on $[9,25]$.'
            answer: "1/8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values are $f(25)=5$ and $f(9)=3$. The change in $f$ is $2$ over a width of $16$, so the average rate of change is $\frac{2}{16}=\frac18$.'
          - problem: 'A square garden has area $A$ square metres, so its side length is $s(A)=\sqrt{A}$ metres. What is the average rate of change of the side length when the area grows from $16$ to $64$ square metres?'
            answer: "1/12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side is $s(64)=8$ m and $s(16)=4$ m, a growth of $4$ m. The area grows by $64-16=48$ square metres, so the rate is $\frac{4}{48}=\frac{1}{12}$ metre of side per square metre of area.'
          - problem: 'A bill of $60$ dollars is split equally among $n$ people, so each person pays $c(n)=\frac{60}{n}$ dollars. What is the average rate of change of $c$ as the group grows from $2$ people to $6$ people?'
            answer: "-5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each person pays $c(2)=30$ dollars in the small group and $c(6)=10$ dollars in the large one. The change is $-20$ dollars over $4$ more people, so the rate is $\frac{-20}{4}=-5$ dollars per extra person.'
          - problem: 'Find the average rate of change of $f(x)=\frac{1}{x}$ on $[2,6]$.'
            answer: "-1/12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values are $f(6)=\frac16$ and $f(2)=\frac12$. The change in $f$ is $-\frac13$ over a width of $4$, so the average rate of change is $-\frac{1}{12}$.'
          - problem: 'What is the average rate of change of $f(x)=\frac1x$ on $[1,3]$?'
            answer: "-1/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the change in $f$ by the width of the interval. The change is $f(3)-f(1)=\frac13-1=-\frac23$ and the width is $3-1=2$, so the value is $\frac{-2/3}{2}=-\frac13$.'
          - problem: 'Find the average rate of change of $f(x)=\sqrt{x+1}$ on $[3,8]$.'
            answer: "1/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The values are $f(8)=\sqrt9=3$ and $f(3)=\sqrt4=2$. The change in $f$ is $1$ over a width of $5$, so the average rate of change is $\frac15$.'
          - problem: 'The average rate of change of $f(x)=\frac{1}{x}$ on $[b,2]$ is $-\frac{3}{10}$. Find $b$.'
            answer: "5/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is $\frac{\frac12-\frac1b}{2-b}=-\frac{1}{2b}$. Setting $-\frac{1}{2b}=-\frac{3}{10}$ gives $2b=\frac{10}{3}$, so $b=\frac53$.'
          - problem: 'The average rate of change of $f(x)=\sqrt{x}$ on $[1,b]$ is $\frac25$. Find $b$.'
            answer: "9/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is $\frac{\sqrt b-1}{b-1}=\frac{1}{\sqrt b+1}$. Setting this equal to $\frac25$ gives $\sqrt b+1=\frac52$, so $\sqrt b=\frac32$ and $b=\frac94$.'
    diagnostic_exemplar:
      problem: 'Find the average rate of change of $f(x) = \sqrt{x}$ on $[4, 16]$.'
      answer: "1/6"
      solution_sketch: '$\frac{f(16) - f(4)}{16 - 4} = \frac{4 - 2}{12} = \frac{1}{6}$.'
    anki_seeds:
      - front: "Average rate of change of f on [a, b] = ?"
        back: "(f(b) - f(a)) / (b - a) — the slope of the secant line."
        type: basic

  - id: power-functions
    lt_term: 'laipsninės funkcijos y=x^n, y=x^(-n)'
    name: Power Functions with Integer Exponent
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: even-odd-functions
        weight: 0.6
        key: true
      - id: function-notation
        weight: 0.4
        key: false
      - id: domain-range
        weight: 0.4
        key: false
      - id: reading-function-graphs
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Shape and parity of y=x^n for natural n'
        key_prerequisites: [even-odd-functions, function-notation]
        exemplars:
          - problem: 'Let $f(x)=x^3$. Find $f(-2)$.'
            answer_contract: {"kind":"exact"}
            answer: '-8'
            solution_sketch: 'An odd power keeps the sign. So $f(-2)=(-2)^3=-8$.'
          - problem: 'Let $f(x)=x^4$. Find $f(-3)$.'
            answer_contract: {"kind":"exact"}
            answer: '81'
            solution_sketch: 'An even power gives a positive value. So $f(-3)=(-3)^4=81$.'
          - problem: 'Find the natural number $n$ between $8$ and $10$ for which the function $y=x^n$ is odd.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'The function $y=x^n$ is odd when $n$ is odd. The only natural number between $8$ and $10$ is $9$, and it is odd. So $n=9$.'
          - problem: 'How many real solutions does $x^6=64$ have?'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'An even power takes the same value at $x$ and at $-x$. We have $x^6=64$ when $x=2$ or $x=-2$. So there are 2 solutions.'
          - problem: 'Solve $x^5=-32$.'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            solution_sketch: 'An odd power is negative for a negative $x$. We have $(-2)^5=-32$. The function $y=x^5$ is increasing, so there is one solution, $x=-2$.'
          - problem: 'How many real numbers $x$ satisfy $x^4=x^2$?'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'Write $x^2(x^2-1)=0$. Then $x=0$, $x=1$ or $x=-1$. So there are 3 numbers.'
        constraints: 'values and solutions of x^n for natural n with a fixed small base; the parity of n decides the sign and the number of solutions; no figure'
      - id: kp2
        name: 'y=x^(-n) for n=1 to 4 and its asymptotes'
        key_prerequisites: [function-notation, domain-range, reading-function-graphs]
        exemplars:
          - problem: 'Let $f(x)=x^{-2}$. Find $f(-2)$.'
            answer_contract: {"kind":"exact"}
            answer: '1/4'
            solution_sketch: 'We have $x^{-2}=\frac{1}{x^2}$. So $f(-2)=\frac{1}{4}$.'
          - problem: 'Let $f(x)=x^{-3}$. Find $f(3)$.'
            answer_contract: {"kind":"exact"}
            answer: '1/27'
            solution_sketch: 'We have $x^{-3}=\frac{1}{x^3}$. So $f(3)=\frac{1}{27}$.'
          - problem: 'Let $f(x)=x^{-1}$. Find $f\left(-\frac15\right)$.'
            answer_contract: {"kind":"exact"}
            answer: '-5'
            solution_sketch: 'We have $x^{-1}=\frac1x$. So $f\left(-\frac15\right)=-5$.'
          - problem: 'The graph of $y=x^{-4}$ has a vertical asymptote. Find the $x$-value of this asymptote.'
            answer_contract: {"kind":"exact"}
            answer: '0'
            solution_sketch: 'The function is not defined at $x=0$. The values grow without bound near $0$. So the asymptote is $x=0$, and the answer is 0.'
          - problem: 'Solve $x^{-4}=\frac{1}{81}$. Give the set of solutions.'
            answer_contract: {"kind":"set"}
            answer: '{-3, 3}'
            solution_sketch: 'We have $x^4=81$. The power is even, so $x=3$ or $x=-3$.'
          - problem: 'At how many points do the graphs of $y=x^{-1}$ and $y=x^{-3}$ meet?'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'Solve $\frac1x=\frac{1}{x^3}$. Then $x^3=x$ and $x\ne 0$, so $x^2=1$. The solutions are $x=1$ and $x=-1$. So there are 2 points.'
        constraints: 'values, solutions and asymptotes of x^(-n) for n from 1 to 4; x is never 0; answers are numbers or a set'
      - id: kp3
        name: 'Formula of a power function from a point'
        key_prerequisites: [even-odd-functions, function-notation]
        exemplars:
          - problem: 'The graph of $y=x^n$ passes through the point $(2,8)$. Find the natural number $n$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'We need $2^n=8$. Since $8=2^3$, $n=3$.'
          - problem: 'The graph of $y=x^n$ passes through the point $(-2,16)$. Here $n$ is a natural number. Find $n$.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'We need $(-2)^n=16$. The value is positive, so $n$ is even. We have $(-2)^4=16$. So $n=4$.'
          - problem: 'The graph of $y=ax^2$ passes through the point $(3,18)$. Find $a$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'Substitute the point: $18=a\cdot 9$. So $a=2$.'
          - problem: 'The graph of $y=x^n$ passes through the point $\left(2,\frac18\right)$. Here $n$ is a negative integer. Find $n$.'
            answer_contract: {"kind":"exact"}
            answer: '-3'
            solution_sketch: 'We need $2^n=\frac18=2^{-3}$. So $n=-3$.'
          - problem: 'The graph of $y=ax^3$ passes through the point $(2,40)$. Find the value of $y$ at $x=-1$.'
            answer_contract: {"kind":"exact"}
            answer: '-5'
            solution_sketch: 'Substitute the point: $40=a\cdot 8$, so $a=5$. The function is odd. So $y(-1)=5\cdot(-1)^3=-5$.'
          - problem: 'The graph of $y=ax^{-2}$ passes through the point $(-3,2)$. Find the value of $y$ at $x=1$.'
            answer_contract: {"kind":"exact"}
            answer: '18'
            solution_sketch: 'Substitute the point: $2=\frac{a}{9}$, so $a=18$. Then $y(1)=\frac{18}{1}=18$.'
        constraints: 'one point of the graph fixes the exponent n or the factor a; the exponent is a natural number or a negative integer; answers are integers'
    diagnostic_exemplar:
      problem: 'Let $f(x)=x^5$. Find $f(-2)$.'
      answer_contract: {"kind":"exact"}
      answer: '-32'
      solution_sketch: 'An odd power keeps the sign. So $f(-2)=(-2)^5=-32$.'
    anki_seeds:
      - front: "The function $y=x^n$ is odd when $n$ is ... ."
        back: "odd"
        type: basic
      - front: "The graph of $y=x^{-2}$ has the vertical asymptote ... ."
        back: "$x=0$"
        type: basic

  - id: root-functions
    lt_term: 'šaknies funkcijos'
    name: Root Functions and Their Models
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 100
    prerequisites:
      - id: nth-roots
        weight: 0.6
        key: true
      - id: square-roots
        weight: 0.4
        key: false
      - id: cube-roots
        weight: 0.4
        key: false
      - id: inverse-functions
        weight: 0.5
        key: false
      - id: domain-range
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: 'Domain, range and graph of y = n-th root of x'
        key_prerequisites: [nth-roots, domain-range]
        exemplars:
          - problem: 'Find the smallest $x$ in the domain of $y=\sqrt[4]{x}$.'
            answer_contract: {"kind":"exact"}
            answer: '0'
            solution_sketch: 'An even root needs a number that is not negative. So the smallest $x$ is $0$.'
          - problem: 'Let $f(x)=\sqrt[3]{x}$. Find $f(-8)$.'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            solution_sketch: 'An odd root is defined for a negative number. We have $(-2)^3=-8$. So $f(-8)=-2$.'
          - problem: 'Find all $x$ in the domain of $y=\sqrt[4]{x-3}$. Write the answer as an inequality.'
            answer_contract: {"kind":"inequality_union"}
            answer: 'x >= 3'
            solution_sketch: 'An even root needs $x-3\ge 0$. So $x\ge 3$.'
          - problem: 'Find the smallest value of $y=\sqrt[6]{x}+2$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'The root $\sqrt[6]{x}$ is at least $0$, and it equals $0$ at $x=0$. So the smallest value of $y$ is $2$.'
          - problem: 'How many integers from $-5$ to $5$ lie in the domain of $y=\sqrt[4]{x+2}$?'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'The domain is $x\ge -2$. The integers from $-2$ to $5$ are $-2,-1,0,1,2,3,4,5$. So there are 8.'
          - problem: 'Solve $\sqrt[4]{x}\le 2$. Write the answer as an inequality.'
            answer_contract: {"kind":"inequality_union"}
            answer: '0 <= x <= 16'
            solution_sketch: 'The domain is $x\ge 0$. Raise both sides to the fourth power: $x\le 16$. So $0\le x\le 16$.'
        constraints: 'domain, smallest value and values of even and odd roots as functions; small integer data; answers are numbers or inequalities'
      - id: kp2
        name: 'Formula of a root function from a point'
        key_prerequisites: [nth-roots, inverse-functions]
        exemplars:
          - problem: 'The graph of $y=\sqrt[n]{x}$ passes through the point $(8,2)$. Find the natural number $n$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'We need $2^n=8$. So $n=3$.'
          - problem: 'The graph of $y=\sqrt[n]{x}$ passes through the point $(81,3)$. Find the natural number $n$.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'We need $3^n=81$. Since $81=3^4$, $n=4$.'
          - problem: 'The graph of $y=a\sqrt{x}$ passes through the point $(9,12)$. Find $a$.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'Substitute the point: $12=a\cdot 3$. So $a=4$.'
          - problem: 'The graph of $y=a\sqrt[3]{x}$ passes through the point $(-8,-6)$. Find $a$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'Substitute the point: $-6=a\cdot(-2)$. So $a=3$.'
          - problem: 'The graph of $y=a\sqrt{x}$ passes through the point $(4,10)$. Find the value of $y$ at $x=25$.'
            answer_contract: {"kind":"exact"}
            answer: '25'
            solution_sketch: 'Substitute the point: $10=2a$, so $a=5$. Then $y(25)=5\cdot 5=25$.'
          - problem: 'The graph of $y=a\sqrt[4]{x}$ passes through the point $(81,12)$. Find the value of $y$ at $x=16$.'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'Substitute the point: $12=3a$, so $a=4$. Then $y(16)=4\cdot 2=8$.'
        constraints: 'one graph point fixes the root degree n or the factor a; perfect powers only; answers are integers'
      - id: kp3
        name: 'Model with a power or root function'
        key_prerequisites: [nth-roots, square-roots, cube-roots]
        exemplars:
          - problem: 'The side of a square is $s=\sqrt{A}$, where $A$ is the area in cm$^2$. Find the side in centimeters when $A=144$.'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'We have $s=\sqrt{144}=12$.'
          - problem: 'The edge of a cube is $e=\sqrt[3]{V}$, where $V$ is the volume in cm$^3$. Find the edge in centimeters when $V=343$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'We have $e=\sqrt[3]{343}=7$.'
          - problem: 'A model gives the distance $d$ in kilometers to the horizon as $d=4\sqrt{h}$, where $h$ is the height in meters. Find $d$ when $h=49$.'
            answer_contract: {"kind":"exact"}
            answer: '28'
            solution_sketch: 'We have $d=4\sqrt{49}=4\cdot 7=28$.'
          - problem: 'The brightness of a lamp at the distance $d$ meters is $B=90d^{-2}$. Find $B$ when $d=3$.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'We have $B=\frac{90}{3^2}=\frac{90}{9}=10$.'
          - problem: 'A stone falls for $t=\sqrt{\frac h5}$ seconds over $h$ meters. Find $h$ when $t=3$.'
            answer_contract: {"kind":"exact"}
            answer: '45'
            solution_sketch: 'We have $\frac h5=9$. So $h=45$.'
          - problem: 'The distance to the horizon is $d=4\sqrt{h}$. By what factor must $h$ grow so that $d$ becomes twice as large?'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'We need $4\sqrt{h_2}=2\cdot 4\sqrt{h_1}$. So $\sqrt{h_2}=2\sqrt{h_1}$. Squaring gives $h_2=4h_1$.'
        constraints: 'a given formula with a square root, a cube root or a negative power; evaluate, solve for the input or compare two inputs; exact integers'
    diagnostic_exemplar:
      problem: 'Let $f(x)=\sqrt[3]{x}$. Find $f(64)$.'
      answer_contract: {"kind":"exact"}
      answer: '4'
      solution_sketch: 'We have $4^3=64$. So $f(64)=4$.'
    anki_seeds:
      - front: "The domain of $y=\\sqrt[n]{x}$ for even $n$ is ... ."
        back: "$x\\ge 0$"
        type: basic
      - front: "The domain of $y=\\sqrt[n]{x}$ for odd $n$ is ... ."
        back: "all real numbers"
        type: basic

  - id: graph-transformations-horizontal-modulus
    lt_term: 'grafikų transformacijos; f(ax); |f(x)|'
    name: 'Graph Transformations: f(ax), |f(x)|, Compositions'
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: function-stretches-reflections
        weight: 0.6
        key: true
      - id: function-transformations-shifts
        weight: 0.5
        key: false
      - id: piecewise-absolute-value-graphs
        weight: 0.5
        key: false
    knowledge_points:
      - id: kp1
        name: 'Horizontal stretch f(ax)'
        key_prerequisites: [function-stretches-reflections]
        exemplars:
          - problem: 'The graph of $y=f(x)$ passes through the point $(6,4)$. A point of the graph of $y=f(2x)$ has the $y$-coordinate $4$. Find its $x$-coordinate.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'We need $f(2x)=4$. This holds when $2x=6$. So $x=3$.'
          - problem: 'The graph of $y=f(x)$ passes through the point $(4,-3)$. Find the point of the graph of $y=f\left(\frac x2\right)$ that has the $y$-coordinate $-3$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(8,-3)'
            solution_sketch: 'We need $\frac x2=4$. So $x=8$. The point is $(8,-3)$.'
          - problem: 'Let $f(x)=x^2-1$ and $g(x)=f(2x)$. Find $g(3)$.'
            answer_contract: {"kind":"exact"}
            answer: '35'
            solution_sketch: 'We have $g(3)=f(6)=36-1=35$.'
          - problem: 'The graph of $y=f(x)$ meets the $x$-axis at $x=-2$ and at $x=6$. Find the sum of the $x$-values where the graph of $y=f(3x)$ meets the $x$-axis.'
            answer_contract: {"kind":"exact"}
            answer: '4/3'
            solution_sketch: 'We need $3x=-2$ or $3x=6$. So $x=-\frac23$ or $x=2$. The sum is $\frac43$.'
          - problem: 'The graph of $y=f\left(\frac x3\right)$ comes from the graph of $y=f(x)$ by a horizontal stretch. Find the stretch factor.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'Each point $(x,y)$ moves to $(3x,y)$. So the graph stretches horizontally by the factor $3$.'
          - problem: 'Let $f(x)=x^2-4x$ and $g(x)=f(2x)$. Find all zeros of $g$. Give the set of zeros.'
            answer_contract: {"kind":"set"}
            answer: '{0, 2}'
            solution_sketch: 'We have $g(x)=4x^2-8x=4x(x-2)$. The zeros are $0$ and $2$.'
        constraints: 'f(ax) and f(x/a): x-coordinates divide or multiply by a; values, zeros and stretch factors; integer data'
      - id: kp2
        name: 'Graphs of |f(x)| and f(|x|)'
        key_prerequisites: [piecewise-absolute-value-graphs, function-stretches-reflections]
        exemplars:
          - problem: 'Let $f(x)=x-4$. Find the value of $y=|f(x)|$ at $x=1$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'We have $f(1)=-3$. So $|f(1)|=3$.'
          - problem: 'Let $f(x)=x^2-9$. Find the value of $y=f(|x|)$ at $x=-2$.'
            answer_contract: {"kind":"exact"}
            answer: '-5'
            solution_sketch: 'We have $|-2|=2$. So the value is $f(2)=4-9=-5$.'
          - problem: 'The graph of $y=f(x)$ passes through the point $(3,-7)$. Find the $y$-coordinate of the point of $y=|f(x)|$ with $x=3$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'The modulus turns a negative value into a positive value. So the $y$-coordinate is $|-7|=7$.'
          - problem: 'Let $f(x)=2x-6$. Solve $|f(x)|=4$. List all solutions.'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            answer: '1, 5'
            solution_sketch: 'We have $2x-6=4$ or $2x-6=-4$. So $x=5$ or $x=1$.'
          - problem: 'Let $f(x)=x^2-4x$. How many solutions does $f(|x|)=-3$ have?'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'Put $t=|x|$. Then $t^2-4t+3=0$, so $t=1$ or $t=3$. Each positive $t$ gives two values of $x$. So there are 4 solutions.'
          - problem: 'Let $f(x)=x^2-4x$. Find the largest value of $y=|f(x)|$ on the interval $[0,3]$.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'On $[0,3]$ the value of $f$ goes from $0$ down to $-4$ at $x=2$ and up to $-3$ at $x=3$. The smallest value of $f$ is $-4$. So the largest value of $|f|$ is $4$.'
        constraints: '|f(x)| reflects negative values up; f(|x|) copies the right half to the left; values, solutions and extremes; integer data'
      - id: kp3
        name: 'Composition of two transformations'
        key_prerequisites: [function-stretches-reflections, function-transformations-shifts]
        exemplars:
          - problem: 'The graph of $y=f(x)$ passes through the point $(2,5)$. Find the point of the graph of $y=f(x-3)+1$ that comes from it.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5,6)'
            solution_sketch: 'The shift $x-3$ moves the point $3$ units to the right. The term $+1$ moves it $1$ unit up. So the point is $(5,6)$.'
          - problem: 'The graph of $y=f(x)$ passes through the point $(4,6)$. Find the point of the graph of $y=2f\left(\frac x2\right)$ that comes from it.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(8,12)'
            solution_sketch: 'The factor $\frac12$ in the argument doubles the $x$-coordinate. The factor $2$ doubles the $y$-coordinate. So the point is $(8,12)$.'
          - problem: 'The graph of $y=f(x)$ passes through the point $(-3,2)$. Find the point of the graph of $y=f(-x)+3$ that comes from it.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3,5)'
            solution_sketch: 'The reflection in the $y$-axis changes $-3$ into $3$. The term $+3$ moves the point $3$ units up. So the point is $(3,5)$.'
          - problem: 'The graph of $y=f(x)$ passes through the point $(6,-2)$. Find the point of the graph of $y=|f(2x)|$ that comes from it.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3,2)'
            solution_sketch: 'The factor $2$ in the argument halves the $x$-coordinate. The modulus changes $-2$ into $2$. So the point is $(3,2)$.'
          - problem: 'Let $f(x)=|x|$ and $g(x)=f\left(\frac x2\right)-1$. Find all zeros of $g$. Give the set of zeros.'
            answer_contract: {"kind":"set"}
            answer: '{-2, 2}'
            solution_sketch: 'We need $\left|\frac x2\right|=1$. So $x=2$ or $x=-2$.'
          - problem: 'The graph of $y=f(x)$ passes through the point $(6,4)$. Find the point of the graph of $y=3f(2x-4)-1$ that comes from it.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(5,11)'
            solution_sketch: 'We need $2x-4=6$. So $x=5$. Then $y=3\cdot 4-1=11$. The point is $(5,11)$.'
        constraints: 'two transformations at once: shift, stretch, reflection or modulus; track one point or find zeros; integer data'
    diagnostic_exemplar:
      problem: 'The graph of $y=f(x)$ passes through the point $(8,5)$. A point of the graph of $y=f(2x)$ has the $y$-coordinate $5$. Find its $x$-coordinate.'
      answer_contract: {"kind":"exact"}
      answer: '4'
      solution_sketch: 'We need $2x=8$. So $x=4$.'
    anki_seeds:
      - front: "The graph of $y=f(ax)$ compresses the graph of $y=f(x)$ horizontally by the factor ... (for $a>1$)."
        back: "$a$"
        type: basic
      - front: "The graph of $y=|f(x)|$ reflects the parts of $y=f(x)$ below the $x$-axis ... ."
        back: "above the $x$-axis"
        type: basic

  - id: graphical-solving-equations-inequalities
    lt_term: 'lygčių, nelygybių ir sistemų sprendimas grafiškai'
    name: Graphical Solving of Equations, Inequalities and Systems
    core: false
    difficulty: 0.6
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: power-functions
        weight: 0.6
        key: true
      - id: graphing-systems
        weight: 0.5
        key: false
      - id: reading-function-graphs
        weight: 0.4
        key: false
      - id: root-functions
        weight: 0.4
        key: false
      - id: graph-transformations-horizontal-modulus
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Equation f(x)=g(x) from sketches'
        key_prerequisites: [power-functions, root-functions, graphing-systems]
        exemplars:
          - problem: 'At how many points do the graphs of $y=x^3$ and $y=x$ meet?'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'Solve $x^3=x$. Then $x(x-1)(x+1)=0$, so $x=0$, $x=1$ or $x=-1$. The graphs meet at 3 points.'
          - problem: 'Solve $\sqrt{x}=x$. List all solutions.'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            answer: '0, 1'
            solution_sketch: 'The graphs of $y=\sqrt{x}$ and $y=x$ meet where $x=x^2$. So $x=0$ or $x=1$.'
          - problem: 'Solve $\frac1x=x$. List all solutions.'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            answer: '-1, 1'
            solution_sketch: 'The graphs of $y=\frac1x$ and $y=x$ meet where $x^2=1$. So $x=-1$ or $x=1$.'
          - problem: 'Solve $2(x-1)^3=16$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'Divide by $2$: $(x-1)^3=8$. So $x-1=2$ and $x=3$.'
          - problem: 'Solve $\sqrt{x}=12-x$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'Square both sides: $x=144-24x+x^2$, so $x^2-25x+144=0$. The roots are $9$ and $16$. At $x=16$ we have $\sqrt{16}=4\ne-4$. So $x=9$.'
          - problem: 'Find all $x$-coordinates of the points where the graphs of $y=x^4$ and $y=x^2$ meet. Give the set.'
            answer_contract: {"kind":"set"}
            answer: '{-1, 0, 1}'
            solution_sketch: 'Solve $x^4=x^2$. Then $x^2(x^2-1)=0$. So $x=0$, $x=1$ or $x=-1$.'
        constraints: 'meeting points of power, root and reciprocal graphs with a line or another power; exact integer answers'
      - id: kp2
        name: 'Inequality f(x)>g(x) from sketches'
        key_prerequisites: [power-functions, root-functions, graphing-systems]
        exemplars:
          - problem: 'Solve $x^2\le 8-x^2$. Write the answer as an inequality.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-2 <= x <= 2'
            solution_sketch: 'Move terms: $2x^2\le 8$, so $x^2\le 4$. Then $-2\le x\le 2$.'
          - problem: 'Solve $x^2>x+2$. Write the answer as inequalities.'
            answer_contract: {"kind":"inequality_union"}
            answer: 'x < -1 or x > 2'
            solution_sketch: 'The graphs meet where $x^2=x+2$, at $x=-1$ and $x=2$. The parabola lies above the line outside these points. So $x<-1$ or $x>2$.'
          - problem: 'Solve $\sqrt{x}<x$. Write the answer as an inequality.'
            answer_contract: {"kind":"inequality_union"}
            answer: 'x > 1'
            solution_sketch: 'The graphs meet at $x=0$ and $x=1$. For $x>1$ the line lies above the root curve. For $0<x<1$ it lies below. So $x>1$.'
          - problem: 'Solve $\frac1x>x$ for $x>0$. Write the answer as an inequality.'
            answer_contract: {"kind":"inequality_union"}
            answer: '0 < x < 1'
            solution_sketch: 'The graphs meet at $x=1$ for $x>0$. For $0<x<1$ the curve $y=\frac1x$ lies above the line. So $0<x<1$.'
          - problem: 'Solve $2\sqrt{x-1}<4$. Write the answer as an inequality.'
            answer_contract: {"kind":"inequality_union"}
            answer: '1 <= x < 5'
            solution_sketch: 'The domain is $x\ge 1$. Divide by $2$: $\sqrt{x-1}<2$. Then $x-1<4$, so $x<5$. The answer is $1\le x<5$.'
          - problem: 'Solve $x^3\ge x$. Write the answer as inequalities.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-1 <= x <= 0 or x >= 1'
            solution_sketch: 'Write $x(x-1)(x+1)\ge 0$. The signs are negative for $x<-1$, positive on $(-1,0)$, negative on $(0,1)$ and positive for $x>1$. So $-1\le x\le 0$ or $x\ge 1$.'
        constraints: 'compare two power or root graphs; the meeting points are integers; answers are intervals; the domain limits some items'
      - id: kp3
        name: 'System of two equations with a non-linear graph'
        key_prerequisites: [power-functions, root-functions, graphing-systems]
        exemplars:
          - problem: 'Find the point with $x>0$ that satisfies both $y=x^2$ and $y=2x+3$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3,9)'
            solution_sketch: 'Solve $x^2=2x+3$. Then $x^2-2x-3=0$, so $x=3$ or $x=-1$. For $x=3$ we get $y=9$.'
          - problem: 'Find the point with $x>0$ that satisfies both $y=\frac1x$ and $y=x$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1,1)'
            solution_sketch: 'Solve $\frac1x=x$. Then $x^2=1$. For $x>0$ we get $x=1$ and $y=1$.'
          - problem: 'Find the point that satisfies both $y=\sqrt{x}$ and $y=6-x$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(4,2)'
            solution_sketch: 'Put $y=\sqrt{x}$ in the second equation: $\sqrt{x}=6-x$. Then $x=4$, because $x=9$ gives $\sqrt9\ne-3$. So $y=2$.'
          - problem: 'Find the point with $x>0$ that satisfies both $y=x^2$ and $y=18-x^2$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(3,9)'
            solution_sketch: 'Solve $x^2=18-x^2$. Then $x^2=9$. For $x>0$ we get $x=3$ and $y=9$.'
          - problem: 'Find the point with $x<0$ that satisfies both $y=x^3$ and $y=3x-2$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-2,-8)'
            solution_sketch: 'Solve $x^3-3x+2=0$. This is $(x-1)^2(x+2)=0$. The root with $x<0$ is $x=-2$. Then $y=-8$.'
          - problem: 'Find the point with $x<0$ and $y\ne 0$ that satisfies both $y=x^2$ and $y=2|x|$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-2,4)'
            solution_sketch: 'For $x<0$ we have $|x|=-x$. Solve $x^2=-2x$. Then $x(x+2)=0$. The root with $x<0$ is $x=-2$. Then $y=4$.'
        constraints: 'one non-linear equation (power, root, reciprocal or modulus) with a line or a parabola; the answer is a point chosen by a sign condition; integer coordinates'
    diagnostic_exemplar:
      problem: 'Solve $x^2=x$. List all solutions.'
      answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
      answer: '0, 1'
      solution_sketch: 'Write $x(x-1)=0$. So $x=0$ or $x=1$.'
    anki_seeds:
      - front: "The solutions of $f(x)=g(x)$ are the ... of the points where the graphs meet."
        back: "$x$-coordinates"
        type: basic
      - front: "The solutions of $f(x)>g(x)$ are the $x$-values where the graph of $f$ lies ... the graph of $g$."
        back: "above"
        type: basic
