unit: function-analysis
course: precalculus
module: "Function Analysis & Transformations"
topics:
  - id: function-transformations-shifts
    name: Vertical and Horizontal Shifts
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: function-notation
        weight: 0.7
        key: true
      - id: quadratic-graphs-vertex
        weight: 0.5
        key: true
      - id: domain-range
        weight: 0.3
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Vertical shifts
        key_prerequisites: [function-notation]
        constraints: "parent functions x^2, x^3, sqrt(x); integer shifts 1-9; ask for the right-hand side alone, written as a bare expression in x"
        exemplars:
          - problem: 'The graph of $y = x^2$ is shifted up $3$ units. Give the right-hand side of the new equation $y = \ldots$'
            answer: "x^2 + 3"
          - problem: 'The graph of $y = x^3$ is shifted down $4$ units. Give the right-hand side of the new equation $y = \ldots$'
            answer: "x^3 - 4"
          - problem: "The graph of $y = x^2$ is shifted down $5$ units. Give the right-hand side of the new equation $y = \\ldots$"
            answer: "x^2 - 5"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Use the vertical shift rule y = f(x) + k with f(x) = x^2 and k = -5. This gives y = x^2 - 5. So the right-hand side is x^2 - 5."
          - problem: "The graph of $y = x^3$ is shifted up $6$ units. Give the right-hand side of the new equation $y = \\ldots$"
            answer: "x^3 + 6"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Use the vertical shift rule y = f(x) + k with f(x) = x^3 and k = 6. This gives y = x^3 + 6. So the right-hand side is x^3 + 6."
          - problem: "The graph of $y = \\sqrt{x}$ is shifted down $2$ units. Give the right-hand side of the new equation $y = \\ldots$"
            answer: "sqrt(x) - 2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Use the vertical shift rule y = f(x) + k with f(x) = sqrt(x) and k = -2. This gives y = sqrt(x) - 2. So the right-hand side is sqrt(x) - 2."
          - problem: "The graph of $y = \\sqrt{x}$ is shifted up $7$ units. Give the right-hand side of the new equation $y = \\ldots$"
            answer: "sqrt(x) + 7"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Use the vertical shift rule y = f(x) + k with f(x) = sqrt(x) and k = 7. This gives y = sqrt(x) + 7. So the right-hand side is sqrt(x) + 7."
      - id: kp2
        name: Horizontal shifts
        key_prerequisites: [function-notation, quadratic-graphs-vertex]
        constraints: "emphasize the sign flip: f(x - h) moves right h; ask for the right-hand side alone, with radicals written as sqrt(...)"
        exemplars:
          - problem: 'The graph of $y = x^2$ is shifted right $2$ units. Give the right-hand side of the new equation $y = \ldots$'
            answer: "(x - 2)^2"
            solution_sketch: 'Right $h$ means replace $x$ with $x - h$.'
          - problem: 'The graph of $y = \sqrt{x}$ is shifted left $5$ units. Give the right-hand side of the new equation $y = \ldots$'
            answer: "sqrt(x + 5)"
          - problem: "The graph of $y = x^2$ is shifted right $3$ units. Give the right-hand side of the new equation $y = \\ldots$."
            answer: "(x - 3)^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: The original function is y = x^2. Step 2: The horizontal shift rule says a right shift of 3 units replaces x with x - 3. Step 3: Apply this replacement to get (x - 3)^2. The answer is (x - 3)^2."
          - problem: "The graph of $y = \\sqrt{x}$ is shifted left $4$ units. Give the right-hand side of the new equation $y = \\ldots$."
            answer: "sqrt(x + 4)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: The original function is y = sqrt(x). Step 2: The horizontal shift rule says a left shift of 4 units replaces x with x + 4. Step 3: Apply this replacement to get sqrt(x + 4). The answer is sqrt(x + 4)."
          - problem: "The graph of $y = 2x + 1$ is shifted left $3$ units. Give the right-hand side of the new equation $y = \\ldots$."
            answer: "2x + 7"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: The original function is y = 2x + 1. Step 2: The horizontal shift rule says a left shift of 3 units replaces x with x + 3. Step 3: Apply this to get 2(x + 3) + 1, which simplifies to 2x + 7. The answer is 2x + 7."
          - problem: "The graph of $y = f(x)$ is shifted left $6$ units to give $y = \\sqrt{x + 6}$. Give the right-hand side of $y = f(x)$."
            answer: "sqrt(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: The shifted function is y = sqrt(x + 6). Step 2: A left shift of 6 units means the shifted input is x + 6, so f(x + 6) = sqrt(x + 6). Step 3: Replacing x + 6 by u gives f(u) = sqrt(u), so the original right-hand side is sqrt(x). The answer is sqrt(x)."
      - id: kp3
        name: Combined shifts and locating the new vertex
        key_prerequisites: [quadratic-graphs-vertex]
        constraints: "combine one horizontal and one vertical shift of x^2, x^3, or sqrt(x); integer shifts 1-9; vertex questions read (h, k) off vertex form and answer as an ordered pair"
        exemplars:
          - problem: 'The graph of $y = x^2$ is shifted left $1$ and up $4$. Give the right-hand side of the new equation $y = \ldots$'
            answer: "(x + 1)^2 + 4"
          - problem: 'State the vertex of $y = (x - 3)^2 + 2$.'
            answer: "(3, 2)"
            solution_sketch: 'The parent vertex $(0,0)$ moves right $3$, up $2$.'
          - problem: "The graph of $y = x^3$ is shifted right $3$ and up $2$. Give the right-hand side of the new equation $y = \\ldots$."
            answer: "(x - 3)^3 + 2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start from the parent function $y = x^3$. Apply the horizontal shift rule: right $3$ replaces $x$ with $x - 3$. Apply the vertical shift rule: up $2$ adds $2$ outside the cubic. The right-hand side is (x - 3)^3 + 2."
          - problem: "The graph of $y = \\sqrt{x}$ is shifted left $5$ and down $2$. Give the right-hand side of the new equation $y = \\ldots$."
            answer: "sqrt(x + 5) - 2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start from the parent function $y = \\sqrt{x}$. Apply the horizontal shift rule: left $5$ replaces $x$ with $x + 5$. Apply the vertical shift rule: down $2$ subtracts $2$ outside the square root. The right-hand side is sqrt(x + 5) - 2."
          - problem: "The graph of $y = \\sqrt{x}$ is shifted right $2$ and down $3$. Find the x-intercept of the new graph."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the shift rules to the full parent object: right $2$ gives $y = \\sqrt{x - 2}$, and down $3$ gives $y = \\sqrt{x - 2} - 3$. At an x-intercept set $y = 0$ and solve $\\sqrt{x - 2} = 3$. Squaring both sides gives $x - 2 = 9$, so $x = 11$. The x-intercept is 11."
          - problem: "The graph of $y = x^2$ is shifted right $5$ and down $9$. Find the smaller x-intercept of the new graph."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the shift rules to the full parent object: right $5$ gives $y = (x - 5)^2$, and down $9$ gives $y = (x - 5)^2 - 9$, whose vertex is $(5, -9)$. Set $y = 0$ and solve $(x - 5)^2 = 9$, so $x - 5 = 3$ or $x - 5 = -3$. The intercepts are $x = 8$ and $x = 2$, and the smaller one is the answer. The smaller x-intercept is 2."
    diagnostic_exemplar:
      problem: 'The graph of $y = x^2$ is shifted right $4$ and down $1$. Give the right-hand side of the new equation $y = \ldots$'
      answer: "(x - 4)^2 - 1"
      solution_sketch: 'A horizontal shift acts inside with the opposite sign — right $4$ replaces $x$ by $x - 4$ — while a vertical shift acts outside with its own sign.'
    anki_seeds:
      - front: "The graph of f(x - h) moves the graph of f in which direction?"
        back: "Right by h (subtracting inside shifts right)."
        type: basic

  - id: function-stretches-reflections
    name: Stretches, Compressions, and Reflections
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: function-transformations-shifts
        weight: 0.7
        key: true
      - id: function-notation
        weight: 0.4
        key: true
      - id: quadratic-graphs-vertex
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Vertical stretches and compressions
        key_prerequisites: [function-notation]
        constraints: "stretch factors 2-5 or 1/2, 1/3; track a labeled point; ask for the right-hand side alone, written as a bare expression in x"
        exemplars:
          - problem: 'The graph of $y = x^2$ is stretched vertically by a factor of $3$. Give the right-hand side of the new equation $y = \ldots$'
            answer: "3x^2"
          - problem: 'The point $(2, 4)$ lies on $y = f(x)$. What point lies on $y = 3f(x)$?'
            answer: "(2, 12)"
          - problem: "The graph of y = x^2 passes through (2, 4). It is stretched vertically by a factor of 4. Find the new equation and give its right-hand side as a bare expression in x."
            answer: "4x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with the full base equation y = x^2. By the vertical stretch rule, a stretch by factor 4 multiplies each output y-value by 4 while x stays the same, so the new equation is y = 4x^2. The right-hand side is 4x^2."
          - problem: "The graph of y = sqrt(x) passes through (9, 3). It is compressed vertically by a factor of 1/3. Find the new equation and give its right-hand side as a bare expression in x."
            answer: "sqrt(x)/3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with the full base equation y = sqrt(x). By the vertical compression rule, a compression by factor 1/3 multiplies each output y-value by 1/3, so the new equation is y = sqrt(x)/3. The right-hand side is sqrt(x)/3."
          - problem: "The graph of y = abs(x) passes through (-2, 2). It is stretched vertically by a factor of 3. Find the new equation and give its right-hand side as a bare expression in x."
            answer: "3abs(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with the full base equation y = abs(x). By the vertical stretch rule, a stretch by factor 3 multiplies each output y-value by 3 while x stays the same, so the new equation is y = 3abs(x). The right-hand side is 3abs(x)."
          - problem: "The graph of y = x^2 is vertically stretched by an unknown factor k, and the stretched graph passes through (3, 45). Determine k and give the right-hand side of the new equation as a bare expression in x."
            answer: "5x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with the full base equation y = x^2 and write the stretched equation as y = kx^2, since a vertical stretch multiplies the output by k. The point (3, 45) must lie on the stretched graph, so 45 = k times 3^2 = 9k, giving k = 5. The new equation is y = 5x^2, so the right-hand side is 5x^2."
      - id: kp2
        name: Reflections across the axes
        key_prerequisites: [function-notation]
        constraints: "-f(x) reflects across the x-axis; f(-x) across the y-axis; ask for the right-hand side alone, with radicals written as sqrt(...)"
        exemplars:
          - problem: 'The graph of $y = \sqrt{x}$ is reflected across the $y$-axis. Give the right-hand side of the new equation $y = \ldots$'
            answer: "sqrt(-x)"
            solution_sketch: 'Reflecting across the $y$-axis replaces $x$ with $-x$.'
          - problem: 'The graph of $y = x^3 - x$ is reflected across the $x$-axis. Give the right-hand side of the new equation $y = \ldots$'
            answer: "-x^3 + x"
          - problem: "The graph of $y = x^2$ is reflected across the $x$-axis. Give the right-hand side of the new equation $y = \\ldots$"
            answer: "-x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The original function is f(x) = x^2. Reflection across the x-axis uses the rule -f(x). Substituting gives -x^2. The answer is -x^2."
          - problem: "The graph of $y = |x|$ is reflected across the $x$-axis. Give the right-hand side of the new equation $y = \\ldots$"
            answer: "-abs(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The original function is f(x) = abs(x). Reflection across the x-axis uses the rule -f(x). Substituting gives -abs(x). The answer is -abs(x)."
          - problem: "The graph of $y = 1/x$ is reflected across the $y$-axis. Give the right-hand side of the new equation $y = \\ldots$"
            answer: "-1/x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The original function is f(x) = 1/x. Reflection across the y-axis uses the rule f(-x). Substituting -x for x gives 1/(-x), which simplifies to -1/x. The answer is -1/x."
          - problem: "The graph of $y = x^4 + x^2$ is reflected across the $x$-axis. Give the right-hand side of the new equation $y = \\ldots$"
            answer: "-x^4 - x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The original function is f(x) = x^4 + x^2. Reflection across the x-axis uses the rule -f(x). Substituting gives -(x^4 + x^2) = -x^4 - x^2. The answer is -x^4 - x^2."
      - id: kp3
        name: Combining stretch, reflection, and shift
        key_prerequisites: [function-transformations-shifts]
        constraints: "compose a stretch (factor 2-5), at most one reflection, and one shift; either track a labeled point with integer coordinates or ask for the right-hand side with radicals as sqrt(...)"
        exemplars:
          - problem: 'The point $(4, 2)$ lies on $y = f(x)$. What point lies on $y = -2f(x) + 3$?'
            answer: "(4, -1)"
            solution_sketch: '$-2 \cdot 2 + 3 = -1$; the $x$-coordinate is unchanged.'
          - problem: 'Describe $y = -2(x - 1)^2$ as transformations of $y = x^2$.'
            answer: "shift right 1, stretch vertically by 2, reflect across the x-axis"
            answer_contract: {kind: label, options: [["shift right 1, stretch vertically by 2, reflect across the x-axis"], ["shift left 1, stretch vertically by 2, reflect across the x-axis"], ["shift right 1, compress vertically by 2, reflect across the x-axis"], ["shift right 1, stretch vertically by 2, reflect across the y-axis"]]}
    diagnostic_exemplar:
      problem: 'The point $(3, 5)$ lies on $y = f(x)$. What point lies on $y = -2f(x) + 1$?'
      answer: "(3, -9)"
      solution_sketch: 'Stretch by $2$ and reflect: $-2 \cdot 5 = -10$; then shift up $1$: $-9$. The $x$-coordinate is unchanged.'
    anki_seeds:
      - front: "y = f(-x) reflects the graph of f across which axis?"
        back: "The y-axis."
        type: basic

  - id: even-odd-functions
    name: Even and Odd Functions
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: function-notation
        weight: 0.6
        key: true
      - id: function-stretches-reflections
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.4
      - id: polynomial-addition-subtraction
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Test algebraically with f(-x)
        key_prerequisites: [function-notation, evaluating-expressions]
        constraints: "polynomials only; include a 'neither' case"
        exemplars:
          - problem: "Determine the symmetry class of f(x) = x^4 + 5x^2 + 1 by testing algebraically with f(-x)."
            answer: "even"
            answer_contract: {"kind": "label", "options": [["even"], ["odd"], ["neither"], ["both"]]}
            solution_sketch: "Substitute -x into f(x) = x^4 + 5x^2 + 1 using function notation: f(-x) = (-x)^4 + 5(-x)^2 + 1 = x^4 + 5x^2 + 1, which equals f(x). This confirms the graph is symmetric about the y-axis, so f is even. The option odd is the error of assuming each exponent forces a sign change; the option neither is the error of missing that f(-x) equals f(x); the option both is the error of claiming odd symmetry also applies. The correct classification is even."
          - problem: "For h(x) = x^5 - 3x^3 + 2x, determine h(-x) as a polynomial in x."
            answer: "-x^5+3x^3-2x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute -x into h(x) = x^5 - 3x^3 + 2x using function notation: h(-x) = (-x)^5 - 3(-x)^3 + 2(-x). Simplify each term: (-x)^5 = -x^5, -3(-x)^3 = 3x^3, and 2(-x) = -2x. Combining these gives h(-x) = -x^5 + 3x^3 - 2x, which also equals -h(x), confirming odd symmetry. The polynomial for h(-x) is -x^5+3x^3-2x."
          - problem: "For f(x) = x^2 + x, find f(-x) as a polynomial in x."
            answer: "x^2-x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute -x into f(x) = x^2 + x using function notation: f(-x) = (-x)^2 + (-x) = x^2 - x. Compare this to f(x) = x^2 + x and to -f(x) = -x^2 - x; f(-x) matches neither expression, so f is neither even nor odd. The polynomial for f(-x) is x^2-x."
          - problem: "For f(x) = x^3 + kx^2 + 5x, find the value of k that makes f an odd function."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute -x into f(x) = x^3 + kx^2 + 5x using function notation: f(-x) = -x^3 + kx^2 - 5x. For f to be odd, f(-x) must equal -f(x) = -x^3 - kx^2 - 5x. Matching the x^2 coefficients gives k = -k, so k = 0. The value of k is 0."
          - problem: "For f(x) = 2x^4 - 3x^3 + 7x^2 - x + 4, find the coefficient of x^3 in f(-x)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute -x into f(x) = 2x^4 - 3x^3 + 7x^2 - x + 4 using function notation: f(-x) = 2x^4 + 3x^3 + 7x^2 + x + 4. The x^3 term in f(-x) is 3x^3, so its coefficient is 3. The coefficient is 3."
          - problem: "For g(x) = x^4 - 2x^3 + x, compute g(-x) as a polynomial in x."
            answer: "x^4+2x^3-x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute -x into g(x) = x^4 - 2x^3 + x using function notation: g(-x) = (-x)^4 - 2(-x)^3 + (-x) = x^4 + 2x^3 - x. This result is neither g(x) = x^4 - 2x^3 + x nor -g(x) = -x^4 + 2x^3 - x, so g is neither even nor odd. The polynomial for g(-x) is x^4+2x^3-x."
      - id: kp2
        name: Symmetry and using known values
        key_prerequisites: [function-stretches-reflections]
        constraints: "symmetry named as y-axis (even) or origin (odd); known-value questions give f(a) for a small integer a and ask for f(-a)"
        exemplars:
          - problem: 'A function is even. Its graph is symmetric about what?'
            answer: "the y-axis"
            answer_contract: {kind: label, options: [[the y-axis], [the origin]]}
          - problem: 'If $f$ is odd and $f(2) = 7$, find $f(-2)$.'
            answer: "-7"
            solution_sketch: 'Odd means $f(-x) = -f(x)$.'
    diagnostic_exemplar:
      problem: 'Is $f(x) = x^3 - 4x$ even, odd, or neither? Name the symmetry of its graph, and use that symmetry to find $f(-3)$ given that $f(3) = 15$.'
      answer: 'odd; its graph is symmetric about the origin; f(-3) = -15'
      answer_contract: {kind: none}
      solution_sketch: '$f(-x) = -x^3 + 4x = -f(x)$, so $f$ is odd — origin symmetry — and $f(-3) = -f(3) = -15$.'
    anki_seeds:
      - front: "Algebraic tests: f is even iff f(-x) = ...; f is odd iff f(-x) = ..."
        back: "even: f(-x) = f(x); odd: f(-x) = -f(x)"
        type: basic

  - id: piecewise-absolute-value-graphs
    name: Piecewise and Absolute-Value Functions
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: function-notation
        weight: 0.6
        key: true
      - id: graphing-linear-equations
        weight: 0.5
        key: true
      - id: absolute-value
        weight: 0.5
      - id: domain-range
        weight: 0.4
      - id: function-transformations-shifts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Evaluate a piecewise function
        key_prerequisites: [function-notation]
        constraints: "two or three linear/quadratic pieces; test inputs on both sides of each breakpoint"
        exemplars:
          - problem: 'Let $f(x) = x + 2$ for $x < 0$ and $f(x) = x^2$ for $x \ge 0$. Find $f(-3)$ and $f(2)$.'
            answer: "-1, 4"
            answer_contract: {kind: list, ordered: true, member: {kind: exact}}
          - problem: 'Let $f(x) = 2x$ for $x < 1$ and $f(x) = 5$ for $x \ge 1$. Find $f(1)$.'
            answer: "5"
            solution_sketch: '$x = 1$ satisfies $x \ge 1$, so use the second piece.'
      - id: kp2
        name: Absolute value as a piecewise rule
        key_prerequisites: [absolute-value, function-transformations-shifts]
        constraints: "|x - a| with integer a; piecewise rewrites state both branches with the breakpoint; vertex questions on y = |x - a| + b with integer a, b"
        exemplars:
          - problem: 'Write $|x - 3|$ as a piecewise rule.'
            answer: "x - 3 for x ≥ 3; 3 - x for x < 3"
            answer_contract: {kind: none}
            solution_sketch: 'For $x \ge 3$, $x - 3 \ge 0$ so $|x - 3| = x - 3$; for $x < 3$, $|x - 3| = 3 - x$.'
          - problem: 'State the vertex of $y = |x - 2| - 5$.'
            answer: "(2, -5)"
      - id: kp3
        name: Where the pieces meet
        key_prerequisites: [graphing-linear-equations]
        constraints: "two linear (or one linear, one quadratic) pieces with integer coefficients; breakpoint |x| <= 3; ask whether the pieces meet or for the size of the jump"
        exemplars:
          - problem: 'Let $f(x) = 2x$ for $x < 1$ and $f(x) = x + 3$ for $x \ge 1$. Find the gap between the pieces at $x = 1$.'
            answer: "2"
            solution_sketch: 'Left piece approaches $2$; right piece gives $4$; gap $= 4 - 2 = 2$.'
          - problem: "Let f(x) = x + 5 for x < a and f(x) = 3x + 9 for x >= a. The two pieces meet at the breakpoint. Find the value of a."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write both pieces first: the left piece is f(x) = x + 5 and the right piece is f(x) = 3x + 9. At the shared breakpoint a the pieces give the same value, so set a + 5 = 3a + 9. Subtracting a from both sides gives 5 = 2a + 9, so 2a = -4. The answer is a = -2."
          - problem: "Let f(x) = 2x - c for x < 1 and f(x) = cx + 4 for x >= 1. Find the value of c that makes the two pieces meet at x = 1."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write both pieces first: the left piece is f(x) = 2x - c and the right piece is f(x) = cx + 4. At x = 1 the left piece gives 2 - c and the right piece gives c + 4. Meeting requires 2 - c = c + 4, so -2c = 2. The answer is -1."
          - problem: "Let f(x) = 2x - c for x < 1 and f(x) = cx + 2 for x >= 1. The right piece is 8 units higher than the left piece at x = 1. Find the value of c."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write both pieces first: the left piece is f(x) = 2x - c and the right piece is f(x) = cx + 2. At x = 1 the left piece gives 2 - c and the right piece gives c + 2. The right piece being 8 units higher gives (c + 2) - (2 - c) = 8, so 2c = 8. The answer is 4."
          - problem: "Let f(x) = x^2 - c for x < 2 and f(x) = cx + 1 for x >= 2. Find the value of c that makes the two pieces meet at x = 2."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write both pieces first: the left piece is f(x) = x^2 - c and the right piece is f(x) = cx + 1. At x = 2 the left piece gives 4 - c and the right piece gives 2c + 1. Meeting requires 4 - c = 2c + 1, so 3 = 3c. The answer is 1."
          - problem: "Let f(x) = x + 1 for x < a and f(x) = 2x - 1 for x >= a. The gap between the pieces at x = a is 1. Find the value of a."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write both pieces first: the left piece is f(x) = x + 1 and the right piece is f(x) = 2x - 1. At x = a the left piece gives a + 1 and the right piece gives 2a - 1, so the gap is (2a - 1) - (a + 1) = a - 2. Setting this gap equal to 1 gives a - 2 = 1. The answer is 3."
    diagnostic_exemplar:
      problem: 'Let $f(x) = |x - 1|$ for $x < 3$ and $f(x) = 6 - x$ for $x \ge 3$. Find the gap between the two pieces at $x = 3$.'
      answer: '1'
      solution_sketch: 'For $x$ just below $3$ the first piece is $x - 1$, approaching $2$; the second piece gives $6 - 3 = 3$; the gap is $3 - 2 = 1$.'
    anki_seeds:
      - front: "|x| written as a piecewise rule is..."
        back: "x for x ≥ 0; -x for x < 0"
        type: basic

  - id: average-rate-of-change
    name: Average Rate of Change
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: slope
        weight: 0.7
        key: true
      - id: function-notation
        weight: 0.6
        key: true
      - id: evaluating-expressions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Average rate of change on an interval
        key_prerequisites: [slope, function-notation]
        constraints: "(f(b) - f(a))/(b - a); polynomial functions, small integer endpoints"
        exemplars:
          - problem: 'Find the average rate of change of $f(x) = x^2$ on $[1, 3]$.'
            answer: "4"
            solution_sketch: '$\frac{f(3) - f(1)}{3 - 1} = \frac{9 - 1}{2} = 4$.'
          - problem: 'Find the average rate of change of $f(x) = x^3$ on $[0, 2]$.'
            answer: "4"
          - problem: "Find the average rate of change of f(x) = x^2 on [2, 4]."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x) = x^2 on [2, 4], use function notation to get f(4) = 16 and f(2) = 4. Apply the average rate of change formula: (16 - 4)/(4 - 2) = 12/2 = 6. The average rate of change is 6."
          - problem: "Find the average rate of change of f(x) = x^3 on [1, 3]."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x) = x^3 on [1, 3], use function notation to get f(3) = 27 and f(1) = 1. Apply the average rate of change formula: (27 - 1)/(3 - 1) = 26/2 = 13. The average rate of change is 13."
          - problem: "The average rate of change of f(x) = x^2 on [2, b] is 7. Find b."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For f(x) = x^2 on [2, b], function notation gives f(b) = b^2 and f(2) = 4. The average rate of change formula gives (b^2 - 4)/(b - 2) = 7. Since b is not 2, simplify the left side to b + 2, so b + 2 = 7 and b = 5. The value of b is 5."
          - problem: "A cart moves so that its distance in meters after t seconds is s(t) = 2t^2 + 1. Find its average velocity on the interval [1, 3]."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For s(t) = 2t^2 + 1 on [1, 3], function notation gives s(3) = 19 and s(1) = 3. Apply the average rate of change formula for velocity: (19 - 3)/(3 - 1) = 16/2 = 8. The average velocity is 8."
      - id: kp2
        name: Non-polynomial functions and fractional answers
        key_prerequisites: [slope]
        constraints: "sqrt(x) or 1/x with endpoints chosen so f(a), f(b) are exact; answers as exact fractions"
        exemplars:
          - problem: 'Find the average rate of change of $f(x) = \sqrt{x}$ on $[1, 9]$.'
            answer: "1/4"
            solution_sketch: '$\frac{3 - 1}{9 - 1} = \frac{2}{8} = \frac{1}{4}$.'
          - problem: 'Find the average rate of change of $f(x) = \frac{1}{x}$ on $[1, 4]$.'
            answer: "-1/4"
            solution_sketch: '$\frac{1/4 - 1}{4 - 1} = \frac{-3/4}{3} = -\frac{1}{4}$.'
          - problem: "Find the average rate of change of f(x) = sqrt(x) on [9, 25], and give the answer as an exact fraction."
            answer: "1/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the average rate of change rule (f(b)-f(a))/(b-a). Here f(x)=sqrt(x), a=9, b=25, so f(9)=3 and f(25)=5. Substitute: (5-3)/(25-9)=2/16=1/8. The average rate of change is 1/8."
          - problem: "Find the average rate of change of f(x) = 1/x on [2, 6], and give the answer as an exact fraction."
            answer: "-1/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the average rate of change rule (f(b)-f(a))/(b-a). Here f(x)=1/x, a=2, b=6, so f(2)=1/2 and f(6)=1/6. Substitute: (1/6-1/2)/(6-2)=(-1/3)/4=-1/12. The average rate of change is -1/12."
          - problem: "The average rate of change of f(x) = 1/x on [b, 2] is -3/10. Find b, and give the answer as an exact fraction."
            answer: "5/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the average rate of change rule (f(b)-f(a))/(b-a). For f(x)=1/x on [b,2], f(b)=1/b and f(2)=1/2, so (1/2-1/b)/(2-b) simplifies to -1/(2b). Set -1/(2b)=-3/10 and solve: 2b=10/3, so b=5/3. The value of b is 5/3."
          - problem: "The average rate of change of f(x) = sqrt(x) on [1, b] is 2/5. Find b, and give the answer as an exact fraction."
            answer: "9/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the average rate of change rule (f(b)-f(a))/(b-a). For f(x)=sqrt(x) on [1,b], f(1)=1 and f(b)=sqrt(b), so (sqrt(b)-1)/(b-1) simplifies to 1/(sqrt(b)+1). Set 1/(sqrt(b)+1)=2/5 and solve: sqrt(b)+1=5/2, so sqrt(b)=3/2 and b=9/4. The value of b is 9/4."
    diagnostic_exemplar:
      problem: 'Find the average rate of change of $f(x) = \sqrt{x}$ on $[4, 16]$.'
      answer: "1/6"
      solution_sketch: '$\frac{f(16) - f(4)}{16 - 4} = \frac{4 - 2}{12} = \frac{1}{6}$.'
    anki_seeds:
      - front: "Average rate of change of f on [a, b] = ?"
        back: "(f(b) - f(a)) / (b - a) — the slope of the secant line."
        type: basic
