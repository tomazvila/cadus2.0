unit: rational-functions
course: precalculus
module: "Rational Functions & Asymptotes"
topics:
  - id: vertical-horizontal-asymptotes
    name: Vertical and Horizontal Asymptotes
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: rational-expressions
        weight: 0.7
        key: true
      - id: domain-range
        weight: 0.5
        key: true
      - id: factoring-trinomials
        weight: 0.4
      - id: negative-zero-exponents
        weight: 0.2
      # the y = k/x reciprocal parent graph is the on-ramp picture for asymptote
      # behavior (re-audit R-03); familiarity, not full encompassment.
      - id: inverse-variation
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Vertical asymptotes and holes
        key_prerequisites: [rational-expressions, factoring-trinomials]
        constraints: "denominators factor over the integers; include one hole case (common factor)"
        exemplars:
          - problem: 'Find the vertical asymptotes of $f(x) = \frac{x + 1}{(x - 2)(x + 3)}$.'
            answer: "2, -3"
            answer_contract: {kind: list, ordered: false, member: {kind: exact}}
            solution_sketch: 'The denominator vanishes at $x = 2$ and $x = -3$, with no canceled factors: vertical asymptotes $x = 2$ and $x = -3$.'
          - problem: 'Does $f(x) = \frac{x^2 - 1}{x - 1}$ have a vertical asymptote at $x = 1$, or a hole?'
            answer: "a hole"
            answer_contract: {kind: label, options: [[a hole], [a vertical asymptote]]}
            solution_sketch: '$\frac{(x-1)(x+1)}{x-1}$ simplifies to $x + 1$; the factor cancels.'
      - id: kp2
        name: Horizontal asymptotes by comparing degrees
        key_prerequisites: [rational-expressions]
        constraints: "cover all three cases: deg top < deg bottom, equal, greater"
        exemplars:
          - problem: 'Find the horizontal asymptote of $f(x) = \frac{2x + 1}{x - 3}$.'
            answer: "y = 2"
            solution_sketch: 'Equal degrees: ratio of leading coefficients.'
          - problem: 'Find the horizontal asymptote of $f(x) = \frac{x}{x^2 + 1}$.'
            answer: "y = 0"
          - problem: "Select the horizontal asymptote of $f(x) = \\frac{4x^3}{x^2 + 1}$."
            answer: "DNE"
            answer_contract: {"kind": "label", "options": [["DNE", "does not exist"], ["0"], ["2"], ["4"]]}
            solution_sketch: "The function is $f(x) = \\frac{4x^3}{x^2 + 1}$. Rule: compare the degree of the numerator with the degree of the denominator first. The numerator degree is 3 and the denominator degree is 2, so the top degree is greater. Rule: when the top degree is greater, the ratio $\\frac{4x^3}{x^2+1}$ grows without bound, so no horizontal line is approached. The option 0 fits the case where the top degree is smaller, the option 4 uses the leading coefficient alone, and the option 2 comes from a ratio of degrees. The correct option is DNE."
          - problem: "Find the y-value of the horizontal asymptote of $f(x) = \\frac{3x^2 + 1}{x^2 - 4}$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is $f(x) = \\frac{3x^2 + 1}{x^2 - 4}$. Rule: compare the degrees of the numerator and denominator. The numerator degree is 2 and the denominator degree is 2, so the degrees are equal. Rule: for equal degrees, the horizontal asymptote is the ratio of leading coefficients. The leading coefficients are 3 and 1, so the ratio is 3. The answer is 3."
          - problem: "Find the y-value of the horizontal asymptote of $f(x) = \\frac{x + 5}{x^2 + 2x + 7}$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is $f(x) = \\frac{x + 5}{x^2 + 2x + 7}$. Rule: compare the degrees of the numerator and denominator. The numerator degree is 1 and the denominator degree is 2, so the top degree is smaller. Rule: when the top degree is smaller, the horizontal asymptote is $y = 0$. The y-value is 0. The answer is 0."
          - problem: "Find the y-value of the horizontal asymptote of $f(x) = \\frac{x^2 + 3}{2x^2 - 5}$."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function is $f(x) = \\frac{x^2 + 3}{2x^2 - 5}$. Rule: compare the degrees of the numerator and denominator. Both degrees are 2, so the degrees are equal. Rule: for equal degrees, take the ratio of the leading coefficients. The leading coefficients are 1 and 2, so the ratio is $\\frac{1}{2}$. The answer is 1/2."
      - id: kp3
        name: Full asymptote inventory
        key_prerequisites: [rational-expressions, domain-range]
        constraints: "numerator and denominator of degree <= 2; denominators factor over the integers; report every vertical asymptote plus the horizontal asymptote (or its absence)"
        exemplars:
          - problem: "Find all asymptotes of f(x) = (3x^2 + 1)/(x^2 - 4). Give the vertical asymptotes in increasing order followed by the horizontal asymptote as (a, b, c)."
            answer: "(-2, 2, 3)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Factor the denominator as (x - 2)(x + 2). Set each factor to zero: the vertical asymptotes are x = -2 and x = 2. The numerator and denominator have equal degree 2, so the horizontal asymptote is y = 3. The full inventory is (-2, 2, 3)."
          - problem: "Find all asymptotes of f(x) = 1/(x + 5). Give the vertical asymptote followed by the horizontal asymptote as (a, b)."
            answer: "(-5, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set the denominator x + 5 to zero: the vertical asymptote is x = -5. The numerator has degree 0 and the denominator has degree 1, so the horizontal asymptote is y = 0. The full inventory is (-5, 0)."
          - problem: "Find all asymptotes of f(x) = (x + 1)/(x^2 - 9). Give the vertical asymptotes in increasing order followed by the horizontal asymptote as (a, b, c)."
            answer: "(-3, 3, 0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Factor the denominator as (x - 3)(x + 3). Set each factor to zero: the vertical asymptotes are x = -3 and x = 3. The numerator has degree 1 and the denominator has degree 2, so the horizontal asymptote is y = 0. The full inventory is (-3, 3, 0)."
          - problem: "Find the vertical asymptote of f(x) = (2x^2 + 1)/(x - 4) and determine the horizontal asymptote. Give the answer as vertical = x-value; horizontal = value."
            answer: "vertical = 4; horizontal = DNE"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "vertical"}, {"contract": {"kind": "label", "options": [["DNE", "does not exist"], ["0"], ["2"], ["4"]]}, "name": "horizontal"}]}
            solution_sketch: "Vertical asymptote rule: set the denominator x - 4 to zero, so x = 4. Horizontal asymptote rule: the numerator degree 2 is greater than the denominator degree 1, so there is no horizontal asymptote. Choosing 0 would confuse the rule for a smaller numerator degree, choosing 2 would take the leading coefficient ratio without checking the degrees, and choosing 4 would copy the vertical asymptote value. The full inventory is vertical = 4; horizontal = DNE."
          - problem: "Find all asymptotes of f(x) = (2x^2 + 3)/(x^2 - 1). Give the vertical asymptotes in increasing order followed by the horizontal asymptote as (a, b, c)."
            answer: "(-1, 1, 2)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Factor the denominator as (x - 1)(x + 1). Set each factor to zero: the vertical asymptotes are x = -1 and x = 1. The numerator and denominator have equal degree 2, so the horizontal asymptote is y = 2. The full inventory is (-1, 1, 2)."
          - problem: "Find all asymptotes of f(x) = (3x + 1)/(x - 2). Give the vertical asymptote followed by the horizontal asymptote as (a, b)."
            answer: "(2, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Set the denominator x - 2 to zero: the vertical asymptote is x = 2. The numerator and denominator have equal degree 1, so the horizontal asymptote is y = 3. The full inventory is (2, 3)."
    diagnostic_exemplar:
      problem: 'Find every vertical asymptote, every hole, and the horizontal asymptote of $f(x) = \frac{2x^2 - 6x}{x^2 - 9}$.'
      answer: 'hole at x = 3; vertical asymptote x = -3; horizontal asymptote y = 2'
      answer_contract: {kind: none}
      solution_sketch: '$f(x) = \frac{2x(x-3)}{(x-3)(x+3)} = \frac{2x}{x+3}$ for $x \neq 3$: the canceled factor leaves a hole at $x = 3$, the surviving zero gives $x = -3$, and equal degrees give $y = 2$.'
    anki_seeds:
      - front: "Horizontal asymptote when numerator and denominator have equal degree?"
        back: "y = (ratio of leading coefficients)"
        type: basic
      - front: "A canceled common factor in a rational function produces a ... , not a vertical asymptote."
        back: "hole"
        type: basic

  - id: slant-asymptotes
    name: Slant Asymptotes
    core: false                # supplemental: special-case technique feeding only the graphing leaf
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: polynomial-division
        weight: 0.7
        key: true
      - id: vertical-horizontal-asymptotes
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: When a slant asymptote exists
        key_prerequisites: [vertical-horizontal-asymptotes]
        constraints: "slant iff numerator degree = denominator degree + 1"
        exemplars:
          - problem: 'Does $f(x) = \frac{x^2 + 1}{x - 1}$ have a slant asymptote?'
            answer: "yes"
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'Numerator degree is exactly one more than denominator degree.'
          - problem: 'Does $f(x) = \frac{x^3}{x - 1}$ have a slant asymptote?'
            answer: "no"
            answer_contract: {kind: label, options: [[yes], [no]]}
            solution_sketch: 'The degree gap is $2$, so the quotient is quadratic, not linear.'
      - id: kp2
        name: Find the slant asymptote by division
        key_prerequisites: [polynomial-division]
        constraints: "the asymptote is the quotient of the division; ask for the expression mx + b alone"
        exemplars:
          - problem: 'The graph of $f(x) = \frac{x^2 + 3x + 5}{x + 1}$ has slant asymptote $y = mx + b$. Give the expression $mx + b$.'
            answer: "x + 2"
            solution_sketch: '$x^2 + 3x + 5 = (x + 1)(x + 2) + 3$; discard the remainder, leaving $y = x + 2$.'
          - problem: 'The graph of $f(x) = \frac{x^2 - 4x + 1}{x - 2}$ has slant asymptote $y = mx + b$. Give the expression $mx + b$.'
            answer: "x - 2"
            solution_sketch: '$x^2 - 4x + 1 = (x - 2)(x - 2) - 3$, so the asymptote is $y = x - 2$.'
          - problem: "The graph of $f(x) = \\frac{2x^3 + 3x^2 - 5x + 1}{x^2 + x + 1}$ has slant asymptote $y = mx + b$. Give the expression $mx + b$."
            answer: "2x + 1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the division $2x^3 + 3x^2 - 5x + 1$ by $x^2 + x + 1$. Polynomial division gives quotient $2x + 1$ and remainder $-8x$, because $(x^2 + x + 1)(2x + 1) = 2x^3 + 3x^2 + 3x + 1$. The slant asymptote is the quotient, so the expression is 2x + 1."
          - problem: "The average cost per unit for a product is $A(x) = \\frac{3x^2 + 7x + 2}{x}$, where $x$ is the number of units. Its graph has slant asymptote $y = mx + b$. Give the expression $mx + b$."
            answer: "3x + 7"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the average cost ratio $3x^2 + 7x + 2$ over $x$. Polynomial division gives quotient $3x + 7$ and remainder $2$, because $(x)(3x + 7) = 3x^2 + 7x$. The slant asymptote is the quotient, so the expression is 3x + 7."
          - problem: "The graph of $f(x) = \\frac{-x^3 + 2x^2 + x - 4}{x^2 - x + 1}$ has slant asymptote $y = mx + b$. Give the expression $mx + b$."
            answer: "-x + 1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the division $-x^3 + 2x^2 + x - 4$ by $x^2 - x + 1$. Polynomial division gives quotient $-x + 1$ and remainder $3x - 5$, because $(x^2 - x + 1)(-x + 1) = -x^3 + 2x^2 - 2x + 1$. The slant asymptote is the quotient, so the expression is -x + 1."
          - problem: "The graph of $f(x) = \\frac{2x^2 + 5x + 1}{x + 1}$ has slant asymptote $y = mx + b$. Give the expression $mx + b$."
            answer: "2x + 3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Write the division $2x^2 + 5x + 1$ by $x + 1$. Polynomial division gives quotient $2x + 3$ and remainder $-2$, since $(x + 1)(2x + 3) = 2x^2 + 5x + 3$. The slant asymptote is the quotient, so the expression is 2x + 3."
    diagnostic_exemplar:
      problem: 'The graph of $f(x) = \frac{x^2 + x}{x - 1}$ has slant asymptote $y = mx + b$. Give the expression $mx + b$.'
      answer: "x + 2"
      solution_sketch: '$x^2 + x = (x - 1)(x + 2) + 2$, so the asymptote is $y = x + 2$.'
    anki_seeds:
      - front: "A rational function has a slant asymptote exactly when..."
        back: "The numerator's degree is exactly one more than the denominator's; the asymptote is the quotient from polynomial division."
        type: basic

  - id: graphing-rational-functions
    name: Graphing Rational Functions
    core: false                # supplemental, with slant-asymptotes: terminal graphing branch
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: vertical-horizontal-asymptotes
        weight: 0.7
        key: true
      - id: slant-asymptotes
        weight: 0.4
      - id: domain-range
        weight: 0.4
      - id: graphing-linear-equations
        weight: 0.3
      - id: quadratic-graphs-vertex
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Intercepts
        key_prerequisites: [vertical-horizontal-asymptotes]
        constraints: "x-intercepts from numerator zeros (never where the denominator vanishes); y-intercept as f(0); integer or small-fraction coordinates"
        exemplars:
          - problem: 'Find the $x$- and $y$-intercepts of $f(x) = \frac{x - 2}{x + 1}$.'
            answer: "x_intercept = (2, 0); y_intercept = (0, -2)"
            answer_contract: {kind: multipart, parts: [{name: x_intercept, contract: {kind: coordinates, arity: 2}}, {name: y_intercept, contract: {kind: coordinates, arity: 2}}]}
          - problem: 'Find the intercepts of $f(x) = \frac{x^2 - 1}{x^2 - 4}$.'
            answer: "left_intercept = (-1, 0); right_intercept = (1, 0); y_intercept = (0, 1/4)"
            answer_contract: {kind: multipart, parts: [{name: left_intercept, contract: {kind: coordinates, arity: 2}}, {name: right_intercept, contract: {kind: coordinates, arity: 2}}, {name: y_intercept, contract: {kind: coordinates, arity: 2}}]}
            solution_sketch: '$f(0) = \frac{-1}{-4} = \frac{1}{4}$.'
      - id: kp2
        name: Behavior near a vertical asymptote
        key_prerequisites: [vertical-horizontal-asymptotes]
        constraints: "one-sided sign analysis via test points"
        exemplars:
          - problem: 'For $f(x) = \frac{1}{x - 3}$, does $f(x)$ go to $+\infty$ or $-\infty$ as $x$ approaches $3$ from the right?'
            answer: "+∞"
            answer_contract: {kind: label, options: [[+∞], [-∞]]}
            solution_sketch: 'Just right of $3$, the denominator is small and positive.'
          - problem: 'For $f(x) = \frac{1}{x - 3}$, what happens as $x$ approaches $3$ from the left?'
            answer: "-∞"
            answer_contract: {kind: label, options: [[-∞], [+∞]]}
            solution_sketch: 'Just left of $3$, the denominator is small and negative, so $f(x) \to -\infty$.'
      - id: kp3
        name: Assemble the full feature set
        key_prerequisites: [vertical-horizontal-asymptotes, slant-asymptotes]
        constraints: "degrees <= 2 with integer zeros and poles; list vertical asymptote(s), horizontal asymptote, and intercepts in one answer"
        exemplars:
          - problem: 'For $f(x) = \frac{x^2 - 1}{x^2 - 4}$, list the vertical asymptotes, horizontal asymptote, and intercepts.'
            answer: "VA: x = 2, x = -2; HA: y = 1; x-intercepts (±1, 0); y-intercept (0, 1/4)"
            answer_contract: {kind: none}
            solution_sketch: 'Vertical asymptotes $x = \pm 2$; equal degrees give $y = 1$; intercepts $(\pm 1, 0)$ and $(0, 1/4)$.'
          - problem: 'For $f(x) = \frac{2x}{x + 3}$, list the asymptotes and intercepts.'
            answer: "VA: x = -3; HA: y = 2; intercept (0, 0)"
            answer_contract: {kind: none}
            solution_sketch: 'Vertical asymptote $x = -3$; equal degrees give $y = 2$; the origin is both intercepts.'
    diagnostic_exemplar:
      problem: 'For $f(x) = \frac{x + 3}{x - 1}$, state the vertical asymptote, the horizontal asymptote, both intercepts, and whether $f(x) \to +\infty$ or $-\infty$ as $x \to 1^+$.'
      answer: 'VA: x = 1; HA: y = 1; x-intercept (-3, 0); y-intercept (0, -3); f(x) → +∞ as x → 1⁺'
      answer_contract: {kind: none}
      solution_sketch: 'The denominator vanishes at $x = 1$ (numerator $4 \neq 0$ there), equal degrees give $y = 1$, $f(0) = -3$, $f(-3) = 0$; just right of $1$ the numerator is positive and the denominator is a small positive, so $f \to +\infty$.'
    anki_seeds:
      - front: "Intercepts of a rational function f = p/q:"
        back: "x-intercepts where p(x) = 0 (and q(x) ≠ 0); y-intercept is f(0)."
        type: basic
      - front: "To decide whether f goes to +∞ or −∞ beside a vertical asymptote..."
        back: "test the sign of f at a point just to that side of the asymptote."
        type: basic

  - id: rational-inequalities
    name: Rational Inequalities
    core: false                # supplemental: extension of polynomial-inequalities; terminal
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: polynomial-inequalities
        weight: 0.6
        key: true
      - id: rational-equations
        weight: 0.5
        key: true
      - id: vertical-horizontal-asymptotes
        weight: 0.4
      - id: compound-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Sign chart for a single ratio
        key_prerequisites: [polynomial-inequalities]
        constraints: "linear numerator and denominator with integer zeros"
        exemplars:
          - problem: 'Solve $\frac{x - 2}{x + 1} > 0$.'
            answer: "x < -1 or x > 2"
            answer_contract: {kind: inequality_union}
            solution_sketch: 'Critical points $-1$ and $2$; the ratio is positive outside them.'
          - problem: 'Solve $\frac{x + 5}{x - 3} < 0$.'
            answer: "-5 < x < 3"
      - id: kp2
        name: Move everything to one side first
        key_prerequisites: [rational-equations, polynomial-inequalities]
        constraints: "never multiply both sides by an expression of unknown sign"
        exemplars:
          - problem: 'Solve $\frac{x}{x - 3} \le 2$.'
            answer: "x < 3 or x ≥ 6"
            answer_contract: {kind: inequality_union}
            solution_sketch: '$\frac{x}{x-3} - 2 = \frac{6 - x}{x - 3} \le 0$; sign chart over $3$ and $6$.'
          - problem: 'Solve $\frac{2}{x} \ge 1$ for $x \ne 0$.'
            answer: "0 < x ≤ 2"
            solution_sketch: '$\frac{2 - x}{x} \ge 0$: both parts positive exactly on $(0, 2]$.'
      - id: kp3
        name: Endpoints at zeros versus undefined points
        key_prerequisites: [polynomial-inequalities]
        constraints: "non-strict inequalities only; numerator zeros included, denominator zeros always excluded; linear numerator and denominator with integer zeros"
        exemplars:
          - problem: 'Solve $\frac{x + 2}{x - 1} \ge 0$.'
            answer: "x ≤ -2 or x > 1"
            answer_contract: {kind: inequality_union}
            solution_sketch: 'Include $x = -2$ (numerator zero); exclude $x = 1$ (undefined).'
          - problem: 'In $\frac{x - 4}{x + 3} \le 0$, which endpoint is included: $4$ or $-3$?'
            answer: "4"
            solution_sketch: 'The numerator zero $4$ is included; the denominator zero $-3$ is excluded: solution $-3 < x \le 4$.'
    diagnostic_exemplar:
      problem: 'Solve $\frac{x}{x - 2} \le 3$.'
      answer: "x < 2 or x ≥ 3"
      answer_contract: {kind: inequality_union}
      solution_sketch: 'Move everything left: $\frac{x}{x-2} - 3 = \frac{6 - 2x}{x - 2} \le 0$; sign chart over $2$ and $3$; include $x = 3$ (numerator zero), exclude $x = 2$ (undefined).'
    anki_seeds:
      - front: "Why can't you multiply both sides of a rational inequality by the denominator?"
        back: "The denominator's sign is unknown; multiplying by a negative would flip the inequality. Move everything to one side and sign-chart instead."
        type: basic
      - front: "In a rational inequality with ≥, points where the denominator is zero are always..."
        back: "Excluded (the function is undefined there)."
        type: basic
