unit: rational-functions
course: precalculus
module: "Rational Functions & Asymptotes"
topics:
  - id: vertical-horizontal-asymptotes
    name: Vertical and Horizontal Asymptotes
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: rational-expressions
        weight: 0.7
        key: true
      - id: domain-range
        weight: 0.5
        key: true
      - id: factoring-trinomials
        weight: 0.4
      - id: negative-zero-exponents
        weight: 0.2
      # the y = k/x reciprocal parent graph is the on-ramp picture for asymptote
      # behavior (re-audit R-03); familiarity, not full encompassment.
      - id: inverse-variation
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Vertical asymptotes and holes'
        key_prerequisites: [rational-expressions, factoring-trinomials]
        constraints: 'denominators factor over the integers; include one hole case (common factor)'
        exemplars:
          - problem: 'Find the vertical asymptotes of $f(x) = \frac{x + 1}{(x - 2)(x + 3)}$.'
            answer: '2, -3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator is zero at $x = 2$ and at $x = -3$. The numerator $x + 1$ is not zero at either value, so no factor cancels and both values give vertical asymptotes.'
          - problem: 'Does the graph of $f(x) = \frac{x^2 - 1}{x - 1}$ have a vertical asymptote at $x = 1$, or a hole there?'
            answer: 'hole'
            answer_contract: {"kind":"label","options":[["hole","a hole","it has a hole"],["asymptote","a vertical asymptote","vertical asymptote"]]}
            solution_sketch: 'The numerator factors as $(x - 1)(x + 1)$, so the factor $x - 1$ cancels with the denominator. A canceled factor leaves a hole, so the graph has a hole at $x = 1$ and no vertical asymptote there.'
          - problem: 'Find the vertical asymptotes of $f(x) = \frac{x - 5}{x^2 - x - 12}$.'
            answer: '4, -3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor the denominator as $(x - 4)(x + 3)$. The numerator $x - 5$ is not zero at $x = 4$ or at $x = -3$, so both values are vertical asymptotes.'
          - problem: 'Where does the graph of $f(x) = \frac{x^2 - 4}{(x - 3)(x + 2)}$ have a hole? Give the coordinates of the point.'
            answer: '(-2, 4/5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Factor the numerator as $(x - 2)(x + 2)$. The factor $x + 2$ cancels, so the hole is at $x = -2$. The reduced function is $\frac{x - 2}{x - 3}$, and its value at $-2$ is $\frac{-4}{-5} = \frac{4}{5}$, so the hole is the point $\left(-2, \frac{4}{5}\right)$.'
          - problem: 'Removing $p$ percent of the pollution from a lake costs $C(p) = \frac{80p}{100 - p}$ thousand dollars, for $0 \le p < 100$. At what value of $p$ does the graph of $C$ have a vertical asymptote?'
            answer: '100'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $100 - p$ is zero at $p = 100$, and the numerator $80p$ is $8000$ there, so it is not zero. The line $p = 100$ is a vertical asymptote: the cost grows without bound as the cleanup nears $100$ percent.'
          - problem: 'Mia says that $f(x) = \frac{x - 3}{x^2 - 9}$ has vertical asymptotes at $x = 3$ and $x = -3$. What are the correct vertical asymptotes?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor the denominator as $(x - 3)(x + 3)$. The factor $x - 3$ cancels with the numerator, so $x = 3$ is a hole. Only $x = -3$ stays as a vertical asymptote.'
          - problem: 'Does the graph of $f(x) = \frac{x + 4}{x^2 + 16}$ have a vertical asymptote?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it has one"],["no","it does not","it has none"]]}
            solution_sketch: 'The denominator $x^2 + 16$ is at least $16$ for every real $x$, so it is never zero. No value of $x$ makes the denominator zero, so the graph has no vertical asymptote.'
          - problem: 'A file of $600$ megabytes downloads while other traffic uses $20$ megabytes per hour of the link. With a link speed of $b$ megabytes per hour, $b > 20$, the download takes $T(b) = \frac{600}{b - 20}$ hours. At which value of $b$ does the graph of $T$ have a vertical asymptote?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $b - 20$ is zero at $b = 20$, and the numerator $600$ is never zero. The line $b = 20$ is a vertical asymptote: the download time grows without bound as the link speed falls toward the $20$ megabytes per hour that other traffic uses.'
      - id: kp2
        name: 'Horizontal asymptotes by comparing degrees'
        key_prerequisites: [rational-expressions]
        constraints: 'cover all three cases: deg top < deg bottom, equal, greater'
        exemplars:
          - problem: 'Find the horizontal asymptote of $f(x) = \frac{2x + 1}{x - 3}$.'
            answer: 'y = 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator and the denominator both have degree $1$, so the horizontal asymptote is the ratio of the leading coefficients. That ratio is $\frac{2}{1} = 2$, so the horizontal asymptote is $y = 2$.'
          - problem: 'Find the horizontal asymptote of $f(x) = \frac{x}{x^2 + 1}$.'
            answer: 'y = 0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator has degree $1$ and the denominator has degree $2$. The denominator grows faster, so $f(x)$ approaches $0$ and the horizontal asymptote is $y = 0$.'
          - problem: 'Which is the horizontal asymptote of $f(x) = \frac{4x^3}{x^2 + 1}$: $y = 0$, $y = 2$, $y = 4$, or is there none?'
            answer: 'none'
            answer_contract: {"kind":"label","options":[["none","there is none","no horizontal asymptote","does not exist","dne"],["y = 0","0"],["y = 2","2"],["y = 4","4"]]}
            solution_sketch: 'The numerator has degree $3$ and the denominator has degree $2$, so the numerator grows faster. For large $x$ the ratio $\frac{4x^3}{x^2 + 1}$ is close to $4x$, which grows without bound, so no horizontal line is approached. There is no horizontal asymptote.'
          - problem: 'Find the horizontal asymptote of $f(x) = \frac{3x^2 + 1}{x^2 - 4}$.'
            answer: 'y = 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both degrees are $2$, so the horizontal asymptote is the ratio of the leading coefficients. That ratio is $\frac{3}{1} = 3$, so the horizontal asymptote is $y = 3$.'
          - problem: 'A company''s average cost per unit is $A(x) = \frac{4x + 500}{x}$ dollars when it makes $x$ units. What value does the average cost approach as production grows very large?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Both degrees are $1$, so the horizontal asymptote is the ratio of the leading coefficients, $\frac{4}{1} = 4$. As $x$ grows, the fixed cost $500$ is spread over more units, so the average cost approaches $4$ dollars.'
          - problem: 'A tank holds $40$ litres of pure water. Salt water with $0.6$ kilograms of salt per litre is pumped in at $5$ litres per minute. After $t$ minutes the concentration of salt is $c(t) = \frac{3t}{40 + 5t}$ kilograms per litre. What value does the concentration approach in the long run?'
            answer: '3/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator $3t$ and the denominator $5t + 40$ both have degree $1$, so the horizontal asymptote is $y = \frac{3}{5}$. The concentration approaches $\frac{3}{5} = 0.6$ kilograms per litre, which is the concentration of the incoming salt water.'
          - problem: 'Find the horizontal asymptote of $f(x) = \frac{x^2 + 3}{2x^2 - 5}$.'
            answer: 'y = 1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both degrees are $2$, and the leading coefficients are $1$ and $2$. The horizontal asymptote is $y = \frac{1}{2}$.'
          - problem: 'Omar says the horizontal asymptote of $f(x) = \frac{x + 5}{x^2 + 2x + 7}$ is $y = 1$, because both leading coefficients are $1$. What is the correct horizontal asymptote?'
            answer: 'y = 0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator has degree $1$ and the denominator has degree $2$. When the denominator has the higher degree, $f(x)$ approaches $0$ for large $x$, so the horizontal asymptote is $y = 0$. The rule about leading coefficients applies only when the degrees are equal.'
          - problem: 'The concentration of a drug in the blood is $C(t) = \frac{8t}{t^2 + 4}$ milligrams per litre, $t$ hours after an injection. What level does the concentration approach as time goes on?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator $8t$ has degree $1$ and the denominator $t^2 + 4$ has degree $2$, so the denominator grows faster. The concentration approaches $0$, and the horizontal asymptote is $C = 0$.'
          - problem: 'Find the horizontal asymptote of $f(x) = \frac{-3x + 1}{2x - 5}$.'
            answer: 'y = -3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both degrees are $1$. The leading coefficients are $-3$ and $2$, so the horizontal asymptote is $y = -\frac{3}{2}$.'
      - id: kp3
        name: 'Full asymptote inventory'
        key_prerequisites: [rational-expressions, domain-range]
        constraints: 'numerator and denominator of degree <= 2; denominators factor over the integers; report every vertical asymptote plus the horizontal asymptote (or its absence)'
        exemplars:
          - problem: 'Find the vertical asymptotes and the horizontal asymptote of $f(x) = \frac{3x^2 + 1}{x^2 - 4}$.'
            answer: 'vertical = -2, 2; horizontal = 3'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}}]}
            solution_sketch: 'Factor the denominator as $(x - 2)(x + 2)$. The numerator is not zero at $x = 2$ or at $x = -2$, so these are the vertical asymptotes. The degrees are equal, so the horizontal asymptote is the ratio of the leading coefficients, $\frac{3}{1} = 3$.'
          - problem: 'Find the vertical asymptote and the horizontal asymptote of $f(x) = \frac{1}{x + 5}$.'
            answer: 'vertical = -5; horizontal = 0'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}}]}
            solution_sketch: 'The denominator $x + 5$ is zero at $x = -5$, and the numerator $1$ is never zero, so $x = -5$ is the vertical asymptote. The numerator has degree $0$ and the denominator has degree $1$, so the horizontal asymptote is $y = 0$.'
          - problem: 'Find all the asymptotes of $f(x) = \frac{x + 1}{x^2 - 9}$.'
            answer: 'vertical = -3, 3; horizontal = 0'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}}]}
            solution_sketch: 'Factor the denominator as $(x - 3)(x + 3)$. The numerator $x + 1$ is not zero at $x = 3$ or at $x = -3$, so both are vertical asymptotes. The denominator has the higher degree, so the horizontal asymptote is $y = 0$.'
          - problem: 'Find the vertical asymptote, the horizontal asymptote and the hole of $f(x) = \frac{3x^2 - 12x}{x^2 - 16}$.'
            answer: 'vertical = -4; horizontal = 3; hole = (4, 3/2)'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}},{"name":"hole","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'Factor to get $f(x) = \frac{3x(x - 4)}{(x - 4)(x + 4)}$. The factor $x - 4$ cancels, so there is a hole at $x = 4$, where the reduced function $\frac{3x}{x + 4}$ has the value $\frac{12}{8} = \frac{3}{2}$. The factor $x + 4$ remains, so the vertical asymptote is $x = -4$, and the equal degrees give the horizontal asymptote $y = 3$.'
          - problem: 'A print shop''s average cost per poster is $A(x) = \frac{3x + 240}{x}$ dollars when it prints $x$ posters. Find the vertical asymptote and the horizontal asymptote of the graph of $A$.'
            answer: 'vertical = 0; horizontal = 3'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}}]}
            solution_sketch: 'The denominator $x$ is zero at $x = 0$, and the numerator $3x + 240$ is $240$ there, so $x = 0$ is the vertical asymptote. Both degrees are $1$, so the horizontal asymptote is $y = \frac{3}{1} = 3$: for a very large run each poster costs about $3$ dollars.'
          - problem: 'A lens of focal length $12$ centimetres forms an image at the distance $q(p) = \frac{12p}{p - 12}$ centimetres when the object is $p$ centimetres from the lens, $p > 12$. Find the vertical asymptote and the horizontal asymptote of $q$.'
            answer: 'vertical = 12; horizontal = 12'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}}]}
            solution_sketch: 'The denominator $p - 12$ is zero at $p = 12$, and the numerator $12p$ is not, so the vertical asymptote is $p = 12$. Both degrees are $1$, so the horizontal asymptote is $q = \frac{12}{1} = 12$.'
          - problem: 'Does the graph of $f(x) = \frac{2x^2 + 1}{x - 4}$ have a vertical asymptote, a horizontal asymptote, both, or neither?'
            answer: 'vertical only'
            answer_contract: {"kind":"label","options":[["vertical only","only a vertical asymptote","a vertical asymptote only"],["horizontal only","only a horizontal asymptote","a horizontal asymptote only"],["vertical and horizontal","both"],["neither one","neither","none"]]}
            solution_sketch: 'The denominator $x - 4$ is zero at $x = 4$, and the numerator is not, so there is a vertical asymptote at $x = 4$. The numerator has degree $2$, which is greater than the denominator degree $1$, so there is no horizontal asymptote. The graph has a vertical asymptote only.'
          - problem: 'Find the vertical asymptotes and the horizontal asymptote of $f(x) = \frac{x^2 + 4x}{x^2 + x - 6}$.'
            answer: 'vertical = -3, 2; horizontal = 1'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}}]}
            solution_sketch: 'Factor the denominator as $(x + 3)(x - 2)$ and the numerator as $x(x + 4)$. No factor cancels, so $x = -3$ and $x = 2$ are vertical asymptotes. The degrees are equal and the leading coefficients are both $1$, so the horizontal asymptote is $y = 1$.'
    diagnostic_exemplar:
      problem: 'Find every vertical asymptote, every hole, and the horizontal asymptote of $f(x) = \frac{2x^2 - 6x}{x^2 - 9}$.'
      answer: 'hole at x = 3; vertical asymptote x = -3; horizontal asymptote y = 2'
      answer_contract: {kind: none}
      solution_sketch: '$f(x) = \frac{2x(x-3)}{(x-3)(x+3)} = \frac{2x}{x+3}$ for $x \neq 3$: the canceled factor leaves a hole at $x = 3$, the surviving zero gives $x = -3$, and equal degrees give $y = 2$.'
    anki_seeds:
      - front: "Horizontal asymptote when numerator and denominator have equal degree?"
        back: "y = (ratio of leading coefficients)"
        type: basic
      - front: "A canceled common factor in a rational function produces a ... , not a vertical asymptote."
        back: "hole"
        type: basic

  - id: slant-asymptotes
    name: Slant Asymptotes
    core: false                # supplemental: special-case technique feeding only the graphing leaf
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: polynomial-division
        weight: 0.7
        key: true
      - id: vertical-horizontal-asymptotes
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: 'When a slant asymptote exists'
        key_prerequisites: [vertical-horizontal-asymptotes]
        constraints: 'slant iff numerator degree = denominator degree + 1'
        exemplars:
          - problem: 'Does the graph of $f(x) = \frac{x^2 + 3x + 5}{x - 2}$ have a slant asymptote?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it does","it has one"],["no","it does not","it has none"]]}
            solution_sketch: 'The numerator has degree $2$ and the denominator has degree $1$. The numerator degree is exactly one more than the denominator degree, so the graph has a slant asymptote.'
          - problem: 'For which integer $n$ does the graph of $f(x) = \frac{x^5 + 2x}{x^n + 1}$ have a slant asymptote?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator has degree $5$. A slant asymptote needs the denominator degree to be exactly one less, so $n = 5 - 1 = 4$.'
          - problem: 'A laboratory models the concentration of a chemical by $c(t) = \frac{8t^2 + 1}{2t^2 + 5t}$. Does the graph of $c$ have a slant asymptote?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it does","it has one"],["no","it does not","it has none"]]}
            solution_sketch: 'Both the numerator and the denominator have degree $2$. A slant asymptote needs the numerator degree to be exactly one more than the denominator degree, so there is none. The equal degrees give a horizontal asymptote instead.'
          - problem: 'A product has total cost $C(x)$, a polynomial of degree $d$, and its average cost per unit is $A(x) = \frac{C(x)}{x}$. For which value of $d$ does the graph of $A$ have a slant asymptote?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $x$ has degree $1$. A slant asymptote needs the numerator degree to be exactly one more, so $d = 1 + 1 = 2$. A quadratic total cost gives a slant asymptote.'
          - problem: 'A rational function has a numerator of degree $9$, and its graph has a slant asymptote. What is the degree of its denominator?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator degree must be exactly one more than the denominator degree. So the denominator degree is $9 - 1 = 8$.'
          - problem: 'A rational function has a denominator of degree $3$, and its graph has a slant asymptote. What is the degree of its numerator?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator degree must be exactly one more than the denominator degree. So the numerator degree is $3 + 1 = 4$.'
          - problem: 'For which integer $n$ does the graph of $f(x) = \frac{x^n + x}{x^2 - 5}$ have a slant asymptote?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator has degree $2$. A slant asymptote needs the numerator degree to be exactly one more, so $n = 2 + 1 = 3$.'
      - id: kp2
        name: 'Find the slant asymptote by division'
        key_prerequisites: [polynomial-division]
        constraints: 'the asymptote is the quotient of the division; ask for the expression mx + b alone'
        try_first:
          problem: 'Let $f(x) = \frac{x^2 + 1}{x}$. What is $f(1000) - 1000$?'
          answer_contract: {"kind":"exact"}
          answer: '1/1000'
          reveal: 'Since $f(x) = x + \frac{1}{x}$, the graph stays within $\frac{1}{x}$ of the line $y = x$. That leftover shrinks toward $0$, which is why the quotient of the division is the slant asymptote.'
        exemplars:
          - problem: 'Find the slant asymptote of the graph of $f(x) = \frac{x^2 + 3x + 5}{x + 1}$.'
            answer: 'y = x + 2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Divide $x^2 + 3x + 5$ by $x + 1$. Since $x^2 + 3x + 5 = (x + 1)(x + 2) + 3$, the quotient is $x + 2$ and the remainder is $3$. The remainder fraction tends to $0$, so the slant asymptote is $y = x + 2$.'
          - problem: 'Find the slant asymptote of the graph of $f(x) = \frac{x^2 - 4x + 1}{x - 2}$.'
            answer: 'y = x - 2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Since $x^2 - 4x + 1 = (x - 2)(x - 2) - 3$, the quotient is $x - 2$ and the remainder is $-3$. The remainder fraction tends to $0$, so the slant asymptote is $y = x - 2$.'
          - problem: 'Find the slant asymptote of the graph of $f(x) = \frac{2x^3 + 3x^2 - 5x + 1}{x^2 + x + 1}$.'
            answer: 'y = 2x + 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Divide $2x^3 + 3x^2 - 5x + 1$ by $x^2 + x + 1$. Since $(x^2 + x + 1)(2x + 1) = 2x^3 + 3x^2 + 3x + 1$, the quotient is $2x + 1$ and the remainder is $-8x$. The remainder fraction tends to $0$, so the slant asymptote is $y = 2x + 1$.'
          - problem: 'The average cost per unit of a product is $A(x) = \frac{3x^2 + 7x + 2}{x}$ dollars when $x$ units are made. Find the slant asymptote of the graph of $A$.'
            answer: 'y = 3x + 7'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Divide each term of the numerator by $x$: $A(x) = 3x + 7 + \frac{2}{x}$. The fraction $\frac{2}{x}$ tends to $0$ as $x$ grows, so the slant asymptote is $y = 3x + 7$.'
          - problem: 'Find the slant asymptote of the graph of $f(x) = \frac{-x^3 + 2x^2 + x - 4}{x^2 - x + 1}$.'
            answer: 'y = -x + 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Divide $-x^3 + 2x^2 + x - 4$ by $x^2 - x + 1$. Since $(x^2 - x + 1)(-x + 1) = -x^3 + 2x^2 - 2x + 1$, the quotient is $-x + 1$ and the remainder is $3x - 5$. The remainder fraction tends to $0$, so the slant asymptote is $y = -x + 1$.'
          - problem: 'Find the slant asymptote of the graph of $f(x) = \frac{2x^2 + 5x + 1}{x + 1}$.'
            answer: 'y = 2x + 3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Since $(x + 1)(2x + 3) = 2x^2 + 5x + 3$, we get $2x^2 + 5x + 1 = (x + 1)(2x + 3) - 2$. The quotient is $2x + 3$ and the remainder $-2$ is dropped, so the slant asymptote is $y = 2x + 3$.'
          - problem: 'Find the slant asymptote of the graph of $f(x) = \frac{4x^2 + 3x + 5}{2x + 1}$.'
            answer: 'y = 2x + 1/2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Since $(2x + 1)\left(2x + \frac{1}{2}\right) = 4x^2 + 3x + \frac{1}{2}$, the quotient is $2x + \frac{1}{2}$ and the remainder is $\frac{9}{2}$. The remainder fraction tends to $0$, so the slant asymptote is $y = 2x + \frac{1}{2}$.'
          - problem: 'A plant that processes $x$ tonnes a day has an average cost per tonne of $A(x) = \frac{x^2 + 8x + 30}{x + 2}$ dollars. Find the slant asymptote of the graph of $A$.'
            answer: 'y = x + 6'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Since $(x + 2)(x + 6) = x^2 + 8x + 12$, we get $x^2 + 8x + 30 = (x + 2)(x + 6) + 18$. The quotient is $x + 6$ and the remainder $18$ is dropped, so the slant asymptote is $y = x + 6$.'
          - problem: 'Dana says the slant asymptote of $f(x) = \frac{x^2 + 2x - 5}{x - 1}$ is $y = x + 3 - \frac{2}{x - 1}$. What is the correct slant asymptote?'
            answer: 'y = x + 3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Since $(x - 1)(x + 3) = x^2 + 2x - 3$, we get $x^2 + 2x - 5 = (x - 1)(x + 3) - 2$. The remainder term $\frac{-2}{x - 1}$ tends to $0$, so it is not part of the line. The slant asymptote is $y = x + 3$.'
    diagnostic_exemplar:
      problem: 'The graph of $f(x) = \frac{x^2 + x}{x - 1}$ has slant asymptote $y = mx + b$. Give the expression $mx + b$.'
      answer: "x + 2"
      solution_sketch: '$x^2 + x = (x - 1)(x + 2) + 2$, so the asymptote is $y = x + 2$.'
    anki_seeds:
      - front: "A rational function has a slant asymptote exactly when..."
        back: "The numerator's degree is exactly one more than the denominator's; the asymptote is the quotient from polynomial division."
        type: basic

  - id: graphing-rational-functions
    name: Graphing Rational Functions
    core: false                # supplemental, with slant-asymptotes: terminal graphing branch
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: vertical-horizontal-asymptotes
        weight: 0.7
        key: true
      - id: slant-asymptotes
        weight: 0.4
      - id: domain-range
        weight: 0.4
      - id: graphing-linear-equations
        weight: 0.3
      - id: quadratic-graphs-vertex
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: 'Intercepts'
        key_prerequisites: [vertical-horizontal-asymptotes]
        constraints: 'x-intercepts from numerator zeros (never where the denominator vanishes); y-intercept as f(0); integer or small-fraction coordinates'
        exemplars:
          - problem: 'Find the $x$- and $y$-intercepts of $f(x) = \frac{x - 2}{x + 1}$.'
            answer: 'x_int = (2, 0); y_int = (0, -2)'
            answer_contract: {"kind":"multipart","parts":[{"name":"x_int","contract":{"kind":"coordinates","arity":2}},{"name":"y_int","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'The numerator $x - 2$ is zero at $x = 2$, and the denominator is $3$ there, so the $x$-intercept is $(2, 0)$. For the $y$-intercept, $f(0) = \frac{-2}{1} = -2$, so the $y$-intercept is $(0, -2)$.'
          - problem: 'Find the $x$- and $y$-intercepts of $f(x) = \frac{x^2 - 1}{x^2 - 4}$.'
            answer: 'x_int = (-1, 0), (1, 0); y_int = (0, 1/4)'
            answer_contract: {"kind":"multipart","parts":[{"name":"x_int","contract":{"kind":"list","ordered":false,"member":{"kind":"coordinates","arity":2}}},{"name":"y_int","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'The numerator $x^2 - 1 = (x - 1)(x + 1)$ is zero at $x = -1$ and $x = 1$, and the denominator is $-3$ at both points, so the $x$-intercepts are $(-1, 0)$ and $(1, 0)$. For the $y$-intercept, $f(0) = \frac{-1}{-4} = \frac{1}{4}$, so it is $(0, \frac{1}{4})$.'
          - problem: 'Where does the graph of $f(x) = \frac{x - 5}{x + 2}$ cross the $x$-axis?'
            answer: '(5, 0)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The graph crosses the $x$-axis where the numerator $x - 5$ is zero, so $x = 5$. The denominator at $x = 5$ is $7$, which is not zero, so the point is on the graph. The crossing point is $(5, 0)$.'
          - problem: 'Where does the graph of $f(x) = \frac{x^2 - 4}{x - 3}$ cross the $y$-axis?'
            answer: '(0, 4/3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The graph crosses the $y$-axis at $x = 0$, so evaluate $f(0) = \frac{0^2 - 4}{0 - 3} = \frac{-4}{-3} = \frac{4}{3}$. The crossing point is $\left(0, \frac{4}{3}\right)$.'
          - problem: 'Find the $x$-intercepts of $f(x) = \frac{x^2 - 16}{x^2 + 4}$.'
            answer: '-4, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set the numerator $x^2 - 16 = (x - 4)(x + 4)$ equal to zero, which gives $x = 4$ or $x = -4$. The denominator $x^2 + 4$ is never zero, so both values are $x$-intercepts.'
          - problem: 'The profit per unit of a product is $P(x) = \frac{10x - 200}{x + 5}$ dollars when $x$ hundred units are sold. How many hundred units must be sold for the profit per unit to be zero?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The profit per unit is zero where the numerator $10x - 200$ is zero, so $10x = 200$ and $x = 20$. The denominator is $25$ at $x = 20$, so it is not zero. The profit per unit is zero when $20$ hundred units are sold.'
          - problem: 'Find the $x$-intercepts of $f(x) = \frac{x^2 - 25}{x - 5}$.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting the numerator $x^2 - 25 = (x - 5)(x + 5)$ to zero gives $x = 5$ or $x = -5$. At $x = 5$ the denominator is also zero, so the graph has a hole there and no intercept. The only $x$-intercept is at $x = -5$.'
          - problem: 'Use the profit model $P(x) = \frac{10x - 200}{x + 5}$ dollars per unit, where $x$ is the number of hundreds of units sold. What is the profit per unit when no units have been sold?'
            answer: '-40'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'No units sold means $x = 0$, so evaluate $P(0) = \frac{0 - 200}{0 + 5} = \frac{-200}{5} = -40$. The profit per unit is $-40$ dollars, which is a loss of $40$ dollars per unit.'
          - problem: 'Leo says the $y$-intercept of $f(x) = \frac{2x + 1}{x^2 + 3}$ is the point where $2x + 1 = 0$. What is the $y$-intercept?'
            answer: '(0, 1/3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $y$-intercept is the point where the graph meets the $y$-axis, so it needs $x = 0$, not a zero of the numerator. Evaluate $f(0) = \frac{1}{3}$, so the $y$-intercept is $\left(0, \frac{1}{3}\right)$.'
      - id: kp2
        name: 'Behavior near a vertical asymptote'
        key_prerequisites: [vertical-horizontal-asymptotes]
        constraints: 'one-sided sign analysis via test points'
        try_first:
          problem: 'Let $f(x) = \frac{1}{x - 3}$. What is $f(3.01)$?'
          answer_contract: {"kind":"exact"}
          answer: '100'
          reveal: 'The denominator $3.01 - 3 = 0.01$ is a tiny positive number, so $f(3.01) = 100$ is large and positive. A point just beside the asymptote shows which way the graph goes there.'
        exemplars:
          - problem: 'As $x$ approaches $5$ from the right, does $f(x) = \frac{1}{x - 5}$ go to $+\infty$ or to $-\infty$?'
            answer: 'positive infinity'
            answer_contract: {"kind":"label","options":[["+∞","positive infinity","plus infinity","infinity","+infinity","∞"],["-∞","negative infinity","minus infinity","-infinity"]]}
            solution_sketch: 'Just to the right of $5$, the denominator $x - 5$ is a small positive number, and the numerator is $1$. A positive number divided by a small positive number is large and positive, so $f(x)$ goes to $+\infty$.'
          - problem: 'The graph of $f(x) = \frac{x + 2}{x - 6}$ has a vertical asymptote at $x = 6$. Evaluate $f(7)$, a test point to the right of it.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $x = 7$: the numerator is $7 + 2 = 9$ and the denominator is $7 - 6 = 1$. So $f(7) = \frac{9}{1} = 9$, which is positive, so the graph is above the axis to the right of $x = 6$.'
          - problem: 'Just to the left of $x = 4$, does $f(x) = \frac{x + 1}{x - 4}$ go to $+\infty$ or to $-\infty$?'
            answer: 'negative infinity'
            answer_contract: {"kind":"label","options":[["+∞","positive infinity","plus infinity","infinity","+infinity","∞"],["-∞","negative infinity","minus infinity","-infinity"]]}
            solution_sketch: 'Just to the left of $4$ the numerator $x + 1$ is about $5$, which is positive. The denominator $x - 4$ is a small negative number. A positive number divided by a small negative number is large and negative, so $f(x)$ goes to $-\infty$.'
          - problem: 'The graph of $f(x) = \frac{x - 1}{x + 3}$ has a vertical asymptote at $x = -3$. Evaluate $f(-2)$, a test point to the right of it.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $x = -2$: the numerator is $-2 - 1 = -3$ and the denominator is $-2 + 3 = 1$. So $f(-2) = \frac{-3}{1} = -3$, which is negative, so the graph is below the axis to the right of $x = -3$.'
          - problem: 'Ana says that $f(x) = \frac{1}{x - 2}$ is positive just to the left of $x = 2$, because the numerator is $1$. What is $f(1)$?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $x = 1$: the denominator is $1 - 2 = -1$, which is negative, and the numerator is $1$. So $f(1) = \frac{1}{-1} = -1$. The function is negative just to the left of $x = 2$, so Ana is wrong.'
          - problem: 'A pump empties a reservoir in $T(r) = \frac{120}{r - 3}$ hours when it runs at $r$ thousand litres per hour, for $r > 3$. How many hours does the emptying take at $r = 3.1$?'
            answer: '1200'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'Substitute $r = 3.1$: the denominator is $3.1 - 3 = 0.1$. So $T(3.1) = \frac{120}{0.1} = 1200$ hours. The time grows without bound as $r$ approaches the asymptote at $r = 3$.'
          - problem: 'A lens of focal length $12$ centimetres forms an image at the distance $q(p) = \frac{12p}{p - 12}$ centimetres when the object is $p$ centimetres away, $p > 12$. How far from the lens is the image when $p = 12.5$?'
            answer: '300'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Substitute $p = 12.5$: the numerator is $12 \cdot 12.5 = 150$ and the denominator is $12.5 - 12 = 0.5$. So $q(12.5) = \frac{150}{0.5} = 300$ centimetres. The image distance is large because the object is just beyond the vertical asymptote at $p = 12$.'
          - problem: 'The graph of $f(x) = \frac{x - 1}{x + 3}$ has a vertical asymptote at $x = -3$. Evaluate $f(-4)$, a test point to the left of it.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $x = -4$: the numerator is $-4 - 1 = -5$ and the denominator is $-4 + 3 = -1$. So $f(-4) = \frac{-5}{-1} = 5$, which is positive, so the graph is above the axis to the left of $x = -3$.'
      - id: kp3
        name: 'Assemble the full feature set'
        key_prerequisites: [vertical-horizontal-asymptotes, slant-asymptotes]
        constraints: 'degrees <= 2 with integer zeros and poles; list vertical asymptote(s), horizontal asymptote, and intercepts in one answer'
        exemplars:
          - problem: 'Find the vertical and horizontal asymptotes and the intercepts of $f(x) = \frac{x^2 - 1}{x^2 - 4}$.'
            answer: 'vertical = -2, 2; horizontal = 1; x_int = (-1, 0), (1, 0); y_int = (0, 1/4)'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}},{"name":"x_int","contract":{"kind":"list","ordered":false,"member":{"kind":"coordinates","arity":2}}},{"name":"y_int","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'Factor the denominator as $(x - 2)(x + 2)$, so the vertical asymptotes are $x = -2$ and $x = 2$. The degrees are equal, so the horizontal asymptote is $y = 1$. Setting $x^2 - 1 = 0$ gives the $x$-intercepts $x = -1$ and $x = 1$, and $f(0) = \frac{-1}{-4} = \frac{1}{4}$ gives the $y$-intercept $(0, \frac{1}{4})$.'
          - problem: 'Find the vertical and horizontal asymptotes and the intercepts of $f(x) = \frac{2x}{x + 3}$.'
            answer: 'vertical = -3; horizontal = 2; x_int = (0, 0); y_int = (0, 0)'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}},{"name":"x_int","contract":{"kind":"list","ordered":false,"member":{"kind":"coordinates","arity":2}}},{"name":"y_int","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'The denominator is zero at $x = -3$, so the vertical asymptote is $x = -3$. The degrees are equal, so the horizontal asymptote is $y = \frac{2}{1} = 2$. The numerator $2x$ is zero at $x = 0$, and $f(0) = 0$, so both intercepts are at the origin.'
          - problem: 'Find the vertical and horizontal asymptotes and the intercepts of $f(x) = \frac{x + 1}{x^2 - 9}$.'
            answer: 'vertical = -3, 3; horizontal = 0; x_int = (-1, 0); y_int = (0, -1/9)'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}},{"name":"x_int","contract":{"kind":"list","ordered":false,"member":{"kind":"coordinates","arity":2}}},{"name":"y_int","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'Factor the denominator as $(x - 3)(x + 3)$, so the vertical asymptotes are $x = -3$ and $x = 3$. The denominator has the higher degree, so the horizontal asymptote is $y = 0$. The numerator is zero at $x = -1$, and $f(0) = \frac{1}{-9} = -\frac{1}{9}$, so the $y$-intercept is $(0, -\frac{1}{9})$.'
          - problem: 'Find the vertical and horizontal asymptotes and the intercepts of $f(x) = \frac{x^2 - 4}{x^2 - 2x + 1}$.'
            answer: 'vertical = 1; horizontal = 1; x_int = (-2, 0), (2, 0); y_int = (0, -4)'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}},{"name":"x_int","contract":{"kind":"list","ordered":false,"member":{"kind":"coordinates","arity":2}}},{"name":"y_int","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'Factor the denominator as $(x - 1)^2$, so the vertical asymptote is $x = 1$. The degrees are equal and the leading coefficients are both $1$, so the horizontal asymptote is $y = 1$. The numerator $(x - 2)(x + 2)$ gives the $x$-intercepts $x = -2$ and $x = 2$, and $f(0) = \frac{-4}{1} = -4$.'
          - problem: 'The profit per unit of a product is $P(x) = \frac{10x - 200}{x + 5}$ dollars when $x$ hundred units are sold. Find the vertical and horizontal asymptotes and the intercepts of the graph of $P$.'
            answer: 'vertical = -5; horizontal = 10; x_int = (20, 0); y_int = (0, -40)'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}},{"name":"x_int","contract":{"kind":"list","ordered":false,"member":{"kind":"coordinates","arity":2}}},{"name":"y_int","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'The denominator is zero at $x = -5$, so the vertical asymptote is $x = -5$. The degrees are equal, so the horizontal asymptote is $y = \frac{10}{1} = 10$. The numerator is zero at $x = 20$, and $P(0) = \frac{-200}{5} = -40$, so the $y$-intercept is $(0, -40)$.'
          - problem: 'Find the vertical and horizontal asymptotes and the intercepts of $f(x) = \frac{x^2 - 9}{x^2 + 3x + 2}$.'
            answer: 'vertical = -2, -1; horizontal = 1; x_int = (-3, 0), (3, 0); y_int = (0, -9/2)'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}},{"name":"x_int","contract":{"kind":"list","ordered":false,"member":{"kind":"coordinates","arity":2}}},{"name":"y_int","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'Factor the denominator as $(x + 1)(x + 2)$, so the vertical asymptotes are $x = -2$ and $x = -1$. The degrees are equal and the leading coefficients are both $1$, so the horizontal asymptote is $y = 1$. The numerator $(x - 3)(x + 3)$ gives the $x$-intercepts $x = -3$ and $x = 3$, and $f(0) = \frac{-9}{2}$.'
          - problem: 'A lens of focal length $12$ centimetres forms an image at the distance $q(p) = \frac{12p}{p - 12}$ centimetres when the object is $p$ centimetres away. Find the vertical and horizontal asymptotes and the intercepts of the graph of $q$.'
            answer: 'vertical = 12; horizontal = 12; x_int = (0, 0); y_int = (0, 0)'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}},{"name":"x_int","contract":{"kind":"list","ordered":false,"member":{"kind":"coordinates","arity":2}}},{"name":"y_int","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'The denominator $p - 12$ is zero at $p = 12$, so the vertical asymptote is $p = 12$. The degrees are equal, so the horizontal asymptote is $q = \frac{12}{1} = 12$. The numerator $12p$ is zero at $p = 0$, and $q(0) = 0$, so both intercepts are at the origin.'
          - problem: 'Find the vertical and horizontal asymptotes, the hole, and the intercepts of $f(x) = \frac{x^2 - 4}{x^2 - x - 2}$.'
            answer: 'vertical = -1; horizontal = 1; hole = (2, 4/3); x_int = (-2, 0); y_int = (0, 2)'
            answer_contract: {"kind":"multipart","parts":[{"name":"vertical","contract":{"kind":"exact"}},{"name":"horizontal","contract":{"kind":"exact"}},{"name":"hole","contract":{"kind":"coordinates","arity":2}},{"name":"x_int","contract":{"kind":"list","ordered":false,"member":{"kind":"coordinates","arity":2}}},{"name":"y_int","contract":{"kind":"coordinates","arity":2}}]}
            solution_sketch: 'Factor to get $f(x) = \frac{(x - 2)(x + 2)}{(x - 2)(x + 1)}$. The factor $x - 2$ cancels, so there is a hole at $x = 2$, where $\frac{x + 2}{x + 1} = \frac{4}{3}$. The factor $x + 1$ remains, so the vertical asymptote is $x = -1$, and the equal degrees give $y = 1$. The only $x$-intercept is $x = -2$, and $f(0) = \frac{-4}{-2} = 2$.'
    diagnostic_exemplar:
      problem: 'For $f(x) = \frac{x + 3}{x - 1}$, state the vertical asymptote, the horizontal asymptote, both intercepts, and whether $f(x) \to +\infty$ or $-\infty$ as $x \to 1^+$.'
      answer: 'VA: x = 1; HA: y = 1; x-intercept (-3, 0); y-intercept (0, -3); f(x) → +∞ as x → 1⁺'
      answer_contract: {kind: none}
      solution_sketch: 'The denominator vanishes at $x = 1$ (numerator $4 \neq 0$ there), equal degrees give $y = 1$, $f(0) = -3$, $f(-3) = 0$; just right of $1$ the numerator is positive and the denominator is a small positive, so $f \to +\infty$.'
    anki_seeds:
      - front: "Intercepts of a rational function f = p/q:"
        back: "x-intercepts where p(x) = 0 (and q(x) ≠ 0); y-intercept is f(0)."
        type: basic
      - front: "To decide whether f goes to +∞ or −∞ beside a vertical asymptote..."
        back: "test the sign of f at a point just to that side of the asymptote."
        type: basic

  - id: rational-inequalities
    name: Rational Inequalities
    core: false                # supplemental: extension of polynomial-inequalities; terminal
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: polynomial-inequalities
        weight: 0.6
        key: true
      - id: rational-equations
        weight: 0.5
        key: true
      - id: vertical-horizontal-asymptotes
        weight: 0.4
      - id: compound-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Sign chart for a single ratio'
        key_prerequisites: [polynomial-inequalities]
        constraints: 'linear numerator and denominator with integer zeros'
        exemplars:
          - problem: 'Solve $\frac{x - 2}{x + 1} > 0$.'
            answer: 'x < -1 or x > 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The critical points are $x = 2$, where the numerator is zero, and $x = -1$, where the denominator is zero. The ratio is positive when both parts have the same sign, which happens for $x < -1$ and for $x > 2$.'
          - problem: 'Solve $\frac{x + 5}{x - 3} < 0$.'
            answer: '-5 < x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The critical points are $x = -5$ and $x = 3$. The ratio is negative when the numerator and denominator have opposite signs, which happens only between them, for $-5 < x < 3$.'
          - problem: 'Solve $\frac{2x - 6}{x + 1} > 0$.'
            answer: 'x < -1 or x > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The numerator $2x - 6$ is zero at $x = 3$ and the denominator is zero at $x = -1$. For $x < -1$ both parts are negative, for $-1 < x < 3$ the ratio is negative, and for $x > 3$ both parts are positive. The ratio is positive for $x < -1$ or $x > 3$.'
          - problem: 'A filter has gain $G(f) = \frac{f - 20}{f - 60}$ at a frequency of $f$ kilohertz, for $0 \le f \le 100$ and $f \ne 60$. For which frequencies is the gain negative?'
            answer: '20 < f < 60'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The critical points are $f = 20$ and $f = 60$. The gain is negative when the numerator and denominator have opposite signs. That happens only for $20 < f < 60$, because below $20$ both parts are negative and above $60$ both are positive.'
          - problem: 'Solve $\frac{x + 6}{2x - 4} < 0$.'
            answer: '-6 < x < 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The numerator is zero at $x = -6$ and the denominator is zero at $x = 2$. For $x < -6$ both parts are negative and for $x > 2$ both are positive, so the ratio is positive there. The ratio is negative for $-6 < x < 2$.'
          - problem: 'Noah says that the solution of $\frac{x + 2}{x - 5} < 0$ is $x < -2$ or $x > 5$. What is the correct solution?'
            answer: '-2 < x < 5'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The critical points are $x = -2$ and $x = 5$. For $x < -2$ both parts are negative and for $x > 5$ both are positive, so the ratio is positive on those two intervals. The ratio is negative between them, for $-2 < x < 5$.'
          - problem: 'Solve $\frac{x - 4}{2x + 8} > 0$.'
            answer: 'x < -4 or x > 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The numerator is zero at $x = 4$ and the denominator $2x + 8$ is zero at $x = -4$. For $x < -4$ both parts are negative, and for $x > 4$ both are positive. The ratio is positive for $x < -4$ or $x > 4$.'
          - problem: 'A gym earns the profit per member $P(n) = \frac{n - 50}{n - 200}$ hundred dollars when it has $n$ members, $n > 0$ and $n \ne 200$. For which numbers of members is the profit per member positive?'
            answer: '0 < n < 50 or n > 200'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The critical points are $n = 50$ and $n = 200$. Below $50$ both parts are negative and above $200$ both are positive, so the ratio is positive on those intervals. Between $50$ and $200$ the ratio is negative, and members are counted from $n > 0$.'
      - id: kp2
        name: 'Move everything to one side first'
        key_prerequisites: [rational-equations, polynomial-inequalities]
        constraints: 'never multiply both sides by an expression of unknown sign'
        exemplars:
          - problem: 'Solve $\frac{x}{x - 3} \le 2$.'
            answer: 'x < 3 or x >= 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $2$ to get $\frac{x}{x - 3} - 2 = \frac{6 - x}{x - 3} \le 0$. The critical points are $x = 6$ and $x = 3$. The ratio is negative for $x < 3$ and for $x > 6$, and it is zero at $x = 6$, so the solution is $x < 3$ or $x \ge 6$.'
          - problem: 'Solve $\frac{2}{x} \ge 1$.'
            answer: '0 < x <= 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $1$ to get $\frac{2 - x}{x} \ge 0$. The critical points are $x = 0$ and $x = 2$. The ratio is positive only between them, and it is zero at $x = 2$, so the solution is $0 < x \le 2$.'
          - problem: 'Mia solves $\frac{3}{x + 2} \le 1$ by multiplying both sides by $x + 2$, and gets $x \ge 1$. What is the correct solution?'
            answer: 'x < -2 or x >= 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Multiplying by $x + 2$ is wrong because $x + 2$ can be negative. Subtract $1$ instead to get $\frac{3}{x + 2} - 1 = \frac{1 - x}{x + 2} \le 0$. The ratio is negative for $x < -2$ and for $x > 1$, and it is zero at $x = 1$, so the solution is $x < -2$ or $x \ge 1$.'
          - problem: 'Solve $\frac{x + 1}{x - 2} \ge 2$.'
            answer: '2 < x <= 5'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $2$ to get $\frac{x + 1}{x - 2} - 2 = \frac{5 - x}{x - 2} \ge 0$. The critical points are $x = 2$ and $x = 5$. The ratio is positive between them, and it is zero at $x = 5$, so the solution is $2 < x \le 5$.'
          - problem: 'A company''s average cost per unit is $\frac{50x + 800}{x}$ dollars when it makes $x$ units, $x > 0$. How many units must it make for the average cost to be below $70$ dollars?'
            answer: 'x > 40'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $70$ from the average cost: $\frac{50x + 800}{x} - 70 = \frac{800 - 20x}{x} < 0$. The critical points are $x = 0$ and $x = 40$. For $x > 0$ the ratio is negative when $x > 40$, so the company must make more than $40$ units.'
          - problem: 'Solve $\frac{4}{x - 1} > 2$.'
            answer: '1 < x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $2$ to get $\frac{4}{x - 1} - 2 = \frac{6 - 2x}{x - 1} > 0$. The critical points are $x = 1$ and $x = 3$. The ratio is positive only between them, so the solution is $1 < x < 3$.'
          - problem: 'Solve $\frac{2x + 1}{x - 3} \le 1$.'
            answer: '-4 <= x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $1$ to get $\frac{2x + 1}{x - 3} - 1 = \frac{x + 4}{x - 3} \le 0$. The critical points are $x = -4$ and $x = 3$. The ratio is negative between them and zero at $x = -4$, so the solution is $-4 \le x < 3$.'
