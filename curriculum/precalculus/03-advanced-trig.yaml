unit: advanced-trig
course: precalculus
module: "Advanced Trigonometry"
topics:
  - id: inverse-trig-functions
    name: Inverse Trigonometric Functions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: unit-circle
        weight: 0.7
        key: true
      - id: inverse-functions
        weight: 0.6
        key: true
      - id: domain-range
        weight: 0.4
      - id: trig-graphs-basic
        weight: 0.3
      - id: trig-identities-basic
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Evaluate at standard values
        key_prerequisites: [unit-circle]
        constraints: "inputs drawn from unit-circle values; answers in radians"
        exemplars:
          - problem: 'Evaluate $\arcsin\left(\frac{1}{2}\right)$.'
            answer: "π/6"
          - problem: 'Evaluate $\arctan(1)$.'
            answer: "π/4"
          - problem: 'Evaluate $\arccos\left(-\frac{1}{2}\right)$.'
            answer: "2π/3"
            solution_sketch: 'Arccos returns angles in $[0, \pi]$; $\cos(2\pi/3) = -\frac{1}{2}$.'
          - problem: "Evaluate asin(sqrt(3)/2)."
            answer: "pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is asin(sqrt(3)/2). The inverse sine rule returns an angle in [-pi/2, pi/2]. The unit-circle value rule gives sin(pi/3) = sqrt(3)/2. Therefore asin(sqrt(3)/2) = pi/3."
          - problem: "Evaluate acos(0)."
            answer: "pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is acos(0). The inverse cosine rule returns an angle in [0, pi]. The unit-circle value rule gives cos(pi/2) = 0. Therefore acos(0) = pi/2."
          - problem: "Evaluate atan(-1)."
            answer: "-pi/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is atan(-1). The inverse tangent rule returns an angle in (-pi/2, pi/2). The unit-circle value rule gives tan(-pi/4) = -1. Therefore atan(-1) = -pi/4."
      - id: kp2
        name: Principal ranges
        key_prerequisites: [inverse-functions, unit-circle]
        constraints: "arcsin: [-π/2, π/2]; arccos: [0, π]; arctan: (-π/2, π/2)"
        exemplars:
          - problem: 'Evaluate $\arcsin\left(\sin\frac{5\pi}{6}\right)$.'
            answer: "π/6"
            solution_sketch: '$\sin(5\pi/6) = \frac{1}{2}$, and arcsin returns the angle in $[-\pi/2, \pi/2]$.'
          - problem: 'Evaluate $\arccos(-1)$.'
            answer: "π"
          - problem: "Evaluate asin(sin(7pi/6))."
            answer: "-pi/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with asin(sin(7pi/6)). Step 1: sin(7pi/6) = -1/2 by the unit circle. Step 2: asin(-1/2) must lie in [-pi/2, pi/2], so it is -pi/6. The principal value is -pi/6."
          - problem: "Evaluate acos(cos(5pi/4))."
            answer: "3pi/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with acos(cos(5pi/4)). Step 1: cos(5pi/4) = -sqrt(2)/2 by the unit circle. Step 2: acos(-sqrt(2)/2) must lie in [0, pi], so it is 3pi/4. The principal value is 3pi/4."
          - problem: "Evaluate atan(tan(4pi/5))."
            answer: "-pi/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with atan(tan(4pi/5)). Step 1: tan(4pi/5) = -tan(pi/5) by periodicity. Step 2: atan(-tan(pi/5)) must lie in (-pi/2, pi/2), so it is -pi/5. The principal value is -pi/5."
          - problem: "Evaluate acos(cos(7pi/6))."
            answer: "5pi/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with acos(cos(7pi/6)). Step 1: cos(7pi/6) = -sqrt(3)/2 by the unit circle. Step 2: acos(-sqrt(3)/2) must lie in [0, pi], so it is 5pi/6. The principal value is 5pi/6."
      - id: kp3
        name: Compose trig with inverse trig
        key_prerequisites: [unit-circle, trig-identities-basic]
        constraints: "use a right triangle or the Pythagorean identity; first-quadrant inputs"
        exemplars:
          - problem: 'Evaluate $\cos\left(\arcsin\frac{3}{5}\right)$.'
            answer: "4/5"
            solution_sketch: 'A right triangle with opposite $3$, hypotenuse $5$ has adjacent $4$.'
          - problem: 'Evaluate $\tan\left(\arccos\frac{5}{13}\right)$.'
            answer: "12/5"
          - problem: "Evaluate sin(arccos(8/17))."
            answer: "15/17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Let theta = arccos(8/17), so cos(theta) = 8/17 and theta is in the first quadrant. Step 2: Use the Pythagorean identity sin^2(theta) + cos^2(theta) = 1 to get sin(theta) = sqrt(1 - (8/17)^2) = sqrt(225/289). Step 3: The positive square root gives sin(theta) = 15/17."
          - problem: "Evaluate cos(arctan(20/21))."
            answer: "21/29"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Let theta = arctan(20/21), so tan(theta) = 20/21. Step 2: Form a right triangle with opposite side 20 and adjacent side 21; the hypotenuse is sqrt(20^2 + 21^2) = 29. Step 3: Cosine is adjacent over hypotenuse, so cos(theta) = 21/29."
          - problem: "Evaluate sin(arctan(9/40))."
            answer: "9/41"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Let theta = arctan(9/40), so tan(theta) = 9/40. Step 2: A right triangle has opposite side 9 and adjacent side 40, so the hypotenuse is sqrt(9^2 + 40^2) = 41. Step 3: Sine is opposite over hypotenuse, so sin(theta) = 9/41."
          - problem: "Evaluate cos(arcsin(28/53))."
            answer: "45/53"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Let theta = arcsin(28/53), so sin(theta) = 28/53 and theta is in the first quadrant. Step 2: Use the Pythagorean identity sin^2(theta) + cos^2(theta) = 1. Step 3: Then cos(theta) = sqrt(1 - (28/53)^2) = sqrt(2025/2809) = 45/53, since theta is in the first quadrant."
    diagnostic_exemplar:
      problem: 'Evaluate $\tan\left(\arcsin\frac{5}{13}\right)$.'
      answer: "5/12"
      solution_sketch: 'A right triangle with opposite $5$, hypotenuse $13$ has adjacent $12$; arcsin returns a first-quadrant angle here, so $\tan = \frac{5}{12}$.'
    anki_seeds:
      - front: "Principal ranges of arcsin, arccos, arctan?"
        back: "arcsin: [-π/2, π/2]; arccos: [0, π]; arctan: (-π/2, π/2)"
        type: basic

  - id: sum-difference-identities
    name: Sum and Difference Identities
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: unit-circle
        weight: 0.7
        key: true
      - id: trig-identities-basic
        weight: 0.6
        key: true
      - id: simplifying-radicals
        weight: 0.4
      - id: multiplying-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Exact values at non-special angles
        key_prerequisites: [unit-circle, simplifying-radicals]
        constraints: "targets like 15°, 75°, 105° built from 30/45/60"
        exemplars:
          - problem: 'Use $\cos(45^\circ - 30^\circ)$ to find the exact value of $\cos 15^\circ$.'
            answer: "(√6 + √2)/4"
            solution_sketch: '$\cos 45 \cos 30 + \sin 45 \sin 30 = \frac{\sqrt{2}}{2}\cdot\frac{\sqrt{3}}{2} + \frac{\sqrt{2}}{2}\cdot\frac{1}{2} = \frac{\sqrt{6} + \sqrt{2}}{4}$.'
          - problem: 'Find the exact value of $\sin 15^\circ$.'
            answer: "(√6 - √2)/4"
            solution_sketch: '$\sin(45^\circ - 30^\circ) = \sin 45 \cos 30 - \cos 45 \sin 30$.'
          - problem: "Use the tangent difference identity with 45 degrees and 30 degrees. Find the exact value of tan 15 degrees."
            answer: "2 - sqrt(3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write tan(45 - 30) = (tan 45 - tan 30)/(1 + tan 45 tan 30) by the tangent difference identity. Step 2: Substitute tan 45 = 1 and tan 30 = sqrt(3)/3 to get (1 - sqrt(3)/3)/(1 + sqrt(3)/3). Step 3: Multiply numerator and denominator by 3 and rationalize to obtain 2 - sqrt(3). The exact value is 2 - sqrt(3)."
          - problem: "Use the cosine sum identity with 60 degrees and 45 degrees. Find the exact value of cos 105 degrees."
            answer: "(sqrt(2)-sqrt(6))/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write cos(60 + 45) = cos 60 cos 45 - sin 60 sin 45 by the cosine sum identity. Step 2: Substitute cos 60 = 1/2, cos 45 = sqrt(2)/2, sin 60 = sqrt(3)/2, and sin 45 = sqrt(2)/2. Step 3: Multiply each pair and combine over the common denominator 4 to get (sqrt(2) - sqrt(6))/4. The exact value is (sqrt(2)-sqrt(6))/4."
          - problem: "Use the tangent sum identity with 45 degrees and 30 degrees. Find the exact value of tan 75 degrees."
            answer: "2 + sqrt(3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write tan(45 + 30) = (tan 45 + tan 30)/(1 - tan 45 tan 30) by the tangent sum identity. Step 2: Substitute tan 45 = 1 and tan 30 = sqrt(3)/3 to get (1 + sqrt(3)/3)/(1 - sqrt(3)/3). Step 3: Multiply numerator and denominator by 3 and rationalize to obtain 2 + sqrt(3). The exact value is 2 + sqrt(3)."
          - problem: "Use the tangent sum identity with 60 degrees and 45 degrees. Find the exact value of tan 105 degrees."
            answer: "-2 - sqrt(3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Write tan(60 + 45) = (tan 60 + tan 45)/(1 - tan 60 tan 45) by the tangent sum identity. Step 2: Substitute tan 60 = sqrt(3) and tan 45 = 1 to get (sqrt(3) + 1)/(1 - sqrt(3)). Step 3: Multiply numerator and denominator by 1 + sqrt(3) and simplify to get -2 - sqrt(3). The exact value is -2 - sqrt(3)."
      - id: kp2
        name: Collapse an expression into a single sine or cosine
        key_prerequisites: [trig-identities-basic]
        constraints: "expressions matching a sum/difference expansion exactly; numeric angle pairs collapse to a unit-circle angle"
        exemplars:
          - problem: 'Write $\sin x \cos y + \cos x \sin y$ as a single trig function.'
            answer: "sin(x + y)"
          - problem: 'Evaluate $\cos 80^\circ \cos 20^\circ + \sin 80^\circ \sin 20^\circ$ exactly.'
            answer: "1/2"
            solution_sketch: 'This is $\cos(80^\circ - 20^\circ) = \cos 60^\circ$.'
      - id: kp3
        name: Sum formulas from given sine and cosine values
        key_prerequisites: [trig-identities-basic, unit-circle]
        constraints: "use Pythagorean-triple values; state the quadrant"
        exemplars:
          - problem: 'Given $\sin\alpha = \frac{3}{5}$ and $\cos\beta = \frac{5}{13}$ with $\alpha, \beta$ in Quadrant I, find $\sin(\alpha + \beta)$.'
            answer: "63/65"
            solution_sketch: '$\cos\alpha = \frac{4}{5}$, $\sin\beta = \frac{12}{13}$; $\frac{3}{5}\cdot\frac{5}{13} + \frac{4}{5}\cdot\frac{12}{13} = \frac{15 + 48}{65}$.'
          - problem: 'With the same values, find $\cos(\alpha + \beta)$.'
            answer: "-16/65"
            solution_sketch: '$\frac{4}{5}\cdot\frac{5}{13} - \frac{3}{5}\cdot\frac{12}{13} = \frac{20 - 36}{65}$.'
          - problem: "Given sin(alpha) = 8/17 with alpha in Quadrant II and cos(beta) = 3/5 with beta in Quadrant IV. Find sin(alpha + beta) as a fraction."
            answer: "84/85"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Find sin(alpha + beta) with sin(alpha) = 8/17 in QII and cos(beta) = 3/5 in QIV. Use the Pythagorean identity to get cos(alpha) = -15/17 because alpha is in QII. Use the Pythagorean identity again to get sin(beta) = -4/5 because beta is in QIV. Use the sine sum formula: sin(alpha + beta) = sin(alpha) cos(beta) + cos(alpha) sin(beta) = (8/17)(3/5) + (-15/17)(-4/5) = 24/85 + 60/85 = 84/85. The answer is 84/85."
          - problem: "Given cos(alpha) = 7/25 with alpha in Quadrant IV and sin(beta) = 4/5 with beta in Quadrant II. Find cos(alpha + beta) as a fraction."
            answer: "3/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Find cos(alpha + beta) with cos(alpha) = 7/25 in QIV and sin(beta) = 4/5 in QII. Use the Pythagorean identity to get sin(alpha) = -24/25 because alpha is in QIV. Use the Pythagorean identity again to get cos(beta) = -3/5 because beta is in QII. Use the cosine sum formula: cos(alpha + beta) = cos(alpha) cos(beta) - sin(alpha) sin(beta) = (7/25)(-3/5) - (-24/25)(4/5) = -21/125 + 96/125 = 75/125 = 3/5. The answer is 3/5."
          - problem: "Given sin(alpha) = 5/13 with alpha in Quadrant II and cos(beta) = 8/17 with beta in Quadrant I. Find sin(alpha + beta) as a fraction."
            answer: "-140/221"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Find sin(alpha + beta) with sin(alpha) = 5/13 in QII and cos(beta) = 8/17 in QI. Use the Pythagorean identity to get cos(alpha) = -12/13 because alpha is in QII. Use the Pythagorean identity again to get sin(beta) = 15/17 because beta is in QI. Use the sine sum formula: sin(alpha + beta) = sin(alpha) cos(beta) + cos(alpha) sin(beta) = (5/13)(8/17) + (-12/13)(15/17) = 40/221 - 180/221 = -140/221. The answer is -140/221."
          - problem: "Given cos(alpha) = 4/5 with alpha in Quadrant I and sin(beta) = -24/25 with beta in Quadrant III. Find cos(alpha + beta) as a fraction."
            answer: "44/125"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Find cos(alpha + beta) with cos(alpha) = 4/5 in QI and sin(beta) = -24/25 in QIII. Use the Pythagorean identity to get sin(alpha) = 3/5 because alpha is in QI. Use the Pythagorean identity again to get cos(beta) = -7/25 because beta is in QIII. Use the cosine sum formula: cos(alpha + beta) = cos(alpha) cos(beta) - sin(alpha) sin(beta) = (4/5)(-7/25) - (3/5)(-24/25) = -28/125 + 72/125 = 44/125. The answer is 44/125."
    diagnostic_exemplar:
      problem: 'Given $\sin\alpha = \frac{4}{5}$ and $\sin\beta = \frac{12}{13}$ with $\alpha, \beta$ in Quadrant I, find $\sin(\alpha + \beta)$.'
      answer: "56/65"
      solution_sketch: '$\cos\alpha = \frac{3}{5}$, $\cos\beta = \frac{5}{13}$; $\sin(\alpha+\beta) = \frac{4}{5}\cdot\frac{5}{13} + \frac{3}{5}\cdot\frac{12}{13} = \frac{20 + 36}{65}$.'
    anki_seeds:
      - front: "sin(A + B) = ?"
        back: "sin A cos B + cos A sin B"
        type: basic
      - front: "cos(A + B) = ?"
        back: "cos A cos B - sin A sin B"
        type: basic

  - id: double-half-angle-identities
    name: Double- and Half-Angle Identities
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: sum-difference-identities
        weight: 0.7
        key: true
      - id: trig-identities-basic
        weight: 0.5
        key: true
      - id: simplifying-radicals
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Double-angle values from a known ratio
        key_prerequisites: [trig-identities-basic]
        constraints: "Pythagorean-triple values; quadrant given"
        exemplars:
          - problem: 'If $\sin\theta = \frac{3}{5}$ with $\theta$ in Quadrant I, find $\sin 2\theta$.'
            answer: "24/25"
            solution_sketch: '$\cos\theta = \frac{4}{5}$; $\sin 2\theta = 2 \cdot \frac{3}{5} \cdot \frac{4}{5}$.'
          - problem: 'With the same $\theta$, find $\cos 2\theta$.'
            answer: "7/25"
            solution_sketch: '$\cos 2\theta = 1 - 2\sin^2\theta = 1 - \frac{18}{25}$.'
          - problem: "The angle theta lies in Quadrant II and sin(theta) = 5/13. Use the double-angle identity to find sin(2theta) as a fraction."
            answer: "-120/169"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the Pythagorean identity sin^2(theta) + cos^2(theta) = 1: cos^2(theta) = 1 - 25/169 = 144/169. Because theta is in Quadrant II, the rule 'cosine is negative in Quadrant II' gives cos(theta) = -12/13. The double-angle rule sin(2theta) = 2 sin(theta) cos(theta) then gives 2 * (5/13) * (-12/13) = -120/169. The answer is -120/169."
          - problem: "The angle theta lies in Quadrant IV and cos(theta) = 8/17. Use a double-angle identity to find cos(2theta) as a fraction."
            answer: "-161/289"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the double-angle rule cos(2theta) = 2 cos^2(theta) - 1 with cos(theta) = 8/17. Square the ratio: cos^2(theta) = 64/289, so 2 cos^2(theta) = 128/289. Subtract one whole: 128/289 - 289/289 = -161/289. The answer is -161/289."
          - problem: "The angle theta lies in Quadrant III and tan(theta) = 3/4. Use a double-angle identity to find tan(2theta) as a fraction."
            answer: "24/7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the double-angle rule tan(2theta) = 2 tan(theta) / (1 - tan^2(theta)). With tan(theta) = 3/4 the numerator is 2 * 3/4 = 3/2 and the denominator is 1 - 9/16 = 7/16. Dividing gives (3/2) * (16/7) = 48/14 = 24/7. The answer is 24/7."
          - problem: "The angle theta lies in Quadrant II and sin(theta) = 7/25. Use a double-angle identity to find cos(2theta) as a fraction."
            answer: "527/625"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the double-angle rule cos(2theta) = 1 - 2 sin^2(theta) with sin(theta) = 7/25. Square the ratio: sin^2(theta) = 49/625, so 2 sin^2(theta) = 98/625. Subtract from one whole: 625/625 - 98/625 = 527/625. The answer is 527/625."
      - id: kp2
        name: The three forms of cos 2θ
        key_prerequisites: [sum-difference-identities]
        constraints: "pick the cos 2θ form matching the given ratio (no quadrant needed); rewriting tasks match one form exactly"
        exemplars:
          - problem: 'If $\cos\theta = \frac{1}{3}$, find $\cos 2\theta$.'
            answer: "-7/9"
            solution_sketch: '$\cos 2\theta = 2\cos^2\theta - 1 = \frac{2}{9} - 1$. No quadrant needed.'
          - problem: 'Write $1 - 2\sin^2 x$ as a single trig function.'
            answer: "cos 2x"
      - id: kp3
        name: Half-angle values
        key_prerequisites: [sum-difference-identities, simplifying-radicals]
        constraints: "half-angle of 30°, 45°, 60°, 90°; choose the sign from the quadrant"
        exemplars:
          - problem: 'Use a half-angle identity to find the exact value of $\cos 15^\circ$ as a nested radical.'
            answer: "√(2 + √3)/2"
            solution_sketch: '$\cos 15^\circ = \sqrt{\frac{1 + \cos 30^\circ}{2}} = \sqrt{\frac{2 + \sqrt{3}}{4}}$.'
          - problem: 'Find $\sin 22.5^\circ$ exactly.'
            answer: "√(2 - √2)/2"
            solution_sketch: '$\sin 22.5^\circ = \sqrt{\frac{1 - \cos 45^\circ}{2}} = \sqrt{\frac{2 - \sqrt{2}}{4}}$.'
          - problem: "The half-angle lies in quadrant I, so take the positive sign. Use a half-angle identity to find the exact value of cos(22.5 degrees) as a nested radical."
            answer: "sqrt(2+sqrt(2))/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The target is cos(22.5 degrees). The half-angle is in quadrant I, so the positive sign is used. Half-angle identity: cos(theta/2) = sqrt((1 + cos(theta))/2) with theta = 45 degrees, so cos(22.5) = sqrt((1 + cos(45))/2). Substitute cos(45) = sqrt(2)/2: sqrt((1 + sqrt(2)/2)/2) = sqrt((2 + sqrt(2))/4). The answer is sqrt(2+sqrt(2))/2."
          - problem: "The half-angle lies in quadrant I, so take the positive sign. Use a half-angle identity to find the exact value of cot(15 degrees)."
            answer: "2+sqrt(3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The target is cot(15 degrees). The half-angle is in quadrant I, so the positive sign is used. Half-angle identity for tangent: tan(theta/2) = (1 - cos(theta))/sin(theta) with theta = 30 degrees, so tan(15) = (1 - cos(30))/sin(30) = (1 - sqrt(3)/2)/(1/2) = 2 - sqrt(3). Then cot(15) = 1/tan(15) = 1/(2 - sqrt(3)) = (2 + sqrt(3))/((2 - sqrt(3))(2 + sqrt(3))) = 2 + sqrt(3). The answer is 2+sqrt(3)."
          - problem: "The half-angle lies in quadrant I, so take the positive sign. Use a half-angle identity to find the exact value of sec(30 degrees)."
            answer: "2sqrt(3)/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The target is sec(30 degrees). The half-angle is in quadrant I, so the positive sign is used. First find cos(30) with the half-angle identity at theta = 60 degrees: cos(30) = sqrt((1 + cos(60))/2) = sqrt((1 + 1/2)/2) = sqrt(3/4) = sqrt(3)/2. Then sec(30) = 1/cos(30) = 2/sqrt(3) = 2sqrt(3)/3. The answer is 2sqrt(3)/3."
          - problem: "The half-angle lies in quadrant I, so take the positive sign. Use a half-angle identity to find the exact value of csc(45 degrees)."
            answer: "sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The target is csc(45 degrees). The half-angle is in quadrant I, so the positive sign is used. First find sin(45) with the half-angle identity at theta = 90 degrees: sin(45) = sqrt((1 - cos(90))/2) = sqrt((1 - 0)/2) = sqrt(1/2) = sqrt(2)/2. Then csc(45) = 1/sin(45) = 2/sqrt(2) = sqrt(2). The answer is sqrt(2)."
    diagnostic_exemplar:
      problem: 'Use a half-angle identity to find the exact value of $\sin 15^\circ$ as a nested radical.'
      answer: "√(2 - √3)/2"
      solution_sketch: '$\sin 15^\circ = \sqrt{\frac{1 - \cos 30^\circ}{2}} = \sqrt{\frac{2 - \sqrt{3}}{4}}$; positive since $15^\circ$ is in Quadrant I.'
    anki_seeds:
      - front: "sin 2θ = ?"
        back: "2 sin θ cos θ"
        type: basic
      - front: "The three forms of cos 2θ?"
        back: "cos²θ - sin²θ = 2cos²θ - 1 = 1 - 2sin²θ"
        type: basic
      - front: "Half-angle: sin(θ/2) = ?"
        back: "±√((1 - cos θ)/2), sign chosen by the quadrant of θ/2"
        type: basic

  - id: product-to-sum-identities
    name: Product-to-Sum and Sum-to-Product Identities
    core: true                 # machinery: calculus-2 trigonometric-integrals (core) integrates sin(mx)cos(nx) via these
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: sum-difference-identities
        weight: 0.8
        key: true
      - id: trig-identities-basic
        weight: 0.4
      - id: unit-circle
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Rewrite a product as a sum
        key_prerequisites: [sum-difference-identities]
        constraints: "arguments mx, nx with m, n small positive integers, m != n; derive from adding/subtracting two sum-difference expansions when asked"
        exemplars:
          - problem: 'Write $\sin 3x \cos x$ as a sum of trig functions.'
            answer: "(sin(4x) + sin(2x))/2"
            solution_sketch: 'Add the expansions of $\sin(3x + x)$ and $\sin(3x - x)$: the $\cos 3x \sin x$ terms cancel, leaving $\sin 4x + \sin 2x = 2\sin 3x\cos x$.'
          - problem: 'Write $\cos 5x \cos 2x$ as a sum.'
            answer: "(cos(3x) + cos(7x))/2"
            solution_sketch: '$\cos A\cos B = \frac{1}{2}[\cos(A - B) + \cos(A + B)]$ with $A = 5x$, $B = 2x$.'
          - problem: 'Write $\sin 4x \sin x$ as a sum.'
            answer: "(cos(3x) - cos(5x))/2"
            solution_sketch: '$\sin A\sin B = \frac{1}{2}[\cos(A - B) - \cos(A + B)]$: subtracting the two cosine expansions isolates the $\sin A \sin B$ terms.'
      - id: kp2
        name: Exact values via product-to-sum
        key_prerequisites: [sum-difference-identities, unit-circle]
        constraints: "angle pairs whose sum and difference are unit-circle angles (e.g. 75° and 15°, 105° and 15°)"
        exemplars:
          - problem: 'Evaluate $\sin 75^\circ \sin 15^\circ$ exactly using a product-to-sum identity.'
            answer: "1/4"
            solution_sketch: '$\frac{1}{2}[\cos(75^\circ - 15^\circ) - \cos(75^\circ + 15^\circ)] = \frac{1}{2}[\cos 60^\circ - \cos 90^\circ] = \frac{1}{2}\left[\frac{1}{2} - 0\right]$.'
          - problem: 'Evaluate $\sin 75^\circ \cos 15^\circ$ exactly.'
            answer: "(2 + √3)/4"
            solution_sketch: '$\frac{1}{2}[\sin 90^\circ + \sin 60^\circ] = \frac{1}{2}\left[1 + \frac{\sqrt{3}}{2}\right] = \frac{2 + \sqrt{3}}{4}$.'
          - problem: "Evaluate $\\cos 105^\\circ \\cos 15^\\circ$ exactly using a product-to-sum identity."
            answer: "-1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the product cos 105 cos 15, use the product-to-sum identity cos A cos B = 1/2[cos(A+B)+cos(A-B)] by the sum and difference identities. Substitute A = 105 and B = 15: this gives 1/2[cos 120 + cos 90]. Use the unit circle values cos 120 = -1/2 and cos 90 = 0, so the result is 1/2[-1/2 + 0]. The exact value is -1/4."
          - problem: "Evaluate $\\sin 105^\\circ \\sin 45^\\circ$ exactly using a product-to-sum identity."
            answer: "(1+sqrt(3))/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the product sin 105 sin 45, use the product-to-sum identity sin A sin B = 1/2[cos(A-B)-cos(A+B)]. Substitute A = 105 and B = 45: this gives 1/2[cos 60 - cos 150]. Use unit circle values cos 60 = 1/2 and cos 150 = -sqrt(3)/2, so the result is 1/2[1/2 + sqrt(3)/2]. Simplify to (1+sqrt(3))/4, so the exact value is (1+sqrt(3))/4."
          - problem: "Evaluate $\\cos 105^\\circ \\sin 15^\\circ$ exactly using a product-to-sum identity."
            answer: "(sqrt(3)-2)/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the product cos 105 sin 15, use the product-to-sum identity cos A sin B = 1/2[sin(A+B)-sin(A-B)]. Substitute A = 105 and B = 15: this gives 1/2[sin 120 - sin 90]. Use unit circle values sin 120 = sqrt(3)/2 and sin 90 = 1, so the result is 1/2[sqrt(3)/2 - 1]. Simplify to (sqrt(3)-2)/4, so the exact value is (sqrt(3)-2)/4."
          - problem: "Evaluate $\\cos 75^\\circ \\cos 45^\\circ$ exactly using a product-to-sum identity."
            answer: "(sqrt(3)-1)/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the product cos 75 cos 45, use the product-to-sum identity cos A cos B = 1/2[cos(A+B)+cos(A-B)]. Substitute A = 75 and B = 45: this gives 1/2[cos 120 + cos 30]. Use unit circle values cos 120 = -1/2 and cos 30 = sqrt(3)/2, so the result is 1/2[-1/2 + sqrt(3)/2]. Simplify to (sqrt(3)-1)/4, so the exact value is (sqrt(3)-1)/4."
      - id: kp3
        name: Sum-to-product (the reverse direction)
        key_prerequisites: [sum-difference-identities]
        constraints: "sums/differences of sines or cosines with arguments mx, nx of the same parity, so half-sum and half-difference are integer multiples of x"
        exemplars:
          - problem: 'Write $\sin 5x + \sin 3x$ as a product.'
            answer: "2 sin(4x) cos(x)"
            solution_sketch: '$\sin A + \sin B = 2\sin\frac{A + B}{2}\cos\frac{A - B}{2}$ with half-sum $4x$ and half-difference $x$.'
          - problem: 'Evaluate $\cos 75^\circ + \cos 15^\circ$ exactly by writing it as a product.'
            answer: "√6/2"
            solution_sketch: '$2\cos 45^\circ \cos 30^\circ = 2 \cdot \frac{\sqrt{2}}{2} \cdot \frac{\sqrt{3}}{2} = \frac{\sqrt{6}}{2}$.'
    diagnostic_exemplar:
      problem: 'Evaluate $\sin 105^\circ + \sin 15^\circ$ exactly by writing it as a product.'
      answer: "√6/2"
      solution_sketch: '$2\sin\frac{105^\circ + 15^\circ}{2}\cos\frac{105^\circ - 15^\circ}{2} = 2\sin 60^\circ\cos 45^\circ = 2 \cdot \frac{\sqrt{3}}{2} \cdot \frac{\sqrt{2}}{2} = \frac{\sqrt{6}}{2}$.'
    anki_seeds:
      - front: "sin A cos B = ?"
        back: "½[sin(A + B) + sin(A − B)]"
        type: basic
      - front: "cos A cos B = ? and sin A sin B = ?"
        back: "½[cos(A − B) + cos(A + B)] and ½[cos(A − B) − cos(A + B)]"
        type: basic
      - front: "sin A + sin B as a product?"
        back: "2 sin((A + B)/2) cos((A − B)/2)"
        type: basic

  - id: sinusoid-phase-shift
    name: Sinusoids with Phase Shift and Modeling
    # supplemental: rule 1 — key ancestor trig-graphs-midline is core: false; the
    # only in-tree consumer (differential-equations:free-undamped-oscillations,
    # ledger edge) is supplemental too (re-audit R-05 + R-21 as kp3).
    core: false
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 200
    prerequisites:
      - id: trig-graphs-midline
        weight: 0.8
        key: true
      - id: function-transformations-shifts
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Read all four parameters
        key_prerequisites: [trig-graphs-midline, function-transformations-shifts]
        constraints: "B in {1, 2, 3, 1/2}; C a multiple of π/6 or π/4; include one unfactored argument Bx - φ that must be factored before reading the shift"
        exemplars:
          - problem: "A sinusoid has equation y = 5 sin(2(x - pi/3)) - 4. Give its amplitude, its period, its signed phase shift in radians (positive means a shift to the right), and its midline value, in that order, as amp, per, sh, mid."
            answer: "amp = 5; per = pi; sh = pi/3; mid = -4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "amp"}, {"contract": {"kind": "exact"}, "name": "per"}, {"contract": {"kind": "exact"}, "name": "sh"}, {"contract": {"kind": "exact"}, "name": "mid"}]}
            solution_sketch: "The full object is y = 5 sin(2(x - pi/3)) - 4. Amplitude rule: the amplitude is the absolute value of the leading coefficient, so 5. Period rule: the period is 2pi/B with B = 2, giving pi. Phase shift rule: the argument is already factored as 2(x - pi/3), so the signed shift is pi/3, positive because the constant is subtracted. Midline rule: the midline is the vertical shift D = -4. Answer: amp = 5; per = pi; sh = pi/3; mid = -4."
          - problem: "A sinusoid has equation y = cos(x + pi/3). Give its signed phase shift in radians, where a positive value means a shift to the right and a negative value means a shift to the left is not needed for the sign."
            answer: "-pi/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is y = cos(x + pi/3). Rewrite rule: write the argument as x - (-pi/3), so the shift constant is C = -pi/3. Sign rule: a negative shift constant means the graph moves in the negative horizontal direction, and the signed answer keeps that minus sign. Answer: -pi/3."
          - problem: "A sinusoid has equation y = sin(3x - 3pi/4). Factor the argument first, then give the period and the signed phase shift in radians (positive means a shift to the right), in that order, as per and sh."
            answer: "per = 2pi/3; sh = pi/4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "per"}, {"contract": {"kind": "exact"}, "name": "sh"}]}
            solution_sketch: "The full object is y = sin(3x - 3pi/4). Factoring rule: 3x - 3pi/4 = 3(x - pi/4), so the shift is read from pi/4 and not from the unfactored constant 3pi/4. Period rule: the period is 2pi/B with B = 3, giving 2pi/3. Shift rule: the factored constant is subtracted, so the signed shift is pi/4. Answer: per = 2pi/3; sh = pi/4."
          - problem: "A sinusoid has equation y = -3 cos(x/2 + pi/4) + 2. Give its amplitude and its midline value, in that order, as amp and mid."
            answer: "amp = 3; mid = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "amp"}, {"contract": {"kind": "exact"}, "name": "mid"}]}
            solution_sketch: "The full object is y = -3 cos(x/2 + pi/4) + 2. Amplitude rule: the amplitude is the absolute value of the leading coefficient, |-3| = 3; the minus sign only reflects the graph across the midline. Midline rule: the midline is the constant vertical shift D = 2. Answer: amp = 3; mid = 2."
          - problem: "A sinusoid has equation y = 4 cos(x/2 + pi/6) - 1. Give its period and its signed phase shift in radians (positive means a shift to the right), in that order, as per and sh."
            answer: "per = 4pi; sh = -pi/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "per"}, {"contract": {"kind": "exact"}, "name": "sh"}]}
            solution_sketch: "The full object is y = 4 cos(x/2 + pi/6) - 1. Factoring rule: x/2 + pi/6 = (1/2)(x + pi/3), so the signed shift is -pi/3; dividing the constant pi/6 by B = 1/2 gives the size pi/3, and the plus sign makes it negative. Period rule: the period is 2pi/B = 2pi/(1/2) = 4pi. Answer: per = 4pi; sh = -pi/3."
          - problem: "A sinusoid has equation y = 2 cos(3x + 3pi/4) + 4. Factor the argument first, then state the direction of the phase shift and give its magnitude in radians, as dir and sh."
            answer: "dir = left; sh = pi/4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["right"], ["left"]]}, "name": "dir"}, {"contract": {"kind": "exact"}, "name": "sh"}]}
            solution_sketch: "The full object is y = 2 cos(3x + 3pi/4) + 4. Factoring rule: 3x + 3pi/4 = 3(x + pi/4), so the shift is read from pi/4 and not from the unfactored constant 3pi/4. Direction rule: the factored constant is added, so the graph moves in the negative horizontal direction. The wrong option right is the error of keeping the sign of the added constant instead of negating it. Answer: dir = left; sh = pi/4."
      - id: kp2
        name: Write the equation from features or a graph
        key_prerequisites: [trig-graphs-midline, function-transformations-shifts]
        constraints: "integer amplitudes and midlines; periods 2π, π, or 4π; features given as max/min values and locations at multiples of π/6 or π/4"
        exemplars:
          - problem: 'Write a sine function with amplitude $2$, period $\pi$, phase shift $\frac{\pi}{4}$ right, and midline $y = 3$. Give the right-hand side of $y = \ldots$'
            answer: "2 sin(2(x - π/4)) + 3"
            solution_sketch: '$B = \frac{2\pi}{\text{period}} = 2$; assemble $A\sin(B(x - C)) + D$.'
          - problem: 'A sinusoid with period $2\pi$ has a maximum of $5$ at $x = \frac{\pi}{2}$ and a minimum of $-1$. Write it as a cosine function.'
            answer: "y = 3 cos(x - π/2) + 2"
            solution_sketch: 'Amplitude $\frac{5 - (-1)}{2} = 3$, midline $y = 2$; a cosine peaks at its phase shift, so shift right $\frac{\pi}{2}$.'
          - problem: 'The graph of $y = \sin x$ has a maximum at $\left(\frac{\pi}{2}, 1\right)$. Where is the corresponding maximum of $y = \sin\left(x - \frac{\pi}{3}\right) + 2$?'
            answer: "(5π/6, 3)"
            solution_sketch: 'Every point moves right $\frac{\pi}{3}$ and up $2$.'
          - problem: "A sinusoid has a maximum value 7 at x = pi/6 and a minimum value -1 at x = 2pi/3. Its period is pi. Give the right-hand side of its equation as y = A cos(B(x - C)) + D."
            answer: "4 cos(2(x - pi/6)) + 3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full model is y = A cos(B(x - C)) + D. Midline rule: D = (7 + (-1))/2 = 3. Amplitude rule: A = (7 - (-1))/2 = 4. Period rule: B = 2pi/pi = 2. Phase-shift rule: a cosine reaches its maximum at x = C, so C = pi/6. The equation is 4 cos(2(x - pi/6)) + 3."
          - problem: "A sinusoid has a maximum value 3 at x = pi/4 and a minimum value -5 at x = 9pi/4. Its period is 4pi. Give the right-hand side of its equation as y = A sin(B(x - C)) + D."
            answer: "4 sin((x + 3pi/4)/2) - 1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full model is y = A sin(B(x - C)) + D. Midline rule: D = (3 + (-5))/2 = -1. Amplitude rule: A = (3 - (-5))/2 = 4. Period rule: B = 2pi/(4pi) = 1/2. Phase-shift rule: a sine reaches its maximum when B(x - C) = pi/2, so (1/2)(pi/4 - C) = pi/2 and C = -3pi/4. The equation is 4 sin((x + 3pi/4)/2) - 1."
          - problem: "A sinusoid has a maximum value 4 at x = 4pi/3 and a minimum value -2 at x = pi/3. Its period is 2pi. Give the right-hand side of its equation as y = A cos(B(x - C)) + D."
            answer: "3 cos(x - 4pi/3) + 1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full model is y = A cos(B(x - C)) + D. Midline rule: D = (4 + (-2))/2 = 1. Amplitude rule: A = (4 - (-2))/2 = 3. Period rule: B = 2pi/(2pi) = 1. Phase-shift rule: a cosine reaches its maximum at x = C, so C = 4pi/3. The equation is 3 cos(x - 4pi/3) + 1."
      - id: kp3
        name: Sinusoidal modeling
        key_prerequisites: [trig-graphs-midline]
        constraints: "metric units and 24-hour times; periods giving B as a simple π-fraction; the phase pinned by a stated maximum, minimum, or start position"
        exemplars:
          - problem: "A Ferris wheel of radius 7 m has its centre 9 m over the ground and turns once every 24 s. A cabin starts at the lowest point at t = 0. Give the cosine expression for its height h in metres, using t as the variable."
            answer: "9 - 7 cos(pi t/12)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1: read the midline. The centre is 9 m, so D = 9 by the midline rule. Step 2: read the amplitude. Radius 7 m gives A = 7 by the amplitude rule. Step 3: the period 24 s gives B = 2pi/24 = pi/12 by the period rule. Step 4: starting at the lowest point pins a reflected cosine, so the full model is 9 - 7 cos(pi t/12)."
          - problem: "At a harbour the high tide of 7 m occurs at 05:00 and the next low tide of 3 m at 11:00. Model the depth with a cosine, with t in hours after midnight. Give the cosine expression for the depth d in metres, using t as the variable."
            answer: "2 cos(pi (t - 5)/6) + 5"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1: midline D = (7+3)/2 = 5 by the midline rule. Step 2: amplitude A = (7-3)/2 = 2 by the amplitude rule. Step 3: high to low is half a period, so the period is 12 h and B = 2pi/12 = pi/6 by the period rule. Step 4: the cosine peaks at t = 5, so the phase shift is 5 and the full model is 2 cos(pi (t - 5)/6) + 5."
          - problem: 'Using $h(t) = 12 - 10\cos\left(\frac{\pi t}{30}\right)$, find the cabin height at $t = 15$ s.'
            answer: "12 m"
            solution_sketch: '$\cos\left(\frac{\pi}{2}\right) = 0$, so $h = 12$: the cabin is level with the centre.'
          - problem: "The temperature in a greenhouse is 4 degrees Celsius at 02:00 and 16 degrees Celsius at 14:00. A cosine model has a 24-hour period, with t in hours after midnight. Give the cosine expression for the temperature T in degrees Celsius, using t as the variable."
            answer: "10 - 6 cos(pi (t - 2)/12)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1: midline D = (4+16)/2 = 10 by the midline rule. Step 2: amplitude A = (16-4)/2 = 6 by the amplitude rule. Step 3: the 24-hour period gives B = 2pi/24 = pi/12 by the period rule. Step 4: the minimum at t = 2 pins a reflected cosine, so the full model is 10 - 6 cos(pi (t - 2)/12)."
          - problem: "A water wheel of radius 3 m has its centre 5 m over the water. It turns once every 16 s. A paddle starts level with the centre and moving upward at t = 0. Give the cosine expression for its height h in metres, using t as the variable."
            answer: "5 + 3 cos(pi t/8 - pi/2)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1: midline D = 5 m by the midline rule. Step 2: amplitude A = 3 m by the amplitude rule. Step 3: the period 16 s gives B = 2pi/16 = pi/8 by the period rule. Step 4: starting at the centre and rising means the cosine phase is -pi/2, so the full model is 5 + 3 cos(pi t/8 - pi/2)."
          - problem: "A Ferris wheel of radius 6 m has its centre 8 m over the ground and turns once every 30 s. A cabin starts at the highest point at t = 0. Give the cosine expression for its height h in metres, using t as the variable."
            answer: "8 + 6 cos(pi t/15)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1: midline D = 8 m by the midline rule. Step 2: amplitude A = 6 m by the amplitude rule. Step 3: the period 30 s gives B = 2pi/30 = pi/15 by the period rule. Step 4: starting at the highest point pins a positive cosine with zero phase, so the full model is 8 + 6 cos(pi t/15)."
    diagnostic_exemplar:
      problem: 'A Ferris wheel of radius $8$ m has its centre $10$ m above the ground and turns once every $40$ s. A cabin starts at the lowest point at $t = 0$. Write its height $h(t)$ in metres as a cosine function.'
      answer: "h(t) = 10 - 8 cos(πt/20)"
      answer_contract: {kind: none}
      solution_sketch: 'Midline $10$, amplitude $8$, $B = \frac{2\pi}{40} = \frac{\pi}{20}$; starting at the minimum means a reflected cosine.'
    anki_seeds:
      - front: "For y = A sin(B(x − C)) + D, the phase shift is..."
        back: "C: right if C > 0, left if C < 0 (read only after factoring B out of the argument)."
        type: basic
      - front: "To read the phase shift of y = sin(Bx − φ), first..."
        back: "Factor: sin(B(x − φ/B)). The shift is φ/B, not φ."
        type: basic
      - front: "A sinusoid starting at its minimum at t = 0 is most simply modeled by..."
        back: "y = D − A cos(Bt) (a reflected cosine)."
        type: basic

  - id: tangent-reciprocal-graphs
    name: Graphs of Tangent and the Reciprocal Functions
    # supplemental: terminal graph-reading topic; nothing downstream consumes it —
    # calculus handles tan/sec analytically (re-audit R-06, §2: ships consumer-less).
    core: false
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: unit-circle-special-angles
        weight: 0.6
        key: true
      - id: reciprocal-trig-functions
        weight: 0.6
        key: true
      - id: sine-cosine-parent-graphs
        weight: 0.4
      # vertical-asymptote language (x = a lines the graph approaches) is taught here
      - id: vertical-horizontal-asymptotes
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The tangent graph
        key_prerequisites: [unit-circle-special-angles, vertical-horizontal-asymptotes]
        constraints: "asymptotes written x = π/2 + πk with k an integer; zeros at integer multiples of π"
        exemplars:
          - problem: 'State the period of $y = \tan x$ and the equations of its vertical asymptotes.'
            answer: "period π; asymptotes x = π/2 + πk for integer k"
            answer_contract: {kind: none}
            solution_sketch: 'Tangent repeats every $\pi$ and blows up where $\cos x = 0$.'
          - problem: 'On $\left(-\frac{\pi}{2}, \frac{\pi}{2}\right)$, is $y = \tan x$ increasing or decreasing, and where does it cross the $x$-axis?'
            answer: "increasing"
            answer_contract: {kind: label, options: [[increasing], [decreasing]]}
            solution_sketch: 'On $(-\pi/2, \pi/2)$ tangent rises from $-\infty$ to $+\infty$, crossing the $x$-axis at $x = 0$.'
          - problem: 'State the domain of $y = \tan x$.'
            answer: "all real x except x = π/2 + πk (k an integer)"
            answer_contract: {kind: none}
            solution_sketch: 'Tangent is undefined exactly where $\\cos x = 0$, i.e. at $x = \pi/2 + \pi k$ for integers $k$.'
      - id: kp2
        name: Secant and cosecant from their reciprocals
        key_prerequisites: [reciprocal-trig-functions, sine-cosine-parent-graphs]
        constraints: "derive every feature from the sine or cosine graph: asymptotes at its zeros, branches anchored at its max/min"
        exemplars:
          - problem: 'State the vertical asymptotes of $y = \sec x$ on $[0, 2\pi]$.'
            answer: "π/2, 3π/2"
            answer_contract: {kind: list, ordered: false, member: {kind: exact}}
            solution_sketch: 'Secant blows up exactly where $\cos x = 0$.'
          - problem: 'State the range of $y = \csc x$.'
            answer: "y ≤ -1 or y ≥ 1"
            answer_contract: {kind: inequality_union}
            solution_sketch: 'Reciprocals of $\sin x \in [-1, 1] \setminus \{0\}$ never land in $(-1, 1)$.'
          - problem: 'The graph of $y = \cos x$ has a maximum at $(0, 1)$. What feature does $y = \sec x$ have there?'
            answer: "a local minimum at (0, 1)"
            answer_contract: {kind: label, options: [["a local minimum at (0, 1)"], ["a local maximum at (0, 1)"], [a vertical asymptote], [an x-intercept]]}
            solution_sketch: 'Where the base graph peaks at $1$, its reciprocal bottoms out at $1$.'
      - id: kp3
        name: Cotangent and transformed graphs
        key_prerequisites: [reciprocal-trig-functions, unit-circle-special-angles]
        constraints: "cot as the reflected/shifted tangent shape; transformed arguments limited to 2x and x/2"
        exemplars:
          - problem: "Find the distance between consecutive vertical asymptotes of y = cot(x)."
            answer: "pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: y = cot(x). The cotangent has vertical asymptotes where sin(x) = 0, so at x = pi*k for every integer k. Consecutive asymptotes are pi apart. The answer is pi."
          - problem: "For y = tan(2x), give its period and the x-coordinate of its vertical asymptote in the interval (0, pi/2)."
            answer: "period = pi/2; asymptote = pi/4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "period"}, {"contract": {"kind": "exact"}, "name": "asymptote"}]}
            solution_sketch: "Full object: y = tan(2x). The period rule for tangent gives period pi/|2| = pi/2. Vertical asymptotes satisfy 2x = pi/2 + pi*k, so x = pi/4 + pi*k/2. In (0, pi/2) the asymptote is x = pi/4. The answer is period = pi/2; asymptote = pi/4."
          - problem: "State the monotonic behavior of y = cot(x) on the interval (0, pi), and give its period."
            answer: "behavior = decreasing; period = pi"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["decreasing"], ["increasing"]]}, "name": "behavior"}, {"contract": {"kind": "exact"}, "name": "period"}]}
            solution_sketch: "Full object: y = cot(x) on (0, pi). The cotangent curve falls from positive infinity to negative infinity, so the monotonic behavior is decreasing. Choosing increasing confuses cotangent with tangent on this interval. The period of cotangent is pi. The answer is behavior = decreasing; period = pi."
          - problem: "Find the multiplier of pi that gives the period of y = cot(x/2)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: y = cot(x/2). The period rule for cotangent gives pi / (1/2) = 2pi. So the period is 2 times pi, and the multiplier is 2. The answer is 2."
          - problem: "Find the x-coordinate of the first positive vertical asymptote of y = cot(2x)."
            answer: "pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: y = cot(2x). Cotangent has vertical asymptotes where sin(2x) = 0, so 2x = pi*k and x = pi*k/2. The first positive one uses k = 1, which gives x = pi/2. The answer is pi/2."
          - problem: "The graph of y = cot(x) is a reflected and shifted copy of the graph of y = tan(x). Find the smallest positive a for which cot(x) = -tan(x - a)."
            answer: "pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: cot(x) = -tan(x - a). Cotangent is tangent reflected in the x-axis and shifted horizontally. The identity tan(x - pi/2) = -cot(x) gives -tan(x - pi/2) = cot(x). Thus the smallest positive shift is a = pi/2. The answer is pi/2."
    diagnostic_exemplar:
      problem: 'Find the period of $y = \tan\frac{x}{2}$ and the equation of its vertical asymptote in $(0, 2\pi)$.'
      answer: "period 2π; asymptote x = π"
      answer_contract: {kind: none}
      solution_sketch: 'Period $\pi \div \frac{1}{2} = 2\pi$; asymptotes where $\frac{x}{2} = \frac{\pi}{2} + \pi k$, so $x = \pi$ inside $(0, 2\pi)$.'
    anki_seeds:
      - front: "Period of tan and cot?"
        back: "π (not 2π)."
        type: basic
      - front: "Vertical asymptotes of sec x occur where..."
        back: "cos x = 0, i.e. x = π/2 + πk."
        type: basic
      - front: "Range of sec and csc?"
        back: "y ≤ −1 or y ≥ 1 — the band (−1, 1) is never reached."
        type: basic

  - id: basic-trig-equations
    name: Basic Trigonometric Equations
    core: false                # supplemental, with trig-equations-identities: terminal branch
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: unit-circle
        weight: 0.7
        key: true
      - id: inverse-trig-functions
        weight: 0.5
        key: true
      - id: radians-degrees
        weight: 0.4
      - id: two-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Solve directly on [0, 2π)
        key_prerequisites: [unit-circle]
        constraints: "unit-circle values only; always ask for all solutions in [0, 2π)"
        exemplars:
          - problem: 'Solve $\sin x = \frac{1}{2}$ on $[0, 2\pi)$.'
            answer: "x = π/6, 5π/6"
          - problem: 'Solve $\cos x = -\frac{\sqrt{2}}{2}$ on $[0, 2\pi)$.'
            answer: "x = 3π/4, 5π/4"
          - problem: "Solve $\\sin x = -\\frac{\\sqrt{3}}{2}$ on $[0, 2\\pi)$, and give all solutions in increasing order as x1 = smaller solution, x2 = larger solution."
            answer: "x1 = 4pi/3; x2 = 5pi/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "The equation $\\sin x = -\\frac{\\sqrt{3}}{2}$ on $[0, 2\\pi)$ is the full object. Sine is negative in the third and fourth quadrants, and the reference angle with sine $\\frac{\\sqrt{3}}{2}$ is $\\frac{\\pi}{3}$ by the unit-circle rule. The two angles are $\\pi + \\frac{\\pi}{3} = \\frac{4\\pi}{3}$ and $2\\pi - \\frac{\\pi}{3} = \\frac{5\\pi}{3}$. The answer is x1 = 4pi/3; x2 = 5pi/3."
          - problem: "Solve $\\cos x = -\\frac{1}{2}$ on $[0, 2\\pi)$, and give all solutions in increasing order as x1 = smaller solution, x2 = larger solution."
            answer: "x1 = 2pi/3; x2 = 4pi/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "The equation $\\cos x = -\\frac{1}{2}$ on $[0, 2\\pi)$ is the full object. Cosine is negative in the second and third quadrants, and the reference angle with cosine $\\frac{1}{2}$ is $\\frac{\\pi}{3}$ by the unit-circle rule. The two angles are $\\pi - \\frac{\\pi}{3} = \\frac{2\\pi}{3}$ and $\\pi + \\frac{\\pi}{3} = \\frac{4\\pi}{3}$. The answer is x1 = 2pi/3; x2 = 4pi/3."
          - problem: "Solve $\\tan x = -1$ on $[0, 2\\pi)$, and give all solutions in increasing order as x1 = smaller solution, x2 = larger solution."
            answer: "x1 = 3pi/4; x2 = 7pi/4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "The equation $\\tan x = -1$ on $[0, 2\\pi)$ is the full object. Tangent is negative in the second and fourth quadrants, and $\\tan\\frac{\\pi}{4} = 1$ gives the reference angle $\\frac{\\pi}{4}$ by the unit-circle rule. The two angles are $\\pi - \\frac{\\pi}{4} = \\frac{3\\pi}{4}$ and $2\\pi - \\frac{\\pi}{4} = \\frac{7\\pi}{4}$. The answer is x1 = 3pi/4; x2 = 7pi/4."
          - problem: "Solve $\\cos x = \\frac{\\sqrt{3}}{2}$ on $[0, 2\\pi)$, and give all solutions in increasing order as x1 = smaller solution, x2 = larger solution."
            answer: "x1 = pi/6; x2 = 11pi/6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "x1"}, {"contract": {"kind": "exact"}, "name": "x2"}]}
            solution_sketch: "The equation $\\cos x = \\frac{\\sqrt{3}}{2}$ on $[0, 2\\pi)$ is the full object. Cosine is positive in the first and fourth quadrants, and the reference angle with cosine $\\frac{\\sqrt{3}}{2}$ is $\\frac{\\pi}{6}$ by the unit-circle rule. The two angles are $\\frac{\\pi}{6}$ and $2\\pi - \\frac{\\pi}{6} = \\frac{11\\pi}{6}$. The answer is x1 = pi/6; x2 = 11pi/6."
      - id: kp2
        name: Isolate the trig function first
        key_prerequisites: [two-step-equations, unit-circle]
        constraints: "one or two algebraic steps (add/divide) isolating sin, cos, or tan to a unit-circle value; solutions on [0, 2π)"
        exemplars:
          - problem: 'Solve $2\cos x - 1 = 0$ on $[0, 2\pi)$.'
            answer: "x = π/3, 5π/3"
            solution_sketch: '$\cos x = \frac{1}{2}$.'
          - problem: 'Solve $\sqrt{3}\tan x = 1$ on $[0, 2\pi)$.'
            answer: "x = π/6, 7π/6"
            solution_sketch: '$\tan x = \frac{\sqrt{3}}{3}$; tangent is positive in Quadrants I and III.'
          - problem: "Solve 2 sin x + 1 = 0 on [0, 2pi). Give the solutions in increasing order."
            answer: "7pi/6, 11pi/6"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1 (two-step equations): subtract 1 and divide by 2, giving sin x = -1/2. Step 2 (unit circle): sine equals -1/2 at 7pi/6 and 11pi/6 in [0, 2pi). The solutions in increasing order are 7pi/6, 11pi/6."
          - problem: "Solve 2 cos x + sqrt(2) = 0 on [0, 2pi). Give the solutions in increasing order."
            answer: "3pi/4, 5pi/4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1 (two-step equations): subtract sqrt(2) and divide by 2, giving cos x = -sqrt(2)/2. Step 2 (unit circle): cosine equals -sqrt(2)/2 at 3pi/4 and 5pi/4. The solutions in increasing order are 3pi/4, 5pi/4."
          - problem: "Solve tan x + 1 = 0 on [0, 2pi). Give the solutions in increasing order."
            answer: "3pi/4, 7pi/4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1 (two-step equations): subtract 1, giving tan x = -1. Step 2 (unit circle): tangent equals -1 at 3pi/4 and 7pi/4 in [0, 2pi). The solutions in increasing order are 3pi/4, 7pi/4."
          - problem: "Solve sqrt(2) sin x - 1 = 0 on [0, 2pi). Give the solutions in increasing order."
            answer: "pi/4, 3pi/4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1 (two-step equations): add 1 and divide by sqrt(2), giving sin x = sqrt(2)/2. Step 2 (unit circle): sine equals sqrt(2)/2 at pi/4 and 3pi/4. The solutions in increasing order are pi/4, 3pi/4."
      - id: kp3
        name: Multiple-angle equations
        key_prerequisites: [unit-circle, radians-degrees]
        constraints: "arguments 2x or x/2; expand the solution window before dividing"
        exemplars:
          - problem: 'Solve $\sin 2x = 1$ on $[0, 2\pi)$.'
            answer: "x = π/4, 5π/4"
            solution_sketch: '$2x = \frac{\pi}{2} + 2\pi k$ with $2x \in [0, 4\pi)$: $2x = \frac{\pi}{2}, \frac{5\pi}{2}$.'
          - problem: 'Solve $\cos\frac{x}{2} = \frac{\sqrt{3}}{2}$ on $[0, 2\pi)$.'
            answer: "x = π/3"
            solution_sketch: '$\frac{x}{2} \in [0, \pi)$, so only $\frac{x}{2} = \frac{\pi}{6}$ lands in range.'
          - problem: "Solve cos(2x) = 0 on [0, 2pi). Give the solutions in increasing order."
            answer: "pi/4, 3pi/4, 5pi/4, 7pi/4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The equation is cos(2x) = 0 on [0, 2pi). Step 1: set theta = 2x, so theta lies in [0, 4pi) because the window expands before dividing. Step 2: by the unit circle, cos(theta) = 0 at theta = pi/2, 3pi/2, 5pi/2, 7pi/2. Step 3: divide each by 2 to undo the substitution: x = pi/4, 3pi/4, 5pi/4, 7pi/4. The solutions are pi/4, 3pi/4, 5pi/4, 7pi/4."
          - problem: "Solve sin(x/2) = -1/2 for x in [0, 4pi). Give the solutions in increasing order."
            answer: "7pi/3, 11pi/3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The equation is sin(x/2) = -1/2 for x in [0, 4pi). Step 1: set theta = x/2, so theta lies in [0, 2pi). Step 2: by the unit circle, sin(theta) = -1/2 at theta = 7pi/6 and theta = 11pi/6. Step 3: multiply each by 2 to undo the substitution: x = 7pi/3 and x = 11pi/3. The solutions are 7pi/3, 11pi/3."
          - problem: "Solve tan(2x) = 1 for x in [0, pi). Give the solutions in increasing order."
            answer: "pi/8, 5pi/8"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The equation is tan(2x) = 1 for x in [0, pi). Step 1: set theta = 2x, so theta lies in [0, 2pi). Step 2: by the unit circle, tan(theta) = 1 at theta = pi/4 and theta = 5pi/4. Step 3: divide each by 2: x = pi/8 and x = 5pi/8. The solutions are pi/8, 5pi/8."
          - problem: "Solve sin(2x) = sqrt(3)/2 on [0, 2pi). Give the solutions in increasing order."
            answer: "pi/6, pi/3, 7pi/6, 4pi/3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The equation is sin(2x) = sqrt(3)/2 on [0, 2pi). Step 1: set theta = 2x, so theta lies in [0, 4pi) because the window expands before dividing. Step 2: by the unit circle, sin(theta) = sqrt(3)/2 at theta = pi/3, 2pi/3, 7pi/3, 8pi/3. Step 3: divide each by 2: x = pi/6, pi/3, 7pi/6, 4pi/3. The solutions are pi/6, pi/3, 7pi/6, 4pi/3."
    diagnostic_exemplar:
      problem: 'Solve $\cos 2x = \frac{1}{2}$ on $[0, 2\pi)$.'
      answer: "x = π/6, 5π/6, 7π/6, 11π/6"
      solution_sketch: '$2x \in [0, 4\pi)$: $2x = \frac{\pi}{3}, \frac{5\pi}{3}, \frac{7\pi}{3}, \frac{11\pi}{3}$; divide by $2$.'
    anki_seeds:
      - front: "sin x = sin θ has which two solution families?"
        back: "x = θ + 2πk and x = (π - θ) + 2πk"
        type: basic

  - id: trig-equations-identities
    name: Trig Equations via Identities
    core: false                # supplemental: terminal trig-equation practice genre
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: basic-trig-equations
        weight: 0.7
        key: true
      - id: double-half-angle-identities
        weight: 0.6
        key: true
      - id: quadratic-equations-factoring
        weight: 0.5
      - id: trig-identities-basic
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Quadratic in one trig function
        key_prerequisites: [quadratic-equations-factoring, basic-trig-equations]
        constraints: "factorable quadratics in sin x or cos x whose roots are unit-circle values; solutions on [0, 2π)"
        exemplars:
          - problem: 'Solve $2\sin^2 x - \sin x - 1 = 0$ on $[0, 2\pi)$.'
            answer: "x = π/2, 7π/6, 11π/6"
            solution_sketch: '$(2\sin x + 1)(\sin x - 1) = 0$: $\sin x = 1$ or $\sin x = -\frac{1}{2}$.'
          - problem: 'Solve $2\cos^2 x - \cos x = 0$ on $[0, 2\pi)$.'
            answer: "x = π/2, 3π/2, π/3, 5π/3"
            solution_sketch: '$\cos x (2\cos x - 1) = 0$.'
      - id: kp2
        name: Convert with the Pythagorean identity
        key_prerequisites: [trig-identities-basic, quadratic-equations-factoring]
        constraints: "substitute sin² = 1 - cos² (or vice versa) to reach one function"
        exemplars:
          - problem: 'Solve $2\sin^2 x = 2 + \cos x$ on $[0, 2\pi)$.'
            answer: "x = π/2, 3π/2, 2π/3, 4π/3"
            solution_sketch: '$2(1 - \cos^2 x) = 2 + \cos x$ gives $\cos x(2\cos x + 1) = 0$.'
          - problem: 'Solve $\sin^2 x - \cos^2 x = 0$ on $[0, \pi)$.'
            answer: "x = π/4, 3π/4"
            solution_sketch: '$\cos 2x = 0$, so $2x = \frac{\pi}{2}, \frac{3\pi}{2}$.'
          - problem: "Solve 2cos^2 x + sin x = 1 on [0, 2pi). Give the answer as a set of exact values."
            answer: "{pi/2, 7pi/6, 11pi/6}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Use the Pythagorean identity cos^2 x = 1 - sin^2 x to write 2(1 - sin^2 x) + sin x = 1. Simplify to 2 sin^2 x - sin x - 1 = 0 and factor as (2 sin x + 1)(sin x - 1) = 0. Then sin x = -1/2 gives x = 7pi/6 and 11pi/6, and sin x = 1 gives x = pi/2. The solution set is {pi/2, 7pi/6, 11pi/6}."
          - problem: "Solve 2sin^2 x + 3cos x - 3 = 0 on [0, 2pi). Give the answer as a set of exact values."
            answer: "{0, pi/3, 5pi/3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Use the Pythagorean identity sin^2 x = 1 - cos^2 x to write 2(1 - cos^2 x) + 3 cos x - 3 = 0. Simplify to 2 cos^2 x - 3 cos x + 1 = 0 and factor as (2 cos x - 1)(cos x - 1) = 0. Then cos x = 1/2 gives x = pi/3 and 5pi/3, and cos x = 1 gives x = 0. The solution set is {0, pi/3, 5pi/3}."
          - problem: "Solve 2cos^2 x - sin x - 2 = 0 on [0, 2pi). Give the answer as a set of exact values."
            answer: "{0, pi, 7pi/6, 11pi/6}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Use the Pythagorean identity cos^2 x = 1 - sin^2 x to write 2(1 - sin^2 x) - sin x - 2 = 0. Simplify to 2 sin^2 x + sin x = 0 and factor as sin x (2 sin x + 1) = 0. Then sin x = 0 gives x = 0 and pi; sin x = -1/2 gives x = 7pi/6 and 11pi/6. The solution set is {0, pi, 7pi/6, 11pi/6}."
          - problem: "Solve 3sin^2 x - 2cos x - 3 = 0 on [0, 2pi). How many solutions does the equation have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute sin^2 x = 1 - cos^2 x into 3sin^2 x - 2cos x - 3 = 0 to get 3(1 - cos^2 x) - 2cos x - 3 = 0. Simplify to 3cos^2 x + 2cos x = 0 and factor as cos x (3cos x + 2) = 0. Then cos x = 0 gives x = pi/2 and 3pi/2, and cos x = -2/3 gives one solution in quadrant II and one in quadrant III. Counting all four values on [0, 2pi), the equation has 4 solutions."
      - id: kp3
        name: Use a double-angle identity
        key_prerequisites: [double-half-angle-identities, basic-trig-equations]
        constraints: "never divide by a trig factor — factor it out instead"
        exemplars:
          - problem: 'Solve $\sin 2x = \sin x$ on $[0, 2\pi)$.'
            answer: "x = 0, π, π/3, 5π/3"
            solution_sketch: '$2\sin x\cos x - \sin x = \sin x(2\cos x - 1) = 0$.'
          - problem: 'Solve $\cos 2x + \sin x = 0$ on $[0, 2\pi)$.'
            answer: "x = π/2, 7π/6, 11π/6"
            solution_sketch: '$1 - 2\sin^2 x + \sin x = 0$, i.e. $2\sin^2 x - \sin x - 1 = 0$; factor as $(2\sin x + 1)(\sin x - 1) = 0$.'
    diagnostic_exemplar:
      problem: 'Solve $\cos 2x = \cos x$ on $[0, 2\pi)$.'
      answer: "x = 0, 2π/3, 4π/3"
      solution_sketch: '$2\cos^2 x - 1 = \cos x$, i.e. $(2\cos x + 1)(\cos x - 1) = 0$: $\cos x = 1$ gives $x = 0$, and $\cos x = -\frac{1}{2}$ gives $x = \frac{2\pi}{3}, \frac{4\pi}{3}$.'
    anki_seeds:
      - front: "Why must you factor sin x out of sin x cos x = sin x instead of dividing by sin x?"
        back: "Dividing discards the solutions where sin x = 0."
        type: basic
