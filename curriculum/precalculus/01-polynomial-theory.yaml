unit: polynomial-theory
course: precalculus
module: "Polynomial Theory"
topics:
  - id: remainder-factor-theorems
    name: Remainder and Factor Theorems
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: polynomial-division
        weight: 0.7
        key: true
      - id: evaluating-expressions
        weight: 0.5
        key: true
      - id: factoring-trinomials
        weight: 0.4
      - id: function-notation
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Remainder theorem
        key_prerequisites: [polynomial-division, evaluating-expressions]
        constraints: "cubic or lower, integer coefficients; divisor x - c with |c| <= 3"
        exemplars:
          - problem: 'Find the remainder when $p(x) = x^2 + 3x + 5$ is divided by $x - 2$.'
            answer: "15"
            solution_sketch: 'Remainder $= p(2) = 4 + 6 + 5 = 15$.'
          - problem: 'Find the remainder when $p(x) = x^3 - 4x + 1$ is divided by $x + 1$.'
            answer: "4"
            solution_sketch: '$p(-1) = -1 + 4 + 1 = 4$.'
          - problem: "Find the remainder when p(x) = x^3 - 2x^2 + 4x - 7 is divided by x - 3."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Remainder theorem: for divisor x - c, the remainder is p(c), so here p(3) must be found. Substitute: p(3) = 27 - 18 + 12 - 7. Simplify to 14. The remainder is 14."
          - problem: "Find the remainder when p(x) = 2x^3 + x^2 - 5x + 1 is divided by x + 2."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Remainder theorem: divide by x + 2, so c = -2, and the remainder is p(-2). Compute p(-2) = 2(-8) + 4 + 10 + 1. This simplifies to -1. The remainder is -1."
          - problem: "Find the remainder when p(x) = x^2 - 9 is divided by x - 1."
            answer: "-8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Remainder theorem: with divisor x - 1, the remainder equals p(1). Substitute: p(1) = 1^2 - 9 = 1 - 9. This is -8. The remainder is -8."
          - problem: "Find the remainder when p(x) = -x^3 + 2x^2 - 3x + 8 is divided by x + 3."
            answer: "62"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Remainder theorem: divisor x + 3 means c = -3, so the remainder is p(-3). Substitute: p(-3) = -(-27) + 2(9) - 3(-3) + 8. This becomes 27 + 18 + 9 + 8, which simplifies to 62. The remainder is 62."
      - id: kp2
        name: Factor theorem
        key_prerequisites: [polynomial-division]
        constraints: "yes/no factor checks on cubics with integer coefficients; divisor x - c with |c| <= 3; decided by evaluating p(c), never by long division"
        exemplars:
          - problem: "Consider p(x) = x^3 - 2x^2 - 9. Exactly one of four candidate divisors of the form x - c is a factor of p(x). Which of the following is a factor of p(x)? Select the correct option."
            answer: "x - 3"
            answer_contract: {"kind": "label", "options": [["x - 3"], ["x + 3"], ["x - 1"], ["x + 1"]]}
            solution_sketch: "Write the full polynomial p(x) = x^3 - 2x^2 - 9 and test each candidate with the factor theorem by evaluating p(c). The evaluation gives p(3) = 27 - 18 - 9 = 0, so x - 3 is a factor. Each wrong option fails the same test: x + 3 gives p(-3) = -54 (wrong sign of the root), x - 1 gives p(1) = -10 (tested c = 1 instead of c = 3), and x + 1 gives p(-1) = -10 (tested c = -1 instead of c = 3). The answer is x - 3."
          - problem: "Consider p(x) = x^3 + 8. Exactly one of four candidate divisors of the form x - c is a factor of p(x). Which of the following is a factor of p(x)? Select the correct option."
            answer: "x + 2"
            answer_contract: {"kind": "label", "options": [["x + 2"], ["x - 2"], ["x + 1"], ["x - 1"]]}
            solution_sketch: "Write p(x) = x^3 + 8 and apply the factor theorem, which decides a factor x - c by the value of p(c). The needed evaluation is p(-2) = (-2)^3 + 8 = -8 + 8 = 0, so x + 2 is a factor. Every wrong option fails: x - 2 gives p(2) = 16 (wrong sign of the root), x + 1 gives p(-1) = 7 (tested c = -1 instead of c = -2), and x - 1 gives p(1) = 9 (tested c = 1 instead of c = -2). The answer is x + 2."
          - problem: "To decide whether x + 1 is a factor of p(x) = x^3 + 2x^2 - 5x + 1, the factor theorem evaluates the polynomial at c = -1. Find p(-1)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full object p(x) = x^3 + 2x^2 - 5x + 1 and note that the divisor x + 1 corresponds to c = -1. By the factor theorem, substitute c = -1 into the polynomial: p(-1) = (-1)^3 + 2(-1)^2 - 5(-1) + 1 = -1 + 2 + 5 + 1 = 7. Since p(-1) is not 0, x + 1 would not be a factor, but the requested test value is 7. The answer is 7."
          - problem: "Exactly one of x - 1, x - 2, x - 3 is a factor of p(x) = x^3 - 6x^2 + 3x + 2. Test each candidate with the factor theorem by evaluating p(c). Give your answer as the value of c in that factor x - c."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write p(x) = x^3 - 6x^2 + 3x + 2 and evaluate p(c) for each listed candidate, as the factor theorem requires. First, p(1) = 1 - 6 + 3 + 2 = 0, so x - 1 is a factor. The other candidates fail the test: p(2) = 8 - 24 + 6 + 2 = -8 and p(3) = 27 - 54 + 9 + 2 = -16, so neither x - 2 nor x - 3 is a factor. The answer is 1."
          - problem: "How many of the divisors x + 1, x - 2, x + 2 are factors of p(x) = x^3 - 3x - 2? Decide each one with the factor theorem and give the number of factors as your answer."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full polynomial p(x) = x^3 - 3x - 2 and evaluate p(c) for each candidate divisor, as the factor theorem directs. The evaluations are p(-1) = -1 + 3 - 2 = 0, p(2) = 8 - 6 - 2 = 0, and p(-2) = -8 + 6 - 2 = -4. So x + 1 and x - 2 are factors while x + 2 is not, giving a count of 2. The answer is 2."
          - problem: "Test every integer c with |c| <= 3 in p(x) = x^3 - 6x^2 + 11x - 6 to find all divisors x - c that are factors. Find the sum of all such values of c."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write p(x) = x^3 - 6x^2 + 11x - 6 and evaluate p(c) at all six candidates c = 1, 2, 3, -1, -2, -3, as the factor theorem requires. The values are p(1) = 0, p(2) = 0, p(3) = 0, and p(-1) = -24, p(-2) = -60, p(-3) = -120. So the divisors of the required form are x - 1, x - 2, and x - 3, corresponding to c = 1, 2, 3. Their sum is 1 + 2 + 3 = 6. The answer is 6."
      - id: kp3
        name: Solve for an unknown coefficient
        key_prerequisites: [evaluating-expressions]
        constraints: "one unknown coefficient k or c in a quadratic or cubic; set p(c) = 0 and solve a linear equation; integer answers"
        exemplars:
          - problem: 'Find $k$ so that $x - 1$ is a factor of $x^3 + kx - 4$.'
            answer: "3"
            solution_sketch: '$p(1) = 1 + k - 4 = 0$, so $k = 3$.'
          - problem: 'Find $c$ so that $x + 2$ is a factor of $x^2 + 5x + c$.'
            answer: "6"
            solution_sketch: '$p(-2) = 4 - 10 + c = 0$.'
          - problem: "Find $k$ so that $x - 3$ is a factor of $x^2 + kx + 6$."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First write the polynomial as $p(x) = x^2 + kx + 6$. The factor theorem says $p(3) = 0$ because $x - 3$ is a factor. Evaluate: $p(3) = 9 + 3k + 6 = 15 + 3k$. Solve the linear equation $15 + 3k = 0$, which gives $3k = -15$ and $k = -5$. The value is -5."
          - problem: "Find $k$ so that $x + 1$ is a factor of $x^3 + kx^2 - 2x + 5$."
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $p(x) = x^3 + kx^2 - 2x + 5$. Since $x + 1 = x - (-1)$ is a factor, the factor theorem gives $p(-1) = 0$. Evaluate: $(-1)^3 + k(-1)^2 - 2(-1) + 5 = -1 + k + 2 + 5 = k + 6$. Set $k + 6 = 0$ and solve to get $k = -6$. The value is -6."
          - problem: "Find $c$ so that $x + 4$ is a factor of $x^2 - 3x + c$."
            answer: "-28"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $p(x) = x^2 - 3x + c$. Because $x + 4 = x - (-4)$ is a factor, the factor theorem says $p(-4) = 0$. Substitute: $p(-4) = 16 + 12 + c = 28 + c$. Solve $28 + c = 0$, so $c = -28$. The value is -28."
          - problem: "Find $c$ so that $x - 2$ is a factor of $x^3 - 4x^2 + cx + 6$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write $p(x) = x^3 - 4x^2 + cx + 6$. Since $x - 2$ is a factor, the factor theorem gives $p(2) = 0$. Evaluate: $8 - 16 + 2c + 6 = 2c - 2$. Set $2c - 2 = 0$, so $2c = 2$ and $c = 1$. The value is 1."
    diagnostic_exemplar:
      problem: 'Find $k$ so that $x - 2$ is a factor of $x^3 + kx - 10$.'
      answer: "1"
      solution_sketch: 'Factor theorem: $p(2) = 8 + 2k - 10 = 0$, so $k = 1$.'
    anki_seeds:
      - front: "Remainder theorem: dividing p(x) by x - c leaves remainder..."
        back: "p(c)"
        type: basic
      - front: "Factor theorem: x - c is a factor of p(x) iff..."
        back: "p(c) = 0"
        type: basic

  - id: rational-root-theorem
    name: Rational Root Theorem
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: remainder-factor-theorems
        weight: 0.7
        key: true
      - id: quadratic-equations-factoring
        weight: 0.5
        key: true
      - id: polynomial-division
        weight: 0.5
      - id: divisibility-rules
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: List the possible rational roots
        key_prerequisites: [divisibility-rules]
        constraints: "candidates ±(factor of constant)/(factor of leading coefficient); keep lists under 12 entries"
        exemplars:
          - problem: 'List all possible rational roots of $x^3 - 3x + 2$.'
            answer: "-2, -1, 1, 2"
            answer_contract: {kind: list, ordered: false, member: {kind: exact}}
            solution_sketch: 'Possible rational roots are $\\pm$ (factors of 2) $= \\pm 1, \\pm 2$.'
          - problem: 'List all possible rational roots of $2x^3 - x^2 + 2x - 1$.'
            answer: "-1, -1/2, 1/2, 1"
            answer_contract: {kind: list, ordered: false, member: {kind: exact}}
            solution_sketch: 'Possible rational roots are $\\pm$ (factors of 1)/(factors of 2) $= \\pm 1, \\pm 1/2$.'
      - id: kp2
        name: Test candidates to find a root
        key_prerequisites: [remainder-factor-theorems]
        constraints: "cubics with integer coefficients and at least one root among ±1, ±2, ±3, ±1/2; test by evaluating p at candidates"
        exemplars:
          - problem: 'Find one rational root of $x^3 - 6x^2 + 11x - 6$.'
            answer: "1"
            solution_sketch: '$p(1) = 1 - 6 + 11 - 6 = 0$; in fact $2$ and $3$ work too.'
          - problem: 'Find the rational root of $2x^3 - x^2 + 2x - 1$.'
            answer: "1/2"
            solution_sketch: '$p(1/2) = \frac{1}{4} - \frac{1}{4} + 1 - 1 = 0$.'
          - problem: "Find one rational root of x^3 - 2x^2 + 3x - 6."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write p(x) = x^3 - 2x^2 + 3x - 6. The rational root theorem lists candidate 2. Evaluate p(2) = 8 - 8 + 6 - 6 = 0. By the factor theorem, 2 is a root, so the rational root is 2."
          - problem: "Find one rational root of x^3 + 2x^2 + 3x + 2."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write p(x) = x^3 + 2x^2 + 3x + 2. The rational root theorem lists candidate -1. Evaluate p(-1) = -1 + 2 - 3 + 2 = 0. By the factor theorem, -1 is a root, so the rational root is -1."
          - problem: "Find the rational root of 2x^3 + x^2 + 2x + 1."
            answer: "-1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write p(x) = 2x^3 + x^2 + 2x + 1. The rational root theorem lists candidate -1/2. Evaluate p(-1/2) = 2(-1/8) + 1/4 + 2(-1/2) + 1 = 0. By the factor theorem, -1/2 is a root, so the rational root is -1/2."
          - problem: "Find the rational root of x^3 - 3x^2 + x - 3."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write p(x) = x^3 - 3x^2 + x - 3. The rational root theorem lists candidate 3. Evaluate p(3) = 27 - 27 + 3 - 3 = 0. By the factor theorem, 3 is a root, so the rational root is 3."
      - id: kp3
        name: Factor completely after finding a root
        key_prerequisites: [polynomial-division, quadratic-equations-factoring]
        constraints: "monic cubics with three distinct integer roots, |root| <= 5; divide out the found root, then factor the quadratic"
        exemplars:
          - problem: 'Solve $x^3 - 2x^2 - 5x + 6 = 0$.'
            answer: "-2, 1, 3"
            answer_contract: {kind: list, ordered: false, member: {kind: exact}}
            solution_sketch: '$p(1) = 0$; dividing gives $x^2 - x - 6 = (x - 3)(x + 2)$.'
          - problem: 'Solve $x^3 - 6x^2 + 11x - 6 = 0$.'
            answer: "1, 2, 3"
            answer_contract: {kind: list, ordered: false, member: {kind: exact}}
    diagnostic_exemplar:
      problem: 'Solve $x^3 - 4x^2 + x + 6 = 0$.'
      answer: "-1, 2, 3"
      answer_contract: {kind: list, ordered: false, member: {kind: exact}}
      solution_sketch: 'Candidates $\pm 1, \pm 2, \pm 3, \pm 6$; $p(-1) = -1 - 4 - 1 + 6 = 0$, and dividing by $x + 1$ leaves $x^2 - 5x + 6 = (x - 2)(x - 3)$.'
    anki_seeds:
      - front: "Rational root theorem: every rational root of a polynomial with integer coefficients has the form..."
        back: "±p/q where p divides the constant term and q divides the leading coefficient."
        type: basic

  - id: fundamental-theorem-algebra-multiplicity
    name: Fundamental Theorem of Algebra and Multiplicity
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: remainder-factor-theorems
        weight: 0.5
        key: true
      - id: polynomial-multiplication
        weight: 0.5
        key: true
      - id: quadratic-equations-factoring
        weight: 0.4
      - id: rational-root-theorem
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Count roots with multiplicity
        key_prerequisites: [remainder-factor-theorems]
        constraints: "factored polynomials of degree 3-5"
        exemplars:
          - problem: "The polynomial p(x) = (x - 2)^3 (x + 1)^2 is fully factored. Find the multiplicity of the root x = 2."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Factor theorem: each factor x - r gives a root r. Multiplicity rule: the exponent on x - 2 is 3. The multiplicity is 3."
          - problem: 'Counting multiplicity, how many roots does a degree-$7$ polynomial have (over the complex numbers)?'
            answer: "7"
          - problem: "The polynomial p(x) = (x + 4)(x - 1)^2 (x - 3)^2 is fully factored. Find the degree of p."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Degree rule: the degree of a product of linear factors is the sum of the exponents. Multiplicity sum: 1 + 2 + 2 = 5. The degree is 5."
          - problem: "The polynomial p(x) = (2x - 6)^4 (x + 5) is fully factored. Find the multiplicity of the root x = 3."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Factor theorem: 2x - 6 = 2(x - 3), so x = 3 is a root. Multiplicity rule: the exponent on the factor x - 3 is 4. The multiplicity is 4."
          - problem: "The polynomial p(x) = (x - 1)^2 (x + 2)^3 (x - 4) is fully factored. Find the multiplicity of the root x = -2."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Factor theorem: x + 2 = x - (-2) gives the root -2. Multiplicity rule: the exponent on x + 2 is 3. The multiplicity is 3."
          - problem: "The polynomial p(x) = (x - 5)^2 (x + 1)^3 (x - 2)^4 is fully factored. Find the smallest multiplicity among its roots."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiplicity list: the exponents give multiplicities 2, 3, and 4. Smallest value rule: compare the numbers 2, 3, and 4. The smallest multiplicity is 2."
      - id: kp2
        name: Crossing versus touching at a repeated root
        key_prerequisites: [quadratic-equations-factoring]
        constraints: "odd multiplicity crosses the x-axis; even multiplicity touches and turns"
        exemplars:
          - problem: 'For $p(x) = (x - 1)^2 (x + 3)$, at which zero does the graph touch without crossing?'
            answer: "x = 1"
            solution_sketch: 'Even multiplicity touches; odd multiplicity crosses.'
          - problem: "The polynomial is p(x) = (x + 2)^3. Find the multiplicity of the zero at x = -2."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: by the definition of multiplicity, the factor (x + 2) appears with exponent 3, so the zero x = -2 has multiplicity 3. Step 2: by the parity rule, an odd multiplicity means the graph crosses the x-axis at this zero, consistent with the repeated factor. The answer is 3."
          - problem: "The polynomial is p(x) = (x + 1)^3 (x - 2)^2. Find the x-coordinate of the zero where the graph touches the x-axis without crossing."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the factors show zeros at x = -1 with multiplicity 3 and x = 2 with multiplicity 2. Step 2: by the parity rule, an odd multiplicity crosses and an even multiplicity touches without crossing. The touching zero is x = 2, so the answer is 2."
          - problem: "The polynomial is p(x) = x^2 (x - 3)^3 (x + 1)^4. Find the sum of the x-coordinates of the zeros where the graph touches the x-axis without crossing."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the factors show zeros at x = 0 with multiplicity 2, x = 3 with multiplicity 3, and x = -1 with multiplicity 4. Step 2: by the parity rule, even multiplicities touch without crossing, so the touching zeros are x = 0 and x = -1. Step 3: their sum is 0 + (-1) = -1, so the answer is -1."
          - problem: "A polynomial p(x) has a zero at x = 5 where its graph touches the x-axis without crossing. Find the smallest possible multiplicity of this zero."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: by the parity rule, a zero where the graph touches the x-axis without crossing has an even multiplicity. Step 2: the smallest positive even integer is 2, so a double root is the least possibility. The answer is 2."
          - problem: "The polynomial is p(x) = (x - 2)^2 (x + 5)^3. Find the x-coordinate of the zero where the graph crosses the x-axis."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the factors show zeros at x = 2 with multiplicity 2 and x = -5 with multiplicity 3. Step 2: by the parity rule, an odd multiplicity crosses the x-axis while an even multiplicity only touches it. The crossing zero is x = -5, so the answer is -5."
      - id: kp3
        name: Build a polynomial from given roots
        key_prerequisites: [polynomial-multiplication]
        constraints: "degree 3-4, leading coefficient 1, integer roots with at most one double root; expand only when the problem says to"
        exemplars:
          - problem: 'Write a degree-$3$ polynomial with leading coefficient $1$, a double root at $x = 2$, and a root at $x = -5$. Expand it.'
            answer: "x^3 + x^2 - 16x + 20"
            solution_sketch: '$(x-2)^2(x+5) = (x^2 - 4x + 4)(x + 5) = x^3 + x^2 - 16x + 20$.'
          - problem: 'Write, in factored form, a degree-$4$ polynomial with roots $0$, $3$ (double), and $-1$, leading coefficient $1$.'
            answer: "x(x - 3)^2 (x + 1)"
          - problem: "Write a degree-3 polynomial with leading coefficient 1, a double root at x = 3, and a simple root at x = -2. Give the expanded polynomial."
            answer: "x^3 - 4x^2 - 3x + 18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start from the roots: a double root at 3 gives (x - 3)^2, and a simple root at -2 gives (x + 2), so the full object is (x - 3)^2 (x + 2). Expand the square by polynomial multiplication: (x - 3)^2 = x^2 - 6x + 9. Multiply by x + 2: (x^2 - 6x + 9)(x + 2) = x^3 - 4x^2 - 3x + 18. The expanded polynomial is x^3 - 4x^2 - 3x + 18."
          - problem: "Write a degree-4 polynomial with leading coefficient 1, roots -1 and 4, and a double root at x = 2. Give the expanded polynomial."
            answer: "x^4 - 7x^3 + 12x^2 + 4x - 16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The roots give the factors: (x + 1), (x - 2)^2 for the double root, and (x - 4). The full object is (x + 1)(x - 2)^2 (x - 4). Expand (x - 2)^2 = x^2 - 4x + 4. Multiply (x + 1)(x - 4) = x^2 - 3x - 4, then multiply by x^2 - 4x + 4 to get x^4 - 7x^3 + 12x^2 + 4x - 16. The expanded polynomial is x^4 - 7x^3 + 12x^2 + 4x - 16."
          - problem: "Write a degree-3 polynomial with leading coefficient 1 and roots 0, -3, and 2. Give the polynomial in factored form, without expanding."
            answer: "x(x + 3)(x - 2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The roots 0, -3, and 2 give the factors x, (x + 3), and (x - 2). The leading coefficient is 1, so the full object is x(x + 3)(x - 2). This is already factored, so no expansion is needed. The polynomial in factored form is x(x + 3)(x - 2)."
          - problem: "Write a degree-4 polynomial with leading coefficient 1 and roots 1, -1, 2, and -2. Give the expanded polynomial."
            answer: "x^4 - 5x^2 + 4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The four roots 1, -1, 2, and -2 give the factors (x - 1), (x + 1), (x - 2), and (x + 2). The full object is (x - 1)(x + 1)(x - 2)(x + 2). Pair the factors: (x - 1)(x + 1) = x^2 - 1 and (x - 2)(x + 2) = x^2 - 4. Multiply: (x^2 - 1)(x^2 - 4) = x^4 - 5x^2 + 4. The expanded polynomial is x^4 - 5x^2 + 4."
    diagnostic_exemplar:
      problem: 'Write the degree-$3$ polynomial with leading coefficient $1$ having a double root at $x = 1$ and a root at $x = -3$, expand it, and state at which zero its graph touches the $x$-axis without crossing.'
      answer: 'x^3 + x^2 - 5x + 3; the graph touches without crossing at x = 1 (even multiplicity)'
      answer_contract: {kind: none}
      solution_sketch: '$(x-1)^2(x+3) = (x^2 - 2x + 1)(x + 3) = x^3 + x^2 - 5x + 3$; the double root at $x = 1$ has even multiplicity, so the graph touches and turns there, while it crosses at $x = -3$.'
    anki_seeds:
      - front: "Fundamental theorem of algebra: a degree-n polynomial has how many complex roots (with multiplicity)?"
        back: "Exactly n."
        type: basic
      - front: "At a zero of even multiplicity the graph ... the x-axis; at odd multiplicity it ..."
        back: "touches (and turns around); crosses"
        type: basic

  - id: polynomial-end-behavior-graphing
    name: End Behavior and Graphing Polynomials
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: fundamental-theorem-algebra-multiplicity
        weight: 0.6
        key: true
      - id: quadratic-graphs-vertex
        weight: 0.4
        key: true
      - id: function-transformations-shifts
        weight: 0.3
      - id: polynomial-multiplication
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: End behavior from the leading term
        key_prerequisites: [quadratic-graphs-vertex]
        constraints: "classify by degree parity and leading-coefficient sign"
        exemplars:
          - problem: 'Describe the end behavior of $p(x) = -2x^3 + x - 7$.'
            answer: "as x → -∞, p(x) → +∞; as x → +∞, p(x) → -∞"
            answer_contract: {kind: none}
            solution_sketch: 'Odd degree, negative leading coefficient.'
          - problem: 'Describe the end behavior of $p(x) = x^4 - 5x^2$.'
            answer: "p(x) → +∞ on both ends"
            answer_contract: {kind: none}
            solution_sketch: 'Even degree, positive leading coefficient: both ends rise to $+\\infty$.'
      - id: kp2
        name: Sign of the polynomial between zeros
        key_prerequisites: [fundamental-theorem-algebra-multiplicity]
        constraints: "factored cubics with integer zeros, at most one repeated factor; answer positive or negative, decided by one test point"
        exemplars:
          - problem: "For p(x) = x(x - 3)(x + 1), use one test point to determine the sign of p on the interval (0, 3), and give the value p(1). State the sign of p and the value of p(1)."
            answer: "sign = negative; value = -4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["positive"], ["negative"]]}, "name": "sign"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1 (zeros): p(x) = x(x - 3)(x + 1) has zeros at -1, 0, and 3, so the interval (0, 3) contains no zero and p keeps one sign there. Step 2 (test point): choose x = 1; then p(1) = (1)(-2)(2) = -4. Since -4 is below zero, the sign is negative. The option positive is wrong because the test value p(1) = -4 is not greater than zero. The answer is sign = negative; value = -4."
          - problem: "For p(x) = (x - 2)^2 (x + 1), use one test point to determine the sign of p on the interval (-1, 2), and give the value p(0). State the sign of p and the value of p(0)."
            answer: "sign = positive; value = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["positive"], ["negative"]]}, "name": "sign"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1 (zeros and multiplicity): p(x) = (x - 2)^2 (x + 1) has a double zero at 2 and a simple zero at -1, so the interval (-1, 2) contains no zero. Step 2 (test point): choose x = 0; then p(0) = (-2)^2 (1) = 4. Since 4 is above zero, the sign is positive. The option negative is wrong because the square factor is never negative and the remaining factor is positive at x = 0. The answer is sign = positive; value = 4."
          - problem: "For p(x) = (x + 2)(x - 1)(x - 4), use one test point to determine the sign of p on the interval (-2, 1), and give the value p(0). State the sign of p and the value of p(0)."
            answer: "sign = positive; value = 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["positive"], ["negative"]]}, "name": "sign"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1 (zeros): p(x) = (x + 2)(x - 1)(x - 4) has simple zeros at -2, 1, and 4, so the interval (-2, 1) lies between two consecutive zeros. Step 2 (test point): choose x = 0; then p(0) = (2)(-1)(-4) = 8. Since 8 is above zero, the sign is positive. The option negative is wrong because the product of two negative factors and one positive factor is positive. The answer is sign = positive; value = 8."
          - problem: "For p(x) = -x(x + 3)(x - 2), use one test point to determine the sign of p on the interval (-3, 0), and give the value p(-1). State the sign of p and the value of p(-1)."
            answer: "sign = negative; value = -6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["positive"], ["negative"]]}, "name": "sign"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1 (zeros): p(x) = -x(x + 3)(x - 2) has zeros at -3, 0, and 2 with a reflected leading term, so the interval (-3, 0) lies between two consecutive zeros. Step 2 (test point): choose x = -1; then p(-1) = (1)(2)(-3) = -6. Since -6 is below zero, the sign is negative. The option positive is wrong because the leading minus sign flips the product at the test point. The answer is sign = negative; value = -6."
          - problem: "For p(x) = x(x - 2)(x + 4), build a full sign chart and find every interval on which p(x) > 0. Give the answer as an inequality in x."
            answer: "-4 < x < 0 or x > 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1 (zeros and sign chart): p(x) = x(x - 2)(x + 4) has simple zeros at -4, 0, and 2, which split the line into four intervals. Step 2 (test points): on (-4, 0) use x = -1 to get (-1)(-3)(3) = 9; on (2, infinity) use x = 3 to get (3)(1)(7) = 21. Both are above zero. On (-infinity, -4) use x = -5 to get (-5)(-7)(-1) = -35, and on (0, 2) use x = 1 to get (1)(-1)(5) = -5; both are below zero. The answer is -4 < x < 0 or x > 2."
          - problem: "For p(x) = (x + 1)(x - 3)^2, use the multiplicity of each zero to find every interval on which p(x) < 0. Give the answer as an inequality in x."
            answer: "x < -1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1 (zeros and multiplicity): p(x) = (x + 1)(x - 3)^2 has a simple zero at -1 and a double zero at 3, so the sign changes only at -1. Step 2 (test points): the factor (x - 3)^2 is never below zero, so p(x) is below zero exactly where x + 1 is below zero, that is x < -1. Check: at x = -2, p(-2) = (-1)(25) = -25, below zero; at x = 0, p(0) = (1)(9) = 9, above zero. The answer is x < -1."
      - id: kp3
        name: Key graph features
        key_prerequisites: [fundamental-theorem-algebra-multiplicity]
        constraints: "y-intercepts of factored polynomials (evaluate at 0); turning-point counts from the degree (at most n - 1)"
        exemplars:
          - problem: 'Find the $y$-intercept of $p(x) = (x - 1)^2 (x + 2)$.'
            answer: "(0, 2)"
            solution_sketch: '$p(0) = (-1)^2 (2) = 2$.'
          - problem: 'What is the maximum number of turning points of a degree-$5$ polynomial?'
            answer: "4"
          - problem: "The polynomial $p(x) = (x + 2)^2 (x - 3)$ is given in factored form. Find the y-coordinate of the y-intercept of the graph of $p$."
            answer: "-12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $p(x) = (x + 2)^2 (x - 3)$, the y-intercept rule sets $x = 0$ and keeps the factored form. Evaluate $p(0) = (0 + 2)^2 (0 - 3) = 4 \\cdot (-3) = -12$. The y-coordinate of the y-intercept is -12."
          - problem: "The graph of $p(x) = (x + 5)(x - 11)(x - 17)(x - 24)$ is the graph of a polynomial. What is the maximum number of turning points of this graph?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For $p(x) = (x + 5)(x - 11)(x - 17)(x - 24)$, the degree rule for products adds the degrees of the factors, so the degree is $1 + 1 + 1 + 1 = 4$. The turning-point rule says a degree-$n$ polynomial has at most $n - 1$ turning points, so $4 - 1 = 3$. The maximum number of turning points is 3."
          - problem: "Let $p(x) = -2(x + 1)(x - 4)^2$. Find the y-intercept of the graph of $p$. Give the answer as (x, y)."
            answer: "(0, -32)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "For $p(x) = -2(x + 1)(x - 4)^2$, the y-intercept rule sets $x = 0$ and keeps the leading coefficient. Evaluate $p(0) = -2(0 + 1)(0 - 4)^2 = -2 \\cdot 1 \\cdot 16 = -32$. The y-intercept is (0, -32)."
          - problem: "For $p(x) = (x - 2)^2(x + 9)(x - 16)(x - 25)$, let $b$ be the y-coordinate of the y-intercept and let $t$ be the maximum number of turning points of the graph. Give the answer as b = value; t = value."
            answer: "b = 14400; t = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "t"}]}
            solution_sketch: "The full result for $p(x) = (x - 2)^2(x + 9)(x - 16)(x - 25)$ is $b = 14400$ and $t = 4$. The y-intercept rule sets $x = 0$: $p(0) = (0 - 2)^2 (0 + 9)(0 - 16)(0 - 25) = 4 \\cdot 9 \\cdot 400 = 14400$. The degree rule for products gives $2 + 1 + 1 + 1 = 5$, and the turning-point rule gives at most $5 - 1 = 4$ turning points. The answers are b = 14400; t = 4."
    diagnostic_exemplar:
      problem: 'For $p(x) = x(x + 3)(x - 1)$, describe the end behavior, and state whether $p$ is positive or negative on the interval $(-3, 0)$.'
      answer: 'as x → -∞, p(x) → -∞; as x → +∞, p(x) → +∞; p is positive on (-3, 0)'
      answer_contract: {kind: none}
      solution_sketch: 'Expanded, the leading term is $x^3$ (odd degree, positive coefficient), so the ends go down-left and up-right; testing $x = -1$ gives $(-1)(2)(-2) = 4 > 0$.'
    anki_seeds:
      - front: "End behavior of a polynomial is decided entirely by..."
        back: "The leading term (its degree parity and the sign of its coefficient)."
        type: basic

  - id: polynomial-inequalities
    name: Polynomial Inequalities
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: polynomial-end-behavior-graphing
        weight: 0.5
        key: true
      - id: quadratic-equations-factoring
        weight: 0.6
        key: true
      - id: linear-inequalities
        weight: 0.5
      - id: compound-inequalities
        weight: 0.4
      - id: factoring-trinomials
        weight: 0.4
      # kp3's exemplars demand answers "in interval notation" ([-3, 3],
      # (-∞, 0) ∪ (2, ∞)) — taught in foundations:interval-notation (re-audit R-01).
      - id: interval-notation
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Quadratic inequalities
        key_prerequisites: [quadratic-equations-factoring, linear-inequalities]
        constraints: "factorable quadratics with integer roots"
        exemplars:
          - problem: 'Solve $x^2 - 4 > 0$.'
            answer: "x < -2 or x > 2"
            answer_contract: {kind: inequality_union}
            solution_sketch: 'Zeros $\pm 2$; the parabola opens up, so it is positive outside the roots.'
          - problem: 'Solve $x^2 - 5x + 6 \le 0$.'
            answer: "2 ≤ x ≤ 3"
          - problem: "Find every x with x^2 - 9 <= 0. Give the answer as an inequality in x."
            answer: "-3 <= x <= 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1 factors the quadratic by the factoring rule: x^2 - 9 = (x - 3)(x + 3). Step 2 uses the upward parabola sign rule; the zeros -3 and 3 split the line, and the product is negative between them. The test x = 0 gives -9 <= 0, which is true, so both roots are included. The solution is -3 <= x <= 3."
          - problem: "Solve the inequality x^2 + 2x - 8 > 0. Give the answer as an inequality in x."
            answer: "x < -4 or x > 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1 factors using the factoring rule: x^2 + 2x - 8 = (x + 4)(x - 2). Step 2 uses the upward parabola sign rule; the zeros -4 and 2 split the line, and the sign is positive outside them. The test x = 0 gives -8 > 0 false. The solution is x < -4 or x > 2."
          - problem: "Solve the inequality x^2 - 6x + 5 < 0. Give the answer as an inequality in x."
            answer: "1 < x < 5"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1 factors using the factoring rule: x^2 - 6x + 5 = (x - 1)(x - 5). Step 2 uses the upward parabola sign rule; the zeros 1 and 5 split the line, and the sign is negative between them. The test x = 3 gives -4 < 0 true. The solution is 1 < x < 5."
          - problem: "Solve the inequality x^2 - x - 12 >= 0. Give the answer as an inequality in x."
            answer: "x <= -3 or x >= 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1 factors using the factoring rule: x^2 - x - 12 = (x - 4)(x + 3). Step 2 uses the upward parabola sign rule; the zeros -3 and 4 split the line, and the sign is positive outside them. The test x = 0 gives -12 >= 0 false. The solution is x <= -3 or x >= 4."
      - id: kp2
        name: Sign charts for factored cubics
        key_prerequisites: [polynomial-end-behavior-graphing]
        constraints: "factored cubics with integer zeros, |zero| <= 4, at most one squared factor; solutions as inequality chains"
        exemplars:
          - problem: 'Solve $x(x - 3)(x + 2) < 0$.'
            answer: "x < -2 or 0 < x < 3"
            answer_contract: {kind: inequality_union}
            solution_sketch: 'Sign chart over zeros $-2, 0, 3$: negative on $(-\infty, -2)$ and $(0, 3)$.'
          - problem: 'Solve $(x - 1)^2 (x + 4) \ge 0$.'
            answer: "x ≥ -4"
            solution_sketch: 'The square factor never goes negative; sign follows $x + 4$, with equality allowed.'
          - problem: "Solve the inequality x(x + 1)(x - 4) > 0."
            answer: "-1 < x < 0 or x > 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1, zeros: the factored form x(x + 1)(x - 4) gives zeros -1, 0 and 4. Step 2, sign chart: the product is negative, positive, negative, positive on the four intervals split by these zeros. Step 3, read the strict inequality: only the positive parts count, so the answer is -1 < x < 0 or x > 4."
          - problem: "Solve the inequality (x - 3)^2 (x + 1) < 0."
            answer: "x < -1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1, zeros: the factors give zeros -1 and 3, and (x - 3)^2 is never negative. Step 2, sign chart: since the squared factor is positive except at x = 3, the sign of the product follows x + 1. Step 3, read the strict inequality: the product is negative exactly when x is less than -1, so the answer is x < -1."
          - problem: "Solve the inequality x(x - 4)(x + 2) <= 0."
            answer: "x <= -2 or 0 <= x <= 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1, zeros: the factored form x(x - 4)(x + 2) gives zeros -2, 0 and 4. Step 2, sign chart: the product is negative left of -2 and between 0 and 4, and positive between -2 and 0 and right of 4. Step 3, the inequality allows equality, so the endpoints are kept and the answer is x <= -2 or 0 <= x <= 4."
          - problem: "Solve the inequality -(x + 3)(x - 1)(x - 4) > 0."
            answer: "x < -3 or 1 < x < 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1, zeros: the factored form -(x + 3)(x - 1)(x - 4) gives zeros -3, 1 and 4. Step 2, sign chart: test one point in each interval, for example x = -4 gives 40, x = 0 gives -12, x = 2 gives 10 and x = 5 gives -32, so the expression is positive left of -3 and between 1 and 4. Step 3, read the strict inequality: the answer is x < -3 or 1 < x < 4."
      - id: kp3
        name: Strict versus inclusive boundaries
        key_prerequisites: [compound-inequalities]
        constraints: "factorable quadratics; always ask for interval notation, mixing strict and inclusive cases; unions written with ∪"
        exemplars:
          - problem: 'Solve $x^2 \le 9$. Express the answer as an interval.'
            answer: "[-3, 3]"
          - problem: 'Solve $x^2 - 2x > 0$ in interval notation.'
            answer: "(-∞, 0) ∪ (2, ∞)"
            answer_contract: {kind: inequality_union}
            solution_sketch: '$x(x - 2) > 0$: positive outside the roots; endpoints excluded.'
          - problem: "Solve the inequality x^2 - x - 6 <= 0. Give the answer as an interval."
            answer: "[-2, 3]"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The inequality is x^2 - x - 6 <= 0. Factoring the trinomial gives (x - 3)(x + 2) <= 0, so the boundary points are x = -2 and x = 3. Sign test: the parabola opens upward, so the product is negative between the roots, and both endpoints are included because the inequality is <=. The solution is [-2, 3]."
          - problem: "Solve the inequality x^2 - 9x + 20 > 0. Give the answer as an inequality in x."
            answer: "x < 4 or x > 5"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The inequality is x^2 - 9x + 20 > 0. Factoring gives (x - 4)(x - 5) > 0, so the boundary points are x = 4 and x = 5. Sign test: the parabola opens upward, so the product is positive outside the roots, and the strict inequality excludes both endpoints. The solution is x < 4 or x > 5."
          - problem: "Solve the inequality -x^2 + 2x + 8 >= 0. Give the answer as an inequality in x."
            answer: "-2 <= x <= 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The inequality is -x^2 + 2x + 8 >= 0. Multiply by -1 to get x^2 - 2x - 8 <= 0, which factors as (x - 4)(x + 2) <= 0; remember to flip the direction of the inequality. The boundary points are x = -2 and x = 4. Sign test: the original parabola opens downward, so it is nonnegative between the roots, and both endpoints are included because of the >= sign. The solution is -2 <= x <= 4."
          - problem: "Solve the compound condition x^2 - 2x - 8 <= 0 and x > 0. Give the answer as an inequality in x."
            answer: "0 < x <= 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The inequality is x^2 - 2x - 8 <= 0 with x > 0. Factoring gives (x - 4)(x + 2) <= 0, so the quadratic holds for -2 <= x <= 4. Intersecting with the condition x > 0 removes the part at and below 0, leaving one strict endpoint and one inclusive endpoint. The solution is 0 < x <= 4."
    diagnostic_exemplar:
      problem: 'Solve $x(x - 2)(x + 3) \ge 0$ in interval notation.'
      answer: "[-3, 0] ∪ [2, ∞)"
      answer_contract: {kind: inequality_union}
      solution_sketch: 'Zeros $-3, 0, 2$; sign chart gives $+$ on $(-3, 0)$ and $(2, \infty)$; $\ge$ includes all three zeros.'
    anki_seeds:
      - front: "To solve a polynomial inequality, find the zeros, then..."
        back: "Test the sign on each interval between consecutive zeros (sign chart)."
        type: basic
