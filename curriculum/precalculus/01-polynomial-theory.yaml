unit: polynomial-theory
course: precalculus
module: "Polynomial Theory"
topics:
  - id: remainder-factor-theorems
    name: Remainder and Factor Theorems
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: polynomial-division
        weight: 0.7
        key: true
      - id: evaluating-expressions
        weight: 0.5
        key: true
      - id: factoring-trinomials
        weight: 0.4
      - id: function-notation
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Remainder theorem
        key_prerequisites: [polynomial-division, evaluating-expressions]
        try_first:
          problem: 'Find the remainder when $x^2 - 5x + 3$ is divided by $x - 1$.'
          answer_contract: {"kind": "exact"}
          answer: '-1'
          reveal: 'Long division works, but there is a shortcut: the remainder is the value of the polynomial at $x = 1$, which is $1 - 5 + 3 = -1$. The remainder theorem says this holds for every polynomial and every divisor $x - c$.'
        exemplars:
          - problem: 'Find the remainder when $x^2 + 3x + 5$ is divided by $x - 2$.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the remainder theorem, the remainder equals the value of the polynomial at $x = 2$. That value is $4 + 6 + 5 = 15$, so the remainder is $15$.'
          - problem: 'What is the remainder when $x^3 - 4x + 1$ is divided by $x + 1$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The divisor $x + 1$ is $x - (-1)$, so $c = -1$ and the remainder is the value at $-1$. That value is $-1 + 4 + 1 = 4$.'
          - problem: 'The height of a drone in metres, $t$ seconds after launch, is $h(t) = t^3 - 6t^2 + 10t + 3$. A pilot divides $h(t)$ by $t - 3$. What height does the remainder give?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The remainder on division by $t - 3$ is $h(3) = 27 - 54 + 30 + 3 = 6$. So the remainder is $6$, which is the height of the drone in metres after $3$ seconds.'
          - problem: 'Find the remainder when $2x^3 + x^2 - 5x + 1$ is divided by $x + 2$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $c = -2$, so the remainder is the value at $-2$. That value is $2(-8) + 4 + 10 + 1 = -1$.'
          - problem: 'Find the remainder when $x^3 + 2x^2 - 5$ is divided by $x - 2$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The divisor $x - 2$ has $c = 2$, not $c = -2$, so the value at $2$ is needed. That value is $8 + 8 - 5 = 11$, so the remainder is $11$.'
          - problem: 'A polynomial $p$ has $p(-2) = 9$, $p(0) = -3$, $p(1) = 4$ and $p(3) = 11$. What is the remainder when $p(x)$ is divided by $x + 2$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The divisor $x + 2$ is $x - (-2)$, so the remainder is the value of $p$ at $-2$. The table gives $p(-2) = 9$, so the remainder is $9$.'
          - problem: 'A stall''s profit in dollars on $x$ boxes is $P(x) = -x^3 + 6x^2 + 2x + 10$. What profit does the remainder give when $P(x)$ is divided by $x - 4$?'
            answer: '50'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The remainder is the value at $x = 4$. That value is $-64 + 96 + 8 + 10 = 50$, so the remainder is $50$ dollars, the profit on $4$ boxes.'
          - problem: 'Find the remainder when $-x^3 + 2x^2 - 3x + 8$ is divided by $x + 3$.'
            answer: '62'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $c = -3$, so the remainder is the value at $-3$. That value is $27 + 18 + 9 + 8 = 62$.'
        constraints: "cubic or lower, integer coefficients; divisor x - c with |c| <= 3; remainders asked directly, from a table of values, or in a measured context"
      - id: kp2
        name: Factor theorem
        key_prerequisites: [polynomial-division]
        exemplars:
          - problem: 'Is $x + 2$ a factor of $x^3 - 3x^2 + 5x - 6$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "yes, it is", "it is a factor", "is a factor", "a factor", "it is", "yes it is a factor"], ["no", "no it is not", "no, it is not", "it is not a factor", "is not a factor", "not a factor", "it is not", "no it is not a factor"]]}
            solution_sketch: 'Write $x + 2$ as $x - (-2)$ and find the value of the polynomial at $-2$. That value is $-8 - 12 - 10 - 6 = -36$, which is not $0$, so $x + 2$ is not a factor.'
          - problem: 'A tank holds $V(x) = x^3 - 6x^2 + 3x + 2$ litres, and its height must divide $V(x)$ exactly. Exactly one of $x - 1$, $x - 2$ and $x - 3$ can be the height. Which one?'
            answer: 'x - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Test each candidate by finding the value at $c$. At $1$ the value is $1 - 6 + 3 + 2 = 0$, while at $2$ it is $-8$ and at $3$ it is $-16$. So the height is $x - 1$.'
          - problem: 'Exactly one of $x + 2$, $x - 2$, $x + 1$ and $x - 1$ is a factor of $x^3 + 8$. Which one?'
            answer: 'x + 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A factor $x - c$ needs the value $0$ at $c$. At $-2$ the value is $-8 + 8 = 0$, but at $2$ it is $16$, at $-1$ it is $7$ and at $1$ it is $9$. So the factor is $x + 2$.'
          - problem: 'Which of $x + 1$, $x - 2$ and $x + 2$ are factors of $x^3 - 3x - 2$?'
            answer: 'x + 1, x - 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Find the value at $-1$, at $2$ and at $-2$. The values are $-1 + 3 - 2 = 0$, $8 - 6 - 2 = 0$ and $-8 + 6 - 2 = -4$. So $x + 1$ and $x - 2$ are factors, and $x + 2$ is not.'
          - problem: 'Is $x + 3$ a factor of $x^3 + 2x^2 - 5x - 6$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "yes, it is", "it is a factor", "is a factor", "a factor", "it is", "yes it is a factor"], ["no", "no it is not", "no, it is not", "it is not a factor", "is not a factor", "not a factor", "it is not", "no it is not a factor"]]}
            solution_sketch: 'The divisor $x + 3$ is $x - (-3)$, so the value at $-3$ is needed. That value is $-27 + 18 + 15 - 6 = 0$, so $x + 3$ is a factor.'
          - problem: 'Find every integer $c$ with $|c| \le 3$ for which $x - c$ is a factor of $x^3 - 6x^2 + 11x - 6$.'
            answer: '1, 2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Find the value of the polynomial at each integer from $-3$ to $3$. It is $0$ at $1$, $2$ and $3$, and it is $-24$, $-60$ and $-120$ at $-1$, $-2$ and $-3$. So $c = 1, 2, 3$.'
          - problem: 'A crate has volume $V(x) = x^3 - 2x^2 - 9$ cubic feet. A joiner wants one edge to have length $x - c$ with $c$ a whole number, so that $x - c$ divides $V(x)$. Exactly one of $x - 3$, $x + 3$, $x - 1$ and $x + 1$ works. Which one?'
            answer: 'x - 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value at $3$ is $27 - 18 - 9 = 0$, so $x - 3$ divides $V(x)$. The value at $-3$ is $-54$, at $1$ it is $-10$ and at $-1$ it is $-12$, so the other three fail.'
        constraints: "yes/no and which-divisor factor checks on cubics with integer coefficients; divisor x - c with |c| <= 3; decided by evaluating p(c), never by long division"
      - id: kp3
        name: Solve for an unknown coefficient
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Find $k$ so that $x - 1$ is a factor of $x^3 + kx - 4$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because $x - 1$ is a factor, the value at $x = 1$ must be $0$. That gives $1 + k - 4 = 0$, so $k = 3$.'
          - problem: 'Find $c$ so that $x + 2$ is a factor of $x^2 + 5x + c$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A factor $x + 2$ needs the value $0$ at $x = -2$. That gives $4 - 10 + c = 0$, so $c = 6$.'
          - problem: 'Find $k$ so that $x - 3$ is a factor of $x^2 + kx + 6$.'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A factor $x - 3$ needs the value $0$ at $x = 3$. That gives $9 + 3k + 6 = 0$, so $3k = -15$ and $k = -5$.'
          - problem: 'A rectangular lawn has area $x^2 + kx - 30$ square metres and length $x + 6$ metres, where $x$ is in metres. Find $k$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The length divides the area exactly, so the area is $0$ at $x = -6$. That gives $36 - 6k - 30 = 0$, so $6k = 6$ and $k = 1$.'
          - problem: 'When $x^2 + kx + 5$ is divided by $x - 2$, the remainder is $3$. Find $k$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The remainder is the value at $x = 2$, which is $4 + 2k + 5$. Setting $9 + 2k = 3$ gives $2k = -6$, so $k = -3$.'
          - problem: 'The polynomial $x^2 - 3x + c$ has the factor $x + 4$. What is the value of $c$?'
            answer: '-28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factor $x + 4$ is $x - (-4)$, so the value at $-4$ must be $0$. That gives $16 + 12 + c = 0$, so $c = -28$.'
          - problem: 'A box has height $x - 2$ cm and volume $V(x) = x^3 - 4x^2 + cx + 6$ cubic cm. The height divides the volume exactly. Find $c$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The volume is $0$ at $x = 2$, which gives $8 - 16 + 2c + 6 = 0$. So $2c - 2 = 0$ and $c = 1$.'
          - problem: 'Find $k$ so that $x + 1$ is a factor of $x^3 + kx^2 - 2x + 5$.'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A factor $x + 1$ needs the value $0$ at $x = -1$. That gives $-1 + k + 2 + 5 = 0$, so $k + 6 = 0$ and $k = -6$.'
        constraints: "one unknown coefficient k or c in a quadratic or cubic; set p(c) = 0 (or p(c) = the given remainder) and solve a linear equation; integer answers"
    diagnostic_exemplar:
      problem: 'Find $k$ so that $x - 2$ is a factor of $x^3 + kx - 10$.'
      answer: "1"
      solution_sketch: 'Factor theorem: $p(2) = 8 + 2k - 10 = 0$, so $k = 1$.'
    anki_seeds:
      - front: "Remainder theorem: dividing p(x) by x - c leaves remainder..."
        back: "p(c)"
        type: basic
      - front: "Factor theorem: x - c is a factor of p(x) iff..."
        back: "p(c) = 0"
        type: basic

  - id: rational-root-theorem
    name: Rational Root Theorem
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: remainder-factor-theorems
        weight: 0.7
        key: true
      - id: quadratic-equations-factoring
        weight: 0.5
        key: true
      - id: polynomial-division
        weight: 0.5
      - id: divisibility-rules
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: List the possible rational roots
        key_prerequisites: [divisibility-rules]
        exemplars:
          - problem: 'List all possible rational roots of $x^3 - 3x + 2$.'
            answer: '-2, -1, 1, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leading coefficient is $1$, so every possible root is a factor of the constant term $2$. The factors of $2$ are $\pm 1$ and $\pm 2$.'
          - problem: 'List all possible rational roots of $2x^3 - x^2 + 2x - 1$.'
            answer: '-1, -1/2, 1/2, 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The constant term $-1$ has factors $\pm 1$ and the leading coefficient $2$ has factors $\pm 1, \pm 2$. The fractions are $\pm 1$ and $\pm \frac{1}{2}$.'
          - problem: 'The width $w$ of a planter, in metres, satisfies $2w^3 + 3w^2 - 8w + 3 = 0$. List all rational values of $w$ that the rational root theorem allows.'
            answer: '-3, -3/2, -1, -1/2, 1/2, 1, 3/2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The constant term $3$ has factors $\pm 1, \pm 3$ and the leading coefficient $2$ has factors $\pm 1, \pm 2$. The fractions are $\pm 1, \pm 3, \pm \frac{1}{2}, \pm \frac{3}{2}$.'
          - problem: 'Which of $\frac{1}{3}$, $3$, $-2$ and $\frac{2}{3}$ cannot be a rational root of $3x^3 - 4x^2 + 3x - 2$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The numerator of a root must divide $2$ and the denominator must divide $3$. The number $3$ has numerator $3$, which does not divide $2$, so $3$ cannot be a root.'
          - problem: 'List the possible rational roots of $2x^3 + x^2 - 3x + 5$.'
            answer: '-5, -5/2, -1, -1/2, 1/2, 1, 5/2, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factors of the constant term $5$ go on top and the factors of the leading coefficient $2$ go on the bottom. The list is $\pm 1, \pm 5, \pm \frac{1}{2}, \pm \frac{5}{2}$.'
          - problem: 'List all possible rational roots of $x^4 - 5x^2 + 4$.'
            answer: '-4, -2, -1, 1, 2, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leading coefficient is $1$, so every possible root is a factor of the constant term $4$. The factors of $4$ are $\pm 1, \pm 2, \pm 4$.'
          - problem: 'The thickness $s$ of a metal plate, in centimetres, satisfies $s^3 - 5s^2 + 2s + 8 = 0$. List all rational values of $s$ that the rational root theorem allows.'
            answer: '-8, -4, -2, -1, 1, 2, 4, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leading coefficient is $1$, so every possible value is a factor of the constant term $8$. The factors of $8$ are $\pm 1, \pm 2, \pm 4, \pm 8$.'
        constraints: "candidates ±(factor of constant)/(factor of leading coefficient); keep lists to at most 8 entries"
      - id: kp2
        name: Test candidates to find a root
        key_prerequisites: [remainder-factor-theorems]
        exemplars:
          - problem: 'Find the rational root of $x^3 - 2x^2 + 3x - 6$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The possible roots are the factors of $6$. The value at $1$ is $-4$, and the value at $2$ is $8 - 8 + 6 - 6 = 0$, so the root is $2$.'
          - problem: 'Find the rational root of $2x^3 - x^2 + 2x - 1$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The possible roots are $\pm 1$ and $\pm \frac{1}{2}$. The value at $1$ is $2$, but the value at $\frac{1}{2}$ is $\frac{1}{4} - \frac{1}{4} + 1 - 1 = 0$, so the root is $\frac{1}{2}$.'
          - problem: 'A box has length $x$ m, width $(x + 1)$ m and height $(x + 3)$ m, and its volume is $72$ cubic metres. Find $x$.'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The volume gives $x(x + 1)(x + 3) = 72$, which is $x^3 + 4x^2 + 3x - 72 = 0$. The possible roots are the factors of $72$, and the value at $3$ is $27 + 36 + 9 - 72 = 0$, so $x = 3$.'
          - problem: 'Find the rational root of $x^3 + 2x^2 + 3x + 2$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The possible roots are $\pm 1$ and $\pm 2$. The value at $1$ is $8$, and the value at $-1$ is $-1 + 2 - 3 + 2 = 0$, so the root is $-1$.'
          - problem: 'Find the rational root of $2x^3 + x^2 + 2x + 1$.'
            answer: '-1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The possible roots are $\pm 1$ and $\pm \frac{1}{2}$. The value at $-\frac{1}{2}$ is $-\frac{1}{4} + \frac{1}{4} - 1 + 1 = 0$, so the root is $-\frac{1}{2}$.'
          - problem: 'Find the rational root of $x^3 - 6x^2 + x - 6$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The possible roots are the factors of $6$. The values at $1$, $2$ and $3$ are not $0$, and the value at $6$ is $216 - 216 + 6 - 6 = 0$, so the root is $6$.'
          - problem: 'A company''s loss in thousands of dollars on $x$ hundred items is $L(x) = x^3 - 4x^2 + 3x - 12$. For how many hundred items does it break even, so that $L(x) = 0$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The possible values are the factors of $12$. The values at $1$, $2$ and $3$ are not $0$, and the value at $4$ is $64 - 64 + 12 - 12 = 0$, so the company breaks even at $4$ hundred items.'
        constraints: "cubics with integer coefficients and exactly one rational root among ±1, ±2, ±3, ±6, ±1/2, ... ; test by evaluating p at candidates"
      - id: kp3
        name: Factor completely after finding a root
        key_prerequisites: [polynomial-division, quadratic-equations-factoring]
        exemplars:
          - problem: 'Solve $x^3 - 2x^2 - 5x + 6 = 0$.'
            answer: '-2, 1, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value at $1$ is $0$, so $x - 1$ is a factor. Division leaves $x^2 - x - 6 = (x - 3)(x + 2)$, so the roots are $1$, $3$ and $-2$.'
          - problem: 'Solve $x^3 - 6x^2 + 11x - 6 = 0$.'
            answer: '1, 2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value at $1$ is $0$, so $x - 1$ is a factor. Division leaves $x^2 - 5x + 6 = (x - 2)(x - 3)$, so the roots are $1$, $2$ and $3$.'
          - problem: 'Solve $x^3 + 2x^2 - 5x - 6 = 0$.'
            answer: '-3, -1, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value at $-1$ is $-1 + 2 + 5 - 6 = 0$, so $x + 1$ is a factor. Division leaves $x^2 + x - 6 = (x + 3)(x - 2)$, so the roots are $-1$, $-3$ and $2$.'
          - problem: 'Factor $x^3 - 7x + 6$.'
            answer: '(x - 1)(x - 2)(x + 3)'
            answer_contract: {"kind": "required_form", "form": "factored_polynomial"}
            solution_sketch: 'The value at $1$ is $1 - 7 + 6 = 0$, so $x - 1$ is a factor. Division leaves $x^2 + x - 6 = (x - 2)(x + 3)$, which gives the full factorization.'
          - problem: 'The volume of a box in cubic metres is $V(x) = x^3 + 9x^2 + 26x + 24$, where $x$ is in metres. Write $V(x)$ as the product of the three side lengths.'
            answer: '(x + 2)(x + 3)(x + 4)'
            answer_contract: {"kind": "required_form", "form": "factored_polynomial"}
            solution_sketch: 'The value at $-2$ is $-8 + 36 - 52 + 24 = 0$, so $x + 2$ is a side. Division leaves $x^2 + 7x + 12 = (x + 3)(x + 4)$, so the sides are $x + 2$, $x + 3$ and $x + 4$.'
          - problem: 'The height of a track section is $h(x) = x^3 - 4x^2 - 11x + 30$ metres, where $x$ is the distance in tens of metres. For $0 \le x \le 6$, at which values of $x$ is the track at ground level?'
            answer: '2, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value at $2$ is $8 - 16 - 22 + 30 = 0$, so $x - 2$ is a factor. Division leaves $x^2 - 2x - 15 = (x - 5)(x + 3)$, so the zeros are $2$, $5$ and $-3$, and only $2$ and $5$ lie in the range.'
          - problem: 'The number $x = 2$ is a root of $x^3 - 3x^2 - 10x + 24 = 0$, and division gives $x^2 - x - 12 = (x - 4)(x + 3)$. What are all the solutions of the equation?'
            answer: '-3, 2, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A factor $x - 4$ gives the root $4$, not $-4$, and a factor $x + 3$ gives the root $-3$, not $3$. With the root $2$, the solutions are $-3$, $2$ and $4$.'
          - problem: 'Solve $2x^3 - 3x^2 - 11x + 6 = 0$.'
            answer: '-2, 1/2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value at $3$ is $54 - 27 - 33 + 6 = 0$, so $x - 3$ is a factor. Division leaves $2x^2 + 3x - 2 = (2x - 1)(x + 2)$, so the roots are $3$, $\frac{1}{2}$ and $-2$.'
        constraints: "monic cubics with three distinct integer roots, |root| <= 5, plus one with leading coefficient 2 and a rational root 1/2; divide out the found root, then factor the quadratic"
    diagnostic_exemplar:
      problem: 'Solve $x^3 - 4x^2 + x + 6 = 0$.'
      answer: "-1, 2, 3"
      answer_contract: {kind: list, ordered: false, member: {kind: exact}}
      solution_sketch: 'Candidates $\pm 1, \pm 2, \pm 3, \pm 6$; $p(-1) = -1 - 4 - 1 + 6 = 0$, and dividing by $x + 1$ leaves $x^2 - 5x + 6 = (x - 2)(x - 3)$.'
    anki_seeds:
      - front: "Rational root theorem: every rational root of a polynomial with integer coefficients has the form..."
        back: "±p/q where p divides the constant term and q divides the leading coefficient."
        type: basic

  - id: fundamental-theorem-algebra-multiplicity
    name: Fundamental Theorem of Algebra and Multiplicity
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: remainder-factor-theorems
        weight: 0.5
        key: true
      - id: polynomial-multiplication
        weight: 0.5
        key: true
      - id: quadratic-equations-factoring
        weight: 0.4
      - id: rational-root-theorem
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Count roots with multiplicity
        key_prerequisites: [remainder-factor-theorems]
        exemplars:
          - problem: 'The polynomial $p(x) = (x - 2)^3 (x + 1)^2$ is in factored form. What is the multiplicity of the root $x = 2$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The multiplicity of a root is the exponent of its factor. The factor $x - 2$ has exponent $3$, so the multiplicity is $3$.'
          - problem: 'Counting multiplicity, how many roots does a polynomial of degree $7$ have over the complex numbers?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fundamental theorem of algebra says a polynomial of degree $n$ has exactly $n$ complex roots when each root is counted with its multiplicity. So a polynomial of degree $7$ has $7$ roots.'
          - problem: 'A polynomial $p(x) = (x + 4)(x - 1)^2 (x - 3)^2$ is in factored form. What is the degree of $p$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The degree of a product of linear factors is the sum of the exponents. The exponents are $1$, $2$ and $2$, and $1 + 2 + 2 = 5$.'
          - problem: 'A polynomial of degree $7$ with real coefficients has the real roots $x = 1$ with multiplicity $3$ and $x = -2$ with multiplicity $2$, and no other real roots. How many of its roots are not real, counting multiplicity?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'All $7$ roots are complex when counted with multiplicity. The real roots use $3 + 2 = 5$ of them, so $7 - 5 = 2$ roots are not real.'
          - problem: 'The polynomial $p(x) = (2x - 6)^4 (x + 5)$ is in factored form. What is the multiplicity of the root $x = 3$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $2x - 6 = 2(x - 3)$, so the factor $(2x - 6)^4$ contains $(x - 3)^4$. The root $x = 3$ therefore has multiplicity $4$.'
          - problem: 'What is the degree of $p(x) = (x - 5)^2 (x + 1)^3 (x - 2)^4$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The polynomial has three different roots, but the degree adds the multiplicities. The sum is $2 + 3 + 4 = 9$, so the degree is $9$.'
          - problem: 'A polynomial of degree $8$ with real coefficients has the real roots $x = -1$ with multiplicity $3$ and $x = 3$ with multiplicity $1$, and no other real roots. How many of its roots are not real, counting multiplicity?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'All $8$ roots are complex when counted with multiplicity. The real roots use $3 + 1 = 4$ of them, so $8 - 4 = 4$ roots are not real.'
          - problem: 'What is the multiplicity of the root $x = -3$ of $p(x) = (x^2 - 9)(x + 3)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $x^2 - 9 = (x - 3)(x + 3)$, so $p(x) = (x - 3)(x + 3)^2$. The factor $x + 3$ has exponent $2$, so the multiplicity is $2$.'
        constraints: "factored polynomials of degree 3-5; degree and multiplicity from the exponents; non-real root counts from the degree"
      - id: kp2
        name: Crossing versus touching at a repeated root
        key_prerequisites: [quadratic-equations-factoring]
        try_first:
          problem: 'Does the graph of $y = (x - 1)^2$ cross the $x$-axis at $x = 1$, or does it only touch the axis there?'
          answer_contract: {"kind": "label", "options": [["cross", "crosses", "it crosses", "the graph crosses", "crosses the axis", "it crosses the axis", "the graph crosses the axis", "crosses the x-axis"], ["touch", "touches", "it touches", "only touches", "it only touches", "touches the axis", "it touches the axis", "the graph touches the axis"]]}
          answer: 'touch'
          reveal: 'The square $(x - 1)^2$ is never negative, so $y$ stays on one side of the axis and the graph only touches it at $x = 1$. A repeated factor with an even exponent does the same for every polynomial.'
        exemplars:
          - problem: 'For $p(x) = (x - 1)^2 (x + 3)$, at which zero does the graph touch the $x$-axis without crossing it?'
            answer: 'x = 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The zero $x = 1$ has multiplicity $2$, which is even, so the graph touches the axis there. The zero $x = -3$ has multiplicity $1$, so the graph crosses there.'
          - problem: 'The polynomial is $p(x) = (x + 1)^3 (x - 2)^2$. At which zero does the graph cross the $x$-axis?'
            answer: 'x = -1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The zero $x = -1$ has multiplicity $3$, which is odd, so the graph crosses the axis there. The zero $x = 2$ has multiplicity $2$, so the graph only touches the axis there.'
          - problem: 'The polynomial is $p(x) = x^2 (x - 3)^3 (x + 1)^4$. At which zeros does the graph touch the $x$-axis without crossing it?'
            answer: '0, -1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The multiplicities are $2$ at $x = 0$, $3$ at $x = 3$ and $4$ at $x = -1$. The even ones, at $0$ and $-1$, touch the axis, and the odd one at $3$ crosses it.'
          - problem: 'Does the graph of $p(x) = (x - 2)^2 (x + 5)^3$ cross the $x$-axis or only touch it at $x = -5$?'
            answer: 'cross'
            answer_contract: {"kind": "label", "options": [["cross", "crosses", "it crosses", "the graph crosses", "crosses the axis", "it crosses the axis", "the graph crosses the axis", "crosses the x-axis"], ["touch", "touches", "it touches", "only touches", "it only touches", "touches the axis", "it touches the axis", "the graph touches the axis"]]}
            solution_sketch: 'The factor $(x + 5)^3$ has the odd exponent $3$, so the zero $x = -5$ has odd multiplicity. A zero of odd multiplicity is a crossing, so the graph crosses the axis.'
          - problem: 'The height of a drone in metres, $t$ seconds after launch, is $h(t) = t(t - 3)^2$. At what time after launch does the drone touch the ground and rise again?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'The height is $0$ at $t = 0$ and $t = 3$. The factor $(t - 3)^2$ has even multiplicity, so the drone touches the ground at $t = 3$ and does not go below it.'
          - problem: 'A polynomial has a zero at $x = 5$ where its graph touches the $x$-axis without crossing. What is the smallest possible multiplicity of this zero?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A zero where the graph touches without crossing has even multiplicity. The smallest positive even number is $2$, so a double zero is the least possible.'
          - problem: 'The graph of $p(x) = (x + 2)^2 (x - 5)^3$ touches the $x$-axis at one zero and crosses it at the other. At which zero does the graph touch the axis?'
            answer: 'x = -2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factor $(x + 2)^2$ has the even exponent $2$, so the graph touches the axis at $x = -2$, while the odd exponent $3$ at $x = 5$ gives a crossing.'
          - problem: 'A shop''s profit in thousands of dollars in month $m$ is $P(m) = (m - 2)^2 (m - 8)$. In which month does the profit reach $0$ and turn back without changing sign?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The profit is $0$ at $m = 2$ and $m = 8$. The factor $(m - 2)^2$ has even multiplicity, so the sign does not change at $m = 2$, while at $m = 8$ it does.'
        constraints: "odd multiplicity crosses the x-axis; even multiplicity touches and turns"
      - id: kp3
        name: Build a polynomial from given roots
        key_prerequisites: [polynomial-multiplication]
        exemplars:
          - problem: 'Write a polynomial of degree $3$ with leading coefficient $1$, a double root at $x = 2$ and a root at $x = -5$. Expand it.'
            answer: 'x^3 + x^2 - 16x + 20'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The double root at $2$ gives $(x - 2)^2 = x^2 - 4x + 4$, and the root at $-5$ gives $(x + 5)$. Then $(x^2 - 4x + 4)(x + 5) = x^3 + x^2 - 16x + 20$.'
          - problem: 'Write a polynomial of degree $4$ with leading coefficient $1$ and the roots $0$, $3$ (double) and $-1$. Give it in factored form.'
            answer: 'x(x - 3)^2 (x + 1)'
            answer_contract: {"kind": "required_form", "form": "factored_polynomial"}
            solution_sketch: 'The root $0$ gives the factor $x$, the double root $3$ gives $(x - 3)^2$, and the root $-1$ gives $(x + 1)$. The product has degree $1 + 2 + 1 = 4$.'
          - problem: 'A box has side lengths $x$, $x - 2$ and $x - 5$ metres. Write its volume as an expanded polynomial in $x$.'
            answer: 'x^3 - 7x^2 + 10x'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The volume is the product $x(x - 2)(x - 5)$. First $(x - 2)(x - 5) = x^2 - 7x + 10$, and multiplying by $x$ gives $x^3 - 7x^2 + 10x$.'
          - problem: 'Write a polynomial of degree $3$ with leading coefficient $1$, a double root at $x = 3$ and a root at $x = -2$. Expand it.'
            answer: 'x^3 - 4x^2 - 3x + 18'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The double root $3$ gives $(x - 3)^2 = x^2 - 6x + 9$, and the root $-2$ gives $(x + 2)$. Then $(x^2 - 6x + 9)(x + 2) = x^3 - 4x^2 - 3x + 18$.'
          - problem: 'The height of a track section, in metres, is a polynomial $h(x)$ of degree $3$ with leading coefficient $1$. The track touches ground level at $x = 2$ without crossing it, and crosses ground level at $x = -1$. Write $h(x)$ in factored form.'
            answer: '(x - 2)^2 (x + 1)'
            answer_contract: {"kind": "required_form", "form": "factored_polynomial"}
            solution_sketch: 'A graph that touches the axis without crossing it has an even multiplicity, so the root $2$ is a double root. The root $-1$ is a crossing, so it is a simple root. That gives $(x - 2)^2 (x + 1)$.'
          - problem: 'A polynomial of degree $3$ has the roots $1$, $2$ and $-3$ and passes through the point $(0, 12)$. Write it in factored form.'
            answer: '2(x - 1)(x - 2)(x + 3)'
            answer_contract: {"kind": "required_form", "form": "factored_polynomial"}
            solution_sketch: 'The roots give $a(x - 1)(x - 2)(x + 3)$ with a constant $a$. At $x = 0$ the value is $a \cdot (-1)(-2)(3) = 6a$, and $6a = 12$ gives $a = 2$.'
          - problem: 'A polynomial has leading coefficient $1$, a double root at $x = 4$ and a root at $x = -1$. What is the polynomial in factored form?'
            answer: '(x - 4)^2 (x + 1)'
            answer_contract: {"kind": "required_form", "form": "factored_polynomial"}
            solution_sketch: 'A root $4$ gives the factor $x - 4$, not $x + 4$, and a root $-1$ gives $x + 1$, not $x - 1$. The polynomial is $(x - 4)^2 (x + 1)$.'
          - problem: 'Write a polynomial of degree $4$ with leading coefficient $1$ and the roots $1$, $-1$, $2$ and $-2$. Expand it.'
            answer: 'x^4 - 5x^2 + 4'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The roots give $(x - 1)(x + 1) = x^2 - 1$ and $(x - 2)(x + 2) = x^2 - 4$. Then $(x^2 - 1)(x^2 - 4) = x^4 - 5x^2 + 4$.'
        constraints: "degree 3-4, leading coefficient 1 (one item with a constant factor fixed by a point), integer roots with at most one double root; expand only when the problem says to"
    diagnostic_exemplar:
      problem: 'Write the degree-$3$ polynomial with leading coefficient $1$ having a double root at $x = 1$ and a root at $x = -3$, expand it, and state at which zero its graph touches the $x$-axis without crossing.'
      answer: 'x^3 + x^2 - 5x + 3; the graph touches without crossing at x = 1 (even multiplicity)'
      answer_contract: {kind: none}
      solution_sketch: '$(x-1)^2(x+3) = (x^2 - 2x + 1)(x + 3) = x^3 + x^2 - 5x + 3$; the double root at $x = 1$ has even multiplicity, so the graph touches and turns there, while it crosses at $x = -3$.'
    anki_seeds:
      - front: "Fundamental theorem of algebra: a degree-n polynomial has how many complex roots (with multiplicity)?"
        back: "Exactly n."
        type: basic
      - front: "At a zero of even multiplicity the graph ... the x-axis; at odd multiplicity it ..."
        back: "touches (and turns around); crosses"
        type: basic

  - id: polynomial-end-behavior-graphing
    name: End Behavior and Graphing Polynomials
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: fundamental-theorem-algebra-multiplicity
        weight: 0.6
        key: true
      - id: quadratic-graphs-vertex
        weight: 0.4
        key: true
      - id: function-transformations-shifts
        weight: 0.3
      - id: polynomial-multiplication
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: End behavior from the leading term
        key_prerequisites: [quadratic-graphs-vertex]
        exemplars:
          - problem: 'Far from the origin, the graph of $p(x) = -2x^3 + x - 7$ does one of four things: it rises on both sides, it falls on both sides, it rises on the left and falls on the right, or it falls on the left and rises on the right. Which one?'
            answer: 'left up, right down'
            answer_contract: {"kind": "label", "options": [["left up, right down", "up on the left and down on the right", "rises on the left and falls on the right", "it rises on the left and falls on the right", "up left, down right", "rises left, falls right", "up on the left, down on the right", "the left end rises and the right end falls"], ["left down, right up", "down on the left and up on the right", "falls on the left and rises on the right", "it falls on the left and rises on the right", "down left, up right", "falls left, rises right", "down on the left, up on the right", "the left end falls and the right end rises"], ["both up", "up on both sides", "rises on both sides", "both ends up", "it rises on both sides", "both ends rise", "up on both ends", "both ends go up"], ["both down", "down on both sides", "falls on both sides", "both ends down", "it falls on both sides", "both ends fall", "down on both ends", "both ends go down"]]}
            solution_sketch: 'The leading term is $-2x^3$, which has odd degree, so the two ends point in opposite directions. The coefficient $-2$ is negative, so the left end rises and the right end falls.'
          - problem: 'Without expanding, find the leading term of $r(x) = (x^3 + 1)(x - 1)(2x + 5)$.'
            answer: '2x^5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leading term of a product is the product of the leading terms. That is $x^3 \cdot x \cdot 2x = 2x^5$.'
          - problem: 'The cost in dollars of making $x$ chairs is $C(x) = 0.01x^3 - 2x^2 + 100x + 500$. When $x$ is very large, which term of $C(x)$ decides the size of the cost?'
            answer: '0.01x^3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For very large $x$ the term with the highest power grows fastest. That term is $0.01x^3$, so it decides the size of the cost.'
          - problem: 'Which of $f(x) = x^4 - 3x$, $g(x) = -x^3 + 2$ and $h(x) = 2x^5 - x$ falls on the left and rises on the right?'
            answer: 'h'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A graph that falls on the left and rises on the right needs odd degree and a positive leading coefficient. Only $h$ has odd degree $5$ with the positive coefficient $2$.'
          - problem: 'A company''s profit in thousands of dollars after $t$ years is modelled by $P(t) = -0.5t^4 + 8t^3 + 20$. According to the model, does the profit in the long run rise without bound or fall without bound?'
            answer: 'falls'
            answer_contract: {"kind": "label", "options": [["falls", "falls without bound", "it falls", "goes down", "decreases", "the profit falls", "it falls without bound", "it decreases"], ["rises", "rises without bound", "it rises", "goes up", "increases", "the profit rises", "it rises without bound", "it increases"]]}
            solution_sketch: 'For large $t$ the leading term $-0.5t^4$ decides the sign. It is negative, so the profit falls without bound, even though the model starts with $20$ thousand dollars.'
          - problem: 'A polynomial of degree $6$ has a graph that falls on both ends. Which of $-3$, $0$ and $2$ could be its leading coefficient?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With even degree $6$ the graph falls on both ends only when the leading coefficient is negative. The number $0$ cannot be a leading coefficient, so the answer is $-3$.'
          - problem: 'What is the leading coefficient of $p(x) = 4 + 3x - 5x^2$?'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leading term is the term of highest degree, not the first term written. The highest power is $x^2$, so the leading coefficient is $-5$.'
          - problem: 'Which of $f(x) = -x^4 + 5x$, $g(x) = x^3 - x$ and $k(x) = -3x^3 + 1$ rises on the left and falls on the right?'
            answer: 'k'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A graph that rises on the left and falls on the right needs odd degree and a negative leading coefficient. Only $k$ has odd degree $3$ with the negative coefficient $-3$.'
        constraints: "classify by degree parity and leading-coefficient sign; leading term of a product"
      - id: kp2
        name: Sign of the polynomial between zeros
        key_prerequisites: [fundamental-theorem-algebra-multiplicity]
        exemplars:
          - problem: 'Is $p(x) = x(x - 3)(x + 1)$ positive or negative on the interval $(0, 3)$?'
            answer: 'negative'
            answer_contract: {"kind": "label", "options": [["positive", "it is positive", "p is positive", "above the axis", "it is above the axis", "p(x) is positive", "positive on the interval", "p is positive on the interval"], ["negative", "it is negative", "p is negative", "below the axis", "it is below the axis", "p(x) is negative", "negative on the interval", "p is negative on the interval"]]}
            solution_sketch: 'The zeros are $-1$, $0$ and $3$, so there is no zero inside $(0, 3)$. At the test point $x = 1$ the value is $(1)(-2)(2) = -4$, which is below zero, so $p$ is negative.'
          - problem: 'Is $p(x) = (x - 2)^2 (x + 1)$ positive or negative on the interval $(-1, 2)$?'
            answer: 'positive'
            answer_contract: {"kind": "label", "options": [["positive", "it is positive", "p is positive", "above the axis", "it is above the axis", "p(x) is positive", "positive on the interval", "p is positive on the interval"], ["negative", "it is negative", "p is negative", "below the axis", "it is below the axis", "p(x) is negative", "negative on the interval", "p is negative on the interval"]]}
            solution_sketch: 'The zeros are $-1$ and $2$, so there is no zero inside $(-1, 2)$. At the test point $x = 0$ the value is $(-2)^2(1) = 4$, which is above zero, so $p$ is positive.'
          - problem: 'For $p(x) = x(x - 2)(x + 4)$, find every interval on which $p(x) > 0$.'
            answer: '-4 < x < 0 or x > 2'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The zeros $-4$, $0$ and $2$ split the line into four intervals. The test points $x = -1$ and $x = 3$ give $9$ and $21$, which are positive, and $x = -5$ and $x = 1$ give $-35$ and $-5$, which are negative.'
          - problem: 'A company''s profit in thousands of dollars in month $m$ is $P(m) = (m - 2)(m - 6)(m - 9)$ for $m > 0$. In which months does the company make a loss?'
            answer: '0 < m < 2 or 6 < m < 9'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The zeros $2$, $6$ and $9$ split $m > 0$ into four intervals. A test point in each gives a sign: negative on $(0, 2)$, positive on $(2, 6)$, negative on $(6, 9)$ and positive after $9$.'
          - problem: 'For $p(x) = (x + 1)(x - 3)^2$, find every interval on which $p(x) < 0$.'
            answer: 'x < -1'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The factor $(x - 3)^2$ is never negative, so the sign of $p$ is the sign of $x + 1$ except at $x = 3$ where $p$ is $0$. That sign is negative exactly for $x < -1$.'
          - problem: 'A section of a roller-coaster track has height $h(x) = (x + 1)(x - 2)(x - 4)$ metres above ground level. For which values of $x$ is the track below ground level?'
            answer: 'x < -1 or 2 < x < 4'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The zeros $-1$, $2$ and $4$ split the line into four intervals. The value at $x = -2$ is $-24$ and the value at $x = 3$ is $-4$, both below zero, while at $x = 0$ it is $8$ and at $x = 5$ it is $18$.'
          - problem: 'Solve $(x + 3)(x - 1)(x - 5) > 0$.'
            answer: '-3 < x < 1 or x > 5'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The zeros are $-3$, $1$ and $5$. The product is positive on $(-3, 1)$, where the test point $0$ gives $15$, and also for $x > 5$, where the test point $6$ gives $45$.'
          - problem: 'For $p(x) = (x + 2)(x - 1)(x - 4)$, find every interval on which $p(x) < 0$.'
            answer: 'x < -2 or 1 < x < 4'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The zeros $-2$, $1$ and $4$ split the line into four intervals. The test points $x = -3$ and $x = 2$ give $-28$ and $-8$, which are negative, and $x = 0$ and $x = 5$ give $8$ and $28$, which are positive.'
        constraints: "factored cubics with integer zeros, at most one repeated factor; sign on one interval from one test point, or every interval of a sign chart"
      - id: kp3
        name: Key graph features
        key_prerequisites: [fundamental-theorem-algebra-multiplicity]
        exemplars:
          - problem: 'Find the $y$-intercept of the graph of $p(x) = (x - 1)^2 (x + 2)$.'
            answer: '(0, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The graph meets the $y$-axis where $x = 0$. The value there is $(-1)^2 (2) = 2$, so the $y$-intercept is $(0, 2)$.'
          - problem: 'What is the greatest number of turning points that a polynomial of degree $5$ can have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A polynomial of degree $n$ has at most $n - 1$ turning points. For degree $5$ that is $5 - 1 = 4$.'
          - problem: 'Find the $y$-intercept of the graph of $p(x) = (x + 2)^2 (x - 3)$.'
            answer: '(0, -12)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The graph meets the $y$-axis where $x = 0$. The value there is $(2)^2 (-3) = -12$, so the $y$-intercept is $(0, -12)$.'
          - problem: 'What is the greatest number of turning points of the graph of $p(x) = (x + 5)(x - 11)(x - 17)(x - 24)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The four linear factors give degree $1 + 1 + 1 + 1 = 4$. A polynomial of degree $4$ has at most $4 - 1 = 3$ turning points.'
          - problem: 'Find the $y$-intercept of the graph of $p(x) = -2(x + 1)(x - 4)^2$.'
            answer: '(0, -32)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The graph meets the $y$-axis where $x = 0$. The value there is $-2(1)(16) = -32$, so the $y$-intercept is $(0, -32)$.'
          - problem: 'A section of a roller-coaster track has height $h(x) = (x + 1)(x - 2)(x - 5)$ metres, where $x$ is the distance in tens of metres from the start. How high is the track at the start?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The start is where $x = 0$. The height there is $(1)(-2)(-5) = 10$, so the track is $10$ m high at the start.'
          - problem: 'A tank holds $V(t) = (t + 2)(t - 3)^2$ litres of water $t$ hours after its valve is opened. How much water is in the tank at the moment the valve is opened?'
            answer: '18'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The moment the valve is opened is $t = 0$. The volume there is $(2)(-3)^2 = 2 \cdot 9 = 18$, so the tank holds $18$ litres.'
          - problem: 'A designer wants the graph of a polynomial to have $4$ turning points. What is the lowest degree the polynomial can have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A polynomial of degree $n$ has at most $n - 1$ turning points. Four turning points need $n - 1 \ge 4$, so $n \ge 5$ and the lowest degree is $5$.'
          - problem: 'What is the greatest number of turning points of a polynomial of degree $4$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The greatest number of turning points is one less than the degree. For degree $4$ it is $4 - 1 = 3$.'
          - problem: 'Find the $y$-intercept of the graph of $p(x) = (x - 2)^2 (x + 9)(x - 16)(x - 25)$.'
            answer: '(0, 14400)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The graph meets the $y$-axis where $x = 0$. The value there is $(-2)^2 (9)(-16)(-25) = 4 \cdot 9 \cdot 400 = 14400$, so the $y$-intercept is $(0, 14400)$.'
        constraints: "y-intercepts of factored polynomials (evaluate at 0); turning-point counts from the degree (at most n - 1)"
    diagnostic_exemplar:
      problem: 'For $p(x) = x(x + 3)(x - 1)$, describe the end behavior, and state whether $p$ is positive or negative on the interval $(-3, 0)$.'
      answer: 'as x → -∞, p(x) → -∞; as x → +∞, p(x) → +∞; p is positive on (-3, 0)'
      answer_contract: {kind: none}
      solution_sketch: 'Expanded, the leading term is $x^3$ (odd degree, positive coefficient), so the ends go down-left and up-right; testing $x = -1$ gives $(-1)(2)(-2) = 4 > 0$.'
    anki_seeds:
      - front: "End behavior of a polynomial is decided entirely by..."
        back: "The leading term (its degree parity and the sign of its coefficient)."
        type: basic

