      # kp3's exemplars demand answers "in interval notation" ([-3, 3],
      # (-∞, 0) ∪ (2, ∞)) — taught in foundations:interval-notation (re-audit R-01).
      - id: interval-notation
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Quadratic inequalities
        key_prerequisites: [quadratic-equations-factoring, linear-inequalities]
        constraints: "factorable quadratics with integer roots; leading coefficient 1 or -1; areas, heights and profits read from a context"
        exemplars:
          - problem: 'Solve $x^2-4>0$.'
            answer: "x < -2 or x > 2"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The zeros of $x^2-4=(x-2)(x+2)$ are $-2$ and $2$. The parabola opens upward, so the expression is positive outside the roots, which gives $x<-2$ or $x>2$.'
          - problem: 'Solve $x^2-5x+6\le0$.'
            answer: "2 <= x <= 3"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The expression $x^2-5x+6=(x-2)(x-3)$ has zeros $2$ and $3$. The parabola opens upward, so it is at most zero between them, and the zeros count because of $\le$. The solution is $2\le x\le3$.'
          - problem: 'A ball is thrown upward so that its height in metres after $t$ seconds is $h(t)=-5t^2+20t$. During which times is the ball more than $15$ m above the ground?'
            answer: "1 < t < 3"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The ball is above $15$ m when $-5t^2+20t-15>0$. Dividing by $-5$ flips the sign to $t^2-4t+3<0$, which is $(t-1)(t-3)<0$ and holds between the zeros, so $1<t<3$.'
          - problem: 'Solve $x^2+2x-8>0$.'
            answer: "x < -4 or x > 2"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Factoring gives $(x+4)(x-2)>0$ with zeros $-4$ and $2$. The parabola opens upward, so the product is positive outside the zeros, and the strict sign excludes them. The solution is $x<-4$ or $x>2$.'
          - problem: 'A rectangular plot is $x$ metres wide and $(x+4)$ metres long. Its area must be at most $21$ square metres. What widths $x$ are possible?'
            answer: "0 < x <= 3"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The area condition is $x(x+4)\le21$, which becomes $x^2+4x-21\le0$ and factors as $(x+7)(x-3)\le0$. This gives $-7\le x\le3$, but a width must be positive, so $0<x\le3$.'
          - problem: 'Solve $x^2-9>0$.'
            answer: "x < -3 or x > 3"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The zeros are $-3$ and $3$. The parabola opens upward, so $x^2-9$ is positive outside the zeros, not between them. The correct solution is $x<-3$ or $x>3$.'
          - problem: 'Solve $x^2-x-12\ge0$.'
            answer: "x <= -3 or x >= 4"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Factoring gives $(x-4)(x+3)\ge0$ with zeros $-3$ and $4$. The parabola opens upward, so the product is positive outside the zeros, and both zeros count because of $\ge$. The solution is $x\le-3$ or $x\ge4$.'
          - problem: 'A stall makes a profit of $P(n)=-n^2+14n-24$ dollars when it sells $n$ cakes. For which numbers of cakes $n$ is the profit positive?'
            answer: "2 < n < 12"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The profit is positive when $-n^2+14n-24>0$, that is $n^2-14n+24<0$. This factors as $(n-2)(n-12)<0$, which holds between the zeros, so $2<n<12$.'
          - problem: 'Solve $-x^2+2x+8\ge0$.'
            answer: "-2 <= x <= 4"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Multiplying by $-1$ flips the sign: $x^2-2x-8\le0$, which is $(x-4)(x+2)\le0$. This holds between the zeros and includes them, so $-2\le x\le4$.'
          - problem: 'Solve $x^2-6x+5<0$.'
            answer: "1 < x < 5"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Factoring gives $(x-1)(x-5)<0$ with zeros $1$ and $5$. The product is negative between the zeros, and the strict sign excludes them. The solution is $1<x<5$.'
      - id: kp2
        name: Sign charts for factored cubics
        key_prerequisites: [polynomial-end-behavior-graphing]
        constraints: "factored cubics with integer zeros, |zero| <= 4, at most one squared factor; solutions as inequality chains; production and temperature contexts on a stated domain"
        try_first:
          problem: 'Is $x=2$ a solution of $(x+1)(x-2)^2>0$?'
          answer_contract: {"kind":"label","options":[["no","no, it is not","it is not","not a solution","it is not a solution"],["yes","yes, it is","it is","is a solution","it is a solution"]]}
          answer: 'no'
          reveal: 'At $x=2$ the product is $3\cdot0=0$, and $0$ is not greater than $0$. A squared factor is never negative, so away from its zero it leaves the sign of the other factors unchanged.'
        exemplars:
          - problem: 'Solve $x(x-3)(x+2)<0$.'
            answer: "x < -2 or 0 < x < 3"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The zeros are $-2$, $0$ and $3$. The leading coefficient is positive, so the signs on the four intervals from the left are negative, positive, negative, positive. The product is negative for $x<-2$ and for $0<x<3$.'
          - problem: 'Solve $(x-1)^2(x+4)\ge0$.'
            answer: "x >= -4"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The squared factor is never negative and is zero at $x=1$, which is allowed by $\ge$. The sign of the product is the sign of $x+4$ elsewhere, so the solution is $x\ge-4$.'
          - problem: 'A company''s profit, in thousands of dollars, is $P(x)=(x-1)(x-3)(x-5)$ when it produces $x$ hundred units, for $0\le x\le6$. For which production levels is the profit positive?'
            answer: "1 < x < 3 or 5 < x <= 6"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The zeros are $1$, $3$ and $5$, and the product is negative for $x<1$, positive on $1<x<3$, negative on $3<x<5$ and positive for $x>5$. With the limit $x\le6$, the profit is positive for $1<x<3$ or $5<x\le6$.'
          - problem: 'Solve $x(x+1)(x-4)>0$.'
            answer: "-1 < x < 0 or x > 4"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The zeros are $-1$, $0$ and $4$. The product is negative, positive, negative, positive on the four intervals, so the strict inequality keeps $-1<x<0$ and $x>4$.'
          - problem: 'Solve $(x-3)^2(x+1)<0$.'
            answer: "x < -1"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The squared factor is positive except at $x=3$, where the product is $0$ and so fails the strict inequality. Elsewhere the sign is the sign of $x+1$, which is negative for $x<-1$.'
          - problem: 'Solve $(x-2)^2(x+3)>0$.'
            answer: "-3 < x < 2 or x > 2"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'At $x=2$ the squared factor is zero, so the product is $0$ and not greater than $0$. Everywhere else the sign is the sign of $x+3$, so the solution is $-3<x<2$ or $x>2$.'
          - problem: 'Solve $x(x-4)(x+2)\le0$.'
            answer: "x <= -2 or 0 <= x <= 4"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The zeros are $-2$, $0$ and $4$. The product is negative for $x<-2$ and for $0<x<4$, and the zeros count because of $\le$. The solution is $x\le-2$ or $0\le x\le4$.'
          - problem: 'The temperature in a chamber, in degrees Celsius, is $T(t)=(t+1)(t-2)(t-4)$ for $0\le t\le5$ hours after the start. When is the temperature at or below freezing, that is $T(t)\le0$?'
            answer: "2 <= t <= 4"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The zeros are $-1$, $2$ and $4$. The product is negative on $2<t<4$ and zero at both ends, while $t=-1$ lies outside the allowed times. So $T(t)\le0$ for $2\le t\le4$.'
          - problem: 'Solve $-(x+3)(x-1)(x-4)>0$.'
            answer: "x < -3 or 1 < x < 4"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The zeros are $-3$, $1$ and $4$. The leading coefficient is negative, so the signs from the left are positive, negative, positive, negative. For example $x=0$ gives $-12$ and $x=2$ gives $10$, so the product is positive for $x<-3$ and $1<x<4$.'
      - id: kp3
        name: Strict versus inclusive boundaries
        key_prerequisites: [compound-inequalities]
        constraints: "factorable quadratics; mix strict and inclusive cases; interval notation with unions written with ∪ in several items, contexts with a stated unknown"
        exemplars:
          - problem: 'Solve $x^2\le9$ and write the solution in interval notation.'
            answer: "[-3, 3]"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The inequality means $x^2-9\le0$, which is $(x-3)(x+3)\le0$ with zeros $-3$ and $3$. The product is at most zero between the zeros, and both zeros count because of $\le$. The solution is $[-3,3]$.'
          - problem: 'Solve $x^2-2x>0$ and write the solution in interval notation.'
            answer: "(-∞, 0) ∪ (2, ∞)"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Factoring gives $x(x-2)>0$ with zeros $0$ and $2$. The product is positive outside the zeros, and the strict sign excludes both. The solution is $(-\infty,0)\cup(2,\infty)$.'
          - problem: 'A rectangle has perimeter $20$ m. One side is $x$ m, so the other side is $(10-x)$ m. For which values of $x$ is its area at least $21$ square metres?'
            answer: "[3, 7]"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The area condition is $x(10-x)\ge21$, which becomes $x^2-10x+21\le0$ and factors as $(x-3)(x-7)\le0$. The product is at most zero between the zeros, and both count, so $3\le x\le7$.'
          - problem: 'Solve $x^2-9x+20>0$.'
            answer: "x < 4 or x > 5"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Factoring gives $(x-4)(x-5)>0$ with zeros $4$ and $5$. The product is positive outside the zeros, and the strict sign excludes them. The solution is $x<4$ or $x>5$.'
          - problem: 'Solve $-x^2+4x+5\ge0$ and write the solution in interval notation.'
            answer: "[-1, 5]"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Multiplying by $-1$ flips the sign: $x^2-4x-5\le0$, which is $(x-5)(x+1)\le0$. The product is at most zero between the zeros and includes them, so the solution is $[-1,5]$.'
          - problem: 'Find all $x$ with $x^2-2x-8\le0$ and $x>0$.'
            answer: "(0, 4]"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The first inequality is $(x-4)(x+2)\le0$, which holds for $-2\le x\le4$. Joining it with $x>0$ keeps the strict end at $0$ and the included end at $4$, so the answer is $(0,4]$.'
          - problem: 'Solve $x^2-6x+9>0$.'
            answer: "x < 3 or x > 3"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The left side is $(x-3)^2$, which is positive for every $x$ except its zero at $x=3$. The strict sign excludes $3$, so the solution is $x<3$ or $x>3$.'
          - problem: 'Solve $x^2-4x\le0$.'
            answer: "[0, 4]"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Factoring gives $x(x-4)\le0$, which holds between the zeros $0$ and $4$. The sign $\le$ includes both zeros, so the solution has square brackets: $[0,4]$.'
          - problem: 'A model rocket''s height in metres $t$ seconds after launch is $h(t)=-5t^2+30t$. During which times is the rocket at least $40$ m high?'
            answer: "[2, 4]"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition is $-5t^2+30t\ge40$, which becomes $t^2-6t+8\le0$ after dividing by $-5$. This is $(t-2)(t-4)\le0$, so the rocket is at least $40$ m high for $2\le t\le4$, that is $[2,4]$.'
          - problem: 'Solve $x^2\ge4x$.'
            answer: "(-∞, 0] ∪ [4, ∞)"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Moving $4x$ across gives $x^2-4x\ge0$, which is $x(x-4)\ge0$ with zeros $0$ and $4$. The product is positive outside the zeros and zero at them, so the solution is $(-\infty,0]\cup[4,\infty)$.'
    diagnostic_exemplar:
      problem: 'Solve $x(x - 2)(x + 3) \ge 0$.'
      answer: "[-3, 0] ∪ [2, ∞)"
      answer_contract: {kind: inequality_union}
      solution_sketch: 'Zeros $-3, 0, 2$; sign chart gives $+$ on $(-3, 0)$ and $(2, \infty)$; $\ge$ includes all three zeros.'
    anki_seeds:
      - front: "To solve a polynomial inequality, find the zeros, then..."
        back: "Test the sign on each interval between consecutive zeros (sign chart)."
        type: basic
