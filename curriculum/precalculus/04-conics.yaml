unit: conics
course: precalculus
module: "Conic Sections"
topics:
  - id: parabola-focus-directrix
    name: Parabolas with Focus and Directrix
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: quadratic-graphs-vertex
        weight: 0.6
        key: true
      - id: distance-midpoint-formulas
        weight: 0.5
        key: true
      - id: completing-the-square
        weight: 0.4
      - id: function-transformations-shifts
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Read p from x² = 4py and y² = 4px
        key_prerequisites: [quadratic-graphs-vertex]
        constraints: "vertex at the origin; 4p a small even integer"
        exemplars:
          - problem: "The parabola is x^2 = 8y. Give its focus as (x, y) and the y-coordinate of its directrix."
            answer: "focus = (0, 2); directrix = -2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "focus"}, {"contract": {"kind": "exact"}, "name": "directrix"}]}
            solution_sketch: "For x^2 = 8y, the full result is focus = (0, 2); directrix = -2. The standard form rule is x^2 = 4py, and comparing coefficients gives p = 2. The focus rule gives (0, 2), and the directrix rule gives y = -2. Thus focus = (0, 2); directrix = -2."
          - problem: "The parabola is y^2 = 12x. Give its focus as (x, y) and the x-coordinate of its directrix."
            answer: "focus = (3, 0); directrix = -3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "focus"}, {"contract": {"kind": "exact"}, "name": "directrix"}]}
            solution_sketch: "For y^2 = 12x, the full result is focus = (3, 0); directrix = -3. The standard form rule is y^2 = 4px, and comparing coefficients gives p = 3. The focus rule gives (3, 0), and the directrix rule gives x = -3. Thus focus = (3, 0); directrix = -3."
          - problem: "The parabola is x^2 = 4y. Find p."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For x^2 = 4y, the standard form rule is x^2 = 4py. Compare 4p with 4 to get p = 1. The value of p is 1."
          - problem: "The parabola is y^2 = 16x. Give its focus as (x, y)."
            answer: "(4, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "For y^2 = 16x, the standard form rule is y^2 = 4px. Compare 4p with 16 to get p = 4. The focus rule for a right-opening parabola gives (p, 0) = (4, 0). The focus is (4, 0)."
          - problem: "The parabola is x^2 = -4y. Find the y-coordinate of its focus."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For x^2 = -4y, the standard form rule is x^2 = 4py. Compare 4p with -4 to get p = -1. The focus rule for a vertical parabola gives (0, p) = (0, -1). The y-coordinate is -1."
          - problem: "The parabola is y^2 = -8x. Determine p."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For y^2 = -8x, the standard form rule is y^2 = 4px. Compare 4p with -8 to get p = -2. The value of p is -2."
      - id: kp2
        name: Write the equation from focus or directrix
        key_prerequisites: [distance-midpoint-formulas]
        constraints: "vertex at the origin; focus on an axis with integer p, |p| <= 4; answers in x^2 = 4py or y^2 = 4px form"
        exemplars:
          - problem: 'Write the equation of the parabola with focus $(0, 3)$ and directrix $y = -3$.'
            answer: "x^2 = 12y"
            answer_contract: {kind: polynomial_relation}
            solution_sketch: 'Vertex at the origin, $p = 3$, opens upward: $x^2 = 4py$.'
          - problem: 'Write the equation of the parabola with vertex at the origin and focus $(-2, 0)$.'
            answer: "y^2 = -8x"
            answer_contract: {kind: polynomial_relation}
          - problem: "A parabola has its vertex at the origin, and its focus is the point (0, 4). The equation of the parabola can be written in the form x^2 = ay for some constant a. Find a."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, focus rule: the focus (0, 4) sits on the positive y-axis, so p = 4 and the parabola opens upward. Step 2, standard form: the full equation is x^2 = 4py = 16y. Comparing x^2 = 16y with x^2 = ay gives a = 16."
          - problem: "A parabola has its vertex at the origin, and its directrix is the vertical line x = 4. The equation of the parabola can be written in the form y^2 = bx for some constant b. Find b."
            answer: "-16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, directrix rule: the directrix x = 4 is on the positive x side of the vertex, so p = -4 and the parabola opens to the left. Step 2, standard form: the full equation is y^2 = 4px = -16x. Comparing y^2 = -16x with y^2 = bx gives b = -16."
          - problem: "A parabola has its vertex at the origin, and its directrix is the horizontal line y = 1. Its equation can be written in the form x^2 = cy, and its focus is the point (0, f). Give the value of c and the value of f."
            answer: "c = -4; f = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c"}, {"contract": {"kind": "exact"}, "name": "f"}]}
            solution_sketch: "Step 1, directrix rule: the directrix y = 1 is on the positive y side of the vertex, so p = -1 and the parabola opens downward. Step 2, standard form: the full equation is x^2 = 4py = -4y, so c = -4. Step 3, focus rule: the focus sits p units from the vertex on the opening side, at (0, -1), so f = -1. The answer is c = -4; f = -1."
          - problem: "A parabola has its vertex at the origin, and its focus is the point (1, 0). Its equation can be written in the form y^2 = dx, and its directrix is the line x = k. Give the value of d and the value of k."
            answer: "d = 4; k = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "d"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: "Step 1, focus rule: the focus (1, 0) sits on the positive x-axis, so p = 1 and the parabola opens to the right. Step 2, standard form: the full equation is y^2 = 4px = 4x, so d = 4. Step 3, directrix rule: the directrix sits p units from the vertex on the opposite side, the line x = -1, so k = -1. The answer is d = 4; k = -1."
      - id: kp3
        name: Shifted vertex
        key_prerequisites: [quadratic-graphs-vertex, completing-the-square]
        constraints: "equations given in shifted standard form (x - h)^2 = 4p(y - k) or (y - k)^2 = 4p(x - h); integer h, k, p; report vertex, focus, and directrix"
        exemplars:
          - problem: "The parabola has equation (x - 1)^2 = 4(y + 2). Find the vertex, the focus, and the value c in the directrix y = c, and give the vertex and focus as (x, y)."
            answer: "vertex = (1, -2); focus = (1, -1); directrix = -3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "vertex"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "focus"}, {"contract": {"kind": "exact"}, "name": "directrix"}]}
            solution_sketch: "Write the shifted standard form (x - 1)^2 = 4(y + 2) and compare with (x - h)^2 = 4p(y - k): h = 1, k = -2, and p = 1. The vertex is (h, k) = (1, -2). The focus is (h, k + p) = (1, -1) because the parabola opens up. The directrix is y = k - p = -3. The answer is vertex = (1, -2); focus = (1, -1); directrix = -3."
          - problem: 'Find the vertex and focus of $(y - 3)^2 = 8(x - 1)$.'
            answer: "vertex = (1, 3); focus = (3, 3)"
            answer_contract: {kind: multipart, parts: [{name: vertex, contract: {kind: coordinates, arity: 2}}, {name: focus, contract: {kind: coordinates, arity: 2}}]}
            solution_sketch: '$p = 2$, opening right.'
          - problem: "The parabola has equation (x - 3)^2 = 12(y + 1). Find the vertex, the focus, and the value c in the directrix y = c, and give the vertex and focus as (x, y)."
            answer: "vertex = (3, -1); focus = (3, 2); directrix = -4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "vertex"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "focus"}, {"contract": {"kind": "exact"}, "name": "directrix"}]}
            solution_sketch: "Compare (x - 3)^2 = 12(y + 1) with (x - h)^2 = 4p(y - k): h = 3, k = -1, and p = 3. The vertex is (h, k) = (3, -1). The focus is (h, k + p) = (3, 2) because the parabola opens up. The directrix is y = k - p = -4. The answer is vertex = (3, -1); focus = (3, 2); directrix = -4."
          - problem: "The parabola has equation (y + 4)^2 = 16(x - 2). Find the vertex, the focus, and the value c in the directrix x = c, and give the vertex and focus as (x, y)."
            answer: "vertex = (2, -4); focus = (6, -4); directrix = -2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "vertex"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "focus"}, {"contract": {"kind": "exact"}, "name": "directrix"}]}
            solution_sketch: "Compare (y + 4)^2 = 16(x - 2) with (y - k)^2 = 4p(x - h): h = 2, k = -4, and p = 4. The vertex is (h, k) = (2, -4). The focus is (h + p, k) = (6, -4) because the parabola opens right. The directrix is x = h - p = -2. The answer is vertex = (2, -4); focus = (6, -4); directrix = -2."
          - problem: "The parabola has equation (x + 2)^2 = -8(y - 3). Find the vertex, the focus, and the value c in the directrix y = c, and give the vertex and focus as (x, y)."
            answer: "vertex = (-2, 3); focus = (-2, 1); directrix = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "vertex"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "focus"}, {"contract": {"kind": "exact"}, "name": "directrix"}]}
            solution_sketch: "Compare (x + 2)^2 = -8(y - 3) with (x - h)^2 = 4p(y - k): h = -2, k = 3, and p = -2. The vertex is (h, k) = (-2, 3). The focus is (h, k + p) = (-2, 1) because p is negative and the parabola opens down. The directrix is y = k - p = 5. The answer is vertex = (-2, 3); focus = (-2, 1); directrix = 5."
          - problem: "The parabola has equation (y - 5)^2 = -12(x + 1). Find the vertex, the focus, and the value c in the directrix x = c, and give the vertex and focus as (x, y)."
            answer: "vertex = (-1, 5); focus = (-4, 5); directrix = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "vertex"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "focus"}, {"contract": {"kind": "exact"}, "name": "directrix"}]}
            solution_sketch: "Compare (y - 5)^2 = -12(x + 1) with (y - k)^2 = 4p(x - h): h = -1, k = 5, and p = -3. The vertex is (h, k) = (-1, 5). The focus is (h + p, k) = (-4, 5) because p is negative and the parabola opens left. The directrix is x = h - p = 2. The answer is vertex = (-1, 5); focus = (-4, 5); directrix = 2."
    diagnostic_exemplar:
      problem: 'For $(x + 2)^2 = 8(y - 1)$, find the vertex, focus, and directrix.'
      answer: "vertex (-2, 1); focus (-2, 3); directrix y = -1"
      answer_contract: {kind: none}
      solution_sketch: '$4p = 8$ gives $p = 2$, opening upward: focus $2$ above the vertex, directrix $2$ below.'
    anki_seeds:
      - front: "For x² = 4py, the focus and directrix are..."
        back: "focus (0, p); directrix y = -p"
        type: basic
      - front: "A parabola is the set of points equidistant from..."
        back: "The focus (a point) and the directrix (a line)."
        type: basic

  - id: ellipses
    name: Ellipses
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: parabola-focus-directrix
        weight: 0.5
        key: true
      - id: distance-midpoint-formulas
        weight: 0.5
        key: true
      - id: simplifying-radicals
        weight: 0.3
      - id: circle-area-circumference
        weight: 0.0            # conceptual only: the circle as the a = b special case
    knowledge_points:
      - id: kp1
        name: Vertices and axes from standard form
        key_prerequisites: [distance-midpoint-formulas]
        constraints: "a² and b² perfect squares; center at the origin first"
        exemplars:
          - problem: "Consider the ellipse x^2/36 + y^2/9 = 1. Find the right vertex and the upper endpoint of the minor axis as (x1, y1, x2, y2)."
            answer: "(6, 0, 0, 3)"
            answer_contract: {"arity": 4, "kind": "coordinates"}
            solution_sketch: "The standard form has a^2 = 36 under x^2, so the major axis is horizontal and a = 6. The right vertex is (6, 0). The smaller denominator is 9 under y^2, so b = 3 and the upper minor-axis endpoint is (0, 3). The answer is (6, 0, 0, 3)."
          - problem: "Consider the ellipse x^2/9 + y^2/49 = 1. Select the direction of the major axis."
            answer: "vertical"
            answer_contract: {"kind": "label", "options": [["vertical"], ["horizontal"], ["diagonal"], ["circular"]]}
            solution_sketch: "The larger denominator is 49, and it is under y^2, so the major axis is vertical. A student who picks horizontal reads the larger denominator under x^2; one who picks diagonal assumes the axes are tilted; one who picks circular assumes a = b. The major-axis direction is vertical."
          - problem: "Consider the ellipse x^2/100 + y^2/36 = 1. Find the length of the major axis."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The larger denominator is 100 under x^2, so a^2 = 100 and a = 10. The major axis length is 2a = 20. The length of the major axis is 20."
          - problem: "Consider the ellipse x^2/9 + y^2/81 = 1. Find the length of the minor axis."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The larger denominator is 81 under y^2, so the major axis is vertical and a^2 = 81. The smaller denominator is 9 under x^2, so b^2 = 9 and b = 3. The minor axis length is 2b = 6. The length of the minor axis is 6."
          - problem: "Consider the ellipse x^2/36 + y^2/100 = 1. Find the vertex with positive y-coordinate as (x, y)."
            answer: "(0, 10)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The larger denominator is 100 under y^2, so the major axis is vertical and a^2 = 100. Then a = 10 and the vertices are (0, 10) and (0, -10). The vertex with positive y-coordinate is (0, 10)."
          - problem: "Consider the ellipse (x - 2)^2/9 + (y + 1)^2/64 = 1. Find the right endpoint of the minor axis as (x, y)."
            answer: "(5, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The center is (2, -1). The larger denominator 64 is under (y + 1)^2, so the major axis is vertical and a^2 = 64. The smaller denominator 9 gives b^2 = 9 and b = 3. The minor axis is horizontal, so its endpoints are (2 plus/minus 3, -1). The right endpoint is (5, -1)."
      - id: kp2
        name: Find the foci with c² = a² - b²
        key_prerequisites: [distance-midpoint-formulas, simplifying-radicals]
        constraints: "centre at the origin; a², b² chosen so c is an integer (or a single clean radical); cover both horizontal and vertical major axes"
        exemplars:
          - problem: 'Find the foci of $\frac{x^2}{25} + \frac{y^2}{9} = 1$.'
            answer: "(4, 0) and (-4, 0)"
            answer_contract: {kind: list, ordered: false, member: {kind: coordinates, arity: 2}}
            solution_sketch: '$c^2 = 25 - 9 = 16$.'
          - problem: 'Find the foci of $\frac{x^2}{9} + \frac{y^2}{25} = 1$.'
            answer: "(0, -4) and (0, 4)"
            answer_contract: {kind: list, ordered: false, member: {kind: coordinates, arity: 2}}
            solution_sketch: 'Vertical major axis; $c^2 = 25 - 9 = 16$, so the foci are $(0, \\pm 4)$.'
      - id: kp3
        name: Write the equation from geometric data
        key_prerequisites: [parabola-focus-directrix]
        constraints: "data as vertices/foci on an axis or centre plus semi-axes; integer a, b, c; answers in standard form with denominators a², b²"
        exemplars:
          - problem: 'Write the equation of the ellipse with vertices $(\pm 5, 0)$ and foci $(\pm 3, 0)$.'
            answer: "x^2/25 + y^2/16 = 1"
            answer_contract: {kind: polynomial_relation}
            solution_sketch: '$b^2 = a^2 - c^2 = 25 - 9 = 16$.'
          - problem: 'Write the equation of the ellipse centered at $(2, -1)$ with a horizontal semi-major axis $4$ and semi-minor axis $2$.'
            answer: "(x - 2)^2/16 + (y + 1)^2/4 = 1"
            answer_contract: {kind: polynomial_relation}
          - problem: "An ellipse centered at the origin has vertices (0, ±7) and foci (0, ±5). Give a2 and b2 for its standard form equation."
            answer: "a2 = 49; b2 = 24"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a2"}, {"contract": {"kind": "exact"}, "name": "b2"}]}
            solution_sketch: "The full standard form is x^2/24 + y^2/49 = 1. The vertices (0, ±7) give a = 7, so a2 = 49. The foci (0, ±5) give c = 5, so c2 = 25. The ellipse relation b2 = a2 - c2 gives b2 = 49 - 25 = 24. Thus a2 = 49; b2 = 24."
          - problem: "An ellipse centered at (3, -2) has a horizontal major axis with vertices at (7, -2) and (-1, -2) and foci at (5, -2) and (1, -2). Give a2 and b2 for its standard form equation."
            answer: "a2 = 16; b2 = 12"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a2"}, {"contract": {"kind": "exact"}, "name": "b2"}]}
            solution_sketch: "The full standard form is (x - 3)^2/16 + (y + 2)^2/12 = 1. The vertices (7, -2) and (-1, -2) give a = 4, so a2 = 16. The foci (5, -2) and (1, -2) give c = 2, so c2 = 4. The relation b2 = a2 - c2 gives b2 = 16 - 4 = 12. Thus a2 = 16; b2 = 12."
          - problem: "An ellipse has vertices (0, ±6) and foci (0, ±2). Which equation is its standard form?"
            answer: "x^2/32 + y^2/36 = 1"
            answer_contract: {"kind": "label", "options": [["x^2/32 + y^2/36 = 1"], ["x^2/36 + y^2/32 = 1"], ["x^2/4 + y^2/36 = 1"], ["x^2/36 + y^2/4 = 1"]]}
            solution_sketch: "The full standard form is x^2/32 + y^2/36 = 1. The vertices (0, ±6) give a = 6, so a2 = 36. The foci (0, ±2) give c = 2, so c2 = 4. The relation b2 = a2 - c2 gives b2 = 36 - 4 = 32, and the major axis is vertical. The option x^2/36 + y^2/32 = 1 swaps the denominators; x^2/4 + y^2/36 = 1 uses c2 for b2; x^2/36 + y^2/4 = 1 uses a2 and c2 with the wrong orientation. The correct option is x^2/32 + y^2/36 = 1."
          - problem: "An ellipse centered at (-1, 4) has a vertical major axis with vertices at (-1, 9) and (-1, -1) and foci at (-1, 7) and (-1, 1). Which equation is its standard form?"
            answer: "(x + 1)^2/16 + (y - 4)^2/25 = 1"
            answer_contract: {"kind": "label", "options": [["(x + 1)^2/16 + (y - 4)^2/25 = 1"], ["(x - 1)^2/16 + (y + 4)^2/25 = 1"], ["(x + 1)^2/25 + (y - 4)^2/16 = 1"], ["(x + 1)^2/9 + (y - 4)^2/25 = 1"]]}
            solution_sketch: "The full standard form is (x + 1)^2/16 + (y - 4)^2/25 = 1. The center is (-1, 4). The vertices (-1, 9) and (-1, -1) give a = 5, so a2 = 25. The foci (-1, 7) and (-1, 1) give c = 3, so c2 = 9. The relation b2 = a2 - c2 gives b2 = 25 - 9 = 16, and the major axis is vertical. The option (x - 1)^2/16 + (y + 4)^2/25 = 1 uses the wrong center signs; (x + 1)^2/25 + (y - 4)^2/16 = 1 swaps the denominators; (x + 1)^2/9 + (y - 4)^2/25 = 1 uses c2 for b2. The correct option is (x + 1)^2/16 + (y - 4)^2/25 = 1."
    diagnostic_exemplar:
      problem: 'Write the equation of the ellipse with vertices $(0, \pm 5)$ and foci $(0, \pm 4)$.'
      answer: "x^2/9 + y^2/25 = 1"
      answer_contract: {kind: polynomial_relation}
      solution_sketch: 'Vertical major axis with $a = 5$; $b^2 = a^2 - c^2 = 25 - 16 = 9$.'
    anki_seeds:
      - front: "For an ellipse, c² = ?"
        back: "a² - b² (foci lie on the major axis, distance c from the center)"
        type: basic

  - id: hyperbolas
    name: Hyperbolas
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 200
    prerequisites:
      - id: ellipses
        weight: 0.7
        key: true
      - id: graphing-linear-equations
        weight: 0.3
      - id: simplifying-radicals
        weight: 0.3
      - id: vertical-horizontal-asymptotes
        weight: 0.0            # conceptual only: prior exposure to asymptote language
    knowledge_points:
      - id: kp1
        name: Vertices, foci, and asymptotes (horizontal transverse axis)
        key_prerequisites: [ellipses]
        constraints: "c² = a² + b²; asymptotes y = ±(b/a)x"
        exemplars:
          - problem: "For x^2/25 - y^2/144 = 1, find the focus with positive x-coordinate. Give the answer as (x, y)."
            answer: "(13, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The equation x^2/25 - y^2/144 = 1 has a^2 = 25 and b^2 = 144. Use the relation c^2 = a^2 + b^2, so c^2 = 25 + 144 = 169. The foci are at (13, 0) and (-13, 0), so the focus with positive x-coordinate is (13, 0)."
          - problem: "For x^2/36 - y^2/49 = 1, find the positive slope of the asymptotes."
            answer: "7/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation x^2/36 - y^2/49 = 1 has a^2 = 36 and b^2 = 49. Use the asymptote-slope rule b/a, so the positive slope is sqrt(49)/sqrt(36) = 7/6. The positive slope of the asymptotes is 7/6."
          - problem: "For x^2/49 - y^2/576 = 1, find the right vertex. Give the answer as (x, y)."
            answer: "(7, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The equation x^2/49 - y^2/576 = 1 has a^2 = 49, so a = 7. The vertex rule for a horizontal transverse axis gives vertices at (7, 0) and (-7, 0). The right vertex is (7, 0)."
          - problem: "For x^2/64 - y^2/225 = 1, find the distance from the center to a focus."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation x^2/64 - y^2/225 = 1 has a^2 = 64 and b^2 = 225. Use c^2 = a^2 + b^2, so c^2 = 64 + 225 = 289. Thus c = 17, and the distance from the center to a focus is 17."
          - problem: "For x^2/16 - y^2/9 = 1, find the asymptote with positive slope. Give it as a function of x."
            answer: "3x/4"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation x^2/16 - y^2/9 = 1 has a^2 = 16 and b^2 = 9. The asymptote slope rule gives b/a = 3/4. The positive-slope asymptote is y = (3/4)x, so as a function of x it is 3x/4."
          - problem: "For x^2/81 - y^2/1600 = 1, find the distance between the two foci."
            answer: "82"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation x^2/81 - y^2/1600 = 1 has a^2 = 81 and b^2 = 1600. Use c^2 = a^2 + b^2, so c^2 = 81 + 1600 = 1681. Thus c = 41, and the distance between the two foci is 2c = 82."
      - id: kp2
        name: Vertical transverse axis
        key_prerequisites: [ellipses, simplifying-radicals]
        constraints: "y² term positive; a², b² chosen so c is an integer or one clean radical; asymptote slopes ±a/b, simplified"
        exemplars:
          - problem: "For y^2/9 - x^2/16 = 1, the transverse axis is vertical. Give the y-coordinate of the upper vertex as v and the y-coordinate of the upper focus as f."
            answer: "v = 3; f = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "v"}, {"contract": {"kind": "exact"}, "name": "f"}]}
            solution_sketch: "The equation y^2/9 - x^2/16 = 1 has a^2 = 9 and b^2 = 16, so a = 3. For a vertical transverse axis the vertices are (0, ±a), so the upper vertex has y = 3. The focal distance satisfies c^2 = a^2 + b^2 = 9 + 16 = 25, so c = 5 and the upper focus has y = 5. Thus v = 3; f = 5."
          - problem: "For y^2/25 - x^2/144 = 1, find the positive slope m of the asymptotes as a simplified fraction."
            answer: "5/12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation y^2/25 - x^2/144 = 1 has a^2 = 25 and b^2 = 144, so a = 5 and b = 12. For a vertical transverse axis the asymptote slopes are ±a/b. The positive slope is 5/12. Thus m = 5/12."
          - problem: "For y^2/16 - x^2/20 = 1, find the upper focus. Give the answer as (x, y)."
            answer: "(0, 6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The equation y^2/16 - x^2/20 = 1 has a^2 = 16 and b^2 = 20. For a vertical hyperbola the focal distance satisfies c^2 = a^2 + b^2 = 16 + 20 = 36, so c = 6. The upper focus is (0, c), which is (0, 6). Thus the upper focus is (0, 6)."
          - problem: "For y^2/49 - x^2/576 = 1, find the focal distance c."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation y^2/49 - x^2/576 = 1 gives a^2 = 49 and b^2 = 576. For a vertical hyperbola the focal distance satisfies c^2 = a^2 + b^2. Compute c^2 = 49 + 576 = 625, so c = 25. Thus c = 25."
          - problem: "For y^2/36 - x^2/28 = 1, find the positive slope m of the asymptotes, simplified."
            answer: "3sqrt(7)/7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation y^2/36 - x^2/28 = 1 has a^2 = 36 and b^2 = 28, so a = 6 and b = sqrt(28) = 2sqrt(7). For a vertical transverse axis the positive asymptote slope is a/b. Compute 6/(2sqrt(7)) = 3/sqrt(7) = 3sqrt(7)/7. Thus m = 3sqrt(7)/7."
          - problem: "For y^2/64 - x^2/225 = 1, find the length of the transverse axis."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation y^2/64 - x^2/225 = 1 has a^2 = 64, so a = 8. The transverse axis is vertical and its length is 2a. Compute 2a = 2(8) = 16. Thus the length is 16."
      - id: kp3
        name: Write the equation from vertices and foci
        key_prerequisites: [ellipses]
        constraints: "vertices and foci on the same axis, integer a, c with c > a; b² = c² - a²; answers in standard form"
        exemplars:
          - problem: 'Write the equation of the hyperbola with vertices $(\pm 2, 0)$ and foci $(\pm 3, 0)$.'
            answer: "x^2/4 - y^2/5 = 1"
            answer_contract: {kind: polynomial_relation}
            solution_sketch: '$b^2 = c^2 - a^2 = 9 - 4 = 5$.'
          - problem: 'Write the equation of the hyperbola with vertices $(0, \pm 3)$ and foci $(0, \pm 5)$.'
            answer: "y^2/9 - x^2/16 = 1"
            answer_contract: {kind: polynomial_relation}
          - problem: "A hyperbola centered at the origin has vertices (3, 0) and (-3, 0) and foci (5, 0) and (-5, 0). Its equation can be written as x^2/A - y^2/B = 1 with integers A and B. Give A and B."
            answer: "A = 9; B = 16"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "The full standard form for a horizontal hyperbola is x^2/A - y^2/B = 1. Step 1, the vertex rule: the vertices (+/-3, 0) give a = 3, so A = a^2 = 9. Step 2, the focus rule: the foci (+/-5, 0) give c = 5, and the relation B = c^2 - a^2 gives B = 25 - 9 = 16. Therefore the answer is A = 9; B = 16."
          - problem: "A hyperbola centered at the origin has vertices (0, 4) and (0, -4) and foci (0, 5) and (0, -5). Its equation can be written as y^2/A - x^2/B = 1 with integers A and B. Find A and B."
            answer: "A = 16; B = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "The full standard form for a vertical hyperbola is y^2/A - x^2/B = 1. Step 1, the vertex rule: the vertices (0, +/-4) give a = 4, so A = a^2 = 16. Step 2, the focus rule: the foci (0, +/-5) give c = 5, and B = c^2 - a^2 = 25 - 16 = 9. Therefore the answer is A = 16; B = 9."
          - problem: "A hyperbola centered at the origin opens left and right. Its vertices are (6, 0) and (-6, 0), and its two foci on the x-axis are 20 units apart. Its equation can be written as x^2/A - y^2/B = 1 with integers A and B. Give A and B."
            answer: "A = 36; B = 64"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "The full standard form for a hyperbola opening left and right is x^2/A - y^2/B = 1. Step 1, the vertex rule: the vertices (+/-6, 0) give a = 6, so A = a^2 = 36. Step 2, the focus separation rule: foci 20 units apart give 2c = 20, so c = 10, and B = c^2 - a^2 = 100 - 36 = 64. Therefore the answer is A = 36; B = 64."
          - problem: "A hyperbola centered at the origin opens up and down. Its vertices are (0, 8) and (0, -8), and its foci are (0, 10) and (0, -10). Its equation can be written as y^2/A - x^2/B = 1 with integers A and B. Determine A and B."
            answer: "A = 64; B = 36"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "The full standard form for a hyperbola opening up and down is y^2/A - x^2/B = 1. Step 1, the vertex rule: the vertices (0, +/-8) give a = 8, so A = a^2 = 64. Step 2, the focus rule: the foci (0, +/-10) give c = 10, and B = c^2 - a^2 = 100 - 64 = 36. Therefore the answer is A = 64; B = 36."
    diagnostic_exemplar:
      problem: 'Write the equation of the hyperbola with vertices $(0, \pm 2)$ and foci $(0, \pm 4)$, and give the equations of its asymptotes.'
      answer: 'y^2/4 - x^2/12 = 1; asymptotes y = ±(√3/3)x'
      answer_contract: {kind: none}
      solution_sketch: 'Vertical transverse axis with $a = 2$, $c = 4$, so $b^2 = 16 - 4 = 12$; the asymptotes are $y = \pm\frac{a}{b}x = \pm\frac{2}{2\sqrt3}x = \pm\frac{\sqrt3}{3}x$.'
    anki_seeds:
      - front: "For a hyperbola, c² = ?"
        back: "a² + b² (compare: ellipse uses a² - b²)"
        type: basic
      - front: "Asymptotes of x²/a² - y²/b² = 1?"
        back: "y = ±(b/a)x"
        type: basic

  - id: classifying-conics-completing-square
    name: Classifying Conics by Completing the Square
    core: false                # supplemental: terminal classification exercise on the conics
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: completing-the-square
        weight: 0.7
        key: true
      - id: ellipses
        weight: 0.5
        key: true
      - id: hyperbolas
        weight: 0.5
      - id: parabola-focus-directrix
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Classify from the coefficients
        key_prerequisites: [ellipses, hyperbolas, parabola-focus-directrix]
        constraints: "no xy term; compare signs of the x² and y² coefficients"
        exemplars:
          - problem: 'Classify $4x^2 + 4y^2 - 8x = 0$.'
            answer: "circle"
            answer_contract: {kind: label, options: [[circle], [ellipse], [hyperbola], [parabola]]}
            solution_sketch: 'Equal $x^2$ and $y^2$ coefficients.'
          - problem: 'Classify $9x^2 - 4y^2 + 18x + 8y = 31$.'
            answer: "hyperbola"
            answer_contract: {kind: label, options: [[circle], [ellipse], [hyperbola], [parabola]]}
            solution_sketch: 'The $x^2$ and $y^2$ coefficients have opposite signs.'
          - problem: 'Classify $x^2 + 6x - y + 5 = 0$.'
            answer: "parabola"
            answer_contract: {kind: label, options: [[circle], [ellipse], [hyperbola], [parabola]]}
            solution_sketch: 'Only one squared variable appears.'
      - id: kp2
        name: Circle and ellipse to standard form
        key_prerequisites: [completing-the-square]
        constraints: "integer centres; complete the square in one or both variables; circle radii are integers, ellipse denominators perfect squares"
        exemplars:
          - problem: "Complete the square for x^2 + y^2 - 6x + 4y - 3 = 0. Give the center as (x, y) and the radius."
            answer: "center = (3, -2); radius = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "center"}, {"contract": {"kind": "exact"}, "name": "radius"}]}
            solution_sketch: "The circle equation is x^2 + y^2 - 6x + 4y - 3 = 0. Step 1: group x and y terms and complete the square for x: x^2 - 6x = (x - 3)^2 - 9. Step 2: complete the square for y: y^2 + 4y = (y + 2)^2 - 4. Step 3: substitute and simplify to (x - 3)^2 + (y + 2)^2 = 16. The final result is center = (3, -2); radius = 4."
          - problem: 'Write $4x^2 + y^2 - 8x = 0$ in standard form.'
            answer: "(x - 1)^2/1 + y^2/4 = 1"
            answer_contract: {kind: polynomial_relation}
            solution_sketch: '$4(x - 1)^2 + y^2 = 4$; divide by $4$.'
          - problem: "Complete the square for x^2 + y^2 + 8x - 2y - 8 = 0. Give the center as (x, y) and the radius."
            answer: "center = (-4, 1); radius = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "center"}, {"contract": {"kind": "exact"}, "name": "radius"}]}
            solution_sketch: "The circle equation is x^2 + y^2 + 8x - 2y - 8 = 0. Step 1: complete the square for x: x^2 + 8x = (x + 4)^2 - 16. Step 2: complete the square for y: y^2 - 2y = (y - 1)^2 - 1. Step 3: substitute and simplify to (x + 4)^2 + (y - 1)^2 = 25. The final result is center = (-4, 1); radius = 5."
          - problem: "Complete the square for 9x^2 + 4y^2 - 18x + 16y - 11 = 0. Give the center as (x, y) and the two denominators in x then y order."
            answer: "center = (1, -2); denoms = 4, 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "center"}, {"contract": {"kind": "list", "member": {"kind": "exact"}, "ordered": true}, "name": "denoms"}]}
            solution_sketch: "The ellipse equation is 9x^2 + 4y^2 - 18x + 16y - 11 = 0. Step 1: factor 9 from x terms and 4 from y terms: 9(x^2 - 2x) + 4(y^2 + 4y) = 11. Step 2: complete each square: 9((x - 1)^2 - 1) + 4((y + 2)^2 - 4) = 11. Step 3: simplify to 9(x - 1)^2 + 4(y + 2)^2 = 36 and divide by 36. The final result is center = (1, -2); denoms = 4, 9."
          - problem: "Complete the square for 4x^2 + 9y^2 - 16x + 18y - 11 = 0. Give the center as (x, y) and the two denominators in x then y order."
            answer: "center = (2, -1); denoms = 9, 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "center"}, {"contract": {"kind": "list", "member": {"kind": "exact"}, "ordered": true}, "name": "denoms"}]}
            solution_sketch: "The ellipse equation is 4x^2 + 9y^2 - 16x + 18y - 11 = 0. Step 1: factor 4 from x terms and 9 from y terms: 4(x^2 - 4x) + 9(y^2 + 2y) = 11. Step 2: complete each square: 4((x - 2)^2 - 4) + 9((y + 1)^2 - 1) = 11. Step 3: simplify to 4(x - 2)^2 + 9(y + 1)^2 = 36 and divide by 36. The final result is center = (2, -1); denoms = 9, 4."
          - problem: "The equation 25x^2 + 16y^2 + 150x - 64y - 111 = 0 is an ellipse. After completing the square, give the center as (x, y) and the two denominators in x then y order."
            answer: "center = (-3, 2); denoms = 16, 25"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "center"}, {"contract": {"kind": "list", "member": {"kind": "exact"}, "ordered": true}, "name": "denoms"}]}
            solution_sketch: "The ellipse equation is 25x^2 + 16y^2 + 150x - 64y - 111 = 0. Step 1: factor 25 from x terms and 16 from y terms: 25(x^2 + 6x) + 16(y^2 - 4y) = 111. Step 2: complete each square: 25((x + 3)^2 - 9) + 16((y - 2)^2 - 4) = 111. Step 3: simplify to 25(x + 3)^2 + 16(y - 2)^2 = 400 and divide by 400. The final result is center = (-3, 2); denoms = 16, 25."
      - id: kp3
        name: Hyperbola to standard form
        key_prerequisites: [completing-the-square, hyperbolas]
        constraints: "x² and y² coefficients of opposite sign, both dividing the constant cleanly; integer centres; denominators perfect squares after dividing through"
        exemplars:
          - problem: 'Write $x^2 - 4y^2 + 2x + 16y = 19$ in standard form.'
            answer: "(x + 1)^2/4 - (y - 2)^2 = 1"
            answer_contract: {kind: polynomial_relation}
            solution_sketch: '$(x + 1)^2 - 1 - 4[(y - 2)^2 - 4] = 19$ gives $(x + 1)^2 - 4(y - 2)^2 = 4$.'
          - problem: 'Find the center of the conic $x^2 - y^2 - 2x - 4y = 4$.'
            answer: "(1, -2)"
            solution_sketch: '$(x - 1)^2 - (y + 2)^2 = 4 + 1 - 4 = 1$.'
          - problem: "The conic $x^2 - 9y^2 + 4x + 18y = 14$ is a hyperbola. Find its center as (x, y)."
            answer: "(-2, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Start with the conic $x^2 - 9y^2 + 4x + 18y = 14$. Complete the square in $x$: $x^2 + 4x = (x + 2)^2 - 4$. Complete the square in $y$: $-9y^2 + 18y = -9[(y - 1)^2 - 1]$. Substitute: $(x + 2)^2 - 9(y - 1)^2 = 9$, so the center is (-2, 1)."
          - problem: "The conic $x^2 - 4y^2 - 6x + 8y = 11$ is a hyperbola. Find the value of $a^2$ in its standard form."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the conic $x^2 - 4y^2 - 6x + 8y = 11$. Complete the square in $x$: $x^2 - 6x = (x - 3)^2 - 9$. Complete the square in $y$: $-4y^2 + 8y = -4[(y - 1)^2 - 1]$. Substitute: $(x - 3)^2 - 4(y - 1)^2 = 16$, so the standard form has a^2 = 16."
          - problem: "The conic $16x^2 - 9y^2 - 64x - 18y = 89$ is a hyperbola. Find the right vertex as (x, y)."
            answer: "(5, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Start with the conic $16x^2 - 9y^2 - 64x - 18y = 89$. Complete the square in $x$: $16x^2 - 64x = 16[(x - 2)^2 - 4]$. Complete the square in $y$: $-9y^2 - 18y = -9[(y + 1)^2 - 1]$. Substitute: $16(x - 2)^2 - 9(y + 1)^2 = 144$, so $(x - 2)^2/9 - (y + 1)^2/16 = 1$. The right vertex is at (2 + 3, -1) = (5, -1)."
          - problem: "The conic $-25x^2 + 16y^2 - 100x - 96y = 356$ is a hyperbola. Find $c^2$ for its standard form."
            answer: "41"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the conic $-25x^2 + 16y^2 - 100x - 96y = 356$. Complete the square in $x$: $-25x^2 - 100x = -25[(x + 2)^2 - 4]$. Complete the square in $y$: $16y^2 - 96y = 16[(y - 3)^2 - 9]$. Substitute: $-25(x + 2)^2 + 16(y - 3)^2 = 400$, so $(y - 3)^2/25 - (x + 2)^2/16 = 1$. Then $a^2 = 25$ and $b^2 = 16$, so c^2 = 25 + 16 = 41."
    diagnostic_exemplar:
      problem: 'Write $9x^2 - 4y^2 - 18x - 16y = 43$ in standard form.'
      answer: "(x - 1)^2/4 - (y + 2)^2/9 = 1"
      answer_contract: {kind: polynomial_relation}
      solution_sketch: '$9(x - 1)^2 - 9 - 4(y + 2)^2 + 16 = 43$ gives $9(x - 1)^2 - 4(y + 2)^2 = 36$; divide by $36$.'
    anki_seeds:
      - front: "With no xy term: x² and y² coefficients equal → ?; same sign → ?; opposite signs → ?; one missing → ?"
        back: "circle; ellipse; hyperbola; parabola"
        type: basic

  - id: nonlinear-systems-conics
    name: Nonlinear Systems of Equations
    # supplemental: terminal application of the conic machinery — every later system
    # in the tree is linear; nothing downstream consumes it (re-audit R-18).
    core: false
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: systems-substitution
        weight: 0.7
        key: true
      - id: quadratic-equations-factoring
        weight: 0.6
        key: true
      - id: equations-of-circles
        weight: 0.5
      - id: systems-elimination
        weight: 0.3
      - id: quadratic-formula
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Line and parabola
        key_prerequisites: [systems-substitution, quadratic-equations-factoring]
        constraints: "substitute the line into the parabola; integer intersection points; one tangency case decided by the discriminant"
        exemplars:
          - problem: 'Solve the system $y = x^2$ and $y = x + 2$.'
            answer: "(-1, 1) and (2, 4)"
            answer_contract: {kind: list, ordered: false, member: {kind: coordinates, arity: 2}}
            solution_sketch: '$x^2 = x + 2$ gives $(x - 2)(x + 1) = 0$; substitute back for $y$.'
          - problem: 'For which value of $c$ does the line $y = 2x + c$ meet the parabola $y = x^2$ in exactly one point?'
            answer: "c = -1"
            solution_sketch: '$x^2 - 2x - c = 0$ has one solution when the discriminant $4 + 4c = 0$.'
      - id: kp2
        name: Line and circle
        key_prerequisites: [equations-of-circles, systems-substitution]
        constraints: "circles centred at the origin or with integer centres; count 0, 1, or 2 intersections via the discriminant"
        exemplars:
          - problem: 'Solve the system $x^2 + y^2 = 25$ and $y = x + 1$.'
            answer: "(3, 4) and (-4, -3)"
            answer_contract: {kind: list, ordered: false, member: {kind: coordinates, arity: 2}}
            solution_sketch: '$x^2 + (x + 1)^2 = 25$ gives $x^2 + x - 12 = 0 = (x + 4)(x - 3)$.'
          - problem: 'In how many points do the line $x + y = 10$ and the circle $x^2 + y^2 = 25$ intersect?'
            answer: "0"
            solution_sketch: 'Substituting $y = 10 - x$ gives $2x^2 - 20x + 75 = 0$ with discriminant $400 - 600 < 0$: no intersection points.'
      - id: kp3
        name: Conic and conic
        key_prerequisites: [equations-of-circles, quadratic-equations-factoring]
        constraints: "eliminate by substitution or by adding/subtracting the equations; integer or simple-radical intersections; reject roots inconsistent with a branch (e.g. y = x² forces y ≥ 0)"
        exemplars:
          - problem: 'Solve the system $x^2 + y^2 = 20$ and $y = x^2$.'
            answer: "(2, 4) and (-2, 4)"
            answer_contract: {kind: list, ordered: false, member: {kind: coordinates, arity: 2}}
            solution_sketch: '$y + y^2 = 20$ gives $y = 4$ or $y = -5$; reject $y = -5$ since $y = x^2 \ge 0$, then $x = \pm 2$.'
          - problem: 'Solve the system $x^2 + y^2 = 9$ and $x^2 - y^2 = 9$.'
            answer: "(3, 0) and (-3, 0)"
            answer_contract: {kind: list, ordered: false, member: {kind: coordinates, arity: 2}}
            solution_sketch: 'Adding gives $2x^2 = 18$, so $x = \pm 3$ and $y = 0$.'
          - problem: 'What is the maximum number of points in which a circle and an ellipse can intersect?'
            answer: "4"
    diagnostic_exemplar:
      problem: 'Solve the system $x^2 + y^2 = 25$ and $x^2 - y^2 = 7$.'
      answer: "(4, 3), (4, -3), (-4, 3), (-4, -3)"
      solution_sketch: 'Adding gives $2x^2 = 32$, so $x = \pm 4$; then $y^2 = 25 - 16 = 9$, so $y = \pm 3$ — four points.'
    anki_seeds:
      - front: "Maximum intersections of a line and a conic? Of two distinct conics?"
        back: "2; 4"
        type: basic
      - front: "Standard method for a line–conic system?"
        back: "Substitute the line into the conic and solve the resulting quadratic; its discriminant counts the intersection points."
        type: basic
