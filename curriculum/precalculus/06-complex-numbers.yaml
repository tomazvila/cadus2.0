unit: complex-numbers
course: precalculus
module: "Complex Numbers"
topics:
  - id: complex-numbers
    name: Complex Number Arithmetic
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: square-roots
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.5
        key: true
      - id: quadratic-formula
        weight: 0.5
      - id: combining-like-terms
        weight: 0.4
      - id: discriminant
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Powers of i and square roots of negatives
        key_prerequisites: [square-roots]
        constraints: "reduce i^n via i^4 = 1; radicands are perfect squares times -1"
        exemplars:
          - problem: 'Simplify $\sqrt{-49}$.'
            answer: "7i"
          - problem: 'Simplify $i^{27}$.'
            answer: "-i"
            solution_sketch: '$27 = 4 \cdot 6 + 3$, so $i^{27} = i^3 = -i$.'
          - problem: "Find sqrt(-81), and give the answer in a + bi form."
            answer: "9i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the radicand as -81 = 81 * (-1). The square root rule gives sqrt(81 * (-1)) = sqrt(81) * sqrt(-1) = 9i, using i = sqrt(-1). The answer is 9i."
          - problem: "The powers of i repeat every four steps. Find i^46, and give the answer in a + bi form."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the cycle i^1 = i, i^2 = -1, i^3 = -i, and i^4 = 1. Since 46 = 4 * 11 + 2, reduce i^46 to i^2. Because i^2 = -1, the answer is -1."
          - problem: "A square root expression is sqrt(-144). Give its simplified value in a + bi form."
            answer: "12i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write -144 as 144 * (-1). The square root of 144 is 12 and sqrt(-1) is i, so sqrt(-144) = 12i. The answer is 12i."
          - problem: "The powers of i cycle with period 4. Determine i^48, and give the answer in a + bi form."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use i^4 = 1 to reduce the exponent modulo 4. Since 48 = 4 * 12 + 0, i^48 = (i^4)^12 = 1. The answer is 1."
      - id: kp2
        name: Add, subtract, and multiply
        key_prerequisites: [combining-like-terms, polynomial-multiplication]
        constraints: "operands a + bi with single-digit integer a, b; products FOIL with i² = -1; answers in a + bi form"
        exemplars:
          - problem: 'Compute $(3 + 2i) + (1 - 5i)$.'
            answer: "4 - 3i"
          - problem: 'Compute $(2 + 3i)(4 - i)$.'
            answer: "11 + 10i"
            solution_sketch: '$8 - 2i + 12i - 3i^2 = 8 + 10i + 3$.'
          - problem: "Compute (6 - 2i) - (4 + 7i). Give the answer in a + bi form."
            answer: "2 - 9i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the complex numbers (6 - 2i) and (4 + 7i). Subtract the real parts: 6 - 4 = 2. Subtract the imaginary parts: -2 - 7 = -9. The result is 2 - 9i."
          - problem: "Compute (5 - 2i)(3 + 4i) using FOIL. Give the answer in a + bi form."
            answer: "23 + 14i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the product (5 - 2i)(3 + 4i). Apply FOIL: 5*3 + 5*4i - 2i*3 - 2i*4i. This gives 15 + 20i - 6i - 8 i*i. Since i*i = -1, the term -8 i*i becomes +8. Combine like terms: 15 + 8 = 23 and 20i - 6i = 14i. The result is 23 + 14i."
          - problem: "Compute (4 + i)(2 - 3i). Give the answer in a + bi form."
            answer: "11 - 10i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the product (4 + i)(2 - 3i). Apply FOIL: 4*2 + 4*(-3i) + i*2 + i*(-3i). This gives 8 - 12i + 2i - 3 i*i. Since i*i = -1, the term -3 i*i becomes +3. Combine like terms: 8 + 3 = 11 and -12i + 2i = -10i. The result is 11 - 10i."
          - problem: "Compute (7 + 2i) + (-3 - 8i) - (1 - i). Give the answer in a + bi form."
            answer: "3 - 5i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the expression (7 + 2i) + (-3 - 8i) - (1 - i). Distribute the subtraction: (7 + 2i) + (-3 - 8i) + (-1 + i). Combine the real parts: 7 - 3 - 1 = 3. Combine the imaginary parts: 2 - 8 + 1 = -5. The result is 3 - 5i."
      - id: kp3
        name: Divide using the conjugate; complex roots of quadratics
        key_prerequisites: [polynomial-multiplication, quadratic-formula]
        constraints: "divisors a + bi with |a|, |b| <= 3; quadratics with integer coefficients and negative discriminant; answers in a + bi form with exact fractions"
        exemplars:
          - problem: 'Compute $\frac{3 + 2i}{1 - i}$.'
            answer: "1/2 + (5/2)i"
            solution_sketch: 'Multiply by $\frac{1+i}{1+i}$: $\frac{(3+2i)(1+i)}{2} = \frac{1 + 5i}{2}$.'
          - problem: 'Solve $x^2 - 2x + 5 = 0$ and give the root whose imaginary part is positive.'
            answer: "1 + 2i"
            solution_sketch: '$x = \frac{2 \pm \sqrt{4 - 20}}{2} = 1 \pm 2i$; the root with positive imaginary part is $1 + 2i$.'
          - problem: "Compute the quotient (5 + i)/(2 - 3i). Give the answer in the form a + bi."
            answer: "7/13 + (17/13)i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First multiply numerator and denominator by the conjugate 2 + 3i, so the full object is ((5 + i)(2 + 3i))/((2 - 3i)(2 + 3i)). Second multiply polynomials: the numerator is 10 + 15i + 2i + 3i^2 = 7 + 17i and the denominator is 4 + 9 = 13. Third separate the real and imaginary parts as 7/13 + (17/13)i. The answer is 7/13 + (17/13)i."
          - problem: "Solve x^2 + 6x + 13 = 0. Find the root with positive imaginary part and give it in the form a + bi."
            answer: "-3 + 2i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the quadratic formula with a = 1, b = 6, c = 13, so x = (-6 ± sqrt(36 - 52))/2 = (-6 ± sqrt(-16))/2. Since sqrt(-16) = 4i, the roots are -3 + 2i and -3 - 2i. The root with positive imaginary part is -3 + 2i. Thus the answer is -3 + 2i."
          - problem: "Compute (2 + i)/(3 + 2i). Give the answer in the form a + bi."
            answer: "8/13 - (1/13)i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply numerator and denominator by the conjugate 3 - 2i, so the full object is ((2 + i)(3 - 2i))/((3 + 2i)(3 - 2i)). Multiply polynomials: the numerator is 6 - 4i + 3i - 2i^2 = 8 - i, and the denominator is 9 + 4 = 13. Separating real and imaginary parts gives 8/13 - (1/13)i. The answer is 8/13 - (1/13)i."
          - problem: "Solve x^2 - 4x + 13 = 0. Find the root with negative imaginary part and give it in the form a + bi."
            answer: "2 - 3i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the quadratic formula with a = 1, b = -4, c = 13, so x = (4 ± sqrt(16 - 52))/2 = (4 ± sqrt(-36))/2. Since sqrt(-36) = 6i, the roots are 2 + 3i and 2 - 3i. The root with negative imaginary part is 2 - 3i. Thus the answer is 2 - 3i."
    diagnostic_exemplar:
      problem: 'Compute $\dfrac{2 + \sqrt{-9}}{1 + i}$, giving the answer in $a + bi$ form.'
      answer: '5/2 + (1/2)i'
      solution_sketch: '$\sqrt{-9} = 3i$; multiply by $\frac{1-i}{1-i}$: $\frac{(2 + 3i)(1 - i)}{2} = \frac{5 + i}{2}$.'
    anki_seeds:
      - front: "i² = ?"
        back: "-1"
        type: basic
      - front: "To divide complex numbers, multiply numerator and denominator by..."
        back: "The conjugate of the denominator."
        type: basic

  - id: complex-plane-modulus-conjugate
    name: The Complex Plane, Modulus, and Conjugate
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: complex-numbers
        weight: 0.8
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: true
      - id: coordinate-plane
        weight: 0.3
      - id: distance-midpoint-formulas
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Plot and identify real and imaginary parts
        key_prerequisites: [coordinate-plane]
        constraints: "a + bi with single-digit integer a, b covering all four quadrants; answers as ordered pairs (a, b)"
        exemplars:
          - problem: 'Which ordered pair in the plane represents $3 - 2i$?'
            answer: "(3, -2)"
            solution_sketch: 'The real part is the $x$-coordinate and the imaginary part the $y$-coordinate, so $3 - 2i$ plots at $(3, -2)$, in Quadrant IV.'
          - problem: 'Give the ordered pair (real part, imaginary part) of $-4 + 7i$.'
            answer: "(-4, 7)"
            solution_sketch: 'In $a + bi$ the real part is $a = -4$ and the imaginary part is $b = 7$.'
          - problem: "The complex number $-6 - 5i$ is plotted in the complex plane. Give its coordinates as (real part, imaginary part)."
            answer: "(-6, -5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The complex number $-6 - 5i$ has real part $-6$ and imaginary part $-5$. By the complex-plane rule, the point is (real, imaginary) = (-6, -5)."
          - problem: "A complex number is represented by the expression $8 + 2i$. Give the ordered pair for its plot as (real part, imaginary part)."
            answer: "(8, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The complex number $8 + 2i$ has real part $8$ and imaginary part $2$. By the real-imaginary coordinate rule, the point is (8, 2)."
          - problem: "Plot the complex number $4 - 9i$. Give the point as (real part, imaginary part)."
            answer: "(4, -9)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "In $4 - 9i$, the real part is $4$ and the imaginary part is $-9$. By the plot rule, the point is (4, -9)."
          - problem: "The complex number $-2 + 6i$ is plotted. State its coordinates as (real part, imaginary part)."
            answer: "(-2, 6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The complex number $-2 + 6i$ has real part $-2$ and imaginary part $6$. By the real-imaginary coordinate rule, the point is (-2, 6)."
      - id: kp2
        name: Modulus as distance from the origin
        key_prerequisites: [pythagorean-theorem, distance-midpoint-formulas]
        constraints: "prefer Pythagorean triples; include one radical answer"
        exemplars:
          - problem: 'Compute $|3 + 4i|$.'
            answer: "5"
            solution_sketch: '$\sqrt{9 + 16}$.'
          - problem: 'Compute $|1 - i|$.'
            answer: "√2"
          - problem: 'Compute $|{-2} + 2\sqrt{3}\,i|$.'
            answer: "4"
            solution_sketch: '$\sqrt{4 + 12} = 4$.'
          - problem: "Compute |5 - 12i|."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The modulus is the distance from the origin, so |5 - 12i| = sqrt(5^2 + (-12)^2). By the Pythagorean theorem, 25 + 144 = 169. The square root is 13."
          - problem: "Find the distance from the origin to the point (-8, 6) in the complex plane."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The point (-8, 6) is the complex number -8 + 6i. Its modulus is the distance from the origin: sqrt((-8)^2 + 6^2). By the distance formula, 64 + 36 = 100, so the distance is 10."
          - problem: "Compute |2 + 3i|."
            answer: "sqrt(13)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The modulus of 2 + 3i is the distance from the origin: sqrt(2^2 + 3^2). By the Pythagorean theorem, 4 + 9 = 13. The square root is sqrt(13)."
      - id: kp3
        name: Conjugates and the identity z·z̄ = |z|²
        key_prerequisites: [complex-numbers]
        constraints: "z = a + bi with small integers; z·z̄ products come out to a² + b², a plain integer"
        exemplars:
          - problem: 'State the conjugate of $2 - 5i$.'
            answer: "2 + 5i"
          - problem: 'Compute $(3 + 4i)(3 - 4i)$.'
            answer: "25"
            solution_sketch: '$z\bar{z} = |z|^2 = 9 + 16$.'
          - problem: "State the conjugate of $-4 + 7i$."
            answer: "-4 - 7i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The conjugate rule keeps the real part and flips the sign of the imaginary part. For $-4 + 7i$ the real part is $-4$ and the imaginary part is $7$, so the conjugate is $-4 - 7i$."
          - problem: "Compute $(5 + 12i)(5 - 12i)$."
            answer: "169"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the identity $z\\bar{z} = a^2 + b^2$ for $z = a + bi$. With $a = 5$ and $b = 12$, this is $5^2 + 12^2 = 25 + 144 = 169$. The product is $169$."
          - problem: "For $z = 7 + 2i$, find $|z|^2$."
            answer: "53"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The modulus-squared identity gives $|z|^2 = a^2 + b^2$. With $a = 7$ and $b = 2$, this is $7^2 + 2^2 = 49 + 4 = 53$. So $|z|^2 = 53$."
          - problem: "A complex number has the form $z = 3 + bi$ with $z\\bar{z} = 34$ and $b > 0$. Find $b$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the identity $z\\bar{z} = a^2 + b^2$. Here $a = 3$, so $9 + b^2 = 34$, which gives $b^2 = 25$. Since $b > 0$, $b = 5$."
    diagnostic_exemplar:
      problem: 'Compute $(6 - 8i)(6 + 8i)$, and confirm that your value equals $|6 - 8i|^2$.'
      answer: '100'
      solution_sketch: '$z\bar z = 6^2 + 8^2 = 100$, and $|6 - 8i| = \sqrt{36 + 64} = 10$, whose square is $100$.'
    anki_seeds:
      - front: "|a + bi| = ?"
        back: "√(a² + b²)"
        type: basic
      - front: "z · z̄ = ?"
        back: "|z|² (a nonnegative real number)"
        type: basic

  - id: conjugate-root-theorem
    name: The Conjugate Root Theorem
    # supplemental: terminal theorem — closes the FTA topic's "roots over ℂ" dangle;
    # nothing downstream consumes it (re-audit R-17).
    core: false
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 200
    prerequisites:
      - id: complex-numbers
        weight: 0.6
        key: true
      - id: fundamental-theorem-algebra-multiplicity
        weight: 0.6
        key: true
      - id: complex-plane-modulus-conjugate
        weight: 0.4
      - id: polynomial-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Nonreal roots come in conjugate pairs
        key_prerequisites: [complex-numbers, fundamental-theorem-algebra-multiplicity]
        constraints: "polynomials always stated to have real coefficients; degrees 3-5; count arguments pair nonreal roots and use degree parity"
        exemplars:
          - problem: 'A cubic with real coefficients has roots $2$ and $1 + i$. What is its third root?'
            answer: "1 - i"
            solution_sketch: 'Real coefficients force nonreal roots into conjugate pairs.'
          - problem: "A cubic polynomial with real coefficients has $5i$ as a root. Give the other nonreal root in the form a + bi."
            answer: "0 - 5i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Conjugate Root Theorem says that a polynomial with real coefficients has nonreal roots in conjugate pairs. The conjugate of $5i$ is $-5i$, which is written as $0 - 5i$ in the form a + bi. So the other forced root is 0 - 5i."
          - problem: 'A degree-$5$ polynomial with real coefficients has $2i$ and $1 - i$ among its roots. How many real roots must it have?'
            answer: "1"
            solution_sketch: 'The conjugates $-2i$ and $1 + i$ are also roots: four nonreal roots, leaving exactly one real root.'
          - problem: "A degree-$4$ polynomial with real coefficients has $3$, $-5$, and $1 + i$ among its roots. How many real roots must it have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the Conjugate Root Theorem, $1 + i$ forces $1 - i$ to be a root. The given real roots are $3$ and $-5$, so there are two real roots. The degree is $4$, and $3$, $-5$, $1 + i$, $1 - i$ are four roots. Thus there are exactly 2 real roots."
          - problem: "A cubic polynomial with real coefficients has $-1$ and $4 - 3i$ among its roots. Give its third root in the form a + bi."
            answer: "4 + 3i"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Conjugate Root Theorem forces the conjugate of $4 - 3i$ to also be a root. The conjugate is $4 + 3i$. A cubic has three roots, and $-1$ is the real root, so the third root is 4 + 3i."
          - problem: "A degree-$4$ polynomial with real coefficients has $3i$ and $2 + i$ among its roots. How many real roots must it have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Conjugate Root Theorem forces the conjugates $-3i$ and $2 - i$ to also be roots. That gives four nonreal roots: $3i$, $-3i$, $2 + i$, $2 - i$. The polynomial has degree $4$, so these four roots fill it completely, leaving no room for a real root. Therefore the polynomial must have 0 real roots."
      - id: kp2
        name: Build a real polynomial from a complex root
        key_prerequisites: [complex-numbers, complex-plane-modulus-conjugate]
        constraints: 'use $z + \bar{z} = 2a$ and $z\bar{z} = a^2 + b^2$ for the quadratic factor; small integer $a$, $b$; monic answers'
        exemplars:
          - problem: 'Write a monic quadratic with real coefficients having $3 + 2i$ as a root. Expand it.'
            answer: "x^2 - 6x + 13"
            solution_sketch: 'The roots are $3 \pm 2i$: sum $6$, product $9 + 4 = 13$, so $x^2 - 6x + 13$.'
          - problem: 'Write a monic cubic with real coefficients whose roots include $1$ and $2 - i$. Expand it.'
            answer: "x^3 - 5x^2 + 9x - 5"
            solution_sketch: '$(x - 1)\left(x^2 - 4x + 5\right)$, since $2 \pm i$ give sum $4$ and product $5$.'
          - problem: "Write a monic quadratic with real coefficients having -4 + i as a root. Give the expanded polynomial."
            answer: "x^2 + 8x + 17"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Conjugate root theorem: real coefficients force the conjugate -4 - i as the second root. Vieta: sum = (-4 + i) + (-4 - i) = -8, product = 16 + 1 = 17. The monic quadratic is x^2 + 8x + 17."
          - problem: "Write a monic cubic with real coefficients whose roots include 3 and 5 + i. Give the expanded polynomial."
            answer: "x^3 - 13x^2 + 56x - 78"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Conjugate root theorem: 5 + i forces 5 - i. The complex pair gives x^2 - 10x + 26 because sum = 10 and product = 26. Multiply by (x - 3): x^3 - 13x^2 + 56x - 78."
          - problem: "A monic quadratic with real coefficients has one root 3 - 4i and constant term 25. Find the coefficient of x."
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Conjugate root theorem: the roots are 3 +/- 4i, so their sum is 6. For a monic quadratic the x coefficient is minus the sum, so it is -6. The constant term 9 + 16 = 25 agrees. The coefficient of x is -6."
          - problem: "Write a monic quartic with real coefficients whose roots are 1, -2, and 2 + i. Give the expanded polynomial."
            answer: "x^4 - 3x^3 - x^2 + 13x - 10"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Conjugate root theorem: 2 + i gives 2 - i, so the complex factor is x^2 - 4x + 5. The real factors are x - 1 and x + 2, whose product is x^2 + x - 2. Multiply: x^4 - 3x^3 - x^2 + 13x - 10."
      - id: kp3
        name: Find the remaining roots
        key_prerequisites: [fundamental-theorem-algebra-multiplicity, complex-numbers]
        constraints: "divide out the conjugate-pair quadratic; the remaining factor is linear or a factorable quadratic with integer roots"
        exemplars:
          - problem: "Given that $2 + i$ is a root of $p(x) = x^3 - 5x^2 + 9x - 5$, find the other roots. Give the answer as a set."
            answer: "{2 - i, 1}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The root 2 + i forces its conjugate 2 - i by the conjugate root theorem. The pair gives the factor x^2 - 4x + 5. Dividing p(x) by this factor leaves x - 1. Thus the other roots are {2 - i, 1}."
          - problem: "Given that $3i$ is a root of $p(x) = x^4 + x^3 + 3x^2 + 9x - 54$, find all roots of $p$. Give the answer as a set."
            answer: "{3i, -3i, 2, -3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The conjugate root theorem says the root 3i forces -3i. The pair gives the factor x^2 + 9. Dividing p(x) by x^2 + 9 leaves x^2 + x - 6, which factors as (x - 2)(x + 3). Thus all roots are {3i, -3i, 2, -3}."
          - problem: "Given that $1 - 2i$ is a root of $p(x) = x^3 - 6x^2 + 13x - 20$, find the other roots. Give the answer as a set."
            answer: "{1 + 2i, 4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The root 1 - 2i forces its conjugate 1 + 2i. The pair gives the factor x^2 - 2x + 5. Dividing p(x) by this factor leaves x - 4. Thus the other roots are {1 + 2i, 4}."
          - problem: "Given that $2 + i$ is a root of $p(x) = x^4 - 6x^3 + 10x^2 + 2x - 15$, find all roots of $p$. Give the answer as a set."
            answer: "{2 + i, 2 - i, 3, -1}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The conjugate root theorem gives 2 - i as another root. The pair gives the factor x^2 - 4x + 5. Dividing p(x) by this factor leaves x^2 - 2x - 3, which factors as (x - 3)(x + 1). Thus all roots are {2 + i, 2 - i, 3, -1}."
          - problem: "Given that $-4i$ is a root of $p(x) = x^4 + 4x^3 + 11x^2 + 64x - 80$, find all roots of $p$. Give the answer as a set."
            answer: "{4i, -4i, 1, -5}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The root -4i forces its conjugate 4i by the conjugate root theorem. The pair gives the factor x^2 + 16. Dividing p(x) by x^2 + 16 leaves x^2 + 4x - 5, which factors as (x + 5)(x - 1). Thus all roots are {4i, -4i, 1, -5}."
          - problem: "Given that $2 - 3i$ is a root of $p(x) = x^4 - 4x^3 + 9x^2 + 16x - 52$, find all roots of $p$. Give the answer as a set."
            answer: "{2 + 3i, 2 - 3i, 2, -2}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The conjugate root theorem gives 2 + 3i as another root. The pair gives the factor x^2 - 4x + 13. Dividing p(x) by this factor leaves x^2 - 4, which factors as (x - 2)(x + 2). Thus all roots are {2 + 3i, 2 - 3i, 2, -2}."
    diagnostic_exemplar:
      problem: 'Given that $1 + 2i$ is a root of $p(x) = x^3 - 5x^2 + 11x - 15$, find the other roots.'
      answer: "1 - 2i and 3"
      answer_contract: {kind: none}
      solution_sketch: 'Real coefficients force the conjugate $1 - 2i$; the pair gives the factor $x^2 - 2x + 5$, and dividing leaves $x - 3$.'
    anki_seeds:
      - front: "Conjugate root theorem?"
        back: "If a polynomial has real coefficients and a + bi is a root, then a − bi is also a root."
        type: basic
      - front: "For z = a + bi, the real quadratic (x − z)(x − z̄) expands to..."
        back: "x² − 2ax + (a² + b²)."
        type: basic

  - id: complex-polar-form-de-moivre
