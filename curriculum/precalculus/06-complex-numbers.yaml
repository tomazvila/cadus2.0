        name: Rectangular to polar form
        key_prerequisites: [complex-plane-modulus-conjugate, unit-circle]
        constraints: "arguments limited to unit-circle angles; give θ in [0, 2π)"
        exemplars:
          - problem: 'Write $1 + i$ in polar form $r(\cos\theta + i\sin\theta)$.'
            answer: "√2 (cos π/4 + i sin π/4)"
          - problem: 'Write $1 - \sqrt{3}\,i$ in polar form with $\theta \in [0, 2\pi)$.'
            answer: "2 (cos 5π/3 + i sin 5π/3)"
            solution_sketch: '$r = \sqrt{1 + 3} = 2$; the point lies in Quadrant IV with reference angle $\pi/3$.'
          - problem: "Write $-1 + i$ in polar form. Give the answer as (r, theta), with theta in [0, 2pi)."
            answer: "(sqrt(2), 3pi/4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Modulus rule: $r = \\sqrt{(-1)^2 + 1^2} = \\sqrt{2}$. The point $(-1, 1)$ is in Quadrant II, so the argument is $\\pi - \\pi/4 = 3\\pi/4$. The answer is (sqrt(2), 3pi/4)."
          - problem: "Write $-\\sqrt{3} - i$ in polar form. Give the answer as (r, theta), with theta in [0, 2pi)."
            answer: "(2, 7pi/6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Modulus rule: $r = \\sqrt{3 + 1} = 2$. The point is in Quadrant III with reference angle $\\pi/6$, so the argument is $\\pi + \\pi/6 = 7\\pi/6$. The answer is (2, 7pi/6)."
          - problem: "Write $2i$ in polar form. Give the answer as (r, theta), with theta in [0, 2pi)."
            answer: "(2, pi/2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Modulus rule: $r = \\sqrt{0^2 + 2^2} = 2$. The point $(0, 2)$ lies on the positive imaginary axis, so the argument is $\\pi/2$. The answer is (2, pi/2)."
          - problem: "Write $-3$ in polar form. Give the answer as (r, theta), with theta in [0, 2pi)."
            answer: "(3, pi)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Modulus rule: $r = \\sqrt{(-3)^2 + 0^2} = 3$. The point $(-3, 0)$ lies on the negative real axis, so the argument is $\\pi$. The answer is (3, pi)."
      - id: kp2
        name: Polar to rectangular form
        key_prerequisites: [unit-circle]
        constraints: "r a small integer; θ a unit-circle angle; answers exact in a + bi form with radicals allowed"
        exemplars:
          - problem: 'Convert $4\left(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\right)$ to rectangular form.'
            answer: "2 + 2√3 i"
            solution_sketch: '$4 \cdot \frac{1}{2} + 4 \cdot \frac{\sqrt{3}}{2} i$.'
          - problem: 'Convert $2\left(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\right)$ to rectangular form.'
            answer: "-√2 + √2 i"
      - id: kp3
        name: Powers via De Moivre
        key_prerequisites: [complex-plane-modulus-conjugate, unit-circle]
        constraints: "exponents 3-8; final answers in rectangular form"
        exemplars:
          - problem: 'Use De Moivre''s theorem to compute $(1 + i)^8$.'
            answer: "16"
            solution_sketch: '$(\sqrt{2})^8 \operatorname{cis}(8 \cdot \frac{\pi}{4}) = 16 \operatorname{cis} 2\pi = 16$.'
          - problem: 'Compute $\left(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\right)^3$.'
            answer: "i"
          - problem: 'Compute $(1 - \sqrt{3}\,i)^3$.'
            answer: "-8"
            solution_sketch: '$2^3 \operatorname{cis}(3 \cdot \frac{5\pi}{3}) = 8 \operatorname{cis} 5\pi = 8 \operatorname{cis} \pi = -8$.'
    diagnostic_exemplar:
      problem: 'Use De Moivre''s theorem to compute $(1 + i)^6$ in rectangular form.'
      answer: "-8i"
      solution_sketch: '$1 + i = \sqrt{2}\operatorname{cis}\frac{\pi}{4}$, so $(1+i)^6 = 8\operatorname{cis}\frac{3\pi}{2} = -8i$.'
    anki_seeds:
      - front: "De Moivre's theorem: [r(cos θ + i sin θ)]ⁿ = ?"
        back: "rⁿ (cos nθ + i sin nθ)"
        type: basic

  - id: nth-roots-complex-numbers
    name: nth Roots of Complex Numbers
    core: false                # supplemental: terminal capstone of the complex-number branch
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: complex-polar-form-de-moivre
        weight: 0.8
        key: true
      - id: unit-circle
        weight: 0.4
      - id: rational-exponents
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Square roots of a complex number
        key_prerequisites: [complex-polar-form-de-moivre]
        constraints: "moduli that are perfect squares; answers in rectangular form"
        exemplars:
          - problem: 'Find both square roots of $-4$.'
            answer: "2i and -2i"
            answer_contract: {kind: none}
            solution_sketch: '$\\pm 2i$ since $(2i)^2 = -4$.'
          - problem: 'Find both square roots of $9i$ in rectangular form.'
            answer: "3√2/2 + (3√2/2)i and -3√2/2 - (3√2/2)i"
            answer_contract: {kind: none}
            solution_sketch: '$9i = 9\operatorname{cis}\frac{\pi}{2}$; roots $3\operatorname{cis}\frac{\pi}{4}$ and $3\operatorname{cis}\frac{5\pi}{4}$.'
      - id: kp2
        name: Cube roots
        key_prerequisites: [complex-polar-form-de-moivre, unit-circle]
        constraints: "radicands ±8, ±27; spacing 2π/3 between roots"
        exemplars:
          - problem: 'Find all cube roots of $8$.'
            answer: "2, -1 + √3 i, -1 - √3 i"
            solution_sketch: 'Roots $2\operatorname{cis}\frac{2\pi k}{3}$ for $k = 0, 1, 2$.'
          - problem: 'Find all cube roots of $-27$.'
            answer: "3/2 + (3√3/2)i, -3, 3/2 - (3√3/2)i"
            solution_sketch: '$-27 = 27\operatorname{cis}\pi$; roots $3\operatorname{cis}\frac{\pi + 2\pi k}{3}$.'
      - id: kp3
        name: Fourth roots and roots of unity
        key_prerequisites: [complex-polar-form-de-moivre, unit-circle]
        constraints: "radicands 1, 16, 81 (fourth roots land on the axes); root counts and spacing 2π/n for n <= 8"
        exemplars:
          - problem: 'Find all fourth roots of $16$.'
            answer: "2, 2i, -2, -2i"
          - problem: 'How many sixth roots of unity are there, and what is the angle between consecutive roots?'
            answer: "6 roots, spaced 60° (π/3) apart on the unit circle"
            answer_contract: {kind: none}
            solution_sketch: 'There are $6$ sixth roots of unity, spaced $2\\pi/6 = \\pi/3 = 60^\\circ$ apart on the unit circle.'
    diagnostic_exemplar:
      problem: 'Find all cube roots of $27$.'
      answer: "3, -3/2 + (3√3/2)i, -3/2 - (3√3/2)i"
      solution_sketch: 'Write $27 = 27\operatorname{cis} 0$: the cube roots all have modulus $\sqrt[3]{27} = 3$ and arguments $0, \frac{2\pi}{3}, \frac{4\pi}{3}$ — three points equally spaced on the circle of radius $3$.'
    anki_seeds:
      - front: "The n nth roots of r·cis θ are..."
        back: "r^(1/n) · cis((θ + 2πk)/n) for k = 0, 1, …, n-1"
        type: basic
      - front: "The nth roots of a complex number are spaced how, geometrically?"
        back: "Equally around a circle of radius r^(1/n), separated by 2π/n."
        type: basic
