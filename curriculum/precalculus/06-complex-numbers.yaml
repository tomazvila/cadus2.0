unit: complex-numbers
course: precalculus
module: "Complex Numbers"
topics:
  - id: complex-numbers
    name: Complex Number Arithmetic
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: square-roots
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.5
        key: true
      - id: quadratic-formula
        weight: 0.5
      - id: combining-like-terms
        weight: 0.4
      - id: discriminant
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Powers of i and square roots of negatives'
        key_prerequisites: [square-roots]
        constraints: 'reduce i^n via i^4 = 1; radicands are perfect squares times -1'
        exemplars:
          - problem: 'Simplify $\sqrt{-49}$.'
            answer: '7i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-49$ as $49 \cdot (-1)$, so the radicand splits into a positive part and $-1$. Then $\sqrt{49}=7$ and $\sqrt{-1}=i$, so $\sqrt{-49}=7i$.'
          - problem: 'Simplify $i^{27}$.'
            answer: '-i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The powers of $i$ repeat in a cycle of length $4$. Since $27=4\cdot 6+3$, $i^{27}=i^3=-i$.'
          - problem: 'What is the value of $i^{48}$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The powers of $i$ repeat every four steps, and $48=4\cdot 12$. So $i^{48}=(i^4)^{12}=1$.'
          - problem: 'A pointer starts at the number $1$. At every clock tick its value is multiplied by $i$. What is its value after $41$ ticks?'
            answer: 'i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $41$ ticks the value is $i^{41}$. Since $41=4\cdot 10+1$, the powers have cycled ten times and $i^{41}=i^1=i$.'
          - problem: 'Simplify $\sqrt{-144}$.'
            answer: '12i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-144$ as $144\cdot(-1)$. The square root of $144$ is $12$ and $\sqrt{-1}=i$, so $\sqrt{-144}=12i$.'
          - problem: 'A phasor starts at $3$ and is multiplied by $i$ each time it passes through a filter. What is its value after $35$ passes?'
            answer: '-3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $35$ passes the value is $3i^{35}$. Since $35=4\cdot 8+3$, $i^{35}=i^3=-i$, so the phasor is $-3i$.'
          - problem: 'The equation $x^2 + 100 = 0$ has no real solutions. What are its solutions among the complex numbers?'
            answer: '10i, -10i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Rewrite the equation as $x^2=-100$, so $x=\pm\sqrt{-100}$. Since $\sqrt{-100}=10i$, the two solutions are $10i$ and $-10i$.'
          - problem: 'Mia simplifies $\sqrt{-9}\cdot\sqrt{-4}$ as $\sqrt{36}=6$. What is the correct value?'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Mia joined the radicands, but that rule does not hold for negative numbers. Write $\sqrt{-9}=3i$ and $\sqrt{-4}=2i$, so the product is $6i^2=-6$.'
      - id: kp2
        name: 'Add, subtract, and multiply'
        key_prerequisites: [combining-like-terms, polynomial-multiplication]
        constraints: 'operands a + bi with single-digit integer a, b; products FOIL with i² = -1; answers in a + bi form'
        exemplars:
          - problem: 'Compute $(3 + 2i) + (1 - 5i)$.'
            answer: '4 - 3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the real parts, $3+1=4$, and the imaginary parts, $2i-5i=-3i$. The sum is $4-3i$.'
          - problem: 'Compute $(2 + 3i)(4 - i)$.'
            answer: '11 + 10i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply each term: $8-2i+12i-3i^2$. Since $i^2=-1$ this is $8+10i+3$, which is $11+10i$.'
          - problem: 'Compute $(6 - 2i) - (4 + 7i)$.'
            answer: '2 - 9i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract the real parts: $6-4=2$. Subtract the imaginary parts: $-2-7=-9$, so the result is $2-9i$.'
          - problem: 'Two components wired in series have impedances $4 + 3i$ ohms and $2 - 7i$ ohms. What is the total impedance in ohms?'
            answer: '6 - 4i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Impedances in series add. The real parts give $4+2=6$ and the imaginary parts give $3-7=-4$, so the total is $6-4i$ ohms.'
          - problem: 'A current of $4 + i$ amperes flows through a component with impedance $2 - 3i$ ohms. The voltage across the component is the current times the impedance. What is the voltage in volts?'
            answer: '11 - 10i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the current by the impedance: $(4+i)(2-3i)=8-12i+2i-3i^2$. With $i^2=-1$ this is $11-10i$ volts.'
          - problem: 'Compute $(5 - 2i)(3 + 4i)$.'
            answer: '23 + 14i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand: $15+20i-6i-8i^2$. Since $i^2=-1$, the last term is $+8$, so the result is $23+14i$.'
          - problem: 'Compute $(7 + 2i) + (-3 - 8i) - (1 - i)$.'
            answer: '3 - 5i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Remove the brackets, changing the signs inside the last one: $7+2i-3-8i-1+i$. The real parts give $3$ and the imaginary parts give $-5i$.'
          - problem: 'Jon multiplies $(2 + 3i)(2 - 3i)$ and gets $4 - 9i^2 = 4 - 9 = -5$. What is the correct product?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Jon forgot that $i^2=-1$ in the last step, so the term $-9i^2$ is $+9$. The correct product is $4+9=13$.'
          - problem: 'Compute $(1 + i)^2$.'
            answer: '2i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand: $1+2i+i^2$. Since $i^2=-1$, the real parts cancel and the product is $2i$.'
      - id: kp3
        name: 'Divide using the conjugate; complex roots of quadratics'
        key_prerequisites: [polynomial-multiplication, quadratic-formula]
        constraints: 'divisors a + bi with |a|, |b| <= 3; quadratics with integer coefficients and negative discriminant; answers in a + bi form with exact fractions'
        try_first:
          problem: 'Compute $(2 + i)(2 - i)$.'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'The product is $4-i^2=4+1=5$, a real number. A number times its conjugate is always real, and that is how a denominator $a+bi$ can be cleared of $i$.'
        exemplars:
          - problem: 'Compute $\frac{3 + 2i}{1 - i}$.'
            answer: '1/2 + (5/2)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the top and bottom by the conjugate $1+i$. The top becomes $(3+2i)(1+i)=1+5i$ and the bottom becomes $2$, so the quotient is $\frac12+\frac52 i$.'
          - problem: 'Solve $x^2 - 2x + 5 = 0$.'
            answer: '1 + 2i, 1 - 2i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the quadratic formula $x=\frac{2\pm\sqrt{4-20}}{2}=\frac{2\pm 4i}{2}$. So the solutions are $1+2i$ and $1-2i$.'
          - problem: 'Compute $\frac{5 + i}{2 - 3i}$.'
            answer: '7/13 + (17/13)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the top and bottom by the conjugate $2+3i$. The top is $10+15i+2i+3i^2=7+17i$ and the bottom is $4+9=13$, so the quotient is $\frac{7}{13}+\frac{17}{13}i$.'
          - problem: 'A component with impedance $3 - i$ ohms has a voltage of $10 + 5i$ volts across it. Voltage equals current times impedance. What is the current in amperes?'
            answer: '5/2 + (5/2)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The current is the voltage divided by the impedance, $\frac{10+5i}{3-i}$. Multiply by $\frac{3+i}{3+i}$: the top is $25+25i$ and the bottom is $10$, so the current is $\frac52+\frac52 i$ amperes.'
          - problem: 'The height of a ball above a ledge is $h = -t^2 + 6t - 13$ metres, $t$ seconds after it is thrown. The ball never reaches the ledge, so $h = 0$ has no real solution. What are the complex solutions of $h = 0$?'
            answer: '3 + 2i, 3 - 2i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $-1$ to get $t^2-6t+13=0$. The quadratic formula gives $t=\frac{6\pm\sqrt{36-52}}{2}=\frac{6\pm 4i}{2}$, so $t=3\pm 2i$.'
          - problem: 'Compute $\frac{2 + i}{3 + 2i}$.'
            answer: '8/13 - (1/13)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the top and bottom by the conjugate $3-2i$. The top is $6-4i+3i-2i^2=8-i$ and the bottom is $9+4=13$, so the quotient is $\frac{8}{13}-\frac{1}{13}i$.'
          - problem: 'Solve $x^2 + 6x + 13 = 0$.'
            answer: '-3 + 2i, -3 - 2i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quadratic formula gives $x=\frac{-6\pm\sqrt{36-52}}{2}=\frac{-6\pm 4i}{2}$. So the solutions are $-3+2i$ and $-3-2i$.'
          - problem: 'Kim simplifies $\frac{6}{1 + i}$ and writes $3 + 3i$. What is the correct value?'
            answer: '3 - 3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Kim multiplied the top and bottom by $1+i$, but the conjugate of $1+i$ is $1-i$. So $\frac{6(1-i)}{(1+i)(1-i)}=\frac{6-6i}{2}=3-3i$.'
    diagnostic_exemplar:
      problem: 'Compute $\dfrac{2 + \sqrt{-9}}{1 + i}$.'
      answer: '5/2 + (1/2)i'
      answer_contract: {"kind":"exact"}
      solution_sketch: '$\sqrt{-9} = 3i$; multiply by $\frac{1-i}{1-i}$: $\frac{(2 + 3i)(1 - i)}{2} = \frac{5 + i}{2}$.'
    anki_seeds:
      - front: "i² = ?"
        back: "-1"
        type: basic
      - front: "To divide complex numbers, multiply numerator and denominator by..."
        back: "The conjugate of the denominator."
        type: basic

  - id: complex-plane-modulus-conjugate
    name: The Complex Plane, Modulus, and Conjugate
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: complex-numbers
        weight: 0.8
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: true
      - id: coordinate-plane
        weight: 0.3
      - id: distance-midpoint-formulas
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Plot and identify real and imaginary parts'
        key_prerequisites: [coordinate-plane]
        constraints: 'a + bi with single-digit integer a, b covering all four quadrants; answers as ordered pairs (a, b)'
        exemplars:
          - problem: 'Which ordered pair in the plane represents $3 - 2i$?'
            answer: '(3, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The real part is the $x$-coordinate and the imaginary part is the $y$-coordinate. So $3-2i$ is the point $(3, -2)$, in the fourth quadrant.'
          - problem: 'What are the coordinates of the point that represents $-4 + 7i$ in the complex plane?'
            answer: '(-4, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'In $a + bi$ the real part $a=-4$ is the $x$-coordinate and the imaginary part $b=7$ is the $y$-coordinate. So the point is $(-4, 7)$.'
          - problem: 'The point $(5, -1)$ is plotted in the complex plane. Which complex number does it represent?'
            answer: '5 - i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $x$-coordinate $5$ is the real part and the $y$-coordinate $-1$ is the imaginary part. So the point represents the complex number $5 - i$.'
          - problem: 'A robot''s position relative to its dock is the complex number $-4 + 7i$. The real part is measured in metres east and the imaginary part in metres north. How many metres north of the dock is the robot?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The imaginary part is the northward coordinate. For $-4+7i$ it is $7$, so the robot is $7$ m north of the dock, and $4$ m west of it.'
          - problem: 'A ship appears on a radar screen at the complex number $-6 - 5i$. The real axis points east and the imaginary axis points north. In which direction from the centre of the screen is the ship?'
            answer: 'south-west'
            answer_contract: {"kind":"label","options":[["south-west","southwest","south west","sw","to the south-west","in the south-west"],["north-east","northeast","north east","ne","to the north-east","in the north-east"],["north-west","northwest","north west","nw","to the north-west","in the north-west"],["south-east","southeast","south east","se","to the south-east","in the south-east"]]}
            solution_sketch: 'The real part $-6$ is negative, so the ship is west of the centre. The imaginary part $-5$ is negative, so it is also south of the centre. The ship lies to the south-west.'
          - problem: 'The complex number $4 - 9i$ is plotted in the complex plane. What are the coordinates of its point?'
            answer: '(4, -9)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The real part $4$ is the $x$-coordinate and the imaginary part $-9$ is the $y$-coordinate. So the point is $(4, -9)$.'
          - problem: 'Which complex number is plotted at the point $(-2, 0)$?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point has $x$-coordinate $-2$ and $y$-coordinate $0$, so the real part is $-2$ and the imaginary part is $0$. The point lies on the real axis and represents $-2$.'
      - id: kp2
        name: 'Modulus as distance from the origin'
        key_prerequisites: [pythagorean-theorem, distance-midpoint-formulas]
        constraints: 'prefer Pythagorean triples; include one radical answer'
        exemplars:
          - problem: 'Find $|3 + 4i|$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus is the distance from the origin to the point $(3, 4)$. By the Pythagorean theorem it is $\sqrt{9 + 16} = \sqrt{25} = 5$.'
          - problem: 'Find $|1 - i|$.'
            answer: 'sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus is $\sqrt{1^2 + (-1)^2} = \sqrt{1 + 1}$. So $|1 - i| = \sqrt{2}$.'
          - problem: 'Find $|{-2} + 2\sqrt{3}\,i|$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus is $\sqrt{(-2)^2 + (2\sqrt{3})^2} = \sqrt{4 + 12}$. That is $\sqrt{16} = 4$.'
          - problem: 'A drone is $5$ m east and $12$ m south of its pilot. How far is the drone from the pilot?'
            answer: '13'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Write the position as the complex number $5 - 12i$, with east real and north imaginary. Its modulus is $\sqrt{25 + 144} = \sqrt{169} = 13$, so the drone is $13$ m away.'
          - problem: 'Find the distance from the origin to the point $(-8, 6)$ in the complex plane.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $(-8, 6)$ is the complex number $-8 + 6i$. Its distance from the origin is $\sqrt{(-8)^2 + 6^2} = \sqrt{64 + 36} = 10$.'
          - problem: 'The magnitude of an impedance is the modulus of the complex number that describes it. What is the magnitude of an impedance of $1 + 6i$ ohms, to one decimal place?'
            answer: '6.1'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'The magnitude is $|1 + 6i| = \sqrt{1 + 36} = \sqrt{37}$. This is about $6.1$ ohms to one decimal place.'
          - problem: 'Find $|2 + 3i|$.'
            answer: 'sqrt(13)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus of $2 + 3i$ is the distance from the origin, $\sqrt{2^2 + 3^2}$. By the Pythagorean theorem, $4 + 9 = 13$, so the modulus is $\sqrt{13}$.'
          - problem: 'A complex number $z$ has real part $5$, a positive imaginary part and $|z| = 13$. What is $z$?'
            answer: '5 + 12i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $z = 5 + bi$ with $b > 0$. Then $25 + b^2 = 169$, so $b^2 = 144$ and $b = 12$. Hence $z = 5 + 12i$.'
      - id: kp3
        name: 'Conjugates and the identity z·z̄ = |z|²'
        key_prerequisites: [complex-numbers]
        constraints: 'z = a + bi with small integers; z·z̄ products come out to a² + b², a plain integer'
        exemplars:
          - problem: 'What is the conjugate of $2 - 5i$?'
            answer: '2 + 5i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugate keeps the real part and flips the sign of the imaginary part. So the conjugate of $2 - 5i$ is $2 + 5i$.'
          - problem: 'Compute $(3 + 4i)(3 - 4i)$.'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A number times its conjugate is $a^2 + b^2$. So $(3 + 4i)(3 - 4i) = 9 - 16i^2 = 9 + 16 = 25$.'
          - problem: 'What is the conjugate of $-4 + 7i$?'
            answer: '-4 - 7i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugate rule keeps the real part and flips the sign of the imaginary part. For $-4 + 7i$ the real part is $-4$ and the imaginary part is $7$, so the conjugate is $-4 - 7i$.'
          - problem: 'For $z = 7 + 2i$, find $|z|^2$.'
            answer: '53'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus-squared identity gives $|z|^2 = a^2 + b^2$. With $a = 7$ and $b = 2$, this is $49 + 4 = 53$.'
          - problem: 'The power of a signal with complex amplitude $z$ is $z\bar{z}$. Find the power of a signal with amplitude $5 + 12i$.'
            answer: '169'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product of a number and its conjugate is $a^2 + b^2$. So the power is $5^2 + 12^2 = 25 + 144 = 169$.'
          - problem: 'A complex number $z = 3 + bi$ has $z\bar{z} = 34$ and $b > 0$. Find $b$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use the identity $z\bar{z} = a^2 + b^2$. Here $a = 3$, so $9 + b^2 = 34$, which gives $b^2 = 25$. Since $b > 0$, $b = 5$.'
          - problem: 'The point $(-3, 2)$ is reflected in the real axis of the complex plane. Which complex number is plotted at the image of the point?'
            answer: '-3 - 2i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Reflecting in the real axis keeps the $x$-coordinate and flips the sign of the $y$-coordinate. So $(-3, 2)$ goes to $(-3, -2)$, which is the conjugate $-3 - 2i$.'
          - problem: 'What is the conjugate of $-6i$?'
            answer: '6i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The real part of $-6i$ is $0$, so only the sign of the imaginary part changes. The conjugate of $-6i$ is $6i$.'
    diagnostic_exemplar:
      problem: 'Compute $(6 - 8i)(6 + 8i)$.'
      answer: '100'
      answer_contract: {"kind":"exact"}
      solution_sketch: '$z\bar z = 6^2 + 8^2 = 100$, and $|6 - 8i| = \sqrt{36 + 64} = 10$, whose square is $100$.'
    anki_seeds:
      - front: "|a + bi| = ?"
        back: "√(a² + b²)"
        type: basic
      - front: "z · z̄ = ?"
        back: "|z|² (a nonnegative real number)"
        type: basic

  - id: conjugate-root-theorem
    name: The Conjugate Root Theorem
    # supplemental: terminal theorem — closes the FTA topic's "roots over ℂ" dangle;
    # nothing downstream consumes it (re-audit R-17).
    core: false
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 200
    prerequisites:
      - id: complex-numbers
        weight: 0.6
        key: true
      - id: fundamental-theorem-algebra-multiplicity
        weight: 0.6
        key: true
      - id: complex-plane-modulus-conjugate
        weight: 0.4
      - id: polynomial-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Nonreal roots come in conjugate pairs'
        key_prerequisites: [complex-numbers, fundamental-theorem-algebra-multiplicity]
        constraints: 'polynomials always stated to have real coefficients; degrees 3-5; count arguments pair nonreal roots and use degree parity'
        exemplars:
          - problem: 'A cubic with real coefficients has roots $2$ and $1 + i$. What is its third root?'
            answer: '1 - i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficients are real, so the nonreal root $1 + i$ must come with its conjugate. The third root is $1 - i$.'
          - problem: 'A cubic polynomial with real coefficients has $5i$ as a root. What other nonreal root must it have?'
            answer: '-5i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Nonreal roots of a real polynomial come in conjugate pairs. The conjugate of $5i$ is $-5i$, so $-5i$ is also a root.'
          - problem: 'A degree-$5$ polynomial with real coefficients has $2i$ and $1 - i$ among its roots. How many real roots must it have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugates $-2i$ and $1 + i$ are also roots, so there are four nonreal roots. That leaves exactly $5 - 4 = 1$ real root.'
          - problem: 'A degree-$4$ polynomial with real coefficients has $3$, $-5$ and $1 + i$ among its roots. How many real roots must it have?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The root $1 + i$ forces $1 - i$ to be a root. Together with $3$ and $-5$ these are four roots, so the polynomial has exactly $2$ real roots.'
          - problem: 'A cubic polynomial with real coefficients has $-1$ and $4 - 3i$ among its roots. What is its third root?'
            answer: '4 + 3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugate of $4 - 3i$ must also be a root. A cubic has three roots, and $-1$ is the real one, so the third root is $4 + 3i$.'
          - problem: 'A degree-$4$ polynomial with real coefficients has $3i$ and $2 + i$ among its roots. How many real roots must it have?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugates $-3i$ and $2 - i$ are also roots. That gives four nonreal roots, which fill the degree $4$ completely, so there are $0$ real roots.'
          - problem: 'Pia says that a cubic polynomial with real coefficients can have exactly the roots $1$, $2$ and $3 + i$. Is she right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","no, she is not right","she is not right","she is wrong","not possible","not right","incorrect","impossible"],["yes","yes, she is right","she is right","she is correct","possible","right","correct","yes, pia is right"]]}
            solution_sketch: 'The root $3 + i$ forces its conjugate $3 - i$ to be a root as well. A cubic would then have four roots, $1$, $2$, $3 + i$ and $3 - i$, which is too many.'
          - problem: 'The characteristic equation of a damped system is a cubic with real coefficients. One root is $-1 + 2i$ and another is $-4$. What is the remaining root?'
            answer: '-1 - 2i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugate of $-1 + 2i$ must also be a root. The three roots are $-4$, $-1 + 2i$ and $-1 - 2i$, so the remaining root is $-1 - 2i$.'
          - problem: 'The graph of a cubic polynomial with real coefficients crosses the $x$-axis exactly once, at $x = 4$. The cubic also has the root $-2 + 5i$. What is its third root?'
            answer: '-2 - 5i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph crosses the axis once, so $4$ is the only real root. The nonreal root $-2 + 5i$ comes with its conjugate, so the third root is $-2 - 5i$.'
      - id: kp2
        name: 'Build a real polynomial from a complex root'
        key_prerequisites: [complex-numbers, complex-plane-modulus-conjugate]
        constraints: 'use $z + \bar{z} = 2a$ and $z\bar{z} = a^2 + b^2$ for the quadratic factor; small integer $a$, $b$; monic answers'
        exemplars:
          - problem: 'Find the monic quadratic with real coefficients that has $3 + 2i$ as a root, and expand it.'
            answer: 'x^2 - 6x + 13'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The other root is the conjugate $3 - 2i$. The sum of the roots is $6$ and the product is $9 + 4 = 13$, so the quadratic is $x^2 - 6x + 13$.'
          - problem: 'Find the monic cubic with real coefficients whose roots include $1$ and $2 - i$, and expand it.'
            answer: 'x^3 - 5x^2 + 9x - 5'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The conjugate $2 + i$ is also a root. The pair gives $x^2 - 4x + 5$, because the sum is $4$ and the product is $5$. Then $(x - 1)(x^2 - 4x + 5) = x^3 - 5x^2 + 9x - 5$.'
          - problem: 'Find the monic quadratic with real coefficients that has $-4 + i$ as a root, and expand it.'
            answer: 'x^2 + 8x + 17'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The conjugate $-4 - i$ is the other root. Their sum is $-8$ and their product is $16 + 1 = 17$, so the quadratic is $x^2 + 8x + 17$.'
          - problem: 'The characteristic polynomial of a spring system is a monic cubic with real coefficients. Its roots are $-2$ and $-1 + 3i$. Write the polynomial $p(x)$ in expanded form.'
            answer: 'x^3 + 4x^2 + 14x + 20'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The conjugate $-1 - 3i$ is a root too, which gives the factor $x^2 + 2x + 10$. Then $(x + 2)(x^2 + 2x + 10) = x^3 + 4x^2 + 14x + 20$.'
          - problem: 'A monic quadratic with real coefficients has $3 - 4i$ as a root. What is the coefficient of $x$?'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The roots are $3 \pm 4i$, so their sum is $6$. For a monic quadratic the coefficient of $x$ is minus the sum of the roots, which is $-6$.'
          - problem: 'Find the monic quartic with real coefficients whose roots include $1$, $-2$ and $2 + i$, and expand it.'
            answer: 'x^4 - 3x^3 - x^2 + 13x - 10'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The conjugate $2 - i$ is a root, so the complex factor is $x^2 - 4x + 5$. The real factors multiply to $(x - 1)(x + 2) = x^2 + x - 2$. Multiplying gives $x^4 - 3x^3 - x^2 + 13x - 10$.'
          - problem: 'The characteristic polynomial of a damped oscillator is a monic quadratic with real coefficients and the root $-3 + 4i$. Write the polynomial $p(x)$ in expanded form.'
            answer: 'x^2 + 6x + 25'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The other root is the conjugate $-3 - 4i$. Their sum is $-6$ and their product is $9 + 16 = 25$, so the polynomial is $x^2 + 6x + 25$.'
          - problem: 'Tom builds a quadratic with the root $2 + 3i$ by multiplying $(x - 2 - 3i)(x - 2 + 3i)$ and gets $x^2 - 4x - 5$. What is the correct expanded polynomial?'
            answer: 'x^2 - 4x + 13'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Tom made a sign slip: the product is $(x - 2)^2 - (3i)^2$, and $(3i)^2 = -9$. So the product is $x^2 - 4x + 4 + 9 = x^2 - 4x + 13$.'
      - id: kp3
        name: 'Find the remaining roots'
        key_prerequisites: [fundamental-theorem-algebra-multiplicity, complex-numbers]
        constraints: 'divide out the conjugate-pair quadratic; the remaining factor is linear or a factorable quadratic with integer roots'
        exemplars:
          - problem: 'Given that $2 + i$ is a root of $p(x) = x^3 - 5x^2 + 9x - 5$, find the other roots.'
            answer: '2 - i, 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The root $2 + i$ forces its conjugate $2 - i$. The pair gives the factor $x^2 - 4x + 5$, and dividing $p(x)$ by it leaves $x - 1$. So the other roots are $2 - i$ and $1$.'
          - problem: 'Given that $3i$ is a root of $p(x) = x^4 + x^3 + 3x^2 + 9x - 54$, find all the roots of $p$.'
            answer: '3i, -3i, 2, -3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The root $3i$ forces $-3i$. The pair gives the factor $x^2 + 9$, and dividing leaves $x^2 + x - 6 = (x - 2)(x + 3)$. So the roots are $3i$, $-3i$, $2$ and $-3$.'
          - problem: 'Given that $1 - 2i$ is a root of $p(x) = x^3 - 6x^2 + 13x - 20$, find the other roots.'
            answer: '1 + 2i, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The root $1 - 2i$ forces its conjugate $1 + 2i$. The pair gives the factor $x^2 - 2x + 5$, and dividing $p(x)$ by it leaves $x - 4$. So the other roots are $1 + 2i$ and $4$.'
          - problem: 'A system has the characteristic equation $s^3 + 4s^2 + 14s + 20 = 0$, and $s = -1 + 3i$ is a solution. Find the other solutions.'
            answer: '-1 - 3i, -2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugate $-1 - 3i$ is also a solution. The pair gives the factor $s^2 + 2s + 10$, and dividing leaves $s + 2$. So the other solutions are $-1 - 3i$ and $-2$.'
          - problem: 'The cubic $f(x) = x^3 - 5x^2 + 17x - 13$ has the root $2 + 3i$. At which value of $x$ does its graph cross the $x$-axis?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugate $2 - 3i$ is a root, which gives the factor $x^2 - 4x + 13$. Dividing $f(x)$ by it leaves $x - 1$, so the graph crosses the axis at $x = 1$.'
          - problem: 'Given that $2 + i$ is a root of $p(x) = x^4 - 6x^3 + 10x^2 + 2x - 15$, find all the roots of $p$.'
            answer: '2 + i, 2 - i, 3, -1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugate $2 - i$ is also a root, and the pair gives the factor $x^2 - 4x + 5$. Dividing leaves $x^2 - 2x - 3 = (x - 3)(x + 1)$. So the roots are $2 + i$, $2 - i$, $3$ and $-1$.'
          - problem: 'Given that $-4i$ is a root of $p(x) = x^4 + 4x^3 + 11x^2 + 64x - 80$, find all the roots of $p$.'
            answer: '4i, -4i, 1, -5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The root $-4i$ forces $4i$. The pair gives the factor $x^2 + 16$, and dividing leaves $x^2 + 4x - 5 = (x + 5)(x - 1)$. So the roots are $4i$, $-4i$, $1$ and $-5$.'
          - problem: 'Given that $2 - 3i$ is a root of $p(x) = x^4 - 4x^3 + 9x^2 + 16x - 52$, find all the roots of $p$.'
            answer: '2 + 3i, 2 - 3i, 2, -2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The conjugate $2 + 3i$ is also a root, and the pair gives the factor $x^2 - 4x + 13$. Dividing leaves $x^2 - 4 = (x - 2)(x + 2)$. So the roots are $2 + 3i$, $2 - 3i$, $2$ and $-2$.'
    diagnostic_exemplar:
      problem: 'Given that $1 + 2i$ is a root of $p(x) = x^3 - 5x^2 + 11x - 15$, find the other roots.'
      answer: "1 - 2i and 3"
      answer_contract: {kind: none}
      solution_sketch: 'Real coefficients force the conjugate $1 - 2i$; the pair gives the factor $x^2 - 2x + 5$, and dividing leaves $x - 3$.'
    anki_seeds:
      - front: "Conjugate root theorem?"
        back: "If a polynomial has real coefficients and a + bi is a root, then a − bi is also a root."
        type: basic
      - front: "For z = a + bi, the real quadratic (x − z)(x − z̄) expands to..."
        back: "x² − 2ax + (a² + b²)."
        type: basic

  - id: complex-polar-form-de-moivre
    name: Polar Form and De Moivre's Theorem
    core: false                # supplemental, with nth-roots-complex-numbers: terminal branch
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: complex-plane-modulus-conjugate
        weight: 0.7
        key: true
      - id: unit-circle
        weight: 0.6
        key: true
      - id: inverse-trig-functions
        weight: 0.3
      - id: radians-degrees
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Rectangular to polar form'
        key_prerequisites: [complex-plane-modulus-conjugate, unit-circle]
        constraints: 'arguments limited to unit-circle angles; θ in [0, 2π)'
        exemplars:
          - problem: 'Write $1 + i$ in polar form, with $0 \le \theta < 2\pi$.'
            answer: 'sqrt(2)(cos(pi/4) + i sin(pi/4))'
            answer_contract: {"kind":"function","vars":["i"]}
            solution_sketch: 'The modulus is $r = \sqrt{1 + 1} = \sqrt{2}$. The point $(1, 1)$ lies in the first quadrant on the line at $45^\circ$, so $\theta = \frac{\pi}{4}$.'
          - problem: 'Write $1 - \sqrt{3}\,i$ in polar form, with $0 \le \theta < 2\pi$.'
            answer: '2(cos(5pi/3) + i sin(5pi/3))'
            answer_contract: {"kind":"function","vars":["i"]}
            solution_sketch: 'The modulus is $r = \sqrt{1 + 3} = 2$. The point lies in Quadrant IV with reference angle $\frac{\pi}{3}$, so $\theta = 2\pi - \frac{\pi}{3} = \frac{5\pi}{3}$.'
          - problem: 'Write $-1 + i$ in polar form, with $0 \le \theta < 2\pi$.'
            answer: 'sqrt(2)(cos(3pi/4) + i sin(3pi/4))'
            answer_contract: {"kind":"function","vars":["i"]}
            solution_sketch: 'The modulus is $r = \sqrt{1 + 1} = \sqrt{2}$. The point $(-1, 1)$ is in Quadrant II with reference angle $\frac{\pi}{4}$, so $\theta = \pi - \frac{\pi}{4} = \frac{3\pi}{4}$.'
          - problem: 'A ship is $2$ km west and $2$ km south of a lighthouse. Take east as the real axis and north as the imaginary axis. Write the ship''s position in polar form, with $0 \le \theta < 2\pi$.'
            answer: '2sqrt(2)(cos(5pi/4) + i sin(5pi/4))'
            answer_contract: {"kind":"function","vars":["i"]}
            solution_sketch: 'The position is the complex number $-2 - 2i$. Its modulus is $\sqrt{4 + 4} = 2\sqrt{2}$, and the point is in Quadrant III with reference angle $\frac{\pi}{4}$, so $\theta = \pi + \frac{\pi}{4} = \frac{5\pi}{4}$.'
          - problem: 'What is the argument $\theta$ of $-\sqrt{3} - i$, in radians with $0 \le \theta < 2\pi$?'
            answer: '7pi/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $(-\sqrt{3}, -1)$ is in Quadrant III with reference angle $\frac{\pi}{6}$, because $\tan = \frac{1}{\sqrt{3}}$. So $\theta = \pi + \frac{\pi}{6} = \frac{7\pi}{6}$.'
          - problem: 'A wind blows $3\sqrt{3}$ m/s towards the east and $3$ m/s towards the north. Write this velocity as a complex number in polar form, with east as the real axis and $0 \le \theta < 2\pi$.'
            answer: '6(cos(pi/6) + i sin(pi/6))'
            answer_contract: {"kind":"function","vars":["i"]}
            solution_sketch: 'The velocity is the complex number $3\sqrt{3} + 3i$. Its modulus is $\sqrt{27 + 9} = 6$, and $\tan\theta = \frac{3}{3\sqrt{3}}$ gives $\theta = \frac{\pi}{6}$ in Quadrant I.'
          - problem: 'Write $2i$ in polar form, with $0 \le \theta < 2\pi$.'
            answer: '2(cos(pi/2) + i sin(pi/2))'
            answer_contract: {"kind":"function","vars":["i"]}
            solution_sketch: 'The modulus is $r = \sqrt{0 + 4} = 2$. The point $(0, 2)$ lies on the positive imaginary axis, so the angle is $\theta = \frac{\pi}{2}$.'
          - problem: 'Write $-3$ in polar form, with $0 \le \theta < 2\pi$.'
            answer: '3(cos(pi) + i sin(pi))'
            answer_contract: {"kind":"function","vars":["i"]}
            solution_sketch: 'The modulus is $r = \sqrt{9 + 0} = 3$. The point $(-3, 0)$ lies on the negative real axis, so the angle is $\theta = \pi$.'
          - problem: 'The point $3 - 3i$ is plotted in the complex plane. What is its argument, in radians with $0 \le \theta < 2\pi$?'
            answer: '7pi/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $(3, -3)$ is in Quadrant IV, on the line at $45^\circ$ below the real axis. So the angle is $2\pi - \frac{\pi}{4} = \frac{7\pi}{4}$.'
      - id: kp2
        name: 'Polar to rectangular form'
        key_prerequisites: [unit-circle]
        constraints: 'r a small integer; θ a unit-circle angle; answers exact in a + bi form with radicals allowed'
        exemplars:
          - problem: 'Convert $4\left(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\right)$ to rectangular form.'
            answer: '2 + 2sqrt(3)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\cos\frac{\pi}{3} = \frac{1}{2}$ and $\sin\frac{\pi}{3} = \frac{\sqrt{3}}{2}$. Multiply both by $4$: the real part is $2$ and the imaginary part is $2\sqrt{3}$.'
          - problem: 'Convert $2\left(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\right)$ to rectangular form.'
            answer: '-sqrt(2) + sqrt(2)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\cos\frac{3\pi}{4} = -\frac{\sqrt{2}}{2}$ and $\sin\frac{3\pi}{4} = \frac{\sqrt{2}}{2}$. Multiply both by $2$: the real part is $-\sqrt{2}$ and the imaginary part is $\sqrt{2}$.'
          - problem: 'Convert $2\left(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\right)$ to rectangular form.'
            answer: 'sqrt(3) + i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The real part is $x = r\cos\theta = 2 \cdot \frac{\sqrt{3}}{2} = \sqrt{3}$. The imaginary part is $y = r\sin\theta = 2 \cdot \frac{1}{2} = 1$. So the number is $\sqrt{3} + i$.'
          - problem: 'A drone flies $8$ m in a direction $\frac{\pi}{6}$ radians north of east. Write its displacement as a complex number, with east as the real axis and north as the imaginary axis.'
            answer: '4sqrt(3) + 4i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The displacement is $8\left(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\right)$. With $\cos\frac{\pi}{6} = \frac{\sqrt{3}}{2}$ and $\sin\frac{\pi}{6} = \frac{1}{2}$ this is $4\sqrt{3} + 4i$.'
          - problem: 'Convert $4\left(\cos\frac{4\pi}{3} + i\sin\frac{4\pi}{3}\right)$ to rectangular form.'
            answer: '-2 - 2sqrt(3)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The unit circle gives $\cos\frac{4\pi}{3} = -\frac{1}{2}$ and $\sin\frac{4\pi}{3} = -\frac{\sqrt{3}}{2}$. With $r = 4$ the real part is $-2$ and the imaginary part is $-2\sqrt{3}$.'
          - problem: 'An alternating voltage has amplitude $6$ volts and phase angle $\frac{2\pi}{3}$. Write it in rectangular form as a complex number.'
            answer: '-3 + 3sqrt(3)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The voltage is $6\left(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\right)$. Since $\cos\frac{2\pi}{3} = -\frac{1}{2}$ and $\sin\frac{2\pi}{3} = \frac{\sqrt{3}}{2}$, it equals $-3 + 3\sqrt{3}i$.'
          - problem: 'Convert $4\left(\cos 150^\circ + i\sin 150^\circ\right)$ to rectangular form.'
            answer: '-2sqrt(3) + 2i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The unit circle gives $\cos 150^\circ = -\frac{\sqrt{3}}{2}$ and $\sin 150^\circ = \frac{1}{2}$. With $r = 4$ the real part is $-2\sqrt{3}$ and the imaginary part is $2$.'
          - problem: 'Convert $3\left(\cos\left(-\frac{\pi}{2}\right) + i\sin\left(-\frac{\pi}{2}\right)\right)$ to rectangular form.'
            answer: '-3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The unit circle gives $\cos\left(-\frac{\pi}{2}\right) = 0$ and $\sin\left(-\frac{\pi}{2}\right) = -1$. With $r = 3$ the real part is $0$ and the imaginary part is $-3$, so the number is $-3i$.'
          - problem: 'Lea converts $6\left(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\right)$ and writes $-\frac{\sqrt{3}}{2} + \frac{1}{2}i$. What is the correct rectangular form?'
            answer: '-3sqrt(3) + 3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Lea forgot the factor $r = 6$. Multiplying both parts by $6$ gives the real part $6 \cdot \left(-\frac{\sqrt{3}}{2}\right) = -3\sqrt{3}$ and the imaginary part $6 \cdot \frac{1}{2} = 3$.'
      - id: kp3
        name: 'Powers via De Moivre'
        key_prerequisites: [complex-plane-modulus-conjugate, unit-circle]
        constraints: 'exponents 3-8; final answers in rectangular form'
        try_first:
          problem: 'Compute $\left(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\right)^2$.'
          answer_contract: {"kind":"exact"}
          answer: '-1'
          reveal: 'Since $\cos\frac{\pi}{2} + i\sin\frac{\pi}{2} = i$, the square is $i^2 = -1$, the number at angle $\pi = 2 \cdot \frac{\pi}{2}$. Raising to a power multiplies the angle, and this is De Moivre''s theorem.'
        exemplars:
          - problem: 'Use De Moivre''s theorem to compute $(1 + i)^8$.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $1 + i = \sqrt{2}\left(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\right)$. The eighth power has modulus $(\sqrt{2})^8 = 16$ and angle $8 \cdot \frac{\pi}{4} = 2\pi$, so the result is $16$.'
          - problem: 'Compute $\left(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\right)^3$.'
            answer: 'i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus is $1$, so De Moivre''s theorem only triples the angle: $3 \cdot \frac{\pi}{6} = \frac{\pi}{2}$. Then $\cos\frac{\pi}{2} + i\sin\frac{\pi}{2} = i$.'
          - problem: 'Compute $(1 - \sqrt{3}\,i)^3$.'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $1 - \sqrt{3}\,i = 2\left(\cos\frac{5\pi}{3} + i\sin\frac{5\pi}{3}\right)$. The cube has modulus $2^3 = 8$ and angle $5\pi$, which is the same as $\pi$, so the result is $-8$.'
          - problem: 'A game character starts at the point $1$ in the complex plane. Each move multiplies its position by $1 + i$. Where is the character after $5$ moves?'
            answer: '-4 - 4i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $5$ moves the position is $(1 + i)^5$. The modulus is $(\sqrt{2})^5 = 4\sqrt{2}$ and the angle is $5 \cdot \frac{\pi}{4} = \frac{5\pi}{4}$, which gives $-4 - 4i$.'
          - problem: 'Use De Moivre''s theorem to compute $(\sqrt{3} + i)^3$.'
            answer: '8i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\sqrt{3} + i = 2\left(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\right)$. The cube has modulus $2^3 = 8$ and angle $3 \cdot \frac{\pi}{6} = \frac{\pi}{2}$, so the result is $8i$.'
          - problem: 'A spinner starts at the point $1$. Each tick multiplies its position by $\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}$, which turns it through $\frac{\pi}{6}$ radians. Where is the spinner after $4$ ticks?'
            answer: '-1/2 + (sqrt(3)/2)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $4$ ticks the position is $\left(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\right)^4$, which has angle $4 \cdot \frac{\pi}{6} = \frac{2\pi}{3}$. So the spinner is at $-\frac{1}{2} + \frac{\sqrt{3}}{2}i$.'
          - problem: 'Use De Moivre''s theorem to compute $(-1 + i)^5$.'
            answer: '4 - 4i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-1 + i = \sqrt{2}\left(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\right)$. The fifth power has modulus $4\sqrt{2}$ and angle $\frac{15\pi}{4}$, which is $\frac{7\pi}{4}$, so the result is $4 - 4i$.'
          - problem: 'Max computes $(1 + i)^3$ as $1^3 + i^3 = 1 - i$. What is the correct value?'
            answer: '-2 + 2i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Max cannot cube the parts separately. By De Moivre, $(1 + i)^3$ has modulus $(\sqrt{2})^3 = 2\sqrt{2}$ and angle $\frac{3\pi}{4}$, so it equals $2\sqrt{2}\left(-\frac{\sqrt{2}}{2} + \frac{\sqrt{2}}{2}i\right) = -2 + 2i$.'
          - problem: 'Use De Moivre''s theorem to compute $(1 - i)^4$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $1 - i = \sqrt{2}\left(\cos\left(-\frac{\pi}{4}\right) + i\sin\left(-\frac{\pi}{4}\right)\right)$. The fourth power has modulus $(\sqrt{2})^4 = 4$ and angle $-\pi$, so the result is $-4$.'
          - problem: 'Find the modulus of $(3 + 4i)^4$.'
            answer: '625'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus of a power is the power of the modulus. Since $|3 + 4i| = 5$, the modulus of $(3 + 4i)^4$ is $5^4 = 625$.'
    diagnostic_exemplar:
      problem: 'Use De Moivre''s theorem to compute $(1 + i)^6$ in rectangular form.'
      answer: "-8i"
      solution_sketch: '$1 + i = \sqrt{2}\operatorname{cis}\frac{\pi}{4}$, so $(1+i)^6 = 8\operatorname{cis}\frac{3\pi}{2} = -8i$.'
    anki_seeds:
      - front: "De Moivre's theorem: [r(cos θ + i sin θ)]ⁿ = ?"
        back: "rⁿ (cos nθ + i sin nθ)"
        type: basic

  - id: nth-roots-complex-numbers
    name: nth Roots of Complex Numbers
    core: false                # supplemental: terminal capstone of the complex-number branch
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: complex-polar-form-de-moivre
        weight: 0.8
        key: true
      - id: unit-circle
        weight: 0.4
      - id: rational-exponents
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Square roots of a complex number'
        key_prerequisites: [complex-polar-form-de-moivre]
        constraints: 'moduli that are perfect squares; answers in rectangular form'
        exemplars:
          - problem: 'Find both square roots of $-9$.'
            answer: '3i, -3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-9$ in polar form: modulus $9$ and angle $\pi$. The roots have modulus $\sqrt{9} = 3$ and angles $\frac{\pi}{2}$ and $\frac{3\pi}{2}$, which gives $3i$ and $-3i$.'
          - problem: 'Find both square roots of $-7 + 24i$.'
            answer: '3 + 4i, -3 - 4i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus of $-7 + 24i$ is $25$, so each square root has modulus $5$. One root is $3 + 4i$, because $(3 + 4i)^2 = 9 - 16 + 24i = -7 + 24i$, and the other root is its negative $-3 - 4i$.'
          - problem: 'Find both square roots of $7 - 24i$.'
            answer: '4 - 3i, -4 + 3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus of $7 - 24i$ is $25$, so each square root has modulus $5$. Since $(4 - 3i)^2 = 16 - 9 - 24i = 7 - 24i$, one root is $4 - 3i$ and the other is its negative $-4 + 3i$.'
          - problem: 'A transformation of the complex plane multiplies every point by a number $z$. Applying it twice must multiply every point by $-16$, which scales it by $16$ and turns it through a half-turn. Which values of $z$ do this?'
            answer: '4i, -4i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Applying the transformation twice multiplies by $z^2$, so $z^2 = -16$. The number $-16$ has modulus $16$ and angle $\pi$, so $z = 4i$ or $z = -4i$.'
          - problem: 'Find both square roots of $-7 - 24i$.'
            answer: '3 - 4i, -3 + 4i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus of $-7 - 24i$ is $25$, so each square root has modulus $5$. Since $(3 - 4i)^2 = 9 - 16 - 24i = -7 - 24i$, one root is $3 - 4i$ and the other is its negative $-3 + 4i$.'
          - problem: 'An engineer needs a complex gain $g$ such that applying it twice gives $g^2 = 8 + 6i$. Which values of $g$ work?'
            answer: '3 + i, -3 - i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus of $8 + 6i$ is $10$, so $g$ has modulus $\sqrt{10}$. Since $(3 + i)^2 = 9 - 1 + 6i = 8 + 6i$, the gains are $3 + i$ and $-3 - i$.'
          - problem: 'Find both square roots of $119 - 120i$.'
            answer: '12 - 5i, -12 + 5i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The modulus of $119 - 120i$ is $169$, so each square root has modulus $13$. Since $(12 - 5i)^2 = 144 - 25 - 120i = 119 - 120i$, one root is $12 - 5i$ and the other is $-12 + 5i$.'
      - id: kp2
        name: 'Cube roots'
        key_prerequisites: [complex-polar-form-de-moivre, unit-circle]
        constraints: 'radicands ±8, ±27, 64, 27i and -1; spacing 2π/3 between roots'
        exemplars:
          - problem: 'Find all cube roots of $8$.'
            answer: '2, -1 + sqrt(3)i, -1 - sqrt(3)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $8 = 8\left(\cos 0 + i\sin 0\right)$. The cube roots have modulus $2$ and angles $0$, $\frac{2\pi}{3}$ and $\frac{4\pi}{3}$, which are $2$, $-1 + \sqrt{3}i$ and $-1 - \sqrt{3}i$.'
          - problem: 'Find all cube roots of $-27$.'
            answer: '(3+3sqrt(3)i)/2, -3, (3-3sqrt(3)i)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-27 = 27\left(\cos\pi + i\sin\pi\right)$. The cube roots have modulus $3$ and angles $\frac{\pi}{3}$, $\pi$ and $\frac{5\pi}{3}$, which give $\frac{3}{2} + \frac{3\sqrt{3}}{2}i$, $-3$ and $\frac{3}{2} - \frac{3\sqrt{3}}{2}i$.'
          - problem: 'Find all cube roots of $-1$.'
            answer: '-1, (1+sqrt(3)i)/2, (1-sqrt(3)i)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-1 = 1\left(\cos\pi + i\sin\pi\right)$. The cube roots have modulus $1$ and angles $\frac{\pi}{3}$, $\pi$ and $\frac{5\pi}{3}$, which give $\frac{1}{2} + \frac{\sqrt{3}}{2}i$, $-1$ and $\frac{1}{2} - \frac{\sqrt{3}}{2}i$.'
          - problem: 'Three lamps stand at equal spacing around a circular ring of radius $3$ m. In a complex plane with its origin at the centre of the ring, one lamp is at the point $3$. Where are the other two lamps?'
            answer: '(-3+3sqrt(3)i)/2, (-3-3sqrt(3)i)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The lamps are at the cube roots of $27$, which have modulus $3$ and angles $0$, $\frac{2\pi}{3}$ and $\frac{4\pi}{3}$. The other two lamps are at $-\frac{3}{2} + \frac{3\sqrt{3}}{2}i$ and $-\frac{3}{2} - \frac{3\sqrt{3}}{2}i$.'
          - problem: 'Solve $z^3 = 64$.'
            answer: '4, -2 + 2sqrt(3)i, -2 - 2sqrt(3)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $64 = 64\left(\cos 0 + i\sin 0\right)$. The solutions have modulus $4$ and angles $0$, $\frac{2\pi}{3}$ and $\frac{4\pi}{3}$, which give $4$, $-2 + 2\sqrt{3}i$ and $-2 - 2\sqrt{3}i$.'
          - problem: 'A regular triangle is drawn in a circle of radius $4$ with its centre at the origin of the complex plane. One vertex is at $-4$. What are the other two vertices?'
            answer: '2 + 2sqrt(3)i, 2 - 2sqrt(3)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The vertices are the cube roots of $-64$, which have modulus $4$ and angles $\frac{\pi}{3}$, $\pi$ and $\frac{5\pi}{3}$. The vertex at angle $\pi$ is $-4$, so the other two are $2 + 2\sqrt{3}i$ and $2 - 2\sqrt{3}i$.'
          - problem: 'Find all cube roots of $27i$.'
            answer: '(3sqrt(3)+3i)/2, (-3sqrt(3)+3i)/2, -3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $27i = 27\left(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\right)$. The cube roots have modulus $3$ and angles $\frac{\pi}{6}$, $\frac{5\pi}{6}$ and $\frac{3\pi}{2}$, which give $\frac{3\sqrt{3}}{2} + \frac{3}{2}i$, $-\frac{3\sqrt{3}}{2} + \frac{3}{2}i$ and $-3i$.'
          - problem: 'Rui finds that $-2$ is a cube root of $-8$ and stops. What are the other two cube roots of $-8$?'
            answer: '1 + sqrt(3)i, 1 - sqrt(3)i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A nonzero number has three cube roots, equally spaced around a circle. The cube roots of $-8$ have modulus $2$ and angles $\frac{\pi}{3}$, $\pi$ and $\frac{5\pi}{3}$, so the others are $1 + \sqrt{3}i$ and $1 - \sqrt{3}i$.'
      - id: kp3
        name: 'Fourth roots and roots of unity'
        key_prerequisites: [complex-polar-form-de-moivre, unit-circle]
        constraints: 'radicands 1, 16, 81 and -4; root counts and spacing 2π/n for n <= 12'
        exemplars:
          - problem: 'Find all fourth roots of $16$.'
            answer: '2, 2i, -2, -2i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $16 = 16\left(\cos 0 + i\sin 0\right)$. The fourth roots have modulus $2$ and angles $0$, $\frac{\pi}{2}$, $\pi$ and $\frac{3\pi}{2}$, which are $2$, $2i$, $-2$ and $-2i$.'
          - problem: 'The sixth roots of unity are the solutions of $z^6 = 1$. They are equally spaced around the unit circle. What is the angle between neighbouring roots, in radians?'
            answer: 'pi/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sixth roots of unity are $e^{2\pi i k/6}$ for $k = 0$ to $5$, so there are six equally spaced roots. Neighbouring roots differ by $\frac{2\pi}{6} = \frac{\pi}{3}$.'
          - problem: 'Solve $z^4 = 81$.'
            answer: '3, 3i, -3, -3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $81 = 81\left(\cos 0 + i\sin 0\right)$. The solutions have modulus $3$ and angles $\frac{2\pi k}{4}$ for $k = 0, 1, 2, 3$, which are $3$, $3i$, $-3$ and $-3i$.'
          - problem: 'The $12$ marks of a clock face lie at equal spacing on a circle, at the twelfth roots of unity. What is the angle at the centre between neighbouring marks, in radians?'
            answer: 'pi/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The twelve marks divide the full turn of $2\pi$ into twelve equal angles. Each angle is $\frac{2\pi}{12} = \frac{\pi}{6}$.'
          - problem: 'Which fourth root of $81$ lies on the positive imaginary axis?'
            answer: '3i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fourth roots of $81$ are $3$, $3i$, $-3$ and $-3i$, found by taking angles $\frac{2\pi k}{4}$. The root on the positive imaginary axis has real part $0$ and imaginary part $3$, so it is $3i$.'
          - problem: 'Solve $z^4 = -4$.'
            answer: '1 + i, -1 + i, -1 - i, 1 - i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-4 = 4\left(\cos\pi + i\sin\pi\right)$. The solutions have modulus $\sqrt{2}$ and angles $\frac{\pi}{4}$, $\frac{3\pi}{4}$, $\frac{5\pi}{4}$ and $\frac{7\pi}{4}$, which give $1 + i$, $-1 + i$, $-1 - i$ and $1 - i$.'
          - problem: 'Eight lamps stand at equal spacing around a circular pond. In a complex plane with its origin at the centre of the pond, they are at the eighth roots of unity. What is the angle at the centre between neighbouring lamps, in radians?'
            answer: 'pi/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The eight lamps divide the full turn of $2\pi$ into eight equal angles. Each angle is $\frac{2\pi}{8} = \frac{\pi}{4}$.'
          - problem: 'Solve $z^4 = 1$.'
            answer: '1, i, -1, -i'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The solutions are the fourth roots of unity, $e^{2\pi i k/4}$ for $k = 0, 1, 2, 3$. These are $1$, $i$, $-1$ and $-i$, four points equally spaced on the unit circle.'
    diagnostic_exemplar:
      problem: 'Find all cube roots of $27$.'
      answer: "3, -3/2 + (3√3/2)i, -3/2 - (3√3/2)i"
      solution_sketch: 'Write $27 = 27\operatorname{cis} 0$: the cube roots all have modulus $\sqrt[3]{27} = 3$ and arguments $0, \frac{2\pi}{3}, \frac{4\pi}{3}$ — three points equally spaced on the circle of radius $3$.'
