unit: sequences-series-precalc
course: precalculus
module: "Sequences & Series (Precalculus)"
topics:
  - id: arithmetic-sequences
    name: Arithmetic Sequences
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: evaluating-expressions
        weight: 0.6
        key: true
      - id: function-notation
        weight: 0.4
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
      - id: slope
        weight: 0.0            # conceptual only: common difference as constant rate
    knowledge_points:
      - id: kp1
        name: Common difference and next terms
        key_prerequisites: [integer-addition-subtraction]
        step_check:
          step: 'subtracting the first term from the second term'
          question: 'Why can the common difference be found from just the first two terms of an arithmetic sequence?'
          options:
            - 'The first two terms are always the two smallest numbers in the sequence'
            - 'The second term is always twice the first term, so subtracting gives d'
            - 'Neighboring terms always differ by the same amount, so one pair shows d'
            - 'Only the first pair is used because later pairs change as the terms grow'
          answer: 'Neighboring terms always differ by the same amount, so one pair shows d'
          why: 'The difference between neighboring terms is constant, so any one pair gives d. Here 12 - 7 = 5 and 17 - 12 = 5.'
        exemplars:
          - problem: 'What is the common difference of the arithmetic sequence $5, 9, 13, \ldots$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract a term from the term after it: $9 - 5 = 4$. Check with the next pair: $13 - 9 = 4$, so the difference is the same each time. The common difference is $4$.'
          - problem: 'What is the next term of the arithmetic sequence $20, 14, 8, \ldots$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms drop by the same amount each time: $14 - 20 = -6$. Add this difference to the last term: $8 + (-6) = 2$. The next term is $2$.'
          - problem: 'What is the fifth term of the arithmetic sequence $55, 47, 39, \ldots$?'
            answer: '23'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common difference is $47 - 55 = -8$. The fourth term is $39 + (-8) = 31$, and the fifth term is $31 + (-8) = 23$.'
          - problem: 'A parking garage holds $40$ cars on level 1, $34$ on level 2 and $28$ on level 3, and the pattern continues. How many cars does level 6 hold?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counts drop by $6$ from level to level, so the common difference is $-6$. Level 4 holds $22$ cars, level 5 holds $16$ cars, and level 6 holds $10$ cars.'
          - problem: 'An arithmetic sequence has first term $-3$ and common difference $-5$. What is its third term?'
            answer: '-13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Start from $-3$ and add the common difference once for each new term. The second term is $-3 + (-5) = -8$. The third term is $-8 + (-5) = -13$.'
          - problem: 'A sunflower is $4$ cm tall at the end of week 1, $7$ cm at the end of week 2 and $10$ cm at the end of week 3, and it grows by the same amount each week. By how many centimetres does it grow each week?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The heights form an arithmetic sequence, and the growth each week is the common difference. Subtract neighboring heights: $7 - 4 = 3$ and $10 - 7 = 3$. The sunflower grows $3$ cm each week.'
          - problem: 'Sam says the common difference of $30, 24, 18, \ldots$ is $6$. What is the correct common difference?'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam subtracted in the wrong order. The common difference is the later term minus the earlier term: $24 - 30 = -6$. The terms get smaller, so the difference is negative.'
          - problem: 'Mia saves $15$ dollars in week 1, $22$ dollars in week 2 and $29$ dollars in week 3, and her weekly saving keeps growing by the same amount. How much does she save in week 5?'
            answer: '43'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The common difference is $22 - 15 = 7$ dollars. Week 4 is $29 + 7 = 36$ dollars, and week 5 is $36 + 7 = 43$ dollars.'
        constraints: 'integer first terms and differences, |d| <= 9, include a decreasing sequence; each question asks for one number: the common difference, the next term or a later term'
      - id: kp2
        name: The explicit formula
        key_prerequisites: [evaluating-expressions, function-notation]
        step_check:
          step: 'Plug the values into the explicit formula'
          question: 'Why does the formula for the 15th term multiply d by 14 and not by 15?'
          options:
            - 'The formula always uses one less than n to keep the answer small'
            - 'The 15th term has position 14, because the count of terms starts at zero'
            - 'The common difference is added once for each term except the 15th term'
            - 'The first term is already listed, so only 14 steps of d are added'
          answer: 'The first term is already listed, so only 14 steps of d are added'
          why: 'Going from the 1st term to the 15th term takes 14 steps, and each step adds d. That gives 5 + 14 * 4 = 61.'
        exemplars:
          - problem: 'Find the 10th term of the arithmetic sequence $3, 7, 11, \ldots$'
            answer: '39'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $3$ and the common difference is $4$. The 10th term adds $9$ differences to the first term: $3 + 9 \cdot 4 = 39$.'
          - problem: 'An arithmetic sequence has first term $2$ and common difference $5$. Write a formula for its $n$th term $a_n$.'
            answer: '5n - 3'
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: 'Use $a_n = a_1 + (n - 1)d$ with $a_1 = 2$ and $d = 5$. This gives $a_n = 2 + 5(n - 1) = 5n - 3$. A check: $n = 1$ gives $2$ and $n = 2$ gives $7$.'
          - problem: 'An arithmetic sequence has first term $8$ and common difference $5$. What is its 13th term?'
            answer: '68'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $a_1 = 8$, $d = 5$ and $n = 13$ into $a_n = a_1 + (n - 1)d$. This gives $8 + 12 \cdot 5 = 8 + 60 = 68$.'
          - problem: 'An arithmetic sequence has first term $-3$ and common difference $4$. Write a formula for $a_n$.'
            answer: '4n - 7'
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: 'Substitute $a_1 = -3$ and $d = 4$ into $a_n = a_1 + (n - 1)d$. This gives $-3 + 4(n - 1) = -3 + 4n - 4 = 4n - 7$.'
          - problem: 'An arithmetic sequence is defined by $a_n = 11 - 2(n - 1)$. What is the 10th term?'
            answer: '-7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $n = 10$ into the formula: $a_{10} = 11 - 2(10 - 1) = 11 - 18$. The 10th term is $-7$.'
          - problem: 'A theater has $20$ seats in the first row, and each row after the first has $3$ more seats than the row before. How many seats are in the 12th row?'
            answer: '53'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The seat counts form an arithmetic sequence with $a_1 = 20$ and $d = 3$. For row 12, $a_{12} = 20 + 11 \cdot 3 = 20 + 33 = 53$.'
          - problem: 'The lowest rung of a ladder is $30$ cm above the ground, and each rung is $25$ cm higher than the one below it. How high above the ground is the 9th rung?'
            answer: '230'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The rung heights form an arithmetic sequence with $a_1 = 30$ and $d = 25$. The 9th rung is $8$ steps above the first: $30 + 8 \cdot 25 = 30 + 200 = 230$ cm.'
          - problem: 'The terms of an arithmetic sequence start $100, 92, 84, \ldots$ What is the 20th term?'
            answer: '-52'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common difference is $92 - 100 = -8$. The 20th term is $100 + 19 \cdot (-8) = 100 - 152 = -52$.'
        constraints: 'a_n = a_1 + (n-1)d; n up to 50; the answer is a term, or a formula in n for a given first term and difference'
      - id: kp3
        name: Recover d or n from given terms
        key_prerequisites: [evaluating-expressions]
        step_check:
          step: 'Subtract 3 from both sides'
          question: 'Why subtract 3 from both sides of 15 = 3 + 4d before dividing by 4?'
          options:
            - 'It removes the first term because the first term is never used for d'
            - 'It leaves 4d alone on one side, so dividing by 4 then gives d'
            - 'It changes the equation so that d is multiplied by 3 instead of 4'
            - 'It turns 4d into d, so no division is needed afterwards'
          answer: 'It leaves 4d alone on one side, so dividing by 4 then gives d'
          why: 'The term 3 is added to 4d, so subtracting 3 undoes it. Then 12 = 4d and dividing by 4 gives d = 3.'
        exemplars:
          - problem: 'An arithmetic sequence has $a_1 = 4$ and $a_7 = 22$. What is the common difference?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Seven terms means $6$ steps of $d$ from the first term, so $22 = 4 + 6d$. Then $6d = 18$ and $d = 3$.'
          - problem: 'The arithmetic sequence $1, 5, 9, \ldots$ has a term equal to $41$. Which term number is it?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common difference is $4$, so $41 = 1 + 4(n - 1)$. Then $4(n - 1) = 40$, so $n - 1 = 10$ and $n = 11$.'
          - problem: 'An arithmetic sequence has $a_1 = 6$ and $a_8 = 34$. What is its common difference?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $a_8 = a_1 + 7d$, so $34 = 6 + 7d$. Then $7d = 28$ and $d = 4$.'
          - problem: 'A theater''s first row has $10$ seats, and each later row has $3$ more seats than the row before. One row has $46$ seats. Which row is it?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The seat counts satisfy $46 = 10 + 3(n - 1)$. Then $3(n - 1) = 36$, so $n - 1 = 12$ and $n = 13$. It is row $13$.'
          - problem: 'The odometer of a car reads $120$ km at the end of day 1 and $505$ km at the end of day 8. The car travels the same distance each day. How far does it travel each day?'
            answer: '55'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The readings form an arithmetic sequence, and the distance per day is the common difference. From day 1 to day 8 there are $7$ steps, so $505 = 120 + 7d$. Then $7d = 385$ and $d = 55$ km.'
          - problem: 'A charity sells $12$ tickets on day 1, and on each later day it sells $5$ more tickets than on the day before. On which day does it sell $87$ tickets?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The daily sales satisfy $87 = 12 + 5(n - 1)$. Then $5(n - 1) = 75$, so $n - 1 = 15$ and $n = 16$. It is day $16$.'
          - problem: 'An arithmetic sequence has $a_1 = 50$ and $a_6 = 20$. What is its common difference?'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Five steps lead from $a_1$ to $a_6$, so $20 = 50 + 5d$. Then $5d = -30$ and $d = -6$.'
          - problem: 'Is $100$ a term of the arithmetic sequence $7, 12, 17, \ldots$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "correct", "right", "yes it is", "it is", "it is a term"], ["no", "incorrect", "wrong", "no it is not", "it is not", "not a term"]]}
            solution_sketch: 'The common difference is $5$, so $100 = 7 + 5(n - 1)$ would need $5(n - 1) = 93$. Then $n - 1 = 18.6$, which is not a whole number, so $100$ is not a term.'
          - problem: 'In an arithmetic sequence $a_3 = 8$ and $a_{11} = 40$. What is the common difference?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From the 3rd term to the 11th term there are $8$ steps of $d$, so $40 - 8 = 8d$. Then $8d = 32$ and $d = 4$.'
        constraints: 'give a_1 (or one earlier term) and one later term, or a target value; the unknown d or n is found from a_n = a_1 + (n-1)d'
    diagnostic_exemplar:
      problem: 'An arithmetic sequence has $a_1 = 5$ and $a_9 = 37$. Find $d$.'
      answer: "4"
      solution_sketch: '$37 = 5 + 8d$, so $d = 4$.'
    anki_seeds:
      - front: "Explicit formula for an arithmetic sequence?"
        back: "a_n = a_1 + (n - 1)d"
        type: basic

  - id: arithmetic-series
    name: Arithmetic Series
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: arithmetic-sequences
        weight: 0.8
        key: true
      - id: summation-notation
        weight: 0.5
        key: true
      - id: multi-digit-multiplication
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Sum with first and last term
        key_prerequisites: [arithmetic-sequences]
        step_check:
          step: 'Each pair of terms taken from opposite ends has the same total, $a_1 + a_n$'
          question: 'Why does the sum of an arithmetic series equal n times (a_1 + a_n), divided by 2?'
          options:
            - 'The terms are added in n/2 groups, and each group totals the last term'
            - 'Half of the terms are removed because they repeat the other half'
            - 'The average of the first and last term is only an estimate, so 2 corrects it'
            - 'The n terms make n/2 pairs, and each pair adds up to a_1 + a_n'
          answer: 'The n terms make n/2 pairs, and each pair adds up to a_1 + a_n'
          why: 'Pair the first term with the last, the second with the second to last, and so on. Every pair has the total a_1 + a_n, and there are n/2 pairs.'
        exemplars:
          - problem: 'Compute $1 + 2 + 3 + \cdots + 100$.'
            answer: '5050'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Pair the terms from the two ends: $1 + 100$, $2 + 99$, and so on, each pair totals $101$. There are $50$ pairs, so the sum is $50 \cdot 101 = 5050$. The formula gives the same value: $\frac{100(1 + 100)}{2} = 5050$.'
          - problem: 'Compute $3 + 7 + 11 + \cdots + 39$.'
            answer: '210'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common difference is $4$, so $39 = 3 + 4(n - 1)$ gives $n = 10$ terms. The sum is $\frac{10(3 + 39)}{2} = 5 \cdot 42 = 210$.'
          - problem: 'An arithmetic series has $16$ terms, first term $6$ and last term $66$. What is its sum?'
            answer: '576'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $S_n = \frac{n(a_1 + a_n)}{2}$ with $n = 16$, $a_1 = 6$ and $a_n = 66$. Then $S_{16} = \frac{16(6 + 66)}{2} = 8 \cdot 72 = 576$.'
          - problem: 'An arithmetic series has first term $8$, common difference $6$ and last term $98$. What is its sum?'
            answer: '848'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First find the number of terms from $98 = 8 + 6(n - 1)$. This gives $6(n - 1) = 90$, so $n = 16$. Then $S_{16} = \frac{16(8 + 98)}{2} = 8 \cdot 106 = 848$.'
          - problem: 'An arithmetic series has first term $10$, last term $88$ and sum $490$. How many terms does it have?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute into $S_n = \frac{n(a_1 + a_n)}{2}$: $490 = \frac{n(10 + 88)}{2} = 49n$. Divide both sides by $49$ to get $n = 10$.'
          - problem: 'A theater has $21$ rows. The first row has $15$ seats and the last row has $75$ seats, and the seat counts form an arithmetic sequence. How many seats does the theater have in total?'
            answer: '945'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The row sizes form an arithmetic series with $n = 21$, $a_1 = 15$ and $a_n = 75$. The total is $\frac{21(15 + 75)}{2} = \frac{21 \cdot 90}{2} = 945$ seats.'
          - problem: 'Pipes are stacked in layers. The bottom layer has $25$ pipes and each layer above it has one pipe fewer than the layer below, up to a top layer of $1$ pipe. How many pipes are in the stack?'
            answer: '325'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The layer counts $25, 24, \ldots, 1$ form an arithmetic series with $25$ terms. The total is $\frac{25(25 + 1)}{2} = \frac{25 \cdot 26}{2} = 325$ pipes.'
          - problem: 'A runner plans to run $4$ km on the first day and $32$ km on the last day, increasing the distance by the same amount each day. The plan covers $270$ km in total. How many days does the plan last?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The distances form an arithmetic series with $a_1 = 4$ and $a_n = 32$. Then $270 = \frac{n(4 + 32)}{2} = 18n$, so $n = 15$ days.'
        constraints: 'S_n = n(a_1 + a_n)/2; n <= 100; the number of terms is given or found from the first term, last term and common difference; one question asks for the number of terms from the sum'
      - id: kp2
        name: Sum without the last term
        key_prerequisites: [arithmetic-sequences]
        step_check:
          step: 'Plug the values into the formula'
          question: 'Why does the formula for S_10 contain the factor 9 in 2 * 3 + 9 * 4?'
          options:
            - 'It takes 9 steps of d to get from the first term to the 10th term'
            - 'The number 9 is the second term of the sequence, so it is used with d'
            - 'The sum of 10 terms always has 9 gaps, and each gap is the first term'
            - 'The formula uses n minus one because the last term is not counted'
          answer: 'It takes 9 steps of d to get from the first term to the 10th term'
          why: 'The last term is a_10 = 3 + 9 * 4, because 9 steps of d lead from a_1 to a_10. The formula uses 2a_1 + (n - 1)d, which equals a_1 + a_n.'
        exemplars:
          - problem: 'Find the sum of the first $20$ terms of $5, 8, 11, \ldots$'
            answer: '670'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $5$ and the common difference is $3$. Then $S_{20} = \frac{20}{2}(2 \cdot 5 + 19 \cdot 3) = 10 \cdot 67 = 670$.'
          - problem: 'Find the sum of the first $15$ terms of $2, 4, 6, \ldots$'
            answer: '240'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $2$ and the common difference is $2$. Then $S_{15} = \frac{15}{2}(2 \cdot 2 + 14 \cdot 2) = \frac{15 \cdot 32}{2} = 240$.'
          - problem: 'Find the sum of the first $18$ terms of the arithmetic sequence that starts $7, 11, 15, \ldots$'
            answer: '738'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common difference is $4$. Use $S_n = \frac{n}{2}(2a_1 + (n - 1)d)$: $S_{18} = 9(2 \cdot 7 + 17 \cdot 4) = 9(14 + 68) = 9 \cdot 82 = 738$.'
          - problem: 'A theater has $24$ rows. The first row has $12$ seats, and each later row has $3$ more seats than the row before it. How many seats does the theater have in total?'
            answer: '1116'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The seat counts form an arithmetic series with $n = 24$, $a_1 = 12$ and $d = 3$. Then $S_{24} = 12(2 \cdot 12 + 23 \cdot 3) = 12 \cdot 93 = 1116$ seats.'
          - problem: 'An arithmetic series has first term $3$ and common difference $4$. The sum of its first $n$ terms is $300$. What is $n$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $300 = \frac{n}{2}(2 \cdot 3 + 4(n - 1)) = n(2n + 1)$. This gives $2n^2 + n - 300 = 0$, which factors as $(n - 12)(2n + 25) = 0$. Only $n = 12$ is a positive whole number.'
          - problem: 'An arithmetic series has first term $10$ and $8$ terms. Its sum is $276$. What is the common difference?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $276 = \frac{8}{2}(2 \cdot 10 + 7d) = 4(20 + 7d)$. Divide by $4$ to get $69 = 20 + 7d$, so $7d = 49$ and $d = 7$.'
          - problem: 'Lena puts $5$ dollars in a jar in week 1, $8$ dollars in week 2, $11$ dollars in week 3, and so on, adding $3$ dollars more each week. How much has she put in the jar after $26$ weeks?'
            answer: '1105'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The weekly amounts form an arithmetic series with $a_1 = 5$ and $d = 3$. Then $S_{26} = 13(2 \cdot 5 + 25 \cdot 3) = 13 \cdot 85 = 1105$ dollars.'
          - problem: 'A tank is drained for $15$ minutes. In the first minute $120$ litres leave the tank, and in each later minute $4$ litres less leave than in the minute before. How many litres leave the tank in total?'
            answer: '1380'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The amounts form an arithmetic series with $a_1 = 120$ and $d = -4$. Then $S_{15} = \frac{15}{2}(2 \cdot 120 + 14 \cdot (-4)) = \frac{15}{2} \cdot 184 = 1380$ litres.'
        constraints: 'S_n = n(2a_1 + (n-1)d)/2; the last term is not given; n <= 30; one question asks for n (a quadratic with an integer root) and one for d'
      - id: kp3
        name: Sums in sigma notation
        key_prerequisites: [summation-notation, arithmetic-sequences]
        step_check:
          step: 'The terms of $\sum_{k=1}^{15}(2k+1)$ are $3, 5, 7, \ldots, 31$, and they differ by the constant $2$'
          question: 'Why can the arithmetic series formula find the value of the sum of 2k + 1 from k = 1 to 15?'
          options:
            - 'The sum has 15 terms, and any sum with 15 terms is arithmetic'
            - 'The terms 3, 5, 7, ... differ by a constant 2, so they are arithmetic'
            - 'The index k goes up by 1 each time, and that makes the terms arithmetic'
            - 'The sigma sign always means that the terms are added in pairs'
          answer: 'The terms 3, 5, 7, ... differ by a constant 2, so they are arithmetic'
          why: 'A series is arithmetic when consecutive terms differ by a constant. Here each term is 2 more than the one before, so S = 15(3 + 31)/2 = 255.'
        exemplars:
          - problem: 'Evaluate $\sum_{k=1}^{15} (2k + 1)$.'
            answer: '255'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms are $3, 5, 7, \ldots, 31$, an arithmetic series with $15$ terms. Its sum is $\frac{15(3 + 31)}{2} = \frac{15 \cdot 34}{2} = 255$. The split $2 \cdot 120 + 15 = 255$ gives the same value.'
          - problem: 'Sam evaluates $\sum_{k=1}^{10} (3k - 2)$ as $3 \cdot 55 - 2 = 163$. What is the correct value?'
            answer: '145'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam subtracted $2$ only once, but the $-2$ is part of each of the $10$ terms. The correct sum is $3 \cdot 55 - 2 \cdot 10 = 165 - 20 = 145$.'
          - problem: 'Find the value of $\sum_{k=1}^{20} (3k + 2)$.'
            answer: '670'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terms start at $5$ and end at $62$, with common difference $3$. The sum is $\frac{20(5 + 62)}{2} = 10 \cdot 67 = 670$.'
          - problem: 'Compute $\sum_{j=1}^{18} (5j - 4)$.'
            answer: '783'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $1$ and the last term is $5 \cdot 18 - 4 = 86$. The terms form an arithmetic series, so the sum is $\frac{18(1 + 86)}{2} = 9 \cdot 87 = 783$.'
          - problem: 'In a display of cans, row $k$ from the top holds $2k + 1$ cans. How many cans are in the first $12$ rows?'
            answer: '168'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $\sum_{k=1}^{12} (2k + 1)$. The rows hold $3, 5, \ldots, 25$ cans, so the sum is $\frac{12(3 + 25)}{2} = 6 \cdot 28 = 168$ cans.'
          - problem: 'A theater has $18$ rows, and row $k$ has $4k + 6$ seats. How many seats does the theater have?'
            answer: '792'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $\sum_{k=1}^{18} (4k + 6)$. The first row has $10$ seats and the last row has $78$ seats, so the sum is $\frac{18(10 + 78)}{2} = 9 \cdot 88 = 792$.'
          - problem: 'Evaluate $\sum_{k=3}^{10} (2k - 1)$.'
            answer: '96'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The index starts at $3$, so the first term is $2 \cdot 3 - 1 = 5$ and the last term is $2 \cdot 10 - 1 = 19$. There are $8$ terms, so the sum is $\frac{8(5 + 19)}{2} = 96$.'
          - problem: 'Evaluate $\sum_{k=4}^{20} 3k$.'
            answer: '612'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $12$ and the last term is $60$. The index runs from $4$ to $20$, which is $17$ terms, so the sum is $\frac{17(12 + 60)}{2} = 17 \cdot 36 = 612$.'
        constraints: 'sums of (ak + b) with small integer a, b; the index runs from 1 or a small lower limit to n <= 20; evaluated exactly; some items in context'
