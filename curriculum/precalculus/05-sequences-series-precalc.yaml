      problem: 'Evaluate $\sum_{k=1}^{12} (4k + 1)$.'
      answer: "324"
      solution_sketch: '$4 \cdot \frac{12 \cdot 13}{2} + 12 = 312 + 12 = 324$.'
    anki_seeds:
      - front: "Sum of an arithmetic series with n terms?"
        back: "S_n = n(a_1 + a_n)/2"
        type: basic

  - id: geometric-sequences
    name: Geometric Sequences
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: arithmetic-sequences
        weight: 0.5
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.5
        key: true
      - id: multiplying-fractions
        weight: 0.4
      - id: negative-zero-exponents
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Common ratio and next terms
        key_prerequisites: [multiplying-fractions]
        step_check:
          step: 'dividing the second term by the first term'
          question: 'Why is the common ratio found by dividing a term by the term before it, and not by subtracting?'
          options:
            - 'Each term is r times the one before, so division undoes the product'
            - 'Dividing is the only operation that works on negative numbers'
            - 'The ratio is always the larger term minus the smaller term, then halved'
            - 'A quotient shows how many terms come before it, and that count is r'
          answer: 'Each term is r times the one before, so division undoes the product'
          why: 'A geometric sequence multiplies by r at every step, so a term divided by the term before it gives r. Here -8 / 4 = -2 and 16 / (-8) = -2.'
        exemplars:
          - problem: 'What is the common ratio of the geometric sequence $3, 6, 12, \ldots$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide a term by the term before it: $6 \div 3 = 2$. The next pair agrees, since $12 \div 6 = 2$. The common ratio is $2$.'
          - problem: 'What is the next term of the geometric sequence $81, 27, 9, \ldots$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common ratio is $27 \div 81 = \frac{1}{3}$. Multiply the last term by the ratio: $9 \cdot \frac{1}{3} = 3$.'
          - problem: 'What is the next term of the geometric sequence $2, -6, 18, \ldots$?'
            answer: '-54'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common ratio is $-6 \div 2 = -3$. Multiply the last term by the ratio: $18 \cdot (-3) = -54$.'
          - problem: 'What is the fifth term of the geometric sequence $64, -32, 16, \ldots$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common ratio is $-32 \div 64 = -\frac{1}{2}$. The fourth term is $16 \cdot (-\frac{1}{2}) = -8$, and the fifth term is $-8 \cdot (-\frac{1}{2}) = 4$.'
          - problem: 'The mass of a sand sample is the same fraction of the mass on the day before. Its masses on three days are $100$ g, $20$ g and $4$ g. What is its mass on the fourth day?'
            answer: '0.8'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The common ratio is $20 \div 100 = \frac{1}{5}$. The mass on day 4 is $4 \cdot \frac{1}{5} = \frac{4}{5} = 0.8$ g.'
          - problem: 'A colony has $200$ cells in hour 1, $600$ cells in hour 2 and $1800$ cells in hour 3, and it keeps growing by the same factor. By what factor does the colony grow each hour?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factor is the common ratio, found by dividing a count by the count before it: $600 \div 200 = 3$. Check: $1800 \div 600 = 3$.'
          - problem: 'Sam says the common ratio of $48, 24, 12, \ldots$ is $24$. What is the correct common ratio?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam subtracted, but a ratio comes from division. The common ratio is $24 \div 48 = \frac{1}{2}$, and $12 \div 24 = \frac{1}{2}$ agrees.'
          - problem: 'Is the sequence $3, 6, 12, 18, \ldots$ geometric, arithmetic or neither?'
            answer: 'neither'
            answer_contract: {"kind": "label", "options": [["geometric", "it is geometric", "a geometric sequence"], ["arithmetic", "it is arithmetic", "an arithmetic sequence"], ["neither", "neither one", "it is neither", "none"]]}
            solution_sketch: 'The differences are $3, 6, 6$, which are not constant, so the sequence is not arithmetic. The ratios are $2, 2, \frac{3}{2}$, which are not constant, so it is not geometric. It is neither.'
        constraints: 'integer or simple fractional ratios; include a negative ratio; each question asks for one number: the common ratio, the next term or a later term; one item classifies a sequence'
      - id: kp2
        name: The explicit formula
        key_prerequisites: [exponent-product-quotient-rules]
        step_check:
          step: 'Simplify the exponent'
          question: 'Why is the exponent in a_4 = 3 * 4^(4-1) equal to 3 and not 4?'
          options:
            - 'The ratio is applied once less because the sequence starts at index 0'
            - 'Each factor of r after the first is counted twice, so 4 is cut down to 3'
            - 'The first term has no factor of r, so the 4th term has 3 factors of r'
            - 'The exponent is always one less than r so that the value stays small'
          answer: 'The first term has no factor of r, so the 4th term has 3 factors of r'
          why: 'The first term is a_1 itself. Each step to the next term multiplies by r, so reaching the 4th term takes 3 multiplications.'
        exemplars:
          - problem: 'Find the 6th term of the geometric sequence with $a_1 = 5$ and $r = 2$.'
            answer: '160'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $a_n = a_1 \cdot r^{n-1}$ with $n = 6$. Then $a_6 = 5 \cdot 2^5 = 5 \cdot 32 = 160$.'
          - problem: 'Find the 5th term of the geometric sequence $4, 12, 36, \ldots$'
            answer: '324'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common ratio is $12 \div 4 = 3$. Then $a_5 = 4 \cdot 3^4 = 4 \cdot 81 = 324$.'
          - problem: 'A geometric sequence begins $2, 10, 50, \ldots$ What is its 4th term?'
            answer: '250'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common ratio is $10 \div 2 = 5$. Then $a_4 = 2 \cdot 5^3 = 2 \cdot 125 = 250$.'
          - problem: 'A geometric sequence has common ratio $r = 2$ and fifth term $a_5 = 48$. What is its first term?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute into $a_n = a_1 \cdot r^{n-1}$: $48 = a_1 \cdot 2^4 = 16a_1$. Divide both sides by $16$ to get $a_1 = 3$.'
          - problem: 'The geometric sequence $3, 9, 27, \ldots$ has a term equal to $729$. Which term is it?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $a_1 = 3$ and $r = 3$, so $729 = 3 \cdot 3^{n-1} = 3^n$. Since $729 = 3^6$, the term number is $n = 6$.'
          - problem: 'A ball is dropped from a height of $160$ cm. Each rebound reaches half the height of the one before. How high does the ball rise on the fifth rebound?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The first rebound reaches $80$ cm, so the rebound heights form a geometric sequence with $a_1 = 80$ and $r = \frac{1}{2}$. The fifth rebound reaches $80 \cdot (\frac{1}{2})^4 = \frac{80}{16} = 5$ cm.'
          - problem: 'A culture starts with $500$ bacteria, and the number triples every hour. How many bacteria are there after $4$ hours?'
            answer: '40500'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counts at hours $0, 1, 2, \ldots$ form a geometric sequence with $a_1 = 500$ and $r = 3$. After $4$ hours the count is the fifth term: $500 \cdot 3^4 = 500 \cdot 81 = 40500$.'
          - problem: 'The number of fish in a lake triples every year. In year 5 there are $810$ fish. How many fish were in the lake in year 1?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Four years of tripling lead from year 1 to year 5, so $810 = a_1 \cdot 3^4 = 81a_1$. Divide by $81$ to get $a_1 = 10$ fish.'
        constraints: 'a_n = a_1 * r^(n-1); keep values under 100000; the unknown may be a term, the first term or the term number'
      - id: kp3
        name: Recover the ratio from two terms
        key_prerequisites: [exponent-product-quotient-rules]
        step_check:
          step: 'Dividing $a_4$ by $a_1$ leaves $r^3$, because three factors of $r$ lie between them'
          question: 'Why does a_4 divided by a_1 equal r^3 and not r^4?'
          options:
            - 'Four terms are used, and one of them is always dropped from the power'
            - 'The ratio of two terms is always the cube root of the number of terms'
            - 'The terms a_1 and a_4 are cubed because they are the end terms'
            - 'It takes three steps from a_1 to a_4, and each step multiplies by r'
          answer: 'It takes three steps from a_1 to a_4, and each step multiplies by r'
          why: 'From a_1 to a_4 there are three steps, so a_4 = a_1 * r^3. Dividing by a_1 leaves r^3.'
        exemplars:
          - problem: 'A geometric sequence has $a_1 = 2$ and $a_4 = 54$. What is the common ratio?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three steps lead from $a_1$ to $a_4$, so $54 = 2r^3$. Then $r^3 = 27$ and $r = 3$.'
          - problem: 'A geometric sequence has $a_3 = 20$ and $a_5 = 80$. What are the possible values of the common ratio?'
            answer: '2, -2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two steps lead from $a_3$ to $a_5$, so $80 = 20r^2$. Then $r^2 = 4$, and both $r = 2$ and $r = -2$ work, because a square is positive for either sign.'
          - problem: 'A geometric sequence has $a_2 = 7$ and $a_5 = 56$. What is the common ratio?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three steps lead from $a_2$ to $a_5$, so $r^3 = \frac{56}{7} = 8$. The cube root of $8$ is $r = 2$.'
          - problem: 'A geometric sequence has $a_2 = 6$ and $a_4 = 54$. What are the possible values of the common ratio?'
            answer: '3, -3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two steps lead from $a_2$ to $a_4$, so $r^2 = \frac{54}{6} = 9$. Both $r = 3$ and $r = -3$ satisfy this.'
          - problem: 'A geometric sequence has $a_3 = 5$ and $a_6 = -40$. What is the common ratio?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three steps lead from $a_3$ to $a_6$, so $r^3 = \frac{-40}{5} = -8$. The cube root of $-8$ is $r = -2$.'
          - problem: 'A town had $4000$ people in 2020 and $13500$ people in 2023. Its population multiplies by the same factor each year. By what factor does it multiply each year?'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three years separate 2020 and 2023, so $13500 = 4000r^3$. Then $r^3 = \frac{13500}{4000} = \frac{27}{8}$ and $r = \frac{3}{2}$.'
          - problem: 'A machine is worth $12000$ dollars after one year and $6750$ dollars after three years. Its value is multiplied by the same positive factor each year. What is that factor?'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two years separate the two values, so $6750 = 12000r^2$. Then $r^2 = \frac{6750}{12000} = \frac{9}{16}$, and the positive factor is $r = \frac{3}{4}$.'
          - problem: 'Sam finds the common ratio of a geometric sequence with $a_2 = 12$ and $a_5 = 96$ by computing $96 \div 12 = 8$ and says $r = 8$. What is the correct common ratio?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient $96 \div 12 = 8$ equals $r^3$, because three steps lead from $a_2$ to $a_5$. So $r^3 = 8$ and the correct ratio is $r = 2$.'
        constraints: 'two given terms at most three positions apart; r is a small integer or a simple fraction; a gap of two positions gives two ratios unless the question says the terms are positive; answers are single values or a comma list'
    diagnostic_exemplar:
      problem: 'A geometric sequence has $a_1 = 3$ and $a_4 = 81$. Find $r$.'
      answer: "3"
      solution_sketch: '$81 = 3r^3$, so $r^3 = 27$ and $r = 3$.'
    anki_seeds:
      - front: "Explicit formula for a geometric sequence?"
        back: "a_n = a_1 · r^(n-1)"
        type: basic

  - id: geometric-series-finite-infinite
    name: Finite and Infinite Geometric Series
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: geometric-sequences
        weight: 0.8
        key: true
      - id: summation-notation
        weight: 0.4
        key: true
      - id: adding-subtracting-fractions
        weight: 0.3
      - id: fraction-decimal-conversion
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Finite geometric sums
        key_prerequisites: [geometric-sequences]
        step_check:
          step: 'Plug the values into the formula'
          question: 'Why does the sum formula for the first n terms contain r^n in the numerator?'
          options:
            - 'The last term is a_1 r^n, so the formula uses the power of the last term'
            - 'Subtracting r times the sum cancels the middle terms and leaves 1 - r^n'
            - 'The first term already contains r, so one more power is needed'
            - 'The ratio is applied n times because the sum starts from the zeroth term'
          answer: 'Subtracting r times the sum cancels the middle terms and leaves 1 - r^n'
          why: 'Subtract r times S_n from S_n. All middle terms cancel and S_n(1 - r) = a_1(1 - r^n), which gives the formula.'
        exemplars:
          - problem: 'Compute $2 + 6 + 18 + 54 + 162$.'
            answer: '242'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $2$, the ratio is $3$ and there are $5$ terms. Then $S_5 = \frac{2(3^5 - 1)}{3 - 1} = \frac{2 \cdot 242}{2} = 242$.'
          - problem: 'Find the sum of the first $6$ terms of the geometric sequence $1, 2, 4, \ldots$'
            answer: '63'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $1$ and the ratio is $2$. Then $S_6 = \frac{1(2^6 - 1)}{2 - 1} = 64 - 1 = 63$.'
          - problem: 'Find the sum of the first $7$ terms of the geometric sequence $5, 10, 20, \ldots$'
            answer: '635'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $5$ and the ratio is $2$. Then $S_7 = \frac{5(1 - 2^7)}{1 - 2} = \frac{5 \cdot (-127)}{-1} = 635$.'
          - problem: 'Evaluate $\sum_{k=1}^{6} 4 \cdot 3^{k-1}$.'
            answer: '1456'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $4$ and the ratio is $3$, with $6$ terms. Then $S_6 = \frac{4(1 - 3^6)}{1 - 3} = \frac{4 \cdot (-728)}{-2} = 1456$.'
          - problem: 'A geometric series has first term $7$, common ratio $\frac{1}{2}$ and $5$ terms. What is its sum?'
            answer: '217/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $S_n = \frac{a_1(1 - r^n)}{1 - r}$ with $a_1 = 7$, $r = \frac{1}{2}$ and $n = 5$. Then $S_5 = \frac{7 \cdot \frac{31}{32}}{\frac{1}{2}} = \frac{217}{16}$.'
          - problem: 'A rumor spreads through a school. On day 1 one student hears it, and each day three times as many students hear it for the first time as on the day before. How many students have heard it by the end of day 6?'
            answer: '364'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The numbers of new listeners are $1, 3, 9, \ldots$, a geometric sequence with ratio $3$. Over $6$ days the total is $\frac{1(3^6 - 1)}{3 - 1} = \frac{728}{2} = 364$ students.'
          - problem: 'A savings plan puts $100$ dollars in the account in year 1, and each later year it puts in twice the amount of the year before. How much has been put in after $7$ years?'
            answer: '12700'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The yearly deposits form a geometric sequence with $a_1 = 100$ and $r = 2$. Then $S_7 = \frac{100(2^7 - 1)}{2 - 1} = 100 \cdot 127 = 12700$ dollars.'
          - problem: 'A fund collects $3$ dollars on day 1, and on each later day it collects twice as much as on the day before. On which day does the total collected first reach $381$ dollars?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total after $n$ days is $\frac{3(2^n - 1)}{2 - 1} = 3(2^n - 1)$. Setting this equal to $381$ gives $2^n - 1 = 127$, so $2^n = 128$ and $n = 7$.'
          - problem: 'Sam finds the sum of the first $6$ terms of $3, 6, 12, \ldots$ as $\frac{3(1 - 2^5)}{1 - 2} = 93$. What is the correct sum?'
            answer: '189'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam used the exponent $5$, but the exponent in the formula is the number of terms, which is $6$. The correct sum is $\frac{3(1 - 2^6)}{1 - 2} = \frac{3 \cdot (-63)}{-1} = 189$.'
        constraints: 'S_n = a_1(1 - r^n)/(1 - r); n <= 8 unless the sum is a given and n is asked; sums are given as lists of terms, in sigma notation or in words'
      - id: kp2
        name: Infinite geometric sums
        key_prerequisites: [geometric-sequences, adding-subtracting-fractions]
        step_check:
          step: 'Check if the series converges by verifying $|r| < 1$'
          question: 'Why must |r| be less than 1 before the formula S = a/(1 - r) is used?'
          options:
            - 'A ratio below 1 makes every term positive, which the formula needs'
            - 'Only fractions with a denominator below 10 can be summed by the formula'
            - 'The formula divides by 1 - r, and r above 1 makes the sum negative'
            - 'If |r| < 1 the terms shrink toward 0, so the sums settle on one value'
          answer: 'If |r| < 1 the terms shrink toward 0, so the sums settle on one value'
          why: 'When |r| < 1 the terms get closer to 0 and the sums approach one number. When |r| is 1 or more, the terms do not shrink and the sums grow without limit or jump about.'
        exemplars:
          - problem: 'Compute $8 + 4 + 2 + 1 + \cdots$'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $8$ and the ratio is $\frac{1}{2}$. Since $|r| < 1$, the sum is $\frac{8}{1 - \frac{1}{2}} = \frac{8}{\frac{1}{2}} = 16$.'
          - problem: 'Compute $9 - 3 + 1 - \frac{1}{3} + \cdots$'
            answer: '27/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $9$ and the ratio is $-\frac{1}{3}$, so $|r| < 1$. The sum is $\frac{9}{1 + \frac{1}{3}} = \frac{9}{\frac{4}{3}} = \frac{27}{4}$.'
          - problem: 'Does the infinite series $3 + 6 + 12 + 24 + \cdots$ have a finite sum?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "correct", "right", "it does", "yes it does", "it has a finite sum"], ["no", "incorrect", "wrong", "it does not", "no it does not", "no finite sum"]]}
            solution_sketch: 'The common ratio is $2$, and $|2| > 1$. The terms keep growing, so the partial sums grow without limit and the series has no finite sum.'
          - problem: 'What is the sum of the infinite geometric series $5 + \frac{5}{3} + \frac{5}{9} + \frac{5}{27} + \cdots$?'
            answer: '15/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first term is $5$ and the ratio is $\frac{1}{3}$, so $|r| < 1$. The sum is $\frac{5}{1 - \frac{1}{3}} = \frac{5}{\frac{2}{3}} = \frac{15}{2}$.'
          - problem: 'An infinite geometric series begins with the terms $10, 2, \frac{2}{5}, \frac{2}{25}$. What is its sum?'
            answer: '25/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each term is one fifth of the term before it, so $a = 10$ and $r = \frac{1}{5}$. The sum is $\frac{10}{1 - \frac{1}{5}} = \frac{10}{\frac{4}{5}} = \frac{25}{2}$.'
          - problem: 'An infinite geometric series starts with the terms $6, -2, \frac{2}{3}, -\frac{2}{9}$. What is its sum?'
            answer: '9/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each term is $-\frac{1}{3}$ times the term before it, so $a = 6$ and $r = -\frac{1}{3}$. The sum is $\frac{6}{1 + \frac{1}{3}} = \frac{6}{\frac{4}{3}} = \frac{9}{2}$.'
          - problem: 'A ball is dropped from $12$ m. After each bounce it rises to $\frac{2}{3}$ of the height it fell. What is the total distance the ball travels before it comes to rest?'
            answer: '60'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The ball falls $12$ m once. After that, each rebound height is travelled up and down: the heights $8, \frac{16}{3}, \ldots$ have sum $\frac{8}{1 - \frac{2}{3}} = 24$. The total is $12 + 2 \cdot 24 = 60$ m.'
          - problem: 'The first swing of a pendulum is $30$ cm long, and each later swing is $0.8$ times as long as the swing before. What total distance does the pendulum travel before it stops?'
            answer: '150'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The swing lengths form an infinite geometric series with $a = 30$ and $r = 0.8$. Since $|r| < 1$, the total is $\frac{30}{1 - 0.8} = \frac{30}{0.2} = 150$ cm.'
          - problem: 'An infinite geometric series has common ratio $\frac{1}{3}$ and sum $24$. What is its first term?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sum satisfies $24 = \frac{a}{1 - \frac{1}{3}} = \frac{3a}{2}$. Multiply by $\frac{2}{3}$ to get $a = 16$.'
        constraints: '|r| < 1 for the sums; one item asks whether a sum exists; the unknown may also be the first term'
      - id: kp3
        name: Repeating decimals as geometric series
        key_prerequisites: [geometric-sequences]
        step_check:
          step: 'Express the repeating decimal as a geometric series'
          question: 'Why is the common ratio 1/100 and not 1/10 for the decimal 0.121212...?'
          options:
            - 'The block has two digits, so each repeat moves two places: 1/100'
            - 'The numerator 12 is larger than 10, so the ratio must use 100'
            - 'Every repeating decimal has the ratio 1/100 because it repeats forever'
            - 'The ratio equals the first term 12/100, rounded to a single power of ten'
          answer: 'The block has two digits, so each repeat moves two places: 1/100'
          why: 'Each repeat of the two-digit block 12 sits two places further right, so it is 1/100 of the block before it.'
        exemplars:
          - problem: 'Use a geometric series to write $0.\overline{7}$ as a fraction.'
            answer: '7/9'
            answer_contract: {"kind": "required_form", "form": "reduced_fraction"}
            solution_sketch: 'Write $0.\overline{7} = \frac{7}{10} + \frac{7}{100} + \cdots$, a geometric series with $a = \frac{7}{10}$ and $r = \frac{1}{10}$. The sum is $\frac{7/10}{1 - 1/10} = \frac{7/10}{9/10} = \frac{7}{9}$.'
          - problem: 'Use a geometric series to write $0.\overline{36}$ as a fraction.'
            answer: '4/11'
            answer_contract: {"kind": "required_form", "form": "reduced_fraction"}
            solution_sketch: 'Write $0.\overline{36} = \frac{36}{100} + \frac{36}{10000} + \cdots$, with $a = \frac{36}{100}$ and $r = \frac{1}{100}$. The sum is $\frac{36/100}{99/100} = \frac{36}{99} = \frac{4}{11}$.'
          - problem: 'A calculator shows the repeating decimal $0.\overline{27}$. Use a geometric series to find the fraction this number equals.'
            answer: '3/11'
            answer_contract: {"kind": "required_form", "form": "reduced_fraction"}
            solution_sketch: 'Write $0.\overline{27} = \frac{27}{100} + \frac{27}{10000} + \cdots$, with $a = \frac{27}{100}$ and $r = \frac{1}{100}$. The sum is $\frac{27/100}{99/100} = \frac{27}{99} = \frac{3}{11}$.'
          - problem: 'Write $0.1\overline{6}$ as a fraction.'
            answer: '1/6'
            answer_contract: {"kind": "required_form", "form": "reduced_fraction"}
            solution_sketch: 'Split the decimal as $0.1 + 0.0\overline{6}$. The repeating part is $\frac{6}{100} + \frac{6}{1000} + \cdots$, with $a = \frac{6}{100}$ and $r = \frac{1}{10}$, so it equals $\frac{6/100}{9/10} = \frac{1}{15}$. Then $\frac{1}{10} + \frac{1}{15} = \frac{1}{6}$.'
          - problem: 'A tank is $0.\overline{45}$ full. What fraction of the tank is full?'
            answer: '5/11'
            answer_contract: {"kind": "required_form", "form": "reduced_fraction"}
            solution_sketch: 'Write $0.\overline{45} = \frac{45}{100} + \frac{45}{10000} + \cdots$, with $a = \frac{45}{100}$ and $r = \frac{1}{100}$. The sum is $\frac{45}{99} = \frac{5}{11}$ of the tank.'
          - problem: 'Use a geometric series to decide whether $0.\overline{9}$ equals $1$.'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "correct", "right", "yes it is", "it is", "they are equal"], ["no", "incorrect", "wrong", "no it is not", "it is not", "not equal"]]}
            solution_sketch: 'Write $0.\overline{9} = \frac{9}{10} + \frac{9}{100} + \cdots$, with $a = \frac{9}{10}$ and $r = \frac{1}{10}$. The sum is $\frac{9/10}{1 - 1/10} = \frac{9/10}{9/10} = 1$, so the two numbers are equal.'
          - problem: 'A runner covers $0.\overline{72}$ of a lap in one minute. What fraction of a lap is that?'
            answer: '8/11'
            answer_contract: {"kind": "required_form", "form": "reduced_fraction"}
            solution_sketch: 'Write $0.\overline{72} = \frac{72}{100} + \frac{72}{10000} + \cdots$, with $a = \frac{72}{100}$ and $r = \frac{1}{100}$. The sum is $\frac{72}{99} = \frac{8}{11}$ of a lap.'
          - problem: 'What is the sum of the infinite series $\frac{7}{100} + \frac{7}{10000} + \frac{7}{1000000} + \cdots$?'
            answer: '7/99'
            answer_contract: {"kind": "required_form", "form": "reduced_fraction"}
            solution_sketch: 'The first term is $\frac{7}{100}$ and the ratio is $\frac{1}{100}$. The sum is $\frac{7/100}{1 - 1/100} = \frac{7/100}{99/100} = \frac{7}{99}$.'
        constraints: 'one- or two-digit repeating blocks, and one decimal with a non-repeating digit before the block; first term block/10 or block/100 with r = 1/10 or 1/100; fractions in lowest terms'
    diagnostic_exemplar:
      problem: 'Use a geometric series to write $0.\overline{45}$ as a fraction.'
      answer: "5/11"
      solution_sketch: '$\frac{45}{100} + \frac{45}{10000} + \cdots = \frac{45/100}{1 - 1/100} = \frac{45}{99} = \frac{5}{11}$.'
    anki_seeds:
      - front: "Sum of an infinite geometric series (when |r| < 1)?"
        back: "S = a_1 / (1 - r)"
        type: basic
      - front: "An infinite geometric series converges exactly when..."
        back: "|r| < 1"
        type: basic

  - id: recursive-sequences
    name: Recursive Sequences
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: arithmetic-sequences
        weight: 0.6
        key: true
      - id: geometric-sequences
        weight: 0.5
        key: true
      - id: function-notation
        weight: 0.4
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Generate terms from a recursion
        key_prerequisites: [evaluating-expressions]
        step_check:
          step: 'Start with the initial term'
          question: 'Why must a recursive definition give the first term as well as the rule?'
          options:
            - 'The first term tells how many terms the sequence has'
            - 'The rule only turns a term into the next one, so it needs a start'
            - 'The first term is the only term that the rule is allowed to change'
            - 'Without a first term the rule cannot be written in terms of n'
          answer: 'The rule only turns a term into the next one, so it needs a start'
          why: 'The rule a_n = a_{n-1} + 4 needs a known a_{n-1} to produce a_n. The initial term a_1 = 3 supplies the first known value.'
        exemplars:
          - problem: 'Let $a_1 = 2$ and $a_n = a_{n-1} + 3$ for $n \ge 2$. Find $a_4$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Apply the rule one term at a time: $a_2 = 2 + 3 = 5$, $a_3 = 5 + 3 = 8$ and $a_4 = 8 + 3 = 11$.'
          - problem: 'Let $a_1 = 1$ and $a_n = 2a_{n-1} + 1$ for $n \ge 2$. Find $a_4$.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Double the previous term and add $1$ each time: $a_2 = 2 \cdot 1 + 1 = 3$, $a_3 = 2 \cdot 3 + 1 = 7$ and $a_4 = 2 \cdot 7 + 1 = 15$.'
          - problem: 'Let $a_1 = 5$ and $a_n = 2a_{n-1} - 1$ for $n \ge 2$. Find $a_5$.'
            answer: '65'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each term is twice the previous term minus $1$. The terms are $a_2 = 9$, $a_3 = 17$, $a_4 = 33$ and $a_5 = 65$.'
          - problem: 'Let $a_1 = 10$ and $a_n = a_{n-1} - 6$ for $n \ge 2$. Find $a_5$.'
            answer: '-14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $6$ from the previous term each time: $a_2 = 4$, $a_3 = -2$, $a_4 = -8$ and $a_5 = -14$.'
          - problem: 'In month 1 a library has $120$ books. Each month it keeps half of its books and buys $20$ new ones. How many books does it have in month 4?'
            answer: '50'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rule is $a_n = \frac{1}{2}a_{n-1} + 20$ with $a_1 = 120$. Then $a_2 = 60 + 20 = 80$, $a_3 = 40 + 20 = 60$ and $a_4 = 30 + 20 = 50$ books.'
          - problem: 'A tank holds $200$ litres at the start of day 1, and $15$ litres are used each day. How many litres are in the tank at the start of day 5?'
            answer: '140'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'Each day the amount drops by $15$, so $a_n = a_{n-1} - 15$ with $a_1 = 200$. The amounts are $185$, $170$, $155$ and $140$ litres at the starts of days 2, 3, 4 and 5.'
          - problem: 'A $256$ g sample of a substance loses half of its mass every hour. How many grams are left after $5$ hours?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The mass at the start is $a_1 = 256$, and each hour gives $a_n = \frac{1}{2}a_{n-1}$. After $5$ hours the mass is $a_6$: $128, 64, 32, 16, 8$, so $8$ g are left.'
          - problem: 'Let $a_1 = 4$ and $a_n = 3a_{n-1} - 2$ for $n \ge 2$. Sam finds $a_2 = 10$ and then computes $a_3 = 3 \cdot 4 - 2 = 10$ again. What is the correct value of $a_3$?'
            answer: '28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam used $a_1$ again, but the rule needs the previous term, which is $a_2 = 10$. The correct value is $a_3 = 3 \cdot 10 - 2 = 28$.'
        constraints: 'one-term recursions a_n = c*a_{n-1} + b or a_n = a_{n-1}/c + b with integer arithmetic; ask for a term at most 6 steps from the start; some items in words'
      - id: kp2
        name: Two-term recursions
        key_prerequisites: [evaluating-expressions]
        step_check:
          step: 'each term is the sum of the two before it'
          question: 'Why does a two-term recursion need two starting terms?'
          options:
            - 'Two terms are needed so that the rule can be applied twice'
            - 'The rule gives the average of two terms, so it needs a pair'
            - 'A single seed would make every later term equal to it'
            - 'The first new term, a_3, uses both a_2 and a_1'
          answer: 'The first new term, a_3, uses both a_2 and a_1'
          why: 'The rule builds a_3 from a_2 and a_1, so both must be known. With a_1 = 2 and a_2 = 5 this gives a_3 = 7.'
        exemplars:
          - problem: 'Let $a_1 = 1$, $a_2 = 1$ and $a_n = a_{n-1} + a_{n-2}$ for $n \ge 3$. Find $a_6$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each term is the sum of the two before it. The terms are $1, 1, 2, 3, 5, 8$, so $a_6 = 8$.'
          - problem: 'Let $a_1 = 3$, $a_2 = 1$ and $a_n = a_{n-1} - a_{n-2}$ for $n \ge 3$. Find $a_5$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract the term two places back from the previous term. Then $a_3 = 1 - 3 = -2$, $a_4 = -2 - 1 = -3$ and $a_5 = -3 - (-2) = -1$.'
          - problem: 'Let $a_1 = 2$, $a_2 = 5$ and $a_n = a_{n-1} + a_{n-2}$ for $n \ge 3$. Find $a_6$.'
            answer: '31'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Build the terms from the two seeds: $2, 5, 7, 12, 19, 31$. Each new term is the sum of the two terms before it, so $a_6 = 31$.'
          - problem: 'Let $a_1 = 5$, $a_2 = 2$ and $a_n = a_{n-1} - a_{n-2}$ for $n \ge 3$. Find $a_6$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Apply the rule in order: $a_3 = 2 - 5 = -3$, $a_4 = -3 - 2 = -5$, $a_5 = -5 - (-3) = -2$ and $a_6 = -2 - (-5) = 3$.'
          - problem: 'Let $a_1 = 1$, $a_2 = 3$ and $a_n = -a_{n-1} + a_{n-2}$ for $n \ge 3$. Find $a_5$.'
            answer: '-7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Apply the rule with its signs: $a_3 = -3 + 1 = -2$, $a_4 = -(-2) + 3 = 5$ and $a_5 = -5 + (-2) = -7$.'
          - problem: 'A gardener plants $4$ seeds on day 1 and $1$ seed on day 2. From day 3 on, she plants each day as many seeds as on the previous two days together. How many seeds does she plant on day 6?'
            answer: '17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rule is $a_n = a_{n-1} + a_{n-2}$ with $a_1 = 4$ and $a_2 = 1$. The daily numbers are $4, 1, 5, 6, 11, 17$, so day 6 has $17$ seeds.'
          - problem: 'A vine has $1$ branch in month 1 and $2$ branches in month 2. From month 3 on, the number of branches equals the sum of the numbers in the two months before. How many branches does the vine have in month 7?'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counts follow $a_n = a_{n-1} + a_{n-2}$ with $a_1 = 1$ and $a_2 = 2$. They are $1, 2, 3, 5, 8, 13, 21$, so month 7 has $21$ branches.'
          - problem: 'Let $a_1 = 3$, $a_2 = 2$ and $a_n = a_{n-1} + 2a_{n-2}$ for $n \ge 3$. Find $a_6$.'
            answer: '52'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Add the previous term and twice the term before it. Then $a_3 = 2 + 6 = 8$, $a_4 = 8 + 4 = 12$, $a_5 = 12 + 16 = 28$ and $a_6 = 28 + 24 = 52$.'
          - problem: 'A sequence satisfies $a_n = a_{n-1} + a_{n-2}$ for $n \ge 3$, with $a_2 = 5$ and $a_3 = 8$. What is $a_1$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rule at $n = 3$ says $a_3 = a_2 + a_1$, so $8 = 5 + a_1$. Subtract $5$ from both sides to get $a_1 = 3$.'
        constraints: 'recursions a_n = ±a_{n-1} ± c*a_{n-2} with small integer seeds and c = 1 or 2; ask for a term within 7 steps; one item runs backwards to a seed'
      - id: kp3
        name: Translate between recursive and explicit forms
        key_prerequisites: [arithmetic-sequences, geometric-sequences]
        step_check:
          step: 'Adding $7$ at every step makes the common difference $7$, so $a_n = 4 + 7(n - 1)$'
          question: 'Why does a_1 = 4 with a_n = a_{n-1} + 7 give the formula a_n = 7n - 3?'
          options:
            - 'The n - 1 steps after a_1 each add 7, so a_n = 4 + 7(n - 1)'
            - 'The rule adds 7 to a_1 only once, so a_n = 4 + 7 for every n'
            - 'Each step adds 7 and there are n steps, so a_n = 4 + 7n'
            - 'The rule multiplies by 7 at each step, giving a_n = 4 * 7^n'
          answer: 'The n - 1 steps after a_1 each add 7, so a_n = 4 + 7(n - 1)'
          why: 'From a_1 to a_n there are n - 1 steps, and each step adds 7. So a_n = 4 + 7(n - 1) = 7n - 3.'
        exemplars:
          - problem: 'Which of these defines the sequence $5, 8, 11, 14, \ldots$? (A) $a_1 = 5$ and $a_n = a_{n-1} + 3$. (B) $a_1 = 5$ and $a_n = 3a_{n-1}$. (C) $a_1 = 3$ and $a_n = a_{n-1} + 5$.'
            answer: 'a'
            answer_contract: {"kind": "label", "options": [["a", "option a", "(a)", "first one"], ["b", "option b", "(b)", "second one"], ["c", "option c", "(c)", "third one"]]}
            solution_sketch: 'The first term is $5$, so only (A) and (B) start correctly. Each term is $3$ more than the term before it, since $8 - 5 = 3$ and $11 - 8 = 3$, so the rule is (A). Rule (B) would give $5, 15, 45, \ldots$'
          - problem: 'A sequence is defined by $a_1 = 4$ and $a_n = a_{n-1} + 7$ for $n \ge 2$. Write a formula for $a_n$ in terms of $n$.'
            answer: '7n - 3'
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: 'The rule adds $7$ at each of the $n - 1$ steps after the first term. So $a_n = 4 + 7(n - 1) = 7n - 3$.'
          - problem: 'A sequence has $a_1 = 3$ and $a_n = 2a_{n-1}$ for $n \ge 2$. Find $a_{12}$.'
            answer: '6144'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each term is $2$ times the one before, so the sequence is geometric with $r = 2$. Then $a_{12} = 3 \cdot 2^{11} = 3 \cdot 2048 = 6144$.'
          - problem: 'A sequence has the explicit formula $a_n = 5n + 1$. What number must be added to $a_{n-1}$ to get $a_n$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Compare two neighboring terms: $a_n - a_{n-1} = (5n + 1) - (5(n - 1) + 1) = 5$. So $5$ is added at each step.'
          - problem: 'A gym charges $30$ dollars in month 1, and each later month costs $4$ dollars more than the month before. What does it cost in month 25?'
            answer: '126'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The costs follow $c_n = c_{n-1} + 4$, so they form an arithmetic sequence. Then $c_{25} = 30 + 24 \cdot 4 = 30 + 96 = 126$ dollars.'
          - problem: 'A geometric sequence has the explicit formula $a_n = 6 \cdot 4^{n-1}$. By what number is each term multiplied to give the next term?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $a_n = a_1 r^{n-1}$ the base of the power is the common ratio. Here the base is $4$, so each term is $4$ times the term before it.'
          - problem: 'A mouse population is $50$ in month 1, and each month it is three times the population of the month before. How many mice are there in month 6?'
            answer: '12150'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rule is $p_n = 3p_{n-1}$ with $p_1 = 50$, so the explicit formula is $p_n = 50 \cdot 3^{n-1}$. Then $p_6 = 50 \cdot 3^5 = 50 \cdot 243 = 12150$.'
          - problem: 'A sequence has $a_1 = 5$ and $a_n = r \cdot a_{n-1}$ for $n \ge 2$, and its fourth term is $40$. What is $r$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Three steps lead from $a_1$ to $a_4$, so $a_4 = 5r^3 = 40$. Then $r^3 = 8$ and $r = 2$.'
          - problem: 'A geometric sequence has $a_2 = 10$ and $a_4 = 40$, and its common ratio is positive. What is its first term?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two steps lead from $a_2$ to $a_4$, so $r^2 = \frac{40}{10} = 4$ and the positive ratio is $r = 2$. Since $a_2 = a_1 r$, the first term is $a_1 = \frac{10}{2} = 5$.'
          - problem: 'Sam says that $a_1 = 2$ with $a_n = a_{n-1} + 3$, and $a_n = 3n - 1$, define the same sequence. Is Sam right?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "correct", "right", "yes he is", "he is", "he is right"], ["no", "incorrect", "wrong", "no he is not", "he is not", "he is wrong"]]}
            solution_sketch: 'The recursion gives $2, 5, 8, \ldots$ with difference $3$. The formula gives $3 \cdot 1 - 1 = 2$, $3 \cdot 2 - 1 = 5$ and $3 \cdot 3 - 1 = 8$, so Sam is right.'
        constraints: 'arithmetic or geometric sequences only; a rule is chosen from three given definitions or an explicit formula in n is written; items also ask for a far term (so the explicit form is needed), the number added or the ratio; the item must test THIS KP: Translate between recursive and explicit forms'
    diagnostic_exemplar:
      problem: 'Let $a_1 = 2$, $a_2 = 3$, and $a_n = a_{n-1} + a_{n-2}$. Find $a_6$.'
      answer: "21"
      solution_sketch: '$2, 3, 5, 8, 13, 21$.'
    anki_seeds:
      - front: "A recursive definition of a sequence needs which two ingredients?"
        back: "Initial term(s) and a rule giving a_n from earlier terms."
        type: basic
