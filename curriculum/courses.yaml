courses:
  - id: foundations
    name: Foundations (Prealgebra through Precalculus core)
    order: 1
    mastery_floor:
      - single-digit-addition
      - multiplication-tables
      - place-value
  - id: proofs
    name: Methods of Proof
    # order 4: proofs consumes summation/factorial/multiplication-principle from
    # probability-statistics (3). gap_course_for() only descends into LOWER-ordered
    # courses, so a supplier must sort before its consumer.
    order: 4
    mastery_floor:
      - single-digit-addition
      - multiplication-tables
      - place-value
      - multi-digit-addition-subtraction
      - multi-digit-multiplication
      - long-division
      - order-of-operations
  - id: geometry
    name: Geometry
    order: 2
    mastery_floor_course: foundations
  # probability-statistics precedes proofs and precalculus: it supplies
  # `summation-notation`, `factorial-notation` and `multiplication-principle`, which
  # both consume. It must stay above geometry (geometric-probability-models).
  - id: probability-statistics
    name: Probability & Statistics
    order: 3
    mastery_floor_course: foundations
  - id: precalculus
    name: Precalculus
    order: 5
    mastery_floor_course: foundations
  - id: discrete-mathematics
    name: Discrete Mathematics
    order: 6
    mastery_floor_course: foundations
  - id: calculus-1
    name: Calculus I
    order: 7
    mastery_floor_course: foundations
  - id: calculus-2
    name: Calculus II
    order: 8
    mastery_floor_course: foundations
  - id: linear-algebra
    name: Linear Algebra
    order: 9
    mastery_floor_course: foundations
  - id: multivariable-calculus
    name: Multivariable Calculus
    order: 10
    mastery_floor_course: foundations
  - id: differential-equations
    name: Differential Equations
    order: 11
    mastery_floor_course: foundations
  - id: abstract-algebra
    name: Abstract Algebra
    order: 12
    mastery_floor_course: foundations
  - id: category-theory
    name: Category Theory
    order: 13
    mastery_floor_course: foundations
