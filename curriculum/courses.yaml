courses:
  - id: foundations
    name: Foundations (Prealgebra through Precalculus core)
    order: 1
    mastery_floor:
      - single-digit-addition
      - multiplication-tables
      - place-value
    reading:
      - title: "Prealgebra 2e"
        author: "OpenStax"
        access: "free"
        where: "https://openstax.org/details/books/prealgebra-2e"
        note: "The whole Foundations arithmetic and fractions path, with many worked examples."
      - title: "Elementary Algebra 2e"
        author: "OpenStax"
        access: "free"
        where: "https://openstax.org/details/books/elementary-algebra-2e"
        note: "Linear equations, graphs, systems and exponents, the second half of Foundations."
      - title: "Pre-algebra and Algebra 1"
        author: "Khan Academy"
        access: "free"
        where: "https://www.khanacademy.org/math/pre-algebra"
        note: "Short videos and practice when a worked example is not enough."
      - title: "Basic Mathematics"
        author: "Serge Lang"
        access: "book"
        where: "Chapters 1 to 4 (numbers, algebra, equations, functions)"
        note: "A short, exact treatment for a reader who wants the reasons, not only the steps."
  - id: proofs
    name: Methods of Proof
    # order 4: proofs consumes summation/factorial/multiplication-principle from
    # probability-statistics (3). gap_course_for() only descends into LOWER-ordered
    # courses, so a supplier must sort before its consumer.
    order: 4
    mastery_floor:
      - single-digit-addition
      - multiplication-tables
      - place-value
      - multi-digit-addition-subtraction
      - multi-digit-multiplication
      - long-division
      - order-of-operations
    reading:
      - title: "Book of Proof"
        author: "Richard Hammack"
        access: "free"
        where: "https://richardhammack.github.io/BookOfProof/"
        note: "Logic, sets, direct and indirect proof, induction and relations, in this course's order."
      - title: "How to Prove It"
        author: "Daniel J. Velleman"
        access: "book"
        where: "Chapters 1 to 6"
        note: "Builds proofs step by step from the logical form of the statement."
      - title: "An Infinite Descent into Pure Mathematics"
        author: "Clive Newstead"
        access: "free"
        where: "https://infinitedescent.xyz/"
        note: "Proof, sets, functions and number theory with full solutions."
      - title: "Mathematical Proofs: A Transition to Advanced Mathematics"
        author: "Gary Chartrand, Albert D. Polimeni and Ping Zhang"
        access: "book"
        where: "Chapters 2 to 7"
        note: "Many graded exercises on the proof methods."
  - id: geometry
    name: Geometry
    order: 2
    mastery_floor_course: foundations
    reading:
      - title: "Euclid's Elements, Book I"
        author: "Euclid, edited by David E. Joyce"
        access: "free"
        where: "https://mathcs.clarku.edu/~djoyce/elements/elements.html"
        note: "The original propositions behind congruence and parallel lines, with figures."
      - title: "Kiselev's Geometry, Book I: Planimetry"
        author: "A. P. Kiselev, translated by Alexander Givental"
        access: "book"
        where: "Chapters 1 to 4 (lines, triangles, circles, similarity)"
        note: "A clear classical textbook that proves what it states."
      - title: "High school geometry"
        author: "Khan Academy"
        access: "free"
        where: "https://www.khanacademy.org/math/geometry"
        note: "Transformations, congruence, similarity and circles with practice."
      - title: "\"Geometry: Seeing, Doing, Understanding\""
        author: "Harold R. Jacobs"
        access: "book"
        where: "Chapters 2 to 9"
        note: "Informal and visual, good before a proof-heavy course."
  # probability-statistics precedes proofs and precalculus: it supplies
  # `summation-notation`, `factorial-notation` and `multiplication-principle`, which
  # both consume. It must stay above geometry (geometric-probability-models).
  - id: probability-statistics
    name: Probability & Statistics
    order: 3
    mastery_floor_course: foundations
    reading:
      - title: "Introductory Statistics 2e"
        author: "OpenStax"
        access: "free"
        where: "https://openstax.org/details/books/introductory-statistics-2e"
        note: "Descriptive statistics, probability, distributions and hypothesis tests in course order."
      - title: "Introduction to Probability"
        author: "Joseph K. Blitzstein and Jessica Hwang"
        access: "free"
        where: "https://www.youtube.com/playlist?list=PL2SOU6wwxB0uwwH80KTQ6ht66KWxbzTIo"
        note: "The Stat 110 lectures on counting, conditional probability and distributions; the book PDF is free on the Stat 110 site."
      - title: "Introduction to Probability"
        author: "Charles M. Grinstead and J. Laurie Snell"
        access: "free"
        where: "https://math.dartmouth.edu/~prob/prob/prob.pdf"
        note: "Discrete and continuous probability with many exercises and simulations."
      - title: "Statistics and probability"
        author: "Khan Academy"
        access: "free"
        where: "https://www.khanacademy.org/math/statistics-probability"
        note: "Practice on sampling, chi-square and inference."
  - id: precalculus
    name: Precalculus
    order: 5
    mastery_floor_course: foundations
    reading:
      - title: "Precalculus 2e"
        author: "OpenStax"
        access: "free"
        where: "https://openstax.org/details/books/precalculus-2e"
        note: "Functions, polynomials, exponentials, logarithms and trigonometry with examples."
      - title: "Precalculus"
        author: "Carl Stitz and Jeff Zeager"
        access: "free"
        where: "https://stitz-zeager.com/"
        note: "A careful free text with answers to the odd exercises."
      - title: "Algebra and Trig review"
        author: "Paul Dawkins, Paul's Online Notes"
        access: "free"
        where: "https://tutorial.math.lamar.edu/"
        note: "Compact notes and problem sets on every precalculus skill calculus needs."
      - title: "Precalculus"
        author: "Khan Academy"
        access: "free"
        where: "https://www.khanacademy.org/math/precalculus"
        note: "Practice on composite functions, conic sections and vectors."
  - id: discrete-mathematics
    name: Discrete Mathematics
    order: 6
    mastery_floor_course: foundations
    reading:
      - title: "Discrete Mathematics: An Open Introduction"
        author: "Oscar Levin"
        access: "free"
        where: "https://discrete.openmathbooks.org/"
        note: "Counting, sequences, logic and graph theory with hints and solutions."
      - title: "Mathematics for Computer Science"
        author: "Eric Lehman, F. Thomson Leighton and Albert R. Meyer"
        access: "free"
        where: "https://courses.csail.mit.edu/6.042/spring18/mcs.pdf"
        note: "Proofs, induction, graphs and counting, as taught at MIT."
      - title: "Discrete Mathematics and Its Applications"
        author: "Kenneth H. Rosen"
        access: "book"
        where: "Chapters 1 to 6 and 10"
        note: "The standard reference with the largest exercise sets."
      - title: "Discrete Mathematics with Applications"
        author: "Susanna S. Epp"
        access: "book"
        where: "Chapters 2 to 9"
        note: "Slower and more careful than Rosen on logic and proof."
  - id: calculus-1
    name: Calculus I
    order: 7
    mastery_floor_course: foundations
    reading:
      - title: "Calculus Volume 1"
        author: "OpenStax"
        access: "free"
        where: "https://openstax.org/details/books/calculus-volume-1"
        note: "Limits, derivatives and the start of integrals in course order."
      - title: "Calculus I notes"
        author: "Paul Dawkins, Paul's Online Notes"
        access: "free"
        where: "https://tutorial.math.lamar.edu/Classes/CalcI/CalcI.aspx"
        note: "Worked problems on every derivative rule and application."
      - title: "Essence of Calculus"
        author: "Grant Sanderson, 3Blue1Brown"
        access: "free"
        where: "https://www.3blue1brown.com/topics/calculus"
        note: "Twelve videos that show why the rules are what they are."
      - title: "Calculus"
        author: "Gilbert Strang and Edwin Herman, MIT OpenCourseWare"
        access: "free"
        where: "https://ocw.mit.edu/courses/res-18-001-calculus-fall-2023/"
        note: "A full textbook and lectures that stay close to applications."
  - id: calculus-2
    name: Calculus II
    order: 8
    mastery_floor_course: foundations
    reading:
      - title: "Calculus Volume 2"
        author: "OpenStax"
        access: "free"
        where: "https://openstax.org/details/books/calculus-volume-2"
        note: "Integration techniques, applications, sequences and series."
      - title: "Calculus II notes"
        author: "Paul Dawkins, Paul's Online Notes"
        access: "free"
        where: "https://tutorial.math.lamar.edu/Classes/CalcII/CalcII.aspx"
        note: "The clearest practice set on integration techniques and series tests."
      - title: "Single Variable Calculus"
        author: "MIT OpenCourseWare 18.01"
        access: "free"
        where: "https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/"
        note: "Lectures and problem sets with solutions on integrals and series."
      - title: "Calculus"
        author: "Michael Spivak"
        access: "book"
        where: "Chapters 13 to 23 (integrals, series)"
        note: "For a reader who wants every theorem proved."
  - id: linear-algebra
    name: Linear Algebra
    order: 9
    mastery_floor_course: foundations
    reading:
      - title: "Essence of Linear Algebra"
        author: "Grant Sanderson, 3Blue1Brown"
        access: "free"
        where: "https://www.3blue1brown.com/topics/linear-algebra"
        note: "Vectors, transformations, determinants and eigenvectors as pictures."
      - title: "Linear Algebra"
        author: "Jim Hefferon"
        access: "free"
        where: "https://hefferon.net/linearalgebra/"
        note: "A free textbook with full solutions to every exercise."
      - title: "Introduction to Linear Algebra"
        author: "Gilbert Strang, with MIT OpenCourseWare 18.06"
        access: "book"
        where: "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/"
        note: "The lectures are free; the book is the standard first course."
      - title: "Linear Algebra Done Right"
        author: "Sheldon Axler"
        access: "free"
        where: "https://linear.axler.net/"
        note: "The abstract view of vector spaces and linear maps, fourth edition free online."
  - id: multivariable-calculus
    name: Multivariable Calculus
    order: 10
    mastery_floor_course: foundations
    reading:
      - title: "Calculus Volume 3"
        author: "OpenStax"
        access: "free"
        where: "https://openstax.org/details/books/calculus-volume-3"
        note: "Vectors, partial derivatives, multiple integrals and vector calculus."
      - title: "Calculus III notes"
        author: "Paul Dawkins, Paul's Online Notes"
        access: "free"
        where: "https://tutorial.math.lamar.edu/Classes/CalcIII/CalcIII.aspx"
        note: "Worked problems on gradients, Lagrange multipliers and line integrals."
      - title: "Multivariable Calculus"
        author: "MIT OpenCourseWare 18.02"
        access: "free"
        where: "https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/"
        note: "Lectures and problem sets with solutions."
      - title: "Vector Calculus"
        author: "Jerrold E. Marsden and Anthony Tromba"
        access: "book"
        where: "Chapters 2 to 8"
        note: "A rigorous second pass on the theorems of Green, Stokes and Gauss."
  - id: differential-equations
    name: Differential Equations
    order: 11
    mastery_floor_course: foundations
    reading:
      - title: "Notes on Diffy Qs"
        author: "Jiří Lebl"
        access: "free"
        where: "https://www.jirka.org/diffyqs/"
        note: "First-order, second-order, systems, Laplace and series methods, in course order."
      - title: "Differential Equations notes"
        author: "Paul Dawkins, Paul's Online Notes"
        access: "free"
        where: "https://tutorial.math.lamar.edu/Classes/DE/DE.aspx"
        note: "Worked problems on every solution method."
      - title: "Differential Equations"
        author: "MIT OpenCourseWare 18.03"
        access: "free"
        where: "https://ocw.mit.edu/courses/18-03sc-differential-equations-fall-2011/"
        note: "Lectures, recitations and problem sets with solutions."
      - title: "Elementary Differential Equations and Boundary Value Problems"
        author: "William E. Boyce and Richard C. DiPrima"
        access: "book"
        where: "Chapters 1 to 7"
        note: "The standard textbook with the widest exercise sets."
  - id: abstract-algebra
    name: Abstract Algebra
    order: 12
    mastery_floor_course: foundations
    reading:
      - title: "Abstract Algebra: Theory and Applications"
        author: "Thomas W. Judson"
        access: "free"
        where: "https://github.com/twjudson/aata"
        note: "Groups, rings and fields with Sage examples and exercises; the PDF builds from this source and is linked there."
      - title: "A Book of Abstract Algebra"
        author: "Charles C. Pinter"
        access: "book"
        where: "Chapters 2 to 20"
        note: "Short chapters and gentle exercises, the easiest first book."
      - title: "Contemporary Abstract Algebra"
        author: "Joseph A. Gallian"
        access: "book"
        where: "Parts 1 to 3"
        note: "Many computational examples on groups and rings."
      - title: "Abstract Algebra"
        author: "David S. Dummit and Richard M. Foote"
        access: "book"
        where: "Chapters 1 to 9 and 13"
        note: "The full reference for a reader who continues past this course."
  - id: category-theory
    name: Category Theory
    order: 13
    mastery_floor_course: foundations
    reading:
      - title: "Basic Category Theory"
        author: "Tom Leinster"
        access: "free"
        where: "https://arxiv.org/abs/1612.09375"
        note: "Categories, functors, natural transformations, adjoints, Yoneda and limits in 190 pages."
      - title: "Category Theory in Context"
        author: "Emily Riehl"
        access: "free"
        where: "https://emilyriehl.github.io/files/context.pdf"
        note: "The same ground at a higher level, with many examples from algebra and topology."
      - title: "Seven Sketches in Compositionality"
        author: "Brendan Fong and David I. Spivak"
        access: "free"
        where: "https://arxiv.org/abs/1803.05316"
        note: "Applied category theory with concrete examples before the abstractions."
      - title: "Category Theory"
        author: "Steve Awodey"
        access: "book"
        where: "Chapters 1 to 9"
        note: "A standard textbook with exercises after every chapter."
  - id: vbe-math
    name: Lithuanian Matura Math (VBE, extended)
    order: 14
    mastery_floor_course: foundations
    exam_weights: {numbers: 15, models: 50, geometry: 20, data: 15}
    reading:
      - title: "Mathematics general program, III and IV gymnasium classes (2023 text)"
        author: "Ministry of Education, Science and Sport of Lithuania"
        access: "free"
        where: "https://emokykla.lt/upload/files/2023/07/20/matematikos-bp-ir-pu-2023-01-31.pdf"
        note: "The program text. Use the rows of the extended course. Every checkpoint names its rows."
      - title: "Sample tasks and format sheets, mathematics state exam (A)"
        author: "National Agency for Education (NSA) of Lithuania"
        access: "free"
        where: "https://www.nsa.smsm.lt/pasiekimu-departamentas/egzaminai-ir-pasiekimu-patikrinimai/egzaminu-uzduociu-pavyzdziai/"
        note: "The sample tasks and the format sheets of each year: the two parts, the item forms, the points and the time. Read one before the first exam set."
      - title: "Past papers with grading instructions, mathematics (A)"
        author: "National Agency for Education (NSA) of Lithuania"
        access: "free"
        where: "https://www.nsa.smsm.lt/pasiekimu-departamentas/egzaminai-ir-pasiekimu-patikrinimai/valstybiniai-brandos-egzaminai/egzaminu-uzduotys/"
        note: "Real papers and the point scheme for each part. Solve a paper after the matching checkpoints."
      - title: "Formula sheet, mathematics (A) state exam"
        author: "National Agency for Education (NSA) of Lithuania"
        access: "free"
        where: "https://www.nsa.smsm.lt/wp-content/uploads/2026/06/MAT-VBE-A-formules.pdf"
        note: "Two pages. You get this sheet in the exam, so learn to use it and do not memorize it."
  - id: fundamentals-of-mathematics
    name: Fundamentals of Mathematics (Schröder)
    order: 15
    mastery_floor_course: foundations
    reading:
      - title: "Fundamentals of Mathematics: An Introduction to Proofs, Logic, Sets, and Numbers"
        author: "Bernd S. W. Schröder"
        access: "book"
        where: "Chapters 1 to 7"
        note: "The course follows this book section by section. Chapter 1 is logic, 2 is set theory, 3 is the natural numbers, 4 is the integers, 5 is the fields, 6 is the quintic and 7 is more axioms. Each topic names its section."
      - title: "Book of Proof"
        author: "Richard Hammack"
        access: "free"
        where: "https://richardhammack.github.io/BookOfProof/"
        note: "Logic, sets, proof and induction in a short text. Read it before chapter 1 if proofs are new to you."
      - title: "Mathematical Reasoning: Writing and Proof"
        author: "Ted Sundstrom"
        access: "free"
        where: "https://scholarworks.gvsu.edu/books/7/"
        note: "Logic, proof and set theory with many worked examples. Use it for extra practice on chapters 1 to 3."
      - title: "An Infinite Descent into Pure Mathematics"
        author: "Clive Newstead"
        access: "free"
        where: "https://infinitedescent.xyz/"
        note: "Proof, sets, functions and number theory with full solutions."
