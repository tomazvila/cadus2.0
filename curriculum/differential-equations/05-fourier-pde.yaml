unit: fourier-pde
course: differential-equations
module: "Fourier Series and the Heat Equation"
topics:
  - id: fourier-series
    name: Fourier Series
    core: false                # feeds only the supplemental PDE wing (sine/cosine series,
                               # heat equation); no core topic in the tree consumes it —
                               # the course is fully terminal
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: trigonometric-integrals
        weight: 0.5
        key: true
      - id: integration-by-parts
        weight: 0.5
        key: true
      - id: definite-integrals-ftc
        weight: 0.3
        key: false
      - id: unit-circle
        weight: 0.2
        key: false
      - id: piecewise-absolute-value-graphs
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: 'Orthogonality on $[-\pi, \pi]$'
        key_prerequisites: [trigonometric-integrals]
        exemplars:
          - problem: 'Compute $\int_{-\pi}^{\pi} \sin 2x \sin 3x\,dx$.'
            answer: "0"
            solution_sketch: 'Product-to-sum: $\sin 2x\sin 3x = \frac{1}{2}(\cos x - \cos 5x)$; both cosines integrate to $0$ over a full period.'
          - problem: 'Compute $\int_{-\pi}^{\pi} \sin^2 3x\,dx$.'
            answer: '$\pi$'
            solution_sketch: '$\sin^2 3x = \frac{1 - \cos 6x}{2}$; the constant half contributes $\pi$.'
          - problem: 'State the orthogonality relations for $\{\sin nx, \cos nx\}$ on $[-\pi, \pi]$.'
            answer: '$\int_{-\pi}^{\pi}\sin mx\sin nx\,dx = \int_{-\pi}^{\pi}\cos mx\cos nx\,dx = 0$ for $m \neq n$; $\int_{-\pi}^{\pi}\sin mx\cos nx\,dx = 0$ always; each of $\int\sin^2 nx$, $\int\cos^2 nx$ equals $\pi$ ($n \ge 1$).'
            answer_contract: {kind: none}
            solution_sketch: '$\int_{-\pi}^{\pi}\sin mx\sin nx\,dx = \int_{-\pi}^{\pi}\cos mx\cos nx\,dx = 0$ for $m \neq n$; $\int_{-\pi}^{\pi}\sin mx\cos nx\,dx = 0$ always; each of $\int\sin^2 nx$, $\int\cos^2 nx$ equals $\pi$ ($n \ge 1$).'
        constraints: "integer frequencies at most 6; every integral computable by product-to-sum or half-angle identities from trigonometric-integrals"
      - id: kp2
        name: Computing Fourier coefficients
        key_prerequisites: [integration-by-parts, trigonometric-integrals]
        exemplars:
          - problem: 'Find the Fourier coefficients $b_n$ of $f(x) = x$ on $(-\pi, \pi)$, using $b_n = \frac{1}{\pi}\int_{-\pi}^{\pi} f(x)\sin nx\,dx$.'
            answer: '$b_n = \dfrac{2(-1)^{n+1}}{n}$'
            answer_contract: {kind: none}
            solution_sketch: 'Integrate $x\sin nx$ by parts: $\frac{2}{\pi}\int_0^{\pi} x\sin nx\,dx = \frac{2}{\pi}\cdot\frac{-\pi\cos n\pi}{n} = \frac{2(-1)^{n+1}}{n}$.'
          - problem: 'Let $f(x) = 0$ on $(-\pi, 0)$ and $f(x) = 1$ on $(0, \pi)$. Compute $a_0$, $a_n$ and $b_n$.'
            answer: '$a_0 = 1$, $a_n = 0$, $b_n = \dfrac{1 - (-1)^n}{n\pi}$ (so $b_n = \frac{2}{n\pi}$ for odd $n$, $0$ for even $n$).'
            answer_contract: {kind: none}
            solution_sketch: 'Each integral only runs over $(0, \pi)$ where $f = 1$: $a_n$ integrates $\cos nx$ to $0$; $b_n = \frac{1}{\pi}\cdot\frac{1 - \cos n\pi}{n}$.'
          - problem: 'Write out the Fourier series of the square wave above through its first two nonzero sine terms.'
            answer: '$f(x) \sim \dfrac{1}{2} + \dfrac{2}{\pi}\sin x + \dfrac{2}{3\pi}\sin 3x + \cdots$'
            answer_contract: {kind: none}
            solution_sketch: 'The constant term is $a_0/2 = 1/2$; only odd $n$ survive.'
        constraints: "period 2 pi only; f piecewise constant or linear with at most two pieces and jump points at 0 or +-pi; coefficients come out as clean multiples of 1/n, 1/n^2, or (1-(-1)^n)/(n pi)"
      - id: kp3
        name: Convergence and the value at a jump
        key_prerequisites: [unit-circle, piecewise-absolute-value-graphs]
        exemplars:
          - problem: 'To what value does the Fourier series of $f(x) = x$ on $(-\pi, \pi)$ converge at the endpoint $x = \pi$?'
            answer: "0"
            solution_sketch: 'The periodic extension jumps from $\pi$ to $-\pi$ there; the series converges to the midpoint $0$.'
          - problem: "A square wave equals 0 on (-pi, 0) and 4 on (0, pi). Its periodic extension has a jump at x = 0. Find the value to which the Fourier series of the wave converges at x = 0."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Fourier convergence theorem says that at a jump discontinuity the series converges to the average of the one-sided limits. Step 1: identify the jump of the periodic extension at x = 0. Step 2: the left limit is 0 and the right limit is 4, so the average is (0 + 4)/2 = 2. The Fourier series converges to 2 at x = 0."
          - problem: "The Fourier series of f(x) = x on (-pi, pi) has terms 2(-1)^(n+1) sin(nx)/n. Setting x = pi/2 turns the series into the alternating sum S = 1 - 1/3 + 1/5 - 1/7 + .... Compute S."
            answer: "pi/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (convergence theorem): the periodic extension of f(x) = x is continuous at x = pi/2, so the series value there equals f(pi/2) = pi/2. Step 2 (unit-circle values): sin(n pi/2) is 0 for even n and alternates 1, -1 for odd n, so the series at x = pi/2 reads 2(1 - 1/3 + 1/5 - ...) = 2S. Solving 2S = pi/2 gives S = pi/4. The sum equals pi/4."
          - problem: "Let f(x) = cos(2x) on (-pi, pi). State the value to which its Fourier series converges at x = pi/2."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (convergence theorem): where the periodic extension is continuous, the Fourier series converges to the function value itself. Step 2: f(x) = cos(2x) is continuous at x = pi/2, and cos(2 * pi/2) = cos(pi) = -1. The Fourier series converges to -1 at x = pi/2."
          - problem: "A piecewise-smooth function has f(x) = 3 on (-pi, pi/2) and f(x) = 7 on (pi/2, pi). Determine the value to which its Fourier series converges at the jump x = pi/2."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (convergence theorem): at a jump the Fourier series converges to the midpoint of the one-sided limits. Step 2: the left limit at x = pi/2 is 3 and the right limit is 7, and (3 + 7)/2 = 5. The Fourier series converges to 5 at the jump."
          - problem: "The function f(x) = x^2 + x on (-pi, pi) is extended periodically with period 2pi, and the extension jumps at x = pi. Compute the value to which the Fourier series of the extension converges at x = pi."
            answer: "pi^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (periodic extension): extending f(x) = x^2 + x with period 2pi, the left limit at x = pi is pi^2 + pi and the right limit is pi^2 - pi, so the extension jumps there. Step 2 (convergence theorem): the series at a jump converges to the average (pi^2 + pi + pi^2 - pi)/2 = pi^2. The Fourier series converges to pi^2 at x = pi."
        constraints: "piecewise-smooth f only; evaluation points are jumps or clean multiples of pi/2 where sin/cos values are exact"
    diagnostic_exemplar:
      problem: 'Find the Fourier coefficients $b_n$ of $f(x) = x$ on $(-\pi, \pi)$, and state the value to which its Fourier series converges at $x = \pi$.'
      answer: '$b_n = \dfrac{2(-1)^{n+1}}{n}$ (and every $a_n = 0$, since $f$ is odd); at $x = \pi$ the series converges to $0$.'
      answer_contract: {kind: none}
      solution_sketch: '$b_n = \frac{1}{\pi}\int_{-\pi}^{\pi} x\sin nx\,dx = \frac{2}{\pi}\int_0^{\pi} x\sin nx\,dx$, which by parts is $\frac{2(-1)^{n+1}}{n}$. At $x = \pi$ the periodic extension jumps from $\pi$ to $-\pi$, and the series converges to the average $0$.'
    anki_seeds:
      - front: 'Fourier coefficient formulas on $[-\pi, \pi]$?'
        back: '$a_n = \frac{1}{\pi}\int_{-\pi}^{\pi} f\cos nx\,dx$, $b_n = \frac{1}{\pi}\int_{-\pi}^{\pi} f\sin nx\,dx$, with constant term $a_0/2$.'
        type: basic
      - front: 'Key orthogonality fact behind the coefficient formulas?'
        back: '$\int_{-\pi}^{\pi}\sin mx\sin nx\,dx = 0$ for $m \neq n$ and $= \pi$ for $m = n \ge 1$ (same for cosines; mixed products always 0).'
        type: basic
      - front: "At a jump discontinuity, a Fourier series converges to..."
        back: "the midpoint of the left and right limits of the function."
        type: basic

  - id: fourier-sine-cosine-series
    name: Sine and Cosine Series
    core: false                # supplemental PDE wing: consumed only by the heat-equation
                               # topic, itself a terminal destination
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: fourier-series
        weight: 0.8
        key: true
      - id: even-odd-functions
        weight: 0.4
        key: true
      - id: integration-by-parts
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Even and odd shortcuts
        key_prerequisites: [even-odd-functions, fourier-series]
        exemplars:
          - problem: "For f(x) = x^3 on (-pi, pi), use the odd symmetry shortcut to find b_1."
            answer: "2pi^2-12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function f(x) = x^3 is odd. Step 1, parity rule: every a_n is 0 because f cos(nx) is odd. Step 2, odd half-interval formula: b_n = (2/pi) times the integral from 0 to pi of x^3 sin(nx) dx. Step 3, integration by parts for n = 1 gives the integral from 0 to pi of x^3 sin(x) dx = pi^3 - 6pi. Step 4, multiply by 2/pi. The value is 2pi^2-12."
          - problem: "For f(x) = x^2 on (-pi, pi), use the even symmetry shortcut to find a_2."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function f(x) = x^2 is even. Step 1, parity rule: every b_n is 0 because f sin(nx) is odd. Step 2, even half-interval formula: a_n = (2/pi) times the integral from 0 to pi of x^2 cos(nx) dx. Step 3, for n = 2, integration by parts gives the integral from 0 to pi of x^2 cos(2x) dx = pi/2. Step 4, multiply by 2/pi. The value is 1."
          - problem: "For f(x) = |x| on (-pi, pi), use the even symmetry shortcut to find a_0."
            answer: "pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function f(x) = |x| is even, so every b_n is 0 by the parity rule. Step 1, even half-interval formula: a_0 = (2/pi) times the integral from 0 to pi of f(x) dx, and on the half interval |x| = x. Step 2, integrate: the integral from 0 to pi of x dx equals pi^2/2. Step 3, multiply by the factor 2/pi, which gives a_0 = (2/pi)(pi^2/2). The value is pi."
          - problem: "For f(x) = x cos(x) on (-pi, pi), use the odd symmetry shortcut to find b_1."
            answer: "-1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function f(x) = x cos(x) is odd, because x is odd and cos(x) is even. Step 1, parity rule: every a_n is 0. Step 2, odd half-interval formula: b_n = (2/pi) times the integral from 0 to pi of x cos(x) sin(nx) dx. Step 3, for n = 1 use sin(x)cos(x) = sin(2x)/2 and integration by parts; the integral from 0 to pi of x cos(x) sin(x) dx = -pi/4. Step 4, multiply by 2/pi. The value is -1/2."
          - problem: "For f(x) = x sin(x) on (-pi, pi), use the even symmetry shortcut to find a_0."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function f(x) = x sin(x) is even, because x is odd and sin(x) is odd. Step 1, parity rule: every b_n is 0. Step 2, even half-interval formula: a_0 = (2/pi) times the integral from 0 to pi of x sin(x) dx. Step 3, integration by parts gives the integral from 0 to pi of x sin(x) dx = pi. Step 4, multiply by 2/pi. The value is 2."
          - problem: "For an odd function f on (-pi, pi), select the half-interval form of b_n."
            answer: "2/pi integral_0^pi f(x) sin(nx) dx"
            answer_contract: {"kind": "label", "options": [["2/pi integral_0^pi f(x) sin(nx) dx"], ["2/pi integral_0^pi f(x) cos(nx) dx"], ["1/pi integral_0^pi f(x) sin(nx) dx"], ["1/pi integral_0^pi f(x) cos(nx) dx"]]}
            solution_sketch: "For odd f, the product f(x) sin(nx) is even, so the full integral for b_n is twice the half-interval integral. Step 1, start with b_n = (1/pi) integral from -pi to pi of f(x) sin(nx) dx. Step 2, double the integral over 0 to pi: b_n = (2/pi) integral from 0 to pi of f(x) sin(nx) dx. The wrong option 2/pi integral_0^pi f(x) cos(nx) dx uses the wrong trigonometric factor. The wrong option 1/pi integral_0^pi f(x) sin(nx) dx forgets the factor 2. The wrong option 1/pi integral_0^pi f(x) cos(nx) dx has both errors. The correct option is 2/pi integral_0^pi f(x) sin(nx) dx."
        constraints: "f a power of x, |x|, or a product of one power and one sine/cosine — or an unspecified f known only to be even or odd, for half-interval rewrites of the coefficient formulas; justification must name even/odd parity"
      - id: kp2
        name: "Half-range sine expansions on $[0, L]$"
        key_prerequisites: [fourier-series, integration-by-parts]
        exemplars:
          - problem: "For a half-range sine expansion on $(0, L)$, the coefficient is $b_n = \\frac{2}{L}\\int_0^L f(x)\\sin\\left(\\frac{n\\pi x}{L}\\right)\\,dx$. For $f(x) = 1$ on $(0, \\pi)$, find the exact value of $b_3$."
            answer: "4/(3pi)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the half-range sine coefficient formula: $b_n = \\frac{2}{\\pi}\\int_0^{\\pi} 1\\cdot\\sin(nx)\\,dx$ because $L=\\pi$ and $f=1$. Integrate: $\\int_0^{\\pi}\\sin(3x)\\,dx = \\left[-\\cos(3x)/3\\right]_0^{\\pi} = (1 - \\cos 3\\pi)/3 = 2/3$. Multiply by $2/\\pi$: $b_3 = (2/\\pi)(2/3) = 4/(3\\pi)$. The value is 4/(3pi)."
          - problem: "For a half-range sine expansion on $(0, L)$, the coefficient is $b_n = \\frac{2}{L}\\int_0^L f(x)\\sin\\left(\\frac{n\\pi x}{L}\\right)\\,dx$. For $f(x) = x$ on $(0, 1)$, find the exact value of $b_2$."
            answer: "-1/pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the half-range sine coefficient formula with $L=1$: $b_n = 2\\int_0^1 x\\sin(n\\pi x)\\,dx$. Integrate by parts for $n=2$: $\\int_0^1 x\\sin(2\\pi x)\\,dx = \\left[-x\\cos(2\\pi x)/(2\\pi)\\right]_0^1 + \\int_0^1 \\cos(2\\pi x)/(2\\pi)\\,dx = -1/(2\\pi)$. Multiply by 2: $b_2 = -1/\\pi$. The coefficient is -1/pi."
          - problem: "For a half-range sine expansion on $(0, L)$, the coefficient is $b_n = \\frac{2}{L}\\int_0^L f(x)\\sin\\left(\\frac{n\\pi x}{L}\\right)\\,dx$. For $f(x) = 2$ on $(0, 1)$, find the exact value of $b_1$."
            answer: "8/pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "With $L=1$ and $f=2$, the formula gives $b_n = 2\\int_0^1 2\\sin(n\\pi x)\\,dx = 4\\int_0^1 \\sin(n\\pi x)\\,dx$. For $n=1$, integrate: $4\\left[-\\cos(\\pi x)/\\pi\\right]_0^1 = 4(1/\\pi + 1/\\pi) = 8/\\pi$. The coefficient is 8/pi."
          - problem: "For a half-range sine expansion on $(0, L)$, the coefficient is $b_n = \\frac{2}{L}\\int_0^L f(x)\\sin\\left(\\frac{n\\pi x}{L}\\right)\\,dx$. For $f(x) = x$ on $(0, \\pi)$, find the exact value of $b_1$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "With $L=\\pi$, the coefficient is $b_n = \\frac{2}{\\pi}\\int_0^{\\pi} x\\sin(nx)\\,dx$. For $n=1$, integrate by parts: $\\int_0^{\\pi} x\\sin x\\,dx = \\left[-x\\cos x + \\sin x\\right]_0^{\\pi} = \\pi$. Multiply by $2/\\pi$: $b_1 = 2$. The coefficient is 2."
          - problem: "For a half-range sine expansion on $(0, L)$, the coefficient is $b_n = \\frac{2}{L}\\int_0^L f(x)\\sin\\left(\\frac{n\\pi x}{L}\\right)\\,dx$. For $f(x) = x$ on $(0, \\pi)$, find the exact value of $b_2$."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "With $L=\\pi$, $b_n = \\frac{2}{\\pi}\\int_0^{\\pi} x\\sin(nx)\\,dx$. For $n=2$, integrate by parts: $\\int_0^{\\pi} x\\sin(2x)\\,dx = \\left[-x\\cos(2x)/2 + \\sin(2x)/4\\right]_0^{\\pi} = -\\pi/2$. Multiply by $2/\\pi$: $b_2 = -1$. The coefficient is -1."
          - problem: "For a half-range sine expansion on $(0, L)$, the coefficient is $b_n = \\frac{2}{L}\\int_0^L f(x)\\sin\\left(\\frac{n\\pi x}{L}\\right)\\,dx$. For $f(x) = x$ on $(0, 1)$, give the first two nonzero sine terms as a function of $x$."
            answer: "2 sin(pi x)/pi - sin(2pi x)/pi"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "With $L=1$, the coefficient is $b_n = 2\\int_0^1 x\\sin(n\\pi x)\\,dx$. Integration by parts gives $b_1 = 2/\\pi$ and $b_2 = -1/\\pi$. Therefore the first two terms are $(2/\\pi)\\sin(\\pi x) - (1/\\pi)\\sin(2\\pi x)$, which is 2 sin(pi x)/pi - sin(2pi x)/pi."
        constraints: "L in {1, pi}; f constant or linear; the general-L formula b_n = (2/L) integral of f sin(n pi x / L) must be quoted before use"
      - id: kp3
        name: "Half-range cosine expansions on $[0, L]$"
        key_prerequisites: [fourier-series, integration-by-parts]
        exemplars:
          - problem: 'Expand $f(x) = x$ on $(0, \pi)$ in a cosine series: compute $a_0$ and $a_n = \frac{2}{\pi}\int_0^{\pi} x\cos nx\,dx$.'
            answer: '$a_0 = \pi$ and $a_n = \dfrac{2((-1)^n - 1)}{\pi n^2}$ (so $-\frac{4}{\pi n^2}$ for odd $n$, $0$ for even $n$).'
            answer_contract: {kind: none}
            solution_sketch: 'By parts the boundary term vanishes, leaving $\frac{2}{\pi}\cdot\frac{\cos n\pi - 1}{n^2}$.'
          - problem: 'Why does a half-range cosine expansion of a continuous $f$ tend to converge faster than its sine expansion?'
            answer: "The cosine (even) extension stays continuous at the endpoints, while the odd extension generally jumps there — and jumps slow convergence to $1/n$-sized coefficients."
            answer_contract: {kind: none}
            solution_sketch: "The cosine (even) extension stays continuous at the endpoints, while the odd extension generally jumps there — and jumps slow convergence to $1/n$-sized coefficients."
        constraints: "L in {1, pi}; f constant or linear; coefficients must come out as clean multiples of 1/n^2 or (± signs handled via (-1)^n, never a bare plus-minus in an answer)"
    diagnostic_exemplar:
      problem: 'Expand $f(x) = x$ on $(0, \pi)$ in a half-range cosine series: give $a_0$ and $a_n$.'
      answer: '$a_0 = \pi$ and $a_n = \dfrac{2\left((-1)^n - 1\right)}{\pi n^2}$ (so $-\frac{4}{\pi n^2}$ for odd $n$, and $0$ for even $n$).'
      answer_contract: {kind: none}
      solution_sketch: 'The cosine series uses the even extension, so $a_n = \frac{2}{\pi}\int_0^{\pi} x\cos nx\,dx$; integrating by parts gives $\frac{2((-1)^n - 1)}{\pi n^2}$, and $a_0 = \frac{2}{\pi}\int_0^{\pi} x\,dx = \pi$.'
    anki_seeds:
      - front: "Odd function on (-L, L): its Fourier series contains..."
        back: "only sines (all $a_n = 0$); an even function gives only cosines."
        type: basic
      - front: 'Half-range sine coefficients on $[0, L]$?'
        back: '$b_n = \dfrac{2}{L}\int_0^L f(x)\sin\dfrac{n\pi x}{L}\,dx$'
        type: basic

  - id: heat-equation-separation-of-variables
    name: The Heat Equation by Separation of Variables
    core: false                # the course's terminal destination: cashes in the
                               # eigenvalue machinery of boundary-value-problems-intro
                               # (itself supplemental) and nothing builds on it
    difficulty: 0.85
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: boundary-value-problems-intro
        weight: 0.6
        key: true
      - id: fourier-sine-cosine-series
        weight: 0.6
        key: true
      - id: partial-derivatives
        weight: 0.3
        key: false
      - id: separable-equations
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Separating $u(x,t) = X(x)T(t)$"
        key_prerequisites: [partial-derivatives, boundary-value-problems-intro]
        exemplars:
          - problem: "Separating u(x,t) = X(x)T(t) in the heat equation u_t = k u_xx writes the ratio T'/(k T) = X''/X as the constant -lambda. Select the pair of ordinary differential equations that follows."
            answer: "X'' + lambda X = 0 and T' + lambda k T = 0"
            answer_contract: {"kind": "label", "options": [["X'' + lambda X = 0 and T' + lambda k T = 0"], ["X'' - lambda X = 0 and T' - lambda k T = 0"], ["X'' + lambda X = 0 and T' - lambda k T = 0"], ["X'' + lambda k X = 0 and T' + lambda T = 0"]]}
            solution_sketch: "Step 1, separation of variables: put u = X(x)T(t) into u_t = k u_xx to get X T' = k X'' T, so T'/(k T) = X''/X. Step 2, the constant argument: the side in t equals the side in x for all x and t only if both are the same constant, written -lambda, so X'' + lambda X = 0 and T' + lambda k T = 0. The option X'' - lambda X = 0 and T' - lambda k T = 0 has the wrong sign on both constants, the option X'' + lambda X = 0 and T' - lambda k T = 0 has the wrong sign on the T equation, and the option X'' + lambda k X = 0 and T' + lambda T = 0 puts the factor k in the wrong equation. The correct pair is X'' + lambda X = 0 and T' + lambda k T = 0."
          - problem: "Substitute u(x,t) = X(x)T(t) into the heat equation u_t = k u_xx on the interval (0, 6) with Dirichlet conditions u(0,t) = u(6,t) = 0, and write the separation constant as -lambda. Find the first eigenvalue lambda_1 of the resulting X-problem."
            answer: "pi^2/36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, separation of variables: u = X(x)T(t) in u_t = k u_xx gives X''/X = T'/(k T) = -lambda, so X'' + lambda X = 0 together with X(0) = X(6) = 0. Step 2, eigenvalue problem: this X-problem is the eigenvalue problem from the boundary value problems lesson, with X_n = sin(n pi x/6) and lambda_n = n^2 pi^2/36. The first eigenvalue is lambda_1 = pi^2/36."
          - problem: "On the interval (0, pi) with u(0,t) = u(pi,t) = 0, the product solution u(x,t) = e^(-12t) sin(2x) solves u_t = k u_xx, where -lambda is the separation constant. Find the value of k."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, separation of variables: u = X(x)T(t) in u_t = k u_xx gives X'' + lambda X = 0 and T' + lambda k T = 0 with the constant -lambda. Step 2, the X-problem: on (0, pi) with X(0) = X(pi) = 0, the eigenfunction sin(2x) has eigenvalue lambda = 4, matching the eigenvalue problem of the boundary value problems lesson. Step 3, the T-equation: T' = -4 k T, so T = e^(-4 k t), and comparing with e^(-12t) gives -4k = -12; hence k = 3."
          - problem: "A rod whose ends are held at zero temperature leads to the X-problem X'' + lambda X = 0 on (0, L) with X(0) = X(L) = 0, where -lambda is the separation constant. Its first eigenvalue is pi^2/25. Find the length L."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, separation of variables: X'' + lambda X = 0 on (0, L) with X(0) = X(L) = 0 is the eigenvalue problem from the boundary value problems lesson, and its eigenvalues are lambda_n = n^2 pi^2/L^2. Step 2, first eigenvalue: lambda_1 = pi^2/L^2, and the problem states pi^2/L^2 = pi^2/25. Step 3, solve: L^2 = 25, so the length is L = 5."
          - problem: "The X-problem X'' + lambda X = 0 on (0, pi) with X(0) = X(pi) = 0 comes from separating the heat equation u_t = k u_xx, where -lambda is the separation constant. How many eigenvalues lambda_n are less than 60?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, separation of variables: the X-problem from the boundary value problems lesson has eigenfunctions sin(nx) and eigenvalues lambda_n = n^2 for n = 1, 2, 3, .... Step 2, count: the condition n^2 less than 60 holds for n = 1 through 7, because 7^2 = 49 and 8^2 = 64. So 7 eigenvalues are less than 60."
          - problem: "Separating u_t = k u_xx on (0, L) with Dirichlet conditions gives the X-problem X'' + lambda X = 0 with the separation constant -lambda, and its third eigenvalue is 4 pi^2. Find the length L."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, separation of variables: the X-problem X'' + lambda X = 0 with X(0) = X(L) = 0 is the eigenvalue problem from the boundary value problems lesson, with eigenvalues lambda_n = n^2 pi^2/L^2. Step 2, third eigenvalue: lambda_3 = 9 pi^2/L^2, and the problem states 9 pi^2/L^2 = 4 pi^2. Step 3, solve: L^2 = 9/4, so the length is L = 3/2."
        constraints: "Dirichlet boundary conditions only; separation constant written -lambda; the X-equation must be identified as the eigenvalue problem from boundary-value-problems-intro"
      - id: kp2
        name: Initial data that is already a sine combination
        key_prerequisites: [boundary-value-problems-intro, fourier-sine-cosine-series]
        exemplars:
          - problem: "Solve u_t = u_xx on (0, pi), u(0,t) = u(pi,t) = 0, u(x,0) = 2 sin x + 5 sin 3x. Give the solution as u(x, t)."
            answer: "2e^(-t)sin(x)+5e^(-9t)sin(3x)"
            answer_contract: {"kind": "function", "vars": ["x", "t"]}
            solution_sketch: "Separation of variables gives the full solution u(x,t) = 2e^(-t)sin(x)+5e^(-9t)sin(3x). Each sine mode sin(nx) in the initial data decays with factor e^(-n^2 t) for k=1 and L=pi. The n=1 mode has rate 1, and the n=3 mode has rate 9. The solution is 2e^(-t)sin(x)+5e^(-9t)sin(3x)."
          - problem: "Solve u_t = 2u_xx on (0, pi), u(0,t) = u(pi,t) = 0, u(x,0) = 7 sin 2x. Give the solution as u(x, t)."
            answer: "7e^(-8t)sin(2x)"
            answer_contract: {"kind": "function", "vars": ["x", "t"]}
            solution_sketch: "Separation of variables gives the single mode u(x,t) = 7e^(-8t)sin(2x). For k=2 and L=pi, the decay rate of sin(nx) is k n^2, so n=2 gives rate 8. The solution is 7e^(-8t)sin(2x)."
          - problem: "For u_t = 3u_xx on (0, pi) with u(0,t) = u(pi,t) = 0, the initial data is u(x,0) = 4 sin 2x - sin 5x. Find the decay rate, the coefficient of t in the exponent, of the slower-decaying mode."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Separation of variables gives rates k n^2 for L=pi. With k=3, the n=2 mode has rate 3*4 = 12 and the n=5 mode has rate 3*25 = 75. The slower-decaying mode has decay rate 12."
          - problem: "For u_t = 2u_xx on (0, pi), u(0,t) = u(pi,t) = 0, u(x,0) = 5 sin 2x + 3 sin 5x, find the coefficient of sin 2x in u(x,t) when t = 1. Give the coefficient as a decimal to 3 decimals."
            answer: "0.002"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Separation of variables gives u(x,t) = 5e^(-8t)sin(2x)+3e^(-50t)sin(5x). At t=1 the coefficient of sin 2x is 5e^(-8). Numerically 5e^(-8) = 0.001677..., so to 3 decimals the coefficient is 0.002."
          - problem: "Solve u_t = 5u_xx on (0, pi), u(0,t) = u(pi,t) = 0, u(x,0) = 2 sin x - 6 sin 3x. Give the solution as u(x, t)."
            answer: "2e^(-5t)sin(x)-6e^(-45t)sin(3x)"
            answer_contract: {"kind": "function", "vars": ["x", "t"]}
            solution_sketch: "Separation of variables gives the full solution u(x,t) = 2e^(-5t)sin(x)-6e^(-45t)sin(3x). For k=5 and L=pi, the n=1 mode decays at rate 5 and the n=3 mode decays at rate 45. The solution is 2e^(-5t)sin(x)-6e^(-45t)sin(3x)."
          - problem: "For u_t = 4u_xx on (0, 1), u(0,t) = u(1,t) = 0, and u(x,0) = sin(2 pi x) + 3 sin(5 pi x), find the ratio of the decay rate of the sin(5 pi x) mode to the decay rate of the sin(2 pi x) mode."
            answer: "25/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Separation of variables gives decay rates k(n pi/L)^2. With k=4 and L=1, the n=2 rate is 4(2pi)^2 = 16pi^2 and the n=5 rate is 4(5pi)^2 = 100pi^2. The ratio is 100pi^2/16pi^2 = 25/4."
        constraints: "initial data a combination of at most two sine modes; k and L chosen so decay rates are clean multiples of 1 or pi^2"
      - id: kp3
        name: General initial data via sine series
        key_prerequisites: [fourier-sine-cosine-series]
        exemplars:
          - problem: 'Write the general solution of $u_t = k\,u_{xx}$ on $(0, L)$ with $u(0,t) = u(L,t) = 0$ and $u(x,0) = f(x)$.'
            answer: '$u(x,t) = \sum_{n=1}^{\infty} b_n e^{-k(n\pi/L)^2 t}\sin\dfrac{n\pi x}{L}$, where $b_n = \dfrac{2}{L}\int_0^L f(x)\sin\dfrac{n\pi x}{L}\,dx$.'
            answer_contract: {kind: none}
            solution_sketch: 'Superpose the product solutions; at $t = 0$ the series must be the sine series of $f$.'
          - problem: 'A rod on $(0, \pi)$ with ends held at $0$ starts at constant temperature $u(x,0) = 100$. Solve $u_t = u_{xx}$.'
            answer: '$u(x,t) = \sum_{n \text{ odd}} \dfrac{400}{n\pi} e^{-n^2 t}\sin nx$'
            answer_contract: {kind: none}
            solution_sketch: 'The sine coefficients of the constant $100$ are $\frac{200(1 - (-1)^n)}{n\pi}$: $\frac{400}{n\pi}$ for odd $n$. Attach $e^{-n^2 t}$ to each mode.'
        constraints: "initial data constant or linear, whose sine coefficients were computed in fourier-sine-cosine-series; L in {1, pi}"
    diagnostic_exemplar:
      problem: 'Solve $u_t = u_{xx}$ on $(0, \pi)$ with $u(0,t) = u(\pi,t) = 0$ and initial temperature $u(x,0) = 50$.'
      answer: '$u(x,t) = \sum_{n \text{ odd}} \dfrac{200}{n\pi}\,e^{-n^2 t}\sin nx$'
      answer_contract: {kind: none}
      solution_sketch: 'Separation gives the product solutions $e^{-n^2 t}\sin nx$, so $u = \sum b_n e^{-n^2 t}\sin nx$ with $b_n = \frac{2}{\pi}\int_0^{\pi} 50\sin nx\,dx = \frac{100(1 - (-1)^n)}{n\pi}$, which is $\frac{200}{n\pi}$ for odd $n$ and $0$ for even $n$.'
    anki_seeds:
      - front: "Separation of variables for the heat equation: the ansatz and what it produces?"
        back: '$u = X(x)T(t)$ turns $u_t = ku_{xx}$ into the eigenvalue problem $X'''' + \lambda X = 0$ plus $T'' = -\lambda k T$.'
        type: basic
      - front: 'Decay rate of mode $n$ in the heat equation on $(0, L)$ with zero ends?'
        back: '$e^{-k(n\pi/L)^2 t}$ — higher modes smooth out fastest.'
        type: basic
      - front: "Where do the coefficients of the heat-equation series solution come from?"
        back: "They are the half-range sine coefficients of the initial temperature $f(x)$."
        type: basic
