unit: fourier-pde
course: differential-equations
module: "Fourier Series and the Heat Equation"
topics:
  - id: fourier-series
    name: Fourier Series
    core: false                # feeds only the supplemental PDE wing (sine/cosine series,
                               # heat equation); no core topic in the tree consumes it —
                               # the course is fully terminal
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: trigonometric-integrals
        weight: 0.5
        key: true
      - id: integration-by-parts
        weight: 0.5
        key: true
      - id: definite-integrals-ftc
        weight: 0.3
        key: false
      - id: unit-circle
        weight: 0.2
        key: false
      - id: piecewise-absolute-value-graphs
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: 'Orthogonality on $[-\pi, \pi]$'
        key_prerequisites: [trigonometric-integrals]
        step_check:
          step: 'their integrals over the symmetric interval $[-\pi, \pi]$ are zero'
          question: 'Why is the integral of each odd function over $[-\pi, \pi]$ equal to zero?'
          options:
            - 'Every sine function equals zero at both endpoints $-\pi$ and $\pi$'
            - 'The area on $(0, \pi)$ cancels the equal and opposite area on $(-\pi, 0)$'
            - 'The integral of a sine over any interval is zero when the frequency is even'
          answer: 'The area on $(0, \pi)$ cancels the equal and opposite area on $(-\pi, 0)$'
          why: 'For an odd function $g$, $g(-x) = -g(x)$, so the part of the area left of $0$ is the negative of the part right of $0$. The two parts add to zero.'
        exemplars:
          - problem: 'Compute $\int_{-\pi}^{\pi} \sin 2x \sin 3x\,dx$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Product-to-sum gives $\sin 2x\sin 3x = \frac{1}{2}(\cos x - \cos 5x)$. Each cosine integrates to $0$ over the full period $[-\pi, \pi]$, so the integral is $0$. This is the orthogonality of two sines with different frequencies.'
          - problem: 'Compute $\int_{-\pi}^{\pi} \sin^2 3x\,dx$.'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The half-angle identity gives $\sin^2 3x = \frac{1 - \cos 6x}{2}$. The cosine part integrates to $0$ over the period, and the constant $\frac{1}{2}$ gives $\frac{1}{2}\cdot 2\pi = \pi$.'
          - problem: 'Compute $\int_{-\pi}^{\pi} (2\sin x + 3\cos 2x)\sin x\,dx$.'
            answer: '2pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand the product: $2\int \sin^2 x\,dx + 3\int \cos 2x \sin x\,dx$. The first integral is $\pi$, so it contributes $2\pi$. The mixed product of a sine and a cosine integrates to $0$, so the total is $2\pi$.'
          - problem: 'A vibration sensor records the signal $p(x) = 3\sin 2x + 4\sin 3x$ over one period $-\pi \le x \le \pi$. Find the energy $\int_{-\pi}^{\pi} p(x)^2\,dx$ of the signal over that period.'
            answer: '25pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square the signal: $9\sin^2 2x + 24\sin 2x\sin 3x + 16\sin^2 3x$. The cross term integrates to $0$ by orthogonality. Each squared sine integrates to $\pi$, so the energy is $9\pi + 16\pi = 25\pi$.'
          - problem: 'For which value of $c$ does $\int_{-\pi}^{\pi} (c\sin 3x)\sin 3x\,dx$ equal $10$?'
            answer: '10/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral equals $c\int_{-\pi}^{\pi}\sin^2 3x\,dx = c\pi$. Set $c\pi = 10$. Divide both sides by $\pi$ to get $c = \frac{10}{\pi}$.'
          - problem: 'Compute $\int_{-\pi}^{\pi} (3\sin x - 2\sin 4x)^2\,dx$.'
            answer: '13pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand the square: $9\sin^2 x - 12\sin x\sin 4x + 4\sin^2 4x$. The cross term is $0$ by orthogonality. The two squares give $9\pi + 4\pi = 13\pi$.'
          - problem: 'A receiver multiplies the signal $s(x) = 4\sin 2x + 6\sin 5x$ by a reference tone $\sin 5x$ and integrates over one period $-\pi \le x \le \pi$. What value does the receiver get?'
            answer: '6pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product is $4\sin 2x\sin 5x + 6\sin^2 5x$. The first term integrates to $0$ by orthogonality, because the frequencies differ. The second term gives $6\pi$, so the receiver picks out only the $\sin 5x$ part of the signal and gets $6\pi$.'
          - problem: 'Sam evaluates $\int_{-\pi}^{\pi} \sin 3x \cos 3x\,dx$ and writes $\pi$, because the two frequencies match. What is the correct value?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Matching frequencies make the integral nonzero only for two sines or two cosines. Here $\sin 3x\cos 3x = \frac{1}{2}\sin 6x$, which is odd, so the integral is $0$. A sine and a cosine are always orthogonal on $[-\pi, \pi]$.'
          - problem: 'For integers $m \ne n$ the product-to-sum identity gives $\sin mx\sin nx = \frac{1}{2}[\cos(m-n)x - \cos(m+n)x]$. What is $\int_{-\pi}^{\pi} \sin mx\sin nx\,dx$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $\sin mx\sin nx = \frac{1}{2}[\cos(m-n)x - \cos(m+n)x]$. Both $m-n$ and $m+n$ are nonzero integers, so each cosine integrates to $0$ over the full period. Hence the integral of the product is $0$.'
        constraints: "integer frequencies at most 6; every integral computable by product-to-sum or half-angle identities from trigonometric-integrals"
      - id: kp2
        name: Computing Fourier coefficients
        key_prerequisites: [integration-by-parts, trigonometric-integrals]
        step_check:
          step: 'The second integral is zero'
          question: 'Why is the second integral zero?'
          options:
            - 'The sine of every integer multiple of $\pi$ is zero, so the whole integral cancels'
            - 'The cosine is an odd function, so it integrates to zero over the interval $(0, \pi)$'
            - '$f(x) = 0$ on $(0, \pi)$, so the integrand is zero across that piece'
          answer: '$f(x) = 0$ on $(0, \pi)$, so the integrand is zero across that piece'
          why: 'On $(0, \pi)$ the function $f$ equals $0$, so $f(x)\cos nx = 0$ there. A zero integrand has integral $0$.'
        exemplars:
          - problem: 'The function $f$ equals $x$ on $(-\pi, 0)$ and $0$ on $(0, \pi)$. Find the Fourier coefficient $a_0 = \frac{1}{\pi}\int_{-\pi}^{\pi} f(x)\,dx$.'
            answer: '-pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only the piece on $(-\pi, 0)$ contributes. Then $a_0 = \frac{1}{\pi}\int_{-\pi}^{0} x\,dx = \frac{1}{\pi}\cdot\left(-\frac{\pi^2}{2}\right) = -\frac{\pi}{2}$.'
          - problem: 'The function $f$ equals $1$ on $(0, \pi)$ and $0$ on $(-\pi, 0)$. Find the coefficient $b_3 = \frac{1}{\pi}\int_{-\pi}^{\pi} f(x)\sin 3x\,dx$.'
            answer: '2/(3pi)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only $(0, \pi)$ contributes, so $b_3 = \frac{1}{\pi}\int_0^{\pi}\sin 3x\,dx = \frac{1}{\pi}\cdot\frac{1 - \cos 3\pi}{3}$. Since $\cos 3\pi = -1$, this is $\frac{1}{\pi}\cdot\frac{2}{3} = \frac{2}{3\pi}$.'
          - problem: 'Find the Fourier coefficient $b_2$ of $f(x) = x$ on $(-\pi, \pi)$, where $b_n = \frac{1}{\pi}\int_{-\pi}^{\pi} f(x)\sin nx\,dx$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Integration by parts gives $\int x\sin nx\,dx = -\frac{x\cos nx}{n} + \frac{\sin nx}{n^2}$. Evaluated from $-\pi$ to $\pi$ this is $-\frac{2\pi(-1)^n}{n}$, so $b_n = \frac{2(-1)^{n+1}}{n}$. For $n = 2$ this is $-1$.'
          - problem: 'Find the Fourier coefficient $a_3$ of $f(x) = |x|$ on $(-\pi, \pi)$, where $a_n = \frac{1}{\pi}\int_{-\pi}^{\pi} f(x)\cos nx\,dx$.'
            answer: '-4/(9pi)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is even, so $a_n = \frac{2}{\pi}\int_0^{\pi} x\cos nx\,dx = \frac{2((-1)^n - 1)}{\pi n^2}$ by parts. For $n = 3$ this is $\frac{2(-2)}{9\pi} = -\frac{4}{9\pi}$.'
          - problem: 'A voltage equals $-5$ volts for $-\pi < x < 0$ and $5$ volts for $0 < x < \pi$, and then repeats with period $2\pi$. Find the coefficient of $\sin 3x$ in its Fourier series.'
            answer: '20/(3pi)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The wave is odd, so the coefficient is $b_3 = \frac{2}{\pi}\int_0^{\pi} 5\sin 3x\,dx = \frac{10}{\pi}\cdot\frac{2}{3}$. This equals $\frac{20}{3\pi}$.'
          - problem: 'Find the Fourier coefficient $a_2$ of $f(x) = x^2$ on $(-\pi, \pi)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is even, so $a_2 = \frac{2}{\pi}\int_0^{\pi} x^2\cos 2x\,dx$. Integration by parts twice gives $\int_0^{\pi} x^2\cos 2x\,dx = \frac{\pi}{2}$. Multiply by $\frac{2}{\pi}$ to get $1$.'
          - problem: 'A lamp is driven by a signal that equals $4$ on $(0, \pi)$ and $0$ on $(-\pi, 0)$, repeating with period $2\pi$. Find the coefficient of $\sin x$ in its Fourier series.'
            answer: '8/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient is $b_1 = \frac{1}{\pi}\int_0^{\pi} 4\sin x\,dx = \frac{1}{\pi}\cdot 4\cdot 2$. The integral of $\sin x$ over $(0, \pi)$ is $2$, so $b_1 = \frac{8}{\pi}$.'
          - problem: 'Sam computes the Fourier coefficient $a_2$ of $f(x) = x$ on $(-\pi, \pi)$ and gets $2$. What is the correct value?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function $x$ is odd and $\cos 2x$ is even, so $x\cos 2x$ is odd. The integral of an odd function over $(-\pi, \pi)$ is $0$, so $a_2 = 0$.'
        constraints: "period 2 pi only; f piecewise constant or linear with at most two pieces and jump points at 0 or +-pi; coefficients come out as clean multiples of 1/n, 1/n^2, or (1-(-1)^n)/(n pi)"
      - id: kp3
        name: Convergence and the value at a jump
        key_prerequisites: [unit-circle, piecewise-absolute-value-graphs]
        step_check:
          step: 'Calculate the midpoint of the LHL and RHL'
          question: 'Why do we calculate the midpoint of the two one-sided limits?'
          options:
            - 'At a jump the series converges to the average of the two limits'
            - 'The series must pass through the larger of the two one-sided limits'
            - 'The function value $f(0)$ is defined as the average of the two limits'
          answer: 'At a jump the series converges to the average of the two limits'
          why: 'A finite sum of continuous sines and cosines cannot jump, so the series splits the difference. It converges to $\frac{f(0^-) + f(0^+)}{2}$.'
        try_first:
          problem: 'A function equals $1$ on $(-\pi, 0)$ and $7$ on $(0, \pi)$, and repeats with period $2\pi$. What value do you expect its Fourier series to take at $x = 0$?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'A sum of sines and cosines is continuous, so it cannot take both values at the jump. It settles halfway between them, at the average of the left and right limits.'
        exemplars:
          - problem: 'A square wave equals $0$ on $(-\pi, 0)$ and $4$ on $(0, \pi)$, and repeats with period $2\pi$. To what value does its Fourier series converge at $x = 0$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At a jump the series converges to the average of the left and right limits. The left limit at $x = 0$ is $0$ and the right limit is $4$. The average is $\frac{0 + 4}{2} = 2$.'
          - problem: 'To what value does the Fourier series of $f(x) = x$ on $(-\pi, \pi)$ converge at $x = \pi$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The periodic extension jumps at $x = \pi$: the left limit is $\pi$ and the right limit is $-\pi$. The series converges to their average, $\frac{\pi + (-\pi)}{2} = 0$.'
          - problem: 'A function has $f(x) = 3$ on $(-\pi, \frac{\pi}{2})$ and $f(x) = 7$ on $(\frac{\pi}{2}, \pi)$. To what value does its Fourier series converge at the jump $x = \frac{\pi}{2}$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left limit at $x = \frac{\pi}{2}$ is $3$ and the right limit is $7$. At a jump the series converges to the average, $\frac{3 + 7}{2} = 5$.'
          - problem: 'The function $f(x) = x^2 + x$ on $(-\pi, \pi)$ is extended with period $2\pi$. To what value does the Fourier series of the extension converge at $x = \pi$?'
            answer: 'pi^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Near $x = \pi$ from the left $f$ approaches $\pi^2 + \pi$. From the right the extension equals $f(-\pi) = \pi^2 - \pi$. The average of these two limits is $\pi^2$.'
          - problem: 'A switch signal equals $2$ volts for $-\pi < x < 0$ and $10$ volts for $0 < x < \pi$, and repeats with period $2\pi$. To what voltage does its Fourier series converge at $x = \pi$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = \pi$ the signal approaches $10$ from the left. From the right, the repeated signal restarts with the value $2$ it has just after $-\pi$. The series converges to the average $\frac{10 + 2}{2} = 6$.'
          - problem: 'Let $f(x) = \cos 2x$ on $(-\pi, \pi)$. To what value does its Fourier series converge at $x = \frac{\pi}{2}$?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The extension of $\cos 2x$ is continuous at $x = \frac{\pi}{2}$, so the series converges to the function value. That value is $\cos \pi = -1$.'
          - problem: 'The Fourier series of $f(x) = x$ on $(-\pi, \pi)$ is $\sum_{n=1}^{\infty} \frac{2(-1)^{n+1}}{n}\sin nx$. Setting $x = \frac{\pi}{2}$ turns it into $2S$, where $S = 1 - \frac{1}{3} + \frac{1}{5} - \frac{1}{7} + \cdots$. Find $S$.'
            answer: 'pi/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The extension is continuous at $x = \frac{\pi}{2}$, so the series equals $f\left(\frac{\pi}{2}\right) = \frac{\pi}{2}$. Only odd $n$ survive because $\sin\frac{n\pi}{2} = 0$ for even $n$, and the signs alternate, so the series equals $2S$. Then $2S = \frac{\pi}{2}$ and $S = \frac{\pi}{4}$.'
          - problem: 'To what value does the Fourier series of $f(x) = |x|$ on $(-\pi, \pi)$ converge at $x = \pi$?'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The periodic extension of $|x|$ is continuous at $x = \pi$, because the left limit $\pi$ equals the right limit $|-\pi| = \pi$. The series converges to $\pi$.'
        constraints: "piecewise-smooth f only; evaluation points are jumps or clean multiples of pi/2 where sin/cos values are exact"
    diagnostic_exemplar:
      problem: 'Find the Fourier coefficients $b_n$ of $f(x) = x$ on $(-\pi, \pi)$, and state the value to which its Fourier series converges at $x = \pi$.'
      answer: '$b_n = \dfrac{2(-1)^{n+1}}{n}$ (and every $a_n = 0$, since $f$ is odd); at $x = \pi$ the series converges to $0$.'
      answer_contract: {kind: none}
      solution_sketch: '$b_n = \frac{1}{\pi}\int_{-\pi}^{\pi} x\sin nx\,dx = \frac{2}{\pi}\int_0^{\pi} x\sin nx\,dx$, which by parts is $\frac{2(-1)^{n+1}}{n}$. At $x = \pi$ the periodic extension jumps from $\pi$ to $-\pi$, and the series converges to the average $0$.'
    anki_seeds:
      - front: 'Fourier coefficient formulas on $[-\pi, \pi]$?'
        back: '$a_n = \frac{1}{\pi}\int_{-\pi}^{\pi} f\cos nx\,dx$, $b_n = \frac{1}{\pi}\int_{-\pi}^{\pi} f\sin nx\,dx$, with constant term $a_0/2$.'
        type: basic
      - front: 'Key orthogonality fact behind the coefficient formulas?'
        back: '$\int_{-\pi}^{\pi}\sin mx\sin nx\,dx = 0$ for $m \neq n$ and $= \pi$ for $m = n \ge 1$ (same for cosines; mixed products always 0).'
        type: basic
      - front: "At a jump discontinuity, a Fourier series converges to..."
        back: "the midpoint of the left and right limits of the function."
        type: basic

  - id: fourier-sine-cosine-series
    name: Sine and Cosine Series
    core: false                # supplemental PDE wing: consumed only by the heat-equation
                               # topic, itself a terminal destination
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: fourier-series
        weight: 0.8
        key: true
      - id: even-odd-functions
        weight: 0.4
        key: true
      - id: integration-by-parts
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Even and odd shortcuts
        key_prerequisites: [even-odd-functions, fourier-series]
        step_check:
          step: 'the integral of an odd function over $(-\pi, \pi)$ is zero'
          question: 'Why is the integral of an odd function over $(-\pi, \pi)$ equal to zero?'
          options:
            - 'The interval has length $2\pi$, which is one full period of the sine'
            - 'The area on $(-\pi, 0)$ cancels the area on $(0, \pi)$'
            - 'An odd function is zero at $x = 0$, so nothing is left to integrate'
          answer: 'The area on $(-\pi, 0)$ cancels the area on $(0, \pi)$'
          why: 'For an odd function $g$, $g(-x) = -g(x)$. The area left of $0$ cancels the area right of $0$, so the total is $0$.'
        exemplars:
          - problem: 'Which Fourier coefficients of $f(x) = x^4$ on $(-\pi, \pi)$ vanish, the $a_n$ or the $b_n$?'
            answer: 'b_n'
            answer_contract: {"kind":"label","options":[["b_n","the b_n","all the b_n","all b_n","b_n vanish","the sine coefficients","sine","b"],["a_n","the a_n","all the a_n","all a_n","a_n vanish","the cosine coefficients","cosine","a"]]}
            solution_sketch: 'Since $(-x)^4 = x^4$, the function is even. Then $f(x)\sin nx$ is odd, because an even function times an odd function is odd. Its integral over $(-\pi, \pi)$ is $0$, so every $b_n$ vanishes.'
          - problem: 'Find the Fourier coefficient $a_1$ of $f(x) = x^2$ on $(-\pi, \pi)$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is even, so $a_1 = \frac{2}{\pi}\int_0^{\pi} x^2\cos x\,dx$. Integration by parts twice gives $\int_0^{\pi} x^2\cos x\,dx = -2\pi$. Multiply by $\frac{2}{\pi}$ to get $-4$.'
          - problem: 'Find the Fourier coefficient $b_1$ of $f(x) = x^3$ on $(-\pi, \pi)$.'
            answer: '2pi^2 - 12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is odd, so $b_1 = \frac{2}{\pi}\int_0^{\pi} x^3\sin x\,dx$. Integration by parts three times gives $\int_0^{\pi} x^3\sin x\,dx = \pi^3 - 6\pi$. Multiply by $\frac{2}{\pi}$ to get $2\pi^2 - 12$.'
          - problem: 'Find the constant coefficient $a_0 = \frac{1}{\pi}\int_{-\pi}^{\pi} f(x)\,dx$ of $f(x) = |x|$ on $(-\pi, \pi)$.'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function is even and $|x| = x$ on $(0, \pi)$, so $a_0 = \frac{2}{\pi}\int_0^{\pi} x\,dx$. The integral is $\frac{\pi^2}{2}$, and multiplying by $\frac{2}{\pi}$ gives $\pi$.'
          - problem: 'A periodic signal equals $x^2$ volts on $(-\pi, \pi)$. Find the coefficient of $\cos 3x$ in its Fourier series.'
            answer: '-4/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The signal is even, so the coefficient is $a_3 = \frac{2}{\pi}\int_0^{\pi} x^2\cos 3x\,dx$. Integration by parts gives $\frac{4(-1)^n}{n^2}$ for general $n$. For $n = 3$ this is $-\frac{4}{9}$.'
          - problem: 'Find the Fourier coefficient $b_1$ of $f(x) = x\cos x$ on $(-\pi, \pi)$.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x$ is odd and $\cos x$ is even, so $f$ is odd and $b_1 = \frac{2}{\pi}\int_0^{\pi} x\cos x\sin x\,dx$. Use $\sin x\cos x = \frac{1}{2}\sin 2x$; then $\int_0^{\pi}\frac{x}{2}\sin 2x\,dx = -\frac{\pi}{4}$. Multiply by $\frac{2}{\pi}$ to get $-\frac{1}{2}$.'
          - problem: 'Find the constant coefficient $a_0 = \frac{1}{\pi}\int_{-\pi}^{\pi} f(x)\,dx$ of $f(x) = x\sin x$ on $(-\pi, \pi)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function $x\sin x$ is even, so $a_0 = \frac{2}{\pi}\int_0^{\pi} x\sin x\,dx$. Integration by parts gives $\int_0^{\pi} x\sin x\,dx = \pi$. Multiply by $\frac{2}{\pi}$ to get $2$.'
          - problem: 'Which Fourier coefficients of $f(x) = x^3$ on $(-\pi, \pi)$ vanish, the $a_n$ or the $b_n$?'
            answer: 'a_n'
            answer_contract: {"kind":"label","options":[["b_n","the b_n","all the b_n","all b_n","b_n vanish","the sine coefficients","sine","b"],["a_n","the a_n","all the a_n","all a_n","a_n vanish","the cosine coefficients","cosine","a"]]}
            solution_sketch: 'Since $(-x)^3 = -x^3$, the function is odd. Then $f(x)\cos nx$ is odd, because an odd function times an even function is odd. Its integral over $(-\pi, \pi)$ is $0$, so every $a_n$ vanishes.'
          - problem: 'An alternating voltage is described over one period by $v(x) = |x|$ volts on $(-\pi, \pi)$. Find the coefficient of $\cos x$ in its Fourier series.'
            answer: '-4/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The voltage is even, so $a_1 = \frac{2}{\pi}\int_0^{\pi} x\cos x\,dx$. Integration by parts gives $\int_0^{\pi} x\cos x\,dx = -2$. Multiply by $\frac{2}{\pi}$ to get $-\frac{4}{\pi}$.'
          - problem: 'Let $f$ be an odd function on $(-\pi, \pi)$ with $\int_0^{\pi} f(x)\sin 3x\,dx = 5$. Find the Fourier coefficient $b_3$.'
            answer: '10/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f$ is odd, $f(x)\sin 3x$ is even, so $b_3 = \frac{1}{\pi}\int_{-\pi}^{\pi} f(x)\sin 3x\,dx = \frac{2}{\pi}\int_0^{\pi} f(x)\sin 3x\,dx$. Substitute the given value $5$ to get $b_3 = \frac{2}{\pi}\cdot 5 = \frac{10}{\pi}$.'
          - problem: 'Let $f$ be an even function on $(-\pi, \pi)$ with $\int_0^{\pi} f(x)\,dx = 4$. Find the constant coefficient $a_0 = \frac{1}{\pi}\int_{-\pi}^{\pi} f(x)\,dx$.'
            answer: '8/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $f$ is even, the integral over $(-\pi, \pi)$ is twice the integral over $(0, \pi)$, which is $2\cdot 4 = 8$. Divide by $\pi$ to get $a_0 = \frac{8}{\pi}$.'
          - problem: 'Sam says the Fourier coefficient $b_2$ of $f(x) = x^2$ on $(-\pi, \pi)$ equals $1$. What is the correct value?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function $x^2$ is even, so $x^2\sin 2x$ is odd. The integral of an odd function over $(-\pi, \pi)$ is $0$, so $b_2 = 0$. Sam found the value of $a_2$ instead.'
        constraints: "f a power of x, |x|, or a product of one power and one sine/cosine — or an unspecified f known only to be even or odd, for half-interval rewrites of the coefficient formulas; justification must name even/odd parity"
      - id: kp2
        name: "Half-range sine expansions on $[0, L]$"
        key_prerequisites: [fourier-series, integration-by-parts]
        step_check:
          step: 'Let $u = x$ and $dv = \sin(n\pi x) dx$'
          question: 'Why do we choose $u = x$ and $dv = \sin(n\pi x)\,dx$ for the integration by parts?'
          options:
            - 'Differentiating $x$ gives $du = dx$, and the sine integrates easily'
            - 'The rule requires $u$ to be the factor that has the larger exponent'
            - 'Choosing $u = \sin(n\pi x)$ instead would make the integral diverge here'
          answer: 'Differentiating $x$ gives $du = dx$, and the sine integrates easily'
          why: 'Differentiating $x$ removes the variable factor, and $\sin(n\pi x)$ has the easy antiderivative $-\frac{\cos(n\pi x)}{n\pi}$. The new integral is then simple.'
        try_first:
          problem: 'Find the half-range sine coefficient $b_1$ of $f(x) = 3$ on $(0, \pi)$.'
          answer_contract: {"kind":"exact"}
          answer: '12/pi'
          reveal: 'The sine series on $(0, L)$ only uses sines, which are odd, so a constant is rebuilt from sines. The coefficients come from the integral of $f(x)\sin\frac{n\pi x}{L}$ over $(0, L)$ with the factor $\frac{2}{L}$.'
        exemplars:
          - problem: 'The half-range sine coefficients on $(0, L)$ are $b_n = \frac{2}{L}\int_0^L f(x)\sin\frac{n\pi x}{L}\,dx$. Find $b_3$ for $f(x) = 1$ on $(0, \pi)$.'
            answer: '4/(3pi)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $L = \pi$ and $f = 1$, $b_3 = \frac{2}{\pi}\int_0^{\pi}\sin 3x\,dx$. The integral is $\frac{1 - \cos 3\pi}{3} = \frac{2}{3}$. So $b_3 = \frac{2}{\pi}\cdot\frac{2}{3} = \frac{4}{3\pi}$.'
          - problem: 'The half-range sine coefficients on $(0, L)$ are $b_n = \frac{2}{L}\int_0^L f(x)\sin\frac{n\pi x}{L}\,dx$. Find $b_2$ for $f(x) = x$ on $(0, 1)$.'
            answer: '-1/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $L = 1$, $b_n = 2\int_0^1 x\sin n\pi x\,dx$. Integration by parts gives $\int_0^1 x\sin 2\pi x\,dx = -\frac{1}{2\pi}$. Multiply by $2$ to get $b_2 = -\frac{1}{\pi}$.'
          - problem: 'The half-range sine coefficients on $(0, L)$ are $b_n = \frac{2}{L}\int_0^L f(x)\sin\frac{n\pi x}{L}\,dx$. Find $b_1$ for $f(x) = 2$ on $(0, 1)$.'
            answer: '8/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $L = 1$ and $f = 2$, $b_1 = 4\int_0^1\sin\pi x\,dx$. The integral is $\frac{2}{\pi}$. So $b_1 = \frac{8}{\pi}$.'
          - problem: 'The half-range sine coefficients on $(0, L)$ are $b_n = \frac{2}{L}\int_0^L f(x)\sin\frac{n\pi x}{L}\,dx$. Find $b_1$ for $f(x) = x$ on $(0, \pi)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $L = \pi$, $b_1 = \frac{2}{\pi}\int_0^{\pi} x\sin x\,dx$. Integration by parts gives $\int_0^{\pi} x\sin x\,dx = \pi$. Multiply by $\frac{2}{\pi}$ to get $2$.'
          - problem: 'The half-range sine coefficients on $(0, L)$ are $b_n = \frac{2}{L}\int_0^L f(x)\sin\frac{n\pi x}{L}\,dx$. Find $b_2$ for $f(x) = x$ on $(0, \pi)$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $L = \pi$, $b_2 = \frac{2}{\pi}\int_0^{\pi} x\sin 2x\,dx$. Integration by parts gives $\int_0^{\pi} x\sin 2x\,dx = -\frac{\pi}{2}$. Multiply by $\frac{2}{\pi}$ to get $-1$.'
          - problem: 'The half-range sine coefficients on $(0, L)$ are $b_n = \frac{2}{L}\int_0^L f(x)\sin\frac{n\pi x}{L}\,dx$. Write the first two nonzero terms of the sine series of $f(x) = x$ on $(0, 1)$.'
            answer: '2sin(pi x)/pi - sin(2pi x)/pi'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'With $L = 1$, $b_n = 2\int_0^1 x\sin n\pi x\,dx = \frac{2(-1)^{n+1}}{n\pi}$ by parts. So $b_1 = \frac{2}{\pi}$ and $b_2 = -\frac{1}{\pi}$. The first two terms are $\frac{2}{\pi}\sin\pi x - \frac{1}{\pi}\sin 2\pi x$.'
          - problem: 'The half-range sine coefficients on $(0, L)$ are $b_n = \frac{2}{L}\int_0^L f(x)\sin\frac{n\pi x}{L}\,dx$. A rod of length $4$ cm has its ends held at $0$ and starts at a uniform temperature of $10$ degrees. Find the coefficient of $\sin\frac{\pi x}{4}$ in its sine series.'
            answer: '40/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $L = 4$ and $f = 10$, so $b_1 = \frac{2}{4}\int_0^4 10\sin\frac{\pi x}{4}\,dx = 5\int_0^4\sin\frac{\pi x}{4}\,dx$. The integral $\int_0^4\sin\frac{\pi x}{4}\,dx$ equals $\frac{8}{\pi}$, so $b_1 = 5\cdot\frac{8}{\pi} = \frac{40}{\pi}$.'
          - problem: 'The half-range sine coefficients on $(0, L)$ are $b_n = \frac{2}{L}\int_0^L f(x)\sin\frac{n\pi x}{L}\,dx$. A rod of length $2$ m has its ends held at $0$ and starts with temperature $f(x) = x$ degrees at distance $x$ metres from one end. Find the coefficient of $\sin\frac{\pi x}{2}$ in its sine series.'
            answer: '4/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $L = 2$, so $b_1 = \frac{2}{2}\int_0^2 x\sin\frac{\pi x}{2}\,dx$. Integration by parts gives $\int_0^2 x\sin\frac{\pi x}{2}\,dx = \frac{4}{\pi}$. So $b_1 = \frac{4}{\pi}$.'
          - problem: 'The half-range sine coefficients on $(0, L)$ are $b_n = \frac{2}{L}\int_0^L f(x)\sin\frac{n\pi x}{L}\,dx$. For $f(x) = 1$ on $(0, \pi)$, how many times larger is $b_1$ than $b_3$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $f = 1$, $b_n = \frac{2(1 - (-1)^n)}{n\pi}$, so $b_1 = \frac{4}{\pi}$ and $b_3 = \frac{4}{3\pi}$. Divide: $\frac{4/\pi}{4/(3\pi)} = 3$.'
          - problem: 'The half-range sine coefficients on $(0, L)$ are $b_n = \frac{2}{L}\int_0^L f(x)\sin\frac{n\pi x}{L}\,dx$. Dana finds $b_1$ for $f(x) = 1$ on $(0, \pi)$ but uses the factor $\frac{1}{\pi}$ in front of the integral. She gets $\frac{2}{\pi}$. What is the correct value?'
            answer: '4/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The factor in front must be $\frac{2}{L} = \frac{2}{\pi}$, not $\frac{1}{\pi}$. The integral $\int_0^{\pi}\sin x\,dx$ equals $2$, so $b_1 = \frac{2}{\pi}\cdot 2 = \frac{4}{\pi}$. Dana got half of this value.'
        constraints: "L in {1, 2, 4, pi}; f constant or linear; the general-L formula b_n = (2/L) integral of f sin(n pi x / L) must be quoted before use"
      - id: kp3
        name: "Half-range cosine expansions on $[0, L]$"
        key_prerequisites: [fourier-series, integration-by-parts]
        step_check:
          step: 'because $\sin(n \pi) = 0$ and $\sin(0) = 0$'
          question: 'Why does the boundary term vanish?'
          options:
            - 'The factor $2x$ is zero at both ends of the interval, $x=0$ and $x=1$'
            - 'The cosine $\cos(n\pi x)$ equals $0$ at both ends of the interval'
            - 'Any integer multiple of $\pi$ has sine $0$, and $\sin 0 = 0$'
          answer: 'Any integer multiple of $\pi$ has sine $0$, and $\sin 0 = 0$'
          why: 'The boundary term contains $\sin(n\pi x)$. At $x = 1$ it is $\sin(n\pi) = 0$ for every integer $n$, and at $x = 0$ it is $\sin 0 = 0$.'
        exemplars:
          - problem: 'The half-range cosine coefficient $a_0$ on $(0, 1)$ is $a_0 = 2\int_0^1 f(x)\,dx$. Find $a_0$ for $f(x) = 2x$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compute $a_0 = 2\int_0^1 2x\,dx = 2\left[x^2\right]_0^1$. This equals $2\cdot 1$, so $a_0 = 2$.'
          - problem: 'The half-range cosine coefficients on $(0, 1)$ are $a_n = 2\int_0^1 f(x)\cos n\pi x\,dx$ for $n \ge 1$. Find $a_1$ for $f(x) = x$.'
            answer: '-4/pi^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Integration by parts gives $\int_0^1 x\cos\pi x\,dx = \frac{\cos\pi - 1}{\pi^2} = -\frac{2}{\pi^2}$. Multiply by $2$ to get $a_1 = -\frac{4}{\pi^2}$.'
          - problem: 'The half-range cosine coefficient $a_0$ on $(0, \pi)$ is $a_0 = \frac{2}{\pi}\int_0^{\pi} f(x)\,dx$. Find $a_0$ for $f(x) = 3$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compute $a_0 = \frac{2}{\pi}\int_0^{\pi} 3\,dx = \frac{2}{\pi}\cdot 3\pi$. The factors of $\pi$ cancel, so $a_0 = 6$.'
          - problem: 'The half-range cosine coefficients on $(0, 1)$ are $a_n = 2\int_0^1 f(x)\cos n\pi x\,dx$ for $n \ge 1$. Find $a_3$ for $f(x) = 1 - x$.'
            answer: '4/(9pi^2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integral of $\cos 3\pi x$ over $(0, 1)$ is $0$. The integral of $x\cos 3\pi x$ is $\frac{\cos 3\pi - 1}{9\pi^2} = -\frac{2}{9\pi^2}$, so $\int_0^1 (1-x)\cos 3\pi x\,dx = \frac{2}{9\pi^2}$. Multiply by $2$ to get $\frac{4}{9\pi^2}$.'
          - problem: 'The half-range cosine coefficients on $(0, \pi)$ are $a_n = \frac{2}{\pi}\int_0^{\pi} f(x)\cos nx\,dx$ for $n \ge 1$. Find $a_1$ for $f(x) = x + 2$.'
            answer: '-4/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the integral. The part $\int_0^{\pi} x\cos x\,dx$ equals $-2$ by parts, and $2\int_0^{\pi}\cos x\,dx = 0$. So $a_1 = \frac{2}{\pi}(-2) = -\frac{4}{\pi}$.'
          - problem: 'On $(0, 1)$ the function $f(x) = mx$ has first half-range cosine coefficient $a_1 = 2\int_0^1 mx\cos\pi x\,dx$. If $a_1 = -\frac{8}{\pi^2}$, find $m$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\int_0^1 x\cos\pi x\,dx = -\frac{2}{\pi^2}$, we get $a_1 = -\frac{4m}{\pi^2}$. Set $-\frac{4m}{\pi^2} = -\frac{8}{\pi^2}$. Divide both sides by $-\frac{4}{\pi^2}$ to get $m = 2$.'
          - problem: 'The half-range cosine series of $f(x) = x$ on $(0, 1)$ represents the even periodic extension of $f$. Is that extension continuous at $x = 0$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is continuous","continuous"],["no","it has a jump","jump"]]}
            solution_sketch: 'On $(-1, 1)$ the even extension equals $|x|$. The function $|x|$ has no break at $x = 0$, because both one-sided limits are $0$. So the extension is continuous there.'
          - problem: 'The half-range cosine series of $f(x) = x$ on $(0, 1)$ converges to the even periodic extension of $f$. What value does the series have at $x = -\frac{1}{4}$?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The extension is even, so its value at $x = -\frac{1}{4}$ equals its value at $x = \frac{1}{4}$. On $(0, 1)$ the function is $f(x) = x$, so the value is $\frac{1}{4}$.'
          - problem: 'A rod of length $1$ m has insulated ends and starts at temperature $f(x) = 20x$ degrees at distance $x$ metres from one end. Its cosine series has $a_n = 2\int_0^1 f(x)\cos n\pi x\,dx$. Find $a_1$.'
            answer: '-80/pi^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $a_1 = 2\int_0^1 20x\cos\pi x\,dx = 40\int_0^1 x\cos\pi x\,dx$. The integral is $-\frac{2}{\pi^2}$, so $a_1 = -\frac{80}{\pi^2}$.'
          - problem: 'A rod of length $\pi$ cm has insulated ends and starts at a uniform temperature of $40$ degrees. Its cosine series has $a_0 = \frac{2}{\pi}\int_0^{\pi} f(x)\,dx$. Find $a_0$.'
            answer: '80'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compute $a_0 = \frac{2}{\pi}\int_0^{\pi} 40\,dx = \frac{2}{\pi}\cdot 40\pi$. The factors of $\pi$ cancel, so $a_0 = 80$. The constant term of the series is $\frac{a_0}{2} = 40$, the average temperature.'
          - problem: 'Sam computes $a_2 = 2\int_0^1 x\cos 2\pi x\,dx$ for $f(x) = x$ on $(0, 1)$ and gets $-\frac{1}{\pi^2}$. What is the correct value?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By parts, $\int_0^1 x\cos 2\pi x\,dx = \frac{\cos 2\pi - 1}{4\pi^2}$. Since $\cos 2\pi = 1$, this is $0$, so $a_2 = 0$. Only odd $n$ give nonzero coefficients here.'
        constraints: "L in {1, pi}; f constant or linear; coefficients must come out as clean multiples of 1/n^2 or (± signs handled via (-1)^n, never a bare plus-minus in an answer)"
    diagnostic_exemplar:
      problem: 'Expand $f(x) = x$ on $(0, \pi)$ in a half-range cosine series: give $a_0$ and $a_n$.'
      answer: '$a_0 = \pi$ and $a_n = \dfrac{2\left((-1)^n - 1\right)}{\pi n^2}$ (so $-\frac{4}{\pi n^2}$ for odd $n$, and $0$ for even $n$).'
      answer_contract: {kind: none}
      solution_sketch: 'The cosine series uses the even extension, so $a_n = \frac{2}{\pi}\int_0^{\pi} x\cos nx\,dx$; integrating by parts gives $\frac{2((-1)^n - 1)}{\pi n^2}$, and $a_0 = \frac{2}{\pi}\int_0^{\pi} x\,dx = \pi$.'
    anki_seeds:
      - front: "Odd function on (-L, L): its Fourier series contains..."
        back: "only sines (all $a_n = 0$); an even function gives only cosines."
        type: basic
      - front: 'Half-range sine coefficients on $[0, L]$?'
        back: '$b_n = \dfrac{2}{L}\int_0^L f(x)\sin\dfrac{n\pi x}{L}\,dx$'
        type: basic

  - id: heat-equation-separation-of-variables
    name: The Heat Equation by Separation of Variables
    core: false                # the course's terminal destination: cashes in the
                               # eigenvalue machinery of boundary-value-problems-intro
                               # (itself supplemental) and nothing builds on it
    difficulty: 0.85
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: boundary-value-problems-intro
        weight: 0.6
        key: true
      - id: fourier-sine-cosine-series
        weight: 0.6
        key: true
      - id: partial-derivatives
        weight: 0.3
        key: false
      - id: separable-equations
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: "Separating $u(x,t) = X(x)T(t)$"
        key_prerequisites: [partial-derivatives, boundary-value-problems-intro]
        step_check:
          step: 'both must equal a constant $-\lambda$'
          question: 'Why must both sides of $\frac{T''}{4T} = \frac{X''''}{X}$ equal the same constant?'
          options:
            - 'One side depends only on $t$ and the other only on $x$, so neither can change'
            - 'The separation constant $-\lambda$ is defined as the value of $X''''/X$ at $x = 0$'
            - 'The heat equation forces $T''$ and $X''''$ to be equal at every point'
          answer: 'One side depends only on $t$ and the other only on $x$, so neither can change'
          why: 'Changing $x$ alone changes only the right side, and changing $t$ alone changes only the left side. Since they stay equal, each side must be constant.'
        exemplars:
          - problem: 'Substituting $u(x,t) = X(x)T(t)$ into $u_t = 4u_{xx}$ gives $\frac{T''}{4T} = \frac{X''''}{X}$, and both sides equal a constant $-\lambda$. Which pair of ordinary differential equations follows? (a) $X'''' + \lambda X = 0$ and $T'' + 4\lambda T = 0$; (b) $X'''' - \lambda X = 0$ and $T'' - 4\lambda T = 0$; (c) $X'''' + \lambda X = 0$ and $T'' - 4\lambda T = 0$; (d) $X'''' + 4\lambda X = 0$ and $T'' + \lambda T = 0$.'
            answer: 'a'
            answer_contract: {"kind":"label","options":[["a","(a)","option a"],["b","(b)","option b"],["c","(c)","option c"],["d","(d)","option d"]]}
            solution_sketch: 'From $\frac{T''}{4T} = -\lambda$ we get $T'' = -4\lambda T$, so $T'' + 4\lambda T = 0$. From $\frac{X''''}{X} = -\lambda$ we get $X'''' + \lambda X = 0$. Option (b) has the wrong sign on both constants, option (c) has the wrong sign in the $T$ equation, and option (d) moves the factor $4$ to the wrong equation. The correct choice is (a).'
          - problem: 'A rod of length $6$ cm has both ends held at temperature $0$. Separating $u = X(x)T(t)$ in the heat equation with separation constant $-\lambda$ gives $X'''' + \lambda X = 0$ with $X(0) = X(6) = 0$. Find the smallest eigenvalue $\lambda_1$.'
            answer: 'pi^2/36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Nonzero solutions of $X'''' + \lambda X = 0$ with $X(0) = X(L) = 0$ are $X_n = \sin\frac{n\pi x}{L}$ with $\lambda_n = \frac{n^2\pi^2}{L^2}$. For $L = 6$ and $n = 1$ this gives $\lambda_1 = \frac{\pi^2}{36}$.'
          - problem: 'On $(0, \pi)$ with $u(0,t) = u(\pi,t) = 0$, the product $u(x,t) = e^{-12t}\sin 2x$ solves $u_t = ku_{xx}$. Find $k$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compute $u_t = -12u$ and $u_{xx} = -4u$. Then $u_t = ku_{xx}$ gives $-12u = -4ku$. Divide by $-4u$ to get $k = 3$.'
          - problem: 'A rod of length $L$ has both ends held at $0$. Its eigenvalue problem is $X'''' + \lambda X = 0$ with $X(0) = X(L) = 0$, and the smallest eigenvalue is $\frac{\pi^2}{25}$. Find $L$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The smallest eigenvalue is $\lambda_1 = \frac{\pi^2}{L^2}$. Set $\frac{\pi^2}{L^2} = \frac{\pi^2}{25}$, so $L^2 = 25$. The length is positive, so $L = 5$.'
          - problem: 'The eigenvalue problem $X'''' + \lambda X = 0$ with $X(0) = X(\pi) = 0$ comes from the heat equation on $(0, \pi)$. What is the smallest eigenvalue larger than $60$?'
            answer: '64'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The eigenvalues are $\lambda_n = n^2$ for $n = 1, 2, 3, \dots$. Since $7^2 = 49$ is below $60$ and $8^2 = 64$ is above it, the smallest eigenvalue larger than $60$ is $64$.'
          - problem: 'Separating the heat equation on $(0, L)$ with zero ends gives the eigenvalue problem $X'''' + \lambda X = 0$ with $X(0) = X(L) = 0$. The third eigenvalue is $4\pi^2$. Find $L$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The third eigenvalue is $\lambda_3 = \frac{9\pi^2}{L^2}$. Set $\frac{9\pi^2}{L^2} = 4\pi^2$, so $L^2 = \frac{9}{4}$. Taking the positive root gives $L = \frac{3}{2}$.'
          - problem: 'On $(0, \pi)$ with zero ends, $u(x,t) = e^{-3t}\sin 2x$ solves $u_t = ku_{xx}$. Find $k$.'
            answer: '3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compute $u_t = -3u$ and $u_{xx} = -4u$. Then $u_t = ku_{xx}$ gives $-3u = -4ku$. Divide by $-4u$ to get $k = \frac{3}{4}$.'
          - problem: 'Sam separates $u_t = 5u_{xx}$ on $(0, \pi)$ with $u(0,t) = u(\pi,t) = 0$ and says the smallest eigenvalue of the $X$-problem is $5$. What is the correct value?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The factor $5$ goes into the $T$ equation, $T'' + 5\lambda T = 0$. The $X$-problem is $X'''' + \lambda X = 0$ with $X(0) = X(\pi) = 0$, whose eigenvalues are $n^2$. The smallest is $1$.'
        constraints: "Dirichlet boundary conditions only; separation constant written -lambda; the X-equation must be identified as the eigenvalue problem from boundary-value-problems-intro"
      - id: kp2
        name: Initial data that is already a sine combination
        key_prerequisites: [boundary-value-problems-intro, fourier-sine-cosine-series]
        step_check:
          step: '$\sin(\pi x) = \sin\left(\frac{2\pi x}{2}\right)$'
          question: 'Why does $\sin(\pi x)$ count as the mode $n = 2$ on $(0, 2)$?'
          options:
            - 'The number $n$ is the coefficient of $x$ inside the sine, and here it is $1$'
            - 'Every term after the first term of the initial data is called mode $2$'
            - 'Modes are $\sin\frac{n\pi x}{L}$, and $L = 2$, $n = 2$ gives $\sin\pi x$'
          answer: 'Modes are $\sin\frac{n\pi x}{L}$, and $L = 2$, $n = 2$ gives $\sin\pi x$'
          why: 'On $(0, L)$ the modes are $\sin\frac{n\pi x}{L}$. With $L = 2$ and $n = 2$ this is $\sin\frac{2\pi x}{2} = \sin\pi x$.'
        try_first:
          problem: 'A rod on $(0, \pi)$ has ends held at $0$ and obeys $u_t = u_{xx}$. It starts at $u(x,0) = 3\sin x$. What is the temperature at the middle, $x = \frac{\pi}{2}$, at time $t = \ln 2$?'
          answer_contract: {"kind":"exact"}
          answer: '3/2'
          reveal: 'The profile $\sin x$ keeps its shape and only its size changes, by the factor $e^{-t}$. At $t = \ln 2$ the factor is $\frac{1}{2}$, so the middle temperature halves.'
        exemplars:
          - problem: 'Solve $u_t = u_{xx}$ on $(0, \pi)$ with $u(0,t) = u(\pi,t) = 0$ and $u(x,0) = 2\sin x + 5\sin 3x$.'
            answer: '2e^(-t)sin(x)+5e^(-9t)sin(3x)'
            answer_contract: {"kind":"function","vars":["x","t"]}
            solution_sketch: 'Each mode $\sin nx$ decays by the factor $e^{-n^2 t}$ when $k = 1$ and $L = \pi$. The mode $n = 1$ has rate $1$, and the mode $n = 3$ has rate $9$. So $u(x,t) = 2e^{-t}\sin x + 5e^{-9t}\sin 3x$.'
          - problem: 'Solve $u_t = 4u_{xx}$ on $(0, 2)$ with $u(0,t) = u(2,t) = 0$ and $u(x,0) = 2\sin\frac{\pi x}{2} + \sin \pi x$.'
            answer: '2e^(-pi^2 t) sin(pi x/2) + e^(-4 pi^2 t) sin(pi x)'
            answer_contract: {"kind":"function","vars":["x","t"]}
            solution_sketch: 'The modes are $\sin\frac{n\pi x}{2}$, so $\sin\frac{\pi x}{2}$ is $n = 1$ and $\sin\pi x$ is $n = 2$. The decay rate is $4\left(\frac{n\pi}{2}\right)^2$, which is $\pi^2$ for $n = 1$ and $4\pi^2$ for $n = 2$. So $u = 2e^{-\pi^2 t}\sin\frac{\pi x}{2} + e^{-4\pi^2 t}\sin\pi x$.'
          - problem: 'Solve $u_t = 2u_{xx}$ on $(0, \pi)$ with $u(0,t) = u(\pi,t) = 0$ and $u(x,0) = 7\sin 2x$.'
            answer: '7e^(-8t)sin(2x)'
            answer_contract: {"kind":"function","vars":["x","t"]}
            solution_sketch: 'The decay rate of $\sin nx$ is $kn^2$. With $k = 2$ and $n = 2$ the rate is $8$. So $u(x,t) = 7e^{-8t}\sin 2x$.'
          - problem: 'A metal rod of length $\pi$ has its ends held at $0$ and obeys $u_t = 3u_{xx}$. Its initial temperature is $u(x,0) = 4\sin 2x - \sin 5x$. At what rate does the slower-decaying mode decay, that is, what is the number $r$ in its factor $e^{-rt}$?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mode $\sin nx$ decays at rate $3n^2$. The mode $n = 2$ has rate $12$ and the mode $n = 5$ has rate $75$. The slower mode is $n = 2$, so $r = 12$.'
          - problem: 'A rod of length $\pi$ has its ends held at $0$ and obeys $u_t = 2u_{xx}$. It starts at $u(x,0) = 5\sin 2x + 3\sin 5x$. What is the coefficient of $\sin 2x$ in $u(x,t)$ at $t = 0.1$, to two decimal places?'
            answer: '2.25'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The mode $\sin 2x$ decays at rate $2\cdot 4 = 8$. At $t = 0.1$ its coefficient is $5e^{-0.8}$. Numerically $5e^{-0.8} = 2.2466$, which is $2.25$ to two decimal places.'
          - problem: 'Solve $u_t = 5u_{xx}$ on $(0, \pi)$ with $u(0,t) = u(\pi,t) = 0$ and $u(x,0) = 2\sin x - 6\sin 3x$.'
            answer: '2e^(-5t)sin(x)-6e^(-45t)sin(3x)'
            answer_contract: {"kind":"function","vars":["x","t"]}
            solution_sketch: 'The decay rate of $\sin nx$ is $5n^2$. The mode $n = 1$ has rate $5$, and the mode $n = 3$ has rate $45$. So $u(x,t) = 2e^{-5t}\sin x - 6e^{-45t}\sin 3x$.'
          - problem: 'On $(0, 1)$ with zero ends and $u_t = 4u_{xx}$, the initial temperature is $u(x,0) = \sin 2\pi x + 3\sin 5\pi x$. How many times faster does the $\sin 5\pi x$ mode decay than the $\sin 2\pi x$ mode?'
            answer: '25/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The decay rate of $\sin n\pi x$ is $4n^2\pi^2$. For $n = 2$ it is $16\pi^2$, and for $n = 5$ it is $100\pi^2$. The ratio is $\frac{100\pi^2}{16\pi^2} = \frac{25}{4}$.'
          - problem: 'A rod of length $\pi$ has its ends held at $0$ and obeys $u_t = 2u_{xx}$. It starts at $u(x,0) = 6\sin 2x$. After what time $t$ has the amplitude of this mode fallen to half its starting value? Give $t$ to three decimal places.'
            answer: '0.087'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'The amplitude at time $t$ is $6e^{-8t}$. Set $6e^{-8t} = 3$, so $e^{-8t} = \frac{1}{2}$. Taking logarithms gives $t = \frac{\ln 2}{8}$, which is $0.087$ to three decimal places.'
          - problem: 'Sam solves $u_t = 3u_{xx}$ on $(0, \pi)$ with $u(0,t) = u(\pi,t) = 0$ and $u(x,0) = \sin 2x$, and writes $u(x,t) = e^{-2t}\sin 2x$. What is the correct solution?'
            answer: 'e^(-12t)sin(2x)'
            answer_contract: {"kind":"function","vars":["x","t"]}
            solution_sketch: 'The decay rate of $\sin nx$ is $kn^2$, not $n$. With $k = 3$ and $n = 2$ the rate is $12$. So $u(x,t) = e^{-12t}\sin 2x$.'
        constraints: "initial data a combination of at most two sine modes; k and L chosen so decay rates are clean multiples of 1 or pi^2"
      - id: kp3
        name: General initial data via sine series
        key_prerequisites: [fourier-sine-cosine-series]
        step_check:
          step: 'where $b_n$ are the Fourier sine coefficients of the initial data'
          question: 'Why are the numbers $b_n$ the Fourier sine coefficients of the initial data?'
          options:
            - 'The exponential factors cancel the sine terms as time increases, so only $b_n$ remain'
            - 'At $t = 0$ every exponential equals $1$, leaving the sine series of $u(x,0)$'
            - 'Sine series are the only series that the heat equation allows at every time'
          answer: 'At $t = 0$ every exponential equals $1$, leaving the sine series of $u(x,0)$'
          why: 'Setting $t = 0$ makes every exponential factor $1$. Then $u(x,0) = \sum b_n\sin(n\pi x)$, so the $b_n$ are found by the sine-coefficient formula.'
        exemplars:
          - problem: 'A rod on $(0, 1)$ has its ends held at $0$ and obeys $u_t = u_{xx}$. It starts at $u(x,0) = 50x$. The solution has the form $u(x,t) = \sum b_n e^{-n^2\pi^2 t}\sin n\pi x$. Find $b_1$.'
            answer: '100/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $t = 0$ the series is the sine series of $50x$, so $b_1 = 2\int_0^1 50x\sin\pi x\,dx$. The integral $\int_0^1 x\sin\pi x\,dx$ equals $\frac{1}{\pi}$, so $b_1 = \frac{100}{\pi}$.'
          - problem: 'A rod of length $\pi$ has its ends held at $0$ and obeys $u_t = u_{xx}$. It starts at $u(x,0) = x$. The solution has the form $u(x,t) = \sum b_n e^{-n^2 t}\sin nx$. Find $b_1$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $t = 0$ the series is the sine series of $x$, so $b_1 = \frac{2}{\pi}\int_0^{\pi} x\sin x\,dx$. The integral equals $\pi$, so $b_1 = 2$.'
          - problem: 'A rod on $(0, \pi)$ has its ends held at $0$ and obeys $u_t = u_{xx}$. It starts at the uniform temperature $u(x,0) = 60$. The solution has the form $u(x,t) = \sum b_n e^{-n^2 t}\sin nx$. Find $b_1$.'
            answer: '240/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $t = 0$ the series is the sine series of $60$, so $b_1 = \frac{2}{\pi}\int_0^{\pi} 60\sin x\,dx$. The integral equals $120$, so $b_1 = \frac{240}{\pi}$.'
          - problem: 'A rod on $(0, \pi)$ with $u_t = u_{xx}$ and ends held at $0$ starts at $u(x,0) = x$. In the solution $u(x,t) = \sum b_n e^{-n^2 t}\sin nx$, find $b_3$.'
            answer: '2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By parts, $b_n = \frac{2}{\pi}\int_0^{\pi} x\sin nx\,dx = \frac{2(-1)^{n+1}}{n}$. For $n = 3$ the sign is positive, so $b_3 = \frac{2}{3}$.'
          - problem: 'A rod on $(0, \pi)$ with $u_t = u_{xx}$ and ends held at $0$ starts at $u(x,0) = x$. In the solution $u(x,t) = \sum b_n e^{-n^2 t}\sin nx$, find $b_2$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By parts, $b_n = \frac{2(-1)^{n+1}}{n}$. For $n = 2$ the sign is negative, so $b_2 = -\frac{2}{2} = -1$.'
          - problem: 'A rod on $(0, 1)$ has its ends held at $0$ and starts at the uniform temperature $u(x,0) = 80$. In the solution $u(x,t) = \sum b_n e^{-n^2\pi^2 t}\sin n\pi x$, how many times larger is $b_1$ than $b_3$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For a constant $80$, $b_n = 160\int_0^1\sin n\pi x\,dx = \frac{160(1 - (-1)^n)}{n\pi}$. So $b_1 = \frac{320}{\pi}$ and $b_3 = \frac{320}{3\pi}$. The ratio is $3$.'
          - problem: 'A rod on $(0, 1)$ has its ends held at $0$ and obeys $u_t = u_{xx}$. It starts at $u(x,0) = 50x$. What is the coefficient of $\sin\pi x$ in $u(x,t)$ at $t = 0.1$, to one decimal place?'
            answer: '11.9'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'Here $b_1 = \frac{100}{\pi}$, and the mode $\sin\pi x$ decays by the factor $e^{-\pi^2 t}$. At $t = 0.1$ the coefficient is $\frac{100}{\pi}e^{-0.1\pi^2}$. Numerically this is $11.86$, which is $11.9$ to one decimal place.'
          - problem: 'A rod of length $\pi$ has its ends held at $0$ and obeys $u_t = 2u_{xx}$. It starts at $u(x,0) = x$. After what time does the coefficient of $\sin x$ fall to half its starting value? Give the time to two decimal places.'
            answer: '0.35'
            answer_contract: {"kind":"approx","decimals":2}
            solution_sketch: 'The mode $\sin x$ decays at rate $2\cdot 1^2 = 2$, so its coefficient is $2e^{-2t}$. Set $e^{-2t} = \frac{1}{2}$, so $t = \frac{\ln 2}{2}$. Numerically this is $0.35$ to two decimal places.'
          - problem: 'Sam finds the coefficient $b_1$ for a rod on $(0, \pi)$ that starts at $u(x,0) = 5$. He computes $\int_0^{\pi} 5\sin x\,dx = 10$ and states $b_1 = 10$. What is the correct value?'
            answer: '20/pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sine coefficient has the factor $\frac{2}{\pi}$ in front of the integral. Sam stopped at the integral. So $b_1 = \frac{2}{\pi}\cdot 10 = \frac{20}{\pi}$.'
        constraints: "initial data constant or linear, whose sine coefficients were computed in fourier-sine-cosine-series; L in {1, pi}"
    diagnostic_exemplar:
      problem: 'Solve $u_t = u_{xx}$ on $(0, \pi)$ with $u(0,t) = u(\pi,t) = 0$ and initial temperature $u(x,0) = 50$.'
      answer: '$u(x,t) = \sum_{n \text{ odd}} \dfrac{200}{n\pi}\,e^{-n^2 t}\sin nx$'
      answer_contract: {kind: none}
      solution_sketch: 'Separation gives the product solutions $e^{-n^2 t}\sin nx$, so $u = \sum b_n e^{-n^2 t}\sin nx$ with $b_n = \frac{2}{\pi}\int_0^{\pi} 50\sin nx\,dx = \frac{100(1 - (-1)^n)}{n\pi}$, which is $\frac{200}{n\pi}$ for odd $n$ and $0$ for even $n$.'
    anki_seeds:
      - front: "Separation of variables for the heat equation: the ansatz and what it produces?"
        back: '$u = X(x)T(t)$ turns $u_t = ku_{xx}$ into the eigenvalue problem $X'''' + \lambda X = 0$ plus $T'' = -\lambda k T$.'
        type: basic
      - front: 'Decay rate of mode $n$ in the heat equation on $(0, L)$ with zero ends?'
        back: '$e^{-k(n\pi/L)^2 t}$ — higher modes smooth out fastest.'
        type: basic
      - front: "Where do the coefficients of the heat-equation series solution come from?"
        back: "They are the half-range sine coefficients of the initial temperature $f(x)$."
        type: basic
