        key: false
    knowledge_points:
      - id: kp1
        name: Solving two-point BVPs
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: "Solve $y'' = 0$ with $y(0) = 1$, $y(1) = 3$."
            answer: "$y = 1 + 2x$"
            solution_sketch: "General solution $y = ax + b$; fit both endpoint values."
          - problem: "Solve $y'' + y = 0$ with $y(0) = 0$, $y(\\pi/2) = 5$."
            answer: "$y = 5\\sin x$"
            solution_sketch: "$y = c_1\\cos x + c_2\\sin x$; $y(0) = 0$ forces $c_1 = 0$ and $y(\\pi/2) = c_2 = 5$."
        constraints: "conditions at two different points; endpoints at 0 and rational multiples of pi where sin/cos take clean values"
      - id: kp2
        name: "Existence outcomes: unique, none, or infinitely many"
        key_prerequisites: [homogeneous-constant-coefficients, unit-circle]
        exemplars:
          - problem: "Find all solutions of $y'' + y = 0$ with $y(0) = 0$, $y(\\pi) = 0$."
            answer: "$y = c\\sin x$ for every constant $c$: infinitely many solutions."
            solution_sketch: "$c_1 = 0$ from the first condition; the second reads $c_2 \\sin\\pi = 0$, true for all $c_2$."
          - problem: "Solve $y'' + y = 0$ with $y(0) = 0$, $y(\\pi) = 1$."
            answer: "No solution."
            solution_sketch: "$c_1 = 0$ forces $y = c_2\\sin x$, but $y(\\pi) = 0 \\neq 1$."
          - problem: "How does this differ from initial value problems for the same equation?"
            answer: "An IVP (conditions at one point) always has exactly one solution; a BVP can have one, none, or infinitely many."
        constraints: "the boundary data hits or misses zeros of sin; all three outcomes must be represented across problems"
      - id: kp3
        name: Eigenvalue problems
        key_prerequisites: [homogeneous-constant-coefficients, unit-circle]
        exemplars:
          - problem: "Find all $\\lambda > 0$ for which $y'' + \\lambda y = 0$, $y(0) = y(\\pi) = 0$ has nonzero solutions."
            answer: "$\\lambda = n^2$ for $n = 1, 2, 3, \\ldots$, with $y = \\sin nx$."
            solution_sketch: "$y = \\sin(\\sqrt{\\lambda}\\,x)$ needs $\\sin(\\sqrt{\\lambda}\\,\\pi) = 0$, i.e. $\\sqrt{\\lambda} = n$."
          - problem: "State the eigenvalues of $y'' + \\lambda y = 0$, $y(0) = y(L) = 0$."
            answer: '$\lambda_n = \dfrac{n^2\pi^2}{L^2}$, with eigenfunctions $\sin\dfrac{n\pi x}{L}$.'
          - problem: "What is the smallest positive eigenvalue of $y'' + \\lambda y = 0$, $y(0) = y(1) = 0$?"
            answer: '$\pi^2$'
        constraints: "Dirichlet conditions only; eigenvalues (n pi / L)^2 with L in {1, pi, 2}"
    diagnostic_exemplar:
      problem: 'Find all values $\lambda > 0$ for which $y'''' + \lambda y = 0$ with $y(0) = y(2) = 0$ has nonzero solutions, and give those solutions.'
      answer: '$\lambda_n = \dfrac{n^2\pi^2}{4}$ for $n = 1, 2, 3, \ldots$, with $y = \sin\dfrac{n\pi x}{2}$ (up to a constant multiple).'
      solution_sketch: 'For $\lambda > 0$ the general solution is $y = c_1\cos\sqrt{\lambda}\,x + c_2\sin\sqrt{\lambda}\,x$. Then $y(0) = 0$ forces $c_1 = 0$, and $y(2) = c_2\sin 2\sqrt{\lambda} = 0$ has a nonzero solution only when $2\sqrt{\lambda} = n\pi$.'
    anki_seeds:
      - front: "A boundary value problem differs from an IVP in that..."
        back: "conditions are imposed at two different points — and a solution may be unique, nonexistent, or non-unique."
        type: basic
      - front: "Eigenvalues of y'' + lambda y = 0 with y(0) = y(L) = 0?"
        back: '$\lambda_n = (n\pi/L)^2$, eigenfunctions $\sin(n\pi x/L)$.'
        type: basic
