  - id: linear-independence-wronskian
    name: Linear Independence and the Wronskian
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: homogeneous-constant-coefficients
        weight: 0.5
        key: true
      - id: determinants
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Computing Wronskians
        key_prerequisites: [determinants]
        exemplars:
          - problem: "Compute the Wronskian of $y_1 = e^x$ and $y_2 = e^{-x}$."
            answer: "$W = -2$"
            solution_sketch: "$W = y_1 y_2' - y_1' y_2 = e^x(-e^{-x}) - e^x e^{-x} = -2$."
          - problem: 'Compute the Wronskian of $y_1 = \cos x$ and $y_2 = \sin x$.'
            answer: '$W = 1$'
            solution_sketch: '$\cos x \cdot \cos x - (-\sin x)\sin x = \cos^2 x + \sin^2 x = 1$.'
          - problem: "Compute the Wronskian of $y_1 = e^{2x}$ and $y_2 = xe^{2x}$."
            answer: "$W = e^{4x}$"
            solution_sketch: "$e^{2x}(1 + 2x)e^{2x} - 2e^{2x} \\cdot xe^{2x} = e^{4x}(1 + 2x - 2x) = e^{4x}$."
          - problem: "Consider $y_1 = e^{6x}$ and $y_2 = e^{-6x}$. Compute their Wronskian $W = y_1 y_2' - y_1' y_2$."
            answer: "-12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $W = y_1 y_2' - y_1' y_2$. Use the Wronskian definition and differentiate the exponentials by the exponential rule: $y_1' = 6e^{6x}$ and $y_2' = -6e^{-6x}$. Substitute into the determinant: $W = e^{6x}(-6e^{-6x}) - 6e^{6x}e^{-6x} = -6 - 6$. Simplify the constant terms. The Wronskian is -12."
          - problem: "Consider $y_1 = e^{4x}$ and $y_2 = e^{-x}$. Compute their Wronskian $W = y_1 y_2' - y_1' y_2$ as a function of $x$."
            answer: "-5e^(3x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is $W = y_1 y_2' - y_1' y_2$. Use the Wronskian definition and differentiate with the exponential rule: $y_1' = 4e^{4x}$ and $y_2' = -e^{-x}$. Substitute: $W = e^{4x}(-e^{-x}) - 4e^{4x}e^{-x} = -e^{3x} - 4e^{3x}$. Combine like exponential terms. The Wronskian is -5e^(3x)."
          - problem: "For $y_1 = e^{5x}$ and $y_2 = e^{kx}$, their Wronskian is $e^{11x}$. Find the constant $k$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $W = y_1 y_2' - y_1' y_2$. Use the Wronskian definition with $y_1' = 5e^{5x}$ and $y_2' = k e^{kx}$. Substitute: $W = e^{5x}(k e^{kx}) - 5e^{5x}e^{kx} = (k-5)e^{(k+5)x}$. Set this equal to $e^{11x}$ and compare exponents, giving $k+5=11$. Then $k=6$, and the coefficient $k-5=1$ matches $e^{11x}$. The constant is 6."
        constraints: "fundamental pairs from constant-coefficient equations; W simplifies to a constant or single exponential"
      - id: kp2
        name: Testing independence
        key_prerequisites: [determinants]
        exemplars:
          - problem: "Compute $W(x, x^2)$ and decide whether $x$ and $x^2$ are linearly independent on $x > 0$."
            answer: "$W = x^2 \\neq 0$: independent."
            answer_contract: {kind: none}
            solution_sketch: "$W = x \\cdot 2x - 1 \\cdot x^2 = x^2$."
          - problem: "Are $e^x$ and $e^{x+1}$ linearly independent?"
            answer: "No: $e^{x+1} = e \\cdot e^x$ is a constant multiple, and $W = 0$."
            answer_contract: {kind: none}
            solution_sketch: "No: $e^{x+1} = e \\cdot e^x$ is a constant multiple, and $W = 0$."
          - problem: "Show that $y_1 = e^{3x}$, $y_2 = e^{-2x}$ form a fundamental set for $y'' - y' - 6y = 0$."
            answer: "Both solve the equation and $W = -5e^{x} \\neq 0$."
            answer_contract: {kind: none}
            solution_sketch: "$W = e^{3x}(-2e^{-2x}) - 3e^{3x}e^{-2x} = -5e^x$."
        constraints: "one pair is secretly proportional; nonvanishing W certifies a fundamental set"
      - id: kp3
        name: Superposition and general solutions
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: "Let y1 = e^(3x) and y2 = e^(-2x). Both solve y'' - y' - 6y = 0. The function y = A e^(3x) + B e^(-2x) satisfies y(0) = 5 and y'(0) = 0. Give A and B."
            answer: "A = 2; B = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "By superposition, y = A e^(3x) + B e^(-2x) solves y'' - y' - 6y = 0 because e^(3x) and e^(-2x) are solutions. Evaluate at x = 0 to get A + B = 5. Differentiate to get y' = 3A e^(3x) - 2B e^(-2x), so y'(0) = 3A - 2B = 0. Solve the two equations: A = 2 and B = 3. The answer is A = 2; B = 3."
          - problem: "The functions y1 and y2 both solve y'' + y = 4x. Let y = y1 + y2. Find y'' + y as a function of x."
            answer: "8x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Superposition fails for a nonhomogeneous equation: y1 and y2 each give y'' + y = 4x. For y = y1 + y2, linearity of the derivative gives y'' + y = (y1'' + y1) + (y2'' + y2). Substitute the two values: 4x + 4x = 8x. The answer is 8x."
          - problem: "Both e^(3x) and e^(-x) solve y'' - 2y' - 3y = 0. Give the solution y = A e^(3x) + B e^(-x) with y(0) = 5 and y'(0) = 3."
            answer: "2e^(3x) + 3e^(-x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "By superposition, the general solution is y = A e^(3x) + B e^(-x). The condition y(0) = 5 gives A + B = 5. Differentiate: y' = 3A e^(3x) - B e^(-x), so y'(0) = 3A - B = 3. Solve: A = 2 and B = 3. The answer is 2e^(3x) + 3e^(-x)."
          - problem: "The functions y1 = e^(4x) and y2 = e^(-x) solve y'' - 3y' - 4y = 0. Let y = 5y1 - 2y2. Find y'' - 3y' - 4y."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By superposition, y = 5 y1 - 2 y2 is a linear combination of two solutions of the homogeneous equation. Therefore y also solves y'' - 3y' - 4y = 0. Substituting y into the left side gives 5 times 0 minus 2 times 0, which is 0. The answer is 0."
          - problem: "Both cos(2x) and sin(2x) solve y'' + 4y = 0. The function y = A cos(2x) + B sin(2x) satisfies y(0) = 3 and y'(0) = 8. Give A and B."
            answer: "A = 3; B = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "By superposition, y = A cos(2x) + B sin(2x) solves y'' + 4y = 0. The condition y(0) = 3 gives A = 3 because cos(0) = 1 and sin(0) = 0. Differentiate: y' = -2A sin(2x) + 2B cos(2x), so y'(0) = 2B = 8. Solve: B = 4. The answer is A = 3; B = 4."
          - problem: "Both e^(-x) and x e^(-x) solve y'' + 2y' + y = 0. Give the solution with y(0) = 2 and y'(0) = 1."
            answer: "2e^(-x) + 3x e^(-x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "By superposition, the general solution is y = A e^(-x) + B x e^(-x). The condition y(0) = 2 gives A = 2. Differentiate: y' = -A e^(-x) + B e^(-x) - B x e^(-x), so y'(0) = -A + B = 1. With A = 2, B = 3. The answer is 2e^(-x) + 3x e^(-x)."
        constraints: "conceptual: superposition holds exactly for homogeneous linear equations"
    diagnostic_exemplar:
      problem: 'Show that $y_1 = e^{2x}$ and $y_2 = e^{-3x}$ form a fundamental set of solutions of $y'''' + y'' - 6y = 0$, and write the general solution.'
      answer: 'Both solve the equation (the characteristic roots are $2$ and $-3$), and $W = y_1 y_2'' - y_1'' y_2 = -5e^{-x} \neq 0$, so they are independent: the general solution is $y = c_1 e^{2x} + c_2 e^{-3x}$.'
      answer_contract: {kind: none}
      solution_sketch: '$r^2 + r - 6 = (r-2)(r+3)$; the Wronskian is $e^{2x}(-3e^{-3x}) - 2e^{2x}e^{-3x} = -5e^{-x}$, never zero.'
    anki_seeds:
      - front: "Wronskian of two solutions y_1, y_2?"
        back: "$W = y_1 y_2' - y_1' y_2$"
        type: basic
      - front: "Two solutions of a second-order linear homogeneous ODE form a fundamental set iff..."
        back: "their Wronskian is nonzero."
        type: basic

  - id: reduction-of-order
    name: Reduction of Order
    core: false                # special-case technique; terminal
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: homogeneous-constant-coefficients
        weight: 0.6
        key: true
      - id: linear-independence-wronskian
        weight: 0.3
        key: false
      - id: integration-substitution
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The substitution $y = v\\,y_1$"
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: "Given that $y_1 = e^{4x}$ solves $y'' - 8y' + 16y = 0$, use the substitution $y = v e^{4x}$ to find a second solution $y_2$ that is independent of $y_1$. Give $y_2$ as a function of $x$."
            answer: "x e^(4x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Let $y = v e^{4x}$. Then $y' = (v' + 4v)e^{4x}$ and $y'' = (v'' + 8v' + 16v)e^{4x}$. Substitute into $y'' - 8y' + 16y = 0$: $(v'' + 8v' + 16v - 8v' - 32v + 16v)e^{4x} = v'' e^{4x} = 0$. All $v$ and $v'$ terms cancel, leaving $v'' = 0$. Integrate twice: $v = c_1 + c_2 x$. The constant part repeats $y_1$, so take $v = x$. The second solution is $x e^{4x}$."
          - problem: "Substitute $y = v e^{-3x}$ into $y'' + 6y' + c y = 0$. The $v$ and $v'$ terms cancel and the equation for $v$ becomes $v'' = 0$. Find the value of $c$."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $y = v e^{-3x}$. Then $y' = (v' - 3v)e^{-3x}$ and $y'' = (v'' - 6v' + 9v)e^{-3x}$. Substitute into $y'' + 6y' + c y = 0$: $(v'' - 6v' + 9v + 6v' - 18v + c v)e^{-3x} = (v'' + (c - 9)v)e^{-3x} = 0$. The $v'$ terms cancel, and for the $v$ terms to cancel and leave $v'' = 0$ we need $c - 9 = 0$. Thus $c = 9$. The value is 9."
          - problem: "The equation $y'' - 4y' + 4y = 0$ has $y_1 = e^{2x}$ and $y_2 = x e^{2x}$ as independent solutions. Find the solution with $y(0) = 3$ and $y'(0) = 1$, and give it as a function of $x$."
            answer: "(3 - 5x) e^(2x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The general solution is $y = (c_1 + c_2 x) e^{2x}$. The first condition $y(0) = 3$ gives $c_1 = 3$. Differentiate: $y' = (c_2 + 2c_1 + 2c_2 x) e^{2x}$. The second condition $y'(0) = 1$ gives $c_2 + 2(3) = 1$, so $c_2 = -5$. Therefore $y = (3 - 5x) e^{2x}$."
          - problem: "For the repeated-root equation with $y_1 = e^{5x}$ and $y_2 = x e^{5x}$, find the value of the Wronskian $W(y_1, y_2)$ at $x = 0$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use $W = y_1 y_2' - y_1' y_2$. Here $y_1 = e^{5x}$ and $y_2 = x e^{5x}$, so $y_1' = 5e^{5x}$ and $y_2' = (1 + 5x)e^{5x}$. Then $W = e^{5x}(1 + 5x)e^{5x} - 5e^{5x} x e^{5x} = e^{10x}(1 + 5x - 5x) = e^{10x}$. At $x = 0$, $W = e^0 = 1$. The value is 1."
          - problem: "A constant-coefficient equation $y'' + b y' + c y = 0$ has second solution $y_2 = x e^{-2x}$ produced by reduction of order from $y_1 = e^{-2x}$. Find the value of $b$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reduction of order with $y_1 = e^{rx}$ gives $y_2 = x e^{rx}$ exactly when $r$ is a repeated root, so here $r = -2$. For a repeated root the characteristic polynomial is $(\\lambda - r)^2 = \\lambda^2 - 2r\\lambda + r^2$, so $b = -2r = -2(-2) = 4$. Check by substitution $y = v e^{-2x}$: $y'' + 4y' + 4y = (v'' - 4v' + 4v + 4v' - 8v + 4v)e^{-2x} = v'' e^{-2x} = 0$, so the $v$ and $v'$ terms cancel. The value is 4."
          - problem: "Substitute $y = v e^{6x}$ into $y'' + b y' + 36y = 0$. The $v$ and $v'$ terms cancel and the equation for $v$ becomes $v'' = 0$. Find the value of $b$."
            answer: "-12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $y = v e^{6x}$. Then $y' = (v' + 6v)e^{6x}$ and $y'' = (v'' + 12v' + 36v)e^{6x}$. Substitute into $y'' + b y' + 36y = 0$: $(v'' + 12v' + 36v + b v' + 6b v + 36v)e^{6x} = (v'' + (12 + b)v' + (72 + 6b)v)e^{6x} = 0$. For the $v'$ and $v$ terms to cancel and leave $v'' = 0$, we need $12 + b = 0$, so $b = -12$. The value is -12."
        constraints: "constant-coefficient repeated-root cases; all v', v terms must visibly cancel"
      - id: kp2
        name: Variable-coefficient equations with a known solution
        key_prerequisites: [homogeneous-constant-coefficients, integration-substitution]
        exemplars:
          - problem: "Given that $y_1 = x^3$ solves $x^2 y'' - 5xy' + 9y = 0$ for $x > 0$. Find a second independent solution as a function of x."
            answer: "x^3 ln(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Set y = v x^3 (reduction of order). Then y' = v' x^3 + 3v x^2 and y'' = v'' x^3 + 6v' x^2 + 6v x. Substitution gives x^5 v'' + x^4 v' = 0, so x v'' + v' = 0 after dividing by x^4. Integration gives v' = 1/x and v = ln(x). A second independent solution is x^3 ln(x)."
          - problem: "The function $y_1 = x^2$ solves $x^2 y'' - 2y = 0$ for $x > 0$. Find a second independent solution as a function of x."
            answer: "1/x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Set y = v x^2 (reduction of order). Then y' = v' x^2 + 2v x and y'' = v'' x^2 + 4v' x + 2v. Substitution gives x^4 v'' + 4x^3 v' = 0, so x v'' + 4v' = 0 after dividing by x^3. Let w = v'; then x w' + 4w = 0, and separation gives w = x^(-4). Integrating gives v = -x^(-3)/3, so a second independent solution is 1/x."
          - problem: "For $x > 0$, the equation $x^2 y'' - 3xy' + 3y = 0$ has one solution $y_1 = x$. Find a second independent solution as a function of x."
            answer: "x^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Set y = v x (reduction of order). Then y' = v' x + v and y'' = v'' x + 2v'. Substitution gives x^3 v'' - x^2 v' = 0, so x v'' - v' = 0 after dividing by x^2. Let w = v'; then x w' - w = 0, and separation gives w = x. Integrating gives v = x^2/2, so a second independent solution is x^3."
          - problem: "For $x > 0$, one solution of $x^2 y'' - 7xy' + 15y = 0$ is $y_1 = x^3$. Find a second independent solution as a function of x."
            answer: "x^5"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Set y = v x^3 (reduction of order). Then y' = v' x^3 + 3v x^2 and y'' = v'' x^3 + 6v' x^2 + 6v x. Substitution gives x^5 v'' - x^4 v' = 0, so x v'' - v' = 0 after dividing by x^4. Let w = v'; then x w' - w = 0, and separation gives w = x. Integrating gives v = x^2/2, so a second independent solution is x^5."
          - problem: "The function $y_1 = 1/x$ solves $x^2 y'' + 3xy' + y = 0$ for $x > 0$. Find a second independent solution as a function of x."
            answer: "ln(x)/x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Set y = v x^(-1) (reduction of order). Then y' = v' x^(-1) - v x^(-2) and y'' = v'' x^(-1) - 2v' x^(-2) + 2v x^(-3). Substitution gives x v'' + v' = 0, so (x v')' = 0. Therefore v' = C/x and v = ln(x). A second independent solution is ln(x)/x."
          - problem: "For $x > 0$, the equation $x^2 y'' - 5xy' + 8y = 0$ has $y_1 = x^2$ as one solution. Find a second independent solution as a function of x."
            answer: "x^4"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Set y = v x^2 (reduction of order). Then y' = v' x^2 + 2v x and y'' = v'' x^2 + 4v' x + 2v. Substitution gives x^4 v'' - x^3 v' = 0, so x v'' - v' = 0 after dividing by x^3. Let w = v'; then x w' - w = 0, and separation gives w = x. Integrating gives v = x^2/2, so a second independent solution is x^4."
        constraints: "Cauchy-Euler-type equations with y_1 = x^m given; the v-equation is first order in v'"
      - id: kp3
        name: The reduction-of-order formula
        key_prerequisites: [homogeneous-constant-coefficients, integration-substitution]
        exemplars:
          - problem: "For y'' - 2y' + y = 0, one solution is y1 = e^x. Use the reduction-of-order formula to find a second independent solution. Find y2 as a function of x."
            answer: "x e^x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: y'' - 2y' + y = 0 with y1 = e^x. Standard form gives p = -2, so the exponential factor is e^(2x). The reduction-of-order formula gives y2 = e^x times the integral of e^(2x)/e^(2x) dx, which is e^x times the integral of 1 dx. That integral is x, so the second solution is x e^x."
          - problem: "For x^2 y'' - 3x y' + 4y = 0 with x > 0, one solution is y1 = x^2. Use the reduction-of-order formula to find a second independent solution. Find y2 as a function of x."
