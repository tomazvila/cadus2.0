unit: second-order
course: differential-equations
module: "Second-Order Linear Equations"
topics:
  - id: characteristic-equation-real-roots
    name: "The Characteristic Equation: Real Roots"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: quadratic-formula
        weight: 0.5
        key: true
      - id: derivatives-exp-log
        weight: 0.4
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Deriving the characteristic equation
        key_prerequisites: [derivatives-exp-log]
        try_first:
          problem: 'Let $y=e^{3x}$. Evaluate $y''''-2y''-3y$.'
          answer_contract: {"kind": "exact"}
          answer: '0'
          reveal: 'Each derivative of $e^{3x}$ is a multiple of $e^{3x}$, so the sum is $(9-6-3)e^{3x}=0$. That is why $y=e^{rx}$ turns a differential equation into algebra in $r$.'
        exemplars:
          - problem: 'Substitute $y=e^{rx}$ into $y''''-y''-6y=0$ and cancel the factor $e^{rx}$. What polynomial in $r$ is left?'
            answer: 'r^2-r-6'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'For $y=e^{rx}$ we have $y''=re^{rx}$ and $y''''=r^2e^{rx}$. Substituting gives $(r^2-r-6)e^{rx}=0$. The factor $e^{rx}$ is never zero, so the polynomial left is $r^2-r-6$.'
          - problem: 'What is the characteristic polynomial of $y''''+5y''+6y=0$?'
            answer: 'r^2+5r+6'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'Replace $y''''$ by $r^2$, $y''$ by $r$ and $y$ by $1$. The coefficients $1$, $5$ and $6$ carry over, so the polynomial is $r^2+5r+6$.'
          - problem: 'What is the characteristic polynomial of $2y''''-5y''+3y=0$?'
            answer: '2r^2-5r+3'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'Substituting $y=e^{rx}$ gives $(2r^2-5r+3)e^{rx}=0$. The leading coefficient $2$ stays in the polynomial, so the answer is $2r^2-5r+3$.'
          - problem: 'The charge $q(t)$ on a capacitor in a series circuit obeys $Lq''''+Rq''+\frac{1}{C}q=0$. The circuit has $L=1$ henry, $R=7$ ohms and $C=\frac{1}{10}$ farad. What is the characteristic polynomial of this equation?'
            answer: 'r^2+7r+10'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'The capacitance gives $\frac{1}{C}=10$, so the equation is $q''''+7q''+10q=0$. Substituting $q=e^{rt}$ gives the polynomial $r^2+7r+10$.'
          - problem: 'A block of mass $1$ kg hangs on a spring of stiffness $12$ N/m and moves through oil that pushes back with a force of $8$ times its velocity. Its position $y(t)$ obeys $y''''=-12y-8y''$. What is the characteristic polynomial of this equation?'
            answer: 'r^2+8r+12'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'Move every term to the left side to get $y''''+8y''+12y=0$. Substituting $y=e^{rt}$ then gives the polynomial $r^2+8r+12$.'
          - problem: 'Substitute $y=e^{rx}$ into $y''''-4y=0$. What is the resulting polynomial in $r$?'
            answer: 'r^2-4'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'The function $y=e^{rx}$ gives the factor $1$ for $y$. The equation has no $y''$ term, so the polynomial is $r^2-4$.'
          - problem: 'What is the characteristic polynomial of $y''''+7y''=0$?'
            answer: 'r^2+7r'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'The equation has no $y$ term, so the constant term of the polynomial is $0$. The polynomial is $r^2+7r$.'
          - problem: 'The characteristic polynomial of $y''''+by''+cy=0$ is $r^2-4r+13$. Find $b$.'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coefficient of $r$ in the polynomial is the coefficient $b$ of $y''$. Reading it off gives $b=-4$, and the constant term gives $c=13$.'
        constraints: 'read coefficients straight into ar^2 + br + c = 0; quadratics factor over the integers; the polynomial comes from an equation or from a spring or circuit model'
      - id: kp2
        name: Distinct real roots
        key_prerequisites: [quadratic-formula]
        exemplars:
          - problem: 'Find the roots of the characteristic equation of $y''''-y''-6y=0$.'
            answer: '3, -2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $r^2-r-6=0$. It factors as $(r-3)(r+2)=0$, so the roots are $3$ and $-2$.'
          - problem: 'For which values of $r$ is $y=e^{rx}$ a solution of $y''''-25y=0$?'
            answer: '5, -5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting gives $r^2-25=0$. This is a difference of squares, $(r-5)(r+5)=0$, so $r=5$ or $r=-5$.'
          - problem: 'Find the roots of the characteristic equation of $y''''+5y''+6y=0$.'
            answer: '-2, -3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $r^2+5r+6=0$. It factors as $(r+2)(r+3)=0$, so the roots are $-2$ and $-3$.'
          - problem: 'Find the roots of the characteristic equation of $2y''''-5y''+3y=0$.'
            answer: '1, 3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $2r^2-5r+3=0$. It factors as $(2r-3)(r-1)=0$, so the roots are $\frac{3}{2}$ and $1$.'
          - problem: 'The general solution of $y''''+ay''+by=0$ is $y=c_1e^{4x}+c_2e^{-x}$. Find $b$.'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The exponents $4$ and $-1$ are the roots of $r^2+ar+b=0$. The product of the roots is $b$, so $b=4\cdot(-1)=-4$.'
          - problem: 'The function $y=e^{5x}$ solves $y''''+py''-10y=0$. Find $p$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because $e^{5x}$ is a solution, $r=5$ is a root of $r^2+pr-10=0$. Substituting gives $25+5p-10=0$, so $5p=-15$ and $p=-3$.'
          - problem: 'A block of mass $1$ kg on a spring with a damper obeys $y''''+7y''+10y=0$, where $y$ is in metres and $t$ is in seconds. Its motion is a combination of $e^{-at}$ and $e^{-bt}$ with $a$ and $b$ positive. Find $a$ and $b$.'
            answer: '2, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $r^2+7r+10=0$, which factors as $(r+2)(r+5)=0$. The roots are $-2$ and $-5$, so the decay rates are $2$ and $5$.'
          - problem: 'A model of a chemical imbalance obeys $y''''-4y''-5y=0$, where $y$ is the deviation from balance and $t$ is time in hours. The faster-growing part of the deviation grows like $e^{kt}$. Find $k$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $r^2-4r-5=0$, which factors as $(r-5)(r+1)=0$. The roots are $5$ and $-1$, and the growing part uses the larger root, so $k=5$.'
          - problem: 'Find the roots of the characteristic equation of $y''''-4y''+y=0$.'
            answer: '2 + sqrt(3), 2 - sqrt(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $r^2-4r+1=0$, which does not factor over the integers. The quadratic formula gives $r=\frac{4\pm\sqrt{16-4}}{2}=2\pm\sqrt{3}$.'
          - problem: 'A second-order equation $y''''+ay''+by=0$ has the general solution $y=c_1e^{3x}+c_2e^{-4x}$. What is its characteristic polynomial?'
            answer: 'r^2+r-12'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'The exponents $3$ and $-4$ are the roots of the characteristic polynomial, so it is $(r-3)(r+4)$. Expanding gives $r^2+r-12$, so $a=1$ and $b=-12$.'
        constraints: 'characteristic quadratic with two distinct real roots; most factor over the integers, one needs the quadratic formula; contexts are damped springs and models with exponential growth or decay'
      - id: kp3
        name: IVPs with distinct real roots
        key_prerequisites: [quadratic-formula]
        exemplars:
          - problem: 'Solve $y''''-y''-2y=0$ with $y(0)=3$ and $y''(0)=0$.'
            answer: 'e^(2x)+2e^(-x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The roots are $2$ and $-1$, so $y=c_1e^{2x}+c_2e^{-x}$. The conditions give $c_1+c_2=3$ and $2c_1-c_2=0$, so $c_1=1$ and $c_2=2$.'
          - problem: 'Find the solution of $y''''-4y=0$ that satisfies $y(0)=1$ and $y''(0)=2$.'
            answer: 'e^(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The roots are $2$ and $-2$, so $y=c_1e^{2x}+c_2e^{-2x}$. The conditions give $c_1+c_2=1$ and $2c_1-2c_2=2$, so $c_1=1$ and $c_2=0$.'
          - problem: 'Solve the initial value problem $y''''-5y''+6y=0$, $y(0)=2$, $y''(0)=1$.'
            answer: '5e^(2x)-3e^(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The roots are $2$ and $3$. The conditions give $c_1+c_2=2$ and $2c_1+3c_2=1$, so $c_2=-3$ and $c_1=5$.'
          - problem: 'Solve the initial value problem $y''''+3y''+2y=0$, $y(0)=1$, $y''(0)=4$.'
            answer: '6e^(-x)-5e^(-2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The roots are $-1$ and $-2$. The conditions give $c_1+c_2=1$ and $-c_1-2c_2=4$, so $c_2=-5$ and $c_1=6$.'
          - problem: 'The displacement $y(t)$ in centimetres of a suspension platform obeys $y''''+5y''+4y=0$, with $t$ in seconds. The platform is released from $y(0)=3$ with zero velocity. Find $y(t)$.'
            answer: '4e^(-t)-e^(-4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The roots are $-1$ and $-4$. Zero velocity and $y(0)=3$ give $c_1+c_2=3$ and $-c_1-4c_2=0$, so $c_2=-1$ and $c_1=4$.'
          - problem: 'A platform''s displacement $y(t)$ in centimetres obeys $y''''+4y''+3y=0$ with $t$ in seconds. It starts at $y(0)=5$ with velocity $y''(0)=-7$. How far is it from rest after $1$ second, to three decimal places?'
            answer: '1.521'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The roots are $-1$ and $-3$. The conditions give $c_1+c_2=5$ and $-c_1-3c_2=-7$, so $c_1=4$ and $c_2=1$. Then $y(1)=4e^{-1}+e^{-3}\approx 1.521$.'
          - problem: 'A series circuit has $L=1$ henry, $R=7$ ohms and $C=\frac{1}{12}$ farad, so the charge obeys $Lq''''+Rq''+\frac{1}{C}q=0$. The initial charge is $q(0)=2$ and the initial current is $q''(0)=-5$. Find $q(t)$.'
            answer: '3e^(-3t)-e^(-4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'With $\frac{1}{C}=12$ the equation is $q''''+7q''+12q=0$, with roots $-3$ and $-4$. The conditions give $c_1+c_2=2$ and $-3c_1-4c_2=-5$, so $c_1=3$ and $c_2=-1$.'
          - problem: 'For which value of $y''(0)$ does the solution of $y''''-y''-2y=0$ with $y(0)=3$ contain no $e^{2x}$ term?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Without the $e^{2x}$ term the solution is $y=3e^{-x}$, because $y(0)=3$. Its derivative at $0$ is $-3$, so $y''(0)=-3$.'
        constraints: 'two initial conditions produce a 2x2 linear system with small integer solutions; contexts are suspension, circuit and spring models'
    diagnostic_exemplar:
      problem: 'Solve $y'''' + y'' - 2y = 0$ with $y(0) = 4$, $y''(0) = -2$.'
      answer: '$y = 2e^{x} + 2e^{-2x}$'
      solution_sketch: 'The characteristic equation $r^2 + r - 2 = 0$ has roots $1$ and $-2$, so $y = c_1 e^x + c_2 e^{-2x}$. The conditions give $c_1 + c_2 = 4$ and $c_1 - 2c_2 = -2$, hence $c_1 = c_2 = 2$.'
    anki_seeds:
      - front: "Characteristic equation of ay'' + by' + cy = 0?"
        back: "$ar^2 + br + c = 0$ (substitute $y = e^{rx}$)."
        type: basic
      - front: "General solution when the characteristic equation has distinct real roots r1, r2?"
        back: "$y = c_1 e^{r_1 x} + c_2 e^{r_2 x}$"
        type: basic

  - id: homogeneous-constant-coefficients
    name: Homogeneous Constant-Coefficient Equations
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: characteristic-equation-real-roots
        weight: 0.7
        key: true
      - id: derivatives-trig
        weight: 0.4
        key: false
      - id: complex-numbers
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Repeated roots
        key_prerequisites: [characteristic-equation-real-roots]
        try_first:
          problem: 'Let $y=xe^{2x}$. Evaluate $y''''-4y''+4y$ at $x=1$.'
          answer_contract: {"kind": "exact"}
          answer: '0'
          reveal: 'Here $y''''=(4+4x)e^{2x}$ and $y''=(1+2x)e^{2x}$, so $y''''-4y''+4y=0$ for every $x$. The function $xe^{2x}$ solves the equation although $2$ is a double root.'
        exemplars:
          - problem: 'One solution of $y''''-6y''+9y=0$ is $e^{3x}$. Find the second solution $y_2$ for which $y_2(0)=0$ and $y_2''(0)=1$.'
            answer: 'x*e^(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The characteristic polynomial $r^2-6r+9=(r-3)^2$ has the double root $3$, so every solution is $(c_1+c_2x)e^{3x}$. The conditions $y_2(0)=0$ and $y_2''(0)=1$ give $c_1=0$ and $c_2=1$, so $y_2=xe^{3x}$.'
          - problem: 'Solve $y''''+4y''+4y=0$ with $y(0)=3$ and $y''(0)=-1$.'
            answer: '(3+5x)e^(-2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The double root is $-2$, so $y=(c_1+c_2x)e^{-2x}$. The first condition gives $c_1=3$, and $y''(0)=c_2-2c_1=-1$ gives $c_2=5$.'
          - problem: 'Find the solution of $y''''-2y''+y=0$ that satisfies $y(0)=1$ and $y''(0)=0$.'
            answer: '(1-x)e^x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The double root is $1$, so $y=(c_1+c_2x)e^{x}$. Then $c_1=1$, and $y''(0)=c_1+c_2=0$ gives $c_2=-1$.'
          - problem: 'The functions $e^{2x}$ and $xe^{2x}$ both solve $y''''+by''+cy=0$. Find $b$.'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The double root $2$ means the characteristic polynomial is $(r-2)^2=r^2-4r+4$. Comparing with $r^2+br+c$ gives $b=-4$ and $c=4$.'
          - problem: 'For what value of $c$ does $y''''-10y''+cy=0$ have a repeated characteristic root?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A repeated root needs a zero discriminant, so $100-4c=0$. Hence $c=25$, and the polynomial is $(r-5)^2$.'
          - problem: 'A shock absorber''s displacement $y(t)$ in centimetres obeys $y''''+6y''+9y=0$, with $t$ in seconds. It is released from $y(0)=2$ with zero velocity. Find $y(t)$.'
            answer: '(2+6t)e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The double root is $-3$, so $y=(c_1+c_2t)e^{-3t}$. Then $c_1=2$, and $y''(0)=c_2-3c_1=0$ gives $c_2=6$.'
          - problem: 'A mass on a spring with a damper obeys $y''''+4y''+4y=0$, where $y$ is in metres and $t$ in seconds. It starts with $y(0)=0$ and $y''(0)=1$. Find the displacement at $t=1$, to three decimal places.'
            answer: '0.135'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'The double root is $-2$, so $y=(c_1+c_2t)e^{-2t}$. The conditions give $c_1=0$ and $c_2=1$, so $y(1)=e^{-2}\approx 0.135$.'
          - problem: 'An engineer wants the characteristic equation of $y''''+by''+25y=0$ to have a repeated root, with $b>0$. What value of $b$ is needed?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A repeated root needs a zero discriminant, so $b^2-4\cdot25=0$ and $b^2=100$. Since $b$ must be positive, $b=10$.'
          - problem: 'Solve $y''''-10y''+25y=0$ with $y(0)=1$ and $y''(0)=0$.'
            answer: '(1-5x)e^(5x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The double root is $5$, so $y=(c_1+c_2x)e^{5x}$. Then $c_1=1$, and $y''(0)=c_2+5c_1=0$ gives $c_2=-5$.'
        constraints: 'perfect-square characteristic polynomials; the x-factor on the second solution is the point; general solutions are asked through a second solution, initial values or a coefficient'
      - id: kp2
        name: Complex roots
        key_prerequisites: [characteristic-equation-real-roots, derivatives-trig, complex-numbers]
        exemplars:
          - problem: 'Solve $y''''+9y=0$ with $y(0)=2$ and $y''(0)=3$.'
            answer: '2cos(3x)+sin(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The roots are $\pm 3i$, so $y=c_1\cos 3x+c_2\sin 3x$. Then $c_1=2$, and $y''(0)=3c_2=3$ gives $c_2=1$.'
          - problem: 'Find the solution of $y''''+2y''+5y=0$ with $y(0)=1$ and $y''(0)=3$.'
            answer: 'e^(-x)(cos(2x)+2sin(2x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The roots are $-1\pm 2i$, so $y=e^{-x}(c_1\cos 2x+c_2\sin 2x)$. Then $c_1=1$, and $y''(0)=-c_1+2c_2=3$ gives $c_2=2$.'
          - problem: 'In a series circuit with $L=1$ henry, $C=\frac{1}{25}$ farad and no resistor, the charge obeys $Lq''''+\frac{1}{C}q=0$. If $q(0)=3$ and $q''(0)=10$, find $q(t)$.'
            answer: '3cos(5t)+2sin(5t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'With $\frac{1}{C}=25$ the equation is $q''''+25q=0$, with roots $\pm 5i$. So $q=c_1\cos 5t+c_2\sin 5t$, with $c_1=3$ and $5c_2=10$, which gives $c_2=2$.'
          - problem: 'A block of mass $2$ kg on a spring of stiffness $50$ N/m slides without friction. What is the angular frequency of its oscillation, in radians per second?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Newton''s law gives $2y''''=-50y$, so $y''''+25y=0$. The roots are $\pm 5i$, so the angular frequency is $5$ radians per second.'
          - problem: 'Solve $y''''-2y''+10y=0$ with $y(0)=1$ and $y''(0)=4$.'
            answer: 'e^(x)(cos(3x)+sin(3x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The roots are $1\pm 3i$, so $y=e^{x}(c_1\cos 3x+c_2\sin 3x)$. Then $c_1=1$, and $y''(0)=c_1+3c_2=4$ gives $c_2=1$.'
          - problem: 'The function $e^{-3x}\cos 5x$ solves $y''''+6y''+cy=0$. Find $c$.'
            answer: '34'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The roots of the characteristic equation are $-3\pm 5i$, so the polynomial is $(r+3)^2+25=r^2+6r+34$. Hence $c=34$.'
          - problem: 'What is the period of the oscillation described by $y''''+16y=0$?'
            answer: 'pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The roots are $\pm 4i$, so the solutions are $\cos 4x$ and $\sin 4x$. The period is $\frac{2\pi}{4}=\frac{\pi}{2}$.'
          - problem: 'A block of mass $1$ kg on a spring of stiffness $16$ N/m is pulled $0.5$ m from its rest position and released from rest. Find its displacement $y(t)$ in metres.'
            answer: '1/2*cos(4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Newton''s law gives $y''''+16y=0$, so $y=c_1\cos 4t+c_2\sin 4t$. Then $c_1=\frac{1}{2}$, and zero velocity gives $4c_2=0$, so $c_2=0$.'
        constraints: 'roots alpha +/- beta i with integer alpha, beta; answers as e^{alpha x}(c_1 cos beta x + c_2 sin beta x) with the constants fixed by initial values; contexts include undamped springs and LC circuits'
      - id: kp3
        name: Choosing the case
        key_prerequisites: [characteristic-equation-real-roots, complex-numbers]
        exemplars:
          - problem: 'Are the characteristic roots of $y''''+6y''+9y=0$ real and distinct, repeated, or complex?'
            answer: 'repeated'
            answer_contract: {"kind": "label", "options": [["distinct", "real and distinct", "two real roots", "different real roots", "two different real roots"], ["repeated", "a repeated root", "repeated root", "double root", "equal roots", "real and equal", "one repeated real root", "repeated real root"], ["complex", "complex roots", "a complex pair", "complex conjugates"]]}
            solution_sketch: 'The characteristic equation is $r^2+6r+9=0$ with discriminant $36-36=0$. A zero discriminant gives one repeated root $r=-3$.'
          - problem: 'Find the discriminant of the characteristic equation of $y''''+4y''+13y=0$.'
            answer: '-36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $r^2+4r+13=0$. Its discriminant is $16-52=-36$, which is negative, so the roots are complex.'
          - problem: 'Solve $y''''+4y''+5y=0$ with $y(0)=1$ and $y''(0)=-2$.'
            answer: 'e^(-2x)cos(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The roots are $-2\pm i$, so $y=e^{-2x}(c_1\cos x+c_2\sin x)$. Then $c_1=1$, and $y''(0)=-2c_1+c_2=-2$ gives $c_2=0$.'
          - problem: 'Find the solution of $y''''-6y''+13y=0$ with $y(0)=1$ and $y''(0)=0$.'
            answer: 'e^(3x)(cos(2x) - (3/2) sin(2x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The discriminant is $36-52=-16<0$, so the roots are $3\pm 2i$. Then $c_1=1$, and $y''(0)=3c_1+2c_2=0$ gives $c_2=-\frac{3}{2}$.'
          - problem: 'Solve $y''''-5y''+6y=0$ with $y(0)=1$ and $y''(0)=3$.'
            answer: 'e^(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The discriminant is $25-24=1>0$, so the roots $2$ and $3$ are real and distinct. The conditions give $c_1+c_2=1$ and $2c_1+3c_2=3$, so $c_1=0$ and $c_2=1$.'
          - problem: 'A block of mass $1$ kg on a spring of stiffness $25$ N/m is slowed by a damper that pushes back with $c$ times its velocity, so $y''''+cy''+25y=0$. For which positive value of $c$ is the motion critically damped?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Critical damping means a repeated characteristic root, so the discriminant $c^2-4\cdot25$ is $0$. Hence $c^2=100$ and $c=10$.'
          - problem: 'A block of mass $1$ kg on a spring of stiffness $2$ N/m moves in a fluid that pushes back with $3$ times its velocity, so $y''''+3y''+2y=0$. Does the block oscillate about its rest position, or does it settle without oscillating?'
            answer: 'it settles without oscillating'
            answer_contract: {"kind": "label", "options": [["it oscillates", "oscillates", "it oscillates about its rest position", "oscillating"], ["it settles without oscillating", "settles without oscillating", "it does not oscillate", "no oscillation", "does not oscillate", "it settles", "it settles down without oscillating"]]}
            solution_sketch: 'The discriminant is $9-8=1>0$, so the roots $-1$ and $-2$ are real. Real roots give decaying exponentials with no oscillation.'
          - problem: 'The displacement $y(t)$ in millimetres of a vibrating reed obeys $y''''+2y''+17y=0$, with $t$ in seconds. It starts at $y(0)=4$ with zero velocity. Find $y(t)$.'
            answer: 'e^(-t)(4cos(4t)+sin(4t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The discriminant is $4-68=-64<0$, so the roots are $-1\pm 4i$. Then $c_1=4$, and $y''(0)=-c_1+4c_2=0$ gives $c_2=1$.'
        constraints: 'one equation from each root case may appear; the solver must pick the case from the discriminant b^2 - 4c; verdict items accept the natural words as aliases'
    diagnostic_exemplar:
      problem: 'Solve $y'''' + 6y'' + 13y = 0$ with $y(0) = 2$, $y''(0) = -6$.'
      answer: '$y = 2e^{-3x}\cos 2x$'
      solution_sketch: '$r^2 + 6r + 13 = 0$ gives $r = -3 \pm 2i$, so $y = e^{-3x}(c_1\cos 2x + c_2 \sin 2x)$. Then $c_1 = 2$ and $y''(0) = -3c_1 + 2c_2 = -6$ forces $c_2 = 0$.'
    anki_seeds:
      - front: "General solution when the characteristic equation has a double root r?"
        back: "$y = (c_1 + c_2 x)e^{rx}$"
        type: basic
      - front: 'General solution when the characteristic roots are $\alpha \pm \beta i$?'
        back: '$y = e^{\alpha x}(c_1 \cos \beta x + c_2 \sin \beta x)$'
        type: basic

  - id: linear-independence-wronskian
    name: Linear Independence and the Wronskian
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: homogeneous-constant-coefficients
        weight: 0.5
        key: true
      - id: determinants
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Computing Wronskians
        key_prerequisites: [determinants]
        exemplars:
          - problem: 'Compute the Wronskian of $y_1=e^x$ and $y_2=e^{-x}$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $W=y_1y_2''-y_1''y_2$ with $y_2''=-e^{-x}$ and $y_1''=e^x$. Then $W=e^x(-e^{-x})-e^xe^{-x}=-1-1=-2$. The Wronskian is the constant $-2$, so it is never zero.'
          - problem: 'Compute the Wronskian of $y_1=\cos x$ and $y_2=\sin x$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $W=y_1y_2''-y_1''y_2$ with $y_2''=\cos x$ and $y_1''=-\sin x$. Then $W=\cos^2x+\sin^2x=1$. The Wronskian is the constant $1$, so the pair is independent everywhere.'
          - problem: 'Compute the Wronskian of $y_1=e^{2x}$ and $y_2=xe^{2x}$.'
            answer: 'e^(4x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $y_2''=(1+2x)e^{2x}$ and $y_1''=2e^{2x}$. Then $W=e^{2x}(1+2x)e^{2x}-2e^{2x}xe^{2x}=e^{4x}(1+2x-2x)=e^{4x}$. So the Wronskian is $e^{4x}$, which is never zero.'
          - problem: 'Compute the Wronskian $W=y_1y_2''-y_1''y_2$ of $y_1=e^{4x}$ and $y_2=e^{-x}$.'
            answer: '-5e^(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $y_1''=4e^{4x}$ and $y_2''=-e^{-x}$. Then $W=e^{4x}(-e^{-x})-4e^{4x}e^{-x}=-e^{3x}-4e^{3x}=-5e^{3x}$. So the Wronskian is a single exponential, and it is never zero.'
          - problem: 'For $y_1=e^{5x}$ and $y_2=e^{kx}$ the Wronskian is $e^{11x}$. Find the constant $k$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The Wronskian is $e^{5x}ke^{kx}-5e^{5x}e^{kx}=(k-5)e^{(k+5)x}$. Matching exponents gives $k+5=11$, so $k=6$, and then $k-5=1$ matches the coefficient.'
          - problem: 'Compute the Wronskian of $y_1=x$ and $y_2=\ln x$ for $x>0$.'
            answer: '1-ln(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $y_1''=1$ and $y_2''=\frac{1}{x}$. Then $W=x\cdot\frac{1}{x}-1\cdot\ln x=1-\ln x$. So the Wronskian is $1-\ln x$, which is zero only at $x=e$.'
          - problem: 'Find the value at $x=2$ of the Wronskian of $y_1=x^2$ and $y_2=x^3$.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $W=x^2\cdot3x^2-2x\cdot x^3=x^4$. At $x=2$ the value is $2^4=16$. The power $x^4$ is positive for $x>0$, so the pair is independent there.'
          - problem: 'The spring equation $y''''+4y=0$ has the solutions $\cos 2t$ and $\sin 2t$. Compute their Wronskian.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $W=y_1y_2''-y_1''y_2$ with $y_1=\cos 2t$ and $y_2=\sin 2t$. Then $W=2\cos^22t+2\sin^22t=2$. So the Wronskian is the constant $2$, which is never zero.'
          - problem: 'The damped equation $y''''+5y''+6y=0$ has the solutions $e^{-2t}$ and $e^{-3t}$. Compute their Wronskian.'
            answer: '-e^(-5t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Here $y_1''=-2e^{-2t}$ and $y_2''=-3e^{-3t}$. Then $W=e^{-2t}(-3e^{-3t})+2e^{-2t}e^{-3t}=-3e^{-5t}+2e^{-5t}=-e^{-5t}$. So the Wronskian is a single exponential, and it is never zero.'
        constraints: 'fundamental pairs from constant-coefficient equations; W simplifies to a constant or single exponential; a few power and logarithm pairs'
      - id: kp2
        name: Testing independence
        key_prerequisites: [determinants]
        exemplars:
          - problem: 'Are $x$ and $x^2$ linearly independent on $x>0$?'
            answer: 'linearly independent'
            answer_contract: {"kind": "label", "options": [["linearly independent", "independent", "yes", "they are independent", "not dependent", "not linearly dependent"], ["linearly dependent", "dependent", "no", "not independent", "they are dependent", "not linearly independent", "they are not linearly independent"]]}
            solution_sketch: 'Their Wronskian is $x^2$, which is nonzero for $x>0$. A nonzero Wronskian means that neither function is a constant multiple of the other.'
          - problem: 'Compute $W(x,x^2)$ for $x>0$.'
            answer: 'x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Use $W=y_1y_2''-y_1''y_2$ with $y_1=x$ and $y_2=x^2$. Then $W=x\cdot2x-1\cdot x^2=x^2$, which is nonzero for $x>0$.'
          - problem: 'Are $e^x$ and $e^{x+1}$ linearly independent?'
            answer: 'linearly dependent'
            answer_contract: {"kind": "label", "options": [["linearly independent", "independent", "yes", "they are independent", "not dependent", "not linearly dependent"], ["linearly dependent", "dependent", "no", "not independent", "they are dependent", "not linearly independent", "they are not linearly independent"]]}
            solution_sketch: 'Since $e^{x+1}=e\cdot e^x$, the second function is a constant multiple of the first. Their Wronskian is therefore $0$, and they are dependent.'
          - problem: 'The functions $e^{3x}$ and $e^{-2x}$ solve $y''''-y''-6y=0$. Compute their Wronskian.'
            answer: '-5e^x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $y_1''=3e^{3x}$ and $y_2''=-2e^{-2x}$. Then $W=e^{3x}(-2e^{-2x})-3e^{3x}e^{-2x}=-2e^x-3e^x=-5e^x$. So the Wronskian is $-5e^x$, which is never zero.'
          - problem: 'What is the Wronskian of $\sin 2x$ and $2\sin x\cos x$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the double-angle formula $2\sin x\cos x=\sin 2x$, so the two functions are equal. Their Wronskian is $0$, so they are not a fundamental set.'
          - problem: 'For which value of $k$ are $e^{2x}$ and $e^{kx}$ linearly dependent?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Their Wronskian is $(k-2)e^{(k+2)x}$, which is zero for every $x$ only if $k=2$. Then both functions equal $e^{2x}$.'
          - problem: 'A spring system obeys $y''''+9y=0$. A technician records the motions $\cos 3t$ and $\sin 3t$. Compute their Wronskian.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Use $W=y_1y_2''-y_1''y_2$ with $y_1=\cos 3t$ and $y_2=\sin 3t$. Then $W=3\cos^23t+3\sin^23t=3$, which is nonzero.'
          - problem: 'The Wronskian of $e^{ax}$ and $e^{-2ax}$ is $-6e^{-2x}$. Find $a$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $W=e^{ax}(-2ae^{-2ax})-ae^{ax}e^{-2ax}=-3ae^{-ax}$. Matching with $-6e^{-2x}$ gives $-3a=-6$ and $a=2$. Only $a=2$ gives $-3a=-6$, so no other value works.'
          - problem: 'Both $e^{2x}$ and $xe^{2x}$ solve $y''''-4y''+4y=0$. Compute their Wronskian to decide whether they form a fundamental set.'
            answer: 'e^(4x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Use $W=y_1y_2''-y_1''y_2$ with $y_1=e^{2x}$ and $y_2=xe^{2x}$. Then $W=e^{2x}(e^{2x}+2xe^{2x})-2e^{2x}\cdot xe^{2x}=e^{4x}$, which is never zero, so the pair is a fundamental set.'
        constraints: 'one pair is secretly proportional; nonvanishing W certifies a fundamental set; verdicts accept the natural words as aliases'
      - id: kp3
        name: Superposition and general solutions
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: 'Both $e^{3x}$ and $e^{-2x}$ solve $y''''-y''-6y=0$. Find the solution $y=Ae^{3x}+Be^{-2x}$ with $y(0)=5$ and $y''(0)=0$.'
            answer: '2e^(3x)+3e^(-2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The conditions give $A+B=5$ and $3A-2B=0$, so $A=2$ and $B=3$. Hence $y=2e^{3x}+3e^{-2x}$ satisfies both conditions.'
          - problem: 'The functions $y_1$ and $y_2$ both solve $y''''+y=4x$. For $y=y_1+y_2$, find $y''''+y$.'
            answer: '8x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The equation is not homogeneous, so superposition fails. Each of $y_1$ and $y_2$ gives $4x$, so the sum gives $4x+4x=8x$.'
          - problem: 'Both $e^{3x}$ and $e^{-x}$ solve $y''''-2y''-3y=0$. Find the solution $y=Ae^{3x}+Be^{-x}$ with $y(0)=5$ and $y''(0)=3$.'
            answer: '2e^(3x)+3e^(-x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The conditions give $A+B=5$ and $3A-B=3$. Adding the two equations gives $4A=8$, so $A=2$ and $B=3$.'
          - problem: 'The functions $y_1=e^{4x}$ and $y_2=e^{-x}$ solve $y''''-3y''-4y=0$. For $y=5y_1-2y_2$, find $y''''-3y''-4y$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation is linear and homogeneous, so the combination $5y_1-2y_2$ is again a solution. The left side is $5\cdot0-2\cdot0=0$.'
          - problem: 'Both $\cos 2x$ and $\sin 2x$ solve $y''''+4y=0$. Find the solution $y=A\cos 2x+B\sin 2x$ with $y(0)=3$ and $y''(0)=8$.'
            answer: '3cos(2x)+4sin(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The condition $y(0)=3$ gives $A=3$. Since $y''(0)=2B=8$, $B=4$. Hence $y=3\cos 2x+4\sin 2x$ satisfies both conditions.'
          - problem: 'Both $e^{-x}$ and $xe^{-x}$ solve $y''''+2y''+y=0$. Find the solution with $y(0)=2$ and $y''(0)=1$.'
            answer: '2e^(-x)+3x e^(-x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $y=Ae^{-x}+Bxe^{-x}$. Then $y(0)=A=2$, and $y''(0)=-A+B=1$ gives $B=3$. Hence $y=2e^{-x}+3xe^{-x}$ satisfies both conditions.'
          - problem: 'A block on a spring with a damper obeys $y''''+4y''+3y=0$ ($y$ in metres, $t$ in seconds), and $e^{-t}$ and $e^{-3t}$ are two of its motions. The block starts at $y(0)=1$ with velocity $y''(0)=-5$. Find $y(t)$.'
            answer: '-e^(-t)+2e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Write $y=Ae^{-t}+Be^{-3t}$. The conditions give $A+B=1$ and $-A-3B=-5$, so $B=2$ and $A=-1$.'
          - problem: 'A forced circuit obeys $y''''+4y=10$. Two functions $y_1$ and $y_2$ are solutions. What does $y''''+4y$ equal for the sum $y_1+y_2$?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each solution gives the value $10$ on the left side. Adding the two gives $10+10=20$, not $10$, so the sum is not a solution.'
        constraints: 'conceptual: superposition holds exactly for homogeneous linear equations; the constants are fixed by initial values'
    diagnostic_exemplar:
      problem: 'Show that $y_1 = e^{2x}$ and $y_2 = e^{-3x}$ form a fundamental set of solutions of $y'''' + y'' - 6y = 0$, and write the general solution.'
      answer: 'Both solve the equation (the characteristic roots are $2$ and $-3$), and $W = y_1 y_2'' - y_1'' y_2 = -5e^{-x} \neq 0$, so they are independent: the general solution is $y = c_1 e^{2x} + c_2 e^{-3x}$.'
      answer_contract: {kind: none}
      solution_sketch: '$r^2 + r - 6 = (r-2)(r+3)$; the Wronskian is $e^{2x}(-3e^{-3x}) - 2e^{2x}e^{-3x} = -5e^{-x}$, never zero.'
    anki_seeds:
      - front: "Wronskian of two solutions y_1, y_2?"
        back: "$W = y_1 y_2' - y_1' y_2$"
        type: basic
      - front: "Two solutions of a second-order linear homogeneous ODE form a fundamental set iff..."
        back: "their Wronskian is nonzero."
        type: basic

  - id: reduction-of-order
    name: Reduction of Order
    core: false                # special-case technique; terminal
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: homogeneous-constant-coefficients
        weight: 0.6
        key: true
      - id: linear-independence-wronskian
        weight: 0.3
        key: false
      - id: integration-substitution
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The substitution $y = v\\,y_1$"
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: 'Given that $y_1=e^{4x}$ solves $y''''-8y''+16y=0$, substitute $y=ve^{4x}$ to find the second solution $y_2$ for which $y_2(0)=0$ and $y_2''(0)=1$.'
            answer: 'x e^(4x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With $y=ve^{4x}$ we get $y''=(v''+4v)e^{4x}$ and $y''''=(v''''+8v''+16v)e^{4x}$. Substituting leaves $v''''e^{4x}=0$, so $v''''=0$ and $v=c_1+c_2x$. The conditions give $c_1=0$ and $c_2=1$, so the second solution is $xe^{4x}$.'
          - problem: 'Substitute $y=ve^{-3x}$ into $y''''+6y''+cy=0$. The terms in $v''$ cancel, and the terms in $v$ cancel too, so the equation becomes $v''''=0$. Find $c$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $y=ve^{-3x}$ we get $y''=(v''-3v)e^{-3x}$ and $y''''=(v''''-6v''+9v)e^{-3x}$. The terms in $v$ have the coefficient $9-18+c$, which is zero only for $c=9$.'
          - problem: 'A critically damped suspension obeys $y''''+6y''+9y=0$ ($y$ in metres, $t$ in seconds) and has the motion $y_1=e^{-3t}$. Substitute $y=ve^{-3t}$ to find the second motion $y_2$ for which $y_2(0)=0$ and $y_2''(0)=1$.'
            answer: 't e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The substitution leaves $v''''e^{-3t}=0$, so $v''''=0$ and $v=c_1+c_2t$. Then $y_2(0)=c_1=0$, and $y_2''(0)=c_2-3c_1=1$ gives $c_2=1$, so the second motion is $te^{-3t}$.'
          - problem: 'Substituting $y=ve^{2x}$ into $y''''-4y''+4y=0$ leaves $v''''=0$. Find $v$ when $y(0)=1$ and $y''(0)=3$.'
            answer: '1 + x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $v=c_1+c_2x$, and $y(0)=v(0)=1$ gives $c_1=1$. Since $y''=(v''+2v)e^{2x}$, the condition $y''(0)=c_2+2=3$ gives $c_2=1$, so $v=1+x$.'
          - problem: 'A constant-coefficient equation $y''''+by''+cy=0$ has the second solution $y_2=xe^{-2x}$, found by reduction of order from $y_1=e^{-2x}$. Find $b$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A second solution of the form $xe^{rx}$ appears only for a double root, so $r=-2$. The polynomial is $(r+2)^2=r^2+4r+4$, so $b=4$.'
          - problem: 'Substitute $y=ve^{6x}$ into $y''''+by''+36y=0$. The terms in $v''$ and in $v$ cancel and leave $v''''=0$. Find $b$.'
            answer: '-12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $y=ve^{6x}$ we get $y''=(v''+6v)e^{6x}$ and $y''''=(v''''+12v''+36v)e^{6x}$. The terms in $v''$ have the coefficient $12+b$, which is zero for $b=-12$.'
          - problem: 'A suspension obeys $y''''+8y''+16y=0$ ($y$ in metres, $t$ in seconds) and has the motion $e^{-4t}$. Use $y=ve^{-4t}$ to find the motion with $y(0)=1$ and $y''(0)=0$.'
            answer: '(1+4t)e^(-4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The substitution leaves $v''''=0$, so $v=c_1+c_2t$. Then $c_1=1$, and $y''(0)=c_2-4c_1=0$ gives $c_2=4$.'
          - problem: 'The equation $y''''-4y''+4y=0$ has the independent solutions $y_1=e^{2x}$ and $y_2=xe^{2x}$. Find the solution with $y(0)=3$ and $y''(0)=1$.'
            answer: '(3-5x)e^(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $y=(c_1+c_2x)e^{2x}$. Then $c_1=3$, and $y''(0)=c_2+2c_1=1$ gives $c_2=-5$. Hence $y=(3-5x)e^{2x}$ satisfies both conditions.'
          - problem: 'For $y_1=e^{5x}$ and $y_2=xe^{5x}$, find the value of the Wronskian at $x=0$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $y_2''=(1+5x)e^{5x}$ and $y_1''=5e^{5x}$. Then $W=e^{10x}(1+5x-5x)=e^{10x}$, which equals $1$ at $x=0$. So the Wronskian never vanishes, and the two solutions are independent.'
        constraints: 'constant-coefficient repeated-root cases; all v'', v terms must visibly cancel; contexts are critically damped suspensions'
      - id: kp2
        name: Variable-coefficient equations with a known solution
        key_prerequisites: [homogeneous-constant-coefficients, integration-substitution]
        exemplars:
          - problem: 'The function $y_1=x$ solves $x^2y''''-3xy''+3y=0$ for $x>0$. Find the second solution $y_2$ for which $y_2(1)=0$ and $y_2''(1)=1$.'
            answer: '(x^3-x)/2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Set $y=vx$, so $y''=v''x+v$ and $y''''=v''''x+2v''$. Substitution gives $x^3v''''-x^2v''=0$, so $w=v''$ satisfies $xw''=w$ and $w=x$, and $v=\frac{x^2}{2}$ gives the solution $x^3$. Every solution is $c_1x+c_2x^3$, and $y_2(1)=0$, $y_2''(1)=1$ give $c_1+c_2=0$ and $c_1+3c_2=1$, so $c_2=\frac{1}{2}$ and $y_2=\frac{x^3-x}{2}$.'
          - problem: 'Given that $y_1=x^3$ solves $x^2y''''-5xy''+9y=0$ for $x>0$, find the second solution $y_2$ for which $y_2(1)=0$ and $y_2''(1)=1$.'
            answer: 'x^3 ln(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Set $y=vx^3$. Substitution gives $x^5v''''+x^4v''=0$, so $w=v''$ satisfies $xw''+w=0$ and $w=\frac{1}{x}$. Then $v=\ln x$ and every solution is $c_1x^3+c_2x^3\ln x$. The conditions give $c_1=0$ and $3c_1+c_2=1$, so $c_2=1$ and $y_2=x^3\ln x$.'
          - problem: 'One solution of $x^2y''''-2y=0$ on $x>0$ is $y_1=x^2$. Find the second solution $y_2$ for which $y_2(1)=0$ and $y_2''(1)=1$.'
            answer: '(x^2-1/x)/3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Set $y=vx^2$. Substitution gives $x^4v''''+4x^3v''=0$, so $w=v''$ satisfies $xw''+4w=0$ and $w=x^{-4}$. Then $v$ is a multiple of $x^{-3}$ and every solution is $c_1x^2+\frac{c_2}{x}$. The conditions give $c_1+c_2=0$ and $2c_1-c_2=1$, so $c_1=\frac{1}{3}$ and $y_2=\frac{1}{3}\left(x^2-\frac{1}{x}\right)$.'
          - problem: 'For $x>0$, $y_1=x^3$ is a solution of $x^2y''''-7xy''+15y=0$. Find the second solution $y_2$ for which $y_2(1)=0$ and $y_2''(1)=1$.'
            answer: '(x^5-x^3)/2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Set $y=vx^3$. Substitution gives $x^5v''''-x^4v''=0$, so $w=v''$ satisfies $xw''=w$ and $w=x$. Then $v=\frac{x^2}{2}$ and every solution is $c_1x^3+c_2x^5$. The conditions give $c_1+c_2=0$ and $3c_1+5c_2=1$, so $c_2=\frac{1}{2}$ and $y_2=\frac{x^5-x^3}{2}$.'
          - problem: 'The function $y_1=\frac{1}{x}$ solves $x^2y''''+3xy''+y=0$ for $x>0$. Find the second solution $y_2$ for which $y_2(1)=0$ and $y_2''(1)=1$.'
            answer: 'ln(x)/x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Set $y=\frac{v}{x}$. Substitution gives $xv''''+v''=0$, so $(xv'')''=0$ and $v''=\frac{C}{x}$. Then every solution is $\frac{c_1+c_2\ln x}{x}$. The conditions give $c_1=0$ and $-c_1+c_2=1$, so $c_2=1$ and $y_2=\frac{\ln x}{x}$.'
          - problem: 'The equation $x^2y''''-5xy''+8y=0$ has the solution $y_1=x^2$ for $x>0$. Find the second solution $y_2$ for which $y_2(1)=0$ and $y_2''(1)=1$.'
            answer: '(x^4-x^2)/2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Set $y=vx^2$. Substitution gives $x^4v''''-x^3v''=0$, so $w=v''$ satisfies $xw''=w$ and $w=x$. Then $v=\frac{x^2}{2}$ and every solution is $c_1x^2+c_2x^4$. The conditions give $c_1+c_2=0$ and $2c_1+4c_2=1$, so $c_2=\frac{1}{2}$ and $y_2=\frac{x^4-x^2}{2}$.'
          - problem: 'Both $y_1=x$ and $y_2=x^3$ solve $x^2y''''-3xy''+3y=0$ for $x>0$. Find the solution with $y(1)=2$ and $y''(1)=4$.'
            answer: 'x + x^3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Write $y=c_1x+c_2x^3$. The conditions give $c_1+c_2=2$ and $c_1+3c_2=4$, so $c_2=1$ and $c_1=1$.'
          - problem: 'Both $x^2$ and $x^2\ln x$ solve $x^2y''''+axy''+by=0$ for $x>0$. Find $a$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'These two solutions belong to the double exponent $m=2$, so $m^2+(a-1)m+b=(m-2)^2$. Comparing the coefficients of $m$ gives $a-1=-4$, so $a=-3$.'
          - problem: 'A model of a heat profile $u(r)$ at distance $r>0$ from the centre of a disc obeys $r^2u''''-4ru''+6u=0$, and one profile is $u_1=r^2$. Find the second profile $u_2$ for which $u_2(1)=0$ and $u_2''(1)=1$.'
            answer: 'r^3-r^2'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'Set $u=vr^2$. Substitution gives $r^4v''''=0$, because the terms in $v''$ and in $v$ cancel, so $v=c_1+c_2r$ and every solution is $c_1r^2+c_2r^3$. The conditions give $c_1+c_2=0$ and $2c_1+3c_2=1$, so $c_2=1$ and $u_2=r^3-r^2$.'
          - problem: 'A model of a radial profile $u(r)$ with $r>0$ obeys $r^2u''''+ru''-4u=0$, and one profile is $u_1=r^2$. Find the second profile $u_2$ for which $u_2(1)=0$ and $u_2''(1)=1$.'
            answer: '(r^2-1/r^2)/4'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'Set $u=vr^2$. Substitution gives $r^4v''''+5r^3v''=0$, so $w=v''$ satisfies $rw''+5w=0$ and $w=r^{-5}$. Then $v$ is a multiple of $r^{-4}$ and every solution is $c_1r^2+\frac{c_2}{r^2}$. The conditions give $c_1+c_2=0$ and $2c_1-2c_2=1$, so $c_1=\frac{1}{4}$ and $u_2=\frac{1}{4}\left(r^2-\frac{1}{r^2}\right)$.'
        constraints: 'Cauchy-Euler-type equations with y_1 = x^m given; the v-equation is first order in v''; two radial-profile models serve as the in-context items'
      - id: kp3
        name: The reduction-of-order formula
        key_prerequisites: [homogeneous-constant-coefficients, integration-substitution]
        exemplars:
          - problem: 'For $y''''-2y''+y=0$ one solution is $y_1=e^x$. Use the reduction-of-order formula, taking every constant of integration to be zero, to find a second independent solution.'
            answer: 'x e^x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $p=-2$, so $e^{-\int p\,dx}=e^{2x}$. The integrand is $\frac{e^{2x}}{(e^x)^2}=1$, with integral $x$, so $y_2=xe^x$.'
          - problem: 'Write $x^2y''''-3xy''+4y=0$ for $x>0$ in the form $y''''+p(x)y''+q(x)y=0$. What is $p(x)$?'
            answer: '-3/x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide the equation by $x^2$ to get $y''''-\frac{3}{x}y''+\frac{4}{x^2}y=0$. The coefficient of $y''$ is $p(x)=-\frac{3}{x}$.'
          - problem: 'For $y''''-6y''+9y=0$, compute $e^{-\int p\,dx}$, where $p$ is the coefficient of $y''$.'
            answer: 'e^(6x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $p=-6$, so $\int p\,dx=-6x$. Then $e^{-\int p\,dx}=e^{6x}$. This factor is the numerator of the integrand in the reduction-of-order formula.'
          - problem: 'A block of mass $1$ kg on a spring of stiffness $16$ N/m with a damper of $8$ kg/s obeys $y''''+8y''+16y=0$, and one motion is $y_1=e^{-4t}$. Use the reduction-of-order formula, taking every constant of integration to be zero, to find a second independent motion.'
            answer: 't e^(-4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Here $p=8$, so $e^{-\int p\,dt}=e^{-8t}$. The integrand is $\frac{e^{-8t}}{(e^{-4t})^2}=1$, with integral $t$, so $y_2=te^{-4t}$.'
          - problem: 'For $x^2y''''-3xy''+4y=0$ with $x>0$, one solution is $y_1=x^2$. Use the reduction-of-order formula, taking every constant of integration to be zero, to find a second independent solution.'
            answer: 'x^2 ln(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'In standard form $p=-\frac{3}{x}$, so $e^{-\int p\,dx}=x^3$. The integrand is $\frac{x^3}{x^4}=\frac{1}{x}$, with integral $\ln x$, so $y_2=x^2\ln x$.'
          - problem: 'One solution of $x^2y''''+3xy''+y=0$ for $x>0$ is $y_1=\frac{1}{x}$. Use the reduction-of-order formula, taking every constant of integration to be zero, to find a second independent solution.'
            answer: 'ln(x)/x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'In standard form $p=\frac{3}{x}$, so $e^{-\int p\,dx}=x^{-3}$. The integrand is $\frac{x^{-3}}{x^{-2}}=\frac{1}{x}$, with integral $\ln x$, so $y_2=\frac{\ln x}{x}$.'
          - problem: 'The equation $x^2y''''-4xy''+6y=0$ has the solution $y_1=x^2$ for $x>0$. Use the reduction-of-order formula, taking every constant of integration to be zero, to find a second independent solution.'
            answer: 'x^3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'In standard form $p=-\frac{4}{x}$, so $e^{-\int p\,dx}=x^4$. The integrand is $\frac{x^4}{x^4}=1$, with integral $x$, so $y_2=x^3$.'
          - problem: 'A model of the temperature $u(r)$ at distance $r>0$ from the axis of a pipe obeys $r^2u''''-2ru''+2u=0$, and one profile is $u_1=r$. Use the reduction-of-order formula, taking every constant of integration to be zero, to find a second independent profile.'
            answer: 'r^2'
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: 'In standard form $p=-\frac{2}{r}$, so $e^{-\int p\,dr}=r^2$. The integrand is $\frac{r^2}{r^2}=1$, with integral $r$, so $u_2=r^2$.'
          - problem: 'For $y''''+4y''+4y=0$ with $y_1=e^{-2x}$, simplify the integrand $\frac{e^{-\int p\,dx}}{y_1^2}$ of the reduction-of-order formula.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $p=4$, so $e^{-\int p\,dx}=e^{-4x}$. Also $y_1^2=e^{-4x}$, so the integrand is $1$.'
        constraints: 'divide to standard form before reading p; integrals reduce to powers or ln; single steps of the formula (p, the exponential factor, the integrand) are also asked'
    diagnostic_exemplar:
      problem: 'Given that $y_1 = x$ solves $x^2 y'''' - xy'' + y = 0$ ($x > 0$), find a second independent solution.'
      answer: '$y_2 = x\ln x$'
      answer_contract: {kind: none}
      solution_sketch: 'Put $y = vx$: then $y'' = v''x + v$ and $y'''' = v''''x + 2v''$, and the equation collapses to $x^3 v'''' + x^2 v'' = 0$, i.e. $(xv'')'' = 0$. Hence $v'' = C/x$ and $v = \ln x$, giving $y_2 = x\ln x$.'
    anki_seeds:
      - front: "Reduction-of-order formula for a second solution of y'' + py' + qy = 0 given y_1?"
        back: '$y_2 = y_1 \int \dfrac{e^{-\int p\,dx}}{y_1^2}\,dx$'
        type: basic
      - front: "Why does a double characteristic root give solutions e^{rx} and xe^{rx}?"
        back: "Reduction of order yields v'' = 0, whose independent solution is v = x."
        type: basic

  - id: undetermined-coefficients-basic
    name: "Undetermined Coefficients: Polynomials and Exponentials"
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: characteristic-equation-real-roots
        weight: 0.5
        key: true
      - id: homogeneous-constant-coefficients
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "The structure $y = y_h + y_p$"
        key_prerequisites: [homogeneous-constant-coefficients]
        try_first:
          problem: 'What is the value of $y''''-5y''+4y$ when $y=1+e^{4x}$?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'The part $e^{4x}$ contributes $0$ and the constant $1$ contributes $4$, so $y=1+e^{4x}$ solves $y''''-5y''+4y=4$. A solution of the full equation is a homogeneous solution plus one particular solution.'
        exemplars:
          - problem: 'The function $y_p=2$ is a particular solution of $y''''-3y''+2y=4$. Find the solution of this equation that satisfies $y(0)=7$ and $y''(0)=6$.'
            answer: '4e^x + e^(2x) + 2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The characteristic roots are 1 and 2, so y = c1 e^x + c2 e^(2x) + 2. The condition y(0) = 7 gives c1 + c2 = 5, and y''(0) = 6 gives c1 + 2c2 = 6. Subtracting the first equation from the second gives c2 = 1, so c1 = 4. The solution is y = 4e^x + e^(2x) + 2.'
          - problem: 'Is $y=5e^{2x}+2$ a solution of $y''''-3y''+2y=4$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "it is a solution", "yes, it is a solution", "yes it is a solution", "yes it is", "y is a solution"], ["no", "no, it is not", "it is not", "not a solution", "it is not a solution", "no, it is not a solution", "no it is not", "y is not a solution"]]}
            solution_sketch: 'The term 5e^(2x) solves the homogeneous equation, because 20 - 30 + 10 = 0. The constant 2 gives 0 - 0 + 2(2) = 4, which is the right side. By linearity the sum solves y'''' - 3y'' + 2y = 4, so the answer is yes.'
          - problem: 'Is $y=e^{3x}+2$ a solution of $y''''-3y''+2y=4$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is", "it is", "it is a solution", "yes, it is a solution", "yes it is a solution", "yes it is", "y is a solution"], ["no", "no, it is not", "it is not", "not a solution", "it is not a solution", "no, it is not a solution", "no it is not", "y is not a solution"]]}
            solution_sketch: 'Substitute y = e^(3x) + 2. Then y'''' - 3y'' + 2y = 9e^(3x) - 9e^(3x) + 2e^(3x) + 4 = 2e^(3x) + 4. This is not equal to 4, because e^(3x) does not solve the homogeneous equation. The answer is no.'
          - problem: 'The equation $y''''+3y''+2y=6$ has the particular solution $y_p=3$. Find the solution that satisfies $y(0)=2$ and $y''(0)=3$.'
            answer: '3 + e^(-x) - 2e^(-2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The characteristic roots are -1 and -2, so y = c1 e^(-x) + c2 e^(-2x) + 3. The condition y(0) = 2 gives c1 + c2 = -1, and y''(0) = 3 gives -c1 - 2c2 = 3. Adding the two equations gives -c2 = 2, so c2 = -2 and c1 = 1. The solution is y = 3 + e^(-x) - 2e^(-2x).'
          - problem: 'A cart of mass $1$ kg is held by a spring of constant $6$ N/m and a damper with coefficient $5$ N·s/m. A constant push of $12$ N acts on it. Its displacement $x(t)$ in metres obeys $mx''''+cx''+kx=F$. After the transient dies out, how far from the equilibrium position does the cart settle?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The equation is x'''' + 5x'' + 6x = 12. A constant particular solution x = C gives 6C = 12, so C = 12/6 = 2. The roots of r^2 + 5r + 6 = 0 are -2 and -3, so the transient dies out and the cart settles 2 m from the equilibrium position.'
          - problem: 'Solve $y''''-5y''+6y=6$ with $y(0)=6$ and $y''(0)=7$. What is $y(x)$?'
            answer: '8e^(2x) - 3e^(3x) + 1'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The first condition is y(0) = c1 + c2 + 1 = 6, so c1 + c2 = 5. The second condition y''(0) = 2c1 + 3c2 = 7. From c1 + c2 = 5 we get 2c1 + 2c2 = 10, and subtracting gives c2 = -3, so c1 = 8. The solution is y = 8e^(2x) - 3e^(3x) + 1.'
          - problem: 'The function $y_p=-2$ is a particular solution of $y''''+2y''-3y=6$. Find the solution that satisfies $y(0)=1$ and $y''(0)=-13$.'
            answer: '-e^x + 4e^(-3x) - 2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The characteristic roots are 1 and -3, so y = c1 e^x + c2 e^(-3x) - 2. The condition y(0) = 1 gives c1 + c2 = 3, and y''(0) = -13 gives c1 - 3c2 = -13. Subtracting gives 4c2 = 16, so c2 = 4 and c1 = -1. The solution is y = -e^x + 4e^(-3x) - 2.'
          - problem: 'A series circuit has inductance $L=1$ H, resistance $R=3\ \Omega$, capacitance $C=0.5$ F and a constant source of $6$ V. The charge $q$ on the capacitor, in coulombs, obeys $Lq''''+Rq''+q/C=E$. After the transient dies out, how much charge does the capacitor hold?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since 1/C = 2, the charge obeys q'''' + 3q'' + 2q = 6. A constant solution q = Q gives 2Q = 6, so Q = 3. The roots -1 and -2 are negative, so the transient dies out and the capacitor holds 3 coulombs.'
          - problem: 'Find the constant $C$ for which $y=C$ solves $y''''-5y''+4y=-4$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If y = C then y'' = 0 and y'''' = 0, so the equation reduces to 4C = -4. Hence C = -1, and y = -1 is a particular solution of the equation.'
        constraints: 'the general solution is always y_h plus one particular solution; verify by substitution; initial values fix the constants after y_p is added'
      - id: kp2
        name: Polynomial forcing
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: 'Find a particular solution of $y''''-y''-2y=4x$.'
            answer: '-2x + 1'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = Ax + B, so y'' = A and y'''' = 0. Then -A - 2Ax - 2B = 4x. Matching the x terms gives -2A = 4, so A = -2. Matching constants gives -A - 2B = 0, so B = 1, and y = -2x + 1.'
          - problem: 'Find a particular solution of $y''''+4y=8x^2$.'
            answer: '2x^2 - 1'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = Ax^2 + Bx + C, so y'''' = 2A. Then 2A + 4Ax^2 + 4Bx + 4C = 8x^2. Matching coefficients gives A = 2, B = 0 and 2A + 4C = 0, so C = -1. Hence y = 2x^2 - 1.'
          - problem: 'Find a particular solution of $y''''-3y''+2y=2x^2+2x$.'
            answer: 'x^2 + 4x + 5'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = Ax^2 + Bx + C. Then y'''' - 3y'' + 2y = 2Ax^2 + (2B - 6A)x + (2A - 3B + 2C). Matching with 2x^2 + 2x gives A = 1, then 2B - 6 = 2 so B = 4, then 2 - 12 + 2C = 0 so C = 5. Hence y = x^2 + 4x + 5.'
          - problem: 'Find a particular solution of $y''''+y''-6y=18$.'
            answer: '-3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The forcing is a constant, so try y = C. Then y'' = 0 and y'''' = 0, and the equation becomes -6C = 18. Hence C = -3, and y = -3 is a particular solution.'
          - problem: 'A mass of $1$ kg on a spring of constant $4$ N/m, with no damping, is pushed by a force $F(t)=8t^2$ newtons. Using $mx''''+kx=F$, find a particular solution $x_p(t)$.'
            answer: '2t^2 - 1'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation is x'''' + 4x = 8t^2. Try x = At^2 + Bt + C, so x'''' = 2A. Then 2A + 4At^2 + 4Bt + 4C = 8t^2 gives A = 2, B = 0 and 2A + 4C = 0, so C = -1. Hence x_p = 2t^2 - 1.'
          - problem: 'What is a particular solution of $y''''+2y''-3y=9x+3$?'
            answer: '-3x - 3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'A trial Ax has no constant term, but y'' = A adds a constant to the left side, so the trial must be Ax + B. Then 2A - 3Ax - 3B = 9x + 3 gives -3A = 9, so A = -3, and 2A - 3B = 3 gives -6 - 3B = 3, so B = -3. Hence y = -3x - 3.'
          - problem: 'Solve $y''''-y''-2y=6x+3$ with $y(0)=3$ and $y''(0)=-3$.'
            answer: 'e^(2x) + 2e^(-x) - 3x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The roots of r^2 - r - 2 = 0 are 2 and -1. Trying y_p = Ax + B gives A = -3 and B = 0, so y = c1 e^(2x) + c2 e^(-x) - 3x. Then y(0) = 3 gives c1 + c2 = 3, and y''(0) = -3 gives 2c1 - c2 - 3 = -3, so 2c1 = c2. Hence c1 = 1 and c2 = 2, so y = e^(2x) + 2e^(-x) - 3x.'
          - problem: 'A series circuit has $L=1$ H, $R=3\ \Omega$ and $C=0.5$ F. The source voltage rises as $E(t)=4t$ volts. The charge obeys $Lq''''+Rq''+q/C=E$. Find a particular solution $q_p(t)$.'
            answer: '2t - 3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Since 1/C = 2, the equation is q'''' + 3q'' + 2q = 4t. Try q = At + B, so q'' = A and q'''' = 0. Then 3A + 2At + 2B = 4t gives 2A = 4, so A = 2, and 3A + 2B = 0 gives B = -3. Hence q_p = 2t - 3.'
        constraints: 'forcing is a polynomial of degree <= 2 (also in spring and circuit contexts); the trial is the full polynomial of the same degree'
      - id: kp3
        name: Exponential forcing
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: 'Find a particular solution of $y''''+3y''+2y=6e^{x}$.'
            answer: 'e^x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = Ae^x, so y'' = Ae^x and y'''' = Ae^x. Then y'''' + 3y'' + 2y = (1 + 3 + 2)Ae^x = 6Ae^x. Matching 6e^x gives A = 1, so y = e^x.'
          - problem: 'Find a particular solution of $y''''+y=5e^{2x}$.'
            answer: 'e^(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = Ae^(2x), so y'''' = 4Ae^(2x). Then y'''' + y = (4 + 1)Ae^(2x) = 5Ae^(2x). Matching 5e^(2x) gives A = 1, so y = e^(2x).'
          - problem: 'Find a particular solution of $y''''-y''-2y=12e^{3x}$.'
            answer: '3e^(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The characteristic polynomial r^2 - r - 2 has the value 9 - 3 - 2 = 4 at r = 3. Trying y = Ae^(3x) gives 4Ae^(3x) = 12e^(3x), so A = 12/4 = 3. Hence y = 3e^(3x).'
          - problem: 'Substitute $y_p=Ae^{x}$ into $y''''+y''-6y=10e^{x}$. What is the particular solution?'
            answer: '-(5/2)e^x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The characteristic polynomial r^2 + r - 6 has the value 1 + 1 - 6 = -4 at r = 1. So -4Ae^x = 10e^x, and A = 10/(-4) = -5/2. So the solution is y = -(5/2)e^x.'
          - problem: 'A mass of $1$ kg on a spring of constant $2$ N/m, with damping coefficient $3$ N·s/m, is driven by the force $F(t)=12e^{-3t}$ newtons. Using $mx''''+cx''+kx=F$, find a particular solution $x_p(t)$.'
            answer: '6e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation is x'''' + 3x'' + 2x = 12e^(-3t). Trying x = Ae^(-3t) gives (9 - 9 + 2)Ae^(-3t) = 2Ae^(-3t). Matching 12e^(-3t) gives A = 12/2 = 6, so x_p = 6e^(-3t).'
          - problem: 'A series circuit has $L=2$ H, $R=6\ \Omega$ and $C=0.25$ F. The source voltage is $E(t)=40e^{-3t}$ volts. The charge obeys $Lq''''+Rq''+q/C=E$. Find a particular solution $q_p(t)$.'
            answer: '10e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Since 1/C = 4, the equation is 2q'''' + 6q'' + 4q = 40e^(-3t). Trying q = Ae^(-3t) gives (18 - 18 + 4)Ae^(-3t) = 4Ae^(-3t). Matching 40e^(-3t) gives A = 40/4 = 10, so q_p = 10e^(-3t).'
          - problem: 'Find a particular solution of $y''''-4y=9e^{x}$.'
            answer: '-3e^x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The characteristic polynomial r^2 - 4 has the value 1 - 4 = -3 at r = 1. Trying y = Ae^x gives -3Ae^x = 9e^x, so A = -3. Hence y = -3e^x.'
          - problem: 'Find a particular solution of $y''''+2y''+5y=20e^{-x}$.'
            answer: '5e^(-x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The characteristic polynomial r^2 + 2r + 5 has the value 1 - 2 + 5 = 4 at r = -1. Trying y = Ae^(-x) gives 4Ae^(-x) = 20e^(-x), so A = 5. Hence y = 5e^(-x).'
          - problem: 'Find a particular solution of $y''''-3y''+2y=8e^{4x}$.'
            answer: '(4/3)e^(4x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The characteristic polynomial r^2 - 3r + 2 has the value 16 - 12 + 2 = 6 at r = 4. Trying y = Ae^(4x) gives 6Ae^(4x) = 8e^(4x), so A = 8/6 = 4/3. Hence y = (4/3)e^(4x).'
        constraints: 'single e^{kx} forcing (also in spring and circuit contexts); k never a characteristic root here; A = (forcing coeff)/(char. polynomial at k)'
    diagnostic_exemplar:
      problem: 'Find the general solution of $y'''' + 3y'' + 2y = 20e^{3x}$.'
      answer: '$y = c_1 e^{-x} + c_2 e^{-2x} + e^{3x}$'
      answer_contract: {kind: none}
      solution_sketch: 'The homogeneous roots are $-1$ and $-2$. Trying $y_p = Ae^{3x}$ gives $(9 + 9 + 2)A = 20A = 20$, so $A = 1$.'
    anki_seeds:
      - front: "General solution of a nonhomogeneous linear ODE?"
        back: "$y = y_h + y_p$: the full homogeneous family plus any one particular solution."
        type: basic
      - front: "Undetermined coefficients: trial for forcing $ke^{ax}$ (a not a characteristic root)?"
        back: "$y_p = Ae^{ax}$"
        type: basic

  - id: undetermined-coefficients
    name: Undetermined Coefficients
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: undetermined-coefficients-basic
        weight: 0.7
        key: true
      - id: derivatives-trig
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Sinusoidal forcing
        key_prerequisites: [undetermined-coefficients-basic, derivatives-trig]
        exemplars:
          - problem: 'Find a particular solution of $y''''+3y''+2y=10\sin x$.'
            answer: '-3cos(x) + sin(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = a cos x + b sin x. Then y'''' + 3y'' + 2y = (a + 3b)cos x + (b - 3a)sin x. Matching 10 sin x gives a + 3b = 0 and b - 3a = 10, so a = -3b and 10b = 10. Hence b = 1, a = -3, and y = -3cos x + sin x.'
          - problem: 'Find a particular solution of $y''''+2y''+7y=25\sin(2x)$.'
            answer: '-4cos(2x) + 3sin(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = a cos(2x) + b sin(2x). Then the cos(2x) coefficient is 3a + 4b and the sin(2x) coefficient is 3b - 4a. Matching 25 sin(2x) gives 3a + 4b = 0 and 3b - 4a = 25. Hence a = -4 and b = 3, so y = -4cos(2x) + 3sin(2x).'
          - problem: 'Find a particular solution of $y''''+4y=10\sin(3x)$.'
            answer: '-2sin(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'There is no y'' term, so try y = b sin(3x). Then y'''' + 4y = (-9 + 4)b sin(3x) = -5b sin(3x). Matching 10 sin(3x) gives b = -2, so y = -2 sin(3x).'
          - problem: 'A mass of $1$ kg on a spring of constant $5$ N/m, with no damping, is driven by the force $F(t)=12\cos(3t)$ newtons. Using $mx''''+kx=F$, find a particular solution $x_p(t)$.'
            answer: '-3cos(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation is x'''' + 5x = 12 cos(3t). There is no x'' term, so try x = a cos(3t). Then x'''' + 5x = (-9 + 5)a cos(3t) = -4a cos(3t). Matching 12 cos(3t) gives a = -3, so x_p = -3cos(3t).'
          - problem: 'Find a particular solution of $y''''+y''+y=13\sin(2x)$.'
            answer: '-2cos(2x) - 3sin(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = a cos(2x) + b sin(2x). Then the cos(2x) coefficient is -3a + 2b and the sin(2x) coefficient is -2a - 3b. Matching 13 sin(2x) gives -3a + 2b = 0 and -2a - 3b = 13. Hence a = -2 and b = -3, so y = -2cos(2x) - 3sin(2x).'
          - problem: 'A series circuit has $L=1$ H, $R=4\ \Omega$, $C=\tfrac1{14}$ F and the source voltage $E(t)=169\cos(3t)$ volts. The charge obeys $Lq''''+Rq''+q/C=E$. Find a particular solution $q_p(t)$.'
            answer: '5cos(3t) + 12sin(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Since 1/C = 14, the equation is q'''' + 4q'' + 14q = 169 cos(3t). Try q = a cos(3t) + b sin(3t). Then the cos(3t) coefficient is 5a + 12b and the sin(3t) coefficient is 5b - 12a. Matching gives 5a + 12b = 169 and 5b - 12a = 0, so a = 5 and b = 12.'
          - problem: 'A mass of $1$ kg on a spring of constant $7$ N/m, with damping coefficient $2$ N·s/m, is driven by $F(t)=25\cos(2t)$ newtons. What is the amplitude, in metres, of the motion that remains after the transient dies out?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The equation is x'''' + 2x'' + 7x = 25 cos(2t). The steady motion is x_p = a cos(2t) + b sin(2t), and matching gives a = 3 and b = 4. The amplitude of 3 cos(2t) + 4 sin(2t) is sqrt(3^2 + 4^2) = 5 m.'
          - problem: 'What is a particular solution of $y''''+2y''+2y=5\cos x$?'
            answer: 'cos(x) + 2sin(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The y'' term brings in sine terms, so the trial must be y = a cos x + b sin x. Then the cos x coefficient is a + 2b and the sin x coefficient is b - 2a. Matching 5 cos x gives a + 2b = 5 and b - 2a = 0, so b = 2a and 5a = 5. Hence y = cos x + 2 sin x.'
          - problem: 'Find a particular solution of $y''''+2y''+7y=25\cos(2x)$.'
            answer: '3cos(2x) + 4sin(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = a cos(2x) + b sin(2x). Then the cos(2x) coefficient is 3a + 4b and the sin(2x) coefficient is 3b - 4a. Matching 25 cos(2x) gives 3a + 4b = 25 and 3b - 4a = 0. Hence a = 3 and b = 4, so y = 3cos(2x) + 4sin(2x).'
        constraints: 'forcing k sin(omega x) or k cos(omega x) with integer omega; always try both cos and sin when a y'' term is present (also in spring and circuit contexts)'
      - id: kp2
        name: The resonance modification
        key_prerequisites: [undetermined-coefficients-basic]
        try_first:
          problem: 'What is the value of $y''''-y$ when $y=Ae^{x}$, for any constant $A$?'
          answer_contract: {"kind": "exact"}
          answer: '0'
          reveal: 'The result is $0$ for every $A$, so $Ae^{x}$ can never produce the forcing $6e^{x}$ of a similar equation. When the forcing already solves the homogeneous equation, the trial must be multiplied by $x$.'
        exemplars:
          - problem: 'Use undetermined coefficients to find a particular solution of $y''''-y=6e^{x}$.'
            answer: '3x e^x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The forcing e^x solves the homogeneous equation, so try y = Axe^x. Then y'''' = A(x + 2)e^x, and y'''' - y = 2Ae^x. Matching 6e^x gives A = 3, so y = 3xe^x.'
          - problem: 'Use undetermined coefficients to find a particular solution of $y''''+4y=3\cos(2x)$.'
            answer: '(3/4)x sin(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The forcing cos(2x) solves the homogeneous equation, so try y = x(a cos(2x) + b sin(2x)). Then y'''' + 4y = -4a sin(2x) + 4b cos(2x). Matching 3 cos(2x) gives a = 0 and b = 3/4, so y = (3/4)x sin(2x).'
          - problem: 'Use undetermined coefficients to find a particular solution of $y''''+y=6\sin x$.'
            answer: '-3x cos(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The forcing sin x solves the homogeneous equation, so try y = x(a cos x + b sin x). Then y'''' + y = -2a sin x + 2b cos x. Matching 6 sin x gives a = -3 and b = 0, so y = -3x cos x.'
          - problem: 'Use undetermined coefficients to find a particular solution of $y''''-16y=8e^{4x}$.'
            answer: 'x e^(4x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The forcing e^(4x) solves the homogeneous equation, so try y = Axe^(4x). Then y'''' = A(8 + 16x)e^(4x), and y'''' - 16y = 8Ae^(4x). Matching 8e^(4x) gives A = 1, so y = xe^(4x).'
          - problem: 'What particular solution does undetermined coefficients give for $y''''-9y=12e^{3x}$?'
            answer: '2x e^(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The function e^(3x) solves the homogeneous equation, so the trial must be y = Axe^(3x). Then y'''' = A(6 + 9x)e^(3x), and y'''' - 9y = 6Ae^(3x). Matching 12e^(3x) gives A = 2, so y = 2xe^(3x).'
          - problem: 'A mass of $1$ kg on a spring of constant $16$ N/m, with no damping, is driven by $F(t)=8\sin(4t)$ newtons. Using $mx''''+kx=F$ and undetermined coefficients, find a particular solution $x_p(t)$.'
            answer: '-t cos(4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation is x'''' + 16x = 8 sin(4t), and sin(4t) solves the homogeneous equation. Try x = t(a cos(4t) + b sin(4t)). Then x'''' + 16x = -8a sin(4t) + 8b cos(4t). Matching 8 sin(4t) gives a = -1 and b = 0, so x_p = -t cos(4t).'
          - problem: 'A mass of $1$ kg on a spring of constant $25$ N/m, with no damping, is driven by $F(t)=10\cos(5t)$ newtons. Does the amplitude of its motion grow without bound?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "it does", "it grows", "grows without bound", "unbounded", "yes it does", "resonance"], ["no", "no, it does not", "it does not", "bounded", "stays bounded", "it is bounded", "no resonance", "it does not grow"]]}
            solution_sketch: 'The equation is x'''' + 25x = 10 cos(5t). The natural frequency is sqrt(25) = 5, which equals the driving frequency 5. This is resonance, and the particular solution contains t sin(5t), so the amplitude grows without bound. The answer is yes.'
          - problem: 'A mass of $1$ kg on a spring of constant $25$ N/m, with no damping, is driven by $F(t)=10\cos(3t)$ newtons. Does the amplitude of its motion grow without bound?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "it does", "it grows", "grows without bound", "unbounded", "yes it does", "resonance"], ["no", "no, it does not", "it does not", "bounded", "stays bounded", "it is bounded", "no resonance", "it does not grow"]]}
            solution_sketch: 'The natural frequency is sqrt(25) = 5, and the driving frequency is 3, so there is no resonance. The particular solution is a cos(3t) with (25 - 9)a = 10, so it stays bounded. The answer is no.'
          - problem: 'Use undetermined coefficients to find a particular solution of $y''''+y=\sin x$.'
            answer: '-(1/2)x cos(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The forcing sin x solves the homogeneous equation, so try y = x(a cos x + b sin x). Then y'''' + y = -2a sin x + 2b cos x. Matching sin x gives -2a = 1, so a = -1/2, and b = 0. Hence y = -(1/2)x cos x.'
        constraints: 'forcing duplicates exactly one homogeneous solution; multiply the trial by x (never x^2 here); resonance contexts have no damping'
      - id: kp3
        name: Products and superposition of forcings
        key_prerequisites: [undetermined-coefficients-basic]
        exemplars:
          - problem: 'Find a particular solution of $y''''-3y''+2y=4x+2e^{3x}$.'
            answer: '2x + 3 + e^(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Split the forcing. For 4x, try Ax + B: -3A + 2Ax + 2B = 4x gives A = 2 and B = 3. For 2e^(3x), try Ce^(3x): (9 - 9 + 2)C = 2 gives C = 1. Adding the two parts gives y = 2x + 3 + e^(3x).'
          - problem: 'Find a particular solution of $y''''+2y''+y=xe^{x}$.'
            answer: '(x - 1)e^x/4'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The root -1 is double, so e^x is not resonant; try y = (Ax + B)e^x. Then y'''' + 2y'' + y = (4Ax + 4B + 4A)e^x. Matching xe^x gives 4A = 1 and 4B + 4A = 0, so A = 1/4 and B = -1/4. Hence y = (x - 1)e^x/4.'
          - problem: 'Find a particular solution of $y''''+y''-6y=(2x+1)e^{x}$.'
            answer: '(-x/2 - 5/8)e^x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = (Ax + B)e^x. Then y'''' + y'' - 6y = (-4Ax - 4B + 3A)e^x. Matching (2x + 1)e^x gives -4A = 2 and 3A - 4B = 1, so A = -1/2 and B = -5/8. Hence y = (-x/2 - 5/8)e^x.'
          - problem: 'Find a particular solution of $y''''+4y=x\cos x$.'
            answer: 'x cos(x)/3 + 2sin(x)/9'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Try y = (Ax + B)cos x + (Cx + D)sin x. Matching the x cos x and x sin x terms gives 3A = 1 and 3C = 0. Matching the cos x and sin x terms gives 3B + 2C = 0 and 3D - 2A = 0. So A = 1/3, B = 0, C = 0 and D = 2/9, and y = x cos x/3 + 2 sin x/9.'
          - problem: 'Find a particular solution of $y''''-y=6\cos(2x)+2e^{3x}$.'
            answer: '-(6/5)cos(2x) + e^(3x)/4'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Split the forcing. For 6 cos(2x), try a cos(2x): (-4 - 1)a = 6 gives a = -6/5. For 2e^(3x), try Ce^(3x): (9 - 1)C = 2 gives C = 1/4. Adding the two parts gives y = -(6/5)cos(2x) + e^(3x)/4.'
          - problem: 'Use undetermined coefficients to find a particular solution of $y''''+4y=x\sin(2x)$.'
            answer: 'x sin(2x)/16 - x^2 cos(2x)/8'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The function sin(2x) solves the homogeneous equation, so multiply the trial by x: y = x[(Ax + B)cos(2x) + (Cx + D)sin(2x)]. Matching coefficients gives A = -1/8, B = 0, C = 0 and D = 1/16. Hence y = x sin(2x)/16 - x^2 cos(2x)/8.'
          - problem: 'A mass of $1$ kg on a spring of constant $2$ N/m, with damping coefficient $3$ N·s/m, is driven by $F(t)=4t+10\sin t$ newtons. Using $mx''''+cx''+kx=F$, find a particular solution $x_p(t)$.'
            answer: '2t - 3 - 3cos(t) + sin(t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation is x'''' + 3x'' + 2x = 4t + 10 sin t. For 4t, try At + B: 3A + 2At + 2B = 4t gives A = 2 and B = -3. For 10 sin t, try a cos t + b sin t: a + 3b = 0 and b - 3a = 10 give a = -3 and b = 1. Adding gives x_p = 2t - 3 - 3cos t + sin t.'
          - problem: 'A series circuit has $L=1$ H, $R=4\ \Omega$ and $C=\tfrac13$ F. The source voltage is $E(t)=9t+4e^{-2t}$ volts. The charge obeys $Lq''''+Rq''+q/C=E$. Find a particular solution $q_p(t)$.'
            answer: '3t - 4 - 4e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Since 1/C = 3, the equation is q'''' + 4q'' + 3q = 9t + 4e^(-2t). For 9t, try At + B: 4A + 3At + 3B = 9t gives A = 3 and B = -4. For 4e^(-2t), try Ce^(-2t): (4 - 8 + 3)C = 4 gives C = -4. Adding gives q_p = 3t - 4 - 4e^(-2t).'
        constraints: 'sums of forcings split by superposition; products take polynomial-coefficient trials; the item asks for y_p as a function (also in spring and circuit contexts)'
    diagnostic_exemplar:
      problem: 'Find a particular solution of $y'''' - y = 4e^{x} + 3$.'
      answer: '$y_p = 2xe^{x} - 3$'
      answer_contract: {kind: none}
      solution_sketch: 'The homogeneous roots are $\pm 1$, so $e^x$ is resonant and the trial form is $Axe^x$: then $y'''' - y = 2Ae^x = 4e^x$ gives $A = 2$. For the constant forcing, $y_p = B$ with $-B = 3$, so $B = -3$. Superpose.'
    anki_seeds:
      - front: "Undetermined coefficients: what do you do when the trial solution solves the homogeneous equation?"
        back: "Multiply the trial by x (by x^2 for a double root)."
        type: basic
      - front: "Forcing g_1 + g_2: how do you find a particular solution?"
        back: "Superposition: find particular solutions for g_1 and g_2 separately and add them."
        type: basic

  - id: variation-of-parameters
    name: Variation of Parameters
    core: false                # terminal solution technique; nothing builds on it
    difficulty: 0.82
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: linear-independence-wronskian
        weight: 0.6
        key: true
      - id: homogeneous-constant-coefficients
        weight: 0.5
        key: true
      - id: integration-by-parts
        weight: 0.4
        key: false
      - id: undetermined-coefficients
        weight: 0.3
        key: false
      - id: trigonometric-integrals
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Setting up the formulas
        key_prerequisites: [linear-independence-wronskian]
        exemplars:
          - problem: 'For $y''''+y=\csc x$, the homogeneous equation has the solutions $y_1=\cos x$ and $y_2=\sin x$. Find $u_1''$ and $u_2''$ in the variation-of-parameters method.'
            answer: 'u1 = -1; u2 = cot(x)'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "u1"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "u2"}]}
            solution_sketch: 'The Wronskian is W = cos x cos x - sin x (-sin x) = 1. Then u1'' = -y2 g/W = -sin x csc x = -1. And u2'' = y1 g/W = cos x csc x = cot x. So u1'' = -1 and u2'' = cot x.'
          - problem: 'For $y''''-2y''+y=e^x\ln x$ with $x>0$, take $y_1=e^x$ and $y_2=xe^x$. Find $u_1''$.'
            answer: '-x ln(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The Wronskian is W = e^x(1 + x)e^x - e^x xe^x = e^(2x). Then u1'' = -y2 g/W = -(xe^x)(e^x ln x)/e^(2x) = -x ln x.'
          - problem: 'For $y''''-y=e^{2x}$, take $y_1=e^x$ and $y_2=e^{-x}$. Find $u_2''$.'
            answer: '-e^(3x)/2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The Wronskian is W = e^x(-e^(-x)) - e^x e^(-x) = -2. Then u2'' = y1 g/W = e^x e^(2x)/(-2) = -e^(3x)/2.'
          - problem: 'A mass of $1$ kg on a spring of constant $4$ N/m, with no damping, is pushed by a constant force of $8$ N, so $x''''+4x=8$. Take $x_1=\cos 2t$ and $x_2=\sin 2t$ and find $u_1''$ in the variation-of-parameters method.'
            answer: '-4sin(2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The Wronskian is W = cos(2t)(2cos 2t) - sin(2t)(-2 sin 2t) = 2. Then u1'' = -x2 g/W = -sin(2t)(8)/2 = -4 sin(2t).'
          - problem: 'What is the value of the Wronskian $W=y_1y_2''-y_1''y_2$ of $y_1=e^{x}$ and $y_2=e^{-x}$?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The formula is W = y1 y2'' - y1'' y2. Here y1 = e^x, y2 = e^(-x), y1'' = e^x and y2'' = -e^(-x). So W = e^x(-e^(-x)) - e^x e^(-x) = -1 - 1 = -2, which is not zero, so the functions are independent.'
          - problem: 'For $y''''-3y''+2y=e^{3x}$, take $y_1=e^x$ and $y_2=e^{2x}$. Find $u_1''$ and $u_2''$.'
            answer: 'u1 = -e^(2x); u2 = e^x'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "u1"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "u2"}]}
            solution_sketch: 'The Wronskian is W = e^x(2e^(2x)) - e^x e^(2x) = e^(3x). Then u1'' = -y2 g/W = -e^(2x) e^(3x)/e^(3x) = -e^(2x). And u2'' = y1 g/W = e^x e^(3x)/e^(3x) = e^x.'
          - problem: 'A mass of $1$ kg on a spring of constant $1$ N/m, with no damping, is pushed by the force $F(t)=t$ newtons, so $x''''+x=t$. Take $x_1=\cos t$ and $x_2=\sin t$ and find $u_2''$ in the variation-of-parameters method.'
            answer: 't cos(t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The Wronskian is W = cos t cos t - sin t (-sin t) = 1. Then u2'' = x1 g/W = cos t (t)/1 = t cos t.'
          - problem: 'For $y''''+4y=\tan(2x)$, take $y_1=\cos(2x)$ and $y_2=\sin(2x)$. Find $u_1''$.'
            answer: '-sin(2x)^2/(2cos(2x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The Wronskian is W = 2. Then u1'' = -y2 g/W = -sin(2x) tan(2x)/2. Since tan(2x) = sin(2x)/cos(2x), this equals -sin(2x)^2/(2cos(2x)).'
        constraints: 'equation already in standard form (leading coefficient 1); the u'' expressions simplify before integrating (also in spring contexts)'
      - id: kp2
        name: Trigonometric forcing
        key_prerequisites: [linear-independence-wronskian, trigonometric-integrals]
        exemplars:
          - problem: 'Use variation of parameters, taking every constant of integration to be zero, to find a particular solution of $y''''+y=\sec x$ on the interval $(-\pi/2,\pi/2)$.'
            answer: 'cos(x) ln(cos(x)) + x sin(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With y1 = cos x, y2 = sin x and W = 1, u1'' = -sin x sec x = -tan x and u2'' = cos x sec x = 1. Integrating gives u1 = ln(cos x) and u2 = x. So y_p = cos x ln(cos x) + x sin x.'
          - problem: 'Use variation of parameters, taking every constant of integration to be zero, to find a particular solution of $y''''+y=\csc x$ on the interval $(0,\pi)$.'
            answer: '-x cos(x) + sin(x) ln(sin(x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With y1 = cos x, y2 = sin x and W = 1, u1'' = -sin x csc x = -1 and u2'' = cos x csc x = cot x. Integrating gives u1 = -x and u2 = ln(sin x). So y_p = -x cos x + sin x ln(sin x).'
          - problem: 'Use variation of parameters, taking every constant of integration to be zero, to find a particular solution of $y''''+y=\tan x$ on the interval $(-\pi/2,\pi/2)$.'
            answer: '-cos(x) ln(sec(x) + tan(x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With W = 1, u1'' = -sin x tan x = cos x - sec x and u2'' = cos x tan x = sin x. Integrating gives u1 = sin x - ln(sec x + tan x) and u2 = -cos x. Then y_p = cos x u1 + sin x u2, and the sin x cos x terms cancel, leaving y_p = -cos x ln(sec x + tan x).'
          - problem: 'Solve $y''''+4y=\sec(2x)$ on $(-\pi/4,\pi/4)$ by variation of parameters. What is the particular solution when every constant of integration is taken to be zero?'
            answer: '(1/4)cos(2x) ln(cos(2x)) + (x/2)sin(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The Wronskian of cos(2x) and sin(2x) is W = 2, so u1'' = -sin(2x) sec(2x)/2 = -tan(2x)/2 and u2'' = cos(2x) sec(2x)/2 = 1/2. Integrating gives u1 = (1/4)ln(cos 2x) and u2 = x/2. So y_p = (1/4)cos(2x) ln(cos 2x) + (x/2)sin(2x).'
          - problem: 'Solve $y''''+y=\sec x$ on $(-\pi/2,\pi/2)$ with $y(0)=1$ and $y''(0)=2$. What is $y(\pi/4)$, to four decimal places?'
            answer: '2.4316'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'A particular solution is cos x ln(cos x) + x sin x, so y = c1 cos x + c2 sin x + cos x ln(cos x) + x sin x. Then y(0) = c1 = 1 and y''(0) = c2 = 2. So y = cos x + 2 sin x + cos x ln(cos x) + x sin x, and y(pi/4) = 2.4316.'
          - problem: 'Solve $y''''+4y=\sec(2x)$ on $(-\pi/4,\pi/4)$ with $y(0)=3$ and $y''(0)=0$. What is $y(\pi/8)$, to four decimal places?'
            answer: '2.1989'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'A particular solution is (1/4)cos(2x) ln(cos 2x) + (x/2)sin(2x). So y = c1 cos(2x) + c2 sin(2x) + that term. Then y(0) = c1 = 3 and y''(0) = 2c2 = 0, so c2 = 0. Evaluating at x = pi/8 gives y = 2.1989.'
          - problem: 'A mass of $1$ kg on a spring of constant $9$ N/m, with no damping, is pushed by the force $F(t)=\tan(3t)$ newtons for $-\pi/6<t<\pi/6$. At $t=0$ it is $1$ m from equilibrium and moving at $2$ m/s. What is its displacement at $t=\pi/12$, in metres to four decimal places?'
            answer: '1.1878'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The equation is x'''' + 9x = tan(3t) with x(0) = 1 and x''(0) = 2. Variation of parameters with cos(3t), sin(3t) and W = 3 gives x = c1 cos(3t) + c2 sin(3t) - (1/9)cos(3t) ln(sec 3t + tan 3t). Then x(0) = c1 = 1, and x''(0) = 3c2 - 1/3 = 2 gives c2 = 7/9. Evaluating at t = pi/12 gives 1.1878 m.'
          - problem: 'A mass of $1$ kg on a spring of constant $1$ N/m, with no damping, is pushed by the force $F(t)=\csc t$ newtons for $0<t<\pi$. At $t=\pi/2$ it is $2$ m from equilibrium and moving at $1$ m/s. What is its displacement at $t=\pi/6$, in metres to four decimal places?'
            answer: '0.6943'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The equation is x'''' + x = csc t with x(pi/2) = 2 and x''(pi/2) = 1. The particular solution is -t cos t + sin t ln(sin t), so x = c1 cos t + c2 sin t - t cos t + sin t ln(sin t). The conditions x(pi/2) = 2 and x''(pi/2) = 1 give c2 = 2 and c1 = pi/2 - 1. Evaluating at t = pi/6 gives 0.6943 m.'
        constraints: 'forcing sec x, csc x, tan x on intervals where they are continuous; integrals reduce to ln and power forms; initial-value items ask for a value to four decimal places'
      - id: kp3
        name: Rational and exponential forcing
        key_prerequisites: [linear-independence-wronskian, integration-by-parts]
        exemplars:
          - problem: 'Use variation of parameters to solve $y''''-y=e^{-x}$ with $y(0)=1$ and $y''(0)=-\tfrac32$.'
            answer: '(1 - x/2)e^(-x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With y1 = e^x, y2 = e^(-x) and W = -2: u1'' = e^(-2x)/2 and u2'' = -1/2, so u1 = -e^(-2x)/4 and u2 = -x/2. Then y = c1 e^x + c2 e^(-x) - xe^(-x)/2 after absorbing the e^(-x) term. The conditions give c1 = 0 and c2 = 1, so y = (1 - x/2)e^(-x).'
          - problem: 'Solve $y''''-2y''+y=\dfrac{e^x}{x}$ for $x>0$ with $y(1)=e$ and $y''(1)=3e$.'
            answer: 'x e^x (1 + ln(x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With y1 = e^x, y2 = xe^x and W = e^(2x): u1'' = -1 and u2'' = 1/x, so u1 = -x and u2 = ln x. Then y = c1 e^x + c2 xe^x + xe^x ln x after absorbing -xe^x. The conditions give c1 = 0 and c2 = 1, so y = xe^x(1 + ln x).'
          - problem: 'Solve $y''''-4y''+4y=\dfrac{e^{2x}}{x}$ for $x>0$ with $y(1)=e^2$ and $y''(1)=3e^2$.'
            answer: '(1 + x ln(x))e^(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With y1 = e^(2x), y2 = xe^(2x) and W = e^(4x): u1'' = -1 and u2'' = 1/x, so u1 = -x and u2 = ln x. Then y = c1 e^(2x) + c2 xe^(2x) + xe^(2x) ln x. The conditions give c1 = 1 and c2 = 0, so y = (1 + x ln x)e^(2x).'
          - problem: 'Solve $y''''+2y''+y=\dfrac{e^{-x}}{x}$ for $x>0$ with $y(1)=0$ and $y''(1)=e^{-1}$.'
            answer: 'x e^(-x) ln(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With y1 = e^(-x), y2 = xe^(-x) and W = e^(-2x): u1'' = -1 and u2'' = 1/x, so u1 = -x and u2 = ln x. Then y = c1 e^(-x) + c2 xe^(-x) + xe^(-x) ln x. The conditions give c1 = 0 and c2 = 0, so y = xe^(-x) ln x.'
          - problem: 'A mass of $1$ kg on a spring of constant $4$ N/m, with damping coefficient $5$ N·s/m, starts at rest at the equilibrium position, $x(0)=0$ and $x''(0)=0$. For $t>0$ the force $F(t)=3e^{-t}$ newtons acts on it. Using $mx''''+cx''+kx=F$, find $x(t)$.'
            answer: '(t - 1/3)e^(-t) + e^(-4t)/3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation is x'''' + 5x'' + 4x = 3e^(-t), with x1 = e^(-t), x2 = e^(-4t) and W = -3e^(-5t). Then u1'' = 1 and u2'' = -e^(3t), so u1 = t and u2 = -e^(3t)/3. Hence x = c1 e^(-t) + c2 e^(-4t) + te^(-t). The conditions give c1 = -1/3 and c2 = 1/3, so x = (t - 1/3)e^(-t) + e^(-4t)/3.'
          - problem: 'Use variation of parameters to solve $y''''-4y=e^{2x}$ with $y(0)=1$ and $y''(0)=\tfrac94$.'
            answer: '(1 + x/4)e^(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With y1 = e^(2x), y2 = e^(-2x) and W = -4: u1'' = 1/4 and u2'' = -e^(4x)/4, so u1 = x/4 and u2 = -e^(4x)/16. Then y = c1 e^(2x) + c2 e^(-2x) + xe^(2x)/4 after absorbing the e^(2x) term. The conditions give c1 = 1 and c2 = 0, so y = (1 + x/4)e^(2x).'
          - problem: 'A mass of $1$ kg on a spring of constant $1$ N/m, with damping coefficient $2$ N·s/m, is at rest at the equilibrium position at $t=1$ s. For $t>0$ the force $F(t)=e^{-t}/t$ newtons acts on it. Using $mx''''+cx''+kx=F$, find $x(t)$ for $t>0$.'
            answer: '(1 - t + t ln(t))e^(-t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation is x'''' + 2x'' + x = e^(-t)/t, with x1 = e^(-t), x2 = te^(-t) and W = e^(-2t). Then u1'' = -1 and u2'' = 1/t, so x = c1 e^(-t) + c2 te^(-t) + te^(-t) ln t. The conditions x(1) = 0 and x''(1) = 0 give c1 = 1 and c2 = -1, so x = (1 - t + t ln t)e^(-t).'
        constraints: 'forcing e^{kx}/x or duplicating exponentials; items are initial-value problems, so the answer is unique and homogeneous terms are fixed by the initial values'
    diagnostic_exemplar:
      problem: 'Use variation of parameters to solve $y'''' - 2y'' + y = \dfrac{e^x}{x^2}$ for $x > 0$.'
      answer: '$y = c_1 e^{x} + c_2 x e^{x} - e^{x}\ln x$'
      answer_contract: {kind: none}
      solution_sketch: 'With $y_1 = e^x$, $y_2 = xe^x$ and $W = e^{2x}$: $u_1'' = -\frac{y_2 g}{W} = -\frac{1}{x}$ and $u_2'' = \frac{y_1 g}{W} = \frac{1}{x^2}$, so $u_1 = -\ln x$ and $u_2 = -\frac{1}{x}$. Then $y_p = -e^x\ln x - e^x$, and the $-e^x$ is absorbed into $c_1 e^x$.'
    anki_seeds:
      - front: "Variation of parameters formulas for y'' + py' + qy = g?"
        back: '$u_1'' = -\dfrac{y_2 g}{W}$, $u_2'' = \dfrac{y_1 g}{W}$; then $y_p = u_1 y_1 + u_2 y_2$.'
        type: basic
      - front: "When do you reach for variation of parameters instead of undetermined coefficients?"
        back: "When the forcing is not polynomial/exponential/sinusoidal — e.g. sec x, tan x, e^x/x."
        type: basic

  - id: cauchy-euler-equations
    name: Cauchy-Euler Equations
    core: false                # special-case equation type; terminal
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: homogeneous-constant-coefficients
        weight: 0.7
        key: true
      - id: logarithm-properties
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The $x^r$ substitution"
        key_prerequisites: [homogeneous-constant-coefficients]
        try_first:
          problem: 'What is the value of $x^2y''''-6y$ when $y=x^3$?'
          answer_contract: {"kind": "exact"}
          answer: '0'
          reveal: 'Here $y''''=6x$, so $x^2y''''=6x^3$ and the result is $6x^3-6x^3=0$. Each derivative lowers the power of $x$ and the factors $x^2$ and $x$ raise it again, so a power $x^r$ can solve such an equation.'
        exemplars:
          - problem: 'Find all values of $r$ for which $y=x^r$ is a solution of $x^2y''''-4xy''+6y=0$ for $x>0$.'
            answer: '2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute y = x^r. Then x^2 y'''' = r(r-1)x^r, x y'' = r x^r, and the equation becomes r(r-1) - 4r + 6 = 0, that is r^2 - 5r + 6 = 0. This factors as (r - 2)(r - 3) = 0, so r = 2 or r = 3.'
          - problem: 'Find all values of $r$ for which $y=x^r$ is a solution of $x^2y''''+2xy''-6y=0$ for $x>0$.'
            answer: '2, -3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting y = x^r gives r(r-1) + 2r - 6 = 0, that is r^2 + r - 6 = 0. This factors as (r - 2)(r + 3) = 0, so r = 2 or r = -3.'
          - problem: 'Find all values of $r$ for which $y=x^r$ is a solution of $x^2y''''-2y=0$ for $x>0$.'
            answer: '2, -1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting y = x^r gives r(r-1) - 2 = 0, that is r^2 - r - 2 = 0. This factors as (r - 2)(r + 1) = 0, so r = 2 or r = -1.'
          - problem: 'The radial displacement $u(r)$ in a thick-walled cylinder satisfies $r^2u''''+ru''-u=0$ for $r>0$. Find all values of $s$ for which $u=r^s$ is a solution.'
            answer: '1, -1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting u = r^s gives s(s-1) + s - 1 = 0, that is s^2 - 1 = 0. So s = 1 or s = -1, and the solutions are u = r and u = 1/r.'
          - problem: 'Find all values of $r$ for which $y=x^r$ is a solution of $x^2y''''+2xy''-12y=0$ for $x>0$.'
            answer: '3, -4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting y = x^r gives r(r-1) + 2r - 12 = 0, that is r^2 + r - 12 = 0. This factors as (r - 3)(r + 4) = 0, so r = 3 or r = -4.'
          - problem: 'Substitute $y=x^r$ into $x^2y''''+xy''-9y=0$. What values of $r$ make $y=x^r$ a solution?'
            answer: '3, -3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The term x^2 y'''' gives r(r-1). So the equation is r(r-1) + r - 9 = 0, that is r^2 - 9 = 0. Hence r = 3 or r = -3.'
          - problem: 'In steady heat flow between two concentric spheres, the temperature $u(r)$ at radius $r$ satisfies $r^2u''''+2ru''=0$ for $r>0$. Find all values of $s$ for which $u=r^s$ is a solution.'
            answer: '0, -1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting u = r^s gives s(s-1) + 2s = 0, that is s^2 + s = 0. This factors as s(s + 1) = 0, so s = 0 or s = -1, and the solutions are u = 1 and u = 1/r.'
          - problem: 'Find all values of $r$ for which $y=x^r$ is a solution of $x^2y''''-5xy''+5y=0$ for $x>0$.'
            answer: '1, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting y = x^r gives r(r-1) - 5r + 5 = 0, that is r^2 - 6r + 5 = 0. This factors as (r - 1)(r - 5) = 0, so r = 1 or r = 5.'
          - problem: 'Find all values of $r$ for which $y=x^r$ is a solution of $x^2y''''+10xy''+20y=0$ for $x>0$.'
            answer: '-4, -5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting y = x^r gives r(r-1) + 10r + 20 = 0, that is r^2 + 9r + 20 = 0. This factors as (r + 4)(r + 5) = 0, so r = -4 or r = -5.'
        constraints: 'indicial equation r(r-1) + ar + b = 0 factors over the integers; solutions are power functions on x > 0 (also in cylinder and sphere contexts)'
      - id: kp2
        name: Repeated and complex roots
        key_prerequisites: [homogeneous-constant-coefficients, logarithm-properties]
        exemplars:
          - problem: 'Find the roots of the indicial equation of $x^2y''''-11xy''+36y=0$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The indicial equation is r(r-1) - 11r + 36 = 0, that is r^2 - 12r + 36 = 0. This is (r - 6)^2 = 0, so the only root is the double root r = 6.'
          - problem: 'One solution of $x^2y''''-7xy''+16y=0$ for $x>0$ is $y_1=x^4$. Find the solution that satisfies $y(1)=0$ and $y''(1)=1$.'
            answer: 'x^4 ln(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The indicial equation r^2 - 8r + 16 = (r - 4)^2 = 0 has the double root 4, so y = c1 x^4 + c2 x^4 ln x. The condition y(1) = c1 = 0. Then y''(1) = 4c1 + c2 = 1 gives c2 = 1, so y = x^4 ln x.'
          - problem: 'Are the roots of the indicial equation of $x^2y''''-3xy''+5y=0$ real and distinct, repeated, or complex?'
            answer: 'complex'
            answer_contract: {"kind": "label", "options": [["complex", "complex roots", "a complex pair", "complex pair", "complex conjugates", "complex conjugate", "complex conjugate roots", "two complex roots"], ["repeated", "repeated roots", "a repeated root", "repeated root", "one repeated root", "double root", "a double root", "equal roots"], ["real and distinct", "real, distinct", "distinct", "real", "two real roots", "real distinct roots", "distinct real roots", "two distinct real roots"]]}
            solution_sketch: 'The indicial equation is r(r-1) - 3r + 5 = 0, that is r^2 - 4r + 5 = 0. Its discriminant is 16 - 20 = -4, which is negative, so the roots are the complex pair 2 + i and 2 - i.'
          - problem: 'The indicial equation of $x^2y''''+3xy''+10y=0$ has complex roots. Find them.'
            answer: '-1+3i, -1-3i'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The indicial equation is r(r-1) + 3r + 10 = 0, that is r^2 + 2r + 10 = 0. By the quadratic formula r = (-2 ± sqrt(4 - 40))/2 = (-2 ± 6i)/2, so r = -1 + 3i or r = -1 - 3i.'
          - problem: 'Solve $x^2y''''-5xy''+13y=0$ for $x>0$ with $y(1)=1$ and $y''(1)=5$.'
            answer: 'x^3(cos(2 ln(x)) + sin(2 ln(x)))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The indicial equation r^2 - 6r + 13 = 0 has the roots 3 ± 2i, so y = x^3(c1 cos(2 ln x) + c2 sin(2 ln x)). Then y(1) = c1 = 1. Also y''(1) = 3c1 + 2c2 = 5, so c2 = 1, and y = x^3(cos(2 ln x) + sin(2 ln x)).'
          - problem: 'Solve $x^2y''''-xy''+5y=0$ for $x>0$ with $y(1)=2$ and $y''(1)=4$.'
            answer: 'x(2cos(2 ln(x)) + sin(2 ln(x)))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The indicial equation r^2 - 2r + 5 = 0 has the roots 1 ± 2i, so y = x(c1 cos(2 ln x) + c2 sin(2 ln x)). Then y(1) = c1 = 2. Also y''(1) = c1 + 2c2 = 4, so c2 = 1, and y = x(2cos(2 ln x) + sin(2 ln x)).'
          - problem: 'Are the roots of the indicial equation of $x^2y''''+7xy''+9y=0$ real and distinct, repeated, or complex?'
            answer: 'repeated'
            answer_contract: {"kind": "label", "options": [["complex", "complex roots", "a complex pair", "complex pair", "complex conjugates", "complex conjugate", "complex conjugate roots", "two complex roots"], ["repeated", "repeated roots", "a repeated root", "repeated root", "one repeated root", "double root", "a double root", "equal roots"], ["real and distinct", "real, distinct", "distinct", "real", "two real roots", "real distinct roots", "distinct real roots", "two distinct real roots"]]}
            solution_sketch: 'The indicial equation is r(r-1) + 7r + 9 = 0, that is r^2 + 6r + 9 = 0. Its discriminant is 36 - 36 = 0, so there is one repeated root, r = -3.'
          - problem: 'The amplitude $A(x)$ of a vibration in a tapered rod satisfies $x^2A''''+5xA''+8A=0$ for $x>0$, where $x$ is in metres. Find the solution with $A(1)=1$ and $A''(1)=0$.'
            answer: 'x^(-2)(cos(2 ln(x)) + sin(2 ln(x)))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The indicial equation r^2 + 4r + 8 = 0 has the roots -2 ± 2i, so A = x^(-2)(c1 cos(2 ln x) + c2 sin(2 ln x)). Then A(1) = c1 = 1. Also A''(1) = -2c1 + 2c2 = 0, so c2 = 1, and A = x^(-2)(cos(2 ln x) + sin(2 ln x)).'
          - problem: 'Along another tapered rod the amplitude satisfies $x^2A''''+5xA''+4A=0$ for $x>0$, and $x^{-2}$ is one solution. Find the solution with $A(1)=0$ and $A''(1)=1$.'
            answer: 'ln(x)/x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The indicial equation r^2 + 4r + 4 = (r + 2)^2 = 0 has the double root -2, so A = c1 x^(-2) + c2 x^(-2) ln x. Then A(1) = c1 = 0. Also A''(1) = -2c1 + c2 = 1, so c2 = 1, and A = ln(x)/x^2.'
        constraints: 'double roots gain ln x; complex roots alpha +/- beta i give x^alpha cos(beta ln x), x^alpha sin(beta ln x); initial values fix the constants'
      - id: kp3
        name: Cauchy-Euler IVPs
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: 'Solve $x^2y''''-2y=0$ for $x>0$ with $y(1)=3$ and $y''(1)=0$.'
            answer: 'x^2 + 2/x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The indicial equation r^2 - r - 2 = 0 has the roots 2 and -1, so y = c1 x^2 + c2/x. Then y(1) = c1 + c2 = 3 and y''(1) = 2c1 - c2 = 0. Adding gives 3c1 = 3, so c1 = 1 and c2 = 2, and y = x^2 + 2/x.'
          - problem: 'Solve $x^2y''''-4xy''+6y=0$ for $x>0$ with $y(1)=1$ and $y''(1)=2$.'
            answer: 'x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The indicial equation r^2 - 5r + 6 = 0 has the roots 2 and 3, so y = c1 x^2 + c2 x^3. Then c1 + c2 = 1 and 2c1 + 3c2 = 2. Subtracting twice the first equation gives c2 = 0, so c1 = 1 and y = x^2.'
          - problem: 'Solve $x^2y''''-5xy''+9y=0$ for $x>0$ with $y(1)=2$ and $y''(1)=7$.'
            answer: '2x^3 + x^3 ln(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The indicial equation r^2 - 6r + 9 = (r - 3)^2 = 0 has the double root 3, so y = x^3(c1 + c2 ln x). Then y(1) = c1 = 2. Also y''(1) = 3c1 + c2 = 7, so c2 = 1, and y = 2x^3 + x^3 ln x.'
          - problem: 'Let $y$ be the solution of $x^2y''''-4xy''+4y=0$ for $x>0$ with $y(1)=3$ and $y''(1)=6$. Find $y(e)$.'
            answer: '2e + e^4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The indicial equation r^2 - 5r + 4 = 0 has the roots 1 and 4, so y = c1 x + c2 x^4. Then c1 + c2 = 3 and c1 + 4c2 = 6, so c2 = 1 and c1 = 2. Hence y = 2x + x^4 and y(e) = 2e + e^4.'
          - problem: 'Steady heat flow between two concentric spheres of radii $1$ m and $4$ m gives $r^2u''''+2ru''=0$ for the temperature $u(r)$. The inner sphere is held at $60$ °C and the outer sphere at $30$ °C. What is the temperature at $r=2$ m?'
            answer: '40'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The solutions are u = c1 + c2/r. Then u(1) = c1 + c2 = 60 and u(4) = c1 + c2/4 = 30. Subtracting gives (3/4)c2 = 30, so c2 = 40 and c1 = 20. At r = 2, u = 20 + 40/2 = 40 °C.'
          - problem: 'Solve $x^2y''''-2xy''-4y=0$ for $x>0$ with $y(1)=3$ and $y''(1)=2$.'
            answer: 'x^4 + 2/x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The indicial equation r^2 - 3r - 4 = 0 has the roots 4 and -1, so y = c1 x^4 + c2/x. Then c1 + c2 = 3 and 4c1 - c2 = 2. Adding gives 5c1 = 5, so c1 = 1 and c2 = 2, and y = x^4 + 2/x.'
          - problem: 'In a simplified pricing model the value $V(S)$ of a contract at the asset price $S$ dollars satisfies $S^2V''''-3SV''+3V=0$ for $S>0$. At $S=1$ the contract is worth $5$ dollars and its value rises by $7$ dollars for each dollar of price. What is its value at $S=2$?'
            answer: '16'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The indicial equation r^2 - 4r + 3 = 0 has the roots 1 and 3, so V = c1 S + c2 S^3. Then c1 + c2 = 5 and c1 + 3c2 = 7, so c2 = 1 and c1 = 4. Hence V = 4S + S^3, and V(2) = 8 + 8 = 16 dollars.'
          - problem: 'Solve $x^2y''''-6y=0$ for $x>0$ with $y(1)=3$ and $y''(1)=4$.'
            answer: '2x^3 + x^(-2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The indicial equation r^2 - r - 6 = 0 has the roots 3 and -2, so y = c1 x^3 + c2 x^(-2). Then c1 + c2 = 3 and 3c1 - 2c2 = 4. Adding twice the first equation gives 5c1 = 10, so c1 = 2 and c2 = 1, and y = 2x^3 + x^(-2).'
        constraints: 'initial conditions at x = 1 (or two radii in the sphere context) so the 2x2 system has small integer solutions; state the domain x > 0'
    diagnostic_exemplar:
      problem: 'Solve $x^2 y'''' - 3xy'' + 4y = 0$ for $x > 0$ with $y(1) = 2$, $y''(1) = 5$.'
      answer: '$y = (2 + \ln x)x^2$'
      solution_sketch: 'The indicial equation $r(r-1) - 3r + 4 = (r-2)^2 = 0$ has the double root $2$, so $y = (c_1 + c_2\ln x)x^2$. Then $y(1) = c_1 = 2$ and $y''(1) = 2c_1 + c_2 = 5$ give $c_2 = 1$.'
    anki_seeds:
      - front: "Indicial equation of the Cauchy-Euler equation x^2 y'' + a x y' + b y = 0?"
        back: "$r(r-1) + ar + b = 0$ (substitute $y = x^r$)."
        type: basic
      - front: "Cauchy-Euler equation with a double indicial root r: general solution?"
        back: '$y = (c_1 + c_2 \ln x)x^r$'
        type: basic

  - id: free-undamped-oscillations
    name: Free Undamped Oscillations
    core: false                # physical-model branch; terminal
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - {id: sinusoid-phase-shift, weight: 0.3, key: false}       # amplitude-phase form R cos(t - phi) is the phase-shift skill
      - id: homogeneous-constant-coefficients
        weight: 0.7
        key: true
      - id: trig-identities-basic
        weight: 0.3
        key: false
      # kp3 rewrites c1 cos + c2 sin as R cos(t - phi), which needs the
      # angle-addition formula; previously supplied only accidentally via a
      # bogus taylor-maclaurin-series edge removed in W2.
      - id: sum-difference-identities
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'The equation of motion'
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: 'A $2$ kg mass hangs on a spring of stiffness $k = 32$ N/m. There is no damping. What is the natural frequency $\omega$ of the motion, in rad/s?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation of motion is $2x'''' + 32x = 0$, which is $x'''' + 16x = 0$ after division by $2$. So $\omega^2 = k/m = 32/2 = 16$, and $\omega = 4$ rad/s.'
          - problem: 'A free undamped oscillator satisfies $x'''' + 81x = 0$. What is its natural frequency $\omega$ in rad/s?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Comparing $x'''' + 81x = 0$ with $x'''' + \omega^2 x = 0$ gives $\omega^2 = 81$. So $\omega = 9$ rad/s.'
          - problem: 'A $1$ kg mass on a spring of stiffness $9$ N/m oscillates with no damping. How many complete oscillations does it make in $2\pi$ seconds?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First, $\omega = \sqrt{k/m} = \sqrt{9} = 3$ rad/s, so one oscillation takes $T = 2\pi/\omega = 2\pi/3$ s. The number of oscillations in $2\pi$ s is $2\pi \div (2\pi/3) = 3$.'
          - problem: 'A $4$ kg mass on a spring oscillates without damping at the natural frequency $6$ rad/s. What is the stiffness $k$ of the spring, in N/m?'
            answer: '144'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\omega^2 = k/m$, the stiffness is $k = m\omega^2$. Substituting gives $k = 4 \cdot 36 = 144$ N/m.'
          - problem: 'A mass on a spring completes one oscillation every $\pi/3$ seconds. What is its natural frequency $\omega$ in rad/s?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The period is $T = 2\pi/\omega$, so $\omega = 2\pi/T$. Substituting $T = \pi/3$ gives $\omega = 2\pi \div (\pi/3) = 6$ rad/s.'
          - problem: 'A $3$ kg mass on a spring moves without damping according to $x'''' + 49x = 0$. What is the stiffness $k$ of the spring, in N/m?'
            answer: '147'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation of motion $3x'''' + kx = 0$ becomes $x'''' + (k/3)x = 0$. Comparing with $x'''' + 49x = 0$ gives $k/3 = 49$, so $k = 3 \cdot 49 = 147$ N/m.'
          - problem: 'A spring of stiffness $50$ N/m carries a mass that oscillates without damping at the natural frequency $5$ rad/s. What is the mass, in kg?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'From $\omega^2 = k/m$ we get $m = k/\omega^2$. Substituting gives $m = 50/25 = 2$ kg.'
          - problem: 'A $1$ kg mass on a spring with $k = 16$ N/m oscillates without damping. How long does one complete oscillation take, in seconds?'
            answer: 'pi/2'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'Here $\omega = \sqrt{16/1} = 4$ rad/s. The period is $T = 2\pi/\omega = 2\pi/4 = \pi/2$ s.'
          - problem: 'A $0.5$ kg mass on a spring with $k = 18$ N/m oscillates without damping. How many complete oscillations does it make in $10\pi$ seconds?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First, $\omega = \sqrt{18/0.5} = \sqrt{36} = 6$ rad/s, so the period is $T = 2\pi/6 = \pi/3$ s. The number of oscillations is $10\pi \div (\pi/3) = 30$.'
        constraints: 'k/m a perfect square; report omega = sqrt(k/m), the period 2 pi / omega, and counts of oscillations'
      - id: kp2
        name: 'Oscillation IVPs'
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: 'A mass on a spring moves according to $x'''' + 16x = 0$ with $x(0) = 3$ and $x''(0) = 0$. Find $x(t)$.'
            answer: '3cos(4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The characteristic roots are $\pm 4i$, so $x = c_1\cos 4t + c_2\sin 4t$. Then $x(0) = c_1 = 3$ and $x''(0) = 4c_2 = 0$, so $x = 3\cos 4t$.'
          - problem: 'A $2$ kg mass on a spring of stiffness $18$ N/m is pulled $0.5$ m from equilibrium and released from rest. Find its displacement $x(t)$ in metres, with $t$ in seconds.'
            answer: 'cos(3t)/2'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation of motion is $2x'''' + 18x = 0$, which is $x'''' + 9x = 0$, so $\omega = 3$ and $x = c_1\cos 3t + c_2\sin 3t$. Then $x(0) = c_1 = 0.5$ and $x''(0) = 3c_2 = 0$, so $x = \tfrac12\cos 3t$.'
          - problem: 'Solve $x'''' + 4x = 0$ with $x(0) = 0$ and $x''(0) = 6$.'
            answer: '3sin(2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The general solution is $x = c_1\cos 2t + c_2\sin 2t$. The condition $x(0) = 0$ gives $c_1 = 0$, and $x''(0) = 2c_2 = 6$ gives $c_2 = 3$, so $x = 3\sin 2t$.'
          - problem: 'Solve $x'''' + 9x = 0$ with $x(0) = 2$ and $x''(0) = -3$.'
            answer: '2cos(3t) - sin(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The general solution is $x = c_1\cos 3t + c_2\sin 3t$, so $x(0) = c_1 = 2$. Then $x''(0) = 3c_2 = -3$ gives $c_2 = -1$.'
          - problem: 'A $1$ kg mass on a spring with $k = 25$ N/m rests at equilibrium until it is struck, which gives it the velocity $10$ m/s. Find its displacement $x(t)$ in metres.'
            answer: '2sin(5t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation of motion is $x'''' + 25x = 0$, so $x = c_1\cos 5t + c_2\sin 5t$. Then $x(0) = c_1 = 0$ and $x''(0) = 5c_2 = 10$, so $c_2 = 2$ and $x = 2\sin 5t$.'
          - problem: 'The displacement $y(t)$ of a mass on a spring satisfies $y'''' + 25y = 0$, $y(0) = -1$ and $y''(0) = 10$. Find $y(t)$.'
            answer: '-cos(5t) + 2sin(5t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The general solution is $y = c_1\cos 5t + c_2\sin 5t$, so $y(0) = c_1 = -1$. Then $y''(0) = 5c_2 = 10$ gives $c_2 = 2$.'
          - problem: 'The displacement $y(t)$ of an oscillator satisfies $y'''' + 36y = 0$ with $y(0) = 4$ and $y''(0) = 12$. Find $y(t)$.'
            answer: '4cos(6t) + 2sin(6t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The general solution is $y = c_1\cos 6t + c_2\sin 6t$, so $y(0) = c_1 = 4$. Then $y''(0) = 6c_2 = 12$ gives $c_2 = 2$.'
          - problem: 'Solve $x'''' + 25x = 0$ with $x(0) = 1$ and $x''(0) = 15$. What is $x(t)$?'
            answer: 'cos(5t) + 3sin(5t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The condition gives $x''(0) = 5c_2$ because the derivative of $\sin 5t$ is $5\cos 5t$. So $5c_2 = 15$ gives $c_2 = 3$, and $x = \cos 5t + 3\sin 5t$.'
          - problem: 'A $2$ kg mass on a spring with $k = 8$ N/m is released from $x(0) = 1$ m with the velocity $x''(0) = 4$ m/s. How far from equilibrium is the mass at $t = \pi/4$ seconds?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The equation of motion $2x'''' + 8x = 0$ gives $x'''' + 4x = 0$, so $x = c_1\cos 2t + c_2\sin 2t$ with $c_1 = 1$ and $2c_2 = 4$, so $c_2 = 2$. At $t = \pi/4$ we get $x = \cos(\pi/2) + 2\sin(\pi/2) = 2$ m.'
        constraints: 'initial data chosen so c_1, c_2 are simple numbers; x''(0) fixes c_2 through the factor omega; words or equations as given'
      - id: kp3
        name: 'Amplitude and phase'
        key_prerequisites: [trig-identities-basic, sum-difference-identities]
        try_first:
          problem: 'A mass has the displacement $x = 3\cos t + 4\sin t$. What is the largest value of $x$ that the mass reaches?'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'The two terms combine into one sinusoid $R\cos(t - \varphi)$ with $R = \sqrt{3^2 + 4^2} = 5$, so the largest value is $5$, not $3 + 4 = 7$.'
        exemplars:
          - problem: 'A mass on a spring oscillates according to $x = 3\cos 2t + 4\sin 2t$, where $x$ is in metres. What is the amplitude of the motion?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The amplitude is $R = \sqrt{a^2 + b^2}$ with $a = 3$ and $b = 4$. So $R = \sqrt{9 + 16} = \sqrt{25} = 5$ m.'
          - problem: 'What is the amplitude of $x = 6\cos t + 8\sin t$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $a = 6$ and $b = 8$. So $R = \sqrt{36 + 64} = \sqrt{100} = 10$.'
          - problem: 'Write $x = \cos t + \sqrt{3}\sin t$ in the form $R\cos(t - \varphi)$ with $R > 0$ and $0 \le \varphi < 2\pi$.'
            answer: '2cos(t - pi/3)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The coefficients are $a = 1$ and $b = \sqrt{3}$, so $R = \sqrt{1 + 3} = 2$. Since $\tan\varphi = b/a = \sqrt{3}$ with $a, b > 0$, the phase is $\varphi = \pi/3$, and $x = 2\cos(t - \pi/3)$.'
          - problem: 'A $1$ kg mass on a spring with $k = 4$ N/m is released from $x(0) = 5$ m with the velocity $x''(0) = 24$ m/s. What is the amplitude of its motion?'
            answer: '13'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The equation $x'''' + 4x = 0$ has the solution $x = c_1\cos 2t + c_2\sin 2t$ with $c_1 = 5$ and $2c_2 = 24$, so $c_2 = 12$. The amplitude is $\sqrt{5^2 + 12^2} = \sqrt{169} = 13$ m.'
          - problem: 'A mass oscillates as $x = 3\cos 4t + b\sin 4t$ with $b > 0$ and has the amplitude $5$ m. What is $b$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The amplitude gives $\sqrt{3^2 + b^2} = 5$, so $9 + b^2 = 25$ and $b^2 = 16$. Since $b > 0$, we get $b = 4$.'
          - problem: 'A mass oscillates as $x = \sqrt{3}\cos t + \sin t$. It can be written as $R\cos(t - \varphi)$ with $R > 0$ and $0 \le \varphi < 2\pi$. What is $\varphi$?'
            answer: 'pi/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $a = \sqrt{3}$ and $b = 1$, so $R = \sqrt{3 + 1} = 2$. Then $\tan\varphi = b/a = 1/\sqrt{3}$ with $a, b > 0$, so $\varphi = \pi/6$.'
          - problem: 'A mass on a spring oscillates as $x = \sqrt{3}\cos 2t + \sin 2t$. Write $x$ in the form $R\cos(2t - \varphi)$ with $R > 0$ and $0 \le \varphi < 2\pi$.'
            answer: '2cos(2t - pi/6)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'With $a = \sqrt{3}$ and $b = 1$ we get $R = \sqrt{3 + 1} = 2$ and $\tan\varphi = 1/\sqrt{3}$, so $\varphi = \pi/6$. The frequency stays $2$, so $x = 2\cos(2t - \pi/6)$.'
          - problem: 'A mass oscillates as $x = -3\cos 5t + 4\sin 5t$. What is the amplitude of the motion?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $a = -3$ and $b = 4$. So $R = \sqrt{9 + 16} = \sqrt{25} = 5$.'
          - problem: 'A mass on a spring oscillates as $x = 8\cos 3t + 15\sin 3t$, where $x$ is in metres. How far from equilibrium does the mass get at most?'
            answer: '17'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The greatest distance is the amplitude $R = \sqrt{8^2 + 15^2}$. So $R = \sqrt{64 + 225} = \sqrt{289} = 17$ m.'
        constraints: 'amplitudes from Pythagorean pairs (3,4,5), (5,12,13), (6,8,10), (8,15,17), (1,sqrt3,2); phase angles at standard unit-circle values'
    diagnostic_exemplar:
      problem: 'A mass satisfies $x'''' + 9x = 0$ with $x(0) = 3$ and $x''(0) = -12$. Solve the initial value problem and find the amplitude of the motion.'
      answer: '$x = 3\cos 3t - 4\sin 3t$; amplitude $5$.'
      answer_contract: {kind: none}
      solution_sketch: 'The natural frequency is $\omega = 3$, so $x = c_1\cos 3t + c_2\sin 3t$ with $c_1 = 3$ and $3c_2 = -12$, i.e. $c_2 = -4$. The amplitude is $\sqrt{3^2 + 4^2} = 5$.'
    anki_seeds:
      - front: "Natural frequency of the undamped oscillator mx'' + kx = 0?"
        back: '$\omega = \sqrt{k/m}$'
        type: basic
      - front: 'Amplitude of $x = a\cos\omega t + b\sin\omega t$?'
        back: '$R = \sqrt{a^2 + b^2}$'
        type: basic

  - id: spring-mass-oscillations
    name: Spring-Mass Systems and Oscillations
    core: false                # physical-model application; terminal
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: free-undamped-oscillations
        weight: 0.7
        key: true
      - id: undetermined-coefficients
        weight: 0.5
        key: true
      - id: trig-identities-basic
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Damped motion classification'
        key_prerequisites: [free-undamped-oscillations]
        exemplars:
          - problem: 'A mass on a spring with damping obeys $x'''' + 8x'' + 15x = 0$. Is the motion underdamped, critically damped or overdamped?'
            answer: 'overdamped'
            answer_contract: {"kind": "label", "options": [["underdamped", "under damped", "under-damped", "under"], ["critically damped", "critical", "critically-damped", "critical damping"], ["overdamped", "over damped", "over-damped", "over"]]}
            solution_sketch: 'The characteristic equation $r^2 + 8r + 15 = 0$ factors as $(r + 3)(r + 5) = 0$. It has two distinct real roots, so the motion is overdamped.'
          - problem: 'A mass on a spring with damping obeys $x'''' + 7x'' + 12x = 0$. What is the discriminant of its characteristic equation?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $r^2 + 7r + 12 = 0$. Its discriminant is $7^2 - 4 \cdot 12 = 49 - 48 = 1$, which is positive, so the motion is overdamped.'
          - problem: 'The motion of a damped mass obeys $x'''' + 10x'' + 25x = 0$. What is the repeated characteristic root?'
            answer: '-5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation $r^2 + 10r + 25 = 0$ factors as $(r + 5)^2 = 0$. So the double root is $r = -5$, and the motion is critically damped.'
          - problem: 'A $1$ kg mass on a spring of stiffness $13$ N/m is slowed by a damper with damping constant $c = 6$ N$\cdot$s/m. Is the motion underdamped, critically damped or overdamped?'
            answer: 'underdamped'
            answer_contract: {"kind": "label", "options": [["underdamped", "under damped", "under-damped", "under"], ["critically damped", "critical", "critically-damped", "critical damping"], ["overdamped", "over damped", "over-damped", "over"]]}
            solution_sketch: 'The equation of motion is $x'''' + 6x'' + 13x = 0$, so the discriminant is $36 - 52 = -16$. A negative discriminant gives complex roots $-3 \pm 2i$, so the motion is underdamped.'
          - problem: 'A $2$ kg mass on a spring of stiffness $8$ N/m has a damper with damping constant $c$. For which positive $c$, in N$\cdot$s/m, is the motion critically damped?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation of motion is $2x'''' + cx'' + 8x = 0$, with discriminant $c^2 - 4 \cdot 2 \cdot 8 = c^2 - 64$. The discriminant is zero when $c^2 = 64$, so $c = 8$.'
          - problem: 'A mass-spring system obeys $x'''' + 6x'' + 13x = 0$. Its solutions have the form $e^{-\alpha t}(c_1\cos\beta t + c_2\sin\beta t)$. What is $\beta$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation $r^2 + 6r + 13 = 0$ has discriminant $36 - 52 = -16$, so $r = -3 \pm 2i$. Comparing with $-\alpha \pm i\beta$ gives $\alpha = 3$ and $\beta = 2$.'
          - problem: 'A damped system obeys $3x'''' + 12x'' + 9x = 0$. What is the smaller characteristic root?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing by $3$ gives $x'''' + 4x'' + 3x = 0$ with characteristic equation $(r + 1)(r + 3) = 0$. The roots are $-1$ and $-3$, so the smaller root is $-3$.'
          - problem: 'A $3$ kg mass on a spring of stiffness $12$ N/m is slowed by a damper with damping constant $c = 15$ N$\cdot$s/m. What is the discriminant $c^2 - 4mk$?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The discriminant is $c^2 - 4mk = 15^2 - 4 \cdot 3 \cdot 12 = 225 - 144 = 81$. It is positive, so the motion is overdamped.'
        constraints: 'classification by the discriminant of r^2 + (c/m)r + k/m; integer roots or integer alpha, beta; labels at most two per KP'
      - id: kp2
        name: 'Damped IVPs'
        key_prerequisites: [free-undamped-oscillations]
        exemplars:
          - problem: 'A damped mass-spring system obeys $x'''' + 4x'' + 3x = 0$ with $x(0) = 2$ and $x''(0) = 0$. Find $x(t)$.'
            answer: '3e^(-t) - e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The characteristic equation $(r + 1)(r + 3) = 0$ gives $x = c_1 e^{-t} + c_2 e^{-3t}$. The conditions give $c_1 + c_2 = 2$ and $-c_1 - 3c_2 = 0$, so $c_1 = 3$ and $c_2 = -1$.'
          - problem: 'Solve $x'''' + 2x'' + 5x = 0$ with $x(0) = 1$ and $x''(0) = -1$.'
            answer: 'e^(-t)cos(2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The roots are $r = -1 \pm 2i$, so $x = e^{-t}(c_1\cos 2t + c_2\sin 2t)$. Then $c_1 = 1$ and $x''(0) = -c_1 + 2c_2 = -1$ gives $c_2 = 0$, so $x = e^{-t}\cos 2t$.'
          - problem: 'Solve $x'''' + 5x'' + 4x = 0$ with $x(0) = 1$ and $x''(0) = 2$.'
            answer: '2e^(-t) - e^(-4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The characteristic equation $(r + 1)(r + 4) = 0$ gives $x = c_1 e^{-t} + c_2 e^{-4t}$. The conditions give $c_1 + c_2 = 1$ and $-c_1 - 4c_2 = 2$, so $c_1 = 2$ and $c_2 = -1$.'
          - problem: 'A $2$ kg mass on a spring of stiffness $16$ N/m moves against a damper with damping constant $12$ N$\cdot$s/m. It is released from rest at $x(0) = 3$ m. Find its displacement $x(t)$.'
            answer: '6e^(-2t) - 3e^(-4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation of motion is $2x'''' + 12x'' + 16x = 0$, which is $x'''' + 6x'' + 8x = 0$ with roots $-2$ and $-4$. The conditions give $c_1 + c_2 = 3$ and $-2c_1 - 4c_2 = 0$, so $c_1 = 6$ and $c_2 = -3$.'
          - problem: 'A damped mass-spring system obeys $x'''' + 6x'' + 13x = 0$ with $x(0) = 1$ and $x''(0) = -1$. Find $x(t)$.'
            answer: 'e^(-3t)(cos(2t) + sin(2t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The roots are $r = -3 \pm 2i$, so $x = e^{-3t}(c_1\cos 2t + c_2\sin 2t)$ and $c_1 = 1$. Then $x''(0) = -3c_1 + 2c_2 = -1$ gives $c_2 = 1$.'
          - problem: 'A $1$ kg mass on a spring of stiffness $4$ N/m moves against a damper with damping constant $4$ N$\cdot$s/m. It is released from $x(0) = 1$ m with the velocity $x''(0) = 3$ m/s. Find its displacement $x(t)$.'
            answer: '(1 + 5t)e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation $x'''' + 4x'' + 4x = 0$ has the double root $-2$, so $x = (c_1 + c_2 t)e^{-2t}$ and $c_1 = 1$. Then $x''(0) = c_2 - 2c_1 = 3$ gives $c_2 = 5$.'
          - problem: 'Solve $x'''' + 6x'' + 8x = 0$ with $x(0) = 3$ and $x''(0) = -10$.'
            answer: 'e^(-2t) + 2e^(-4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The characteristic equation $(r + 2)(r + 4) = 0$ gives $x = c_1 e^{-2t} + c_2 e^{-4t}$. The conditions give $c_1 + c_2 = 3$ and $-2c_1 - 4c_2 = -10$, so $c_1 = 1$ and $c_2 = 2$.'
          - problem: 'Solve $x'''' + 6x'' + 9x = 0$ with $x(0) = 2$ and $x''(0) = 0$. What is $x(t)$?'
            answer: '(2 + 6t)e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The double root $-3$ gives $x = (c_1 + c_2 t)e^{-3t}$ with $c_1 = 2$. The condition $x''(0) = c_2 - 3c_1 = 0$ gives $c_2 = 6$ and $x = (2 + 6t)e^{-3t}$.'
          - problem: 'A mass on a spring is struck at equilibrium and moves according to $x'''' + 3x'' + 2x = 0$ with $x(0) = 0$ and $x''(0) = 1$, where $x$ is in metres. What is the greatest displacement from equilibrium?'
            answer: '1/4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The solution is $x = e^{-t} - e^{-2t}$, and $x''(t) = -e^{-t} + 2e^{-2t} = 0$ when $e^{-t} = 1/2$, that is at $t = \ln 2$. Then $x = 1/2 - 1/4 = 1/4$ m.'
        constraints: 'roots integer or integer alpha, beta; initial data chosen so constants are small integers; spring data may be given as m, c, k'
      - id: kp3
        name: 'Forced motion and resonance'
        key_prerequisites: [free-undamped-oscillations, undetermined-coefficients]
        try_first:
          problem: 'A mass on a spring has the natural frequency $5$ rad/s. It is pushed by the force $\cos(\omega t)$ with no damping. For which positive $\omega$ would you expect the oscillations to grow without bound?'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'Each push arrives in step with the motion when $\omega$ equals the natural frequency $5$. The growth is the factor $t$ in the particular solution $x_p = t(A\cos 5t + B\sin 5t)$.'
        exemplars:
          - problem: 'An undamped mass on a spring is driven by a force, and its displacement obeys $x'''' + 25x = 18\cos 3t$. Find a particular solution $x_p(t)$.'
            answer: '9cos(3t)/8'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The natural frequency is $5$ and the forcing frequency is $3$, so there is no resonance. Try $x_p = A\cos 3t$: then $(-9 + 25)A = 16A = 18$, so $A = 9/8$ and $x_p = \frac{9}{8}\cos 3t$.'
          - problem: 'An undamped mass-spring system obeys $x'''' + 36x = 12\cos 6t$. Does resonance occur?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "resonance occurs", "resonant", "it does"], ["no", "no resonance", "nonresonant", "it does not", "resonance does not occur", "does not occur", "no, resonance does not occur", "not resonant"]]}
            solution_sketch: 'The natural frequency is $\sqrt{36} = 6$. The forcing frequency is also $6$, so the forcing is in step with the motion and resonance occurs.'
          - problem: 'Find a particular solution of $x'''' + 36x = 12\cos 6t$.'
            answer: 't sin(6t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The forcing frequency $6$ equals the natural frequency, so try $x_p = t(A\cos 6t + B\sin 6t)$. Substituting gives $12B\cos 6t - 12A\sin 6t = 12\cos 6t$, so $A = 0$ and $B = 1$, and $x_p = t\sin 6t$.'
          - problem: 'A $2$ kg mass on a spring of stiffness $50$ N/m is driven by the force $20\cos 3t$ newtons, with no damping. Find a particular solution $x_p(t)$ of its displacement.'
            answer: '5cos(3t)/8'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation of motion is $2x'''' + 50x = 20\cos 3t$, which is $x'''' + 25x = 10\cos 3t$. Try $x_p = A\cos 3t$: then $16A = 10$, so $A = 5/8$ and $x_p = \frac{5}{8}\cos 3t$.'
          - problem: 'An undamped oscillator obeys $x'''' + 4x = 8\cos 3t + 6\sin 3t$. Find a particular solution.'
            answer: '-(8cos(3t) + 6sin(3t))/5'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The natural frequency is $2$ and the forcing frequency is $3$, so there is no resonance. For $x_p = A\cos 3t + B\sin 3t$ we get $x_p'''' + 4x_p = -5A\cos 3t - 5B\sin 3t$, so $-5A = 8$ and $-5B = 6$.'
          - problem: 'A $4$ kg mass on a spring of stiffness $64$ N/m is pushed by a force $F\cos 5t$ and there is no damping. Does resonance occur?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "resonance occurs", "resonant", "it does"], ["no", "no resonance", "nonresonant", "it does not", "resonance does not occur", "does not occur", "no, resonance does not occur", "not resonant"]]}
            solution_sketch: 'The natural frequency is $\sqrt{k/m} = \sqrt{64/4} = 4$ rad/s. The forcing frequency is $5$ rad/s, which is different, so resonance does not occur.'
          - problem: 'An undamped oscillator obeys $x'''' + 16x = 8\sin 3t$. Find a particular solution.'
            answer: '8sin(3t)/7'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The natural frequency is $4$ and the forcing frequency is $3$, so there is no resonance. Try $x_p = B\sin 3t$: then $(-9 + 16)B = 7B = 8$, so $B = 8/7$ and $x_p = \frac{8}{7}\sin 3t$.'
          - problem: 'A $0.5$ kg mass hangs on a spring of stiffness $18$ N/m, with no damping, and is driven by a periodic force. At which driving frequency, in rad/s, does resonance occur?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Resonance occurs when the driving frequency equals the natural frequency $\sqrt{k/m}$. Here $\sqrt{18/0.5} = \sqrt{36} = 6$ rad/s.'
          - problem: 'A $3$ kg mass on a spring of stiffness $27$ N/m is driven by the force $6\cos 3t$ newtons, with no damping. Find a particular solution $x_p(t)$ of its displacement.'
            answer: 't sin(3t)/3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation of motion is $3x'''' + 27x = 6\cos 3t$, which is $x'''' + 9x = 2\cos 3t$. The forcing frequency $3$ equals the natural frequency, so try $x_p = t(A\cos 3t + B\sin 3t)$. Then $6B = 2$ and $A = 0$, so $x_p = \frac{1}{3}t\sin 3t$.'
        constraints: 'undamped forced oscillators only; resonance iff forcing frequency equals sqrt(k/m); labels at most two per KP'
    diagnostic_exemplar:
      problem: 'Does $x'''' + 16x = 8\cos 4t$ exhibit resonance? Find a particular solution.'
      answer: 'Yes: the forcing frequency $4$ equals the undamped natural frequency. $x_p = t\sin 4t$, whose amplitude grows without bound.'
      answer_contract: {kind: none}
      solution_sketch: 'Since $\cos 4t$ solves the homogeneous equation, the trial form is $x_p = t(A\cos 4t + B\sin 4t)$; substituting gives $-8A\sin 4t + 8B\cos 4t = 8\cos 4t$, so $A = 0$ and $B = 1$.'
    anki_seeds:
      - front: "Damped oscillator mx'' + cx' + kx = 0: the motion is underdamped when..."
        back: "the discriminant c^2 - 4mk is negative (complex roots: oscillation in a decaying envelope)."
        type: basic
      - front: "Pure resonance in x'' + omega^2 x = F cos(gamma t) occurs when..."
        back: "gamma = omega: the particular solution gains a factor of t and grows without bound."
        type: basic

  - id: rlc-circuit-equations
    name: RLC Circuits
    core: false                # physical-model application; terminal
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: spring-mass-oscillations
        weight: 0.6
        key: true
      - id: undetermined-coefficients
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'The circuit equation and the mechanical analogy'
        key_prerequisites: [spring-mass-oscillations]
        exemplars:
          - problem: 'A series circuit has inductance $L = 3$ H, resistance $R = 6\ \Omega$ and capacitance $C = \frac{1}{12}$ F, and it has no source. Its charge satisfies $LQ'''' + RQ'' + Q/C = 0$. After division by $L$, what is the coefficient of $Q''$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing $LQ'''' + RQ'' + Q/C = 0$ by $L$ gives $Q'''' + (R/L)Q'' + Q/(LC) = 0$. So the coefficient of $Q''$ is $R/L = 6/3 = 2$.'
          - problem: 'A series circuit has $L = 4$ H, $R = 8\ \Omega$ and $C = \frac{1}{32}$ F, and it has no source. After the equation $LQ'''' + RQ'' + Q/C = 0$ is divided by $L$, what is the coefficient of $Q$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing by $L$ gives the coefficient $\frac{1}{LC}$ for $Q$. So $\frac{1}{LC} = \frac{1}{4 \cdot \frac{1}{32}} = \frac{1}{1/8} = 8$.'
          - problem: 'A series RLC circuit is compared with a mass-spring system in which $L$ corresponds to the mass, $R$ to the damping constant and $1/C$ to the stiffness. Which stiffness corresponds to a capacitor with $C = \frac{1}{25}$ F?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The stiffness corresponds to $1/C$. So the stiffness is $1 \div \frac{1}{25} = 25$.'
          - problem: 'A series circuit has $L = 2$ H, $R = 8\ \Omega$ and $C = \frac{1}{8}$ F, and it has no source. What is the discriminant of the characteristic equation $Lr^2 + Rr + \frac{1}{C} = 0$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation is $2r^2 + 8r + 8 = 0$. Its discriminant is $8^2 - 4 \cdot 2 \cdot 8 = 64 - 64 = 0$.'
          - problem: 'A series circuit with $L = 1$ H and no source has the charge equation $Q'''' + 3Q'' + 2Q = 0$. What is the capacitance $C$ in farads?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $L = 1$, the coefficient of $Q$ is $\frac{1}{LC} = \frac{1}{C}$. So $\frac{1}{C} = 2$ and $C = \frac{1}{2}$ F.'
          - problem: 'A mass-spring system has mass $m = 2$, damping constant $c = 6$ and stiffness $k = 18$. A series circuit has the same equation with $L = m$, $R = c$ and $1/C = k$. What is the capacitance $C$ in farads?'
            answer: '1/18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The stiffness corresponds to $1/C$, so $\frac{1}{C} = 18$. Then $C = \frac{1}{18}$ F.'
          - problem: 'A series circuit has $L = 1$ H and $C = \frac{1}{9}$ F. For which resistance $R$, in ohms, is the free response critically damped?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The characteristic equation $r^2 + Rr + 9 = 0$ has the discriminant $R^2 - 36$. This is zero when $R^2 = 36$, so $R = 6\ \Omega$.'
          - problem: 'A series circuit has $L = 2$ H and $C = \frac{1}{50}$ F, and no resistance. What is the natural frequency $\omega = \sqrt{1/(LC)}$ of its free oscillation, in rad/s?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $R = 0$ the charge satisfies $Q'''' + \frac{1}{LC}Q = 0$. Here $\frac{1}{LC} = \frac{1}{2 \cdot \frac{1}{50}} = 25$, so $\omega = \sqrt{25} = 5$ rad/s.'
        constraints: 'L, R, 1/C chosen so the standard-form coefficients are small numbers; the analogy L = mass, R = damping, 1/C = stiffness is always stated or derivable from the equation'
      - id: kp2
        name: 'Free circuit response'
        key_prerequisites: [spring-mass-oscillations]
        exemplars:
          - problem: 'A series circuit has $L = 1$ H, $R = 5\ \Omega$ and $C = \frac{1}{4}$ F, and it has no source. Is the free response underdamped, critically damped or overdamped?'
            answer: 'overdamped'
            answer_contract: {"kind": "label", "options": [["underdamped", "under damped", "under-damped", "under"], ["critically damped", "critical", "critically-damped", "critical damping"], ["overdamped", "over damped", "over-damped", "over"]]}
            solution_sketch: 'The characteristic equation is $r^2 + 5r + 4 = 0$, with discriminant $25 - 16 = 9 > 0$. It has two distinct real roots, so the response is overdamped.'
          - problem: 'The charge in a circuit with no source obeys $Q'''' + 2Q'' + 5Q = 0$ with $Q(0) = 3$ and $Q''(0) = -3$. Find $Q(t)$.'
            answer: '3e^(-t)cos(2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The roots are $r = -1 \pm 2i$, so $Q = e^{-t}(c_1\cos 2t + c_2\sin 2t)$ and $c_1 = 3$. Then $Q''(0) = -c_1 + 2c_2 = -3$ gives $c_2 = 0$.'
          - problem: 'The charge in a circuit with no source obeys $Q'''' + 4Q'' + 13Q = 0$ with $Q(0) = 2$ and $Q''(0) = -4$. Find $Q(t)$.'
            answer: '2e^(-2t)cos(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The roots are $r = -2 \pm 3i$, so $Q = e^{-2t}(c_1\cos 3t + c_2\sin 3t)$ and $c_1 = 2$. Then $Q''(0) = -2c_1 + 3c_2 = -4$ gives $c_2 = 0$.'
          - problem: 'The charge in a circuit with no source obeys $Q'''' + 5Q'' + 4Q = 0$ with $Q(0) = 3$ and $Q''(0) = 0$. Find $Q(t)$.'
            answer: '4e^(-t) - e^(-4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The roots are $-1$ and $-4$, so $Q = c_1 e^{-t} + c_2 e^{-4t}$. The conditions give $c_1 + c_2 = 3$ and $-c_1 - 4c_2 = 0$, so $c_1 = 4$ and $c_2 = -1$.'
          - problem: 'A series circuit has $L = 1$ H, $R = 6\ \Omega$ and $C = \frac{1}{9}$ F, and it has no source. The capacitor starts with the charge $Q(0) = 2$ C and the current is $I(0) = Q''(0) = -1$ A. Find $Q(t)$.'
            answer: '(2 + 5t)e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation is $Q'''' + 6Q'' + 9Q = 0$ with the double root $-3$, so $Q = (c_1 + c_2 t)e^{-3t}$ and $c_1 = 2$. Then $Q''(0) = c_2 - 3c_1 = -1$ gives $c_2 = 5$.'
          - problem: 'The charge in a circuit is $Q(t) = 2e^{-t}\cos 3t$. The current is $I = Q''$. Find $I(t)$.'
            answer: '-2e^(-t)cos(3t) - 6e^(-t)sin(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'By the product rule, the derivative of $2e^{-t}$ is $-2e^{-t}$ and the derivative of $\cos 3t$ is $-3\sin 3t$. So $I = -2e^{-t}\cos 3t - 6e^{-t}\sin 3t$.'
          - problem: 'A series circuit has $L = 1$ H, $R = 4\ \Omega$ and $C = \frac{1}{8}$ F, and it has no source. Is the free response underdamped, critically damped or overdamped?'
            answer: 'underdamped'
            answer_contract: {"kind": "label", "options": [["underdamped", "under damped", "under-damped", "under"], ["critically damped", "critical", "critically-damped", "critical damping"], ["overdamped", "over damped", "over-damped", "over"]]}
            solution_sketch: 'The characteristic equation is $r^2 + 4r + 8 = 0$, with discriminant $16 - 32 = -16 < 0$. The roots are complex, so the response is underdamped.'
        constraints: 'same classification machinery as damped springs; the current is I = Q''; labels at most two per KP'
      - id: kp3
        name: 'Driven circuits and steady state'
        key_prerequisites: [spring-mass-oscillations, undetermined-coefficients]
        exemplars:
          - problem: 'A series circuit has $L = 1$ H, $R = 2\ \Omega$, $C = \frac{1}{5}$ F and a constant $10$ V source. What is the steady-state charge, in coulombs?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The charge satisfies $Q'''' + 2Q'' + 5Q = 10$. The homogeneous part decays, so the steady state is the constant solution with $5Q = 10$, that is $Q = 2$.'
          - problem: 'The charge in a driven circuit obeys $Q'''' + 2Q'' + Q = 10\sin t$. Find the steady-state charge $Q_p(t)$.'
            answer: '-5cos(t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Try $Q_p = a\cos t + b\sin t$. Substituting gives $2b\cos t - 2a\sin t = 10\sin t$, so $b = 0$ and $a = -5$, and $Q_p = -5\cos t$.'
          - problem: 'The charge in a driven circuit obeys $Q'''' + 3Q'' + 2Q = 8\cos 2t$. Find the steady-state charge $Q_p(t)$.'
            answer: '-2cos(2t)/5 + 6sin(2t)/5'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Try $Q_p = a\cos 2t + b\sin 2t$. Matching coefficients gives $-2a + 6b = 8$ and $-6a - 2b = 0$, so $b = -3a$ and $-20a = 8$. Then $a = -\frac{2}{5}$ and $b = \frac{6}{5}$.'
          - problem: 'A series circuit has $L = 2$ H, $R = 6\ \Omega$, $C = \frac{1}{4}$ F and a constant $12$ V source. Which charge does the capacitor approach as $t$ grows large, in coulombs?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The charge satisfies $2Q'''' + 6Q'' + 4Q = 12$. The transient decays, so the steady state has $4Q = 12$, that is $Q = 3$ C.'
          - problem: 'The charge in a driven circuit obeys $Q'''' + 3Q'' + 2Q = 8\cos 2t$. What is the amplitude of the steady-state charge?'
            answer: '2sqrt(10)/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The steady-state charge is $-\frac{2}{5}\cos 2t + \frac{6}{5}\sin 2t$. Its amplitude is $\sqrt{\frac{4}{25} + \frac{36}{25}} = \sqrt{\frac{40}{25}} = \frac{2\sqrt{10}}{5}$.'
          - problem: 'A series circuit has $L = 2$ H, $R = 6\ \Omega$, $C = \frac{1}{4}$ F and the source $E(t) = 10\cos t$ volts. Find the steady-state charge $Q_p(t)$.'
            answer: 'cos(t)/2 + 3sin(t)/2'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The charge satisfies $2Q'''' + 6Q'' + 4Q = 10\cos t$, which is $Q'''' + 3Q'' + 2Q = 5\cos t$. Try $Q_p = a\cos t + b\sin t$: then $a + 3b = 5$ and $b - 3a = 0$, so $a = \frac{1}{2}$ and $b = \frac{3}{2}$.'
          - problem: 'A capacitor in a series circuit with a resistor, an inductor and a constant $24$ V source reaches the steady charge $6$ C. What is its capacitance $C$ in farads?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In the steady state $Q'''' = Q'' = 0$, so $Q/C = E$ and $Q = EC$. Then $C = Q/E = 6/24 = \frac{1}{4}$ F.'
        constraints: 'steady state = the particular solution that persists after transients decay; constant or sinusoidal sources with small integer frequency'
    diagnostic_exemplar:
      problem: 'A series circuit has $L = 1$ H, $R = 2\ \Omega$, $C = \tfrac{1}{5}$ F and a constant source $E = 10$ V. Write the differential equation for the charge $Q(t)$ and find the steady-state charge.'
      answer: '$Q'''' + 2Q'' + 5Q = 10$; steady-state charge $Q = 2$.'
      answer_contract: {kind: none}
      solution_sketch: '$LQ'''' + RQ'' + Q/C = E$ gives $Q'''' + 2Q'' + 5Q = 10$. The homogeneous part decays (roots $-1 \pm 2i$), so the steady state is the constant particular solution $5Q = 10$, i.e. $Q = 2$.'
    anki_seeds:
      - front: "Series RLC circuit ODE for the charge Q?"
        back: "$LQ'' + RQ' + Q/C = E(t)$, with current $I = Q'$."
        type: basic
      - front: "Mechanical analogy for a series RLC circuit?"
        back: "L ↔ mass, R ↔ damping, 1/C ↔ spring stiffness, E ↔ external force."
        type: basic

  - id: boundary-value-problems-intro
    name: Boundary Value Problems
    core: false                # terminal problem genre
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: homogeneous-constant-coefficients
        weight: 0.7
        key: true
      - id: unit-circle
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Solving two-point BVPs'
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: 'Solve $y'''' + y = 0$ with $y(0) = 2$ and $y(\pi/2) = 3$.'
            answer: '2cos(x) + 3sin(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The general solution is $y = c_1\cos x + c_2\sin x$. The condition $y(0) = 2$ gives $c_1 = 2$, and $y(\pi/2) = c_2 = 3$, so $y = 2\cos x + 3\sin x$.'
          - problem: 'Solve $y'''' = 0$ with $y(0) = 1$ and $y(1) = 3$.'
            answer: '2x + 1'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The general solution is $y = ax + b$. The condition $y(0) = 1$ gives $b = 1$, and $y(1) = a + 1 = 3$ gives $a = 2$, so $y = 2x + 1$.'
          - problem: 'A thin rod occupies $0 \le x \le 2$ metres. Its steady temperature $u(x)$ in degrees Celsius satisfies $u'''' = 0$, with $u(0) = 20$ and $u(2) = 60$. Find $u(x)$.'
            answer: '20x + 20'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The general solution is $u = ax + b$. The condition $u(0) = 20$ gives $b = 20$, and $u(2) = 2a + 20 = 60$ gives $a = 20$, so $u = 20x + 20$.'
          - problem: 'Solve $y'''' + y = 0$ with $y(0) = 0$ and $y(\pi/2) = 5$.'
            answer: '5sin(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The general solution is $y = c_1\cos x + c_2\sin x$. The condition $y(0) = 0$ gives $c_1 = 0$, and $y(\pi/2) = c_2 = 5$, so $y = 5\sin x$.'
          - problem: 'Solve $y'''' + 4y = 0$ with $y(0) = 2$ and $y(\pi/4) = 1$.'
            answer: '2cos(2x) + sin(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The general solution is $y = c_1\cos 2x + c_2\sin 2x$ and $y(0) = 2$ gives $c_1 = 2$. At $x = \pi/4$ we have $\cos(\pi/2) = 0$ and $\sin(\pi/2) = 1$, so $c_2 = 1$.'
          - problem: 'Solve $y'''' + 9y = 0$ with $y(0) = 0$ and $y(\pi/6) = 4$.'
            answer: '4sin(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The general solution is $y = c_1\cos 3x + c_2\sin 3x$ and $y(0) = 0$ gives $c_1 = 0$. At $x = \pi/6$ we have $\sin(\pi/2) = 1$, so $c_2 = 4$ and $y = 4\sin 3x$.'
          - problem: 'The steady temperature $u(x)$ in a rod with $0 \le x \le 3$ satisfies $u'''' = 0$. The end $x = 0$ is held at $10\,^\circ$C and the end $x = 3$ at $40\,^\circ$C. What is the temperature at the midpoint $x = 1.5$, in degrees Celsius?'
            answer: '25'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The general solution is $u = ax + b$. The ends give $b = 10$ and $3a + 10 = 40$, so $a = 10$ and $u = 10x + 10$. At $x = 1.5$ the temperature is $25\,^\circ$C.'
          - problem: 'Solve $y'''' = 0$ with $y(0) = 1$ and $y(\pi) = 3\pi + 1$.'
            answer: '3x + 1'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The general solution is $y = ax + b$. The condition $y(0) = 1$ gives $b = 1$, and $y(\pi) = a\pi + 1 = 3\pi + 1$ gives $a = 3$, so $y = 3x + 1$.'
          - problem: 'Solve $y'''' - y = 0$ with $y(0) = 0$ and $y(\ln 2) = \frac{3}{2}$.'
            answer: 'e^x - e^(-x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The general solution is $y = c_1 e^x + c_2 e^{-x}$, and $y(0) = 0$ gives $c_2 = -c_1$. Then $y(\ln 2) = c_1(2 - \frac{1}{2}) = \frac{3}{2}c_1 = \frac{3}{2}$, so $c_1 = 1$ and $y = e^x - e^{-x}$.'
        constraints: 'conditions at two different points; endpoints at 0 and rational multiples of pi where sin/cos take clean values; steady-temperature rods as in-context items'
      - id: kp2
        name: 'Existence outcomes: unique, none, or infinitely many'
        key_prerequisites: [homogeneous-constant-coefficients, unit-circle]
        try_first:
          problem: 'Does the boundary value problem $y'''' + y = 0$ with $y(0) = 0$ and $y(2\pi) = 1$ have a solution?'
          answer_contract: {"kind": "label", "options": [["yes", "it has a solution", "there is a solution", "it does", "a solution exists"], ["no", "it has no solution", "there is no solution", "it does not", "no solution", "none"]]}
          answer: 'no'
          reveal: 'The condition $y(0) = 0$ leaves $y = c_2\sin x$, and $\sin 2\pi = 0$, so $y(2\pi) = 0$ for every $c_2$. The value $1$ can never be reached, so there is no solution.'
        exemplars:
          - problem: 'How many solutions does the boundary value problem $y'''' + y = 0$ with $y(0) = 0$ and $y(\pi) = 0$ have?'
            answer: 'infinitely many'
            answer_contract: {"kind": "label", "options": [["exactly one", "one solution", "a unique solution", "unique", "one", "1"], ["no solution", "no solutions", "none", "there is no solution", "zero", "0", "it has no solution"], ["infinitely many", "infinite", "infinitely many solutions", "an infinite number", "an infinite number of solutions", "infinite number of solutions"]]}
            solution_sketch: 'The general solution is $y = c_1\cos x + c_2\sin x$, and $y(0) = 0$ gives $c_1 = 0$. The condition $y(\pi) = c_2\sin\pi = 0$ holds for every $c_2$, so there are infinitely many solutions.'
          - problem: 'How many solutions does the boundary value problem $y'''' + y = 0$ with $y(0) = 0$ and $y(\pi) = 1$ have?'
            answer: 'no solution'
            answer_contract: {"kind": "label", "options": [["exactly one", "one solution", "a unique solution", "unique", "one", "1"], ["no solution", "no solutions", "none", "there is no solution", "zero", "0", "it has no solution"], ["infinitely many", "infinite", "infinitely many solutions", "an infinite number", "an infinite number of solutions", "infinite number of solutions"]]}
            solution_sketch: 'The condition $y(0) = 0$ gives $c_1 = 0$, so $y = c_2\sin x$. The condition $y(\pi) = 1$ requires $c_2\sin\pi = 1$, which says $0 = 1$, so there is no solution.'
          - problem: 'The displacement $y(x)$ of a vibrating string section obeys $y'''' + y = 0$ with $y(0) = 0$ and $y(\pi/2) = 5$. Find $y(x)$.'
            answer: '5sin(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The general solution is $y = c_1\cos x + c_2\sin x$. The condition $y(0) = 0$ forces $c_1 = 0$, and $y(\pi/2) = c_2 = 5$, so $y = 5\sin x$.'
          - problem: 'Find the solution of $y'''' + y = 0$ with $y(0) = 0$ and $y(\pi/6) = 2$.'
            answer: '4sin(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The condition $y(0) = 0$ gives $c_1 = 0$, so $y = c_2\sin x$. Then $y(\pi/6) = c_2/2 = 2$ gives $c_2 = 4$, so $y = 4\sin x$.'
          - problem: 'The boundary value problem $y'''' + y = 0$ with $y(0) = 0$ and $y(\pi/2) = -3$ has a solution. What is $y(\pi/6)$?'
            answer: '-3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $y(0) = 0$ gives $c_1 = 0$, and $y(\pi/2) = c_2 = -3$, so $y = -3\sin x$. Then $y(\pi/6) = -3 \cdot \frac{1}{2} = -\frac{3}{2}$.'
          - problem: 'The deflection $y(x)$ of a bar obeys $y'''' + y = 0$ with $y(0) = 0$ and $y(3\pi/2) = 2$. What is $y(\pi/6)$?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $y(0) = 0$ gives $c_1 = 0$. Then $y(3\pi/2) = c_2\sin(3\pi/2) = -c_2 = 2$ gives $c_2 = -2$, so $y(\pi/6) = -2 \cdot \frac{1}{2} = -1$.'
          - problem: 'For which value of $b$ does the boundary value problem $y'''' + y = 0$ with $y(0) = 0$ and $y(\pi) = b$ have a solution?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $y(0) = 0$ gives $y = c_2\sin x$. Then $y(\pi) = c_2\sin\pi = 0$ for every $c_2$, so a solution exists only when $b = 0$.'
        constraints: 'the boundary data hits or misses zeros of sin; all three outcomes must be represented across problems; at most two label items per KP'
      - id: kp3
        name: 'Eigenvalue problems'
        key_prerequisites: [homogeneous-constant-coefficients, unit-circle]
        exemplars:
          - problem: 'What is the smallest positive eigenvalue of $y'''' + \lambda y = 0$ with $y(0) = y(1) = 0$?'
            answer: 'pi^2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The solution with $y(0) = 0$ is $y = A\sin(\sqrt{\lambda}\,x)$. The condition $y(1) = 0$ needs $\sqrt{\lambda} = n\pi$, so $\lambda = n^2\pi^2$ and the smallest is $\pi^2$.'
          - problem: 'On the interval $0 < x < \pi$, the function $y$ satisfies $y'''' + \lambda y = 0$ with $y(0) = 0$ and $y(\pi) = 0$. Find the $n$th positive eigenvalue as a function of $n$.'
            answer: 'n^2'
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: 'The solution with $y(0) = 0$ is $y = A\sin(\sqrt{\lambda}\,x)$. The condition $y(\pi) = 0$ gives $\sqrt{\lambda}\,\pi = n\pi$, so $\lambda = n^2$.'
          - problem: 'A rod of length $2$ is pinned at both ends, so $y(0) = 0$ and $y(2) = 0$. Its modes solve $y'''' + \lambda y = 0$. Find the $n$th positive eigenvalue as a function of $n$.'
            answer: 'n^2 pi^2/4'
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: 'The solution with $y(0) = 0$ is $y = A\sin(\sqrt{\lambda}\,x)$. The condition $y(2) = 0$ gives $2\sqrt{\lambda} = n\pi$, so $\lambda = n^2\pi^2/4$.'
          - problem: 'A vibrating string of length $1$ is fixed at both ends, so $y(0) = 0$ and $y(1) = 0$. Its modes satisfy $y'''' + \lambda y = 0$. Find the third positive eigenvalue.'
            answer: '9pi^2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The end conditions give $\sqrt{\lambda} = n\pi$, so $\lambda = n^2\pi^2$ for $n = 1, 2, 3, \ldots$. For $n = 3$ we get $\lambda = 9\pi^2$.'
          - problem: 'The eigenvalue problem $y'''' + \lambda y = 0$ on $0 < x < \pi$ has $y(0) = 0$ and $y(\pi) = 0$. What is the fourth positive eigenvalue?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The end conditions give $\sqrt{\lambda}\,\pi = n\pi$, so $\lambda = n^2$. For $n = 4$ we get $\lambda = 16$.'
          - problem: 'A system obeys $y'''' + \lambda y = 0$ with $y(0) = 0$ and $y(2) = 0$. What is the smallest positive eigenvalue?'
            answer: 'pi^2/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The end conditions give $2\sqrt{\lambda} = n\pi$, so $\lambda = n^2\pi^2/4$. The smallest value uses $n = 1$, which gives $\lambda = \pi^2/4$.'
          - problem: 'A string with fixed ends at $x = 0$ and $x = L$ has modes that solve $y'''' + \lambda y = 0$. Its smallest positive eigenvalue is $\pi^2/9$. What is the length $L$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The eigenvalues are $\lambda_n = (n\pi/L)^2$, so the smallest is $\pi^2/L^2$. Setting $\pi^2/L^2 = \pi^2/9$ gives $L^2 = 9$, so $L = 3$.'
          - problem: 'The problem $y'''' + 9y = 0$ with $y(0) = 0$ and $y(\pi) = 0$ has nonzero solutions. Find the one with $y''(0) = 3$.'
            answer: 'sin(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The solution with $y(0) = 0$ is $y = A\sin 3x$. Then $y''(0) = 3A = 3$ gives $A = 1$, so $y = \sin 3x$.'
          - problem: 'Is $\lambda = 2$ an eigenvalue of $y'''' + \lambda y = 0$ with $y(0) = 0$ and $y(\pi) = 0$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is an eigenvalue", "is an eigenvalue", "yes it is"], ["no", "it is not an eigenvalue", "not an eigenvalue", "no it is not", "it is not"]]}
            solution_sketch: 'The eigenvalues of this problem are $\lambda = n^2$, that is $1, 4, 9, \ldots$. The number $2$ is not on this list, so it is not an eigenvalue.'
        constraints: 'Dirichlet conditions only; eigenvalues (n pi / L)^2 with L in {1, pi, 2, 3}; one label item at most'
    diagnostic_exemplar:
      problem: 'Find all values $\lambda > 0$ for which $y'''' + \lambda y = 0$ with $y(0) = y(2) = 0$ has nonzero solutions, and give those solutions.'
      answer: '$\lambda_n = \dfrac{n^2\pi^2}{4}$ for $n = 1, 2, 3, \ldots$, with $y = \sin\dfrac{n\pi x}{2}$ (up to a constant multiple).'
      answer_contract: {kind: none}
      solution_sketch: 'For $\lambda > 0$ the general solution is $y = c_1\cos\sqrt{\lambda}\,x + c_2\sin\sqrt{\lambda}\,x$. Then $y(0) = 0$ forces $c_1 = 0$, and $y(2) = c_2\sin 2\sqrt{\lambda} = 0$ has a nonzero solution only when $2\sqrt{\lambda} = n\pi$.'
    anki_seeds:
      - front: "A boundary value problem differs from an IVP in that..."
        back: "conditions are imposed at two different points — and a solution may be unique, nonexistent, or non-unique."
        type: basic
      - front: "Eigenvalues of y'' + lambda y = 0 with y(0) = y(L) = 0?"
        back: '$\lambda_n = (n\pi/L)^2$, eigenfunctions $\sin(n\pi x/L)$.'
        type: basic
