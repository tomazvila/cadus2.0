unit: second-order
course: differential-equations
module: "Second-Order Linear Equations"
topics:
  - id: characteristic-equation-real-roots
    name: "The Characteristic Equation: Real Roots"
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: quadratic-formula
        weight: 0.5
        key: true
      - id: derivatives-exp-log
        weight: 0.4
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Deriving the characteristic equation
        key_prerequisites: [derivatives-exp-log]
        exemplars:
          - problem: "In the equation y'' - y' - 6y = 0, substitute y = e^(rx). Give the nonzero factor that multiplies e^(rx) after cancellation, as a polynomial in r."
            answer: "r^2-r-6"
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: "Start with y = e^(rx), so y' = r e^(rx) and y'' = r^2 e^(rx) by the exponential derivative rule. Substitute these into y'' - y' - 6y = 0 to get (r^2 - r - 6)e^(rx) = 0. Since e^(rx) is never zero, cancel it and the characteristic polynomial is r^2-r-6."
          - problem: "Consider y'' + 5y' + 6y = 0. Give its characteristic polynomial in r."
            answer: "r^2+5r+6"
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: "Write y = e^(rx), then y' = r e^(rx) and y'' = r^2 e^(rx) by the exponential derivative rule. Substitute into y'' + 5y' + 6y = 0 to obtain (r^2 + 5r + 6)e^(rx) = 0. Factor out the nonzero exponential and the characteristic polynomial is r^2+5r+6."
          - problem: "Consider y'' - 9y = 0. Give its characteristic polynomial in r."
            answer: "r^2-9"
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: "Set y = e^(rx), so y' = r e^(rx) and y'' = r^2 e^(rx) by the exponential derivative rule. There is no y' term, so substituting into y'' - 9y = 0 gives (r^2 - 9)e^(rx) = 0. Cancel e^(rx) and the characteristic polynomial is r^2-9."
          - problem: "Consider 2y'' - 5y' + 3y = 0. Give its characteristic polynomial in r."
            answer: "2r^2-5r+3"
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: "Take y = e^(rx), with y' = r e^(rx) and y'' = r^2 e^(rx) by the exponential derivative rule. Substitute into 2y'' - 5y' + 3y = 0 to get (2r^2 - 5r + 3)e^(rx) = 0. Divide by e^(rx), which is nonzero, so the characteristic polynomial is 2r^2-5r+3."
          - problem: "Consider y'' - 16y = 0. Give its characteristic polynomial in r."
            answer: "r^2-16"
            answer_contract: {"kind": "function", "vars": ["r"]}
            solution_sketch: "Use y = e^(rx), so y' = r e^(rx) and y'' = r^2 e^(rx) by the exponential derivative rule. The y' coefficient is zero, and substitution into y'' - 16y = 0 gives (r^2 - 16)e^(rx) = 0. Since e^(rx) is nonzero, the characteristic polynomial is r^2-16."
          - problem: "Consider y'' + 7y' + 12y = 0. Give the coefficients (a, b, c) of its characteristic polynomial as (a, b, c)."
            answer: "(1, 7, 12)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Read coefficients straight from y'' + 7y' + 12y = 0: a = 1, b = 7, c = 12. The characteristic polynomial is ar^2 + br + c, so the coefficient vector is (1, 7, 12)."
        constraints: "read coefficients straight into ar^2 + br + c = 0; quadratics factor over the integers"
      - id: kp2
        name: Distinct real roots
        key_prerequisites: [quadratic-formula]
        exemplars:
          - problem: "For the equation y'' - y' - 6y = 0, the general solution has the form y = c1 e^(r1 x) + c2 e^(r2 x). Find r1 and r2, taking r1 as the larger root."
            answer: "r1 = 3; r2 = -2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "r1"}, {"contract": {"kind": "exact"}, "name": "r2"}]}
            solution_sketch: "Substitute y = e^(rx) into y'' - y' - 6y = 0 and divide by e^(rx) to form the characteristic equation r^2 - r - 6 = 0. Factor the quadratic over the integers: (r - 3)(r + 2) = 0, so the distinct real roots are 3 and -2. With r1 the larger root and r2 the smaller, the general solution is y = c1 e^(3x) + c2 e^(-2x). The answer is r1 = 3; r2 = -2."
          - problem: "Find the two exponents r1 and r2 in the general solution y = c1 e^(r1 x) + c2 e^(r2 x) of y'' - 25y = 0, taking r1 as the larger root."
            answer: "r1 = 5; r2 = -5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "r1"}, {"contract": {"kind": "exact"}, "name": "r2"}]}
            solution_sketch: "Substituting y = e^(rx) in y'' - 25y = 0 gives the characteristic equation r^2 - 25 = 0 by the characteristic-equation substitution. Factoring as a difference of squares: (r - 5)(r + 5) = 0, so the distinct real roots are 5 and -5. Taking r1 as the larger root, the general solution is y = c1 e^(5x) + c2 e^(-5x). The answer is r1 = 5; r2 = -5."
          - problem: "Consider y'' + 5y' + 6y = 0, whose general solution is y = c1 e^(r1 x) + c2 e^(r2 x). Determine r1 and r2, taking r1 as the larger root."
            answer: "r1 = -2; r2 = -3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "r1"}, {"contract": {"kind": "exact"}, "name": "r2"}]}
            solution_sketch: "Substituting y = e^(rx) into y'' + 5y' + 6y = 0 gives the characteristic equation r^2 + 5r + 6 = 0. Factoring over the integers: (r + 2)(r + 3) = 0, so the roots are -2 and -3. With r1 the larger root and r2 the smaller, the general solution is y = c1 e^(-2x) + c2 e^(-3x). The answer is r1 = -2; r2 = -3."
          - problem: "The general solution of an equation y'' + a y' + b y = 0 is y = c1 e^(4x) + c2 e^(-x). Find a and b."
            answer: "a = -3; b = -4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "The exponents 4 and -1 are the roots of the characteristic equation r^2 + a r + b = 0. By the root-sum and root-product relations, the sum 4 + (-1) = 3 equals -a, so a = -3, and the product 4(-1) = -4 equals b, so b = -4. Checking the factoring, r^2 - 3r - 4 = (r - 4)(r + 1), whose roots are 4 and -1. The answer is a = -3; b = -4."
          - problem: "The function y = e^(5x) is a solution of y'' + p y' - 10y = 0. Find the other root r2 of the characteristic equation and the value of p."
            answer: "r2 = -2; p = -3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "r2"}, {"contract": {"kind": "exact"}, "name": "p"}]}
            solution_sketch: "Because y = e^(5x) solves the equation, r = 5 is a root of the characteristic equation r^2 + p r - 10 = 0 by the characteristic-equation substitution. Substituting r = 5 gives 25 + 5p - 10 = 0, so p = -3. The equation r^2 - 3r - 10 = 0 factors as (r - 5)(r + 2) = 0, so the other root is r2 = -2. The answer is r2 = -2; p = -3."
          - problem: "A second-order homogeneous linear equation with constant coefficients has general solution y = c1 e^(2x) + c2 e^(-5x). Which equation has this general solution?"
            answer: "y'' + 3y' - 10y = 0"
            answer_contract: {"kind": "label", "options": [["y'' + 3y' - 10y = 0"], ["y'' - 3y' - 10y = 0"], ["y'' + 3y' + 10y = 0"], ["y'' - 10y' - 3y = 0"]]}
            solution_sketch: "The exponents 2 and -5 are the roots of the characteristic equation, so the sum 2 + (-5) = -3 equals -a and the product -10 equals b by the root relations. This gives a = 3 and b = -10, hence y'' + 3y' - 10y = 0. The option y'' - 3y' - 10y = 0 comes from flipping the sign of a, which swaps the exponents to 5 and -2; the option y'' + 3y' + 10y = 0 comes from flipping the sign of b, which gives no real roots; the option y'' - 10y' - 3y = 0 comes from interchanging the sum and the product of the roots. The answer is y'' + 3y' - 10y = 0."
        constraints: "characteristic quadratic factors over the integers; write both exponentials with c_1, c_2"
      - id: kp3
        name: IVPs with distinct real roots
        key_prerequisites: [quadratic-formula]
        exemplars:
          - problem: "Solve $y'' - y' - 2y = 0$ with $y(0) = 3$, $y'(0) = 0$."
            answer: "$y = e^{2x} + 2e^{-x}$"
            solution_sketch: "Roots $2, -1$: $c_1 + c_2 = 3$ and $2c_1 - c_2 = 0$ give $c_1 = 1$, $c_2 = 2$."
          - problem: "Solve $y'' - 4y = 0$ with $y(0) = 1$, $y'(0) = 2$."
            answer: "$y = e^{2x}$"
            solution_sketch: "$c_1 + c_2 = 1$ and $2c_1 - 2c_2 = 2$ give $c_1 = 1$, $c_2 = 0$."
          - problem: "Solve the initial value problem y'' - 5y' + 6y = 0 with y(0) = 2 and y'(0) = 1. Find the particular solution."
            answer: "5e^(2x)-3e^(3x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Characteristic equation: r^2 - 5r + 6 = 0, which factors as (r - 2)(r - 3) = 0, so r = 2 and r = 3. General solution: y = c1 e^(2x) + c2 e^(3x). Initial conditions give c1 + c2 = 2 and 2c1 + 3c2 = 1. Solving gives c1 = 5 and c2 = -3. The particular solution is 5e^(2x)-3e^(3x)."
          - problem: "Solve the initial value problem y'' + 3y' + 2y = 0 with y(0) = 1 and y'(0) = 4. Find the particular solution."
            answer: "6e^(-x)-5e^(-2x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Characteristic equation: r^2 + 3r + 2 = 0, which factors as (r + 1)(r + 2) = 0, so r = -1 and r = -2. General solution: y = c1 e^(-x) + c2 e^(-2x). Initial conditions give c1 + c2 = 1 and -c1 - 2c2 = 4. Solving gives c1 = 6 and c2 = -5. The particular solution is 6e^(-x)-5e^(-2x)."
          - problem: "Solve the initial value problem y'' + 4y' + 3y = 0 with y(0) = 5 and y'(0) = -7. Find the particular solution."
            answer: "4e^(-x)+e^(-3x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Characteristic equation: r^2 + 4r + 3 = 0, which factors as (r + 1)(r + 3) = 0, so r = -1 and r = -3. General solution: y = c1 e^(-x) + c2 e^(-3x). Initial conditions give c1 + c2 = 5 and -c1 - 3c2 = -7. Solving gives c1 = 4 and c2 = 1. The particular solution is 4e^(-x)+e^(-3x)."
          - problem: "Solve the initial value problem y'' + y' - 6y = 0 with y(0) = -1 and y'(0) = 8. Find the particular solution."
            answer: "e^(2x)-2e^(-3x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Characteristic equation: r^2 + r - 6 = 0, which factors as (r - 2)(r + 3) = 0, so r = 2 and r = -3. General solution: y = c1 e^(2x) + c2 e^(-3x). Initial conditions give c1 + c2 = -1 and 2c1 - 3c2 = 8. Solving gives c1 = 1 and c2 = -2. The particular solution is e^(2x)-2e^(-3x)."
        constraints: "two initial conditions produce a 2x2 linear system with small integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $y'''' + y'' - 2y = 0$ with $y(0) = 4$, $y''(0) = -2$.'
      answer: '$y = 2e^{x} + 2e^{-2x}$'
      solution_sketch: 'The characteristic equation $r^2 + r - 2 = 0$ has roots $1$ and $-2$, so $y = c_1 e^x + c_2 e^{-2x}$. The conditions give $c_1 + c_2 = 4$ and $c_1 - 2c_2 = -2$, hence $c_1 = c_2 = 2$.'
    anki_seeds:
      - front: "Characteristic equation of ay'' + by' + cy = 0?"
        back: "$ar^2 + br + c = 0$ (substitute $y = e^{rx}$)."
        type: basic
      - front: "General solution when the characteristic equation has distinct real roots r1, r2?"
        back: "$y = c_1 e^{r_1 x} + c_2 e^{r_2 x}$"
        type: basic

  - id: homogeneous-constant-coefficients
    name: Homogeneous Constant-Coefficient Equations
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: characteristic-equation-real-roots
        weight: 0.7
        key: true
      - id: derivatives-trig
        weight: 0.4
        key: false
      - id: complex-numbers
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Repeated roots
        key_prerequisites: [characteristic-equation-real-roots]
        exemplars:
          - problem: "One solution of y'' - 6y' + 9y = 0 is e^(3x). Find a second solution that is linearly independent of it."
            answer: "x*e^(3x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The characteristic polynomial r^2 - 6r + 9 factors as (r - 3)^2, so the characteristic-equation step gives the double root r = 3. The repeated-root rule builds the two independent solutions e^(3x) and x e^(3x), where the second one carries the extra power of x. The required second solution is x*e^(3x)."
          - problem: "Find the general solution of y'' + 4y' + 4y = 0, using a and b for the two arbitrary constants."
            answer: "a*e^(-2x)+b*x*e^(-2x)"
            answer_contract: {"kind": "function", "vars": ["x", "a", "b"]}
            solution_sketch: "Factor the characteristic polynomial: r^2 + 4r + 4 = (r + 2)^2, so the characteristic-equation step gives the double root r = -2. The repeated-root rule gives the two independent solutions e^(-2x) and x e^(-2x), so the family is a e^(-2x) + b x e^(-2x). The general solution is a*e^(-2x)+b*x*e^(-2x)."
          - problem: "Solve $y'' - 2y' + y = 0$ with $y(0) = 1$, $y'(0) = 0$."
            answer: "$y = (1 - x)e^x$"
            solution_sketch: "$(r-1)^2 = 0$ gives $y = (c_1 + c_2 x)e^x$; $y(0) = c_1 = 1$ and $y'(0) = c_1 + c_2 = 0$ give $c_2 = -1$."
          - problem: "The functions e^(2x) and x e^(2x) both solve the equation y'' + b y' + c y = 0 for constants b and c. Find the values of b and c."
            answer: "b = -4; c = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "The pair e^(2x) and x e^(2x) is the repeated-root form for the double root r = 2, so by the repeated-root rule the characteristic polynomial is (r - 2)^2. Expanding, (r - 2)^2 = r^2 - 4r + 4. The characteristic equation of y'' + b y' + c y = 0 is r^2 + b r + c = 0, so matching coefficients gives b = -4 and c = 4. The answer is b = -4; c = 4."
          - problem: "A mass on a spring obeys y'' - 4y' + 4y = 0 with y(0) = 0 and y'(0) = 1. Find the displacement at x = 1, and give the answer to 3 decimals."
            answer: "7.389"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "The characteristic polynomial r^2 - 4r + 4 factors as (r - 2)^2, so the characteristic-equation step gives the double root r = 2. The repeated-root rule gives y = (c1 + c2 x)e^(2x); y(0) = 0 forces c1 = 0, and y'(0) = c2 = 1. So y = x e^(2x) and y(1) = e^2, which to three decimals is 7.389."
          - problem: "Solve y'' - 10y' + 25y = 0 with y(0) = 1 and y'(0) = 0. Give the solution as a function of x."
            answer: "(1-5x)*e^(5x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The characteristic polynomial r^2 - 10r + 25 is the perfect square (r - 5)^2, so the characteristic-equation step gives the double root r = 5. The repeated-root rule gives y = (c1 + c2 x)e^(5x); y(0) = 1 gives c1 = 1, and y'(0) = c2 + 5 = 0 gives c2 = -5. The solution is (1-5x)*e^(5x)."
        constraints: "perfect-square characteristic polynomials; the x-factor on the second solution is the point"
      - id: kp2
        name: Complex roots
        key_prerequisites: [characteristic-equation-real-roots, derivatives-trig, complex-numbers]
        exemplars:
          - problem: 'Solve $y'''' + 9y = 0$ with $y(0) = 2$, $y''(0) = 3$.'
            answer: '$y = 2\cos 3x + \sin 3x$'
            solution_sketch: '$y = c_1 \cos 3x + c_2 \sin 3x$; $y(0) = c_1 = 2$ and $y''(0) = 3c_2 = 3$ give $c_2 = 1$.'
          - problem: "Solve y'' + 4y = 0 with y(0) = 1 and y'(0) = 4."
            answer: "cos(2x)+2sin(2x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For y'' + 4y = 0, the characteristic equation r^2 + 4 = 0 gives r = 2i and r = -2i, so alpha = 0 and beta = 2. The general solution is y = c1 cos(2x) + c2 sin(2x). The initial conditions give c1 = 1 and 2c2 = 4, so c2 = 2. The solution is y = cos(2x)+2sin(2x)."
          - problem: "Solve y'' + 2y' + 5y = 0 with y(0) = 1 and y'(0) = 3."
            answer: "e^(-x)(cos(2x)+2sin(2x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For y'' + 2y' + 5y = 0, the characteristic equation r^2 + 2r + 5 = 0 gives r = -1 + 2i and r = -1 - 2i, so alpha = -1 and beta = 2. The general solution is y = e^(-x)(c1 cos(2x) + c2 sin(2x)). The initial conditions give c1 = 1 and -c1 + 2c2 = 3, so c2 = 2. The solution is y = e^(-x)(cos(2x)+2sin(2x))."
          - problem: "Solve y'' - 2y' + 10y = 0 with y(0) = 1 and y'(0) = 4."
            answer: "e^(x)(cos(3x)+sin(3x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For y'' - 2y' + 10y = 0, the characteristic equation r^2 - 2r + 10 = 0 gives r = 1 + 3i and r = 1 - 3i, so alpha = 1 and beta = 3. The general solution is y = e^(x)(c1 cos(3x) + c2 sin(3x)). The initial conditions give c1 = 1 and c1 + 3c2 = 4, so c2 = 1. The solution is y = e^(x)(cos(3x)+sin(3x))."
          - problem: "Solve y'' + 6y' + 34y = 0 with y(0) = 1 and y'(0) = 2."
            answer: "e^(-3x)(cos(5x)+sin(5x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For y'' + 6y' + 34y = 0, the characteristic equation r^2 + 6r + 34 = 0 gives r = -3 + 5i and r = -3 - 5i, so alpha = -3 and beta = 5. The general solution is y = e^(-3x)(c1 cos(5x) + c2 sin(5x)). The initial conditions give c1 = 1 and -3c1 + 5c2 = 2, so c2 = 1. The solution is y = e^(-3x)(cos(5x)+sin(5x))."
          - problem: "Solve y'' - 4y' + 20y = 0 with y(0) = 2 and y'(0) = 4."
            answer: "2e^(2x)cos(4x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For y'' - 4y' + 20y = 0, the characteristic equation r^2 - 4r + 20 = 0 gives r = 2 + 4i and r = 2 - 4i, so alpha = 2 and beta = 4. The general solution is y = e^(2x)(c1 cos(4x) + c2 sin(4x)). The initial conditions give c1 = 2 and 2c1 + 4c2 = 4, so c2 = 0. The solution is y = 2e^(2x)cos(4x)."
        constraints: "roots alpha +/- beta i with integer alpha, beta; answers as e^{alpha x}(c_1 cos beta x + c_2 sin beta x)"
      - id: kp3
        name: Choosing the case
        key_prerequisites: [characteristic-equation-real-roots, complex-numbers]
        exemplars:
          - problem: "$y'' + 6y' + 9y = 0$ is a constant-coefficient equation. Use a and b for the constants. State the root case as one word and give the general solution."
            answer: "case = repeated; y = (a + b x) e^(-3x)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["distinct"], ["repeated"], ["complex"]]}, "name": "case"}, {"contract": {"kind": "function", "vars": ["a", "b", "x"]}, "name": "y"}]}
            solution_sketch: "The characteristic equation of $y'' + 6y' + 9y = 0$ is $r^2 + 6r + 9 = 0$ with discriminant $36 - 36 = 0$ (discriminant step). A zero discriminant gives one repeated root $r = -3$, so the case is repeated (case step). The repeated-root form is $(a + bx)e^{rx}$, so the general solution is $y = (a + b x)e^{-3x}$ (general solution step). Choosing distinct would need a nonzero discriminant and choosing complex would need a negative one, so both of those options misread the zero discriminant. Final answer: case = repeated; y = (a + b x) e^(-3x)."
          - problem: "$y'' + 4y' + 13y = 0$ is a constant-coefficient equation. Use a and b for the constants. Determine the root case as one word and give the general solution as a formula in x."
            answer: "case = complex; y = e^(-2x)(a cos(3x) + b sin(3x))"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["distinct"], ["repeated"], ["complex"]]}, "name": "case"}, {"contract": {"kind": "function", "vars": ["a", "b", "x"]}, "name": "y"}]}
            solution_sketch: "The characteristic equation of $y'' + 4y' + 13y = 0$ is $r^2 + 4r + 13 = 0$ with discriminant $16 - 52 = -36 < 0$ (discriminant step). A negative discriminant gives the conjugate pair $-2 \\pm 3i$, so the case is complex (case step). The complex form is $e^{\\alpha x}(a\\cos(\\beta x) + b\\sin(\\beta x))$ with $\\alpha = -2$ and $\\beta = 3$ (general solution step). Calling the case distinct ignores the sign of the discriminant, and calling it repeated assumes a zero discriminant. Final answer: case = complex; y = e^(-2x)(a cos(3x) + b sin(3x))."
          - problem: "Solve $y'' + 4y' + 5y = 0$ with $y(0) = 1$, $y'(0) = -2$."
            answer: "$y = e^{-2x}\\cos x$"
            solution_sketch: "$r = -2 \\pm i$; $y = e^{-2x}(c_1\\cos x + c_2 \\sin x)$ with $c_1 = 1$ and $y'(0) = -2c_1 + c_2 = -2$ giving $c_2 = 0$."
          - problem: "$y'' - 5y' + 6y = 0$ is a constant-coefficient equation. Use a and b for the constants. Find the general solution as a formula in x."
            answer: "a e^(2x) + b e^(3x)"
            answer_contract: {"kind": "function", "vars": ["a", "b", "x"]}
            solution_sketch: "The characteristic equation of $y'' - 5y' + 6y = 0$ is $r^2 - 5r + 6 = 0$, which factors as $(r - 2)(r - 3) = 0$ (factor step). The discriminant $25 - 24 = 1$ is positive, so the roots $2$ and $3$ are real and different, the distinct-real case (case step). The distinct-real form is $a e^{r_1 x} + b e^{r_2 x}$ with $r_1 = 2$ and $r_2 = 3$ (general solution step). Final answer: a e^(2x) + b e^(3x)."
          - problem: "$y'' - 6y' + 13y = 0$ with $y(0) = 1$ and $y'(0) = 0$. Find the solution as a formula in x."
            answer: "e^(3x)(cos(2x) - (3/2) sin(2x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The characteristic equation of $y'' - 6y' + 13y = 0$ is $r^2 - 6r + 13 = 0$ with discriminant $36 - 52 = -16 < 0$ (discriminant step). The roots are $3 \\pm 2i$, the complex case, so the general solution is $e^{3x}(a\\cos(2x) + b\\sin(2x))$ (case step). The value $y(0) = 1$ gives $a = 1$, and differentiating gives $y'(0) = 3a + 2b = 0$, so $b = -3/2$ (initial value step). Final answer: e^(3x)(cos(2x) - (3/2) sin(2x))."
          - problem: "$y = a e^{2x} + b e^{-4x}$ is the general solution of $y'' + p y' + q y = 0$. Find the numbers p and q."
            answer: "p = 2; q = -8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "p"}, {"contract": {"kind": "exact"}, "name": "q"}]}
            solution_sketch: "The general solution $y = a e^{2x} + b e^{-4x}$ shows the characteristic roots $r_1 = 2$ and $r_2 = -4$, the distinct-real case (roots step). The characteristic polynomial is $(r - 2)(r + 4) = r^2 + 2r - 8$ (expand step). Matching the coefficients in $y'' + p y' + q y = 0$ gives $p = 2$ and $q = -8$ (coefficient step). Final answer: p = 2; q = -8."
        constraints: "one equation from each root case may appear; the solver must pick the case from the discriminant"
    diagnostic_exemplar:
      problem: 'Solve $y'''' + 6y'' + 13y = 0$ with $y(0) = 2$, $y''(0) = -6$.'
      answer: '$y = 2e^{-3x}\cos 2x$'
