unit: series-solutions
course: differential-equations
module: "Series Solutions"
topics:
  - id: power-series-method
    name: The Power Series Method
    core: false                # parallel terminal solution technique; the course's core
                               # spine (characteristic equation / Laplace / eigenvalues)
                               # does not build on it, and only the supplemental
                               # series-solutions topic consumes it
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: power-series
        weight: 0.6
        key: true
      - id: differentiating-integrating-power-series
        weight: 0.6
        key: true
      - id: standard-maclaurin-series
        weight: 0.4
        key: false
      - id: ode-classification-verification
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Shifting the index of summation
        key_prerequisites: [differentiating-integrating-power-series]
        exemplars:
          - problem: "Consider the series $\\sum_{n=3}^{\\infty} n a_n x^{n-1}$. Put $k = n - 1$ to rewrite it in powers of $x^k$. Give the starting value of $k$ and the factor multiplying $a_{k+1}$ as start = ...; factor = ..."
            answer: "start = 2; factor = k+1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "start"}, {"contract": {"kind": "function", "vars": ["k"]}, "name": "factor"}]}
            solution_sketch: "The full series is $\\sum_{n=3}^{\\infty} n a_n x^{n-1}$. Step 1: the shift is $k = n - 1$, so $n = k + 1$. Step 2: the lower limit $n = 3$ becomes $k = 2$, and the coefficient becomes $(k+1)a_{k+1}$. The shifted series is $\\sum_{k=2}^{\\infty} (k+1)a_{k+1}x^k$, so start = 2; factor = k+1."
          - problem: "Consider the series $\\sum_{n=4}^{\\infty} n(n-1) a_n x^{n-2}$. Put $k = n - 2$ to rewrite it in powers of $x^k$. Give the starting value of $k$ and the factor multiplying $a_{k+2}$ as start = ...; factor = ..."
            answer: "start = 2; factor = k^2+3k+2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "start"}, {"contract": {"kind": "function", "vars": ["k"]}, "name": "factor"}]}
            solution_sketch: "The full series is $\\sum_{n=4}^{\\infty} n(n-1) a_n x^{n-2}$. Step 1: the shift is $k = n - 2$, so $n = k + 2$. Step 2: the lower limit $n = 4$ becomes $k = 2$, and the coefficient becomes $(k+2)(k+1)a_{k+2}= (k^2+3k+2)a_{k+2}$. The shifted series is $\\sum_{k=2}^{\\infty} (k^2+3k+2)a_{k+2}x^k$, so start = 2; factor = k^2+3k+2."
          - problem: "Combine the two series $\\sum_{k=2}^{\\infty} (k+1) a_{k+1} x^k$ and $-\\sum_{k=2}^{\\infty} a_{k+1} x^k$ into one series. Give the starting index and the factor multiplying $a_{k+1}$ as start = ...; factor = ..."
            answer: "start = 2; factor = k"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "start"}, {"contract": {"kind": "function", "vars": ["k"]}, "name": "factor"}]}
            solution_sketch: "The full combination is $\\sum_{k=2}^{\\infty} (k+1) a_{k+1} x^k - \\sum_{k=2}^{\\infty} a_{k+1} x^k$. Step 1: both series already run over $x^k$ and start at $k = 2$, so no shift is needed. Step 2: subtract the coefficients termwise: $(k+1)a_{k+1} - a_{k+1} = k a_{k+1}$. The combined series is $\\sum_{k=2}^{\\infty} k a_{k+1}x^k$, so start = 2; factor = k."
          - problem: "Consider the series $\\sum_{n=1}^{\\infty} n a_n x^{n+2}$. Put $k = n + 2$ to rewrite it in powers of $x^k$. Give the starting value of $k$ and the factor multiplying $a_{k-2}$ as start = ...; factor = ..."
            answer: "start = 3; factor = k-2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "start"}, {"contract": {"kind": "function", "vars": ["k"]}, "name": "factor"}]}
            solution_sketch: "The full series is $\\sum_{n=1}^{\\infty} n a_n x^{n+2}$. Step 1: the shift is $k = n + 2$, so $n = k - 2$. Step 2: the lower limit $n = 1$ becomes $k = 3$, and the coefficient becomes $(k-2)a_{k-2}$. The shifted series is $\\sum_{k=3}^{\\infty} (k-2)a_{k-2}x^k$, so start = 3; factor = k-2."
          - problem: "Combine the two series $\\sum_{k=1}^{\\infty} (k+3) a_{k+3} x^k$ and $-2\\sum_{k=1}^{\\infty} a_k x^k$ into one series. Give the factor multiplying $a_{k+3}$ and the factor multiplying $a_k$ as coef3 = ...; coef0 = ..."
            answer: "coef3 = k+3; coef0 = -2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["k"]}, "name": "coef3"}, {"contract": {"kind": "exact"}, "name": "coef0"}]}
            solution_sketch: "The full combination is $\\sum_{k=1}^{\\infty} (k+3) a_{k+3} x^k - 2\\sum_{k=1}^{\\infty} a_k x^k$. Step 1: both series run over $x^k$ and start at $k = 1$, so no shift is needed. Step 2: combine coefficients termwise: $(k+3)a_{k+3} - 2a_k$. The combined series is $\\sum_{k=1}^{\\infty} [(k+3)a_{k+3} - 2a_k]x^k$, so coef3 = k+3; coef0 = -2."
          - problem: "Consider the series $\\sum_{n=5}^{\\infty} n^2 a_n x^{n-2}$. Put $k = n - 2$ to rewrite it in powers of $x^k$. Give the starting value of $k$ and the factor multiplying $a_{k+2}$ as start = ...; factor = ..."
            answer: "start = 3; factor = k^2+4k+4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "start"}, {"contract": {"kind": "function", "vars": ["k"]}, "name": "factor"}]}
            solution_sketch: "The full series is $\\sum_{n=5}^{\\infty} n^2 a_n x^{n-2}$. Step 1: the shift is $k = n - 2$, so $n = k + 2$. Step 2: the lower limit $n = 5$ becomes $k = 3$, and the coefficient becomes $(k+2)^2 a_{k+2}= (k^2+4k+4)a_{k+2}$. The shifted series is $\\sum_{k=3}^{\\infty} (k^2+4k+4)a_{k+2}x^k$, so start = 3; factor = k^2+4k+4."
        constraints: "index shifts by 1 or 2 only; coefficients stay symbolic a_n; when combining, series must already share the same starting index"
      - id: kp2
        name: First-order equations by power series
        key_prerequisites: [power-series, standard-maclaurin-series]
        exemplars:
          - problem: "Use the power series method to solve $y' = 3y$ with $y(0) = 2$. Give the closed-form solution $y(x)$."
            answer: "2e^(3x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is y' = 3y with y(0) = 2. Assume y = sum a_n x^n. Matching coefficients gives (n+1)a_{n+1} = 3a_n by the power series method. With a_0 = 2, the recurrence gives a_n = 2 * 3^n / n!. The series is 2 sum (3x)^n / n!, which is the Maclaurin series of 2e^(3x). The answer is 2e^(3x)."
          - problem: "Use the power series method to solve $y' + 4y = 0$ with $y(0) = 5$. Give the closed-form solution $y(x)$."
            answer: "5e^(-4x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Rewrite the equation as y' = -4y with y(0) = 5. Assume y = sum a_n x^n. Matching coefficients gives (n+1)a_{n+1} = -4a_n. With a_0 = 5, the recurrence gives a_n = 5 * (-4)^n / n!. The series is 5 sum (-4x)^n / n!, which is the Maclaurin series of 5e^(-4x). The answer is 5e^(-4x)."
          - problem: "Use the power series method to solve $y' = -2xy$ with $y(0) = 3$. Give the closed-form solution $y(x)$."
            answer: "3e^(-x^2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is y' = -2xy with y(0) = 3. Assume y = sum a_n x^n. Then y' = sum (n+1)a_{n+1} x^n and -2xy = sum -2 a_{n-1} x^n. Matching coefficients gives (n+1)a_{n+1} = -2a_{n-1}. With a_0 = 3 and a_1 = 0, odd coefficients vanish. For even n = 2m, a_{2m} = 3(-1)^m / m!. This is the Maclaurin series of 3e^(-x^2). The answer is 3e^(-x^2)."
          - problem: "For the equation $y' = 4y$ with $y(0) = 3$, use the power series method to find the coefficients $a_2$ and $a_3$. Give the answer as a2 = value; a3 = value."
            answer: "a2 = 24; a3 = 32"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a2"}, {"contract": {"kind": "exact"}, "name": "a3"}]}
            solution_sketch: "The equation is y' = 4y with y(0) = 3. Assume y = sum a_n x^n. Matching coefficients gives (n+1)a_{n+1} = 4a_n. With a_0 = 3, the recurrence gives a_1 = 12, a_2 = 4 * 12 / 2 = 24, and a_3 = 4 * 24 / 3 = 32. The answer is a2 = 24; a3 = 32."
          - problem: "For the equation $y' = 2xy$ with $y(0) = 1$, use the power series method to find the coefficients $a_4$ and $a_6$. Give the answer as a4 = value; a6 = value."
            answer: "a4 = 1/2; a6 = 1/6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a4"}, {"contract": {"kind": "exact"}, "name": "a6"}]}
            solution_sketch: "The equation is y' = 2xy with y(0) = 1. Assume y = sum a_n x^n. Then (n+1)a_{n+1} = 2a_{n-1}. With a_0 = 1 and a_1 = 0, odd coefficients vanish and a_2 = 1. Then a_4 = a_2/2 = 1/2 and a_6 = a_4/3 = 1/6. The answer is a4 = 1/2; a6 = 1/6."
          - problem: "For the equation $y' = -3y$ with $y(0) = 2$, use the power series method to find the coefficients $a_2$ and $a_3$. Give the answer as a2 = value; a3 = value."
            answer: "a2 = 9; a3 = -9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a2"}, {"contract": {"kind": "exact"}, "name": "a3"}]}
            solution_sketch: "The equation is y' = -3y with y(0) = 2. Assume y = sum a_n x^n. Matching coefficients gives (n+1)a_{n+1} = -3a_n. With a_0 = 2, the recurrence gives a_1 = -6, a_2 = 9, and a_3 = -9. The answer is a2 = 9; a3 = -9."
        constraints: "equations y' = cy or y' = cxy with small integer c; solutions must be recognizable standard Maclaurin series (e^{cx}, e^{x^2}-type)"
      - id: kp3
        name: Deriving the recurrence for second-order equations
        key_prerequisites: [differentiating-integrating-power-series, ode-classification-verification]
        exemplars:
          - problem: "Let y = sum a_n x^n for the equation y'' + 4y = 0. Derive the recurrence and find the constant c in a_{k+2} = c a_k / ((k+2)(k+1))."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write y = sum a_n x^n. Then y'' = sum (k+2)(k+1) a_{k+2} x^k by differentiating twice. Substitute into y'' + 4y = 0: (k+2)(k+1)a_{k+2} + 4a_k = 0. Solve for a_{k+2}: a_{k+2} = -4 a_k / ((k+2)(k+1)). The constant is c = -4."
          - problem: "Use the power series method on y'' - xy = 0. Derive the recurrence and find the constant c in a_{k+3} = c a_k / ((k+3)(k+2))."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write y = sum a_n x^n. Then y'' = sum (k+2)(k+1) a_{k+2} x^k. The term xy = sum a_k x^{k+1} = sum a_{k-1} x^k for k>=1. Substitute into y'' - xy = 0: for k=0, 2a_2 = 0; for k>=1, (k+2)(k+1)a_{k+2} - a_{k-1} = 0. Let k = m-1: a_{m+2} = a_{m-1} / ((m+2)(m+1)). The constant is c = 1."
          - problem: "For y'' + 9y = 0 with y = sum a_n x^n, derive the recurrence. Find the constant c in a_{k+2} = c a_k / ((k+2)(k+1))."
            answer: "-9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write y = sum a_n x^n. Then y'' = sum (k+2)(k+1) a_{k+2} x^k. Substitute into y'' + 9y = 0: (k+2)(k+1)a_{k+2} + 9a_k = 0. Solve for a_{k+2}: a_{k+2} = -9 a_k / ((k+2)(k+1)). The constant is c = -9."
          - problem: "Let y = sum a_n x^n for y'' - 2y = 0. Derive the recurrence and find the constant c in a_{k+2} = c a_k / ((k+2)(k+1))."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write y = sum a_n x^n. Then y'' = sum (k+2)(k+1) a_{k+2} x^k. Substitute into y'' - 2y = 0: (k+2)(k+1)a_{k+2} - 2a_k = 0. Solve for a_{k+2}: a_{k+2} = 2 a_k / ((k+2)(k+1)). The constant is c = 2."
          - problem: "Use the power series method on y'' + xy = 0. Derive the recurrence and find the constant c in a_{k+3} = c a_k / ((k+3)(k+2))."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write y = sum a_n x^n. Then y'' = sum (k+2)(k+1) a_{k+2} x^k. The term xy = sum a_k x^{k+1} = sum a_{k-1} x^k for k>=1. Substitute into y'' + xy = 0: for k=0, 2a_2 = 0; for k>=1, (k+2)(k+1)a_{k+2} + a_{k-1} = 0. Let k = m-1: a_{m+2} = -a_{m-1} / ((m+2)(m+1)). The constant is c = -1."
          - problem: "For y'' - 3y = 0 with y = sum a_n x^n, derive the recurrence. Find the constant c in a_{k+2} = c a_k / ((k+2)(k+1))."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write y = sum a_n x^n. Then y'' = sum (k+2)(k+1) a_{k+2} x^k. Substitute into y'' - 3y = 0: (k+2)(k+1)a_{k+2} - 3a_k = 0. Solve for a_{k+2}: a_{k+2} = 3 a_k / ((k+2)(k+1)). The constant is c = 3."
        constraints: "coefficients constant or a single factor x; derive the recurrence only, do not iterate it out"
    diagnostic_exemplar:
      problem: "Substitute $y = \\sum_{n=0}^{\\infty} a_n x^n$ into $y'' + y = 0$ and derive the recurrence relation for the coefficients."
      answer: '$a_{k+2} = -\dfrac{a_k}{(k+2)(k+1)}$'
      answer_contract: {kind: none}
      solution_sketch: 'Differentiate twice, shift the index by 2, and match coefficients of $x^k$.'
    anki_seeds:
      - front: 'Index shift: $\sum_{n=2}^{\infty} n(n-1)a_n x^{n-2}$ rewritten in powers $x^k$?'
        back: '$\sum_{k=0}^{\infty}(k+2)(k+1)a_{k+2}x^k$ (substitute $k = n-2$).'
        type: basic
      - front: "The power series method in three steps?"
        back: "Substitute $y = \\sum a_n x^n$, shift indices so all series share the power $x^k$, and match coefficients to get a recurrence."
        type: basic

  - id: series-solutions-ordinary-points
    name: Series Solutions at Ordinary Points
    core: false                # terminal wing: nothing in the tree builds on series
                               # solutions; the method itself lives in power-series-method
    difficulty: 0.82
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: power-series-method
        weight: 0.8
        key: true
      - id: standard-maclaurin-series
        weight: 0.4
        key: false
      - id: homogeneous-constant-coefficients
        weight: 0.3
        key: false
      - id: radius-of-convergence
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: First terms from initial conditions
        key_prerequisites: [power-series-method]
        exemplars:
          - problem: "Find the first three nonzero terms of the series solution of $y'' + y = 0$, $y(0) = 0$, $y'(0) = 1$."
            answer: '$y = x - \dfrac{x^3}{6} + \dfrac{x^5}{120} - \cdots$'
            answer_contract: {kind: none}
            solution_sketch: '$a_0 = 0$, $a_1 = 1$; the recurrence $a_{k+2} = -a_k/((k+2)(k+1))$ gives $a_3 = -1/6$, $a_5 = 1/120$ — the sine series.'
          - problem: "Find the first three nonzero terms of the series solution of $y'' - 4y = 0$, $y(0) = 1$, $y'(0) = 0$."
            answer: '$y = 1 + 2x^2 + \dfrac{2x^4}{3} + \cdots$'
            answer_contract: {kind: none}
            solution_sketch: '$a_{k+2} = 4a_k/((k+2)(k+1))$: $a_2 = 2$, $a_4 = \frac{4 \cdot 2}{12} = \frac{2}{3}$.'
        constraints: "constant coefficients with small integer values; initial conditions kill one of the two coefficient chains or keep both chains short; ask for exactly the first three nonzero terms"
      - id: kp2
        name: The two basic solutions
        key_prerequisites: [power-series-method, homogeneous-constant-coefficients]
        exemplars:
          - problem: "For $y'' - y = 0$, give the first three terms of the basic solutions $y_1$ (with $a_0 = 1$, $a_1 = 0$) and $y_2$ (with $a_0 = 0$, $a_1 = 1$)."
            answer: '$y_1 = 1 + \dfrac{x^2}{2} + \dfrac{x^4}{24} + \cdots$, $\quad y_2 = x + \dfrac{x^3}{6} + \dfrac{x^5}{120} + \cdots$'
            answer_contract: {kind: none}
            solution_sketch: 'The recurrence $a_{k+2} = a_k/((k+2)(k+1))$ runs the even chain from $a_0$ and the odd chain from $a_1$.'
          - problem: "How do the series $y_1, y_2$ for $y'' - y = 0$ relate to the characteristic-equation solution $c_1 e^x + c_2 e^{-x}$?"
            answer: '$y_1 = \dfrac{e^x + e^{-x}}{2}$ and $y_2 = \dfrac{e^x - e^{-x}}{2}$: the same solution space, in a different basis.'
            answer_contract: {kind: none}
            solution_sketch: 'Adding and subtracting the Maclaurin series of $e^x$ and $e^{-x}$ reproduces the even and odd series.'
        constraints: "constant-coefficient equations whose closed forms the learner can check against characteristic-equation solutions"
      - id: kp3
        name: Polynomial coefficients and the guaranteed radius
        key_prerequisites: [power-series-method, radius-of-convergence]
        exemplars:
          - problem: "Find the first three nonzero terms of the solution of the Airy equation $y'' = xy$ with $y(0) = 1$, $y'(0) = 0$."
            answer: '$y = 1 + \dfrac{x^3}{6} + \dfrac{x^6}{180} + \cdots$'
            answer_contract: {kind: none}
            solution_sketch: '$a_2 = 0$, $a_{k+2} = a_{k-1}/((k+2)(k+1))$: $a_3 = \frac{1}{6}$, $a_6 = \frac{a_3}{30} = \frac{1}{180}$.'
          - problem: "The equation $(1 + x^2)y'' + y = 0$ is solved by a power series about $x = 0$. What minimum radius of convergence is guaranteed, and why?"
            answer: "Radius at least $1$: the guaranteed radius is the distance from $0$ to the nearest singular point, and $1 + x^2 = 0$ at $x = \\pm i$, at distance $1$."
            answer_contract: {kind: none}
            solution_sketch: "Radius at least $1$: the guaranteed radius is the distance from $0$ to the nearest singular point, and $1 + x^2 = 0$ at $x = \\pm i$, at distance $1$."
          - problem: "Is $x = 0$ an ordinary point of $x^2y'' + y = 0$?"
            answer: "No: dividing by $x^2$ makes the coefficient of $y$ blow up at $x = 0$, so $x = 0$ is a singular point and the method is not guaranteed there."
            answer_contract: {kind: none}
            solution_sketch: "No: dividing by $x^2$ makes the coefficient of $y$ blow up at $x = 0$, so $x = 0$ is a singular point and the method is not guaranteed there."
        constraints: "polynomial coefficients of degree at most 2; expansion about x = 0 only; radius questions use singular points at distance 1 or 2"
    diagnostic_exemplar:
      problem: 'Find the first three nonzero terms of the power-series solution of $y'''' = 2xy$ with $y(0) = 1$, $y''(0) = 0$.'
      answer: '$y = 1 + \dfrac{x^3}{3} + \dfrac{x^6}{45} + \cdots$'
      answer_contract: {kind: none}
      solution_sketch: 'Substituting $y = \sum a_n x^n$ gives $(n+2)(n+1)a_{n+2} = 2a_{n-1}$. With $a_0 = 1$, $a_1 = 0$ and $a_2 = 0$: $a_3 = \frac{2}{6} = \frac{1}{3}$, $a_4 = a_5 = 0$, and $a_6 = \frac{2a_3}{30} = \frac{1}{45}$.'
    anki_seeds:
      - front: "An ordinary point of y'' + p(x)y' + q(x)y = 0 is..."
        back: "a point where $p$ and $q$ are both analytic (no blow-up); there the series method is guaranteed to work."
        type: basic
      - front: "Guaranteed radius of convergence of a series solution about an ordinary point?"
        back: "At least the distance from the expansion point to the nearest singular point of the equation."
        type: basic
