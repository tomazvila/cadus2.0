      - id: kp3
        name: Polynomial coefficients and the guaranteed radius
        key_prerequisites: [power-series-method, radius-of-convergence]
        exemplars:
          - problem: "For the Airy equation y'' = x y with y(0) = 1 and y'(0) = 0, the power-series solution about x = 0 has coefficients a_n in y = sum a_n x^n. Find the coefficient a_6."
            answer: "1/180"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (power series method): write y = sum a_n x^n and substitute into y'' = x y. Step 2 (recurrence): match coefficients to get a_(k+2) = a_(k-1) / ((k+2)(k+1)). Step 3 (initial conditions): a_0 = 1 and a_1 = 0, so a_3 = 1/6, a_4 = 0 and a_5 = 0. Step 4 (target coefficient): a_6 = a_3 / (6*5) = 1/180. The coefficient is 1/180."
          - problem: "The equation (1 + x^2) y'' + y = 0 is solved by a power series about x = 0. Find the guaranteed radius of convergence of that series."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (ordinary point): x = 0 is ordinary because 1 + x^2 is nonzero at 0. Step 2 (singular points): set 1 + x^2 = 0 to get x = i and x = -i. Step 3 (guaranteed radius): the nearest singular points are at distance 1 from 0, so the guaranteed radius is at least 1. The guaranteed radius is 1."
