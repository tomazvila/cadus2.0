            answer_contract: {"kind": "exact"}
            solution_sketch: 'Transforming gives $(s^2 + 4)Y = 2s + 4$, so $y(t) = 2\cos 2t + 2\sin 2t$. At $t = \frac{\pi}{4}$ the cosine is $0$ and the sine is $1$. So $y\left(\frac{\pi}{4}\right) = 2$.'
          - problem: 'Tia solves $y'''' + 16y = 0$, $y(0) = 3$, $y''(0) = 0$ and writes $y = 3\sin 4t$. What is the correct solution?'
            answer: '3cos(4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + 16)Y = 3 s$, so $Y(s) = \frac{3 s}{s^{2} + 16}$. The denominator $s^2 + 16$ is already a sum of squares, so match the cosine and sine entries directly: $Y(s) = \frac{3 s}{s^{2} + 16}$. Inverting term by term gives 3cos(4t). Tia used the sine entry, but $Y(s) = \frac{3s}{s^2 + 16}$ has $s$ in the numerator, which matches the cosine.'
        constraints: "roots +/- bi or -a +/- bi with integer a, b; the completed square appears after transforming"
      - id: kp3
        name: Constant forcing
        key_prerequisites: [laplace-first-order-ivp, inverse-laplace-partial-fractions]
        step_check:
          step: 'Solve for $A$, $B$, and $C$ using the cover-up method'
          question: 'Why does the cover-up method find $A$ by setting $s = 0$?'
          options:
            - 'The value $s = 0$ is the initial time, so it gives the starting value here'
            - 'Setting $s = 0$ makes every denominator equal to $1$ in the whole sum'
            - 'At $s = 0$ the terms with $B$ and $C$ vanish, leaving only $A$ to find'
          answer: 'At $s = 0$ the terms with $B$ and $C$ vanish, leaving only $A$ to find'
          why: 'After clearing denominators, the terms with $B$ and $C$ both contain the factor $s$. Setting $s = 0$ makes them zero, so one constant remains.'
        exemplars:
          - problem: 'Solve $y'''' + 4y = 8$, $y(0) = 0$, $y''(0) = 0$ using the Laplace transform.'
            answer: '2 - 2cos(2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + 4)Y = \frac{8}{s}$, so $Y(s) = \frac{8}{s \left(s^{2} + 4\right)}$. Partial fractions give $Y(s) = - \frac{2 s}{s^{2} + 4} + \frac{2}{s}$. Inverting term by term gives 2 - 2cos(2t).'
          - problem: 'Solve $y'''' + 3y'' + 2y = 6$, $y(0) = 0$, $y''(0) = 0$ using the Laplace transform.'
            answer: '3 - 6e^(-t) + 3e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + 3 s + 2)Y = \frac{6}{s}$, so $Y(s) = \frac{6}{s \left(s^{2} + 3 s + 2\right)}$. Partial fractions give $Y(s) = \frac{3}{s + 2} - \frac{6}{s + 1} + \frac{3}{s}$. Inverting term by term gives 3 - 6e^(-t) + 3e^(-2t).'
          - problem: 'Solve $y'''' + 9y = 18$, $y(0) = 1$, $y''(0) = 0$ using the Laplace transform.'
            answer: '2 - cos(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + 9)Y = s + \frac{18}{s}$, so $Y(s) = \frac{s^{2} + 18}{s \left(s^{2} + 9\right)}$. Partial fractions give $Y(s) = - \frac{s}{s^{2} + 9} + \frac{2}{s}$. Inverting term by term gives 2 - cos(3t).'
          - problem: 'Solve $y'''' + 4y'' + 3y = 6$, $y(0) = 0$, $y''(0) = 0$ using the Laplace transform.'
            answer: '2 - 3e^(-t) + e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + 4 s + 3)Y = \frac{6}{s}$, so $Y(s) = \frac{6}{s \left(s^{2} + 4 s + 3\right)}$. Partial fractions give $Y(s) = \frac{1}{s + 3} - \frac{3}{s + 1} + \frac{2}{s}$. Inverting term by term gives 2 - 3e^(-t) + e^(-3t).'
          - problem: 'Solve $y'''' + 3y'' + 2y = 6$, $y(0) = 0$, $y''(0) = 1$ using the Laplace transform.'
            answer: '3 - 5e^(-t) + 2e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + 3 s + 2)Y = \frac{s + 6}{s}$, so $Y(s) = \frac{s + 6}{s \left(s^{2} + 3 s + 2\right)}$. Partial fractions give $Y(s) = \frac{2}{s + 2} - \frac{5}{s + 1} + \frac{3}{s}$. Inverting term by term gives 3 - 5e^(-t) + 2e^(-2t).'
          - problem: 'Solve $y'''' + 2y'' + 5y = 10$, $y(0) = 0$, $y''(0) = 0$ using the Laplace transform.'
            answer: '2 - 2e^(-t) cos(2t) - e^(-t) sin(2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + 2 s + 5)Y = \frac{10}{s}$, so $Y(s) = \frac{10}{s \left(s^{2} + 2 s + 5\right)}$. Partial fractions give $Y(s) = - \frac{2 \left(s + 2\right)}{s^{2} + 2 s + 5} + \frac{2}{s}$. The quadratic factor completes to $(s+1)^2 + 4$, which matches the shifted cosine and sine entries. Inverting term by term gives 2 - 2e^(-t) cos(2t) - e^(-t) sin(2t).'
          - problem: 'A $3$ kg mass on a spring of stiffness $27$ N/m, with no damping, rests at $y = 0$ when a constant force of $54$ N starts to act, so $3y'''' + 27y = 54$. Use the Laplace transform to find the displacement $y(t)$.'
            answer: '2 - 2cos(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(3 s^{2} + 27)Y = \frac{54}{s}$, so $Y(s) = \frac{18}{s \left(s^{2} + 9\right)}$. Partial fractions give $Y(s) = - \frac{2 s}{s^{2} + 9} + \frac{2}{s}$. Inverting term by term gives 2 - 2cos(3t). Dividing the equation by $3$ first gives $y'''' + 9y = 18$.'
          - problem: 'A $1$ kg mass on a spring of stiffness $10$ N/m has damping coefficient $7$ N$\cdot$s/m. It rests at $y = 0$ when a constant force of $20$ N starts to act, so $y'''' + 7y'' + 10y = 20$. Use the Laplace transform to find $y(t)$.'
            answer: '2 - 10e^(-2t)/3 + 4e^(-5t)/3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + 7 s + 10)Y = \frac{20}{s}$, so $Y(s) = \frac{20}{s \left(s^{2} + 7 s + 10\right)}$. Partial fractions give $Y(s) = \frac{4}{3 \left(s + 5\right)} - \frac{10}{3 \left(s + 2\right)} + \frac{2}{s}$. Inverting term by term gives 2 - 10e^(-2t)/3 + 4e^(-5t)/3.'
          - problem: 'Solve $y'''' + 2y'' + 5y = 15$, $y(0) = 0$, $y''(0) = 0$ using the Laplace transform. Which constant value does $y(t)$ approach as $t$ grows without bound?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Transforming gives $(s^2 + 2s + 5)Y = \frac{15}{s}$, so $Y = \frac{3}{s} - \frac{3(s+2)}{(s+1)^2 + 4}$. The terms that come from the shifted sine and cosine contain $e^{-t}$ and tend to $0$. So $y(t)$ approaches $3$.'
          - problem: 'Omar solves $y'''' + 9y = 27$, $y(0) = 0$, $y''(0) = 0$. He transforms the constant $27$ as $27$, gets $Y = \frac{27}{s^2 + 9}$ and writes $y = 9\sin 3t$. What is the correct solution $y(t)$?'
            answer: '3 - 3cos(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + 9)Y = \frac{27}{s}$, so $Y(s) = \frac{27}{s \left(s^{2} + 9\right)}$. Partial fractions give $Y(s) = - \frac{3 s}{s^{2} + 9} + \frac{3}{s}$. Inverting term by term gives 3 - 3cos(3t). Omar transformed the constant $27$ as $27$, but $\mathcal{L}\{27\} = \frac{27}{s}$.'
        constraints: "forcing a constant; characteristic roots integer or +/- bi; three-term partial fractions at most"
    diagnostic_exemplar:
      problem: 'Solve $y'''' + 2y'' + 5y = 5$, $y(0) = 0$, $y''(0) = 0$, using the Laplace transform.'
      answer: '$y = 1 - e^{-t}\cos 2t - \tfrac{1}{2}e^{-t}\sin 2t$'
      answer_contract: {kind: none}
      solution_sketch: '$(s^2 + 2s + 5)Y = \frac{5}{s}$, so $Y = \frac{5}{s(s^2+2s+5)} = \frac{1}{s} - \frac{s + 2}{(s+1)^2 + 4}$. Writing $s + 2 = (s+1) + 1$ inverts term by term.'
    anki_seeds:
      - front: "Why does the Laplace method suit IVPs?"
        back: "The initial conditions enter the algebra immediately: no general solution or constant-fitting step."
        type: basic
      - front: 'After transforming $ay'''' + by'' + cy = f(t)$, the denominator of $Y(s)$ is...'
        back: 'the characteristic polynomial $as^2 + bs + c$ (times any denominator from $F(s)$).'
        type: basic

  - id: unit-step-piecewise-forcing
    name: Unit Step Functions and Piecewise Rewriting
    core: false                # Laplace extension; terminal
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: laplace-transform-basics
        weight: 0.6
        key: true
      - id: inverse-laplace-table
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Rewriting piecewise functions with unit steps
        key_prerequisites: [laplace-transform-basics]
        step_check:
          step: 'This can be seen as adding $2(t - 5)$ to the constant $4$'
          question: 'Why is the term $2(t-5)$ multiplied by $u_5(t)$ while the constant $4$ is not?'
          options:
            - 'Constants never need a step, while every linear term always needs a step'
            - 'The constant $4$ holds always, but $2(t-5)$ must act only from $t=5$'
            - 'The step makes the whole function equal $0$ before $t=5$, as the ramp does'
            - 'A step is always attached to the term with the larger coefficient'
          answer: 'The constant $4$ holds always, but $2(t-5)$ must act only from $t=5$'
          why: 'The step $u_5(t)$ is $0$ before $t=5$ and $1$ after, so it switches the new term on at the breakpoint; the starting constant $4$ is present for all $t$.'
        exemplars:
          - problem: 'A signal is $0$ for $t<4$ and $6$ for $t\ge4$, so it can be written $f(t)=A\,u_c(t)$. At what time $c$ does the signal switch on?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The signal changes from $0$ to $6$ at $t=4$, and the step $u_c(t)$ switches on at $t=c$. So $c=4$, and the height after the switch gives $A=6$.'
          - problem: 'A room is held at $18^\circ$C until $t=3$ hours and at $25^\circ$C from then on, so its set temperature is $f(t)=18+B\,u_3(t)$. Find $B$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Before $t=3$ the step is off and $f=18$. After $t=3$ the step is on, so $f=18+B$ must equal $25$. Hence $B=25-18=7$.'
          - problem: 'A current is $7$ amperes for $0\le t<2$ and $0$ afterwards, so $f(t)=7-7\,u_c(t)$. Find $c$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The term $7\,u_c(t)$ is off until $t=c$ and then cancels the $7$. The current drops to $0$ at $t=2$, so $c=2$.'
          - problem: 'A function is $0$ for $t<5$ and equals $3(t-5)$ for $t\ge5$, so $f(t)=A\,(t-5)\,u_5(t)$. Find $A$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $t\ge5$ the step equals $1$, so $f(t)=A(t-5)$. This must match $3(t-5)$, so $A=3$, the slope of the ramp.'
          - problem: 'A function is $12$ for $t<3$ and equals $4t$ for $t\ge3$. It is written $f(t)=12+m\,(t-3)\,u_3(t)$. Find $m$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $t\ge3$ we need $12+m(t-3)=4t$. Expanding gives $12+mt-3m=4t$, so $m=4$ and then $12-12=0$ matches.'
          - problem: 'A control signal is $0$ until $t=2$ seconds. It then rises at a constant rate and reaches $18$ at $t=5$ seconds, so $f(t)=m\,(t-2)\,u_2(t)$ for $t\le5$. Find $m$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $t=5$ the formula gives $f(5)=m(5-2)=3m$. Setting $3m=18$ and dividing by $3$ gives $m=6$.'
          - problem: 'A heater supplies $P(t)=3+5\,u_3(t)$ kilowatts. How much power does it supply at $t=4$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $t=4$ we have $t\ge3$, so $u_3(4)=1$. Then $P(4)=3+5\cdot1=8$ kilowatts.'
          - problem: 'Sam writes the function that is $0$ for $t<5$ and $3(t-5)$ for $t\ge5$ as $3t\,u_5(t)$. What is the correct value of the function at $t=7$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam did not shift $t$ inside the ramp, so his formula gives $21$ at $t=7$, which is wrong. The true function is $3(t-5)$ for $t\ge5$, so $f(7)=3\cdot2=6$.'
          - problem: 'A function is $5$ for $t<2$ and equals $3-2t$ for $t\ge2$. It is written $f(t)=5+(at+b)\,u_2(t)$. Find $b$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $t\ge2$ we need $5+at+b=3-2t$, so $a=-2$. Then $5+b=3$ gives $b=-2$.'
          - problem: 'A ramp signal is $0$ until the switch time $c$ and then equals $2(t-c)$, so $f(t)=2\,(t-c)\,u_c(t)$. At $t=6$ the signal has the value $8$. Find $c$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $t=6$ the signal is on, so $f(6)=2(6-c)$. Setting $2(6-c)=8$ gives $6-c=4$, so the switch time is $c=2$.'
        constraints: 'at most two pieces with integer breakpoints; pieces constant or linear; one coefficient, breakpoint or value is asked for'
      - id: kp2
        name: The second shifting theorem
        key_prerequisites: [laplace-transform-basics]
        step_check:
          step: 'Multiply $F(s)$ by $e^{-cs}$ where $c = 4$'
          question: 'Why does the delay of $4$ multiply the transform by $e^{-4s}$, and not replace $s$ by $s-4$?'
          options:
            - 'Replacing $s$ by $s-4$ is used only when the function $f(t)$ is a polynomial in $t$'
            - 'The factor $e^{-4s}$ appears because $t^2$ has a factor $4$ in its transform'
            - 'Delays shrink the transform, so a factor below $1$ is always the right choice'
            - 'A delay of $4$ in $t$ gives $e^{-4s}$; the shift $s-4$ multiplies $f$ by $e^{4t}$'
          answer: 'A delay of $4$ in $t$ gives $e^{-4s}$; the shift $s-4$ multiplies $f$ by $e^{4t}$'
          why: 'Substituting $t-4$ in $f$ moves the graph right and gives $\int_4^\infty e^{-st}f(t-4)\,dt=e^{-4s}F(s)$; the shift $s\to s-4$ belongs to multiplying $f$ by $e^{4t}$.'
        exemplars:
          - problem: 'Find the Laplace transform of the unit step $u_4(t)$.'
            answer: 'e^(-4s)/s'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The unit step is $u_c(t)f(t-c)$ with $c=4$ and $f(t)=1$. Since $F(s)=1/s$, the second shifting theorem gives $e^{-4s}/s$.'
          - problem: 'Find $\mathcal{L}\{(t-2)\,u_2(t)\}$.'
            answer: 'e^(-2s)/s^2'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The function has the form $f(t-2)u_2(t)$ with $f(t)=t$. The table gives $F(s)=1/s^2$, and the shift multiplies it by $e^{-2s}$.'
          - problem: 'Find $\mathcal{L}\{(t-1)^2\,u_1(t)\}$.'
            answer: '2e^(-s)/s^3'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'Here $f(t-1)=(t-1)^2$, so $f(t)=t^2$ and $F(s)=2/s^3$. Shifting by $c=1$ multiplies by $e^{-s}$, which gives $2e^{-s}/s^3$.'
          - problem: 'A pump is switched on at $t=3$ minutes and then supplies a constant $5$ litres per minute, so the input rate is $r(t)=5\,u_3(t)$. Find the Laplace transform of $r(t)$.'
            answer: '5e^(-3s)/s'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The rate is $5\,u_3(t)$, which is $5$ times a unit step at $c=3$. The transform of the unit step is $e^{-3s}/s$, so $R(s)=5e^{-3s}/s$.'
          - problem: 'Find $\mathcal{L}\{u_5(t)\,e^{t-5}\}$.'
            answer: 'e^(-5s)/(s-1)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'Here $f(t-5)=e^{t-5}$, so $f(t)=e^t$ and $F(s)=1/(s-1)$. The shift by $5$ multiplies by $e^{-5s}$, which gives $e^{-5s}/(s-1)$.'
          - problem: 'A voltage is $5$ volts for $0\le t<2$ and $0$ afterwards. Find its Laplace transform.'
            answer: '5(1 - e^(-2s))/s'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The voltage is $5-5\,u_2(t)$, a constant $5$ that is switched off at $t=2$. The transforms are $5/s$ and $5e^{-2s}/s$, so $V(s)=5(1-e^{-2s})/s$.'
          - problem: 'Find $\mathcal{L}\{(t-3)^3\,u_3(t)\}$.'
            answer: '6e^(-3s)/s^4'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'With $f(t)=t^3$ the table gives $F(s)=6/s^4$. The shift $c=3$ multiplies by $e^{-3s}$, so the transform is $6e^{-3s}/s^4$.'
          - problem: 'A function is $0$ for $t<2$ and equals $t$ for $t\ge2$. Find its Laplace transform.'
            answer: 'e^(-2s)(1/s^2 + 2/s)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'Write the function as $t\,u_2(t)$ and split $t=(t-2)+2$. Then $(t-2)u_2(t)$ has transform $e^{-2s}/s^2$ and $2u_2(t)$ has transform $2e^{-2s}/s$. The sum is $e^{-2s}(1/s^2+2/s)$.'
          - problem: 'Find $\mathcal{L}\{u_\pi(t)\,\sin(t-\pi)\}$.'
            answer: 'e^(-pi s)/(s^2+1)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'Here $f(t-\pi)=\sin(t-\pi)$, so $f(t)=\sin t$ and $F(s)=1/(s^2+1)$. The shift by $\pi$ multiplies by $e^{-\pi s}$, which gives $e^{-\pi s}/(s^2+1)$.'
        constraints: 'arguments already in the form f(t - c) or a piecewise definition rewritten with steps; c a positive integer or pi; f from the table'
      - id: kp3
        name: Inverting exponentials
        key_prerequisites: [inverse-laplace-table]
        step_check:
          step: 'Multiply by $u_3(t)$ and replace $t$ with $(t - 3)$ in $\sin t$'
          question: 'Why must $t$ be replaced by $t-3$ in $\sin t$, rather than only multiplying by $u_3(t)$?'
          options:
            - 'The delayed sine must start its cycle at $t=3$, where $\sin(t-3)=0$'
            - 'Multiplying by $u_3(t)$ alone would change the frequency of the sine wave'
            - 'The factor $e^{-3s}$ is only a constant and so it cannot move the sine'
            - 'Replacing $t$ by $t-3$ makes the sine larger for every $t\ge3$'
          answer: 'The delayed sine must start its cycle at $t=3$, where $\sin(t-3)=0$'
          why: 'The factor $e^{-3s}$ means a delay of $3$, so the whole shape of $\sin t$ is moved to start at $t=3$; with $u_3(t)\sin t$ the sine would be cut off mid-cycle.'
        exemplars:
          - problem: 'Let $g(t)$ be the inverse Laplace transform of $\dfrac{e^{-3s}}{s^2}$. Find $g(5)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The table gives $\mathcal{L}^{-1}\{1/s^2\}=t$. With the shift $c=3$ we get $g(t)=(t-3)\,u_3(t)$. At $t=5$ the step is on, so $g(5)=5-3=2$.'
          - problem: 'A voltage in an RC circuit has Laplace transform $\dfrac{e^{-4s}}{s+1}$. If $v(t)$ is the voltage, find $v(6)$.'
            answer: 'e^(-2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The table gives $\mathcal{L}^{-1}\{1/(s+1)\}=e^{-t}$. With the shift $c=4$ we get $v(t)=u_4(t)\,e^{-(t-4)}$. At $t=6$ this is $e^{-2}$.'
          - problem: 'Let $g(t)$ be the inverse Laplace transform of $\dfrac{2e^{-3s}}{s^3}$. Find $g(6)$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The table gives $\mathcal{L}^{-1}\{2/s^3\}=t^2$. With $c=3$ we get $g(t)=(t-3)^2\,u_3(t)$. At $t=6$ this is $3^2=9$.'
          - problem: 'Let $g(t)$ be the inverse Laplace transform of $\dfrac{e^{-3s}}{s}$. Find $g(2)$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The table gives $\mathcal{L}^{-1}\{1/s\}=1$, so $g(t)=u_3(t)$. The step is off for $t<3$. Since $2<3$, the value is $g(2)=0$.'
          - problem: 'A forcing function has Laplace transform $\dfrac{3e^{-2s}}{s^2+9}$. If $g(t)$ is the forcing function, find $g(3)$ to four decimal places.'
            answer: '0.1411'
            answer_contract: {"kind":"approx","decimals":4}
            solution_sketch: 'The table gives $\mathcal{L}^{-1}\{3/(s^2+9)\}=\sin 3t$. With $c=2$ we get $g(t)=u_2(t)\sin(3(t-2))$. At $t=3$ this is $\sin 3\approx0.1411$.'
          - problem: 'Let $g(t)$ be the inverse Laplace transform of $\dfrac{s\,e^{-6s}}{s^2+1}$. Find $g(7)$ to four decimal places.'
            answer: '0.5403'
            answer_contract: {"kind":"approx","decimals":4}
            solution_sketch: 'The table gives $\mathcal{L}^{-1}\{s/(s^2+1)\}=\cos t$. With $c=6$ we get $g(t)=u_6(t)\cos(t-6)$. At $t=7$ this is $\cos 1\approx0.5403$.'
          - problem: 'A signal has Laplace transform $\dfrac{e^{-4s}}{s+1}$. Find the signal $g(t)$ for $t\ge4$.'
            answer: 'e^(-(t-4))'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The table gives $\mathcal{L}^{-1}\{1/(s+1)\}=e^{-t}$. The delay $c=4$ replaces $t$ by $t-4$, so for $t\ge4$ we get $g(t)=e^{-(t-4)}$.'
          - problem: 'A delayed signal has Laplace transform $\dfrac{e^{-cs}}{s+2}$ for some delay $c$. At $t=10$ the signal has the value $e^{-6}$. Find $c$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The delayed signal is $u_c(t)\,e^{-2(t-c)}$. At $t=10$ it equals $e^{-2(10-c)}$, which must be $e^{-6}$. So $2(10-c)=6$, which gives $10-c=3$ and $c=7$.'
        constraints: 'e^{-cs} times a single table entry; the answer is a value of the inverse transform, or its formula for t after the delay'
    diagnostic_exemplar:
      problem: 'Let $f(t) = 0$ for $t < 2$ and $f(t) = t$ for $t \ge 2$. Write $f$ using a unit step and compute $\mathcal{L}\{f\}$.'
      answer: '$f(t) = t\,u_2(t)$ and $\mathcal{L}\{f\} = e^{-2s}\left(\dfrac{1}{s^2} + \dfrac{2}{s}\right)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Write $t = (t - 2) + 2$, so $f = \left[(t-2) + 2\right]u_2(t)$; the second shifting theorem then gives $e^{-2s}\mathcal{L}\{t + 2\} = e^{-2s}\left(\frac{1}{s^2} + \frac{2}{s}\right)$.'
    anki_seeds:
      - front: 'Definition of the unit step $u_c(t)$?'
        back: '$u_c(t) = 0$ for $t < c$ and $1$ for $t \ge c$ (a switch that turns on at $t = c$).'
        type: basic
      - front: 'Second shifting theorem?'
        back: '$\mathcal{L}\{u_c(t)f(t - c)\} = e^{-cs}F(s)$: a time delay multiplies the transform by $e^{-cs}$.'
        type: basic

  - id: laplace-convolution
    name: Convolution and the Convolution Theorem
    core: false                # terminal capstone of the Laplace module
    difficulty: 0.82
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: inverse-laplace-partial-fractions
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.3
        key: false
      - id: laplace-ivp
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Computing convolutions
        key_prerequisites: [definite-integrals-ftc]
        step_check:
          step: 'Factor out $e^{3t}$'
          question: 'Why can $e^{3t}$ be moved in front of the integral?'
          options:
            - 'It equals $1$ at $u=0$, which is the lower limit of the integral'
            - 'Exponentials can always be moved outside of every integral sign'
            - 'It has no $u$ in it, so inside the integral it is a constant'
            - 'It is the larger of the two factors inside the integrand here'
          answer: 'It has no $u$ in it, so inside the integral it is a constant'
          why: 'The integral is taken over $u$ while $t$ is fixed, so $e^{3t}$ is a constant factor; $e^{-3u}$ depends on $u$ and has to stay inside.'
        exemplars:
          - problem: 'Compute the convolution $(1*t)(t)$.'
            answer: 't^2/2'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'By definition $(1*t)(t)=\int_0^t 1\cdot(t-\tau)\,d\tau$. An antiderivative in $\tau$ is $t\tau-\tau^2/2$. At $\tau=t$ it equals $t^2-t^2/2=t^2/2$, and at $\tau=0$ it is $0$.'
          - problem: 'Compute the convolution $(t*t)(t)$.'
            answer: 't^3/6'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'By definition $(t*t)(t)=\int_0^t\tau\,(t-\tau)\,d\tau=\int_0^t(t\tau-\tau^2)\,d\tau$. This equals $t\cdot t^2/2-t^3/3=t^3/2-t^3/3=t^3/6$.'
          - problem: 'Find the convolution of $f(t)=1$ and $g(t)=e^{2t}$.'
            answer: '(e^(2t)-1)/2'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The integral is $\int_0^t 1\cdot e^{2(t-\tau)}\,d\tau$. Pull out $e^{2t}$ to get $e^{2t}\int_0^t e^{-2\tau}d\tau=e^{2t}(1-e^{-2t})/2$. This simplifies to $(e^{2t}-1)/2$.'
          - problem: 'Compute $(e^{t}*e^{3t})(t)$.'
            answer: '(e^(3t)-e^t)/2'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The integral is $\int_0^t e^{\tau}e^{3(t-\tau)}\,d\tau=e^{3t}\int_0^t e^{-2\tau}\,d\tau$. This is $e^{3t}(1-e^{-2t})/2$, which equals $(e^{3t}-e^{t})/2$.'
          - problem: 'Find the convolution of $f(t)=t$ and $g(t)=\sin t$.'
            answer: 't - sin(t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The integral is $\int_0^t\tau\sin(t-\tau)\,d\tau$. Integration by parts with $u=\tau$ gives $[\tau\cos(t-\tau)]_0^t-\int_0^t\cos(t-\tau)\,d\tau=t-\sin t$.'
          - problem: 'A system has impulse response $h(t)=e^{-2t}$ and is driven by the constant input $f(t)=1$. Its output is the convolution $(h*f)(t)$. Find the output.'
            answer: '(1 - e^(-2t))/2'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The output is $\int_0^t e^{-2\tau}\cdot1\,d\tau$, because the constant input does not change when shifted. An antiderivative is $-e^{-2\tau}/2$, so the value is $(1-e^{-2t})/2$.'
          - problem: 'Compute $(\sin t*\sin 3t)(t)$.'
            answer: '(3sin(t)-sin(3t))/8'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The integral is $\int_0^t\sin\tau\,\sin(3t-3\tau)\,d\tau$. The product-to-sum identity turns it into two cosine terms, whose integrals give $\frac{3\sin t-\sin 3t}{8}$.'
          - problem: 'A filter has impulse response $h(t)=t$ and receives the input $g(t)=t$. Its output is the convolution $(h*g)(t)$. What is the output at $t=3$?'
            answer: '9/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The convolution $(t*t)(t)$ equals $t^3/6$. At $t=3$ this is $27/6=9/2$.'
          - problem: 'Sam says that $(1*t)(t)=1\cdot t=t$, because a convolution multiplies the two functions. What is the correct value of $(1*t)(4)$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A convolution is an integral, not a product. The correct result is $(1*t)(t)=t^2/2$. At $t=4$ this is $16/2=8$, while Sam would get $4$.'
        constraints: 'f, g among 1, t, e^{at}, sin bt; the integral must be elementary; an impulse-response context or a value at a stated time is allowed'
      - id: kp2
        name: The convolution theorem
        key_prerequisites: [inverse-laplace-partial-fractions]
        step_check:
          step: 'Identify the Laplace transforms of the individual functions'
          question: 'Why does the solution start by transforming $e^{2t}$ and $\sin t$ separately?'
          options:
            - 'A convolution transforms into the sum of the two transforms'
            - 'A convolution transforms into the product of the two transforms'
            - 'A convolution cannot be integrated without using a table of transforms'
            - 'A convolution transforms into the convolution of the two transforms'
          answer: 'A convolution transforms into the product of the two transforms'
          why: 'The convolution theorem says $\mathcal{L}\{f*g\}=F(s)G(s)$, so only the two separate transforms are needed and no integral is evaluated.'
        exemplars:
          - problem: 'Use the convolution theorem to find $\mathcal{L}\{1*t\}$.'
            answer: '1/s^3'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of a convolution is the product of the transforms. The table gives $\mathcal{L}\{1\}=1/s$ and $\mathcal{L}\{t\}=1/s^2$. Their product is $1/s^3$.'
          - problem: 'Use the convolution theorem to find $\mathcal{L}^{-1}\left\{\dfrac{1}{s^2(s+1)}\right\}$.'
            answer: 't - 1 + e^(-t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The product $\frac{1}{s^2}\cdot\frac{1}{s+1}$ inverts to the convolution $t*e^{-t}=\int_0^t(t-\tau)e^{-\tau}\,d\tau$. Evaluating the integral gives $t-1+e^{-t}$.'
          - problem: 'Use the convolution theorem to solve $y''''+y=t$ with $y(0)=0$ and $y''(0)=0$.'
            answer: 't - sin(t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Transforming gives $(s^2+1)Y=1/s^2$, so $Y=\frac{1}{s^2+1}\cdot\frac{1}{s^2}$. The inverse is the convolution $\sin t*t$, which equals $t-\sin t$.'
          - problem: 'Use the convolution theorem to find $\mathcal{L}^{-1}\left\{\dfrac{1}{s(s+3)}\right\}$.'
            answer: '(1 - e^(-3t))/3'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The product $\frac1s\cdot\frac{1}{s+3}$ inverts to the convolution $1*e^{-3t}=\int_0^te^{-3\tau}d\tau$. This equals $(1-e^{-3t})/3$.'
          - problem: 'A mass on a spring satisfies $y''''+4y=t$ with $y(0)=0$ and $y''(0)=0$. Use the convolution theorem to find $y(t)$.'
            answer: 't/4 - sin(2t)/8'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Transforming gives $(s^2+4)Y=1/s^2$, so $Y=\frac{1}{s^2+4}\cdot\frac{1}{s^2}$. The inverse is $\frac12\sin 2t*t$, which equals $\frac t4-\frac{\sin 2t}{8}$.'
          - problem: 'Use the convolution theorem to find $\mathcal{L}\{t*e^{-5t}\}$.'
            answer: '1/(s^2(s+5))'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of a convolution is the product of the transforms. The table gives $\mathcal{L}\{t\}=1/s^2$ and $\mathcal{L}\{e^{-5t}\}=1/(s+5)$. The product is $1/(s^2(s+5))$.'
          - problem: 'The current in a circuit has Laplace transform $I(s)=\dfrac{1}{(s+1)(s+2)}$. Use the convolution theorem to find the current $i(t)$.'
            answer: 'e^(-t) - e^(-2t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The product $\frac{1}{s+1}\cdot\frac{1}{s+2}$ inverts to the convolution $e^{-t}*e^{-2t}=e^{-2t}\int_0^te^{\tau}d\tau$. This equals $e^{-t}-e^{-2t}$.'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{1}{s^2(s+1)}\right\}$ at $t=2$ by the convolution theorem, to three decimal places.'
            answer: '1.135'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'The inverse transform is the convolution $t*e^{-t}=t-1+e^{-t}$. At $t=2$ this is $2-1+e^{-2}\approx1.135$.'
        constraints: 'products of two table entries; convolution integrals stay elementary'
    diagnostic_exemplar:
      problem: 'Use the convolution theorem to compute $\mathcal{L}^{-1}\left\{\dfrac{1}{s^2(s+2)}\right\}$.'
      answer: '$\dfrac{t}{2} - \dfrac{1}{4} + \dfrac{1}{4}e^{-2t}$'
      answer_contract: {kind: none}
      solution_sketch: 'The transform is the product of $1/s^2$ and $1/(s+2)$, so the inverse is $t * e^{-2t} = \int_0^t \tau e^{-2(t-\tau)}\,d\tau = e^{-2t}\left[\frac{\tau}{2}e^{2\tau} - \frac{1}{4}e^{2\tau}\right]_0^t = \frac{t}{2} - \frac{1}{4} + \frac{1}{4}e^{-2t}$.'
    anki_seeds:
      - front: 'Definition of the convolution $(f * g)(t)$?'
        back: '$\int_0^t f(\tau)\,g(t - \tau)\,d\tau$'
        type: basic
      - front: 'Convolution theorem?'
        back: '$\mathcal{L}\{f * g\} = F(s)\,G(s)$: convolution in $t$ becomes multiplication in $s$.'
        type: basic

  - id: dirac-delta-impulse
    name: The Dirac Delta and Impulse Response
    core: false                # terminal extension of the Laplace unit, alongside the
                               # supplemental unit-step and convolution topics it builds on
    difficulty: 0.84
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: unit-step-piecewise-forcing
        weight: 0.5
        key: true
      - id: laplace-ivp
        weight: 0.5
        key: true
      - id: laplace-convolution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: The delta function and the sifting property
        key_prerequisites: [unit-step-piecewise-forcing]
        step_check:
          step: 'Check if $$c = 4$$ is within the integration interval'
          question: 'Why must the solution check that $c=4$ lies inside the interval $[0,\infty)$?'
          options:
            - 'The delta function is defined only for positive values of $c$ in the integral'
            - 'The sine function is not defined for values outside the interval of integration'
            - 'The integral equals the length of the interval whenever $c$ is inside it'
            - 'The delta reads off $f(c)$ only if $c$ is inside; else the integral is $0$'
          answer: 'The delta reads off $f(c)$ only if $c$ is inside; else the integral is $0$'
          why: 'The delta function is zero away from $t=c$, so the integral is $f(c)$ when $c$ is in the interval and $0$ when it is not.'
        try_first:
          problem: 'The delta function $\delta(t-3)$ is zero except at $t=3$, where it carries total area $1$. What value would you expect for $\int_0^{10}\delta(t-3)\,t\,dt$?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'The unit area sits at $t=3$, so the integral simply reads off the value of $t$ there. This is the sifting property: $\int\delta(t-c)f(t)\,dt=f(c)$.'
        exemplars:
          - problem: 'Evaluate $\displaystyle\int_0^{\infty}\delta(t-2)\,e^{-3t}\,dt$.'
            answer: 'e^(-6)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The delta function picks out the value of the rest of the integrand at $t=2$, which lies inside $[0,\infty)$. So the integral equals $e^{-3\cdot2}=e^{-6}$.'
          - problem: 'Evaluate $\displaystyle\int_0^5\delta(t-3)\,(t^2+1)\,dt$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The impulse at $t=3$ lies inside $(0,5)$, so the integral equals the value of $t^2+1$ at $t=3$. That value is $9+1=10$.'
          - problem: 'Find the Laplace transform of $\delta(t-5)$.'
            answer: 'e^(-5s)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'By definition $\mathcal{L}\{\delta(t-5)\}=\int_0^\infty e^{-st}\delta(t-5)\,dt$. The sifting property replaces $t$ by $5$ in $e^{-st}$, which gives $e^{-5s}$.'
          - problem: 'Evaluate $\displaystyle\int_0^5\delta(t-3)\,\sin\!\left(\frac{\pi t}{2}\right)dt$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The impulse at $t=3$ lies inside $(0,5)$, so the integral equals $\sin(3\pi/2)$. This value is $-1$.'
          - problem: 'Evaluate $\displaystyle\int_0^6\delta(t-4)\,(t^2-3t+2)\,dt$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The impulse at $t=4$ lies inside $(0,6)$, so the integral equals $t^2-3t+2$ at $t=4$. That is $16-12+2=6$.'
          - problem: 'Evaluate $\displaystyle\int_0^5\delta(t-7)\,(t^2+1)\,dt$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The impulse sits at $t=7$, which is outside the interval $(0,5)$. The integrand is $0$ everywhere on the interval, so the integral is $0$.'
          - problem: 'A sensor has sensitivity $w(t)=t^2$ and is hit at $t=3$ by a spike modelled as $4\,\delta(t-3)$. Its reading is $\int_0^{10}4\,\delta(t-3)\,w(t)\,dt$. Find the reading.'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The spike at $t=3$ lies inside $(0,10)$, so the reading is $4\,w(3)$. Since $w(3)=9$, the reading is $4\cdot9=36$.'
          - problem: 'A spike $A\,\delta(t-2)$ acts on the weight $w(t)=3t+1$, and the reading $\int_0^5 A\,\delta(t-2)\,w(t)\,dt$ is $28$. Find $A$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reading equals $A\,w(2)=7A$. Setting $7A=28$ and dividing by $7$ gives $A=4$.'
          - problem: 'The impulse $\delta(t-c)$ lies inside the interval $0<t<5$ and $\int_0^5\delta(t-c)\,(2t+1)\,dt=9$. Find $c$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the sifting property the integral equals $2c+1$. Setting $2c+1=9$ gives $2c=8$, so $c=4$.'
          - problem: 'Sam says $\int_0^\infty\delta(t-2)\,(t+5)\,dt$ is infinite, because the delta function is infinite at $t=2$. What is the correct value of the integral?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The delta function is not a number at $t=2$. Its integral against $t+5$ is the value of $t+5$ at $t=2$, which is $7$.'
        constraints: 'impulse located inside or outside the integration interval, with an amplitude factor; integrands from the Laplace table (polynomials, e^{at}, sin bt); a value, a transform or an unknown amplitude or location is asked for'
      - id: kp2
        name: Impulse-forced initial value problems
        key_prerequisites: [laplace-ivp, unit-step-piecewise-forcing]
        step_check:
          step: 'Invert the Laplace transform using the second shifting theorem'
          question: 'Why is the second shifting theorem needed to invert $e^{-2s}\left(\frac{1}{s+1}-\frac{1}{s+2}\right)$?'
          options:
            - 'The partial fractions have no inverse in the table of transforms here'
            - 'The initial conditions are not zero, so a shift in $t$ is needed'
            - 'The factor $e^{-2s}$ delays the response, so $t$ becomes $t-2$'
            - 'The delta function must be integrated once before it can be inverted'
          answer: 'The factor $e^{-2s}$ delays the response, so $t$ becomes $t-2$'
          why: 'The factor $e^{-2s}$ means the impulse arrives at $t=2$, so the response starts then and equals the response to $\delta(t)$ with $t$ replaced by $t-2$.'
        exemplars:
          - problem: 'The system $y''+2y=\delta(t-1)$ has $y(0)=0$. Find $y(2)$.'
            answer: 'e^(-2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Transforming gives $(s+2)Y=e^{-s}$, so $Y=e^{-s}/(s+2)$. The second shifting theorem gives $y(t)=u_1(t)\,e^{-2(t-1)}$. At $t=2$ this is $e^{-2}$.'
          - problem: 'The system $y''''+y=\delta(t-\pi)$ has $y(0)=y''(0)=0$. Find $y(3\pi/2)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Transforming gives $(s^2+1)Y=e^{-\pi s}$, so $Y=e^{-\pi s}/(s^2+1)$. The shift gives $y(t)=u_\pi(t)\sin(t-\pi)$. At $t=3\pi/2$ this is $\sin(\pi/2)=1$.'
          - problem: 'The system $y''''+9y=\delta(t)$ has $y(0)=y''(0)=0$. Find $y(t)$.'
            answer: 'sin(3t)/3'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Transforming gives $(s^2+9)Y=1$, so $Y=1/(s^2+9)$. The table inverts this to $y(t)=\sin(3t)/3$.'
          - problem: 'The system $y''''+5y''+6y=\delta(t)$ has $y(0)=y''(0)=0$. Find $y(t)$.'
            answer: 'e^(-2t) - e^(-3t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Transforming gives $(s^2+5s+6)Y=1$, so $Y=\frac{1}{(s+2)(s+3)}=\frac1{s+2}-\frac1{s+3}$. Inverting each term gives $e^{-2t}-e^{-3t}$.'
          - problem: 'The system $y''''+4y=\delta(t-2)$ has $y(0)=y''(0)=0$. Find $y(2+\pi/4)$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Transforming gives $(s^2+4)Y=e^{-2s}$, so $y(t)=u_2(t)\sin(2(t-2))/2$. At $t=2+\pi/4$ the sine is $\sin(\pi/2)=1$, so $y=1/2$.'
          - problem: 'A mass of $1$ kg on a spring with stiffness $16$ N/m rests at equilibrium. At $t=0$ a hammer gives it an impulse of $8$ N\,s, so $y''''+16y=8\,\delta(t)$ with $y(0)=y''(0)=0$. Find the displacement $y(t)$.'
            answer: '2sin(4t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Transforming gives $(s^2+16)Y=8$, so $Y=8/(s^2+16)$. Since $\mathcal{L}\{\sin 4t\}=4/(s^2+16)$, we divide $8$ by $4$ and get $y(t)=2\sin 4t$.'
          - problem: 'A drug is eliminated from the blood at rate $3y$, and a dose adds a sudden amount $6$ at $t=2$ hours, so $y''+3y=6\,\delta(t-2)$ with $y(0)=0$. Find $y(3)$.'
            answer: '6e^(-3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Transforming gives $(s+3)Y=6e^{-2s}$, so $y(t)=6\,u_2(t)\,e^{-3(t-2)}$. At $t=3$ this is $6e^{-3}$.'
          - problem: 'The system $y''+2y=3\,\delta(t-1)$ has $y(0)=0$. Find $y(t)$ for $t>1$.'
            answer: '3e^(-2(t-1))'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Transforming gives $(s+2)Y=3e^{-s}$, so $Y=3e^{-s}/(s+2)$. The shift by $1$ gives $y(t)=3e^{-2(t-1)}$ for $t>1$.'
          - problem: 'The system $y''''+7y''+10y=\delta(t)$ has $y(0)=y''(0)=0$. Find $y(t)$.'
            answer: 'e^(-2t)/3 - e^(-5t)/3'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Transforming gives $(s^2+7s+10)Y=1$, so $Y=\frac{1}{(s+2)(s+5)}=\frac13\left(\frac1{s+2}-\frac1{s+5}\right)$. Inverting gives $e^{-2t}/3-e^{-5t}/3$.'
        constraints: 'a single impulse at t = 0, a positive integer, or pi, with an amplitude; first- or second-order equations with distinct real roots or +-ni; the answer is a value at a time or a formula for t after the impulse'
      - id: kp3
        name: Impulse response and the transfer function
        key_prerequisites: [laplace-ivp, laplace-convolution]
        step_check:
          step: 'Take the Laplace transform of the differential equation with $f(t) = \delta(t)$'
          question: 'Why does the right-hand side become $1$ after the transform?'
          options:
            - 'The initial conditions are zero, which leaves the number $1$'
            - 'By the sifting property $\mathcal{L}\{\delta(t)\}=e^{0}=1$'
            - 'Every function $f(t)$ has the transform $1$ when taken at rest'
            - 'The delta function equals $1$ at every time $t$ in the interval'
          answer: 'By the sifting property $\mathcal{L}\{\delta(t)\}=e^{0}=1$'
          why: 'The sifting property gives $\int_0^\infty e^{-st}\delta(t)\,dt=e^{0}=1$, so $Y(s)$ is the transfer function itself.'
        exemplars:
          - problem: 'Find the impulse response $h(t)$ of the system $y''''+5y''+6y=f(t)$, that is, the solution for $f=\delta(t)$ from rest.'
            answer: 'e^(-2t) - e^(-3t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'With $f=\delta(t)$ and rest conditions, $(s^2+5s+6)H=1$. Partial fractions give $H=\frac1{s+2}-\frac1{s+3}$, which inverts to $e^{-2t}-e^{-3t}$.'
          - problem: 'Find the transfer function $H(s)=Y(s)/F(s)$ of the system $y''''+6y''+8y=f(t)$ starting from rest.'
            answer: '1/(s^2+6s+8)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'With rest initial conditions the transform is $(s^2+6s+8)Y=F$. Dividing by $F$ gives $H(s)=1/(s^2+6s+8)$.'
          - problem: 'The system $y''''+3y''+2y=f(t)$ has the impulse response $h(t)=e^{-t}-e^{-2t}$. Use convolution to find the solution from rest when $f(t)=1$.'
            answer: '1/2 - e^(-t) + e^(-2t)/2'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The rest solution is $y=h*1=\int_0^t\left(e^{-\tau}-e^{-2\tau}\right)d\tau$. This equals $(1-e^{-t})-\frac12(1-e^{-2t})=\frac12-e^{-t}+\frac12e^{-2t}$.'
          - problem: 'Find the impulse response $h(t)$ of the system $y''''+9y=f(t)$ from rest.'
            answer: 'sin(3t)/3'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'With $f=\delta(t)$ and rest conditions, $(s^2+9)H=1$, so $H=1/(s^2+9)$. The table inverts this to $h(t)=\sin(3t)/3$.'
          - problem: 'The system $y''''+10y''+21y=f(t)$ has the transfer function $H(s)=\dfrac{1}{s^2+10s+21}$. Find $H(0)$.'
            answer: '1/21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Setting $s=0$ gives the denominator $0+0+21=21$. So $H(0)=1/21$.'
          - problem: 'The system $y''''+7y''+10y=f(t)$ has the impulse response $h(t)=\frac13\left(e^{-2t}-e^{-5t}\right)$. Use convolution to find the solution from rest when $f(t)=e^{3t}$.'
            answer: 'e^(3t)/40 - e^(-2t)/15 + e^(-5t)/24'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The solution is $\int_0^t h(t-\tau)\,e^{3\tau}\,d\tau$. Integrating the two exponential terms separately gives $\frac{e^{3t}-e^{-2t}}{15}-\frac{e^{3t}-e^{-5t}}{24}=\frac{e^{3t}}{40}-\frac{e^{-2t}}{15}+\frac{e^{-5t}}{24}$.'
          - problem: 'A mass on a spring at rest satisfies $y''''+9y=f(t)$. A hammer blow gives the force $f(t)=6\,\delta(t)$. Find the displacement at $t=\pi/6$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The response to $\delta(t)$ is $h(t)=\sin(3t)/3$, so the response to $6\,\delta(t)$ is $2\sin 3t$. At $t=\pi/6$ this is $2\sin(\pi/2)=2$.'
          - problem: 'A shock absorber at rest satisfies $y''''+4y''+3y=f(t)$. A bump gives the force $f(t)=4\,\delta(t)$. Find the displacement $y(1)$.'
            answer: '2(e^(-1) - e^(-3))'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The impulse response is $h(t)=\frac12\left(e^{-t}-e^{-3t}\right)$. The response to $4\,\delta(t)$ is $4h(t)=2\left(e^{-t}-e^{-3t}\right)$, so $y(1)=2\left(e^{-1}-e^{-3}\right)$.'
          - problem: 'Sam says the impulse response of $y''''+4y''+3y=f(t)$ is $h(t)=e^{-t}+e^{-3t}$. What is the correct value of $h(1)$?'
            answer: '(e^(-1) - e^(-3))/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The transform is $H=\frac{1}{(s+1)(s+3)}=\frac12\left(\frac1{s+1}-\frac1{s+3}\right)$, so the terms have a minus sign and the factor $\frac12$. Hence $h(1)=\frac12\left(e^{-1}-e^{-3}\right)$.'
