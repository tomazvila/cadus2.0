      - id: kp1
        name: Second-order IVPs with real roots
        key_prerequisites: [laplace-first-order-ivp, inverse-laplace-partial-fractions]
        step_check:
          step: 'Factor the denominator: $s^2 - 4s + 3 = (s - 1)(s - 3)$'
          question: 'Why do we factor the denominator $s^2 - 4s + 3$ at this step?'
          options:
            - 'Factoring is needed to cancel the numerator $2s - 9$ against the denominator'
            - 'The factors $s - 1$ and $s - 3$ give partial fractions that match the table'
            - 'The factors show which initial conditions $y(0)$ and $y''(0)$ are allowed here'
          answer: 'The factors $s - 1$ and $s - 3$ give partial fractions that match the table'
          why: 'The table inverts $\frac{1}{s-a}$. The factors $(s-1)(s-3)$ let us write $Y(s) = \frac{A}{s-1} + \frac{B}{s-3}$, and each term inverts at once.'
        exemplars:
          - problem: 'Solve $y'''' - y'' - 2y = 0$, $y(0) = 1$, $y''(0) = 0$ using the Laplace transform.'
            answer: 'e^(2t)/3 + 2e^(-t)/3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} - s - 2)Y = s - 1$, so $Y(s) = \frac{1 - s}{- s^{2} + s + 2}$. Partial fractions give $Y(s) = \frac{2}{3 \left(s + 1\right)} + \frac{1}{3 \left(s - 2\right)}$. Inverting term by term gives e^(2t)/3 + 2e^(-t)/3.'
          - problem: 'Solve $y'''' - 3y'' + 2y = 0$, $y(0) = 0$, $y''(0) = 1$ using the Laplace transform.'
            answer: 'e^(2t) - e^t'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} - 3 s + 2)Y = 1$, so $Y(s) = \frac{1}{s^{2} - 3 s + 2}$. Partial fractions give $Y(s) = - \frac{1}{s - 1} + \frac{1}{s - 2}$. Inverting term by term gives e^(2t) - e^t.'
          - problem: 'Solve $y'''' - 5y'' + 6y = 0$, $y(0) = 1$, $y''(0) = 0$ using the Laplace transform.'
            answer: '3e^(2t) - 2e^(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} - 5 s + 6)Y = s - 5$, so $Y(s) = \frac{s - 5}{s^{2} - 5 s + 6}$. Partial fractions give $Y(s) = \frac{3}{s - 2} - \frac{2}{s - 3}$. Inverting term by term gives 3e^(2t) - 2e^(3t).'
          - problem: 'Solve $y'''' + y'' - 6y = 0$, $y(0) = 0$, $y''(0) = 5$ using the Laplace transform.'
            answer: 'e^(2t) - e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + s - 6)Y = 5$, so $Y(s) = \frac{5}{s^{2} + s - 6}$. Partial fractions give $Y(s) = - \frac{1}{s + 3} + \frac{1}{s - 2}$. Inverting term by term gives e^(2t) - e^(-3t).'
          - problem: 'Solve $y'''' - 4y = 0$, $y(0) = 2$, $y''(0) = 4$ using the Laplace transform.'
            answer: '2e^(2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} - 4)Y = 2 s + 4$, so $Y(s) = \frac{2 s + 4}{s^2 - 4} = \frac{2}{s - 2}$ after cancelling the factor $s + 2$. This is already a table entry, so no partial fractions are needed. Inverting term by term gives 2e^(2t).'
          - problem: 'Solve $y'''' - 2y'' - 3y = 0$, $y(0) = 1$, $y''(0) = 1$ using the Laplace transform.'
            answer: 'e^(3t)/2 + e^(-t)/2'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} - 2 s - 3)Y = s - 1$, so $Y(s) = \frac{1 - s}{- s^{2} + 2 s + 3}$. Partial fractions give $Y(s) = \frac{1}{2 \left(s + 1\right)} + \frac{1}{2 \left(s - 3\right)}$. Inverting term by term gives e^(3t)/2 + e^(-t)/2.'
          - problem: 'A $1$ kg mass on a spring with stiffness $12$ N/m moves in a thick fluid with damping coefficient $7$ N$\cdot$s/m. It is released from rest at $y(0) = 1$ m, so $y'''' + 7y'' + 12y = 0$. Use the Laplace transform to find the position $y(t)$.'
            answer: '4e^(-3t) - 3e^(-4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} + 7 s + 12)Y = s + 7$, so $Y(s) = \frac{s + 7}{s^{2} + 7 s + 12}$. Partial fractions give $Y(s) = - \frac{3}{s + 4} + \frac{4}{s + 3}$. Inverting term by term gives 4e^(-3t) - 3e^(-4t).'
          - problem: 'A $2$ kg mass on a spring with stiffness $12$ N/m moves in a fluid with damping coefficient $10$ N$\cdot$s/m. At $t = 0$ it is at $y = 0$ with velocity $2$ m/s. Use the Laplace transform to find the position $y(t)$.'
            answer: '2e^(-2t) - 2e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(2 s^{2} + 10 s + 12)Y = 4$, so $Y(s) = \frac{2}{s^{2} + 5 s + 6}$. Partial fractions give $Y(s) = - \frac{2}{s + 3} + \frac{2}{s + 2}$. Inverting term by term gives 2e^(-2t) - 2e^(-3t). Newton''s law for the mass gives $2y'''' + 10y'' + 12y = 0$ with $y(0) = 0$ and $y''(0) = 2$.'
          - problem: 'Ravi solves $y'''' - 3y'' - 4y = 0$, $y(0) = 2$, $y''(0) = 1$. He transforms the equation as $(s^2 - 3s - 4)Y = 2s + 1$. What is the correct solution $y(t)$?'
            answer: '3e^(4t)/5 + 7e^(-t)/5'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s^{2} - 3 s - 4)Y = 2 s - 5$, so $Y(s) = \frac{5 - 2 s}{- s^{2} + 3 s + 4}$. Partial fractions give $Y(s) = \frac{7}{5 \left(s + 1\right)} + \frac{3}{5 \left(s - 4\right)}$. Inverting term by term gives 3e^(4t)/5 + 7e^(-t)/5. Ravi left out the term $3y(0)$ from $-3(sY - y(0))$; the right side is $2s + 1 - 6 = 2s - 5$.'
        constraints: "characteristic roots distinct integers; homogeneous; verify y(0), y'(0) at the end"
      - id: kp2
        name: Second-order IVPs with complex roots
        key_prerequisites: [laplace-first-order-ivp]
        step_check:
          step: 'Split the numerator to match the shift theorem'
          question: 'Why is the numerator $2s + 5$ split into $2(s + 2)$ plus $1$?'
          options:
