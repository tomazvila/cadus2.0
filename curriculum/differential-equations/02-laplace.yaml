          - problem: 'A $1$ kg mass on a spring of stiffness $17$ N/m has damping coefficient $2$ N$\cdot$s/m, so $y'''' + 2y'' + 17y = 0$. It starts at $y(0) = 0$ with velocity $4$ m/s. Use the Laplace transform to find $y(t)$.'
