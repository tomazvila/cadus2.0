        name: Distinct linear factors
        key_prerequisites: [inverse-laplace-table, partial-fractions-integration]
        exemplars:
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{1}{s(s + 1)}\right\}$.'
            answer: '$1 - e^{-t}$'
            solution_sketch: '$\frac{1}{s(s+1)} = \frac{1}{s} - \frac{1}{s+1}$; invert term by term.'
          - problem: "Compute the inverse Laplace transform of (s + 3)/((s - 1)(s + 2)) as a function of t."
            answer: "4e^t/3 - e^(-2t)/3"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Write F(s) = (s + 3)/((s - 1)(s + 2)). Split it as A/(s - 1) + B/(s + 2) by partial fractions. Cover-up at s = 1 gives A = 4/3; at s = -2 gives B = -1/3. Invert each term with the table rule for 1/(s - a). The inverse transform is 4e^t/3 - e^(-2t)/3."
          - problem: "Compute the inverse Laplace transform of 2/((s - 2)(s + 2)) as a function of t."
            answer: "e^(2t)/2 - e^(-2t)/2"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Write F(s) = 2/((s - 2)(s + 2)). Split it as A/(s - 2) + B/(s + 2). Cover-up gives A = 1/2 at s = 2 and B = -1/2 at s = -2. Invert each term with the table rule for 1/(s - a). The inverse transform is e^(2t)/2 - e^(-2t)/2."
          - problem: "Compute the inverse Laplace transform of (s + 5)/((s + 1)(s + 2)) as a function of t."
            answer: "4e^(-t) - 3e^(-2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Write F(s) = (s + 5)/((s + 1)(s + 2)). Split it as A/(s + 1) + B/(s + 2). Cover-up at s = -1 gives A = 4; at s = -2 gives B = -3. Invert each term with the table rule for 1/(s - a). The inverse transform is 4e^(-t) - 3e^(-2t)."
          - problem: "Compute the inverse Laplace transform of 1/((s - 3)(s + 1)) as a function of t."
            answer: "e^(3t)/4 - e^(-t)/4"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Write F(s) = 1/((s - 3)(s + 1)). Split it as A/(s - 3) + B/(s + 1). Cover-up at s = 3 gives A = 1/4; at s = -1 gives B = -1/4. Invert each term with the table rule for 1/(s - a). The inverse transform is e^(3t)/4 - e^(-t)/4."
          - problem: "Compute the inverse Laplace transform of (2s + 1)/((s - 2)(s + 2)) as a function of t."
            answer: "5e^(2t)/4 + 3e^(-2t)/4"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Write F(s) = (2s + 1)/((s - 2)(s + 2)). Split it as A/(s - 2) + B/(s + 2). Cover-up at s = 2 gives A = 5/4; at s = -2 gives B = 3/4. Invert each term with the table rule for 1/(s - a). The inverse transform is 5e^(2t)/4 + 3e^(-2t)/4."
        constraints: "denominators factor over the integers into 2 distinct linear factors; coefficients clean fractions"
      - id: kp2
        name: Completing the square and repeated factors
        key_prerequisites: [laplace-transform-basics, partial-fractions-integration]
        exemplars:
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{s + 1}{s^2 + 2s + 5}\right\}$.'
            answer: '$e^{-t}\cos 2t$'
            solution_sketch: 'The numerator is exactly the shifted $s$: $\frac{s+1}{(s+1)^2 + 4}$.'
          - problem: "The transform is $\\mathcal{L}^{-1}\\left\\{\\dfrac{3}{s^2 + 2s + 10}\\right\\}$. Find the inverse transform as a function of t."
            answer: "e^(-t) sin(3t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Full object: 3/(s^2 + 2s + 10). First complete the square: s^2 + 2s + 10 = (s+1)^2 + 9. The numerator 3 matches the table entry 3/((s+1)^2 + 9), so the first shifting theorem gives e^(-t) sin(3t). The inverse transform is e^(-t) sin(3t)."
          - problem: "The transform is $\\mathcal{L}^{-1}\\left\\{\\dfrac{1}{(s + 5)^2}\\right\\}$. Find the inverse transform as a function of t."
            answer: "t e^(-5t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Full object: 1/(s+5)^2. The table entry 1/s^2 gives t, and the first shifting theorem with s -> s+5 gives a factor e^(-5t). Multiply to get t e^(-5t). The inverse transform is t e^(-5t)."
          - problem: "The transform is $\\mathcal{L}^{-1}\\left\\{\\dfrac{s + 4}{s^2 + 8s + 20}\\right\\}$. Find the inverse transform as a function of t."
            answer: "e^(-4t) cos(2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Full object: (s+4)/(s^2 + 8s + 20). Complete the square: s^2 + 8s + 20 = (s+4)^2 + 4. The numerator s+4 is the shifted s, so the table entry s/(s^2 + 4) together with the first shifting theorem gives e^(-4t) cos(2t). The inverse transform is e^(-4t) cos(2t)."
          - problem: "The transform is $\\mathcal{L}^{-1}\\left\\{\\dfrac{2}{s^2 + 6s + 10}\\right\\}$. Find the inverse transform as a function of t."
            answer: "2e^(-3t) sin(t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Full object: 2/(s^2 + 6s + 10). Complete the square: s^2 + 6s + 10 = (s+3)^2 + 1. Rewrite as 2 times 1/((s+3)^2 + 1); the table entry 1/(s^2+1) and the first shifting theorem give 2e^(-3t) sin(t). The inverse transform is 2e^(-3t) sin(t)."
          - problem: "The transform is $\\mathcal{L}^{-1}\\left\\{\\dfrac{3s + 10}{(s + 2)^2}\\right\\}$. Find the inverse transform as a function of t."
            answer: "3e^(-2t) + 4t e^(-2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Full object: (3s+10)/(s+2)^2. Partial fractions: (3s+10)/(s+2)^2 = 3/(s+2) + 4/(s+2)^2. The table entries 1/(s+2) and 1/(s+2)^2 give 3e^(-2t) and 4t e^(-2t). Add them. The inverse transform is 3e^(-2t) + 4t e^(-2t)."
        constraints: "irreducible quadratics complete to (s+a)^2 + b^2 with integer a, b; repeated linear factors to power 2 only"
    diagnostic_exemplar:
      problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{s + 5}{s^2 + 4s + 13}\right\}$.'
      answer: '$e^{-2t}\cos 3t + e^{-2t}\sin 3t$'
      solution_sketch: '$s^2 + 4s + 13 = (s+2)^2 + 9$ and $s + 5 = (s + 2) + 3$, so the transform splits as $\frac{s+2}{(s+2)^2+9} + \frac{3}{(s+2)^2+9}$.'
    anki_seeds:
      - front: 'Inverse transform of $\dfrac{1}{(s-a)^2}$?'
        back: '$te^{at}$'
        type: basic
      - front: 'To invert $\dfrac{1}{s^2 + 2as + c}$ with an irreducible denominator, first...'
        back: 'complete the square to $(s+a)^2 + b^2$, then match the shifted sine/cosine entries.'
        type: basic

  - id: laplace-of-derivatives
    name: Transforms of Derivatives
    core: true
    difficulty: 0.74
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: laplace-transform-basics
        weight: 0.6
        key: true
      - id: laplace-table-linearity
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: The derivative formulas
        key_prerequisites: [laplace-transform-basics]
        exemplars:
          - problem: "Let $Y(s) = \\mathcal{L}\\{y\\}$, with $y(0)=4$ and $Y(s)=\\frac{1}{s+3}$. Find $\\mathcal{L}\\{y'\\}$ as a function of $s$."
            answer: "s/(s+3)-4"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "By the first-derivative formula, $\\mathcal{L}\\{y'\\}=sY(s)-y(0)$. Substitute $Y(s)=1/(s+3)$ and $y(0)=4$: $s\\cdot 1/(s+3)-4$. The result is s/(s+3)-4."
          - problem: 'Express $\mathcal{L}\{y''''\}$ in terms of $Y(s) = \mathcal{L}\{y\}$, writing $y(0) = a$ and $y''(0) = b$.'
            answer: '$s^2 Y(s) - s a - b$'
          - problem: 'Given $y(0) = 2$ and $y''(0) = -1$, write $\mathcal{L}\{y''''\}$ in terms of $Y(s)$.'
            answer: '$s^2 Y(s) - 2s + 1$'
            solution_sketch: 'Substitute into $s^2Y - s\,y(0) - y''(0) = s^2Y - 2s - (-1)$.'
          - problem: "Let $Y(s) = \\mathcal{L}\\{y\\}$, with $y(0)=2$, $y'(0)=-1$, and $Y(s)=\\frac{1}{s+1}$. Find $\\mathcal{L}\\{y''\\}$ as a function of $s$."
            answer: "s^2/(s+1)-2s+1"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "By the second-derivative formula, $\\mathcal{L}\\{y''\\}=s^2Y(s)-s\\,y(0)-y'(0)$. Substitute $Y(s)=1/(s+1)$, $y(0)=2$, and $y'(0)=-1$: $s^2/(s+1)-2s-(-1)$. The result is s^2/(s+1)-2s+1."
          - problem: "Let $Y(s) = \\mathcal{L}\\{y\\}$, with $y(0)=5$ and $Y(s)=\\frac{1}{s-2}$. Find $\\mathcal{L}\\{y'\\}$ as a function of $s$."
            answer: "s/(s-2)-5"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "By the first-derivative formula, $\\mathcal{L}\\{y'\\}=sY(s)-y(0)$. Substitute $Y(s)=1/(s-2)$ and $y(0)=5$: $s/(s-2)-5$. The result is s/(s-2)-5."
          - problem: "Let $Y(s) = \\mathcal{L}\\{y\\}$, with $y(0)=3$, $y'(0)=7$, and $Y(s)=\\frac{1}{s+4}$. Find $\\mathcal{L}\\{y''\\}$ as a function of $s$."
            answer: "s^2/(s+4)-3s-7"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "By the second-derivative formula, $\\mathcal{L}\\{y''\\}=s^2Y(s)-s\\,y(0)-y'(0)$. Substitute $Y(s)=1/(s+4)$, $y(0)=3$, and $y'(0)=7$: $s^2/(s+4)-3s-7$. The result is s^2/(s+4)-3s-7."
        constraints: "first and second derivatives only; initial conditions given at t = 0"
      - id: kp2
        name: From ODE to algebra
        key_prerequisites: [laplace-transform-basics]
        exemplars:
          - problem: 'Transform the IVP $y'' + 2y = 0$, $y(0) = 3$, and solve for $Y(s)$.'
            answer: '$3/(s + 2)$'
            solution_sketch: '$\mathcal{L}\{y''\} = sY - y(0)$, so $sY - 3 + 2Y = 0$; isolate $Y$ to get $3/(s+2)$.'
          - problem: 'Transform $y'''' + 4y = 0$, $y(0) = 1$, $y''(0) = 0$, and solve for $Y(s)$.'
            answer: '$s/(s^2 + 4)$'
            solution_sketch: '$(s^2 + 4)Y = s\,y(0) + y''(0) = s$.'
          - problem: 'Transform $y'' - 5y = e^{2t}$, $y(0) = 0$, and solve for $Y(s)$.'
            answer: '$1/((s - 2)(s - 5))$'
            solution_sketch: '$(s - 5)Y = \frac{1}{s-2}$; divide. No inversion asked.'
          - problem: "An initial value problem is $y' + 7y = 0$ with $y(0) = 4$. Solve for $Y(s)$ as a function of $s$."
            answer: "4/(s+7)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Use the derivative transform rule $\\mathcal{L}\\{y'\\} = sY(s) - y(0)$. The transformed equation is $sY - 4 + 7Y = 0$. Combine like terms to get $(s+7)Y = 4$, so $Y(s) = 4/(s+7)$."
          - problem: "An initial value problem is $y'' + 9y = 0$ with $y(0) = 2$ and $y'(0) = 3$. Solve for $Y(s)$ as a function of $s$."
            answer: "(2s+3)/(s^2+9)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Apply the second-derivative rule $\\mathcal{L}\\{y''\\} = s^2Y(s) - s y(0) - y'(0)$. With $y(0)=2$ and $y'(0)=3$, the transformed equation is $s^2Y - 2s - 3 + 9Y = 0$. Factor $Y$ to get $(s^2+9)Y = 2s+3$, hence $Y(s) = (2s+3)/(s^2+9)$."
          - problem: "An initial value problem is $y' - 4y = e^{3t}$ with $y(0) = 0$. Solve for $Y(s)$ as a function of $s$."
            answer: "1/((s-3)(s-4))"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Use the derivative rule $\\mathcal{L}\\{y'\\} = sY(s) - y(0)$ and the table entry $\\mathcal{L}\\{e^{3t}\\} = 1/(s-3)$. Substitution gives $sY - 0 - 4Y = 1/(s-3)$, so $(s-4)Y = 1/(s-3)$. Divide to obtain $Y(s) = 1/((s-3)(s-4))$."
        constraints: "solve for Y(s) only, no inversion; forcing 0 or e^{at}; initial conditions integers"
    diagnostic_exemplar:
      problem: 'Transform the initial value problem $y'''' + 4y'' + 3y = 0$, $y(0) = 2$, $y''(0) = -1$, and solve for $Y(s)$.'
      answer: '$(2s + 7)/(s^2 + 4s + 3)$'
      solution_sketch: '$\mathcal{L}\{y''''\} = s^2Y - 2s + 1$ and $\mathcal{L}\{y''\} = sY - 2$, so $(s^2 + 4s + 3)Y = 2s - 1 + 8 = 2s + 7$.'
    anki_seeds:
      - front: 'Laplace transform of $y''$ in terms of $Y(s)$?'
        back: '$sY(s) - y(0)$'
        type: basic
      - front: 'Laplace transform of $y''''$ in terms of $Y(s)$?'
        back: '$s^2 Y(s) - s\,y(0) - y''(0)$'
        type: basic

  - id: laplace-first-order-ivp
    name: First-Order IVPs via Laplace
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: laplace-of-derivatives
        weight: 0.6
        key: true
      - id: inverse-laplace-partial-fractions
        weight: 0.5
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: Homogeneous first-order IVPs
        key_prerequisites: [laplace-of-derivatives]
        exemplars:
          - problem: 'Solve $y'' + 3y = 0$, $y(0) = 2$ using the Laplace transform.'
            answer: '$y = 2e^{-3t}$'
            solution_sketch: '$(s + 3)Y = 2$ gives $Y = \frac{2}{s+3}$; invert.'
          - problem: 'Solve $y'' - 4y = 0$, $y(0) = -1$ using the Laplace transform.'
            answer: '$y = -e^{4t}$'
            solution_sketch: '$(s - 4)Y = -1$ gives $Y = \frac{-1}{s-4}$; invert.'
          - problem: "Find y(t) by applying the Laplace transform to y' + 5y = 0 with y(0) = 3."
            answer: "3e^(-5t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Use the Laplace transform of a derivative: sY minus 3 plus 5Y equals 0. Solve the algebra: (s + 5)Y = 3, so Y = 3/(s + 5). Invert with the inverse Laplace transform: the solution is y = 3e^(-5t)."
          - problem: "Find y(t) by applying the Laplace transform to y' - 2y = 0 with y(0) = 5."
            answer: "5e^(2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Use the Laplace transform of a derivative: sY minus 5 minus 2Y equals 0. Solve the algebra: (s - 2)Y = 5, so Y = 5/(s - 2). Invert with the inverse Laplace transform: the solution is y = 5e^(2t)."
          - problem: "Find y(t) by applying the Laplace transform to y' + 7y = 0 with y(0) = -2."
            answer: "-2e^(-7t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Use the Laplace transform of a derivative: sY plus 2 plus 7Y equals 0. Solve the algebra: (s + 7)Y = -2, so Y = -2/(s + 7). Invert with the inverse Laplace transform: the solution is y = -2e^(-7t)."
          - problem: "Find y(t) by applying the Laplace transform to y' - 6y = 0 with y(0) = 2."
            answer: "2e^(6t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Use the Laplace transform of a derivative: sY minus 2 minus 6Y equals 0. Solve the algebra: (s - 6)Y = 2, so Y = 2/(s - 6). Invert with the inverse Laplace transform: the solution is y = 2e^(6t)."
        constraints: "y' + ay = 0 with integer a; integer initial values"
      - id: kp2
        name: First-order IVPs with forcing
        key_prerequisites: [laplace-of-derivatives, inverse-laplace-partial-fractions]
        exemplars:
          - problem: 'Solve $y'' - y = e^{2t}$, $y(0) = 0$ using the Laplace transform.'
            answer: '$y = e^{2t} - e^{t}$'
            solution_sketch: '$(s-1)Y = \frac{1}{s-2}$, so $Y = \frac{1}{(s-1)(s-2)} = \frac{-1}{s-1} + \frac{1}{s-2}$; invert.'
          - problem: 'Solve $y'' + 2y = 4$, $y(0) = 1$ using the Laplace transform.'
            answer: '$y = 2 - e^{-2t}$'
            solution_sketch: '$(s+2)Y = 1 + \frac{4}{s}$, so $Y = \frac{s+4}{s(s+2)} = \frac{2}{s} - \frac{1}{s+2}$; invert.'
          - problem: "Consider the IVP y' + y = e^(-t), y(0) = 1 and use the Laplace transform. Find y(t)."
            answer: "e^(-t) + t e^(-t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Take the Laplace transform: (s+1)Y - 1 = 1/(s+1). Solve for Y: Y = (s+2)/(s+1)^2 = 1/(s+1) + 1/(s+1)^2. Invert using the shift rule. The solution is y = e^(-t) + t e^(-t)."
          - problem: "Consider the IVP y' + 3y = 6, y(0) = 0 and use the Laplace transform. Find y(t)."
            answer: "2 - 2e^(-3t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Take the Laplace transform: (s+3)Y = 6/s. Solve for Y: Y = 6/[s(s+3)] = 2/s - 2/(s+3). Invert using the table. The solution is y = 2 - 2e^(-3t)."
          - problem: "Consider the IVP y' - 2y = e^(3t), y(0) = 2 and use the Laplace transform. Find y(t)."
            answer: "e^(2t) + e^(3t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Take the Laplace transform: (s-2)Y - 2 = 1/(s-3). Solve for Y: Y = (2s-5)/[(s-2)(s-3)] = 1/(s-2) + 1/(s-3). Invert using the table. The solution is y = e^(2t) + e^(3t)."
          - problem: "Consider the IVP y' - 4y = 8, y(0) = 1 and use the Laplace transform. Find y(t)."
            answer: "-2 + 3e^(4t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Take the Laplace transform: (s-4)Y - 1 = 8/s. Solve for Y: Y = (s+8)/[s(s-4)] = -2/s + 3/(s-4). Invert using the table. The solution is y = -2 + 3e^(4t)."
        constraints: "forcing constant or e^{at}; partial fractions with two distinct linear factors at most; a repeated factor only via the shift"
    diagnostic_exemplar:
      problem: 'Solve $y'' + 2y = 6$, $y(0) = 4$, using the Laplace transform.'
      answer: '$y = 3 + e^{-2t}$'
      solution_sketch: '$(s+2)Y = 4 + \frac{6}{s}$, so $Y = \frac{4s + 6}{s(s+2)} = \frac{3}{s} + \frac{1}{s+2}$.'
    anki_seeds:
      - front: 'The three steps of the Laplace method for an IVP?'
        back: 'Transform the ODE (initial conditions enter immediately), solve algebraically for $Y(s)$, invert.'
        type: basic
      - front: "Why transform a first-order IVP instead of using an integrating factor?"
        back: "Laplace turns the ODE plus its initial condition into one algebraic equation in $Y(s)$ — no arbitrary constant to fit afterwards."
        type: basic

  - id: laplace-ivp
    name: Solving Second-Order IVPs with Laplace
    core: true
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: laplace-first-order-ivp
        weight: 0.6
        key: true
      - id: inverse-laplace-partial-fractions
        weight: 0.5
        key: true
      - id: homogeneous-constant-coefficients
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Second-order IVPs with real roots
        key_prerequisites: [laplace-first-order-ivp, inverse-laplace-partial-fractions]
        exemplars:
          - problem: "Use the Laplace transform to solve the homogeneous initial value problem y'' - y' - 2y = 0 with y(0) = 1 and y'(0) = 0. Find y as a function of t."
            answer: "e^(2t)/3 + 2e^(-t)/3"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Laplace transform: L[y''] = s^2Y - s and L[y'] = sY - 1, so the equation gives (s^2 - s - 2)Y = s - 1. Partial fractions: Y = (1/3)/(s-2) + (2/3)/(s+1). Invert each term with the rule L[e^(at)] = 1/(s-a). The solution is y = e^(2t)/3 + 2e^(-t)/3, and it satisfies y(0) = 1 and y'(0) = 0."
          - problem: 'Solve $y'''' - 3y'' + 2y = 0$, $y(0) = 0$, $y''(0) = 1$ using the Laplace transform.'
            answer: '$y = e^{2t} - e^{t}$'
            solution_sketch: '$(s^2 - 3s + 2)Y = 1$, so $Y = \frac{1}{(s-1)(s-2)} = \frac{1}{s-2} - \frac{1}{s-1}$; invert.'
          - problem: "Solve the initial value problem y'' - 5y' + 6y = 0 with y(0) = 1 and y'(0) = 0 by the Laplace transform. Find y as a function of t."
            answer: "3e^(2t) - 2e^(3t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Laplace transform: L[y''] = s^2Y - s and L[y'] = sY - 1, so (s^2 - 5s + 6)Y = s - 5. Partial fractions: Y = 3/(s-2) - 2/(s-3). Invert using L[e^(at)] = 1/(s-a). The solution is y = 3e^(2t) - 2e^(3t), and it satisfies y(0) = 1 and y'(0) = 0."
          - problem: "Solve y'' + y' - 6y = 0 with y(0) = 0 and y'(0) = 5 using the Laplace transform. Find y as a function of t."
            answer: "e^(2t) - e^(-3t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Laplace transform: L[y''] = s^2Y - 5 and L[y'] = sY, so (s^2 + s - 6)Y = 5. Partial fractions: Y = 1/(s-2) - 1/(s+3). Invert using L[e^(at)] = 1/(s-a). The solution is y = e^(2t) - e^(-3t), and it satisfies y(0) = 0 and y'(0) = 5."
          - problem: "Solve y'' - 4y = 0 with y(0) = 2 and y'(0) = 4 using the Laplace transform. Find y as a function of t."
            answer: "2e^(2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Laplace transform: L[y''] = s^2Y - 2s - 4, so (s^2 - 4)Y = 2s + 4. Partial fractions: Y = 2/(s-2) + 0/(s+2). Invert using L[e^(at)] = 1/(s-a). The solution is y = 2e^(2t), and it satisfies y(0) = 2 and y'(0) = 4."
          - problem: "Solve y'' - 2y' - 3y = 0 with y(0) = 1 and y'(0) = 1 using the Laplace transform. Find y as a function of t."
            answer: "e^(3t)/2 + e^(-t)/2"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Laplace transform: L[y''] = s^2Y - s - 1 and L[y'] = sY - 1, so (s^2 - 2s - 3)Y = s - 1. Partial fractions: Y = (1/2)/(s-3) + (1/2)/(s+1). Invert using L[e^(at)] = 1/(s-a). The solution is y = e^(3t)/2 + e^(-t)/2, and it satisfies y(0) = 1 and y'(0) = 1."
        constraints: "characteristic roots distinct integers; homogeneous; verify y(0), y'(0) at the end"
      - id: kp2
        name: Second-order IVPs with complex roots
        key_prerequisites: [laplace-first-order-ivp]
        exemplars:
          - problem: 'Solve $y'''' + y = 0$, $y(0) = 0$, $y''(0) = 1$ using the Laplace transform.'
            answer: '$y = \sin t$'
            solution_sketch: '$(s^2 + 1)Y = 1$ gives $Y = \frac{1}{s^2+1}$; invert.'
          - problem: 'Solve $y'''' + 2y'' + 5y = 0$, $y(0) = 1$, $y''(0) = -1$ using the Laplace transform.'
            answer: '$y = e^{-t}\cos 2t$'
            solution_sketch: '$(s^2 + 2s + 5)Y = s + 1$, so $Y = \frac{s+1}{(s+1)^2 + 4}$; invert with the shift.'
        constraints: "roots +/- bi or -a +/- bi with integer a, b; the completed square appears after transforming"
      - id: kp3
        name: Constant forcing
        key_prerequisites: [laplace-first-order-ivp, inverse-laplace-partial-fractions]
        exemplars:
          - problem: 'Solve $y'''' + 4y = 8$, $y(0) = 0$, $y''(0) = 0$ using the Laplace transform.'
            answer: '$y = 2 - 2\cos 2t$'
            solution_sketch: '$(s^2+4)Y = \frac{8}{s}$, so $Y = \frac{8}{s(s^2+4)} = \frac{2}{s} - \frac{2s}{s^2+4}$; invert.'
          - problem: 'Solve $y'''' + 3y'' + 2y = 6$, $y(0) = 0$, $y''(0) = 0$ using the Laplace transform.'
            answer: '$y = 3 - 6e^{-t} + 3e^{-2t}$'
            solution_sketch: '$Y = \frac{6}{s(s+1)(s+2)}$; cover-up gives $\frac{3}{s} - \frac{6}{s+1} + \frac{3}{s+2}$.'
          - problem: "Use the Laplace transform to solve y'' + 4y = 12 with y(0) = 0 and y'(0) = 0. Find y(t)."
            answer: "3 - 3cos(2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1: Transform the equation. The Laplace transform gives (s^2 + 4)Y = 12/s. Step 2: Solve for Y and split the fraction. Y = 12/(s(s^2+4)) = 3/s - 3s/(s^2+4). Step 3: Invert each term. Thus y(t) = 3 - 3cos(2t)."
          - problem: "Use the Laplace transform to solve y'' + 3y' + 2y = 12 with y(0) = 0 and y'(0) = 0. Find y(t)."
            answer: "6 - 12e^(-t) + 6e^(-2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1: Transform the equation. The Laplace transform gives (s^2 + 3s + 2)Y = 12/s. Step 2: Factor and use partial fractions. Y = 12/(s(s+1)(s+2)) = 6/s - 12/(s+1) + 6/(s+2). Step 3: Invert each term. Thus y(t) = 6 - 12e^(-t) + 6e^(-2t)."
          - problem: "Use the Laplace transform to solve y'' + 4y = 8 with y(0) = 1 and y'(0) = 0. Find y(t)."
            answer: "2 - cos(2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1: Transform the equation. The initial value gives (s^2 + 4)Y - s = 8/s. Step 2: Solve for Y and simplify. Y = (8/s + s)/(s^2+4) = 2/s - s/(s^2+4). Step 3: Invert each term. Thus y(t) = 2 - cos(2t)."
          - problem: "Use the Laplace transform to solve y'' + 3y' + 2y = 6 with y(0) = 0 and y'(0) = 1. Find y(t)."
            answer: "3 - 5e^(-t) + 2e^(-2t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Step 1: Transform the equation. The initial slope gives (s^2 + 3s + 2)Y = 6/s + 1. Step 2: Factor and use partial fractions. Y = 6/(s(s+1)(s+2)) + 1/((s+1)(s+2)) = 3/s - 5/(s+1) + 2/(s+2). Step 3: Invert each term. Thus y(t) = 3 - 5e^(-t) + 2e^(-2t)."
        constraints: "forcing a constant; characteristic roots integer or +/- bi; three-term partial fractions at most"
    diagnostic_exemplar:
      problem: 'Solve $y'''' + 2y'' + 5y = 5$, $y(0) = 0$, $y''(0) = 0$, using the Laplace transform.'
      answer: '$y = 1 - e^{-t}\cos 2t - \tfrac{1}{2}e^{-t}\sin 2t$'
      answer_contract: {kind: none}
      solution_sketch: '$(s^2 + 2s + 5)Y = \frac{5}{s}$, so $Y = \frac{5}{s(s^2+2s+5)} = \frac{1}{s} - \frac{s + 2}{(s+1)^2 + 4}$. Writing $s + 2 = (s+1) + 1$ inverts term by term.'
    anki_seeds:
      - front: "Why does the Laplace method suit IVPs?"
        back: "The initial conditions enter the algebra immediately: no general solution or constant-fitting step."
        type: basic
      - front: 'After transforming $ay'''' + by'' + cy = f(t)$, the denominator of $Y(s)$ is...'
        back: 'the characteristic polynomial $as^2 + bs + c$ (times any denominator from $F(s)$).'
        type: basic

  - id: unit-step-piecewise-forcing
    name: Unit Step Functions and Piecewise Rewriting
    core: false                # Laplace extension; terminal
    difficulty: 0.80
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: laplace-transform-basics
        weight: 0.6
        key: true
      - id: inverse-laplace-table
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Rewriting piecewise functions with unit steps
        key_prerequisites: [laplace-transform-basics]
        exemplars:
          - problem: "A signal is 0 for t < 4 and is 6 for t >= 4. It has the form f(t) = A u(t - c). Give A and c."
            answer: "A = 6; c = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "The full unit-step form is f(t) = 6u(t - 4). Step 1 uses the breakpoint rule: the switch from 0 to 6 occurs at t = 4, so c = 4. Step 2 uses the coefficient rule: the height after the switch is A = 6. The answer is A = 6; c = 4."
          - problem: "A pulse is 7 for 0 <= t < 2 and is 0 for t >= 2. It has the form f(t) = A - A u(t - c). Give A and c."
            answer: "A = 7; c = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "The full unit-step form is f(t) = 7 - 7u(t - 2). Step 1 uses the breakpoint rule: the pulse turns off at t = 2, so c = 2. Step 2 uses the coefficient rule: the starting height is A = 7. The answer is A = 7; c = 2."
          - problem: "The function is 0 for t < 5 and is 3(t - 5) for t >= 5. It has the form f(t) = A(t - c)u(t - c). Find A and c."
            answer: "A = 3; c = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "The full unit-step form is f(t) = 3(t - 5)u(t - 5). Step 1 uses the breakpoint rule: the ramp starts at t = 5, so c = 5. Step 2 uses the coefficient rule: the slope of the ramp is A = 3. The answer is A = 3; c = 5."
          - problem: "A room stays at 18 degrees for t < 3 and stays at 25 degrees for t >= 3. It has the form f(t) = 18 + B u(t - c). Find B and c."
            answer: "B = 7; c = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "B"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "The full unit-step form is f(t) = 18 + 7u(t - 3). Step 1 uses the breakpoint rule: the temperature changes at t = 3, so c = 3. Step 2 uses the jump rule: the jump from 18 to 25 is B = 25 - 18 = 7. The answer is B = 7; c = 3."
          - problem: "A function is 12 for t < 3 and is 4t for t >= 3. It has the form f(t) = 12 + m(t - c)u(t - c). Find m and c."
            answer: "m = 4; c = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "m"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "The full unit-step form is f(t) = 12 + 4(t - 3)u(t - 3). Step 1 uses the match rule: for t >= 3 the form 12 + m(t - 3) must produce 4t, so m = 4. Step 2 uses the breakpoint rule: the pieces meet at t = 3, so c = 3. The answer is m = 4; c = 3."
          - problem: "A function is 5 for t < 2 and is 3 - 2t for t >= 2. It has the form f(t) = 5 + (a t + b)u(t - c). Find a and c."
            answer: "a = -2; c = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: "The full unit-step form is f(t) = 5 + (-2t - 2)u(t - 2). Step 1 uses the match rule: for t >= 2 the form 5 + a t + b must produce 3 - 2t, so a = -2. Step 2 uses the breakpoint rule: the pieces meet at t = 2, so c = 2. The answer is a = -2; c = 2."
        constraints: "at most two pieces with integer breakpoints; pieces constant or linear"
      - id: kp2
        name: The second shifting theorem
        key_prerequisites: [laplace-transform-basics]
        exemplars:
          - problem: "Compute the Laplace transform of the unit step $u_4(t)$. Give the result as a function of $s$."
            answer: "e^(-4s)/s"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "The object is $u_4(t)$, a unit step with $c=4$ and $f(t)=1$. The second shifting theorem gives $\\mathcal{L}\\{u_c(t) f(t-c)\\} = e^{-cs} F(s)$. Here $F(s) = 1/s$, so the transform is e^(-4s)/s."
          - problem: "Compute $\\mathcal{L}\\{(t - 2)u_2(t)\\}$. Give the result as a function of $s$."
            answer: "e^(-2s)/s^2"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "The object is $(t-2)u_2(t)$, which is $f(t-2)u_2(t)$ with $f(t)=t$. The table gives $\\mathcal{L}\\{t\\} = 1/s^2$. The second shifting theorem multiplies it by $e^{-2s}$, so the transform is e^(-2s)/s^2."
          - problem: "Compute $\\mathcal{L}\\{u_{\\pi}(t)(t - \\pi)\\}$. Give the result as a function of $s$."
            answer: "e^(-pi s)/s^2"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "The object is $u_{\\pi}(t)(t-\\pi)$, i.e. $f(t-\\pi)u_{\\pi}(t)$ with $f(t)=t$. Its table transform is $1/s^2$. The second shifting theorem gives $e^{-\\pi s}/s^2$, so the answer is e^(-pi s)/s^2."
          - problem: "Compute $\\mathcal{L}\\{(t - 1)^2 u_1(t)\\}$. Give the result as a function of $s$."
            answer: "2e^(-s)/s^3"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "The object is $(t-1)^2 u_1(t)$, so $f(t-1)=(t-1)^2$ and $f(t)=t^2$. The table gives $\\mathcal{L}\\{t^2\\} = 2/s^3$. The second shifting theorem yields $2e^{-s}/s^3$, which is 2e^(-s)/s^3."
          - problem: "Compute $\\mathcal{L}\\{u_5(t)e^{t-5}\\}$. Give the result as a function of $s$."
            answer: "e^(-5s)/(s-1)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "The object is $u_5(t)e^{t-5}$, so $f(t-5)=e^{t-5}$ and $f(t)=e^t$. The table gives $\\mathcal{L}\\{e^t\\} = 1/(s-1)$. Multiplying by $e^{-5s}$ gives e^(-5s)/(s-1)."
          - problem: "Compute $\\mathcal{L}\\{(t - 3)^3 u_3(t)\\}$. Give the result as a function of $s$."
            answer: "6e^(-3s)/s^4"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "The object is $(t-3)^3 u_3(t)$, so $f(t)=t^3$. The table gives $\\mathcal{L}\\{t^3\\} = 6/s^4$. The second shifting theorem with $c=3$ multiplies by $e^{-3s}$, so the transform is 6e^(-3s)/s^4."
        constraints: "arguments already in the form f(t - c); c a positive integer or pi"
      - id: kp3
        name: Inverting exponentials
        key_prerequisites: [inverse-laplace-table]
        exemplars:
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{e^{-2s}}{s}\right\}$.'
            answer: '$u_2(t)$'
            answer_contract: {kind: none}
            solution_sketch: '$u_2(t)$'
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{e^{-s}}{s + 3}\right\}$.'
            answer: '$u_1(t)\,e^{-3(t-1)}$'
            answer_contract: {kind: none}
            solution_sketch: '$F(s) = \frac{1}{s+3}$ inverts to $e^{-3t}$; the factor $e^{-s}$ delays it: $u_1(t)e^{-3(t-1)}$.'
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{e^{-4s}}{s^2}\right\}$.'
            answer: '$(t - 4)u_4(t)$'
            answer_contract: {kind: none}
            solution_sketch: '$(t - 4)u_4(t)$'
        constraints: "e^{-cs} times a single table entry; write the answer with u_c(t) and argument t - c"
    diagnostic_exemplar:
      problem: 'Let $f(t) = 0$ for $t < 2$ and $f(t) = t$ for $t \ge 2$. Write $f$ using a unit step and compute $\mathcal{L}\{f\}$.'
      answer: '$f(t) = t\,u_2(t)$ and $\mathcal{L}\{f\} = e^{-2s}\left(\dfrac{1}{s^2} + \dfrac{2}{s}\right)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Write $t = (t - 2) + 2$, so $f = \left[(t-2) + 2\right]u_2(t)$; the second shifting theorem then gives $e^{-2s}\mathcal{L}\{t + 2\} = e^{-2s}\left(\frac{1}{s^2} + \frac{2}{s}\right)$.'
    anki_seeds:
      - front: 'Definition of the unit step $u_c(t)$?'
        back: '$u_c(t) = 0$ for $t < c$ and $1$ for $t \ge c$ (a switch that turns on at $t = c$).'
        type: basic
      - front: 'Second shifting theorem?'
        back: '$\mathcal{L}\{u_c(t)f(t - c)\} = e^{-cs}F(s)$: a time delay multiplies the transform by $e^{-cs}$.'
        type: basic

  - id: laplace-convolution
    name: Convolution and the Convolution Theorem
    core: false                # terminal capstone of the Laplace module
    difficulty: 0.82
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: inverse-laplace-partial-fractions
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.3
        key: false
      - id: laplace-ivp
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Computing convolutions
        key_prerequisites: [definite-integrals-ftc]
        exemplars:
          - problem: 'Compute the convolution $(1 * t)(t) = \int_0^t 1\cdot(t - \tau)\,d\tau$.'
            answer: '$\dfrac{t^2}{2}$'
            answer_contract: {kind: none}
            solution_sketch: 'Using $\int_0^t f(\tau)g(t-\tau)\,d\tau$ with $f = 1$, $g(t) = t$: $\int_0^t (t - \tau)\,d\tau = t^2 - \frac{t^2}{2} = \frac{t^2}{2}$.'
          - problem: 'Compute $(t * t)(t) = \int_0^t \tau(t - \tau)\,d\tau$.'
            answer: '$\dfrac{t^3}{6}$'
            answer_contract: {kind: none}
            solution_sketch: '$t\cdot\frac{t^2}{2} - \frac{t^3}{3} = \frac{t^3}{6}$.'
          - problem: 'Compute $(1 * e^{2t})(t) = \int_0^t e^{2\tau}\,d\tau$.'
            answer: '$\dfrac{e^{2t} - 1}{2}$'
            answer_contract: {kind: none}
            solution_sketch: '$\dfrac{e^{2t} - 1}{2}$'
        constraints: "f, g among 1, t, e^{at}, sin bt; the integral must be elementary"
      - id: kp2
        name: The convolution theorem
        key_prerequisites: [inverse-laplace-partial-fractions]
        exemplars:
          - problem: "Let L denote the Laplace transform. Use the convolution theorem to compute L of the convolution of 1 and t. Give the transform as a function of s."
            answer: "1/s^3"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Convolution theorem rule: L of a convolution is the product of the two transforms. Table look-up gives L{1} = 1/s and L{t} = 1/s^2. Multiply them: (1/s)(1/s^2) = 1/s^3. The transform is 1/s^3."
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{1}{s^2(s + 1)}\right\}$ as the convolution $t * e^{-t}$.'
            answer: '$t - 1 + e^{-t}$'
            solution_sketch: '$\int_0^t (t - \tau)e^{-\tau}d\tau = t(1 - e^{-t}) - \left[1 - (t+1)e^{-t}\right] = t - 1 + e^{-t}$.'
          - problem: "Solve y'' + y = t with y(0) = 0 and y'(0) = 0 by the convolution theorem. Give y(t)."
            answer: "t - sin(t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Convolution theorem rule: Y(s) = (1/(s^2+1))(1/s^2). Table look-up inverts the factors as sin(t) and t. Their convolution is the integral of sin(t - tau) tau; evaluating it gives t - sin(t). The solution is t - sin(t)."
          - problem: "Let L-inverse denote the inverse Laplace transform. Use the convolution theorem to compute L-inverse of 1/(s(s+3)). Give the result as a function of t."
            answer: "(1 - e^(-3t))/3"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Convolution theorem rule: the inverse of a product is the convolution of the inverses. Table look-up gives 1 and e^(-3t) as the two functions. Their convolution integral from 0 to t of e^(-3 tau) d tau equals (1 - e^(-3t))/3. The result is (1 - e^(-3t))/3."
          - problem: "Use the convolution theorem to compute L of the convolution of t and e^(-5t). Give the transform as a function of s."
            answer: "1/(s^2(s+5))"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Convolution theorem rule: the transform of a convolution is the product of the two transforms. Table look-up gives L{t} = 1/s^2 and L{e^(-5t)} = 1/(s+5). Multiply them: 1/(s^2(s+5)). The transform is 1/(s^2(s+5))."
          - problem: "Use the convolution theorem to find the inverse Laplace transform of 1/(s^2(s+1)) at t = 2. Give the answer to 3 decimals."
            answer: "1.135"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Convolution theorem rule: the inverse transform of 1/(s^2(s+1)) is the convolution of t and e^(-t). Table look-up and the convolution integral give t - 1 + e^(-t). At t = 2 this is 2 - 1 + e^(-2) = 1.135335. To three decimals the answer is 1.135."
        constraints: "products of two table entries; convolution integrals stay elementary"
    diagnostic_exemplar:
      problem: 'Use the convolution theorem to compute $\mathcal{L}^{-1}\left\{\dfrac{1}{s^2(s+2)}\right\}$.'
      answer: '$\dfrac{t}{2} - \dfrac{1}{4} + \dfrac{1}{4}e^{-2t}$'
      answer_contract: {kind: none}
      solution_sketch: 'The transform is the product of $1/s^2$ and $1/(s+2)$, so the inverse is $t * e^{-2t} = \int_0^t \tau e^{-2(t-\tau)}\,d\tau = e^{-2t}\left[\frac{\tau}{2}e^{2\tau} - \frac{1}{4}e^{2\tau}\right]_0^t = \frac{t}{2} - \frac{1}{4} + \frac{1}{4}e^{-2t}$.'
    anki_seeds:
      - front: 'Definition of the convolution $(f * g)(t)$?'
        back: '$\int_0^t f(\tau)\,g(t - \tau)\,d\tau$'
        type: basic
      - front: 'Convolution theorem?'
        back: '$\mathcal{L}\{f * g\} = F(s)\,G(s)$: convolution in $t$ becomes multiplication in $s$.'
        type: basic

  - id: dirac-delta-impulse
    name: The Dirac Delta and Impulse Response
    core: false                # terminal extension of the Laplace unit, alongside the
                               # supplemental unit-step and convolution topics it builds on
    difficulty: 0.84
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: unit-step-piecewise-forcing
        weight: 0.5
        key: true
      - id: laplace-ivp
        weight: 0.5
        key: true
      - id: laplace-convolution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: The delta function and the sifting property
        key_prerequisites: [unit-step-piecewise-forcing]
        exemplars:
          - problem: 'Using the sifting property $\int_0^{\infty} \delta(t - c)f(t)\,dt = f(c)$, compute $\int_0^{\infty} \delta(t - 2)\,e^{-3t}\,dt$.'
            answer: '$e^{-6}$'
            solution_sketch: 'The delta picks out the integrand value at $t = 2$.'
          - problem: 'Compute $\int_0^5 \delta(t - 3)(t^2 + 1)\,dt$.'
            answer: "10"
            solution_sketch: 'The impulse at $t = 3$ lies inside $(0, 5)$, so the integral is $3^2 + 1$.'
          - problem: "Use the sifting property to find the Laplace transform of $\\delta(t - 5)$. Give the transform as a function of $s$."
            answer: "e^(-5s)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "The Laplace transform is $F(s) = \\int_0^{\\infty} e^{-st} \\delta(t-5)\\,dt$. The sifting property replaces $t$ by $5$ in the exponential. Hence $F(s) = e^{-5s}$."
          - problem: "Evaluate $\\int_0^5 \\delta(t - 3)\\sin(\\pi t/2)\\,dt$."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is $I = \\int_0^5 \\delta(t-3)\\sin(\\pi t/2)\\,dt$. The impulse at $t=3$ lies inside the interval, so sifting gives $\\sin(3\\pi/2)$. Since $\\sin(3\\pi/2) = -1$, the value is -1."
          - problem: "Evaluate $\\int_0^6 \\delta(t - 4)(t^2 - 3t + 2)\\,dt$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is $I = \\int_0^6 \\delta(t-4)(t^2-3t+2)\\,dt$. The sifting property selects $t=4$ because $4$ lies inside the interval. Substitute $t=4$: $16-12+2 = 6$, so the value is 6."
          - problem: "The impulse at time $c$ inside the interval $0 < t < 5$ satisfies $\\int_0^5 \\delta(t - c)(2t + 1)\\,dt = 9$. Find $c$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The integral is $I = \\int_0^5 \\delta(t-c)(2t+1)\\,dt$. By the sifting property, $I = 2c+1$ since $c$ is inside the interval. Set $2c+1 = 9$, which gives $2c = 8$; the impulse location is 4."
        constraints: "impulse located at integer times inside the integration interval; integrands from the Laplace table (polynomials, e^{at}, sin bt)"
      - id: kp2
        name: Impulse-forced initial value problems
        key_prerequisites: [laplace-ivp, unit-step-piecewise-forcing]
        exemplars:
          - problem: "The system $y' + 2y = \\delta(t - 1)$ has $y(0) = 0$. Find $y(2)$."
            answer: "e^(-2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Take the Laplace transform: (s + 2)Y = e^(-s), so Y = e^(-s)/(s + 2). The second shifting theorem gives y(t) = u_1(t) e^(-2(t - 1)) for t > 1. At t = 2, y(2) = e^(-2)."
          - problem: "The system $y'' + y = \\delta(t - \\pi)$ has $y(0) = y'(0) = 0$. Find $y(3\\pi/2)$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Take the Laplace transform: (s^2 + 1)Y = e^(-pi s), so Y = e^(-pi s)/(s^2 + 1). The second shifting theorem gives y(t) = u_pi(t) sin(t - pi). At t = 3pi/2, sin(3pi/2 - pi) = sin(pi/2) = 1, so y(3pi/2) = 1."
          - problem: "The system $y'' + 9y = \\delta(t)$ has $y(0) = y'(0) = 0$. Find $y(t)$ as a function of $t$."
            answer: "sin(3t)/3"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Take the Laplace transform: (s^2 + 9)Y = 1, so Y = 1/(s^2 + 9). Invert the table line: y(t) = sin(3t)/3. The solution is y(t) = sin(3t)/3."
          - problem: "The system $y'' + 5y' + 6y = \\delta(t)$ has $y(0) = y'(0) = 0$. Find $y(t)$ as a function of $t$."
            answer: "e^(-2t)-e^(-3t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Take the Laplace transform: (s^2 + 5s + 6)Y = 1, so Y = 1/((s + 2)(s + 3)). Partial fractions give Y = 1/(s + 2) - 1/(s + 3). Invert each term: y(t) = e^(-2t) - e^(-3t)."
          - problem: "The system $y'' + 7y' + 10y = \\delta(t)$ has $y(0) = y'(0) = 0$. Find $y(t)$ as a function of $t$."
            answer: "e^(-2t)/3 - e^(-5t)/3"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Take the Laplace transform: (s^2 + 7s + 10)Y = 1, so Y = 1/((s + 2)(s + 5)). Partial fractions give Y = (1/3)(1/(s + 2) - 1/(s + 5)). Invert: y(t) = e^(-2t)/3 - e^(-5t)/3."
          - problem: "The system $y'' + 4y = \\delta(t - 2)$ has $y(0) = y'(0) = 0$. Find $y(2 + \\pi/4)$."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Take the Laplace transform: (s^2 + 4)Y = e^(-2s), so Y = e^(-2s)/(s^2 + 4). The second shifting theorem gives y(t) = u_2(t) sin(2(t - 2))/2. At t = 2 + pi/4, sin(pi/2)/2 = 1/2, so y(2 + pi/4) = 1/2."
        constraints: "a single impulse at t = 0, a positive integer, or pi; characteristic roots distinct integers or +-ni so inversion is one table line after the shift"
      - id: kp3
        name: Impulse response and the transfer function
        key_prerequisites: [laplace-ivp, laplace-convolution]
        exemplars:
          - problem: "Find the impulse response h(t) of y'' + 5y' + 6y = f(t): take f = delta(t) and rest initial conditions. Give h(t) as a function of t."
            answer: "e^(-2t) - e^(-3t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The Laplace transform of delta(t) is 1, so rest initial conditions give (s^2 + 5s + 6)H(s) = 1. Factor the denominator and split by partial fractions: H(s) = 1/((s+2)(s+3)) = 1/(s+2) - 1/(s+3). Invert each term with the Laplace table to get h(t) = e^(-2t) - e^(-3t)."
          - problem: "For y'' + 6y' + 8y = f(t), take the transfer function as the ratio of the Laplace transform of the output to that of the input with rest initial conditions. Give the transfer function H(s) as a function of s."
            answer: "1/(s^2+6s+8)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Take the Laplace transform with rest initial conditions to get (s^2 + 6s + 8)Y(s) = F(s). The transfer function is the ratio H(s) = Y(s)/F(s), so H(s) = 1/(s^2 + 6s + 8). The impulse response would be the inverse transform of this H(s), namely h(t) = e^(-2t)/2 - e^(-4t)/2. The transfer function is H(s) = 1/(s^2 + 6s + 8)."
          - problem: "For y'' + 3y' + 2y = f(t) the impulse response is h(t) = e^(-t) - e^(-2t). Use the convolution y = h * g to find the rest solution when g(t) = 1. Give y(t) as a function of t."
            answer: "1/2 - e^(-t) + e^(-2t)/2"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "By the convolution theorem the rest solution is the integral from 0 to t of (e^(-(t-tau)) - e^(-2(t-tau))) dtau when g(t) = 1. Pull the t factors out and integrate: y(t) = e^(-t)(e^t - 1) - e^(-2t)(e^(2t) - 1)/2. Simplify the exponentials to get y(t) = 1/2 - e^(-t) + e^(-2t)/2."
          - problem: "Find the impulse response h(t) of y'' + 9y = f(t) with rest initial conditions and f = delta(t). Give h(t) as a function of t."
            answer: "sin(3t)/3"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "With f = delta(t) and rest initial conditions, the Laplace transform gives (s^2 + 9)H(s) = 1. Solve for H(s) = 1/(s^2 + 9). The inverse transform of 1/(s^2 + 9) is sin(3t)/3 by the Laplace table. Therefore h(t) = sin(3t)/3."
          - problem: "For y'' + 10y' + 21y = f(t), the transfer function is H(s) = 1/(s^2 + 10s + 21). Find H(0)."
            answer: "1/21"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute s = 0 into the transfer function H(s). The denominator becomes 0^2 + 10*0 + 21 = 21. Divide 1 by 21 to get H(0) = 1/21."
          - problem: "For y'' + 7y' + 10y = f(t) the impulse response is h(t) = e^(-2t)/3 - e^(-5t)/3. Use convolution to find the rest solution when g(t) = e^(3t). Give y(t) as a function of t."
            answer: "e^(3t)/40 - e^(-2t)/15 + e^(-5t)/24"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Convolution gives y(t) as the integral from 0 to t of (e^(-2(t-tau))/3 - e^(-5(t-tau))/3) e^(3tau) dtau. Use the convolution theorem and integrate the two exponential terms separately: y(t) = (e^(3t)-e^(-2t))/15 - (e^(3t)-e^(-5t))/24. Simplify to y(t) = e^(3t)/40 - e^(-2t)/15 + e^(-5t)/24."
        constraints: "constant-coefficient second-order with distinct real integer roots or +-ni; the convolution form is stated, not evaluated, unless g is 1 or e^{at}"
    diagnostic_exemplar:
      problem: 'Find the impulse response $h(t)$ of $y'''' + 4y'' + 3y = f(t)$: solve with $f = \delta(t)$ and rest initial conditions.'
      answer: '$h(t) = \tfrac{1}{2}\left(e^{-t} - e^{-3t}\right)$'
      answer_contract: {kind: none}
      solution_sketch: '$\mathcal{L}\{\delta(t)\} = 1$, so $H(s) = \frac{1}{s^2 + 4s + 3} = \frac{1}{(s+1)(s+3)} = \frac{1}{2}\left(\frac{1}{s+1} - \frac{1}{s+3}\right)$.'
