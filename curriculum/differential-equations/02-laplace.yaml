      - front: 'The three steps of the Laplace method for an IVP?'
        back: 'Transform the ODE (initial conditions enter immediately), solve algebraically for $Y(s)$, invert.'
        type: basic
      - front: "Why transform a first-order IVP instead of using an integrating factor?"
        back: "Laplace turns the ODE plus its initial condition into one algebraic equation in $Y(s)$ — no arbitrary constant to fit afterwards."
        type: basic

