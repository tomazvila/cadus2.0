unit: laplace
course: differential-equations
module: "Laplace Transforms"
topics:
  - id: laplace-transform-definition
    name: Transforms from the Definition
    core: true
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: improper-integrals
        weight: 0.6
        key: true
      - id: integration-by-parts
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: The definition and convergence
        key_prerequisites: [improper-integrals]
        exemplars:
          - problem: 'For which values of $s$ does the integral $\int_0^{\infty} e^{-st} e^{3t}\,dt$ converge?'
            answer: '$s > 3$'
            solution_sketch: 'The integrand is $e^{(3-s)t}$; the improper integral converges exactly when the exponent $3 - s$ is negative.'
          - problem: "Use the definition of the Laplace transform to compute L{1}. Give the transform as F(s) and the domain of convergence as an inequality in s."
            answer: "F = 1/s; domain = s > 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["s"]}, "name": "F"}, {"contract": {"kind": "inequality_union"}, "name": "domain"}]}
            solution_sketch: "The full result is F = 1/s; domain = s > 0. Step 1 (definition of the Laplace transform): F(s) is the improper integral from 0 to infinity of e^(-st) dt. Step 2 (antiderivative): an antiderivative of e^(-st) is -e^(-st)/s, and the boundary term at t = 0 contributes 1/s while the limit at infinity is 0 exactly when s > 0. So the improper integral converges to 1/s on that domain. F = 1/s; domain = s > 0."
          - problem: "From the definition, the Laplace transform of a function f(t) is the integral from 0 to infinity of e^(-st) f(t) dt. Take f(t) = e^(2t). Give F(s) as a function of s."
            answer: "1/(s-2)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Step 1 (definition of the Laplace transform): F(s) is the improper integral from 0 to infinity of e^(-st) e^(2t) dt, which combines to the integral of e^((2-s)t) dt. Step 2 (convergence of the improper integral): an antiderivative of e^((2-s)t) is e^((2-s)t)/(2-s), and the limit at infinity exists exactly when 2 - s < 0, so the domain of convergence is s > 2. Step 3 (evaluate the bounds): the limit term is 0 and the boundary term at t = 0 gives -1/(2-s) = 1/(s-2). The value of the integral is 1/(s-2)."
          - problem: "For which values of s does the integral from 0 to infinity of e^(-st) e^(-2t) dt converge? Give the answer as an inequality in s."
            answer: "s > -2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1: Combine the exponentials, so e^(-st) e^(-2t) = e^(-(s+2)t). Step 2 (convergence test for improper integrals of e^(ct)): the integral from 0 to infinity converges exactly when c < 0, so here -(s+2) < 0. The final result is s > -2."
          - problem: "For which values of s does the integral from 0 to infinity of e^(-st) e^(6t) dt converge? Give the answer as an inequality in s."
            answer: "s > 6"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Step 1: Combine the exponentials, so e^(-st) e^(6t) = e^((6-s)t). Step 2 (convergence test for improper integrals of e^(ct)): the integral from 0 to infinity converges exactly when c < 0, so here 6 - s < 0. The final result is s > 6."
          - problem: "A signal has value f(t) = e^(9t) for t at least 0. Its Laplace transform is F(s), the integral from 0 to infinity of e^(-st) e^(9t) dt. Compute F(s) from the definition. Give F(s) as a function of s."
            answer: "1/(s-9)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Step 1 (definition of the Laplace transform): F(s) is the improper integral from 0 to infinity of e^(-st) e^(9t) dt, which combines to the integral of e^((9-s)t) dt. Step 2 (convergence of the improper integral): an antiderivative of e^((9-s)t) is e^((9-s)t)/(9-s), and the limit at infinity exists exactly when 9 - s < 0, so the domain of convergence is s > 9. Step 3 (evaluate the bounds): the limit term is 0 and the boundary term at t = 0 gives -1/(9-s) = 1/(s-9). The transform is F(s) = 1/(s-9)."
        constraints: "integrands 1 and e^{at} with integer a; always state the domain of convergence"
      - id: kp2
        name: Transforms needing integration by parts
        key_prerequisites: [improper-integrals, integration-by-parts]
        exemplars:
          - problem: "Use the definition and integration by parts to compute the Laplace transform of t. Give the transform as a function of s and the domain of convergence as an inequality in s."
            answer: "F = 1/s^2; domain = s > 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["s"]}, "name": "F"}, {"contract": {"kind": "inequality_union"}, "name": "domain"}]}
            solution_sketch: "Start with the definition: F(s) = integral from 0 to infinity of t e^(-st) dt. Use integration by parts with u = t and dv = e^(-st) dt; the boundary term vanishes for s > 0, leaving (1/s) times the integral of e^(-st). The remaining integral is 1/s, so the transform is 1/s^2. The answer is F = 1/s^2; domain = s > 0."
          - problem: "Use the definition and one integration by parts to compute the Laplace transform of t e^{2t}. Give the transform as a function of s and the domain of convergence as an inequality in s."
            answer: "F = 1/(s-2)^2; domain = s > 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["s"]}, "name": "F"}, {"contract": {"kind": "inequality_union"}, "name": "domain"}]}
            solution_sketch: "The definition gives F(s) = integral from 0 to infinity of t e^{(2-s)t} dt. Use integration by parts with u = t; the boundary term vanishes when s > 2, and the remaining integral of e^{(2-s)t} equals 1/(s-2). Therefore the transform is 1/(s-2)^2. The answer is F = 1/(s-2)^2; domain = s > 2."
          - problem: "Use the definition and two integrations by parts to compute the Laplace transform of t^2. Give the transform as a function of s and the domain of convergence as an inequality in s."
            answer: "F = 2/s^3; domain = s > 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["s"]}, "name": "F"}, {"contract": {"kind": "inequality_union"}, "name": "domain"}]}
            solution_sketch: "The definition gives F(s) = integral from 0 to infinity of t^2 e^(-st) dt. First integration by parts reduces this to (2/s) times the integral of t e^(-st) dt, valid for s > 0. The second integration by parts gives (2/s) times 1/s^2. The answer is F = 2/s^3; domain = s > 0."
          - problem: "Use the definition and two integrations by parts to compute the Laplace transform of t^2. Give its value at s = 1 and the domain of convergence as an inequality in s."
            answer: "F1 = 2; domain = s > 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "F1"}, {"contract": {"kind": "inequality_union"}, "name": "domain"}]}
            solution_sketch: "From the definition, F(s) = integral from 0 to infinity of t^2 e^(-st) dt. Two integrations by parts give F(s) = 2/s^3 for s > 0. Evaluating at s = 1 gives 2/1^3 = 2. The answer is F1 = 2; domain = s > 0."
          - problem: "Use the definition and integration by parts to compute the Laplace transform of t. Give its value at s = 2 and the domain of convergence as an inequality in s."
            answer: "F2 = 1/4; domain = s > 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "F2"}, {"contract": {"kind": "inequality_union"}, "name": "domain"}]}
            solution_sketch: "The definition gives F(s) = integral from 0 to infinity of t e^(-st) dt. Integration by parts with u = t gives F(s) = 1/s^2 for s > 0. At s = 2 the value is 1/2^2 = 1/4. The answer is F2 = 1/4; domain = s > 0."
          - problem: "Use the definition and one integration by parts to compute the Laplace transform of t e^{5t}. Give the transform as a function of s and the domain of convergence as an inequality in s."
            answer: "F = 1/(s-5)^2; domain = s > 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["s"]}, "name": "F"}, {"contract": {"kind": "inequality_union"}, "name": "domain"}]}
            solution_sketch: "The definition gives F(s) = integral from 0 to infinity of t e^{(5-s)t} dt. Integration by parts with u = t works when s > 5; the boundary term vanishes and the remaining integral is 1/(s-5). Thus the transform is 1/(s-5)^2. The answer is F = 1/(s-5)^2; domain = s > 5."
        constraints: "integrands t, t^2, t e^{at}; one or two integrations by parts; state the domain of convergence"
    diagnostic_exemplar:
      problem: 'Compute $\mathcal{L}\{te^{-2t}\}$ directly from the definition, stating where it converges.'
      answer: '$\dfrac{1}{(s + 2)^2}$ for $s > -2$'
      answer_contract: {kind: none}
      solution_sketch: '$\int_0^{\infty} t e^{-(s+2)t}\,dt$; integrating by parts with $u = t$ gives $\frac{1}{(s+2)^2}$, and the boundary terms vanish exactly when $s + 2 > 0$.'
    anki_seeds:
      - front: 'Definition of the Laplace transform?'
        back: '$\mathcal{L}\{f(t)\} = \int_0^{\infty} e^{-st} f(t)\,dt$'
        type: basic
      - front: 'Why does $\mathcal{L}\{e^{at}\}$ require $s > a$?'
        back: 'The integrand is $e^{(a-s)t}$; the improper integral converges only when the exponent $a - s < 0$.'
        type: basic

  - id: laplace-table-linearity
    name: The Transform Table and Linearity
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: laplace-transform-definition
        weight: 0.7
        key: true
      - id: improper-integrals
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: The standard table
        key_prerequisites: [laplace-transform-definition]
        exemplars:
          - problem: 'Compute $\mathcal{L}\{t^3\}$.'
            answer: '$6/s^4$'
            solution_sketch: '$\mathcal{L}\{t^n\} = \dfrac{n!}{s^{n+1}}$ with $n = 3$.'
          - problem: 'Compute $\mathcal{L}\{\sin 5t\}$.'
            answer: '$5/(s^2 + 25)$'
            solution_sketch: 'Table entry $\mathcal{L}\{\sin bt\} = \frac{b}{s^2+b^2}$ with $b = 5$.'
          - problem: 'Compute $\mathcal{L}\{\cos 2t\}$.'
            answer: '$s/(s^2 + 4)$'
          - problem: "Find the Laplace transform of $e^{4t}$ and give the result as a function of $s$."
            answer: "1/(s-4)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "The full object is the transform $\\mathcal{L}\\{e^{4t}\\}$. Step 1 names the exponential table rule $\\mathcal{L}\\{e^{at}\\} = 1/(s-a)$ for $s$ larger than $a$. Step 2 substitutes the integer parameter $a = 4$ into that entry. The answer is 1/(s-4)."
          - problem: "Compute $\\mathcal{L}\\{t^2\\}$ and give the result as a function of $s$."
            answer: "2/s^3"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "The full object is the transform $\\mathcal{L}\\{t^2\\}$. Step 1 selects the power table rule $\\mathcal{L}\\{t^n\\} = n!/s^{n+1}$. Step 2 inserts $n = 2$, so $n! = 2$ and the exponent on $s$ is $3$. The answer is 2/s^3."
          - problem: "Determine $\\mathcal{L}\\{\\sin 3t\\}$ and give the result as a function of $s$."
            answer: "3/(s^2+9)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "The full object is the transform $\\mathcal{L}\\{\\sin 3t\\}$. Step 1 selects the sine table rule $\\mathcal{L}\\{\\sin bt\\} = b/(s^2+b^2)$. Step 2 inserts the integer parameter $b = 3$, so the numerator is $3$ and the denominator is $s^2 + 9$. The answer is 3/(s^2+9)."
        constraints: "single table entries: t^n (n <= 3), e^{at}, sin bt, cos bt with integer parameters"
      - id: kp2
        name: Linearity
        key_prerequisites: [laplace-transform-definition]
        exemplars:
          - problem: 'Compute $\mathcal{L}\{3t^2 - 2\sin 4t\}$.'
            answer: '$6/s^3 - 8/(s^2 + 16)$'
            solution_sketch: '$\mathcal{L}\{t^2\} = \frac{2}{s^3}$ and $\mathcal{L}\{\sin 4t\} = \frac{4}{s^2+16}$; apply linearity.'
          - problem: 'Compute $\mathcal{L}\{\cos 3t + e^{-2t}\}$.'
            answer: '$s/(s^2 + 9) + 1/(s + 2)$'
          - problem: "Compute $\\mathcal{L}\\{5t^3 + 2\\sin 2t\\}$."
            answer: "30/s^4 + 4/(s^2 + 4)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Use the table entry L{t^3} = 6/s^4 and the table entry L{sin 2t} = 2/(s^2 + 4). By linearity, multiply by 5 and 2: 5*6/s^4 + 2*2/(s^2 + 4). The transform is 30/s^4 + 4/(s^2 + 4)."
          - problem: "Compute $\\mathcal{L}\\{7e^{-4t} - 3\\cos 2t\\}$."
            answer: "7/(s+4) - 3s/(s^2+4)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Use the table entry L{e^{-4t}} = 1/(s + 4) and the table entry L{cos 2t} = s/(s^2 + 4). By linearity, multiply by 7 and -3: 7/(s + 4) - 3s/(s^2 + 4). The transform is 7/(s+4) - 3s/(s^2+4)."
          - problem: "Compute $\\mathcal{L}\\{2t - 6e^{5t} + \\sin 3t\\}$."
            answer: "2/s^2 - 6/(s-5) + 3/(s^2+9)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Use the table entries L{t} = 1/s^2, L{e^{5t}} = 1/(s - 5), and L{sin 3t} = 3/(s^2 + 9). By linearity, multiply by 2, -6, and 1: 2/s^2 - 6/(s - 5) + 3/(s^2 + 9). The transform is 2/s^2 - 6/(s-5) + 3/(s^2+9)."
          - problem: 'Compute $\mathcal{L}\{4 - 5t + 2e^{3t}\}$.'
            answer: '$4/s - 5/s^2 + 2/(s - 3)$'
            solution_sketch: 'Transform each term from the table and combine by linearity.'
        constraints: "linear combinations of t^n (n <= 3), e^{at}, sin bt, cos bt with integer parameters"
    diagnostic_exemplar:
      problem: 'Compute $\mathcal{L}\{2t^2 + 3\cos 5t\}$.'
      answer: '$4/s^3 + 3s/(s^2 + 25)$'
      solution_sketch: '$2\cdot\frac{2}{s^3} + 3\cdot\frac{s}{s^2+25}$ by linearity.'
    anki_seeds:
      - front: 'Laplace transforms of $t^n$, $e^{at}$, $\sin bt$, $\cos bt$?'
        back: '$\dfrac{n!}{s^{n+1}}$, $\dfrac{1}{s-a}$, $\dfrac{b}{s^2+b^2}$, $\dfrac{s}{s^2+b^2}$'
        type: basic
      - front: 'Is the Laplace transform linear?'
        back: 'Yes: $\mathcal{L}\{af + bg\} = a\mathcal{L}\{f\} + b\mathcal{L}\{g\}$, because the integral is linear.'
        type: basic

  - id: laplace-transform-basics
    name: The First Shifting Theorem
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: laplace-table-linearity
        weight: 0.7
        key: true
      - id: laplace-transform-definition
        weight: 0.4
        key: false
      - id: derivatives-exp-log
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: The first shifting theorem
        key_prerequisites: [laplace-table-linearity]
        exemplars:
          - problem: 'Compute $\mathcal{L}\{e^{2t}\sin 3t\}$.'
            answer: '$3/((s-2)^2 + 9)$'
            solution_sketch: 'Shift $\mathcal{L}\{\sin 3t\} = \frac{3}{s^2+9}$ by replacing $s$ with $s - 2$.'
          - problem: 'Compute $\mathcal{L}\{t^2 e^{-t}\}$.'
            answer: '$2/(s+1)^3$'
            solution_sketch: 'Shift $\mathcal{L}\{t^2\} = \frac{2}{s^3}$ by $s \mapsto s + 1$.'
          - problem: 'Compute $\mathcal{L}\{e^{3t}\cos t\}$.'
            answer: '$(s - 3)/((s-3)^2 + 1)$'
          - problem: "Compute $\\mathcal{L}\\{e^{4t} t\\}$."
            answer: "1/(s-4)^2"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "First object: L{e^(4t) t}. Rule: the basic table gives L{t} = 1/s^2. Rule: the first shifting theorem replaces s by s-4 everywhere. So L{e^(4t) t} = 1/(s-4)^2."
          - problem: "Compute $\\mathcal{L}\\{e^{-3t}\\sin 2t\\}$."
            answer: "2/((s+3)^2+4)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "First object: L{e^(-3t) sin(2t)}. Rule: the basic table gives L{sin(2t)} = 2/(s^2+4). Rule: the first shifting theorem replaces s by s+3 everywhere. So L{e^(-3t) sin(2t)} = 2/((s+3)^2+4)."
          - problem: "Compute $\\mathcal{L}\\{e^{5t}\\cosh 2t\\}$."
            answer: "(s-5)/((s-5)^2-4)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "First object: L{e^(5t) cosh(2t)}. Rule: the basic table gives L{cosh(2t)} = s/(s^2-4). Rule: the first shifting theorem replaces s by s-5 everywhere. So L{e^(5t) cosh(2t)} = (s-5)/((s-5)^2-4)."
        constraints: "products e^{at} f(t) with f from the basic table; the shift replaces s by s - a everywhere"
      - id: kp2
        name: Mixed transform fluency
        key_prerequisites: [laplace-table-linearity]
        exemplars:
          - problem: 'Compute $\mathcal{L}\{5e^{2t} - 3\cos 4t\}$.'
            answer: '$5/(s - 2) - 3s/(s^2 + 16)$'
            solution_sketch: 'Table entries $\frac{1}{s-2}$ and $\frac{s}{s^2+16}$ combined by linearity.'
          - problem: 'Compute $\mathcal{L}\{e^{-t}(t + \cos 2t)\}$.'
            answer: '$1/(s+1)^2 + (s + 1)/((s+1)^2 + 4)$'
            solution_sketch: 'Transform $t + \cos 2t$ from the table, then shift the whole result by $s \mapsto s + 1$.'
          - problem: 'Compute $\mathcal{L}\{2t^3 e^{4t}\}$.'
            answer: '$12/(s-4)^4$'
            solution_sketch: '$\mathcal{L}\{2t^3\} = \frac{12}{s^4}$, shifted by $s \mapsto s - 4$.'
          - problem: "Compute the Laplace transform of e^(-2t)(t^2 + 4 sin(t)), as a function of s."
            answer: "2/(s+2)^3+4/((s+2)^2+1)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "First write the table transform of t^2 + 4 sin(t): L{t^2} = 2/s^3 and L{4 sin(t)} = 4/(s^2+1), so L{t^2 + 4 sin(t)} = 2/s^3 + 4/(s^2+1). Then apply the first shifting theorem with a = -2, replacing s by s+2 because of the factor e^(-2t). The final transform is 2/(s+2)^3+4/((s+2)^2+1)."
          - problem: "Compute the Laplace transform of e^(3t)(4t - cos(5t)), as a function of s."
            answer: "4/(s-3)^2-(s-3)/((s-3)^2+25)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "Start with the table transform of 4t - cos(5t): L{4t} = 4/s^2 and L{cos(5t)} = s/(s^2+25), so L{4t - cos(5t)} = 4/s^2 - s/(s^2+25). The first shifting theorem for e^(3t) replaces s by s-3, because a = 3. Thus the transform is 4/(s-3)^2-(s-3)/((s-3)^2+25)."
          - problem: "Compute the Laplace transform of e^(5t)(2t - 5 sin(3t)), as a function of s."
            answer: "2/(s-5)^2-15/((s-5)^2+9)"
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: "First use the table on 2t - 5 sin(3t): L{2t} = 2/s^2 and L{5 sin(3t)} = 15/(s^2+9), so the inner transform is 2/s^2 - 15/(s^2+9). Apply the first shifting theorem with a = 5 for the factor e^(5t), replacing s by s-5. This gives 2/(s-5)^2-15/((s-5)^2+9)."
        constraints: "linearity and the s-shift combined; integer parameters; at most three terms"
    diagnostic_exemplar:
      problem: 'Compute $\mathcal{L}\{e^{-t}(t^2 + \cos 3t)\}$.'
      answer: '$2/(s+1)^3 + (s + 1)/((s+1)^2 + 9)$'
      solution_sketch: 'By linearity and the first shifting theorem: $\mathcal{L}\{t^2\} = 2/s^3$ and $\mathcal{L}\{\cos 3t\} = s/(s^2+9)$, each with $s$ replaced by $s + 1$.'
    anki_seeds:
      - front: 'First shifting theorem?'
        back: '$\mathcal{L}\{e^{at}f(t)\} = F(s - a)$: multiplying by $e^{at}$ shifts $s$ by $a$.'
        type: basic
      - front: 'Laplace transform of $t^n e^{at}$?'
        back: '$\dfrac{n!}{(s-a)^{n+1}}$ (shift the $t^n$ entry by $s \mapsto s - a$).'
        type: basic

  - id: inverse-laplace-table
    name: Inverse Transforms from the Table
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: laplace-table-linearity
        weight: 0.7
        key: true
      - id: laplace-transform-definition
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: Direct table inversions
        key_prerequisites: [laplace-table-linearity]
        exemplars:
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{1}{s - 5}\right\}$.'
            answer: '$\exp(5t)$'
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{2}{s^3}\right\}$.'
            answer: '$t^2$'
            solution_sketch: 'Matches $\mathcal{L}\{t^2\} = \frac{2}{s^3}$ exactly.'
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{s}{s^2 + 4}\right\}$.'
            answer: '$\cos 2t$'
        constraints: "single table entries matched exactly; integer parameters"
      - id: kp2
        name: Fixing constants and splitting terms
        key_prerequisites: [laplace-table-linearity]
        exemplars:
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{4}{s^2 + 9}\right\}$.'
            answer: '$(4/3)\sin 3t$'
            solution_sketch: 'The sine entry needs numerator $3$: write $\frac{4}{3}\cdot\frac{3}{s^2+9}$.'
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{2s + 5}{s^2 + 4}\right\}$.'
            answer: '$2\cos 2t + (5/2)\sin 2t$'
            solution_sketch: 'Split into $\frac{2s}{s^2+4} + \frac{5}{s^2+4}$ and fix the sine constant.'
          - problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{3}{s^4}\right\}$.'
            answer: '$t^3/2$'
            solution_sketch: '$\mathcal{L}\{t^3\} = \frac{6}{s^4}$, so $\frac{3}{s^4} = \frac{1}{2}\cdot\frac{6}{s^4}$.'
        constraints: "numerators need a constant factor fixed or a two-term split; no factoring of denominators"
    diagnostic_exemplar:
      problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{s + 6}{s^2 + 9}\right\}$.'
      answer: '$\cos 3t + 2\sin 3t$'
      solution_sketch: 'Split into $\frac{s}{s^2+9} + 2\cdot\frac{3}{s^2+9}$ and invert each term.'
    anki_seeds:
      - front: 'Inverse transforms of $\dfrac{b}{s^2+b^2}$ and $\dfrac{s}{s^2+b^2}$?'
        back: '$\sin bt$ and $\cos bt$'
        type: basic
      - front: 'Before inverting $\dfrac{c}{s^{n+1}}$, first...'
        back: 'rescale to match $\mathcal{L}\{t^n\} = \dfrac{n!}{s^{n+1}}$: the answer is $\dfrac{c}{n!}\,t^n$.'
        type: basic

