    diagnostic_exemplar:
      problem: 'Find the impulse response $h(t)$ of $y'''' + 4y'' + 3y = f(t)$: solve with $f = \delta(t)$ and rest initial conditions.'
      answer: '$h(t) = \tfrac{1}{2}\left(e^{-t} - e^{-3t}\right)$'
      answer_contract: {kind: none}
      solution_sketch: '$\mathcal{L}\{\delta(t)\} = 1$, so $H(s) = \frac{1}{s^2 + 4s + 3} = \frac{1}{(s+1)(s+3)} = \frac{1}{2}\left(\frac{1}{s+1} - \frac{1}{s+3}\right)$.'
