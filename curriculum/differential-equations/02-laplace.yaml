unit: laplace
course: differential-equations
module: "Laplace Transforms"
topics:
  - id: laplace-transform-definition
    name: Transforms from the Definition
    core: true
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: improper-integrals
        weight: 0.6
        key: true
      - id: integration-by-parts
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: 'The definition and convergence'
        key_prerequisites: [improper-integrals]
        step_check:
          step: 'The integral converges if the exponent $(4-s)$ is negative'
          question: 'Why does the integral converge only when the exponent $4-s$ is negative?'
          options:
            - 'Then the integrand is negative, and a negative area is always finite'
            - 'Then $e^{(4-s)t}$ tends to $0$ as $t$ grows, so the upper limit adds nothing'
            - 'Then the denominator $4-s$ is nonzero, and that alone makes the integral finite'
            - 'Then $e^{(4-s)t}$ grows slowly enough for the area to settle at a total'
          answer: 'Then $e^{(4-s)t}$ tends to $0$ as $t$ grows, so the upper limit adds nothing'
          why: 'A negative exponent makes $e^{(4-s)t}$ tend to $0$, so the limit at the upper bound is $0$; a positive exponent makes the integrand grow and the integral diverge.'
        try_first:
          problem: 'For $s = 2$, what value does $e^{-2b}$ approach as $b \to \infty$?'
          answer_contract: {"kind":"exact"}
          answer: '0'
          reveal: 'The factor $e^{-sb}$ tends to $0$ when $s>0$, so the upper limit of the integral adds nothing. This is why the Laplace integral has a finite value once $s$ is large enough.'
        exemplars:
          - problem: 'For which values of $s$ does the integral $\int_0^{\infty} e^{-st} e^{3t}\,dt$ converge?'
            answer: 's > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The integrand simplifies to $e^{(3-s)t}$. The improper integral converges exactly when the exponent $3-s$ is negative, that is, when $s > 3$.'
          - problem: 'Use the definition of the Laplace transform to find $\mathcal{L}\{1\}$.'
            answer: '1/s'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'By definition $\mathcal{L}\{1\} = \int_0^{\infty} e^{-st}\,dt$. For $s>0$ the upper limit contributes $0$, and the lower limit gives $\frac{1}{s}$.'
          - problem: 'Find $\mathcal{L}\{e^{2t}\}$ from the definition.'
            answer: '1/(s-2)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The definition gives $\int_0^{\infty} e^{(2-s)t}\,dt$, which converges for $s>2$. Its value is $-\frac{1}{2-s} = \frac{1}{s-2}$.'
          - problem: 'For which values of $s$ does $\int_0^{\infty} e^{-st} e^{-2t}\,dt$ converge?'
            answer: 's > -2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Combine the exponentials to get $e^{-(s+2)t}$. The integral converges exactly when $s+2 > 0$, so $s > -2$.'
          - problem: 'A signal decays according to $f(t) = e^{-4t}$ for $t \ge 0$. Find its Laplace transform from the definition.'
            answer: '1/(s+4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The definition gives $\int_0^{\infty} e^{-(s+4)t}\,dt$, which converges for $s > -4$. Its value is $\frac{1}{s+4}$.'
          - problem: 'Sam says that $\int_0^{\infty} e^{-st} e^{6t}\,dt$ converges when $s = 4$, because $e^{-st}$ decays. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, he is right", "he is right", "sam is right", "right", "it converges"], ["no", "sam is not right", "he is wrong", "wrong", "it diverges", "it does not converge", "not right", "incorrect"]]}
            solution_sketch: 'At $s = 4$ the integrand is $e^{2t}$, which grows without bound, so the integral diverges. The integral converges only when $s > 6$.'
          - problem: 'The response of a circuit is $f(t) = e^{2t}$ for $t \ge 0$. What is the value at $s = 5$ of its Laplace transform?'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The transform is $\frac{1}{s-2}$, valid for $s > 2$. At $s = 5$ the value is $\frac{1}{3}$.'
          - problem: 'The Laplace transform of $f(t) = e^{8t}$ exists only for some values of $s$. Which values?'
            answer: 's > 8'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The integrand is $e^{(8-s)t}$. The integral converges exactly when $8-s < 0$, which means $s > 8$.'
        constraints: 'integrands 1 and e^{at} with integer a; transforms from the definition and convergence questions'
      - id: kp2
        name: 'Transforms needing integration by parts'
        key_prerequisites: [improper-integrals, integration-by-parts]
        step_check:
          step: 'Let $u = t$ and $dv = e^{-(s+3)t} dt$'
          question: 'Why is $u = t$ the useful choice?'
          options:
            - 'The first factor of a product is always the one taken as $u$'
            - 'The exponential cannot be integrated, so $t$ must take its place as $u$'
            - 'Differentiating $t$ gives $1$, so the new integral has no factor $t$'
            - 'Taking $u=t$ makes the boundary term equal $1$ at both limits'
          answer: 'Differentiating $t$ gives $1$, so the new integral has no factor $t$'
          why: 'Since $du = dt$, the remaining integral contains only the exponential, which is easy to integrate; the exponential is also easy to integrate for $dv$.'
        exemplars:
          - problem: 'Use integration by parts to find $\mathcal{L}\{t\}$.'
            answer: '1/s^2'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'Take $u = t$ and $dv = e^{-st}\,dt$. The boundary term vanishes for $s>0$, and the remaining integral is $\frac{1}{s}\cdot\frac{1}{s} = \frac{1}{s^2}$.'
          - problem: 'Find $\mathcal{L}\{te^{2t}\}$ from the definition.'
            answer: '1/(s-2)^2'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The integral is $\int_0^{\infty} t e^{-(s-2)t}\,dt$. One integration by parts gives $\frac{1}{s-2}\cdot\frac{1}{s-2}$ for $s>2$, so the transform is $\frac{1}{(s-2)^2}$.'
          - problem: 'Use integration by parts twice to find $\mathcal{L}\{t^2\}$.'
            answer: '2/s^3'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The first integration by parts gives $\frac{2}{s}\int_0^{\infty} t e^{-st}\,dt$ for $s>0$. The second gives $\frac{2}{s}\cdot\frac{1}{s^2} = \frac{2}{s^3}$.'
          - problem: 'For which values of $s$ does $\int_0^{\infty} t e^{-st}\,dt$ converge?'
            answer: 's > 0'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'For $s > 0$ the factor $e^{-st}$ decays faster than $t$ grows, so the integral is finite. For $s \le 0$ the integrand does not shrink, so the integral diverges.'
          - problem: 'A ramp input rises as $f(t) = t$ for $t \ge 0$. What is the value at $s = 2$ of its Laplace transform?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The transform of $t$ is $\frac{1}{s^2}$ for $s > 0$. At $s = 2$ this is $\frac{1}{4}$.'
          - problem: 'Find $\mathcal{L}\{te^{5t}\}$ from the definition.'
            answer: '1/(s-5)^2'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The integral is $\int_0^{\infty} t e^{-(s-5)t}\,dt$. Integration by parts gives $\frac{1}{(s-5)^2}$ for $s > 5$.'
          - problem: 'The output of a filter is $f(t) = te^{-3t}$ for $t \ge 0$. What is the value at $s = 1$ of its Laplace transform?'
            answer: '1/16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The transform is $\frac{1}{(s+3)^2}$ for $s > -3$. At $s = 1$ the value is $\frac{1}{16}$.'
          - problem: 'Sam finds $\mathcal{L}\{te^{-2t}\}$ and writes $\frac{1}{(s-2)^2}$. What is the correct transform?'
            answer: '1/(s+2)^2'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The integrand is $t e^{-(s+2)t}$, so $s$ is replaced by $s+2$ and not by $s-2$. Integration by parts then gives $\frac{1}{(s+2)^2}$.'
          - problem: 'A body starts from rest with constant acceleration $1\ \mathrm{m/s^2}$, so its distance is $f(t) = \tfrac{1}{2}t^2$ metres. Find the Laplace transform of $f$.'
            answer: '1/s^3'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'By linearity $\mathcal{L}\{\tfrac12 t^2\} = \tfrac12\cdot\frac{2}{s^3}$. The $2$ in the numerator cancels the $2$ in the denominator, giving $\frac{1}{s^3}$.'
          - problem: 'For which values of $s$ does the Laplace transform of $f(t) = te^{2t}$ exist?'
            answer: 's > 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The integrand is $te^{-(s-2)t}$. It decays faster than $t$ grows exactly when $s-2 > 0$, so the transform exists for $s > 2$.'
        constraints: 'integrands t, t^2, t e^{at}; one or two integrations by parts; transforms, values at a point and convergence'
    diagnostic_exemplar:
      problem: 'Compute $\mathcal{L}\{te^{-2t}\}$ directly from the definition, stating where it converges.'
      answer: '$\dfrac{1}{(s + 2)^2}$ for $s > -2$'
      answer_contract: {kind: none}
      solution_sketch: '$\int_0^{\infty} t e^{-(s+2)t}\,dt$; integrating by parts with $u = t$ gives $\frac{1}{(s+2)^2}$, and the boundary terms vanish exactly when $s + 2 > 0$.'
    anki_seeds:
      - front: 'Definition of the Laplace transform?'
        back: '$\mathcal{L}\{f(t)\} = \int_0^{\infty} e^{-st} f(t)\,dt$'
        type: basic
      - front: 'Why does $\mathcal{L}\{e^{at}\}$ require $s > a$?'
        back: 'The integrand is $e^{(a-s)t}$; the improper integral converges only when the exponent $a - s < 0$.'
        type: basic

  - id: laplace-table-linearity
    name: The Transform Table and Linearity
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: laplace-transform-definition
        weight: 0.7
        key: true
      - id: improper-integrals
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'The standard table'
        key_prerequisites: [laplace-transform-definition]
        step_check:
          step: 'Substitute $n = 2$ into the formula'
          question: 'Why does the answer have $s^3$ in the denominator when $n = 2$?'
          options:
            - 'The table entry has $s^{n+1}$, one power of $s$ more than the power of $t$'
            - 'The exponent of $s$ equals $n!$ plus one, and here $2!+1=3$ is the exponent'
            - 'The exponent of $s$ stays the same as the power of $t$ in the original function'
            - 'The $s$ is cubed because $e^{-st}$ is integrated once for each unit of the power'
          answer: 'The table entry has $s^{n+1}$, one power of $s$ more than the power of $t$'
          why: 'Each integration by parts divides by $s$ once more, so $t^n$ ends with $n+1$ powers of $s$ below; for $t^2$ that is $s^3$.'
        exemplars:
          - problem: 'Find $\mathcal{L}\{t^3\}$.'
            answer: '6/s^4'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table entry is $\mathcal{L}\{t^n\} = \frac{n!}{s^{n+1}}$. With $n = 3$ we get $3! = 6$ and the power $s^4$, so the transform is $\frac{6}{s^4}$.'
          - problem: 'Find $\mathcal{L}\{\sin 5t\}$.'
            answer: '5/(s^2+25)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table entry is $\mathcal{L}\{\sin bt\} = \frac{b}{s^2+b^2}$. With $b = 5$ the transform is $\frac{5}{s^2+25}$.'
          - problem: 'Find $\mathcal{L}\{\cos 2t\}$.'
            answer: 's/(s^2+4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table entry is $\mathcal{L}\{\cos bt\} = \frac{s}{s^2+b^2}$. With $b = 2$ the denominator is $s^2 + 4$.'
          - problem: 'Find $\mathcal{L}\{e^{4t}\}$.'
            answer: '1/(s-4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table entry is $\mathcal{L}\{e^{at}\} = \frac{1}{s-a}$ for $s > a$. With $a = 4$ the transform is $\frac{1}{s-4}$.'
          - problem: 'A mass on a spring has displacement $x(t) = \sin 3t$ metres at time $t$ seconds. Find the Laplace transform of $x$.'
            answer: '3/(s^2+9)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The displacement matches the sine entry $\frac{b}{s^2+b^2}$ with $b = 3$. So the transform is $\frac{3}{s^2+9}$.'
          - problem: 'A voltage rises as $v(t) = t^2$ volts at time $t$ seconds. Find the Laplace transform of $v$.'
            answer: '2/s^3'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The voltage matches the power entry $\frac{n!}{s^{n+1}}$ with $n = 2$. Since $2! = 2$, the transform is $\frac{2}{s^3}$.'
          - problem: 'Sam says that $\mathcal{L}\{\cos 4t\} = \dfrac{4}{s^2+16}$. What is the correct transform?'
            answer: 's/(s^2+16)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The numerator $4$ belongs to the sine entry. The cosine entry has the numerator $s$, so $\mathcal{L}\{\cos 4t\} = \frac{s}{s^2+16}$.'
          - problem: 'Find $\mathcal{L}\{e^{-3t}\}$.'
            answer: '1/(s+3)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table entry $\frac{1}{s-a}$ with $a = -3$ gives $\frac{1}{s-(-3)}$. This is $\frac{1}{s+3}$.'
        constraints: 'single table entries: t^n (n <= 3), e^{at}, sin bt, cos bt with integer parameters'
      - id: kp2
        name: 'Linearity'
        key_prerequisites: [laplace-transform-definition]
        step_check:
          step: 'Multiply by 2'
          question: 'Why is the factor $2$ simply multiplied after $\mathcal{L}\{t^3\}$ is found?'
          options:
            - 'The transform of a product is always the product of the two transforms'
            - 'The factor $2$ changes the power of $t$, so $n$ becomes $6$'
            - 'The factor $2$ is added to the exponent of $s$ in the denominator'
            - 'A constant comes out of the integral, so the result is scaled by it'
          answer: 'A constant comes out of the integral, so the result is scaled by it'
          why: 'The transform is an integral, and a constant factor can be taken outside an integral, so $\mathcal{L}\{2f\} = 2\mathcal{L}\{f\}$.'
        try_first:
          problem: 'Suppose $\mathcal{L}\{f\}$ has the value $3$ at $s = 2$ and $\mathcal{L}\{g\}$ has the value $5$ there. What is the value of $\mathcal{L}\{f+g\}$ at $s = 2$?'
          answer_contract: {"kind":"exact"}
          answer: '8'
          reveal: 'The transform is an integral, and the integral of a sum is the sum of the integrals, so the values add: $3+5=8$. This is linearity.'
        exemplars:
          - problem: 'Find $\mathcal{L}\{3t^2 - 2\sin 4t\}$.'
            answer: '6/s^3 - 8/(s^2+16)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table gives $\mathcal{L}\{t^2\} = \frac{2}{s^3}$ and $\mathcal{L}\{\sin 4t\} = \frac{4}{s^2+16}$. By linearity multiply by $3$ and $-2$ to get $\frac{6}{s^3} - \frac{8}{s^2+16}$.'
          - problem: 'Find $\mathcal{L}\{\cos 3t + e^{-2t}\}$.'
            answer: 's/(s^2+9) + 1/(s+2)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table gives $\frac{s}{s^2+9}$ for $\cos 3t$ and $\frac{1}{s+2}$ for $e^{-2t}$. By linearity the transform of the sum is the sum of the transforms.'
          - problem: 'Find $\mathcal{L}\{5t^3 + 2\sin 2t\}$.'
            answer: '30/s^4 + 4/(s^2+4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table gives $\frac{6}{s^4}$ for $t^3$ and $\frac{2}{s^2+4}$ for $\sin 2t$. By linearity multiply by $5$ and $2$ to get $\frac{30}{s^4} + \frac{4}{s^2+4}$.'
          - problem: 'Find $\mathcal{L}\{7e^{-4t} - 3\cos 2t\}$.'
            answer: '7/(s+4) - 3s/(s^2+4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table gives $\frac{1}{s+4}$ for $e^{-4t}$ and $\frac{s}{s^2+4}$ for $\cos 2t$. By linearity multiply by $7$ and $-3$.'
          - problem: 'A circuit is driven by the voltage $v(t) = 4 - 5t + 2e^{3t}$ volts. Find the Laplace transform of $v$.'
            answer: '4/s - 5/s^2 + 2/(s-3)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table gives $\frac{1}{s}$ for a constant $1$, $\frac{1}{s^2}$ for $t$, and $\frac{1}{s-3}$ for $e^{3t}$. By linearity multiply by $4$, $-5$ and $2$.'
          - problem: 'A signal is a constant level $6$ plus a sine wave, $f(t) = 6 + 2\sin 5t$. Find its Laplace transform.'
            answer: '6/s + 10/(s^2+25)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The constant gives $\frac{6}{s}$. The sine wave gives $2\cdot\frac{5}{s^2+25} = \frac{10}{s^2+25}$, and the two parts add.'
          - problem: 'The average of two signals $\sin 2t$ and $\cos 2t$ is $f(t) = \dfrac{\sin 2t + \cos 2t}{2}$. Find the Laplace transform of $f$.'
            answer: '1/(s^2+4) + s/(2(s^2+4))'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'By linearity the factor $\frac12$ multiplies each transform. So $\frac12\cdot\frac{2}{s^2+4} + \frac12\cdot\frac{s}{s^2+4} = \frac{1}{s^2+4} + \frac{s}{2(s^2+4)}$.'
          - problem: 'Sam says that $\mathcal{L}\{4\sin 2t\} = \dfrac{4}{s^2+4}$. What is the correct transform?'
            answer: '8/(s^2+4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The factor $4$ multiplies the whole transform of $\sin 2t$, which is $\frac{2}{s^2+4}$. So the transform is $\frac{8}{s^2+4}$.'
        constraints: 'linear combinations of t^n (n <= 3), e^{at}, sin bt, cos bt with integer parameters'
    diagnostic_exemplar:
      problem: 'Compute $\mathcal{L}\{2t^2 + 3\cos 5t\}$.'
      answer: '$4/s^3 + 3s/(s^2 + 25)$'
      solution_sketch: '$2\cdot\frac{2}{s^3} + 3\cdot\frac{s}{s^2+25}$ by linearity.'
    anki_seeds:
      - front: 'Laplace transforms of $t^n$, $e^{at}$, $\sin bt$, $\cos bt$?'
        back: '$\dfrac{n!}{s^{n+1}}$, $\dfrac{1}{s-a}$, $\dfrac{b}{s^2+b^2}$, $\dfrac{s}{s^2+b^2}$'
        type: basic
      - front: 'Is the Laplace transform linear?'
        back: 'Yes: $\mathcal{L}\{af + bg\} = a\mathcal{L}\{f\} + b\mathcal{L}\{g\}$, because the integral is linear.'
        type: basic

  - id: laplace-transform-basics
    name: The First Shifting Theorem
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: laplace-table-linearity
        weight: 0.7
        key: true
      - id: laplace-transform-definition
        weight: 0.4
        key: false
      - id: derivatives-exp-log
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'The first shifting theorem'
        key_prerequisites: [laplace-table-linearity]
        step_check:
          step: 'Replace $s$ with $s - 4$ in $F(s)$'
          question: 'Why is $s$ replaced by $s-4$ and not by $s+4$?'
          options:
            - 'The number $4$ changes sign whenever it moves into $F(s)$'
            - 'Growth of $e^{4t}$ must be offset by adding $4$ to $s$'
            - 'The factor $e^{4t}$ joins $e^{-st}$ to make $e^{-(s-4)t}$'
            - 'The frequency $2$ of the sine fixes the sign of the shift'
          answer: 'The factor $e^{4t}$ joins $e^{-st}$ to make $e^{-(s-4)t}$'
          why: 'In the integral, $e^{-st}e^{4t} = e^{-(s-4)t}$, so the transform of $f$ is simply evaluated at $s-4$ instead of $s$.'
        try_first:
          problem: 'Combine the factors $e^{-st}$ and $e^{3t}$ as $e^{-(s-c)t}$. What is $c$?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'So $\int_0^{\infty} e^{-st}e^{3t}f(t)\,dt$ is the transform of $f$ evaluated at $s-3$. Multiplying by $e^{ct}$ shifts $s$ to $s-c$.'
        exemplars:
          - problem: 'Find $\mathcal{L}\{e^{2t}\sin 3t\}$.'
            answer: '3/((s-2)^2+9)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of $\sin 3t$ is $\frac{3}{s^2+9}$. The factor $e^{2t}$ replaces $s$ by $s-2$, giving $\frac{3}{(s-2)^2+9}$.'
          - problem: 'Find $\mathcal{L}\{t^2 e^{-t}\}$.'
            answer: '2/(s+1)^3'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of $t^2$ is $\frac{2}{s^3}$. The factor $e^{-t}$ replaces $s$ by $s+1$, giving $\frac{2}{(s+1)^3}$.'
          - problem: 'Find $\mathcal{L}\{e^{3t}\cos t\}$.'
            answer: '(s-3)/((s-3)^2+1)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of $\cos t$ is $\frac{s}{s^2+1}$. The factor $e^{3t}$ replaces $s$ by $s-3$ in both places.'
          - problem: 'Find $\mathcal{L}\{te^{4t}\}$.'
            answer: '1/(s-4)^2'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of $t$ is $\frac{1}{s^2}$. The factor $e^{4t}$ replaces $s$ by $s-4$, giving $\frac{1}{(s-4)^2}$.'
          - problem: 'A damped vibration has displacement $x(t) = e^{-3t}\sin 2t$ metres at time $t$ seconds. Find the Laplace transform of $x$.'
            answer: '2/((s+3)^2+4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of $\sin 2t$ is $\frac{2}{s^2+4}$. The factor $e^{-3t}$ replaces $s$ by $s+3$, giving $\frac{2}{(s+3)^2+4}$.'
          - problem: 'A signal decays as $f(t) = t^3 e^{-2t}$ for $t \ge 0$. Find its Laplace transform.'
            answer: '6/(s+2)^4'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of $t^3$ is $\frac{6}{s^4}$. The factor $e^{-2t}$ replaces $s$ by $s+2$, giving $\frac{6}{(s+2)^4}$.'
          - problem: 'Sam finds $\mathcal{L}\{e^{5t}\cos 2t\}$ and writes $\dfrac{s+5}{(s+5)^2+4}$. What is the correct transform?'
            answer: '(s-5)/((s-5)^2+4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The factor $e^{5t}$ replaces $s$ by $s-5$, not by $s+5$. So $\frac{s}{s^2+4}$ becomes $\frac{s-5}{(s-5)^2+4}$.'
          - problem: 'The function $f(t) = te^{2t}$ has a Laplace transform $F(s)$. What is $F(5)$?'
            answer: '1/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The transform is $\frac{1}{(s-2)^2}$. At $s = 5$ the value is $\frac{1}{3^2} = \frac{1}{9}$.'
          - problem: 'Find $\mathcal{L}\{e^{5t}\cosh 2t\}$.'
            answer: '(s-5)/((s-5)^2-4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'Write $\cosh 2t = \frac12(e^{2t}+e^{-2t})$, so $\mathcal{L}\{\cosh 2t\} = \frac{s}{s^2-4}$. The factor $e^{5t}$ replaces $s$ by $s-5$, giving $\frac{s-5}{(s-5)^2-4}$.'
        constraints: 'products e^{at} f(t) with f from the basic table; the shift replaces s by s - a everywhere'
      - id: kp2
        name: 'Mixed transform fluency'
        key_prerequisites: [laplace-table-linearity]
        step_check:
          step: 'Apply the $s$-shift to the exponential term'
          question: 'Why does the factor $e^{-2t}$ turn $\frac{3}{s}$ into $\frac{3}{s+2}$?'
          options:
            - 'The factor $e^{-2t}$ replaces $s$ by $s-2$ in the transform of $3$'
            - 'The factor $e^{-2t}$ replaces $s$ by $s+2$ in the transform of $3$'
            - 'The factor $e^{-2t}$ is multiplied into the numerator as $3\cdot(-2)$'
            - 'The factor $e^{-2t}$ cancels the $s$, so only the constant $3$ stays'
          answer: 'The factor $e^{-2t}$ replaces $s$ by $s+2$ in the transform of $3$'
          why: 'Since $e^{-st}e^{-2t} = e^{-(s+2)t}$, every $s$ in the transform of $3$ becomes $s+2$.'
        exemplars:
          - problem: 'Find $\mathcal{L}\{5e^{2t} - 3\cos 4t\}$.'
            answer: '5/(s-2) - 3s/(s^2+16)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The table gives $\frac{1}{s-2}$ for $e^{2t}$ and $\frac{s}{s^2+16}$ for $\cos 4t$. By linearity multiply by $5$ and $-3$.'
          - problem: 'Find $\mathcal{L}\{e^{-t}(t + \cos 2t)\}$.'
            answer: '1/(s+1)^2 + (s+1)/((s+1)^2+4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'First transform $t + \cos 2t$ to get $\frac{1}{s^2} + \frac{s}{s^2+4}$. Then the factor $e^{-t}$ replaces $s$ by $s+1$ in every term.'
          - problem: 'Find $\mathcal{L}\{2t^3 e^{4t}\}$.'
            answer: '12/(s-4)^4'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of $2t^3$ is $\frac{12}{s^4}$. The factor $e^{4t}$ replaces $s$ by $s-4$, giving $\frac{12}{(s-4)^4}$.'
          - problem: 'Find $\mathcal{L}\{e^{-2t}(t^2 + 4\sin t)\}$.'
            answer: '2/(s+2)^3 + 4/((s+2)^2+1)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'First transform $t^2 + 4\sin t$ to get $\frac{2}{s^3} + \frac{4}{s^2+1}$. Then the factor $e^{-2t}$ replaces $s$ by $s+2$ in both terms.'
          - problem: 'The current in a circuit is $i(t) = e^{3t}(4t - \cos 5t)$ amperes at time $t$ seconds. Find the Laplace transform of $i$.'
            answer: '4/(s-3)^2 - (s-3)/((s-3)^2+25)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'First transform $4t - \cos 5t$ to get $\frac{4}{s^2} - \frac{s}{s^2+25}$. Then the factor $e^{3t}$ replaces $s$ by $s-3$ in both terms.'
          - problem: 'A damped oscillator has displacement $x(t) = e^{-t}(3\cos 2t + \sin 2t)$ metres at time $t$ seconds. Find the Laplace transform of $x$.'
            answer: '3(s+1)/((s+1)^2+4) + 2/((s+1)^2+4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'First transform $3\cos 2t + \sin 2t$ to get $\frac{3s}{s^2+4} + \frac{2}{s^2+4}$. Then the factor $e^{-t}$ replaces $s$ by $s+1$ in both terms.'
          - problem: 'Sam finds $\mathcal{L}\{2e^{-3t} + 5\sin 2t\}$ and writes $\dfrac{2}{s+3} + \dfrac{5}{s^2+4}$. What is the correct transform?'
            answer: '2/(s+3) + 10/(s^2+4)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of $\sin 2t$ is $\frac{2}{s^2+4}$, and the factor $5$ multiplies all of it. So the second term is $\frac{10}{s^2+4}$.'
          - problem: 'The average of the signals $e^{3t}\sin 2t$ and $e^{3t}\cos 2t$ is $f(t) = \dfrac{e^{3t}(\sin 2t + \cos 2t)}{2}$. Find the Laplace transform of $f$.'
            answer: '(s-1)/(2((s-3)^2+4))'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The transform of $\sin 2t + \cos 2t$ is $\frac{2 + s}{s^2+4}$. The factor $e^{3t}$ replaces $s$ by $s-3$, and the factor $\frac12$ gives $\frac{s-1}{2((s-3)^2+4)}$.'
        constraints: 'linearity and the s-shift combined; integer parameters; at most three terms'
    diagnostic_exemplar:
      problem: 'Compute $\mathcal{L}\{e^{-t}(t^2 + \cos 3t)\}$.'
      answer: '$2/(s+1)^3 + (s + 1)/((s+1)^2 + 9)$'
      solution_sketch: 'By linearity and the first shifting theorem: $\mathcal{L}\{t^2\} = 2/s^3$ and $\mathcal{L}\{\cos 3t\} = s/(s^2+9)$, each with $s$ replaced by $s + 1$.'
    anki_seeds:
      - front: 'First shifting theorem?'
        back: '$\mathcal{L}\{e^{at}f(t)\} = F(s - a)$: multiplying by $e^{at}$ shifts $s$ by $a$.'
        type: basic
      - front: 'Laplace transform of $t^n e^{at}$?'
        back: '$\dfrac{n!}{(s-a)^{n+1}}$ (shift the $t^n$ entry by $s \mapsto s - a$).'
        type: basic

  - id: inverse-laplace-table
    name: Inverse Transforms from the Table
    core: true
    difficulty: 0.70
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: laplace-table-linearity
        weight: 0.7
        key: true
      - id: laplace-transform-definition
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: 'Direct table inversions'
        key_prerequisites: [laplace-table-linearity]
        step_check:
          step: 'Adjust for the scaling factor'
          question: 'Why is $\frac{3}{s^4}$ rewritten as $\frac{1}{2}\cdot\frac{6}{s^4}$?'
          options:
            - 'The factor $\frac12$ halves the exponent of $s$ so it fits the table'
            - 'The numerator $3$ must always be doubled before the table can be used'
            - 'The $4$ in $s^4$ must be turned into $6$ to match the table'
            - 'The $t^3$ entry needs $3! = 6$, and $\frac12\cdot 6 = 3$ restores it'
          answer: 'The $t^3$ entry needs $3! = 6$, and $\frac12\cdot 6 = 3$ restores it'
          why: 'The table needs the numerator $6 = 3!$, and multiplying by $\frac12$ gives back the numerator $3$ of the given fraction, so the inverse is $\frac12 t^3$.'
        exemplars:
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{1}{s-5}\right\}$.'
            answer: 'e^(5t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The table entry $\mathcal{L}\{e^{at}\} = \frac{1}{s-a}$ with $a = 5$ matches exactly. So the inverse transform is $e^{5t}$.'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{2}{s^3}\right\}$.'
            answer: 't^2'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The table entry $\mathcal{L}\{t^2\} = \frac{2!}{s^3} = \frac{2}{s^3}$ matches exactly. So the inverse transform is $t^2$.'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{s}{s^2+4}\right\}$.'
            answer: 'cos(2t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The cosine entry $\frac{s}{s^2+b^2}$ with $b^2 = 4$ gives $b = 2$. So the inverse transform is $\cos 2t$.'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{1}{s+3}\right\}$.'
            answer: 'e^(-3t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Write $s + 3 = s - (-3)$, so the exponential entry has $a = -3$. The inverse transform is $e^{-3t}$.'
          - problem: 'A mass on a spring has displacement $x(t)$ metres, and the Laplace transform of $x$ is $X(s) = \dfrac{5}{s^2+25}$. Find $x(t)$.'
            answer: 'sin(5t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The sine entry $\frac{b}{s^2+b^2}$ with $b^2 = 25$ gives $b = 5$, and the numerator is $5$. So $x(t) = \sin 5t$.'
          - problem: 'The Laplace transform of a rising signal is $F(s) = \dfrac{6}{s^4}$. Find $f(t)$.'
            answer: 't^3'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The power entry $\frac{n!}{s^{n+1}}$ with $n + 1 = 4$ gives $n = 3$, and $3! = 6$ matches the numerator. So $f(t) = t^3$.'
          - problem: 'Sam inverts $\dfrac{1}{s+4}$ and writes $e^{4t}$. What is the correct inverse transform?'
            answer: 'e^(-4t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The denominator $s + 4$ means $s - a$ with $a = -4$. So the inverse transform is $e^{-4t}$, not $e^{4t}$.'
          - problem: 'The Laplace transform of $f$ is $\dfrac{1}{s-2}$. What is $f(1)$?'
            answer: 'e^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inverse transform is $f(t) = e^{2t}$. At $t = 1$ the value is $e^{2}$.'
        constraints: 'single table entries matched exactly; integer parameters'
      - id: kp2
        name: 'Fixing constants and splitting terms'
        key_prerequisites: [laplace-table-linearity]
        step_check:
          step: 'rewrite the term as $\frac{5}{4} \cdot \frac{4}{s^2 + 16}$'
          question: 'Why is the factor $\frac54$ written in front?'
          options:
            - 'The numerator $5$ must be replaced by $4$ to match the table entry'
            - 'The factor $\frac54$ is the frequency of the sine and appears inside it'
            - 'The sine entry has numerator $4$; $\frac54\cdot 4 = 5$ keeps the value'
            - 'The denominator $16$ must be divided by $4$ before the table is used'
          answer: 'The sine entry has numerator $4$; $\frac54\cdot 4 = 5$ keeps the value'
          why: 'The table entry has numerator $4$; the factor $\frac54$ makes the product equal the original numerator $5$, and it comes out of the inverse transform as a constant.'
        exemplars:
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{4}{s^2+9}\right\}$.'
            answer: '(4/3)sin(3t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The sine entry needs the numerator $3$. Write $\frac{4}{s^2+9} = \frac{4}{3}\cdot\frac{3}{s^2+9}$, so the inverse transform is $\frac{4}{3}\sin 3t$.'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{2s+5}{s^2+4}\right\}$.'
            answer: '2cos(2t) + (5/2)sin(2t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Split the fraction into $\frac{2s}{s^2+4} + \frac{5}{s^2+4}$. The first part gives $2\cos 2t$. The second part is $\frac{5}{2}\cdot\frac{2}{s^2+4}$, which gives $\frac{5}{2}\sin 2t$.'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{3}{s^4}\right\}$.'
            answer: 't^3/2'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The table gives $\mathcal{L}\{t^3\} = \frac{6}{s^4}$. Since $\frac{3}{s^4} = \frac{1}{2}\cdot\frac{6}{s^4}$, the inverse transform is $\frac{t^3}{2}$.'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{5}{s^2+16}\right\}$.'
            answer: '(5/4)sin(4t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The sine entry needs the numerator $4$. Write $\frac{5}{s^2+16} = \frac{5}{4}\cdot\frac{4}{s^2+16}$, so the inverse transform is $\frac{5}{4}\sin 4t$.'
          - problem: 'The velocity $v(t)$ of a cart has the Laplace transform $V(s) = \dfrac{6s+8}{s^2+16}$. Find $v(t)$.'
            answer: '6cos(4t) + 2sin(4t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Split into $\frac{6s}{s^2+16} + \frac{8}{s^2+16}$. The first part gives $6\cos 4t$. The second is $2\cdot\frac{4}{s^2+16}$, which gives $2\sin 4t$.'
          - problem: 'The current $i(t)$ in a circuit has the Laplace transform $I(s) = \dfrac{10}{s^2+4}$. Find $i(t)$.'
            answer: '5sin(2t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The sine entry needs the numerator $2$. Write $\frac{10}{s^2+4} = 5\cdot\frac{2}{s^2+4}$, so $i(t) = 5\sin 2t$.'
          - problem: 'Sam inverts $\dfrac{1}{s^2+9}$ and writes $\sin 3t$. What is the correct inverse transform?'
            answer: '(1/3)sin(3t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The sine entry $\frac{3}{s^2+9}$ has the numerator $3$, so $\frac{1}{s^2+9} = \frac{1}{3}\cdot\frac{3}{s^2+9}$. The inverse transform is $\frac{1}{3}\sin 3t$.'
          - problem: 'The Laplace transform of $f$ is $\dfrac{8}{s^3}$. What is $f(2)$?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\frac{8}{s^3} = 4\cdot\frac{2}{s^3}$, we get $f(t) = 4t^2$. At $t = 2$ the value is $4\cdot 4 = 16$.'
        constraints: 'numerators need a constant factor fixed or a two-term split; no factoring of denominators'
    diagnostic_exemplar:
      problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{s + 6}{s^2 + 9}\right\}$.'
      answer: '$\cos 3t + 2\sin 3t$'
      solution_sketch: 'Split into $\frac{s}{s^2+9} + 2\cdot\frac{3}{s^2+9}$ and invert each term.'
    anki_seeds:
      - front: 'Inverse transforms of $\dfrac{b}{s^2+b^2}$ and $\dfrac{s}{s^2+b^2}$?'
        back: '$\sin bt$ and $\cos bt$'
        type: basic
      - front: 'Before inverting $\dfrac{c}{s^{n+1}}$, first...'
        back: 'rescale to match $\mathcal{L}\{t^n\} = \dfrac{n!}{s^{n+1}}$: the answer is $\dfrac{c}{n!}\,t^n$.'
        type: basic

  - id: inverse-laplace-partial-fractions
    name: Inverse Transforms via Partial Fractions
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: inverse-laplace-table
        weight: 0.6
        key: true
      - id: partial-fractions-integration
        weight: 0.5
        key: true
      - id: laplace-transform-basics
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Distinct linear factors
        key_prerequisites: [inverse-laplace-table, partial-fractions-integration]
        step_check:
          step: 'Multiply both sides by $(s - 3)(s + 1)$ to clear denominators'
          question: 'Why do we multiply both sides by $(s - 3)(s + 1)$ at this step?'
          options:
            - 'It turns each term into a table entry that the inverse transform can then invert at once'
            - 'It removes the fractions, so $A$ and $B$ follow from one polynomial identity'
            - 'It makes the left side equal to $1$, so the constants $A$ and $B$ both cancel out of the sum'
          answer: 'It removes the fractions, so $A$ and $B$ follow from one polynomial identity'
          why: 'After clearing denominators we have $5 = A(s+1) + B(s-3)$, a polynomial identity that holds for every $s$. Choosing $s = 3$ and $s = -1$ then isolates $A$ and $B$.'
        exemplars:
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{1}{s(s + 1)}\right\}$.'
            answer: '1 - e^(-t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Write the fraction as $\frac{A}{s} + \frac{B}{s + 1}$. The cover-up method gives $A = 1$ at $s = 0$ and $B = -1$ at $s = -1$. Each term inverts with $\mathcal{L}^{-1}\{1/(s-a)\} = e^{at}$, so the inverse transform is 1 - e^(-t).'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{s + 3}{(s - 1)(s + 2)}\right\}$.'
            answer: '4e^t/3 - e^(-2t)/3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Write the fraction as $\frac{A}{s - 1} + \frac{B}{s + 2}$. The cover-up method gives $A = \frac{4}{3}$ at $s = 1$ and $B = - \frac{1}{3}$ at $s = -2$. Each term inverts with $\mathcal{L}^{-1}\{1/(s-a)\} = e^{at}$, so the inverse transform is 4e^t/3 - e^(-2t)/3.'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{2}{(s - 2)(s + 2)}\right\}$.'
            answer: 'e^(2t)/2 - e^(-2t)/2'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Write the fraction as $\frac{A}{s - 2} + \frac{B}{s + 2}$. The cover-up method gives $A = \frac{1}{2}$ at $s = 2$ and $B = - \frac{1}{2}$ at $s = -2$. Each term inverts with $\mathcal{L}^{-1}\{1/(s-a)\} = e^{at}$, so the inverse transform is e^(2t)/2 - e^(-2t)/2.'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{s + 5}{(s + 1)(s + 2)}\right\}$.'
            answer: '4e^(-t) - 3e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Write the fraction as $\frac{A}{s + 1} + \frac{B}{s + 2}$. The cover-up method gives $A = 4$ at $s = -1$ and $B = -3$ at $s = -2$. Each term inverts with $\mathcal{L}^{-1}\{1/(s-a)\} = e^{at}$, so the inverse transform is 4e^(-t) - 3e^(-2t).'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{1}{(s - 3)(s + 1)}\right\}$.'
            answer: 'e^(3t)/4 - e^(-t)/4'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Write the fraction as $\frac{A}{s - 3} + \frac{B}{s + 1}$. The cover-up method gives $A = \frac{1}{4}$ at $s = 3$ and $B = - \frac{1}{4}$ at $s = -1$. Each term inverts with $\mathcal{L}^{-1}\{1/(s-a)\} = e^{at}$, so the inverse transform is e^(3t)/4 - e^(-t)/4.'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{2 s + 1}{(s - 2)(s + 2)}\right\}$.'
            answer: '5e^(2t)/4 + 3e^(-2t)/4'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Write the fraction as $\frac{A}{s - 2} + \frac{B}{s + 2}$. The cover-up method gives $A = \frac{5}{4}$ at $s = 2$ and $B = \frac{3}{4}$ at $s = -2$. Each term inverts with $\mathcal{L}^{-1}\{1/(s-a)\} = e^{at}$, so the inverse transform is 5e^(2t)/4 + 3e^(-2t)/4.'
          - problem: 'The current $i(t)$ in a circuit, in amperes, has Laplace transform $I(s) = \dfrac{10}{(s + 1)(s + 6)}$. Find $i(t)$.'
            answer: '2e^(-t) - 2e^(-6t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Write the fraction as $\frac{A}{s + 1} + \frac{B}{s + 6}$. The cover-up method gives $A = 2$ at $s = -1$ and $B = -2$ at $s = -6$. Each term inverts with $\mathcal{L}^{-1}\{1/(s-a)\} = e^{at}$, so the inverse transform is 2e^(-t) - 2e^(-6t).'
          - problem: 'The drug concentration $c(t)$ in the blood has Laplace transform $C(s) = \dfrac{6}{s(s + 3)}$. Which constant value does $c(t)$ approach as $t$ grows without bound?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Split $C(s) = \frac{2}{s} - \frac{2}{s + 3}$ by the cover-up method. Inverting gives $c(t) = 2 - 2e^{-3t}$. The exponential term tends to $0$, so $c(t)$ approaches $2$.'
          - problem: 'Sam writes $\dfrac{1}{(s-1)(s-4)} = \dfrac{1}{s-1} - \dfrac{1}{s-4}$ and inverts each term. What is the correct inverse Laplace transform of $\dfrac{1}{(s-1)(s-4)}$?'
            answer: 'e^(4t)/3 - e^t/3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Sam skipped the cover-up step. At $s = 1$ the constant is $A = \frac{1}{1 - 4} = -\frac{1}{3}$, and at $s = 4$ it is $B = \frac{1}{4 - 1} = \frac{1}{3}$. So the inverse transform is e^(4t)/3 - e^t/3, which is $\frac{1}{3}e^{4t} - \frac{1}{3}e^{t}$.'
          - problem: 'In the partial fraction decomposition $\dfrac{7s+1}{(s-1)(s+3)} = \dfrac{A}{s-1} + \dfrac{B}{s+3}$, find $B$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply both sides by $(s-1)(s+3)$ to get $7s + 1 = A(s+3) + B(s-1)$. Put $s = -3$ to remove the $A$ term: $-20 = -4B$. So $B = 5$.'
        constraints: "denominators factor over the integers into 2 distinct linear factors; coefficients clean fractions"
      - id: kp2
        name: Completing the square and repeated factors
        key_prerequisites: [laplace-transform-basics, partial-fractions-integration]
        step_check:
          step: 'Rewrite the function: $\dfrac{1}{(s + 2)^2 + 9} = \dfrac{1}{3} \cdot \dfrac{3}{(s + 2)^2 + 9}$'
          question: 'Why does this step write the fraction as one third times a fraction with $3$ on top?'
          options:
            - 'The factor $\frac13$ is what completes the square in the denominator of the fraction'
            - 'Partial fractions always split a numerator into a product of two separate parts'
            - 'The sine entry has $b = 3$ on top, so we supply that $3$ and divide by it'
          answer: 'The sine entry has $b = 3$ on top, so we supply that $3$ and divide by it'
          why: 'The entry $\frac{b}{(s+a)^2+b^2}$ needs $b = 3$ in the numerator. Multiplying by $3$ and by $\frac13$ changes nothing, and the $\frac13$ stays outside as a constant factor.'
        try_first:
          problem: 'What is the smallest value that $s^2 + 4s + 13$ takes for real $s$?'
          answer_contract: {"kind": "exact"}
          answer: '9'
          reveal: 'Completing the square gives $s^2 + 4s + 13 = (s+2)^2 + 9$, so the smallest value is $9$. This form, a square plus a positive constant, is exactly what the shifted sine and cosine entries need.'
        exemplars:
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{s + 1}{s^{2} + 2 s + 5}\right\}$.'
            answer: 'e^(-t) cos(2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Complete the square: $s^2 + 2s + 5 = (s+1)^2 + 4$. The numerator $s + 1$ is exactly the shifted variable, so the transform is $\frac{s+1}{(s+1)^2 + 2^2}$. The first shifting theorem applied to $\cos 2t$ gives e^(-t) cos(2t).'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{3}{s^{2} + 2 s + 10}\right\}$.'
            answer: 'e^(-t) sin(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Complete the square: $s^2 + 2s + 10 = (s+1)^2 + 9$. The numerator $3$ equals $b$ for $b^2 = 9$, so the table entry for $\sin 3t$ applies. The first shifting theorem with $a = 1$ gives e^(-t) sin(3t).'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{1}{(s + 5)^2}\right\}$.'
            answer: 't e^(-5t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The table entry $\mathcal{L}\{t\} = 1/s^2$ gives $t$. Replacing $s$ by $s + 5$ multiplies the original function by $e^{-5t}$. So the inverse transform is t e^(-5t).'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{s + 4}{s^{2} + 8 s + 20}\right\}$.'
            answer: 'e^(-4t) cos(2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Complete the square: $s^2 + 8s + 20 = (s+4)^2 + 4$. The numerator $s + 4$ is the shifted variable, so the cosine entry with $b = 2$ applies. The first shifting theorem with $a = 4$ gives e^(-4t) cos(2t).'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{2}{s^{2} + 6 s + 10}\right\}$.'
            answer: '2e^(-3t) sin(t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Complete the square: $s^2 + 6s + 10 = (s+3)^2 + 1$. The constant $2$ is $2$ times $b = 1$, so we keep the factor $2$ and use the sine entry. The first shifting theorem with $a = 3$ gives 2e^(-3t) sin(t).'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{3s + 10}{(s + 2)^2}\right\}$.'
            answer: '3e^(-2t) + 4t e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Write $3s + 10 = 3(s + 2) + 4$. Then the fraction splits into $\frac{3}{s+2} + \frac{4}{(s+2)^2}$. The first term inverts to $3e^{-2t}$ and the second to $4te^{-2t}$, so the answer is 3e^(-2t) + 4t e^(-2t).'
          - problem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{1}{s^{2} + 4 s + 13}\right\}$.'
            answer: 'e^(-2t) sin(3t)/3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Complete the square: $s^2 + 4s + 13 = (s+2)^2 + 9$. The numerator is $1$, but the sine entry needs $b = 3$ on top, so write $\frac{1}{3}\cdot\frac{3}{(s+2)^2 + 9}$. The first shifting theorem then gives e^(-2t) sin(3t)/3.'
          - problem: 'The displacement $x(t)$, in metres, of a damped spring has Laplace transform $X(s) = \dfrac{3 s + 7}{s^{2} + 2 s + 10}$. Find $x(t)$.'
            answer: '3e^(-t) cos(3t) + 4e^(-t) sin(3t)/3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Complete the square: $s^2 + 2s + 10 = (s+1)^2 + 9$. Write $3s + 7 = 3(s + 1) + 4$, which gives $3\cdot\frac{s+1}{(s+1)^2+9} + \frac{4}{3}\cdot\frac{3}{(s+1)^2+9}$. Inverting each term gives 3e^(-t) cos(3t) + 4e^(-t) sin(3t)/3.'
          - problem: 'The current $i(t)$ in a circuit has Laplace transform $I(s) = \dfrac{1}{(s+2)^2}$. How large is the current at $t = 1$?'
            answer: 'e^(-2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The table entry for $1/s^2$ is $t$, and the shift $s \to s + 2$ multiplies it by $e^{-2t}$. So $i(t) = te^{-2t}$. At $t = 1$ this is $e^{-2}$.'
          - problem: 'Maya inverts $\dfrac{1}{s^2 + 2s + 10}$ and writes $\dfrac{1}{3}\sin 3t$. What is the correct inverse Laplace transform?'
            answer: 'e^(-t) sin(3t)/3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Maya forgot to complete the square. Since $s^2 + 2s + 10 = (s+1)^2 + 9$, the sine term needs the shift $a = 1$ and carries the factor $e^{-t}$. The correct inverse is e^(-t) sin(3t)/3.'
        constraints: "irreducible quadratics complete to (s+a)^2 + b^2 with integer a, b; repeated linear factors to power 2 only"
    diagnostic_exemplar:
      problem: 'Compute $\mathcal{L}^{-1}\left\{\dfrac{s + 5}{s^2 + 4s + 13}\right\}$.'
      answer: '$e^{-2t}\cos 3t + e^{-2t}\sin 3t$'
      solution_sketch: '$s^2 + 4s + 13 = (s+2)^2 + 9$ and $s + 5 = (s + 2) + 3$, so the transform splits as $\frac{s+2}{(s+2)^2+9} + \frac{3}{(s+2)^2+9}$.'
    anki_seeds:
      - front: 'Inverse transform of $\dfrac{1}{(s-a)^2}$?'
        back: '$te^{at}$'
        type: basic
      - front: 'To invert $\dfrac{1}{s^2 + 2as + c}$ with an irreducible denominator, first...'
        back: 'complete the square to $(s+a)^2 + b^2$, then match the shifted sine/cosine entries.'
        type: basic

  - id: laplace-of-derivatives
    name: Transforms of Derivatives
    core: true
    difficulty: 0.74
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: laplace-transform-basics
        weight: 0.6
        key: true
      - id: laplace-table-linearity
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: The derivative formulas
        key_prerequisites: [laplace-transform-basics]
        step_check:
          step: 'Identify the formula for the Laplace transform of the second derivative'
          question: 'Why does the formula for $\mathcal{L}\{y''''\}$ contain the initial values $y(0)$ and $y''(0)$?'
          options:
            - 'Each integration brings in an arbitrary constant, and $y(0)$ and $y''(0)$ are those constants'
            - 'Integration by parts, used twice, leaves boundary terms at $t = 0$ in the result'
            - 'The integral runs to infinity, so the formula needs the limits of $y$ and $y''$ at $t \to \infty$'
          answer: 'Integration by parts, used twice, leaves boundary terms at $t = 0$ in the result'
          why: 'The transform of $y''''$ is an integral of $y''''e^{-st}$. Integrating by parts twice produces $s^2Y$ and the boundary terms $-s\,y(0) - y''(0)$ at $t = 0$.'
        try_first:
          problem: 'Let $y = e^{3t}$, so $y\'' = 3e^{3t}$. What is $\mathcal{L}\{y\''\}$ when $s = 5$?'
          answer_contract: {"kind": "exact"}
          answer: '3/2'
          reveal: 'The transform of $y''$ is $\frac{3}{s-3}$. It equals $sY - y(0)$ with $Y = \frac{1}{s-3}$ and $y(0) = 1$, so the rule is: multiply $Y$ by $s$, then subtract the starting value.'
        exemplars:
          - problem: 'Let $Y = \mathcal{L}\{y\}$. If $y(0) = 3$ and $y''(0) = 4$, find $\mathcal{L}\{y''''\}$ in terms of $Y$.'
            answer: 's^2 Y - 3s - 4'
            answer_contract: {"kind": "function", "vars": ["s", "Y"]}
            solution_sketch: 'The second-derivative formula is $\mathcal{L}\{y''''\} = s^2Y - s\,y(0) - y''(0)$. Substitute $y(0) = 3$ and $y''(0) = 4$. The result is s^2 Y - 3s - 4.'
          - problem: 'Let $Y = \mathcal{L}\{y\}$. If $y(0) = 5$, find $\mathcal{L}\{y''\}$ in terms of $Y$.'
            answer: 's Y - 5'
            answer_contract: {"kind": "function", "vars": ["s", "Y"]}
            solution_sketch: 'The first-derivative formula is $\mathcal{L}\{y''\} = sY - y(0)$. Substitute $y(0) = 5$. The result is s Y - 5.'
          - problem: 'Let $Y = \mathcal{L}\{y\}$. If $y(0) = -2$ and $y''(0) = 6$, find $\mathcal{L}\{y''''\}$ in terms of $Y$.'
            answer: 's^2 Y + 2s - 6'
            answer_contract: {"kind": "function", "vars": ["s", "Y"]}
            solution_sketch: 'The second-derivative formula is $\mathcal{L}\{y''''\} = s^2Y - s\,y(0) - y''(0)$. Substitute $y(0) = -2$ and $y''(0) = 6$. The result is s^2 Y + 2s - 6.'
          - problem: 'Let $Y(s) = \mathcal{L}\{y\}$, with $y(0) = 4$ and $Y(s) = \dfrac{1}{s + 3}$. Find $\mathcal{L}\{y''\}$.'
            answer: 's/(s + 3) - 4'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'By the first-derivative formula, $\mathcal{L}\{y''\} = sY(s) - y(0)$. Substitute $Y(s) = \frac{1}{s+3}$ and $y(0) = 4$. The result is s/(s + 3) - 4.'
          - problem: 'Let $Y(s) = \mathcal{L}\{y\}$, with $y(0) = 2$, $y''(0) = -1$ and $Y(s) = \dfrac{1}{s + 1}$. Find $\mathcal{L}\{y''''\}$.'
            answer: 's^2/(s + 1) - 2s + 1'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'By the second-derivative formula, $\mathcal{L}\{y''''\} = s^2Y(s) - s\,y(0) - y''(0)$. Substitute $Y(s) = \frac{1}{s+1}$, $y(0) = 2$ and $y''(0) = -1$, so the last term is $-(-1) = +1$. The result is s^2/(s + 1) - 2s + 1.'
          - problem: 'Let $Y(s) = \mathcal{L}\{y\}$, with $y(0) = 3$, $y''(0) = 7$ and $Y(s) = \dfrac{1}{s + 4}$. Find $\mathcal{L}\{y''''\}$.'
            answer: 's^2/(s + 4) - 3s - 7'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'By the second-derivative formula, $\mathcal{L}\{y''''\} = s^2Y(s) - s\,y(0) - y''(0)$. Substitute $Y(s) = \frac{1}{s+4}$, $y(0) = 3$ and $y''(0) = 7$. The result is s^2/(s + 4) - 3s - 7.'
          - problem: 'A mass on a spring is released from the position $y(0) = 2$ m with velocity $y''(0) = -1$ m/s. Let $Y = \mathcal{L}\{y\}$. Find the transform of the acceleration $y''''$ in terms of $Y$.'
            answer: 's^2 Y - 2s + 1'
            answer_contract: {"kind": "function", "vars": ["s", "Y"]}
            solution_sketch: 'The acceleration is $y''''$, so use $\mathcal{L}\{y''''\} = s^2Y - s\,y(0) - y''(0)$. Substitute $y(0) = 2$ and $y''(0) = -1$. The result is s^2 Y - 2s + 1.'
          - problem: 'The salt in a tank starts at $y(0) = 8$ kg. Let $Y = \mathcal{L}\{y\}$. Find the transform of the rate of change $\dfrac{dy}{dt}$ in terms of $Y$.'
            answer: 's Y - 8'
            answer_contract: {"kind": "function", "vars": ["s", "Y"]}
            solution_sketch: 'The rate of change is the first derivative, so use $\mathcal{L}\{y''\} = sY - y(0)$. Substitute $y(0) = 8$. The result is s Y - 8.'
          - problem: 'Sam writes $\mathcal{L}\{y''\} = sY + 4$ for a function with $y(0) = 4$. What is the correct expression for $\mathcal{L}\{y''\}$ in terms of $Y$?'
            answer: 's Y - 4'
            answer_contract: {"kind": "function", "vars": ["s", "Y"]}
            solution_sketch: 'Sam added the initial value. The formula subtracts it: $\mathcal{L}\{y''\} = sY - y(0)$. With $y(0) = 4$ the correct expression is s Y - 4.'
          - problem: 'The function $y = e^{2t}$ has $Y(s) = \dfrac{1}{s-2}$. Use the formula for the transform of a derivative to find $\mathcal{L}\{y''\}$.'
            answer: '2/(s - 2)'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'Here $y(0) = 1$, so $\mathcal{L}\{y''\} = sY - y(0) = \frac{s}{s-2} - 1$. Combine over the common denominator to get $\frac{2}{s-2}$. This agrees with the direct transform of $y'' = 2e^{2t}$, which is 2/(s - 2).'
          - problem: 'Let $Y = \mathcal{L}\{y\}$ and let $y(0) = a$. Express $\mathcal{L}\{y''\}$ in terms of $s$, $Y$ and $a$.'
            answer: 's Y - a'
            answer_contract: {"kind": "function", "vars": ["s", "Y", "a"]}
            solution_sketch: 'The first-derivative formula is $\mathcal{L}\{y''\} = sY - y(0)$. Replace $y(0)$ by the symbol $a$, because no number is given. The result is s Y - a.'
          - problem: 'Let $Y = \mathcal{L}\{y\}$, $y(0) = a$ and $y''(0) = 5$. Express $\mathcal{L}\{y''''\}$ in terms of $s$, $Y$ and $a$.'
            answer: 's^2 Y - a s - 5'
            answer_contract: {"kind": "function", "vars": ["s", "Y", "a"]}
            solution_sketch: 'The second-derivative formula is $\mathcal{L}\{y''''\} = s^2Y - s\,y(0) - y''(0)$. Replace $y(0)$ by $a$ and $y''(0)$ by $5$. The result is s^2 Y - a s - 5.'
        constraints: "first and second derivatives only; initial conditions given at t = 0"
      - id: kp2
        name: From ODE to algebra
        key_prerequisites: [laplace-transform-basics]
        step_check:
          step: '$(s^2Y - s y(0) - y''(0)) - 3(sY - y(0)) + 2Y = 0$'
          question: 'Why is the middle term written as $-3(sY - y(0))$ and not just $-3sY$?'
          options:
            - 'Each derivative has its own initial value, and $-3$ multiplies both parts'
            - 'The factor $-3$ turns $Y$ into $-3Y$ and leaves the $s$ out of that term'
            - 'The initial value is subtracted once only, from the highest derivative in it'
          answer: 'Each derivative has its own initial value, and $-3$ multiplies both parts'
          why: 'The term is $-3y''$, and $\mathcal{L}\{y''\} = sY - y(0)$. The constant $-3$ multiplies both parts, so $-3y(0)$ appears too.'
        exemplars:
          - problem: 'Transform the initial value problem $y'' + 2y = 0$, $y(0) = 3$, and solve for $Y(s)$.'
            answer: '3/(s + 2)'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'Transform each term with $\mathcal{L}\{y''\} = sY - y(0)$ and use the initial value. Collecting the $Y$ terms gives $(s + 2)Y = 3$. Dividing by the coefficient of $Y$ gives 3/(s + 2).'
          - problem: 'Transform the initial value problem $y'''' + 4y = 0$, $y(0) = 1$, $y''(0) = 0$, and solve for $Y(s)$.'
            answer: 's/(s^2 + 4)'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'Transform each term with $\mathcal{L}\{y''\} = sY - y(0)$ and $\mathcal{L}\{y''''\} = s^2Y - s\,y(0) - y''(0)$, and use the initial values. Collecting the $Y$ terms gives $(s^{2} + 4)Y = s$. Dividing by the coefficient of $Y$ gives s/(s^2 + 4).'
          - problem: 'Transform the initial value problem $y'' - 5y = e^{2t}$, $y(0) = 0$, and solve for $Y(s)$.'
            answer: '1/((s - 2)(s - 5))'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'Transform each term with $\mathcal{L}\{y''\} = sY - y(0)$ and use the initial value. Collecting the $Y$ terms gives $(s - 5)Y = \frac{1}{s - 2}$. Dividing by the coefficient of $Y$ gives 1/((s - 2)(s - 5)).'
          - problem: 'Transform the initial value problem $y'' + 7y = 0$, $y(0) = 4$, and solve for $Y(s)$.'
            answer: '4/(s + 7)'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'Transform each term with $\mathcal{L}\{y''\} = sY - y(0)$ and use the initial value. Collecting the $Y$ terms gives $(s + 7)Y = 4$. Dividing by the coefficient of $Y$ gives 4/(s + 7).'
          - problem: 'Transform the initial value problem $y'''' + 9y = 0$, $y(0) = 2$, $y''(0) = 3$, and solve for $Y(s)$.'
            answer: '(2s + 3)/(s^2 + 9)'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'Transform each term with $\mathcal{L}\{y''\} = sY - y(0)$ and $\mathcal{L}\{y''''\} = s^2Y - s\,y(0) - y''(0)$, and use the initial values. Collecting the $Y$ terms gives $(s^{2} + 9)Y = 2 s + 3$. Dividing by the coefficient of $Y$ gives (2s + 3)/(s^2 + 9).'
          - problem: 'Transform the initial value problem $y'' - 4y = e^{3t}$, $y(0) = 0$, and solve for $Y(s)$.'
            answer: '1/((s - 3)(s - 4))'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'Transform each term with $\mathcal{L}\{y''\} = sY - y(0)$ and use the initial value. Collecting the $Y$ terms gives $(s - 4)Y = \frac{1}{s - 3}$. Dividing by the coefficient of $Y$ gives 1/((s - 3)(s - 4)).'
          - problem: 'A bacteria population $y$, in thousands, grows at a rate equal to $3$ times its size, and $y(0) = 5$. Write the differential equation, transform it, and solve for $Y(s)$.'
            answer: '5/(s - 3)'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'The growth rate $y''$ equals $3y$, so $y'' - 3y = 0$ with $y(0) = 5$. Transform each term with $\mathcal{L}\{y''\} = sY - y(0)$ and use the initial value. Collecting the $Y$ terms gives $(s - 3)Y = 5$. Dividing by the coefficient of $Y$ gives 5/(s - 3).'
          - problem: 'A cup of coffee at $90\,^\circ$C stands in a room at $20\,^\circ$C. Its temperature $T$ (in $^\circ$C, with $t$ in minutes) falls at a rate equal to $2$ times the excess $T - 20$. Write the differential equation and transform it. Let $Y = \mathcal{L}\{T\}$ and solve for $Y(s)$.'
            answer: '(90s + 40)/(s(s + 2))'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'The temperature obeys $T'' = -2(T - 20)$, so $T'' + 2T = 40$ with $T(0) = 90$. Transform each term with $\mathcal{L}\{T''\} = sY - T(0)$ and use the initial value. Collecting the $Y$ terms gives $(s + 2)Y = 90 + \frac{40}{s}$. Dividing by the coefficient of $Y$ gives (90s + 40)/(s(s + 2)).'
          - problem: 'A $2$ kg mass on a spring of stiffness $32$ N/m is pulled to $y(0) = 3$ m and released from rest, so $2y'''' + 32y = 0$. Transform the equation and solve for $Y(s)$.'
            answer: '3s/(s^2 + 16)'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'Transform each term: $2(s^2Y - 3s - 0) + 32Y = 0$, so $(2s^2 + 32)Y = 6s$. Divide both sides by $2$ to get $(s^2 + 16)Y = 3s$. Hence $Y(s) = $ 3s/(s^2 + 16).'
          - problem: 'Alex transforms $y'' + 3y = 6$, $y(0) = 4$ and writes $(s + 3)Y = \frac{6}{s} - 4$. What is the correct $Y(s)$?'
            answer: '(4s + 6)/(s(s + 3))'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'Transform each term with $\mathcal{L}\{y''\} = sY - y(0)$ and use the initial value. Collecting the $Y$ terms gives $(s + 3)Y = 4 + \frac{6}{s}$. Dividing by the coefficient of $Y$ gives (4s + 6)/(s(s + 3)). Alex subtracted the initial value on the right side, but it must be added there because the term $-y(0)$ on the left moves across.'
          - problem: 'Transform the initial value problem $y'''' + 3y'' + 2y = 0$, $y(0) = 1$, $y''(0) = 2$, and solve for $Y(s)$.'
            answer: '(s + 5)/((s + 1)(s + 2))'
            answer_contract: {"kind": "function", "vars": ["s"]}
            solution_sketch: 'Transform each term with $\mathcal{L}\{y''\} = sY - y(0)$ and $\mathcal{L}\{y''''\} = s^2Y - s\,y(0) - y''(0)$, and use the initial values. Collecting the $Y$ terms gives $(s^{2} + 3 s + 2)Y = s + 5$. Dividing by the coefficient of $Y$ gives (s + 5)/((s + 1)(s + 2)).'
        constraints: "solve for Y(s) only, no inversion; forcing 0 or e^{at}; initial conditions integers"
    diagnostic_exemplar:
      problem: 'Transform the initial value problem $y'''' + 4y'' + 3y = 0$, $y(0) = 2$, $y''(0) = -1$, and solve for $Y(s)$.'
      answer: '$(2s + 7)/(s^2 + 4s + 3)$'
      solution_sketch: '$\mathcal{L}\{y''''\} = s^2Y - 2s + 1$ and $\mathcal{L}\{y''\} = sY - 2$, so $(s^2 + 4s + 3)Y = 2s - 1 + 8 = 2s + 7$.'
    anki_seeds:
      - front: 'Laplace transform of $y''$ in terms of $Y(s)$?'
        back: '$sY(s) - y(0)$'
        type: basic
      - front: 'Laplace transform of $y''''$ in terms of $Y(s)$?'
        back: '$s^2 Y(s) - s\,y(0) - y''(0)$'
        type: basic

  - id: laplace-first-order-ivp
    name: First-Order IVPs via Laplace
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: laplace-of-derivatives
        weight: 0.6
        key: true
      - id: inverse-laplace-partial-fractions
        weight: 0.5
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: Homogeneous first-order IVPs
        key_prerequisites: [laplace-of-derivatives]
        step_check:
          step: 'Using the Laplace transform of the derivative and the initial condition $y(0) = 3$'
          question: 'Why does the equation $sY(s) - 3 + 5Y(s) = 0$ contain the number $-3$?'
          options:
            - 'The number $3$ comes from the coefficient $5$ after the whole equation is divided by $s$'
            - 'The derivative rule subtracts the initial value, and here $y(0) = 3$'
            - 'Every transformed equation starts with $-3$ to balance the term $5Y(s)$ on its left side'
          answer: 'The derivative rule subtracts the initial value, and here $y(0) = 3$'
          why: 'The rule is $\mathcal{L}\{y''\} = sY(s) - y(0)$. With $y(0) = 3$ the transform of $y''$ is $sY(s) - 3$, and that is where $-3$ comes from.'
        exemplars:
          - problem: 'Solve $y'' + 3y = 0$, $y(0) = 2$ using the Laplace transform.'
            answer: '2e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s + 3)Y = 2$, so $Y(s) = \frac{2}{s + 3}$. This is already a table entry, so no partial fractions are needed. Inverting term by term gives 2e^(-3t).'
          - problem: 'Solve $y'' - 4y = 0$, $y(0) = -1$ using the Laplace transform.'
            answer: '-e^(4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s - 4)Y = -1$, so $Y(s) = - \frac{1}{s - 4}$. This is already a table entry, so no partial fractions are needed. Inverting term by term gives -e^(4t).'
          - problem: 'Solve $y'' + 5y = 0$, $y(0) = 3$ using the Laplace transform.'
            answer: '3e^(-5t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s + 5)Y = 3$, so $Y(s) = \frac{3}{s + 5}$. This is already a table entry, so no partial fractions are needed. Inverting term by term gives 3e^(-5t).'
          - problem: 'Solve $y'' - 2y = 0$, $y(0) = 5$ using the Laplace transform.'
            answer: '5e^(2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s - 2)Y = 5$, so $Y(s) = \frac{5}{s - 2}$. This is already a table entry, so no partial fractions are needed. Inverting term by term gives 5e^(2t).'
          - problem: 'Solve $y'' + 7y = 0$, $y(0) = -2$ using the Laplace transform.'
            answer: '-2e^(-7t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s + 7)Y = -2$, so $Y(s) = - \frac{2}{s + 7}$. This is already a table entry, so no partial fractions are needed. Inverting term by term gives -2e^(-7t).'
          - problem: 'Solve $y'' - 6y = 0$, $y(0) = 2$ using the Laplace transform.'
            answer: '2e^(6t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s - 6)Y = 2$, so $Y(s) = \frac{2}{s - 6}$. This is already a table entry, so no partial fractions are needed. Inverting term by term gives 2e^(6t).'
          - problem: 'A sample holds $80$ g of a radioactive isotope and loses mass at a rate equal to $3$ times the mass present, per hour. Use the Laplace transform to find the mass $m(t)$ in grams after $t$ hours.'
            answer: '80e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s + 3)Y = 80$, so $Y(s) = \frac{80}{s + 3}$. This is already a table entry, so no partial fractions are needed. Inverting term by term gives 80e^(-3t).'
          - problem: 'A sample of $50$ mg loses mass at a rate equal to $2$ times the mass present, per hour. Use the Laplace transform to find after how many hours half of the sample is left, to two decimal places.'
            answer: '0.35'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The equation is $m'' = -2m$ with $m(0) = 50$. Transforming gives $(s + 2)M = 50$, so $m(t) = 50e^{-2t}$. Half is left when $e^{-2t} = \frac{1}{2}$, so $t = \frac{\ln 2}{2} \approx 0.35$ hours.'
          - problem: 'A town of $6$ thousand people grows so that its population increases at a rate equal to $4$ times the population, per year. Use the Laplace transform to find the population $P(t)$ in thousands after $t$ years.'
            answer: '6e^(4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s - 4)Y = 6$, so $Y(s) = \frac{6}{s - 4}$. This is already a table entry, so no partial fractions are needed. Inverting term by term gives 6e^(4t).'
          - problem: 'Jo transforms $y'' - 3y = 0$, $y(0) = 4$ and writes $(s - 3)Y = -4$. What is the correct solution $y(t)$?'
            answer: '4e^(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s - 3)Y = 4$, so $Y(s) = \frac{4}{s - 3}$. This is already a table entry, so no partial fractions are needed. Inverting term by term gives 4e^(3t). Jo moved the initial value to the wrong side: $sY - 4 - 3Y = 0$ means $(s-3)Y = +4$.'
          - problem: 'Solve $y'' + 2y = 0$, $y(0) = 7$ by the Laplace transform. What is $y(1)$?'
            answer: '7e^(-2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Transforming gives $(s + 2)Y = 7$, so $y(t) = 7e^{-2t}$. At $t = 1$ the value is $7e^{-2}$.'
