          - problem: 'A $4$ kg mass on a spring of stiffness $36$ N/m, with no damping, starts at $y(0) = 1$ m with velocity $6$ m/s. The motion obeys $4y'''' + 36y = 0$. Use the Laplace transform to find $y(t)$.'
