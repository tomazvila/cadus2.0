            - 'The split makes the denominator $(s+2)^2 + 9$ factor into two real linear factors here'
            - 'The split removes the initial conditions $y(0)$ and $y''(0)$ from the final answer there'
          answer: 'The part $s + 2$ matches the shifted cosine and the constant matches the shifted sine'
          why: 'With denominator $(s+2)^2 + 9$, the cosine entry needs $s + 2$ on top and the sine entry needs a constant. So $2s + 5 = 2(s+2) + 1$ gives one term of each kind.'
        exemplars:
          - problem: 'Solve $y'''' + y = 0$, $y(0) = 0$, $y''(0) = 1$ using the Laplace transform.'
