      - id: kp2
        name: First-order IVPs with forcing
        key_prerequisites: [laplace-of-derivatives, inverse-laplace-partial-fractions]
        step_check:
          step: 'Decompose the second term using partial fractions'
          question: 'Why is the second term decomposed into partial fractions at this step?'
          options:
            - 'The fraction $\frac{5}{(s+3)(s-4)}$ has two factors, so no table entry inverts it whole'
            - 'Partial fractions are needed only to make the initial condition $y(0) = 2$ disappear from it'
            - 'The table inverts only fractions with a constant numerator, so the factor $5$ must be removed first'
          answer: 'The fraction $\frac{5}{(s+3)(s-4)}$ has two factors, so no table entry inverts it whole'
          why: 'The table inverts $\frac{1}{s-a}$, one factor at a time. Splitting $\frac{5}{(s+3)(s-4)}$ into $\frac{A}{s+3} + \frac{B}{s-4}$ gives terms that match the table.'
        exemplars:
          - problem: 'Solve $y'' - y = e^{2t}$, $y(0) = 0$ using the Laplace transform.'
            answer: 'e^(2t) - e^t'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s - 1)Y = \frac{1}{s - 2}$, so $Y(s) = \frac{1}{\left(s - 2\right) \left(s - 1\right)}$. Partial fractions give $Y(s) = - \frac{1}{s - 1} + \frac{1}{s - 2}$. Inverting term by term gives e^(2t) - e^t.'
          - problem: 'Solve $y'' + 2y = 4$, $y(0) = 1$ using the Laplace transform.'
            answer: '2 - e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s + 2)Y = \frac{s + 4}{s}$, so $Y(s) = \frac{s + 4}{s \left(s + 2\right)}$. Partial fractions give $Y(s) = - \frac{1}{s + 2} + \frac{2}{s}$. Inverting term by term gives 2 - e^(-2t).'
          - problem: 'Solve $y'' + y = e^{-t}$, $y(0) = 1$ using the Laplace transform.'
            answer: 'e^(-t) + t e^(-t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s + 1)Y = \frac{s + 2}{s + 1}$, so $Y(s) = \frac{s + 2}{\left(s + 1\right)^{2}}$. Partial fractions give $Y(s) = \frac{1}{s + 1} + \frac{1}{\left(s + 1\right)^{2}}$. Inverting term by term gives e^(-t) + t e^(-t).'
          - problem: 'Solve $y'' + 3y = 6$, $y(0) = 0$ using the Laplace transform.'
            answer: '2 - 2e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s + 3)Y = \frac{6}{s}$, so $Y(s) = \frac{6}{s \left(s + 3\right)}$. Partial fractions give $Y(s) = - \frac{2}{s + 3} + \frac{2}{s}$. Inverting term by term gives 2 - 2e^(-3t).'
          - problem: 'Solve $y'' - 2y = e^{3t}$, $y(0) = 2$ using the Laplace transform.'
            answer: 'e^(2t) + e^(3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s - 2)Y = \frac{2 s - 5}{s - 3}$, so $Y(s) = \frac{2 s - 5}{\left(s - 3\right) \left(s - 2\right)}$. Partial fractions give $Y(s) = \frac{1}{s - 2} + \frac{1}{s - 3}$. Inverting term by term gives e^(2t) + e^(3t).'
          - problem: 'Solve $y'' - 4y = 8$, $y(0) = 1$ using the Laplace transform.'
            answer: '-2 + 3e^(4t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s - 4)Y = \frac{s + 8}{s}$, so $Y(s) = \frac{s + 8}{s \left(s - 4\right)}$. Partial fractions give $Y(s) = \frac{3}{s - 4} - \frac{2}{s}$. Inverting term by term gives -2 + 3e^(4t).'
          - problem: 'A cup of coffee at $90\,^\circ$C stands in a room at $20\,^\circ$C. Its temperature $T$ falls at a rate equal to $2$ times the excess $T - 20$, with $t$ in minutes. Use the Laplace transform to find $T(t)$.'
            answer: '20 + 70e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s + 2)Y = 90 + \frac{40}{s}$, so $Y(s) = \frac{10 \left(9 s + 4\right)}{s \left(s + 2\right)}$. Partial fractions give $Y(s) = \frac{70}{s + 2} + \frac{20}{s}$. Inverting term by term gives 20 + 70e^(-2t).'
          - problem: 'A cup of coffee at $90\,^\circ$C stands in a room at $20\,^\circ$C. Its temperature $T$ falls at a rate equal to $2$ times the excess $T - 20$, with $t$ in minutes. Use the Laplace transform to find how many minutes pass until the coffee is $30\,^\circ$C. Round to two decimal places.'
            answer: '0.97'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The equation is $T'' = -2(T - 20)$, so $T'' + 2T = 40$ with $T(0) = 90$. Transforming and inverting gives $T(t) = 20 + 70e^{-2t}$. Setting $T = 30$ gives $e^{-2t} = \frac{1}{7}$, so $t = \frac{\ln 7}{2} \approx 0.97$ minutes.'
          - problem: 'A tank holds $50$ L of pure water. Brine with $2$ kg of salt per litre flows in at $5$ L/min, and the well-mixed solution flows out at $5$ L/min. Use the Laplace transform to find the amount of salt $A(t)$ in kilograms after $t$ minutes.'
            answer: '100 - 100e^(-t/10)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s + \frac{1}{10})Y = \frac{10}{s}$, so $Y(s) = \frac{100}{s \left(10 s + 1\right)}$. Partial fractions give $Y(s) = - \frac{1000}{10 s + 1} + \frac{100}{s}$. Inverting term by term gives 100 - 100e^(-t/10). The inflow brings $5 \cdot 2 = 10$ kg per minute, and the outflow removes $\frac{5}{50}A = \frac{A}{10}$ kg per minute, so $A'' = 10 - \frac{A}{10}$.'
          - problem: 'Lee solves $y'' + 2y = 6$, $y(0) = 0$ and writes $Y = \frac{6}{s + 2}$. What is the correct solution $y(t)$?'
            answer: '3 - 3e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Transform the equation with the derivative formulas and the initial values. This gives $(s + 2)Y = \frac{6}{s}$, so $Y(s) = \frac{6}{s \left(s + 2\right)}$. Partial fractions give $Y(s) = - \frac{3}{s + 2} + \frac{3}{s}$. Inverting term by term gives 3 - 3e^(-2t). Lee transformed the constant $6$ as $6$, but $\mathcal{L}\{6\} = \frac{6}{s}$.'
          - problem: 'Solve $y'' + 4y = 8$, $y(0) = 3$ by the Laplace transform. Which constant value does $y(t)$ approach as $t$ grows without bound?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Transforming gives $(s + 4)Y = 3 + \frac{8}{s}$, and partial fractions give $Y = \frac{2}{s} + \frac{1}{s + 4}$. So $y = 2 + e^{-4t}$. The exponential tends to $0$, so $y$ approaches $2$.'
        constraints: "forcing constant or e^{at}; partial fractions with two distinct linear factors at most; a repeated factor only via the shift"
    diagnostic_exemplar:
      problem: 'Solve $y'' + 2y = 6$, $y(0) = 4$, using the Laplace transform.'
      answer: '$y = 3 + e^{-2t}$'
      solution_sketch: '$(s+2)Y = 4 + \frac{6}{s}$, so $Y = \frac{4s + 6}{s(s+2)} = \frac{3}{s} + \frac{1}{s+2}$.'
