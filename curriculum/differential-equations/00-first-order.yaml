      - front: "Exactness test for M dx + N dy = 0?"
        back: '$\partial M/\partial y = \partial N/\partial x$ (on a rectangle).'
        type: basic
      - front: "The solution of an exact equation M dx + N dy = 0 is..."
        back: "$F(x,y) = C$, where $F_x = M$ and $F_y = N$."
        type: basic

  - id: integrating-factors-for-exactness
    name: Integrating Factors for Exactness
    core: false                # extension of exact equations; terminal
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - id: exact-equations
        weight: 0.7
        key: true
      - id: integrating-factor-computation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Finding $\\mu(x)$"
        key_prerequisites: [exact-equations, integrating-factor-computation]
        step_check:
          step: '$\frac{y}{x(2x + y)}$ does not simplify to a function of $x$ alone'
          question: 'Why does the method for $\mu(x)$ fail for this equation?'
          options:
            - 'Because $y$ stays in the quotient, so $\mu$ would depend on $y$ as well as $x$'
            - 'Because the quotient is positive here, and an integrating factor must be negative'
            - 'Because $N$ contains $x$, and this method only works when $N$ is a constant'
            - 'Because the quotient has $x$ in its denominator, which makes the integral undefined'
          answer: 'Because $y$ stays in the quotient, so $\mu$ would depend on $y$ as well as $x$'
          why: 'The formula $\mu = e^{\int p\,dx}$ needs $p$ to depend on $x$ alone. A leftover $y$ cannot be integrated with respect to $x$, so this route fails.'
        exemplars:
          - problem: 'The equation $(3xy + y^2)\,dx + (x^2 + xy)\,dy = 0$ is not exact. Find an integrating factor $\mu(x)$, taking the constant of integration to be $0$.'
            answer: 'x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $M_y = 3x + 2y$ and $N_x = 2x + y$, so $M_y - N_x = x + y$. Then $\frac{M_y - N_x}{N} = \frac{x + y}{x(x + y)} = \frac{1}{x}$, which depends on $x$ alone. So $\mu = e^{\int dx/x} = x$.'
          - problem: 'For $2y\,dx + x\,dy = 0$, compute $\dfrac{M_y - N_x}{N}$.'
            answer: '1/x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $M = 2y$ and $N = x$, so $M_y = 2$ and $N_x = 1$. Then $\frac{M_y - N_x}{N} = \frac{2 - 1}{x} = \frac{1}{x}$.'
          - problem: 'Is $\dfrac{M_y - N_x}{N}$ a function of $x$ alone for $(5y + x^2)\,dx + x\,dy = 0$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "a function of x alone"], ["no", "it is not", "not a function of x alone"]]}
            solution_sketch: 'Here $M_y = 5$, $N_x = 1$ and $N = x$. So $\frac{M_y - N_x}{N} = \frac{4}{x}$. This depends on $x$ alone.'
          - problem: 'The equation $(3y + x)\,dx + x\,dy = 0$ is not exact. Find the integrating factor $\mu(x)$, taking the constant of integration to be $0$.'
            answer: 'x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $M_y = 3$ and $N_x = 1$, so $\frac{M_y - N_x}{N} = \frac{2}{x}$. Then $\mu = e^{\int 2/x\,dx} = e^{2\ln x} = x^2$.'
          - problem: 'The linear equation $y'' + 3y = e^{-x}$ can be written as $(3y - e^{-x})\,dx + dy = 0$, which is not exact. Find the integrating factor $\mu(x)$, taking the constant of integration to be $0$.'
            answer: 'e^(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $M_y = 3$ and $N_x = 0$, and $N = 1$. So $\frac{M_y - N_x}{N} = 3$. Then $\mu = e^{\int 3\,dx} = e^{3x}$.'
          - problem: 'Sam finds $\dfrac{M_y - N_x}{N} = \dfrac{3}{x}$ for $(4y + x)\,dx + x\,dy = 0$ and writes $\mu(x) = e^{3/x}$. What is the correct integrating factor?'
            answer: 'x^3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $M_y = 4$ and $N_x = 1$, so $\frac{M_y - N_x}{N} = \frac{3}{x}$. The integrating factor is $e^{\int p\,dx}$, so we integrate $\frac{3}{x}$ and do not use it as the exponent. Then $\mu = e^{3\ln x} = x^3$.'
          - problem: 'In suitable units, the heat added to a gas is $\delta Q = dT + \dfrac{T}{V}\,dV$, which is not exact. Find an integrating factor $\mu(T)$, taking the constant of integration to be $0$.'
            answer: '1/T'
            answer_contract: {"kind": "function", "vars": ["T"]}
            solution_sketch: 'Here $M = 1$ and $N = \frac{T}{V}$, so $M_V = 0$ and $N_T = \frac{1}{V}$. Then $\frac{M_V - N_T}{N} = \frac{-1/V}{T/V} = -\frac{1}{T}$. So $\mu = e^{-\ln T} = \frac{1}{T}$.'
          - problem: 'For a differential equation, $\dfrac{M_y - N_x}{N} = \dfrac{4}{x}$. Find the integrating factor $\mu(x)$, taking the constant of integration to be $0$.'
            answer: 'x^4'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $\mu = e^{\int 4/x\,dx}$. The integral is $4\ln x$, so $\mu = e^{4\ln x} = x^4$.'
          - problem: 'The equation $(2y + x)\,dx + dy = 0$ is not exact. Find the integrating factor $\mu(x)$, taking the constant of integration to be $0$.'
            answer: 'e^(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $M_y = 2$, $N_x = 0$ and $N = 1$. So $\frac{M_y - N_x}{N} = 2$. Then $\mu = e^{\int 2\,dx} = e^{2x}$.'
          - problem: 'Is $\dfrac{M_y - N_x}{N}$ a function of $x$ alone for $y\,dx + (2x + y^2)\,dy = 0$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "a function of x alone"], ["no", "it is not", "not a function of x alone"]]}
            solution_sketch: 'Here $M = y$ and $N = 2x + y^2$, so $M_y = 1$ and $N_x = 2$. Then $\frac{M_y - N_x}{N} = \frac{-1}{2x + y^2}$. This still contains $y$, so it is not a function of $x$ alone.'
          - problem: 'The equation $(x - y)\,dx + dy = 0$ is not exact. Find the integrating factor $\mu(x)$, taking the constant of integration to be $0$.'
            answer: 'e^(-x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $M_y = -1$, $N_x = 0$ and $N = 1$. So $\frac{M_y - N_x}{N} = -1$. Then $\mu = e^{\int -1\,dx} = e^{-x}$.'
        constraints: "(M_y - N_x)/N must simplify to a function of x alone (typically k/x); mu = e^{integral}"
      - id: kp2
        name: "Finding $\\mu(y)$"
        key_prerequisites: [exact-equations]
        step_check:
          step: 'Since this is a function of $y$ alone'
          question: 'Why must we check that the quotient is a function of $y$ alone before we use it?'
          options:
            - 'Because a quotient that contains $y$ would make $\mu$ negative for every $y$'
            - 'Because the formula for $\mu(y)$ only applies when $M$ is equal to $N$ everywhere'
            - 'Because the quotient has to be a positive constant for the integral to exist'
            - 'Because $\mu$ comes from an integral in $y$, and a leftover $x$ would block it'
          answer: 'Because $\mu$ comes from an integral in $y$, and a leftover $x$ would block it'
          why: 'The factor is $\mu = e^{\int p\,dy}$, which is an integral with respect to $y$. If $p$ still contained $x$, no function of $y$ alone could be an integrating factor.'
        exemplars:
          - problem: 'The equation $y\,dx + (2x + y^2)\,dy = 0$ is not exact. Find the integrating factor $\mu(y)$, taking the constant of integration to be $0$.'
            answer: 'y'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Here $M_y = 1$ and $N_x = 2$, so $\frac{N_x - M_y}{M} = \frac{1}{y}$. This depends on $y$ alone. Then $\mu = e^{\int dy/y} = y$.'
          - problem: 'Does the integrating factor of $y\,dx + (3x + y)\,dy = 0$ depend on $x$ or on $y$?'
            answer: 'y'
            answer_contract: {"kind": "label", "options": [["y", "a function of y", "it depends on y", "depends on y"], ["x", "a function of x", "it depends on x", "depends on x"]]}
            solution_sketch: 'Here $M_y = 1$ and $N_x = 3$. The quotient $\frac{M_y - N_x}{N} = \frac{-2}{3x + y}$ is not a function of $x$ alone. But $\frac{N_x - M_y}{M} = \frac{2}{y}$ depends on $y$ alone, so $\mu$ is a function of $y$.'
          - problem: 'The equation $y^2\,dx + (5xy + y^3)\,dy = 0$ is not exact. Find the integrating factor $\mu(y)$, taking the constant of integration to be $0$.'
            answer: 'y^3'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Here $M_y = 2y$ and $N_x = 5y$, so $\frac{N_x - M_y}{M} = \frac{3y}{y^2} = \frac{3}{y}$. Then $\mu = e^{3\ln y} = y^3$.'
          - problem: 'Suppose $x$ depends on $y$ through $\dfrac{dx}{dy} + \dfrac{2x}{y} = y$. The equation can be written $dx + \left(\dfrac{2x}{y} - y\right)dy = 0$, which is not exact. Find the integrating factor $\mu(y)$, taking the constant of integration to be $0$.'
            answer: 'y^2'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Here $M = 1$ and $N = \frac{2x}{y} - y$, so $M_y = 0$ and $N_x = \frac{2}{y}$. Then $\frac{N_x - M_y}{M} = \frac{2}{y}$. So $\mu = e^{2\ln y} = y^2$.'
          - problem: 'The equation $2y\,dx + (12x + y^3)\,dy = 0$ is not exact. Find the integrating factor $\mu(y)$, taking the constant of integration to be $0$.'
            answer: 'y^5'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Here $M_y = 2$ and $N_x = 12$, so $\frac{N_x - M_y}{M} = \frac{10}{2y} = \frac{5}{y}$. Then $\mu = e^{5\ln y} = y^5$.'
          - problem: 'Sam finds $\dfrac{N_x - M_y}{M} = \dfrac{3}{2y}$ for $2y\,dx + (5x + y)\,dy = 0$ and writes $\mu(y) = e^{3/(2y)}$. What is the correct integrating factor?'
            answer: 'y^(3/2)'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Here $M_y = 2$ and $N_x = 5$, so $\frac{N_x - M_y}{M} = \frac{3}{2y}$. The integrating factor is $e^{\int p\,dy}$, so we integrate $\frac{3}{2y}$. This gives $\mu = e^{\frac{3}{2}\ln y} = y^{3/2}$.'
          - problem: 'In suitable units, the heat added to a gas is $\delta Q = \dfrac{2T}{V}\,dV + 3\,dT$, which is not exact. Find an integrating factor $\mu(T)$, taking the constant of integration to be $0$.'
            answer: '1/T'
            answer_contract: {"kind": "function", "vars": ["T"]}
            solution_sketch: 'Take $V$ as the first variable, so $M = \frac{2T}{V}$ and $N = 3$. Then $M_T = \frac{2}{V}$ and $N_V = 0$, so $\frac{N_V - M_T}{M} = \frac{-2/V}{2T/V} = -\frac{1}{T}$. So $\mu = e^{-\ln T} = \frac{1}{T}$.'
          - problem: 'The equation $y^2\,dx + (8xy + 1)\,dy = 0$ is not exact. Find the integrating factor $\mu(y)$, taking the constant of integration to be $0$.'
            answer: 'y^6'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Here $M_y = 2y$ and $N_x = 8y$, so $\frac{N_x - M_y}{M} = \frac{6y}{y^2} = \frac{6}{y}$. Then $\mu = e^{6\ln y} = y^6$.'
          - problem: 'The equation $y\,dx + (5x + y^3)\,dy = 0$ is not exact. Find the integrating factor $\mu(y)$, taking the constant of integration to be $0$.'
            answer: 'y^4'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Here $M_y = 1$ and $N_x = 5$, so $\frac{N_x - M_y}{M} = \frac{4}{y}$. Then $\mu = e^{4\ln y} = y^4$.'
          - problem: 'The equation $dx + (2x + y)\,dy = 0$ is not exact. Find the integrating factor $\mu(y)$, taking the constant of integration to be $0$.'
            answer: 'e^(2y)'
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: 'Here $M = 1$, so $M_y = 0$, and $N_x = 2$. Then $\frac{N_x - M_y}{M} = 2$. So $\mu = e^{\int 2\,dy} = e^{2y}$.'
        constraints: "(N_x - M_y)/M must simplify to a function of y alone (typically k/y)"
      - id: kp3
        name: Completing the solution
        key_prerequisites: [exact-equations]
        step_check:
          step: 'Multiply the equation by $μ = x$ to make it exact'
          question: 'Why do we multiply both $M$ and $N$ by the same factor $\mu$?'
          options:
            - 'Because only $M$ needs the factor, and $N$ stays the same in the new equation that results'
            - 'Because the same nonzero factor on both parts keeps the solution curves unchanged'
            - 'Because $\mu$ cancels exactly the terms that made the equation not exact before'
            - 'Because the factor turns the original equation into a new one with new solutions'
          answer: 'Because the same nonzero factor on both parts keeps the solution curves unchanged'
          why: 'The equation $M\,dx + N\,dy = 0$ and the equation $\mu M\,dx + \mu N\,dy = 0$ have the same solutions when $\mu \neq 0$. So we can solve the exact one.'
        exemplars:
          - problem: 'Multiplying $2y\,dx + x\,dy = 0$ by $x$ gives an exact equation. Find a function $F(x, y)$ whose level curves $F(x, y) = C$ are the solution curves.'
            answer: 'x^2 y'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'The new equation is $2xy\,dx + x^2\,dy = 0$. Here $M_y = 2x = N_x$, so it is exact. Integrating $2xy$ in $x$ gives $F = x^2y$, and $F_y = x^2$ matches.'
          - problem: 'The factor $\mu = x$ makes $(3xy + y^2)\,dx + (x^2 + xy)\,dy = 0$ exact. Find a function $F(x, y)$ whose level curves $F(x, y) = C$ are the solution curves.'
            answer: 'x^3 y + x^2 y^2/2'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'The new equation is $(3x^2y + xy^2)\,dx + (x^3 + x^2y)\,dy = 0$. Integrating the $dx$ coefficient in $x$ gives $F = x^3y + \frac{1}{2}x^2y^2 + h(y)$. Then $F_y = x^3 + x^2y + h''(y)$, so $h''(y) = 0$.'
          - problem: 'The factor $\mu = y$ makes $y\,dx + (2x - e^y)\,dy = 0$ exact. Find a function $F(x, y)$ whose level curves $F(x, y) = C$ are the solution curves.'
            answer: 'x y^2 - (y - 1)e^y'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'The new equation is $y^2\,dx + (2xy - ye^y)\,dy = 0$. Integrating $y^2$ in $x$ gives $F = xy^2 + h(y)$. Then $h''(y) = -ye^y$, and integration by parts gives $h(y) = -(y - 1)e^y$.'
          - problem: 'The factor $\mu = y^3$ makes $y\,dx + 4x\,dy = 0$ exact. Find a function $F(x, y)$ whose level curves $F(x, y) = C$ are the solution curves.'
            answer: 'x y^4'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'The new equation is $y^4\,dx + 4xy^3\,dy = 0$. Here $M_y = 4y^3 = N_x$, so it is exact. Integrating $y^4$ in $x$ gives $F = xy^4$, and $F_y = 4xy^3$ matches.'
          - problem: 'The linear equation $y'' + 3y = e^{-x}$ is written $(3y - e^{-x})\,dx + dy = 0$. Multiplying by $\mu = e^{3x}$ makes it exact. Find a function $F(x, y)$ whose level curves $F(x, y) = C$ are the solution curves.'
            answer: 'y e^(3x) - e^(2x)/2'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'The new equation is $(3ye^{3x} - e^{2x})\,dx + e^{3x}\,dy = 0$. Integrating the $dx$ coefficient in $x$ gives $F = ye^{3x} - \frac{1}{2}e^{2x} + h(y)$. Then $F_y = e^{3x} + h''(y)$ matches $e^{3x}$, so $h''(y) = 0$.'
          - problem: 'In suitable units, the heat added to a gas is $\delta Q = dT + \dfrac{T}{V}\,dV$. Dividing by $T$ gives the exact form $dS$, where $S(T, V)$ is the entropy. Find $S(T, V)$.'
            answer: 'ln(T) + ln(V)'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["T", "V"]}
            solution_sketch: 'Dividing by $T$ gives $dS = \frac{1}{T}\,dT + \frac{1}{V}\,dV$. Then $S_T = \frac{1}{T}$ gives $S = \ln T + h(V)$. Matching $S_V = \frac{1}{V}$ gives $h(V) = \ln V$, so $S = \ln T + \ln V$.'
          - problem: 'Use $\mu = x$ to solve $2y\,dx + x\,dy = 0$ with $y(1) = 3$.'
            answer: '3/x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Multiplying by $x$ gives the exact equation $2xy\,dx + x^2\,dy = 0$ with $F = x^2y$. The condition $y(1) = 3$ gives $C = 1 \cdot 3 = 3$. So $x^2y = 3$ and $y = 3/x^2$.'
          - problem: 'Multiplying $y\,dx + (3x + y)\,dy = 0$ by $\mu = y^2$ gives an exact equation whose solutions satisfy $F(x, y) = C$. Find $C$ for the solution through $(1, 1)$.'
            answer: '5/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new equation is $y^3\,dx + (3xy^2 + y^3)\,dy = 0$. Integrating $y^3$ in $x$ gives $F = xy^3 + h(y)$, and matching $F_y$ gives $h(y) = \frac{y^4}{4}$. Then $C = F(1, 1) = 1 + \frac{1}{4} = \frac{5}{4}$.'
          - problem: 'The factor $\mu = x^2$ makes $3y^2\,dx + 2xy\,dy = 0$ exact. Find a function $F(x, y)$ whose level curves $F(x, y) = C$ are the solution curves.'
            answer: 'x^3 y^2'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'The new equation is $3x^2y^2\,dx + 2x^3y\,dy = 0$. Here $M_y = 6x^2y = N_x$, so it is exact. Integrating $3x^2y^2$ in $x$ gives $F = x^3y^2$, and $F_y = 2x^3y$ matches.'
          - problem: 'The factor $\mu = e^x$ makes $y\,dx + dy = 0$ exact. Find a function $F(x, y)$ whose level curves $F(x, y) = C$ are the solution curves.'
            answer: 'y e^x'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'The new equation is $ye^x\,dx + e^x\,dy = 0$. Here $M_y = e^x = N_x$, so it is exact. Integrating $ye^x$ in $x$ gives $F = ye^x$, and $F_y = e^x$ matches.'
        constraints: "after multiplying by mu the equation must pass the exactness test; reconstruct F as in exact equations"
    diagnostic_exemplar:
      problem: "Solve $y\\,dx + 3x\\,dy = 0$ by finding an integrating factor."
      answer: "$xy^3 = C$"
      answer_contract: {kind: none}
      solution_sketch: "$\\mu = y^2$ makes the equation $y^3\\,dx + 3xy^2\\,dy = d(xy^3) = 0$."
    anki_seeds:
      - front: "When does M dx + N dy = 0 admit an integrating factor mu(x)?"
        back: 'When $(M_y - N_x)/N$ is a function of $x$ alone; then $\mu = e^{\int (M_y - N_x)/N\,dx}$.'
        type: basic
      - front: "When does M dx + N dy = 0 admit an integrating factor mu(y)?"
        back: 'When $(N_x - M_y)/M$ is a function of $y$ alone; then $\mu = e^{\int (N_x - M_y)/M\,dy}$.'
        type: basic

  - id: natural-growth-decay-models
    name: Exponential Growth and Decay Models
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: separable-equations
        weight: 0.6
        key: true
      - id: exponential-growth-decay
        weight: 0.4
        key: false
      - id: continuous-growth-model
        # Phase C (C-D): the P_0 e^{kt} model this topic derives and manipulates is now
        # taught in foundations; exponential-growth-decay covers only discrete bases.
        weight: 0.4
        key: false
      - id: logarithm-properties
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Setting up and solving $P' = kP$"
        key_prerequisites: [separable-equations, exponential-growth-decay]
        step_check:
          step: 'Divide both sides by $P_0$ to get $e^{6k} = 3$'
          question: 'Why can we divide both sides of $P_0e^{6k} = 3P_0$ by $P_0$?'
          options:
            - 'Because $P_0$ always equals $1$ in a model of exponential growth'
            - 'Because $P_0$ is a nonzero starting amount that appears on both sides'
            - 'Because the division removes the unknown constant $k$ from the equation'
            - 'Because $P_0$ stands for the rate and not for the starting amount'
          answer: 'Because $P_0$ is a nonzero starting amount that appears on both sides'
          why: 'The starting amount $P_0$ is positive and multiplies both sides. So it cancels, and only the growth factor $e^{6k} = 3$ is left.'
        exemplars:
          - problem: 'A bacterial colony satisfies $\dfrac{dP}{dt} = kP$ and doubles every $12$ hours. Find the exact value of $k$.'
            answer: 'ln(2)/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The solution is $P = P_0e^{kt}$. Doubling in $12$ hours means $e^{12k} = 2$, so $12k = \ln 2$. Hence $k = \frac{\ln 2}{12}$ per hour.'
          - problem: 'A radioactive isotope decays according to $\dfrac{dN}{dt} = -kN$, with $k > 0$, and has a half-life of $80$ years. Find $k$.'
            answer: 'ln(2)/80'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The solution is $N = N_0e^{-kt}$. After one half-life, $e^{-80k} = \frac{1}{2}$, so $80k = \ln 2$. Hence $k = \frac{\ln 2}{80}$ per year.'
          - problem: 'A population grows according to $\dfrac{dP}{dt} = 0.05P$ with $P(0) = 200$. Find $P(t)$.'
            answer: '200e^(0.05t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation $P'' = kP$ has solutions $P = P_0e^{kt}$. Here $k = 0.05$ and $P_0 = P(0) = 200$. So $P(t) = 200e^{0.05t}$.'
          - problem: 'A sample of a radioactive substance has mass $M(t)$ grams, with $\dfrac{dM}{dt} = -0.1M$ and $M(0) = 60$. Find $M(t)$.'
            answer: '60e^(-0.1t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The solution of $\frac{dM}{dt} = -0.1M$ is $M = M_0e^{-0.1t}$. The starting mass is $M_0 = M(0) = 60$. So $M(t) = 60e^{-0.1t}$.'
          - problem: 'A bank account grows continuously according to $\dfrac{dB}{dt} = kB$, and the balance doubles every $15$ years. The balance now is $800$ dollars. Find the balance $B(t)$ after $t$ years.'
            answer: '800e^(t ln(2)/15)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Doubling in $15$ years means $e^{15k} = 2$, so $k = \frac{\ln 2}{15}$. With $B(0) = 800$, the solution is $B(t) = 800e^{kt}$. So $B(t) = 800e^{t\ln 2/15}$.'
          - problem: 'The concentration $C(t)$ of a drug in the blood satisfies $\dfrac{dC}{dt} = -kC$, and it falls to half every $4$ hours. At time $0$ the concentration is $20$ milligrams per liter. Find $C(t)$, with $t$ in hours.'
            answer: '20e^(-t ln(2)/4)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Halving in $4$ hours means $e^{-4k} = \frac{1}{2}$, so $k = \frac{\ln 2}{4}$. With $C(0) = 20$, the solution is $C(t) = 20e^{-kt}$. So $C(t) = 20e^{-t\ln 2/4}$.'
          - problem: 'A substance decays according to $\dfrac{dN}{dt} = -0.02N$, with $t$ in years. Find its half-life, to one decimal place.'
            answer: '34.7'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The solution is $N = N_0e^{-0.02t}$. The half-life satisfies $e^{-0.02T} = \frac{1}{2}$, so $T = \frac{\ln 2}{0.02}$. This is about $34.7$ years.'
          - problem: 'A population grows continuously at $4\%$ per year according to $\dfrac{dP}{dt} = 0.04P$, and it is $1500$ now. Find the population after $10$ years, to one decimal place.'
            answer: '2237.7'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The solution is $P = 1500e^{0.04t}$. After $10$ years, $P = 1500e^{0.4}$. This is about $2237.7$.'
          - problem: 'A culture triples every $6$ hours. Sam says that the growth constant is $k = \dfrac{6}{\ln 3}$. What is the correct value of $k$?'
            answer: 'ln(3)/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Tripling in $6$ hours means $e^{6k} = 3$, so $6k = \ln 3$. Hence $k = \frac{\ln 3}{6}$. Sam turned the fraction upside down.'
        constraints: "doubling times and half-lives are clean integers; express rate constants exactly with ln"
      - id: kp2
        name: Time-to-reach questions
        key_prerequisites: [logarithm-properties]
        step_check:
          step: 'Express the ratio as a power of 2: $\frac{1}{8} = \left(\frac{1}{2}\right)^3$'
          question: 'Why do we write $\frac{1}{8}$ as a power of $\frac{1}{2}$?'
          options:
            - 'Because every ratio in a decay problem has to be written with the exponent $3$'
            - 'Because the base $\frac{1}{2}$ is the starting amount of the substance in grams'
            - 'Because powers of $\frac{1}{2}$ turn the fraction into a sum of two simple terms'
            - 'Because the exponent $3$ tells us how many half-lives have passed'
          answer: 'Because the exponent $3$ tells us how many half-lives have passed'
          why: 'Each half-life multiplies the amount by $\frac{1}{2}$. So the exponent counts the half-lives, and the time is that count times the half-life.'
        try_first:
          problem: 'A sample has a half-life of $10$ hours. What fraction of it remains after $30$ hours?'
          answer_contract: {"kind": "exact"}
          answer: '1/8'
          reveal: 'Each half-life multiplies the amount by $\frac{1}{2}$. After $\frac{30}{10} = 3$ half-lives, $\left(\frac{1}{2}\right)^3 = \frac{1}{8}$ remains. Questions about time become questions about counting half-lives.'
        exemplars:
          - problem: 'A radioactive substance has a half-life of $8$ days. How long does it take until only $25\%$ of the substance remains?'
            answer: '16'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "day", "allow_omitted": true}
            solution_sketch: 'After one half-life, $50\%$ remains, and after two half-lives, $25\%$ remains. So two half-lives must pass. The time is $2 \cdot 8 = 16$ days.'
          - problem: 'A bacterial culture doubles every $3$ hours and starts with $100$ cells. How long does it take to reach $800$ cells?'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'The culture must grow by the factor $\frac{800}{100} = 8 = 2^3$. So three doublings must pass. The time is $3 \cdot 3 = 9$ hours.'
          - problem: 'A population is modeled by $P(t) = 200e^{0.05t}$, with $t$ in years. At what time does the population reach $1000$? Find the exact time.'
            answer: '20 ln(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We solve $200e^{0.05t} = 1000$. Dividing by $200$ gives $e^{0.05t} = 5$, so $0.05t = \ln 5$. Hence $t = \frac{\ln 5}{0.05} = 20\ln 5$ years.'
          - problem: 'A population grows exponentially and doubles every $12$ years. The population now is $500$. How long does it take to reach $4000$?'
            answer: '36'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "year", "allow_omitted": true}
            solution_sketch: 'The population must grow by the factor $\frac{4000}{500} = 8 = 2^3$. So three doublings must pass. The time is $3 \cdot 12 = 36$ years.'
          - problem: 'An investment grows exponentially and doubles every $7$ years. How long does it take to become $4$ times its original value?'
            answer: '14'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "year", "allow_omitted": true}
            solution_sketch: 'Becoming $4$ times as large is $4 = 2^2$, which is two doublings. The time is $2 \cdot 7 = 14$ years.'
          - problem: 'A radioactive isotope has a half-life of $5$ hours. How long does it take until only $\dfrac{1}{8}$ of it remains?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'The fraction $\frac{1}{8} = \left(\frac{1}{2}\right)^3$ means three half-lives. The time is $3 \cdot 5 = 15$ hours.'
          - problem: 'A radioactive isotope has a half-life of $30$ years. Find the time in years until $10\%$ of it remains, to one decimal place.'
            answer: '99.7'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'We need $\left(\frac{1}{2}\right)^{t/30} = 0.1$. Taking logarithms gives $\frac{t}{30} = \frac{\ln 10}{\ln 2}$. So $t = 30\frac{\ln 10}{\ln 2}$, which is about $99.7$ years.'
          - problem: 'A bacterial culture grows according to $\dfrac{dP}{dt} = 0.3P$, with $t$ in hours. Find the time it takes to triple in size, to one decimal place.'
            answer: '3.7'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The solution is $P = P_0e^{0.3t}$. Tripling means $e^{0.3t} = 3$, so $t = \frac{\ln 3}{0.3}$. This is about $3.7$ hours.'
          - problem: 'A substance has a half-life of $4$ hours. Sam says that only $\dfrac{1}{16}$ of it remains after $8$ hours. After how many hours does only $\dfrac{1}{16}$ of it remain?'
            answer: '16'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'The fraction $\frac{1}{16} = \left(\frac{1}{2}\right)^4$ means four half-lives. The time is $4 \cdot 4 = 16$ hours. Sam counted only two half-lives.'
        constraints: "target ratios are powers of 2 (clean) or give single-log exact answers"
      - id: kp3
        name: "Determining $k$ and $P_0$ from data"
        key_prerequisites: [logarithm-properties, separable-equations]
        step_check:
          step: 'Set up the ratio of the population at two different times'
          question: 'Why do we use the ratio $\frac{P(6)}{P(3)}$ and not $P(6)$ alone?'
          options:
            - 'Because the ratio cancels the unknown $P_0$ and leaves $e^{3k}$ alone'
            - 'Because $P(6)$ alone is always equal to $P(3)$ in an exponential model'
            - 'Because a ratio of two populations is the same as the constant $k$'
            - 'Because we may only use data from times that are exactly $3$ units apart'
          answer: 'Because the ratio cancels the unknown $P_0$ and leaves $e^{3k}$ alone'
          why: 'We know $P(t) = P_0e^{kt}$ with $P_0$ unknown. The ratio $\frac{P(6)}{P(3)} = e^{3k}$ has no $P_0$, so $k$ can be found first.'
        exemplars:
          - problem: 'A population satisfies $\dfrac{dP}{dt} = kP$ with $P(2) = 300$ and $P(5) = 2400$. Find $P(0)$.'
            answer: '75'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ratio is $\frac{P(5)}{P(2)} = e^{3k} = \frac{2400}{300} = 8$, so $e^k = 2$. Going back two units of time gives $P(0) = \frac{300}{e^{2k}} = \frac{300}{4} = 75$.'
          - problem: 'A sample decays from $800$ g to $100$ g in $6$ hours. Find its half-life.'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'The ratio is $\frac{100}{800} = \frac{1}{8} = \left(\frac{1}{2}\right)^3$, so three half-lives take $6$ hours. One half-life is $\frac{6}{3} = 2$ hours.'
          - problem: 'A population satisfies $\dfrac{dP}{dt} = kP$ with $P(0) = 50$ and $P(2) = 800$. Find $k$ exactly.'
            answer: '2 ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ratio is $e^{2k} = \frac{800}{50} = 16$. So $2k = \ln 16 = 4\ln 2$, and $k = 2\ln 2$.'
          - problem: 'A bacterial colony grows from $120$ cells to $7680$ cells in $2$ hours, according to $\dfrac{dP}{dt} = kP$. Find $k$ exactly.'
            answer: '3 ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ratio is $e^{2k} = \frac{7680}{120} = 64$. So $2k = \ln 64 = 6\ln 2$, and $k = 3\ln 2$ per hour.'
          - problem: 'A population satisfies $\dfrac{dP}{dt} = kP$ with $P(1) = 100$ and $P(4) = 800$. Find $P(0)$.'
            answer: '50'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ratio is $e^{3k} = \frac{800}{100} = 8$, so $e^k = 2$. Going back one unit of time gives $P(0) = \frac{100}{2} = 50$.'
          - problem: 'A sample decays from $800$ g to $50$ g in $1$ hour. Find its half-life in minutes.'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The ratio is $\frac{50}{800} = \frac{1}{16} = \left(\frac{1}{2}\right)^4$, so four half-lives take $1$ hour. One half-life is $\frac{60}{4} = 15$ minutes.'
          - problem: 'A fossil bone contains $25\%$ of the carbon-14 of a living bone. The half-life of carbon-14 is $5730$ years. How old is the bone?'
            answer: '11460'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "year", "allow_omitted": true}
            solution_sketch: '$25\%$ means $\left(\frac{1}{2}\right)^2$, so two half-lives have passed. The age is $2 \cdot 5730 = 11460$ years.'
          - problem: 'The concentration of a drug in the blood decays exponentially. It is $160$ mg/L at 1 pm and $20$ mg/L at 4 pm. Find the concentration at noon, in mg/L.'
            answer: '320'
            answer_contract: {"kind": "unit", "quantity": "concentration", "unit": "mg/L", "allow_omitted": true}
            solution_sketch: 'From 1 pm to 4 pm the concentration falls by the factor $\frac{20}{160} = \frac{1}{8}$, which is three halvings in $3$ hours. So it halves every hour. At noon, one hour before 1 pm, it was $2 \cdot 160 = 320$.'
          - problem: 'A colony has $50$ cells at time $0$ and $800$ cells after $2$ hours, growing exponentially. Sam divides $800$ by $50$ to get $16$ and says that the colony doubles every $\frac{16}{2} = 8$ hours. What is the correct doubling time, in hours?'
            answer: '0.5'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'The growth factor is $16 = 2^4$, so four doublings happen in $2$ hours. One doubling takes $\frac{2}{4} = 0.5$ hours. Sam divided $16$ by $2$ and did not count doublings.'
        constraints: "data ratios are powers of 2 so k and the half-life come out as clean multiples of ln 2"
    diagnostic_exemplar:
      problem: 'A population satisfies $P'' = kP$ with $P(2) = 500$ and $P(6) = 8000$. Find $k$ and $P(0)$ exactly.'
      answer: '$k = \ln 2$; $P(0) = 125$.'
      answer_contract: {kind: none}
      solution_sketch: '$\frac{P(6)}{P(2)} = e^{4k} = 16$, so $k = \frac{\ln 16}{4} = \ln 2$. Then $P(0) = P(2)e^{-2k} = \frac{500}{4} = 125$.'
    anki_seeds:
      - front: "Solution of the natural growth equation P' = kP?"
        back: "$P(t) = P_0 e^{kt}$"
        type: basic
      - front: "Relation between the decay constant k and the half-life T?"
        back: '$k = \dfrac{\ln 2}{T}$'
        type: basic

  - id: newtons-law-of-cooling
    name: "Newton's Law of Cooling"
    core: false                # application genre; feeds only the applications capstone
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: natural-growth-decay-models
        weight: 0.6
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Setting up and the general solution
        key_prerequisites: [natural-growth-decay-models]
        step_check:
          step: 'Define the shifted variable $u = T - 30$'
          question: 'Why do we define $u = T - 30$ before we solve?'
          options:
            - 'Because $u$ starts at zero, which makes the constant $C$ vanish at once in the formula'
            - 'Because the shift removes the unknown constant $k$ from the equation for good'
            - 'Because $u'' = T''$, so the equation becomes $u'' = -ku$, which is plain decay'
            - 'Because the room temperature has to be subtracted from every answer we give'
          answer: 'Because $u'' = T''$, so the equation becomes $u'' = -ku$, which is plain decay'
          why: 'Since $30$ is a constant, $u'' = T''$. Then $T'' = -k(T - 30)$ becomes $u'' = -ku$, the decay equation that we already know how to solve.'
        exemplars:
          - problem: 'A cup of coffee at $90^\circ$C sits in a room at $25^\circ$C. Its temperature $T(t)$ follows Newton''s law of cooling. Write $T(t)$ in terms of the cooling constant $k$.'
            answer: '25 + 65e^(-kt)'
            answer_contract: {"kind": "function", "vars": ["t", "k"]}
            solution_sketch: 'Newton''s law gives $T = 25 + Ce^{-kt}$, where $25$ is the room temperature. At $t = 0$ we have $90 = 25 + C$, so $C = 65$. Hence $T(t) = 25 + 65e^{-kt}$.'
          - problem: 'A pie leaves the oven at $95^\circ$C and cools on a rack in a kitchen at $25^\circ$C. Write its temperature $T(t)$ in terms of the cooling constant $k$.'
            answer: '25 + 70e^(-kt)'
            answer_contract: {"kind": "function", "vars": ["t", "k"]}
            solution_sketch: 'The temperature has the form $T = 25 + Ce^{-kt}$. At $t = 0$ we have $95 = 25 + C$, so $C = 70$. Hence $T(t) = 25 + 70e^{-kt}$.'
          - problem: 'A bottle of juice at $4^\circ$C is put into a freezer kept at $-18^\circ$C. Write its temperature $T(t)$ in terms of the cooling constant $k$.'
            answer: '-18 + 22e^(-kt)'
            answer_contract: {"kind": "function", "vars": ["t", "k"]}
            solution_sketch: 'The temperature has the form $T = -18 + Ce^{-kt}$. At $t = 0$ we have $4 = -18 + C$, so $C = 22$. Hence $T(t) = -18 + 22e^{-kt}$.'
          - problem: 'A metal bar at $90^\circ$C is placed in a room at $10^\circ$C. Let $u(t) = T(t) - 10$ be the difference between the bar temperature and the room temperature. Newton''s law gives $\dfrac{du}{dt} = -ku$. Find $u(t)$ in terms of $k$.'
            answer: '80e^(-kt)'
            answer_contract: {"kind": "function", "vars": ["t", "k"]}
            solution_sketch: 'The equation $\frac{du}{dt} = -ku$ has solutions $u = Ce^{-kt}$. At $t = 0$ we have $u(0) = 90 - 10 = 80$. Hence $u(t) = 80e^{-kt}$.'
          - problem: 'A roast at $25^\circ$C is placed in an oven at $180^\circ$C. Its temperature satisfies $\dfrac{dT}{dt} = -k(T - 180)$ with $k > 0$, and $T(0) = 25$. Find $T(t)$ in terms of $k$.'
            answer: '180 - 155e^(-kt)'
            answer_contract: {"kind": "function", "vars": ["t", "k"]}
            solution_sketch: 'The solution has the form $T = 180 + Ce^{-kt}$. At $t = 0$ we have $25 = 180 + C$, so $C = -155$. Hence $T(t) = 180 - 155e^{-kt}$.'
          - problem: 'A glass of water at $8^\circ$C is brought into a room at $22^\circ$C. Write its temperature $T(t)$ in terms of the cooling constant $k$.'
            answer: '22 - 14e^(-kt)'
            answer_contract: {"kind": "function", "vars": ["t", "k"]}
            solution_sketch: 'The temperature has the form $T = 22 + Ce^{-kt}$. At $t = 0$ we have $8 = 22 + C$, so $C = -14$. Hence $T(t) = 22 - 14e^{-kt}$.'
          - problem: 'A cup of coffee at $90^\circ$C sits in a room at $25^\circ$C. Newton''s law gives $\dfrac{dT}{dt} = -k(T - 25)$, where $k = 0.1$ per minute. How fast is the temperature changing at the start, in degrees Celsius per minute?'
            answer: '-6.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At the start $T = 90$, so the temperature difference is $90 - 25 = 65$. Then $\frac{dT}{dt} = -0.1 \cdot 65 = -6.5$. The coffee loses $6.5$ degrees per minute.'
          - problem: 'A cup of coffee at $90^\circ$C sits in a room at $25^\circ$C. What temperature does the coffee approach after a very long time?'
            answer: '25'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "\u00b0C", "allow_omitted": true}
            solution_sketch: 'In the solution $T = 25 + 65e^{-kt}$ the term $e^{-kt}$ tends to $0$ as $t$ grows. So $T$ tends to $25$, which is the room temperature.'
          - problem: 'Sam models a cup of tea at $80^\circ$C in a room at $20^\circ$C as $T(t) = 80e^{-kt}$. Write the correct model for $T(t)$ in terms of $k$.'
            answer: '20 + 60e^(-kt)'
            answer_contract: {"kind": "function", "vars": ["t", "k"]}
            solution_sketch: 'Newton''s law gives $T = 20 + Ce^{-kt}$, where $20$ is the room temperature. At $t = 0$ we have $80 = 20 + C$, so $C = 60$. Sam''s model would fall to $0^\circ$C instead of $20^\circ$C.'
        constraints: "ambient temperatures and initial temperatures are integers; solution always in the form A + Ce^{-kt}"
      - id: kp2
        name: "Finding $k$ from data"
        key_prerequisites: [natural-growth-decay-models]
        step_check:
          step: 'Use the initial temperature to find $C$'
          question: 'Why is $C = 60$ and not $85$ in this step?'
          options:
            - 'Because $T(0) = 25 + C$, so $C$ is the starting gap $85 - 25$ above the room'
            - 'Because $C$ must always be smaller than the room temperature of $25^\circ$C here'
            - 'Because the factor $e^{-kt}$ equals $1$ only at the time $t = 6$ minutes exactly'
            - 'Because $C$ is the mean of the starting temperature and the room temperature, $55$'
          answer: 'Because $T(0) = 25 + C$, so $C$ is the starting gap $85 - 25$ above the room'
          why: 'At $t = 0$ we have $e^{0} = 1$, so $T(0) = 25 + C$. Then $C = 85 - 25 = 60$ is the gap between the coffee and the room.'
        exemplars:
          - problem: 'A body cools in a room at $20^\circ$C according to Newton''s law. It starts at $100^\circ$C and is at $60^\circ$C after $10$ minutes. Find the cooling constant $k$ to four decimal places.'
            answer: '0.0693'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The gap above the room falls from $80$ to $40$ in $10$ minutes, so it halves. Then $e^{-10k} = \frac{1}{2}$ and $k = \frac{\ln 2}{10}$. This is about $0.0693$ per minute.'
          - problem: 'A cold drink at $5^\circ$C warms in a room at $25^\circ$C and reaches $15^\circ$C after $4$ minutes. Find $T(t)$, with $t$ in minutes.'
            answer: '25 - 20e^(-(ln(2)/4)t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The gap above the drink falls from $20$ to $10$ in $4$ minutes, so it halves and $e^{-4k} = \frac{1}{2}$. Then $k = \frac{\ln 2}{4}$. Hence $T(t) = 25 - 20e^{-(\ln 2/4)t}$.'
          - problem: 'A metal bar cools in a room at $15^\circ$C. It starts at $95^\circ$C and is at $55^\circ$C after $6$ minutes. Find the cooling constant $k$ to four decimal places.'
            answer: '0.1155'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The gap above the room falls from $80$ to $40$ in $6$ minutes, so it halves. Then $k = \frac{\ln 2}{6}$, which is about $0.1155$ per minute.'
          - problem: 'A cold drink at $5^\circ$C warms in a room at $25^\circ$C. After $4$ minutes its temperature is $15^\circ$C. Find the warming constant $k$ to four decimal places.'
            answer: '0.1733'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The gap to the room falls from $20$ to $10$ in $4$ minutes, so $e^{-4k} = \frac{1}{2}$. Then $k = \frac{\ln 2}{4}$, which is about $0.1733$ per minute.'
          - problem: 'A pie cools in a room at $30^\circ$C. It is at $90^\circ$C at the start and at $60^\circ$C after $20$ minutes. Find the cooling constant $k$ to four decimal places.'
            answer: '0.0347'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The gap above the room falls from $60$ to $30$ in $20$ minutes, so it halves. Then $k = \frac{\ln 2}{20}$, which is about $0.0347$ per minute.'
          - problem: 'A metal block at $10^\circ$C warms in a room at $30^\circ$C. After $8$ minutes its temperature is $20^\circ$C. Find the warming constant $k$ to four decimal places.'
            answer: '0.0866'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The gap to the room falls from $20$ to $10$ in $8$ minutes, so $e^{-8k} = \frac{1}{2}$. Then $k = \frac{\ln 2}{8}$, which is about $0.0866$ per minute.'
          - problem: 'A cup of tea at $80^\circ$C is in a room at $20^\circ$C. After $5$ minutes it is at $50^\circ$C. Find $T(t)$, with $t$ in minutes.'
            answer: '20 + 60e^(-(ln(2)/5)t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The gap above the room falls from $60$ to $30$ in $5$ minutes, so it halves and $k = \frac{\ln 2}{5}$. Hence $T(t) = 20 + 60e^{-(\ln 2/5)t}$.'
          - problem: 'A metal plate at $120^\circ$C is placed in a room at $20^\circ$C. After $8$ minutes it is at $70^\circ$C. What is its temperature after $24$ minutes?'
            answer: '32.5'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "\u00b0C", "allow_omitted": true}
            solution_sketch: 'The gap above the room falls from $100$ to $50$ in $8$ minutes, so it halves every $8$ minutes. In $24$ minutes it halves three times, to $\frac{100}{8} = 12.5$. The temperature is $20 + 12.5 = 32.5$.'
          - problem: 'A cup of coffee at $90^\circ$C is at $55^\circ$C after $3$ minutes in a room at $20^\circ$C. Sam divides $90$ by $55$ and writes $k = \frac{1}{3}\ln\frac{90}{55}$. What is the correct cooling constant $k$, to four decimal places?'
            answer: '0.2310'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'Newton''s law compares the gaps above the room, not the temperatures. The gap falls from $70$ to $35$ in $3$ minutes, so it halves. Then $k = \frac{\ln 2}{3}$, which is about $0.2310$ per minute.'
          - problem: 'A cup of coffee at $90^\circ$C sits in a room at $20^\circ$C. After $5$ minutes its temperature is $60^\circ$C. Find the cooling constant $k$ to four decimal places.'
            answer: '0.1119'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The gap above the room falls from $70$ to $40$ in $5$ minutes. So $e^{-5k} = \frac{40}{70} = \frac{4}{7}$ and $k = \frac{1}{5}\ln\frac{7}{4}$. This is about $0.1119$ per minute.'
        constraints: "the measured gap ratio is usually a power of 1/2 so k is a clean multiple of ln 2, and one item uses another ratio; warming problems flip the sign of C"
      - id: kp3
        name: Time questions
        key_prerequisites: [natural-growth-decay-models]
        step_check:
          step: 'Determine the final temperature gap: $20 - 15 = 5^{\circ}$C'
          question: 'Why do we work with the gaps $60$ and $5$ and not with the temperatures $75$ and $20$?'
          options:
            - 'Because the temperatures $75$ and $20$ cannot be divided by each other'
            - 'Because Newton''s law makes the gap above the room decay exponentially'
            - 'Because a temperature in degrees Celsius is never allowed to be halved'
            - 'Because a gap of $5$ is always easier to halve than a temperature of $20$'
          answer: 'Because Newton''s law makes the gap above the room decay exponentially'
          why: 'Newton''s law makes the gap $T - T_{\text{room}}$ decay like $e^{-kt}$, so it halves in equal time steps. The temperature itself does not halve.'
        try_first:
          problem: 'The gap between a cooling body and its room halves every $5$ minutes. It is $80^\circ$C now. What is the gap after $15$ minutes?'
          answer_contract: {"kind": "exact"}
          answer: '10'
          reveal: 'Each $5$ minutes halves the gap. In $15$ minutes there are $3$ halvings, so the gap is $\frac{80}{2^3} = 10$. Questions about time become questions about counting halvings of the gap.'
        exemplars:
          - problem: 'A body in a room at $20^\circ$C has temperature $T(t) = 20 + 80e^{-(\ln 2/10)t}$, with $t$ in minutes. When does the body reach $30^\circ$C?'
            answer: '30'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The gap above the room is $80$ at the start. It must fall to $30 - 20 = 10$, which is $\frac{80}{8}$. That takes three halvings, each $10$ minutes, so $t = 30$.'
          - problem: 'A drink has temperature $T(t) = 25 - 20e^{-(\ln 2/4)t}$ in a room at $25^\circ$C, with $t$ in minutes. When does the drink reach $20^\circ$C?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The gap to the room is $20$ at the start. It must fall to $25 - 20 = 5$, which is $\frac{20}{4}$. That takes two halvings, each $4$ minutes, so $t = 8$.'
          - problem: 'A metal bar at $210^\circ$C is placed in a room at $10^\circ$C. The difference between the bar temperature and the room temperature halves every $6$ minutes. When does the bar reach $60^\circ$C?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The difference is $200$ at the start. It must fall to $60 - 10 = 50$, which is $\frac{200}{4}$. That takes two halvings, each $6$ minutes, so $t = 12$.'
          - problem: 'A cup of coffee at $90^\circ$C sits in a room at $20^\circ$C. The difference between the coffee temperature and the room temperature halves every $3$ minutes. When does the coffee reach $55^\circ$C?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The difference is $70$ at the start. It must fall to $55 - 20 = 35$, which is half of $70$. That takes one halving, so $t = 3$.'
          - problem: 'A thermometer at $5^\circ$C is brought into a room at $25^\circ$C. The difference between the room temperature and the thermometer temperature halves every $8$ minutes. When does the thermometer read $20^\circ$C?'
            answer: '16'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The difference is $20$ at the start. It must fall to $25 - 20 = 5$, which is $\frac{20}{4}$. That takes two halvings, each $8$ minutes, so $t = 16$.'
          - problem: 'A cake at $160^\circ$C is put in a room at $20^\circ$C. The difference between the cake temperature and the room temperature halves every $5$ minutes. When does the cake reach $55^\circ$C?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The difference is $140$ at the start. It must fall to $55 - 20 = 35$, which is $\frac{140}{4}$. That takes two halvings, each $5$ minutes, so $t = 10$.'
          - problem: 'A cup of coffee at $80^\circ$C sits in a room at $20^\circ$C. The difference between the coffee temperature and the room temperature halves every $6$ minutes. After how many minutes does the coffee reach $25^\circ$C? Give the time to one decimal place.'
            answer: '21.5'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The difference is $60$ at the start and must fall to $25 - 20 = 5$. So $\left(\frac{1}{2}\right)^{t/6} = \frac{5}{60} = \frac{1}{12}$, which gives $t = 6\frac{\ln 12}{\ln 2}$. This is about $21.5$ minutes.'
          - problem: 'A body at $100^\circ$C is placed in a room at $20^\circ$C and cools according to $\dfrac{dT}{dt} = -0.05(T - 20)$, with $t$ in minutes. When does the body reach $30^\circ$C? Give the time to one decimal place.'
            answer: '41.6'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The solution is $T = 20 + 80e^{-0.05t}$. Setting $T = 30$ gives $e^{-0.05t} = \frac{10}{80} = \frac{1}{8}$, so $t = \frac{\ln 8}{0.05}$. This is about $41.6$ minutes.'
          - problem: 'A cup at $100^\circ$C sits in a room at $20^\circ$C. The difference between the cup temperature and the room temperature halves every $5$ minutes. Sam says that the cup reaches $50^\circ$C after $5$ minutes, because $100$ halves to $50$. How long does it really take to reach $50^\circ$C, to one decimal place?'
            answer: '7.1'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'It is the difference above the room that halves, not the temperature. The difference is $80$ at the start and must fall to $50 - 20 = 30$. So $\left(\frac{1}{2}\right)^{t/5} = \frac{3}{8}$, which gives $t = 5\frac{\ln(8/3)}{\ln 2}$. This is about $7.1$ minutes.'
        constraints: "target gaps are the initial gap divided by a power of 2, so times are integer multiples of the halving time"
    diagnostic_exemplar:
      problem: "A body in a $20^{\\circ}$C room cools from $100^{\\circ}$C to $60^{\\circ}$C in $10$ minutes. When does it reach $25^{\\circ}$C?"
      answer: "$40$ minutes"
      answer_contract: {kind: none}
      solution_sketch: "The gap halves every $10$ minutes: $80 \\to 40 \\to 20 \\to 10 \\to 5$ takes four halvings."
    anki_seeds:
      - front: "Newton's law of cooling as an ODE (ambient temperature A)?"
        back: "$T' = -k(T - A)$ with $k > 0$."
        type: basic
      - front: "Solution of T' = -k(T - A) with T(0) = T0?"
        back: "$T = A + (T_0 - A)e^{-kt}$"
        type: basic

  - id: mixing-tank-models
    name: Mixing Tank Models
    core: false                # application genre; feeds only the applications capstone
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: linear-first-order-integrating-factor
        weight: 0.7
        key: true
      - id: natural-growth-decay-models
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Setting up the balance equation
        key_prerequisites: [linear-first-order-integrating-factor]
        step_check:
          step: '$6$ L/min * $\dfrac{A}{150}$'
          question: 'Why is the outflow rate found with $\dfrac{A}{150}$ and not with the $3$ g/L of the incoming brine?'
          options:
            - 'The incoming brine was counted already in the inflow, so it is not used twice'
            - 'The solution that leaves has the tank concentration, $\dfrac{A}{150}$ g/L'
            - 'Dividing the flow rate by $150$ L gives the amount of salt that leaves'
          answer: 'The solution that leaves has the tank concentration, $\dfrac{A}{150}$ g/L'
          why: 'The tank is well mixed, so the solution that leaves carries the concentration $\dfrac{A}{150}$ g/L. At $6$ L/min that is $\dfrac{A}{25}$ g/min of salt.'
        exemplars:
          - problem: 'A $100$ L tank starts with pure water. Brine containing $2$ g/L of salt flows in at $5$ L/min, and the well-mixed solution flows out at $5$ L/min. Write the differential equation for the amount $x(t)$ of salt, in grams, in the tank after $t$ minutes.'
            answer: '10 - x/20'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Salt enters at the concentration of the brine times the flow rate, so $2 \cdot 5 = 10$ g/min. Salt leaves at the concentration of the tank, $\frac{x}{100}$ g/L, times $5$ L/min, which is $\frac{x}{20}$ g/min. The rate of change is the rate in minus the rate out, so $\frac{dx}{dt} = 10 - \frac{x}{20}$.'
          - problem: 'A $50$ L tank holds $10$ g of salt dissolved in water. Brine containing $1$ g/L of salt flows in at $2$ L/min, and the well-mixed solution leaves at $2$ L/min. Write the differential equation for the amount $x(t)$ of salt in grams.'
            answer: '2 - x/25'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The inflow carries $1 \cdot 2 = 2$ g/min of salt. The outflow carries $2 \cdot \frac{x}{50} = \frac{x}{25}$ g/min, because the tank holds $50$ L. So $\frac{dx}{dt} = 2 - \frac{x}{25}$; the $10$ g at the start only sets $x(0)$ and does not appear in the equation.'
          - problem: 'Pure water flows at $4$ L/min into a $200$ L tank of well-mixed brine, and the mixture drains at $4$ L/min. Write the differential equation for the amount $x(t)$ of salt in grams.'
            answer: '-x/50'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Pure water brings no salt, so the rate in is $0$ g/min. The outflow removes $4 \cdot \frac{x}{200} = \frac{x}{50}$ g/min. So $\frac{dx}{dt} = -\frac{x}{50}$, which is pure decay of the salt.'
          - problem: 'A $50$ L tank holds well-mixed brine. Brine containing $3$ g/L of salt flows in at $5$ L/min, and the solution leaves at $5$ L/min. Write the differential equation for the salt concentration $c(t)$ in g/L.'
            answer: '3/10 - c/10'
            answer_contract: {"kind": "function", "vars": ["c"]}
            solution_sketch: 'Salt enters at $3 \cdot 5 = 15$ g/min, and the tank holds $50$ L, so the concentration rises by $\frac{15}{50} = \frac{3}{10}$ g/L per minute. Salt leaves at $5c$ g/min, which lowers the concentration by $\frac{5c}{50} = \frac{c}{10}$ per minute. So $\frac{dc}{dt} = \frac{3}{10} - \frac{c}{10}$.'
          - problem: 'A $100$ L tank holds well-mixed brine. One stream containing $2$ g/L of salt flows in at $3$ L/min, and a second stream containing $1$ g/L flows in at $2$ L/min. The solution leaves at $5$ L/min, so the volume stays $100$ L. Write the differential equation for the amount $x(t)$ of salt in grams.'
            answer: '8 - x/20'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The two streams bring $2 \cdot 3 = 6$ g/min and $1 \cdot 2 = 2$ g/min, so $8$ g/min in total. The outflow removes $5 \cdot \frac{x}{100} = \frac{x}{20}$ g/min. So $\frac{dx}{dt} = 8 - \frac{x}{20}$.'
          - problem: 'Brine containing $3$ g/L of salt flows into a well-mixed tank at $6$ L/min, and the mixture leaves at $6$ L/min. The amount $x(t)$ of salt in grams satisfies $\frac{dx}{dt} = 18 - \frac{x}{25}$. What is the volume of the tank?'
            answer: '150'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The outflow term is the flow rate times $\frac{x}{V}$, so $6 \cdot \frac{x}{V} = \frac{x}{25}$. Dividing, $V = 6 \cdot 25 = 150$. The tank holds $150$ L.'
          - problem: 'A $120$ L tank holds well-mixed brine. Brine containing $s$ g/L of salt flows in at $6$ L/min, and the mixture leaves at $6$ L/min. Write the differential equation for the amount $x(t)$ of salt in grams.'
            answer: '6s - x/20'
            answer_contract: {"kind": "function", "vars": ["x", "s"]}
            solution_sketch: 'Salt enters at $s \cdot 6 = 6s$ g/min for any brine concentration $s$. It leaves at $6 \cdot \frac{x}{120} = \frac{x}{20}$ g/min. So $\frac{dx}{dt} = 6s - \frac{x}{20}$.'
          - problem: 'Sam studies an $80$ L tank. Brine containing $3$ g/L of salt flows in at $4$ L/min, and the mixture leaves at $4$ L/min. Sam writes $\frac{dx}{dt} = 12 - 4x$ for the amount $x(t)$ of salt in grams. What is the correct differential equation?'
            answer: '12 - x/20'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Sam has the rate in right: $3 \cdot 4 = 12$ g/min. The rate out must use the concentration of the tank, $\frac{x}{80}$ g/L, so it is $4 \cdot \frac{x}{80} = \frac{x}{20}$ g/min, not $4x$. The correct equation is $\frac{dx}{dt} = 12 - \frac{x}{20}$.'
        constraints: 'constant volume (equal flow rates); rate out = (outflow rate) x A/V; integer concentrations and flows; the answer is the right side of the balance equation, and a full equation with dx/dt in front is read too'
      - id: kp2
        name: Solving the model
        key_prerequisites: [linear-first-order-integrating-factor]
        step_check:
          step: '$A(t) = 50 + Ce^{-t/10}$'
          question: 'Why does the general solution add the term $Ce^{-t/10}$ to the equilibrium $50$?'
          options:
            - 'The constant $C$ must be negative so that $A$ always stays below the equilibrium $50$'
            - 'Every linear equation has one exponential term plus the starting value of $A$'
            - 'The gap $A - 50$ shrinks in proportion to itself, so it decays like $e^{-t/10}$'
          answer: 'The gap $A - 50$ shrinks in proportion to itself, so it decays like $e^{-t/10}$'
          why: 'The right side $5 - \dfrac{A}{10}$ equals $-\dfrac{1}{10}(A - 50)$, so the gap from $50$ decays with time constant $10$.'
        exemplars:
          - problem: 'Solve the initial value problem $\frac{dA}{dt} = 8 - \frac{A}{20}$, $A(0) = 0$.'
            answer: '160 - 160e^(-t/20)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Set the right side to $0$ to find the equilibrium: $8 = \frac{A}{20}$ gives $A = 160$. Then $A = 160 + Ce^{-t/20}$, because the gap from the equilibrium decays with rate $\frac{1}{20}$. The condition $A(0) = 0$ gives $0 = 160 + C$, so $C = -160$ and $A(t) = 160 - 160e^{-t/20}$.'
          - problem: 'Solve the initial value problem $\frac{dA}{dt} = 6 - \frac{A}{30}$, $A(0) = 300$.'
            answer: '180 + 120e^(-t/30)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equilibrium solves $6 - \frac{A}{30} = 0$, so $A = 180$. The general solution is $A = 180 + Ce^{-t/30}$. The condition $A(0) = 300$ gives $300 = 180 + C$, so $C = 120$ and $A(t) = 180 + 120e^{-t/30}$.'
          - problem: 'Solve $\frac{dA}{dt} = -\frac{A}{40}$ with $A(0) = 12$.'
            answer: '12e^(-t/40)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equilibrium is $0$, so the general solution is $A = Ce^{-t/40}$. The condition $A(0) = 12$ gives $C = 12$. Therefore $A(t) = 12e^{-t/40}$.'
          - problem: 'A $200$ L tank holds water with $30$ g of salt dissolved in it. Brine containing $0.5$ g/L of salt flows in at $4$ L/min, and the well-mixed solution leaves at $4$ L/min. Find the amount $A(t)$ of salt in grams after $t$ minutes.'
            answer: '100 - 70e^(-t/50)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The inflow adds $0.5 \cdot 4 = 2$ g/min, and the outflow removes $4 \cdot \frac{A}{200} = \frac{A}{50}$ g/min, so $\frac{dA}{dt} = 2 - \frac{A}{50}$. The equilibrium is $A = 100$, so $A = 100 + Ce^{-t/50}$. The condition $A(0) = 30$ gives $C = -70$, so $A(t) = 100 - 70e^{-t/50}$.'
          - problem: 'A $60$ L tank holds water with $100$ g of salt dissolved in it. Brine containing $1$ g/L of salt flows in at $4$ L/min, and the well-mixed solution leaves at $4$ L/min. Find the amount $A(t)$ of salt in grams after $t$ minutes.'
            answer: '60 + 40e^(-t/15)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The inflow adds $1 \cdot 4 = 4$ g/min, and the outflow removes $4 \cdot \frac{A}{60} = \frac{A}{15}$ g/min, so $\frac{dA}{dt} = 4 - \frac{A}{15}$. The equilibrium is $A = 60$, so $A = 60 + Ce^{-t/15}$. The condition $A(0) = 100$ gives $C = 40$, so $A(t) = 60 + 40e^{-t/15}$.'
          - problem: 'A $1000$ L tank holds water with $50$ g of dye dissolved in it. A solution containing $0.2$ g/L of dye flows in at $10$ L/min, and the well-mixed solution leaves at $10$ L/min. Find the amount $A(t)$ of dye in grams after $t$ minutes.'
            answer: '200 - 150e^(-t/100)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The inflow adds $0.2 \cdot 10 = 2$ g/min, and the outflow removes $10 \cdot \frac{A}{1000} = \frac{A}{100}$ g/min, so $\frac{dA}{dt} = 2 - \frac{A}{100}$. The equilibrium is $A = 200$, so $A = 200 + Ce^{-t/100}$. The condition $A(0) = 50$ gives $C = -150$, so $A(t) = 200 - 150e^{-t/100}$.'
          - problem: 'A $500$ L tank is filled with pure water. A solution containing $0.4$ g/L of dye flows in at $5$ L/min, and the well-mixed solution leaves at $5$ L/min. How many grams of dye are in the tank after $100$ minutes? Round to one decimal place.'
            answer: '126.4'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The model is $\frac{dA}{dt} = 0.4 \cdot 5 - 5 \cdot \frac{A}{500} = 2 - \frac{A}{100}$ with $A(0) = 0$. Its solution is $A(t) = 200\left(1 - e^{-t/100}\right)$. At $t = 100$ this is $200\left(1 - e^{-1}\right) \approx 126.4$ g.'
          - problem: 'A $400$ L tank is filled with pure water. Brine containing $0.5$ g/L of salt flows in at $8$ L/min, and the well-mixed solution leaves at $8$ L/min. Find the salt concentration $c(t)$ in g/L after $t$ minutes.'
            answer: '0.5 - 0.5e^(-t/50)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The amount of salt satisfies $\frac{dA}{dt} = 0.5 \cdot 8 - 8 \cdot \frac{A}{400} = 4 - \frac{A}{50}$ with $A(0) = 0$, so $A = 200 - 200e^{-t/50}$. The concentration is the amount divided by the volume, $\frac{A}{400} = 0.5 - 0.5e^{-t/50}$.'
          - problem: 'Sam solves $\frac{dA}{dt} = 8 - \frac{A}{20}$ with $A(0) = 40$ and gets $A(t) = 160 + 40e^{-t/20}$. What is the correct solution?'
            answer: '160 - 120e^(-t/20)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equilibrium is $160$, so $A = 160 + Ce^{-t/20}$. The constant $C$ is the starting gap, not the starting amount: $40 = 160 + C$ gives $C = -120$. So $A(t) = 160 - 120e^{-t/20}$, and Sam wrongly used $C = 40$.'
        constraints: 'solutions have the shape (limit) + C e^{-t/tau}; C fixed by the initial amount; contexts need the balance equation to be set up first'
      - id: kp3
        name: Long-run behavior and timing
        key_prerequisites: [linear-first-order-integrating-factor]
        step_check:
          step: 'Solve $1 - e^{-t/30} = \tfrac{1}{2}$'
          question: 'Why is $1 - e^{-t/30} = \tfrac{1}{2}$ the equation for the time when the tank holds $75$ g?'
          options:
            - 'The amount $75$ g is half of the long-run $150$ g, and $\dfrac{A}{150} = 1 - e^{-t/30}$'
            - 'The amount $75$ g is taken from $150$ g, and the difference is set equal to the exponential'
            - 'The time constant is $30$, so half the long-run amount is reached when the exponent is one half'
          answer: 'The amount $75$ g is half of the long-run $150$ g, and $\dfrac{A}{150} = 1 - e^{-t/30}$'
          why: 'Dividing $A(t) = 150(1 - e^{-t/30})$ by $150$ gives $1 - e^{-t/30}$. The tank holds $75$ g when this equals $\tfrac{1}{2}$.'
        try_first:
          problem: 'A $200$ L tank is fed brine containing $3$ g/L of salt, and the well-mixed solution leaves at the same rate. How many grams of salt does the tank hold after a very long time?'
          answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
          answer: '600'
          reveal: 'After a long time the tank takes on the concentration of the incoming brine, $3$ g/L, so it holds $3 \cdot 200 = 600$ g. This is the equilibrium of the balance equation.'
        exemplars:
          - problem: 'An $80$ L tank is fed brine containing $5$ g/L of salt at $8$ L/min, and the well-mixed solution leaves at $8$ L/min. The amount of salt satisfies $\frac{dA}{dt} = 40 - \frac{A}{10}$. How much salt does the tank hold in the long run?'
            answer: '400'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'In the long run the amount stops changing, so $\frac{dA}{dt} = 0$ and $40 = \frac{A}{10}$. Then $A = 400$ g. This agrees with the brine concentration times the volume, $5 \cdot 80 = 400$.'
          - problem: 'A tank holds $A(t) = 150\left(1 - e^{-t/12}\right)$ grams of salt after $t$ minutes. When does the tank hold three quarters of its long-run amount? Round to one decimal place.'
            answer: '16.6'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The long-run amount is $150$ g, so three quarters of it is $112.5$ g. Setting $150\left(1 - e^{-t/12}\right) = 112.5$ gives $e^{-t/12} = \frac{1}{4}$. So $t = 12 \ln 4 \approx 16.6$ minutes.'
          - problem: 'A $250$ L tank is fed brine containing $6$ g/L of salt at $10$ L/min, and the well-mixed solution drains at the same rate. What salt concentration does the tank approach in the long run?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "concentration", "unit": "g/L", "allow_omitted": true}
            solution_sketch: 'In the long run the amount of salt in the tank stops changing, so salt leaves exactly as fast as it enters. Salt leaves at the concentration of the tank, so that concentration equals the concentration of the brine, $6$ g/L.'
          - problem: 'A tank is fed brine containing $4$ g/L of salt, and the well-mixed solution drains at the same rate. In the long run the tank holds $600$ g of salt. What is the volume of the tank?'
            answer: '150'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'In the long run the amount of salt equals the brine concentration times the volume. So $4V = 600$. Dividing by $4$ gives $V = 150$ L.'
          - problem: 'The amount of salt in a tank after $t$ minutes is $A(t) = 250\left(1 - e^{-t/15}\right)$ grams. How much salt does the tank hold after a very long time?'
            answer: '250'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'As $t$ grows, $e^{-t/15}$ tends to $0$. So $A(t)$ tends to $250(1 - 0) = 250$. The tank holds $250$ g in the long run.'
          - problem: 'A tank starts with $300$ g of salt, and its salt amount is $A(t) = 100 + 200e^{-t/5}$ grams after $t$ minutes. When does the tank hold $150$ g? Round to one decimal place.'
            answer: '6.9'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Setting $100 + 200e^{-t/5} = 150$ gives $e^{-t/5} = \frac{1}{4}$. Then $\frac{t}{5} = \ln 4$, so $t = 5 \ln 4 \approx 6.9$ minutes. The tank starts at $300$ g and approaches the long-run amount $100$ g.'
          - problem: 'A $50$ L tank is fed pure water at $5$ L/min, and brine drains at $5$ L/min. The tank starts with $320$ g of salt, so $A(t) = 320e^{-t/10}$ grams. When does only $20$ g remain? Round to one decimal place.'
            answer: '27.7'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Setting $320e^{-t/10} = 20$ gives $e^{-t/10} = \frac{1}{16}$. Then $\frac{t}{10} = \ln 16$, so $t = 10 \ln 16 \approx 27.7$ minutes.'
          - problem: 'A $120$ L tank starts with pure water. Brine containing $0.5$ g/L of salt flows in at $6$ L/min, and the well-mixed solution leaves at $6$ L/min. How long does it take for the tank to hold half of its long-run amount of salt? Round to one decimal place.'
            answer: '13.9'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Salt enters at $0.5 \cdot 6 = 3$ g/min and leaves at $\frac{6x}{120} = \frac{x}{20}$ g/min, so the long-run amount is $20 \cdot 3 = 60$ g. The solution is $x = 60\left(1 - e^{-t/20}\right)$, and $x = 30$ gives $e^{-t/20} = \frac{1}{2}$. So $t = 20 \ln 2 \approx 13.9$ minutes.'
        constraints: 'long-run amount = inflow concentration x volume; timing answers are logarithms (ln 2, ln 4, ln 16 times a time constant) rounded to one decimal place'
    diagnostic_exemplar:
      problem: 'A $40$ L tank starts with pure water. Brine containing $3$ g/L flows in at $4$ L/min and the well-mixed solution leaves at $4$ L/min. Find the amount of salt $A(t)$ in the tank, and the time at which it reaches $60$ g.'
      answer: '$A(t) = 120\left(1 - e^{-t/10}\right)$; it reaches $60$ g at $t = 10\ln 2$ minutes.'
      answer_contract: {kind: none}
      solution_sketch: 'Balance: $A'' = 3 \cdot 4 - \frac{A}{40}\cdot 4 = 12 - \frac{A}{10}$ with $A(0) = 0$, whose solution is $A = 120(1 - e^{-t/10})$. Setting $A = 60$ gives $e^{-t/10} = \frac{1}{2}$.'
    anki_seeds:
      - front: "In a constant-volume mixing tank, the rate of salt leaving is..."
        back: "(outflow rate) x A/V: the outflow carries the current concentration."
        type: basic
      - front: "Long-run amount of salt in a constant-volume tank?"
        back: "inflow concentration x tank volume."
        type: basic

  - id: logistic-population-models
    name: The Logistic Equation
    core: false                # named model; feeds only the applications capstone
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: separable-equations
        weight: 0.5
        key: true
      - id: partial-fractions-integration
        weight: 0.5
        key: true
      - id: slope-fields-equilibria
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Structure and equilibria
        key_prerequisites: [slope-fields-equilibria]
        step_check:
          step: 'Identify $r = 2$ and $K = 800$'
          question: 'Why is $800$ the carrying capacity in this equation?'
          options:
            - 'At $P = 800$ the factor $1 - \dfrac{P}{800}$ is zero, so growth stops'
            - 'The number $800$ is the population at which the growth rate $2$ is largest'
            - 'The number $800$ is the starting population of the model'
          answer: 'At $P = 800$ the factor $1 - \dfrac{P}{800}$ is zero, so growth stops'
          why: 'When $P = 800$ the bracket $1 - \dfrac{P}{800}$ equals $0$, so $P$ stops changing. That makes $800$ the equilibrium that the population approaches.'
        exemplars:
          - problem: 'A population satisfies $\frac{dP}{dt} = 0.5P\left(1 - \frac{P}{100}\right)$ with $P(0) = 10$. Find $\lim_{t \to \infty} P(t)$.'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factor $1 - \frac{P}{100}$ is zero at $P = 100$, so $100$ is an equilibrium. A population that starts between $0$ and $100$ has a positive growth rate and rises toward that equilibrium. So the limit is $100$.'
          - problem: 'A fish population in a lake satisfies $\frac{dP}{dt} = 0.4P\left(1 - \frac{P}{300}\right)$. Find the equilibrium populations.'
            answer: '0, 300'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An equilibrium has $\frac{dP}{dt} = 0$. The product $0.4P\left(1 - \frac{P}{300}\right)$ is zero when $P = 0$ or when $1 - \frac{P}{300} = 0$, which gives $P = 300$.'
          - problem: 'A deer herd on an island satisfies $\frac{dP}{dt} = 0.7P\left(1 - \frac{P}{500}\right)$, and the herd starts with $40$ deer. How large does the herd become in the long run?'
            answer: '500'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equilibria are $P = 0$ and $P = 500$. A herd of $40$ deer lies between them, where $\frac{dP}{dt}$ is positive, so the herd grows toward $500$. In the long run it has $500$ deer.'
          - problem: 'A yeast culture has mass $M(t)$ grams and satisfies $\frac{dM}{dt} = 0.3M\left(1 - \frac{M}{900}\right)$. At what mass is the culture growing fastest?'
            answer: '450'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The growth rate $0.3M\left(1 - \frac{M}{900}\right)$ is a downward parabola in $M$ with roots $0$ and $900$. Its maximum lies halfway between the roots, at $M = 450$ g.'
          - problem: 'A population satisfies $\frac{dP}{dt} = 0.9P - 0.0003P^2$. Find its carrying capacity.'
            answer: '3000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor the right side as $0.9P\left(1 - \frac{P}{K}\right)$. Then $0.9P \cdot \frac{P}{K} = 0.0003P^2$ gives $K = \frac{0.9}{0.0003} = 3000$. The carrying capacity is $3000$.'
          - problem: 'A population satisfies $\frac{dP}{dt} = 0.4P\left(1 - \frac{P}{300}\right)$. Is the equilibrium $P = 0$ stable or unstable?'
            answer: 'unstable'
            answer_contract: {"kind": "label", "options": [["unstable", "it is unstable", "not stable", "unstable equilibrium", "the equilibrium is unstable", "P = 0 is unstable", "it is not stable"], ["stable", "it is stable", "stable equilibrium", "the equilibrium is stable", "P = 0 is stable"]]}
            solution_sketch: 'For a small positive $P$ the factor $1 - \frac{P}{300}$ is close to $1$, so $\frac{dP}{dt}$ is positive. A population just above $0$ therefore grows away from $0$. The equilibrium $P = 0$ is unstable.'
          - problem: 'A herd of $800$ animals lives on an island whose carrying capacity is $500$, and $\frac{dP}{dt} = 0.2P\left(1 - \frac{P}{500}\right)$. Does the herd increase or decrease?'
            answer: 'decreases'
            answer_contract: {"kind": "label", "options": [["decreases", "it decreases", "the herd decreases", "it will decrease", "decrease", "decreasing", "falls", "shrinks"], ["increases", "it increases", "the herd increases", "it will increase", "increase", "increasing", "rises", "grows"]]}
            solution_sketch: 'At $P = 800$ the factor $1 - \frac{800}{500} = -0.6$ is negative, so $\frac{dP}{dt} < 0$. The herd is above the carrying capacity, so it decreases toward $500$.'
          - problem: 'Sam reads $\frac{dP}{dt} = 0.3P\left(1 - \frac{P}{900}\right)$ and says the carrying capacity is $\frac{900}{0.3} = 3000$. What is the carrying capacity?'
            answer: '900'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The model has the form $rP\left(1 - \frac{P}{K}\right)$, and the number under $P$ in the bracket is $K$. Here $K = 900$, and the growth rate $r = 0.3$ plays no part in the carrying capacity. Sam divided by $r$ by mistake.'
        constraints: 'carrying capacity a round number; equilibria 0 (unstable) and K (stable); fastest growth at K/2; r and K read from the factored form or found by dividing coefficients of P and P^2'
      - id: kp2
        name: Solving via partial fractions
        key_prerequisites: [partial-fractions-integration, separable-equations]
        step_check:
          step: '$C = \frac{K - P_0}{P_0} = \frac{2000 - 500}{500} = 3$'
          question: 'Why does the constant $C$ equal $\frac{K - P_0}{P_0}$?'
          options:
            - 'Partial fractions always produce a constant equal to the ratio of the two equilibria'
            - 'The constant $C$ is the fraction of the carrying capacity that is still unused at $t = 0$'
            - 'Putting $t = 0$ into $P = \frac{K}{1 + Ce^{-rt}}$ gives $P_0 = \frac{K}{1 + C}$'
          answer: 'Putting $t = 0$ into $P = \frac{K}{1 + Ce^{-rt}}$ gives $P_0 = \frac{K}{1 + C}$'
          why: 'At $t = 0$ the exponential is $1$, so $P_0 = \frac{K}{1 + C}$. Then $1 + C = \frac{K}{P_0}$, which gives $C = \frac{K - P_0}{P_0}$.'
        exemplars:
          - problem: 'Solve the initial value problem $\frac{dy}{dt} = 3y\left(1 - \frac{y}{50}\right)$, $y(0) = 10$.'
            answer: '50/(1 + 4e^(-3t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation is logistic with $K = 50$ and $r = 3$, so $y = \frac{50}{1 + Ce^{-3t}}$ with $C = \frac{50 - 10}{10} = 4$. Setting $t = 0$ confirms it: $\frac{50}{1 + 4} = 10$.'
          - problem: 'Solve the initial value problem $\frac{dP}{dt} = 4P\left(1 - \frac{P}{300}\right)$, $P(0) = 60$.'
            answer: '300/(1 + 4e^(-4t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Here $K = 300$ and $r = 4$, so $P = \frac{300}{1 + Ce^{-4t}}$. The initial condition gives $60 = \frac{300}{1 + C}$, so $1 + C = 5$ and $C = 4$.'
          - problem: 'A yeast culture grows logistically. Its mass $M(t)$ in grams satisfies $\frac{dM}{dt} = 2M\left(1 - \frac{M}{100}\right)$ with $M(0) = 20$. Find $M(t)$.'
            answer: '100/(1 + 4e^(-2t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The model has $K = 100$ and $r = 2$, so $M = \frac{100}{1 + Ce^{-2t}}$. The initial mass gives $C = \frac{100 - 20}{20} = 4$. So $M(t) = \frac{100}{1 + 4e^{-2t}}$.'
          - problem: 'A fish population $N(t)$ follows $\frac{dN}{dt} = 3N\left(1 - \frac{N}{600}\right)$ with $N(0) = 150$. Find $N(t)$.'
            answer: '600/(1 + 3e^(-3t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Here $K = 600$ and $r = 3$, so $N = \frac{600}{1 + Ce^{-3t}}$. The initial population gives $C = \frac{600 - 150}{150} = 3$. So $N(t) = \frac{600}{1 + 3e^{-3t}}$.'
          - problem: 'A rumor spreads through a town of $800$ people. The number of informed people $I(t)$ satisfies $\frac{dI}{dt} = 5I\left(1 - \frac{I}{800}\right)$, and $I(0) = 100$. Find $I(t)$.'
            answer: '800/(1 + 7e^(-5t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Here $K = 800$ and $r = 5$, so $I = \frac{800}{1 + Ce^{-5t}}$. The initial value gives $C = \frac{800 - 100}{100} = 7$. So $I(t) = \frac{800}{1 + 7e^{-5t}}$.'
          - problem: 'A bacteria colony starts with $200$ cells. It grows logistically with intrinsic growth rate $0.5$ per day, and the dish supports at most $1000$ cells. Find the number of cells $N(t)$ after $t$ days.'
            answer: '1000/(1 + 4e^(-0.5t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The model is $\frac{dN}{dt} = 0.5N\left(1 - \frac{N}{1000}\right)$ with $N(0) = 200$. Its solution is $N = \frac{1000}{1 + Ce^{-0.5t}}$ with $C = \frac{1000 - 200}{200} = 4$.'
          - problem: 'A flu spreads through a school of $1500$ students, and $30$ students are sick on day $0$. The number of sick students $I(t)$ grows logistically with intrinsic rate $0.4$ per day. Find $I(t)$.'
            answer: '1500/(1 + 49e^(-0.4t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The model is $\frac{dI}{dt} = 0.4I\left(1 - \frac{I}{1500}\right)$ with $I(0) = 30$. The solution has $C = \frac{1500 - 30}{30} = 49$. So $I(t) = \frac{1500}{1 + 49e^{-0.4t}}$.'
          - problem: 'Sam solves $\frac{dP}{dt} = 2P\left(1 - \frac{P}{600}\right)$ with $P(0) = 200$ and writes $P(t) = \frac{600}{1 + 200e^{-2t}}$. What is the correct solution?'
            answer: '600/(1 + 2e^(-2t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The constant is $C = \frac{K - P_0}{P_0} = \frac{600 - 200}{200} = 2$, not $P_0 = 200$. Setting $t = 0$ in the formula above gives $\frac{600}{201}$, which is not $200$. The correct solution is $P = \frac{600}{1 + 2e^{-2t}}$.'
        constraints: 'K and r integers or simple decimals; C = (K - P0)/P0 comes out an integer; the learner may have to set up the equation from the story'
      - id: kp3
        name: Reading the solution form
        key_prerequisites: [separable-equations]
        step_check:
          step: '$P(0) = \dfrac{2000}{1 + 19} = \dfrac{2000}{20} = 100$'
          question: 'Why is the denominator $1 + 19$ when $t = 0$?'
          options:
            - 'At $t = 0$ the exponential $e^{-t}$ has already died out to $0$'
            - 'Since $e^0 = 1$ at $t = 0$, the term $19e^{-t}$ becomes $19$'
            - 'The number $19$ is always added to $1$ when a population is measured'
          answer: 'Since $e^0 = 1$ at $t = 0$, the term $19e^{-t}$ becomes $19$'
          why: 'Any number to the power $0$ is $1$, so $e^{-t} = 1$ at $t = 0$. The term $19e^{-t}$ is then $19$, and the denominator is $20$.'
        exemplars:
          - problem: 'A population follows $P(t) = \dfrac{1000}{1 + 9e^{-t}}$ with $t$ in years. When does the population reach $500$? Round to two decimal places.'
            answer: '2.20'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'Set $\frac{1000}{1 + 9e^{-t}} = 500$. Then $1 + 9e^{-t} = 2$, so $e^{-t} = \frac{1}{9}$ and $t = \ln 9 \approx 2.20$ years.'
          - problem: 'A population follows $P(t) = \dfrac{4500}{1 + 14e^{-0.5t}}$. What was the initial population?'
            answer: '300'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $t = 0$ the exponential equals $1$, so $P(0) = \frac{4500}{1 + 14} = \frac{4500}{15} = 300$.'
          - problem: 'A population follows $P(t) = \dfrac{1800}{1 + Ce^{-0.5t}}$ and starts at $120$. Find $C$.'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $t = 0$ the formula gives $\frac{1800}{1 + C} = 120$. Then $1 + C = \frac{1800}{120} = 15$, so $C = 14$.'
          - problem: 'A population follows $P(t) = \dfrac{800}{1 + 15e^{-t}}$, with $t$ in years. When is the population half of its carrying capacity? Round to two decimal places.'
            answer: '2.71'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The carrying capacity is $800$, so half of it is $400$. Setting $\frac{800}{1 + 15e^{-t}} = 400$ gives $1 + 15e^{-t} = 2$, so $e^{-t} = \frac{1}{15}$ and $t = \ln 15 \approx 2.71$ years.'
          - problem: 'The population of a lake colony is $P(t) = \dfrac{2400}{1 + 11e^{-0.2t}}$. How many times larger is the carrying capacity than the initial population?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The carrying capacity is $2400$. The initial population is $P(0) = \frac{2400}{1 + 11} = 200$. Dividing, $\frac{2400}{200} = 12$, which is also $1 + 11$.'
          - problem: 'A population follows $P(t) = \dfrac{2500}{1 + 4e^{-0.3t}}$. What happens to the population in the long run? Does it grow without bound, die out, level off, or oscillate?'
            answer: 'levels off'
            answer_contract: {"kind": "label", "options": [["levels off", "it levels off", "the population levels off", "levels off at 2500", "it levels off at 2500", "leveling off", "stabilizes", "approaches 2500"], ["grows without bound", "it grows without bound", "unbounded", "grows forever", "increases without bound", "the population grows without bound"], ["dies out", "it dies out", "the population dies out", "it will die out", "goes extinct", "extinct", "goes to zero", "dies"], ["oscillates", "it oscillates", "oscillate", "cycles", "the population oscillates"]]}
            solution_sketch: 'As $t$ grows, $e^{-0.3t}$ tends to $0$, so the denominator tends to $1$. The population therefore tends to $2500$ and levels off there. It does not grow without bound, because the denominator never gets smaller than $1$.'
          - problem: 'A population follows $P(t) = \dfrac{1200}{1 + 5e^{-0.4t}}$, with $t$ in years. When does it reach $900$? Round to one decimal place.'
            answer: '6.8'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Setting $\frac{1200}{1 + 5e^{-0.4t}} = 900$ gives $1 + 5e^{-0.4t} = \frac{4}{3}$, so $e^{-0.4t} = \frac{1}{15}$. Then $t = \frac{\ln 15}{0.4} \approx 6.8$ years.'
          - problem: 'Sam reads $P(t) = \dfrac{3000}{1 + 19e^{-2t}}$ and says the initial population is $\dfrac{3000}{19}$. What is the initial population?'
            answer: '150'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $t = 0$ the exponential is $e^0 = 1$, so the denominator is $1 + 19 = 20$, not $19$. Then $P(0) = \frac{3000}{20} = 150$.'
        constraints: 'P0 and K read off directly; half-capacity time is a clean logarithm ln C; verdicts name the long-run behavior in words'
    diagnostic_exemplar:
      problem: 'Solve $P'' = 2P\left(1 - \dfrac{P}{600}\right)$ with $P(0) = 200$, and state the carrying capacity.'
      answer: '$P(t) = \dfrac{600}{1 + 2e^{-2t}}$; carrying capacity $600$.'
      answer_contract: {kind: none}
      solution_sketch: 'Here $r = 2$ and $K = 600$. Partial fractions give $P = \frac{K}{1 + Ae^{-rt}}$ with $A = \frac{K - P_0}{P_0} = \frac{400}{200} = 2$.'
    anki_seeds:
      - front: "In the logistic equation P' = rP(1 - P/K), K is the..."
        back: "carrying capacity: the stable equilibrium every positive solution approaches."
        type: basic
      - front: "Solution form of the logistic equation?"
        back: '$P = \dfrac{K}{1 + Ce^{-rt}}$ with $C = (K - P_0)/P_0$.'
        type: basic

  - id: first-order-applications
    name: Mixed First-Order Models
    core: false                # applications capstone; terminal
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: natural-growth-decay-models
        weight: 0.5
        key: true
      - id: mixing-tank-models
        weight: 0.5
        key: true
      - id: newtons-law-of-cooling
        weight: 0.4
        key: false
      - id: logistic-population-models
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Growth with harvesting or immigration
        key_prerequisites: [natural-growth-decay-models]
        step_check:
          step: 'the equilibrium is unstable'
          question: 'Why is the equilibrium at $150$ unstable?'
          options:
            - 'Above $150$ growth beats the harvest and below it the harvest wins, so both sides leave'
            - 'A constant harvest always pushes the population down toward zero, whatever its starting size'
            - 'The relative rate $0.8$ is below $1$, so every population shrinks away from $150$'
          answer: 'Above $150$ growth beats the harvest and below it the harvest wins, so both sides leave'
          why: 'Above $150$ the growth $0.8P$ exceeds the harvest $120$, so $P$ rises. Below $150$ the harvest is larger, so $P$ falls.'
        exemplars:
          - problem: 'A fish population grows at relative rate $0.5$ per year and is harvested at $100$ fish per year, so $\frac{dP}{dt} = 0.5P - 100$. Find the equilibrium population.'
            answer: '200'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At equilibrium the population does not change, so $0.5P - 100 = 0$. Then $0.5P = 100$ and $P = \frac{100}{0.5} = 200$ fish.'
          - problem: 'A fish population grows at relative rate $0.5$ per year, and $100$ fish are harvested each year. Write the differential equation for the population $P(t)$ after $t$ years.'
            answer: '0.5P - 100'
            answer_contract: {"kind": "function", "vars": ["P"]}
            solution_sketch: 'Growth adds $0.5P$ fish per year, because the rate is relative to the population. The harvest removes $100$ fish per year, a constant. So $\frac{dP}{dt} = 0.5P - 100$.'
          - problem: 'A fish population obeys $\frac{dP}{dt} = 0.5P - 100$ with $P(0) = 300$. When does the population reach $500$? Round to two decimal places.'
            answer: '2.20'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The equilibrium is $200$, so $P = 200 + 100e^{0.5t}$. Setting $P = 500$ gives $e^{0.5t} = 3$, so $t = 2 \ln 3 \approx 2.20$ years.'
          - problem: 'A fish population obeys $\frac{dP}{dt} = 0.25P - 50$ with $P(0) = 100$. When does the population die out? Round to two decimal places.'
            answer: '2.77'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The equilibrium is $\frac{50}{0.25} = 200$, so $P = 200 - 100e^{0.25t}$. The population is $0$ when $e^{0.25t} = 2$, so $t = 4 \ln 2 \approx 2.77$ years.'
          - problem: 'A fish population grows at relative rate $0.3$ per year and is harvested at a constant rate of $h$ fish per year, so $\frac{dP}{dt} = 0.3P - h$. The population stays constant at $150$ fish. Find $h$.'
            answer: '45'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A constant population means $\frac{dP}{dt} = 0$, so $0.3 \cdot 150 - h = 0$. Therefore $h = 45$ fish per year.'
          - problem: 'A fish population obeys $\frac{dP}{dt} = 0.2P - 30$ with $P(0) = 200$. Find $P(5)$. Round to one decimal place.'
            answer: '285.9'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The equilibrium is $\frac{30}{0.2} = 150$, so $P = 150 + 50e^{0.2t}$. At $t = 5$ this is $150 + 50e \approx 285.9$ fish.'
          - problem: 'Sam studies $\frac{dP}{dt} = 0.4P - 200$ and finds the equilibrium by dividing the growth rate by the harvest: $\frac{0.4}{200} = 0.002$. What is the equilibrium population?'
            answer: '500'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At equilibrium $0.4P - 200 = 0$, so $0.4P = 200$. Dividing by $0.4$ gives $P = \frac{200}{0.4} = 500$. The harvest is divided by the growth rate, not the other way round.'
          - problem: 'A lake holds $150$ fish, and $\frac{dP}{dt} = 0.5P - 100$ for the population $P(t)$. Does the fish population grow without bound or die out?'
            answer: 'dies out'
            answer_contract: {"kind": "label", "options": [["dies out", "it dies out", "the population dies out", "it will die out", "goes extinct", "extinct", "declines to zero", "dies"], ["grows without bound", "it grows without bound", "grows", "increases without bound", "grows forever", "it grows", "it will grow", "grows without limit"]]}
            solution_sketch: 'The equilibrium is $\frac{100}{0.5} = 200$. The lake starts at $150$, below the equilibrium, where $0.5P - 100$ is negative. So the population decreases and dies out.'
        constraints: 'P'' = kP - h with clean equilibrium h/k; the equilibrium is unstable: solutions diverge on both sides; contexts ask to set up the model, find h or the equilibrium, or the time of extinction'
      - id: kp2
        name: Linear models across domains
        key_prerequisites: [mixing-tank-models]
        step_check:
          step: '$\frac{a}{b} = \frac{30}{3} = 10$'
          question: 'Why does the equilibrium value equal $\frac{a}{b}$?'
          options:
            - 'The ratio $\frac{a}{b}$ is the value at which the term $Ce^{-bt}$ is largest'
            - 'The initial value $P(0)$ always equals $\frac{a}{b}$ in a model of this form'
            - 'At equilibrium the rate is $0$, so $a - bP = 0$ and $P = \frac{a}{b}$'
          answer: 'At equilibrium the rate is $0$, so $a - bP = 0$ and $P = \frac{a}{b}$'
          why: 'An equilibrium does not change, so $\dfrac{dP}{dt} = a - bP = 0$. Solving for $P$ gives $\dfrac{a}{b}$.'
        exemplars:
          - problem: 'A capacitor charging from a $12$ V source satisfies $\frac{dV}{dt} = \frac{12 - V}{2}$ with $V(0) = 0$. Find $V(t)$.'
            answer: '12(1 - e^(-t/2))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equation is $\frac{dV}{dt} = 6 - \frac{V}{2}$ with equilibrium $V = 12$. So $V = 12 + Ce^{-t/2}$, and $V(0) = 0$ gives $C = -12$. Thus $V(t) = 12\left(1 - e^{-t/2}\right)$.'
          - problem: 'A falling object with air drag proportional to its speed satisfies $\frac{dv}{dt} = 12 - 3v$. It is dropped from rest. Find $v(t)$.'
            answer: '4 - 4e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equilibrium is $v = \frac{12}{3} = 4$, so $v = 4 + Ce^{-3t}$. Starting from rest, $v(0) = 0$ gives $C = -4$. So $v(t) = 4 - 4e^{-3t}$.'
          - problem: 'A drug is infused into a patient at $30$ mg/h, and the body removes it at a rate equal to $2$ times the amount present per hour. The patient starts with $4$ mg of the drug. Find the amount $A(t)$ after $t$ hours.'
            answer: '15 - 11e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The model is $\frac{dA}{dt} = 30 - 2A$ with equilibrium $A = \frac{30}{2} = 15$. So $A = 15 + Ce^{-2t}$, and $A(0) = 4$ gives $C = -11$. Thus $A(t) = 15 - 11e^{-2t}$.'
          - problem: 'A mixing tank initially holds $5$ kg of salt, and the inflow makes the salt amount obey $\frac{dA}{dt} = 6 - 2A$ with $A$ in kilograms. Find $A(t)$.'
            answer: '3 + 2e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equilibrium is $A = \frac{6}{2} = 3$, so $A = 3 + Ce^{-2t}$. The initial amount $A(0) = 5$ gives $C = 2$. So $A(t) = 3 + 2e^{-2t}$.'
          - problem: 'A cup of coffee at $90$ degrees Celsius stands in a cool room. Its temperature $T$ obeys $\frac{dT}{dt} = 60 - 3T$, with $t$ in minutes. Find $T(t)$.'
            answer: '20 + 70e^(-3t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equilibrium is $T = \frac{60}{3} = 20$, the room temperature. So $T = 20 + Ce^{-3t}$, and $T(0) = 90$ gives $C = 70$. Thus $T(t) = 20 + 70e^{-3t}$.'
          - problem: 'A drug is infused at $9$ mg/h and removed at a rate equal to $3$ times the amount present per hour, so $\frac{dA}{dt} = 9 - 3A$ with $A(0) = 0$. How many mg of the drug are in the body after $1$ hour? Round to two decimal places.'
            answer: '2.85'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The equilibrium is $\frac{9}{3} = 3$, so $A = 3 + Ce^{-3t}$ and $A(0) = 0$ gives $C = -3$. At $t = 1$ the amount is $3 - 3e^{-3} \approx 2.85$ mg.'
          - problem: 'A falling object satisfies $\frac{dv}{dt} = 9.8 - 0.2v$, with $v$ in m/s. What is its terminal speed?'
            answer: '49'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}
            solution_sketch: 'The speed stops changing when $\frac{dv}{dt} = 0$, so $9.8 - 0.2v = 0$. Dividing, $v = \frac{9.8}{0.2} = 49$ m/s.'
          - problem: 'A patient receives a drug from a pump at $20$ mg/h. The body removes $15\%$ of the drug present each hour. Write the differential equation for the amount $A(t)$ of the drug in mg after $t$ hours.'
            answer: '20 - 0.15A'
            answer_contract: {"kind": "function", "vars": ["A"]}
            solution_sketch: 'The pump adds $20$ mg per hour, a constant rate. The body removes $15\%$ of the amount present, which is $0.15A$ mg per hour. So $\frac{dA}{dt} = 20 - 0.15A$.'
          - problem: 'Sam solves $\frac{dT}{dt} = 40 - 2T$ with $T(0) = 5$ and writes $T(t) = 40 - 35e^{-2t}$. What is the correct solution?'
            answer: '20 - 15e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The equilibrium is $T = \frac{40}{2} = 20$, not $40$. So $T = 20 + Ce^{-2t}$, and $T(0) = 5$ gives $C = -15$. Thus $T(t) = 20 - 15e^{-2t}$.'
        constraints: 'all models are y'' = a - by with clean equilibrium a/b; emphasize the shared structure across contexts; some items ask for the model itself'
      - id: kp3
        name: Two-stage prediction problems
        key_prerequisites: [newtons-law-of-cooling, natural-growth-decay-models]
        step_check:
          step: '$T(10) = 65$ leads to $e^{-10k} = \frac{2}{3}$'
          question: 'Why does $T(10) = 65$ lead to $e^{-10k} = \frac{2}{3}$?'
          options:
            - 'The temperature fell by $20$ degrees in $10$ minutes, and $\frac{20}{30} = \frac{2}{3}$'
            - 'Putting $t = 10$ in $25 + 60e^{-kt} = 65$ gives $60e^{-10k} = 40$'
            - 'The ratio of $65$ to the starting temperature $85$ is about $\frac{2}{3}$, so $e^{-10k}$ is too'
          answer: 'Putting $t = 10$ in $25 + 60e^{-kt} = 65$ gives $60e^{-10k} = 40$'
          why: 'The model is $T = 25 + 60e^{-kt}$. At $t = 10$ it equals $65$, so $60e^{-10k} = 40$ and $e^{-10k} = \frac{2}{3}$.'
        exemplars:
          - problem: 'Coffee at $90$ degrees Celsius stands in a $20$ degree room. After $10$ minutes it has cooled to $70$ degrees. Assuming Newton''s law of cooling, how long after it was poured does it reach $50$ degrees? Round to one decimal place.'
            answer: '25.2'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The model is $T = 20 + 70e^{-kt}$. At $10$ minutes $70e^{-10k} = 50$, so $k = \frac{1}{10}\ln\frac{7}{5}$. Then $70e^{-kt} = 30$ gives $t = \frac{\ln(7/3)}{k} = \frac{10 \ln(7/3)}{\ln(7/5)} \approx 25.2$ minutes.'
          - problem: 'Coffee at $90$ degrees Celsius stands in a $20$ degree room and cools to $70$ degrees in $t$ minutes. Assuming Newton''s law of cooling, how many minutes after it was poured does it reach $50$ degrees? Find this time in terms of $t$.'
            answer: 't ln(7/3)/ln(7/5)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The model is $T(s) = 20 + 70e^{-ks}$. The measurement $T(t) = 70$ gives $e^{-kt} = \frac{5}{7}$, so $k = \frac{\ln(7/5)}{t}$. Reaching $50$ needs $e^{-ks} = \frac{3}{7}$, so $s = \frac{\ln(7/3)}{k} = \frac{t \ln(7/3)}{\ln(7/5)}$ minutes.'
          - problem: 'A bacteria culture doubles in $t$ hours. Assuming exponential growth, how long does it take to reach $10$ times its initial size? Find this time in terms of $t$.'
            answer: 't ln(10)/ln(2)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The model is $P(s) = P_0 e^{ks}$. Doubling in $t$ hours gives $e^{kt} = 2$, so $k = \frac{\ln 2}{t}$. Reaching $10P_0$ needs $e^{ks} = 10$, so $s = \frac{\ln 10}{k} = \frac{t \ln 10}{\ln 2}$ hours.'
          - problem: 'A yeast culture triples in $4$ hours. Assuming exponential growth, how long does it take to reach $5$ times its initial size? Round to one decimal place.'
            answer: '5.9'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The model is $P = P_0 e^{kt}$. Tripling in $4$ hours gives $e^{4k} = 3$, so $k = \frac{\ln 3}{4}$. Reaching $5P_0$ needs $e^{kt} = 5$, so $t = \frac{\ln 5}{k} = \frac{4 \ln 5}{\ln 3} \approx 5.9$ hours.'
          - problem: 'A radioactive isotope has a half-life of $8$ days. How many days does it take for a sample to decay to $80\%$ of its initial amount? Round to one decimal place.'
            answer: '2.6'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The model is $A = A_0 e^{-kt}$. A half-life of $8$ days gives $e^{-8k} = \frac{1}{2}$, so $k = \frac{\ln 2}{8}$. Reaching $0.8A_0$ needs $e^{-kt} = \frac{4}{5}$, so $t = \frac{8 \ln(5/4)}{\ln 2} \approx 2.6$ days.'
          - problem: 'Tea at $80$ degrees Celsius stands in a $20$ degree room and cools to $60$ degrees in $t$ minutes. Assuming Newton''s law of cooling, how many minutes after it was poured does it reach $40$ degrees? Find this time in terms of $t$.'
            answer: 't ln(3)/ln(3/2)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The model is $T(s) = 20 + 60e^{-ks}$. The measurement $T(t) = 60$ gives $e^{-kt} = \frac{2}{3}$, so $k = \frac{\ln(3/2)}{t}$. Reaching $40$ needs $e^{-ks} = \frac{1}{3}$, so $s = \frac{\ln 3}{k} = \frac{t \ln 3}{\ln(3/2)}$ minutes.'
          - problem: 'A metal bar at $100$ degrees Celsius stands in a $25$ degree room. After $6$ minutes it has cooled to $70$ degrees. Assuming Newton''s law of cooling, how long after the start does it reach $50$ degrees? Round to one decimal place.'
            answer: '12.9'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The model is $T = 25 + 75e^{-kt}$. At $6$ minutes $75e^{-6k} = 45$, so $e^{-6k} = \frac{3}{5}$ and $k = \frac{1}{6}\ln\frac{5}{3}$. Reaching $50$ needs $e^{-kt} = \frac{1}{3}$, so $t = \frac{6 \ln 3}{\ln(5/3)} \approx 12.9$ minutes.'
          - problem: 'A radioactive isotope has a half-life of $t$ years. How long does it take for a sample to decay to $80\%$ of its initial amount? Find this time in terms of $t$.'
            answer: 't ln(5/4)/ln(2)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The model is $A(s) = A_0 e^{-ks}$. A half-life of $t$ years gives $e^{-kt} = \frac{1}{2}$, so $k = \frac{\ln 2}{t}$. Reaching $0.8A_0$ needs $e^{-ks} = \frac{4}{5}$, so $s = \frac{\ln(5/4)}{k} = \frac{t \ln(5/4)}{\ln 2}$ years.'
          - problem: 'A culture doubles in $3$ hours. Sam says it reaches $10$ times its initial size after $15$ hours, because $10$ is $5$ times $2$. How long does it really take? Round to one decimal place.'
            answer: '10.0'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The model is $P = P_0 e^{kt}$. Doubling in $3$ hours gives $k = \frac{\ln 2}{3}$. Reaching $10P_0$ needs $e^{kt} = 10$, so $t = \frac{3 \ln 10}{\ln 2} \approx 10.0$ hours, well below Sam''s $15$ hours.'
        constraints: 'first stage determines k from one measurement; second stage inverts for a time; answers are logarithms, either in terms of the measured time t or rounded numbers'
    diagnostic_exemplar:
      problem: 'A fish population grows at relative rate $0.4$ per year but is harvested at a constant $200$ fish per year: $P'' = 0.4P - 200$. With $P(0) = 400$, when does the population die out?'
      answer: '$t = \dfrac{5\ln 5}{2}$ years.'
      answer_contract: {kind: none}
      solution_sketch: 'The equilibrium is $P = 500$, and $P = 500 + (400 - 500)e^{0.4t} = 500 - 100e^{0.4t}$. This is zero when $e^{0.4t} = 5$, i.e. $t = \frac{\ln 5}{0.4} = \frac{5\ln 5}{2}$.'
    anki_seeds:
      - front: "Equilibrium of the harvested growth model P' = kP - h?"
        back: "P = h/k — and it is unstable: solutions diverge from it on both sides."
        type: basic
      - front: "Terminal velocity for v' = g - (k/m)v?"
        back: "$v_{\\infty} = mg/k$: set $v' = 0$."
        type: basic

  - id: orthogonal-trajectories
    name: Orthogonal Trajectories
    core: false                # application genre; terminal
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: separable-equations
        weight: 0.5
        key: true
      - id: implicit-differentiation
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: The ODE of a family of curves
        key_prerequisites: [implicit-differentiation]
        step_check:
          step: 'Substitute $C$ into the derivative'
          question: 'Why must $C$ be removed from the derivative $\dfrac{dy}{dx} = 3Cx^2$?'
          options:
            - 'A derivative that still contains $C$ cannot be integrated later in the solution of the problem'
            - 'The equation must hold for the whole family, so it cannot depend on the $C$ of one curve'
            - 'The constant $C$ is zero for the curve that we want, so it can be dropped from the equation'
          answer: 'The equation must hold for the whole family, so it cannot depend on the $C$ of one curve'
          why: 'Each value of $C$ picks one curve. A differential equation for the whole family must hold for all of them, so $C$ is replaced by $\dfrac{y}{x^3}$.'
        exemplars:
          - problem: 'Find the differential equation satisfied by every curve of the family $y = Cx^2$.'
            answer: '2y/x'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Differentiating gives $\frac{dy}{dx} = 2Cx$. The family equation gives $C = \frac{y}{x^2}$. Substituting, $\frac{dy}{dx} = 2 \cdot \frac{y}{x^2} \cdot x = \frac{2y}{x}$, which no longer contains $C$.'
          - problem: 'The isotherms around a heat source at the origin are the circles $x^2 + y^2 = C$. Find the differential equation satisfied by these circles.'
            answer: '-x/y'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Differentiating implicitly gives $2x + 2y\frac{dy}{dx} = 0$. The constant $C$ disappears because its derivative is $0$. Solving, $\frac{dy}{dx} = -\frac{x}{y}$.'
          - problem: 'Find the differential equation of the family of lines $y = Cx$ through the origin.'
            answer: 'y/x'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Differentiating gives $\frac{dy}{dx} = C$. The family equation gives $C = \frac{y}{x}$. So $\frac{dy}{dx} = \frac{y}{x}$.'
          - problem: 'Find the differential equation of the family of hyperbolas $xy = C$.'
            answer: '-y/x'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Differentiating implicitly gives $y + x\frac{dy}{dx} = 0$. The constant $C$ disappears. Solving, $\frac{dy}{dx} = -\frac{y}{x}$.'
          - problem: 'Find the differential equation of the family $y = Ce^{2x}$.'
            answer: '2y'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Differentiating gives $\frac{dy}{dx} = 2Ce^{2x}$. The family equation says $Ce^{2x} = y$. So $\frac{dy}{dx} = 2y$.'
          - problem: 'Find the differential equation of the family $y = Cx^2 + 1$.'
            answer: '2(y - 1)/x'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Differentiating gives $\frac{dy}{dx} = 2Cx$. The family equation gives $C = \frac{y - 1}{x^2}$. So $\frac{dy}{dx} = 2 \cdot \frac{y - 1}{x^2} \cdot x = \frac{2(y - 1)}{x}$.'
          - problem: 'On a weather map the isobars are the ellipses $x^2 + 2y^2 = C$. Find the differential equation satisfied by the isobars.'
            answer: '-x/(2y)'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Differentiating implicitly gives $2x + 4y\frac{dy}{dx} = 0$. The constant $C$ disappears. Solving, $\frac{dy}{dx} = -\frac{x}{2y}$.'
          - problem: 'Sam says that $\frac{dy}{dx} = 4Cx^3$ is the differential equation of the family $y = Cx^4$. What is the differential equation of the family?'
            answer: '4y/x'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'The equation $\frac{dy}{dx} = 4Cx^3$ still contains $C$, so it describes only one curve at a time. Replace $C$ by $\frac{y}{x^4}$ from the family equation. Then $\frac{dy}{dx} = 4 \cdot \frac{y}{x^4} \cdot x^3 = \frac{4y}{x}$.'
        constraints: 'one-parameter families; eliminate C between the equation and its derivative; the answer is the right side of the differential equation, and an equation with dy/dx in front is read too'
      - id: kp2
        name: The orthogonality condition
        key_prerequisites: [implicit-differentiation]
        step_check:
          step: 'Replace $y''$ with $-1/y''$ to find the orthogonal trajectories'
          question: 'Why is $y''$ replaced by $-1/y''$ for the orthogonal curves?'
          options:
            - 'Orthogonal curves have the opposite slope, so only the sign of the slope is changed here'
            - 'The reciprocal makes the new curve steeper than the old one, which is what perpendicular means'
            - 'Perpendicular slopes multiply to $-1$, so each is the negative reciprocal of the other'
          answer: 'Perpendicular slopes multiply to $-1$, so each is the negative reciprocal of the other'
          why: 'At a crossing point the tangent lines are perpendicular, so their slopes multiply to $-1$. If the family has slope $y''$ there, the orthogonal curve has slope $-1/y''$.'
        try_first:
          problem: 'A curve of a family has slope $4$ at a point. What is the slope, at that same point, of the curve that crosses it at a right angle?'
          answer_contract: {"kind": "exact"}
          answer: '-1/4'
          reveal: 'Perpendicular curves have slopes whose product is $-1$, so the slope is $-\frac{1}{4}$. In the same way the orthogonal family has slope $-1/y''$ wherever the first family has slope $y''$.'
        exemplars:
          - problem: 'The family $y = Cx^2$ satisfies $\frac{dy}{dx} = \frac{2y}{x}$. Find the differential equation of its orthogonal trajectories.'
            answer: '-x/(2y)'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Orthogonal curves have slopes that are negative reciprocals. The family has slope $\frac{2y}{x}$, so the orthogonal curves have slope $-\frac{x}{2y}$. Hence $\frac{dy}{dx} = -\frac{x}{2y}$.'
          - problem: 'The circles $x^2 + y^2 = C$ satisfy $\frac{dy}{dx} = -\frac{x}{y}$. Find the differential equation of their orthogonal trajectories.'
            answer: 'y/x'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'The circles have slope $-\frac{x}{y}$. The negative reciprocal of this slope is $\frac{y}{x}$. So the orthogonal curves satisfy $\frac{dy}{dx} = \frac{y}{x}$.'
          - problem: 'The lines $y = Cx$ satisfy $\frac{dy}{dx} = \frac{y}{x}$. Find the differential equation of their orthogonal trajectories.'
            answer: '-x/y'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'The lines have slope $\frac{y}{x}$. The negative reciprocal of this slope is $-\frac{x}{y}$. So the orthogonal curves satisfy $\frac{dy}{dx} = -\frac{x}{y}$.'
          - problem: 'The hyperbolas $xy = C$ satisfy $\frac{dy}{dx} = -\frac{y}{x}$. Find the differential equation of their orthogonal trajectories.'
            answer: 'x/y'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'The hyperbolas have slope $-\frac{y}{x}$. The negative reciprocal of this slope is $\frac{x}{y}$. So the orthogonal curves satisfy $\frac{dy}{dx} = \frac{x}{y}$.'
          - problem: 'In a metal plate the isotherms are the parabolas $y^2 = Cx$, and heat flows along their orthogonal trajectories. The isotherms satisfy $\frac{dy}{dx} = \frac{y}{2x}$. Find the differential equation of the heat-flow lines.'
            answer: '-2x/y'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'The isotherms have slope $\frac{y}{2x}$. A heat-flow line crosses them at a right angle, so its slope is the negative reciprocal, $-\frac{2x}{y}$. Hence $\frac{dy}{dx} = -\frac{2x}{y}$.'
          - problem: 'The hyperbolas $x^2 - y^2 = C$ satisfy $\frac{dy}{dx} = \frac{x}{y}$. Find the differential equation of their orthogonal trajectories.'
            answer: '-y/x'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'The hyperbolas have slope $\frac{x}{y}$. The negative reciprocal of this slope is $-\frac{y}{x}$. So the orthogonal curves satisfy $\frac{dy}{dx} = -\frac{y}{x}$.'
          - problem: 'Find the slope at $(2, 8)$ of the orthogonal trajectory to the family $y = Cx^2$ that passes through that point.'
            answer: '-1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The family has slope $\frac{2y}{x}$, which is $\frac{2 \cdot 8}{2} = 8$ at $(2, 8)$. The orthogonal trajectory has the negative reciprocal slope, $-\frac{1}{8}$.'
          - problem: 'Heat flows along the orthogonal trajectories of the isotherms $x^2 + y^2 = C$. At the point $(3, 4)$, what is the slope of the flow line?'
            answer: '4/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The isotherms satisfy $\frac{dy}{dx} = -\frac{x}{y}$, so at $(3, 4)$ their slope is $-\frac{3}{4}$. The flow line is perpendicular, so its slope is the negative reciprocal, $\frac{4}{3}$.'
          - problem: 'The family $y = Cx^3$ satisfies $\frac{dy}{dx} = \frac{3y}{x}$. Sam writes the differential equation of the orthogonal trajectories as $\frac{dy}{dx} = -\frac{3y}{x}$. What is the correct differential equation?'
            answer: '-x/(3y)'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Sam only changed the sign. The negative reciprocal of $\frac{3y}{x}$ is $-\frac{x}{3y}$, so the orthogonal curves satisfy $\frac{dy}{dx} = -\frac{x}{3y}$. The reciprocal also turns $\frac{3y}{x}$ upside down.'
        constraints: 'the step is y'' -> -1/y'' followed by simplifying the right side; items also ask for the slope of the orthogonal trajectory at a point'
      - id: kp3
        name: Solving for the trajectories
        key_prerequisites: [separable-equations, implicit-differentiation]
        step_check:
          step: 'Separate variables and integrate'
          question: 'Why can the equation $y'' = \dfrac{x}{y}$ be integrated by separating variables?'
          options:
            - 'It gives $y\,dy = x\,dx$, with the $y$ terms on one side and the $x$ terms on the other'
            - 'Because $y''$ equals $\dfrac{x}{y}$ only when $x$ and $y$ are both positive numbers'
            - 'The constant $C$ must be moved to one side first, and then the equation can be integrated'
          answer: 'It gives $y\,dy = x\,dx$, with the $y$ terms on one side and the $x$ terms on the other'
          why: 'Multiplying both sides of $\dfrac{dy}{dx} = \dfrac{x}{y}$ by $y\,dx$ gives $y\,dy = x\,dx$. Each side now has one variable, so both can be integrated.'
        exemplars:
          - problem: 'The curves $y = Ax^2$ form a family. Find $y(x)$ for the orthogonal trajectory of the family that passes through $(1, 2)$.'
            answer: 'sqrt((9 - x^2)/2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The family satisfies $\frac{dy}{dx} = \frac{2y}{x}$, so the orthogonal curves satisfy $\frac{dy}{dx} = -\frac{x}{2y}$. Separating, $2y\,dy = -x\,dx$ gives $y^2 = -\frac{x^2}{2} + c$, that is $x^2 + 2y^2 = C$. The point $(1, 2)$ gives $C = 1 + 8 = 9$, so $y = \sqrt{\frac{9 - x^2}{2}}$ on the upper branch.'
          - problem: 'Heat spreads from a point source at the origin, and the isotherms are the circles $x^2 + y^2 = A$. Heat flows along the orthogonal trajectories of the isotherms. Find $y(x)$ for the flow line through $(2, 5)$.'
            answer: '5x/2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The circles satisfy $\frac{dy}{dx} = -\frac{x}{y}$, so the flow lines satisfy $\frac{dy}{dx} = \frac{y}{x}$. Separating gives $\ln|y| = \ln|x| + c$, so $y = Cx$. The point $(2, 5)$ gives $5 = 2C$, so $C = \frac{5}{2}$ and $y = \frac{5x}{2}$.'
          - problem: 'The curves $y = A/x$ form a family. Find $y(x)$ for the orthogonal trajectory of the family that passes through $(1, 2)$.'
            answer: 'sqrt(x^2 + 3)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The family satisfies $\frac{dy}{dx} = -\frac{y}{x}$, so the orthogonal curves satisfy $\frac{dy}{dx} = \frac{x}{y}$. Separating, $y\,dy = x\,dx$ gives $y^2 - x^2 = C$. The point $(1, 2)$ gives $C = 4 - 1 = 3$, so $y = \sqrt{x^2 + 3}$.'
          - problem: 'The curves $y = Ax^3$ form a family. Find $y(x)$ for the orthogonal trajectory of the family that passes through $(2, 1)$.'
            answer: 'sqrt((7 - x^2)/3)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The family satisfies $\frac{dy}{dx} = \frac{3y}{x}$, so the orthogonal curves satisfy $\frac{dy}{dx} = -\frac{x}{3y}$. Separating, $3y\,dy = -x\,dx$ gives $x^2 + 3y^2 = C$. The point $(2, 1)$ gives $C = 4 + 3 = 7$, so $y = \sqrt{\frac{7 - x^2}{3}}$.'
          - problem: 'The curves $y = A/x^2$ form a family. Find $y(x)$ for the orthogonal trajectory of the family that passes through $(4, 1)$.'
            answer: 'sqrt((x^2 - 14)/2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The family satisfies $\frac{dy}{dx} = -\frac{2y}{x}$, so the orthogonal curves satisfy $\frac{dy}{dx} = \frac{x}{2y}$. Separating, $2y\,dy = x\,dx$ gives $x^2 - 2y^2 = C$. The point $(4, 1)$ gives $C = 16 - 2 = 14$, so $y = \sqrt{\frac{x^2 - 14}{2}}$.'
          - problem: 'The parabolas $y^2 = Ax$ form a family. Find $y(x)$ for the orthogonal trajectory of the family that passes through $(1, 3)$.'
            answer: 'sqrt(11 - 2x^2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The family satisfies $\frac{dy}{dx} = \frac{y}{2x}$, so the orthogonal curves satisfy $\frac{dy}{dx} = -\frac{2x}{y}$. Separating, $y\,dy = -2x\,dx$ gives $y^2 + 2x^2 = C$. The point $(1, 3)$ gives $C = 9 + 2 = 11$, so $y = \sqrt{11 - 2x^2}$.'
          - problem: 'In a metal plate the isotherms are the ellipses $x^2 + 2y^2 = A$. Find $y(x)$ for the heat-flow line, which is orthogonal to the isotherms, through $(2, 1)$.'
            answer: 'x^2/4'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The ellipses satisfy $\frac{dy}{dx} = -\frac{x}{2y}$, so the flow lines satisfy $\frac{dy}{dx} = \frac{2y}{x}$. Separating gives $\ln|y| = 2\ln|x| + c$, so $y = Cx^2$. The point $(2, 1)$ gives $1 = 4C$, so $C = \frac{1}{4}$ and $y = \frac{x^2}{4}$.'
          - problem: 'Find $y(x)$ for the orthogonal trajectory through $(0, 1)$ of the family $y = Ce^x$.'
            answer: 'sqrt(1 - 2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The family satisfies $\frac{dy}{dx} = y$, so the orthogonal curves satisfy $\frac{dy}{dx} = -\frac{1}{y}$. Separating, $y\,dy = -dx$ gives $\frac{y^2}{2} = -x + c$. The point $(0, 1)$ gives $c = \frac{1}{2}$, so $y^2 = 1 - 2x$ and $y = \sqrt{1 - 2x}$.'
          - problem: 'Sam finds the orthogonal trajectory of $y = Ax^2$ through $(2, 3)$. He separates $2y\,dy = -x\,dx$ but then integrates to $y^2 = -x^2 + C$. Find $y(x)$ for the correct trajectory.'
            answer: 'sqrt((22 - x^2)/2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integral of $2y\,dy$ is $y^2$, and the integral of $-x\,dx$ is $-\frac{x^2}{2}$, so Sam lost the factor $\frac{1}{2}$. Hence $y^2 = -\frac{x^2}{2} + c$, that is $x^2 + 2y^2 = C$. The point $(2, 3)$ gives $C = 4 + 18 = 22$, so $y = \sqrt{\frac{22 - x^2}{2}}$.'
        constraints: 'trajectory ODEs are separable with power/log integrals; the answer is y as a function of x on the branch through the given point'
    diagnostic_exemplar:
      problem: "Find the orthogonal trajectories of the lines $y = Cx$."
      answer: "The circles $x^2 + y^2 = C$."
      answer_contract: {kind: none}
      solution_sketch: "The lines satisfy $y' = y/x$; the trajectories solve $y' = -x/y$, which integrates to $x^2 + y^2 = C$."
