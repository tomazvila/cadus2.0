unit: first-order
course: differential-equations
module: "First-Order Equations"
topics:
  - id: ode-order-linearity
    name: Order and Linearity of Differential Equations
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: higher-order-derivatives
        weight: 0.5
        key: true
      - id: derivatives-trig
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: Identifying the order
        key_prerequisites: [higher-order-derivatives]
        step_check:
          step: 'but it does not change the order'
          question: 'Why does the square on $y''$ not change the order of the equation?'
          options:
            - 'The order is the largest exponent in the equation, and that is 2'
            - 'Squaring $y''$ does not differentiate $y$ again, so the order stays'
            - 'A power of a derivative is counted as a derivative of one order higher'
            - 'Powers are ignored only when the base is a first derivative'
          answer: 'Squaring $y''$ does not differentiate $y$ again, so the order stays'
          why: 'The order is the number of times $y$ is differentiated in the highest derivative. In $y'''' + (y'')^2 + y = 0$ that is $y''''$, so the order is 2, and the exponent plays no part.'
        exemplars:
          - problem: 'What is the order of the differential equation $y'''' + 3y'' - y = x$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The order is the order of the highest derivative of $y$ in the equation. Here the highest derivative is $y''''$, a second derivative, so the order is 2.'
          - problem: 'What is the order of $(y'')^3 + y = 0$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent 3 is a power of the first derivative $y''$. A power does not change how many times $y$ is differentiated, so the highest derivative is $y''$ and the order is 1.'
          - problem: 'Find the order of $y'''''' - x^2 y'' = e^x$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivatives of $y$ in the equation are $y''''''$ and $y''$, and $x^2$ is only a coefficient. The highest derivative is $y''''''$, a third derivative, so the order is 3.'
          - problem: 'A falling body with air resistance has a position $x(t)$ that satisfies $\frac{d^2x}{dt^2} = -9.8 - 0.1\left(\frac{dx}{dt}\right)^2$. What is the order of this equation?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The highest derivative is $\frac{d^2x}{dt^2}$, a second derivative. The square on $\frac{dx}{dt}$ does not raise the order, so the order is 2.'
          - problem: 'The deflection $y(x)$ of a beam under a load $w(x)$ satisfies $EI\,\frac{d^4y}{dx^4} = w(x)$, where $E$ and $I$ are constants. What is the order of this equation?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The highest derivative is $\frac{d^4y}{dx^4}$, a fourth derivative. The constants $E$ and $I$ and the load $w(x)$ do not change the order, so the order is 4.'
          - problem: 'Sam says that $(y'''')^5 + y = 0$ has order 5 because the largest exponent is 5. What is the correct order?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent 5 is a power, and a power does not set the order. The only derivative in the equation is $y''''$, a second derivative, so the correct order is 2.'
          - problem: 'The charge $q(t)$ on a capacitor in a circuit with inductance $L$, resistance $R$ and capacitance $C$ satisfies $L\,q'''' + R\,q'' + \frac{1}{C}q = E(t)$. What is the order of this equation?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivatives of $q$ are $q''''$ and $q''$, and $L$, $R$ and $C$ are constants. The highest derivative is $q''''$, so the order is 2.'
          - problem: 'What is the order of $\left(\frac{dy}{dt}\right)^4 + y = \sin t$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The only derivative is $\frac{dy}{dt}$, a first derivative. The fourth power does not raise the order, so the order is 1.'
        constraints: "orders 1-4; include powers of lower-order derivatives as distractors"
      - id: kp2
        name: Linear or nonlinear
        key_prerequisites: []
        step_check:
          step: 'the term $e^y$ is a nonlinear function of $y$'
          question: 'Why does the term $e^y$ make the equation $y'' + e^y = x$ nonlinear?'
          options:
            - 'Exponential functions are never allowed in any differential equation'
            - 'The right side $x$ is not zero, so the equation cannot be linear'
            - 'The unknown $y$ is inside a function that is not first degree'
            - 'The term $e^y$ is a derivative of $y$ of higher order'
          answer: 'The unknown $y$ is inside a function that is not first degree'
          why: 'A linear equation allows $y$ and its derivatives only to the first power, with coefficients that depend on $x$ alone. The function $e^y$ breaks that rule, and the right side $x$ is allowed.'
        exemplars:
          - problem: 'Which of the following equations are linear? (1) $y'''' + 3y = \sin x$, (2) $y'' + y^2 = x$, (3) $y'' + \sin y = 1$, (4) $y'''''' + x^2 y'' = e^x$.'
            answer: '1, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An equation is linear when $y$ and its derivatives appear only to the first power, with coefficients that depend on $x$ alone. Equations (1) and (4) pass this test. Equation (2) has $y^2$ and equation (3) has $\sin y$, so both are nonlinear. The linear equations are 1 and 4.'
          - problem: 'The angle $\theta(t)$ of a pendulum of length $L$ satisfies $\theta'''' + \frac{g}{L}\sin\theta = 0$. Is this equation linear or nonlinear?'
            answer: 'nonlinear'
            answer_contract: {"kind":"label","options":[["linear","it is linear","is linear","a linear equation"],["nonlinear","non-linear","non linear","not linear","it is nonlinear","is not linear","a nonlinear equation"]]}
            solution_sketch: 'The unknown $\theta$ appears inside the sine, and $\sin\theta$ is not a first-degree term in $\theta$. So the equation is nonlinear. For small angles one replaces $\sin\theta$ by $\theta$, and that gives a linear equation.'
          - problem: 'Exactly one of these equations is not linear: (1) $y'''' + x^3 y = \sin x$, (2) $y'' + \cos(x)\,y = 0$, (3) $y'''' + y\,y'' = 1$, (4) $y'' + y = x^2$. Which one?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Equations (1), (2) and (4) have $y$ and its derivatives to the first power with coefficients in $x$ alone. Equation (3) contains the product $y\,y''$ of the unknown and its derivative, so equation 3 is the nonlinear one.'
          - problem: 'Sam says that $y'' + \sin(x)\,y = 0$ is not linear because it contains a sine. Is the equation linear or nonlinear?'
            answer: 'linear'
            answer_contract: {"kind":"label","options":[["linear","it is linear","is linear","a linear equation"],["nonlinear","non-linear","non linear","not linear","it is nonlinear","is not linear","a nonlinear equation"]]}
            solution_sketch: 'The sine has $x$ as its argument, so $\sin x$ is only a coefficient that depends on $x$. The unknown $y$ and its derivative $y''$ both appear to the first power, so the equation is linear.'
          - problem: 'A population model is $\frac{dP}{dt} = rP - cP^n$, where $r$ and $c$ are positive constants and $n$ is a positive whole number. For which value of $n$ is the equation linear?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $n = 1$ the equation is $\frac{dP}{dt} = (r - c)P$, and $P$ appears only to the first power. For $n = 2$ or more, $P^n$ is a power of the unknown, so the equation is nonlinear. The equation is linear only for $n = 1$.'
          - problem: 'Which of the following equations are nonlinear? (1) $y'''' + \tan y = x$, (2) $y'''''' + x^2 y'' = 0$, (3) $y'' + \frac{1}{y} = 0$, (4) $y'''' + xy = \cos x$.'
            answer: '1, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Equation (1) has $\tan y$, a nonlinear function of $y$. Equation (3) has $\frac{1}{y}$, which is $y$ to the power $-1$. Equations (2) and (4) have $y$ and its derivatives to the first power with coefficients in $x$, so they are linear. The nonlinear equations are 1 and 3.'
          - problem: 'A body of mass $m$ falls with speed $v$, and $m\frac{dv}{dt} = mg - F$, where $F$ is the drag force. Which drag force gives a linear equation? (1) $F = 0.2v$, (2) $F = 0.2v^2$, (3) $F = 0.2\sqrt{v}$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation is linear in $v$ only if $F$ is a first-degree term in $v$. The drag $0.2v$ in choice 1 gives $m\frac{dv}{dt} = mg - 0.2v$, which is linear. The terms $v^2$ and $\sqrt{v}$ are not first degree, so choices 2 and 3 give nonlinear equations.'
        constraints: "nonlinearity caused by powers of y or y', products y y', or functions like sin y, e^y; include a linear equation with variable coefficients as a foil"
      - id: kp3
        name: Translating rate statements into ODEs
        key_prerequisites: []
        step_check:
          step: 'Since the substance decays, the rate is negative'
          question: 'Why is a minus sign written in front of $k\,m$ in the equation?'
          options:
            - 'Every rate of change is written with a minus sign in a model'
            - 'The constant $k$ must be negative for any radioactive substance'
            - 'The mass is measured downward, so its sign flips'
            - 'Decay means $m$ decreases, so $m''$ is negative while $k > 0$'
          answer: 'Decay means $m$ decreases, so $m''$ is negative while $k > 0$'
          why: 'The constant $k$ is positive by the statement of the model, so the minus sign carries the decrease. With $m'' = km$ the mass would grow instead.'
        exemplars:
          - problem: 'A population $p$ grows at a rate proportional to its size, with a positive constant $k$. Complete the differential equation $\frac{dp}{dt} = \square$.'
            answer: 'kp'
            answer_contract: {"kind":"function","vars":["k","p"]}
            solution_sketch: 'The rate of change of $p$ is proportional to $p$, so it equals a constant times $p$. Growth means $p$ increases, so with $k > 0$ the sign is plus and the equation is $\frac{dp}{dt} = kp$.'
          - problem: 'A radioactive sample of mass $m$ decays at a rate proportional to $m$, with a positive constant $k$. Sam writes $\frac{dm}{dt} = km$. What is the correct right-hand side of the equation?'
            answer: '-km'
            answer_contract: {"kind":"function","vars":["k","m"]}
            solution_sketch: 'The rate is proportional to $m$, so it has the form $km$ up to a sign. Decay means $m$ decreases, so $\frac{dm}{dt}$ is negative and the correct right-hand side is $-km$.'
          - problem: 'A cup at temperature $u$ cools in a room held at $20$ degrees. Its rate of change is proportional to the difference $u - 20$, with a positive constant $k$. Complete the differential equation $\frac{du}{dt} = \square$.'
            answer: '-k(u-20)'
            answer_contract: {"kind":"function","vars":["k","u"]}
            solution_sketch: 'The rate is proportional to $u - 20$, so it has the form $k(u - 20)$ up to a sign. While $u$ is above $20$, the cup cools and $u$ decreases, so the rate is negative and the equation is $\frac{du}{dt} = -k(u - 20)$.'
          - problem: 'A cold drink at temperature $u$ warms in a room held at $70$ degrees. Its rate of change is proportional to the difference $70 - u$, with a positive constant $k$. Complete the differential equation $\frac{du}{dt} = \square$.'
            answer: 'k(70-u)'
            answer_contract: {"kind":"function","vars":["k","u"]}
            solution_sketch: 'The rate is proportional to $70 - u$. While $u$ is below $70$, the drink warms and $u$ increases, so the rate is positive and the equation is $\frac{du}{dt} = k(70 - u)$.'
          - problem: 'A pollutant concentration $c$ decreases at a rate proportional to the square of $c$, with a positive constant $k$. Complete the differential equation $\frac{dc}{dt} = \square$.'
            answer: '-kc^2'
            answer_contract: {"kind":"function","vars":["k","c"]}
            solution_sketch: 'The rate is proportional to $c^2$, so it has the form $kc^2$ up to a sign. The concentration decreases, so the rate is negative and the equation is $\frac{dc}{dt} = -kc^2$.'
          - problem: 'A savings account with balance $B$ dollars earns interest continuously at $3\%$ per year of the balance. Complete the differential equation $\frac{dB}{dt} = \square$ with $t$ in years.'
            answer: '0.03B'
            answer_contract: {"kind":"function","vars":["B"]}
            solution_sketch: 'The balance grows by $3\%$ of $B$ each year, and $3\% = 0.03$. So the rate of change is $0.03B$, and the equation is $\frac{dB}{dt} = 0.03B$.'
          - problem: 'A culture holds $400$ cells, and at this moment it grows at $60$ cells per hour. Its growth rate is proportional to its size, $\frac{dp}{dt} = kp$. Find $k$.'
            answer: '3/20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put the numbers into the equation: $60 = k \cdot 400$. Divide by $400$ to get $k = 60/400 = 3/20$, which is $0.15$ per hour.'
          - problem: 'A cup of tea at $85$ °C stands in a $25$ °C room and obeys $\frac{dT}{dt} = -k(T - 25)$. At this moment its temperature falls at $3$ °C per minute. Find $k$.'
            answer: '1/20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put the numbers into the equation: $-3 = -k(85 - 25) = -60k$. Divide by $-60$ to get $k = 3/60 = 1/20$, which is $0.05$ per minute.'
          - problem: 'A population $p$ grows at a rate proportional to the square root of its size, with a positive constant $k$. Complete the differential equation $\frac{dp}{dt} = \square$.'
            answer: 'k sqrt(p)'
            answer_contract: {"kind":"function","vars":["k","p"]}
            solution_sketch: 'The rate is proportional to $\sqrt{p}$, so it has the form $k\sqrt{p}$ up to a sign. The population grows, so the rate is positive and the equation is $\frac{dp}{dt} = k\sqrt{p}$.'
        constraints: "proportionality statements with k > 0; always ask for the sign that matches the described behavior"
    diagnostic_exemplar:
      problem: 'A quantity $y$ decreases at a rate proportional to the square of $y$. Write the differential equation, and state its order and whether it is linear.'
      answer: '$y'' = -ky^2$; order $1$; nonlinear (the unknown appears squared).'
      answer_contract: {kind: none}
      solution_sketch: '"Rate of change" is $y''$, "proportional to $y^2$" gives $ky^2$, and "decreases" makes it negative. The highest derivative is the first, and $y^2$ is a nonlinear function of the unknown.'
    anki_seeds:
      - front: "The order of a differential equation is..."
        back: "the order of the highest derivative that appears."
        type: basic
      - front: "A differential equation is linear when..."
        back: "y and its derivatives appear only to the first power, with coefficients depending only on the independent variable."
        type: basic

  - id: ode-classification-verification
    name: Verifying Solutions of ODEs
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: ode-order-linearity
        weight: 0.6
        key: true
      - id: chain-rule
        weight: 0.5
        key: true
      - id: derivatives-exp-log
        weight: 0.4
        key: false
      - id: implicit-differentiation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Verifying a solution by substitution
        key_prerequisites: [chain-rule, derivatives-exp-log]
        step_check:
          step: 'Since the equation reduces to an identity'
          question: 'Why does the identity $0 = 0$ show that $y = e^{-2x}$ is a solution of $y'' + 2y = 0$?'
          options:
            - 'It shows the function equals zero at the chosen value of $x$ only'
            - 'Both sides agree for every $x$, so $y$ satisfies the equation'
            - 'An identity proves that $y$ is the only solution of the equation'
            - 'The zero means that the constant of integration is zero'
          answer: 'Both sides agree for every $x$, so $y$ satisfies the equation'
          why: 'A solution must satisfy the equation for all $x$ in its domain. After substitution the left side equals the right side for every $x$, and nothing is said about other solutions.'
        exemplars:
          - problem: 'Verify that $y = e^{2x}$ is a solution of $y'' - 2y = 0$, and find the common value of $y''$ and $2y$ at $x = 1$.'
            answer: '2e^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate: $y'' = 2e^{2x}$, and $2y = 2e^{2x}$. The two sides are equal for every $x$, so $y'' - 2y = 0$ holds. At $x = 1$ the common value is $2e^2$.'
          - problem: 'Verify that $y = x^3$ satisfies $xy'' = 3y$, and find the common value of $xy''$ and $3y$ at $x = 2$.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate: $y'' = 3x^2$, so $xy'' = 3x^3$, and $3y = 3x^3$. The two sides agree for every $x$. At $x = 2$ both equal $3 \cdot 8 = 24$.'
          - problem: 'Verify that $y = \sin(2x)$ is a solution of $y'''' + 4y = 0$. What is $y''''$?'
            answer: '-4sin(2x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Differentiate twice: $y'' = 2\cos(2x)$ and $y'''' = -4\sin(2x)$. Then $4y = 4\sin(2x)$, so $y'''' + 4y = 0$ holds for every $x$.'
          - problem: 'Is $y = x^3$ a solution of $xy'' = 2y$ for $x > 0$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","it is a solution","is a solution","yes it does","it does"],["no","no, it is not","it is not","not a solution","it is not a solution","no it does not","it does not"]]}
            solution_sketch: 'For $y = x^3$ we have $y'' = 3x^2$, so $xy'' = 3x^3$. But $2y = 2x^3$, and $3x^3 \ne 2x^3$ for $x \ne 0$. So $y = x^3$ is not a solution.'
          - problem: 'Newton''s law of cooling for a cup of coffee in a $20$ °C room is $T'' = -0.1(T - 20)$, with $t$ in minutes. Verify that $T(t) = 20 + 60e^{-0.1t}$ satisfies it, and find $T''(t)$.'
            answer: '-6e^(-0.1t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Differentiate: $T''(t) = 60 \cdot (-0.1)e^{-0.1t} = -6e^{-0.1t}$. On the other side, $-0.1(T - 20) = -0.1 \cdot 60e^{-0.1t} = -6e^{-0.1t}$. Both sides agree, so $T(t)$ is a solution.'
          - problem: 'Which of the functions (1) $y = e^{2x}$, (2) $y = e^{-2x}$, (3) $y = x^2$ is a solution of $y'' + 2y = 0$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $y = e^{-2x}$ we get $y'' = -2e^{-2x}$, so $y'' + 2y = 0$. For $y = e^{2x}$ we get $y'' + 2y = 4e^{2x} \ne 0$, and for $y = x^2$ we get $2x + 2x^2 \ne 0$. Only choice 2 works.'
          - problem: 'A mass on a spring has position $x(t) = 2\cos 3t + \sin 3t$, with $t$ in seconds. Verify that it satisfies $x'''' + 9x = 0$ by finding $x''''(t)$.'
            answer: '-18cos(3t) - 9sin(3t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Differentiate twice: $x'' = -6\sin 3t + 3\cos 3t$ and $x'''' = -18\cos 3t - 9\sin 3t$. Then $9x = 18\cos 3t + 9\sin 3t$, so $x'''' + 9x = 0$ for every $t$.'
          - problem: 'Sam checks $y = e^{3x}$ in $y'' - 3y = 0$. He writes $y'' = e^{3x}$, gets $y'' - 3y = -2e^{3x}$, and says $y$ is not a solution. What is the correct value of $y'' - 3y$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The chain rule gives $y'' = 3e^{3x}$, not $e^{3x}$. Then $y'' - 3y = 3e^{3x} - 3e^{3x} = 0$, so $y = e^{3x}$ is a solution.'
        constraints: "candidate solutions built from e^{kx}, sin/cos of kx, and polynomials; verification always closes to an identity"
      - id: kp2
        name: Verifying implicit solutions
        key_prerequisites: [implicit-differentiation]
        try_first:
          problem: 'A circle $x^2 + y^2 = 100$ passes through the point $(6, 8)$. Without solving for $y$, what is the slope of the circle at that point?'
          answer_contract: {"kind":"exact"}
          answer: '-3/4'
          reveal: 'Differentiating both sides with respect to $x$ gives $2x + 2y\,y'' = 0$, so $y'' = -x/y = -6/8 = -3/4$. One implicit differentiation gives the slope without solving for $y$.'
        step_check:
          step: 'Apply the chain rule to the term $2y^2$'
          question: 'Why is the chain rule needed for the term $2y^2$ when differentiating with respect to $x$?'
          options:
            - 'Because $y$ depends on $x$, so $(y^2)'' = 2y\,y''$'
            - 'Because $y^2$ is treated as a constant when $x$ varies'
            - 'Because every square must be differentiated twice first'
            - 'Because the number 2 in front of $y^2$ also depends on $x$'
          answer: 'Because $y$ depends on $x$, so $(y^2)'' = 2y\,y''$'
          why: 'The relation defines $y$ as a function of $x$, so $y^2$ is a function of a function. The chain rule gives $2y\,y''$, and the extra factor $y''$ is what lets us solve for the slope.'
        exemplars:
          - problem: 'The relation $x^2 + y^2 = 25$ defines $y$ as a function of $x$. Find $y''$.'
            answer: '-x/y'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate both sides with respect to $x$: $2x + 2y\,y'' = 0$. Solve for $y''$ to get $y'' = -x/y$.'
          - problem: 'Do the functions defined implicitly by $x^2 + 2y^2 = 8$ satisfy $y'' = -\dfrac{x}{2y}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","yes, it does","it does","they do","yes they do"],["no","no, it does not","it does not","they do not","no they do not"]]}
            solution_sketch: 'Differentiate $x^2 + 2y^2 = 8$ implicitly: $2x + 4y\,y'' = 0$, so $y'' = -x/(2y)$. This is the given equation, so the relation defines solutions of it.'
          - problem: 'The relation $x^3 + y^3 = 64$ defines $y$ as a function of $x$. Find $y''$.'
            answer: '-x^2/y^2'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate both sides with respect to $x$: $3x^2 + 3y^2 y'' = 0$. Solve for $y''$ to get $y'' = -x^2/y^2$.'
          - problem: 'A contour line on a map of a hill is the curve $x^2 + 4y^2 = 20$. What is the slope of the contour at the point $(2, 2)$?'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate implicitly: $2x + 8y\,y'' = 0$, so $y'' = -x/(4y)$. At $(2, 2)$ the slope is $-2/8 = -1/4$.'
          - problem: 'A rectangle keeps the fixed area $xy = 12$, where $x$ and $y$ are its side lengths in metres. When $x = 3$, by how much does $y$ change for each metre that $x$ increases?'
            answer: '-4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'When $x = 3$ we get $y = 4$. Differentiate $xy = 12$ implicitly: $y + x\,y'' = 0$, so $y'' = -y/x = -4/3$. So $y$ falls by $4/3$ metres for each metre of increase in $x$.'
          - problem: 'Does the relation $x^2 + y^2 = 9$ define solutions of $y\,y'' = x$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, it does","it does","they do","yes they do"],["no","no, it does not","it does not","they do not","no they do not"]]}
            solution_sketch: 'Differentiating gives $2x + 2y\,y'' = 0$, so $y\,y'' = -x$. The given equation has $+x$ on the right, so the relation does not define solutions of it.'
          - problem: 'The relation $xy + x^2 = 1$ defines $y$ as a function of $x$. Find $y''$.'
            answer: '-(y+2x)/x'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate both sides with the product rule: $y + x\,y'' + 2x = 0$. Solve for $y''$ to get $y'' = -(y + 2x)/x$.'
          - problem: 'The relation $y^3 + xy = 4$ defines $y$ as a function of $x$. Find $y''$.'
            answer: '-y/(3y^2+x)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'Differentiate both sides: $3y^2 y'' + y + x\,y'' = 0$. Collect the terms with $y''$: $y''(3y^2 + x) = -y$, so $y'' = -y/(3y^2 + x)$.'
        constraints: "implicit relations polynomial in x and y; one implicit differentiation closes the verification"
      - id: kp3
        name: Fitting constants and parameters
        key_prerequisites: [derivatives-exp-log]
        step_check:
          step: 'Substitute the initial condition $x = 0$, $y = 7$ into the general solution'
          question: 'Why can the values $x = 0$ and $y = 7$ be put into the general solution to find $C$?'
          options:
            - 'The differential equation itself already states that $y(0) = 7$'
            - 'The general solution is valid only at the single point $x = 0$'
            - 'The constant $C$ is always equal to the given value of $y$'
            - 'The curve must pass through $(0, 7)$, so the values fit it'
          answer: 'The curve must pass through $(0, 7)$, so the values fit it'
          why: 'The initial condition picks one curve out of the family. That curve contains the point $(0, 7)$, so its coordinates must satisfy the general solution, and this fixes $C$.'
        exemplars:
          - problem: 'The general solution of $y'' + 2y = 0$ is $y = Ce^{-2x}$. Find $C$ so that $y(0) = 5$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $x = 0$ and $y = 5$ into $y = Ce^{-2x}$. This gives $5 = Ce^{0} = C$, so $C = 5$.'
          - problem: 'The general solution of $y'' = 3y$ is $y = Ce^{3x}$. Find the solution whose graph passes through the point $(1, 2)$.'
            answer: '2e^(3x-3)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Put $x = 1$ and $y = 2$ into $y = Ce^{3x}$. This gives $2 = Ce^{3}$, so $C = 2e^{-3}$. The solution is $y = 2e^{-3}e^{3x} = 2e^{3x-3}$.'
          - problem: 'Find all values of $r$ for which $y = e^{rx}$ is a solution of $y'''' - y'' - 6y = 0$.'
            answer: '-2, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $y = e^{rx}$ we get $y'' = re^{rx}$ and $y'''' = r^2 e^{rx}$. Substitute and divide by $e^{rx}$: $r^2 - r - 6 = 0$, so $(r - 3)(r + 2) = 0$ and $r = -2$ or $r = 3$.'
          - problem: 'Find the constant $a$ so that $y = e^{2x}$ is a solution of $y'''' + a\,y'' - 6y = 0$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $y = e^{2x}$ we get $y'' = 2e^{2x}$ and $y'''' = 4e^{2x}$. Substitute and divide by $e^{2x}$: $4 + 2a - 6 = 0$. So $2a = 2$ and $a = 1$.'
          - problem: 'The mass of a radioactive sample satisfies $m'' = -0.05m$, with general solution $m = Ce^{-0.05t}$. Here $t$ is in years and $m$ is in grams. The sample has $40$ g at $t = 0$. Find $m(t)$.'
            answer: '40e^(-0.05t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Put $t = 0$ and $m = 40$ into $m = Ce^{-0.05t}$. This gives $40 = Ce^0 = C$. So $m(t) = 40e^{-0.05t}$.'
          - problem: 'Find the constant $k$ so that $y = e^{-x}$ is a solution of $y'''' + k\,y'' + 6y = 0$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $y = e^{-x}$ we get $y'' = -e^{-x}$ and $y'''' = e^{-x}$. Substitute and divide by $e^{-x}$: $1 - k + 6 = 0$. So $k = 7$.'
          - problem: 'The charge $q$ on a capacitor satisfies $q'' = -kq$, with $t$ in seconds. At a moment when $q = 12$ microcoulombs, the charge is falling at $3$ microcoulombs per second. Find $k$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At that moment $q'' = -3$ and $q = 12$, so $-3 = -k \cdot 12$. Divide by $-12$ to get $k = 3/12 = 1/4$ per second.'
          - problem: 'A population satisfies $P'' = kP$, with general solution $P = P_0 e^{kt}$. It doubles in $10$ hours. Find $k$ to three decimal places.'
            answer: '0.069'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'Doubling in $10$ hours gives $2P_0 = P_0 e^{10k}$, so $e^{10k} = 2$. Then $k = \ln 2 / 10 \approx 0.069$ per hour.'
        constraints: "one unknown constant or exponent parameter; the resulting algebraic equation is linear or a factorable quadratic"
    diagnostic_exemplar:
      problem: 'Show that $y^2 = x^2 + C$ defines a solution of $y\,y'' = x$, and find the value of $C$ for which the solution passes through $(1, 3)$.'
      answer: 'Differentiating implicitly gives $2y\,y'' = 2x$, i.e. $y\,y'' = x$; and $y(1) = 3$ forces $9 = 1 + C$, so $C = 8$.'
      answer_contract: {kind: none}
      solution_sketch: 'Implicit differentiation verifies the family; substituting the point fits the constant.'
    anki_seeds:
      - front: "To verify that y = f(x) solves an ODE, you..."
        back: "compute the needed derivatives, substitute, and check the equation reduces to an identity."
        type: basic
      - front: "To verify an implicit solution F(x, y) = C of an ODE, you..."
        back: "differentiate the relation implicitly and compare with the ODE."
        type: basic

  - id: existence-uniqueness-first-order
    name: Existence and Uniqueness
    core: false                # reassurance theorem; its statement is never invoked later
    difficulty: 0.63
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: ode-classification-verification
        weight: 0.5
        key: true
      - id: partial-derivatives
        weight: 0.4
        key: false
      - id: continuity
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Applying the existence-uniqueness theorem
        key_prerequisites: [continuity, partial-derivatives]
        step_check:
          step: 'Since $(1, 0)$ is in the domain where $f$ and $f_y$ are continuous'
          question: 'Why does continuity of both $f$ and $f_y$ near $(1, 0)$ give a unique solution?'
          options:
            - 'Continuity of $f$ alone already gives exactly one solution'
            - 'It guarantees that the solution exists for every value of $x$'
            - 'Both are continuous, so exactly one local solution exists'
            - 'It shows that the solution is given by an elementary function'
          answer: 'Both are continuous, so exactly one local solution exists'
          why: 'The theorem has two hypotheses, $f$ and $f_y$ continuous on a rectangle around the initial point. Then exactly one solution exists on some interval around $x = 1$, not necessarily for all $x$.'
        exemplars:
          - problem: 'Does the existence and uniqueness theorem guarantee that the initial value problem $y'' = x - y$, $y(0) = 1$ has exactly one solution near $x = 0$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","yes, it does","it does","yes it does","unique","it does guarantee","guaranteed","there is a unique solution"],["no","no, it does not","it does not","no it does not","not guaranteed","it does not guarantee","does not guarantee","no guarantee"]]}
            solution_sketch: 'Here $f(x, y) = x - y$ and $f_y = -1$. Both are continuous everywhere, in particular near $(0, 1)$, so the theorem guarantees exactly one solution near $x = 0$.'
          - problem: 'For $y'' = \sqrt{y}$ with $y(1) = 4$, find $f_y$ at the initial point.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f(x, y) = \sqrt{y}$, so $f_y = \frac{1}{2\sqrt{y}}$. At $y = 4$ this is $\frac{1}{2 \cdot 2} = \frac14$.'
          - problem: 'For $y'' = \dfrac{y}{x}$ with $y(2) = 1$, find $\dfrac{\partial f}{\partial y}$ at the initial point.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f(x, y) = y/x$, so $f_y = 1/x$. At $x = 2$ this is $1/2$.'
          - problem: 'Water drains from a tank so that the depth $h$ satisfies $\frac{dh}{dt} = -k\sqrt{h}$, where $k > 0$, with $h(0) = h_0$. For which initial depth $h_0$ does the theorem fail to guarantee a unique solution?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f(t, h) = -k\sqrt{h}$ and $f_h = -\frac{k}{2\sqrt{h}}$. This is continuous for $h > 0$ but not defined at $h = 0$. So uniqueness is guaranteed except for the starting depth $h_0 = 0$.'
          - problem: 'For $y'' = x^2 + y^2$ with $y(1) = 2$, find $f_y$ at the initial point.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f(x, y) = x^2 + y^2$, so $f_y = 2y$. At $y = 2$ this is $4$.'
          - problem: 'A population satisfies $\frac{dP}{dt} = 0.02P\left(1 - \frac{P}{500}\right)$ with $P(0) = 100$. Find $f_P$ at the initial point.'
            answer: '0.012'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expand: $f(t, P) = 0.02P - 0.00004P^2$, so $f_P = 0.02 - 0.00008P$. At $P = 100$ this is $0.02 - 0.008 = 0.012$.'
          - problem: 'Does the existence and uniqueness theorem guarantee that $y'' = \dfrac{y}{x - 1}$ with $y(1) = 2$ has exactly one solution near $x = 1$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, it does","it does","yes it does","unique","it does guarantee","guaranteed","there is a unique solution"],["no","no, it does not","it does not","no it does not","not guaranteed","it does not guarantee","does not guarantee","no guarantee"]]}
            solution_sketch: 'Here $f(x, y) = y/(x - 1)$ is not defined at $x = 1$, so $f$ is not continuous near the initial point $(1, 2)$. The hypothesis fails there, so the theorem gives no guarantee.'
          - problem: 'For $y'' = \cos x + y^3$ with $y(0) = 2$, find $f_y$ at the initial point.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f(x, y) = \cos x + y^3$, so $f_y = 3y^2$. At $y = 2$ this is $3 \cdot 4 = 12$.'
          - problem: 'For $y'' = \dfrac{x}{y - 2}$ with $y(0) = y_0$, for which value of $y_0$ does the theorem fail to guarantee a unique solution?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f(x, y) = x/(y - 2)$ and $f_y = -x/(y - 2)^2$. Both are undefined at $y = 2$ and continuous elsewhere near the axis. So the theorem fails to guarantee uniqueness only for $y_0 = 2$.'
          - problem: 'For $y'' = \sqrt{y}$ with $y(0) = c$, for which values of $c$ does the existence and uniqueness theorem guarantee a unique solution near $x = 0$?'
            answer: 'c > 0'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Here $f(x, y) = \sqrt{y}$ and $f_y = \frac{1}{2\sqrt{y}}$. Both are continuous near $(0, c)$ only when $c > 0$. For $c < 0$ the root is not defined, and for $c = 0$ the derivative $f_y$ is not defined, so the guarantee holds for $c > 0$.'
        constraints: 'check continuity of f and f_y on a rectangle around the initial point; initial data away from trouble spots, except in items that ask where the guarantee fails'
      - id: kp2
        name: Where the guarantee fails
        key_prerequisites: [ode-classification-verification]
        try_first:
          problem: 'The function $y = x^3$ solves $y'' = 3y^{2/3}$ for $x \ge 0$, and $y(0) = 0$. What is the common value of $y''$ and $3y^{2/3}$ at $x = 2$?'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'Both sides equal $3x^2 = 12$ at $x = 2$. The constant function $y = 0$ also solves the same problem, so one initial condition has two solutions.'
        step_check:
          step: 'which blows up at $y = 0$'
          question: 'Why does it matter that $f_y$ blows up at $y = 0$ when the initial value is $y(0) = 0$?'
          options:
            - 'Then $f$ itself is undefined, so no solution exists at all'
            - 'The theorem needs $f_y$ continuous near $(0, 0)$, which fails'
            - 'A blow-up of $f_y$ always forces the solution to blow up'
            - 'The theorem works only for initial values that differ from zero'
          answer: 'The theorem needs $f_y$ continuous near $(0, 0)$, which fails'
          why: 'The uniqueness hypothesis fails at $(0, 0)$, so the theorem promises nothing about uniqueness. The two solutions $y = 0$ and $y = x^2$ then show that uniqueness really fails.'
        exemplars:
          - problem: 'For $y'' = 2\sqrt{y}$ with $y(0) = 0$, the constant function $y = 0$ is a solution. Find a second solution for $x \ge 0$.'
            answer: 'x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Try $y = x^2$. Then $y'' = 2x$ and $2\sqrt{y} = 2\sqrt{x^2} = 2x$ for $x \ge 0$, and $y(0) = 0$. So $y = x^2$ is a second solution, and uniqueness fails.'
          - problem: 'Does the existence and uniqueness theorem guarantee that $y'' = 3y^{2/3}$ with $y(0) = 0$ has exactly one solution near $x = 0$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, it does","it does","yes it does","unique","it does guarantee","guaranteed","there is a unique solution"],["no","no, it does not","it does not","no it does not","not guaranteed","it does not guarantee","does not guarantee","no guarantee"]]}
            solution_sketch: 'Here $f_y = 2y^{-1/3}$, which is not defined at $y = 0$. So $f_y$ is not continuous near the initial point $(0, 0)$, the hypothesis fails, and no uniqueness is guaranteed.'
          - problem: 'Solve $y'' = 2y^2$ with $y(0) = 2$. On what interval containing $x = 0$ does the solution exist?'
            answer: 'x < 1/4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Separate variables: $\frac{dy}{y^2} = 2\,dx$, so $-\frac1y = 2x + C$. With $y(0) = 2$ we get $C = -\frac12$, so $y = \frac{1}{1/2 - 2x}$. The solution blows up at $x = 1/4$, so it exists for $x < 1/4$.'
          - problem: 'For $y'' = y^{1/3}$ with $y(0) = 0$, the constant function $y = 0$ is one solution. Find a solution that is not constant, for $x \ge 0$.'
            answer: '(2x/3)^(3/2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate variables: $y^{-1/3}\,dy = dx$, so $\frac32 y^{2/3} = x$ and $y = (2x/3)^{3/2}$. Check: $y'' = (2x/3)^{1/2} = y^{1/3}$, and $y(0) = 0$.'
          - problem: 'Solve $y'' = y^3$ with $y(0) = 1$. At what value of $x$ does the solution blow up?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Separate variables: $\frac{dy}{y^3} = dx$, so $-\frac{1}{2y^2} = x + C$. With $y(0) = 1$ we get $C = -\frac12$, so $y^2 = \frac{1}{1 - 2x}$. The solution blows up at $x = 1/2$.'
          - problem: 'A tank drains so that its depth $h$ in metres satisfies $\frac{dh}{dt} = -2\sqrt{h}$, with $t$ in hours and $h = 9$ at $t = 0$. How long does the tank take to empty?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'Separate variables: $h^{-1/2}\,dh = -2\,dt$, so $2\sqrt{h} = -2t + C$. With $h(0) = 9$ we get $C = 6$, so $\sqrt{h} = 3 - t$. The depth is $0$ at $t = 3$ hours.'
          - problem: 'A population $P$ in thousands satisfies $P'' = 0.01P^2$, with $t$ in years and $P(0) = 2$. After how many years does the model predict an infinite population?'
            answer: '50'
            answer_contract: {"kind":"unit","quantity":"time","unit":"year","allow_omitted":true}
            solution_sketch: 'Separate variables: $\frac{dP}{P^2} = 0.01\,dt$, so $-\frac1P = 0.01t + C$. With $P(0) = 2$ we get $\frac1P = \frac12 - 0.01t$. This is $0$ at $t = 50$ years, where $P$ blows up.'
          - problem: 'Does the existence and uniqueness theorem guarantee that $y'' = 2\sqrt{y}$ with $y(0) = 1$ has exactly one solution near $x = 0$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","yes, it does","it does","yes it does","unique","it does guarantee","guaranteed","there is a unique solution"],["no","no, it does not","it does not","no it does not","not guaranteed","it does not guarantee","does not guarantee","no guarantee"]]}
            solution_sketch: 'Here $f_y = 1/\sqrt{y}$, which is continuous near $y = 1$, and $f$ is continuous there too. So the hypotheses hold at $(0, 1)$ and the solution is unique. Only the starting value $y = 0$ is a problem for this equation.'
          - problem: 'Sam says that $y'' = y^2$ with $y(0) = 1$ has a solution for all $x$, because $y^2$ is continuous everywhere. What is the value of the actual solution at $x = \frac12$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Separate variables: $-\frac1y = x + C$, and $y(0) = 1$ gives $C = -1$, so $y = \frac{1}{1 - x}$. At $x = \frac12$ this is $2$. The solution blows up at $x = 1$, so it does not exist for all $x$.'
        constraints: "failure modes: f_y discontinuous at the initial y (non-uniqueness) or blow-up in finite time (local existence); solutions verifiable by substitution"
      - id: kp3
        name: Intervals of validity for linear equations
        key_prerequisites: [continuity]
        step_check:
          step: 'Rewrite the equation in standard form'
          question: 'Why must the equation be rewritten in standard form before the discontinuities are found?'
          options:
            - 'Dividing by $x - 2$ removes the discontinuity at $x = 2$'
            - 'Standard form is needed so that the equation can be integrated'
            - 'The coefficient of $y''$ must be 1 for the solution to be unique'
            - 'The theorem is stated for $y'' + P(x)y = Q(x)$ in this form'
          answer: 'The theorem is stated for $y'' + P(x)y = Q(x)$ in this form'
          why: 'The linear existence theorem applies to $y'' + P(x)y = Q(x)$. Dividing by the coefficient of $y''$ exposes the points where $P$ or $Q$ is discontinuous, here $x = 2$ and $x = 1$.'
        exemplars:
          - problem: 'For $(x - 3)y'' + y = \ln x$ with $y(1) = 2$, find the largest interval on which a unique solution is guaranteed.'
            answer: '0 < x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'In standard form $y'' + \frac{1}{x - 3}y = \frac{\ln x}{x - 3}$. The coefficients are discontinuous at $x = 3$, and $\ln x$ requires $x > 0$. The initial point $x = 1$ lies in $0 < x < 3$.'
          - problem: 'For $(x - 4)y'' + y = \dfrac{1}{x}$ with $y(2) = 1$, find the largest interval on which a unique solution is guaranteed.'
            answer: '0 < x < 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'In standard form $y'' + \frac{1}{x - 4}y = \frac{1}{x(x - 4)}$. The coefficients are discontinuous at $x = 0$ and $x = 4$. The initial point $x = 2$ lies in $0 < x < 4$.'
          - problem: 'For $(x - 2)y'' + y = \sqrt{x}$ with $y(3) = 1$, find the largest interval on which a unique solution is guaranteed.'
            answer: 'x > 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'In standard form $y'' + \frac{1}{x - 2}y = \frac{\sqrt{x}}{x - 2}$. The coefficients are discontinuous at $x = 2$, and $\sqrt{x}$ is fine for $x > 2$. The initial point $x = 3$ lies in $x > 2$.'
          - problem: 'For $(x^2 - 9)y'' + y = \ln(x + 1)$ with $y(0) = 2$, find the largest interval on which a unique solution is guaranteed.'
            answer: '-1 < x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The coefficient of $y''$ vanishes at $x = \pm 3$, and $\ln(x + 1)$ requires $x > -1$. The initial point $x = 0$ lies between the trouble points, in $-1 < x < 3$.'
          - problem: 'For $(x^2 - 1)y'' + y = e^x$ with $y(2) = 0$, find the largest interval on which a unique solution is guaranteed.'
            answer: 'x > 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The coefficient of $y''$ vanishes at $x = \pm 1$, and $e^x$ is continuous everywhere. The initial point $x = 2$ lies to the right of both, in $x > 1$.'
          - problem: 'For $(x - 3)y'' + y = \ln x$ with $y(5) = 1$, find the largest interval on which a unique solution is guaranteed.'
            answer: 'x > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The trouble points are $x = 3$ and, for $\ln x$, $x \le 0$. The initial point $x = 5$ lies to the right of $x = 3$, so the interval is $x > 3$.'
          - problem: 'A drug concentration $C$ in the blood satisfies $(8 - t)C'' + C = 2$ with $C(0) = 1$, where $t$ is in hours. Up to what time is a unique solution guaranteed?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'In standard form $C'' + \frac{1}{8 - t}C = \frac{2}{8 - t}$. The coefficients are discontinuous at $t = 8$. The initial time $t = 0$ lies in $t < 8$, so a unique solution is guaranteed up to $t = 8$ hours.'
          - problem: 'A tank model is $(t^2 - 25)Q'' + Q = 10$ with $Q(0) = 3$, where $t$ is in hours. For how many hours after $t = 0$ is a unique solution guaranteed?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'The coefficient of $Q''$ vanishes at $t = \pm 5$, so the coefficients are discontinuous there. The initial time $t = 0$ lies in $-5 < t < 5$, so the guarantee lasts for $5$ hours after $t = 0$.'
        constraints: "linear equations with 1-2 discontinuity points; the answer is the largest open interval containing x_0 avoiding all of them"
    diagnostic_exemplar:
      problem: "For $(x^2 - 4)y' + y = x$ with $y(0) = 1$, state the largest interval on which a unique solution is guaranteed."
      answer: "$(-2, 2)$"
      solution_sketch: "The standard-form coefficients are discontinuous at $x = \\pm 2$; the initial point $x_0 = 0$ lies between them."
    anki_seeds:
      - front: "Existence-uniqueness theorem for y' = f(x, y), y(x0) = y0?"
        back: "If f and ∂f/∂y are continuous on a rectangle around (x0, y0), a unique solution exists on some interval around x0."
        type: basic
      - front: "For a linear equation y' + P(x)y = Q(x), a unique solution exists on..."
        back: "the largest open interval containing x0 where P and Q are both continuous."
        type: basic

  - id: slope-fields
    name: Slope Fields
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: ode-classification-verification
        weight: 0.5
        key: true
      - id: slope
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Reading slopes from the equation
        key_prerequisites: [slope]
        step_check:
          step: 'Substitute the given point $(3, 4)$ into the equation'
          question: 'Why does substituting the point $(3, 4)$ into $y'' = x^2 - y$ give the slope there?'
          options:
            - 'The equation gives the height of the curve, and the slope is found later'
            - 'The equation says the slope at $(x, y)$ equals $x^2 - y$'
            - 'The point must first be moved to the origin to read the slope'
            - 'Only $x$ sets the slope, and $y$ is just the height of the curve'
          answer: 'The equation says the slope at $(x, y)$ equals $x^2 - y$'
          why: 'The right side $f(x, y)$ is the slope of the solution curve at every point $(x, y)$. So putting in $x = 3$ and $y = 4$ gives $9 - 4 = 5$ without solving the equation.'
        exemplars:
          - problem: 'For $y'' = x - y$, what is the slope of the solution curve through $(2, 1)$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at $(x, y)$ is $f(x, y) = x - y$. At $(2, 1)$ this is $2 - 1 = 1$.'
          - problem: 'For $y'' = xy$, what is the slope of the solution curve through $(2, 3)$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at $(x, y)$ is $xy$. At $(2, 3)$ this is $2 \cdot 3 = 6$.'
          - problem: 'For $y'' = x^2 + y$, what is the slope of the solution curve through $(1, -2)$?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at $(x, y)$ is $x^2 + y$. At $(1, -2)$ this is $1 + (-2) = -1$.'
          - problem: 'A deer population $P$ in a reserve satisfies $\frac{dP}{dt} = 0.1P\left(1 - \frac{P}{200}\right)$, with $t$ in years. How fast is the population growing, in deer per year, when $P = 50$?'
            answer: '3.75'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate of growth is the slope at $P = 50$. It is $0.1 \cdot 50 \cdot \left(1 - \frac{50}{200}\right) = 5 \cdot 0.75 = 3.75$ deer per year.'
          - problem: 'For $y'' = \dfrac{x}{y}$, what is the slope of the solution curve through $(6, 3)$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at $(x, y)$ is $x/y$. At $(6, 3)$ this is $6/3 = 2$.'
          - problem: 'A cup of coffee at $80$ °C stands in a $20$ °C room, and its temperature $T$ satisfies $\frac{dT}{dt} = -0.2(T - 20)$, with $t$ in minutes. At what rate is the temperature changing, in °C per minute, at this moment?'
            answer: '-12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is the slope at $T = 80$. It is $-0.2(80 - 20) = -0.2 \cdot 60 = -12$, so the coffee cools by $12$ °C per minute.'
          - problem: 'For $y'' = xy - 1$, what is the slope at $(2, 3)$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at $(x, y)$ is $xy - 1$. At $(2, 3)$ this is $6 - 1 = 5$.'
          - problem: 'For $y'' = x^2 - y$, what is the slope of the solution curve through $(-2, -3)$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at $(x, y)$ is $x^2 - y$. At $(-2, -3)$ this is $4 - (-3) = 7$.'
        constraints: "f(x,y) polynomial with small integer coefficients; pure evaluation"
      - id: kp2
        name: Isoclines and zero-slope loci
        key_prerequisites: [slope]
        try_first:
          problem: 'For $y'' = y - 3$, at what value of $y$ are all the slope marks horizontal?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'A mark is horizontal when its slope is zero, so we set $y - 3 = 0$ and get $y = 3$. Setting the right side equal to a chosen slope gives a curve along which all marks look alike.'
        step_check:
          step: 'To find where the slope field is horizontal, set $x + y = 0$'
          question: 'Why do we set $x + y = 0$ to find where the slope marks of $y'' = x + y$ are horizontal?'
          options:
            - 'A horizontal mark has slope zero, and the slope is $x + y$'
            - 'Horizontal marks occur where $y = 0$, whatever $x$ is'
            - 'Zero is the value of the solution curve at the origin'
            - 'Horizontal marks occur only where the equation has no solution'
          answer: 'A horizontal mark has slope zero, and the slope is $x + y$'
          why: 'A horizontal mark has slope $0$, and the slope at $(x, y)$ is $f(x, y) = x + y$. So the marks are horizontal on the line $x + y = 0$, that is $y = -x$.'
        exemplars:
          - problem: 'For $y'' = x^2 + y$, find the equation of the horizontal isocline, the curve along which the slope marks are horizontal.'
            answer: '-x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The marks are horizontal where the slope is zero, so $x^2 + y = 0$. Solving for $y$ gives the parabola $y = -x^2$.'
          - problem: 'For $y'' = x - y$, find the isocline along which every slope mark has slope $2$.'
            answer: 'x - 2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Set the slope equal to $2$: $x - y = 2$. Solving for $y$ gives the line $y = x - 2$.'
          - problem: 'For $y'' = y - 2x$, find the curve along which the slope marks are horizontal.'
            answer: '2x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The marks are horizontal where $y - 2x = 0$. Solving for $y$ gives the line $y = 2x$.'
          - problem: 'For $y'' = x + y$, the slope marks are horizontal along a line through the origin. What is the slope of this line?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The marks are horizontal where $x + y = 0$, that is $y = -x$. This line has slope $-1$.'
          - problem: 'For $y'' = y^2 - 4$, at which values of $y$ are the slope marks horizontal?'
            answer: '-2, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The marks are horizontal where $y^2 - 4 = 0$. Then $(y - 2)(y + 2) = 0$, so $y = -2$ or $y = 2$.'
          - problem: 'For $y'' = x^2 - y$, find the isocline along which every slope mark has slope $1$.'
            answer: 'x^2 - 1'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Set the slope equal to $1$: $x^2 - y = 1$. Solving for $y$ gives the parabola $y = x^2 - 1$.'
          - problem: 'A population $P$ satisfies $\frac{dP}{dt} = 0.5P\left(1 - \frac{P}{80}\right)$. At which population values is the slope mark horizontal, so that the population does not change?'
            answer: '0, 80'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is zero when $0.5P\left(1 - \frac{P}{80}\right) = 0$. This happens when $P = 0$ or when $1 - \frac{P}{80} = 0$, that is $P = 80$.'
          - problem: 'A fish population $P$ in thousands grows by $0.3P$ per year and is harvested at $12$ thousand per year, so $\frac{dP}{dt} = 0.3P - 12$. At what population is the slope mark horizontal?'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is zero when $0.3P - 12 = 0$. Then $0.3P = 12$ and $P = 12/0.3 = 40$ thousand.'
        constraints: "isoclines f(x,y) = c are lines or parabolas; ask for horizontal (c = 0) and one nonzero c"
      - id: kp3
        name: Qualitative behavior from the field
        key_prerequisites: [ode-classification-verification]
        step_check:
          step: 'can be positive, negative, or zero depending on the values of $x$ and $y$'
          question: 'Why can solution curves of $y'' = x^2 - y$ rise in one place and fall in another?'
          options:
            - 'Every solution curve has a single turning point in the middle'
            - 'The field is symmetric, so half of the marks must point up'
            - 'The sign of $x^2 - y$ changes from point to point'
            - 'Solution curves rise where $x$ is positive and fall where $x$ is negative'
          answer: 'The sign of $x^2 - y$ changes from point to point'
          why: 'A curve rises where its slope $x^2 - y$ is positive and falls where it is negative. The sign depends on both $x$ and $y$, not on $x$ alone.'
        exemplars:
          - problem: 'For $y'' = 1 + y^2$, every solution curve is increasing. What is the smallest slope that any mark of the field can have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $y^2 \ge 0$, we have $1 + y^2 \ge 1$. The value $1$ is reached when $y = 0$, so the smallest slope is $1$.'
          - problem: 'For which values of $y$ are the solution curves of $y'' = y$ increasing?'
            answer: 'y > 0'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'A solution curve is increasing where its slope is positive. The slope is $y$, so the curves are increasing where $y > 0$.'
          - problem: 'For which values of $x$ are the solution curves of $y'' = x^2 - 1$ decreasing?'
            answer: '-1 < x < 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'A solution curve is decreasing where the slope is negative. We need $x^2 - 1 < 0$, which holds for $-1 < x < 1$.'
          - problem: 'Find the point on the vertical line $x = 1$ at which the slope mark of $y'' = x + y$ is horizontal.'
            answer: '(1, -1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'On the line $x = 1$ the slope is $1 + y$. It is zero when $y = -1$, so the point is $(1, -1)$.'
          - problem: 'A skydiver''s speed $v$ in metres per second satisfies $\frac{dv}{dt} = 9.8 - 0.2v$. For which speeds is the skydiver speeding up?'
            answer: 'v < 49'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The speed increases where $\frac{dv}{dt} > 0$. We need $9.8 - 0.2v > 0$, so $v < 9.8/0.2 = 49$.'
          - problem: 'A cold drink at temperature $T$ in °C stands in a $25$ °C room and satisfies $\frac{dT}{dt} = 0.1(25 - T)$. For which temperatures is the drink warming up?'
            answer: 'T < 25'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The drink warms where $\frac{dT}{dt} > 0$. We need $0.1(25 - T) > 0$, which holds for $T < 25$.'
          - problem: 'Along any horizontal line $y = c$, are the slope marks of $y'' = y^2 - 4$ all parallel?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","yes, it does","yes, it is","yes, they are","they are","they are parallel","parallel","all parallel"],["no","no, it does not","no, they are not","they are not","they are not parallel","it does not","it is not","not parallel"]]}
            solution_sketch: 'The slope $y^2 - 4$ depends only on $y$. On the line $y = c$ it equals the constant $c^2 - 4$, so all the marks there are parallel.'
          - problem: 'Can a solution curve of $y'' = x^2 + 1$ ever have a horizontal tangent?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, it can","it can","yes it can"],["no","no, it cannot","it cannot","never","no it cannot"]]}
            solution_sketch: 'A horizontal tangent needs $x^2 + 1 = 0$. But $x^2 + 1 \ge 1$ for every $x$, so the slope is never zero. So no solution curve has a horizontal tangent.'
          - problem: 'For $y'' = x$, the slope marks along the vertical line $x = 2$ all look the same. What is their common slope?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope $x$ does not depend on $y$. On the line $x = 2$ every mark has slope $2$.'
        constraints: "qualitative questions: monotonicity from sign of f, symmetry of the field, identifying whether slopes depend on x, y, or both"
    diagnostic_exemplar:
      problem: 'For $y'' = x^2 + 1$, say where the slope marks are horizontal, along which lines they are constant, and give the family of solution curves.'
      answer: 'Nowhere horizontal: $x^2 + 1 \ge 1 > 0$, so every solution is strictly increasing. The slope depends only on $x$, so the marks are constant along vertical lines. The solutions are $y = \frac{x^3}{3} + x + C$.'
      answer_contract: {kind: none}
      solution_sketch: 'Horizontal marks would need $x^2 + 1 = 0$, which has no real solution; constancy along vertical lines follows from the absence of $y$; integrating gives the family.'
    anki_seeds:
      - front: "The slope field of y' = f(x, y) assigns to each point (x, y)..."
        back: "a short mark of slope f(x, y); solution curves follow the marks."
        type: basic
      - front: "An isocline of y' = f(x, y) is..."
        back: "a curve f(x, y) = c on which all slope marks have the same slope c."
        type: basic

  - id: slope-fields-equilibria
    name: Autonomous Equations and Phase Lines
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: slope-fields
        weight: 0.6
        key: true
      - id: factoring-trinomials
        weight: 0.25
        key: false
    knowledge_points:
      - id: kp1
        name: 'Finding equilibria and drawing the phase line'
        key_prerequisites: [factoring-trinomials]
        step_check:
          step: 'Interval $y < 1$: Choose $y = 0$'
          question: 'Why does one test value show the sign of $f$ on the whole interval $y < 1$?'
          options:
            - 'Every interval to the left of an equilibrium has $f > 0$'
            - 'The test value $y = 0$ is always an equilibrium itself'
            - 'No zero of $f$ lies in the interval, so $f$ cannot change sign there'
            - 'The sign of $f$ alternates from one interval to the next, so $f(0)$ settles it'
          answer: 'No zero of $f$ lies in the interval, so $f$ cannot change sign there'
          why: 'On an interval with no zero of $f$, the continuous function $f$ never crosses $0$, so it keeps one sign.'
        try_first:
          problem: 'A quantity $y$ satisfies $y'' = 3y - 12$. For which value of $y$ is its rate of change zero?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'The rate $y''$ is zero when $3y - 12 = 0$, so at $y = 4$. A solution that starts at such a value never moves, and that is what we call an equilibrium solution.'
        exemplars:
          - problem: 'Find the equilibrium solutions of $y'' = y^2 - 5y + 6$.'
            answer: '2, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An equilibrium solution is constant, so $y'' = 0$ there. Factor $y^2 - 5y + 6 = (y - 2)(y - 3)$, which is zero at $y = 2$ and $y = 3$.'
          - problem: 'Find the equilibrium solutions of $\frac{dy}{dt} = 4y - y^2$.'
            answer: '0, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A constant solution needs $\frac{dy}{dt} = 0$. Factor $4y - y^2 = y(4 - y)$, which is zero at $y = 0$ and $y = 4$.'
          - problem: 'A population $P$ (in thousands) satisfies $\frac{dP}{dt} = 0.5P(8 - P)$. At which population sizes does $P$ stay constant over time?'
            answer: '0, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The population stays constant exactly when $\frac{dP}{dt} = 0$. The product $0.5P(8 - P)$ is zero when $P = 0$ or $P = 8$, so the sizes are $0$ and $8$ thousand.'
          - problem: 'The concentration $C$ of a drug in the blood (in mg/L) changes according to $\frac{dC}{dt} = 12 - 0.4C$. At what concentration does $C$ stop changing?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The concentration stops changing when $\frac{dC}{dt} = 0$, so $12 - 0.4C = 0$. Then $0.4C = 12$, and dividing both sides by $0.4$ gives $C = 30$.'
          - problem: 'Find the equilibrium solutions of $y'' = y(y - 1)(y + 3)$.'
            answer: '-3, 0, 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $y(y - 1)(y + 3) = 0$. A product is zero when one factor is zero, so $y = 0$, $y = 1$ or $y = -3$.'
          - problem: 'A solution of $y'' = y(2 - y)$ passes through $y = 1$. At that moment, is the solution increasing or decreasing?'
            answer: 'increasing'
            answer_contract: {"kind":"label","options":[["increasing","it is increasing","increases","it increases","the solution increases","rising","going up","it goes up"],["decreasing","it is decreasing","decreases","it decreases","the solution decreases","falling","going down","it goes down"]]}
            solution_sketch: 'At $y = 1$ the slope is $y'' = 1(2 - 1) = 1$. The slope is positive, so the solution is increasing.'
          - problem: 'Sam looks for the equilibrium solutions of $y'' = y^2 - 2y$ by dividing $y^2 - 2y = 0$ by $y$, and finds only $y = 2$. What are all the equilibrium solutions?'
            answer: '0, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing by $y$ loses the solution $y = 0$. Factor instead: $y^2 - 2y = y(y - 2)$, which is zero at $y = 0$ and $y = 2$.'
          - problem: 'For which values of $y$ does a solution of $y'' = y^2 - 4$ increase?'
            answer: 'y < -2 or y > 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'A solution increases where $y'' > 0$. Since $y^2 - 4 = (y - 2)(y + 2)$ is positive for $y < -2$ and for $y > 2$ and negative between them, the solution increases for $y < -2$ or $y > 2$.'
          - problem: 'A cup of coffee at temperature $T$ (in $^\circ$C) in a room cools according to $\frac{dT}{dt} = -0.1(T - 22)$. At what temperature does it stop cooling?'
            answer: '22'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The coffee stops cooling when $\frac{dT}{dt} = 0$. That happens when $T - 22 = 0$, so at $T = 22$ degrees Celsius, the temperature of the room.'
        constraints: 'f(y) factorable with integer roots, or linear in y; the equilibria are the zeros of f; a sign chart of f gives the arrows of the phase line'
      - id: kp2
        name: 'Stability classification'
        key_prerequisites: [factoring-trinomials]
        step_check:
          step: 'For $0 < y < 3$: $f(y)$ is negative'
          question: 'Why is $f(y) = y(y - 3)$ negative when $0 < y < 3$?'
          options:
            - 'Both factors, $y$ and $y - 3$, are negative there'
            - 'The factor $y$ is positive and the factor $y - 3$ is negative'
            - 'Both factors, $y$ and $y - 3$, are positive there'
            - 'The factor $y$ is negative and the factor $y - 3$ is positive'
          answer: 'The factor $y$ is positive and the factor $y - 3$ is negative'
          why: 'At $y = 1$ the factors are $1$ and $-2$, and their product $-2$ is negative.'
        exemplars:
          - problem: 'Find the stable equilibrium of $y'' = y(2 - y)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibria are $y = 0$ and $y = 2$. For $0 < y < 2$ the slope is positive, and for $y > 2$ it is negative, so solutions on both sides move toward $y = 2$ and it is stable.'
          - problem: 'The equation $y'' = (y - 1)^2$ has one equilibrium, $y = 1$. Is it stable, unstable or semistable?'
            answer: 'semistable'
            answer_contract: {"kind":"label","options":[["stable","it is stable","asymptotically stable"],["unstable","it is unstable","not stable"],["semistable","semi-stable","half-stable","it is semistable"]]}
            solution_sketch: 'Since $(y - 1)^2 \ge 0$, the slope is positive on both sides of $y = 1$. Solutions below it move up toward it and solutions above it move away, so it is semistable.'
          - problem: 'Find the stable equilibrium of $y'' = (y + 2)(y - 4)$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibria are $y = -2$ and $y = 4$. For $y$ just below $-2$ the slope is positive, and just above $-2$ it is negative, so solutions move toward $y = -2$ from both sides.'
          - problem: 'A fish population $P$ (in thousands) follows $\frac{dP}{dt} = 0.2P\left(1 - \frac{P}{50}\right)$. If a few fish are present at the start, what population level does the lake settle to?'
            answer: '50'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibria are $P = 0$ and $P = 50$. For $0 < P < 50$ the slope is positive and above $50$ it is negative, so a small population grows toward $50$ thousand.'
          - problem: 'A rare species has population $P$ (in hundreds) with $\frac{dP}{dt} = 0.01P(P - 20)(80 - P)$. Below what population size does the species die out?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibria are $P = 0$, $P = 20$ and $P = 80$. For $0 < P < 20$ the slope is negative, so the population falls to $0$, while just above $20$ it is positive and the population grows. The threshold is the unstable equilibrium $20$.'
          - problem: 'Mia checks $y'' = y^2 - 9$ at $y = 4$, finds $f(4) = 7 > 0$, and concludes that $y = 3$ is stable. Which equilibrium of this equation is actually stable?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is positive for $y > 3$, so solutions above $3$ move away from it, and $y = 3$ is unstable. Between $-3$ and $3$ the slope is negative and below $-3$ it is positive, so $y = -3$ is the stable equilibrium.'
          - problem: 'Is the equilibrium $y = 3$ of $y'' = y(y - 3)$ stable, unstable or semistable?'
            answer: 'unstable'
            answer_contract: {"kind":"label","options":[["stable","it is stable","asymptotically stable"],["unstable","it is unstable","not stable"],["semistable","semi-stable","half-stable","it is semistable"]]}
            solution_sketch: 'For $0 < y < 3$ the slope is negative, so solutions just below $3$ move away from it. For $y > 3$ the slope is positive, so solutions just above $3$ also move away, and $y = 3$ is unstable.'
          - problem: 'A skydiver''s speed $v$ (in m/s) satisfies $\frac{dv}{dt} = 10 - 0.2v$. What speed does the skydiver approach if the fall lasts long enough?'
            answer: '50'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The only equilibrium is where $10 - 0.2v = 0$, so $v = 10 / 0.2 = 50$. For $v < 50$ the slope is positive and for $v > 50$ it is negative, so $v = 50$ is stable and the speed approaches $50$ m/s.'
        constraints: 'f(y) factorable with integer roots, or a product of simple factors; classify through a sign chart of f, no derivative test needed'
      - id: kp3
        name: 'Long-run behavior from an initial condition'
        key_prerequisites: [factoring-trinomials]
        step_check:
          step: 'where $f(y) < 0$, the solution decreases'
          question: 'Why does $f(y) < 0$ mean that the solution decreases?'
          options:
            - 'Because $f(y)$ is the slope $y''$ of the solution, and a negative slope falls'
            - 'Because $y(0) = 1$ is below the equilibrium $3$, and solutions fall below equilibria'
            - 'Because $f$ depends on $y$ only, so $y$ must stay constant in time'
            - 'Because a negative value of $f$ makes the equilibrium $y = 0$ unstable'
          answer: 'Because $f(y)$ is the slope $y''$ of the solution, and a negative slope falls'
          why: 'The equation says $y'' = f(y)$, so the sign of $f$ is the sign of the slope of the solution curve.'
        exemplars:
          - problem: 'For $y'' = y(2 - y)$ with $y(0) = 1$, find $\lim_{t \to \infty} y(t)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibria are $0$ and $2$. Since $y(0) = 1$ lies in $(0, 2)$ where $f > 0$, the solution increases and approaches the stable equilibrium $2$.'
          - problem: 'For $y'' = y^2 - 9$ with $y(0) = 0$, find $\lim_{t \to \infty} y(t)$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibria are $-3$ and $3$. On $(-3, 3)$ we have $f < 0$, so the solution that starts at $0$ decreases toward the stable equilibrium $-3$.'
          - problem: 'For $y'' = -\tfrac{1}{2}(y - 4)$ with $y(0) = 10$, find $\lim_{t \to \infty} y(t)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The only equilibrium is $y = 4$. For $y > 4$ we have $f < 0$, so the solution that starts at $10$ decreases toward $4$.'
          - problem: 'A rare species has population $P$ (in hundreds) with $\frac{dP}{dt} = 0.01P(P - 20)(80 - P)$ and $P(0) = 15$. What population does it approach in the long run?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibria are $0$, $20$ and $80$. Since $15$ lies in $(0, 20)$ where the slope is negative, the population falls and approaches $0$, so the species dies out.'
          - problem: 'A patient starts with no drug in the blood. The concentration $C$ (in mg/L) then follows $\frac{dC}{dt} = 8 - 0.25C$ with $C(0) = 0$. What level does the concentration approach?'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibrium is where $8 - 0.25C = 0$, so $C = 8 / 0.25 = 32$. At $C = 0$ the slope is positive, so the concentration rises toward $32$ mg/L.'
          - problem: 'For $y'' = y(y - 3)$ with $y(0) = 4$, does the solution approach an equilibrium or grow without bound?'
            answer: 'grows without bound'
            answer_contract: {"kind":"label","options":[["grows without bound","it grows without bound","increases without bound","goes to infinity","blows up","diverges","tends to infinity","approaches infinity"],["approaches an equilibrium","it approaches an equilibrium","settles down","converges","levels off","tends to an equilibrium","approaches 3","approaches 0"]]}
            solution_sketch: 'The equilibria are $0$ and $3$. For $y > 3$ the slope is positive, so the solution that starts at $4$ keeps increasing and never meets another equilibrium.'
          - problem: 'Tom says that for $y'' = y(y - 3)$ with $y(0) = 1$ the solution increases, because $y(0) = 1$ is positive. Find $\lim_{t \to \infty} y(t)$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sign of $y$ itself does not decide the direction. At $y = 1$ the slope is $1(1 - 3) = -2$, so the solution decreases toward the stable equilibrium $0$.'
          - problem: 'For $y'' = (y - 1)(3 - y)$ with $y(0) = 2$, find $\lim_{t \to \infty} y(t)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibria are $1$ and $3$. Since $2$ lies in $(1, 3)$ where $f > 0$, the solution increases toward the stable equilibrium $3$.'
          - problem: 'A hot metal rod at $400\,^\circ$C is placed in a bath at $25\,^\circ$C. Its temperature follows $\frac{dT}{dt} = -0.2(T - 25)$. What temperature does the rod approach?'
            answer: '25'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The only equilibrium is $T = 25$. Since $400 > 25$ the slope is negative, so the rod cools toward $25$ degrees Celsius, the temperature of the bath.'
          - problem: 'A rare species has population $P$ (in hundreds) with $\frac{dP}{dt} = 0.01P(P - 20)(80 - P)$ and $P(0) = 30$. What population does it approach in the long run?'
            answer: '80'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equilibria are $0$, $20$ and $80$. Since $30$ lies in $(20, 80)$ where the slope is positive, the population grows toward the stable equilibrium $80$.'
        constraints: 'initial value sits strictly between or beyond the equilibria; the answer is the equilibrium that the flow carries it to, or unbounded growth'
    diagnostic_exemplar:
      problem: "For $y' = y(y - 3)$: find all equilibria, classify their stability, and find $\\lim_{t \\to \\infty} y(t)$ for the solution with $y(0) = 1$."
      answer: "$y = 0$ stable, $y = 3$ unstable; the solution with $y(0) = 1$ tends to $0$."
      answer_contract: {kind: none}
      solution_sketch: "$f > 0$ for $y < 0$, $f < 0$ on $(0,3)$, $f > 0$ for $y > 3$; from $y(0) = 1$ the solution decreases to $0$."
    anki_seeds:
      - front: "Equilibrium solutions of the autonomous equation y' = f(y) are..."
        back: "the constant solutions y = c where f(c) = 0."
        type: basic
      - front: "An equilibrium of y' = f(y) is stable when..."
        back: "f > 0 just below it and f < 0 just above it (the flow points toward it from both sides)."
        type: basic

  - id: eulers-method
    name: "Euler's Method"
    core: false                # named numerical algorithm; nothing here uses it
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: slope-fields-equilibria
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'A single Euler step'
        key_prerequisites: [evaluating-expressions]
        step_check:
          step: 'Apply Euler''s formula'
          question: 'Why does Euler''s formula multiply the slope by $h$?'
          options:
            - 'Moving $h$ along a line of that slope changes $y$ by the slope times $h$'
            - 'Multiplying by $h$ turns the slope into the value of $y$ at the next point'
            - 'Multiplying by $h$ makes the slope smaller, so the estimate stays accurate'
            - 'The factor $h$ converts the slope into a percentage of the old value $y_0$'
          answer: 'Moving $h$ along a line of that slope changes $y$ by the slope times $h$'
          why: 'The tangent line at $(x_0, y_0)$ rises by slope times run, and the run from $x_0$ to $x_1$ is $h$.'
        exemplars:
          - problem: 'For $y'' = x + y$ with $y(0) = 1$, use one Euler step of size $h = 0.1$ to estimate $y(0.1)$.'
            answer: '1.1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at the starting point is $f(0, 1) = 0 + 1 = 1$. Euler''s method gives $y(0.1) \approx 1 + 0.1 \cdot 1 = 1.1$.'
          - problem: 'For $y'' = x - y$ with $y(1) = 2$, use one Euler step of size $h = 0.2$ to estimate $y(1.2)$.'
            answer: '1.8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at the starting point is $f(1, 2) = 1 - 2 = -1$. Euler''s method gives $y(1.2) \approx 2 + 0.2(-1) = 1.8$.'
          - problem: 'For $y'' = 2x + y$ with $y(0) = 1$, one Euler step of size $h$ gives the estimate $y(h) \approx 1.2$. Find $h$.'
            answer: '0.2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at $(0, 1)$ is $f(0, 1) = 2 \cdot 0 + 1 = 1$, so the estimate is $1 + h \cdot 1$. Setting $1 + h = 1.2$ gives $h = 0.2$.'
          - problem: 'A cup of coffee at $90\,^\circ$C cools in a $20\,^\circ$C room according to $\frac{dT}{dt} = -0.05(T - 20)$, where $t$ is in minutes. Use one Euler step of $2$ minutes to estimate the temperature at $t = 2$.'
            answer: '83'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'At $t = 0$ the rate is $-0.05(90 - 20) = -3.5$ degrees per minute. Over $2$ minutes the temperature falls by $2 \cdot 3.5 = 7$, so the estimate is $90 - 7 = 83$ degrees.'
          - problem: 'A population of $500$ bacteria grows according to $\frac{dP}{dt} = 0.04P$, where $t$ is in hours. One Euler step of size $h$ estimates the population at $t = h$ as $530$. Find $h$.'
            answer: '1.5'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'At the start the rate is $0.04 \cdot 500 = 20$ bacteria per hour. The estimate is $500 + 20h = 530$, so dividing $30$ by $20$ gives $h = 1.5$ hours.'
          - problem: 'For $y'' = x^2 + y^2$, the solution passes through the point $(1, 2)$. What is the slope of the solution at that point?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is the value of the right side at the point. Substituting $x = 1$ and $y = 2$ gives $1^2 + 2^2 = 5$.'
          - problem: 'Lena uses one Euler step of size $h = 0.1$ for $y'' = 3y$ with $y(0) = 2$, and writes $y(0.1) \approx 2 + 0.1 \cdot 3 = 2.3$. What is the correct estimate?'
            answer: '2.6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Lena used the number $3$ as the slope, but the slope is $f(0, 2) = 3 \cdot 2 = 6$. The correct estimate is $2 + 0.1 \cdot 6 = 2.6$.'
          - problem: 'The concentration $C$ of a drug (in mg/L) satisfies $\frac{dC}{dt} = 8 - 0.25C$ with $C(0) = 12$, where $t$ is in hours. Use one Euler step of half an hour to estimate $C(0.5)$.'
            answer: '14.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate at the start is $8 - 0.25 \cdot 12 = 5$ mg/L per hour. The estimate is $12 + 0.5 \cdot 5 = 14.5$ mg/L.'
          - problem: 'For $y'' = x^2 - y$ with $y(0) = 2$, use one Euler step of size $h = 0.25$ to estimate $y(0.25)$.'
            answer: '1.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope at the start is $f(0, 2) = 0 - 2 = -2$. The estimate is $2 + 0.25(-2) = 1.5$.'
        constraints: 'h in {0.1, 0.2, 0.25, 0.5, 1}; f polynomial or linear in y; arithmetic exact in one or two decimal places; contexts give a rate law and a step'
      - id: kp2
        name: 'Iterating several steps'
        key_prerequisites: [slope-fields-equilibria, evaluating-expressions]
        step_check:
          step: 'At $x = 1$, $y_1 = 0$'
          question: 'Why is the second slope computed at $x = 1$ and not at $x = 0$?'
          options:
            - 'The slope must always be computed at the largest value of $x$ in the problem'
            - 'The slope is the same at every point, so either point would do equally well'
            - 'The estimate has moved to $(1, 0)$, and the slope there sets the next move'
            - 'The point $x = 0$ was already used up, so it cannot be used a second time'
          answer: 'The estimate has moved to $(1, 0)$, and the slope there sets the next move'
          why: 'The right side $f(x, y)$ changes with the point, so each step needs the slope at the point where that step starts.'
        exemplars:
          - problem: 'For $y'' = x + y$ with $y(0) = 1$, use two Euler steps of size $h = 0.1$ to estimate $y(0.2)$.'
            answer: '1.22'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first step gives $y_1 = 1 + 0.1(0 + 1) = 1.1$ at $x = 0.1$. The second step gives $y_2 = 1.1 + 0.1(0.1 + 1.1) = 1.22$.'
          - problem: 'For $y'' = y$ with $y(0) = 1$, use two Euler steps of size $h = 0.5$ to estimate $y(1)$.'
            answer: '2.25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first step gives $y_1 = 1 + 0.5 \cdot 1 = 1.5$. The second step gives $y_2 = 1.5 + 0.5 \cdot 1.5 = 2.25$.'
          - problem: 'For $y'' = x^2$ with $y(0) = 0$, use two Euler steps of size $h = 1$ to estimate $y(2)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = 0$ the slope is $0$, so $y_1 = 0 + 1 \cdot 0 = 0$. At $x = 1$ the slope is $1$, so $y_2 = 0 + 1 \cdot 1 = 1$.'
          - problem: 'For $y'' = x - y$ with $y(0) = 2$, use two Euler steps of size $h = 0.2$ to estimate $y(0.4)$.'
            answer: '1.32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first step gives $y_1 = 2 + 0.2(0 - 2) = 1.6$ at $x = 0.2$. The second step gives $y_2 = 1.6 + 0.2(0.2 - 1.6) = 1.32$.'
          - problem: 'A cup of coffee at $90\,^\circ$C cools in a $20\,^\circ$C room according to $\frac{dT}{dt} = -0.05(T - 20)$, where $t$ is in minutes. Use two Euler steps of $2$ minutes each to estimate the temperature at $t = 4$.'
            answer: '76.7'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The first step gives $T_1 = 90 + 2(-0.05 \cdot 70) = 83$. The second rate is $-0.05 \cdot 63 = -3.15$, so $T_2 = 83 + 2(-3.15) = 76.7$ degrees.'
          - problem: 'A town of $1000$ residents grows according to $\frac{dP}{dt} = 0.1P$, where $t$ is in years. Use Euler steps of one year to estimate the population after $3$ years.'
            answer: '1331'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step multiplies the population by $1 + 0.1 \cdot 1 = 1.1$. After three steps the estimate is $1000 \cdot 1.1^3 = 1331$.'
          - problem: 'To estimate $y(3)$ from $y(0)$ with Euler''s method and step size $h = 0.5$, how many steps are needed?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step moves $x$ forward by $h = 0.5$. The total distance is $3 - 0 = 3$, so the number of steps is $3 \div 0.5 = 6$.'
          - problem: 'For $y'' = xy$ with $y(0) = 1$, use two Euler steps of size $h = 0.5$ to estimate $y(1)$.'
            answer: '1.25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $x = 0$ the slope is $0$, so $y_1 = 1$. At $x = 0.5$ the slope is $0.5 \cdot 1 = 0.5$, so $y_2 = 1 + 0.5 \cdot 0.5 = 1.25$.'
          - problem: 'Omar estimates $y(0.5)$ for $y'' = 2y$ with $y(0) = 1$ using one Euler step of size $0.5$, and gets $2$. Use two Euler steps of size $0.25$ instead. What is the estimate?'
            answer: '2.25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first step gives $y_1 = 1 + 0.25 \cdot 2 = 1.5$. The second step uses the new slope $2 \cdot 1.5 = 3$, so $y_2 = 1.5 + 0.25 \cdot 3 = 2.25$.'
          - problem: 'A patient starts with no drug in the blood. The concentration $C$ (in mg/L) satisfies $\frac{dC}{dt} = 8 - 0.25C$ with $C(0) = 0$, where $t$ is in hours. Use two Euler steps of one hour each to estimate $C(2)$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first step gives $C_1 = 0 + 1 \cdot 8 = 8$. The second rate is $8 - 0.25 \cdot 8 = 6$, so $C_2 = 8 + 1 \cdot 6 = 14$ mg/L.'
        constraints: '2-3 steps; track (x_n, y_n) in a table; values chosen so no rounding is needed; contexts give a rate law, a step and a final time'
      - id: kp3
        name: 'Error behavior'
        key_prerequisites: [slope-fields-equilibria]
        step_check:
          step: 'Euler follows the tangent line'
          question: 'Why does a step along the tangent line produce an error?'
          options:
            - 'The tangent line has the wrong slope at the starting point of the step'
            - 'The true solution curves away from the tangent line as $x$ moves on'
            - 'The tangent line always lies above the true solution curve, whatever $f$ is'
            - 'The step size $h$ is always rounded to the wrong value by the computer'
          answer: 'The true solution curves away from the tangent line as $x$ moves on'
          why: 'The tangent line uses the slope at the start only, but the true slope keeps changing along the step, so the line drifts away from the curve.'
        exemplars:
          - problem: 'For $y'' = y$ with $y(0) = 1$, one Euler step of size $h = 1$ estimates $y(1)$ as $2$. The exact value is $e$. Find the error, the exact value minus the estimate, to three decimal places.'
            answer: '0.718'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'The exact value is $e \approx 2.71828$ and the estimate is $2$. The error is $2.71828 - 2 = 0.71828$, which is $0.718$ to three decimal places.'
          - problem: 'For $y'' = y$ with $y(0) = 1$, use two Euler steps of size $h = 0.5$ to estimate $y(1)$. The exact value is $e$. Find the error, the exact value minus the estimate, to three decimal places.'
            answer: '0.468'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'The two steps give $1.5$ and then $2.25$. The error is $e - 2.25 = 2.71828 - 2.25 = 0.46828$, which is $0.468$ to three decimal places.'
          - problem: 'For $y'' = 2y$ with $y(0) = 1$, use two Euler steps of size $h = 0.5$ to estimate $y(1)$. The exact value is $e^2$. Find the error, the exact value minus the estimate, to three decimal places.'
            answer: '3.389'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'The two steps give $1 + 0.5 \cdot 2 = 2$ and then $2 + 0.5 \cdot 4 = 4$. The error is $e^2 - 4 = 7.38906 - 4 = 3.38906$, which is $3.389$ to three decimal places.'
          - problem: 'For $y'' = -y$ with $y(0) = 1$, one Euler step of size $h = 1$ estimates $y(1)$. The exact value is $e^{-1}$. Find the error, the exact value minus the estimate, to three decimal places.'
            answer: '0.368'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'The step gives $1 + 1(-1) = 0$. The exact value is $e^{-1} \approx 0.36788$, so the error is $0.36788 - 0 = 0.368$ to three decimal places.'
          - problem: 'For $y'' = y$ with $y(0) = 1$, Euler''s method with step size $h = 0.5$ estimates $y(1)$. Is the estimate an underestimate or an overestimate of the exact value?'
            answer: 'underestimate'
            answer_contract: {"kind":"label","options":[["underestimate","too low","too small","lower than the true value","lower than the exact value","smaller than the exact value","an underestimate","it underestimates"],["overestimate","too high","too large","higher than the true value","higher than the exact value","larger than the exact value","an overestimate","it overestimates"]]}
            solution_sketch: 'The estimate is $2.25$ and the exact value is $e \approx 2.718$. The estimate is smaller than the exact value, so it is an underestimate.'
          - problem: 'Euler''s method has a global error proportional to $h$. A simulation of a cooling cup with step size $h = 0.4$ minutes has a final temperature error of about $0.02\,^\circ$C. What error should we expect with $h = 0.1$ minutes?'
            answer: '0.005'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The step size is divided by $0.4 / 0.1 = 4$, so the error is divided by $4$ as well. The new error is $0.02 / 4 = 0.005$ degrees.'
          - problem: 'Euler''s method has a global error proportional to $h$. A simulation with step size $h = 0.1$ has a global error of about $0.002$. What step size gives an error of about $0.0005$?'
            answer: '0.025'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The error must shrink by the factor $0.002 / 0.0005 = 4$. The step size must shrink by the same factor, so $h = 0.1 / 4 = 0.025$.'
          - problem: 'Euler''s global error is proportional to $h$. A simulation from $t = 0$ to $t = 10$ with $h = 0.1$ takes $100$ steps. How many steps are needed to make the global error five times smaller?'
            answer: '500'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The error is five times smaller when the step size is five times smaller, so $h = 0.1 / 5 = 0.02$. The number of steps is $10 / 0.02 = 500$.'
          - problem: 'Euler''s method has a global error proportional to $h$. By what factor is the error multiplied when the step size is halved?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The error is proportional to $h$, so halving $h$ halves the error. The error is multiplied by $1/2$.'
          - problem: 'For $y'' = y$ with $y(0) = 1$, use four Euler steps of size $h = 0.25$ to estimate $y(1)$. The exact value is $e$. Find the error, the exact value minus the estimate, to three decimal places.'
            answer: '0.277'
            answer_contract: {"kind":"approx","decimals":3}
            solution_sketch: 'Each step multiplies by $1.25$, so the estimate is $1.25^4 = 2.44141$. The error is $2.71828 - 2.44141 = 0.27687$, which is $0.277$ to three decimal places.'
        constraints: 'comparisons against a known exact solution, or first-order error scaling (error proportional to h); the answer is a single number (an error value or a factor)'
    diagnostic_exemplar:
      problem: 'For $y'' = y$ with $y(0) = 1$, estimate $y(1)$ using two Euler steps of size $h = 0.5$, then report the signed error (the true value $e$ minus your estimate), to three decimal places.'
      answer: '0.468'
      solution_sketch: 'Two steps: $y_1 = 1 + 0.5(1) = 1.5$, then $y_2 = 1.5 + 0.5(1.5) = 2.25$. The true value is $e \approx 2.718$, so the error is $2.718 - 2.25 \approx 0.468$.'
    anki_seeds:
      - front: "Euler's method update rule?"
        back: '$y_{n+1} = y_n + h\,f(x_n, y_n)$, with $x_{n+1} = x_n + h$.'
        type: basic
      - front: "Order of the global error of Euler's method?"
        back: "First order: the error scales like h."
        type: basic

  - id: separation-of-variables
    name: Separation of Variables
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: ode-classification-verification
        weight: 0.5
        key: true
      - id: antiderivatives
        weight: 0.5
        key: true
      - id: integration-substitution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Recognizing separable equations'
        key_prerequisites: [ode-classification-verification]
        step_check:
          step: 'Factor out the common term $x^2$'
          question: 'Why do we factor the right side before deciding whether the equation is separable?'
          options:
            - 'Factoring turns the equation into one that can be integrated directly right away'
            - 'Any right side that has a common factor is automatically separable'
            - 'The common factor $x^2$ is the solution of the differential equation'
            - 'Separable means the right side is a product of an $x$ part and a $y$ part'
          answer: 'Separable means the right side is a product of an $x$ part and a $y$ part'
          why: 'Only a product $g(x)h(y)$ lets us move all the $y$ terms to one side and all the $x$ terms to the other.'
        exemplars:
          - problem: 'Factor the right side of $y'' = xy + 3x$.'
            answer: 'x(y + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms contain the factor $x$. Taking it out gives $xy + 3x = x(y + 3)$, a function of $x$ times a function of $y$, so the equation is separable.'
          - problem: 'Is the equation $y'' = e^{x+y}$ separable?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is separable", "separable", "yes, it is", "yes it is", "true"], ["no", "it is not", "it is not separable", "not separable", "no, it is not", "no it is not", "false"]]}
            solution_sketch: 'By the exponent rule $e^{x+y} = e^x e^y$, which is a function of $x$ times a function of $y$. So the equation is separable and the answer is yes.'
          - problem: 'Factor the right side of $y'' = 6xy - 4x$.'
            answer: '2x(3y - 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms contain the factor $2x$. Taking it out gives $6xy - 4x = 2x(3y - 2)$.'
          - problem: 'The concentration $C$ of a drug (in mg/L) after $t$ hours is modelled by $\frac{dC}{dt} = 4Ct - 12t$. Factor the right side.'
            answer: '4t(C - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms contain the factor $4t$. Taking it out gives $4Ct - 12t = 4t(C - 3)$, so the model is separable in $t$ and $C$.'
          - problem: 'A population $P$ with immigration is modelled by $\frac{dP}{dt} = 0.03P + 2t$. Is this equation separable?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is separable","separable","it is"],["no","it is not separable","not separable","it is not"]]}
            solution_sketch: 'A separable equation needs a right side that is a product of a function of $t$ and a function of $P$. The sum $0.03P + 2t$ cannot be factored that way, so the equation is not separable.'
          - problem: 'Factor the right side of $y'' = x^2y^2 - x^2$.'
            answer: 'x^2(y - 1)(y + 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take out the common factor $x^2$ to get $x^2(y^2 - 1)$. Then $y^2 - 1 = (y - 1)(y + 1)$, so the right side is $x^2(y - 1)(y + 1)$.'
          - problem: 'Factor the right side of $y'' = xy^2 + 5xy$.'
            answer: 'xy(y + 5)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms contain the factors $x$ and $y$. Taking them out gives $xy^2 + 5xy = xy(y + 5)$, which is separable.'
        constraints: 'right sides that factor (or fail to factor) as g(x)h(y); include sums that only look separable'
      - id: kp2
        name: 'Separate and integrate'
        key_prerequisites: [antiderivatives]
        step_check:
          step: 'Absorb the constant $\frac{1}{4}$ into $C$'
          question: 'Why can we multiply both sides by $4$ and still call the constant $C$?'
          options:
            - 'The constant $4C$ is still arbitrary, so it can be renamed $C$'
            - 'Multiplying by $4$ leaves a constant unchanged, because $4C = C$'
            - 'The constant is dropped, since only the $x^4$ term matters'
            - 'A constant of integration is always $0$, so it never matters'
          answer: 'The constant $4C$ is still arbitrary, so it can be renamed $C$'
          why: 'The constant stands for any real number, and any real number times $4$ is again any real number.'
        exemplars:
          - problem: 'Solve $\frac{dy}{dx} = 2xy^2$ with $y(0) = 1$.'
            answer: '1/(1 - x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $\frac{dy}{y^2} = 2x\,dx$. Integrating gives $-\frac{1}{y} = x^2 + C$. The condition $y(0) = 1$ gives $C = -1$, so $y = \frac{1}{1 - x^2}$.'
          - problem: 'Solve $\frac{dy}{dx} = \frac{2x}{y^2}$ with $y(0) = 2$.'
            answer: '(3x^2 + 8)^(1/3)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $y^2\,dy = 2x\,dx$. Integrating gives $\frac{y^3}{3} = x^2 + C$, and $y(0) = 2$ gives $C = \frac{8}{3}$. Then $y^3 = 3x^2 + 8$, so $y = (3x^2 + 8)^{1/3}$.'
          - problem: 'Solve $\frac{dy}{dx} = 2\sqrt{y}$ with $y(0) = 4$.'
            answer: '(x + 2)^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $\frac{dy}{2\sqrt{y}} = dx$. Integrating gives $\sqrt{y} = x + C$, and $y(0) = 4$ gives $C = 2$. So $y = (x + 2)^2$.'
          - problem: 'Water drains from a tank so that its depth $h$ (in metres) satisfies $\frac{dh}{dt} = -0.5\sqrt{h}$, where $t$ is in hours. The depth at $t = 0$ is $16$ m. Find $h(t)$.'
            answer: '(4 - t/4)^2'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Separate: $h^{-1/2}\,dh = -0.5\,dt$. Integrating gives $2\sqrt{h} = -0.5t + C$, and $h(0) = 16$ gives $C = 8$. Then $\sqrt{h} = 4 - \frac{t}{4}$, so $h = \left(4 - \frac{t}{4}\right)^2$.'
          - problem: 'A particle moves so that its speed $v$ (in m/s) satisfies $\frac{dv}{dt} = -v^2$, with $v(0) = 2$. Find $v(t)$.'
            answer: '2/(2t + 1)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Separate: $\frac{dv}{v^2} = -dt$. Integrating gives $-\frac{1}{v} = -t + C$, and $v(0) = 2$ gives $C = -\frac{1}{2}$. So $\frac{1}{v} = t + \frac{1}{2}$ and $v = \frac{2}{2t + 1}$.'
          - problem: 'Separating the variables in $\frac{dy}{dx} = 3x^2y^2$ and integrating gives $-\frac{1}{y} = x^3 + C$. Find $C$ if $y(0) = 2$.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $x = 0$ and $y = 2$ into $-\frac{1}{y} = x^3 + C$. This gives $-\frac{1}{2} = 0 + C$, so $C = -\frac{1}{2}$.'
          - problem: 'Water drains from a tank so that its depth $h$ (in metres) satisfies $\frac{dh}{dt} = -0.5\sqrt{h}$, where $t$ is in hours. The depth at $t = 0$ is $9$ m. How many hours pass until the tank is empty?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'Separating and integrating gives $2\sqrt{h} = -0.5t + C$, and $h(0) = 9$ gives $C = 6$. Then $\sqrt{h} = 3 - \frac{t}{4}$, which is $0$ when $t = 12$ hours.'
          - problem: 'Solve $\frac{dy}{dx} = 4x^3y^2$ with $y(0) = -1$.'
            answer: '-1/(x^4 + 1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $\frac{dy}{y^2} = 4x^3\,dx$. Integrating gives $-\frac{1}{y} = x^4 + C$, and $y(0) = -1$ gives $C = 1$. So $y = -\frac{1}{x^4 + 1}$.'
        constraints: 'antiderivatives are powers only; the initial value fixes the constant; the solution is explicit and its sign is determined by the data'
      - id: kp3
        name: 'Logarithmic integrations and absorbed constants'
        key_prerequisites: [integration-substitution]
        step_check:
          step: 'Exponentiate both sides'
          question: 'Why do we exponentiate both sides of $\ln|y| = 2\ln x + C$?'
          options:
            - 'Exponentiating removes the constant $C$ from the equation'
            - 'Exponentiating both sides makes every solution positive'
            - 'Because $e^{\ln|y|} = |y|$, which frees $y$ from the logarithm'
            - 'The logarithm can be removed only by dividing both sides by $\ln$'
          answer: 'Because $e^{\ln|y|} = |y|$, which frees $y$ from the logarithm'
          why: 'The functions $e^u$ and $\ln u$ undo each other, so exponentiating turns $\ln|y|$ back into $|y|$ and leaves $y$ on its own.'
        exemplars:
          - problem: 'Solve $\frac{dy}{dx} = \frac{3y}{x}$ for $x > 0$ with $y(1) = 5$.'
            answer: '5x^3'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $\frac{dy}{y} = \frac{3}{x}\,dx$, so $\ln|y| = 3\ln x + C$. Exponentiating gives $y = Kx^3$, and $y(1) = 5$ gives $K = 5$. So $y = 5x^3$.'
          - problem: 'Solve $\frac{dy}{dx} = 4xy$ with $y(0) = 7$.'
            answer: '7e^(2x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $\frac{dy}{y} = 4x\,dx$, so $\ln|y| = 2x^2 + C$. Exponentiating gives $y = Ke^{2x^2}$, and $y(0) = 7$ gives $K = 7$. So $y = 7e^{2x^2}$.'
          - problem: 'Solve $(1 + x^2)\,y'' = xy$ with $y(0) = 3$.'
            answer: '3sqrt(1 + x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $\frac{dy}{y} = \frac{x}{1 + x^2}\,dx$, so $\ln|y| = \frac{1}{2}\ln(1 + x^2) + C$. Exponentiating gives $y = K\sqrt{1 + x^2}$, and $y(0) = 3$ gives $K = 3$.'
          - problem: 'Solve $\frac{dy}{dx} = \frac{2y}{x + 1}$ for $x > -1$ with $y(0) = 9$.'
            answer: '9(x + 1)^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $\frac{dy}{y} = \frac{2}{x + 1}\,dx$, so $\ln|y| = 2\ln(x + 1) + C$. Exponentiating gives $y = K(x + 1)^2$, and $y(0) = 9$ gives $K = 9$.'
          - problem: 'A radioactive sample decays at a rate proportional to its mass: $\frac{dm}{dt} = -0.2m$, where $m$ is in grams and $t$ is in days. The initial mass is $50$ g. Find $m(t)$.'
            answer: '50e^(-0.2t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Separate: $\frac{dm}{m} = -0.2\,dt$, so $\ln m = -0.2t + C$. Exponentiating gives $m = Ke^{-0.2t}$, and $m(0) = 50$ gives $K = 50$. So $m = 50e^{-0.2t}$.'
          - problem: 'A population satisfies $\frac{dP}{dt} = 0.03P$ with $P(0) = 500$, where $t$ is in years. After how many years, to one decimal place, does it reach $1000$?'
            answer: '23.1'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'The solution is $P = 500e^{0.03t}$. Setting $500e^{0.03t} = 1000$ gives $e^{0.03t} = 2$, so $t = \frac{\ln 2}{0.03} \approx 23.1$ years.'
          - problem: 'Solve $\frac{dy}{dx} = \frac{y}{2x + 1}$ for $x > -\frac{1}{2}$ with $y(0) = 8$.'
            answer: '8sqrt(2x + 1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $\frac{dy}{y} = \frac{dx}{2x + 1}$, so $\ln|y| = \frac{1}{2}\ln(2x + 1) + C$. Exponentiating gives $y = K\sqrt{2x + 1}$, and $y(0) = 8$ gives $K = 8$.'
          - problem: 'Dana integrates $\frac{dy}{y} = \frac{2}{x}\,dx$ and writes $y = 2x + C$. What is the correct solution of $\frac{dy}{dx} = \frac{2y}{x}$ for $x > 0$ with $y(1) = 4$?'
            answer: '4x^2'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Integrating gives $\ln|y| = 2\ln x + C$, and Dana forgot to exponentiate. Exponentiating gives $y = Kx^2$, and $y(1) = 4$ gives $K = 4$. So $y = 4x^2$.'
          - problem: 'The amount $D$ of a drug in the body falls at a rate proportional to the amount: $\frac{dD}{dt} = -0.1D$, where $D$ is in mg and $t$ is in hours. The initial amount is $80$ mg. After how many hours, to one decimal place, does $10$ mg remain?'
            answer: '20.8'
            answer_contract: {"kind":"approx","decimals":1}
            solution_sketch: 'The solution is $D = 80e^{-0.1t}$. Setting $80e^{-0.1t} = 10$ gives $e^{-0.1t} = \frac{1}{8}$, so $t = \frac{\ln 8}{0.1} \approx 20.8$ hours.'
        constraints: 'integrations produce logarithms; the solution requires exponentiating and renaming e^C as a constant; the initial value fixes it'
    diagnostic_exemplar:
      problem: "Find the general solution of $y' = -2xy$."
      answer: "$y = Ce^{-x^2}$"
      answer_contract: {kind: none}
      solution_sketch: '$\frac{dy}{y} = -2x\,dx$ gives $\ln|y| = -x^2 + C$; exponentiate and rename the constant.'
    anki_seeds:
      - front: "A first-order ODE is separable when it can be written as..."
        back: "dy/dx = g(x)h(y): all y-dependence on one side, all x-dependence on the other."
        type: basic
      - front: 'After integrating $\frac{dy}{y} = k\,dx$, the general solution is...'
        back: '$y = Ce^{kx}$ (exponentiate $\ln|y| = kx + C$ and rename the constant).'
        type: basic

  - id: separable-equations
    name: Separable Equations
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: separation-of-variables
        weight: 0.7
        key: true
      - id: integration-substitution
        weight: 0.3
        key: false
      - id: definite-integrals-ftc
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: 'Initial value problems'
        key_prerequisites: [separation-of-variables, integration-substitution]
        step_check:
          step: 'apply the initial condition $y(0) = 2$'
          question: 'Why does the initial condition determine the constant?'
          options:
            - 'The initial condition picks the right equation from a list of equations'
            - 'The general solution has one free constant, and one point fixes it'
            - 'The initial condition replaces the integration step, so $C$ is never needed'
            - 'The constant is always the same number as the initial value of $y$'
          answer: 'The general solution has one free constant, and one point fixes it'
          why: 'Each value of the constant gives a different curve, and exactly one of them passes through the point $(0, 2)$.'
        exemplars:
          - problem: 'Solve $y'' = 2xy$ with $y(0) = 3$.'
            answer: '3e^(x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $\frac{dy}{y} = 2x\,dx$, so $\ln|y| = x^2 + C$ and $y = Ke^{x^2}$. The condition $y(0) = 3$ gives $K = 3$, so $y = 3e^{x^2}$.'
          - problem: 'Solve $\frac{dy}{dx} = \frac{\cos x}{y}$ with $y(0) = 1$.'
            answer: 'sqrt(2sin(x) + 1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $y\,dy = \cos x\,dx$, so $\frac{y^2}{2} = \sin x + C$. The condition $y(0) = 1$ gives $C = \frac{1}{2}$, so $y^2 = 2\sin x + 1$. Since $y(0) > 0$, take the positive root.'
          - problem: 'Solve $y'' = e^{x - y}$ with $y(0) = 0$.'
            answer: 'x'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Write $e^{x - y} = e^x e^{-y}$ and separate: $e^y\,dy = e^x\,dx$. Integrating gives $e^y = e^x + C$, and $y(0) = 0$ gives $C = 0$. So $e^y = e^x$ and $y = x$.'
          - problem: 'A pot of tea at $90\,^\circ$C is placed in a room at $20\,^\circ$C. Its temperature $T$ (in $^\circ$C) satisfies $\frac{dT}{dt} = -0.1(T - 20)$, where $t$ is in minutes. Find $T(t)$.'
            answer: '20 + 70e^(-0.1t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Separate: $\frac{dT}{T - 20} = -0.1\,dt$, so $T - 20 = Ke^{-0.1t}$. The condition $T(0) = 90$ gives $K = 70$, so $T = 20 + 70e^{-0.1t}$.'
          - problem: 'A tank holds $500$ L of pure water. Brine with $0.2$ kg of salt per litre flows in at $5$ L/min, and the well-mixed solution flows out at $5$ L/min. Find the mass $S(t)$ of salt in kg after $t$ minutes.'
            answer: '100 - 100e^(-t/100)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'Salt enters at $0.2 \cdot 5 = 1$ kg/min and leaves at $\frac{S}{500} \cdot 5 = \frac{S}{100}$ kg/min, so $\frac{dS}{dt} = 1 - \frac{S}{100}$. Separating and using $S(0) = 0$ gives $S = 100 - 100e^{-t/100}$.'
          - problem: 'Ravi solves $\frac{dy}{dx} = 6x^2y$ with $y(0) = 5$ and writes $y = e^{2x^3} + 5$. What is the correct solution?'
            answer: '5e^(2x^3)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separating gives $\ln|y| = 2x^3 + C$, so $y = Ke^{2x^3}$. The initial value multiplies the exponential and is not added to it. The condition $y(0) = 5$ gives $K = 5$.'
          - problem: 'Solve $y'' = y\sin x$ with $y(0) = 2$.'
            answer: '2e^(1 - cos(x))'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $\frac{dy}{y} = \sin x\,dx$, so $\ln|y| = -\cos x + C$ and $y = Ke^{-\cos x}$. The condition $y(0) = 2$ gives $Ke^{-1} = 2$, so $K = 2e$ and $y = 2e^{1 - \cos x}$.'
        constraints: 'initial condition pins one constant; contexts (cooling, mixing) state every number and the learner sets up the equation; answers exact'
      - id: kp2
        name: 'Implicit solutions and branch selection'
        key_prerequisites: [separation-of-variables]
        step_check:
          step: 'Since $y(1) = 2$ is positive, take the positive branch'
          question: 'Why is the positive square root the right branch here?'
          options:
            - 'Square roots are always taken as positive in a differential equation'
            - 'The negative root does not satisfy the equation $y^2 = x^3 + 3$'
            - 'The initial value $2$ is a square, so only $+\sqrt{\ }$ is possible'
            - 'A solution cannot cross $y = 0$, where $y''$ is undefined'
          answer: 'A solution cannot cross $y = 0$, where $y''$ is undefined'
          why: 'The equation $y'' = \frac{3x^2}{2y}$ has no meaning at $y = 0$, so a solution stays on the branch where it starts.'
        exemplars:
          - problem: 'Solve $y'' = \frac{2x + 1}{2y}$ with $y(0) = -1$.'
            answer: '-sqrt(x^2 + x + 1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $2y\,dy = (2x + 1)\,dx$, so $y^2 = x^2 + x + C$. The condition $y(0) = -1$ gives $C = 1$. Since $y(0) < 0$, take the negative root: $y = -\sqrt{x^2 + x + 1}$.'
          - problem: 'The height $y$ (in metres) of the top of a sliding ladder satisfies $\frac{dy}{dx} = -\frac{x}{y}$, where $x$ is the distance of the foot from the wall. The ladder starts upright, with $y(0) = 5$. Find $y$ as a function of $x$.'
            answer: 'sqrt(25 - x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $y\,dy = -x\,dx$, so $y^2 = -x^2 + C$. The condition $y(0) = 5$ gives $C = 25$. The top of the ladder stays above the floor, so $y = \sqrt{25 - x^2}$.'
          - problem: 'Sam solves $y\,y'' = x$ with $y(1) = -2$ and gets $y = \sqrt{x^2 + 3}$. What is the correct solution?'
            answer: '-sqrt(x^2 + 3)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separating gives $y\,dy = x\,dx$, so $y^2 = x^2 + C$, and $y(1) = -2$ gives $C = 3$. Sam took the positive root, but $y(1) = -2$ is negative, so $y = -\sqrt{x^2 + 3}$.'
          - problem: 'A car brakes so that its speed $v$ (in m/s) and the distance $x$ (in m) travelled since braking began satisfy $v\frac{dv}{dx} = -2$. The initial speed is $v(0) = 10$. Find $v$ as a function of $x$.'
            answer: 'sqrt(100 - 4x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $v\,dv = -2\,dx$, so $\frac{v^2}{2} = -2x + C$. The condition $v(0) = 10$ gives $C = 50$, so $v^2 = 100 - 4x$. The car moves forward, so $v = \sqrt{100 - 4x}$.'
          - problem: 'A car brakes so that its speed $v$ (in m/s) and the distance $x$ (in m) travelled since braking began satisfy $v\frac{dv}{dx} = -2$. The initial speed is $v(0) = 10$. How far does the car travel before it stops?'
            answer: '25'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Integrating $v\,dv = -2\,dx$ gives $v^2 = 100 - 4x$. The car stops when $v = 0$, so $100 - 4x = 0$. Dividing $100$ by $4$ gives $x = 25$ m.'
          - problem: 'Solve $y'' = \frac{e^x}{y}$ with $y(0) = 1$.'
            answer: 'sqrt(2e^x - 1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $y\,dy = e^x\,dx$, so $\frac{y^2}{2} = e^x + C$. The condition $y(0) = 1$ gives $C = -\frac{1}{2}$, so $y^2 = 2e^x - 1$. Since $y(0) > 0$, $y = \sqrt{2e^x - 1}$.'
          - problem: 'Solve $y'' = \frac{x^2}{y}$ with $y(0) = -1$.'
            answer: '-sqrt(2x^3/3 + 1)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $y\,dy = x^2\,dx$, so $\frac{y^2}{2} = \frac{x^3}{3} + C$. The condition $y(0) = -1$ gives $C = \frac{1}{2}$, so $y^2 = \frac{2x^3}{3} + 1$. Since $y(0) < 0$, $y = -\sqrt{\frac{2x^3}{3} + 1}$.'
          - problem: 'Solve $y'' = \frac{2x + 3}{2y}$ with $y(0) = 2$.'
            answer: 'sqrt(x^2 + 3x + 4)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'Separate: $2y\,dy = (2x + 3)\,dx$, so $y^2 = x^2 + 3x + C$. The condition $y(0) = 2$ gives $C = 4$. Since $y(0) > 0$, $y = \sqrt{x^2 + 3x + 4}$.'
          - problem: 'Solve $y'' = -\frac{x}{y}$ with $y(0) = 3$. Find the equation relating $x$ and $y$ that the solution satisfies.'
            answer: 'x^2 + y^2 = 9'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Separate: $y\,dy = -x\,dx$, so $\frac{y^2}{2} = -\frac{x^2}{2} + C$ and $x^2 + y^2 = K$. The condition $y(0) = 3$ gives $K = 9$, so $x^2 + y^2 = 9$, a circle of radius $3$.'
          - problem: 'Solve $y'' = \frac{3x^2}{2y}$ with $y(1) = 2$. Find the equation relating $x$ and $y$ that the solution satisfies.'
            answer: 'y^2 = x^3 + 3'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Separate: $2y\,dy = 3x^2\,dx$, so $y^2 = x^3 + C$. The condition $y(1) = 2$ gives $4 = 1 + C$, so $C = 3$ and $y^2 = x^3 + 3$.'
        constraints: 'the solution is found explicitly or as an equation in x and y; the sign of the initial value picks the branch of the square root; contexts have a physical reason for the branch'
      - id: kp3
        name: 'Constant solutions and intervals of validity'
        key_prerequisites: [separation-of-variables]
        step_check:
          step: 'Set $h(y) = y^2 - 9 = 0$'
          question: 'Why does setting $h(y) = 0$ give the constant solutions?'
          options:
            - 'A constant solution has $y'' = 0$, so $h(y)$ must be $0$'
            - 'Setting $h(y) = 0$ separates the variables so that we can integrate'
            - 'The zeros of $h$ are the points where the solution blows up'
            - 'Only the positive zeros of $h$ can be solutions of the equation'
          answer: 'A constant solution has $y'' = 0$, so $h(y)$ must be $0$'
          why: 'If $y = c$ for all $x$, then $y'' = 0$, so the equation forces $h(c) = 0$ and $y = c$ solves it exactly when $h(c) = 0$.'
        try_first:
          problem: 'The solution of $y'' = y^2$ with $y(0) = \frac{1}{3}$ is $y = \frac{1}{3 - x}$. At which value of $x$ does the formula stop being defined?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'The denominator $3 - x$ is zero at $x = 3$, so the solution becomes infinite there. A solution is only valid on an interval that avoids such a point, and that interval is the interval of validity.'
        exemplars:
          - problem: 'Find all constant solutions of $y'' = y^2 - 9$.'
            answer: '-3, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A constant solution has $y'' = 0$, so we need $y^2 - 9 = 0$. Factoring gives $(y - 3)(y + 3) = 0$, so the constant solutions are $y = 3$ and $y = -3$.'
          - problem: 'For which values of $x$ is the solution of $y'' = y^2$ with $y(0) = \frac{1}{2}$ valid?'
            answer: 'x < 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Separating gives $-\frac{1}{y} = x + C$, and $y(0) = \frac{1}{2}$ gives $C = -2$, so $y = \frac{1}{2 - x}$. The formula is defined and continuous through $x = 0$ only for $x < 2$.'
          - problem: 'To solve $y'' = y^2 - 4$, Sam divides both sides by $y^2 - 4$. Which constant solutions does this step lose?'
            answer: '-2, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing by $y^2 - 4$ is not allowed when $y^2 - 4 = 0$. That happens at $y = 2$ and $y = -2$, and both are constant solutions of the equation.'
          - problem: 'The solution of $y'' = y^2$ with $y(0) = \frac{1}{4}$ becomes infinite at one value of $x$. Find it.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Separating gives $-\frac{1}{y} = x + C$, and $y(0) = \frac{1}{4}$ gives $C = -4$, so $y = \frac{1}{4 - x}$. The denominator is zero at $x = 4$.'
          - problem: 'For which values of $x$ is the solution of $y'' = e^y$ with $y(0) = 0$ valid?'
            answer: 'x < 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Separate: $e^{-y}\,dy = dx$, so $-e^{-y} = x + C$, and $y(0) = 0$ gives $C = -1$. Then $e^{-y} = 1 - x$ and $y = -\ln(1 - x)$, which is defined only for $x < 1$.'
          - problem: 'A population $P$ (in thousands) is modelled by $\frac{dP}{dt} = 0.001P^2$ with $P(0) = 100$, where $t$ is in years. After how many years does the model predict an infinite population?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"time","unit":"year","allow_omitted":true}
            solution_sketch: 'Separating gives $-\frac{1}{P} = 0.001t + C$, and $P(0) = 100$ gives $C = -0.01$. So $P = \frac{1}{0.01 - 0.001t}$, whose denominator is zero when $t = 10$ years.'
          - problem: 'The depth $h$ (in metres) of water in a tank satisfies $\frac{dh}{dt} = -0.3\sqrt{h}$ with $h(0) = 9$, where $t$ is in hours. At what time does the model stop being valid because the tank is empty?'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'Separating gives $2\sqrt{h} = -0.3t + C$, and $h(0) = 9$ gives $C = 6$. Then $\sqrt{h} = 3 - 0.15t$, which is zero when $t = 3 / 0.15 = 20$ hours.'
          - problem: 'Is the solution of $y'' = y^2$ with $y(0) = 1$ defined for every real value of $x$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is defined for every x","defined for every x","it exists for all x","for all x"],["no","it is not defined for every x","not for every x","it blows up","it is not defined everywhere","not for all x"]]}
            solution_sketch: 'Separating gives $-\frac{1}{y} = x + C$, and $y(0) = 1$ gives $C = -1$, so $y = \frac{1}{1 - x}$. The formula is not defined at $x = 1$, so the answer is no.'
        constraints: 'constant solutions are integer zeros of h(y); intervals of validity are bounded by blow-up points or by where the branch formula degenerates; contexts ask for a blow-up time or an emptying time'
    diagnostic_exemplar:
      problem: 'Solve $y'' = -\dfrac{x}{y}$ with $y(0) = -3$, and state the interval of validity.'
      answer: '$y = -\sqrt{9 - x^2}$ on $(-3, 3)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Separating gives $y\,dy = -x\,dx$, so $y^2 = 9 - x^2$. The initial value $y(0) = -3$ selects the negative branch, and the square root is real (and $y \neq 0$) only for $|x| < 3$.'
    anki_seeds:
      - front: "When you divide a separable equation by h(y), you may lose..."
        back: "the constant solutions y = c where h(c) = 0 — check for them separately."
        type: basic
      - front: "After solving y^2 = F(x) + C in an IVP, the branch (sign of the root) is chosen by..."
        back: "the sign of the initial value y(x0)."
        type: basic

  - id: integrating-factor-computation
    name: Computing Integrating Factors
    core: true
    difficulty: 0.63
