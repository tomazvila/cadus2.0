      problem: "Solve $y\\,dx + 3x\\,dy = 0$ by finding an integrating factor."
      answer: "$xy^3 = C$"
      answer_contract: {kind: none}
      solution_sketch: "$\\mu = y^2$ makes the equation $y^3\\,dx + 3xy^2\\,dy = d(xy^3) = 0$."
    anki_seeds:
      - front: "When does M dx + N dy = 0 admit an integrating factor mu(x)?"
        back: 'When $(M_y - N_x)/N$ is a function of $x$ alone; then $\mu = e^{\int (M_y - N_x)/N\,dx}$.'
        type: basic
      - front: "When does M dx + N dy = 0 admit an integrating factor mu(y)?"
        back: 'When $(N_x - M_y)/M$ is a function of $y$ alone; then $\mu = e^{\int (N_x - M_y)/M\,dy}$.'
        type: basic

  - id: natural-growth-decay-models
    name: Exponential Growth and Decay Models
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: separable-equations
        weight: 0.6
        key: true
      - id: exponential-growth-decay
        weight: 0.4
        key: false
      - id: continuous-growth-model
        # Phase C (C-D): the P_0 e^{kt} model this topic derives and manipulates is now
        # taught in foundations; exponential-growth-decay covers only discrete bases.
        weight: 0.4
        key: false
      - id: logarithm-properties
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Setting up and solving $P' = kP$"
        key_prerequisites: [separable-equations, exponential-growth-decay]
        exemplars:
          - problem: "A population obeys $P' = kP$ and doubles every $10$ hours. Find $k$ exactly."
            answer: '$k = \dfrac{\ln 2}{10}$ per hour'
            answer_contract: {kind: none}
            solution_sketch: '$P = P_0 e^{kt}$ and $P(10) = 2P_0$ give $e^{10k} = 2$, so $k = \frac{\ln 2}{10}$.'
          - problem: "A radioactive isotope has half-life $5730$ years. Find its decay constant $k$ in $N' = -kN$."
            answer: '$k = \dfrac{\ln 2}{5730}$ per year'
            answer_contract: {kind: none}
            solution_sketch: '$N = N_0 e^{-kt}$ with $N(5730) = N_0/2$ gives $e^{-5730k} = \frac{1}{2}$.'
          - problem: "Solve $P' = 0.02P$ with $P(0) = 500$."
            answer: "$P(t) = 500e^{0.02t}$"
            answer_contract: {kind: none}
            solution_sketch: "$P(t) = 500e^{0.02t}$"
        constraints: "doubling times and half-lives are clean integers; express rate constants exactly with ln"
      - id: kp2
        name: Time-to-reach questions
        key_prerequisites: [logarithm-properties]
        exemplars:
          - problem: "A radioactive substance decays exponentially with a half-life of 8 days. Find the time in days until only 25% of the substance remains."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The remaining fraction is 25% = 1/4. Since 1/4 = (1/2)^2, the time is two half-lives. Two half-lives of 8 days each give 16 days. The answer is 16."
          - problem: "A bacteria culture doubles every 3 hours and starts with 100 cells. Find the time in hours for the culture to reach 800 cells."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The ratio of final to initial cells is 800/100 = 8. Since 8 = 2^3, the time is three doubling periods. Three periods of 3 hours each give 9 hours. The answer is 9."
          - problem: "Solve for the time at which $P(t) = 200e^{0.05t}$ reaches $1000$."
            answer: "$t = 20\\ln 5$"
            solution_sketch: "$e^{0.05t} = 5$ gives $0.05t = \\ln 5$."
          - problem: "A population grows exponentially and doubles every 12 years. The initial population is 500. Find the time in years for the population to reach 4000."
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The ratio of final to initial population is 4000/500 = 8. Since 8 = 2^3, the time is three doubling periods. Three periods of 12 years each give 36 years. The answer is 36."
          - problem: "An investment grows exponentially and doubles every 7 years. Find the time in years for the investment to become 4 times its original value."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The final value is 4 times the original value, so the ratio is 4. Since 4 = 2^2, the time is two doubling periods. Two periods of 7 years each give 14 years. The answer is 14."
          - problem: "A radioactive isotope decays exponentially with a half-life of 5 hours. Find the time in hours until only 1/8 of the isotope remains."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The remaining fraction is 1/8. Since 1/8 = (1/2)^3, the time is three half-lives. Three half-lives of 5 hours each give 15 hours. The answer is 15."
        constraints: "target ratios are powers of 2 (clean) or give single-log exact answers"
      - id: kp3
        name: "Determining $k$ and $P_0$ from data"
        key_prerequisites: [logarithm-properties, separable-equations]
        exemplars:
          - problem: "A population satisfies $P' = kP$ with $P(2) = 300$ and $P(5) = 2400$. Find $k$ and $P(0)$ exactly."
            answer: "$k = \\ln 2$; $P(0) = 75$."
            answer_contract: {kind: none}
            solution_sketch: "$\\dfrac{P(5)}{P(2)} = e^{3k} = 8$ gives $k = \\ln 2$; then $P(0) = 300e^{-2\\ln 2} = 300/4 = 75$."
          - problem: "A sample decays from $800$ g to $100$ g in $6$ hours. Find its half-life."
            answer: "$2$ hours"
            answer_contract: {kind: none}
            solution_sketch: "$100/800 = (1/2)^3$: three half-lives in $6$ hours."
        constraints: "data ratios are powers of 2 so k and the half-life come out as clean multiples of ln 2"
    diagnostic_exemplar:
      problem: 'A population satisfies $P'' = kP$ with $P(2) = 500$ and $P(6) = 8000$. Find $k$ and $P(0)$ exactly.'
      answer: '$k = \ln 2$; $P(0) = 125$.'
      answer_contract: {kind: none}
      solution_sketch: '$\frac{P(6)}{P(2)} = e^{4k} = 16$, so $k = \frac{\ln 16}{4} = \ln 2$. Then $P(0) = P(2)e^{-2k} = \frac{500}{4} = 125$.'
    anki_seeds:
      - front: "Solution of the natural growth equation P' = kP?"
        back: "$P(t) = P_0 e^{kt}$"
        type: basic
      - front: "Relation between the decay constant k and the half-life T?"
        back: '$k = \dfrac{\ln 2}{T}$'
        type: basic

  - id: newtons-law-of-cooling
    name: "Newton's Law of Cooling"
    core: false                # application genre; feeds only the applications capstone
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: natural-growth-decay-models
        weight: 0.6
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Setting up and the general solution
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: "A body cools in a $20^{\\circ}$C room. Write the cooling ODE and its general solution."
            answer: "$T' = -k(T - 20)$; $T = 20 + Ce^{-kt}$."
            answer_contract: {kind: none}
            solution_sketch: "The shifted variable $u = T - 20$ satisfies $u' = -ku$."
          - problem: "A cup of coffee at $90^{\\circ}$C sits in a $25^{\\circ}$C room. Write $T(t)$ with $k$ undetermined."
            answer: "$T = 25 + 65e^{-kt}$"
            solution_sketch: "$C = T(0) - 25 = 65$."
          - problem: "For $T = 15 + 40e^{-2t}$, identify the ambient temperature and the initial temperature."
            answer: "Ambient $15^{\\circ}$; $T(0) = 55^{\\circ}$."
            answer_contract: {kind: none}
            solution_sketch: "Ambient $15^{\\circ}$; $T(0) = 55^{\\circ}$."
        constraints: "ambient temperatures and initial temperatures are integers; solution always in the form A + Ce^{-kt}"
      - id: kp2
        name: "Finding $k$ from data"
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: "A body cools by Newton's law T' = -k(T - 20) in a 20 degrees C room. Its initial temperature is 100 C and after 10 minutes it is 60 C. Find the constant k. Give the answer to 4 decimals."
            answer: "0.0693"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Newton's law gives the full object T = 20 + 80e^(-kt). At t = 10, 60 = 20 + 80e^(-10k), so e^(-10k) = 40/80 = 1/2. Take natural logs: -10k = -ln(2), so k = ln(2)/10. The value to 4 decimals is 0.0693."
          - problem: "A cold drink at $5^{\\circ}$C warms in a $25^{\\circ}$C room, reaching $15^{\\circ}$C after $4$ minutes. Find $T(t)$."
            answer: '$T = 25 - 20e^{-(\ln 2/4)\,t}$'
            solution_sketch: "$T = 25 - 20e^{-kt}$; $T(4) = 15$ gives $e^{-4k} = \\dfrac{10}{20} = \\dfrac{1}{2}$, so $k = \\dfrac{\\ln 2}{4}$."
          - problem: "A metal bar cools in a 15 degrees C room. Its initial temperature is 95 C and after 6 minutes it is 55 C. Find the cooling constant k. Give the answer to 4 decimals."
            answer: "0.1155"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Newton's law gives the full object T = 15 + 80e^(-kt). At t = 6, 55 = 15 + 80e^(-6k), so e^(-6k) = 40/80 = 1/2. Take natural logs: -6k = -ln(2), so k = ln(2)/6. The value to 4 decimals is 0.1155."
          - problem: "A cold drink at 5 C warms in a 25 C room. After 4 minutes its temperature is 15 C. Find the warming constant k. Give the answer to 4 decimals."
            answer: "0.1733"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Newton's law gives the full object T = 25 - 20e^(-kt), so the coefficient C is negative for warming. At t = 4, 15 = 25 - 20e^(-4k), so e^(-4k) = 10/20 = 1/2. Take natural logs: -4k = -ln(2), so k = ln(2)/4. The value to 4 decimals is 0.1733."
          - problem: "A pie cools in a 30 C room. Its temperature is 90 C at the start and 60 C after 20 minutes. Find the cooling constant k. Give the answer to 4 decimals."
            answer: "0.0347"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Newton's law gives the full object T = 30 + 60e^(-kt). At t = 20, 60 = 30 + 60e^(-20k), so e^(-20k) = 30/60 = 1/2. Take natural logs: -20k = -ln(2), so k = ln(2)/20. The value to 4 decimals is 0.0347."
          - problem: "A metal block at 10 C warms in a 30 C room. After 8 minutes its temperature is 20 C. Find the warming constant k. Give the answer to 4 decimals."
            answer: "0.0866"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Newton's law gives the full object T = 30 - 20e^(-kt), so the coefficient C is negative for warming. At t = 8, 20 = 30 - 20e^(-8k), so e^(-8k) = 10/20 = 1/2. Take natural logs: -8k = -ln(2), so k = ln(2)/8. The value to 4 decimals is 0.0866."
        constraints: "the measured gap ratio is a power of 1/2 so k is a clean multiple of ln 2; warming problems flip the sign of C"
      - id: kp3
        name: Time questions
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: "A body in a room at 20 C has temperature T(t) = 20 + 80 e^(-(ln(2)/10)t), where t is in minutes. Find the time when the body reaches 30 C. Give the time in minutes."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full Newton's law of cooling model is T(t) = 20 + 80 e^(-(ln(2)/10)t). Set the target and subtract the room temperature: 20 + 80 e^(-(ln(2)/10)t) = 30, so the gap to the room is 80 e^(-(ln(2)/10)t) = 10. The gap rule says the gap starts at 80 and halves every 10 minutes. Since 80 / 2^3 = 10, three halvings are needed. Three halvings take 3 * 10 = 30 minutes. The answer is 30."
          - problem: "A drink in a room at 25 C has temperature T(t) = 25 - 20 e^(-(ln(2)/4)t), where t is in minutes. Find the time when the drink reaches 20 C. Give the time in minutes."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full Newton's law of cooling model is T(t) = 25 - 20 e^(-(ln(2)/4)t). Set the target: 25 - 20 e^(-(ln(2)/4)t) = 20, so the gap to the room is 20 e^(-(ln(2)/4)t) = 5. The gap rule says the gap starts at 20 and halves every 4 minutes. Since 20 / 2^2 = 5, two halvings are needed. Two halvings take 2 * 4 = 8 minutes. The answer is 8."
          - problem: "A metal bar at 210 C is placed in a room at 10 C. The difference between the bar temperature and the room temperature halves every 6 minutes. Find the time when the bar reaches 60 C. Give the time in minutes."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full Newton's law of cooling gap model is G(t) = 200 e^(-(ln(2)/6)t). The initial gap is 210 - 10 = 200, and the target gap is 60 - 10 = 50. Set G(t) = 50: 200 e^(-(ln(2)/6)t) = 50. The gap rule gives 200 / 2^2 = 50, so two halvings are needed. Each halving takes 6 minutes, so t = 2 * 6 = 12 minutes. The answer is 12."
          - problem: "A cup of coffee at 90 C sits in a room at 20 C. The difference between the coffee temperature and the room temperature halves every 3 minutes. Find the time when the coffee reaches 55 C. Give the time in minutes."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full Newton's law of cooling gap model is G(t) = 70 e^(-(ln(2)/3)t). The initial gap is 90 - 20 = 70, and the target gap is 55 - 20 = 35. Set G(t) = 35: 70 e^(-(ln(2)/3)t) = 35. The gap rule gives 70 / 2^1 = 35, so one halving is needed. One halving takes 3 minutes, so t = 3 minutes. The answer is 3."
          - problem: "A thermometer at 5 C is brought into a room at 25 C. The difference between the room temperature and the thermometer temperature halves every 8 minutes. Find the time when the thermometer reads 20 C. Give the time in minutes."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full Newton's law of cooling gap model is G(t) = 20 e^(-(ln(2)/8)t). The initial gap is 25 - 5 = 20, and the target gap is 25 - 20 = 5. Set G(t) = 5: 20 e^(-(ln(2)/8)t) = 5. The gap rule gives 20 / 2^2 = 5, so two halvings are needed. Each halving takes 8 minutes, so t = 2 * 8 = 16 minutes. The answer is 16."
          - problem: "A cake at 160 C is put in a room at 20 C. The difference between the cake temperature and the room temperature halves every 5 minutes. Find the time when the cake reaches 55 C. Give the time in minutes."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full Newton's law of cooling gap model is G(t) = 140 e^(-(ln(2)/5)t). The initial gap is 160 - 20 = 140, and the target gap is 55 - 20 = 35. Set G(t) = 35: 140 e^(-(ln(2)/5)t) = 35. The gap rule gives 140 / 2^2 = 35, so two halvings are needed. Each halving takes 5 minutes, so t = 2 * 5 = 10 minutes. The answer is 10."
        constraints: "target gaps are the initial gap divided by a power of 2, so times are integer multiples of the halving time"
    diagnostic_exemplar:
      problem: "A body in a $20^{\\circ}$C room cools from $100^{\\circ}$C to $60^{\\circ}$C in $10$ minutes. When does it reach $25^{\\circ}$C?"
      answer: "$40$ minutes"
      answer_contract: {kind: none}
      solution_sketch: "The gap halves every $10$ minutes: $80 \\to 40 \\to 20 \\to 10 \\to 5$ takes four halvings."
    anki_seeds:
      - front: "Newton's law of cooling as an ODE (ambient temperature A)?"
        back: "$T' = -k(T - A)$ with $k > 0$."
        type: basic
      - front: "Solution of T' = -k(T - A) with T(0) = T0?"
        back: "$T = A + (T_0 - A)e^{-kt}$"
        type: basic

  - id: mixing-tank-models
    name: Mixing Tank Models
    core: false                # application genre; feeds only the applications capstone
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: linear-first-order-integrating-factor
        weight: 0.7
        key: true
      - id: natural-growth-decay-models
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Setting up the balance equation
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "A $100$ L tank starts with pure water. Brine at $2$ g/L flows in at $5$ L/min; the well-mixed solution leaves at $5$ L/min. Write the ODE for the salt $A(t)$."
            answer: "$A' = 10 - \\dfrac{A}{20}$, $A(0) = 0$."
            answer_contract: {kind: none}
            solution_sketch: "Rate in $= 2 \\cdot 5 = 10$ g/min; rate out $= 5 \\cdot \\dfrac{A}{100} = \\dfrac{A}{20}$."
          - problem: "A $50$ L tank holds $10$ g of salt. Brine at $1$ g/L flows in at $2$ L/min, and the mixture leaves at $2$ L/min. Write the ODE."
            answer: "$A' = 2 - \\dfrac{A}{25}$, $A(0) = 10$."
            answer_contract: {kind: none}
            solution_sketch: "$A' = 2 - \\dfrac{A}{25}$, $A(0) = 10$."
          - problem: "Pure water flows at $4$ L/min into a $200$ L tank of brine, and the mixture drains at $4$ L/min. Write the ODE for the salt $A(t)$."
            answer: "$A' = -\\dfrac{A}{50}$"
            answer_contract: {kind: none}
            solution_sketch: "Rate in is $0$; rate out is $4 \\cdot \\dfrac{A}{200}$."
        constraints: "constant volume (equal flow rates); rate out = (outflow rate) x A/V; integer concentrations and flows"
      - id: kp2
        name: Solving the model
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "Solve A' = 8 - A/20 with A(0) = 0. Give A(t) as a function of t."
            answer: "160-160e^(-t/20)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Set A' = 0 in the linear first-order equation A' = 8 - A/20 to find the equilibrium A = 160. The general solution form is A = 160 + C e^(-t/20). Use the initial amount A(0) = 0 to get 0 = 160 + C, so C = -160. The solution is A(t) = 160-160e^(-t/20)."
          - problem: "Solve A' = 5 - A/10 with A(0) = 20. Give A(t) as a function of t."
            answer: "50-30e^(-t/10)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Set A' = 0 in the linear first-order equation A' = 5 - A/10 to find the equilibrium A = 50. The general solution form is A = 50 + C e^(-t/10). Use the initial amount A(0) = 20 to get 20 = 50 + C, so C = -30. The solution is A(t) = 50-30e^(-t/10)."
          - problem: "Solve A' = -A/40 with A(0) = 12. Give A(t) as a function of t."
            answer: "12e^(-t/40)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "For the linear first-order equation A' = -A/40, the equilibrium is 0 and the decay constant is 40. The general solution form is A = C e^(-t/40). Use the initial amount A(0) = 12 to get C = 12. The solution is A(t) = 12e^(-t/40)."
          - problem: "A 200 L tank holds water with 30 g of salt. Brine with 0.5 g/L flows in at 4 L/min and the well-mixed solution leaves at 4 L/min. Solve for the amount A(t) of salt in grams. Give A(t) as a function of t."
            answer: "100-70e^(-t/50)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The inflow adds 0.5 times 4 = 2 g/min, and the outflow removes A/200 times 4 = A/50 g/min, so the model is A' = 2 - A/50. Set A' = 0 to get equilibrium A = 100. The linear first-order form gives A = 100 + C e^(-t/50). Use A(0) = 30 to get 30 = 100 + C, so C = -70. The solution is A(t) = 100-70e^(-t/50)."
          - problem: "A 60 L tank holds water with 100 g of salt. Brine with 1 g/L flows in at 4 L/min and the well-mixed solution leaves at 4 L/min. Solve for the amount A(t) of salt in grams. Give A(t) as a function of t."
            answer: "60+40e^(-t/15)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The inflow adds 1 times 4 = 4 g/min, and the outflow removes A/60 times 4 = A/15 g/min, so the model is A' = 4 - A/15. Set A' = 0 to get equilibrium A = 60. The linear first-order form gives A = 60 + C e^(-t/15). Use A(0) = 100 to get 100 = 60 + C, so C = 40. The solution is A(t) = 60+40e^(-t/15)."
          - problem: "A 1000 L tank holds water with 50 g of dye. A solution with 0.2 g/L of dye flows in at 10 L/min and the well-mixed solution leaves at 10 L/min. Solve for the amount A(t) of dye in grams. Give A(t) as a function of t."
            answer: "200-150e^(-t/100)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The inflow adds 0.2 times 10 = 2 g/min, and the outflow removes A/1000 times 10 = A/100 g/min, so the model is A' = 2 - A/100. Set A' = 0 to get equilibrium A = 200. The linear first-order form gives A = 200 + C e^(-t/100). Use A(0) = 50 to get 50 = 200 + C, so C = -150. The solution is A(t) = 200-150e^(-t/100)."
        constraints: "solutions have the shape (limit) + C e^{-t/tau}; C fixed by the initial amount"
      - id: kp3
        name: Long-run behavior and timing
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "For $A(t) = 200(1 - e^{-t/20})$, how much salt does the tank hold in the long run?"
            answer: "$200$ g"
            answer_contract: {kind: none}
            solution_sketch: "Set $A' = 0$ (or note the inflow concentration $2$ g/L times the $100$ L volume)."
          - problem: "For $A(t) = 200(1 - e^{-t/20})$, when does the tank hold $100$ g?"
            answer: "$t = 20\\ln 2$ minutes"
            answer_contract: {kind: none}
            solution_sketch: "$1 - e^{-t/20} = \\tfrac{1}{2}$ gives $e^{-t/20} = \\tfrac{1}{2}$."
          - problem: "What is the long-run concentration in a constant-volume tank fed with brine at $2$ g/L?"
            answer: "$2$ g/L — the inflow concentration."
            answer_contract: {kind: none}
            solution_sketch: "$2$ g/L — the inflow concentration."
        constraints: "long-run amount = inflow concentration x volume; timing answers are clean multiples of tau ln 2"
    diagnostic_exemplar:
      problem: 'A $40$ L tank starts with pure water. Brine containing $3$ g/L flows in at $4$ L/min and the well-mixed solution leaves at $4$ L/min. Find the amount of salt $A(t)$ in the tank, and the time at which it reaches $60$ g.'
      answer: '$A(t) = 120\left(1 - e^{-t/10}\right)$; it reaches $60$ g at $t = 10\ln 2$ minutes.'
      answer_contract: {kind: none}
      solution_sketch: 'Balance: $A'' = 3 \cdot 4 - \frac{A}{40}\cdot 4 = 12 - \frac{A}{10}$ with $A(0) = 0$, whose solution is $A = 120(1 - e^{-t/10})$. Setting $A = 60$ gives $e^{-t/10} = \frac{1}{2}$.'
    anki_seeds:
      - front: "In a constant-volume mixing tank, the rate of salt leaving is..."
        back: "(outflow rate) x A/V: the outflow carries the current concentration."
        type: basic
      - front: "Long-run amount of salt in a constant-volume tank?"
        back: "inflow concentration x tank volume."
        type: basic

