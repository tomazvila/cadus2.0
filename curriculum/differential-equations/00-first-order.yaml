        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Standard form
        key_prerequisites: [separation-of-variables]
        step_check:
          step: 'Divide through by $3$ to make the coefficient of $y''$ equal to $1$'
          question: 'Why must every term be divided by $3$, and not only the term with $y''$?'
          options:
            - 'The coefficient $3$ belongs only to $y''$, so the other terms can stay as they are'
            - 'Dividing every term by $3$ keeps both sides equal, so the equation is unchanged'
            - 'Dividing the right side alone by $3$ is enough, because $Q(x)$ sits there'
          answer: 'Dividing every term by $3$ keeps both sides equal, so the equation is unchanged'
          why: 'Dividing both sides by $3$ gives the same equation in a new form. Every term, including $-6y$ and $9x^2$, is divided, which gives $y'' - 2y = 3x^2$.'
        exemplars:
          - problem: 'Write $xy'' - y = x^2$ for $x>0$ in the form $y'' + P(x)y = Q(x)$. What is $P(x)$?'
            answer: '-1/x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide every term by $x$ to get $y'' - \frac{1}{x}y = x$. The coefficient of $y$ is $-\frac{1}{x}$, so $P(x) = -\frac{1}{x}$.'
          - problem: 'Write $3y'' + 6xy = 12x^2$ in the form $y'' + P(x)y = Q(x)$. What is $Q(x)$?'
            answer: '4x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide every term by $3$ to get $y'' + 2xy = 4x^2$. The right side is $Q(x) = 4x^2$.'
          - problem: 'Rewrite $y'' = 5x^3 - 3xy$ in the form $y'' + P(x)y = Q(x)$. What is $P(x)$?'
            answer: '3x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Move the term $-3xy$ to the left side to get $y'' + 3xy = 5x^3$. The coefficient of $y$ is $3x$, so $P(x) = 3x$.'
          - problem: 'Write $x^2y'' + 3xy = x^4$ for $x>0$ in the form $y'' + P(x)y = Q(x)$. What is $Q(x)$?'
            answer: 'x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide every term by $x^2$ to get $y'' + \frac{3}{x}y = x^2$. The right side is $Q(x) = x^2$.'
          - problem: 'Write $xy'' + 2y = e^x$ for $x>0$ in the form $y'' + P(x)y = Q(x)$. What is $Q(x)$?'
            answer: 'e^x/x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide every term by $x$ to get $y'' + \frac{2}{x}y = \frac{e^x}{x}$. The right side is $Q(x) = \frac{e^x}{x}$.'
          - problem: 'Sam writes $xy'' + 3y = x^2$ for $x>0$ as $y'' + 3y = x^2$. What is the correct $P(x)$?'
            answer: '3/x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Sam divided only the first term by $x$. Every term must be divided, so $y'' + \frac{3}{x}y = x$ and $P(x) = \frac{3}{x}$.'
          - problem: 'A $400$-litre tank is full of brine. Brine with $0.5$ kg of salt per litre flows in at $20$ L/min, and the well-stirred mixture flows out at $20$ L/min. The salt mass $S$ (in kg) after $t$ minutes obeys $S'' = (\text{salt in per minute}) - (\text{salt out per minute})$. Write this equation as $S'' + PS = Q$. What is $P$?'
            answer: '1/20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The mixture holds $\frac{S}{400}$ kg of salt per litre, so $20$ L/min carries away $\frac{20}{400}S = \frac{1}{20}S$ kg/min. Moving this term to the left gives $P = \frac{1}{20}$.'
          - problem: 'Coffee in a room at $20$ degrees Celsius cools at a rate equal to $0.1$ times the difference between its temperature $T$ and the room temperature, with $t$ in minutes. Write the equation as $T'' + PT = Q$. What is $Q$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rate is $T'' = -0.1(T - 20) = -0.1T + 2$. Moving $-0.1T$ to the left gives $T'' + 0.1T = 2$, so $Q = 2$.'
          - problem: 'A circuit has resistance $R = 4$ ohms, capacitance $C = \frac12$ farad and battery voltage $E = 12$ volts. The charge $q$ obeys $Rq'' + \frac{1}{C}q = E$. Write this as $q'' + Pq = Q$. What is $P$?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $\frac{1}{C} = 2$, so the equation is $4q'' + 2q = 12$. Dividing every term by $4$ gives $q'' + \frac{1}{2}q = 3$, so $P = \frac{1}{2}$.'
        constraints: "leading coefficient constant or a power of x; always divide through before reading off P and Q"
      - id: kp2
        name: "Computing $\\mu = e^{\\int P\\,dx}$"
        key_prerequisites: [derivatives-exp-log, logarithm-properties]
        step_check:
          step: 'e^{3 \ln x} = e^{\ln x^3}'
          question: 'Why does $e^{3\ln x}$ equal $e^{\ln x^3}$?'
          options:
            - 'Because the number $3$ cancels against the base $e$ of the power'
            - 'Because $\ln x$ and $x$ are equal whenever $x$ is greater than $0$'
            - 'Because $3\ln x = \ln x^3$, by the power rule for logarithms'
          answer: 'Because $3\ln x = \ln x^3$, by the power rule for logarithms'
          why: 'The power rule moves the coefficient $3$ into the exponent of $x$, so $3\ln x = \ln x^3$. Then $e$ and $\ln$ cancel, which leaves $x^3$.'
        exemplars:
          - problem: 'Find the integrating factor $\mu = e^{\int P\,dx}$ for $y'' + 4y = e^x$.'
            answer: 'e^(4x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $P(x) = 4$, so $\int P\,dx = 4x$. The integrating factor is $\mu = e^{4x}$.'
          - problem: 'Find the integrating factor $\mu = e^{\int P\,dx}$ for $y'' + \frac{3}{x}y = x$ on $x>0$.'
            answer: 'x^3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $\int \frac{3}{x}\,dx = 3\ln x$. So $\mu = e^{3\ln x} = e^{\ln x^3} = x^3$.'
          - problem: 'Find the integrating factor $\mu = e^{\int P\,dx}$ for $y'' + (\cos x)\,y = \cos x$.'
            answer: 'e^(sin(x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $P(x) = \cos x$, and $\int \cos x\,dx = \sin x$. So the integrating factor is $\mu = e^{\sin x}$.'
          - problem: 'Find the integrating factor $\mu = e^{\int P\,dx}$ for $y'' - 4y = x$.'
            answer: 'e^(-4x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $P(x) = -4$, so $\int P\,dx = -4x$. The integrating factor is $\mu = e^{-4x}$.'
          - problem: 'Find the integrating factor $\mu = e^{\int P\,dx}$ for $4y'' + y = 8$.'
            answer: 'e^(x/4)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide every term by $4$ to get $y'' + \frac{1}{4}y = 2$. Then $P = \frac{1}{4}$, $\int P\,dx = \frac{x}{4}$ and $\mu = e^{x/4}$.'
          - problem: 'Find the integrating factor $\mu = e^{\int P\,dx}$ for $xy'' + 4y = x^3$ on $x>0$.'
            answer: 'x^4'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide every term by $x$ to get $y'' + \frac{4}{x}y = x^2$. Then $\int \frac{4}{x}\,dx = 4\ln x$, so $\mu = x^4$.'
          - problem: 'Sam finds the integrating factor of $y'' + 2xy = x$ as $e^{2x}$. What is the correct integrating factor?'
            answer: 'e^(x^2)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Sam did not integrate $P(x) = 2x$: the integral is $x^2$, not $2x$. So the correct integrating factor is $\mu = e^{x^2}$.'
          - problem: 'The salt mass $S$ (in kg) in a tank after $t$ minutes obeys $S'' = 3 - \frac{S}{50}$. Find the integrating factor $\mu = e^{\int P\,dt}$ for this equation.'
            answer: 'e^(t/50)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Move $\frac{S}{50}$ to the left side to get $S'' + \frac{1}{50}S = 3$. Then $P = \frac{1}{50}$ and $\mu = e^{t/50}$.'
          - problem: 'A mug of tea in a room at $20$ degrees Celsius cools according to $T'' = -0.15\,(T - 20)$, with $t$ in minutes. Find the integrating factor $\mu = e^{\int P\,dt}$ for this equation.'
            answer: 'e^(0.15t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Expanding gives $T'' = -0.15T + 3$, so $T'' + 0.15T = 3$. Then $P = 0.15$ and $\mu = e^{0.15t}$.'
          - problem: 'The charge $q$ in a circuit obeys $0.5\,q'' + 4q = 12$. Find the integrating factor $\mu = e^{\int P\,dt}$ for this equation.'
            answer: 'e^(8t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Divide every term by $0.5$ to get $q'' + 8q = 24$. Then $P = 8$ and $\mu = e^{8t}$.'
        constraints: "P(x) constant, k/x, or an easily integrated function; simplify e^{k ln x} to x^k"
      - id: kp3
        name: Verifying the product-rule collapse
        key_prerequisites: [derivatives-exp-log]
        step_check:
          step: 'Apply the product rule to $(e^{3x}y)''$'
          question: 'Why must the product rule be used to differentiate $e^{3x}y$?'
          options:
            - 'Both $e^{3x}$ and $y$ depend on $x$, so the derivative has two terms'
            - 'Only $e^{3x}$ depends on $x$, so $y$ can be taken out as a constant'
            - 'The product rule is needed because $e^{3x}$ cannot be differentiated alone'
          answer: 'Both $e^{3x}$ and $y$ depend on $x$, so the derivative has two terms'
          why: 'Since $y$ is an unknown function of $x$, the derivative of $e^{3x}y$ is $e^{3x}y'' + 3e^{3x}y$. The second term is the $y$-term of the equation after multiplying by $\mu$.'
        exemplars:
          - problem: 'The product rule gives $(e^{2x}y)'' = e^{2x}y'' + By$. What is $B$?'
            answer: '2e^(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The derivative of $e^{2x}$ is $2e^{2x}$, so $B = 2e^{2x}$. This is $P\mu$ for $P = 2$ and $\mu = e^{2x}$.'
          - problem: 'For $x>0$ the product rule gives $(x^2y)'' = x^2y'' + By$. What is $B$?'
            answer: '2x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The derivative of $x^2$ is $2x$, so $B = 2x$. The term $B y$ comes from differentiating the factor $x^2$.'
          - problem: 'The equation $y'' + 3y = \sin x$ is multiplied by $e^{3x}$. Is the new left side equal to $(e^{3x}y)''$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is equal", "equal", "correct"], ["no", "it is not", "not equal", "wrong", "incorrect"]]}
            solution_sketch: 'The product rule gives $(e^{3x}y)'' = e^{3x}y'' + 3e^{3x}y = e^{3x}(y'' + 3y)$. So the new left side equals $(e^{3x}y)''$: the derivative of $e^{3x}$ is $3e^{3x}$, and $3$ is the coefficient $P$.'
          - problem: 'For $x>0$, the equation $y'' + \frac{4}{x}y = x^3$ is scaled by the factor $x^4$. What is the coefficient of $y$ on the left side now?'
            answer: '4x^3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The coefficient of $y$ in the equation is $\frac{4}{x}$, and multiplying by $x^4$ gives $\frac{4}{x}\cdot x^4 = 4x^3$. This equals the derivative of $x^4$.'
          - problem: 'The equation $y'' - 3y = e^{2x}$ is scaled by the factor $e^{-3x}$. What is the coefficient of $y$ on the left side now?'
            answer: '-3e^(-3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The coefficient of $y$ is $-3$, and multiplying by $e^{-3x}$ gives $-3e^{-3x}$. This equals the derivative of $e^{-3x}$.'
          - problem: 'Sam multiplies $y'' + 2y = x$ by $e^{x}$ and says the left side is now $(e^{x}y)''$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "she is right", "he is right", "right", "correct", "it is"], ["no", "she is not right", "he is not right", "not right", "wrong", "incorrect", "it is not"]]}
            solution_sketch: 'The product rule gives $(e^xy)'' = e^xy'' + e^xy$, but the multiplied left side is $e^xy'' + 2e^xy$. The factor must be $e^{2x}$, because the derivative of $\mu$ must equal $2\mu$.'
          - problem: 'The salt mass in a tank obeys $S'' + \frac{1}{50}S = 3$. Multiplying by $e^{t/50}$ makes the left side $e^{t/50}S'' + BS$. What is $B$?'
            answer: 'e^(t/50)/50'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The coefficient $\frac{1}{50}$ is multiplied by $e^{t/50}$, so $B = \frac{1}{50}e^{t/50}$. This equals the derivative of $e^{t/50}$.'
          - problem: 'The temperature of a cup of tea obeys $T'' + 0.2T = 4$. What is the right side after multiplying the equation by $e^{0.2t}$?'
            answer: '4e^(0.2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Multiplying every term by $e^{0.2t}$ turns the right side $4$ into $4e^{0.2t}$. The left side becomes $(e^{0.2t}T)''$.'
          - problem: 'The equation $y'' + 2y = e^x$ is scaled by the factor $e^{2x}$. What is the right side now?'
            answer: 'e^(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The right side is multiplied like every other term, so $e^{2x}\cdot e^x = e^{3x}$. The left side becomes $(e^{2x}y)''$.'
        constraints: "one product-rule expansion; the point is mu' = P mu"
    diagnostic_exemplar:
      problem: 'Write $xy'' + 3y = x^2$ ($x > 0$) in standard form, find its integrating factor $\mu$, and show that multiplying by $\mu$ turns the left side into $(\mu y)''$.'
      answer: 'Standard form $y'' + \dfrac{3}{x}y = x$, so $\mu = e^{\int 3/x\,dx} = x^3$; and $x^3\left(y'' + \frac{3}{x}y\right) = x^3 y'' + 3x^2 y = (x^3 y)''$.'
      answer_contract: {kind: none}
      solution_sketch: 'Divide by $x$ to reach standard form, integrate $P = 3/x$, then check the product rule.'
    anki_seeds:
      - front: "Integrating factor for y' + P(x)y = Q(x)?"
        back: '$\mu(x) = e^{\int P(x)\,dx}$'
        type: basic
      - front: '$e^{k\ln x}$ simplifies to...'
        back: '$x^k$'
        type: basic

  - id: linear-first-order-integrating-factor
    name: Linear First-Order Equations
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: integrating-factor-computation
        weight: 0.7
        key: true
      - id: integration-by-parts
        weight: 0.5
        key: true
      - id: separable-equations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Solving via the product-rule collapse
        key_prerequisites: [integrating-factor-computation]
        step_check:
          step: 'Recognize the left side as the derivative of $e^{4x}y$'
          question: 'Why is the left side $e^{4x}y'' + 4e^{4x}y$ equal to $(e^{4x}y)''$?'
          options:
            - 'The factor $e^{4x}$ is constant, so it moves outside the derivative of $y$'
            - 'Differentiating $e^{4x}y$ by the product rule gives these two terms'
            - 'Integrating the left side first removes the term $4e^{4x}y$ from it'
          answer: 'Differentiating $e^{4x}y$ by the product rule gives these two terms'
          why: 'The product rule gives $(e^{4x}y)'' = e^{4x}y'' + 4e^{4x}y$, which is the left side. The integrating factor was chosen so that this always happens.'
        exemplars:
          - problem: 'Solve $y'' + 2y = e^x$ with $y(0) = 1$.'
            answer: 'e^x/3 + 2e^(-2x)/3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $\mu = e^{2x}$, so $(e^{2x}y)'' = e^{3x}$ and $e^{2x}y = \frac{e^{3x}}{3} + C$. The condition $y(0) = 1$ gives $\frac13 + C = 1$, so $C = \frac23$ and $y = \frac{e^x}{3} + \frac23 e^{-2x}$.'
          - problem: 'Solve $y'' + \frac{y}{x} = x$ for $x>0$ with $y(1) = 1$.'
            answer: 'x^2/3 + 2/(3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $\mu = x$, so $(xy)'' = x^2$ and $xy = \frac{x^3}{3} + C$. From $y(1) = 1$ we get $C = \frac23$, so $y = \frac{x^2}{3} + \frac{2}{3x}$.'
          - problem: 'Solve $y'' + y = e^{2x}$ with $y(0) = 0$.'
            answer: 'e^(2x)/3 - e^(-x)/3'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $e^{x}$, so $(e^{x}y)'' = e^{3x}$ and $e^{x}y = \frac{e^{3x}}{3} + C$. The condition $y(0) = 0$ gives $C = -\frac13$, so $y = \frac{e^{2x}}{3} - \frac{e^{-x}}{3}$.'
          - problem: 'Solve $y'' - 2y = e^{3x}$ with $y(0) = 0$.'
            answer: 'e^(3x) - e^(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $e^{-2x}$, so $(e^{-2x}y)'' = e^{x}$ and $e^{-2x}y = e^{x} + C$. The condition $y(0) = 0$ gives $C = -1$, so $y = e^{3x} - e^{2x}$.'
          - problem: 'Solve $y'' + \frac{y}{x} = x^2$ for $x>0$ with $y(1) = 0$.'
            answer: 'x^3/4 - 1/(4x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $\mu = x$, so $(xy)'' = x^3$ and $xy = \frac{x^4}{4} + C$. The condition $y(1) = 0$ gives $C = -\frac14$, so $y = \frac{x^3}{4} - \frac{1}{4x}$.'
          - problem: 'Solve $xy'' + 2y = 3x$ for $x>0$ with $y(1) = 3$.'
            answer: 'x + 2/x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide by $x$ to get $y'' + \frac{2}{x}y = 3$, so $\mu = x^2$ and $(x^2y)'' = 3x^2$. Then $x^2y = x^3 + C$, and $y(1) = 3$ gives $C = 2$, so $y = x + \frac{2}{x^2}$.'
          - problem: 'A tank holds $100$ L of pure water. Brine with $0.4$ kg of salt per litre flows in at $5$ L/min, and the well-mixed solution flows out at $5$ L/min. Find the salt mass $S(t)$ in kg after $t$ minutes.'
            answer: '40 - 40e^(-t/20)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Salt enters at $5 \cdot 0.4 = 2$ kg/min and leaves at $\frac{5}{100}S = \frac{S}{20}$ kg/min, so $S'' + \frac{S}{20} = 2$ with $S(0) = 0$. With $\mu = e^{t/20}$ we get $e^{t/20}S = 40e^{t/20} + C$ and $C = -40$, so $S = 40 - 40e^{-t/20}$.'
          - problem: 'A cup of soup at $90$ degrees Celsius stands in a room at $20$ degrees Celsius. Its temperature $T$ after $t$ minutes obeys $T'' = -0.1\,(T - 20)$. Find $T(t)$.'
            answer: '20 + 70e^(-0.1t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Rewrite the law as $T'' + 0.1T = 2$. Then $\mu = e^{0.1t}$ gives $e^{0.1t}T = 20e^{0.1t} + C$, and $T(0) = 90$ gives $C = 70$, so $T = 20 + 70e^{-0.1t}$.'
        constraints: 'right side polynomial, power of x or e^{kx} integrating in one step; the particular solution is found from an initial value'
      - id: kp2
        name: Forcing that needs integration by parts
        key_prerequisites: [integration-by-parts, integrating-factor-computation]
        step_check:
          step: 'Use integration by parts with $u = x$, $dv = e^{5x} dx$'
          question: 'Why choose $u = x$ and not $u = e^{5x}$ here?'
          options:
            - 'Integrating $x$ gives $\frac{x^2}{2}$, which makes the new integral shorter'
            - 'The letter $u$ must always be assigned to the first factor in the product'
            - 'Differentiating $x$ gives $1$, so the factor $x$ drops out of it'
          answer: 'Differentiating $x$ gives $1$, so the factor $x$ drops out of it'
          why: 'With $u = x$ we have $du = dx$, so the new integral contains only $e^{5x}$, which is easy. With $u = e^{5x}$ the power of $x$ would grow and the integral would get harder.'
        exemplars:
          - problem: 'Solve $y'' - y = x$ with $y(0) = 0$.'
            answer: 'e^x - x - 1'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $e^{-x}$, so $(e^{-x}y)'' = xe^{-x}$. Integration by parts gives $e^{-x}y = -(x+1)e^{-x} + C$, and $y(0) = 0$ gives $C = 1$, so $y = e^x - x - 1$.'
          - problem: 'Solve $y'' - 2y = xe^{3x}$ with $y(0) = 0$.'
            answer: '(x - 1)e^(3x) + e^(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $e^{-2x}$, so $(e^{-2x}y)'' = xe^{x}$. Integration by parts gives $e^{-2x}y = (x-1)e^{x} + C$, and $y(0) = 0$ gives $C = 1$, so $y = (x-1)e^{3x} + e^{2x}$.'
          - problem: 'Solve $y'' + y = \sin x$ with $y(0) = 0$.'
            answer: '(sin(x) - cos(x) + e^(-x))/2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $e^{x}$, so $(e^{x}y)'' = e^{x}\sin x$. Integration by parts twice gives $e^{x}y = \frac{e^{x}(\sin x - \cos x)}{2} + C$, and $y(0) = 0$ gives $C = \frac12$, so $y = \frac{\sin x - \cos x + e^{-x}}{2}$.'
          - problem: 'Solve $y'' - 3y = \cos 2x$ with $y(0) = 0$.'
            answer: '(3e^(3x) + 2sin(2x) - 3cos(2x))/13'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $e^{-3x}$, so $(e^{-3x}y)'' = e^{-3x}\cos 2x$. Integration by parts twice gives $y = \frac{2\sin 2x - 3\cos 2x}{13} + Ce^{3x}$, and $y(0) = 0$ gives $C = \frac{3}{13}$.'
          - problem: 'Solve $y'' + 2y = x^2$ with $y(0) = 1$.'
            answer: 'x^2/2 - x/2 + 1/4 + 3e^(-2x)/4'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $e^{2x}$, so $(e^{2x}y)'' = x^2e^{2x}$. Integration by parts twice gives $y = \frac{x^2}{2} - \frac{x}{2} + \frac14 + Ce^{-2x}$, and $y(0) = 1$ gives $C = \frac34$.'
          - problem: 'Solve $2y'' + 4y = \sin x$ with $y(0) = 0$.'
            answer: '(2sin(x) - cos(x) + e^(-2x))/10'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Divide by $2$ to get $y'' + 2y = \frac12\sin x$, so $\mu = e^{2x}$. Integration by parts twice gives $y = \frac{2\sin x - \cos x}{10} + Ce^{-2x}$, and $y(0) = 0$ gives $C = \frac{1}{10}$.'
          - problem: 'In a series circuit with inductance $2$ H and resistance $4$ ohms, the source voltage is $10\sin t$ volts, so the current $i$ obeys $2i'' + 4i = 10\sin t$. Find $i(t)$ if the current is $0$ at time $t = 0$.'
            answer: '2sin(t) - cos(t) + e^(-2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Divide by $2$ to get $i'' + 2i = 5\sin t$, so $\mu = e^{2t}$. Integration by parts twice gives $i = 2\sin t - \cos t + Ce^{-2t}$, and $i(0) = 0$ gives $C = 1$.'
          - problem: 'A $200$-litre tank starts with pure water. Brine of concentration $\frac{t}{1000}$ kg per litre at time $t$ minutes flows in at $10$ L/min, and the well-mixed solution flows out at $10$ L/min. Find the salt mass $S(t)$ in kg.'
            answer: 't/5 - 4 + 4e^(-t/20)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Salt enters at $10\cdot\frac{t}{1000} = \frac{t}{100}$ kg/min and leaves at $\frac{10}{200}S = \frac{S}{20}$ kg/min, so $S'' + \frac{S}{20} = \frac{t}{100}$. With $\mu = e^{t/20}$ and integration by parts, $S = \frac{t}{5} - 4 + Ce^{-t/20}$, and $S(0) = 0$ gives $C = 4$.'
        constraints: 'right side polynomial times e^{kx} or sin/cos; at most two integrations by parts; initial value given so the answer is a particular solution'
      - id: kp3
        name: Linear IVPs
        key_prerequisites: [integrating-factor-computation, separable-equations]
        step_check:
          step: 'Set $y'' = 0$ to find the equilibrium solution'
          question: 'Why does setting $y'' = 0$ give the constant solution $y = 2$ for $y'' + 2y = 4$?'
          options:
            - 'A constant function has derivative $0$, so the equation reduces to $2y = 4$'
            - 'The derivative of every solution is $0$ once the initial condition is used'
            - 'The term $2y$ is dropped when $y'' = 0$, which leaves the constant $4$ as $y$'
          answer: 'A constant function has derivative $0$, so the equation reduces to $2y = 4$'
          why: 'If $y$ is constant then $y'' = 0$, so $2y = 4$ and $y = 2$. The full solution adds a term $Ce^{-2x}$ that dies out, and the initial condition fixes $C$.'
        exemplars:
          - problem: 'Solve $y'' + 2y = 4$ with $y(0) = 3$.'
            answer: '2 + e^(-2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'A constant solution satisfies $2y = 4$, so $y = 2$ and the general solution is $y = 2 + Ce^{-2x}$. The condition $y(0) = 3$ gives $2 + C = 3$, so $C = 1$ and $y = 2 + e^{-2x}$.'
          - problem: 'Solve $xy'' + y = \sin x$ for $x>0$ with $y(\pi/2) = 2/\pi$.'
            answer: '(1 - cos(x))/x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The left side is $(xy)''$, so $xy = -\cos x + C$. The condition gives $\frac{\pi}{2}\cdot\frac{2}{\pi} = 1 = C$, so $y = \frac{1 - \cos x}{x}$.'
          - problem: 'Solve $y'' - y = 1$ with $y(0) = 0$.'
            answer: 'e^x - 1'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'A constant solution satisfies $-y = 1$, so $y = -1$ and the general solution is $y = -1 + Ce^{x}$. The condition $y(0) = 0$ gives $C = 1$, so $y = e^x - 1$.'
          - problem: 'Solve $y'' + y = x$ with $y(0) = 1$.'
            answer: 'x - 1 + 2e^(-x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $e^{x}$, so $(e^{x}y)'' = xe^{x}$ and $e^{x}y = (x-1)e^{x} + C$. The condition $y(0) = 1$ gives $C = 2$, so $y = x - 1 + 2e^{-x}$.'
          - problem: 'Solve $y'' + \frac{3}{x}y = x$ for $x>0$ with $y(1) = 0$.'
            answer: 'x^2/5 - 1/(5x^3)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The integrating factor is $\mu = x^3$, so $(x^3y)'' = x^4$ and $x^3y = \frac{x^5}{5} + C$. The condition $y(1) = 0$ gives $C = -\frac15$, so $y = \frac{x^2}{5} - \frac{1}{5x^3}$.'
          - problem: 'Solve $y'' + 3y = 6$ with $y(0) = 4$.'
            answer: '2 + 2e^(-3x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'A constant solution satisfies $3y = 6$, so $y = 2$ and the general solution is $y = 2 + Ce^{-3x}$. The condition $y(0) = 4$ gives $C = 2$, so $y = 2 + 2e^{-3x}$.'
          - problem: 'A cup of tea at $80$ degrees Celsius is placed in a room at $20$ degrees Celsius. Its temperature $T$ obeys $T'' = -0.05\,(T - 20)$, with $t$ in minutes. After how many minutes, to one decimal place, does the tea reach $50$ degrees Celsius?'
            answer: '13.9'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The solution is $T = 20 + 60e^{-0.05t}$. Setting $T = 50$ gives $e^{-0.05t} = \frac12$, so $t = 20\ln 2 \approx 13.9$ minutes.'
          - problem: 'A loan balance $B$ (in dollars) grows with interest at $5\%$ per year and falls by repayments of $1200$ dollars per year, so $B'' = 0.05B - 1200$. Find $B(t)$ if $B(0) = 20000$.'
            answer: '24000 - 4000e^(0.05t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'A constant solution satisfies $0.05B = 1200$, so $B = 24000$ and $B = 24000 + Ce^{0.05t}$. The condition $B(0) = 20000$ gives $C = -4000$.'
          - problem: 'A drug is infused at $30$ mg per hour, and the body removes $20\%$ of the amount present each hour. With no drug at time $0$, find the amount $A(t)$ in mg after $t$ hours.'
            answer: '150 - 150e^(-0.2t)'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The amount obeys $A'' = 30 - 0.2A$, so $A'' + 0.2A = 30$. A constant solution satisfies $0.2A = 30$, so $A = 150$, and $A(0) = 0$ gives $A = 150 - 150e^{-0.2t}$.'
          - problem: 'A $500$-litre tank starts with pure water. Brine with $0.2$ kg of salt per litre flows in at $10$ L/min, and the well-mixed solution flows out at $10$ L/min. How many kilograms of salt are in the tank after $50$ minutes, to one decimal place?'
            answer: '63.2'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The salt mass obeys $S'' = 2 - \frac{S}{50}$ with $S(0) = 0$, so $S = 100 - 100e^{-t/50}$. At $t = 50$ this is $100(1 - e^{-1}) \approx 63.2$ kg.'
        constraints: "initial data chosen so C is a clean rational; recognize (xy)' and (e^{kx}y)' collapses"
    diagnostic_exemplar:
      problem: 'Solve $y'' - y = x$ with $y(0) = 2$.'
      answer: '$y = -x - 1 + 3e^{x}$'
      solution_sketch: '$\mu = e^{-x}$ gives $(e^{-x}y)'' = xe^{-x}$; integrating by parts, $e^{-x}y = -(x+1)e^{-x} + C$, so $y = -(x+1) + Ce^{x}$. Then $y(0) = -1 + C = 2$ gives $C = 3$.'
    anki_seeds:
      - front: "After multiplying y' + Py = Q by its integrating factor, the left side becomes..."
        back: "the exact derivative (mu y)' — integrate both sides once."
        type: basic
      - front: "Solution formula for y' + P(x)y = Q(x)?"
        back: '$y = \dfrac{1}{\mu}\left(\int \mu Q\,dx + C\right)$ with $\mu = e^{\int P\,dx}$.'
        type: basic

  - id: bernoulli-equations
    name: Bernoulli Equations
    core: false                # special-case substitution subsumed by the linear first-order method
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: linear-first-order-integrating-factor
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The substitution $v = y^{1-n}$"
        key_prerequisites: [chain-rule, linear-first-order-integrating-factor]
        try_first:
          problem: 'Let $v = \frac{1}{y}$. At a point where $y = 2$ and $y'' = 3$, what is the value of $v''$?'
          answer_contract: {"kind": "exact"}
          answer: '-3/4'
          reveal: 'Because $v = y^{-1}$, the chain rule gives $v'' = -y^{-2}y''$, which is $-\frac14\cdot 3 = -\frac34$. This chain-rule step is what turns the term $y''$ of a Bernoulli equation into a term in $v''$.'
        step_check:
          step: 'Differentiate $v$ with respect to $x$: $v'' = -y^{-2}y''$'
          question: 'Why does the factor $y''$ appear in $v'' = -y^{-2}y''$?'
          options:
            - 'Because $v$ was defined as the derivative of $y$ in this substitution'
            - 'Because every term of a differential equation must contain the factor $y''$'
            - 'Because $y$ depends on $x$, so the chain rule multiplies by $y''$'
          answer: 'Because $y$ depends on $x$, so the chain rule multiplies by $y''$'
          why: 'The power rule gives $-y^{-2}$, and the chain rule multiplies it by the derivative of the inner function $y$, which is $y''$. This is why the substitution turns $y''$ into $v''$.'
        exemplars:
          - problem: 'The substitution $v = y^{1-n}$ turns the Bernoulli equation $y'' + 2y = y^2$ into a linear equation $v'' + Pv = Q$. What is $P$?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $n = 2$, so $v = y^{-1}$ and $v'' = -y^{-2}y''$. With $y'' = y^2 - 2y$ this gives $v'' = -1 + 2v$, so $v'' - 2v = -1$ and $P = -2$.'
          - problem: 'The substitution $v = y^{1-n}$ turns the Bernoulli equation $y'' - y = xy^3$ into a linear equation $v'' + Pv = Q$. What is $Q$ as a function of $x$?'
            answer: '-2x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $n = 3$, so $v = y^{-2}$ and $v'' = -2y^{-3}y''$. With $y'' = y + xy^3$ this gives $v'' = -2v - 2x$, so $v'' + 2v = -2x$ and $Q = -2x$.'
          - problem: 'The substitution $v = y^{1-n}$ turns the Bernoulli equation $y'' + \frac{y}{x} = \sqrt{y}$ for $x>0$ into a linear equation $v'' + Pv = Q$. What is $P$?'
            answer: '1/(2x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Here $n = \frac12$, so $v = y^{1/2} = \sqrt{y}$ and $v'' = \frac{y''}{2\sqrt{y}}$. With $y'' = \sqrt{y} - \frac{y}{x}$ this gives $v'' = \frac12 - \frac{v}{2x}$, so $v'' + \frac{1}{2x}v = \frac12$ and $P = \frac{1}{2x}$.'
          - problem: 'The equation $y'' + y = xy^4$ becomes linear after the substitution $v = y^k$. What is $k$?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation has the form $y'' + Py = Qy^n$ with $n = 4$, and the substitution is $v = y^{1-n}$. So $k = 1 - 4 = -3$.'
          - problem: 'Is $y'' + 3y = xy^5$ a Bernoulli equation?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is a bernoulli equation", "bernoulli", "correct"], ["no", "it is not", "it is not a bernoulli equation", "not bernoulli", "incorrect"]]}
            solution_sketch: 'It has the form $y'' + P(x)y = Q(x)y^n$ with $P = 3$, $Q = x$ and $n = 5$. So it is a Bernoulli equation.'
          - problem: 'Is $y'' + 3y = y^2 + x$ a Bernoulli equation?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is a bernoulli equation", "bernoulli", "correct"], ["no", "it is not", "it is not a bernoulli equation", "not bernoulli", "incorrect"]]}
            solution_sketch: 'The right side $y^2 + x$ has two terms, so it is not a single term $Q(x)y^n$. So the equation is not a Bernoulli equation.'
          - problem: 'A population $N$ (in thousands) obeys $N'' = 0.3N - 0.06N^2$. The substitution $u = \frac{1}{N}$ gives a linear equation $u'' + Au = B$. What is $B$?'
            answer: '0.06'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $u = N^{-1}$ we get $u'' = -N^{-2}N'' = -\frac{0.3}{N} + 0.06 = -0.3u + 0.06$. So $u'' + 0.3u = 0.06$ and $B = 0.06$.'
          - problem: 'The mass $m$ of a growing cell obeys $m'' = 3m^{2/3} - m$. The substitution $u = m^{1/3}$ gives a linear equation $u'' + Au = B$. What is $A$?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $u = m^{1/3}$ we get $u'' = \frac13 m^{-2/3}m'' = \frac13(3 - m^{1/3}) = 1 - \frac{u}{3}$. So $u'' + \frac13 u = 1$ and $A = \frac13$.'
        constraints: "n in {2, 3, 1/2}; the transformed equation must be stated in standard linear form"
      - id: kp2
        name: Complete solutions
        key_prerequisites: [linear-first-order-integrating-factor]
        step_check:
          step: 'The integrating factor is $\mu = e^{\int -4 dx} = e^{-4x}$'
          question: 'Why does the integral use $-4$ and not the original coefficient $2$?'
          options:
            - 'The coefficient of $v$ in $v'' - 4v = -2$ is $-4$, and that is the new $P$'
            - 'Integrating factors always use the negative of the original coefficient'
            - 'The power $y^3$ on the right side changes $2$ into $-4$ before integrating'
          answer: 'The coefficient of $v$ in $v'' - 4v = -2$ is $-4$, and that is the new $P$'
          why: 'After the substitution the unknown is $v$, and the linear equation is $v'' - 4v = -2$. The integrating factor uses the coefficient of $v$ in this new equation.'
        exemplars:
          - problem: 'Solve $y'' + y = y^2$ with $y(0) = \frac12$.'
            answer: '1/(1 + e^x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = y^{-1}$, so $v'' - v = -1$ and $v = 1 + Ce^{x}$. The condition $v(0) = 2$ gives $C = 1$, so $y = \frac{1}{1 + e^{x}}$.'
          - problem: 'Solve $y'' + \frac{y}{x} = y^2$ for $x>0$ with $y(1) = \frac12$.'
            answer: '1/(x(2 - ln(x)))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = y^{-1}$, so $v'' - \frac{v}{x} = -1$ and $\left(\frac{v}{x}\right)'' = -\frac{1}{x}$. Then $v = x(C - \ln x)$, and $v(1) = 2$ gives $C = 2$, so $y = \frac{1}{x(2 - \ln x)}$.'
          - problem: 'Solve $y'' + 2y = 2y^2$ with $y(0) = 2$.'
            answer: '2/(2 - e^(2x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = y^{-1}$, so $v'' - 2v = -2$ and $v = 1 + Ce^{2x}$. The condition $v(0) = \frac12$ gives $C = -\frac12$, so $y = \frac{2}{2 - e^{2x}}$.'
          - problem: 'Solve $y'' - y = y^2$ with $y(0) = 1$.'
            answer: '1/(2e^(-x) - 1)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = y^{-1}$, so $v'' + v = -1$ and $v = -1 + Ce^{-x}$. The condition $v(0) = 1$ gives $C = 2$, so $y = \frac{1}{2e^{-x} - 1}$.'
          - problem: 'Solve $y'' + \frac{y}{x} = \frac{y^2}{x}$ for $x>0$ with $y(1) = \frac12$.'
            answer: '1/(1 + x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = y^{-1}$, so $v'' - \frac{v}{x} = -\frac{1}{x}$ and $v = 1 + Cx$. The condition $v(1) = 2$ gives $C = 1$, so $y = \frac{1}{1 + x}$.'
          - problem: 'Solve $y'' + 3y = 6y^2$ with $y(0) = \frac13$.'
            answer: '1/(2 + e^(3x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = y^{-1}$, so $v'' - 3v = -6$ and $v = 2 + Ce^{3x}$. The condition $v(0) = 3$ gives $C = 1$, so $y = \frac{1}{2 + e^{3x}}$.'
          - problem: 'A population $P$ (in thousands) obeys $P'' = 0.1P - 0.001P^2$, with $t$ in years. If $P(0) = 20$, find $P(t)$.'
            answer: '100/(1 + 4e^(-0.1t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Put $v = P^{-1}$, so $v'' + 0.1v = 0.001$ and $v = 0.01 + Ce^{-0.1t}$. The condition $v(0) = 0.05$ gives $C = 0.04$, so $P = \frac{1}{0.01 + 0.04e^{-0.1t}} = \frac{100}{1 + 4e^{-0.1t}}$.'
          - problem: 'Bacteria in a dish with limited food, counted in millions, obey $N'' = 2N - N^2$, with $t$ in hours. If $N(0) = 0.5$, find $N(t)$.'
            answer: '2/(1 + 3e^(-2t))'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Put $v = N^{-1}$, so $v'' + 2v = 1$ and $v = \frac12 + Ce^{-2t}$. The condition $v(0) = 2$ gives $C = \frac32$, so $N = \frac{1}{\frac12 + \frac32e^{-2t}} = \frac{2}{1 + 3e^{-2t}}$.'
        constraints: "coefficients constant or k/x; the linear stage solves with one integrating factor; present y explicitly"
      - id: kp3
        name: Bernoulli IVPs
        key_prerequisites: [linear-first-order-integrating-factor]
        step_check:
          step: 'Apply the initial condition $v(0) = 1$ to find $C$'
          question: 'Why is the initial condition used as $v(0) = 1$ when $y(0) = 1$ is given?'
          options:
            - 'Every initial condition is replaced by the value $1$ after a substitution'
            - 'The constant $C$ sits in the formula for $v$, and $v(0) = y(0)^{-1} = 1$'
            - 'The values $y(0)$ and $v(0)$ are equal for every Bernoulli equation'
          answer: 'The constant $C$ sits in the formula for $v$, and $v(0) = y(0)^{-1} = 1$'
          why: 'The constant $C$ belongs to the formula for $v$, so the initial value must be written for $v$ too. Since $v = y^{-1}$, we get $v(0) = 1^{-1} = 1$.'
        exemplars:
          - problem: 'Solve $y'' + 2y = 3y^2$ with $y(0) = 1$.'
            answer: '2/(3 - e^(2x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = y^{-1}$, so $v'' - 2v = -3$ and $v = \frac32 + Ce^{2x}$. The condition $v(0) = 1$ gives $C = -\frac12$, so $y = \frac{2}{3 - e^{2x}}$.'
          - problem: 'Solve $y'' + y = 2y^3$ with $y(0) = \frac12$.'
            answer: '1/sqrt(2 + 2e^(2x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = y^{-2}$, so $v'' - 2v = -4$ and $v = 2 + Ce^{2x}$. The condition $v(0) = 4$ gives $C = 2$, so $y = \frac{1}{\sqrt{2 + 2e^{2x}}}$.'
          - problem: 'Solve $y'' + 2y = 2y^3$ with $y(0) = \frac12$.'
            answer: '1/sqrt(1 + 3e^(4x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = y^{-2}$, so $v'' - 4v = -4$ and $v = 1 + Ce^{4x}$. The condition $v(0) = 4$ gives $C = 3$, so $y = \frac{1}{\sqrt{1 + 3e^{4x}}}$.'
          - problem: 'Solve $y'' - y = \sqrt{y}$ with $y(0) = 1$.'
            answer: '(2e^(x/2) - 1)^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = \sqrt{y}$, so $v'' - \frac12 v = \frac12$ and $v = -1 + Ce^{x/2}$. The condition $v(0) = 1$ gives $C = 2$, so $y = (2e^{x/2} - 1)^2$.'
          - problem: 'Solve $y'' + \frac{y}{x} = xy^2$ on $0<x<2$ with $y(1) = 1$.'
            answer: '1/(x(2 - x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'Put $v = y^{-1}$, so $v'' - \frac{v}{x} = -x$ and $\left(\frac{v}{x}\right)'' = -1$. Then $v = x(C - x)$, and $v(1) = 1$ gives $C = 2$, so $y = \frac{1}{x(2 - x)}$.'
          - problem: 'The solution of $y'' + y = y^2$ with $y(0) = 2$ grows without bound at some $x>0$. What is that value of $x$, to two decimal places?'
            answer: '0.69'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'Put $v = y^{-1}$, so $v'' - v = -1$ and $v = 1 + Ce^{x}$. With $v(0) = \frac12$ we get $C = -\frac12$ and $y = \frac{2}{2 - e^{x}}$, which is unbounded when $e^{x} = 2$, so $x = \ln 2 \approx 0.69$.'
          - problem: 'A population $P$ (in thousands) obeys $P'' = 0.4P - 0.02P^2$, with $t$ in years. If $P(0) = 5$, after how many years, to one decimal place, does the population reach $10$ thousand?'
            answer: '2.7'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Put $v = P^{-1}$, so $v'' + 0.4v = 0.02$ and $v = 0.05 + Ce^{-0.4t}$. With $v(0) = 0.2$ we get $C = 0.15$, and $P = 10$ means $v = 0.1$, so $e^{-0.4t} = \frac13$ and $t = 2.5\ln 3 \approx 2.7$ years.'
          - problem: 'The mass $m$ (in micrograms) of a growing cell obeys $m'' = 3m^{2/3} - m$, with $t$ in hours. If $m(0) = 1$, find $m(t)$.'
            answer: '(3 - 2e^(-t/3))^3'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'Put $u = m^{1/3}$, so $u'' + \frac13 u = 1$ and $u = 3 + Ce^{-t/3}$. The condition $u(0) = 1$ gives $C = -2$, so $m = (3 - 2e^{-t/3})^3$.'
        constraints: "initial data keeps v positive near x0; state the solution explicitly"
    diagnostic_exemplar:
      problem: 'Solve $y'' + y = y^2$ with $y(0) = 3$.'
      answer: '$y = \dfrac{3}{3 - 2e^{x}}$'
      answer_contract: {kind: none}
      solution_sketch: 'With $n = 2$, put $v = y^{-1}$: dividing by $y^2$ gives $-v'' + v = 1$, i.e. $v'' - v = -1$, whose solution is $v = 1 + Ce^{x}$. Then $y = \frac{1}{1 + Ce^x}$, and $y(0) = 3$ gives $C = -\frac{2}{3}$, i.e. $y = \frac{3}{3 - 2e^x}$.'
    anki_seeds:
      - front: "A Bernoulli equation has the form..."
        back: "$y' + P(x)y = Q(x)y^n$ with $n \\neq 0, 1$."
        type: basic
      - front: "Substitution that linearizes a Bernoulli equation?"
        back: '$v = y^{1-n}$ — it satisfies a linear first-order equation.'
        type: basic

  - id: homogeneous-first-order-substitution
    name: "Homogeneous Equations and the v = y/x Substitution"   # names are plain text (no KaTeX pass) — $…$ would render literally
    core: false                # special-case substitution; terminal
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: separable-equations
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Recognizing homogeneous equations
        key_prerequisites: [separable-equations]
        try_first:
          problem: 'The slope $\frac{x+2y}{x}$ is worked out at the points $(1,1)$, $(2,2)$ and $(3,3)$. Is it the same at all three points?'
          answer_contract: {"kind": "label", "options": [["yes", "it is the same", "the same", "same"], ["no", "it is not the same", "different", "not the same"]]}
          answer: 'yes'
          reveal: 'On the line $y = x$ the ratio $\frac{y}{x}$ is always $1$, so $\frac{x+2y}{x} = 1 + 2\cdot 1 = 3$ at every point. A homogeneous slope depends only on the ratio $\frac{y}{x}$.'
        step_check:
          step: 'Factor out $x^2$ from both numerator and denominator'
          question: 'Why can $x^2$ be factored out of both the numerator and the denominator?'
          options:
            - 'Because $x^2$ is a common factor of every pair of polynomials'
            - 'Every term contains $x^2$ once $y$ is replaced by $vx$'
            - 'Because the substitution makes $x$ equal to $1$ in the fraction'
          answer: 'Every term contains $x^2$ once $y$ is replaced by $vx$'
          why: 'After $y = vx$ each term is a multiple of $x^2$, such as $2x(vx) = 2vx^2$. So the factor $x^2$ cancels and only $v$ remains.'
        exemplars:
          - problem: 'Write the right side of $y'' = \frac{x+y}{x}$ in terms of $v = \frac{y}{x}$.'
            answer: '1 + v'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'Divide the numerator and the denominator by $x$ to get $\frac{x+y}{x} = 1 + \frac{y}{x}$. With $v = \frac{y}{x}$ this is $1 + v$.'
          - problem: 'Write the right side of $y'' = \frac{x^2+y^2}{xy}$ in terms of $v = \frac{y}{x}$.'
            answer: '(1 + v^2)/v'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'Divide the numerator and the denominator by $x^2$ to get $\frac{1 + (y/x)^2}{y/x}$. With $v = \frac{y}{x}$ this is $\frac{1 + v^2}{v}$.'
          - problem: 'Is $y'' = \frac{x^2+y^2}{x}$ a homogeneous equation?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is homogeneous", "homogeneous", "correct"], ["no", "it is not", "it is not homogeneous", "not homogeneous", "nonhomogeneous", "incorrect"]]}
            solution_sketch: 'Replacing $x$ by $tx$ and $y$ by $ty$ turns the right side into $t\cdot\frac{x^2+y^2}{x}$, which is a different function. So the equation is not homogeneous.'
          - problem: 'In $f(x,y) = \frac{x^2+y^2}{x^3}$ replace $x$ by $tx$ and $y$ by $ty$. By what factor is $f$ multiplied?'
            answer: '1/t'
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: 'The numerator gets the factor $t^2$ and the denominator gets the factor $t^3$. So $f$ is multiplied by $\frac{t^2}{t^3} = \frac{1}{t}$, which is not $1$.'
          - problem: 'Write the right side of $y'' = \frac{x^3+y^3}{xy^2}$ in terms of $v = \frac{y}{x}$.'
            answer: '(1 + v^3)/v^2'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'Divide the numerator and the denominator by $x^3$ to get $\frac{1 + (y/x)^3}{(y/x)^2}$. With $v = \frac{y}{x}$ this is $\frac{1 + v^3}{v^2}$.'
          - problem: 'A curve has the property that its slope at each point $(x,y)$ equals the slope of the line from the origin to that point plus the reciprocal of that slope. Write $y''$ in terms of $v = \frac{y}{x}$.'
            answer: 'v + 1/v'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'The line from the origin to $(x,y)$ has slope $\frac{y}{x} = v$. So the slope condition is $y'' = v + \frac{1}{v}$.'
          - problem: 'Is $y'' = \frac{y^2+2xy}{x^2}$ a homogeneous equation?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is homogeneous", "homogeneous", "correct"], ["no", "it is not", "it is not homogeneous", "not homogeneous", "nonhomogeneous", "incorrect"]]}
            solution_sketch: 'Dividing the numerator and the denominator by $x^2$ gives $v^2 + 2v$ with $v = \frac{y}{x}$. The right side depends on $v$ alone, so the equation is homogeneous.'
          - problem: 'Write the right side of $y'' = \frac{x^2-y^2}{xy}$ in terms of $v = \frac{y}{x}$.'
            answer: '(1 - v^2)/v'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'Divide the numerator and the denominator by $x^2$ to get $\frac{1 - (y/x)^2}{y/x}$. With $v = \frac{y}{x}$ this is $\frac{1 - v^2}{v}$.'
          - problem: 'A homogeneous equation gives the slope $3$ at the point $(1,2)$. What slope does it give at the point $(5,10)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both points have $\frac{y}{x} = 2$. A homogeneous equation gives the same slope wherever $\frac{y}{x}$ is the same, so the slope at $(5,10)$ is $3$.'
        constraints: "right sides are ratios of degree-matched polynomials (homogeneous) or degree-mismatched foils"
      - id: kp2
        name: The substitution mechanics
        key_prerequisites: [chain-rule, separable-equations]
        step_check:
          step: 'Use the product rule for $y''$'
          question: 'Why is the product rule needed to find $y''$ from $y = vx$?'
          options:
            - 'Because $x$ is a constant, so only $v$ has to be differentiated'
            - 'Because $y''$ is always the product of $v$ and $x$ in this kind of equation'
            - 'Because both $v$ and $x$ vary with $x$, so $(vx)''$ has two terms'
          answer: 'Because both $v$ and $x$ vary with $x$, so $(vx)''$ has two terms'
          why: 'Here $v$ is a function of $x$, so $(vx)'' = v''x + v\cdot 1 = v + xv''$. The term $v$ comes from differentiating $x$.'
        exemplars:
          - problem: 'Substituting $y = vx$ into $y'' = \frac{x^2+y^2}{xy}$ gives an equation $x\frac{dv}{dx} = R(v)$. What is $R(v)$?'
            answer: '1/v'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'With $y = vx$ we have $y'' = v + x\frac{dv}{dx}$, and the right side becomes $\frac{1 + v^2}{v}$. Subtracting $v$ gives $x\frac{dv}{dx} = \frac{1+v^2}{v} - v = \frac{1}{v}$.'
          - problem: 'Substituting $y = vx$ into $y'' = \frac{y^2+2xy}{x^2}$ gives an equation $x\frac{dv}{dx} = R(v)$. What is $R(v)$?'
            answer: 'v^2 + v'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'The right side becomes $v^2 + 2v$, and $y'' = v + x\frac{dv}{dx}$. Subtracting $v$ gives $x\frac{dv}{dx} = v^2 + v$.'
          - problem: 'Substituting $y = vx$ into $y'' = \frac{y-x}{x}$ gives an equation $x\frac{dv}{dx} = c$. What is $c$?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The right side becomes $v - 1$, and $y'' = v + x\frac{dv}{dx}$. Subtracting $v$ gives $x\frac{dv}{dx} = -1$.'
          - problem: 'Substituting $y = vx$ into $y'' = \frac{x+y}{x-y}$ gives an equation $x\frac{dv}{dx} = R(v)$. What is $R(v)$?'
            answer: '(1 + v^2)/(1 - v)'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'The right side becomes $\frac{1+v}{1-v}$, and $y'' = v + x\frac{dv}{dx}$. Subtracting $v$ gives $\frac{1+v}{1-v} - v = \frac{1 + v^2}{1 - v}$.'
          - problem: 'Substituting $y = vx$ into $y'' = \frac{x^2+3y^2}{2xy}$ gives an equation $x\frac{dv}{dx} = R(v)$. What is $R(v)$?'
            answer: '(1 + v^2)/(2v)'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'The right side becomes $\frac{1 + 3v^2}{2v}$, and $y'' = v + x\frac{dv}{dx}$. Subtracting $v$ gives $\frac{1 + 3v^2}{2v} - v = \frac{1 + v^2}{2v}$.'
          - problem: 'Substituting $y = vx$ into $y'' = \frac{y}{x} + \tan\frac{y}{x}$ gives an equation $x\frac{dv}{dx} = R(v)$. What is $R(v)$?'
            answer: 'tan(v)'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'The right side becomes $v + \tan v$, and $y'' = v + x\frac{dv}{dx}$. Subtracting $v$ gives $x\frac{dv}{dx} = \tan v$.'
          - problem: 'Sam substitutes $y = vx$ into $y'' = \frac{x+y}{x}$ but forgets the product rule, and gets $x\frac{dv}{dx} = 1 + v$. What is the correct value of $c$ in $x\frac{dv}{dx} = c$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $y'' = v + x\frac{dv}{dx}$, and the right side is $1 + v$. Subtracting $v$ leaves $x\frac{dv}{dx} = 1$, so $c = 1$.'
          - problem: 'A curve has the property that its slope at each point $(x,y)$ equals the slope of the line from the origin to that point plus the square of that slope. Substituting $y = vx$ gives $x\frac{dv}{dx} = R(v)$. What is $R(v)$?'
            answer: 'v^2'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'The slope condition is $y'' = v + v^2$. Since $y'' = v + x\frac{dv}{dx}$, we get $x\frac{dv}{dx} = v^2$.'
          - problem: 'A curve has the property that its slope at each point $(x,y)$ equals the slope of the line from the origin to that point minus the reciprocal of that slope. Substituting $y = vx$ gives $x\frac{dv}{dx} = R(v)$. What is $R(v)$?'
            answer: '-1/v'
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: 'The slope condition is $y'' = v - \frac{1}{v}$. Since $y'' = v + x\frac{dv}{dx}$, we get $x\frac{dv}{dx} = -\frac{1}{v}$.'
        constraints: "always y = vx with y' = v + xv'; the result must be visibly separable in v and x"
      - id: kp3
        name: Complete solutions
        key_prerequisites: [separable-equations]
        step_check:
          step: 'Cancel $xv$ from both sides'
          question: 'Why can $xv$ be cancelled from both sides of $xv + x^2v'' = 2x + vx$?'
          options:
            - 'The term $xv$ is on both sides, so subtracting it keeps the equation true'
            - 'The variable $v$ equals $0$ at every point of the solution curve, so the term vanishes'
            - 'Any term containing the factor $x$ can be removed once $x>0$ is known'
          answer: 'The term $xv$ is on both sides, so subtracting it keeps the equation true'
          why: 'Subtracting $xv$ from both sides keeps the equation balanced and leaves $x^2v'' = 2x$. Nothing is assumed about the size of $v$.'
        exemplars:
          - problem: 'Solve $xy'' = 2x + y$ for $x>0$ with $y(1) = 1$.'
            answer: '2x ln(x) + x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With $y = vx$ the equation becomes $x^2v'' = 2x$, so $v'' = \frac{2}{x}$ and $v = 2\ln x + C$. The condition $v(1) = 1$ gives $C = 1$, so $y = 2x\ln x + x$.'
          - problem: 'Solve $y'' = \frac{x^2+y^2}{xy}$ for $x>0$ with $y(1) = 1$.'
            answer: 'x sqrt(2 ln(x) + 1)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With $y = vx$ we get $x\frac{dv}{dx} = \frac{1}{v}$, so $v\,dv = \frac{dx}{x}$ and $\frac{v^2}{2} = \ln x + C$. The condition $v(1) = 1$ gives $C = \frac12$, so $y = x\sqrt{2\ln x + 1}$.'
          - problem: 'Solve $xy'' = y - x$ for $x>0$ with $y(1) = 1$.'
            answer: 'x - x ln(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With $y = vx$ we get $x\frac{dv}{dx} = -1$, so $v = -\ln x + C$. The condition $v(1) = 1$ gives $C = 1$, so $y = x - x\ln x$.'
          - problem: 'Solve $y'' = \frac{y^2+xy}{x^2}$ for $x>0$ with $y(1) = 1$.'
            answer: 'x/(1 - ln(x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With $y = vx$ we get $x\frac{dv}{dx} = v^2$, so $-\frac{1}{v} = \ln x + C$. The condition $v(1) = 1$ gives $C = -1$, so $v = \frac{1}{1 - \ln x}$ and $y = \frac{x}{1 - \ln x}$.'
          - problem: 'Solve $y'' = \frac{y^2-x^2}{xy}$ for $x>0$ with $y(1) = 2$.'
            answer: 'x sqrt(4 - 2 ln(x))'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'With $y = vx$ we get $x\frac{dv}{dx} = -\frac{1}{v}$, so $\frac{v^2}{2} = -\ln x + C$. The condition $v(1) = 2$ gives $C = 2$, so $y = x\sqrt{4 - 2\ln x}$.'
          - problem: 'Every tangent line to a curve in the region $x>0$ meets the $y$-axis at a height equal to the $x$-coordinate of the point of tangency. The curve passes through $(1,3)$. Find $y(x)$.'
            answer: '3x - x ln(x)'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The tangent at $(x,y)$ meets the $y$-axis at height $y - xy''$, so $y - xy'' = x$ and $xy'' = y - x$. With $y = vx$ this gives $v = -\ln x + C$, and $v(1) = 3$ gives $y = 3x - x\ln x$.'
          - problem: 'Every tangent line to a curve in the region $x>0$ crosses the $x$-axis at half the $x$-coordinate of the point of tangency. The curve passes through $(1,3)$. Find $y(x)$.'
            answer: '3x^2'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The tangent at $(x,y)$ crosses the $x$-axis at $x - \frac{y}{y''}$, so $x - \frac{y}{y''} = \frac{x}{2}$ and $y'' = \frac{2y}{x}$. With $y = vx$ this gives $x\frac{dv}{dx} = v$, so $v = Cx$. The condition $v(1) = 3$ gives $C = 3$, so $y = 3x^2$.'
        constraints: "v-integrations produce ln x or powers of v; back-substitute v = y/x and state y explicitly when a branch is determined"
    diagnostic_exemplar:
      problem: "Solve $xy' = y + x$ ($x > 0$) with $y(1) = 3$."
      answer: "$y = x\\ln x + 3x$"
      solution_sketch: "$v = y/x$ gives $v = \\ln x + C$ with $v(1) = 3$, so $C = 3$."
    anki_seeds:
      - front: "A first-order equation y' = f(x, y) is homogeneous when..."
        back: "f can be written as a function of v = y/x alone (equivalently f(tx, ty) = f(x, y))."
        type: basic
      - front: "The substitution y = vx turns a homogeneous equation into..."
        back: "a separable equation in v and x, using y' = v + xv'."
        type: basic

  - id: exact-equations
    name: Exact Equations
    core: false                # special-class technique; heads a terminal two-topic branch
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: partial-derivatives
        weight: 0.6
        key: true
      - id: implicit-differentiation
        weight: 0.4
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Testing exactness
        key_prerequisites: [partial-derivatives]
        step_check:
          step: 'The equation is exact because $\frac{\partial M}{\partial y} = \frac{\partial N}{\partial x}$'
          question: 'Why does the equality of these two partial derivatives show that the equation is exact?'
          options:
            - 'Because equal partial derivatives mean that $M$ and $N$ are in fact one and the same function'
            - 'Because the two partial derivatives then cancel each other and leave the whole equation equal to zero'
            - 'Because $F_{xy} = F_{yx}$, so $M\,dx + N\,dy$ can be the differential $dF$ of a function'
            - 'Because $M$ and $N$ must then both be constant in the one variable that each of them depends on'
          answer: 'Because $F_{xy} = F_{yx}$, so $M\,dx + N\,dy$ can be the differential $dF$ of a function'
          why: 'If $M\,dx + N\,dy = dF$, then $M = F_x$ and $N = F_y$, so $M_y = F_{xy}$ and $N_x = F_{yx}$ are equal. The test checks exactly this condition.'
        exemplars:
          - problem: 'Is $(2xy + 3)\,dx + (x^2 - 1)\,dy = 0$ an exact equation?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is exact", "exact", "is exact"], ["no", "it is not exact", "not exact", "is not exact"]]}
            solution_sketch: 'Here $M = 2xy + 3$ and $N = x^2 - 1$. Then $M_y = 2x$ and $N_x = 2x$, so the two partial derivatives are equal. Equal partial derivatives mean that the equation is exact.'
          - problem: 'For $(x^2y + y^3)\,dx + (x^3 + 2xy^2)\,dy = 0$, find $\dfrac{\partial M}{\partial y} - \dfrac{\partial N}{\partial x}$ at the point $(1, 2)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $M_y = x^2 + 3y^2$ and $N_x = 3x^2 + 2y^2$. The difference is $M_y - N_x = y^2 - 2x^2$. At $(1, 2)$ it equals $4 - 2 = 2$, so the equation is not exact.'
          - problem: 'Is $(y^2 + x)\,dx + (xy + 1)\,dy = 0$ exact?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is exact", "exact", "is exact"], ["no", "it is not exact", "not exact", "is not exact"]]}
            solution_sketch: 'Here $M = y^2 + x$ and $N = xy + 1$. Then $M_y = 2y$ but $N_x = y$. These differ, so the equation is not exact.'
          - problem: 'For which constant $b$ is $(ye^x + 2x)\,dx + be^x\,dy = 0$ exact?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $M_y = N_x$. Here $M_y = e^x$ and $N_x = be^x$. These agree for every $x$ only when $b = 1$.'
          - problem: 'In a model of a gas, the small change of a quantity $U(x, y)$ is $dU = (ay + 6x)\,dx + (5x + 2y)\,dy$, where $a$ is a constant. A quantity $U$ with this differential exists only if the form is exact. Find $a$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For an exact form, $M_y = N_x$. Here $M_y = a$ and $N_x = 5$. So $a = 5$.'
          - problem: 'Sam says that $y\,dx + 2x\,dy = 0$ is exact because he finds $\dfrac{\partial N}{\partial x} = 1$. What is the correct value of $\dfrac{\partial N}{\partial x}$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $N = 2x$, so differentiating with respect to $x$ gives $N_x = 2$. Also $M = y$ gives $M_y = 1$. The two partial derivatives differ, so the equation is not exact. Sam dropped the factor $2$.'
          - problem: 'A force field has components $P = kye^x + 2x$ and $Q = 4e^x$, where $k$ is a constant. The work done along a path depends only on its ends exactly when $P\,dx + Q\,dy = 0$ is exact. Find $k$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For an exact equation, $P_y = Q_x$. Here $P_y = ke^x$ and $Q_x = 4e^x$. So $k = 4$.'
          - problem: 'For which constant $a$ is $(x^2y + ay^2)\,dx + \left(\dfrac{1}{3}x^3 + 6xy\right)dy = 0$ exact?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $M_y = N_x$. Here $M_y = x^2 + 2ay$ and $N_x = x^2 + 6y$. These agree for all $x$ and $y$ only when $2a = 6$, so $a = 3$.'
          - problem: 'For which constant $c$ is $(e^x\sin y + cxy)\,dx + (e^x\cos y + 3x^2)\,dy = 0$ exact?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $M_y = N_x$. Here $M_y = e^x\cos y + cx$ and $N_x = e^x\cos y + 6x$. These agree only when $c = 6$.'
        constraints: "M, N polynomial/exponential/trig in x and y; the test is a two-partial-derivative computation"
      - id: kp2
        name: Reconstructing the potential function
        key_prerequisites: [partial-derivatives, implicit-differentiation]
        step_check:
          step: '$F = \int (3x^2 y + 2y^2)\,dx = x^3 y + 2xy^2 + h(y)$'
          question: 'Why does this integral end with an unknown function $h(y)$ instead of a plain constant?'
          options:
            - 'Because $y$ is held fixed when integrating in $x$, so any term in $y$ alone is lost'
            - 'Because $h(y)$ stands for the term $2y^2$ that the integration in $x$ left out of the result'
            - 'Because $h(y)$ is a second constant that must be set equal to $C$ in $F(x, y) = C$'
            - 'Because $F_x$ must equal $N$, and the function $h(y)$ is what makes that equation true'
          answer: 'Because $y$ is held fixed when integrating in $x$, so any term in $y$ alone is lost'
          why: 'The partial derivative $F_x$ ignores any term that depends on $y$ alone. So the integral in $x$ determines $F$ only up to an unknown $h(y)$, which the condition $F_y = N$ then fixes.'
        exemplars:
          - problem: 'The equation $(2xy + 3)\,dx + (x^2 - 1)\,dy = 0$ is exact. Find a function $F(x, y)$ such that the solutions are given by $F(x, y) = C$.'
            answer: 'x^2 y + 3x - y'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'Integrate $M = 2xy + 3$ with respect to $x$ to get $F = x^2y + 3x + h(y)$. Then $F_y = x^2 + h''(y)$ must equal $N = x^2 - 1$, so $h''(y) = -1$ and $h(y) = -y$. Hence $F = x^2y + 3x - y$.'
          - problem: 'Check that $(2x + y)\,dx + (x + 2y)\,dy = 0$ is exact, then find a function $F(x, y)$ with solutions $F(x, y) = C$.'
            answer: 'x^2 + xy + y^2'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'Here $M_y = 1 = N_x$, so the equation is exact. Integrating $M = 2x + y$ in $x$ gives $x^2 + xy + h(y)$. Matching $F_y = x + h''(y)$ with $N = x + 2y$ gives $h(y) = y^2$, so $F = x^2 + xy + y^2$.'
          - problem: 'Find a function $F(x, y)$ whose level curves $F(x, y) = C$ are the solutions of $(\cos x + y)\,dx + (x + e^y)\,dy = 0$.'
            answer: 'sin(x) + xy + e^y'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'The equation is exact because $M_y = 1 = N_x$. Integrating $M$ in $x$ gives $F = \sin x + xy + h(y)$. Then $F_y = x + h''(y) = x + e^y$, so $h(y) = e^y$ and $F = \sin x + xy + e^y$.'
          - problem: 'A force field has components $P = 2xy + e^x$ and $Q = x^2 + 3y^2$. The field is conservative, so $P\,dx + Q\,dy = 0$ is exact. Find a potential function $f(x, y)$, that is, a function with $f_x = P$ and $f_y = Q$.'
            answer: 'x^2 y + e^x + y^3'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'Integrate $P$ in $x$ to get $f = x^2y + e^x + h(y)$. Then $f_y = x^2 + h''(y)$ must equal $Q = x^2 + 3y^2$, so $h(y) = y^3$. Hence $f = x^2y + e^x + y^3$.'
          - problem: 'Find a function $F(x, y)$ such that $F(x, y) = C$ gives the solutions of $(y\cos x + 2x)\,dx + (\sin x + 2y)\,dy = 0$.'
            answer: 'y sin(x) + x^2 + y^2'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'The equation is exact because $M_y = \cos x = N_x$. Integrating $M$ in $x$ gives $F = y\sin x + x^2 + h(y)$. Then $F_y = \sin x + h''(y) = \sin x + 2y$, so $h(y) = y^2$.'
          - problem: 'A quantity $U(x, y)$ has $dU = (y\cosh x + 3x^2)\,dx + (\sinh x + 4y^3)\,dy$ and $U(0, 0) = 0$. Find $U(x, y)$.'
            answer: 'y sinh(x) + x^3 + y^4'
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: 'Integrating the $dx$ coefficient in $x$ gives $U = y\sinh x + x^3 + h(y)$. Then $U_y = \sinh x + h''(y)$ must equal $\sinh x + 4y^3$, so $h(y) = y^4$ plus a constant. Since $U(0, 0) = 0$, the constant is $0$.'
          - problem: 'The equation $(2x\sin y)\,dx + (x^2\cos y + 1)\,dy = 0$ is exact. Find a function $F(x, y)$ with $F(x, y) = C$ as its solutions.'
            answer: 'x^2 sin(y) + y'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'Integrate $M = 2x\sin y$ in $x$ to get $F = x^2\sin y + h(y)$. Then $F_y = x^2\cos y + h''(y)$ must equal $x^2\cos y + 1$, so $h''(y) = 1$. Hence $F = x^2\sin y + y$.'
          - problem: 'The solution curves of $(2x + y)\,dx + (x + 2y)\,dy = 0$ are the level curves of a function $F$ with $F(0, 0) = 0$. Find $F(1, 2)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation is exact and $F = x^2 + xy + y^2 + K$. Since $F(0, 0) = 0$, we get $K = 0$. Then $F(1, 2) = 1 + 2 + 4 = 7$.'
          - problem: 'A metal plate has a temperature $T(x, y)$ with $\dfrac{\partial T}{\partial x} = 3x^2y + 2$ and $\dfrac{\partial T}{\partial y} = x^3 + 4y$. Find a function $T(x, y)$ with these partial derivatives.'
            answer: 'x^3 y + 2x + 2y^2'
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x", "y"]}
            solution_sketch: 'Integrate $3x^2y + 2$ in $x$ to get $T = x^3y + 2x + h(y)$. Then $T_y = x^3 + h''(y)$ must equal $x^3 + 4y$, so $h(y) = 2y^2$. Hence $T = x^3y + 2x + 2y^2$.'
        constraints: "always verify exactness first; F recoverable with one integration in x plus matching h(y); leave the answer implicit as F(x,y) = C"
      - id: kp3
        name: Exact IVPs
        key_prerequisites: [partial-derivatives]
        step_check:
          step: 'Evaluate $F$ at $(0, 2)$'
          question: 'Why do we evaluate $F$ at $(0, 2)$ to find $C$?'
          options:
            - 'Because the function $F$ is only defined at the single starting point of the interval for $x$'
            - 'Because the curve $F(x, y) = C$ must pass through the point $(0, 2)$ from $y(0) = 2$'
            - 'Because setting $x = 0$ removes the unknown function $g(y)$ from $F$ and leaves only $y^2$'
            - 'Because $C$ is defined as the sum of the two coordinates of the given initial point'
          answer: 'Because the curve $F(x, y) = C$ must pass through the point $(0, 2)$ from $y(0) = 2$'
          why: 'The initial condition $y(0) = 2$ says the solution curve contains the point $(0, 2)$. So $F(0, 2)$ must equal $C$.'
        exemplars:
          - problem: 'The equation $(3x^2 + 2y)\,dx + (2x + 2y)\,dy = 0$ is exact, and its solutions satisfy $F(x, y) = C$. Find $C$ for the solution with $y(1) = 1$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Integrating $M$ in $x$ and matching $N$ gives $F = x^3 + 2xy + y^2$. The solution through $(1, 1)$ has $C = F(1, 1)$. So $C = 1 + 2 + 1 = 4$.'
          - problem: 'Solve the initial value problem $(2xy + 3x^2)\,dx + x^2\,dy = 0$, $y(1) = 2$.'
            answer: '3/x^2 - x'
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: 'The equation is exact with $F = x^2y + x^3$. The condition $y(1) = 2$ gives $F(1, 2) = 2 + 1 = 3$, so $x^2y + x^3 = 3$. Solving for $y$ gives $y = 3/x^2 - x$.'
          - problem: 'A function $U(x, y)$ satisfies $dU = (3x^2 + 2y)\,dx + (2x + 2y)\,dy$ and $U(0, 0) = 5$. Find $U(1, 1)$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The potential is $U = x^3 + 2xy + y^2 + K$. From $U(0, 0) = 5$ we get $K = 5$. Then $U(1, 1) = 1 + 2 + 1 + 5 = 9$.'
          - problem: 'The height $h(x, y)$ of a hillside, in meters, has slopes $\dfrac{\partial h}{\partial x} = 2xy + 3x^2$ and $\dfrac{\partial h}{\partial y} = x^2 + 4y$, and $h(0, 0) = 0$. Find the height at the point $(1, 2)$.'
            answer: '11'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Integrating $2xy + 3x^2$ in $x$ gives $h = x^2y + x^3 + g(y)$. Matching the $y$ slope gives $g(y) = 2y^2$. Since $h(0, 0) = 0$, we get $h(1, 2) = 2 + 1 + 8 = 11$ meters.'
          - problem: 'Solve $(y\cos x + 1)\,dx + \sin x\,dy = 0$ with $y(\pi/2) = 3$, and find $y(\pi/6)$.'
            answer: '6 + 2pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation is exact with $F = y\sin x + x$. From $y(\pi/2) = 3$ we get $C = 3 + \pi/2$. At $x = \pi/6$ we have $\frac{y}{2} + \frac{\pi}{6} = 3 + \frac{\pi}{2}$, so $y = 6 + 2\pi/3$.'
          - problem: 'Sam solves $(2xy + 3x^2)\,dx + (x^2 + 4y)\,dy = 0$ with $y(1) = 2$. He finds $F = x^2y + x^3 + 2y^2$ and then substitutes $x = 2$ and $y = 1$, getting $C = 14$. What is the correct value of $C$?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The initial condition $y(1) = 2$ means $x = 1$ and $y = 2$. Then $C = F(1, 2) = 2 + 1 + 8 = 11$. Sam swapped the two coordinates and got $F(2, 1) = 14$.'
          - problem: 'The exact equation $(ye^x + 2x)\,dx + (e^x + 2y)\,dy = 0$ has solutions $F(x, y) = C$. Find $C$ for the solution with $y(0) = 1$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Integrating $M$ in $x$ and matching $N$ gives $F = ye^x + x^2 + y^2$. Then $C = F(0, 1) = 1 + 0 + 1 = 2$.'
          - problem: 'The exact equation $(2x + y)\,dx + (x + 2y)\,dy = 0$ has solutions $F(x, y) = C$. Find $C$ for the solution with $y(0) = 1$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Integrating $M$ in $x$ and matching $N$ gives $F = x^2 + xy + y^2$. Then $C = F(0, 1) = 0 + 0 + 1 = 1$.'
          - problem: 'The potential energy $U(x, y)$ of a particle has $\dfrac{\partial U}{\partial x} = 2xy + 4$ and $\dfrac{\partial U}{\partial y} = x^2 + 3y^2$, and $U(0, 0) = 1$. Find $U(2, 1)$.'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Integrating $2xy + 4$ in $x$ gives $U = x^2y + 4x + g(y)$. Matching the $y$ slope gives $g(y) = y^3 + K$, and $U(0, 0) = 1$ gives $K = 1$. Then $U(2, 1) = 4 + 8 + 1 + 1 = 14$.'
        constraints: "leave answers implicit; the constant is fixed by evaluating F at the initial point"
    diagnostic_exemplar:
      problem: 'Solve $(2xy - 3x^2)\,dx + (x^2 + 2y)\,dy = 0$ with $y(1) = 2$.'
      answer: '$x^2 y - x^3 + y^2 = 5$'
      answer_contract: {kind: none}
      solution_sketch: '$M_y = 2x = N_x$, so the equation is exact; $F = x^2y - x^3 + y^2$ satisfies $F_x = M$ and $F_y = N$. Then $F(1,2) = 2 - 1 + 4 = 5$.'
