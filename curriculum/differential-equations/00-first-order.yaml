        key: false
    knowledge_points:
      - id: kp1
        name: Initial value problems
        key_prerequisites: [separation-of-variables, integration-substitution]
        exemplars:
          - problem: "Solve $y' = 2xy$ with $y(0) = 3$."
            answer: "$y = 3e^{x^2}$"
            solution_sketch: "The general solution is $y = Ce^{x^2}$; the initial condition gives $C = 3$."
          - problem: 'Solve $\frac{dy}{dx} = \frac{\cos x}{y}$ with $y(0) = 1$.'
            answer: '$y = \sqrt{2\sin x + 1}$'
            solution_sketch: '$y\,dy = \cos x\,dx$ gives $\frac{y^2}{2} = \sin x + C$; $y(0) = 1$ forces $C = \frac{1}{2}$, so $y^2 = 2\sin x + 1$; take the positive root since $y(0) > 0$. Valid on the interval about $x = 0$ where $2\sin x + 1 > 0$, i.e. $(-\pi/6,\ 7\pi/6)$.'
          - problem: "Solve $y' = e^{x-y}$ with $y(0) = 0$."
            answer: "$y = x$"
            solution_sketch: "Separate: $e^y dy = e^x dx$, so $e^y = e^x + C$; the initial condition gives $C = 0$, hence $e^y = e^x$ and $y = x$."
        constraints: "initial condition pins one constant; choose data so the sign of any root is determined; answers exact"
      - id: kp2
        name: Implicit solutions and branch selection
        key_prerequisites: [separation-of-variables]
        exemplars:
          - problem: "Solve $y' = \\dfrac{2x + 1}{2y}$ with $y(0) = -1$."
            answer: '$y = -\sqrt{x^2 + x + 1}$'
            solution_sketch: '$2y\,dy = (2x+1)\,dx$ gives $y^2 = x^2 + x + C$; $y(0) = -1$ forces $C = 1$, and the negative initial value selects the negative root.'
          - problem: "Solve $y\\,y' = x$ with $y(1) = -2$."
            answer: '$y = -\sqrt{x^2 + 3}$'
            solution_sketch: '$y^2 = x^2 + C$ with $C = 3$; take the negative branch since $y(1) < 0$.'
          - problem: "A separable equation is y' = -x/y. Find the left side F(x, y) of an implicit general solution written as F(x, y) = C."
            answer: "x^2+y^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Separate variables: y dy = -x dx. Integrate both sides: y^2/2 = -x^2/2 + K. Multiply by 2 and collect terms to write x^2 + y^2 = C. The left side F is x^2+y^2."
          - problem: "Solve y' = (2x + 3)/(2y) with y(0) = 2. Give the explicit solution y as a function of x."
            answer: "sqrt(x^2+3x+4)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: 2y dy = (2x + 3) dx. Integrate: y^2 = x^2 + 3x + C. The condition y(0) = 2 gives 4 = C, so y^2 = x^2 + 3x + 4. Since the initial value is positive, select the positive branch: sqrt(x^2+3x+4)."
          - problem: "A separable equation is y' = e^x/y. Find the left side F(x, y) of an implicit general solution written as F(x, y) = C."
            answer: "y^2-2e^(x)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Separate variables: y dy = e^x dx. Integrate: y^2/2 = e^x + K. Multiply by 2 and collect terms to write y^2 - 2e^x = C. The left side F is y^2-2e^(x)."
          - problem: "Solve y' = x^2/y with y(0) = -1. Give the explicit solution y as a function of x."
            answer: "-sqrt(2x^3/3+1)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: y dy = x^2 dx. Integrate: y^2/2 = x^3/3 + C. The condition y(0) = -1 gives 1/2 = C, so y^2 = 2x^3/3 + 1. The negative initial value selects the negative branch: -sqrt(2x^3/3+1)."
        constraints: "implicit solutions left as F(x,y) = C when no clean explicit form; when solving explicitly, the initial sign picks the branch"
      - id: kp3
        name: Constant solutions and intervals of validity
        key_prerequisites: [separation-of-variables]
        exemplars:
          - problem: "Find the positive constant solution of y' = y^2 - 9. Give the y-value."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A constant solution has y' = 0, so set h(y) = y^2 - 9 equal to zero. Factor the difference of squares: (y - 3)(y + 3) = 0, so the integer zeros are y = 3 and y = -3. Each value makes the right side zero for every x, so both are constant solutions. The positive constant solution is 3."
          - problem: "Solve y' = y^2 with y(0) = 1/2. Give the interval of validity as an inequality in x."
            answer: "x < 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Separate variables: dy/y^2 = dx. Integrate both sides: -1/y = x + C. Apply the initial condition y(0) = 1/2: -2 = C, so -1/y = x - 2 and y = 1/(2 - x). The branch formula blows up where 2 - x = 0, that is at x = 2, so the maximal interval containing x0 = 0 is x < 2."
          - problem: "When solving y' = y^2 - 4 by dividing both sides by y + 2, which constant solution is lost? Give the y-value."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The constant solutions of y' = y^2 - 4 are the integer zeros of h(y) = (y - 2)(y + 2), namely y = 2 and y = -2. Dividing both sides by y + 2 is legitimate only where y is not -2, so the constant branch y = -2 disappears from the separated equation. The lost constant solution is -2."
          - problem: "Solve y' = y^2 with y(0) = 1/4 and find the blow-up point, the right endpoint of its interval of validity."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Separate variables: dy/y^2 = dx. Integrate: -1/y = x + C. Apply y(0) = 1/4: -4 = C, so -1/y = x - 4 and y = 1/(4 - x). The branch formula blows up where the denominator 4 - x = 0, so the blow-up point at the right end of the interval of validity is 4."
          - problem: "Solve y' = 2 sqrt(y) with y(1) = 1. Give the interval of validity as an inequality in x."
            answer: "0 <= x"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Separate variables: dy/(2 sqrt(y)) = dx. Integrate: sqrt(y) = x + C. Apply y(1) = 1: 1 = 1 + C, so C = 0 and the branch is y = x^2. The branch formula degenerates at x = 0, where y = 0 and the right side 2 sqrt(y) vanishes; for x < 0 the branch would need y' = 2x < 0 while 2 sqrt(y) > 0, which is impossible. The interval of validity is 0 <= x."
          - problem: "Solve y' = e^y with y(0) = 0. Give the interval of validity as an inequality in x."
            answer: "x < 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Separate variables: e^(-y) dy = dx. Integrate: -e^(-y) = x + C. Apply y(0) = 0: -1 = C, so e^(-y) = 1 - x and y = -ln(1 - x). The branch formula blows up where 1 - x = 0, that is at x = 1, so the maximal interval containing x0 = 0 is x < 1."
        constraints: "constant solutions are integer zeros of h(y); intervals of validity bounded by blow-up points or where the branch formula degenerates"
    diagnostic_exemplar:
      problem: 'Solve $y'' = -\dfrac{x}{y}$ with $y(0) = -3$, and state the interval of validity.'
      answer: '$y = -\sqrt{9 - x^2}$ on $(-3, 3)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Separating gives $y\,dy = -x\,dx$, so $y^2 = 9 - x^2$. The initial value $y(0) = -3$ selects the negative branch, and the square root is real (and $y \neq 0$) only for $|x| < 3$.'
    anki_seeds:
      - front: "When you divide a separable equation by h(y), you may lose..."
        back: "the constant solutions y = c where h(c) = 0 — check for them separately."
        type: basic
      - front: "After solving y^2 = F(x) + C in an IVP, the branch (sign of the root) is chosen by..."
        back: "the sign of the initial value y(x0)."
        type: basic

  - id: integrating-factor-computation
    name: Computing Integrating Factors
    core: true
    difficulty: 0.63
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: derivatives-exp-log
        weight: 0.5
        key: true
      - id: separation-of-variables
        weight: 0.3
        key: false
      - id: logarithm-properties
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Standard form
        key_prerequisites: [separation-of-variables]
        exemplars:
          - problem: "Write $xy' - y = x^2$ ($x > 0$) in standard form $y' + P(x)y = Q(x)$. Give $P(x)$ and $Q(x)$."
            answer: "P = -1/x; Q = x"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "P"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "Q"}]}
            solution_sketch: "Start with the equation $xy' - y = x^2$. Step 1: divide every term by the leading coefficient $x$ to get $y' - (1/x)y = x$. Step 2: compare with the pattern $y' + P(x)y = Q(x)$ to read off $P(x) = -1/x$ and $Q(x) = x$. The answer is P = -1/x; Q = x."
          - problem: "Write $3y' + 6xy = 12x^2$ in standard form $y' + P(x)y = Q(x)$. Give $P(x)$ and $Q(x)$."
            answer: "P = 2x; Q = 4x^2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "P"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "Q"}]}
            solution_sketch: "Start with the equation $3y' + 6xy = 12x^2$. Step 1: divide every term by the leading coefficient $3$ to get $y' + 2xy = 4x^2$. Step 2: compare with the pattern $y' + P(x)y = Q(x)$ to read off $P(x) = 2x$ and $Q(x) = 4x^2$. The answer is P = 2x; Q = 4x^2."
          - problem: "Write $y' = 5x^3 - 3xy$ in standard form $y' + P(x)y = Q(x)$. Give $P(x)$ and $Q(x)$."
            answer: "P = 3x; Q = 5x^3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "P"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "Q"}]}
            solution_sketch: "Start with the equation $y' = 5x^3 - 3xy$. Step 1: add $3xy$ to both sides so the $y$ term sits on the left, giving $y' + 3xy = 5x^3$. Step 2: compare with the pattern $y' + P(x)y = Q(x)$ to read off $P(x) = 3x$ and $Q(x) = 5x^3$. The answer is P = 3x; Q = 5x^3."
          - problem: "Write $x^2y' + 3xy = x^4$ ($x > 0$) in standard form $y' + P(x)y = Q(x)$. Give $P(x)$ and $Q(x)$."
            answer: "P = 3/x; Q = x^2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "P"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "Q"}]}
            solution_sketch: "Start with the equation $x^2y' + 3xy = x^4$. Step 1: divide every term by the leading coefficient $x^2$ to get $y' + (3/x)y = x^2$. Step 2: compare with the pattern $y' + P(x)y = Q(x)$ to read off $P(x) = 3/x$ and $Q(x) = x^2$. The answer is P = 3/x; Q = x^2."
          - problem: "Write $x^3y' + 5x^2y = 2x^5$ ($x > 0$) in standard form $y' + P(x)y = Q(x)$. Give $P(x)$ and $Q(x)$."
            answer: "P = 5/x; Q = 2x^2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "P"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "Q"}]}
            solution_sketch: "Start with the equation $x^3y' + 5x^2y = 2x^5$. Step 1: divide every term by the leading coefficient $x^3$ to get $y' + (5/x)y = 2x^2$. Step 2: compare with the pattern $y' + P(x)y = Q(x)$ to read off $P(x) = 5/x$ and $Q(x) = 2x^2$. The answer is P = 5/x; Q = 2x^2."
          - problem: "Write $xy' + 2y = e^x$ ($x > 0$) in standard form $y' + P(x)y = Q(x)$. Give $P(x)$ and $Q(x)$."
            answer: "P = 2/x; Q = e^(x)/x"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "P"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "Q"}]}
            solution_sketch: "Start with the equation $xy' + 2y = e^x$. Step 1: divide every term by the leading coefficient $x$ to get $y' + (2/x)y = e^x/x$. Step 2: compare with the pattern $y' + P(x)y = Q(x)$ to read off $P(x) = 2/x$ and $Q(x) = e^(x)/x$. The answer is P = 2/x; Q = e^(x)/x."
        constraints: "leading coefficient constant or a power of x; always divide through before reading off P and Q"
      - id: kp2
        name: "Computing $\\mu = e^{\\int P\\,dx}$"
        key_prerequisites: [derivatives-exp-log, logarithm-properties]
        exemplars:
          - problem: "Find an integrating factor for y' + 3y = e^x."
            answer: "e^(3x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = 3, so mu = e^(integral of 3 dx). The constant-integral rule gives 3x. Exponentiating gives mu = e^(3x). The integrating factor is e^(3x)."
          - problem: "Find an integrating factor for y' + (3/x)y = x on x > 0."
            answer: "x^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = 3/x, so mu = e^(integral of 3/x dx). The reciprocal rule gives 3 ln(x). The exponent-log identity gives e^(3 ln(x)) = x^3. The integrating factor is x^3."
          - problem: "Find an integrating factor for y' + cos(x) y = cos(x)."
            answer: "e^(sin(x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = cos(x), so mu = e^(integral of cos(x) dx). The trigonometric integral rule gives sin(x). Exponentiating gives mu = e^(sin(x)). The integrating factor is e^(sin(x))."
          - problem: "Find an integrating factor for y' - 4y = x."
            answer: "e^(-4x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = -4, so mu = e^(integral of -4 dx). The constant-integral rule gives -4x. Exponentiating gives mu = e^(-4x). The integrating factor is e^(-4x)."
          - problem: "Find an integrating factor for y' + (4/x)y = x^2 on x > 0."
            answer: "x^4"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = 4/x, so mu = e^(integral of 4/x dx). The reciprocal rule gives 4 ln(x). The exponent-log identity gives e^(4 ln(x)) = x^4. The integrating factor is x^4."
          - problem: "Find an integrating factor for y' + 2x y = x."
            answer: "e^(x^2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = 2x, so mu = e^(integral of 2x dx). The power rule for integrals gives x^2. Exponentiating gives mu = e^(x^2). The integrating factor is e^(x^2)."
        constraints: "P(x) constant, k/x, or an easily integrated function; simplify e^{k ln x} to x^k"
      - id: kp3
        name: Verifying the product-rule collapse
        key_prerequisites: [derivatives-exp-log]
        exemplars:
          - problem: "After multiplying y' + 2y = e^x by mu = e^(2x), expand the left side (mu y)' by the product rule in the form mu y' + B y. Give B as a function of x."
            answer: "2e^(2x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is (mu y)' with mu = e^(2x). Step 1: the product rule gives (mu y)' = mu' y + mu y'. Step 2: the exponential rule gives mu' = 2e^(2x), so the expansion is 2e^(2x) y + e^(2x) y'. Step 3: in the form mu y' + B y this is e^(2x) y' + B y with B = 2e^(2x); since B = mu' = 2 mu, the collapse mu' = P mu holds. The final answer is B = 2e^(2x)."
          - problem: "For x > 0, multiply y' + (2/x) y = x^2 by mu = x^2 and expand the left side (mu y)' by the product rule in the form mu y' + B y. Give B as a function of x."
            answer: "2x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is (mu y)' with mu = x^2. Step 1: the product rule gives (mu y)' = mu' y + mu y'. Step 2: the power rule gives mu' = 2x, so the expansion is 2x y + x^2 y'. Step 3: in the form mu y' + B y this is x^2 y' + 2x y, so B = 2x = (2/x) mu, which is the collapse mu' = P mu. The final answer is B = 2x."
          - problem: "The equation y' + 5y = tan(x) has integrating factor mu = e^(5x). After multiplying, the product rule rewrites the left side as (mu y)' = mu y' + P mu y. Find the number P."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is (mu y)' with mu = e^(5x). Step 1: the product rule gives (mu y)' = mu' y + mu y'. Step 2: the exponential rule gives mu' = 5e^(5x) = 5 mu. Step 3: factoring mu out gives (mu y)' = mu y' + 5 mu y, so comparing with mu y' + P mu y shows P = 5; this is the collapse mu' = P mu. The final answer is P = 5."
          - problem: "For x > 0, the equation y' + (4/x) y = x^3 has integrating factor mu = x^4. After multiplying, the product rule rewrites the left side as (mu y)' = mu y' + P mu y. Find P as a function of x."
            answer: "4/x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is (mu y)' with mu = x^4. Step 1: the product rule gives (mu y)' = mu' y + mu y'. Step 2: the power rule gives mu' = 4x^3. Step 3: since 4x^3 = (4/x) x^4 = P mu, the identity (mu y)' = mu y' + P mu y holds with P = 4/x, which is the collapse mu' = P mu. The final answer is P = 4/x."
          - problem: "The equation y' + 2x y = x has integrating factor mu = e^(x^2). After multiplying, the product rule rewrites the left side as (mu y)' = mu y' + P mu y. Find P as a function of x."
            answer: "2x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is (mu y)' with mu = e^(x^2). Step 1: the product rule gives (mu y)' = mu' y + mu y'. Step 2: the chain rule on the exponential gives mu' = 2x e^(x^2). Step 3: since 2x e^(x^2) = 2x mu, the identity (mu y)' = mu y' + P mu y holds with P = 2x, which is the collapse mu' = P mu. The final answer is P = 2x."
          - problem: "The equation y' - 3y = e^(2x) has integrating factor mu = e^(-3x). After multiplying, the product rule rewrites the left side as (mu y)' = mu y' + P mu y. Find the number P."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is (mu y)' with mu = e^(-3x). Step 1: the product rule gives (mu y)' = mu' y + mu y'. Step 2: the exponential rule gives mu' = -3e^(-3x) = -3 mu. Step 3: factoring mu out gives (mu y)' = mu y' - 3 mu y, so comparing with mu y' + P mu y shows P = -3; this is the collapse mu' = P mu. The final answer is P = -3."
        constraints: "one product-rule expansion; the point is mu' = P mu"
    diagnostic_exemplar:
      problem: 'Write $xy'' + 3y = x^2$ ($x > 0$) in standard form, find its integrating factor $\mu$, and show that multiplying by $\mu$ turns the left side into $(\mu y)''$.'
      answer: 'Standard form $y'' + \dfrac{3}{x}y = x$, so $\mu = e^{\int 3/x\,dx} = x^3$; and $x^3\left(y'' + \frac{3}{x}y\right) = x^3 y'' + 3x^2 y = (x^3 y)''$.'
      answer_contract: {kind: none}
      solution_sketch: 'Divide by $x$ to reach standard form, integrate $P = 3/x$, then check the product rule.'
    anki_seeds:
      - front: "Integrating factor for y' + P(x)y = Q(x)?"
        back: '$\mu(x) = e^{\int P(x)\,dx}$'
        type: basic
      - front: '$e^{k\ln x}$ simplifies to...'
        back: '$x^k$'
        type: basic

  - id: linear-first-order-integrating-factor
    name: Linear First-Order Equations
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: integrating-factor-computation
        weight: 0.7
        key: true
      - id: integration-by-parts
        weight: 0.5
        key: true
      - id: separable-equations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Solving via the product-rule collapse
        key_prerequisites: [integrating-factor-computation]
        exemplars:
          - problem: "Find the general solution of y' + 2y = e^x. Give the answer as a formula in x with an arbitrary constant c."
            answer: "e^x/3 + c e^(-2x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): integrate the coefficient 2 to get mu = e^(2x). Step 2 (product-rule collapse): multiply both sides by mu so the left side is the derivative (e^(2x) y)' = e^(3x). Step 3 (integrate): e^(2x) y = e^(3x)/3 + c. Step 4 (solve for y): divide by e^(2x). The general solution is y = e^x/3 + c e^(-2x)."
          - problem: "On x > 0, find the general solution of y' + y/x = x. Give the answer as a formula in x with an arbitrary constant c."
            answer: "x^2/3 + c/x"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): on x > 0, integrating 1/x gives mu = x. Step 2 (product-rule collapse): multiply both sides by x so the left side is (x y)' = x^2. Step 3 (integrate): x y = x^3/3 + c. Step 4 (solve for y): divide by x. The general solution is y = x^2/3 + c/x."
          - problem: "Find the general solution of y' + 3y = 6. Give the answer as a formula in x with an arbitrary constant c."
            answer: "2 + c e^(-3x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): integrate the constant 3 to get mu = e^(3x). Step 2 (product-rule collapse): multiply both sides by mu so (e^(3x) y)' = 6 e^(3x). Step 3 (integrate): e^(3x) y = 2 e^(3x) + c. Step 4 (solve for y): divide by e^(3x). The general solution is y = 2 + c e^(-3x)."
          - problem: "Find the general solution of y' + y = e^(2x). Give the answer as a formula in x with an arbitrary constant c."
            answer: "e^(2x)/3 + c e^(-x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): integrate the coefficient 1 to get mu = e^x. Step 2 (product-rule collapse): multiply both sides by mu so (e^x y)' = e^(3x). Step 3 (integrate): e^x y = e^(3x)/3 + c. Step 4 (solve for y): divide by e^x. The general solution is y = e^(2x)/3 + c e^(-x)."
          - problem: "Find the general solution of y' - 2y = e^(3x). Give the answer as a formula in x with an arbitrary constant c."
            answer: "e^(3x) + c e^(2x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): integrate the coefficient -2 to get mu = e^(-2x). Step 2 (product-rule collapse): multiply both sides by mu so (e^(-2x) y)' = e^x. Step 3 (integrate): e^(-2x) y = e^x + c. Step 4 (solve for y): multiply by e^(2x). The general solution is y = e^(3x) + c e^(2x)."
          - problem: "On x > 0, find the general solution of y' + y/x = x^2. Give the answer as a formula in x with an arbitrary constant c."
            answer: "x^3/4 + c/x"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): on x > 0, integrating 1/x gives mu = x. Step 2 (product-rule collapse): multiply both sides by x so (x y)' = x^3. Step 3 (integrate): x y = x^4/4 + c. Step 4 (solve for y): divide by x. The general solution is y = x^3/4 + c/x."
        constraints: "right side polynomial or e^{kx} integrating in one step; answers carry an explicit C"
      - id: kp2
        name: Forcing that needs integration by parts
        key_prerequisites: [integration-by-parts, integrating-factor-computation]
        exemplars:
          - problem: "Find the general solution of $y' - y = x$. Write the arbitrary constant as $c$ and give $y$ as a function of $x$."
            answer: "-x - 1 + c*e^(x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): multiply by e^(-x), so (e^(-x) y)' = x e^(-x). Step 2 (integration by parts): with u = x and dv = e^(-x) dx, the antiderivative of x e^(-x) is -(x + 1) e^(-x). Step 3 (general solution): e^(-x) y = -(x + 1) e^(-x) + C, so y = -x - 1 + c*e^(x)."
          - problem: "Find the general solution of $y' - 2y = x e^{3x}$. Write the arbitrary constant as $c$ and give $y$ as a function of $x$."
            answer: "(x - 1)*e^(3x) + c*e^(2x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): multiply by e^(-2x), so (e^(-2x) y)' = x e^(x). Step 2 (integration by parts): integrate x e^x with u = x, dv = e^x dx to get (x - 1) e^x. Step 3 (general solution): e^(-2x) y = (x - 1) e^x + C, so the full solution is y = (x - 1)*e^(3x) + c*e^(2x)."
          - problem: "Find the general solution of $y' + y = \\sin x$. Write the arbitrary constant as $c$ and give $y$ as a function of $x$."
            answer: "(sin(x) - cos(x))/2 + c*e^(-x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): multiply by e^x, so (e^x y)' = e^x sin x. Step 2 (integration by parts, twice): integrate e^x sin x to get e^x (sin x - cos x)/2. Step 3 (general solution): y = (sin x - cos x)/2 + C e^(-x), that is (sin(x) - cos(x))/2 + c*e^(-x)."
          - problem: "Find the general solution of $y' - 3y = \\cos(2x)$. Write the arbitrary constant as $c$ and give $y$ as a function of $x$."
            answer: "(-3*cos(2x) + 2*sin(2x))/13 + c*e^(3x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): multiply by e^(-3x), so (e^(-3x) y)' = e^(-3x) cos(2x). Step 2 (integration by parts, twice): integrate e^(-3x) cos(2x) to get e^(-3x)(-3 cos(2x) + 2 sin(2x))/13. Step 3 (general solution): the full solution is y = (-3*cos(2x) + 2*sin(2x))/13 + c*e^(3x)."
          - problem: "Find the general solution of $y' + 2y = x^2$. Write the arbitrary constant as $c$ and give $y$ as a function of $x$."
            answer: "x^2/2 - x/2 + 1/4 + c*e^(-2x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): multiply by e^(2x), so (e^(2x) y)' = x^2 e^(2x). Step 2 (integration by parts, twice): integrate x^2 e^(2x) to get e^(2x)(x^2/2 - x/2 + 1/4). Step 3 (general solution): the full solution is y = x^2/2 - x/2 + 1/4 + c*e^(-2x)."
          - problem: "Find the general solution of $2y' + 4y = \\sin x$ by first dividing by the coefficient of $y'$. Write the arbitrary constant as $c$ and give $y$ as a function of $x$."
            answer: "(2*sin(x) - cos(x))/10 + c*e^(-2x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (standard form): divide by 2 to get y' + 2y = sin(x)/2. Step 2 (integrating factor): multiply by e^(2x), so (e^(2x) y)' = e^(2x) sin(x)/2. Step 3 (integration by parts, twice): integrate e^(2x) sin x to get e^(2x)(2 sin x - cos x)/5, and half of that is e^(2x)(2 sin x - cos x)/10. Step 4 (general solution): the full solution is y = (2*sin(x) - cos(x))/10 + c*e^(-2x)."
        constraints: "right side polynomial times e^{kx} or sin/cos; at most two integrations by parts"
      - id: kp3
        name: Linear IVPs
        key_prerequisites: [integrating-factor-computation, separable-equations]
        exemplars:
          - problem: "Solve $y' + 3y = 6$ with $y(0) = 4$."
            answer: "$y = 2 + 2e^{-3x}$"
            solution_sketch: "The constant solution is $y = 2$, so $y = 2 + Ce^{-3x}$; $y(0) = 4$ gives $C = 2$."
          - problem: "Solve xy' + y = sin(x) with y(pi/2) = 2/pi. Find y as a function of x."
            answer: "(1-cos(x))/x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is xy' + y = sin(x) with y(pi/2) = 2/pi. Product rule collapse: the left side is (xy)', so (xy)' = sin(x). Integrate: xy = -cos(x) + C. Initial condition: (pi/2)(2/pi) = 1 and -cos(pi/2) = 0, so C = 1. Divide by x: y = (1-cos(x))/x."
          - problem: "Solve y' + 2y = 4 with y(0) = 3. Find y as a function of x."
            answer: "2+exp(-2x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is y' + 2y = 4 with y(0) = 3. Integrating factor rule: multiplying by e^(2x) collapses the left side to (e^(2x)y)' = 4e^(2x). Integrate: e^(2x)y = 2e^(2x) + C, so y = 2 + Ce^(-2x). Initial condition: 3 = 2 + C gives C = 1. Thus y = 2+exp(-2x)."
          - problem: "Solve y' - y = 1 with y(0) = 0. Find y as a function of x."
            answer: "e^(x)-1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is y' - y = 1 with y(0) = 0. Integrating factor rule: multiplying by e^(-x) collapses the left side to (e^(-x)y)' = e^(-x). Integrate: e^(-x)y = -e^(-x) + C. Initial condition: 0 = -1 + C, so C = 1. Multiply by e^(x): y = e^(x)-1."
          - problem: "Solve y' + y = x with y(0) = 1. Find y as a function of x."
            answer: "x-1+2exp(-x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is y' + y = x with y(0) = 1. Integrating factor rule: multiplying by e^(x) collapses the left side to (e^(x)y)' = xe^(x). Integration by parts gives e^(x)y = (x-1)e^(x) + C, so y = x - 1 + Ce^(-x). Initial condition: 1 = -1 + C gives C = 2. Thus y = x-1+2exp(-x)."
          - problem: "Solve y' + y/x = x with y(1) = 2. Find y as a function of x."
            answer: "x^2/3+5/(3x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is y' + y/x = x with y(1) = 2. Integrating factor rule: e^(ln(x)) = x collapses the left side to (xy)' = x^2. Integrate: xy = x^3/3 + C. Initial condition: 2 = 1/3 + C, so C = 5/3. Divide by x: y = x^2/3+5/(3x)."
        constraints: "initial data chosen so C is a clean rational; recognize (xy)' and (e^{kx}y)' collapses"
    diagnostic_exemplar:
      problem: 'Solve $y'' - y = x$ with $y(0) = 2$.'
      answer: '$y = -x - 1 + 3e^{x}$'
      solution_sketch: '$\mu = e^{-x}$ gives $(e^{-x}y)'' = xe^{-x}$; integrating by parts, $e^{-x}y = -(x+1)e^{-x} + C$, so $y = -(x+1) + Ce^{x}$. Then $y(0) = -1 + C = 2$ gives $C = 3$.'
    anki_seeds:
      - front: "After multiplying y' + Py = Q by its integrating factor, the left side becomes..."
        back: "the exact derivative (mu y)' — integrate both sides once."
        type: basic
      - front: "Solution formula for y' + P(x)y = Q(x)?"
        back: '$y = \dfrac{1}{\mu}\left(\int \mu Q\,dx + C\right)$ with $\mu = e^{\int P\,dx}$.'
        type: basic

  - id: bernoulli-equations
    name: Bernoulli Equations
    core: false                # special-case substitution subsumed by the linear first-order method
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: linear-first-order-integrating-factor
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The substitution $v = y^{1-n}$"
        key_prerequisites: [chain-rule, linear-first-order-integrating-factor]
        exemplars:
          - problem: "For $y' + y = y^2$, identify $n$, the substitution, and the resulting linear equation."
            answer: "$n = 2$; $v = y^{-1}$ gives $v' - v = -1$."
            answer_contract: {kind: none}
            solution_sketch: "Divide by $y^2$: $y^{-2}y' + y^{-1} = 1$; with $v = y^{-1}$, $v' = -y^{-2}y'$, so $-v' + v = 1$."
          - problem: "For $y' - y = xy^3$, find the substitution and the resulting linear equation."
            answer: "$v = y^{-2}$ gives $v' + 2v = -2x$."
            answer_contract: {kind: none}
            solution_sketch: "Divide by $y^3$: $y^{-3}y' - y^{-2} = x$; since $v' = -2y^{-3}y'$, this is $-\\tfrac{1}{2}v' - v = x$."
          - problem: 'What substitution turns $y'' + \dfrac{y}{x} = \sqrt{y}$ into a linear equation, and what equation results?'
            answer: '$v = \sqrt{y}$ gives $v'' + \dfrac{v}{2x} = \dfrac{1}{2}$.'
            answer_contract: {kind: none}
            solution_sketch: 'Here $n = \tfrac{1}{2}$, so $v = y^{1/2}$; writing $y = v^2$, $y'' = 2vv''$ and dividing by $2v$ gives the linear equation.'
        constraints: "n in {2, 3, 1/2}; the transformed equation must be stated in standard linear form"
      - id: kp2
        name: Complete solutions
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "Find the general solution of $y' + y = y^2$."
            answer: "$y = \\dfrac{1}{1 + Ce^{x}}$"
            answer_contract: {kind: none}
            solution_sketch: "$v = y^{-1}$ gives $v' - v = -1$, so $v = 1 + Ce^x$; invert."
          - problem: "Find the general solution of $y' + \\dfrac{y}{x} = y^2$ on $x > 0$."
            answer: "$y = \\dfrac{1}{x(C - \\ln x)}$"
            answer_contract: {kind: none}
            solution_sketch: "$v = y^{-1}$ gives $v' - \\dfrac{v}{x} = -1$; with $\\mu = 1/x$, $(v/x)' = -1/x$, so $v = x(C - \\ln x)$."
        constraints: "coefficients constant or k/x; the linear stage solves with one integrating factor; present y explicitly"
      - id: kp3
        name: Bernoulli IVPs
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "Solve y' + y = y^2 with y(0) = 2. State the solution explicitly."
            answer: "2/(2-e^(x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Let v = y^(-1); the Bernoulli substitution turns the equation into the linear equation v' - v = -1. The integrating factor e^(-x) gives v = C e^(x) + 1, and v(0) = 1/2 forces C = -1/2, so v = 1 - e^(x)/2. Since y = 1/v, the explicit solution is 2/(2-e^(x))."
          - problem: "Solve y' + y = 2y^3 with y(0) = 1/2. State the solution explicitly."
            answer: "1/sqrt(2e^(2x)+2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For n = 3, set v = y^(-2); the Bernoulli substitution turns the equation into the linear equation v' - 2v = -4. The integrating factor e^(-2x) gives v = C e^(2x) + 2, and v(0) = 4 forces C = 2, so v = 2e^(2x) + 2, which stays positive for every x. Since y = v^(-1/2), the explicit solution is 1/sqrt(2e^(2x)+2)."
          - problem: "Solve y' + 2y = y^2 with y(0) = 1. State the solution explicitly."
            answer: "2/(e^(2x)+1)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Let v = y^(-1); the Bernoulli substitution turns the equation into the linear equation v' - 2v = -1. The integrating factor e^(-2x) gives v = C e^(2x) + 1/2, and v(0) = 1 forces C = 1/2, so v = e^(2x)/2 + 1/2. Since y = 1/v, the explicit solution is 2/(e^(2x)+1)."
          - problem: "Solve y' - y = y^2 with y(0) = 2. State the solution explicitly."
            answer: "2/(3e^(-x)-2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Let v = y^(-1); the Bernoulli substitution turns the equation into the linear equation v' + v = -1. The integrating factor e^(x) gives v = C e^(-x) - 1, and v(0) = 1/2 forces C = 3/2, so v = (3/2)e^(-x) - 1. Since y = 1/v, the explicit solution is 2/(3e^(-x)-2)."
          - problem: "Solve y' + 2y = 2y^3 with y(0) = 1/2. State the solution explicitly."
            answer: "1/sqrt(3e^(4x)+1)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For n = 3, set v = y^(-2); the Bernoulli substitution turns the equation into the linear equation v' - 4v = -4. The integrating factor e^(-4x) gives v = C e^(4x) + 1, and v(0) = 4 forces C = 3, so v = 3e^(4x) + 1, which stays positive for every x. Since y = v^(-1/2), the explicit solution is 1/sqrt(3e^(4x)+1)."
          - problem: "Solve y' + 2y = 3y^2 with y(0) = 1. State the solution explicitly."
            answer: "2/(3-e^(2x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Let v = y^(-1); the Bernoulli substitution turns the equation into the linear equation v' - 2v = -3. The integrating factor e^(-2x) gives v = C e^(2x) + 3/2, and v(0) = 1 forces C = -1/2, so v = 3/2 - e^(2x)/2. Since y = 1/v, the explicit solution is 2/(3-e^(2x))."
        constraints: "initial data keeps v positive near x0; state the solution explicitly"
    diagnostic_exemplar:
      problem: 'Solve $y'' + y = y^2$ with $y(0) = 3$.'
      answer: '$y = \dfrac{3}{3 - 2e^{x}}$'
      answer_contract: {kind: none}
      solution_sketch: 'With $n = 2$, put $v = y^{-1}$: dividing by $y^2$ gives $-v'' + v = 1$, i.e. $v'' - v = -1$, whose solution is $v = 1 + Ce^{x}$. Then $y = \frac{1}{1 + Ce^x}$, and $y(0) = 3$ gives $C = -\frac{2}{3}$, i.e. $y = \frac{3}{3 - 2e^x}$.'
    anki_seeds:
      - front: "A Bernoulli equation has the form..."
        back: "$y' + P(x)y = Q(x)y^n$ with $n \\neq 0, 1$."
        type: basic
      - front: "Substitution that linearizes a Bernoulli equation?"
        back: '$v = y^{1-n}$ — it satisfies a linear first-order equation.'
        type: basic

  - id: homogeneous-first-order-substitution
    name: "Homogeneous Equations and the v = y/x Substitution"   # names are plain text (no KaTeX pass) — $…$ would render literally
    core: false                # special-case substitution; terminal
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: separable-equations
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Recognizing homogeneous equations
        key_prerequisites: [separable-equations]
        exemplars:
          - problem: "For the equation y' = (x + y)/x, write the right side as a function of v = y/x. Give the answer as a function of v."
            answer: "1+v"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with the right side (x + y)/x. Step 1: divide numerator and denominator by x, using algebra. Step 2: substitute v = y/x, using the definition of v. The result is 1+v."
          - problem: "For the equation y' = (x^2 + y^2)/(x y), write the right side as a function of v = y/x. Give the answer as a function of v."
            answer: "(1+v^2)/v"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with the right side (x^2 + y^2)/(x y). Step 1: divide top and bottom by x^2, using algebra. Step 2: substitute v = y/x, using the definition of v. The result is (1+v^2)/v."
          - problem: "For the equation y' = (x^2 + y^2)/x, decide whether the right side depends only on v = y/x, and give d, the degree of the numerator minus the degree of the denominator. Give the answer as verdict = label; d = value."
            answer: "verdict = nonhomogeneous; d = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["homogeneous"], ["nonhomogeneous"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Start with y' = (x^2 + y^2)/x. Step 1: read the degree of the numerator as 2. Step 2: read the degree of the denominator as 1. Step 3: subtract degrees to get d = 2 - 1 = 1. A nonzero mismatch means the right side is not a function of v alone. Choosing homogeneous is wrong because the remaining factor 1/x cannot be written with v only. verdict = nonhomogeneous; d = 1."
          - problem: "For the equation y' = (x^2 + y^2)/x^3, decide whether the right side depends only on v = y/x, and give d, the degree of the numerator minus the degree of the denominator. Give the answer as verdict = label; d = value."
            answer: "verdict = nonhomogeneous; d = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["homogeneous"], ["nonhomogeneous"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Start with y' = (x^2 + y^2)/x^3. Step 1: read the degree of the numerator as 2. Step 2: read the degree of the denominator as 3. Step 3: subtract degrees to get d = 2 - 3 = -1. A nonzero mismatch means the right side is not a function of v alone. Choosing homogeneous is wrong because the remaining factor 1/x remains after dividing. verdict = nonhomogeneous; d = -1."
          - problem: "For the equation y' = (x^3 + y^3)/(x y^2), write the right side as a function of v = y/x. Give the answer as a function of v."
            answer: "(1+v^3)/v^2"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with the right side (x^3 + y^3)/(x y^2). Step 1: divide top and bottom by x^3, using algebra. Step 2: rewrite y^2/x^2 as v^2. Step 3: substitute v = y/x. The result is (1+v^3)/v^2."
          - problem: "For the equation y' = (x^2 - y^2)/(x y), write the right side as a function of v = y/x. Give the answer as a function of v."
            answer: "(1-v^2)/v"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with the right side (x^2 - y^2)/(x y). Step 1: divide top and bottom by x^2, using algebra. Step 2: substitute v = y/x, using the definition of v. The result is (1-v^2)/v."
        constraints: "right sides are ratios of degree-matched polynomials (homogeneous) or degree-mismatched foils"
      - id: kp2
        name: The substitution mechanics
        key_prerequisites: [chain-rule, separable-equations]
        exemplars:
          - problem: "Substitute y = vx and y' = v + x v' into y' = 1 + y/x. Simplify to an equation of the form x v' = c and find the value of c."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with y' = 1 + y/x and substitute y = vx, so y' = v + x v' by the product rule. This gives v + x v' = 1 + v. Subtract v from both sides: x v' = 1. The answer is 1."
          - problem: "Substitute y = vx and y' = v + x v' into y' = (x^2 + y^2)/(xy). Simplify to an equation of the form x v' = R(v) and find R(v)."
            answer: "1/v"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with y' = (x^2 + y^2)/(xy). Put y = vx and y' = v + x v' by the product rule. Then v + x v' = (x^2 + v^2 x^2)/(x v x) = (1 + v^2)/v. Subtract v: x v' = 1/v. The answer is 1/v."
          - problem: "Substitute y = vx and y' = v + x v' into y' = (y^2 + 2xy)/x^2. Simplify to an equation of the form x v' = R(v) and find R(v)."
            answer: "v^2+v"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with y' = (y^2 + 2xy)/x^2. Put y = vx and y' = v + x v' by the product rule. Then v + x v' = v^2 + 2v. Subtract v: x v' = v^2 + v. The answer is v^2+v."
          - problem: "Substitute y = vx and y' = v + x v' into y' = (y - x)/x. Simplify to an equation of the form x v' = c and find the value of c."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with y' = (y - x)/x. Put y = vx and y' = v + x v' by the product rule. Then v + x v' = v - 1. Subtract v: x v' = -1. The answer is -1."
          - problem: "Substitute y = vx and y' = v + x v' into y' = (x + y)/(x - y). Simplify to an equation of the form x v' = R(v) and find R(v)."
            answer: "(1+v^2)/(1-v)"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with y' = (x + y)/(x - y). Put y = vx and y' = v + x v' by the product rule. Then v + x v' = (1 + v)/(1 - v). Subtract v: x v' = (1 + v)/(1 - v) - v = (1 + v^2)/(1 - v). The answer is (1+v^2)/(1-v)."
          - problem: "Substitute y = vx and y' = v + x v' into y' = (x^2 + 3y^2)/(2xy). Simplify to an equation of the form x v' = R(v) and find R(v)."
            answer: "(1+v^2)/(2v)"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with y' = (x^2 + 3y^2)/(2xy). Put y = vx and y' = v + x v' by the product rule. Then v + x v' = (x^2 + 3v^2 x^2)/(2x v x) = (1 + 3v^2)/(2v). Subtract v: x v' = (1 + 3v^2 - 2v^2)/(2v) = (1 + v^2)/(2v). The answer is (1+v^2)/(2v)."
        constraints: "always y = vx with y' = v + xv'; the result must be visibly separable in v and x"
      - id: kp3
        name: Complete solutions
        key_prerequisites: [separable-equations]
        exemplars:
          - problem: "Solve xy' = x + y for x > 0 with y(1) = 2. Give y explicitly as a function of x."
            answer: "x ln(x) + 2x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute v = y/x, so y = xv and y' = v + xv'. The equation xy' = x + y becomes x^2 v' = x, hence v' = 1/x by separation. Integrate to get v = ln(x) + C. The initial condition y(1) = 2 gives v(1) = 2, so C = 2. Back-substitute to obtain y = x ln(x) + 2x."
          - problem: "Solve y' = (x^2 + y^2)/(xy) for x > 0 with y(1) = 1. Give y explicitly as a function of x."
            answer: "x sqrt(2 ln(x) + 1)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute v = y/x, so y' = v + xv'. Then y' = (x^2 + y^2)/(xy) becomes x v' = 1/v. Separate and integrate: v^2/2 = ln(x) + C. The initial condition y(1) = 1 gives v(1) = 1, so the constant is 1. The positive branch is y = x sqrt(2 ln(x) + 1)."
          - problem: "Solve $y' = \\dfrac{x^2 + y^2}{xy}$ with $y(1) = 2$."
            answer: "$y = x\\sqrt{2\\ln x + 4}$"
            solution_sketch: "From $y^2 = x^2(2\\ln x + C)$, the condition $y(1) = 2$ gives $C = 4$; take the positive root."
          - problem: "Solve xy' = y - x for x > 0 with y(1) = 1. Give y explicitly as a function of x."
            answer: "x - x ln(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute v = y/x to write y' = v + xv'. The equation xy' = y - x becomes x^2 v' = -x, so v' = -1/x. Integrate to find v = -ln(x) + C. The condition y(1) = 1 forces C = 1, because v(1) = 1. Back-substitute to get y = x - x ln(x)."
          - problem: "Solve y' = (y^2 + xy)/x^2 for x > 0 with y(1) = 1. Give y explicitly as a function of x."
            answer: "x/(1 - ln(x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute v = y/x, so y' = v + xv'. The equation y' = (y^2 + xy)/x^2 becomes x v' = v^2. Separate to dv/v^2 = dx/x and integrate, giving -1/v = ln(x) + C. The initial condition y(1) = 1 gives v(1) = 1, so C = -1. Solving for v and back-substituting yields y = x/(1 - ln(x))."
          - problem: "Solve y' = (y^2 - x^2)/(xy) for x > 0 with y(1) = 2. Give y explicitly as a function of x."
            answer: "x sqrt(4 - 2 ln(x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute v = y/x, so y' = v + xv'. The equation y' = (y^2 - x^2)/(xy) becomes x v' = -1/v. Separate and integrate: v^2/2 = -ln(x) + C. The initial condition y(1) = 2 gives v(1) = 2, so C = 2. The positive branch is y = x sqrt(4 - 2 ln(x))."
        constraints: "v-integrations produce ln x or powers of v; back-substitute v = y/x and state y explicitly when a branch is determined"
    diagnostic_exemplar:
      problem: "Solve $xy' = y + x$ ($x > 0$) with $y(1) = 3$."
      answer: "$y = x\\ln x + 3x$"
      solution_sketch: "$v = y/x$ gives $v = \\ln x + C$ with $v(1) = 3$, so $C = 3$."
    anki_seeds:
      - front: "A first-order equation y' = f(x, y) is homogeneous when..."
        back: "f can be written as a function of v = y/x alone (equivalently f(tx, ty) = f(x, y))."
        type: basic
      - front: "The substitution y = vx turns a homogeneous equation into..."
        back: "a separable equation in v and x, using y' = v + xv'."
        type: basic

  - id: exact-equations
    name: Exact Equations
    core: false                # special-class technique; heads a terminal two-topic branch
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: partial-derivatives
        weight: 0.6
        key: true
      - id: implicit-differentiation
        weight: 0.4
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Testing exactness
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: "For the differential equation (2xy + 3) dx + (x^2 - 1) dy = 0, determine whether My = Nx, and give the common value of My and Nx at (1,2)."
            answer: "verdict = equal; value = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["equal"], ["differ"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Identify M = 2xy + 3 and N = x^2 - 1 from the equation. Compute the partial derivatives by the power rule: My = 2x and Nx = 2x, so they are equal. At (1,2), the common value is 2(1) = 2. The option 'differ' would come from missing that both partials are 2x. The answer is verdict = equal; value = 2."
          - problem: "For the differential equation y^2 dx + x dy = 0, determine whether My = Nx, and give My - Nx at (1,2)."
            answer: "verdict = differ; value = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["equal"], ["differ"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Identify M = y^2 and N = x from the equation. Compute the partial derivatives by the power rule: My = 2y and Nx = 1, so they differ. At (1,2), My - Nx = 2(2) - 1 = 3. The option 'equal' would come from treating 2y as 1. The answer is verdict = differ; value = 3."
          - problem: "For which constant $b$ is $(ye^x + 2x)\\,dx + be^x\\,dy = 0$ exact?"
            answer: "$b = 1$"
            solution_sketch: "$M_y = e^x$ and $N_x = be^x$; exactness forces $b = 1$."
          - problem: "For which constant a is (x^2 y + a y^2) dx + ((1/3)x^3 + 6 x y) dy = 0 exact?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify M = x^2 y + a y^2 and N = (1/3)x^3 + 6 x y from the equation. The exactness test requires My = Nx. Compute My = x^2 + 2a y and Nx = x^2 + 6 y. Equate coefficients of y: 2a = 6, so a = 3. The answer is 3."
          - problem: "For which constant c is (e^x sin(y) + c x y) dx + (e^x cos(y) + 3 x^2) dy = 0 exact?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify M = e^x sin(y) + c x y and N = e^x cos(y) + 3 x^2 from the equation. The exactness test requires My = Nx. Compute My = e^x cos(y) + c x and Nx = e^x cos(y) + 6 x. Equate coefficients of x: c = 6. The answer is 6."
          - problem: "For which constant b is (2 x y + b y^2) dx + (x^2 + 8 x y) dy = 0 exact?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify M = 2xy + b y^2 and N = x^2 + 8xy from the equation. The exactness test requires My = Nx. Compute My = 2x + 2b y and Nx = 2x + 8y. Equate coefficients of y: 2b = 8, so b = 4. The answer is 4."
        constraints: "M, N polynomial/exponential/trig in x and y; the test is a two-partial-derivative computation"
      - id: kp2
        name: Reconstructing the potential function
        key_prerequisites: [partial-derivatives, implicit-differentiation]
        exemplars:
          - problem: "The equation (2xy + 3) dx + (x^2 - 1) dy = 0 is exact. Find the potential function F(x,y) such that F(x,y) = C is the general solution."
            answer: "x^2 y + 3x - y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (2xy + 3) dx + (x^2 - 1) dy = 0, check exactness: M_y = 2x and N_x = 2x, so exact. Integrate M in x: F = x^2 y + 3x + h(y). Match F_y = x^2 + h'(y) to N = x^2 - 1, so h'(y) = -1 and h(y) = -y. The potential function is x^2 y + 3x - y."
          - problem: "The equation (2x + y) dx + (x + 2y) dy = 0 is exact. Find the potential function F(x,y) for this equation."
            answer: "x^2 + xy + y^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (2x + y) dx + (x + 2y) dy = 0, check exactness: M_y = 1 and N_x = 1, so exact. Integrate M in x: F = x^2 + xy + h(y). Match F_y = x + h'(y) to N = x + 2y, so h'(y) = 2y and h(y) = y^2. The potential function is x^2 + xy + y^2."
          - problem: "The equation (cos(x) + y) dx + (x + e^y) dy = 0 is exact. Find the potential function F(x,y) for this equation."
            answer: "sin(x) + xy + e^y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (cos(x) + y) dx + (x + e^y) dy = 0, check exactness: M_y = 1 and N_x = 1, so exact. Integrate M in x: F = sin(x) + xy + h(y). Match F_y = x + h'(y) to N = x + e^y, so h'(y) = e^y and h(y) = e^y. The potential function is sin(x) + xy + e^y."
          - problem: "The equation (y cos(x) + 2x) dx + (sin(x) + 2y) dy = 0 is exact. Find the potential function F(x,y) for this equation."
            answer: "y sin(x) + x^2 + y^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (y cos(x) + 2x) dx + (sin(x) + 2y) dy = 0, check exactness: M_y = cos(x) and N_x = cos(x), so exact. Integrate M in x: F = y sin(x) + x^2 + h(y). Match F_y = sin(x) + h'(y) to N = sin(x) + 2y, so h'(y) = 2y and h(y) = y^2. The potential function is y sin(x) + x^2 + y^2."
          - problem: "The equation (2xy + e^x) dx + (x^2 + 3y^2) dy = 0 is exact. Find the potential function F(x,y) for this equation."
            answer: "x^2 y + e^x + y^3"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (2xy + e^x) dx + (x^2 + 3y^2) dy = 0, check exactness: M_y = 2x and N_x = 2x, so exact. Integrate M in x: F = x^2 y + e^x + h(y). Match F_y = x^2 + h'(y) to N = x^2 + 3y^2, so h'(y) = 3y^2 and h(y) = y^3. The potential function is x^2 y + e^x + y^3."
          - problem: "The equation (y cosh(x) + 3x^2) dx + (sinh(x) + 4y^3) dy = 0 is exact. Find the potential function F(x,y) for this equation."
            answer: "y sinh(x) + x^3 + y^4"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (y cosh(x) + 3x^2) dx + (sinh(x) + 4y^3) dy = 0, check exactness: M_y = cosh(x) and N_x = cosh(x), so exact. Integrate M in x: F = y sinh(x) + x^3 + h(y). Match F_y = sinh(x) + h'(y) to N = sinh(x) + 4y^3, so h'(y) = 4y^3 and h(y) = y^4. The potential function is y sinh(x) + x^3 + y^4."
        constraints: "always verify exactness first; F recoverable with one integration in x plus matching h(y); leave the answer implicit as F(x,y) = C"
      - id: kp3
        name: Exact IVPs
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: "Consider the exact equation (3x^2 + 2y) dx + (2x + 2y) dy = 0 with y(1) = 1. Find the constant C in the implicit solution F(x, y) = C."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = x^3 + 2xy + y^2. First check exactness: the mixed partials are both 2, so the equation is exact. Integrate M with respect to x to get F = x^3 + 2xy + g(y). Compare with N to find g'(y) = 2y, so g(y) = y^2. Evaluate F at (1, 1): 1 + 2 + 1 = 4. The constant is C = 4."
          - problem: "Consider the exact equation (y cos(x) + 1) dx + sin(x) dy = 0 with y(pi/2) = 3. Find the constant C in the implicit solution F(x, y) = C."
            answer: "3+pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = y sin(x) + x. First check exactness: the mixed partials are both cos(x), so the equation is exact. Integrate M with respect to x to get F = y sin(x) + x + g(y). Compare with N to find g'(y) = 0, so g(y) = 0. Evaluate F at (pi/2, 3): 3 sin(pi/2) + pi/2 = 3 + pi/2. The constant is C = 3+pi/2."
          - problem: "Consider the exact equation (2x + y) dx + (x + 2y) dy = 0 with y(0) = 1. Find the constant C in the implicit solution F(x, y) = C."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = x^2 + xy + y^2. First check exactness: the mixed partials are both 1, so the equation is exact. Integrate M with respect to x to get F = x^2 + xy + g(y). Compare with N to find g'(y) = 2y, so g(y) = y^2. Evaluate F at (0, 1): 0 + 0 + 1 = 1. The constant is C = 1."
          - problem: "Consider the exact equation (2xy + 3x^2) dx + (x^2 + 4y) dy = 0 with y(1) = 2. Find the constant C in the implicit solution F(x, y) = C."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = x^2 y + x^3 + 2y^2. First check exactness: the mixed partials are both 2x, so the equation is exact. Integrate M with respect to x to get F = x^2 y + x^3 + g(y). Compare with N to find g'(y) = 4y, so g(y) = 2y^2. Evaluate F at (1, 2): 2 + 1 + 8 = 11. The constant is C = 11."
          - problem: "Consider the exact equation (2x - y) dx + (2y - x) dy = 0 with y(2) = 1. Find the constant C in the implicit solution F(x, y) = C."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = x^2 - xy + y^2. First check exactness: the mixed partials are both -1, so the equation is exact. Integrate M with respect to x to get F = x^2 - xy + g(y). Compare with N to find g'(y) = 2y, so g(y) = y^2. Evaluate F at (2, 1): 4 - 2 + 1 = 3. The constant is C = 3."
          - problem: "Consider the exact equation (y e^(x) + 2x) dx + (e^(x) + 2y) dy = 0 with y(0) = 1. Find the constant C in the implicit solution F(x, y) = C."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = y e^(x) + x^2 + y^2. First check exactness: the mixed partials are both e^(x), so the equation is exact. Integrate M with respect to x to get F = y e^(x) + x^2 + g(y). Compare with N to find g'(y) = 2y, so g(y) = y^2. Evaluate F at (0, 1): 1 + 0 + 1 = 2. The constant is C = 2."
        constraints: "leave answers implicit; the constant is fixed by evaluating F at the initial point"
    diagnostic_exemplar:
      problem: 'Solve $(2xy - 3x^2)\,dx + (x^2 + 2y)\,dy = 0$ with $y(1) = 2$.'
      answer: '$x^2 y - x^3 + y^2 = 5$'
      answer_contract: {kind: none}
      solution_sketch: '$M_y = 2x = N_x$, so the equation is exact; $F = x^2y - x^3 + y^2$ satisfies $F_x = M$ and $F_y = N$. Then $F(1,2) = 2 - 1 + 4 = 5$.'
    anki_seeds:
      - front: "Exactness test for M dx + N dy = 0?"
        back: '$\partial M/\partial y = \partial N/\partial x$ (on a rectangle).'
        type: basic
      - front: "The solution of an exact equation M dx + N dy = 0 is..."
        back: "$F(x,y) = C$, where $F_x = M$ and $F_y = N$."
        type: basic

  - id: integrating-factors-for-exactness
    name: Integrating Factors for Exactness
    core: false                # extension of exact equations; terminal
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - id: exact-equations
        weight: 0.7
        key: true
      - id: integrating-factor-computation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Finding $\\mu(x)$"
        key_prerequisites: [exact-equations, integrating-factor-computation]
        exemplars:
          - problem: "The equation (3xy + y^2) dx + (x^2 + xy) dy = 0 is not exact. Find an integrating factor mu(x) as a function of x."
            answer: "x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is (3xy + y^2) dx + (x^2 + xy) dy = 0, so M = 3xy + y^2 and N = x^2 + xy. Step 1 (exactness test): M_y = 3x + 2y and N_x = 2x + y, so (M_y - N_x)/N = (x + y)/(x(x + y)) = 1/x. Step 2 (integrating factor formula): mu = e^(integral of 1/x dx) = x. The integrating factor is x."
          - problem: "The equation 2y dx + x dy = 0 is not exact. Find an integrating factor mu(x) as a function of x."
            answer: "x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is 2y dx + x dy = 0, so M = 2y and N = x. Step 1 (exactness test): M_y = 2 and N_x = 1, so (M_y - N_x)/N = (2 - 1)/x = 1/x. Step 2 (integrating factor formula): mu = e^(integral of 1/x dx) = x. The integrating factor is x."
          - problem: "For a differential equation, (M_y - N_x)/N = 3/x. Find an integrating factor mu(x) as a function of x."
            answer: "x^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The quantity (M_y - N_x)/N is 3/x, which depends on x alone. Step 1 (exactness test): the equation is not exact because the ratio is nonzero. Step 2 (integrating factor formula): mu = e^(integral of 3/x dx) = e^(3 ln(abs(x))) = x^3. The integrating factor is x^3."
          - problem: "The equation (3y + x) dx + x dy = 0 is not exact. Find an integrating factor mu(x) as a function of x."
            answer: "x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is (3y + x) dx + x dy = 0, so M = 3y + x and N = x. Step 1 (exactness test): M_y = 3 and N_x = 1, so (M_y - N_x)/N = (3 - 1)/x = 2/x. Step 2 (integrating factor formula): mu = e^(integral of 2/x dx) = x^2. The integrating factor is x^2."
          - problem: "The equation (2y + x) dx + dy = 0 is not exact. Find an integrating factor mu(x) as a function of x."
            answer: "e^(2x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is (2y + x) dx + dy = 0, so M = 2y + x and N = 1. Step 1 (exactness test): M_y = 2 and N_x = 0, so (M_y - N_x)/N = 2. Step 2 (integrating factor formula): mu = e^(integral of 2 dx) = e^(2x). The integrating factor is e^(2x)."
          - problem: "The equation (-y + x) dx + dy = 0 is not exact. Find an integrating factor mu(x) as a function of x."
            answer: "e^(-x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is (-y + x) dx + dy = 0, so M = -y + x and N = 1. Step 1 (exactness test): M_y = -1 and N_x = 0, so (M_y - N_x)/N = -1. Step 2 (integrating factor formula): mu = e^(integral of -1 dx) = e^(-x). The integrating factor is e^(-x)."
        constraints: "(M_y - N_x)/N must simplify to a function of x alone (typically k/x); mu = e^{integral}"
      - id: kp2
        name: "Finding $\\mu(y)$"
        key_prerequisites: [exact-equations]
        exemplars:
          - problem: "The equation y dx + (2x + y^2) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For y dx + (2x + y^2) dy = 0, compute N_x = 2 and M_y = 1. Exactness test: (N_x - M_y)/M = (2 - 1)/y = 1/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 1/y dy) = e^(ln y) = y. The integrating factor is y."
          - problem: "The equation y dx + (3x + y) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y^2"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For y dx + (3x + y) dy = 0, compute N_x = 3 and M_y = 1. Exactness test: (N_x - M_y)/M = (3 - 1)/y = 2/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 2/y dy) = e^(2 ln y) = y^2. The integrating factor is y^2."
          - problem: "The equation y dx + (5x + y^3) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y^4"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For y dx + (5x + y^3) dy = 0, compute N_x = 5 and M_y = 1. Exactness test: (N_x - M_y)/M = (5 - 1)/y = 4/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 4/y dy) = e^(4 ln y) = y^4. The integrating factor is y^4."
          - problem: "The equation y^2 dx + (5xy + y^3) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y^3"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For y^2 dx + (5xy + y^3) dy = 0, compute N_x = 5y and M_y = 2y. Exactness test: (N_x - M_y)/M = (5y - 2y)/y^2 = 3/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 3/y dy) = e^(3 ln y) = y^3. The integrating factor is y^3."
          - problem: "The equation 2y dx + (12x + y^3) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y^5"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For 2y dx + (12x + y^3) dy = 0, compute N_x = 12 and M_y = 2. Exactness test: (N_x - M_y)/M = (12 - 2)/(2y) = 5/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 5/y dy) = e^(5 ln y) = y^5. The integrating factor is y^5."
          - problem: "The equation y^2 dx + (8xy + 1) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y^6"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For y^2 dx + (8xy + 1) dy = 0, compute N_x = 8y and M_y = 2y. Exactness test: (N_x - M_y)/M = (8y - 2y)/y^2 = 6/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 6/y dy) = e^(6 ln y) = y^6. The integrating factor is y^6."
        constraints: "(N_x - M_y)/M must simplify to a function of y alone (typically k/y)"
      - id: kp3
        name: Completing the solution
        key_prerequisites: [exact-equations]
        exemplars:
          - problem: "Solve $2y\\,dx + x\\,dy = 0$ using the integrating factor $\\mu = x$."
            answer: "$x^2 y = C$"
            answer_contract: {kind: none}
            solution_sketch: "Multiplying gives $2xy\\,dx + x^2\\,dy = d(x^2 y)$."
          - problem: "Solve $(3xy + y^2)\\,dx + (x^2 + xy)\\,dy = 0$ using $\\mu = x$."
            answer: "$2x^3 y + x^2 y^2 = C$"
            answer_contract: {kind: none}
            solution_sketch: "After multiplying, $F = x^3 y + \\dfrac{x^2 y^2}{2}$ satisfies $F_x = 3x^2y + xy^2$, $F_y = x^3 + x^2 y$; clear the fraction."
          - problem: "Solve $y\\,dx + (2x - ye^y)\\,dy = 0$ using $\\mu = y$."
            answer: "$xy^2 - (y^2 - 2y + 2)e^y = C$"
            answer_contract: {kind: none}
            solution_sketch: "After multiplying, $F = xy^2 + h(y)$ with $h'(y) = -y^2 e^y$; integrating by parts twice, $h = -(y^2 - 2y + 2)e^y$."
        constraints: "after multiplying by mu the equation must pass the exactness test; reconstruct F as in exact equations"
