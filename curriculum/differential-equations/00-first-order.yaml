      - id: kp1
        name: Recognizing separable equations
        key_prerequisites: [ode-classification-verification]
        exemplars:
          - problem: "Is $y' = xy + x$ separable? If so, factor the right side."
            answer: "Yes: $y' = x(y + 1)$."
          - problem: "Is $y' = x + y$ separable?"
            answer: "No: $x + y$ cannot be written as $g(x)h(y)$."
          - problem: "Is $y' = e^{x+y}$ separable?"
            answer: "Yes: $e^{x+y} = e^x e^y$."
        constraints: "right sides that factor (or fail to factor) as g(x)h(y); include sums that only look separable"
      - id: kp2
        name: Separate and integrate
        key_prerequisites: [antiderivatives]
        exemplars:
          - problem: 'Find the general solution of $\frac{dy}{dx} = \frac{x}{y}$.'
            answer: "$y^2 = x^2 + C$"
            solution_sketch: 'Separate: $y\,dy = x\,dx$; integrate to $\frac{y^2}{2} = \frac{x^2}{2} + C$ and absorb the 2 into $C$.'
          - problem: "Find the general solution of $y' = 3x^2 y^2$."
            answer: "$y = -\\dfrac{1}{x^3 + C}$"
            solution_sketch: "Separate to $y^{-2}dy = 3x^2\\,dx$; integrating gives $-1/y = x^3 + C$; solve for $y$."
          - problem: 'Find the general solution of $\frac{dy}{dx} = \frac{x^2}{y^2}$.'
            answer: "$y^3 = x^3 + C$"
            solution_sketch: '$y^2\,dy = x^2\,dx$ integrates to $\frac{y^3}{3} = \frac{x^3}{3} + C$; absorb the 3.'
        constraints: "antiderivatives are powers only; general solutions carry an explicit C, absorbed constants renamed"
      - id: kp3
        name: Logarithmic integrations and absorbed constants
        key_prerequisites: [integration-substitution]
        exemplars:
          - problem: 'Find the general solution of $\frac{dy}{dx} = \frac{y}{x}$ for $x > 0$.'
            answer: "$y = Cx$"
            solution_sketch: '$\frac{dy}{y} = \frac{dx}{x}$ gives $\ln|y| = \ln x + C$; exponentiating and renaming $e^C$ yields $y = Cx$.'
          - problem: 'Find the general solution of $\frac{dy}{dx} = xy$.'
            answer: "$y = Ce^{x^2/2}$"
            solution_sketch: 'Separate: $\frac{dy}{y} = x\,dx$, so $\ln|y| = \frac{x^2}{2} + C$; exponentiate and rename the constant.'
          - problem: "Find the general solution of $(1 + x^2)\\,y' = xy$."
            answer: '$y = C\sqrt{1 + x^2}$'
            solution_sketch: '$\frac{dy}{y} = \frac{x}{1+x^2}dx$; substitution gives $\ln|y| = \frac{1}{2}\ln(1+x^2) + C$, so $y = C\sqrt{1+x^2}$.'
        constraints: "integrations produce logarithms; require exponentiating and renaming e^C as C"
    diagnostic_exemplar:
      problem: "Find the general solution of $y' = -2xy$."
      answer: "$y = Ce^{-x^2}$"
      solution_sketch: '$\frac{dy}{y} = -2x\,dx$ gives $\ln|y| = -x^2 + C$; exponentiate and rename the constant.'
    anki_seeds:
      - front: "A first-order ODE is separable when it can be written as..."
        back: "dy/dx = g(x)h(y): all y-dependence on one side, all x-dependence on the other."
        type: basic
      - front: 'After integrating $\frac{dy}{y} = k\,dx$, the general solution is...'
        back: '$y = Ce^{kx}$ (exponentiate $\ln|y| = kx + C$ and rename the constant).'
        type: basic

  - id: separable-equations
    name: Separable Equations
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: separation-of-variables
        weight: 0.7
        key: true
      - id: integration-substitution
        weight: 0.3
        key: false
      - id: definite-integrals-ftc
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Initial value problems
        key_prerequisites: [separation-of-variables, integration-substitution]
        exemplars:
          - problem: "Solve $y' = 2xy$ with $y(0) = 3$."
            answer: "$y = 3e^{x^2}$"
            solution_sketch: "The general solution is $y = Ce^{x^2}$; the initial condition gives $C = 3$."
          - problem: 'Solve $\frac{dy}{dx} = \frac{\cos x}{y}$ with $y(0) = 1$.'
            answer: '$y = \sqrt{2\sin x + 1}$'
            solution_sketch: '$y\,dy = \cos x\,dx$ gives $\frac{y^2}{2} = \sin x + C$; $y(0) = 1$ forces $C = \frac{1}{2}$, so $y^2 = 2\sin x + 1$; take the positive root since $y(0) > 0$. Valid on the interval about $x = 0$ where $2\sin x + 1 > 0$, i.e. $(-\pi/6,\ 7\pi/6)$.'
          - problem: "Solve $y' = e^{x-y}$ with $y(0) = 0$."
            answer: "$y = x$"
            solution_sketch: "Separate: $e^y dy = e^x dx$, so $e^y = e^x + C$; the initial condition gives $C = 0$, hence $e^y = e^x$ and $y = x$."
        constraints: "initial condition pins one constant; choose data so the sign of any root is determined; answers exact"
      - id: kp2
        name: Implicit solutions and branch selection
        key_prerequisites: [separation-of-variables]
        exemplars:
          - problem: "Find an implicit general solution of $y' = -\\dfrac{x}{y}$."
            answer: "$x^2 + y^2 = C$"
            solution_sketch: '$y\,dy = -x\,dx$ integrates to $\frac{y^2}{2} = -\frac{x^2}{2} + C$; clear the fractions.'
          - problem: "Solve $y' = \\dfrac{2x + 1}{2y}$ with $y(0) = -1$."
            answer: '$y = -\sqrt{x^2 + x + 1}$'
            solution_sketch: '$2y\,dy = (2x+1)\,dx$ gives $y^2 = x^2 + x + C$; $y(0) = -1$ forces $C = 1$, and the negative initial value selects the negative root.'
          - problem: "Solve $y\\,y' = x$ with $y(1) = -2$."
            answer: '$y = -\sqrt{x^2 + 3}$'
            solution_sketch: '$y^2 = x^2 + C$ with $C = 3$; take the negative branch since $y(1) < 0$.'
        constraints: "implicit solutions left as F(x,y) = C when no clean explicit form; when solving explicitly, the initial sign picks the branch"
      - id: kp3
        name: Constant solutions and intervals of validity
        key_prerequisites: [separation-of-variables]
        exemplars:
          - problem: "Find all constant solutions of $y' = y^2 - 4$."
            answer: "$y = 2$ and $y = -2$."
            solution_sketch: "Constant solutions are the zeros of the right side."
          - problem: "Solve $y' = y^2$ with $y(0) = 1$ and give the interval of validity."
            answer: '$y = \dfrac{1}{1 - x}$ on $(-\infty, 1)$.'
            solution_sketch: "$-1/y = x + C$ with $C = -1$; the solution blows up at $x = 1$, so the interval containing $x_0 = 0$ is $(-\\infty, 1)$."
          - problem: "When solving $y' = y^2$ by dividing both sides by $y^2$, which solution is lost?"
            answer: "The constant solution $y = 0$."
        constraints: "constant solutions are integer zeros of h(y); intervals of validity bounded by blow-up points or where the branch formula degenerates"
    diagnostic_exemplar:
      problem: 'Solve $y'' = -\dfrac{x}{y}$ with $y(0) = -3$, and state the interval of validity.'
      answer: '$y = -\sqrt{9 - x^2}$ on $(-3, 3)$.'
      solution_sketch: 'Separating gives $y\,dy = -x\,dx$, so $y^2 = 9 - x^2$. The initial value $y(0) = -3$ selects the negative branch, and the square root is real (and $y \neq 0$) only for $|x| < 3$.'
    anki_seeds:
      - front: "When you divide a separable equation by h(y), you may lose..."
        back: "the constant solutions y = c where h(c) = 0 — check for them separately."
        type: basic
      - front: "After solving y^2 = F(x) + C in an IVP, the branch (sign of the root) is chosen by..."
        back: "the sign of the initial value y(x0)."
        type: basic

  - id: integrating-factor-computation
    name: Computing Integrating Factors
    core: true
    difficulty: 0.63
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: derivatives-exp-log
        weight: 0.5
        key: true
      - id: separation-of-variables
        weight: 0.3
        key: false
      - id: logarithm-properties
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Standard form
        key_prerequisites: [separation-of-variables]
        exemplars:
          - problem: "Write $xy' - y = x^2$ ($x > 0$) in standard form and identify $P(x)$ and $Q(x)$."
            answer: "$y' - \\dfrac{1}{x}y = x$; $P(x) = -\\dfrac{1}{x}$, $Q(x) = x$."
            solution_sketch: "Divide through by the coefficient of $y'$."
          - problem: "Write $2y' + 8y = 6e^x$ in standard form."
            answer: "$y' + 4y = 3e^x$"
          - problem: "Identify $P$ and $Q$ for $y' = x - 3y$."
            answer: "$y' + 3y = x$: $P(x) = 3$, $Q(x) = x$."
        constraints: "leading coefficient constant or a power of x; always divide through before reading off P and Q"
      - id: kp2
        name: "Computing $\\mu = e^{\\int P\\,dx}$"
        key_prerequisites: [derivatives-exp-log, logarithm-properties]
        exemplars:
          - problem: "Find an integrating factor for $y' + 2y = e^x$."
            answer: "$\\mu = e^{2x}$"
            solution_sketch: '$\mu = e^{\int 2\,dx} = e^{2x}$.'
          - problem: "Find an integrating factor for $y' + \\dfrac{2}{x}y = x$ on $x > 0$."
            answer: "$\\mu = x^2$"
            solution_sketch: '$\mu = e^{\int (2/x)\,dx} = e^{2\ln x} = x^2$.'
          - problem: 'Find an integrating factor for $y'' + (\cos x)\,y = \cos x$.'
            answer: '$\mu = e^{\sin x}$'
        constraints: "P(x) constant, k/x, or an easily integrated function; simplify e^{k ln x} to x^k"
      - id: kp3
        name: Verifying the product-rule collapse
        key_prerequisites: [derivatives-exp-log]
        exemplars:
          - problem: "Show that after multiplying $y' + 2y = e^x$ by $\\mu = e^{2x}$, the left side is $(e^{2x}y)'$."
            answer: "$(e^{2x}y)' = e^{2x}y' + 2e^{2x}y = e^{2x}(y' + 2y)$, which matches."
            solution_sketch: "Product rule on $e^{2x}y$; the exponential's derivative reproduces the $P(x)y$ term."
          - problem: "Show that $x^2\\left(y' + \\dfrac{2}{x}y\\right) = (x^2 y)'$."
            answer: "$(x^2 y)' = x^2 y' + 2xy = x^2\\left(y' + \\dfrac{2}{x}y\\right)$."
        constraints: "one product-rule expansion; the point is mu' = P mu"
    diagnostic_exemplar:
      problem: 'Write $xy'' + 3y = x^2$ ($x > 0$) in standard form, find its integrating factor $\mu$, and show that multiplying by $\mu$ turns the left side into $(\mu y)''$.'
      answer: 'Standard form $y'' + \dfrac{3}{x}y = x$, so $\mu = e^{\int 3/x\,dx} = x^3$; and $x^3\left(y'' + \frac{3}{x}y\right) = x^3 y'' + 3x^2 y = (x^3 y)''$.'
      solution_sketch: 'Divide by $x$ to reach standard form, integrate $P = 3/x$, then check the product rule.'
    anki_seeds:
      - front: "Integrating factor for y' + P(x)y = Q(x)?"
        back: '$\mu(x) = e^{\int P(x)\,dx}$'
        type: basic
      - front: '$e^{k\ln x}$ simplifies to...'
        back: '$x^k$'
        type: basic

  - id: linear-first-order-integrating-factor
    name: Linear First-Order Equations
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: integrating-factor-computation
        weight: 0.7
        key: true
      - id: integration-by-parts
        weight: 0.5
        key: true
      - id: separable-equations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Solving via the product-rule collapse
        key_prerequisites: [integrating-factor-computation]
        exemplars:
          - problem: "Find the general solution of $y' + 2y = e^x$."
            answer: "$y = \\dfrac{e^x}{3} + Ce^{-2x}$"
            solution_sketch: "Multiply by $e^{2x}$: $(e^{2x}y)' = e^{3x}$, so $e^{2x}y = \\dfrac{e^{3x}}{3} + C$."
          - problem: "Find the general solution of $y' + \\dfrac{1}{x}y = x$ on $x > 0$."
            answer: "$y = \\dfrac{x^2}{3} + \\dfrac{C}{x}$"
            solution_sketch: "With $\\mu = x$: $(xy)' = x^2$, so $xy = \\dfrac{x^3}{3} + C$."
          - problem: "Find the general solution of $y' + 3y = 6$."
            answer: "$y = 2 + Ce^{-3x}$"
            solution_sketch: "$(e^{3x}y)' = 6e^{3x}$, so $e^{3x}y = 2e^{3x} + C$."
        constraints: "right side polynomial or e^{kx} integrating in one step; answers carry an explicit C"
      - id: kp2
        name: Forcing that needs integration by parts
        key_prerequisites: [integration-by-parts, integrating-factor-computation]
        exemplars:
          - problem: "Find the general solution of $y' - y = x$."
            answer: "$y = -x - 1 + Ce^x$"
            solution_sketch: "With $\\mu = e^{-x}$: $(e^{-x}y)' = xe^{-x}$; integration by parts gives $e^{-x}y = -(x+1)e^{-x} + C$."
          - problem: 'Find the general solution of $y'' + y = \sin x$.'
            answer: '$y = \dfrac{\sin x - \cos x}{2} + Ce^{-x}$'
            solution_sketch: '$(e^x y)'' = e^x \sin x$; integrating (parts twice, or the standard formula) gives $e^x y = \frac{e^x(\sin x - \cos x)}{2} + C$.'
        constraints: "right side polynomial times e^{kx} or sin/cos; at most two integrations by parts"
      - id: kp3
        name: Linear IVPs
        key_prerequisites: [integrating-factor-computation, separable-equations]
        exemplars:
          - problem: "Solve $y' + 3y = 6$ with $y(0) = 4$."
            answer: "$y = 2 + 2e^{-3x}$"
            solution_sketch: "The constant solution is $y = 2$, so $y = 2 + Ce^{-3x}$; $y(0) = 4$ gives $C = 2$."
          - problem: 'Solve $xy'' + y = \sin x$ with $y(\pi/2) = 2/\pi$.'
            answer: '$y = \dfrac{1 - \cos x}{x}$'
            solution_sketch: 'The left side is already $(xy)''$, so $xy = -\cos x + C$. At $x = \pi/2$: $\frac{\pi}{2}\cdot\frac{2}{\pi} = 1 = 0 + C$, so $C = 1$.'
        constraints: "initial data chosen so C is a clean rational; recognize (xy)' and (e^{kx}y)' collapses"
    diagnostic_exemplar:
      problem: 'Solve $y'' - y = x$ with $y(0) = 2$.'
      answer: '$y = -x - 1 + 3e^{x}$'
      solution_sketch: '$\mu = e^{-x}$ gives $(e^{-x}y)'' = xe^{-x}$; integrating by parts, $e^{-x}y = -(x+1)e^{-x} + C$, so $y = -(x+1) + Ce^{x}$. Then $y(0) = -1 + C = 2$ gives $C = 3$.'
    anki_seeds:
      - front: "After multiplying y' + Py = Q by its integrating factor, the left side becomes..."
        back: "the exact derivative (mu y)' — integrate both sides once."
        type: basic
      - front: "Solution formula for y' + P(x)y = Q(x)?"
        back: '$y = \dfrac{1}{\mu}\left(\int \mu Q\,dx + C\right)$ with $\mu = e^{\int P\,dx}$.'
        type: basic

  - id: bernoulli-equations
    name: Bernoulli Equations
    core: false                # special-case substitution subsumed by the linear first-order method
    difficulty: 0.72
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: linear-first-order-integrating-factor
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The substitution $v = y^{1-n}$"
        key_prerequisites: [chain-rule, linear-first-order-integrating-factor]
        exemplars:
          - problem: "For $y' + y = y^2$, identify $n$, the substitution, and the resulting linear equation."
            answer: "$n = 2$; $v = y^{-1}$ gives $v' - v = -1$."
            solution_sketch: "Divide by $y^2$: $y^{-2}y' + y^{-1} = 1$; with $v = y^{-1}$, $v' = -y^{-2}y'$, so $-v' + v = 1$."
          - problem: "For $y' - y = xy^3$, find the substitution and the resulting linear equation."
            answer: "$v = y^{-2}$ gives $v' + 2v = -2x$."
            solution_sketch: "Divide by $y^3$: $y^{-3}y' - y^{-2} = x$; since $v' = -2y^{-3}y'$, this is $-\\tfrac{1}{2}v' - v = x$."
          - problem: 'What substitution turns $y'' + \dfrac{y}{x} = \sqrt{y}$ into a linear equation, and what equation results?'
            answer: '$v = \sqrt{y}$ gives $v'' + \dfrac{v}{2x} = \dfrac{1}{2}$.'
            solution_sketch: 'Here $n = \tfrac{1}{2}$, so $v = y^{1/2}$; writing $y = v^2$, $y'' = 2vv''$ and dividing by $2v$ gives the linear equation.'
        constraints: "n in {2, 3, 1/2}; the transformed equation must be stated in standard linear form"
      - id: kp2
        name: Complete solutions
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "Find the general solution of $y' + y = y^2$."
            answer: "$y = \\dfrac{1}{1 + Ce^{x}}$"
            solution_sketch: "$v = y^{-1}$ gives $v' - v = -1$, so $v = 1 + Ce^x$; invert."
          - problem: "Find the general solution of $y' + \\dfrac{y}{x} = y^2$ on $x > 0$."
            answer: "$y = \\dfrac{1}{x(C - \\ln x)}$"
            solution_sketch: "$v = y^{-1}$ gives $v' - \\dfrac{v}{x} = -1$; with $\\mu = 1/x$, $(v/x)' = -1/x$, so $v = x(C - \\ln x)$."
        constraints: "coefficients constant or k/x; the linear stage solves with one integrating factor; present y explicitly"
      - id: kp3
        name: Bernoulli IVPs
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "Solve $y' + y = y^2$ with $y(0) = 2$."
            answer: "$y = \\dfrac{2}{2 - e^{x}}$"
            solution_sketch: "$v = y^{-1}$: $v = 1 + Ce^x$ with $v(0) = \\tfrac{1}{2}$ gives $C = -\\tfrac{1}{2}$, so $y = \\dfrac{1}{1 - e^x/2}$."
          - problem: "Solve $y' - y = xy^3$ with $y(0) = 1$."
            answer: '$y = \left(\tfrac{1}{2}e^{-2x} - x + \tfrac{1}{2}\right)^{-1/2}$'
            solution_sketch: "$v = y^{-2}$ satisfies $v' + 2v = -2x$, so $v = Ce^{-2x} - x + \\tfrac{1}{2}$; $v(0) = 1$ gives $C = \\tfrac{1}{2}$; then $y = v^{-1/2}$."
        constraints: "initial data keeps v positive near x0; state the solution explicitly"
    diagnostic_exemplar:
      problem: 'Solve $y'' + y = y^2$ with $y(0) = 3$.'
      answer: '$y = \dfrac{3}{3 - 2e^{x}}$'
      solution_sketch: 'With $n = 2$, put $v = y^{-1}$: dividing by $y^2$ gives $-v'' + v = 1$, i.e. $v'' - v = -1$, whose solution is $v = 1 + Ce^{x}$. Then $y = \frac{1}{1 + Ce^x}$, and $y(0) = 3$ gives $C = -\frac{2}{3}$, i.e. $y = \frac{3}{3 - 2e^x}$.'
    anki_seeds:
      - front: "A Bernoulli equation has the form..."
        back: "$y' + P(x)y = Q(x)y^n$ with $n \\neq 0, 1$."
        type: basic
      - front: "Substitution that linearizes a Bernoulli equation?"
        back: '$v = y^{1-n}$ — it satisfies a linear first-order equation.'
        type: basic

  - id: homogeneous-first-order-substitution
    name: "Homogeneous Equations and the v = y/x Substitution"   # names are plain text (no KaTeX pass) — $…$ would render literally
    core: false                # special-case substitution; terminal
    difficulty: 0.72
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: separable-equations
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Recognizing homogeneous equations
        key_prerequisites: [separable-equations]
        exemplars:
          - problem: "Can $y' = \\dfrac{x + y}{x}$ be written as a function of $v = y/x$ alone?"
            answer: "Yes: $y' = 1 + \\dfrac{y}{x} = 1 + v$."
          - problem: "Can $y' = \\dfrac{x^2 + y^2}{xy}$ be written as a function of $y/x$ alone?"
            answer: "Yes: dividing top and bottom by $x^2$ gives $y' = \\dfrac{1 + v^2}{v}$."
          - problem: "Is $y' = x + y^2$ homogeneous?"
            answer: "No: $x + y^2$ is not a function of $y/x$ alone."
        constraints: "right sides are ratios of degree-matched polynomials (homogeneous) or degree-mismatched foils"
      - id: kp2
        name: The substitution mechanics
        key_prerequisites: [chain-rule, separable-equations]
        exemplars:
          - problem: "Substitute $y = vx$ into $y' = 1 + \\dfrac{y}{x}$ and simplify."
            answer: "$v + xv' = 1 + v$, so $xv' = 1$."
            solution_sketch: "Product rule: $y' = v + xv'$; the $v$ terms cancel, leaving a separable equation."
          - problem: "Substitute $y = vx$ into $y' = \\dfrac{x^2 + y^2}{xy}$ and simplify."
            answer: "$v + xv' = \\dfrac{1 + v^2}{v}$, so $xv' = \\dfrac{1}{v}$."
          - problem: "Substitute $y = vx$ into $y' = \\dfrac{y^2 + 2xy}{x^2}$ and simplify."
            answer: "$v + xv' = v^2 + 2v$, so $xv' = v^2 + v$."
        constraints: "always y = vx with y' = v + xv'; the result must be visibly separable in v and x"
      - id: kp3
        name: Complete solutions
        key_prerequisites: [separable-equations]
        exemplars:
          - problem: "Solve $xy' = x + y$ for $x > 0$."
            answer: "$y = x\\ln x + Cx$"
            solution_sketch: "$v = y/x$ gives $xv' = 1$, so $v = \\ln x + C$; multiply back by $x$."
          - problem: "Find the general solution of $y' = \\dfrac{x^2 + y^2}{xy}$ for $x > 0$."
            answer: "$y^2 = x^2(2\\ln x + C)$"
            solution_sketch: "$xv' = 1/v$ separates to $v\\,dv = \\dfrac{dx}{x}$, so $\\dfrac{v^2}{2} = \\ln x + C$; substitute $v = y/x$."
          - problem: "Solve $y' = \\dfrac{x^2 + y^2}{xy}$ with $y(1) = 2$."
            answer: "$y = x\\sqrt{2\\ln x + 4}$"
            solution_sketch: "From $y^2 = x^2(2\\ln x + C)$, the condition $y(1) = 2$ gives $C = 4$; take the positive root."
        constraints: "v-integrations produce ln x or powers of v; back-substitute v = y/x and state y explicitly when a branch is determined"
    diagnostic_exemplar:
      problem: "Solve $xy' = y + x$ ($x > 0$) with $y(1) = 3$."
      answer: "$y = x\\ln x + 3x$"
      solution_sketch: "$v = y/x$ gives $v = \\ln x + C$ with $v(1) = 3$, so $C = 3$."
    anki_seeds:
      - front: "A first-order equation y' = f(x, y) is homogeneous when..."
        back: "f can be written as a function of v = y/x alone (equivalently f(tx, ty) = f(x, y))."
        type: basic
      - front: "The substitution y = vx turns a homogeneous equation into..."
        back: "a separable equation in v and x, using y' = v + xv'."
        type: basic

  - id: exact-equations
    name: Exact Equations
    core: false                # special-class technique; heads a terminal two-topic branch
    difficulty: 0.74
    drill: false
