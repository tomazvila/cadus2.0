    expected_time_secs: 240
    prerequisites:
      - id: partial-derivatives
        weight: 0.6
        key: true
      - id: implicit-differentiation
        weight: 0.4
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Testing exactness
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: "Is $(2xy + 3)\\,dx + (x^2 - 1)\\,dy = 0$ exact?"
            answer: "Yes: $M_y = 2x = N_x$."
            solution_sketch: "Compute $\\partial M/\\partial y = 2x$ and $\\partial N/\\partial x = 2x$; they agree."
          - problem: "Is $y^2\\,dx + x\\,dy = 0$ exact?"
            answer: "No: $M_y = 2y$ but $N_x = 1$."
          - problem: "For which constant $b$ is $(ye^x + 2x)\\,dx + be^x\\,dy = 0$ exact?"
            answer: "$b = 1$"
            solution_sketch: "$M_y = e^x$ and $N_x = be^x$; exactness forces $b = 1$."
        constraints: "M, N polynomial/exponential/trig in x and y; the test is a two-partial-derivative computation"
      - id: kp2
        name: Reconstructing the potential function
        key_prerequisites: [partial-derivatives, implicit-differentiation]
        exemplars:
          - problem: "Solve $(2xy + 3)\\,dx + (x^2 - 1)\\,dy = 0$."
            answer: "$x^2 y + 3x - y = C$"
            solution_sketch: "Integrate $M$ in $x$: $F = x^2 y + 3x + h(y)$; then $F_y = x^2 + h'(y) = x^2 - 1$ gives $h(y) = -y$."
          - problem: "Solve $(2x + y)\\,dx + (x + 2y)\\,dy = 0$."
            answer: "$x^2 + xy + y^2 = C$"
            solution_sketch: "$F = x^2 + xy + h(y)$; $F_y = x + h'(y) = x + 2y$ gives $h(y) = y^2$."
          - problem: 'Solve $(\cos x + y)\,dx + (x + e^y)\,dy = 0$.'
            answer: '$\sin x + xy + e^y = C$'
            solution_sketch: '$M_y = 1 = N_x$, so exact. $F = \sin x + xy + h(y)$; $F_y = x + h''(y) = x + e^y$ gives $h(y) = e^y$.'
        constraints: "always verify exactness first; F recoverable with one integration in x plus matching h(y); leave the answer implicit as F(x,y) = C"
      - id: kp3
        name: Exact IVPs
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: "Solve $(3x^2 + 2y)\\,dx + (2x + 2y)\\,dy = 0$ with $y(1) = 1$."
            answer: "$x^3 + 2xy + y^2 = 4$"
            solution_sketch: "$M_y = 2 = N_x$; $F = x^3 + 2xy + y^2$. Evaluating at $(1,1)$: $1 + 2 + 1 = 4$."
          - problem: 'Solve $(y\cos x + 1)\,dx + \sin x\,dy = 0$ with $y(\pi/2) = 3$.'
            answer: '$y\sin x + x = 3 + \dfrac{\pi}{2}$'
            solution_sketch: '$M_y = \cos x = N_x$; $F = y\sin x + x$. At $(\pi/2,\,3)$: $3 + \pi/2$.'
        constraints: "leave answers implicit; the constant is fixed by evaluating F at the initial point"
    diagnostic_exemplar:
      problem: 'Solve $(2xy - 3x^2)\,dx + (x^2 + 2y)\,dy = 0$ with $y(1) = 2$.'
      answer: '$x^2 y - x^3 + y^2 = 5$'
      solution_sketch: '$M_y = 2x = N_x$, so the equation is exact; $F = x^2y - x^3 + y^2$ satisfies $F_x = M$ and $F_y = N$. Then $F(1,2) = 2 - 1 + 4 = 5$.'
    anki_seeds:
      - front: "Exactness test for M dx + N dy = 0?"
        back: '$\partial M/\partial y = \partial N/\partial x$ (on a rectangle).'
        type: basic
      - front: "The solution of an exact equation M dx + N dy = 0 is..."
        back: "$F(x,y) = C$, where $F_x = M$ and $F_y = N$."
        type: basic

  - id: integrating-factors-for-exactness
    name: Integrating Factors for Exactness
    core: false                # extension of exact equations; terminal
    difficulty: 0.78
    drill: false
    answer_kind: multi-step
    expected_time_secs: 270
    prerequisites:
      - id: exact-equations
        weight: 0.7
        key: true
      - id: integrating-factor-computation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Finding $\\mu(x)$"
        key_prerequisites: [exact-equations, integrating-factor-computation]
        exemplars:
          - problem: "The equation $(3xy + y^2)\\,dx + (x^2 + xy)\\,dy = 0$ is not exact. Find an integrating factor $\\mu(x)$."
            answer: "$\\mu = x$"
            solution_sketch: "$\\dfrac{M_y - N_x}{N} = \\dfrac{(3x + 2y) - (2x + y)}{x^2 + xy} = \\dfrac{x + y}{x(x + y)} = \\dfrac{1}{x}$, so $\\mu = e^{\\int dx/x} = x$."
          - problem: "Find an integrating factor $\\mu(x)$ for $2y\\,dx + x\\,dy = 0$."
            answer: "$\\mu = x$"
            solution_sketch: "$\\dfrac{M_y - N_x}{N} = \\dfrac{2 - 1}{x} = \\dfrac{1}{x}$."
          - problem: "For an equation with $\\dfrac{M_y - N_x}{N} = \\dfrac{3}{x}$, find $\\mu(x)$."
            answer: "$\\mu = x^3$"
        constraints: "(M_y - N_x)/N must simplify to a function of x alone (typically k/x); mu = e^{integral}"
      - id: kp2
        name: "Finding $\\mu(y)$"
        key_prerequisites: [exact-equations]
        exemplars:
          - problem: "The equation $y\\,dx + (2x - ye^y)\\,dy = 0$ is not exact. Find an integrating factor $\\mu(y)$."
            answer: "$\\mu = y$"
            solution_sketch: "$\\dfrac{N_x - M_y}{M} = \\dfrac{2 - 1}{y} = \\dfrac{1}{y}$, so $\\mu = e^{\\int dy/y} = y$."
          - problem: "Find an integrating factor $\\mu(y)$ for $y\\,dx + 3x\\,dy = 0$."
            answer: "$\\mu = y^2$"
            solution_sketch: "$\\dfrac{N_x - M_y}{M} = \\dfrac{3 - 1}{y} = \\dfrac{2}{y}$, so $\\mu = e^{2\\ln y} = y^2$."
        constraints: "(N_x - M_y)/M must simplify to a function of y alone (typically k/y)"
      - id: kp3
        name: Completing the solution
        key_prerequisites: [exact-equations]
        exemplars:
          - problem: "Solve $2y\\,dx + x\\,dy = 0$ using the integrating factor $\\mu = x$."
            answer: "$x^2 y = C$"
            solution_sketch: "Multiplying gives $2xy\\,dx + x^2\\,dy = d(x^2 y)$."
          - problem: "Solve $(3xy + y^2)\\,dx + (x^2 + xy)\\,dy = 0$ using $\\mu = x$."
            answer: "$2x^3 y + x^2 y^2 = C$"
            solution_sketch: "After multiplying, $F = x^3 y + \\dfrac{x^2 y^2}{2}$ satisfies $F_x = 3x^2y + xy^2$, $F_y = x^3 + x^2 y$; clear the fraction."
          - problem: "Solve $y\\,dx + (2x - ye^y)\\,dy = 0$ using $\\mu = y$."
            answer: "$xy^2 - (y^2 - 2y + 2)e^y = C$"
            solution_sketch: "After multiplying, $F = xy^2 + h(y)$ with $h'(y) = -y^2 e^y$; integrating by parts twice, $h = -(y^2 - 2y + 2)e^y$."
        constraints: "after multiplying by mu the equation must pass the exactness test; reconstruct F as in exact equations"
    diagnostic_exemplar:
      problem: "Solve $y\\,dx + 3x\\,dy = 0$ by finding an integrating factor."
      answer: "$xy^3 = C$"
      solution_sketch: "$\\mu = y^2$ makes the equation $y^3\\,dx + 3xy^2\\,dy = d(xy^3) = 0$."
    anki_seeds:
      - front: "When does M dx + N dy = 0 admit an integrating factor mu(x)?"
        back: 'When $(M_y - N_x)/N$ is a function of $x$ alone; then $\mu = e^{\int (M_y - N_x)/N\,dx}$.'
        type: basic
      - front: "When does M dx + N dy = 0 admit an integrating factor mu(y)?"
        back: 'When $(N_x - M_y)/M$ is a function of $y$ alone; then $\mu = e^{\int (N_x - M_y)/M\,dy}$.'
        type: basic

  - id: natural-growth-decay-models
    name: Exponential Growth and Decay Models
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: separable-equations
        weight: 0.6
        key: true
      - id: exponential-growth-decay
        weight: 0.4
        key: false
      - id: continuous-growth-model
        # Phase C (C-D): the P_0 e^{kt} model this topic derives and manipulates is now
        # taught in foundations; exponential-growth-decay covers only discrete bases.
        weight: 0.4
        key: false
      - id: logarithm-properties
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Setting up and solving $P' = kP$"
        key_prerequisites: [separable-equations, exponential-growth-decay]
        exemplars:
          - problem: "A population obeys $P' = kP$ and doubles every $10$ hours. Find $k$ exactly."
            answer: '$k = \dfrac{\ln 2}{10}$ per hour'
            solution_sketch: '$P = P_0 e^{kt}$ and $P(10) = 2P_0$ give $e^{10k} = 2$, so $k = \frac{\ln 2}{10}$.'
          - problem: "A radioactive isotope has half-life $5730$ years. Find its decay constant $k$ in $N' = -kN$."
            answer: '$k = \dfrac{\ln 2}{5730}$ per year'
            solution_sketch: '$N = N_0 e^{-kt}$ with $N(5730) = N_0/2$ gives $e^{-5730k} = \frac{1}{2}$.'
          - problem: "Solve $P' = 0.02P$ with $P(0) = 500$."
            answer: "$P(t) = 500e^{0.02t}$"
        constraints: "doubling times and half-lives are clean integers; express rate constants exactly with ln"
      - id: kp2
        name: Time-to-reach questions
        key_prerequisites: [logarithm-properties]
        exemplars:
          - problem: "A substance decays exponentially with half-life $8$ days. How long until only $25\\%$ of it remains?"
            answer: "$16$ days"
            solution_sketch: "$25\\% = (1/2)^2$: exactly two half-lives."
          - problem: "A bacteria culture doubles every $3$ hours and starts at $100$ cells. When does it reach $800$ cells?"
            answer: "$9$ hours"
            solution_sketch: "$800/100 = 8 = 2^3$: three doubling times."
          - problem: "Solve for the time at which $P(t) = 200e^{0.05t}$ reaches $1000$."
            answer: "$t = 20\\ln 5$"
            solution_sketch: "$e^{0.05t} = 5$ gives $0.05t = \\ln 5$."
        constraints: "target ratios are powers of 2 (clean) or give single-log exact answers"
      - id: kp3
        name: "Determining $k$ and $P_0$ from data"
        key_prerequisites: [logarithm-properties, separable-equations]
        exemplars:
          - problem: "A population satisfies $P' = kP$ with $P(2) = 300$ and $P(5) = 2400$. Find $k$ and $P(0)$ exactly."
            answer: "$k = \\ln 2$; $P(0) = 75$."
            solution_sketch: "$\\dfrac{P(5)}{P(2)} = e^{3k} = 8$ gives $k = \\ln 2$; then $P(0) = 300e^{-2\\ln 2} = 300/4 = 75$."
          - problem: "A sample decays from $800$ g to $100$ g in $6$ hours. Find its half-life."
            answer: "$2$ hours"
            solution_sketch: "$100/800 = (1/2)^3$: three half-lives in $6$ hours."
        constraints: "data ratios are powers of 2 so k and the half-life come out as clean multiples of ln 2"
    diagnostic_exemplar:
      problem: 'A population satisfies $P'' = kP$ with $P(2) = 500$ and $P(6) = 8000$. Find $k$ and $P(0)$ exactly.'
      answer: '$k = \ln 2$; $P(0) = 125$.'
      solution_sketch: '$\frac{P(6)}{P(2)} = e^{4k} = 16$, so $k = \frac{\ln 16}{4} = \ln 2$. Then $P(0) = P(2)e^{-2k} = \frac{500}{4} = 125$.'
    anki_seeds:
      - front: "Solution of the natural growth equation P' = kP?"
        back: "$P(t) = P_0 e^{kt}$"
        type: basic
      - front: "Relation between the decay constant k and the half-life T?"
        back: '$k = \dfrac{\ln 2}{T}$'
        type: basic

  - id: newtons-law-of-cooling
    name: "Newton's Law of Cooling"
    core: false                # application genre; feeds only the applications capstone
    difficulty: 0.68
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: natural-growth-decay-models
        weight: 0.6
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Setting up and the general solution
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: "A body cools in a $20^{\\circ}$C room. Write the cooling ODE and its general solution."
            answer: "$T' = -k(T - 20)$; $T = 20 + Ce^{-kt}$."
            solution_sketch: "The shifted variable $u = T - 20$ satisfies $u' = -ku$."
          - problem: "A cup of coffee at $90^{\\circ}$C sits in a $25^{\\circ}$C room. Write $T(t)$ with $k$ undetermined."
            answer: "$T = 25 + 65e^{-kt}$"
            solution_sketch: "$C = T(0) - 25 = 65$."
          - problem: "For $T = 15 + 40e^{-2t}$, identify the ambient temperature and the initial temperature."
            answer: "Ambient $15^{\\circ}$; $T(0) = 55^{\\circ}$."
        constraints: "ambient temperatures and initial temperatures are integers; solution always in the form A + Ce^{-kt}"
      - id: kp2
        name: "Finding $k$ from data"
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: 'A body cools by Newton''s law $T'' = -k(T - 20)$ in a $20^{\circ}$C room. If $T(0) = 100$ and $T(10) = 60$, find $T(t)$.'
            answer: '$T(t) = 20 + 80e^{-(\ln 2/10)\,t}$'
            solution_sketch: '$T = 20 + Ce^{-kt}$ with $C = 80$; $T(10) = 60$ gives $e^{-10k} = \frac{40}{80} = \frac{1}{2}$, so $k = \frac{\ln 2}{10}$.'
          - problem: "A cold drink at $5^{\\circ}$C warms in a $25^{\\circ}$C room, reaching $15^{\\circ}$C after $4$ minutes. Find $T(t)$."
            answer: '$T = 25 - 20e^{-(\ln 2/4)\,t}$'
            solution_sketch: "$T = 25 - 20e^{-kt}$; $T(4) = 15$ gives $e^{-4k} = \\dfrac{10}{20} = \\dfrac{1}{2}$, so $k = \\dfrac{\\ln 2}{4}$."
        constraints: "the measured gap ratio is a power of 1/2 so k is a clean multiple of ln 2; warming problems flip the sign of C"
      - id: kp3
        name: Time questions
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: 'With $T(t) = 20 + 80e^{-(\ln 2/10)t}$, when does the body reach $30^{\circ}$C?'
            answer: "$t = 30$ minutes"
            solution_sketch: "$80e^{-kt} = 10$ means the gap has halved three times: $3 \\times 10 = 30$."
          - problem: 'With $T = 25 - 20e^{-(\ln 2/4)t}$, when does the drink reach $20^{\circ}$C?'
            answer: "$t = 8$ minutes"
            solution_sketch: "$20e^{-kt} = 5$: the gap quarters, i.e. two halvings of $4$ minutes each."
        constraints: "target gaps are the initial gap divided by a power of 2, so times are integer multiples of the halving time"
    diagnostic_exemplar:
      problem: "A body in a $20^{\\circ}$C room cools from $100^{\\circ}$C to $60^{\\circ}$C in $10$ minutes. When does it reach $25^{\\circ}$C?"
      answer: "$40$ minutes"
      solution_sketch: "The gap halves every $10$ minutes: $80 \\to 40 \\to 20 \\to 10 \\to 5$ takes four halvings."
    anki_seeds:
      - front: "Newton's law of cooling as an ODE (ambient temperature A)?"
        back: "$T' = -k(T - A)$ with $k > 0$."
        type: basic
      - front: "Solution of T' = -k(T - A) with T(0) = T0?"
        back: "$T = A + (T_0 - A)e^{-kt}$"
        type: basic

  - id: mixing-tank-models
    name: Mixing Tank Models
    core: false                # application genre; feeds only the applications capstone
    difficulty: 0.70
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: linear-first-order-integrating-factor
        weight: 0.7
        key: true
      - id: natural-growth-decay-models
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Setting up the balance equation
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "A $100$ L tank starts with pure water. Brine at $2$ g/L flows in at $5$ L/min; the well-mixed solution leaves at $5$ L/min. Write the ODE for the salt $A(t)$."
            answer: "$A' = 10 - \\dfrac{A}{20}$, $A(0) = 0$."
            solution_sketch: "Rate in $= 2 \\cdot 5 = 10$ g/min; rate out $= 5 \\cdot \\dfrac{A}{100} = \\dfrac{A}{20}$."
          - problem: "A $50$ L tank holds $10$ g of salt. Brine at $1$ g/L flows in at $2$ L/min, and the mixture leaves at $2$ L/min. Write the ODE."
            answer: "$A' = 2 - \\dfrac{A}{25}$, $A(0) = 10$."
          - problem: "Pure water flows at $4$ L/min into a $200$ L tank of brine, and the mixture drains at $4$ L/min. Write the ODE for the salt $A(t)$."
            answer: "$A' = -\\dfrac{A}{50}$"
            solution_sketch: "Rate in is $0$; rate out is $4 \\cdot \\dfrac{A}{200}$."
        constraints: "constant volume (equal flow rates); rate out = (outflow rate) x A/V; integer concentrations and flows"
      - id: kp2
        name: Solving the model
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "Solve $A' = 10 - \\dfrac{A}{20}$ with $A(0) = 0$."
            answer: "$A(t) = 200(1 - e^{-t/20})$"
            solution_sketch: "Equilibrium $200$; $A = 200 + Ce^{-t/20}$ with $C = -200$."
          - problem: "Solve $A' = 2 - \\dfrac{A}{25}$ with $A(0) = 10$."
            answer: "$A(t) = 50 - 40e^{-t/25}$"
            solution_sketch: "Equilibrium $50$; $A(0) = 10$ gives $C = -40$."
          - problem: "Solve $A' = -\\dfrac{A}{50}$ with $A(0) = 30$."
            answer: "$A(t) = 30e^{-t/50}$"
        constraints: "solutions have the shape (limit) + C e^{-t/tau}; C fixed by the initial amount"
      - id: kp3
        name: Long-run behavior and timing
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "For $A(t) = 200(1 - e^{-t/20})$, how much salt does the tank hold in the long run?"
            answer: "$200$ g"
            solution_sketch: "Set $A' = 0$ (or note the inflow concentration $2$ g/L times the $100$ L volume)."
          - problem: "For $A(t) = 200(1 - e^{-t/20})$, when does the tank hold $100$ g?"
            answer: "$t = 20\\ln 2$ minutes"
            solution_sketch: "$1 - e^{-t/20} = \\tfrac{1}{2}$ gives $e^{-t/20} = \\tfrac{1}{2}$."
          - problem: "What is the long-run concentration in a constant-volume tank fed with brine at $2$ g/L?"
            answer: "$2$ g/L — the inflow concentration."
        constraints: "long-run amount = inflow concentration x volume; timing answers are clean multiples of tau ln 2"
    diagnostic_exemplar:
      problem: 'A $40$ L tank starts with pure water. Brine containing $3$ g/L flows in at $4$ L/min and the well-mixed solution leaves at $4$ L/min. Find the amount of salt $A(t)$ in the tank, and the time at which it reaches $60$ g.'
      answer: '$A(t) = 120\left(1 - e^{-t/10}\right)$; it reaches $60$ g at $t = 10\ln 2$ minutes.'
      solution_sketch: 'Balance: $A'' = 3 \cdot 4 - \frac{A}{40}\cdot 4 = 12 - \frac{A}{10}$ with $A(0) = 0$, whose solution is $A = 120(1 - e^{-t/10})$. Setting $A = 60$ gives $e^{-t/10} = \frac{1}{2}$.'
    anki_seeds:
      - front: "In a constant-volume mixing tank, the rate of salt leaving is..."
        back: "(outflow rate) x A/V: the outflow carries the current concentration."
        type: basic
      - front: "Long-run amount of salt in a constant-volume tank?"
        back: "inflow concentration x tank volume."
        type: basic

  - id: logistic-population-models
    name: The Logistic Equation
    core: false                # named model; feeds only the applications capstone
    difficulty: 0.72
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: separable-equations
        weight: 0.5
        key: true
      - id: partial-fractions-integration
        weight: 0.5
        key: true
      - id: slope-fields-equilibria
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Structure and equilibria
        key_prerequisites: [slope-fields-equilibria]
        exemplars:
          - problem: "Identify $r$ and the carrying capacity $K$ in $P' = 3P\\left(1 - \\dfrac{P}{600}\\right)$."
            answer: "$r = 3$; $K = 600$."
          - problem: "For $P' = 0.5P\\left(1 - \\dfrac{P}{100}\\right)$ with $P(0) = 10$, find $\\lim_{t \\to \\infty} P(t)$."
            answer: "$100$"
            solution_sketch: "Any solution starting in $(0, 100)$ increases to the carrying capacity $100$."
          - problem: "At what population does $P' = 0.5P\\left(1 - \\dfrac{P}{100}\\right)$ grow fastest?"
            answer: "$P = 50$"
            solution_sketch: "$P'$ is a downward parabola in $P$ with roots $0$ and $K$; the vertex is at $K/2$."
        constraints: "carrying capacity a round number; equilibria 0 (unstable) and K (stable); fastest growth at K/2"
      - id: kp2
        name: Solving via partial fractions
        key_prerequisites: [partial-fractions-integration, separable-equations]
        exemplars:
          - problem: "Solve the logistic equation $y' = y(1 - y)$ with $y(0) = \\tfrac{1}{2}$."
            answer: "$y = \\dfrac{1}{1 + e^{-t}}$"
            solution_sketch: "Partial fractions on $\\dfrac{dy}{y(1-y)}$ give the general solution $y = \\dfrac{1}{1 + Ce^{-t}}$; $y(0) = \\tfrac{1}{2}$ forces $C = 1$."
          - problem: "Solve $P' = 2P\\left(1 - \\dfrac{P}{1000}\\right)$ with $P(0) = 100$."
            answer: "$P = \\dfrac{1000}{1 + 9e^{-2t}}$"
            solution_sketch: "The general solution is $P = \\dfrac{K}{1 + Ce^{-rt}}$ with $K = 1000$, $r = 2$; $P(0) = 100$ gives $C = 9$."
        constraints: "K and r integers; C = (K - P0)/P0 comes out an integer"
      - id: kp3
        name: Reading the solution form
        key_prerequisites: [separable-equations]
        exemplars:
          - problem: "A population follows $P(t) = \\dfrac{1000}{1 + 9e^{-t}}$. Find $P(0)$ and the carrying capacity."
            answer: "$P(0) = 100$; carrying capacity $1000$."
            solution_sketch: "$P(0) = 1000/(1+9) = 100$; as $t \\to \\infty$ the denominator tends to $1$."
          - problem: "For $P(t) = \\dfrac{1000}{1 + 9e^{-t}}$, when does $P = 500$?"
            answer: "$t = \\ln 9$"
            solution_sketch: "$1 + 9e^{-t} = 2$ gives $e^{-t} = \\tfrac{1}{9}$."
        constraints: "P0 and K read off directly; half-capacity time is a clean logarithm ln C"
    diagnostic_exemplar:
      problem: 'Solve $P'' = 2P\left(1 - \dfrac{P}{600}\right)$ with $P(0) = 200$, and state the carrying capacity.'
      answer: '$P(t) = \dfrac{600}{1 + 2e^{-2t}}$; carrying capacity $600$.'
      solution_sketch: 'Here $r = 2$ and $K = 600$. Partial fractions give $P = \frac{K}{1 + Ae^{-rt}}$ with $A = \frac{K - P_0}{P_0} = \frac{400}{200} = 2$.'
    anki_seeds:
      - front: "In the logistic equation P' = rP(1 - P/K), K is the..."
        back: "carrying capacity: the stable equilibrium every positive solution approaches."
        type: basic
      - front: "Solution form of the logistic equation?"
        back: '$P = \dfrac{K}{1 + Ce^{-rt}}$ with $C = (K - P_0)/P_0$.'
        type: basic

  - id: first-order-applications
    name: Mixed First-Order Models
    core: false                # applications capstone; terminal
    difficulty: 0.76
    drill: false
    answer_kind: multi-step
    expected_time_secs: 300
    prerequisites:
      - id: natural-growth-decay-models
        weight: 0.5
        key: true
      - id: mixing-tank-models
        weight: 0.5
        key: true
      - id: newtons-law-of-cooling
        weight: 0.4
        key: false
      - id: logistic-population-models
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Growth with harvesting or immigration
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: "A fish population grows at relative rate $0.5$/year but is harvested at $100$ fish/year: $P' = 0.5P - 100$. Find the equilibrium population."
            answer: "$200$"
            solution_sketch: "Set $P' = 0$: $0.5P = 100$."
          - problem: "Solve $P' = 0.5P - 100$ with $P(0) = 300$ and describe the long-run behavior."
            answer: "$P = 200 + 100e^{t/2}$: the population grows without bound."
            solution_sketch: "$P - 200$ satisfies natural growth; starting above the (unstable) equilibrium, the population runs away upward."
          - problem: "Solve $P' = 0.5P - 100$ with $P(0) = 100$. When does the population die out?"
            answer: "$P = 200 - 100e^{t/2}$; extinction at $t = 2\\ln 2$ years."
            solution_sketch: "Below the equilibrium the gap grows: $200 - 100e^{t/2} = 0$ gives $e^{t/2} = 2$."
        constraints: "P' = kP - h with clean equilibrium h/k; the equilibrium is unstable — solutions diverge on both sides"
      - id: kp2
        name: Linear models across domains
        key_prerequisites: [mixing-tank-models]
        exemplars:
          - problem: "A falling object obeys $v' = 10 - 2v$ with $v(0) = 0$ (drag proportional to speed). Find $v(t)$ and the terminal velocity."
            answer: "$v = 5(1 - e^{-2t})$; terminal velocity $5$ m/s."
            solution_sketch: "Equilibrium $v = 5$; $v = 5 + Ce^{-2t}$ with $C = -5$."
          - problem: "A drug is infused at $20$ mg/h and eliminated at relative rate $1/4$ per hour: $A' = 20 - \\dfrac{A}{4}$, $A(0) = 0$. Find $A(t)$ and the long-run amount."
            answer: "$A = 80(1 - e^{-t/4})$; long-run $80$ mg."
          - problem: "A capacitor charges by $V' = \\dfrac{12 - V}{2}$ with $V(0) = 0$. Find $V(t)$."
            answer: "$V = 12(1 - e^{-t/2})$"
            solution_sketch: "Same structure as a mixing tank: approach the source voltage $12$ exponentially."
        constraints: "all models are y' = a - by with clean equilibrium a/b; emphasize the shared structure across contexts"
      - id: kp3
        name: Two-stage prediction problems
        key_prerequisites: [newtons-law-of-cooling, natural-growth-decay-models]
        exemplars:
          - problem: "Coffee at $90^{\\circ}$C in a $20^{\\circ}$C room cools to $70^{\\circ}$C in $5$ minutes. How long after the start does it reach $50^{\\circ}$C? Give an exact answer."
            answer: '$t = \dfrac{5\ln(7/3)}{\ln(7/5)}$ minutes ($\approx 12.6$)'
            solution_sketch: "$T = 20 + 70e^{-kt}$; $T(5) = 70$ gives $e^{-5k} = \\tfrac{5}{7}$. Then $70e^{-kt} = 30$ gives $t = \\dfrac{\\ln(7/3)}{k}$ with $k = \\tfrac{1}{5}\\ln\\tfrac{7}{5}$."
          - problem: "A population doubles in $5$ hours. Exactly how long until it is $10$ times its initial size?"
            answer: '$t = \dfrac{5\ln 10}{\ln 2}$ hours'
            solution_sketch: "$k = \\tfrac{\\ln 2}{5}$; solve $e^{kt} = 10$."
        constraints: "first stage determines k from one measurement; second stage inverts for a time; answers exact in logarithms"
    diagnostic_exemplar:
      problem: 'A fish population grows at relative rate $0.4$ per year but is harvested at a constant $200$ fish per year: $P'' = 0.4P - 200$. With $P(0) = 400$, when does the population die out? Give an exact answer.'
      answer: '$t = \dfrac{5\ln 5}{2}$ years.'
      solution_sketch: 'The equilibrium is $P = 500$, and $P = 500 + (400 - 500)e^{0.4t} = 500 - 100e^{0.4t}$. This is zero when $e^{0.4t} = 5$, i.e. $t = \frac{\ln 5}{0.4} = \frac{5\ln 5}{2}$.'
    anki_seeds:
      - front: "Equilibrium of the harvested growth model P' = kP - h?"
        back: "P = h/k — and it is unstable: solutions diverge from it on both sides."
        type: basic
      - front: "Terminal velocity for v' = g - (k/m)v?"
        back: "$v_{\\infty} = mg/k$: set $v' = 0$."
        type: basic

  - id: orthogonal-trajectories
    name: Orthogonal Trajectories
    core: false                # application genre; terminal
    difficulty: 0.74
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: separable-equations
        weight: 0.5
        key: true
      - id: implicit-differentiation
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: The ODE of a family of curves
        key_prerequisites: [implicit-differentiation]
        exemplars:
          - problem: "Find the differential equation satisfied by the family $y = Cx^2$."
            answer: "$y' = \\dfrac{2y}{x}$"
            solution_sketch: "$y' = 2Cx$ and $C = y/x^2$, so $y' = 2(y/x^2)x = 2y/x$."
          - problem: "Find the differential equation of the circles $x^2 + y^2 = C$."
            answer: "$y' = -\\dfrac{x}{y}$"
            solution_sketch: "Differentiate implicitly: $2x + 2yy' = 0$."
          - problem: "Find the differential equation of the lines $y = Cx$."
            answer: "$y' = \\dfrac{y}{x}$"
        constraints: "one-parameter families; eliminate C between the equation and its derivative"
      - id: kp2
        name: The orthogonality condition
        key_prerequisites: [implicit-differentiation]
        exemplars:
          - problem: "The family $y = Cx^2$ satisfies $y' = 2y/x$. What ODE do its orthogonal trajectories satisfy?"
            answer: "$y' = -\\dfrac{x}{2y}$"
            solution_sketch: "Replace $y'$ by $-1/y'$: perpendicular slopes are negative reciprocals."
          - problem: "The circles $x^2 + y^2 = C$ satisfy $y' = -x/y$. What ODE do their orthogonal trajectories satisfy?"
            answer: "$y' = \\dfrac{y}{x}$"
        constraints: "pure slope-swap step: y' -> -1/y'; simplify the resulting right side"
      - id: kp3
        name: Solving for the trajectories
        key_prerequisites: [separable-equations, implicit-differentiation]
        exemplars:
          - problem: "Find the orthogonal trajectories of the parabolas $y = Cx^2$."
            answer: "The ellipses $x^2 + 2y^2 = C$."
            solution_sketch: "Solve $y' = -\\dfrac{x}{2y}$: $2y\\,dy = -x\\,dx$ gives $y^2 = -\\dfrac{x^2}{2} + C$."
          - problem: "Find the orthogonal trajectories of the circles $x^2 + y^2 = C$."
            answer: "The lines $y = Cx$."
            solution_sketch: "Solve $y' = y/x$: separable, $\\ln|y| = \\ln|x| + C$."
        constraints: "trajectory ODEs are separable with power/log integrals; present the orthogonal family with its own constant C"
    diagnostic_exemplar:
      problem: "Find the orthogonal trajectories of the lines $y = Cx$."
      answer: "The circles $x^2 + y^2 = C$."
      solution_sketch: "The lines satisfy $y' = y/x$; the trajectories solve $y' = -x/y$, which integrates to $x^2 + y^2 = C$."
    anki_seeds:
      - front: "To find orthogonal trajectories of a family with ODE y' = f(x, y), solve..."
        back: "$y' = -1/f(x, y)$: perpendicular curves have negative-reciprocal slopes."
        type: basic
      - front: "First step in finding orthogonal trajectories of a family F(x, y, C) = 0?"
        back: "Find the family's own ODE by differentiating and eliminating C."
        type: basic
