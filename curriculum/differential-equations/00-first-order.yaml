unit: first-order
course: differential-equations
module: "First-Order Equations"
topics:
  - id: ode-order-linearity
    name: Order and Linearity of Differential Equations
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 60
    prerequisites:
      - id: higher-order-derivatives
        weight: 0.5
        key: true
      - id: derivatives-trig
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: Identifying the order
        key_prerequisites: [higher-order-derivatives]
        exemplars:
          - problem: "State the order of $y'' + 3y' - y = x$."
            answer: "Order 2."
            solution_sketch: "The highest derivative appearing is $y''$."
          - problem: "State the order of $(y')^3 + y = 0$."
            answer: "Order 1."
            solution_sketch: "Only the first derivative appears; cubing it does not change the order."
          - problem: "State the order of $y''' - x^2 y' = e^x$."
            answer: "Order 3."
        constraints: "orders 1-3; include powers of lower-order derivatives as distractors"
      - id: kp2
        name: Linear or nonlinear
        key_prerequisites: []
        exemplars:
          - problem: 'State whether $y'''' + xy = \sin x$ is linear.'
            answer: "Linear."
            solution_sketch: "The unknown $y$ and its derivatives appear to the first power with coefficients depending only on $x$."
          - problem: "State whether $y' + y^2 = x$ is linear."
            answer: "Nonlinear: the $y^2$ term."
          - problem: 'State whether $y'''' + \sin y = 0$ is linear.'
            answer: 'Nonlinear: $\sin y$ is a nonlinear function of the unknown.'
            solution_sketch: 'Compare with $y'''' + (\sin x)\,y = 0$, which IS linear: what matters is how $y$ enters, not $x$.'
        constraints: "nonlinearity caused by powers of y or y', products y y', or functions like sin y, e^y; include a linear equation with variable coefficients as a foil"
      - id: kp3
        name: Translating rate statements into ODEs
        key_prerequisites: []
        exemplars:
          - problem: "A population $P$ grows at a rate proportional to its size. Write the differential equation."
            answer: "$P' = kP$"
          - problem: "A body's temperature $T$ changes at a rate proportional to the difference between $T$ and the ambient $20^{\\circ}$C. Write the differential equation."
            answer: "$T' = -k(T - 20)$"
            solution_sketch: "The minus sign makes a hot body cool toward $20$."
          - problem: "A quantity $y$ decreases at a rate proportional to the square of $y$. Write the differential equation."
            answer: "$y' = -ky^2$"
        constraints: "proportionality statements with k > 0; always ask for the sign that matches the described behavior"
    diagnostic_exemplar:
      problem: 'A quantity $y$ decreases at a rate proportional to the square of $y$. Write the differential equation, and state its order and whether it is linear.'
      answer: '$y'' = -ky^2$; order $1$; nonlinear (the unknown appears squared).'
      solution_sketch: '"Rate of change" is $y''$, "proportional to $y^2$" gives $ky^2$, and "decreases" makes it negative. The highest derivative is the first, and $y^2$ is a nonlinear function of the unknown.'
    anki_seeds:
      - front: "The order of a differential equation is..."
        back: "the order of the highest derivative that appears."
        type: basic
      - front: "A differential equation is linear when..."
        back: "y and its derivatives appear only to the first power, with coefficients depending only on the independent variable."
        type: basic

  - id: ode-classification-verification
    name: Verifying Solutions of ODEs
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: ode-order-linearity
        weight: 0.6
        key: true
      - id: chain-rule
        weight: 0.5
        key: true
      - id: derivatives-exp-log
        weight: 0.4
        key: false
      - id: implicit-differentiation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Verifying a solution by substitution
        key_prerequisites: [chain-rule, derivatives-exp-log]
        exemplars:
          - problem: "Verify that $y = e^{3x}$ is a solution of $y' - 3y = 0$."
            answer: "Yes: $y' = 3e^{3x} = 3y$, so $y' - 3y = 0$."
            solution_sketch: "Differentiate, substitute, and confirm the equation reduces to $0 = 0$."
          - problem: "Is $y = x^2$ a solution of $xy' = 2y$ for $x > 0$?"
            answer: "Yes: $xy' = x(2x) = 2x^2 = 2y$."
          - problem: 'Verify that $y = \sin 2x$ solves $y'''' + 4y = 0$.'
            answer: 'Yes: $y'''' = -4\sin 2x$, so $y'''' + 4y = -4\sin 2x + 4\sin 2x = 0$.'
            solution_sketch: 'By the chain rule $y'' = 2\cos 2x$ and $y'''' = -4\sin 2x$; substitute and cancel.'
        constraints: "candidate solutions built from e^{kx}, sin/cos of kx, and polynomials; verification always closes to an identity"
      - id: kp2
        name: Verifying implicit solutions
        key_prerequisites: [implicit-differentiation]
        exemplars:
          - problem: "Show that any function $y(x)$ satisfying $x^2 + y^2 = 9$ solves $y' = -x/y$."
            answer: "Differentiating implicitly: $2x + 2y\\,y' = 0$, so $y' = -x/y$."
          - problem: "Show that curves $x^3 + y^3 = 7$ satisfy $y' = -x^2/y^2$."
            answer: "Implicit differentiation gives $3x^2 + 3y^2 y' = 0$, so $y' = -x^2/y^2$."
          - problem: "Verify that $xy = 4$ defines a solution of $xy' + y = 0$."
            answer: "Differentiating $xy = 4$: $y + xy' = 0$, which is the equation."
            solution_sketch: "Product rule on the left of $xy = 4$; the result is exactly the ODE."
        constraints: "implicit relations polynomial in x and y; one implicit differentiation closes the verification"
      - id: kp3
        name: Fitting constants and parameters
        key_prerequisites: [derivatives-exp-log]
        exemplars:
          - problem: "The general solution of $y' + 2y = 0$ is $y = Ce^{-2x}$. Find $C$ so that $y(0) = 5$."
            answer: "$C = 5$"
            solution_sketch: "$y(0) = Ce^0 = C = 5$."
          - problem: "For which values of $r$ is $y = e^{rx}$ a solution of $y'' - y' - 6y = 0$?"
            answer: "$r = 3$ or $r = -2$"
            solution_sketch: "Substituting gives $(r^2 - r - 6)e^{rx} = 0$, so $r^2 - r - 6 = (r-3)(r+2) = 0$."
        constraints: "one unknown constant or exponent parameter; the resulting algebraic equation is linear or a factorable quadratic"
    diagnostic_exemplar:
      problem: 'Show that $y^2 = x^2 + C$ defines a solution of $y\,y'' = x$, and find the value of $C$ for which the solution passes through $(1, 3)$.'
      answer: 'Differentiating implicitly gives $2y\,y'' = 2x$, i.e. $y\,y'' = x$; and $y(1) = 3$ forces $9 = 1 + C$, so $C = 8$.'
      solution_sketch: 'Implicit differentiation verifies the family; substituting the point fits the constant.'
    anki_seeds:
      - front: "To verify that y = f(x) solves an ODE, you..."
        back: "compute the needed derivatives, substitute, and check the equation reduces to an identity."
        type: basic
      - front: "To verify an implicit solution F(x, y) = C of an ODE, you..."
        back: "differentiate the relation implicitly and compare with the ODE."
        type: basic

  - id: existence-uniqueness-first-order
    name: Existence and Uniqueness
    core: false                # reassurance theorem; its statement is never invoked later
    difficulty: 0.63
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: ode-classification-verification
        weight: 0.5
        key: true
      - id: partial-derivatives
        weight: 0.4
        key: false
      - id: continuity
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Applying the existence-uniqueness theorem
        key_prerequisites: [continuity, partial-derivatives]
        exemplars:
          - problem: "Does $y' = x - y$ with $y(0) = 1$ have a unique solution near $x = 0$?"
            answer: 'Yes: $f = x - y$ and $\partial f/\partial y = -1$ are continuous everywhere.'
            solution_sketch: 'Picard''s theorem: continuity of $f$ and $f_y$ on a rectangle around $(0, 1)$ guarantees a unique local solution.'
          - problem: 'Does $y'' = \sqrt{y}$ with $y(1) = 4$ have a unique solution near $x = 1$?'
            answer: 'Yes: $f = \sqrt{y}$ and $f_y = \dfrac{1}{2\sqrt{y}}$ are continuous near $y = 4 > 0$.'
          - problem: "Does $y' = y/x$ with $y(2) = 1$ have a unique solution near $x = 2$?"
            answer: "Yes: $f = y/x$ and $f_y = 1/x$ are continuous near $(2, 1)$, away from $x = 0$."
        constraints: "check continuity of f and f_y on a rectangle around the initial point; initial data placed safely away from any trouble spots"
      - id: kp2
        name: Where the guarantee fails
        key_prerequisites: [ode-classification-verification]
        exemplars:
          - problem: "For $y' = 3y^{2/3}$ with $y(0) = 0$, does the theorem guarantee uniqueness? Exhibit two solutions on $x \\geq 0$."
            answer: "No: $f_y = 2y^{-1/3}$ blows up at $y = 0$. Both $y = 0$ and $y = x^3$ solve the IVP."
            solution_sketch: "Check $y = x^3$: $y' = 3x^2$ and $3(x^3)^{2/3} = 3x^2$. Uniqueness fails exactly where $f_y$ is discontinuous."
          - problem: 'For $y'' = 2\sqrt{y}$ with $y(0) = 0$, exhibit two solutions on $x \geq 0$.'
            answer: '$y = 0$ and $y = x^2$.'
            solution_sketch: 'For $y = x^2$ ($x \geq 0$): $y'' = 2x = 2\sqrt{x^2}$. $f_y = 1/\sqrt{y}$ is unbounded at $y = 0$.'
          - problem: "Solve $y' = y^2$ with $y(0) = 1$. On what interval does the solution exist?"
            answer: '$y = \dfrac{1}{1 - x}$, which exists only on $(-\infty, 1)$.'
            solution_sketch: "Separable; the solution blows up at $x = 1$ even though $f = y^2$ is continuous everywhere — existence is only local."
        constraints: "failure modes: f_y discontinuous at the initial y (non-uniqueness) or blow-up in finite time (local existence); solutions verifiable by substitution"
      - id: kp3
        name: Intervals of validity for linear equations
        key_prerequisites: [continuity]
        exemplars:
          - problem: "For $(x - 3)y' + y = \\ln x$ with $y(1) = 2$, find the largest interval on which a unique solution is guaranteed."
            answer: "$(0, 3)$"
            solution_sketch: 'In standard form the coefficients are discontinuous at $x = 3$ and $\ln x$ needs $x > 0$; the largest interval containing $x_0 = 1$ is $(0, 3)$.'
          - problem: 'For $y'' + (\tan x)\,y = \sin x$ with $y(0) = 0$, find the largest guaranteed interval.'
            answer: '$(-\pi/2, \pi/2)$'
            solution_sketch: '$\tan x$ is continuous between consecutive odd multiples of $\pi/2$; take the interval containing $0$.'
          - problem: "For $(x+1)y' + y = \\dfrac{1}{x}$ with $y(1) = 2$, find the largest guaranteed interval."
            answer: '$(0, \infty)$'
            solution_sketch: "Trouble spots are $x = -1$ and $x = 0$; the largest interval containing $x_0 = 1$ avoiding both is $(0, \\infty)$."
        constraints: "linear equations with 1-2 discontinuity points; the answer is the largest open interval containing x_0 avoiding all of them"
    diagnostic_exemplar:
      problem: "For $(x^2 - 4)y' + y = x$ with $y(0) = 1$, state the largest interval on which a unique solution is guaranteed."
      answer: "$(-2, 2)$"
      solution_sketch: "The standard-form coefficients are discontinuous at $x = \\pm 2$; the initial point $x_0 = 0$ lies between them."
    anki_seeds:
      - front: "Existence-uniqueness theorem for y' = f(x, y), y(x0) = y0?"
        back: "If f and ∂f/∂y are continuous on a rectangle around (x0, y0), a unique solution exists on some interval around x0."
        type: basic
      - front: "For a linear equation y' + P(x)y = Q(x), a unique solution exists on..."
        back: "the largest open interval containing x0 where P and Q are both continuous."
        type: basic

  - id: slope-fields
    name: Slope Fields
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: ode-classification-verification
        weight: 0.5
        key: true
      - id: slope
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Reading slopes from the equation
        key_prerequisites: [slope]
        exemplars:
          - problem: "For $y' = x - y$, what is the slope of the solution curve through $(2, 1)$?"
            answer: "$1$"
            solution_sketch: "The slope at a point is $f(x,y) = 2 - 1 = 1$."
          - problem: "For $y' = xy$, what is the slope of the solution curve through $(2, 3)$?"
            answer: "$6$"
          - problem: "For $y' = x^2 + y$, what is the slope at $(1, -2)$?"
            answer: "$-1$"
            solution_sketch: "$f(1, -2) = 1 + (-2) = -1$."
        constraints: "f(x,y) polynomial with small integer coefficients; pure evaluation"
      - id: kp2
        name: Isoclines and zero-slope loci
        key_prerequisites: [slope]
        exemplars:
          - problem: "For $y' = x^2 + y$, describe all points where the slope field is horizontal."
            answer: "The points on the parabola $y = -x^2$."
            solution_sketch: "Set $x^2 + y = 0$."
          - problem: "For $y' = x - y$, on what curve do the slope marks all have slope $2$?"
            answer: "The line $y = x - 2$."
            solution_sketch: "Set $x - y = 2$."
          - problem: "For $y' = y - 2x$, where is the slope field horizontal?"
            answer: "On the line $y = 2x$."
        constraints: "isoclines f(x,y) = c are lines or parabolas; ask for horizontal (c = 0) and one nonzero c"
      - id: kp3
        name: Qualitative behavior from the field
        key_prerequisites: [ode-classification-verification]
        exemplars:
          - problem: "Explain why no solution curve of $y' = 1 + y^2$ ever has a horizontal tangent."
            answer: "The slope $1 + y^2 \\geq 1 > 0$ everywhere, so every solution is strictly increasing."
          - problem: "For $y' = x$, describe the slope field and the family of solution curves."
            answer: 'Slopes depend only on $x$ (constant along vertical lines), horizontal along the $y$-axis; the solutions are the parabolas $y = \frac{x^2}{2} + C$.'
          - problem: "For $y' = y$, along which lines are the slope marks constant?"
            answer: "Along horizontal lines: the slope depends only on $y$."
            solution_sketch: "An equation $y' = f(y)$ (autonomous) has a slope field that is invariant under horizontal shifts."
        constraints: "qualitative questions: monotonicity from sign of f, symmetry of the field, identifying whether slopes depend on x, y, or both"
    diagnostic_exemplar:
      problem: 'For $y'' = x^2 + 1$, say where the slope marks are horizontal, along which lines they are constant, and give the family of solution curves.'
      answer: 'Nowhere horizontal: $x^2 + 1 \ge 1 > 0$, so every solution is strictly increasing. The slope depends only on $x$, so the marks are constant along vertical lines. The solutions are $y = \frac{x^3}{3} + x + C$.'
      solution_sketch: 'Horizontal marks would need $x^2 + 1 = 0$, which has no real solution; constancy along vertical lines follows from the absence of $y$; integrating gives the family.'
    anki_seeds:
      - front: "The slope field of y' = f(x, y) assigns to each point (x, y)..."
        back: "a short mark of slope f(x, y); solution curves follow the marks."
        type: basic
      - front: "An isocline of y' = f(x, y) is..."
        back: "a curve f(x, y) = c on which all slope marks have the same slope c."
        type: basic

  - id: slope-fields-equilibria
    name: Autonomous Equations and Phase Lines
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: slope-fields
        weight: 0.6
        key: true
      - id: factoring-trinomials
        weight: 0.25
        key: false
    knowledge_points:
      - id: kp1
        name: Finding equilibria and drawing the phase line
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: "Find the equilibrium solutions of $y' = y^2 - 5y + 6$."
            answer: "$y = 2$ and $y = 3$."
            solution_sketch: "Solve $f(y) = (y-2)(y-3) = 0$."
          - problem: "Find the equilibrium solutions of $y' = 4y - y^2$."
            answer: "$y = 0$ and $y = 4$."
          - problem: "Describe the phase line of $y' = y(2 - y)$."
            answer: "Equilibria at $0$ and $2$; arrows point down below $0$, up on $(0, 2)$, down above $2$."
            solution_sketch: "Sign chart of $f(y) = y(2-y)$: negative, positive, negative."
        constraints: "f(y) factorable with integer roots; phase line = equilibria plus arrow directions from the sign of f"
      - id: kp2
        name: Stability classification
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: "Find the equilibrium solutions of $y' = y(2 - y)$ and classify their stability."
            answer: "$y = 0$ unstable; $y = 2$ stable."
            solution_sketch: "$f(y) = y(2-y)$ is negative for $y < 0$, positive on $(0, 2)$, negative for $y > 2$: the flow points away from $0$ and toward $2$."
          - problem: "Find and classify the equilibria of $y' = y^2 - 9$."
            answer: "$y = -3$ stable; $y = 3$ unstable."
            solution_sketch: "$f > 0$ for $|y| > 3$ and $f < 0$ on $(-3, 3)$: solutions rise into $-3$ from below, fall into it from above, and flee $3$."
          - problem: "Classify the equilibrium of $y' = (y - 1)^2$."
            answer: "$y = 1$ is semistable: attracting from below, repelling from above."
            solution_sketch: "$f \\geq 0$ on both sides, so solutions increase toward $1$ from below and increase away from it above."
        constraints: "f(y) factorable with integer roots; classify via a sign chart of f, no derivative test needed"
      - id: kp3
        name: Long-run behavior from an initial condition
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: "For $y' = y(2 - y)$ with $y(0) = 1$, find $\\lim_{t \\to \\infty} y(t)$."
            answer: "$2$"
            solution_sketch: "Starting in $(0,2)$ where $f > 0$, the solution increases monotonically toward the stable equilibrium $2$."
          - problem: "For $y' = y^2 - 9$ with $y(0) = 0$, find $\\lim_{t \\to \\infty} y(t)$."
            answer: "$-3$"
            solution_sketch: "On $(-3,3)$, $f < 0$: the solution decreases toward the stable equilibrium $-3$."
          - problem: "For $y' = -\\tfrac{1}{2}(y - 4)$ with $y(0) = 10$, find $\\lim_{t \\to \\infty} y(t)$."
            answer: "$4$"
            solution_sketch: "$f < 0$ for $y > 4$, so the solution decays monotonically to the equilibrium $4$."
        constraints: "initial value sits strictly between or beyond integer equilibria; the answer is the equilibrium the flow carries it to"
    diagnostic_exemplar:
      problem: "For $y' = y(y - 3)$: find all equilibria, classify their stability, and find $\\lim_{t \\to \\infty} y(t)$ for the solution with $y(0) = 1$."
      answer: "$y = 0$ stable, $y = 3$ unstable; the solution with $y(0) = 1$ tends to $0$."
      solution_sketch: "$f > 0$ for $y < 0$, $f < 0$ on $(0,3)$, $f > 0$ for $y > 3$; from $y(0) = 1$ the solution decreases to $0$."
    anki_seeds:
      - front: "Equilibrium solutions of the autonomous equation y' = f(y) are..."
        back: "the constant solutions y = c where f(c) = 0."
        type: basic
      - front: "An equilibrium of y' = f(y) is stable when..."
        back: "f > 0 just below it and f < 0 just above it (the flow points toward it from both sides)."
        type: basic

  - id: eulers-method
    name: "Euler's Method"
    core: false                # named numerical algorithm; nothing here uses it
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: slope-fields-equilibria
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: A single Euler step
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "For $y' = x + y$ with $y(0) = 1$, take one Euler step of size $h = 0.1$ to estimate $y(0.1)$."
            answer: "$1.1$"
            solution_sketch: "$y_1 = y_0 + h\\,f(x_0, y_0) = 1 + 0.1(0 + 1) = 1.1$."
          - problem: "For $y' = y$ with $y(0) = 1$ and $h = 0.5$, estimate $y(0.5)$ with one Euler step."
            answer: "$1.5$"
          - problem: "For $y' = x - y$ with $y(1) = 2$ and $h = 0.2$, estimate $y(1.2)$ with one Euler step."
            answer: "$1.8$"
            solution_sketch: "$y_1 = 2 + 0.2(1 - 2) = 2 - 0.2 = 1.8$."
        constraints: "h in {0.1, 0.2, 0.25, 0.5}; f polynomial; arithmetic exact in one or two decimal places"
      - id: kp2
        name: Iterating several steps
        key_prerequisites: [slope-fields-equilibria, evaluating-expressions]
        exemplars:
          - problem: "For $y' = x + y$ with $y(0) = 1$ and $h = 0.1$, estimate $y(0.2)$ using two Euler steps."
            answer: "$1.22$"
            solution_sketch: "Step 1: $y_1 = 1 + 0.1(1) = 1.1$ at $x = 0.1$. Step 2: slope $= 0.1 + 1.1 = 1.2$, so $y_2 = 1.1 + 0.12 = 1.22$."
          - problem: "For $y' = y$ with $y(0) = 1$ and $h = 0.5$, estimate $y(1)$ using two Euler steps."
            answer: "$2.25$"
            solution_sketch: "Each step multiplies by $1.5$: $1 \\to 1.5 \\to 2.25$."
          - problem: "For $y' = x^2$ with $y(0) = 0$ and $h = 1$, estimate $y(2)$ using two Euler steps."
            answer: "$1$"
            solution_sketch: "$y_1 = 0 + 1\\cdot 0 = 0$; the slope at $x = 1$ is $1$, so $y_2 = 0 + 1 = 1$."
        constraints: "2-3 steps maximum; track (x_n, y_n) as a table; values chosen so no rounding is needed"
      - id: kp3
        name: Error behavior
        key_prerequisites: [slope-fields-equilibria]
        exemplars:
          - problem: "For $y' = y$, $y(0) = 1$, one Euler step with $h = 1$ gives $y(1) \\approx 2$, while the true value is $e \\approx 2.718$. Compute the signed error (true value minus Euler estimate), to three decimal places."
            answer: "$0.718$"
            solution_sketch: "$2.718 - 2 = 0.718$. The error is positive, so Euler underestimates: the solution is convex (its slope keeps increasing) and Euler follows the tangent line, which lies below the curve."
          - problem: "Euler's method has global error of order $h$. By roughly what factor does the global error shrink when the step size is halved?"
            answer: "$2$"
            solution_sketch: "Global error scales like $h$, so halving $h$ roughly halves the error - a factor of $2$."
        constraints: "comparisons against a known exact solution, or first-order error scaling; the answer is a single number (an error value or a factor)"
    diagnostic_exemplar:
      problem: 'For $y'' = y$ with $y(0) = 1$, estimate $y(1)$ using two Euler steps of size $h = 0.5$, then report the signed error (the true value $e$ minus your estimate), to three decimal places.'
      answer: '0.468'
      solution_sketch: 'Two steps: $y_1 = 1 + 0.5(1) = 1.5$, then $y_2 = 1.5 + 0.5(1.5) = 2.25$. The true value is $e \approx 2.718$, so the error is $2.718 - 2.25 \approx 0.468$.'
    anki_seeds:
      - front: "Euler's method update rule?"
        back: '$y_{n+1} = y_n + h\,f(x_n, y_n)$, with $x_{n+1} = x_n + h$.'
        type: basic
      - front: "Order of the global error of Euler's method?"
        back: "First order: the error scales like h."
        type: basic

