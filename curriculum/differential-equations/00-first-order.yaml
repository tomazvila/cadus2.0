    knowledge_points:
      - id: kp1
        name: Reading slopes from the equation
        key_prerequisites: [slope]
        exemplars:
          - problem: "For $y' = x - y$, what is the slope of the solution curve through $(2, 1)$?"
            answer: "$1$"
            solution_sketch: "The slope at a point is $f(x,y) = 2 - 1 = 1$."
          - problem: "For $y' = xy$, what is the slope of the solution curve through $(2, 3)$?"
            answer: "$6$"
          - problem: "For $y' = x^2 + y$, what is the slope at $(1, -2)$?"
            answer: "$-1$"
            solution_sketch: "$f(1, -2) = 1 + (-2) = -1$."
          - problem: "The slope field equation is $y' = x + y$. Find the slope of the solution curve through $(3, -1)$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Slope-field rule: the slope at a point is f(x,y) = x + y. Substitute x = 3 and y = -1: 3 + (-1) = 2. The slope is 2."
          - problem: "The slope field equation is $y' = x^2 - y$. Find the slope of the solution curve through $(-2, -3)$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Slope-field rule: the slope at a point is f(x,y) = x^2 - y. Substitute x = -2 and y = -3: (-2)^2 - (-3) = 4 + 3 = 7. The slope is 7."
          - problem: "The slope field equation is $y' = xy - 1$. Find the slope at $(2, 3)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Slope-field rule: the slope at a point is f(x,y) = xy - 1. Substitute x = 2 and y = 3: 2(3) - 1 = 6 - 1 = 5. The slope is 5."
        constraints: "f(x,y) polynomial with small integer coefficients; pure evaluation"
      - id: kp2
        name: Isoclines and zero-slope loci
        key_prerequisites: [slope]
        exemplars:
          - problem: "For $y' = x^2 + y$, describe all points where the slope field is horizontal."
            answer: "The points on the parabola $y = -x^2$."
            answer_contract: {kind: none}
            solution_sketch: "Set $x^2 + y = 0$."
          - problem: "For $y' = x - y$, on what curve do the slope marks all have slope $2$?"
            answer: "The line $y = x - 2$."
            answer_contract: {kind: none}
            solution_sketch: "Set $x - y = 2$."
          - problem: "For $y' = y - 2x$, where is the slope field horizontal?"
            answer: "On the line $y = 2x$."
            answer_contract: {kind: none}
            solution_sketch: "On the line $y = 2x$."
        constraints: "isoclines f(x,y) = c are lines or parabolas; ask for horizontal (c = 0) and one nonzero c"
      - id: kp3
        name: Qualitative behavior from the field
        key_prerequisites: [ode-classification-verification]
        exemplars:
          - problem: "Explain why no solution curve of $y' = 1 + y^2$ ever has a horizontal tangent."
            answer: "The slope $1 + y^2 \\geq 1 > 0$ everywhere, so every solution is strictly increasing."
            answer_contract: {kind: none}
            solution_sketch: "The slope $1 + y^2 \\geq 1 > 0$ everywhere, so every solution is strictly increasing."
          - problem: "For $y' = x$, describe the slope field and the family of solution curves."
            answer: 'Slopes depend only on $x$ (constant along vertical lines), horizontal along the $y$-axis; the solutions are the parabolas $y = \frac{x^2}{2} + C$.'
            answer_contract: {kind: none}
            solution_sketch: 'Slopes depend only on $x$ (constant along vertical lines), horizontal along the $y$-axis; the solutions are the parabolas $y = \frac{x^2}{2} + C$.'
          - problem: "For $y' = y$, along which lines are the slope marks constant?"
            answer: "Along horizontal lines: the slope depends only on $y$."
            answer_contract: {kind: none}
            solution_sketch: "An equation $y' = f(y)$ (autonomous) has a slope field that is invariant under horizontal shifts."
        constraints: "qualitative questions: monotonicity from sign of f, symmetry of the field, identifying whether slopes depend on x, y, or both"
    diagnostic_exemplar:
      problem: 'For $y'' = x^2 + 1$, say where the slope marks are horizontal, along which lines they are constant, and give the family of solution curves.'
      answer: 'Nowhere horizontal: $x^2 + 1 \ge 1 > 0$, so every solution is strictly increasing. The slope depends only on $x$, so the marks are constant along vertical lines. The solutions are $y = \frac{x^3}{3} + x + C$.'
      answer_contract: {kind: none}
      solution_sketch: 'Horizontal marks would need $x^2 + 1 = 0$, which has no real solution; constancy along vertical lines follows from the absence of $y$; integrating gives the family.'
    anki_seeds:
      - front: "The slope field of y' = f(x, y) assigns to each point (x, y)..."
        back: "a short mark of slope f(x, y); solution curves follow the marks."
        type: basic
      - front: "An isocline of y' = f(x, y) is..."
        back: "a curve f(x, y) = c on which all slope marks have the same slope c."
        type: basic

  - id: slope-fields-equilibria
    name: Autonomous Equations and Phase Lines
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: slope-fields
        weight: 0.6
        key: true
      - id: factoring-trinomials
        weight: 0.25
        key: false
    knowledge_points:
      - id: kp1
        name: Finding equilibria and drawing the phase line
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: "Find the sum of the equilibrium solutions of $y' = y^2 - 5y + 6$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set f(y) = y^2 - 5y + 6. Factor the quadratic by finding two numbers that multiply to 6 and add to -5: f(y) = (y - 2)(y - 3). The zero-product property gives the equilibrium solutions y = 2 and y = 3. Their sum is 2 + 3 = 5."
          - problem: "Find the product of the equilibrium solutions of $y' = 4y - y^2$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set f(y) = 4y - y^2. Factor out y: f(y) = y(4 - y). The zero-product property gives the equilibrium solutions y = 0 and y = 4. Their product is 0 * 4 = 0."
          - problem: "For $y' = y(2 - y)$, find the intervals of $y$ where $f(y) = y(2 - y)$ is positive. Give the answer as an inequality in $y$."
            answer: "0 < y < 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Set f(y) = y(2 - y). The zeros are y = 0 and y = 2. Test y = 1: f(1) = 1(1) = 1 > 0. Test y = -1: f(-1) = (-1)(3) = -3 < 0. Test y = 3: f(3) = 3(-1) = -3 < 0. Thus f(y) is positive exactly on the interval 0 < y < 2."
          - problem: "Find the sum of the equilibrium solutions of $y' = y^2 - 1$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set f(y) = y^2 - 1. Factor the difference of squares: f(y) = (y - 1)(y + 1). The zero-product property gives the equilibrium solutions y = 1 and y = -1. Their sum is 1 + (-1) = 0."
          - problem: "For $y' = y^2 - 4$, find the intervals of $y$ where $f(y) = y^2 - 4$ is positive. Give the answer as an inequality in $y$."
            answer: "y < -2 or y > 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Set f(y) = y^2 - 4. Factor the difference of squares: f(y) = (y - 2)(y + 2), so the zeros are y = 2 and y = -2. Test y = 0: f(0) = -4 < 0. Test y = -3: f(-3) = 9 - 4 = 5 > 0. Test y = 3: f(3) = 9 - 4 = 5 > 0. Thus f(y) is positive on y < -2 or y > 2."
          - problem: "Find the sum of the equilibrium solutions of $y' = y(y - 1)(y + 3)$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set f(y) = y(y - 1)(y + 3). The zero-product property gives the equilibrium solutions y = 0, y = 1, and y = -3. Their sum is 0 + 1 + (-3) = -2."
        constraints: "f(y) factorable with integer roots; phase line = equilibria plus arrow directions from the sign of f"
      - id: kp2
        name: Stability classification
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: "For the autonomous equation y' = y(2 - y), find the value of the stable equilibrium solution."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: read f(y) = y(2 - y); its zeros are y = 0 and y = 2. Step 2: make a sign chart: f is negative for y < 0, positive on (0, 2), and negative for y > 2. Step 3: the flow is toward y = 2 from both sides, so y = 2 is stable. The stable equilibrium value is 2."
          - problem: "For the autonomous equation y' = y^2 - 9, how many stable equilibrium solutions are there?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: factor f(y) = y^2 - 9 = (y - 3)(y + 3), so the equilibria are y = -3 and y = 3. Step 2: sign chart: f is positive for y < -3, negative on (-3, 3), and positive for y > 3. Step 3: y = -3 is stable and y = 3 is unstable, so exactly one stable equilibrium. The count is 1."
          - problem: "For y' = (y - 1)^2, evaluate f(0) and classify the equilibrium at y = 1, then select the correct classification."
            answer: "f0 = 1; stability = semistable"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "f0"}, {"contract": {"kind": "label", "options": [["stable"], ["unstable"], ["semistable"]]}, "name": "stability"}]}
            solution_sketch: "Step 1: write f(y) = (y - 1)^2 and evaluate f(0) = 1. Step 2: sign chart: f is positive on both sides of y = 1, so below 1 the flow goes right toward 1 and above 1 it goes right away from 1. Step 3: the equilibrium is semistable. Therefore f0 = 1; stability = semistable."
          - problem: "For the autonomous equation y' = y(3 - y), find the value of the stable equilibrium solution."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: read f(y) = y(3 - y), with zeros y = 0 and y = 3. Step 2: sign chart: f is negative for y < 0, positive on (0, 3), and negative for y > 3. Step 3: the flow is toward y = 3 from both sides, so y = 3 is stable. The stable equilibrium value is 3."
          - problem: "For the autonomous equation y' = (y + 2)(y - 4), find the value of the stable equilibrium solution."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: factor f(y) = (y + 2)(y - 4), with zeros y = -2 and y = 4. Step 2: sign chart: f is positive for y < -2, negative on (-2, 4), and positive for y > 4. Step 3: the flow is toward y = -2 from both sides, so y = -2 is stable. The stable equilibrium value is -2."
          - problem: "For y' = -(y - 2)^2, evaluate f(0) and classify the equilibrium at y = 2, then select the correct classification."
            answer: "f0 = -4; stability = semistable"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "f0"}, {"contract": {"kind": "label", "options": [["stable"], ["unstable"], ["semistable"]]}, "name": "stability"}]}
            solution_sketch: "Step 1: write f(y) = -(y - 2)^2 and evaluate f(0) = -4. Step 2: sign chart: f is negative on both sides of y = 2, so below 2 the flow goes left away from 2 and above 2 it goes left toward 2. Step 3: the equilibrium is semistable. Therefore f0 = -4; stability = semistable."
        constraints: "f(y) factorable with integer roots; classify via a sign chart of f, no derivative test needed"
      - id: kp3
        name: Long-run behavior from an initial condition
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: "For $y' = y(2 - y)$ with $y(0) = 1$, find $\\lim_{t \\to \\infty} y(t)$."
            answer: "$2$"
            solution_sketch: "Starting in $(0,2)$ where $f > 0$, the solution increases monotonically toward the stable equilibrium $2$."
          - problem: "For $y' = y^2 - 9$ with $y(0) = 0$, find $\\lim_{t \\to \\infty} y(t)$."
            answer: "$-3$"
            solution_sketch: "On $(-3,3)$, $f < 0$: the solution decreases toward the stable equilibrium $-3$."
          - problem: "For $y' = -\\tfrac{1}{2}(y - 4)$ with $y(0) = 10$, find $\\lim_{t \\to \\infty} y(t)$."
            answer: "$4$"
            solution_sketch: "$f < 0$ for $y > 4$, so the solution decays monotonically to the equilibrium $4$."
          - problem: "For y' = y(1 - y) with y(0) = 1/4, find the long-run value of y(t)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation y' = y(1 - y) with y(0) = 1/4 has equilibria 0 and 1. In the phase-line step, 1/4 lies in (0, 1), so y' is positive and y(t) increases toward 1. The long-run value is 1."
          - problem: "For y' = y^2 - 4 with y(0) = 0, find the long-run value of y(t)."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation y' = y^2 - 4 with y(0) = 0 has equilibria -2 and 2. In the phase-line step, 0 lies in (-2, 2), so y' is negative and y(t) decreases toward -2. The long-run value is -2."
          - problem: "For y' = (y - 1)(3 - y) with y(0) = 2, find the long-run value of y(t)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation y' = (y - 1)(3 - y) with y(0) = 2 has equilibria 1 and 3. In the phase-line step, 2 lies in (1, 3), so y' is positive and y(t) increases toward 3. The long-run value is 3."
        constraints: "initial value sits strictly between or beyond integer equilibria; the answer is the equilibrium the flow carries it to"
    diagnostic_exemplar:
      problem: "For $y' = y(y - 3)$: find all equilibria, classify their stability, and find $\\lim_{t \\to \\infty} y(t)$ for the solution with $y(0) = 1$."
      answer: "$y = 0$ stable, $y = 3$ unstable; the solution with $y(0) = 1$ tends to $0$."
      answer_contract: {kind: none}
      solution_sketch: "$f > 0$ for $y < 0$, $f < 0$ on $(0,3)$, $f > 0$ for $y > 3$; from $y(0) = 1$ the solution decreases to $0$."
    anki_seeds:
      - front: "Equilibrium solutions of the autonomous equation y' = f(y) are..."
        back: "the constant solutions y = c where f(c) = 0."
        type: basic
      - front: "An equilibrium of y' = f(y) is stable when..."
        back: "f > 0 just below it and f < 0 just above it (the flow points toward it from both sides)."
        type: basic

  - id: eulers-method
    name: "Euler's Method"
    core: false                # named numerical algorithm; nothing here uses it
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: slope-fields-equilibria
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: A single Euler step
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "For $y' = x + y$ with $y(0) = 1$, take one Euler step of size $h = 0.1$ to estimate $y(0.1)$."
            answer: "$1.1$"
            solution_sketch: "$y_1 = y_0 + h\\,f(x_0, y_0) = 1 + 0.1(0 + 1) = 1.1$."
          - problem: "For $y' = y$ with $y(0) = 1$ and $h = 0.5$, estimate $y(0.5)$ with one Euler step."
            answer: "$1.5$"
          - problem: "For $y' = x - y$ with $y(1) = 2$ and $h = 0.2$, estimate $y(1.2)$ with one Euler step."
            answer: "$1.8$"
            solution_sketch: "$y_1 = 2 + 0.2(1 - 2) = 2 - 0.2 = 1.8$."
        constraints: "h in {0.1, 0.2, 0.25, 0.5}; f polynomial; arithmetic exact in one or two decimal places"
      - id: kp2
        name: Iterating several steps
        key_prerequisites: [slope-fields-equilibria, evaluating-expressions]
        exemplars:
          - problem: "For $y' = x + y$ with $y(0) = 1$ and $h = 0.1$, estimate $y(0.2)$ using two Euler steps."
            answer: "$1.22$"
            solution_sketch: "Step 1: $y_1 = 1 + 0.1(1) = 1.1$ at $x = 0.1$. Step 2: slope $= 0.1 + 1.1 = 1.2$, so $y_2 = 1.1 + 0.12 = 1.22$."
          - problem: "For $y' = y$ with $y(0) = 1$ and $h = 0.5$, estimate $y(1)$ using two Euler steps."
            answer: "$2.25$"
            solution_sketch: "Each step multiplies by $1.5$: $1 \\to 1.5 \\to 2.25$."
          - problem: "For $y' = x^2$ with $y(0) = 0$ and $h = 1$, estimate $y(2)$ using two Euler steps."
            answer: "$1$"
            solution_sketch: "$y_1 = 0 + 1\\cdot 0 = 0$; the slope at $x = 1$ is $1$, so $y_2 = 0 + 1 = 1$."
          - problem: "For $y' = x - y$ with $y(0) = 2$ and $h = 0.2$, estimate $y(0.4)$ using two Euler steps. Find the estimate."
            answer: "1.32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler rule: y_{n+1} = y_n + h f(x_n, y_n), with f(x,y) = x - y. Start at (x_0, y_0) = (0, 2). Step 1: slope = 0 - 2 = -2, so y_1 = 2 + 0.2(-2) = 1.6 at x = 0.2. Step 2: slope = 0.2 - 1.6 = -1.4, so y_2 = 1.6 + 0.2(-1.4) = 1.32. The estimate is 1.32."
          - problem: "For $y' = x y$ with $y(0) = 1$ and $h = 0.5$, estimate $y(1)$ using two Euler steps. Find the estimate."
            answer: "1.25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler rule: y_{n+1} = y_n + h f(x_n, y_n), with f(x,y) = x y. Start at (x_0, y_0) = (0, 1). Step 1: slope = 0(1) = 0, so y_1 = 1 + 0.5(0) = 1 at x = 0.5. Step 2: slope = 0.5(1) = 0.5, so y_2 = 1 + 0.5(0.5) = 1.25. The estimate is 1.25."
          - problem: "For $y' = 2x + 1$ with $y(0) = 0$ and $h = 1$, estimate $y(3)$ using three Euler steps. Find the estimate."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler rule: y_{n+1} = y_n + h f(x_n, y_n), with f(x,y) = 2x + 1. Start at (x_0, y_0) = (0, 0). Step 1: slope = 1, so y_1 = 0 + 1(1) = 1 at x = 1. Step 2: slope = 2(1) + 1 = 3, so y_2 = 1 + 1(3) = 4 at x = 2. Step 3: slope = 2(2) + 1 = 5, so y_3 = 4 + 1(5) = 9 at x = 3. The estimate is 9."
        constraints: "2-3 steps maximum; track (x_n, y_n) as a table; values chosen so no rounding is needed"
      - id: kp3
        name: Error behavior
        key_prerequisites: [slope-fields-equilibria]
        exemplars:
          - problem: "For $y' = y$, $y(0) = 1$, one Euler step with $h = 1$ gives $y(1) \\approx 2$, while the true value is $e \\approx 2.718$. Compute the signed error (true value minus Euler estimate), to three decimal places."
            answer: "$0.718$"
            solution_sketch: "$2.718 - 2 = 0.718$. The error is positive, so Euler underestimates: the solution is convex (its slope keeps increasing) and Euler follows the tangent line, which lies below the curve."
          - problem: "Euler's method has global error of order $h$. By roughly what factor does the global error shrink when the step size is halved?"
            answer: "$2$"
            solution_sketch: "Global error scales like $h$, so halving $h$ roughly halves the error - a factor of $2$."
        constraints: "comparisons against a known exact solution, or first-order error scaling; the answer is a single number (an error value or a factor)"
    diagnostic_exemplar:
      problem: 'For $y'' = y$ with $y(0) = 1$, estimate $y(1)$ using two Euler steps of size $h = 0.5$, then report the signed error (the true value $e$ minus your estimate), to three decimal places.'
      answer: '0.468'
      solution_sketch: 'Two steps: $y_1 = 1 + 0.5(1) = 1.5$, then $y_2 = 1.5 + 0.5(1.5) = 2.25$. The true value is $e \approx 2.718$, so the error is $2.718 - 2.25 \approx 0.468$.'
    anki_seeds:
      - front: "Euler's method update rule?"
        back: '$y_{n+1} = y_n + h\,f(x_n, y_n)$, with $x_{n+1} = x_n + h$.'
        type: basic
      - front: "Order of the global error of Euler's method?"
        back: "First order: the error scales like h."
        type: basic

  - id: separation-of-variables
    name: Separation of Variables
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: ode-classification-verification
        weight: 0.5
        key: true
      - id: antiderivatives
        weight: 0.5
        key: true
      - id: integration-substitution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Recognizing separable equations
        key_prerequisites: [ode-classification-verification]
        exemplars:
          - problem: "Is $y' = xy + x$ separable? If so, factor the right side."
            answer: "Yes: $y' = x(y + 1)$."
            answer_contract: {kind: none}
            solution_sketch: "Yes: $y' = x(y + 1)$."
          - problem: "Is $y' = x + y$ separable?"
            answer: "No: $x + y$ cannot be written as $g(x)h(y)$."
            answer_contract: {kind: none}
            solution_sketch: "No: $x + y$ cannot be written as $g(x)h(y)$."
          - problem: "Is $y' = e^{x+y}$ separable?"
            answer: "Yes: $e^{x+y} = e^x e^y$."
            answer_contract: {kind: none}
            solution_sketch: "Yes: $e^{x+y} = e^x e^y$."
        constraints: "right sides that factor (or fail to factor) as g(x)h(y); include sums that only look separable"
      - id: kp2
        name: Separate and integrate
        key_prerequisites: [antiderivatives]
        exemplars:
          - problem: "Separate and integrate dy/dx = x/y. After absorbing constants, the solution is written y^2 = (right side). Find the right side in terms of x and C."
            answer: "x^2+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Write the equation in separated form y dy = x dx. Integrate both sides with the power rule: y^2/2 = x^2/2 + C0. Multiply by 2 and rename 2C0 as C to get y^2 = x^2 + C. The right side is x^2+C."
          - problem: "Separate and integrate y' = 3x^2 y^2. After rearranging, the solution has the form -1/y = (right side). Find the right side in terms of x and C."
            answer: "x^3+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Separate to y^(-2)dy = 3x^2 dx. Integrate with the power rule: -1/y = x^3 + C. The right side is x^3+C."
          - problem: "Separate and integrate dy/dx = 2x/y^2. After absorbing constants, the solution is written y^3 = (right side). Find the right side in terms of x and C."
            answer: "3x^2+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Separate to y^2 dy = 2x dx. Integrate with the power rule: y^3/3 = x^2 + C0. Multiply by 3 and rename 3C0 as C to get y^3 = 3x^2 + C. The right side is 3x^2+C."
          - problem: "Separate and integrate dy/dx = 4x^3 y^2. After rearranging, the solution has the form -1/y = (right side). Find the right side in terms of x and C."
            answer: "x^4+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Separate to y^(-2)dy = 4x^3 dx. Integrate with the power rule: -1/y = x^4 + C. The right side is x^4+C."
          - problem: "Separate and integrate dy/dx = x^2/y. After absorbing constants, the solution is written 3y^2 = (right side). Find the right side in terms of x and C."
            answer: "2x^3+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Separate to y dy = x^2 dx. Integrate with the power rule: y^2/2 = x^3/3 + C0. Multiply by 6 and rename 6C0 as C to get 3y^2 = 2x^3 + C. The right side is 2x^3+C."
          - problem: "Separate and integrate dy/dx = 5x^3 y^2. After multiplying by 4, the solution has the form -4/y = (right side). Find the right side in terms of x and C."
            answer: "5x^4+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Separate to y^(-2)dy = 5x^3 dx. Integrate with the power rule: -1/y = (5/4)x^4 + C0. Multiply by 4 and rename 4C0 as C to get -4/y = 5x^4 + C. The right side is 5x^4+C."
        constraints: "antiderivatives are powers only; general solutions carry an explicit C, absorbed constants renamed"
      - id: kp3
        name: Logarithmic integrations and absorbed constants
        key_prerequisites: [integration-substitution]
        exemplars:
          - problem: "Find the general solution of $(1 + x^2)\\,y' = xy$."
            answer: '$y = C\sqrt{1 + x^2}$'
            solution_sketch: '$\frac{dy}{y} = \frac{x}{1+x^2}dx$; substitution gives $\ln|y| = \frac{1}{2}\ln(1+x^2) + C$, so $y = C\sqrt{1+x^2}$.'
          - problem: "Solve $\\frac{dy}{dx} = \\frac{3y}{x}$ for $x > 0$ with the initial condition $y(1) = 5$. Find the particular solution $y(x)$."
            answer: "5x^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: $\\frac{dy}{y} = \\frac{3\\,dx}{x}$. Integrate both sides: $\\ln|y| = 3\\ln x + C$. Exponentiate and rename $e^C$ as $C$: $y = Cx^3$. Apply $y(1) = 5$: $C \\cdot 1 = 5$, so $C = 5$. The particular solution is 5x^3."
          - problem: "Solve $\\frac{dy}{dx} = 4xy$ with the initial condition $y(0) = 7$. Find the particular solution $y(x)$."
            answer: "7e^(2x^2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: $\\frac{dy}{y} = 4x\\,dx$. Integrate both sides: $\\ln|y| = 2x^2 + C$. Exponentiate and rename $e^C$ as $C$: $y = Ce^{2x^2}$. Apply $y(0) = 7$: $C = 7$. The particular solution is 7e^(2x^2)."
          - problem: "Solve $\\frac{dy}{dx} = \\frac{2y}{x+1}$ for $x > -1$ with the initial condition $y(0) = 9$. Find the particular solution $y(x)$."
            answer: "9(x+1)^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: $\\frac{dy}{y} = \\frac{2\\,dx}{x+1}$. Integrate by substitution $u = x+1$: $\\ln|y| = 2\\ln(x+1) + C$. Exponentiate and rename $e^C$ as $C$: $y = C(x+1)^2$. Apply $y(0) = 9$: $C = 9$. The particular solution is 9(x+1)^2."
          - problem: "Solve $\\frac{dy}{dx} = \\frac{y}{2x+1}$ for $x > -\\frac{1}{2}$ with the initial condition $y(0) = 8$. Find the particular solution $y(x)$."
            answer: "8sqrt(2x+1)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: $\\frac{dy}{y} = \\frac{dx}{2x+1}$. Integrate by substitution $u = 2x+1$: $\\ln|y| = \\frac{1}{2}\\ln(2x+1) + C$. Exponentiate and rename $e^C$ as $C$: $y = C\\sqrt{2x+1}$. Apply $y(0) = 8$: $C\\sqrt{1} = 8$, so $C = 8$. The particular solution is 8sqrt(2x+1)."
          - problem: "A bacteria population grows at a rate proportional to its size: $\\frac{dP}{dt} = 3P$, with initial size $P(0) = 2$ (in thousands). Find the population $P(t)$ as a function of $t$."
            answer: "2e^(3t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Separate variables: $\\frac{dP}{P} = 3\\,dt$. Integrate both sides: $\\ln|P| = 3t + C$. Exponentiate and rename $e^C$ as $C$: $P = Ce^{3t}$. Apply $P(0) = 2$: $C = 2$. The population is 2e^(3t)."
        constraints: "integrations produce logarithms; require exponentiating and renaming e^C as C"
    diagnostic_exemplar:
      problem: "Find the general solution of $y' = -2xy$."
      answer: "$y = Ce^{-x^2}$"
      answer_contract: {kind: none}
      solution_sketch: '$\frac{dy}{y} = -2x\,dx$ gives $\ln|y| = -x^2 + C$; exponentiate and rename the constant.'
    anki_seeds:
      - front: "A first-order ODE is separable when it can be written as..."
        back: "dy/dx = g(x)h(y): all y-dependence on one side, all x-dependence on the other."
        type: basic
      - front: 'After integrating $\frac{dy}{y} = k\,dx$, the general solution is...'
        back: '$y = Ce^{kx}$ (exponentiate $\ln|y| = kx + C$ and rename the constant).'
        type: basic

  - id: separable-equations
    name: Separable Equations
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: separation-of-variables
        weight: 0.7
        key: true
      - id: integration-substitution
        weight: 0.3
        key: false
      - id: definite-integrals-ftc
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Initial value problems
        key_prerequisites: [separation-of-variables, integration-substitution]
        exemplars:
          - problem: "Solve $y' = 2xy$ with $y(0) = 3$."
            answer: "$y = 3e^{x^2}$"
            solution_sketch: "The general solution is $y = Ce^{x^2}$; the initial condition gives $C = 3$."
          - problem: 'Solve $\frac{dy}{dx} = \frac{\cos x}{y}$ with $y(0) = 1$.'
            answer: '$y = \sqrt{2\sin x + 1}$'
            solution_sketch: '$y\,dy = \cos x\,dx$ gives $\frac{y^2}{2} = \sin x + C$; $y(0) = 1$ forces $C = \frac{1}{2}$, so $y^2 = 2\sin x + 1$; take the positive root since $y(0) > 0$. Valid on the interval about $x = 0$ where $2\sin x + 1 > 0$, i.e. $(-\pi/6,\ 7\pi/6)$.'
          - problem: "Solve $y' = e^{x-y}$ with $y(0) = 0$."
            answer: "$y = x$"
            solution_sketch: "Separate: $e^y dy = e^x dx$, so $e^y = e^x + C$; the initial condition gives $C = 0$, hence $e^y = e^x$ and $y = x$."
        constraints: "initial condition pins one constant; choose data so the sign of any root is determined; answers exact"
      - id: kp2
        name: Implicit solutions and branch selection
        key_prerequisites: [separation-of-variables]
        exemplars:
          - problem: "Solve $y' = \\dfrac{2x + 1}{2y}$ with $y(0) = -1$."
            answer: '$y = -\sqrt{x^2 + x + 1}$'
            solution_sketch: '$2y\,dy = (2x+1)\,dx$ gives $y^2 = x^2 + x + C$; $y(0) = -1$ forces $C = 1$, and the negative initial value selects the negative root.'
          - problem: "Solve $y\\,y' = x$ with $y(1) = -2$."
            answer: '$y = -\sqrt{x^2 + 3}$'
            solution_sketch: '$y^2 = x^2 + C$ with $C = 3$; take the negative branch since $y(1) < 0$.'
          - problem: "A separable equation is y' = -x/y. Find the left side F(x, y) of an implicit general solution written as F(x, y) = C."
            answer: "x^2+y^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Separate variables: y dy = -x dx. Integrate both sides: y^2/2 = -x^2/2 + K. Multiply by 2 and collect terms to write x^2 + y^2 = C. The left side F is x^2+y^2."
          - problem: "Solve y' = (2x + 3)/(2y) with y(0) = 2. Give the explicit solution y as a function of x."
            answer: "sqrt(x^2+3x+4)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: 2y dy = (2x + 3) dx. Integrate: y^2 = x^2 + 3x + C. The condition y(0) = 2 gives 4 = C, so y^2 = x^2 + 3x + 4. Since the initial value is positive, select the positive branch: sqrt(x^2+3x+4)."
          - problem: "A separable equation is y' = e^x/y. Find the left side F(x, y) of an implicit general solution written as F(x, y) = C."
            answer: "y^2-2e^(x)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Separate variables: y dy = e^x dx. Integrate: y^2/2 = e^x + K. Multiply by 2 and collect terms to write y^2 - 2e^x = C. The left side F is y^2-2e^(x)."
          - problem: "Solve y' = x^2/y with y(0) = -1. Give the explicit solution y as a function of x."
            answer: "-sqrt(2x^3/3+1)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: y dy = x^2 dx. Integrate: y^2/2 = x^3/3 + C. The condition y(0) = -1 gives 1/2 = C, so y^2 = 2x^3/3 + 1. The negative initial value selects the negative branch: -sqrt(2x^3/3+1)."
        constraints: "implicit solutions left as F(x,y) = C when no clean explicit form; when solving explicitly, the initial sign picks the branch"
      - id: kp3
        name: Constant solutions and intervals of validity
        key_prerequisites: [separation-of-variables]
        exemplars:
          - problem: "Find the positive constant solution of y' = y^2 - 9. Give the y-value."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A constant solution has y' = 0, so set h(y) = y^2 - 9 equal to zero. Factor the difference of squares: (y - 3)(y + 3) = 0, so the integer zeros are y = 3 and y = -3. Each value makes the right side zero for every x, so both are constant solutions. The positive constant solution is 3."
          - problem: "Solve y' = y^2 with y(0) = 1/2. Give the interval of validity as an inequality in x."
            answer: "x < 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Separate variables: dy/y^2 = dx. Integrate both sides: -1/y = x + C. Apply the initial condition y(0) = 1/2: -2 = C, so -1/y = x - 2 and y = 1/(2 - x). The branch formula blows up where 2 - x = 0, that is at x = 2, so the maximal interval containing x0 = 0 is x < 2."
          - problem: "When solving y' = y^2 - 4 by dividing both sides by y + 2, which constant solution is lost? Give the y-value."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The constant solutions of y' = y^2 - 4 are the integer zeros of h(y) = (y - 2)(y + 2), namely y = 2 and y = -2. Dividing both sides by y + 2 is legitimate only where y is not -2, so the constant branch y = -2 disappears from the separated equation. The lost constant solution is -2."
          - problem: "Solve y' = y^2 with y(0) = 1/4 and find the blow-up point, the right endpoint of its interval of validity."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Separate variables: dy/y^2 = dx. Integrate: -1/y = x + C. Apply y(0) = 1/4: -4 = C, so -1/y = x - 4 and y = 1/(4 - x). The branch formula blows up where the denominator 4 - x = 0, so the blow-up point at the right end of the interval of validity is 4."
          - problem: "Solve y' = 2 sqrt(y) with y(1) = 1. Give the interval of validity as an inequality in x."
            answer: "0 <= x"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Separate variables: dy/(2 sqrt(y)) = dx. Integrate: sqrt(y) = x + C. Apply y(1) = 1: 1 = 1 + C, so C = 0 and the branch is y = x^2. The branch formula degenerates at x = 0, where y = 0 and the right side 2 sqrt(y) vanishes; for x < 0 the branch would need y' = 2x < 0 while 2 sqrt(y) > 0, which is impossible. The interval of validity is 0 <= x."
          - problem: "Solve y' = e^y with y(0) = 0. Give the interval of validity as an inequality in x."
            answer: "x < 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Separate variables: e^(-y) dy = dx. Integrate: -e^(-y) = x + C. Apply y(0) = 0: -1 = C, so e^(-y) = 1 - x and y = -ln(1 - x). The branch formula blows up where 1 - x = 0, that is at x = 1, so the maximal interval containing x0 = 0 is x < 1."
        constraints: "constant solutions are integer zeros of h(y); intervals of validity bounded by blow-up points or where the branch formula degenerates"
    diagnostic_exemplar:
      problem: 'Solve $y'' = -\dfrac{x}{y}$ with $y(0) = -3$, and state the interval of validity.'
      answer: '$y = -\sqrt{9 - x^2}$ on $(-3, 3)$.'
      answer_contract: {kind: none}
      solution_sketch: 'Separating gives $y\,dy = -x\,dx$, so $y^2 = 9 - x^2$. The initial value $y(0) = -3$ selects the negative branch, and the square root is real (and $y \neq 0$) only for $|x| < 3$.'
    anki_seeds:
      - front: "When you divide a separable equation by h(y), you may lose..."
        back: "the constant solutions y = c where h(c) = 0 — check for them separately."
        type: basic
      - front: "After solving y^2 = F(x) + C in an IVP, the branch (sign of the root) is chosen by..."
        back: "the sign of the initial value y(x0)."
        type: basic

  - id: integrating-factor-computation
    name: Computing Integrating Factors
    core: true
    difficulty: 0.63
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: derivatives-exp-log
        weight: 0.5
        key: true
      - id: separation-of-variables
        weight: 0.3
        key: false
      - id: logarithm-properties
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Standard form
        key_prerequisites: [separation-of-variables]
        exemplars:
          - problem: "Write $xy' - y = x^2$ ($x > 0$) in standard form and identify $P(x)$ and $Q(x)$."
            answer: "$y' - \\dfrac{1}{x}y = x$; $P(x) = -\\dfrac{1}{x}$, $Q(x) = x$."
            answer_contract: {kind: none}
            solution_sketch: "Divide through by the coefficient of $y'$."
          - problem: "Write $2y' + 8y = 6e^x$ in standard form."
            answer: "$y' + 4y = 3e^x$"
            answer_contract: {kind: none}
            solution_sketch: "$y' + 4y = 3e^x$"
          - problem: "Identify $P$ and $Q$ for $y' = x - 3y$."
            answer: "$y' + 3y = x$: $P(x) = 3$, $Q(x) = x$."
            answer_contract: {kind: none}
            solution_sketch: "$y' + 3y = x$: $P(x) = 3$, $Q(x) = x$."
        constraints: "leading coefficient constant or a power of x; always divide through before reading off P and Q"
      - id: kp2
        name: "Computing $\\mu = e^{\\int P\\,dx}$"
        key_prerequisites: [derivatives-exp-log, logarithm-properties]
        exemplars:
          - problem: "Find an integrating factor for y' + 3y = e^x."
            answer: "e^(3x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = 3, so mu = e^(integral of 3 dx). The constant-integral rule gives 3x. Exponentiating gives mu = e^(3x). The integrating factor is e^(3x)."
          - problem: "Find an integrating factor for y' + (3/x)y = x on x > 0."
            answer: "x^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = 3/x, so mu = e^(integral of 3/x dx). The reciprocal rule gives 3 ln(x). The exponent-log identity gives e^(3 ln(x)) = x^3. The integrating factor is x^3."
          - problem: "Find an integrating factor for y' + cos(x) y = cos(x)."
            answer: "e^(sin(x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = cos(x), so mu = e^(integral of cos(x) dx). The trigonometric integral rule gives sin(x). Exponentiating gives mu = e^(sin(x)). The integrating factor is e^(sin(x))."
          - problem: "Find an integrating factor for y' - 4y = x."
            answer: "e^(-4x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = -4, so mu = e^(integral of -4 dx). The constant-integral rule gives -4x. Exponentiating gives mu = e^(-4x). The integrating factor is e^(-4x)."
          - problem: "Find an integrating factor for y' + (4/x)y = x^2 on x > 0."
            answer: "x^4"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = 4/x, so mu = e^(integral of 4/x dx). The reciprocal rule gives 4 ln(x). The exponent-log identity gives e^(4 ln(x)) = x^4. The integrating factor is x^4."
          - problem: "Find an integrating factor for y' + 2x y = x."
            answer: "e^(x^2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Start with mu = e^(integral of P dx). Here P = 2x, so mu = e^(integral of 2x dx). The power rule for integrals gives x^2. Exponentiating gives mu = e^(x^2). The integrating factor is e^(x^2)."
        constraints: "P(x) constant, k/x, or an easily integrated function; simplify e^{k ln x} to x^k"
      - id: kp3
        name: Verifying the product-rule collapse
        key_prerequisites: [derivatives-exp-log]
        exemplars:
          - problem: "Show that after multiplying $y' + 2y = e^x$ by $\\mu = e^{2x}$, the left side is $(e^{2x}y)'$."
            answer: "$(e^{2x}y)' = e^{2x}y' + 2e^{2x}y = e^{2x}(y' + 2y)$, which matches."
            answer_contract: {kind: none}
            solution_sketch: "Product rule on $e^{2x}y$; the exponential's derivative reproduces the $P(x)y$ term."
          - problem: "Show that $x^2\\left(y' + \\dfrac{2}{x}y\\right) = (x^2 y)'$."
            answer: "$(x^2 y)' = x^2 y' + 2xy = x^2\\left(y' + \\dfrac{2}{x}y\\right)$."
            answer_contract: {kind: none}
            solution_sketch: "$(x^2 y)' = x^2 y' + 2xy = x^2\\left(y' + \\dfrac{2}{x}y\\right)$."
        constraints: "one product-rule expansion; the point is mu' = P mu"
    diagnostic_exemplar:
      problem: 'Write $xy'' + 3y = x^2$ ($x > 0$) in standard form, find its integrating factor $\mu$, and show that multiplying by $\mu$ turns the left side into $(\mu y)''$.'
      answer: 'Standard form $y'' + \dfrac{3}{x}y = x$, so $\mu = e^{\int 3/x\,dx} = x^3$; and $x^3\left(y'' + \frac{3}{x}y\right) = x^3 y'' + 3x^2 y = (x^3 y)''$.'
      answer_contract: {kind: none}
      solution_sketch: 'Divide by $x$ to reach standard form, integrate $P = 3/x$, then check the product rule.'
    anki_seeds:
      - front: "Integrating factor for y' + P(x)y = Q(x)?"
        back: '$\mu(x) = e^{\int P(x)\,dx}$'
        type: basic
      - front: '$e^{k\ln x}$ simplifies to...'
        back: '$x^k$'
        type: basic

  - id: linear-first-order-integrating-factor
    name: Linear First-Order Equations
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: integrating-factor-computation
        weight: 0.7
        key: true
      - id: integration-by-parts
        weight: 0.5
        key: true
      - id: separable-equations
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Solving via the product-rule collapse
        key_prerequisites: [integrating-factor-computation]
        exemplars:
          - problem: "Find the general solution of y' + 2y = e^x. Give the answer as a formula in x with an arbitrary constant c."
            answer: "e^x/3 + c e^(-2x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): integrate the coefficient 2 to get mu = e^(2x). Step 2 (product-rule collapse): multiply both sides by mu so the left side is the derivative (e^(2x) y)' = e^(3x). Step 3 (integrate): e^(2x) y = e^(3x)/3 + c. Step 4 (solve for y): divide by e^(2x). The general solution is y = e^x/3 + c e^(-2x)."
          - problem: "On x > 0, find the general solution of y' + y/x = x. Give the answer as a formula in x with an arbitrary constant c."
            answer: "x^2/3 + c/x"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): on x > 0, integrating 1/x gives mu = x. Step 2 (product-rule collapse): multiply both sides by x so the left side is (x y)' = x^2. Step 3 (integrate): x y = x^3/3 + c. Step 4 (solve for y): divide by x. The general solution is y = x^2/3 + c/x."
          - problem: "Find the general solution of y' + 3y = 6. Give the answer as a formula in x with an arbitrary constant c."
            answer: "2 + c e^(-3x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): integrate the constant 3 to get mu = e^(3x). Step 2 (product-rule collapse): multiply both sides by mu so (e^(3x) y)' = 6 e^(3x). Step 3 (integrate): e^(3x) y = 2 e^(3x) + c. Step 4 (solve for y): divide by e^(3x). The general solution is y = 2 + c e^(-3x)."
          - problem: "Find the general solution of y' + y = e^(2x). Give the answer as a formula in x with an arbitrary constant c."
            answer: "e^(2x)/3 + c e^(-x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): integrate the coefficient 1 to get mu = e^x. Step 2 (product-rule collapse): multiply both sides by mu so (e^x y)' = e^(3x). Step 3 (integrate): e^x y = e^(3x)/3 + c. Step 4 (solve for y): divide by e^x. The general solution is y = e^(2x)/3 + c e^(-x)."
          - problem: "Find the general solution of y' - 2y = e^(3x). Give the answer as a formula in x with an arbitrary constant c."
            answer: "e^(3x) + c e^(2x)"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): integrate the coefficient -2 to get mu = e^(-2x). Step 2 (product-rule collapse): multiply both sides by mu so (e^(-2x) y)' = e^x. Step 3 (integrate): e^(-2x) y = e^x + c. Step 4 (solve for y): multiply by e^(2x). The general solution is y = e^(3x) + c e^(2x)."
          - problem: "On x > 0, find the general solution of y' + y/x = x^2. Give the answer as a formula in x with an arbitrary constant c."
            answer: "x^3/4 + c/x"
            answer_contract: {"kind": "function", "vars": ["x", "c"]}
            solution_sketch: "Step 1 (integrating factor): on x > 0, integrating 1/x gives mu = x. Step 2 (product-rule collapse): multiply both sides by x so (x y)' = x^3. Step 3 (integrate): x y = x^4/4 + c. Step 4 (solve for y): divide by x. The general solution is y = x^3/4 + c/x."
        constraints: "right side polynomial or e^{kx} integrating in one step; answers carry an explicit C"
      - id: kp2
        name: Forcing that needs integration by parts
        key_prerequisites: [integration-by-parts, integrating-factor-computation]
        exemplars:
          - problem: "Find the general solution of $y' - y = x$."
            answer: "$y = -x - 1 + Ce^x$"
            answer_contract: {kind: none}
            solution_sketch: "With $\\mu = e^{-x}$: $(e^{-x}y)' = xe^{-x}$; integration by parts gives $e^{-x}y = -(x+1)e^{-x} + C$."
          - problem: 'Find the general solution of $y'' + y = \sin x$.'
            answer: '$y = \dfrac{\sin x - \cos x}{2} + Ce^{-x}$'
            answer_contract: {kind: none}
            solution_sketch: '$(e^x y)'' = e^x \sin x$; integrating (parts twice, or the standard formula) gives $e^x y = \frac{e^x(\sin x - \cos x)}{2} + C$.'
        constraints: "right side polynomial times e^{kx} or sin/cos; at most two integrations by parts"
      - id: kp3
        name: Linear IVPs
        key_prerequisites: [integrating-factor-computation, separable-equations]
        exemplars:
          - problem: "Solve $y' + 3y = 6$ with $y(0) = 4$."
            answer: "$y = 2 + 2e^{-3x}$"
            solution_sketch: "The constant solution is $y = 2$, so $y = 2 + Ce^{-3x}$; $y(0) = 4$ gives $C = 2$."
          - problem: 'Solve $xy'' + y = \sin x$ with $y(\pi/2) = 2/\pi$.'
            answer: '$y = \dfrac{1 - \cos x}{x}$'
            answer_contract: {kind: none}
            solution_sketch: 'The left side is already $(xy)''$, so $xy = -\cos x + C$. At $x = \pi/2$: $\frac{\pi}{2}\cdot\frac{2}{\pi} = 1 = 0 + C$, so $C = 1$.'
        constraints: "initial data chosen so C is a clean rational; recognize (xy)' and (e^{kx}y)' collapses"
    diagnostic_exemplar:
      problem: 'Solve $y'' - y = x$ with $y(0) = 2$.'
      answer: '$y = -x - 1 + 3e^{x}$'
      solution_sketch: '$\mu = e^{-x}$ gives $(e^{-x}y)'' = xe^{-x}$; integrating by parts, $e^{-x}y = -(x+1)e^{-x} + C$, so $y = -(x+1) + Ce^{x}$. Then $y(0) = -1 + C = 2$ gives $C = 3$.'
    anki_seeds:
      - front: "After multiplying y' + Py = Q by its integrating factor, the left side becomes..."
        back: "the exact derivative (mu y)' — integrate both sides once."
        type: basic
      - front: "Solution formula for y' + P(x)y = Q(x)?"
        back: '$y = \dfrac{1}{\mu}\left(\int \mu Q\,dx + C\right)$ with $\mu = e^{\int P\,dx}$.'
        type: basic

  - id: bernoulli-equations
    name: Bernoulli Equations
    core: false                # special-case substitution subsumed by the linear first-order method
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: linear-first-order-integrating-factor
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "The substitution $v = y^{1-n}$"
        key_prerequisites: [chain-rule, linear-first-order-integrating-factor]
        exemplars:
          - problem: "For $y' + y = y^2$, identify $n$, the substitution, and the resulting linear equation."
            answer: "$n = 2$; $v = y^{-1}$ gives $v' - v = -1$."
            answer_contract: {kind: none}
            solution_sketch: "Divide by $y^2$: $y^{-2}y' + y^{-1} = 1$; with $v = y^{-1}$, $v' = -y^{-2}y'$, so $-v' + v = 1$."
          - problem: "For $y' - y = xy^3$, find the substitution and the resulting linear equation."
            answer: "$v = y^{-2}$ gives $v' + 2v = -2x$."
            answer_contract: {kind: none}
            solution_sketch: "Divide by $y^3$: $y^{-3}y' - y^{-2} = x$; since $v' = -2y^{-3}y'$, this is $-\\tfrac{1}{2}v' - v = x$."
          - problem: 'What substitution turns $y'' + \dfrac{y}{x} = \sqrt{y}$ into a linear equation, and what equation results?'
            answer: '$v = \sqrt{y}$ gives $v'' + \dfrac{v}{2x} = \dfrac{1}{2}$.'
            answer_contract: {kind: none}
            solution_sketch: 'Here $n = \tfrac{1}{2}$, so $v = y^{1/2}$; writing $y = v^2$, $y'' = 2vv''$ and dividing by $2v$ gives the linear equation.'
        constraints: "n in {2, 3, 1/2}; the transformed equation must be stated in standard linear form"
      - id: kp2
        name: Complete solutions
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "Find the general solution of $y' + y = y^2$."
            answer: "$y = \\dfrac{1}{1 + Ce^{x}}$"
            answer_contract: {kind: none}
            solution_sketch: "$v = y^{-1}$ gives $v' - v = -1$, so $v = 1 + Ce^x$; invert."
          - problem: "Find the general solution of $y' + \\dfrac{y}{x} = y^2$ on $x > 0$."
            answer: "$y = \\dfrac{1}{x(C - \\ln x)}$"
            answer_contract: {kind: none}
            solution_sketch: "$v = y^{-1}$ gives $v' - \\dfrac{v}{x} = -1$; with $\\mu = 1/x$, $(v/x)' = -1/x$, so $v = x(C - \\ln x)$."
        constraints: "coefficients constant or k/x; the linear stage solves with one integrating factor; present y explicitly"
      - id: kp3
        name: Bernoulli IVPs
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "Solve y' + y = y^2 with y(0) = 2. State the solution explicitly."
            answer: "2/(2-e^(x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Let v = y^(-1); the Bernoulli substitution turns the equation into the linear equation v' - v = -1. The integrating factor e^(-x) gives v = C e^(x) + 1, and v(0) = 1/2 forces C = -1/2, so v = 1 - e^(x)/2. Since y = 1/v, the explicit solution is 2/(2-e^(x))."
          - problem: "Solve y' + y = 2y^3 with y(0) = 1/2. State the solution explicitly."
            answer: "1/sqrt(2e^(2x)+2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For n = 3, set v = y^(-2); the Bernoulli substitution turns the equation into the linear equation v' - 2v = -4. The integrating factor e^(-2x) gives v = C e^(2x) + 2, and v(0) = 4 forces C = 2, so v = 2e^(2x) + 2, which stays positive for every x. Since y = v^(-1/2), the explicit solution is 1/sqrt(2e^(2x)+2)."
          - problem: "Solve y' + 2y = y^2 with y(0) = 1. State the solution explicitly."
            answer: "2/(e^(2x)+1)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Let v = y^(-1); the Bernoulli substitution turns the equation into the linear equation v' - 2v = -1. The integrating factor e^(-2x) gives v = C e^(2x) + 1/2, and v(0) = 1 forces C = 1/2, so v = e^(2x)/2 + 1/2. Since y = 1/v, the explicit solution is 2/(e^(2x)+1)."
          - problem: "Solve y' - y = y^2 with y(0) = 2. State the solution explicitly."
            answer: "2/(3e^(-x)-2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Let v = y^(-1); the Bernoulli substitution turns the equation into the linear equation v' + v = -1. The integrating factor e^(x) gives v = C e^(-x) - 1, and v(0) = 1/2 forces C = 3/2, so v = (3/2)e^(-x) - 1. Since y = 1/v, the explicit solution is 2/(3e^(-x)-2)."
          - problem: "Solve y' + 2y = 2y^3 with y(0) = 1/2. State the solution explicitly."
            answer: "1/sqrt(3e^(4x)+1)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "For n = 3, set v = y^(-2); the Bernoulli substitution turns the equation into the linear equation v' - 4v = -4. The integrating factor e^(-4x) gives v = C e^(4x) + 1, and v(0) = 4 forces C = 3, so v = 3e^(4x) + 1, which stays positive for every x. Since y = v^(-1/2), the explicit solution is 1/sqrt(3e^(4x)+1)."
          - problem: "Solve y' + 2y = 3y^2 with y(0) = 1. State the solution explicitly."
            answer: "2/(3-e^(2x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Let v = y^(-1); the Bernoulli substitution turns the equation into the linear equation v' - 2v = -3. The integrating factor e^(-2x) gives v = C e^(2x) + 3/2, and v(0) = 1 forces C = -1/2, so v = 3/2 - e^(2x)/2. Since y = 1/v, the explicit solution is 2/(3-e^(2x))."
        constraints: "initial data keeps v positive near x0; state the solution explicitly"
    diagnostic_exemplar:
      problem: 'Solve $y'' + y = y^2$ with $y(0) = 3$.'
      answer: '$y = \dfrac{3}{3 - 2e^{x}}$'
      answer_contract: {kind: none}
      solution_sketch: 'With $n = 2$, put $v = y^{-1}$: dividing by $y^2$ gives $-v'' + v = 1$, i.e. $v'' - v = -1$, whose solution is $v = 1 + Ce^{x}$. Then $y = \frac{1}{1 + Ce^x}$, and $y(0) = 3$ gives $C = -\frac{2}{3}$, i.e. $y = \frac{3}{3 - 2e^x}$.'
    anki_seeds:
      - front: "A Bernoulli equation has the form..."
        back: "$y' + P(x)y = Q(x)y^n$ with $n \\neq 0, 1$."
        type: basic
      - front: "Substitution that linearizes a Bernoulli equation?"
        back: '$v = y^{1-n}$ — it satisfies a linear first-order equation.'
        type: basic

  - id: homogeneous-first-order-substitution
    name: "Homogeneous Equations and the v = y/x Substitution"   # names are plain text (no KaTeX pass) — $…$ would render literally
    core: false                # special-case substitution; terminal
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: separable-equations
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Recognizing homogeneous equations
        key_prerequisites: [separable-equations]
        exemplars:
          - problem: "For the equation y' = (x + y)/x, write the right side as a function of v = y/x. Give the answer as a function of v."
            answer: "1+v"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with the right side (x + y)/x. Step 1: divide numerator and denominator by x, using algebra. Step 2: substitute v = y/x, using the definition of v. The result is 1+v."
          - problem: "For the equation y' = (x^2 + y^2)/(x y), write the right side as a function of v = y/x. Give the answer as a function of v."
            answer: "(1+v^2)/v"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with the right side (x^2 + y^2)/(x y). Step 1: divide top and bottom by x^2, using algebra. Step 2: substitute v = y/x, using the definition of v. The result is (1+v^2)/v."
          - problem: "For the equation y' = (x^2 + y^2)/x, decide whether the right side depends only on v = y/x, and give d, the degree of the numerator minus the degree of the denominator. Give the answer as verdict = label; d = value."
            answer: "verdict = nonhomogeneous; d = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["homogeneous"], ["nonhomogeneous"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Start with y' = (x^2 + y^2)/x. Step 1: read the degree of the numerator as 2. Step 2: read the degree of the denominator as 1. Step 3: subtract degrees to get d = 2 - 1 = 1. A nonzero mismatch means the right side is not a function of v alone. Choosing homogeneous is wrong because the remaining factor 1/x cannot be written with v only. verdict = nonhomogeneous; d = 1."
          - problem: "For the equation y' = (x^2 + y^2)/x^3, decide whether the right side depends only on v = y/x, and give d, the degree of the numerator minus the degree of the denominator. Give the answer as verdict = label; d = value."
            answer: "verdict = nonhomogeneous; d = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["homogeneous"], ["nonhomogeneous"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "d"}]}
            solution_sketch: "Start with y' = (x^2 + y^2)/x^3. Step 1: read the degree of the numerator as 2. Step 2: read the degree of the denominator as 3. Step 3: subtract degrees to get d = 2 - 3 = -1. A nonzero mismatch means the right side is not a function of v alone. Choosing homogeneous is wrong because the remaining factor 1/x remains after dividing. verdict = nonhomogeneous; d = -1."
          - problem: "For the equation y' = (x^3 + y^3)/(x y^2), write the right side as a function of v = y/x. Give the answer as a function of v."
            answer: "(1+v^3)/v^2"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with the right side (x^3 + y^3)/(x y^2). Step 1: divide top and bottom by x^3, using algebra. Step 2: rewrite y^2/x^2 as v^2. Step 3: substitute v = y/x. The result is (1+v^3)/v^2."
          - problem: "For the equation y' = (x^2 - y^2)/(x y), write the right side as a function of v = y/x. Give the answer as a function of v."
            answer: "(1-v^2)/v"
            answer_contract: {"kind": "function", "vars": ["v"]}
            solution_sketch: "Start with the right side (x^2 - y^2)/(x y). Step 1: divide top and bottom by x^2, using algebra. Step 2: substitute v = y/x, using the definition of v. The result is (1-v^2)/v."
        constraints: "right sides are ratios of degree-matched polynomials (homogeneous) or degree-mismatched foils"
      - id: kp2
        name: The substitution mechanics
        key_prerequisites: [chain-rule, separable-equations]
        exemplars:
          - problem: "Substitute $y = vx$ into $y' = 1 + \\dfrac{y}{x}$ and simplify."
            answer: "$v + xv' = 1 + v$, so $xv' = 1$."
            answer_contract: {kind: none}
            solution_sketch: "Product rule: $y' = v + xv'$; the $v$ terms cancel, leaving a separable equation."
          - problem: "Substitute $y = vx$ into $y' = \\dfrac{x^2 + y^2}{xy}$ and simplify."
            answer: "$v + xv' = \\dfrac{1 + v^2}{v}$, so $xv' = \\dfrac{1}{v}$."
            answer_contract: {kind: none}
            solution_sketch: "$v + xv' = \\dfrac{1 + v^2}{v}$, so $xv' = \\dfrac{1}{v}$."
          - problem: "Substitute $y = vx$ into $y' = \\dfrac{y^2 + 2xy}{x^2}$ and simplify."
            answer: "$v + xv' = v^2 + 2v$, so $xv' = v^2 + v$."
            answer_contract: {kind: none}
            solution_sketch: "$v + xv' = v^2 + 2v$, so $xv' = v^2 + v$."
        constraints: "always y = vx with y' = v + xv'; the result must be visibly separable in v and x"
      - id: kp3
        name: Complete solutions
        key_prerequisites: [separable-equations]
        exemplars:
          - problem: "Solve xy' = x + y for x > 0 with y(1) = 2. Give y explicitly as a function of x."
            answer: "x ln(x) + 2x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute v = y/x, so y = xv and y' = v + xv'. The equation xy' = x + y becomes x^2 v' = x, hence v' = 1/x by separation. Integrate to get v = ln(x) + C. The initial condition y(1) = 2 gives v(1) = 2, so C = 2. Back-substitute to obtain y = x ln(x) + 2x."
          - problem: "Solve y' = (x^2 + y^2)/(xy) for x > 0 with y(1) = 1. Give y explicitly as a function of x."
            answer: "x sqrt(2 ln(x) + 1)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute v = y/x, so y' = v + xv'. Then y' = (x^2 + y^2)/(xy) becomes x v' = 1/v. Separate and integrate: v^2/2 = ln(x) + C. The initial condition y(1) = 1 gives v(1) = 1, so the constant is 1. The positive branch is y = x sqrt(2 ln(x) + 1)."
          - problem: "Solve $y' = \\dfrac{x^2 + y^2}{xy}$ with $y(1) = 2$."
            answer: "$y = x\\sqrt{2\\ln x + 4}$"
            solution_sketch: "From $y^2 = x^2(2\\ln x + C)$, the condition $y(1) = 2$ gives $C = 4$; take the positive root."
          - problem: "Solve xy' = y - x for x > 0 with y(1) = 1. Give y explicitly as a function of x."
            answer: "x - x ln(x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute v = y/x to write y' = v + xv'. The equation xy' = y - x becomes x^2 v' = -x, so v' = -1/x. Integrate to find v = -ln(x) + C. The condition y(1) = 1 forces C = 1, because v(1) = 1. Back-substitute to get y = x - x ln(x)."
          - problem: "Solve y' = (y^2 + xy)/x^2 for x > 0 with y(1) = 1. Give y explicitly as a function of x."
            answer: "x/(1 - ln(x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute v = y/x, so y' = v + xv'. The equation y' = (y^2 + xy)/x^2 becomes x v' = v^2. Separate to dv/v^2 = dx/x and integrate, giving -1/v = ln(x) + C. The initial condition y(1) = 1 gives v(1) = 1, so C = -1. Solving for v and back-substituting yields y = x/(1 - ln(x))."
          - problem: "Solve y' = (y^2 - x^2)/(xy) for x > 0 with y(1) = 2. Give y explicitly as a function of x."
            answer: "x sqrt(4 - 2 ln(x))"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Substitute v = y/x, so y' = v + xv'. The equation y' = (y^2 - x^2)/(xy) becomes x v' = -1/v. Separate and integrate: v^2/2 = -ln(x) + C. The initial condition y(1) = 2 gives v(1) = 2, so C = 2. The positive branch is y = x sqrt(4 - 2 ln(x))."
        constraints: "v-integrations produce ln x or powers of v; back-substitute v = y/x and state y explicitly when a branch is determined"
    diagnostic_exemplar:
      problem: "Solve $xy' = y + x$ ($x > 0$) with $y(1) = 3$."
      answer: "$y = x\\ln x + 3x$"
      solution_sketch: "$v = y/x$ gives $v = \\ln x + C$ with $v(1) = 3$, so $C = 3$."
    anki_seeds:
      - front: "A first-order equation y' = f(x, y) is homogeneous when..."
        back: "f can be written as a function of v = y/x alone (equivalently f(tx, ty) = f(x, y))."
        type: basic
      - front: "The substitution y = vx turns a homogeneous equation into..."
        back: "a separable equation in v and x, using y' = v + xv'."
        type: basic

  - id: exact-equations
    name: Exact Equations
    core: false                # special-class technique; heads a terminal two-topic branch
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: partial-derivatives
        weight: 0.6
        key: true
      - id: implicit-differentiation
        weight: 0.4
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Testing exactness
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: "For the differential equation (2xy + 3) dx + (x^2 - 1) dy = 0, determine whether My = Nx, and give the common value of My and Nx at (1,2)."
            answer: "verdict = equal; value = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["equal"], ["differ"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Identify M = 2xy + 3 and N = x^2 - 1 from the equation. Compute the partial derivatives by the power rule: My = 2x and Nx = 2x, so they are equal. At (1,2), the common value is 2(1) = 2. The option 'differ' would come from missing that both partials are 2x. The answer is verdict = equal; value = 2."
          - problem: "For the differential equation y^2 dx + x dy = 0, determine whether My = Nx, and give My - Nx at (1,2)."
            answer: "verdict = differ; value = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["equal"], ["differ"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Identify M = y^2 and N = x from the equation. Compute the partial derivatives by the power rule: My = 2y and Nx = 1, so they differ. At (1,2), My - Nx = 2(2) - 1 = 3. The option 'equal' would come from treating 2y as 1. The answer is verdict = differ; value = 3."
          - problem: "For which constant $b$ is $(ye^x + 2x)\\,dx + be^x\\,dy = 0$ exact?"
            answer: "$b = 1$"
            solution_sketch: "$M_y = e^x$ and $N_x = be^x$; exactness forces $b = 1$."
          - problem: "For which constant a is (x^2 y + a y^2) dx + ((1/3)x^3 + 6 x y) dy = 0 exact?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify M = x^2 y + a y^2 and N = (1/3)x^3 + 6 x y from the equation. The exactness test requires My = Nx. Compute My = x^2 + 2a y and Nx = x^2 + 6 y. Equate coefficients of y: 2a = 6, so a = 3. The answer is 3."
          - problem: "For which constant c is (e^x sin(y) + c x y) dx + (e^x cos(y) + 3 x^2) dy = 0 exact?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify M = e^x sin(y) + c x y and N = e^x cos(y) + 3 x^2 from the equation. The exactness test requires My = Nx. Compute My = e^x cos(y) + c x and Nx = e^x cos(y) + 6 x. Equate coefficients of x: c = 6. The answer is 6."
          - problem: "For which constant b is (2 x y + b y^2) dx + (x^2 + 8 x y) dy = 0 exact?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify M = 2xy + b y^2 and N = x^2 + 8xy from the equation. The exactness test requires My = Nx. Compute My = 2x + 2b y and Nx = 2x + 8y. Equate coefficients of y: 2b = 8, so b = 4. The answer is 4."
        constraints: "M, N polynomial/exponential/trig in x and y; the test is a two-partial-derivative computation"
      - id: kp2
        name: Reconstructing the potential function
        key_prerequisites: [partial-derivatives, implicit-differentiation]
        exemplars:
          - problem: "The equation (2xy + 3) dx + (x^2 - 1) dy = 0 is exact. Find the potential function F(x,y) such that F(x,y) = C is the general solution."
            answer: "x^2 y + 3x - y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (2xy + 3) dx + (x^2 - 1) dy = 0, check exactness: M_y = 2x and N_x = 2x, so exact. Integrate M in x: F = x^2 y + 3x + h(y). Match F_y = x^2 + h'(y) to N = x^2 - 1, so h'(y) = -1 and h(y) = -y. The potential function is x^2 y + 3x - y."
          - problem: "The equation (2x + y) dx + (x + 2y) dy = 0 is exact. Find the potential function F(x,y) for this equation."
            answer: "x^2 + xy + y^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (2x + y) dx + (x + 2y) dy = 0, check exactness: M_y = 1 and N_x = 1, so exact. Integrate M in x: F = x^2 + xy + h(y). Match F_y = x + h'(y) to N = x + 2y, so h'(y) = 2y and h(y) = y^2. The potential function is x^2 + xy + y^2."
          - problem: "The equation (cos(x) + y) dx + (x + e^y) dy = 0 is exact. Find the potential function F(x,y) for this equation."
            answer: "sin(x) + xy + e^y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (cos(x) + y) dx + (x + e^y) dy = 0, check exactness: M_y = 1 and N_x = 1, so exact. Integrate M in x: F = sin(x) + xy + h(y). Match F_y = x + h'(y) to N = x + e^y, so h'(y) = e^y and h(y) = e^y. The potential function is sin(x) + xy + e^y."
          - problem: "The equation (y cos(x) + 2x) dx + (sin(x) + 2y) dy = 0 is exact. Find the potential function F(x,y) for this equation."
            answer: "y sin(x) + x^2 + y^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (y cos(x) + 2x) dx + (sin(x) + 2y) dy = 0, check exactness: M_y = cos(x) and N_x = cos(x), so exact. Integrate M in x: F = y sin(x) + x^2 + h(y). Match F_y = sin(x) + h'(y) to N = sin(x) + 2y, so h'(y) = 2y and h(y) = y^2. The potential function is y sin(x) + x^2 + y^2."
          - problem: "The equation (2xy + e^x) dx + (x^2 + 3y^2) dy = 0 is exact. Find the potential function F(x,y) for this equation."
            answer: "x^2 y + e^x + y^3"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (2xy + e^x) dx + (x^2 + 3y^2) dy = 0, check exactness: M_y = 2x and N_x = 2x, so exact. Integrate M in x: F = x^2 y + e^x + h(y). Match F_y = x^2 + h'(y) to N = x^2 + 3y^2, so h'(y) = 3y^2 and h(y) = y^3. The potential function is x^2 y + e^x + y^3."
          - problem: "The equation (y cosh(x) + 3x^2) dx + (sinh(x) + 4y^3) dy = 0 is exact. Find the potential function F(x,y) for this equation."
            answer: "y sinh(x) + x^3 + y^4"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "For (y cosh(x) + 3x^2) dx + (sinh(x) + 4y^3) dy = 0, check exactness: M_y = cosh(x) and N_x = cosh(x), so exact. Integrate M in x: F = y sinh(x) + x^3 + h(y). Match F_y = sinh(x) + h'(y) to N = sinh(x) + 4y^3, so h'(y) = 4y^3 and h(y) = y^4. The potential function is y sinh(x) + x^3 + y^4."
        constraints: "always verify exactness first; F recoverable with one integration in x plus matching h(y); leave the answer implicit as F(x,y) = C"
      - id: kp3
        name: Exact IVPs
        key_prerequisites: [partial-derivatives]
        exemplars:
          - problem: "Consider the exact equation (3x^2 + 2y) dx + (2x + 2y) dy = 0 with y(1) = 1. Find the constant C in the implicit solution F(x, y) = C."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = x^3 + 2xy + y^2. First check exactness: the mixed partials are both 2, so the equation is exact. Integrate M with respect to x to get F = x^3 + 2xy + g(y). Compare with N to find g'(y) = 2y, so g(y) = y^2. Evaluate F at (1, 1): 1 + 2 + 1 = 4. The constant is C = 4."
          - problem: "Consider the exact equation (y cos(x) + 1) dx + sin(x) dy = 0 with y(pi/2) = 3. Find the constant C in the implicit solution F(x, y) = C."
            answer: "3+pi/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = y sin(x) + x. First check exactness: the mixed partials are both cos(x), so the equation is exact. Integrate M with respect to x to get F = y sin(x) + x + g(y). Compare with N to find g'(y) = 0, so g(y) = 0. Evaluate F at (pi/2, 3): 3 sin(pi/2) + pi/2 = 3 + pi/2. The constant is C = 3+pi/2."
          - problem: "Consider the exact equation (2x + y) dx + (x + 2y) dy = 0 with y(0) = 1. Find the constant C in the implicit solution F(x, y) = C."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = x^2 + xy + y^2. First check exactness: the mixed partials are both 1, so the equation is exact. Integrate M with respect to x to get F = x^2 + xy + g(y). Compare with N to find g'(y) = 2y, so g(y) = y^2. Evaluate F at (0, 1): 0 + 0 + 1 = 1. The constant is C = 1."
          - problem: "Consider the exact equation (2xy + 3x^2) dx + (x^2 + 4y) dy = 0 with y(1) = 2. Find the constant C in the implicit solution F(x, y) = C."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = x^2 y + x^3 + 2y^2. First check exactness: the mixed partials are both 2x, so the equation is exact. Integrate M with respect to x to get F = x^2 y + x^3 + g(y). Compare with N to find g'(y) = 4y, so g(y) = 2y^2. Evaluate F at (1, 2): 2 + 1 + 8 = 11. The constant is C = 11."
          - problem: "Consider the exact equation (2x - y) dx + (2y - x) dy = 0 with y(2) = 1. Find the constant C in the implicit solution F(x, y) = C."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = x^2 - xy + y^2. First check exactness: the mixed partials are both -1, so the equation is exact. Integrate M with respect to x to get F = x^2 - xy + g(y). Compare with N to find g'(y) = 2y, so g(y) = y^2. Evaluate F at (2, 1): 4 - 2 + 1 = 3. The constant is C = 3."
          - problem: "Consider the exact equation (y e^(x) + 2x) dx + (e^(x) + 2y) dy = 0 with y(0) = 1. Find the constant C in the implicit solution F(x, y) = C."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The potential is F = y e^(x) + x^2 + y^2. First check exactness: the mixed partials are both e^(x), so the equation is exact. Integrate M with respect to x to get F = y e^(x) + x^2 + g(y). Compare with N to find g'(y) = 2y, so g(y) = y^2. Evaluate F at (0, 1): 1 + 0 + 1 = 2. The constant is C = 2."
        constraints: "leave answers implicit; the constant is fixed by evaluating F at the initial point"
    diagnostic_exemplar:
      problem: 'Solve $(2xy - 3x^2)\,dx + (x^2 + 2y)\,dy = 0$ with $y(1) = 2$.'
      answer: '$x^2 y - x^3 + y^2 = 5$'
      answer_contract: {kind: none}
      solution_sketch: '$M_y = 2x = N_x$, so the equation is exact; $F = x^2y - x^3 + y^2$ satisfies $F_x = M$ and $F_y = N$. Then $F(1,2) = 2 - 1 + 4 = 5$.'
    anki_seeds:
      - front: "Exactness test for M dx + N dy = 0?"
        back: '$\partial M/\partial y = \partial N/\partial x$ (on a rectangle).'
        type: basic
      - front: "The solution of an exact equation M dx + N dy = 0 is..."
        back: "$F(x,y) = C$, where $F_x = M$ and $F_y = N$."
        type: basic

  - id: integrating-factors-for-exactness
    name: Integrating Factors for Exactness
    core: false                # extension of exact equations; terminal
    difficulty: 0.78
    drill: false
    answer_kind: numeric
    expected_time_secs: 270
    prerequisites:
      - id: exact-equations
        weight: 0.7
        key: true
      - id: integrating-factor-computation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Finding $\\mu(x)$"
        key_prerequisites: [exact-equations, integrating-factor-computation]
        exemplars:
          - problem: "The equation (3xy + y^2) dx + (x^2 + xy) dy = 0 is not exact. Find an integrating factor mu(x) as a function of x."
            answer: "x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is (3xy + y^2) dx + (x^2 + xy) dy = 0, so M = 3xy + y^2 and N = x^2 + xy. Step 1 (exactness test): M_y = 3x + 2y and N_x = 2x + y, so (M_y - N_x)/N = (x + y)/(x(x + y)) = 1/x. Step 2 (integrating factor formula): mu = e^(integral of 1/x dx) = x. The integrating factor is x."
          - problem: "The equation 2y dx + x dy = 0 is not exact. Find an integrating factor mu(x) as a function of x."
            answer: "x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is 2y dx + x dy = 0, so M = 2y and N = x. Step 1 (exactness test): M_y = 2 and N_x = 1, so (M_y - N_x)/N = (2 - 1)/x = 1/x. Step 2 (integrating factor formula): mu = e^(integral of 1/x dx) = x. The integrating factor is x."
          - problem: "For a differential equation, (M_y - N_x)/N = 3/x. Find an integrating factor mu(x) as a function of x."
            answer: "x^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The quantity (M_y - N_x)/N is 3/x, which depends on x alone. Step 1 (exactness test): the equation is not exact because the ratio is nonzero. Step 2 (integrating factor formula): mu = e^(integral of 3/x dx) = e^(3 ln(abs(x))) = x^3. The integrating factor is x^3."
          - problem: "The equation (3y + x) dx + x dy = 0 is not exact. Find an integrating factor mu(x) as a function of x."
            answer: "x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is (3y + x) dx + x dy = 0, so M = 3y + x and N = x. Step 1 (exactness test): M_y = 3 and N_x = 1, so (M_y - N_x)/N = (3 - 1)/x = 2/x. Step 2 (integrating factor formula): mu = e^(integral of 2/x dx) = x^2. The integrating factor is x^2."
          - problem: "The equation (2y + x) dx + dy = 0 is not exact. Find an integrating factor mu(x) as a function of x."
            answer: "e^(2x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is (2y + x) dx + dy = 0, so M = 2y + x and N = 1. Step 1 (exactness test): M_y = 2 and N_x = 0, so (M_y - N_x)/N = 2. Step 2 (integrating factor formula): mu = e^(integral of 2 dx) = e^(2x). The integrating factor is e^(2x)."
          - problem: "The equation (-y + x) dx + dy = 0 is not exact. Find an integrating factor mu(x) as a function of x."
            answer: "e^(-x)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The equation is (-y + x) dx + dy = 0, so M = -y + x and N = 1. Step 1 (exactness test): M_y = -1 and N_x = 0, so (M_y - N_x)/N = -1. Step 2 (integrating factor formula): mu = e^(integral of -1 dx) = e^(-x). The integrating factor is e^(-x)."
        constraints: "(M_y - N_x)/N must simplify to a function of x alone (typically k/x); mu = e^{integral}"
      - id: kp2
        name: "Finding $\\mu(y)$"
        key_prerequisites: [exact-equations]
        exemplars:
          - problem: "The equation y dx + (2x + y^2) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For y dx + (2x + y^2) dy = 0, compute N_x = 2 and M_y = 1. Exactness test: (N_x - M_y)/M = (2 - 1)/y = 1/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 1/y dy) = e^(ln y) = y. The integrating factor is y."
          - problem: "The equation y dx + (3x + y) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y^2"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For y dx + (3x + y) dy = 0, compute N_x = 3 and M_y = 1. Exactness test: (N_x - M_y)/M = (3 - 1)/y = 2/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 2/y dy) = e^(2 ln y) = y^2. The integrating factor is y^2."
          - problem: "The equation y dx + (5x + y^3) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y^4"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For y dx + (5x + y^3) dy = 0, compute N_x = 5 and M_y = 1. Exactness test: (N_x - M_y)/M = (5 - 1)/y = 4/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 4/y dy) = e^(4 ln y) = y^4. The integrating factor is y^4."
          - problem: "The equation y^2 dx + (5xy + y^3) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y^3"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For y^2 dx + (5xy + y^3) dy = 0, compute N_x = 5y and M_y = 2y. Exactness test: (N_x - M_y)/M = (5y - 2y)/y^2 = 3/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 3/y dy) = e^(3 ln y) = y^3. The integrating factor is y^3."
          - problem: "The equation 2y dx + (12x + y^3) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y^5"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For 2y dx + (12x + y^3) dy = 0, compute N_x = 12 and M_y = 2. Exactness test: (N_x - M_y)/M = (12 - 2)/(2y) = 5/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 5/y dy) = e^(5 ln y) = y^5. The integrating factor is y^5."
          - problem: "The equation y^2 dx + (8xy + 1) dy = 0 is not exact. Find the integrating factor mu as a function of y."
            answer: "y^6"
            answer_contract: {"kind": "function", "vars": ["y"]}
            solution_sketch: "For y^2 dx + (8xy + 1) dy = 0, compute N_x = 8y and M_y = 2y. Exactness test: (N_x - M_y)/M = (8y - 2y)/y^2 = 6/y, a function of y alone. Integrating factor formula gives mu = e^(integral of 6/y dy) = e^(6 ln y) = y^6. The integrating factor is y^6."
        constraints: "(N_x - M_y)/M must simplify to a function of y alone (typically k/y)"
      - id: kp3
        name: Completing the solution
        key_prerequisites: [exact-equations]
        exemplars:
          - problem: "Solve $2y\\,dx + x\\,dy = 0$ using the integrating factor $\\mu = x$."
            answer: "$x^2 y = C$"
            answer_contract: {kind: none}
            solution_sketch: "Multiplying gives $2xy\\,dx + x^2\\,dy = d(x^2 y)$."
          - problem: "Solve $(3xy + y^2)\\,dx + (x^2 + xy)\\,dy = 0$ using $\\mu = x$."
            answer: "$2x^3 y + x^2 y^2 = C$"
            answer_contract: {kind: none}
            solution_sketch: "After multiplying, $F = x^3 y + \\dfrac{x^2 y^2}{2}$ satisfies $F_x = 3x^2y + xy^2$, $F_y = x^3 + x^2 y$; clear the fraction."
          - problem: "Solve $y\\,dx + (2x - ye^y)\\,dy = 0$ using $\\mu = y$."
            answer: "$xy^2 - (y^2 - 2y + 2)e^y = C$"
            answer_contract: {kind: none}
            solution_sketch: "After multiplying, $F = xy^2 + h(y)$ with $h'(y) = -y^2 e^y$; integrating by parts twice, $h = -(y^2 - 2y + 2)e^y$."
        constraints: "after multiplying by mu the equation must pass the exactness test; reconstruct F as in exact equations"
    diagnostic_exemplar:
      problem: "Solve $y\\,dx + 3x\\,dy = 0$ by finding an integrating factor."
      answer: "$xy^3 = C$"
      answer_contract: {kind: none}
      solution_sketch: "$\\mu = y^2$ makes the equation $y^3\\,dx + 3xy^2\\,dy = d(xy^3) = 0$."
    anki_seeds:
      - front: "When does M dx + N dy = 0 admit an integrating factor mu(x)?"
        back: 'When $(M_y - N_x)/N$ is a function of $x$ alone; then $\mu = e^{\int (M_y - N_x)/N\,dx}$.'
        type: basic
      - front: "When does M dx + N dy = 0 admit an integrating factor mu(y)?"
        back: 'When $(N_x - M_y)/M$ is a function of $y$ alone; then $\mu = e^{\int (N_x - M_y)/M\,dy}$.'
        type: basic

  - id: natural-growth-decay-models
    name: Exponential Growth and Decay Models
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: separable-equations
        weight: 0.6
        key: true
      - id: exponential-growth-decay
        weight: 0.4
        key: false
      - id: continuous-growth-model
        # Phase C (C-D): the P_0 e^{kt} model this topic derives and manipulates is now
        # taught in foundations; exponential-growth-decay covers only discrete bases.
        weight: 0.4
        key: false
      - id: logarithm-properties
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: "Setting up and solving $P' = kP$"
        key_prerequisites: [separable-equations, exponential-growth-decay]
        exemplars:
          - problem: "A population obeys $P' = kP$ and doubles every $10$ hours. Find $k$ exactly."
            answer: '$k = \dfrac{\ln 2}{10}$ per hour'
            answer_contract: {kind: none}
            solution_sketch: '$P = P_0 e^{kt}$ and $P(10) = 2P_0$ give $e^{10k} = 2$, so $k = \frac{\ln 2}{10}$.'
          - problem: "A radioactive isotope has half-life $5730$ years. Find its decay constant $k$ in $N' = -kN$."
            answer: '$k = \dfrac{\ln 2}{5730}$ per year'
            answer_contract: {kind: none}
            solution_sketch: '$N = N_0 e^{-kt}$ with $N(5730) = N_0/2$ gives $e^{-5730k} = \frac{1}{2}$.'
          - problem: "Solve $P' = 0.02P$ with $P(0) = 500$."
            answer: "$P(t) = 500e^{0.02t}$"
            answer_contract: {kind: none}
            solution_sketch: "$P(t) = 500e^{0.02t}$"
        constraints: "doubling times and half-lives are clean integers; express rate constants exactly with ln"
      - id: kp2
        name: Time-to-reach questions
        key_prerequisites: [logarithm-properties]
        exemplars:
          - problem: "A radioactive substance decays exponentially with a half-life of 8 days. Find the time in days until only 25% of the substance remains."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The remaining fraction is 25% = 1/4. Since 1/4 = (1/2)^2, the time is two half-lives. Two half-lives of 8 days each give 16 days. The answer is 16."
          - problem: "A bacteria culture doubles every 3 hours and starts with 100 cells. Find the time in hours for the culture to reach 800 cells."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The ratio of final to initial cells is 800/100 = 8. Since 8 = 2^3, the time is three doubling periods. Three periods of 3 hours each give 9 hours. The answer is 9."
          - problem: "Solve for the time at which $P(t) = 200e^{0.05t}$ reaches $1000$."
            answer: "$t = 20\\ln 5$"
            solution_sketch: "$e^{0.05t} = 5$ gives $0.05t = \\ln 5$."
          - problem: "A population grows exponentially and doubles every 12 years. The initial population is 500. Find the time in years for the population to reach 4000."
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The ratio of final to initial population is 4000/500 = 8. Since 8 = 2^3, the time is three doubling periods. Three periods of 12 years each give 36 years. The answer is 36."
          - problem: "An investment grows exponentially and doubles every 7 years. Find the time in years for the investment to become 4 times its original value."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The final value is 4 times the original value, so the ratio is 4. Since 4 = 2^2, the time is two doubling periods. Two periods of 7 years each give 14 years. The answer is 14."
          - problem: "A radioactive isotope decays exponentially with a half-life of 5 hours. Find the time in hours until only 1/8 of the isotope remains."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The remaining fraction is 1/8. Since 1/8 = (1/2)^3, the time is three half-lives. Three half-lives of 5 hours each give 15 hours. The answer is 15."
        constraints: "target ratios are powers of 2 (clean) or give single-log exact answers"
      - id: kp3
        name: "Determining $k$ and $P_0$ from data"
        key_prerequisites: [logarithm-properties, separable-equations]
        exemplars:
          - problem: "A population satisfies $P' = kP$ with $P(2) = 300$ and $P(5) = 2400$. Find $k$ and $P(0)$ exactly."
            answer: "$k = \\ln 2$; $P(0) = 75$."
            answer_contract: {kind: none}
            solution_sketch: "$\\dfrac{P(5)}{P(2)} = e^{3k} = 8$ gives $k = \\ln 2$; then $P(0) = 300e^{-2\\ln 2} = 300/4 = 75$."
          - problem: "A sample decays from $800$ g to $100$ g in $6$ hours. Find its half-life."
            answer: "$2$ hours"
            answer_contract: {kind: none}
            solution_sketch: "$100/800 = (1/2)^3$: three half-lives in $6$ hours."
        constraints: "data ratios are powers of 2 so k and the half-life come out as clean multiples of ln 2"
    diagnostic_exemplar:
      problem: 'A population satisfies $P'' = kP$ with $P(2) = 500$ and $P(6) = 8000$. Find $k$ and $P(0)$ exactly.'
      answer: '$k = \ln 2$; $P(0) = 125$.'
      answer_contract: {kind: none}
      solution_sketch: '$\frac{P(6)}{P(2)} = e^{4k} = 16$, so $k = \frac{\ln 16}{4} = \ln 2$. Then $P(0) = P(2)e^{-2k} = \frac{500}{4} = 125$.'
    anki_seeds:
      - front: "Solution of the natural growth equation P' = kP?"
        back: "$P(t) = P_0 e^{kt}$"
        type: basic
      - front: "Relation between the decay constant k and the half-life T?"
        back: '$k = \dfrac{\ln 2}{T}$'
        type: basic

  - id: newtons-law-of-cooling
    name: "Newton's Law of Cooling"
    core: false                # application genre; feeds only the applications capstone
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: natural-growth-decay-models
        weight: 0.6
        key: true
      - id: linear-first-order-integrating-factor
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Setting up and the general solution
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: "A body cools in a $20^{\\circ}$C room. Write the cooling ODE and its general solution."
            answer: "$T' = -k(T - 20)$; $T = 20 + Ce^{-kt}$."
            answer_contract: {kind: none}
            solution_sketch: "The shifted variable $u = T - 20$ satisfies $u' = -ku$."
          - problem: "A cup of coffee at $90^{\\circ}$C sits in a $25^{\\circ}$C room. Write $T(t)$ with $k$ undetermined."
            answer: "$T = 25 + 65e^{-kt}$"
            solution_sketch: "$C = T(0) - 25 = 65$."
          - problem: "For $T = 15 + 40e^{-2t}$, identify the ambient temperature and the initial temperature."
            answer: "Ambient $15^{\\circ}$; $T(0) = 55^{\\circ}$."
            answer_contract: {kind: none}
            solution_sketch: "Ambient $15^{\\circ}$; $T(0) = 55^{\\circ}$."
        constraints: "ambient temperatures and initial temperatures are integers; solution always in the form A + Ce^{-kt}"
      - id: kp2
        name: "Finding $k$ from data"
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: "A body cools by Newton's law T' = -k(T - 20) in a 20 degrees C room. Its initial temperature is 100 C and after 10 minutes it is 60 C. Find the constant k. Give the answer to 4 decimals."
            answer: "0.0693"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Newton's law gives the full object T = 20 + 80e^(-kt). At t = 10, 60 = 20 + 80e^(-10k), so e^(-10k) = 40/80 = 1/2. Take natural logs: -10k = -ln(2), so k = ln(2)/10. The value to 4 decimals is 0.0693."
          - problem: "A cold drink at $5^{\\circ}$C warms in a $25^{\\circ}$C room, reaching $15^{\\circ}$C after $4$ minutes. Find $T(t)$."
            answer: '$T = 25 - 20e^{-(\ln 2/4)\,t}$'
            solution_sketch: "$T = 25 - 20e^{-kt}$; $T(4) = 15$ gives $e^{-4k} = \\dfrac{10}{20} = \\dfrac{1}{2}$, so $k = \\dfrac{\\ln 2}{4}$."
          - problem: "A metal bar cools in a 15 degrees C room. Its initial temperature is 95 C and after 6 minutes it is 55 C. Find the cooling constant k. Give the answer to 4 decimals."
            answer: "0.1155"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Newton's law gives the full object T = 15 + 80e^(-kt). At t = 6, 55 = 15 + 80e^(-6k), so e^(-6k) = 40/80 = 1/2. Take natural logs: -6k = -ln(2), so k = ln(2)/6. The value to 4 decimals is 0.1155."
          - problem: "A cold drink at 5 C warms in a 25 C room. After 4 minutes its temperature is 15 C. Find the warming constant k. Give the answer to 4 decimals."
            answer: "0.1733"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Newton's law gives the full object T = 25 - 20e^(-kt), so the coefficient C is negative for warming. At t = 4, 15 = 25 - 20e^(-4k), so e^(-4k) = 10/20 = 1/2. Take natural logs: -4k = -ln(2), so k = ln(2)/4. The value to 4 decimals is 0.1733."
          - problem: "A pie cools in a 30 C room. Its temperature is 90 C at the start and 60 C after 20 minutes. Find the cooling constant k. Give the answer to 4 decimals."
            answer: "0.0347"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Newton's law gives the full object T = 30 + 60e^(-kt). At t = 20, 60 = 30 + 60e^(-20k), so e^(-20k) = 30/60 = 1/2. Take natural logs: -20k = -ln(2), so k = ln(2)/20. The value to 4 decimals is 0.0347."
          - problem: "A metal block at 10 C warms in a 30 C room. After 8 minutes its temperature is 20 C. Find the warming constant k. Give the answer to 4 decimals."
            answer: "0.0866"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Newton's law gives the full object T = 30 - 20e^(-kt), so the coefficient C is negative for warming. At t = 8, 20 = 30 - 20e^(-8k), so e^(-8k) = 10/20 = 1/2. Take natural logs: -8k = -ln(2), so k = ln(2)/8. The value to 4 decimals is 0.0866."
        constraints: "the measured gap ratio is a power of 1/2 so k is a clean multiple of ln 2; warming problems flip the sign of C"
      - id: kp3
        name: Time questions
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: 'With $T(t) = 20 + 80e^{-(\ln 2/10)t}$, when does the body reach $30^{\circ}$C?'
            answer: "$t = 30$ minutes"
            answer_contract: {kind: none}
            solution_sketch: "$80e^{-kt} = 10$ means the gap has halved three times: $3 \\times 10 = 30$."
          - problem: 'With $T = 25 - 20e^{-(\ln 2/4)t}$, when does the drink reach $20^{\circ}$C?'
            answer: "$t = 8$ minutes"
            answer_contract: {kind: none}
            solution_sketch: "$20e^{-kt} = 5$: the gap quarters, i.e. two halvings of $4$ minutes each."
        constraints: "target gaps are the initial gap divided by a power of 2, so times are integer multiples of the halving time"
    diagnostic_exemplar:
      problem: "A body in a $20^{\\circ}$C room cools from $100^{\\circ}$C to $60^{\\circ}$C in $10$ minutes. When does it reach $25^{\\circ}$C?"
      answer: "$40$ minutes"
      answer_contract: {kind: none}
      solution_sketch: "The gap halves every $10$ minutes: $80 \\to 40 \\to 20 \\to 10 \\to 5$ takes four halvings."
    anki_seeds:
      - front: "Newton's law of cooling as an ODE (ambient temperature A)?"
        back: "$T' = -k(T - A)$ with $k > 0$."
        type: basic
      - front: "Solution of T' = -k(T - A) with T(0) = T0?"
        back: "$T = A + (T_0 - A)e^{-kt}$"
        type: basic

  - id: mixing-tank-models
    name: Mixing Tank Models
    core: false                # application genre; feeds only the applications capstone
    difficulty: 0.70
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: linear-first-order-integrating-factor
        weight: 0.7
        key: true
      - id: natural-growth-decay-models
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Setting up the balance equation
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "A $100$ L tank starts with pure water. Brine at $2$ g/L flows in at $5$ L/min; the well-mixed solution leaves at $5$ L/min. Write the ODE for the salt $A(t)$."
            answer: "$A' = 10 - \\dfrac{A}{20}$, $A(0) = 0$."
            answer_contract: {kind: none}
            solution_sketch: "Rate in $= 2 \\cdot 5 = 10$ g/min; rate out $= 5 \\cdot \\dfrac{A}{100} = \\dfrac{A}{20}$."
          - problem: "A $50$ L tank holds $10$ g of salt. Brine at $1$ g/L flows in at $2$ L/min, and the mixture leaves at $2$ L/min. Write the ODE."
            answer: "$A' = 2 - \\dfrac{A}{25}$, $A(0) = 10$."
            answer_contract: {kind: none}
            solution_sketch: "$A' = 2 - \\dfrac{A}{25}$, $A(0) = 10$."
          - problem: "Pure water flows at $4$ L/min into a $200$ L tank of brine, and the mixture drains at $4$ L/min. Write the ODE for the salt $A(t)$."
            answer: "$A' = -\\dfrac{A}{50}$"
            answer_contract: {kind: none}
            solution_sketch: "Rate in is $0$; rate out is $4 \\cdot \\dfrac{A}{200}$."
        constraints: "constant volume (equal flow rates); rate out = (outflow rate) x A/V; integer concentrations and flows"
      - id: kp2
        name: Solving the model
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "Solve $A' = 10 - \\dfrac{A}{20}$ with $A(0) = 0$."
            answer: "$A(t) = 200(1 - e^{-t/20})$"
            answer_contract: {kind: none}
            solution_sketch: "Equilibrium $200$; $A = 200 + Ce^{-t/20}$ with $C = -200$."
          - problem: "Solve $A' = 2 - \\dfrac{A}{25}$ with $A(0) = 10$."
            answer: "$A(t) = 50 - 40e^{-t/25}$"
            answer_contract: {kind: none}
            solution_sketch: "Equilibrium $50$; $A(0) = 10$ gives $C = -40$."
          - problem: "Solve $A' = -\\dfrac{A}{50}$ with $A(0) = 30$."
            answer: "$A(t) = 30e^{-t/50}$"
            answer_contract: {kind: none}
            solution_sketch: "$A(t) = 30e^{-t/50}$"
        constraints: "solutions have the shape (limit) + C e^{-t/tau}; C fixed by the initial amount"
      - id: kp3
        name: Long-run behavior and timing
        key_prerequisites: [linear-first-order-integrating-factor]
        exemplars:
          - problem: "For $A(t) = 200(1 - e^{-t/20})$, how much salt does the tank hold in the long run?"
            answer: "$200$ g"
            answer_contract: {kind: none}
            solution_sketch: "Set $A' = 0$ (or note the inflow concentration $2$ g/L times the $100$ L volume)."
          - problem: "For $A(t) = 200(1 - e^{-t/20})$, when does the tank hold $100$ g?"
            answer: "$t = 20\\ln 2$ minutes"
            answer_contract: {kind: none}
            solution_sketch: "$1 - e^{-t/20} = \\tfrac{1}{2}$ gives $e^{-t/20} = \\tfrac{1}{2}$."
          - problem: "What is the long-run concentration in a constant-volume tank fed with brine at $2$ g/L?"
            answer: "$2$ g/L — the inflow concentration."
            answer_contract: {kind: none}
            solution_sketch: "$2$ g/L — the inflow concentration."
        constraints: "long-run amount = inflow concentration x volume; timing answers are clean multiples of tau ln 2"
    diagnostic_exemplar:
      problem: 'A $40$ L tank starts with pure water. Brine containing $3$ g/L flows in at $4$ L/min and the well-mixed solution leaves at $4$ L/min. Find the amount of salt $A(t)$ in the tank, and the time at which it reaches $60$ g.'
      answer: '$A(t) = 120\left(1 - e^{-t/10}\right)$; it reaches $60$ g at $t = 10\ln 2$ minutes.'
      answer_contract: {kind: none}
      solution_sketch: 'Balance: $A'' = 3 \cdot 4 - \frac{A}{40}\cdot 4 = 12 - \frac{A}{10}$ with $A(0) = 0$, whose solution is $A = 120(1 - e^{-t/10})$. Setting $A = 60$ gives $e^{-t/10} = \frac{1}{2}$.'
    anki_seeds:
      - front: "In a constant-volume mixing tank, the rate of salt leaving is..."
        back: "(outflow rate) x A/V: the outflow carries the current concentration."
        type: basic
      - front: "Long-run amount of salt in a constant-volume tank?"
        back: "inflow concentration x tank volume."
        type: basic

  - id: logistic-population-models
    name: The Logistic Equation
    core: false                # named model; feeds only the applications capstone
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: separable-equations
        weight: 0.5
        key: true
      - id: partial-fractions-integration
        weight: 0.5
        key: true
      - id: slope-fields-equilibria
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Structure and equilibria
        key_prerequisites: [slope-fields-equilibria]
        exemplars:
          - problem: "Identify $r$ and the carrying capacity $K$ in $P' = 3P\\left(1 - \\dfrac{P}{600}\\right)$."
            answer: "$r = 3$; $K = 600$."
            answer_contract: {kind: none}
            solution_sketch: "$r = 3$; $K = 600$."
          - problem: "For $P' = 0.5P\\left(1 - \\dfrac{P}{100}\\right)$ with $P(0) = 10$, find $\\lim_{t \\to \\infty} P(t)$."
            answer: "$100$"
            solution_sketch: "Any solution starting in $(0, 100)$ increases to the carrying capacity $100$."
          - problem: "At what population does $P' = 0.5P\\left(1 - \\dfrac{P}{100}\\right)$ grow fastest?"
            answer: "$P = 50$"
            solution_sketch: "$P'$ is a downward parabola in $P$ with roots $0$ and $K$; the vertex is at $K/2$."
        constraints: "carrying capacity a round number; equilibria 0 (unstable) and K (stable); fastest growth at K/2"
      - id: kp2
        name: Solving via partial fractions
        key_prerequisites: [partial-fractions-integration, separable-equations]
        exemplars:
          - problem: "Solve the logistic equation $y' = y(1 - y)$ with $y(0) = \\tfrac{1}{2}$."
            answer: "$y = \\dfrac{1}{1 + e^{-t}}$"
            answer_contract: {kind: none}
            solution_sketch: "Partial fractions on $\\dfrac{dy}{y(1-y)}$ give the general solution $y = \\dfrac{1}{1 + Ce^{-t}}$; $y(0) = \\tfrac{1}{2}$ forces $C = 1$."
          - problem: "Solve $P' = 2P\\left(1 - \\dfrac{P}{1000}\\right)$ with $P(0) = 100$."
            answer: "$P = \\dfrac{1000}{1 + 9e^{-2t}}$"
            answer_contract: {kind: none}
            solution_sketch: "The general solution is $P = \\dfrac{K}{1 + Ce^{-rt}}$ with $K = 1000$, $r = 2$; $P(0) = 100$ gives $C = 9$."
        constraints: "K and r integers; C = (K - P0)/P0 comes out an integer"
      - id: kp3
        name: Reading the solution form
        key_prerequisites: [separable-equations]
        exemplars:
          - problem: "A population follows $P(t) = \\dfrac{1000}{1 + 9e^{-t}}$. Find $P(0)$ and the carrying capacity."
            answer: "$P(0) = 100$; carrying capacity $1000$."
            answer_contract: {kind: none}
            solution_sketch: "$P(0) = 1000/(1+9) = 100$; as $t \\to \\infty$ the denominator tends to $1$."
          - problem: "For $P(t) = \\dfrac{1000}{1 + 9e^{-t}}$, when does $P = 500$?"
            answer: "$t = \\ln 9$"
            solution_sketch: "$1 + 9e^{-t} = 2$ gives $e^{-t} = \\tfrac{1}{9}$."
        constraints: "P0 and K read off directly; half-capacity time is a clean logarithm ln C"
    diagnostic_exemplar:
      problem: 'Solve $P'' = 2P\left(1 - \dfrac{P}{600}\right)$ with $P(0) = 200$, and state the carrying capacity.'
      answer: '$P(t) = \dfrac{600}{1 + 2e^{-2t}}$; carrying capacity $600$.'
      answer_contract: {kind: none}
      solution_sketch: 'Here $r = 2$ and $K = 600$. Partial fractions give $P = \frac{K}{1 + Ae^{-rt}}$ with $A = \frac{K - P_0}{P_0} = \frac{400}{200} = 2$.'
    anki_seeds:
      - front: "In the logistic equation P' = rP(1 - P/K), K is the..."
        back: "carrying capacity: the stable equilibrium every positive solution approaches."
        type: basic
      - front: "Solution form of the logistic equation?"
        back: '$P = \dfrac{K}{1 + Ce^{-rt}}$ with $C = (K - P_0)/P_0$.'
        type: basic

  - id: first-order-applications
    name: Mixed First-Order Models
    core: false                # applications capstone; terminal
    difficulty: 0.76
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: natural-growth-decay-models
        weight: 0.5
        key: true
      - id: mixing-tank-models
        weight: 0.5
        key: true
      - id: newtons-law-of-cooling
        weight: 0.4
        key: false
      - id: logistic-population-models
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Growth with harvesting or immigration
        key_prerequisites: [natural-growth-decay-models]
        exemplars:
          - problem: "A fish population grows at relative rate $0.5$/year but is harvested at $100$ fish/year: $P' = 0.5P - 100$. Find the equilibrium population."
            answer: "$200$"
            solution_sketch: "Set $P' = 0$: $0.5P = 100$."
          - problem: "Solve $P' = 0.5P - 100$ with $P(0) = 300$ and describe the long-run behavior."
            answer: "$P = 200 + 100e^{t/2}$: the population grows without bound."
            answer_contract: {kind: none}
            solution_sketch: "$P - 200$ satisfies natural growth; starting above the (unstable) equilibrium, the population runs away upward."
          - problem: "Solve $P' = 0.5P - 100$ with $P(0) = 100$. When does the population die out?"
            answer: "$P = 200 - 100e^{t/2}$; extinction at $t = 2\\ln 2$ years."
            answer_contract: {kind: none}
            solution_sketch: "Below the equilibrium the gap grows: $200 - 100e^{t/2} = 0$ gives $e^{t/2} = 2$."
        constraints: "P' = kP - h with clean equilibrium h/k; the equilibrium is unstable — solutions diverge on both sides"
      - id: kp2
        name: Linear models across domains
        key_prerequisites: [mixing-tank-models]
        exemplars:
          - problem: "A falling object obeys $v' = 10 - 2v$ with $v(0) = 0$ (drag proportional to speed). Find $v(t)$ and the terminal velocity."
            answer: "$v = 5(1 - e^{-2t})$; terminal velocity $5$ m/s."
            answer_contract: {kind: none}
            solution_sketch: "Equilibrium $v = 5$; $v = 5 + Ce^{-2t}$ with $C = -5$."
          - problem: "A drug is infused at $20$ mg/h and eliminated at relative rate $1/4$ per hour: $A' = 20 - \\dfrac{A}{4}$, $A(0) = 0$. Find $A(t)$ and the long-run amount."
            answer: "$A = 80(1 - e^{-t/4})$; long-run $80$ mg."
            answer_contract: {kind: none}
            solution_sketch: "$A = 80(1 - e^{-t/4})$; long-run $80$ mg."
          - problem: "A capacitor charges by $V' = \\dfrac{12 - V}{2}$ with $V(0) = 0$. Find $V(t)$."
            answer: "$V = 12(1 - e^{-t/2})$"
            solution_sketch: "Same structure as a mixing tank: approach the source voltage $12$ exponentially."
        constraints: "all models are y' = a - by with clean equilibrium a/b; emphasize the shared structure across contexts"
      - id: kp3
        name: Two-stage prediction problems
        key_prerequisites: [newtons-law-of-cooling, natural-growth-decay-models]
        exemplars:
          - problem: "Coffee at $90^{\\circ}$C in a $20^{\\circ}$C room cools to $70^{\\circ}$C in $5$ minutes. How long after the start does it reach $50^{\\circ}$C? Give an exact answer."
            answer: '$t = \dfrac{5\ln(7/3)}{\ln(7/5)}$ minutes ($\approx 12.6$)'
            answer_contract: {kind: none}
            solution_sketch: "$T = 20 + 70e^{-kt}$; $T(5) = 70$ gives $e^{-5k} = \\tfrac{5}{7}$. Then $70e^{-kt} = 30$ gives $t = \\dfrac{\\ln(7/3)}{k}$ with $k = \\tfrac{1}{5}\\ln\\tfrac{7}{5}$."
          - problem: "A population doubles in $5$ hours. Exactly how long until it is $10$ times its initial size?"
            answer: '$t = \dfrac{5\ln 10}{\ln 2}$ hours'
            answer_contract: {kind: none}
            solution_sketch: "$k = \\tfrac{\\ln 2}{5}$; solve $e^{kt} = 10$."
        constraints: "first stage determines k from one measurement; second stage inverts for a time; answers exact in logarithms"
    diagnostic_exemplar:
      problem: 'A fish population grows at relative rate $0.4$ per year but is harvested at a constant $200$ fish per year: $P'' = 0.4P - 200$. With $P(0) = 400$, when does the population die out? Give an exact answer.'
      answer: '$t = \dfrac{5\ln 5}{2}$ years.'
      answer_contract: {kind: none}
      solution_sketch: 'The equilibrium is $P = 500$, and $P = 500 + (400 - 500)e^{0.4t} = 500 - 100e^{0.4t}$. This is zero when $e^{0.4t} = 5$, i.e. $t = \frac{\ln 5}{0.4} = \frac{5\ln 5}{2}$.'
    anki_seeds:
      - front: "Equilibrium of the harvested growth model P' = kP - h?"
        back: "P = h/k — and it is unstable: solutions diverge from it on both sides."
        type: basic
      - front: "Terminal velocity for v' = g - (k/m)v?"
        back: "$v_{\\infty} = mg/k$: set $v' = 0$."
        type: basic

  - id: orthogonal-trajectories
    name: Orthogonal Trajectories
    core: false                # application genre; terminal
    difficulty: 0.74
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: separable-equations
        weight: 0.5
        key: true
      - id: implicit-differentiation
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: The ODE of a family of curves
        key_prerequisites: [implicit-differentiation]
        exemplars:
          - problem: "Find the differential equation satisfied by the family $y = Cx^2$."
            answer: "$y' = \\dfrac{2y}{x}$"
            answer_contract: {kind: none}
            solution_sketch: "$y' = 2Cx$ and $C = y/x^2$, so $y' = 2(y/x^2)x = 2y/x$."
          - problem: "Find the differential equation of the circles $x^2 + y^2 = C$."
            answer: "$y' = -\\dfrac{x}{y}$"
            answer_contract: {kind: none}
            solution_sketch: "Differentiate implicitly: $2x + 2yy' = 0$."
          - problem: "Find the differential equation of the lines $y = Cx$."
            answer: "$y' = \\dfrac{y}{x}$"
            answer_contract: {kind: none}
            solution_sketch: "$y' = \\dfrac{y}{x}$"
        constraints: "one-parameter families; eliminate C between the equation and its derivative"
      - id: kp2
        name: The orthogonality condition
        key_prerequisites: [implicit-differentiation]
        exemplars:
          - problem: "The family $y = Cx^2$ satisfies $y' = 2y/x$. What ODE do its orthogonal trajectories satisfy?"
            answer: "$y' = -\\dfrac{x}{2y}$"
            answer_contract: {kind: none}
            solution_sketch: "Replace $y'$ by $-1/y'$: perpendicular slopes are negative reciprocals."
          - problem: "The circles $x^2 + y^2 = C$ satisfy $y' = -x/y$. What ODE do their orthogonal trajectories satisfy?"
            answer: "$y' = \\dfrac{y}{x}$"
            answer_contract: {kind: none}
            solution_sketch: "$y' = \\dfrac{y}{x}$"
        constraints: "pure slope-swap step: y' -> -1/y'; simplify the resulting right side"
      - id: kp3
        name: Solving for the trajectories
        key_prerequisites: [separable-equations, implicit-differentiation]
        exemplars:
          - problem: "Find the orthogonal trajectories of the parabolas $y = Cx^2$."
            answer: "The ellipses $x^2 + 2y^2 = C$."
            answer_contract: {kind: none}
            solution_sketch: "Solve $y' = -\\dfrac{x}{2y}$: $2y\\,dy = -x\\,dx$ gives $y^2 = -\\dfrac{x^2}{2} + C$."
          - problem: "Find the orthogonal trajectories of the circles $x^2 + y^2 = C$."
            answer: "The lines $y = Cx$."
            answer_contract: {kind: none}
            solution_sketch: "Solve $y' = y/x$: separable, $\\ln|y| = \\ln|x| + C$."
        constraints: "trajectory ODEs are separable with power/log integrals; present the orthogonal family with its own constant C"
    diagnostic_exemplar:
      problem: "Find the orthogonal trajectories of the lines $y = Cx$."
      answer: "The circles $x^2 + y^2 = C$."
      answer_contract: {kind: none}
      solution_sketch: "The lines satisfy $y' = y/x$; the trajectories solve $y' = -x/y$, which integrates to $x^2 + y^2 = C$."
    anki_seeds:
      - front: "To find orthogonal trajectories of a family with ODE y' = f(x, y), solve..."
        back: "$y' = -1/f(x, y)$: perpendicular curves have negative-reciprocal slopes."
        type: basic
      - front: "First step in finding orthogonal trajectories of a family F(x, y, C) = 0?"
        back: "Find the family's own ODE by differentiating and eliminating C."
        type: basic
