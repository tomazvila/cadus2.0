unit: first-order
course: differential-equations
module: "First-Order Equations"
topics:
  - id: ode-order-linearity
    name: Order and Linearity of Differential Equations
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: higher-order-derivatives
        weight: 0.5
        key: true
      - id: derivatives-trig
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: Identifying the order
        key_prerequisites: [higher-order-derivatives]
        exemplars:
          - problem: "Consider the differential equation y'' + 3y' - y = x, where y is a function of x. Find the order of this equation."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The order of an equation is the order of the highest derivative of y that appears. The full equation y'' + 3y' - y = x contains the second derivative y'' and the first derivative y' . The highest derivative is y'' , so the order is 2."
          - problem: "Consider the differential equation (y')^3 + y = 0, where y is a function of x. Find the order of this equation."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The order of an equation is the order of the highest derivative of y that appears. In (y')^3 + y = 0 the exponent 3 is an algebraic power, not a higher derivative, so the only derivative present is the first derivative y' . The highest derivative is y' , so the order is 1."
          - problem: "Consider the differential equation y''' - x^2 y' = e^x, where y is a function of x. Find the order of this equation."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The order of an equation is the order of the highest derivative of y that appears. The derivatives of y in y''' - x^2 y' = e^x are y''' (third) and y' (first); the factor x^2 is a coefficient, not a derivative of y. The highest derivative is y''' , so the order is 3."
          - problem: "A falling body has position x that depends on time t and satisfies the differential equation x'' = -9.8 - (x')^2. Find the order of this equation."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The order of an equation is the order of the highest derivative of the unknown function that appears. The equation x'' = -9.8 - (x')^2 contains the second derivative x'' and the squared term (x')^2 , which is still only a first derivative. The highest derivative is x'' , so the order is 2."
          - problem: "Equation A is y''' + (y')^2 = 0 and equation B is (y'')^2 + y' = x, where y is a function of x. Give the orders of equation A and equation B, in that order, as a list."
            answer: "3, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The order of an equation is the order of the highest derivative of y that appears. In A the highest derivative is y''' and the square on y' does not raise the order, so A has order 3. In B the highest derivative is y'' and the square on y'' does not raise the order, so B has order 2. The list is 3, 2."
          - problem: "Equation C is (dy/dt)^4 + y = sin(t) and equation D is (y'')^3 + (y')^5 = t, where y is a function of t. Give the orders of equation C and equation D, in that order, as a list."
            answer: "1, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The order of an equation is the order of the highest derivative of y that appears. In C the only derivative is dy/dt, a first derivative, and the fourth power does not raise the order, so C has order 1. In D the highest derivative is y'' , and the powers 3 and 5 on lower-order derivatives do not raise the order, so D has order 2. The list is 1, 2."
        constraints: "orders 1-3; include powers of lower-order derivatives as distractors"
      - id: kp2
        name: Linear or nonlinear
        key_prerequisites: []
        exemplars:
          - problem: 'State whether $y'''' + xy = \sin x$ is linear.'
            answer: "Linear."
            answer_contract: {kind: none}
            solution_sketch: "The unknown $y$ and its derivatives appear to the first power with coefficients depending only on $x$."
          - problem: "State whether $y' + y^2 = x$ is linear."
            answer: "Nonlinear: the $y^2$ term."
            answer_contract: {kind: none}
            solution_sketch: "Nonlinear: the $y^2$ term."
          - problem: 'State whether $y'''' + \sin y = 0$ is linear.'
            answer: 'Nonlinear: $\sin y$ is a nonlinear function of the unknown.'
            answer_contract: {kind: none}
            solution_sketch: 'Compare with $y'''' + (\sin x)\,y = 0$, which IS linear: what matters is how $y$ enters, not $x$.'
        constraints: "nonlinearity caused by powers of y or y', products y y', or functions like sin y, e^y; include a linear equation with variable coefficients as a foil"
      - id: kp3
        name: Translating rate statements into ODEs
        key_prerequisites: []
        exemplars:
          - problem: "A population p grows at a rate proportional to its size. Use a positive constant k. Give dp/dt as a function of p and k."
            answer: "kp"
            answer_contract: {"kind": "function", "vars": ["k", "p"]}
            solution_sketch: "The proportionality statement gives the template dp/dt = kp with a positive constant k, so the full equation is dp/dt = kp. The sign rule: growth means p increases with time, so the sign matching the described behavior is positive; a minus sign would model decay. The right-hand side of the differential equation is kp."
          - problem: "A body at temperature u cools in a room held at 20 degrees. Its rate of change is proportional to the difference u - 20. Use a positive constant k. Give du/dt as a function of u and k."
            answer: "-k(u-20)"
            answer_contract: {"kind": "function", "vars": ["k", "u"]}
            solution_sketch: "The difference statement gives du/dt proportional to u - 20 with a positive constant k, so the template is du/dt = k(u - 20). The sign rule: cooling means u decreases while u is above 20, so the rate must be negative there and the matching sign is minus. The right-hand side of the differential equation is -k(u-20)."
          - problem: "A pollutant concentration c decreases at a rate proportional to the square of c. Use a positive constant k. Give dc/dt as a function of c and k."
            answer: "-kc^2"
            answer_contract: {"kind": "function", "vars": ["k", "c"]}
            solution_sketch: "Proportionality to the square of c gives the template dc/dt = kc^2 with a positive constant k, so the full equation is dc/dt = -kc^2 after the sign step. The sign rule: decrease means c shrinks with time, so the sign matching the behavior is negative. The right-hand side of the differential equation is -kc^2."
          - problem: "A radioactive sample has mass m and decays at a rate proportional to m. Use a positive constant k. Give dm/dt as a function of m and k."
            answer: "-km"
            answer_contract: {"kind": "function", "vars": ["k", "m"]}
            solution_sketch: "The decay statement gives the template dm/dt = km with a positive constant k, so the full equation is dm/dt = -km. The sign rule: decay means m decreases with time, so the sign matching the behavior is negative. The right-hand side of the differential equation is -km."
          - problem: "A cold object at temperature u warms in a room held at 70 degrees. Its rate of change is proportional to the difference 70 - u. Use a positive constant k. Give du/dt as a function of u and k."
            answer: "k(70-u)"
            answer_contract: {"kind": "function", "vars": ["k", "u"]}
            solution_sketch: "The difference statement gives du/dt proportional to 70 - u with a positive constant k, so the template is du/dt = k(70 - u). The sign rule: warming means u increases while u is below 70, so the rate is positive there and the matching sign is plus. The right-hand side of the differential equation is k(70-u)."
          - problem: "A population p grows at a rate proportional to the square root of its size. Use a positive constant k. Give dp/dt as a function of p and k."
            answer: "k sqrt(p)"
            answer_contract: {"kind": "function", "vars": ["k", "p"]}
            solution_sketch: "Proportionality to the square root of p gives the template dp/dt = k sqrt(p) with a positive constant k, so the full equation is dp/dt = k sqrt(p). The sign rule: growth means p increases with time, so the sign matching the behavior is positive. The right-hand side of the differential equation is k sqrt(p)."
        constraints: "proportionality statements with k > 0; always ask for the sign that matches the described behavior"
    diagnostic_exemplar:
      problem: 'A quantity $y$ decreases at a rate proportional to the square of $y$. Write the differential equation, and state its order and whether it is linear.'
      answer: '$y'' = -ky^2$; order $1$; nonlinear (the unknown appears squared).'
      answer_contract: {kind: none}
      solution_sketch: '"Rate of change" is $y''$, "proportional to $y^2$" gives $ky^2$, and "decreases" makes it negative. The highest derivative is the first, and $y^2$ is a nonlinear function of the unknown.'
    anki_seeds:
      - front: "The order of a differential equation is..."
        back: "the order of the highest derivative that appears."
        type: basic
      - front: "A differential equation is linear when..."
        back: "y and its derivatives appear only to the first power, with coefficients depending only on the independent variable."
        type: basic

  - id: ode-classification-verification
    name: Verifying Solutions of ODEs
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: ode-order-linearity
        weight: 0.6
        key: true
      - id: chain-rule
        weight: 0.5
        key: true
      - id: derivatives-exp-log
        weight: 0.4
        key: false
      - id: implicit-differentiation
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Verifying a solution by substitution
        key_prerequisites: [chain-rule, derivatives-exp-log]
        exemplars:
          - problem: "Verify by substitution that y = e^(3x) is a solution of y' - 3y = 0. Give y' and 3y as functions of x."
            answer: "yp = 3e^(3x); rhs = 3e^(3x)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "yp"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "rhs"}]}
            solution_sketch: "Start from the candidate y = e^(3x). Differentiate by the chain rule for exponentials: y' = 3e^(3x). Compute the right side: 3y = 3e^(3x). The two sides agree for every x, so the substitution closes to the identity y' - 3y = 0. The key is yp = 3e^(3x); rhs = 3e^(3x)."
          - problem: "Show by substitution that y = x^2 satisfies x y' = 2y for x > 0. Give x y' and 2y as functions of x."
            answer: "lhs = 2x^2; rhs = 2x^2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "lhs"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "rhs"}]}
            solution_sketch: "Start from the candidate y = x^2. Differentiate by the power rule: y' = 2x. Substitute into the left side: x y' = x(2x) = 2x^2. Compute the right side: 2y = 2x^2. Both sides match, so the equation holds as an identity for x > 0. The key is lhs = 2x^2; rhs = 2x^2."
          - problem: "Verify by substitution that y = sin(2x) solves y'' + 4y = 0. Give y'' and 4y as functions of x."
            answer: "ypp = -4sin(2x); fy = 4sin(2x)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "ypp"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "fy"}]}
            solution_sketch: "Start from the candidate y = sin(2x). Differentiate twice by the chain rule: y' = 2cos(2x) and y'' = -4sin(2x). Compute 4y = 4sin(2x). Substitute: y'' + 4y = -4sin(2x) + 4sin(2x) = 0, an identity. The key is ypp = -4sin(2x); fy = 4sin(2x)."
          - problem: "Verify by substitution that y = e^(2x) is a solution of y' - 2y = 0, then find the common value of y'(0) and 2y(0)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start from the candidate y = e^(2x). Differentiate by the chain rule: y' = 2e^(2x). Compute 2y = 2e^(2x); the two sides of y' - 2y agree, so the substitution closes to 0 = 0. Evaluate the common side at x = 0: 2e^(0) = 2. The key is 2."
          - problem: "Verify that y = x^3 satisfies x y' = 3y, and give the common value of x y' and 3y at x = 2."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start from the candidate y = x^3. Differentiate by the power rule: y' = 3x^2. Substitute into the left side: x y' = 3x^3; the right side is 3y = 3x^3, so the identity holds. Evaluate at x = 2: 3(2)^3 = 24. The key is 24."
          - problem: "Verify that y = cos(3x) solves y'' + 9y = 0. Give y' and y'' as functions of x."
            answer: "yp = -3sin(3x); ypp = -9cos(3x)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "function", "vars": ["x"]}, "name": "yp"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "ypp"}]}
            solution_sketch: "Start from the candidate y = cos(3x). Differentiate by the chain rule: y' = -3sin(3x). Differentiate again: y'' = -9cos(3x). Substitute into y'' + 9y = -9cos(3x) + 9cos(3x) = 0, an identity. The key is yp = -3sin(3x); ypp = -9cos(3x)."
        constraints: "candidate solutions built from e^{kx}, sin/cos of kx, and polynomials; verification always closes to an identity"
      - id: kp2
        name: Verifying implicit solutions
        key_prerequisites: [implicit-differentiation]
        exemplars:
          - problem: "The relation x^2 + y^2 = 25 defines y as a function of x. Find y' in terms of x and y."
            answer: "-x/y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "The full relation is x^2 + y^2 = 25. Differentiate both sides with implicit differentiation and the chain rule: 2x + 2y y' = 0. Solve for y': 2y y' = -2x, so y' = -x/y."
          - problem: "The relation x^3 + y^3 = 64 defines y as a function of x. Find y' in terms of x and y."
            answer: "-x^2/y^2"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "The full relation is x^3 + y^3 = 64. Differentiate both sides with implicit differentiation and the chain rule: 3x^2 + 3y^2 y' = 0. Solve for y': 3y^2 y' = -3x^2, so y' = -x^2/y^2."
          - problem: "The relation xy = 12 defines y as a function of x. Find y' in terms of x and y."
            answer: "-y/x"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "The full relation is xy = 12. Differentiate both sides with implicit differentiation and the product rule: y + x y' = 0. Solve for y': x y' = -y, so y' = -y/x."
          - problem: "The relation x^2 - y^2 = 9 defines y as a function of x. Find y' in terms of x and y."
            answer: "x/y"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "The full relation is x^2 - y^2 = 9. Differentiate both sides with implicit differentiation and the chain rule: 2x - 2y y' = 0. Solve for y': -2y y' = -2x, so y' = x/y."
          - problem: "The relation xy + x^2 = 1 defines y as a function of x. Find y' in terms of x and y."
            answer: "-(y+2x)/x"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "The full relation is xy + x^2 = 1. Differentiate both sides with implicit differentiation, the product rule, and the power rule: y + x y' + 2x = 0. Solve for y': x y' = -y - 2x, so y' = -(y+2x)/x."
          - problem: "The relation y^3 + xy = 4 defines y as a function of x. Find y' in terms of x and y."
            answer: "-y/(3y^2+x)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "The full relation is y^3 + xy = 4. Differentiate both sides with implicit differentiation, the chain rule, and the product rule: 3y^2 y' + y + x y' = 0. Solve for y': (3y^2 + x) y' = -y, so y' = -y/(3y^2+x)."
        constraints: "implicit relations polynomial in x and y; one implicit differentiation closes the verification"
      - id: kp3
        name: Fitting constants and parameters
        key_prerequisites: [derivatives-exp-log]
        exemplars:
          - problem: "The general solution of $y' + 2y = 0$ is $y = Ce^{-2x}$. Find $C$ so that $y(0) = 5$."
            answer: "$C = 5$"
            solution_sketch: "$y(0) = Ce^0 = C = 5$."
          - problem: "Find the smaller value of r for which $y = e^{rx}$ is a solution of $y'' - y' - 6y = 0$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the derivative rule for exponentials: y = e^(rx), y' = r e^(rx), y'' = r^2 e^(rx). Substitute these into y'' - y' - 6y = 0 to get (r^2 - r - 6)e^(rx) = 0. Since e^(rx) is never zero, solve r^2 - r - 6 = (r - 3)(r + 2) = 0. The roots are 3 and -2, so the smaller value is -2."
          - problem: "Find the constant $a$ so that $y = e^{2x}$ is a solution of $y'' + a y' - 6y = 0$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the derivative rule for exponentials: y = e^(2x), y' = 2e^(2x), y'' = 4e^(2x). Substitute into y'' + a y' - 6y = 0 to get 4e^(2x) + 2a e^(2x) - 6e^(2x) = 0. Factor e^(2x): (4 + 2a - 6)e^(2x) = 0, so 2a - 2 = 0. Solve the linear equation to get a = 1. The value is 1."
          - problem: "The general solution of $y' = 3y$ is $y = Ce^{3x}$. Find $C$ so that $y(0) = -4$."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the general solution y = C e^(3x). The condition y(0) = -4 gives C e^(0) = C = -4. Since e^0 = 1, the constant is determined directly. The value is -4."
          - problem: "Find the larger value of r for which $y = e^{rx}$ is a solution of $y'' - 5y' + 6y = 0$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the derivative rule for exponentials: y = e^(rx), y' = r e^(rx), y'' = r^2 e^(rx). Substitute into y'' - 5y' + 6y = 0 to get (r^2 - 5r + 6)e^(rx) = 0. Since e^(rx) is never zero, solve r^2 - 5r + 6 = (r - 2)(r - 3) = 0. The roots are 2 and 3, so the larger value is 3."
          - problem: "Find the constant $k$ so that $y = e^{-x}$ is a solution of $y'' + k y' + 6y = 0$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use the derivative rule for exponentials: y = e^(-x), y' = -e^(-x), y'' = e^(-x). Substitute into y'' + k y' + 6y = 0 to get e^(-x) - k e^(-x) + 6e^(-x) = 0. Factor e^(-x): (7 - k)e^(-x) = 0, so 7 - k = 0. Solve the linear equation to get k = 7. The value is 7."
        constraints: "one unknown constant or exponent parameter; the resulting algebraic equation is linear or a factorable quadratic"
    diagnostic_exemplar:
      problem: 'Show that $y^2 = x^2 + C$ defines a solution of $y\,y'' = x$, and find the value of $C$ for which the solution passes through $(1, 3)$.'
      answer: 'Differentiating implicitly gives $2y\,y'' = 2x$, i.e. $y\,y'' = x$; and $y(1) = 3$ forces $9 = 1 + C$, so $C = 8$.'
      answer_contract: {kind: none}
      solution_sketch: 'Implicit differentiation verifies the family; substituting the point fits the constant.'
    anki_seeds:
      - front: "To verify that y = f(x) solves an ODE, you..."
        back: "compute the needed derivatives, substitute, and check the equation reduces to an identity."
        type: basic
      - front: "To verify an implicit solution F(x, y) = C of an ODE, you..."
        back: "differentiate the relation implicitly and compare with the ODE."
        type: basic

  - id: existence-uniqueness-first-order
    name: Existence and Uniqueness
    core: false                # reassurance theorem; its statement is never invoked later
    difficulty: 0.63
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: ode-classification-verification
        weight: 0.5
        key: true
      - id: partial-derivatives
        weight: 0.4
        key: false
      - id: continuity
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Applying the existence-uniqueness theorem
        key_prerequisites: [continuity, partial-derivatives]
        exemplars:
          - problem: "Consider the initial value problem y' = x - y with y(0) = 1. Determine whether the theorem guarantees a single solution near the initial point, and give the value of the partial derivative f_y at that point as an exact value."
            answer: "verdict = unique; fy = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["unique"], ["nonunique"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fy"}]}
            solution_sketch: "Picard's theorem: first write f = x - y and f_y = -1. Step 1: f and f_y are continuous on a rectangle around (0,1), so the verdict is unique. Step 2: evaluate f_y at (0,1): f_y = -1. The option nonunique would come from missing that f_y is continuous. Answer: verdict = unique; fy = -1."
          - problem: "Consider the initial value problem y' = sqrt(y) with y(1) = 4. Determine whether the theorem guarantees a single solution near the initial point, and give the value of the partial derivative f_y at that point as an exact value."
            answer: "verdict = unique; fy = 1/4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["unique"], ["nonunique"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fy"}]}
            solution_sketch: "Picard's theorem: first write f = sqrt(y) and f_y = 1/(2sqrt(y)). Step 1: f and f_y are continuous on a rectangle around (1,4) because y = 4 is greater than 0, so the verdict is unique. Step 2: evaluate f_y at y = 4: f_y = 1/(2sqrt(4)) = 1/4. The option nonunique would come from missing the continuity of f_y near y = 4. Answer: verdict = unique; fy = 1/4."
          - problem: "Consider the initial value problem y' = y/x with y(2) = 1. Determine whether the theorem guarantees a single solution near the initial point, and give the value of the partial derivative f_y at that point as an exact value."
            answer: "verdict = unique; fy = 1/2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["unique"], ["nonunique"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fy"}]}
            solution_sketch: "Picard's theorem: first write f = y/x and f_y = 1/x. Step 1: f and f_y are continuous on a rectangle around (2,1) because x = 2 is away from x = 0, so the verdict is unique. Step 2: evaluate f_y at x = 2: f_y = 1/2. The option nonunique would come from missing that x = 0 is not near the initial point. Answer: verdict = unique; fy = 1/2."
          - problem: "Consider the initial value problem y' = x^2 + y^2 with y(1) = 2. Determine whether the theorem guarantees a single solution near the initial point, and give the value of the partial derivative f_y at that point as an exact value."
            answer: "verdict = unique; fy = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["unique"], ["nonunique"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fy"}]}
            solution_sketch: "Picard's theorem: first write f = x^2 + y^2 and f_y = 2y. Step 1: f and f_y are continuous on a rectangle around (1,2), so the verdict is unique. Step 2: evaluate f_y at y = 2: f_y = 2*2 = 4. The option nonunique would come from missing that f_y is continuous. Answer: verdict = unique; fy = 4."
          - problem: "The existence-uniqueness theorem needs f and its partial derivative f_y to be continuous near the initial point. For y' = y^2 + x with y(0) = 3, find the value of f_y at the initial point."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: identify f = y^2 + x, so the partial derivative is f_y = 2y. Step 2: f_y is continuous everywhere, so the theorem's condition holds. Step 3: evaluate at y = 3: f_y = 2*3 = 6. Answer: 6."
          - problem: "The existence-uniqueness theorem needs f and its partial derivative f_y to be continuous near the initial point. For y' = cos(x) + y^3 with y(0) = 2, find the value of f_y at the initial point."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: identify f = cos(x) + y^3, so the partial derivative is f_y = 3y^2. Step 2: f_y is continuous everywhere, so the theorem's condition holds. Step 3: evaluate at y = 2: f_y = 3*2^2 = 12. Answer: 12."
        constraints: "check continuity of f and f_y on a rectangle around the initial point; initial data placed safely away from any trouble spots"
      - id: kp2
        name: Where the guarantee fails
        key_prerequisites: [ode-classification-verification]
        exemplars:
          - problem: "For the initial value problem y' = 3y^(2/3) with y(0) = 0, the point (0,0) is a point where the hypotheses of the theorem need checking. State whether the theorem gives a single solution near (0,0), and give the nonzero solution as a function of x."
            answer: "verdict = fails; solution = x^3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["guaranteed"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "solution"}]}
            solution_sketch: "State the existence-uniqueness theorem: a single solution is guaranteed near (0,0) only when f and its partial derivative f_y are continuous there. Here f = 3y^(2/3) is continuous but f_y = 2y^(-1/3) is unbounded at y = 0, so the option guaranteed is wrong: f_y is not continuous at the initial point. Separate variables: y^(-2/3) dy = 3 dx, then integrate to get 3y^(1/3) = 3x + C, and y(0) = 0 gives C = 0, so the nonzero solution is y = x^3. Verify by substitution: (x^3)' = 3x^2 and 3(x^3)^(2/3) = 3x^2, which agree. The answer is verdict = fails; solution = x^3."
          - problem: "For the initial value problem y' = 2 sqrt(y) with y(0) = 0, check the hypotheses of the theorem at the initial point. State whether the theorem gives a single solution near (0,0), and give the nonzero solution as a function of x."
            answer: "verdict = multiple; solution = x^2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["guaranteed"], ["multiple"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "solution"}]}
            solution_sketch: "State the existence-uniqueness theorem: a single solution is guaranteed near (0,0) only when f and f_y are continuous there. Here f = 2 sqrt(y) is continuous but f_y = 1/sqrt(y) is unbounded at y = 0, so the option guaranteed is wrong: f_y is not continuous at the initial point. Separate variables: dy/(2 sqrt(y)) = dx, then integrate to get sqrt(y) = x + C, and y(0) = 0 gives C = 0, so the nonzero solution is y = x^2. Verify by substitution for x at least 0: (x^2)' = 2x and 2 sqrt(x^2) = 2x, which agree. The answer is verdict = multiple; solution = x^2."
          - problem: "Solve y' = y^2 with y(0) = 1. Find the largest interval containing x = 0 on which the solution exists. Give the answer as an inequality in x."
            answer: "x < 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Separate variables: y^(-2) dy = dx, then integrate to get -1/y = x + C. The initial condition y(0) = 1 gives C = -1, so the full solution is y = 1/(1 - x). Even though f = y^2 is continuous everywhere, the theorem guarantees existence only near x = 0, and this solution blows up at x = 1. The largest interval containing x = 0 is x < 1. The answer is x < 1."
          - problem: "Solve y' = 2y^2 with y(0) = 1. Find the largest interval containing x = 0 on which the solution exists. Give the answer as an inequality in x."
            answer: "x < 1/2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Separate variables: y^(-2) dy = 2 dx, then integrate to get -1/y = 2x + C. The initial condition y(0) = 1 gives C = -1, so the full solution is y = 1/(1 - 2x). The theorem gives only local existence, and this solution becomes unbounded where the denominator is zero, at x = 1/2. The largest interval containing x = 0 is x < 1/2. The answer is x < 1/2."
          - problem: "For the initial value problem y' = y^(1/3) with y(0) = 0, the constant function y = 0 is one solution. State whether the uniqueness conclusion of the theorem applies at (0,0), and give the nonzero solution as a function of x."
            answer: "verdict = breaks; solution = 2x sqrt(2x/3)/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["breaks"]]}, "name": "verdict"}, {"contract": {"kind": "function", "vars": ["x"]}, "name": "solution"}]}
            solution_sketch: "State the existence-uniqueness theorem: the uniqueness conclusion needs f and f_y continuous at the initial point. Here f = y^(1/3) is continuous but f_y = (1/3) y^(-2/3) is unbounded at y = 0, so the option holds is wrong: the theorem does not apply at (0,0). Separate variables: y^(-1/3) dy = dx, then integrate to get (3/2) y^(2/3) = x, so y^(2/3) = 2x/3 and the nonzero solution is y = (2x/3)^(3/2) = 2x sqrt(2x/3)/3. Verify by substitution for x at least 0: y' = sqrt(2x/3) and y^(1/3) = sqrt(2x/3), which agree. The answer is verdict = breaks; solution = 2x sqrt(2x/3)/3."
          - problem: "Solve y' = y^3 with y(0) = 1. Find the x-value where the solution blows up."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Separate variables: y^(-3) dy = dx, then integrate to get -1/(2 y^2) = x + C. The initial condition y(0) = 1 gives C = -1/2, so the full solution is y = 1/sqrt(1 - 2x). The theorem gives only local existence because this solution becomes unbounded in finite time. The blow-up happens where sqrt(1 - 2x) = 0, at x = 1/2. The answer is 1/2."
        constraints: "failure modes: f_y discontinuous at the initial y (non-uniqueness) or blow-up in finite time (local existence); solutions verifiable by substitution"
      - id: kp3
        name: Intervals of validity for linear equations
        key_prerequisites: [continuity]
        exemplars:
          - problem: "For $(x - 3)y' + y = \\ln x$ with $y(1) = 2$, find the largest interval on which a unique solution is guaranteed."
            answer: "$(0, 3)$"
            solution_sketch: 'In standard form the coefficients are discontinuous at $x = 3$ and $\ln x$ needs $x > 0$; the largest interval containing $x_0 = 1$ is $(0, 3)$.'
          - problem: 'For $y'' + (\tan x)\,y = \sin x$ with $y(0) = 0$, find the largest guaranteed interval.'
            answer: '$(-\pi/2, \pi/2)$'
            solution_sketch: '$\tan x$ is continuous between consecutive odd multiples of $\pi/2$; take the interval containing $0$.'
          - problem: "For $(x-4)y' + y = \\dfrac{1}{x}$ with $y(2)=1$, find the largest interval on which a unique solution is guaranteed. Give the answer as an inequality in x."
            answer: "0 < x < 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Use the standard-form rule: divide by $(x-4)$ to get $y' + y/(x-4) = 1/(x(x-4))$. By the continuity rule, the coefficient $1/(x-4)$ fails at $x=4$, and the forcing term $1/(x(x-4))$ fails at $x=0$ and $x=4$. The largest open interval containing $x_0=2$ that avoids all failure points is 0 < x < 4."
          - problem: "For $(x-2)y' + y = \\sqrt{x}$ with $y(3)=1$, find the largest interval on which a unique solution is guaranteed. Give the answer as an inequality in x."
            answer: "x > 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Use the standard-form rule: write the equation as $y' + y/(x-2) = \\sqrt{x}/(x-2)$. By the continuity rule, the coefficient is continuous for $x>0$ except at $x=2$, where the denominator vanishes. The initial point is $x_0=3$, so the interval containing it and avoiding $x=2$ is x > 2."
          - problem: "For $(x^2-9)y' + y = \\ln(x+1)$ with $y(0)=2$, find the largest interval on which a unique solution is guaranteed. Give the answer as an inequality in x."
            answer: "-1 < x < 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Use the standard-form rule: write the equation as $y' + y/(x^2-9) = \\ln(x+1)/(x^2-9)$. By the continuity rule, the coefficient fails at $x=-3$ and $x=3$, and the logarithm requires $x>-1$. The initial point is $x_0=0$, so the largest interval containing it and avoiding all failures is -1 < x < 3."
          - problem: "For $(x^2-1)y' + y = e^x$ with $y(2)=0$, find the largest interval on which a unique solution is guaranteed. Give the answer as an inequality in x."
            answer: "x > 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Use the standard-form rule: write the equation as $y' + y/(x^2-1) = e^x/(x^2-1)$. By the continuity rule, the coefficient is continuous except at $x=-1$ and $x=1$, where the denominator is zero. The initial point is $x_0=2$, so the interval containing it and avoiding both points is x > 1."
        constraints: "linear equations with 1-2 discontinuity points; the answer is the largest open interval containing x_0 avoiding all of them"
    diagnostic_exemplar:
      problem: "For $(x^2 - 4)y' + y = x$ with $y(0) = 1$, state the largest interval on which a unique solution is guaranteed."
      answer: "$(-2, 2)$"
      solution_sketch: "The standard-form coefficients are discontinuous at $x = \\pm 2$; the initial point $x_0 = 0$ lies between them."
    anki_seeds:
      - front: "Existence-uniqueness theorem for y' = f(x, y), y(x0) = y0?"
        back: "If f and ∂f/∂y are continuous on a rectangle around (x0, y0), a unique solution exists on some interval around x0."
        type: basic
      - front: "For a linear equation y' + P(x)y = Q(x), a unique solution exists on..."
        back: "the largest open interval containing x0 where P and Q are both continuous."
        type: basic

  - id: slope-fields
    name: Slope Fields
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: ode-classification-verification
        weight: 0.5
        key: true
      - id: slope
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Reading slopes from the equation
        key_prerequisites: [slope]
        exemplars:
          - problem: "For $y' = x - y$, what is the slope of the solution curve through $(2, 1)$?"
            answer: "$1$"
            solution_sketch: "The slope at a point is $f(x,y) = 2 - 1 = 1$."
          - problem: "For $y' = xy$, what is the slope of the solution curve through $(2, 3)$?"
            answer: "$6$"
          - problem: "For $y' = x^2 + y$, what is the slope at $(1, -2)$?"
            answer: "$-1$"
            solution_sketch: "$f(1, -2) = 1 + (-2) = -1$."
          - problem: "The slope field equation is $y' = x + y$. Find the slope of the solution curve through $(3, -1)$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Slope-field rule: the slope at a point is f(x,y) = x + y. Substitute x = 3 and y = -1: 3 + (-1) = 2. The slope is 2."
          - problem: "The slope field equation is $y' = x^2 - y$. Find the slope of the solution curve through $(-2, -3)$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Slope-field rule: the slope at a point is f(x,y) = x^2 - y. Substitute x = -2 and y = -3: (-2)^2 - (-3) = 4 + 3 = 7. The slope is 7."
          - problem: "The slope field equation is $y' = xy - 1$. Find the slope at $(2, 3)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Slope-field rule: the slope at a point is f(x,y) = xy - 1. Substitute x = 2 and y = 3: 2(3) - 1 = 6 - 1 = 5. The slope is 5."
        constraints: "f(x,y) polynomial with small integer coefficients; pure evaluation"
      - id: kp2
        name: Isoclines and zero-slope loci
        key_prerequisites: [slope]
        exemplars:
          - problem: "For y' = x^2 + y, find the equation of the horizontal isocline. Give the answer as y = f(x)."
            answer: "-x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: use the isocline condition for a horizontal field: x^2 + y = 0. Step 2: solve for y: y = -x^2. The zero-slope locus is the parabola y = -x^2. Answer: -x^2."
          - problem: "For y' = x - y, find the isocline on which every slope mark has value 2. Give the answer as y = f(x)."
            answer: "x-2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: use the isocline condition for slope 2: x - y = 2. Step 2: solve for y: y = x - 2. The isocline is the line y = x - 2. Answer: x-2."
          - problem: "For y' = y - 2x, find the equation of the horizontal isocline. Give the answer as y = f(x)."
            answer: "2x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: use the isocline condition for a horizontal field: y - 2x = 0. Step 2: solve for y: y = 2x. The zero-slope locus is the line y = 2x. Answer: 2x."
          - problem: "For y' = x^2 + y, find the isocline for slope 9. Give the answer as y = f(x)."
            answer: "9-x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: use the isocline condition for slope 9: x^2 + y = 9. Step 2: solve for y: y = 9 - x^2. The isocline is the parabola y = 9 - x^2. Answer: 9-x^2."
          - problem: "For y' = x^2 - y, find the isocline for slope 1. Give the answer as y = f(x)."
            answer: "x^2-1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: use the isocline condition for slope 1: x^2 - y = 1. Step 2: solve for y: y = x^2 - 1. The isocline is the parabola y = x^2 - 1. Answer: x^2-1."
          - problem: "For y' = x + y, the slope marks are horizontal on the line y = m x. Find m."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: horizontal slope marks satisfy the isocline condition f(x, y) = 0, so x + y = 0. Step 2: solve for y: y = -x, so the zero-slope locus is the line y = m x with m = -1. The slope of the horizontal isocline is -1."
        constraints: "isoclines f(x,y) = c are lines or parabolas; ask for horizontal (c = 0) and one nonzero c"
      - id: kp3
        name: Qualitative behavior from the field
        key_prerequisites: [ode-classification-verification]
        exemplars:
          - problem: "For the ODE y' = 1 + y^2, every solution curve is increasing. Find the smallest slope value that any slope mark in the field can have."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full ODE y' = 1 + y^2 and read the slope function f(y) = 1 + y^2. The square rule gives y^2 >= 0 for every y, so f(y) >= 1 everywhere. The minimum of f occurs at y = 0, where the slope mark equals 1. This positive lower bound is why no solution curve ever has a horizontal tangent. The smallest slope value in the field is 1."
          - problem: "For y' = x, the slope marks at the points (2, 0) and (2, 9) share one property. Find the sum of the two slope values at these points."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the full ODE y' = x and read the slope function f(x, y) = x. The dependence rule shows that f does not use y, so the slope at a point is its x coordinate. Both points have x = 2, so each slope mark equals 2. The two slopes are 2 and 2, and their sum is 2 + 2 = 4. The answer is 4."
          - problem: "For y' = y, determine the inequality in y that describes where solution curves are increasing."
            answer: "y > 0"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Start with the full ODE y' = y. The sign rule says a solution is increasing when f(y) = y is positive. Solve y > 0 for the increasing region. At y = 0 the slope is zero, and for y < 0 the slope is negative, so those values are not included. The inequality is y > 0."
          - problem: "For y' = y^2 - 4, find the y values where the slope marks are horizontal, in increasing order."
            answer: "-2, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Start with the full ODE y' = y^2 - 4. Horizontal slope marks occur when f(y) = y^2 - 4 equals zero. Solve y^2 = 4, which gives y = -2 and y = 2. The requested increasing order is -2, 2. The answer is -2, 2."
          - problem: "For y' = x + y, give the point on the vertical line x = 1 where the slope is zero as (x, y)."
            answer: "(1, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Start with the full ODE y' = x + y. A zero slope requires f(x, y) = x + y = 0. On the line x = 1, solve 1 + y = 0, so y = -1. The point is (1, -1). The answer is (1, -1)."
          - problem: "For y' = x^2 - 1, find the inequality in x for which solution curves are decreasing."
            answer: "-1 < x < 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Start with the full ODE y' = x^2 - 1. The sign rule says a solution decreases where f(x) = x^2 - 1 is negative. Solve x^2 - 1 < 0, which gives -1 < x < 1. The answer is -1 < x < 1."
        constraints: "qualitative questions: monotonicity from sign of f, symmetry of the field, identifying whether slopes depend on x, y, or both"
    diagnostic_exemplar:
      problem: 'For $y'' = x^2 + 1$, say where the slope marks are horizontal, along which lines they are constant, and give the family of solution curves.'
      answer: 'Nowhere horizontal: $x^2 + 1 \ge 1 > 0$, so every solution is strictly increasing. The slope depends only on $x$, so the marks are constant along vertical lines. The solutions are $y = \frac{x^3}{3} + x + C$.'
      answer_contract: {kind: none}
      solution_sketch: 'Horizontal marks would need $x^2 + 1 = 0$, which has no real solution; constancy along vertical lines follows from the absence of $y$; integrating gives the family.'
    anki_seeds:
      - front: "The slope field of y' = f(x, y) assigns to each point (x, y)..."
        back: "a short mark of slope f(x, y); solution curves follow the marks."
        type: basic
      - front: "An isocline of y' = f(x, y) is..."
        back: "a curve f(x, y) = c on which all slope marks have the same slope c."
        type: basic

  - id: slope-fields-equilibria
    name: Autonomous Equations and Phase Lines
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: slope-fields
        weight: 0.6
        key: true
      - id: factoring-trinomials
        weight: 0.25
        key: false
    knowledge_points:
      - id: kp1
        name: Finding equilibria and drawing the phase line
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: "Find the sum of the equilibrium solutions of $y' = y^2 - 5y + 6$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set f(y) = y^2 - 5y + 6. Factor the quadratic by finding two numbers that multiply to 6 and add to -5: f(y) = (y - 2)(y - 3). The zero-product property gives the equilibrium solutions y = 2 and y = 3. Their sum is 2 + 3 = 5."
          - problem: "Find the product of the equilibrium solutions of $y' = 4y - y^2$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set f(y) = 4y - y^2. Factor out y: f(y) = y(4 - y). The zero-product property gives the equilibrium solutions y = 0 and y = 4. Their product is 0 * 4 = 0."
          - problem: "For $y' = y(2 - y)$, find the intervals of $y$ where $f(y) = y(2 - y)$ is positive. Give the answer as an inequality in $y$."
            answer: "0 < y < 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Set f(y) = y(2 - y). The zeros are y = 0 and y = 2. Test y = 1: f(1) = 1(1) = 1 > 0. Test y = -1: f(-1) = (-1)(3) = -3 < 0. Test y = 3: f(3) = 3(-1) = -3 < 0. Thus f(y) is positive exactly on the interval 0 < y < 2."
          - problem: "Find the sum of the equilibrium solutions of $y' = y^2 - 1$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set f(y) = y^2 - 1. Factor the difference of squares: f(y) = (y - 1)(y + 1). The zero-product property gives the equilibrium solutions y = 1 and y = -1. Their sum is 1 + (-1) = 0."
          - problem: "For $y' = y^2 - 4$, find the intervals of $y$ where $f(y) = y^2 - 4$ is positive. Give the answer as an inequality in $y$."
            answer: "y < -2 or y > 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Set f(y) = y^2 - 4. Factor the difference of squares: f(y) = (y - 2)(y + 2), so the zeros are y = 2 and y = -2. Test y = 0: f(0) = -4 < 0. Test y = -3: f(-3) = 9 - 4 = 5 > 0. Test y = 3: f(3) = 9 - 4 = 5 > 0. Thus f(y) is positive on y < -2 or y > 2."
          - problem: "Find the sum of the equilibrium solutions of $y' = y(y - 1)(y + 3)$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set f(y) = y(y - 1)(y + 3). The zero-product property gives the equilibrium solutions y = 0, y = 1, and y = -3. Their sum is 0 + 1 + (-3) = -2."
        constraints: "f(y) factorable with integer roots; phase line = equilibria plus arrow directions from the sign of f"
      - id: kp2
        name: Stability classification
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: "For the autonomous equation y' = y(2 - y), find the value of the stable equilibrium solution."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: read f(y) = y(2 - y); its zeros are y = 0 and y = 2. Step 2: make a sign chart: f is negative for y < 0, positive on (0, 2), and negative for y > 2. Step 3: the flow is toward y = 2 from both sides, so y = 2 is stable. The stable equilibrium value is 2."
          - problem: "For the autonomous equation y' = y^2 - 9, how many stable equilibrium solutions are there?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: factor f(y) = y^2 - 9 = (y - 3)(y + 3), so the equilibria are y = -3 and y = 3. Step 2: sign chart: f is positive for y < -3, negative on (-3, 3), and positive for y > 3. Step 3: y = -3 is stable and y = 3 is unstable, so exactly one stable equilibrium. The count is 1."
          - problem: "For y' = (y - 1)^2, evaluate f(0) and classify the equilibrium at y = 1, then select the correct classification."
            answer: "f0 = 1; stability = semistable"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "f0"}, {"contract": {"kind": "label", "options": [["stable"], ["unstable"], ["semistable"]]}, "name": "stability"}]}
            solution_sketch: "Step 1: write f(y) = (y - 1)^2 and evaluate f(0) = 1. Step 2: sign chart: f is positive on both sides of y = 1, so below 1 the flow goes right toward 1 and above 1 it goes right away from 1. Step 3: the equilibrium is semistable. Therefore f0 = 1; stability = semistable."
          - problem: "For the autonomous equation y' = y(3 - y), find the value of the stable equilibrium solution."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: read f(y) = y(3 - y), with zeros y = 0 and y = 3. Step 2: sign chart: f is negative for y < 0, positive on (0, 3), and negative for y > 3. Step 3: the flow is toward y = 3 from both sides, so y = 3 is stable. The stable equilibrium value is 3."
          - problem: "For the autonomous equation y' = (y + 2)(y - 4), find the value of the stable equilibrium solution."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: factor f(y) = (y + 2)(y - 4), with zeros y = -2 and y = 4. Step 2: sign chart: f is positive for y < -2, negative on (-2, 4), and positive for y > 4. Step 3: the flow is toward y = -2 from both sides, so y = -2 is stable. The stable equilibrium value is -2."
          - problem: "For y' = -(y - 2)^2, evaluate f(0) and classify the equilibrium at y = 2, then select the correct classification."
            answer: "f0 = -4; stability = semistable"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "f0"}, {"contract": {"kind": "label", "options": [["stable"], ["unstable"], ["semistable"]]}, "name": "stability"}]}
            solution_sketch: "Step 1: write f(y) = -(y - 2)^2 and evaluate f(0) = -4. Step 2: sign chart: f is negative on both sides of y = 2, so below 2 the flow goes left away from 2 and above 2 it goes left toward 2. Step 3: the equilibrium is semistable. Therefore f0 = -4; stability = semistable."
        constraints: "f(y) factorable with integer roots; classify via a sign chart of f, no derivative test needed"
      - id: kp3
        name: Long-run behavior from an initial condition
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: "For $y' = y(2 - y)$ with $y(0) = 1$, find $\\lim_{t \\to \\infty} y(t)$."
            answer: "$2$"
            solution_sketch: "Starting in $(0,2)$ where $f > 0$, the solution increases monotonically toward the stable equilibrium $2$."
          - problem: "For $y' = y^2 - 9$ with $y(0) = 0$, find $\\lim_{t \\to \\infty} y(t)$."
            answer: "$-3$"
            solution_sketch: "On $(-3,3)$, $f < 0$: the solution decreases toward the stable equilibrium $-3$."
          - problem: "For $y' = -\\tfrac{1}{2}(y - 4)$ with $y(0) = 10$, find $\\lim_{t \\to \\infty} y(t)$."
            answer: "$4$"
            solution_sketch: "$f < 0$ for $y > 4$, so the solution decays monotonically to the equilibrium $4$."
          - problem: "For y' = y(1 - y) with y(0) = 1/4, find the long-run value of y(t)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation y' = y(1 - y) with y(0) = 1/4 has equilibria 0 and 1. In the phase-line step, 1/4 lies in (0, 1), so y' is positive and y(t) increases toward 1. The long-run value is 1."
          - problem: "For y' = y^2 - 4 with y(0) = 0, find the long-run value of y(t)."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation y' = y^2 - 4 with y(0) = 0 has equilibria -2 and 2. In the phase-line step, 0 lies in (-2, 2), so y' is negative and y(t) decreases toward -2. The long-run value is -2."
          - problem: "For y' = (y - 1)(3 - y) with y(0) = 2, find the long-run value of y(t)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The equation y' = (y - 1)(3 - y) with y(0) = 2 has equilibria 1 and 3. In the phase-line step, 2 lies in (1, 3), so y' is positive and y(t) increases toward 3. The long-run value is 3."
        constraints: "initial value sits strictly between or beyond integer equilibria; the answer is the equilibrium the flow carries it to"
    diagnostic_exemplar:
      problem: "For $y' = y(y - 3)$: find all equilibria, classify their stability, and find $\\lim_{t \\to \\infty} y(t)$ for the solution with $y(0) = 1$."
      answer: "$y = 0$ stable, $y = 3$ unstable; the solution with $y(0) = 1$ tends to $0$."
      answer_contract: {kind: none}
      solution_sketch: "$f > 0$ for $y < 0$, $f < 0$ on $(0,3)$, $f > 0$ for $y > 3$; from $y(0) = 1$ the solution decreases to $0$."
    anki_seeds:
      - front: "Equilibrium solutions of the autonomous equation y' = f(y) are..."
        back: "the constant solutions y = c where f(c) = 0."
        type: basic
      - front: "An equilibrium of y' = f(y) is stable when..."
        back: "f > 0 just below it and f < 0 just above it (the flow points toward it from both sides)."
        type: basic

  - id: eulers-method
    name: "Euler's Method"
    core: false                # named numerical algorithm; nothing here uses it
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: slope-fields-equilibria
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: A single Euler step
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "For $y' = x + y$ with $y(0) = 1$, take one Euler step of size $h = 0.1$ to estimate $y(0.1)$."
            answer: "$1.1$"
            solution_sketch: "$y_1 = y_0 + h\\,f(x_0, y_0) = 1 + 0.1(0 + 1) = 1.1$."
          - problem: "For $y' = y$ with $y(0) = 1$ and $h = 0.5$, estimate $y(0.5)$ with one Euler step."
            answer: "$1.5$"
          - problem: "For $y' = x - y$ with $y(1) = 2$ and $h = 0.2$, estimate $y(1.2)$ with one Euler step."
            answer: "$1.8$"
            solution_sketch: "$y_1 = 2 + 0.2(1 - 2) = 2 - 0.2 = 1.8$."
        constraints: "h in {0.1, 0.2, 0.25, 0.5}; f polynomial; arithmetic exact in one or two decimal places"
      - id: kp2
        name: Iterating several steps
        key_prerequisites: [slope-fields-equilibria, evaluating-expressions]
        exemplars:
          - problem: "For $y' = x + y$ with $y(0) = 1$ and $h = 0.1$, estimate $y(0.2)$ using two Euler steps."
            answer: "$1.22$"
            solution_sketch: "Step 1: $y_1 = 1 + 0.1(1) = 1.1$ at $x = 0.1$. Step 2: slope $= 0.1 + 1.1 = 1.2$, so $y_2 = 1.1 + 0.12 = 1.22$."
          - problem: "For $y' = y$ with $y(0) = 1$ and $h = 0.5$, estimate $y(1)$ using two Euler steps."
            answer: "$2.25$"
            solution_sketch: "Each step multiplies by $1.5$: $1 \\to 1.5 \\to 2.25$."
          - problem: "For $y' = x^2$ with $y(0) = 0$ and $h = 1$, estimate $y(2)$ using two Euler steps."
            answer: "$1$"
            solution_sketch: "$y_1 = 0 + 1\\cdot 0 = 0$; the slope at $x = 1$ is $1$, so $y_2 = 0 + 1 = 1$."
          - problem: "For $y' = x - y$ with $y(0) = 2$ and $h = 0.2$, estimate $y(0.4)$ using two Euler steps. Find the estimate."
            answer: "1.32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler rule: y_{n+1} = y_n + h f(x_n, y_n), with f(x,y) = x - y. Start at (x_0, y_0) = (0, 2). Step 1: slope = 0 - 2 = -2, so y_1 = 2 + 0.2(-2) = 1.6 at x = 0.2. Step 2: slope = 0.2 - 1.6 = -1.4, so y_2 = 1.6 + 0.2(-1.4) = 1.32. The estimate is 1.32."
          - problem: "For $y' = x y$ with $y(0) = 1$ and $h = 0.5$, estimate $y(1)$ using two Euler steps. Find the estimate."
            answer: "1.25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler rule: y_{n+1} = y_n + h f(x_n, y_n), with f(x,y) = x y. Start at (x_0, y_0) = (0, 1). Step 1: slope = 0(1) = 0, so y_1 = 1 + 0.5(0) = 1 at x = 0.5. Step 2: slope = 0.5(1) = 0.5, so y_2 = 1 + 0.5(0.5) = 1.25. The estimate is 1.25."
          - problem: "For $y' = 2x + 1$ with $y(0) = 0$ and $h = 1$, estimate $y(3)$ using three Euler steps. Find the estimate."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Euler rule: y_{n+1} = y_n + h f(x_n, y_n), with f(x,y) = 2x + 1. Start at (x_0, y_0) = (0, 0). Step 1: slope = 1, so y_1 = 0 + 1(1) = 1 at x = 1. Step 2: slope = 2(1) + 1 = 3, so y_2 = 1 + 1(3) = 4 at x = 2. Step 3: slope = 2(2) + 1 = 5, so y_3 = 4 + 1(5) = 9 at x = 3. The estimate is 9."
        constraints: "2-3 steps maximum; track (x_n, y_n) as a table; values chosen so no rounding is needed"
      - id: kp3
        name: Error behavior
        key_prerequisites: [slope-fields-equilibria]
        exemplars:
          - problem: "For $y' = y$, $y(0) = 1$, one Euler step with $h = 1$ gives $y(1) \\approx 2$, while the true value is $e \\approx 2.718$. Compute the signed error (true value minus Euler estimate), to three decimal places."
            answer: "$0.718$"
            solution_sketch: "$2.718 - 2 = 0.718$. The error is positive, so Euler underestimates: the solution is convex (its slope keeps increasing) and Euler follows the tangent line, which lies below the curve."
          - problem: "Euler's method has global error of order $h$. By roughly what factor does the global error shrink when the step size is halved?"
            answer: "$2$"
            solution_sketch: "Global error scales like $h$, so halving $h$ roughly halves the error - a factor of $2$."
          - problem: "For $y' = 2y$, $y(0) = 1$, one Euler step with $h = 1$ gives $y(1) \\approx 3$, while the true value is $e^{2} \\approx 7.389$. Compute the signed error (true value minus Euler estimate), to three decimal places."
            answer: "4.389"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Full object: $y' = 2y$, $y(0) = 1$, one step $h = 1$, exact $y(1) = e^{2}$. Euler-step rule: $y_1 = 1 + 1 \\cdot 2 = 3$. Exact-solution rule: $y(1) = e^{2} \\approx 7.389056$. Signed-error rule: true minus estimate is $7.389056 - 3 = 4.389056$. To three decimal places the signed error is 4.389."
          - problem: "For $y' = -y$, $y(0) = 1$, one Euler step with $h = 1$ gives $y(1) \\approx 0$, while the true value is $e^{-1} \\approx 0.368$. Compute the signed error (true value minus Euler estimate), to three decimal places."
            answer: "0.368"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Full object: $y' = -y$, $y(0) = 1$, one step $h = 1$, exact $y(1) = e^{-1}$. Euler-step rule: $y_1 = 1 + 1 \\cdot (-1) = 0$. Exact-solution rule: $y(1) = e^{-1} \\approx 0.367879$. Signed-error rule: true minus estimate is $0.367879 - 0 = 0.367879$. To three decimal places the signed error is 0.368."
          - problem: "For $y' = 2y$, $y(0) = 1$, estimate $y(1)$ using two Euler steps of size $h = 0.5$. The true value is $e^{2} \\approx 7.389$. Compute the signed error (true value minus your estimate), to three decimal places."
            answer: "3.389"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Full object: $y' = 2y$, $y(0) = 1$, two steps $h = 0.5$, exact $y(1) = e^{2}$. Euler-step rule: $y_1 = 1 + 0.5 \\cdot 2 = 2$. Euler-step rule: $y_2 = 2 + 0.5 \\cdot 4 = 4$. Exact-solution rule: $y(1) = e^{2} \\approx 7.389056$. Signed-error rule: true minus estimate is $7.389056 - 4 = 3.389056$. To three decimal places the signed error is 3.389."
          - problem: "For $y' = y$, $y(0) = 1$, estimate $y(1)$ using four Euler steps of size $h = 0.25$. The true value is $e \\approx 2.718$. Compute the signed error (true value minus your estimate), to three decimal places."
            answer: "0.277"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "Full object: $y' = y$, $y(0) = 1$, four steps $h = 0.25$, exact $y(1) = e$. Euler-step rule: $y_1 = 1 + 0.25 \\cdot 1 = 1.25$. Euler-step rule: $y_2 = 1.25 + 0.25 \\cdot 1.25 = 1.5625$. Euler-step rule: $y_3 = 1.5625 + 0.25 \\cdot 1.5625 = 1.953125$. Euler-step rule: $y_4 = 1.953125 + 0.25 \\cdot 1.953125 = 2.44140625$. Exact-solution rule: $y(1) = e \\approx 2.718282$. Signed-error rule: $2.718282 - 2.441406 = 0.276876$. To three decimal places the signed error is 0.277."
          - problem: "Euler's method has global error of order $h$. With step size $h = 0.4$, the global error at a fixed time is about $0.02$. Using first-order error scaling, find the global error with step size $h = 0.1$. Give the answer to 3 decimals."
            answer: "0.005"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "First-order scaling rule: the global error is proportional to $h$, so the error scales by the step ratio $0.1/0.4 = 0.25$. New-error rule: $0.02 \\cdot 0.25 = 0.005$. The global error with $h = 0.1$ is 0.005."
          - problem: "Euler's method has global error of order $h$. With step size $h = 0.1$, the global error at a fixed time is about $0.002$. Determine the step size that makes the global error about $0.0005$. Give the answer to 3 decimals."
            answer: "0.025"
            answer_contract: {"decimals": 3, "kind": "approx"}
            solution_sketch: "First-order scaling rule: the global error is proportional to $h$, so the step ratio equals the error ratio $0.0005/0.002 = 0.25$. Reverse-scaling rule: $h_{new} = 0.1 \\cdot 0.25 = 0.025$. The required step size is 0.025."
        constraints: "comparisons against a known exact solution, or first-order error scaling; the answer is a single number (an error value or a factor)"
    diagnostic_exemplar:
      problem: 'For $y'' = y$ with $y(0) = 1$, estimate $y(1)$ using two Euler steps of size $h = 0.5$, then report the signed error (the true value $e$ minus your estimate), to three decimal places.'
      answer: '0.468'
      solution_sketch: 'Two steps: $y_1 = 1 + 0.5(1) = 1.5$, then $y_2 = 1.5 + 0.5(1.5) = 2.25$. The true value is $e \approx 2.718$, so the error is $2.718 - 2.25 \approx 0.468$.'
    anki_seeds:
      - front: "Euler's method update rule?"
        back: '$y_{n+1} = y_n + h\,f(x_n, y_n)$, with $x_{n+1} = x_n + h$.'
        type: basic
      - front: "Order of the global error of Euler's method?"
        back: "First order: the error scales like h."
        type: basic

  - id: separation-of-variables
    name: Separation of Variables
    core: true
    difficulty: 0.60
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: ode-classification-verification
        weight: 0.5
        key: true
      - id: antiderivatives
        weight: 0.5
        key: true
      - id: integration-substitution
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: Recognizing separable equations
        key_prerequisites: [ode-classification-verification]
        exemplars:
          - problem: "The differential equation y' = x y + 3x is given. Give the right side as a product g(x) h(y) in factored form."
            answer: "x(y+3)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with the full right side x y + 3x. Step 1: factor the common factor x from both terms, x y + 3x = x(y+3). Step 2: read the factorization as g(x)=x and h(y)=y+3. The factored right side is x(y+3)."
          - problem: "Four right sides are shown. Which expression cannot be written as a product of a function of x and a function of y? Select the expression."
            answer: "x+y"
            answer_contract: {"kind": "label", "options": [["x+y"], ["x(y+1)"], ["e^x e^y"], ["x^2 y"]]}
            solution_sketch: "The four expressions are x+y, x(y+1), e^x e^y, and x^2 y. A right side is separable when it factors as g(x)h(y). The option x(y+1) is already a product, so it is separable. The option e^x e^y is a product of a function of x and a function of y, so it is separable. The option x^2 y is also a product, so it is separable. The expression that cannot be written as g(x)h(y) is x+y."
          - problem: "The differential equation y' = e^x e^y + 3 e^x is given. Give the right side as a product g(x) h(y) in factored form."
            answer: "e^x(e^y+3)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with the full right side e^x e^y + 3 e^x. Step 1: factor the common factor e^x from both terms, e^x e^y + 3 e^x = e^x(e^y + 3). Step 2: read g(x) = e^x and h(y) = e^y + 3. The factored right side is e^x(e^y+3)."
          - problem: "A list of right sides is shown. Which expression fails to factor as g(x) h(y)? Select the expression."
            answer: "x^2 + y^2"
            answer_contract: {"kind": "label", "options": [["x^2 + y^2"], ["x^2 y^2"], ["x^2 e^y"], ["(x^2+1) y"]]}
            solution_sketch: "The four expressions are x^2 + y^2, x^2 y^2, x^2 e^y, and (x^2+1) y. A right side is separable when it can be written as g(x)h(y). The option x^2 y^2 is already a product, so it is separable. The option x^2 e^y is a product of a function of x and a function of y, so it is separable. The option (x^2+1) y is also a product, so it is separable. The sum x^2 + y^2 does not factor as g(x)h(y)."
          - problem: "The differential equation y' = x^2 y + x^2 is given. Give the right side as a product g(x) h(y) in factored form."
            answer: "x^2(y+1)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with the full right side x^2 y + x^2. Step 1: factor the common factor x^2 from both terms, x^2 y + x^2 = x^2(y+1). Step 2: read g(x)=x^2 and h(y)=y+1. The factored right side is x^2(y+1)."
          - problem: "The differential equation y' = y sin(x) + sin(x) is given. Give the right side as a product g(x) h(y) in factored form."
            answer: "sin(x)(y+1)"
            answer_contract: {"kind": "function", "vars": ["x", "y"]}
            solution_sketch: "Start with the full right side y sin(x) + sin(x). Step 1: factor the common factor sin(x) from both terms, y sin(x) + sin(x) = sin(x)(y+1). Step 2: read g(x)=sin(x) and h(y)=y+1. The factored right side is sin(x)(y+1)."
        constraints: "right sides that factor (or fail to factor) as g(x)h(y); include sums that only look separable"
      - id: kp2
        name: Separate and integrate
        key_prerequisites: [antiderivatives]
        exemplars:
          - problem: "Separate and integrate dy/dx = x/y. After absorbing constants, the solution is written y^2 = (right side). Find the right side in terms of x and C."
            answer: "x^2+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Write the equation in separated form y dy = x dx. Integrate both sides with the power rule: y^2/2 = x^2/2 + C0. Multiply by 2 and rename 2C0 as C to get y^2 = x^2 + C. The right side is x^2+C."
          - problem: "Separate and integrate y' = 3x^2 y^2. After rearranging, the solution has the form -1/y = (right side). Find the right side in terms of x and C."
            answer: "x^3+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Separate to y^(-2)dy = 3x^2 dx. Integrate with the power rule: -1/y = x^3 + C. The right side is x^3+C."
          - problem: "Separate and integrate dy/dx = 2x/y^2. After absorbing constants, the solution is written y^3 = (right side). Find the right side in terms of x and C."
            answer: "3x^2+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Separate to y^2 dy = 2x dx. Integrate with the power rule: y^3/3 = x^2 + C0. Multiply by 3 and rename 3C0 as C to get y^3 = 3x^2 + C. The right side is 3x^2+C."
          - problem: "Separate and integrate dy/dx = 4x^3 y^2. After rearranging, the solution has the form -1/y = (right side). Find the right side in terms of x and C."
            answer: "x^4+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Separate to y^(-2)dy = 4x^3 dx. Integrate with the power rule: -1/y = x^4 + C. The right side is x^4+C."
          - problem: "Separate and integrate dy/dx = x^2/y. After absorbing constants, the solution is written 3y^2 = (right side). Find the right side in terms of x and C."
            answer: "2x^3+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Separate to y dy = x^2 dx. Integrate with the power rule: y^2/2 = x^3/3 + C0. Multiply by 6 and rename 6C0 as C to get 3y^2 = 2x^3 + C. The right side is 2x^3+C."
          - problem: "Separate and integrate dy/dx = 5x^3 y^2. After multiplying by 4, the solution has the form -4/y = (right side). Find the right side in terms of x and C."
            answer: "5x^4+C"
            answer_contract: {"kind": "function", "up_to_constant": true, "vars": ["x"]}
            solution_sketch: "Separate to y^(-2)dy = 5x^3 dx. Integrate with the power rule: -1/y = (5/4)x^4 + C0. Multiply by 4 and rename 4C0 as C to get -4/y = 5x^4 + C. The right side is 5x^4+C."
        constraints: "antiderivatives are powers only; general solutions carry an explicit C, absorbed constants renamed"
      - id: kp3
        name: Logarithmic integrations and absorbed constants
        key_prerequisites: [integration-substitution]
        exemplars:
          - problem: "Find the general solution of $(1 + x^2)\\,y' = xy$."
            answer: '$y = C\sqrt{1 + x^2}$'
            solution_sketch: '$\frac{dy}{y} = \frac{x}{1+x^2}dx$; substitution gives $\ln|y| = \frac{1}{2}\ln(1+x^2) + C$, so $y = C\sqrt{1+x^2}$.'
          - problem: "Solve $\\frac{dy}{dx} = \\frac{3y}{x}$ for $x > 0$ with the initial condition $y(1) = 5$. Find the particular solution $y(x)$."
            answer: "5x^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: $\\frac{dy}{y} = \\frac{3\\,dx}{x}$. Integrate both sides: $\\ln|y| = 3\\ln x + C$. Exponentiate and rename $e^C$ as $C$: $y = Cx^3$. Apply $y(1) = 5$: $C \\cdot 1 = 5$, so $C = 5$. The particular solution is 5x^3."
          - problem: "Solve $\\frac{dy}{dx} = 4xy$ with the initial condition $y(0) = 7$. Find the particular solution $y(x)$."
            answer: "7e^(2x^2)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: $\\frac{dy}{y} = 4x\\,dx$. Integrate both sides: $\\ln|y| = 2x^2 + C$. Exponentiate and rename $e^C$ as $C$: $y = Ce^{2x^2}$. Apply $y(0) = 7$: $C = 7$. The particular solution is 7e^(2x^2)."
          - problem: "Solve $\\frac{dy}{dx} = \\frac{2y}{x+1}$ for $x > -1$ with the initial condition $y(0) = 9$. Find the particular solution $y(x)$."
            answer: "9(x+1)^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: $\\frac{dy}{y} = \\frac{2\\,dx}{x+1}$. Integrate by substitution $u = x+1$: $\\ln|y| = 2\\ln(x+1) + C$. Exponentiate and rename $e^C$ as $C$: $y = C(x+1)^2$. Apply $y(0) = 9$: $C = 9$. The particular solution is 9(x+1)^2."
          - problem: "Solve $\\frac{dy}{dx} = \\frac{y}{2x+1}$ for $x > -\\frac{1}{2}$ with the initial condition $y(0) = 8$. Find the particular solution $y(x)$."
            answer: "8sqrt(2x+1)"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Separate variables: $\\frac{dy}{y} = \\frac{dx}{2x+1}$. Integrate by substitution $u = 2x+1$: $\\ln|y| = \\frac{1}{2}\\ln(2x+1) + C$. Exponentiate and rename $e^C$ as $C$: $y = C\\sqrt{2x+1}$. Apply $y(0) = 8$: $C\\sqrt{1} = 8$, so $C = 8$. The particular solution is 8sqrt(2x+1)."
          - problem: "A bacteria population grows at a rate proportional to its size: $\\frac{dP}{dt} = 3P$, with initial size $P(0) = 2$ (in thousands). Find the population $P(t)$ as a function of $t$."
            answer: "2e^(3t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Separate variables: $\\frac{dP}{P} = 3\\,dt$. Integrate both sides: $\\ln|P| = 3t + C$. Exponentiate and rename $e^C$ as $C$: $P = Ce^{3t}$. Apply $P(0) = 2$: $C = 2$. The population is 2e^(3t)."
        constraints: "integrations produce logarithms; require exponentiating and renaming e^C as C"
    diagnostic_exemplar:
      problem: "Find the general solution of $y' = -2xy$."
      answer: "$y = Ce^{-x^2}$"
      answer_contract: {kind: none}
      solution_sketch: '$\frac{dy}{y} = -2x\,dx$ gives $\ln|y| = -x^2 + C$; exponentiate and rename the constant.'
    anki_seeds:
      - front: "A first-order ODE is separable when it can be written as..."
        back: "dy/dx = g(x)h(y): all y-dependence on one side, all x-dependence on the other."
        type: basic
      - front: 'After integrating $\frac{dy}{y} = k\,dx$, the general solution is...'
        back: '$y = Ce^{kx}$ (exponentiate $\ln|y| = kx + C$ and rename the constant).'
        type: basic

