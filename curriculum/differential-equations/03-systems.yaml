          - problem: 'Two species of fish compete for food. Their populations $x$ and $y$ (in thousands) satisfy $x'' = x(8 - x - 2y)$ and $y'' = y(5 - x - y)$. Use linearization at the equilibrium where both species are present. Classify it.'
            answer: 'saddle'
