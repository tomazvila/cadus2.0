            solution_sketch: 'Solving $x + 2y = 8$ and $x + y = 5$ gives the equilibrium $(2, 3)$. The Jacobian $\begin{pmatrix} 8 - 2x - 2y & -2x \\ -y & 5 - x - 2y \end{pmatrix}$ equals $\begin{pmatrix} -2 & -4 \\ -3 & -3 \end{pmatrix}$ there, with trace $-5$ and determinant $-6$. The negative determinant gives a saddle, so coexistence is unstable.'
          - problem: 'For the predator-prey system $x'' = x(3 - y)$, $y'' = y(x - 5)$ (prey $x$, predators $y$), use linearization at the coexistence equilibrium. Find the determinant of the Jacobian matrix there.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coexistence equilibrium is $(5, 3)$. The Jacobian $\begin{pmatrix} 3 - y & -x \\ y & x - 5 \end{pmatrix}$ equals $\begin{pmatrix} 0 & -5 \\ 3 & 0 \end{pmatrix}$ there, so the determinant is $0 \cdot 0 - (-5)(3) = 15$. With trace $0$ the linearization is a center, and the populations cycle near coexistence.'
