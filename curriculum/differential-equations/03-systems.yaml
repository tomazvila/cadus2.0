          - problem: 'Prey $x$ and predators $y$ (in hundreds) satisfy $x'' = x(0.9 - 0.03y)$ and $y'' = y(0.02x - 0.4)$, with time in months. The linearization at the equilibrium where both species are present has eigenvalues $\pm\omega i$. How many months does one cycle of this linearization take, to one decimal place?'
