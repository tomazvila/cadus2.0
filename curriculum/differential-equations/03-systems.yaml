unit: systems
course: differential-equations
module: "Systems of Differential Equations"
topics:
  - id: systems-matrix-form
    name: Systems in Matrix Form
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: matrix-operations
        weight: 0.6
        key: true
      - id: homogeneous-constant-coefficients
        weight: 0.3
        key: false
      - id: ode-classification-verification
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: Writing systems in matrix form
        key_prerequisites: [matrix-operations]
        exemplars:
          - problem: 'Write the system $x'' = 3x + 4y$, $y'' = 2x + y$ in matrix form.'
            answer: '$\mathbf{X}'' = \begin{pmatrix} 3 & 4 \\ 2 & 1 \end{pmatrix}\mathbf{X}$ with $\mathbf{X} = \binom{x}{y}$'
          - problem: 'Write the system $x'' = -y$, $y'' = x + 2y$ in matrix form.'
            answer: '$\mathbf{X}'' = \begin{pmatrix} 0 & -1 \\ 1 & 2 \end{pmatrix}\mathbf{X}$'
          - problem: 'Write the system $x'' = x - 3y$, $y'' = 4y$ in matrix form.'
            answer: '$\mathbf{X}'' = \begin{pmatrix} 1 & -3 \\ 0 & 4 \end{pmatrix}\mathbf{X}$'
            solution_sketch: 'A missing variable in an equation means a zero entry in that row.'
        constraints: "2x2 homogeneous systems with integer coefficients; zero entries appear when a variable is absent"
      - id: kp2
        name: Verifying vector solutions
        key_prerequisites: [matrix-operations]
        exemplars:
          - problem: 'Verify that $\mathbf{X} = e^{5t}\binom{2}{1}$ solves $\mathbf{X}'' = \begin{pmatrix} 3 & 4 \\ 2 & 1 \end{pmatrix}\mathbf{X}$.'
            answer: 'Yes: $A\binom{2}{1} = \binom{10}{5} = 5\binom{2}{1}$, so $A\mathbf{X} = 5\mathbf{X} = \mathbf{X}''$.'
            solution_sketch: '$\mathbf{X}'' = 5e^{5t}\binom{2}{1}$, and multiplying out $A\binom{2}{1}$ gives $\binom{6+4}{4+1} = 5\binom{2}{1}$: $\binom{2}{1}$ is an eigenvector with eigenvalue $5$.'
          - problem: 'Verify that $\mathbf{X} = e^{-t}\binom{1}{-1}$ solves $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X}$.'
            answer: 'Yes: $A\binom{1}{-1} = \binom{-1}{1} = -\binom{1}{-1}$, so $A\mathbf{X} = -\mathbf{X} = \mathbf{X}''$.'
          - problem: 'Show that $\mathbf{X} = e^{2t}\binom{1}{1}$ does NOT solve $\mathbf{X}'' = \begin{pmatrix} 3 & 4 \\ 2 & 1 \end{pmatrix}\mathbf{X}$.'
            answer: '$A\binom{1}{1} = \binom{7}{3}$, which is not $2\binom{1}{1}$, so $A\mathbf{X} \neq \mathbf{X}''$.'
            solution_sketch: 'The candidate works only if $\binom{1}{1}$ is an eigenvector with eigenvalue $2$; it is not.'
        constraints: "2x2 integer matrices; verification reduces to one matrix-vector product"
    diagnostic_exemplar:
      problem: 'Write the system $x'' = 2x + y$, $y'' = 4x + 2y$ in matrix form, and verify that $\mathbf{X} = e^{4t}\binom{1}{2}$ is a solution.'
      answer: '$\mathbf{X}'' = \begin{pmatrix} 2 & 1 \\ 4 & 2 \end{pmatrix}\mathbf{X}$; and since $A\binom{1}{2} = \binom{4}{8} = 4\binom{1}{2}$, we get $A\mathbf{X} = 4\mathbf{X} = \mathbf{X}''$, so it is a solution.'
      solution_sketch: 'The coefficient matrix has rows $(2, 1)$ and $(4, 2)$; the vector $\binom{1}{2}$ is an eigenvector with eigenvalue $4$, which matches the exponential rate.'
    anki_seeds:
      - front: 'Matrix form of a linear system of ODEs?'
        back: '$\mathbf{X}'' = A\mathbf{X}$, where $\mathbf{X}$ stacks the unknown functions and $A$ holds the coefficients.'
        type: basic
      - front: 'To verify $\mathbf{X}(t) = e^{\lambda t}\mathbf{v}$ solves $\mathbf{X}'' = A\mathbf{X}$, check...'
        back: '$A\mathbf{v} = \lambda\mathbf{v}$ (one matrix-vector product).'
        type: basic

  - id: systems-elimination-method
    name: Solving Systems by Elimination
    core: false                # alternative solution method; terminal
    difficulty: 0.74
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: homogeneous-constant-coefficients
        weight: 0.6
        key: true
      - id: systems-matrix-form
        weight: 0.3
        key: false
      - id: systems-substitution
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: Reducing to one second-order equation
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: 'Eliminate $y$ from $x'' = y$, $y'' = -2x - 3y$ to get a second-order equation for $x$.'
            answer: '$x'''' + 3x'' + 2x = 0$'
            solution_sketch: '$y = x''$, so $x'''' = y'' = -2x - 3x''$.'
          - problem: 'Eliminate $y$ from $x'' = 3x + 4y$, $y'' = 2x + y$ to get a second-order equation for $x$.'
            answer: '$x'''' - 4x'' - 5x = 0$'
            solution_sketch: '$y = \frac{x'' - 3x}{4}$; then $\frac{x'''' - 3x''}{4} = 2x + \frac{x'' - 3x}{4}$, which clears to $x'''' - 4x'' - 5x = 0$.'
        constraints: "2x2 constant-coefficient systems; the reduced equation has integer characteristic roots"
      - id: kp2
        name: Completing the solution
        key_prerequisites: [homogeneous-constant-coefficients]
        exemplars:
          - problem: 'Solve the system $x'' = y$, $y'' = 6x - y$ by elimination.'
            answer: '$x = c_1 e^{2t} + c_2 e^{-3t}$, $y = 2c_1 e^{2t} - 3c_2 e^{-3t}$'
            solution_sketch: '$x'''' = y'' = 6x - x''$ gives $x'''' + x'' - 6x = 0$ with roots $2, -3$; then $y = x''$.'
          - problem: 'Solve the system $x'' = x + y$, $y'' = 4x + y$ by elimination.'
            answer: '$x = c_1 e^{3t} + c_2 e^{-t}$, $y = 2c_1 e^{3t} - 2c_2 e^{-t}$'
            solution_sketch: '$y = x'' - x$ leads to $x'''' - 2x'' - 3x = 0$ with roots $3, -1$; back-substitute into $y = x'' - x$.'
          - problem: 'Solve $x'' = y$, $y'' = 4x$ with $x(0) = 1$, $y(0) = 0$ by elimination.'
            answer: '$x = \dfrac{1}{2}e^{2t} + \dfrac{1}{2}e^{-2t}$, $y = e^{2t} - e^{-2t}$'
            solution_sketch: '$x'''' = 4x$ gives $x = c_1 e^{2t} + c_2 e^{-2t}$; $y = x''$, and the initial conditions force $c_1 = c_2 = \frac{1}{2}$.'
        constraints: "back-substitution recovers the second variable exactly; integer characteristic roots"
    diagnostic_exemplar:
      problem: 'Solve the system $x'' = y$, $y'' = 2x + y$ by elimination, giving both $x(t)$ and $y(t)$.'
      answer: '$x = c_1 e^{2t} + c_2 e^{-t}$, $\;y = 2c_1 e^{2t} - c_2 e^{-t}$'
      solution_sketch: 'Differentiating the first equation, $x'''' = y'' = 2x + x''$, so $x'''' - x'' - 2x = 0$ with roots $2$ and $-1$. Then $y = x''$.'
    anki_seeds:
      - front: 'Elimination method for a 2x2 linear system of ODEs?'
        back: 'Differentiate one equation, substitute the other to get a single second-order ODE in one variable; recover the second variable by back-substitution.'
        type: basic
      - front: "Elimination on a 2x2 first-order system produces what?"
        back: "A single second-order ODE in one unknown; solve it, then back-substitute to recover the other unknown."
        type: basic

  - id: systems-superposition-wronskian
    name: Fundamental Sets and the Wronskian
    core: true
    difficulty: 0.76
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: systems-matrix-form
        weight: 0.6
        key: true
      - id: determinants
        weight: 0.4
        key: true
      - id: homogeneous-constant-coefficients
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: Superposition
        key_prerequisites: [systems-matrix-form]
        exemplars:
          - problem: '$\mathbf{X}_1 = e^{3t}\binom{1}{1}$ and $\mathbf{X}_2 = e^{-t}\binom{1}{-1}$ solve $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X}$. Is $2\mathbf{X}_1 - \mathbf{X}_2$ also a solution?'
            answer: 'Yes: any linear combination of solutions of $\mathbf{X}'' = A\mathbf{X}$ is a solution (superposition).'
            solution_sketch: '$(2\mathbf{X}_1 - \mathbf{X}_2)'' = 2A\mathbf{X}_1 - A\mathbf{X}_2 = A(2\mathbf{X}_1 - \mathbf{X}_2)$.'
          - problem: 'Does superposition hold for the nonhomogeneous system $\mathbf{X}'' = A\mathbf{X} + \mathbf{b}$ with $\mathbf{b} \neq \mathbf{0}$?'
            answer: 'No: if $\mathbf{X}_1, \mathbf{X}_2$ are solutions, $(\mathbf{X}_1 + \mathbf{X}_2)'' = A(\mathbf{X}_1 + \mathbf{X}_2) + 2\mathbf{b}$, not $+\,\mathbf{b}$.'
            solution_sketch: 'The forcing term doubles; only the homogeneous system has a vector space of solutions.'
        constraints: "verification by substituting the combination into X' = AX; 2x2 systems"
      - id: kp2
        name: The Wronskian and fundamental sets
        key_prerequisites: [systems-matrix-form, determinants]
        exemplars:
          - problem: 'Compute the Wronskian of $\mathbf{X}_1 = e^{3t}\binom{1}{1}$ and $\mathbf{X}_2 = e^{-t}\binom{1}{-1}$, and decide whether they form a fundamental set.'
            answer: '$W = \det\begin{pmatrix} e^{3t} & e^{-t} \\ e^{3t} & -e^{-t} \end{pmatrix} = -2e^{2t} \neq 0$: yes, a fundamental set.'
            solution_sketch: '$W = -e^{2t} - e^{2t} = -2e^{2t}$, never zero.'
          - problem: 'Are $\mathbf{X}_1 = e^{2t}\binom{1}{2}$ and $\mathbf{X}_2 = e^{2t}\binom{2}{4}$ a fundamental set for a 2x2 system?'
            answer: 'No: $\mathbf{X}_2 = 2\mathbf{X}_1$, so $W = 0$ and they are linearly dependent.'
          - problem: 'Two solutions satisfy $\mathbf{X}_1(0) = \binom{1}{0}$ and $\mathbf{X}_2(0) = \binom{1}{1}$. Compute $W(0)$ and conclude.'
            answer: '$W(0) = \det\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix} = 1 \neq 0$: they form a fundamental set.'
            solution_sketch: 'The Wronskian of solutions is either identically zero or never zero, so one point decides.'
        constraints: "Wronskian = determinant of the matrix whose columns are the solutions; 2x2 only"
    diagnostic_exemplar:
      problem: 'Compute the Wronskian of $\mathbf{X}_1 = e^{t}\binom{1}{0}$ and $\mathbf{X}_2 = e^{2t}\binom{1}{1}$. Fundamental set?'
      answer: '$W = \det\begin{pmatrix} e^{t} & e^{2t} \\ 0 & e^{2t} \end{pmatrix} = e^{3t} \neq 0$: yes.'
      solution_sketch: 'For vector solutions the Wronskian is the determinant of the matrix whose columns are the solutions; here the first has zero second entry, so the matrix is triangular and $W = e^{t}\cdot e^{2t}$. Nonvanishing $W$ is exactly the fundamental-set criterion.'
    anki_seeds:
      - front: 'General solution of a 2x2 system $\mathbf{X}'' = A\mathbf{X}$ from a fundamental set $\mathbf{X}_1, \mathbf{X}_2$?'
        back: '$\mathbf{X} = c_1\mathbf{X}_1 + c_2\mathbf{X}_2$'
        type: basic
      - front: 'Wronskian of vector solutions $\mathbf{X}_1, \mathbf{X}_2$?'
        back: 'The determinant of the matrix with $\mathbf{X}_1, \mathbf{X}_2$ as columns; it is either identically zero or never zero.'
        type: basic

  - id: higher-order-to-systems
    name: Converting Higher-Order Equations to Systems
    core: false                # conversion technique; terminal
    difficulty: 0.76
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: systems-matrix-form
        weight: 0.6
        key: true
      - id: homogeneous-constant-coefficients
        weight: 0.4
        key: true
      - id: eigenvalues-eigenvectors
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: The companion construction
        key_prerequisites: [systems-matrix-form, homogeneous-constant-coefficients]
        exemplars:
          - problem: 'Convert $y'''' + 3y'' + 2y = 0$ into a first-order system using $x_1 = y$, $x_2 = y''$.'
            answer: '$x_1'' = x_2$, $x_2'' = -2x_1 - 3x_2$; in matrix form $\mathbf{X}'' = \begin{pmatrix} 0 & 1 \\ -2 & -3 \end{pmatrix}\mathbf{X}$.'
          - problem: 'Convert $y'''' - 5y = 0$ into a first-order system.'
            answer: '$\mathbf{X}'' = \begin{pmatrix} 0 & 1 \\ 5 & 0 \end{pmatrix}\mathbf{X}$ with $x_1 = y$, $x_2 = y''$.'
            solution_sketch: '$x_2'' = y'''' = 5y = 5x_1$.'
          - problem: 'Convert $y'''''' + 2y'''' - y'' + 4y = 0$ into a first-order system using $x_1 = y$, $x_2 = y''$, $x_3 = y''''$.'
            answer: '$\mathbf{X}'' = \begin{pmatrix} 0 & 1 & 0 \\ 0 & 0 & 1 \\ -4 & 1 & -2 \end{pmatrix}\mathbf{X}$'
            solution_sketch: '$x_3'' = y'''''' = -4y + y'' - 2y'''' = -4x_1 + x_2 - 2x_3$.'
        constraints: "constant-coefficient equations of order 2 or 3; companion matrix rows shift, last row holds negated coefficients"
      - id: kp2
        name: Eigenvalues are the characteristic roots
        key_prerequisites: [homogeneous-constant-coefficients, eigenvalues-eigenvectors]
        exemplars:
          - problem: 'Find the eigenvalues of the companion matrix $\begin{pmatrix} 0 & 1 \\ -2 & -3 \end{pmatrix}$ and compare with the characteristic roots of $y'''' + 3y'' + 2y = 0$.'
            answer: '$\lambda = -1, -2$: the same as the characteristic roots of the scalar equation.'
            solution_sketch: '$\det(A - \lambda I) = \lambda^2 + 3\lambda + 2 = (\lambda+1)(\lambda+2)$, exactly the characteristic polynomial.'
          - problem: 'Write the companion matrix of $y'''' - y'' - 6y = 0$ and find its eigenvalues.'
            answer: '$\begin{pmatrix} 0 & 1 \\ 6 & 1 \end{pmatrix}$ with $\lambda = 3, -2$.'
            solution_sketch: '$\det(A - \lambda I) = \lambda^2 - \lambda - 6 = (\lambda - 3)(\lambda + 2)$.'
        constraints: "second-order constant-coefficient equations with integer roots; companion matrix always [[0,1],[-c,-b]]"
    diagnostic_exemplar:
      problem: 'Convert $y'''' + 4y'' - 5y = 0$ into a first-order system in matrix form, and find the eigenvalues of its companion matrix.'
      answer: '$\mathbf{X}'' = \begin{pmatrix} 0 & 1 \\ 5 & -4 \end{pmatrix}\mathbf{X}$ with $x_1 = y$, $x_2 = y''$; eigenvalues $\lambda = 1$ and $\lambda = -5$ — exactly the characteristic roots of the scalar equation.'
      solution_sketch: '$x_1'' = x_2$ and $x_2'' = y'''' = 5y - 4y'' = 5x_1 - 4x_2$. Then $\det(A - \lambda I) = \lambda^2 + 4\lambda - 5 = (\lambda - 1)(\lambda + 5)$.'
    anki_seeds:
      - front: "Converting y'' + by' + cy = 0 to a system: with x_1 = y, x_2 = y', the matrix is..."
        back: "[[0, 1], [-c, -b]] (the companion matrix; its eigenvalues are the characteristic roots)."
        type: basic
      - front: "Converting $y'' + py' + qy = 0$ to a first-order system: what are the state variables?"
        back: "$x_1 = y$ and $x_2 = y'$, giving $x_1' = x_2$ and $x_2' = -qx_1 - px_2$."
        type: basic

  - id: linear-systems-eigenvalues
    name: Linear Systems via Eigenvalues
    core: true
    difficulty: 0.80
    drill: false
    answer_kind: multi-step
    expected_time_secs: 300
    prerequisites:
      - id: eigenvalues-eigenvectors
        weight: 0.7
        key: true
      - id: systems-matrix-form
        weight: 0.5
        key: true
      - id: systems-superposition-wronskian
        weight: 0.3
        key: false
      - id: homogeneous-constant-coefficients
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Eigenpairs give solutions
        key_prerequisites: [eigenvalues-eigenvectors, systems-matrix-form]
        exemplars:
          - problem: 'Given that $\lambda = 5$ with eigenvector $\binom{2}{1}$ is an eigenpair of $A = \begin{pmatrix} 3 & 4 \\ 2 & 1 \end{pmatrix}$, write one solution of $\mathbf{X}'' = A\mathbf{X}$.'
            answer: '$\mathbf{X} = e^{5t}\binom{2}{1}$'
            solution_sketch: 'For any eigenpair $(\lambda, \mathbf{v})$, $\mathbf{X} = e^{\lambda t}\mathbf{v}$ satisfies $\mathbf{X}'' = \lambda\mathbf{X} = A\mathbf{X}$.'
          - problem: 'Find the eigenvalues and eigenvectors of $\begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}$.'
            answer: '$\lambda = 3$ with $\binom{1}{1}$; $\lambda = -1$ with $\binom{1}{-1}$'
            solution_sketch: '$\det(A - \lambda I) = \lambda^2 - 2\lambda - 3 = (\lambda - 3)(\lambda + 1)$; solve $(A - \lambda I)\mathbf{v} = 0$ for each root.'
        constraints: "2x2 matrices with integer eigenvalues and integer eigenvectors"
      - id: kp2
        name: General solutions with distinct real eigenvalues
        key_prerequisites: [eigenvalues-eigenvectors, systems-matrix-form]
        exemplars:
          - problem: 'Find the general solution of $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X}$.'
            answer: '$\mathbf{X} = c_1 e^{3t}\binom{1}{1} + c_2 e^{-t}\binom{1}{-1}$'
            solution_sketch: '$\det(A - \lambda I) = \lambda^2 - 2\lambda - 3 = (\lambda - 3)(\lambda + 1)$; eigenvectors $\binom{1}{1}$ for $3$ and $\binom{1}{-1}$ for $-1$.'
          - problem: 'Find the general solution of $\mathbf{X}'' = \begin{pmatrix} 2 & 1 \\ 0 & 3 \end{pmatrix}\mathbf{X}$.'
            answer: '$\mathbf{X} = c_1 e^{2t}\binom{1}{0} + c_2 e^{3t}\binom{1}{1}$'
            solution_sketch: 'Triangular, so $\lambda = 2, 3$. For $\lambda = 3$: $(A - 3I)\mathbf{v} = 0$ gives $-v_1 + v_2 = 0$, so $\mathbf{v} = \binom{1}{1}$.'
        constraints: "2x2 matrices with integer eigenvalues and integer eigenvectors; general solutions carry c_1, c_2"
      - id: kp3
        name: Initial value problems
        key_prerequisites: [eigenvalues-eigenvectors, systems-matrix-form]
        exemplars:
          - problem: 'Solve $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X}$ with $\mathbf{X}(0) = \binom{3}{1}$.'
            answer: '$\mathbf{X} = 2e^{3t}\binom{1}{1} + e^{-t}\binom{1}{-1}$'
            solution_sketch: 'Solve $c_1 + c_2 = 3$, $c_1 - c_2 = 1$: $c_1 = 2$, $c_2 = 1$.'
          - problem: 'Solve $\mathbf{X}'' = \begin{pmatrix} 4 & 2 \\ 1 & 3 \end{pmatrix}\mathbf{X}$ with $\mathbf{X}(0) = \binom{1}{2}$.'
            answer: '$\mathbf{X} = e^{5t}\binom{2}{1} - e^{2t}\binom{1}{-1}$'
            solution_sketch: 'Eigenpairs $(5, \binom{2}{1})$ and $(2, \binom{1}{-1})$; $2c_1 + c_2 = 1$, $c_1 - c_2 = 2$ give $c_1 = 1$, $c_2 = -1$.'
        constraints: "initial conditions solvable by a 2x2 linear system with integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $\mathbf{X}'' = \begin{pmatrix} 4 & 2 \\ 1 & 3 \end{pmatrix}\mathbf{X}$ with $\mathbf{X}(0) = \binom{4}{-1}$.'
      answer: '$\mathbf{X} = e^{5t}\binom{2}{1} + 2e^{2t}\binom{1}{-1}$'
      solution_sketch: 'The eigenpairs are $\lambda = 5$ with $\binom{2}{1}$ and $\lambda = 2$ with $\binom{1}{-1}$. Then $c_1\binom{2}{1} + c_2\binom{1}{-1} = \binom{4}{-1}$ gives $c_1 = 1$, $c_2 = 2$.'
    anki_seeds:
      - front: 'Solution of $\mathbf{X}'' = A\mathbf{X}$ built from an eigenpair $(\lambda, \mathbf{v})$?'
        back: '$\mathbf{X} = e^{\lambda t}\mathbf{v}$'
        type: basic
      - front: 'Eigenvalue method for $\mathbf{X}'' = A\mathbf{X}$ (distinct real case): the steps?'
        back: 'Find eigenvalues from $\det(A - \lambda I) = 0$, an eigenvector for each, then combine: $\mathbf{X} = c_1 e^{\lambda_1 t}\mathbf{v}_1 + c_2 e^{\lambda_2 t}\mathbf{v}_2$.'
        type: basic

  - id: equilibrium-classification-eigenvalues
    name: Classifying Equilibria from Eigenvalues
    core: false                # qualitative-analysis branch; terminal
    difficulty: 0.79
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: linear-systems-eigenvalues
        weight: 0.7
        key: true
      - id: slope-fields-equilibria
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Equilibria of linear systems
        key_prerequisites: [linear-systems-eigenvalues]
        exemplars:
          - problem: 'Why is $\mathbf{X}(t) \equiv \mathbf{0}$ always an equilibrium solution of $\mathbf{X}'' = A\mathbf{X}$?'
            answer: 'Because $A\mathbf{0} = \mathbf{0}$: the constant zero function has zero derivative and satisfies the system.'
          - problem: 'Show that the origin is the only equilibrium of $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X}$.'
            answer: '$\det A = 1 - 4 = -3 \neq 0$, so $A\mathbf{X} = \mathbf{0}$ has only the solution $\mathbf{X} = \mathbf{0}$.'
            solution_sketch: 'Equilibria are the solutions of $A\mathbf{X} = \mathbf{0}$; an invertible $A$ admits only the origin.'
        constraints: "equilibria found by solving AX = 0; det A nonzero in all exemplars"
      - id: kp2
        name: Classification from eigenvalues
        key_prerequisites: [linear-systems-eigenvalues]
        exemplars:
          - problem: 'A $2\times 2$ linear system has eigenvalues $\lambda = -2$ and $\lambda = -5$. Classify the origin.'
            answer: 'Stable node (sink): both eigenvalues real and negative; asymptotically stable.'
          - problem: 'Classify the origin when $\lambda = 3$ and $\lambda = -1$.'
            answer: 'Saddle point: real eigenvalues of opposite sign; unstable.'
          - problem: 'Classify the origin when $\lambda = -1 \pm 3i$.'
            answer: 'Stable spiral: complex eigenvalues with negative real part; trajectories spiral inward.'
        constraints: "cover node/saddle/spiral; always state both the type and the stability verdict"
      - id: kp3
        name: The remaining cases
        key_prerequisites: [linear-systems-eigenvalues]
        exemplars:
          - problem: 'Classify the origin when $\lambda = 2$ and $\lambda = 5$.'
            answer: 'Unstable node (source): both eigenvalues real and positive; all trajectories leave the origin.'
          - problem: 'Classify the origin when $\lambda = \pm 4i$.'
            answer: 'Center: purely imaginary eigenvalues; closed orbits, stable but not asymptotically stable.'
          - problem: 'Classify the origin when $\lambda = 2 \pm i$.'
            answer: 'Unstable spiral: complex eigenvalues with positive real part; trajectories spiral outward.'
        constraints: "cover source/center/unstable spiral; stability verdict required each time"
    diagnostic_exemplar:
      problem: 'A $2 \times 2$ linear system $\mathbf{X}'' = A\mathbf{X}$ has eigenvalues $\lambda = 2 \pm 3i$. Classify the origin, state its stability, and explain why it is the only equilibrium.'
      answer: 'Unstable spiral: the eigenvalues are complex with positive real part, so trajectories spiral outward and the origin is unstable. Since neither eigenvalue is $0$, $\det A \neq 0$, so $A\mathbf{X} = \mathbf{0}$ has only the solution $\mathbf{X} = \mathbf{0}$ — the origin is the only equilibrium.'
      solution_sketch: '$\det A$ is the product of the eigenvalues, $(2+3i)(2-3i) = 13 \neq 0$.'
    anki_seeds:
      - front: 'Phase portrait when both eigenvalues are real and negative?'
        back: 'Stable node (sink): all trajectories approach the origin.'
        type: basic
      - front: 'Phase portrait for real eigenvalues of opposite sign?'
        back: 'Saddle: unstable, with one attracting and one repelling eigendirection.'
        type: basic
      - front: 'Stability for complex eigenvalues $\alpha \pm \beta i$?'
        back: 'Spiral in if $\alpha < 0$, spiral out if $\alpha > 0$, center if $\alpha = 0$.'
        type: basic

