            solution_sketch: 'The equilibrium is $(3, 2)$. The Jacobian $\begin{pmatrix} 4 - 2y & -2x \\ y & x - 3 \end{pmatrix}$ equals $\begin{pmatrix} 0 & -6 \\ 2 & 0 \end{pmatrix}$ there, with trace $0$ and determinant $12$. So the eigenvalues are purely imaginary and the linearization is a center: the populations cycle around coexistence.'
          - problem: 'For the competing-species system $x'' = x(7 - 2x - y)$, $y'' = y(6 - x - y)$, use linearization at the equilibrium where both species survive. What is the determinant of the Jacobian matrix there?'
