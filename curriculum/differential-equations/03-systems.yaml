        key: false
      - id: slope-fields-equilibria
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Classification from the matrix
        key_prerequisites: [equilibrium-classification-eigenvalues]
        exemplars:
          - problem: 'Classify the origin of $\mathbf{X}'' = \begin{pmatrix} 0 & 1 \\ -2 & -3 \end{pmatrix}\mathbf{X}$.'
            answer: 'Stable node: $\lambda = -1, -2$.'
            solution_sketch: '$\lambda^2 + 3\lambda + 2 = (\lambda + 1)(\lambda + 2)$: both roots negative.'
          - problem: 'Classify the origin of $\mathbf{X}'' = \begin{pmatrix} 2 & 3 \\ 3 & 2 \end{pmatrix}\mathbf{X}$.'
            answer: 'Saddle (unstable): $\lambda = 5$ and $\lambda = -1$.'
            solution_sketch: 'Trace $4$, determinant $4 - 9 = -5 < 0$: a negative determinant always means a saddle.'
          - problem: 'Classify the origin of $\mathbf{X}'' = \begin{pmatrix} 0 & 2 \\ -2 & 0 \end{pmatrix}\mathbf{X}$.'
            answer: 'Center: $\lambda = \pm 2i$, purely imaginary; stable but not asymptotically stable.'
            solution_sketch: '$\lambda^2 + 4 = 0$; trajectories are closed orbits around the origin.'
        constraints: "2x2 integer matrices; eigenvalues computable from trace/determinant; det < 0 shortcut for saddles allowed"
      - id: kp2
        name: The trace-determinant shortcut
        key_prerequisites: [equilibrium-classification-eigenvalues]
        exemplars:
          - problem: 'A $2\times 2$ system has $\operatorname{tr} A = -4$ and $\det A = 5$. Classify the origin without finding the eigenvalues.'
            answer: 'Stable spiral: $T^2 - 4D = 16 - 20 < 0$ gives complex eigenvalues, and $\operatorname{tr} A < 0$ makes their real part negative.'
            solution_sketch: 'Eigenvalues satisfy $\lambda^2 - T\lambda + D = 0$; here $\lambda = -2 \pm i$.'
          - problem: 'Classify the origin when $\operatorname{tr} A = 2$ and $\det A = -8$.'
            answer: 'Saddle (unstable): $\det A < 0$ forces real eigenvalues of opposite sign, regardless of the trace.'
          - problem: 'Classify the origin when $\operatorname{tr} A = 5$ and $\det A = 6$.'
            answer: 'Unstable node: $T^2 - 4D = 1 > 0$ with $D > 0$, $T > 0$ gives two positive real eigenvalues ($\lambda = 2, 3$).'
            solution_sketch: '$\lambda^2 - 5\lambda + 6 = (\lambda - 2)(\lambda - 3)$.'
        constraints: "give only trace and determinant; classification must cite T^2 - 4D and the signs of T, D"
      - id: kp3
        name: Trajectory behavior
        key_prerequisites: [equilibrium-classification-eigenvalues]
        exemplars:
          - problem: 'A saddle has $\lambda_1 = 2$ with $\mathbf{v}_1 = \binom{1}{1}$ and $\lambda_2 = -3$ with $\mathbf{v}_2 = \binom{1}{-1}$. What does a generic trajectory do as $t \to \infty$?'
            answer: 'The $\mathbf{v}_2$ component decays, so the trajectory becomes parallel to the line spanned by $\binom{1}{1}$ and runs off to infinity along it.'
            solution_sketch: '$\mathbf{X} = c_1 e^{2t}\mathbf{v}_1 + c_2 e^{-3t}\mathbf{v}_2$: for $c_1 \neq 0$ the growing term dominates.'
          - problem: 'For $\mathbf{X}'' = \begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix}\mathbf{X}$, determine the direction of rotation of the closed orbits.'
            answer: 'Clockwise: at $(1, 0)$ the velocity is $\binom{0}{-1}$, pointing straight down.'
            solution_sketch: 'Evaluate $A\binom{1}{0} = \binom{0}{-1}$: from the positive $x$-axis the flow moves down, hence clockwise.'
        constraints: "read dominance from the largest eigenvalue; rotation direction by evaluating AX at (1,0)"
    diagnostic_exemplar:
      problem: 'For $\mathbf{X}'' = \begin{pmatrix} -3 & 2 \\ -2 & -3 \end{pmatrix}\mathbf{X}$, use the trace and determinant to classify the origin, and say what a generic trajectory does as $t \to \infty$.'
      answer: 'Stable spiral: $T = -6$, $D = 13$, and $T^2 - 4D = -16 < 0$ gives complex eigenvalues with negative real part; every trajectory spirals inward and tends to the origin.'
      solution_sketch: '$T^2 - 4D < 0$ means complex eigenvalues (spiralling), and $T < 0$ makes their real part negative (inward).'
    anki_seeds:
      - front: 'What does $\det A < 0$ tell you about the origin of $\mathbf{X}'' = A\mathbf{X}$?'
        back: 'It is a saddle (real eigenvalues of opposite sign), always unstable.'
        type: basic
      - front: 'Trace-determinant classification when $\det A > 0$?'
        back: '$T^2 - 4D > 0$: node; $T^2 - 4D < 0$: spiral ($T = 0$: center). *Asymptotically* stable iff $\operatorname{tr} A < 0$; $\operatorname{tr} A = 0$ with $D > 0$ is a center — stable but not asymptotically stable.'
        type: basic

  - id: complex-eigenvalue-systems
    name: Systems with Complex Eigenvalues
    core: false                # special case; feeds only the defective-eigenvalue leaf
    difficulty: 0.83
    drill: false
    answer_kind: multi-step
    expected_time_secs: 300
    prerequisites:
      - id: linear-systems-eigenvalues
        weight: 0.7
        key: true
      - id: complex-numbers
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Complex eigenpairs
        key_prerequisites: [linear-systems-eigenvalues, complex-numbers]
        exemplars:
          - problem: 'Find the eigenvalues of $\begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix}$ and an eigenvector for the eigenvalue with positive imaginary part.'
            answer: '$\lambda = \pm i$; for $\lambda = i$ an eigenvector is $\binom{1}{i}$.'
            solution_sketch: '$\lambda^2 + 1 = 0$; $(A - iI)\mathbf{v} = 0$ gives $-iv_1 + v_2 = 0$, so $\mathbf{v} = \binom{1}{i}$.'
          - problem: 'Find the eigenvalues of $\begin{pmatrix} 1 & -2 \\ 2 & 1 \end{pmatrix}$.'
            answer: '$\lambda = 1 \pm 2i$'
            solution_sketch: '$\det(A - \lambda I) = (1 - \lambda)^2 + 4 = 0$.'
        constraints: "2x2 integer matrices with eigenvalues alpha +/- beta i, alpha and beta integers"
      - id: kp2
        name: Real solutions via Euler's formula
        key_prerequisites: [linear-systems-eigenvalues, complex-numbers]
        exemplars:
          - problem: 'Find the general (real) solution of $\mathbf{X}'' = \begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix}\mathbf{X}$.'
            answer: '$\mathbf{X} = c_1\binom{\cos t}{-\sin t} + c_2\binom{\sin t}{\cos t}$'
            solution_sketch: '$\lambda = \pm i$ with eigenvector $\binom{1}{i}$ for $i$; the real and imaginary parts of $e^{it}\binom{1}{i}$ give two independent real solutions.'
          - problem: 'Find the general (real) solution of $\mathbf{X}'' = \begin{pmatrix} 1 & -2 \\ 2 & 1 \end{pmatrix}\mathbf{X}$.'
            answer: '$\mathbf{X} = c_1 e^{t}\binom{\cos 2t}{\sin 2t} + c_2 e^{t}\binom{\sin 2t}{-\cos 2t}$'
            solution_sketch: '$\lambda = 1 \pm 2i$ with eigenvector $\binom{1}{-i}$ for $1 + 2i$; split $e^{(1+2i)t}\binom{1}{-i}$ into real and imaginary parts.'
        constraints: "eigenvalues alpha +/- beta i with integer alpha, beta; answers written with real cos/sin vectors, no i remaining"
      - id: kp3
        name: IVPs and spiral behavior
        key_prerequisites: [linear-systems-eigenvalues]
        exemplars:
          - problem: 'Solve $\mathbf{X}'' = \begin{pmatrix} 0 & 2 \\ -2 & 0 \end{pmatrix}\mathbf{X}$ with $\mathbf{X}(0) = \binom{1}{0}$.'
            answer: '$\mathbf{X} = \binom{\cos 2t}{-\sin 2t}$'
            solution_sketch: 'Check directly: the derivative is $\binom{-2\sin 2t}{-2\cos 2t}$, which equals $A\mathbf{X}$; the initial condition matches.'
          - problem: 'For $\mathbf{X}'' = \begin{pmatrix} 1 & -2 \\ 2 & 1 \end{pmatrix}\mathbf{X}$, do trajectories spiral toward or away from the origin?'
            answer: 'Away: the eigenvalues $1 \pm 2i$ have positive real part, so the origin is an unstable spiral.'
        constraints: "initial conditions align with a single real solution; stability read from the real part alpha"
    diagnostic_exemplar:
      problem: 'Solve $\mathbf{X}'' = \begin{pmatrix} 0 & 2 \\ -2 & 0 \end{pmatrix}\mathbf{X}$ with $\mathbf{X}(0) = \binom{3}{0}$, and say whether the trajectories spiral inward, spiral outward, or close up.'
      answer: '$\mathbf{X} = \binom{3\cos 2t}{-3\sin 2t}$; the eigenvalues $\pm 2i$ are purely imaginary, so the trajectories are closed orbits (circles) — neither inward nor outward.'
      solution_sketch: 'The general real solution is $c_1\binom{\cos 2t}{-\sin 2t} + c_2\binom{\sin 2t}{\cos 2t}$; the initial condition gives $c_1 = 3$, $c_2 = 0$.'
    anki_seeds:
      - front: 'Real solutions from a complex eigenpair $\lambda = \alpha + \beta i$, eigenvector $\mathbf{v}$?'
        back: 'The real and imaginary parts of $e^{\lambda t}\mathbf{v}$ (via Euler''s formula $e^{i\beta t} = \cos\beta t + i\sin\beta t$).'
        type: basic
      - front: 'For real $A$, complex eigenvalues and eigenvectors come in...'
        back: 'conjugate pairs: one pair $(\lambda, \mathbf{v})$ already yields both independent real solutions.'
        type: basic

  - id: complex-repeated-eigenvalues
    name: Repeated and Defective Eigenvalues
    core: false                # special case at the tip of the systems branch
    difficulty: 0.85
    drill: false
    answer_kind: multi-step
    expected_time_secs: 300
    prerequisites:
      - id: complex-eigenvalue-systems
        weight: 0.6
        key: true
      - id: linear-systems-eigenvalues
        weight: 0.5
        key: true
      - id: phase-plane-stability
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Detecting defective matrices
        key_prerequisites: [linear-systems-eigenvalues]
        exemplars:
          - problem: 'Find the eigenvalues and eigenvectors of $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$. Is the matrix defective?'
            answer: '$\lambda = 1$ (double) with eigenvectors spanned by $\binom{1}{0}$ only: defective.'
            solution_sketch: '$(A - I)\mathbf{v} = 0$ reads $v_2 = 0$: a single independent eigenvector for a double eigenvalue.'
          - problem: 'The matrix $\begin{pmatrix} 3 & 0 \\ 0 & 3 \end{pmatrix}$ has double eigenvalue $3$. Is it defective?'
            answer: 'No: $A = 3I$, so every nonzero vector is an eigenvector and two independent ones exist.'
        constraints: "2x2 matrices with an integer double eigenvalue; decide defective vs diagonal"
      - id: kp2
        name: Generalized eigenvectors and the second solution
        key_prerequisites: [linear-systems-eigenvalues]
        exemplars:
          - problem: 'Find the general solution of $\mathbf{X}'' = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}\mathbf{X}$.'
            answer: '$\mathbf{X} = c_1 e^{t}\binom{1}{0} + c_2 e^{t}\left[t\binom{1}{0} + \binom{0}{1}\right]$'
            solution_sketch: '$\lambda = 1$ (double) with the single eigenvector $\binom{1}{0}$; solve $(A - I)\mathbf{w} = \binom{1}{0}$ to get $\mathbf{w} = \binom{0}{1}$.'
          - problem: 'Find the general solution of $\mathbf{X}'' = \begin{pmatrix} 3 & 1 \\ -1 & 1 \end{pmatrix}\mathbf{X}$.'
            answer: '$\mathbf{X} = c_1 e^{2t}\binom{1}{-1} + c_2 e^{2t}\left[t\binom{1}{-1} + \binom{1}{0}\right]$'
            solution_sketch: '$\lambda^2 - 4\lambda + 4 = (\lambda - 2)^2$; eigenvector $\binom{1}{-1}$, and $(A - 2I)\mathbf{w} = \binom{1}{-1}$ gives $w_1 + w_2 = 1$, e.g. $\mathbf{w} = \binom{1}{0}$.'
        constraints: "2x2 defective matrices with an integer double eigenvalue; second solution e^{lt}(t v + w) with (A - lI)w = v"
      - id: kp3
        name: IVPs and long-run behavior
        key_prerequisites: [linear-systems-eigenvalues, complex-eigenvalue-systems]
        exemplars:
          - problem: 'Solve $\mathbf{X}'' = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}\mathbf{X}$ with $\mathbf{X}(0) = \binom{2}{3}$.'
            answer: '$\mathbf{X} = e^{t}\binom{2 + 3t}{3}$'
            solution_sketch: 'General solution $c_1 e^t\binom{1}{0} + c_2 e^t[t\binom{1}{0} + \binom{0}{1}]$; $\mathbf{X}(0) = \binom{c_1}{c_2}$ forces $c_1 = 2$, $c_2 = 3$.'
          - problem: 'For $\mathbf{X}'' = \begin{pmatrix} 3 & 1 \\ -1 & 1 \end{pmatrix}\mathbf{X}$, do trajectories approach the origin as $t \to \infty$?'
            answer: 'No: the double eigenvalue $2$ is positive, so $e^{2t}$ (and $te^{2t}$) grow and the origin is an unstable degenerate node.'
        constraints: "initial conditions with integer c_1, c_2; stability read from the sign of the double eigenvalue"
    diagnostic_exemplar:
      problem: 'Solve $\mathbf{X}'' = \begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}\mathbf{X}$ with $\mathbf{X}(0) = \binom{1}{3}$, and say whether the trajectory approaches the origin as $t \to \infty$.'
      answer: '$\mathbf{X} = e^{2t}\binom{1 + 3t}{3}$; no — the double eigenvalue $2$ is positive, so the trajectory runs away from the origin (an unstable degenerate node).'
      solution_sketch: 'The matrix is defective (only $\binom{1}{0}$ is an eigenvector), so the general solution is $c_1 e^{2t}\binom{1}{0} + c_2 e^{2t}\left[t\binom{1}{0} + \binom{0}{1}\right]$; the initial condition gives $c_1 = 1$, $c_2 = 3$.'
    anki_seeds:
      - front: 'Second solution for a defective double eigenvalue $\lambda$ with eigenvector $\mathbf{v}$?'
        back: '$e^{\lambda t}(t\mathbf{v} + \mathbf{w})$, where $(A - \lambda I)\mathbf{w} = \mathbf{v}$.'
        type: basic
      - front: 'When does a double eigenvalue $\lambda$ of a $2\times 2$ matrix $A$ need a generalized eigenvector?'
        back: 'When $A \neq \lambda I$: then only one independent eigenvector exists (the matrix is defective).'
        type: basic

  - id: nonhomogeneous-systems-glimpse
    name: Nonhomogeneous Systems
    core: false                # terminal glimpse topic
    difficulty: 0.85
    drill: false
    answer_kind: multi-step
    expected_time_secs: 300
    prerequisites:
      - id: linear-systems-eigenvalues
        weight: 0.7
        key: true
      - id: undetermined-coefficients
        weight: 0.4
        key: true
      - id: matrix-inverses
        weight: 0.3
        key: false
    knowledge_points:
      - id: kp1
        name: Structure of solutions
        key_prerequisites: [linear-systems-eigenvalues]
        exemplars:
          - problem: 'If $\mathbf{X}_h$ is the general solution of $\mathbf{X}'' = A\mathbf{X}$ and $\mathbf{X}_p$ one particular solution of $\mathbf{X}'' = A\mathbf{X} + \mathbf{b}$, what is the general solution of the nonhomogeneous system?'
            answer: '$\mathbf{X} = \mathbf{X}_h + \mathbf{X}_p$'
            solution_sketch: 'The difference of two nonhomogeneous solutions solves the homogeneous system, exactly as for scalar equations.'
          - problem: 'Verify that the constant vector $\mathbf{X}_p = \binom{2}{-1}$ is a particular solution of $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X} + \binom{0}{-3}$.'
            answer: '$\mathbf{X}_p'' = \mathbf{0}$ and $A\binom{2}{-1} + \binom{0}{-3} = \binom{0}{3} + \binom{0}{-3} = \mathbf{0}$: it checks.'
            solution_sketch: '$A\binom{2}{-1} = \binom{2 - 2}{4 - 1} = \binom{0}{3}$.'
        constraints: "verification by one matrix-vector product; constant forcing vectors"
      - id: kp2
        name: Constant forcing
        key_prerequisites: [linear-systems-eigenvalues]
        exemplars:
          - problem: 'Find a constant particular solution of $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X} + \binom{0}{-3}$.'
            answer: '$\mathbf{X}_p = \binom{2}{-1}$'
            solution_sketch: 'Set $\mathbf{X}_p'' = \mathbf{0}$: solve $A\mathbf{X}_p = -\mathbf{b}$, i.e. $x + 2y = 0$, $2x + y = 3$, giving $(2, -1)$.'
          - problem: 'Write the general solution of $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X} + \binom{0}{-3}$.'
            answer: '$\mathbf{X} = c_1 e^{3t}\binom{1}{1} + c_2 e^{-t}\binom{1}{-1} + \binom{2}{-1}$'
            solution_sketch: 'Homogeneous general solution (eigenpairs $3, -1$) plus the equilibrium particular solution.'
        constraints: "det A nonzero so X_p = -A^{-1}b exists; integer particular solutions"
      - id: kp3
        name: Exponential forcing glimpse
        key_prerequisites: [linear-systems-eigenvalues, undetermined-coefficients]
        exemplars:
          - problem: 'For $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X} + \binom{1}{0}e^{2t}$, find a particular solution of the form $\mathbf{X}_p = \mathbf{a}e^{2t}$.'
            answer: '$\mathbf{X}_p = \binom{-1/3}{-2/3}e^{2t}$'
            solution_sketch: 'Substituting gives $(A - 2I)\mathbf{a} = -\binom{1}{0}$: $-a_1 + 2a_2 = -1$, $2a_1 - a_2 = 0$, so $\mathbf{a} = (-\frac{1}{3}, -\frac{2}{3})$.'
          - problem: 'Why does the guess $\mathbf{X}_p = \mathbf{a}e^{3t}$ fail for $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X} + \mathbf{v}e^{3t}$?'
            answer: '$3$ is an eigenvalue of $A$, so $A - 3I$ is singular and $(A - 3I)\mathbf{a} = -\mathbf{v}$ generally has no solution; resonance requires $te^{3t}$ terms.'
        constraints: "exponent alpha not an eigenvalue except in the resonance discussion; solve (A - alpha I)a = -v"
    diagnostic_exemplar:
      problem: 'For $\mathbf{X}'' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}\mathbf{X} + \binom{1}{1}e^{2t}$, find a particular solution of the form $\mathbf{X}_p = \mathbf{a}e^{2t}$.'
      answer: '$\mathbf{X}_p = \binom{-1}{-1}e^{2t}$'
      solution_sketch: 'Substituting gives $2\mathbf{a} = A\mathbf{a} + \binom{1}{1}$, i.e. $(A - 2I)\mathbf{a} = -\binom{1}{1}$. Solving $\begin{pmatrix} -1 & 2 \\ 2 & -1 \end{pmatrix}\mathbf{a} = \binom{-1}{-1}$ gives $\mathbf{a} = \binom{-1}{-1}$ (legitimate because $2$ is not an eigenvalue of $A$).'
    anki_seeds:
      - front: 'General solution of $\mathbf{X}'' = A\mathbf{X} + \mathbf{b}$?'
        back: 'Homogeneous general solution plus any one particular solution: $\mathbf{X} = \mathbf{X}_h + \mathbf{X}_p$.'
        type: basic
      - front: 'Constant particular solution of $\mathbf{X}'' = A\mathbf{X} + \mathbf{b}$ when $\det A \neq 0$?'
        back: '$\mathbf{X}_p = -A^{-1}\mathbf{b}$ (the equilibrium of the forced system).'
        type: basic

  - id: nonlinear-systems-linearization
    name: Nonlinear Systems and Linearization
    core: false                # terminal payoff of the qualitative branch: the trace-det/
                               # eigenvalue machinery is cashed in here and nothing in the
                               # tree builds on the verdicts (p. 391 destination criterion;
                               # rule 1 concurs — both DE anchors are supplemental)
    difficulty: 0.86
    drill: false
    answer_kind: multi-step
    expected_time_secs: 300
    prerequisites:
      - id: phase-plane-stability
        weight: 0.7
        key: true
      - id: first-order-partial-derivatives
        weight: 0.5
        key: true
      - id: equilibrium-classification-eigenvalues
        weight: 0.3
        key: false
      - id: slope-fields-equilibria
        weight: 0.2
        key: false
    knowledge_points:
      - id: kp1
        name: Equilibria of nonlinear systems
        key_prerequisites: [slope-fields-equilibria]
        exemplars:
          - problem: 'Find all equilibrium points of the system $x'' = y - x^2$, $y'' = x - y$.'
            answer: '$(0, 0)$ and $(1, 1)$'
            solution_sketch: 'Set both right-hand sides to zero: $y = x^2$ and $y = x$, so $x^2 = x$ gives $x = 0$ or $x = 1$.'
          - problem: 'Find all equilibrium points of $x'' = x(2 - y)$, $y'' = y(x - 3)$.'
            answer: '$(0, 0)$ and $(3, 2)$'
            solution_sketch: 'The first equation forces $x = 0$ or $y = 2$; the second forces $y = 0$ or $x = 3$. The consistent combinations are $(0,0)$ and $(3,2)$.'
          - problem: 'Find all equilibrium points of $x'' = x - y$, $y'' = x^2 - 4$.'
            answer: '$(2, 2)$ and $(-2, -2)$'
            solution_sketch: '$x^2 = 4$ gives $x = \pm 2$, and $y = x$ pairs each with itself.'
        constraints: "polynomial right-hand sides solvable by factoring or substitution; integer equilibrium coordinates; ALL equilibria must be reported, including the origin when present"
      - id: kp2
        name: The Jacobian and classification at an equilibrium
        key_prerequisites: [phase-plane-stability, first-order-partial-derivatives]
        exemplars:
          - problem: 'For $x'' = y - x^2$, $y'' = x - y$, compute the Jacobian matrix and classify the equilibrium at $(0, 0)$.'
            answer: '$J(x, y) = \begin{pmatrix} -2x & 1 \\ 1 & -1 \end{pmatrix}$; $J(0,0) = \begin{pmatrix} 0 & 1 \\ 1 & -1 \end{pmatrix}$ has $\det J = -1 < 0$: saddle, unstable.'
            solution_sketch: 'The Jacobian collects the first partials of the right-hand sides; a negative determinant always means a saddle.'
          - problem: 'Classify the equilibrium $(1, 1)$ of the system $x'' = y - x^2$, $y'' = x - y$.'
            answer: 'Stable node: $J(1,1) = \begin{pmatrix} -2 & 1 \\ 1 & -1 \end{pmatrix}$ has $T = -3$, $D = 1$, $T^2 - 4D = 5 > 0$, so both eigenvalues are real and negative.'
            solution_sketch: 'Evaluate the Jacobian at the equilibrium, then apply the trace-determinant test exactly as for a linear system.'
          - problem: 'The Jacobian of a nonlinear system at an equilibrium has eigenvalues $\pm 3i$. What can you conclude about the nonlinear system there?'
            answer: 'Nothing definitive: a center is a borderline case, and the neglected nonlinear terms can turn it into a slow spiral in or out. Only verdicts with $\operatorname{Re}\lambda \neq 0$ (saddle, node, spiral) transfer to the nonlinear system.'
            solution_sketch: 'Linearization is trustworthy when no eigenvalue has zero real part; centers and zero eigenvalues are exactly the inconclusive cases.'
        constraints: "2x2 Jacobians of polynomial systems with integer entries at the equilibrium; classification cites trace/determinant or eigenvalues and states both type and stability; center or zero-eigenvalue verdicts must be flagged as inconclusive for the nonlinear system"
      - id: kp3
        name: Predator-prey and competing species
        key_prerequisites: [phase-plane-stability, equilibrium-classification-eigenvalues]
        exemplars:
          - problem: 'For the predator-prey system $x'' = x(2 - y)$, $y'' = y(x - 3)$ (prey $x$, predators $y$), linearize at both equilibria and interpret.'
            answer: 'At $(0,0)$: $J = \begin{pmatrix} 2 & 0 \\ 0 & -3 \end{pmatrix}$, eigenvalues $2, -3$: saddle — the extinction state is unstable. At $(3,2)$: $J = \begin{pmatrix} 0 & -3 \\ 2 & 0 \end{pmatrix}$, $T = 0$, $D = 6$: linear center ($\lambda = \pm i\sqrt{6}$) — the linearization predicts populations cycling around coexistence (and for Lotka-Volterra the true orbits are indeed closed).'
            solution_sketch: '$J(x,y) = \begin{pmatrix} 2 - y & -x \\ y & x - 3 \end{pmatrix}$; evaluate at each equilibrium and read off the trace-determinant verdict.'
          - problem: 'For the competing-species system $x'' = x(3 - x - 2y)$, $y'' = y(2 - x - y)$, find all four equilibria and classify the coexistence equilibrium.'
            answer: 'Equilibria: $(0,0)$, $(3,0)$, $(0,2)$, $(1,1)$. At $(1,1)$: $J = \begin{pmatrix} -1 & -2 \\ -1 & -1 \end{pmatrix}$ with $\det J = -1 < 0$: saddle — coexistence is unstable (competitive exclusion).'
            solution_sketch: 'Each factor gives $x = 0$ or $3 - x - 2y = 0$ and $y = 0$ or $2 - x - y = 0$; the interior pair solves to $(1,1)$. $J(x,y) = \begin{pmatrix} 3 - 2x - 2y & -2x \\ -y & 2 - x - 2y \end{pmatrix}$.'
          - problem: 'In the same competing-species system, classify the equilibrium $(3, 0)$ and interpret it.'
            answer: 'Stable node: $J(3,0) = \begin{pmatrix} -3 & -6 \\ 0 & -1 \end{pmatrix}$ has eigenvalues $-3, -1$. Species $x$ wins: nearby populations tend to $x = 3$, $y = 0$.'
            solution_sketch: 'The Jacobian is triangular, so the eigenvalues are the diagonal entries; both negative means an attracting state.'
        constraints: "Lotka-Volterra and competing-species models with integer parameters and integer equilibrium coordinates; every classification carries a one-line population interpretation; the Lotka-Volterra interior center is stated as the linearization's verdict"
    diagnostic_exemplar:
      problem: 'For the predator-prey system $x'' = x(4 - y)$, $y'' = y(x - 2)$ (prey $x$, predators $y$), find the coexistence equilibrium and classify it by linearization.'
      answer: 'Coexistence equilibrium $(2, 4)$. There $J = \begin{pmatrix} 0 & -2 \\ 4 & 0 \end{pmatrix}$ with $T = 0$ and $D = 8$, so $\lambda = \pm i\sqrt{8}$: a linear centre, predicting the populations cycling around coexistence. (A centre is the borderline case, so linearization alone does not settle the nonlinear behaviour.)'
      solution_sketch: 'Equilibria come from $x(4-y) = 0$ and $y(x-2) = 0$: the origin and $(2,4)$. The Jacobian is $\begin{pmatrix} 4 - y & -x \\ y & x - 2 \end{pmatrix}$.'
    anki_seeds:
      - front: 'Jacobian matrix of the system $x'' = f(x, y)$, $y'' = g(x, y)$?'
        back: '$J = \begin{pmatrix} f_x & f_y \\ g_x & g_y \end{pmatrix}$, evaluated at the equilibrium of interest.'
        type: basic
      - front: 'How do you classify an equilibrium of a nonlinear 2D system?'
        back: 'Evaluate the Jacobian there and classify $\mathbf{X}'' = J\mathbf{X}$ with the trace-determinant/eigenvalue machinery; the verdict transfers when no eigenvalue has zero real part.'
        type: basic
      - front: 'When is Jacobian linearization inconclusive?'
        back: 'Borderline cases: purely imaginary eigenvalues (linear center) or a zero eigenvalue — nonlinear terms can then change the picture.'
        type: basic
