  {"id": "dividing-rational-expressions", "name": "Dividing Rational Expressions", "core": true, "difficulty": 0.65, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "multiplying-rational-expressions", "weight": 0.7, "key": true}, {"id": "dividing-fractions", "weight": 0.6, "key": true}], "diagnostic_exemplar": {"problem": "Divide $\\frac{x^2 + 6x + 8}{x - 1} \\div \\frac{x + 2}{x - 1}$.", "answer": "x + 4", "solution_sketch": "Multiply by the reciprocal; $x^2 + 6x + 8 = (x + 2)(x + 4)$, and $(x + 2)$ and $(x - 1)$ both cancel."}, "anki_seeds": [{"front": "To divide rational expressions...", "back": "multiply by the reciprocal of the divisor.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Divide monomial rational expressions", "key_prerequisites": ["dividing-fractions"], "constraints": "flip-and-multiply; every quotient cancels to a simple monomial fraction", "try_first": {"problem": "A ribbon $\\frac{3}{4}$ metre long is cut into pieces that are each $\\frac{1}{8}$ metre long. How many pieces are there?", "answer_contract": {"kind": "exact"}, "answer": "6", "reveal": "Dividing by $\\frac{1}{8}$ asks how many eighths fit, which is the same as multiplying by $8$: $\\frac{3}{4}\\cdot 8=6$. The same rule holds when the fractions contain $x$: divide by a fraction by multiplying by its reciprocal."}, "step_check": {"step": "Its reciprocal is $y/(7x)$", "question": "Why is the divisor $7x/y$ replaced by $y/(7x)$ before the fractions are multiplied?", "options": ["Both fractions have to be turned upside down so that the variables cancel", "Dividing by a fraction gives the same result as multiplying by its reciprocal", "The numerator and the denominator of a quotient always trade places", "Division by $7x/y$ is the same as subtracting $y/(7x)$ from the first fraction"], "answer": "Dividing by a fraction gives the same result as multiplying by its reciprocal", "why": "Dividing by $\\frac{7x}{y}$ asks how many copies of it fit, and that equals multiplying by $\\frac{y}{7x}$; only the divisor is inverted, never the first fraction."}, "exemplars": [
