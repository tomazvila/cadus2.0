    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0", "label": "A"}, {"x": "4", "y": "0", "label": "B"}, {"x": "0", "y": "3", "label": "C"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "θ"}]}, "caption": "Reference example: a 3-4-5 right triangle with the right angle at A and the reference angle θ marked at B."}], "name": "Find the third angle first", "key_prerequisites": ["right-triangle-trig"], "constraints": "two angles given, so the third comes from the 180 degree sum; angles drawn from 30, 45, 60, 75 and 105 degrees so answers stay exact radicals", "exemplars": [
