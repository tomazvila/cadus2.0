topics: [
  {"id": "rational-expression-restrictions", "name": "Excluded Values of Rational Expressions", "core": true, "difficulty": 0.5, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 90, "prerequisites": [{"id": "quadratic-equations-factoring", "weight": 0.5, "key": true}, {"id": "two-step-equations", "weight": 0.4}, {"id": "fraction-basics", "weight": 0.3}], "diagnostic_exemplar": {"problem": "State the excluded value(s) of $\\frac{x + 4}{x^2 - 7x + 12}$.", "answer_contract": {"kind": "list", "ordered": false, "member": {"kind": "exact"}}, "answer": "x = 3 and x = 4", "solution_sketch": "Factor the denominator: $(x - 3)(x - 4) = 0$."}, "anki_seeds": [{"front": "The excluded values of a rational expression are...", "back": "the values that make the denominator zero.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Monomial and simple binomial denominators", "key_prerequisites": ["fraction-basics"], "constraints": "denominators of degree at most 1 here; integer excluded values", "step_check": {"step": "The denominator is zero when $x-17=0$", "question": "Why must $x=17$ be excluded from $\\frac{x-1}{x-17}$?", "options": ["At $x=17$ the denominator is $0$, and dividing by $0$ has no value", "At $x=17$ the numerator becomes $16$, which is too large to divide", "At $x=17$ the whole fraction equals $0$, and a fraction may not be $0$"], "answer": "At $x=17$ the denominator is $0$, and dividing by $0$ has no value", "why": "Division by $0$ has no value, so any input that makes the denominator $0$ is excluded; a fraction can equal $0$ when only its numerator is $0$."}, "try_first": {"problem": "What is the value of $x-5$ when $x=5$?", "answer_contract": {"kind": "exact"}, "answer": "0", "reveal": "The denominator $x-5$ is $0$ at $x=5$, and a fraction cannot divide by $0$. So $\\frac{3}{x-5}$ has no value at $x=5$."}, "exemplars": [
      {"problem": "For which value of $x$ is $\\dfrac{x+4}{x-9}$ undefined?", "answer": "9", "solution_sketch": "A fraction is undefined when its denominator is zero. Solving $x-9=0$ gives $x=9$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Which number is not in the domain of $f(x)=\\dfrac{2}{x+6}$?", "answer": "-6", "solution_sketch": "The domain leaves out every input that makes the denominator zero. Setting $x+6=0$ gives $x=-6$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has area $24$ square centimeters and width $x-3$ centimeters, so its length is $\\dfrac{24}{x-3}$ centimeters. For which value of $x$ does this formula have no meaning?", "answer": "3", "solution_sketch": "The formula divides by the width, so the width must not be zero. The width $x-3$ equals $0$ when $x=3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A prize of $900$ dollars is shared equally among $n-8$ winners, so each winner receives $\\dfrac{900}{n-8}$ dollars. For which value of $n$ is this formula undefined?", "answer": "8", "solution_sketch": "Each share divides by the number of winners, which must not be zero. The count $n-8$ is zero when $n=8$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam simplifies $\\dfrac{x-5}{x-5}$ to $1$ and says that no value of $x$ is excluded. For which value of $x$ is the original expression undefined?", "answer": "5", "solution_sketch": "The original fraction has the denominator $x-5$, which is zero at $x=5$. Cancelling does not remove that restriction.", "answer_contract": {"kind": "exact"}},
      {"problem": "Which input is not in the domain of $g(x)=\\dfrac{x^2+1}{x}$?", "answer": "0", "solution_sketch": "The denominator is $x$, which is zero only at $x=0$. The numerator $x^2+1$ does not change the domain.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which value of $x$ is $\\dfrac{x-4}{x+1}$ undefined?", "answer": "-1", "solution_sketch": "Only the denominator matters here. The equation $x+1=0$ gives $x=-1$, while the numerator is $0$ at $x=4$, where the fraction is defined.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Solve a linear denominator equal to zero", "key_prerequisites": ["two-step-equations"], "constraints": "denominators of the form ax + b with small integer a and b; the excluded value is an integer or a simple fraction", "step_check": {"step": "Set the denominator equal to zero", "question": "Why does the numerator $5$ play no part in finding the excluded value of $\\frac{5}{4x-10}$?", "options": ["The numerator $5$ divides the $10$ in the denominator, so it drops out", "Only a zero denominator breaks a fraction, whatever the numerator is", "The numerator is always $0$ at the excluded input value"], "answer": "Only a zero denominator breaks a fraction, whatever the numerator is", "why": "A fraction fails only when it divides by $0$, which depends on the denominator alone; here $4x-10=0$ gives $x=5/2$."}, "exemplars": [
      {"problem": "For which value of $x$ is $\\dfrac{7}{2x-6}$ undefined?", "answer": "3", "solution_sketch": "The expression is undefined when the denominator is zero. Setting $2x-6=0$ gives $2x=6$, so $x=3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Which input is not in the domain of $f(x)=\\dfrac{x+1}{3x+12}$?", "answer": "-4", "solution_sketch": "The denominator $3x+12$ is zero when $3x=-12$. Dividing by $3$ gives $x=-4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A cyclist rides $30$ kilometers at a speed of $2t-5$ kilometers per hour, so the ride takes $\\dfrac{30}{2t-5}$ hours. For which value of $t$ is this formula undefined?", "answer": "5/2", "solution_sketch": "The time divides by the speed, which must not be zero. Solving $2t-5=0$ gives $t=\\frac{5}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which value of $x$ is $\\dfrac{3}{5x+2}$ undefined?", "answer": "-2/5", "solution_sketch": "The fraction is undefined where its denominator is zero. Setting $5x+2=0$ gives $5x=-2$, so $x=-\\frac{2}{5}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Ana says that $\\dfrac{6}{2x-8}$ is undefined at $x=8$. For which value of $x$ is it really undefined?", "answer": "4", "solution_sketch": "Ana used the number $8$ without solving an equation. The equation $2x-8=0$ gives $2x=8$, so $x=4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ribbon $60$ centimeters long is cut into pieces of length $3-2x$ centimeters, so the number of pieces is $\\dfrac{60}{3-2x}$. For which value of $x$ is this formula undefined?", "answer": "3/2", "solution_sketch": "The piece length must not be zero, or the division fails. Solving $3-2x=0$ gives $2x=3$, so $x=\\frac{3}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which value of $x$ is $\\dfrac{2x-1}{4x+6}$ undefined?", "answer": "-3/2", "solution_sketch": "Only the denominator matters here, not the numerator. The equation $4x+6=0$ gives $4x=-6$, so $x=-\\frac{3}{2}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Factorable quadratic denominators", "key_prerequisites": ["quadratic-equations-factoring"], "constraints": "denominators are factorable quadratics (difference of squares or monic trinomials) with two integer roots; give both excluded values", "step_check": {"step": "Factor the denominator: $x^2-x-12=(x-4)(x+3)$", "question": "Why does the factored denominator give two excluded values?", "options": ["Every quadratic denominator has exactly two excluded values, whatever its factors are", "Both factors must be zero at the same time, so $x=4$ and $x=-3$ together", "A product is zero when either factor is zero, so each factor gives a value"], "answer": "A product is zero when either factor is zero, so each factor gives a value", "why": "The product $(x-4)(x+3)$ is $0$ when $x-4=0$ or when $x+3=0$, so both $x=4$ and $x=-3$ are excluded."}, "exemplars": [
      {"problem": "For which values of $x$ is $\\dfrac{x+2}{x^2-7x+10}$ undefined?", "answer": "2, 5", "solution_sketch": "Factor the denominator: $x^2-7x+10=(x-2)(x-5)$. Each factor gives one excluded value, $x=2$ and $x=5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which values of $x$ is $\\dfrac{x+1}{x^2-9}$ undefined?", "answer": "-3, 3", "solution_sketch": "The denominator is a difference of squares, $(x-3)(x+3)$. It is zero at $x=3$ and at $x=-3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has area $60$ and width $x^2-5x-14$, so its length is $\\dfrac{60}{x^2-5x-14}$. For which values of $x$ is this formula undefined?", "answer": "-2, 7", "solution_sketch": "The width factors as $(x-7)(x+2)$. It is zero at $x=7$ and at $x=-2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Which inputs are not in the domain of $h(x)=\\dfrac{x}{x^2+4x}$?", "answer": "-4, 0", "solution_sketch": "Factor the denominator: $x^2+4x=x(x+4)$. It is zero at $x=0$ and at $x=-4$, although one factor $x$ also divides the numerator.", "answer_contract": {"kind": "exact"}},
      {"problem": "Cancelling the common factor $x-2$ in $\\dfrac{x-2}{x^2-4}$ leaves $\\dfrac{1}{x+2}$. For which values of $x$ is the original expression undefined?", "answer": "-2, 2", "solution_sketch": "The original denominator is $(x-2)(x+2)$. It is zero at $x=2$ and at $x=-2$, even though the factor $x-2$ cancels.", "answer_contract": {"kind": "exact"}},
      {"problem": "A pump setting $x$ gives a filling time of $\\dfrac{50}{x^2+x-12}$ hours. For which settings is this formula undefined?", "answer": "-4, 3", "solution_sketch": "Factor the denominator: $x^2+x-12=(x+4)(x-3)$. It is zero at $x=-4$ and at $x=3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam says that $\\dfrac{3}{x^2-16}$ is undefined only when $x=4$. For which values of $x$ is it undefined?", "answer": "-4, 4", "solution_sketch": "Sam missed a factor: $x^2-16=(x-4)(x+4)$. The denominator is zero at $x=4$ and at $x=-4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which values of $x$ is $\\dfrac{1}{x^2-6x+9}$ undefined?", "answer": "3", "solution_sketch": "The denominator is a perfect square: $x^2-6x+9=(x-3)^2$. It is zero only at $x=3$, a single excluded value.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "simplifying-rational-monomials", "name": "Simplifying Monomial Rational Expressions", "core": true, "difficulty": 0.5, "drill": false, "answer_kind": "expression", "expected_time_secs": 90, "prerequisites": [{"id": "equivalent-fractions", "weight": 0.7, "key": true}, {"id": "exponent-product-quotient-rules", "weight": 0.6, "key": true}, {"id": "negative-zero-exponents", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Simplify $\\frac{15x^3 y}{20x y^3}$.", "answer": "3x^2/(4y^2)", "solution_sketch": "$\\frac{15}{20} = \\frac{3}{4}$, $\\frac{x^3}{x} = x^2$, and $\\frac{y}{y^3} = \\frac{1}{y^2}$."}, "anki_seeds": [{"front": "To simplify a monomial fraction, reduce the coefficients and...", "back": "subtract exponents of like bases.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Reduce numeric coefficients", "key_prerequisites": ["equivalent-fractions"], "constraints": "coefficients at most 20; single variable", "step_check": {"step": "Reduce the coefficients: $20/16=5/4$", "question": "Why may the top and bottom of $\\frac{20}{16}$ both be divided by $4$?", "options": ["Dividing the top and the bottom by the same nonzero number keeps the value", "Dividing by $4$ makes both numbers smaller, so the fraction becomes smaller", "Only the top number must be divided by $4$, and the bottom stays as it is"], "answer": "Dividing the top and the bottom by the same nonzero number keeps the value", "why": "$\\frac{20}{16}=\\frac{20\\div4}{16\\div4}=\\frac54$; the common factor $4$ cancels, so the fraction keeps its value."}, "exemplars": [
      {"problem": "Simplify $\\dfrac{12x}{20}$.", "answer": "3*x/5", "solution_sketch": "The greatest common divisor of $12$ and $20$ is $4$. Dividing both by $4$ leaves $\\frac{3x}{5}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{6x^2}{9x}$ for $x\\ne0$.", "answer": "2*x/3", "solution_sketch": "Divide the coefficients by $3$ to get $\\frac{2}{3}$. Then $\\frac{x^2}{x}=x$, so the result is $\\frac{2x}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has area $15x$ square meters and width $10$ meters, with $x>0$. What is its length in meters?", "answer": "3*x/2", "solution_sketch": "The length is the area divided by the width, which is $\\frac{15x}{10}$. Dividing the coefficients by $5$ gives $\\frac{3x}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A hiker covers $18x$ meters in $24$ minutes, with $x>0$. How many meters per minute does the hiker walk?", "answer": "3*x/4", "solution_sketch": "Speed is distance divided by time, so the speed is $\\frac{18x}{24}$. Dividing the coefficients by $6$ gives $\\frac{3x}{4}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{-16x}{12}$.", "answer": "-4*x/3", "solution_sketch": "The common divisor of $16$ and $12$ is $4$. The sign stays negative, so the result is $-\\frac{4x}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam divides the numerator of $\\dfrac{16x}{20}$ by $4$ but not the denominator, and writes $\\dfrac{4x}{20}$. What is the correct simplification?", "answer": "4*x/5", "solution_sketch": "Sam must divide the top and the bottom by the same number. Dividing both by $4$ gives $\\frac{4x}{5}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{20x}{16}$.", "answer": "5*x/4", "solution_sketch": "Both coefficients are divisible by $4$, so the common factor can go. Dividing top and bottom by $4$ gives $\\frac{5x}{4}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{-14x}{-21}$.", "answer": "2*x/3", "solution_sketch": "The two negative signs cancel, so the fraction is positive. The common divisor of $14$ and $21$ is $7$, and dividing top and bottom by $7$ gives $\\frac{2x}{3}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Quotients of powers", "key_prerequisites": ["exponent-product-quotient-rules"], "constraints": "one variable; subtract exponents, leaving the variable in the numerator or in the denominator; coefficients at most 20", "step_check": {"step": "Cancel two powers of $x$ from both parts", "question": "Why does $x^5$ stay in the denominator of $\\frac{16x^2}{20x^7}$?", "options": ["Any variable in a fraction always ends up in the denominator, never above", "The bottom has $7$ factors of $x$, the top only $2$, so $5$ stay below", "The exponents $2$ and $7$ are added, and the sum $9$ is kept below"], "answer": "The bottom has $7$ factors of $x$, the top only $2$, so $5$ stay below", "why": "Cancelling $2$ factors of $x$ from the top and the bottom leaves $7-2=5$ factors of $x$ on the bottom, so the result is $\\frac{4}{5x^5}$."}, "try_first": {"problem": "Write $\\dfrac{x^2}{x^5}$ as $\\dfrac{x\\cdot x}{x\\cdot x\\cdot x\\cdot x\\cdot x}$ and cancel. How many factors of $x$ are left in the denominator?", "answer_contract": {"kind": "exact"}, "answer": "3", "reveal": "Two factors of $x$ cancel and three stay below, so $\\frac{x^2}{x^5}=\\frac{1}{x^3}$. When the bottom has more factors, the extra powers stay in the denominator."}, "exemplars": [
      {"problem": "Simplify $\\dfrac{x^7}{x^3}$.", "answer": "x^4", "solution_sketch": "Cancel three factors of $x$ from the top and the bottom. The top keeps $7-3=4$ factors, so the result is $x^4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{10x^3}{15x^5}$ for $x\\ne0$.", "answer": "2/(3*x^2)", "solution_sketch": "Reduce $\\frac{10}{15}$ to $\\frac{2}{3}$. The bottom has two more factors of $x$ than the top, so $x^2$ stays in the denominator.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{(x^2)^3}{x^4}$ for $x\\ne0$.", "answer": "x^2", "solution_sketch": "The power rule gives $(x^2)^3=x^6$. Then the quotient has $6-4=2$ factors of $x$ left on top, so the result is $x^2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A box has volume $12x^5$ cubic centimeters and base area $8x^2$ square centimeters, with $x>0$. What is its height in centimeters?", "answer": "3*x^3/2", "solution_sketch": "Height is volume divided by base area, so it is $\\frac{12x^5}{8x^2}$. Reduce $\\frac{12}{8}$ to $\\frac{3}{2}$ and subtract exponents to get $x^3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A machine makes $9x^2$ parts in $15x^4$ seconds, with $x>0$. How many parts does it make per second?", "answer": "3/(5*x^2)", "solution_sketch": "The rate is parts divided by seconds, which is $\\frac{9x^2}{15x^4}$. Reduce $\\frac{9}{15}$ to $\\frac{3}{5}$; the bottom has two more factors of $x$, so $x^2$ stays below.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^4}{x^4}$ for $x\\ne0$.", "answer": "1", "solution_sketch": "All four factors of $x$ cancel with their partners. What is left is the number $1$, so the result is $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{18x}{12x^4}$ for $x\\ne0$.", "answer": "3/(2*x^3)", "solution_sketch": "Reduce $\\frac{18}{12}$ to $\\frac{3}{2}$. One factor of $x$ cancels, and three extra factors stay in the denominator, giving $x^3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam simplifies $\\dfrac{x^3}{x^5}$ and writes $x^2$. What is the correct result?", "answer": "1/x^2", "solution_sketch": "Sam put the leftover factors on the wrong side. The bottom has more factors of $x$, so $x^2$ stays in the denominator and the result is $\\frac{1}{x^2}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Several variables at once", "key_prerequisites": ["exponent-product-quotient-rules", "equivalent-fractions"], "constraints": "two or three variables with exponents at most 3; reduce the coefficients and each variable separately", "step_check": {"step": "Cancel powers separately", "question": "Why can the powers of $a$, $b$ and $c$ be cancelled one letter at a time?", "options": ["The letters $a$, $b$ and $c$ stand for the same number, so they cancel together", "A letter on top may cancel with any different letter on the bottom of the fraction", "Different letters are different factors, so only powers of the same letter cancel"], "answer": "Different letters are different factors, so only powers of the same letter cancel", "why": "A factor $a$ cancels only with another factor $a$; the same holds for $b$ and for $c$, so each letter is reduced on its own."}, "exemplars": [
      {"problem": "Simplify $\\dfrac{12x^2y}{18xy^2}$ for $x,y\\ne0$.", "answer": "2*x/(3*y)", "solution_sketch": "Reduce $\\frac{12}{18}$ to $\\frac{2}{3}$. One $x$ cancels and one $y$ cancels, leaving $x$ on top and $y$ below.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{4a^3b}{6a}$ for $a\\ne0$.", "answer": "2*a^2*b/3", "solution_sketch": "Reduce $\\frac{4}{6}$ to $\\frac{2}{3}$ and cancel one $a$. The factor $b$ has no partner below, so it stays on top.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{15xy^2}{20x^2y}$ for $x,y\\ne0$.", "answer": "3*y/(4*x)", "solution_sketch": "Divide the coefficients by $5$ to get $\\frac{3}{4}$. Cancelling leaves one $y$ on top and one $x$ below.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{(3ab)^2}{6a^2b^3}$ for $a,b\\ne0$.", "answer": "3/(2*b)", "solution_sketch": "Expand the top: $(3ab)^2=9a^2b^2$. Reduce $\\frac{9}{6}$ to $\\frac{3}{2}$; the $a$ factors cancel and one $b$ stays below.", "answer_contract": {"kind": "exact"}},
      {"problem": "A prism has volume $24x^3y^2$ and base area $18x^2y$, with $x,y>0$. What is its height?", "answer": "4*x*y/3", "solution_sketch": "Height is volume divided by base area. Reduce $\\frac{24}{18}$ to $\\frac{4}{3}$; the powers leave $x$ and $y$ on top.", "answer_contract": {"kind": "exact"}},
      {"problem": "A field has area $45a^2b^3$ square meters and length $6ab^2$ meters, with $a,b>0$. What is its width in meters?", "answer": "15*a*b/2", "solution_sketch": "Width is area divided by length. Reduce $\\frac{45}{6}$ to $\\frac{15}{2}$; one $a$ and one $b$ stay on top.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam simplifies $\\dfrac{8m^2n}{12mn^3}$ as $\\dfrac{2mn^2}{3}$. What is the correct result?", "answer": "2*m/(3*n^2)", "solution_sketch": "Reduce $\\frac{8}{12}$ to $\\frac{2}{3}$ and cancel one $m$. The bottom has more factors of $n$, so $n^2$ stays below.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{14p^3q^2r}{21p^3qr^2}$ for $p,q,r\\ne0$.", "answer": "2*q/(3*r)", "solution_sketch": "Reduce $\\frac{14}{21}$ to $\\frac{2}{3}$. The $p$ factors cancel completely, leaving $q$ on top and $r$ below.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "rational-expressions", "name": "Simplifying Rational Expressions", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "simplifying-rational-monomials", "weight": 0.7, "key": true}, {"id": "factoring-trinomials", "weight": 0.6, "key": true}, {"id": "rational-expression-restrictions", "weight": 0.4}, {"id": "difference-of-squares", "weight": 0.4}, {"id": "factoring-gcf", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Simplify $\\frac{x^2 - 9}{6 - 2x}$.", "answer": "-(x + 3)/2", "solution_sketch": "$6 - 2x = -2(x - 3)$, and $x^2 - 9 = (x - 3)(x + 3)$; the $(x - 3)$ cancels and the minus sign survives."}, "anki_seeds": [{"front": "(a - b)/(b - a) = ?", "back": "-1", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Factor, then cancel a common binomial", "key_prerequisites": ["factoring-trinomials", "difference-of-squares"], "constraints": "numerator is a difference of squares or a monic trinomial; the denominator is one of its linear factors; the answer is a binomial", "step_check": {"step": "Cancel the nonzero factor $y+3$", "question": "Why can $y+3$ be cancelled only after $y^2+7y+12$ is factored?", "options": ["Only factors of a product cancel, and $y+3$ is a factor only in $(y+3)(y+4)$", "The $y$ and the $3$ in $y+3$ cancel against matching terms of the numerator", "Factoring makes the numerator smaller, and only a smaller numerator can cancel"], "answer": "Only factors of a product cancel, and $y+3$ is a factor only in $(y+3)(y+4)$", "why": "A common factor of the top and the bottom cancels; in the sum $y^2+7y+12$ the piece $y+3$ is not a factor, so cancelling before factoring would be wrong."}, "exemplars": [
      {"problem": "Simplify $\\dfrac{x^2-9}{x+3}$ for $x\\ne-3$.", "answer": "x-3", "solution_sketch": "Factor the difference of squares as $(x-3)(x+3)$. Then cancel the factor $x+3$, which leaves $x-3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-6x+8}{x-2}$ for $x\\ne2$.", "answer": "x-4", "solution_sketch": "The numbers with sum $-6$ and product $8$ are $-2$ and $-4$, so the numerator is $(x-2)(x-4)$. Cancel $x-2$ to get $x-4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has area $x^2+9x+20$ square meters and width $x+4$ meters. What is its length in meters?", "answer": "x+5", "solution_sketch": "Length is area divided by width. The numerator factors as $(x+4)(x+5)$, so cancelling $x+4$ leaves $x+5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2+4x}{x+4}$ for $x\\ne-4$.", "answer": "x", "solution_sketch": "Factor out $x$ in the numerator: $x^2+4x=x(x+4)$. Cancelling $x+4$ from the top and the bottom leaves just $x$.", "answer_contract": {"kind": "exact"}},
      {"problem": "The total cost of some tickets is $x^2-x-12$ dollars and each ticket costs $x-4$ dollars, with $x>4$. How many tickets were bought?", "answer": "x+3", "solution_sketch": "The number of tickets is the total cost divided by the price of one ticket. Since $x^2-x-12=(x-4)(x+3)$, cancelling $x-4$ leaves $x+3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam cancels the $x$ in $\\dfrac{x^2-25}{x+5}$ against the $x$ in the denominator and gets $\\dfrac{x-25}{5}$. What is the correct simplification?", "answer": "x-5", "solution_sketch": "Sam cancelled a term, not a factor. Factoring gives $x^2-25=(x-5)(x+5)$, and cancelling the factor $x+5$ leaves $x-5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{2x^2+10x}{x+5}$ for $x\\ne-5$.", "answer": "2*x", "solution_sketch": "Factor the numerator: $2x^2+10x=2x(x+5)$. Cancelling the common factor $x+5$ from the top and the bottom leaves $2x$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Factor numerator and denominator", "key_prerequisites": ["factoring-trinomials"], "constraints": "numerator and denominator both factor into linear binomials with integer roots; exactly one factor cancels", "step_check": {"step": "Cancel the common factor $x+5$", "question": "Why is $x-3$ on top not cancelled against $x-5$ on the bottom?", "options": ["The numbers $3$ and $5$ have no common factor, so nothing cancels", "Only equal factors cancel, and $x-3$ and $x-5$ are different factors", "A factor on top may cancel only with a factor on the bottom that is larger"], "answer": "Only equal factors cancel, and $x-3$ and $x-5$ are different factors", "why": "Cancelling divides top and bottom by one shared factor; $x+5$ is shared, but $x-3$ and $x-5$ are different expressions, so $\\frac{x-3}{x-5}$ stays."}, "exemplars": [
      {"problem": "Simplify $\\dfrac{x^2-4}{x^2+4x+4}$ for $x\\ne-2$.", "answer": "(x-2)/(x+2)", "solution_sketch": "Factor to $\\frac{(x-2)(x+2)}{(x+2)^2}$. Cancel one factor $x+2$ from the top and the bottom, which leaves $\\frac{x-2}{x+2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-x-6}{x^2-9}$ for $x\\ne\\pm3$.", "answer": "(x+2)/(x+3)", "solution_sketch": "Factor to $\\frac{(x-3)(x+2)}{(x-3)(x+3)}$. Then cancel the common factor $x-3$, which leaves $\\frac{x+2}{x+3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A garden has area $x^2+3x-10$ square meters and a patio has area $x^2-4$ square meters. How many times as large as the patio is the garden?", "answer": "(x+5)/(x+2)", "solution_sketch": "Divide the garden area by the patio area. Factoring gives $\\frac{(x+5)(x-2)}{(x-2)(x+2)}$, and cancelling $x-2$ leaves $\\frac{x+5}{x+2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{2x^2+6x}{x^2+3x}$ for $x\\ne0,-3$.", "answer": "2", "solution_sketch": "Factoring gives $\\frac{2x(x+3)}{x(x+3)}$. Both common factors $x$ and $x+3$ cancel, which leaves only the number $2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A trip of $x^2-x-12$ kilometers takes $x^2-16$ minutes, with $x>4$. What is the average speed in kilometers per minute?", "answer": "(x+3)/(x+4)", "solution_sketch": "Speed is distance divided by time. Factoring gives $\\frac{(x-4)(x+3)}{(x-4)(x+4)}$, so cancelling $x-4$ leaves $\\frac{x+3}{x+4}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-6x+9}{x^2-3x}$ for $x\\ne0,3$.", "answer": "(x-3)/x", "solution_sketch": "The numerator is $(x-3)^2$ and the denominator is $x(x-3)$. Cancel one factor $x-3$ to leave $\\frac{x-3}{x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam cancels the $x^2$ in $\\dfrac{x^2-4}{x^2-5x+6}$ and writes $\\dfrac{-4}{-5x+6}$. What is the correct simplification?", "answer": "(x+2)/(x-3)", "solution_sketch": "Sam cancelled terms of sums, which is not allowed. Factoring gives $\\frac{(x-2)(x+2)}{(x-2)(x-3)}$, and cancelling $x-2$ leaves $\\frac{x+2}{x-3}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Opposite factors", "key_prerequisites": ["factoring-gcf", "difference-of-squares"], "constraints": "one factor pair of the form (a - x) and (x - a)", "step_check": {"step": "The denominator is $-(x-13)$", "question": "Why is $13-x$ written as $-(x-13)$?", "options": ["A minus sign in front means the expression is always negative", "The terms $13$ and $x$ may be swapped in any subtraction without a sign change", "Taking out $-1$ gives $-(x-13)=-x+13$, which is the same as $13-x$"], "answer": "Taking out $-1$ gives $-(x-13)=-x+13$, which is the same as $13-x$", "why": "Multiplying $x-13$ by $-1$ gives $-x+13=13-x$, so $13-x$ and $x-13$ are opposites; swapping them without the minus sign would change the value."}, "try_first": {"problem": "What is the value of $\\dfrac{9-x}{x-9}$ when $x=12$?", "answer_contract": {"kind": "exact"}, "answer": "-1", "reveal": "Here $9-x=-3$ and $x-9=3$, so the quotient is $-1$. For any $x$ the two parts are opposites, so $\\frac{9-x}{x-9}$ always equals $-1$."}, "exemplars": [
      {"problem": "Simplify $\\dfrac{5-x}{x-5}$ for $x\\ne5$.", "answer": "-1", "solution_sketch": "Write the numerator as $5-x=-(x-5)$. Cancelling the nonzero factor $x-5$ from the top and the bottom leaves $-1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-4}{2-x}$ for $x\\ne2$.", "answer": "-(x+2)", "solution_sketch": "Factor the numerator as $(x-2)(x+2)$ and write $2-x=-(x-2)$. Cancelling $x-2$ leaves $-(x+2)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{(3-x)^2}{x-3}$ for $x\\ne3$.", "answer": "x-3", "solution_sketch": "Squaring removes the minus sign, so $(3-x)^2=(x-3)^2$. Cancelling one factor $x-3$ leaves $x-3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A student finds the slope of the line through $(x,x^2)$ and $(4,16)$ as $\\dfrac{16-x^2}{x-4}$, with $x\\ne4$. Simplify this slope.", "answer": "-(x+4)", "solution_sketch": "Factor the numerator: $16-x^2=(4-x)(4+x)$. Since $4-x=-(x-4)$, cancelling the factor $x-4$ from the top and the bottom leaves $-(x+4)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "The average rate of change of $f(x)=x^2$ from $x=2$ to $x=t$ is $\\dfrac{f(2)-f(t)}{2-t}$, with $t\\ne2$. Simplify it.", "answer": "t+2", "solution_sketch": "The numerator is $4-t^2=(2-t)(2+t)$. The factor $2-t$ matches the denominator exactly, so cancelling it leaves $t+2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam simplifies $\\dfrac{x^2-9}{3-x}$ as $x+3$. What is the correct simplification?", "answer": "-(x+3)", "solution_sketch": "Sam missed the opposite factors. Since $3-x=-(x-3)$, cancelling $x-3$ from $(x-3)(x+3)$ leaves $-(x+3)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{2-x}{x^2-4}$ for $x\\ne\\pm2$.", "answer": "-1/(x+2)", "solution_sketch": "Write $2-x=-(x-2)$ and $x^2-4=(x-2)(x+2)$. Cancelling the common factor $x-2$ from the top and the bottom leaves $-\\frac{1}{x+2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{6-2x}{x^2-9}$ for $x\\ne\\pm3$.", "answer": "-2/(x+3)", "solution_sketch": "Write $6-2x=-2(x-3)$ and $x^2-9=(x-3)(x+3)$. Cancelling the common factor $x-3$ from the top and the bottom leaves $-\\frac{2}{x+3}$.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
