      {"problem": "In a triangle $A=75^\\circ$, $B=75^\\circ$, and $a=\\sqrt6+\\sqrt2$. Find $c$. Use $\\sin75^\\circ=(\\sqrt6+\\sqrt2)/4$.", "answer": "2", "solution_sketch": "The third angle is $30^\\circ$; $c=a(1/2)/\\sin75^\\circ=\\frac{4}{2}=2$.", "answer_contract": {"kind": "exact"}}, {"problem": "In a triangle $A=30^\\circ$, $B=105^\\circ$, $c=5\\sqrt2$. Find $a$.", "answer": "5", "solution_sketch": "The third angle is $45^\\circ$; $a=5\\sqrt2(1/2)/(\\sqrt2/2)=5$.", "answer_contract": {"kind": "exact"}}
