      {"problem": "A pipe fills a tank in $6$ hours; a drain empties it in $10$. How many hours to fill with both open?", "answer": "15", "solution_sketch": "Net rate is $1/6-1/10=1/15>0$ tank per hour, so time is $15$ hours.", "answer_contract": {"kind": "exact"}}, {"problem": "A cyclist rides $12$ km out at $x$ km/h and back at $x-2$ km/h in $5$ hours. Find $x>2$.", "answer": "6", "solution_sketch": "$12/x+12/(x-2)=5$ gives $5x^2-34x+24=(x-6)(5x-4)=0$. Only $6$ exceeds $2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tank starts half full. An inlet supplies $1/4$ tank per hour and a drain removes $1/8$. How many hours until full?", "answer": "4", "solution_sketch": "Net rate is $1/8$ tank per hour; the missing half takes $(1/2)/(1/8)=4$ hours.", "answer_contract": {"kind": "exact"}}, {"problem": "A boat covers $12$ km downstream at $8$ km/h and returns at $4$ km/h. Find the total travel time in hours.", "answer": "9/2", "solution_sketch": "Add the two travel times, since the speeds differ: $12/8+12/4=3/2+3=9/2$.", "answer_contract": {"kind": "exact"}}
