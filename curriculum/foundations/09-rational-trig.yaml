          - problem: 'Convert $2\pi/3$ radians to degrees.'
            answer: "120°"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°"}
    diagnostic_exemplar:
      problem: 'Convert $30^\circ$ to radians.'
      answer: "π/6"
      solution_sketch: 'Multiply by $\frac{\pi}{180}$: $\frac{30\pi}{180} = \frac{\pi}{6}$.'
    anki_seeds:
      - front: "To convert degrees to radians, multiply by..."
        back: "π/180"
        type: basic
      - front: "To convert radians to degrees, multiply by..."
        back: "180/π"
        type: basic

  - id: coterminal-angles
    name: Standard Position and Coterminal Angles
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: radians-degrees
        weight: 0.7
        key: true
      - id: coordinate-plane
        weight: 0.4
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Quadrant of an angle in standard position
        key_prerequisites: [radians-degrees, coordinate-plane]
        constraints: "angles in whole degrees from 0 to 360, or simple multiples of π/6 and π/4; the answer is the quadrant number 1-4"
        exemplars:
          - problem: 'In which quadrant does a $135^\circ$ angle in standard position terminate? Answer with the quadrant number $1$, $2$, $3$, or $4$.'
            answer: "2"
            solution_sketch: '$90^\circ < 135^\circ < 180^\circ$, so it terminates in Quadrant II.'
          - problem: 'In which quadrant does a $300^\circ$ angle terminate? Answer with the quadrant number $1$, $2$, $3$, or $4$.'
            answer: "4"
            solution_sketch: '$270^\circ < 300^\circ < 360^\circ$, so it terminates in Quadrant IV.'
          - problem: 'In which quadrant does an angle of $\frac{5\pi}{6}$ terminate? Answer with the quadrant number $1$, $2$, $3$, or $4$.'
            answer: "2"
            solution_sketch: '$\frac{5\pi}{6} = 150^\circ$, between $90^\circ$ and $180^\circ$: Quadrant II.'
      - id: kp2
        name: Coterminal angles in degrees
        key_prerequisites: [integer-addition-subtraction]
        constraints: "answers between 0° and 360°"
        exemplars:
          - problem: 'Find the angle between $0^\circ$ and $360^\circ$ coterminal with $-45^\circ$.'
            answer: "315°"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°"}
            solution_sketch: '$-45 + 360 = 315$.'
          - problem: 'Find the angle between $0^\circ$ and $360^\circ$ coterminal with $400^\circ$.'
            answer: "40°"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°"}
          - problem: 'Find the angle between $0^\circ$ and $360^\circ$ coterminal with $780^\circ$.'
            answer: "60°"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°"}
            solution_sketch: '$780 - 720 = 60$.'
      - id: kp3
        name: Coterminal angles in radians
        key_prerequisites: [radians-degrees]
        constraints: "add or subtract 2π once; inputs are simple multiples of π/6, π/4 and π/3; answers lie in [0, 2π)"
        exemplars:
          - problem: 'Find the angle in $[0, 2\pi)$ coterminal with $\frac{9\pi}{4}$.'
            answer: "π/4"
            solution_sketch: '$\frac{9\pi}{4} - 2\pi = \frac{\pi}{4}$.'
          - problem: 'Find the angle in $[0, 2\pi)$ coterminal with $-\frac{\pi}{3}$.'
            answer: "5π/3"
    diagnostic_exemplar:
      problem: 'Find the angle in $[0, 2\pi)$ coterminal with $-\frac{2\pi}{3}$.'
      answer: "4π/3"
      solution_sketch: 'Add one full turn: $-\frac{2\pi}{3} + \frac{6\pi}{3} = \frac{4\pi}{3}$.'
    anki_seeds:
      - front: "Coterminal angles differ by..."
        back: "a whole-number multiple of 360° (2π radians)."
        type: basic

