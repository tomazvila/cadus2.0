            solution_sketch: '$\text{hypotenuse} = \text{leg} \cdot \sqrt{2}$.'
          - problem: 'In a 45-45-90 triangle with hypotenuse $8$, find each leg.'
            answer: "4√2"
      - id: kp2
        name: 30-60-90 triangles
        key_prerequisites: [right-triangle-trig]
