      {"problem": "Two equal printers each finish a batch in $8$ hours. How long for one batch together, in hours?", "answer": "4", "solution_sketch": "Equal rates double to $2/8=1/4$ batch per hour; the time halves to $4$ hours.", "answer_contract": {"kind": "exact"}}, {"problem": "One painter needs $10$ hours for a room and another needs $15$. They start with half the room already painted. How many hours together to finish it?", "answer": "3", "solution_sketch": "Their rate is $1/10+1/15=1/6$ room per hour; the remaining half takes $(1/2)/(1/6)=3$ hours.", "answer_contract": {"kind": "exact"}}
