      - id: right-triangle-trig
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Angle of elevation problems
        key_prerequisites: [solving-right-triangles-sides]
        constraints: "give the needed trig value; keep exact answers where possible"
        exemplars:
          - problem: 'A $10$ m ladder leans against a wall at $60^\circ$ to the ground. How high up the wall does it reach? Use $\sin 60^\circ = \frac{\sqrt{3}}{2}$.'
            answer: "5√3 m"
            answer_contract: {kind: exact}
            solution_sketch: '$\text{height} = 10 \sin 60^\circ = 5\sqrt{3}$.'
          - problem: 'From $100$ m away, the angle of elevation to a tower top is $45^\circ$. How tall is the tower? Use $\tan 45^\circ = 1$.'
            answer: "100 m"
            answer_contract: {kind: exact}
      - id: kp2
        name: Angle of depression problems
        key_prerequisites: [solving-right-triangles-sides]
        constraints: "the angle of depression from a height equals the angle of elevation from the ground; the needed trig value is given; metric lengths"
        exemplars:
          - problem: 'From the top of a $50$ m cliff, the angle of depression to a boat is $30^\circ$. Find the horizontal distance to the boat. Use $\tan 30^\circ = \frac{\sqrt{3}}{3}$.'
            answer: "50√3 m"
            answer_contract: {kind: exact}
            solution_sketch: 'Distance $= \frac{50}{\tan 30^\circ} = 50\sqrt{3}$.'
          - problem: 'A plane at altitude $2000$ m sights a runway at a $45^\circ$ angle of depression. Find the horizontal ground distance. Use $\tan 45^\circ = 1$.'
            answer: "2000 m"
            answer_contract: {kind: exact}
      - id: kp3
        name: Find the angle
        key_prerequisites: [right-triangle-trig]
        constraints: "both sides fixing the angle are given, so the tangent is an exact special value (1, √3 or √3/3); answers are 30, 45 or 60 degrees"
        exemplars:
          - problem: 'A $30$ m tree casts a $30$ m shadow. Find the angle of elevation of the sun.'
            answer: "45°"
            answer_contract: {kind: exact}
            solution_sketch: '$\tan \theta = \frac{30}{30} = 1$.'
          - problem: 'A ramp rises $5$ m over a horizontal run of $5\sqrt{3}$ m. Find its angle with the ground.'
            answer: "30°"
            answer_contract: {kind: exact}
            solution_sketch: '$\tan \theta = \frac{5}{5\sqrt{3}} = \frac{\sqrt{3}}{3}$.'
    diagnostic_exemplar:
      problem: 'From the top of a $40$ m lighthouse the angle of depression to a boat is $\theta$, and the boat is $40\sqrt{3}$ m from the foot of the lighthouse. Find $\theta$.'
      answer: "30°"
      solution_sketch: '$\tan\theta = \frac{40}{40\sqrt{3}} = \frac{1}{\sqrt{3}}$.'
    anki_seeds:
      - front: "The angle of depression from A to B equals..."
        back: "the angle of elevation from B to A (alternate interior angles)."
        type: basic

  - id: trig-applications
    name: Right-Triangle Trigonometry Applications
    core: false                # supplemental applications capstone
    difficulty: 0.75
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: angle-of-elevation-depression
        weight: 0.7
        key: true
      - id: right-triangle-trig
        weight: 0.5
        key: true
      - id: special-right-triangles
        weight: 0.3
      - id: multi-step-equations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Distances via trig ratios
        key_prerequisites: [right-triangle-trig, special-right-triangles]
        constraints: "one right triangle in a metric context; the needed trig value is given, or the sides form a Pythagorean triple; exact answers"
        exemplars:
          - problem: 'A ramp rises $3$ m over a horizontal run of $4$ m. Find the length of the ramp.'
            answer: "5 m"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m"}
            solution_sketch: '$\sqrt{3^2 + 4^2} = 5$.'
          - problem: 'A kite string is $50$ m long at $30^\circ$ to the ground. How high is the kite? Use $\sin 30^\circ = \frac{1}{2}$.'
            answer: "25 m"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m"}
      - id: kp2
        name: Multi-step problems
        key_prerequisites: [angle-of-elevation-depression]
        constraints: "two right triangles sharing a side, or a triangle needing Pythagoras before a ratio; exact answers, radicals allowed"
        exemplars:
          - problem: 'A $26$ m guy wire runs from the ground to the top of a tower, anchored $24$ m from the base. Find the tower height and $\tan \theta$ for the wire''s angle of elevation $\theta$.'
            answer: "height 10 m, tan θ = 5/12"
            solution_sketch: '$\sqrt{26^2 - 24^2} = 10$; $\tan \theta = \frac{10}{24} = \frac{5}{12}$.'
          - problem: 'From a point, the angle of elevation to the top of a building is $45^\circ$. From $20$ m closer, it is $60^\circ$. Find the height. Use $\tan 60^\circ = \sqrt{3}$.'
            answer: "30 + 10√3 m (≈ 47.3 m)"
            solution_sketch: '$h = d$ and $h = (d - 20)\sqrt{3}$; solve $d = \sqrt{3}(d-20)$.'
      - id: kp3
        name: Solve for angles in context
        key_prerequisites: [right-triangle-trig, angle-of-elevation-depression]
        constraints: "the two sides that fix the angle are given; exact special angles, or a calculator value rounded to one decimal place"
        exemplars:
          - problem: 'A $10$ m ladder reaches $5$ m up a wall. Find its angle with the ground.'
            answer: "30°"
            solution_sketch: '$\sin \theta = \frac{5}{10} = \frac{1}{2}$.'
          - problem: 'A road rises $8$ m for every $100$ m of horizontal distance. Find its angle of incline to the nearest tenth of a degree.'
            answer: "≈ 4.6°"
            solution_sketch: '$\theta = \tan^{-1}(0.08)$.'
    diagnostic_exemplar:
      problem: 'From a point on level ground the angle of elevation to the top of a mast is $30^\circ$; from a point $20$ m closer it is $60^\circ$. Find the height of the mast. Use $\tan 30^\circ = \frac{\sqrt{3}}{3}$ and $\tan 60^\circ = \sqrt{3}$.'
      answer: "10√3 m (≈ 17.3 m)"
      solution_sketch: 'With $d$ the far distance, $d = h\sqrt{3}$ and $d - 20 = \frac{h}{\sqrt{3}}$; eliminating $d$ gives $\frac{2h}{\sqrt{3}} = 20$.'
    anki_seeds:
      - front: "Choosing the trig ratio in an application: pick the ratio that links..."
        back: "the known side and the wanted side — sin = opp/hyp, cos = adj/hyp, tan = opp/adj (SOH-CAH-TOA)."
        type: basic
      - front: "The angle of depression from A down to B equals..."
        back: "the angle of elevation from B up to A (alternate angles with the horizontal)."
        type: basic
      - front: "To find an angle from two known sides, use..."
        back: "an inverse trig function, e.g. θ = tan⁻¹(opposite/adjacent)."
        type: basic

  - id: radians-degrees
