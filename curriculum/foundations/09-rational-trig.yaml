      {"problem": "Divide $\\frac{5}{x^2} \\div \\frac{10}{x}$.", "answer": "1/(2*x)", "solution_sketch": "Multiply by the reciprocal: $\\frac{5}{x^2}\\cdot\\frac{x}{10}=\\frac{5x}{10x^2}$. Halve the numbers and cancel one $x$ to get $\\frac{1}{2x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ribbon $\\frac{8}{x}$ metres long is cut into pieces that are each $\\frac{2}{x^2}$ metres long. How many pieces are there?", "answer": "4*x", "solution_sketch": "The number of pieces is the total length divided by the piece length: $\\frac{8}{x}\\div\\frac{2}{x^2}=\\frac{8}{x}\\cdot\\frac{x^2}{2}$. This reduces to $4x$ pieces.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2}{4} \\div \\frac{x}{8}$.", "answer": "2*x", "solution_sketch": "Multiply by $\\frac{8}{x}$ to get $\\frac{8x^2}{4x}$. Divide $8$ by $4$ and cancel one $x$, which leaves $2x$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has an area of $12x^3$ square metres and a width of $4x$ metres. What is its length?", "answer": "3*x^2", "solution_sketch": "Area is length times width, so the length is the area divided by the width: $\\frac{12x^3}{4x}$. This equals $3x^2$ metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam divides $\\frac{x}{2}$ by $\\frac{x}{6}$ and writes $\\frac{x^2}{12}$. What is the correct quotient?", "answer": "3", "solution_sketch": "Sam multiplied the two fractions and did not flip the divisor. The correct work is $\\frac{x}{2}\\cdot\\frac{6}{x}=\\frac{6x}{2x}$, which is $3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tank holds $\\frac{15n^2}{p}$ litres of water. A pump removes $\\frac{5n}{p^2}$ litres every minute. How many minutes does it take to empty the tank?", "answer": "3*n*p", "solution_sketch": "The time is the volume divided by the rate: $\\frac{15n^2}{p}\\cdot\\frac{p^2}{5n}$. Reduce $15$ and $5$ to $3$, cancel one $n$ and one $p$, and the time is $3np$ minutes.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{14a}{b^2} \\div \\frac{7a^2}{b}$.", "answer": "2/(a*b)", "solution_sketch": "Flip the divisor: $\\frac{14a}{b^2}\\cdot\\frac{b}{7a^2}=\\frac{14ab}{7a^2b^2}$. Divide $14$ by $7$ and cancel one $a$ and one $b$, which leaves $\\frac{2}{ab}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A cyclist rides for $\\frac{x}{2}$ hours at a speed of $\\frac{12}{x^2}$ kilometres per hour. How far does the cyclist ride?", "answer": "6/x", "solution_sketch": "Distance is speed times time, so multiply: $\\frac{12}{x^2}\\cdot\\frac{x}{2}=\\frac{12x}{2x^2}$. This reduces to $\\frac{6}{x}$ kilometres.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Divide with binomial factors", "key_prerequisites": ["multiplying-rational-expressions", "dividing-fractions"], "constraints": "flip the divisor, then cancel matching linear binomials; no trinomials at this level", "step_check": {"step": "Cancel $x+7$", "question": "Why can the expression $x+7$ be cancelled in this product?", "options": ["It appears in both fractions, and any repeated term may be removed from a sum or a product", "Any binomial that shows up twice in the problem, in either fraction, may be removed", "It is a whole factor of a numerator and of a denominator, so it cancels as a pair", "It is the only factor the two fractions share, and sharing a factor is enough"], "answer": "It is a whole factor of a numerator and of a denominator, so it cancels as a pair", "why": "A factor on top and the same factor on the bottom make a fraction equal to $1$, which is why $\\frac{x+7}{x+7}$ drops out; terms inside a sum cannot be cancelled this way."}, "exemplars": [
      {"problem": "Divide $\\frac{x+1}{x-2} \\div \\frac{x+1}{x+2}$.", "answer": "(x+2)/(x-2)", "solution_sketch": "Invert the divisor and multiply: $\\frac{x+1}{x-2}\\cdot\\frac{x+2}{x+1}$. The factor $x+1$ cancels, which leaves $\\frac{x+2}{x-2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2-25}{x} \\div \\frac{x-5}{x}$.", "answer": "x+5", "solution_sketch": "Multiply by $\\frac{x}{x-5}$ and write $x^2-25=(x-5)(x+5)$. The factors $x$ and $x-5$ cancel, which leaves $x+5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangular garden has an area of $\\frac{x+4}{x-1}$ square metres and a width of $\\frac{x+4}{x+1}$ metres. What is its length?", "answer": "(x+1)/(x-1)", "solution_sketch": "Length is area divided by width: $\\frac{x+4}{x-1}\\cdot\\frac{x+1}{x+4}$. The factor $x+4$ cancels, so the length is $\\frac{x+1}{x-1}$ metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{2}{x-1} \\div \\frac{6}{1-x}$.", "answer": "-1/3", "solution_sketch": "Multiply by $\\frac{1-x}{6}$ to get $\\frac{2(1-x)}{6(x-1)}$. Because $1-x=-(x-1)$, the fraction becomes $-\\frac{2}{6}$, which is $-\\frac{1}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A train travels $\\frac{x^2-36}{x}$ kilometres at an average speed of $\\frac{x-6}{x}$ kilometres per hour. How many hours does the trip take?", "answer": "x+6", "solution_sketch": "Time is distance divided by speed: $\\frac{x^2-36}{x}\\cdot\\frac{x}{x-6}$. Write $x^2-36=(x-6)(x+6)$ and cancel $x$ and $x-6$ to get $x+6$ hours.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam writes $\\frac{x+3}{x} \\div \\frac{x+3}{x+1} = \\frac{x}{x+1}$. What is the correct quotient?", "answer": "(x+1)/x", "solution_sketch": "Sam inverted the first fraction and not the divisor. The correct work is $\\frac{x+3}{x}\\cdot\\frac{x+1}{x+3}$, and cancelling $x+3$ leaves $\\frac{x+1}{x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $(x+3)^2$ by $\\frac{x+3}{x}$.", "answer": "x*(x+3)", "solution_sketch": "Write the divisor as a fraction and multiply by its reciprocal $\\frac{x}{x+3}$. One factor $x+3$ of the square cancels, which leaves $x(x+3)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A hose delivers $\\frac{x+2}{x}$ litres per minute for $\\frac{x^2}{x+2}$ minutes. How many litres does it deliver?", "answer": "x", "solution_sketch": "Volume is rate times time, so multiply: $\\frac{x+2}{x}\\cdot\\frac{x^2}{x+2}$. The factors $x+2$ and one $x$ cancel, so the hose delivers $x$ litres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x-4}{3} \\div \\frac{4-x}{9}$.", "answer": "-3", "solution_sketch": "Multiply by $\\frac{9}{4-x}$ to get $\\frac{9(x-4)}{3(4-x)}$. Since $x-4$ and $4-x$ are opposites, the quotient is $-\\frac{9}{3}=-3$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Divide with trinomial factoring", "key_prerequisites": ["multiplying-rational-expressions"], "constraints": "one numerator is a monic trinomial factoring over the integers; flip, factor, then cancel", "step_check": {"step": "The integers $5$ and $-2$ have product $-10$ and sum $3$", "question": "Why do $5$ and $-2$ give the factors $(x+5)(x-2)$ of $x^2+3x-10$?", "options": ["Their sum is the coefficient of $x$ and their product is the constant term", "Their sum is the constant term and their product is the coefficient of $x$", "Their product is the coefficient of $x^2$, which is $1$, and their sum is $3$", "They are the two values of $x$ that make the divisor $x-2$ equal to zero"], "answer": "Their sum is the coefficient of $x$ and their product is the constant term", "why": "Expanding $(x+5)(x-2)$ gives $x^2+(5-2)x+5\\cdot(-2)$, so the sum of the two numbers is the middle coefficient and the product is the constant term."}, "exemplars": [
      {"problem": "Divide $(x^2+7x+12)$ by $(x+3)$.", "answer": "x+4", "solution_sketch": "Write the divisor as a fraction and factor the trinomial: $x^2+7x+12=(x+3)(x+4)$. Cancelling $x+3$ leaves $x+4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2+7x+10}{x+3} \\div \\frac{x+2}{x+3}$.", "answer": "x+5", "solution_sketch": "Factor $x^2+7x+10=(x+2)(x+5)$ and multiply by the reciprocal $\\frac{x+3}{x+2}$. The factors $x+2$ and $x+3$ cancel, which leaves $x+5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $(x^2-x-12)$ by $(x^2+6x+9)$.", "answer": "(x-4)/(x+3)", "solution_sketch": "Factor the first as $(x-4)(x+3)$ and the second as $(x+3)^2$. One factor $x+3$ cancels, which leaves $\\frac{x-4}{x+3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has an area of $x^2+5x+6$ square metres and a length of $x+3$ metres. What is its width?", "answer": "x+2", "solution_sketch": "Width is area divided by length: $\\frac{x^2+5x+6}{x+3}$. Factor the numerator as $(x+2)(x+3)$ and cancel $x+3$, so the width is $x+2$ metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x}{x+1} \\div \\frac{x^2+5x+6}{x+1}$.", "answer": "x/((x+2)*(x+3))", "solution_sketch": "Multiply by the reciprocal $\\frac{x+1}{x^2+5x+6}$ and factor $x^2+5x+6=(x+2)(x+3)$. The factor $x+1$ cancels, which leaves $\\frac{x}{(x+2)(x+3)}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $(x^2-2x-8)$ by $(4-x)$.", "answer": "-(x+2)", "solution_sketch": "Factor the numerator as $(x-4)(x+2)$. Since $4-x=-(x-4)$, cancelling the common factor $x-4$ leaves $-(x+2)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A delivery van drives $\\frac{x^2+8x+12}{x+1}$ kilometres at an average speed of $\\frac{x+2}{x+1}$ kilometres per hour. How many hours does the drive take?", "answer": "x+6", "solution_sketch": "Time is distance divided by speed: $\\frac{x^2+8x+12}{x+1}\\cdot\\frac{x+1}{x+2}$. Factor $x^2+8x+12=(x+2)(x+6)$ and cancel $x+1$ and $x+2$ to get $x+6$ hours.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam divides $\\frac{x^2-5x+6}{x+4}$ by $\\frac{x-3}{x+4}$ and gets $x^2-5x+6$. What is the correct quotient?", "answer": "x-2", "solution_sketch": "Sam cancelled $x+4$ but left the numerator $x^2-5x+6=(x-2)(x-3)$ as it was. Multiplying by the reciprocal $\\frac{x+4}{x-3}$ also cancels $x-3$, so the correct quotient is $x-2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tile has a length of $\\frac{x^2-9}{x}$ centimetres and a width of $\\frac{x}{x-3}$ centimetres. What is its area?", "answer": "x+3", "solution_sketch": "Area is length times width: $\\frac{(x-3)(x+3)}{x}\\cdot\\frac{x}{x-3}$. Cancelling $x$ and $x-3$ leaves $x+3$ square centimetres.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "multiplying-dividing-rational-expressions", "name": "Multiplying and Dividing Rational Expressions", "core": false, "difficulty": 0.65, "drill": false, "answer_kind": "expression", "expected_time_secs": 150, "prerequisites": [{"id": "multiplying-rational-expressions", "weight": 0.7, "key": true}, {"id": "dividing-rational-expressions", "weight": 0.7, "key": true}, {"id": "factoring-trinomials", "weight": 0.4}], "diagnostic_exemplar": {"problem": "Simplify $\\frac{x^2 - 4}{x + 1} \\cdot \\frac{x^2 - 1}{x - 2} \\div (x + 2)$.", "answer": "x - 1", "solution_sketch": "Factor everything and treat $\\div (x + 2)$ as $\\times \\frac{1}{x + 2}$; then $(x - 2)$, $(x + 1)$ and $(x + 2)$ all cancel."}, "anki_seeds": [{"front": "In a chain of × and ÷ of rational expressions, first...", "back": "rewrite every division as multiplication by the reciprocal, then factor everything and cancel.", "type": "basic"}, {"front": "When multiplying rational expressions, cancel only...", "back": "common factors of a numerator and a denominator — never terms inside a sum.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Products needing full factoring", "key_prerequisites": ["multiplying-rational-expressions", "factoring-trinomials"], "constraints": "every numerator and denominator factors into linear binomials with integer roots; the answer is one reduced fraction", "step_check": {"step": "one numerator-denominator pair of $x+5$", "question": "Why is only one pair of $x+5$ cancelled and not both factors in the denominator?", "options": ["Each cancellation removes one factor from the top, so only one cancellation is allowed per factor", "The second $x+5$ comes from a different fraction, so it can never be cancelled at all", "A repeated factor in a denominator is a square, and a square must always stay in the denominator", "The numerator has one factor $x+5$, so it can match only one factor in the denominator"], "answer": "The numerator has one factor $x+5$, so it can match only one factor in the denominator", "why": "The product has one factor $x+5$ on top and two on the bottom, so one pair cancels and one $x+5$ stays in the denominator of $\\frac{x-2}{x+5}$."}, "exemplars": [
      {"problem": "Multiply $\\frac{x^2-x-6}{x^2-4} \\cdot \\frac{x+2}{x-3}$.", "answer": "(x+2)/(x-2)", "solution_sketch": "Factor both polynomials: $\\frac{(x-3)(x+2)}{(x-2)(x+2)}\\cdot\\frac{x+2}{x-3}$. Cancel $x-3$ and one $x+2$, which leaves $\\frac{x+2}{x-2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\frac{x^2+5x+4}{x+3} \\cdot \\frac{x+3}{x+4}$.", "answer": "x+1", "solution_sketch": "Factor the trinomial as $(x+1)(x+4)$. The factors $x+3$ and $x+4$ each cancel once, which leaves $x+1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A banner is $\\frac{x^2-16}{x+2}$ metres long and $\\frac{x+2}{x+4}$ metres wide. What is its area?", "answer": "x-4", "solution_sketch": "Area is length times width: $\\frac{(x-4)(x+4)}{x+2}\\cdot\\frac{x+2}{x+4}$. The factors $x+2$ and $x+4$ cancel, so the area is $x-4$ square metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\frac{x^2-9}{x^2+2x} \\cdot \\frac{x+2}{x+3}$.", "answer": "(x-3)/x", "solution_sketch": "Factor $x^2-9=(x-3)(x+3)$ and $x^2+2x=x(x+2)$. The factors $x+2$ and $x+3$ cancel, which leaves $\\frac{x-3}{x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A field is $\\frac{x^2+x-12}{x}$ metres long and $\\frac{x^2}{x^2-9}$ metres wide. What is its area?", "answer": "x*(x+4)/(x+3)", "solution_sketch": "Factor $x^2+x-12=(x+4)(x-3)$ and $x^2-9=(x-3)(x+3)$. Cancel $x-3$ and one $x$, so the area is $\\frac{x(x+4)}{x+3}$ square metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\frac{x^2-5x+6}{x^2-4} \\cdot \\frac{x+2}{x-3}$.", "answer": "1", "solution_sketch": "Factor to $\\frac{(x-2)(x-3)}{(x-2)(x+2)}\\cdot\\frac{x+2}{x-3}$. Every factor cancels with its partner, so the product is $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam multiplies $\\frac{x^2-6x+8}{x^2-1} \\cdot \\frac{x+1}{x-4}$ and writes $\\frac{x-4}{x-1}$. What is the correct product?", "answer": "(x-2)/(x-1)", "solution_sketch": "Factor $x^2-6x+8=(x-2)(x-4)$ and $x^2-1=(x-1)(x+1)$. Cancel the common factors $x-4$ and $x+1$, which leaves $\\frac{x-2}{x-1}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Quotients needing full factoring", "key_prerequisites": ["dividing-rational-expressions", "factoring-trinomials"], "constraints": "flip the divisor first, then factor all four parts; monic quadratics with integer roots only", "step_check": {"step": "retaining the original denominator and divisor-zero exclusions $x\\ne-7,-5,-2,2$", "question": "Why is $x=2$ still excluded when the factor $x-2$ has cancelled?", "options": ["The answer $\\frac{x+2}{x+5}$ is undefined at $x=2$ because the numerator becomes $4$", "Every factor that cancels must be excluded as a rule, whatever the problem says", "The original expression is undefined at $x=2$, and cancelling does not change that", "Cancelling a factor makes the new expression equal to zero at $x=2$"], "answer": "The original expression is undefined at $x=2$, and cancelling does not change that", "why": "The original quotient has $x-2$ in a denominator or in the divisor, so it is undefined at $x=2$; the simplified fraction is defined there, but it is a different expression."}, "exemplars": [
      {"problem": "Divide $\\frac{x^2-9}{x^2+6x+5} \\div \\frac{x^2+10x+21}{x^2+12x+35}$.", "answer": "(x-3)/(x+1)", "solution_sketch": "Invert the divisor and factor all four quadratics: $\\frac{(x-3)(x+3)}{(x+1)(x+5)}\\cdot\\frac{(x+5)(x+7)}{(x+3)(x+7)}$. Cancel $x+3$, $x+5$ and $x+7$ to get $\\frac{x-3}{x+1}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2+2x-8}{x^2+6x} \\div \\frac{x^2+11x+28}{x^2+7x}$.", "answer": "(x-2)/(x+6)", "solution_sketch": "Invert and factor: $\\frac{(x+4)(x-2)}{x(x+6)}\\cdot\\frac{x(x+7)}{(x+4)(x+7)}$. Cancel $x$, $x+4$ and $x+7$ to get $\\frac{x-2}{x+6}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has an area of $\\frac{x^2-9}{x^2+x}$ square metres and a width of $\\frac{x-3}{x}$ metres. What is its length?", "answer": "(x+3)/(x+1)", "solution_sketch": "Length is area divided by width: $\\frac{(x-3)(x+3)}{x(x+1)}\\cdot\\frac{x}{x-3}$. Cancel $x$ and $x-3$, so the length is $\\frac{x+3}{x+1}$ metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2-x-12}{x^2-9} \\div \\frac{x^2-3x-4}{x^2-x-6}$.", "answer": "(x+2)/(x+1)", "solution_sketch": "Invert the divisor and factor: $\\frac{(x-4)(x+3)}{(x-3)(x+3)}\\cdot\\frac{(x-3)(x+2)}{(x-4)(x+1)}$. Cancel $x-4$, $x+3$ and $x-3$ to get $\\frac{x+2}{x+1}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tank holds $\\frac{x^2+7x+12}{x^2-1}$ litres of water. A pump removes $\\frac{x+3}{x-1}$ litres every minute. How many minutes does it take to empty the tank?", "answer": "(x+4)/(x+1)", "solution_sketch": "Time is volume divided by rate: $\\frac{(x+3)(x+4)}{(x-1)(x+1)}\\cdot\\frac{x-1}{x+3}$. Cancel $x+3$ and $x-1$, so the time is $\\frac{x+4}{x+1}$ minutes.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2-4}{x^2-4x+4} \\div \\frac{x^2+9x+14}{x^2+5x-14}$.", "answer": "1", "solution_sketch": "Invert and factor: $\\frac{(x-2)(x+2)}{(x-2)^2}\\cdot\\frac{(x-2)(x+7)}{(x+2)(x+7)}$. Every factor cancels, so the quotient is $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam divides $\\frac{x^2-4}{x^2+3x}$ by $\\frac{x+2}{x}$ and gets $\\frac{(x-2)(x+2)^2}{x^2(x+3)}$. What is the correct quotient?", "answer": "(x-2)/(x+3)", "solution_sketch": "Sam multiplied the fractions and did not invert the divisor. The correct work is $\\frac{(x-2)(x+2)}{x(x+3)}\\cdot\\frac{x}{x+2}$, which cancels to $\\frac{x-2}{x+3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A strip of lawn is $\\frac{x^2-4x-5}{x+2}$ metres long and $\\frac{x+2}{x+1}$ metres wide. What is its area?", "answer": "x-5", "solution_sketch": "Area is length times width: $\\frac{(x-5)(x+1)}{x+2}\\cdot\\frac{x+2}{x+1}$. Cancel $x+2$ and $x+1$, so the area is $x-5$ square metres.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Combined multiply-and-divide chains", "key_prerequisites": ["multiplying-rational-expressions", "dividing-rational-expressions"], "constraints": "three factors chained by one multiplication and one division; everything cancels to a monomial or a binomial", "step_check": {"step": "Replace division by multiplication by $x/(x+5)$", "question": "Why is only the factor $(x+5)/x$ inverted, and not the other two factors?", "options": ["The first factor already has $x+2$ in its denominator, so it cannot be inverted again", "The division sign applies only to the fraction right after it, so only that divisor is inverted", "One inversion in a chain flips every factor of the product, so the other two are inverted as well", "Only the last fraction in a chain is ever inverted, whatever sign stands before it in the chain"], "answer": "The division sign applies only to the fraction right after it, so only that divisor is inverted", "why": "In $a\\cdot b\\div c$ the quantity $c$ is the divisor, so the chain becomes $a\\cdot b\\cdot\\frac{1}{c}$ and $a$ and $b$ stay as they are."}, "exemplars": [
      {"problem": "Simplify $\\frac{x}{x+1}\\cdot\\frac{x^2-1}{x}\\div(x-1)$.", "answer": "1", "solution_sketch": "The product of the first two factors is $x-1$, after $x$ and $x+1$ cancel. Dividing $x-1$ by $x-1$ leaves $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{x+2}{x}\\cdot\\frac{x^2}{x^2-4}\\div\\frac{1}{x-2}$.", "answer": "x", "solution_sketch": "Replace the division by multiplication by $x-2$ and factor $x^2-4=(x-2)(x+2)$. Cancel $x+2$, $x-2$ and one $x$, which leaves $x$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A bakery uses $\\frac{x^2-1}{x}$ kilograms of flour a day and bakes for $\\frac{x}{x+1}$ days. Each loaf takes $\\frac{x-1}{x^2}$ kilograms of flour. How many loaves does the bakery bake?", "answer": "x^2", "solution_sketch": "The flour used is $\\frac{x^2-1}{x}\\cdot\\frac{x}{x+1}=x-1$ kilograms. Dividing by $\\frac{x-1}{x^2}$ gives $(x-1)\\cdot\\frac{x^2}{x-1}$, so the bakery bakes $x^2$ loaves.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{x-3}{x+3}\\div\\frac{x^2-9}{x}\\cdot(x+3)$.", "answer": "x/(x+3)", "solution_sketch": "Invert the middle fraction: $\\frac{x-3}{x+3}\\cdot\\frac{x}{(x-3)(x+3)}\\cdot(x+3)$. Cancel $x-3$ and one $x+3$, which leaves $\\frac{x}{x+3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Ana cycles at $\\frac{x+3}{x}$ kilometres per hour for $\\frac{x^2}{x^2-9}$ hours. Ben cycles $\\frac{x}{x+3}$ kilometres. How many times as far as Ben did Ana cycle?", "answer": "(x+3)/(x-3)", "solution_sketch": "Ana covers $\\frac{x+3}{x}\\cdot\\frac{x^2}{(x-3)(x+3)}=\\frac{x}{x-3}$ kilometres. Dividing by the distance that Ben cycles gives $\\frac{x}{x-3}\\cdot\\frac{x+3}{x}=\\frac{x+3}{x-3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{2}{x}\\div\\frac{4}{x^2}\\cdot\\frac{3}{x}$.", "answer": "3/2", "solution_sketch": "Division gives $\\frac{2}{x}\\cdot\\frac{x^2}{4}=\\frac{x}{2}$. Multiplying by $\\frac{3}{x}$ cancels the remaining $x$ and leaves $\\frac{3}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Sam simplifies $\\frac{2}{x}\\div\\frac{x}{6}\\cdot\\frac{x^2}{3}$ and gets $\\frac{x^2}{9}$. What is the correct result?", "answer": "4", "solution_sketch": "Sam multiplied by $\\frac{x}{6}$ and did not invert it. The correct work is $\\frac{2}{x}\\cdot\\frac{6}{x}\\cdot\\frac{x^2}{3}=\\frac{12x^2}{3x^2}$, which is $4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{x^2-1}{x+3}\\div\\frac{x+1}{x^2-9}\\cdot\\frac{1}{x-1}$.", "answer": "x-3", "solution_sketch": "Invert the divisor and factor: $\\frac{(x-1)(x+1)}{x+3}\\cdot\\frac{(x-3)(x+3)}{x+1}\\cdot\\frac{1}{x-1}$. Cancel $x-1$, $x+1$ and $x+3$ to get $x-3$.", "answer_contract": {"kind": "exact"}}
