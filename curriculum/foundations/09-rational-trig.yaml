unit: rational-trig
course: foundations
module: "Rational Expressions & Trigonometry"
topics:
  - id: rational-expression-restrictions
    name: Excluded Values of Rational Expressions
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: quadratic-equations-factoring
        weight: 0.5
        key: true
      - id: two-step-equations
        weight: 0.4
      - id: fraction-basics
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Monomial and simple binomial denominators
        key_prerequisites: [fraction-basics]
        constraints: "denominators of degree at most 1 here; integer excluded values"
        exemplars:
          - problem: 'State the excluded value(s) of $\frac{5}{x}$.'
            answer: "x = 0"
          - problem: 'State the excluded value(s) of $\frac{x+2}{x-3}$.'
            answer: "x = 3"
            solution_sketch: 'The denominator is $0$ when $x = 3$.'
      - id: kp2
        name: Solve a linear denominator equal to zero
        key_prerequisites: [two-step-equations]
        constraints: "denominators of the form ax + b with small integer a and b; the excluded value is an integer or a simple fraction"
        exemplars:
          - problem: 'State the excluded value(s) of $\frac{7}{2x - 6}$.'
            answer: "x = 3"
          - problem: 'State the excluded value(s) of $\frac{1}{3x + 12}$.'
            answer: "x = -4"
      - id: kp3
        name: Factorable quadratic denominators
        key_prerequisites: [quadratic-equations-factoring]
        constraints: "denominators are factorable quadratics (difference of squares or monic trinomials) with two integer roots; give both excluded values"
        exemplars:
          - problem: 'State the excluded value(s) of $\frac{x+1}{x^2 - 9}$.'
            answer: "x = 3 and x = -3"
            solution_sketch: '$x^2 - 9 = (x-3)(x+3)$.'
          - problem: 'State the excluded value(s) of $\frac{x}{x^2 - 5x + 6}$.'
            answer: "x = 2 and x = 3"
    diagnostic_exemplar:
      problem: 'State the excluded value(s) of $\frac{x + 4}{x^2 - 7x + 12}$.'
      answer: "x = 3 and x = 4"
      solution_sketch: 'Factor the denominator: $(x - 3)(x - 4) = 0$.'
    anki_seeds:
      - front: "The excluded values of a rational expression are..."
        back: "the values that make the denominator zero."
        type: basic

  - id: simplifying-rational-monomials
    name: Simplifying Monomial Rational Expressions
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: equivalent-fractions
        weight: 0.7
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: negative-zero-exponents
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Reduce numeric coefficients
        key_prerequisites: [equivalent-fractions]
        constraints: "coefficients at most 20; single variable"
        exemplars:
          - problem: 'Simplify $\frac{6x^2}{9x}$.'
            answer: "2x/3"
            solution_sketch: '$\frac{6}{9} = \frac{2}{3}$ and $\frac{x^2}{x} = x$.'
          - problem: 'Simplify $\frac{8x}{12}$.'
            answer: "2x/3"
      - id: kp2
        name: Quotients of powers
        key_prerequisites: [exponent-product-quotient-rules]
        constraints: "one variable; subtract exponents, leaving the variable in the numerator or in the denominator; coefficients at most 20"
        exemplars:
          - problem: 'Simplify $\frac{x^5}{x^2}$.'
            answer: "x^3"
          - problem: 'Simplify $\frac{10x^3}{15x^5}$.'
            answer: "2/(3x^2)"
            solution_sketch: 'Reduce $\frac{10}{15}$ and cancel $x^3$ from top and bottom.'
      - id: kp3
        name: Several variables at once
        key_prerequisites: [exponent-product-quotient-rules, equivalent-fractions]
        constraints: "two or three variables with exponents at most 3; reduce the coefficients and each variable separately"
        exemplars:
          - problem: 'Simplify $\frac{12x^2 y}{18x y^2}$.'
            answer: "2x/(3y)"
          - problem: 'Simplify $\frac{4a^3 b}{6a}$.'
            answer: "2a^2·b/3"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{15x^3 y}{20x y^3}$.'
      answer: "3x^2/(4y^2)"
      solution_sketch: '$\frac{15}{20} = \frac{3}{4}$, $\frac{x^3}{x} = x^2$, and $\frac{y}{y^3} = \frac{1}{y^2}$.'
    anki_seeds:
      - front: "To simplify a monomial fraction, reduce the coefficients and..."
        back: "subtract exponents of like bases."
        type: basic

  - id: rational-expressions
    name: Simplifying Rational Expressions
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: simplifying-rational-monomials
        weight: 0.7
        key: true
      - id: factoring-trinomials
        weight: 0.6
        key: true
      - id: rational-expression-restrictions
        weight: 0.4
      - id: difference-of-squares
        weight: 0.4
      - id: factoring-gcf
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Factor, then cancel a common binomial
        key_prerequisites: [factoring-trinomials, difference-of-squares]
        constraints: "numerator is a difference of squares or a monic trinomial; the denominator is one of its linear factors; the answer is a binomial"
        exemplars:
          - problem: 'Simplify $\frac{x^2 - 9}{x + 3}$.'
            answer: "x - 3"
            solution_sketch: '$\frac{(x+3)(x-3)}{x+3}$.'
          - problem: 'Simplify $\frac{x^2 + 5x + 6}{x + 2}$.'
            answer: "x + 3"
      - id: kp2
        name: Factor numerator and denominator
        key_prerequisites: [factoring-trinomials]
        constraints: "numerator and denominator both factor into linear binomials with integer roots; exactly one factor cancels"
        exemplars:
          - problem: 'Simplify $\frac{x^2 - 4}{x^2 + 4x + 4}$.'
            answer: "(x - 2)/(x + 2)"
            solution_sketch: '$\frac{(x+2)(x-2)}{(x+2)^2}$.'
          - problem: 'Simplify $\frac{x^2 - x - 6}{x^2 - 9}$.'
            answer: "(x + 2)/(x + 3)"
      - id: kp3
        name: Opposite factors
        key_prerequisites: [factoring-gcf, difference-of-squares]
        constraints: "one factor pair of the form (a - x) and (x - a)"
        exemplars:
          - problem: 'Simplify $\frac{5 - x}{x - 5}$.'
            answer: "-1"
            solution_sketch: '$5 - x = -(x - 5)$.'
          - problem: 'Simplify $\frac{x^2 - 4}{2 - x}$.'
            answer: "-(x + 2)"
            solution_sketch: '$\frac{(x-2)(x+2)}{-(x-2)} = -(x+2)$.'
    diagnostic_exemplar:
      problem: 'Simplify $\frac{x^2 - 9}{6 - 2x}$.'
      answer: "-(x + 3)/2"
      solution_sketch: '$6 - 2x = -2(x - 3)$, and $x^2 - 9 = (x - 3)(x + 3)$; the $(x - 3)$ cancels and the minus sign survives.'
    anki_seeds:
      - front: "(a - b)/(b - a) = ?"
        back: "-1"
        type: basic

  - id: multiplying-rational-expressions
    name: Multiplying Rational Expressions
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: rational-expressions
        weight: 0.7
        key: true
      - id: multiplying-fractions
        weight: 0.7
        key: true
      - id: factoring-trinomials
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Multiply monomial rational expressions
        key_prerequisites: [multiplying-fractions]
        constraints: "coefficients at most 12; results must reduce to a single fraction"
        exemplars:
          - problem: 'Multiply $\frac{2}{x} \cdot \frac{x^2}{6}$.'
            answer: "x/3"
            solution_sketch: '$\frac{2x^2}{6x} = \frac{x}{3}$.'
          - problem: 'Multiply $\frac{3}{x+1} \cdot \frac{x+1}{9}$.'
            answer: "1/3"
      - id: kp2
        name: Factor, multiply, and cancel
        key_prerequisites: [rational-expressions, factoring-trinomials]
        constraints: "one factor needs a difference of squares or a monic trinomial factored first; exactly one binomial cancels"
        exemplars:
          - problem: 'Multiply $\frac{x+2}{x-3} \cdot \frac{x^2-9}{x+2}$.'
            answer: "x + 3"
            solution_sketch: 'Cancel $(x+2)$; $\frac{x^2-9}{x-3} = x+3$.'
          - problem: 'Multiply $\frac{x}{x+4} \cdot \frac{x^2+8x+16}{x}$.'
            answer: "x + 4"
      - id: kp3
        name: Cross-cancel before multiplying
        key_prerequisites: [rational-expressions]
        constraints: "a factor of each numerator cancels against a factor of the other denominator; cancel before multiplying, never expand"
        exemplars:
          - problem: 'Multiply $\frac{x^2-1}{x+2} \cdot \frac{x+2}{x+1}$.'
            answer: "x - 1"
            solution_sketch: 'Cancel $(x+2)$ and $(x+1)$.'
          - problem: 'Multiply $\frac{x^2+3x}{x^2-4} \cdot \frac{x+2}{x}$.'
            answer: "(x + 3)/(x - 2)"
            solution_sketch: '$\frac{x(x+3)}{(x-2)(x+2)} \cdot \frac{x+2}{x}$.'
    diagnostic_exemplar:
      problem: 'Multiply $\frac{x^2 - 4}{x^2 + 5x} \cdot \frac{x + 5}{x - 2}$.'
      answer: "(x + 2)/x"
      solution_sketch: 'Factor to $\frac{(x - 2)(x + 2)}{x(x + 5)} \cdot \frac{x + 5}{x - 2}$; the $(x - 2)$ and $(x + 5)$ cancel.'
    anki_seeds:
      - front: "To multiply rational expressions..."
        back: "factor everything, cancel common factors, then multiply what remains."
        type: basic

  - id: dividing-rational-expressions
    name: Dividing Rational Expressions
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: multiplying-rational-expressions
        weight: 0.7
        key: true
      - id: dividing-fractions
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Divide monomial rational expressions
        key_prerequisites: [dividing-fractions]
        constraints: "flip-and-multiply; every quotient cancels to a simple monomial fraction"
        exemplars:
          - problem: 'Divide $\frac{x}{3} \div \frac{x^2}{9}$.'
            answer: "3/x"
            solution_sketch: '$\frac{x}{3} \cdot \frac{9}{x^2} = \frac{9x}{3x^2} = \frac{3}{x}$.'
          - problem: 'Divide $\frac{5}{x^2} \div \frac{10}{x}$.'
            answer: "1/(2x)"
      - id: kp2
        name: Divide with binomial factors
        key_prerequisites: [multiplying-rational-expressions, dividing-fractions]
        constraints: "flip the divisor, then cancel matching linear binomials; no trinomials at this level"
        exemplars:
          - problem: 'Divide $\frac{x+1}{x-2} \div \frac{x+1}{x+2}$.'
            answer: "(x + 2)/(x - 2)"
          - problem: 'Divide $\frac{x^2-25}{x} \div \frac{x-5}{x}$.'
            answer: "x + 5"
            solution_sketch: '$\frac{(x-5)(x+5)}{x} \cdot \frac{x}{x-5}$.'
      - id: kp3
        name: Divide with trinomial factoring
        key_prerequisites: [multiplying-rational-expressions]
        constraints: "one numerator is a monic trinomial factoring over the integers; flip, factor, then cancel"
        exemplars:
          - problem: 'Divide $\frac{x^2+7x+10}{x+3} \div \frac{x+2}{x+3}$.'
            answer: "x + 5"
          - problem: 'Divide $\frac{x^2-x-12}{x+1} \div \frac{x-4}{x+1}$.'
            answer: "x + 3"
            solution_sketch: '$\frac{(x-4)(x+3)}{x+1} \cdot \frac{x+1}{x-4} = x+3$.'
    diagnostic_exemplar:
      problem: 'Divide $\frac{x^2 + 6x + 8}{x - 1} \div \frac{x + 2}{x - 1}$.'
      answer: "x + 4"
      solution_sketch: 'Multiply by the reciprocal; $x^2 + 6x + 8 = (x + 2)(x + 4)$, and $(x + 2)$ and $(x - 1)$ both cancel.'
    anki_seeds:
      - front: "To divide rational expressions..."
        back: "multiply by the reciprocal of the divisor."
        type: basic

  - id: multiplying-dividing-rational-expressions
    name: Multiplying and Dividing Rational Expressions
    # over-coverage: kp1/kp2 duplicate multiplying-rational-expressions kp2 and
    # dividing-rational-expressions kp3; only kp3 (mixed x-and-/ chains) is new
    core: false
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: multiplying-rational-expressions
        weight: 0.7
        key: true
      - id: dividing-rational-expressions
        weight: 0.7
        key: true
      - id: factoring-trinomials
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Products needing full factoring
        key_prerequisites: [multiplying-rational-expressions, factoring-trinomials]
        constraints: "every numerator and denominator factors into linear binomials with integer roots; the answer is one reduced fraction"
        exemplars:
          - problem: 'Multiply $\frac{x^2-x-6}{x^2-4} \cdot \frac{x+2}{x-3}$.'
            answer: "(x + 2)/(x - 2)"
            solution_sketch: '$\frac{(x-3)(x+2)}{(x-2)(x+2)} \cdot \frac{x+2}{x-3}$.'
          - problem: 'Multiply $\frac{x^2+5x+4}{x+3} \cdot \frac{x+3}{x+4}$.'
            answer: "x + 1"
      - id: kp2
        name: Quotients needing full factoring
        key_prerequisites: [dividing-rational-expressions, factoring-trinomials]
        constraints: "flip the divisor first, then factor all four parts; monic quadratics with integer roots only"
        exemplars:
          - problem: 'Divide $\frac{x^2-9}{x^2+6x+5} \div \frac{x+3}{x+5}$.'
            answer: "(x - 3)/(x + 1)"
            solution_sketch: '$\frac{(x-3)(x+3)}{(x+1)(x+5)} \cdot \frac{x+5}{x+3}$.'
          - problem: 'Divide $\frac{x^2+2x-8}{x} \div \frac{x+4}{x}$.'
            answer: "x - 2"
      - id: kp3
        name: Combined multiply-and-divide chains
        key_prerequisites: [multiplying-rational-expressions, dividing-rational-expressions]
        constraints: "three factors chained by one multiplication and one division; everything cancels to a monomial or a binomial"
        exemplars:
          - problem: 'Simplify $\frac{x}{x+1} \cdot \frac{x^2-1}{x} \div (x - 1)$.'
            answer: "1"
            solution_sketch: '$\frac{x}{x+1} \cdot \frac{(x-1)(x+1)}{x} = x-1$; dividing by $(x-1)$ gives $1$.'
          - problem: 'Simplify $\frac{x+2}{x} \cdot \frac{x^2}{x^2-4} \div \frac{1}{x-2}$.'
            answer: "x"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{x^2 - 4}{x + 1} \cdot \frac{x^2 - 1}{x - 2} \div (x + 2)$.'
      answer: "x - 1"
      solution_sketch: 'Factor everything and treat $\div (x + 2)$ as $\times \frac{1}{x + 2}$; then $(x - 2)$, $(x + 1)$ and $(x + 2)$ all cancel.'
    anki_seeds:
      - front: "In a chain of × and ÷ of rational expressions, first..."
        back: "rewrite every division as multiplication by the reciprocal, then factor everything and cancel."
        type: basic
      - front: "When multiplying rational expressions, cancel only..."
        back: "common factors of a numerator and a denominator — never terms inside a sum."
        type: basic

  - id: rational-expressions-common-denominators
    name: Adding Rational Expressions with Common Denominators
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: adding-subtracting-fractions
        weight: 0.7
        key: true
      - id: rational-expressions
        weight: 0.5
      - id: combining-like-terms
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Add and subtract over one denominator
        key_prerequisites: [adding-subtracting-fractions]
        constraints: "identical denominators (a monomial or one linear binomial); combine the numerators only, no LCD building"
        exemplars:
          - problem: 'Add $\frac{2}{x} + \frac{5}{x}$.'
            answer: "7/x"
          - problem: 'Subtract $\frac{3x}{x+1} - \frac{x}{x+1}$.'
            answer: "2x/(x + 1)"
      - id: kp2
        name: Distribute the minus sign
        key_prerequisites: [combining-like-terms]
        constraints: "numerators are linear binomials; subtraction must require distributing"
        exemplars:
          - problem: 'Subtract $\frac{5x+1}{x+2} - \frac{2x-5}{x+2}$.'
            answer: "3"
            solution_sketch: '$\frac{(5x+1)-(2x-5)}{x+2} = \frac{3x+6}{x+2} = 3$.'
          - problem: 'Subtract $\frac{7x}{x-3} - \frac{2x+1}{x-3}$.'
            answer: "(5x - 1)/(x - 3)"
      - id: kp3
        name: Simplify the combined result
        key_prerequisites: [rational-expressions]
        constraints: "the combined numerator factors and shares the denominator's factor, so the result simplifies to a polynomial"
        exemplars:
          - problem: 'Add $\frac{x^2}{x+3} + \frac{3x}{x+3}$.'
            answer: "x"
            solution_sketch: '$\frac{x^2+3x}{x+3} = \frac{x(x+3)}{x+3} = x$.'
          - problem: 'Subtract $\frac{x^2}{x-2} - \frac{4}{x-2}$.'
            answer: "x + 2"
    diagnostic_exemplar:
      problem: 'Subtract $\frac{x^2}{x - 3} - \frac{2x + 3}{x - 3}$.'
      answer: "x + 1"
      solution_sketch: 'One denominator already: $\frac{x^2 - 2x - 3}{x - 3} = \frac{(x - 3)(x + 1)}{x - 3}$. Distribute the minus over both terms.'
    anki_seeds:
      - front: "When subtracting a rational expression, remember to..."
        back: "distribute the minus sign across the whole numerator being subtracted."
        type: basic

  - id: adding-subtracting-rational-expressions
    name: Adding and Subtracting Rational Expressions
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: rational-expressions-common-denominators
        weight: 0.7
        key: true
      - id: rational-expressions
        weight: 0.5
        key: true
      - id: gcf-lcm
        weight: 0.4
      - id: factoring-trinomials
        weight: 0.4
      - id: adding-subtracting-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Build a least common denominator from monomials
        key_prerequisites: [adding-subtracting-fractions, gcf-lcm]
        constraints: "denominators are monomials or integers; the LCD is their product or the higher power; the answer is a single fraction"
        exemplars:
          - problem: 'Add $\frac{1}{x} + \frac{1}{3}$.'
            answer: "(3 + x)/(3x)"
            solution_sketch: 'LCD $= 3x$.'
          - problem: 'Add $\frac{2}{x} + \frac{3}{x^2}$.'
            answer: "(2x + 3)/x^2"
      - id: kp2
        name: Distinct binomial denominators
        key_prerequisites: [rational-expressions-common-denominators]
        constraints: "two distinct linear binomial denominators with no common factor; the LCD is their product, left in factored form"
        exemplars:
          - problem: 'Subtract $\frac{1}{x-2} - \frac{1}{x+2}$.'
            answer: "4/((x - 2)(x + 2))"
            solution_sketch: '$\frac{(x+2)-(x-2)}{(x-2)(x+2)} = \frac{4}{(x-2)(x+2)}$.'
          - problem: 'Add $\frac{3}{x+1} + \frac{2}{x-1}$.'
            answer: "(5x - 1)/((x + 1)(x - 1))"
      - id: kp3
        name: Factor denominators to build the LCD
        key_prerequisites: [rational-expressions, factoring-trinomials]
        constraints: "one denominator factors and contains the other as a factor; the LCD stays factored in the answer"
        exemplars:
          - problem: 'Add $\frac{3}{x+3} + \frac{2x}{x^2-9}$.'
            answer: "(5x - 9)/((x + 3)(x - 3))"
            solution_sketch: '$\frac{3(x-3) + 2x}{(x+3)(x-3)} = \frac{5x-9}{(x+3)(x-3)}$.'
          - problem: 'Add $\frac{1}{x^2+3x+2} + \frac{1}{x+1}$.'
            answer: "(x + 3)/((x + 1)(x + 2))"
            solution_sketch: '$\frac{1 + (x+2)}{(x+1)(x+2)}$.'
    diagnostic_exemplar:
      problem: 'Add $\frac{2}{x - 4} + \frac{x}{x^2 - 16}$.'
      answer: "(3x + 8)/((x - 4)(x + 4))"
      solution_sketch: '$x^2 - 16 = (x - 4)(x + 4)$ is the LCD: $\frac{2(x + 4) + x}{(x - 4)(x + 4)}$.'
    anki_seeds:
      - front: "LCD of 1/(x+3) and 1/(x²-9)?"
        back: "(x+3)(x-3)"
        type: basic

  - id: complex-fractions
    name: Complex Fractions
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: adding-subtracting-rational-expressions
        weight: 0.6
        key: true
      - id: dividing-rational-expressions
        weight: 0.5
        key: true
      - id: dividing-fractions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Numeric complex fractions
        key_prerequisites: [dividing-fractions]
        constraints: "numeric fractions only, at most one sum; answers are reduced fractions or integers"
        exemplars:
          - problem: 'Simplify $\frac{3/4}{9/8}$.'
            answer: "2/3"
            solution_sketch: '$\frac{3}{4} \cdot \frac{8}{9} = \frac{2}{3}$.'
          - problem: 'Simplify $\frac{\frac{1}{2} + \frac{1}{3}}{\frac{1}{6}}$.'
            answer: "5"
            solution_sketch: 'Numerator $= \frac{5}{6}$; $\frac{5}{6} \div \frac{1}{6} = 5$.'
      - id: kp2
        name: One fraction over another
        key_prerequisites: [dividing-rational-expressions]
        constraints: "a single monomial fraction over another; invert and multiply; coefficients at most 12"
        exemplars:
          - problem: 'Simplify $\frac{x/3}{x^2/6}$.'
            answer: "2/x"
          - problem: 'Simplify $\frac{5/x}{10/x^3}$.'
            answer: "x^2/2"
            solution_sketch: '$\frac{5}{x} \cdot \frac{x^3}{10} = \frac{x^2}{2}$.'
      - id: kp3
        name: Sums in the numerator or denominator
        key_prerequisites: [adding-subtracting-rational-expressions]
        constraints: "clearable by multiplying top and bottom by a monomial LCD"
        exemplars:
          - problem: 'Simplify $\frac{1 + \frac{1}{x}}{1 - \frac{1}{x}}$.'
            answer: "(x + 1)/(x - 1)"
            solution_sketch: 'Multiply top and bottom by $x$.'
          - problem: 'Simplify $\frac{\frac{1}{x} + \frac{1}{y}}{\frac{1}{xy}}$.'
            answer: "x + y"
            solution_sketch: 'Multiply top and bottom by $xy$.'
    diagnostic_exemplar:
      problem: 'Simplify $\frac{\frac{1}{x} - \frac{1}{3}}{\frac{1}{x} + \frac{1}{3}}$.'
      answer: "(3 - x)/(3 + x)"
      solution_sketch: 'Multiply numerator and denominator by $3x$, which clears all four small fractions at once.'
    anki_seeds:
      - front: "Fastest way to simplify a complex fraction?"
        back: "Multiply top and bottom by the LCD of all the inner fractions."
        type: basic

  - id: basic-rational-equations
    name: Basic Rational Equations
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: equations-with-fractions
        weight: 0.7
        key: true
      - id: ratios-proportions
        weight: 0.6
        key: true
      - id: rational-expression-restrictions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Solve proportions with x in a denominator
        key_prerequisites: [ratios-proportions]
        constraints: "integer or simple-fraction solutions; never a solution at an excluded value"
        exemplars:
          - problem: 'Solve $\frac{3}{x} = 6$.'
            answer: "x = 1/2"
            answer_contract: {kind: exact}
            solution_sketch: '$3 = 6x$; $x = \frac{1}{2}$.'
          - problem: 'Solve $\frac{x}{4} = \frac{3}{2}$.'
            answer: "x = 6"
            answer_contract: {kind: exact}
      - id: kp2
        name: Cross-multiply with binomials
        key_prerequisites: [ratios-proportions, equations-with-fractions]
        constraints: "a proportion with a linear binomial in at least one part; cross-multiply, then solve a linear equation; integer solutions"
        exemplars:
          - problem: 'Solve $\frac{x+1}{3} = \frac{x-1}{2}$.'
            answer: "x = 5"
            answer_contract: {kind: exact}
            solution_sketch: '$2(x+1) = 3(x-1)$; $2x+2 = 3x-3$.'
          - problem: 'Solve $\frac{4}{x+2} = \frac{2}{x}$.'
            answer: "x = 2"
            answer_contract: {kind: exact}
            solution_sketch: '$4x = 2(x+2)$.'
      - id: kp3
        name: Clear denominators
        key_prerequisites: [equations-with-fractions]
        constraints: "two or three terms, one with x in a monomial denominator; multiply through by that denominator; integer or simple-fraction solutions"
        exemplars:
          - problem: 'Solve $\frac{1}{x} + \frac{1}{2} = 1$.'
            answer: "x = 2"
            answer_contract: {kind: exact}
            solution_sketch: '$\frac{1}{x} = \frac{1}{2}$, so $x = 2$.'
          - problem: 'Solve $\frac{2}{x} + 3 = 5$.'
            answer: "x = 1"
            answer_contract: {kind: exact}
    diagnostic_exemplar:
      problem: 'Solve $\frac{4}{x + 1} - \frac{1}{2} = 1$.'
      answer: "x = 5/3"
      solution_sketch: 'Move the $\frac{1}{2}$ across: $\frac{4}{x + 1} = \frac{3}{2}$, so $8 = 3(x + 1)$.'
    anki_seeds:
      - front: "After solving a rational equation, always check that..."
        back: "no solution makes an original denominator zero."
        type: basic

  - id: inverse-variation
    name: "Inverse Variation"
    # core: the y = k/x on-ramp that precalculus:vertical-horizontal-asymptotes
    # (core) builds on (re-audit R-03, edge lands in the Wave-2 precalc lane);
    # the reciprocal parent graph is machinery for all rational-function graphing.
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 100
    prerequisites:
      - id: proportional-relationships
        weight: 0.6
        key: true
      - id: basic-rational-equations
        weight: 0.6
        key: true
      - id: rational-expression-restrictions
        weight: 0.3
      - id: reading-function-graphs
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Find k and use y = k/x"
        key_prerequisites: [proportional-relationships, basic-rational-equations]
        exemplars:
          - problem: '$y$ varies inversely with $x$, and $y = 6$ when $x = 2$. Find the constant $k$ in $y = \frac{k}{x}$.'
            answer: "12"
            solution_sketch: 'For inverse variation the product is constant: $k = xy = 2 \cdot 6 = 12$.'
          - problem: '$y$ varies inversely with $x$ with constant $k = 24$. Find $y$ when $x = 8$.'
            answer: "3"
            solution_sketch: '$y = \frac{24}{8} = 3$.'
        constraints: "equation form y = k/x with k = xy; integer k and integer or simple-fraction values; contrast with y = kx (direct) in wording only"
      - id: kp2
        name: "Solve across two states; halve-and-double reasoning"
        key_prerequisites: [basic-rational-equations]
        exemplars:
          - problem: '$y$ varies inversely with $x$, and $y = 4$ when $x = 9$. Find $y$ when $x = 6$.'
            answer: "6"
            solution_sketch: '$k = 4 \cdot 9 = 36$; $y = \frac{36}{6} = 6$.'
          - problem: '$y$ varies inversely with $x$. If $x$ is doubled, $y$ is multiplied by what number?'
            answer: "1/2"
            solution_sketch: '$\frac{k}{2x} = \frac{1}{2} \cdot \frac{k}{x}$: doubling $x$ halves $y$.'
          - problem: 'A journey takes $6$ hours at $80$ km/h. Travel time varies inversely with speed. How many hours does it take at $120$ km/h?'
            answer: "4"
            solution_sketch: '$k = 6 \cdot 80 = 480$ km; $t = \frac{480}{120} = 4$ hours.'
        constraints: "constant-product reasoning across two states; one applied context (speed-time, workers-time) with metric units; integer or simple-fraction answers"
      - id: kp3
        name: "The reciprocal parent graph"
        key_prerequisites: [rational-expression-restrictions, reading-function-graphs]
        exemplars:
          - problem: 'Which value of $x$ is excluded from the domain of $y = \frac{12}{x}$?'
            answer: "0"
            solution_sketch: 'The denominator cannot be zero, so the graph has no point at $x = 0$.'
          - problem: 'For $y = \frac{8}{x}$ with $x > 0$: as $x$ increases, is $y$ increasing or decreasing?'
            answer: "decreasing"
            solution_sketch: 'A fixed numerator over a growing denominator shrinks: the branch falls toward the $x$-axis.'
          - problem: 'The graph of $y = \frac{6}{x}$ passes through $(2, c)$. Find $c$.'
            answer: "3"
        constraints: "parent graph y = k/x with k > 0 only; no shifts; excluded value, branch behavior, and point checks — no asymptote vocabulary beyond 'never touches the axes'"
    diagnostic_exemplar:
      problem: '$y$ varies inversely with $x$, and $y = 10$ when $x = 3$. Find $y$ when $x = 5$.'
      answer: "6"
      solution_sketch: '$k = 10 \cdot 3 = 30$; $y = \frac{30}{5} = 6$.'
    anki_seeds:
      - front: "Inverse variation: equation form and what stays constant?"
        back: "y = k/x — the product xy = k is constant (direct variation keeps the ratio y/x constant)"
        type: basic
      - front: "In inverse variation, doubling x does what to y?"
        back: "halves it (multiplying x by a multiplies y by 1/a)"
        type: basic
      - front: "The graph of y = k/x has no point at ___ and never touches ___."
        back: "x = 0; the coordinate axes (two separate branches)"
        type: basic

  - id: rational-equations
    name: Solving Rational Equations
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: basic-rational-equations
        weight: 0.7
        key: true
      - id: adding-subtracting-rational-expressions
        weight: 0.5
        key: true
      - id: quadratic-equations-factoring
        weight: 0.4
      # multiplying-dividing-rational-expressions dropped: none of the three KPs
      # below multiplies or divides two rational expressions — they clear
      # denominators, produce a quadratic, and test extraneous roots
      - id: rational-expression-restrictions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Clear denominators in multi-term equations
        key_prerequisites: [basic-rational-equations, adding-subtracting-rational-expressions]
        constraints: "two or three terms with monomial or linear-binomial denominators; the cleared equation is linear; solutions may be fractions"
        exemplars:
          - problem: 'Solve $\frac{5}{x+1} + \frac{1}{2} = 2$.'
            answer: "x = 7/3"
            solution_sketch: '$\frac{5}{x+1} = \frac{3}{2}$; $3(x+1) = 10$.'
          - problem: 'Solve $\frac{4}{x} - \frac{1}{3} = \frac{1}{x}$.'
            answer: "x = 9"
            solution_sketch: '$\frac{3}{x} = \frac{1}{3}$.'
      - id: kp2
        name: Equations that lead to a quadratic
        key_prerequisites: [quadratic-equations-factoring, adding-subtracting-rational-expressions]
        constraints: "clearing denominators gives a monic quadratic that factors over the integers; report both roots"
        exemplars:
          - problem: 'Solve $x + \frac{6}{x} = 5$.'
            answer: "x = 2 or x = 3"
            solution_sketch: 'Multiply by $x$: $x^2 - 5x + 6 = 0$; $(x-2)(x-3) = 0$.'
          - problem: 'Solve $x - \frac{12}{x} = 1$.'
            answer: "x = 4 or x = -3"
      - id: kp3
        name: Extraneous solutions
        key_prerequisites: [rational-expression-restrictions, basic-rational-equations]
        constraints: "the cleared equation has a root at an excluded value"
        exemplars:
          - problem: 'Solve $\frac{x}{x-3} = \frac{3}{x-3} + 2$.'
            answer: "no solution"
            solution_sketch: 'Clearing gives $x = 3 + 2(x-3)$, so $x = 3$ — but $x = 3$ is excluded.'
          - problem: 'Solve $\frac{1}{x-2} + \frac{1}{x+2} = \frac{4}{x^2-4}$.'
            answer: "no solution"
            solution_sketch: '$(x+2)+(x-2) = 4$ gives $x = 2$, which is excluded.'
    diagnostic_exemplar:
      problem: 'Solve $\frac{x^2}{x - 2} = \frac{4}{x - 2} + 3$.'
      answer: "x = 1"
      solution_sketch: 'Clear $(x - 2)$ to get $x^2 = 3x - 2$, so $(x - 1)(x - 2) = 0$; $x = 2$ is extraneous.'
    anki_seeds:
      - front: "An extraneous solution of a rational equation is..."
        back: "a root of the cleared equation that makes an original denominator zero."
        type: basic

  - id: work-rate-problems
    name: Work and Rate Problems
    # over-coverage: the 1/a + 1/b = 1/t context schema over rational-equations
    core: false
    difficulty: 0.75
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: rational-equations
        weight: 0.7
        key: true
      - id: ratios-proportions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Combined work time
        key_prerequisites: [rational-equations, ratios-proportions]
        constraints: "individual times chosen so the combined time is a whole number"
        exemplars:
          - problem: 'Ann paints a room in $3$ hours; Ben paints it in $6$ hours. How long do they take together?'
            answer: "2 hours"
            solution_sketch: '$\frac{1}{3} + \frac{1}{6} = \frac{1}{2}$ room per hour.'
          - problem: 'One pipe fills a tank in $4$ hours, another in $12$ hours. How long together?'
            answer: "3 hours"
            solution_sketch: '$\frac{1}{4} + \frac{1}{12} = \frac{1}{3}$.'
      - id: kp2
        name: Find an unknown individual time
        key_prerequisites: [rational-equations]
        constraints: "1/a + 1/b = 1/t with two of the three times given; whole-hour data chosen so the unknown time is a whole number"
        exemplars:
          - problem: 'Together two crews finish a job in $4$ hours. The first crew alone needs $6$ hours. How long does the second crew need alone?'
            answer: "12 hours"
            solution_sketch: '$\frac{1}{6} + \frac{1}{x} = \frac{1}{4}$; $\frac{1}{x} = \frac{1}{12}$.'
          - problem: 'Two painters together take $2$ hours; one alone takes $3$ hours. How long does the other take alone?'
            answer: "6 hours"
      - id: kp3
        name: Opposing rates and round trips
        key_prerequisites: [rational-equations]
        constraints: "rates that oppose each other (fill against drain, so subtract), or an out-and-back trip whose two speeds differ by a constant; whole-number answers"
        exemplars:
          - problem: 'A pipe fills a tank in $6$ hours while a drain empties it in $10$ hours. With both open, how long to fill the tank?'
            answer: "15 hours"
            solution_sketch: '$\frac{1}{6} - \frac{1}{10} = \frac{1}{15}$.'
          - problem: 'A cyclist rides $12$ km out at speed $x$ km/h and returns at $x - 2$ km/h, taking $5$ hours total. Find $x$.'
            answer: "x = 6"
            solution_sketch: '$\frac{12}{x} + \frac{12}{x-2} = 5$ gives $5x^2 - 34x + 24 = 0$; $x = 6$ (reject $x = 4/5$).'
    diagnostic_exemplar:
      problem: 'A tap fills a tank in $4$ hours while an open drain empties it in $12$ hours. With both running, how long does the tank take to fill?'
      answer: "6 hours"
      solution_sketch: 'Rates add, the drain negatively: $\frac{1}{4} - \frac{1}{12} = \frac{1}{6}$ tank per hour.'
    anki_seeds:
      - front: "If a job takes t hours, the work rate is..."
        back: "1/t of the job per hour."
        type: basic
      - front: "Combined work rate of two workers = ..."
        back: "the sum of their individual rates."
        type: basic

  - id: trig-ratios-definition
    name: Defining the Trigonometric Ratios
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: ratios-proportions
        weight: 0.6
        key: true
      - id: pythagorean-theorem
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: SOH-CAH-TOA from labeled sides
        key_prerequisites: [ratios-proportions]
        constraints: "Pythagorean triples (3-4-5, 5-12-13, 8-15-17) scaled by small integers"
        exemplars:
          - problem: 'In a right triangle with opposite $= 3$, adjacent $= 4$, hypotenuse $= 5$, find $\sin \theta$.'
            answer: "3/5"
            solution_sketch: '$\sin \theta = \frac{\text{opposite}}{\text{hypotenuse}}$.'
          - problem: 'For the same triangle (opp $3$, adj $4$, hyp $5$), find $\tan \theta$.'
            answer: "3/4"
            solution_sketch: '$\tan \theta = \frac{\text{opposite}}{\text{adjacent}} = \frac{3}{4}$.'
      - id: kp2
        name: Ratios of the other acute angle
        key_prerequisites: [ratios-proportions]
        constraints: "the same Pythagorean-triple triangle read from the other acute angle, so opposite and adjacent swap"
        exemplars:
          - problem: 'In the $3$-$4$-$5$ triangle, $\sin \theta = \frac{3}{5}$. Find $\sin \phi$ for the other acute angle $\phi$.'
            answer: "4/5"
            solution_sketch: 'The opposite and adjacent sides swap roles.'
          - problem: 'A right triangle has legs $8$ and $15$ and hypotenuse $17$. If $\tan \theta = \frac{8}{15}$, find $\tan \phi$ for the other acute angle.'
            answer: "15/8"
      - id: kp3
        name: Find the missing side first
        key_prerequisites: [pythagorean-theorem]
        constraints: "two of the three sides given; find the third by Pythagoras (triples 3-4-5, 5-12-13, 8-15-17 and small multiples) before writing the ratio"
        exemplars:
          - problem: 'A right triangle has legs $6$ and $8$. For the angle $\theta$ opposite the side of length $6$, find $\sin \theta$.'
            answer: "3/5"
            solution_sketch: 'Hypotenuse $= \sqrt{36+64} = 10$; $\sin \theta = \frac{6}{10} = \frac{3}{5}$.'
          - problem: 'A right triangle has hypotenuse $13$ and one leg $5$. For the angle $\theta$ adjacent to the other leg, find $\cos \theta$.'
            answer: "12/13"
            solution_sketch: 'Other leg $= \sqrt{169-25} = 12$.'
    diagnostic_exemplar:
      problem: 'A right triangle has hypotenuse $10$ and one leg $6$. For the acute angle $\phi$ adjacent to the leg of length $6$, find $\tan \phi$.'
      answer: "4/3"
      solution_sketch: 'Pythagoras gives the missing leg $8$; opposite over adjacent is $\frac{8}{6}$.'
    anki_seeds:
      - front: "SOH-CAH-TOA: sin, cos, tan equal which ratios?"
        back: "sin = opp/hyp, cos = adj/hyp, tan = opp/adj."
        type: basic

  - id: solving-right-triangles-sides
    name: Right Triangles — Solving for Sides
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: trig-ratios-definition
        weight: 0.8
        key: true
      - id: one-step-equations
        weight: 0.3
      - id: multiplying-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Multiply to find a leg
        key_prerequisites: [trig-ratios-definition]
        constraints: "give the needed trig value in the problem (exact or rounded)"
        exemplars:
          - problem: 'In a right triangle the hypotenuse is $10$ and one acute angle is $30^\circ$. Find the side opposite that angle. Use $\sin 30^\circ = \frac{1}{2}$.'
            answer: "5"
            solution_sketch: '$x = 10 \sin 30^\circ = 5$.'
          - problem: 'The hypotenuse is $8$ and one acute angle is $60^\circ$. Find the side adjacent to it. Use $\cos 60^\circ = \frac{1}{2}$.'
            answer: "4"
      - id: kp2
        name: Use tangent between the legs
        key_prerequisites: [trig-ratios-definition]
        constraints: "the two legs and one acute angle; the tangent value is given in the problem, exact or rounded to two decimals"
        exemplars:
          - problem: 'One acute angle is $45^\circ$ and its adjacent leg is $7$. Find the opposite leg. Use $\tan 45^\circ = 1$.'
            answer: "7"
          - problem: 'One acute angle is $35^\circ$ and its adjacent leg is $20$. Find the opposite leg. Use $\tan 35^\circ \approx 0.70$.'
            answer: "≈ 14"
            solution_sketch: '$x = 20 \tan 35^\circ \approx 20 \cdot 0.70$.'
      - id: kp3
        name: Divide to find the hypotenuse
        key_prerequisites: [trig-ratios-definition, one-step-equations]
        constraints: "the hypotenuse is the unknown, so divide by the given sine or cosine; values chosen so the quotient is a whole number"
        exemplars:
          - problem: 'The side opposite a $30^\circ$ angle is $9$. Find the hypotenuse. Use $\sin 30^\circ = \frac{1}{2}$.'
            answer: "18"
            solution_sketch: '$\sin 30^\circ = \frac{9}{h}$, so $h = 9 \div \frac{1}{2} = 18$.'
          - problem: 'The side adjacent to a $40^\circ$ angle is $15.4$. Find the hypotenuse. Use $\cos 40^\circ \approx 0.77$.'
            answer: "≈ 20"
    diagnostic_exemplar:
      problem: 'One acute angle is $40^\circ$ and the leg opposite it is $12.6$. Find the leg adjacent to that angle. Use $\tan 40^\circ \approx 0.84$.'
      answer: "15"
      solution_sketch: '$\tan 40^\circ = \frac{\text{opposite}}{\text{adjacent}} = \frac{12.6}{x}$, so $x = \frac{12.6}{0.84}$.'
    anki_seeds:
      - front: "To solve for a right-triangle side, pick the trig ratio that links..."
        back: "the known angle, the known side, and the side you want."
        type: basic

  - id: right-triangle-trig
    name: Right Triangle Trigonometry
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: trig-ratios-definition
        weight: 0.7
        key: true
      - id: solving-right-triangles-sides
        weight: 0.7
        key: true
      - id: square-roots
        weight: 0.3
      - id: simplifying-radicals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Find angles from exact ratios
        key_prerequisites: [trig-ratios-definition]
        constraints: "ratios are the exact special values 1/2, √2/2, √3/2, 1, √3 or √3/3; answers are 30, 45 or 60 degrees"
        exemplars:
          - problem: 'An acute angle $\theta$ satisfies $\sin \theta = \frac{1}{2}$. Find $\theta$.'
            answer: "30°"
          - problem: 'An acute angle $\theta$ satisfies $\tan \theta = 1$. Find $\theta$.'
            answer: "45°"
          - problem: 'An acute angle $\theta$ satisfies $\tan \theta = \sqrt{3}$. Find $\theta$.'
            answer: "60°"
      - id: kp2
        name: Find angles with a calculator (inverse trig keys)
        key_prerequisites: [trig-ratios-definition]
        constraints: "acute angles only; answers rounded to one decimal place"
        exemplars:
          - problem: 'An acute angle $\theta$ satisfies $\sin \theta = 0.6$. Use a calculator to find $\theta$ to the nearest tenth of a degree.'
            answer: "≈ 36.9°"
            solution_sketch: '$\theta = \sin^{-1}(0.6)$.'
          - problem: 'An acute angle $\theta$ satisfies $\tan \theta = 1.6$. Find $\theta$ to the nearest tenth of a degree.'
            answer: "≈ 58.0°"
      - id: kp3
        name: Solve the whole right triangle
        key_prerequisites: [solving-right-triangles-sides, simplifying-radicals]
        constraints: "30-60-90 and 45-45-90 triangles, or two legs given; answers are exact, with radicals where needed"
        exemplars:
          - problem: 'A right triangle has a $30^\circ$ angle and hypotenuse $10$. Find the length of the leg adjacent to the $30^\circ$ angle.'
            answer: "5√3"
            solution_sketch: 'The other acute angle is $60^\circ$; $10\cos 30^\circ = 10 \cdot \frac{\sqrt{3}}{2} = 5\sqrt{3}$ (the short leg is $10\sin 30^\circ = 5$).'
          - problem: 'A right triangle has legs $3$ and $3$. Find the length of the hypotenuse.'
            answer: "3√2"
            solution_sketch: 'Both acute angles are $45^\circ$; $\sqrt{3^2 + 3^2} = 3\sqrt{2}$.'
    diagnostic_exemplar:
      problem: 'A right triangle has hypotenuse $12$ and one acute angle of $60^\circ$. Find the length of the leg opposite the $60^\circ$ angle.'
      answer: "6√3"
      solution_sketch: '$12\sin 60^\circ = 12 \cdot \frac{\sqrt{3}}{2} = 6\sqrt{3}$ (the other leg is $12\cos 60^\circ = 6$).'
    anki_seeds:
      - front: "To find an acute angle from tan θ = k, use..."
        back: "the inverse tangent (tan⁻¹ / arctan) key."
        type: basic

  - id: special-right-triangles
