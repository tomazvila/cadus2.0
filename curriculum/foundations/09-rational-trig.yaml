      {"problem": "A cyclist rides at $\\dfrac{12}{t}$ kilometers per hour for $\\dfrac{t^2}{18}$ hours, with $t>0$. How far does the cyclist ride in kilometers?", "answer": "2*t/3", "solution_sketch": "Distance is speed times time, so the distance is $\\frac{12}{t}\\cdot\\frac{t^2}{18}$. Reducing gives $\\frac{2t}{3}$ kilometers.", "answer_contract": {"kind": "exact"}},
