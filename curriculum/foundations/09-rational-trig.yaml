    {"id": "kp2", "name": "Equations that lead to a quadratic", "key_prerequisites": ["quadratic-equations-factoring", "adding-subtracting-rational-expressions"], "constraints": "clearing denominators gives a monic quadratic that factors over the integers; report both roots", "exemplars": [
      {"problem": "Solve $x+6/x=5$; list all solutions.", "answer": "2, 3", "solution_sketch": "Exclude $0$; multiplying by $x$ gives $x^2-5x+6=(x-2)(x-3)=0$. Both nonzero roots satisfy the original equation.", "answer_contract": {"kind": "list", "ordered": false, "member": {"kind": "exact"}}}, {"problem": "Solve $x-12/x=1$; list all solutions.", "answer": "-3, 4", "solution_sketch": "With $x\\ne0$, obtain $x^2-x-12=(x-4)(x+3)=0$; both roots are allowed.", "answer_contract": {"kind": "list", "ordered": false, "member": {"kind": "exact"}}},
