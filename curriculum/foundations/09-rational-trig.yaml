  ]},
  {"id": "complex-fractions", "name": "Complex Fractions", "core": true, "difficulty": 0.7, "drill": false, "answer_kind": "expression", "expected_time_secs": 150, "prerequisites": [{"id": "adding-subtracting-rational-expressions", "weight": 0.6, "key": true}, {"id": "dividing-rational-expressions", "weight": 0.5, "key": true}, {"id": "dividing-fractions", "weight": 0.4}], "diagnostic_exemplar": {"problem": "Simplify $\\frac{\\frac{1}{x} - \\frac{1}{3}}{\\frac{1}{x} + \\frac{1}{3}}$.", "answer": "(3 - x)/(3 + x)", "solution_sketch": "Multiply numerator and denominator by $3x$, which clears all four small fractions at once."}, "anki_seeds": [{"front": "Fastest way to simplify a complex fraction?", "back": "Multiply top and bottom by the LCD of all the inner fractions.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Numeric complex fractions", "key_prerequisites": ["dividing-fractions"], "constraints": "numeric fractions only, at most one sum; answers are reduced fractions or integers", "step_check": {"step": "Multiply the numerator by the reciprocal", "question": "Why does multiplying by $5/4$ give the same result as dividing by $4/5$?", "options": ["Dividing by $4/5$ takes $4/5$ of the top first, and then multiplying by $5/4$ undoes that step again", "Dividing by $4/5$ asks how many $4/5$ fit in the top, which equals multiplying by $5/4$", "Either fraction may be turned upside down, so flipping the top fraction gives the same value too"], "answer": "Dividing by $4/5$ asks how many $4/5$ fit in the top, which equals multiplying by $5/4$", "why": "Dividing by a nonzero fraction is the same as multiplying by its reciprocal; the fraction bar of the complex fraction means division."}, "try_first": {"problem": "A jug holds $\\frac{3}{2}$ litres of juice. How many glasses of $\\frac{1}{6}$ litre can it fill?", "answer_contract": {"kind": "exact"}, "answer": "9", "reveal": "The count is $\\frac{3/2}{1/6}$, and dividing by $\\frac{1}{6}$ is the same as multiplying by $6$. This is why a fraction over a fraction is handled by inverting the bottom one."}, "exemplars": [{"problem": "Simplify $\\dfrac{\\frac{3}{4}}{\\frac{9}{8}}$.", "answer": "2/3", "answer_contract": {"kind": "required_form", "form": "reduced_fraction"}, "solution_sketch": "Dividing by $\\frac{9}{8}$ means multiplying by $\\frac{8}{9}$. So the value is $\\frac{3}{4}\\cdot\\frac{8}{9}=\\frac{24}{36}=\\frac{2}{3}$."}, {"problem": "Simplify $\\dfrac{\\frac{1}{2}+\\frac{1}{3}}{\\frac{1}{6}}$.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "First add in the numerator: $\\frac{3}{6}+\\frac{2}{6}=\\frac{5}{6}$. Dividing $\\frac{5}{6}$ by $\\frac{1}{6}$ is the same as multiplying by $6$, which gives $5$."}, {"problem": "Evaluate $\\dfrac{\\frac{3}{4}}{\\frac{1}{2}-\\frac{1}{8}}$.", "answer": "2", "answer_contract": {"kind": "exact"}, "solution_sketch": "First subtract in the denominator: $\\frac{4}{8}-\\frac{1}{8}=\\frac{3}{8}$. Then multiply $\\frac{3}{4}$ by the reciprocal $\\frac{8}{3}$ to get $2$."}, {"problem": "A ribbon $\\frac{3}{4}$ m long is cut into pieces that are each $\\frac{1}{8}$ m long. How many pieces are there?", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "The number of pieces is the length divided by the piece length, $\\frac{3/4}{1/8}$. This equals $\\frac{3}{4}\\cdot 8=6$ pieces."}, {"problem": "A runner covers $\\frac{3}{4}$ km in $\\frac{1}{6}$ hour. What is her speed?", "answer": "9/2", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}, "solution_sketch": "Speed is distance divided by time, so the speed is $\\frac{3/4}{1/6}=\\frac{3}{4}\\cdot 6=\\frac{9}{2}$. That is $4.5$ km/h."}, {"problem": "Sam simplifies $\\dfrac{2}{\\frac{3}{5}}$ and gets $\\frac{6}{5}$. What is the correct value?", "answer": "10/3", "answer_contract": {"kind": "required_form", "form": "reduced_fraction"}, "solution_sketch": "Sam multiplied $2$ by $\\frac{3}{5}$, but dividing by $\\frac{3}{5}$ means multiplying by $\\frac{5}{3}$. The correct value is $2\\cdot\\frac{5}{3}=\\frac{10}{3}$."}, {"problem": "A bag holds $\\frac{7}{2}$ kg of rice. It is shared into portions of $\\frac{7}{10}$ kg each. How many portions does the bag give?", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "The number of portions is $\\frac{7/2}{7/10}=\\frac{7}{2}\\cdot\\frac{10}{7}=5$. Dividing the total by the size of one portion gives the count."}, {"problem": "A cyclist rides $12$ km at $6$ km/h and then $12$ km at $12$ km/h. What is her average speed for the $24$ km?", "answer": "8", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}, "solution_sketch": "The two legs take $\\frac{12}{6}=2$ hours and $\\frac{12}{12}=1$ hour. The average speed is $\\frac{24}{2+1}=8$ km/h."}]},
    {"id": "kp2", "name": "One fraction over another", "key_prerequisites": ["dividing-rational-expressions"], "constraints": "a single monomial fraction over another; invert and multiply; coefficients at most 12", "step_check": {"step": "Cancel two powers of $x$", "question": "Why can two powers of $x$ be cancelled from $\\frac{7x^3}{12x^2}$?", "options": ["Cancelling removes $x^2$ from the bottom only, which leaves $7x^3$ over the number $12$ in the fraction", "The exponents add, $3+2=5$, so two powers of $x$ are removed and $x^5$ is left on top", "Both $x^3$ and $x^2$ contain the factor $x^2$, so it divides out of top and bottom"], "answer": "Both $x^3$ and $x^2$ contain the factor $x^2$, so it divides out of top and bottom", "why": "A common nonzero factor divides out of the numerator and the denominator, leaving $\\frac{7x}{12}$."}, "exemplars": [{"problem": "Simplify $\\dfrac{\\frac{x}{3}}{\\frac{x^2}{6}}$.", "answer": "2/x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Dividing by $\\frac{x^2}{6}$ means multiplying by its reciprocal $\\frac{6}{x^2}$. This gives $\\frac{6x}{3x^2}$, which cancels to $\\frac{2}{x}$."}, {"problem": "Simplify $\\dfrac{\\frac{5}{x}}{\\frac{10}{x^3}}$.", "answer": "x^2/2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply by the reciprocal of the bottom: $\\frac{5}{x}\\cdot\\frac{x^3}{10}=\\frac{5x^3}{10x}$. Cancel $5$ and one $x$ to get $\\frac{x^2}{2}$."}, {"problem": "Simplify $\\dfrac{\\frac{x^2}{4}}{\\frac{x}{8}}$.", "answer": "2x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply by the reciprocal of the bottom fraction: $\\frac{x^2}{4}\\cdot\\frac{8}{x}=\\frac{8x^2}{4x}$. Cancelling $4$ and one $x$ leaves $2x$."}, {"problem": "Simplify $\\dfrac{\\frac{9}{x^2}}{\\frac{3}{x}}$.", "answer": "3/x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply by the reciprocal: $\\frac{9}{x^2}\\cdot\\frac{x}{3}=\\frac{9x}{3x^2}$. Cancel $3$ and one $x$ to get $\\frac{3}{x}$."}, {"problem": "A rectangle has area $\\frac{3x}{4}$ square metres and width $\\frac{x^2}{8}$ metres. Find an expression for its length in metres.", "answer": "6/x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Length is area divided by width, so the length is $\\frac{3x/4}{x^2/8}=\\frac{3x}{4}\\cdot\\frac{8}{x^2}$. This simplifies to $\\frac{6}{x}$."}, {"problem": "A solution has mass $\\frac{12}{x}$ grams and volume $\\frac{4}{x^3}$ millilitres. Find an expression for its density in grams per millilitre.", "answer": "3x^2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Density is mass divided by volume, so it is $\\frac{12/x}{4/x^3}=\\frac{12}{x}\\cdot\\frac{x^3}{4}$. This simplifies to $3x^2$."}, {"problem": "Sam simplifies $\\dfrac{\\frac{x}{2}}{\\frac{x^3}{4}}$ and gets $\\frac{x^4}{8}$. What is the correct result?", "answer": "2/x^2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Sam multiplied the two fractions instead of dividing. The correct work is $\\frac{x}{2}\\cdot\\frac{4}{x^3}=\\frac{4x}{2x^3}=\\frac{2}{x^2}$."}, {"problem": "Pipe A delivers $\\frac{6}{x}$ litres in $\\frac{3}{x^2}$ minutes. Find an expression for its flow rate in litres per minute.", "answer": "2x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Rate is volume divided by time, so the rate is $\\frac{6/x}{3/x^2}=\\frac{6}{x}\\cdot\\frac{x^2}{3}$. This simplifies to $2x$."}]},
    {"id": "kp3", "name": "Sums in the numerator or denominator", "key_prerequisites": ["adding-subtracting-rational-expressions"], "constraints": "clearable by multiplying top and bottom by a monomial LCD", "step_check": {"step": "Multiply the top and bottom by $y$", "question": "Why does multiplying the top and bottom by $y$ not change the value of the fraction?", "options": ["It multiplies the whole fraction by $\\frac{y}{y}$, which equals $1$ when $y\\ne0$", "It adds the same amount $y$ to the top and the bottom, and so the ratio stays the same", "It multiplies only the inner fractions, and so the outer fraction bar is left unchanged"], "answer": "It multiplies the whole fraction by $\\frac{y}{y}$, which equals $1$ when $y\\ne0$", "why": "Multiplying top and bottom by the same nonzero quantity multiplies the fraction by $1$."}, "exemplars": [{"problem": "Simplify $\\dfrac{1+\\frac{1}{x}}{1-\\frac{1}{x}}$.", "answer": "(x+1)/(x-1)", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $x$. The top becomes $x+1$ and the bottom becomes $x-1$."}, {"problem": "Simplify $\\dfrac{\\frac{1}{x}+\\frac{1}{y}}{\\frac{1}{xy}}$.", "answer": "x+y", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $xy$. The top becomes $y+x$ and the bottom becomes $1$, so the result is $x+y$."}, {"problem": "Simplify $\\dfrac{1-\\frac{1}{x}}{1+\\frac{1}{x}}$.", "answer": "(x-1)/(x+1)", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $x$. The top becomes $x-1$ and the bottom becomes $x+1$."}, {"problem": "Simplify $\\dfrac{\\frac{2}{x}-\\frac{2}{y}}{\\frac{2}{xy}}$.", "answer": "y-x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $xy$. The top becomes $2y-2x$ and the bottom becomes $2$, so the result is $y-x$."}, {"problem": "Two resistors of $a$ ohms and $b$ ohms are connected in parallel. Their combined resistance is $\\dfrac{1}{\\frac{1}{a}+\\frac{1}{b}}$ ohms. Simplify this expression.", "answer": "a*b/(a+b)", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $ab$. The top becomes $ab$ and the bottom becomes $b+a$, so the resistance is $\\frac{ab}{a+b}$."}, {"problem": "A trip of $d$ km each way is made at $u$ km/h out and $v$ km/h back. The average speed is $\\dfrac{2d}{\\frac{d}{u}+\\frac{d}{v}}$ km/h. Simplify this expression.", "answer": "2*u*v/(u+v)", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $uv$. The top becomes $2duv$ and the bottom becomes $dv+du$, so the average speed is $\\frac{2uv}{u+v}$."}, {"problem": "Sam simplifies $\\dfrac{\\frac{1}{x}+\\frac{1}{2}}{\\frac{1}{x}}$ by cancelling the $\\frac{1}{x}$ terms and gets $\\frac{1}{2}$. What is the correct result?", "answer": "(x+2)/2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $2x$. The top becomes $2+x$ and the bottom becomes $2$, so the result is $\\frac{x+2}{2}$."}, {"problem": "Ann paints a fence in $x$ hours and Ben paints it in $2x$ hours. Working together they take $\\dfrac{1}{\\frac{1}{x}+\\frac{1}{2x}}$ hours. Simplify this expression.", "answer": "2x/3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $2x$. The top becomes $2x$ and the bottom becomes $2+1=3$, so they take $\\frac{2x}{3}$ hours."}]}
  ]},
  {"id": "basic-rational-equations", "name": "Basic Rational Equations", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 120, "prerequisites": [{"id": "equations-with-fractions", "weight": 0.7, "key": true}, {"id": "ratios-proportions", "weight": 0.6, "key": true}, {"id": "rational-expression-restrictions", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Solve $\\frac{4}{x + 1} - \\frac{1}{2} = 1$.", "answer": "x = 5/3", "solution_sketch": "Move the $\\frac{1}{2}$ across: $\\frac{4}{x + 1} = \\frac{3}{2}$, so $8 = 3(x + 1)$."}, "anki_seeds": [{"front": "After solving a rational equation, always check that...", "back": "no solution makes an original denominator zero.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Solve proportions with x in a denominator", "key_prerequisites": ["ratios-proportions"], "constraints": "integer or simple-fraction solutions; never a solution at an excluded value", "step_check": {"step": "Multiply both sides by $x$", "question": "Why is it valid to multiply both sides of $\\frac{9}{x}=4$ by $x$?", "options": ["Since $x\\ne0$, multiplying both sides by the same nonzero number keeps the equation true", "Multiplying by $x$ cancels the $4$ on the right, which leaves only the $9$ to solve for", "The $x$ has to move to the top, and an equal move on both sides keeps it balanced even if $x=0$"], "answer": "Since $x\\ne0$, multiplying both sides by the same nonzero number keeps the equation true", "why": "Multiplying both sides by a nonzero number gives an equation with the same solutions; that is why $x=0$ is excluded first."}, "exemplars": [{"problem": "Solve $\\dfrac{20}{x}=8$.", "answer": "5/2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $x\\ne0$, multiply both sides by $x$ to get $20=8x$. Then $x=\\frac{20}{8}=\\frac{5}{2}$."}, {"problem": "Solve $\\dfrac{x}{4}=\\dfrac{3}{2}$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply both sides by $4$ to undo the division by $4$. This gives $x=4\\cdot\\frac{3}{2}=6$."}, {"problem": "A cyclist rides $12$ km at an average speed of $8$ km/h. How long does the ride take?", "answer": "3/2", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "Distance equals speed times time, so $12=8t$. Divide by $8$ to get $t=\\frac{3}{2}$ hours."}, {"problem": "Solve the proportion $\\dfrac{4}{3}=\\dfrac{8}{x}$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $x\\ne0$, cross-multiply to get $4x=24$. Then $x=6$, and $\\frac{8}{6}=\\frac{4}{3}$ confirms it."}, {"problem": "A recipe that uses $2$ cups of flour serves $5$ people. How many people does a batch that uses $12$ cups of flour serve?", "answer": "30", "answer_contract": {"kind": "exact"}, "solution_sketch": "The ratio of cups to people stays the same, so $\\frac{2}{5}=\\frac{12}{x}$. Cross-multiplying gives $2x=60$, so $x=30$."}, {"problem": "A syrup is mixed from $3$ parts concentrate to $8$ parts water. How much water goes with $15$ ml of concentrate?", "answer": "40", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "ml", "allow_omitted": true}, "solution_sketch": "The ratio is fixed, so $\\frac{3}{8}=\\frac{15}{x}$. Cross-multiplying gives $3x=120$, so $x=40$ ml."}, {"problem": "Sam solves $\\dfrac{6}{x}=3$ and writes $x=\\frac{1}{2}$. What is the correct solution?", "answer": "2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Sam divided $3$ by $6$, but multiplying both sides by $x$ gives $6=3x$. So $x=\\frac{6}{3}=2$, and $\\frac{6}{2}=3$."}, {"problem": "A tank holds $90$ litres and a pump fills it at $15$ litres per minute. How many minutes does it take to fill the tank?", "answer": "6", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}, "solution_sketch": "The time is the volume divided by the rate. Solving $\\frac{90}{x}=15$ gives $x=6$ minutes."}]},
    {"id": "kp2", "name": "Cross-multiply with binomials", "key_prerequisites": ["ratios-proportions", "equations-with-fractions"], "constraints": "a proportion with a linear binomial in at least one part; cross-multiply, then solve a linear equation; integer solutions", "step_check": {"step": "Cross-multiply: $3(x+2)=5(x-2)$", "question": "Why does cross-multiplying $\\frac{x+2}{5}=\\frac{x-2}{3}$ give $3(x+2)=5(x-2)$?", "options": ["Each numerator is multiplied by its own denominator, so $5(x+2)=3(x-2)$ would be correct too", "Each denominator is subtracted from the other side, which leaves $x+2-5=x-2-3$ in the equation", "Multiplying both sides by $5\\cdot3$ clears both denominators and leaves cross-products"], "answer": "Multiplying both sides by $5\\cdot3$ clears both denominators and leaves cross-products", "why": "Multiplying both sides by $15$ turns $\\frac{x+2}{5}$ into $3(x+2)$ and $\\frac{x-2}{3}$ into $5(x-2)$."}, "exemplars": [{"problem": "Solve $\\dfrac{x+1}{3}=\\dfrac{x-1}{2}$.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Cross-multiply to get $2(x+1)=3(x-1)$, so $2x+2=3x-3$. Then $x=5$, and both sides equal $2$."}, {"problem": "Solve $\\dfrac{4}{x+2}=\\dfrac{2}{x}$.", "answer": "2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$ and $x=-2$. Cross-multiplying gives $4x=2x+4$, so $x=2$, and both sides equal $1$."}, {"problem": "Solve $\\dfrac{x+4}{x-1}=\\dfrac{3}{2}$.", "answer": "11", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=1$. Cross-multiplying gives $2x+8=3x-3$, so $x=11$, and both sides equal $\\frac{3}{2}$."}, {"problem": "Solve $\\dfrac{3}{x-1}=\\dfrac{6}{x+4}$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=1$ and $x=-4$. Cross-multiplying gives $3x+12=6x-6$, so $x=6$, and both sides equal $\\frac{3}{5}$."}, {"problem": "A rectangle is $x$ cm wide and $(x+6)$ cm long. The ratio of its width to its length is $\\frac{2}{5}$. How wide is the rectangle?", "answer": "4", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}, "solution_sketch": "The width-to-length ratio gives $\\frac{x}{x+6}=\\frac{2}{5}$. Cross-multiplying gives $5x=2x+12$, so $3x=12$ and $x=4$ cm."}, {"problem": "At the same time of day, a $2$ m post casts a $3$ m shadow. A tree casts a shadow $5$ m longer than its own height. How tall is the tree?", "answer": "10", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "Let $h$ be the height in metres, so the shadow is $h+5$. Then $\\frac{h}{h+5}=\\frac{2}{3}$ gives $3h=2h+10$, so $h=10$ m."}, {"problem": "Sam cross-multiplies $\\dfrac{x+3}{4}=\\dfrac{x}{2}$ and writes $2x+3=4x$. What is the correct solution?", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Sam did not multiply the $3$ by $2$. The correct equation is $2(x+3)=4x$, so $2x+6=4x$ and $x=3$."}, {"problem": "Solve $\\dfrac{2}{3x-1}=\\dfrac{1}{x+2}$.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=\\frac{1}{3}$ and $x=-2$. Cross-multiplying gives $2x+4=3x-1$, so $x=5$, and both sides equal $\\frac{1}{7}$."}]},
    {"id": "kp3", "name": "Clear denominators", "key_prerequisites": ["equations-with-fractions"], "constraints": "two or three terms, one with x in a monomial denominator; multiply through by that denominator; integer or simple-fraction solutions", "step_check": {"step": "Multiply all terms by $2x$", "question": "Why must the $2$ on the right be multiplied by $2x$ as well as the fractions?", "options": ["Only the fractions need it, because the whole number $2$ has no denominator to clear away", "Multiplying only some terms would change the equation, so every term is scaled by $2x$", "The factor $2x$ is the least common denominator, so it is applied to the left side only"], "answer": "Multiplying only some terms would change the equation, so every term is scaled by $2x$", "why": "Each side of the equation must be multiplied as a whole, which means every term on both sides."}, "exemplars": [{"problem": "Solve $\\dfrac{1}{x}+\\dfrac{1}{2}=1$.", "answer": "2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $x\\ne0$, multiply every term by the common denominator $2x$ to get $2+x=2x$. So $x=2$."}, {"problem": "Solve $\\dfrac{2}{x}+3=\\dfrac{5}{x}$.", "answer": "1", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $x\\ne0$, multiply every term by $x$ to get $2+3x=5$. So $x=1$."}, {"problem": "Solve $\\dfrac{3}{2x}-\\dfrac{1}{4x}=\\dfrac{5}{12}$.", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply every term by the least common denominator $12x$ to get $18-3=5x$. So $x=3$."}, {"problem": "Solve $\\dfrac{1}{2}+\\dfrac{1}{3}=\\dfrac{5}{x}$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "The left side is $\\frac{5}{6}$. Multiplying by $6x$ gives $5x=30$, so $x=6$."}, {"problem": "Ana mows a lawn in $10$ hours. Working with Ben she mows it in $6$ hours. How long would Ben take to mow it alone?", "answer": "15", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "Ana does $\\frac{1}{10}$ of the lawn each hour, Ben does $\\frac{1}{x}$ and together they do $\\frac{1}{6}$. Solving $\\frac{1}{10}+\\frac{1}{x}=\\frac{1}{6}$ gives $x=15$ hours."}, {"problem": "A $30$ km walk is done at a steady speed. With a half-hour rest, the whole outing takes $4\\frac{1}{2}$ hours. What is the walking speed?", "answer": "15/2", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}, "solution_sketch": "Walking time is $\\frac{30}{x}$ hours, so $\\frac{30}{x}+\\frac{1}{2}=\\frac{9}{2}$. Then $\\frac{30}{x}=4$ and $x=\\frac{15}{2}$ km/h."}, {"problem": "Sam solves $\\dfrac{6}{x}+1=3$ by multiplying by $x$ and writes $6+1=3x$. What is the correct solution?", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Sam did not multiply the $1$ by $x$. The correct equation is $6+x=3x$, so $x=3$."}, {"problem": "Solve $\\dfrac{7}{x}-\\dfrac{2}{3}=\\dfrac{1}{x}$.", "answer": "9", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $x\\ne0$, multiply every term by $3x$ to get $21-2x=3$. So $x=9$."}]}
  ]},
  {"id": "inverse-variation", "name": "Inverse Variation", "core": true, "difficulty": 0.55, "drill": false, "answer_kind": "expression", "expected_time_secs": 100, "prerequisites": [{"id": "proportional-relationships", "weight": 0.6, "key": true}, {"id": "basic-rational-equations", "weight": 0.6, "key": true}, {"id": "rational-expression-restrictions", "weight": 0.3}, {"id": "reading-function-graphs", "weight": 0.2}], "diagnostic_exemplar": {"problem": "$y$ varies inversely with $x$, and $y = 10$ when $x = 3$. Find $y$ when $x = 5$.", "answer": "6", "solution_sketch": "$k = 10 \\cdot 3 = 30$; $y = \\frac{30}{5} = 6$."}, "anki_seeds": [{"front": "Inverse variation: equation form and what stays constant?", "back": "y = k/x — the product xy = k is constant (direct variation keeps the ratio y/x constant)", "type": "basic"}, {"front": "In inverse variation, doubling x does what to y?", "back": "halves it (multiplying x by a multiplies y by 1/a)", "type": "basic"}, {"front": "The graph of y = k/x has no point at ___ and never touches ___.", "back": "x = 0; the coordinate axes (two separate branches)", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Find k and use y = k/x", "key_prerequisites": ["proportional-relationships", "basic-rational-equations"], "constraints": "equation form y = k/x with k = xy; integer k and integer or simple-fraction values; contrast with y = kx (direct) in wording only", "step_check": {"step": "The constant is the product of the coordinates: $k=xy$", "question": "Why is $k$ found by multiplying $x$ and $y$ rather than adding them or dividing $y$ by $x$?", "options": ["In an inverse variation the two values add up to a constant, so $k$ is $x+y$ for every pair", "Dividing $y$ by $x$ gives the same constant, since $y/x$ and $xy$ are always equal here", "From $y=k/x$ we get $xy=k$, but the quotient $y/x$ is constant only in direct variation"], "answer": "From $y=k/x$ we get $xy=k$, but the quotient $y/x$ is constant only in direct variation", "why": "Because $y=k/x$, the product $xy$ always equals $k$; the quotient $y/x$ would be $k/x^2$, which changes."}, "exemplars": [{"problem": "$y$ varies inversely with $x$, and $y=9$ when $x=4$. Write an equation that gives $y$ in terms of $x$.", "answer": "y = 36/x", "answer_contract": {"kind": "exact"}, "solution_sketch": "In an inverse variation the product $xy$ is constant, so $k=4\\cdot9=36$. The equation is therefore $y=\\frac{36}{x}$."}, {"problem": "$y$ varies inversely with $x$, and $y=12$ when $x=2$. Find $y$ when $x=8$.", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "The known pair gives the constant product $k=2\\cdot12=24$. Then at $x=8$ we get $y=\\frac{24}{8}=3$."}, {"problem": "$y$ varies inversely with $x$. When $x=3$, $y=8$. When $x=6$, $y=c$. Find $c$.", "answer": "4", "answer_contract": {"kind": "exact"}, "solution_sketch": "The first pair gives the constant product $k=3\\cdot8=24$. The second pair must have the same product, so $6c=24$ and $c=4$."}, {"problem": "The time to empty a pool varies inversely with the number of pumps working. Three pumps take $10$ hours. How long do five pumps take?", "answer": "6", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "More pumps need less time, so pumps times hours is constant: $3\\cdot10=30$. With five pumps $5t=30$, so $t=6$ hours."}, {"problem": "The pressure of a gas in a sealed syringe varies inversely with its volume. At $2$ litres the pressure is $150$ kPa. What is the volume when the pressure is $60$ kPa?", "answer": "5", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}, "solution_sketch": "Pressure times volume is constant: $150\\cdot2=300$. At $60$ kPa, the volume is $\\frac{300}{60}=5$ litres."}, {"problem": "If $y=\\dfrac{40}{x}$ and $y=5$, find $x$.", "answer": "8", "answer_contract": {"kind": "exact"}, "solution_sketch": "Substitute $y=5$ to get $5=\\frac{40}{x}$. Multiplying both sides by $x$ gives $5x=40$, so $x=8$."}, {"problem": "Sam is told that $y$ varies inversely with $x$, and $y=6$ when $x=2$. He writes $y=3x$. What is $y$ when $x=4$?", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Sam used $y=kx$, which is direct variation. Here $k=2\\cdot6=12$, so $y=\\frac{12}{x}$ and $y=\\frac{12}{4}=3$."}, {"problem": "A prize of $\\$120$ is shared equally by $n$ winners, and each winner receives $y$ dollars. Write an equation that gives $y$ in terms of $n$.", "answer": "y = 120/n", "answer_contract": {"kind": "exact"}, "solution_sketch": "Each share is the total divided by the number of winners. So $y=\\frac{120}{n}$, and the product $ny=120$ is constant."}]},
    {"id": "kp2", "name": "Solve across two states; halve-and-double reasoning", "key_prerequisites": ["basic-rational-equations"], "constraints": "constant-product reasoning across two states; one applied context (speed-time, workers-time) with metric units; integer or simple-fraction answers", "step_check": {"step": "Equal work gives $30n_1=18n_2$", "question": "Why does equal work give $30n_1=18n_2$?", "options": ["Crew size times hours is the total work, and the same job needs the same total twice", "Crew size divided by hours is the work rate, and both crews must have the same rate", "Crew size plus hours is the total work, so $30+n_1$ must equal $18+n_2$ for the two crews"], "answer": "Crew size times hours is the total work, and the same job needs the same total twice", "why": "The job is the same, so (crew size) x (hours) is the same fixed amount of work for both crews."}, "try_first": {"problem": "A car trip takes $6$ hours at $60$ km/h. How many hours does the trip take at $120$ km/h?", "answer_contract": {"kind": "exact"}, "answer": "3", "reveal": "Doubling the speed halves the time, because speed times time is the fixed distance. Whenever two quantities have a constant product, multiplying one by a factor divides the other by the same factor."}, "exemplars": [{"problem": "$y$ varies inversely with $x$, and $y=4$ when $x=9$. Find $y$ when $x=6$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "The product $xy=9\\cdot4=36$ stays constant in an inverse variation. So at $x=6$ we get $y=\\frac{36}{6}=6$."}, {"problem": "In an inverse variation, $x$ is tripled. By what factor is $y$ multiplied?", "answer": "1/3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $xy=k$, replacing $x$ by $3x$ gives $y_{new}=\\frac{k}{3x}$. This is $\\frac{1}{3}$ of the old $y$."}, {"problem": "A fixed journey takes $6$ hours at $80$ km/h. How long does it take at $120$ km/h?", "answer": "4", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "The distance is $6\\cdot80=480$ km. At $120$ km/h the time is $\\frac{480}{120}=4$ hours."}, {"problem": "Twelve identical workers lay a road in $15$ days. How many days would $20$ identical workers need?", "answer": "9", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "day", "allow_omitted": true}, "solution_sketch": "Workers times days is constant: $12\\cdot15=180$. With $20$ workers the time is $\\frac{180}{20}=9$ days."}, {"problem": "A crew of equal workers finishes a surveying job in $24$ hours. A larger crew finishes the same job in $16$ hours. By what factor did the crew size increase?", "answer": "3/2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Crew size times hours is the same fixed amount of work, so $24n_1=16n_2$. Dividing by $16n_1$ gives $\\frac{n_2}{n_1}=\\frac{24}{16}=\\frac{3}{2}$."}, {"problem": "A gas is compressed from $8$ litres to $2$ litres at constant temperature, so its pressure varies inversely with its volume. By what factor does the pressure change?", "answer": "4", "answer_contract": {"kind": "exact"}, "solution_sketch": "Pressure times volume is constant. The volume is divided by $\\frac{8}{2}=4$, so the pressure is multiplied by $4$."}, {"problem": "Sam says that when $x$ goes from $4$ to $12$ in an inverse variation, $y$ is multiplied by $3$. What is the correct factor?", "answer": "1/3", "answer_contract": {"kind": "exact"}, "solution_sketch": "The input is multiplied by $\\frac{12}{4}=3$. In an inverse variation $y$ is divided by $3$, so it is multiplied by $\\frac{1}{3}$."}, {"problem": "A rent of $\\$900$ is shared equally by $3$ flatmates. A fourth person moves in and the rent is shared equally by $4$. By how many dollars does the share of each flatmate fall?", "answer": "75", "answer_contract": {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}, "solution_sketch": "The share was $\\frac{900}{3}=300$ dollars and becomes $\\frac{900}{4}=225$. The fall is $300-225=75$ dollars."}]},
    {"id": "kp3", "visuals": [{"kind": "curve", "x_min": "-6", "x_max": "6", "y_min": "-6", "y_max": "6", "x_tick": "1", "y_tick": "1", "curve": {"family": "reciprocal", "a": "4", "h": "0", "k": "0"}, "key_points": [{"x": "2", "y": "2", "label": "A"}, {"x": "-2", "y": "-2"}, {"x": "4", "y": "1"}, {"x": "-4", "y": "-1"}], "asymptotes": [{"axis": "horizontal", "at": "0"}, {"axis": "vertical", "at": "0"}], "caption": "The graph of y = 4/x, the reciprocal parent graph with both asymptotes at the axes."}], "name": "The reciprocal parent graph", "key_prerequisites": ["rational-expression-restrictions", "reading-function-graphs"], "constraints": "parent graph y = k/x with k > 0 only; no shifts; excluded value, branch behavior, and point checks — no asymptote vocabulary beyond 'never touches the axes'", "step_check": {"step": "Substitute: $20/4=5$", "question": "Why does $20/4=5$ show that $(4,5)$ lies on $y=\\frac{20}{x}$?", "options": ["The output $5$ is a whole number, and every point with a whole-number output lies on the graph", "A point is on the graph exactly when its coordinates satisfy the equation", "The input $4$ is allowed in the domain, and so every point with that input lies on the graph"], "answer": "A point is on the graph exactly when its coordinates satisfy the equation", "why": "The graph is the set of all points whose coordinates make $y=\\frac{20}{x}$ true."}, "exemplars": [{"problem": "Which value of $x$ is excluded from the domain of $y=\\dfrac{12}{x}$?", "answer": "0", "answer_contract": {"kind": "exact"}, "solution_sketch": "At $x=0$ the denominator is zero, so the quotient $\\frac{12}{0}$ has no value. Every other value of $x$ is allowed."}, {"problem": "As $x$ increases through positive values, does $y=\\dfrac{8}{x}$ increase or decrease?", "answer": "decreasing", "answer_contract": {"kind": "label", "options": [["decreasing", "decrease", "it decreases", "decreases", "y decreases", "goes down", "it goes down", "gets smaller"], ["increasing", "increase", "it increases", "increases", "y increases", "goes up", "it goes up", "gets larger"]]}, "solution_sketch": "For $0<a<b$ we have $\\frac{1}{a}>\\frac{1}{b}$, and multiplying by $8$ keeps this order. So $y$ decreases as $x$ increases; for example $y=4$ at $x=2$ and $y=2$ at $x=4$."}, {"problem": "The graph of $y=\\dfrac{6}{x}$ passes through the point $(2,c)$. Find $c$.", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "A point on the graph has coordinates that satisfy the equation. Substituting $x=2$ gives $c=\\frac{6}{2}=3$."}, {"problem": "As $|x|$ grows larger and larger, the graph of $y=\\dfrac{10}{x}$ gets closer and closer to a horizontal line. What is the equation of that line?", "answer": "y = 0", "answer_contract": {"kind": "exact"}, "solution_sketch": "For large $|x|$ the quotient $\\frac{10}{x}$ is very close to zero. So the graph approaches the line $y=0$, the $x$-axis, but never reaches it."}, {"problem": "Which of the points $(2,8)$, $(3,5)$ and $(9,2)$ lies on the graph of $y=\\dfrac{18}{x}$?", "answer": "(9, 2)", "answer_contract": {"kind": "coordinates", "arity": 2}, "solution_sketch": "A point lies on the graph when $xy=18$. Here $2\\cdot8=16$ and $3\\cdot5=15$ both fail, while $9\\cdot2=18$ works."}, {"problem": "A $240$ km trip at a steady speed of $v$ km/h takes $t=\\dfrac{240}{v}$ hours. How long does the trip take at $60$ km/h?", "answer": "4", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "The speed $60$ km/h goes in place of $v$. Substituting $v=60$ gives $t=\\frac{240}{60}=4$ hours."}, {"problem": "A rectangle has area $24$ cm$^2$ and width $w$ cm, so its length is $\\ell=\\dfrac{24}{w}$ cm. What width gives a length of $8$ cm?", "answer": "3", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}, "solution_sketch": "Set the length $8$ equal to $\\frac{24}{w}$. Multiplying both sides by $w$ gives $8w=24$, so $w=3$ cm."}, {"problem": "Sam says that $y=\\dfrac{12}{x}$ is $0$ when $x=12$, because $12-12=0$. What is $y$ when $x=12$?", "answer": "1", "answer_contract": {"kind": "exact"}, "solution_sketch": "The equation divides $12$ by $x$ and does not subtract. So $y=\\frac{12}{12}=1$, and $y$ is never $0$ for this graph."}]}
  ]},
  {"id": "rational-equations", "name": "Solving Rational Equations", "core": true, "difficulty": 0.7, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 180, "prerequisites": [{"id": "basic-rational-equations", "weight": 0.7, "key": true}, {"id": "adding-subtracting-rational-expressions", "weight": 0.5, "key": true}, {"id": "quadratic-equations-factoring", "weight": 0.4}, {"id": "rational-expression-restrictions", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Solve $\\frac{x^2}{x - 2} = \\frac{4}{x - 2} + 3$.", "answer": "x = 1", "solution_sketch": "Clear $(x - 2)$ to get $x^2 = 3x - 2$, so $(x - 1)(x - 2) = 0$; $x = 2$ is extraneous."}, "anki_seeds": [{"front": "An extraneous solution of a rational equation is...", "back": "a root of the cleared equation that makes an original denominator zero.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Clear denominators in multi-term equations", "key_prerequisites": ["basic-rational-equations", "adding-subtracting-rational-expressions"], "constraints": "two or three terms with monomial or linear-binomial denominators; the cleared equation is linear; solutions may be fractions", "step_check": {"step": "Multiply every term by $4x$", "question": "Why can every term of $\\frac{6}{x}+\\frac{1}{4}=1$ be multiplied by $4x$?", "options": ["Multiplying both sides by a nonzero number, here $4x$ for $x\\ne0$, keeps the solutions", "The number $4x$ is the sum of the two denominators, and that sum always clears the fractions", "Each term needs $4x$ so that the final answer for $x$ comes out as a whole number"], "answer": "Multiplying both sides by a nonzero number, here $4x$ for $x\\ne0$, keeps the solutions", "why": "The least common denominator $4x$ is nonzero for allowed $x$, so multiplying by it does not change the solutions."}, "exemplars": [{"problem": "Solve $\\dfrac{5}{x+1}+\\dfrac{1}{2}=2$.", "answer": "7/3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=-1$. Subtracting $\\frac{1}{2}$ from both sides gives $\\frac{5}{x+1}=\\frac{3}{2}$, so $10=3(x+1)$ and $x=\\frac{7}{3}$."}, {"problem": "Solve $\\dfrac{4}{x}-\\dfrac{1}{3}=\\dfrac{1}{x}$.", "answer": "9", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Moving the terms in $x$ to one side gives $\\frac{3}{x}=\\frac{1}{3}$, so $x=9$."}, {"problem": "Solve $\\dfrac{3}{x-2}+\\dfrac{1}{4}=1$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=2$. Subtracting $\\frac{1}{4}$ from both sides gives $\\frac{3}{x-2}=\\frac{3}{4}$, so $x-2=4$ and $x=6$."}, {"problem": "Solve $\\dfrac{2}{x}+\\dfrac{3}{2x}=\\dfrac{7}{4}$.", "answer": "2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying every term by the common denominator $4x$ gives $8+6=7x$, so $x=2$."}, {"problem": "Ana paints a fence in $4$ hours. Working with Ben she paints it in $3$ hours. How long would Ben take to paint it alone?", "answer": "12", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "Ana paints $\\frac{1}{4}$ of the fence each hour, Ben paints $\\frac{1}{x}$ and together they paint $\\frac{1}{3}$. Solving $\\frac{1}{4}+\\frac{1}{x}=\\frac{1}{3}$ gives $x=12$ hours."}, {"problem": "A boat goes $36$ km downstream and $24$ km upstream in the same time. The river current is $2$ km/h. What is the speed of the boat in still water?", "answer": "10", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}, "solution_sketch": "Let the boat speed be $x$ km/h, so the times are $\\frac{36}{x+2}$ and $\\frac{24}{x-2}$. Setting them equal gives $36x-72=24x+48$, so $x=10$ km/h."}, {"problem": "Sam multiplies $\\dfrac{2}{x}+\\dfrac{1}{3}=\\dfrac{5}{6}$ by $6x$ and writes $12+2x=5$. What is the correct solution?", "answer": "4", "answer_contract": {"kind": "exact"}, "solution_sketch": "Sam did not multiply the right side by $x$. The correct equation is $12+2x=5x$, so $3x=12$ and $x=4$."}, {"problem": "Solve $\\dfrac{1}{x-1}+\\dfrac{2}{x-1}=\\dfrac{3}{4}$.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=1$. Combining the left side gives $\\frac{3}{x-1}=\\frac{3}{4}$, so $x-1=4$ and $x=5$."}]},
    {"id": "kp2", "name": "Equations that lead to a quadratic", "key_prerequisites": ["quadratic-equations-factoring", "adding-subtracting-rational-expressions"], "constraints": "clearing denominators gives a monic quadratic that factors over the integers; report both roots", "step_check": {"step": "Rearrange and factor", "question": "Why is the equation brought to the form $x^2-2x-8=0$ before it is factored?", "options": ["Factoring only works on expressions that are written in descending powers of $x$", "Setting each factor equal to the right side works for any number, and zero is only the easiest one", "A product is zero only when a factor is zero, so each factor can be set to zero on its own"], "answer": "A product is zero only when a factor is zero, so each factor can be set to zero on its own", "why": "Only the zero product property lets us solve each factor separately, so one side must be $0$."}, "exemplars": [{"problem": "Solve $x+\\dfrac{6}{x}=5$.", "answer": "2, 3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying by $x$ gives $x^2-5x+6=(x-2)(x-3)=0$, and both roots are allowed."}, {"problem": "Solve $x-\\dfrac{12}{x}=1$.", "answer": "-3, 4", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying by $x$ gives $x^2-x-12=(x-4)(x+3)=0$, and both roots are allowed."}, {"problem": "Solve $\\dfrac{4}{x}=x$.", "answer": "-2, 2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying by $x$ gives $4=x^2$, so $x=\\pm2$, and both values are allowed."}, {"problem": "Solve $x+\\dfrac{9}{x}=6$.", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying by $x$ gives $x^2-6x+9=(x-3)^2=0$, so $3$ is the only solution."}, {"problem": "A rectangle has area $24$ cm$^2$ and width $w$ cm, so its length is $\\dfrac{24}{w}$ cm. The length is $2$ cm more than the width. Find the width.", "answer": "4", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}, "solution_sketch": "Set $\\frac{24}{w}=w+2$, so $24=w^2+2w$ and $(w+6)(w-4)=0$. A width cannot be negative, so $w=4$ cm."}, {"problem": "Two numbers have product $20$, and the first number is $1$ more than the second. Find all possible values of the first number.", "answer": "-4, 5", "answer_contract": {"kind": "exact"}, "solution_sketch": "If the first number is $x$, the second is $\\frac{20}{x}$, so $x-\\frac{20}{x}=1$. Then $x^2-x-20=(x-5)(x+4)=0$; both $5$ and $-4$ work, because $5\\cdot4=20$ and $(-4)(-5)=20$."}, {"problem": "Sam solves $x-\\dfrac{10}{x}=3$ by multiplying by $x$ and writes $x^2-10=3$. What are the correct solutions?", "answer": "-2, 5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Sam did not multiply the $3$ on the right by $x$. The correct equation is $x^2-10=3x$, so $(x-5)(x+2)=0$."}, {"problem": "Solve $\\dfrac{15}{x}=x+2$.", "answer": "-5, 3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying by $x$ gives $15=x^2+2x$, so $(x+5)(x-3)=0$ and the roots are $-5$ and $3$."}]},
    {"id": "kp3", "name": "Extraneous solutions", "key_prerequisites": ["rational-expression-restrictions", "basic-rational-equations"], "constraints": "the cleared equation has a root at an excluded value", "step_check": {"step": "Reject $6$ because it is excluded", "question": "Why must $6$ be rejected even though it solves the cleared equation?", "options": ["Only the larger root of a cleared equation is ever kept, and $6$ is the smaller root of this one", "At $x=6$ the original denominator $x-6$ is zero, so the original equation is undefined", "The value $6$ appears in the denominator, and any number written there is always rejected"], "answer": "At $x=6$ the original denominator $x-6$ is zero, so the original equation is undefined", "why": "A solution must make every original denominator nonzero; $6$ fails that test, so it is excluded."}, "try_first": {"problem": "Is $x=3$ a solution of $\\dfrac{x}{x-3}=\\dfrac{3}{x-3}$?", "answer_contract": {"kind": "label", "options": [["yes", "it is", "is a solution", "it is a solution", "yes it is", "yes, it is"], ["no", "it is not", "not a solution", "is not a solution", "no it is not", "no, it is not", "it isn't", "no, it isn't"]]}, "answer": "no", "reveal": "At $x=3$ both denominators are zero, so neither side has a value. A number that makes an original denominator zero is never a solution, even when it solves the cleared equation."}, "exemplars": [{"problem": "Solve $\\dfrac{x^2-4}{x-2}=7$.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=2$. Clearing the denominator gives $x^2-4=7x-14$, so $(x-2)(x-5)=0$. The root $2$ is excluded, and $5$ works because $\\frac{21}{3}=7$."}, {"problem": "Solve $\\dfrac{x^2}{x-3}=\\dfrac{9}{x-3}+9$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=3$. Clearing gives $x^2=9+9(x-3)$, so $x^2-9x+18=(x-3)(x-6)=0$. The root $3$ is excluded, and $6$ works."}, {"problem": "Solve $\\dfrac{1}{x-4}+\\dfrac{1}{x+4}=\\dfrac{x^2-3x+4}{x^2-16}$.", "answer": "1", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $4$ and $-4$. Clearing gives $2x=x^2-3x+4$, so $(x-1)(x-4)=0$. The root $4$ is excluded, and at $1$ both sides equal $-\\frac{2}{15}$."}, {"problem": "Solve $\\dfrac{x^2+3x-10}{x+5}=9$.", "answer": "11", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=-5$. The numerator factors as $(x+5)(x-2)$, and clearing gives $(x+5)(x-11)=0$. The root $-5$ is excluded; at $11$ the quotient is $\\frac{144}{16}=9$."}, {"problem": "Sam solves $\\dfrac{x^2}{x-1}=\\dfrac{1}{x-1}+4$ and reports the solutions $1$ and $3$. What are the correct solutions?", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Clearing gives $x^2=1+4(x-1)$, so $(x-1)(x-3)=0$. But $x=1$ makes the denominator zero, so only $3$ is a solution."}, {"problem": "Is $x=5$ a solution of $\\dfrac{x^2-25}{x-5}=10$?", "answer": "no", "answer_contract": {"kind": "label", "options": [["yes", "it is", "is a solution", "it is a solution", "yes it is", "yes, it is"], ["no", "it is not", "not a solution", "is not a solution", "no it is not", "no, it is not", "it isn't", "no, it isn't"]]}, "solution_sketch": "At $x=5$ the denominator is $0$, so the left side is undefined. Clearing the denominator gives the root $5$, but it is excluded, so it is not a solution."}, {"problem": "A number is squared and $16$ is subtracted. Dividing the result by $4$ less than the number gives $11$. What is the number?", "answer": "7", "answer_contract": {"kind": "exact"}, "solution_sketch": "Set $\\frac{x^2-16}{x-4}=11$ with $x\\ne4$. Clearing gives $x^2-11x+28=(x-4)(x-7)=0$. The root $4$ is excluded, so the number is $7$."}, {"problem": "A rectangle has width $(x-4)$ cm and area $(x^2-16)$ cm$^2$. Its length is $12$ cm. Find $x$.", "answer": "8", "answer_contract": {"kind": "exact"}, "solution_sketch": "Area is width times length, so $\\frac{x^2-16}{x-4}=12$. Clearing gives $(x-4)(x-8)=0$. A width of $0$ is impossible, so $x=8$."}]}
  ]},
  {"id": "work-rate-problems", "name": "Work and Rate Problems", "core": false, "difficulty": 0.75, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 240, "prerequisites": [{"id": "rational-equations", "weight": 0.7, "key": true}, {"id": "ratios-proportions", "weight": 0.4}], "diagnostic_exemplar": {"problem": "A tap fills a tank in $4$ hours while an open drain empties it in $12$ hours. With both running, how long does the tank take to fill?", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h"}, "answer": "6 h", "solution_sketch": "Rates add, the drain negatively: $\\frac{1}{4} - \\frac{1}{12} = \\frac{1}{6}$ tank per hour."}, "anki_seeds": [{"front": "If a job takes t hours, the work rate is...", "back": "1/t of the job per hour.", "type": "basic"}, {"front": "Combined work rate of two workers = ...", "back": "the sum of their individual rates.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Combined work time", "key_prerequisites": ["rational-equations", "ratios-proportions"], "constraints": "individual times chosen so the combined time is a whole number", "step_check": {"step": "Add: $3/30+2/30+1/30=6/30=1/5$", "question": "Why are the rates of the three taps added?", "options": ["The three times $10$, $15$ and $30$ are added and then shared out equally", "Each tap fills part of the cistern every hour, so the parts add up", "The slowest tap sets the time, so the rest are added to it"], "answer": "Each tap fills part of the cistern every hour, so the parts add up", "why": "The cistern fills $1/10+1/15+1/30=1/5$ per hour, which is $5$ hours for one cistern; adding the times $10+15+30$ would give $55$ hours, far too long."}, "exemplars": [{"problem": "Ann paints a room in $3$ hours and Ben paints the same room in $6$ hours. How long do they take if they work together?", "answer": "2", "solution_sketch": "In one hour Ann paints $1/3$ of the room and Ben paints $1/6$ of it, so together they paint $1/3+1/6=1/2$ of the room per hour. The whole room then takes $1/(1/2)=2$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Three taps fill a cistern alone in $12$, $18$ and $36$ hours. How long do the three taps take to fill it together?", "answer": "6", "solution_sketch": "The three rates are $1/12$, $1/18$ and $1/36$ of the cistern per hour, and they add to $3/36+2/36+1/36=6/36=1/6$. One whole cistern then takes $6$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Each of two identical printers prints a batch of leaflets in $8$ hours. How long do the two printers need for one batch if they print together?", "answer": "4", "solution_sketch": "Each printer does $1/8$ of a batch per hour, so the pair does $2/8=1/4$ of a batch per hour. One batch takes $4$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "One painter needs $10$ hours for a room and another painter needs $15$ hours. They start when half of the room is already painted. How long do they need to finish it together?", "answer": "3", "solution_sketch": "Together they paint $1/10+1/15=1/6$ of the room per hour. The half room that is left takes $(1/2)/(1/6)=3$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "One pump fills $1/4$ of a pool every hour and a second pump fills $1/12$ of the pool every hour. How long do the two pumps need to fill the whole pool?", "answer": "3", "solution_sketch": "The combined rate is $3/12+1/12=1/3$ of the pool per hour. The whole pool takes the reciprocal, $3$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Mia mows a lawn in $4$ hours and Raj mows the same lawn in $12$ hours. They work together for $2$ hours. What fraction of the lawn have they mowed?", "answer": "2/3", "solution_sketch": "Together they mow $1/4+1/12=1/3$ of the lawn per hour. In $2$ hours they mow $2\\cdot\\frac{1}{3}=2/3$ of the lawn.", "answer_contract": {"kind": "exact"}}, {"problem": "Five identical machines each stamp a full order in $20$ hours. How long do all five need for one order when they work together?", "answer": "4", "solution_sketch": "Each machine does $1/20$ of the order per hour, so five machines do $5/20=1/4$ per hour. The order takes $4$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}]},
    {"id": "kp2", "name": "Find an unknown individual time", "key_prerequisites": ["rational-equations"], "constraints": "1/a + 1/b = 1/t with two of the three times given; whole-hour data chosen so the unknown time is a whole number", "step_check": {"step": "The second rate is $1/6-1/10=5/30-3/30=1/15$", "question": "Why is the first pump's rate subtracted from the combined rate?", "options": ["The two rates sum to the combined rate, so subtracting one leaves the other", "Subtracting rates shows how much longer the second pump takes than the first", "Rates of two pumps are always subtracted when they empty a reservoir"], "answer": "The two rates sum to the combined rate, so subtracting one leaves the other", "why": "The second rate must make $1/10$ plus itself equal $1/6$, so it is $1/6-1/10=1/15$ of the reservoir per hour, which is $15$ hours alone."}, "exemplars": [{"problem": "Together two crews finish a job in $4$ hours. The first crew alone needs $12$ hours. How long does the second crew need alone?", "answer": "6", "solution_sketch": "The combined rate is $1/4$ of the job per hour and the first crew supplies $1/12$. The second crew supplies $1/4-1/12=1/6$ per hour, so it needs $6$ hours alone.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Two painters together finish $1/3$ of a room every hour. The first painter alone finishes $1/4$ of a room every hour. How long does the second painter need for a whole room?", "answer": "12", "solution_sketch": "The second painter does $1/3-1/4=1/12$ of a room per hour. A whole room therefore takes $12$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "A helper works three times as fast as a machine, and together they finish an order in $6$ hours. How long would the machine need alone?", "answer": "24", "solution_sketch": "Let the machine do $r$ of the order per hour, so the helper does $3r$ and together they do $4r=1/6$. Then $r=1/24$ and the machine needs $24$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Two identical crews together finish a job in $5$ hours. How long does either crew need alone?", "answer": "10", "solution_sketch": "Each crew supplies half of the combined rate $1/5$, which is $1/10$ of the job per hour. Either crew needs $10$ hours alone.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Dev and Eli together paint a fence in $12$ hours. Dev alone would need $20$ hours. How long would Eli need alone?", "answer": "30", "solution_sketch": "Eli paints $1/12-1/20=5/60-3/60=1/30$ of the fence per hour. Alone Eli needs $30$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Kai works twice as fast as Lou. Together they finish a job in $4$ hours. How long would Lou need alone?", "answer": "12", "solution_sketch": "Let Lou do $r$ of the job per hour, so Kai does $2r$ and together $3r=1/4$. Then $r=1/12$, so Lou needs $12$ hours alone.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "One hose fills a pool in $6$ hours. With a second hose also open, the pool fills in $2$ hours. How long would the second hose need alone?", "answer": "3", "solution_sketch": "The second hose supplies $1/2-1/6=1/3$ of the pool per hour. Alone it needs $3$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}]},
    {"id": "kp3", "name": "Opposing rates and round trips", "key_prerequisites": ["rational-equations"], "constraints": "rates that oppose each other (fill against drain, so subtract), or an out-and-back trip whose two speeds differ by a constant; whole-number answers", "step_check": {"step": "The net filling rate is $1/6-1/12=2/12-1/12=1/12$", "question": "Why is the drain's rate subtracted from the inlet's rate?", "options": ["The drain is the slower of the two rates, so its rate is the one subtracted", "Both rates are fractions of a tank, and two fractions are always subtracted", "The inlet adds water and the drain removes it, so the net is the gap"], "answer": "The inlet adds water and the drain removes it, so the net is the gap", "why": "Each hour the tank gains $1/6$ and loses $1/12$, a net gain of $1/12$ of the tank, so it fills in $12$ hours."}, "exemplars": [{"problem": "A pipe fills a tank in $6$ hours and an open drain empties the full tank in $10$ hours. How long does the empty tank take to fill when the pipe and the drain are both open?", "answer": "15", "solution_sketch": "The drain works against the pipe, so the net rate is $1/6-1/10=1/15$ of the tank per hour. The tank takes $15$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "A tank is half full. An inlet adds $1/4$ of the tank every hour and a drain removes $1/8$ of the tank every hour. How long until the tank is full?", "answer": "4", "solution_sketch": "The net rate is $1/4-1/8=1/8$ of the tank per hour. The missing half takes $(1/2)/(1/8)=4$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "A cyclist rides $12$ km out at a steady speed and returns at a speed $2$ km/h slower. The round trip takes $5$ hours. How fast does the cyclist ride on the way out?", "answer": "6", "solution_sketch": "Let $x$ km/h be the outward speed, so the return speed is $x-2$ km/h. The times add: $12/x+12/(x-2)=5$, which gives $5x^2-34x+24=(x-6)(5x-4)=0$. Only $x=6$ makes the return speed positive.", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}}, {"problem": "A boat travels $12$ km downstream at $8$ km/h and returns the same $12$ km at $4$ km/h. How long does the whole trip take?", "answer": "9/2", "solution_sketch": "Each leg takes distance divided by its own speed: $12/8=3/2$ hours downstream and $12/4=3$ hours back. The total is $9/2$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "A bath tap fills the bath in $8$ minutes. With the plug out, a full bath drains in $24$ minutes. How long does the empty bath take to fill with the tap running and the plug out?", "answer": "12", "solution_sketch": "The tap fills $1/8$ of the bath per minute and the open plug removes $1/24$ per minute. The net rate is $1/12$, so the bath takes $12$ minutes.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}}, {"problem": "A driver goes $60$ km to a town at $30$ km/h and returns the same way at $60$ km/h. What is the average speed for the whole trip?", "answer": "40", "solution_sketch": "The trip out takes $60/30=2$ hours and the return takes $60/60=1$ hour. The whole $120$ km takes $3$ hours, so the average speed is $120/3=40$ km/h, not the mean of $30$ and $60$.", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}}, {"problem": "A full tank has a drain that removes $1/3$ of the tank every hour and an inlet that adds $1/6$ of the tank every hour. How long does the full tank take to empty?", "answer": "6", "solution_sketch": "The drain is faster, so the tank loses $1/3-1/6=1/6$ of its water per hour. It empties in $6$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "A boat travels $15$ km upstream and $15$ km back in a river whose current runs at $2$ km/h. The whole trip takes $4$ hours. What is the speed of the boat in still water?", "answer": "8", "solution_sketch": "Let $x$ km/h be the speed in still water, so the speed upstream is $x-2$ and downstream is $x+2$. The times add: $15/(x-2)+15/(x+2)=4$, which gives $2x^2-15x-8=(2x+1)(x-8)=0$. The speed must be positive, so $x=8$.", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}}]}
  ]},
  {"id": "trig-ratios-definition", "name": "Defining the Trigonometric Ratios", "core": true, "difficulty": 0.5, "drill": false, "answer_kind": "expression", "expected_time_secs": 90, "prerequisites": [{"id": "ratios-proportions", "weight": 0.6, "key": true}, {"id": "pythagorean-theorem", "weight": 0.5, "key": true}], "diagnostic_exemplar": {"problem": "A right triangle has hypotenuse $10$ and one leg $6$. For the acute angle $\\phi$ adjacent to the leg of length $6$, find $\\tan \\phi$.", "answer": "4/3", "solution_sketch": "Pythagoras gives the missing leg $8$; opposite over adjacent is $\\frac{8}{6}$."}, "anki_seeds": [{"front": "SOH-CAH-TOA: sin, cos, tan equal which ratios?", "back": "sin = opp/hyp, cos = adj/hyp, tan = opp/adj.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "SOH-CAH-TOA from labeled sides", "key_prerequisites": ["ratios-proportions"], "constraints": "Pythagorean triples (3-4-5, 5-12-13, 8-15-17) scaled by small integers", "step_check": {"step": "Cosine uses adjacent over hypotenuse", "question": "Why is the leg of length $45$ the numerator of $\\cos\\theta$?", "options": ["It is the larger leg, and cosine always puts the larger leg on top", "It touches $\\theta$, so it is the adjacent leg that cosine needs", "It lies across from $\\theta$, and cosine compares that leg with the hypotenuse"], "answer": "It touches $\\theta$, so it is the adjacent leg that cosine needs", "why": "Adjacent means touching the angle; $45/51$ is cosine, while $24/51$ would be the sine, because $24$ lies across from $\\theta$."}, "exemplars": [{"problem": "In a right triangle, the leg opposite the angle $\\theta$ is $9$, the leg adjacent to it is $40$ and the hypotenuse is $41$. Find $\\sin\\theta$.", "answer": "9/41", "solution_sketch": "Sine is the opposite leg over the hypotenuse, so $\\sin\\theta=9/41$. The fraction is already in lowest terms.", "answer_contract": {"kind": "exact"}}, {"problem": "A $13$ m ladder leans against a wall. Its top is $12$ m above the ground and its foot is $5$ m from the wall. What is the sine of the angle between the ladder and the ground?", "answer": "12/13", "solution_sketch": "The wall height $12$ is opposite the angle at the foot, and the ladder $13$ is the hypotenuse. So the sine is $12/13$.", "answer_contract": {"kind": "exact"}}, {"problem": "In a right triangle the leg opposite $\\theta$ is $20$, the leg adjacent to $\\theta$ is $21$ and the hypotenuse is $29$. Find $\\cos\\theta$.", "answer": "21/29", "solution_sketch": "Cosine is the adjacent leg over the hypotenuse, so $\\cos\\theta=21/29$. The opposite leg $20$ is not used.", "answer_contract": {"kind": "exact"}}, {"problem": "A ramp is $25$ m long. It rises $7$ m over a horizontal distance of $24$ m. What is the tangent of the angle between the ramp and the horizontal?", "answer": "7/24", "solution_sketch": "Tangent compares the rise $7$ with the horizontal distance $24$, so $\\tan=7/24$. The ramp length $25$ is the hypotenuse and is not used.", "answer_contract": {"kind": "exact"}}, {"problem": "A roof rafter is $10$ m long and rises $6$ m. What is the sine of the angle the rafter makes with the horizontal?", "answer": "3/5", "solution_sketch": "The rise is opposite the angle and the rafter is the hypotenuse, so $\\sin=6/10$. Dividing top and bottom by $2$ gives $3/5$.", "answer_contract": {"kind": "exact"}}, {"problem": "Sam writes $\\sin\\theta=\\frac{12}{13}$ for a right triangle whose opposite leg is $5$, adjacent leg is $12$ and hypotenuse is $13$. What is the correct value of $\\sin\\theta$?", "answer": "5/13", "solution_sketch": "Sam used the adjacent leg $12$ on top, which belongs to cosine. Sine uses the opposite leg, so $\\sin\\theta=5/13$.", "answer_contract": {"kind": "exact"}}, {"problem": "A kite string is $17$ m long. The kite is $15$ m above the hand and $8$ m away horizontally. What is the cosine of the angle between the string and the horizontal?", "answer": "8/17", "solution_sketch": "The horizontal distance $8$ touches the angle, so it is the adjacent leg. The string $17$ is the hypotenuse, so $\\cos=8/17$.", "answer_contract": {"kind": "exact"}}]},
    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}, {"at": 2, "label": "\u03c6"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 and \u03c6 mark the two acute angles. The side opposite \u03b8 is adjacent to \u03c6, and the side opposite \u03c6 is adjacent to \u03b8."}], "name": "Ratios of the other acute angle", "key_prerequisites": ["ratios-proportions"], "constraints": "the same Pythagorean-triple triangle read from the other acute angle, so opposite and adjacent swap", "step_check": {"step": "For $\\phi$, the opposite leg is $36$ and the adjacent leg is $15$", "question": "Why do the opposite and adjacent legs swap roles for $\\phi$?", "options": ["Renaming the angle from $\\theta$ to $\\phi$ changes both leg lengths", "The hypotenuse takes the place of a leg for the other angle", "The leg across from one acute angle touches the other acute angle"], "answer": "The leg across from one acute angle touches the other acute angle", "why": "The leg $15$ is across from $\\theta$ but touches $\\phi$, and the leg $36$ is the reverse, so for $\\phi$ the tangent is $36/15=12/5$."}, "exemplars": [{"problem": "A right triangle has legs $3$ and $4$ and hypotenuse $5$. The angle $\\theta$ is opposite the leg $3$, and $\\phi$ is the other acute angle. Find $\\sin\\phi$.", "answer": "4/5", "solution_sketch": "The leg opposite $\\phi$ is the leg that touches $\\theta$, which is $4$. So $\\sin\\phi=4/5$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has legs $8$ and $15$ and hypotenuse $17$. The angle $\\theta$ is opposite the leg $8$. For the other acute angle $\\phi$, find $\\tan\\phi$.", "answer": "15/8", "solution_sketch": "For $\\phi$ the opposite leg is $15$ and the adjacent leg is $8$. So $\\tan\\phi=15/8$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has legs $5$ and $12$ and hypotenuse $13$. The angle $\\theta$ is opposite the leg $5$. For the other acute angle $\\phi$, find $\\cos\\phi$.", "answer": "5/13", "solution_sketch": "The leg adjacent to $\\phi$ is the leg opposite $\\theta$, which is $5$. So $\\cos\\phi=5/13$.", "answer_contract": {"kind": "exact"}}, {"problem": "A $13$ m ladder leans against a wall with its foot $5$ m from the wall and its top $12$ m up. At the top the ladder makes an angle $\\beta$ with the wall. What is $\\cos\\beta$?", "answer": "12/13", "solution_sketch": "The part of the wall between the ground and the top, $12$ m, touches $\\beta$, so it is adjacent. Then $\\cos\\beta=12/13$.", "answer_contract": {"kind": "exact"}}, {"problem": "In a right triangle one acute angle $\\theta$ has $\\tan\\theta=\\frac{7}{24}$. What is the tangent of the other acute angle $\\phi$?", "answer": "24/7", "solution_sketch": "The value $7/24$ means $\\theta$ has opposite leg $7$ and adjacent leg $24$. For $\\phi$ the two legs swap, so $\\tan\\phi=24/7$.", "answer_contract": {"kind": "exact"}}, {"problem": "In a right triangle one acute angle $A$ has $\\sin A=\\frac{20}{29}$. What is the cosine of the other acute angle $B$?", "answer": "20/29", "solution_sketch": "The leg opposite $A$ is the leg adjacent to $B$, and the hypotenuse is shared. So $\\cos B=20/29$.", "answer_contract": {"kind": "exact"}}, {"problem": "A wire is $15$ m long and runs from the top of a $12$ m pole to a point $9$ m from its foot. It makes an angle $\\beta$ with the pole. What is $\\sin\\beta$?", "answer": "3/5", "solution_sketch": "The ground distance $9$ lies opposite the angle $\\beta$ at the top of the pole, and the wire is the hypotenuse. So $\\sin\\beta=9/15=3/5$.", "answer_contract": {"kind": "exact"}}]},
    {"id": "kp3", "name": "Find the missing side first", "key_prerequisites": ["pythagorean-theorem"], "constraints": "two of the three sides given; find the third by Pythagoras (triples 3-4-5, 5-12-13, 8-15-17 and small multiples) before writing the ratio", "step_check": {"step": "The missing adjacent leg $b$ satisfies $b^2=15^2-9^2=225-81=144$", "question": "Why is $9^2$ subtracted from $15^2$ rather than added?", "options": ["The leg squares sum to the hypotenuse squared, so one leg squared is the gap", "A missing side is always the difference of the other two sides squared", "Subtracting keeps $b$ smaller than the hypotenuse, while adding would make it larger"], "answer": "The leg squares sum to the hypotenuse squared, so one leg squared is the gap", "why": "From $9^2+b^2=15^2$ we get $b^2=15^2-9^2=144$; adding would give $306$, a number that is not the square of a leg of this triangle."}, "exemplars": [{"problem": "A right triangle has legs $6$ and $8$. For the angle $\\theta$ opposite the leg $6$, find $\\sin\\theta$.", "answer": "3/5", "solution_sketch": "The hypotenuse is $\\sqrt{36+64}=10$, which is the side opposite the right angle. Then $\\sin\\theta=6/10=3/5$ in lowest terms.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has hypotenuse $13$ and one leg $5$. For the angle $\\theta$ adjacent to the other leg, find $\\cos\\theta$.", "answer": "12/13", "solution_sketch": "The other leg is $\\sqrt{169-25}=12$, and it is the leg that touches $\\theta$. So $\\cos\\theta=12/13$.", "answer_contract": {"kind": "exact"}}, {"problem": "A $25$ m ladder has its foot $7$ m from a wall. What is the tangent of the angle between the ladder and the ground?", "answer": "24/7", "solution_sketch": "The wall height is $\\sqrt{25^2-7^2}=\\sqrt{576}=24$ m. Tangent is opposite over adjacent, so $\\tan=24/7$.", "answer_contract": {"kind": "exact"}}, {"problem": "A $17$ m cable runs from the top of a mast to a point on the ground $8$ m from the base of the mast. What is the cosine of the angle between the cable and the mast?", "answer": "15/17", "solution_sketch": "The mast height is $\\sqrt{17^2-8^2}=\\sqrt{225}=15$ m. At the top this leg touches the angle, so $\\cos=15/17$.", "answer_contract": {"kind": "exact"}}, {"problem": "Sam is given a right triangle with legs $20$ and $21$ and writes the hypotenuse as $41$. Using the correct hypotenuse, what is $\\sin\\theta$ for the angle $\\theta$ opposite the leg $20$?", "answer": "20/29", "solution_sketch": "Sam added the legs, but the hypotenuse is found as $\\sqrt{400+441}=29$. So the sine is $\\sin\\theta=20/29$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has hypotenuse $17$ and opposite leg $15$. Find the tangent of the angle opposite the leg $15$.", "answer": "15/8", "solution_sketch": "The adjacent leg is $\\sqrt{17^2-15^2}=\\sqrt{64}=8$. Then the tangent is opposite over adjacent, $15/8$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has hypotenuse $26$ and one leg $24$. For the angle $\\theta$ opposite the other leg, find $\\tan\\theta$.", "answer": "5/12", "solution_sketch": "The other leg is $\\sqrt{676-576}=10$ and it is opposite $\\theta$. Then $\\tan\\theta=10/24=5/12$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has hypotenuse $25$ and one leg $20$. For the angle $\\theta$ opposite the other leg, find $\\tan\\theta$.", "answer": "3/4", "solution_sketch": "The other leg is $\\sqrt{625-400}=15$ and it is opposite $\\theta$. Then $\\tan\\theta=15/20=3/4$.", "answer_contract": {"kind": "exact"}}]}
  ]},
  {"id": "solving-right-triangles-sides", "name": "Right Triangles — Solving for Sides", "core": true, "difficulty": 0.55, "drill": false, "answer_kind": "numeric", "expected_time_secs": 120, "prerequisites": [{"id": "trig-ratios-definition", "weight": 0.8, "key": true}, {"id": "one-step-equations", "weight": 0.3}, {"id": "multiplying-fractions", "weight": 0.3}], "diagnostic_exemplar": {"problem": "One acute angle is $40^\\circ$ and the leg opposite it is $12.6$. Find the leg adjacent to that angle. Use $\\tan 40^\\circ \\approx 0.84$.", "answer": "15", "solution_sketch": "$\\tan 40^\\circ = \\frac{\\text{opposite}}{\\text{adjacent}} = \\frac{12.6}{x}$, so $x = \\frac{12.6}{0.84}$."}, "anki_seeds": [{"front": "To solve for a right-triangle side, pick the trig ratio that links...", "back": "the known angle, the known side, and the side you want.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Multiply to find a leg", "key_prerequisites": ["trig-ratios-definition"], "constraints": "give the needed trig value in the problem (exact or rounded)", "step_check": {"step": "Cosine gives adjacent/hypotenuse, so adjacent $=26\\cdot(5/13)$", "question": "Why is the hypotenuse multiplied by $5/13$ to get the adjacent leg?", "options": ["Cosine is adjacent over hypotenuse, so adjacent is hypotenuse times cosine", "The known side is always multiplied by the trig value, whatever side is unknown", "Cosine of the angle is multiplied by the opposite leg to get the adjacent leg"], "answer": "Cosine is adjacent over hypotenuse, so adjacent is hypotenuse times cosine", "why": "From $\\cos\\theta=\\text{adjacent}/26$ the adjacent leg is $26\\cdot\\frac5{13}=10$; the hypotenuse is known here, so we multiply."}, "exemplars": [{"problem": "A $10$ m ladder makes an angle of $30^\\circ$ with the ground. How high up the wall does it reach? Use $\\sin30^\\circ=\\frac12$.", "answer": "5", "solution_sketch": "The ladder is the hypotenuse and the height is the leg opposite the angle, so height $=10\\sin30^\\circ=10\\cdot\\frac12=5$ m. The hypotenuse is known, so multiply.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "The hypotenuse of a right triangle is $8$ and one acute angle is $60^\\circ$. Find the side adjacent to that angle. Use $\\cos60^\\circ=\\frac12$.", "answer": "4", "solution_sketch": "Cosine is adjacent over hypotenuse, so the adjacent side is $8\\cos60^\\circ=8\\cdot\\frac12=4$. The side is shorter than the hypotenuse, as it must be.", "answer_contract": {"kind": "exact"}}, {"problem": "A slide is $5$ m long and makes an angle of $40^\\circ$ with the ground. How high is the top of the slide above the ground? Use $\\sin40^\\circ\\approx0.64$.", "answer": "3.2", "solution_sketch": "The height is opposite the angle, so it is $5\\sin40^\\circ\\approx5(0.64)=3.2$ m. The slide is the hypotenuse, so the height must be less than $5$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A kite string is $12$ m long and makes an angle of $45^\\circ$ with the ground. The string is taut. How high is the kite above the ground? Use $\\sin45^\\circ=\\frac{\\sqrt2}{2}$.", "answer": "6sqrt(2)", "solution_sketch": "The kite height is opposite the angle, so it is $12\\sin45^\\circ=12\\cdot\\frac{\\sqrt2}{2}=6\\sqrt2$ m. This is about $8.5$ m, less than the string length $12$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "A ramp is $20$ m long and makes an angle of $30^\\circ$ with the ground. What is its horizontal length? Use $\\cos30^\\circ=\\frac{\\sqrt3}{2}$.", "answer": "10sqrt(3)", "solution_sketch": "The horizontal length is adjacent to the angle, so it is $20\\cos30^\\circ=20\\cdot\\frac{\\sqrt3}{2}=10\\sqrt3$ m. That is about $17.3$ m, shorter than the ramp.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "A rope $52$ m long is stretched from the top of a hill to level ground. The angle $\\theta$ between the rope and the ground has $\\sin\\theta=\\frac5{13}$. How high is the top of the hill above the ground?", "answer": "20", "solution_sketch": "The height is opposite $\\theta$ and the rope is the hypotenuse, so height $=52\\cdot\\frac5{13}$. Since $52/13=4$, the height is $4\\cdot5=20$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A zip line cable is $40$ m long and makes an angle of $60^\\circ$ with the horizontal. How far does the cable drop? Use $\\sin60^\\circ=\\frac{\\sqrt3}{2}$.", "answer": "20sqrt(3)", "solution_sketch": "The drop is opposite the angle, so it is $40\\sin60^\\circ=40\\cdot\\frac{\\sqrt3}{2}=20\\sqrt3$ m. This is about $34.6$ m, less than the cable length.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}]},
    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Use tangent between the legs", "key_prerequisites": ["trig-ratios-definition"], "constraints": "the two legs and one acute angle; the tangent value is given in the problem, exact or rounded to two decimals", "step_check": {"step": "Using the supplied value, $0.70=10.5/a$", "question": "Why is the unknown leg $a$ in the denominator of $0.70=10.5/a$?", "options": ["The unknown side always goes in the denominator of the equation", "The angle is $35^\\circ$, so the adjacent leg has to divide the hypotenuse", "Tangent is opposite over adjacent, and $a$ is the adjacent leg"], "answer": "Tangent is opposite over adjacent, and $a$ is the adjacent leg", "why": "The given leg $10.5$ is opposite and $a$ is adjacent, so $\\tan35^\\circ=10.5/a$; solving gives $a=10.5/0.70=15$."}, "exemplars": [{"problem": "A surveyor stands $20$ m from the foot of a tree. The angle of elevation of the top of the tree is $35^\\circ$. How tall is the tree? Use $\\tan35^\\circ\\approx0.70$.", "answer": "14", "solution_sketch": "The tree height is opposite the angle and the distance $20$ m is adjacent. So the height is $20\\tan35^\\circ\\approx20(0.70)=14$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A ramp rises $3\\sqrt3$ m at an angle of $30^\\circ$ to the horizontal. How long is its horizontal run? Use $\\tan30^\\circ=\\frac{\\sqrt3}{3}$.", "answer": "9", "solution_sketch": "Tangent gives $\\frac{3\\sqrt3}{d}=\\frac{\\sqrt3}{3}$, so the run is $d=3\\sqrt3\\div\\frac{\\sqrt3}{3}=9$ m. Divide the rise by the tangent because the run is the adjacent leg.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A lighthouse is $42$ m tall. From a boat the angle of elevation of its top is $35^\\circ$. How far is the boat from the foot of the lighthouse? Use $\\tan35^\\circ\\approx0.70$.", "answer": "60", "solution_sketch": "The height $42$ m is opposite the angle and the distance $d$ is adjacent, so $0.70=42/d$. Then $d=42/0.70=60$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A hiking path rises $9$ m at a constant angle of $20^\\circ$ to the horizontal. How far does it run horizontally? Use $\\tan20^\\circ\\approx0.36$.", "answer": "25", "solution_sketch": "The rise is opposite the angle and the horizontal run $d$ is adjacent, so $0.36=9/d$. Then $d=9/0.36=25$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A flagpole casts a shadow $6$ m long when the sun is $60^\\circ$ above the horizon. How tall is the flagpole? Use $\\tan60^\\circ=\\sqrt3$.", "answer": "6sqrt(3)", "solution_sketch": "The shadow is adjacent to the angle and the pole is opposite it. So the height is $6\\tan60^\\circ=6\\sqrt3$ m, which is about $10.4$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "The diagonal of a rectangle makes an angle of $30^\\circ$ with the longer side, which is $12$ cm. How long is the shorter side? Use $\\tan30^\\circ=\\frac{\\sqrt3}{3}$.", "answer": "4sqrt(3)", "solution_sketch": "The shorter side is opposite the angle and the longer side $12$ is adjacent. So the shorter side is $12\\tan30^\\circ=12\\cdot\\frac{\\sqrt3}{3}=4\\sqrt3$ cm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "One acute angle of a right triangle is $45^\\circ$ and the adjacent leg is $7$. Find the opposite leg. Use $\\tan45^\\circ=1$.", "answer": "7", "solution_sketch": "The opposite leg is $7\\tan45^\\circ=7\\cdot1=7$. The two legs are equal because the triangle is isosceles.", "answer_contract": {"kind": "exact"}}]},
    {"id": "kp3", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Divide to find the hypotenuse", "key_prerequisites": ["trig-ratios-definition", "one-step-equations"], "constraints": "the hypotenuse is the unknown, so divide by the given sine or cosine; values chosen so the quotient is a whole number", "step_check": {"step": "Dividing by $1/2$ multiplies by $2$", "question": "Why must the hypotenuse come out larger than the leg $21$?", "options": ["Dividing always gives a larger number than the one that is divided", "The hypotenuse is the longest side, and dividing by $1/2$ doubles", "The cosine of $60^\\circ$ is added to the $21$ to make the side longer"], "answer": "The hypotenuse is the longest side, and dividing by $1/2$ doubles", "why": "The hypotenuse must exceed every leg, and $21\\div\\frac12=42>21$; dividing by a number less than $1$ enlarges, but dividing by $2$ would shrink."}, "try_first": {"problem": "A support wire is attached $5$ m up a pole and makes an angle of $30^\\circ$ with the ground. How long is the wire? Use $\\sin30^\\circ=\\frac12$.", "answer_contract": {"kind": "exact"}, "answer": "10", "reveal": "The wire is the hypotenuse, so it must be longer than the $5$ m height. Dividing $5$ by $\\sin30^\\circ=\\frac12$ gives $10$ m, while multiplying would give $2.5$ m, which is shorter than the height."}, "exemplars": [{"problem": "A ladder reaches $9$ m up a wall and makes an angle of $30^\\circ$ with the ground. How long is the ladder? Use $\\sin30^\\circ=\\frac12$.", "answer": "18", "solution_sketch": "The ladder is the hypotenuse and the height $9$ is opposite the angle, so $\\sin30^\\circ=\\frac{9}{h}$. Then $h=9\\div\\frac12=18$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A ramp rises $5.1$ m at an angle of $10^\\circ$ to the ground. How long is the ramp? Use $\\sin10^\\circ\\approx0.17$.", "answer": "30", "solution_sketch": "The rise is opposite the angle and the ramp is the hypotenuse, so $0.17=5.1/h$. Then $h=5.1/0.17=30$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A guy wire is anchored $6$ m from the foot of a pole and makes an angle of $60^\\circ$ with the ground. How long is the wire? Use $\\cos60^\\circ=\\frac12$.", "answer": "12", "solution_sketch": "The distance $6$ m is adjacent to the angle and the wire is the hypotenuse, so $\\frac12=\\frac6h$. Then $h=6\\div\\frac12=12$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A road on a hillside covers $154$ m horizontally and is inclined at $40^\\circ$ to the horizontal. How long is the road? Use $\\cos40^\\circ\\approx0.77$.", "answer": "200", "solution_sketch": "The horizontal distance is adjacent to the angle and the road is the hypotenuse, so $0.77=154/h$. Then $h=154/0.77=200$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "Each half of a roof spans $8$ m horizontally and the roof is pitched at $45^\\circ$. How long is a rafter? Use $\\cos45^\\circ=\\frac{\\sqrt2}{2}$.", "answer": "8sqrt(2)", "solution_sketch": "The span is adjacent to the angle and the rafter is the hypotenuse, so $h=8\\div\\frac{\\sqrt2}{2}=\\frac{16}{\\sqrt2}=8\\sqrt2$ m. This is about $11.3$ m, longer than the span $8$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "A slide is $2.4$ m high at its top end and makes an angle of $30^\\circ$ with the ground. How long is the slide? Use $\\sin30^\\circ=\\frac12$.", "answer": "4.8", "solution_sketch": "The height is opposite the angle and the slide is the hypotenuse, so $\\frac12=\\frac{2.4}{h}$. Then $h=2.4\\div\\frac12=4.8$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "Sam wants the hypotenuse of a right triangle in which the leg opposite a $30^\\circ$ angle is $7$. Sam calculates $7\\sin30^\\circ=3.5$. What is the correct hypotenuse? Use $\\sin30^\\circ=\\frac12$.", "answer": "14", "solution_sketch": "Sam multiplied, but the hypotenuse is the unknown in $\\sin30^\\circ=\\frac7h$. So $h=7\\div\\frac12=14$, which is longer than the leg $7$.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}]}
  ]},
  {"id": "right-triangle-trig", "name": "Right Triangle Trigonometry", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "numeric", "expected_time_secs": 150, "prerequisites": [{"id": "trig-ratios-definition", "weight": 0.7, "key": true}, {"id": "solving-right-triangles-sides", "weight": 0.7, "key": true}, {"id": "square-roots", "weight": 0.3}, {"id": "simplifying-radicals", "weight": 0.3}], "diagnostic_exemplar": {"problem": "A right triangle has hypotenuse $12$ and one acute angle of $60^\\circ$. Find the length of the leg opposite the $60^\\circ$ angle.", "answer": "6√3", "solution_sketch": "$12\\sin 60^\\circ = 12 \\cdot \\frac{\\sqrt{3}}{2} = 6\\sqrt{3}$ (the other leg is $12\\cos 60^\\circ = 6$)."}, "anki_seeds": [{"front": "To find an acute angle from tan θ = k, use...", "back": "the inverse tangent (tan⁻¹ / arctan) key.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Find angles from exact ratios", "key_prerequisites": ["trig-ratios-definition"], "constraints": "ratios are the exact special values 1/2, √2/2, √3/2, 1, √3 or √3/3; answers are 30, 45 or 60 degrees", "step_check": {"step": "the cosine value $1/2$ corresponds to $60^\\circ$", "question": "Why does a cosine of $1/2$ belong to $60^\\circ$ and not to $30^\\circ$?", "options": ["The cosine of $30^\\circ$ is $1/2$ and the cosine of $60^\\circ$ is $\\sqrt3/2$", "Cosine falls as the angle grows, so the smaller value goes with the larger angle", "Cosine is the opposite leg over the hypotenuse, and that equals $1/2$ at $60^\\circ$"], "answer": "Cosine falls as the angle grows, so the smaller value goes with the larger angle", "why": "At $30^\\circ$ cosine is $\\sqrt3/2\\approx0.87$ and at $60^\\circ$ it is $1/2$; so the value $1/2$ points to $60^\\circ$."}, "exemplars": [{"problem": "An acute angle $\\theta$ satisfies $\\sin\\theta=\\frac12$. Find $\\theta$.", "answer": "30", "solution_sketch": "The special acute angle whose sine is $1/2$ is $30^\\circ$. Only one acute angle has this sine, so $\\theta=30^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "An acute angle $\\theta$ satisfies $\\tan\\theta=1$. Find $\\theta$.", "answer": "45", "solution_sketch": "The tangent is $1$ when the opposite and adjacent legs are equal, which happens at $45^\\circ$. So $\\theta=45^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "A $10$ m ladder leans against a wall with its foot $5$ m from the wall. What angle does the ladder make with the ground?", "answer": "60", "solution_sketch": "The foot distance $5$ is adjacent to the angle and the ladder $10$ is the hypotenuse, so $\\cos\\theta=5/10=1/2$. The acute angle with cosine $1/2$ is $60^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "A right triangle has an acute angle of $30^\\circ$ and hypotenuse $1$. What is the length of the leg adjacent to the $30^\\circ$ angle?", "answer": "sqrt(3)/2", "solution_sketch": "The adjacent leg is $1\\cdot\\cos30^\\circ$, and the exact value of $\\cos30^\\circ$ is $\\frac{\\sqrt3}{2}$. So the leg is $\\frac{\\sqrt3}{2}$.", "answer_contract": {"kind": "exact"}}, {"problem": "A ramp makes an angle of $60^\\circ$ with the ground. For each metre of horizontal run, how many metres does the ramp rise?", "answer": "sqrt(3)", "solution_sketch": "The rise over the run is the tangent of the angle. The exact value of $\\tan60^\\circ$ is $\\sqrt3$ metres per metre of run.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has an acute angle of $45^\\circ$ and hypotenuse $1$. How long is each leg?", "answer": "sqrt(2)/2", "solution_sketch": "Each leg is $1\\cdot\\sin45^\\circ$, and the exact value of $\\sin45^\\circ$ is $\\frac{\\sqrt2}{2}$. So each leg is $\\frac{\\sqrt2}{2}$.", "answer_contract": {"kind": "exact"}}, {"problem": "A zip line cable is $20$ m long and drops $10$ m. What angle does the cable make with the horizontal?", "answer": "30", "solution_sketch": "The drop is opposite the angle and the cable is the hypotenuse, so $\\sin\\theta=10/20=1/2$. The acute angle with sine $1/2$ is $30^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "An acute angle $\\theta$ satisfies $\\tan\\theta=\\frac{\\sqrt3}{3}$. Find $\\theta$.", "answer": "30", "solution_sketch": "The special acute angle whose tangent is $\\frac{\\sqrt3}{3}$ is $30^\\circ$. Tangent grows with the angle, so only $30^\\circ$ fits.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "An acute angle $\\theta$ satisfies $\\sin\\theta=\\frac{\\sqrt2}{2}$. Find $\\theta$.", "answer": "45", "solution_sketch": "The special acute angle whose sine is $\\frac{\\sqrt2}{2}$ is $45^\\circ$. At $45^\\circ$ the two legs are equal, so the sine and the cosine have the same value.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "A ramp rises $\\sqrt3$ m over a horizontal run of $1$ m. What angle does the ramp make with the horizontal?", "answer": "60", "solution_sketch": "The rise is opposite the angle and the run is adjacent, so $\\tan\\theta=\\sqrt3/1=\\sqrt3$. The acute angle with tangent $\\sqrt3$ is $60^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}]},
    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Find angles with a calculator (inverse trig keys)", "key_prerequisites": ["trig-ratios-definition"], "constraints": "acute angles only; answers rounded to one decimal place", "step_check": {"step": "Tangent is opposite over adjacent", "question": "Why is the tangent ratio the right one for this triangle?", "options": ["Tangent is the only ratio of the three that has an inverse key on a calculator", "The angle is acute, and every acute angle in a right triangle uses tangent", "The two given sides are the opposite and adjacent legs, which tangent relates"], "answer": "The two given sides are the opposite and adjacent legs, which tangent relates", "why": "The legs $9$ and $20$ are opposite and adjacent to $\\theta$, so $\\tan\\theta=9/20$; with the hypotenuse given instead we would use sine or cosine."}, "exemplars": [{"problem": "An acute angle $\\theta$ satisfies $\\sin\\theta=0.6$. Find $\\theta$ in degrees to one decimal place.", "answer": "36.9", "solution_sketch": "With the calculator in degree mode, $\\theta=\\arcsin(0.6)=36.8698\\ldots^\\circ$. Rounded to one decimal place this is $36.9^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "In a right triangle the leg opposite $\\theta$ is $8$ and the leg adjacent to $\\theta$ is $5$. Find $\\theta$ in degrees to one decimal place.", "answer": "58.0", "solution_sketch": "Tangent is opposite over adjacent, so $\\tan\\theta=8/5=1.6$. Then $\\theta=\\arctan(1.6)=57.9946\\ldots^\\circ$, which rounds to $58.0^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "A right triangle has a leg of $2$ next to the angle $\\theta$ and a hypotenuse of $5$. Find $\\theta$ in degrees to one decimal place.", "answer": "66.4", "solution_sketch": "The leg touches $\\theta$, so $\\cos\\theta=2/5=0.4$. Then $\\theta=\\arccos(0.4)=66.4218\\ldots^\\circ$, which rounds to $66.4^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "A right triangle has an acute angle $A$ with $\\sin A=0.35$. Find the other acute angle in degrees to one decimal place.", "answer": "69.5", "solution_sketch": "First $A=\\arcsin(0.35)=20.4873\\ldots^\\circ$. The other acute angle is the complement, $90-20.4873\\ldots=69.5127\\ldots\\approx69.5^\\circ$ after rounding.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "A $6$ m ladder leans against a wall with its foot $2$ m from the wall. Find the angle between the ladder and the ground in degrees to one decimal place.", "answer": "70.5", "solution_sketch": "The foot distance $2$ is adjacent and the ladder $6$ is the hypotenuse, so $\\cos\\theta=2/6=1/3$. Then $\\theta=\\arccos(1/3)=70.5288\\ldots^\\circ\\approx70.5^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "A ramp rises $1.2$ m over a horizontal run of $8$ m. Find the angle of the ramp to the horizontal in degrees to one decimal place.", "answer": "8.5", "solution_sketch": "Tangent is rise over run, so $\\tan\\theta=1.2/8=0.15$. Then $\\theta=\\arctan(0.15)=8.5307\\ldots^\\circ$, which rounds to $8.5^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "A roof rafter is $6.5$ m long and the roof rises $2.5$ m. Find the pitch angle of the roof in degrees to one decimal place.", "answer": "22.6", "solution_sketch": "The rise is opposite the pitch angle and the rafter is the hypotenuse, so $\\sin\\theta=2.5/6.5=5/13$. Then $\\theta=\\arcsin(5/13)=22.6199\\ldots^\\circ\\approx22.6^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}]},
    {"id": "kp3", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Solve the whole right triangle", "key_prerequisites": ["solving-right-triangles-sides", "simplifying-radicals"], "constraints": "30-60-90 and 45-45-90 triangles, or two legs given; answers are exact, with radicals where needed", "step_check": {"step": "The $1:1:\\sqrt2$ proportions give hypotenuse $7\\sqrt2$", "question": "Why is the hypotenuse $7\\sqrt2$ when both legs are $7$?", "options": ["Equal legs give $2\\cdot7^2$ for the hypotenuse squared, so it is $7\\sqrt2$", "Both acute angles are $45^\\circ$, so the hypotenuse is twice a leg, $14$", "The hypotenuse is the sum of the two legs, which is $7+7$ written as a radical"], "answer": "Equal legs give $2\\cdot7^2$ for the hypotenuse squared, so it is $7\\sqrt2$", "why": "The hypotenuse squared is $7^2+7^2=98$, so the hypotenuse is $\\sqrt{98}=7\\sqrt2$, about $9.9$; twice a leg would be $14$, which is too long."}, "exemplars": [{"problem": "A right triangle has a $30^\\circ$ angle and hypotenuse $10$. Find the length of the leg adjacent to the $30^\\circ$ angle.", "answer": "5sqrt(3)", "solution_sketch": "The leg adjacent to $30^\\circ$ is $10\\cos30^\\circ=10\\cdot\\frac{\\sqrt3}{2}=5\\sqrt3$. The other leg is $10\\sin30^\\circ=5$.", "answer_contract": {"kind": "required_simplest_radical"}}, {"problem": "A right triangle has legs $3$ and $3$. Find the length of the hypotenuse.", "answer": "3sqrt(2)", "solution_sketch": "Both acute angles are $45^\\circ$ because the legs are equal. The hypotenuse is $\\sqrt{3^2+3^2}=\\sqrt{18}=3\\sqrt2$.", "answer_contract": {"kind": "required_simplest_radical"}}, {"problem": "A right triangle has a $45^\\circ$ angle and hypotenuse $10$. Find the length of either leg.", "answer": "5sqrt(2)", "solution_sketch": "The two legs are equal because the triangle is isosceles. Each leg is $10\\sin45^\\circ=10\\cdot\\frac{\\sqrt2}{2}=5\\sqrt2$.", "answer_contract": {"kind": "required_simplest_radical"}}, {"problem": "A right triangle has a $60^\\circ$ angle and hypotenuse $14$. Find the length of the leg opposite the $60^\\circ$ angle.", "answer": "7sqrt(3)", "solution_sketch": "The leg opposite $60^\\circ$ is $14\\sin60^\\circ=14\\cdot\\frac{\\sqrt3}{2}=7\\sqrt3$. The other leg is $14\\cos60^\\circ=7$, which is not asked for.", "answer_contract": {"kind": "required_simplest_radical"}}, {"problem": "A square tile has side $12$ cm. How long is its diagonal?", "answer": "12sqrt(2)", "solution_sketch": "The diagonal splits the square into two $45^\\circ$ right triangles with legs $12$. So the diagonal is $12\\sqrt2$ cm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "A $16$ m ladder makes an angle of $60^\\circ$ with the ground. How far is its foot from the wall?", "answer": "8", "solution_sketch": "The foot distance is adjacent to the angle and the ladder is the hypotenuse. So the distance is $16\\cos60^\\circ=16\\cdot\\frac12=8$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A roof truss is an equilateral triangle with side $8$ m. How tall is the truss?", "answer": "4sqrt(3)", "solution_sketch": "The height splits the truss into two $30^\\circ$-$60^\\circ$-$90^\\circ$ triangles with hypotenuse $8$. The height is $8\\sin60^\\circ=8\\cdot\\frac{\\sqrt3}{2}=4\\sqrt3$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "A right triangle has legs $5$ and $5\\sqrt3$. Find the hypotenuse.", "answer": "10", "solution_sketch": "By Pythagoras the hypotenuse is $\\sqrt{25+75}=\\sqrt{100}=10$. This is twice the shorter leg, which fits a $30^\\circ$-$60^\\circ$-$90^\\circ$ triangle.", "answer_contract": {"kind": "exact"}}, {"problem": "A diagonal brace across a square window frame is $12$ m long. How long is each side of the frame?", "answer": "6sqrt(2)", "solution_sketch": "The two sides and the brace make a $45^\\circ$ right triangle with hypotenuse $12$. Each side is $12\\sin45^\\circ=12\\cdot\\frac{\\sqrt2}{2}=6\\sqrt2$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}]}
