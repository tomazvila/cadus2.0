            answer_contract: {"kind":"unit","quantity":"angle","unit":"°"}
      - id: kp2
        name: Reference angles in radians
        key_prerequisites: [coterminal-angles, radians-degrees]
        constraints: "terminal sides in quadrants II-IV; inputs are simple multiples of π/6 and π/4; answers are π/6, π/4 or π/3"
        exemplars:
          - problem: 'Find the reference angle of $\frac{5\pi}{6}$.'
            answer: "π/6"
          - problem: 'Find the reference angle of $\frac{4\pi}{3}$.'
