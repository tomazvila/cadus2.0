        exemplars:
          - problem: 'Find the reference angle of $420^\circ$.'
            answer: "60°"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°"}
            solution_sketch: 'Coterminal with $60^\circ$, which is its own reference angle.'
          - problem: 'Find the reference angle of $-120^\circ$.'
            answer: "60°"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°"}
            solution_sketch: 'Coterminal with $240^\circ$; $240 - 180 = 60$.'
    diagnostic_exemplar:
      problem: 'Find the reference angle of $-\frac{7\pi}{6}$.'
      answer: "π/6"
      solution_sketch: 'Adding $2\pi$ lands on $\frac{5\pi}{6}$ in Quadrant II, whose reference angle is $\pi - \frac{5\pi}{6}$.'
    anki_seeds:
      - front: "The reference angle is..."
        back: "the acute angle between the terminal side and the x-axis."
        type: basic

