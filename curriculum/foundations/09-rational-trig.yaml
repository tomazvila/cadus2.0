      {"problem": "Simplify $\\frac{2x+6}{x+3} - \\frac{x+3}{x+3}$.", "answer": "1", "solution_sketch": "The numerator is $2x+6-(x+3)=x+3$. Dividing the numerator $x+3$ by the denominator $x+3$ leaves $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A box of fruit costs $\\frac{x^2+8x}{x+4}$ dollars and a bag of nuts costs $\\frac{16}{x+4}$ dollars. What is the total cost of one box and one bag?", "answer": "x+4", "solution_sketch": "The total is $\\frac{x^2+8x+16}{x+4}$. The numerator is $(x+4)^2$, so cancelling one $x+4$ leaves $x+4$ dollars.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the difference $\\frac{x^2}{x-1} - \\frac{2x-1}{x-1}$ in simplest form.", "answer": "x-1", "solution_sketch": "The minus sign changes the sign of $-1$ in the second numerator. The numerator is $x^2-2x+1=(x-1)^2$, so cancelling one $x-1$ leaves $x-1$.", "answer_contract": {"kind": "exact"}}
