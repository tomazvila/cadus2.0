      {"problem": "Ana runs $\\frac{x^2}{x-5}$ kilometres and Ben runs $\\frac{25}{x-5}$ kilometres. How many kilometres farther did Ana run than Ben?", "answer": "x+5", "solution_sketch": "The difference is $\\frac{x^2-25}{x-5}$. Factor $x^2-25=(x-5)(x+5)$ and cancel $x-5$, so Ana ran $x+5$ kilometres farther.", "answer_contract": {"kind": "exact"}},
