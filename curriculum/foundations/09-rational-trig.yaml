  {"id": "trig-applications", "name": "Right-Triangle Trigonometry Applications", "core": false, "difficulty": 0.75, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 240, "prerequisites": [{"id": "angle-of-elevation-depression", "weight": 0.7, "key": true}, {"id": "right-triangle-trig", "weight": 0.5, "key": true}, {"id": "special-right-triangles", "weight": 0.3}, {"id": "multi-step-equations", "weight": 0.2}], "diagnostic_exemplar": {"problem": "From a point on level ground the angle of elevation to the top of a mast is $30^\\circ$; from a point $20$ m closer it is $60^\\circ$. Find the height of the mast. Use $\\tan 30^\\circ = \\frac{\\sqrt{3}}{3}$ and $\\tan 60^\\circ = \\sqrt{3}$.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m"}, "answer": "10√3 m", "solution_sketch": "With $d$ the far distance, $d = h\\sqrt{3}$ and $d - 20 = \\frac{h}{\\sqrt{3}}$; eliminating $d$ gives $\\frac{2h}{\\sqrt{3}} = 20$."}, "anki_seeds": [{"front": "Choosing the trig ratio in an application: pick the ratio that links...", "back": "the known side and the wanted side — sin = opp/hyp, cos = adj/hyp, tan = opp/adj (SOH-CAH-TOA).", "type": "basic"}, {"front": "The angle of depression from A down to B equals...", "back": "the angle of elevation from B up to A (alternate angles with the horizontal).", "type": "basic"}, {"front": "To find an angle from two known sides, use...", "back": "an inverse trig function, e.g. θ = tan⁻¹(opposite/adjacent).", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0", "label": "A"}, {"x": "4", "y": "0", "label": "B"}, {"x": "0", "y": "3", "label": "C"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "θ"}]}, "caption": "Reference example: a 3-4-5 right triangle with the right angle at A and the reference angle θ marked at B."}], "name": "Distances via trig ratios", "key_prerequisites": ["right-triangle-trig", "special-right-triangles"], "constraints": "one right triangle in a metric context; the needed trig value is given, or the sides form a Pythagorean triple; exact answers", "exemplars": [
      {"problem": "A ramp rises $3$ m over a horizontal run of $4$ m. Find the length of the ramp. Give metres as a bare number.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "$\\sqrt{3^2 + 4^2} = 5$."}, {"problem": "A kite string is $50$ m long at $30^\\circ$ to the ground. How high is the kite? Use $\\sin 30^\\circ = \\frac{1}{2}$. Give metres as a bare number.", "answer": "25", "answer_contract": {"kind": "exact"}, "solution_sketch": "$\\text{height} = 50 \\sin 30^\\circ = 50 \\cdot \\frac{1}{2} = 25$."},
      {"problem": "A guy wire runs from the top of a $9$ m pole to a point $12$ m from its base. Find the length of the wire. Give metres as a bare number.", "answer": "15", "answer_contract": {"kind": "exact"}, "solution_sketch": "$\\sqrt{9^2 + 12^2} = \\sqrt{225} = 15$."}, {"problem": "A slide is $16$ m long and makes a $60^\\circ$ angle with the ground. Find its horizontal run. Use $\\cos 60^\\circ = \\frac{1}{2}$. Give metres as a bare number.", "answer": "8", "answer_contract": {"kind": "exact"}, "solution_sketch": "$\\text{run} = 16 \\cos 60^\\circ = 16 \\cdot \\frac{1}{2} = 8$."}
    ]},
    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0", "label": "A"}, {"x": "4", "y": "0", "label": "B"}, {"x": "0", "y": "3", "label": "C"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "θ"}]}, "caption": "Reference example: a 3-4-5 right triangle with the right angle at A and the reference angle θ marked at B."}], "name": "Multi-step problems", "key_prerequisites": ["angle-of-elevation-depression"], "constraints": "two right triangles sharing a side, or a triangle needing Pythagoras before a ratio; exact answers, radicals allowed", "exemplars": [
      {"problem": "A $26$ m wire is anchored $24$ m from a tower base. Give tower height in metres and tangent of the wire elevation angle as an ordered pair.", "answer": "(10, 5/12)", "solution_sketch": "$\\sqrt{26^2 - 24^2} = 10$; $\\tan \\theta = \\frac{10}{24} = \\frac{5}{12}$.", "answer_contract": {"kind": "exact"}}, {"problem": "From a point, the angle of elevation to the top of a building is $45^\\circ$. From $20$ m closer, it is $60^\\circ$. Find the height. Use $\\tan 60^\\circ = \\sqrt{3}$. Give metres as a bare number.", "answer": "30 + 10√3", "solution_sketch": "$h = d$ and $h = (d - 20)\\sqrt{3}$; solve $d = \\sqrt{3}(d-20)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A $25$ m guy wire runs from the ground to the top of a tower, anchored $15$ m from the base. Find the tower height and the tangent of the wire angle of elevation. Give height, tangent as an ordered pair, with lengths in metres.", "answer": "(20, 4/3)", "answer_contract": {"kind": "exact"}, "solution_sketch": "$\\sqrt{25^2 - 15^2} = 20$; $\\tan \\theta = \\frac{20}{15} = \\frac{4}{3}$."}, {"problem": "A $17$ m ladder reaches $15$ m up a wall. Find the distance from the wall to the foot of the ladder and the cosine of the angle the ladder makes with the ground. Give base, cosine as an ordered pair, with lengths in metres.", "answer": "(8, 8/17)", "answer_contract": {"kind": "exact"}, "solution_sketch": "$\\sqrt{17^2 - 15^2} = 8$; $\\cos \\theta = \\frac{8}{17}$."},
      {"problem": "A $20$ m ladder leans at $60^\\circ$ to the ground. A second ladder reaches the same height on the same wall at $45^\\circ$. Find the length of the second ladder. Use $\\sin 60^\\circ = \\frac{\\sqrt{3}}{2}$ and $\\sin 45^\\circ = \\frac{\\sqrt{2}}{2}$. Give metres as a bare number.", "answer": "10√6", "answer_contract": {"kind": "exact"}, "solution_sketch": "The shared height is $20 \\sin 60^\\circ = 10\\sqrt{3}$, so the second ladder is $\\frac{10\\sqrt{3}}{\\sqrt{2}/2} = 10\\sqrt{6}$."}
    ]},
    {"id": "kp3", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0", "label": "A"}, {"x": "4", "y": "0", "label": "B"}, {"x": "0", "y": "3", "label": "C"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "θ"}]}, "caption": "Reference example: a 3-4-5 right triangle with the right angle at A and the reference angle θ marked at B."}], "name": "Solve for angles in context", "key_prerequisites": ["right-triangle-trig", "angle-of-elevation-depression"], "constraints": "the two sides that fix the angle are given; exact special angles, or a calculator value rounded to one decimal place", "exemplars": [
      {"problem": "A $10$ m ladder reaches $5$ m up a wall. Find its angle with the ground. Give degrees as a bare number.", "answer": "30", "solution_sketch": "$\\sin \\theta = \\frac{5}{10} = \\frac{1}{2}$.", "answer_contract": {"kind": "exact"}}, {"problem": "A road rises $8$ m for every $100$ m of horizontal distance. Find its angle of incline to the nearest tenth of a degree. Give degrees as a bare number.", "answer": "4.6", "solution_sketch": "$\\theta = \\tan^{-1}(0.08)$.", "answer_contract": {"kind": "approx", "decimals": 1}},
      {"problem": "A $12$ m ladder reaches $6\\sqrt{3}$ m up a wall. Find its angle with the ground. Give degrees as a bare number.", "answer": "60", "solution_sketch": "$\\sin \\theta = \\frac{6\\sqrt{3}}{12} = \\frac{\\sqrt{3}}{2}$, so $\\theta = 60^\\circ$.", "answer_contract": {"kind": "exact"}}, {"problem": "A path rises $5$ m over a slope length of $5\\sqrt{2}$ m. Find the angle of the path with the horizontal. Give degrees as a bare number.", "answer": "45", "solution_sketch": "$\\sin \\theta = \\frac{5}{5\\sqrt{2}} = \\frac{\\sqrt{2}}{2}$, so $\\theta = 45^\\circ$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ramp is $14$ m long and has a horizontal run of $7\\sqrt{3}$ m. Find its angle with the ground. Give degrees as a bare number.", "answer": "30", "solution_sketch": "$\\cos \\theta = \\frac{7\\sqrt{3}}{14} = \\frac{\\sqrt{3}}{2}$, so $\\theta = 30^\\circ$.", "answer_contract": {"kind": "exact"}}
