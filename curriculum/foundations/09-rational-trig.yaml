  {"id": "law-of-cosines", "name": "The Law of Cosines", "core": false, "difficulty": 0.7, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 180, "prerequisites": [{"id": "right-triangle-trig", "weight": 0.7, "key": true}, {"id": "unit-circle", "weight": 0.4}, {"id": "pythagorean-theorem", "weight": 0.4}], "diagnostic_exemplar": {"problem": "A triangle has sides $6$, $10$ and $14$. Find the angle opposite the side of length $14$.", "answer": "120°", "solution_sketch": "The largest side faces the largest angle: $\\cos C = \\frac{36 + 100 - 196}{2(6)(10)} = -\\frac{1}{2}$."}, "anki_seeds": [{"front": "State the Law of Cosines for side a.", "back": "a² = b² + c² - 2bc·cos A", "type": "basic"}], "knowledge_points": [
