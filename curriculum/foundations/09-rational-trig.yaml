      {"problem": "An inverse-variation table contains $(x,y)=(3,8)$ and $(4,c)$. Find $c$.", "answer": "6", "solution_sketch": "The first row gives $k=3\\cdot8=24$; the second requires $c=24/4=6$.", "answer_contract": {"kind": "exact"}}, {"problem": "If $y=40/x$ and $y=5$, find $x$.", "answer": "8", "solution_sketch": "Multiply $5=40/x$ by nonzero $x$: $5x=40$, so $x=8$.", "answer_contract": {"kind": "exact"}}
