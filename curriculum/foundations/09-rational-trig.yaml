      {"problem": "A triangle has $b=3$, $c=4$, $A=90^\\circ$. Find $a$, then use the sine rule to find $\\sin B$. Give only $\\sin B$.", "answer": "3/5", "solution_sketch": "The cosine rule gives $a=\\sqrt{9+16}=5$; then $\\sin B=3\\sin90^\\circ/5=3/5$.", "answer_contract": {"kind": "exact"}}, {"problem": "A triangle has $b=c=4$ and $A=120^\\circ$. Find $a$, then $\\sin B$; give only $\\sin B$.", "answer": "1/2", "solution_sketch": "The cosine rule gives $a=4\\sqrt3$; the sine rule gives $\\sin B=4(\\sqrt3/2)/(4\\sqrt3)=1/2$.", "answer_contract": {"kind": "exact"}}
