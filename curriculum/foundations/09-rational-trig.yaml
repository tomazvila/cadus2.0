  {"id": "work-rate-problems", "name": "Work and Rate Problems", "core": false, "difficulty": 0.75, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 240, "prerequisites": [{"id": "rational-equations", "weight": 0.7, "key": true}, {"id": "ratios-proportions", "weight": 0.4}], "diagnostic_exemplar": {"problem": "A tap fills a tank in $4$ hours while an open drain empties it in $12$ hours. With both running, how long does the tank take to fill?", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h"}, "answer": "6 h", "solution_sketch": "Rates add, the drain negatively: $\\frac{1}{4} - \\frac{1}{12} = \\frac{1}{6}$ tank per hour."}, "anki_seeds": [{"front": "If a job takes t hours, the work rate is...", "back": "1/t of the job per hour.", "type": "basic"}, {"front": "Combined work rate of two workers = ...", "back": "the sum of their individual rates.", "type": "basic"}], "knowledge_points": [
