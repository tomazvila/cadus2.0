  ]},
  {"id": "adding-subtracting-rational-expressions", "name": "Adding and Subtracting Rational Expressions", "core": true, "difficulty": 0.7, "drill": false, "answer_kind": "expression", "expected_time_secs": 180, "prerequisites": [{"id": "rational-expressions-common-denominators", "weight": 0.7, "key": true}, {"id": "rational-expressions", "weight": 0.5, "key": true}, {"id": "gcf-lcm", "weight": 0.4}, {"id": "factoring-trinomials", "weight": 0.4}, {"id": "adding-subtracting-fractions", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Add $\\frac{2}{x - 4} + \\frac{x}{x^2 - 16}$.", "answer": "(3x + 8)/((x - 4)(x + 4))", "solution_sketch": "$x^2 - 16 = (x - 4)(x + 4)$ is the LCD: $\\frac{2(x + 4) + x}{(x - 4)(x + 4)}$."}, "anki_seeds": [{"front": "LCD of 1/(x+3) and 1/(x²-9)?", "back": "(x+3)(x-3)", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Build a least common denominator from monomials", "key_prerequisites": ["adding-subtracting-fractions", "gcf-lcm"], "constraints": "denominators are monomials or integers; the LCD is their product or the higher power; the answer is a single fraction", "exemplars": [
      {"problem": "Add $\\frac{1}{x} + \\frac{1}{3}$.", "answer": "(x+3)/(3*x)", "solution_sketch": "The least common denominator is $3x$. Rewrite the fractions as $\\frac{3}{3x}+\\frac{x}{3x}$, which add to $\\frac{x+3}{3x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Add $\\frac{2}{x} + \\frac{3}{x^2}$.", "answer": "(2*x+3)/x^2", "solution_sketch": "The least common denominator is $x^2$. The first fraction needs one more factor $x$: $\\frac{2x}{x^2}+\\frac{3}{x^2}=\\frac{2x+3}{x^2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Ana paints a fence alone in $x$ hours and Ben paints it alone in $4$ hours. What part of the fence do they paint together in one hour?", "answer": "(x+4)/(4*x)", "solution_sketch": "In one hour Ana paints $\\frac{1}{x}$ of the fence and Ben paints $\\frac{1}{4}$. The sum over the denominator $4x$ is $\\frac{4+x}{4x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Subtract $\\frac{1}{2x} - \\frac{1}{3x}$.", "answer": "1/(6*x)", "solution_sketch": "The least common denominator is $6x$. The numerators are $3$ and $2$, so the difference is $\\frac{3-2}{6x}=\\frac{1}{6x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A hiker walks $5$ kilometres uphill at $2x$ kilometres per hour and then $6$ kilometres downhill at $3x$ kilometres per hour. How many hours does the walk take?", "answer": "9/(2*x)", "solution_sketch": "Time is distance divided by speed, so the total is $\\frac{5}{2x}+\\frac{6}{3x}$. Over the denominator $6x$ this is $\\frac{15+12}{6x}=\\frac{27}{6x}$, which is $\\frac{9}{2x}$ hours.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tap fills a tank in $x$ hours and an open drain empties the full tank in $x^2$ hours. What part of the tank is filled in one hour when both are open?", "answer": "(x-1)/x^2", "solution_sketch": "The tap adds $\\frac{1}{x}$ of the tank per hour and the drain removes $\\frac{1}{x^2}$. Over the denominator $x^2$ the difference is $\\frac{x-1}{x^2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Combine $\\frac{1}{x} + \\frac{1}{y}$.", "answer": "(x+y)/(x*y)", "solution_sketch": "The least common denominator is $xy$. The numerators are $y$ and $x$, so the sum is $\\frac{x+y}{xy}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the sum $\\frac{1}{x} + \\frac{1}{x^2}$.", "answer": "(x+1)/x^2", "solution_sketch": "Use a common denominator. Over the least common denominator $x^2$ the sum is $\\frac{x}{x^2}+\\frac{1}{x^2}=\\frac{x+1}{x^2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Subtract $\\frac{3}{4a} - \\frac{1}{6a^2}$.", "answer": "(9*a-2)/(12*a^2)", "solution_sketch": "The least common denominator is $12a^2$. The numerators become $9a$ and $2$, so the difference is $\\frac{9a-2}{12a^2}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Distinct binomial denominators", "key_prerequisites": ["rational-expressions-common-denominators"], "constraints": "two distinct linear binomial denominators with no common factor; the LCD is their product, left in factored form", "exemplars": [
      {"problem": "Subtract $\\frac{1}{x-2} - \\frac{1}{x+2}$.", "answer": "4/((x-2)*(x+2))", "solution_sketch": "The least common denominator is $(x-2)(x+2)$. The numerator is $(x+2)-(x-2)=4$, so the difference is $\\frac{4}{(x-2)(x+2)}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Add $\\frac{3}{x+1} + \\frac{2}{x-1}$.", "answer": "(5*x-1)/((x+1)*(x-1))", "solution_sketch": "Over $(x+1)(x-1)$ the numerators are $3(x-1)$ and $2(x+1)$. They add to $3x-3+2x+2=5x-1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A boat travels $12$ kilometres downstream at $x+2$ kilometres per hour and then $12$ kilometres back upstream at $x-2$ kilometres per hour. How many hours does the whole trip take?", "answer": "24*x/((x+2)*(x-2))", "solution_sketch": "Time is distance divided by speed, so the total is $\\frac{12}{x+2}+\\frac{12}{x-2}$. The numerator over $(x+2)(x-2)$ is $12(x-2)+12(x+2)=24x$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{x}{x+1} - \\frac{1}{x-2}$.", "answer": "(x^2-3*x-1)/((x+1)*(x-2))", "solution_sketch": "Over $(x+1)(x-2)$ the numerator is $x(x-2)-(x+1)$. After the minus sign is distributed, this is $x^2-2x-x-1=x^2-3x-1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Pipe A fills a pool in $x+1$ hours and pipe B fills it in $x+4$ hours. What part of the pool do both pipes fill in one hour?", "answer": "(2*x+5)/((x+1)*(x+4))", "solution_sketch": "Each hour pipe A fills $\\frac{1}{x+1}$ and pipe B fills $\\frac{1}{x+4}$. The numerator over $(x+1)(x+4)$ is $(x+4)+(x+1)=2x+5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Combine $\\frac{1}{2x+1} + \\frac{1}{x+3}$.", "answer": "(3*x+4)/((2*x+1)*(x+3))", "solution_sketch": "Neither denominator divides the other, so the least common denominator is their product. The numerator is $(x+3)+(2x+1)=3x+4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the sum $\\frac{2}{x+1} + \\frac{3}{x+2}$.", "answer": "(5*x+7)/((x+1)*(x+2))", "solution_sketch": "Use a common denominator. Over $(x+1)(x+2)$ the numerator is $2(x+2)+3(x+1)=5x+7$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Dan drives $60$ kilometres at $x-5$ kilometres per hour. Eve drives $60$ kilometres at $x+5$ kilometres per hour. How many hours longer than Eve does Dan take?", "answer": "600/((x-5)*(x+5))", "solution_sketch": "The difference in time is $\\frac{60}{x-5}-\\frac{60}{x+5}$. The numerator over $(x-5)(x+5)$ is $60(x+5)-60(x-5)=600$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Factor denominators to build the LCD", "key_prerequisites": ["rational-expressions", "factoring-trinomials"], "constraints": "one denominator factors and contains the other as a factor; the LCD stays factored in the answer", "exemplars": [
      {"problem": "Add $\\frac{3}{x+3} + \\frac{2x}{x^2-9}$.", "answer": "(5*x-9)/((x+3)*(x-3))", "solution_sketch": "Factor $x^2-9=(x-3)(x+3)$, which is the least common denominator. The numerator is $3(x-3)+2x=5x-9$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Add $\\frac{1}{x^2+3x+2} + \\frac{1}{x+1}$.", "answer": "(x+3)/((x+1)*(x+2))", "solution_sketch": "Factor the quadratic as $(x+1)(x+2)$. The second fraction needs the factor $x+2$, so the numerator is $1+(x+2)=x+3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A hose fills a tank in $x^2-4$ hours and a second hose fills it in $x+2$ hours. What part of the tank do the two hoses fill in one hour?", "answer": "(x-1)/((x-2)*(x+2))", "solution_sketch": "The parts are $\\frac{1}{x^2-4}$ and $\\frac{1}{x+2}$, and $x^2-4=(x-2)(x+2)$. The second part needs the factor $x-2$, so the numerator is $1+(x-2)=x-1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Subtract $\\frac{1}{x-1} - \\frac{2}{x^2-2x+1}$.", "answer": "(x-3)/(x-1)^2", "solution_sketch": "The denominator $x^2-2x+1$ is $(x-1)^2$, so it is the least common denominator. The numerator is $(x-1)-2=x-3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tap fills a tank in $x+2$ hours. An open drain empties the full tank in $x^2+2x$ hours. What part of the tank is gained in one hour when both are open?", "answer": "(x-1)/(x*(x+2))", "solution_sketch": "The tap adds $\\frac{1}{x+2}$ of the tank per hour and the drain removes $\\frac{1}{x(x+2)}$, since $x^2+2x=x(x+2)$. The tap needs the factor $x$, so the numerator is $x-1$ and the gain is $\\frac{x-1}{x(x+2)}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Combine $\\frac{1}{x^2+x} - \\frac{1}{x}$.", "answer": "-1/(x+1)", "solution_sketch": "Factor $x^2+x=x(x+1)$. The numerator is $1-(x+1)=-x$, and cancelling the common factor $x$ leaves $-\\frac{1}{x+1}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the sum $\\frac{1}{x-2} + \\frac{3}{x^2-4}$.", "answer": "(x+5)/((x-2)*(x+2))", "solution_sketch": "Multiply the first numerator by $x+2$. Over $(x-2)(x+2)$ the numerator is $(x+2)+3=x+5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Add $\\frac{x}{x^2-25} + \\frac{1}{x-5}$.", "answer": "(2*x+5)/((x-5)*(x+5))", "solution_sketch": "Factor $x^2-25=(x-5)(x+5)$. The second fraction needs the factor $x+5$, so the numerator is $x+(x+5)=2x+5$.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "complex-fractions", "name": "Complex Fractions", "core": true, "difficulty": 0.7, "drill": false, "answer_kind": "expression", "expected_time_secs": 150, "prerequisites": [{"id": "adding-subtracting-rational-expressions", "weight": 0.6, "key": true}, {"id": "dividing-rational-expressions", "weight": 0.5, "key": true}, {"id": "dividing-fractions", "weight": 0.4}], "diagnostic_exemplar": {"problem": "Simplify $\\frac{\\frac{1}{x} - \\frac{1}{3}}{\\frac{1}{x} + \\frac{1}{3}}$.", "answer": "(3 - x)/(3 + x)", "solution_sketch": "Multiply numerator and denominator by $3x$, which clears all four small fractions at once."}, "anki_seeds": [{"front": "Fastest way to simplify a complex fraction?", "back": "Multiply top and bottom by the LCD of all the inner fractions.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Numeric complex fractions", "key_prerequisites": ["dividing-fractions"], "constraints": "numeric fractions only, at most one sum; answers are reduced fractions or integers", "try_first": {"problem": "A jug holds $\\frac{3}{2}$ litres of juice. How many glasses of $\\frac{1}{6}$ litre can it fill?", "answer_contract": {"kind": "exact"}, "answer": "9", "reveal": "The count is $\\frac{3/2}{1/6}$, and dividing by $\\frac{1}{6}$ is the same as multiplying by $6$. This is why a fraction over a fraction is handled by inverting the bottom one."}, "exemplars": [{"problem": "Simplify $\\dfrac{\\frac{3}{4}}{\\frac{9}{8}}$.", "answer": "2/3", "answer_contract": {"kind": "required_form", "form": "reduced_fraction"}, "solution_sketch": "Dividing by $\\frac{9}{8}$ means multiplying by $\\frac{8}{9}$. So the value is $\\frac{3}{4}\\cdot\\frac{8}{9}=\\frac{24}{36}=\\frac{2}{3}$."}, {"problem": "Simplify $\\dfrac{\\frac{1}{2}+\\frac{1}{3}}{\\frac{1}{6}}$.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "First add in the numerator: $\\frac{3}{6}+\\frac{2}{6}=\\frac{5}{6}$. Dividing $\\frac{5}{6}$ by $\\frac{1}{6}$ is the same as multiplying by $6$, which gives $5$."}, {"problem": "Evaluate $\\dfrac{\\frac{3}{4}}{\\frac{1}{2}-\\frac{1}{8}}$.", "answer": "2", "answer_contract": {"kind": "exact"}, "solution_sketch": "First subtract in the denominator: $\\frac{4}{8}-\\frac{1}{8}=\\frac{3}{8}$. Then multiply $\\frac{3}{4}$ by the reciprocal $\\frac{8}{3}$ to get $2$."}, {"problem": "A ribbon $\\frac{3}{4}$ m long is cut into pieces that are each $\\frac{1}{8}$ m long. How many pieces are there?", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "The number of pieces is the length divided by the piece length, $\\frac{3/4}{1/8}$. This equals $\\frac{3}{4}\\cdot 8=6$ pieces."}, {"problem": "A runner covers $\\frac{3}{4}$ km in $\\frac{1}{6}$ hour. What is her speed?", "answer": "9/2", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}, "solution_sketch": "Speed is distance divided by time, so the speed is $\\frac{3/4}{1/6}=\\frac{3}{4}\\cdot 6=\\frac{9}{2}$. That is $4.5$ km/h."}, {"problem": "Simplify $\\dfrac{2}{\\frac{3}{5}}$.", "answer": "10/3", "answer_contract": {"kind": "required_form", "form": "reduced_fraction"}, "solution_sketch": "Dividing by $\\frac{3}{5}$ means multiplying by $\\frac{5}{3}$. The correct value is $2\\cdot\\frac{5}{3}=\\frac{10}{3}$."}, {"problem": "A bag holds $\\frac{7}{2}$ kg of rice. It is shared into portions of $\\frac{7}{10}$ kg each. How many portions does the bag give?", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "The number of portions is $\\frac{7/2}{7/10}=\\frac{7}{2}\\cdot\\frac{10}{7}=5$. Dividing the total by the size of one portion gives the count."}, {"problem": "A cyclist rides $12$ km at $6$ km/h and then $12$ km at $12$ km/h. What is her average speed for the $24$ km?", "answer": "8", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}, "solution_sketch": "The two legs take $\\frac{12}{6}=2$ hours and $\\frac{12}{12}=1$ hour. The average speed is $\\frac{24}{2+1}=8$ km/h."}]},
    {"id": "kp2", "name": "One fraction over another", "key_prerequisites": ["dividing-rational-expressions"], "constraints": "a single monomial fraction over another; invert and multiply; coefficients at most 12", "exemplars": [{"problem": "Simplify $\\dfrac{\\frac{x}{3}}{\\frac{x^2}{6}}$.", "answer": "2/x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Dividing by $\\frac{x^2}{6}$ means multiplying by its reciprocal $\\frac{6}{x^2}$. This gives $\\frac{6x}{3x^2}$, which cancels to $\\frac{2}{x}$."}, {"problem": "Simplify $\\dfrac{\\frac{5}{x}}{\\frac{10}{x^3}}$.", "answer": "x^2/2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply by the reciprocal of the bottom: $\\frac{5}{x}\\cdot\\frac{x^3}{10}=\\frac{5x^3}{10x}$. Cancel $5$ and one $x$ to get $\\frac{x^2}{2}$."}, {"problem": "Simplify $\\dfrac{\\frac{x^2}{4}}{\\frac{x}{8}}$.", "answer": "2x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply by the reciprocal of the bottom fraction: $\\frac{x^2}{4}\\cdot\\frac{8}{x}=\\frac{8x^2}{4x}$. Cancelling $4$ and one $x$ leaves $2x$."}, {"problem": "Simplify $\\dfrac{\\frac{9}{x^2}}{\\frac{3}{x}}$.", "answer": "3/x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply by the reciprocal: $\\frac{9}{x^2}\\cdot\\frac{x}{3}=\\frac{9x}{3x^2}$. Cancel $3$ and one $x$ to get $\\frac{3}{x}$."}, {"problem": "A rectangle has area $\\frac{3x}{4}$ square metres and width $\\frac{x^2}{8}$ metres. Find an expression for its length in metres.", "answer": "6/x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Length is area divided by width, so the length is $\\frac{3x/4}{x^2/8}=\\frac{3x}{4}\\cdot\\frac{8}{x^2}$. This simplifies to $\\frac{6}{x}$."}, {"problem": "A solution has mass $\\frac{12}{x}$ grams and volume $\\frac{4}{x^3}$ millilitres. Find an expression for its density in grams per millilitre.", "answer": "3x^2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Density is mass divided by volume, so it is $\\frac{12/x}{4/x^3}=\\frac{12}{x}\\cdot\\frac{x^3}{4}$. This simplifies to $3x^2$."}, {"problem": "Simplify $\\dfrac{\\frac{x}{2}}{\\frac{x^3}{4}}$.", "answer": "2/x^2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Divide the two fractions, which means multiply by the reciprocal. The work is $\\frac{x}{2}\\cdot\\frac{4}{x^3}=\\frac{4x}{2x^3}=\\frac{2}{x^2}$."}, {"problem": "Pipe A delivers $\\frac{6}{x}$ litres in $\\frac{3}{x^2}$ minutes. Find an expression for its flow rate in litres per minute.", "answer": "2x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Rate is volume divided by time, so the rate is $\\frac{6/x}{3/x^2}=\\frac{6}{x}\\cdot\\frac{x^2}{3}$. This simplifies to $2x$."}]},
    {"id": "kp3", "name": "Sums in the numerator or denominator", "key_prerequisites": ["adding-subtracting-rational-expressions"], "constraints": "clearable by multiplying top and bottom by a monomial LCD", "exemplars": [{"problem": "Simplify $\\dfrac{1+\\frac{1}{x}}{1-\\frac{1}{x}}$.", "answer": "(x+1)/(x-1)", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $x$. The top becomes $x+1$ and the bottom becomes $x-1$."}, {"problem": "Simplify $\\dfrac{\\frac{1}{x}+\\frac{1}{y}}{\\frac{1}{xy}}$.", "answer": "x+y", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $xy$. The top becomes $y+x$ and the bottom becomes $1$, so the result is $x+y$."}, {"problem": "Simplify $\\dfrac{1-\\frac{1}{x}}{1+\\frac{1}{x}}$.", "answer": "(x-1)/(x+1)", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $x$. The top becomes $x-1$ and the bottom becomes $x+1$."}, {"problem": "Simplify $\\dfrac{\\frac{2}{x}-\\frac{2}{y}}{\\frac{2}{xy}}$.", "answer": "y-x", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $xy$. The top becomes $2y-2x$ and the bottom becomes $2$, so the result is $y-x$."}, {"problem": "Two resistors of $a$ ohms and $b$ ohms are connected in parallel. Their combined resistance is $\\dfrac{1}{\\frac{1}{a}+\\frac{1}{b}}$ ohms. Simplify this expression.", "answer": "a*b/(a+b)", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $ab$. The top becomes $ab$ and the bottom becomes $b+a$, so the resistance is $\\frac{ab}{a+b}$."}, {"problem": "A trip of $d$ km each way is made at $u$ km/h out and $v$ km/h back. The average speed is $\\dfrac{2d}{\\frac{d}{u}+\\frac{d}{v}}$ km/h. Simplify this expression.", "answer": "2*u*v/(u+v)", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $uv$. The top becomes $2duv$ and the bottom becomes $dv+du$, so the average speed is $\\frac{2uv}{u+v}$."}, {"problem": "Simplify $\\dfrac{\\frac{1}{x}+\\frac{1}{2}}{\\frac{1}{x}}$.", "answer": "(x+2)/2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $2x$. The top becomes $2+x$ and the bottom becomes $2$, so the result is $\\frac{x+2}{2}$."}, {"problem": "Ann paints a fence in $x$ hours and Ben paints it in $2x$ hours. Working together they take $\\dfrac{1}{\\frac{1}{x}+\\frac{1}{2x}}$ hours. Simplify this expression.", "answer": "2x/3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the top and the bottom by $2x$. The top becomes $2x$ and the bottom becomes $2+1=3$, so they take $\\frac{2x}{3}$ hours."}]}
  ]},
  {"id": "basic-rational-equations", "name": "Basic Rational Equations", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 120, "prerequisites": [{"id": "equations-with-fractions", "weight": 0.7, "key": true}, {"id": "ratios-proportions", "weight": 0.6, "key": true}, {"id": "rational-expression-restrictions", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Solve $\\frac{4}{x + 1} - \\frac{1}{2} = 1$.", "answer": "x = 5/3", "solution_sketch": "Move the $\\frac{1}{2}$ across: $\\frac{4}{x + 1} = \\frac{3}{2}$, so $8 = 3(x + 1)$."}, "anki_seeds": [{"front": "After solving a rational equation, always check that...", "back": "no solution makes an original denominator zero.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Solve proportions with x in a denominator", "key_prerequisites": ["ratios-proportions"], "constraints": "integer or simple-fraction solutions; never a solution at an excluded value", "exemplars": [{"problem": "Solve $\\dfrac{20}{x}=8$.", "answer": "5/2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $x\\ne0$, multiply both sides by $x$ to get $20=8x$. Then $x=\\frac{20}{8}=\\frac{5}{2}$."}, {"problem": "Solve $\\dfrac{x}{4}=\\dfrac{3}{2}$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply both sides by $4$ to undo the division by $4$. This gives $x=4\\cdot\\frac{3}{2}=6$."}, {"problem": "A cyclist rides $12$ km at an average speed of $8$ km/h. How long does the ride take?", "answer": "3/2", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "Distance equals speed times time, so $12=8t$. Divide by $8$ to get $t=\\frac{3}{2}$ hours."}, {"problem": "Solve the proportion $\\dfrac{4}{3}=\\dfrac{8}{x}$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $x\\ne0$, cross-multiply to get $4x=24$. Then $x=6$, and $\\frac{8}{6}=\\frac{4}{3}$ confirms it."}, {"problem": "A recipe that uses $2$ cups of flour serves $5$ people. How many people does a batch that uses $12$ cups of flour serve?", "answer": "30", "answer_contract": {"kind": "exact"}, "solution_sketch": "The ratio of cups to people stays the same, so $\\frac{2}{5}=\\frac{12}{x}$. Cross-multiplying gives $2x=60$, so $x=30$."}, {"problem": "A syrup is mixed from $3$ parts concentrate to $8$ parts water. How much water goes with $15$ ml of concentrate?", "answer": "40", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "ml", "allow_omitted": true}, "solution_sketch": "The ratio is fixed, so $\\frac{3}{8}=\\frac{15}{x}$. Cross-multiplying gives $3x=120$, so $x=40$ ml."}, {"problem": "Solve $\\dfrac{6}{x}=3$.", "answer": "2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiplying both sides by $x$ gives $6=3x$. So $x=\\frac{6}{3}=2$, and $\\frac{6}{2}=3$."}, {"problem": "A tank holds $90$ litres and a pump fills it at $15$ litres per minute. How many minutes does it take to fill the tank?", "answer": "6", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}, "solution_sketch": "The time is the volume divided by the rate. Solving $\\frac{90}{x}=15$ gives $x=6$ minutes."}]},
    {"id": "kp2", "name": "Cross-multiply with binomials", "key_prerequisites": ["ratios-proportions", "equations-with-fractions"], "constraints": "a proportion with a linear binomial in at least one part; cross-multiply, then solve a linear equation; integer solutions", "exemplars": [{"problem": "Solve $\\dfrac{x+1}{3}=\\dfrac{x-1}{2}$.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Cross-multiply to get $2(x+1)=3(x-1)$, so $2x+2=3x-3$. Then $x=5$, and both sides equal $2$."}, {"problem": "Solve $\\dfrac{4}{x+2}=\\dfrac{2}{x}$.", "answer": "2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$ and $x=-2$. Cross-multiplying gives $4x=2x+4$, so $x=2$, and both sides equal $1$."}, {"problem": "Solve $\\dfrac{x+4}{x-1}=\\dfrac{3}{2}$.", "answer": "11", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=1$. Cross-multiplying gives $2x+8=3x-3$, so $x=11$, and both sides equal $\\frac{3}{2}$."}, {"problem": "Solve $\\dfrac{3}{x-1}=\\dfrac{6}{x+4}$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=1$ and $x=-4$. Cross-multiplying gives $3x+12=6x-6$, so $x=6$, and both sides equal $\\frac{3}{5}$."}, {"problem": "A rectangle is $x$ cm wide and $(x+6)$ cm long. The ratio of its width to its length is $\\frac{2}{5}$. How wide is the rectangle?", "answer": "4", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}, "solution_sketch": "The width-to-length ratio gives $\\frac{x}{x+6}=\\frac{2}{5}$. Cross-multiplying gives $5x=2x+12$, so $3x=12$ and $x=4$ cm."}, {"problem": "At the same time of day, a $2$ m post casts a $3$ m shadow. A tree casts a shadow $5$ m longer than its own height. How tall is the tree?", "answer": "10", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "Let $h$ be the height in metres, so the shadow is $h+5$. Then $\\frac{h}{h+5}=\\frac{2}{3}$ gives $3h=2h+10$, so $h=10$ m."}, {"problem": "Solve $\\dfrac{x+3}{4}=\\dfrac{x}{2}$.", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the $3$ by $2$ as well. The equation is $2(x+3)=4x$, so $2x+6=4x$ and $x=3$."}, {"problem": "Solve $\\dfrac{2}{3x-1}=\\dfrac{1}{x+2}$.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=\\frac{1}{3}$ and $x=-2$. Cross-multiplying gives $2x+4=3x-1$, so $x=5$, and both sides equal $\\frac{1}{7}$."}]},
    {"id": "kp3", "name": "Clear denominators", "key_prerequisites": ["equations-with-fractions"], "constraints": "two or three terms, one with x in a monomial denominator; multiply through by that denominator; integer or simple-fraction solutions", "exemplars": [{"problem": "Solve $\\dfrac{1}{x}+\\dfrac{1}{2}=1$.", "answer": "2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $x\\ne0$, multiply every term by the common denominator $2x$ to get $2+x=2x$. So $x=2$."}, {"problem": "Solve $\\dfrac{2}{x}+3=\\dfrac{5}{x}$.", "answer": "1", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $x\\ne0$, multiply every term by $x$ to get $2+3x=5$. So $x=1$."}, {"problem": "Solve $\\dfrac{3}{2x}-\\dfrac{1}{4x}=\\dfrac{5}{12}$.", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply every term by the least common denominator $12x$ to get $18-3=5x$. So $x=3$."}, {"problem": "Solve $\\dfrac{1}{2}+\\dfrac{1}{3}=\\dfrac{5}{x}$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "The left side is $\\frac{5}{6}$. Multiplying by $6x$ gives $5x=30$, so $x=6$."}, {"problem": "Ana mows a lawn in $10$ hours. Working with Ben she mows it in $6$ hours. How long would Ben take to mow it alone?", "answer": "15", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "Ana does $\\frac{1}{10}$ of the lawn each hour, Ben does $\\frac{1}{x}$ and together they do $\\frac{1}{6}$. Solving $\\frac{1}{10}+\\frac{1}{x}=\\frac{1}{6}$ gives $x=15$ hours."}, {"problem": "A $30$ km walk is done at a steady speed. With a half-hour rest, the whole outing takes $4\\frac{1}{2}$ hours. What is the walking speed?", "answer": "15/2", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}, "solution_sketch": "Walking time is $\\frac{30}{x}$ hours, so $\\frac{30}{x}+\\frac{1}{2}=\\frac{9}{2}$. Then $\\frac{30}{x}=4$ and $x=\\frac{15}{2}$ km/h."}, {"problem": "Solve $\\dfrac{6}{x}+1=3$.", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the $1$ by $x$ as well. The equation is $6+x=3x$, so $x=3$."}, {"problem": "Solve $\\dfrac{7}{x}-\\dfrac{2}{3}=\\dfrac{1}{x}$.", "answer": "9", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $x\\ne0$, multiply every term by $3x$ to get $21-2x=3$. So $x=9$."}]}
  ]},
  {"id": "inverse-variation", "name": "Inverse Variation", "core": true, "difficulty": 0.55, "drill": false, "answer_kind": "expression", "expected_time_secs": 100, "prerequisites": [{"id": "proportional-relationships", "weight": 0.6, "key": true}, {"id": "basic-rational-equations", "weight": 0.6, "key": true}, {"id": "rational-expression-restrictions", "weight": 0.3}, {"id": "reading-function-graphs", "weight": 0.2}], "diagnostic_exemplar": {"problem": "$y$ varies inversely with $x$, and $y = 10$ when $x = 3$. Find $y$ when $x = 5$.", "answer": "6", "solution_sketch": "$k = 10 \\cdot 3 = 30$; $y = \\frac{30}{5} = 6$."}, "anki_seeds": [{"front": "Inverse variation: equation form and what stays constant?", "back": "y = k/x — the product xy = k is constant (direct variation keeps the ratio y/x constant)", "type": "basic"}, {"front": "In inverse variation, doubling x does what to y?", "back": "halves it (multiplying x by a multiplies y by 1/a)", "type": "basic"}, {"front": "The graph of y = k/x has no point at ___ and never touches ___.", "back": "x = 0; the coordinate axes (two separate branches)", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Find k and use y = k/x", "key_prerequisites": ["proportional-relationships", "basic-rational-equations"], "constraints": "equation form y = k/x with k = xy; integer k and integer or simple-fraction values; contrast with y = kx (direct) in wording only", "exemplars": [{"problem": "$y$ varies inversely with $x$, and $y=9$ when $x=4$. Write an equation that gives $y$ in terms of $x$.", "answer": "y = 36/x", "answer_contract": {"kind": "exact"}, "solution_sketch": "In an inverse variation the product $xy$ is constant, so $k=4\\cdot9=36$. The equation is therefore $y=\\frac{36}{x}$."}, {"problem": "$y$ varies inversely with $x$, and $y=12$ when $x=2$. Find $y$ when $x=8$.", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "The known pair gives the constant product $k=2\\cdot12=24$. Then at $x=8$ we get $y=\\frac{24}{8}=3$."}, {"problem": "$y$ varies inversely with $x$. When $x=3$, $y=8$. When $x=6$, $y=c$. Find $c$.", "answer": "4", "answer_contract": {"kind": "exact"}, "solution_sketch": "The first pair gives the constant product $k=3\\cdot8=24$. The second pair must have the same product, so $6c=24$ and $c=4$."}, {"problem": "The time to empty a pool varies inversely with the number of pumps working. Three pumps take $10$ hours. How long do five pumps take?", "answer": "6", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "More pumps need less time, so pumps times hours is constant: $3\\cdot10=30$. With five pumps $5t=30$, so $t=6$ hours."}, {"problem": "The pressure of a gas in a sealed syringe varies inversely with its volume. At $2$ litres the pressure is $150$ kPa. What is the volume when the pressure is $60$ kPa?", "answer": "5", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}, "solution_sketch": "Pressure times volume is constant: $150\\cdot2=300$. At $60$ kPa, the volume is $\\frac{300}{60}=5$ litres."}, {"problem": "If $y=\\dfrac{40}{x}$ and $y=5$, find $x$.", "answer": "8", "answer_contract": {"kind": "exact"}, "solution_sketch": "Substitute $y=5$ to get $5=\\frac{40}{x}$. Multiplying both sides by $x$ gives $5x=40$, so $x=8$."}, {"problem": "$y$ varies inversely with $x$, and $y=6$ when $x=2$. What is $y$ when $x=4$?", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "The rule $y=kx$ is direct variation. Here $k=2\\cdot6=12$, so $y=\\frac{12}{x}$ and $y=\\frac{12}{4}=3$."}, {"problem": "A prize of $\\$120$ is shared equally by $n$ winners, and each winner receives $y$ dollars. Write an equation that gives $y$ in terms of $n$.", "answer": "y = 120/n", "answer_contract": {"kind": "exact"}, "solution_sketch": "Each share is the total divided by the number of winners. So $y=\\frac{120}{n}$, and the product $ny=120$ is constant."}]},
    {"id": "kp2", "name": "Solve across two states; halve-and-double reasoning", "key_prerequisites": ["basic-rational-equations"], "constraints": "constant-product reasoning across two states; one applied context (speed-time, workers-time) with metric units; integer or simple-fraction answers", "try_first": {"problem": "A car trip takes $6$ hours at $60$ km/h. How many hours does the trip take at $120$ km/h?", "answer_contract": {"kind": "exact"}, "answer": "3", "reveal": "Doubling the speed halves the time, because speed times time is the fixed distance. Whenever two quantities have a constant product, multiplying one by a factor divides the other by the same factor."}, "exemplars": [{"problem": "$y$ varies inversely with $x$, and $y=4$ when $x=9$. Find $y$ when $x=6$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "The product $xy=9\\cdot4=36$ stays constant in an inverse variation. So at $x=6$ we get $y=\\frac{36}{6}=6$."}, {"problem": "In an inverse variation, $x$ is tripled. By what factor is $y$ multiplied?", "answer": "1/3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $xy=k$, replacing $x$ by $3x$ gives $y_{new}=\\frac{k}{3x}$. This is $\\frac{1}{3}$ of the old $y$."}, {"problem": "A fixed journey takes $6$ hours at $80$ km/h. How long does it take at $120$ km/h?", "answer": "4", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "The distance is $6\\cdot80=480$ km. At $120$ km/h the time is $\\frac{480}{120}=4$ hours."}, {"problem": "Twelve identical workers lay a road in $15$ days. How many days would $20$ identical workers need?", "answer": "9", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "day", "allow_omitted": true}, "solution_sketch": "Workers times days is constant: $12\\cdot15=180$. With $20$ workers the time is $\\frac{180}{20}=9$ days."}, {"problem": "A crew of equal workers finishes a surveying job in $24$ hours. A larger crew finishes the same job in $16$ hours. By what factor did the crew size increase?", "answer": "3/2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Crew size times hours is the same fixed amount of work, so $24n_1=16n_2$. Dividing by $16n_1$ gives $\\frac{n_2}{n_1}=\\frac{24}{16}=\\frac{3}{2}$."}, {"problem": "A gas is compressed from $8$ litres to $2$ litres at constant temperature, so its pressure varies inversely with its volume. By what factor does the pressure change?", "answer": "4", "answer_contract": {"kind": "exact"}, "solution_sketch": "Pressure times volume is constant. The volume is divided by $\\frac{8}{2}=4$, so the pressure is multiplied by $4$."}, {"problem": "In an inverse variation, $x$ goes from $4$ to $12$. By what factor is $y$ multiplied?", "answer": "1/3", "answer_contract": {"kind": "exact"}, "solution_sketch": "The input is multiplied by $\\frac{12}{4}=3$. In an inverse variation $y$ is divided by $3$, so it is multiplied by $\\frac{1}{3}$."}, {"problem": "A rent of $\\$900$ is shared equally by $3$ flatmates. A fourth person moves in and the rent is shared equally by $4$. By how many dollars does the share of each flatmate fall?", "answer": "75", "answer_contract": {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}, "solution_sketch": "The share was $\\frac{900}{3}=300$ dollars and becomes $\\frac{900}{4}=225$. The fall is $300-225=75$ dollars."}]},
    {"id": "kp3", "visuals": [{"kind": "curve", "x_min": "-6", "x_max": "6", "y_min": "-6", "y_max": "6", "x_tick": "1", "y_tick": "1", "curve": {"family": "reciprocal", "a": "4", "h": "0", "k": "0"}, "key_points": [{"x": "2", "y": "2", "label": "A"}, {"x": "-2", "y": "-2"}, {"x": "4", "y": "1"}, {"x": "-4", "y": "-1"}], "asymptotes": [{"axis": "horizontal", "at": "0"}, {"axis": "vertical", "at": "0"}], "caption": "The graph of y = 4/x, the reciprocal parent graph with both asymptotes at the axes."}], "name": "The reciprocal parent graph", "key_prerequisites": ["rational-expression-restrictions", "reading-function-graphs"], "constraints": "parent graph y = k/x with k > 0 only; no shifts; excluded value, branch behavior, and point checks — no asymptote vocabulary beyond 'never touches the axes'", "exemplars": [{"problem": "Which value of $x$ is excluded from the domain of $y=\\dfrac{12}{x}$?", "answer": "0", "answer_contract": {"kind": "exact"}, "solution_sketch": "At $x=0$ the denominator is zero, so the quotient $\\frac{12}{0}$ has no value. Every other value of $x$ is allowed."}, {"problem": "As $x$ increases through positive values, does $y=\\dfrac{8}{x}$ increase or decrease?", "answer": "decreasing", "answer_contract": {"kind": "label", "options": [["decreasing", "decrease", "it decreases", "decreases", "y decreases", "goes down", "it goes down", "gets smaller"], ["increasing", "increase", "it increases", "increases", "y increases", "goes up", "it goes up", "gets larger"]]}, "solution_sketch": "For $0<a<b$ we have $\\frac{1}{a}>\\frac{1}{b}$, and multiplying by $8$ keeps this order. So $y$ decreases as $x$ increases; for example $y=4$ at $x=2$ and $y=2$ at $x=4$."}, {"problem": "The graph of $y=\\dfrac{6}{x}$ passes through the point $(2,c)$. Find $c$.", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "A point on the graph has coordinates that satisfy the equation. Substituting $x=2$ gives $c=\\frac{6}{2}=3$."}, {"problem": "As $|x|$ grows larger and larger, the graph of $y=\\dfrac{10}{x}$ gets closer and closer to a horizontal line. What is the equation of that line?", "answer": "y = 0", "answer_contract": {"kind": "exact"}, "solution_sketch": "For large $|x|$ the quotient $\\frac{10}{x}$ is very close to zero. So the graph approaches the line $y=0$, the $x$-axis, but never reaches it."}, {"problem": "Which of the points $(2,8)$, $(3,5)$ and $(9,2)$ lies on the graph of $y=\\dfrac{18}{x}$?", "answer": "(9, 2)", "answer_contract": {"kind": "coordinates", "arity": 2}, "solution_sketch": "A point lies on the graph when $xy=18$. Here $2\\cdot8=16$ and $3\\cdot5=15$ both fail, while $9\\cdot2=18$ works."}, {"problem": "A $240$ km trip at a steady speed of $v$ km/h takes $t=\\dfrac{240}{v}$ hours. How long does the trip take at $60$ km/h?", "answer": "4", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "The speed $60$ km/h goes in place of $v$. Substituting $v=60$ gives $t=\\frac{240}{60}=4$ hours."}, {"problem": "A rectangle has area $24$ cm$^2$ and width $w$ cm, so its length is $\\ell=\\dfrac{24}{w}$ cm. What width gives a length of $8$ cm?", "answer": "3", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}, "solution_sketch": "Set the length $8$ equal to $\\frac{24}{w}$. Multiplying both sides by $w$ gives $8w=24$, so $w=3$ cm."}, {"problem": "What is $y$ in $y=\\dfrac{12}{x}$ when $x=12$?", "answer": "1", "answer_contract": {"kind": "exact"}, "solution_sketch": "The equation divides $12$ by $x$ and does not subtract. So $y=\\frac{12}{12}=1$, and $y$ is never $0$ for this graph."}]}
  ]},
  {"id": "rational-equations", "name": "Solving Rational Equations", "core": true, "difficulty": 0.7, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 180, "prerequisites": [{"id": "basic-rational-equations", "weight": 0.7, "key": true}, {"id": "adding-subtracting-rational-expressions", "weight": 0.5, "key": true}, {"id": "quadratic-equations-factoring", "weight": 0.4}, {"id": "rational-expression-restrictions", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Solve $\\frac{x^2}{x - 2} = \\frac{4}{x - 2} + 3$.", "answer": "x = 1", "solution_sketch": "Clear $(x - 2)$ to get $x^2 = 3x - 2$, so $(x - 1)(x - 2) = 0$; $x = 2$ is extraneous."}, "anki_seeds": [{"front": "An extraneous solution of a rational equation is...", "back": "a root of the cleared equation that makes an original denominator zero.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Clear denominators in multi-term equations", "key_prerequisites": ["basic-rational-equations", "adding-subtracting-rational-expressions"], "constraints": "two or three terms with monomial or linear-binomial denominators; the cleared equation is linear; solutions may be fractions", "exemplars": [{"problem": "Solve $\\dfrac{5}{x+1}+\\dfrac{1}{2}=2$.", "answer": "7/3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=-1$. Subtracting $\\frac{1}{2}$ from both sides gives $\\frac{5}{x+1}=\\frac{3}{2}$, so $10=3(x+1)$ and $x=\\frac{7}{3}$."}, {"problem": "Solve $\\dfrac{4}{x}-\\dfrac{1}{3}=\\dfrac{1}{x}$.", "answer": "9", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Moving the terms in $x$ to one side gives $\\frac{3}{x}=\\frac{1}{3}$, so $x=9$."}, {"problem": "Solve $\\dfrac{3}{x-2}+\\dfrac{1}{4}=1$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=2$. Subtracting $\\frac{1}{4}$ from both sides gives $\\frac{3}{x-2}=\\frac{3}{4}$, so $x-2=4$ and $x=6$."}, {"problem": "Solve $\\dfrac{2}{x}+\\dfrac{3}{2x}=\\dfrac{7}{4}$.", "answer": "2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying every term by the common denominator $4x$ gives $8+6=7x$, so $x=2$."}, {"problem": "Ana paints a fence in $4$ hours. Working with Ben she paints it in $3$ hours. How long would Ben take to paint it alone?", "answer": "12", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}, "solution_sketch": "Ana paints $\\frac{1}{4}$ of the fence each hour, Ben paints $\\frac{1}{x}$ and together they paint $\\frac{1}{3}$. Solving $\\frac{1}{4}+\\frac{1}{x}=\\frac{1}{3}$ gives $x=12$ hours."}, {"problem": "A boat goes $36$ km downstream and $24$ km upstream in the same time. The river current is $2$ km/h. What is the speed of the boat in still water?", "answer": "10", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}, "solution_sketch": "Let the boat speed be $x$ km/h, so the times are $\\frac{36}{x+2}$ and $\\frac{24}{x-2}$. Setting them equal gives $36x-72=24x+48$, so $x=10$ km/h."}, {"problem": "Solve $\\dfrac{2}{x}+\\dfrac{1}{3}=\\dfrac{5}{6}$.", "answer": "4", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the right side by $x$ as well. The equation is $12+2x=5x$, so $3x=12$ and $x=4$."}, {"problem": "Solve $\\dfrac{1}{x-1}+\\dfrac{2}{x-1}=\\dfrac{3}{4}$.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=1$. Combining the left side gives $\\frac{3}{x-1}=\\frac{3}{4}$, so $x-1=4$ and $x=5$."}]},
    {"id": "kp2", "name": "Equations that lead to a quadratic", "key_prerequisites": ["quadratic-equations-factoring", "adding-subtracting-rational-expressions"], "constraints": "clearing denominators gives a monic quadratic that factors over the integers; report both roots", "exemplars": [{"problem": "Solve $x+\\dfrac{6}{x}=5$.", "answer": "2, 3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying by $x$ gives $x^2-5x+6=(x-2)(x-3)=0$, and both roots are allowed."}, {"problem": "Solve $x-\\dfrac{12}{x}=1$.", "answer": "-3, 4", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying by $x$ gives $x^2-x-12=(x-4)(x+3)=0$, and both roots are allowed."}, {"problem": "Solve $\\dfrac{4}{x}=x$.", "answer": "-2, 2", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying by $x$ gives $4=x^2$, so $x=\\pm2$, and both values are allowed."}, {"problem": "Solve $x+\\dfrac{9}{x}=6$.", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying by $x$ gives $x^2-6x+9=(x-3)^2=0$, so $3$ is the only solution."}, {"problem": "A rectangle has area $24$ cm$^2$ and width $w$ cm, so its length is $\\dfrac{24}{w}$ cm. The length is $2$ cm more than the width. Find the width.", "answer": "4", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}, "solution_sketch": "Set $\\frac{24}{w}=w+2$, so $24=w^2+2w$ and $(w+6)(w-4)=0$. A width cannot be negative, so $w=4$ cm."}, {"problem": "Two numbers have product $20$, and the first number is $1$ more than the second. Find all possible values of the first number.", "answer": "-4, 5", "answer_contract": {"kind": "exact"}, "solution_sketch": "If the first number is $x$, the second is $\\frac{20}{x}$, so $x-\\frac{20}{x}=1$. Then $x^2-x-20=(x-5)(x+4)=0$; both $5$ and $-4$ work, because $5\\cdot4=20$ and $(-4)(-5)=20$."}, {"problem": "Solve $x-\\dfrac{10}{x}=3$. What are the solutions?", "answer": "-2, 5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Multiply the $3$ on the right by $x$ as well. The equation is $x^2-10=3x$, so $(x-5)(x+2)=0$."}, {"problem": "Solve $\\dfrac{15}{x}=x+2$.", "answer": "-5, 3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=0$. Multiplying by $x$ gives $15=x^2+2x$, so $(x+5)(x-3)=0$ and the roots are $-5$ and $3$."}]},
    {"id": "kp3", "name": "Extraneous solutions", "key_prerequisites": ["rational-expression-restrictions", "basic-rational-equations"], "constraints": "the cleared equation has a root at an excluded value", "try_first": {"problem": "Is $x=3$ a solution of $\\dfrac{x}{x-3}=\\dfrac{3}{x-3}$?", "answer_contract": {"kind": "label", "options": [["yes", "it is", "is a solution", "it is a solution", "yes it is", "yes, it is"], ["no", "it is not", "not a solution", "is not a solution", "no it is not", "no, it is not", "it isn't", "no, it isn't"]]}, "answer": "no", "reveal": "At $x=3$ both denominators are zero, so neither side has a value. A number that makes an original denominator zero is never a solution, even when it solves the cleared equation."}, "exemplars": [{"problem": "Solve $\\dfrac{x^2-4}{x-2}=7$.", "answer": "5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=2$. Clearing the denominator gives $x^2-4=7x-14$, so $(x-2)(x-5)=0$. The root $2$ is excluded, and $5$ works because $\\frac{21}{3}=7$."}, {"problem": "Solve $\\dfrac{x^2}{x-3}=\\dfrac{9}{x-3}+9$.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=3$. Clearing gives $x^2=9+9(x-3)$, so $x^2-9x+18=(x-3)(x-6)=0$. The root $3$ is excluded, and $6$ works."}, {"problem": "Solve $\\dfrac{1}{x-4}+\\dfrac{1}{x+4}=\\dfrac{x^2-3x+4}{x^2-16}$.", "answer": "1", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $4$ and $-4$. Clearing gives $2x=x^2-3x+4$, so $(x-1)(x-4)=0$. The root $4$ is excluded, and at $1$ both sides equal $-\\frac{2}{15}$."}, {"problem": "Solve $\\dfrac{x^2+3x-10}{x+5}=9$.", "answer": "11", "answer_contract": {"kind": "exact"}, "solution_sketch": "Exclude $x=-5$. The numerator factors as $(x+5)(x-2)$, and clearing gives $(x+5)(x-11)=0$. The root $-5$ is excluded; at $11$ the quotient is $\\frac{144}{16}=9$."}, {"problem": "Solve $\\dfrac{x^2}{x-1}=\\dfrac{1}{x-1}+4$. What are the solutions?", "answer": "3", "answer_contract": {"kind": "exact"}, "solution_sketch": "Clearing gives $x^2=1+4(x-1)$, so $(x-1)(x-3)=0$. But $x=1$ makes the denominator zero, so only $3$ is a solution."}, {"problem": "Is $x=5$ a solution of $\\dfrac{x^2-25}{x-5}=10$?", "answer": "no", "answer_contract": {"kind": "label", "options": [["yes", "it is", "is a solution", "it is a solution", "yes it is", "yes, it is"], ["no", "it is not", "not a solution", "is not a solution", "no it is not", "no, it is not", "it isn't", "no, it isn't"]]}, "solution_sketch": "At $x=5$ the denominator is $0$, so the left side is undefined. Clearing the denominator gives the root $5$, but it is excluded, so it is not a solution."}, {"problem": "A number is squared and $16$ is subtracted. Dividing the result by $4$ less than the number gives $11$. What is the number?", "answer": "7", "answer_contract": {"kind": "exact"}, "solution_sketch": "Set $\\frac{x^2-16}{x-4}=11$ with $x\\ne4$. Clearing gives $x^2-11x+28=(x-4)(x-7)=0$. The root $4$ is excluded, so the number is $7$."}, {"problem": "A rectangle has width $(x-4)$ cm and area $(x^2-16)$ cm$^2$. Its length is $12$ cm. Find $x$.", "answer": "8", "answer_contract": {"kind": "exact"}, "solution_sketch": "Area is width times length, so $\\frac{x^2-16}{x-4}=12$. Clearing gives $(x-4)(x-8)=0$. A width of $0$ is impossible, so $x=8$."}]}
  ]},
  {"id": "work-rate-problems", "name": "Work and Rate Problems", "core": false, "difficulty": 0.75, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 240, "prerequisites": [{"id": "rational-equations", "weight": 0.7, "key": true}, {"id": "ratios-proportions", "weight": 0.4}], "diagnostic_exemplar": {"problem": "A tap fills a tank in $4$ hours while an open drain empties it in $12$ hours. With both running, how long does the tank take to fill?", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h"}, "answer": "6 h", "solution_sketch": "Rates add, the drain negatively: $\\frac{1}{4} - \\frac{1}{12} = \\frac{1}{6}$ tank per hour."}, "anki_seeds": [{"front": "If a job takes t hours, the work rate is...", "back": "1/t of the job per hour.", "type": "basic"}, {"front": "Combined work rate of two workers = ...", "back": "the sum of their individual rates.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Combined work time", "key_prerequisites": ["rational-equations", "ratios-proportions"], "constraints": "individual times chosen so the combined time is a whole number", "exemplars": [{"problem": "Ann paints a room in $3$ hours and Ben paints the same room in $6$ hours. How long do they take if they work together?", "answer": "2", "solution_sketch": "In one hour Ann paints $1/3$ of the room and Ben paints $1/6$ of it, so together they paint $1/3+1/6=1/2$ of the room per hour. The whole room then takes $1/(1/2)=2$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Three taps fill a cistern alone in $12$, $18$ and $36$ hours. How long do the three taps take to fill it together?", "answer": "6", "solution_sketch": "The three rates are $1/12$, $1/18$ and $1/36$ of the cistern per hour, and they add to $3/36+2/36+1/36=6/36=1/6$. One whole cistern then takes $6$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Each of two identical printers prints a batch of leaflets in $8$ hours. How long do the two printers need for one batch if they print together?", "answer": "4", "solution_sketch": "Each printer does $1/8$ of a batch per hour, so the pair does $2/8=1/4$ of a batch per hour. One batch takes $4$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "One painter needs $10$ hours for a room and another painter needs $15$ hours. They start when half of the room is already painted. How long do they need to finish it together?", "answer": "3", "solution_sketch": "Together they paint $1/10+1/15=1/6$ of the room per hour. The half room that is left takes $(1/2)/(1/6)=3$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "One pump fills $1/4$ of a pool every hour and a second pump fills $1/12$ of the pool every hour. How long do the two pumps need to fill the whole pool?", "answer": "3", "solution_sketch": "The combined rate is $3/12+1/12=1/3$ of the pool per hour. The whole pool takes the reciprocal, $3$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Mia mows a lawn in $4$ hours and Raj mows the same lawn in $12$ hours. They work together for $2$ hours. What fraction of the lawn have they mowed?", "answer": "2/3", "solution_sketch": "Together they mow $1/4+1/12=1/3$ of the lawn per hour. In $2$ hours they mow $2\\cdot\\frac{1}{3}=2/3$ of the lawn.", "answer_contract": {"kind": "exact"}}, {"problem": "Five identical machines each stamp a full order in $20$ hours. How long do all five need for one order when they work together?", "answer": "4", "solution_sketch": "Each machine does $1/20$ of the order per hour, so five machines do $5/20=1/4$ per hour. The order takes $4$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}]},
    {"id": "kp2", "name": "Find an unknown individual time", "key_prerequisites": ["rational-equations"], "constraints": "1/a + 1/b = 1/t with two of the three times given; whole-hour data chosen so the unknown time is a whole number", "exemplars": [{"problem": "Together two crews finish a job in $4$ hours. The first crew alone needs $12$ hours. How long does the second crew need alone?", "answer": "6", "solution_sketch": "The combined rate is $1/4$ of the job per hour and the first crew supplies $1/12$. The second crew supplies $1/4-1/12=1/6$ per hour, so it needs $6$ hours alone.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Two painters together finish $1/3$ of a room every hour. The first painter alone finishes $1/4$ of a room every hour. How long does the second painter need for a whole room?", "answer": "12", "solution_sketch": "The second painter does $1/3-1/4=1/12$ of a room per hour. A whole room therefore takes $12$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "A helper works three times as fast as a machine, and together they finish an order in $6$ hours. How long would the machine need alone?", "answer": "24", "solution_sketch": "Let the machine do $r$ of the order per hour, so the helper does $3r$ and together they do $4r=1/6$. Then $r=1/24$ and the machine needs $24$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Two identical crews together finish a job in $5$ hours. How long does either crew need alone?", "answer": "10", "solution_sketch": "Each crew supplies half of the combined rate $1/5$, which is $1/10$ of the job per hour. Either crew needs $10$ hours alone.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Dev and Eli together paint a fence in $12$ hours. Dev alone would need $20$ hours. How long would Eli need alone?", "answer": "30", "solution_sketch": "Eli paints $1/12-1/20=5/60-3/60=1/30$ of the fence per hour. Alone Eli needs $30$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "Kai works twice as fast as Lou. Together they finish a job in $4$ hours. How long would Lou need alone?", "answer": "12", "solution_sketch": "Let Lou do $r$ of the job per hour, so Kai does $2r$ and together $3r=1/4$. Then $r=1/12$, so Lou needs $12$ hours alone.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "One hose fills a pool in $6$ hours. With a second hose also open, the pool fills in $2$ hours. How long would the second hose need alone?", "answer": "3", "solution_sketch": "The second hose supplies $1/2-1/6=1/3$ of the pool per hour. Alone it needs $3$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}]},
    {"id": "kp3", "name": "Opposing rates and round trips", "key_prerequisites": ["rational-equations"], "constraints": "rates that oppose each other (fill against drain, so subtract), or an out-and-back trip whose two speeds differ by a constant; whole-number answers", "exemplars": [{"problem": "A pipe fills a tank in $6$ hours and an open drain empties the full tank in $10$ hours. How long does the empty tank take to fill when the pipe and the drain are both open?", "answer": "15", "solution_sketch": "The drain works against the pipe, so the net rate is $1/6-1/10=1/15$ of the tank per hour. The tank takes $15$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "A tank is half full. An inlet adds $1/4$ of the tank every hour and a drain removes $1/8$ of the tank every hour. How long until the tank is full?", "answer": "4", "solution_sketch": "The net rate is $1/4-1/8=1/8$ of the tank per hour. The missing half takes $(1/2)/(1/8)=4$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "A cyclist rides $12$ km out at a steady speed and returns at a speed $2$ km/h slower. The round trip takes $5$ hours. How fast does the cyclist ride on the way out?", "answer": "6", "solution_sketch": "Let $x$ km/h be the outward speed, so the return speed is $x-2$ km/h. The times add: $12/x+12/(x-2)=5$, which gives $5x^2-34x+24=(x-6)(5x-4)=0$. Only $x=6$ makes the return speed positive.", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}}, {"problem": "A boat travels $12$ km downstream at $8$ km/h and returns the same $12$ km at $4$ km/h. How long does the whole trip take?", "answer": "9/2", "solution_sketch": "Each leg takes distance divided by its own speed: $12/8=3/2$ hours downstream and $12/4=3$ hours back. The total is $9/2$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "A bath tap fills the bath in $8$ minutes. With the plug out, a full bath drains in $24$ minutes. How long does the empty bath take to fill with the tap running and the plug out?", "answer": "12", "solution_sketch": "The tap fills $1/8$ of the bath per minute and the open plug removes $1/24$ per minute. The net rate is $1/12$, so the bath takes $12$ minutes.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}}, {"problem": "A driver goes $60$ km to a town at $30$ km/h and returns the same way at $60$ km/h. What is the average speed for the whole trip?", "answer": "40", "solution_sketch": "The trip out takes $60/30=2$ hours and the return takes $60/60=1$ hour. The whole $120$ km takes $3$ hours, so the average speed is $120/3=40$ km/h, not the mean of $30$ and $60$.", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}}, {"problem": "A full tank has a drain that removes $1/3$ of the tank every hour and an inlet that adds $1/6$ of the tank every hour. How long does the full tank take to empty?", "answer": "6", "solution_sketch": "The drain is faster, so the tank loses $1/3-1/6=1/6$ of its water per hour. It empties in $6$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}}, {"problem": "A boat travels $15$ km upstream and $15$ km back in a river whose current runs at $2$ km/h. The whole trip takes $4$ hours. What is the speed of the boat in still water?", "answer": "8", "solution_sketch": "Let $x$ km/h be the speed in still water, so the speed upstream is $x-2$ and downstream is $x+2$. The times add: $15/(x-2)+15/(x+2)=4$, which gives $2x^2-15x-8=(2x+1)(x-8)=0$. The speed must be positive, so $x=8$.", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}}]}
  ]},
  {"id": "trig-ratios-definition", "name": "Defining the Trigonometric Ratios", "core": true, "difficulty": 0.5, "drill": false, "answer_kind": "expression", "expected_time_secs": 90, "prerequisites": [{"id": "ratios-proportions", "weight": 0.6, "key": true}, {"id": "pythagorean-theorem", "weight": 0.5, "key": true}], "diagnostic_exemplar": {"problem": "A right triangle has hypotenuse $10$ and one leg $6$. For the acute angle $\\phi$ adjacent to the leg of length $6$, find $\\tan \\phi$.", "answer": "4/3", "solution_sketch": "Pythagoras gives the missing leg $8$; opposite over adjacent is $\\frac{8}{6}$."}, "anki_seeds": [{"front": "SOH-CAH-TOA: sin, cos, tan equal which ratios?", "back": "sin = opp/hyp, cos = adj/hyp, tan = opp/adj.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "SOH-CAH-TOA from labeled sides", "key_prerequisites": ["ratios-proportions"], "constraints": "Pythagorean triples (3-4-5, 5-12-13, 8-15-17) scaled by small integers", "exemplars": [{"problem": "In a right triangle, the leg opposite the angle $\\theta$ is $9$, the leg adjacent to it is $40$ and the hypotenuse is $41$. Find $\\sin\\theta$.", "answer": "9/41", "solution_sketch": "Sine is the opposite leg over the hypotenuse, so $\\sin\\theta=9/41$. The fraction is already in lowest terms.", "answer_contract": {"kind": "exact"}}, {"problem": "A $13$ m ladder leans against a wall. Its top is $12$ m above the ground and its foot is $5$ m from the wall. What is the sine of the angle between the ladder and the ground?", "answer": "12/13", "solution_sketch": "The wall height $12$ is opposite the angle at the foot, and the ladder $13$ is the hypotenuse. So the sine is $12/13$.", "answer_contract": {"kind": "exact"}}, {"problem": "In a right triangle the leg opposite $\\theta$ is $20$, the leg adjacent to $\\theta$ is $21$ and the hypotenuse is $29$. Find $\\cos\\theta$.", "answer": "21/29", "solution_sketch": "Cosine is the adjacent leg over the hypotenuse, so $\\cos\\theta=21/29$. The opposite leg $20$ is not used.", "answer_contract": {"kind": "exact"}}, {"problem": "A ramp is $25$ m long. It rises $7$ m over a horizontal distance of $24$ m. What is the tangent of the angle between the ramp and the horizontal?", "answer": "7/24", "solution_sketch": "Tangent compares the rise $7$ with the horizontal distance $24$, so $\\tan=7/24$. The ramp length $25$ is the hypotenuse and is not used.", "answer_contract": {"kind": "exact"}}, {"problem": "A roof rafter is $10$ m long and rises $6$ m. What is the sine of the angle the rafter makes with the horizontal?", "answer": "3/5", "solution_sketch": "The rise is opposite the angle and the rafter is the hypotenuse, so $\\sin=6/10$. Dividing top and bottom by $2$ gives $3/5$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has opposite leg $5$, adjacent leg $12$ and hypotenuse $13$. What is the value of $\\sin\\theta$?", "answer": "5/13", "solution_sketch": "The adjacent leg $12$ belongs to cosine. Sine uses the opposite leg, so $\\sin\\theta=5/13$.", "answer_contract": {"kind": "exact"}}, {"problem": "A kite string is $17$ m long. The kite is $15$ m above the hand and $8$ m away horizontally. What is the cosine of the angle between the string and the horizontal?", "answer": "8/17", "solution_sketch": "The horizontal distance $8$ touches the angle, so it is the adjacent leg. The string $17$ is the hypotenuse, so $\\cos=8/17$.", "answer_contract": {"kind": "exact"}}]},
    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}, {"at": 2, "label": "\u03c6"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 and \u03c6 mark the two acute angles. The side opposite \u03b8 is adjacent to \u03c6, and the side opposite \u03c6 is adjacent to \u03b8."}], "name": "Ratios of the other acute angle", "key_prerequisites": ["ratios-proportions"], "constraints": "the same Pythagorean-triple triangle read from the other acute angle, so opposite and adjacent swap", "exemplars": [{"problem": "A right triangle has legs $3$ and $4$ and hypotenuse $5$. The angle $\\theta$ is opposite the leg $3$, and $\\phi$ is the other acute angle. Find $\\sin\\phi$.", "answer": "4/5", "solution_sketch": "The leg opposite $\\phi$ is the leg that touches $\\theta$, which is $4$. So $\\sin\\phi=4/5$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has legs $8$ and $15$ and hypotenuse $17$. The angle $\\theta$ is opposite the leg $8$. For the other acute angle $\\phi$, find $\\tan\\phi$.", "answer": "15/8", "solution_sketch": "For $\\phi$ the opposite leg is $15$ and the adjacent leg is $8$. So $\\tan\\phi=15/8$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has legs $5$ and $12$ and hypotenuse $13$. The angle $\\theta$ is opposite the leg $5$. For the other acute angle $\\phi$, find $\\cos\\phi$.", "answer": "5/13", "solution_sketch": "The leg adjacent to $\\phi$ is the leg opposite $\\theta$, which is $5$. So $\\cos\\phi=5/13$.", "answer_contract": {"kind": "exact"}}, {"problem": "A $13$ m ladder leans against a wall with its foot $5$ m from the wall and its top $12$ m up. At the top the ladder makes an angle $\\beta$ with the wall. What is $\\cos\\beta$?", "answer": "12/13", "solution_sketch": "The part of the wall between the ground and the top, $12$ m, touches $\\beta$, so it is adjacent. Then $\\cos\\beta=12/13$.", "answer_contract": {"kind": "exact"}}, {"problem": "In a right triangle one acute angle $\\theta$ has $\\tan\\theta=\\frac{7}{24}$. What is the tangent of the other acute angle $\\phi$?", "answer": "24/7", "solution_sketch": "The value $7/24$ means $\\theta$ has opposite leg $7$ and adjacent leg $24$. For $\\phi$ the two legs swap, so $\\tan\\phi=24/7$.", "answer_contract": {"kind": "exact"}}, {"problem": "In a right triangle one acute angle $A$ has $\\sin A=\\frac{20}{29}$. What is the cosine of the other acute angle $B$?", "answer": "20/29", "solution_sketch": "The leg opposite $A$ is the leg adjacent to $B$, and the hypotenuse is shared. So $\\cos B=20/29$.", "answer_contract": {"kind": "exact"}}, {"problem": "A wire is $15$ m long and runs from the top of a $12$ m pole to a point $9$ m from its foot. It makes an angle $\\beta$ with the pole. What is $\\sin\\beta$?", "answer": "3/5", "solution_sketch": "The ground distance $9$ lies opposite the angle $\\beta$ at the top of the pole, and the wire is the hypotenuse. So $\\sin\\beta=9/15=3/5$.", "answer_contract": {"kind": "exact"}}]},
    {"id": "kp3", "name": "Find the missing side first", "key_prerequisites": ["pythagorean-theorem"], "constraints": "two of the three sides given; find the third by Pythagoras (triples 3-4-5, 5-12-13, 8-15-17 and small multiples) before writing the ratio", "exemplars": [{"problem": "A right triangle has legs $6$ and $8$. For the angle $\\theta$ opposite the leg $6$, find $\\sin\\theta$.", "answer": "3/5", "solution_sketch": "The hypotenuse is $\\sqrt{36+64}=10$, which is the side opposite the right angle. Then $\\sin\\theta=6/10=3/5$ in lowest terms.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has hypotenuse $13$ and one leg $5$. For the angle $\\theta$ adjacent to the other leg, find $\\cos\\theta$.", "answer": "12/13", "solution_sketch": "The other leg is $\\sqrt{169-25}=12$, and it is the leg that touches $\\theta$. So $\\cos\\theta=12/13$.", "answer_contract": {"kind": "exact"}}, {"problem": "A $25$ m ladder has its foot $7$ m from a wall. What is the tangent of the angle between the ladder and the ground?", "answer": "24/7", "solution_sketch": "The wall height is $\\sqrt{25^2-7^2}=\\sqrt{576}=24$ m. Tangent is opposite over adjacent, so $\\tan=24/7$.", "answer_contract": {"kind": "exact"}}, {"problem": "A $17$ m cable runs from the top of a mast to a point on the ground $8$ m from the base of the mast. What is the cosine of the angle between the cable and the mast?", "answer": "15/17", "solution_sketch": "The mast height is $\\sqrt{17^2-8^2}=\\sqrt{225}=15$ m. At the top this leg touches the angle, so $\\cos=15/17$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has legs $20$ and $21$. What is $\\sin\\theta$ for the angle $\\theta$ opposite the leg $20$?", "answer": "20/29", "solution_sketch": "The hypotenuse is not the sum of the legs. It is $\\sqrt{400+441}=29$. So the sine is $\\sin\\theta=20/29$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has hypotenuse $17$ and opposite leg $15$. Find the tangent of the angle opposite the leg $15$.", "answer": "15/8", "solution_sketch": "The adjacent leg is $\\sqrt{17^2-15^2}=\\sqrt{64}=8$. Then the tangent is opposite over adjacent, $15/8$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has hypotenuse $26$ and one leg $24$. For the angle $\\theta$ opposite the other leg, find $\\tan\\theta$.", "answer": "5/12", "solution_sketch": "The other leg is $\\sqrt{676-576}=10$ and it is opposite $\\theta$. Then $\\tan\\theta=10/24=5/12$.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has hypotenuse $25$ and one leg $20$. For the angle $\\theta$ opposite the other leg, find $\\tan\\theta$.", "answer": "3/4", "solution_sketch": "The other leg is $\\sqrt{625-400}=15$ and it is opposite $\\theta$. Then $\\tan\\theta=15/20=3/4$.", "answer_contract": {"kind": "exact"}}]}
  ]},
  {"id": "solving-right-triangles-sides", "name": "Right Triangles — Solving for Sides", "core": true, "difficulty": 0.55, "drill": false, "answer_kind": "numeric", "expected_time_secs": 120, "prerequisites": [{"id": "trig-ratios-definition", "weight": 0.8, "key": true}, {"id": "one-step-equations", "weight": 0.3}, {"id": "multiplying-fractions", "weight": 0.3}], "diagnostic_exemplar": {"problem": "One acute angle is $40^\\circ$ and the leg opposite it is $12.6$. Find the leg adjacent to that angle. Use $\\tan 40^\\circ \\approx 0.84$.", "answer": "15", "solution_sketch": "$\\tan 40^\\circ = \\frac{\\text{opposite}}{\\text{adjacent}} = \\frac{12.6}{x}$, so $x = \\frac{12.6}{0.84}$."}, "anki_seeds": [{"front": "To solve for a right-triangle side, pick the trig ratio that links...", "back": "the known angle, the known side, and the side you want.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Multiply to find a leg", "key_prerequisites": ["trig-ratios-definition"], "constraints": "give the needed trig value in the problem (exact or rounded)", "exemplars": [{"problem": "A $10$ m ladder makes an angle of $30^\\circ$ with the ground. How high up the wall does it reach? Use $\\sin30^\\circ=\\frac12$.", "answer": "5", "solution_sketch": "The ladder is the hypotenuse and the height is the leg opposite the angle, so height $=10\\sin30^\\circ=10\\cdot\\frac12=5$ m. The hypotenuse is known, so multiply.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "The hypotenuse of a right triangle is $8$ and one acute angle is $60^\\circ$. Find the side adjacent to that angle. Use $\\cos60^\\circ=\\frac12$.", "answer": "4", "solution_sketch": "Cosine is adjacent over hypotenuse, so the adjacent side is $8\\cos60^\\circ=8\\cdot\\frac12=4$. The side is shorter than the hypotenuse, as it must be.", "answer_contract": {"kind": "exact"}}, {"problem": "A slide is $5$ m long and makes an angle of $40^\\circ$ with the ground. How high is the top of the slide above the ground? Use $\\sin40^\\circ\\approx0.64$.", "answer": "3.2", "solution_sketch": "The height is opposite the angle, so it is $5\\sin40^\\circ\\approx5(0.64)=3.2$ m. The slide is the hypotenuse, so the height must be less than $5$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A kite string is $12$ m long and makes an angle of $45^\\circ$ with the ground. The string is taut. How high is the kite above the ground? Use $\\sin45^\\circ=\\frac{\\sqrt2}{2}$.", "answer": "6sqrt(2)", "solution_sketch": "The kite height is opposite the angle, so it is $12\\sin45^\\circ=12\\cdot\\frac{\\sqrt2}{2}=6\\sqrt2$ m. This is about $8.5$ m, less than the string length $12$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "A ramp is $20$ m long and makes an angle of $30^\\circ$ with the ground. What is its horizontal length? Use $\\cos30^\\circ=\\frac{\\sqrt3}{2}$.", "answer": "10sqrt(3)", "solution_sketch": "The horizontal length is adjacent to the angle, so it is $20\\cos30^\\circ=20\\cdot\\frac{\\sqrt3}{2}=10\\sqrt3$ m. That is about $17.3$ m, shorter than the ramp.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "A rope $52$ m long is stretched from the top of a hill to level ground. The angle $\\theta$ between the rope and the ground has $\\sin\\theta=\\frac5{13}$. How high is the top of the hill above the ground?", "answer": "20", "solution_sketch": "The height is opposite $\\theta$ and the rope is the hypotenuse, so height $=52\\cdot\\frac5{13}$. Since $52/13=4$, the height is $4\\cdot5=20$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A zip line cable is $40$ m long and makes an angle of $60^\\circ$ with the horizontal. How far does the cable drop? Use $\\sin60^\\circ=\\frac{\\sqrt3}{2}$.", "answer": "20sqrt(3)", "solution_sketch": "The drop is opposite the angle, so it is $40\\sin60^\\circ=40\\cdot\\frac{\\sqrt3}{2}=20\\sqrt3$ m. This is about $34.6$ m, less than the cable length.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}]},
    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Use tangent between the legs", "key_prerequisites": ["trig-ratios-definition"], "constraints": "the two legs and one acute angle; the tangent value is given in the problem, exact or rounded to two decimals", "exemplars": [{"problem": "A surveyor stands $20$ m from the foot of a tree. The angle of elevation of the top of the tree is $35^\\circ$. How tall is the tree? Use $\\tan35^\\circ\\approx0.70$.", "answer": "14", "solution_sketch": "The tree height is opposite the angle and the distance $20$ m is adjacent. So the height is $20\\tan35^\\circ\\approx20(0.70)=14$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A ramp rises $3\\sqrt3$ m at an angle of $30^\\circ$ to the horizontal. How long is its horizontal run? Use $\\tan30^\\circ=\\frac{\\sqrt3}{3}$.", "answer": "9", "solution_sketch": "Tangent gives $\\frac{3\\sqrt3}{d}=\\frac{\\sqrt3}{3}$, so the run is $d=3\\sqrt3\\div\\frac{\\sqrt3}{3}=9$ m. Divide the rise by the tangent because the run is the adjacent leg.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A lighthouse is $42$ m tall. From a boat the angle of elevation of its top is $35^\\circ$. How far is the boat from the foot of the lighthouse? Use $\\tan35^\\circ\\approx0.70$.", "answer": "60", "solution_sketch": "The height $42$ m is opposite the angle and the distance $d$ is adjacent, so $0.70=42/d$. Then $d=42/0.70=60$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A hiking path rises $9$ m at a constant angle of $20^\\circ$ to the horizontal. How far does it run horizontally? Use $\\tan20^\\circ\\approx0.36$.", "answer": "25", "solution_sketch": "The rise is opposite the angle and the horizontal run $d$ is adjacent, so $0.36=9/d$. Then $d=9/0.36=25$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A flagpole casts a shadow $6$ m long when the sun is $60^\\circ$ above the horizon. How tall is the flagpole? Use $\\tan60^\\circ=\\sqrt3$.", "answer": "6sqrt(3)", "solution_sketch": "The shadow is adjacent to the angle and the pole is opposite it. So the height is $6\\tan60^\\circ=6\\sqrt3$ m, which is about $10.4$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "The diagonal of a rectangle makes an angle of $30^\\circ$ with the longer side, which is $12$ cm. How long is the shorter side? Use $\\tan30^\\circ=\\frac{\\sqrt3}{3}$.", "answer": "4sqrt(3)", "solution_sketch": "The shorter side is opposite the angle and the longer side $12$ is adjacent. So the shorter side is $12\\tan30^\\circ=12\\cdot\\frac{\\sqrt3}{3}=4\\sqrt3$ cm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "One acute angle of a right triangle is $45^\\circ$ and the adjacent leg is $7$. Find the opposite leg. Use $\\tan45^\\circ=1$.", "answer": "7", "solution_sketch": "The opposite leg is $7\\tan45^\\circ=7\\cdot1=7$. The two legs are equal because the triangle is isosceles.", "answer_contract": {"kind": "exact"}}]},
    {"id": "kp3", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Divide to find the hypotenuse", "key_prerequisites": ["trig-ratios-definition", "one-step-equations"], "constraints": "the hypotenuse is the unknown, so divide by the given sine or cosine; values chosen so the quotient is a whole number", "try_first": {"problem": "A support wire is attached $5$ m up a pole and makes an angle of $30^\\circ$ with the ground. How long is the wire? Use $\\sin30^\\circ=\\frac12$.", "answer_contract": {"kind": "exact"}, "answer": "10", "reveal": "The wire is the hypotenuse, so it must be longer than the $5$ m height. Dividing $5$ by $\\sin30^\\circ=\\frac12$ gives $10$ m, while multiplying would give $2.5$ m, which is shorter than the height."}, "exemplars": [{"problem": "A ladder reaches $9$ m up a wall and makes an angle of $30^\\circ$ with the ground. How long is the ladder? Use $\\sin30^\\circ=\\frac12$.", "answer": "18", "solution_sketch": "The ladder is the hypotenuse and the height $9$ is opposite the angle, so $\\sin30^\\circ=\\frac{9}{h}$. Then $h=9\\div\\frac12=18$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A ramp rises $5.1$ m at an angle of $10^\\circ$ to the ground. How long is the ramp? Use $\\sin10^\\circ\\approx0.17$.", "answer": "30", "solution_sketch": "The rise is opposite the angle and the ramp is the hypotenuse, so $0.17=5.1/h$. Then $h=5.1/0.17=30$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A guy wire is anchored $6$ m from the foot of a pole and makes an angle of $60^\\circ$ with the ground. How long is the wire? Use $\\cos60^\\circ=\\frac12$.", "answer": "12", "solution_sketch": "The distance $6$ m is adjacent to the angle and the wire is the hypotenuse, so $\\frac12=\\frac6h$. Then $h=6\\div\\frac12=12$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A road on a hillside covers $154$ m horizontally and is inclined at $40^\\circ$ to the horizontal. How long is the road? Use $\\cos40^\\circ\\approx0.77$.", "answer": "200", "solution_sketch": "The horizontal distance is adjacent to the angle and the road is the hypotenuse, so $0.77=154/h$. Then $h=154/0.77=200$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "Each half of a roof spans $8$ m horizontally and the roof is pitched at $45^\\circ$. How long is a rafter? Use $\\cos45^\\circ=\\frac{\\sqrt2}{2}$.", "answer": "8sqrt(2)", "solution_sketch": "The span is adjacent to the angle and the rafter is the hypotenuse, so $h=8\\div\\frac{\\sqrt2}{2}=\\frac{16}{\\sqrt2}=8\\sqrt2$ m. This is about $11.3$ m, longer than the span $8$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "A slide is $2.4$ m high at its top end and makes an angle of $30^\\circ$ with the ground. How long is the slide? Use $\\sin30^\\circ=\\frac12$.", "answer": "4.8", "solution_sketch": "The height is opposite the angle and the slide is the hypotenuse, so $\\frac12=\\frac{2.4}{h}$. Then $h=2.4\\div\\frac12=4.8$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "In a right triangle the leg opposite a $30^\\circ$ angle is $7$. What is the hypotenuse? Use $\\sin30^\\circ=\\frac12$.", "answer": "14", "solution_sketch": "The hypotenuse is the unknown in $\\sin30^\\circ=\\frac7h$. So $h=7\\div\\frac12=14$, which is longer than the leg $7$.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}]}
  ]},
  {"id": "right-triangle-trig", "name": "Right Triangle Trigonometry", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "numeric", "expected_time_secs": 150, "prerequisites": [{"id": "trig-ratios-definition", "weight": 0.7, "key": true}, {"id": "solving-right-triangles-sides", "weight": 0.7, "key": true}, {"id": "square-roots", "weight": 0.3}, {"id": "simplifying-radicals", "weight": 0.3}], "diagnostic_exemplar": {"problem": "A right triangle has hypotenuse $12$ and one acute angle of $60^\\circ$. Find the length of the leg opposite the $60^\\circ$ angle.", "answer": "6√3", "solution_sketch": "$12\\sin 60^\\circ = 12 \\cdot \\frac{\\sqrt{3}}{2} = 6\\sqrt{3}$ (the other leg is $12\\cos 60^\\circ = 6$)."}, "anki_seeds": [{"front": "To find an acute angle from tan θ = k, use...", "back": "the inverse tangent (tan⁻¹ / arctan) key.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Find angles from exact ratios", "key_prerequisites": ["trig-ratios-definition"], "constraints": "ratios are the exact special values 1/2, √2/2, √3/2, 1, √3 or √3/3; answers are 30, 45 or 60 degrees", "exemplars": [{"problem": "An acute angle $\\theta$ satisfies $\\sin\\theta=\\frac12$. Find $\\theta$.", "answer": "30", "solution_sketch": "The special acute angle whose sine is $1/2$ is $30^\\circ$. Only one acute angle has this sine, so $\\theta=30^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "An acute angle $\\theta$ satisfies $\\tan\\theta=1$. Find $\\theta$.", "answer": "45", "solution_sketch": "The tangent is $1$ when the opposite and adjacent legs are equal, which happens at $45^\\circ$. So $\\theta=45^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "A $10$ m ladder leans against a wall with its foot $5$ m from the wall. What angle does the ladder make with the ground?", "answer": "60", "solution_sketch": "The foot distance $5$ is adjacent to the angle and the ladder $10$ is the hypotenuse, so $\\cos\\theta=5/10=1/2$. The acute angle with cosine $1/2$ is $60^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "A right triangle has an acute angle of $30^\\circ$ and hypotenuse $1$. What is the length of the leg adjacent to the $30^\\circ$ angle?", "answer": "sqrt(3)/2", "solution_sketch": "The adjacent leg is $1\\cdot\\cos30^\\circ$, and the exact value of $\\cos30^\\circ$ is $\\frac{\\sqrt3}{2}$. So the leg is $\\frac{\\sqrt3}{2}$.", "answer_contract": {"kind": "exact"}}, {"problem": "A ramp makes an angle of $60^\\circ$ with the ground. For each metre of horizontal run, how many metres does the ramp rise?", "answer": "sqrt(3)", "solution_sketch": "The rise over the run is the tangent of the angle. The exact value of $\\tan60^\\circ$ is $\\sqrt3$ metres per metre of run.", "answer_contract": {"kind": "exact"}}, {"problem": "A right triangle has an acute angle of $45^\\circ$ and hypotenuse $1$. How long is each leg?", "answer": "sqrt(2)/2", "solution_sketch": "Each leg is $1\\cdot\\sin45^\\circ$, and the exact value of $\\sin45^\\circ$ is $\\frac{\\sqrt2}{2}$. So each leg is $\\frac{\\sqrt2}{2}$.", "answer_contract": {"kind": "exact"}}, {"problem": "A zip line cable is $20$ m long and drops $10$ m. What angle does the cable make with the horizontal?", "answer": "30", "solution_sketch": "The drop is opposite the angle and the cable is the hypotenuse, so $\\sin\\theta=10/20=1/2$. The acute angle with sine $1/2$ is $30^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "An acute angle $\\theta$ satisfies $\\tan\\theta=\\frac{\\sqrt3}{3}$. Find $\\theta$.", "answer": "30", "solution_sketch": "The special acute angle whose tangent is $\\frac{\\sqrt3}{3}$ is $30^\\circ$. Tangent grows with the angle, so only $30^\\circ$ fits.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "An acute angle $\\theta$ satisfies $\\sin\\theta=\\frac{\\sqrt2}{2}$. Find $\\theta$.", "answer": "45", "solution_sketch": "The special acute angle whose sine is $\\frac{\\sqrt2}{2}$ is $45^\\circ$. At $45^\\circ$ the two legs are equal, so the sine and the cosine have the same value.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}, {"problem": "A ramp rises $\\sqrt3$ m over a horizontal run of $1$ m. What angle does the ramp make with the horizontal?", "answer": "60", "solution_sketch": "The rise is opposite the angle and the run is adjacent, so $\\tan\\theta=\\sqrt3/1=\\sqrt3$. The acute angle with tangent $\\sqrt3$ is $60^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "°", "allow_omitted": true}}]},
    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Find angles with a calculator (inverse trig keys)", "key_prerequisites": ["trig-ratios-definition"], "constraints": "acute angles only; answers rounded to one decimal place", "exemplars": [{"problem": "An acute angle $\\theta$ satisfies $\\sin\\theta=0.6$. Find $\\theta$ in degrees to one decimal place.", "answer": "36.9", "solution_sketch": "With the calculator in degree mode, $\\theta=\\arcsin(0.6)=36.8698\\ldots^\\circ$. Rounded to one decimal place this is $36.9^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "In a right triangle the leg opposite $\\theta$ is $8$ and the leg adjacent to $\\theta$ is $5$. Find $\\theta$ in degrees to one decimal place.", "answer": "58.0", "solution_sketch": "Tangent is opposite over adjacent, so $\\tan\\theta=8/5=1.6$. Then $\\theta=\\arctan(1.6)=57.9946\\ldots^\\circ$, which rounds to $58.0^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "A right triangle has a leg of $2$ next to the angle $\\theta$ and a hypotenuse of $5$. Find $\\theta$ in degrees to one decimal place.", "answer": "66.4", "solution_sketch": "The leg touches $\\theta$, so $\\cos\\theta=2/5=0.4$. Then $\\theta=\\arccos(0.4)=66.4218\\ldots^\\circ$, which rounds to $66.4^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "A right triangle has an acute angle $A$ with $\\sin A=0.35$. Find the other acute angle in degrees to one decimal place.", "answer": "69.5", "solution_sketch": "First $A=\\arcsin(0.35)=20.4873\\ldots^\\circ$. The other acute angle is the complement, $90-20.4873\\ldots=69.5127\\ldots\\approx69.5^\\circ$ after rounding.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "A $6$ m ladder leans against a wall with its foot $2$ m from the wall. Find the angle between the ladder and the ground in degrees to one decimal place.", "answer": "70.5", "solution_sketch": "The foot distance $2$ is adjacent and the ladder $6$ is the hypotenuse, so $\\cos\\theta=2/6=1/3$. Then $\\theta=\\arccos(1/3)=70.5288\\ldots^\\circ\\approx70.5^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "A ramp rises $1.2$ m over a horizontal run of $8$ m. Find the angle of the ramp to the horizontal in degrees to one decimal place.", "answer": "8.5", "solution_sketch": "Tangent is rise over run, so $\\tan\\theta=1.2/8=0.15$. Then $\\theta=\\arctan(0.15)=8.5307\\ldots^\\circ$, which rounds to $8.5^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}, {"problem": "A roof rafter is $6.5$ m long and the roof rises $2.5$ m. Find the pitch angle of the roof in degrees to one decimal place.", "answer": "22.6", "solution_sketch": "The rise is opposite the pitch angle and the rafter is the hypotenuse, so $\\sin\\theta=2.5/6.5=5/13$. Then $\\theta=\\arcsin(5/13)=22.6199\\ldots^\\circ\\approx22.6^\\circ$.", "answer_contract": {"kind": "approx", "decimals": 1}}]},
    {"id": "kp3", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Solve the whole right triangle", "key_prerequisites": ["solving-right-triangles-sides", "simplifying-radicals"], "constraints": "30-60-90 and 45-45-90 triangles, or two legs given; answers are exact, with radicals where needed", "exemplars": [{"problem": "A right triangle has a $30^\\circ$ angle and hypotenuse $10$. Find the length of the leg adjacent to the $30^\\circ$ angle.", "answer": "5sqrt(3)", "solution_sketch": "The leg adjacent to $30^\\circ$ is $10\\cos30^\\circ=10\\cdot\\frac{\\sqrt3}{2}=5\\sqrt3$. The other leg is $10\\sin30^\\circ=5$.", "answer_contract": {"kind": "required_simplest_radical"}}, {"problem": "A right triangle has legs $3$ and $3$. Find the length of the hypotenuse.", "answer": "3sqrt(2)", "solution_sketch": "Both acute angles are $45^\\circ$ because the legs are equal. The hypotenuse is $\\sqrt{3^2+3^2}=\\sqrt{18}=3\\sqrt2$.", "answer_contract": {"kind": "required_simplest_radical"}}, {"problem": "A right triangle has a $45^\\circ$ angle and hypotenuse $10$. Find the length of either leg.", "answer": "5sqrt(2)", "solution_sketch": "The two legs are equal because the triangle is isosceles. Each leg is $10\\sin45^\\circ=10\\cdot\\frac{\\sqrt2}{2}=5\\sqrt2$.", "answer_contract": {"kind": "required_simplest_radical"}}, {"problem": "A right triangle has a $60^\\circ$ angle and hypotenuse $14$. Find the length of the leg opposite the $60^\\circ$ angle.", "answer": "7sqrt(3)", "solution_sketch": "The leg opposite $60^\\circ$ is $14\\sin60^\\circ=14\\cdot\\frac{\\sqrt3}{2}=7\\sqrt3$. The other leg is $14\\cos60^\\circ=7$, which is not asked for.", "answer_contract": {"kind": "required_simplest_radical"}}, {"problem": "A square tile has side $12$ cm. How long is its diagonal?", "answer": "12sqrt(2)", "solution_sketch": "The diagonal splits the square into two $45^\\circ$ right triangles with legs $12$. So the diagonal is $12\\sqrt2$ cm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "A $16$ m ladder makes an angle of $60^\\circ$ with the ground. How far is its foot from the wall?", "answer": "8", "solution_sketch": "The foot distance is adjacent to the angle and the ladder is the hypotenuse. So the distance is $16\\cos60^\\circ=16\\cdot\\frac12=8$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}, {"problem": "A roof truss is an equilateral triangle with side $8$ m. How tall is the truss?", "answer": "4sqrt(3)", "solution_sketch": "The height splits the truss into two $30^\\circ$-$60^\\circ$-$90^\\circ$ triangles with hypotenuse $8$. The height is $8\\sin60^\\circ=8\\cdot\\frac{\\sqrt3}{2}=4\\sqrt3$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}, {"problem": "A right triangle has legs $5$ and $5\\sqrt3$. Find the hypotenuse.", "answer": "10", "solution_sketch": "By Pythagoras the hypotenuse is $\\sqrt{25+75}=\\sqrt{100}=10$. This is twice the shorter leg, which fits a $30^\\circ$-$60^\\circ$-$90^\\circ$ triangle.", "answer_contract": {"kind": "exact"}}, {"problem": "A diagonal brace across a square window frame is $12$ m long. How long is each side of the frame?", "answer": "6sqrt(2)", "solution_sketch": "The two sides and the brace make a $45^\\circ$ right triangle with hypotenuse $12$. Each side is $12\\sin45^\\circ=12\\cdot\\frac{\\sqrt2}{2}=6\\sqrt2$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "form": "simplest_radical", "allow_omitted": true}}]}
  ]},
  {"id": "special-right-triangles", "name": "Special Right Triangles", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "right-triangle-trig", "weight": 0.7, "key": true}, {"id": "simplifying-radicals", "weight": 0.5, "key": true}, {"id": "square-roots", "weight": 0.4}], "diagnostic_exemplar": {"problem": "In a 30-60-90 triangle the longer leg is $9\\sqrt{3}$. Find the hypotenuse.", "answer": "18", "solution_sketch": "The sides are $x$, $x\\sqrt{3}$, $2x$; the longer leg $x\\sqrt{3} = 9\\sqrt{3}$ gives $x = 9$."}, "anki_seeds": [{"front": "Side ratios in a 30-60-90 triangle (short : long : hypotenuse)?", "back": "1 : √3 : 2", "type": "basic"}, {"front": "Side ratios in a 45-45-90 triangle (leg : leg : hypotenuse)?", "back": "1 : 1 : √2", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "visuals": [{"kind": "special_triangle", "figure": {"shape": "forty_five_forty_five_ninety", "leg": "4"}, "caption": "A 45-45-90 triangle with legs 4 has hypotenuse 4\u221a2: the hypotenuse is the leg times \u221a2."}], "name": "45-45-90 triangles", "key_prerequisites": ["simplifying-radicals", "right-triangle-trig"], "try_first": {"problem": "A square has sides of length $5$. What is the square of the length of its diagonal?", "answer_contract": {"kind": "exact"}, "answer": "50", "reveal": "The diagonal and two sides form a right triangle, so the diagonal squared is $25+25=50$ and the diagonal is $5\\sqrt2$. Every 45-45-90 triangle has its hypotenuse $\\sqrt2$ times a leg."}, "constraints": "45-45-90 triangles, sides in the ratio 1 : 1 : √2; the given side is chosen so the others stay exact; bare triangles and measured contexts, both directions (leg to hypotenuse and hypotenuse to leg)", "exemplars": [
      {"problem": "A $45$-$45$-$90$ triangle has legs of length $9$. Find its hypotenuse.", "answer": "9sqrt(2)", "answer_contract": {"kind": "required_simplest_radical"}, "solution_sketch": "In a 45-45-90 triangle the hypotenuse is the leg times $\\sqrt2$. So the hypotenuse is $9\\sqrt2$."},
      {"problem": "A $45$-$45$-$90$ triangle has hypotenuse $8$. Find the length of each leg.", "answer": "4sqrt(2)", "answer_contract": {"kind": "required_simplest_radical"}, "solution_sketch": "A leg is the hypotenuse divided by $\\sqrt2$. So each leg is $\\frac{8}{\\sqrt2}=\\frac{8\\sqrt2}{2}=4\\sqrt2$."},
      {"problem": "A square tile is $12$ cm on each side. How long is its diagonal?", "answer": "12sqrt(2)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The diagonal cuts the square into two 45-45-90 triangles whose legs are the sides. The diagonal is $12\\sqrt2$ cm."},
      {"problem": "A square picture frame has a diagonal of $30$ cm. How long is each side?", "answer": "15sqrt(2)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The side is the diagonal divided by $\\sqrt2$. So the side is $\\frac{30}{\\sqrt2}=\\frac{30\\sqrt2}{2}=15\\sqrt2$ cm."},
      {"problem": "A $45$-$45$-$90$ triangle has legs of length $7\\sqrt{2}$. Find its hypotenuse.", "answer": "14", "answer_contract": {"kind": "exact"}, "solution_sketch": "The hypotenuse is the leg times $\\sqrt2$. So the hypotenuse is $7\\sqrt2\\cdot\\sqrt2=7\\cdot2=14$."},
      {"problem": "A $45$-$45$-$90$ triangle has hypotenuse $10$. What is the length of each leg?", "answer": "5sqrt(2)", "answer_contract": {"kind": "required_simplest_radical"}, "solution_sketch": "A leg is shorter than the hypotenuse, so divide by $\\sqrt2$, not multiply. Each leg is $\\frac{10}{\\sqrt2}=5\\sqrt2$."},
      {"problem": "A square field has a diagonal path of $100$ m. How long is each side of the field?", "answer": "50sqrt(2)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The path is the hypotenuse of a 45-45-90 triangle. So each side is $\\frac{100}{\\sqrt2}=50\\sqrt2$ m."},
      {"problem": "A $45$-$45$-$90$ triangle has hypotenuse $6\\sqrt{2}$. Find the length of each leg.", "answer": "6", "answer_contract": {"kind": "exact"}, "solution_sketch": "A leg is the hypotenuse divided by $\\sqrt2$. So each leg is $\\frac{6\\sqrt2}{\\sqrt2}=6$."}
    ]},
    {"id": "kp2", "visuals": [{"kind": "special_triangle", "figure": {"shape": "thirty_sixty_ninety", "short_leg": "3"}, "caption": "A 30-60-90 triangle with short leg 3 has long leg 3\u221a3 and hypotenuse 6: the long leg is the short leg times \u221a3, and the hypotenuse is twice the short leg."}], "name": "30-60-90 triangles", "key_prerequisites": ["right-triangle-trig"], "constraints": "30-60-90 triangles, sides in the ratio 1 : √3 : 2; the given side is chosen so the others stay exact; bare triangles, equilateral triangles and measured contexts, both directions", "exemplars": [
      {"problem": "A $30$-$60$-$90$ triangle has a short leg of length $4$. Find its long leg.", "answer": "4sqrt(3)", "answer_contract": {"kind": "required_simplest_radical"}, "solution_sketch": "The long leg is the short leg times $\\sqrt3$. So the long leg is $4\\sqrt3$."},
      {"problem": "A $30$-$60$-$90$ triangle has hypotenuse $16$. Find its long leg.", "answer": "8sqrt(3)", "answer_contract": {"kind": "required_simplest_radical"}, "solution_sketch": "The short leg is half the hypotenuse, $\\frac{16}{2}=8$. The long leg is the short leg times $\\sqrt3$, which is $8\\sqrt3$."},
      {"problem": "A $30$-$60$-$90$ triangle has a long leg of length $6\\sqrt{3}$. Find its hypotenuse.", "answer": "12", "answer_contract": {"kind": "exact"}, "solution_sketch": "The short leg is $\\frac{6\\sqrt3}{\\sqrt3}=6$. The hypotenuse is twice the short leg, so it is $12$."},
      {"problem": "An equilateral triangle has sides of length $10$ cm. How tall is it?", "answer": "5sqrt(3)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The height splits the triangle into two 30-60-90 triangles with hypotenuse $10$ cm and short leg $5$ cm. The height is the long leg, $5\\sqrt3$ cm."},
      {"problem": "A ramp makes an angle of $30^\\circ$ with the ground and its sloping surface is $3.6$ m long. How high does the ramp rise?", "answer": "1.8", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The rise is opposite the $30^\\circ$ angle, so it is the short leg. It is half of the hypotenuse, so it is $\\frac{3.6}{2}=1.8$ m."},
      {"problem": "A wooden set square is a $30$-$60$-$90$ triangle. Its longest edge is $18$ cm. How long is its shortest edge?", "answer": "9", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}, "solution_sketch": "The shortest edge is the short leg, which is half of the hypotenuse. So it is $\\frac{18}{2}=9$ cm."},
      {"problem": "A ladder leans against a wall at an angle of $60^\\circ$ to the ground and reaches $5\\sqrt{3}$ m up the wall. How long is the ladder?", "answer": "10", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The height is the long leg of a 30-60-90 triangle, so the short leg is $\\frac{5\\sqrt3}{\\sqrt3}=5$ m. The ladder is the hypotenuse, which is $2\\cdot5=10$ m."},
      {"problem": "In a $30$-$60$-$90$ triangle the short leg is $7$. What is the length of the hypotenuse?", "answer": "14", "answer_contract": {"kind": "exact"}, "solution_sketch": "The hypotenuse is twice the short leg, not the short leg times $\\sqrt3$. So it is $2\\cdot7=14$."}
    ]}
  ]},
  {"id": "complementary-angle-trig", "name": "Trig Ratios of Complementary Angles", "core": false, "difficulty": 0.6, "drill": false, "answer_kind": "expression", "expected_time_secs": 90, "prerequisites": [{"id": "trig-ratios-definition", "weight": 0.7, "key": true}, {"id": "right-triangle-trig", "weight": 0.4}], "diagnostic_exemplar": {"problem": "In a right triangle with acute angles $A$ and $B$, $\\sin A = \\frac{5}{13}$. Find $\\cos B$.", "answer": "5/13", "solution_sketch": "$A$ and $B$ are complementary, and cosine of one is sine of the other."}, "anki_seeds": [{"front": "sin θ = cos(?)", "back": "cos(90° − θ)", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Sine and cosine swap for complements", "key_prerequisites": ["trig-ratios-definition"], "try_first": {"problem": "In a right triangle with acute angles $A$ and $B$, is the leg opposite $A$ also the leg adjacent to $B$?", "answer_contract": {"kind": "label", "options": [["yes", "yes it is", "yes, it is", "it is", "same side", "yes, same side", "yes, it is the same leg"], ["no", "no it is not", "no, it is not", "it is not"]]}, "answer": "yes", "reveal": "Each acute angle touches the leg that the other acute angle faces. So the sine of one is the cosine of the other."}, "constraints": "acute angles in whole degrees; sin of an angle equals cos of its complement; the answer names the cofunction of 90 minus the angle; bare identities and measured contexts (ladders, rafters)", "exemplars": [
      {"problem": "Find the acute angle $\\alpha$ for which $\\sin20^\\circ=\\cos\\alpha$.", "answer": "70", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The cofunction identity says that the sine of an acute angle equals the cosine of its complement. So $\\sin20^\\circ=\\cos(90^\\circ-20^\\circ)$ and $\\alpha=70^\\circ$."},
      {"problem": "Use a $30$-$60$-$90$ triangle to find the exact value shared by $\\sin30^\\circ$ and $\\cos60^\\circ$.", "answer": "1/2", "answer_contract": {"kind": "exact"}, "solution_sketch": "The short leg is half the hypotenuse. It is opposite $30^\\circ$ and adjacent to $60^\\circ$, so both ratios equal $\\frac12$."},
      {"problem": "Find the acute angle $\\alpha$ for which $\\cos15^\\circ=\\sin\\alpha$.", "answer": "75", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The cofunction identity says that the cosine of an acute angle equals the sine of its complement. So $\\cos15^\\circ=\\sin(90^\\circ-15^\\circ)$ and $\\alpha=75^\\circ$."},
      {"problem": "A ladder leans against a wall and makes an angle of $24^\\circ$ with the wall. The height it reaches is the ladder length times $\\cos24^\\circ$. The same height is the ladder length times $\\sin\\alpha$, where $\\alpha$ is the angle between the ladder and the ground. Find $\\alpha$.", "answer": "66", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The angle with the wall and the angle with the ground are complementary. So $\\alpha=90^\\circ-24^\\circ=66^\\circ$."},
      {"problem": "A right triangle has acute angles $A=48^\\circ$ and $B$. Find $B$ so that $\\sin A=\\cos B$.", "answer": "42", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The acute angles total $90^\\circ$, so $B=90^\\circ-48^\\circ=42^\\circ$. The leg opposite $A$ is adjacent to $B$."},
      {"problem": "A roof rafter makes an angle of $35^\\circ$ with the horizontal beam, so its rise is the rafter length times $\\sin35^\\circ$. The same rise is the rafter length times $\\cos\\beta$, where $\\beta$ is the angle between the rafter and the vertical post. Find $\\beta$.", "answer": "55", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The post and the beam are perpendicular, so $\\beta$ is the complement of $35^\\circ$. Then $\\beta=90^\\circ-35^\\circ=55^\\circ$."},
      {"problem": "What is the acute angle $\\alpha$ for which $\\sin28^\\circ=\\cos\\alpha$?", "answer": "62", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The swap needs the complementary angle, not the same angle. So $\\alpha=90^\\circ-28^\\circ=62^\\circ$."}
    ]},
    {"id": "kp2", "name": "Solve cofunction equations", "key_prerequisites": ["trig-ratios-definition", "right-triangle-trig"], "constraints": "acute angles; answers are whole degrees; equations in an angle expression, bare and in triangles and ladders", "exemplars": [
      {"problem": "If $\\sin25^\\circ=\\cos\\theta$ for an acute angle $\\theta$, find $\\theta$.", "answer": "65", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The sine of an acute angle equals the cosine of its complement. The complement of $25^\\circ$ is $90^\\circ-25^\\circ=65^\\circ$, so $\\theta=65^\\circ$."},
      {"problem": "If $\\cos41^\\circ=\\sin\\theta$ for an acute angle $\\theta$, find $\\theta$.", "answer": "49", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The complement of $41^\\circ$ is $49^\\circ$, so $\\cos41^\\circ=\\sin49^\\circ$. Sine takes each value once on acute angles, so $\\theta=49^\\circ$."},
      {"problem": "For $0^\\circ<\\theta<45^\\circ$, solve $\\sin(2\\theta)=\\cos30^\\circ$.", "answer": "30", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "Since $2\\theta$ is acute, the angles are complementary and $2\\theta=90^\\circ-30^\\circ=60^\\circ$. Dividing both sides by $2$ gives $\\theta=30^\\circ$."},
      {"problem": "For $0^\\circ<\\theta<75^\\circ$, solve $\\sin(\\theta+15^\\circ)=\\cos50^\\circ$.", "answer": "25", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "Both angles are acute, so they are complementary and $\\theta+15^\\circ=90^\\circ-50^\\circ=40^\\circ$. Subtracting $15^\\circ$ gives $\\theta=25^\\circ$."},
      {"problem": "In a right triangle the acute angles are $A=(2x+4)^\\circ$ and $B=(x+20)^\\circ$. Find $x$.", "answer": "22", "answer_contract": {"kind": "exact"}, "solution_sketch": "The two acute angles of a right triangle total $90^\\circ$, so $(2x+4)+(x+20)=90$ and $3x+24=90$. Then $3x=66$ and $x=22$."},
      {"problem": "Two ladders of the same length reach the same height on a wall. The first makes an angle of $3\\theta$ with the ground and the second makes an angle of $36^\\circ$ with the wall. Find $\\theta$.", "answer": "18", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The same height gives $\\sin3\\theta=\\cos36^\\circ$, so the angles are complementary and $3\\theta=90^\\circ-36^\\circ=54^\\circ$. Then $\\theta=18^\\circ$."},
      {"problem": "Two ramps of the same length rise to the same height. The first makes an angle of $(\\theta+8)^\\circ$ with the ground and the second makes an angle of $47^\\circ$ with the vertical. Find $\\theta$.", "answer": "35", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The same rise gives $\\sin(\\theta+8^\\circ)=\\cos47^\\circ$, so the angles are complementary and $\\theta+8^\\circ=90^\\circ-47^\\circ=43^\\circ$. Subtracting $8^\\circ$ gives $\\theta=35^\\circ$."},
      {"problem": "Solve $\\sin(\\theta+20^\\circ)=\\cos44^\\circ$ for acute $\\theta$. What is the value of $\\theta$?", "answer": "26", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The two angles are complementary, not equal. So $\\theta+20^\\circ=90^\\circ-44^\\circ=46^\\circ$ and $\\theta=26^\\circ$."}
    ]},
    {"id": "kp3", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "A"}, {"at": 2, "label": "B"}]}, "caption": "A right triangle. The small square marks the right angle. A and B mark the two acute angles. The side opposite A is adjacent to B, and the side opposite B is adjacent to A."}], "name": "Complementary acute angles in one triangle", "key_prerequisites": ["trig-ratios-definition"], "constraints": "a right triangle whose acute angles are A and B; ratios are Pythagorean-triple fractions; the answer equals the given ratio, or follows from a tangent, from two sides, or from a ladder or ramp", "exemplars": [
      {"problem": "In a right triangle the acute angles are $A$ and $B$. If $\\sin A=\\frac{3}{5}$, find $\\cos B$.", "answer": "3/5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $A+B=90^\\circ$, the cosine of $B$ equals the sine of $A$. So $\\cos B=\\frac35$."},
      {"problem": "In a right triangle with acute angles $A$ and $B$, $\\cos A=\\frac{8}{17}$. Find $\\sin B$.", "answer": "8/17", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $A+B=90^\\circ$, the leg opposite $B$ is the leg adjacent to $A$. So $\\sin B=\\cos A=\\frac{8}{17}$."},
      {"problem": "A $13$ m ladder reaches $12$ m up a wall. It makes an angle $A$ with the ground and an angle $B$ with the wall. Find $\\cos B$.", "answer": "12/13", "answer_contract": {"kind": "exact"}, "solution_sketch": "The height $12$ is opposite $A$ and adjacent to $B$. So $\\cos B=\\frac{12}{13}$, which equals $\\sin A$."},
      {"problem": "A ramp is $25$ m long and rises $7$ m. It makes an angle $A$ with the ground and an angle $B$ with the vertical. Find $\\sin B$.", "answer": "24/25", "answer_contract": {"kind": "exact"}, "solution_sketch": "The run is $\\sqrt{25^2-7^2}=24$ m, and it is opposite $B$. So $\\sin B=\\frac{24}{25}$, which equals $\\cos A$."},
      {"problem": "In a right triangle with acute angles $A$ and $B$, $\\tan A=\\frac{3}{4}$. Find $\\sin B$.", "answer": "4/5", "answer_contract": {"kind": "exact"}, "solution_sketch": "Take legs $3$ and $4$, so the hypotenuse is $5$. Then $\\sin B=\\cos A=\\frac45$."},
      {"problem": "In a right triangle with acute angles $A$ and $B$, $\\sin A=\\frac{8}{17}$. What is the value of $\\sin B$?", "answer": "15/17", "answer_contract": {"kind": "exact"}, "solution_sketch": "The angle $B$ is complementary to $A$, so $\\sin B=\\cos A$. The other leg is $\\sqrt{17^2-8^2}=15$, so $\\sin B=\\frac{15}{17}$."},
      {"problem": "In a right triangle with acute angles $A$ and $B$, $\\cos B=\\frac{21}{29}$. Find $\\sin A$.", "answer": "21/29", "answer_contract": {"kind": "exact"}, "solution_sketch": "Since $A+B=90^\\circ$, the leg opposite $A$ is the leg adjacent to $B$. So $\\sin A=\\cos B=\\frac{21}{29}$."}
    ]}
  ]},
  {"id": "angle-of-elevation-depression", "name": "Angles of Elevation and Depression", "core": false, "difficulty": 0.65, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 150, "prerequisites": [{"id": "solving-right-triangles-sides", "weight": 0.7, "key": true}, {"id": "right-triangle-trig", "weight": 0.5}], "diagnostic_exemplar": {"problem": "From the top of a $40$ m lighthouse the angle of depression to a boat is $\\theta$, and the boat is $40\\sqrt{3}$ m from the foot of the lighthouse. Find $\\theta$.", "answer": "30°", "solution_sketch": "$\\tan\\theta = \\frac{40}{40\\sqrt{3}} = \\frac{1}{\\sqrt{3}}$."}, "anki_seeds": [{"front": "The angle of depression from A to B equals...", "back": "the angle of elevation from B to A (alternate interior angles).", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse. Here \u03b8 is the angle of elevation: it opens upward from the horizontal ground."}], "name": "Angle of elevation problems", "key_prerequisites": ["solving-right-triangles-sides"], "constraints": "give the needed trig value or use a calculator; exact answers where the ratio is supplied, one decimal place otherwise; metric lengths; height, distance and slant length, found by multiplying or by dividing", "exemplars": [
      {"problem": "From a point on level ground $100$ m from the foot of a tower, the angle of elevation of the top is $45^\\circ$. How tall is the tower? Use $\\tan 45^\\circ = 1$.", "answer": "100", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The tower is opposite the angle and the distance is adjacent. So the height is $100\\tan45^\\circ=100\\cdot1=100$ m."},
      {"problem": "A $10$ m ladder leans against a wall at $60^\\circ$ to the ground. How high up the wall does it reach? Use $\\sin 60^\\circ = \\frac{\\sqrt{3}}{2}$.", "answer": "5sqrt(3)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The height is opposite the angle and the ladder is the hypotenuse. So the height is $10\\sin60^\\circ=5\\sqrt3$ m."},
      {"problem": "A tower is $30$ m tall. From a point on level ground the angle of elevation of its top is $30^\\circ$. How far is the point from the foot of the tower? Use $\\tan 30^\\circ = \\frac{\\sqrt{3}}{3}$.", "answer": "30sqrt(3)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The tower is opposite and the distance $d$ is adjacent, so $\\tan30^\\circ=\\frac{30}{d}$. Then $d=\\frac{30}{\\sqrt3/3}=30\\sqrt3$ m."},
      {"problem": "A ladder leans against a wall at $30^\\circ$ to the ground and its top is $6$ m above the ground. How long is the ladder? Use $\\sin 30^\\circ = \\frac{1}{2}$.", "answer": "12", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The height is opposite the angle and the ladder is the hypotenuse, so $\\sin30^\\circ=\\frac{6}{L}$. Then $L=\\frac{6}{1/2}=12$ m."},
      {"problem": "From $60$ m away, the angle of elevation to the top of a mast is $60^\\circ$. How tall is the mast? Use $\\tan 60^\\circ = \\sqrt{3}$.", "answer": "60sqrt(3)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The mast is opposite the angle and the distance is adjacent. So the height is $60\\tan60^\\circ=60\\sqrt3$ m."},
      {"problem": "From a point $18$ m from the foot of a building, the angle of elevation of its top is $62^\\circ$. How tall is the building, to one decimal place?", "answer": "33.9", "answer_contract": {"kind": "approx", "decimals": 1}, "solution_sketch": "The height is opposite the angle and the distance is adjacent. So the height is $18\\tan62^\\circ=33.85\\ldots\\approx33.9$ m."},
      {"problem": "A person stands $40$ m from a tower. The angle of elevation of its top is $30^\\circ$. What is the height of the tower? Use $\\tan 30^\\circ = \\frac{\\sqrt{3}}{3}$.", "answer": "40sqrt(3)/3", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The height is opposite the angle, so it is the distance times the tangent, not the distance divided by it. It is $40\\cdot\\frac{\\sqrt3}{3}=\\frac{40\\sqrt3}{3}$ m."}
    ]},
    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse. The horizontal line of sight from the top is parallel to the ground, so \u03b8 at the bottom has the same size as the angle of depression."}], "name": "Angle of depression problems", "key_prerequisites": ["solving-right-triangles-sides"], "try_first": {"problem": "From the top of a cliff, the angle of depression to a boat is $25^\\circ$. What is the angle of elevation from the boat to the top of the cliff, in degrees?", "answer_contract": {"kind": "exact"}, "answer": "25", "reveal": "The horizontal line at the cliff top and the sea level are parallel, so the two angles are alternate angles and are equal. Both are $25^\\circ$."}, "constraints": "the angle of depression from a height equals the angle of elevation from the ground; the needed trig value is given or a calculator is used (one decimal place); metric lengths; horizontal distance, height and line of sight", "exemplars": [
      {"problem": "From the top of a $50$ m cliff, the angle of depression to a boat is $30^\\circ$. How far is the boat from the foot of the cliff? Use $\\tan 30^\\circ = \\frac{\\sqrt{3}}{3}$.", "answer": "50sqrt(3)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The elevation angle from the boat is also $30^\\circ$, so $\\tan30^\\circ=\\frac{50}{d}$. Then $d=\\frac{50}{\\sqrt3/3}=50\\sqrt3$ m."},
      {"problem": "A plane flies at an altitude of $2000$ m and sights a runway at an angle of depression of $45^\\circ$. How far is the runway from the point on the ground below the plane? Use $\\tan 45^\\circ = 1$.", "answer": "2000", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The angle of elevation from the runway is $45^\\circ$, so $\\tan45^\\circ=\\frac{2000}{d}$. Then $d=2000$ m."},
      {"problem": "From the top of a $90$ m cliff, the angle of depression to a buoy is $60^\\circ$. How far is the buoy from the foot of the cliff? Use $\\tan 60^\\circ = \\sqrt{3}$.", "answer": "30sqrt(3)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The elevation angle from the buoy is $60^\\circ$, so $\\tan60^\\circ=\\frac{90}{d}$. Then $d=\\frac{90}{\\sqrt3}=30\\sqrt3$ m."},
      {"problem": "From the top of a $40$ m cliff, the angle of depression to a boat is $30^\\circ$. How far is the boat from the cliff top, measured along the line of sight? Use $\\sin 30^\\circ = \\frac{1}{2}$.", "answer": "80", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The cliff is opposite the $30^\\circ$ angle and the line of sight is the hypotenuse, so $\\sin30^\\circ=\\frac{40}{L}$. Then $L=\\frac{40}{1/2}=80$ m."},
      {"problem": "A lookout watches a boat that is $120$ m from the foot of the lookout tower. The angle of depression to the boat is $30^\\circ$. How high is the lookout above the water? Use $\\tan 30^\\circ = \\frac{\\sqrt{3}}{3}$.", "answer": "40sqrt(3)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The height is opposite the angle and the distance is adjacent. So the height is $120\\tan30^\\circ=120\\cdot\\frac{\\sqrt3}{3}=40\\sqrt3$ m."},
      {"problem": "A drone hovers $80$ m above level ground. The angle of depression to a car is $60^\\circ$. How far is the car from the point on the ground below the drone? Use $\\tan 60^\\circ = \\sqrt{3}$.", "answer": "80sqrt(3)/3", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The elevation angle from the car is $60^\\circ$, so $\\tan60^\\circ=\\frac{80}{d}$. Then $d=\\frac{80}{\\sqrt3}=\\frac{80\\sqrt3}{3}$ m."},
      {"problem": "The angle of depression from the top of a cliff to a boat is $30^\\circ$. What is the angle of elevation from the boat to the top of the cliff?", "answer": "30", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The horizontals at the cliff top and at the boat are parallel, so the alternate angles are equal. The angle of elevation is $30^\\circ$, not $90^\\circ-30^\\circ$."},
      {"problem": "From a window $12$ m above the ground, the angle of depression to a parked car is $28^\\circ$. How far is the car from the foot of the building, to one decimal place?", "answer": "22.6", "answer_contract": {"kind": "approx", "decimals": 1}, "solution_sketch": "The elevation angle from the car is $28^\\circ$, so $\\tan28^\\circ=\\frac{12}{d}$. Then $d=\\frac{12}{\\tan28^\\circ}=22.57\\ldots\\approx22.6$ m."}
    ]},
    {"id": "kp3", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Find the angle", "key_prerequisites": ["right-triangle-trig"], "constraints": "both sides fixing the angle are given; the tangent is an exact special value (1, √3 or √3/3) giving 30, 45 or 60 degrees, or a calculator value is rounded to one decimal place; angles of elevation and depression", "exemplars": [
      {"problem": "A $30$ m tree casts a shadow $30$ m long on level ground. Find the angle of elevation of the sun.", "answer": "45", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The tree is opposite and the shadow is adjacent, so $\\tan\\theta=\\frac{30}{30}=1$. Then $\\theta=45^\\circ$."},
      {"problem": "A ramp rises $5$ m over a horizontal run of $5\\sqrt{3}$ m. Find the angle it makes with the ground.", "answer": "30", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The rise is opposite and the run is adjacent, so $\\tan\\theta=\\frac{5}{5\\sqrt3}=\\frac{\\sqrt3}{3}$. Then $\\theta=30^\\circ$."},
      {"problem": "A flagpole $9\\sqrt{3}$ m tall casts a shadow $9$ m long. Find the angle of elevation of the sun.", "answer": "60", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The flagpole is opposite and the shadow is adjacent, so $\\tan\\theta=\\frac{9\\sqrt3}{9}=\\sqrt3$. Then $\\theta=60^\\circ$."},
      {"problem": "A road rises $1$ m over a horizontal distance of $12$ m. Find the angle of the road with the horizontal, to one decimal place.", "answer": "4.8", "answer_contract": {"kind": "approx", "decimals": 1}, "solution_sketch": "The rise is opposite and the horizontal distance is adjacent, so $\\tan\\theta=\\frac{1}{12}$. Then $\\theta=\\tan^{-1}\\left(\\frac{1}{12}\\right)=4.76\\ldots\\approx4.8^\\circ$."},
      {"problem": "From the top of a $45$ m lighthouse, a boat is $120$ m from the foot of the lighthouse. Find the angle of depression to the boat, to one decimal place.", "answer": "20.6", "answer_contract": {"kind": "approx", "decimals": 1}, "solution_sketch": "The angle of depression equals the angle of elevation from the boat, so $\\tan\\theta=\\frac{45}{120}=0.375$. Then $\\theta=20.55\\ldots\\approx20.6^\\circ$."},
      {"problem": "A $6$ m pole casts a shadow $6\\sqrt{3}$ m long. What is the angle of elevation of the sun?", "answer": "30", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The pole is opposite the angle, so it is the numerator: $\\tan\\theta=\\frac{6}{6\\sqrt3}=\\frac{\\sqrt3}{3}$. Then $\\theta=30^\\circ$."},
      {"problem": "A student $1.8$ m tall casts a shadow $2.4$ m long. Find the angle of elevation of the sun, to one decimal place.", "answer": "36.9", "answer_contract": {"kind": "approx", "decimals": 1}, "solution_sketch": "The student is opposite and the shadow is adjacent, so $\\tan\\theta=\\frac{1.8}{2.4}=0.75$. Then $\\theta=36.86\\ldots\\approx36.9^\\circ$."}
    ]}
  ]},
  {"id": "trig-applications", "name": "Right-Triangle Trigonometry Applications", "core": false, "difficulty": 0.75, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 240, "prerequisites": [{"id": "angle-of-elevation-depression", "weight": 0.7, "key": true}, {"id": "right-triangle-trig", "weight": 0.5, "key": true}, {"id": "special-right-triangles", "weight": 0.3}, {"id": "multi-step-equations", "weight": 0.2}], "diagnostic_exemplar": {"problem": "From a point on level ground the angle of elevation to the top of a mast is $30^\\circ$; from a point $20$ m closer it is $60^\\circ$. Find the height of the mast. Use $\\tan 30^\\circ = \\frac{\\sqrt{3}}{3}$ and $\\tan 60^\\circ = \\sqrt{3}$.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m"}, "answer": "10√3 m", "solution_sketch": "With $d$ the far distance, $d = h\\sqrt{3}$ and $d - 20 = \\frac{h}{\\sqrt{3}}$; eliminating $d$ gives $\\frac{2h}{\\sqrt{3}} = 20$."}, "anki_seeds": [{"front": "Choosing the trig ratio in an application: pick the ratio that links...", "back": "the known side and the wanted side — sin = opp/hyp, cos = adj/hyp, tan = opp/adj (SOH-CAH-TOA).", "type": "basic"}, {"front": "The angle of depression from A down to B equals...", "back": "the angle of elevation from B up to A (alternate angles with the horizontal).", "type": "basic"}, {"front": "To find an angle from two known sides, use...", "back": "an inverse trig function, e.g. θ = tan⁻¹(opposite/adjacent).", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Distances via trig ratios", "key_prerequisites": ["right-triangle-trig", "special-right-triangles"], "constraints": "one right triangle in a metric context; the needed trig value is given, or the sides form a Pythagorean triple, or a calculator value is rounded to one decimal place; exact answers otherwise; multiplying and dividing contexts", "exemplars": [
      {"problem": "A ramp rises $3$ m over a horizontal run of $4$ m. How long is the ramp?", "answer": "5", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The ramp is the hypotenuse of a right triangle with legs $3$ and $4$. So its length is $\\sqrt{3^2+4^2}=5$ m."},
      {"problem": "A kite string is $50$ m long and makes an angle of $30^\\circ$ with the ground. How high is the kite? Use $\\sin 30^\\circ = \\frac{1}{2}$.", "answer": "25", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The height is opposite the angle and the string is the hypotenuse. So the height is $50\\sin30^\\circ=50\\cdot\\frac12=25$ m."},
      {"problem": "A guy wire runs from the top of a $9$ m pole to a point $12$ m from its base. How long is the wire?", "answer": "15", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The wire is the hypotenuse of a right triangle with legs $9$ and $12$. Its length is $\\sqrt{81+144}=\\sqrt{225}=15$ m."},
      {"problem": "A slide is $16$ m long and makes an angle of $60^\\circ$ with the ground. What is its horizontal run? Use $\\cos 60^\\circ = \\frac{1}{2}$.", "answer": "8", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The run is adjacent to the angle and the slide is the hypotenuse. So the run is $16\\cos60^\\circ=16\\cdot\\frac12=8$ m."},
      {"problem": "A zip line starts $12$ m up a tower and slopes at $30^\\circ$ to the horizontal down to the ground. How long is the zip line? Use $\\sin 30^\\circ = \\frac{1}{2}$.", "answer": "24", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The height $12$ is opposite the angle and the zip line is the hypotenuse, so $\\sin30^\\circ=\\frac{12}{L}$. Then $L=\\frac{12}{1/2}=24$ m."},
      {"problem": "A rectangular television screen is $80$ cm wide and $60$ cm tall. How long is its diagonal?", "answer": "100", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}, "solution_sketch": "The diagonal is the hypotenuse of a right triangle with legs $80$ and $60$. It is $\\sqrt{6400+3600}=\\sqrt{10000}=100$ cm."},
      {"problem": "A ladder makes an angle of $72^\\circ$ with the ground and its foot is $1.5$ m from the wall. How long is the ladder, to one decimal place?", "answer": "4.9", "answer_contract": {"kind": "approx", "decimals": 1}, "solution_sketch": "The distance $1.5$ is adjacent to the angle and the ladder is the hypotenuse, so $\\cos72^\\circ=\\frac{1.5}{L}$. Then $L=\\frac{1.5}{\\cos72^\\circ}=4.85\\ldots\\approx4.9$ m."},
      {"problem": "A kite is $20$ m above the ground and its string makes an angle of $30^\\circ$ with the ground. What is the length of the string? Use $\\sin 30^\\circ = \\frac{1}{2}$.", "answer": "40", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The height is opposite the angle, so $\\sin30^\\circ=\\frac{20}{L}$ and the string is longer than the height. Then $L=\\frac{20}{1/2}=40$ m."}
    ]},
    {"id": "kp2", "name": "Multi-step problems", "key_prerequisites": ["angle-of-elevation-depression"], "constraints": "two right triangles sharing a side, or a triangle needing Pythagoras before a ratio; exact answers, radicals allowed; one answer per question", "exemplars": [
      {"problem": "A $26$ m guy wire is anchored $24$ m from the base of a tower on level ground. Find the tangent of the angle the wire makes with the ground.", "answer": "5/12", "answer_contract": {"kind": "exact"}, "solution_sketch": "The height is $\\sqrt{26^2-24^2}=10$ m. The tangent is opposite over adjacent, so $\\tan\\theta=\\frac{10}{24}=\\frac{5}{12}$."},
      {"problem": "From a point, the angle of elevation to the top of a building is $45^\\circ$. From a point $20$ m closer, it is $60^\\circ$. How tall is the building? Use $\\tan 60^\\circ = \\sqrt{3}$.", "answer": "30+10sqrt(3)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The far distance is $d=h$ and the near distance is $d-20=\\frac{h}{\\sqrt3}$. Then $h-\\frac{h}{\\sqrt3}=20$, so $h=\\frac{20\\sqrt3}{\\sqrt3-1}=30+10\\sqrt3$ m."},
      {"problem": "A $25$ m guy wire runs from the top of a tower to an anchor $15$ m from the base of the tower. How tall is the tower?", "answer": "20", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The wire is the hypotenuse and the height is a leg. So the height is $\\sqrt{25^2-15^2}=\\sqrt{400}=20$ m."},
      {"problem": "A $17$ m ladder reaches $15$ m up a wall. Find the cosine of the angle the ladder makes with the ground.", "answer": "8/17", "answer_contract": {"kind": "exact"}, "solution_sketch": "The foot is $\\sqrt{17^2-15^2}=8$ m from the wall. The foot distance is adjacent to the angle, so $\\cos\\theta=\\frac{8}{17}$."},
      {"problem": "A $20$ m ladder leans at $60^\\circ$ to the ground. A second ladder reaches the same height on the same wall at $45^\\circ$. How long is the second ladder? Use $\\sin 60^\\circ = \\frac{\\sqrt{3}}{2}$ and $\\sin 45^\\circ = \\frac{\\sqrt{2}}{2}$.", "answer": "10sqrt(6)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The shared height is $20\\sin60^\\circ=10\\sqrt3$ m. The second ladder is $\\frac{10\\sqrt3}{\\sqrt2/2}=10\\sqrt6$ m."},
      {"problem": "From a point on level ground the angle of elevation of the top of a pylon is $30^\\circ$. From a point $40$ m closer it is $45^\\circ$. How tall is the pylon? Use $\\tan 30^\\circ = \\frac{\\sqrt{3}}{3}$.", "answer": "20+20sqrt(3)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The far distance is $h\\sqrt3$ and the near distance is $h$. Their difference is $h(\\sqrt3-1)=40$, so $h=\\frac{40}{\\sqrt3-1}=20+20\\sqrt3$ m."},
      {"problem": "A lighthouse is $45$ m tall. From a ship the angle of elevation of its top is $30^\\circ$. The ship sails straight towards the lighthouse until the angle is $60^\\circ$. How far does it sail? Use $\\tan 30^\\circ = \\frac{\\sqrt{3}}{3}$ and $\\tan 60^\\circ = \\sqrt{3}$.", "answer": "30sqrt(3)", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}, "solution_sketch": "The first distance is $\\frac{45}{\\tan30^\\circ}=45\\sqrt3$ m and the second is $\\frac{45}{\\tan60^\\circ}=15\\sqrt3$ m. The ship sails $45\\sqrt3-15\\sqrt3=30\\sqrt3$ m."},
      {"problem": "A $13$ m ladder reaches $12$ m up a wall. How far is the foot from the wall?", "answer": "5", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}, "solution_sketch": "The ladder is the hypotenuse, so the lengths cannot simply be subtracted. The distance is $\\sqrt{13^2-12^2}=\\sqrt{25}=5$ m."}
    ]},
    {"id": "kp3", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Solve for angles in context", "key_prerequisites": ["right-triangle-trig", "angle-of-elevation-depression"], "constraints": "the two sides that fix the angle are given; exact special angles, or a calculator value rounded to one decimal place; ladders, ramps, roads and wires", "exemplars": [
      {"problem": "A $10$ m ladder reaches $5$ m up a wall. Find the angle the ladder makes with the ground.", "answer": "30", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The height is opposite the angle and the ladder is the hypotenuse, so $\\sin\\theta=\\frac{5}{10}=\\frac12$. Then $\\theta=30^\\circ$."},
      {"problem": "A road rises $8$ m for every $100$ m of horizontal distance. Find the angle of the road with the horizontal, to one decimal place.", "answer": "4.6", "answer_contract": {"kind": "approx", "decimals": 1}, "solution_sketch": "The rise is opposite and the horizontal distance is adjacent, so $\\tan\\theta=0.08$. Then $\\theta=4.57\\ldots\\approx4.6^\\circ$."},
      {"problem": "A $12$ m ladder reaches $6\\sqrt{3}$ m up a wall. Find the angle the ladder makes with the ground.", "answer": "60", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The height is opposite the angle and the ladder is the hypotenuse, so $\\sin\\theta=\\frac{6\\sqrt3}{12}=\\frac{\\sqrt3}{2}$. Then $\\theta=60^\\circ$."},
      {"problem": "A path rises $5$ m over a slope length of $5\\sqrt{2}$ m. Find the angle of the path with the horizontal.", "answer": "45", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The rise is opposite the angle and the slope length is the hypotenuse, so $\\sin\\theta=\\frac{5}{5\\sqrt2}=\\frac{\\sqrt2}{2}$. Then $\\theta=45^\\circ$."},
      {"problem": "A ramp is $14$ m long and has a horizontal run of $7\\sqrt{3}$ m. Find the angle the ramp makes with the ground.", "answer": "30", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The run is adjacent and the ramp is the hypotenuse, so $\\cos\\theta=\\frac{7\\sqrt3}{14}=\\frac{\\sqrt3}{2}$. Then $\\theta=30^\\circ$."},
      {"problem": "A $15$ m ladder has its foot $4$ m from a wall. Find the angle the ladder makes with the ground, to one decimal place.", "answer": "74.5", "answer_contract": {"kind": "approx", "decimals": 1}, "solution_sketch": "The foot distance is adjacent and the ladder is the hypotenuse, so $\\cos\\theta=\\frac{4}{15}$. Then $\\theta=74.5\\ldots\\approx74.5^\\circ$."},
      {"problem": "A $16$ m ladder reaches $8$ m up a wall. What is the angle between the ladder and the ground?", "answer": "30", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}, "solution_sketch": "The height $8$ is opposite the angle, so the ratio is a sine: $\\sin\\theta=\\frac{8}{16}=\\frac12$. Then $\\theta=30^\\circ$."}
    ]}
  ]},
  {"id": "radians-degrees", "name": "Radians and Degrees", "core": true, "difficulty": 0.5, "drill": false, "answer_kind": "numeric", "expected_time_secs": 90, "prerequisites": [{"id": "ratios-proportions", "weight": 0.5, "key": true}, {"id": "multiplying-fractions", "weight": 0.4}, {"id": "equivalent-fractions", "weight": 0.3}, {"id": "fraction-decimal-conversion", "weight": 0.2}], "diagnostic_exemplar": {"problem": "Convert $30^\\circ$ to radians.", "answer": "π/6", "solution_sketch": "Multiply by $\\frac{\\pi}{180}$: $\\frac{30\\pi}{180} = \\frac{\\pi}{6}$."}, "anki_seeds": [{"front": "To convert degrees to radians, multiply by...", "back": "π/180", "type": "basic"}, {"front": "To convert radians to degrees, multiply by...", "back": "180/π", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Convert degrees to radians", "key_prerequisites": ["ratios-proportions"], "try_first": {"problem":"A full turn measures $360^\\circ$, which is also $2\\pi$ radians. How many radians is a half-turn?","answer_contract":{"kind":"exact"},"answer":"pi","reveal":"Half of $2\\pi$ is $\\pi$, so $180^\\circ=\\pi$ radians. Every conversion between degrees and radians scales by this one fact."}, "constraints": "multiply degrees by π/180; angles may be negative or larger than one turn; contexts include sweeps, clocks and rotation rates", "exemplars": [
        {"problem":"Convert $150^\\circ$ to radians.","answer":"5*pi/6","solution_sketch":"A half-turn is $180^\\circ$ and $\\pi$ radians, so multiply the degrees by $\\pi/180$. Then $150\\pi/180=5\\pi/6$ radians.","answer_contract":{"kind":"exact"}},
        {"problem":"A gymnast's twist turns her through $225^\\circ$. How many radians is that?","answer":"5*pi/4","solution_sketch":"Multiply the degrees by $\\pi/180$ to get radians. Then $225\\pi/180$ reduces to $5\\pi/4$ radians, because $225$ and $180$ share the factor $45$.","answer_contract":{"kind":"exact"}},
        {"problem":"Convert $-120^\\circ$ to radians.","answer":"-2*pi/3","solution_sketch":"The minus sign marks a clockwise turn, and it stays in the answer. Then $-120\\pi/180=-2\\pi/3$ radians.","answer_contract":{"kind":"exact"}},
        {"problem":"A lawn sprinkler sweeps an arc of $72^\\circ$. What is the size of that arc in radians?","answer":"2*pi/5","solution_sketch":"Multiply by $\\pi/180$ to get $72\\pi/180$. Both $72$ and $180$ divide by $36$, so the arc is $2\\pi/5$ radians.","answer_contract":{"kind":"exact"}},
        {"problem":"Convert $540^\\circ$ to radians.","answer":"3*pi","solution_sketch":"Multiply by $\\pi/180$: $540\\pi/180=3\\pi$. This is one and a half full turns, because a full turn is $2\\pi$.","answer_contract":{"kind":"exact"}},
        {"problem":"In $10$ minutes, the minute hand of a clock turns through part of a full turn. How many radians is that?","answer":"pi/3","solution_sketch":"A full turn takes $60$ minutes and measures $2\\pi$ radians. The hand turns $10/60=1/6$ of a full turn, which is $2\\pi/6=\\pi/3$ radians.","answer_contract":{"kind":"exact"}},
        {"problem":"Change $36^\\circ$ to radians. What is the angle in radians?","answer":"pi/5","solution_sketch":"To get radians, multiply by $\\pi/180$, not by $180/\\pi$. Then $36\\pi/180=\\pi/5$ radians.","answer_contract":{"kind":"exact"}},
        {"problem":"The Earth turns through $15^\\circ$ each hour. How many radians does it turn through in one hour?","answer":"pi/12","solution_sketch":"Multiply by $\\pi/180$: $15\\pi/180$. Since $180\\div15=12$, the Earth turns through $\\pi/12$ radians each hour.","answer_contract":{"kind":"exact"}}
    ]},
    {"id": "kp2", "name": "Convert radians to degrees", "key_prerequisites": ["multiplying-fractions"], "constraints": "multiply radians by 180/π; inputs are rational multiples of π; answers in degrees, or a time when a rotation rate is given; one verdict item compares radians with degrees", "exemplars": [
        {"problem":"Convert $3\\pi/4$ radians to degrees.","answer":"135","solution_sketch":"Multiply by $180/\\pi$ so that the factors of $\\pi$ cancel. Then $(3\\pi/4)(180/\\pi)=3\\cdot45=135$ degrees.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A robot arm swings through $2\\pi/3$ radians. Through how many degrees does it swing?","answer":"120","solution_sketch":"Multiply by $180/\\pi$: $(2\\pi/3)(180/\\pi)=2\\cdot60=120$. The factors of $\\pi$ cancel, so the arm swings through $120^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Convert $-5\\pi/6$ radians to degrees.","answer":"-150","solution_sketch":"Multiply by $180/\\pi$: $-5\\cdot180/6=-5\\cdot30=-150$. The minus sign shows a clockwise turn, so it stays.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A lighthouse beam sweeps through $7\\pi/12$ radians. How many degrees is that?","answer":"105","solution_sketch":"Multiply by $180/\\pi$: $7\\cdot180/12=7\\cdot15=105$. The factors of $\\pi$ cancel, so the beam sweeps through $105^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Convert $3\\pi$ radians to degrees.","answer":"540","solution_sketch":"Multiply by $180/\\pi$: $3\\cdot180=540$. This is one and a half full turns.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A wind-turbine blade turns $\\pi/4$ radians every second. How many seconds does one full turn of $360^\\circ$ take?","answer":"8","solution_sketch":"One full turn is $2\\pi$ radians. The blade turns $\\pi/4$ radians each second, so one turn takes $2\\pi\\div(\\pi/4)=8$ seconds.","answer_contract":{"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}},
        {"problem":"Change $\\pi/5$ radians to degrees. What is the angle in degrees?","answer":"36","solution_sketch":"To get degrees, multiply by $180/\\pi$, not by $\\pi/180$. Then $(\\pi/5)(180/\\pi)=180/5=36$ degrees.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A turntable turns through $\\pi/3$ radians every second. Through how many degrees does it turn in $5$ seconds?","answer":"300","solution_sketch":"In $5$ seconds the turntable turns through $5\\pi/3$ radians. Multiply by $180/\\pi$ to get $5\\cdot60=300$ degrees.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Which is the larger angle, $2$ radians or $100^\\circ$?","answer":"2 radians","solution_sketch":"Convert $2$ radians to degrees: $2\\cdot180/\\pi$ is about $114.6^\\circ$. That is more than $100^\\circ$, so $2$ radians is the larger angle.","answer_contract":{"kind":"label","options":[["2 radians","2 rad","2","two radians","the radian one"],["100 degrees","100°","100","100 deg","the degree one"]]}}
    ]}
  ]},
  {"id": "coterminal-angles", "name": "Standard Position and Coterminal Angles", "core": true, "difficulty": 0.55, "drill": false, "answer_kind": "numeric", "expected_time_secs": 90, "prerequisites": [{"id": "radians-degrees", "weight": 0.7, "key": true}, {"id": "coordinate-plane", "weight": 0.4}, {"id": "integer-addition-subtraction", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Find the angle in $[0, 2\\pi)$ coterminal with $-\\frac{2\\pi}{3}$.", "answer": "4π/3", "solution_sketch": "Add one full turn: $-\\frac{2\\pi}{3} + \\frac{6\\pi}{3} = \\frac{4\\pi}{3}$."}, "anki_seeds": [{"front": "Coterminal angles differ by...", "back": "a whole-number multiple of 360° (2π radians).", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Quadrant of an angle in standard position", "key_prerequisites": ["radians-degrees","coordinate-plane"], "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "120", "ray_length": "3", "label": "120\u00b0"}, "caption": "120\u00b0 in standard position lands in Quadrant II."}], "constraints": "angles in degrees or radians, negative angles, angles beyond one turn, and rays on an axis; the answer is a quadrant or no quadrant; several items ask which of three given angles ends in a named quadrant or on an axis", "exemplars": [
        {"problem":"In which quadrant does $135^\\circ$ terminate?","answer":"quadrant 2","solution_sketch":"The angle satisfies $90^\\circ<135^\\circ<180^\\circ$. So the terminal ray lies in Quadrant II, which is quadrant $2$.","answer_contract":{"kind":"label","options":[["quadrant 1","1","i","quadrant i","first quadrant","q1","the first quadrant","1st quadrant"],["quadrant 2","2","ii","quadrant ii","second quadrant","q2","the second quadrant","2nd quadrant"],["quadrant 3","3","iii","quadrant iii","third quadrant","q3","the third quadrant","3rd quadrant"],["quadrant 4","4","iv","quadrant iv","fourth quadrant","q4","the fourth quadrant","4th quadrant"],["no quadrant","none","on an axis","on the axis","axis","on the x-axis","on the y-axis","no quadrants"]]}},
        {"problem":"A robot starts facing east, along the positive $x$-axis, and turns clockwise through $60^\\circ$. In which quadrant is it then facing?","answer":"quadrant 4","solution_sketch":"A clockwise turn from east points below the $x$-axis and to the right. The robot faces Quadrant IV, which is quadrant $4$.","answer_contract":{"kind":"label","options":[["quadrant 1","1","i","quadrant i","first quadrant","q1","the first quadrant","1st quadrant"],["quadrant 2","2","ii","quadrant ii","second quadrant","q2","the second quadrant","2nd quadrant"],["quadrant 3","3","iii","quadrant iii","third quadrant","q3","the third quadrant","3rd quadrant"],["quadrant 4","4","iv","quadrant iv","fourth quadrant","q4","the fourth quadrant","4th quadrant"],["no quadrant","none","on an axis","on the axis","axis","on the x-axis","on the y-axis","no quadrants"]]}},
        {"problem":"Which of the angles $\\pi/3$, $7\\pi/6$ and $11\\pi/6$ terminates in Quadrant III?","answer":"7*pi/6","solution_sketch":"Quadrant III holds the angles between $\\pi$ and $3\\pi/2$. Only $7\\pi/6$ lies in that range, because $\\pi/3$ is below $\\pi/2$ and $11\\pi/6$ is above $3\\pi/2$.","answer_contract":{"kind":"exact"}},
        {"problem":"A marker starts on the positive $x$-axis of a merry-go-round and turns counterclockwise. After a turn of $400^\\circ$, $500^\\circ$ or $700^\\circ$, exactly one position is in Quadrant I. Which turn is it?","answer":"400","solution_sketch":"Remove one full turn from $400^\\circ$ to get $40^\\circ$, which is in Quadrant I. The turns $500^\\circ$ and $700^\\circ$ leave $140^\\circ$ and $340^\\circ$, which are in Quadrants II and IV.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Which of the angles $100^\\circ$, $200^\\circ$ and $270^\\circ$ terminates on an axis?","answer":"270","solution_sketch":"The ray at $270^\\circ$ points straight down, along the negative $y$-axis, so it is in no quadrant. The rays at $100^\\circ$ and $200^\\circ$ are in Quadrants II and III.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Which of $60^\\circ$, $210^\\circ$ and $330^\\circ$ is in the same quadrant as $-150^\\circ$?","answer":"210","solution_sketch":"A negative angle turns clockwise, so add a full turn: $-150+360=210$. The ray at $210^\\circ$ is in Quadrant III, so $210^\\circ$ is the angle in the quadrant of $-150^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Which of the angles $5\\pi/6$, $4\\pi/3$ and $11\\pi/6$ terminates in Quadrant IV?","answer":"11*pi/6","solution_sketch":"In sixths of $\\pi$, Quadrant IV lies between $9\\pi/6$ and $12\\pi/6$. Only $11\\pi/6$ is in that range, because $5\\pi/6$ is in Quadrant II and $4\\pi/3=8\\pi/6$ is in Quadrant III.","answer_contract":{"kind":"exact"}}
    ]},
    {"id": "kp2", "name": "Coterminal angles in degrees", "key_prerequisites": ["integer-addition-subtraction"], "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "400", "ray_length": "3", "label": "400\u00b0 (= 40\u00b0 + 360\u00b0)"}, "caption": "400\u00b0 is coterminal with 40\u00b0, one full turn further."}], "try_first": {"problem":"A marker sits at $50^\\circ$ on a wheel. The wheel then turns through exactly one full turn. At what angle in $[0^\\circ,360^\\circ)$ is the marker now?","answer_contract":{"kind":"exact"},"answer":"50","reveal":"One full turn brings every ray back to itself, so $50^\\circ$ and $410^\\circ$ are the same ray. Coterminal angles differ by a whole number of full turns."}, "constraints": "degrees; remove or add whole turns; answers lie in [0°, 360°)", "exemplars": [
        {"problem":"Find the angle in $[0^\\circ,360^\\circ)$ that is coterminal with $-45^\\circ$.","answer":"315","solution_sketch":"Add one full turn: $-45+360=315$. The angle $315^\\circ$ lies in $[0^\\circ,360^\\circ)$, so it is the answer.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A wheel turns through $400^\\circ$ counterclockwise from its starting position. At what angle in $[0^\\circ,360^\\circ)$ does its marker point?","answer":"40","solution_sketch":"Remove the complete turn: $400-360=40$. The marker points at $40^\\circ$, which is in the required interval.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Find the angle in $[0^\\circ,360^\\circ)$ that is coterminal with $780^\\circ$.","answer":"60","solution_sketch":"Remove two complete turns: $780-2\\cdot360=60$. The result lies in $[0^\\circ,360^\\circ)$, so it is the answer.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A dial pointer starts on the positive $x$-axis and turns clockwise through $480^\\circ$. At what counterclockwise angle in $[0^\\circ,360^\\circ)$ does it end?","answer":"240","solution_sketch":"Clockwise means $-480^\\circ$. Add two full turns: $-480+720=240$, which is in $[0^\\circ,360^\\circ)$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Find the angle in $[0^\\circ,360^\\circ)$ that is coterminal with $1250^\\circ$.","answer":"170","solution_sketch":"Remove three complete turns: $1250-3\\cdot360=1250-1080=170$. The angle $170^\\circ$ lies in $[0^\\circ,360^\\circ)$, so it is the answer.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A fan-blade marker starts on the positive $x$-axis. The blade turns through $1260^\\circ$ in $4$ seconds at a steady rate. At what angle in $[0^\\circ,360^\\circ)$ does the marker point after $3$ seconds?","answer":"225","solution_sketch":"The blade turns $1260\\div4=315$ degrees each second, so after $3$ seconds it has turned $945^\\circ$. Then $945-2\\cdot360=225$, which is in $[0^\\circ,360^\\circ)$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"What angle in $[0^\\circ,360^\\circ)$ is coterminal with $-100^\\circ$?","answer":"260","solution_sketch":"The direction matters, because a clockwise turn ends on a different ray. Add one full turn: $-100+360=260$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}}
    ]},
    {"id": "kp3", "name": "Coterminal angles in radians", "key_prerequisites": ["radians-degrees"], "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "390", "ray_length": "3", "label": "13\u03c0/6"}, "caption": "390\u00b0, or 13\u03c0/6 radians, is coterminal with \u03c0/6."}], "constraints": "radians; remove or add whole turns; inputs are simple multiples of π/6, π/4 and π/3; answers lie in [0, 2π)", "exemplars": [
        {"problem":"Find the angle in $[0,2\\pi)$ that is coterminal with $9\\pi/4$.","answer":"pi/4","solution_sketch":"Subtract one full turn, $2\\pi=8\\pi/4$: $9\\pi/4-8\\pi/4=\\pi/4$. The result is in $[0,2\\pi)$, so it is the answer.","answer_contract":{"kind":"exact"}},
        {"problem":"A turntable marker starts on the positive $x$-axis and turns clockwise through $\\pi/4$ radians. Which angle in $[0,2\\pi)$ gives its new direction?","answer":"7*pi/4","solution_sketch":"Clockwise means $-\\pi/4$. Add one full turn, $8\\pi/4$, to get $7\\pi/4$, which is in $[0,2\\pi)$.","answer_contract":{"kind":"exact"}},
        {"problem":"Find the angle in $[0,2\\pi)$ that is coterminal with $-5\\pi/6$.","answer":"7*pi/6","solution_sketch":"Add one full turn, $2\\pi=12\\pi/6$: $-5\\pi/6+12\\pi/6=7\\pi/6$. This is in $[0,2\\pi)$, so it is the answer.","answer_contract":{"kind":"exact"}},
        {"problem":"Find the angle in $[0,2\\pi)$ that is coterminal with $19\\pi/3$.","answer":"pi/3","solution_sketch":"One turn is $6\\pi/3$, so three turns are $18\\pi/3$. Subtract them: $19\\pi/3-18\\pi/3=\\pi/3$, which is in $[0,2\\pi)$.","answer_contract":{"kind":"exact"}},
        {"problem":"Find the angle in $[0,2\\pi)$ that is coterminal with $-13\\pi/4$.","answer":"3*pi/4","solution_sketch":"One turn is $8\\pi/4$, and two turns are $16\\pi/4$. Add two turns: $-13\\pi/4+16\\pi/4=3\\pi/4$.","answer_contract":{"kind":"exact"}},
        {"problem":"A wheel turns through $7\\pi/2$ radians from its starting ray. Which angle in $[0,2\\pi)$ gives the direction where it stops?","answer":"3*pi/2","solution_sketch":"One full turn is $4\\pi/2$. Subtract it from the angle: $7\\pi/2-4\\pi/2=3\\pi/2$, which is in $[0,2\\pi)$.","answer_contract":{"kind":"exact"}},
        {"problem":"A wheel marker starts on the positive $x$-axis and turns at $5\\pi/6$ radians per second for $5$ seconds. Which angle in $[0,2\\pi)$ gives its direction at the end?","answer":"pi/6","solution_sketch":"The marker turns $5\\cdot5\\pi/6=25\\pi/6$ radians. Subtract two turns, $24\\pi/6$, to get $\\pi/6$.","answer_contract":{"kind":"exact"}},
        {"problem":"A gear turns through $22\\pi/3$ radians in $2$ seconds at a steady rate. Its marker starts on the positive $x$-axis. Which angle in $[0,2\\pi)$ gives the direction of the marker after $1$ second?","answer":"5*pi/3","solution_sketch":"In $1$ second the gear turns $(22\\pi/3)\\div2=11\\pi/3$ radians. Subtract one turn, $6\\pi/3$, to get $5\\pi/3$, which is in $[0,2\\pi)$.","answer_contract":{"kind":"exact"}}
    ]}
  ]},
  {"id": "reference-angles", "name": "Reference Angles", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "numeric", "expected_time_secs": 90, "prerequisites": [{"id": "coterminal-angles", "weight": 0.7, "key": true}, {"id": "radians-degrees", "weight": 0.5}], "diagnostic_exemplar": {"problem": "Find the reference angle of $-\\frac{7\\pi}{6}$.", "answer": "π/6", "solution_sketch": "Adding $2\\pi$ lands on $\\frac{5\\pi}{6}$ in Quadrant II, whose reference angle is $\\pi - \\frac{5\\pi}{6}$."}, "anki_seeds": [{"front": "The reference angle is...", "back": "the acute angle between the terminal side and the x-axis.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Reference angles in degrees", "key_prerequisites": ["coterminal-angles"], "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "150", "ray_length": "3", "label": "150\u00b0 (reference angle 30\u00b0)"}, "caption": "150\u00b0 in Quadrant II has reference angle 30\u00b0."}], "try_first": {"problem":"Two rays make the same angle with the $y$-axis and lie on opposite sides of it. One ray is at $50^\\circ$, measured counterclockwise from the positive $x$-axis. At what angle is the other ray?","answer_contract":{"kind":"exact"},"answer":"130","reveal":"Reflecting across the $y$-axis sends an angle $\\theta$ to $180^\\circ-\\theta$, so the rays at $50^\\circ$ and $130^\\circ$ both make $50^\\circ$ with the $x$-axis. That shared acute angle is the reference angle."}, "constraints": "degrees; terminal sides in any quadrant, including a first-quadrant angle; multiples of 5 degrees", "exemplars": [
        {"problem":"Find the reference angle of $150^\\circ$.","answer":"30","solution_sketch":"The ray at $150^\\circ$ is in Quadrant II, so measure to the negative $x$-axis: $180-150=30$. The reference angle is $30^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A radar beam points at $225^\\circ$, measured counterclockwise from the positive $x$-axis. What acute angle does the beam make with the $x$-axis?","answer":"45","solution_sketch":"In Quadrant III the beam is $225-180=45$ degrees past the negative $x$-axis. So the acute angle with the $x$-axis is $45^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A ray at $300^\\circ$ lies below the positive $x$-axis. Find its reference angle.","answer":"60","solution_sketch":"The remaining rotation from $300^\\circ$ to the positive $x$-axis at $360^\\circ$ is $360-300=60$ degrees. So the reference angle is $60^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Find the reference angle of $105^\\circ$.","answer":"75","solution_sketch":"The ray at $105^\\circ$ is in Quadrant II, so subtract from $180^\\circ$: $180-105=75$. The reference angle is $75^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A ship's heading is $320^\\circ$, measured counterclockwise from east. How many degrees is the ship's course from the east-west line?","answer":"40","solution_sketch":"The heading $320^\\circ$ is in Quadrant IV, so the course is $360-320=40$ degrees from the positive $x$-axis. That is the reference angle.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Find the reference angle of $38^\\circ$.","answer":"38","solution_sketch":"The ray at $38^\\circ$ is already in Quadrant I, so no change is needed. The reference angle equals the angle itself, $38^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"What is the reference angle of $160^\\circ$?","answer":"20","solution_sketch":"The reference angle is the gap to the $x$-axis, not to the $y$-axis. The ray at $160^\\circ$ is in Quadrant II, so the gap is $180-160=20$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Find the reference angle of $345^\\circ$.","answer":"15","solution_sketch":"The ray at $345^\\circ$ is in Quadrant IV, so subtract from $360^\\circ$: $360-345=15$. The reference angle is $15^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}}
    ]},
    {"id": "kp2", "name": "Reference angles in radians", "key_prerequisites": ["coterminal-angles","radians-degrees"], "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "210", "ray_length": "3", "label": "7\u03c0/6 (reference angle \u03c0/6)"}, "caption": "210\u00b0, or 7\u03c0/6 radians, in Quadrant III has reference angle \u03c0/6."}], "constraints": "radians; terminal sides in quadrants II-IV; inputs are simple multiples of π/6, π/4, π/5 and π/12; answers are acute angles in radians", "exemplars": [
        {"problem":"Find the reference angle of $5\\pi/6$.","answer":"pi/6","solution_sketch":"The ray is in Quadrant II, so subtract the angle from $\\pi$: $\\pi-5\\pi/6=\\pi/6$. The reference angle is $\\pi/6$.","answer_contract":{"kind":"exact"}},
        {"problem":"A ray at $4\\pi/3$ is in Quadrant III. How far is it past the negative $x$-axis?","answer":"pi/3","solution_sketch":"Since $\\pi<4\\pi/3<3\\pi/2$, the ray is in Quadrant III, past the negative $x$-axis at $\\pi=3\\pi/3$. The reference angle is $4\\pi/3-3\\pi/3=\\pi/3$.","answer_contract":{"kind":"exact"}},
        {"problem":"Find the reference angle of $7\\pi/4$.","answer":"pi/4","solution_sketch":"The ray is in Quadrant IV, so subtract the angle from $2\\pi=8\\pi/4$: $8\\pi/4-7\\pi/4=\\pi/4$. The reference angle is $\\pi/4$.","answer_contract":{"kind":"exact"}},
        {"problem":"A searchlight is aimed at $11\\pi/12$ radians, measured counterclockwise from east. What acute angle does the beam make with the horizontal?","answer":"pi/12","solution_sketch":"The angle $11\\pi/12$ is in Quadrant II, because it is between $6\\pi/12$ and $12\\pi/12$. The acute angle with the horizontal is $\\pi-11\\pi/12=\\pi/12$.","answer_contract":{"kind":"exact"}},
        {"problem":"Find the reference angle of $3\\pi/5$.","answer":"2*pi/5","solution_sketch":"Since $\\pi/2<3\\pi/5<\\pi$, the ray is in Quadrant II. Subtract from $\\pi$: $5\\pi/5-3\\pi/5=2\\pi/5$.","answer_contract":{"kind":"exact"}},
        {"problem":"What is the reference angle of $2\\pi/3$?","answer":"pi/3","solution_sketch":"The reference angle is the gap to the $x$-axis, not to the $y$-axis. The ray is in Quadrant II, so the gap is $\\pi-2\\pi/3=\\pi/3$.","answer_contract":{"kind":"exact"}},
        {"problem":"A rotating antenna points at $7\\pi/5$ radians, measured counterclockwise from east. What acute angle does it make with the east-west line?","answer":"2*pi/5","solution_sketch":"Since $\\pi<7\\pi/5<3\\pi/2$, the antenna is in Quadrant III. The gap past the negative $x$-axis is $7\\pi/5-5\\pi/5=2\\pi/5$.","answer_contract":{"kind":"exact"}}
    ]},
    {"id": "kp3", "name": "Negative and large angles", "key_prerequisites": ["coterminal-angles"], "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "-45", "ray_length": "3", "label": "-45\u00b0 (reference angle 45\u00b0)"}, "caption": "-45\u00b0 has the same reference angle, 45\u00b0, as its coterminal 315\u00b0."}], "constraints": "angles below 0 or beyond one full turn, in degrees or radians; reduce to a coterminal angle first; degree inputs are multiples of 5", "exemplars": [
        {"problem":"Find the reference angle of $420^\\circ$.","answer":"60","solution_sketch":"Remove one full turn: $420-360=60$. The ray at $60^\\circ$ is in Quadrant I, so its reference angle is $60^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A wheel marker starts on the positive $x$-axis and turns clockwise through $100^\\circ$. What is the reference angle of its final ray?","answer":"80","solution_sketch":"Clockwise means $-100^\\circ$. Add a full turn to get $260^\\circ$ in Quadrant III, and subtract $180^\\circ$ to get $80^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Find the reference angle of $-225^\\circ$.","answer":"45","solution_sketch":"Add a full turn: $-225+360=135$, which is in Quadrant II. The reference angle is $180-135=45$ degrees.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"A wheel marker starts on the positive $x$-axis, turns through two complete turns, and then through $50^\\circ$ more. What is the reference angle of its final ray?","answer":"50","solution_sketch":"Two complete turns are $720^\\circ$, and they bring the marker back to the start. The final ray is at $50^\\circ$ in Quadrant I, so the reference angle is $50^\\circ$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"Find the reference angle of $-5\\pi/4$.","answer":"pi/4","solution_sketch":"Add a full turn: $-5\\pi/4+8\\pi/4=3\\pi/4$, which is in Quadrant II. The reference angle is $\\pi-3\\pi/4=\\pi/4$.","answer_contract":{"kind":"exact"}},
        {"problem":"Find the reference angle of $-11\\pi/3$.","answer":"pi/3","solution_sketch":"One turn is $6\\pi/3$, so add two turns, $12\\pi/3$: $-11\\pi/3+12\\pi/3=\\pi/3$. This is in Quadrant I, so the reference angle is $\\pi/3$.","answer_contract":{"kind":"exact"}},
        {"problem":"A drill head turns through $1950^\\circ$ in $3$ seconds at a steady rate. Its marker starts on the positive $x$-axis. What is the reference angle of the marker after $2$ seconds?","answer":"40","solution_sketch":"The drill turns $1950\\div3=650$ degrees each second, so after $2$ seconds it has turned $1300^\\circ$. Remove three turns: $1300-1080=220$ in Quadrant III, and $220-180=40$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}},
        {"problem":"What is the reference angle of $-150^\\circ$?","answer":"30","solution_sketch":"The direction of the turn matters. Add a full turn: $-150+360=210$ in Quadrant III, and the reference angle is $210-180=30$.","answer_contract":{"kind":"unit","quantity":"angle","unit":"degree","allow_omitted":true}}
    ]}
  ]},
  {"id": "unit-circle-special-angles", "name": "Unit Circle — Quadrantal and Special Angles", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "special-right-triangles", "weight": 0.7, "key": true}, {"id": "radians-degrees", "weight": 0.6, "key": true}, {"id": "trig-ratios-definition", "weight": 0.4}], "diagnostic_exemplar": {"problem": "Find $\\cos(\\pi/6) \\cdot \\tan(\\pi/6) + \\sin(3\\pi/2)$.", "answer": "-1/2", "solution_sketch": "$\\cos\\frac{\\pi}{6}\\tan\\frac{\\pi}{6} = \\sin\\frac{\\pi}{6} = \\frac{1}{2}$, and $\\sin\\frac{3\\pi}{2} = -1$."}, "anki_seeds": [{"front": "sin(π/6), sin(π/4), sin(π/3) = ?", "back": "1/2, √2/2, √3/2", "type": "basic"}, {"front": "cos(0), cos(π/2), cos(π) = ?", "back": "1, 0, -1", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Quadrantal angles", "key_prerequisites": ["radians-degrees"], "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "90", "ray_length": "3", "label": "90\u00b0"}, "caption": "90\u00b0 is a quadrantal angle on the positive y-axis."}], "constraints": "angles that are multiples of π/2, including angles beyond one turn and clockwise arcs; answers are 0, 1, -1, sums of such values or axis points", "exemplars": [
        {"problem":"Evaluate $\\cos\\pi$.","answer":"-1","solution_sketch":"At angle $\\pi$ the point on the unit circle is $(-1,0)$. Cosine is the $x$-coordinate, so $\\cos\\pi=-1$.","answer_contract":{"kind":"exact"}},
        {"problem":"A bug starts at $(1,0)$ on the unit circle and walks counterclockwise through an arc of $3\\pi/2$ radians. At which point does it stop?","answer":"(0, -1)","solution_sketch":"A full turn is $2\\pi$ and a half-turn is $\\pi$, so $3\\pi/2$ is three quarters of a turn. The bug stops at $(0,-1)$, directly below the centre.","answer_contract":{"kind":"coordinates","arity":2}},
        {"problem":"Evaluate $\\sin(\\pi/2)$.","answer":"1","solution_sketch":"At angle $\\pi/2$ the point on the unit circle is $(0,1)$. Sine is the $y$-coordinate, so $\\sin(\\pi/2)=1$.","answer_contract":{"kind":"exact"}},
        {"problem":"Evaluate $\\cos(\\pi/2)$.","answer":"0","solution_sketch":"At angle $\\pi/2$ the point on the unit circle is $(0,1)$. Cosine is the $x$-coordinate, so $\\cos(\\pi/2)=0$.","answer_contract":{"kind":"exact"}},
        {"problem":"Evaluate $\\sin(5\\pi/2)+\\cos2\\pi$.","answer":"2","solution_sketch":"Since $5\\pi/2=2\\pi+\\pi/2$, the angle $5\\pi/2$ ends where $\\pi/2$ ends, so $\\sin(5\\pi/2)=1$. Also $\\cos2\\pi=1$, and the sum is $2$.","answer_contract":{"kind":"exact"}},
        {"problem":"What is the value of $\\sin3\\pi$?","answer":"0","solution_sketch":"Remove one full turn of $2\\pi$ to get angle $\\pi$, where the point is $(-1,0)$. The $y$-coordinate is $0$, so $\\sin3\\pi=0$.","answer_contract":{"kind":"exact"}},
        {"problem":"A point starts at $(1,0)$ on the unit circle and moves clockwise through an arc of $\\pi$ radians. Where does it stop?","answer":"(-1, 0)","solution_sketch":"A clockwise half-turn from $(1,0)$ ends on the opposite side of the circle. The point is $(-1,0)$.","answer_contract":{"kind":"coordinates","arity":2}}
    ]},
    {"id": "kp2", "name": "First-quadrant special angles", "key_prerequisites": ["special-right-triangles"], "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "60", "ray_length": "3", "label": "60\u00b0 (\u03c0/3)"}, "caption": "60\u00b0, or \u03c0/3 radians, is a first-quadrant special angle."}], "try_first": {"problem":"A right triangle has two equal legs of length $s$ and a hypotenuse of length $1$. What is $s^2$?","answer_contract":{"kind":"exact"},"answer":"1/2","reveal":"The Pythagorean theorem gives $s^2+s^2=1$, so $s^2=1/2$ and $s=\\sqrt2/2$. This is the value of both $\\cos(\\pi/4)$ and $\\sin(\\pi/4)$."}, "constraints": "first-quadrant angles π/6, π/4 and π/3; exact values 1/2, √2/2 and √3/2; contexts with ladders and ramps", "exemplars": [
        {"problem":"Find $\\cos(\\pi/6)$.","answer":"sqrt(3)/2","solution_sketch":"In a $30$-$60$-$90$ triangle with hypotenuse $1$, the side next to the $30^\\circ$ angle is $\\sqrt3/2$. Cosine is that horizontal side, so $\\cos(\\pi/6)=\\sqrt3/2$.","answer_contract":{"kind":"exact"}},
        {"problem":"Find $\\sin(\\pi/4)$.","answer":"sqrt(2)/2","solution_sketch":"The triangle has two equal legs $s$ and hypotenuse $1$, so $2s^2=1$. Then $s=\\sqrt2/2$, and sine is the vertical leg.","answer_contract":{"kind":"exact"}},
        {"problem":"The point on the unit circle at angle $\\pi/3$ is $(\\cos(\\pi/3),\\sin(\\pi/3))$. What are its coordinates?","answer":"(1/2, sqrt(3)/2)","solution_sketch":"The angle $\\pi/3$ lies in a $30$-$60$-$90$ triangle with hypotenuse $1$. The horizontal leg is $1/2$ and the vertical leg is $\\sqrt3/2$, so the point is $(1/2,\\sqrt3/2)$.","answer_contract":{"kind":"coordinates","arity":2}},
        {"problem":"A $10$ m ladder leans against a wall and makes an angle of $\\pi/6$ with the ground. How high up the wall does the top of the ladder reach?","answer":"5","solution_sketch":"The height is the side opposite the angle, so height $=10\\sin(\\pi/6)$. Since $\\sin(\\pi/6)=1/2$, the top of the ladder reaches $5$ m.","answer_contract":{"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}},
        {"problem":"Find $\\cos(\\pi/3)$.","answer":"1/2","solution_sketch":"At $\\pi/3$ the horizontal leg of the $30$-$60$-$90$ triangle is the short one, half the hypotenuse. So $\\cos(\\pi/3)=1/2$.","answer_contract":{"kind":"exact"}},
        {"problem":"Evaluate $\\sin(\\pi/3)\\cos(\\pi/3)$.","answer":"sqrt(3)/4","solution_sketch":"Here $\\sin(\\pi/3)=\\sqrt3/2$ and $\\cos(\\pi/3)=1/2$. Multiply the numerators and multiply the denominators, so the product is $\\sqrt3/4$.","answer_contract":{"kind":"exact"}},
        {"problem":"A straight ramp rises $3$ m and makes an angle of $\\pi/6$ with the ground. How long is the ramp?","answer":"6","solution_sketch":"The rise is the length times $\\sin(\\pi/6)=1/2$. So $3=\\frac12\\cdot$ length, and the length is $6$ m.","answer_contract":{"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}},
        {"problem":"What is the value of $\\sin(\\pi/3)$?","answer":"sqrt(3)/2","solution_sketch":"The value $1/2$ is the cosine. At $\\pi/3$ the vertical leg is the longer one, $\\sqrt3/2$, and the horizontal leg is $1/2$.","answer_contract":{"kind":"exact"}}
    ]},
    {"id": "kp3", "name": "Tangent at special angles", "key_prerequisites": ["special-right-triangles","trig-ratios-definition"], "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "45", "ray_length": "3", "label": "45\u00b0 (\u03c0/4)"}, "caption": "At 45\u00b0, or \u03c0/4 radians, tangent equals exactly 1."}], "constraints": "tangent at π/6, π/4 and π/3, and expressions or contexts that use it; answers are √3/3, 1 and √3 or products and sums of such values", "exemplars": [
        {"problem":"Find $\\tan(\\pi/4)$.","answer":"1","solution_sketch":"At $\\pi/4$ the horizontal and vertical legs are both $\\sqrt2/2$. Tangent is their ratio, so $\\tan(\\pi/4)=1$.","answer_contract":{"kind":"exact"}},
        {"problem":"Find $\\tan(\\pi/6)$.","answer":"sqrt(3)/3","solution_sketch":"At $\\pi/6$ the vertical leg is $1/2$ and the horizontal leg is $\\sqrt3/2$. Their ratio is $(1/2)/(\\sqrt3/2)=1/\\sqrt3=\\sqrt3/3$.","answer_contract":{"kind":"exact"}},
        {"problem":"Find $\\tan(\\pi/3)$.","answer":"sqrt(3)","solution_sketch":"At $\\pi/3$ the vertical leg is $\\sqrt3/2$ and the horizontal leg is $1/2$. Tangent is their ratio, $(\\sqrt3/2)/(1/2)=\\sqrt3$.","answer_contract":{"kind":"exact"}},
        {"problem":"Evaluate $\\tan(\\pi/6)\\tan(\\pi/3)$.","answer":"1","solution_sketch":"Here $\\tan(\\pi/6)=\\sqrt3/3$ and $\\tan(\\pi/3)=\\sqrt3$. Multiply the numerators and the denominators: $\\sqrt3\\cdot\\sqrt3=3$ over $3\\cdot1$, so the product is $1$.","answer_contract":{"kind":"exact"}},
        {"problem":"A tree $8$ m tall casts a shadow on level ground when the Sun is $\\pi/3$ radians above the horizon. How long is the shadow?","answer":"8*sqrt(3)/3","solution_sketch":"Tangent of the Sun angle is the height divided by the shadow, so $\\tan(\\pi/3)=8/$shadow. Then the shadow is $8/\\sqrt3=8\\sqrt3/3$ m.","answer_contract":{"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}},
        {"problem":"Evaluate $\\cos(\\pi/3)+\\tan(\\pi/4)$.","answer":"3/2","solution_sketch":"Here $\\cos(\\pi/3)=1/2$ and $\\tan(\\pi/4)=1$. Add them with a common denominator: $1/2+2/2=3/2$, so the sum is $3/2$.","answer_contract":{"kind":"exact"}},
        {"problem":"A road climbs at an angle of $\\pi/6$ to the horizontal. How high has it risen after a horizontal distance of $12$ m?","answer":"4*sqrt(3)","solution_sketch":"Tangent is rise divided by run, so rise $=12\\tan(\\pi/6)$. That is $12\\cdot\\sqrt3/3=4\\sqrt3$ m.","answer_contract":{"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}},
        {"problem":"What is the value of $\\tan(\\pi/6)$?","answer":"sqrt(3)/3","solution_sketch":"The legs are not swapped: at $\\pi/6$ the vertical leg $1/2$ is the shorter one. So the ratio is $(1/2)/(\\sqrt3/2)=\\sqrt3/3$.","answer_contract":{"kind":"exact"}}
    ]}
  ]},
  {"id": "unit-circle", "name": "The Unit Circle", "core": true, "difficulty": 0.7, "drill": false, "answer_kind": "expression", "expected_time_secs": 180, "prerequisites": [{"id": "unit-circle-special-angles", "weight": 0.8, "key": true}, {"id": "reference-angles", "weight": 0.7, "key": true}, {"id": "coterminal-angles", "weight": 0.4}, {"id": "simplifying-radicals", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Find $\\cos\\left(-\\frac{4\\pi}{3}\\right)$.", "answer": "-1/2", "solution_sketch": "Cosine is even, so this is $\\cos\\frac{4\\pi}{3}$ — Quadrant III, reference angle $\\frac{\\pi}{3}$, cosine negative."}, "anki_seeds": [{"front": "ASTC: which trig functions are positive in QI, QII, QIII, QIV?", "back": "QI all, QII sine, QIII tangent, QIV cosine.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "200", "ray_length": "3", "label": "200\u00b0"}, "caption": "200\u00b0 lands in Quadrant III, where tangent is positive."}], "name": "Signs by quadrant (ASTC)", "key_prerequisites": ["reference-angles"], "constraints": "the quadrant is named or the angle is given in whole degrees; answers are signs, or values of one coordinate found from the other with the quadrant named (Pythagorean-triple coordinates)", "exemplars": [
      {"problem": "Is $\\cos 200^\\circ$ positive or negative?", "answer": "negative", "solution_sketch": "The angle $200^\\circ$ is between $180^\\circ$ and $270^\\circ$, so it lies in Quadrant III. Cosine is the horizontal coordinate, and that is negative there.", "answer_contract": {"kind": "label", "options": [["negative", "it is negative", "less than zero", "below zero"], ["positive", "it is positive", "greater than zero", "above zero"]]}},
      {"problem": "The point $\\left(x,\\tfrac{3}{5}\\right)$ lies on the unit circle in Quadrant II. Find $x$.", "answer": "-4/5", "solution_sketch": "On the unit circle $x^2+y^2=1$, so $x^2=1-\\frac{9}{25}=\\frac{16}{25}$. Quadrant II has negative $x$-coordinates, so $x=-\\frac{4}{5}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A point on the rim of a bicycle wheel starts level with the axle on the right side of the wheel. The wheel turns counterclockwise through $110^\\circ$. Is the point above or below the axle?", "answer": "above", "solution_sketch": "A turn of $110^\\circ$ is more than a quarter turn and less than a half turn. The point is then in Quadrant II, where the vertical coordinate is positive, so it is above the axle.", "answer_contract": {"kind": "label", "options": [["above", "above the axle", "higher", "higher than the axle"], ["below", "below the axle", "lower", "lower than the axle"]]}},
      {"problem": "A sprinkler arm $1$ m long points into the lower right quarter of a grid centred on the sprinkler. Its tip is $\\frac{12}{13}$ m below the sprinkler. How far to the right of the sprinkler is the tip?", "answer": "5/13", "solution_sketch": "The tip lies on a circle of radius $1$ m, so $x^2+\\left(\\frac{12}{13}\\right)^2=1$ and $x^2=\\frac{25}{169}$. The tip is to the right, where $x$ is positive, so $x=\\frac{5}{13}$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "The point $\\left(-\\tfrac{7}{25},y\\right)$ lies on the unit circle in Quadrant III. Find $y$.", "answer": "-24/25", "solution_sketch": "On the unit circle $y^2=1-\\frac{49}{625}=\\frac{576}{625}$, so $|y|=\\frac{24}{25}$. Quadrant III has negative $y$-coordinates, so $y=-\\frac{24}{25}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In Quadrant II, $\\cos\\theta=-\\frac{3}{5}$. Find $\\tan\\theta$.", "answer": "-4/3", "solution_sketch": "Cosine is the $x$-coordinate and sine is the $y$-coordinate, so $y^2=1-\\frac{9}{25}$ and $y=\\frac{4}{5}$ in Quadrant II. Then $\\tan\\theta=\\frac{y}{x}=\\frac{4/5}{-3/5}=-\\frac{4}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A Ferris-wheel rider is $\\frac{8}{17}$ of a radius above the axle level, on the left half of the wheel. How many radii is the rider to the left of the axle?", "answer": "15/17", "solution_sketch": "Measured in radii, the rider is a point on the unit circle with $y=\\frac{8}{17}$. Then $x^2=1-\\frac{64}{289}=\\frac{225}{289}$, so the distance to the left is $|x|=\\frac{15}{17}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In which quadrants is $\\tan\\theta$ positive?", "answer": "1, 3", "solution_sketch": "Tangent is the quotient of the vertical and the horizontal coordinate, so it is positive when both have the same sign. That happens in Quadrant I, where both are positive, and in Quadrant III, where both are negative.", "answer_contract": {"kind": "exact"}},
      {"problem": "In which quadrants is $\\sin\\theta$ negative?", "answer": "3, 4", "solution_sketch": "Sine is the vertical coordinate of the point on the unit circle. It is negative below the horizontal axis, which is Quadrants III and IV.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "135", "ray_length": "3", "label": "135\u00b0 (reference 45\u00b0)"}, "caption": "135\u00b0 in Quadrant II has reference angle 45\u00b0."}], "name": "Exact values via reference angles", "key_prerequisites": ["unit-circle-special-angles", "reference-angles"], "constraints": "angles in quadrants II-IV that are multiples of π/6 or π/4 (radians or degrees); reference angle plus the quadrant sign; exact values; unit-circle and wheel contexts", "exemplars": [
      {"problem": "Find $\\sin\\frac{2\\pi}{3}$.", "answer": "sqrt(3)/2", "solution_sketch": "The angle $\\frac{2\\pi}{3}$ is in Quadrant II with reference angle $\\pi-\\frac{2\\pi}{3}=\\frac{\\pi}{3}$. Sine is positive there, so the value is $\\sin\\frac{\\pi}{3}=\\frac{\\sqrt3}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find $\\cos\\frac{5\\pi}{4}$.", "answer": "-sqrt(2)/2", "solution_sketch": "The angle $\\frac{5\\pi}{4}$ is in Quadrant III with reference angle $\\frac{\\pi}{4}$. Cosine is negative there, so the value is $-\\frac{\\sqrt2}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find $\\tan 150^\\circ$.", "answer": "-sqrt(3)/3", "solution_sketch": "The angle $150^\\circ$ is in Quadrant II with reference angle $30^\\circ$. Tangent is negative there, and $\\tan30^\\circ=\\frac{\\sqrt3}{3}$, so the value is $-\\frac{\\sqrt3}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A marker starts at $(1,0)$ on the unit circle and moves counterclockwise through $\\frac{7\\pi}{6}$. What is its $y$-coordinate?", "answer": "-1/2", "solution_sketch": "The $y$-coordinate is $\\sin\\frac{7\\pi}{6}$. The angle is in Quadrant III with reference angle $\\frac{\\pi}{6}$, where sine is negative, so $y=-\\frac{1}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A point on the rim of a wheel of radius $10$ cm starts at the right end of the horizontal diameter. The wheel turns counterclockwise through $150^\\circ$. The origin is at the axle, the $x$-axis points right and lengths are in centimetres. What is the $x$-coordinate of the point?", "answer": "-5*sqrt(3)", "solution_sketch": "The $x$-coordinate is $10\\cos150^\\circ$. The angle is in Quadrant II with reference angle $30^\\circ$, so $x=-10\\cdot\\frac{\\sqrt3}{2}=-5\\sqrt3$.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}},
      {"problem": "Find $\\cos 315^\\circ$.", "answer": "sqrt(2)/2", "solution_sketch": "The angle $315^\\circ$ is in Quadrant IV with reference angle $45^\\circ$. Cosine is positive there, so the value is $\\frac{\\sqrt2}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find $\\sin\\frac{11\\pi}{6}$.", "answer": "-1/2", "solution_sketch": "The angle $\\frac{11\\pi}{6}$ is in Quadrant IV with reference angle $\\frac{\\pi}{6}$. Sine is negative there, so the value is $-\\frac{1}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "What is the value of $\\cos\\frac{3\\pi}{4}$?", "answer": "-sqrt(2)/2", "solution_sketch": "The angle $\\frac{3\\pi}{4}$ is in Quadrant II with reference angle $\\frac{\\pi}{4}$. The magnitude $\\frac{\\sqrt2}{2}$ is right, but cosine is negative in Quadrant II, so the value is $-\\frac{\\sqrt2}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A point on the unit circle is reached from $(1,0)$ by a counterclockwise turn of $\\frac{5\\pi}{3}$. What is its $y$-coordinate?", "answer": "-sqrt(3)/2", "solution_sketch": "The $y$-coordinate is $\\sin\\frac{5\\pi}{3}$. The angle is in Quadrant IV with reference angle $\\frac{\\pi}{3}$, where sine is negative, so $y=-\\frac{\\sqrt3}{2}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "405", "ray_length": "3", "label": "405\u00b0 (= 45\u00b0 + 360\u00b0)"}, "caption": "405\u00b0 is coterminal with 45\u00b0, one full turn beyond 2\u03c0."}], "name": "Negative angles and angles beyond 2π", "key_prerequisites": ["coterminal-angles", "unit-circle-special-angles"], "try_first": {"problem": "A point starts at $(1,0)$ and moves counterclockwise round the unit circle through $3\\pi$. What is its $x$-coordinate?", "answer_contract": {"kind": "exact"}, "answer": "-1", "reveal": "A turn of $3\\pi$ is one full turn plus a half turn, so the point ends at $(-1,0)$. Full turns do not move the point, so only the leftover angle matters."}, "constraints": "negative angles or angles beyond one full turn, in radians or degrees; reduce to a coterminal angle first; exact special values; a clockwise turn is a negative angle", "exemplars": [
      {"problem": "Find $\\cos\\left(-\\frac{\\pi}{3}\\right)$.", "answer": "1/2", "solution_sketch": "Add one full turn: $-\\frac{\\pi}{3}+2\\pi=\\frac{5\\pi}{3}$. This is in Quadrant IV with reference angle $\\frac{\\pi}{3}$, where cosine is positive, so the value is $\\frac{1}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find $\\sin 405^\\circ$.", "answer": "sqrt(2)/2", "solution_sketch": "Remove one full turn: $405^\\circ-360^\\circ=45^\\circ$. Sine repeats after a full turn, and $\\sin45^\\circ=\\frac{\\sqrt2}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find $\\tan\\left(-\\frac{\\pi}{4}\\right)$.", "answer": "-1", "solution_sketch": "Add a full turn: $-\\frac{\\pi}{4}+2\\pi=\\frac{7\\pi}{4}$, which is in Quadrant IV with reference angle $\\frac{\\pi}{4}$. The reference tangent is $1$ and tangent is negative in Quadrant IV, so the value is $-1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find $\\cos 480^\\circ$.", "answer": "-1/2", "solution_sketch": "Remove a full turn: $480^\\circ-360^\\circ=120^\\circ$, which is in Quadrant II. Its reference angle is $60^\\circ$ with cosine $\\frac{1}{2}$, and cosine is negative there, so the value is $-\\frac{1}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A marker starts at $(1,0)$ on the unit circle and moves clockwise through $\\frac{2\\pi}{3}$. Find the coordinates of its new position.", "answer": "(-1/2, -sqrt(3)/2)", "solution_sketch": "A clockwise turn is a negative angle, so the marker is at the angle $-\\frac{2\\pi}{3}$, coterminal with $\\frac{4\\pi}{3}$ in Quadrant III. Both coordinates are negative there, so the point is $\\left(-\\frac{1}{2},-\\frac{\\sqrt3}{2}\\right)$.", "answer_contract": {"kind": "coordinates", "arity": 2}},
      {"problem": "A marker starts at $(1,0)$ on the unit circle and moves clockwise through $\\frac{5\\pi}{3}$. What is its $y$-coordinate?", "answer": "sqrt(3)/2", "solution_sketch": "The new angle is $-\\frac{5\\pi}{3}$, and adding $2\\pi$ gives $\\frac{\\pi}{3}$ in Quadrant I. The $y$-coordinate is $\\sin\\frac{\\pi}{3}=\\frac{\\sqrt3}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A marker starts at $(1,0)$ and moves counterclockwise round the unit circle through a total angle of $\\frac{13\\pi}{3}$. Where does it stop?", "answer": "(1/2, sqrt(3)/2)", "solution_sketch": "Remove two full turns: $\\frac{13\\pi}{3}-4\\pi=\\frac{\\pi}{3}$. The marker stops at the point for $\\frac{\\pi}{3}$, which is $\\left(\\frac{1}{2},\\frac{\\sqrt3}{2}\\right)$.", "answer_contract": {"kind": "coordinates", "arity": 2}},
      {"problem": "What is the value of $\\sin(-30^\\circ)$?", "answer": "-1/2", "solution_sketch": "The angle $-30^\\circ$ is below the horizontal axis, where the vertical coordinate is negative. Its reference angle is $30^\\circ$ with sine $\\frac{1}{2}$, so the value is $-\\frac{1}{2}$.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "reciprocal-trig-functions", "name": "Reciprocal Trigonometric Functions", "core": true, "difficulty": 0.65, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "trig-ratios-definition", "weight": 0.6, "key": true}, {"id": "unit-circle-special-angles", "weight": 0.5, "key": true}, {"id": "dividing-fractions", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Find $\\sec(60^\\circ)$.", "answer": "2", "solution_sketch": "$\\sec\\theta = \\frac{1}{\\cos\\theta}$ and $\\cos 60^\\circ = \\frac{1}{2}$."}, "anki_seeds": [{"front": "csc θ = ?", "back": "1/sin θ", "type": "basic"}, {"front": "sec θ = 1/{{c1::cos θ}} and cot θ = 1/{{c2::tan θ}}", "back": "cos θ; tan θ", "type": "cloze"}], "knowledge_points": [
    {"id": "kp1", "visuals": [{"kind": "geometry", "figure": {"shape": "polygon", "vertices": [{"x": "0", "y": "0"}, {"x": "4", "y": "0"}, {"x": "0", "y": "3"}], "right_angles": [0], "angle_marks": [{"at": 1, "label": "\u03b8"}]}, "caption": "A right triangle. The small square marks the right angle. \u03b8 marks one acute angle: the side across from \u03b8 is its opposite side, the side that touches both \u03b8 and the right angle is its adjacent side, and the longest side is the hypotenuse."}], "name": "Definitions from triangle sides", "key_prerequisites": ["trig-ratios-definition"], "constraints": "Pythagorean-triple side lengths; sides named by their position relative to the angle, or a ladder, ramp or kite string that forms a right triangle", "exemplars": [
      {"problem": "In a right triangle the side opposite $\\theta$ is $3$, the side adjacent to $\\theta$ is $4$ and the hypotenuse is $5$. Find $\\csc\\theta$.", "answer": "5/3", "solution_sketch": "Cosecant is hypotenuse divided by opposite side. So $\\csc\\theta=\\frac{5}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In a right triangle the side opposite $\\theta$ is $20$, the side adjacent to $\\theta$ is $21$ and the hypotenuse is $29$. Find $\\cot\\theta$.", "answer": "21/20", "solution_sketch": "Cotangent is adjacent side divided by opposite side. So $\\cot\\theta=\\frac{21}{20}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In a right triangle the side opposite $\\theta$ is $5$, the side adjacent to $\\theta$ is $12$ and the hypotenuse is $13$. Find $\\sec\\theta$.", "answer": "13/12", "solution_sketch": "Secant is hypotenuse divided by adjacent side. So $\\sec\\theta=\\frac{13}{12}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A $13$ m ladder leans against a wall with its foot $5$ m from the wall. The ladder makes an angle $\\theta$ with the ground. Find $\\sec\\theta$.", "answer": "13/5", "solution_sketch": "The foot distance $5$ m is the side adjacent to $\\theta$, and the ladder is the hypotenuse. So $\\sec\\theta=\\frac{13}{5}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A loading ramp is $25$ ft long. It rises $7$ ft over a horizontal run of $24$ ft and makes an angle $\\theta$ with the ground. Find $\\cot\\theta$.", "answer": "24/7", "solution_sketch": "The rise $7$ ft is opposite $\\theta$ and the run $24$ ft is adjacent to it. So $\\cot\\theta=\\frac{\\text{adjacent}}{\\text{opposite}}=\\frac{24}{7}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A kite string is $17$ m long. The kite is $8$ m above the holder’s hand and $15$ m away horizontally, and the string makes an angle $\\theta$ with the horizontal. Find $\\csc\\theta$.", "answer": "17/8", "solution_sketch": "The height $8$ m is opposite $\\theta$ and the string is the hypotenuse. So $\\csc\\theta=\\frac{17}{8}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In a right triangle the opposite side is $9$, the adjacent side is $12$ and the hypotenuse is $15$. What is the value of $\\sec\\theta$?", "answer": "5/4", "solution_sketch": "Secant uses the adjacent side, not the opposite side: $\\sec\\theta=\\frac{15}{12}$. This reduces to $\\frac{5}{4}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Reciprocal relationships", "key_prerequisites": ["dividing-fractions", "trig-ratios-definition"], "constraints": "one ratio given as a simple fraction or a terminating decimal; the answer is its reciprocal; slopes and ladder ratios as contexts", "exemplars": [
      {"problem": "If $\\cos\\theta=\\frac{2}{5}$, find $\\sec\\theta$.", "answer": "5/2", "solution_sketch": "Secant is the reciprocal of cosine, so $\\sec\\theta=\\frac{1}{2/5}=\\frac{5}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\sin\\theta=0.25$, find $\\csc\\theta$.", "answer": "4", "solution_sketch": "Cosecant is the reciprocal of sine, so $\\csc\\theta=\\frac{1}{0.25}=4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\tan\\theta=\\frac{3}{7}$, find $\\cot\\theta$.", "answer": "7/3", "solution_sketch": "Cotangent is the reciprocal of tangent, so $\\cot\\theta=\\frac{1}{3/7}=\\frac{7}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\sec\\theta=1.25$, find $\\cos\\theta$.", "answer": "4/5", "solution_sketch": "Cosine is the reciprocal of secant, so $\\cos\\theta=\\frac{1}{1.25}=\\frac{4}{5}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "On a ramp, $\\tan\\theta=\\frac{2}{9}$, where $\\theta$ is the angle with the ground. How many metres of horizontal run does the ramp have for each metre of rise?", "answer": "9/2", "solution_sketch": "Tangent compares rise with run, so the run for each unit of rise is the reciprocal, $\\cot\\theta$. It is $\\frac{1}{2/9}=\\frac{9}{2}$ metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ladder leans against a wall so that the height it reaches is $0.8$ of its length, so $\\sin\\theta=0.8$ for the angle $\\theta$ with the ground. How many times as long as that height is the ladder?", "answer": "5/4", "solution_sketch": "The ladder length divided by the height is $\\csc\\theta=\\frac{1}{\\sin\\theta}$. It is $\\frac{1}{0.8}=\\frac{5}{4}$ times the height.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\cos\\theta=\\frac{5}{13}$, what is the value of $\\sec\\theta$?", "answer": "13/5", "solution_sketch": "Secant is the reciprocal of cosine, not its negative. So $\\sec\\theta=\\frac{1}{5/13}=\\frac{13}{5}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\csc\\theta=\\frac{13}{12}$, find $\\sin\\theta$.", "answer": "12/13", "solution_sketch": "Sine is the reciprocal of cosecant, so $\\sin\\theta=\\frac{1}{13/12}=\\frac{12}{13}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A hill road rises $0.05$ m for each metre of horizontal distance, so $\\tan\\theta=0.05$. How many metres of horizontal distance does the road cover for each metre it rises?", "answer": "20", "solution_sketch": "Horizontal distance per metre of rise is $\\cot\\theta=\\frac{1}{\\tan\\theta}$. It is $\\frac{1}{0.05}=20$ metres.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Values at special angles", "key_prerequisites": ["unit-circle-special-angles"], "constraints": "special angles 30, 45 and 60 degrees (or π/6, π/4, π/3); exact answers with radicals rationalized; right triangles with a special angle as contexts", "exemplars": [
      {"problem": "Find $\\csc 30^\\circ$.", "answer": "2", "solution_sketch": "Cosecant is the reciprocal of sine, and $\\sin30^\\circ=\\frac{1}{2}$. So $\\csc30^\\circ=\\frac{1}{1/2}=2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find $\\sec\\frac{\\pi}{4}$.", "answer": "sqrt(2)", "solution_sketch": "Secant is the reciprocal of cosine, and $\\cos\\frac{\\pi}{4}=\\frac{\\sqrt2}{2}$. So $\\sec\\frac{\\pi}{4}=\\frac{2}{\\sqrt2}=\\sqrt2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find $\\cot 60^\\circ$.", "answer": "sqrt(3)/3", "solution_sketch": "Cotangent is the reciprocal of tangent, and $\\tan60^\\circ=\\sqrt3$. So $\\cot60^\\circ=\\frac{1}{\\sqrt3}=\\frac{\\sqrt3}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ramp makes an angle of $30^\\circ$ with the ground and rises $3$ m. How long is the ramp?", "answer": "6", "solution_sketch": "The rise is opposite the angle and the ramp is the hypotenuse, so $3=\\text{length}\\cdot\\sin30^\\circ$. The length is $\\frac{3}{1/2}=3\\csc30^\\circ=6$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "A ladder makes an angle of $60^\\circ$ with the ground. Its foot is $2$ m from the wall. How long is the ladder?", "answer": "4", "solution_sketch": "The foot distance is adjacent to the angle and the ladder is the hypotenuse, so $2=\\text{length}\\cdot\\cos60^\\circ$. The length is $\\frac{2}{1/2}=2\\sec60^\\circ=4$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "Find $\\sec\\frac{\\pi}{6}$.", "answer": "2*sqrt(3)/3", "solution_sketch": "Secant is the reciprocal of cosine, and $\\cos\\frac{\\pi}{6}=\\frac{\\sqrt3}{2}$. So $\\sec\\frac{\\pi}{6}=\\frac{2}{\\sqrt3}=\\frac{2\\sqrt3}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find $\\csc 45^\\circ$.", "answer": "sqrt(2)", "solution_sketch": "Cosecant is the reciprocal of sine, and $\\sin45^\\circ=\\frac{\\sqrt2}{2}$. So $\\csc45^\\circ=\\frac{2}{\\sqrt2}=\\sqrt2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A guy wire is fixed to a pole $12$ m above the ground and makes an angle of $45^\\circ$ with the ground. How long is the wire?", "answer": "12*sqrt(2)", "solution_sketch": "The pole height is opposite the angle and the wire is the hypotenuse, so the length is $\\frac{12}{\\sin45^\\circ}=12\\csc45^\\circ$. That is $12\\sqrt2$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "Find $\\cot\\frac{\\pi}{6}$.", "answer": "sqrt(3)", "solution_sketch": "Cotangent is the reciprocal of tangent, and $\\tan\\frac{\\pi}{6}=\\frac{\\sqrt3}{3}$. So $\\cot\\frac{\\pi}{6}=\\frac{3}{\\sqrt3}=\\sqrt3$.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "sine-cosine-parent-graphs", "name": "Graphs of Sine and Cosine — Key Features", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "unit-circle", "weight": 0.7, "key": true}, {"id": "coordinate-plane", "weight": 0.3}, {"id": "function-notation", "weight": 0.3}], "diagnostic_exemplar": {"problem": "On $[0, 2\\pi]$, the graph of $y = \\sin x$ reaches its maximum at $x = a$ and the graph of $y = \\cos x$ reaches its minimum at $x = b$. Find $a + b$.", "answer": "3π/2", "solution_sketch": "$\\sin x$ peaks at $\\frac{\\pi}{2}$ and $\\cos x$ bottoms out at $\\pi$."}, "anki_seeds": [{"front": "y = sin x passes through the origin; y = cos x starts at...", "back": "(0, 1).", "type": "basic"}], "knowledge_points": [
