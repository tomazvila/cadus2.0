      {"problem": "A survey triangle has sides $30,50,70$ m. Find the angle opposite the $70$ m side, in degrees as a bare number.", "answer": "120", "solution_sketch": "$\\cos A=(900+2500-4900)/(2\\cdot30\\cdot50)=-1/2$; the triangle angle is $120^\\circ$.", "answer_contract": {"kind": "exact"}}, {"problem": "Two roads of lengths $20$ m and $20$ m meet at $60^\\circ$. Find the straight connector between their far ends in metres as a number.", "answer": "20", "solution_sketch": "$d^2=400+400-2(20)(20)(1/2)=400$, giving $d=20$ m.", "answer_contract": {"kind": "exact"}}
