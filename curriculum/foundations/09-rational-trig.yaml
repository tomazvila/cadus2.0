    {"id": "kp2", "name": "Factor, multiply, and cancel", "key_prerequisites": ["rational-expressions", "factoring-trinomials"], "constraints": "one factor needs a difference of squares or a monic trinomial factored first; exactly one binomial cancels", "step_check": {"step": "Cancel $x+4$, giving $2(x-4)/3$", "question": "Why is $x\\ne-4$ still stated after $x+4$ has been cancelled?", "options": ["Cancelling is valid only when $x+4$ is positive, so $x$ must exceed $-4$", "The original expression divides by $x+4$, so $x=-4$ stays undefined", "The factor $x+4$ is gone after cancelling, so the restriction is only a habit"], "answer": "The original expression divides by $x+4$, so $x=-4$ stays undefined", "why": "At $x=-4$ the original fraction has the denominator $0$, so that input is excluded even though the simplified form $\\frac{2(x-4)}{3}$ has no problem there."}, "exemplars": [
