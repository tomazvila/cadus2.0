        name: The quotient identity for tangent
        key_prerequisites: [unit-circle]
        constraints: "tan = sin over cos; ratios given as Pythagorean-triple fractions, or the answer is the symbolic identity itself"
        exemplars:
          - problem: 'If $\sin \theta = \frac{3}{5}$ and $\cos \theta = \frac{4}{5}$, find $\tan \theta$.'
            answer: "3/4"
            solution_sketch: '$\tan \theta = \frac{\sin \theta}{\cos \theta} = \frac{3/5}{4/5}$.'
          - problem: 'Simplify $\frac{\sin \theta}{\cos \theta}$.'
            answer: "tan θ"
      - id: kp2
        name: Simplify expressions using identities
        key_prerequisites: [pythagorean-identity, reciprocal-trig-functions]
        constraints: "one-step simplifications using the Pythagorean and quotient identities; the answer is a single trig function"
        exemplars:
          - problem: 'Simplify $1 - \cos^2 \theta$.'
            answer: "sin^2 θ"
            solution_sketch: 'From $\sin^2 \theta + \cos^2 \theta = 1$.'
          - problem: 'Simplify $\frac{\sin^2 \theta + \cos^2 \theta}{\cos \theta}$.'
            answer: "sec θ"
            solution_sketch: 'The numerator is $1$, so this is $\frac{1}{\cos \theta} = \sec \theta$.'
      - id: kp3
        name: Find all ratios from one
        key_prerequisites: [pythagorean-identity, unit-circle]
        constraints: "Pythagorean-triple ratios; quadrant given"
        exemplars:
          - problem: 'If $\tan \theta = \frac{3}{4}$ and $\theta$ is in Quadrant III, find $\sin \theta$.'
            answer: "-3/5"
            solution_sketch: 'A 3-4-5 reference triangle; both $\sin \theta$ and $\cos \theta$ are negative in Quadrant III, so $\sin \theta = -\frac{3}{5}$ and $\cos \theta = -\frac{4}{5}$.'
          - problem: 'If $\sec \theta = \frac{5}{3}$ and $\theta$ is in Quadrant IV, find $\tan \theta$.'
            answer: "-4/3"
            solution_sketch: '$\cos \theta = \frac{3}{5}$ and sine is negative in Quadrant IV, so $\sin \theta = -\frac{4}{5}$ and $\tan \theta = -\frac{4}{3}$.'
    diagnostic_exemplar:
      problem: 'If $\tan \theta = -\frac{5}{12}$ and $\theta$ is in Quadrant IV, find $\sin \theta$.'
      answer: "-5/13"
      solution_sketch: 'The reference triangle has legs $5$ and $12$, so the hypotenuse is $13$; in Quadrant IV sine is negative.'
    anki_seeds:
      - front: "tan θ = ?"
        back: "sin θ / cos θ"
        type: basic

  - id: law-of-sines
    name: The Law of Sines
    core: false                # terminal named theorem, feeds only law-of-sines-cosines
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: right-triangle-trig
        weight: 0.7
        key: true
      - id: unit-circle
        weight: 0.4
      - id: ratios-proportions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Find a side (AAS/ASA)
        key_prerequisites: [right-triangle-trig, ratios-proportions]
        constraints: "a/sin A = b/sin B = c/sin C; use special-angle sines"
        exemplars:
          - problem: 'In a triangle $a = 10$, $A = 30^\circ$, $B = 45^\circ$. Find $b$ (round to two decimals). Use $\frac{a}{\sin A} = \frac{b}{\sin B}$.'
            answer: "≈ 14.14"
            solution_sketch: '$b = 10 \cdot \frac{\sin 45^\circ}{\sin 30^\circ} = 10\sqrt{2} \approx 14.14$.'
          - problem: 'Given $a = 8$, $A = 30^\circ$, $B = 90^\circ$, find $b$.'
            answer: "16"
      - id: kp2
        name: Find the third angle first
        key_prerequisites: [right-triangle-trig]
        constraints: "two angles given, so the third comes from the 180 degree sum; angles drawn from 30, 45, 60, 75 and 105 degrees so answers stay exact radicals"
        exemplars:
          - problem: 'In a triangle $A = 30^\circ$, $C = 105^\circ$, and $a = 6$. Find $b$ exactly.'
            answer: "6√2"
            solution_sketch: '$B = 45^\circ$; $b = 6 \cdot \frac{\sin 45^\circ}{\sin 30^\circ} = 6\sqrt{2}$.'
          - problem: 'In a triangle $A = 45^\circ$, $B = 60^\circ$, and $a = 10$. Find $b$ exactly.'
            answer: "5√6"
            solution_sketch: '$b = 10 \cdot \frac{\sin 60^\circ}{\sin 45^\circ} = 10 \cdot \frac{\sqrt{3}}{\sqrt{2}} = 5\sqrt{6}$.'
      - id: kp3
        name: Find an angle
        key_prerequisites: [right-triangle-trig, unit-circle]
        constraints: "choose data so sin B is an exact special value; non-obtuse, unambiguous case only"
        exemplars:
          - problem: 'In a triangle $a = 5$, $A = 30^\circ$, $b = 10$. Find $\sin B$ and the angle $B$.'
            answer: "sin B = 1, B = 90°"
            solution_sketch: '$\sin B = \frac{b \sin A}{a} = \frac{10 \cdot 1/2}{5} = 1$.'
          - problem: 'In a triangle $a = 6$, $A = 30^\circ$, $b = 6\sqrt{2}$, with $B$ acute. Find $B$.'
            answer: "45°"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°"}
            solution_sketch: '$\sin B = \frac{6\sqrt{2} \cdot 1/2}{6} = \frac{\sqrt{2}}{2}$.'
    diagnostic_exemplar:
      problem: 'In a triangle $c = 9$, $C = 60^\circ$ and $a = 3\sqrt{6}$, with $A$ acute. Find $A$.'
      answer: "45°"
      solution_sketch: '$\frac{\sin A}{a} = \frac{\sin C}{c}$ gives $\sin A = \frac{3\sqrt{6}}{9} \cdot \frac{\sqrt{3}}{2} = \frac{\sqrt{2}}{2}$.'
    anki_seeds:
      - front: "State the Law of Sines."
        back: "a/sin A = b/sin B = c/sin C"
        type: basic

