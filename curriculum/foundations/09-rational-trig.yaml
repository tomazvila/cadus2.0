"State the midline of $y=3\\sin x+(5)$ in the form y = value.","answer":"y = 5","answer_contract":{"kind":"required_assignment"}},{"problem":"State the midline of $y=3\\sin x+5$ in the form y = value.","answer":"y = 5","answer_contract":{"kind":"required_assignment"}}]},{"id":"written-1","role":"practice_fresh","variants":[{"problem":"State the midline of $y=2\\sin x+6$.","answer":"y = 6","answer_contract":{"kind":"required_assignment"}}]},{"id":"written-4","role":"practice_fresh","variants":[{"problem":"A sinusoid has maximum $11$ and minimum $3$. State its midline.","answer":"y = 7","answer_contract":{"kind":"required_assignment"}}]},{"id":"written-5","role":"practice_fresh","variants":[{"problem":"The depth of the water at a harbour entrance is modelled by $h=2\\sin t+6$, where $h$ is in metres and $t$ is in hours. What is the average depth of the water?","answer":"6","answer_contract":{"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}}]},{"id":"written-6","role":"practice_fresh","variants":[{"problem":"A mass bobs on a spring, and its height above the floor is $y=-5\\cos t+40$ centimetres. At what height does the mass hang when it is at rest?","answer":"40","answer_contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}}]},{"id":"written-7","role":"practice_fresh","variants":[{"problem":"The graph of $y=\\sin x$ is shifted down $7$ units. State the midline of the new graph.","answer":"y = -7","answer_contract":{"kind":"required_assignment"}}]}]}, "id": "kp1", "visuals": [{"kind": "curve", "x_min": "0", "x_max": "360", "y_min": "-1", "y_max": "6", "x_tick": "90", "y_tick": "1", "curve": {"family": "sine", "amplitude": "2", "period": "360", "phase": "0", "midline": "3"}, "key_points": [{"x": "0", "y": "3"}, {"x": "90", "y": "5"}, {"x": "180", "y": "3"}, {"x": "270", "y": "1"}, {"x": "360", "y": "3"}], "asymptotes": [{"axis": "horizontal", "at": "3"}], "caption": "The graph of y = 2 sin(x) + 3 has midline y = 3, maximum 5, and minimum 1."}], "name": "The midline", "key_prerequisites": ["trig-graphs-basic"], "constraints": "y = a sin x + d or y = a cos x + d with integer d from -5 to 5; the midline is the line y = d", "exemplars": [
      {"problem": "State the midline of $y=2\\sin x+6$.", "answer": "y = 6", "solution_sketch": "The sine curve oscillates about the $x$-axis, and adding $6$ lifts the whole curve by $6$. Its center line is therefore $y=6$.", "answer_contract": {"kind": "required_assignment"}},
      {"problem": "State the midline of $y=2\\cos x-1$.", "answer": "y = -1", "solution_sketch": "The extremes are $-1+2=1$ and $-1-2=-3$, and their average is $-1$. The midline is the line $y=-1$.", "answer_contract": {"kind": "required_assignment"}},
      {"problem": "The sinusoid $y=4\\sin x-5$ ranges from $-9$ to $-1$. State its midline.", "answer": "y = -5", "solution_sketch": "The midline lies halfway between the extremes, at $(-9-1)/2=-5$. The midline is the line $y=-5$.", "answer_contract": {"kind": "required_assignment"}},
      {"problem": "A sinusoid has maximum $11$ and minimum $3$. State its midline.", "answer": "y = 7", "solution_sketch": "The midline lies halfway between the maximum and the minimum. Its height is $(11+3)/2=7$, so the midline is $y=7$.", "answer_contract": {"kind": "required_assignment"}},
      {"problem": "The depth of the water at a harbour entrance is modelled by $h=2\\sin t+6$, where $h$ is in metres and $t$ is in hours. What is the average depth of the water?", "answer": "6", "solution_sketch": "Over a full cycle the sine term averages out to zero. The average depth is the midline height, $6$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "A mass bobs on a spring, and its height above the floor is $y=-5\\cos t+40$ centimetres. At what height does the mass hang when it is at rest?", "answer": "40", "solution_sketch": "At rest the mass sits at the middle of its motion, which is the midline of the graph. The cosine term has no effect there, so the height is $40$ cm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}},
      {"problem": "The graph of $y=\\sin x$ is shifted down $7$ units. State the midline of the new graph.", "answer": "y = -7", "solution_sketch": "The parent graph has midline $y=0$. Shifting everything down $7$ units moves the midline to $y=-7$.", "answer_contract": {"kind": "required_assignment"}}
    ]},
    {"id": "kp2", "visuals": [{"kind": "curve", "x_min": "0", "x_max": "360", "y_min": "-1", "y_max": "6", "x_tick": "90", "y_tick": "1", "curve": {"family": "sine", "amplitude": "2", "period": "360", "phase": "0", "midline": "3"}, "key_points": [{"x": "0", "y": "3"}, {"x": "90", "y": "5"}, {"x": "180", "y": "3"}, {"x": "270", "y": "1"}, {"x": "360", "y": "3"}], "asymptotes": [{"axis": "horizontal", "at": "3"}], "caption": "The graph of y = 2 sin(x) + 3 has midline y = 3, maximum 5, and minimum 1."}], "name": "Maximum and minimum with a shift", "key_prerequisites": ["trig-graphs-basic"], "constraints": "integer amplitude and integer vertical shift; the maximum is d + a and the minimum is d - a", "exemplars": [
      {"problem": "Find the maximum and minimum values of $y=2\\sin x+5$.", "answer": "7, 3", "solution_sketch": "Since $-1\\le\\sin x\\le1$, the term $2\\sin x$ runs from $-2$ to $2$. Adding $5$ gives a maximum of $7$ and a minimum of $3$.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "Find the maximum and minimum values of $y=-3\\cos x-2$.", "answer": "1, -5", "solution_sketch": "The negative multiplier reverses the extremes of the parent curve. Then $-3(-1)-2=1$ is the maximum and $-3(1)-2=-5$ is the minimum.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "A sinusoid has midline $y=1$ and amplitude $4$. Find its maximum and minimum values.", "answer": "5, -3", "solution_sketch": "The graph reaches one amplitude above and one amplitude below its midline. These heights are $1+4=5$ and $1-4=-3$.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "The temperature in a greenhouse is modelled by $T=6\\sin t+22$ degrees Celsius, where $t$ is the time in hours. What are the highest and the lowest temperatures?", "answer": "28, 16", "solution_sketch": "The sine term swings between $-6$ and $6$ about the midline $22$. The highest temperature is $22+6=28$ and the lowest is $22-6=16$.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "A sine graph ranges from $-2$ to $2$ and is then shifted down $6$ units. Find the new maximum and minimum values.", "answer": "-4, -8", "solution_sketch": "Shifting moves each extreme by the same amount. The maximum becomes $2-6=-4$ and the minimum becomes $-2-6=-8$.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "The height of a buoy above the sea floor is $h=3\\sin t+9$ metres, where $t$ is the time in minutes. What are its greatest and its least heights?", "answer": "12, 6", "solution_sketch": "The wave moves the buoy $3$ m above and $3$ m below its middle height of $9$ m. The greatest height is $12$ m and the least height is $6$ m.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "Does the graph of $y=2\\sin x+5$ ever reach the height $y=8$?", "answer": "no", "solution_sketch": "The maximum of $2\\sin x+5$ is $2+5=7$. Since $8$ is above $7$, the graph never reaches the height $8$.", "answer_contract": {"kind": "label", "options": [["no", "it does not", "never", "it never does", "it does not reach it"], ["yes", "it does", "it reaches it", "it does reach it"]]}}
    ]},
    {"id": "kp3", "visuals": [{"kind": "curve", "x_min": "0", "x_max": "360", "y_min": "-1", "y_max": "6", "x_tick": "90", "y_tick": "1", "curve": {"family": "sine", "amplitude": "2", "period": "360", "phase": "0", "midline": "3"}, "key_points": [{"x": "0", "y": "3"}, {"x": "90", "y": "5"}, {"x": "180", "y": "3"}, {"x": "270", "y": "1"}, {"x": "360", "y": "3"}], "asymptotes": [{"axis": "horizontal", "at": "3"}], "caption": "The graph of y = 2 sin(x) + 3 has midline y = 3, maximum 5, and minimum 1."}], "name": "Recover amplitude and midline from max and min", "key_prerequisites": ["trig-graphs-basic"], "constraints": "max/min pairs with integer midline and amplitude", "exemplars": [
      {"problem": "A sinusoid oscillates between $2$ and $8$. Find its midline and its amplitude.", "answer": "5, 3", "solution_sketch": "The midline is the average of the extremes, $(8+2)/2=5$. The amplitude is half their difference, $(8-2)/2=3$.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "A sinusoid reaches its maximum $10$ at $x=0$ and its minimum $-4$ at $x=\\pi$. Find its midline and its amplitude.", "answer": "3, 7", "solution_sketch": "The midline height is $(10-4)/2=3$ and the amplitude is $(10+4)/2=7$. The horizontal positions of the extremes do not change either value.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "The graph of $y=d+a\\sin x$, with $a>0$, has maximum $11$ and minimum $3$. Find $d$ and $a$.", "answer": "7, 4", "solution_sketch": "The maximum is $d+a=11$ and the minimum is $d-a=3$. Adding the two equations gives $2d=14$, so $d=7$, and then $a=4$.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "A sensor signal is a sinusoid that ranges from $-7$ to $-1$. The display is then raised by $2$. Find the midline and the amplitude of the displayed signal.", "answer": "-2, 3", "solution_sketch": "The original midline is $(-7-1)/2=-4$ and the amplitude is $3$. Raising the display by $2$ moves the midline to $-2$ and keeps the amplitude $3$.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "A rider on a Ferris wheel is $2$ m above the ground at the lowest point and $52$ m above the ground at the highest point. How high above the ground is the axle, and what is the radius of the wheel, in metres?", "answer": "27, 25", "solution_sketch": "The axle sits at the midline height, $(52+2)/2=27$ m. The radius is the amplitude, $(52-2)/2=25$ m.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "The depth of water in a tidal basin varies between $3$ m and $11$ m. Find the mean depth and the amplitude of the variation, in metres.", "answer": "7, 4", "solution_sketch": "The mean depth is the midline, $(11+3)/2=7$ m. The amplitude is half the range, $(11-3)/2=4$ m.", "answer_contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}},
      {"problem": "A graph of the form $y=a\\sin x+d$, with $a>0$, has maximum $9$ and minimum $-3$. Write its equation.", "answer": "y = 6 sin(x) + 3", "solution_sketch": "The midline is $d=(9-3)/2=3$ and the amplitude is $a=(9+3)/2=6$. The equation is $y=6\\sin x+3$.", "answer_contract": {"kind": "function", "vars": ["x"]}}
    ]}
  ]},
  {"id": "pythagorean-identity", "name": "The Pythagorean Identity", "core": true, "difficulty": 0.65, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "unit-circle", "weight": 0.6, "key": true}, {"id": "trig-ratios-definition", "weight": 0.4}, {"id": "pythagorean-theorem", "weight": 0.4}], "diagnostic_exemplar": {"problem": "If $\\cos \\theta = -\\frac{3}{5}$ and $\\theta$ is in Quadrant III, find $\\sin \\theta$.", "answer": "-4/5", "solution_sketch": "$\\sin^2\\theta = 1 - \\frac{9}{25} = \\frac{16}{25}$; in Quadrant III sine is negative."}, "anki_seeds": [{"front": "State the Pythagorean identity.", "back": "sin²θ + cos²θ = 1", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "State and verify the identity", "key_prerequisites": ["unit-circle", "pythagorean-theorem"], "constraints": "verify at a special angle, or read the identity off the unit-circle equation x^2 + y^2 = 1; the value is always 1", "try_first": {"problem": "A point $(x,y)$ lies on the unit circle with $x=0.6$ and $y>0$. Find $y$.", "answer_contract": {"kind": "exact"}, "answer": "0.8", "reveal": "The point is $1$ unit from the center, so $x^2+y^2=1$ and $y^2=1-0.36=0.64$. Written with cosine and sine, this relation is the Pythagorean identity."}, "exemplars": [
      {"problem": "Compute $\\sin^2(\\pi/3)+\\cos^2(\\pi/3)$.", "answer": "1", "solution_sketch": "Substitute the special values and square them: $(\\sqrt3/2)^2+(1/2)^2=3/4+1/4$. The sum is $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A point $(x,y)$ on the unit circle has $x^2=\\frac{9}{25}$. What is $y^2$?", "answer": "16/25", "solution_sketch": "Every point of the unit circle satisfies $x^2+y^2=1$. So the square of the missing coordinate is $y^2=1-9/25=16/25$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A right triangle has legs $3$ and $4$ and hypotenuse $5$. What is $(3/5)^2+(4/5)^2$?", "answer": "1", "solution_sketch": "Dividing the equation $3^2+4^2=5^2$ by $25$ on both sides gives $9/25+16/25=25/25$. The value of the sum is $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Evaluate $4\\sin^2 25^\\circ+4\\cos^2 25^\\circ$.", "answer": "4", "solution_sketch": "Factor out $4$ to get $4(\\sin^2 25^\\circ+\\cos^2 25^\\circ)$. The bracket equals $1$ for every angle, so the value is $4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A point on the rim of a wheel of radius $1$ m lies $\\cos\\theta$ metres to the right of the axle and $\\sin\\theta$ metres above it. Find $\\sin^2\\theta+\\cos^2\\theta$.", "answer": "1", "solution_sketch": "The point is on a circle of radius $1$ around the axle, so its coordinates satisfy $x^2+y^2=1$. Hence $\\sin^2\\theta+\\cos^2\\theta=1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\sin^2\\theta=\\frac{7}{16}$, find $\\cos^2\\theta$.", "answer": "9/16", "solution_sketch": "The squares of sine and cosine always add to $1$ for the same angle. So $\\cos^2\\theta=1-7/16=9/16$.", "answer_contract": {"kind": "exact"}},
      {"problem": "What is the value of $\\sin^2 30^\\circ+\\cos^2 30^\\circ$?", "answer": "1", "solution_sketch": "Square the two values before the addition. The sum is $(1/2)^2+(\\sqrt3/2)^2=1/4+3/4=1$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "40", "ray_length": "3", "label": "\u03b8 in Quadrant I"}, "caption": "An angle \u03b8 in Quadrant I, where cosine is positive."}], "name": "Find cosine from sine in Quadrant I", "key_prerequisites": ["unit-circle"], "constraints": "first-quadrant angles only, so both ratios are positive; Pythagorean-triple fractions such as 3/5 or 5/13", "exemplars": [
      {"problem": "If $\\sin\\theta=\\frac35$ and $\\theta$ is in Quadrant I, find $\\cos\\theta$.", "answer": "4/5", "solution_sketch": "The identity gives $\\cos^2\\theta=1-9/25=16/25$. Quadrant I selects the positive square root, so $\\cos\\theta=4/5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\cos\\theta=\\frac{5}{13}$ and $\\theta$ is in Quadrant I, find $\\sin\\theta$.", "answer": "12/13", "solution_sketch": "The identity gives $\\sin^2\\theta=1-25/169=144/169$. Quadrant I selects the positive square root, so $\\sin\\theta=12/13$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A point in Quadrant I of the unit circle has vertical coordinate $\\frac{8}{17}$. Find its horizontal coordinate.", "answer": "15/17", "solution_sketch": "The unit circle equation $x^2+y^2=1$ gives $x^2=1-64/289=225/289$. In Quadrant I the coordinate $x$ is positive, so $x=15/17$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For an acute angle $\\theta$, $\\sin\\theta=\\frac{7}{25}$. Find $\\cos\\theta$.", "answer": "24/25", "solution_sketch": "The identity gives $\\cos^2\\theta=1-49/625=576/625$. An acute angle has a positive cosine, so $\\cos\\theta=24/25$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A wheel has radius $1$ m. A marker on its rim is $0.28$ m above the level of the axle, on the right-hand side. How far to the right of the axle is the marker?", "answer": "0.96", "solution_sketch": "The marker is a point of a circle of radius $1$, so $x^2+0.28^2=1$ and $x^2=1-0.0784=0.9216$. The distance to the right of the axle is $x=0.96$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "Given $\\sin\\theta=0.8$ for an angle in Quadrant I, what is the value of $\\cos\\theta$?", "answer": "0.6", "solution_sketch": "The squares add to $1$, not the ratios. So $\\cos^2\\theta=1-0.64=0.36$, and the positive root gives $\\cos\\theta=0.6$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\cos\\theta=\\frac{20}{29}$ and $\\theta$ is in Quadrant I, find $\\sin\\theta$.", "answer": "21/29", "solution_sketch": "The identity gives $\\sin^2\\theta=1-400/841=441/841$. Quadrant I selects the positive square root, so $\\sin\\theta=21/29$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A bead slides on a circular wire of radius $1$ m. With the centre of the wire as the origin, the bead is in Quadrant I and $0.6$ m above the horizontal axis. How far is the bead to the right of the vertical axis?", "answer": "0.8", "solution_sketch": "The bead's coordinates satisfy $x^2+y^2=1$, so $x^2=1-0.6^2=0.64$. The bead is in Quadrant I, so $x$ is positive and $x=0.8$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}
    ]},
    {"id": "kp3", "visuals": [{"kind": "geometry", "figure": {"shape": "angle", "vertex": {"x": "0", "y": "0"}, "initial_degrees": "0", "terminal_degrees": "160", "ray_length": "3", "label": "\u03b8 in Quadrant II"}, "caption": "An angle \u03b8 in Quadrant II, where cosine is negative."}], "name": "Use quadrant signs", "key_prerequisites": ["unit-circle"], "constraints": "Pythagorean-triple ratios; quadrant given explicitly", "exemplars": [
      {"problem": "If $\\sin\\theta=\\frac45$ and $\\theta$ is in Quadrant II, find $\\cos\\theta$.", "answer": "-3/5", "solution_sketch": "$\\cos^2\\theta=1-(4/5)^2=9/25$. The two square roots are $\\pm3/5$, and cosine is negative in Quadrant II, so $\\cos\\theta=-3/5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\cos\\theta=-\\frac{8}{17}$ and $\\theta$ is in Quadrant III, find $\\sin\\theta$.", "answer": "-15/17", "solution_sketch": "The identity gives $\\sin^2\\theta=1-64/289=225/289$. Sine is negative in Quadrant III, so $\\sin\\theta=-15/17$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\sin\\theta=-\\frac{12}{13}$ and $\\theta$ is in Quadrant IV, find $\\cos\\theta$.", "answer": "5/13", "solution_sketch": "The identity gives $\\cos^2\\theta=1-144/169=25/169$. Cosine is positive in Quadrant IV, so $\\cos\\theta=5/13$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A marker on a wheel of radius $1$ m is $0.6$ m to the left of the axle and below the level of the axle. Take the axle as the origin and up as the positive direction. What is the vertical coordinate of the marker?", "answer": "-0.8", "solution_sketch": "The coordinates satisfy $0.6^2+y^2=1$, so $y^2=0.64$ and $y=\\pm0.8$. The marker is below the axle, so $y=-0.8$.", "answer_contract": {"kind": "exact"}},
      {"problem": "The point $(\\frac{20}{29}, y)$ lies on the unit circle below the $x$-axis. Find $y$.", "answer": "-21/29", "solution_sketch": "The unit circle equation gives $y^2=1-400/841=441/841$, so $y=\\pm21/29$. The point is below the $x$-axis, so $y=-21/29$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\sin\\theta=\\frac35$ and $\\theta$ is in Quadrant II, what is the value of $\\cos\\theta$?", "answer": "-4/5", "solution_sketch": "The identity gives $\\cos^2\\theta=1-9/25=16/25$, so $\\cos\\theta=\\pm4/5$. Cosine is negative in Quadrant II, so $\\cos\\theta=-4/5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\cos\\theta=-\\frac{7}{25}$ and $\\theta$ is in Quadrant II, find $\\sin\\theta$.", "answer": "24/25", "solution_sketch": "The identity gives $\\sin^2\\theta=1-49/625=576/625$. Sine is positive in Quadrant II, so $\\sin\\theta=24/25$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A bead slides on a circular wire of radius $1$ m. With the centre of the wire as the origin, the bead is on the left-hand side and $0.28$ m below the horizontal axis. Take right as the positive direction. What is the horizontal coordinate of the bead?", "answer": "-0.96", "solution_sketch": "The bead's coordinates satisfy $x^2+y^2=1$, so $x^2=1-0.28^2=0.9216$ and $x=\\pm0.96$. The bead is on the left-hand side, so $x=-0.96$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}
    ]}
  ]},
  {"id": "trig-identities-basic", "name": "Basic Trigonometric Identities", "core": true, "difficulty": 0.7, "drill": false, "answer_kind": "expression", "expected_time_secs": 150, "prerequisites": [{"id": "pythagorean-identity", "weight": 0.7, "key": true}, {"id": "unit-circle", "weight": 0.4}, {"id": "reciprocal-trig-functions", "weight": 0.4}, {"id": "rational-expressions", "weight": 0.2}], "diagnostic_exemplar": {"problem": "If $\\tan \\theta = -\\frac{5}{12}$ and $\\theta$ is in Quadrant IV, find $\\sin \\theta$.", "answer": "-5/13", "solution_sketch": "The reference triangle has legs $5$ and $12$, so the hypotenuse is $13$; in Quadrant IV sine is negative."}, "anki_seeds": [{"front": "tan θ = ?", "back": "sin θ / cos θ", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "The quotient identity for tangent", "key_prerequisites": ["unit-circle"], "constraints": "tan = sin over cos; ratios given as Pythagorean-triple fractions, or the answer is the symbolic identity itself", "try_first": {"problem": "A straight path is $41$ m long. It rises $9$ m and covers a horizontal distance of $40$ m. How many metres does it rise for each metre of horizontal distance?", "answer_contract": {"kind": "exact"}, "answer": "9/40", "reveal": "The rise per metre of horizontal distance is $9/40$. Since $\\sin\\theta=9/41$ and $\\cos\\theta=40/41$, this is $\\sin\\theta/\\cos\\theta$, which is the quotient identity for $\\tan\\theta$."}, "exemplars": [
      {"problem": "If $\\sin\\theta=\\frac35$ and $\\cos\\theta=\\frac45$, find $\\tan\\theta$.", "answer": "3/4", "solution_sketch": "The quotient identity says tangent is sine divided by cosine. So $\\tan\\theta=(3/5)/(4/5)=(3/5)(5/4)=3/4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\sin x/\\cos x$ where $\\cos x\\ne0$.", "answer": "tan(x)", "solution_sketch": "The quotient identity defines tangent as sine divided by cosine on this domain. So the expression is $\\tan x$.", "answer_contract": {"kind": "function", "vars": ["x"]}},
      {"problem": "A point on the unit circle is $(\\frac{12}{13},\\frac{5}{13})$. Find the tangent of its angle.", "answer": "5/12", "solution_sketch": "The tangent of the angle is the slope of the line from the origin to the point. It is $y/x=(5/13)/(12/13)=5/12$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ramp makes an angle $\\theta$ with the ground, where $\\sin\\theta=\\frac{7}{25}$ and $\\cos\\theta=\\frac{24}{25}$. How many metres does the ramp rise for each metre of horizontal distance?", "answer": "7/24", "solution_sketch": "The rise per unit of horizontal distance is $\\tan\\theta=\\sin\\theta/\\cos\\theta$. This is $(7/25)/(24/25)=7/24$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ski slope makes an angle $\\theta$ with the horizontal, where $\\sin\\theta=0.6$ and $\\cos\\theta=0.8$. By how many metres does the slope drop over a horizontal distance of $40$ m?", "answer": "30", "solution_sketch": "The drop per metre of horizontal distance is $\\tan\\theta=0.6/0.8=0.75$. Over $40$ m the drop is $0.75\\cdot40=30$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "Given $\\sin\\theta=\\frac45$ and $\\cos\\theta=\\frac35$, what is the value of $\\tan\\theta$?", "answer": "4/3", "solution_sketch": "Tangent is sine divided by cosine, not multiplied by it. So $\\tan\\theta=(4/5)/(3/5)=4/3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\tan\\theta=2$ and $\\cos\\theta=\\frac{1}{\\sqrt5}$ in Quadrant I, find $\\sin\\theta$.", "answer": "2*sqrt(5)/5", "solution_sketch": "Rearrange the quotient identity to $\\sin\\theta=\\tan\\theta\\cos\\theta=2\\cdot(1/\\sqrt5)=2/\\sqrt5$. Rationalizing the denominator of this fraction gives $2\\sqrt5/5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\sin\\theta=-\\frac{8}{17}$ and $\\cos\\theta=\\frac{15}{17}$, find $\\tan\\theta$.", "answer": "-8/15", "solution_sketch": "The quotient identity gives $\\tan\\theta=(-8/17)/(15/17)$. Multiplying by the reciprocal of the divisor gives $(-8/17)(17/15)=-8/15$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Simplify expressions using identities", "key_prerequisites": ["pythagorean-identity", "reciprocal-trig-functions"], "constraints": "one-step simplifications using the Pythagorean and quotient identities; the answer is a single trig function", "exemplars": [
      {"problem": "Simplify $1-\\cos^2\\theta$.", "answer": "sin^2 θ", "solution_sketch": "Subtract $\\cos^2\\theta$ from both sides of the identity $\\sin^2\\theta+\\cos^2\\theta=1$. This gives $1-\\cos^2\\theta=\\sin^2\\theta$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{\\sin^2\\theta+\\cos^2\\theta}{\\cos\\theta}$ where $\\cos\\theta\\ne0$.", "answer": "sec θ", "solution_sketch": "The numerator is $1$, so the expression is $\\frac{1}{\\cos\\theta}$. That is $\\sec\\theta$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\tan\\theta\\cos\\theta$.", "answer": "sin θ", "solution_sketch": "Replace $\\tan\\theta$ by $\\sin\\theta/\\cos\\theta$ in the product. The two cosines cancel, and only $\\sin\\theta$ remains.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\cos\\theta/\\sin\\theta$ where $\\sin\\theta\\ne0$.", "answer": "cot θ", "solution_sketch": "Cotangent is the reciprocal of tangent, and the reciprocal of $\\sin\\theta/\\cos\\theta$ is $\\cos\\theta/\\sin\\theta$. So the expression is $\\cot\\theta$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $1-\\sin^2\\theta$.", "answer": "cos^2 θ", "solution_sketch": "The identity $\\sin^2\\theta+\\cos^2\\theta=1$ gives $1-\\sin^2\\theta=\\cos^2\\theta$. The result is the square of the cosine.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{1-\\sin^2\\theta}{\\cos\\theta}$ where $\\cos\\theta\\ne0$.", "answer": "cos θ", "solution_sketch": "The numerator equals $\\cos^2\\theta$ by the Pythagorean identity. Dividing $\\cos^2\\theta$ by $\\cos\\theta$ leaves $\\cos\\theta$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{\\sin^2\\theta+\\cos^2\\theta}{\\sin\\theta}$ where $\\sin\\theta\\ne0$.", "answer": "csc θ", "solution_sketch": "The numerator is $1$, so the expression is $\\frac{1}{\\sin\\theta}$. That is $\\csc\\theta$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Find all ratios from one", "key_prerequisites": ["pythagorean-identity", "unit-circle"], "constraints": "Pythagorean-triple ratios; quadrant given", "exemplars": [
      {"problem": "If $\\tan\\theta=\\frac34$ and $\\theta$ is in Quadrant III, find $\\sin\\theta$.", "answer": "-3/5", "solution_sketch": "A $3$-$4$-$5$ reference triangle gives magnitude $3/5$. Sine is negative in Quadrant III, so $\\sin\\theta=-3/5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\sec\\theta=\\frac53$ and $\\theta$ is in Quadrant IV, find $\\tan\\theta$.", "answer": "-4/3", "solution_sketch": "$\\cos\\theta=3/5$, and sine is negative in Quadrant IV, so $\\sin\\theta=-4/5$. Then $\\tan\\theta=(-4/5)/(3/5)=-4/3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A road climbs a hill at a gradient $\\tan\\theta=\\frac34$. After travelling $50$ m along the road, how many metres has the road risen?", "answer": "30", "solution_sketch": "The reference triangle has sides $3$, $4$ and $5$, so $\\sin\\theta=3/5$. The rise is $50\\cdot3/5=30$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "If $\\tan\\theta=-\\frac{12}{5}$ and $\\theta$ is in Quadrant II, find $\\cos\\theta$.", "answer": "-5/13", "solution_sketch": "A $5$-$12$-$13$ reference triangle gives magnitude $5/13$. Cosine is negative in Quadrant II, so $\\cos\\theta=-5/13$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ramp has $\\tan\\theta=\\frac{5}{12}$, where $\\theta$ is the angle with the ground. How long must the ramp surface be to rise $10$ m?", "answer": "26", "solution_sketch": "The reference triangle has sides $5$, $12$ and $13$, so $\\sin\\theta=5/13$. The length is $10\\div(5/13)=26$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "If $\\csc\\theta=\\frac{25}{7}$ and $\\theta$ is in Quadrant II, find $\\tan\\theta$.", "answer": "-7/24", "solution_sketch": "$\\sin\\theta=7/25$, and the reference triangle has sides $7$, $24$ and $25$. Cosine is negative in Quadrant II, so $\\tan\\theta=-7/24$.", "answer_contract": {"kind": "exact"}},
      {"problem": "The terminal side of an angle $\\theta$ in standard position passes through $(-8,-15)$. Find $\\cos\\theta$.", "answer": "-8/17", "solution_sketch": "The distance from the origin is $\\sqrt{64+225}=17$. The cosine is the horizontal coordinate over this distance, $-8/17$.", "answer_contract": {"kind": "exact"}},
      {"problem": "If $\\tan\\theta=-\\frac{8}{15}$ and $\\theta$ is in Quadrant IV, what is the value of $\\cos\\theta$?", "answer": "15/17", "solution_sketch": "The reference triangle has sides $8$, $15$ and $17$. Cosine is positive in Quadrant IV, so $\\cos\\theta=15/17$.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "law-of-sines", "name": "The Law of Sines", "core": false, "difficulty": 0.7, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 180, "prerequisites": [{"id": "right-triangle-trig", "weight": 0.7, "key": true}, {"id": "unit-circle", "weight": 0.4}, {"id": "ratios-proportions", "weight": 0.3}], "diagnostic_exemplar": {"problem": "In a triangle $c = 9$, $C = 60^\\circ$ and $a = 3\\sqrt{6}$, with $A$ acute. Find $A$.", "answer": "45°", "solution_sketch": "$\\frac{\\sin A}{a} = \\frac{\\sin C}{c}$ gives $\\sin A = \\frac{3\\sqrt{6}}{9} \\cdot \\frac{\\sqrt{3}}{2} = \\frac{\\sqrt{2}}{2}$."}, "anki_seeds": [{"front": "State the Law of Sines.", "back": "a/sin A = b/sin B = c/sin C", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Find a side (AAS/ASA)", "key_prerequisites": ["right-triangle-trig", "ratios-proportions"], "constraints": "a/sin A = b/sin B = c/sin C; use special-angle sines", "try_first": {"problem": "In a triangle, $A=30^\\circ$, $B=90^\\circ$ and $a=6$. Find $b$.", "answer_contract": {"kind": "exact"}, "answer": "12", "reveal": "The side opposite the right angle is the hypotenuse, and $\\sin30^\\circ=1/2$ gives $6=b/2$. The sine rule says the same: $b/\\sin90^\\circ=6/\\sin30^\\circ$."}, "exemplars": [
      {"problem": "A triangle has $a=10$, $A=30^\\circ$ and $B=45^\\circ$. Find $b$ exactly.", "answer": "10*sqrt(2)", "solution_sketch": "The sine rule pairs each side with its opposite angle, so $b=10\\sin45^\\circ/\\sin30^\\circ=10(\\sqrt2/2)/(1/2)$. This simplifies to $10\\sqrt2$.", "answer_contract": {"kind": "required_simplest_radical"}},
      {"problem": "In a triangle $A=60^\\circ$, $B=30^\\circ$ and $a=9\\sqrt3$. Find $b$.", "answer": "9", "solution_sketch": "The sine rule gives $b=9\\sqrt3\\sin30^\\circ/\\sin60^\\circ=9\\sqrt3(1/2)/(\\sqrt3/2)$. The factor $\\sqrt3$ cancels from the top and the bottom, and $b=9$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In a triangle $a=8$, $A=30^\\circ$ and $B=90^\\circ$. Find $b$.", "answer": "16", "solution_sketch": "Use the sine rule $b/\\sin90^\\circ=8/\\sin30^\\circ$ with $\\sin90^\\circ=1$. This gives $b=8/(1/2)=16$, twice the side $a$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A triangular sail has an edge of $6$ m opposite a corner of $45^\\circ$. Another corner measures $60^\\circ$. How long is the edge opposite the $60^\\circ$ corner, to one decimal place?", "answer": "7.3", "solution_sketch": "The sine rule gives $b=6\\sin60^\\circ/\\sin45^\\circ=6\\sqrt3/\\sqrt2=3\\sqrt6$. This is 7.3 m to one decimal place.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "A triangle has angles of $30^\\circ$ and $45^\\circ$. How many times as long as the side opposite the $30^\\circ$ angle is the side opposite the $45^\\circ$ angle, to two decimal places?", "answer": "1.41", "solution_sketch": "The sides are in the ratio of the sines of their opposite angles. So the ratio is $\\sin45^\\circ/\\sin30^\\circ=\\sqrt2$, which is $1.41$ to two decimal places.", "answer_contract": {"kind": "approx", "decimals": 2}},
      {"problem": "A triangular sail has two corners of $45^\\circ$. The edge opposite one of them is $7$ m long. How long is the edge opposite the other $45^\\circ$ corner?", "answer": "7", "solution_sketch": "Equal angles have equal sines, so the sine rule gives equal opposite sides. The other edge is $7$ m long.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}
    ]},
    {"id": "kp2", "name": "Find the third angle first", "key_prerequisites": ["right-triangle-trig"], "constraints": "two angles given, so the third comes from the 180 degree sum; angles drawn from 30, 45, 60, 75 and 105 degrees so answers stay exact radicals", "exemplars": [
      {"problem": "In a triangle $A=30^\\circ$, $C=105^\\circ$ and $a=6$. Find $b$ exactly.", "answer": "6*sqrt(2)", "solution_sketch": "The angles of a triangle add to $180^\\circ$, so $B=180^\\circ-30^\\circ-105^\\circ=45^\\circ$. Then $b=6\\sin45^\\circ/\\sin30^\\circ=6\\sqrt2$.", "answer_contract": {"kind": "required_simplest_radical"}},
      {"problem": "A triangle has $A=45^\\circ$, $B=60^\\circ$ and $c=\\sqrt6+\\sqrt2$. Given that $\\sin75^\\circ=\\frac{\\sqrt6+\\sqrt2}{4}$, find $a$.", "answer": "2*sqrt(2)", "solution_sketch": "The angles of a triangle add to $180^\\circ$, so $C=75^\\circ$. Then $a=c\\sin45^\\circ/\\sin75^\\circ=4(\\sqrt2/2)=2\\sqrt2$.", "answer_contract": {"kind": "required_simplest_radical"}},
      {"problem": "In a triangle $A=75^\\circ$, $B=75^\\circ$ and $a=\\sqrt6+\\sqrt2$. Given that $\\sin75^\\circ=\\frac{\\sqrt6+\\sqrt2}{4}$, find $c$.", "answer": "2", "solution_sketch": "The angles of a triangle add to $180^\\circ$, so $C=30^\\circ$. Then $c=a\\sin30^\\circ/\\sin75^\\circ=(1/2)\\cdot4=2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In a triangle $A=30^\\circ$, $B=105^\\circ$ and $c=5\\sqrt2$. Find $a$.", "answer": "5", "solution_sketch": "The angles of a triangle add to $180^\\circ$, so $C=45^\\circ$. Then $a=5\\sqrt2\\sin30^\\circ/\\sin45^\\circ=5\\sqrt2(1/2)/(\\sqrt2/2)=5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Two lookouts $A$ and $B$ stand $8$ km apart on a straight coast and sight a ship $S$ at sea. The angle $SAB$ is $40^\\circ$ and the angle $SBA$ is $65^\\circ$. How far is the ship from $A$, to one decimal place?", "answer": "7.5", "solution_sketch": "The angle at the ship is $180^\\circ-40^\\circ-65^\\circ=75^\\circ$. The distance $AS$ is opposite the $65^\\circ$ angle, so $AS=8\\sin65^\\circ/\\sin75^\\circ=7.5$ km.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}},
      {"problem": "A triangular plot has corner angles of $50^\\circ$ and $70^\\circ$, and the side between those two corners is $90$ m long. How long is the shortest side of the plot, to one decimal place?", "answer": "79.6", "solution_sketch": "The third angle is $60^\\circ$, and the $90$ m side is opposite it. The shortest side is opposite the smallest angle $50^\\circ$, so it is $90\\sin50^\\circ/\\sin60^\\circ=79.6$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}
    ]},
    {"id": "kp3", "name": "Find an angle", "key_prerequisites": ["right-triangle-trig", "unit-circle"], "constraints": "choose data so sin B is an exact special value; acute unless the question states an obtuse angle; special angles only", "exemplars": [
      {"problem": "In a triangle $a=6$, $A=30^\\circ$ and $b=6\\sqrt2$, and $B$ is acute. Find $B$.", "answer": "45", "solution_sketch": "The sine rule gives $\\sin B=6\\sqrt2\\sin30^\\circ/6=\\sqrt2/2$. The acute angle with this sine is $45^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "In a triangle $a=5$, $A=30^\\circ$ and $b=10$. Find $B$.", "answer": "90", "solution_sketch": "$\\sin B=10(1/2)/5=1$. The only angle of a triangle with sine $1$ is $90^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "Two sides of a triangle have equal lengths $a=b=8$, and $A=60^\\circ$. Find $B$.", "answer": "60", "solution_sketch": "Equal sides lie opposite equal angles, so $B=60^\\circ$. The other angle with sine $\\sqrt3/2$, $120^\\circ$, would leave no room for the third angle.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "In a triangle $b/\\sin B=12$ and $b=6$, with $B$ acute. Find $B$.", "answer": "30", "solution_sketch": "Rearrange to $\\sin B=6/12=1/2$. The acute angle with this sine is $30^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "A triangular garden bed has a side of $12$ m opposite a corner of $45^\\circ$. Another side of $6\\sqrt6$ m is opposite an acute corner. How large is that corner?", "answer": "60", "solution_sketch": "The sine rule gives $\\sin B=6\\sqrt6\\sin45^\\circ/12=\\sqrt3/2$. The acute angle with this sine is $60^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "A triangular frame has a brace of $10$ m opposite a corner of $45^\\circ$. Another brace of $5\\sqrt2$ m is opposite an acute corner. How large is that corner?", "answer": "30", "solution_sketch": "The sine rule gives $\\sin B=5\\sqrt2\\sin45^\\circ/10=1/2$. The acute angle with this sine is $30^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "In a triangle $a=6$, $A=30^\\circ$ and $b=6\\sqrt2$, and $B$ is obtuse. Find $B$.", "answer": "135", "solution_sketch": "As before $\\sin B=\\sqrt2/2$, so $B$ is $45^\\circ$ or $180^\\circ-45^\\circ=135^\\circ$. The obtuse angle is $135^\\circ$, and $30^\\circ+135^\\circ<180^\\circ$ leaves room for the third angle.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}}
    ]}
  ]},
  {"id": "law-of-cosines", "name": "The Law of Cosines", "core": false, "difficulty": 0.7, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 180, "prerequisites": [{"id": "right-triangle-trig", "weight": 0.7, "key": true}, {"id": "unit-circle", "weight": 0.4}, {"id": "pythagorean-theorem", "weight": 0.4}], "diagnostic_exemplar": {"problem": "A triangle has sides $6$, $10$ and $14$. Find the angle opposite the side of length $14$.", "answer": "120°", "solution_sketch": "The largest side faces the largest angle: $\\cos C = \\frac{36 + 100 - 196}{2(6)(10)} = -\\frac{1}{2}$."}, "anki_seeds": [{"front": "State the Law of Cosines for side a.", "back": "a² = b² + c² - 2bc·cos A", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Find a side (SAS)", "key_prerequisites": ["right-triangle-trig"], "constraints": "a^2 = b^2 + c^2 - 2bc·cos A; special-angle cosines (30, 45, 60, 90 degrees); lengths in plain and measured contexts", "try_first": {"problem": "A right triangle has legs $6$ and $8$. What is the length of its hypotenuse?", "answer_contract": {"kind": "exact"}, "answer": "10", "reveal": "The hypotenuse is $\\sqrt{36+64}=10$. The Law of Cosines adds the term $-2bc\\cos A$ to this sum, and that term is $0$ when the angle is $90^\\circ$, so the law reaches every included angle."}, "exemplars": [
      {"problem": "In triangle $ABC$, the sides $b=5$ and $c=7$ enclose the angle $A=60^\\circ$. Find the side $a$.", "answer": "sqrt(39)", "solution_sketch": "The side $a$ faces $A$, so $a^2=5^2+7^2-2(5)(7)\\cos60^\\circ=25+49-35=39$. A length is positive, so $a=\\sqrt{39}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In triangle $ABC$, the sides $b=3$ and $c=4$ enclose a right angle $A$. Find the side $a$.", "answer": "5", "solution_sketch": "The cosine of a right angle is $0$, so the cross term vanishes and $a^2=3^2+4^2=25$. Hence $a=5$, which is the Pythagorean theorem.", "answer_contract": {"kind": "exact"}},
      {"problem": "Two hikers leave a hut along paths that make an angle of $60^\\circ$. One hiker walks $8$ km and the other walks $15$ km. How far apart are they?", "answer": "13", "solution_sketch": "The two paths and the line between the hikers form a triangle with the included angle $60^\\circ$. So $d^2=8^2+15^2-2(8)(15)\\cos60^\\circ=64+225-120=169$ and $d=13$ km.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}},
      {"problem": "The blades of a pair of scissors are $15$ cm long. They are opened until the angle between them is $90^\\circ$. How far apart are the tips of the blades?", "answer": "15*sqrt(2)", "solution_sketch": "The tips and the pivot form a triangle with two sides of $15$ cm and an included angle of $90^\\circ$. So $d^2=15^2+15^2-2(15)(15)\\cos90^\\circ=450$ and $d=\\sqrt{450}=15\\sqrt2$ cm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true, "form": "simplest_radical"}},
      {"problem": "Two rods of length $2$ m and $3$ m are hinged at one end and opened to an angle of $45^\\circ$. How far apart are the free ends?", "answer": "sqrt(13-6*sqrt(2))", "solution_sketch": "The free ends and the hinge form a triangle with the included angle $45^\\circ$. So $d^2=2^2+3^2-2(2)(3)\\cos45^\\circ=13-12\\cdot\\tfrac{\\sqrt2}{2}=13-6\\sqrt2$, and $d=\\sqrt{13-6\\sqrt2}$ m, about $2.1$ m.", "answer_contract": {"kind": "exact"}},
      {"problem": "A triangle has $b=5$, $c=8$ and the included angle $A=60^\\circ$. What is the value of the side $a$?", "answer": "7", "solution_sketch": "Include the factor $\\cos60^\\circ=\\tfrac12$. The line is $a^2=25+64-2(5)(8)\\cdot\\tfrac12=49$, so $a=7$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In triangle $ABC$, $b=4$, $c=6$ and $A=60^\\circ$. Find $a$.", "answer": "2*sqrt(7)", "solution_sketch": "Here $a^2=16+36-2(4)(6)\\cos60^\\circ=52-24=28$. Since $28=4\\cdot7$, the side is $a=2\\sqrt7$. The factor $4$ comes out of the root.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Obtuse included angles", "key_prerequisites": ["right-triangle-trig", "unit-circle"], "constraints": "included angles of 120 or 135 degrees, whose cosine is negative; answers are exact square roots, simplified; speed-and-time contexts allowed", "exemplars": [
      {"problem": "In triangle $ABC$, the sides $b=3$ and $c=5$ enclose the angle $A=120^\\circ$. Find the side $a$.", "answer": "7", "solution_sketch": "Here $\\cos120^\\circ=-\\tfrac12$, so the cross term adds to the sum of squares: $a^2=9+25+15=49$. Hence $a=7$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In triangle $ABC$, the sides $b=5$ and $c=8$ enclose the angle $A=120^\\circ$. Find the side $a$.", "answer": "sqrt(129)", "solution_sketch": "The cosine of $120^\\circ$ is $-\\tfrac12$, so $a^2=25+64+40=129$. The side is $a=\\sqrt{129}$, and $129$ has no square factor.", "answer_contract": {"kind": "exact"}},
      {"problem": "The two rafters of a roof are $4$ m long and meet at the ridge at an angle of $120^\\circ$. How wide is the roof, measured between the lower ends of the rafters?", "answer": "4*sqrt(3)", "solution_sketch": "The width is the third side of a triangle with the included angle $120^\\circ$. So $d^2=16+16-2(4)(4)(-\\tfrac12)=48$ and $d=\\sqrt{48}=4\\sqrt3$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}},
      {"problem": "Two roads leave a junction at an angle of $135^\\circ$ to each other. A shop is $2$ km along one road and a school is $3$ km along the other. How far is it from the shop to the school in a straight line?", "answer": "sqrt(13+6*sqrt(2))", "solution_sketch": "The straight line is the third side of a triangle with the included angle $135^\\circ$, and $\\cos135^\\circ=-\\tfrac{\\sqrt2}{2}$. So $d^2=4+9+6\\sqrt2$ and $d=\\sqrt{13+6\\sqrt2}$ km, about $4.6$ km.", "answer_contract": {"kind": "exact"}},
      {"problem": "Two ships leave a harbour at the same time on courses $120^\\circ$ apart. One sails at $12$ km/h and the other at $18$ km/h. How far apart are they after $2$ hours?", "answer": "12*sqrt(19)", "solution_sketch": "After $2$ hours the ships are $24$ km and $36$ km from the harbour. So $d^2=24^2+36^2+24\\cdot36=576+1296+864=2736$ and $d=\\sqrt{2736}=12\\sqrt{19}$ km.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true, "form": "simplest_radical"}},
      {"problem": "A triangle has $b=10$, $c=6$ and the included angle $A=120^\\circ$. What is the value of the side $a$?", "answer": "14", "solution_sketch": "The cosine is $\\cos120^\\circ=-\\tfrac12$, not $+\\tfrac12$. So $a^2=100+36+60=196$ and $a=14$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In triangle $ABC$, $b=4$, $c=6$ and $A=120^\\circ$. Find $a$.", "answer": "2*sqrt(19)", "solution_sketch": "The cross term adds, so $a^2=16+36+24=76$. Since $76=4\\cdot19$, the side is $a=2\\sqrt{19}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Find an angle (SSS)", "key_prerequisites": ["right-triangle-trig", "pythagorean-theorem"], "constraints": "all three sides given as integers; data chosen so the cosine comes out as 1/2, 0 or -1/2, giving 60, 90 or 120 degrees; also a cosine of a largest angle and an acute, right or obtuse verdict", "exemplars": [
      {"problem": "A triangle has sides $3$, $7$ and $8$. Find the angle opposite the side of length $7$.", "answer": "60", "solution_sketch": "The cosine is $\\dfrac{3^2+8^2-7^2}{2(3)(8)}=\\dfrac{24}{48}=\\tfrac12$. Since the cosine is $\\tfrac12$, the angle is $60^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "A triangle has sides $5$, $12$ and $13$. Find the angle between the sides of length $5$ and $12$.", "answer": "90", "solution_sketch": "The angle faces the side $13$, so its cosine is $\\dfrac{5^2+12^2-13^2}{2(5)(12)}=\\dfrac{0}{120}=0$. The angle is $90^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "A triangular frame has sides $7$ cm, $8$ cm and $13$ cm. What is the size of its largest angle?", "answer": "120", "solution_sketch": "The largest angle faces the longest side, $13$ cm. Its cosine is $\\dfrac{49+64-169}{2(7)(8)}=-\\dfrac{56}{112}=-\\tfrac12$, so the angle is $120^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "A triangle has sides $4$, $5$ and $6$. Find the cosine of its largest angle.", "answer": "1/8", "solution_sketch": "The largest angle faces the side $6$. Its cosine is $\\dfrac{4^2+5^2-6^2}{2(4)(5)}=\\dfrac{5}{40}=\\tfrac18$. This is a positive cosine, so the largest angle is acute.", "answer_contract": {"kind": "exact"}},
      {"problem": "Is the triangle with sides $4$, $5$ and $7$ acute, right or obtuse?", "answer": "obtuse", "solution_sketch": "The largest angle faces the side $7$. Its cosine is $\\dfrac{16+25-49}{2(4)(5)}=-\\dfrac15$, which is negative, so that angle is obtuse and the triangle is obtuse.", "answer_contract": {"kind": "label", "options": [["obtuse", "obtuse triangle", "it is obtuse", "an obtuse triangle"], ["acute", "acute triangle", "it is acute", "an acute triangle"], ["right", "right triangle", "it is right", "right-angled", "right angled"]]}},
      {"problem": "Three villages $A$, $B$ and $C$ are joined by straight roads with $AB=5$ km, $BC=7$ km and $CA=8$ km. What is the angle at $A$ between the roads to $B$ and $C$?", "answer": "60", "solution_sketch": "The angle at $A$ faces the road $BC=7$ km. Its cosine is $\\dfrac{5^2+8^2-7^2}{2(5)(8)}=\\dfrac{40}{80}=\\tfrac12$, so the angle is $60^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "A lighthouse is $8$ km from one buoy and $15$ km from another, and the two buoys are $13$ km apart. What angle at the lighthouse do the lines to the two buoys make?", "answer": "60", "solution_sketch": "The angle at the lighthouse faces the side of $13$ km. Its cosine is $\\dfrac{64+225-169}{2(8)(15)}=\\dfrac{120}{240}=\\tfrac12$, so the angle is $60^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}}
    ]}
  ]},
  {"id": "law-of-sines-cosines", "name": "Law of Sines and Law of Cosines", "core": false, "difficulty": 0.75, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 240, "prerequisites": [{"id": "law-of-sines", "weight": 0.7, "key": true}, {"id": "law-of-cosines", "weight": 0.7, "key": true}, {"id": "right-triangle-trig", "weight": 0.4}], "diagnostic_exemplar": {"problem": "Two ships leave a port on courses $120^\\circ$ apart, one travelling $30$ km and the other $50$ km. How far apart are they?", "answer": "70 km", "solution_sketch": "SAS, so use the law of cosines: $c^2 = 900 + 2500 - 2(30)(50)\\cos 120^\\circ = 3400 + 1500$."}, "anki_seeds": [{"front": "Given SSS or SAS use ___; given ASA/AAS use ___.", "back": "Law of Cosines; Law of Sines.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Choose the right law", "key_prerequisites": ["law-of-sines", "law-of-cosines"], "constraints": "choose the law from the data: two angles and a side, or a side-angle pair that faces each other, use the Law of Sines; SSS and SAS use the Law of Cosines; some items name the law, some ask for the value; special-angle data", "exemplars": [
      {"problem": "Two sides of a triangle and the angle between them are known. Which law do you use to find the third side?", "answer": "Law of Cosines", "solution_sketch": "The known data supply every term in $a^2=b^2+c^2-2bc\\cos A$. No side is known together with its opposite angle, so the Law of Sines cannot start.", "answer_contract": {"kind": "label", "options": [["Law of Cosines", "the law of cosines", "cosine rule", "the cosine rule", "cosines", "cosine law", "cosine", "use the cosine rule"], ["Law of Sines", "the law of sines", "sine rule", "the sine rule", "sines", "sine law", "sine", "use the sine rule"]]}},
      {"problem": "In triangle $ABC$, $A=45^\\circ$, $B=60^\\circ$ and $a=6$. Find the side $b$.", "answer": "3*sqrt(6)", "solution_sketch": "The side $a$ and the angle $A$ face each other, so $\\dfrac{b}{\\sin60^\\circ}=\\dfrac{6}{\\sin45^\\circ}$. Then $b=6\\cdot\\dfrac{\\sqrt3/2}{\\sqrt2/2}=\\dfrac{6\\sqrt3}{\\sqrt2}=3\\sqrt6$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A surveyor at a point $O$ sees a tower $50$ m away and a pole $80$ m away, and the angle between the two lines of sight is $60^\\circ$. How far is the tower from the pole?", "answer": "70", "solution_sketch": "Two sides and the angle between them are known, so use the cosine rule: $d^2=50^2+80^2-2(50)(80)\\cos60^\\circ=2500+6400-4000=4900$. Hence $d=70$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "In triangle $ABC$, $A=30^\\circ$, $a=10$ and $b=12$, and the angle $B$ is acute. Which law do you use to find $B$ directly?", "answer": "Law of Sines", "solution_sketch": "The pair $A$ and $a$ face each other and $b$ is known, so $\\sin B=b\\sin A/a=12\\cdot\\tfrac12/10=\\tfrac35$. The cosine rule would need the third side first.", "answer_contract": {"kind": "label", "options": [["Law of Cosines", "the law of cosines", "cosine rule", "the cosine rule", "cosines", "cosine law", "cosine", "use the cosine rule"], ["Law of Sines", "the law of sines", "sine rule", "the sine rule", "sines", "sine law", "sine", "use the sine rule"]]}},
      {"problem": "A surveyor at a point $R$ wants the width $PQ$ of a river, with $P$ and $Q$ on opposite banks. She measures $RP=60$ m, $\\angle PRQ=45^\\circ$ and $\\angle RQP=60^\\circ$. How wide is the river?", "answer": "20*sqrt(6)", "solution_sketch": "The side $RP$ faces the angle $60^\\circ$ at $Q$, and the side $PQ$ faces the angle $45^\\circ$ at $R$. So $PQ=60\\cdot\\dfrac{\\sin45^\\circ}{\\sin60^\\circ}=60\\cdot\\dfrac{\\sqrt2}{\\sqrt3}=20\\sqrt6$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}},
      {"problem": "A triangle has sides $6$, $10$ and $14$. Find the angle opposite the side of length $14$.", "answer": "120", "solution_sketch": "All three sides are known, so use the cosine rule: $\\cos C=\\dfrac{36+100-196}{2(6)(10)}=-\\dfrac{60}{120}=-\\tfrac12$. The angle is $120^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "In triangle $ABC$, $c=9$, $C=60^\\circ$ and $a=3\\sqrt6$, and the angle $A$ is acute. Find $A$.", "answer": "45", "solution_sketch": "The pair $C$ and $c$ face each other, so $\\sin A=a\\sin C/c=3\\sqrt6\\cdot\\tfrac{\\sqrt3}{2}/9=\\tfrac{\\sqrt2}{2}$. Since $A$ is acute, $A=45^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}}
    ]},
    {"id": "kp2", "name": "Combine both laws", "key_prerequisites": ["law-of-sines", "law-of-cosines"], "constraints": "one triangle needing both laws in turn, or SSS where the largest angle is asked and then its sine; special-angle data, exact answers; in context items the sine of an angle in a surveyed or sailed triangle", "exemplars": [
      {"problem": "In triangle $ABC$, $b=5$, $c=8$ and $A=60^\\circ$. Find $\\sin B$.", "answer": "5*sqrt(3)/14", "solution_sketch": "The cosine rule gives $a^2=25+64-40=49$, so $a=7$. The sine rule then gives $\\sin B=\\dfrac{5\\sin60^\\circ}{7}=\\dfrac{5\\sqrt3}{14}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A triangle has sides $7$, $8$ and $13$. Find its largest angle.", "answer": "120", "solution_sketch": "The largest angle faces the longest side, $13$. Its cosine is $\\dfrac{49+64-169}{2(7)(8)}=-\\tfrac12$, so the angle is $120^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "A lake has its two ends at $P$ and $Q$. From a lookout $O$, the end $P$ is $3$ km away and the end $Q$ is $8$ km away, and $\\angle POQ=60^\\circ$. Find $\\sin\\angle OPQ$.", "answer": "4*sqrt(3)/7", "solution_sketch": "The cosine rule gives $PQ^2=9+64-24=49$, so $PQ=7$ km. The angle at $P$ faces $OQ=8$, so $\\sin P=\\dfrac{8\\sin60^\\circ}{7}=\\dfrac{4\\sqrt3}{7}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In triangle $ABC$, $b=3$, $c=5$ and $A=120^\\circ$. Find $\\sin B$.", "answer": "3*sqrt(3)/14", "solution_sketch": "The cosine rule gives $a^2=9+25+15=49$, so $a=7$. The sine rule then gives $\\sin B=\\dfrac{3\\sin120^\\circ}{7}=\\dfrac{3\\sqrt3}{14}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Two ships leave a harbour $H$ and sail in straight lines $60^\\circ$ apart, one $8$ km to $M$ and the other $15$ km to $N$. Find $\\sin\\angle HMN$.", "answer": "15*sqrt(3)/26", "solution_sketch": "The cosine rule gives $MN^2=64+225-120=169$, so $MN=13$ km. The angle at $M$ faces $HN=15$, so $\\sin M=\\dfrac{15\\sin60^\\circ}{13}=\\dfrac{15\\sqrt3}{26}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "In triangle $ABC$, $b=c=4$ and $A=120^\\circ$. Find the angle $B$.", "answer": "30", "solution_sketch": "The cosine rule gives $a^2=16+16+16=48$, so $a=4\\sqrt3$. Then $\\sin B=\\dfrac{4\\sin120^\\circ}{4\\sqrt3}=\\tfrac12$, and $B$ is acute, so $B=30^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "A triangle has sides $3$, $5$ and $7$. Find the sine of its largest angle.", "answer": "sqrt(3)/2", "solution_sketch": "The largest angle faces the side $7$, and its cosine is $\\dfrac{9+25-49}{2(3)(5)}=-\\tfrac12$. So that angle is $120^\\circ$ and its sine is $\\tfrac{\\sqrt3}{2}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Applications to distances", "key_prerequisites": ["law-of-cosines"], "constraints": "navigation and surveying contexts in metric units; two sides and the included angle, three sides, or speeds and times to turn into distances; exact answers", "exemplars": [
      {"problem": "Two ships leave a port on courses $60^\\circ$ apart. After some time one has travelled $40$ km and the other $30$ km. How far apart are they?", "answer": "10*sqrt(13)", "solution_sketch": "The ships and the port form a triangle with the included angle $60^\\circ$. So $d^2=40^2+30^2-2(40)(30)\\cdot\\tfrac12=1300$ and $d=10\\sqrt{13}$ km.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true, "form": "simplest_radical"}},
      {"problem": "A triangular park has two sides of $60$ m and $80$ m that meet at an angle of $120^\\circ$. How long is the third side?", "answer": "20*sqrt(37)", "solution_sketch": "The cosine of $120^\\circ$ is $-\\tfrac12$, so $d^2=3600+6400+4800=14800$. Since $14800=400\\cdot37$, the side is $20\\sqrt{37}$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true, "form": "simplest_radical"}},
      {"problem": "The sides of a triangular survey plot measure $30$ m, $50$ m and $70$ m. What is the angle at the corner opposite the $70$ m side?", "answer": "120", "solution_sketch": "The cosine of that angle is $\\dfrac{900+2500-4900}{2(30)(50)}=-\\dfrac{1500}{3000}=-\\tfrac12$. The angle is $120^\\circ$. The angle is obtuse because its cosine is negative.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}},
      {"problem": "Two straight paths of length $20$ m leave a fountain and meet at an angle of $60^\\circ$. How long is a straight connector between their far ends?", "answer": "20", "solution_sketch": "The connector is the third side of a triangle with two sides of $20$ m and the included angle $60^\\circ$. So $d^2=400+400-2(20)(20)\\cdot\\tfrac12=400$ and $d=20$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "Two cyclists leave a crossroads at the same time on roads that meet at an angle of $60^\\circ$. One rides at $9$ km/h and the other at $15$ km/h. How far apart are they after $2$ hours?", "answer": "6*sqrt(19)", "solution_sketch": "After $2$ hours the cyclists are $18$ km and $30$ km from the crossroads. So $d^2=18^2+30^2-2(18)(30)\\cdot\\tfrac12=324+900-540=684$ and $d=\\sqrt{684}=6\\sqrt{19}$ km.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true, "form": "simplest_radical"}},
      {"problem": "Two hikers leave a hut at the same time on paths that are $120^\\circ$ apart. They walk at $3$ km/h and $5$ km/h. After how many hours are they $21$ km apart?", "answer": "3", "solution_sketch": "After $t$ hours the hikers are $3t$ and $5t$ km from the hut, so $d^2=9t^2+25t^2+15t^2=49t^2$ and $d=7t$ km. Setting $7t=21$ gives $t=3$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}},
      {"problem": "A triangular sail has edges of $7$ m, $15$ m and $13$ m. What is the angle between the $7$ m edge and the $15$ m edge?", "answer": "60", "solution_sketch": "That angle faces the $13$ m edge, so its cosine is $\\dfrac{49+225-169}{2(7)(15)}=\\dfrac{105}{210}=\\tfrac12$. The angle is $60^\\circ$.", "answer_contract": {"kind": "unit", "quantity": "angle", "unit": "degree", "allow_omitted": true}}
