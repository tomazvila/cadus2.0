      {"problem": "Solve $\\frac{3}{x-2} + \\frac{1}{4} = 1$.", "answer": "x = 6", "solution_sketch": "$\\frac{3}{x-2} = \\frac{3}{4}$; $x-2=4$.", "answer_contract": {"kind": "exact"}}, {"problem": "Solve $\\frac{2}{x} + \\frac{1}{4} = \\frac{3}{4}$.", "answer": "x = 4", "solution_sketch": "$\\frac{2}{x} = \\frac{1}{2}$, so $x=4$.", "answer_contract": {"kind": "exact"}}
