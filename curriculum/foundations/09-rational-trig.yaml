      {"problem": "Add $\\frac{x^2}{x+3} + \\frac{3x}{x+3}$.", "answer": "x", "solution_sketch": "The sum has numerator $x^2+3x=x(x+3)$. Cancel the common factor $x+3$, which leaves $x$.", "answer_contract": {"kind": "exact"}},
