            solution_sketch: '$\frac{1}{2} \cdot 6 \cdot 8 \cdot \sin 30^\circ = 24 \cdot \frac{1}{2}$.'
          - problem: 'Find the area of a triangle with sides $5$ and $12$ meeting at $90^\circ$.'
            answer: "30"
      - id: kp2
        name: Exact areas with radicals
        key_prerequisites: [right-triangle-trig, unit-circle-special-angles]
        constraints: "included angles of 45 or 60 degrees, so the area carries a radical; integer side lengths"
        exemplars:
          - problem: 'Find the area of a triangle with sides $4$ and $6$ meeting at $60^\circ$.'
            answer: "6√3"
            solution_sketch: '$\frac{1}{2} \cdot 24 \cdot \frac{\sqrt{3}}{2} = 6\sqrt{3}$.'
          - problem: 'Find the area of a triangle with sides $10$ and $10$ meeting at $45^\circ$.'
            answer: "25√2"
      - id: kp3
        name: Obtuse included angles
        key_prerequisites: [unit-circle-special-angles]
        constraints: "included angles of 120, 135 or 150 degrees; the sine of the supplement is used, so the area stays positive; integer sides"
        exemplars:
          - problem: 'Find the area of a triangle with sides $6$ and $10$ meeting at $150^\circ$.'
            answer: "15"
            solution_sketch: '$\sin 150^\circ = \frac{1}{2}$; $\frac{1}{2} \cdot 60 \cdot \frac{1}{2} = 15$.'
          - problem: 'Find the area of a triangle with sides $8$ and $9$ meeting at $120^\circ$.'
            answer: "18√3"
