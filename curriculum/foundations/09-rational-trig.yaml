    {"id": "kp1", "name": "Multiply monomial rational expressions", "key_prerequisites": ["multiplying-fractions"], "constraints": "coefficients at most 12; results must reduce to a single fraction", "step_check": {"step": "Reduce $9/12$ to $3/4$ and cancel one factor of $x$", "question": "Why can one $x$ in the numerator cancel one $x$ in the denominator of $\\frac{9x^2}{12x}$?", "options": ["A factor $x$ above over the same factor $x$ below is $1$, for $x\\ne0$", "Any letter on top may be removed together with any letter on the bottom", "The exponent $2$ on top is subtracted from the $12$ on the bottom"], "answer": "A factor $x$ above over the same factor $x$ below is $1$, for $x\\ne0$", "why": "$\\frac{x\\cdot x}{x}=x\\cdot\\frac{x}{x}=x\\cdot1$ for $x\\ne0$, so $\\frac{9x^2}{12x}=\\frac{3x}{4}$."}, "exemplars": [
