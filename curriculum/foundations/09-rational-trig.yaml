            answer: "-1"
      - id: kp2
        name: First-quadrant special angles
        key_prerequisites: [special-right-triangles]
        constraints: "first-quadrant angles π/6, π/4 and π/3; answers are the exact values 1/2, √2/2 and √3/2"
        exemplars:
          - problem: 'Find $\cos(\pi/6)$.'
            answer: "√3/2"
            solution_sketch: 'The $30$-$60$-$90$ triangle gives $\cos(\pi/6) = \frac{\sqrt{3}}{2}$ (and $\sin(\pi/6) = \frac{1}{2}$).'
          - problem: 'Find $\sin(\pi/4)$.'
            answer: "√2/2"
            solution_sketch: 'The $45$-$45$-$90$ triangle gives $\sin(\pi/4) = \cos(\pi/4) = \frac{\sqrt{2}}{2}$.'
          - problem: 'Find $\cos(\pi/3)$.'
            answer: "1/2"
            solution_sketch: 'The $30$-$60$-$90$ triangle gives $\cos(\pi/3) = \frac{1}{2}$ (and $\sin(\pi/3) = \frac{\sqrt{3}}{2}$).'
      - id: kp3
        name: Tangent at special angles
        key_prerequisites: [special-right-triangles, trig-ratios-definition]
        constraints: "tangent at π/6, π/4 and π/3; answers are √3/3, 1 and √3, rationalized"
        exemplars:
          - problem: 'Find $\tan(\pi/4)$.'
            answer: "1"
          - problem: 'Find $\tan(\pi/6)$.'
            answer: "√3/3"
            solution_sketch: '$\frac{1/2}{\sqrt{3}/2} = \frac{1}{\sqrt{3}} = \frac{\sqrt{3}}{3}$.'
          - problem: 'Find $\tan(\pi/3)$.'
            answer: "√3"
    diagnostic_exemplar:
      problem: 'Find $\cos(\pi/6) \cdot \tan(\pi/6) + \sin(3\pi/2)$.'
      answer: "-1/2"
      solution_sketch: '$\cos\frac{\pi}{6}\tan\frac{\pi}{6} = \sin\frac{\pi}{6} = \frac{1}{2}$, and $\sin\frac{3\pi}{2} = -1$.'
    anki_seeds:
      - front: "sin(π/6), sin(π/4), sin(π/3) = ?"
        back: "1/2, √2/2, √3/2"
        type: basic
      - front: "cos(0), cos(π/2), cos(π) = ?"
        back: "1, 0, -1"
        type: basic

