      {"problem": "A banner has length $\\dfrac{x+3}{x-1}$ meters and width $\\dfrac{x^2-1}{x+3}$ meters, with $x>1$. What is its area in square meters?", "answer": "x+1", "solution_sketch": "Area is length times width. After factoring $x^2-1=(x-1)(x+1)$, the factors $x+3$ and $x-1$ cancel, leaving $x+1$.", "answer_contract": {"kind": "exact"}},
