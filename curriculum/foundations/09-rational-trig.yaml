topics: [
  {"id": "rational-expression-restrictions", "name": "Excluded Values of Rational Expressions", "core": true, "difficulty": 0.5, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 90, "prerequisites": [{"id": "quadratic-equations-factoring", "weight": 0.5, "key": true}, {"id": "two-step-equations", "weight": 0.4}, {"id": "fraction-basics", "weight": 0.3}], "diagnostic_exemplar": {"problem": "State the excluded value(s) of $\\frac{x + 4}{x^2 - 7x + 12}$.", "answer_contract": {"kind": "list", "ordered": false, "member": {"kind": "exact"}}, "answer": "x = 3 and x = 4", "solution_sketch": "Factor the denominator: $(x - 3)(x - 4) = 0$."}, "anki_seeds": [{"front": "The excluded values of a rational expression are...", "back": "the values that make the denominator zero.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Monomial and simple binomial denominators", "key_prerequisites": ["fraction-basics"], "constraints": "denominators of degree at most 1 here; integer excluded values", "exemplars": [
      {"problem": "State the excluded value of $5/x$.", "answer": "x = 0", "solution_sketch": "A quotient requires a nonzero denominator: $x\\ne0$.", "answer_contract": {"kind": "exact"}}, {"problem": "For $f(x)=(x+2)/(x-3)$, which input makes the function undefined?", "answer": "x = 3", "solution_sketch": "Set $x-3=0$; adding $3$ gives $x=3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has area $8$ and width $x+5$. Its length is $8/(x+5)$. Which value of $x$ would make this formula undefined?", "answer": "x = -5", "solution_sketch": "Division fails at zero width: $x+5=0$ gives $x=-5$.", "answer_contract": {"kind": "exact"}}, {"problem": "The expression $(x-7)/(x-7)$ simplifies to $1$. Which original input must still be excluded?", "answer": "x = 7", "solution_sketch": "Cancellation assumes $x-7\\ne0$; at $x=7$ the original quotient is $0/0$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Solve a linear denominator equal to zero", "key_prerequisites": ["two-step-equations"], "constraints": "denominators of the form ax + b with small integer a and b; the excluded value is an integer or a simple fraction", "exemplars": [
      {"problem": "State the excluded value of $7/(2x-6)$.", "answer": "x = 3", "solution_sketch": "$2x-6=0$ implies $2x=6$, hence $x=3$.", "answer_contract": {"kind": "exact"}}, {"problem": "Find the vertical asymptote of $y=1/(3x+12)$ as an equation in $x$.", "answer": "x = -4", "solution_sketch": "The numerator never vanishes; $3x+12=0$ gives $x=-4$, where the denominator tends to zero.", "answer_contract": {"kind": "exact"}},
      {"problem": "A reciprocal model is $y=5/[2(2x-1)]$. Which input is forbidden?", "answer": "x = 1/2", "solution_sketch": "The nonzero factor $2$ can be removed from $2(2x-1)=0$; $2x=1$ gives $x=1/2$.", "answer_contract": {"kind": "exact"}}, {"problem": "After simplifying $(10-5x)/(10-5x)$, which original input remains excluded?", "answer": "x = 2", "solution_sketch": "$10-5x=0$ gives $-5x=-10$ and $x=2$; cancellation cannot restore that input.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Factorable quadratic denominators", "key_prerequisites": ["quadratic-equations-factoring"], "constraints": "denominators are factorable quadratics (difference of squares or monic trinomials) with two integer roots; give both excluded values", "exemplars": [
      {"problem": "List the excluded inputs of $(x+1)/(x^2-9)$.", "answer": "-3, 3", "solution_sketch": "$x^2-9=(x-3)(x+3)$; either zero factor makes division undefined.", "answer_contract": {"kind": "list", "ordered": false, "member": {"kind": "exact"}}}, {"problem": "Find both vertical asymptotes of $y=1/(x^2-5x+6)$; list their $x$-values.", "answer": "2, 3", "solution_sketch": "The denominator factors as $(x-2)(x-3)$ and the numerator is nonzero at both roots.", "answer_contract": {"kind": "list", "ordered": false, "member": {"kind": "exact"}}},
      {"problem": "Cancel a common factor in $(x-2)/(x^2-4)$, then list all inputs still excluded from the original expression.", "answer": "-2, 2", "solution_sketch": "$(x^2-4)=(x-2)(x+2)$; cancellation leaves $1/(x+2)$, but both original denominator zeros remain forbidden.", "answer_contract": {"kind": "list", "ordered": false, "member": {"kind": "exact"}}}, {"problem": "A rational formula has denominator $(x+4)(x-3)$. List its forbidden inputs.", "answer": "-4, 3", "solution_sketch": "Apply the zero-product rule separately: $x+4=0$ or $x-3=0$.", "answer_contract": {"kind": "list", "ordered": false, "member": {"kind": "exact"}}}
    ]}
  ]},
  {"id": "simplifying-rational-monomials", "name": "Simplifying Monomial Rational Expressions", "core": true, "difficulty": 0.5, "drill": false, "answer_kind": "expression", "expected_time_secs": 90, "prerequisites": [{"id": "equivalent-fractions", "weight": 0.7, "key": true}, {"id": "exponent-product-quotient-rules", "weight": 0.6, "key": true}, {"id": "negative-zero-exponents", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Simplify $\\frac{15x^3 y}{20x y^3}$.", "answer": "3x^2/(4y^2)", "solution_sketch": "$\\frac{15}{20} = \\frac{3}{4}$, $\\frac{x^3}{x} = x^2$, and $\\frac{y}{y^3} = \\frac{1}{y^2}$."}, "anki_seeds": [{"front": "To simplify a monomial fraction, reduce the coefficients and...", "back": "subtract exponents of like bases.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Reduce numeric coefficients", "key_prerequisites": ["equivalent-fractions"], "constraints": "coefficients at most 20; single variable", "exemplars": [
      {"problem": "Simplify $6x^2/(9x)$ for $x\\ne0$.", "answer": "2*x/3", "solution_sketch": "Divide coefficients by $3$ and cancel one $x$: $(6/9)x^{2-1}=2x/3$.", "answer_contract": {"kind": "exact"}}, {"problem": "Reduce $8x/12$ to a fraction with coprime integer coefficients.", "answer": "2*x/3", "solution_sketch": "The coefficient GCD is $4$, so $(8/12)x=(2/3)x$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle of area $15x$ has width $10$, with $x>0$. Express its length in simplest form.", "answer": "3*x/2", "solution_sketch": "Length is area divided by width: $15x/10$. Divide the coefficients by $5$.", "answer_contract": {"kind": "exact"}}, {"problem": "Simplify $(-14x)/(-21)$ by resolving the sign and reducing the coefficient.", "answer": "2*x/3", "solution_sketch": "The two negatives cancel; dividing $14$ and $21$ by $7$ leaves $2x/3$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Quotients of powers", "key_prerequisites": ["exponent-product-quotient-rules"], "constraints": "one variable; subtract exponents, leaving the variable in the numerator or in the denominator; coefficients at most 20", "exemplars": [
      {"problem": "Simplify $x^5/x^2$ for $x\\ne0$.", "answer": "x^3", "solution_sketch": "Cancel two copies of $x$, leaving $x^{5-2}=x^3$.", "answer_contract": {"kind": "exact"}}, {"problem": "Simplify $10x^3/(15x^5)$ for $x\\ne0$, using positive exponents.", "answer": "2/(3*x^2)", "solution_sketch": "Reduce $10/15$ to $2/3$; two uncancelled copies of $x$ remain in the denominator.", "answer_contract": {"kind": "exact"}},
      {"problem": "For $x\\ne0$, simplify $(x^2)^3/x^4$.", "answer": "x^2", "solution_sketch": "The power rule gives $(x^2)^3=x^6$; quotient exponents then subtract to $6-4=2$.", "answer_contract": {"kind": "exact"}}, {"problem": "For $x\\ne0$, simplify $x^4/x^4$.", "answer": "1", "solution_sketch": "All four nonzero factors cancel, giving $x^0=1$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Several variables at once", "key_prerequisites": ["exponent-product-quotient-rules", "equivalent-fractions"], "constraints": "two or three variables with exponents at most 3; reduce the coefficients and each variable separately", "exemplars": [
      {"problem": "Simplify $12x^2y/(18xy^2)$ for nonzero $x,y$.", "answer": "2*x/(3*y)", "solution_sketch": "$12/18=2/3$; cancel one $x$ and one $y$, leaving $2x/(3y)$.", "answer_contract": {"kind": "exact"}}, {"problem": "Simplify $4a^3b/(6a)$ for $a\\ne0$.", "answer": "2*a^2*b/3", "solution_sketch": "Reduce $4/6$ and cancel one $a$; $b$ has no denominator counterpart.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $15xy^2/(20x^2y)$ for nonzero $x,y$.", "answer": "3*y/(4*x)", "solution_sketch": "Divide coefficients by $5$; cancellation leaves one $y$ above and one $x$ below.", "answer_contract": {"kind": "exact"}}, {"problem": "For nonzero $a,b$, simplify $(3ab)^2/(6a^2b^3)$.", "answer": "3/(2*b)", "solution_sketch": "Expand $(3ab)^2=9a^2b^2$; all $a$ factors cancel and one $b$ remains below.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "rational-expressions", "name": "Simplifying Rational Expressions", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "simplifying-rational-monomials", "weight": 0.7, "key": true}, {"id": "factoring-trinomials", "weight": 0.6, "key": true}, {"id": "rational-expression-restrictions", "weight": 0.4}, {"id": "difference-of-squares", "weight": 0.4}, {"id": "factoring-gcf", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Simplify $\\frac{x^2 - 9}{6 - 2x}$.", "answer": "-(x + 3)/2", "solution_sketch": "$6 - 2x = -2(x - 3)$, and $x^2 - 9 = (x - 3)(x + 3)$; the $(x - 3)$ cancels and the minus sign survives."}, "anki_seeds": [{"front": "(a - b)/(b - a) = ?", "back": "-1", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Factor, then cancel a common binomial", "key_prerequisites": ["factoring-trinomials", "difference-of-squares"], "constraints": "numerator is a difference of squares or a monic trinomial; the denominator is one of its linear factors; the answer is a binomial", "exemplars": [
      {"problem": "Simplify $(x^2-9)/(x+3)$ for $x\\ne-3$.", "answer": "x-3", "solution_sketch": "Factor the difference of squares as $(x-3)(x+3)$, then cancel $x+3$.", "answer_contract": {"kind": "exact"}}, {"problem": "Simplify $(x^2+5x+6)/(x+2)$ for $x\\ne-2$.", "answer": "x+3", "solution_sketch": "The factors with sum $5$ and product $6$ are $2,3$; cancel $x+2$ from $(x+2)(x+3)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $(x^2+4x)/(x+4)$ for $x\\ne-4$.", "answer": "x", "solution_sketch": "Factor out $x$: $x(x+4)/(x+4)=x$ on the stated domain.", "answer_contract": {"kind": "exact"}}, {"problem": "A rectangle has area $(x+2)^2$ and width $x+2>0$. Express its length.", "answer": "x+2", "solution_sketch": "Area divided by width is $(x+2)^2/(x+2)$; one repeated binomial cancels.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Factor numerator and denominator", "key_prerequisites": ["factoring-trinomials"], "constraints": "numerator and denominator both factor into linear binomials with integer roots; exactly one factor cancels", "exemplars": [
      {"problem": "Simplify $(x^2-4)/(x^2+4x+4)$ for $x\\ne-2$.", "answer": "(x-2)/(x+2)", "solution_sketch": "Factor to $(x-2)(x+2)/(x+2)^2$ and cancel one $x+2$.", "answer_contract": {"kind": "exact"}}, {"problem": "Simplify $(x^2-x-6)/(x^2-9)$ for $x\\ne\\pm3$.", "answer": "(x+2)/(x+3)", "solution_sketch": "Factor to $(x-3)(x+2)/[(x-3)(x+3)]$, then cancel $x-3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $(2x^2+6x)/(x^2+3x)$ for $x\\ne0,-3$.", "answer": "2", "solution_sketch": "Factoring gives $2x(x+3)/[x(x+3)]$; both common factors cancel.", "answer_contract": {"kind": "exact"}}, {"problem": "Simplify $(x^2-6x+9)/(x^2-3x)$ for $x\\ne0,3$.", "answer": "(x-3)/x", "solution_sketch": "The numerator is $(x-3)^2$ and denominator is $x(x-3)$; cancel one repeated factor.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Opposite factors", "key_prerequisites": ["factoring-gcf", "difference-of-squares"], "constraints": "one factor pair of the form (a - x) and (x - a)", "exemplars": [
      {"problem": "Simplify $(5-x)/(x-5)$ for $x\\ne5$.", "answer": "-1", "solution_sketch": "$5-x=-(x-5)$, so cancelling the nonzero factor leaves $-1$.", "answer_contract": {"kind": "exact"}}, {"problem": "Simplify $(x^2-4)/(2-x)$ for $x\\ne2$.", "answer": "-(x+2)", "solution_sketch": "Factor the numerator as $(x-2)(x+2)$ and use $2-x=-(x-2)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $(3-x)^2/(x-3)$ for $x\\ne3$.", "answer": "x-3", "solution_sketch": "Squaring removes the minus sign: $(3-x)^2=(x-3)^2$; cancel one factor.", "answer_contract": {"kind": "exact"}}, {"problem": "Simplify $(2-x)/(x^2-4)$ for $x\\ne\\pm2$.", "answer": "-1/(x+2)", "solution_sketch": "$2-x=-(x-2)$ and $x^2-4=(x-2)(x+2)$, leaving $-1/(x+2)$.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "multiplying-rational-expressions", "name": "Multiplying Rational Expressions", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "rational-expressions", "weight": 0.7, "key": true}, {"id": "multiplying-fractions", "weight": 0.7, "key": true}, {"id": "factoring-trinomials", "weight": 0.4}], "diagnostic_exemplar": {"problem": "Multiply $\\frac{x^2 - 4}{x^2 + 5x} \\cdot \\frac{x + 5}{x - 2}$.", "answer": "(x + 2)/x", "solution_sketch": "Factor to $\\frac{(x - 2)(x + 2)}{x(x + 5)} \\cdot \\frac{x + 5}{x - 2}$; the $(x - 2)$ and $(x + 5)$ cancel."}, "anki_seeds": [{"front": "To multiply rational expressions...", "back": "factor everything, cancel common factors, then multiply what remains.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Multiply monomial rational expressions", "key_prerequisites": ["multiplying-fractions"], "constraints": "coefficients at most 12; results must reduce to a single fraction", "exemplars": [
      {"problem": "Multiply $(2/x)(x^2/6)$ for $x\\ne0$.", "answer": "x/3", "solution_sketch": "Cross-cancel $2$ with $6$ and one $x$, leaving $x/3$.", "answer_contract": {"kind": "exact"}}, {"problem": "Multiply $(3x/4)(8/(9x))$ for $x\\ne0$.", "answer": "2/3", "solution_sketch": "The $x$ factors cancel completely; $24/36$ reduces to $2/3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $(-2x^2/3)(9x/4)$.", "answer": "-3*x^3/2", "solution_sketch": "One negative factor makes the product negative; $18/12=3/2$ and $x^2x=x^3$.", "answer_contract": {"kind": "exact"}}, {"problem": "Multiply $(5/x^2)(2/x)$ for $x\\ne0$.", "answer": "10/x^3", "solution_sketch": "Multiply the numerators to get $10$; denominator powers add to $x^3$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Factor, multiply, and cancel", "key_prerequisites": ["rational-expressions", "factoring-trinomials"], "constraints": "one factor needs a difference of squares or a monic trinomial factored first; exactly one binomial cancels", "exemplars": [
      {"problem": "Multiply $[(x+2)/(x-3)][(x^2-9)/(x+2)]$, where $x\\ne3,-2$.", "answer": "x+3", "solution_sketch": "Factor $x^2-9=(x-3)(x+3)$; cancel $x+2$ and $x-3$ across the product.", "answer_contract": {"kind": "exact"}}, {"problem": "Multiply $[x/(x+4)][(x^2+8x+16)/x]$, where $x\\ne0,-4$.", "answer": "x+4", "solution_sketch": "The trinomial is $(x+4)^2$; cancel $x$ and one $x+4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $[(x^2+3x)/(x+1)][(x+1)/(x+3)]$, where $x\\ne-1,-3$.", "answer": "x", "solution_sketch": "Factor out $x$ in $x^2+3x=x(x+3)$, then cancel both binomials.", "answer_contract": {"kind": "exact"}}, {"problem": "Multiply $[(x^2+5x+6)/(x+4)][(x+4)/(x+2)]$, where $x\\ne-4,-2$.", "answer": "x+3", "solution_sketch": "Factor the trinomial into $(x+2)(x+3)$; cancel $x+4$ and $x+2$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Cross-cancel before multiplying", "key_prerequisites": ["rational-expressions"], "constraints": "a factor of each numerator cancels against a factor of the other denominator; cancel before multiplying, never expand", "exemplars": [
      {"problem": "Multiply $[(x^2-1)/(x+2)][(x+2)/(x+1)]$, where $x\\ne-2,-1$.", "answer": "x-1", "solution_sketch": "Factor $x^2-1$ and cross-cancel $x+2$ and $x+1$ before multiplication.", "answer_contract": {"kind": "exact"}}, {"problem": "Multiply $[(x^2+3x)/(x^2-4)][(x+2)/x]$, where $x\\ne0,\\pm2$.", "answer": "(x+3)/(x-2)", "solution_sketch": "Factor to $x(x+3)/[(x-2)(x+2)]$; cross-cancel $x$ and $x+2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $[(x-2)/6][9/(2-x)]$, where $x\\ne2$.", "answer": "-3/2", "solution_sketch": "Opposite binomials contribute $-1$; cross-reducing $9/6$ gives $-3/2$.", "answer_contract": {"kind": "exact"}}, {"problem": "Multiply $[2(x+1)/(3(x-1))][9(x-1)/(4(x+1))]$, where $x\\ne\\pm1$.", "answer": "3/2", "solution_sketch": "Cross-cancel both binomials and reduce $18/12$ before multiplying.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
