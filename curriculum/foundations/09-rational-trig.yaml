        constraints: "acute angles in whole degrees; sin of an angle equals cos of its complement; the answer names the cofunction of 90 minus the angle"
        exemplars:
          - problem: 'Write $\sin 20^\circ$ as the cosine of an angle.'
            answer: "cos 70°"
            solution_sketch: '$\sin \theta = \cos(90^\circ - \theta)$.'
          - problem: 'Verify: $\sin 30^\circ$ and $\cos 60^\circ$ are both equal to what value?'
            answer: "1/2"
      - id: kp2
        name: Solve cofunction equations
        key_prerequisites: [trig-ratios-definition, right-triangle-trig]
        constraints: "acute angles; answers are whole degrees"
        exemplars:
          - problem: 'If $\sin 25^\circ = \cos \theta$ for an acute angle $\theta$, find $\theta$.'
            answer: "65°"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°"}
          - problem: 'If $\cos 41^\circ = \sin \theta$ for an acute angle $\theta$, find $\theta$.'
            answer: "49°"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°"}
      - id: kp3
        name: Complementary acute angles in one triangle
        key_prerequisites: [trig-ratios-definition]
        constraints: "a right triangle whose acute angles are A and B; ratios are Pythagorean-triple fractions; the answer equals the given ratio"
        exemplars:
          - problem: 'In a right triangle the acute angles are $A$ and $B$. If $\sin A = \frac{3}{5}$, find $\cos B$.'
            answer: "3/5"
            solution_sketch: '$A + B = 90^\circ$, so $\cos B = \sin A$.'
          - problem: 'In a right triangle with acute angles $A$ and $B$, $\cos A = \frac{8}{17}$. Find $\sin B$.'
            answer: "8/17"
    diagnostic_exemplar:
      problem: 'In a right triangle with acute angles $A$ and $B$, $\sin A = \frac{5}{13}$. Find $\cos B$.'
      answer: "5/13"
      solution_sketch: '$A$ and $B$ are complementary, and cosine of one is sine of the other.'
    anki_seeds:
      - front: "sin θ = cos(?)"
        back: "cos(90° − θ)"
        type: basic

  - id: angle-of-elevation-depression
