  - id: pythagorean-identity
    name: The Pythagorean Identity
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: unit-circle
        weight: 0.6
        key: true
      - id: trig-ratios-definition
        weight: 0.4
      - id: pythagorean-theorem
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: State and verify the identity
        key_prerequisites: [unit-circle, pythagorean-theorem]
        constraints: "verify at a special angle, or read the identity off the unit-circle equation x^2 + y^2 = 1; the value is always 1"
        exemplars:
          - problem: 'Verify the Pythagorean identity at $\theta = \pi/3$: compute $\sin^2(\pi/3) + \cos^2(\pi/3)$.'
            answer: "1"
            solution_sketch: '$\frac{3}{4} + \frac{1}{4} = 1$.'
          - problem: 'A unit-circle point is $(\cos \theta, \sin \theta)$ and satisfies $x^2 + y^2 = 1$. Substituting gives the Pythagorean identity: $\sin^2 \theta + \cos^2 \theta$ equals what?'
            answer: "1"
            solution_sketch: 'Substituting $x = \cos \theta$, $y = \sin \theta$ into $x^2 + y^2 = 1$ gives $\sin^2 \theta + \cos^2 \theta = 1$.'
      - id: kp2
        name: Find cosine from sine in Quadrant I
        key_prerequisites: [unit-circle]
        constraints: "first-quadrant angles only, so both ratios are positive; Pythagorean-triple fractions such as 3/5 or 5/13"
        exemplars:
          - problem: 'If $\sin \theta = \frac{3}{5}$ and $\theta$ is in the first quadrant, find $\cos \theta$.'
            answer: "4/5"
            solution_sketch: '$\cos^2 \theta = 1 - \frac{9}{25} = \frac{16}{25}$.'
          - problem: 'If $\cos \theta = \frac{5}{13}$ in the first quadrant, find $\sin \theta$.'
            answer: "12/13"
      - id: kp3
        name: Use quadrant signs
        key_prerequisites: [unit-circle]
        constraints: "Pythagorean-triple ratios; quadrant given explicitly"
        exemplars:
          - problem: 'If $\sin \theta = \frac{4}{5}$ and $\theta$ is in Quadrant II, find $\cos \theta$.'
            answer: "-3/5"
            solution_sketch: 'Cosine is negative in Quadrant II.'
          - problem: 'If $\cos \theta = -\frac{8}{17}$ and $\theta$ is in Quadrant III, find $\sin \theta$.'
            answer: "-15/17"
    diagnostic_exemplar:
      problem: 'If $\cos \theta = -\frac{3}{5}$ and $\theta$ is in Quadrant III, find $\sin \theta$.'
      answer: "-4/5"
      solution_sketch: '$\sin^2\theta = 1 - \frac{9}{25} = \frac{16}{25}$; in Quadrant III sine is negative.'
    anki_seeds:
      - front: "State the Pythagorean identity."
        back: "sin²θ + cos²θ = 1"
        type: basic

  - id: trig-identities-basic
