  {"id": "trig-graphs-midline", "name": "Midline and Vertical Shifts of Sinusoids", "core": false, "difficulty": 0.7, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 120, "prerequisites": [{"id": "trig-graphs-basic", "weight": 0.8, "key": true}], "diagnostic_exemplar": {"problem": "A sinusoid oscillates between $-3$ and $9$. State its midline and amplitude.", "answer_contract": {"kind": "multipart", "parts": [{"name": "midline", "contract": {"kind": "exact"}}, {"name": "amplitude", "contract": {"kind": "exact"}}]}, "answer": "midline = 3; amplitude = 6", "solution_sketch": "The midline is the average of the extremes and the amplitude is half their difference."}, "anki_seeds": [{"front": "Midline of y = a·sin(bx) + d?", "back": "y = d", "type": "basic"}, {"front": "Amplitude from a graph's max and min?", "back": "(max − min)/2", "type": "basic"}], "knowledge_points": [
