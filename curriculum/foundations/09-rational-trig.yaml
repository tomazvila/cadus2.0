      {"problem": "Two angles of a triangle are both $45^\\circ$. The side opposite one is $7$. Find the side opposite the other.", "answer": "7", "solution_sketch": "Equal sine values in the sine rule give equal opposite sides, so the unknown side is $7$.", "answer_contract": {"kind": "exact"}}, {"problem": "In a triangle $A=60^\\circ$, $B=30^\\circ$, and $a=9\\sqrt3$. Find $b$.", "answer": "9", "solution_sketch": "$b=9\\sqrt3(1/2)/(\\sqrt3/2)=9$; the radical cancels.", "answer_contract": {"kind": "exact"}}
