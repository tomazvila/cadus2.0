      {"problem": "Together two crews finish in $4$ hours; the first alone needs $6$. Find the second crew's solo time, in hours.", "answer": "12", "solution_sketch": "Subtract rates: $1/4-1/6=1/12$ job per hour; the solo time is $12$ hours.", "answer_contract": {"kind": "exact"}}, {"problem": "Two painters together finish half a room per hour. One paints a third per hour. How many hours does the other need for a room?", "answer": "6", "solution_sketch": "The second rate is $1/2-1/3=1/6$ room per hour; its reciprocal is $6$ hours.", "answer_contract": {"kind": "exact"}},
