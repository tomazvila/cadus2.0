topics: [
  {"id": "rational-expression-restrictions", "name": "Excluded Values of Rational Expressions", "core": true, "difficulty": 0.5, "drill": false, "answer_kind": "multi-step", "expected_time_secs": 90, "prerequisites": [{"id": "quadratic-equations-factoring", "weight": 0.5, "key": true}, {"id": "two-step-equations", "weight": 0.4}, {"id": "fraction-basics", "weight": 0.3}], "diagnostic_exemplar": {"problem": "State the excluded value(s) of $\\frac{x + 4}{x^2 - 7x + 12}$.", "answer_contract": {"kind": "list", "ordered": false, "member": {"kind": "exact"}}, "answer": "x = 3 and x = 4", "solution_sketch": "Factor the denominator: $(x - 3)(x - 4) = 0$."}, "anki_seeds": [{"front": "The excluded values of a rational expression are...", "back": "the values that make the denominator zero.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Monomial and simple binomial denominators", "key_prerequisites": ["fraction-basics"], "constraints": "denominators of degree at most 1 here; integer excluded values", "try_first": {"problem": "What is the value of $x-5$ when $x=5$?", "answer_contract": {"kind": "exact"}, "answer": "0", "reveal": "The denominator $x-5$ is $0$ at $x=5$, and a fraction cannot divide by $0$. So $\\frac{3}{x-5}$ has no value at $x=5$."}, "exemplars": [
      {"problem": "For which value of $x$ is $\\dfrac{x+4}{x-9}$ undefined?", "answer": "9", "solution_sketch": "A fraction is undefined when its denominator is zero. Solving $x-9=0$ gives $x=9$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Which number is not in the domain of $f(x)=\\dfrac{2}{x+6}$?", "answer": "-6", "solution_sketch": "The domain leaves out every input that makes the denominator zero. Setting $x+6=0$ gives $x=-6$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has area $24$ square centimeters and width $x-3$ centimeters, so its length is $\\dfrac{24}{x-3}$ centimeters. For which value of $x$ does this formula have no meaning?", "answer": "3", "solution_sketch": "The formula divides by the width, so the width must not be zero. The width $x-3$ equals $0$ when $x=3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A prize of $900$ dollars is shared equally among $n-8$ winners, so each winner receives $\\dfrac{900}{n-8}$ dollars. For which value of $n$ is this formula undefined?", "answer": "8", "solution_sketch": "Each share divides by the number of winners, which must not be zero. The count $n-8$ is zero when $n=8$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which value of $x$ is the expression $\\dfrac{x-5}{x-5}$ undefined?", "answer": "5", "solution_sketch": "The original fraction has the denominator $x-5$, which is zero at $x=5$. Cancelling does not remove that restriction.", "answer_contract": {"kind": "exact"}},
      {"problem": "Which input is not in the domain of $g(x)=\\dfrac{x^2+1}{x}$?", "answer": "0", "solution_sketch": "The denominator is $x$, which is zero only at $x=0$. The numerator $x^2+1$ does not change the domain.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which value of $x$ is $\\dfrac{x-4}{x+1}$ undefined?", "answer": "-1", "solution_sketch": "Only the denominator matters here. The equation $x+1=0$ gives $x=-1$, while the numerator is $0$ at $x=4$, where the fraction is defined.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Solve a linear denominator equal to zero", "key_prerequisites": ["two-step-equations"], "constraints": "denominators of the form ax + b with small integer a and b; the excluded value is an integer or a simple fraction", "exemplars": [
      {"problem": "For which value of $x$ is $\\dfrac{7}{2x-6}$ undefined?", "answer": "3", "solution_sketch": "The expression is undefined when the denominator is zero. Setting $2x-6=0$ gives $2x=6$, so $x=3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Which input is not in the domain of $f(x)=\\dfrac{x+1}{3x+12}$?", "answer": "-4", "solution_sketch": "The denominator $3x+12$ is zero when $3x=-12$. Dividing by $3$ gives $x=-4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A cyclist rides $30$ kilometers at a speed of $2t-5$ kilometers per hour, so the ride takes $\\dfrac{30}{2t-5}$ hours. For which value of $t$ is this formula undefined?", "answer": "5/2", "solution_sketch": "The time divides by the speed, which must not be zero. Solving $2t-5=0$ gives $t=\\frac{5}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which value of $x$ is $\\dfrac{3}{5x+2}$ undefined?", "answer": "-2/5", "solution_sketch": "The fraction is undefined where its denominator is zero. Setting $5x+2=0$ gives $5x=-2$, so $x=-\\frac{2}{5}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which value of $x$ is $\\dfrac{6}{2x-8}$ undefined?", "answer": "4", "solution_sketch": "The value is not the number $8$. The equation $2x-8=0$ gives $2x=8$, so $x=4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ribbon $60$ centimeters long is cut into pieces of length $3-2x$ centimeters, so the number of pieces is $\\dfrac{60}{3-2x}$. For which value of $x$ is this formula undefined?", "answer": "3/2", "solution_sketch": "The piece length must not be zero, or the division fails. Solving $3-2x=0$ gives $2x=3$, so $x=\\frac{3}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which value of $x$ is $\\dfrac{2x-1}{4x+6}$ undefined?", "answer": "-3/2", "solution_sketch": "Only the denominator matters here, not the numerator. The equation $4x+6=0$ gives $4x=-6$, so $x=-\\frac{3}{2}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Factorable quadratic denominators", "key_prerequisites": ["quadratic-equations-factoring"], "constraints": "denominators are factorable quadratics (difference of squares or monic trinomials) with two integer roots; give both excluded values", "exemplars": [
      {"problem": "For which values of $x$ is $\\dfrac{x+2}{x^2-7x+10}$ undefined?", "answer": "2, 5", "solution_sketch": "Factor the denominator: $x^2-7x+10=(x-2)(x-5)$. Each factor gives one excluded value, $x=2$ and $x=5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which values of $x$ is $\\dfrac{x+1}{x^2-9}$ undefined?", "answer": "-3, 3", "solution_sketch": "The denominator is a difference of squares, $(x-3)(x+3)$. It is zero at $x=3$ and at $x=-3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has area $60$ and width $x^2-5x-14$, so its length is $\\dfrac{60}{x^2-5x-14}$. For which values of $x$ is this formula undefined?", "answer": "-2, 7", "solution_sketch": "The width factors as $(x-7)(x+2)$. It is zero at $x=7$ and at $x=-2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Which inputs are not in the domain of $h(x)=\\dfrac{x}{x^2+4x}$?", "answer": "-4, 0", "solution_sketch": "Factor the denominator: $x^2+4x=x(x+4)$. It is zero at $x=0$ and at $x=-4$, although one factor $x$ also divides the numerator.", "answer_contract": {"kind": "exact"}},
      {"problem": "Cancelling the common factor $x-2$ in $\\dfrac{x-2}{x^2-4}$ leaves $\\dfrac{1}{x+2}$. For which values of $x$ is the original expression undefined?", "answer": "-2, 2", "solution_sketch": "The original denominator is $(x-2)(x+2)$. It is zero at $x=2$ and at $x=-2$, even though the factor $x-2$ cancels.", "answer_contract": {"kind": "exact"}},
      {"problem": "A pump setting $x$ gives a filling time of $\\dfrac{50}{x^2+x-12}$ hours. For which settings is this formula undefined?", "answer": "-4, 3", "solution_sketch": "Factor the denominator: $x^2+x-12=(x+4)(x-3)$. It is zero at $x=-4$ and at $x=3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which values of $x$ is $\\dfrac{3}{x^2-16}$ undefined?", "answer": "-4, 4", "solution_sketch": "The denominator has two factors: $x^2-16=(x-4)(x+4)$. The denominator is zero at $x=4$ and at $x=-4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "For which values of $x$ is $\\dfrac{1}{x^2-6x+9}$ undefined?", "answer": "3", "solution_sketch": "The denominator is a perfect square: $x^2-6x+9=(x-3)^2$. It is zero only at $x=3$, a single excluded value.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "simplifying-rational-monomials", "name": "Simplifying Monomial Rational Expressions", "core": true, "difficulty": 0.5, "drill": false, "answer_kind": "expression", "expected_time_secs": 90, "prerequisites": [{"id": "equivalent-fractions", "weight": 0.7, "key": true}, {"id": "exponent-product-quotient-rules", "weight": 0.6, "key": true}, {"id": "negative-zero-exponents", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Simplify $\\frac{15x^3 y}{20x y^3}$.", "answer": "3x^2/(4y^2)", "solution_sketch": "$\\frac{15}{20} = \\frac{3}{4}$, $\\frac{x^3}{x} = x^2$, and $\\frac{y}{y^3} = \\frac{1}{y^2}$."}, "anki_seeds": [{"front": "To simplify a monomial fraction, reduce the coefficients and...", "back": "subtract exponents of like bases.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Reduce numeric coefficients", "key_prerequisites": ["equivalent-fractions"], "constraints": "coefficients at most 20; single variable", "exemplars": [
      {"problem": "Simplify $\\dfrac{12x}{20}$.", "answer": "3*x/5", "solution_sketch": "The greatest common divisor of $12$ and $20$ is $4$. Dividing both by $4$ leaves $\\frac{3x}{5}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{6x^2}{9x}$ for $x\\ne0$.", "answer": "2*x/3", "solution_sketch": "Divide the coefficients by $3$ to get $\\frac{2}{3}$. Then $\\frac{x^2}{x}=x$, so the result is $\\frac{2x}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has area $15x$ square meters and width $10$ meters, with $x>0$. What is its length in meters?", "answer": "3*x/2", "solution_sketch": "The length is the area divided by the width, which is $\\frac{15x}{10}$. Dividing the coefficients by $5$ gives $\\frac{3x}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A hiker covers $18x$ meters in $24$ minutes, with $x>0$. How many meters per minute does the hiker walk?", "answer": "3*x/4", "solution_sketch": "Speed is distance divided by time, so the speed is $\\frac{18x}{24}$. Dividing the coefficients by $6$ gives $\\frac{3x}{4}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{-16x}{12}$.", "answer": "-4*x/3", "solution_sketch": "The common divisor of $16$ and $12$ is $4$. The sign stays negative, so the result is $-\\frac{4x}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{16x}{20}$.", "answer": "4*x/5", "solution_sketch": "Divide the top and the bottom by the same number. Dividing both by $4$ gives $\\frac{4x}{5}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{20x}{16}$.", "answer": "5*x/4", "solution_sketch": "Both coefficients are divisible by $4$, so the common factor can go. Dividing top and bottom by $4$ gives $\\frac{5x}{4}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{-14x}{-21}$.", "answer": "2*x/3", "solution_sketch": "The two negative signs cancel, so the fraction is positive. The common divisor of $14$ and $21$ is $7$, and dividing top and bottom by $7$ gives $\\frac{2x}{3}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Quotients of powers", "key_prerequisites": ["exponent-product-quotient-rules"], "constraints": "one variable; subtract exponents, leaving the variable in the numerator or in the denominator; coefficients at most 20", "try_first": {"problem": "Write $\\dfrac{x^2}{x^5}$ as $\\dfrac{x\\cdot x}{x\\cdot x\\cdot x\\cdot x\\cdot x}$ and cancel. How many factors of $x$ are left in the denominator?", "answer_contract": {"kind": "exact"}, "answer": "3", "reveal": "Two factors of $x$ cancel and three stay below, so $\\frac{x^2}{x^5}=\\frac{1}{x^3}$. When the bottom has more factors, the extra powers stay in the denominator."}, "exemplars": [
      {"problem": "Simplify $\\dfrac{x^7}{x^3}$.", "answer": "x^4", "solution_sketch": "Cancel three factors of $x$ from the top and the bottom. The top keeps $7-3=4$ factors, so the result is $x^4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{10x^3}{15x^5}$ for $x\\ne0$.", "answer": "2/(3*x^2)", "solution_sketch": "Reduce $\\frac{10}{15}$ to $\\frac{2}{3}$. The bottom has two more factors of $x$ than the top, so $x^2$ stays in the denominator.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{(x^2)^3}{x^4}$ for $x\\ne0$.", "answer": "x^2", "solution_sketch": "The power rule gives $(x^2)^3=x^6$. Then the quotient has $6-4=2$ factors of $x$ left on top, so the result is $x^2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A box has volume $12x^5$ cubic centimeters and base area $8x^2$ square centimeters, with $x>0$. What is its height in centimeters?", "answer": "3*x^3/2", "solution_sketch": "Height is volume divided by base area, so it is $\\frac{12x^5}{8x^2}$. Reduce $\\frac{12}{8}$ to $\\frac{3}{2}$ and subtract exponents to get $x^3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A machine makes $9x^2$ parts in $15x^4$ seconds, with $x>0$. How many parts does it make per second?", "answer": "3/(5*x^2)", "solution_sketch": "The rate is parts divided by seconds, which is $\\frac{9x^2}{15x^4}$. Reduce $\\frac{9}{15}$ to $\\frac{3}{5}$; the bottom has two more factors of $x$, so $x^2$ stays below.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^4}{x^4}$ for $x\\ne0$.", "answer": "1", "solution_sketch": "All four factors of $x$ cancel with their partners. What is left is the number $1$, so the result is $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{18x}{12x^4}$ for $x\\ne0$.", "answer": "3/(2*x^3)", "solution_sketch": "Reduce $\\frac{18}{12}$ to $\\frac{3}{2}$. One factor of $x$ cancels, and three extra factors stay in the denominator, giving $x^3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^3}{x^5}$.", "answer": "1/x^2", "solution_sketch": "The bottom has more factors of $x$, so $x^2$ stays in the denominator and the result is $\\frac{1}{x^2}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Several variables at once", "key_prerequisites": ["exponent-product-quotient-rules", "equivalent-fractions"], "constraints": "two or three variables with exponents at most 3; reduce the coefficients and each variable separately", "exemplars": [
      {"problem": "Simplify $\\dfrac{12x^2y}{18xy^2}$ for $x,y\\ne0$.", "answer": "2*x/(3*y)", "solution_sketch": "Reduce $\\frac{12}{18}$ to $\\frac{2}{3}$. One $x$ cancels and one $y$ cancels, leaving $x$ on top and $y$ below.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{4a^3b}{6a}$ for $a\\ne0$.", "answer": "2*a^2*b/3", "solution_sketch": "Reduce $\\frac{4}{6}$ to $\\frac{2}{3}$ and cancel one $a$. The factor $b$ has no partner below, so it stays on top.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{15xy^2}{20x^2y}$ for $x,y\\ne0$.", "answer": "3*y/(4*x)", "solution_sketch": "Divide the coefficients by $5$ to get $\\frac{3}{4}$. Cancelling leaves one $y$ on top and one $x$ below.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{(3ab)^2}{6a^2b^3}$ for $a,b\\ne0$.", "answer": "3/(2*b)", "solution_sketch": "Expand the top: $(3ab)^2=9a^2b^2$. Reduce $\\frac{9}{6}$ to $\\frac{3}{2}$; the $a$ factors cancel and one $b$ stays below.", "answer_contract": {"kind": "exact"}},
      {"problem": "A prism has volume $24x^3y^2$ and base area $18x^2y$, with $x,y>0$. What is its height?", "answer": "4*x*y/3", "solution_sketch": "Height is volume divided by base area. Reduce $\\frac{24}{18}$ to $\\frac{4}{3}$; the powers leave $x$ and $y$ on top.", "answer_contract": {"kind": "exact"}},
      {"problem": "A field has area $45a^2b^3$ square meters and length $6ab^2$ meters, with $a,b>0$. What is its width in meters?", "answer": "15*a*b/2", "solution_sketch": "Width is area divided by length. Reduce $\\frac{45}{6}$ to $\\frac{15}{2}$; one $a$ and one $b$ stay on top.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{8m^2n}{12mn^3}$.", "answer": "2*m/(3*n^2)", "solution_sketch": "Reduce $\\frac{8}{12}$ to $\\frac{2}{3}$ and cancel one $m$. The bottom has more factors of $n$, so $n^2$ stays below.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{14p^3q^2r}{21p^3qr^2}$ for $p,q,r\\ne0$.", "answer": "2*q/(3*r)", "solution_sketch": "Reduce $\\frac{14}{21}$ to $\\frac{2}{3}$. The $p$ factors cancel completely, leaving $q$ on top and $r$ below.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "rational-expressions", "name": "Simplifying Rational Expressions", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "simplifying-rational-monomials", "weight": 0.7, "key": true}, {"id": "factoring-trinomials", "weight": 0.6, "key": true}, {"id": "rational-expression-restrictions", "weight": 0.4}, {"id": "difference-of-squares", "weight": 0.4}, {"id": "factoring-gcf", "weight": 0.3}], "diagnostic_exemplar": {"problem": "Simplify $\\frac{x^2 - 9}{6 - 2x}$.", "answer": "-(x + 3)/2", "solution_sketch": "$6 - 2x = -2(x - 3)$, and $x^2 - 9 = (x - 3)(x + 3)$; the $(x - 3)$ cancels and the minus sign survives."}, "anki_seeds": [{"front": "(a - b)/(b - a) = ?", "back": "-1", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Factor, then cancel a common binomial", "key_prerequisites": ["factoring-trinomials", "difference-of-squares"], "constraints": "numerator is a difference of squares or a monic trinomial; the denominator is one of its linear factors; the answer is a binomial", "exemplars": [
      {"problem": "Simplify $\\dfrac{x^2-9}{x+3}$ for $x\\ne-3$.", "answer": "x-3", "solution_sketch": "Factor the difference of squares as $(x-3)(x+3)$. Then cancel the factor $x+3$, which leaves $x-3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-6x+8}{x-2}$ for $x\\ne2$.", "answer": "x-4", "solution_sketch": "The numbers with sum $-6$ and product $8$ are $-2$ and $-4$, so the numerator is $(x-2)(x-4)$. Cancel $x-2$ to get $x-4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has area $x^2+9x+20$ square meters and width $x+4$ meters. What is its length in meters?", "answer": "x+5", "solution_sketch": "Length is area divided by width. The numerator factors as $(x+4)(x+5)$, so cancelling $x+4$ leaves $x+5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2+4x}{x+4}$ for $x\\ne-4$.", "answer": "x", "solution_sketch": "Factor out $x$ in the numerator: $x^2+4x=x(x+4)$. Cancelling $x+4$ from the top and the bottom leaves just $x$.", "answer_contract": {"kind": "exact"}},
      {"problem": "The total cost of some tickets is $x^2-x-12$ dollars and each ticket costs $x-4$ dollars, with $x>4$. How many tickets were bought?", "answer": "x+3", "solution_sketch": "The number of tickets is the total cost divided by the price of one ticket. Since $x^2-x-12=(x-4)(x+3)$, cancelling $x-4$ leaves $x+3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-25}{x+5}$.", "answer": "x-5", "solution_sketch": "Cancel a factor, not a term. Factoring gives $x^2-25=(x-5)(x+5)$, and cancelling the factor $x+5$ leaves $x-5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{2x^2+10x}{x+5}$ for $x\\ne-5$.", "answer": "2*x", "solution_sketch": "Factor the numerator: $2x^2+10x=2x(x+5)$. Cancelling the common factor $x+5$ from the top and the bottom leaves $2x$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Factor numerator and denominator", "key_prerequisites": ["factoring-trinomials"], "constraints": "numerator and denominator both factor into linear binomials with integer roots; exactly one factor cancels", "exemplars": [
      {"problem": "Simplify $\\dfrac{x^2-4}{x^2+4x+4}$ for $x\\ne-2$.", "answer": "(x-2)/(x+2)", "solution_sketch": "Factor to $\\frac{(x-2)(x+2)}{(x+2)^2}$. Cancel one factor $x+2$ from the top and the bottom, which leaves $\\frac{x-2}{x+2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-x-6}{x^2-9}$ for $x\\ne\\pm3$.", "answer": "(x+2)/(x+3)", "solution_sketch": "Factor to $\\frac{(x-3)(x+2)}{(x-3)(x+3)}$. Then cancel the common factor $x-3$, which leaves $\\frac{x+2}{x+3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A garden has area $x^2+3x-10$ square meters and a patio has area $x^2-4$ square meters. How many times as large as the patio is the garden?", "answer": "(x+5)/(x+2)", "solution_sketch": "Divide the garden area by the patio area. Factoring gives $\\frac{(x+5)(x-2)}{(x-2)(x+2)}$, and cancelling $x-2$ leaves $\\frac{x+5}{x+2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{2x^2+6x}{x^2+3x}$ for $x\\ne0,-3$.", "answer": "2", "solution_sketch": "Factoring gives $\\frac{2x(x+3)}{x(x+3)}$. Both common factors $x$ and $x+3$ cancel, which leaves only the number $2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A trip of $x^2-x-12$ kilometers takes $x^2-16$ minutes, with $x>4$. What is the average speed in kilometers per minute?", "answer": "(x+3)/(x+4)", "solution_sketch": "Speed is distance divided by time. Factoring gives $\\frac{(x-4)(x+3)}{(x-4)(x+4)}$, so cancelling $x-4$ leaves $\\frac{x+3}{x+4}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-6x+9}{x^2-3x}$ for $x\\ne0,3$.", "answer": "(x-3)/x", "solution_sketch": "The numerator is $(x-3)^2$ and the denominator is $x(x-3)$. Cancel one factor $x-3$ to leave $\\frac{x-3}{x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-4}{x^2-5x+6}$.", "answer": "(x+2)/(x-3)", "solution_sketch": "Cancel factors, not terms of sums. Factoring gives $\\frac{(x-2)(x+2)}{(x-2)(x-3)}$, and cancelling $x-2$ leaves $\\frac{x+2}{x-3}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Opposite factors", "key_prerequisites": ["factoring-gcf", "difference-of-squares"], "constraints": "one factor pair of the form (a - x) and (x - a)", "try_first": {"problem": "What is the value of $\\dfrac{9-x}{x-9}$ when $x=12$?", "answer_contract": {"kind": "exact"}, "answer": "-1", "reveal": "Here $9-x=-3$ and $x-9=3$, so the quotient is $-1$. For any $x$ the two parts are opposites, so $\\frac{9-x}{x-9}$ always equals $-1$."}, "exemplars": [
      {"problem": "Simplify $\\dfrac{5-x}{x-5}$ for $x\\ne5$.", "answer": "-1", "solution_sketch": "Write the numerator as $5-x=-(x-5)$. Cancelling the nonzero factor $x-5$ from the top and the bottom leaves $-1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-4}{2-x}$ for $x\\ne2$.", "answer": "-(x+2)", "solution_sketch": "Factor the numerator as $(x-2)(x+2)$ and write $2-x=-(x-2)$. Cancelling $x-2$ leaves $-(x+2)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{(3-x)^2}{x-3}$ for $x\\ne3$.", "answer": "x-3", "solution_sketch": "Squaring removes the minus sign, so $(3-x)^2=(x-3)^2$. Cancelling one factor $x-3$ leaves $x-3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "The slope of the line through $(x,x^2)$ and $(4,16)$ is $\\dfrac{16-x^2}{x-4}$, with $x\\ne4$. Simplify this slope.", "answer": "-(x+4)", "solution_sketch": "Factor the numerator: $16-x^2=(4-x)(4+x)$. Since $4-x=-(x-4)$, cancelling the factor $x-4$ from the top and the bottom leaves $-(x+4)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "The average rate of change of $f(x)=x^2$ from $x=2$ to $x=t$ is $\\dfrac{f(2)-f(t)}{2-t}$, with $t\\ne2$. Simplify it.", "answer": "t+2", "solution_sketch": "The numerator is $4-t^2=(2-t)(2+t)$. The factor $2-t$ matches the denominator exactly, so cancelling it leaves $t+2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{x^2-9}{3-x}$.", "answer": "-(x+3)", "solution_sketch": "The factors $3-x$ and $x-3$ are opposite. Since $3-x=-(x-3)$, cancelling $x-3$ from $(x-3)(x+3)$ leaves $-(x+3)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{2-x}{x^2-4}$ for $x\\ne\\pm2$.", "answer": "-1/(x+2)", "solution_sketch": "Write $2-x=-(x-2)$ and $x^2-4=(x-2)(x+2)$. Cancelling the common factor $x-2$ from the top and the bottom leaves $-\\frac{1}{x+2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\dfrac{6-2x}{x^2-9}$ for $x\\ne\\pm3$.", "answer": "-2/(x+3)", "solution_sketch": "Write $6-2x=-2(x-3)$ and $x^2-9=(x-3)(x+3)$. Cancelling the common factor $x-3$ from the top and the bottom leaves $-\\frac{2}{x+3}$.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "multiplying-rational-expressions", "name": "Multiplying Rational Expressions", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "rational-expressions", "weight": 0.7, "key": true}, {"id": "multiplying-fractions", "weight": 0.7, "key": true}, {"id": "factoring-trinomials", "weight": 0.4}], "diagnostic_exemplar": {"problem": "Multiply $\\frac{x^2 - 4}{x^2 + 5x} \\cdot \\frac{x + 5}{x - 2}$.", "answer": "(x + 2)/x", "solution_sketch": "Factor to $\\frac{(x - 2)(x + 2)}{x(x + 5)} \\cdot \\frac{x + 5}{x - 2}$; the $(x - 2)$ and $(x + 5)$ cancel."}, "anki_seeds": [{"front": "To multiply rational expressions...", "back": "factor everything, cancel common factors, then multiply what remains.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Multiply monomial rational expressions", "key_prerequisites": ["multiplying-fractions"], "constraints": "coefficients at most 12; results must reduce to a single fraction", "exemplars": [
      {"problem": "Multiply $\\dfrac{2}{x}\\cdot\\dfrac{x^2}{6}$ for $x\\ne0$.", "answer": "x/3", "solution_sketch": "Multiply the tops and the bottoms to get $\\frac{2x^2}{6x}$. Dividing by $2x$ leaves $\\frac{x}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\dfrac{3x}{4}\\cdot\\dfrac{8}{9x}$ for $x\\ne0$.", "answer": "2/3", "solution_sketch": "The factors $x$ cancel completely. The remaining coefficients give $\\frac{24}{36}$, which reduces to $\\frac{2}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has length $\\dfrac{6}{x}$ meters and width $\\dfrac{x^2}{8}$ meters, with $x>0$. What is its area in square meters?", "answer": "3*x/4", "solution_sketch": "Area is length times width, so the area is $\\frac{6}{x}\\cdot\\frac{x^2}{8}=\\frac{6x^2}{8x}$. Reducing gives $\\frac{3x}{4}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\dfrac{-2x^2}{3}\\cdot\\dfrac{9x}{4}$.", "answer": "-3*x^3/2", "solution_sketch": "One negative factor makes the product negative. Reducing $\\frac{18}{12}$ gives $\\frac{3}{2}$, and $x^2\\cdot x=x^3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A cyclist rides at $\\dfrac{12}{t}$ kilometers per hour for $\\dfrac{t^2}{18}$ hours, with $t>0$. How far does the cyclist ride in kilometers?", "answer": "2*t/3", "solution_sketch": "Distance is speed times time, so the distance is $\\frac{12}{t}\\cdot\\frac{t^2}{18}$. Reducing gives $\\frac{2t}{3}$ kilometers.", "answer_contract": {"kind": "exact"}},
      {"problem": "A hiker walks at $\\dfrac{x}{6}$ kilometers per hour and the trail is $\\dfrac{x^2}{4}$ kilometers long, with $x>0$. How many hours does the walk take?", "answer": "3*x/2", "solution_sketch": "Time is distance divided by speed, so the time is $\\frac{x^2}{4}\\cdot\\frac{6}{x}$. That equals $\\frac{6x^2}{4x}$, which reduces to $\\frac{3x}{2}$ hours.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\dfrac{5}{x^2}\\cdot\\dfrac{2}{x}$ for $x\\ne0$.", "answer": "10/x^3", "solution_sketch": "Multiply the numerators to get $10$. The denominator powers add to give $x^2\\cdot x=x^3$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Factor, multiply, and cancel", "key_prerequisites": ["rational-expressions", "factoring-trinomials"], "constraints": "one factor needs a difference of squares or a monic trinomial factored first; exactly one binomial cancels", "exemplars": [
      {"problem": "Multiply $\\dfrac{x^2-9}{x-3}\\cdot\\dfrac{2}{5}$ for $x\\ne3$.", "answer": "2*(x+3)/5", "solution_sketch": "Factor $x^2-9=(x-3)(x+3)$ and cancel the binomial $x-3$. This leaves $\\frac{2(x+3)}{5}$ as the product.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\dfrac{x}{x+4}\\cdot\\dfrac{x^2+8x+16}{x}$ for $x\\ne0,-4$.", "answer": "x+4", "solution_sketch": "The trinomial is $(x+4)^2$. Cancelling $x$ and one factor $x+4$ leaves $x+4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has length $\\dfrac{x^2-25}{x+5}$ meters and width $\\dfrac{3}{10}$ meters, with $x>5$. What is its area in square meters?", "answer": "3*(x-5)/10", "solution_sketch": "Area is length times width. Since $x^2-25=(x-5)(x+5)$, cancelling the factor $x+5$ leaves $\\frac{3(x-5)}{10}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\dfrac{x^2+7x+12}{x+3}\\cdot\\dfrac{5}{7}$ for $x\\ne-3$.", "answer": "5*(x+4)/7", "solution_sketch": "Factor the numerator as $x^2+7x+12=(x+3)(x+4)$ and cancel the binomial $x+3$. This leaves $\\frac{5(x+4)}{7}$ as the product.", "answer_contract": {"kind": "exact"}},
      {"problem": "A train travels at $\\dfrac{x^2+6x+8}{x+2}$ kilometers per hour for $\\dfrac{3}{x}$ hours, with $x>0$. How far does it travel in kilometers?", "answer": "3*(x+4)/x", "solution_sketch": "Distance is speed times time. The speed simplifies because $x^2+6x+8=(x+2)(x+4)$, so the distance is $(x+4)\\cdot\\frac{3}{x}=\\frac{3(x+4)}{x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\dfrac{3}{x-2}\\cdot\\dfrac{x^2-4x+4}{6}$ for $x\\ne2$.", "answer": "(x-2)/2", "solution_sketch": "The trinomial is $(x-2)^2$. Cancelling one $x-2$ and reducing $\\frac{3}{6}$ leaves $\\frac{x-2}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the product $\\dfrac{x^2-36}{x-6}\\cdot\\dfrac{5}{2}$.", "answer": "5*(x+6)/2", "solution_sketch": "Factor the numerator first. Since $x^2-36=(x-6)(x+6)$, cancelling $x-6$ leaves $\\frac{5(x+6)}{2}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Cross-cancel before multiplying", "key_prerequisites": ["rational-expressions"], "constraints": "a factor of each numerator cancels against a factor of the other denominator; cancel before multiplying, never expand", "exemplars": [
      {"problem": "Multiply $\\dfrac{x^2-1}{x+2}\\cdot\\dfrac{x+2}{x+1}$ for $x\\ne-2,-1$.", "answer": "x-1", "solution_sketch": "Factor $x^2-1=(x-1)(x+1)$. Cancel $x+2$ and $x+1$ across the product, which leaves $x-1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\dfrac{x^2+3x}{x^2-4}\\cdot\\dfrac{x+2}{x}$ for $x\\ne0,\\pm2$.", "answer": "(x+3)/(x-2)", "solution_sketch": "Factor the first fraction, which gives $\\frac{x(x+3)}{(x-2)(x+2)}\\cdot\\frac{x+2}{x}$. Cancelling the factors $x$ and $x+2$ leaves $\\frac{x+3}{x-2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A banner has length $\\dfrac{x+3}{x-1}$ meters and width $\\dfrac{x^2-1}{x+3}$ meters, with $x>1$. What is its area in square meters?", "answer": "x+1", "solution_sketch": "Area is length times width. After factoring $x^2-1=(x-1)(x+1)$, the factors $x+3$ and $x-1$ cancel, leaving $x+1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\dfrac{x-2}{6}\\cdot\\dfrac{9}{2-x}$ for $x\\ne2$.", "answer": "-3/2", "solution_sketch": "The factors $x-2$ and $2-x$ are opposites, which gives $-1$. Reducing $\\frac{9}{6}$ gives $\\frac{3}{2}$, so the product is $-\\frac{3}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A shop sells $\\dfrac{x+2}{x+5}$ kilograms of fruit at $\\dfrac{x^2-25}{x+2}$ dollars per kilogram, with $x>5$. How much does the fruit cost in dollars?", "answer": "x-5", "solution_sketch": "The cost is the mass times the price per kilogram. Factoring $x^2-25=(x-5)(x+5)$ cancels $x+2$ and $x+5$, leaving $x-5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\dfrac{2(x+1)}{3(x-1)}\\cdot\\dfrac{9(x-1)}{4(x+1)}$ for $x\\ne\\pm1$.", "answer": "3/2", "solution_sketch": "Cancel $x+1$ and $x-1$ across the product. The coefficients give $\\frac{18}{12}$, which reduces to $\\frac{3}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the product $\\dfrac{x^2-4}{x+3}\\cdot\\dfrac{x+3}{x-2}$.", "answer": "x+2", "solution_sketch": "Factoring $x^2-4=(x-2)(x+2)$ and cancelling $x+3$ and $x-2$ leaves $x+2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\dfrac{x^2+5x+6}{x^2-1}\\cdot\\dfrac{x-1}{x+2}$ for $x\\ne\\pm1,-2$.", "answer": "(x+3)/(x+1)", "solution_sketch": "Factor the first fraction, which gives $\\frac{(x+2)(x+3)}{(x-1)(x+1)}\\cdot\\frac{x-1}{x+2}$. Cancelling the factors $x+2$ and $x-1$ leaves $\\frac{x+3}{x+1}$.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "dividing-rational-expressions", "name": "Dividing Rational Expressions", "core": true, "difficulty": 0.65, "drill": false, "answer_kind": "expression", "expected_time_secs": 120, "prerequisites": [{"id": "multiplying-rational-expressions", "weight": 0.7, "key": true}, {"id": "dividing-fractions", "weight": 0.6, "key": true}], "diagnostic_exemplar": {"problem": "Divide $\\frac{x^2 + 6x + 8}{x - 1} \\div \\frac{x + 2}{x - 1}$.", "answer": "x + 4", "solution_sketch": "Multiply by the reciprocal; $x^2 + 6x + 8 = (x + 2)(x + 4)$, and $(x + 2)$ and $(x - 1)$ both cancel."}, "anki_seeds": [{"front": "To divide rational expressions...", "back": "multiply by the reciprocal of the divisor.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Divide monomial rational expressions", "key_prerequisites": ["dividing-fractions"], "constraints": "flip-and-multiply; every quotient cancels to a simple monomial fraction", "try_first": {"problem": "A ribbon $\\frac{3}{4}$ metre long is cut into pieces that are each $\\frac{1}{8}$ metre long. How many pieces are there?", "answer_contract": {"kind": "exact"}, "answer": "6", "reveal": "Dividing by $\\frac{1}{8}$ asks how many eighths fit, which is the same as multiplying by $8$: $\\frac{3}{4}\\cdot 8=6$. The same rule holds when the fractions contain $x$: divide by a fraction by multiplying by its reciprocal."}, "exemplars": [
      {"problem": "Divide $\\frac{x}{3} \\div \\frac{x^2}{9}$.", "answer": "3/x", "solution_sketch": "Flip the divisor and multiply: $\\frac{x}{3}\\cdot\\frac{9}{x^2}=\\frac{9x}{3x^2}$. Reduce $9$ and $3$ to $3$ and cancel one $x$, which leaves $\\frac{3}{x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{5}{x^2} \\div \\frac{10}{x}$.", "answer": "1/(2*x)", "solution_sketch": "Multiply by the reciprocal: $\\frac{5}{x^2}\\cdot\\frac{x}{10}=\\frac{5x}{10x^2}$. Halve the numbers and cancel one $x$ to get $\\frac{1}{2x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ribbon $\\frac{8}{x}$ metres long is cut into pieces that are each $\\frac{2}{x^2}$ metres long. How many pieces are there?", "answer": "4*x", "solution_sketch": "The number of pieces is the total length divided by the piece length: $\\frac{8}{x}\\div\\frac{2}{x^2}=\\frac{8}{x}\\cdot\\frac{x^2}{2}$. This reduces to $4x$ pieces.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2}{4} \\div \\frac{x}{8}$.", "answer": "2*x", "solution_sketch": "Multiply by $\\frac{8}{x}$ to get $\\frac{8x^2}{4x}$. Divide $8$ by $4$ and cancel one $x$, which leaves $2x$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has an area of $12x^3$ square metres and a width of $4x$ metres. What is its length?", "answer": "3*x^2", "solution_sketch": "Area is length times width, so the length is the area divided by the width: $\\frac{12x^3}{4x}$. This equals $3x^2$ metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the quotient of $\\frac{x}{2}$ divided by $\\frac{x}{6}$.", "answer": "3", "solution_sketch": "Flip the divisor, then multiply. The work is $\\frac{x}{2}\\cdot\\frac{6}{x}=\\frac{6x}{2x}$, which is $3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tank holds $\\frac{15n^2}{p}$ litres of water. A pump removes $\\frac{5n}{p^2}$ litres every minute. How many minutes does it take to empty the tank?", "answer": "3*n*p", "solution_sketch": "The time is the volume divided by the rate: $\\frac{15n^2}{p}\\cdot\\frac{p^2}{5n}$. Reduce $15$ and $5$ to $3$, cancel one $n$ and one $p$, and the time is $3np$ minutes.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{14a}{b^2} \\div \\frac{7a^2}{b}$.", "answer": "2/(a*b)", "solution_sketch": "Flip the divisor: $\\frac{14a}{b^2}\\cdot\\frac{b}{7a^2}=\\frac{14ab}{7a^2b^2}$. Divide $14$ by $7$ and cancel one $a$ and one $b$, which leaves $\\frac{2}{ab}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A cyclist rides for $\\frac{x}{2}$ hours at a speed of $\\frac{12}{x^2}$ kilometres per hour. How far does the cyclist ride?", "answer": "6/x", "solution_sketch": "Distance is speed times time, so multiply: $\\frac{12}{x^2}\\cdot\\frac{x}{2}=\\frac{12x}{2x^2}$. This reduces to $\\frac{6}{x}$ kilometres.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Divide with binomial factors", "key_prerequisites": ["multiplying-rational-expressions", "dividing-fractions"], "constraints": "flip the divisor, then cancel matching linear binomials; no trinomials at this level", "exemplars": [
      {"problem": "Divide $\\frac{x+1}{x-2} \\div \\frac{x+1}{x+2}$.", "answer": "(x+2)/(x-2)", "solution_sketch": "Invert the divisor and multiply: $\\frac{x+1}{x-2}\\cdot\\frac{x+2}{x+1}$. The factor $x+1$ cancels, which leaves $\\frac{x+2}{x-2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2-25}{x} \\div \\frac{x-5}{x}$.", "answer": "x+5", "solution_sketch": "Multiply by $\\frac{x}{x-5}$ and write $x^2-25=(x-5)(x+5)$. The factors $x$ and $x-5$ cancel, which leaves $x+5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangular garden has an area of $\\frac{x+4}{x-1}$ square metres and a width of $\\frac{x+4}{x+1}$ metres. What is its length?", "answer": "(x+1)/(x-1)", "solution_sketch": "Length is area divided by width: $\\frac{x+4}{x-1}\\cdot\\frac{x+1}{x+4}$. The factor $x+4$ cancels, so the length is $\\frac{x+1}{x-1}$ metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{2}{x-1} \\div \\frac{6}{1-x}$.", "answer": "-1/3", "solution_sketch": "Multiply by $\\frac{1-x}{6}$ to get $\\frac{2(1-x)}{6(x-1)}$. Because $1-x=-(x-1)$, the fraction becomes $-\\frac{2}{6}$, which is $-\\frac{1}{3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A train travels $\\frac{x^2-36}{x}$ kilometres at an average speed of $\\frac{x-6}{x}$ kilometres per hour. How many hours does the trip take?", "answer": "x+6", "solution_sketch": "Time is distance divided by speed: $\\frac{x^2-36}{x}\\cdot\\frac{x}{x-6}$. Write $x^2-36=(x-6)(x+6)$ and cancel $x$ and $x-6$ to get $x+6$ hours.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the quotient $\\frac{x+3}{x} \\div \\frac{x+3}{x+1}$.", "answer": "(x+1)/x", "solution_sketch": "Invert the divisor, not the first fraction. The work is $\\frac{x+3}{x}\\cdot\\frac{x+1}{x+3}$, and cancelling $x+3$ leaves $\\frac{x+1}{x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $(x+3)^2$ by $\\frac{x+3}{x}$.", "answer": "x*(x+3)", "solution_sketch": "Write the divisor as a fraction and multiply by its reciprocal $\\frac{x}{x+3}$. One factor $x+3$ of the square cancels, which leaves $x(x+3)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A hose delivers $\\frac{x+2}{x}$ litres per minute for $\\frac{x^2}{x+2}$ minutes. How many litres does it deliver?", "answer": "x", "solution_sketch": "Volume is rate times time, so multiply: $\\frac{x+2}{x}\\cdot\\frac{x^2}{x+2}$. The factors $x+2$ and one $x$ cancel, so the hose delivers $x$ litres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x-4}{3} \\div \\frac{4-x}{9}$.", "answer": "-3", "solution_sketch": "Multiply by $\\frac{9}{4-x}$ to get $\\frac{9(x-4)}{3(4-x)}$. Since $x-4$ and $4-x$ are opposites, the quotient is $-\\frac{9}{3}=-3$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Divide with trinomial factoring", "key_prerequisites": ["multiplying-rational-expressions"], "constraints": "one numerator is a monic trinomial factoring over the integers; flip, factor, then cancel", "exemplars": [
      {"problem": "Divide $(x^2+7x+12)$ by $(x+3)$.", "answer": "x+4", "solution_sketch": "Write the divisor as a fraction and factor the trinomial: $x^2+7x+12=(x+3)(x+4)$. Cancelling $x+3$ leaves $x+4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2+7x+10}{x+3} \\div \\frac{x+2}{x+3}$.", "answer": "x+5", "solution_sketch": "Factor $x^2+7x+10=(x+2)(x+5)$ and multiply by the reciprocal $\\frac{x+3}{x+2}$. The factors $x+2$ and $x+3$ cancel, which leaves $x+5$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $(x^2-x-12)$ by $(x^2+6x+9)$.", "answer": "(x-4)/(x+3)", "solution_sketch": "Factor the first as $(x-4)(x+3)$ and the second as $(x+3)^2$. One factor $x+3$ cancels, which leaves $\\frac{x-4}{x+3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has an area of $x^2+5x+6$ square metres and a length of $x+3$ metres. What is its width?", "answer": "x+2", "solution_sketch": "Width is area divided by length: $\\frac{x^2+5x+6}{x+3}$. Factor the numerator as $(x+2)(x+3)$ and cancel $x+3$, so the width is $x+2$ metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x}{x+1} \\div \\frac{x^2+5x+6}{x+1}$.", "answer": "x/((x+2)*(x+3))", "solution_sketch": "Multiply by the reciprocal $\\frac{x+1}{x^2+5x+6}$ and factor $x^2+5x+6=(x+2)(x+3)$. The factor $x+1$ cancels, which leaves $\\frac{x}{(x+2)(x+3)}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $(x^2-2x-8)$ by $(4-x)$.", "answer": "-(x+2)", "solution_sketch": "Factor the numerator as $(x-4)(x+2)$. Since $4-x=-(x-4)$, cancelling the common factor $x-4$ leaves $-(x+2)$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A delivery van drives $\\frac{x^2+8x+12}{x+1}$ kilometres at an average speed of $\\frac{x+2}{x+1}$ kilometres per hour. How many hours does the drive take?", "answer": "x+6", "solution_sketch": "Time is distance divided by speed: $\\frac{x^2+8x+12}{x+1}\\cdot\\frac{x+1}{x+2}$. Factor $x^2+8x+12=(x+2)(x+6)$ and cancel $x+1$ and $x+2$ to get $x+6$ hours.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the quotient of $\\frac{x^2-5x+6}{x+4}$ divided by $\\frac{x-3}{x+4}$.", "answer": "x-2", "solution_sketch": "The numerator factors as $x^2-5x+6=(x-2)(x-3)$. Multiplying by the reciprocal $\\frac{x+4}{x-3}$ also cancels $x-3$, so the correct quotient is $x-2$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tile has a length of $\\frac{x^2-9}{x}$ centimetres and a width of $\\frac{x}{x-3}$ centimetres. What is its area?", "answer": "x+3", "solution_sketch": "Area is length times width: $\\frac{(x-3)(x+3)}{x}\\cdot\\frac{x}{x-3}$. Cancelling $x$ and $x-3$ leaves $x+3$ square centimetres.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "multiplying-dividing-rational-expressions", "name": "Multiplying and Dividing Rational Expressions", "core": false, "difficulty": 0.65, "drill": false, "answer_kind": "expression", "expected_time_secs": 150, "prerequisites": [{"id": "multiplying-rational-expressions", "weight": 0.7, "key": true}, {"id": "dividing-rational-expressions", "weight": 0.7, "key": true}, {"id": "factoring-trinomials", "weight": 0.4}], "diagnostic_exemplar": {"problem": "Simplify $\\frac{x^2 - 4}{x + 1} \\cdot \\frac{x^2 - 1}{x - 2} \\div (x + 2)$.", "answer": "x - 1", "solution_sketch": "Factor everything and treat $\\div (x + 2)$ as $\\times \\frac{1}{x + 2}$; then $(x - 2)$, $(x + 1)$ and $(x + 2)$ all cancel."}, "anki_seeds": [{"front": "In a chain of × and ÷ of rational expressions, first...", "back": "rewrite every division as multiplication by the reciprocal, then factor everything and cancel.", "type": "basic"}, {"front": "When multiplying rational expressions, cancel only...", "back": "common factors of a numerator and a denominator — never terms inside a sum.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Products needing full factoring", "key_prerequisites": ["multiplying-rational-expressions", "factoring-trinomials"], "constraints": "every numerator and denominator factors into linear binomials with integer roots; the answer is one reduced fraction", "exemplars": [
      {"problem": "Multiply $\\frac{x^2-x-6}{x^2-4} \\cdot \\frac{x+2}{x-3}$.", "answer": "(x+2)/(x-2)", "solution_sketch": "Factor both polynomials: $\\frac{(x-3)(x+2)}{(x-2)(x+2)}\\cdot\\frac{x+2}{x-3}$. Cancel $x-3$ and one $x+2$, which leaves $\\frac{x+2}{x-2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\frac{x^2+5x+4}{x+3} \\cdot \\frac{x+3}{x+4}$.", "answer": "x+1", "solution_sketch": "Factor the trinomial as $(x+1)(x+4)$. The factors $x+3$ and $x+4$ each cancel once, which leaves $x+1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A banner is $\\frac{x^2-16}{x+2}$ metres long and $\\frac{x+2}{x+4}$ metres wide. What is its area?", "answer": "x-4", "solution_sketch": "Area is length times width: $\\frac{(x-4)(x+4)}{x+2}\\cdot\\frac{x+2}{x+4}$. The factors $x+2$ and $x+4$ cancel, so the area is $x-4$ square metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\frac{x^2-9}{x^2+2x} \\cdot \\frac{x+2}{x+3}$.", "answer": "(x-3)/x", "solution_sketch": "Factor $x^2-9=(x-3)(x+3)$ and $x^2+2x=x(x+2)$. The factors $x+2$ and $x+3$ cancel, which leaves $\\frac{x-3}{x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A field is $\\frac{x^2+x-12}{x}$ metres long and $\\frac{x^2}{x^2-9}$ metres wide. What is its area?", "answer": "x*(x+4)/(x+3)", "solution_sketch": "Factor $x^2+x-12=(x+4)(x-3)$ and $x^2-9=(x-3)(x+3)$. Cancel $x-3$ and one $x$, so the area is $\\frac{x(x+4)}{x+3}$ square metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Multiply $\\frac{x^2-5x+6}{x^2-4} \\cdot \\frac{x+2}{x-3}$.", "answer": "1", "solution_sketch": "Factor to $\\frac{(x-2)(x-3)}{(x-2)(x+2)}\\cdot\\frac{x+2}{x-3}$. Every factor cancels with its partner, so the product is $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the product $\\frac{x^2-6x+8}{x^2-1} \\cdot \\frac{x+1}{x-4}$.", "answer": "(x-2)/(x-1)", "solution_sketch": "Factor $x^2-6x+8=(x-2)(x-4)$ and $x^2-1=(x-1)(x+1)$. Cancel the common factors $x-4$ and $x+1$, which leaves $\\frac{x-2}{x-1}$.", "answer_contract": {"kind": "exact"}}
