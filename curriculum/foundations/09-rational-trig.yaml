    anki_seeds:
      - front: "Side ratios in a 30-60-90 triangle (short : long : hypotenuse)?"
        back: "1 : √3 : 2"
        type: basic
      - front: "Side ratios in a 45-45-90 triangle (leg : leg : hypotenuse)?"
        back: "1 : 1 : √2"
        type: basic

