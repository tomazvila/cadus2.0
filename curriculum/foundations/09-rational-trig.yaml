      {"problem": "In a triangle $a=5$, $A=30^\\circ$, $b=10$. Find $B$ in degrees as a number.", "answer": "90", "solution_sketch": "$\\sin B=b\\sin A/a=10(1/2)/5=1$; the only triangle angle with sine $1$ is $90^\\circ$.", "answer_contract": {"kind": "exact"}}, {"problem": "In a triangle $a=6$, $A=30^\\circ$, $b=6\\sqrt2$, and $B$ is acute. Find $B$ in degrees as a number.", "answer": "45", "solution_sketch": "$\\sin B=6\\sqrt2(1/2)/6=\\sqrt2/2$; the acute branch is $45^\\circ$.", "answer_contract": {"kind": "exact"}},
