      - id: kp2
        name: Obtuse included angles
        key_prerequisites: [right-triangle-trig, unit-circle]
        constraints: "included angles of 120 or 135 degrees, whose cosine is negative; answers are exact square roots, simplified"
        exemplars:
          - problem: 'In a triangle with $b = 5$, $c = 8$, and included angle $A = 120^\circ$, find $a$.'
            answer: "√129"
            answer_contract: {kind: exact}
            solution_sketch: '$a^2 = 25 + 64 - 80 \cdot (-\frac{1}{2}) = 129$.'
          - problem: 'In a triangle with $b = 4$, $c = 6$, and included angle $A = 120^\circ$, find $a$.'
            answer: "2√19"
            answer_contract: {kind: exact}
            solution_sketch: '$a^2 = 16 + 36 + 24 = 76$.'
      - id: kp3
        name: Find an angle (SSS)
        key_prerequisites: [right-triangle-trig, pythagorean-theorem]
        constraints: "all three sides given as integers; data chosen so the cosine comes out as 1/2, 0 or -1/2, giving 60, 90 or 120 degrees"
        exemplars:
          - problem: 'A triangle has sides $3$, $5$, $7$. Find the angle opposite the side of length $7$.'
            answer: "120°"
            answer_contract: {kind: exact}
            solution_sketch: '$\cos C = \frac{9 + 25 - 49}{2 \cdot 15} = -\frac{1}{2}$.'
          - problem: 'A triangle has sides $5$, $12$, $13$. Find the angle opposite the side of length $13$.'
            answer: "90°"
            answer_contract: {kind: exact}
            solution_sketch: '$\cos C = \frac{25 + 144 - 169}{120} = 0$.'
    diagnostic_exemplar:
      problem: 'A triangle has sides $6$, $10$ and $14$. Find the angle opposite the side of length $14$.'
      answer: "120°"
      solution_sketch: 'The largest side faces the largest angle: $\cos C = \frac{36 + 100 - 196}{2(6)(10)} = -\frac{1}{2}$.'
    anki_seeds:
      - front: "State the Law of Cosines for side a."
        back: "a² = b² + c² - 2bc·cos A"
        type: basic

