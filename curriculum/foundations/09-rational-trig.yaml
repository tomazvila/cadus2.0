    {"id": "kp1", "name": "Divide monomial rational expressions", "key_prerequisites": ["dividing-fractions"], "constraints": "flip-and-multiply; every quotient cancels to a simple monomial fraction", "exemplars": [
      {"problem": "Divide $\\frac{x}{3} \\div \\frac{x^2}{9}$.", "answer": "3/x", "solution_sketch": "$\\frac{x}{3} \\cdot \\frac{9}{x^2} = \\frac{9x}{3x^2} = \\frac{3}{x}$."}, {"problem": "Divide $\\frac{5}{x^2} \\div \\frac{10}{x}$.", "answer": "1/(2x)", "solution_sketch": "$\\frac{5}{x^2} \\cdot \\frac{x}{10} = \\frac{5x}{10x^2} = \\frac{1}{2x}$."},
      {"problem": "Divide $\\frac{x^2}{4} \\div \\frac{x}{8}$.", "answer": "2x", "solution_sketch": "$\\frac{x^2}{4} \\cdot \\frac{8}{x} = \\frac{8x^2}{4x} = 2x$."}, {"problem": "Divide $\\frac{3}{x^3} \\div \\frac{9}{x}$.", "answer": "1/(3x^2)", "solution_sketch": "$\\frac{3}{x^3} \\cdot \\frac{x}{9} = \\frac{3x}{9x^3} = \\frac{1}{3x^2}$."}
    ]},
    {"id": "kp2", "name": "Divide with binomial factors", "key_prerequisites": ["multiplying-rational-expressions", "dividing-fractions"], "constraints": "flip the divisor, then cancel matching linear binomials; no trinomials at this level", "exemplars": [
      {"problem": "Divide $[(x+1)/(x-2)]\\div[(x+1)/(x+2)]$, where $x\\ne2,-2,-1$.", "answer": "(x+2)/(x-2)", "solution_sketch": "Invert the divisor to $(x+2)/(x+1)$, then cancel $x+1$.", "answer_contract": {"kind": "exact"}}, {"problem": "Divide $[(x^2-25)/x]\\div[(x-5)/x]$, where $x\\ne0,5$.", "answer": "x+5", "solution_sketch": "Multiply by $x/(x-5)$; factor $x^2-25$ and cancel $x$ and $x-5$.", "answer_contract": {"kind": "exact"}},
