      {"problem": "On $[0,2\\pi]$, at what value of $x$ does the graph of $y=\\cos x$ reach its minimum?", "answer": "pi", "solution_sketch": "The horizontal coordinate is smallest at the left end of the circle, where it is $-1$. That is the angle $\\pi$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the lowest point of the graph of $y=\\cos x$ on $[0,2\\pi]$.", "answer": "(pi, -1)", "solution_sketch": "Cosine reaches its smallest value $-1$ half a period in, at $x=\\pi$. So the lowest point is $(\\pi,-1)$.", "answer_contract": {"kind": "coordinates", "arity": 2}},
