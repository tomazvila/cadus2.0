        exemplars:
          - problem: 'In a 30-60-90 triangle with short leg $3$, find the long leg and hypotenuse.'
            answer: "long leg 3√3, hypotenuse 6"
            solution_sketch: '$\text{long} = \text{short} \cdot \sqrt{3}$; $\text{hyp} = 2 \cdot \text{short}$.'
          - problem: 'In a 30-60-90 triangle with hypotenuse $10$, find the short leg.'
