    {"id": "kp2", "name": "Quotients needing full factoring", "key_prerequisites": ["dividing-rational-expressions", "factoring-trinomials"], "constraints": "flip the divisor first, then factor all four parts; monic quadratics with integer roots only", "exemplars": [
      {"problem": "Divide $\\frac{x^2-9}{x^2+6x+5} \\div \\frac{x^2+10x+21}{x^2+12x+35}$.", "answer": "(x-3)/(x+1)", "solution_sketch": "Invert the divisor and factor all four quadratics: $\\frac{(x-3)(x+3)}{(x+1)(x+5)}\\cdot\\frac{(x+5)(x+7)}{(x+3)(x+7)}$. Cancel $x+3$, $x+5$ and $x+7$ to get $\\frac{x-3}{x+1}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2+2x-8}{x^2+6x} \\div \\frac{x^2+11x+28}{x^2+7x}$.", "answer": "(x-2)/(x+6)", "solution_sketch": "Invert and factor: $\\frac{(x+4)(x-2)}{x(x+6)}\\cdot\\frac{x(x+7)}{(x+4)(x+7)}$. Cancel $x$, $x+4$ and $x+7$ to get $\\frac{x-2}{x+6}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangle has an area of $\\frac{x^2-9}{x^2+x}$ square metres and a width of $\\frac{x-3}{x}$ metres. What is its length?", "answer": "(x+3)/(x+1)", "solution_sketch": "Length is area divided by width: $\\frac{(x-3)(x+3)}{x(x+1)}\\cdot\\frac{x}{x-3}$. Cancel $x$ and $x-3$, so the length is $\\frac{x+3}{x+1}$ metres.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2-x-12}{x^2-9} \\div \\frac{x^2-3x-4}{x^2-x-6}$.", "answer": "(x+2)/(x+1)", "solution_sketch": "Invert the divisor and factor: $\\frac{(x-4)(x+3)}{(x-3)(x+3)}\\cdot\\frac{(x-3)(x+2)}{(x-4)(x+1)}$. Cancel $x-4$, $x+3$ and $x-3$ to get $\\frac{x+2}{x+1}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tank holds $\\frac{x^2+7x+12}{x^2-1}$ litres of water. A pump removes $\\frac{x+3}{x-1}$ litres every minute. How many minutes does it take to empty the tank?", "answer": "(x+4)/(x+1)", "solution_sketch": "Time is volume divided by rate: $\\frac{(x+3)(x+4)}{(x-1)(x+1)}\\cdot\\frac{x-1}{x+3}$. Cancel $x+3$ and $x-1$, so the time is $\\frac{x+4}{x+1}$ minutes.", "answer_contract": {"kind": "exact"}},
      {"problem": "Divide $\\frac{x^2-4}{x^2-4x+4} \\div \\frac{x^2+9x+14}{x^2+5x-14}$.", "answer": "1", "solution_sketch": "Invert and factor: $\\frac{(x-2)(x+2)}{(x-2)^2}\\cdot\\frac{(x-2)(x+7)}{(x+2)(x+7)}$. Every factor cancels, so the quotient is $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the quotient of $\\frac{x^2-4}{x^2+3x}$ divided by $\\frac{x+2}{x}$.", "answer": "(x-2)/(x+3)", "solution_sketch": "Invert the divisor, then multiply. The work is $\\frac{(x-2)(x+2)}{x(x+3)}\\cdot\\frac{x}{x+2}$, which cancels to $\\frac{x-2}{x+3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A strip of lawn is $\\frac{x^2-4x-5}{x+2}$ metres long and $\\frac{x+2}{x+1}$ metres wide. What is its area?", "answer": "x-5", "solution_sketch": "Area is length times width: $\\frac{(x-5)(x+1)}{x+2}\\cdot\\frac{x+2}{x+1}$. Cancel $x+2$ and $x+1$, so the area is $x-5$ square metres.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Combined multiply-and-divide chains", "key_prerequisites": ["multiplying-rational-expressions", "dividing-rational-expressions"], "constraints": "three factors chained by one multiplication and one division; everything cancels to a monomial or a binomial", "exemplars": [
      {"problem": "Simplify $\\frac{x}{x+1}\\cdot\\frac{x^2-1}{x}\\div(x-1)$.", "answer": "1", "solution_sketch": "The product of the first two factors is $x-1$, after $x$ and $x+1$ cancel. Dividing $x-1$ by $x-1$ leaves $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{x+2}{x}\\cdot\\frac{x^2}{x^2-4}\\div\\frac{1}{x-2}$.", "answer": "x", "solution_sketch": "Replace the division by multiplication by $x-2$ and factor $x^2-4=(x-2)(x+2)$. Cancel $x+2$, $x-2$ and one $x$, which leaves $x$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A bakery uses $\\frac{x^2-1}{x}$ kilograms of flour a day and bakes for $\\frac{x}{x+1}$ days. Each loaf takes $\\frac{x-1}{x^2}$ kilograms of flour. How many loaves does the bakery bake?", "answer": "x^2", "solution_sketch": "The flour used is $\\frac{x^2-1}{x}\\cdot\\frac{x}{x+1}=x-1$ kilograms. Dividing by $\\frac{x-1}{x^2}$ gives $(x-1)\\cdot\\frac{x^2}{x-1}$, so the bakery bakes $x^2$ loaves.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{x-3}{x+3}\\div\\frac{x^2-9}{x}\\cdot(x+3)$.", "answer": "x/(x+3)", "solution_sketch": "Invert the middle fraction: $\\frac{x-3}{x+3}\\cdot\\frac{x}{(x-3)(x+3)}\\cdot(x+3)$. Cancel $x-3$ and one $x+3$, which leaves $\\frac{x}{x+3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Ana cycles at $\\frac{x+3}{x}$ kilometres per hour for $\\frac{x^2}{x^2-9}$ hours. Ben cycles $\\frac{x}{x+3}$ kilometres. How many times as far as Ben did Ana cycle?", "answer": "(x+3)/(x-3)", "solution_sketch": "Ana covers $\\frac{x+3}{x}\\cdot\\frac{x^2}{(x-3)(x+3)}=\\frac{x}{x-3}$ kilometres. Dividing by the distance that Ben cycles gives $\\frac{x}{x-3}\\cdot\\frac{x+3}{x}=\\frac{x+3}{x-3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{2}{x}\\div\\frac{4}{x^2}\\cdot\\frac{3}{x}$.", "answer": "3/2", "solution_sketch": "Division gives $\\frac{2}{x}\\cdot\\frac{x^2}{4}=\\frac{x}{2}$. Multiplying by $\\frac{3}{x}$ cancels the remaining $x$ and leaves $\\frac{3}{2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{2}{x}\\div\\frac{x}{6}\\cdot\\frac{x^2}{3}$.", "answer": "4", "solution_sketch": "Invert $\\frac{x}{6}$ before the multiplication. The work is $\\frac{2}{x}\\cdot\\frac{6}{x}\\cdot\\frac{x^2}{3}=\\frac{12x^2}{3x^2}$, which is $4$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{x^2-1}{x+3}\\div\\frac{x+1}{x^2-9}\\cdot\\frac{1}{x-1}$.", "answer": "x-3", "solution_sketch": "Invert the divisor and factor: $\\frac{(x-1)(x+1)}{x+3}\\cdot\\frac{(x-3)(x+3)}{x+1}\\cdot\\frac{1}{x-1}$. Cancel $x-1$, $x+1$ and $x+3$ to get $x-3$.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "rational-expressions-common-denominators", "name": "Adding Rational Expressions with Common Denominators", "core": true, "difficulty": 0.6, "drill": false, "answer_kind": "expression", "expected_time_secs": 90, "prerequisites": [{"id": "adding-subtracting-fractions", "weight": 0.7, "key": true}, {"id": "rational-expressions", "weight": 0.5}, {"id": "combining-like-terms", "weight": 0.4}], "diagnostic_exemplar": {"problem": "Subtract $\\frac{x^2}{x - 3} - \\frac{2x + 3}{x - 3}$.", "answer": "x + 1", "solution_sketch": "One denominator already: $\\frac{x^2 - 2x - 3}{x - 3} = \\frac{(x - 3)(x + 1)}{x - 3}$. Distribute the minus over both terms."}, "anki_seeds": [{"front": "When subtracting a rational expression, remember to...", "back": "distribute the minus sign across the whole numerator being subtracted.", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Add and subtract over one denominator", "key_prerequisites": ["adding-subtracting-fractions"], "constraints": "identical denominators (a monomial or one linear binomial); combine the numerators only, no LCD building", "exemplars": [
      {"problem": "Add $\\frac{2}{x} + \\frac{5}{x}$.", "answer": "7/x", "solution_sketch": "Both fractions count pieces of size $\\frac{1}{x}$. Add the numerators, $2+5=7$, and keep the denominator: $\\frac{7}{x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Subtract $\\frac{3x}{x+1} - \\frac{x}{x+1}$.", "answer": "2*x/(x+1)", "solution_sketch": "The denominators match, so subtract the numerators: $3x-x=2x$. The result is $\\frac{2x}{x+1}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A pool is filled by two pipes. In one hour the first pipe fills $\\frac{3}{x}$ of the pool and the second pipe fills $\\frac{5}{x}$ of the pool. What part of the pool do both pipes fill in one hour?", "answer": "8/x", "solution_sketch": "The parts add: $\\frac{3}{x}+\\frac{5}{x}$. The denominators match, so add the numerators to get $\\frac{8}{x}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Add $\\frac{x}{x+2} + \\frac{3}{x+2}$.", "answer": "(x+3)/(x+2)", "solution_sketch": "Add the numerators over the shared denominator: $x+3$. The terms $x$ and $3$ are unlike, so the result is $\\frac{x+3}{x+2}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rope is $\\frac{11}{x+2}$ metres long. A piece of $\\frac{4}{x+2}$ metres is cut off. How long is the rest of the rope?", "answer": "7/(x+2)", "solution_sketch": "The rest is the difference: $\\frac{11}{x+2}-\\frac{4}{x+2}$. Subtract the numerators, $11-4=7$, and keep the denominator, so $\\frac{7}{x+2}$ metres remain.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{4}{x-1} - \\frac{4}{x-1}$.", "answer": "0", "solution_sketch": "Equal quantities subtract to zero: $\\frac{4-4}{x-1}=\\frac{0}{x-1}$. The result is $0$ for every $x\\ne1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the sum $\\frac{1}{x+3} + \\frac{2}{x+3}$.", "answer": "3/(x+3)", "solution_sketch": "Add only the numerators, $1+2=3$, and the denominator $x+3$ stays, so the sum is $\\frac{3}{x+3}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Distribute the minus sign", "key_prerequisites": ["combining-like-terms"], "constraints": "numerators are linear binomials; subtraction must require distributing", "exemplars": [
      {"problem": "Subtract $\\frac{7x}{x-3} - \\frac{2x+1}{x-3}$.", "answer": "(5*x-1)/(x-3)", "solution_sketch": "Put both numerators over $x-3$ and subtract the whole second numerator: $7x-(2x+1)=7x-2x-1$. The result is $\\frac{5x-1}{x-3}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Subtract $\\frac{5x+1}{x+2} - \\frac{2x-5}{x+2}$.", "answer": "3", "solution_sketch": "The numerator is $(5x+1)-(2x-5)=3x+6=3(x+2)$. Cancel the common factor $x+2$, which leaves $3$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tank receives $\\frac{9x+4}{x+6}$ litres of water per minute and loses $\\frac{4x-5}{x+6}$ litres per minute through a leak. How many litres per minute does the water level gain?", "answer": "(5*x+9)/(x+6)", "solution_sketch": "The gain is the difference: $\\frac{(9x+4)-(4x-5)}{x+6}$. The numerator is $9x+4-4x+5=5x+9$, so the gain is $\\frac{5x+9}{x+6}$ litres per minute.", "answer_contract": {"kind": "exact"}},
      {"problem": "Simplify $\\frac{x^2+x}{x+1} - \\frac{x^2-1}{x+1}$.", "answer": "1", "solution_sketch": "The numerator is $x^2+x-x^2+1=x+1$. Divide by the denominator $x+1$ to get $1$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Subtract $\\frac{2x-3}{x+4} - \\frac{-x+5}{x+4}$.", "answer": "(3*x-8)/(x+4)", "solution_sketch": "Negating the second numerator gives $+x-5$. The numerator is $2x-3+x-5=3x-8$, so the result is $\\frac{3x-8}{x+4}$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A shop pays $\\frac{8x+9}{x+3}$ dollars for each item and gets a rebate of $\\frac{3x-1}{x+3}$ dollars on each item. How many dollars does each item cost after the rebate?", "answer": "(5*x+10)/(x+3)", "solution_sketch": "The cost is the difference: $\\frac{(8x+9)-(3x-1)}{x+3}$. The numerator is $8x+9-3x+1=5x+10$, so each item costs $\\frac{5x+10}{x+3}$ dollars.", "answer_contract": {"kind": "exact"}},
      {"problem": "Find the difference $\\frac{3x+4}{x-1} - \\frac{x-2}{x-1}$.", "answer": "(2*x+6)/(x-1)", "solution_sketch": "The minus sign changes the sign of $-2$ in the second numerator. The numerator is $3x+4-x+2=2x+6$, so the difference is $\\frac{2x+6}{x-1}$.", "answer_contract": {"kind": "exact"}}
    ]},
