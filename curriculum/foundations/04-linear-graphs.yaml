  - id: point-slope-form
    name: "Point-Slope Form"
    core: true
    difficulty: 0.46
    drill: false
    # Answers are equations of lines (and slope/point pairs), not single expressions —
    # the SymPy override cannot parse "=" at all, so the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 80
    prerequisites:
      - id: slope
        weight: 0.6
        key: true
      - id: slope-intercept-form
        weight: 0.4
        key: true
      - id: distributive-property
        weight: 0.3
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Write point-slope form"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'Write the point-slope equation of the line with slope $3$ through $(2, 5)$.'
            answer: "y - 5 = 3(x - 2)"
            answer_contract: {"kind":"label","options":[["y - 5 = 3(x - 2)"]]}
            solution_sketch: '$y - y_1 = m(x - x_1)$ with $m = 3$, $(x_1, y_1) = (2, 5)$.'
          - problem: 'Write the point-slope equation of the line with slope $-1$ through $(-4, 2)$.'
            answer: "y - 2 = -1(x + 4)"
            answer_contract: {"kind":"label","options":[["y - 2 = -1(x + 4)"]]}
            solution_sketch: '$m = -1$, $(x_1, y_1) = (-4, 2)$, so $x - (-4)$ is $x + 4$.'
          - problem: 'Write the point-slope equation of the line with slope $4$ through $(1, 3)$.'
            answer: "y - 3 = 4(x - 1)"
            answer_contract: {"kind":"label","options":[["y - 3 = 4(x - 1)"]]}
            solution_sketch: '$y - y_1 = m(x - x_1)$ with $m = 4$, $(x_1, y_1) = (1, 3)$.'
          - problem: 'Write the point-slope equation of the line with slope $-2$ through $(-3, 5)$.'
            answer: "y - 5 = -2(x + 3)"
            answer_contract: {"kind":"label","options":[["y - 5 = -2(x + 3)"]]}
            solution_sketch: '$m = -2$, $(x_1, y_1) = (-3, 5)$, so $x - (-3)$ is $x + 3$.'
        constraints: "y - y1 = m(x - x1); keep signs"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Read the slope and point from the form"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'For $y + 3 = 5(x - 1)$, state the slope and the point used.'
            answer: "slope 5, point (1, -3)"
            answer_contract: {"kind":"label","options":[["slope 5, point (1, -3)"]]}
            solution_sketch: '$y + 3 = 5(x - 1)$ matches $m = 5$, $(x_1, y_1) = (1, -3)$.'
          - problem: 'For $y - 2 = -4(x + 6)$, state the point used.'
            answer: "(-6, 2)"
            solution_sketch: '$y - 2$ means $y_1 = 2$; $x + 6$ means $x_1 = -6$.'
          - problem: 'For $y - 4 = 2(x - 3)$, state the slope and the point used.'
            answer: "slope 2, point (3, 4)"
            answer_contract: {"kind":"label","options":[["slope 2, point (3, 4)"]]}
            solution_sketch: '$y - 4 = 2(x - 3)$ matches $y - y_1 = m(x - x_1)$ with $m = 2$, $(x_1, y_1) = (3, 4)$.'
          - problem: 'For $y + 5 = -3(x - 2)$, state the point used.'
            answer: "(2, -5)"
            solution_sketch: '$y + 5$ means $y_1 = -5$; the point is $(2, -5)$.'
        constraints: "watch the sign flips: y + 3 means y1 = -3"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Convert to slope-intercept form"
        key_prerequisites: [distributive-property]
        exemplars:
          - problem: 'Convert $y - 5 = 2(x - 3)$ to slope-intercept form.'
            answer: "y = 2x - 1"
            solution_sketch: '$y = 2x - 6 + 5 = 2x - 1$.'
          - problem: 'Convert $y - 1 = -3(x + 2)$ to slope-intercept form.'
            answer: "y = -3x - 5"
            solution_sketch: '$y = -3x - 6 + 1 = -3x - 5$.'
          - problem: 'Convert $y - 4 = 3(x - 2)$ to slope-intercept form.'
            answer: "y = 3x - 2"
            solution_sketch: '$y = 3x - 6 + 4 = 3x - 2$.'
          - problem: 'Convert $y - 2 = -2(x + 3)$ to slope-intercept form.'
            answer: "y = -2x - 4"
            solution_sketch: '$y = -2x - 6 + 2 = -2x - 4$.'
        constraints: "distribute then isolate y"
    diagnostic_exemplar:
      problem: 'Using point-slope form, write the line through $(1, 4)$ with slope $2$ in slope-intercept form.'
      answer: "y = 2x + 2"
      solution_sketch: '$y - 4 = 2(x - 1)$; $y = 2x - 2 + 4 = 2x + 2$.'
