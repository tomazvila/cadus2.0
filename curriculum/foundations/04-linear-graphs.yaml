  - id: slope
    name: "Slope of a Line"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: numeric
    expected_time_secs: 80
    prerequisites:
      - id: slope-from-two-points
        weight: 0.7
        key: true
      - id: horizontal-vertical-slopes
        weight: 0.4
        key: true
      - id: dividing-fractions
        weight: 0.4
      - id: negative-fractions-decimals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Negative and fractional slopes"
        key_prerequisites: [slope-from-two-points, dividing-fractions]
        exemplars:
          - problem: 'Find the slope of the line through $(1,5)$ and $(5,2)$.'
            answer: '-3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rise is $2-5=-3$ and the run is $5-1=4$. The slope is $-3/4$, and the minus sign shows that the line falls.'
          - problem: 'A line falls $6$ units over a rightward run of $9$ units. What is its slope?'
            answer: '-2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Falling makes the rise negative, so the slope is $-6/9$. Dividing the top and bottom by $3$ gives $-2/3$.'
          - problem: 'Two rows of a table of values for a line are $x=-2,\ y=-3$ and $x=4,\ y=0$. Find the slope of the line.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $y$-values rise by $0-(-3)=3$ while the $x$-values increase by $4-(-2)=6$. The slope is $3/6=1/2$.'
          - problem: 'A wheelchair ramp rises $0.5$ m over a horizontal distance of $6$ m. What is its slope?'
            answer: '1/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is the rise divided by the horizontal run, so it is $0.5/6$. Multiplying the top and bottom by $2$ gives $1/12$.'
          - problem: 'A hiking trail descends from $1250$ m above sea level to $1100$ m above sea level over a horizontal distance of $600$ m. What is the slope of the trail?'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height changes by $1100-1250=-150$ m over a run of $600$ m. The slope is $-150/600=-1/4$.'
          - problem: 'Tara finds the slope of the line through $(-1,1)$ and $(-5,7)$ as $\frac{-5-(-1)}{7-1}$. What is the correct slope?'
            answer: '-3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Tara put the run on top. The slope is the rise over the run: $(7-1)/(-5-(-1))=6/(-4)$, which reduces to $-3/2$.'
          - problem: 'Find the slope of the line through $(-6,2)$ and $(3,8)$.'
            answer: '2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rise is $8-2=6$ and the run is $3-(-6)=9$. The slope is $6/9$, which reduces to $2/3$.'
          - problem: 'A roof rises $4$ feet for every $10$ feet of horizontal distance. What is its slope?'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is the rise over the run, so it is $4/10$. Dividing the top and bottom by $2$ gives $2/5$.'
        constraints: "negative and fractional slopes from points, descriptions and contexts; slope as a fraction or a decimal"
      - id: kp2
        name: "Find an unknown coordinate from the slope"
        key_prerequisites: [slope-from-two-points]
        exemplars:
          - problem: 'The line through $(1,2)$ and $(4,y)$ has slope $2$. Find $y$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is rise over run, so $(y-2)/(4-1)=2$. This gives $y-2=6$, and adding $2$ to both sides gives $y=8$.'
          - problem: 'A line of slope $-3$ passes through $(2,5)$ and $(x,-4)$. Find $x$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is rise over run, so $(-4-5)/(x-2)=-3$. This gives $-9=-3(x-2)$, then $x-2=3$ and $x=5$.'
          - problem: 'A line has slope $1/2$ and passes through $(0,1)$. What is the $y$-coordinate of its point with $x=6$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Moving $6$ units to the right raises the line by $(1/2)\cdot 6=3$. Starting at $y=1$, the height is $1+3=4$.'
          - problem: 'A road climbs with a constant slope of $0.08$. At a horizontal distance of $200$ m it is at an elevation of $340$ m. What is its elevation at a horizontal distance of $450$ m?'
            answer: '360'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The horizontal distance grows by $450-200=250$ m, so the road rises $0.08\cdot 250=20$ m. The elevation is $340+20=360$ m.'
          - problem: 'A road falls with a constant slope of $-0.05$ from an elevation of $420$ m to an elevation of $380$ m. What horizontal distance does it cover?'
            answer: '800'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The elevation changes by $380-420=-40$ m. Since rise divided by run is $-0.05$, the run is $-40/(-0.05)=800$ m.'
          - problem: 'Sam says $(3,4)$ lies on the line of slope $2$ through $(1,1)$. If the $x$-coordinate $3$ is correct, what should the $y$-coordinate be?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The run from $x=1$ to $x=3$ is $2$, so the rise is $2\cdot 2=4$. Starting at $y=1$ gives $y=5$, not $4$.'
          - problem: 'The line through $(2,k)$ and $(5,-1)$ has slope $2/3$. Find $k$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is rise over run, so $(-1-k)/(5-2)=2/3$. This gives $-1-k=2$, and then $k=-3$.'
        constraints: "one unknown coordinate, or a value found from a slope; integer or measured answers"
      - id: kp3
        name: "Collinearity and comparing steepness"
        key_prerequisites: [slope-from-two-points]
        try_first:
          problem: 'Do the points $(0,0)$, $(2,3)$ and $(4,5)$ lie on one straight line?'
          answer_contract: {"kind":"label","options":[["yes","they do","yes they do","they lie on one line"],["no","they do not","no they do not","they do not lie on one line"]]}
          answer: 'no'
          reveal: 'From $(0,0)$ to $(2,3)$ the slope is $3/2$, but from $(2,3)$ to $(4,5)$ it is $2/2=1$. Points lie on one line only when the slopes between them agree.'
        exemplars:
          - problem: 'Find $c$ so that $(0,1)$, $(2,5)$ and $(5,c)$ lie on one line.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first two points give slope $4/2=2$. From $x=2$ to $x=5$ the rise must be $2\cdot 3=6$, so $c=5+6=11$.'
          - problem: 'The points $(-2,7)$, $(1,1)$ and $(4,h)$ lie on one line. Find $h$.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The horizontal steps are both $3$, so the vertical steps must be equal. The first is $1-7=-6$, so $h=1-6=-5$.'
          - problem: 'Find $u$ so that $(1,2)$, $(3,8)$ and $(u,14)$ lie on one straight line.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first rise of $6$ over a run of $2$ gives slope $3$. Another rise of $6$ needs another run of $2$, so $u=3+2=5$.'
          - problem: 'Three survey stakes on a straight fence line have coordinates, in metres, $(0,4)$, $(10,9)$ and $(30,d)$. Find $d$.'
            answer: '19'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first two stakes give slope $5/10=1/2$. From $x=10$ to $x=30$ the run is $20$, so the rise is $10$ and $d=9+10=19$.'
          - problem: 'A straight cable passes through $(2,1)$ and $(6,9)$ on a plan. At what $x$-coordinate does it reach a height of $21$?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $(9-1)/(6-2)=2$. From height $9$ to height $21$ the rise is $12$, so the run is $12/2=6$ and $x=6+6=12$.'
          - problem: 'Ramp A rises $5$ feet over a horizontal distance of $40$ feet. Ramp B rises $3$ feet over a horizontal distance of $20$ feet. Which ramp is steeper?'
            answer: 'ramp b'
            answer_contract: {"kind":"label","options":[["ramp a","a","the first ramp","first ramp","ramp a is steeper","a is steeper","the first ramp is steeper"],["ramp b","b","the second ramp","second ramp","ramp b is steeper","b is steeper","the second ramp is steeper"]]}
            solution_sketch: 'The slope of ramp A is $5/40=0.125$ and the slope of ramp B is $3/20=0.15$. The larger slope is steeper, so ramp B is steeper.'
          - problem: 'Sam places $(6,8)$ on the line through $(-2,-1)$ and $(2,1)$. What should its $y$-coordinate be if $x=6$ is correct?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The known slope is $2/4=1/2$. Moving $4$ units right from $(2,1)$ raises the line by $2$, so the height is $3$, not $8$.'
          - problem: 'Line P passes through $(0,0)$ and $(4,-12)$. Line Q passes through $(0,0)$ and $(5,10)$. Which line is steeper?'
            answer: 'line p'
            answer_contract: {"kind":"label","options":[["line p","p","the first line","first line","line p is steeper","p is steeper","the first line is steeper"],["line q","q","the second line","second line","line q is steeper","q is steeper","the second line is steeper"]]}
            solution_sketch: 'Line P has slope $-12/4=-3$ and line Q has slope $10/5=2$. Steepness depends on the size of the slope without its sign, and $|-3|=3$ is more than $2$, so line P is steeper.'
        constraints: "collinear points chained through slopes; compare steepness of two lines or ramps"
