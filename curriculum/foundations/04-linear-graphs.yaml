          - problem: 'For $x + 2y = 12$, find $x$ when $y = 3$.'
            answer: "6"
            solution_sketch: '$x + 6 = 12$; $x = 6$.'
          - problem: 'For $y = 3x - 4$, find $x$ when $y = 11$.'
