            solution_sketch: 'The input changes by $2-(-2)=4$ and the output changes by $11-3=8$. The rate is $8/4=2$.'
          - problem: 'A taxi fare table shows €7.50 for a $2$ km trip and €16.50 for an $8$ km trip. What does each extra kilometre cost, in euros?'
            answer: '1.5'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The fare rises by $16.50-7.50=9$ euros over $8-2=6$ km. Each extra kilometre costs $9/6=1.5$ euros.'
          - problem: 'A printer has printed $40$ pages after $2$ minutes and $190$ pages after $7$ minutes. How many pages does it print per minute?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The page count rises by $190-40=150$ over $7-2=5$ minutes. The printer makes $150/5=30$ pages per minute.'
          - problem: 'The rows $(3,10)$ and $(7,30)$ belong to a table of values. Sam finds the rate of change by dividing $30$ by $10$. What is the correct rate of change?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam divided one output by the other. The rate of change uses differences: $(30-10)/(7-3)=20/4=5$.'
          - problem: 'A table shows a pool temperature of $4.5$ °C at hour $0$ and $6.3$ °C at hour $6$. What is the rate of change, in degrees per hour?'
            answer: '0.3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The temperature changes by $6.3-4.5=1.8$ degrees over $6-0=6$ hours. The rate is $1.8/6=0.3$ degrees per hour.'
        constraints: "two table rows; decimal or integer data; rate in output units per input unit"
    diagnostic_exemplar:
      problem: 'A candle is $30$ cm tall at $t = 0$ and $18$ cm tall at $t = 4$ hours. Find the rate of change of its height, in cm per hour.'
      answer: "-3"
      answer_contract: {"kind":"unit","quantity":"speed","unit":"cm/h","allow_omitted":true}
      solution_sketch: '$\frac{18 - 30}{4 - 0} = -3$ cm per hour.'
    anki_seeds:
      - front: "In a linear model, the slope is the ___ of change, measured in units of ___ per unit of ___."
        back: "rate; y per x"
        type: basic

  - id: solutions-of-two-variable-equations
    name: "Solutions of Equations in Two Variables"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: evaluating-expressions
        weight: 0.6
        key: true
      - id: two-step-equations
        weight: 0.5
        key: true
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Check a candidate pair"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Is $(3,8)$ a solution of $y=3x-1$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is a solution","is a solution","it is","yes it is","yes, it is","yes it is a solution","yes, it is a solution"],["no","it is not a solution","not a solution","it is not","no it is not","no, it is not","no it is not a solution","no, it is not a solution"]]}
            solution_sketch: 'Substitute $x=3$ into the right side: $3\cdot 3-1=8$. This equals the $y$-value $8$, so the pair is a solution.'
          - problem: 'Which of the points $(1,4)$, $(2,3)$ and $(4,1)$ is a solution of $2x+y=7$?'
            answer: '(2, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute each point. For $(1,4)$ the left side is $6$, for $(2,3)$ it is $4+3=7$, and for $(4,1)$ it is $9$. Only $(2,3)$ gives $7$.'
          - problem: 'Is $(0,-4)$ a solution of $3x-2y=6$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is a solution","is a solution","it is","yes it is","yes, it is","yes it is a solution","yes, it is a solution"],["no","it is not a solution","not a solution","it is not","no it is not","no, it is not","no it is not a solution","no, it is not a solution"]]}
            solution_sketch: 'Substitute $x=0$ and $y=-4$: $3\cdot 0-2(-4)=8$. The left side is $8$, not $6$, so the pair is not a solution.'
          - problem: 'A café sells muffins for €3 and coffees for €2. A bill of exactly €17 for $m$ muffins and $c$ coffees satisfies $3m+2c=17$. Which of the pairs $(m,c)=(2,5)$, $(3,4)$ and $(4,2)$ gives this bill?'
            answer: '(3, 4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute each pair. The pair $(2,5)$ gives $16$, the pair $(3,4)$ gives $9+8=17$, and the pair $(4,2)$ gives $16$. Only $(3,4)$ gives $17$.'
          - problem: 'The pair $(4,-1)$ is a solution of $ax+2y=14$. Find $a$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pair satisfies the equation, so substitute $x=4$ and $y=-1$ to get $4a-2=14$. Then $4a=16$, and dividing by $4$ gives $a=4$.'
          - problem: 'Sam puts $x=-2$ into $-2x-1$ and gets $-5$, so he says $(-2,3)$ is not a solution of $y=-2x-1$. What is the value of $-2x-1$ at $x=-2$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam lost the sign of the product. In fact $-2(-2)=4$, so $-2x-1=4-1=3$, which equals $y=3$.'
          - problem: 'The point $(3,-2)$ lies on the line $4x-y=c$. Find $c$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every point on the line satisfies the equation, so substitute $x=3$ and $y=-2$. This gives $4\cdot 3-(-2)=12+2=14$, so $c=14$.'
          - problem: 'Adult tickets for a concert cost €7 and child tickets cost €4. A group paid exactly €43 for $a$ adult tickets and $c$ child tickets, so $7a+4c=43$. Which of the pairs $(a,c)=(3,5)$, $(5,2)$ and $(4,4)$ describes the group?'
            answer: '(5, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute each pair. The pair $(3,5)$ gives $21+20=41$, the pair $(5,2)$ gives $35+8=43$, and the pair $(4,4)$ gives $28+16=44$. Only $(5,2)$ gives $43$.'
        constraints: "substitute both coordinates; verdict, choice among points, or a missing constant"
      - id: kp2
        name: "Find y given x"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'If $y=3x-2$ and $x=4$, what is $y$?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ with $4$ in the equation and work out the right side. Then $y=3\cdot 4-2=12-2=10$.'
          - problem: 'If $2x+y=5$ and $x=-2$, what is $y$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $x=-2$ to get $2(-2)+y=5$, which is $-4+y=5$. Adding $4$ to both sides gives $y=9$.'
          - problem: 'A plumber charges a call-out fee of €40 plus €25 for each hour of work. For $x$ hours the charge is $y=40+25x$ euros. What is the charge for $3$ hours?'
            answer: '115'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Replace $x$ with the number of hours, $3$. Then $y=40+25\cdot 3=40+75=115$ euros.'
          - problem: 'Sam substitutes $x=1$ into $4x-2y=8$ and gets $y=2$. What is the correct value of $y$?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $x=1$ the equation is $4-2y=8$, so $-2y=4$. Dividing by $-2$ gives $y=-2$, and $y=2$ fails the check.'
          - problem: 'The temperature in degrees Fahrenheit is $F=1.8C+32$, where $C$ is the temperature in degrees Celsius. What is $F$ when $C=25$?'
            answer: '77'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $C$ with $25$ in the formula and work out the right side. Then $F=1.8\cdot 25+32=45+32=77$.'
          - problem: 'If $3x+4y=10$ and $x=-2$, what is $y$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $x=-2$ to get $-6+4y=10$. Adding $6$ to both sides gives $4y=16$, so $y=4$.'
          - problem: 'If $y=\frac{x}{2}+3$ and $x=-5$, what is $y$?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ with $-5$, which gives $y=-5/2+3$. Writing $3$ as $6/2$ gives $y=1/2$.'
        constraints: "integer, negative or simple fractional inputs; the output is found by substitution and solving"
      - id: kp3
        name: "Find x given y"
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'If $y=3x+2$ and $y=17$, what is $x$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $y=17$ to get $17=3x+2$. Subtract $2$ to get $3x=15$, so $x=5$.'
          - problem: 'If $2x-y=7$ and $y=-1$, what is $x$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $y=-1$ to get $2x+1=7$. Subtract $1$ to get $2x=6$, so $x=3$.'
          - problem: 'A taxi charges €3 plus €4 for each kilometre. For $x$ km the fare is $y=4x+3$ euros. How far can a passenger travel for €35?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Set $35=4x+3$. Subtract the fixed charge $3$ to get $4x=32$, so $x=8$ km.'
          - problem: 'A gym charges a joining fee of €20 plus €15 a month. After $x$ months the total paid is $y=15x+20$ euros. A member has paid €155 in total. For how many months has the member belonged?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $155=15x+20$. Subtract $20$ to get $15x=135$, and dividing by $15$ gives $x=9$ months.'
          - problem: 'Sam substitutes $y=1$ into $y=9-2x$ and gets $x=-4$. What is the correct value of $x$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation becomes $1=9-2x$, so $-8=-2x$. Dividing by $-2$ gives $x=4$, not $-4$.'
          - problem: 'If $2x-3y=7$ and $y=-5$, what is $x$?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $y=-5$ to get $2x+15=7$. Subtract $15$ to get $2x=-8$, so $x=-4$.'
          - problem: 'The temperature in degrees Fahrenheit is $F=1.8C+32$. What is $C$ when $F=86$?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $86=1.8C+32$. Subtract $32$ to get $1.8C=54$, and dividing by $1.8$ gives $C=30$.'
          - problem: 'If $y=5-\frac{x}{2}$ and $y=1$, what is $x$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $y=1$ to get $1=5-x/2$. Then $x/2=4$, and multiplying both sides by $2$ gives $x=8$.'
        constraints: "one- or two-step equation after substitution; whole-number, negative or contextual answers"
    diagnostic_exemplar:
      problem: 'For $y = 3x - 4$, find $x$ when $y = 11$.'
      answer: '5'
      solution_sketch: '$11 = 3x - 4$; $3x = 15$; $x = 5$.'
    anki_seeds:
      - front: "A solution of an equation in two variables is an ordered pair that ___."
        back: "makes the equation true when both values are substituted"
        type: basic

  - id: graphing-from-a-table
    name: "Graphing a Line from a Table"
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: multi-step
    expected_time_secs: 80
    prerequisites:
      - id: solutions-of-two-variable-equations
        weight: 0.7
        key: true
      - id: coordinate-plane
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Build a table of solutions"
        key_prerequisites: [solutions-of-two-variable-equations]
        exemplars:
          - problem: 'Complete the table of values for $y=2x+1$ at $x=-1$, $0$ and $1$. What are the three values of $y$?'
            answer: '-1, 1, 3'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'Put each $x$-value into the rule on its own. $2(-1)+1=-1$, $2(0)+1=1$ and $2(1)+1=3$, so the values of $y$ are $-1$, $1$ and $3$.'
          - problem: 'Complete the table of values for $y=5-x$ at $x=0$, $2$ and $4$. What are the values of $y$?'
            answer: '5, 3, 1'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'Subtract each $x$-value from $5$. This gives $5-0=5$, $5-2=3$ and $5-4=1$ for the three rows.'
          - problem: 'A taxi charges $y=3x+2$ euros for a trip of $x$ km. What are the fares for trips of $1$, $2$ and $3$ km?'
            answer: '5, 8, 11'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'Each fare is $3$ times the distance plus the $2$ euro start charge. The fares are $3(1)+2=5$, $3(2)+2=8$ and $3(3)+2=11$ euros.'
          - problem: 'A bucket already holds $2$ litres of water. After $x$ minutes under a slow tap it holds $y=\frac{x}{3}+2$ litres. How much does the bucket hold after $0$, $3$ and $6$ minutes?'
            answer: '2, 3, 4'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'Divide each time by $3$ and then add $2$. After $0$, $3$ and $6$ minutes the bucket holds $0+2=2$, $1+2=3$ and $2+2=4$ litres.'
          - problem: 'Sam makes a table for $y=3x-2$ at $x=0$, $1$ and $2$ and writes the values $0$, $3$ and $6$. What are the correct values of $y$?'
            answer: '-2, 1, 4'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'Sam forgot to subtract $2$ after multiplying by $3$. The correct values are $3(0)-2=-2$, $3(1)-2=1$ and $3(2)-2=4$.'
          - problem: 'A tank holds $60$ litres. A pump empties it so that $y=60-4x$ litres remain after $x$ minutes. How many litres remain after $5$, $10$ and $15$ minutes?'
            answer: '40, 20, 0'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'Multiply each time by $4$ and subtract the result from $60$. After $5$, $10$ and $15$ minutes the tank holds $40$, $20$ and $0$ litres.'
          - problem: 'Make a table of values for $y=-2x+3$ at $x=-2$, $0$ and $2$. What are the values of $y$?'
            answer: '7, 3, -1'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'Replace $x$ by $-2$, $0$ and $2$ in turn. This gives $-2(-2)+3=7$, $-2(0)+3=3$ and $-2(2)+3=-1$.'
          - problem: 'Complete the table of values for $y=4-\frac{x}{2}$ at $x=-4$, $0$ and $4$. What are the values of $y$?'
            answer: '6, 4, 2'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'Divide each $x$-value by $2$ and subtract the result from $4$. This gives $4-(-2)=6$, $4-0=4$ and $4-2=2$.'
        constraints: "3 evenly spaced x-values; integer outputs"
      - id: kp2
        name: "Plot the rows and connect"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A straight line passes through $(-1,-6)$ and $(2,6)$. At what point does it cross the y-axis?'
            answer: '(0,-2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The line rises $12$ over a run of $3$, so each step right adds $4$. From $(-1,-6)$ one step right reaches $x=0$ at $y=-6+4=-2$.'
          - problem: 'A table has the rows $(2,5)$ and $(6,13)$, and both rows lie on one straight line. At what point does that line cross the y-axis?'
            answer: '(0,1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The height rises $8$ while $x$ grows by $4$, which is $2$ per step. Going back $2$ steps from $x=2$ to $x=0$ lowers $y$ by $4$, so $y=5-4=1$.'
          - problem: 'One row of a linear table is $(0,-4)$ and another row is $(3,2)$. At what point does the line cross the y-axis?'
            answer: '(0,-4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The row $(0,-4)$ already has $x=0$, so it is on the y-axis. The other row only gives the slope, which is not needed here.'
          - problem: 'A descending line passes through $(-3,4)$ and $(1,-2)$. At what point does it cross the y-axis?'
            answer: '(0,-1/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The height falls $6$ over a run of $4$, which is $-3/2$ per step. From $(-3,4)$ the line goes $3$ steps right to $x=0$, so $y=4-3\cdot\frac32=-\frac12$, and the crossing is $(0,-1/2)$.'
          - problem: 'A tank is drained at a steady rate. It holds $50$ litres after $2$ minutes and $35$ litres after $5$ minutes. How many litres did it hold at the start?'
            answer: '60'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The tank loses $15$ litres in $3$ minutes, which is $5$ litres each minute. Going back $2$ minutes to the start adds $10$ litres, so it held $50+10=60$ litres.'
          - problem: 'A candle burns at a steady rate. It is $18$ cm tall $2$ hours after it is lit and $12$ cm tall $5$ hours after it is lit. How many hours after it is lit does it burn out?'
            answer: '11'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'The candle loses $6$ cm in $3$ hours, which is $2$ cm each hour. The remaining $12$ cm take $12\div2=6$ more hours, so it burns out at $5+6=11$ hours.'
          - problem: 'Do the points $(1,3)$, $(2,5)$ and $(4,9)$ lie on one straight line?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they do", "yes they do", "yes, they do", "they are on one line", "yes they are on one line", "they lie on one line", "collinear"], ["no", "they do not", "no they do not", "no, they do not", "they are not on one line", "no they are not on one line", "they do not lie on one line", "not collinear"]]}
            solution_sketch: 'From $(1,3)$ to $(2,5)$ the height rises $2$ for $1$ step. From $(2,5)$ to $(4,9)$ it rises $4$ for $2$ steps, which is also $2$ per step, so the three points are on one line.'
          - problem: 'Do the points $(0,1)$, $(1,4)$ and $(3,8)$ lie on one straight line?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they do", "yes they do", "yes, they do", "they are on one line", "yes they are on one line", "they lie on one line", "collinear"], ["no", "they do not", "no they do not", "no, they do not", "they are not on one line", "no they are not on one line", "they do not lie on one line", "not collinear"]]}
            solution_sketch: 'From $(0,1)$ to $(1,4)$ the height rises $3$ per step. From $(1,4)$ to $(3,8)$ it rises $4$ for $2$ steps, which is only $2$ per step, so the points are not on one line.'
        constraints: "constant differences confirm a line"
      - id: kp3
        name: "Extend the pattern"
        key_prerequisites: [solutions-of-two-variable-equations]
        try_first:
          problem: 'A linear table has the rows $(0,1)$, $(2,5)$ and $(6,13)$. What is $y$ when $x=4$?'
          answer_contract: {"kind": "exact"}
          answer: '9'
          reveal: 'The steps in $x$ are not equal, so compare the change in $y$ for one step of $x$. That is $2$ per step, so two more steps from $(2,5)$ reach $y=9$.'
        exemplars:
          - problem: 'In a linear table, $y$ is $3$, $7$ and $11$ when $x$ is $0$, $1$ and $2$. What is $y$ when $x=3$?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each step of $1$ in $x$ adds $4$ to $y$. The next value after $11$ is $11+4=15$.'
          - problem: 'A linear table gives $(2,9)$, $(4,5)$ and $(6,1)$. What is $y$ when $x=8$?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each step of $2$ in $x$ lowers $y$ by $4$. One more step from $x=6$ gives $1-4=-3$ at $x=8$.'
          - problem: 'A counter is read every $3$ minutes and shows $8$, $13$ and $18$. If the readings keep growing in a linear pattern, what is the next reading?'
            answer: '23'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Consecutive readings differ by $5$ for each equal time step of $3$ minutes. The next reading is $18+5=23$.'
          - problem: 'A linear table has $y=6$ at $x=0$ and $y=10$ at $x=1$. What is $y$ at $x=-1$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Going one step right adds $4$, so going one step left subtracts $4$. The value at $x=-1$ is $6-4=2$.'
          - problem: 'A linear table has $x$: $1$, $3$, $5$ and $y$: $4$, $10$, $16$. What is $y$ when $x=6$?'
            answer: '19'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The input steps by $2$ while the output grows by $6$, so $y$ grows by $3$ for each single step of $x$. From $x=5$ to $x=6$ is one step, so $y=16+3=19$.'
          - problem: 'A phone battery shows $84\%$ after $1$ hour and $60\%$ after $3$ hours of steady use. After how many hours of use is the battery empty?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'The battery loses $24$ percentage points in $2$ hours, which is $12$ each hour. The remaining $60\%$ last $60\div12=5$ more hours, so it is empty after $3+5=8$ hours.'
          - problem: 'A savings jar holds $45$ euros at the end of week $2$ and $90$ euros at the end of week $5$, with the same deposit every week. How much does it hold at the end of week $9$?'
            answer: '150'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The jar gains $45$ euros in $3$ weeks, which is $15$ euros each week. Four more weeks add $60$ euros, so it holds $90+60=150$ euros.'
        constraints: "use the constant difference, not the equation"
    diagnostic_exemplar:
      problem: "A line's table shows $(0, 3)$, $(1, 7)$, $(2, 11)$. Find $y$ at $x = 6$."
      answer: "27"
      solution_sketch: '$y$ climbs by $4$ per step from $3$, so $y = 4x + 3$ and $y(6) = 27$.'
    anki_seeds:
      - front: "In a table of a linear equation with evenly spaced x-values, the y-values change by ___."
        back: "a constant amount (equal steps)"
        type: basic

