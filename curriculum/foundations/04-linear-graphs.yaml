          - problem: 'A line has slope $2$ and passes through $(3, 5)$. Write its equation.'
            answer: "y = 2x - 1"
            answer_contract: {kind: exact}
            solution_sketch: '$b = 5 - 2(3) = -1$.'
        constraints: "solve for b using the point"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Write the equation from two points"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'Write the equation of the line through $(1, 3)$ and $(2, 5)$.'
            answer: "y = 2x + 1"
            answer_contract: {kind: exact}
            solution_sketch: '$m = 2$; $b = 3 - 2(1) = 1$.'
          - problem: 'Write the equation of the line through $(0, -4)$ and $(2, 0)$.'
            answer: "y = 2x - 4"
            answer_contract: {kind: exact}
            solution_sketch: '$m = 2$; $b = -4$.'
        constraints: "find slope first, then b"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Write the equation from intercept information"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'Write the equation of the line with x-intercept $(3, 0)$ and y-intercept $(0, 6)$.'
            answer: "y = -2x + 6"
            answer_contract: {kind: exact}
            solution_sketch: '$m = \frac{6 - 0}{0 - 3} = -2$; $b = 6$.'
          - problem: 'A line crosses the y-axis at $4$ and passes through $(2, 10)$. Write its equation.'
            answer: "y = 3x + 4"
            answer_contract: {kind: exact}
            solution_sketch: '$m = \frac{10 - 4}{2 - 0} = 3$.'
        constraints: "intercepts given as points or values"
    diagnostic_exemplar:
      problem: 'Write the slope-intercept equation of the line through $(1, 5)$ and $(3, 9)$.'
      answer: 'y = 2x + 3'
      solution_sketch: '$m = \frac{9 - 5}{3 - 1} = 2$; then $5 = 2(1) + b$ gives $b = 3$.'
    anki_seeds:
      - front: "Given slope m and a point (x1, y1), the y-intercept is b = ___."
        back: "b = y1 - m*x1"
        type: basic

