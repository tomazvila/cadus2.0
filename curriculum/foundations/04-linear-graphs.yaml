          - problem: 'Are $y = 3x + 2$ and $y = -3x + 2$ parallel, perpendicular, or neither?'
            answer: "neither"
            answer_contract: {"kind":"label","options":[["parallel"],["perpendicular"],["neither"]]}
            solution_sketch: 'Slopes $3$ and $-3$: not equal, product $-9 \ne -1$.'
        constraints: "one comparison per problem; slopes readable from the equations"
    diagnostic_exemplar:
      problem: 'Are $y = \frac{2}{3}x + 1$ and $y = -\frac{3}{2}x - 4$ parallel, perpendicular, or neither?'
      answer_contract: {kind: label, options: [[parallel], [perpendicular], [neither]]}
      answer: 'perpendicular'
      solution_sketch: 'The slopes multiply to $-1$.'
    anki_seeds:
      - front: "Slope relationship: parallel lines have ___ slopes; perpendicular lines have ___ slopes."
        back: "equal slopes; negative-reciprocal slopes (their product is -1)"
        type: basic

  - id: parallel-perpendicular-lines
    name: "Parallel and Perpendicular Lines"
    core: false
    difficulty: 0.50
    drill: false
    # Answers are equations of lines plus a classification; SymPy cannot parse "=".
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: slopes-of-parallel-perpendicular-lines
        weight: 0.7
        key: true
      - id: slope-intercept-form
        weight: 0.5
        key: true
      - id: point-slope-standard-form
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Write a parallel line through a point"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'Write the line parallel to $y = 4x - 1$ through $(2, 3)$.'
            answer: "y = 4x - 5"
            solution_sketch: '$m = 4$; $b = 3 - 4(2) = -5$.'
          - problem: 'Write the line parallel to $y = -x + 6$ through $(1, 1)$.'
            answer: "y = -x + 2"
            solution_sketch: '$m = -1$; $b = 1 - (-1)(1) = 2$.'
          - problem: 'Write the line parallel to $y = 3x - 2$ through $(1, 4)$.'
            answer: "y = 3x + 1"
            solution_sketch: '$m = 3$; $b = 4 - 3(1) = 1$.'
          - problem: 'Write the line parallel to $y = -2x + 5$ through $(2, 3)$.'
            answer: "y = -2x + 7"
            solution_sketch: '$m = -2$; $b = 3 - (-2)(2) = 7$.'
        constraints: "keep the same slope; solve for b"
      - id: kp2
        name: "Write a perpendicular line through a point"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: "Write the slope-intercept equation perpendicular to $y=2x+5$ through $(0,3)$. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(-1/2,3)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The perpendicular slope is $-1/2$. The point on the vertical axis directly gives $b=3$."
          - problem: "A line of slope $-3$ is perpendicular to a second line through $(3,-1)$. Find the second line's slope-intercept equation. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(1/3,-2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The slopes must multiply to $-1$, so the new slope is $1/3$. Then $-1=(1/3)3+b$ gives $b=-2$."
          - problem: "The line through $(0,1)$ and $(2,2)$ has a perpendicular through $(-1,4)$. Write the perpendicular in slope-intercept form. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(-2,2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The reference slope is $1/2$, so the new slope is $-2$. The given point gives $4=2+b$, hence $b=2$."
          - problem: "A student chooses slope $4$ for a line perpendicular to $y=-4x+2$ through $(4,3)$. Correct the slope and give the full slope-intercept equation. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(1/4,2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The negative reciprocal of $-4$ is $1/4$. Substitution gives $3=(1/4)4+b$ and $b=2$."
        constraints: "use the negative reciprocal slope"
      - id: kp3
        name: "Work from standard form"
        key_prerequisites: [point-slope-standard-form]
        exemplars:
          - problem: 'Write the line through the origin perpendicular to $2x + 3y = 6$.'
            answer: "y = 3/2 x"
            solution_sketch: 'Given slope $-\frac{2}{3}$; perpendicular slope $\frac{3}{2}$; $b = 0$.'
          - problem: 'Are $2x + 3y = 6$ and $3x - 2y = 4$ parallel, perpendicular, or neither?'
            answer: "perpendicular"
            solution_sketch: 'Slopes $-\frac{2}{3}$ and $\frac{3}{2}$; product is $-1$.'
        constraints: "convert to find the slope first"
    diagnostic_exemplar:
      problem: 'Write the equation of the line perpendicular to $2x + 3y = 6$ through $(4, 1)$.'
      answer: 'y = 3/2 x - 5'
      solution_sketch: 'The given line has slope $-\frac{2}{3}$, so use $\frac{3}{2}$: $1 = 6 + b$ gives $b = -5$.'
    anki_seeds:
      - front: "To write a line through point P parallel or perpendicular to a given line:"
        back: "find the given slope; keep it (parallel) or take the negative reciprocal (perpendicular); then b = y1 - m*x1"
        type: basic

