        name: "Evaluate a model and interpret the result"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: "A fare is $C=3d+4$ euros. Find the fare in euros for $d=5$ km."
            answer: "19"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$C=3(5)+4=15+4=19$, meaning a five-kilometre trip costs €19."
          - problem: "A tank contains $V=60-4t$ litres after $t$ minutes. Find its volume in litres after $8$ minutes."
            answer: "28"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$V=60-4(8)=60-32=28$, so $28$ L remain."
          - problem: "A temperature model is $T=2h-3$ degrees Celsius. Find the temperature in degrees Celsius at hour $h=4$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$T=2(4)-3=8-3=5$, the temperature at hour four."
          - problem: "A learner says $S=10+5w$ means €30 saved at week $w=3$. Find the actual amount in euros."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The model gives $10+5(3)=25$: €10 initially plus €15 saved across three weeks."
        constraints: "evaluate at a given input; interpret with units"
    diagnostic_exemplar:
      problem: 'A phone plan costs $y = 0.10x + 20$ euros for $x$ minutes. What do the $0.10$ and the $20$ represent?'
      answer_contract: {kind: multipart, parts: [{name: rate, contract: {kind: unit, quantity: euro, unit: €}}, {name: fixed, contract: {kind: unit, quantity: euro, unit: €}}]}
      answer: "rate = €0.10; fixed = €20"
      solution_sketch: 'In $y = mx + b$ the slope is the cost of one more minute and the intercept is the cost at $x = 0$.'
