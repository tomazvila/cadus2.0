            solution_sketch: "The right side is $(1/2)(x-(-4))$; matching the form gives slope $1/2$ and point $(-4,5)$."
          - problem: "A learner reads the point $(3,2)$ from $y+2=4(x+3)$. Correct the full triple $(m,x_1,y_1)$."
            answer: "(4,-3,-2)"
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: "Both plus signs correspond to subtracting negative coordinates, so the point is $(-3,-2)$ and the slope remains $4$."
        constraints: "watch the sign flips: y + 3 means y1 = -3"
