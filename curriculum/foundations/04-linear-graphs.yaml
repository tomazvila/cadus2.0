            solution_sketch: "$3(1)+2=5$, $3(2)+2=8$, and $3(3)+2=11$ euros."
          - problem: "A learner gives outputs $(0,2,4)$ for $y=2x-1$ at $x=0,1,2$. Correct the entire output row."
            answer: "(-1,1,3)"
