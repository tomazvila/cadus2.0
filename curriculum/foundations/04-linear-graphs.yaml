  - id: slope-from-a-graph
    name: "Slope from a Graph"
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: coordinate-plane
        weight: 0.6
        key: true
      - id: dividing-fractions
        weight: 0.3
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Rise over run"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: "On a line graph, a slope triangle goes $4$ squares right and $6$ squares up. Each square is one unit on both axes. Find the slope."
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The vertical change is $6$ and horizontal change is $4$; rise over run is $6/4=3/2$."
          - problem: "Two marks on a rising graph are separated by $8$ horizontal grid intervals and $2$ vertical intervals. Both axes use one unit per interval. Find the slope."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The rise is $2$ units for a run of $8$, so the slope is $2/8=1/4$."
          - problem: "A graph's slope triangle has a horizontal leg of $3$ units and an upward vertical leg of $9$ units. How much does the line rise per horizontal unit?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Divide the $9$-unit rise among the $3$ horizontal units to obtain $3$ units of rise per unit of run."
          - problem: "A learner uses run over rise for a graph that rises $5$ units while running $2$ units right. Give the correct slope."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Slope measures vertical change per horizontal change, so the rise $5$ belongs in the numerator and run $2$ in the denominator."
        constraints: "positive rise and run; reduce fractions"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"5","label":"A"},{"x":"2","y":"-1","label":"B"}],"segments":[{"from":{"x":"-2","y":"5","label":null},"to":{"x":"2","y":"-1","label":null}}],"caption":"Reference example: The reference line has equation y = -(3/2)x + 2 The drawn segment joins the two reference points."}]
        name: "Sign of the slope from direction"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A line falls from left to right. Is its slope positive or negative?'
            answer: "negative"
          - problem: 'A line drops $4$ units for every $2$ units it runs to the right. What is the slope?'
            answer: "-2"
            solution_sketch: 'Rise is $-4$ over run $2$: $-2$.'
        constraints: "downward left-to-right means negative rise"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Slope between two graphed lattice points"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: "Count grid squares from $(1,1)$ to $(3,4)$ on a line. What is its slope?"
            answer: "3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Counting gives $2$ squares right and $3$ up; slope is $3/2$."
          - problem: "Starting at a marked point on a grid, follow the line $3$ squares right and $3$ squares down. Find its slope."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The signed rise is $-3$ and the run is $3$, so slope is $-3/3=-1$."
          - problem: "A grid segment joins $(0,-1)$ to $(4,1)$. A learner counts $4$ up and $2$ right. Correct the slope."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The segment actually goes $4$ squares right and $2$ up, so slope is $2/4=1/2$."
          - problem: "A lattice line passes through $(2,3)$ and $(2,0)$. Is its slope zero or undefined?"
            answer: "undefined"
            answer_contract: {"kind": "label", "options": [["zero"], ["undefined"]]}
            solution_sketch: "Counting from one point to the other gives no horizontal movement and a nonzero vertical movement; division by zero is undefined."
        constraints: "lattice points close together; counting, not the formula"
    diagnostic_exemplar:
      problem: 'A graphed line passes through $(0, 4)$ and $(3, -2)$. What is the slope?'
      answer: "-2"
      solution_sketch: 'Rise over run: $\frac{-2 - 4}{3 - 0} = \frac{-6}{3} = -2$.'
    anki_seeds:
      - front: "Slope read from a graph = ___ over ___."
        back: "rise over run (vertical change over horizontal change)"
        type: basic

  - id: slope-from-two-points
    name: "Slope from Two Points"
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: numeric
    expected_time_secs: 70
    prerequisites:
      - id: slope-from-a-graph
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.6
        key: true
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Apply the slope formula"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: "Use the slope formula for the points $(1,2)$ and $(3,8)$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$m=(8-(2))/(3-(1))=(6)/(2)=3$."
          - problem: "A table gives $x:-2,1$ and $y:1,7$. Use coordinate differences to find the slope."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$m=(7-(1))/(1-(-2))=(6)/(3)=2$."
          - problem: "The displacement from one point on a line to another is $\\langle4,4\\rangle$. Use the coordinate differences to find the slope."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The displacement gives $\\Delta x=4$ and $\\Delta y=4$, so $m=\\Delta y/\\Delta x=4/4=1$."
          - problem: "A learner mixes point order in the slope numerator and denominator for $(2,-1)$ and $(5,11)$. Find the correct slope."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$m=(11-(-1))/(5-(2))=(12)/(3)=4$."
        constraints: "positive integer slopes"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Points with negative coordinates"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: "Use the slope formula for the points $(-3,-5)$ and $(1,3)$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$m=(3-(-5))/(1-(-3))=(8)/(4)=2$."
          - problem: "A table gives $x:-4,-1$ and $y:2,-4$. Use coordinate differences to find the slope."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$m=(-4-(2))/(-1-(-4))=(-6)/(3)=-2$."
          - problem: "A line starts at $A=(-2,-3)$; its displacement to a second point is $\\langle4,4\\rangle$. Find the slope."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The second point is $(2,1)$ and the coordinate changes are $\\Delta x=4$, $\\Delta y=4$. Thus $m=1$."
          - problem: "A learner mixes point order in the slope numerator and denominator for $(-5,-7)$ and $(-2,2)$. Find the correct slope."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$m=(2-(-7))/(-2-(-5))=(9)/(3)=3$."
        constraints: "watch subtraction of negatives; integer slopes"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Either order works"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: "Use the slope formula for the points $(1,3)$ and $(4,9)$. Compute in both point orders."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$m=(9-(3))/(4-(1))=(6)/(3)=2$. Reversing both orders gives $(3-(9))/(1-(4))=(-6)/(-3)$, the same ratio because both signs reverse."
          - problem: "A table gives $x:-2,2$ and $y:5,-3$. Use coordinate differences to find the slope. Compute in both point orders."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$m=(-3-(5))/(2-(-2))=(-8)/(4)=-2$. Reversing both orders gives $(5-(-3))/(-2-(2))=(8)/(-4)$, the same ratio because both signs reverse."
          - problem: "Two correct orderings for one line give slope quotients $3/6$ and $(-3)/(-6)$. Give their common value."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Reversing point order negates both coordinate differences. Both quotients reduce to $1/2$."
          - problem: "A learner mixes point order in the slope numerator and denominator for $(-3,-4)$ and $(1,8)$. Find the correct slope. Compute in both point orders."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$m=(8-(-4))/(1-(-3))=(12)/(4)=3$. Reversing both orders gives $(-4-(8))/(-3-(1))=(-12)/(-4)$, the same ratio because both signs reverse."
        constraints: "consistent order in numerator and denominator"
    diagnostic_exemplar:
      problem: 'Find the slope of the line through $(-3, 5)$ and $(1, -3)$.'
      answer: '-2'
      solution_sketch: '$\frac{-3 - 5}{1 - (-3)} = \frac{-8}{4} = -2$.'
    anki_seeds:
      - front: "When using m = (y2 - y1)/(x2 - x1), the coordinates must be subtracted in the ___ order in numerator and denominator."
        back: "same order (swap both or neither)"
        type: basic

