          - problem: 'Find the slope of the line through $(-1, 3)$ and $(3, 5)$.'
            answer: "1/2"
            solution_sketch: '$\frac{5 - 3}{3 - (-1)} = \frac{2}{4} = \frac{1}{2}$.'
          - problem: 'Find the slope of the line through $(3, 8)$ and $(7, 2)$.'
            answer: "-3/2"
            solution_sketch: '$\frac{2 - 8}{7 - 3} = -\frac{6}{4} = -\frac{3}{2}$.'
          - problem: 'Find the slope of the line through $(-2, 1)$ and $(4, 4)$.'
            answer: "1/2"
