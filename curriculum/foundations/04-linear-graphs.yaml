          - problem: 'Write $y = 2x + 3$ in standard form with integer coefficients.'
            answer: "2x - y = -3"
            solution_sketch: 'Move $2x$ left: $-2x + y = 3$, or $2x - y = -3$.'
          - problem: 'Write $y - 1 = \frac{1}{2}(x - 4)$ in standard form with integer coefficients.'
            answer: "x - 2y = 2"
            solution_sketch: '$y = \frac{1}{2}x - 1$; multiply by $2$: $2y = x - 2$, so $x - 2y = 2$.'
        constraints: "standard form Ax + By = C with integer A, B, C"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Standard form to slope-intercept"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Write $3x + 2y = 12$ in slope-intercept form.'
            answer: "y = -3/2 x + 6"
            solution_sketch: '$2y = -3x + 12$; $y = -\frac{3}{2} x + 6$.'
          - problem: 'Find the slope of $4x - 5y = 20$.'
            answer: "4/5"
            solution_sketch: '$-5y = -4x + 20$; $y = \frac{4}{5}x - 4$.'
        constraints: "isolate y; fractional slopes allowed"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Line through two points, in standard form"
        key_prerequisites: [point-slope-form]
        exemplars:
          - problem: 'Write the line through $(1, 2)$ and $(3, 8)$ in standard form.'
            answer: "3x - y = 1"
            solution_sketch: '$m = 3$; $y = 3x - 1$; move terms: $3x - y = 1$.'
          - problem: 'Write the line through $(2, 5)$ and $(4, 6)$ in standard form.'
            answer: "x - 2y = -8"
            solution_sketch: '$m = \frac{1}{2}$; $y = \frac{1}{2}x + 4$; times $2$: $2y = x + 8$.'
        constraints: "clear fractions to get integer coefficients"
    diagnostic_exemplar:
      problem: 'Write the line through $(2, 1)$ and $(4, 7)$ in standard form $Ax + By = C$.'
      answer_contract: {kind: polynomial_relation}
      answer: '3x - y = 5'
      solution_sketch: 'Slope $3$; $y - 1 = 3(x - 2)$; $y = 3x - 5$; so $3x - y = 5$.'
    anki_seeds:
      - front: "Standard form of a linear equation:"
        back: "Ax + By = C, with A, B, C integers"
        type: basic
      - front: "The slope of Ax + By = C (B nonzero) is:"
        back: "m = -A/B"
        type: basic

  - id: slopes-of-parallel-perpendicular-lines
