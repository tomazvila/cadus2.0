        name: 'Increasing, decreasing, constant'
        key_prerequisites: [coordinate-plane]
        try_first:
          problem: 'A bath''s water depth, in centimetres, is graphed against time in minutes. The graph runs straight from $(1,12)$ to $(5,12)$. By how many centimetres does the depth change between minute 1 and minute 5?'
          answer_contract: {"kind":"exact"}
          answer: '0'
          reveal: 'The two end values are equal, so the depth is the same at the start and at the end of the segment. A straight segment with equal end values is flat: the quantity does not change.'
        exemplars:
          - problem: 'A graph of the amount in a savings account, in euros, against time in months runs straight from $(0,120)$ to $(6,300)$. Over these six months, is the amount increasing, decreasing or constant?'
            answer: 'increasing'
            answer_contract: {"kind": "label", "options": [["increasing", "it is increasing", "increases", "rising", "rises", "goes up", "it rises", "it increases"], ["decreasing", "it is decreasing", "decreases", "falling", "falls", "goes down", "it falls", "it decreases"], ["constant", "it is constant", "stays constant", "stays the same", "does not change", "unchanged"]]}
            visual: 0
            solution_sketch: 'Reading from left to right, the end value $300$ is above the start value $120$. So the graph rises and the amount is increasing.'
          - problem: 'The graph of a car''s speed, in km/h, against time, in hours, is made of three straight segments: from $(0,0)$ to $(2,80)$, from $(2,80)$ to $(5,80)$ and from $(5,80)$ to $(6,0)$. For how many hours does the car travel at one steady speed?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}
            visual: 1
            solution_sketch: 'Only the middle segment has equal end values, $80$ and $80$. It runs from hour $2$ to hour $5$, so the speed is steady for $5-2=3$ hours.'
          - problem: 'The graph of the temperature of a cup of tea, in degrees Celsius, against time in minutes runs straight from $(0,90)$ to $(10,45)$. Does the temperature rise, fall or stay constant over these ten minutes?'
            answer: 'falls'
            answer_contract: {"kind": "label", "options": [["rises", "it rises", "rise", "increasing", "increases", "goes up", "it is increasing"], ["falls", "it falls", "fall", "decreasing", "decreases", "goes down", "it is decreasing", "falling"], ["stays constant", "stay constant", "constant", "stays the same", "does not change", "it is constant"]]}
            visual: 2
            solution_sketch: 'Reading from left to right, the end value $45$ is below the start value $90$. So the graph falls and the temperature falls.'
          - problem: 'A graph of the water level in a tank, in centimetres, against time in minutes consists of three straight segments: from $(0,10)$ to $(4,50)$, from $(4,50)$ to $(9,50)$ and from $(9,50)$ to $(13,20)$. For how many minutes does the water level fall?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            visual: 3
            solution_sketch: 'Only the last segment ends below its start, since $20$ is less than $50$. It runs from minute $9$ to minute $13$, so the level falls for $13-9=4$ minutes.'
          - problem: 'The graph of a drone''s height, in metres, against time in seconds is made of three straight segments: from $(0,0)$ to $(5,40)$, from $(5,40)$ to $(8,40)$ and from $(8,40)$ to $(12,0)$. After how many seconds does the drone start to descend?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "second", "allow_omitted": true}
            visual: 4
            solution_sketch: 'The drone rises until second $5$ and then hovers at height $40$ until second $8$. The last segment falls from $40$ to $0$, so the descent starts after $8$ seconds.'
          - problem: 'A runner''s heart rate, in beats per minute, is graphed against time in minutes. The graph runs straight from $(0,70)$ to $(4,150)$, then from $(4,150)$ to $(9,150)$, then from $(9,150)$ to $(15,80)$. For how many minutes is the heart rate unchanged?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            visual: 5
            solution_sketch: 'Only the middle segment has equal end values, $150$ and $150$. It runs from minute $4$ to minute $9$, so the heart rate is unchanged for $9-4=5$ minutes.'
          - problem: 'A graph of the depth of a pond, in centimetres, against time in days runs straight from $(2,50)$ to $(6,10)$. How many centimetres does the depth fall between day 2 and day 6?'
            answer: '40'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            visual: 6
            solution_sketch: 'The depth falls from $50$ to $10$ while the day numbers grow. The fall is $50-10=40$ centimetres.'
        constraints: 'stories of one quantity against time; segments are described by their end points and are clearly rising, flat or falling'
      - id: kp2
        name: 'Read meaning from a point on a graph'
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A store prints a graph of total cost in euros (vertical axis) against the number of items (horizontal axis). The point $(7,21)$ is marked. What is the total cost of $7$ items?'
            answer: '21'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The horizontal axis counts items and the vertical axis gives the total cost. The marked point $(7,21)$ pairs $7$ items with a cost of $21$ euros.'
          - problem: 'The straight graph of a shop''s total cost in euros against the number of items passes through the origin and through the marked point $(8,36)$. What does one item cost?'
            answer: '4.5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The point $(8,36)$ says that $8$ items cost $36$ euros. One item costs the total shared among the items, $36/8=4.5$ euros.'
          - problem: 'The graph of a thrown ball shows time in seconds on the horizontal axis and height in metres on the vertical axis. The highest point of the graph is $(3,45)$. At how many seconds does the ball reach its greatest height?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "second", "allow_omitted": true}
            solution_sketch: 'The highest point carries two facts: the time $3$ seconds and the greatest height $45$ metres. The question asks for the time, which is the first coordinate, $3$.'
          - problem: 'A hiker''s graph has time in hours on the horizontal axis and distance in kilometres on the vertical axis. The point $(6,24)$ is marked. After how many hours has the hiker walked $24$ kilometres?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}
            solution_sketch: 'The marked point $(6,24)$ means that after $6$ hours the hiker has walked $24$ kilometres. The time is the first coordinate, $6$ hours.'
          - problem: 'A graph shows the volume of water in a tank, in litres, against time in minutes. One part of the graph is a horizontal segment. At what rate does the volume of water change during that part?'
            answer: '0'
            answer_contract: {"kind": "unit", "quantity": "flow", "unit": "L/min", "allow_omitted": true}
            solution_sketch: 'On a horizontal segment the vertical value stays the same while time passes. The volume does not change, so the rate is $0$ litres per minute.'
          - problem: 'A graph shows the height of a ball above the ground, in metres, against time in seconds. The graph meets the horizontal axis again at the point $(12,0)$. After how many seconds does the ball hit the ground?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "second", "allow_omitted": true}
            solution_sketch: 'A point on the horizontal axis has height $0$, so the ball is on the ground there. The first coordinate of the point $(12,0)$ is the time, $12$ seconds.'
          - problem: 'A graph shows the fuel in a car''s tank, in litres, against the distance driven, in kilometres. The graph meets the vertical axis at the point $(0,45)$. How much fuel is in the tank at the start of the trip?'
            answer: '45'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}
            solution_sketch: 'The start of the trip is distance $0$, which is on the vertical axis. The second coordinate of $(0,45)$ gives the fuel at that moment, $45$ litres.'
          - problem: 'A graph shows the height of a hot-air balloon, in metres, against time in minutes. Its highest point is $(15,480)$. What is the greatest height the balloon reaches?'
            answer: '480'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The highest point has the greatest vertical value. Its second coordinate is the height, so the balloon reaches $480$ metres, after $15$ minutes.'
          - problem: 'Sam''s distance from home, in kilometres, is graphed against time in hours. The points $(2,10)$ and $(5,10)$ are joined by a horizontal segment. Between hour 2 and hour 5, is Sam moving away from home, moving toward home or staying in one place?'
            answer: 'staying in one place'
            answer_contract: {"kind": "label", "options": [["staying in one place", "in one place", "stays in one place", "staying still", "stays still", "not moving", "stationary"], ["moving away from home", "moving away", "away from home", "going away", "getting further away"], ["moving toward home", "moving toward", "toward home", "coming back", "getting closer", "going home"]]}
            solution_sketch: 'Both end points have the vertical value $10$, so the distance from home does not change. Sam stays $10$ kilometres from home, which means staying in one place.'
        constraints: 'interpret one labeled point or feature; axes always named in the problem'
      - id: kp3
        name: 'Compare steepness'
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Two runners have straight distance-time graphs that start at the origin, drawn on the same scales with time in minutes and distance in metres. After $3$ minutes Ana has run $540$ m and Ben has run $660$ m. Whose graph is steeper?'
            answer: 'Ben'
            answer_contract: {"kind": "label", "options": [["Ben", "Ben's graph", "runner Ben", "Ben is steeper"], ["Ana", "Ana's graph", "runner Ana", "Ana is steeper"]]}
            solution_sketch: 'Both graphs start at the origin and run for $3$ minutes. Ben covers $660$ m and Ana covers $540$ m, so Ben covers more in the same time and his graph is steeper.'
          - problem: 'A car and a train both start at the origin of a distance-time graph. The car reaches $150$ km after $2$ hours and the train reaches $270$ km after $3$ hours. How much faster is the train than the car?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The times differ, so find each speed by dividing: the car goes $150/2=75$ km/h and the train goes $270/3=90$ km/h. The train is faster by $90-75=15$ km/h.'
          - problem: 'The distance-time graphs of Mia and Joe both start at the origin. Mia''s graph reaches $12$ km after $3$ hours and Joe''s graph is twice as steep. How far has Joe travelled after $3$ hours?'
            answer: '24'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'Twice as steep means twice the change in distance over the same time. Joe therefore travels $2 \times 12=24$ km in the $3$ hours.'
          - problem: 'Graph $A$ rises $40$ m in $8$ s and graph $B$ rises $54$ m in $6$ s. Both are distance-time graphs on the same scales. Which graph is steeper?'
            answer: 'graph B'
            answer_contract: {"kind": "label", "options": [["graph B", "B", "graph B is steeper", "B is steeper"], ["graph A", "A", "graph A is steeper", "A is steeper"]]}
            solution_sketch: 'The times differ, so compare the rises per second: graph A rises $40/8=5$ m each second and graph B rises $54/6=9$ m each second. Graph B is steeper.'
          - problem: 'A walker and a cyclist both start at the origin of a distance-time graph. After $2$ hours the walker is $8$ km from the start, and the cyclist''s graph is steeper. Give a possible whole number of kilometres for the cyclist''s distance after $2$ hours.'
            answer: '10'
            answer_contract: {"kind": "property", "check": "integer_in_range", "args": {"min": 9}}
            solution_sketch: 'Over the same $2$ hours a steeper graph covers more distance than the walker, who covers $8$ km. Any whole number above $8$ works, for example $10$.'
          - problem: 'Three cyclists have straight distance-time graphs that start at the origin, on the same scales. Ana''s graph reaches $36$ km after $2$ hours, Ben''s reaches $60$ km after $4$ hours and Cara''s reaches $85$ km after $5$ hours. What is the speed of the cyclist whose graph is steepest?'
            answer: '18'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The times differ, so find each speed by dividing: Ana rides $36/2=18$ km/h, Ben rides $60/4=15$ km/h and Cara rides $85/5=17$ km/h. The steepest graph is the fastest one, Ana''s, at $18$ km/h.'
          - problem: 'Two taps fill empty tanks of the same size. The volume-time graph of tap $X$ reaches $30$ L after $6$ min, and the steeper graph of tap $Y$ reaches $45$ L at the same moment. How many litres per minute more does tap $Y$ deliver?'
            answer: '2.5'
            answer_contract: {"kind": "unit", "quantity": "flow", "unit": "L/min", "allow_omitted": true}
            solution_sketch: 'Tap X delivers $30/6=5$ L/min and tap Y delivers $45/6=7.5$ L/min. Tap Y delivers $7.5-5=2.5$ L/min more.'
        constraints: 'steeper means faster change over equal times; compare distances over the same time or rates found by dividing'
    diagnostic_exemplar:
      problem: 'A distance-time graph rises steeply, then rises gently, then is flat. Rank the three parts from fastest to slowest movement.'
      answer_contract: {kind: list, ordered: true, member: {kind: label, options: [[steep], [gentle], [flat]]}}
      answer: 'steep, gentle, flat'
      solution_sketch: 'Steeper means faster; a flat segment means the distance is not changing.'
    anki_seeds:
      - front: "On a quantity-vs-time graph: a rising segment means the quantity is ___, flat means ___, falling means ___."
        back: "increasing; constant; decreasing"
        type: basic

  - id: constant-of-proportionality
    name: "The Constant of Proportionality"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: ratios-proportions
        weight: 0.7
        key: true
      - id: dividing-fractions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: 'Find k from one pair'
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'In a proportional relationship $y=kx$, the pair $(4,10)$ is a solution. What is $k$?'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substituting the pair gives $10=4k$. Dividing both sides of the equation by $4$ gives $k=10/4=5/2$.'
          - problem: 'A proportional relationship has output $18$ when the input is $6$. By what number is every input multiplied to give its output?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The output is the input times the same number every time. For the pair given, that number is $18/6=3$.'
          - problem: 'A line through the origin passes through the point $(8,2)$. What is its constant of proportionality?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A line through the origin has the equation $y=kx$. Substituting $(8,2)$ gives $2=8k$, so $k=2/8=1/4$.'
          - problem: 'A baker uses $6$ cups of flour for every $4$ loaves, always in the same proportion. The cups $c$ needed for $n$ loaves are $c=kn$. What is $k$?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pair $(n,c)=(4,6)$ gives $6=4k$. So $k=6/4=3/2$ cups of flour for each loaf.'
          - problem: 'A taxi charges the same price for every kilometre. A ride of $12$ km costs $27$ euros, so the cost $C$ in euros of a ride of $d$ km is $C=kd$. What is $k$?'
            answer: '9/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ride gives $27=12k$, so $k=27/12=9/4$. This is $2.25$ euros for each kilometre.'
          - problem: 'A spring stretches in proportion to its load: the extension $e$ in centimetres is $e=kL$, where $L$ is the load in newtons. A load of $5$ N gives an extension of $2$ cm. What is $k$?'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The extension is the output and the load is the input, so $2=5k$. Dividing the output by the input gives $k=2/5$, not $5/2$.'
          - problem: 'Sam says that $y=2x$ describes a proportional relationship that contains the point $(5,8)$. What is the correct constant of proportionality?'
            answer: '8/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rule $y=2x$ would give $10$ at $x=5$, but the point has $y=8$. Solving $8=5k$ gives the correct constant $k=8/5$.'
          - problem: 'A machine makes $90$ bolts in $12$ minutes at a steady rate, so the number of bolts $b$ after $m$ minutes is $b=km$. What is $k$?'
            answer: '15/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pair $(m,b)=(12,90)$ gives $90=12k$. So $k=90/12=15/2$, which is $7.5$ bolts each minute.'
        constraints: 'k = y/x; k may be a simple fraction or decimal'
      - id: kp2
        name: 'Find k from a table'
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'A proportional table has the rows $(x,y)=(2,5)$, $(4,10)$ and $(6,15)$. What is $k$ in $y=kx$?'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing each output by its input gives $5/2$, $10/4=5/2$ and $15/6=5/2$. All three agree, so $k=5/2$.'
          - problem: 'A shop sells identical notebooks. The table shows $3$ notebooks for $12$ euros, $5$ notebooks for $20$ euros and $8$ notebooks for $32$ euros. What does one notebook cost?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The cost per notebook is the cost divided by the number: $12/3=4$, $20/5=4$ and $32/8=4$. One notebook costs $4$ euros.'
          - problem: 'A proportional table contains the rows $(0,0)$, $(4,1)$ and $(12,3)$. What is its constant of proportionality?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The row $(0,0)$ gives no ratio, since division by zero is not defined. The row $(4,1)$ gives $1/4$, and $3/12=1/4$ agrees, so $k=1/4$.'
          - problem: 'A table gives the rows $(2,6)$, $(4,10)$ and $(6,14)$. Is $y$ proportional to $x$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it is not", "no, it is not", "not proportional", "it is not proportional"], ["yes", "it is", "yes, it is", "proportional", "it is proportional"]]}
            solution_sketch: 'The ratios $y/x$ are $6/2=3$, $10/4=5/2$ and $14/6=7/3$. They are not all equal, so $y$ is not proportional to $x$.'
          - problem: 'For the table rows $(2,3)$ and $(6,9)$, Ravi writes $k=2/3$. What is the correct value of $k$?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The constant is output over input: $3/2$ and $9/6=3/2$ agree. Ravi divided input by output, which gives $2/3$ and reverses the constant.'
          - problem: 'A hose fills a paddling pool at a steady rate. The table shows $90$ litres after $4$ minutes, $135$ litres after $6$ minutes and $225$ litres after $10$ minutes. How many litres per minute does the hose deliver?'
            answer: '22.5'
            answer_contract: {"kind": "unit", "quantity": "flow", "unit": "L/min", "allow_omitted": true}
            solution_sketch: 'Divide each volume by its time: $90/4=22.5$, $135/6=22.5$ and $225/10=22.5$. The hose delivers $22.5$ litres each minute.'
          - problem: 'A car uses fuel in proportion to the distance it drives. The table shows $3$ litres for $40$ km, $7.5$ litres for $100$ km and $12$ litres for $160$ km. How many litres does the car use per kilometre?'
            answer: '3/40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the fuel by the distance: $3/40$, $7.5/100=3/40$ and $12/160=3/40$. The car uses $3/40=0.075$ litres for each kilometre.'
          - problem: 'A proportional table has the rows $(5,20)$, $(10,a)$ and $(15,60)$. What is $a$?'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The row $(5,20)$ gives $k=20/5=4$, and the row $(15,60)$ agrees because $60/15=4$. So $a=4\times 10=40$.'
          - problem: 'A table shows that $2$ tickets cost $7$ euros, $5$ tickets cost $17.5$ euros and $9$ tickets cost $31.5$ euros. Is the cost proportional to the number of tickets?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "yes, it is", "proportional", "it is proportional"], ["no", "it is not", "no, it is not", "not proportional", "it is not proportional"]]}
            solution_sketch: 'The cost per ticket is $7/2=3.5$, $17.5/5=3.5$ and $31.5/9=3.5$. All the ratios are equal, so the cost is proportional to the number of tickets.'
        constraints: 'every row gives the same y/x ratio'
      - id: kp3
        name: 'k as a unit rate'
        key_prerequisites: [dividing-fractions]
        try_first:
          problem: 'Four identical pens cost $10$ euros. How many euros does one pen cost?'
          answer_contract: {"kind":"exact"}
          answer: '2.5'
          reveal: 'One pen costs the total shared among the $4$ pens, $10/4=2.5$ euros. That price for one unit is the unit rate, which is the constant of proportionality $k$.'
        exemplars:
          - problem: 'Five kilograms of apples cost $20$ euros. What is the price per kilogram?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The price of one kilogram is the cost shared among the kilograms, $20/5=4$ euros per kilogram.'
          - problem: 'A cyclist travels $42$ km in $3$ hours at a constant speed. What is the speed?'
            answer: '14'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'Speed is distance divided by time, $42/3=14$ km/h. The cyclist covers $14$ km in each hour.'
          - problem: 'A printer prints $84$ pages in $7$ minutes. How many pages does it print per minute?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate per minute is the number of pages divided by the number of minutes, $84/7=12$ pages per minute.'
          - problem: 'A recipe uses $9$ cups of flour for $6$ batches. How many cups of flour go into one batch?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The flour for one batch is the total shared among the batches, $9/6=3/2$ cups.'
          - problem: 'A copier makes $90$ copies in $9$ minutes at a steady rate. How many seconds does it take to make one copy?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'Nine minutes are $540$ seconds. Dividing the time by the number of copies gives $540/90=6$ seconds for one copy.'
          - problem: 'A tap fills a $45$-litre barrel in $6$ minutes at a steady rate. How much water flows out of the tap per minute?'
            answer: '7.5'
            answer_contract: {"kind": "unit", "quantity": "flow", "unit": "L/min", "allow_omitted": true}
            solution_sketch: 'The flow per minute is the volume divided by the time, $45/6=7.5$ litres per minute.'
          - problem: 'Shop A sells $6$ kg of rice for $15$ euros and shop B sells $4$ kg of the same rice for $11$ euros. How much cheaper per kilogram is shop A?'
            answer: '0.25'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Shop A charges $15/6=2.5$ euros per kilogram and shop B charges $11/4=2.75$ euros per kilogram. Shop A is cheaper by $2.75-2.5=0.25$ euros per kilogram.'
          - problem: 'A car uses $36$ litres of fuel to drive $450$ km. How many kilometres does it drive on one litre?'
            answer: '12.5'
            answer_contract: {"kind": "unit", "quantity": "length_per_volume", "unit": "km/L", "allow_omitted": true}
            solution_sketch: 'The distance for one litre is the distance divided by the fuel, $450/36=12.5$ kilometres per litre. Dividing the fuel by the distance would give the wrong rate.'
          - problem: 'Nine bottles of juice cost $13.50$ euros. How much do $14$ bottles cost at the same price per bottle?'
            answer: '21'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'One bottle costs $13.5/9=1.5$ euros. Fourteen bottles cost $14 \times 1.5=21$ euros, so the unit rate is multiplied here.'
          - problem: 'A pump removes $36$ litres of water in $8$ minutes at a steady rate. How many minutes does it take to remove $117$ litres?'
            answer: '26'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'The pump removes $36/8=4.5$ litres each minute. The time is the volume divided by that rate, $117/4.5=26$ minutes.'
        constraints: 'one quantity per one unit of the other; clean division'
    diagnostic_exemplar:
      problem: '$4$ kilograms of cheese cost €30. What is the price per kilogram?'
      answer: '7.50'
      answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
      solution_sketch: '$k = \frac{30}{4} = 7.5$.'
    anki_seeds:
      - front: "For a proportional relationship y = kx, the constant of proportionality k equals:"
        back: "y/x (the unit rate: y per one unit of x)"
        type: basic

  - id: proportional-relationships
    name: "Proportional Relationships"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: numeric
    expected_time_secs: 80
    prerequisites:
      - id: constant-of-proportionality
        weight: 0.7
        key: true
      - id: ratios-proportions
        weight: 0.4
      - id: coordinate-plane
        weight: 0.3
      - id: dividing-fractions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Write and use the equation y = kx"
        key_prerequisites: [constant-of-proportionality]
        exemplars:
          - problem: 'A proportional relationship has the equation $y=\frac{5}{2}x$. Find $y$ when $x=6$.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each output is $\frac{5}{2}$ times the input. At $x=6$ this gives $y=\frac{5}{2}\cdot 6=15$.'
          - problem: 'A proportional relationship sends $x=3$ to $y=21$. Find $y$ when $x=8$.'
            answer: '56'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The constant is $k=21/3=7$, so the rule is $y=7x$. At $x=8$ the output is $7\cdot 8=56$.'
          - problem: 'A printer prints $y$ pages in $x$ minutes, and $y=12x$. How long does it take to print $150$ pages?'
            answer: '25/2'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'Put $y=150$ into $y=12x$ and divide by $12$: $x=150/12=25/2$. The printer needs $12.5$ minutes.'
          - problem: 'Sam finds the output of $y=3x$ at the input $5$ by adding: $5+3=8$. What is the correct output?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $y=3x$ the input is multiplied by $3$, not added to $3$. At $x=5$ the output is $3\cdot 5=15$.'
          - problem: 'A car travels at a constant speed and covers $80$ km in $2$ hours. Write an equation for the distance $d$ in kilometres after $t$ hours.'
            answer: 'd = 40t'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The speed is $80/2=40$ km per hour, so the distance is $40$ times the time. The equation is $d=40t$.'
          - problem: 'The equation $d=4t$ gives the distance $d$ in kilometres walked after $t$ hours. How far is the walk after half an hour?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'Substitute $t=\frac{1}{2}$ into the equation: $d=4\cdot\frac{1}{2}=2$. After half an hour the walk is $2$ kilometres long.'
          - problem: 'Water runs into a bath so that the volume in litres is $y=18x$ after $x$ minutes. How long does it take to reach $99$ litres?'
            answer: '11/2'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'Put $99$ in place of $y$ and divide by $18$: $x=99/18=11/2$. So the bath needs $5.5$ minutes.'
        constraints: 'equation form y = kx; the output, the input or the equation itself may be asked'
      - id: kp2
        name: "Recognize proportionality from tables and graphs"
        key_prerequisites: [coordinate-plane]
        try_first:
          problem: 'A table lists the inputs $2$, $3$ and $6$ with the outputs $10$, $15$ and $30$. By what number is each input multiplied to give its output?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'Each output is $5$ times its input: $2\cdot5=10$, $3\cdot5=15$, $6\cdot5=30$. A table is proportional when one number does this for every row.'
        exemplars:
          - problem: 'The pairs $(x,y)$ in a table are $(2,8)$, $(5,20)$ and $(9,36)$. Is $y$ proportional to $x$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is proportional", "proportional", "y is proportional to x"], ["no", "it is not proportional", "not proportional", "not proportional to x"]]}
            solution_sketch: 'The ratios are $8/2=4$, $20/5=4$ and $36/9=4$. They all agree, so $y$ is proportional to $x$.'
          - problem: 'A gym charges a joining fee of €20 and then €10 per visit. After $1$, $2$ and $3$ visits the total costs are €30, €40 and €50. Is the total cost proportional to the number of visits?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is proportional", "proportional", "y is proportional to x"], ["no", "it is not proportional", "not proportional", "not proportional to x"]]}
            solution_sketch: 'The ratios are $30/1=30$, $40/2=20$ and $50/3$, which differ. The fee makes the cost €20 before any visit, so the cost is not proportional.'
          - problem: 'One output in the table $(2,7)$, $(4,14)$, $(6,20)$ was written wrongly. The relationship is meant to be proportional. What should the output for the input $6$ be?'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first two rows give $7/2$ and $14/4=7/2$, so $k=7/2$. At $x=6$ the output is $\frac{7}{2}\cdot 6=21$, not $20$.'
          - problem: 'The pairs $(3,12)$ and $(5,a)$ belong to one proportional relationship. Find $a$.'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The constant of proportionality is $12/3=4$, so the rule is $y=4x$. At $x=5$ the output is $a=4\cdot 5=20$.'
          - problem: 'A tap runs at a steady rate from the moment it is opened. A meter reads $14$ L after $2$ minutes and $28$ L after $4$ minutes. What does the meter read after $6$ minutes?'
            answer: '42'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}
            solution_sketch: 'The tap delivers $14/2=7$ litres per minute, and the meter starts at $0$. After $6$ minutes the meter reads $7\cdot 6=42$ litres.'
          - problem: 'The pairs $(-2,3)$ and $(6,b)$ belong to one proportional relationship. Find $b$.'
            answer: '-9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The constant is $3/(-2)=-\frac{3}{2}$, so the rule is $y=-\frac{3}{2}x$. At $x=6$ this gives $b=-\frac{3}{2}\cdot 6=-9$.'
          - problem: 'Nina says the pairs $(1,5)$ and $(4,11)$ are proportional because both outputs grow with the input. If $y=5$ at $x=1$ in a proportional relationship, what is $y$ at $x=4$?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A proportional rule through $(1,5)$ is $y=5x$, because $k=5/1$. At $x=4$ it gives $y=20$, not $11$, so Nina is wrong.'
        constraints: 'proportional graphs are straight lines through the origin; tables have constant y/x'
      - id: kp3
        name: "Solve for either variable"
        key_prerequisites: [constant-of-proportionality]
        exemplars:
          - problem: 'In a proportional relationship, $y=10$ when $x=4$. Find $y$ when $x=6$.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First find the constant of proportionality: $k=10/4=\frac{5}{2}$. Then multiply it by the new input: $y=\frac{5}{2}\cdot 6=15$.'
          - problem: 'The point $(3,12)$ belongs to a proportional relationship. Find $x$ when $y=18$.'
            answer: '9/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The constant is $12/3=4$, so $y=4x$. Solve $18=4x$ by dividing by $4$ to get $x=9/2$.'
          - problem: 'Eight metres of fabric cost €20. At the same price per metre, how many metres cost €35?'
            answer: '14'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The price per metre is $20/8=\frac{5}{2}$ euros. Solve $\frac{5}{2}x=35$ to get $x=14$ metres.'
          - problem: 'A pump fills $15$ L in $6$ minutes at a steady rate. How many litres does it fill in $9$ minutes?'
            answer: '45/2'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}
            solution_sketch: 'The rate is $15/6=\frac{5}{2}$ litres per minute. Multiply by $9$ minutes to get $45/2$ litres.'
          - problem: 'Kim cycles at a steady speed and covers $18$ km in $45$ minutes. How long does she need for $30$ km?'
            answer: '75'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'She covers $18/45=\frac{2}{5}$ km per minute. Dividing $30$ km by this rate gives $30\div\frac{2}{5}=75$ minutes.'
          - problem: 'Tom pays €8.40 for $12$ pencils, all at the same price. How many pencils can he buy for €14?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One pencil costs $8.40/12=0.70$ euros. Dividing €14 by this price gives $14/0.70=20$ pencils.'
          - problem: 'On a map, $3$ cm stand for $12$ km. A road is $50$ km long. How long is the road on the map?'
            answer: '25/2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The map uses $3/12=\frac{1}{4}$ cm for each kilometre. The road measures $50\cdot\frac{1}{4}=25/2$ cm, which is $12.5$ cm.'
          - problem: 'Leo needs the price of $6$ notebooks. He knows that $4$ notebooks cost €10, and he multiplies $10\cdot 6=60$. What is the correct price?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'One notebook costs $10/4=\frac{5}{2}$ euros, so $6$ notebooks cost $\frac{5}{2}\cdot 6=15$ euros. Leo multiplied the price of $4$ notebooks instead.'
        constraints: 'find k first, then solve; integer, fraction or decimal answers; contexts need multiplication or division'
    diagnostic_exemplar:
      problem: '$y$ is proportional to $x$, and $y = 18$ when $x = 4$. Find $x$ when $y = 63$.'
      answer: '14'
      solution_sketch: '$k = \frac{18}{4} = 4.5$; then $x = \frac{63}{4.5} = 14$.'
    anki_seeds:
      - front: "A proportional relationship has the form y = ___ and its graph is a line through the ___."
        back: "y = kx; the origin (k is the constant of proportionality / unit rate)"
        type: basic

  - id: graphing-proportional-relationships
    name: "Graphing Proportional Relationships"
    core: false                # graphing destination; proportional-relationships stays core
    difficulty: 0.40
    drill: false
    answer_kind: multi-step
    expected_time_secs: 80
    prerequisites:
      - id: proportional-relationships
        weight: 0.6
        key: true
      - id: coordinate-plane
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Graph y = kx from two points"
        key_prerequisites: [proportional-relationships, coordinate-plane]
        exemplars:
          - problem: 'The graph of $y=2x$ is a straight line through the origin. It also passes through the point with $x=3$. What are the coordinates of that point?'
            answer: '(3,6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=3$ the equation gives $y=2\cdot 3=6$. So the second point of the line is $(3,6)$.'
          - problem: 'The graph of $y=\frac{x}{2}$ passes through the origin and through a second point with $y=3$. What are the coordinates of the second point?'
            answer: '(6,3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Solve $3=\frac{x}{2}$ by multiplying both sides by $2$ to get $x=6$. The second point is $(6,3)$.'
          - problem: 'A line through the origin is the graph of a proportional relationship with rate $-3$. Which point of the line is one unit to the right of the origin?'
            answer: '(1,-3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=1$ the output is the rate itself, $y=-3\cdot 1=-3$. The point one unit to the right of the origin is $(1,-3)$.'
          - problem: 'A tank fills at $4$ litres per minute. On a graph of litres against minutes the line starts at the origin. Which point of the graph shows the volume after $5$ minutes?'
            answer: '(5,20)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'After $5$ minutes the tank holds $4\cdot 5=20$ litres. So the graph passes through $(5,20)$.'
          - problem: 'A cyclist rides at $15$ km per hour. On a graph of distance in kilometres against time in hours, which point of the line shows that she has ridden $45$ km?'
            answer: '(3,45)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Divide the distance by the speed to find the time: $45/15=3$ hours. The point of the line is $(3,45)$.'
          - problem: 'Sam plots the origin and $(2,6)$ to graph $y=4x$. Which point with $x=2$ should he plot instead?'
            answer: '(2,8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=2$ the equation $y=4x$ gives $y=4\cdot 2=8$. Sam should plot $(2,8)$ together with the origin.'
          - problem: 'The graph of $y=-\frac{x}{4}$ passes through the origin and through a point with $x=8$. What are the coordinates of that point?'
            answer: '(8,-2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=8$ the equation gives $y=-\frac{8}{4}=-2$. So the second point of the line is $(8,-2)$.'
        constraints: 'always include the origin plus one more lattice point; the second point may come from an x-value or a y-value'
      - id: kp2
        name: "Read k from a graph"
        key_prerequisites: [proportional-relationships]
        exemplars:
          - problem: 'A straight line through the origin passes through the point $(5,20)$. It is the graph of $y=kx$. Find $k$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The point $(5,20)$ lies on the line, so $20=5k$. Divide by $5$ to get $k=4$.'
          - problem: 'On a graph the $x$-axis has $2$ units per square and the $y$-axis has $3$ units per square. A line through the origin passes through the mark $2$ squares right and $1$ square up. Find $k$ in $y=kx$.'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Convert the squares to units: $x=2\cdot 2=4$ and $y=3\cdot 1=3$. Then $k=3/4$.'
          - problem: 'The graph of cost in euros against mass in kilograms is a line through the origin and the point $(4,10)$. What does one kilogram cost?'
            answer: '5/2'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The price of one kilogram is the cost divided by the mass: $10/4=5/2$. One kilogram costs €2.50.'
          - problem: 'A line on a graph of distance in kilometres against time in hours passes through the origin and the point $(2.5,10)$. What is the speed?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'Speed is distance divided by time: $10/2.5=4$. The speed is $4$ kilometres per hour.'
          - problem: 'Sam reads $k=3$ from the proportional graph through $(12,4)$ by dividing $x$ by $y$. What is the correct value of $k$?'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $y=kx$ the vertical coordinate is the output, so $4=12k$. Then $k=4/12=1/3$, not $3$.'
          - problem: 'The line through the origin and the point $(6,15)$ is a proportional graph. Write its equation.'
            answer: 'y = 5x/2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The constant is $k=15/6=\frac{5}{2}$. So the equation of the line is $y=\frac{5}{2}x$.'
          - problem: 'A line through the origin passes through the point $(-4,10)$. Write its equation.'
            answer: 'y = -5x/2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The constant is $k=10/(-4)=-\frac{5}{2}$. So the equation of the line is $y=-\frac{5}{2}x$.'
          - problem: 'On a graph of paint in litres against area in square metres, a line through the origin passes through $(8,3)$. How many litres of paint does one square metre need?'
            answer: '3/8'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}
            solution_sketch: 'Divide the litres by the area: $3/8$. One square metre needs $3/8$ litre of paint.'
        constraints: 'k = y/x from any graphed point; fractional k allowed; the answer is k, a rate with its unit or the equation of the line'
      - id: kp3
        name: "Compare unit rates across representations"
        key_prerequisites: [proportional-relationships]
        exemplars:
          - problem: 'Line A passes through the origin and $(2,11)$. Line B passes through the origin and $(3,12)$. Both graphs use the same axis units. Which line has the greater unit rate?'
            answer: 'A'
            answer_contract: {"kind": "label", "options": [["A", "line A", "line A has the greater unit rate", "A has the greater unit rate"], ["B", "line B", "line B has the greater unit rate", "B has the greater unit rate"]]}
            solution_sketch: 'Line A has the rate $11/2=5.5$ and line B has the rate $12/3=4$. Since $5.5$ is greater than $4$, line A has the greater unit rate.'
          - problem: 'Shop A sells $3$ kg of grapes for €12. On the cost graph of shop B, with cost in euros against mass in kilograms, the line passes through the origin and $(5,15)$. Which shop has the lower price per kilogram?'
            answer: 'B'
            answer_contract: {"kind": "label", "options": [["A", "shop A", "shop A has the lower price", "A has the lower price"], ["B", "shop B", "shop B has the lower price", "B has the lower price"]]}
            solution_sketch: 'Shop A charges $12/3=4$ euros per kilogram and shop B charges $15/5=3$ euros per kilogram. Shop B has the lower price.'
          - problem: 'Tap A fills $45$ L in $6$ minutes. Tap B fills $52$ L in $8$ minutes. Both run at steady rates. How many more litres per minute does the faster tap deliver?'
            answer: '1'
            answer_contract: {"kind": "unit", "quantity": "flow", "unit": "L/min", "allow_omitted": true}
            solution_sketch: 'Tap A delivers $45/6=7.5$ litres per minute and tap B delivers $52/8=6.5$ litres per minute. The faster tap delivers $1$ litre more each minute.'
          - problem: 'One proportional relationship has the equation $y=4x$. Another is proportional and its table contains $(4,18)$. By how much do the two unit rates differ?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first rate is $4$ and the second rate is $18/4=9/2$. The rates differ by $9/2-4=1/2$.'
          - problem: 'Line A passes through the origin and $(2,-3)$. Line B passes through the origin and $(4,-10)$. By how much does the unit rate of A exceed the unit rate of B?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rate of A is $-3/2$ and the rate of B is $-10/4=-5/2$. The difference is $-\frac{3}{2}-\left(-\frac{5}{2}\right)=1$.'
          - problem: 'Ana walks $3$ km in $36$ minutes and Ben walks $5$ km in $50$ minutes, each at a steady pace. How many minutes less per kilometre does the faster walker take?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'Ana needs $36/3=12$ minutes per kilometre and Ben needs $50/5=10$ minutes per kilometre. Ben is faster and takes $2$ minutes less per kilometre.'
          - problem: 'Bike A is modelled by $d=12t$, with $d$ in kilometres and $t$ in hours. The graph of bike B passes through the origin and $(3,45)$. A proportional table for bike C contains $(2,26)$. Find the greatest of the three unit rates.'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Bike A has the rate $12$, bike B has $45/3=15$ and bike C has $26/2=13$. The greatest of the three rates is $15$.'
        constraints: 'compare k values; one comparison per problem'
