            answer: "the temperature stayed constant"
        constraints: "sign carries the direction of change"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Rate of change from a table"
        key_prerequisites: [slope]
        exemplars:
          - problem: "A table has time $2,5$ and output $7,19$. Find its rate of change."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The output changes by $19-7=12$ over $5-2=3$, so the rate is $4$."
          - problem: "A tank table lists minutes $1,4$ and litres $90,60$. Find the signed rate in L/min."
            answer: "-10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The change is $60-90=-30$ L over $4-1=3$ min; the rate is $-10$ L/min."
          - problem: "A table has input $-2,2$ and output $3,11$. Find the rate."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The input change is $2-(-2)=4$ and the output change is $8$, giving $8/4=2$."
          - problem: "A learner divides the outputs of a table with rows $(3,10),(7,30)$. Correct the rate of change."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rate uses differences: $(30-10)/(7-3)=20/4=5$."
        constraints: "two table rows; clean division"
    diagnostic_exemplar:
      problem: 'A candle is $30$ cm tall at $t = 0$ and $18$ cm tall at $t = 4$ hours. Find the rate of change of its height, in cm per hour.'
      answer: "-3"
      solution_sketch: '$\frac{18 - 30}{4 - 0} = -3$ cm per hour.'
    anki_seeds:
      - front: "In a linear model, the slope is the ___ of change, measured in units of ___ per unit of ___."
        back: "rate; y per x"
        type: basic

  - id: solutions-of-two-variable-equations
    name: "Solutions of Equations in Two Variables"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: evaluating-expressions
        weight: 0.6
        key: true
      - id: two-step-equations
        weight: 0.5
        key: true
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Check a candidate pair"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Is $(2, 5)$ a solution of $y = 3x - 1$?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$3(2) - 1 = 5$.'
          - problem: 'Is $(1, 4)$ a solution of $2x + y = 7$?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$2(1) + 4 = 6 \ne 7$.'
        constraints: "substitute both coordinates; yes/no answers"
      - id: kp2
        name: "Find y given x"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "For $y=3x-2$, find $y$ when $x=4$."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$y=3(4)-2=12-2=10$."
          - problem: "Complete the row with $x=-2$ for $2x+y=5$ by finding $y$."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2(-2)+y=5$ gives $-4+y=5$, hence $y=9$."
          - problem: "A charge is $y=5+2x$ euros. Find the charge for $x=3$ units."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$y=5+2(3)=5+6=11$ euros."
          - problem: "A learner uses $y=2$ for $x=1$ in $4x-2y=8$. Correct $y$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substitute $x=1$: $4-2y=8$, so $-2y=4$ and $y=-2$."
        constraints: "integer inputs and outputs"
      - id: kp3
        name: "Find x given y"
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: "For $y=3x+2$, find $x$ when $y=17$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$17=3x+2$ gives $3x=15$, hence $x=5$."
          - problem: "Complete the input in a row with $y=-1$ for $2x-y=7$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2x-(-1)=7$ becomes $2x+1=7$, so $x=3$."
          - problem: "A charge is $y=4x+3$ euros. How many units $x$ produce a €23 charge?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set $23=4x+3$. Removing the fixed fee gives $4x=20$, hence $x=5$."
          - problem: "A learner puts $x=4$ when $y=1$ in $y=9-2x$. Verify and give the correct input."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$1=9-2x$ gives $-8=-2x$; division by $-2$ confirms $x=4$."
        constraints: "requires solving a one- or two-step equation"
    diagnostic_exemplar:
      problem: 'For $y = 3x - 4$, find $x$ when $y = 11$.'
      answer: '5'
      solution_sketch: '$11 = 3x - 4$; $3x = 15$; $x = 5$.'
    anki_seeds:
      - front: "A solution of an equation in two variables is an ordered pair that ___."
        back: "makes the equation true when both values are substituted"
        type: basic

