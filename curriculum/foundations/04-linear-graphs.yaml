      answer: "y = 2x + 2"
      solution_sketch: '$y - 4 = 2(x - 1)$; $y = 2x - 2 + 4 = 2x + 2$.'
    anki_seeds:
      - front: "Point-slope form of a line through (x1, y1) with slope m:"
        back: "y - y1 = m(x - x1)"
        type: basic

