      problem: 'A proportional relationship is graphed through $(6, 15)$. Find $k$ and write the equation.'
      answer_contract: {kind: multipart, parts: [{name: k, contract: {kind: exact}}, {name: y, contract: {kind: exact}}]}
      answer: "k = 2.5; y = 2.5x"
