        try_first:
          problem: 'The line $y=3x-7$ crosses the y-axis. What is $y$ at the crossing?'
          answer_contract: {"kind": "exact"}
          answer: '-7'
          reveal: 'A crossing of the y-axis has $x=0$, so the term $3x$ is zero and only the constant is left.'
        exemplars:
          - problem: 'At what point does the line $y=2x+5$ cross the y-axis?'
            answer: '(0,5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Every point on the y-axis has $x=0$. Putting $x=0$ into the equation leaves $y=5$, so the crossing is $(0,5)$.'
          - problem: 'The line $3x+2y=8$ meets the vertical axis at one point. What are its coordinates?'
            answer: '(0,4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'On the vertical axis $x=0$, so the equation becomes $2y=8$. Then $y=4$ and the point is $(0,4)$.'
          - problem: 'A line passes through $(1,4)$ and $(2,7)$. At what point does it cross the y-axis?'
            answer: '(0,1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Each step of $1$ to the right adds $3$ to $y$. One step back from $x=1$ reaches the y-axis at $y=4-3=1$, so the point is $(0,1)$.'
          - problem: 'A gym charges a joining fee plus a monthly fee. The total cost after $m$ months is $C=25m+40$ euros. At what point does the graph of $C$ against $m$ cross the $C$-axis?'
            answer: '(0,40)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The graph crosses the $C$-axis at $m=0$, which is the cost before any month has passed. That cost is $25(0)+40=40$ euros, so the point is $(0,40)$.'
          - problem: 'Sam says the y-intercept of $y=6-x$ is $(6,0)$. What is the correct y-intercept?'
            answer: '(0,6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The point $(6,0)$ has $y=0$, so it is on the x-axis. On the y-axis $x=0$, so $y=6-0=6$ and the y-intercept is $(0,6)$.'
          - problem: 'The line $4x-5y=15$ crosses the y-axis. At what point?'
            answer: '(0,-3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Set $x=0$ to get $-5y=15$. Dividing both sides by $-5$ gives $y=-3$, so the point is $(0,-3)$.'
          - problem: 'A taxi trip of $4$ km costs $14$ euros and a trip of $6$ km costs $20$ euros. The cost is a linear function of the distance. At what point does the graph of the cost against the distance meet the cost axis?'
            answer: '(0,2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The extra $2$ km cost $6$ euros, which is $3$ euros per km. Going back $4$ km to the start removes $12$ euros from $14$, so the fixed charge is $2$ euros at $(0,2)$.'
          - problem: 'Where does the line $y=-\frac{2}{3}x-4$ cross the y-axis?'
            answer: '(0,-4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=0$ the term with $x$ is $0$. That leaves $y=-4$, so the point is $(0,-4)$.'
        constraints: "give the intercept as a point"
      - id: kp2
        name: "x-intercept: set y = 0"
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'At what point does the line $y=2x-6$ cross the x-axis?'
            answer: '(3,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Every point on the x-axis has $y=0$. Then $2x-6=0$ gives $2x=6$, so $x=3$ and the point is $(3,0)$.'
          - problem: 'The line $3x+2y=12$ meets the horizontal axis at one point. What are its coordinates?'
            answer: '(4,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'On the horizontal axis $y=0$, so the equation becomes $3x=12$. Then $x=4$ and the point is $(4,0)$.'
          - problem: 'A line passes through $(2,3)$ and $(4,2)$. At what point does it cross the x-axis?'
            answer: '(8,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The height falls $1$ while $x$ grows by $2$, which is $\frac12$ per unit of $x$. From $y=2$ at $x=4$ the height reaches $0$ after $4$ more units, at $x=8$.'
          - problem: 'Sam finds the x-intercept of $y=x+5$ and writes $(0,5)$. What is the correct x-intercept?'
            answer: '(-5,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The point $(0,5)$ has $x=0$, so it is the y-intercept. For the x-intercept set $y=0$: $x+5=0$ gives $x=-5$, so the point is $(-5,0)$.'
          - problem: 'A balloon descends so that its height is $h=120-5t$ metres after $t$ seconds. After how many seconds does it reach the ground?'
            answer: '24'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'The balloon is on the ground when $h=0$, so $120-5t=0$. Then $5t=120$ and $t=120\div5=24$ seconds.'
          - problem: 'A prepaid card has $y=15-0.25x$ euros of credit left after $x$ minutes of calls. After how many minutes is the credit used up?'
            answer: '60'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "min", "allow_omitted": true}
            solution_sketch: 'The credit is used up when $y=0$, so $15=0.25x$. Dividing by $0.25$ gives $x=15\div0.25=60$ minutes.'
          - problem: 'At what point does the line $y=4x-10$ meet the x-axis?'
            answer: '(5/2,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Set $y=0$ to get $4x-10=0$, so $4x=10$. Then $x=\frac52$ and the point is $(5/2,0)$.'
          - problem: 'Where does the line $y=-\frac{3}{5}x+6$ cross the horizontal axis?'
            answer: '(10,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'On the horizontal axis $y=0$, so $-\frac35x+6=0$ and $\frac35x=6$. Multiplying by $\frac53$ gives $x=10$, so the point is $(10,0)$.'
        constraints: "integer or simple fractional intercepts"
      - id: kp3
        name: "Both intercepts from standard form"
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Find the x-intercept and the y-intercept of the line $2x+3y=12$.'
            answer: '(6,0), (0,4)'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'Set $y=0$: $2x=12$, so $x=6$ and the x-intercept is $(6,0)$. Set $x=0$: $3y=12$, so $y=4$ and the y-intercept is $(0,4)$.'
          - problem: 'Find the x-intercept and the y-intercept of the line $4x-2y=8$.'
            answer: '(2,0), (0,-4)'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'At $y=0$ the equation is $4x=8$, so the x-intercept is $(2,0)$. At $x=0$ it is $-2y=8$, so $y=-4$ and the y-intercept is $(0,-4)$.'
          - problem: 'Sam puts $x=0$ and $y=0$ into $3x+6y=18$ at the same time and gets $0=18$. Find the x-intercept and the y-intercept of the line.'
            answer: '(6,0), (0,3)'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'Sam must set only one variable to zero at a time. Setting $y=0$ gives $3x=18$, so $x=6$. Setting $x=0$ gives $6y=18$, so $y=3$.'
          - problem: 'A school has $20$ euros to spend on notebooks at $4$ euros each and pens at $5$ euros each, so $4x+5y=20$ for $x$ notebooks and $y$ pens. Find the x-intercept and the y-intercept of this line.'
            answer: '(5,0), (0,4)'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'With no pens, $y=0$ and $4x=20$, so $x=5$ notebooks. With no notebooks, $x=0$ and $5y=20$, so $y=4$ pens. The intercepts are $(5,0)$ and $(0,4)$.'
          - problem: 'Tickets cost $12$ euros for an adult and $5$ euros for a child. A family spends exactly $60$ euros, so $12a+5c=60$. How many adult tickets do they buy if they buy no child tickets?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With no child tickets, $c=0$ and the equation is $12a=60$. Dividing by $12$ gives $a=5$ adult tickets.'
          - problem: 'The line $3x+4y=24$ and the two axes enclose a triangle. What is the area of the triangle?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The x-intercept is $(8,0)$ because $3x=24$, and the y-intercept is $(0,6)$ because $4y=24$. The triangle has base $8$ and height $6$, so its area is $\frac12\cdot8\cdot6=24$.'
          - problem: 'Find the x-intercept and the y-intercept of the line $y=\frac{3}{2}x-9$.'
            answer: '(6,0), (0,-9)'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'Set $y=0$: $\frac32x=9$, so $x=6$ and the x-intercept is $(6,0)$. Set $x=0$: $y=-9$, so the y-intercept is $(0,-9)$.'
          - problem: 'Find the x-intercept and the y-intercept of the line $5x-2y=10$.'
            answer: '(2,0), (0,-5)'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'At $y=0$ we get $5x=10$, so $x=2$. At $x=0$ we get $-2y=10$, so $y=-5$. The intercepts are $(2,0)$ and $(0,-5)$.'
        constraints: "coefficients divide the constant evenly"
    diagnostic_exemplar:
      problem: 'Find the x-intercept and the y-intercept of the line $3x - 2y = 12$.'
      answer: '(4, 0), (0, -6)'
      solution_sketch: '$y = 0 \to 3x = 12 \to x = 4$; $x = 0 \to -2y = 12 \to y = -6$.'
    anki_seeds:
      - front: "To find intercepts of a line: x-intercept ->, y-intercept ->"
        back: "x-intercept: set y = 0 and solve; y-intercept: set x = 0 and solve"
        type: basic

  - id: reading-slope-intercept-equations
    name: "Reading Slope-Intercept Equations"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: slope
        weight: 0.6
        key: true
      - id: solutions-of-two-variable-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Read m and b directly"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'What is the slope of the line $y=3x-5$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is the number that multiplies $x$ in $y=mx+b$. Here that number is $3$, and the $-5$ only sets where the line crosses the y-axis.'
          - problem: 'The line $y=-2x+7$ crosses the y-axis at one point. What are its coordinates?'
            answer: '(0,7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=0$ the term $-2x$ is zero, so $y$ equals the constant $7$. The crossing is $(0,7)$.'
          - problem: 'What is the slope of the line $y=\frac{1}{2}x-3$?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number that multiplies $x$ is $\frac12$, so the slope is $\frac12$. The $-3$ is the y-intercept and not part of the slope.'
          - problem: 'A taxi fare is $C=4d+3$ euros for a trip of $d$ km. How many euros does each extra kilometre cost?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Each extra kilometre raises $C$ by the number that multiplies $d$, which is $4$ euros. The $3$ euros is the fixed start charge.'
          - problem: 'The water in a bath after $t$ minutes of draining is $V=120-8t$ litres. How much water was in the bath at the start?'
            answer: '120'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'At the start $t=0$, so $8t$ is $0$ and $V=120$. The bath held $120$ litres, and the $8$ is the litres lost each minute.'
          - problem: 'Sam reads the slope of $y=-4x-6$ as $4$. What is the correct slope?'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sign belongs to the number that multiplies $x$. That number is $-4$, so the slope is $-4$ and the line falls as $x$ grows.'
          - problem: 'At what point does the line $y=0.5x-8$ cross the y-axis?'
            answer: '(0,-8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The constant term gives the height at $x=0$. It is $-8$, so the line crosses the y-axis at $(0,-8)$.'
        constraints: "read coefficients directly"
      - id: kp2
        name: "Rearranged and implicit forms"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'What is the slope of the line $y=5-2x$?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write the right side as $-2x+5$ to see the order of $y=mx+b$. The number that multiplies $x$ is $-2$, so the slope is $-2$.'
          - problem: 'What is the slope of the line $y=x+4$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The term $x$ is the same as $1x$, because a coefficient of $1$ is not written. So the slope is $1$ and the constant $4$ is the y-intercept.'
          - problem: 'Where does the line $y=-x$ cross the y-axis?'
            answer: '(0,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The equation has no constant term, so $b=0$. The line passes through the origin and crosses the y-axis at $(0,0)$.'
          - problem: 'Sam says the line $y=6$ has slope $6$. What is the slope of this line?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation $y=6$ is $y=0x+6$, so $y$ stays at $6$ for every $x$. A line that does not rise or fall has slope $0$.'
          - problem: 'The balance of a savings account is $B=50+15w$ euros after $w$ weeks. How many euros are added each week?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Write the rule as $B=15w+50$. The number that multiplies $w$ is $15$, so $15$ euros are added each week and $50$ euros is the start balance.'
          - problem: 'What is the slope of the line $3y=6x+9$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide every term by $3$ to get $y=2x+3$. The number that multiplies $x$ is now $2$, so the slope is $2$.'
          - problem: 'Four friends share a taxi. Each friend pays $p=\frac{d}{4}+3$ euros for a trip of $d$ km. How many euros does each friend pay for each extra kilometre?'
            answer: '1/4'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The term $\frac{d}{4}$ is the same as $\frac14d$, so the number that multiplies $d$ is $\frac14$. Each friend pays $\frac14$ euro, which is $0.25$ euros, for each extra kilometre.'
          - problem: 'Where does the line $2y=6x+4$ cross the y-axis?'
            answer: '(0,2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Divide every term by $2$ to get $y=3x+2$. The constant is $2$, so the line crosses the y-axis at $(0,2)$.'
        constraints: "terms may appear in either order; missing coefficients are 1 or 0"
      - id: kp3
        name: "Slope as rise/run in the equation"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'You walk along the line $y=\frac{2}{3}x-1$ and move $3$ units to the right. How far up must you move to stay on the line?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope $\frac23$ means $2$ up for every $3$ to the right. A move of $3$ to the right therefore needs $2$ up.'
          - problem: 'Simplify the slope of the line $y=-\frac{4}{6}x+5$.'
            answer: '-2/3'
            answer_contract: {"kind": "required_form", "form": "reduced_fraction"}
            solution_sketch: 'The slope is $-\frac46$. Both $4$ and $6$ divide by $2$, which gives $-\frac23$.'
          - problem: 'On the line $y=-\frac{3}{2}x-1$ you move $4$ units to the right. By how much does $y$ change?'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope is $-\frac32$, so $y$ changes by $-3$ for every $2$ units to the right. A move of $4$ is two such steps, so $y$ changes by $-6$.'
          - problem: 'A road is modelled by $y=\frac{3}{20}x$, where $x$ is the horizontal distance and $y$ the height, both in metres. What horizontal distance does the road need to rise $6$ metres?'
            answer: '40'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The slope $\frac{3}{20}$ means a rise of $3$ for each $20$ of horizontal distance. A rise of $6$ is twice as much, so the distance is $6\div\frac{3}{20}=40$ metres.'
          - problem: 'Sam reads the slope of $y=\frac{3}{2}x+1$ as up $2$ for every $3$ to the right. How far up does the line really rise for a move of $4$ units to the right?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope $\frac32$ means up $3$ for every $2$ to the right, which is the reverse of what Sam read. A move of $4$ to the right is two steps of $2$, so the line rises $6$.'
          - problem: 'On the line $y=\frac{x}{4}+2$, how many units to the right do you move for each $1$ unit up?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The term $\frac{x}{4}$ is the same as $\frac14x$, so the slope is $\frac14$. That is $1$ up for every $4$ to the right.'
          - problem: 'A wheelchair ramp is modelled by $y=\frac{1}{12}x$, where $x$ is the horizontal distance and $y$ the height, both in metres. How high is the ramp at a horizontal distance of $30$ metres?'
            answer: '2.5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The slope $\frac1{12}$ means $1$ metre of height for every $12$ metres of distance. At $30$ metres the height is $30\cdot\frac{1}{12}=2.5$ metres.'
        constraints: "fractional slopes as rise over run"
    diagnostic_exemplar:
      problem: 'What is the slope of $y = 6 - \frac{3}{4}x$?'
      answer: '-3/4'
      solution_sketch: 'Reorder to $y = -\frac{3}{4}x + 6$.'
    anki_seeds:
      - front: "Slope-intercept form of a line:"
        back: "y = mx + b, where m is the slope and b is the y-intercept"
        type: basic

  - id: slope-intercept-form
    name: "Slope-Intercept Form"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: reading-slope-intercept-equations
        weight: 0.7
        key: true
      - id: slope
        weight: 0.5
        key: true
      - id: one-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Write the equation from slope and a point"
        key_prerequisites: [reading-slope-intercept-equations, one-step-equations]
        try_first:
          problem: 'A line has slope $2$ and passes through $(1,5)$. What is $y$ when $x=0$?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'One step left lowers $y$ by the slope, $2$, so $y=3$ at $x=0$. That height is the constant $b$ in $y=mx+b$.'
        exemplars:
          - problem: 'Write the equation of the line with slope $4$ that passes through $(2,7)$.'
            answer: 'y = 4x - 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Start with $y=4x+b$ and put in the point: $7=4(2)+b$, so $b=-1$. The equation is $y=4x-1$.'
          - problem: 'A line rises $1$ unit for every $2$ units to the right and passes through $(4,1)$. Write its equation.'
            answer: 'y = (1/2)x - 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $\frac12$, so $y=\frac12x+b$. The point gives $1=\frac12(4)+b=2+b$, so $b=-1$.'
          - problem: 'The line $y=-3x+b$ passes through $(-2,5)$. Write the full equation of the line.'
            answer: 'y = -3x - 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Put the point into the equation: $5=-3(-2)+b=6+b$. So $b=-1$ and the equation is $y=-3x-1$.'
          - problem: 'Sam writes $y=2x+1$ for the line with slope $2$ through $(3,4)$. Write the correct equation.'
            answer: 'y = 2x - 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The point must satisfy the equation, but $2(3)+1=7$ and not $4$. The constant is $b=4-2(3)=-2$, so the equation is $y=2x-2$.'
          - problem: 'A pool is filled at $5$ litres per minute. After $3$ minutes it holds $25$ litres. Write an equation for the volume $V$ in litres after $t$ minutes.'
            answer: 'V = 5t + 10'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The rate is the slope, so $V=5t+b$. At $t=3$ the pool holds $25$, so $25=15+b$ and $b=10$. The pool held $10$ litres at the start.'
          - problem: 'A hiker is $7$ km from camp after $2$ hours and walks directly away from camp at $3$ km per hour. Write an equation for the distance $d$ in km from camp after $t$ hours.'
            answer: 'd = 3t + 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The speed is the slope, so $d=3t+b$. At $t=2$ the hiker is $7$ km away, so $7=6+b$ and $b=1$.'
          - problem: 'A line with slope $-\frac{2}{3}$ passes through $(6,1)$. Write its equation.'
            answer: 'y = -(2/3)x + 5'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Start with $y=-\frac23x+b$. The point gives $1=-\frac23(6)+b=-4+b$, so $b=5$. The equation is $y=-\frac23x+5$.'
        constraints: "solve for b using the point"
      - id: kp2
        name: "Write the equation from two points"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'Write the equation of the line through $(1,3)$ and $(4,9)$.'
            answer: 'y = 2x + 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $\frac{9-3}{4-1}=2$. Then $3=2(1)+b$ gives $b=1$, so the equation is $y=2x+1$.'
          - problem: 'A straight-line table contains the rows $(-2,5)$ and $(1,-1)$. Write the rule for $y$ in terms of $x$.'
            answer: 'y = -2x + 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $\frac{-1-5}{1-(-2)}=-2$. Using $(-2,5)$ gives $5=4+b$, so $b=1$ and the rule is $y=-2x+1$.'
          - problem: 'A segment joins $(-4,-1)$ to $(2,2)$. Write the equation of the line that contains it.'
            answer: 'y = (1/2)x + 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The rise is $3$ over a run of $6$, so the slope is $\frac12$. At $(2,2)$ we get $2=1+b$, so $b=1$.'
          - problem: 'Sam says the line through $(2,2)$ and $(5,11)$ is $y=3x$. Write the correct equation of the line.'
            answer: 'y = 3x - 4'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope $\frac{11-2}{5-2}=3$ is right, but $3(2)=6$ and not $2$. The point $(2,2)$ gives $2=6+b$, so $b=-4$.'
          - problem: 'A taxi trip of $4$ km costs $14$ euros and a trip of $6$ km costs $20$ euros. Write an equation for the cost $C$ in euros of a trip of $d$ km.'
            answer: 'C = 3d + 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The extra $2$ km cost $6$ euros more, so the slope is $6\div2=3$ euros per km. Then $14=3(4)+b$ gives $b=2$.'
          - problem: 'A tree is $80$ cm tall after $2$ years and $140$ cm tall after $5$ years, and it grows at a steady rate. Write an equation for its height $h$ in cm after $t$ years.'
            answer: 'h = 20t + 40'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The tree grows $60$ cm in $3$ years, so the slope is $60\div3=20$ cm per year. Then $80=20(2)+b$ gives $b=40$.'
          - problem: 'At $2$ pm the temperature is $14$ degrees and at $6$ pm it is $6$ degrees, falling at a steady rate. Write an equation for the temperature $T$ at $t$ hours after noon.'
            answer: 'T = -2t + 18'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The temperature falls $8$ degrees in $4$ hours, so the slope is $-8\div4=-2$. Then $14=-2(2)+b$ gives $b=18$.'
          - problem: 'Write the equation of the line through $(-3,4)$ and $(6,4)$.'
            answer: 'y = 4'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Both points have height $4$, so the slope is $\frac{4-4}{6-(-3)}=0$. The line is horizontal and its equation is $y=4$.'
        constraints: "find slope first, then b"
      - id: kp3
        name: "Write the equation from intercept information"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'A line has x-intercept $(3,0)$ and y-intercept $(0,6)$. Write its equation.'
            answer: 'y = -2x + 6'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The y-intercept gives $b=6$. Going from $(3,0)$ to $(0,6)$ the slope is $\frac{6-0}{0-3}=-2$, so the equation is $y=-2x+6$.'
          - problem: 'A line crosses the x-axis at $-4$ and the y-axis at $2$. Write its equation.'
            answer: 'y = (1/2)x + 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The line passes through $(-4,0)$ and $(0,2)$, so the slope is $\frac{2}{4}=\frac12$. The y-intercept is $2$.'
          - problem: 'The graph of a line meets the axes at $(5,0)$ and $(0,-5)$. Write its equation.'
            answer: 'y = x - 5'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'From $(0,-5)$ to $(5,0)$ the rise and the run are both $5$, so the slope is $1$. The y-intercept is $-5$.'
          - problem: 'Sam uses $y=-3x+6$ for the line with x-intercept $6$ and y-intercept $3$. Write the correct equation.'
            answer: 'y = -(1/2)x + 3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The intercepts are $(6,0)$ and $(0,3)$, so $b=3$. The slope is $\frac{0-3}{6-0}=-\frac12$, and the line $y=-3x+6$ has x-intercept $2$, not $6$.'
          - problem: 'A phone battery is fully charged at $100\%$ when use starts, and it is empty after $5$ hours of steady use. Write an equation for the charge $P$ in percent after $t$ hours.'
            answer: 'P = -20t + 100'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The charge at $t=0$ is $100$, so $b=100$. It reaches $0$ at $t=5$, so the slope is $\frac{0-100}{5}=-20$ percent per hour.'
          - problem: 'A tank holds $90$ litres at the start and is empty after $15$ minutes of steady draining. Write an equation for the volume $V$ in litres after $t$ minutes.'
            answer: 'V = -6t + 90'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The volume at $t=0$ is $90$, so $b=90$. It reaches $0$ at $t=15$, so the slope is $\frac{0-90}{15}=-6$ litres per minute.'
          - problem: 'A line has x-intercept $(-6,0)$ and y-intercept $(0,-3)$. Write its equation.'
            answer: 'y = -(1/2)x - 3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The y-intercept gives $b=-3$. The slope from $(-6,0)$ to $(0,-3)$ is $\frac{-3-0}{0-(-6)}=-\frac12$.'
        constraints: "intercepts given as points or values"
    diagnostic_exemplar:
      problem: 'Write the slope-intercept equation of the line through $(1, 5)$ and $(3, 9)$.'
      answer: 'y = 2x + 3'
      solution_sketch: '$m = \frac{9 - 5}{3 - 1} = 2$; then $5 = 2(1) + b$ gives $b = 3$.'
    anki_seeds:
      - front: "Given slope m and a point (x1, y1), the y-intercept is b = ___."
        back: "b = y1 - m*x1"
        type: basic

  - id: graphing-linear-equations
    name: "Graphing Linear Equations"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: slope-intercept-form
        weight: 0.6
        key: true
      - id: graphing-from-a-table
        weight: 0.4
        key: true
      - id: x-y-intercepts
        weight: 0.4
        key: true
      - id: horizontal-vertical-slopes
        weight: 0.3
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Graph from slope and y-intercept"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'Graph $y=2x+3$ by starting at its y-intercept and moving one unit to the right along the line. Which point do you reach?'
            answer: '(1, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The y-intercept is $(0,3)$ and the slope $2$ means the line rises $2$ for each $1$ unit to the right. From $(0,3)$ that reaches $(1,5)$.'
          - problem: 'To graph $y=-\frac{1}{2}x+4$, start at the y-intercept and move $2$ units to the right along the line. Which point do you reach?'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The y-intercept is $(0,4)$. A slope of $-\frac{1}{2}$ means a fall of $1$ for each run of $2$, so the line reaches $(2,3)$.'
          - problem: 'A taxi charges a fixed fee plus a charge for each kilometre, so the cost in dollars of a trip of $x$ km is $y=3x+2$. On the graph the line starts at the point for a trip of $0$ km. Which point of the graph shows the cost of a $2$ km trip?'
            answer: '(2, 8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The graph starts at $(0,2)$, the fixed fee. A run of $2$ km raises the cost by $3\cdot 2=6$ dollars, so the point is $(2,8)$.'
          - problem: 'A tank holds $20$ litres and drains at a steady $4$ litres per minute, so after $x$ minutes it holds $y=-4x+20$ litres. Starting at the y-intercept and using the slope, at which point does the graph reach the x-axis?'
            answer: '(5, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The graph starts at $(0,20)$ and falls $4$ for each $1$ unit to the right. It reaches height $0$ after $20\div 4=5$ units, so it meets the x-axis at $(5,0)$.'
          - problem: 'Sam starts graphing $y=-2x-1$ at the point $(0,1)$. Starting instead at the true y-intercept, which point does the line reach one unit to the right?'
            answer: '(1, -3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The y-intercept is $(0,-1)$, not $(0,1)$. The slope $-2$ means a fall of $2$ for a run of $1$, so the line reaches $(1,-3)$.'
          - problem: 'To graph $y=\frac{2}{3}x-5$, start at the y-intercept and move $3$ units to the right along the line. Which point do you reach?'
            answer: '(3, -3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The y-intercept is $(0,-5)$. A slope of $\frac{2}{3}$ means a rise of $2$ for a run of $3$, so the line reaches $(3,-3)$.'
          - problem: 'A candle is $30$ cm tall and burns down $5$ cm every hour, so its height after $x$ hours is $y=-5x+30$ centimetres. Graph the line from its y-intercept. Which point shows the height after $3$ hours?'
            answer: '(3, 15)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The graph starts at $(0,30)$. Each hour is a run of $1$ and a fall of $5$, so $3$ hours give a fall of $15$ and the point $(3,15)$.'
        constraints: "plot (0, b), then use rise/run"
      - id: kp2
        name: "Graph using intercepts"
        key_prerequisites: [x-y-intercepts]
        exemplars:
          - problem: 'To graph $2x+3y=6$ using its intercepts, which two points do you plot?'
            answer: '(3, 0) and (0, 2)'
            answer_contract: {"kind": "list", "ordered": false, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'Put $y=0$: $2x=6$, so $x=3$ and the point is $(3,0)$. Put $x=0$: $3y=6$, so $y=2$ and the point is $(0,2)$.'
          - problem: 'Where does the line $x-y=4$ cross the x-axis and the y-axis?'
            answer: '(4, 0) and (0, -4)'
            answer_contract: {"kind": "list", "ordered": false, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'On the x-axis $y=0$, so $x=4$ and the crossing is $(4,0)$. On the y-axis $x=0$, so $-y=4$ and $y=-4$, giving $(0,-4)$.'
          - problem: 'Which two points do you plot to graph $-3x+2y=12$ by its intercepts?'
            answer: '(-4, 0) and (0, 6)'
            answer_contract: {"kind": "list", "ordered": false, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'With $y=0$ the equation is $-3x=12$, so $x=-4$ and the point is $(-4,0)$. With $x=0$ it is $2y=12$, so $y=6$ and the point is $(0,6)$.'
          - problem: 'Maya plots $(2,0)$ and $(0,3)$ as the intercepts of $3x+2y=12$. Which two points should she plot?'
            answer: '(4, 0) and (0, 6)'
            answer_contract: {"kind": "list", "ordered": false, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'Maya''s points are not on the line: $3\cdot 2+2\cdot 0=6$, not $12$. Put $y=0$: $3x=12$ gives $x=4$. Put $x=0$: $2y=12$ gives $y=6$, so the points are $(4,0)$ and $(0,6)$.'
          - problem: 'A school sells adult tickets at $4$ dollars and child tickets at $2$ dollars. For sales of $40$ dollars, the numbers sold satisfy $4a+2c=40$. On a graph with $a$ across and $c$ upwards, which two points of the line lie on the axes?'
            answer: '(10, 0) and (0, 20)'
            answer_contract: {"kind": "list", "ordered": false, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'With $c=0$ the equation is $4a=40$, so $a=10$ and the point is $(10,0)$. With $a=0$ it is $2c=40$, so $c=20$ and the point is $(0,20)$. These are the all-adult and all-child sales.'
          - problem: 'A budget of $60$ dollars buys songs at $1.50$ dollars each and films at $4$ dollars each, so $1.5s+4f=60$ for $s$ songs and $f$ films. Which two points of the graph of this equation lie on the axes?'
            answer: '(40, 0) and (0, 15)'
            answer_contract: {"kind": "list", "ordered": false, "member": {"kind": "coordinates", "arity": 2}}
            solution_sketch: 'With $f=0$ the equation is $1.5s=60$, so $s=40$ and the point is $(40,0)$. With $s=0$ it is $4f=60$, so $f=15$ and the point is $(0,15)$.'
          - problem: 'The line $3x-2y=0$ passes through the origin, so both its intercepts are $(0,0)$. To graph it, find a second point by taking $x=2$. What is that point?'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Both intercepts are $(0,0)$, so one more point is needed. With $x=2$ the equation is $6-2y=0$, so $y=3$ and the point is $(2,3)$.'
        constraints: "standard-form equations with integer intercepts"
      - id: kp3
        name: "Graph horizontal and vertical lines"
        key_prerequisites: [horizontal-vertical-slopes]
        exemplars:
          - problem: 'The vertical line $x=4$ and the horizontal line $y=-2$ are graphed on the same axes. At which point do they cross?'
            answer: '(4, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Every point of $x=4$ has first coordinate $4$. Every point of $y=-2$ has second coordinate $-2$. The lines cross at $(4,-2)$.'
          - problem: 'Where do the lines $y=6$ and $x=-3$ meet?'
            answer: '(-3, 6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The line $x=-3$ fixes the first coordinate at $-3$. The line $y=6$ fixes the second coordinate at $6$. They meet at $(-3,6)$.'
          - problem: 'The line $x=-\frac{3}{2}$ and the line $y=\frac{5}{2}$ intersect. Find the intersection point.'
            answer: '(-3/2, 5/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The vertical line fixes the first coordinate at $-\frac{3}{2}$. The horizontal line fixes the second coordinate at $\frac{5}{2}$. The intersection is $(-\frac{3}{2},\frac{5}{2})$.'
          - problem: 'On a town map, distances in kilometres are measured from the town hall at $(0,0)$. A straight road runs along $x=3$ and a canal runs along $y=-4$. A bridge stands where they cross. At which point is the bridge?'
            answer: '(3, -4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Every point of the road has $x=3$ and every point of the canal has $y=-4$. The bridge is on both, so it stands at $(3,-4)$.'
          - problem: 'A drone flies at a constant height of $40$ metres above the ground. Taking $x$ as its horizontal distance and $y$ as its height, what is the equation of its path on the graph?'
            answer: 'y = 40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The height stays at $40$ metres whatever the horizontal distance is. Every point of the path has $y=40$, so the path is the horizontal line $y=40$.'
          - problem: 'A straight wall on a plan passes through the points $(5,-2)$ and $(5,6)$. What is the equation of the line along the wall?'
            answer: 'x = 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both points have first coordinate $5$, so every point of the wall has $x=5$. The wall lies on the vertical line $x=5$.'
          - problem: 'Does the point $(4,-1)$ lie on the horizontal line $y=-1$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it does", "yes, it does", "it does", "it lies on the line", "yes, it lies on the line", "yes it lies on the line"], ["no", "no it does not", "no, it does not", "it does not", "it is not on the line", "it does not lie on the line", "no, it does not lie on the line"]]}
            solution_sketch: 'Every point of the line $y=-1$ has second coordinate $-1$, whatever its first coordinate is. The point $(4,-1)$ has second coordinate $-1$, so it lies on the line.'
          - problem: 'Does the point $(0,3)$ lie on the line $x=3$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it does", "yes, it does", "it does", "it lies on the line", "yes, it lies on the line", "yes it lies on the line"], ["no", "no it does not", "no, it does not", "it does not", "it is not on the line", "it does not lie on the line", "no, it does not lie on the line"]]}
            solution_sketch: 'Every point of the line $x=3$ has first coordinate $3$. The point $(0,3)$ has first coordinate $0$, so it does not lie on the line, even though its second coordinate is $3$.'
        constraints: "x = c vertical; y = c horizontal"
    diagnostic_exemplar:
      problem: 'To graph $3x + 2y = 12$ by intercepts, which two points do you plot?'
      answer_contract: {kind: list, ordered: false, member: {kind: coordinates, arity: 2}}
      answer: '(4, 0) and (0, 6)'
      solution_sketch: '$y = 0$ gives $x = 4$; $x = 0$ gives $y = 6$.'
    anki_seeds:
      - front: "Three standard ways to graph a line:"
        back: "slope-intercept (plot b, use rise/run); intercepts (plot both, connect); table of values"
        type: basic

  - id: point-slope-form
    name: "Point-Slope Form"
    core: true
    difficulty: 0.46
    drill: false
    # Answers are equations of lines (and slope/point pairs), not single expressions —
    # the SymPy override cannot parse "=" at all, so the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 80
    prerequisites:
      - id: slope
        weight: 0.6
        key: true
      - id: slope-intercept-form
        weight: 0.4
        key: true
      - id: distributive-property
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Write point-slope form"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'Write the equation of the line with slope $3$ through the point $(2,5)$ in point-slope form.'
            answer: 'y - 5 = 3(x - 2)'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Point-slope form is $y-y_1=m(x-x_1)$. Put $m=3$, $x_1=2$ and $y_1=5$ to get $y-5=3(x-2)$.'
          - problem: 'Write the line of slope $-1$ through $(-4,2)$ in point-slope form.'
            answer: 'y - 2 = -1(x + 4)'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Substitute $m=-1$, $x_1=-4$ and $y_1=2$. Since $x-(-4)=x+4$, the equation is $y-2=-1(x+4)$.'
          - problem: 'A hiker descends a steady $2$ metres every minute. At $3$ minutes into the walk her height is $120$ metres. Taking $x$ as minutes and $y$ as height in metres, write the line of her walk in point-slope form.'
            answer: 'y - 120 = -2(x - 3)'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The height falls $2$ metres per minute, so the slope is $-2$. The known point is $(3,120)$, which gives $y-120=-2(x-3)$.'
          - problem: 'A line rises $1$ unit for every $2$ units to the right and contains $(3,-6)$. Write its equation in point-slope form.'
            answer: 'y + 6 = (1/2)(x - 3)'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $\frac{1}{2}$ and the point is $(3,-6)$. Since $y-(-6)=y+6$, the equation is $y+6=\frac{1}{2}(x-3)$.'
          - problem: 'Sam writes $y-4=-2(x-1)$ for the line of slope $-2$ through $(-1,-4)$. What is the correct point-slope equation?'
            answer: 'y + 4 = -2(x + 1)'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Sam used the point $(1,4)$ instead of $(-1,-4)$. With the true point, $y-(-4)=y+4$ and $x-(-1)=x+1$, so the equation is $y+4=-2(x+1)$.'
          - problem: 'A pool holds $150$ litres $2$ minutes after draining starts and $90$ litres at $5$ minutes, and it drains at a constant rate. Using the reading at $2$ minutes, write the line of volume $y$ against time $x$ in point-slope form.'
            answer: 'y - 150 = -20(x - 2)'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $\frac{90-150}{5-2}=-20$ litres per minute. Using the point $(2,150)$ gives $y-150=-20(x-2)$.'
          - problem: 'Write point-slope form for the line of slope $\frac{3}{4}$ through $(-5,-7)$.'
            answer: 'y + 7 = (3/4)(x + 5)'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Substitute $m=\frac{3}{4}$, $x_1=-5$ and $y_1=-7$. Both subtractions of negative numbers become additions, so $y+7=\frac{3}{4}(x+5)$.'
        constraints: "y - y1 = m(x - x1); keep signs"
      - id: kp2
        name: "Read the slope and point from the form"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'Which point can be read directly from the point-slope equation $y-3=2(x-4)$?'
            answer: '(4, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Compare with $y-y_1=m(x-x_1)$. The numbers subtracted are $x_1=4$ and $y_1=3$, so the point is $(4,3)$.'
          - problem: 'What is the slope of the line $y+2=-3(x-1)$?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $y-y_1=m(x-x_1)$ the multiplier of the bracket is the slope. Here the multiplier is $-3$, so the slope is $-3$.'
          - problem: 'Which point does the equation $y+5=\frac{1}{2}(x+4)$ show?'
            answer: '(-4, -5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Write $y+5$ as $y-(-5)$ and $x+4$ as $x-(-4)$. A plus sign in the bracket means a negative coordinate, so the point is $(-4,-5)$.'
          - problem: 'What is the slope of the line $y-5=\frac{x+4}{2}$?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The right side equals $\frac{1}{2}(x+4)$. The multiplier of $(x+4)$ is $\frac{1}{2}$, so the slope is $\frac{1}{2}$.'
          - problem: 'The equation $y-120=60(x-2)$ models the distance $y$, in kilometres, covered by a bus after $x$ hours. What is the speed of the bus?'
            answer: '60'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The multiplier $60$ is the slope, which is the distance gained per hour. So the bus travels $60$ km each hour.'
          - problem: 'The equation $y-45=-5(x-3)$ gives the water level $y$, in centimetres, in a tank after $x$ hours. What is the level after $3$ hours?'
            answer: '45'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The equation shows the point $(3,45)$, so after $3$ hours the level is $45$ cm. Putting $x=3$ makes the bracket zero, which leaves $y=45$.'
          - problem: 'Lena reads the point $(3,2)$ from $y+2=4(x+3)$. Which point does the equation actually show?'
            answer: '(-3, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The form subtracts the coordinates, so $y+2=y-(-2)$ and $x+3=x-(-3)$. The point is $(-3,-2)$, not $(3,2)$.'
          - problem: 'In the tank equation $y-45=-5(x-3)$, what is the change in the level, in centimetres, in each hour?'
            answer: '-5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The multiplier $-5$ is the slope, the change in level per hour. A negative slope means the level falls by $5$ cm each hour.'
        constraints: "watch the sign flips: y + 3 means y1 = -3"
      - id: kp3
        name: "Convert to slope-intercept form"
        key_prerequisites: [distributive-property]
        exemplars:
          - problem: 'Write $y-3=2(x-2)$ in slope-intercept form.'
            answer: 'y = 2x - 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute the $2$ to get $y-3=2x-4$. Then add $3$ to both sides, which leaves $y=2x-1$.'
          - problem: 'Solve $y+2=-3(x+1)$ for $y$.'
            answer: 'y = -3x - 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute: $y+2=-3x-3$. Subtract $2$ from both sides to get $y=-3x-5$, the slope-intercept form.'
          - problem: 'Rewrite $y-4=\frac{1}{2}(x+6)$ in slope-intercept form.'
            answer: 'y = x/2 + 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product is $\frac{1}{2}x+3$, so $y-4=\frac{1}{2}x+3$. Add $4$ to both sides to get $y=\frac{1}{2}x+7$.'
          - problem: 'Sam converts $y+5=-2(x-3)$ to $y=-2x-11$. What is the correct slope-intercept form?'
            answer: 'y = -2x + 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product $-2(x-3)$ is $-2x+6$. Subtract $5$ from both sides, which gives $y=-2x+1$, not $-11$.'
          - problem: 'The total cost $y$, in dollars, of a gym membership after $x$ months satisfies $y-60=15(x-2)$. Write $y$ in terms of $x$.'
            answer: 'y = 15x + 30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute: $y-60=15x-30$. Add $60$ to both sides to get $y=15x+30$, so the sign-up cost is $30$ dollars.'
          - problem: 'A drone descends steadily at $4$ metres per second. After $5$ seconds its height is $80$ metres. Write an equation for its height $y$ after $x$ seconds.'
            answer: 'y = -4x + 100'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $-4$ and the line passes through $(5,80)$, so $y-80=-4(x-5)$. This simplifies to $y=-4x+100$.'
          - problem: 'A line has slope $-4$ and passes through $(2,-1)$. Write its equation in slope-intercept form.'
            answer: 'y = -4x + 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Point-slope form gives $y+1=-4(x-2)$, which is $y+1=-4x+8$. Subtracting $1$ gives $y=-4x+7$.'
        constraints: "distribute then isolate y"
    diagnostic_exemplar:
      problem: 'Using point-slope form, write the line through $(1, 4)$ with slope $2$ in slope-intercept form.'
      answer: "y = 2x + 2"
      solution_sketch: '$y - 4 = 2(x - 1)$; $y = 2x - 2 + 4 = 2x + 2$.'
    anki_seeds:
      - front: "Point-slope form of a line through (x1, y1) with slope m:"
        back: "y - y1 = m(x - x1)"
        type: basic

  - id: point-slope-standard-form
    name: "Point-Slope and Standard Form"
    core: true
    difficulty: 0.50
    drill: false
    # Answers are equations in standard / slope-intercept form; SymPy cannot parse "=".
    answer_kind: multi-step
    expected_time_secs: 110
    prerequisites:
      - id: point-slope-form
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: true
      - id: slope-intercept-form
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Convert to standard form"
        key_prerequisites: [point-slope-form, multi-step-equations]
        exemplars:
          - problem: 'Write $y=2x+3$ in standard form.'
            answer: '2x - y = -3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Standard form is $Ax+By=C$. Subtract $y$ and $3$ from both sides of $y=2x+3$ so the variable terms are together, which gives $2x-y=-3$.'
          - problem: 'Write $y-1=\frac{1}{2}(x-4)$ in standard form.'
            answer: 'x - 2y = 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Multiply both sides by $2$ to clear the fraction: $2y-2=x-4$. Moving $2y$ to the right and $-4$ to the left gives $x-2y=2$.'
          - problem: 'Write $y=-\frac{3}{4}x+2$ in standard form.'
            answer: '3x + 4y = 8'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Multiply both sides by $4$ to clear the fraction: $4y=-3x+8$. Add $3x$ to both sides to get $3x+4y=8$.'
          - problem: 'Sam writes $y+3=2(x-1)$ as $2x-y=1$. What is the correct standard form?'
            answer: '2x - y = 5'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Expand to $y+3=2x-2$, so $y=2x-5$. Moving the terms gives $2x-y=5$, not $1$.'
          - problem: 'A café takes $60$ dollars from small cups at $3$ dollars and large cups at $5$ dollars. With $x$ small cups and $y$ large cups, $y=12-\frac{3}{5}x$. Write this equation in standard form.'
            answer: '3x + 5y = 60'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Multiply both sides by $5$ to clear the fraction: $5y=60-3x$. Add $3x$ to both sides to get $3x+5y=60$.'
          - problem: 'Write $y+3=-\frac{2}{3}(x+6)$ in standard form.'
            answer: '2x + 3y = -21'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Multiply both sides by $3$: $3y+9=-2(x+6)=-2x-12$. Add $2x$ and subtract $9$ to get $2x+3y=-21$.'
          - problem: 'A band charges a booking fee of $40$ dollars plus $25$ dollars per hour, so the total cost $y$ for $x$ hours is $y=25x+40$. Write this equation in standard form.'
            answer: '25x - y = -40'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Subtract $y$ and $40$ from both sides of $y=25x+40$ so the variable terms are together. This gives $25x-y=-40$, with integer coefficients $25$ and $-1$.'
        constraints: "standard form Ax + By = C with integer A, B, C"
      - id: kp2
        name: "Standard form to slope-intercept"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Write $3x+2y=12$ in slope-intercept form.'
            answer: 'y = -3x/2 + 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $3x$ from both sides: $2y=-3x+12$. Divide every term by $2$ to get $y=-\frac{3}{2}x+6$.'
          - problem: 'Solve $4x-5y=20$ for $y$.'
            answer: 'y = 4x/5 - 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $4x$ from both sides: $-5y=-4x+20$. Divide every term by $-5$ to get $y=\frac{4}{5}x-4$.'
          - problem: 'Write $-2x+3y=9$ in slope-intercept form.'
            answer: 'y = 2x/3 + 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Add $2x$ to both sides: $3y=2x+9$. Dividing every term by $3$ gives $y=\frac{2}{3}x+3$.'
          - problem: 'Sam converts $6x+2y=-8$ to $y=-3x+4$. What is the correct slope-intercept form?'
            answer: 'y = -3x - 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After subtracting $6x$, the equation is $2y=-6x-8$. Dividing every term by $2$ gives $y=-3x-4$, so the constant is $-4$.'
          - problem: 'A school trip sells adult tickets at $8$ dollars and child tickets at $5$ dollars. For sales of $200$ dollars, $x$ adult and $y$ child tickets satisfy $8x+5y=200$. Solve this equation for $y$.'
            answer: 'y = -8x/5 + 40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $8x$ from both sides: $5y=-8x+200$. Divide every term by $5$ to get $y=-\frac{8}{5}x+40$.'
          - problem: 'A baker has $24$ grams of spice. A loaf uses $3$ grams and a roll uses $4$ grams, so $x$ loaves and $y$ rolls satisfy $3x+4y=24$. What is the change in the number of rolls for each extra loaf?'
            answer: '-3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Solving for $y$ gives $y=-\frac{3}{4}x+6$. The slope $-\frac{3}{4}$ is the change in the number of rolls for each extra loaf.'
          - problem: 'Write $x-4y=8$ in slope-intercept form.'
            answer: 'y = x/4 - 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $x$ from both sides: $-4y=-x+8$. Divide every term by $-4$ to get $y=\frac{1}{4}x-2$.'
        constraints: "isolate y; fractional slopes allowed"
      - id: kp3
        name: "Line through two points, in standard form"
        key_prerequisites: [point-slope-form]
        exemplars:
          - problem: 'Find the equation of the line through $(1,2)$ and $(3,8)$ in standard form.'
            answer: '3x - y = 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $\frac{8-2}{3-1}=3$, so $y-2=3(x-1)$. Expanding gives $y=3x-1$, which is $3x-y=1$.'
          - problem: 'The points $(2,5)$ and $(4,6)$ lie on one line. Write the equation of the line in standard form.'
            answer: 'x - 2y = -8'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $\frac{6-5}{4-2}=\frac{1}{2}$, so $y-5=\frac{1}{2}(x-2)$. Multiplying by $2$ gives $2y-10=x-2$, which is $x-2y=-8$.'
          - problem: 'A line passes through $(-2,5)$ and $(1,-1)$. Write its equation in standard form.'
            answer: '2x + y = 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $\frac{-1-5}{1-(-2)}=-2$, so $y+1=-2(x-1)$. Expanding gives $y=-2x+1$, which is $2x+y=1$.'
          - problem: 'Ben writes $3x-2y=0$ for the line through $(-3,-2)$ and $(3,2)$. What is the correct equation in standard form?'
            answer: '2x - 3y = 0'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The point $(3,2)$ gives $9-4=5$, not $0$, so Ben is wrong. The slope is $\frac{4}{6}=\frac{2}{3}$ and the line passes through the origin, so $y=\frac{2}{3}x$ and $2x-3y=0$.'
          - problem: 'A taxi ride of $3$ km costs $11$ dollars and a ride of $7$ km costs $19$ dollars. The fare rises by a constant amount per kilometre. Write the equation relating the distance $x$ and the fare $y$ in standard form.'
            answer: '2x - y = -5'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $\frac{19-11}{7-3}=2$ dollars per km. Then $y-11=2(x-3)$ gives $y=2x+5$, which is $2x-y=-5$.'
          - problem: 'A tank holds $80$ litres after $2$ hours and $50$ litres after $6$ hours of draining at a steady rate. Write the equation for the volume $y$ after $x$ hours in standard form.'
            answer: '15x + 2y = 190'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $\frac{50-80}{6-2}=-\frac{15}{2}$ litres per hour. Then $y-80=-\frac{15}{2}(x-2)$, and multiplying by $2$ gives $2y-160=-15x+30$, so $15x+2y=190$.'
          - problem: 'What is the equation of the line through $(4,1)$ and $(4,7)$?'
            answer: 'x = 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both points have first coordinate $4$, so the line is vertical and has no slope. Every point of it has $x=4$.'
        constraints: "clear fractions to get integer coefficients"
    diagnostic_exemplar:
      problem: 'Write the line through $(2, 1)$ and $(4, 7)$ in standard form $Ax + By = C$.'
      answer_contract: {kind: polynomial_relation}
      answer: '3x - y = 5'
      solution_sketch: 'Slope $3$; $y - 1 = 3(x - 2)$; $y = 3x - 5$; so $3x - y = 5$.'
    anki_seeds:
      - front: "Standard form of a linear equation:"
        back: "Ax + By = C, with A, B, C integers"
        type: basic
      - front: "The slope of Ax + By = C (B nonzero) is:"
        back: "m = -A/B"
        type: basic

  - id: slopes-of-parallel-perpendicular-lines
    name: "Slopes of Parallel and Perpendicular Lines"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: expression
    expected_time_secs: 70
    prerequisites:
      - id: slope
        weight: 0.6
        key: true
      - id: reading-slope-intercept-equations
        weight: 0.5
        key: true
      - id: negative-fractions-decimals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Parallel: equal slopes"
        key_prerequisites: [reading-slope-intercept-equations]
        exemplars:
          - problem: 'What is the slope of any line parallel to $y=-3x+4$?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Parallel lines have equal slopes. The slope of $y=-3x+4$ is $-3$, so every parallel line has slope $-3$.'
          - problem: 'What is the slope of a line parallel to $2y=-8x+3$?'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide by $2$ to get $y=-4x+\frac{3}{2}$, so the slope is $-4$. A parallel line has the same slope, $-4$.'
          - problem: 'The lines $y=2x+1$ and $y=kx-5$ are parallel. Find $k$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Parallel lines have equal slopes. The slope of $y=2x+1$ is $2$ and the slope of $y=kx-5$ is $k$. The intercepts $1$ and $-5$ differ, so the lines are distinct and $k=2$.'
          - problem: 'A line crosses the y-axis at $5$ and is parallel to the line through $(0,1)$ and $(4,7)$. What is its slope?'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope of the given line is $\frac{7-1}{4-0}=\frac{6}{4}=\frac{3}{2}$. A parallel line has the same slope, so its slope is $\frac{3}{2}$.'
          - problem: 'On a map grid, two straight roads are parallel. One passes through $(0,2)$ and $(6,5)$. What is the slope of the other road?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first road has slope $\frac{5-2}{6-0}=\frac{3}{6}=\frac{1}{2}$. Parallel roads have equal slopes, so the other road also has slope $\frac{1}{2}$.'
          - problem: 'A ramp rises $30$ cm over a horizontal run of $240$ cm. A handrail is fixed parallel to the ramp. What is the slope of the handrail?'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ramp has slope $\frac{30}{240}=\frac{1}{8}$. The handrail is parallel, so its slope is also $\frac{1}{8}$.'
          - problem: 'For what value of $m$ are the lines $y=mx+3$ and $x+2y=8$ parallel?'
            answer: '-1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Solving $x+2y=8$ for $y$ gives $y=-\frac{1}{2}x+4$, so its slope is $-\frac{1}{2}$. The lines are parallel when $m=-\frac{1}{2}$.'
        constraints: "parallel: equal slopes, different intercepts"
      - id: kp2
        name: "Perpendicular: negative reciprocals"
        key_prerequisites: [slope]
        try_first:
          problem: 'A line has slope $2$. A second line has slope $-\frac{1}{2}$ and crosses it at right angles. What is the product of the two slopes?'
          answer_contract: {"kind": "exact"}
          answer: '-1'
          reveal: 'The product is $-1$. This holds for the slopes of any two perpendicular lines, which is why the perpendicular slope is the flipped and negated slope.'
        exemplars:
          - problem: 'What is the slope of a line perpendicular to a line of slope $3$?'
            answer: '-1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The perpendicular slope must multiply with $3$ to give $-1$. That slope is $-\frac{1}{3}$.'
          - problem: 'A line falls $2$ units over a run of $5$ units. What is the slope of a line perpendicular to it?'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The given slope is $-\frac{2}{5}$. Its negative reciprocal is $\frac{5}{2}$, and the product $-\frac{2}{5}\cdot\frac{5}{2}$ is $-1$.'
          - problem: 'A line passes through $(1,2)$ and $(5,4)$. What is the slope of a line perpendicular to it?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope of the given line is $\frac{4-2}{5-1}=\frac{1}{2}$. Flipping and negating gives $-2$, and $\frac{1}{2}\cdot(-2)=-1$.'
          - problem: 'Sam finds the slope of a line perpendicular to a line of slope $\frac{4}{3}$ by only changing the sign, which gives $-\frac{4}{3}$. What is the correct slope?'
            answer: '-3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both the flip and the sign change are needed. The perpendicular slope is $-\frac{3}{4}$, and $\frac{4}{3}\cdot(-\frac{3}{4})=-1$.'
          - problem: 'On a hillside plan, a path rises $3$ m for every $12$ m of horizontal distance. A fence is built at right angles to the path. What is the slope of the fence?'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The path has slope $\frac{3}{12}=\frac{1}{4}$. The fence is perpendicular, so its slope is the negative reciprocal, $-4$.'
          - problem: 'A laser beam travels along the line $y=\frac{5}{3}x-2$ and hits a mirror at right angles. What is the slope of the mirror?'
            answer: '-3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The beam has slope $\frac{5}{3}$. The mirror is perpendicular, so its slope is the negative reciprocal, $-\frac{3}{5}$.'
          - problem: 'For what value of $k$ are the lines $y=kx+1$ and $y=\frac{2}{5}x-3$ perpendicular?'
            answer: '-5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slopes must multiply to $-1$: $k\cdot\frac{2}{5}=-1$. Dividing by $\frac{2}{5}$ gives $k=-\frac{5}{2}$.'
        constraints: "flip and negate; product of the slopes is -1"
      - id: kp3
        name: "Classify a pair of lines"
        key_prerequisites: [reading-slope-intercept-equations]
        exemplars:
          - problem: 'Are the lines $y=\frac{2}{3}x+1$ and $y=-\frac{3}{2}x+5$ parallel, perpendicular, or neither?'
            answer: 'perpendicular'
            answer_contract: {"kind": "label", "options": [["parallel", "they are parallel", "the lines are parallel"], ["perpendicular", "they are perpendicular", "the lines are perpendicular"], ["neither", "neither parallel nor perpendicular", "they are neither", "not parallel or perpendicular", "not parallel and not perpendicular", "neither one"]]}
            solution_sketch: 'The slopes are $\frac{2}{3}$ and $-\frac{3}{2}$. Their product is $-1$, so the lines are perpendicular.'
          - problem: 'Are the lines $y=4x-1$ and $y=-4x+2$ parallel, perpendicular, or neither?'
            answer: 'neither'
            answer_contract: {"kind": "label", "options": [["parallel", "they are parallel", "the lines are parallel"], ["perpendicular", "they are perpendicular", "the lines are perpendicular"], ["neither", "neither parallel nor perpendicular", "they are neither", "not parallel or perpendicular", "not parallel and not perpendicular", "neither one"]]}
            solution_sketch: 'The slopes are $4$ and $-4$. They are not equal, so the lines are not parallel. Their product is $-16$, not $-1$, so the lines are not perpendicular either.'
          - problem: 'A rail runs along the line $y=3x+2$. A second rail is parallel to it and passes through the point $(0,-4)$. What is the equation of the second rail?'
            answer: 'y = 3x - 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A parallel line has the same slope, $3$. It crosses the y-axis at $-4$, so its equation is $y=3x-4$.'
          - problem: 'For what value of $k$ are the lines $y=kx+2$ and $y=-4x+1$ perpendicular?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slopes must multiply to $-1$: $k\cdot(-4)=-1$. Dividing by $-4$ gives $k=\frac{1}{4}$.'
          - problem: 'Two hiking paths on a plan follow the lines $y=\frac{3}{4}x+1$ and $4x+ky=12$. The paths cross at right angles. Find $k$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Solving $4x+ky=12$ for $y$ gives $y=-\frac{4}{k}x+\frac{12}{k}$, so its slope is $-\frac{4}{k}$. The slopes must multiply to $-1$: $-\frac{4}{k}\cdot\frac{3}{4}=-\frac{3}{k}=-1$, so $k=3$.'
          - problem: 'On a solar panel frame, one rail lies along $y=-2x+5$ and a crossbar along $y=kx-1$ meets it at right angles. Find $k$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slopes must multiply to $-1$: $-2k=-1$. So $k=\frac{1}{2}$.'
          - problem: 'A fence on a plan runs along the vertical line $x=3$. A second fence is perpendicular to it. What is the slope of the second fence?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A line perpendicular to a vertical line is horizontal. A horizontal line has slope $0$, so the second fence has slope $0$.'
        constraints: "one comparison per problem; slopes readable from the equations"
    diagnostic_exemplar:
      problem: 'Are $y = \frac{2}{3}x + 1$ and $y = -\frac{3}{2}x - 4$ parallel, perpendicular, or neither?'
      answer_contract: {kind: label, options: [[parallel], [perpendicular], [neither]]}
      answer: 'perpendicular'
      solution_sketch: 'The slopes multiply to $-1$.'
    anki_seeds:
      - front: "Slope relationship: parallel lines have ___ slopes; perpendicular lines have ___ slopes."
        back: "equal slopes; negative-reciprocal slopes (their product is -1)"
        type: basic

  - id: parallel-perpendicular-lines
    name: "Parallel and Perpendicular Lines"
    core: false
    difficulty: 0.50
    drill: false
    # Answers are equations of lines plus a classification; SymPy cannot parse "=".
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: slopes-of-parallel-perpendicular-lines
        weight: 0.7
        key: true
      - id: slope-intercept-form
        weight: 0.5
        key: true
      - id: point-slope-standard-form
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Write a parallel line through a point'
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'Write the equation of the line parallel to $y = 4x - 1$ through $(2, 3)$.'
            answer: 'y = 4x - 5'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Parallel lines have the same slope, so $m = 4$. Substituting $(2, 3)$ gives $3 = 4(2) + b$, so $b = -5$ and the line is $y = 4x - 5$.'
          - problem: 'Write the equation of the line parallel to $y = -x + 6$ through $(1, 1)$.'
            answer: 'y = -x + 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $-1$. Substituting $(1, 1)$ gives $1 = -1(1) + b$, so $b = 2$ and the line is $y = -x + 2$.'
          - problem: 'On a map, a straight road follows $y = 3x - 2$. A second road runs parallel to it and passes through the town at $(1, 4)$. Write the equation of the second road.'
            answer: 'y = 3x + 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Parallel roads have the same slope, $3$. Substituting $(1, 4)$ gives $4 = 3(1) + b$, so $b = 1$ and the second road is $y = 3x + 1$.'
          - problem: 'A line passes through $(0, 1)$ and $(2, 5)$. A second line is parallel to it and passes through $(3, 2)$. Write the equation of the second line.'
            answer: 'y = 2x - 4'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The first line has slope $\frac{5 - 1}{2 - 0} = 2$, and the second line has the same slope. Substituting $(3, 2)$ gives $2 = 2(3) + b$, so $b = -4$.'
          - problem: 'Sam writes the line parallel to $y = 2x + 3$ through $(4, 1)$ as $y = 2x + 1$. What is the correct equation?'
            answer: 'y = 2x - 7'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Sam kept the slope $2$ correctly but did not use the point to find $b$. Substituting $(4, 1)$ gives $1 = 2(4) + b$, so $b = -7$ and the line is $y = 2x - 7$.'
          - problem: 'Write the equation of the line parallel to $y = \frac{1}{2}x + 4$ through $(6, -1)$.'
            answer: 'y = 1/2 x - 4'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope stays $\frac{1}{2}$. Substituting $(6, -1)$ gives $-1 = \frac{1}{2}(6) + b$, so $-1 = 3 + b$ and $b = -4$.'
          - problem: 'Write the equation of the line parallel to $y = -2x + 5$ through $(2, 3)$.'
            answer: 'y = -2x + 7'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slope is $-2$. Substituting $(2, 3)$ gives $3 = -2(2) + b$, so $b = 7$ and the line is $y = -2x + 7$.'
          - problem: 'Is the line through $(0, 2)$ and $(4, 10)$ parallel to $y = 2x - 5$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "they are", "they are parallel", "it is parallel", "yes, they are parallel"], ["no", "it is not", "they are not", "not parallel", "they are not parallel", "no, they are not parallel"]]}
            solution_sketch: 'The line through $(0, 2)$ and $(4, 10)$ has slope $\frac{10 - 2}{4 - 0} = 2$. The line $y = 2x - 5$ also has slope $2$, so the lines are parallel.'
          - problem: 'Is the line through $(1, 3)$ and $(4, 9)$ parallel to $y = 3x - 2$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "they are", "they are parallel", "it is parallel", "yes, they are parallel"], ["no", "it is not", "they are not", "not parallel", "they are not parallel", "no, they are not parallel"]]}
            solution_sketch: 'The line through $(1, 3)$ and $(4, 9)$ has slope $\frac{9 - 3}{4 - 1} = 2$. The line $y = 3x - 2$ has slope $3$, so the slopes differ and the lines are not parallel.'
        constraints: 'keep the same slope; solve for b'
      - id: kp2
        name: 'Write a perpendicular line through a point'
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'Write the equation of the line perpendicular to $y = 2x + 5$ through $(0, 3)$.'
            answer: 'y = -1/2 x + 3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The perpendicular slope is the negative reciprocal of $2$, which is $-\frac{1}{2}$. The point $(0, 3)$ is on the $y$-axis, so $b = 3$.'
          - problem: 'A line of slope $-3$ is perpendicular to a second line. The second line passes through $(3, -1)$. Write the equation of the second line.'
            answer: 'y = 1/3 x - 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The slopes multiply to $-1$, so the second slope is $\frac{1}{3}$. Substituting $(3, -1)$ gives $-1 = \frac{1}{3}(3) + b$, so $b = -2$.'
          - problem: 'The line through $(0, 1)$ and $(2, 2)$ has a perpendicular through $(-1, 4)$. Write the equation of that perpendicular.'
            answer: 'y = -2x + 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The first line has slope $\frac{2 - 1}{2 - 0} = \frac{1}{2}$, so the perpendicular slope is $-2$. Substituting $(-1, 4)$ gives $4 = 2 + b$, so $b = 2$.'
          - problem: 'Sam says a line perpendicular to $y = -4x + 2$ through $(4, 3)$ has slope $4$. What is the correct equation of the perpendicular line?'
            answer: 'y = 1/4 x + 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The negative reciprocal of $-4$ is $\frac{1}{4}$, not $4$. Substituting $(4, 3)$ gives $3 = \frac{1}{4}(4) + b$, so $b = 2$.'
          - problem: 'On a town map, Mill Street follows $y = 3x - 4$. A new street meets Mill Street at a right angle and passes through $(6, 5)$. Write the equation of the new street.'
            answer: 'y = -1/3 x + 7'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The new street has slope $-\frac{1}{3}$, the negative reciprocal of $3$. Substituting $(6, 5)$ gives $5 = -2 + b$, so $b = 7$.'
          - problem: 'Line $p$ has slope $\frac{2}{3}$. Line $q$ passes through $(0, 0)$ and $(2, -3)$. Are the lines parallel, perpendicular, or neither?'
            answer: 'perpendicular'
            answer_contract: {"kind": "label", "options": [["perpendicular", "they are perpendicular", "the lines are perpendicular"], ["parallel", "they are parallel", "the lines are parallel"], ["neither", "neither of these", "they are neither", "the lines are neither"]]}
            solution_sketch: 'Line $q$ has slope $\frac{-3 - 0}{2 - 0} = -\frac{3}{2}$. The product $\frac{2}{3} \cdot \left(-\frac{3}{2}\right) = -1$, so the lines are perpendicular.'
          - problem: 'A rail line runs through $(1, 2)$ and $(5, 4)$. A service road crosses it at a right angle at $(5, 4)$. Write the equation of the service road.'
            answer: 'y = -2x + 14'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The rail line has slope $\frac{4 - 2}{5 - 1} = \frac{1}{2}$, so the road has slope $-2$. Substituting $(5, 4)$ gives $4 = -10 + b$, so $b = 14$.'
          - problem: 'Write the equation of the line perpendicular to $y = 5$ through $(2, -3)$.'
            answer: 'x = 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The line $y = 5$ is horizontal, so a perpendicular line is vertical. A vertical line through $(2, -3)$ has the equation $x = 2$.'
        constraints: 'use the negative reciprocal slope'
      - id: kp3
        name: 'Work from standard form'
        key_prerequisites: [point-slope-standard-form]
        exemplars:
          - problem: 'Write the equation of the line through the origin perpendicular to $2x + 3y = 6$.'
            answer: 'y = 3/2 x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Solving for $y$ gives $y = -\frac{2}{3}x + 2$, so the slope is $-\frac{2}{3}$. A perpendicular has slope $\frac{3}{2}$, and a line through the origin has $b = 0$.'
          - problem: 'A line perpendicular to $3x - 2y = 4$ passes through $(3, 1)$. Write its equation.'
            answer: 'y = -2/3 x + 3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Solving for $y$ gives $y = \frac{3}{2}x - 2$, so the perpendicular slope is $-\frac{2}{3}$. Substituting $(3, 1)$ gives $1 = -2 + b$, so $b = 3$.'
          - problem: 'Write the equation of the line parallel to $4x + 2y = 8$ through $(-1, 5)$.'
            answer: 'y = -2x + 3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Solving for $y$ gives $y = -2x + 4$, so the slope is $-2$. Substituting $(-1, 5)$ gives $5 = 2 + b$, so $b = 3$.'
          - problem: 'Sam takes slope $-5$ for a line perpendicular to $x + 5y = 10$ through $(1, 2)$. What is the correct equation of the perpendicular line?'
            answer: 'y = 5x - 3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Solving for $y$ gives $y = -\frac{1}{5}x + 2$, so the perpendicular slope is $5$. Substituting $(1, 2)$ gives $2 = 5 + b$, so $b = -3$.'
          - problem: 'On a plan, a fence follows $2x + y = 10$. A path crosses the fence at a right angle and passes through $(4, 1)$. Write the equation of the path.'
            answer: 'y = 1/2 x - 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Solving for $y$ gives $y = -2x + 10$, so the fence has slope $-2$ and the path has slope $\frac{1}{2}$. Substituting $(4, 1)$ gives $1 = 2 + b$, so $b = -1$.'
          - problem: 'A cycle path follows $x + 2y = 8$. A new path parallel to it must pass through the school at $(4, 5)$. Write the equation of the new path.'
            answer: 'y = -1/2 x + 7'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Solving for $y$ gives $y = -\frac{1}{2}x + 4$, so the slope is $-\frac{1}{2}$. Substituting $(4, 5)$ gives $5 = -2 + b$, so $b = 7$.'
          - problem: 'Write the equation of the line parallel to $3x + 4y = 12$ through $(4, -2)$.'
            answer: 'y = -3/4 x + 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Solving for $y$ gives $y = -\frac{3}{4}x + 3$, so the slope is $-\frac{3}{4}$. Substituting $(4, -2)$ gives $-2 = -3 + b$, so $b = 1$.'
          - problem: 'Are the lines $2x + 3y = 6$ and $3x - 2y = 12$ perpendicular?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they are", "they are perpendicular", "yes, they are perpendicular"], ["no", "they are not", "not perpendicular", "they are not perpendicular"]]}
            solution_sketch: 'The first line has slope $-\frac{2}{3}$ and the second has slope $\frac{3}{2}$. Their product is $-1$, so the lines are perpendicular.'
          - problem: 'A cable follows $6x + 3y = 5$ and a rail follows $y = 2x - 4$. Are they parallel?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they are", "they are parallel", "yes, they are parallel"], ["no", "they are not", "not parallel", "they are not parallel", "no, they are not parallel"]]}
            solution_sketch: 'Solving the first equation for $y$ gives slope $-2$, and the rail has slope $2$. The slopes differ, so the lines are not parallel.'
          - problem: 'Write the equation of the line parallel to $x = 3$ through $(-2, 5)$.'
            answer: 'x = -2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The line $x = 3$ is vertical, so a parallel line is vertical too. A vertical line through $(-2, 5)$ has the equation $x = -2$.'
        constraints: 'convert to find the slope first'
    diagnostic_exemplar:
      problem: 'Write the equation of the line perpendicular to $2x + 3y = 6$ through $(4, 1)$.'
      answer: 'y = 3/2 x - 5'
      solution_sketch: 'The given line has slope $-\frac{2}{3}$, so use $\frac{3}{2}$: $1 = 6 + b$ gives $b = -5$.'
    anki_seeds:
      - front: "To write a line through point P parallel or perpendicular to a given line:"
        back: "find the given slope; keep it (parallel) or take the negative reciprocal (perpendicular); then b = y1 - m*x1"
        type: basic

  - id: interpreting-linear-models
    name: "Interpreting Linear Models"
    core: false                # terminal linear-interpretation branch
    difficulty: 0.48
    drill: false
    # Answers are prose interpretations of slope and intercept in context.
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: slope-as-rate-of-change
        weight: 0.6
        key: true
      - id: slope-intercept-form
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: 'Meaning of the slope in context'
        key_prerequisites: [slope-as-rate-of-change]
        exemplars:
          - problem: 'A bike repair shop charges $C = 18h + 25$ euros for a job of $h$ hours. By how many euros does the charge increase for each extra hour of work?'
            answer: '18'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The slope is the coefficient of $h$, which is $18$. Each extra hour of work adds $18$ euros to the charge.'
          - problem: 'A tank holds $V = 300 - 15t$ litres of water after $t$ minutes of draining. What is the rate of change of the volume, in litres per minute?'
            answer: '-15'
            answer_contract: {"kind": "unit", "quantity": "flow", "unit": "L/min", "allow_omitted": true}
            solution_sketch: 'The rate of change is the slope, the coefficient of $t$, which is $-15$. The negative sign means the volume falls $15$ litres each minute.'
          - problem: 'A phone plan costs $y = 0.12m + 9$ euros in a month with $m$ minutes of calls. How many euros does each extra minute of calls add to the monthly cost?'
            answer: '0.12'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The slope is the coefficient of $m$, which is $0.12$. Each extra minute of calls adds $0.12$ euros to the monthly cost.'
          - problem: 'A candle''s height is $y = 22 - 0.4t$ centimetres after $t$ minutes of burning. As $t$ grows, does the height increase or decrease?'
            answer: 'decreases'
            answer_contract: {"kind": "label", "options": [["decreases", "decrease", "goes down", "decreasing", "down", "it decreases", "the height decreases"], ["increases", "increase", "goes up", "increasing", "up", "it increases", "the height increases"]]}
            solution_sketch: 'The slope is $-0.4$, which is negative. A negative rate of change means the height falls by $0.4$ centimetres each minute, so it decreases.'
          - problem: 'Water is pumped into a pool, and the volume is $V = 40t + 120$ litres after $t$ minutes. By how many litres does the volume grow in $15$ minutes?'
            answer: '600'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}
            solution_sketch: 'The volume grows $40$ litres each minute, the slope. Over $15$ minutes it grows $40 \cdot 15 = 600$ litres.'
          - problem: 'A savings account holds $S = 35d + 200$ euros after $d$ days. In how many days does the balance grow by $420$ euros?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "day", "allow_omitted": true}
            solution_sketch: 'The balance grows $35$ euros each day, the slope. To grow by $420$ euros takes $420 \div 35 = 12$ days.'
          - problem: 'Sam reads the model $T = 20 - 3h$ for the temperature in degrees Celsius after $h$ hours and says the temperature rises $3$ degrees each hour. What is the change in temperature, in degrees Celsius, over $4$ hours?'
            answer: '-12'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'The slope is $-3$, so the temperature falls $3$ degrees each hour and Sam has the direction wrong. Over $4$ hours the change is $-3 \cdot 4 = -12$ degrees.'
          - problem: 'A delivery van has $F = 60 - 8t$ litres of fuel in its tank after $t$ hours. After how many hours has the tank lost $36$ litres?'
            answer: '4.5'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}
            solution_sketch: 'The tank loses $8$ litres each hour, the size of the slope. Losing $36$ litres takes $36 \div 8 = 4.5$ hours.'
          - problem: 'The temperature in a freezer is $T = 4 - 0.5m$ degrees Celsius after $m$ minutes of cooling. At what rate does the temperature change, in degrees Celsius per minute?'
            answer: '-0.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rate of change is the slope, the coefficient of $m$, which is $-0.5$. The temperature falls $0.5$ degrees Celsius each minute.'
        constraints: 'slope = rate with units'
      - id: kp2
        name: 'Meaning of the y-intercept in context'
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'Water drains from a tank, and the volume of water after $x$ minutes is $y = -4x + 60$ litres. How many litres were in the tank before any draining?'
            answer: '60'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}
            solution_sketch: 'Before any draining, $x = 0$. Then $y = -4(0) + 60 = 60$, so the tank held $60$ litres.'
          - problem: 'A repair shop models the cost of a job by $C = 18h + 75$, where $h$ is the number of hours of work and $C$ is in euros. Is the $75$ a one-time charge or a per-hour charge?'
            answer: 'one-time'
            answer_contract: {"kind": "label", "options": [["one-time", "a one-time charge", "fixed", "flat", "one time", "a one time charge", "it is a one-time charge"], ["per-hour", "a per-hour charge", "hourly", "per hour", "a per hour charge", "it is a per-hour charge"]]}
            solution_sketch: 'A job with zero hours of work costs $18(0) + 75 = 75$ euros. So the $75$ is charged once, whatever the hours, and the per-hour charge is the slope $18$.'
          - problem: 'A mobile plan costs $y = 0.12m + 19$ euros for $m$ call minutes in a month. What does a month with no calls cost, in euros?'
            answer: '19'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'With no calls, $m = 0$. Then $y = 0.12(0) + 19 = 19$ euros.'
          - problem: 'Taxi app A charges $y = 2.5x + 4$ euros for a ride of $x$ km, and app B charges $y = 1.8x + 9$ euros. How many euros larger is the starting fee of app B than the starting fee of app A?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The starting fee is the value at $x = 0$. App A starts at $4$ euros and app B at $9$ euros, so the difference is $9 - 4 = 5$ euros.'
          - problem: 'A plant''s height is $h = 1.5w + 8$ centimetres after $w$ weeks. How tall was the plant when the measurements began?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The measurements began at $w = 0$. Then $h = 1.5(0) + 8 = 8$, so the plant was $8$ centimetres tall.'
          - problem: 'A candle burns down $2$ cm every minute. After $3$ minutes it is $19$ cm tall. How tall was it before it was lit?'
            answer: '25'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'In $3$ minutes the candle burned down $2 \cdot 3 = 6$ cm. So the starting height was $19 + 6 = 25$ cm.'
          - problem: 'Sam says that in $V = 300 - 15t$, the $300$ is the number of litres that drain away each minute. How many litres drain away each minute?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}
            solution_sketch: 'The $300$ is the volume at $t = 0$, not a rate. The litres drained each minute are given by the slope, whose size is $15$.'
          - problem: 'A pool drains, and the volume of water after $x$ minutes is $y = -5x + 80$ litres. Which describes the $80$ in this model: the volume before any draining, the volume drained each minute, the volume left after $80$ minutes, or the number of minutes until the pool is empty?'
            answer: 'the starting volume'
            answer_contract: {"kind": "label", "options": [["the starting volume", "the volume before any draining", "the volume in the pool before any draining", "initial volume"], ["the volume drained each minute", "the rate of draining", "litres drained per minute"], ["the volume left after 80 minutes", "the volume after 80 minutes"], ["the number of minutes until the pool is empty", "minutes until empty", "the time to empty"]]}
            solution_sketch: 'At $x = 0$ the model gives $y = -5(0) + 80 = 80$, so the $80$ is the volume before any draining. The rate of draining is the slope $-5$, and the pool is empty at $x = 16$ minutes.'
        constraints: 'intercept = starting or fixed value'
      - id: kp3
        name: 'Evaluate a model and interpret the result'
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'A taxi fare is $C = 3d + 4$ euros for a ride of $d$ km. What is the fare for a $5$ km ride?'
            answer: '19'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Substitute $d = 5$: $C = 3(5) + 4 = 15 + 4 = 19$. A $5$ km ride costs $19$ euros.'
          - problem: 'A tank contains $V = 60 - 4t$ litres after $t$ minutes of draining. How many litres are in the tank after $8$ minutes?'
            answer: '28'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}
            solution_sketch: 'Substitute $t = 8$: $V = 60 - 4(8) = 60 - 32 = 28$. The tank holds $28$ litres.'
          - problem: 'A temperature model is $T = 2h - 3$ degrees Celsius at hour $h$. What is the temperature at hour $4$?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'Substitute $h = 4$: $T = 2(4) - 3 = 8 - 3 = 5$. The temperature is $5$ degrees Celsius.'
          - problem: 'Sam says that $S = 10 + 5w$ euros gives savings of $30$ euros at week $w = 3$. What is the actual amount of savings at week $3$?'
            answer: '25'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Substitute $w = 3$: $S = 10 + 5(3) = 10 + 15 = 25$. Sam did not multiply $5$ by $3$ before adding $10$.'
          - problem: 'A taxi fare is $C = 3d + 4$ euros for a ride of $d$ km. A passenger pays $31$ euros. How many kilometres did the passenger ride?'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'Set $31 = 3d + 4$. Subtract $4$ to get $27 = 3d$, then divide by $3$ to get $d = 9$ km.'
          - problem: 'Phone plan A costs $12 + 0.5m$ euros for $m$ minutes of calls, and plan B costs $0.8m$ euros. For $30$ minutes of calls, how many euros cheaper is the cheaper plan?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Plan A costs $12 + 0.5(30) = 27$ euros and plan B costs $0.8(30) = 24$ euros. Plan B is cheaper by $27 - 24 = 3$ euros.'
          - problem: 'The tank model $V = 60 - 4t$ gives the volume in litres after $t$ minutes. Does the model make sense at $t = 20$ minutes?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it does not", "it does not make sense", "no, it does not make sense", "no, it does not"], ["yes", "it does", "it makes sense", "yes, it makes sense", "yes, it does"]]}
            solution_sketch: 'At $t = 20$ the model gives $V = 60 - 80 = -20$ litres. A volume cannot be negative, so the model does not make sense there; the tank is already empty at $t = 15$.'
          - problem: 'A pool holds $V = 250 + 30t$ litres after $t$ hours. How many litres are in the pool after $2.5$ hours?'
            answer: '325'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}
            solution_sketch: 'Substitute $t = 2.5$: $V = 250 + 30(2.5) = 250 + 75 = 325$. The pool holds $325$ litres.'
        constraints: 'evaluate at a given input; interpret with units'
    diagnostic_exemplar:
      problem: 'A phone plan costs $y = 0.10x + 20$ euros for $x$ minutes. What do the $0.10$ and the $20$ represent?'
      answer_contract: {kind: multipart, parts: [{name: rate, contract: {kind: unit, quantity: euro, unit: €}}, {name: fixed, contract: {kind: unit, quantity: euro, unit: €}}]}
      answer: "rate = €0.10; fixed = €20"
      solution_sketch: 'In $y = mx + b$ the slope is the cost of one more minute and the intercept is the cost at $x = 0$.'
    anki_seeds:
      - front: "In a real-world linear model y = mx + b, m is the ___ and b is the ___."
        back: "rate of change (per-unit amount); starting or fixed value"
        type: basic

  - id: linear-word-problems
    name: "Linear Models and Word Problems"
    core: false                # enrichment / applications leaf topic
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: interpreting-linear-models
        weight: 0.6
        key: true
      - id: slope-intercept-form
        weight: 0.4
        key: true
      - id: multi-step-equations
        weight: 0.4
      - id: graphing-linear-equations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: 'Build a linear cost model'
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'A taxi charges $3$ euros plus $2$ euros per kilometre. Let $C$ be the cost in euros of a ride of $k$ kilometres. Write the equation for $C$.'
            answer: 'C = 2k + 3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The charge per kilometre is the slope, $2$. The fixed fee of $3$ euros is the intercept, so $C = 2k + 3$.'
          - problem: 'A taxi charges $3$ euros plus $2$ euros per kilometre. What does a $7$ km ride cost?'
            answer: '17'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The ride costs $2$ euros for each of $7$ kilometres plus the $3$ euro fee. That is $2(7) + 3 = 17$ euros.'
          - problem: 'A delivery service charges $5$ euros plus $3$ euros per package. Let $C$ be the cost in euros of delivering $p$ packages. Write the equation for $C$.'
            answer: 'C = 3p + 5'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The charge per package, $3$ euros, is the slope. The flat fee of $5$ euros is the intercept, so $C = 3p + 5$.'
          - problem: 'A taxi charges $3$ euros plus $2$ euros per kilometre. Ana has $25$ euros. How far can she ride?'
            answer: '11'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'After the $3$ euro fee, Ana has $25 - 3 = 22$ euros for the distance. At $2$ euros per kilometre she rides $22 \div 2 = 11$ km.'
          - problem: 'A gym charges $40$ euros to join and $25$ euros each month. Let $C$ be the total cost in euros after $m$ months. Write the equation for $C$.'
            answer: 'C = 25m + 40'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The monthly charge $25$ is the slope. The joining fee of $40$ euros is paid once, so it is the intercept and $C = 25m + 40$.'
          - problem: 'A tank holds $500$ litres and loses $12$ litres each minute. Let $V$ be the volume in litres after $t$ minutes. Write the equation for $V$.'
            answer: 'V = 500 - 12t'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The tank starts at $500$ litres, the intercept. It loses $12$ litres each minute, so the slope is $-12$ and $V = 500 - 12t$.'
          - problem: 'A plumber charges a call-out fee of $60$ euros plus $45$ euros per hour. Sam writes the cost as $C = 60h + 45$. What is the correct equation for $C$?'
            answer: 'C = 45h + 60'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Sam swapped the two amounts. The charge per hour, $45$, is the slope and the call-out fee, $60$, is the intercept, so $C = 45h + 60$.'
          - problem: 'A phone plan costs $9$ euros plus $0.12$ euros per call minute. What is the cost of $150$ minutes of calls?'
            answer: '27'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The calls cost $0.12 \cdot 150 = 18$ euros. Adding the fixed $9$ euros gives $18 + 9 = 27$ euros.'
        constraints: 'rate is the slope; fixed fee is the y-intercept'
      - id: kp2
        name: 'Build a model from two data points'
        key_prerequisites: [slope-intercept-form]
        try_first:
          problem: 'A line passes through $(1, 3)$ and $(3, 7)$. What is the value of $y$ on this line when $x = 0$?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'The $y$ value at $x = 0$ is the intercept. Two points give the slope, and the slope then carries you back to $x = 0$.'
        exemplars:
          - problem: 'A candle is $20$ cm tall after $2$ hours of burning and $14$ cm tall after $5$ hours. The height falls at a constant rate. Let $h$ be the height in centimetres after $t$ hours. Write the equation for $h$.'
            answer: 'h = -2t + 24'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The height falls $20 - 14 = 6$ cm in $3$ hours, so the slope is $-2$. Then $20 = -2(2) + b$ gives $b = 24$, and $h = -2t + 24$.'
          - problem: 'A gym charges a joining fee plus a fixed monthly rate. The total cost is $95$ euros after $3$ months and $215$ euros after $7$ months. Let $C$ be the total cost in euros after $t$ months. Write the equation for $C$.'
            answer: 'C = 30t + 5'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Four extra months cost $215 - 95 = 120$ euros, so the slope is $120 \div 4 = 30$. Then $95 = 30(3) + b$ gives $b = 5$, and $C = 30t + 5$.'
          - problem: 'A tank fills at a constant rate. It holds $17$ litres after $2$ minutes and $32$ litres after $5$ minutes. Let $V$ be the volume in litres after $t$ minutes. Write the equation for $V$.'
            answer: 'V = 5t + 7'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The volume grows $32 - 17 = 15$ litres in $3$ minutes, so the slope is $5$. Then $17 = 5(2) + b$ gives $b = 7$, and $V = 5t + 7$.'
          - problem: 'A taxi fare is a fixed fee plus a charge per kilometre. A $4$ km trip costs $14$ euros and a $9$ km trip costs $29$ euros. Let $C$ be the fare in euros for a trip of $d$ kilometres. Write the equation for $C$.'
            answer: 'C = 3d + 2'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The extra $5$ km cost $29 - 14 = 15$ euros, so the slope is $3$. Then $14 = 3(4) + b$ gives $b = 2$, and $C = 3d + 2$.'
          - problem: 'A cyclist rides away from home at a steady speed. The cyclist is $25$ km from home after $1$ hour and $55$ km from home after $3$ hours. How fast is the cyclist riding?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The distance grows $55 - 25 = 30$ km in $3 - 1 = 2$ hours. The speed is $30 \div 2 = 15$ km per hour.'
          - problem: 'A plant grows at a steady rate. It is $14$ cm tall after $2$ weeks and $26$ cm tall after $5$ weeks. How tall will it be after $8$ weeks?'
            answer: '38'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The plant grows $26 - 14 = 12$ cm in $3$ weeks, which is $4$ cm per week. Three more weeks add $12$ cm, so the height is $26 + 12 = 38$ cm.'
          - problem: 'A bath holds $30$ litres after $2$ minutes and $70$ litres after $6$ minutes. Sam finds the rate by dividing $6 - 2$ by $70 - 30$. Let $V$ be the volume in litres after $t$ minutes. What is the correct equation for $V$?'
            answer: 'V = 10t + 10'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Sam divided the change in time by the change in volume, which is the wrong way round. The slope is $\frac{70 - 30}{6 - 2} = 10$. Then $30 = 10(2) + b$ gives $b = 10$.'
        constraints: 'treat the data as two points; integer slope and intercept'
      - id: kp3
        name: 'Solve for the input in a linear model'
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'A taxi fare is $C = 2d + 5$ euros for a ride of $d$ kilometres. How far does a passenger ride when the fare is $19$ euros?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'Set $19 = 2d + 5$. Subtract $5$ to get $14 = 2d$, then divide by $2$ to get $d = 7$ km.'
          - problem: 'A tank holds $V = 80 - 5t$ litres after $t$ minutes of draining. After how many minutes are $30$ litres left?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'Set $30 = 80 - 5t$. Subtract $80$ to get $-50 = -5t$, then divide by $-5$ to get $t = 10$ minutes.'
          - problem: 'Savings follow $S = 7d + 5$ euros after $d$ days. After how many days do the savings reach $40$ euros?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "day", "allow_omitted": true}
            solution_sketch: 'Set $40 = 7d + 5$. Subtract $5$ to get $35 = 7d$, then divide by $7$ to get $d = 5$ days.'
          - problem: 'A seedling''s height is $H = 3t + 2$ centimetres after $t$ days. Sam wants to know when the height reaches $20$ cm and divides $20$ by $3$. After how many days does the height reach $20$ cm?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "day", "allow_omitted": true}
            solution_sketch: 'Sam forgot the starting height of $2$ cm. Set $20 = 3t + 2$, subtract $2$ to get $18 = 3t$, and divide by $3$ to get $t = 6$ days.'
          - problem: 'Plan A costs $12 + 0.5m$ euros for $m$ minutes of calls, and plan B costs $0.8m$ euros. For how many minutes of calls do the two plans cost the same?'
            answer: '40'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'The costs are equal when $12 + 0.5m = 0.8m$. Subtracting $0.5m$ gives $12 = 0.3m$, so $m = 40$ minutes.'
          - problem: 'A candle is $H = 30 - 1.5t$ centimetres tall after $t$ minutes of burning. After how many minutes is the candle $12$ cm tall?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}
            solution_sketch: 'Set $12 = 30 - 1.5t$. Subtract $30$ to get $-18 = -1.5t$, then divide by $-1.5$ to get $t = 12$ minutes.'
          - problem: 'A repair shop charges a call-out fee of $20$ euros plus $15$ euros per hour. Maya''s bill is $87.50$ euros. How many hours did the job take?'
            answer: '4.5'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}
            solution_sketch: 'The hourly part of the bill is $87.50 - 20 = 67.50$ euros. Dividing by $15$ euros per hour gives $4.5$ hours.'
          - problem: 'A taxi fare is $C = 2d + 5$ euros for a ride of $d$ kilometres. Is $50$ euros enough for a ride of $22$ km?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "they are", "it is enough", "yes, it is enough", "yes, it is"], ["no", "it is not", "they are not", "it is not enough", "not enough", "no, it is not enough"]]}
            solution_sketch: 'A $22$ km ride costs $2(22) + 5 = 49$ euros. Since $49$ is less than $50$, the money is enough.'
        constraints: 'set the model equal to the target and solve'
