    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}},{"from":{"x":"-2","y":"-5","label":null},"to":{"x":"2","y":"1","label":null}}],"caption":"Reference example: Two reference lines have slope 3/2: y = (3/2)x + 1 and y = (3/2)x - 2. Only the displayed segments are drawn."}]
        name: "Parallel: equal slopes"
        key_prerequisites: [reading-slope-intercept-equations]
        exemplars:
          - problem: 'Are the lines $y = 2x + 1$ and $y = 2x - 5$ parallel, perpendicular, or neither?'
            answer: "parallel"
            answer_contract: {"kind":"label","options":[["parallel"],["perpendicular"],["neither"]]}
            solution_sketch: 'Equal slopes (both $2$).'
          - problem: 'What is the slope of any line parallel to $y = -3x + 4$?'
            answer: "-3"
            solution_sketch: 'Parallel lines share the same slope.'
          - problem: 'Are the lines $y = 5x - 2$ and $y = 5x + 7$ parallel, perpendicular, or neither?'
            answer: "parallel"
            answer_contract: {"kind":"label","options":[["parallel"],["perpendicular"],["neither"]]}
            solution_sketch: 'Equal slopes (both $5$).'
          - problem: 'What is the slope of any line parallel to $y = 4x - 1$?'
            answer: "4"
            solution_sketch: 'Parallel lines share the same slope.'
        constraints: "parallel: equal slopes, different intercepts"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}},{"from":{"x":"-3","y":"3","label":null},"to":{"x":"3","y":"-1","label":null}}],"caption":"Reference example: Reference lines y = (3/2)x + 1 and y = -(2/3)x + 1 have slope product -1 and intersect at (0,1). Only the displayed segments are drawn."}]
        name: "Perpendicular: negative reciprocals"
        key_prerequisites: [slope]
        exemplars:
          - problem: "Find the slope perpendicular to $m=3$."
            answer: "-1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The perpendicular slope must multiply by $3$ to give $-1$; it is $-1/3$."
          - problem: "A line falls $2$ units over $5$ units right. Find the slope of a perpendicular line."
            answer: "5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The given slope is $-2/5$; its negative reciprocal is $5/2$, whose product with $-2/5$ is $-1$."
          - problem: "A line through $(1,2),(3,8)$ is perpendicular to another. Find the other slope."
            answer: "-1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The given slope is $(8-2)/(3-1)=3$; flip and negate to get $-1/3$."
          - problem: "A learner only negates slope $4/3$ to get a perpendicular slope. Give the correct result."
            answer: "-3/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both reciprocal and sign change are required: $-(3/4)=-3/4$, giving product $-1$."
        constraints: "flip and negate; product of the slopes is -1"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}},{"from":{"x":"-3","y":"3","label":null},"to":{"x":"3","y":"-1","label":null}}],"caption":"Reference example: Reference lines y = (3/2)x + 1 and y = -(2/3)x + 1 have slope product -1 and intersect at (0,1). Only the displayed segments are drawn."}]
