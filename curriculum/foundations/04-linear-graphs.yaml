        weight: 0.2
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Build a linear cost model"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'A taxi charges €3 plus €2 per kilometre. Write the cost equation for k kilometres.'
            answer: "y = 2k + 3"
          - problem: 'Using that model, what is the cost of a $7$-kilometre ride?'
            answer: "€17"
            solution_sketch: '$2(7) + 3 = 17$.'
        constraints: "rate is the slope; fixed fee is the y-intercept"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Build a model from two data points"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'A burning candle is $20$ cm tall after $2$ hours and $14$ cm tall after $5$ hours. Write its height model $h = mt + b$.'
            answer: "h = -2t + 24"
            solution_sketch: '$m = \frac{14 - 20}{5 - 2} = -2$; $b = 20 - (-2)(2) = 24$.'
          - problem: 'A gym membership costs €95 total after $3$ months and €215 after $7$ months. Write the cost model.'
            answer: "y = 30m + 5"
            solution_sketch: '$m = \frac{215 - 95}{7 - 3} = 30$; $b = 95 - 30(3) = 5$.'
        constraints: "treat the data as two points; integer slope and intercept"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Solve for the input in a linear model"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'You start with €20 and save €8 per week. After how many weeks will you have €76?'
            answer: "7"
            solution_sketch: '$8x + 20 = 76$; $8x = 56$; $x = 7$.'
          - problem: 'A plant is $4$ cm tall and grows $3$ cm per week. After how many weeks is it $25$ cm?'
            answer: "7"
            solution_sketch: '$3x + 4 = 25$; $x = 7$.'
        constraints: "set the model equal to the target and solve"
    diagnostic_exemplar:
      problem: 'A candle is $24$ cm tall after $1$ hour of burning and $12$ cm tall after $5$ hours. After how many hours of burning is it $6$ cm tall?'
      answer: '7'
      solution_sketch: '$m = \frac{12 - 24}{5 - 1} = -3$ and $b = 27$; solve $6 = -3t + 27$ to get $t = 7$.'
    anki_seeds:
      - front: "In a linear model y = mx + b, the per-unit rate and the fixed fee map to..."
        back: "rate = slope m; fixed fee = y-intercept b"
        type: basic
      - front: "To build a linear model from two data readings..."
        back: "treat them as points: m = Δy/Δx, then b = y₁ − m·x₁"
        type: basic
