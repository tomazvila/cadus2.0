            solution_sketch: 'Negative reciprocal of $3$.'
          - problem: 'What is the slope of any line perpendicular to $y = -\frac{2}{5}x + 1$?'
            answer: "5/2"
            solution_sketch: 'Negative reciprocal of $-\frac{2}{5}$.'
        constraints: "flip and negate; product of the slopes is -1"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}},{"from":{"x":"-3","y":"3","label":null},"to":{"x":"3","y":"-1","label":null}}],"caption":"Reference example: Reference lines y = (3/2)x + 1 and y = -(2/3)x + 1 have slope product -1 and intersect at (0,1). Only the displayed segments are drawn."}]
        name: "Classify a pair of lines"
        key_prerequisites: [reading-slope-intercept-equations]
        exemplars:
          - problem: 'Are $y = \frac{1}{2}x + 3$ and $y = -2x - 1$ parallel, perpendicular, or neither?'
            answer: "perpendicular"
            solution_sketch: '$\frac{1}{2} \cdot (-2) = -1$.'
          - problem: 'Are $y = 3x + 2$ and $y = -3x + 2$ parallel, perpendicular, or neither?'
            answer: "neither"
            answer_contract: {"kind":"label","options":[["parallel"],["perpendicular"],["neither"]]}
            solution_sketch: 'Slopes $3$ and $-3$: not equal, product $-9 \ne -1$.'
        constraints: "one comparison per problem; slopes readable from the equations"
    diagnostic_exemplar:
      problem: 'Are $y = \frac{2}{3}x + 1$ and $y = -\frac{3}{2}x - 4$ parallel, perpendicular, or neither?'
      answer_contract: {kind: label, options: [[parallel], [perpendicular], [neither]]}
      answer: 'perpendicular'
      solution_sketch: 'The slopes multiply to $-1$.'
    anki_seeds:
      - front: "Slope relationship: parallel lines have ___ slopes; perpendicular lines have ___ slopes."
        back: "equal slopes; negative-reciprocal slopes (their product is -1)"
        type: basic

  - id: parallel-perpendicular-lines
    name: "Parallel and Perpendicular Lines"
    core: false
    difficulty: 0.50
    drill: false
    # Answers are equations of lines plus a classification; SymPy cannot parse "=".
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: slopes-of-parallel-perpendicular-lines
        weight: 0.7
        key: true
      - id: slope-intercept-form
        weight: 0.5
        key: true
      - id: point-slope-standard-form
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Write a parallel line through a point"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'Write the line parallel to $y = 4x - 1$ through $(2, 3)$.'
            answer: "y = 4x - 5"
            solution_sketch: '$m = 4$; $b = 3 - 4(2) = -5$.'
          - problem: 'Write the line parallel to $y = -x + 6$ through $(1, 1)$.'
            answer: "y = -x + 2"
            solution_sketch: '$m = -1$; $b = 1 - (-1)(1) = 2$.'
        constraints: "keep the same slope; solve for b"
      - id: kp2
        name: "Write a perpendicular line through a point"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'Write the line perpendicular to $y = 2x + 1$ through $(4, 1)$.'
            answer: "y = -1/2 x + 3"
            solution_sketch: '$m = -\frac{1}{2}$; $b = 1 - (-\frac{1}{2})(4) = 3$.'
          - problem: 'Write the line perpendicular to $y = -3x$ through $(6, 0)$.'
            answer: "y = 1/3 x - 2"
            solution_sketch: '$m = \frac{1}{3}$; $b = 0 - (\frac{1}{3})(6) = -2$.'
        constraints: "use the negative reciprocal slope"
      - id: kp3
        name: "Work from standard form"
        key_prerequisites: [point-slope-standard-form]
        exemplars:
          - problem: 'Write the line through the origin perpendicular to $2x + 3y = 6$.'
            answer: "y = 3/2 x"
            solution_sketch: 'Given slope $-\frac{2}{3}$; perpendicular slope $\frac{3}{2}$; $b = 0$.'
          - problem: 'Are $2x + 3y = 6$ and $3x - 2y = 4$ parallel, perpendicular, or neither?'
            answer: "perpendicular"
            solution_sketch: 'Slopes $-\frac{2}{3}$ and $\frac{3}{2}$; product is $-1$.'
        constraints: "convert to find the slope first"
    diagnostic_exemplar:
      problem: 'Write the equation of the line perpendicular to $2x + 3y = 6$ through $(4, 1)$.'
      answer: 'y = 3/2 x - 5'
      solution_sketch: 'The given line has slope $-\frac{2}{3}$, so use $\frac{3}{2}$: $1 = 6 + b$ gives $b = -5$.'
    anki_seeds:
      - front: "To write a line through point P parallel or perpendicular to a given line:"
        back: "find the given slope; keep it (parallel) or take the negative reciprocal (perpendicular); then b = y1 - m*x1"
        type: basic

  - id: interpreting-linear-models
    name: "Interpreting Linear Models"
    core: false                # terminal linear-interpretation branch
    difficulty: 0.48
    drill: false
    # Answers are prose interpretations of slope and intercept in context.
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: slope-as-rate-of-change
        weight: 0.6
        key: true
      - id: slope-intercept-form
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Meaning of the slope in context"
        key_prerequisites: [slope-as-rate-of-change]
        exemplars:
          - problem: 'A repair costs $C = 12h + 40$ euros for $h$ hours of work. What does the $12$ represent?'
            answer: "the cost per hour of work (€12 per hour)"
          - problem: 'In the tank model $y = -5x + 50$, what does the $-5$ represent?'
            answer: "the tank drains 5 L per minute"
        constraints: "slope = rate with units"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Meaning of the y-intercept in context"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'In the model $y = -5x + 50$, what does the $50$ represent?'
            answer: "the starting amount of water (50 L)"
          - problem: 'In $C = 12h + 40$, what does the $40$ represent?'
            answer: "the fixed fee charged regardless of hours (€40)"
        constraints: "intercept = starting or fixed value"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Evaluate a model and interpret the result"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'A tank holds $50$ L and drains $5$ L per minute. How much water remains after $4$ minutes?'
            answer: "30 L"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L"}
            solution_sketch: '$y = -5(4) + 50 = 30$.'
          - problem: 'A population follows $P = 8t + 100$ (people after $t$ years). Find $P$ at $t = 5$.'
            answer: "140"
        constraints: "evaluate at a given input; interpret with units"
    diagnostic_exemplar:
      problem: 'A phone plan costs $y = 0.10x + 20$ euros for $x$ minutes. What do the $0.10$ and the $20$ represent?'
      answer_contract: {kind: multipart, parts: [{name: rate, contract: {kind: unit, quantity: euro, unit: €}}, {name: fixed, contract: {kind: unit, quantity: euro, unit: €}}]}
      answer: "rate = €0.10; fixed = €20"
      solution_sketch: 'In $y = mx + b$ the slope is the cost of one more minute and the intercept is the cost at $x = 0$.'
    anki_seeds:
      - front: "In a real-world linear model y = mx + b, m is the ___ and b is the ___."
        back: "rate of change (per-unit amount); starting or fixed value"
        type: basic

