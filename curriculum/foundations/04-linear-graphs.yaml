        name: "Extend the pattern"
        key_prerequisites: [solutions-of-two-variable-equations]
        exemplars:
          - problem: "A linear table has $x:0,1,2,3$ and $y:3,7,11,?$. Find the missing output."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Each unit input step adds $4$ to the output; the next output is $11+4=15$."
          - problem: "A linear table gives $(2,9),(4,5),(6,1)$. Find the output at $x=8$."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The output drops by $4$ for each input step of $2$; one more step gives $1-4=-3$."
          - problem: "A counter is read every $3$ minutes: $8,13,18$. What is the next reading if the pattern is linear?"
            answer: "23"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Consecutive readings differ by $5$ over equal time steps, so the next is $18+5=23$."
          - problem: "A linear table gives outputs $?,6,10$ at inputs $-1,0,1$. Find the first output."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Moving forward one input step adds $4$, so move backward from $6$ by subtracting $4$: $6-4=2$."
        constraints: "use the constant difference, not the equation"
    diagnostic_exemplar:
      problem: "A line's table shows $(0, 3)$, $(1, 7)$, $(2, 11)$. Find $y$ at $x = 6$."
      answer: "27"
      solution_sketch: '$y$ climbs by $4$ per step from $3$, so $y = 4x + 3$ and $y(6) = 27$.'
    anki_seeds:
      - front: "In a table of a linear equation with evenly spaced x-values, the y-values change by ___."
        back: "a constant amount (equal steps)"
        type: basic

  - id: x-y-intercepts
    name: "x- and y-Intercepts"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 75
    prerequisites:
      - id: solutions-of-two-variable-equations
        weight: 0.6
        key: true
      - id: two-step-equations
        weight: 0.5
        key: true
      - id: graphing-from-a-table
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "y-intercept: set x = 0"
        key_prerequisites: [solutions-of-two-variable-equations]
        exemplars:
          - problem: "Find the y-intercept of $y=2x+5$ as a point."
            answer: "(0,5)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Set $x=0$; the variable term vanishes, leaving the constant height $5$."
          - problem: "A table on a line has rows $(1,4),(2,7)$. Extend it to find the y-intercept as a point."
            answer: "(0,1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "A unit step adds $3$; moving back from $x=1$ gives $y=4-3=1$ at $x=0$."
          - problem: "For $3x+2y=8$, find the point where the line meets the vertical axis."
            answer: "(0,4)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "On the vertical axis $x=0$, so $2y=8$ and $y=4$."
          - problem: "A learner calls $(6,0)$ the y-intercept of $y=6-x$. Correct the point."
            answer: "(0,6)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The y-intercept requires $x=0$; then $y=6-0=6$."
        constraints: "give the intercept as a point"
      - id: kp2
        name: "x-intercept: set y = 0"
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: "Find the x-intercept of $y=2x-6$ as a point."
            answer: "(3,0)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Set $y=0$: $2x-6=0$, hence $x=3$."
          - problem: "For $3x+2y=12$, give the point where the line meets the horizontal axis."
            answer: "(4,0)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "On the horizontal axis $y=0$; $3x=12$ gives $x=4$."
          - problem: "A linear table gives $(1,4),(2,2)$. Extend it to find the x-intercept as a point."
            answer: "(3,0)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Each step right lowers the output by $2$, so one more step reaches zero at $x=3$."
          - problem: "A learner swaps coordinates when finding the x-intercept of $y=x+5$. Correct the intercept point."
            answer: "(-5,0)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Set $y=0$ and solve $x+5=0$, giving $x=-5$."
        constraints: "integer intercepts"
      - id: kp3
        name: "Both intercepts from standard form"
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: "Find both intercepts of $2x+3y=12$. Give $(x_0,0,0,y_0)$, listing x-intercept then y-intercept."
            answer: "(6,0,0,4)"
            answer_contract: {"kind": "coordinates", "arity": 4}
            solution_sketch: "Set $y=0$: $2x=12$, giving $x=6$. Set $x=0$: $3y=12$, giving $y=4$."
          - problem: "A boundary has equation $4x-2y=8$. Give its intercept coordinates as $(x_0,0,0,y_0)$."
            answer: "(2,0,0,-4)"
            answer_contract: {"kind": "coordinates", "arity": 4}
            solution_sketch: "At $y=0$, $4x=8$ gives $2$; at $x=0$, $-2y=8$ gives $-4$."
          - problem: "A learner sets both variables to zero at once for $3x+6y=18$. Find the two intercepts separately as $(x_0,0,0,y_0)$."
            answer: "(6,0,0,3)"
            answer_contract: {"kind": "coordinates", "arity": 4}
            solution_sketch: "Set one variable to zero at a time: $3x=18$ gives $x=6$ and $6y=18$ gives $y=3$."
          - problem: "The budget line $4x+5y=20$ meets each axis. Give its intercepts as $(x_0,0,0,y_0)$."
            answer: "(5,0,0,4)"
            answer_contract: {"kind": "coordinates", "arity": 4}
            solution_sketch: "Setting $y=0$ gives $4x=20$, so $x=5$. Setting $x=0$ gives $5y=20$, so $y=4$."
        constraints: "coefficients divide the constant evenly"
    diagnostic_exemplar:
      problem: 'Find the x-intercept and the y-intercept of $3x - 2y = 12$. Give them as two points, x-intercept first.'
      answer: '(4, 0), (0, -6)'
      solution_sketch: '$y = 0 \to 3x = 12 \to x = 4$; $x = 0 \to -2y = 12 \to y = -6$.'
    anki_seeds:
      - front: "To find intercepts of a line: x-intercept ->, y-intercept ->"
        back: "x-intercept: set y = 0 and solve; y-intercept: set x = 0 and solve"
        type: basic

