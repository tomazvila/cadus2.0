  - id: slope-from-a-graph
    name: "Slope from a Graph"
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: coordinate-plane
        weight: 0.6
        key: true
      - id: dividing-fractions
        weight: 0.3
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Rise over run"
        key_prerequisites: [coordinate-plane]
        try_first:
          problem: 'A line rises $10$ units while it goes $5$ units to the right. How many units does it rise for each $1$ unit it goes to the right?'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'The rise is shared over $5$ units of run, so each unit of run brings $10/5=2$ units of rise. This number, the rise per unit of run, is the slope.'
        exemplars:
          - problem: 'A line on a grid goes $4$ squares right and $6$ squares up between two marked points. Each square is one unit on both axes. Find the slope.'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rise is $6$ and the run is $4$. Rise over run is $6/4=3/2$.'
          - problem: 'Two marks on a rising graph are $8$ squares apart horizontally and $2$ squares apart vertically. Both axes use one unit per square. Find the slope.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rise is $2$ units for a run of $8$ units. So the slope is $2/8=1/4$.'
          - problem: 'A wheelchair ramp rises $0.9$ m over a horizontal distance of $10.8$ m. Find the slope of the ramp.'
            answer: '1/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rise is $0.9$ m and the run is $10.8$ m. The slope is $0.9/10.8=1/12$.'
          - problem: 'A path on a hillside climbs $150$ m in height over a horizontal distance of $600$ m. Find the slope of the path.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rise is $150$ m and the run is $600$ m. The slope is $150/600=1/4$.'
          - problem: 'Sam finds the slope of a graph that rises $5$ units while it runs $2$ units to the right as $\frac{2}{5}$. What is the correct slope?'
            answer: '5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Slope is rise over run, so the rise $5$ goes on top and the run $2$ below. The slope is $5/2$, not $2/5$.'
          - problem: 'The $x$-axis has $5$ units per square and the $y$-axis has $2$ units per square. A line climbs $3$ squares while it goes $2$ squares to the right. Find the slope.'
            answer: '3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rise is $3\cdot 2=6$ units and the run is $2\cdot 5=10$ units. The slope is $6/10=3/5$.'
          - problem: 'The depth of water in a tank is graphed against time in hours. The line goes up $12$ cm for every $4$ hours. How many centimetres does the depth rise per hour?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "cm/h", "allow_omitted": true}
            solution_sketch: 'The depth rises $12$ cm in $4$ hours, so the rise per hour is $12/4=3$. This is the slope of the graph.'
        constraints: 'positive rise and run; fractions allowed; the rise and run are counted on a grid, in a table of a context or on scaled axes'
      - id: kp2
        name: "Sign of the slope from direction"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A line falls $4$ units as it goes $2$ units to the right. Find its slope.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The line falls, so the vertical change is $-4$. The run is $2$, so the slope is $-4/2=-2$.'
          - problem: 'The right end of a segment is $6$ units lower than its left end and $8$ units farther right. Find the slope.'
            answer: '-3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From left to right the height changes by $-6$ over a run of $8$. The slope is $-6/8=-3/4$.'
          - problem: 'A ski run, drawn from top left to bottom right, drops $45$ m over a horizontal distance of $150$ m. Find its slope.'
            answer: '-3/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The run goes downhill, so the rise is $-45$ and the run is $150$. The slope is $-45/150=-3/10$.'
          - problem: 'A descending line goes $5$ squares right and $3$ squares down on a grid with one unit per square. Find its slope.'
            answer: '-3/5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Moving down makes the rise $-3$, and the run to the right is $5$. The slope is $-3/5$.'
          - problem: 'Sam says that a line descending $9$ units over a run of $3$ units to the right has slope $3$. What is the correct slope?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The size of the quotient is $9/3=3$, but the line goes down. So the slope is $-3$, not $3$.'
          - problem: 'The graph of the fuel in a tank is a straight line. The tank holds $40$ L at the start and $28$ L after $150$ km. What is the slope of the graph in litres per kilometre?'
            answer: '-2/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fuel changes by $28-40=-12$ litres over $150$ km. The slope is $-12/150=-2/25$.'
          - problem: 'A line goes $6$ squares to the left and $4$ squares up on a grid with one unit per square. Find its slope.'
            answer: '-2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Going left makes the run $-6$ while the rise is $4$. The slope is $4/(-6)=-2/3$.'
        constraints: 'downward left-to-right means negative rise; the run is counted to the right, or a leftward run is negative'
      - id: kp3
