            answer_contract: {"kind": "exact"}
            solution_sketch: "The vertical change is $2-5=-3$ and the horizontal change is $5-1=4$, giving $-3/4$."
          - problem: "A line falls $6$ units for a rightward run of $9$ units. Give its slope as a reduced fraction."
            answer: "-2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Falling makes the rise negative: $-6/9$ reduces by $3$ to $-2/3$."
          - problem: "A linear table contains the rows $(x,y)=(-2,-3)$ and $(4,0)$. Find the slope."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Subtract consistently: the output increases by $3$ while the input increases by $6$, so the slope is $3/6=1/2$."
          - problem: "A slope calculation gives $(7-1)/(-5-(-1))$. Reduce the result and keep its sign."
            answer: "-3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The numerator is $6$ and denominator is $-4$. Reducing $6/(-4)$ gives $-3/2$."
        constraints: "reduce the fraction; keep sign"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Find an unknown coordinate from the slope"
        key_prerequisites: [slope-from-two-points]
        exemplars:
          - problem: "The slope through $(1,2)$ and $(4,y)$ is $2$. Find $y$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$(y-2)/(4-1)=2$ gives $y-2=6$, so $y=8$."
          - problem: "A line of slope $-3$ passes through $(2,5)$ and $(x,-4)$. Find $x$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$(-4-5)/(x-2)=-3$ gives $-9=-3(x-2)$, hence $x-2=3$ and $x=5$."
          - problem: "A table on a line has $x:0,6$ and $y:1,?$. Its slope is $1/2$. Find the missing output."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The output rise is $(1/2)6=3$; add to the initial output: $1+3=4$."
          - problem: "A learner puts $(3,4)$ on a slope-$2$ line through $(1,1)$. Keeping $x=3$, correct its $y$-coordinate."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The run from $x=1$ is $2$, requiring rise $2(2)=4$. Starting at $y=1$ gives $y=5$."
        constraints: "one unknown coordinate; integer answers"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Collinearity and comparing steepness"
        key_prerequisites: [slope-from-two-points]
        exemplars:
          - problem: 'Are $(0, 1)$, $(2, 5)$, and $(5, 11)$ collinear?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Slopes $\frac{4}{2} = 2$ and $\frac{6}{3} = 2$ match.'
          - problem: 'Which line is steeper: through $(0, 0)$ and $(2, 7)$, or through $(0, 0)$ and $(3, 9)$? Give the steeper line''s slope.'
            answer: "7/2"
            solution_sketch: 'Slopes $\frac{7}{2} = 3.5$ vs $3$; the line through $(2, 7)$ is steeper.'
        constraints: "compare or chain two slope computations"
    diagnostic_exemplar:
      problem: 'The line through $(1, 2)$ and $(4, y)$ has slope $-2$. Find $y$.'
      answer: '-4'
      solution_sketch: '$\frac{y - 2}{4 - 1} = -2$; $y - 2 = -6$; $y = -4$.'
    anki_seeds:
      - front: "Slope formula for points (x1, y1) and (x2, y2):"
        back: "m = (y2 - y1)/(x2 - x1) = rise/run"
        type: basic

