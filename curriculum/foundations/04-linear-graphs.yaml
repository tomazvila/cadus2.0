  - id: slope-intercept-form
    name: "Slope-Intercept Form"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: reading-slope-intercept-equations
        weight: 0.7
        key: true
      - id: slope
        weight: 0.5
        key: true
      - id: one-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Write the equation from slope and a point"
        key_prerequisites: [reading-slope-intercept-equations, one-step-equations]
        exemplars:
          - problem: "Write $y=mx+b$ for a line with slope $4$ through $(2,7)$. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(4,-1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Insert the point into $7=4(2)+b$, so $b=-1$. The slope stays $4$."
          - problem: "A line rises $1$ unit per $2$ units right and contains $(4,1)$. Write its slope-intercept equation. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(1/2,-1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The slope is $1/2$. Substituting the point gives $1=(1/2)4+b$, hence $b=-1$."
          - problem: "The line $y=-3x+b$ contains $(-2,5)$. Determine $b$ and give the complete equation. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(-3,-1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "At the given point, $5=-3(-2)+b=6+b$, which gives $b=-1$."
          - problem: "A student draws $y=2x+1$ for a slope-$2$ line through $(3,4)$. Correct the equation while preserving the slope. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(2,-2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The correct constant satisfies $4=2(3)+b$, so $b=-2$ instead of $1$."
        constraints: "solve for b using the point"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Write the equation from two points"
        key_prerequisites: [slope]
        exemplars:
          - problem: "Write the slope-intercept equation through $(1,3)$ and $(4,9)$. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(2,1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Slope is $(9-3)/(4-1)=2$. Then $3=2(1)+b$ gives $b=1$."
          - problem: "A straight-line table contains $(x,y)=(-2,5)$ and $(1,-1)$. Give its rule in slope-intercept form. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(-2,1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The rate is $(-1-5)/(1-(-2))=-2$. Using $(-2,5)$ gives $5=4+b$ and $b=1$."
          - problem: "A segment joins $(-4,-1)$ to $(2,2)$. Find the slope-intercept equation of its supporting line. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(1/2,1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The rise is $3$ over a run of $6$, so $m=1/2$. At $(2,2)$, $2=1+b$, giving $b=1$."
          - problem: "The proposed rule $y=3x$ must fit both $(2,2)$ and $(5,11)$. Replace it with the slope-intercept equation fitting both points. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(3,-4)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The two points give slope $(11-2)/(5-2)=3$. The first point then gives $2=6+b$, so $b=-4$."
        constraints: "find slope first, then b"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Write the equation from intercept information"
        key_prerequisites: [slope]
        exemplars:
          - problem: "A line has x-intercept $(3,0)$ and y-intercept $(0,6)$. Write its slope-intercept equation. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(-2,6)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The y-intercept fixes $b=6$. Reaching $(3,0)$ requires slope $(0-6)/(3-0)=-2$."
          - problem: "A line crosses the horizontal axis at $-4$ and the vertical axis at $2$. Give $y=mx+b$. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(1/2,2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Use $(-4,0)$ and $(0,2)$: the slope is $2/4=1/2$ and the vertical intercept is $2$."
          - problem: "The graph meets the axes at $(5,0)$ and $(0,-5)$. Recover its slope-intercept rule. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(1,-5)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "From $(0,-5)$ to $(5,0)$, rise and run are both $5$. Thus $m=1$ and $b=-5$."
          - problem: "A student uses $y=-3x+6$ for intercepts $x=6$ and $y=3$. Correct the slope-intercept equation. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(-1/2,3)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The intercepts are $(6,0)$ and $(0,3)$, so $b=3$ and $m=(0-3)/6=-1/2$."
        constraints: "intercepts given as points or values"
    diagnostic_exemplar:
      problem: 'Write the slope-intercept equation of the line through $(1, 5)$ and $(3, 9)$.'
      answer: 'y = 2x + 3'
      solution_sketch: '$m = \frac{9 - 5}{3 - 1} = 2$; then $5 = 2(1) + b$ gives $b = 3$.'
    anki_seeds:
      - front: "Given slope m and a point (x1, y1), the y-intercept is b = ___."
        back: "b = y1 - m*x1"
        type: basic

