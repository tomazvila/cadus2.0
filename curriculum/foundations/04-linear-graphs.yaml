ax":"5","y_min":"0","y_max":"4","x_tick":"1","y_tick":"1","points":[{"x":"-3","y":"4"},{"x":"5","y":"4"}],"segments":[{"from":{"x":"-3","y":"4","label":null},"to":{"x":"5","y":"4","label":null}}],"caption":"A coordinate grid with the segment between the two points the problem gives."}]
        name: "Slope between two graphed lattice points"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A line passes through the grid points $(1,1)$ and $(3,4)$. What is its slope?'
            answer: '3/2'
            answer_contract: {"kind": "exact"}
            visual: 0
            solution_sketch: 'Going from $(1,1)$ to $(3,4)$ is $2$ squares right and $3$ squares up. So the slope is $3/2$.'
          - problem: 'A line passes through the grid points $(5,2)$ and $(5,-2)$. What is its slope?'
            answer: 'undefined'
            answer_contract: {"kind": "label", "options": [["undefined", "the slope is undefined", "not defined", "no slope"], ["zero", "0", "the slope is zero"], ["positive", "a positive number"], ["negative", "a negative number"]]}
            visual: 1
            solution_sketch: 'The run from $(5,2)$ to $(5,-2)$ is $0$ and the vertical change is $4$ down. A run of $0$ would mean division by $0$, so the slope is undefined.'
          - problem: 'A segment joins $(0,-1)$ and $(4,1)$. Sam counts $4$ up and $2$ right. What is the correct slope?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            visual: 2
            solution_sketch: 'The segment goes $4$ squares right and $2$ up, so the rise is $2$ and the run is $4$. The slope is $2/4=1/2$.'
          - problem: 'On a map grid in kilometres, a straight road passes through $(2,1)$ and $(8,5)$. Find the slope of the road.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            visual: 3
            solution_sketch: 'From $(2,1)$ to $(8,5)$ the road goes $6$ right and $4$ up. The slope is $4/6=2/3$.'
          - problem: 'A line passes through the grid points $(-4,3)$ and $(2,-6)$. Find its slope.'
            answer: '-3/2'
            answer_contract: {"kind": "exact"}
            visual: 4
            solution_sketch: 'From $(-4,3)$ to $(2,-6)$ the line goes $6$ right and $9$ down. The slope is $-9/6=-3/2$.'
          - problem: 'A zip line is a straight segment through the grid points $(0,12)$ and $(30,0)$, measured in metres. Find its slope.'
            answer: '-2/5'
            answer_contract: {"kind": "exact"}
            visual: 5
            solution_sketch: 'From $(0,12)$ to $(30,0)$ the line goes $30$ right and $12$ down. The slope is $-12/30=-2/5$.'
          - problem: 'A horizontal line passes through the grid points $(-3,4)$ and $(5,4)$. What is its slope?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            visual: 6
            solution_sketch: 'The rise from $(-3,4)$ to $(5,4)$ is $0$ and the run is $8$. The slope is $0/8=0$.'
        constraints: 'lattice points close together; counting, not the formula; horizontal and vertical lines may appear'
    diagnostic_exemplar:
      problem: 'A graphed line passes through $(0, 4)$ and $(3, -2)$. What is the slope?'
      answer: "-2"
      solution_sketch: 'Rise over run: $\frac{-2 - 4}{3 - 0} = \frac{-6}{3} = -2$.'
    anki_seeds:
      - front: "Slope read from a graph = ___ over ___."
        back: "rise over run (vertical change over horizontal change)"
        type: basic

  - id: slope-from-two-points
    name: "Slope from Two Points"
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: numeric
    expected_time_secs: 70
    prerequisites:
      - id: slope-from-a-graph
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.6
        key: true
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Apply the slope formula"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Find the slope of the line through $(1,2)$ and $(3,8)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertical change is $8-2=6$ and the horizontal change is $3-1=2$. The slope is $6/2=3$.'
          - problem: 'A line passes through two points listed in a table: $x=-2$, $y=1$ in the first row and $x=1$, $y=7$ in the second. Find the slope of the line.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertical change is $7-1=6$ and the horizontal change is $1-(-2)=3$. The slope is $6/3=2$.'
          - problem: 'A taxi fare is €7 after $2$ km and €22 after $5$ km, and the fare graph is a straight line. By how many euros does the fare rise per kilometre?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fare rises by $22-7=15$ euros over $5-2=3$ kilometres. The rise per kilometre is $15/3=5$ euros.'
          - problem: 'A plant is $12$ cm tall after $3$ days and $40$ cm tall after $10$ days. Its growth is steady. How many centimetres does it grow per day?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The height changes by $40-12=28$ cm over $10-3=7$ days. The growth per day is $28/7=4$ cm.'
          - problem: 'Sam finds the slope through $(2,-1)$ and $(5,11)$ as $\frac{11-(-1)}{2-5}$. What is the correct slope?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam subtracts the points in different orders in the numerator and the denominator. The correct slope is $\frac{11-(-1)}{5-2}=12/3=4$.'
          - problem: 'A line passes through $(0,5)$. A second point is $6$ units to the right of it and $3$ units higher. Find the slope of the line.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The change from the first point to the second is $6$ in $x$ and $3$ in $y$. The slope is $3/6=1/2$.'
          - problem: 'Find the slope of the line through $(1,2)$ and $(5,3)$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertical change is $3-2=1$ and the horizontal change is $5-1=4$. The slope is $1/4$.'
        constraints: 'integer or fractional slopes; the second point is to the right of the first; points, tables, displacements or contexts'
      - id: kp2
        name: "Points with negative coordinates"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Find the slope of the line through $(-3,-5)$ and $(1,3)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertical change is $3-(-5)=8$ and the horizontal change is $1-(-3)=4$. The slope is $8/4=2$.'
          - problem: 'A line passes through two points listed in a table: $x=-4$, $y=2$ and $x=-1$, $y=-4$. Find the slope of the line.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertical change is $-4-2=-6$ and the horizontal change is $-1-(-4)=3$. The slope is $-6/3=-2$.'
          - problem: 'A submarine is at the height $-30$ m after $2$ minutes and at the height $-90$ m after $8$ minutes, relative to the sea surface. Its descent is steady. By how many metres per minute does its height change?'
            answer: '-10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The height changes by $-90-(-30)=-60$ metres over $8-2=6$ minutes. The change per minute is $-60/6=-10$ metres.'
          - problem: 'At 6 pm the temperature is $-4$ °C and at 10 pm it is $-16$ °C. It falls steadily. By how many degrees per hour does the temperature change?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The temperature changes by $-16-(-4)=-12$ degrees over $4$ hours. The change per hour is $-12/4=-3$ degrees.'
          - problem: 'Sam finds the slope through $(-5,-7)$ and $(-2,2)$ as $\frac{2-(-7)}{-5-(-2)}$. What is the correct slope?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam subtracts the points in different orders. The correct slope is $\frac{2-(-7)}{-2-(-5)}=9/3=3$.'
          - problem: 'Find the slope of the line through $(-6,4)$ and $(2,-8)$.'
            answer: '-3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertical change is $-8-4=-12$ and the horizontal change is $2-(-6)=8$. The slope is $-12/8=-3/2$.'
          - problem: 'A line passes through $(-2,-3)$. A second point is $6$ units to the right of it and $3$ units higher. Find the slope of the line.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second point is $(4,0)$. The change in $y$ is $3$ and the change in $x$ is $6$, so the slope is $3/6=1/2$.'
        constraints: 'watch subtraction of negatives; integer or fractional slopes'
      - id: kp3
        name: "Either order works"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Ana finds the slope through $(1,3)$ and $(4,9)$ as $\frac{9-3}{4-1}$. Ben subtracts in the opposite order and gets $\frac{3-9}{1-4}$. What slope does Ben get?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ben gets $\frac{3-9}{1-4}=\frac{-6}{-3}=2$. Reversing both differences changes both signs, so Ben gets the same slope as Ana.'
          - problem: 'Dia and Eli both find the slope of the line through $(-2,5)$ and $(2,-3)$. Dia calculates $\frac{-3-5}{2-(-2)}$ and Eli calculates $\frac{5-(-3)}{-2-2}$. What slope does Eli get?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Eli gets $\frac{5-(-3)}{-2-2}=\frac{8}{-4}=-2$. Dia gets $\frac{-8}{4}=-2$ as well, so the two orders agree.'
          - problem: 'Find the slope of the line through $(5,-2)$ and $(-1,-8)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertical change is $-8-(-2)=-6$ and the horizontal change is $-1-5=-6$. The slope is $-6/-6=1$, and the reverse order gives the same value.'
          - problem: 'Sam finds the slope through $(-3,-4)$ and $(1,8)$ as $\frac{8-(-4)}{-3-1}$. What is the correct slope?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam subtracts the points in different orders. The correct slope is $\frac{8-(-4)}{1-(-3)}=12/4=3$.'
          - problem: 'A cyclist keeps a log. It shows $30$ km travelled at the $5$ hour mark and $12$ km at the $2$ hour mark. Her speed is steady. What is her speed in kilometres per hour?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'Using the later point first, the change in distance is $12-30=-18$ and the change in time is $2-5=-3$. The speed is $-18/-3=6$ kilometres per hour.'
          - problem: 'Find the slope of the line through $(-1,7)$ and $(5,-8)$.'
            answer: '-5/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertical change is $-8-7=-15$ and the horizontal change is $5-(-1)=6$. The slope is $-15/6=-5/2$, and the reverse order gives the same value.'
          - problem: 'A shop makes a profit of $-8$ thousand euros after $2$ months and $20$ thousand euros after $6$ months. The profit changes steadily. By how many thousand euros per month does the profit change?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The profit changes by $20-(-8)=28$ thousand euros over $6-2=4$ months. The change per month is $28/4=7$ thousand euros.'
        constraints: 'consistent order in numerator and denominator; a reversed order gives the same slope'
    diagnostic_exemplar:
      problem: 'Find the slope of the line through $(-3, 5)$ and $(1, -3)$.'
      answer: '-2'
      solution_sketch: '$\frac{-3 - 5}{1 - (-3)} = \frac{-8}{4} = -2$.'
    anki_seeds:
      - front: "When using m = (y2 - y1)/(x2 - x1), the coordinates must be subtracted in the ___ order in numerator and denominator."
        back: "same order (swap both or neither)"
        type: basic

  - id: horizontal-vertical-slopes
    name: "Slopes of Horizontal and Vertical Lines"
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: slope-from-a-graph
        weight: 0.6
        key: true
      - id: coordinate-plane
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Horizontal lines have slope 0"
        key_prerequisites: [slope-from-a-graph]
        exemplars:
          - problem: 'Find the slope of the line through $(-5,8)$ and $(12,8)$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both points have $y=8$, so the rise is $8-8=0$. The run is $12-(-5)=17$, which is not zero, so the slope is $0/17=0$.'
          - problem: 'The line through $(2,4)$ and $(7,t)$ has slope zero. Find $t$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A slope of zero means the rise is zero, so the two $y$-coordinates are equal. The run is $7-2=5$, so only $t=4$ gives rise zero.'
          - problem: 'A horizontal line contains $(-3,-5)$ and $(6,t+2)$. Find $t$.'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On a horizontal line all points have the same $y$-coordinate, so $t+2=-5$. Subtract $2$ from both sides to get $t=-7$.'
          - problem: 'The point $(1,t-4)$ lies on the horizontal line $y=3$. Find $t$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every point on the line $y=3$ has $y$-coordinate $3$, so $t-4=3$. Add $4$ to both sides to get $t=7$.'
          - problem: 'On a railway profile, the horizontal axis shows distance in km and the vertical axis shows height in m. A level stretch of track passes through $(3,85)$ and $(11,3t-5)$. Find $t$.'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Level track has constant height, so $3t-5=85$. Then $3t=90$, and dividing both sides by $3$ gives $t=30$.'
          - problem: 'The water depth in a pool is $140$ cm at $2$ pm and $140$ cm at $5$ pm. What is the rate of change of the depth, in cm per hour?'
            answer: '0'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"cm/h","allow_omitted":true}
            solution_sketch: 'The depth changes by $140-140=0$ cm over $5-2=3$ hours. The rate is $0/3=0$ cm/h, the slope of a horizontal line.'
          - problem: 'Sam says the line through $(-2,5)$ and $(6,5)$ has undefined slope because the $y$-values do not change. What is the slope of this line?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rise is $5-5=0$ and the run is $6-(-2)=8$. Since the run is not zero, the slope is $0/8=0$, so the slope is defined.'
          - problem: 'A zero-slope line contains $(0,1/2)$ and $(9,2t)$. Find $t$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Zero slope means equal $y$-coordinates, so $2t=1/2$. Dividing both sides by $2$ gives $t=1/4$.'
        constraints: "equal y-coordinates; slope, missing coordinate and rate in context"
      - id: kp2
        name: "Vertical lines have undefined slope"
        key_prerequisites: [slope-from-a-graph]
        try_first:
          problem: 'Is there a number that equals $5$ divided by $0$?'
          answer_contract: {"kind":"label","options":[["yes","there is","yes there is"],["no","there is not","no there is not","no such number"]]}
          answer: 'no'
          reveal: 'Dividing by $0$ asks for a number that gives $5$ when multiplied by $0$, and none does. This is why a vertical line, which has run $0$, has no slope.'
        exemplars:
          - problem: 'What is the slope of the line through $(7,-3)$ and $(7,5)$?'
            answer: 'undefined'
