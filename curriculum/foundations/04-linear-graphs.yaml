        name: "Convert to standard form"
        key_prerequisites: [point-slope-form, multi-step-equations]
        exemplars:
          - problem: 'Write $y = 2x + 3$ in standard form. Use canonical standard form $Ax + By = C$ with integer coefficients and $A > 0$.'
            answer: "2x - y = -3"
            answer_contract: {"kind":"label","options":[["2x - y = -3"]]}
            solution_sketch: 'Move $2x$ left: $-2x + y = 3$, or $2x - y = -3$.'
          - problem: 'Write $y - 1 = \frac{1}{2}(x - 4)$ in standard form. Use canonical standard form $Ax + By = C$ with integer coefficients and $A > 0$.'
            answer: "x - 2y = 2"
            answer_contract: {"kind":"label","options":[["x - 2y = 2"]]}
            solution_sketch: '$y = \frac{1}{2}x - 1$; multiply by $2$: $2y = x - 2$, so $x - 2y = 2$.'
          - problem: 'Write $y = 3x + 2$ in standard form. Use canonical standard form $Ax + By = C$ with integer coefficients and $A > 0$.'
            answer: "3x - y = -2"
            answer_contract: {"kind":"label","options":[["3x - y = -2"]]}
            solution_sketch: 'Move $3x$ left: $-3x + y = 2$; multiply by $-1$ so $A > 0$: $3x - y = -2$.'
          - problem: 'Write $y - 3 = \frac{1}{2}(x - 2)$ in standard form. Use canonical standard form $Ax + By = C$ with integer coefficients and $A > 0$.'
            answer: "x - 2y = -4"
            answer_contract: {"kind":"label","options":[["x - 2y = -4"]]}
            solution_sketch: '$y = \frac{1}{2}x + 2$; multiply by $2$: $2y = x + 4$, so $x - 2y = -4$.'
        constraints: "standard form Ax + By = C with integer A, B, C"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Standard form to slope-intercept"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Write $3x + 2y = 12$ in slope-intercept form.'
            answer: "y = -3/2 x + 6"
            solution_sketch: '$2y = -3x + 12$; $y = -\frac{3}{2} x + 6$.'
          - problem: 'Find the slope of $4x - 5y = 20$.'
            answer: "4/5"
            solution_sketch: '$-5y = -4x + 20$; $y = \frac{4}{5}x - 4$.'
          - problem: 'Write $2x + 5y = 20$ in slope-intercept form.'
            answer: "y = -2/5 x + 4"
            solution_sketch: '$5y = -2x + 20$; $y = -\frac{2}{5}x + 4$.'
          - problem: 'Find the slope of $3x - 4y = 8$.'
            answer: "3/4"
            solution_sketch: '$-4y = -3x + 8$; $y = \frac{3}{4}x - 2$.'
        constraints: "isolate y; fractional slopes allowed"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."}]
        name: "Line through two points, in standard form"
        key_prerequisites: [point-slope-form]
        exemplars:
          - problem: 'Write the line through $(1, 2)$ and $(3, 8)$ in standard form. Use canonical standard form $Ax + By = C$ with integer coefficients and $A > 0$.'
            answer: "3x - y = 1"
            answer_contract: {"kind":"label","options":[["3x - y = 1"]]}
            solution_sketch: '$m = 3$; $y = 3x - 1$; move terms: $3x - y = 1$.'
          - problem: 'Write the line through $(2, 5)$ and $(4, 6)$ in standard form. Use canonical standard form $Ax + By = C$ with integer coefficients and $A > 0$.'
            answer: "x - 2y = -8"
            answer_contract: {"kind":"label","options":[["x - 2y = -8"]]}
            solution_sketch: '$m = \frac{1}{2}$; $y = \frac{1}{2}x + 4$; times $2$: $2y = x + 8$.'
          - problem: 'Write the line through $(2, 3)$ and $(4, 9)$ in standard form. Use canonical standard form $Ax + By = C$ with integer coefficients and $A > 0$.'
            answer: "3x - y = 3"
            answer_contract: {"kind":"label","options":[["3x - y = 3"]]}
            solution_sketch: '$m = 3$; $y = 3x - 3$; move terms: $3x - y = 3$.'
          - problem: 'Write the line through $(1, 4)$ and $(3, 5)$ in standard form. Use canonical standard form $Ax + By = C$ with integer coefficients and $A > 0$.'
            answer: "x - 2y = -7"
            answer_contract: {"kind":"label","options":[["x - 2y = -7"]]}
            solution_sketch: '$m = \frac{1}{2}$; $y = \frac{1}{2}x + \frac{7}{2}$; times $2$: $2y = x + 7$.'
        constraints: "clear fractions to get integer coefficients"
    diagnostic_exemplar:
      problem: 'Write the line through $(2, 1)$ and $(4, 7)$ in standard form $Ax + By = C$.'
      answer_contract: {kind: polynomial_relation}
      answer: '3x - y = 5'
