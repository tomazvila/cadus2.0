            answer: "(2,-1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Distribute to obtain $y-3=2x-4$, then add $3$ to isolate $y$."
          - problem: "Rewrite $y+2=-3(x+1)$ as $y=mx+b$. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(-3,-5)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Expansion gives $y+2=-3x-3$. Subtracting $2$ gives the constant $-5$."
          - problem: "Isolate $y$ and collect the constant in $y-4=(1/2)(x+6)$. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(1/2,7)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The product contributes $(1/2)x+3$; adding $4$ to both sides makes the constant $7$."
          - problem: "A conversion of $y+5=-2(x-3)$ produced $y=-2x-11$. Give the corrected slope-intercept equation. Enter the coefficients as $(m,b)$ for $y=mx+b$."
            answer: "(-2,1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The product $-2(x-3)$ is $-2x+6$. Subtract $5$, leaving constant $1$."
        constraints: "distribute then isolate y"
    diagnostic_exemplar:
