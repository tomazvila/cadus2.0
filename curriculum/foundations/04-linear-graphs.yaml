            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The change is $34-10=24$ km over $3-1=2$ h; $24/2=12$ km/h."
          - problem: "A tank falls from $80$ L at minute $2$ to $50$ L at minute $5$. Give the signed rate in L/min."
            answer: "-10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The volume change is $50-80=-30$ L over $5-2=3$ min, giving $-10$ L/min."
          - problem: "A table records seconds $4,7$ and distance metres $18,30$. Give the rate in m/s."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Divide the distance change $30-18=12$ m by elapsed time $7-4=3$ s, giving $4$ m/s."
          - problem: "A learner divides €26 by $4$ kg for purchases of $1$ kg costing €8 and $4$ kg costing €26. Find the increase in cost per added kg."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Use changes: $(26-8)/(4-1)=18/3=6$ euros per added kg."
        constraints: "state units; integer rates"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"5","label":"A"},{"x":"2","y":"-1","label":"B"}],"segments":[{"from":{"x":"-2","y":"5","label":null},"to":{"x":"2","y":"-1","label":null}}],"caption":"Reference example: The reference line has equation y = -(3/2)x + 2 The drawn segment joins the two reference points."}]
        name: "Interpret the sign of a rate"
        key_prerequisites: [slope]
        exemplars:
          - problem: 'A bank balance changes at $-15$ euros per week. Is the balance increasing or decreasing?'
            answer: "decreasing"
            solution_sketch: 'A negative rate means the balance falls — here by €15 each week.'
