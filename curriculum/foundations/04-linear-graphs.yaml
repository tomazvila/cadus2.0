            answer: "(2,4,3)"
            answer_contract: {"kind": "coordinates", "arity": 3}
            solution_sketch: "Match $y-y_1=m(x-x_1)$: the coefficient is $2$, and the subtracted coordinates are $4$ and $3$."
          - problem: "Read $(m,x_1,y_1)$ from $y+2=-3(x-1)$."
            answer: "(-3,1,-2)"
            answer_contract: {"kind": "coordinates", "arity": 3}
