unit: linear-graphs
course: foundations
module: "Linear Relationships"
topics:
  - id: plotting-points
    name: "Plotting Points"
    core: true
    difficulty: 0.20
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: number-line-integers
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"4","y":"2","label":"A"},{"x":"-4","y":"2","label":"B"},{"x":"-4","y":"-2","label":"C"},{"x":"4","y":"-2","label":"D"}],"segments":[],"caption":"Reference example: Four independent reference points illustrate the signs of coordinates around the origin."}]
        name: "Ordered pairs and the origin"
        key_prerequisites: []
        exemplars:
          - problem: 'Starting at the origin, you move $3$ right and $5$ up. Give the coordinates of where you land.'
            answer: "(3, 5)"
            solution_sketch: 'Right is positive $x$, up is positive $y$: $(3, 5)$.'
          - problem: 'In the ordered pair $(2, 7)$, which number is the x-coordinate?'
            answer: "2"
            solution_sketch: 'The first number of an ordered pair is the x-coordinate.'
          - problem: 'Starting at the origin, you move $5$ right and $2$ up. Give the coordinates of where you land.'
            answer: "(5, 2)"
            solution_sketch: 'Right is positive $x$, up is positive $y$: $(5, 2)$.'
          - problem: 'In the ordered pair $(6, 1)$, which number is the y-coordinate?'
            answer: "1"
            solution_sketch: 'The second number of an ordered pair is the y-coordinate.'
        constraints: "first quadrant; ordered pair (x, y), horizontal first"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"4","y":"2","label":"A"},{"x":"-4","y":"2","label":"B"},{"x":"-4","y":"-2","label":"C"},{"x":"4","y":"-2","label":"D"}],"segments":[],"caption":"Reference example: Four independent reference points illustrate the signs of coordinates around the origin."}]
        name: "Points with negative coordinates"
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Give the coordinates of the point $4$ units left and $3$ units up from the origin.'
            answer: "(-4, 3)"
            solution_sketch: 'Left makes $x$ negative; up makes $y$ positive.'
          - problem: 'To plot $(5, -2)$, you move $5$ right and then how far in which direction?'
            answer: "2 down"
            answer_contract: {"kind":"label","options":[["2 down"]]}
            solution_sketch: 'Right stays positive $x$; the second move is $2$ units down.'
          - problem: 'Give the coordinates of the point $3$ units left and $6$ units up from the origin.'
            answer: "(-3, 6)"
            solution_sketch: 'Left makes $x$ negative; up makes $y$ positive.'
          - problem: 'Give the coordinates of the point $2$ units right and $7$ units down from the origin.'
            answer: "(2, -7)"
            solution_sketch: 'Right makes $x$ positive; down makes $y$ negative.'
        constraints: "integer coordinates between -10 and 10; left/down are negative"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"4","y":"2","label":"A"},{"x":"-4","y":"2","label":"B"},{"x":"-4","y":"-2","label":"C"},{"x":"4","y":"-2","label":"D"}],"segments":[],"caption":"Reference example: Four independent reference points illustrate the signs of coordinates around the origin."}]
        name: "Points on the axes"
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Give the coordinates of the point on the x-axis that is $6$ units left of the origin.'
            answer: "(-6, 0)"
            solution_sketch: 'A point on the x-axis has $y = 0$.'
          - problem: 'A point lies on the y-axis $3$ units below the origin. Give its coordinates.'
            answer: "(0, -3)"
            solution_sketch: 'A point on the y-axis has $x = 0$.'
          - problem: 'Give the coordinates of the point on the x-axis that is $4$ units right of the origin.'
            answer: "(4, 0)"
            solution_sketch: 'A point on the x-axis has $y = 0$.'
          - problem: 'A point lies on the y-axis $5$ units above the origin. Give its coordinates.'
            answer: "(0, 5)"
            solution_sketch: 'A point on the y-axis has $x = 0$.'
        constraints: "one coordinate is always 0 for a point on an axis"
    diagnostic_exemplar:
      problem: 'Give the coordinates of the point on the x-axis $5$ units left of the origin.'
      answer: '(-5, 0)'
      solution_sketch: 'Left of the origin makes $x$ negative, and a point on the x-axis has $y = 0$.'
    anki_seeds:
      - front: "In an ordered pair (x, y), the first number gives the ___ position and the second the ___ position."
        back: "horizontal (x); vertical (y)"
        type: basic

  - id: coordinate-plane
    name: "The Coordinate Plane"
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: plotting-points
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
        key: true
      - id: place-value
        weight: 0.0
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"4","y":"2","label":"A"},{"x":"-4","y":"2","label":"B"},{"x":"-4","y":"-2","label":"C"},{"x":"4","y":"-2","label":"D"}],"segments":[],"caption":"Reference example: Four independent reference points illustrate the signs of coordinates around the origin."}]
        name: "Quadrants and axes"
        key_prerequisites: [plotting-points]
        exemplars:
          - problem: 'In which quadrant does the point $(-3, 5)$ lie?'
            answer: "II"
            answer_contract: {"kind":"label","options":[["II"]]}
            solution_sketch: 'Negative $x$, positive $y$ is quadrant II.'
          - problem: 'The point $(0, -6)$ lies on which axis?'
            answer: "the y-axis"
            answer_contract: {"kind":"label","options":[["the y-axis"]]}
            solution_sketch: 'An x-coordinate of $0$ places the point on the y-axis.'
          - problem: 'In which quadrant does the point $(-6, 2)$ lie?'
            answer: "II"
            answer_contract: {"kind":"label","options":[["II"]]}
            solution_sketch: 'Negative $x$, positive $y$ is quadrant II.'
          - problem: 'The point $(4, 0)$ lies on which axis?'
            answer: "the x-axis"
            answer_contract: {"kind":"label","options":[["the x-axis"]]}
            solution_sketch: 'A $y$-coordinate of $0$ places the point on the x-axis.'
        constraints: "quadrants numbered I-IV counterclockwise; points on an axis are in no quadrant"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"4","y":"2","label":"A"},{"x":"-4","y":"2","label":"B"},{"x":"-4","y":"-2","label":"C"},{"x":"4","y":"-2","label":"D"}],"segments":[],"caption":"Reference example: Four independent reference points illustrate the signs of coordinates around the origin."}]
        name: "Sign patterns and reflections"
        key_prerequisites: [plotting-points]
        exemplars:
          - problem: 'A point has a negative x-coordinate and a negative y-coordinate. Which quadrant is it in?'
            answer: "III"
            answer_contract: {"kind":"label","options":[["III"]]}
            solution_sketch: 'Negative $x$, negative $y$ is quadrant III.'
          - problem: 'Reflect $(3, -2)$ across the x-axis. Give the new coordinates.'
            answer: "(3, 2)"
            solution_sketch: 'Reflecting across the x-axis flips the sign of the y-coordinate.'
          - problem: 'A point has a positive x-coordinate and a negative y-coordinate. Which quadrant is it in?'
            answer: "IV"
            answer_contract: {"kind":"label","options":[["IV"]]}
            solution_sketch: 'Positive $x$, negative $y$ is quadrant IV.'
          - problem: 'Reflect $(4, -3)$ across the y-axis. Give the new coordinates.'
            answer: "(-4, -3)"
            solution_sketch: 'Reflecting across the y-axis flips the sign of the x-coordinate.'
        constraints: "reflections across one axis only; integer coordinates"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"1","y":"-4","label":"A"},{"x":"1","y":"2","label":"B"}],"segments":[{"from":{"x":"1","y":"-4","label":null},"to":{"x":"1","y":"2","label":null}}],"caption":"Reference example: Reference points A and B share x = 1; their vertical separation is 6 The drawn segment joins the two reference points."}]
        name: "Distance along a gridline"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'How far apart are $(2, 5)$ and $(2, -1)$?'
            answer: "6"
            solution_sketch: 'Same x, so distance is $|5 - (-1)| = 6$.'
          - problem: 'How far apart are $(-4, 3)$ and $(1, 3)$?'
            answer: "5"
            solution_sketch: 'Same y, so distance is $|-4 - 1| = 5$.'
          - problem: 'How far apart are $(3, 4)$ and $(3, -2)$?'
            answer: "6"
            solution_sketch: 'Same x, so distance is $|4 - (-2)| = 6$.'
          - problem: 'How far apart are $(-5, 2)$ and $(3, 2)$?'
            answer: "8"
            solution_sketch: 'Same y, so distance is $|-5 - 3| = 8$.'
        constraints: "points share an x- or y-coordinate; distance is a positive integer"
    diagnostic_exemplar:
      problem: 'Reflect the point $(-3, 4)$ across the x-axis. In which quadrant does the image lie?'
      answer_contract: {kind: label, options: [[I], [II], [III], [IV], ['x-axis'], ['y-axis']]}
      answer: 'III'
      solution_sketch: 'The image is $(-3, -4)$: both coordinates negative.'
    anki_seeds:
      - front: "The four quadrants by sign of (x, y), counterclockwise from top-right:"
        back: "I (+,+), II (-,+), III (-,-), IV (+,-)"
        type: basic

  - id: interpreting-graphs-qualitatively
    name: "Interpreting Graphs Qualitatively"
    core: false                # qualitative reading destination, terminal
    difficulty: 0.30
    drill: false
    # Every answer is a prose interpretation of a graph — SymPy can never adjudicate it.
    answer_kind: multi-step
    expected_time_secs: 75
    prerequisites:
      - id: coordinate-plane
        weight: 0.6
        key: true
      - id: number-line-integers
        weight: 0.2
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."},{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-4","y":"2","label":"A"},{"x":"4","y":"2","label":"B"}],"segments":[{"from":{"x":"-4","y":"2","label":null},"to":{"x":"4","y":"2","label":null}}],"caption":"Reference example: The reference horizontal line has equation y = 2 The drawn segment joins the two reference points."},{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"5","label":"A"},{"x":"2","y":"-1","label":"B"}],"segments":[{"from":{"x":"-2","y":"5","label":null},"to":{"x":"2","y":"-1","label":null}}],"caption":"Reference example: The reference line has equation y = -(3/2)x + 2 The drawn segment joins the two reference points."}]
        name: "Increasing, decreasing, constant"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A distance-time graph is horizontal from $t=2$ to $t=5$. Is the walker standing still, moving at a constant nonzero speed, or speeding up?'
            answer: "standing still (distance is not changing)"
            answer_contract: {"kind":"label","options":[["standing still","standing still (distance is not changing)"],["moving at constant nonzero speed","traveling at a constant speed"],["speeding up"]]}
            solution_sketch: 'A flat segment has zero slope, so the distance is not changing over that interval.'
          - problem: 'A temperature graph goes downward from left to right. Is the temperature increasing, decreasing, or constant?'
            answer: "decreasing"
            answer_contract: {"kind":"label","options":[["increasing"],["decreasing"],["constant"]]}
            solution_sketch: 'The graph falls left to right, so the temperature is decreasing.'
          - problem: 'A savings-account graph rises steadily from left to right. Is the amount saved increasing, decreasing, or constant?'
            answer: "increasing"
            answer_contract: {"kind":"label","options":[["increasing"],["decreasing"],["constant"]]}
            solution_sketch: 'The graph rises left to right, so the amount saved is increasing.'
          - problem: 'A car speed-time graph is flat at $60$ km/h from $t = 1$ to $t = 3$. Is the car stopped, traveling at a constant speed, or speeding up?'
            answer: "traveling at a constant speed (60 km/h, not changing)"
            answer_contract: {"kind":"label","options":[["stopped","standing still"],["traveling at a constant speed","traveling at a constant speed (60 km/h, not changing)"],["speeding up"]]}
            solution_sketch: 'A flat segment at $60$ means a constant nonzero speed.'
        constraints: "single-variable-vs-time stories; segments are clearly rising, flat, or falling"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."},{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-4","y":"2","label":"A"},{"x":"4","y":"2","label":"B"}],"segments":[{"from":{"x":"-4","y":"2","label":null},"to":{"x":"4","y":"2","label":null}}],"caption":"Reference example: The reference horizontal line has equation y = 2 The drawn segment joins the two reference points."},{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"5","label":"A"},{"x":"2","y":"-1","label":"B"}],"segments":[{"from":{"x":"-2","y":"5","label":null},"to":{"x":"2","y":"-1","label":null}}],"caption":"Reference example: The reference line has equation y = -(3/2)x + 2 The drawn segment joins the two reference points."}]
        name: "Read meaning from a point on a graph"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'On a cost-versus-items graph, $(4,10)$ is shown. Does it mean 4 items cost €10, 10 items cost €4, or each item costs €4?'
            answer: "4 items cost €10 in total"
            answer_contract: {"kind":"label","options":[["4 items cost \u20ac10","4 items cost \u20ac10 in total"],["10 items cost \u20ac4"],["each item costs \u20ac4"]]}
            solution_sketch: 'The point $(4, 10)$ pairs input $4$ with output $10$: $4$ items cost €$10$.'
          - problem: 'On a height-versus-time graph of a thrown ball, does the highest point show maximum height, starting height, or landing time?'
            answer: "the maximum height the ball reaches"
            answer_contract: {"kind":"label","options":[["maximum height","the maximum height the ball reaches"],["starting height"],["landing time"]]}
            solution_sketch: 'The highest point of a height graph marks the maximum height.'
          - problem: 'On a distance-versus-time graph, $(3, 12)$ is shown. Does it mean after 3 hours the hiker has walked 12 km, after 12 hours the hiker has walked 3 km, or the hiker walks 4 km per hour?'
            answer: "after 3 hours, the hiker has walked 12 km"
            answer_contract: {"kind":"label","options":[["after 3 hours, the hiker has walked 12 km"],["after 12 hours, the hiker has walked 3 km"],["the hiker walks 4 km per hour"]]}
            solution_sketch: 'The ordered pair gives time $3$ and distance $12$.'
          - problem: 'A profit graph crosses the horizontal axis. Does that crossing mark break-even, maximum profit, or starting cost?'
            answer: "the break-even point (zero profit)"
            answer_contract: {"kind":"label","options":[["break-even point","the break-even point (zero profit)"],["maximum profit"],["starting cost"]]}
            solution_sketch: 'On the horizontal axis the profit coordinate is zero.'
        constraints: "interpret one labeled point or feature; axes always named in the problem"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-2","label":"A"},{"x":"2","y":"4","label":"B"}],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}}],"caption":"Reference example: The reference line has equation y = (3/2)x + 1 The drawn segment joins the two reference points."},{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-4","y":"2","label":"A"},{"x":"4","y":"2","label":"B"}],"segments":[{"from":{"x":"-4","y":"2","label":null},"to":{"x":"4","y":"2","label":null}}],"caption":"Reference example: The reference horizontal line has equation y = 2 The drawn segment joins the two reference points."},{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"5","label":"A"},{"x":"2","y":"-1","label":"B"}],"segments":[{"from":{"x":"-2","y":"5","label":null},"to":{"x":"2","y":"-1","label":null}}],"caption":"Reference example: The reference line has equation y = -(3/2)x + 2 The drawn segment joins the two reference points."}]
        name: "Compare steepness"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Runner A and runner B start together, and A has the steeper distance-time line. Is runner A faster, runner B faster, or is their speed equal?'
            answer: "runner A"
            answer_contract: {"kind":"label","options":[["runner A"],["runner B"],["equal speed"]]}
            solution_sketch: 'A steeper line covers more distance in the same time, so runner A is faster.'
          - problem: 'A graph rises steeply at first and then gently. Was growth faster at the start, in the middle, or at the end?'
            answer: "at the start (the steep part)"
            answer_contract: {"kind":"label","options":[["at the start","at the start (the steep part)"],["in the middle"],["at the end"]]}
            solution_sketch: 'The steep part rises more per unit of time, so growth was faster at the start.'
          - problem: 'Account X and account Y start at €0, and X has the steeper line. Which has faster growth: account X, account Y, or equal growth?'
            answer: "account X"
            answer_contract: {"kind":"label","options":[["account X"],["account Y"],["equal growth"]]}
            solution_sketch: 'The steeper line has the greater rate.'
          - problem: 'A hiking graph is gentle in the first hour and steeper in the second. Was the hiker faster in the first hour, second hour, or both equally?'
            answer: "the second hour (the steep part)"
            answer_contract: {"kind":"label","options":[["the first hour","first hour"],["the second hour","the second hour (the steep part)"],["both hours equally"]]}
            solution_sketch: 'The steeper segment has the greater distance per hour.'
        constraints: "steeper means faster change; no slope computation required"
    diagnostic_exemplar:
      problem: 'A distance-time graph rises steeply, then rises gently, then is flat. Rank the three parts from fastest to slowest movement.'
      answer_contract: {kind: list, ordered: true, member: {kind: label, options: [[steep], [gentle], [flat]]}}
      answer: 'steep, gentle, flat'
      solution_sketch: 'Steeper means faster; a flat segment means the distance is not changing.'
    anki_seeds:
      - front: "On a quantity-vs-time graph: a rising segment means the quantity is ___, flat means ___, falling means ___."
        back: "increasing; constant; decreasing"
        type: basic

  - id: constant-of-proportionality
    name: "The Constant of Proportionality"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: ratios-proportions
        weight: 0.7
        key: true
      - id: dividing-fractions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Find k from one pair"
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: '$y$ is proportional to $x$, and $y = 18$ when $x = 6$. Find the constant $k$.'
            answer: "3"
            solution_sketch: '$k = \frac{y}{x} = \frac{18}{6} = 3$.'
          - problem: '$y$ is proportional to $x$, and $y = 10$ when $x = 4$. Find $k$.'
            answer: "2.5"
            solution_sketch: '$k = \frac{10}{4} = 2.5$.'
          - problem: '$y$ is proportional to $x$, and $y = 24$ when $x = 8$. Find the constant $k$.'
            answer: "3"
            solution_sketch: '$k = \frac{24}{8} = 3$.'
          - problem: '$y$ is proportional to $x$, and $y = 15$ when $x = 4$. Find $k$.'
            answer: "3.75"
            solution_sketch: '$k = \frac{15}{4} = 3.75$.'
        constraints: "k = y/x; k may be a simple fraction or decimal"
      - id: kp2
        name: "Find k from a table"
        key_prerequisites: [ratios-proportions]
        exemplars:
          - problem: 'The table $(2, 5)$, $(4, 10)$, $(6, 15)$ is proportional. What is $k$?'
            answer: "2.5"
            solution_sketch: 'Any row gives $k$: $\frac{5}{2} = 2.5$.'
          - problem: 'The table $(3, 12)$, $(5, 20)$ is proportional. What is $k$?'
            answer: "4"
            solution_sketch: '$\frac{12}{3} = 4$.'
          - problem: 'The table $(3, 6)$, $(6, 12)$, $(9, 18)$ is proportional. What is $k$?'
            answer: "2"
            solution_sketch: 'Any row gives $k$: $\frac{6}{3} = 2$.'
          - problem: 'The table $(2, 9)$, $(4, 18)$ is proportional. What is $k$?'
            answer: "4.5"
            solution_sketch: '$\frac{9}{2} = 4.5$.'
        constraints: "every row gives the same y/x ratio"
      - id: kp3
        name: "k as a unit rate"
        key_prerequisites: [dividing-fractions]
        exemplars:
          - problem: '$3$ kilograms of apples cost €7.50. What is the price per kilogram, in euros?'
            answer: "2.50"
            solution_sketch: '$7.50 \div 3 = 2.50$.'
          - problem: 'A car travels $120$ kilometres in $3$ hours at constant speed. What is its unit rate, in km per hour?'
            answer: "40"
            solution_sketch: '$120 \div 3 = 40$.'
          - problem: '$4$ kilograms of pears cost €9. What is the price per kilogram, in euros?'
            answer: "2.25"
            solution_sketch: '$9 \div 4 = 2.25$.'
          - problem: 'A car travels $150$ kilometres in $2$ hours at constant speed. What is its unit rate, in km per hour?'
            answer: "75"
            solution_sketch: '$150 \div 2 = 75$.'
        constraints: "one quantity per one unit of the other; clean division"
    diagnostic_exemplar:
      problem: '$4$ kilograms of cheese cost €30. What is the price per kilogram, in euros?'
      answer: '7.50'
      solution_sketch: '$k = \frac{30}{4} = 7.5$.'
    anki_seeds:
      - front: "For a proportional relationship y = kx, the constant of proportionality k equals:"
        back: "y/x (the unit rate: y per one unit of x)"
        type: basic

  - id: proportional-relationships
    name: "Proportional Relationships"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: numeric
    expected_time_secs: 80
    prerequisites:
      - id: constant-of-proportionality
        weight: 0.7
        key: true
      - id: ratios-proportions
        weight: 0.4
      - id: coordinate-plane
        weight: 0.3
      - id: dividing-fractions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Write and use the equation y = kx"
        key_prerequisites: [constant-of-proportionality]
        exemplars:
          - problem: '$y$ is proportional to $x$ with $k = 2.5$. Find $y$ when $x = 6$.'
            answer: "15"
            solution_sketch: '$y = 2.5(6) = 15$.'
          - problem: 'A proportional relationship passes through $(3, 21)$. Its equation is $y = kx$. Find $k$.'
            answer: "7"
            solution_sketch: '$k = \frac{21}{3} = 7$, so the equation is $y = 7x$.'
          - problem: '$y$ is proportional to $x$ with $k = 3.5$. Find $y$ when $x = 4$.'
            answer: "14"
            solution_sketch: '$y = 3.5(4) = 14$.'
          - problem: 'A proportional relationship passes through $(4, 32)$. Its equation is $y = kx$. Find $k$.'
            answer: "8"
            solution_sketch: '$k = \frac{32}{4} = 8$.'
        constraints: "equation form y = kx"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"-6","label":"A"},{"x":"2","y":"6","label":"B"}],"segments":[{"from":{"x":"-2","y":"-6","label":null},"to":{"x":"2","y":"6","label":null}}],"caption":"Reference example: The reference proportional line has equation y = 3x The drawn segment joins the two reference points."}]
        name: "Recognize proportionality from tables and graphs"
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'A proportional graph passes through the origin and $(1, 4)$. Find $y$ when $x = 9$.'
            answer: "36"
            solution_sketch: '$k = 4$, so $y = 4(9) = 36$.'
          - problem: 'Is the table $(1, 3)$, $(2, 6)$, $(3, 10)$ proportional?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$\frac{3}{1} = \frac{6}{2} = 3$ but $\frac{10}{3} \ne 3$.'
          - problem: 'A proportional graph passes through the origin and $(2, 5)$. Find $y$ when $x = 8$.'
            answer: "20"
            solution_sketch: '$k = 2.5$, so $y = 2.5(8) = 20$.'
          - problem: 'Is the table $(2, 6)$, $(4, 12)$, $(5, 16)$ proportional?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$\frac{6}{2} = \frac{12}{4} = 3$ but $\frac{16}{5} \ne 3$.'
        constraints: "proportional graphs are straight lines through the origin; tables have constant y/x"
      - id: kp3
        name: "Solve for either variable"
        key_prerequisites: [constant-of-proportionality]
        exemplars:
          - problem: '$y$ is proportional to $x$, and $y = 20$ when $x = 4$. Find $x$ when $y = 45$.'
            answer: "9"
            solution_sketch: '$k = 5$; $45 = 5x$ gives $x = 9$.'
          - problem: 'Earnings follow $y = 6x$ euros for $x$ hours. How many hours to earn €90?'
            answer: "15"
            solution_sketch: '$90 = 6x$; $x = 15$.'
          - problem: '$y$ is proportional to $x$, and $y = 24$ when $x = 6$. Find $x$ when $y = 60$.'
            answer: "15"
            solution_sketch: '$k = 4$; $60 = 4x$ gives $x = 15$.'
          - problem: 'Earnings follow $y = 9x$ euros for $x$ hours. How many hours to earn €108?'
            answer: "12"
            solution_sketch: '$108 = 9x$; $x = 12$.'
        constraints: "find k first, then solve; integer or half-integer answers"
    diagnostic_exemplar:
      problem: '$y$ is proportional to $x$, and $y = 18$ when $x = 4$. Find $x$ when $y = 63$.'
      answer: '14'
      solution_sketch: '$k = \frac{18}{4} = 4.5$; then $x = \frac{63}{4.5} = 14$.'
    anki_seeds:
      - front: "A proportional relationship has the form y = ___ and its graph is a line through the ___."
        back: "y = kx; the origin (k is the constant of proportionality / unit rate)"
        type: basic

