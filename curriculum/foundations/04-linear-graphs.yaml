            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Slopes $\frac{4}{2} = 2$ and $\frac{6}{3} = 2$ match.'
          - problem: 'Which line is steeper: through $(0, 0)$ and $(2, 7)$, or through $(0, 0)$ and $(3, 9)$? Give the steeper line''s slope.'
            answer: "7/2"
            solution_sketch: 'Slopes $\frac{7}{2} = 3.5$ vs $3$; the line through $(2, 7)$ is steeper.'
          - problem: 'Are $(0, 2)$, $(3, 8)$, and $(5, 12)$ collinear?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Slopes $\frac{6}{3} = 2$ and $\frac{4}{2} = 2$ match.'
          - problem: 'Which line is steeper: through $(0, 0)$ and $(3, 8)$, or through $(0, 0)$ and $(4, 9)$? Give the steeper slope.'
            answer: "8/3"
            solution_sketch: 'Slopes $\frac{8}{3} \approx 2.67$ vs $\frac{9}{4} = 2.25$.'
        constraints: "compare or chain two slope computations"
