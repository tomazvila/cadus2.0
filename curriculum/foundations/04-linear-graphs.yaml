unit: linear-graphs
course: foundations
module: "Linear Relationships"
topics:
  - id: plotting-points
    name: "Plotting Points"
    core: true
    difficulty: 0.20
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: number-line-integers
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: 'Ordered pairs and the origin'
        key_prerequisites: []
        exemplars:
          - problem: 'A robot starts at the origin and moves $3$ units to the right and $5$ units up. What are its coordinates?'
            answer: '(3,5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The origin is $(0,0)$. Moving $3$ units right makes the horizontal coordinate $3$, and moving $5$ units up makes the vertical coordinate $5$, so the robot is at $(3,5)$.'
          - problem: 'A marker is at $(2,4)$. It moves $3$ units up. Where is it now?'
            answer: '(2,7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Moving up changes only the vertical coordinate, so the horizontal coordinate stays $2$. The new height is $4+3=7$, so the marker is at $(2,7)$.'
          - problem: 'On a game board, a treasure lies in column $6$ and row $1$. Columns are counted to the right of the origin and rows are counted upward from it. What are the coordinates of the treasure?'
            answer: '(6,1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The column counts steps to the right, so it is the horizontal coordinate $6$. The row counts steps up, so it is the vertical coordinate $1$, and the treasure is at $(6,1)$.'
          - problem: 'A robot leaves $(0,0)$, goes $2$ units right, then $4$ units up, then $3$ more units right. Where does it stop?'
            answer: '(5,4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Both moves to the right change the horizontal coordinate, which becomes $2+3=5$. The only move up gives the vertical coordinate $4$, so the robot stops at $(5,4)$.'
          - problem: 'A drone hovers at $(3,2)$ on a map grid. It flies $6$ units right and $4$ units up. What are its new coordinates?'
            answer: '(9,6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The move right adds to the horizontal coordinate: $3+6=9$. The move up adds to the vertical coordinate: $2+4=6$, so the drone is at $(9,6)$.'
          - problem: 'A beetle crawls along a grid line from $(1,2)$ to $(7,2)$. How many units to the right does it move?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The vertical coordinate stays $2$, so the beetle moves only to the right. The distance is the change in the horizontal coordinate, $7-1=6$ units.'
          - problem: 'Sam plots the point that is $5$ units right and $8$ units up as $(8,5)$. What is the correct ordered pair?'
            answer: '(5,8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The horizontal coordinate is written first. Five units right gives $5$ and eight units up gives $8$, so the ordered pair is $(5,8)$, not $(8,5)$.'
          - problem: 'A crane hook hangs at $(8,3)$ on a site plan. It must be raised to the point $(8,10)$. How many units up must it move?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The horizontal coordinate stays $8$, so the hook moves only up. The change in the vertical coordinate is $10-3=7$ units.'
        constraints: 'first quadrant; ordered pair (x, y), horizontal first'
      - id: kp2
        name: 'Points with negative coordinates'
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'A point is $4$ units to the left of the origin and $3$ units up. What are its coordinates?'
            answer: '(-4,3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Left is the negative horizontal direction, so the horizontal coordinate is $-4$. Up is positive, so the vertical coordinate is $3$ and the point is $(-4,3)$.'
          - problem: 'A point lies where the vertical line $x=6$ meets the horizontal line $y=-2$. What are its coordinates?'
            answer: '(6,-2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Every point on the line $x=6$ has horizontal coordinate $6$. Every point on the line $y=-2$ has vertical coordinate $-2$, so they meet at $(6,-2)$.'
          - problem: 'On a map the harbor is at the origin, east is to the right, north is up and one unit is $1$ km. A lighthouse stands $7$ km west and $5$ km south of the harbor. What are the coordinates of the lighthouse?'
            answer: '(-7,-5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'West is to the left, so the horizontal coordinate is $-7$. South is down, so the vertical coordinate is $-5$, and the lighthouse is at $(-7,-5)$.'
          - problem: 'A marker starts at $(0,0)$. It moves $2$ units right, then $6$ units left, then $8$ units down. Where does it stop?'
            answer: '(-4,-8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The horizontal moves combine to $2-6=-4$. The only vertical move is $8$ down, which gives $-8$, so the marker stops at $(-4,-8)$.'
          - problem: 'A game piece stands on $(-3,-2)$. It moves $5$ squares right and $6$ squares up. What are its new coordinates?'
            answer: '(2,4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Add each move to its own coordinate. The horizontal coordinate becomes $-3+5=2$ and the vertical coordinate becomes $-2+6=4$, so the piece is at $(2,4)$.'
          - problem: 'A drone is at $(2,-5)$. It flies $6$ units left and $9$ units up. What are its new coordinates?'
            answer: '(-4,4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A move left subtracts from the horizontal coordinate: $2-6=-4$. A move up adds to the vertical coordinate: $-5+9=4$, so the drone is at $(-4,4)$.'
          - problem: 'Mia plots the point that is $3$ units left and $5$ units down as $(3,5)$. What are the correct coordinates?'
            answer: '(-3,-5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Left makes the horizontal coordinate negative and down makes the vertical coordinate negative. The point is $(-3,-5)$, not $(3,5)$.'
        constraints: 'integer coordinates between -10 and 10; left/down are negative'
      - id: kp3
        name: 'Points on the axes'
        key_prerequisites: [number-line-integers]
        try_first:
          problem: 'A point lies on the horizontal axis, $4$ units to the right of the origin. How many units above the axis is it?'
          answer_contract: {"kind":"exact"}
          answer: '0'
          reveal: 'The point is on the axis, so it is neither above nor below it: its vertical coordinate is $0$ and the point is $(4,0)$. Every point on the horizontal axis has vertical coordinate $0$.'
        exemplars:
          - problem: 'What are the coordinates of the point on the $x$-axis that is $6$ units to the left of the origin?'
            answer: '(-6,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A point on the x-axis has vertical coordinate $0$. Left of the origin makes the horizontal coordinate negative, so the point is $(-6,0)$.'
          - problem: 'A point lies on the $y$-axis, $3$ units below the origin. What are its coordinates?'
            answer: '(0,-3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A point on the y-axis has horizontal coordinate $0$. Below the origin makes the vertical coordinate negative, so the point is $(0,-3)$.'
          - problem: 'A lift runs up and down the $y$-axis of a building plan. The ground floor is the origin and one unit is one floor. The lift stops $4$ floors below ground. What are its coordinates?'
            answer: '(0,-4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The lift moves only along the y-axis, so its horizontal coordinate is $0$. Four floors below ground gives the vertical coordinate $-4$, so the lift is at $(0,-4)$.'
          - problem: 'A train runs along the $x$-axis of a map. The station is at the origin, east is to the right and one unit is $1$ km. The train is $5$ km east of the station. Where is the train?'
            answer: '(5,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The train stays on the x-axis, so its vertical coordinate is $0$. East is to the right, so the horizontal coordinate is $5$ and the train is at $(5,0)$.'
          - problem: 'On which axis does the point $(0,-7)$ lie?'
            answer: 'y-axis'
            answer_contract: {"kind": "label", "options": [["x-axis", "x axis", "the x-axis", "on the x-axis", "horizontal axis", "the horizontal axis", "on the x axis", "the x axis"], ["y-axis", "y axis", "the y-axis", "on the y-axis", "vertical axis", "the vertical axis", "on the y axis", "the y axis"]]}
            solution_sketch: 'The horizontal coordinate is $0$, so the point has no sideways distance from the vertical axis. A point with $x=0$ lies on the y-axis.'
          - problem: 'A point on a map is at $(9,0)$. Does it lie on the $x$-axis or on the $y$-axis?'
            answer: 'x-axis'
            answer_contract: {"kind": "label", "options": [["x-axis", "x axis", "the x-axis", "on the x-axis", "horizontal axis", "the horizontal axis", "on the x axis", "the x axis"], ["y-axis", "y axis", "the y-axis", "on the y-axis", "vertical axis", "the vertical axis", "on the y axis", "the y axis"]]}
            solution_sketch: 'The vertical coordinate is $0$, so the point has no height above the horizontal axis. A point with $y=0$ lies on the x-axis.'
          - problem: 'A point on the $x$-axis has the same horizontal coordinate as the point $(-7,5)$. What are its coordinates?'
            answer: '(-7,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The point keeps the horizontal coordinate $-7$. It is on the x-axis, so its vertical coordinate is $0$ and the point is $(-7,0)$.'
          - problem: 'A point on the $y$-axis is at the same height as the point $(6,-9)$. What are its coordinates?'
            answer: '(0,-9)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The point keeps the height $-9$. It is on the y-axis, so its horizontal coordinate is $0$ and the point is $(0,-9)$.'
        constraints: 'one coordinate is always 0 for a point on an axis'
    diagnostic_exemplar:
      problem: 'Give the coordinates of the point on the x-axis $5$ units left of the origin.'
      answer: '(-5, 0)'
      solution_sketch: 'Left of the origin makes $x$ negative, and a point on the x-axis has $y = 0$.'
    anki_seeds:
      - front: "In an ordered pair (x, y), the first number gives the ___ position and the second the ___ position."
        back: "horizontal (x); vertical (y)"
        type: basic

  - id: coordinate-plane
    name: "The Coordinate Plane"
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: plotting-points
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
        key: true
      - id: place-value
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: 'Quadrants and axes'
        key_prerequisites: [plotting-points]
        exemplars:
          - problem: 'In which quadrant does the point $(-4,-3)$ lie?'
            answer: 'quadrant III'
            answer_contract: {"kind": "label", "options": [["quadrant I", "I", "1", "first quadrant", "1st quadrant", "quadrant 1", "in quadrant I", "the first quadrant"], ["quadrant II", "II", "2", "second quadrant", "2nd quadrant", "quadrant 2", "in quadrant II", "the second quadrant"], ["quadrant III", "III", "3", "third quadrant", "3rd quadrant", "quadrant 3", "in quadrant III", "the third quadrant"], ["quadrant IV", "IV", "4", "fourth quadrant", "4th quadrant", "quadrant 4", "in quadrant IV", "the fourth quadrant"], ["x-axis", "x axis", "the x-axis", "on the x-axis", "horizontal axis", "the horizontal axis", "on the x axis", "the x axis"], ["y-axis", "y axis", "the y-axis", "on the y-axis", "vertical axis", "the vertical axis", "on the y axis", "the y axis"], ["origin", "the origin", "at the origin"]]}
            solution_sketch: 'Both coordinates are negative, which is the sign pattern $(-,-)$. That pattern belongs to quadrant III, the lower-left region.'
          - problem: 'A point in Quadrant II is $3$ units from the $y$-axis and $5$ units from the $x$-axis. What are its coordinates?'
            answer: '(-3,5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Quadrant II is up and to the left, so $x$ is negative and $y$ is positive. The distance $3$ from the y-axis gives $x=-3$, and the distance $5$ from the x-axis gives $y=5$.'
          - problem: 'The point $(-5,k)$ lies in Quadrant III. Give a possible integer value of $k$.'
            answer: '-3'
            answer_contract: {"kind": "property", "check": "integer_in_range", "args": {"max": -1}}
            solution_sketch: 'Quadrant III has both coordinates negative. The horizontal coordinate $-5$ is already negative, so $k$ must be a negative integer, for example $-3$.'
          - problem: 'On a map the town hall is at the origin, east is to the right and north is up, and one unit is $1$ km. A fishing hut is $4$ km east and $6$ km south of the town hall. What are the coordinates of the hut?'
            answer: '(4,-6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'East is to the right, so the horizontal coordinate is $4$. South is down, so the vertical coordinate is $-6$, and the hut is at $(4,-6)$ in the lower-right region, quadrant IV.'
          - problem: 'A point lies on an axis, so it is in no quadrant. Its $x$-coordinate is $-5$. What are its coordinates?'
            answer: '(-5,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A point with a nonzero $x$-coordinate that lies on an axis must be on the x-axis. Its $y$-coordinate is $0$, so the point is $(-5,0)$.'
          - problem: 'In which quadrant, or on which axis, does the point $(0,-6)$ lie?'
            answer: 'y-axis'
            answer_contract: {"kind": "label", "options": [["quadrant I", "I", "1", "first quadrant", "1st quadrant", "quadrant 1", "in quadrant I", "the first quadrant"], ["quadrant II", "II", "2", "second quadrant", "2nd quadrant", "quadrant 2", "in quadrant II", "the second quadrant"], ["quadrant III", "III", "3", "third quadrant", "3rd quadrant", "quadrant 3", "in quadrant III", "the third quadrant"], ["quadrant IV", "IV", "4", "fourth quadrant", "4th quadrant", "quadrant 4", "in quadrant IV", "the fourth quadrant"], ["x-axis", "x axis", "the x-axis", "on the x-axis", "horizontal axis", "the horizontal axis", "on the x axis", "the x axis"], ["y-axis", "y axis", "the y-axis", "on the y-axis", "vertical axis", "the vertical axis", "on the y axis", "the y axis"], ["origin", "the origin", "at the origin"]]}
            solution_sketch: 'The horizontal coordinate is $0$, so the point is on the vertical axis and in no quadrant. The vertical coordinate $-6$ puts it $6$ units below the origin on the y-axis.'
          - problem: 'The point $(h,-2)$ lies in Quadrant IV. Give a possible integer value of $h$.'
            answer: '4'
            answer_contract: {"kind": "property", "check": "integer_in_range", "args": {"min": 1}}
            solution_sketch: 'Quadrant IV has a positive $x$-coordinate and a negative $y$-coordinate. The vertical coordinate $-2$ is negative, so $h$ must be a positive integer, for example $4$.'
          - problem: 'On a map the town hall is at the origin, east is to the right and north is up, and one unit is one block. A bakery lies north-west of the hall, $5$ blocks from the north-south street (the $y$-axis) and $2$ blocks from the east-west street (the $x$-axis). What are the coordinates of the bakery?'
            answer: '(-5,2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'North-west means left and up, so $x$ is negative and $y$ is positive. The distance $5$ from the y-axis gives $x=-5$ and the distance $2$ from the x-axis gives $y=2$.'
        constraints: 'quadrants numbered I-IV counterclockwise; points on an axis are in no quadrant'
      - id: kp2
        name: 'Sign patterns and reflections'
        key_prerequisites: [plotting-points]
        exemplars:
          - problem: 'Reflect the point $(3,-5)$ across the $x$-axis. What are the coordinates of its image?'
            answer: '(3,5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Reflection across the x-axis keeps the horizontal coordinate $3$ and changes the sign of the vertical coordinate. The image is $(3,5)$.'
          - problem: 'Reflect the point $(-4,2)$ across the $y$-axis. What are the coordinates of its image?'
            answer: '(4,2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Reflection across the y-axis changes the sign of the horizontal coordinate and keeps the vertical coordinate $2$. The image is $(4,2)$.'
          - problem: 'On a map a river flows north to south along the $y$-axis. A tree stands at $(6,3)$. A pond lies at the mirror image of the tree in the river. What are the coordinates of the pond?'
            answer: '(-6,3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The river is the y-axis, so the pond is the same distance from the river on the other side. The height $3$ stays and the horizontal coordinate becomes $-6$.'
          - problem: 'Dev reflects $(-2,-7)$ across the $x$-axis by changing both signs and gets $(2,7)$. What is the correct image?'
            answer: '(-2,7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Reflection across the x-axis changes only the vertical coordinate. The horizontal coordinate stays $-2$ and $-7$ becomes $7$, so the image is $(-2,7)$.'
          - problem: 'After a reflection across the $x$-axis, a point has the image $(5,-8)$. What were the coordinates of the original point?'
            answer: '(5,8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Reflecting the image across the x-axis again gives back the original point. The horizontal coordinate $5$ stays and $-8$ becomes $8$, so the original point is $(5,8)$.'
          - problem: 'The tip of a pole is at $(4,6)$ on a diagram in which the surface of a lake is the $x$-axis. Where is the tip of its reflection in the water?'
            answer: '(4,-6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The reflection is the same distance below the water as the tip is above it. The horizontal coordinate $4$ stays and the height $6$ becomes $-6$, so the reflected tip is at $(4,-6)$.'
          - problem: 'The point $(-3,4)$ is reflected across the $y$-axis. In which quadrant is the image?'
            answer: 'quadrant I'
            answer_contract: {"kind": "label", "options": [["quadrant I", "I", "1", "first quadrant", "1st quadrant", "quadrant 1", "in quadrant I", "the first quadrant"], ["quadrant II", "II", "2", "second quadrant", "2nd quadrant", "quadrant 2", "in quadrant II", "the second quadrant"], ["quadrant III", "III", "3", "third quadrant", "3rd quadrant", "quadrant 3", "in quadrant III", "the third quadrant"], ["quadrant IV", "IV", "4", "fourth quadrant", "4th quadrant", "quadrant 4", "in quadrant IV", "the fourth quadrant"], ["x-axis", "x axis", "the x-axis", "on the x-axis", "horizontal axis", "the horizontal axis", "on the x axis", "the x axis"], ["y-axis", "y axis", "the y-axis", "on the y-axis", "vertical axis", "the vertical axis", "on the y axis", "the y axis"], ["origin", "the origin", "at the origin"]]}
            solution_sketch: 'The image is $(3,4)$, because the horizontal coordinate changes sign. Both coordinates are positive, so the image is in quadrant I.'
          - problem: 'The point $(-5,2)$ is reflected across the $x$-axis and then across the $y$-axis. What are the coordinates of the final image?'
            answer: '(5,-2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The first reflection gives $(-5,-2)$ and the second reflection gives $(5,-2)$. Each reflection changes the sign of one coordinate, so both signs change in the end.'
        constraints: 'reflections across one axis only; integer coordinates'
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-3","x_max":"5","y_min":"0","y_max":"2","x_tick":"1","y_tick":"1","points":[{"x":"-3","y":"2"},{"x":"5","y":"2"}],"segments":[{"from":{"x":"-3","y":"2","label":null},"to":{"x":"5","y":"2","label":null}}],"caption":"A coordinate grid with the segment between the two points the problem gives."},{"kind":"coordinate","x_min":"0","x_max":"8","y_min":"0","y_max":"6","x_tick":"1","y_tick":"1","points":[{"x":"8","y":"6"},{"x":"2","y":"6"}],"segments":[{"from":{"x":"8","y":"6","label":null},"to":{"x":"2","y":"6","label":null}}],"caption":"A coordinate grid with the segment between the two points the problem gives."},{"kind":"coordinate","x_min":"-2","x_max":"0","y_min":"-3","y_max":"6","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"6"},{"x":"-2","y":"-3"}],"segments":[{"from":{"x":"-2","y":"6","label":null},"to":{"x":"-2","y":"-3","label":null}}],"caption":"A coordinate grid with the segment between the two points the problem gives."},{"kind":"coordinate","x_min":"0","x_max":"1","y_min":"-6","y_max":"5","x_tick":"1","y_tick":"1","points":[{"x":"1","y":"5"},{"x":"1","y":"-6"}],"segments":[{"from":{"x":"1","y":"5","label":null},"to":{"x":"1","y":"-6","label":null}}],"caption":"A coordinate grid with the segment between the two points the problem gives."},{"kind":"coordinate","x_min":"-6","x_max":"4","y_min":"-2","y_max":"0","x_tick":"1","y_tick":"1","points":[{"x":"-6","y":"-2"},{"x":"4","y":"-2"}],"segments":[{"from":{"x":"-6","y":"-2","label":null},"to":{"x":"4","y":"-2","label":null}}],"caption":"A coordinate grid with the segment between the two points the problem gives."},{"kind":"coordinate","x_min":"0","x_max":"7","y_min":"0","y_max":"4","x_tick":"1","y_tick":"1","points":[{"x":"1","y":"1"},{"x":"7","y":"1"},{"x":"7","y":"4"},{"x":"1","y":"4"}],"segments":[{"from":{"x":"1","y":"1","label":null},"to":{"x":"7","y":"1","label":null}},{"from":{"x":"7","y":"1","label":null},"to":{"x":"7","y":"4","label":null}},{"from":{"x":"7","y":"4","label":null},"to":{"x":"1","y":"4","label":null}},{"from":{"x":"1","y":"4","label":null},"to":{"x":"1","y":"1","label":null}}],"caption":"A coordinate grid with the four corners of the rectangle and its sides."}]
        name: 'Distance along a gridline'
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'How far apart are the points $(-3,2)$ and $(5,2)$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            visual: 0
            solution_sketch: 'The points share the vertical coordinate $2$, so they lie on one horizontal line. The distance is the difference of the horizontal coordinates, $5-(-3)=8$.'
          - problem: 'On a building plan, a lift shaft runs along the vertical line $x=2$. The lift travels from level $-4$ (the basement) up to level $3$. How many levels does it travel?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The horizontal coordinate stays $2$, so the lift moves along a vertical line. The distance is $3-(-4)=7$ levels.'
          - problem: 'A horizontal segment lies at height $6$. Its endpoints have $x$-coordinates $8$ and $2$. How long is the segment?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            visual: 1
            solution_sketch: 'A distance is never negative, so subtract the smaller coordinate from the larger one. The length is $8-2=6$.'
          - problem: 'On a map, one grid unit is $1$ km. A village is at $(-2,6)$ and a lake is at $(-2,-3)$. How far is the village from the lake?'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            visual: 2
            solution_sketch: 'The points share the horizontal coordinate $-2$, so the distance is the difference of the heights. It is $6-(-3)=9$ units, which is $9$ km.'
          - problem: 'Tara says that the distance from $(1,5)$ to $(1,-6)$ is $-11$, because $-6-5=-11$. What is the correct distance?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            visual: 3
            solution_sketch: 'A distance is never negative. Tara subtracted in one direction, but the length of the gap is the larger height minus the smaller one, $5-(-6)=11$.'
          - problem: 'A hiker walks due east from $(-6,-2)$ to $(4,-2)$ on a map where one unit is $1$ km. How far does the hiker walk?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            visual: 4
            solution_sketch: 'The vertical coordinate stays $-2$, so the hiker walks along a horizontal line. The distance is $4-(-6)=10$ units, which is $10$ km.'
          - problem: 'A rectangle has corners at $(1,1)$, $(7,1)$, $(7,4)$ and $(1,4)$. What is its perimeter?'
            answer: '18'
            answer_contract: {"kind":"exact"}
            visual: 5
            solution_sketch: 'The horizontal sides have length $7-1=6$ and the vertical sides have length $4-1=3$. The perimeter is $2(6+3)=18$.'
          - problem: 'The points $(a,5)$ and $(2,5)$ are $4$ units apart, and $a$ is greater than $2$. What is $a$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The points are on one horizontal line, so their distance is $a-2$. Setting $a-2=4$ gives $a=6$, which is greater than $2$.'
        constraints: 'points share an x- or y-coordinate; distance is a positive integer'
    diagnostic_exemplar:
      problem: 'Reflect the point $(-3, 4)$ across the x-axis. In which quadrant does the image lie?'
      answer_contract: {kind: label, options: [[I], [II], [III], [IV], ['x-axis'], ['y-axis']]}
      answer: 'III'
      solution_sketch: 'The image is $(-3, -4)$: both coordinates negative.'
    anki_seeds:
      - front: "The four quadrants by sign of (x, y), counterclockwise from top-right:"
        back: "I (+,+), II (-,+), III (-,-), IV (+,-)"
        type: basic

