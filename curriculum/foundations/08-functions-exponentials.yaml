unit: functions-exponentials
course: foundations
module: "Functions & Exponentials"
topics:
  - id: identifying-functions-vertical-line-test
    name: Identifying Functions and the Vertical Line Test
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: coordinate-plane
        weight: 0.7
        key: true
      - id: evaluating-expressions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: One output per input
        key_prerequisites: [coordinate-plane]
        constraints: "small finite relations (3-4 ordered pairs) with integer coordinates"
        exemplars:
          - problem: 'Is the relation $\{(1,2), (2,3), (3,4)\}$ a function?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Every input appears exactly once.'
          - problem: 'Is the relation $\{(1,2), (1,5), (3,4)\}$ a function?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The input $1$ has two different outputs.'
          - problem: 'Is the relation $\{(0,7), (2,7), (4,7)\}$ a function?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Repeated outputs are fine; repeated inputs are not.'
      - id: kp2
        name: The vertical line test
        key_prerequisites: [coordinate-plane]
        constraints: "graphs described in words or by an equation (line, parabola, circle, sideways parabola); the answer is yes or no"
        exemplars:
          - problem: 'A graph is a circle of radius $3$ centered at the origin. Is it the graph of a function?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'A vertical line such as $x = 0$ crosses it twice.'
          - problem: 'Is the line $y = 2x + 1$ the graph of a function?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
          - problem: 'The graph of $x = y^2$ is a sideways parabola. Is it the graph of a function?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The vertical line $x = 4$ hits it at $y = 2$ and $y = -2$.'
    diagnostic_exemplar:
      problem: 'The graph of $x^2 + y^2 = 25$ is a circle of radius $5$ centred at the origin. Is it the graph of a function?'
      answer_contract: {kind: label, options: [[yes], [no]]}
      answer: "no"
      solution_sketch: 'The vertical line $x = 0$ meets the circle at $(0, 5)$ and $(0, -5)$ — two outputs for one input.'
    anki_seeds:
      - front: "A relation is a function when..."
        back: "every input has exactly one output."
        type: basic
      - front: "Vertical line test: a graph shows a function if..."
        back: "no vertical line crosses the graph more than once."
        type: basic

  - id: evaluating-functions
    name: Evaluating Functions
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: evaluating-expressions
        weight: 0.8
        key: true
      - id: integer-multiplication-division
        weight: 0.4
      - id: identifying-functions-vertical-line-test
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Evaluate f(x) at a positive input
        key_prerequisites: [evaluating-expressions]
        constraints: "linear and simple quadratic rules; integer inputs 1-9; integer outputs"
        exemplars:
          - problem: 'If $f(x) = 2x + 3$, find $f(4)$.'
            answer: "11"
            solution_sketch: '$2(4) + 3 = 11$.'
          - problem: 'If $g(x) = x^2 - 1$, find $g(3)$.'
            answer: "8"
      - id: kp2
        name: Function values from a table
        key_prerequisites: [identifying-functions-vertical-line-test]
        constraints: "tables of 3 input-output pairs with integer entries; look up one value, or add two table values"
        exemplars:
          - problem: 'A table gives $f(1) = 5$, $f(2) = 7$, $f(3) = 9$. Find $f(2)$.'
            answer: "7"
          - problem: 'Using the same table ($f(1) = 5$, $f(2) = 7$, $f(3) = 9$), compute $f(3) + f(1)$.'
            answer: "14"
      - id: kp3
        name: Evaluate at negative inputs
        key_prerequisites: [evaluating-expressions, integer-multiplication-division]
        constraints: "linear and simple quadratic rules; integer inputs -1 to -5; integer outputs"
        exemplars:
          - problem: 'If $f(x) = x^2 - 2x$, find $f(-3)$.'
            answer: "15"
            solution_sketch: '$9 - (-6) = 15$.'
          - problem: 'If $h(x) = 3x - 5$, find $h(-2)$.'
            answer: "-11"
    diagnostic_exemplar:
      problem: 'If $f(x) = x^2 - 4x$, find $f(-2)$.'
      answer: "12"
      solution_sketch: '$(-2)^2 - 4(-2) = 4 + 8 = 12$; the subtracted term turns positive.'
    anki_seeds:
      - front: "f(4) means..."
        back: "the output of f when the input is 4."
        type: basic

  - id: function-notation
    name: Function Notation
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: evaluating-functions
        weight: 0.8
        key: true
      - id: one-step-equations
        weight: 0.4
      - id: square-roots
        weight: 0.3
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Solve f(x) = value for a linear rule
        key_prerequisites: [one-step-equations, evaluating-functions]
        constraints: "linear rules with small integer coefficients; integer solutions 1-9"
        exemplars:
          - problem: 'If $f(x) = 2x + 1$, find $x$ when $f(x) = 9$.'
            answer: "4"
            solution_sketch: '$2x + 1 = 9$; $2x = 8$; $x = 4$.'
          - problem: 'If $f(x) = 3x - 2$, find $x$ when $f(x) = 13$.'
            answer: "5"
            solution_sketch: '$3x - 2 = 13$; $3x = 15$; $x = 5$.'
      - id: kp2
        name: Solve f(x) = value with squares
        key_prerequisites: [square-roots]
        constraints: "rules of the form x^2 + c with perfect-square targets; the problem says which of the two solutions to give"
        exemplars:
          - problem: 'If $f(x) = x^2$, the equation $f(x) = 16$ has two solutions. Give the negative one.'
            answer: "-4"
            solution_sketch: '$x^2 = 16$ gives $x = 4$ or $x = -4$.'
          - problem: 'If $f(x) = x^2 + 1$, the equation $f(x) = 10$ has two solutions. Give the positive one.'
            answer: "3"
            solution_sketch: '$x^2 = 9$ gives $x = 3$ or $x = -3$.'
      - id: kp3
        name: Evaluate at expression inputs
        key_prerequisites: [evaluating-functions]
        constraints: "inputs like 2a or a+2; linear rules only"
        exemplars:
          - problem: 'If $f(x) = 3x + 1$, find $f(2a)$.'
            answer: "6a + 1"
          - problem: 'If $f(x) = x + 5$, find $f(a + 2)$.'
            answer: "a + 7"
    diagnostic_exemplar:
      problem: 'If $f(x) = x^2 + 1$ and $f(2a) = 17$, find the positive value of $a$.'
      answer: "2"
      solution_sketch: 'Substitute the whole input: $(2a)^2 + 1 = 17$, so $4a^2 = 16$.'
    anki_seeds:
      - front: "Solving f(x) = k means..."
        back: "finding the input(s) x whose output is k."
        type: basic

  - id: reading-function-graphs
    name: Reading Function Graphs
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: coordinate-plane
        weight: 0.6
        key: true
      - id: identifying-functions-vertical-line-test
        weight: 0.5
      - id: function-notation
        weight: 0.4
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"0","y":"-2","label":"A"},{"x":"2","y":"3","label":"B"},{"x":"5","y":"3","label":"C"}],"segments":[],"caption":"Reference example: Three independent reference points of a relation are shown. No curve or connecting segment is asserted."}]
        name: Read f(a) from points on a graph
        key_prerequisites: [coordinate-plane]
        constraints: "graphs described by listed lattice points"
        exemplars:
          - problem: 'The graph of $f$ passes through $(2, 5)$ and $(4, 9)$. Find $f(2)$.'
            answer: "5"
          - problem: 'The graph of $f$ passes through $(-1, 3)$. Find $f(-1)$.'
            answer: "3"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"0","y":"-2","label":"A"},{"x":"2","y":"3","label":"B"},{"x":"5","y":"3","label":"C"}],"segments":[],"caption":"Reference example: Three independent reference points of a relation are shown. No curve or connecting segment is asserted."}]
        name: Find inputs where f(x) = k
        key_prerequisites: [function-notation]
        constraints: "graphs described by 3 listed lattice points; when two inputs share an output the problem says which to give"
        exemplars:
          - problem: 'The graph of $f$ passes through $(1, 4)$, $(3, 4)$, and $(5, 2)$. Two inputs give $f(x) = 4$; give the larger one.'
            answer: "3"
            solution_sketch: 'Both $(1, 4)$ and $(3, 4)$ have output $4$; the larger input is $3$.'
          - problem: 'For the same graph (through $(1,4)$, $(3,4)$, $(5,2)$), solve $f(x) = 2$.'
            answer: "5"
            solution_sketch: 'Only $(5, 2)$ has output $2$.'
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"0","y":"-2","label":"A"},{"x":"2","y":"3","label":"B"},{"x":"5","y":"3","label":"C"}],"segments":[],"caption":"Reference example: Three independent reference points of a relation are shown. No curve or connecting segment is asserted."}]
        name: Intercepts as function values
        key_prerequisites: [coordinate-plane]
        constraints: "intercepts given as lattice points; f(0) from the y-intercept, solutions of f(x) = 0 from the x-intercepts"
        exemplars:
          - problem: 'The graph of $f$ crosses the $y$-axis at $(0, 3)$. Find $f(0)$.'
            answer: "3"
          - problem: 'The graph of $f$ crosses the $x$-axis at $(-2, 0)$ and $(4, 0)$. Solving $f(x) = 0$ gives two inputs; give the negative one.'
            answer: "-2"
            solution_sketch: 'The x-intercepts are exactly the inputs with output $0$.'
    diagnostic_exemplar:
      problem: 'The graph of $f$ crosses the $x$-axis at $(-5, 0)$ and at $(1, 0)$. Solving $f(x) = 0$ gives two inputs; give the larger one.'
      answer: "1"
      solution_sketch: 'The $x$-intercepts are exactly the solutions of $f(x) = 0$, namely $-5$ and $1$.'
    anki_seeds:
      - front: "On the graph of f, the point (a, b) means..."
        back: "f(a) = b."
        type: basic

  - id: domain-range-of-relations
    name: Domain and Range of Relations
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: identifying-functions-vertical-line-test
        weight: 0.6
        key: true
      - id: reading-function-graphs
        weight: 0.4
      - id: coordinate-plane
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Domain and range of finite sets of pairs
        key_prerequisites: [identifying-functions-vertical-line-test]
        constraints: "3-4 ordered pairs, integer coordinates"
        exemplars:
          - problem: 'State the domain of the relation $\{(1,2), (3,4), (5,6)\}$.'
            answer: "{1, 3, 5}"
          - problem: 'State the range of the relation $\{(0,2), (1,2), (2,5)\}$.'
            answer: "{2, 5}"
            solution_sketch: 'List each output once.'
      - id: kp2
        name: Domain and range from a table
        key_prerequisites: [identifying-functions-vertical-line-test]
        constraints: "tables of 3 input-output pairs with integer entries; answers are sets in braces with repeats removed"
        exemplars:
          - problem: 'A table gives $f(2) = 1$, $f(4) = 3$, $f(6) = 3$. State the domain of $f$.'
            answer: "{2, 4, 6}"
          - problem: 'For the same table ($f(2)=1$, $f(4)=3$, $f(6)=3$), state the range.'
            answer: "{1, 3}"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"-3","y":"-2","label":"A"},{"x":"4","y":"5","label":"B"}],"segments":[{"from":{"x":"-3","y":"-2","label":null},"to":{"x":"4","y":"5","label":null}}],"caption":"Reference example: The reference relation is precisely the closed segment from A = (-3,-2) to B = (4,5) The drawn segment joins the two reference points."}]
        name: Domain and range from a described graph
        key_prerequisites: [reading-function-graphs, coordinate-plane]
        constraints: "the graph is a single segment given by its two endpoints; answers are inequalities such as -1 ≤ x ≤ 3"
        exemplars:
          - problem: 'The graph of $f$ is a segment from $(-1, 2)$ to $(3, 6)$. State the domain.'
            answer: "-1 ≤ x ≤ 3"
          - problem: 'For the same segment from $(-1, 2)$ to $(3, 6)$, state the range.'
            answer: "2 ≤ y ≤ 6"
    diagnostic_exemplar:
      problem: 'The graph of $f$ is the segment from $(-2, 1)$ to $(4, 7)$. State the range of $f$.'
      answer: "1 ≤ y ≤ 7"
      solution_sketch: 'The range is the set of $y$-values; along the segment $y$ runs from $1$ up to $7$.'
    anki_seeds:
      - front: "The domain of a relation is..."
        back: "the set of all inputs (x-values)."
        type: basic
      - front: "The range of a relation is..."
        back: "the set of all outputs (y-values)."
        type: basic

  - id: domain-range
    name: Domain and Range
    core: true
    difficulty: 0.55
    drill: false
    # Every answer describes a SET ("all real numbers", "all real numbers except x = 3",
    # "x >= 2"), which the SymPy override cannot parse or compare; the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: domain-range-of-relations
        weight: 0.7
        key: true
      - id: function-notation
        weight: 0.5
      - id: linear-inequalities
        weight: 0.4
      - id: square-roots
        weight: 0.3
      - id: compound-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Domains that are all real numbers
        key_prerequisites: [domain-range-of-relations, function-notation]
        constraints: "linear or quadratic rules with no denominator and no radical; the answer is always all real numbers"
        exemplars:
          - problem: 'State the domain of $f(x) = 2x + 5$.'
            answer: "all real numbers"
          - problem: 'State the domain of $f(x) = x^2 - 3x$.'
            answer: "all real numbers"
            solution_sketch: 'Polynomials accept every real input.'
      - id: kp2
        name: Domain restrictions from denominators and square roots
        key_prerequisites: [square-roots, linear-inequalities]
        constraints: "one restriction only: a linear denominator, or a square root of a linear expression; integer boundary values"
        exemplars:
          - problem: 'State the domain of $f(x) = \frac{1}{x - 3}$.'
            answer: "all real numbers except x = 3"
            solution_sketch: 'Denominator cannot be $0$.'
          - problem: 'State the domain of $f(x) = \sqrt{x - 2}$.'
            answer: "x ≥ 2"
          - problem: 'State the domain of $f(x) = \sqrt{5 - x}$.'
            answer: "x ≤ 5"
      - id: kp3
        name: Range of simple quadratics
        key_prerequisites: [function-notation]
        constraints: "quadratics of the form x^2 + c or -x^2 + c, vertex on the y-axis; answers are y ≥ c or y ≤ c"
        exemplars:
          - problem: 'State the range of $f(x) = x^2 + 1$.'
            answer: "y ≥ 1"
            solution_sketch: 'Minimum at $x = 0$ gives $y = 1$.'
          - problem: 'State the range of $f(x) = -x^2 + 4$.'
            answer: "y ≤ 4"
    diagnostic_exemplar:
      problem: 'State the domain and the range of $f(x) = \sqrt{x - 3}$.'
      answer_contract: {kind: multipart, parts: [{name: domain, contract: {kind: exact}}, {name: range, contract: {kind: exact}}]}
      answer: "domain = x >= 3; range = y >= 0"
      solution_sketch: 'The radicand must be non-negative, so $x - 3 \ge 0$; a square root itself never returns a negative value.'
    anki_seeds:
      - front: "Two restrictions to check when finding a domain:"
        back: "denominators must be nonzero; square-root radicands must be ≥ 0."
        type: basic
      - front: "The domain of any polynomial function is..."
        back: "all real numbers."
        type: basic
      - front: "The range of a parabola f(x) = x² + k (opening up) is..."
        back: "y ≥ k (all outputs from the vertex's y-value upward)."
        type: basic

  - id: function-operations
    name: Operations on Functions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: function-notation
        weight: 0.7
        key: true
      - id: polynomial-addition-subtraction
        weight: 0.5
      - id: polynomial-multiplication
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Sum and difference of functions
        key_prerequisites: [function-notation, polynomial-addition-subtraction]
        constraints: "linear f and g with small integer coefficients"
        exemplars:
          - problem: 'If $f(x) = 2x + 1$ and $g(x) = x - 4$, find $(f + g)(x)$.'
            answer: "3x - 3"
          - problem: 'If $f(x) = 2x + 1$ and $g(x) = x - 4$, find $(f - g)(x)$.'
            answer: "x + 5"
            solution_sketch: '$(2x + 1) - (x - 4) = x + 5$.'
      - id: kp2
        name: Product of functions
        key_prerequisites: [polynomial-multiplication]
        constraints: "a monomial times a linear binomial, or two linear binomials; small integer coefficients; expand the product"
        exemplars:
          - problem: 'If $f(x) = x$ and $g(x) = x + 3$, find $(fg)(x)$.'
            answer: "x^2 + 3x"
          - problem: 'If $f(x) = 2x$ and $g(x) = 3x - 1$, find $(fg)(x)$.'
            answer: "6x^2 - 2x"
      - id: kp3
        name: Evaluate a combined function at a point
        key_prerequisites: [function-notation]
        constraints: "f and g are a monomial and a simple quadratic; evaluate the combined function at a small positive integer"
        exemplars:
          - problem: 'If $f(x) = x^2$ and $g(x) = 2x$, find $(f + g)(3)$.'
            answer: "15"
            solution_sketch: '$9 + 6 = 15$.'
          - problem: 'If $f(x) = x^2$ and $g(x) = 2x$, find $(fg)(2)$.'
            answer: "16"
    diagnostic_exemplar:
      problem: 'If $f(x) = 2x - 1$ and $g(x) = x + 3$, find $(fg)(x)$.'
      answer: "2x^2 + 5x - 3"
      solution_sketch: '$(fg)(x)$ is the product: $(2x - 1)(x + 3) = 2x^2 + 6x - x - 3$.'
    anki_seeds:
      - front: "(f + g)(x) = ?"
        back: "f(x) + g(x)"
        type: basic

  - id: evaluating-composite-functions
    name: Evaluating Composite Functions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: function-notation
        weight: 0.8
        key: true
      - id: evaluating-functions
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Numeric composition, inside first
        key_prerequisites: [function-notation, evaluating-functions]
        constraints: "linear rules; integer intermediate values"
        exemplars:
          - problem: 'If $f(x) = x + 2$ and $g(x) = 3x$, find $f(g(2))$.'
            answer: "8"
            solution_sketch: '$g(2) = 6$; $f(6) = 8$.'
          - problem: 'If $f(x) = 2x$ and $g(x) = x - 1$, find $g(f(3))$.'
            answer: "5"
      - id: kp2
        name: Order matters numerically
        key_prerequisites: [evaluating-functions]
        constraints: "one linear rule and one squaring rule; the same pair asked in both orders so the two answers differ"
        exemplars:
          - problem: 'If $f(x) = x^2$ and $g(x) = x + 1$, find $f(g(2))$.'
            answer: "9"
            solution_sketch: '$g(2) = 3$; $f(3) = 9$.'
          - problem: 'If $f(x) = x^2$ and $g(x) = x + 1$, find $g(f(2))$.'
            answer: "5"
      - id: kp3
        name: Composition from tables
        key_prerequisites: [function-notation]
        constraints: "tables supply only the values needed; inner value first, then outer; integer entries"
        exemplars:
          - problem: 'Tables give $g(3) = 2$ and $f(1) = 4$, $f(2) = 6$. Find $f(g(3))$.'
            answer: "6"
          - problem: 'Tables give $f(2) = 3$ and $g(3) = 7$, $g(2) = 1$. Find $g(f(2))$.'
            answer: "7"
    diagnostic_exemplar:
      problem: 'If $f(x) = x^2$ and $g(x) = x + 3$, find $f(g(1)) - g(f(1))$.'
      answer: "12"
      solution_sketch: 'Inside first: $f(g(1)) = f(4) = 16$ and $g(f(1)) = g(1) = 4$.'
    anki_seeds:
      - front: "To evaluate f(g(a))..."
        back: "compute g(a) first, then apply f to the result."
        type: basic

  - id: function-composition
    name: Composition of Functions
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: evaluating-composite-functions
        weight: 0.8
        key: true
      - id: polynomial-multiplication
        weight: 0.4
      - id: combining-like-terms
        weight: 0.4
      - id: function-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Symbolic composition of linear functions
        key_prerequisites: [evaluating-composite-functions]
        constraints: "both rules linear with small integer coefficients; the answer is linear"
        exemplars:
          - problem: 'If $f(x) = x + 1$ and $g(x) = 2x$, find $f(g(x))$.'
            answer: "2x + 1"
          - problem: 'If $f(x) = 3x$ and $g(x) = x - 2$, find $f(g(x))$.'
            answer: "3x - 6"
      - id: kp2
        name: Composition with squaring
        key_prerequisites: [polynomial-multiplication]
        constraints: "one rule is a squaring rule; expand the resulting perfect-square trinomial"
        exemplars:
          - problem: 'If $f(x) = x^2$ and $g(x) = x + 3$, find $f(g(x))$.'
            answer: "x^2 + 6x + 9"
          - problem: 'If $f(x) = 2x - 1$ and $g(x) = x^2$, find $g(f(x))$.'
            answer: "4x^2 - 4x + 1"
            solution_sketch: '$(2x-1)^2 = 4x^2 - 4x + 1$.'
      - id: kp3
        name: Order matters (g(f(x)) vs f(g(x)))
        key_prerequisites: [combining-like-terms]
        constraints: "both rules linear; ask the same pair in both orders so that f(g(x)) and g(f(x)) differ"
        exemplars:
          - problem: 'If $f(x) = x - 4$ and $g(x) = 3x + 1$, find $g(f(x))$.'
            answer: "3x - 11"
          - problem: 'If $f(x) = x - 4$ and $g(x) = 3x + 1$, find $f(g(x))$.'
            answer: "3x - 3"
            solution_sketch: '$(3x + 1) - 4 = 3x - 3$; note it differs from $g(f(x))$.'
    diagnostic_exemplar:
      problem: 'If $f(x) = x + 2$ and $g(x) = x^2 - 3$, find $g(f(x))$.'
      answer: "x^2 + 4x + 1"
      solution_sketch: 'Feed $f$ into $g$: $(x + 2)^2 - 3 = x^2 + 4x + 4 - 3$.'
    anki_seeds:
      - front: "In general, f(g(x)) and g(f(x)) are..."
        back: "different functions — composition is not commutative."
        type: basic

