  - id: domain-range
    name: Domain and Range
    core: true
    difficulty: 0.55
    drill: false
    # Every answer describes a SET ("all real numbers", "all real numbers except x = 3",
    # "x >= 2"), which the SymPy override cannot parse or compare; the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: domain-range-of-relations
        weight: 0.7
        key: true
      - id: function-notation
        weight: 0.5
      - id: linear-inequalities
        weight: 0.4
      - id: square-roots
        weight: 0.3
      - id: compound-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Domains that are all real numbers
        key_prerequisites: [domain-range-of-relations, function-notation]
        constraints: 'polynomial rules (linear, quadratic, cubic) and rules with a constant denominator; the domain is all real numbers; items also evaluate the rule at negative inputs, some in a context'
        exemplars:
          - problem: 'State the domain of the function $f(x)=2x^2-7x+4$.'
            answer: 'all real numbers'
            answer_contract: {"kind": "label", "options": [["all real numbers", "every real number", "all reals", "any real number", "(-∞, ∞)", "(-∞,∞)", "R", "all x"], ["nonnegative real numbers", "x ≥ 0", "positive real numbers", "x > 0", "whole numbers", "all real numbers except 0", "x ≠ 0", "integers"]]}
            solution_sketch: 'The rule uses only multiplication, subtraction and a square. These are defined for every real input, so no number is excluded and the domain is all real numbers.'
          - problem: 'The temperature in degrees Fahrenheit is $F(C)=1.8C+32$, where $C$ is the temperature in degrees Celsius. Find $F(-40)$.'
            answer: '-40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A linear rule is defined for negative inputs too. Substitute $C=-40$: $1.8(-40)+32=-72+32=-40$, so $F(-40)=-40$.'
          - problem: 'Which of the functions $p(x)=\frac{1}{x+1}$, $q(x)=x^2+1$ and $r(x)=\sqrt{x}$ is defined for every real number $x$?'
            answer: 'q'
            answer_contract: {"kind": "label", "options": [["p", "p(x)", "1/(x+1)"], ["q", "q(x)", "x^2+1", "x²+1"], ["r", "r(x)", "sqrt(x)", "√x"]]}
            solution_sketch: 'The function $p$ fails at $x=-1$ because the denominator would be zero. The function $r$ fails for negative $x$ because a real square root needs a nonnegative radicand, so only $q$ is defined everywhere.'
          - problem: 'The balance in an account is modelled by $B(m)=250-40m$ dollars, where $m$ is the number of months after today. What was the balance $3$ months before today?'
            answer: '370'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'A linear rule accepts negative inputs, and $m=-3$ means three months before today. Then $B(-3)=250-40(-3)=250+120=370$.'
          - problem: 'The function is $f(x)=x^2-9$. What is $f(-5)$?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A polynomial is defined for every real input, so $x=-5$ is allowed. Substitute: $f(-5)=(-5)^2-9=25-9=16$.'
          - problem: 'A program evaluates the function $f(x)=x^3-4x$. What output does it give for the input $-10$?'
            answer: '-960'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every real number is an allowed input of a polynomial, so the program returns a value. Then $f(-10)=(-10)^3-4(-10)=-1000+40=-960$.'
      - id: kp2
        name: Domain restrictions from denominators and square roots
        key_prerequisites: [square-roots, linear-inequalities]
        constraints: 'one restriction only: a linear denominator, or a square root of a linear expression; integer boundary values; some items come from a context'
        try_first:
          problem: 'Can $x=2$ be used as an input of $f(x)=\frac{5}{x-2}$?'
          answer_contract: {"kind": "label", "options": [["no", "it cannot", "cannot", "no it cannot", "not allowed", "it is undefined", "undefined"], ["yes", "it can", "can", "yes it can", "allowed", "it is defined", "defined"]]}
          answer: 'no'
          reveal: 'At $x=2$ the denominator is $2-2=0$, and division by zero has no value. Every domain restriction in this lesson comes from a zero denominator or a negative radicand.'
        exemplars:
          - problem: 'State the domain of $f(x)=\frac{1}{x-3}$.'
            answer: 'all real numbers except 3'
            answer_contract: {"kind": "label", "options": [["all real numbers except 3", "x ≠ 3", "x != 3", "x<3 or x>3", "(-∞,3)∪(3,∞)", "(-∞, 3) ∪ (3, ∞)", "all reals except 3", "every real number except 3"], ["all real numbers", "x ≥ 3", "x > 3", "x ≤ 3", "x < 3", "x = 3", "only 3", "x ≠ 0"]]}
            solution_sketch: 'The denominator $x-3$ must not be zero, and it is zero only when $x=3$. Every other real number is allowed, so the domain is all real numbers except $3$.'
          - problem: 'State the domain of $f(x)=\sqrt{x-2}$.'
            answer: 'x ≥ 2'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'A real square root needs a nonnegative radicand, so $x-2\ge0$. Adding $2$ gives $x\ge2$, and the boundary $2$ is allowed because $\sqrt{0}=0$.'
          - problem: 'State the domain of $f(x)=\sqrt{18-2x}$.'
            answer: 'x ≤ 9'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The radicand must satisfy $18-2x\ge0$, so $-2x\ge-18$. Dividing by $-2$ reverses the comparison and gives $x\le9$.'
          - problem: 'A prize of $240$ dollars is shared equally among $n$ winners, so each winner gets $p(n)=\frac{240}{n}$ dollars. For which value of $n$ is the formula undefined?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The formula divides by $n$, and division by zero is undefined. So $n=0$ is the one excluded value, which also makes sense: nobody can share the prize with zero winners.'
          - problem: 'What is the domain of $f(x)=\frac{1}{x+4}$?'
            answer: 'all real numbers except -4'
            answer_contract: {"kind": "label", "options": [["all real numbers except -4", "x ≠ -4", "x != -4", "x<-4 or x>-4", "x < -4 or x > -4", "all reals except -4", "every real number except -4", "(-∞,-4)∪(-4,∞)"], ["all real numbers", "x ≠ 4", "all real numbers except 4", "x ≥ -4", "x > -4", "x ≤ -4", "x < -4", "x ≠ 0"]]}
            solution_sketch: 'The denominator $x+4$ is zero when $x=-4$, not when $x=4$. So the excluded value is $-4$ and the domain is all real numbers except $-4$.'
          - problem: 'A farmer fences a square plot after setting aside a $16$ square metre shed. The side length of the plot is $s(A)=\sqrt{A-16}$ metres, where $A$ is the total area in square metres. State the domain of this formula.'
            answer: 'A ≥ 16'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The radicand $A-16$ must be nonnegative, so $A\ge16$. A total area below $16$ square metres would not even cover the shed.'
          - problem: 'Find the value of $x$ that is not in the domain of $f(x)=\frac{5}{2x-8}$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The denominator $2x-8$ is zero when $2x=8$, that is, when $x=4$. So $x=4$ is the one value outside the domain.'
          - problem: 'State the domain of $g(x)=\sqrt{3x+12}$.'
            answer: 'x ≥ -4'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The radicand must satisfy $3x+12\ge0$, so $3x\ge-12$. Dividing by $3$ keeps the comparison and gives $x\ge-4$.'
      - id: kp3
        name: Range of simple quadratics
        key_prerequisites: [function-notation]
        constraints: 'quadratics of the form a x^2 + c with the vertex on the y-axis; answers are y ≥ c or y ≤ c; some items ask whether one value is an output'
        exemplars:
          - problem: 'State the range of $f(x)=x^2+1$.'
            answer: 'y ≥ 1'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'Since $x^2\ge0$, the smallest output is $1$, reached at $x=0$. Larger squares give larger outputs, so the range is $y\ge1$.'
          - problem: 'State the range of $f(x)=-x^2+4$.'
            answer: 'y ≤ 4'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'Since $-x^2\le0$, every output is at most $4$. The value $4$ is reached at $x=0$, so the range is $y\le4$.'
          - problem: 'A footbridge arch is modelled by $y=-x^2+9$, where $x$ is the horizontal distance in metres from the centre and $y$ is the height in metres. State the range of the rule.'
            answer: 'y ≤ 9'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The term $-x^2$ is never positive, so every height is at most $9$. The height $9$ occurs at the centre $x=0$, so the range is $y\le9$.'
          - problem: 'State the range of $f(x)=3x^2-7$.'
            answer: 'y ≥ -7'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The term $3x^2$ is at least $0$, so every output is at least $-7$. The value $-7$ occurs at $x=0$, so the range is $y\ge-7$.'
          - problem: 'Can $f(x)=x^2+4$ ever output $3$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it cannot", "cannot", "never", "no it cannot", "it can never output 3"], ["yes", "it can", "can", "sometimes", "yes it can", "it can output 3"]]}
            solution_sketch: 'Since $x^2\ge0$, every output of $f$ is at least $4$. The number $3$ is below $4$, so $f$ never outputs $3$.'
          - problem: 'The hourly running cost of a machine at setting $x$ is $C(x)=x^2+3$ dollars. State the range of $C$.'
            answer: 'y ≥ 3'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The square $x^2$ is at least $0$, so the cost is at least $3$ dollars. The least cost is reached at setting $0$, so the range is $y\ge3$.'
          - problem: 'State the range of $f(x)=-2x^2-2$.'
            answer: 'y ≤ -2'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The term $-2x^2$ is never positive, so every output is at most $-2$. The value $-2$ occurs at $x=0$, so the range is $y\le-2$.'
          - problem: 'Is $-1$ in the range of $f(x)=x^2-5$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is", "it is in the range"], ["no", "it is not", "no it is not", "it is not in the range"]]}
            solution_sketch: 'Solve $x^2-5=-1$, which gives $x^2=4$ and $x=2$ or $x=-2$. Since $f(2)=-1$, the number $-1$ is an output, so it is in the range.'
          - problem: 'What is the range of $f(x)=-x^2+6$?'
            answer: 'y ≤ 6'
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: 'The term $-x^2$ is never positive, so $6$ is the greatest output and not the least. The outputs go down from $6$, so the range is $y\le6$.'
    diagnostic_exemplar:
      problem: 'State the domain and the range of $f(x) = \sqrt{x - 3}$.'
      answer_contract: {kind: multipart, parts: [{name: domain, contract: {kind: exact}}, {name: range, contract: {kind: exact}}]}
      answer: "domain = x >= 3; range = y >= 0"
      solution_sketch: 'The radicand must be non-negative, so $x - 3 \ge 0$; a square root itself never returns a negative value.'
    anki_seeds:
      - front: "Two restrictions to check when finding a domain:"
        back: "denominators must be nonzero; square-root radicands must be ≥ 0."
        type: basic
      - front: "The domain of any polynomial function is..."
        back: "all real numbers."
        type: basic
      - front: "The range of a parabola f(x) = x² + k (opening up) is..."
        back: "y ≥ k (all outputs from the vertex's y-value upward)."
        type: basic

  - id: function-operations
    name: Operations on Functions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: function-notation
        weight: 0.7
        key: true
      - id: polynomial-addition-subtraction
        weight: 0.5
      - id: polynomial-multiplication
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Sum and difference of functions
        key_prerequisites: [function-notation, polynomial-addition-subtraction]
        constraints: 'linear f and g, or f and g with a quadratic term, small integer coefficients; sum or difference; some items come from a context'
        exemplars:
          - problem: 'If $f(x)=2x+1$ and $g(x)=x-4$, find $(f+g)(x)$.'
            answer: '3x - 3'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Add the two rules: $(2x+1)+(x-4)$. The $x$-terms give $3x$ and the constants give $1-4=-3$, so $(f+g)(x)=3x-3$.'
          - problem: 'If $f(x)=2x+1$ and $g(x)=x-4$, find $(f-g)(x)$.'
            answer: 'x + 5'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Subtract the whole second rule: $(2x+1)-(x-4)=2x+1-x+4$. The $x$-terms give $x$ and the constants give $5$, so $(f-g)(x)=x+5$.'
          - problem: 'A stall earns $R(x)=12x$ dollars from selling $x$ cakes and spends $C(x)=5x+40$ dollars to make them. Write the profit as the function $(R-C)(x)$.'
            answer: '7x - 40'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Profit is earnings minus costs, so subtract the whole cost rule: $12x-(5x+40)=12x-5x-40$. This gives $(R-C)(x)=7x-40$.'
          - problem: 'Machine A has made $a(t)=40t+15$ parts and machine B has made $b(t)=25t+30$ parts after $t$ hours. Write a rule for how many more parts A has made than B.'
            answer: '15t - 15'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The difference is $(a-b)(t)=(40t+15)-(25t+30)$. The $t$-terms give $15t$ and the constants give $15-30=-15$, so the rule is $15t-15$.'
          - problem: 'Let $f(x)=3x-2$ and $g(x)=3x+5$. Find $(f-g)(x)$.'
            answer: '-7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract the whole second rule: $3x-2-(3x+5)=3x-2-3x-5$. The $x$-terms cancel and the constants give $-7$, so $(f-g)(x)=-7$.'
          - problem: 'For $f(x)=5x+2$ and $g(x)=2x-3$, what is $(f-g)(x)$?'
            answer: '3x + 5'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Subtract the $-3$ in $g$ as well. The minus sign applies to the whole bracket: $5x+2-2x+3=3x+5$, so the correct rule is $3x+5$.'
          - problem: 'Let $f(x)=x^2+3x$ and $g(x)=x^2-2x+1$. Find $(f-g)(x)$.'
            answer: '5x - 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Subtract every term of $g$: $x^2+3x-x^2+2x-1$. The $x^2$-terms cancel and the rest gives $5x-1$, so $(f-g)(x)=5x-1$.'
          - problem: 'A school sells $f(x)=4x$ dollars of tickets and $g(x)=2x+30$ dollars of snacks at a show with $x$ guests. Write the total takings $(f+g)(x)$.'
            answer: '6x + 30'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The total is the sum of the two rules: $4x+(2x+30)$. The $x$-terms give $6x$, so $(f+g)(x)=6x+30$.'
      - id: kp2
        name: Product of functions
        key_prerequisites: [polynomial-multiplication]
        constraints: 'a monomial times a linear binomial, or two linear binomials; small integer coefficients; expand the product; some items come from a context'
        exemplars:
          - problem: 'If $f(x)=2x+1$ and $g(x)=3x-1$, expand $(fg)(x)$.'
            answer: '6x^2 + x - 1'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The four products are $6x^2$, $-2x$, $3x$ and $-1$. Combining the middle terms $-2x+3x=x$ gives $(fg)(x)=6x^2+x-1$.'
          - problem: 'If $f(x)=x$ and $g(x)=x+3$, expand $(fg)(x)$.'
            answer: 'x^2 + 3x'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The product function multiplies the two rules, so multiply $x$ by each term of $x+3$: $x\cdot x+x\cdot3$. This gives $(fg)(x)=x^2+3x$.'
          - problem: 'A rectangular garden has width $f(x)=x-2$ metres and length $g(x)=x+6$ metres. Write the area rule $(fg)(x)$.'
            answer: 'x^2 + 4x - 12'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The area is width times length: $(x-2)(x+6)=x^2+6x-2x-12$. Combining the middle terms gives $(fg)(x)=x^2+4x-12$.'
          - problem: 'Given $f(x)=x+2$ and $g(x)=x-2$, expand $(fg)(x)$.'
            answer: 'x^2 - 4'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Multiply every term of the first factor by every term of the second: $x^2-2x+2x-4$. The middle terms cancel, so $(fg)(x)=x^2-4$.'
          - problem: 'A fair charges $f(x)=x$ dollars per ticket and sells $n(x)=40-x$ tickets at that price. Write the takings rule $(fn)(x)$.'
            answer: '-x^2 + 40x'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'Takings are the price times the number of tickets: $x(40-x)=40x-x^2$. In order of powers this is $-x^2+40x$.'
          - problem: 'For $f(x)=x+3$ and $g(x)=x-4$, what is $(fg)(x)$?'
            answer: 'x^2 - x - 12'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The cross terms count as well as the first terms and the last terms: $x^2-4x+3x-12=x^2-x-12$.'
          - problem: 'If $f(x)=3x$ and $g(x)=2x-7$, expand $(fg)(x)$.'
            answer: '6x^2 - 21x'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The product function multiplies the two rules, so distribute $3x$ over both terms: $3x\cdot2x-3x\cdot7$. This gives $(fg)(x)=6x^2-21x$.'
          - problem: 'A poster has width $f(x)=x+5$ centimetres and height $g(x)=3x+1$ centimetres. Write the area rule $(fg)(x)$.'
            answer: '3x^2 + 16x + 5'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'The area is the width times the height: $(x+5)(3x+1)=3x^2+x+15x+5$. Combining the middle terms gives $3x^2+16x+5$.'
      - id: kp3
        name: Evaluate a combined function at a point
        key_prerequisites: [function-notation]
        constraints: 'f and g are a monomial, a binomial or a simple quadratic; evaluate the sum, difference, product or quotient at a small integer, negative inputs included; some items come from a context'
        exemplars:
          - problem: 'If $f(x)=x^2+1$ and $g(x)=3x$, find $(f+g)(2)$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Evaluate each function at the same input $2$: $f(2)=5$ and $g(2)=6$. Then add the two outputs: $(f+g)(2)=5+6=11$.'
          - problem: 'If $f(x)=x^2$ and $g(x)=2x$, find $(fg)(2)$.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The outputs are $f(2)=4$ and $g(2)=4$. The product function multiplies them: $(fg)(2)=4\cdot4=16$.'
          - problem: 'A stall earns $R(x)=12x$ dollars and spends $C(x)=5x+40$ dollars when it sells $x$ cakes. What is its profit $(R-C)(10)$ when it sells $10$ cakes?'
            answer: '30'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The earnings are $R(10)=120$ and the costs are $C(10)=90$. The profit is the earnings minus the costs, $120-90=30$ dollars.'
          - problem: 'A car has travelled $D(t)=t^2+30t$ kilometres after $t$ hours, and the elapsed time is $T(t)=t$ hours. What is its average speed $\left(\frac{D}{T}\right)(4)$ in kilometres per hour?'
            answer: '34'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'After $4$ hours the distance is $D(4)=16+120=136$ kilometres and $T(4)=4$ hours. The average speed is the distance divided by the time, $136/4=34$ kilometres per hour.'
          - problem: 'For $f(x)=x^2$ and $g(x)=2x$, compute $(f-g)(4)$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The separate outputs are $f(4)=16$ and $g(4)=8$. Subtracting the second output from the first one gives $(f-g)(4)=8$.'
          - problem: 'Let $f(x)=x^2-4x$ and $g(x)=x+3$. Find $(f-g)(-1)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The outputs at $-1$ are $f(-1)=1+4=5$ and $g(-1)=2$. Subtracting in the order written gives $(f-g)(-1)=5-2=3$.'
          - problem: 'Let $f(x)=x^2+3$ and $g(x)=x-3$. Does $(f/g)(3)$ have a value?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "undefined", "it is undefined", "not defined", "it is not defined", "does not exist", "no value", "it has no value"], ["yes", "defined", "it is defined", "it has a value"]]}
            solution_sketch: 'The numerator output is $f(3)=12$ and the denominator output is $g(3)=0$. Division by zero is undefined, so $(f/g)(3)$ has no value.'
          - problem: 'For $f(x)=x^2$ and $g(x)=2x$, compute $(f/g)(6)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The outputs are $f(6)=36$ and $g(6)=12$, and the denominator output $12$ is not zero. The quotient is $(f/g)(6)=36/12=3$.'
    diagnostic_exemplar:
      problem: 'If $f(x) = 2x - 1$ and $g(x) = x + 3$, find $(fg)(x)$.'
      answer: "2x^2 + 5x - 3"
      solution_sketch: '$(fg)(x)$ is the product: $(2x - 1)(x + 3) = 2x^2 + 6x - x - 3$.'
    anki_seeds:
      - front: "(f + g)(x) = ?"
        back: "f(x) + g(x)"
        type: basic

  - id: evaluating-composite-functions
    name: Evaluating Composite Functions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: function-notation
        weight: 0.8
        key: true
      - id: evaluating-functions
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Numeric composition, inside first
        key_prerequisites: [function-notation, evaluating-functions]
        constraints: 'linear rules, a division rule or a unit-conversion rule; integer or simple fractional intermediate values; negative inputs allowed; some items come from a context'
        exemplars:
          - problem: 'If $f(x)=x+2$ and $g(x)=3x$, find $f(g(2))$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Work the inside function first: $g(2)=6$. Then apply $f$ to that output: $f(6)=6+2=8$.'
          - problem: 'If $f(x)=2x$ and $g(x)=x-1$, find $g(f(3))$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inside function is $f$, so the first step is $f(3)=2(3)=6$. Then apply $g$ to this result: $g(6)=6-1=5$.'
          - problem: 'A machine first doubles a number and then adds $5$. The first stage is $g(x)=2x$ and the second stage is $f(x)=x+5$. What is the output for the input $3$?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first stage gives $g(3)=6$. The second stage works on this result: $f(6)=6+5=11$.'
          - problem: 'A bakery packs loaves into boxes of $6$, so $x$ loaves fill $g(x)=\frac{x}{6}$ boxes. Shipping $b$ boxes costs $f(b)=12b+5$ dollars. What does it cost to ship $30$ loaves?'
            answer: '65'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The loaves are packed first: $g(30)=30/6=5$ boxes. Shipping then costs $f(5)=12(5)+5=65$ dollars.'
          - problem: 'Let $f(x)=x-7$ and $g(x)=3x+2$. Find $f(g(-2))$.'
            answer: '-11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inside function gives $g(-2)=3(-2)+2=-4$. Then apply $f$ to this negative result: $f(-4)=-4-7=-11$.'
          - problem: 'A temperature of $F$ degrees Fahrenheit is $C(F)=\frac{5(F-32)}{9}$ degrees Celsius, and $C$ degrees Celsius is $K(C)=C+273$ kelvin. Find $K(C(95))$.'
            answer: '308'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Convert to Celsius first: $C(95)=5(63)/9=35$ degrees. Then convert this result to kelvin: $K(35)=35+273=308$.'
          - problem: 'For $f(x)=x-3$ and $g(x)=4x$, what is the value of $f(g(5))$?'
            answer: '17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Applying $f$ first gives $g(f(5))=g(2)=8$, which is the other order. The inside function is $g$: $g(5)=20$, and then $f(20)=17$.'
          - problem: 'If $f(x)=2x-1$ and $g(x)=x+4$, find $f(g(3))$.'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inside function gives $g(3)=3+4=7$. Then apply the outside function to this result: $f(7)=2(7)-1=13$.'
      - id: kp2
        name: Order matters numerically
        key_prerequisites: [evaluating-functions]
        constraints: 'one linear rule and one squaring rule, or two linear rules applied in both orders so the two answers differ; some items come from a context'
        exemplars:
          - problem: 'If $f(x)=x^2$ and $g(x)=x+1$, find $f(g(2))$.'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inside function gives $g(2)=3$. Then apply the outside function $f$ to this result: $f(3)=3^2=9$.'
          - problem: 'If $f(x)=x^2$ and $g(x)=x+1$, find $g(f(2))$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Now $f$ is the inside function, so $f(2)=4$ comes first. Then $g(4)=4+1=5$.'
          - problem: 'Let $f(x)=x^2$ and $g(x)=x+1$. Find $f(g(3))-g(f(3))$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first part is $f(g(3))=f(4)=16$ and the second part is $g(f(3))=g(9)=10$. The difference is $16-10=6$.'
          - problem: 'A game squares your raw score and then adds a bonus of one point. With $f(x)=x^2$ and $g(x)=x+1$, what is the final score for a raw score of $4$?'
            answer: '17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The raw score is squared first: $f(4)=16$. The bonus is added second, so the final score is $g(16)=17$.'
          - problem: 'A coat costs $90$ dollars. The shop takes $20\%$ off, $f(x)=0.8x$, and then a voucher takes $10$ dollars off, $g(x)=x-10$. What does the customer pay?'
            answer: '62'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The discount comes first: $f(90)=72$. The voucher comes second, so the price is $g(72)=62$ dollars.'
          - problem: 'The coat costs $90$ dollars again, but the shop applies the $10$ dollar voucher $g(x)=x-10$ first and then the $20\%$ discount $f(x)=0.8x$. What does the customer pay now?'
            answer: '64'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The voucher comes first: $g(90)=80$. The discount comes second, so the price is $f(80)=64$ dollars.'
          - problem: 'For $f(x)=2x+3$ and $g(x)=x-1$, what is $f(g(4))-g(f(4))$?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first part is $f(g(4))=f(3)=9$ and the second part is $g(f(4))=g(11)=10$. The difference is $9-10=-1$, so the two compositions are not equal.'
          - problem: 'A sheet is cut by $g(x)=x-6$ centimetres and then split in half by $f(x)=\frac{x}{2}$. If the sheet is $10$ centimetres long, how long is each half?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The cut comes first and gives $g(10)=4$ centimetres. Splitting this piece in half gives $f(4)=4/2=2$ centimetres.'
      - id: kp3
        name: Composition from tables
        key_prerequisites: [function-notation]
        constraints: 'tables or arrow lists supply only the values needed; inner value first, then outer; integer entries; some items come from a context'
        exemplars:
          - problem: 'Tables give $g(3)=2$, $f(1)=4$ and $f(2)=6$. Find $f(g(3))$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner lookup gives $g(3)=2$. Use $2$ as the input of $f$: $f(2)=6$. The entry $f(1)=4$ is not needed.'
          - problem: 'Tables give $f(2)=3$, $g(3)=7$ and $g(2)=1$. Find $g(f(2))$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner lookup gives $f(2)=3$. Use $3$ as the input of $g$: $g(3)=7$. The entry $g(2)=1$ is not needed.'
          - problem: 'Tables give $g(1)=4$, $f(1)=2$ and $f(4)=9$. What is the value of $f(g(1))$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The input of $f$ is not the original input $1$. The inner lookup gives $g(1)=4$, so the outer lookup must be $f(4)=9$.'
          - problem: 'A table sends $5$ to $2$ under $f$ and $2$ to $8$ under $g$. It also sends $5$ to $3$ under $g$. Find $(g\circ f)(5)$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composition $g\circ f$ applies $f$ first: $f(5)=2$. Then $g(2)=8$, so $(g\circ f)(5)=8$. The entry that sends $5$ to $3$ under $g$ is not used.'
          - problem: 'The depot table $Z$ gives the delivery zone of a parcel: parcel $402$ is in zone $5$ and parcel $417$ is in zone $3$. The table $V$ gives the van of a zone: zone $3$ uses van $14$ and zone $5$ uses van $22$. What is the number of the van that carries parcel $402$?'
            answer: '22'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The zone comes first: $Z(402)=5$. Then the van for zone $5$ is $V(5)=22$, so van $22$ carries parcel $402$.'
          - problem: 'Tables give $f(0)=2$, $f(2)=5$, $g(0)=4$, $g(2)=0$ and $g(5)=1$. Find $g(f(0))+f(g(2))$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First, $g(f(0))=g(2)=0$ because $f(0)=2$. Second, $f(g(2))=f(0)=2$ because $g(2)=0$. The sum is $0+2=2$.'
          - problem: 'A school keeps two tables. The table $C$ gives the class of a student: student $7$ is in class $3$ and student $9$ is in class $4$. The table $R$ gives the room of a class: class $3$ uses room $12$ and class $4$ uses room $15$. What is the number of the room that student $9$ uses?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The class comes first: $C(9)=4$. Then the room of class $4$ is $R(4)=15$, so student $9$ uses room $15$.'
          - problem: 'Tables give $g(4)=1$ and $f(1)=-3$. Find $(f\circ g)(4)$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composition $f\circ g$ applies $g$ first: $g(4)=1$. Then $f(1)=-3$, so $(f\circ g)(4)=-3$.'
    diagnostic_exemplar:
      problem: 'If $f(x) = x^2$ and $g(x) = x + 3$, find $f(g(1)) - g(f(1))$.'
      answer: "12"
      solution_sketch: 'Inside first: $f(g(1)) = f(4) = 16$ and $g(f(1)) = g(1) = 4$.'
    anki_seeds:
      - front: "To evaluate f(g(a))..."
        back: "compute g(a) first, then apply f to the result."
        type: basic

  - id: function-composition
    name: Composition of Functions
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: evaluating-composite-functions
        weight: 0.8
        key: true
      - id: polynomial-multiplication
        weight: 0.4
      - id: combining-like-terms
        weight: 0.4
      - id: function-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Symbolic composition of linear functions
        key_prerequisites: [evaluating-composite-functions]
        exemplars:
          - problem: 'If $f(x)=3x+2$ and $g(x)=x-4$, find $f(g(x))$.'
            answer: '3x - 10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inner rule $g(x)=x-4$ becomes the whole input of $f$, so $f(g(x))=3(x-4)+2$. Distributing the $3$ gives $3x-12+2$, which simplifies to $3x-10$.'
          - problem: 'If $f(x)=x+1$ and $g(x)=2x$, find $f(g(x))$.'
            answer: '2x + 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $g(x)=2x$ in place of the input of $f$. This gives $f(g(x))=2x+1$, and no like terms are left to combine.'
          - problem: 'If $f(x)=2x+5$ and $g(x)=3x-1$, find $f(g(x))$.'
            answer: '6x + 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The whole rule $g(x)=3x-1$ goes into $f$, so $f(g(x))=2(3x-1)+5$. Distributing the $2$ gives $6x-2+5$, which simplifies to $6x+3$.'
          - problem: 'A bakery packs $12$ rolls on each tray, so $x$ trays hold $r(x)=12x$ rolls. The butter needed for $r$ rolls is $b(r)=3r+20$ grams, which includes $20$ grams for greasing the pans. Write the butter needed for $x$ trays in terms of $x$.'
            answer: '36x + 20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of rolls $12x$ is the input of the butter rule, so the butter is $3(12x)+20$ grams. Multiplying gives $36x+20$ grams.'
          - problem: 'A prize of $x$ dollars is shared equally among $4$ winners, so each receives $s(x)=\frac{x}{4}$ dollars. Each winner then adds $10$ dollars of their own, which is the rule $a(y)=y+10$. Write the final amount per winner in terms of $x$.'
            answer: 'x/4 + 10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The share $\frac{x}{4}$ is the input of $a$, so the final amount is $a(s(x))=\frac{x}{4}+10$. The division by $4$ happens before the $10$ dollars are added.'
          - problem: 'For $f(x)=10-2x$ and $g(x)=x+3$, find $f(g(x))$.'
            answer: '4 - 2x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace the input of $f$ by $x+3$, which gives $f(g(x))=10-2(x+3)$. The product is $-2x-6$, so the result is $10-6-2x=4-2x$.'
          - problem: 'For $f(x)=3x+1$ and $g(x)=x+2$, what is the rule of $f(g(x))$?'
            answer: '3x + 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $2$ is inside $g(x)$, so $3$ multiplies it. The composition is $3(x+2)+1=3x+6+1=3x+7$.'
        constraints: "both rules linear with small integer coefficients, in plain form and in word problems with a multiplication or a division step; the answer is linear"
      - id: kp2
        name: Composition with squaring
        key_prerequisites: [polynomial-multiplication]
        exemplars:
          - problem: 'If $f(x)=x^2$ and $g(x)=x+3$, find $f(g(x))$.'
            answer: 'x^2 + 6x + 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The whole inner rule goes inside the square, so $f(g(x))=(x+3)^2$. Multiplying the binomial by itself gives $x^2+3x+3x+9$, which combines to $x^2+6x+9$.'
          - problem: 'If $f(x)=2x-1$ and $g(x)=x^2$, find $g(f(x))$.'
            answer: '4x^2 - 4x + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Here $f$ acts first and $g$ squares its result, so $g(f(x))=(2x-1)^2$. Multiplying out gives $4x^2-2x-2x+1$, which combines to $4x^2-4x+1$.'
          - problem: 'A square rug has side $s(x)=x-2$ metres, and its area is $A(s)=s^2$ square metres. Write the area of the rug in terms of $x$ and expand it.'
            answer: 'x^2 - 4x + 4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The area uses the whole side length, so $A(s(x))=(x-2)^2=(x-2)(x-2)$. Expanding gives $x^2-2x-2x+4$, which combines to $x^2-4x+4$.'
          - problem: 'If $f(x)=x^2+1$ and $g(x)=x-2$, find $f(g(x))$.'
            answer: 'x^2 - 4x + 5'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Replace the input of $f$ by $x-2$, so $f(g(x))=(x-2)^2+1$. The square is $x^2-4x+4$, and adding $1$ gives $x^2-4x+5$.'
          - problem: 'For $f(x)=3x+1$ and $g(x)=x^2$, what is the rule of $g(f(x))$, expanded?'
            answer: '9x^2 + 6x + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Square the whole output of $f$, not only the $x$. The rule is $(3x+1)^2$, whose terms are $9x^2$, $6x$ and $1$.'
          - problem: 'A square patio has side $s(x)=4x+3$ metres and area $A(s)=s^2$ square metres. Expand $A(s(x))$.'
            answer: '16x^2 + 24x + 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The area is the square of the whole side, $(4x+3)^2$. The terms are $16x^2$, twice $12x$ which is $24x$, and $9$, giving $16x^2+24x+9$.'
          - problem: 'If $f(x)=x+4$ and $g(x)=x^2-3$, find $g(f(x))$.'
            answer: 'x^2 + 8x + 13'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The output of $f$ goes into $g$, so $g(f(x))=(x+4)^2-3$. The square is $x^2+8x+16$, and subtracting $3$ gives $x^2+8x+13$.'
        constraints: "one rule is a squaring rule; both orders appear; expand the resulting trinomial; area contexts with a square side"
      - id: kp3
        name: Order matters (g(f(x)) vs f(g(x)))
        key_prerequisites: [combining-like-terms]
        try_first:
          problem: 'For $f(x)=2x$ and $g(x)=x+3$, is $f(g(1))$ equal to $g(f(1))$?'
          answer_contract: {"kind":"label","options":[["yes"],["no"]]}
          answer: 'no'
          reveal: 'Here $f(g(1))=f(4)=8$ but $g(f(1))=g(2)=5$. Doing the two functions in the other order gives a different result, so $f(g(x))$ and $g(f(x))$ are usually different rules.'
        exemplars:
          - problem: 'If $f(x)=x-4$ and $g(x)=3x+1$, find $g(f(x))$.'
            answer: '3x - 11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $f$ acts first, so $g(f(x))=3(x-4)+1$. Distributing gives $3x-12+1$, which simplifies to $3x-11$.'
          - problem: 'If $f(x)=x-4$ and $g(x)=3x+1$, find $f(g(x))$.'
            answer: '3x - 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Now $g$ acts first, so $f(g(x))=(3x+1)-4$. This simplifies to $3x-3$, which differs from $g(f(x))=3x-11$.'
          - problem: 'Is $f(g(x))$ the same function as $g(f(x))$ when $f(x)=x+6$ and $g(x)=2x$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","same","the same","they are the same","equal"],["no","not the same","different","they are different","not equal"]]}
            solution_sketch: 'Compute both orders: $f(g(x))=2x+6$, but $g(f(x))=2(x+6)=2x+12$. The two rules differ, so the answer is no.'
          - problem: 'A calibration pipeline first applies $f(x)=2x+3$ and then applies $g(x)=x-5$. Give the rule for the final reading in terms of $x$.'
            answer: '2x - 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second stage subtracts $5$ from the first-stage reading $2x+3$. This gives $(2x+3)-5=2x-2$.'
          - problem: 'A restaurant bill is $x$ dollars. A tip of $6$ dollars is added, and then the total is shared equally among $3$ friends. How much does each friend pay, in terms of $x$?'
            answer: '(x + 6)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tip is added first, giving $x+6$ dollars, and then that whole total is divided by $3$. Each friend pays $\frac{x+6}{3}$ dollars.'
          - problem: 'Three friends share a bill of $x$ dollars equally, and then each friend adds $6$ dollars as a tip. How much does each friend pay in total, in terms of $x$?'
            answer: 'x/3 + 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The share comes first, so each friend owes $\frac{x}{3}$ dollars. Each friend then adds $6$ dollars, so the total is $\frac{x}{3}+6$.'
          - problem: 'For $f(x)=2x$ and $g(x)=5x$, do $f(g(x))$ and $g(f(x))$ give the same rule?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","same","the same","they are the same","equal"],["no","not the same","different","they are different","not equal"]]}
            solution_sketch: 'Both orders multiply the input by $2$ and by $5$, so $f(g(x))=10x$ and $g(f(x))=10x$. The two rules are equal, so the answer is yes.'
        constraints: "both rules linear; the same pair in both orders, and word problems where the order of two steps changes the result"
    diagnostic_exemplar:
      problem: 'If $f(x) = x + 2$ and $g(x) = x^2 - 3$, find $g(f(x))$.'
      answer: "x^2 + 4x + 1"
      solution_sketch: 'Feed $f$ into $g$: $(x + 2)^2 - 3 = x^2 + 4x + 4 - 3$.'
    anki_seeds:
      - front: "In general, f(g(x)) and g(f(x)) are..."
        back: "different functions — composition is not commutative."
        type: basic

  - id: one-to-one-functions
    name: One-to-One Functions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: identifying-functions-vertical-line-test
        weight: 0.6
        key: true
      - id: reading-function-graphs
        weight: 0.4
      - id: function-notation
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: One-to-one from sets and tables
        key_prerequisites: [identifying-functions-vertical-line-test]
        try_first:
          problem: 'A function has the pairs $(1,3)$, $(2,3)$ and $(3,5)$. If you are told only that an output is $3$, can you tell which input it came from?'
          answer_contract: {"kind":"label","options":[["yes"],["no"]]}
          answer: 'no'
          reveal: 'Both input $1$ and input $2$ give the output $3$, so the output does not tell you its input. A function in which every output identifies its input is called one-to-one.'
        exemplars:
          - problem: 'Is the function $\{(2,5),(3,7),(4,9)\}$ one-to-one?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","one-to-one","it is one-to-one"],["no","not one-to-one","it is not one-to-one"]]}
            solution_sketch: 'The outputs are $5$, $7$ and $9$, and no output is used by two different inputs. So the function is one-to-one and the answer is yes.'
          - problem: 'A function satisfies $f(2)=6$, $f(3)=9$, $f(4)=6$ and $f(5)=7$. Which output value comes from two different inputs?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'List the outputs: $6$, $9$, $6$ and $7$. The value $6$ appears twice, from the inputs $2$ and $4$, so $f$ is not one-to-one.'
          - problem: 'A school gives each locker to one student: locker $1$ to Mia, locker $2$ to Leo, locker $3$ to Mia and locker $4$ to Eva. Is the rule from lockers to students one-to-one?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","one-to-one","it is one-to-one"],["no","not one-to-one","it is not one-to-one"]]}
            solution_sketch: 'Mia owns both locker $1$ and locker $3$, so one output has two different inputs. The rule is not one-to-one, and the answer is no.'
          - problem: 'For which values of $k$ is the function $\{(1,4),(2,7),(3,k)\}$ not one-to-one?'
            answer: '4, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The function repeats an output when $k$ equals an output already in use. The outputs $4$ and $7$ are in use, so $k=4$ or $k=7$.'
          - problem: 'The function $\{(1,8),(2,8),(3,5)\}$ is not one-to-one. Which inputs have the same output?'
            answer: '1, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inputs $1$ and $2$ both have the output $8$, while $3$ has the output $5$. So the shared output $8$ comes from the inputs $1$ and $2$.'
          - problem: 'A bus company counts passengers: Monday $42$, Tuesday $38$, Wednesday $42$, Thursday $51$ and Friday $38$. Which passenger counts occur on two different days?'
            answer: '38, 42'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The count $42$ occurs on Monday and Wednesday, and the count $38$ occurs on Tuesday and Friday. The count $51$ occurs only once, so the repeated counts are $38$ and $42$.'
        constraints: "3-5 pairs given as a set, a list of values, a table or a word context; at most two repeated outputs"
      - id: kp2
        name: The horizontal line test
        key_prerequisites: [reading-function-graphs]
        exemplars:
          - problem: 'Does the graph of $y=x^2$ pass the horizontal line test?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it passes","passes"],["no","it fails","fails","it does not pass"]]}
            solution_sketch: 'The horizontal line $y=4$ meets the graph where $x^2=4$, at $x=2$ and $x=-2$. A line that meets the graph twice makes the test fail, so the answer is no.'
          - problem: 'The horizontal line $y=9$ meets the graph of $y=x^2$ twice. At which $x$-coordinates?'
            answer: '-3, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The line meets the graph where $x^2=9$. The solutions are $x=3$ and $x=-3$, so both inputs give the output $9$.'
          - problem: 'Does the graph of $y=-2x+13$ pass the horizontal line test?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it passes","passes"],["no","it fails","fails","it does not pass"]]}
            solution_sketch: 'The graph is a line with slope $-2$, so it is never horizontal. Each horizontal line meets it exactly once, so the graph passes and the answer is yes.'
          - problem: 'How many points does the horizontal line $y=0$ share with the graph of $y=x^3-4x$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve $x^3-4x=0$, which factors as $x(x-2)(x+2)=0$. The solutions $x=0$, $x=2$ and $x=-2$ give $3$ points, so this cubic fails the test.'
          - problem: 'A ball thrown upward has height $h(t)=20t-5t^2$ metres after $t$ seconds. At which times is the ball $15$ metres high?'
            answer: '1, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve $20t-5t^2=15$, which becomes $t^2-4t+3=0$ after dividing by $-5$. This factors as $(t-1)(t-3)=0$, so the ball is $15$ metres high at $t=1$ and $t=3$.'
          - problem: 'A taxi charges a start fee of $3$ dollars plus $2$ dollars for each kilometre, so a ride of $d$ kilometres costs $C=3+2d$ dollars. A ride costs $17$ dollars. How long was the ride?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Solve $3+2d=17$, so $2d=14$ and $d=7$. The ride was $7$ kilometres long, and no other distance gives this fare.'
          - problem: 'The horizontal line $y=4$ meets the graph of $y=|x-2|$ in two points. Find their $x$-coordinates.'
            answer: '-2, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve $|x-2|=4$, so $x-2=4$ or $x-2=-4$. This gives $x=6$ and $x=-2$, so the graph fails the horizontal line test.'
          - problem: 'Find the $x$-coordinate of each point where the horizontal line $y=8$ meets the graph of $y=x^3$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve $x^3=8$. The only real number whose cube is $8$ is $x=2$, so the line meets the graph once and the graph passes the test here.'
        constraints: "named graphs (line, parabola, cubic, absolute value) given by their equations; verdicts, intersection points, and word contexts that set a height or a cost"
      - id: kp3
        name: One-to-one functions have inverses
        key_prerequisites: [function-notation]
        exemplars:
          - problem: 'Does $f(x)=4x+7$, defined for all real inputs, have an inverse function?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it has an inverse","has an inverse"],["no","it has no inverse","no inverse"]]}
            solution_sketch: 'The graph is a line with slope $4$, so every horizontal line meets it once. The function is one-to-one, so it has an inverse and the answer is yes.'
          - problem: 'Does $f(x)=|x+1|$, defined for all real inputs, have an inverse function?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it has an inverse","has an inverse"],["no","it has no inverse","no inverse"]]}
            solution_sketch: 'Both $f(2)=3$ and $f(-4)=3$, so two inputs share the output $3$. The function is not one-to-one, so it has no inverse and the answer is no.'
          - problem: 'A ball thrown upward has height $h(t)=30t-5t^2$ metres after $t$ seconds, and it is $40$ metres high at $t=2$. At what other time is it $40$ metres high?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'Solve $30t-5t^2=40$, which becomes $t^2-6t+8=0$ and factors as $(t-2)(t-4)=0$. The other time is $t=4$, so a height does not tell the time and $h$ has no inverse.'
          - problem: 'For $f(x)=4x+7$, find $f^{-1}(1)$.'
            answer: '-3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value $f^{-1}(1)$ is the input whose output is $1$, so solve $4x+7=1$. This gives $4x=-6$ and $x=-3/2$.'
          - problem: 'For $f(x)=x^3-2$, find $f^{-1}(6)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value $f^{-1}(6)$ is the input whose output is $6$, so solve $x^3-2=6$. Then $x^3=8$, which gives $x=2$.'
          - problem: 'A plumber charges a call-out fee of $45$ dollars plus $30$ dollars per hour, so a job of $h$ hours costs $P(h)=45+30h$ dollars. A bill is $135$ dollars. How long did the job take?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'Each bill belongs to exactly one job length, so solve $45+30h=135$. Then $30h=90$ and $h=3$, so the job took $3$ hours.'
          - problem: 'The function $f(x)=x^2$ is defined for all real inputs. Find an input other than $5$ with the same output as $5$.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $f(5)=25$ and $f(-5)=25$, so two different inputs share one output. The function is not one-to-one, so it has no inverse function.'
        constraints: "all real inputs, no restricted domains; verdicts, a second input with the same output, values of an inverse, and word contexts where a cost or a height is given"
    diagnostic_exemplar:
      problem: 'Does $f(x) = x^2 - 4$, defined for all real inputs, have an inverse function?'
      answer_contract: {kind: label, options: [[yes], [no]]}
      answer: "no"
      solution_sketch: 'It fails the horizontal line test — $f(2) = f(-2) = 0$ — so no inverse function exists.'
    anki_seeds:
      - front: "A function is one-to-one when..."
        back: "no two inputs share the same output."
        type: basic
      - front: "A function has an inverse function exactly when it is..."
        back: "one-to-one."
        type: basic

  - id: inverse-functions
    name: Inverse Functions
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: literal-equations
        weight: 0.7
        key: true
      - id: function-notation
        weight: 0.6
        key: true
      - id: one-to-one-functions
        weight: 0.4
      - id: function-composition
        weight: 0.4
      - id: two-step-equations
        weight: 0.4
      - id: multi-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Inverse of a linear function
        key_prerequisites: [literal-equations]
        try_first:
          problem: 'For $f(x)=3x+1$, the output is $19$ for some input $a$. Find $a$.'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'You undid the operations in reverse order: subtract $1$, then divide by $3$. The inverse rule $f^{-1}(x)=\frac{x-1}{3}$ does the same for every output.'
        exemplars:
          - problem: 'If $f(x)=2x+6$, find $f^{-1}(x)$.'
            answer: '(x - 6)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $y=2x+6$ and swap the letters to get $x=2y+6$. Solving for $y$ gives $y=\frac{x-6}{2}$, so $f^{-1}(x)=\frac{x-6}{2}$.'
          - problem: 'If $f(x)=3x-5$, find $f^{-1}(x)$.'
            answer: '(x + 5)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the letters in $y=3x-5$ to get $x=3y-5$. Adding $5$ gives $x+5=3y$, so $f^{-1}(x)=\frac{x+5}{3}$.'
          - problem: 'A machine triples a number and then adds $9$, so $f(x)=3x+9$. Find the rule of the machine that undoes it.'
            answer: '(x - 9)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The undoing machine reverses the steps in reverse order: it subtracts $9$ first and then divides by $3$. Its rule is $f^{-1}(x)=\frac{x-9}{3}$.'
          - problem: 'A taxi fare is $F(d)=3+2d$ dollars for a ride of $d$ kilometres. Find the rule that gives the distance when the fare $x$ is known.'
            answer: '(x - 3)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the letters in $y=3+2x$ to get $x=3+2y$. Subtracting $3$ and dividing by $2$ gives $y=\frac{x-3}{2}$ kilometres.'
          - problem: 'If $f(x)=8-2x$, find $f^{-1}(x)$.'
            answer: '(8 - x)/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the letters in $y=8-2x$ to get $x=8-2y$. Then $2y=8-x$, so $f^{-1}(x)=\frac{8-x}{2}$.'
          - problem: 'The Fahrenheit temperature for $x$ degrees Celsius is $F(x)=\frac{9}{5}x+32$. Find the rule that gives the Celsius temperature for $x$ degrees Fahrenheit.'
            answer: '5(x - 32)/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the letters to get $x=\frac{9}{5}y+32$. Subtract $32$ and multiply by $\frac{5}{9}$ to get $y=\frac{5(x-32)}{9}$.'
        constraints: "linear rules; swap x and y, then solve for y; plain rules and word contexts where an output is known and the input is wanted"
      - id: kp2
        name: Verify inverses by composition
        key_prerequisites: [literal-equations, function-composition]
        exemplars:
          - problem: 'For $f(x)=3x-9$ and $g(x)=\frac{x+9}{3}$, simplify $f(g(x))$.'
            answer: 'x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $g(x)$ into $f$: $f(g(x))=3\cdot\frac{x+9}{3}-9=x+9-9$. This is $x$, so $g$ undoes $f$.'
          - problem: 'Let $f(x)=4x-8$ and $g(x)=\frac{x+8}{4}$. Do $f$ and $g$ undo each other?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","they are inverses","inverses"],["no","they are not inverses","not inverses"]]}
            solution_sketch: 'Compute $g(f(x))=\frac{(4x-8)+8}{4}=\frac{4x}{4}=x$, and $f(g(x))=4\cdot\frac{x+8}{4}-8=x$. Both orders return $x$, so the answer is yes.'
          - problem: 'Let $f(x)=2x+1$ and $g(x)=\frac{x-2}{2}$. Simplify $g(f(x))$.'
            answer: 'x - 1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $f(x)$ into $g$: $g(f(x))=\frac{(2x+1)-2}{2}=\frac{2x-1}{2}$. This simplifies to $x-\frac{1}{2}$, which is not $x$, so $g$ is not the inverse of $f$.'
          - problem: 'A division machine $f(x)=\frac{x}{3}$ is followed by a machine $g(x)=3x$. What is the output for the input $x$?'
            answer: 'x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The output is $g(f(x))=3\cdot\frac{x}{3}$. Multiplying by $3$ cancels the division by $3$ and returns $x$.'
          - problem: 'An encoder doubles a message $x$ and adds $3$, so $f(x)=2x+3$. A decoder $g(x)=\frac{x-5}{2}$ is applied to the encoded message. What does the decoder output?'
            answer: 'x - 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The decoder receives $2x+3$, so $g(f(x))=\frac{(2x+3)-5}{2}=\frac{2x-2}{2}$. This simplifies to $x-1$, so the decoder does not recover the message.'
          - problem: 'Do $f(x)=2x+5$ and $g(x)=\frac{x+5}{2}$ undo each other?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","they are inverses","inverses"],["no","they are not inverses","not inverses"]]}
            solution_sketch: 'Compute $g(f(x))=\frac{(2x+5)+5}{2}=\frac{2x+10}{2}=x+5$. The result is not $x$, so the answer is no.'
        constraints: "linear rules; a verification composes f and g and the result is x or a different rule; verdicts and word contexts with an encoder and a decoder"
      - id: kp3
        name: Inverses of functions with a division step
        key_prerequisites: [literal-equations]
        exemplars:
          - problem: 'If $f(x)=\frac{x+1}{2}$, find $f^{-1}(x)$.'
            answer: '2x - 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the letters in $y=\frac{x+1}{2}$ to get $x=\frac{y+1}{2}$. Multiplying by $2$ gives $2x=y+1$, so $f^{-1}(x)=2x-1$.'
          - problem: 'If $f(x)=\frac{x}{3}-2$, find $f^{-1}(x)$.'
            answer: '3x + 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the letters to get $x=\frac{y}{3}-2$. Adding $2$ gives $x+2=\frac{y}{3}$, and multiplying by $3$ gives $y=3x+6$.'
          - problem: 'If $f(x)=\frac{3x-4}{5}$, find $f^{-1}(x)$.'
            answer: '(5x + 4)/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the letters to get $x=\frac{3y-4}{5}$. Then $5x=3y-4$ and $5x+4=3y$, so $f^{-1}(x)=\frac{5x+4}{3}$.'
          - problem: 'An encoding machine uses $f(x)=\frac{x-3}{4}$. Find the decoding rule $f^{-1}(x)$.'
            answer: '4x + 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Decoding reverses the operations in reverse order: multiply the encoded value by $4$, then add $3$. This gives $f^{-1}(x)=4x+3$.'
          - problem: 'What is the inverse rule of $f(x)=4x-3$?'
            answer: '(x + 3)/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $y=4x-3$, the operations on $x$ are multiply by $4$ and then subtract $3$. The inverse first adds $3$ and then divides by $4$, so it is $\frac{x+3}{4}$.'
          - problem: 'Four friends split a restaurant bill that includes an $8$ dollar service charge, so each pays $p(x)=\frac{x+8}{4}$ dollars when the menu total is $x$ dollars. Find the rule that gives the menu total when each friend pays $x$ dollars.'
            answer: '4x - 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the letters to get $x=\frac{y+8}{4}$. Multiplying by $4$ gives $4x=y+8$, so the menu total is $4x-8$ dollars.'
          - problem: 'A fitness band converts $x$ steps to a distance of $d(x)=\frac{x}{1250}$ kilometres. Find the rule that gives the steps for a distance of $x$ kilometres.'
            answer: '1250x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the letters to get $x=\frac{y}{1250}$. Multiplying both sides by $1250$ gives $y=1250x$ steps.'
        constraints: "rules with a division step, or linear rules whose inverse needs one; integer coefficients; plain rules and word contexts"
    diagnostic_exemplar:
      problem: 'If $f(x) = \frac{2x + 1}{3}$, find $f^{-1}(x)$.'
      answer: "(3x - 1)/2"
      solution_sketch: 'Solve $y = \frac{2x + 1}{3}$ for $x$: $3y = 2x + 1$, so $x = \frac{3y - 1}{2}$; then swap the letters.'
    anki_seeds:
      - front: "To find the inverse of a function, swap x and y and then..."
        back: "solve for y."
        type: basic

  - id: evaluating-exponential-functions
    name: Evaluating Exponential Functions
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: integer-exponents-intro
        weight: 0.6
        key: true
      - id: negative-zero-exponents
        weight: 0.5
        key: true
      - id: function-notation
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Evaluate at whole-number inputs
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'If $f(x)=2^x$, find $f(3)$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The input $3$ is the exponent, so $f(3)=2^3$. Three factors of $2$ give $2\cdot2\cdot2=8$.'
          - problem: 'A table for $f(x)=3^x$ includes the input $0$. What output belongs in that row?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The input $0$ is the exponent, so $f(0)=3^0$. A nonzero base to the power $0$ is $1$, so the row records $1$.'
          - problem: 'The graph of $f(x)=5^x$ contains the point $(2,c)$. Find $c$.'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height at the input $2$ is $f(2)=5^2$. Two factors of $5$ give $5\cdot5=25$, so $c=25$.'
          - problem: 'A place-value machine outputs $10^x$ for the input $x$. What is its output for the input $4$?'
            answer: '10000'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The output is $10^4$, which has four factors of $10$. So the output is $10\cdot10\cdot10\cdot10=10000$.'
          - problem: 'A culture starts with one cell and doubles every hour, so it has $N(x)=2^x$ cells after $x$ hours. How many cells does it have after $6$ hours?'
            answer: '64'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $6$ hours the culture has $N(6)=2^6$ cells. Six factors of $2$ give $2\cdot2\cdot2\cdot2\cdot2\cdot2=64$ cells.'
          - problem: 'The number of cells in a culture is $N(x)=2^x$ after $x$ hours. How many times as many cells are there after $5$ hours as after $3$ hours?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $5$ hours there are $2^5=32$ cells, and after $3$ hours there are $2^3=8$ cells. Dividing, $32\div8=4$, so there are $4$ times as many cells.'
          - problem: 'For $f(x)=5^x$, find $f(3)$.'
            answer: '125'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The input $3$ is the exponent, so $f(3)=5^3$. Three factors of $5$ give $5\cdot5\cdot5=125$.'
        constraints: "bases 2, 3, 5, 10; exponents 0-6; plain evaluations, tables and graphs, and growth contexts that ask for a value or for how many times as large one value is"
      - id: kp2
        name: Negative inputs give fractions
        key_prerequisites: [negative-zero-exponents]
        try_first:
          problem: 'The outputs of $f(x)=2^x$ at the inputs $3$, $2$, $1$ and $0$ are $8$, $4$, $2$ and $1$. Each step to the left halves the output. What is $f(-1)$?'
          answer_contract: {"kind":"exact"}
          answer: '1/2'
          reveal: 'One more step to the left halves the output $1$, giving $\frac{1}{2}$. This agrees with $2^{-1}=\frac{1}{2}$, so a negative input gives a reciprocal.'
        exemplars:
          - problem: 'If $f(x)=2^x$, find $f(-2)$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The negative exponent takes a reciprocal, so $2^{-2}=\frac{1}{2^2}$. Since $2^2=4$, the value is $\frac{1}{4}$.'
          - problem: 'A table for $f(x)=10^x$ needs the row at the input $-3$. What output belongs in that row?'
            answer: '1/1000'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The negative exponent takes a reciprocal: $10^{-3}=\frac{1}{10^3}$. Since $10^3=1000$, the output is $\frac{1}{1000}$.'
          - problem: 'The graph of $f(x)=3^x$ includes the point $(-2,c)$. Find $c$.'
            answer: '1/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The input $-2$ is a negative exponent, so $c=3^{-2}=\frac{1}{3^2}$. Since $3\cdot3=9$, the value is $c=\frac{1}{9}$.'
          - problem: 'Each step to the left on the graph of $f(x)=5^x$ divides the output by $5$. Starting from $f(0)=1$, find $f(-1)$.'
            answer: '1/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One step to the left from $f(0)=1$ divides by $5$, so $f(-1)=\frac{1}{5}$. This agrees with $5^{-1}=\frac{1}{5}$.'
          - problem: 'The mass of a sample is $S(x)=2^x$ grams, $x$ hours after noon. What was its mass $3$ hours before noon?'
            answer: '1/8'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            solution_sketch: 'Three hours before noon is $x=-3$, so $S(-3)=2^{-3}=\frac{1}{2^3}$. Since $2^3=8$, the mass was $\frac{1}{8}$ gram.'
          - problem: 'For $f(x)=3^x$, how many times as large is $f(1)$ as $f(-1)$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $f(1)=3$ and $f(-1)=\frac{1}{3}$. Dividing, $3\div\frac{1}{3}=3\cdot3=9$, so $f(1)$ is $9$ times as large.'
          - problem: 'Evaluate $f(x)=4^x$ at $x=-2$. What is the value of $f(-2)$?'
            answer: '1/16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent takes a reciprocal, and the result is not negative. So $4^{-2}=\frac{1}{4^2}=\frac{1}{16}$.'
        constraints: "bases 2, 3, 4, 5, 10; exponents -1 to -4; answers are unit fractions; plain evaluations, graphs, tables, and contexts with a time before the start"
      - id: kp3
        name: Coefficients and fractional bases
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'If $g(x)=5\cdot2^x$, find $g(3)$.'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Evaluate the power first, since the exponent applies only to the base $2$: $2^3=8$. Then multiply by the coefficient: $5\cdot8=40$.'
          - problem: 'If $f(x)=\left(\frac{1}{2}\right)^x$, find $f(3)$.'
            answer: '1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent applies to the numerator and the denominator, so $\left(\frac{1}{2}\right)^3=\frac{1^3}{2^3}$. This is $\frac{1}{8}$.'
          - problem: 'A colony starts with $4$ insects and triples every week, so it has $P(x)=4\cdot3^x$ insects after $x$ weeks. How many insects are there after $2$ weeks?'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power is $3^2=9$, and the coefficient $4$ is the starting number. So $P(2)=4\cdot9=36$ insects.'
          - problem: 'A ball is dropped from $81$ centimetres and each bounce reaches one third of the previous height, so the height after $x$ bounces is $h(x)=81\cdot\left(\frac{1}{3}\right)^x$. What is the height after $3$ bounces?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The power is $\left(\frac{1}{3}\right)^3=\frac{1}{27}$. Then $h(3)=81\cdot\frac{1}{27}=3$, so the height is $3$ centimetres.'
          - problem: 'A medicine dose of $200$ milligrams loses half of its amount every hour, so the amount left after $x$ hours is $A(x)=200\cdot\left(\frac{1}{2}\right)^x$. How much is left after $3$ hours?'
            answer: '25'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"mg","allow_omitted":true}
            solution_sketch: 'The power is $\left(\frac{1}{2}\right)^3=\frac{1}{8}$, because each hour halves the amount. Then $A(3)=200\cdot\frac{1}{8}=25$, so $25$ milligrams are left.'
          - problem: 'If $f(x)=6\cdot\left(\frac{1}{2}\right)^x$, find $f(-2)$.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The negative exponent turns the fraction over, so $\left(\frac{1}{2}\right)^{-2}=2^2=4$. Then multiply by the coefficient: $f(-2)=6\cdot4=24$.'
          - problem: 'If $f(x)=2\cdot\left(\frac{1}{3}\right)^x$, find $f(2)$.'
            answer: '2/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power is $\left(\frac{1}{3}\right)^2=\frac{1}{9}$, because the exponent applies to both parts of the fraction. Then $f(2)=2\cdot\frac{1}{9}=\frac{2}{9}$.'
        constraints: "an integer coefficient 2-200 times a base power, or a unit-fraction base; exponents -2 to 4; plain evaluations and decay or growth contexts"
    diagnostic_exemplar:
      problem: 'If $g(x) = 3 \cdot 2^x$, find $g(-2)$.'
      answer: "3/4"
      solution_sketch: '$2^{-2} = \frac{1}{4}$, so $3 \cdot \frac{1}{4} = \frac{3}{4}$.'
    anki_seeds:
      - front: "For f(x) = a·b^x, f(0) = ?"
        back: "a (the initial value)."
        type: basic

  - id: exponential-functions
    name: Exponential Functions
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: evaluating-exponential-functions
        weight: 0.8
        key: true
      - id: negative-zero-exponents
        weight: 0.4
      - id: function-notation
        weight: 0.4
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Growth vs decay from the base"
        key_prerequisites: [evaluating-exponential-functions]
        constraints: "bases given as decimals or simple fractions, never 1"
        try_first:
          problem: 'A tree is $2$ m tall. Each year its height is multiplied by $1.5$. How many metres tall is the tree after $2$ years?'
          answer_contract: {"kind":"exact"}
          answer: '4.5'
          reveal: 'After one year the tree is $2\cdot1.5=3$ m tall, after two years $3\cdot1.5=4.5$ m. A base above $1$ makes every step larger, which is growth.'
        exemplars:
          - problem: 'Does $f(x)=6\cdot(0.6)^x$ model growth or decay?'
            answer: 'decay'
            answer_contract: {"kind": "label", "options": [["growth", "grow", "grows", "it grows", "it is growth", "it models growth", "exponential growth", "increase"], ["decay", "decays", "it decays", "it is decay", "it models decay", "exponential decay", "decrease", "decay model"]]}
            solution_sketch: 'The base is $0.6$, which lies between $0$ and $1$. Each unit step keeps only $0.6$ of the output, so $f$ models decay.'
          - problem: 'By what percent does the output of $f(x)=7\cdot(1.3)^x$ change for each increase of $1$ in $x$?'
            answer: '30%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each unit step multiplies the output by $1.3 = 1 + 0.30$. The output therefore rises by $30\%$ at every step.'
          - problem: 'A town models its population with $P(t)=4200\cdot(1.08)^t$, where $t$ is in years. By what percent does the population change each year?'
            answer: '8%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The base is $1.08 = 1 + 0.08$. Each year the population is $1.08$ times the year before, so it changes by $8\%$ a year.'
          - problem: 'The mass of a substance after $t$ hours is $m(t)=50\cdot(3/5)^t$ grams. What percent of its mass does the substance lose each hour?'
            answer: '40%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each hour the mass is multiplied by $3/5 = 0.6$. The substance keeps $60\%$ and loses the other $40\%$.'
          - problem: 'Does $f(x)=0.3\cdot2^x$ model growth or decay?'
            answer: 'growth'
            answer_contract: {"kind": "label", "options": [["growth", "grow", "grows", "it grows", "it is growth", "it models growth", "exponential growth", "increase"], ["decay", "decays", "it decays", "it is decay", "it models decay", "exponential decay", "decrease", "decay model"]]}
            solution_sketch: 'The base is $2$, not the coefficient $0.3$. Each unit step doubles the output, so $f$ models growth even though it starts small.'
          - problem: 'Give a value of $b$ for which $f(x)=5b^x$ models decay.'
            answer: '1/2'
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "0", "high": "1"}}
            solution_sketch: 'Decay needs a base between $0$ and $1$. The value $1/2$ works, because each step halves the output.'
          - problem: 'A savings balance follows $A(t)=2000\cdot(1.035)^t$, where $t$ is in years. By what percent does the balance change each year?'
            answer: '3.5%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The base is $1.035 = 1 + 0.035$. Each year the balance is multiplied by $1.035$, a change of $3.5\%$.'
          - problem: 'The price of an item after $n$ weeks is $p(n)=40\cdot(0.92)^n$ euros. By what percent does the price fall each week?'
            answer: '8%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each week the price is multiplied by $0.92 = 1 - 0.08$. The price therefore falls by $8\%$ a week.'
      - id: kp2
        name: "Initial value and growth factor"
        key_prerequisites: [evaluating-exponential-functions, function-notation]
        constraints: "models written as a times b^x with a and b both visible; a a whole number, b an integer or simple fraction"
        exemplars:
          - problem: 'What are the initial value and the growth factor of $f(x)=7\cdot3^x$?'
            answer: '(7, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=0$ the power is $3^0=1$, so $f(0)=7$ is the initial value. Each unit step multiplies the output by $3$, so the growth factor is $3$.'
          - problem: 'A decay model is $f(x)=200\cdot(1/2)^x$. By what factor is the output multiplied each time $x$ increases by $1$?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The base of the model is the factor for one unit step. Here it is $1/2$, so the output halves each time.'
          - problem: 'The algae in a pond after $d$ days weigh $A(d)=40\cdot1.5^d$ grams. How many grams of algae were in the pond at the start?'
            answer: '40'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The start of the model is the day $d=0$, and any base to the power $0$ is $1$, so $1.5^0=1$. Therefore $A(0)=40\cdot1=40$ grams of algae.'
          - problem: 'An exponential function has $f(0)=5$, $f(1)=15$ and $f(2)=45$. By what factor does the output multiply each time $x$ increases by $1$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide each output by the one before it. We get $15/5=3$ and $45/15=3$, so the factor is $3$.'
          - problem: 'The water level in a tank after $x$ hours follows $f(x)=a\cdot b^x$. The level is $48$ cm at $x=0$ and $36$ cm at $x=1$. Find $b$.'
            answer: '3/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The level at $x=1$ is $a\cdot b$ and the level at $x=0$ is $a=48$. So $b=36/48=3/4$.'
          - problem: 'For $f(x)=4\cdot5^x$, what is the value of $f(0)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x=0$ the power is $5^0=1$, not $5$. So the output is $f(0)=4\cdot1=4$.'
          - problem: 'A bank balance after $t$ years is $B(t)=1200\cdot(1.04)^t$ euros. By what factor is the balance multiplied each year?'
            answer: '1.04'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The base $1.04$ is the factor for one year. The balance grows by $4\%$ each year.'
          - problem: 'For $f(x)=a\cdot b^x$ with $b>0$, we know $f(0)=7$ and $f(2)=63$. Find $b$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x=0$ we get $a=7$. At $x=2$ we get $7b^2=63$, so $b^2=9$ and $b=3$ because $b>0$.'
      - id: kp3
        name: "Evaluate decay models"
        key_prerequisites: [evaluating-exponential-functions]
        constraints: "decay bases as simple fractions; exponents 1-3; coefficients chosen so the value stays a whole number"
        exemplars:
          - problem: 'If $f(x)=100\cdot(1/2)^x$, find $f(2)$.'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First raise the base to the power: $(1/2)^2=1/4$. Then multiply by the coefficient to get $f(2)=100\cdot\frac14=25$.'
          - problem: 'A sample of $80$ g follows $m(t)=80\cdot(3/4)^t$, where $t$ is in days. How much of the sample is left after $2$ days?'
            answer: '45'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'First raise the base to the power: $(3/4)^2=9/16$. Then $m(2)=80\cdot\frac9{16}=45$, so $45$ grams are left.'
          - problem: 'The point $(2,c)$ lies on the graph of $y=90\cdot(2/3)^x$. Find $c$.'
            answer: '40'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The point lies on the graph, so put $x=2$ into the rule. Then $c=90\cdot\frac49=10\cdot4=40$.'
          - problem: 'A machine bought for €128000 loses a quarter of its value each year, so its value is $V(t)=128000\cdot(3/4)^t$ euros. What is the value after $3$ years?'
            answer: '54000'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'First raise the base to the power: $(3/4)^3=27/64$. Then $128000\cdot\frac{27}{64}=2000\cdot27=54000$, so the machine is worth $54000$ euros.'
          - problem: 'A sample follows $m(t)=a\cdot(1/2)^t$ with $t$ in days. After $3$ days $12$ g remain. How many grams were there at the start?'
            answer: '96'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'After $3$ days the mass is $a\cdot(1/2)^3=a\cdot\frac18=12$. To undo the division by $8$ we multiply: $a=12\cdot8=96$ grams.'
          - problem: 'Evaluate $f(x)=36\cdot(1/3)^x$ at $x=2$. What is the value of $f(2)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The exponent means repeated multiplication of the whole fraction, not multiplication of the base by the exponent: $(1/3)^2=1/9$. So $f(2)=36\cdot\frac19=4$.'
          - problem: 'A delivery van is worth $V(t)=20000\cdot(4/5)^t$ euros after $t$ years. What is its value after $2$ years?'
            answer: '12800'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'First raise the base to the power: $(4/5)^2=16/25$. Then $20000\cdot\frac{16}{25}=800\cdot16=12800$, so the van is worth $12800$ euros.'
          - problem: 'A population is modeled by $f(x)=250\cdot(1/5)^x$. For which $x$ does $f(x)=10$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $(1/5)^x=10/250=1/25$, so the base must be raised to a power that gives $1/25$. Since $1/25=(1/5)^2$, the value is $x=2$.'
    diagnostic_exemplar:
      problem: 'If $f(x) = 64 \cdot \left(\frac{3}{4}\right)^x$, find $f(2)$.'
      answer: "36"
      solution_sketch: '$\left(\frac{3}{4}\right)^2 = \frac{9}{16}$, and $64 \cdot \frac{9}{16} = 36$.'
    anki_seeds:
      - front: "f(x) = a·b^x models decay when..."
        back: "0 < b < 1."
        type: basic

  - id: graphs-of-exponential-functions
    name: Graphs of Exponential Functions
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: exponential-functions
        weight: 0.7
        key: true
      - id: coordinate-plane
        weight: 0.4
      - id: reading-function-graphs
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "The y-intercept"
        key_prerequisites: [exponential-functions]
        constraints: "no vertical shifts, so the y-intercept of y = a times b^x is (0, a); answers as ordered pairs"
        exemplars:
          - problem: 'Find the $y$-intercept of $y=4.5\cdot(3/4)^x$.'
            answer: '(0, 4.5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=0$ the power is $(3/4)^0=1$. So $y=4.5$ and the intercept is $(0,4.5)$.'
          - problem: 'Where does the graph of $y=2^x$ cross the $y$-axis?'
            answer: '(0, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Every point on the $y$-axis has $x=0$, and $2^0=1$. So the graph crosses the $y$-axis at the point $(0,1)$.'
          - problem: 'A decay graph is $y=7\cdot(1/2)^x$. At which point does it meet the vertical axis?'
            answer: '(0, 7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The vertical axis has input $0$, and $(1/2)^0=1$. So $y=7$ and the point is $(0,7)$.'
          - problem: 'A cup of tea cools, and its temperature above room temperature is $D(t)=65\cdot(0.9)^t$ degrees Celsius after $t$ minutes. How many degrees above room temperature is the tea when it is poured?'
            answer: '65'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'Pouring is the time $t=0$, and $0.9^0=1$. So $D(0)=65$ degrees above room temperature.'
          - problem: 'The graph of $y=a\cdot3^x$ passes through the point $(1,15)$. At which point does it cross the $y$-axis?'
            answer: '(0, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=1$ we get $3a=15$, so $a=15/3=5$. The graph crosses the $y$-axis at $(0,5)$.'
          - problem: 'What is the $y$-intercept of $y=5\cdot3^x$?'
            answer: '(0, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=0$ the power is $3^0=1$, not $3$. So $y=5\cdot1=5$ and the intercept is $(0,5)$.'
          - problem: 'The balance of an account is $A(t)=1500\cdot(1.03)^t$ euros after $t$ years. At which point does the graph of $A$ meet the vertical axis?'
            answer: '(0, 1500)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The vertical axis has $t=0$, and $1.03^0=1$. So $A(0)=1500$ and the point is $(0,1500)$.'
          - problem: 'A culture of bacteria doubles every hour, and after $3$ hours it has $2400$ cells. It is modeled by $y=a\cdot2^x$, with $x$ in hours. At which point does the graph cross the $y$-axis?'
            answer: '(0, 300)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x=3$ we have $a\cdot8=2400$, so $a=2400/8=300$. The graph crosses the $y$-axis at $(0,300)$.'
      - id: kp2
        name: "Horizontal asymptote and range"
        key_prerequisites: [exponential-functions]
        constraints: "no vertical shifts; asymptote is always y = 0 at this level"
        exemplars:
          - problem: 'State the range of $y=7\cdot(1/3)^x$.'
            answer: 'y > 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A positive coefficient times a positive power is positive. Every positive height is reached, so the range is $y>0$.'
          - problem: 'Find the horizontal asymptote of the graph of $y=5\cdot2^x$.'
            answer: 'y = 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'As $x$ gets very negative, $2^x$ gets close to $0$. So the graph approaches the line $y=0$.'
          - problem: 'On the decay graph $y=4\cdot(1/2)^x$ the outputs come close to a horizontal line as $x$ grows. Which line is it?'
            answer: 'y = 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each unit step halves a positive height. The heights come close to $0$, so the line is $y=0$.'
          - problem: 'Does the graph of $y=5\cdot2^x$ ever touch the $x$-axis?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "yes, there is", "it does", "it can", "there is"], ["no", "no, it does not", "it does not", "it does not touch", "it does not touch the x-axis", "it never does", "never touches", "never"]]}
            solution_sketch: 'Every output $5\cdot2^x$ is positive, so $y$ is never $0$. The graph comes close to the $x$-axis but never touches it.'
          - problem: 'A sensor signal follows $y=3^x$ for all real inputs $x$. Which outputs can the signal take?'
            answer: 'y > 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every power $3^x$ is positive. The signal gets close to $0$ for very negative inputs and grows without bound, so its outputs are $y>0$.'
          - problem: 'A cup of tea cools, and its temperature above room temperature is $D(t)=65\cdot(0.9)^t$ degrees Celsius after $t$ minutes. After a long time, what value does $D$ come close to?'
            answer: '0'
            answer_contract: {"kind": "unit", "quantity": "temperature", "unit": "°C", "allow_omitted": true}
            solution_sketch: 'Each minute multiplies $D$ by $0.9$, which is less than $1$. Over a long time $D$ gets close to $0$ degrees.'
          - problem: 'Is there a point on the graph of $y=3^x$ with height $10$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "yes, there is", "it does", "it can", "there is"], ["no", "no, it does not", "it does not", "it does not touch", "it does not touch the x-axis", "it never does", "never touches", "never"]]}
            solution_sketch: 'The outputs of $3^x$ grow without bound and are never skipped. So a point with height $10$ exists, between $x=2$ and $x=3$.'
          - problem: 'A sample follows $m(t)=80\cdot(1/2)^t$ grams. After a very long time, how many grams does the mass come close to?'
            answer: '0'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'Each unit step halves the mass. After a long time the mass gets close to $0$ grams.'
          - problem: 'What is the range of $y=2^x$?'
            answer: 'y > 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inputs are all real numbers, but the range lists the outputs. Every power $2^x$ is positive, so the range is $y>0$.'
      - id: kp3
        name: "Increasing or decreasing"
        key_prerequisites: [exponential-functions, reading-function-graphs]
        constraints: "bases as decimals or simple fractions, never 1; b > 1 increasing, 0 < b < 1 decreasing; coefficients positive"
        exemplars:
          - problem: 'Is the graph of $y=6\cdot(0.4)^x$ increasing or decreasing?'
            answer: 'decreasing'
            answer_contract: {"kind": "label", "options": [["increasing", "rising", "rise", "rises", "goes up", "it increases", "it rises", "the graph rises"], ["decreasing", "falling", "fall", "falls", "goes down", "it decreases", "it falls", "the graph falls"]]}
            solution_sketch: 'The base is $0.4$, which lies between $0$ and $1$. Each unit step multiplies the output by $0.4$, so the graph is decreasing.'
          - problem: 'The number of subscribers of a channel after $t$ months is $s(t)=2000\cdot(1.15)^t$. Does the graph of $s$ rise or fall as $t$ grows?'
            answer: 'increasing'
            answer_contract: {"kind": "label", "options": [["increasing", "rising", "rise", "rises", "goes up", "it increases", "it rises", "the graph rises"], ["decreasing", "falling", "fall", "falls", "goes down", "it decreases", "it falls", "the graph falls"]]}
            solution_sketch: 'The base is $1.15$, which is greater than $1$. Each month multiplies the count by $1.15$, so the graph is increasing.'
          - problem: 'A curve $y=a\cdot b^x$ passes through the points $(0,15)$ and $(1,20)$. Find the base $b$.'
            answer: '4/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x=0$ we get $a=15$. At $x=1$ we get $15b=20$, so $b=20/15=4/3$.'
          - problem: 'Give a value of $b$ for which the graph of $y=5b^x$ falls as $x$ grows.'
            answer: '1/2'
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "0", "high": "1"}}
            solution_sketch: 'The graph falls when the base is between $0$ and $1$. The value $1/2$ works.'
          - problem: 'Give a whole number $b$ for which the graph of $y=2b^x$ rises as $x$ grows.'
            answer: '3'
            answer_contract: {"kind": "property", "check": "integer_in_range", "args": {"min": 2}}
            solution_sketch: 'The graph rises when the base is greater than $1$. The whole number $3$ works, since each step triples the output.'
          - problem: 'The concentration of a medicine in the blood is $c(t)=80\cdot(0.75)^t$ mg per litre after $t$ hours. By how many mg per litre does the concentration drop between $t=1$ and $t=2$?'
            answer: '15'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "mg", "allow_omitted": true}
            solution_sketch: 'At $t=1$ the concentration is $80\cdot0.75=60$. At $t=2$ it is $60\cdot0.75=45$, so it drops by $60-45=15$.'
          - problem: 'A curve $y=a\cdot b^x$ passes through the points $(0,81)$ and $(1,27)$. Find the base $b$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x=0$ we get $a=81$. At $x=1$ we get $81b=27$, so $b=27/81=1/3$.'
    diagnostic_exemplar:
      problem: 'Find the $y$-intercept of $y = 7 \cdot 3^x$.'
      answer: "(0, 7)"
      solution_sketch: 'At $x = 0$ any base gives $1$, so the intercept is the coefficient $7$.'
    anki_seeds:
      - front: "Horizontal asymptote of y = a·b^x (no shift)?"
        back: "y = 0"
        type: basic

  - id: percent-growth-decay-factors
    name: Percent Growth and Decay Factors
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: percentages
        weight: 0.7
        key: true
      - id: decimal-operations
        weight: 0.4
      - id: exponential-functions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Growth rate to growth factor"
        key_prerequisites: [percentages]
        constraints: "whole-percent rates between 1% and 50%"
        exemplars:
          - problem: 'A quantity grows $37\%$ per year. What is its yearly growth factor?'
            answer: '1.37'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The increase is $37/100=0.37$ of the original. The original stays, so the factor is $1+0.37=1.37$.'
          - problem: 'A price rises by $8\%$. By what number must the old price be multiplied to get the new price?'
            answer: '1.08'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new price is the old price plus $8\%$ of it. That is $1+0.08=1.08$ times the old price.'
          - problem: 'The population of a town is $25000$ and grows by $12\%$ in one year. How many people live in the town after that year?'
            answer: '28000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The original stays and $12\%$ of it is added, so the factor is $1+0.12=1.12$. The new population is $25000\cdot1.12=28000$ people.'
          - problem: 'After a $25\%$ price rise a bicycle costs €300. What did the bicycle cost before the rise?'
            answer: '240'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The new price is $1.25$ times the old price. So the old price is $300/1.25=240$ euros.'
          - problem: 'A population grows by $12\%$ each year. Write the base $b$ of its model $P(t)=P(0)\,b^t$.'
            answer: '1.12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each year the population keeps its $100\%$ and adds $12\%$ more. So the base is $b=112/100=1.12$.'
          - problem: 'A quantity grows $100\%$ per hour. What is its growth factor?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A growth of $100\%$ adds the whole original amount. So the factor is $1+1=2$, and the quantity doubles.'
          - problem: 'A school grows by $5\%$ in one year and now has $630$ students. How many students did it have a year ago?'
            answer: '600'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The new number is $1.05$ times the old number. So the old number is $630/1.05=600$ students.'
          - problem: 'A bank adds $3.5\%$ interest per year to a balance. By what number is the balance multiplied each year?'
            answer: '1.035'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interest is $3.5/100=0.035$ of the balance, and the balance itself stays. So the factor is $1+0.035=1.035$.'
      - id: kp2
        name: "Decay rate to decay factor"
        key_prerequisites: [percentages, decimal-operations]
        constraints: "whole-percent rates between 1% and 50%; the decay factor is 1 - r/100, given as an exact decimal"
        exemplars:
          - problem: 'A quantity shrinks $42\%$ per year. What is its yearly decay factor?'
            answer: '0.58'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The lost fraction is $42/100=0.42$ of the original. The quantity keeps the rest, so the factor is $1-0.42=0.58$.'
          - problem: 'A car loses $15\%$ of its value each year. By what number is its value multiplied each year?'
            answer: '0.85'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The car keeps $100\%-15\%=85\%$ of its value. As a multiplier that is $85/100=0.85$.'
          - problem: 'A machine worth €8000 loses $15\%$ of its value in one year. What is it worth after that year?'
            answer: '6800'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The machine loses $15\%$, so the factor is $1-0.15=0.85$. The new value is $8000\cdot0.85=6800$ euros.'
          - problem: 'After losing $20\%$ of its mass, a block weighs $360$ g. How many grams did it weigh before?'
            answer: '450'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'The block keeps $0.8$ of its mass, so $0.8\cdot m=360$. Then $m=360/0.8=450$ grams.'
          - problem: 'A decay model loses $22\%$ per step. Find its base $b$ in $Q(t)=Q(0)\,b^t$.'
            answer: '0.78'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Only $100-22=78$ percent of the quantity remains after each step. So the base is $b=78/100=0.78$.'
          - problem: 'A coat is on sale at $35\%$ off and costs €52. What was its price before the sale?'
            answer: '80'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The sale price is $1-0.35=0.65$ times the old price. So the old price is $52/0.65=80$ euros.'
          - problem: 'What is the decay factor of a $6\%$ decrease?'
            answer: '0.94'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The lost fraction is $6/100$, not $6/10$. The lost fraction is $0.06$, so the factor is $1-0.06=0.94$.'
          - problem: 'A town loses $2.5\%$ of its people each year. By what number is its population multiplied each year?'
            answer: '0.975'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The lost fraction is $2.5/100=0.025$ of the population. The town keeps the rest, so the factor is $1-0.025=0.975$.'
      - id: kp3
        name: "Read the rate from the factor"
        key_prerequisites: [percentages, exponential-functions]
        constraints: "factors given as exact decimal values from 0.05 to 2.5; the answer is a whole or half percent"
        exemplars:
          - problem: 'A quantity is multiplied by $1.35$ each period. By what percent does it grow each period?'
            answer: '35%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factor is $1+0.35$, so the added fraction is $0.35$. That is $35\%$ per period.'
          - problem: 'The value of an item is multiplied by $0.6$ each year. What percent of its value does the item lose each year?'
            answer: '40%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The item keeps $0.6$ of its value. It loses the other $1-0.6=0.4$, which is $40\%$.'
          - problem: 'A quantity has the yearly growth factor $1.5$. What is its yearly percent increase?'
            answer: '50%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factor $1.5$ contains the whole original, and the excess over it is $1.5-1=0.5$. As a percent that excess is $50\%$.'
          - problem: 'A retention factor is $0.75$. What percent is lost at each step?'
            answer: '25%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The step keeps $0.75$ of the quantity, so the lost fraction is $1-0.75=0.25$. As a percent that is $25\%$.'
          - problem: 'The population of a town grew from $800$ to $872$ in one year. By what percent did it grow?'
            answer: '9%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The increase is $872-800=72$. As a fraction of the start it is $72/800=0.09$, which is $9\%$.'
          - problem: 'A phone cost €500 and a year later it costs €425. By what percent did its price drop?'
            answer: '15%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The drop is $500-425=75$ euros. As a fraction of the old price it is $75/500=0.15$, which is $15\%$.'
          - problem: 'A quantity has the growth factor $1.04$. What is the percent increase?'
            answer: '4%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factor contains the whole original amount. The increase is $1.04-1=0.04$, which is $4\%$.'
          - problem: 'A quantity is multiplied by $2.2$ in each step. By what percent does it grow in each step?'
            answer: '120%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The factor $2.2$ contains the whole original, and the excess over it is $2.2-1=1.2$. As a percent that excess is $120\%$.'
    diagnostic_exemplar:
      problem: 'A model uses the yearly factor $0.85$; the quantity shrinks $r\%$ per year. Find $r$.'
      answer: "15"
      solution_sketch: 'A decay factor is $1 - \frac{r}{100}$, and $1 - 0.85 = 0.15$.'
    anki_seeds:
      - front: "Growth factor for an r% increase?"
        back: "1 + r/100"
        type: basic
      - front: "Decay factor for an r% decrease?"
        back: "1 - r/100"
        type: basic

  - id: exponential-growth-decay
    name: Exponential Growth and Decay
    core: true                 # promoted: prerequisite of differential-equations core topics
    difficulty: 0.75
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: exponential-functions
        weight: 0.8
        key: true
      - id: percent-growth-decay-factors
        weight: 0.6
        key: true
      - id: percentages
        weight: 0.3
      - id: multi-step-equations
        weight: 0.3
      - id: decimal-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Growth models with an integer growth factor
        key_prerequisites: [exponential-functions]
        constraints: "integer growth factors 2 or 3; times 1-4; the model is supplied or described in words; find the amount, the starting amount or the number of periods; answers are whole numbers"
        exemplars:
          - problem: 'A population of $500$ doubles every year: $P = 500 \cdot 2^t$. Find $P$ after $3$ years.'
            answer: "4000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three years are three doublings, so the factor is $2^3 = 8$. The population is $500 \cdot 8 = 4000$.'
          - problem: 'A culture of $200$ bacteria triples every hour. How many bacteria are there after $2$ hours?'
            answer: "1800"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two hours are two triplings, so the factor is $3^2 = 9$. The culture holds $200 \cdot 9 = 1800$ bacteria.'
          - problem: 'A bacteria colony doubles every hour. After $4$ hours it has $4800$ cells. How many cells were there at the start?'
            answer: "300"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four doublings multiply the start by $2^4 = 16$. Undo this by dividing: $4800 / 16 = 300$ cells at the start.'
          - problem: 'Duckweed covers $5$ square metres of a pond and triples its area every day. After how many days does it cover $405$ square metres?'
            answer: "4"
            answer_contract: {"kind":"unit","quantity":"time","unit":"day","allow_omitted":true}
            solution_sketch: 'The area must grow by the factor $405 / 5 = 81$. Since $81 = 3^4$, that takes $4$ days of tripling.'
          - problem: 'Colony A starts with $400$ cells and doubles every hour. Colony B starts with $50$ cells and triples every hour. Which colony is larger after $4$ hours?'
            answer: "colony A"
            answer_contract: {"kind":"label","options":[["colony A","A","colony A is larger","colony A is bigger","A is larger","A is bigger","the first colony"],["colony B","B","colony B is larger","colony B is bigger","B is larger","B is bigger","the second colony"],["they are equal","equal","the same","same size","neither"]]}
            solution_sketch: 'Colony A has $400 \cdot 2^4 = 400 \cdot 16 = 6400$ cells. Colony B has $50 \cdot 3^4 = 50 \cdot 81 = 4050$ cells, so colony A is larger.'
          - problem: 'A colony of $150$ cells doubles every hour. How many cells does it have after $3$ hours?'
            answer: "1200"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three doublings multiply by $2^3 = 8$, not by $2 \cdot 3$. The colony has $150 \cdot 8 = 1200$ cells.'
          - problem: 'The graph of $P(t) = 300 \cdot 2^t$ passes through the point $(4, c)$. Find $c$.'
            answer: "4800"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point lies on the graph, so $c = P(4)$. With $2^4 = 16$ this is $c = 300 \cdot 16 = 4800$.'
          - problem: 'A colony starts with $50$ cells and triples every hour: $P(t) = 50 \cdot 3^t$. Find $P(3)$.'
            answer: "1350"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three hours give the factor $3^3 = 27$. So $P(3) = 50 \cdot 27 = 1350$ cells.'
          - problem: 'An insect population triples every month. How many times larger is it after $4$ months than at the start?'
            answer: "81"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each month multiplies the population by $3$. Over four months the factor is $3^4 = 81$, whatever the starting size.'
      - id: kp2
        name: Decay models and half-life
        key_prerequisites: [exponential-functions, percentages]
        constraints: "half-life models with base 1/2 and exponent t/h; elapsed times are whole multiples of the half-life; find the amount left, the starting amount, the elapsed time or the half-life; EUR values or metric masses"
        try_first:
          problem: 'A $64$ g sample loses half of its mass every day. How many grams are left after $3$ days?'
          answer_contract: {"kind":"exact"}
          answer: '8'
          reveal: 'Halving three times gives $64 \to 32 \to 16 \to 8$, which is multiplying by $\left(\frac12\right)^3 = \frac18$. A half-life model counts how many halvings fit into the elapsed time.'
        exemplars:
          - problem: 'An $80$ mg sample halves every $5$ days. How much remains after $10$ days?'
            answer: "20"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"mg","allow_omitted":true}
            solution_sketch: 'Ten days are $10 / 5 = 2$ half-lives. Halving twice gives $80 \to 40 \to 20$ mg.'
          - problem: 'A car worth €20000 loses half its value every $4$ years: $V = 20000 \cdot \left(\frac{1}{2}\right)^{t/4}$. Find its value after $8$ years.'
            answer: "5000"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'At $t = 8$ the exponent is $8/4 = 2$, so the factor is $\left(\frac12\right)^2 = \frac14$. The car is worth $20000 / 4 = 5000$ euros.'
          - problem: 'A medicine has a half-life of $6$ hours. A patient''s blood holds $96$ mg of it. How long does it take until only $12$ mg remain?'
            answer: "18"
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'The amount must fall by the factor $96 / 12 = 8 = 2^3$, which is $3$ halvings. Three half-lives take $3 \cdot 6 = 18$ hours.'
          - problem: 'A $400$ g sample of a radioactive isotope shrinks to $50$ g in $15$ days. What is its half-life?'
            answer: "5"
            answer_contract: {"kind":"unit","quantity":"time","unit":"day","allow_omitted":true}
            solution_sketch: 'The mass fell by the factor $400 / 50 = 8 = 2^3$, so $3$ half-lives passed. Each half-life is $15 / 3 = 5$ days.'
          - problem: 'An isotope has a half-life of $4$ years. After $12$ years, $30$ g of it remain. How much was there at the start?'
            answer: "240"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            solution_sketch: 'Twelve years are $12 / 4 = 3$ half-lives, so the start was multiplied by $\frac18$. Undo this by multiplying: $30 \cdot 8 = 240$ g.'
          - problem: 'A $160$ mg sample of a substance has a half-life of $2$ days. How much remains after $4$ days?'
            answer: "40"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"mg","allow_omitted":true}
            solution_sketch: 'Each half-life halves what is left, not the original amount. Four days are $2$ half-lives, so $160 \to 80 \to 40$ mg remain.'
          - problem: 'A substance decays according to $m(t) = 200\left(\frac{1}{2}\right)^{t/4}$, where $m$ is in milligrams and $t$ in days. Find $m(12)$.'
            answer: "25"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"mg","allow_omitted":true}
            solution_sketch: 'Day $12$ contains $12/4 = 3$ half-lives, so the factor is $\frac18$. Thus $m(12) = 200 / 8 = 25$ mg.'
          - problem: 'What percent of a radioactive sample remains after $4$ half-lives?'
            answer: "6.25%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four halvings leave $\left(\frac12\right)^4 = \frac{1}{16}$ of the sample. As a percent, $\frac{100}{16} = 6.25\%$ remains.'
          - problem: 'A van''s value is modelled by $V(t) = 30000\left(\frac{1}{2}\right)^{t/5}$ euros, with $t$ in years. What is the van worth after $15$ years?'
            answer: "3750"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Fifteen years are $15/5 = 3$ half-lives, so the factor is $\frac18$. The van is worth $30000 / 8 = 3750$ euros.'
      - id: kp3
        name: Percent growth and decay factors
        key_prerequisites: [percent-growth-decay-factors]
        constraints: "the percent factor is supplied as a decimal base or the rate is described in words; exponents 1-3; find the amount, the starting amount or the overall percent change; values chosen so answers are exact"
        exemplars:
          - problem: 'A €1000 investment grows $10\%$ per year: $A = 1000 \cdot (1.1)^t$. Find its value after $2$ years.'
            answer: "1210"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Two years give the factor $1.1^2 = 1.21$. The investment is worth $1000 \cdot 1.21 = 1210$ euros.'
          - problem: 'A town of $8000$ people shrinks by $25\%$ per year: $P = 8000 \cdot (0.75)^t$. Find the population after $2$ years.'
            answer: "4500"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two years give the factor $0.75^2 = 0.5625$. The population is $8000 \cdot 0.5625 = 4500$.'
          - problem: 'A laptop bought for €1200 loses $15\%$ of its value each year. What is it worth after $2$ years?'
            answer: "867"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Losing $15\%$ keeps $85\%$, so the yearly factor is $0.85$ and two years give $0.85^2 = 0.7225$. The laptop is worth $1200 \cdot 0.7225 = 867$ euros.'
          - problem: 'A savings account grows by $10\%$ per year and holds €3993 after $3$ years. How much was paid in at the start?'
            answer: "3000"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Three years multiply the deposit by $1.1^3 = 1.331$. Undo this by dividing: $3993 / 1.331 = 3000$ euros.'
          - problem: 'A town of $5000$ people grows by $20\%$ per year. What is its population after $3$ years?'
            answer: "8640"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The yearly factor is $1.2$, so three years give $1.2^3 = 1.728$. The population is $5000 \cdot 1.728 = 8640$.'
          - problem: 'A price rises by $20\%$ one year and falls by $20\%$ the next. Is the final price higher than, lower than, or the same as the original price?'
            answer: "lower"
            answer_contract: {"kind":"label","options":[["lower","it is lower","the price is lower","lower than the original","lower than the original price","lower than original","less"],["higher","it is higher","higher than the original","higher than original","more"],["the same","same","it is the same","the same as the original","unchanged"]]}
            solution_sketch: 'The two factors multiply: $1.2 \cdot 0.8 = 0.96$. The final price is $96\%$ of the original, so it is lower.'
          - problem: 'A population of $10000$ falls by $10\%$ per year. What is the population after $3$ years?'
            answer: "7290"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each yearly loss is $10\%$ of what is left, not of the original. The factor is $0.9^3 = 0.729$, so the population is $10000 \cdot 0.729 = 7290$.'
          - problem: 'Evaluate $Q(3)$ for $Q(t) = 6400(0.75)^t$.'
            answer: "2700"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three periods give the factor $0.75^3 = 0.421875$. So $Q(3) = 6400 \cdot 0.421875 = 2700$.'
          - problem: 'A painting gains $10\%$ in value each year. By what percent has its value increased after $2$ years?'
            answer: "21%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two years multiply the value by $1.1^2 = 1.21$. That is $121\%$ of the original, an increase of $21\%$.'
    diagnostic_exemplar:
      problem: 'A $600$ mg sample halves every $4$ years: $m(t) = 600 \cdot \left(\frac{1}{2}\right)^{t/4}$. How many milligrams remain after $12$ years?'
      answer: "75 mg"
      solution_sketch: '$12$ years is three half-lives: $600 \to 300 \to 150 \to 75$.'
    anki_seeds:
      - front: "Exponential model with percent rate r per period:"
        back: "A = A₀(1 + r)^t for growth; A = A₀(1 − r)^t for decay"
        type: basic
      - front: "Half-life model: the amount left after time t is..."
        back: "A₀ · (1/2)^(t/h), where h is the half-life"
        type: basic

  - id: compound-interest
    name: Compound Interest
    # Phase C flip back to core: continuous-growth-model now builds on discrete
    # compounding (the (1 + r/n)^{nt} ladder is the limit story behind Pe^{rt}),
    # so the W8 "applications leaf" rationale dissolved.
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: percent-growth-decay-factors
        weight: 0.7
        key: true
      - id: exponential-growth-decay
        weight: 0.5
      - id: decimal-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Annual compounding
        key_prerequisites: [percent-growth-decay-factors]
        exemplars:
          - problem: 'Invest €2000 at $10\%$ compounded annually. What is the balance after $2$ years?'
            answer: '2420'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Each year the balance is multiplied by $1.10$. After two years the balance is $2000\cdot1.1^2=2000\cdot1.21=2420$ euros.'
          - problem: 'An account starts at €500 and earns $20\%$ interest each year, added to the balance. How much is in the account after $3$ years?'
            answer: '864'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Each year multiplies the balance by $1.2$, so three years multiply it by $1.2^3=1.728$. The balance is $500\cdot1.728=864$ euros.'
          - problem: 'The balance of an account with annual compounding is $A(t)=800(1.15)^t$ euros after $t$ years. Find $A(2)$.'
            answer: '1058'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Put $t=2$ into the formula, since the question asks about the balance after two years. Then $1.15^2=1.3225$, so $A(2)=800\cdot1.3225=1058$ euros.'
          - problem: 'An account earns $10\%$ interest compounded annually. After $2$ years it holds €1452. How much was deposited at the start?'
            answer: '1200'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Two years multiplied the deposit by $1.1^2=1.21$. To undo that, divide: $1452\div1.21=1200$ euros.'
          - problem: 'A deposit of €1000 earns $10\%$ interest compounded annually. After how many years does the balance reach €1331?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each year multiplies the balance by $1.1$, giving €1100, then €1210, then €1331. So it takes $3$ years.'
          - problem: '€800 is invested at $5\%$ compounded annually. How much interest has it earned after $2$ years?'
            answer: '82'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The balance is $800\cdot1.05^2=800\cdot1.1025=882$ euros. The interest is the balance minus the deposit, $882-800=82$ euros.'
          - problem: '€1500 is put in an account at $12\%$ interest compounded annually. What is the balance after $2$ years?'
            answer: '1881.60'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The second year earns interest on the first year''s interest. After year one the balance is €1680, and year two adds $0.12\cdot1680=201.60$, so the balance is €1881.60.'
        constraints: 'rates and durations chosen so answers are exact euro amounts; includes finding the deposit or the number of years from a balance'
      - id: kp2
        name: Compounding several times per year
        key_prerequisites: [percent-growth-decay-factors, exponential-growth-decay]
        try_first:
          problem: 'An account pays $10\%$ a year, but it is added in two parts: $5\%$ after six months and $5\%$ after twelve months, each time on the current balance. Starting from €100, how much is in the account after one year?'
          answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
          answer: '110.25'
          reveal: 'The first $5\%$ raises €100 to €105, and the second $5\%$ is paid on €105, giving $105\cdot1.05=110.25$. Adding interest more often earns interest on interest sooner.'
        exemplars:
          - problem: 'Invest €1000 at $8\%$ compounded semiannually. What is the balance after $1$ year?'
            answer: '1081.60'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Each half-year applies $8\%/2=4\%$, so the balance is multiplied by $1.04$ twice. That gives $1000\cdot1.04^2=1081.60$ euros.'
          - problem: 'An account starts at €400 with a nominal annual rate of $10\%$, compounded twice a year. What is the balance after $1$ year?'
            answer: '441'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The rate for each half-year is $0.10/2=0.05$. Two updates give $400\cdot1.05=420$, then $420\cdot1.05=441$ euros.'
          - problem: 'A semiannual account follows $A(t)=2000\left(1+\frac{0.12}{2}\right)^{2t}$ euros, where $t$ is in years. Find $A(1)$.'
            answer: '2247.20'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Put $t=1$, so there are $2$ periods at $6\%$ each. Then $A(1)=2000\cdot1.06^2=2000\cdot1.1236=2247.20$ euros.'
          - problem: '€1600 is invested at a nominal annual rate of $20\%$, compounded quarterly. What is the balance after $1$ year?'
            answer: '1944.81'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Each quarter multiplies the balance by $1+0.20/4=1.05$. Four quarters give $1600\cdot1.05^4=1944.81$ euros.'
          - problem: 'An account pays a nominal annual rate of $8\%$, compounded semiannually. After $1$ year it holds €2163.20. How much was deposited?'
            answer: '2000'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'In one year the deposit is multiplied by $1.04^2=1.0816$. To undo that, divide: $2163.20\div1.0816=2000$ euros.'
          - problem: 'How much more interest does €1000 earn in one year at $10\%$ compounded semiannually than at $10\%$ compounded annually?'
            answer: '2.50'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Annual compounding gives $1000\cdot1.1=1100$, so €100 of interest. Semiannual compounding gives $1000\cdot1.05^2=1102.50$, so €102.50 of interest, which is €2.50 more.'
          - problem: '€500 is invested at a nominal annual rate of $20\%$ compounded twice a year. What is the balance after $1$ year?'
            answer: '605'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Each half-year period earns half the annual rate, $20\%/2=10\%$, not the full $20\%$. So the balance is $500\cdot1.1^2=605$ euros.'
        constraints: 'A = P(1 + r/n)^(nt) with n = 2 or 4; rate and term chosen so the balance is exact to the cent; includes finding the deposit and comparing compounding schedules'
      - id: kp3
        name: Write the compound interest model
        key_prerequisites: [percent-growth-decay-factors]
        exemplars:
          - problem: 'Write an expression for the balance of €300 invested at $6\%$ compounded monthly for $5$ years.'
            answer: '300*(1.005)^60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The monthly rate is $0.06/12=0.005$, so each month multiplies the balance by $1.005$. In $5$ years there are $12\cdot5=60$ months, so the balance is $300(1.005)^{60}$.'
          - problem: 'Write an expression for the balance of €900 invested at $4\%$ compounded quarterly for $3$ years.'
            answer: '900*(1.01)^12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quarterly rate is $0.04/4=0.01$, so each quarter multiplies the balance by $1.01$. In $3$ years there are $4\cdot3=12$ quarters, so the balance is $900(1.01)^{12}$.'
          - problem: 'An account has a principal of €500, a nominal annual rate of $12\%$ and interest added $12$ times a year. Write an expression for its balance after $2$ years.'
            answer: '500*(1.01)^24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate for each month is $0.12/12=0.01$ and there are $12\cdot2=24$ periods. So the balance is $500(1.01)^{24}$.'
          - problem: '€700 is invested at a nominal annual rate of $8\%$, compounded quarterly. Write an expression for the balance after $4$ years.'
            answer: '700*(1.02)^16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each quarter earns $0.08/4=0.02$, so the factor is $1.02$. Over $4\cdot4=16$ quarters the balance is $700(1.02)^{16}$.'
          - problem: 'A bank pays $3\%$ a year, compounded monthly. By what factor is the balance multiplied each month?'
            answer: '1.0025'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The monthly rate is $0.03/12=0.0025$. Each month the balance is multiplied by $1+0.0025=1.0025$.'
          - problem: 'An account compounds semiannually at $6\%$ a year. Write an expression for the balance of an €800 deposit after $18$ months.'
            answer: '800*(1.03)^3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each half-year earns $6\%/2=3\%$, so the factor is $1.03$. Eighteen months are $3$ half-years, so the balance is $800(1.03)^3$.'
          - problem: 'The balance of an account is $2500(1.015)^{20}$ euros after $5$ years, with interest compounded quarterly. What is the nominal annual rate?'
            answer: '6%'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four periods a year for $5$ years make $20$ periods, which matches the exponent. Each quarter earns $1.5\%$, so the nominal annual rate is $4\cdot1.5\%=6\%$.'
        constraints: 'monthly (n = 12), quarterly (n = 4) or semiannual (n = 2); the answer is the unevaluated expression with r/n and nt already simplified, or the periodic factor, or the nominal rate read from an expression'
    diagnostic_exemplar:
      problem: 'Invest €1000 at $20\%$ compounded semiannually. Find the balance after $2$ years.'
      answer: "€1464.10"
      solution_sketch: 'Semiannual compounding gives $4$ periods at $10\%$: $1000(1.1)^4 = 1000 \times 1.4641$.'
    anki_seeds:
      - front: "Compound interest formula (n compoundings per year)?"
        back: "A = P·(1 + r/n)^{nt}"
        type: basic

  - id: exponential-equations-same-base
    name: Exponential Equations with a Common Base
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: evaluating-exponential-functions
        weight: 0.7
        key: true
      - id: integer-exponents-intro
        weight: 0.4
      - id: one-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Recognize the right power
        key_prerequisites: [evaluating-exponential-functions]
        exemplars:
          - problem: 'Solve $2^x=16$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply $2$ by itself: $2\cdot2\cdot2\cdot2=16$, so $16=2^4$. Equal powers of $2$ have equal exponents, so $x=4$.'
          - problem: 'Solve $3^x=27$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $3\cdot3\cdot3=27$, we have $27=3^3$. The equation becomes $3^x=3^3$, and equal powers of $3$ have equal exponents, so $x=3$.'
          - problem: 'A sheet of paper is folded in half again and again, and each fold doubles the number of layers. After how many folds are there $32$ layers?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $x$ folds there are $2^x$ layers, so $2^x=32$. Since $2^5=32$, it takes $5$ folds.'
          - problem: 'A $64$ g sample of a substance loses half of its mass every day. After how many days is $1$ g left?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each day halves the mass, so going from $64$ g to $1$ g means dividing by $2$ some number of times $x$. That gives $2^x=64$, and $2^6=64$, so it takes $6$ days.'
          - problem: 'A message is shared so that the number of people who have seen it multiplies by $5$ every hour. One person sends it at hour $0$. At which hour have $625$ people seen it?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $x$ hours the count is $5^x$, so $5^x=625$. Since $5\cdot5\cdot5\cdot5=625$, we get $x=4$.'
          - problem: 'Solve $10^x=10000$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $10000$ has four zeros, so $10000=10^4$. Matching exponents gives $x=4$.'
          - problem: 'Solve $2^x=32$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The unknown is an exponent, not a factor, so dividing by $2$ does not isolate it. Since $32=2^5$, matching exponents gives $x=5$.'
        constraints: 'bases 2, 3, 4, 5, 10; integer solutions 3..6, including doubling and growth contexts'
      - id: kp2
        name: Solutions of zero and negative values
        key_prerequisites: [evaluating-exponential-functions]
        exemplars:
          - problem: 'Solve $5^x=1$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Any nonzero base raised to the power $0$ is $1$. So $5^x=5^0$ and $x=0$.'
          - problem: 'Solve $2^x=\frac{1}{8}$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $8=2^3$, the reciprocal is $\frac{1}{8}=2^{-3}$. The equation becomes $2^x=2^{-3}$, so matching exponents gives $x=-3$.'
          - problem: 'A culture of cells doubles every hour and holds $1600$ cells now. Let $x$ be the time in hours from now, so $x=-1$ means one hour ago. Find $x$ when the culture held $100$ cells.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The count at time $x$ is $1600\cdot2^x$, so $1600\cdot2^x=100$ and $2^x=\frac{1}{16}$. Since $\frac{1}{16}=2^{-4}$, we get $x=-4$, which is four hours ago.'
          - problem: 'A length of $10^x$ metres is exactly one millimetre. Find $x$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One millimetre is $0.001$ m, which is $\frac{1}{1000}=10^{-3}$ m. So $10^x=10^{-3}$ and $x=-3$.'
          - problem: 'Solve $3^x=\frac{1}{9}$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $9=3^2$, the reciprocal is $\frac{1}{9}=3^{-2}$. The equation becomes $3^x=3^{-2}$, so matching exponents gives $x=-2$.'
          - problem: 'Solve $2^x=\frac{1}{16}$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation asks for $\frac{1}{16}$, not $16$. A reciprocal has a negative exponent, so $\frac{1}{16}=2^{-4}$ and $x=-4$.'
          - problem: 'Solve $7^x=\frac{1}{7}$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reciprocal of $7$ is $7^{-1}$, because a negative exponent means one divided by the power. So $7^x=7^{-1}$ and $x=-1$.'
        constraints: 'right side is 1 or a unit fraction; solutions are 0 or negative integers -1 to -4'
      - id: kp3
        name: Larger bases and powers
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Solve $5^x=3125$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide $3125$ by $5$ repeatedly: $625$, $125$, $25$, $5$, $1$. That takes five steps, so $3125=5^5$ and $x=5$.'
          - problem: 'Solve $4^x=64$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $4\cdot4\cdot4=64$, we have $64=4^3$. The equation becomes $4^x=4^3$, so matching exponents gives $x=3$.'
          - problem: 'A colony starts as one cell and multiplies by $5$ at each stage. At which stage does it have $625$ cells?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The counts are $5$, $25$, $125$, $625$ at stages $1$, $2$, $3$, $4$. So $5^x=625$ gives $x=4$.'
          - problem: 'Write one million as a power of $10$.'
            answer: '10^6'
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'One million is $1000\cdot1000=10^3\cdot10^3$. When powers of the same base are multiplied, the exponents add: $3+3=6$. So one million is $10^6$.'
          - problem: 'A warehouse holds $4096$ boxes. The boxes are split into $4$ equal piles, each pile is split into $4$ equal piles again, and so on until every pile is a single box. How many splitting rounds does this take?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $x$ rounds each pile holds $4096\div4^x$ boxes, so a single box means $4^x=4096$. Since $4^6=4096$, it takes $6$ rounds.'
          - problem: 'Solve $10^x=100000$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $100000$ has five zeros, so $100000=10^5$. Matching exponents gives $x=5$.'
          - problem: 'Solve $5^x=15625$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The unknown is an exponent, so dividing the numbers does not give it. Divide $15625$ by $5$ repeatedly: $3125$, $625$, $125$, $25$, $5$, $1$. That takes six steps, so $15625=5^6$ and $x=6$.'
        constraints: 'bases 4, 5, 10 with the right side a larger power of the base; integer solutions 3-6'
    diagnostic_exemplar:
      problem: 'Solve $3^x = \frac{1}{27}$.'
      answer: "x = -3"
      solution_sketch: '$\frac{1}{27} = 3^{-3}$, so the exponents match.'
    anki_seeds:
      - front: "If b^x = b^y (b > 0, b ≠ 1), then..."
        back: "x = y."
        type: basic

  - id: exponential-equations
    name: Solving Exponential Equations
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: exponential-equations-same-base
        weight: 0.8
        key: true
      - id: power-rule-exponents
        weight: 0.5
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.4
      - id: two-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Rewrite one side to a common base
        key_prerequisites: [power-rule-exponents]
        exemplars:
          - problem: 'Solve $4^x=32$.'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write both sides with base $2$: $4^x=(2^2)^x=2^{2x}$ and $32=2^5$. Then $2x=5$, so $x=5/2$.'
          - problem: 'Solve $2^x=8^2$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Rewrite $8^2=(2^3)^2=2^6$, since a power of a power multiplies exponents. Matching exponents gives $x=6$.'
          - problem: 'A culture multiplies by $8$ every hour. How long does it take to grow by a factor of $4$?'
            answer: '2/3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'After $x$ hours the factor is $8^x=2^{3x}$, and we need $2^{3x}=4=2^2$. So $3x=2$ and $x=2/3$ of an hour, which is $40$ minutes.'
          - problem: 'Solve $32^x=8$.'
            answer: '3/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With base $2$, $32^x=2^{5x}$ and $8=2^3$. Matching the exponents gives $5x=3$, so $x=3/5$. This is less than $1$ because $8$ is less than $32^1$.'
          - problem: 'The population of a town multiplies by $9$ every decade. After how many decades is it $27$ times as large?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $x$ decades the factor is $9^x=3^{2x}$, and we need $3^{2x}=27=3^3$. So $2x=3$ and $x=3/2$ decades.'
          - problem: 'Solve $16=8^x$.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write both numbers as powers of $2$: $16=2^4$ and $8^x=(2^3)^x=2^{3x}$. Matching the exponents gives $3x=4$, so $x=4/3$.'
          - problem: 'Solve $9^x=27$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base $9$ is $3^2$, so $9^x=3^{2x}$ and not $3^x$. Then $2x=3$, so $x=3/2$.'
        constraints: 'one side is already a power of the base or both are powers of one small base; solutions may be fractions with denominator 2, 3 or 5'
      - id: kp2
        name: Exponents that are expressions
        key_prerequisites: [exponential-equations-same-base, two-step-equations]
        exemplars:
          - problem: 'Solve $3^{x+2}=81$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $81=3^4$, the equation is $3^{x+2}=3^4$. Matching the exponents gives $x+2=4$, so $x=2$.'
          - problem: 'Solve $5^{2x}=125$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $125=5^3$, the equation is $5^{2x}=5^3$. Matching the exponents gives $2x=3$, so $x=3/2$.'
          - problem: 'Solve $4^{x-1}=64$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $64=4^3$, the equation is $4^{x-1}=4^3$. Matching the exponents gives $x-1=3$, so $x=4$.'
          - problem: 'The number of bacteria in a dish after $t$ hours is $N(t)=2^{3t}$. When are there $512$ bacteria?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $2^{3t}=512$ and write $512$ as a power of $2$. Since $512=2^9$, we get $3t=9$, so $t=3$ hours.'
          - problem: 'The mass of a sample after $t$ hours is $m(t)=2^{6-t}$ grams. At what time is the mass $32$ g?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $2^{6-t}=32$ and write $32=2^5$. Then $6-t=5$, so $t=1$ hour after the start.'
          - problem: 'The value of an investment after $t$ years is $V(t)=10^{2t+1}$ euros. When is it worth €1000000?'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $10^{2t+1}=1000000$ and write $1000000=10^6$. Then $2t+1=6$, so $2t=5$ and $t=5/2$ years.'
          - problem: 'Solve $3^{1-2x}=\frac{1}{27}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\frac{1}{27}=3^{-3}$, the equation is $3^{1-2x}=3^{-3}$. Matching the exponents gives $1-2x=-3$, so $-2x=-4$ and $x=2$.'
          - problem: 'Solve $5^{x+1}=125$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $125=5^3$, the equation is $x+1=3$. Subtract $1$ from $3$, so $x=2$.'
        constraints: 'the exponent is linear in x (x + c, kx, or c - kx); the other side rewrites to the common base; small integer or half-integer solutions'
      - id: kp3
        name: Rewrite both sides to a common base
        key_prerequisites: [power-rule-exponents]
        exemplars:
          - problem: 'Solve $25^x=125^{x-1}$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write both sides with base $5$: $5^{2x}=5^{3(x-1)}$. Matching the exponents gives $2x=3x-3$, so $x=3$.'
          - problem: 'Find the input where the curves $y=8^x$ and $y=4^{x+1}$ meet.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At a meeting point the heights are equal. In base $2$ the exponents are $3x$ and $2(x+1)$, so $3x=2x+2$ and $x=2$.'
          - problem: 'Solve $4^{x+1}=8^{x-1}$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In base $2$ we get $2(x+1)=3(x-1)$. Expanding the brackets gives $2x+2=3x-3$, so $x=5$.'
          - problem: 'Solve $9^x=3^{x+4}$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $9^x=3^{2x}$ and the right side already has base $3$, we get $2x=x+4$. So $x=4$.'
          - problem: 'Culture A has $16^t$ cells after $t$ hours and culture B has $8^{t+2}$ cells. At what time do they have the same number of cells?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In base $2$ the counts are $2^{4t}$ and $2^{3(t+2)}$. So $4t=3t+6$ and $t=6$ hours.'
          - problem: 'Solve $8^{x-2}=4^x$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In base $2$ we get $3(x-2)=2x$. Expanding the bracket gives $3x-6=2x$, so $x=6$.'
          - problem: 'Solve $4^{x-1}=8^{x-3}$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In base $2$ the exponents are $2(x-1)$ and $3(x-3)$. Multiply the whole bracket by the exponent factor. The equation is $2(x-1)=3(x-3)$, so $2x-2=3x-9$ and $x=7$.'
        constraints: 'both sides are powers of one small base (2, 3 or 5); equate exponents and solve a linear equation'
    diagnostic_exemplar:
      problem: 'Solve $9^{x+1} = 27^{x}$.'
      answer: "x = 2"
      solution_sketch: 'Rewrite both sides base $3$: $3^{2(x+1)} = 3^{3x}$, so $2x + 2 = 3x$.'
    anki_seeds:
      - front: "First step for 9^x = 27?"
        back: "Rewrite both sides with base 3: 3^{2x} = 3^3."
        type: basic

  - id: evaluating-logarithms
    name: Evaluating Logarithms
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: exponential-equations-same-base
        weight: 0.7
        key: true
      - id: integer-exponents-intro
        weight: 0.4
      - id: negative-zero-exponents
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The definition, applied to perfect powers
        key_prerequisites: [exponential-equations-same-base]
        try_first:
          problem: 'A single cell divides in two every hour. After how many hours are there $16$ cells?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'Since $2^4=16$, it takes $4$ hours. The question "which exponent on $2$ gives $16$?" is exactly what $\log_2(16)$ asks.'
        exemplars:
          - problem: 'Evaluate $\log_2(32)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value of $\log_2(32)$ is the exponent on $2$ that gives $32$. Since $2^5=32$, the value is $5$.'
          - problem: 'Evaluate $\log_{10}(1000)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The logarithm asks which power of $10$ equals $1000$. Since $10^3=1000$, the value is $3$.'
          - problem: 'A bacterium divides in two at regular intervals. Starting from one cell, after how many divisions are there $256$ cells?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $x$ divisions there are $2^x$ cells, so we need $x=\log_2(256)$. Since $2^8=256$, there are $256$ cells after $8$ divisions.'
          - problem: 'The magnitude of an earthquake is the base-ten logarithm of the ratio of its measured amplitude to a reference amplitude. What is the magnitude of an earthquake whose amplitude is $10000$ times the reference?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ratio is $10000$, so the magnitude is $\log_{10}(10000)$. Since $10^4=10000$, the magnitude is $4$.'
          - problem: 'Evaluate $\log_7(49)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need the exponent $c$ with $7^c=49$. Since $7\cdot7=49$, we get $7^2=49$ and the value is $2$.'
          - problem: 'How many times can $81$ be divided by $3$ before the result is $1$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each division by $3$ removes one factor of $3$ from $81$. Since $81=3^4$, there are $4$ divisions, which is $\log_3(81)=4$.'
          - problem: 'What is the value of $\log_2(8)$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A logarithm is an exponent, not a quotient. Since $2^3=8$, the value of $\log_2(8)$ is $3$.'
        constraints: 'bases 2, 3, 7, 10; integer answers 2..8, with contexts of doubling, division by a base and logarithmic scales'
      - id: kp2
        name: Logs of 1 and of the base
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Evaluate $\log_9(9)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent on $9$ that gives $9$ is $1$, because $9^1=9$. So $\log_9(9)=1$.'
          - problem: 'Evaluate $\log_7(1)$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Any nonzero base raised to the power $0$ is $1$, so $7^0=1$. Thus $\log_7(1)=0$.'
          - problem: 'The magnitude of an earthquake is the base-ten logarithm of the ratio of its measured amplitude to a reference amplitude. What is the magnitude of an earthquake whose amplitude equals the reference amplitude?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ratio of the amplitude to the reference is $1$, so the magnitude is $\log_{10}(1)$. Since $10^0=1$, the magnitude is $0$.'
          - problem: 'The level of a sound in bels is the base-ten logarithm of the ratio of its intensity to the intensity of the quietest audible sound. What is the level of a sound that is $10$ times that intensity?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The intensity ratio is $10$, so the level is $\log_{10}(10)$. Since $10^1=10$, the level is $1$ bel.'
          - problem: 'Find $x$ if $\log_{12}(x)=1$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation says that $x$ is the number we get from the base $12$ raised to the power $1$. So $x=12^1=12$.'
          - problem: 'Evaluate $\log_3(3)+\log_5(5)+\log_8(1)$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each logarithm of a number equal to its base is $1$, so the first two terms give $1+1=2$. The logarithm of $1$ is $0$, so the sum is $2$.'
          - problem: 'What is the value of $\log_4(1)$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value is the exponent $c$ with $4^c=1$. Since $4^0=1$, the correct value is $0$.'
          - problem: 'Find $x$ if $\log_{20}(x)=0$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation says $20^0=x$. Any nonzero base to the power $0$ is $1$, so $x=1$.'
        constraints: 'argument equal to 1 or to the base itself; answers are 0 or 1, or the unknown argument or a sum of such logs'
      - id: kp3
        name: Logs of fractions
        key_prerequisites: [negative-zero-exponents]
        exemplars:
          - problem: 'Evaluate $\log_2\left(\frac{1}{16}\right)$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We need the exponent $c$ with $2^c=\frac{1}{16}$. Since $16=2^4$, the reciprocal is $2^{-4}$, so the value is $-4$.'
          - problem: 'Evaluate $\log_3\left(\frac{1}{27}\right)$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $27=3^3$, the reciprocal is $\frac{1}{27}=3^{-3}$. So the exponent on $3$, and the value of the logarithm, is $-3$.'
          - problem: 'The pH of a solution is $-\log_{10}$ of its hydrogen-ion concentration in moles per litre. What is the pH of a solution with concentration $0.0001$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $0.0001=\frac{1}{10000}=10^{-4}$, we get $\log_{10}(0.0001)=-4$. The pH is the negative of that, which is $4$.'
          - problem: 'The level of a sound in bels is the base-ten logarithm of the ratio of its intensity to the intensity of the quietest audible sound. A very faint sound has $\frac{1}{1000}$ of that intensity. What is its level?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The level is $\log_{10}\left(\frac{1}{1000}\right)$. Since $\frac{1}{1000}=10^{-3}$, the level is $-3$ bels, which is below the quietest audible sound.'
          - problem: 'Evaluate $\log_{10}(0.01)$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We write the decimal as a power of $10$: $0.01=\frac{1}{100}=10^{-2}$. So the exponent, and the value of the logarithm, is $-2$.'
          - problem: 'Evaluate $\log_2\left(\frac{1}{2}\right)$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reciprocal of $2$ is $2^{-1}$, so the exponent on $2$ that gives $\frac{1}{2}$ is $-1$. Thus $\log_2\left(\frac{1}{2}\right)=-1$.'
          - problem: 'What is the value of $\log_2\left(\frac{1}{8}\right)$?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The argument is $\frac{1}{8}$, not $8$. A reciprocal has a negative exponent, so $2^{-3}=\frac{1}{8}$ and the value is $-3$.'
          - problem: 'Find $x$ if $\log_3(x)=-2$.'
            answer: '1/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation says that $x$ is $3$ raised to the power $-2$. Since $3^{-2}=\frac{1}{3^2}=\frac{1}{9}$, we get $x=1/9$.'
        constraints: 'arguments are unit fractions 1/b^k with k = 1-4 or decimals such as 0.01; answers are negative integers, or the unknown argument for a negative value'
    diagnostic_exemplar:
      problem: 'Evaluate $\log_5\left(\frac{1}{125}\right)$.'
      answer: "-3"
      solution_sketch: '$\frac{1}{125} = 5^{-3}$, and the log returns that exponent.'
    anki_seeds:
      - front: "log_b(y) = x means..."
        back: "b^x = y."
        type: basic
      - front: "log_b(1) = {{c1::0}} for any valid base b."
        back: "0"
        type: cloze

  - id: logarithm-basics
    name: Introduction to Logarithms
    core: true
    difficulty: 0.6
    drill: false
    # The point of this topic is rewriting one EQUATION as another ("3^4 = 81" <->
    # "log_3(81) = 4"); SymPy cannot parse "=", so the tutor grades the form.
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: evaluating-logarithms
        weight: 0.8
        key: true
      - id: exponential-equations
        weight: 0.4
      - id: inverse-functions
        weight: 0.0            # conceptual only: a log is the inverse of an exponential
    knowledge_points:
      - id: kp1
        name: Convert exponential form to logarithmic form
        key_prerequisites: [evaluating-logarithms]
        constraints: "bases 2, 3, 5, 7, 10 and exponents -3 to 5; the answer is the logarithmic equation or the missing number in it, not a value"
        exemplars:
          - problem: 'Rewrite $3^4 = 81$ in logarithmic form.'
            answer: 'log_3(81) = 4'
            answer_contract: {"kind": "label", "options": [["log_3(81) = 4", "log_3(81)=4", "\\log_{3}(81) = 4", "\\log_{3}(81)=4", "\\log_3(81) = 4", "\\log_3(81)=4", "log_3 81 = 4", "log_3 81=4"], ["log_81(3) = 4", "log_81(3)=4", "\\log_{81}(3) = 4", "\\log_{81}(3)=4"]]}
            solution_sketch: 'The base stays the base, the exponent becomes the value of the logarithm, and the result becomes the argument. So $3^4=81$ says the same as $\log_3(81)=4$.'
          - problem: 'Complete the logarithmic form of $10^{-2}=0.01$: $\log_{10}(0.01)=\square$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The base is $10$ and the result is $0.01$, so the logarithm is the exponent of $10$ that gives $0.01$. That exponent is $-2$, so $\log_{10}(0.01)=-2$.'
          - problem: 'A culture doubles every hour. After $h$ hours it is $2^h$ times its starting size, and it is now $32$ times its starting size. Write the equation for $h$ in logarithmic form.'
            answer: 'log_2(32) = h'
            answer_contract: {"kind": "label", "options": [["log_2(32) = h", "log_2(32)=h", "h = log_2(32)", "h=log_2(32)", "\\log_2(32) = h", "\\log_{2}(32) = h", "h = \\log_2(32)", "h = \\log_{2}(32)"], ["log_32(2) = h", "log_32(2)=h", "\\log_{32}(2) = h", "\\log_{32}(2)=h"]]}
            solution_sketch: 'The size condition is $2^h=32$. The base $2$ stays the base and the exponent $h$ becomes the value, so $\log_2(32)=h$.'
          - problem: 'Complete the logarithmic form of $7^0=1$: $\log_7(1)=\square$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The exponent that turns the base $7$ into the result $1$ is $0$. So $7^0=1$ says the same as $\log_7(1)=0$.'
          - problem: 'The number of people who know a rumour triples every hour, so after $h$ hours it has grown $3^h$-fold. It has now grown $243$-fold. Then $h=\log_b(243)$ for which base $b$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The growth condition $3^h=243$ in logarithmic form is $h=\log_3(243)$. The base of the power stays the base of the logarithm, so $b=3$.'
          - problem: 'Rewrite $2^6=64$ as a logarithm equation. What is the base of the logarithm?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The base of the power stays the base of the logarithm. In $2^6=64$ the base is $2$, so the correct form is $\log_2(64)=6$.'
          - problem: 'Complete the logarithmic form of $2^{-3}=\frac{1}{8}$: $\log_2\left(\frac{1}{8}\right)=\square$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The exponent that turns the base $2$ into $\frac18$ is $-3$. So $\log_2\left(\frac18\right)=-3$, and a negative exponent gives a negative logarithm.'
      - id: kp2
        name: Convert logarithmic form to exponential form
        key_prerequisites: [evaluating-logarithms]
        constraints: "bases 2, 3, 5, 10 with integer logarithm values; the answer is the exponential equation, the missing exponent, or the argument"
        exemplars:
          - problem: 'Rewrite $\log_5(125) = 3$ in exponential form.'
            answer: '5^3 = 125'
            answer_contract: {"kind": "label", "options": [["5^3 = 125", "5^3=125", "5^{3} = 125", "5^{3}=125", "125 = 5^3", "125=5^3"], ["125^3 = 5", "125^3=5", "3^5 = 125", "3^5=125"]]}
            solution_sketch: 'The base stays the base, the value of the logarithm becomes the exponent, and the argument becomes the result. So $\log_5(125)=3$ says the same as $5^3=125$.'
          - problem: 'Complete the exponential form of $\log_{10}(0.001)=-3$: $10^{\square}=0.001$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value of the logarithm is the exponent of the base. So $\log_{10}(0.001)=-3$ says the same as $10^{-3}=0.001$.'
          - problem: 'The magnitude of an earthquake is $M=\log_{10}A$, where $A$ is the amplitude of the ground motion in micrometres. An earthquake has magnitude $6$. What was its amplitude?'
            answer: '1000000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation $\log_{10}A=6$ in exponential form is $10^6=A$. So the amplitude was $10^6=1000000$ micrometres.'
          - problem: 'The pH of a solution is $-\log_{10}[\mathrm{H}^+]$, where $[\mathrm{H}^+]$ is the concentration of hydrogen ions in mol/L. A sample has pH $4$. What is its hydrogen ion concentration in mol/L?'
            answer: '0.0001'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A pH of $4$ means $\log_{10}[\mathrm{H}^+]=-4$. In exponential form $[\mathrm{H}^+]=10^{-4}=0.0001$ mol/L, a very small concentration.'
          - problem: 'Write the table entry $\log_3(243)=5$ in exponential form.'
            answer: '3^5 = 243'
            answer_contract: {"kind": "label", "options": [["3^5 = 243", "3^5=243", "3^{5} = 243", "3^{5}=243", "243 = 3^5", "243=3^5"], ["243^5 = 3", "243^5=3", "5^3 = 243", "5^3=243"]]}
            solution_sketch: 'The value of the logarithm is the exponent, not the argument. So $\log_3(243)=5$ says the same as $3^5=243$.'
          - problem: 'Solve $\log_2(x)=7$.'
            answer: '128'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The base stays the base, so $\log_2(x)=7$ becomes the power equation $2^7=x$. Then $x=2^7=128$.'
          - problem: 'Solve $\log_3(x)=-2$.'
            answer: '1/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In exponential form $\log_3(x)=-2$ is $3^{-2}=x$. So $x=\frac19$, because a negative exponent gives a reciprocal.'
      - id: kp3
        name: Fractional values and unknown bases
        key_prerequisites: [evaluating-logarithms, exponential-equations]
        constraints: "base and argument are powers of one small integer, so the value is a simple fraction; or solve for an unknown base from a square"
        try_first:
          problem: 'Which exponent $x$ makes $25^x=5$?'
          answer_contract: {"kind": "exact"}
          answer: '1/2'
          reveal: 'A square root is a power of $\frac12$, and $\sqrt{25}=5$, so $25^{1/2}=5$. This is why $\log_{25}(5)=\frac12$: a logarithm can be a fraction.'
        exemplars:
          - problem: 'Evaluate $\log_4(2)$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let the value be $c$, so $4^c=2$. Since $4^{1/2}=\sqrt4=2$, the value is $c=\frac12$.'
          - problem: 'Find the base $b$ of the logarithm if $\log_b(49)=2$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In exponential form $\log_b(49)=2$ is $b^2=49$. A base must be positive, so $b=7$.'
          - problem: 'Evaluate $\log_{27}(3)$.'
            answer: '1/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let the value be $c$, so $27^c=3$. Since $27=3^3$, we get $3^{3c}=3^1$, so $3c=1$ and $c=\frac13$.'
          - problem: 'A culture grows by the same factor every hour. After $3$ hours it has grown $64$-fold. By what factor does it grow each hour?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $b$ is the hourly factor, then $b^3=64$, which is $\log_b(64)=3$. Since $4^3=64$, the factor is $4$.'
          - problem: 'A radioactive sample loses half of its mass every year. After how many years is $\frac{1}{32}$ of the sample left?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $n$ years the fraction left is $\left(\frac12\right)^n$, so $\left(\frac12\right)^n=\frac1{32}$. Since $2^5=32$, the sample reaches $\frac{1}{32}$ after $5$ years.'
          - problem: 'What is $\log_{16}(2)$?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let the value be $c$, so $16^c=2$. Since $16=2^4$, we get $2^{4c}=2^1$, so $4c=1$ and $c=\frac14$.'
          - problem: 'Solve $b^2=36$ for the base of $\log_b(36)=2$. What is the base $b$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both $6$ and $-6$ solve $b^2=36$, but a logarithm base must be positive and not equal to $1$. So $b=6$.'
          - problem: 'Evaluate $\log_9(3)$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let the value be $c$, so $9^c=3$. Since $9^{1/2}=\sqrt9=3$, the value is $c=\frac12$.'
    diagnostic_exemplar:
      problem: 'Find $b$ if $\log_b(81) = 4$.'
      answer: "b = 3"
      solution_sketch: 'In exponential form $b^4 = 81$, so $b = 3$.'
    anki_seeds:
      - front: "b^x = y in logarithmic form is..."
        back: "log_b(y) = x."
        type: basic

