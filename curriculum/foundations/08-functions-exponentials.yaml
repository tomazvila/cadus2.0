unit: functions-exponentials
course: foundations
module: "Functions & Exponentials"
topics:
  - id: identifying-functions-vertical-line-test
    name: Identifying Functions and the Vertical Line Test
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: coordinate-plane
        weight: 0.7
        key: true
      - id: evaluating-expressions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: One output per input
        key_prerequisites: [coordinate-plane]
        constraints: 'small finite relations (3-4 ordered pairs) with integer coordinates; verdicts, the repeated input, the missing output, the unknown value k, and tables or lists from everyday situations'
        try_first:
          problem: 'In the relation $\{(2,5),(2,7),(4,5),(6,1)\}$, which input is paired with two different outputs?'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'The input $2$ goes to both $5$ and $7$, and a relation can do that only if it is not a function. The repeated output $5$ is no problem, because only a repeated input with different outputs breaks the rule.'
        exemplars:
          - problem: 'Is $\{(-2,5),(0,1),(3,5),(4,-1)\}$ a function?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is a function","is a function","function","yes it is","yes it is a function","yes, it is a function","it is"],["no","it is not a function","is not a function","not a function","nonfunction","no it is not","no it is not a function","no, it is not a function"]]}
            solution_sketch: 'Look at the inputs $-2$, $0$, $3$ and $4$. All four are different, so each input has exactly one output. The output $5$ appears twice, but that does not matter, so the relation is a function.'
          - problem: 'The relation $\{(1,4),(2,6),(1,9),(5,3)\}$ is not a function. Which input has two outputs?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The input $1$ appears in $(1,4)$ and in $(1,9)$, with the different outputs $4$ and $9$. The inputs $2$ and $5$ each appear once, so $1$ is the input that breaks the rule.'
          - problem: 'The relation $\{(1,2),(3,4),(5,6),(3,c)\}$ is a function. Find $c$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The input $3$ is already paired with $4$ in $(3,4)$. For a function the input $3$ may have only one output, so $c$ must equal $4$.'
          - problem: 'A school lists the locker of four students: Ana has locker $12$, Ben has locker $14$, Cy has locker $14$ and Di has locker $20$. Is the rule that takes a locker number to the student who uses it a function?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is a function","is a function","function","yes it is","yes it is a function","yes, it is a function","it is"],["no","it is not a function","is not a function","not a function","nonfunction","no it is not","no it is not a function","no, it is not a function"]]}
            solution_sketch: 'The locker number is the input and the student is the output. Locker $14$ belongs to both Ben and Cy, so one input has two outputs and the rule is not a function. The rule from student to locker would be a function.'
          - problem: 'Four items cost these prices in dollars: a pen $2$, a notebook $5$, a ruler $2$ and a bag $12$. Take the rule that sends a price to the item that costs that much. For which price does the rule give more than one item?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The price $2$ dollars belongs to the pen and to the ruler, so that input has two outputs. The prices $5$ and $12$ each belong to one item only, so the answer is $2$.'
          - problem: 'Find all values of $k$ for which $\{(1,5),(2,7),(k,9)\}$ is not a function.'
            answer: '1, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The new pair $(k,9)$ breaks the rule when its input $k$ already appears with another output. That happens for $k=1$, where $1$ has outputs $5$ and $9$, and for $k=2$, where $2$ has outputs $7$ and $9$.'
          - problem: 'The relation $\{(3,1),(5,2),(3,1),(7,4)\}$ lists the pair $(3,1)$ twice. How many different outputs does the input $3$ have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pair $(3,1)$ is written twice, but a repeated pair is the same pair and adds no new output. The input $3$ has only the output $1$, so the number of different outputs is $1$, and the relation is a function.'
      - id: kp2
        name: The vertical line test
        key_prerequisites: [coordinate-plane]
        constraints: 'graphs given by an equation or a description (line, parabola, circle, sideways parabola, cubic) or by a rule from a situation; verdicts, the points where a vertical line meets the graph, and a horizontal reading from a situation'
        exemplars:
          - problem: 'Is the parabola $y=x^2-3$ the graph of a function of $x$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is a function","is a function","function","yes it is","yes it is a function","yes, it is a function","it is"],["no","it is not a function","is not a function","not a function","nonfunction","no it is not","no it is not a function","no, it is not a function"]]}
            solution_sketch: 'Every vertical line $x=a$ meets the parabola where $y=a^2-3$, which is exactly one point. No input has two outputs, so the parabola passes the vertical line test.'
          - problem: 'The vertical line $x=3$ meets the circle $x^2+y^2=25$. Find the $y$-coordinates of the points where it meets the circle.'
            answer: '4, -4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $x=3$ into the equation to get $9+y^2=25$, so $y^2=16$. Then $y=4$ or $y=-4$, two points, so the circle fails the vertical line test.'
          - problem: 'The graph of $x=y^2-1$ is a parabola that opens to the right. The vertical line $x=3$ meets it. Find the $y$-coordinates of the points where it meets the parabola.'
            answer: '2, -2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $x=3$ into the equation to get $3=y^2-1$, so $y^2=4$. Then $y=2$ or $y=-2$, so one input has two outputs.'
          - problem: 'A ball is thrown upward from the ground. After $t$ seconds its height is $h=12t-4t^2$ metres. At which two times is the ball $8$ metres high?'
            answer: '1, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve $12t-4t^2=8$, which gives $t^2-3t+2=0$ and $(t-1)(t-2)=0$. The ball is $8$ metres high at $t=1$ and at $t=2$, once on the way up and once on the way down.'
          - problem: 'A thrown ball has height $h=12t-4t^2$ metres after $t$ seconds. Is the time $t$ a function of the height $h$, so that each height gives exactly one time?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is a function","is a function","function","yes it is","yes it is a function","yes, it is a function","it is"],["no","it is not a function","is not a function","not a function","nonfunction","no it is not","no it is not a function","no, it is not a function"]]}
            solution_sketch: 'The heights are the inputs and the times are the outputs. The height $8$ metres belongs to the two times $1$ and $2$, so one input has two outputs and the answer is no. Height is a function of time, but time is not a function of height.'
          - problem: 'A phone plan costs $c=15+4g$ dollars for $g$ gigabytes. The vertical line $g=5$ meets the graph of the plan. What is the cost at the point where it meets the graph?'
            answer: '35'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Put $g=5$ into the rule to get $c=15+4\cdot5=15+20=35$. A line is a function graph, so the vertical line meets it at exactly one point, $(5,35)$.'
          - problem: 'How many points do the vertical line $x=2$ and the graph of $y=x^3$ have in common?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Put $x=2$ into the equation to get $y=8$, so the only common point is $(2,8)$. Every vertical line $x=a$ gives the single value $y=a^3$, so the cubic passes the vertical line test.'
    diagnostic_exemplar:
      problem: 'The graph of $x^2 + y^2 = 25$ is a circle of radius $5$ centred at the origin. Is it the graph of a function?'
      answer_contract: {kind: label, options: [[yes], [no]]}
      answer: "no"
      solution_sketch: 'The vertical line $x = 0$ meets the circle at $(0, 5)$ and $(0, -5)$ — two outputs for one input.'
    anki_seeds:
      - front: "A relation is a function when..."
        back: "every input has exactly one output."
        type: basic
      - front: "Vertical line test: a graph shows a function if..."
        back: "no vertical line crosses the graph more than once."
        type: basic

  - id: evaluating-functions
    name: Evaluating Functions
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: evaluating-expressions
        weight: 0.8
        key: true
      - id: integer-multiplication-division
        weight: 0.4
      - id: identifying-functions-vertical-line-test
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Evaluate f(x) at a positive input
        key_prerequisites: [evaluating-expressions]
        constraints: 'linear, quadratic, factored and reciprocal rules; integer inputs 1-9; integer outputs; rules from everyday situations, including rules with a division'
        exemplars:
          - problem: 'If $f(x)=2x^2-7$, find $f(4)$.'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $4$ to get $2\cdot4^2-7$. The square comes first: $4^2=16$, then $2\cdot16=32$ and $32-7=25$.'
          - problem: 'If $f(x)=2x+3$, find $f(4)$.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $4$ to get $2(4)+3$. Then $8+3=11$.'
          - problem: 'A plumber charges $C(h)=40+25h$ dollars for a job of $h$ hours. What does she charge for a job of $3$ hours?'
            answer: '115'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The input is $h=3$, so $C(3)=40+25\cdot3$. The product comes first, $75$, and then $40+75=115$ dollars.'
          - problem: 'A trip of $120$ kilometres at a steady speed of $s$ kilometres per hour takes $t(s)=\dfrac{120}{s}$ hours. How long does the trip take at $40$ kilometres per hour?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'Put $s=40$ into the rule to get $t(40)=\frac{120}{40}$. A trip of $120$ km at $40$ km per hour takes $3$ hours.'
          - problem: 'If $g(x)=x(x+3)$, find $g(2)$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $2$ in both places to get $2(2+3)$. The second factor is $5$, so $g(2)=2\cdot5=10$.'
          - problem: 'A bill of $360$ dollars is shared equally by $n$ friends, so each friend pays $c(n)=\dfrac{360}{n}$ dollars. How much does each friend pay when $n=8$?'
            answer: '45'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Put $n=8$ into the rule to get $c(8)=\frac{360}{8}$. Dividing $360$ by $8$ gives $45$ dollars for each friend.'
          - problem: 'A machine follows the rule $f(x)=5x-1$. Its input is $6$. What is its output?'
            answer: '29'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the input first: $5(6)=30$. Then subtract $1$ to get the output $29$.'
          - problem: 'If $g(x)=x^2-1$, find $g(3)$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $3$ to get $3^2-1=9-1$. The result is $8$.'
      - id: kp2
        name: Function values from a table
        key_prerequisites: [identifying-functions-vertical-line-test]
        constraints: 'tables of 3 input-output pairs with integer entries (or 3 rows from a situation); look up a value, add, subtract or multiply table values, compare them with a ratio, or evaluate f(f(a)) when an output is also an input'
        exemplars:
          - problem: 'A table gives $f(1)=6$, $f(2)=9$, $f(3)=15$. Find $f(1)+f(3)$.'
            answer: '21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Read $f(1)=6$ and $f(3)=15$ from the table. Their sum is $6+15=21$.'
          - problem: 'A table gives $f(1)=5$, $f(2)=7$, $f(3)=9$. Find $2f(2)$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The table gives $f(2)=7$, and $2f(2)$ means two times that output. So $2\cdot7=14$.'
          - problem: 'A table gives the value $V(t)$ of a bike in dollars, $t$ years after it was bought: $V(0)=400$, $V(1)=320$, $V(2)=256$. How many dollars does the bike lose in its first two years?'
            answer: '144'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The bike is worth $V(0)=400$ at the start and $V(2)=256$ after two years. The loss is $400-256=144$ dollars.'
          - problem: 'A table gives the number $N(h)$ of bacteria in a dish $h$ hours after the start: $N(0)=50$, $N(1)=150$, $N(2)=450$. How many times as many bacteria are in the dish after $2$ hours as at the start?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Read $N(2)=450$ and $N(0)=50$ from the table. The number of times is the quotient $\frac{450}{50}=9$, not the difference.'
          - problem: 'The inputs of a table are $0$, $1$, $2$ and the matching outputs are $2$, $6$, $10$. Find $f(2)-f(0)$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The table gives $f(2)=10$ and $f(0)=2$. The difference is $10-2=8$.'
          - problem: 'A table lists the pairs $(x,f(x))$ as $(0,2)$, $(1,6)$, $(2,10)$. Find $f(f(0))$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $f(0)=2$ from the table. Then $f(f(0))=f(2)$, and the table gives $f(2)=10$.'
          - problem: 'A table gives the temperature $T(h)$ in degrees at hour $h$: $T(6)=12$, $T(12)=19$, $T(18)=17$. By how many degrees does the temperature rise from hour $6$ to hour $12$?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'Read $T(6)=12$ and $T(12)=19$ from the table. The rise is $19-12=7$ degrees.'
      - id: kp3
        name: Evaluate at negative inputs
        key_prerequisites: [evaluating-expressions, integer-multiplication-division]
        constraints: 'linear, quadratic and reciprocal rules; integer inputs -1 to -5; integer outputs; rules from everyday situations where negative inputs mean times before a reference'
        exemplars:
          - problem: 'If $f(x)=x^2-2x$, find $f(-3)$.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $-3$ in brackets to get $(-3)^2-2(-3)$. The square is $9$ and $-2(-3)=6$, so $9+6=15$.'
          - problem: 'If $h(x)=3x-5$, find $h(-2)$.'
            answer: '-11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $-2$ to get $3(-2)-5$. Then $-6-5=-11$.'
          - problem: 'For $g(x)=x(x+3)$, find $g(-4)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $-4$ the two factors are $-4$ and $-4+3=-1$. Their product is $(-4)(-1)=4$.'
          - problem: 'The temperature in degrees Celsius is modelled by $T(h)=2h-7$, where $h$ is the number of hours after midnight, so $h=-5$ means $5$ hours before midnight. What is the temperature at $h=-5$?'
            answer: '-17'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'Put $h=-5$ into the rule to get $2(-5)-7$. Then $-10-7=-17$ degrees.'
          - problem: 'The value change of a stock is modelled by $v(n)=5n^2-3n$ dollars, where $n$ counts days from today and $n=-2$ is two days ago. Find $v(-2)$.'
            answer: '26'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Replace $n$ by $-2$ to get $5(-2)^2-3(-2)$. The square is $4$, so $5\cdot4=20$ and $-3(-2)=6$, and $20+6=26$.'
          - problem: 'Evaluate $f(x)=x^2+6x$ at $x=-2$. What is the value of $f(-2)$?'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Keep the brackets, so the $-2$ is squared. The square is $(-2)^2=4$, and $4+6(-2)=4-12=-8$.'
          - problem: 'For $f(x)=\dfrac{24}{x}$, find $f(-6)$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $-6$ to get $\frac{24}{-6}$. A positive number divided by a negative number is negative, so the value is $-4$.'
          - problem: 'For $g(x)=x^2-3x+1$, find $g(-4)$.'
            answer: '29'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $-4$ to get $(-4)^2-3(-4)+1$. That is $16+12+1=29$.'
    diagnostic_exemplar:
      problem: 'If $f(x) = x^2 - 4x$, find $f(-2)$.'
      answer: "12"
      solution_sketch: '$(-2)^2 - 4(-2) = 4 + 8 = 12$; the subtracted term turns positive.'
    anki_seeds:
      - front: "f(4) means..."
        back: "the output of f when the input is 4."
        type: basic

  - id: function-notation
    name: Function Notation
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: evaluating-functions
        weight: 0.8
        key: true
      - id: one-step-equations
        weight: 0.4
      - id: square-roots
        weight: 0.3
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Solve f(x) = value for a linear rule
        key_prerequisites: [one-step-equations, evaluating-functions]
        constraints: 'linear rules with small integer coefficients (one rule has a fraction x/3); integer solutions, positive or negative; rules from everyday situations that need an equation set up'
        exemplars:
          - problem: 'For $f(x)=2x+1$, solve $f(x)=9$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $2x+1=9$. Subtract $1$ to get $2x=8$, then divide by $2$ to get $x=4$.'
          - problem: 'A taxi charges $f(d)=3+2d$ dollars for a ride of $d$ kilometres. A ride costs $17$ dollars. How long is the ride?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Set $3+2d=17$. Subtract $3$ to get $2d=14$, then divide by $2$ to get $d=7$ kilometres.'
          - problem: 'A machine follows the rule $f(x)=3x-2$. Which input produces the output $13$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $3x-2=13$. Add $2$ to get $3x=15$, then divide by $3$ to get the input $5$.'
          - problem: 'A gym charges a joining fee of $30$ dollars plus $12$ dollars for each month. Ana has paid $150$ dollars in total. For how many months has she been a member?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total after $m$ months is $f(m)=30+12m$, so set $30+12m=150$. Subtract $30$ to get $12m=120$, then divide by $12$ to get $m=10$ months.'
          - problem: 'The point $(a,25)$ lies on the graph of $y=4x-3$. Find $a$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point satisfies $4a-3=25$. Add $3$ to get $4a=28$, then divide by $4$ to get $a=7$.'
          - problem: 'For $f(x)=\dfrac{x}{3}-1$, solve $f(x)=4$.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $\frac{x}{3}-1=4$. Add $1$ to get $\frac{x}{3}=5$, then multiply both sides by $3$ to get $x=15$.'
          - problem: 'In a table for $f(x)=5x+4$, the output $44$ stands next to a missing input. Find the missing input.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $5x+4=44$. Subtract $4$ to get $5x=40$, then divide by $5$ to get $x=8$.'
          - problem: 'For $f(x)=-2x+5$, solve $f(x)=-7$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $-2x+5=-7$. Subtract $5$ to get $-2x=-12$, then divide by $-2$ to get $x=6$.'
      - id: kp2
        name: Solve f(x) = value with squares
        key_prerequisites: [square-roots]
        constraints: 'rules of the form x^2 + c or c - kx^2 with perfect-square targets; the problem either asks for all solutions or says which of the two solutions to give'
        exemplars:
          - problem: 'If $f(x)=x^2+1$, solve $f(x)=10$.'
            answer: '3, -3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $1$ to get $x^2=9$. Both $3$ and $-3$ square to $9$, so the solutions are $3$ and $-3$.'
          - problem: 'If $f(x)=x^2-4$, for which inputs is $f(x)=32$?'
            answer: '6, -6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $4$ to get $x^2=36$. The inputs are $6$ and $-6$.'
          - problem: 'A square tile with side $s$ centimetres has area $A(s)=s^2$ square centimetres. A tile has area $49$ square centimetres. How long is its side?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Set $s^2=49$, so $s=7$ or $s=-7$. A length is positive, so the side is $7$ centimetres.'
          - problem: 'A stone is dropped from a cliff $80$ metres high. Its height after $t$ seconds is $h(t)=80-5t^2$ metres. After how many seconds does it reach the ground?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The stone is on the ground when $80-5t^2=0$, so $5t^2=80$ and $t^2=16$. Then $t=4$ or $t=-4$, and a time after the drop is positive, so $t=4$ seconds.'
          - problem: 'A square-rule machine uses $f(x)=x^2+3$. The output $28$ came from a negative input. Find that input.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $3$ from $28$ to get $x^2=25$. The two inputs are $5$ and $-5$, and the negative one is $-5$.'
          - problem: 'For $f(x)=x^2+2$, the input $7$ gives the output $51$. Which other input also gives the output $51$?'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $2$ to get $x^2=49$. Both $7$ and $-7$ square to $49$, so the other input is $-7$.'
          - problem: 'For $f(x)=x^2-9$, solve $f(x)=0$.'
            answer: '3, -3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $x^2-9=0$, so $x^2=9$. The solutions are $3$ and $-3$.'
      - id: kp3
        name: Evaluate at expression inputs
        key_prerequisites: [evaluating-functions]
        constraints: 'linear rules and the rules x^2 and x^2+1 and 600/x; inputs like 2a, a+2, -a, a+4, a+1; write the result as an expression, or the difference f(a+2)-f(a)'
        exemplars:
          - problem: 'If $f(x)=3x+1$, find $f(2a)$.'
            answer: '6a + 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $2a$ to get $3(2a)+1$. Then $3(2a)=6a$, so $f(2a)=6a+1$.'
          - problem: 'If $f(x)=x+5$, find $f(a+2)$.'
            answer: 'a + 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $a+2$ to get $(a+2)+5$. Combine the numbers: $a+7$.'
          - problem: 'For $f(x)=2x-3$, find $f(-a)$.'
            answer: '-2a - 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $-a$ to get $2(-a)-3$. The first term is $-2a$, so $f(-a)=-2a-3$.'
          - problem: 'A taxi charges $C(d)=3+2d$ dollars for a ride of $d$ kilometres. A ride is $a$ kilometres long plus a detour of $4$ kilometres. What is the fare in dollars?'
            answer: '2a + 11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The distance is $a+4$ kilometres, so the fare is $C(a+4)=3+2(a+4)$. Distribute to get $3+2a+8$, which is $2a+11$.'
          - problem: 'A prize of $600$ dollars is shared equally by $n$ winners, so each winner gets $p(n)=\dfrac{600}{n}$ dollars. How many dollars does each winner get when there are $2a$ winners?'
            answer: '300/a'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $n$ by $2a$ to get $p(2a)=\frac{600}{2a}$. Dividing $600$ by $2$ leaves $\frac{300}{a}$.'
          - problem: 'If $f(x)=4x-1$, find $f(a+3)$.'
            answer: '4a + 11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $a+3$ to get $4(a+3)-1$. Distribute to get $4a+12-1$, which is $4a+11$.'
          - problem: 'If $f(x)=x^2$, find $f(a+1)$.'
            answer: 'a^2 + 2a + 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ by $a+1$ to get $(a+1)^2$. Expand the square: $a^2+2a+1$.'
          - problem: 'A tank holds $V(t)=200-15t$ litres after $t$ minutes. How many litres does it hold after $a+2$ minutes?'
            answer: '170 - 15a'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $t$ by $a+2$ to get $200-15(a+2)$. Distribute to get $200-15a-30$, which is $170-15a$.'
          - problem: 'For $f(x)=3x+1$, find $f(a+2)-f(a)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Find $f(a+2)=3(a+2)+1=3a+7$ and $f(a)=3a+1$. The difference is $(3a+7)-(3a+1)=6$.'
    diagnostic_exemplar:
      problem: 'If $f(x) = x^2 + 1$ and $f(2a) = 17$, find the positive value of $a$.'
      answer: "2"
      solution_sketch: 'Substitute the whole input: $(2a)^2 + 1 = 17$, so $4a^2 = 16$.'
    anki_seeds:
      - front: "Solving f(x) = k means..."
        back: "finding the input(s) x whose output is k."
        type: basic

