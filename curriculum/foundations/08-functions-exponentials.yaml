  - id: graphs-of-logarithmic-functions
    name: Graphs of Logarithmic Functions
    # core: mirror of graphs-of-exponential-functions (core) — the log side of the
    # inverse pair; calculus monotonicity and limit work leans on the ln-graph
    # picture (re-audit R-04; optional calc ledger edge is lane C's call).
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: logarithm-basics
        weight: 0.7
        key: true
      - id: graphs-of-exponential-functions
        weight: 0.6
        key: true
      - id: common-natural-logarithms
        weight: 0.4
      - id: inverse-functions
        weight: 0.0            # conceptual only: the reflection across y = x
    knowledge_points:
      - id: kp1
        name: Key points on a log graph
        key_prerequisites: [logarithm-basics]
        constraints: "integer-power arguments so every point evaluates exactly; bases 2, 3, 5, 10, e"
        exemplars:
          - problem: 'Where does the graph of $y=\log_3 x$ cross the $x$-axis?'
            answer: '(1, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'On the $x$-axis $y=0$, so $\log_3 x=0$ and $x=3^0=1$. The graph crosses the $x$-axis at $(1,0)$, and every logarithm graph does the same.'
          - problem: 'The graph of $y=\log_2 x$ passes through the point $(8,c)$. Find $c$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The point lies on the graph, so $c=\log_2 8$. Since $2^3=8$, we find $c=3$.'
          - problem: 'The graph of $y=\ln x$ passes through the point $(e,c)$. Find $c$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The point lies on the graph, so $c=\ln e$. Since $e^1=e$, we find $c=1$.'
          - problem: 'The graph of $y=\log_{10}x$ passes through the point $(c,-2)$. Find $c$.'
            answer: '1/100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The point lies on the graph, so $\log_{10}c=-2$. In exponential form $c=10^{-2}=\frac1{100}$.'
          - problem: 'The graph of $y=\log_5 x$ passes through the point $(c,3)$. Find $c$.'
            answer: '125'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The point lies on the graph, so $\log_5 c=3$. In exponential form $c=5^3=125$.'
          - problem: 'A culture starts with one cell and doubles every hour. The time in hours needed to reach $x$ cells is $t=\log_2 x$. How many cells are there when $t=7$?'
            answer: '128'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $\log_2 x=7$, which in exponential form is $x=2^7$. So there are $128$ cells after $7$ hours.'
          - problem: 'A strip of paper is cut in half again and again. The number of cuts needed to reach a piece of length $x$, measured in original lengths, is $n=\log_{1/2}x$. How many cuts give a piece of length $\frac{1}{64}$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $n=\log_{1/2}\left(\frac1{64}\right)$, so $\left(\frac12\right)^n=\frac1{64}$. Since $2^6=64$, the number of cuts is $6$.'
          - problem: 'Does the graph of $y=\log_2 x$ cross the $y$-axis?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "no, it does not", "it does not", "it does not cross", "does not cross", "it never crosses", "it doesn't", "never"], ["yes", "it does", "it crosses", "crosses"]]}
            solution_sketch: 'On the $y$-axis $x=0$, but $\log_2 0$ is not defined because no power of $2$ equals $0$. So the graph does not cross the $y$-axis.'
      - id: kp2
        name: Domain, vertical asymptote, and monotonicity
        key_prerequisites: [logarithm-basics, graphs-of-exponential-functions]
        constraints: "parent graphs y = log_b x only, no shifts; asymptote is always x = 0 at this level; bases b > 1 increasing, 0 < b < 1 decreasing"
        exemplars:
          - problem: 'What is the domain of $y=\log_5 x$?'
            answer: 'x > 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A power of $5$ is always positive, so only a positive number $x$ has a logarithm. The domain is $x>0$.'
          - problem: 'Find the vertical asymptote of the graph of $y=\ln x$.'
            answer: 'x = 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'As $x$ gets close to $0$ from the right, $\ln x$ becomes more and more negative. The graph approaches the line $x=0$, the $y$-axis, without touching it.'
          - problem: 'Is the graph of $y=\log_2 x$ increasing or decreasing?'
            answer: 'increasing'
            answer_contract: {"kind": "label", "options": [["increasing", "it is increasing", "increases", "it increases", "up", "it goes up", "rising"], ["decreasing", "it is decreasing", "decreases", "it decreases", "down", "it goes down", "falling"]]}
            solution_sketch: 'The base is $2$, which is greater than $1$. For a base greater than $1$ the graph rises from left to right, so it is increasing.'
          - problem: 'The graph of $y=\log_{1/2}x$ passes through the point $(4,c)$. Find $c$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The point lies on the graph, so $c=\log_{1/2}4$, and $\left(\frac12\right)^c=4$. Since $\left(\frac12\right)^{-2}=4$, we find $c=-2$.'
          - problem: 'The number of doublings needed to grow from one cell to $x$ cells is $d=\log_2 x$. For which values of $x$ does this formula make sense?'
            answer: 'x > 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A logarithm is defined only for positive numbers, because no power of $2$ is zero or negative. So the formula makes sense for $x>0$.'
          - problem: 'A strip of paper is cut in half again and again. The number of cuts needed to reach a piece of length $x$, measured in original lengths, is $n=\log_{1/2}x$. How many more cuts are needed to reach $\frac{1}{64}$ than to reach $\frac18$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Reaching $\frac18$ takes $\log_{1/2}\left(\frac18\right)=3$ cuts, and reaching $\frac1{64}$ takes $6$ cuts. So $6-3=3$ more cuts are needed.'
          - problem: 'Is the graph of $y=\log_{1/3}x$ increasing or decreasing?'
            answer: 'decreasing'
            answer_contract: {"kind": "label", "options": [["decreasing", "it is decreasing", "decreases", "it decreases", "down", "it goes down", "falling"], ["increasing", "it is increasing", "increases", "it increases", "up", "it goes up", "rising"]]}
            solution_sketch: 'The base is $\frac13$, which lies between $0$ and $1$. For such a base the graph falls from left to right, so it is decreasing.'
          - problem: 'What is the asymptote of the graph of $y=\log_4 x$?'
            answer: 'x = 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The logarithm graph is the mirror image of $y=4^x$, whose horizontal asymptote is $y=0$. So its asymptote is the vertical line $x=0$.'
      - id: kp3
        name: The inverse-pair reflection with the exponential
        key_prerequisites: [graphs-of-exponential-functions]
        constraints: "pair y = log_b x with y = b^x; swap point coordinates and swap the asymptote's axis; no shifted graphs"
        exemplars:
          - problem: 'The graph of $y=\log_2 x$ is the mirror image of the graph of $y=2^x$ in which line?'
            answer: 'y = x'
            answer_contract: {"kind": "label", "options": [["y = x", "y=x", "x = y", "x=y", "the line y = x", "the line y=x", "the line x = y", "the line x=y"], ["y = -x", "y=-x", "x = -y", "x=-y"]]}
            solution_sketch: 'A function and its inverse are mirror images of each other in the line $y=x$. So the mirror line is $y=x$.'
          - problem: 'The point $(3,8)$ lies on the graph of $y=2^x$. Which point lies on the graph of $y=\log_2 x$?'
            answer: '(8, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Inverse functions swap input and output. Since $2^3=8$ gives $\log_2 8=3$, the point $(8,3)$ lies on the graph of $y=\log_2 x$.'
          - problem: 'The point $\left(-2,\frac19\right)$ lies on the graph of $y=3^x$. Which point lies on the graph of $y=\log_3 x$?'
            answer: '(1/9, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Inverse functions swap input and output. Since $3^{-2}=\frac19$ gives $\log_3\frac19=-2$, the point $\left(\frac19,-2\right)$ lies on the graph of $y=\log_3 x$.'
          - problem: 'The graph of $y=10^x$ has the horizontal asymptote $y=0$. What is the vertical asymptote of its mirror image $y=\log x$?'
            answer: 'x = 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Mirroring in the line $y=x$ swaps $x$ and $y$. So the horizontal line $y=0$ becomes the vertical line $x=0$.'
          - problem: 'A culture doubles every hour, so after $t$ hours it has $N=2^t$ cells, and the point $(6,64)$ lies on this graph. A second graph shows the number of hours $t=\log_2 N$ against the number of cells $N$. Which point on the second graph describes the same moment?'
            answer: '(64, 6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'After $6$ hours there are $2^6=64$ cells. On the second graph the cell count comes first, so the same moment is the point $(64,6)$.'
          - problem: 'The fraction of a radioactive sample left after $x$ years is $y=\left(\frac12\right)^x$, so the point $\left(3,\frac18\right)$ lies on the graph. Which point on the graph of $y=\log_{1/2}x$ describes the same moment?'
            answer: '(1/8, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'After $3$ years the fraction left is $\left(\frac12\right)^3=\frac18$. The logarithm graph swaps the coordinates, so the point is $\left(\frac18,3\right)$.'
          - problem: 'Which point of $y=\log_3 x$ comes from the point $(2,9)$ of $y=3^x$?'
            answer: '(9, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The mirror line of an inverse pair is $y=x$, not the $x$-axis, so the coordinates swap. Since $3^2=9$ gives $\log_3 9=2$, the point is $(9,2)$.'
          - problem: 'Which point of $y=\log_7 x$ comes from the point $(0,1)$ of $y=7^x$?'
            answer: '(1, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Swapping the coordinates of $(0,1)$ gives $(1,0)$. This agrees with $7^0=1$, which means $\log_7 1=0$.'
    diagnostic_exemplar:
      problem: 'The point $(3, 64)$ lies on $y = 4^x$. Its inverse $y = \log_4 x$ therefore has a vertical asymptote at $x = a$ and passes through $(64, b)$. Find $a + b$.'
      answer: "3"
      solution_sketch: 'The graph of $y = \log_4 x$ has the vertical asymptote $x = 0$, so $a = 0$. Since $(3, 64)$ on $y = 4^x$ reflects to $(64, 3)$ on the inverse, $b = \log_4 64 = 3$. Hence $a + b = 3$.'
    anki_seeds:
      - front: "Domain, vertical asymptote, and x-intercept of y = log_b x?"
        back: "domain x > 0; vertical asymptote x = 0; passes through (1, 0)"
        type: basic
      - front: "The graph of y = log_b x is the reflection of y = b^x across..."
        back: "the line y = x (they are inverses; points and asymptotes swap coordinates)"
        type: basic
      - front: "y = log_b x is increasing when ___ and decreasing when ___."
        back: "b > 1; 0 < b < 1"
        type: basic

  - id: log-product-quotient-rules
    name: Product and Quotient Rules for Logarithms
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: logarithm-basics
        weight: 0.8
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.5
        key: true
      - id: evaluating-logarithms
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The product rule
        key_prerequisites: [logarithm-basics, exponent-product-quotient-rules]
        constraints: "numeric instances must combine to an exact power of the base"
        try_first:
          problem: 'You know $\log_2(4)=2$ and $\log_2(16)=4$. What is $\log_2(4\cdot16)$?'
          answer_contract: {"kind": "exact"}
          answer: '6'
          reveal: 'The product is $4\cdot16=64=2^6$, so $\log_2(64)=6$, which is $2+4$. Multiplying the arguments adds the logarithms: this is the product rule.'
        exemplars:
          - problem: 'Evaluate $\log_2(8)+\log_2(4)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bases match, so multiply the arguments: $\log_2(8\cdot4)=\log_2(32)$. Since $2^5=32$, the value is $5$.'
          - problem: 'Evaluate $\log_2(3)+\log_2\left(\frac{8}{3}\right)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply the arguments: $3\cdot\frac83=8$, so the sum is $\log_2(8)$. Since $2^3=8$, the value is $3$.'
          - problem: 'Find $\log_{10}(4)+\log_{10}(25)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply the arguments: $4\cdot25=100$, so the sum is $\log_{10}(100)$. Since $10^2=100$, the value is $2$.'
          - problem: 'A culture multiplies its cell count by $8$ in its first phase and by $16$ in its second phase. One doubling takes one hour. How many hours does the whole growth take?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total growth factor is $8\cdot16=128=2^7$. One doubling takes one hour, so the growth takes $\log_2(128)=7$ hours, which equals $3+4$.'
          - problem: 'An amplifier stage multiplies the intensity of a sound by $20$, and a second stage multiplies it by $50$. The total gain is $10^n$. Find $n$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total gain is $20\cdot50=1000=10^3$. So $n=\log_{10}(20)+\log_{10}(50)=\log_{10}(1000)=3$ by the product rule applied to both gains.'
          - problem: 'What is $\log_6(2)+\log_6(18)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply the arguments: $2\cdot18=36$, so the sum is $\log_6(36)$. Since $6^2=36$, the value is $2$.'
          - problem: 'Given $\log_5(a)=2$ and $\log_5(b)=3$, find $\log_5(ab)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product rule gives $\log_5(ab)=\log_5(a)+\log_5(b)$. So the value of the product logarithm is $2+3=5$.'
          - problem: 'What is the value of $\log_3(9)+\log_3(27)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A sum of logarithms multiplies the arguments. So $\log_3(9\cdot27)=\log_3(243)=5$, because $3^5=243$.'
      - id: kp2
        name: The quotient rule
        key_prerequisites: [logarithm-basics, exponent-product-quotient-rules]
        constraints: "symbolic expansion of log_b(x/y), or a numeric difference whose quotient is an exact power of the base"
        exemplars:
          - problem: 'Evaluate $\log_3(54)-\log_3(2)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bases match, so divide the arguments: $\log_3\left(\frac{54}{2}\right)=\log_3(27)$. Since $3^3=27$, the value is $3$.'
          - problem: 'Evaluate $\log_2(5)-\log_2(40)$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide in order: $\frac5{40}=\frac18$, so the difference is $\log_2\left(\frac18\right)$. Since $2^{-3}=\frac18$, the value is $-3$.'
          - problem: 'The magnitude of an earthquake is $M=\log_{10}A$, where $A$ is the amplitude in micrometres. One earthquake has amplitude $2000000$ and another has amplitude $20000$. By how much do their magnitudes differ?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The difference is $\log_{10}(2000000)-\log_{10}(20000)=\log_{10}\left(\frac{2000000}{20000}\right)=\log_{10}(100)$. Since $10^2=100$, the two magnitudes differ by $2$ units of the scale.'
          - problem: 'Given $\log_4(m)=7$ and $\log_4(n)=3$, find $\log_4\left(\frac{m}{n}\right)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The quotient rule gives $\log_4\left(\frac mn\right)=\log_4(m)-\log_4(n)$. So the value is $7-3=4$, a difference of the two given numbers.'
          - problem: 'A culture grows steadily from $5$ cells to $160$ cells, doubling at regular intervals. How many doublings take place?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of doublings is $\log_2(160)-\log_2(5)=\log_2\left(\frac{160}{5}\right)=\log_2(32)$. Since $2^5=32$, there are $5$ doublings.'
          - problem: 'What is $\log_{12}(2)-\log_{12}(288)$?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide in order: $\frac2{288}=\frac1{144}$, so the difference is $\log_{12}\left(\frac1{144}\right)$. Since $12^{-2}=\frac1{144}$, the value is $-2$.'
          - problem: 'What is the value of $\log_5(100)-\log_5(4)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A difference of logarithms divides the arguments. So $\log_5\left(\frac{100}{4}\right)=\log_5(25)=2$, because $5^2=25$.'
          - problem: 'Find the value of $\log_2(48)-\log_2(3)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide the arguments: $\frac{48}3=16$, so the difference is $\log_2(16)$. Since $2^4=16$, the value is $4$.'
      - id: kp3
        name: Combine product and quotient rules
        key_prerequisites: [logarithm-basics]
        constraints: "at most three logarithms sharing one base; numeric instances evaluate to a small integer"
        exemplars:
          - problem: 'Evaluate $\log_5(10)+\log_5(5)-\log_5(2)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Plus-signed arguments multiply and the minus-signed argument divides: $\log_5\left(\frac{10\cdot5}{2}\right)=\log_5(25)$. Since $5^2=25$, the value is $2$.'
          - problem: 'Evaluate $\log_3(4)+\log_3(54)-\log_3(8)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Combine into one logarithm: $\log_3\left(\frac{4\cdot54}{8}\right)=\log_3(27)$. Since $3^3=27$, the value of the whole expression is $3$.'
          - problem: 'Given $\log_2(a)=5$, $\log_2(b)=3$ and $\log_2(c)=4$, find $\log_2\left(\frac{ab}{c}\right)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the product and quotient rules, $\log_2\left(\frac{ab}c\right)=\log_2(a)+\log_2(b)-\log_2(c)$. So the value is $5+3-4=4$.'
          - problem: 'A signal is multiplied by $30$ and then by $100$. A filter then divides it by $3$. Overall the signal is multiplied by $10^n$. Find $n$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The overall factor is $\frac{30\cdot100}{3}=1000=10^3$. So $n=\log_{10}(30)+\log_{10}(100)-\log_{10}(3)=\log_{10}(1000)=3$ by the two rules.'
          - problem: 'A culture multiplies its cell count by $12$ in the first phase and by $8$ in the second phase. Then only a third of the cells is kept. Overall the cell count is multiplied by $2^n$. Find $n$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The overall factor is $\frac{12\cdot8}{3}=32=2^5$. So $n=\log_2(12)+\log_2(8)-\log_2(3)=\log_2(32)=5$ by the two rules.'
          - problem: 'What is the value of $\log_2(3)-\log_2(6)+\log_2(8)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The last logarithm has a plus sign, so its argument $8$ belongs in the numerator. The correct argument is $\frac{3\cdot8}{6}=4$, and $\log_2(4)=2$.'
          - problem: 'Find $\log_7(98)-\log_7(2)-\log_7(7)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both subtracted arguments divide: $\log_7\left(\frac{98}{2\cdot7}\right)=\log_7(7)$. Since $7^1=7$, the value of the whole expression is $1$.'
    diagnostic_exemplar:
      problem: 'Evaluate $\log_2(12) + \log_2(8) - \log_2(3)$.'
      answer: "5"
      solution_sketch: 'Combine into one log: $\log_2 \frac{12 \times 8}{3} = \log_2 32$.'
    anki_seeds:
      - front: "log_b(xy) = ?"
        back: "log_b(x) + log_b(y)"
        type: basic
      - front: "log_b(x/y) = ?"
        back: "log_b(x) - log_b(y)"
        type: basic

  - id: log-power-rule
    name: The Power Rule for Logarithms
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: logarithm-basics
        weight: 0.8
        key: true
      - id: power-rule-exponents
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Expand with the power rule
        key_prerequisites: [logarithm-basics, power-rule-exponents]
        try_first:
          problem: 'Given that $\log_2(4)=2$, what is the value of $\log_2(4^3)$?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'Since $4^3=64=2^6$, the logarithm is $6$, which is $3\times\log_2(4)=3\times2$. The exponent of the argument became a multiplier of the logarithm.'
        exemplars:
          - problem: 'Expand $\ln(x^3)$ for $x>0$.'
            answer: '3*ln(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The exponent $3$ of the argument moves in front of the logarithm as a multiplier. So $\ln(x^3)=3\ln(x)$.'
          - problem: 'Expand $\ln(y^5)$ for $y>0$.'
            answer: '5*ln(y)'
            answer_contract: {"kind":"function","vars":["y"]}
            solution_sketch: 'The power rule moves the exponent $5$ in front of the logarithm. So $\ln(y^5)=5\ln(y)$.'
          - problem: 'A square has side $s>0$, so its area is $s^2$. Write the natural logarithm of the area in terms of $\ln(s)$.'
            answer: '2*ln(s)'
            answer_contract: {"kind":"function","vars":["s"]}
            solution_sketch: 'The area is $s^2$, so the logarithm of the area is $\ln(s^2)$. The power rule moves the exponent $2$ to the front and gives $2\ln(s)$.'
          - problem: 'For $x>0$, what is the expansion of $\ln(x^6)$?'
            answer: '6*ln(x)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The argument $x^6$ is six factors of $x$, so its logarithm is six equal terms. Their sum is $6\ln(x)$, and not $6+\ln(x)$.'
          - problem: 'A colony multiplies by $2$ every hour, so after $t$ hours it is $2^t$ times its starting size. Write $\ln(2^t)$ in terms of $\ln(2)$.'
            answer: 't*ln(2)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The exponent of the argument is $t$, so the power rule moves $t$ in front. This gives $\ln(2^t)=t\ln(2)$, a multiple of the fixed number $\ln(2)$.'
          - problem: 'A cube has side $a>0$, so its volume is $a^3$. Write the natural logarithm of the volume in terms of $\ln(a)$.'
            answer: '3*ln(a)'
            answer_contract: {"kind":"function","vars":["a"]}
            solution_sketch: 'The volume is $a^3$, so its natural logarithm is $\ln(a^3)$. The power rule moves the exponent $3$ to the front and gives $3\ln(a)$.'
          - problem: 'Expand $\ln(p^7)$ for $p>0$.'
            answer: '7*ln(p)'
            answer_contract: {"kind":"function","vars":["p"]}
            solution_sketch: 'The exponent $7$ moves in front of the logarithm as a multiplier. So $\ln(p^7)=7\ln(p)$.'
        constraints: "a power of one variable or of one measured quantity; natural logarithm; the exponent is an integer from 2 to 8 or the variable $t$; the answer is that exponent times the logarithm"
      - id: kp2
        name: Logs of powers of the base
        key_prerequisites: [logarithm-basics]
        exemplars:
          - problem: 'Evaluate $\log_5(5^7)$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The logarithm to base $5$ asks for the exponent on $5$ that gives $5^7$. That exponent is $7$.'
          - problem: 'The pH of a solution is $-\log(h)$, where $h$ is the hydrogen-ion concentration in mol/L. Find the pH when $h=10^{-8}$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\log(10^{-8})=-8$, because the exponent on $10$ that gives $10^{-8}$ is $-8$. So the pH is $-(-8)=8$.'
          - problem: 'A sound is $10^9$ times as intense as the quietest sound a person can hear. Its level in decibels is $10\log(10^9)$. Find the level.'
            answer: '90'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\log(10^9)=9$, the level is $10\times9=90$ decibels. The value $9$ is the exponent on $10$ that gives $10^9$.'
          - problem: 'What is the value of $\log_2(2^5)$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The logarithm to base $2$ is the exponent on $2$ that gives $2^5$. That exponent is $5$, and it is not the product $2\cdot5$.'
          - problem: 'A mould sample doubles in size every hour. It is now $2^{10}$ times its starting size. For how many hours has it grown?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'After $h$ hours the sample is $2^h$ times its starting size. Setting $2^h=2^{10}$ gives $h=10$ hours, which is $\log_2(2^{10})$.'
          - problem: 'Evaluate $\log_4(64)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the argument as a power of the base: $64=4^3$. So the logarithm to base $4$ of $64$ is $3$.'
          - problem: 'Evaluate $\log_6\left(\dfrac{1}{36}\right)$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\frac{1}{36}=6^{-2}$, the exponent on $6$ that gives the argument is $-2$. So the value is $-2$.'
        constraints: "the argument is an integer power of the base itself, a number that is such a power, or a reciprocal of one; the exponent is an integer from -6 to 10; the answer is that exponent"
      - id: kp3
        name: Condense with the power rule
        key_prerequisites: [logarithm-basics]
        exemplars:
          - problem: 'Write $4\ln(x)$ as a single logarithm, for $x>0$.'
            answer: 'ln(x^4)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The power rule runs backwards here: the multiplier $4$ becomes the exponent of the argument. So $4\ln(x)=\ln(x^4)$.'
          - problem: 'Find the value of $3\log_2(4)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The multiplier becomes an exponent, so $3\log_2(4)=\log_2(4^3)=\log_2(64)$. Since $64=2^6$, the value of the logarithm is $6$.'
          - problem: 'For $x>0$, write $2\ln(x)$ as a single logarithm.'
            answer: 'ln(x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The multiplier $2$ must become an exponent of the argument and not a factor. So $2\ln(x)=\ln(x^2)$, because $\ln(x^2)=\ln(x)+\ln(x)$.'
          - problem: 'A square has side $w>0$. A table lists $2\ln(w)$ for it. Write this entry as the logarithm of one quantity.'
            answer: 'ln(w^2)'
            answer_contract: {"kind":"function","vars":["w"]}
            solution_sketch: 'The multiplier $2$ becomes the exponent of the argument. So $2\ln(w)=\ln(w^2)$, the logarithm of the area of the square.'
          - problem: 'An investment grows by the factor $g>0$ each year. A table lists $4\ln(g)$ for the end of year four. Write this entry as the logarithm of one quantity.'
            answer: 'ln(g^4)'
            answer_contract: {"kind":"function","vars":["g"]}
            solution_sketch: 'The multiplier $4$ becomes the exponent of the argument. So $4\ln(g)=\ln(g^4)$, the logarithm of the growth factor over four years.'
          - problem: 'Find the value of $4\log(1000)$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\log(1000)=3$, because $10^3=1000$, the value is $4\times3=12$. The power rule gives the same result: $\log(1000^4)=\log(10^{12})=12$.'
          - problem: 'Write $6\ln(y)$ as a single logarithm, for $y>0$.'
            answer: 'ln(y^6)'
            answer_contract: {"kind":"function","vars":["y"]}
            solution_sketch: 'The power rule runs backwards here: the multiplier $6$ becomes the exponent of the argument. So $6\ln(y)=\ln(y^6)$.'
        constraints: "integer multipliers 2-6; natural logarithms, or a numerical argument that is a power of the base; the answer is one logarithm or its value"
    diagnostic_exemplar:
      problem: 'Find the value of $5\log_3(9)$.'
      answer: "10"
      solution_sketch: 'The coefficient becomes an exponent: $\log_3(9^5) = \log_3(3^{10})$, so the value is $10$.'
    anki_seeds:
      - front: "log_b(x^n) = ?"
        back: "n·log_b(x)"
        type: basic

  - id: logarithm-properties
    name: Properties of Logarithms
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: log-product-quotient-rules
        weight: 0.7
        key: true
      - id: log-power-rule
        weight: 0.7
        key: true
      - id: logarithm-basics
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Expand with several properties
        key_prerequisites: [log-product-quotient-rules, log-power-rule]
        exemplars:
          - problem: 'Expand $\ln\left(\dfrac{x^2y}{z}\right)$ for positive $x$, $y$ and $z$.'
            answer: '2*ln(x)+ln(y)-ln(z)'
            answer_contract: {"kind":"function","vars":["x","y","z"]}
            solution_sketch: 'Split the quotient and the product: $\ln(x^2)+\ln(y)-\ln(z)$. The power rule changes the first term to $2\ln(x)$.'
          - problem: 'Expand $\ln(x^3y^2)$ for positive $x$ and $y$.'
            answer: '3*ln(x)+2*ln(y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The product rule gives $\ln(x^3)+\ln(y^2)$. The power rule then moves each exponent to the front: $3\ln(x)+2\ln(y)$.'
          - problem: 'Expand $\ln\left(\dfrac{x^2}{y^3}\right)$ for positive $x$ and $y$.'
            answer: '2*ln(x)-3*ln(y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The quotient rule gives $\ln(x^2)-\ln(y^3)$. The power rule then moves both exponents to the front and gives $2\ln(x)-3\ln(y)$.'
          - problem: 'For positive $x$ and $y$, what is the expansion of $\ln\left((xy)^2\right)$?'
            answer: '2*ln(x)+2*ln(y)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The exponent $2$ applies to the whole product $xy$, so it applies to both factors. This gives $2\ln(x)+2\ln(y)$.'
          - problem: 'A cylinder of radius $r>0$ and height $h>0$ has volume $V=\pi r^2h$. Expand $\ln(V)$.'
            answer: 'ln(pi)+2*ln(r)+ln(h)'
            answer_contract: {"kind":"function","vars":["h","r"]}
            solution_sketch: 'The product rule splits $\ln(\pi r^2h)$ into three terms. The power rule moves the $2$ to the front, and the result is $\ln(\pi)+2\ln(r)+\ln(h)$.'
          - problem: 'A cube of side $s>0$ and mass $m>0$ has density $d=\dfrac{m}{s^3}$. Expand $\ln(d)$.'
            answer: 'ln(m)-3*ln(s)'
            answer_contract: {"kind":"function","vars":["m","s"]}
            solution_sketch: 'The quotient rule gives $\ln(m)-\ln(s^3)$. The power rule changes the second term to $3\ln(s)$, so $\ln(d)=\ln(m)-3\ln(s)$.'
          - problem: 'A body of mass $m>0$ moving at speed $v>0$ has kinetic energy $E=\tfrac12mv^2$. Expand $\ln(E)$.'
            answer: 'ln(m)+2*ln(v)-ln(2)'
            answer_contract: {"kind":"function","vars":["m","v"]}
            solution_sketch: 'Write $E=mv^2/2$. The product and quotient rules give $\ln(m)+\ln(v^2)-\ln(2)$, and the power rule turns $\ln(v^2)$ into $2\ln(v)$.'
        constraints: "products, quotients and powers of two or three variables, or a formula from geometry or physics; natural logarithm; integer exponents 2-3; expand fully into single-variable logarithms plus constants"
      - id: kp2
        name: Condense to a single logarithm
        key_prerequisites: [log-product-quotient-rules, log-power-rule]
        exemplars:
          - problem: 'Write $2\ln(x)+\ln(5)$ as a single logarithm, for $x>0$.'
            answer: 'ln(5*x^2)'
            answer_contract: {"kind":"function","vars":["x"]}
            solution_sketch: 'The power rule turns $2\ln(x)$ into $\ln(x^2)$. The product rule then combines the two terms: $\ln(x^2)+\ln(5)=\ln(5x^2)$.'
          - problem: 'Write $3\ln(x)-2\ln(y)$ as a single logarithm, for positive $x$ and $y$.'
            answer: 'ln(x^3/y^2)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'The power rule changes the terms to $\ln(x^3)-\ln(y^2)$. The quotient rule then gives $\ln(x^3/y^2)$.'
          - problem: 'Write $2\ln(x)+\ln(y)-\ln(z)$ as a single logarithm, for positive $x$, $y$ and $z$.'
            answer: 'ln(x^2*y/z)'
            answer_contract: {"kind":"function","vars":["x","y","z"]}
            solution_sketch: 'The coefficient gives $\ln(x^2)$. The sum multiplies by $y$ and the difference divides by $z$, so the result is $\ln(x^2y/z)$.'
          - problem: 'For positive $x$ and $y$, write $2\ln(x)+3\ln(y)$ as a single logarithm.'
            answer: 'ln(x^2*y^3)'
            answer_contract: {"kind":"function","vars":["x","y"]}
            solution_sketch: 'A sum of logarithms multiplies the arguments. The power rule gives $\ln(x^2)+\ln(y^3)$, which is $\ln(x^2y^3)$.'
          - problem: 'A weather station records the pressures $p>0$ and $q>0$ at two heights. The change in log pressure is $\ln(p)-\ln(q)$. Write this as a single logarithm.'
            answer: 'ln(p/q)'
            answer_contract: {"kind":"function","vars":["p","q"]}
            solution_sketch: 'A difference of logarithms is the logarithm of a quotient. So $\ln(p)-\ln(q)=\ln(p/q)$, the log of the ratio of the two pressures.'
          - problem: 'The volume of a cylinder satisfies $\ln(V)=\ln(\pi)+2\ln(r)+\ln(h)$. Write the right-hand side as a single logarithm.'
            answer: 'ln(pi*r^2*h)'
            answer_contract: {"kind":"function","vars":["h","r"]}
            solution_sketch: 'The power rule changes $2\ln(r)$ into $\ln(r^2)$. The product rule then combines the three terms into $\ln(\pi r^2h)$.'
        constraints: "two or three logarithm terms sharing one base, natural; integer coefficients 2-3; the answer is a single logarithm"
      - id: kp3
        name: Evaluate from given log values
        key_prerequisites: [log-product-quotient-rules, log-power-rule]
        exemplars:
          - problem: 'Let $m=\log_b(2)$ and $n=\log_b(3)$ for a base $b>0$ with $b\ne1$. Express $\log_b(12)$ in terms of $m$ and $n$.'
            answer: '2*m+n'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor the argument as $12=2^2\cdot3$, which uses only the numbers $2$ and $3$. The product and power rules then give $\log_b(12)=2\log_b(2)+\log_b(3)=2m+n$.'
          - problem: 'Let $m=\log_b(2)$ and $n=\log_b(3)$ for a base $b>0$ with $b\ne1$. Express $\log_b\left(\dfrac{9}{2}\right)$ in terms of $m$ and $n$.'
            answer: '2*n-m'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the argument as $\frac92=\frac{3^2}{2}$, which uses only the numbers $2$ and $3$. The quotient and power rules then give $\log_b(9/2)=2\log_b(3)-\log_b(2)=2n-m$.'
          - problem: 'Let $m=\log_b(2)$ and $n=\log_b(3)$ for a base $b>0$ with $b\ne1$. Express $\log_b\left(\sqrt{18}\right)$ in terms of $m$ and $n$.'
            answer: 'm/2+n'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the argument as $\sqrt{18}=2^{1/2}\cdot3$, which uses only the numbers $2$ and $3$. The product and power rules then give $\tfrac12\log_b(2)+\log_b(3)=\tfrac{m}{2}+n$.'
          - problem: 'Let $m=\log_b(2)$ and $n=\log_b(3)$ for a base $b>0$ with $b\ne1$. Express $\log_b\left(\dfrac{1}{12}\right)$ in terms of $m$ and $n$.'
            answer: '-2*m-n'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $12=2^2\cdot3$, its logarithm is $2m+n$. The reciprocal $\frac{1}{12}$ has the negative logarithm, $-2m-n$.'
          - problem: 'A culture multiplies its size by $6$ every hour. Let $m=\ln(2)$ and $n=\ln(3)$. Write the logarithm of the growth factor after $3$ hours, $\ln\left(6^3\right)$, in terms of $m$ and $n$.'
            answer: '3*m+3*n'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power rule gives $\ln(6^3)=3\ln(6)$. Since $6=2\cdot3$, the product rule then makes this $3(\ln(2)+\ln(3))=3m+3n$.'
          - problem: 'The graph of $y=\ln(x)$ passes through $(2,m)$ and $(3,n)$. Find the height of the graph at $x=\dfrac{8}{3}$ in terms of $m$ and $n$.'
            answer: '3*m-n'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the argument as $\frac83=\frac{2^3}{3}$, which uses only the numbers $2$ and $3$. The quotient and power rules then give $\ln(8/3)=3\ln(2)-\ln(3)=3m-n$.'
        constraints: "express targets in terms of m = log_b 2 and n = log_b 3 (or the same letters for natural logarithms); products, quotients, roots and reciprocals of 2 and 3"
    diagnostic_exemplar:
      problem: 'If $\log_b(2) = m$ and $\log_b(3) = n$, express $\log_b\left(\frac{8}{3}\right)$ in terms of $m$ and $n$.'
      answer: "3m - n"
      solution_sketch: '$\log_b 8 = 3\log_b 2$, and the quotient subtracts: $3m - n$.'
    anki_seeds:
      - front: "Condensed form of 2·log_b(x) + log_b(y)?"
        back: "log_b(x²y)"
        type: basic

  - id: change-of-base-formula
    name: The Change of Base Formula
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: logarithm-properties
        weight: 0.6
        key: true
      - id: common-natural-logarithms
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Rewrite with a new base
        key_prerequisites: [logarithm-properties, common-natural-logarithms]
        try_first:
          problem: 'A calculator shows $\log(8)=0.903$ and $\log(2)=0.301$. What is $0.903\div0.301$?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'The quotient is $3$, which is $\log_2(8)$ because $2^3=8$. Dividing the common logarithm of the argument by the common logarithm of the base gives the logarithm in that base.'
        exemplars:
          - problem: 'Rewrite $\log_5(12)$ using common logarithms.'
            answer: 'log(12)/log(5)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Change of base puts the argument on top and the base below. So $\log_5(12)=\frac{\log(12)}{\log(5)}$.'
          - problem: 'Rewrite $\log_3(7)$ using natural logarithms.'
            answer: 'ln(7)/ln(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Change of base puts the argument on top and the base below. So $\log_3(7)=\frac{\ln(7)}{\ln(3)}$.'
          - problem: 'An investment grows by the factor $1.07$ each year. The time $t$ in years that it takes to double satisfies $1.07^t=2$, so $t=\log_{1.07}(2)$. Write $t$ as a quotient of natural logarithms.'
            answer: 'ln(2)/ln(1.07)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking natural logarithms of $1.07^t=2$ gives $t\ln(1.07)=\ln(2)$. Dividing by the nonzero $\ln(1.07)$ gives $t=\ln(2)/\ln(1.07)$.'
          - problem: 'A calculator has only a common logarithm key. Write the solution of $6^c=11$ as a quotient of common logarithms.'
            answer: 'log(11)/log(6)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking common logarithms of both sides gives $c\log(6)=\log(11)$. Dividing by $\log(6)$ then gives $c=\log(11)/\log(6)$.'
          - problem: 'Rewrite $\log_4(9)$ with natural logarithms as a quotient. What is the quotient?'
            answer: 'ln(9)/ln(4)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The argument goes on top and the base below, so $\log_4(9)=\ln(9)/\ln(4)$. The quotient is not upside down.'
          - problem: 'The graph of $y=\log_4(x)$ is drawn on a calculator that has only a natural logarithm key. Write its height at $x=20$ using natural logarithms.'
            answer: 'ln(20)/ln(4)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height is $\log_4(20)$. With natural logarithms this is $\ln(20)/\ln(4)$, the log of the argument over the log of the base.'
          - problem: 'A deposit grows by the factor $1.05$ each year. Write the time $t$ in years that it takes to triple, from $1.05^t=3$, as a quotient of common logarithms.'
            answer: 'log(3)/log(1.05)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking common logarithms of both sides of $1.05^t=3$ gives $t\log(1.05)=\log(3)$. Dividing by $\log(1.05)$ then gives $t=\log(3)/\log(1.05)$.'
        constraints: "the problem names the new base (common or natural) or a calculator that has only one of them; the answer is a quotient of two logarithms, left unevaluated"
      - id: kp2
        name: Exact evaluation via change of base
        key_prerequisites: [logarithm-properties]
        exemplars:
          - problem: 'Find the exact value of $\log_4(8)$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Change to base $2$, where both numbers are powers of $2$. Then $\log_4(8)=\frac{\log_2(8)}{\log_2(4)}=\frac{3}{2}$, because $8=2^3$ and $4=2^2$.'
          - problem: 'A culture is multiplied by $4$ every hour. In how many hours has it grown by a factor of $32$?'
            answer: '5/2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'The time $t$ satisfies $4^t=32$, so $t=\log_4(32)$. Changing to base $2$ gives $t=5/2$, because $32=2^5$ and $4=2^2$. That is $2.5$ hours.'
          - problem: 'Find the exact value of $\log_8(16)$.'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Change to base $2$, where both numbers are powers of $2$. Then $\log_8(16)=\frac{\log_2(16)}{\log_2(8)}=\frac{4}{3}$, because $16=2^4$ and $8=2^3$.'
          - problem: 'Change $\log_8(32)$ to base $2$. What is the value of $\log_8(32)$?'
            answer: '5/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The argument goes on top: $\log_8(32)=\frac{\log_2(32)}{\log_2(8)}=\frac{5}{3}$. The quotient $\frac{3}{5}$ is upside down.'
          - problem: 'The graph of $y=\log_{16}(x)$ passes through the point $(32,c)$. Find $c$.'
            answer: '5/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height is $c=\log_{16}(32)$. In base $2$ this becomes $\frac{\log_2(32)}{\log_2(16)}=\frac{5}{4}$, because $32=2^5$ and $16=2^4$.'
          - problem: 'The number of people who know a rumour is multiplied by $8$ every day. In how many days has it grown by a factor of $128$?'
            answer: '7/3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"day","allow_omitted":true}
            solution_sketch: 'The time $d$ satisfies $8^d=128$, so $d=\log_8(128)$. In base $2$ this is $7/3$, because $128=2^7$ and $8=2^3$. That is $2\frac13$ days.'
        constraints: "both base and argument are powers of the same small integer, or the argument is a power of the base with a fractional exponent; the answer is a fraction; contexts ask how long a growth factor takes"
      - id: kp3
        name: Recognize change-of-base quotients
        key_prerequisites: [common-natural-logarithms]
        exemplars:
          - problem: 'Simplify $\dfrac{\log(32)}{\log(2)}$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient is $\log_2(32)$ by change of base. Since $32=2^5$, the value is $5$.'
          - problem: 'Simplify $\dfrac{\ln(81)}{\ln(3)}$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient is $\log_3(81)$ by change of base. Since $81=3^4$, the value is $4$.'
          - problem: 'What is the value of $\dfrac{\log(1000)}{\log(10)}$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The operation is division, not subtraction. The common logarithms are $3$ and $1$, so the quotient is $3\div1=3$.'
          - problem: 'A cell divides in two every hour. Solving $2^c=64$ with natural logarithms gives $c=\dfrac{\ln(64)}{\ln(2)}$. How many hours is that?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'The quotient is $\log_2(64)$ by change of base. Since $64=2^6$, the value is $6$ hours.'
          - problem: 'A mould triples in area every day. Solving $3^t=243$ with common logarithms gives $t=\dfrac{\log(243)}{\log(3)}$. How many days is that?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"time","unit":"day","allow_omitted":true}
            solution_sketch: 'The quotient is $\log_3(243)$ by change of base. Since $243=3^5$, the value is $5$ days.'
          - problem: 'Simplify $\dfrac{\ln(27)}{\ln(9)}$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient is $\log_9(27)$ by change of base. In base $3$ it is $\frac{3}{2}$, because $27=3^3$ and $9=3^2$.'
        constraints: "numerator and denominator are logarithms of powers of one small integer, plain or inside a growth problem; the answer is an exact integer or simple fraction"
    diagnostic_exemplar:
      problem: 'Evaluate $\log_4(32)$ exactly.'
      answer: "5/2"
      solution_sketch: 'Change to base $2$: $\frac{\log_2 32}{\log_2 4} = \frac{5}{2}$.'
    anki_seeds:
      - front: "Change of base: log_b(a) = ?"
        back: "log(a)/log(b), using any convenient base."
        type: basic

  - id: logarithmic-equations
    name: Solving Logarithmic Equations
    core: false                # terminal solve genre; logarithm-properties stays core
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: logarithm-properties
        weight: 0.6
        key: true
      - id: logarithm-basics
        weight: 0.7
        key: true
      - id: exponential-equations
        weight: 0.4
      - id: two-step-equations
        weight: 0.3
      - id: quadratic-equations-factoring
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Solve by converting to exponential form
        key_prerequisites: [logarithm-basics]
        try_first:
          problem: 'Find $x$ if $\log_6(x)=2$.'
          answer_contract: {"kind":"exact"}
          answer: '36'
          reveal: 'The equation says that $6$ raised to the power $2$ gives $x$, so $x=6^2=36$. A logarithm equation turns into a power equation.'
        exemplars:
          - problem: 'Solve $\log_2(x)=5$.'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the equation in exponential form: $x=2^5=32$. This value is positive, so it is in the domain.'
          - problem: 'The graph of $y=\log_3(x)$ reaches the height $4$. At which $x$ does this happen?'
            answer: '81'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height $4$ gives the equation $\log_3(x)=4$, so $x=3^4=81$. This input is positive, so it is in the domain.'
          - problem: 'The pH of a solution is $-\log(h)$, where $h$ mol/L is its hydrogen-ion concentration. A solution has pH $3$. Find $h$.'
            answer: '1/1000'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation $-\log(h)=3$ gives $\log(h)=-3$. So in exponential form $h=10^{-3}=\frac{1}{1000}$ mol/L, which is a small positive concentration.'
          - problem: 'A sound of intensity $I$, measured in units of the quietest audible sound, has the level $10\log(I)$ decibels. Find $I$ for a sound of $70$ decibels.'
            answer: '10^7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation $10\log(I)=70$ gives $\log(I)=7$. So $I=10^7$, ten million times the quietest audible sound.'
          - problem: 'Solve $\log_5(x)=3$.'
            answer: '125'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The logarithm is the exponent on $5$, so $x=5^3=125$. Raise $5$ to the power $3$. Do not multiply $5\times3$.'
          - problem: 'Solve $\log_2(x)=-3$.'
            answer: '1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The equation in exponential form is $x=2^{-3}$. This equals $\frac{1}{8}$, which is positive and so in the domain.'
          - problem: 'Solve $\log_3(x+1)=2$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In exponential form $x+1=3^2=9$. So $x=8$, and the argument $x+1=9$ is positive, so the solution is valid.'
        constraints: "one logarithm of x or of a linear expression, already isolated; bases 2, 3, 4, 5 or 10; the solution is an integer, a negative power or a power of ten"
      - id: kp2
        name: Apply a property, then solve
        key_prerequisites: [logarithm-properties]
        exemplars:
          - problem: 'Solve $\log_2(x)+\log_2(3)=\log_2(12)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The domain is $x>0$. Combine to get $\log_2(3x)=\log_2(12)$, so $3x=12$ and the valid solution is $x=4$.'
          - problem: 'Solve $\log_5(x)-\log_5(2)=1$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The domain is $x>0$. The quotient rule gives $\log_5(x/2)=1$, so $x/2=5$ and $x=10$, which is positive.'
          - problem: 'Solve $\log_3(x)+\log_3(4)=\log_3(20)$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A sum of logarithms is the logarithm of the product, so the equation is $\log_3(4x)=\log_3(20)$. Then $4x=20$ and $x=5$.'
          - problem: 'Solve $\log_2(24)-\log_2(x)=3$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The domain is $x>0$. The quotient rule gives $\log_2(24/x)=3$, so $24/x=8$. Then $x=3$, which is positive.'
          - problem: 'Speaker A has an intensity of $5$ units. Speaker B sounds $20$ decibels louder, so its intensity $x$ satisfies $10\log(x)-10\log(5)=20$. Find $x$.'
            answer: '500'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide by $10$ to get $\log(x)-\log(5)=2$. The quotient rule gives $\log(x/5)=2$, so $x/5=100$ and $x=500$.'
          - problem: 'An account holds 500 dollars. After one year its balance $A$ in dollars satisfies $\ln(A)=\ln(500)+\ln(1.04)$. Find $A$.'
            answer: '520'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The product rule gives $\ln(A)=\ln(500\times1.04)$. Two equal logarithms have equal arguments, so $A=500\times1.04=520$ dollars.'
          - problem: 'Solve $\log(x)+\log(5)=2$.'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The domain is $x>0$. The product rule gives $\log(5x)=2$, so $5x=10^2=100$. Then $x=20$, which is positive.'
        constraints: "two logarithms of the same base combined by the product or quotient rule, or two terms with coefficient 10 or 1; integer solutions, never at an excluded value"
      - id: kp3
        name: Equations leading to a quadratic (check for extraneous roots)
        key_prerequisites: [logarithm-properties, quadratic-equations-factoring]
        exemplars:
          - problem: 'Solve $\log_3(x)+\log_3(x-2)=1$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The domain requires $x>2$. Combining gives $x(x-2)=3$, so $(x-3)(x+1)=0$. The root $3$ is valid and the root $-1$ is outside the domain.'
          - problem: 'Solve $\log_2(x-1)+\log_2(x+1)=\log_2(15)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The domain requires $x>1$. Combining gives $(x-1)(x+1)=15$, so $x^2=16$. Of the roots $4$ and $-4$, only $4$ is in the domain.'
          - problem: 'Solve $\log_2(x-2)+\log_2(x-4)=3$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The domain requires $x>4$. Combining gives $(x-2)(x-4)=8$, so $x^2-6x=0$ and $x=0$ or $x=6$. Only $6$ is in the domain.'
          - problem: 'Solve $\log_3(x)+\log_3(x+6)=3$. What are the solutions of the equation?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The domain requires $x>0$. The product equation $x(x+6)=27$ gives $(x-3)(x+9)=0$. Only the root $3$ gives positive arguments, so $-9$ is rejected.'
          - problem: 'A rectangular plot is $x$ m wide and $(x+7)$ m long. A surveyor records its area of $60$ square metres as $\ln(x)+\ln(x+7)=\ln(60)$. Find the width of the plot.'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The domain requires $x>0$. Combining gives $x(x+7)=60$, so $(x+12)(x-5)=0$. The root $-12$ is rejected, so the width is $5$ m.'
          - problem: 'The two sides of a card are $x$ cm and $(x+3)$ cm long. The common logarithms of the two sides add to $1$. Find the length of the shorter side.'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The domain requires $x>0$. Combining gives $x(x+3)=10^1=10$, so $(x+5)(x-2)=0$. The root $-5$ is rejected, so $x=2$ cm.'
        constraints: "the combined argument is a quadratic with two roots, one of which makes a logarithm undefined and must be rejected; contexts with a width or a length"
    diagnostic_exemplar:
      problem: 'Solve $\log_2(x) + \log_2(x - 6) = 4$.'
      answer: "x = 8"
      solution_sketch: 'The product rule gives $x(x - 6) = 2^4 = 16$, so $(x - 8)(x + 2) = 0$; $x = -2$ is extraneous because $\log_2$ needs a positive argument.'
    anki_seeds:
      - front: "To solve log_b(x) = c, rewrite it as..."
        back: "x = b^c (exponential form)"
        type: basic
      - front: "After solving a logarithmic equation, always..."
        back: "check each candidate in the original equation: every log argument must be positive (reject extraneous roots)."
        type: basic

  - id: exponential-equations-with-logarithms
    name: Exponential Equations via Logarithms
    core: false                # terminal solve genre; log machinery stays core
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: exponential-equations
        weight: 0.6
        key: true
      - id: logarithm-properties
        weight: 0.5
        key: true
      - id: common-natural-logarithms
        weight: 0.4
      - id: change-of-base-formula
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Exact answers as logarithms
        key_prerequisites: [exponential-equations]
        constraints: 'the right side is never an integer power of the base; the base may be a decimal such as 1.05'
        try_first:
          problem: 'Find the largest whole number $x$ for which $2^x$ is less than $10$.'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: '$2^3=8$ is below $10$ and $2^4=16$ is above it, so the solution of $2^x=10$ lies between $3$ and $4$ and is not a whole number. A logarithm finds such an exponent exactly.'
        exemplars:
          - problem: 'Solve $2^x=10$ exactly.'
            answer: 'ln(10)/ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The unknown sits in the exponent, so take natural logs of both sides to get $x\ln2=\ln10$. Divide by $\ln2$, which is not zero, to get $x=\ln10/\ln2$.'
          - problem: 'Every hour a dish of bacteria holds three times as many cells as the hour before. After how many hours does the dish hold $50$ times as many cells as at the start?'
            answer: 'ln(50)/ln(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $t$ hours the dish holds $3^t$ times the starting number, so $3^t=50$. Taking logs gives $t\ln3=\ln50$, hence $t=\ln50/\ln3$.'
          - problem: 'At what value of $x$ does the graph of $y=7^x$ reach the height $40$?'
            answer: 'ln(40)/ln(7)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The height is $40$, so $7^x=40$. Taking natural logs gives $x\ln7=\ln40$, so $x=\ln40/\ln7$.'
          - problem: 'Solve $5^x=30$.'
            answer: 'ln(30)/ln(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing the numbers gives $6$, but $5^6=15625$ is far from $30$. The exponent must come down first: $x\ln5=\ln30$, so $x=\ln30/\ln5$.'
          - problem: 'A balance grows by $5\%$ each year, so after $t$ years it is $1.05^t$ times the original balance. After how many years is it twice the original balance?'
            answer: 'ln(2)/ln(1.05)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Twice the original balance means $1.05^t=2$. Taking logs gives $t\ln1.05=\ln2$, so $t=\ln2/\ln1.05$.'
          - problem: 'The number of people who have seen a message is multiplied by $4$ every day. After how many days has the audience grown to $500$ times its starting size?'
            answer: 'ln(500)/ln(4)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The audience after $t$ days is $4^t$ times the start, so $4^t=500$. Taking logs gives $t\ln4=\ln500$, so $t=\ln500/\ln4$.'
      - id: kp2
        name: Isolate the exponential first
        key_prerequisites: [exponential-equations]
        constraints: 'an integer coefficient multiplies the exponential and is divided out first; what remains is an exact power of the base or an exact logarithm'
        exemplars:
          - problem: 'Solve $2\cdot5^x=30$ exactly.'
            answer: 'ln(15)/ln(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide both sides by $2$ to isolate the power: $5^x=15$. Taking natural logs gives $x\ln5=\ln15$, so $x=\ln15/\ln5$.'
          - problem: 'Solve $3\cdot2^x=96$.'
            answer: 'x = 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing both sides by $3$ leaves the lone power $2^x=32$. Since $32=2^5$, equal bases force equal exponents, so $x=5$.'
          - problem: 'The population of a colony, in thousands, is modelled by $P(t)=4\cdot3^t$, where $t$ is in years. When does the population reach $108$ thousand?'
            answer: 't = 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $4\cdot3^t=108$ and divide by $4$ to get $3^t=27$. Because $27=3^3$, the time is $t=3$ years.'
          - problem: 'The graph of $y=3\cdot4^x$ reaches the height $30$. At what value of $x$ does this happen?'
            answer: 'ln(10)/ln(4)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing the height by $3$ gives $4^x=10$. Taking logs gives $x\ln4=\ln10$, so $x=\ln10/\ln4$.'
          - problem: 'A sum of €200 is invested at $6\%$ a year, so after $t$ years it is worth $200\cdot1.06^t$ euros. After how many years is it worth €1000?'
            answer: 'ln(5)/ln(1.06)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $200\cdot1.06^t=1000$ and divide by $200$ to get $1.06^t=5$. Taking logs gives $t\ln1.06=\ln5$, so $t=\ln5/\ln1.06$.'
          - problem: 'Solve $5\cdot2^x=60$.'
            answer: 'ln(12)/ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $5$ multiplies only the power $2^x$, so it cannot be merged into the base. Divide by $5$ to get $2^x=12$, then $x\ln2=\ln12$ and $x=\ln12/\ln2$.'
          - problem: 'A dish starts with $2000$ bacteria, and the number triples every hour, so after $t$ hours it holds $2000\cdot3^t$. After how many hours does it hold $90000$?'
            answer: 'ln(45)/ln(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $2000\cdot3^t=90000$ and divide by $2000$ to get $3^t=45$. Taking logs gives $t\ln3=\ln45$, so $t=\ln45/\ln3$.'
      - id: kp3
        name: Solve with natural or common logs
        key_prerequisites: [common-natural-logarithms, logarithm-properties]
        constraints: 'the problem states which logarithm to use (natural or common) or the base makes it clear (base e or base 10); answers are exact quotients of logarithms, or a single ln or log'
        exemplars:
          - problem: 'Solve $3^x=20$ using natural logarithms.'
            answer: 'ln(20)/ln(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take $\ln$ of both sides to get $x\ln3=\ln20$. Divide by $\ln3$ to get $x=\ln20/\ln3$.'
          - problem: 'Solve $e^x=7$.'
            answer: 'x = ln(7)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take $\ln$ of both sides: $\ln(e^x)=\ln7$. Because $\ln e=1$, the left side is $x$, so $x=\ln7$.'
          - problem: 'Solve $10^x=45$ using common logarithms.'
            answer: 'x = log(45)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $45$ is not a power of $10$. Taking $\log$ of both sides gives $x\log10=\log45$, and $\log10=1$, so $x=\log45$.'
          - problem: 'Solve $5^x=12$ using common logarithms.'
            answer: 'log(12)/log(5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take $\log$ of both sides to get $x\log5=\log12$. Divide by $\log5$ to get $x=\log12/\log5$.'
          - problem: 'A culture contains $e^{t}$ thousand cells after $t$ hours. After how many hours does it contain $25$ thousand cells?'
            answer: 't = ln(25)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $e^t=25$. Taking natural logs gives $t=\ln25$, since $\ln$ undoes the base $e$.'
          - problem: 'A colony of $2$ thousand cells grows tenfold every day, so it holds $2\cdot10^t$ thousand cells after $t$ days. After how many days does it hold $500$ thousand cells?'
            answer: 't = log(250)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Dividing $2\cdot10^t=500$ by $2$ gives $10^t=250$. Taking common logs gives $t=\log250$, because $\log10=1$.'
          - problem: 'Solve $4^x=9$.'
            answer: 'ln(9)/ln(4)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Taking logs of $4^x=9$ gives $x\ln4=\ln9$, so $x$ is multiplied by $\ln4$ and must be divided by it. The correct solution is $x=\ln9/\ln4$, not the difference.'
    diagnostic_exemplar:
      problem: 'Solve $4\cdot3^x=100$ using natural logarithms.'
      answer: "x = ln(25)/ln(3)"
      solution_sketch: 'Isolate the power first: $3^x = 25$, then take $\ln$ of both sides.'
    anki_seeds:
      - front: "To solve b^x = c when c is not a power of b..."
        back: "take a log of both sides: x = log_b(c) = ln(c)/ln(b)."
        type: basic

  # ---- Phase C (gap C-2): the natural exponential --------------------------------
  # Before these topics, e appeared only inside ln facts (common-natural-logarithms)
  # and one solve exemplar; no topic taught e or e^x as a function, yet
  # calculus-1's derivatives-natural-exp asks the learner to differentiate it.

  - id: natural-exponential-function
    name: The Natural Exponential Function
    # core: calculus-1 (derivatives-natural-exp, via a Wave-2 edge), hyperbolic
    # functions, and continuous-growth-model all build on e^x as a function.
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: graphs-of-exponential-functions
        weight: 0.7
        key: true
      - id: common-natural-logarithms
        weight: 0.6
        key: true
      - id: exponential-functions
        weight: 0.4
      - id: percent-growth-decay-factors
        weight: 0.3
      - id: inverse-functions
        weight: 0.0            # conceptual only: e^x and ln x form an inverse pair
    knowledge_points:
      - id: kp1
        name: The number e from repeated compounding
        key_prerequisites: [percent-growth-decay-factors]
        constraints: 'n in 1-4 so (1 + 1/n)^n is exact by hand; answers as fractions or decimals; state e ≈ 2.71828 whenever a numeric comparison needs it'
        try_first:
          problem: 'A balance of €10 grows by $20\%$, and then grows by another $20\%$. How many euros is the balance after both steps?'
          answer_contract: {"kind": "unit", "quantity": "euro", "unit": "€", "allow_omitted": true}
          answer: '14.4'
          reveal: 'Each step multiplies by $1.2$, so the balance is $10\cdot1.44=14.4$ euros, more than the $14$ euros that two separate $20\%$ gains would add. Growth in steps compounds, and splitting a rate into many steps leads to the number $e$.'
        exemplars:
          - problem: 'A bank pays a nominal $100\%$ interest per year. If it pays $50\%$ twice a year instead of $100\%$ once, by what factor does a balance grow over the year?'
            answer: '9/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each half-year multiplies the balance by $1+\frac12=\frac32$. Over two half-years the factor is $\left(\frac32\right)^2=\frac94=2.25$, which beats the factor $2$ from one payment.'
          - problem: 'A bank pays a nominal $100\%$ interest per year in three equal instalments, each adding $\frac13$ of the current balance. By what factor does a balance grow over the year?'
            answer: '64/27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each instalment multiplies the balance by $1+\frac13=\frac43$. After three instalments the factor is $\left(\frac43\right)^3=\frac{64}{27}\approx2.37$.'
          - problem: '€256 earns a nominal $100\%$ per year, with interest added every quarter. The balances after the four quarters are €320, €400, €500 and €625. By what factor has the balance grown over the year?'
            answer: '625/256'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The growth factor is the final balance divided by the starting balance, $625/256\approx2.44$. Each quarter multiplies by $\frac54$, so this equals $\left(\frac54\right)^4$.'
          - problem: 'A bank pays a nominal $100\%$ per year. Compare paying it in $3$ equal instalments, factor $\left(\frac43\right)^3$, with paying it in $4$ equal instalments, factor $\left(\frac54\right)^4$. Does a balance end higher with $3$ instalments or with $4$?'
            answer: '4'
            answer_contract: {"kind": "label", "options": [["4", "four", "four instalments", "4 instalments", "with 4"], ["3", "three", "three instalments", "3 instalments", "with 3"]]}
            solution_sketch: 'Compute both factors: $\left(\frac43\right)^3=\frac{64}{27}\approx2.370$ and $\left(\frac54\right)^4=\frac{625}{256}\approx2.441$. The factor for $4$ instalments is larger, so $4$ instalments give the higher balance.'
          - problem: 'A bank pays $100\%$ interest once a year, so €1 becomes €2. If it pays $50\%$ twice a year instead, how many more euros is €1 worth after the year than the €2 from one payment?'
            answer: '0.25'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "€", "allow_omitted": true}
            solution_sketch: 'Twice a year gives the factor $\frac94=2.25$, so €1 becomes €2.25 instead of €2. The difference is €0.25.'
          - problem: 'The factors $\left(1+\frac1n\right)^n$ get closer and closer to the constant $e\approx2.71828$ as $n$ grows. What whole number is $e$ closest to?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $e\approx2.71828$ lies between $2$ and $3$. It is $0.28$ below $3$ and $0.72$ above $2$, so $3$ is the closest whole number.'
      - id: kp2
        name: Evaluating e^x
        key_prerequisites: [exponential-functions, common-natural-logarithms]
        constraints: 'exact values only at x = 0 and 1; otherwise give e ≈ 2.71828 and ask for a stated rounding; exponents of 0 to 3, a ratio of two values, or a model such as 100e^t'
        exemplars:
          - problem: 'Using $e\approx2.71828$, evaluate $e^2$ to two decimal places.'
            answer: '7.39'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The power means two factors of $e$, so $e^2\approx2.71828\cdot2.71828=7.3890\ldots$. To two decimal places this is $7.39$.'
          - problem: 'For $f(x)=e^x$, find $f(0)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Any nonzero base to the power $0$ equals $1$, and $e$ is no exception. So $f(0)=1$.'
          - problem: 'Since $2<e<3$, the value $e^3$ lies between $2^3=8$ and $3^3=27$. Using $e\approx2.71828$, evaluate $e^3$ to one decimal place.'
            answer: '20.1'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Multiply three factors: $2.71828^3\approx20.09$. To one decimal place this is $20.1$, between $8$ and $27$ as expected.'
          - problem: 'The number of cells in a culture is $N(t)=100e^{t}$ after $t$ hours. Using $e\approx2.71828$, how many cells are there after $3$ hours, to the nearest whole number?'
            answer: '2009'
            answer_contract: {"kind": "approx", "decimals": 0}
            solution_sketch: 'At $t=3$ the count is $100e^3\approx100\cdot20.0855=2008.55$. To the nearest whole number this is $2009$ cells.'
          - problem: 'The number of cells in a culture is $N(t)=100e^{t}$ after $t$ hours. How many times as many cells are there at $t=3$ as at $t=2$, to two decimal places?'
            answer: '2.72'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'The ratio is $\frac{100e^3}{100e^2}=e$, because dividing powers of $e$ subtracts exponents. Hence the culture grows by the factor $e\approx2.72$ every hour.'
          - problem: 'Using $e\approx2.71828$, what is the value of $e^2$ to one decimal place?'
            answer: '7.4'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The square $e^2$ is $e$ times itself, not $2e$. The product $2.71828\cdot2.71828\approx7.389$ rounds to $7.4$.'
          - problem: 'The point $(1,c)$ lies on the graph of $y=e^x$. Using $e\approx2.71828$, give $c$ to two decimal places.'
            answer: '2.72'
            answer_contract: {"kind": "approx", "decimals": 2}
            solution_sketch: 'At input $1$ the output is $c=e^1=e\approx2.71828$. The third decimal is $8$, so rounding gives $2.72$.'
      - id: kp3
        name: The graph of y = e^x and the inverse pair with ln
        key_prerequisites: [graphs-of-exponential-functions, common-natural-logarithms]
        constraints: 'no shifts or reflections: intercept (0, 1), asymptote y = 0, increasing; inverse-pair evaluations have whole-number or single-digit results, or the answer ln of a small integer'
        exemplars:
          - problem: 'Evaluate $\ln(e^7)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The natural logarithm undoes the exponential, so $\ln(e^7)$ asks which power of $e$ gives $e^7$. The answer is $7$.'
          - problem: 'Find the $y$-intercept of the graph of $y=e^x$.'
            answer: '(0, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The intercept is where $x=0$. Since $e^0=1$, the graph crosses the $y$-axis at $(0,1)$.'
          - problem: 'Does the graph of $y=e^x$ rise or fall as $x$ increases?'
            answer: 'rises'
            answer_contract: {"kind": "label", "options": [["rises", "rise", "it rises", "rising", "increasing", "goes up"], ["falls", "fall", "it falls", "falling", "decreasing", "goes down"]]}
            solution_sketch: 'The base $e\approx2.718$ is greater than $1$, so each step to the right multiplies the height by $e$. The graph therefore rises over the whole real line.'
          - problem: 'As $x$ becomes very negative, the graph of $y=e^x$ gets closer and closer to a horizontal line. What is the equation of that line?'
            answer: 'y = 0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For very negative $x$, $e^x=1/e^{|x|}$ becomes tiny but stays positive. The graph approaches the line $y=0$, the $x$-axis.'
          - problem: 'The value of an investment is $e^{t}$ thousand euros after $t$ years. After how many years is it worth $3$ thousand euros?'
            answer: 't = ln(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $e^t=3$ to find when the value reaches $3$ thousand. The natural logarithm undoes the exponential, so $t=\ln3\approx1.1$ years.'
          - problem: 'What is the value of $e^{\ln4}$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The exponential and the natural logarithm undo each other: $e^{\ln4}=4$, while $\ln4\approx1.39$ is a different number.'
          - problem: 'A culture contains $e^{t}$ thousand cells after $t$ hours. After how many hours does it contain $e^{4}$ thousand cells?'
            answer: 't = 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $e^t=e^4$. Equal powers of $e$ have equal exponents, so $t=4$ hours; taking $\ln$ of both sides gives the same result.'
          - problem: 'Does the graph of $y=e^x$ ever touch the $x$-axis?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "never", "it never touches", "it does not", "does not"], ["yes", "it does", "it touches", "touches"]]}
            solution_sketch: 'Every power of $e$ is positive, so $e^x$ is never $0$. The graph comes as close to the $x$-axis as you like but never touches it.'
          - problem: 'Evaluate $\ln(e^5)+e^{\ln3}$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The logarithm undoes the exponential, so $\ln(e^5)=5$. The exponential undoes the logarithm, so $e^{\ln3}=3$, and the sum is $5+3=8$.'
    diagnostic_exemplar:
      problem: 'Using $e \approx 2.71828$, evaluate $e^{\ln 5} + e^{2}$ to two decimal places.'
      answer: "12.39"
      solution_sketch: '$e^{\ln 5} = 5$ since $\ln$ undoes $e^x$, and $e^2 \approx 7.389$.'
    anki_seeds:
      - front: "e is the limit of..."
        back: "(1 + 1/n)^n as n → ∞ (≈ 2.71828)."
        type: basic
      - front: "The inverse of f(x) = e^x is..."
        back: "ln x."
        type: basic
      - front: "y-intercept and horizontal asymptote of y = e^x?"
        back: "(0, 1) and y = 0."
        type: basic

  - id: continuous-growth-model
    name: Continuous Growth and Compounding
    # core: differential-equations' core natural-growth-decay-models assumes the
    # P_0·e^{kt} model this topic teaches (Wave-2 lane C-D may wire that edge).
    core: true
    difficulty: 0.75
    drill: false
    # Balances in EUR, exact answers like "500e^{0.06t}" or "20·ln 2 years" — the
    # tutor grades these; SymPy cannot parse currency or unit-bearing answers.
    answer_kind: multi-step
    expected_time_secs: 210
    prerequisites:
      - id: natural-exponential-function
        weight: 0.8
        key: true
      - id: compound-interest
        weight: 0.5
        key: true
      - id: exponential-growth-decay
        weight: 0.4
      - id: common-natural-logarithms
        weight: 0.4
      - id: percent-growth-decay-factors
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: From n compoundings per year to A = Pe^rt
        key_prerequisites: [compound-interest, natural-exponential-function]
        constraints: 'principals in EUR; rates 3%-12%; compare annual, semiannual or quarterly compounding with continuous; supply e-power approximations (e.g. e^{0.1} ≈ 1.10517) whenever cents are requested'
        try_first:
          problem: '€1000 earns $10\%$ a year. Compounded annually, the balance after a year is €1100. If instead $5\%$ is added twice a year, how many euros is the balance after a year?'
          answer_contract: {"kind": "unit", "quantity": "euro", "unit": "€", "allow_omitted": true}
          answer: '1102.5'
          reveal: 'The balance after the first half-year is €1050, and $5\%$ of that is €52.50, giving €1102.50, a little more than €1100. The more often interest is added, the more the balance grows, up to a limit that is continuous compounding.'
        exemplars:
          - problem: '€650 is invested at $5\%$ a year, compounded continuously. Using $e^{0.15}\approx1.16183$, find the balance after $3$ years to the nearest cent.'
            answer: '755.19'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "€", "allow_omitted": true}
            solution_sketch: 'The balance is $650e^{0.05\cdot3}=650e^{0.15}$. Then $650\cdot1.16183=755.1895$, which rounds to €755.19.'
          - problem: '€1000 is invested at $10\%$ a year. Compounded annually, the balance after one year is €1100. Compounded quarterly, with $2.5\%$ added each quarter, what is the balance? Round to the nearest cent.'
            answer: '1103.81'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "€", "allow_omitted": true}
            solution_sketch: 'Each quarter multiplies the balance by $1.025$, so after four quarters the balance is $1000\cdot1.025^4=1103.81$ euros. This is a little above €1100.'
          - problem: '€1000 is invested at $10\%$ a year, compounded continuously, so the balance after one year is $1000e^{0.1}$. Using $e^{0.1}\approx1.10517$, find the balance to the nearest cent.'
            answer: '1105.17'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "€", "allow_omitted": true}
            solution_sketch: 'Continuous compounding is the limit of adding interest more and more often: €1100, €1102.50, €1103.81 and onward. The value is $1000\cdot1.10517=1105.17$ euros.'
          - problem: 'Write a formula for the balance after $t$ years of €500 invested at $6\%$ a year, compounded continuously.'
            answer: 'A = 500*e^(0.06*t)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Continuous compounding uses $A=Pe^{rt}$ with $P=500$ and $r=0.06$. So the balance is $A=500e^{0.06t}$.'
          - problem: 'The balance of €1000 earning $8\%$ a year, compounded $n$ times a year, is $A=1000\left(1+\frac{0.08}{n}\right)^{nt}$. Write the balance after $t$ years when the interest is compounded continuously.'
            answer: 'A = 1000*e^(0.08*t)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'As $n$ grows without bound, $\left(1+\frac{0.08}{n}\right)^{n}$ approaches $e^{0.08}$. So the balance after $t$ years is $A=1000e^{0.08t}$.'
          - problem: 'An investment compounded continuously at $6\%$ a year is worth €2699.72 after $5$ years. Using $e^{0.3}\approx1.34986$, how many euros were invested at the start?'
            answer: '2000'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "€", "allow_omitted": true}
            solution_sketch: 'After $5$ years the balance is $Pe^{0.3}$ with $e^{0.3}\approx1.34986$. The start is found by dividing: $2699.72/1.34986=2000$ euros.'
          - problem: '€2000 is invested at $4\%$ a year, compounded continuously. Using $e^{0.2}\approx1.22140$, find the balance after $5$ years to the nearest cent.'
            answer: '2442.8'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "€", "allow_omitted": true}
            solution_sketch: 'The exponent is $0.04\cdot5=0.2$, so the balance is $2000e^{0.2}$. Then $2000\cdot1.22140=2442.80$ euros.'
      - id: kp2
        name: Evaluating continuous growth and decay models
        key_prerequisites: [natural-exponential-function, exponential-growth-decay]
        constraints: 'choose rt so the needed e-power is supplied (e.g. e^2 ≈ 7.389, e^{-1} ≈ 0.3679); decay via negative exponents; state the rounding; ratios of two values at different times are allowed'
        exemplars:
          - problem: 'A culture grows as $N(t)=200e^{0.5t}$, where $t$ is in hours. Using $e^2\approx7.389$, find the number of cells after $4$ hours, to the nearest whole number.'
            answer: '1478'
            answer_contract: {"kind": "approx", "decimals": 0}
            solution_sketch: 'At $t=4$ the exponent is $0.5\cdot4=2$. So $N(4)=200e^2\approx200\cdot7.389=1477.8$, which rounds to $1478$.'
          - problem: 'A sample decays as $m(t)=80e^{-0.25t}$ grams, where $t$ is in days. Using $e^{-1}\approx0.3679$, find the mass after $4$ days to one decimal place.'
            answer: '29.4'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'At $t=4$ the exponent is $-0.25\cdot4=-1$. So $m(4)=80e^{-1}\approx80\cdot0.3679=29.432$, which is $29.4$ grams.'
          - problem: 'A population is modelled by $P(t)=Pe^{rt}$, where $P$ is the initial amount. What is the population at $t=0$?'
            answer: 'P'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $t=0$ the exponent is $r\cdot0=0$ and $e^0=1$. Multiplying the initial amount by $1$ leaves $P$.'
          - problem: 'The town of Aldor has $12000$ people and its population grows as $P(t)=12000e^{0.03t}$, with $t$ in years. Using $e^{0.3}\approx1.34986$, find the population after $10$ years, to the nearest whole number.'
            answer: '16198'
            answer_contract: {"kind": "approx", "decimals": 0}
            solution_sketch: 'At $t=10$ the exponent is $0.03\cdot10=0.3$. So $P(10)=12000e^{0.3}\approx12000\cdot1.34986=16198.32$, which rounds to $16198$.'
          - problem: 'A sample has mass $m(t)=45e^{-0.4t}$ grams, where $t$ is in days. Using $e^{-2}\approx0.1353$, find the mass after $5$ days to one decimal place.'
            answer: '6.1'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}
            solution_sketch: 'At $t=5$ the exponent is $-0.4\cdot5=-2$. So $m(5)=45e^{-2}\approx45\cdot0.1353=6.0885$, which is $6.1$ grams.'
          - problem: 'A culture grows as $N(t)=200e^{0.5t}$, where $t$ is in hours. Using $e^2\approx7.389$, how many times as many cells are there at $t=4$ as at $t=0$, to one decimal place?'
            answer: '7.4'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The ratio is $\frac{200e^{2}}{200e^{0}}=e^2$, because the starting amount cancels. With $e^2\approx7.389$ this is $7.4$.'
          - problem: 'A continuous growth model $N(t)=100e^{0.5t}$ has the point $(2,c)$ on its graph. Using $e\approx2.71828$, give $c$ to the nearest whole number.'
            answer: '272'
            answer_contract: {"kind": "approx", "decimals": 0}
            solution_sketch: 'The exponent at $t=2$ is $0.5\cdot2=1$. So $c=100e\approx100\cdot2.71828=271.828$, which rounds to $272$.'
      - id: kp3
        name: Doubling time and half-life via ln
        key_prerequisites: [common-natural-logarithms, natural-exponential-function]
        constraints: 'solve e^{rt} = c by rt = ln c (ln undoes e); exact answers in ln form unless a rounding is stated, then supply ln 2 ≈ 0.693; money problems may ask for the time to reach a target amount'
        exemplars:
          - problem: 'A population grows as $P(t)=P_0e^{0.05t}$, where $t$ is in years. Find its doubling time exactly.'
            answer: 't = 20*ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Doubling means $e^{0.05t}=2$. Taking natural logs gives $0.05t=\ln2$, and dividing by $0.05$ gives $t=20\ln2$ years.'
          - problem: 'Money grows continuously at $7\%$ per year. Using $\ln2\approx0.693$, how many years does it take to double, to one decimal place?'
            answer: '9.9'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Doubling means $e^{0.07t}=2$, so $0.07t=\ln2$. Dividing by the rate gives $t=0.693/0.07=9.9$ years.'
          - problem: 'A substance decays as $m(t)=m_0e^{-0.1t}$, where $t$ is in years. Find its half-life exactly.'
            answer: 't = 10*ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Half the mass remains when $e^{-0.1t}=\frac12$. Taking logs gives $-0.1t=-\ln2$, hence $t=10\ln2$ years.'
          - problem: 'A culture grows as $N(t)=N_0e^{0.2t}$, where $t$ is in hours. Find exactly how many hours it takes the culture to triple.'
            answer: 't = 5*ln(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Tripling means $e^{0.2t}=3$. Taking natural logs gives $0.2t=\ln3$, and dividing by $0.2$ gives $t=5\ln3$ hours.'
          - problem: 'What is the doubling time of $P(t)=P_0e^{0.04t}$?'
            answer: 't = 25*ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Doubling gives $0.04t=\ln2$, and $t$ is multiplied by $0.04$, so divide by it. Then $t=\ln2/0.04=25\ln2$ years.'
          - problem: 'A balance grows continuously at $4\%$ a year as $A(t)=2000e^{0.04t}$ euros. Find exactly how many years it takes to reach €5000.'
            answer: 't = 25*ln(5/2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $2000e^{0.04t}=5000$ and divide by $2000$ to get $e^{0.04t}=\frac52$. Taking logs gives $0.04t=\ln\frac52$, so $t=25\ln\frac52$ years.'
          - problem: 'A sample decays as $A(t)=A_0e^{-0.08t}$, where $t$ is in years. Using $\ln2\approx0.693$, find its half-life in years to one decimal place.'
            answer: '8.7'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'Half remains when $e^{-0.08t}=\frac12$, so $-0.08t=-\ln2$. Then $t=0.693/0.08=8.66$, which rounds to $8.7$ years.'
