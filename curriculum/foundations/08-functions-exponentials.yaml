      problem: 'Evaluate $\log_2(12) + \log_2(8) - \log_2(3)$.'
      answer: "5"
      solution_sketch: 'Combine into one log: $\log_2 \frac{12 \times 8}{3} = \log_2 32$.'
    anki_seeds:
