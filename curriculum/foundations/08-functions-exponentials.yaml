    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: log-product-quotient-rules
        weight: 0.7
        key: true
      - id: log-power-rule
        weight: 0.7
        key: true
      - id: logarithm-basics
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Expand with several properties
        key_prerequisites: [log-product-quotient-rules, log-power-rule]
        constraints: "products, quotients and powers of two or three variables; integer exponents 2-3; expand fully into single-variable logarithms"
        exemplars:
          - problem: 'Expand $\log_b\left(\frac{x^2 \cdot y}{z}\right)$.'
            answer: "2·log_b(x) + log_b(y) - log_b(z)"
          - problem: 'Expand $\log_b(x^3 y^2)$.'
            answer: "3·log_b(x) + 2·log_b(y)"
      - id: kp2
        name: Condense to a single logarithm
        key_prerequisites: [log-product-quotient-rules, log-power-rule]
        constraints: "two or three logarithm terms sharing one base; integer coefficients 2-3; the answer is a single logarithm"
        exemplars:
          - problem: 'Write $2 \cdot \log_3(x) + \log_3(5)$ as a single logarithm.'
            answer: "log_3(5x^2)"
          - problem: 'Write $3 \cdot \log_b(x) - 2 \cdot \log_b(y)$ as a single logarithm.'
            answer: "log_b(x^3/y^2)"
      - id: kp3
        name: Evaluate from given log values
        key_prerequisites: [log-product-quotient-rules, log-power-rule]
        constraints: "express targets in terms of m = log_b 2 and n = log_b 3 (or similar)"
        exemplars:
          - problem: 'If $\log_b(2) = m$ and $\log_b(3) = n$, express $\log_b(12)$ in terms of $m$ and $n$.'
            answer: "2m + n"
            solution_sketch: '$12 = 2^2 \cdot 3$.'
          - problem: 'If $\log_b(2) = m$ and $\log_b(3) = n$, express $\log_b(9/2)$.'
            answer: "2n - m"
    diagnostic_exemplar:
      problem: 'If $\log_b(2) = m$ and $\log_b(3) = n$, express $\log_b\left(\frac{8}{3}\right)$ in terms of $m$ and $n$.'
      answer: "3m - n"
      solution_sketch: '$\log_b 8 = 3\log_b 2$, and the quotient subtracts: $3m - n$.'
    anki_seeds:
      - front: "Condensed form of 2·log_b(x) + log_b(y)?"
        back: "log_b(x²y)"
        type: basic

  - id: change-of-base-formula
    name: The Change of Base Formula
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: logarithm-properties
        weight: 0.6
        key: true
      - id: common-natural-logarithms
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Rewrite with a new base
        key_prerequisites: [logarithm-properties, common-natural-logarithms]
        constraints: "the problem names the new base (common or natural); the answer is a quotient of two logarithms, left unevaluated"
        exemplars:
          - problem: 'Rewrite $\log_5(12)$ using common logarithms.'
            answer: "log(12)/log(5)"
          - problem: 'Rewrite $\log_3(7)$ using natural logarithms.'
            answer: "ln(7)/ln(3)"
      - id: kp2
        name: Exact evaluation via change of base
        key_prerequisites: [logarithm-properties]
        constraints: "both base and argument are powers of the same small integer"
        exemplars:
          - problem: 'Evaluate $\log_4(8)$ exactly.'
            answer: "3/2"
            solution_sketch: '$\frac{\ln 8}{\ln 4} = \frac{3\ln 2}{2\ln 2} = \frac{3}{2}$.'
          - problem: 'Evaluate $\log_9(27)$ exactly.'
            answer: "3/2"
          - problem: 'Evaluate $\log_8(16)$ exactly.'
            answer: "4/3"
      - id: kp3
        name: Recognize change-of-base quotients
        key_prerequisites: [common-natural-logarithms]
        constraints: "numerator and denominator are logarithms of powers of one small integer; the answer is an exact integer or simple fraction"
        exemplars:
          - problem: 'Simplify $\frac{\log(32)}{\log(2)}$ exactly.'
            answer: "5"
            solution_sketch: 'It equals $\log_2(32) = 5$.'
          - problem: 'Simplify $\frac{\ln(81)}{\ln(3)}$ exactly.'
            answer: "4"
    diagnostic_exemplar:
      problem: 'Evaluate $\log_4(32)$ exactly.'
      answer: "5/2"
      solution_sketch: 'Change to base $2$: $\frac{\log_2 32}{\log_2 4} = \frac{5}{2}$.'
    anki_seeds:
      - front: "Change of base: log_b(a) = ?"
        back: "log(a)/log(b), using any convenient base."
        type: basic

  - id: logarithmic-equations
    name: Solving Logarithmic Equations
    core: false                # terminal solve genre; logarithm-properties stays core
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: logarithm-properties
        weight: 0.6
        key: true
      - id: logarithm-basics
        weight: 0.7
        key: true
      - id: exponential-equations
        weight: 0.4
      - id: two-step-equations
        weight: 0.3
      - id: quadratic-equations-factoring
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Solve by converting to exponential form
        key_prerequisites: [logarithm-basics]
        constraints: "a single logarithm, already isolated; bases 2, 3, 4, 5; integer solutions"
        exemplars:
          - problem: 'Solve $\log_2(x) = 5$.'
            answer: "x = 32"
            answer_contract: {kind: exact}
            solution_sketch: '$x = 2^5 = 32$.'
          - problem: 'Solve $\log_3(x) = 4$.'
            answer: "x = 81"
            answer_contract: {kind: exact}
      - id: kp2
        name: Apply a property, then solve
        key_prerequisites: [logarithm-properties]
        constraints: "two logarithms of the same base combined by the product or quotient rule; integer solutions, never at an excluded value"
        exemplars:
          - problem: 'Solve $\log_2(x) + \log_2(3) = \log_2(12)$.'
            answer: "x = 4"
            answer_contract: {kind: exact}
            solution_sketch: '$\log_2(3x) = \log_2(12)$; $3x = 12$.'
          - problem: 'Solve $\log_5(x) - \log_5(2) = 1$.'
            answer: "x = 10"
            answer_contract: {kind: exact}
      - id: kp3
        name: Equations leading to a quadratic (check for extraneous roots)
        key_prerequisites: [logarithm-properties, quadratic-equations-factoring]
        constraints: "the combined argument is a quadratic with two roots, one of which makes a logarithm undefined and must be rejected"
        exemplars:
          - problem: 'Solve $\log_3(x) + \log_3(x - 2) = 1$.'
            answer: "x = 3"
            answer_contract: {kind: exact}
            solution_sketch: '$x(x-2) = 3$; $x^2 - 2x - 3 = 0$; $(x-3)(x+1) = 0$; reject $x = -1$.'
          - problem: 'Solve $\log_2(x) + \log_2(x + 2) = 3$.'
            answer: "x = 2"
            answer_contract: {kind: exact}
    diagnostic_exemplar:
      problem: 'Solve $\log_2(x) + \log_2(x - 6) = 4$.'
      answer: "x = 8"
      solution_sketch: 'The product rule gives $x(x - 6) = 2^4 = 16$, so $(x - 8)(x + 2) = 0$; $x = -2$ is extraneous because $\log_2$ needs a positive argument.'
    anki_seeds:
      - front: "To solve log_b(x) = c, rewrite it as..."
        back: "x = b^c (exponential form)"
        type: basic
      - front: "After solving a logarithmic equation, always..."
        back: "check each candidate in the original equation: every log argument must be positive (reject extraneous roots)."
        type: basic

  - id: exponential-equations-with-logarithms
    name: Exponential Equations via Logarithms
    core: false                # terminal solve genre; log machinery stays core
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: exponential-equations
        weight: 0.6
        key: true
      - id: logarithm-properties
        weight: 0.5
        key: true
      - id: common-natural-logarithms
        weight: 0.4
      - id: change-of-base-formula
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Exact answers as logarithms
        key_prerequisites: [exponential-equations]
        constraints: "the right side is never an integer power of the base"
        exemplars:
          - problem: 'Solve $2^x = 10$. Give the exact answer.'
            answer: "x = log_2(10)"
          - problem: 'Solve $5^x = 30$. Give the exact answer.'
            answer: "x = log_5(30)"
      - id: kp2
        name: Isolate the exponential first
        key_prerequisites: [exponential-equations]
        constraints: "an integer coefficient multiplies the exponential and is divided out first; what remains is an exact power of the base or an exact logarithm"
        exemplars:
          - problem: 'Solve $3 \cdot 2^x = 96$.'
            answer: "x = 5"
            solution_sketch: '$2^x = 32 = 2^5$.'
          - problem: 'Solve $2 \cdot 5^x = 30$. Give the exact answer.'
            answer: "x = log_5(15)"
      - id: kp3
        name: Solve with natural or common logs
        key_prerequisites: [common-natural-logarithms, logarithm-properties]
        constraints: "the problem states which logarithm to use (natural or common); answers are exact quotients of logarithms, or a single ln or log"
        exemplars:
          - problem: 'Solve $3^x = 20$. Express the answer with natural logs.'
            answer: "x = ln(20)/ln(3)"
            solution_sketch: 'Take $\ln$ of both sides: $x \ln 3 = \ln 20$.'
          - problem: 'Solve $e^x = 7$.'
            answer: "x = ln(7)"
          - problem: 'Solve $10^x = 45$. Give the exact answer.'
            answer: "x = log(45)"
    diagnostic_exemplar:
      problem: 'Solve $4 \cdot 3^x = 100$. Express the answer with natural logarithms.'
      answer: "x = ln(25)/ln(3)"
      solution_sketch: 'Isolate the power first: $3^x = 25$, then take $\ln$ of both sides.'
    anki_seeds:
      - front: "To solve b^x = c when c is not a power of b..."
        back: "take a log of both sides: x = log_b(c) = ln(c)/ln(b)."
        type: basic

  # ---- Phase C (gap C-2): the natural exponential --------------------------------
  # Before these topics, e appeared only inside ln facts (common-natural-logarithms)
  # and one solve exemplar; no topic taught e or e^x as a function, yet
  # calculus-1's derivatives-natural-exp asks the learner to differentiate it.

  - id: natural-exponential-function
    name: The Natural Exponential Function
    # core: calculus-1 (derivatives-natural-exp, via a Wave-2 edge), hyperbolic
    # functions, and continuous-growth-model all build on e^x as a function.
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: graphs-of-exponential-functions
        weight: 0.7
        key: true
      - id: common-natural-logarithms
        weight: 0.6
        key: true
      - id: exponential-functions
        weight: 0.4
      - id: percent-growth-decay-factors
        weight: 0.3
      - id: inverse-functions
        weight: 0.0            # conceptual only: e^x and ln x form an inverse pair
    knowledge_points:
      - id: kp1
        name: The number e from repeated compounding
        key_prerequisites: [percent-growth-decay-factors]
        constraints: "n in 1-4 so (1 + 1/n)^n is exact by hand; answers as fractions or decimals; state e ≈ 2.71828 whenever a numeric comparison needs it"
        exemplars:
          - problem: 'Growing by $100\%$ in one step multiplies a quantity by $2$. Split the same growth into two steps of $50\%$ each: compute the overall factor $\left(1 + \frac{1}{2}\right)^2$.'
            answer: "9/4"
            solution_sketch: '$\left(\frac{3}{2}\right)^2 = \frac{9}{4} = 2.25 > 2$: splitting the growth into more steps gives a larger factor.'
          - problem: 'Compute $\left(1 + \frac{1}{3}\right)^3$ as a fraction.'
            answer: "64/27"
            solution_sketch: '$\left(\frac{4}{3}\right)^3 = \frac{64}{27} \approx 2.37$ — creeping up toward $e \approx 2.718$.'
          - problem: 'As $n$ grows, $\left(1 + \frac{1}{n}\right)^n$ approaches the constant $e \approx 2.718$. Between which two consecutive integers does $e$ lie? Give the smaller one.'
            answer: "2"
      - id: kp2
        name: Evaluating e^x
        key_prerequisites: [exponential-functions, common-natural-logarithms]
        constraints: "exact values only at x = 0 and 1; otherwise give e ≈ 2.71828 and ask for a stated rounding; keep exponents 0-3"
        exemplars:
          - problem: 'For $f(x) = e^x$, find $f(0)$.'
            answer: "1"
            solution_sketch: 'Any base to the power $0$ is $1$; $e$ is no exception.'
          - problem: 'Using $e \approx 2.71828$, evaluate $e^2$ to two decimal places.'
            answer: "7.39"
            solution_sketch: '$2.71828^2 = 7.3890...$, which rounds to $7.39$.'
          - problem: 'Since $2 < e < 3$, the value $e^3$ lies between $2^3 = 8$ and $3^3 = 27$. Using $e \approx 2.71828$, evaluate $e^3$ to one decimal place.'
            answer: "20.1"
      - id: kp3
        visuals: [{"kind":"curve","x_min":"-3","x_max":"3","y_min":"0","y_max":"9","x_tick":"1","y_tick":"1","curve":{"family":"natural_exponential","a":"1","rate":"1","h":"0","k":"0"},"key_points":[{"x":"0","y":"1","label":"exact y-intercept"}],"asymptotes":[{"axis":"horizontal","at":"0"}],"caption":"Reference example: y = e^x uses the exact named constant e, passes exactly through (0, 1), increases, and approaches y = 0 to the left."}]
        name: The graph of y = e^x and the inverse pair with ln
        key_prerequisites: [graphs-of-exponential-functions, common-natural-logarithms]
        constraints: "no shifts or reflections: intercept (0, 1), asymptote y = 0, increasing; inverse-pair evaluations always have integer or single-digit results"
        exemplars:
          - problem: 'Find the $y$-intercept of $y = e^x$.'
            answer: "(0, 1)"
          - problem: 'Is the graph of $y = e^x$ increasing or decreasing?'
            answer: "increasing"
            solution_sketch: 'The base $e \approx 2.718$ exceeds $1$, so $e^x$ grows; its graph sits between $y = 2^x$ and $y = 3^x$.'
          - problem: 'The functions $e^x$ and $\ln x$ undo each other. Evaluate $\ln(e^5)$ and $e^{\ln 3}$, and give the sum of the two values.'
            answer: "8"
            solution_sketch: '$\ln(e^5) = 5$ and $e^{\ln 3} = 3$; the sum is $8$.'
    diagnostic_exemplar:
      problem: 'Using $e \approx 2.71828$, evaluate $e^{\ln 5} + e^{2}$ to two decimal places.'
      answer: "12.39"
      solution_sketch: '$e^{\ln 5} = 5$ since $\ln$ undoes $e^x$, and $e^2 \approx 7.389$.'
    anki_seeds:
      - front: "e is the limit of..."
        back: "(1 + 1/n)^n as n → ∞ (≈ 2.71828)."
        type: basic
      - front: "The inverse of f(x) = e^x is..."
        back: "ln x."
        type: basic
      - front: "y-intercept and horizontal asymptote of y = e^x?"
        back: "(0, 1) and y = 0."
        type: basic

  - id: continuous-growth-model
    name: Continuous Growth and Compounding
    # core: differential-equations' core natural-growth-decay-models assumes the
    # P_0·e^{kt} model this topic teaches (Wave-2 lane C-D may wire that edge).
    core: true
    difficulty: 0.75
    drill: false
    # Balances in EUR, exact answers like "500e^{0.06t}" or "20·ln 2 years" — the
    # tutor grades these; SymPy cannot parse currency or unit-bearing answers.
    answer_kind: multi-step
    expected_time_secs: 210
    prerequisites:
      - id: natural-exponential-function
        weight: 0.8
        key: true
      - id: compound-interest
        weight: 0.5
        key: true
      - id: exponential-growth-decay
        weight: 0.4
      - id: common-natural-logarithms
        weight: 0.4
      - id: percent-growth-decay-factors
        weight: 0.3
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"curve","x_min":"0","x_max":"10","y_min":"0","y_max":"3000","x_tick":"1","y_tick":"500","curve":{"family":"natural_exponential","a":"1000","rate":"1/10","h":"0","k":"0"},"key_points":[{"x":"0","y":"1000","label":"initial principal"}],"asymptotes":[{"axis":"horizontal","at":"0"}],"caption":"Reference example: A(t) = 1000e^(0.1t), the continuous-compounding limit, starts exactly at A(0) = 1000 and grows continuously."}]
        name: From n compoundings per year to A = Pe^rt
        key_prerequisites: [compound-interest, natural-exponential-function]
        constraints: "principals in EUR; rates 3%-12%; compare annual or semiannual compounding with continuous; supply e-power approximations (e.g. e^{0.1} ≈ 1.10517) whenever cents are requested"
        exemplars:
          - problem: 'Invest €1000 at $10\%$ for one year. Compounded annually the balance is €1100; compounded semiannually it is $1000 \cdot 1.05^2$. Compute that balance.'
            answer: "€1102.50"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"€"}
            solution_sketch: '$1000 \cdot 1.1025 = 1102.50$ — compounding more often earns slightly more.'
          - problem: 'Invest €1000 at $10\%$ compounded continuously for one year: the balance is $1000e^{0.1}$, the limit of $1000\left(1 + \frac{0.1}{n}\right)^n$ as $n \to \infty$. Using $e^{0.1} \approx 1.10517$, give the balance to the nearest cent.'
            answer: "€1105.17"
            solution_sketch: 'Continuous compounding is the ceiling of the ladder €1100 (annually), €1102.50 (semiannually), ... — namely $Pe^{rt}$.'
          - problem: 'Write the balance formula for €500 invested at $6\%$ compounded continuously for $t$ years.'
            answer: "A = 500e^{0.06t}"
      - id: kp2
        visuals: [{"kind":"curve","x_min":"0","x_max":"8","y_min":"0","y_max":"100","x_tick":"1","y_tick":"20","curve":{"family":"natural_exponential","a":"80","rate":"-1/4","h":"0","k":"0"},"key_points":[{"x":"0","y":"80","label":"initial mass"}],"asymptotes":[{"axis":"horizontal","at":"0"}],"caption":"Reference example: m(t) = 80e^(-0.25t) starts exactly at m(0) = 80 and decays continuously toward zero."}]
        name: Evaluating continuous growth and decay models
        key_prerequisites: [natural-exponential-function, exponential-growth-decay]
        constraints: "choose rt so the needed e-power is supplied (e.g. e^2 ≈ 7.389, e^{-1} ≈ 0.3679); decay via negative exponents; state the rounding"
        exemplars:
          - problem: 'A culture grows as $N(t) = 200e^{0.5t}$ ($t$ in hours). Using $e^2 \approx 7.389$, find $N(4)$ to the nearest whole number.'
            answer: "1478"
            solution_sketch: '$N(4) = 200e^{2} \approx 200 \cdot 7.389 = 1477.8$.'
          - problem: 'A sample decays as $m(t) = 80e^{-0.25t}$ ($t$ in days). Using $e^{-1} \approx 0.3679$, find the mass after $4$ days, in grams, to one decimal place.'
            answer: "29.4 g"
            solution_sketch: '$m(4) = 80e^{-1} \approx 80 \cdot 0.3679 = 29.4$ g.'
          - problem: 'For the general model $P(t) = P_0 e^{rt}$, what is $P(0)$?'
            answer: "P_0"
            solution_sketch: '$e^0 = 1$, so the model starts at the initial value $P_0$.'
      - id: kp3
        visuals: [{"kind":"curve","x_min":"0","x_max":"15","y_min":"0","y_max":"3","x_tick":"3","y_tick":"1/2","curve":{"family":"natural_exponential","a":"1","rate":"1/20","h":"0","k":"0"},"key_points":[{"x":"0","y":"1","label":"initial factor"}],"asymptotes":[{"axis":"horizontal","at":"0"}],"caption":"Reference example: y = e^(0.05t) starts exactly at 1 and reaches 2 at the exact doubling time t = 20 ln 2."}]
        name: Doubling time and half-life via ln
        key_prerequisites: [common-natural-logarithms, natural-exponential-function]
        constraints: "solve e^{rt} = c by rt = ln c (ln undoes e); exact answers in ln form unless a rounding is stated, then supply ln 2 ≈ 0.693"
        exemplars:
          - problem: 'A population grows as $P(t) = P_0e^{0.05t}$. Solve $e^{0.05t} = 2$ to find the doubling time exactly.'
            answer: "t = ln(2)/0.05 = 20·ln 2"
            solution_sketch: 'Apply $\ln$ to both sides: $0.05t = \ln 2$, so $t = 20\ln 2 \approx 13.9$ years.'
          - problem: 'Money grows continuously at $7\%$ per year. Using $\ln 2 \approx 0.693$, find the doubling time in years, to one decimal place.'
            answer: "9.9 years"
            solution_sketch: '$t = \frac{\ln 2}{0.07} \approx \frac{0.693}{0.07} = 9.9$.'
          - problem: 'A substance decays as $m(t) = m_0e^{-0.1t}$ ($t$ in years). Find its half-life exactly.'
            answer: "t = ln(2)/0.1 = 10·ln 2"
            solution_sketch: '$e^{-0.1t} = \frac{1}{2}$ gives $-0.1t = \ln\frac{1}{2} = -\ln 2$, so $t = 10\ln 2 \approx 6.9$ years.'
    diagnostic_exemplar:
      problem: 'A substance decays as $m(t) = m_0 e^{-0.04t}$ with $t$ in years. Using $\ln 2 \approx 0.693$, find its half-life in years, to one decimal place.'
      answer_contract: {kind: approx, decimals: 1}
      answer: "17.3"
      solution_sketch: 'Set $e^{-0.04t} = \frac{1}{2}$; taking logs gives $t = \frac{\ln 2}{0.04}$.'
    anki_seeds:
      - front: "Continuously compounded balance formula?"
        back: "A = Pe^{rt}"
        type: basic
      - front: "As n → ∞, P·(1 + r/n)^{nt} → ?"
        back: "P·e^{rt}"
        type: basic
      - front: "Doubling time for continuous growth at rate r?"
        back: "t = ln 2 / r"
        type: basic
