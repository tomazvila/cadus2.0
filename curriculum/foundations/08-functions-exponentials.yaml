        name: Read f(a) from points on a graph
        key_prerequisites: [coordinate-plane]
        constraints: 'graphs described by listed lattice points; read f(a) for a marked input, a value from a situation graph, a difference or an average rate, or f(f(a))'
        try_first:
          problem: 'The points $(2,-1)$ and $(5,6)$ lie on the graph of $f$. What is $f(5)$?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'The point $(5,6)$ has input $5$ and output $6$, so $f(5)=6$. The input is the first coordinate, and the output is the second coordinate.'
        exemplars:
          - problem: 'The graph of $f$ passes through the points $(-3,7)$, $(1,-2)$ and $(5,4)$. Find $f(1)$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            visual: 0
            solution_sketch: 'The point with input $1$ is $(1,-2)$. Its second coordinate is the output, so $f(1)=-2$.'
          - problem: 'A temperature graph $T$ contains the points $(3,7)$ and $(6,1)$, where the first coordinate is the hour and the second is the temperature in degrees. What is the temperature at hour $6$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            visual: 1
            solution_sketch: 'The point with hour $6$ is $(6,1)$. Its temperature coordinate is $1$, so $T(6)=1$ degree.'
          - problem: 'The point $(0,-4)$ is marked on the graph of a function $f$. Find $f(0)$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $(0,-4)$ has input $0$ and output $-4$. So $f(0)=-4$.'
          - problem: 'The depth of a diver in metres after $m$ minutes is a function whose graph passes through $(2,12)$ and $(5,30)$. How deep is the diver after $5$ minutes?'
            answer: '30'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            visual: 2
            solution_sketch: 'The point with input $5$ is $(5,30)$. Its second coordinate is the depth, so the diver is $30$ metres deep.'
          - problem: 'The distance $D$ in kilometres of a cyclist from home is a function of the time $t$ in hours. She starts at home at $t=0$, and the graph passes through $(1,18)$, $(3,54)$ and $(4,72)$. What is her average speed during the first $3$ hours?'
            answer: '18'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            visual: 3
            solution_sketch: 'Read $D(3)=54$ from the point $(3,54)$. She starts at distance $0$, so the average speed is the quotient $\frac{54}{3}=18$ kilometres per hour.'
          - problem: 'The graph of $f$ passes through $(2,5)$ and $(4,9)$. Find $f(4)-f(2)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            visual: 4
            solution_sketch: 'The points give $f(4)=9$ and $f(2)=5$. The difference is $9-5=4$.'
          - problem: 'The graph of $f$ passes through $(1,3)$, $(2,5)$, $(3,1)$ and $(5,-1)$. Find $f(f(2))$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            visual: 5
            solution_sketch: 'The point $(2,5)$ gives $f(2)=5$. Then $f(f(2))=f(5)$, and the point $(5,-1)$ gives $f(5)=-1$.'
      - id: kp2
