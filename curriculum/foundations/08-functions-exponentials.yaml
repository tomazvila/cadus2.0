        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Inverse of a linear function
        key_prerequisites: [literal-equations]
        constraints: "swap x and y, then solve for y"
        exemplars:
          - problem: 'If $f(x) = 2x + 6$, find $f^{-1}(x)$.'
            answer: "(x - 6)/2"
            solution_sketch: '$x = 2y + 6$; $y = \frac{x-6}{2}$.'
          - problem: 'If $f(x) = x - 4$, find $f^{-1}(x)$.'
            answer: "x + 4"
            solution_sketch: '$x = y - 4$; $y = x + 4$.'
      - id: kp2
        name: Verify inverses by composition
        key_prerequisites: [literal-equations, function-composition]
        constraints: "linear rules; a verification composes f and g and must simplify to x"
        exemplars:
          - problem: 'If $f(x) = 3x - 9$, find $f^{-1}(x)$.'
            answer: "(x + 9)/3"
            solution_sketch: '$x = 3y - 9$; $y = \frac{x+9}{3}$.'
          - problem: 'If $f(x) = 2x$ and $g(x) = \frac{x}{2}$, find $f(g(x))$ to check they are inverses.'
            answer: "x"
      - id: kp3
        name: Inverses of functions with a division step
        key_prerequisites: [literal-equations]
        constraints: "rules with a division step, or linear rules whose inverse needs one; integer coefficients"
        exemplars:
          - problem: 'If $f(x) = \frac{x + 1}{2}$, find $f^{-1}(x)$.'
            answer: "2x - 1"
            solution_sketch: '$x = \frac{y+1}{2}$; $2x = y+1$; $y = 2x-1$.'
          - problem: 'If $f(x) = 5x + 2$, find $f^{-1}(x)$.'
            answer: "(x - 2)/5"
            solution_sketch: '$x = 5y + 2$; $y = \frac{x-2}{5}$.'
    diagnostic_exemplar:
      problem: 'If $f(x) = \frac{2x + 1}{3}$, find $f^{-1}(x)$.'
      answer: "(3x - 1)/2"
      solution_sketch: 'Solve $y = \frac{2x + 1}{3}$ for $x$: $3y = 2x + 1$, so $x = \frac{3y - 1}{2}$; then swap the letters.'
    anki_seeds:
      - front: "To find the inverse of a function, swap x and y and then..."
        back: "solve for y."
        type: basic

