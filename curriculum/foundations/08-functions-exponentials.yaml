oblem":"Find the common logarithm of $1000$. Give an exact integer.","answer":"3","answer_contract":{"kind":"exact"}},{"problem":"What is the value of $\\log(1000)$?","answer":"3","answer_contract":{"kind":"exact"}}]},{"id":"common-4","role":"reserved_assessment","variants":[{"problem":"An inverse base-ten table asks for the exponent paired with output $10000$. Give its common logarithm.","answer":"4"},{"problem":"Find the common logarithm of $10000$. Give an exact integer.","answer":"4","answer_contract":{"kind":"exact"}}]},{"id":"common-5","role":"practice_fresh","variants":[{"problem":"Find the common logarithm of $100000$. Give an exact integer.","answer":"5","answer_contract":{"kind":"exact"}}]},{"id":"common-6","role":"practice_fresh","variants":[{"problem":"Find the common logarithm of $1000000$. Give an exact integer.","answer":"6","answer_contract":{"kind":"exact"}}]},{"id":"ex-3","role":"practice_fresh","variants":[{"problem":"The pH of a solution is $-\\log[\\mathrm{H}^+]$, where $[\\mathrm{H}^+]$ is the concentration of hydrogen ions in mol/L. A cleaning fluid has $[\\mathrm{H}^+]=0.00001$ mol/L. What is its pH?","answer":"5","answer_contract":{"kind":"exact"}}]},{"id":"ex-4","role":"practice_fresh","variants":[{"problem":"The magnitude of an earthquake is $M=\\log A$, where $A$ is the amplitude of the ground motion in micrometres. An earthquake has amplitude $10000$ micrometres. What is its magnitude?","answer":"4","answer_contract":{"kind":"exact"}}]},{"id":"ex-5","role":"practice_fresh","variants":[{"problem":"The magnitude of an earthquake is $M=\\log A$, where $A$ is the amplitude of the ground motion. How many times larger is the amplitude of a magnitude $7$ earthquake than that of a magnitude $5$ earthquake?","answer":"100","answer_contract":{"kind":"exact"}}]},{"id":"ex-7","role":"practice_fresh","variants":[{"problem":"The sound level in decibels is $L=10\\log\\left(\\frac{I}{I_0}\\right)$, where $I_0$ is the quietest audible intensity. A jet engine has intensity $I=10^{12}\\,I_0$. What is its sound level in decibels?","answer":"120","answer_contract":{"kind":"exact"}}]}]}
        exemplars:
          - problem: 'Evaluate $\log(100)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A logarithm with no base written has base $10$. Since $100=10^2$, the exponent is $2$, so $\log(100)=2$.'
          - problem: 'Evaluate $\log(0.001)$.'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First write $0.001=\frac1{1000}=10^{-3}$. The common logarithm is the exponent, so we find $\log(0.001)=-3$.'
          - problem: 'The pH of a solution is $-\log[\mathrm{H}^+]$, where $[\mathrm{H}^+]$ is the concentration of hydrogen ions in mol/L. A cleaning fluid has $[\mathrm{H}^+]=0.00001$ mol/L. What is its pH?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $0.00001=10^{-5}$, we get $\log[\mathrm{H}^+]=-5$. The pH is the negative of this value, so it is $-(-5)=5$.'
          - problem: 'The magnitude of an earthquake is $M=\log A$, where $A$ is the amplitude of the ground motion in micrometres. An earthquake has amplitude $10000$ micrometres. What is its magnitude?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write $10000=10^4$. Then $M=\log(10^4)=4$, so the magnitude of this earthquake is $4$.'
          - problem: 'The magnitude of an earthquake is $M=\log A$, where $A$ is the amplitude of the ground motion. How many times larger is the amplitude of a magnitude $7$ earthquake than that of a magnitude $5$ earthquake?'
            answer: '100'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Magnitude $7$ means $A=10^7$ and magnitude $5$ means $A=10^5$. The ratio is $10^7\div10^5=10^2=100$, so the larger amplitude is $100$ times as large.'
          - problem: 'Evaluate $\log(0.0001)$.'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First write $0.0001=\frac1{10000}=10^{-4}$. The common logarithm is the exponent, so we find $\log(0.0001)=-4$.'
          - problem: 'The sound level in decibels is $L=10\log\left(\frac{I}{I_0}\right)$, where $I_0$ is the quietest audible intensity. A jet engine has intensity $I=10^{12}\,I_0$. What is its sound level in decibels?'
            answer: '120'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The ratio is $\frac{I}{I_0}=10^{12}$, so $\log(10^{12})=12$. Then $L=10\cdot12=120$ decibels for the jet engine.'
          - problem: 'What is the value of $\log(1000)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common logarithm is the exponent of $10$, not a quotient. Since $1000=10^3$, the value is $\log(1000)=3$.'
      - id: kp2
        name: Natural logarithms (base e)
        key_prerequisites: [evaluating-logarithms]
        constraints: "arguments 1, e, e^k or 1/e^k with k = 1-5; exact integer answers only, never a decimal approximation"
        finite_objective_domain: {"schema_version":1,"review_ref":"sha256:a23eb3f4580d6ca31f37d59d052fcfea533f068fb3b5ef1f69941ce89a769388","cases":[{"id":"natural-0","role":"taught_rehearsal","variants":[{"problem":"Evaluate $\\ln(1)$.","answer":"0","answer_contract":{"kind":"exact"}},{"problem":"Find the exact value of $\\ln(1)$.","answer":"0","answer_contract":{"kind":"exact"}},{"problem":"Find the exact value of $\\ln(e^{0})$.","answer":"0","answer_contract":{"kind":"exact"}},{"problem":"Find the value of $\\ln(1)$.","answer":"0","answer_contract":{"kind":"exact"}}]},{"id":"natural-1","role":"taught_rehearsal","variants":[{"problem":"Evaluate $\\ln(e)$.","answer":"1","answer_contract":{"kind":"exact"}},{"problem":"Find the exact value of $\\ln(e)$.","answer":"1","answer_contract":{"kind":"exact"}},{"problem":"Find the exact value of $\\ln(e^{1})$.","answer":"1","answer_contract":{"kind":"exact"}}]},{"id":"natural-2","role":"practice_fresh","variants":[{"problem":"Find the exact value of $\\ln(e^{2})$.","answer":"2","answer_contract":{"kind":"exact"}}]},{"id":"natural-3","role":"teach_only","variants":[{"problem":"Evaluate $\\ln(e^3)$.","answer":"3","answer_contract":{"kind":"exact"}},{"problem":"Find the exact value of $\\ln(e^{3})$.","answer":"3","answer_contract":{"kind":"exact"}}]},{"id":"natural-4","role":"reserved_assessment","variants":[{"problem":"Evaluate $\\ln(e^4)$.","answer":"4"},{"problem":"Find the exact value of $\\ln(e^{4})$.","answer":"4","answer_contract":{"kind":"exact"}}]},{"id":"natural-5","role":"reserved_assessment","variants":[{"problem":"The natural exponential maps $5$ to $e^5$. What output does its inverse $\\ln$ give for input $e^5$?","answer":"5"},{"problem":"Find the exact value of $\\ln(e^{5})$.","answer":"5","answer_contract":{"kind":"exact"}},{"problem":"Evaluate $\\ln\\left(e^5\\right)$.","answer":"5","answer_contract":{"kind":"exact"}}]},{"id":"ex-4","role":"practice_fresh","variants":[{"problem":"A bank balance grows continuously so that after $t$ years it is $e^t$ times the deposit. After how many years is the balance $e^7$ times the deposit?","answer":"7","answer_contract":{"kind":"exact"}}]},{"id":"ex-5","role":"practice_fresh","variants":[{"problem":"A drug decays in the body so that the fraction remaining after $t$ hours is $e^{-t}$. The fraction remaining is now $e^{-3}$. How many hours have passed?","answer":"3","answer_contract":{"kind":"exact"}}]},{"id":"ex-6","role":"practice_fresh","variants":[{"problem":"Evaluate $\\ln\\left(\\frac{1}{e^{2}}\\right)$.","answer":"-2","answer_contract":{"kind":"exact"}}]},{"id":"ex-8","role":"practice_fresh","variants":[{"problem":"Evaluate $\\ln\\left(\\frac{1}{e}\\right)$.","answer":"-1","answer_contract":{"kind":"exact"}}]}]}
        exemplars:
          - problem: 'Evaluate $\ln\left(e^5\right)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The natural logarithm has base $e$. The exponent of $e$ that gives $e^5$ is $5$, so $\ln\left(e^5\right)=5$.'
          - problem: 'Evaluate $\ln(1)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The natural logarithm has base $e$. Since $e^0=1$, the exponent is $0$, so $\ln(1)=0$.'
          - problem: 'Evaluate $\ln(e)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The natural logarithm has base $e$. Since $e^1=e$, the exponent is $1$, so $\ln(e)=1$.'
          - problem: 'A bank balance grows continuously so that after $t$ years it is $e^t$ times the deposit. After how many years is the balance $e^7$ times the deposit?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $e^t=e^7$, so $t=\ln\left(e^7\right)$. The natural logarithm undoes the power, so $t=7$ years.'
          - problem: 'A drug decays in the body so that the fraction remaining after $t$ hours is $e^{-t}$. The fraction remaining is now $e^{-3}$. How many hours have passed?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $e^{-t}=e^{-3}$, so $-t=\ln\left(e^{-3}\right)=-3$. Hence $t=3$ hours have passed since the dose.'
          - problem: 'Evaluate $\ln\left(\frac{1}{e^{2}}\right)$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A reciprocal is a negative exponent, so $\frac1{e^2}=e^{-2}$. Then the natural logarithm returns that exponent, $\ln\left(e^{-2}\right)=-2$.'
          - problem: 'Find the value of $\ln(1)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $\ln(1)$ is the exponent of $e$ that gives $1$. Since $e^0=1$, the correct value is $0$.'
          - problem: 'Evaluate $\ln\left(\frac{1}{e}\right)$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A reciprocal is a negative exponent, so $\frac1e=e^{-1}$. Then the natural logarithm returns that exponent, $\ln\left(e^{-1}\right)=-1$.'
      - id: kp3
        name: Estimating logs between integers
        key_prerequisites: [evaluating-logarithms, logarithm-basics]
        constraints: "argument strictly between two consecutive powers of the base; the problem asks for the two consecutive integers"
        exemplars:
          - problem: 'Between which two consecutive integers does $\log(500)$ lie?'
            answer: '2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $100<500<1000$, we have $10^2<500<10^3$. So $\log(500)$ lies between $2$ and $3$.'
          - problem: 'Between which two consecutive integers does $\log_2(20)$ lie?'
            answer: '4, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $16<20<32$, we have $2^4<20<2^5$. So $\log_2(20)$ lies between $4$ and $5$.'
          - problem: 'The pH of a solution is $-\log[\mathrm{H}^+]$, where $[\mathrm{H}^+]$ is the concentration of hydrogen ions in mol/L. A solution has $[\mathrm{H}^+]=0.0004$ mol/L. Between which two consecutive integers does its pH lie?'
            answer: '3, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $0.0001<0.0004<0.001$, we have $10^{-4}<0.0004<10^{-3}$. So $\log[\mathrm{H}^+]$ is between $-4$ and $-3$, and the pH lies between $3$ and $4$.'
          - problem: 'The magnitude of an earthquake is $M=\log A$, where $A$ is the amplitude of the ground motion in micrometres. An earthquake has amplitude $2000000$ micrometres. Between which two consecutive integers does its magnitude lie?'
            answer: '6, 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $1000000<2000000<10000000$, we have $10^6<2000000<10^7$. So the magnitude lies between $6$ and $7$.'
          - problem: 'Between which two consecutive integers does $\ln(50)$ lie? Use $e^3\approx20.09$ and $e^4\approx54.60$.'
            answer: '3, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $20.09<50<54.60$, we have $e^3<50<e^4$. The natural logarithm keeps the order, so $\ln(50)$ lies between $3$ and $4$.'
          - problem: 'Between which two consecutive integers does $\log(0.04)$ lie?'
            answer: '-2, -1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $0.01<0.04<0.1$, we have $10^{-2}<0.04<10^{-1}$. So $\log(0.04)$ lies between $-2$ and $-1$.'
          - problem: 'A culture starts with one cell and doubles every hour, so after $h$ hours it has $2^h$ cells. It reaches $1000$ cells when $h=\log_2(1000)$. Between which two consecutive whole numbers of hours does this happen?'
            answer: '9, 10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $512<1000<1024$, we have $2^9<1000<2^{10}$. So $\log_2(1000)$ lies between $9$ and $10$ hours.'
          - problem: 'Between which two consecutive integers does $\log_5(100)$ lie?'
            answer: '2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $25<100<125$, we have $5^2<100<5^3$. The logarithm is the exponent, so $\log_5(100)$ lies between $2$ and $3$, not between $25$ and $125$.'
    diagnostic_exemplar:
      problem: '$\ln(100)$ lies between two consecutive integers. Using $e^4 \approx 54.6$ and $e^5 \approx 148.4$, give the smaller one.'
      answer: "4"
      solution_sketch: '$e^4 \approx 54.6 < 100 < 148.4 \approx e^5$, so $\ln 100$ sits between $4$ and $5$.'
