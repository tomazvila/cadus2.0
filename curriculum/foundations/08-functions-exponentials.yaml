        name: Find inputs where f(x) = k
        key_prerequisites: [function-notation]
        constraints: 'graphs described by 3 or 4 listed lattice points; find the input or inputs for a given output; when two inputs share an output the problem asks for all of them or says which to give; a rate from a situation graph'
        exemplars:
          - problem: 'The graph of $f$ passes through $(1,4)$, $(3,4)$ and $(5,2)$. Find all inputs $x$ for which $f(x)=4$.'
            answer: '1, 3'
            answer_contract: {"kind":"exact"}
            visual: 0
            solution_sketch: 'The outputs equal to $4$ belong to the points $(1,4)$ and $(3,4)$. So the inputs are $1$ and $3$.'
          - problem: 'The graph of $f$ passes through $(1,4)$, $(3,4)$ and $(5,2)$. Which input has the output $2$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            visual: 0
            solution_sketch: 'The point with second coordinate $2$ is $(5,2)$. Its first coordinate is the input, so the input is $5$.'
          - problem: 'The marked points of a function graph are $(2,6)$, $(5,6)$ and $(8,3)$. At which inputs is $f(x)=6$?'
            answer: '2, 5'
            answer_contract: {"kind":"exact"}
            visual: 1
            solution_sketch: 'The output $6$ belongs to the points $(2,6)$ and $(5,6)$. The inputs are $2$ and $5$.'
          - problem: 'A ball is thrown upward. Its height in metres at the marked times in seconds is $(1,20)$, $(4,35)$, $(7,35)$ and $(10,20)$. At which marked times is the ball $20$ metres high?'
            answer: '1, 10'
            answer_contract: {"kind":"exact"}
            visual: 2
            solution_sketch: 'The height $20$ belongs to the points $(1,20)$ and $(10,20)$. The times are $1$ and $10$ seconds.'
          - problem: 'A tank is drained at a steady rate. Its graph shows the volume in litres against the time in minutes and passes through $(0,120)$ and $(4,72)$. After how many minutes does the tank hold $24$ litres?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            visual: 3
            solution_sketch: 'In $4$ minutes the volume falls by $120-72=48$ litres, so the rate is $\frac{48}{4}=12$ litres per minute. The tank must lose $120-24=96$ litres, and $\frac{96}{12}=8$ minutes.'
          - problem: 'The marked points of $f$ are $(-2,3)$, $(0,5)$ and $(4,3)$. Which inputs satisfy $f(x)=3$?'
            answer: '-2, 4'
            answer_contract: {"kind":"exact"}
            visual: 4
            solution_sketch: 'The output $3$ belongs to the points $(-2,3)$ and $(4,3)$. The value $3$ is the output, and the question asks for the inputs $-2$ and $4$.'
          - problem: 'The graph of $f$ passes through $(-4,0)$, $(0,2)$, $(3,2)$ and $(6,-5)$. Give the larger input for which $f(x)=2$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            visual: 5
            solution_sketch: 'The output $2$ belongs to $(0,2)$ and $(3,2)$. The inputs are $0$ and $3$, and the larger one is $3$.'
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-2","x_max":"4","y_min":"-1","y_max":"1","x_tick":"1","y_tick":"1","points":[{"x":"-2","y":"0"},{"x":"4","y":"0"}],"segments":[],"caption":"A coordinate grid with the points the problem gives."},{"kind":"coordinate","x_min":"0","x_max":"5","y_min":"0","y_max":"250","x_tick":"1","y_tick":"25","points":[{"x":"0","y":"250"},{"x":"5","y":"0"}],"segments":[{"from":{"x":"0","y":"250","label":null},"to":{"x":"5","y":"0","label":null}}],"caption":"A coordinate grid with the straight segment through the two points the problem gives."},{"kind":"coordinate","x_min":"-8","x_max":"6","y_min":"-1","y_max":"1","x_tick":"2","y_tick":"1","points":[{"x":"-7","y":"0"},{"x":"2","y":"0"},{"x":"6","y":"0"}],"segments":[],"caption":"A coordinate grid with the points the problem gives."}]
        name: Intercepts as function values
        key_prerequisites: [coordinate-plane]
        constraints: 'intercepts given as lattice points; f(0) from the y-intercept, solutions of f(x) = 0 from the x-intercepts; break-even and rate problems from a situation graph'
        exemplars:
          - problem: 'The graph of $f$ crosses the $y$-axis at $(0,3)$. Find $f(0)$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $y$-intercept $(0,3)$ has input $0$ and output $3$. So $f(0)=3$.'
          - problem: 'The graph of $f$ crosses the $x$-axis at $(-2,0)$ and $(4,0)$. Solve $f(x)=0$.'
            answer: '-2, 4'
            answer_contract: {"kind":"exact"}
            visual: 0
            solution_sketch: 'The $x$-intercepts are the points with output $0$. Their inputs, $-2$ and $4$, solve $f(x)=0$.'
          - problem: 'The graph of the elevation in metres of a hiking path against the time in hours meets the vertical axis at $(0,-6)$. What is the elevation at time zero?'
            answer: '-6'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'At time zero the graph is at the point $(0,-6)$. The elevation is $-6$ metres, which is below sea level.'
          - problem: 'The profit $P$ of a lemonade stand, in dollars, is a function of the time $n$ in hours. Its graph crosses the horizontal axis at $(8,0)$. After how many hours does the stand break even?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"time","unit":"h","allow_omitted":true}
            solution_sketch: 'Break even means the profit $P(n)$ is $0$. That happens at the intercept $(8,0)$, so after $8$ hours.'
          - problem: 'The balance of a savings account, in dollars, falls by the same amount every month. Its graph passes through $(0,250)$ and crosses the horizontal axis at $(5,0)$, where the time is in months. By how many dollars does the balance fall each month?'
            answer: '50'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            visual: 1
            solution_sketch: 'The balance falls from $250$ to $0$ in $5$ months. The monthly fall is the quotient $\frac{250}{5}=50$ dollars.'
          - problem: 'The graph of $f$ has the $x$-intercept $(4,0)$. What is the value of $f(4)$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The point $(4,0)$ has input $4$ and output $0$, so $f(4)=0$. The value $f(0)$ is not given.'
          - problem: 'The graph of $f$ crosses the $x$-axis at $(-7,0)$, $(2,0)$ and $(6,0)$. Solve $f(x)=0$.'
            answer: '-7, 2, 6'
            answer_contract: {"kind":"exact"}
            visual: 2
            solution_sketch: 'The inputs of the $x$-intercepts are the solutions of $f(x)=0$. They are $-7$, $2$ and $6$.'
    diagnostic_exemplar:
      problem: 'The graph of $f$ crosses the $x$-axis at $(-5, 0)$ and at $(1, 0)$. Solving $f(x) = 0$ gives two inputs; give the larger one.'
      answer: "1"
      solution_sketch: 'The $x$-intercepts are exactly the solutions of $f(x) = 0$, namely $-5$ and $1$.'
    anki_seeds:
      - front: "On the graph of f, the point (a, b) means..."
        back: "f(a) = b."
        type: basic

  - id: domain-range-of-relations
    name: Domain and Range of Relations
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: identifying-functions-vertical-line-test
        weight: 0.6
        key: true
      - id: reading-function-graphs
        weight: 0.4
      - id: coordinate-plane
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Domain and range of finite sets of pairs
        key_prerequisites: [identifying-functions-vertical-line-test]
        constraints: '3 to 5 ordered pairs or arrows, integer coordinates, repeated outputs allowed; domain or range asked; some pairs come from a context'
        exemplars:
          - problem: 'State the domain of the relation $\{(1,2),(3,4),(5,6)\}$.'
            answer: '1, 3, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The domain is the set of first coordinates. They are $1$, $3$ and $5$, so the domain is $\{1,3,5\}$.'
          - problem: 'State the range of the relation $\{(0,2),(1,2),(2,5)\}$.'
            answer: '2, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The range is the set of second coordinates, which are $2$, $2$ and $5$. A set lists the repeated value $2$ once, so the range is $\{2,5\}$.'
          - problem: 'A bus company records the number of passengers who get off at each stop. The pairs (stop, passengers) are $(1,4)$, $(2,0)$, $(3,7)$, $(4,4)$. State the range of this relation.'
            answer: '0, 4, 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The range collects the passenger counts $4$, $0$, $7$ and $4$. The count $4$ occurs at two stops but is listed once, so the range is $\{0,4,7\}$.'
          - problem: 'An arrow diagram sends $2\to0$, $4\to1$ and $6\to0$. State the domain of the relation.'
            answer: '2, 4, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The domain is the set of numbers where the arrows start, which are $2$, $4$ and $6$. Two arrows end at $0$, but that does not change the domain.'
          - problem: 'The relation $\{(-2,4),(-1,1),(0,0),(1,1),(2,4)\}$ pairs each number with its square. State the range.'
            answer: '0, 1, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The squares are $4$, $1$, $0$, $1$ and $4$. Each distinct value is listed once, so the range is $\{0,1,4\}$.'
          - problem: 'What is the domain of $\{(3,9),(5,1),(8,2)\}$?'
            answer: '3, 5, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The second coordinates give the range. The domain is the set of first coordinates $3$, $5$ and $8$, so the domain is $\{3,5,8\}$.'
          - problem: 'State the range of the relation $\{(1,9),(2,9),(3,9)\}$.'
            answer: '{9}'
            answer_contract: {"kind": "label", "options": [["{9}", "9", "{ 9 }", "9 only", "the set {9}"], ["{1, 2, 3}", "1, 2, 3", "{1,2,3}", "{3}", "3", "{9, 9, 9}", "9, 9, 9"]]}
            solution_sketch: 'Every pair has second coordinate $9$. A set lists a repeated value once, so the range has one member: $\{9\}$.'
          - problem: 'A kiosk lists each item number with its price in dollars: $(101,3)$, $(102,5)$, $(103,3)$, $(104,8)$. State the range of this relation.'
            answer: '3, 5, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The prices are $3$, $5$, $3$ and $8$. The price $3$ belongs to two items but is listed once, so the range is $\{3,5,8\}$.'
      - id: kp2
        name: Domain and range from a table
        key_prerequisites: [identifying-functions-vertical-line-test]
        constraints: 'tables of 3 to 5 input-output pairs with integer or short decimal entries; domain or range asked; repeated outputs allowed'
        exemplars:
          - problem: 'A table gives $f(1)=5$, $f(2)=7$ and $f(4)=7$. State the range of $f$.'
            answer: '5, 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The outputs in the table are $5$, $7$ and $7$. The output $7$ appears twice and is listed once, so the range is $\{5,7\}$.'
          - problem: 'A table gives $f(2)=1$, $f(4)=3$ and $f(6)=3$. State the domain of $f$.'
            answer: '2, 4, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The domain is the set of inputs in the table. The inputs are $2$, $4$ and $6$, so the domain is $\{2,4,6\}$.'
          - problem: 'A table has the input row $1,3,5$ and the output row $4,4,8$. State the range.'
            answer: '4, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The range comes from the output row $4,4,8$. The repeated $4$ is listed once, so the range is $\{4,8\}$.'
          - problem: 'A table shows the goals a team scored in its first five matches: match $1$, $2$ goals; match $2$, $0$ goals; match $3$, $2$ goals; match $4$, $1$ goal; match $5$, $0$ goals. State the range of the relation that pairs each match with its goals.'
            answer: '0, 1, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The goal counts are $2$, $0$, $2$, $1$ and $0$. Listing each distinct count once gives the range $\{0,1,2\}$.'
          - problem: 'A parking meter table lists the minutes paid and the fee in dollars: $30\to1.5$, $60\to3$, $90\to4.5$ and $120\to4.5$. State the range of the fee.'
            answer: '1.5, 3, 4.5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fees are $1.5$, $3$, $4.5$ and $4.5$. The fee $4.5$ is listed once, so the range is $\{1.5,3,4.5\}$.'
          - problem: 'A table gives $f(-4)=2$, $f(-1)=2$, $f(0)=-6$ and $f(5)=2$. State the range of $f$.'
            answer: '-6, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The outputs are $2$, $2$, $-6$ and $2$. The output $2$ is listed once, so the range is $\{-6,2\}$.'
          - problem: 'A table has inputs $0,1,2,3$ and outputs $5,5,6,6$. What is the domain?'
            answer: '0, 1, 2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The outputs $5$ and $6$ give the range, not the domain. The domain is the set of inputs $0$, $1$, $2$ and $3$, so the domain is $\{0,1,2,3\}$.'
          - problem: 'A delivery table gives the weight of a parcel in kilograms and its postage in dollars: $7\to12$, $14\to18$, $21\to12$ and $28\to30$. State the domain of this relation.'
            answer: '7, 14, 21, 28'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The domain is the set of weights in the table, which are $7$, $14$, $21$ and $28$. All four weights are different, so none is dropped from the set.'
      - id: kp3
