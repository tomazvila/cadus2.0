        type: basic

  - id: substitution-with-isolated-variable
    name: "Substitution with an Isolated Variable"
    core: true
    difficulty: 0.46
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: multi-step-equations
        weight: 0.6
        key: true
      - id: checking-systems-solutions
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Substitute an isolated expression"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: "Solve by substitution: $y=2x$ and $x+y=18$. Give $(x,y)$."
            answer: "(6, 12)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Replace $y$ by $2x$: $3x=18$. Then double $x$ to recover $y$. Check: $(12)=2(6)$ and $(6)+(12)=18$."
          - problem: "Solve by substitution: $y=x+3$ and $2x+y=12$. Give $(x,y)$."
            answer: "(3, 6)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Substitute into the second equation: $3x+3=12$, so $x=3$ and $y=x+3$. Check: $(6)=(3)+3$ and $2(3)+(6)=12$."
          - problem: "Solve by substitution: $x=2y-1$ and $x+3y=14$. Give $(x,y)$."
            answer: "(5, 3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Use the isolated $x$: $2y-1+3y=14$, hence $5y=15$. Recover $x$ from $2y-1$. Check: $(5)=2(3)-1$ and $(5)+3(3)=14$."
          - problem: "Solve by substitution: $y=9-2x$ and $3x-y=11$. Give $(x,y)$."
            answer: "(4, 1)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Substitution gives $3x-(9-2x)=11$. Collect terms to get $5x=20$; then find $y$ from $9-2x$. Check: $(1)=9-2(4)$ and $3(4)-(1)=11$."
        constraints: "one equation already solved for a variable; integer solutions"
      - id: kp2
        name: "Equal-values method"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Solve the system $y = 3x - 2$, $y = x + 4$.'
            answer: "(3, 7)"
            answer_contract: {kind: exact}
            solution_sketch: '$3x - 2 = x + 4$; $2x = 6$; $x = 3$; $y = 7$.'
          - problem: 'Solve the system $y = 5x$, $y = 2x + 9$.'
            answer: "(3, 15)"
            answer_contract: {kind: exact}
            solution_sketch: '$5x = 2x + 9$; $3x = 9$; $x = 3$; $y = 15$.'
          - problem: 'Solve the system $y = 2x + 1$, $y = x + 6$.'
            answer: "(5, 11)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$2x + 1 = x + 6$; $x = 5$; $y = 11$.'
          - problem: 'Solve the system $y = 4x$, $y = x + 9$.'
            answer: "(3, 12)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$4x = x + 9$; $3x = 9$; $x = 3$; $y = 12$.'
        constraints: "both equations solved for y; set them equal"
      - id: kp3
        name: "Back-substitute and check"
        key_prerequisites: [checking-systems-solutions]
        exemplars:
          - problem: "Solve, back-substitute, and check both equations: $y=x-3$ and $x+2y=15$. Give $(x,y)$."
            answer: "(7, 4)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Substitution gives $x+2(x-3)=15$, hence $3x=21$. Recover $y=x-3$. Check: $(4)=(7)-3$ and $(7)+2(4)=15$."
          - problem: "Solve, back-substitute, and check both equations: $x=3y$ and $2x-y=20$. Give $(x,y)$."
            answer: "(12, 4)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Substitute $3y$ for $x$: $6y-y=20$, so $y=4$. Recover $x=3y$. Check: $(12)=3(4)$ and $2(12)-(4)=20$."
          - problem: "Solve, back-substitute, and check both equations: $y=8-x$ and $2x-3y=1$. Give $(x,y)$."
            answer: "(5, 3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Use $2x-3(8-x)=1$: $5x=25$. Recover $y=8-x$. Check: $(3)=8-(5)$ and $2(5)-3(3)=1$."
          - problem: "Solve, back-substitute, and check both equations: $x=2y+5$ and $3x+y=8$. Give $(x,y)$."
            answer: "(3, -1)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Use $3(2y+5)+y=8$: $7y=-7$. Recover $x=2y+5$. Check: $(3)=2(-1)+5$ and $3(3)+(-1)=8$."
        constraints: "verify the pair in the equation not used for back-substitution"
    diagnostic_exemplar:
      problem: 'Solve the system $y = 3x$ and $x + y = 12$.'
      answer: "(3, 9)"
      solution_sketch: '$x + 3x = 12$; $x = 3$; $y = 9$.'
    anki_seeds:
      - front: "Substitution method for a system of equations:"
        back: "solve one equation for a variable, substitute it into the other, solve, then back-substitute"
        type: basic

  - id: systems-substitution
    name: "Systems by Substitution"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: substitution-with-isolated-variable
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: true
      - id: distributive-property
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Isolate a variable, then substitute"
        key_prerequisites: [substitution-with-isolated-variable]
        exemplars:
          - problem: "Solve by substitution: $x+2y=16$ and $3x+y=18$. Give $(x,y)$."
            answer: "(4, 6)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Isolate $x=16-2y$. Then $3(16-2y)+y=18$ gives $5y=30$; recover $x$. Check: $(4)+2(6)=16$ and $3(4)+(6)=18$."
          - problem: "Solve by substitution: $2x-y=1$ and $x+3y=11$. Give $(x,y)$."
            answer: "(2, 3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Isolate $y=2x-1$. Then $x+3(2x-1)=11$ gives $7x=14$; recover $y$. Check: $2(2)-(3)=1$ and $(2)+3(3)=11$."
          - problem: "Solve by substitution: $3x+y=2$ and $x-2y=10$. Give $(x,y)$."
            answer: "(2, -4)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Isolate $y=2-3x$. Then $x-2(2-3x)=10$ gives $7x=14$; recover $y$. Check: $3(2)+(-4)=2$ and $(2)-2(-4)=10$."
          - problem: "Solve by substitution: $x-3y=9$ and $2x+5y=7$. Give $(x,y)$."
            answer: "(6, -1)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Isolate $x=9+3y$. Then $2(9+3y)+5y=7$ gives $11y=-11$; recover $x$. Check: $(6)-3(-1)=9$ and $2(6)+5(-1)=7$."
        constraints: "solve for the variable with coefficient 1; integer solutions"
      - id: kp2
        name: "Substitution with distribution"
        key_prerequisites: [distributive-property]
        exemplars:
          - problem: "Solve by substitution: $x=2y+3$ and $3x-4y=19$. Give $(x,y)$."
            answer: "(13, 5)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Distribute after substitution: $3(2y+3)-4y=19$ becomes $2y+9=19$. Solve for $y$, then recover $x$. Check: $(13)=2(5)+3$ and $3(13)-4(5)=19$."
          - problem: "Solve by substitution: $y=3x-2$ and $5x-2y=0$. Give $(x,y)$."
            answer: "(4, 10)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Substitute and distribute the negative: $5x-2(3x-2)=0$, hence $-x+4=0$. Recover $y$. Check: $(10)=3(4)-2$ and $5(4)-2(10)=0$."
          - problem: "Solve by substitution: $x=7-2y$ and $4x+3y=13$. Give $(x,y)$."
            answer: "(1, 3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Expand $4(7-2y)+3y=13$ to $28-5y=13$. Recover $x$ after finding $y$. Check: $(1)=7-2(3)$ and $4(1)+3(3)=13$."
          - problem: "Solve by substitution: $y=-2(x-1)$ and $3x+2y=9$. Give $(x,y)$."
            answer: "(-5, 12)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Substitute the grouped expression: $3x-4(x-1)=9$ gives $-x+4=9$. Evaluate $-2(x-1)$ for $y$. Check: $(12)=-2((-5)-1)$ and $3(-5)+2(12)=9$."
        constraints: "distribute a coefficient over the substituted expression"
      - id: kp3
        name: "Careful sign handling"
        key_prerequisites: [substitution-with-isolated-variable]
        exemplars:
          - problem: "Solve by substitution: $x+y=3$ and $2x-y=12$. Give $(x,y)$."
            answer: "(5, -2)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Use $y=3-x$: $2x-(3-x)=12$, so $3x=15$. The minus before the parentheses changes both signs. Check: $(5)+(-2)=3$ and $2(5)-(-2)=12$."
          - problem: "Solve by substitution: $x-2y=-8$ and $3x+y=-3$. Give $(x,y)$."
            answer: "(-2, 3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Use $x=2y-8$: $3(2y-8)+y=-3$, hence $7y=21$. Recover $x$ including its negative sign. Check: $(-2)-2(3)=-8$ and $3(-2)+(3)=-3$."
          - problem: "Solve by substitution: $2x+y=-4$ and $x-3y=5$. Give $(x,y)$."
            answer: "(-1, -2)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Use $y=-4-2x$: $x-3(-4-2x)=5$, so $7x=-7$. Recover $y$. Check: $2(-1)+(-2)=-4$ and $(-1)-3(-2)=5$."
          - problem: "Solve by substitution: $x+y=-7$ and $-2x+y=2$. Give $(x,y)$."
            answer: "(-3, -4)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Use $x=-7-y$: $-2(-7-y)+y=2$, so $3y=-12$. Recover $x$. Check: $(-3)+(-4)=-7$ and $-2(-3)+(-4)=2$."
        constraints: "subtraction of substituted expressions; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve the system by substitution: $x + 3y = 13$ and $2x - y = 5$.'
      answer: '(4, 3)'
      solution_sketch: '$x = 13 - 3y$; $2(13 - 3y) - y = 5$; $7y = 21$; $y = 3$ and $x = 4$.'
    anki_seeds:
      - front: "When neither equation of a system has an isolated variable, isolate the variable whose coefficient is ___."
        back: "1 (or -1) — it avoids fractions"
        type: basic

  - id: elimination-with-addition
    name: "Elimination by Adding Equations"
    core: true
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: substitution-with-isolated-variable
        weight: 0.4
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: multi-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Add when coefficients are opposites"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: "Solve by elimination: $2x+y=17$ and $3x-y=13$. Give $(x,y)$."
            answer: "(6, 5)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Add the equations to cancel $y$: $5x=30$. Subtract $2x$ from $17$ to recover $y$. Check: $2(6)+(5)=17$ and $3(6)-(5)=13$."
          - problem: "Solve by elimination: $x+3y=13$ and $-x+2y=2$. Give $(x,y)$."
            answer: "(4, 3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Add to cancel $x$: $5y=15$. Use $x=13-3y$. Check: $(4)+3(3)=13$ and $-(4)+2(3)=2$."
          - problem: "Solve by elimination: $3x-2y=16$ and $x+2y=0$. Give $(x,y)$."
            answer: "(4, -2)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Add to cancel $y$: $4x=16$. Use $2y=-x$. Check: $3(4)-2(-2)=16$ and $(4)+2(-2)=0$."
          - problem: "Solve by elimination: $-2x-y=1$ and $2x+4y=8$. Give $(x,y)$."
            answer: "(-2, 3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Add to cancel $x$: $3y=9$. Use $-2x=1+y$. Check: $-2(-2)-(3)=1$ and $2(-2)+4(3)=8$."
        constraints: "coefficients already opposite; integer solutions"
      - id: kp2
        name: "Subtract when coefficients are equal"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: "Solve by elimination: $x+3y=19$ and $x+y=9$. Give $(x,y)$."
            answer: "(4, 5)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Subtract the second equation from the first: $2y=10$. Use $x=9-y$. Check: $(4)+3(5)=19$ and $(4)+(5)=9$."
          - problem: "Solve by elimination: $4x+y=15$ and $x+y=6$. Give $(x,y)$."
            answer: "(3, 3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Subtract to cancel $y$: $3x=9$. Use $y=6-x$. Check: $4(3)+(3)=15$ and $(3)+(3)=6$."
          - problem: "Solve by elimination: $2x-3y=17$ and $2x+y=5$. Give $(x,y)$."
            answer: "(4, -3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Subtract the second from the first: $-4y=12$. Use $2x=5-y$. Check: $2(4)-3(-3)=17$ and $2(4)+(-3)=5$."
          - problem: "Solve by elimination: $-x+2y=4$ and $3x+2y=12$. Give $(x,y)$."
            answer: "(2, 3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Subtract the first from the second: $4x=8$. Use $2y=4+x$. Check: $-(2)+2(3)=4$ and $3(2)+2(3)=12$."
        constraints: "matching coefficients; subtract carefully"
      - id: kp3
        name: "Back-substitute and verify"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: "Solve by elimination: $2x+y=13$ and $x-y=8$. Give $(x,y)$."
            answer: "(7, -1)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Add to get $3x=21$. Back-substitute with $y=x-8$ and verify each original equation. Check: $2(7)+(-1)=13$ and $(7)-(-1)=8$."
          - problem: "Solve by elimination: $x+2y=-1$ and $-x+3y=16$. Give $(x,y)$."
            answer: "(-7, 3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Add to get $5y=15$. Back-substitute with $x=-1-2y$ and verify both equations. Check: $(-7)+2(3)=-1$ and $-(-7)+3(3)=16$."
          - problem: "Solve by elimination: $3x-2y=4$ and $x+2y=-12$. Give $(x,y)$."
            answer: "(-2, -5)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Add to get $4x=-8$. Back-substitute with $2y=-12-x$ and check both equations. Check: $3(-2)-2(-5)=4$ and $(-2)+2(-5)=-12$."
          - problem: "Solve by elimination: $-2x+y=-11$ and $2x+2y=2$. Give $(x,y)$."
            answer: "(4, -3)"
            answer_contract: {kind: coordinates, arity: 2}
            solution_sketch: "Add to get $3y=-9$. Back-substitute with $2x=2-2y$ and verify both equations. Check: $-2(4)+(-3)=-11$ and $2(4)+2(-3)=2$."
        constraints: "solutions may include negatives; verify in both equations"
    diagnostic_exemplar:
      problem: 'Solve by elimination: $3x + y = 5$ and $x + y = 7$.'
      answer: '(-1, 8)'
      solution_sketch: 'Subtract the equations: $2x = -2$, so $x = -1$ and $y = 8$.'
    anki_seeds:
      - front: "Eliminate a variable by adding when its coefficients are ___, or subtracting when they are ___."
        back: "opposites; equal"
        type: basic

  - id: systems-elimination
    name: "Systems by Elimination"
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: multi-step
    expected_time_secs: 130
    prerequisites:
      - id: elimination-with-addition
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.4
      - id: distributive-property
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Scale one equation first"
        key_prerequisites: [elimination-with-addition]
        exemplars:
          - problem: "Solve by elimination: $2x+3y=29$ and $x+2y=18$. Give $(x,y)$."
            answer: "(4, 7)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the second equation by $-2$ and add: $-y=-7$. Recover $x$ from the second equation. Check: $2(4)+3(7)=29$ and $(4)+2(7)=18$."
          - problem: "Solve by elimination: $3x-2y=23$ and $x+y=11$. Give $(x,y)$."
            answer: "(9, 2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the second equation by $-3$ and add: $-5y=-10$. Recover $x$ from the second equation. Check: $3(9)-2(2)=23$ and $(9)+(2)=11$."
          - problem: "Solve by elimination: $2x+y=9$ and $3x-2y=31$. Give $(x,y)$."
            answer: "(7, -5)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the first equation by $2$ and add: $7x=49$. Recover $y$ from the first equation. Check: $2(7)+(-5)=9$ and $3(7)-2(-5)=31$."
          - problem: "Solve by elimination: $4x+3y=-2$ and $2x-y=-6$. Give $(x,y)$."
            answer: "(-2, 2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the second equation by $-2$ and add: $5y=10$. Recover $x$ from the second equation. Check: $4(-2)+3(2)=-2$ and $2(-2)-(2)=-6$."
        constraints: "scale to create opposite coefficients; integer solutions"
      - id: kp2
        name: "Scale both equations"
        key_prerequisites: [elimination-with-addition]
        exemplars:
          - problem: "Solve by elimination: $2x+3y=32$ and $3x+2y=33$. Give $(x,y)$."
            answer: "(7, 6)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the equations by $3$ and $-2$, respectively, then add: $5y=30$. Recover $x$ from the first equation. Check: $2(7)+3(6)=32$ and $3(7)+2(6)=33$."
          - problem: "Solve by elimination: $3x-4y=2$ and $2x+3y=7$. Give $(x,y)$."
            answer: "(2, 1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the equations by $2$ and $-3$, respectively, then add: $-17y=-17$. Recover $x$ from the second equation. Check: $3(2)-4(1)=2$ and $2(2)+3(1)=7$."
          - problem: "Solve by elimination: $4x+3y=-17$ and $3x-2y=-17$. Give $(x,y)$."
            answer: "(-5, 1)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the equations by $2$ and $3$, respectively, then add: $17x=-85$. Recover $y$ from the first equation. Check: $4(-5)+3(1)=-17$ and $3(-5)-2(1)=-17$."
          - problem: "Solve by elimination: $3(x+y)+2y=47$ and $2x-3y=6$. Give $(x,y)$."
            answer: "(9, 4)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Expand the first equation to $3x+5y=47$. Multiply the equations by $3$ and $5$, respectively, then add: $19x=171$. Recover $y$ from the second equation. Check: $3((9)+(4))+2(4)=47$ and $2(9)-3(4)=6$."
        constraints: "scale both to match one variable; integer solutions"
      - id: kp3
        name: "Use a negative multiplier"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: "Solve by elimination: $2x+5y=39$ and $4x+3y=43$. Give $(x,y)$."
            answer: "(7, 5)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the first equation by $-2$, including its right side. Add: $-7y=-35$. Recover $x$ from the first equation. Check: $2(7)+5(5)=39$ and $4(7)+3(5)=43$."
          - problem: "Solve by elimination: $3x+2y=35$ and $x+4y=35$. Give $(x,y)$."
            answer: "(7, 7)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the second equation by $-3$, including its right side. Add: $-10y=-70$. Recover $x$ from the second equation. Check: $3(7)+2(7)=35$ and $(7)+4(7)=35$."
          - problem: "Solve by elimination: $-2x+3y=29$ and $-4x+y=23$. Give $(x,y)$."
            answer: "(-4, 7)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the first equation by $-2$: both negative $x$ terms cancel on addition and $-5y=-35$. Recover $x$. Check: $-2(-4)+3(7)=29$ and $-4(-4)+(7)=23$."
          - problem: "Solve by elimination: $5x-2y=-9$ and $3x-4y=-11$. Give $(x,y)$."
            answer: "(-1, 2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Multiply the first equation by $-2$ and add the second: $-7x=7$. Recover $y$ from the first equation. Check: $5(-1)-2(2)=-9$ and $3(-1)-4(2)=-11$."
        constraints: "negative multipliers turn subtraction into addition"
    diagnostic_exemplar:
      problem: 'Solve the system by elimination: $3x + 2y = 12$ and $2x + 3y = 13$.'
      answer: '(2, 3)'
      solution_sketch: 'Scale both: $9x + 6y = 36$ and $4x + 6y = 26$; subtract: $5x = 10$.'
    anki_seeds:
      - front: "Elimination method for a system of equations:"
        back: "scale one or both equations so a variable's coefficients are opposites, add to eliminate it, solve, then back-substitute"
        type: basic

  - id: systems-special-cases
    name: "Systems with No or Infinitely Many Solutions"
    core: true
    difficulty: 0.54
    drill: false
    answer_kind: expression
    expected_time_secs: 100
    prerequisites:
      - id: systems-elimination
        weight: 0.6
        key: true
      - id: slope-intercept-form
        weight: 0.5
        key: true
      - id: slopes-of-parallel-perpendicular-lines
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Detect special cases algebraically"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'Solve the system $x + y = 3$, $x + y = 7$.'
            answer: "no solution"
            solution_sketch: 'Subtracting gives $0 = 4$, a contradiction.'
          - problem: 'Solve the system $2x + 2y = 8$, $x + y = 4$.'
            answer: "infinitely many solutions"
            solution_sketch: 'The first is twice the second; elimination gives $0 = 0$.'
        constraints: "elimination ends in a false statement (none) or 0 = 0 (infinite)"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}},{"from":{"x":"-2","y":"-5","label":null},"to":{"x":"2","y":"1","label":null}}],"caption":"Reference example: The reference lines y = (3/2)x + 1 and y = (3/2)x - 2 have equal slopes and distinct intercepts."}]
        name: "Detect special cases from slopes and graphs"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'How many solutions does the system $y = 2x + 1$, $y = 2x - 3$ have?'
            answer: "none"
            solution_sketch: 'Equal slopes, different intercepts $\to$ parallel.'
          - problem: 'How many solutions does the system $y = x + 2$, $2y = 2x + 4$ have?'
            answer: "infinitely many"
            solution_sketch: 'Same line.'
        constraints: "parallel -> none; same line -> infinitely many; else one"
      - id: kp3
        name: "Classify one / none / infinitely many"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'How many solutions does the system $y = 3x + 1$, $y = 2x + 1$ have?'
            answer: "exactly one"
            solution_sketch: 'Different slopes, so the lines cross once (at $(0, 1)$).'
          - problem: 'How many solutions does the system $6x - 2y = 10$, $3x - y = 5$ have?'
            answer: "infinitely many"
            solution_sketch: 'The first is twice the second: the same line.'
        constraints: "mix all three cases across generated problems"
    diagnostic_exemplar:
      problem: 'How many solutions does the system $4x - 2y = 6$, $2x - y = 3$ have?'
      answer_contract: {kind: label, options: [['no solutions', 'none'], ['one solution', 'one'], ['infinitely many', 'infinite']]}
      answer: 'infinitely many'
      solution_sketch: 'Doubling the second equation gives the first: the two equations describe the same line.'
    anki_seeds:
      - front: "Graphically, a system of two lines has no solution when ___ and infinitely many when ___."
        back: "the lines are parallel (equal slope, different intercept); the lines are identical"
        type: basic

  - id: systems-of-linear-inequalities
    name: "Systems of Linear Inequalities"
    core: false               # supplemental, like its graphing prerequisites
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: graphing-linear-inequalities
        weight: 0.7
        key: true
      - id: graphing-systems
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Check a point against both inequalities"
        key_prerequisites: [graphing-linear-inequalities]
        exemplars:
          - problem: 'Is $(1, 1)$ a solution of the system $y \le x + 2$ and $y > -x$?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$1 \le 3$ and $1 > -1$ both hold.'
          - problem: 'Is $(0, 4)$ a solution of the system $y < 2x + 1$ and $y \ge x$?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$4 < 1$ fails.'
        constraints: "the point must satisfy BOTH inequalities"
      - id: kp2
        name: "Boundary styles and the overlap region"
        key_prerequisites: [graphing-linear-inequalities]
        exemplars:
          - problem: 'For the system $y \le 2x + 1$, $y > -x + 4$, which boundary line is dashed?'
            answer: "y = -x + 4 (the strict one)"
          - problem: 'What is the solution region of a system of two linear inequalities?'
            answer: "the overlap (intersection) of the two shaded half-planes"
        constraints: "one strict and one inclusive inequality per problem"
      - id: kp3
        name: "Locate a point in the solution region"
        key_prerequisites: [graphing-linear-inequalities]
        exemplars:
          - problem: 'Which of $(0, 2)$ or $(2, 0)$ satisfies both $y > x$ and $y < x + 4$?'
            answer: "(0, 2)"
            solution_sketch: '$2 > 0$ and $2 < 4$; the other point fails $y > x$.'
          - problem: 'Does the origin satisfy the system $y \ge x - 3$ and $y \le -x + 5$?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$0 \ge -3$ and $0 \le 5$.'
        constraints: "candidate points off the boundary lines"
    diagnostic_exemplar:
      problem: 'Is $(2, 3)$ a solution of the system $y > x$ and $y \le 2x$?'
      answer_contract: {kind: label, options: [[yes], [no]]}
      answer: "yes"
      solution_sketch: '$3 > 2$ and $3 \le 4$ both hold.'
    anki_seeds:
      - front: "The solution of a system of linear inequalities is the ___ of the individual shaded regions."
        back: "intersection (overlap)"
        type: basic

  - id: systems-money-problems
    name: "Money and Ticket Systems"
    # over-coverage: coin/ticket context schema for systems-substitution +
    # systems-elimination; the technique, not the context, is the prerequisite
    core: false
    difficulty: 0.54
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: systems-substitution
        weight: 0.5
        key: true
      - id: systems-elimination
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Count equation plus value equation"
        key_prerequisites: [systems-substitution]
        exemplars:
          - problem: "Adult and child tickets have values 9 and 4 euros, respectively. There are 17 items with total value 108 euros. Find the counts (first type, second type)."
            answer: "(8, 9)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Let $x,y$ count the types in the stated order. Then $x+y=17$ and $9x+4y=108$. Subtract 4 times the count equation: $5x=40$. Thus $x=8$, $y=9$. Check: $8+9=17$ and $9(8)+4(9)=108$. Both counts are nonnegative integers."
          - problem: "Five-cent and twenty-cent coins have values 5 and 20 cents, respectively. There are 13 items with total value 155 cents. Find the counts (first type, second type)."
            answer: "(7, 6)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Let $x,y$ count the types in the stated order. Then $x+y=13$ and $5x+20y=155$. Subtract 20 times the count equation: $-15x=-105$. Thus $x=7$, $y=6$. Check: $7+6=13$ and $5(7)+20(6)=155$. Both counts are nonnegative integers."
          - problem: "Large and small meal vouchers have values 12 and 7 euros, respectively. There are 19 items with total value 173 euros. Find the counts (first type, second type)."
            answer: "(8, 11)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Let $x,y$ count the types in the stated order. Then $x+y=19$ and $12x+7y=173$. Subtract 7 times the count equation: $5x=40$. Thus $x=8$, $y=11$. Check: $8+11=19$ and $12(8)+7(11)=173$. Both counts are nonnegative integers."
          - problem: "Standard and premium tokens have values 6 and 15 euros, respectively. There are 11 items with total value 138 euros. Find the counts (first type, second type)."
            answer: "(3, 8)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Let $x,y$ count the types in the stated order. Then $x+y=11$ and $6x+15y=138$. Subtract 15 times the count equation: $-9x=-27$. Thus $x=3$, $y=8$. Check: $3+8=11$ and $6(3)+15(8)=138$. Both counts are nonnegative integers."
        constraints: "one count equation and one value equation"
      - id: kp2
        name: "Two-item purchase problems"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: "Pens and notebooks have fixed unit prices. Buying 3 of the first and 2 of the second costs 29 euros; buying 1 of the first and 2 of the second costs 15 euros. Find the unit prices (first, second) in euros."
            answer: "(7, 4)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Let $x,y$ be the requested prices. Then $3x+2y=29$ and $1x+2y=15$. Multiply the first equation by 1 and the second by -3; adding gives $-4y=-16$. Recover $x=7$, $y=4$. Check: $3(7)+2(4)=29$ and $1(7)+2(4)=15$. Both prices are positive."
          - problem: "Sandwiches and drinks have fixed unit prices. Buying 2 of the first and 1 of the second costs 17 euros; buying 1 of the first and 3 of the second costs 26 euros. Find the unit prices (first, second) in euros."
            answer: "(5, 7)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Let $x,y$ be the requested prices. Then $2x+1y=17$ and $1x+3y=26$. Multiply the first equation by 1 and the second by -2; adding gives $-5y=-35$. Recover $x=5$, $y=7$. Check: $2(5)+1(7)=17$ and $1(5)+3(7)=26$. Both prices are positive."
          - problem: "Apples and pears have fixed unit prices. Buying 1 of the first and 4 of the second costs 23 euros; buying 3 of the first and 2 of the second costs 29 euros. Find the unit prices (first, second) in euros."
            answer: "(7, 4)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Let $x,y$ be the requested prices. Then $1x+4y=23$ and $3x+2y=29$. Multiply the first equation by 3 and the second by -1; adding gives $10y=40$. Recover $x=7$, $y=4$. Check: $1(7)+4(4)=23$ and $3(7)+2(4)=29$. Both prices are positive."
          - problem: "Coffees and buns have fixed unit prices. Buying 4 of the first and 3 of the second costs 47 euros; buying 2 of the first and 1 of the second costs 21 euros. Find the unit prices (first, second) in euros."
            answer: "(8, 5)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Let $x,y$ be the requested prices. Then $4x+3y=47$ and $2x+1y=21$. Multiply the first equation by 2 and the second by -4; adding gives $2y=10$. Recover $x=8$, $y=5$. Check: $4(8)+3(5)=47$ and $2(8)+1(5)=21$. Both prices are positive."
        constraints: "two purchases of the same two items; elimination-friendly numbers"
      - id: kp3
        name: "Solve and verify in context"
        key_prerequisites: [systems-substitution]
        exemplars:
          - problem: "Adult and child tickets have values 11 and 5 euros, respectively. There are 24 items with total value 174 euros. How many of the first type are there? Verify both totals."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $x,y$ count the types in the stated order. Then $x+y=24$ and $11x+5y=174$. Subtract 5 times the count equation: $6x=54$. Thus $x=9$, $y=15$. Check: $9+15=24$ and $11(9)+5(15)=174$. Both counts are nonnegative integers."
          - problem: "Twenty-five-cent and ten-cent coins have values 25 and 10 cents, respectively. There are 18 items with total value 285 cents. How many of the first type are there? Verify both totals."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $x,y$ count the types in the stated order. Then $x+y=18$ and $25x+10y=285$. Subtract 10 times the count equation: $15x=105$. Thus $x=7$, $y=11$. Check: $7+11=18$ and $25(7)+10(11)=285$. Both counts are nonnegative integers."
          - problem: "Full-price and discount coupons have values 8 and 3 euros, respectively. There are 16 items with total value 48 euros. How many of the first type are there? Verify both totals."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $x,y$ count full-price and discount coupons. Then $x+y=16$ and $8x+3y=48$. Subtract three times the count equation to get $5x=0$, hence $x=0$ and $y=16$. Check: all sixteen coupons are discounted, giving $3*16=48$ euros. Both counts are nonnegative integers."
          - problem: "Basic and deluxe tokens have values 4 and 9 euros, respectively. There are 23 items with total value 147 euros. How many of the first type are there? Verify both totals."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let $x,y$ count the types in the stated order. Then $x+y=23$ and $4x+9y=147$. Subtract 9 times the count equation: $-5x=-60$. Thus $x=12$, $y=11$. Check: $12+11=23$ and $4(12)+9(11)=147$. Both counts are nonnegative integers."
        constraints: "verify counts are nonnegative integers and totals match"
    diagnostic_exemplar:
      problem: '$2$ coffees and $3$ buns cost €12; $1$ coffee and $2$ buns cost €7. What is the price of one coffee in euros?'
      answer: '3'
      solution_sketch: '$2c + 3b = 12$ and $c + 2b = 7$; eliminating $c$ gives $b = 2$, so $c = 3$.'
    anki_seeds:
      - front: "Money/ticket system setup: one equation counts the ___, the other totals the ___."
        back: "items; value (money)"
        type: basic

  - id: systems-mixture-problems
    name: "Mixture Systems"
    # over-coverage: acid/coffee-blend context schema — the percent-weighted
    # presentation of systems-money-problems, no new technique
    core: false
    difficulty: 0.56
    drill: false
    answer_kind: multi-step
    expected_time_secs: 170
    prerequisites:
      - id: systems-money-problems
        weight: 0.7
        key: true
      - id: percentages
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Set up the amount and value equations"
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'How much pure acid is in $12$ L of a $35\%$ acid solution?'
            answer: "4.2 L"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L"}
            solution_sketch: '$0.35 \times 12 = 4.2$.'
          - problem: 'Mixing $x$ L of $25\%$ acid with $y$ L of $60\%$ acid to get $20$ L of $40\%$ acid: give both equations.'
            answer: "x + y = 20 and 0.25x + 0.60y = 8"
            solution_sketch: 'Amounts sum to $20$; pure acid sums to $0.40(20) = 8$.'
        constraints: "amount equation plus concentration (pure-substance) equation"
      - id: kp2
        name: "Percent-solution mixtures"
        key_prerequisites: [systems-money-problems]
        exemplars:
          - problem: 'How many liters of $20\%$ acid and $50\%$ acid make $30$ L of $30\%$ acid?'
            answer: "20 L of 20% and 10 L of 50%"
            solution_sketch: '$x + y = 30$, $0.2x + 0.5y = 9$; $0.2x + 0.5(30 - x) = 9$; $x = 20$.'
          - problem: 'How many liters of $10\%$ and $40\%$ saline make $12$ L of $20\%$ saline?'
            answer: "8 L of 10% and 4 L of 40%"
            solution_sketch: '$x + y = 12$, $0.1x + 0.4y = 2.4$; $x = 8$, $y = 4$.'
        constraints: "target strength strictly between the two ingredient strengths"
      - id: kp3
        name: "Price-blend mixtures"
        key_prerequisites: [systems-money-problems]
        exemplars:
          - problem: 'Coffee at €8/kg is blended with coffee at €12/kg to make $10$ kg worth €9/kg. How much of each?'
            answer: "7.5 kg of €8 coffee and 2.5 kg of €12 coffee"
            solution_sketch: '$x + y = 10$, $8x + 12y = 90$; $4y = 10$; $y = 2.5$.'
          - problem: 'Nuts at €6/kg are mixed with raisins at €3/kg to make $9$ kg costing €36. How much of each?'
            answer: "3 kg nuts and 6 kg raisins"
            solution_sketch: '$n + r = 9$, $6n + 3r = 36$; $3n = 9$; $n = 3$.'
        constraints: "blend price between the two ingredient prices; halves allowed"
    diagnostic_exemplar:
      problem: 'How many liters each of $10\%$ and $30\%$ solution make $8$ L of $25\%$ solution?'
      answer_contract: {kind: multipart, parts: [{name: 10_percent, contract: {kind: unit, quantity: volume, unit: L}}, {name: 30_percent, contract: {kind: unit, quantity: volume, unit: L}}]}
      answer: "10_percent = 2 L; 30_percent = 6 L"
      solution_sketch: '$x + y = 8$, $0.1x + 0.3y = 2$; $0.1x + 0.3(8 - x) = 2$; $0.2x = 0.4$; $x = 2$.'
    anki_seeds:
      - front: "Mixture system: amount equation x + y = total; the second equation totals the ___."
        back: "pure substance (or value): (conc1)x + (conc2)y = (target conc)(total)"
        type: basic

  - id: systems-rate-problems
    name: "Rate Systems (Current and Wind)"
    # over-coverage: current/wind and meeting-problem context schema for
    # systems-elimination; d = rt dressing, no new solving technique
    core: false
    difficulty: 0.57
    drill: false
    answer_kind: multi-step
    expected_time_secs: 170
    prerequisites:
      - id: systems-elimination
        weight: 0.6
        key: true
      - id: systems-substitution
        weight: 0.4
      - id: equation-word-problems
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Current and wind: sum and difference"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: "A boat maintains a constant still-medium speed. Its ground speeds are 18 km/h with the current or wind and 10 km/h against it. Find (still-medium speed, current or wind speed) in km/h."
            answer: "(14, 4)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Let $x,y$ be the requested speeds. Then $x+y=18$ and $x-y=10$. Add: $2x=28$; subtract: $2y=8$. Thus $x=14$ and $y=4$. Check: $14+4=18$ and $14-4=10$."
          - problem: "A flight log records ground speeds of 420 km/h against a steady wind and 540 km/h with it. The plane keeps the same airspeed. Find (airspeed, wind speed) in km/h."
            answer: "(480, 60)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Let $x,y$ be the requested speeds. Then $x+y=540$ and $x-y=420$. Add: $2x=960$; subtract: $2y=120$. Thus $x=480$ and $y=60$. Check: $480+60=540$ and $480-60=420$."
          - problem: "A kayak maintains the same paddling effort. Its ground speeds are 200 metres/min with the current and 150 metres/min against it. Find (still-water speed, current speed) in km/h."
            answer: "(21/2, 3/2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Convert to km/h: $200*60/1000=12$ and $150*60/1000=9$. Let $x,y$ be still-water and current speeds. Then $x+y=12$ and $x-y=9$. Adding gives $2x=21$, so $x=21/2$ and $y=3/2$. Check: $21/2+3/2=12$ and $21/2-3/2=9$."
          - problem: "A ferry runs at 37 km/h downstream and 25 km/h upstream. A learner uses the full difference as the current speed. Correct the calculation and give (still-water speed, current speed) in km/h."
            answer: "(31, 6)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The difference includes the current effect twice: $2y=37-25=12$. Thus $y=6$. The sum gives $2x=37+25=62$, hence $x=31$. Check: $31+6=37$ and $31-6=25$."
        constraints: "downstream = sum, upstream = difference of the two rates"
      - id: kp2
        name: "Compute the two speeds from d = rt first"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: "A canoe travels 42 km in 2 h with the current or wind and 42 km in 3 h against it. Its still-medium speed and the current or wind stay constant. Find (still-medium speed, current or wind speed) in km/h."
            answer: "(35/2, 7/2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Divide distance by time first: $42/2=21$ and $42/3=14$. Then $x+y=21$ and $x-y=14$. Add and halve to get $x=35/2$; subtract and halve to get $y=7/2$. Check: $(35/2+7/2)*2=42$ and $(35/2-7/2)*3=42$."
          - problem: "A plane travels 1800 km in 3 h with the current or wind and 2000 km in 4 h against it. Its still-medium speed and the current or wind stay constant. Find (still-medium speed, current or wind speed) in km/h."
            answer: "(550, 50)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Divide distance by time first: $1800/3=600$ and $2000/4=500$. Then $x+y=600$ and $x-y=500$. Add and halve to get $x=550$; subtract and halve to get $y=50$. Check: $(550+50)*3=1800$ and $(550-50)*4=2000$."
          - problem: "A launch travels 60 km in 180 minutes downstream and 48 km in 240 minutes upstream. Its still-water speed and the current stay constant. Find (still-water speed, current speed) in km/h."
            answer: "(16, 4)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Convert minutes to hours: $180/60=3$ and $240/60=4$. Ground speeds are $60/3=20$ and $48/4=12$. Use $x+y=20$ and $x-y=12$ to get $x=16$ and $y=4$. Check: $(16+4)*3=60$ and $(16-4)*4=48$."
          - problem: "A ferry log lists an upstream leg of 45 km taking 3 h and a downstream leg of 35 km taking 1 h. Its still-water speed and the current stay constant. Find (still-water speed, current speed) in km/h."
            answer: "(25, 10)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Divide distance by time first: $35/1=35$ and $45/3=15$. Then $x+y=35$ and $x-y=15$. Add and halve to get $x=25$; subtract and halve to get $y=10$. Check: $(25+10)*1=35$ and $(25-10)*3=45$."
        constraints: "distances divide evenly by the times"
      - id: kp3
        name: "Two travelers"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: "Two cars start 420 km apart and travel toward each other at constant speeds, meeting after 3 h. The faster speed exceeds the slower by 12 km/h. Find (faster, slower) in km/h."
            answer: "(76, 64)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The combined speed is $420/3=140$. With faster $x$, slower $y$, use $x+y=140$ and $x-y=12$. Add and halve to obtain $x=76$; then $y=64$. Check: $(76+64)*3=420$ and $76-64=12$."
          - problem: "Two trains start 660 km apart and move toward each other at constant speeds, meeting after 6 h. The faster train covers 108 km more than the slower during those 6 h. Find (faster, slower) in km/h."
            answer: "(64, 46)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Combined speed is $660/6=110$; the speed difference is $108/6=18$. Use $x+y=110$ and $x-y=18$ to get $x=64$ and $y=46$. Check: $(64+46)*6=660$ and $(64-46)*6=108$."
          - problem: "Two cyclists start 99 km apart and travel toward each other at constant speeds, meeting after 180 minutes. The faster speed exceeds the slower by 5 km/h. Find (faster, slower) in km/h."
            answer: "(19, 14)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Convert time: $180/60=3$ hours. Combined speed is $99/3=33$. Then $x+y=33$ and $x-y=5$, so $x=19$ and $y=14$. Check: $(19+14)*3=99$ and $19-14=5$."
          - problem: "Two walkers start 46 km apart and travel toward each other at constant speeds, meeting after 4 h. The faster speed is 25/21 times the slower speed. Find (faster, slower) in km/h."
            answer: "(25/4, 21/4)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Combined speed is $46/4=23/2$. With faster $x$, slower $y$, use $x+y=23/2$ and $21x=25y$. Substitute to get $46y/21=23/2$, hence $y=21/4$ and $x=25/4$. Check: $(25/4+21/4)*4=46$ and $21*(25/4)=25*(21/4)$."
        constraints: "meeting problems: combined speed = total distance / time"
    diagnostic_exemplar:
      problem: 'A rower goes $18$ km downstream in $2$ h and returns in $3$ h. Find the rowing speed and the current speed.'
      answer_contract: {kind: multipart, parts: [{name: rowing, contract: {kind: unit, quantity: speed, unit: km/h}}, {name: current, contract: {kind: unit, quantity: speed, unit: km/h}}]}
      answer: 'rowing = 7.5 km/h; current = 1.5 km/h'
      solution_sketch: 'Downstream $\frac{18}{2} = 9 = b + c$; upstream $\frac{18}{3} = 6 = b - c$; so $b = 7.5$ and $c = 1.5$.'
    anki_seeds:
      - front: "With a current or wind: downstream/tailwind speed = ___; upstream/headwind speed = ___."
        back: "b + c (sum); b - c (difference)"
        type: basic

  - id: systems-word-problems
    name: "Systems Word Problems"
    core: false                # word-problem genre; cone now supplemental
    difficulty: 0.58
    drill: false
    answer_kind: multi-step
    expected_time_secs: 165
    prerequisites:
      # the generic one-variable modelling capstone: every exemplar below is a
      # sentence-to-equation translation, generalised to two variables. It was
      # already an ancestor (via systems-rate-problems), so this edge adds no new
      # gate; it keeps translating-sentences-to-equations in the closure now that
      # the specialised money/rate feeders are supplemental.
      - id: equation-word-problems
        weight: 0.5
        key: true
      - id: systems-elimination
        weight: 0.4
        key: true
      - id: systems-substitution
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Set up two equations from a sum/difference"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: "Two numbers have sum $17$ and difference $5$. Define larger $x$, smaller $y$; find $(x,y)$."
            answer: "(11,6)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$x+y=17$ and $x-y=5$. Add to obtain $2x=22$, so $x=11$, $y=6$."
          - problem: "Two classes have $48$ students combined. Class X has $6$ more than class Y. Define their sizes $x,y$ and find $(x,y)$."
            answer: "(27,21)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$x+y=48$, $x-y=6$. Adding gives $2x=54$, hence $x=27$, $y=21$."
          - problem: "A table records total mass $25$ kg and heavier-minus-lighter mass $3$ kg. Define masses $x,y$ and find (heavier, lighter)."
            answer: "(14,11)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$x+y=25$, $x-y=3$; addition gives $2x=28$, so $x=14$, $y=11$."
          - problem: "A learner swaps sum and difference for two lengths totaling $30$ cm with difference $8$ cm. Define longer $x$, shorter $y$ and find $(x,y)$."
            answer: "(19,11)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$x+y=30$ and $x-y=8$, so $2x=38$; $x=19$ and $y=11$."
        constraints: "define two variables; one relationship per sentence"
      - id: kp2
        visuals: [{"kind":"geometry","figure":{"shape":"polygon","vertices":[{"x":"0","y":"0","label":"A"},{"x":"7","y":"0","label":"B"},{"x":"7","y":"4","label":"C"},{"x":"0","y":"4","label":"D"}],"right_angles":[0,1,2,3]},"caption":"Reference example: A reference rectangle has width 7 and height 4. Coordinates give the side lengths; this diagram is an independent example."}]
        name: "Geometry and age setups"
        key_prerequisites: [systems-substitution]
        exemplars:
          - problem: "A rectangle has perimeter $34$ cm and length $3$ cm more than width. Find (length, width) in cm."
            answer: "(10,7)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$2l+2w=34$ gives $l+w=17$; also $l-w=3$. Adding gives $l=10$, then $w=7$."
          - problem: "Two supplementary angles differ by $40$ degrees. Find (larger, smaller) in degrees."
            answer: "(110,70)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$a+b=180$ and $a-b=40$. Add to get $2a=220$, so $a=110$, $b=70$."
          - problem: "Two ages sum to $38$ years; one person is $12$ years older. Find (older, younger)."
            answer: "(25,13)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$a+b=38$, $a-b=12$. Add: $2a=50$; then $a=25$, $b=13$."
          - problem: "A learner treats complementary angles as totaling $180$. They differ by $10$ degrees. Find the correct (larger, smaller) angles."
            answer: "(50,40)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Complementary angles total $90$: $a+b=90$, $a-b=10$. Thus $2a=100$, giving $a=50$, $b=40$."
        constraints: "perimeter, supplementary/complementary angles, or ages"
      - id: kp3
        name: "Multi-relationship setups"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: "Two numbers sum to $23$; the first is twice the second plus $2$. Find (first, second)."
            answer: "(16,7)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$x+y=23$ and $x=2y+2$ give $3y+2=23$, so $y=7$, $x=16$."
          - problem: "A group has $35$ adults and children combined; there are $3$ more than three times as many children as adults. Find (adults, children)."
            answer: "(8,27)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$a+c=35$, $c=3a+3$. Then $4a+3=35$, so $a=8$, $c=27$."
          - problem: "Two tanks total $50$ L; tank A holds $5$ L less than four times tank B. Find (A, B) volumes."
            answer: "(39,11)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$a+b=50$, $a=4b-5$. Thus $5b-5=50$, giving $b=11$, $a=39$."
          - problem: "A learner multiplies the whole total by $2$ when one length is $2$ cm more than twice another and their sum is $20$ cm. Find (longer, shorter)."
            answer: "(14,6)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "$l+s=20$, $l=2s+2$. Substituting yields $3s+2=20$, so $s=6$, $l=14$."
        constraints: "one scaled relationship plus one sum; integer answers"
    diagnostic_exemplar:
      problem: 'The sum of two numbers is $28$; twice the larger minus the smaller is $23$. Find the numbers.'
      answer_contract: {kind: list, ordered: false, member: {kind: exact}}
      answer: '17 and 11'
      solution_sketch: '$x + y = 28$ and $2x - y = 23$; adding gives $3x = 51$, so $x = 17$ and $y = 11$.'
    anki_seeds:
      - front: "To set up a systems word problem: define ___ variables and write one equation per ___."
        back: "two; stated relationship"
        type: basic
