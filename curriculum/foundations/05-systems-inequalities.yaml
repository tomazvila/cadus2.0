            answer_contract: {"kind": "multipart", "parts": [{"name": "residuals", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "solution", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
          - problem: "Check the proposed point $(3,1)$ in $x=2y+2$ and $x-y=5$. Report residuals as the ordered pair of left-side-minus-right-side differences for each equation after substitution; report solution as yes or no."
