            answer: "(4,3)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "Substitute the fixed height: $x+6=10$, so $x=4$ and $y=3$."
          - problem: "A learner treats $x=3$ as horizontal when intersecting it with $y=-x+5$. Give the correct intersection."
            answer: "(3,2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: "The first line fixes $x=3$; substitution in the second gives $y=-3+5=2$."
        constraints: "standard form, slope-intercept, and horizontal/vertical lines"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"1","y":"3","label":"I"}],"segments":[{"from":{"x":"-2","y":"0","label":null},"to":{"x":"4","y":"6","label":null}},{"from":{"x":"-2","y":"6","label":null},"to":{"x":"4","y":"0","label":null}}],"caption":"Reference example: The reference lines y = x + 2 and y = -x + 4 intersect at I = (1,3). Only the displayed segments are drawn."}]
        name: "Confirm a graphical estimate algebraically"
