      - front: "Substitution method for a system of equations:"
        back: "solve one equation for a variable, substitute it into the other, solve, then back-substitute"
        type: basic

  - id: systems-substitution
    name: "Systems by Substitution"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: substitution-with-isolated-variable
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: true
      - id: distributive-property
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Isolate a variable, then substitute"
        key_prerequisites: [substitution-with-isolated-variable]
        exemplars:
          - problem: 'Solve the system $2x + y = 5$, $3x - y = 5$.'
            answer: "(2, 1)"
            answer_contract: {kind: exact}
            solution_sketch: '$y = 5 - 2x$; $3x - (5 - 2x) = 5$; $5x = 10$; $x = 2$; $y = 1$.'
          - problem: 'Solve the system $x + 2y = 11$, $x = y + 2$.'
            answer: "(5, 3)"
            answer_contract: {kind: exact}
            solution_sketch: '$(y + 2) + 2y = 11$; $3y = 9$; $y = 3$; $x = 5$.'
          - problem: 'Solve the system $3x + y = 11$, $2x - y = 4$.'
            answer: "(3, 2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$y = 11 - 3x$; $2x - (11 - 3x) = 4$; $5x = 15$; $x = 3$; $y = 2$.'
          - problem: 'Solve the system $x + 3y = 14$, $x = y + 2$.'
            answer: "(5, 3)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$(y + 2) + 3y = 14$; $4y = 12$; $y = 3$; $x = 5$.'
        constraints: "solve for the variable with coefficient 1; integer solutions"
      - id: kp2
        name: "Substitution with distribution"
        key_prerequisites: [distributive-property]
        exemplars:
          - problem: 'Solve the system $x = 2y + 1$, $3x - 4y = 7$.'
            answer: "(5, 2)"
            answer_contract: {kind: exact}
            solution_sketch: '$3(2y + 1) - 4y = 7$; $2y + 3 = 7$; $y = 2$; $x = 5$.'
          - problem: 'Solve the system $y = 2x - 3$, $4x - 3y = 5$.'
            answer: "(2, 1)"
            answer_contract: {kind: exact}
            solution_sketch: '$4x - 3(2x - 3) = 5$; $-2x + 9 = 5$; $x = 2$; $y = 1$.'
          - problem: 'Solve the system $x = 3y - 1$, $2x - 5y = 3$.'
            answer: "(14, 5)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$2(3y - 1) - 5y = 3$; $y - 2 = 3$; $y = 5$; $x = 14$.'
          - problem: 'Solve the system $y = 3x - 4$, $5x - 2y = 7$.'
            answer: "(1, -1)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$5x - 2(3x - 4) = 7$; $-x + 8 = 7$; $x = 1$; $y = -1$.'
        constraints: "distribute a coefficient over the substituted expression"
      - id: kp3
        name: "Careful sign handling"
        key_prerequisites: [substitution-with-isolated-variable]
        exemplars:
          - problem: 'Solve the system $x + y = 10$, $x - y = 4$.'
            answer: "(7, 3)"
            answer_contract: {kind: exact}
            solution_sketch: '$x = 10 - y$; $(10 - y) - y = 4$; $y = 3$; $x = 7$.'
          - problem: 'Solve the system $x - 2y = 1$, $2x + y = 12$.'
            answer: "(5, 2)"
            answer_contract: {kind: exact}
            solution_sketch: '$x = 1 + 2y$; $2(1 + 2y) + y = 12$; $5y = 10$; $y = 2$; $x = 5$.'
          - problem: 'Solve the system $x + y = 9$, $x - y = 3$.'
            answer: "(6, 3)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$x = 9 - y$; $(9 - y) - y = 3$; $y = 3$; $x = 6$.'
          - problem: 'Solve the system $x - 3y = 2$, $2x + y = 11$.'
            answer: "(5, 1)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$x = 2 + 3y$; $2(2 + 3y) + y = 11$; $7y = 7$; $y = 1$; $x = 5$.'
        constraints: "subtraction of substituted expressions; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve the system by substitution: $x + 3y = 13$ and $2x - y = 5$.'
      answer: '(4, 3)'
      solution_sketch: '$x = 13 - 3y$; $2(13 - 3y) - y = 5$; $7y = 21$; $y = 3$ and $x = 4$.'
    anki_seeds:
      - front: "When neither equation of a system has an isolated variable, isolate the variable whose coefficient is ___."
        back: "1 (or -1) — it avoids fractions"
        type: basic

  - id: elimination-with-addition
    name: "Elimination by Adding Equations"
    core: true
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: substitution-with-isolated-variable
        weight: 0.4
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: multi-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Add when coefficients are opposites"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Solve the system $x + y = 7$, $x - y = 3$.'
            answer: "(5, 2)"
            answer_contract: {kind: exact}
            solution_sketch: 'Add: $2x = 10$; $x = 5$; $y = 2$.'
          - problem: 'Solve the system $2x + y = 8$, $3x - y = 7$.'
            answer: "(3, 2)"
            answer_contract: {kind: exact}
            solution_sketch: 'Add: $5x = 15$; $x = 3$; $y = 2$.'
          - problem: 'Solve the system $x + y = 9$, $x - y = 5$.'
            answer: "(7, 2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add: $2x = 14$; $x = 7$; $y = 2$.'
          - problem: 'Solve the system $3x + y = 13$, $2x - y = 7$.'
            answer: "(4, 1)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add: $5x = 20$; $x = 4$; $y = 1$.'
        constraints: "coefficients already opposite; integer solutions"
      - id: kp2
        name: "Subtract when coefficients are equal"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Solve the system $x + 2y = 7$, $x + y = 4$.'
            answer: "(1, 3)"
            answer_contract: {kind: exact}
            solution_sketch: 'Subtract: $y = 3$; then $x = 1$.'
          - problem: 'Solve the system $3x + y = 11$, $x + y = 5$.'
            answer: "(3, 2)"
            answer_contract: {kind: exact}
            solution_sketch: 'Subtract: $2x = 6$; $x = 3$; $y = 2$.'
          - problem: 'Solve the system $x + 3y = 10$, $x + y = 6$.'
            answer: "(4, 2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract: $2y = 4$; $y = 2$; $x = 4$.'
          - problem: 'Solve the system $4x + y = 15$, $x + y = 6$.'
            answer: "(3, 3)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract: $3x = 9$; $x = 3$; $y = 3$.'
        constraints: "matching coefficients; subtract carefully"
      - id: kp3
        name: "Back-substitute and verify"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Solve the system $2x + y = 10$, $x - y = 2$ and check.'
            answer: "(4, 2)"
            answer_contract: {kind: exact}
            solution_sketch: 'Add: $3x = 12$; $x = 4$; $y = 2$; check $8 + 2 = 10$ and $4 - 2 = 2$.'
          - problem: 'Solve the system $x + y = 6$, $x - y = 8$ and check.'
            answer: "(7, -1)"
            answer_contract: {kind: exact}
            solution_sketch: 'Add: $2x = 14$; $x = 7$; $y = -1$; check $7 + (-1) = 6$ and $7 - (-1) = 8$.'
          - problem: 'Solve the system $3x + y = 14$, $x - y = 2$ and check.'
            answer: "(4, 2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add: $4x = 16$; $x = 4$; $y = 2$; check $12 + 2 = 14$ and $4 - 2 = 2$.'
          - problem: 'Solve the system $x + y = 5$, $x - y = 9$ and check.'
            answer: "(7, -2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add: $2x = 14$; $x = 7$; $y = -2$; check $7 + (-2) = 5$ and $7 - (-2) = 9$.'
        constraints: "solutions may include negatives; verify in both equations"
    diagnostic_exemplar:
      problem: 'Solve by elimination: $3x + y = 5$ and $x + y = 7$.'
      answer: '(-1, 8)'
      solution_sketch: 'Subtract the equations: $2x = -2$, so $x = -1$ and $y = 8$.'
    anki_seeds:
      - front: "Eliminate a variable by adding when its coefficients are ___, or subtracting when they are ___."
        back: "opposites; equal"
        type: basic

  - id: systems-elimination
    name: "Systems by Elimination"
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: multi-step
    expected_time_secs: 130
    prerequisites:
      - id: elimination-with-addition
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.4
      - id: distributive-property
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Scale one equation first"
        key_prerequisites: [elimination-with-addition]
        exemplars:
          - problem: 'Solve the system $2x + 3y = 12$, $x + y = 5$.'
            answer: "(3, 2)"
            answer_contract: {kind: exact}
            solution_sketch: 'Multiply 2nd by $-2$: $-2x - 2y = -10$; add: $y = 2$; $x = 3$.'
          - problem: 'Solve the system $x + 2y = 11$, $3x - y = 5$.'
            answer: "(3, 4)"
            answer_contract: {kind: exact}
            solution_sketch: 'Multiply 1st by $-3$: $-3x - 6y = -33$; add 2nd: $-7y = -28$; $y = 4$; $x = 3$.'
          - problem: 'Solve the system $3x + 2y = 16$, $x + y = 6$.'
            answer: "(4, 2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply 2nd by $-2$: $-2x - 2y = -12$; add: $x = 4$; $y = 2$.'
          - problem: 'Solve the system $x + 3y = 13$, $2x - y = 5$.'
            answer: "(4, 3)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply 1st by $-2$: $-2x - 6y = -26$; add 2nd: $-7y = -21$; $y = 3$; $x = 4$.'
        constraints: "scale to create opposite coefficients; integer solutions"
      - id: kp2
        name: "Scale both equations"
        key_prerequisites: [elimination-with-addition]
        exemplars:
          - problem: 'Solve the system $2x + 3y = 7$, $3x + 2y = 8$.'
            answer: "(2, 1)"
            answer_contract: {kind: exact}
            solution_sketch: '$\times 3$ and $\times 2$: $6x + 9y = 21$, $6x + 4y = 16$; subtract: $5y = 5$; $y = 1$; $x = 2$.'
          - problem: 'Solve the system $3x + 4y = 10$, $2x + 3y = 7$.'
            answer: "(2, 1)"
            answer_contract: {kind: exact}
            solution_sketch: '$\times 2$ and $\times 3$: $6x + 8y = 20$, $6x + 9y = 21$; subtract: $y = 1$; $x = 2$.'
          - problem: 'Solve the system $3x + 2y = 16$, $2x + 3y = 19$.'
            answer: "(2, 5)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\times 3$ and $\times 2$: $9x + 6y = 48$, $4x + 6y = 38$; subtract: $5x = 10$; $x = 2$; $y = 5$.'
          - problem: 'Solve the system $2x + 3y = 16$, $3x + 2y = 19$.'
            answer: "(5, 2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\times 3$ and $\times 2$: $6x + 9y = 48$, $6x + 4y = 38$; subtract: $5y = 10$; $y = 2$; $x = 5$.'
        constraints: "scale both to match one variable; integer solutions"
      - id: kp3
        name: "Use a negative multiplier"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Solve the system $2x + 5y = 16$, $4x + 3y = 18$.'
            answer: "(3, 2)"
            answer_contract: {kind: exact}
            solution_sketch: 'Multiply 1st by $-2$: $-4x - 10y = -32$; add: $-7y = -14$; $y = 2$; $x = 3$.'
          - problem: 'Solve the system $3x + 2y = 13$, $x + 4y = 11$.'
            answer: "(3, 2)"
            answer_contract: {kind: exact}
            solution_sketch: 'Multiply 2nd by $-3$: $-3x - 12y = -33$; add: $-10y = -20$; $y = 2$; $x = 3$.'
          - problem: 'Solve the system $2x + 3y = 18$, $4x + 7y = 40$.'
            answer: "(3, 4)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply 1st by $-2$: $-4x - 6y = -36$; add: $y = 4$; $x = 3$.'
          - problem: 'Solve the system $3x + 2y = 14$, $9x + 5y = 41$.'
            answer: "(4, 1)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply 1st by $-3$: $-9x - 6y = -42$; add: $-y = -1$; $y = 1$; $x = 4$.'
        constraints: "negative multipliers turn subtraction into addition"
    diagnostic_exemplar:
      problem: 'Solve the system by elimination: $3x + 2y = 12$ and $2x + 3y = 13$.'
      answer: '(2, 3)'
      solution_sketch: 'Scale both: $9x + 6y = 36$ and $4x + 6y = 26$; subtract: $5x = 10$.'
    anki_seeds:
      - front: "Elimination method for a system of equations:"
        back: "scale one or both equations so a variable's coefficients are opposites, add to eliminate it, solve, then back-substitute"
        type: basic

  - id: systems-special-cases
    name: "Systems with No or Infinitely Many Solutions"
    core: true
    difficulty: 0.54
    drill: false
    answer_kind: expression
    expected_time_secs: 100
    prerequisites:
      - id: systems-elimination
        weight: 0.6
        key: true
      - id: slope-intercept-form
        weight: 0.5
        key: true
      - id: slopes-of-parallel-perpendicular-lines
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Detect special cases algebraically"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'Solve the system $x + y = 3$, $x + y = 7$.'
            answer: "no solution"
            answer_contract: {"kind":"label","options":[["no solution"]]}
            solution_sketch: 'Subtracting gives $0 = 4$, a contradiction.'
          - problem: 'Solve the system $2x + 2y = 8$, $x + y = 4$.'
            answer: "infinitely many solutions"
            answer_contract: {"kind":"label","options":[["infinitely many solutions"]]}
            solution_sketch: 'The first is twice the second; elimination gives $0 = 0$.'
          - problem: 'Solve the system $x + y = 5$, $x + y = 9$.'
            answer: "no solution"
            answer_contract: {"kind":"label","options":[["no solution"]]}
            solution_sketch: 'Subtracting gives $0 = 4$, a contradiction.'
          - problem: 'Solve the system $3x + 3y = 12$, $x + y = 4$.'
            answer: "infinitely many solutions"
            answer_contract: {"kind":"label","options":[["infinitely many solutions"]]}
            solution_sketch: 'The first is three times the second; elimination gives $0 = 0$.'
        constraints: "elimination ends in a false statement (none) or 0 = 0 (infinite)"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[],"segments":[{"from":{"x":"-2","y":"-2","label":null},"to":{"x":"2","y":"4","label":null}},{"from":{"x":"-2","y":"-5","label":null},"to":{"x":"2","y":"1","label":null}}],"caption":"Reference example: The reference lines y = (3/2)x + 1 and y = (3/2)x - 2 have equal slopes and distinct intercepts."}]
        name: "Detect special cases from slopes and graphs"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'How many solutions does the system $y = 2x + 1$, $y = 2x - 3$ have?'
            answer: "none"
            answer_contract: {"kind":"label","options":[["none"]]}
            solution_sketch: 'Equal slopes, different intercepts $\to$ parallel.'
          - problem: 'How many solutions does the system $y = x + 2$, $2y = 2x + 4$ have?'
            answer: "infinitely many"
            answer_contract: {"kind":"label","options":[["infinitely many"]]}
            solution_sketch: 'Same line.'
          - problem: 'How many solutions does the system $y = 4x + 2$, $y = 4x - 1$ have?'
            answer: "none"
            answer_contract: {"kind":"label","options":[["none"]]}
            solution_sketch: 'Equal slopes, different intercepts.'
          - problem: 'How many solutions does the system $y = 3x - 1$, $2y = 6x - 2$ have?'
            answer: "infinitely many"
            answer_contract: {"kind":"label","options":[["infinitely many"]]}
            solution_sketch: 'Same line.'
        constraints: "parallel -> none; same line -> infinitely many; else one"
      - id: kp3
        name: "Classify one / none / infinitely many"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'How many solutions does the system $y = 3x + 1$, $y = 2x + 1$ have?'
            answer: "exactly one"
            answer_contract: {"kind":"label","options":[["exactly one"]]}
            solution_sketch: 'Different slopes, so the lines cross once (at $(0, 1)$).'
          - problem: 'How many solutions does the system $6x - 2y = 10$, $3x - y = 5$ have?'
            answer: "infinitely many"
            answer_contract: {"kind":"label","options":[["infinitely many"]]}
            solution_sketch: 'The first is twice the second: the same line.'
          - problem: 'How many solutions does the system $y = 2x + 5$, $y = -x + 5$ have?'
            answer: "exactly one"
            answer_contract: {"kind":"label","options":[["exactly one"]]}
            solution_sketch: 'Different slopes, so the lines cross once (at $(0, 5)$).'
          - problem: 'How many solutions does the system $y = 5x - 2$, $y = 5x + 3$ have?'
            answer: "no solution"
            answer_contract: {"kind":"label","options":[["no solution"]]}
            solution_sketch: 'Equal slopes, different intercepts: the lines are parallel and never meet.'
        constraints: "mix all three cases across generated problems"
    diagnostic_exemplar:
      problem: 'How many solutions does the system $4x - 2y = 6$, $2x - y = 3$ have?'
      answer_contract: {kind: label, options: [['no solutions', 'none'], ['one solution', 'one'], ['infinitely many', 'infinite']]}
      answer: 'infinitely many'
      solution_sketch: 'Doubling the second equation gives the first: the two equations describe the same line.'
    anki_seeds:
      - front: "Graphically, a system of two lines has no solution when ___ and infinitely many when ___."
        back: "the lines are parallel (equal slope, different intercept); the lines are identical"
        type: basic

  - id: systems-of-linear-inequalities
    name: "Systems of Linear Inequalities"
    core: false               # supplemental, like its graphing prerequisites
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: graphing-linear-inequalities
        weight: 0.7
        key: true
      - id: graphing-systems
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Check a point against both inequalities"
        key_prerequisites: [graphing-linear-inequalities]
        exemplars:
          - problem: 'Is $(1, 1)$ a solution of the system $y \le x + 2$ and $y > -x$?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$1 \le 3$ and $1 > -1$ both hold.'
          - problem: 'Is $(0, 4)$ a solution of the system $y < 2x + 1$ and $y \ge x$?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$4 < 1$ fails.'
          - problem: 'Is $(2, 0)$ a solution of the system $y \le x + 1$ and $y > -x$?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$0 \le 3$ and $0 > -2$ both hold.'
          - problem: 'Is $(0, 5)$ a solution of the system $y < 2x + 1$ and $y \ge x$?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$5 < 1$ fails.'
        constraints: "the point must satisfy BOTH inequalities"
      - id: kp2
        name: "Boundary styles and the overlap region"
        key_prerequisites: [graphing-linear-inequalities]
        exemplars:
          - problem: 'For the system $y \le 2x + 1$, $y > -x + 4$, which boundary line is dashed?'
            answer: "y = -x + 4 (the strict one)"
            answer_contract: {"kind":"label","options":[["y = -x + 4 (the strict one)"]]}
            solution_sketch: 'A strict inequality ($>$ or $<$) draws a dashed line.'
          - problem: 'For the system $y \le -x + 5$, $y > 2x - 3$, what is the solution region?'
            answer: "the overlap (intersection) of the two shaded half-planes"
            answer_contract: {"kind":"label","options":[["the overlap (intersection) of the two shaded half-planes"]]}
            solution_sketch: 'One inclusive boundary ($\le$), one strict ($>$); a point solves the system only in the overlap.'
          - problem: 'For the system $y \le 3x - 1$, $y > -2x + 5$, which boundary line is dashed?'
            answer: "y = -2x + 5 (the strict one)"
            answer_contract: {"kind":"label","options":[["y = -2x + 5 (the strict one)"]]}
            solution_sketch: 'A strict inequality ($>$ or $<$) draws a dashed line.'
          - problem: 'For the system $y \ge x - 2$, $y < -x + 6$, which boundary line is dashed?'
            answer: "y = -x + 6 (the strict one)"
            answer_contract: {"kind":"label","options":[["y = -x + 6 (the strict one)"]]}
            solution_sketch: 'A strict inequality ($>$ or $<$) draws a dashed line.'
        constraints: "one strict and one inclusive inequality per problem"
      - id: kp3
        name: "Locate a point in the solution region"
        key_prerequisites: [graphing-linear-inequalities]
        exemplars:
          - problem: 'Which of $(0, 2)$ or $(2, 0)$ satisfies both $y > x$ and $y < x + 4$?'
            answer: "(0, 2)"
            solution_sketch: '$2 > 0$ and $2 < 4$; the other point fails $y > x$.'
          - problem: 'Does the origin satisfy the system $y \ge x - 3$ and $y \le -x + 5$?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$0 \ge -3$ and $0 \le 5$.'
          - problem: 'Which of $(1, 0)$ or $(0, 1)$ satisfies both $y > x$ and $y < x + 3$?'
            answer: "(0, 1)"
            solution_sketch: '$1 > 0$ and $1 < 3$; the other point fails $y > x$.'
          - problem: 'Does the origin satisfy the system $y \ge x - 5$ and $y \le -x + 6$?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$0 \ge -5$ and $0 \le 6$.'
        constraints: "candidate points off the boundary lines"
    diagnostic_exemplar:
      problem: 'Is $(2, 3)$ a solution of the system $y > x$ and $y \le 2x$?'
      answer_contract: {kind: label, options: [[yes], [no]]}
      answer: "yes"
      solution_sketch: '$3 > 2$ and $3 \le 4$ both hold.'
    anki_seeds:
      - front: "The solution of a system of linear inequalities is the ___ of the individual shaded regions."
        back: "intersection (overlap)"
        type: basic

  - id: systems-money-problems
    name: "Money and Ticket Systems"
    # over-coverage: coin/ticket context schema for systems-substitution +
    # systems-elimination; the technique, not the context, is the prerequisite
    core: false
    difficulty: 0.54
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: systems-substitution
        weight: 0.5
        key: true
      - id: systems-elimination
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Count equation plus value equation"
        key_prerequisites: [systems-substitution]
        exemplars:
          - problem: 'Adult tickets cost €8 and child tickets €5. Ten tickets sold for €68. How many of each?'
            answer: "6 adult and 4 child"
            answer_contract: {"kind":"label","options":[["6 adult and 4 child"]]}
            solution_sketch: '$a + c = 10$, $8a + 5c = 68$; $a = 6$, $c = 4$.'
          - problem: 'A jar has $5$-cent and $10$-cent coins: $12$ coins worth $95$ cents. How many of each?'
            answer: "5 five-cent and 7 ten-cent coins"
            answer_contract: {"kind":"label","options":[["5 five-cent and 7 ten-cent coins"]]}
            solution_sketch: '$n + d = 12$, $5n + 10d = 95$; $n = 5$, $d = 7$.'
          - problem: 'Adult tickets cost €9 and child tickets €4. Twelve tickets sold for €78. How many of each?'
            answer: "6 adult and 6 child"
            answer_contract: {"kind":"label","options":[["6 adult and 6 child"]]}
            solution_sketch: '$a + c = 12$, $9a + 4c = 78$; $a = 6$, $c = 6$.'
          - problem: 'A jar has $5$-cent and $10$-cent coins: $10$ coins worth $70$ cents. How many of each?'
            answer: "6 five-cent and 4 ten-cent coins"
            answer_contract: {"kind":"label","options":[["6 five-cent and 4 ten-cent coins"]]}
            solution_sketch: '$n + d = 10$, $5n + 10d = 70$; $n = 6$, $d = 4$.'
        constraints: "one count equation and one value equation"
      - id: kp2
        name: "Two-item purchase problems"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: '$3$ pens and $2$ notebooks cost €12; $1$ pen and $2$ notebooks cost €8. Find each price.'
            answer: "pens €2, notebooks €3"
            answer_contract: {"kind":"label","options":[["pens \u20ac2, notebooks \u20ac3"]]}
            solution_sketch: 'Subtract: $2p = 4$; $p = 2$; $n = 3$.'
          - problem: '$2$ burgers and $1$ portion of chips cost €11; $1$ burger and $1$ portion of chips cost €7. Find each price.'
            answer: "burgers €4, chips €3"
            answer_contract: {"kind":"label","options":[["burgers \u20ac4, chips \u20ac3"]]}
            solution_sketch: 'Subtract: $b = 4$; $f = 3$.'
          - problem: '$4$ pens and $3$ notebooks cost €17; $2$ pens and $3$ notebooks cost €13. Find each price.'
            answer: "pens €2, notebooks €3"
            answer_contract: {"kind":"label","options":[["pens \u20ac2, notebooks \u20ac3"]]}
            solution_sketch: 'Subtract: $2p = 4$; $p = 2$; $n = 3$.'
          - problem: '$3$ burgers and $2$ portions of chips cost €16; $1$ burger and $2$ portions of chips cost €8. Find each price.'
            answer: "burgers €4, chips €2"
            answer_contract: {"kind":"label","options":[["burgers \u20ac4, chips \u20ac2"]]}
            solution_sketch: 'Subtract: $2b = 8$; $b = 4$; $f = 2$.'
        constraints: "two purchases of the same two items; elimination-friendly numbers"
      - id: kp3
        name: "Solve and verify in context"
        key_prerequisites: [systems-substitution]
        exemplars:
          - problem: 'Adult tickets cost €10 and student tickets €6. Fifteen tickets sold for €110. How many adult tickets?'
            answer: "5"
            solution_sketch: '$a + s = 15$, $10a + 6s = 110$; $4a = 20$; $a = 5$.'
          - problem: 'A purse has $20$-cent and $5$-cent coins: $9$ coins worth €1.50. How many are $20$-cent coins?'
            answer: "7"
            solution_sketch: '$t + f = 9$, $20t + 5f = 150$; $15t = 105$; $t = 7$.'
          - problem: 'Adult tickets cost €12 and student tickets €7. Twenty tickets sold for €205. How many adult tickets?'
            answer: "13"
            solution_sketch: '$a + s = 20$, $12a + 7s = 205$; $5a = 65$; $a = 13$, $s = 7$, both nonnegative; check $13 + 7 = 20$ tickets and $12(13) + 7(7) = 205$.'
          - problem: 'A purse has $25$-cent and $10$-cent coins: $12$ coins worth €2.10. How many are $25$-cent coins?'
            answer: "6"
            solution_sketch: '$t + f = 12$, $25t + 10f = 210$; $15t = 90$; $t = 6$, $f = 6$, both nonnegative; check $6 + 6 = 12$ coins and $25(6) + 10(6) = 210$ cents.'
        constraints: "verify counts are nonnegative integers and totals match"
    diagnostic_exemplar:
      problem: '$2$ coffees and $3$ buns cost €12; $1$ coffee and $2$ buns cost €7. What is the price of one coffee in euros?'
      answer: '3'
      solution_sketch: '$2c + 3b = 12$ and $c + 2b = 7$; eliminating $c$ gives $b = 2$, so $c = 3$.'
    anki_seeds:
      - front: "Money/ticket system setup: one equation counts the ___, the other totals the ___."
        back: "items; value (money)"
        type: basic

  - id: systems-mixture-problems
    name: "Mixture Systems"
    # over-coverage: acid/coffee-blend context schema — the percent-weighted
    # presentation of systems-money-problems, no new technique
    core: false
    difficulty: 0.56
    drill: false
    answer_kind: multi-step
    expected_time_secs: 170
    prerequisites:
      - id: systems-money-problems
        weight: 0.7
        key: true
      - id: percentages
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Set up the amount and value equations"
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'Mixing $x$ L of $10\%$ acid with $y$ L of $50\%$ acid to get $15$ L of $30\%$ acid: give both equations.'
            answer: "x + y = 15 and 0.10x + 0.50y = 4.5"
            answer_contract: {"kind":"label","options":[["x + y = 15 and 0.10x + 0.50y = 4.5"],["x + y = 15 and 0.10x + 0.50y = 15"],["x + y = 4.5 and 0.10x + 0.50y = 15"]]}
            solution_sketch: 'Amounts sum to $15$; pure acid sums to $0.30(15) = 4.5$.'
          - problem: 'Mixing $x$ L of $25\%$ acid with $y$ L of $60\%$ acid to get $20$ L of $40\%$ acid: give both equations.'
            answer: "x + y = 20 and 0.25x + 0.60y = 8"
            answer_contract: {"kind":"label","options":[["x + y = 20 and 0.25x + 0.60y = 8"]]}
            solution_sketch: 'Amounts sum to $20$; pure acid sums to $0.40(20) = 8$.'
          - problem: 'Mixing $x$ L of $20\%$ acid with $y$ L of $80\%$ acid to get $10$ L of $50\%$ acid: give both equations.'
            answer: "x + y = 10 and 0.20x + 0.80y = 5"
            answer_contract: {"kind":"label","options":[["x + y = 10 and 0.20x + 0.80y = 5"],["x + y = 10 and 0.20x + 0.80y = 10"],["x + y = 5 and 0.20x + 0.80y = 10"]]}
            solution_sketch: 'Amounts sum to $10$; pure acid sums to $0.50(10) = 5$.'
          - problem: 'Mixing $x$ L of $30\%$ acid with $y$ L of $70\%$ acid to get $16$ L of $50\%$ acid: give both equations.'
            answer: "x + y = 16 and 0.30x + 0.70y = 8"
            answer_contract: {"kind":"label","options":[["x + y = 16 and 0.30x + 0.70y = 8"]]}
            solution_sketch: 'Amounts sum to $16$; pure acid sums to $0.50(16) = 8$.'
        constraints: "amount equation plus concentration (pure-substance) equation"
      - id: kp2
        name: "Percent-solution mixtures"
        key_prerequisites: [systems-money-problems]
        exemplars:
          - problem: 'How many liters of $20\%$ acid and $50\%$ acid make $30$ L of $30\%$ acid?'
            answer: "20 L of 20% and 10 L of 50%"
            answer_contract: {"kind":"label","options":[["20 L of 20% and 10 L of 50%"]]}
            solution_sketch: '$x + y = 30$, $0.2x + 0.5y = 9$; $0.2x + 0.5(30 - x) = 9$; $x = 20$.'
          - problem: 'How many liters of $10\%$ and $40\%$ saline make $12$ L of $20\%$ saline?'
            answer: "8 L of 10% and 4 L of 40%"
            answer_contract: {"kind":"label","options":[["8 L of 10% and 4 L of 40%"]]}
            solution_sketch: '$x + y = 12$, $0.1x + 0.4y = 2.4$; $x = 8$, $y = 4$.'
          - problem: 'How many liters of $10\%$ acid and $40\%$ acid make $18$ L of $20\%$ acid?'
            answer: "12 L of 10% and 6 L of 40%"
            answer_contract: {"kind":"label","options":[["12 L of 10% and 6 L of 40%"]]}
            solution_sketch: '$x + y = 18$, $0.1x + 0.4y = 3.6$; $x = 12$, $y = 6$.'
          - problem: 'How many liters of $15\%$ and $45\%$ saline make $10$ L of $30\%$ saline?'
            answer: "5 L of 15% and 5 L of 45%"
            answer_contract: {"kind":"label","options":[["5 L of 15% and 5 L of 45%"]]}
            solution_sketch: '$x + y = 10$, $0.15x + 0.45y = 3$; $x = 5$, $y = 5$.'
        constraints: "target strength strictly between the two ingredient strengths"
      - id: kp3
        name: "Price-blend mixtures"
        key_prerequisites: [systems-money-problems]
        exemplars:
          - problem: 'Coffee at €8/kg is blended with coffee at €12/kg to make $10$ kg worth €9/kg. How much of each?'
            answer: "7.5 kg of €8 coffee and 2.5 kg of €12 coffee"
            answer_contract: {"kind":"label","options":[["7.5 kg of \u20ac8 coffee and 2.5 kg of \u20ac12 coffee"]]}
            solution_sketch: '$x + y = 10$, $8x + 12y = 90$; $4y = 10$; $y = 2.5$.'
          - problem: 'Nuts at €6/kg are mixed with raisins at €3/kg to make $9$ kg costing €36. How much of each?'
            answer: "3 kg nuts and 6 kg raisins"
            answer_contract: {"kind":"label","options":[["3 kg nuts and 6 kg raisins"]]}
            solution_sketch: '$n + r = 9$, $6n + 3r = 36$; $3n = 9$; $n = 3$.'
          - problem: 'Coffee at €6/kg is blended with coffee at €10/kg to make $8$ kg worth €7/kg. How much of each?'
            answer: "6 kg of €6 coffee and 2 kg of €10 coffee"
            answer_contract: {"kind":"label","options":[["6 kg of \u20ac6 coffee and 2 kg of \u20ac10 coffee"]]}
            solution_sketch: '$x + y = 8$, $6x + 10y = 56$; $4x = 24$; $x = 6$; $y = 2$.'
          - problem: 'Almonds at €8/kg are mixed with raisins at €4/kg to make $6$ kg costing €30. How much of each?'
            answer: "1.5 kg almonds and 4.5 kg raisins"
            answer_contract: {"kind":"label","options":[["1.5 kg almonds and 4.5 kg raisins"]]}
            solution_sketch: '$n + r = 6$, $8n + 4r = 30$; $4n = 6$; $n = 1.5$; $r = 4.5$.'
        constraints: "blend price between the two ingredient prices; halves allowed"
    diagnostic_exemplar:
      problem: 'How many liters each of $10\%$ and $30\%$ solution make $8$ L of $25\%$ solution?'
      answer_contract: {kind: multipart, parts: [{name: 10_percent, contract: {kind: unit, quantity: volume, unit: L}}, {name: 30_percent, contract: {kind: unit, quantity: volume, unit: L}}]}
      answer: "10_percent = 2 L; 30_percent = 6 L"
      solution_sketch: '$x + y = 8$, $0.1x + 0.3y = 2$; $0.1x + 0.3(8 - x) = 2$; $0.2x = 0.4$; $x = 2$.'
    anki_seeds:
      - front: "Mixture system: amount equation x + y = total; the second equation totals the ___."
        back: "pure substance (or value): (conc1)x + (conc2)y = (target conc)(total)"
        type: basic

  - id: systems-rate-problems
    name: "Rate Systems (Current and Wind)"
    # over-coverage: current/wind and meeting-problem context schema for
    # systems-elimination; d = rt dressing, no new solving technique
    core: false
    difficulty: 0.57
    drill: false
    answer_kind: multi-step
    expected_time_secs: 170
    prerequisites:
      - id: systems-elimination
        weight: 0.6
        key: true
      - id: systems-substitution
        weight: 0.4
      - id: equation-word-problems
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Current and wind: sum and difference"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'A boat travels $12$ km/h downstream and $8$ km/h upstream. Find the boat speed and current speed.'
            answer: "boat 10 km/h, current 2 km/h"
            answer_contract: {"kind":"label","options":[["boat 10 km/h, current 2 km/h"]]}
            solution_sketch: '$b + c = 12$, $b - c = 8$; $b = 10$, $c = 2$.'
          - problem: 'A plane flies $500$ km/h with the wind and $460$ km/h against it. Find the plane speed and wind speed.'
            answer: "plane 480 km/h, wind 20 km/h"
            answer_contract: {"kind":"label","options":[["plane 480 km/h, wind 20 km/h"]]}
            solution_sketch: '$p + w = 500$, $p - w = 460$; $p = 480$, $w = 20$.'
          - problem: 'A boat travels $15$ km/h downstream and $9$ km/h upstream. Find the boat speed and current speed.'
            answer: "boat 12 km/h, current 3 km/h"
            answer_contract: {"kind":"label","options":[["boat 12 km/h, current 3 km/h"]]}
            solution_sketch: '$b + c = 15$, $b - c = 9$; $b = 12$, $c = 3$.'
          - problem: 'A plane flies $540$ km/h with the wind and $460$ km/h against it. Find the plane speed and wind speed.'
            answer: "plane 500 km/h, wind 40 km/h"
            answer_contract: {"kind":"label","options":[["plane 500 km/h, wind 40 km/h"]]}
            solution_sketch: '$p + w = 540$, $p - w = 460$; $p = 500$, $w = 40$.'
        constraints: "downstream = sum, upstream = difference of the two rates"
      - id: kp2
        name: "Compute the two speeds from d = rt first"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'A kayaker paddles $12$ km downstream in $2$ h and back in $3$ h. Find the kayak and current speeds.'
            answer: "kayak 5 km/h, current 1 km/h"
            answer_contract: {"kind":"label","options":[["kayak 5 km/h, current 1 km/h"]]}
            solution_sketch: 'Speeds $\frac{12}{2} = 6$ and $\frac{12}{3} = 4$; $b + c = 6$, $b - c = 4$.'
          - problem: 'A plane flies $1200$ km with the wind in $4$ h and back in $5$ h. Find the plane and wind speeds.'
            answer: "plane 270 km/h, wind 30 km/h"
            answer_contract: {"kind":"label","options":[["plane 270 km/h, wind 30 km/h"]]}
            solution_sketch: 'Speeds $300$ and $240$; $p + w = 300$, $p - w = 240$.'
          - problem: 'A kayaker paddles $20$ km downstream in $2$ h and back in $4$ h. Find the kayak and current speeds.'
            answer: "kayak 7.5 km/h, current 2.5 km/h"
            answer_contract: {"kind":"label","options":[["kayak 7.5 km/h, current 2.5 km/h"]]}
            solution_sketch: 'Speeds $10$ and $5$; $b + c = 10$, $b - c = 5$.'
          - problem: 'A plane flies $600$ km with the wind in $2$ h and back in $3$ h. Find the plane and wind speeds.'
            answer: "plane 250 km/h, wind 50 km/h"
            answer_contract: {"kind":"label","options":[["plane 250 km/h, wind 50 km/h"]]}
            solution_sketch: 'Speeds $300$ and $200$; $p + w = 300$, $p - w = 200$.'
        constraints: "distances divide evenly by the times"
      - id: kp3
        name: "Two travelers"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'Two cars $300$ km apart drive toward each other and meet in $3$ h. One is $20$ km/h faster. Find both speeds.'
            answer: "60 km/h and 40 km/h"
            answer_contract: {"kind":"label","options":[["60 km/h and 40 km/h"]]}
            solution_sketch: 'Combined speed $\frac{300}{3} = 100$; $r_1 + r_2 = 100$, $r_1 - r_2 = 20$.'
          - problem: 'Two trains leave stations $450$ km apart toward each other and meet in $5$ h. Their speeds differ by $10$ km/h. Find both.'
            answer: "50 km/h and 40 km/h"
            answer_contract: {"kind":"label","options":[["50 km/h and 40 km/h"]]}
            solution_sketch: 'Combined speed $90$; sum $90$, difference $10$.'
          - problem: 'Two cars $280$ km apart drive toward each other and meet in $4$ h. One is $10$ km/h faster. Find both speeds.'
            answer: "40 km/h and 30 km/h"
            answer_contract: {"kind":"label","options":[["40 km/h and 30 km/h"]]}
            solution_sketch: 'Combined speed $\frac{280}{4} = 70$; $r_1 + r_2 = 70$, $r_1 - r_2 = 10$.'
          - problem: 'Two trains leave stations $440$ km apart toward each other and meet in $4$ h. Their speeds differ by $10$ km/h. Find both.'
            answer: "60 km/h and 50 km/h"
            answer_contract: {"kind":"label","options":[["60 km/h and 50 km/h"]]}
            solution_sketch: 'Combined speed $110$; sum $110$, difference $10$.'
        constraints: "meeting problems: combined speed = total distance / time"
    diagnostic_exemplar:
      problem: 'A rower goes $18$ km downstream in $2$ h and returns in $3$ h. Find the rowing speed and the current speed.'
      answer_contract: {kind: multipart, parts: [{name: rowing, contract: {kind: unit, quantity: speed, unit: km/h}}, {name: current, contract: {kind: unit, quantity: speed, unit: km/h}}]}
      answer: 'rowing = 7.5 km/h; current = 1.5 km/h'
      solution_sketch: 'Downstream $\frac{18}{2} = 9 = b + c$; upstream $\frac{18}{3} = 6 = b - c$; so $b = 7.5$ and $c = 1.5$.'
    anki_seeds:
      - front: "With a current or wind: downstream/tailwind speed = ___; upstream/headwind speed = ___."
        back: "b + c (sum); b - c (difference)"
        type: basic

  - id: systems-word-problems
    name: "Systems Word Problems"
    core: false                # word-problem genre; cone now supplemental
    difficulty: 0.58
    drill: false
    answer_kind: multi-step
    expected_time_secs: 165
    prerequisites:
      # the generic one-variable modelling capstone: every exemplar below is a
      # sentence-to-equation translation, generalised to two variables. It was
      # already an ancestor (via systems-rate-problems), so this edge adds no new
      # gate; it keeps translating-sentences-to-equations in the closure now that
      # the specialised money/rate feeders are supplemental.
      - id: equation-word-problems
        weight: 0.5
        key: true
      - id: systems-elimination
        weight: 0.4
        key: true
      - id: systems-substitution
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Set up two equations from a sum/difference"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'The sum of two numbers is $20$ and their difference is $6$. Find the numbers.'
            answer: "13 and 7"
            answer_contract: {"kind":"label","options":[["13 and 7"]]}
            solution_sketch: '$x + y = 20$, $x - y = 6$; add: $x = 13$, $y = 7$.'
          - problem: 'Two numbers sum to $15$, and one is twice the other. Find them.'
            answer: "10 and 5"
            answer_contract: {"kind":"label","options":[["10 and 5"]]}
            solution_sketch: '$x + y = 15$, $x = 2y$; $y = 5$, $x = 10$.'
          - problem: 'The sum of two numbers is $24$ and their difference is $8$. Find the numbers.'
            answer: "16 and 8"
            answer_contract: {"kind":"label","options":[["16 and 8"]]}
            solution_sketch: '$x + y = 24$, $x - y = 8$; add: $x = 16$, $y = 8$.'
          - problem: 'Two numbers sum to $21$, and one is twice the other. Find them.'
            answer: "14 and 7"
            answer_contract: {"kind":"label","options":[["14 and 7"]]}
            solution_sketch: '$x + y = 21$, $x = 2y$; $y = 7$, $x = 14$.'
        constraints: "define two variables; one relationship per sentence"
      - id: kp2
        visuals: [{"kind":"geometry","figure":{"shape":"polygon","vertices":[{"x":"0","y":"0","label":"A"},{"x":"7","y":"0","label":"B"},{"x":"7","y":"4","label":"C"},{"x":"0","y":"4","label":"D"}],"right_angles":[0,1,2,3]},"caption":"Reference example: A reference rectangle has width 7 and height 4. Coordinates give the side lengths; this diagram is an independent example."}]
        name: "Geometry and age setups"
        key_prerequisites: [systems-substitution]
        exemplars:
          - problem: 'A rectangle''s length is $3$ more than twice its width, and its perimeter is $36$. Find the dimensions.'
            answer: "width 5, length 13"
            answer_contract: {"kind":"label","options":[["width 5, length 13"]]}
            solution_sketch: '$l = 2w + 3$, $2l + 2w = 36$; $6w + 6 = 36$; $w = 5$, $l = 13$.'
          - problem: 'Two angles are supplementary and one is $30^\circ$ more than the other. Find both.'
            answer: "105 and 75 degrees"
            answer_contract: {"kind":"label","options":[["105 and 75 degrees"]]}
            solution_sketch: '$x + y = 180$, $x = y + 30$; $y = 75$, $x = 105$.'
          - problem: 'The length of a rectangle is $4$ more than twice its width, and its perimeter is $32$. Find the dimensions.'
            answer: "width 4, length 12"
            answer_contract: {"kind":"label","options":[["width 4, length 12"]]}
            solution_sketch: '$l = 2w + 4$, $2l + 2w = 32$; $6w + 8 = 32$; $w = 4$, $l = 12$.'
          - problem: 'Two angles are complementary and one is $18^\circ$ more than the other. Find both.'
            answer: "54 and 36 degrees"
            answer_contract: {"kind":"label","options":[["54 and 36 degrees"]]}
            solution_sketch: '$x + y = 90$, $x = y + 18$; $y = 36$, $x = 54$.'
        constraints: "perimeter, supplementary/complementary angles, or ages"
      - id: kp3
        name: "Multi-relationship setups"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'The sum of two numbers is $25$; twice the larger minus the smaller is $20$. Find the numbers.'
            answer: "15 and 10"
            answer_contract: {"kind":"label","options":[["15 and 10"]]}
            solution_sketch: '$x + y = 25$, $2x - y = 20$; add: $3x = 45$; $x = 15$, $y = 10$.'
          - problem: 'Sam is $3$ times as old as Tia and their ages sum to $32$. How old is each?'
            answer: "Sam 24, Tia 8"
            answer_contract: {"kind":"label","options":[["Sam 24, Tia 8"],["Sam 8, Tia 24"],["Sam 21, Tia 11"]]}
            solution_sketch: '$s = 3t$, $s + t = 32$; $4t = 32$; $t = 8$, $s = 24$.'
          - problem: 'The sum of two numbers is $30$; twice the larger minus the smaller is $24$. Find the numbers.'
            answer: "18 and 12"
            answer_contract: {"kind":"label","options":[["18 and 12"]]}
            solution_sketch: '$x + y = 30$, $2x - y = 24$; add: $3x = 54$; $x = 18$, $y = 12$.'
          - problem: 'Mia is $4$ times as old as Lee and their ages sum to $25$. How old is each?'
            answer: "Mia 20, Lee 5"
            answer_contract: {"kind":"label","options":[["Mia 20, Lee 5"]]}
            solution_sketch: '$m = 4l$, $m + l = 25$; $5l = 25$; $l = 5$, $m = 20$.'
        constraints: "one scaled relationship plus one sum; integer answers"
    diagnostic_exemplar:
      problem: 'The sum of two numbers is $28$; twice the larger minus the smaller is $23$. Find the numbers.'
      answer_contract: {kind: list, ordered: false, member: {kind: exact}}
      answer: '17 and 11'
      solution_sketch: '$x + y = 28$ and $2x - y = 23$; adding gives $3x = 51$, so $x = 17$ and $y = 11$.'
    anki_seeds:
      - front: "To set up a systems word problem: define ___ variables and write one equation per ___."
        back: "two; stated relationship"
        type: basic
