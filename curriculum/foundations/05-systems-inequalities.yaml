unit: systems-inequalities
course: foundations
module: "Systems & Inequalities"
topics:
  - id: solutions-of-inequalities
    name: "Solutions of Inequalities"
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 50
    prerequisites:
      - id: evaluating-expressions
        weight: 0.6
        key: true
      - id: number-line-integers
        weight: 0.4
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Inequality statements true or false"
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Is the statement $-3 < -5$ true or false?'
            answer: "false"
            answer_contract: {"kind":"label","options":[["true"],["false"]]}
            solution_sketch: '$-3$ is to the right of $-5$ on the number line.'
          - problem: 'True or false: $4 \ge 4$?'
            answer: "true"
            answer_contract: {"kind":"label","options":[["true"],["false"]]}
            solution_sketch: '$4 \ge 4$ holds with equality.'
          - problem: 'Is the statement $-7 < -2$ true or false?'
            answer: "true"
            answer_contract: {"kind":"label","options":[["true"],["false"]]}
            solution_sketch: '$-7$ is to the left of $-2$ on the number line.'
          - problem: 'True or false: $6 \ge 9$?'
            answer: "false"
            answer_contract: {"kind":"label","options":[["true"],["false"]]}
            solution_sketch: '$6$ is less than $9$.'
        constraints: "integer comparisons; include negatives"
      - id: kp2
        name: "Test a value in an inequality"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "Is $x=3$ a solution of $2x+4\\le 11$?"
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Substitute the candidate in the original inequality: $10 \\le  11$ is true. Every comparison must hold for an intersection."
          - problem: "Does $x=-2$ satisfy $7-x<8$?"
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Substitute the candidate in the original inequality: $9 < 8$ is false. Every comparison must hold for an intersection."
          - problem: "Test $x=4$ in $x/2\\ge 2$. Is it a solution?"
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Substitute the candidate in the original inequality: $2 \\ge  2$ is true. Every comparison must hold for an intersection."
          - problem: "Is $x=5$ a solution of $3x-2>14$?"
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Substitute the candidate in the original inequality: $13 > 14$ is false. Every comparison must hold for an intersection."
        constraints: "substitute and compare; yes/no answers"
      - id: kp3
        name: "Boundary values and strictness"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "For $x+2 <= 6$, give the boundary value and whether it is included."
            answer: "boundary = 4; included = yes"
            answer_contract: {"kind": "multipart", "parts": [{"name": "boundary", "contract": {"kind": "exact"}}, {"name": "included", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
            solution_sketch: "Set x+2 equal to 6 to get boundary 4. Equality is allowed by <=."
          - problem: "For $2x < 12$, give the boundary value and whether it is included."
            answer: "boundary = 6; included = no"
            answer_contract: {"kind": "multipart", "parts": [{"name": "boundary", "contract": {"kind": "exact"}}, {"name": "included", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
            solution_sketch: "The boundary solves 2x = 12, so it is 6. Strict < excludes equality."
          - problem: "For $7-x >= 10$, give the boundary value and whether it is included."
            answer: "boundary = -3; included = yes"
            answer_contract: {"kind": "multipart", "parts": [{"name": "boundary", "contract": {"kind": "exact"}}, {"name": "included", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
            solution_sketch: "Equality gives 7-x = 10 and x = -3. The inclusive sign admits that boundary."
          - problem: "For $x/3 > -2$, give the boundary value and whether it is included."
            answer: "boundary = -6; included = no"
            answer_contract: {"kind": "multipart", "parts": [{"name": "boundary", "contract": {"kind": "exact"}}, {"name": "included", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
            solution_sketch: "Multiply the boundary equation by 3 to get -6. Strict > excludes that value."
        constraints: "contrast strict vs inclusive at the boundary"
    diagnostic_exemplar:
      problem: 'Is $x = -2$ a solution of $3x + 1 \ge -5$?'
      answer_contract: {kind: label, options: [[yes], [no]]}
      answer: "yes"
      solution_sketch: '$3(-2) + 1 = -5$, and $-5 \ge -5$ is true.'
    anki_seeds:
      - front: "Of x < a and x <= a, which includes the boundary value a?"
        back: "only x <= a (inclusive); < and > exclude the boundary"
        type: basic

  - id: graphing-inequalities-number-line
    name: "Graphing Inequalities on a Number Line"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: solutions-of-inequalities
        weight: 0.7
        key: true
      - id: number-line-integers
        weight: 0.4
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[],"intervals":[],"rays":[{"from":"3","direction":"right","filled":true,"label":"x ≥ 3"}],"caption":"Reference example: a filled point at 3 with the ray extending right shows x ≥ 3."}]
        name: "Open vs closed circle"
        key_prerequisites: [solutions-of-inequalities]
        exemplars:
          - problem: 'To graph $x \ge 3$, is the circle at $3$ open or closed?'
            answer: "closed"
            answer_contract: {"kind":"label","options":[["closed"],["open"]]}
            solution_sketch: '$\ge$ is inclusive, so the circle is closed.'
          - problem: 'To graph $x < -1$, is the circle at $-1$ open or closed?'
            answer: "open"
            answer_contract: {"kind":"label","options":[["closed"],["open"]]}
            solution_sketch: '$<$ is strict, so the circle is open.'
          - problem: 'To graph $x \le 5$, is the circle at $5$ open or closed?'
            answer: "closed"
            answer_contract: {"kind":"label","options":[["closed"],["open"]]}
            solution_sketch: '$\le$ is inclusive, so the circle is closed.'
          - problem: 'To graph $x > -4$, is the circle at $-4$ open or closed?'
            answer: "open"
            answer_contract: {"kind":"label","options":[["closed"],["open"]]}
            solution_sketch: '$>$ is strict, so the circle is open.'
        constraints: "closed for <= or >=; open for < or >"
      - id: kp2
        visuals: [{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[],"intervals":[],"rays":[{"from":"-2","direction":"left","filled":false,"label":"x < -2"}],"caption":"Reference example: an open point at -2 with the ray extending left shows x < -2."}]
        name: "Direction of the ray"
        key_prerequisites: [solutions-of-inequalities]
        exemplars:
          - problem: "For $x > 4$, give the endpoint and ray direction."
            answer: "endpoint = 4; direction = right"
            answer_contract: {"kind": "multipart", "parts": [{"name": "endpoint", "contract": {"kind": "exact"}}, {"name": "direction", "contract": {"kind": "label", "options": [["left"], ["right"]]}}]}
            solution_sketch: "The endpoint is 4. Values greater than 4 lie to its right."
          - problem: "For $x <= -2$, give the endpoint and ray direction."
            answer: "endpoint = -2; direction = left"
            answer_contract: {"kind": "multipart", "parts": [{"name": "endpoint", "contract": {"kind": "exact"}}, {"name": "direction", "contract": {"kind": "label", "options": [["left"], ["right"]]}}]}
            solution_sketch: "The endpoint is -2. Smaller values lie left; the endpoint is also included."
          - problem: "For $x < 7$, give the endpoint and ray direction."
            answer: "endpoint = 7; direction = left"
            answer_contract: {"kind": "multipart", "parts": [{"name": "endpoint", "contract": {"kind": "exact"}}, {"name": "direction", "contract": {"kind": "label", "options": [["left"], ["right"]]}}]}
            solution_sketch: "The endpoint is 7. Values below 7 extend left from the excluded endpoint."
          - problem: "For $x >= -5$, give the endpoint and ray direction."
            answer: "endpoint = -5; direction = right"
            answer_contract: {"kind": "multipart", "parts": [{"name": "endpoint", "contract": {"kind": "exact"}}, {"name": "direction", "contract": {"kind": "label", "options": [["left"], ["right"]]}}]}
            solution_sketch: "The endpoint is -5. Greater values extend right, including the endpoint itself."
        constraints: "> and >= point right; < and <= point left"
      - id: kp3
        visuals: [{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[],"intervals":[],"rays":[{"from":"1","direction":"right","filled":true,"label":"x ≥ 1"}],"caption":"Reference example: read the graph as x ≥ 1 from the filled origin at 1 and the rightward ray."}]
        name: "Read the inequality from a graph"
        key_prerequisites: [solutions-of-inequalities]
        exemplars:
          - problem: 'A number line shows a closed circle at $-1$ with a ray to the left. Write the inequality.'
            answer: "x <= -1"
            solution_sketch: 'A closed circle is inclusive; left means less than or equal.'
          - problem: 'A number line shows an open circle at $4$ with a ray to the right. Write the inequality.'
            answer: "x > 4"
            solution_sketch: 'An open circle is strict; right means greater than.'
          - problem: 'A number line shows a closed circle at $2$ with a ray to the right. Write the inequality.'
            answer: "x >= 2"
            solution_sketch: 'A closed circle is inclusive; right means greater than or equal.'
          - problem: 'A number line shows an open circle at $-5$ with a ray to the left. Write the inequality.'
            answer: "x < -5"
            solution_sketch: 'An open circle is strict; left means less than.'
        constraints: "single ray; integer endpoint"
    diagnostic_exemplar:
      problem: 'A number line shows an open circle at $-3$ with a ray to the right. Write the inequality.'
      answer: 'x > -3'
      solution_sketch: 'An open circle means strict, and a ray to the right means greater than.'
    anki_seeds:
      - front: "Number-line graphs of inequalities: open circle = ___, closed circle = ___."
        back: "strict (< or >); inclusive (<= or >=)"
        type: basic

  - id: one-step-inequalities
    name: "One-Step Inequalities"
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: one-step-equations
        weight: 0.6
        key: true
      - id: solutions-of-inequalities
        weight: 0.5
        key: true
      - id: graphing-inequalities-number-line
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Add or subtract on both sides"
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: "Solve $x+8\\le 21$."
            answer: "x <= 13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(1)x \\le  13$. Divide by $1$ and preserve the comparison. The boundary is $13$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $x-7>4$."
            answer: "x > 11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(1)x > 11$. Divide by $1$ and preserve the comparison. The boundary is $11$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $13<x+2$."
            answer: "x > 11"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $2$ from both sides: $11<x$. This says the same thing as $x>11$; the inequality direction is preserved during subtraction.'
          - problem: "Solve $x+5\\ge -3$."
            answer: "x >= -8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(1)x \\ge  -8$. Divide by $1$ and preserve the comparison. The boundary is $-8$. Equality is included exactly when the comparison is inclusive."
        constraints: "integer constants; keep the inequality direction"
      - id: kp2
        name: "Multiply or divide by a positive"
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: "Solve $4x\\le 28$."
            answer: "x <= 7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(4)x \\le  28$. Divide by $4$ and preserve the comparison. The boundary is $7$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $x/3>5$."
            answer: "x > 15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(1/3)x > 5$. Divide by $1/3$ and preserve the comparison. The boundary is $15$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $21\\ge 7x$."
            answer: "x <= 3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide both sides by positive $7$: $3\ge x$. Equivalently, $x\le3$. Division by a positive number preserves the comparison.'
          - problem: "Solve $x/5\\ge -2$."
            answer: "x >= -10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(1/5)x \\ge  -2$. Divide by $1/5$ and preserve the comparison. The boundary is $-10$. Equality is included exactly when the comparison is inclusive."
        constraints: "positive coefficients only; no sign flips"
      - id: kp3
        visuals: [{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[],"intervals":[],"rays":[{"from":"3","direction":"left","filled":true,"label":"x ≤ 3"}],"caption":"Reference example: solving x + 2 ≤ 5 gives x ≤ 3, a filled point at 3 with the ray extending left."}]
        name: "Solve and describe the graph"
        key_prerequisites: [graphing-inequalities-number-line]
        exemplars:
          - problem: "Solve $2x>14$. Give boundary and graph, where graph combines open or closed with left or right (for example: boundary = 2; graph = open left)."
            answer: "boundary = 7; graph = open right"
            answer_contract: {"kind": "multipart", "parts": [{"name": "boundary", "contract": {"kind": "exact"}}, {"name": "graph", "contract": {"kind": "label", "options": [["open left"], ["closed left"], ["open right"], ["closed right"]]}}]}
            solution_sketch: "Undo the single arithmetic operation to get $x > 7$. The boundary comes from equality. A strict sign gives an open point; an inclusive sign gives a closed point. Values below the boundary shade left; values above it shade right."
          - problem: "Solve $x+6\\le 10$. Give boundary and graph, where graph combines open or closed with left or right (for example: boundary = 2; graph = open left)."
            answer: "boundary = 4; graph = closed left"
            answer_contract: {"kind": "multipart", "parts": [{"name": "boundary", "contract": {"kind": "exact"}}, {"name": "graph", "contract": {"kind": "label", "options": [["open left"], ["closed left"], ["open right"], ["closed right"]]}}]}
            solution_sketch: "Undo the single arithmetic operation to get $x \\le  4$. The boundary comes from equality. A strict sign gives an open point; an inclusive sign gives a closed point. Values below the boundary shade left; values above it shade right."
          - problem: "Solve $x/3\\ge 5$. Give boundary and graph, where graph combines open or closed with left or right (for example: boundary = 2; graph = open left)."
            answer: "boundary = 15; graph = closed right"
            answer_contract: {"kind": "multipart", "parts": [{"name": "boundary", "contract": {"kind": "exact"}}, {"name": "graph", "contract": {"kind": "label", "options": [["open left"], ["closed left"], ["open right"], ["closed right"]]}}]}
            solution_sketch: "Undo the single arithmetic operation to get $x \\ge  15$. The boundary comes from equality. A strict sign gives an open point; an inclusive sign gives a closed point. Values below the boundary shade left; values above it shade right."
          - problem: "Solve $x-7<2$. Give boundary and graph, where graph combines open or closed with left or right (for example: boundary = 2; graph = open left)."
            answer: "boundary = 9; graph = open left"
            answer_contract: {"kind": "multipart", "parts": [{"name": "boundary", "contract": {"kind": "exact"}}, {"name": "graph", "contract": {"kind": "label", "options": [["open left"], ["closed left"], ["open right"], ["closed right"]]}}]}
            solution_sketch: "Undo the single arithmetic operation to get $x < 9$. The boundary comes from equality. A strict sign gives an open point; an inclusive sign gives a closed point. Values below the boundary shade left; values above it shade right."
        constraints: "pair the solution with its number-line picture"
    diagnostic_exemplar:
      problem: 'Solve $\frac{x}{4} \ge 3$.'
      answer: "x >= 12"
      solution_sketch: 'Multiply both sides by the positive $4$; a positive multiplier leaves the direction alone.'
    anki_seeds:
      - front: "Adding, subtracting, or multiplying/dividing by a POSITIVE number keeps the inequality direction ___."
        back: "unchanged"
        type: basic

  - id: two-step-inequalities
    name: "Two-Step Inequalities"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: expression
    expected_time_secs: 65
    prerequisites:
      - id: one-step-inequalities
        weight: 0.7
        key: true
      - id: two-step-equations
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Two steps with a positive coefficient"
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: "Solve $3x+4\\le 28$."
            answer: "x <= 8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(3)x \\le  24$. Divide by $3$ and preserve the comparison. The boundary is $8$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $2x-9>5$."
            answer: "x > 7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(2)x > 14$. Divide by $2$ and preserve the comparison. The boundary is $7$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $17\\ge 4x+1$."
            answer: "x <= 4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $1$ from both sides: $16\ge4x$. Divide by positive $4$: $4\ge x$, or $x\le4$.'
          - problem: "Solve $5x-3\\ge -18$."
            answer: "x >= -3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(5)x \\ge  -15$. Divide by $5$ and preserve the comparison. The boundary is $-3$. Equality is included exactly when the comparison is inclusive."
        constraints: "undo addition first, then division; positive coefficients"
      - id: kp2
        name: "Two steps with fractions"
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: "Solve $x/2+5\\le 12$."
            answer: "x <= 14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(1/2)x \\le  7$. Divide by $1/2$ and preserve the comparison. The boundary is $14$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $x/3-4>2$."
            answer: "x > 18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(1/3)x > 6$. Divide by $1/3$ and preserve the comparison. The boundary is $18$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $7\\ge x/4+1$."
            answer: "x <= 24"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $1$ from both sides: $6\ge x/4$. Multiply by positive $4$: $24\ge x$, or $x\le24$.'
          - problem: "Solve $x/5-2\\ge -6$."
            answer: "x >= -20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(1/5)x \\ge  -4$. Divide by $1/5$ and preserve the comparison. The boundary is $-20$. Equality is included exactly when the comparison is inclusive."
        constraints: "unit-fraction coefficients; integer answers"
      - id: kp3
        name: "Solve, then check a value"
        key_prerequisites: [one-step-inequalities]
        exemplars:
          - problem: "Solve $3x+2\\le 14$, then test $x=4$. Is it included?"
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Isolating x gives $x \\le  4$. Substitute the candidate in the original inequality: $14 \\le  14$ is true. Every comparison must hold for an intersection."
          - problem: "Solve $x/2-3>1$, then test $x=8$. Is it included?"
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Isolating x gives $x > 8$. Substitute the candidate in the original inequality: $1 > 1$ is false. Every comparison must hold for an intersection."
          - problem: "Solve $4x-5\\ge 11$, then test $x=5$. Is it included?"
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Isolating x gives $x \\ge  4$. Substitute the candidate in the original inequality: $15 \\ge  11$ is true. Every comparison must hold for an intersection."
          - problem: "Solve $2x+7<15$, then test $x=6$. Is it included?"
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Isolating x gives $x < 4$. Substitute the candidate in the original inequality: $19 < 15$ is false. Every comparison must hold for an intersection."
        constraints: "check the boundary value against strictness"
    diagnostic_exemplar:
      problem: 'Solve $\frac{x}{3} + 2 \le 5$.'
      answer: 'x <= 9'
      solution_sketch: '$\frac{x}{3} \le 3$; multiply by $3$: $x \le 9$.'
    anki_seeds:
      - front: "Solve a two-step inequality in the same order as a two-step equation: undo ___ first, then ___."
        back: "addition/subtraction; multiplication/division"
        type: basic

  - id: linear-inequalities
    name: "Solving Linear Inequalities"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 70
    prerequisites:
      - id: two-step-inequalities
        weight: 0.7
        key: true
      - id: integer-multiplication-division
        weight: 0.5
        key: true
      - id: multi-step-equations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Flip the sign for a negative coefficient"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: "Solve $-3x\\le 18$."
            answer: "x >= -6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(-3)x \\le  18$. Divide by $-3$ and reverse the comparison. The boundary is $-6$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $-x+4>11$."
            answer: "x < -7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(-1)x > 7$. Divide by $-1$ and reverse the comparison. The boundary is $-7$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $12\\ge -4x$."
            answer: "x >= -3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(4)x \\ge  -12$. Divide by $4$ and preserve the comparison. The boundary is $-3$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $5-x\\ge -3$."
            answer: "x <= 8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(-1)x \\ge  -8$. Divide by $-1$ and reverse the comparison. The boundary is $8$. Equality is included exactly when the comparison is inclusive."
        constraints: "reverse the inequality when dividing/multiplying by a negative"
      - id: kp2
        name: "Multi-step inequalities"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: "Solve $3(x-2)\\le x+8$."
            answer: "x <= 7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(2)x \\le  14$. Divide by $2$ and preserve the comparison. The boundary is $7$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $5-2(x+3)>x+2$."
            answer: "x < -1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(-3)x > 3$. Divide by $-3$ and reverse the comparison. The boundary is $-1$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $4(x+1)\\ge 2x-8$."
            answer: "x >= -6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(2)x \\ge  -12$. Divide by $2$ and preserve the comparison. The boundary is $-6$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $2(3-x)<5x+11$."
            answer: "x > -5/7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(-7)x < 5$. Divide by $-7$ and reverse the comparison. The boundary is $-5/7$. Equality is included exactly when the comparison is inclusive."
        constraints: "simplify both sides first; flip only for a negative divisor"
      - id: kp3
        name: "Variables on both sides"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: "Solve $2x+9\\le 5x-3$."
            answer: "x >= 4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(-3)x \\le  -12$. Divide by $-3$ and reverse the comparison. The boundary is $4$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $7-3x>2x-8$."
            answer: "x < 3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(-5)x > -15$. Divide by $-5$ and reverse the comparison. The boundary is $3$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $4x-1\\ge x+11$."
            answer: "x >= 4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(3)x \\ge  12$. Divide by $3$ and preserve the comparison. The boundary is $4$. Equality is included exactly when the comparison is inclusive."
          - problem: "Solve $5x+2<8x-7$."
            answer: "x > 3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(-3)x < -9$. Divide by $-3$ and reverse the comparison. The boundary is $3$. Equality is included exactly when the comparison is inclusive."
        constraints: "collect variables on the side that keeps the coefficient positive when possible"
    diagnostic_exemplar:
      problem: 'Solve $5 - 2x \ge x - 7$.'
      answer: 'x <= 4'
      solution_sketch: '$5 + 7 \ge x + 2x$; $12 \ge 3x$; $x \le 4$.'
    anki_seeds:
      - front: "When you multiply or divide both sides of an inequality by a negative number, you must ..."
        back: "reverse (flip) the inequality sign"
        type: basic

  - id: writing-inequalities-from-statements
    name: "Writing Inequalities from Statements"
    core: false                # translation leaf of the inequality word-problem branch
    difficulty: 0.40
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: one-step-inequalities
        weight: 0.6
        key: true
      - id: solutions-of-inequalities
        weight: 0.4
        key: true
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Translate comparison phrases"
        key_prerequisites: [solutions-of-inequalities]
        exemplars:
          - problem: 'Write an inequality: "$x$ is at least $12$".'
            answer: "x >= 12"
            solution_sketch: '"At least" means $\ge$.'
          - problem: 'Write an inequality for the number of items $n$: "fewer than $8$ items".'
            answer: "n < 8"
            solution_sketch: '"Fewer than" is strict: $n < 8$.'
          - problem: 'Write an inequality: "$x$ is at most $20$".'
            answer: "x <= 20"
            solution_sketch: '"At most" means $\le$.'
          - problem: 'Write an inequality for the number of items $n$: "more than $5$ items".'
            answer: "n > 5"
            solution_sketch: '"More than" is strict: $n > 5$.'
        constraints: "at least -> >=; at most -> <=; more/fewer than -> strict"
      - id: kp2
        name: "Translate phrases with operations"
        key_prerequisites: [one-step-inequalities]
        exemplars:
          - problem: 'Write an inequality: "$5$ more than twice $x$ is at most $17$".'
            answer: "2*x + 5 <= 17"
            answer_contract: {"kind": "relation_setup"}
            solution_sketch: "Multiply $x$ by $2$, then add $5$. The phrase 'at most' sets this expression less than or equal to $17$; preserve the stated operations."
          - problem: 'Write an inequality: "the quotient of $y$ and $3$ exceeds $6$".'
            answer: "y/3 > 6"
            answer_contract: {"kind": "relation_setup"}
            solution_sketch: "Divide $y$ by $3$. The word 'exceeds' places this quotient strictly above $6$; keep the quotient unsolved."
          - problem: 'Write an inequality: "$7$ less than $4$ times $n$ is at least $9$".'
            answer: "4*n - 7 >= 9"
            answer_contract: {"kind": "relation_setup"}
            solution_sketch: "Multiply $n$ by $4$, then subtract $7$. The phrase 'at least' sets the result greater than or equal to $9$."
          - problem: 'Write an inequality: "the sum of $3$ times $q$ and $8$ is below $20$".'
            answer: "3*q + 8 < 20"
            answer_contract: {"kind": "relation_setup"}
            solution_sketch: "Form $3*q + 8$ in the stated order. The word 'below' makes the comparison strictly less than $20$."
        constraints: "one or two operations; do not solve"
      - id: kp3
        name: "Interpret an inequality in context"
        key_prerequisites: [solutions-of-inequalities]
        exemplars:
          - problem: 'You need $n \ge 30$ points to advance. What is the fewest points that works?'
            answer: "30"
            solution_sketch: 'The fewest value meeting $n \ge 30$ is $30$ itself.'
          - problem: 'A bag holds at most $15$ kg. Write the inequality for the weight $w$.'
            answer: "w <= 15"
            solution_sketch: '"At most" means $\le$.'
          - problem: 'You need at least $50$ points to qualify. What is the fewest points that works?'
            answer: "50"
            solution_sketch: 'The fewest value meeting $n \ge 50$ is $50$ itself.'
          - problem: 'A crate holds at most $40$ kg. Write the inequality for the weight $w$.'
            answer: "w <= 40"
            solution_sketch: '"At most" means $\le$.'
        constraints: "single constraint; state units where natural"
    diagnostic_exemplar:
      problem: 'Write an inequality: "three less than a number $n$ is more than $10$".'
      answer_contract: {kind: polynomial_relation}
      answer: "n - 3 > 10"
      solution_sketch: '"Three less than $n$" is $n - 3$, and "more than" is a strict $>$.'
    anki_seeds:
      - front: "Translating: \"at least\" means ___ and \"at most\" means ___."
        back: ">= ; <="
        type: basic

  - id: and-or-inequalities
    name: "And / Or Inequalities"
    core: true
    difficulty: 0.46
    drill: false
    # Answers are compound solution sets ("-4 < x < 4", "x < -1 or x > 4"); SymPy cannot
    # parse chained comparisons or unions, so the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 75
    prerequisites:
      - id: linear-inequalities
        weight: 0.7
        key: true
      - id: graphing-inequalities-number-line
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Membership in a compound solution"
        key_prerequisites: [graphing-inequalities-number-line]
        exemplars:
          - problem: "Is $x=3$ a solution of $x>1$ and $x<5$?"
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Substitute the candidate in the original inequality: $3 > 1$ is true; $3 < 5$ is true. Every comparison must hold for an intersection."
          - problem: "Does $x=0$ satisfy $x<-2$ or $x>4$?"
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Substitute the candidate in the original inequality: $0 < -2$ is false; $0 > 4$ is false. Either comparison suffices for a union."
          - problem: "Test $x=-3$ in $x\\le -3$ or $x\\ge 6$. Is it a solution?"
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Substitute the candidate in the original inequality: $-3 \\le  -3$ is true; $-3 \\ge  6$ is false. Either comparison suffices for a union."
          - problem: "Is $x=7$ a solution of $x>2$ and $x\\le 7$?"
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Substitute the candidate in the original inequality: $7 > 2$ is true; $7 \\le  7$ is true. Every comparison must hold for an intersection."
        constraints: "test one value against the graph or the symbols"
      - id: kp2
        name: "'And' (between) inequalities"
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: "Solve $-7<x+3<9$. Give the solution in interval notation."
            answer: "(-10, 6)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $-10 < x < 6$."
          - problem: "Solve $2\\le 3x\\le 17$. Give the solution in interval notation."
            answer: "[2/3, 17/3]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $2/3 \\le  x \\le  17/3$."
          - problem: "Solve $-4<x-5\\le 6$. Give the solution in interval notation."
            answer: "(1, 11]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $1 < x \\le  11$."
          - problem: "Solve $-3\\le x/2<8$. Give the solution in interval notation."
            answer: "[-6, 16)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $-6 \\le  x < 16$."
        constraints: "apply each operation to all three parts; one operation needed"
      - id: kp3
        name: "'Or' inequalities"
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: "Solve $x-1 < -2$ or $x-1 > 3$."
            answer: "x < -1 or x > 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Add 1 in each branch. Both signs are strict, so exclude -1 and 4 and join the two rays."
          - problem: "Solve $2x <= -6$ or $x+1 > 5$."
            answer: "x <= -3 or x > 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Divide the first branch by positive 2; subtract 1 in the second. Include -3 and exclude 4."
          - problem: "Solve $-x > 5$ or $x/2 >= 3$."
            answer: "x < -5 or x >= 6"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Negating the first comparison reverses its sign. Multiply the second by positive 2. Only the right endpoint is included."
          - problem: "Solve $3x < -12$ or $2x >= 14$."
            answer: "x < -4 or x >= 7"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Divide the branches by positive 3 and 2 respectively. Keep strictness in the left ray and equality in the right ray."
        constraints: "solve each piece separately; keep the union"
    diagnostic_exemplar:
      problem: 'Solve $x + 2 < 1$ or $x - 4 \ge 1$.'
      answer_contract: {kind: inequality_union}
      answer: 'x < -1 or x >= 5'
      solution_sketch: 'Solve each piece: $x < -1$; $x \ge 5$; keep the union.'
    anki_seeds:
      - front: "An 'and' compound inequality gives the ___ of the solution sets; an 'or' compound inequality gives the ___."
        back: "intersection (overlap / between); union"
        type: basic

  - id: compound-inequalities
    name: "Compound Inequalities"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: and-or-inequalities
        weight: 0.7
        key: true
      - id: linear-inequalities
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Multi-step three-part inequalities"
        key_prerequisites: [and-or-inequalities]
        exemplars:
          - problem: 'Solve $-5 \le 2x - 1 < 7$.'
            answer: "-2 <= x < 4"
            answer_contract: {kind: exact}
            solution_sketch: 'Add $1$: $-4 \le 2x < 8$; divide by $2$.'
          - problem: 'Solve $3 < 2x + 1 \le 11$.'
            answer: "1 < x <= 5"
            answer_contract: {kind: exact}
            solution_sketch: 'Subtract $1$: $2 < 2x \le 10$; divide by $2$.'
          - problem: 'Solve $-3 \le 2x + 1 < 9$.'
            answer: "-2 <= x < 4"
            answer_contract: {kind: exact}
            solution_sketch: 'Subtract $1$: $-4 \le 2x < 8$; divide by $2$.'
          - problem: 'Solve $5 < 3x - 1 \le 14$.'
            answer: "2 < x <= 5"
            answer_contract: {kind: exact}
            solution_sketch: 'Add $1$: $6 < 3x \le 15$; divide by $3$.'
        constraints: "keep operations balanced across all parts"
      - id: kp2
        name: "Three-part with a negative coefficient"
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: "Solve $-8<-2x\\le 6$. Give the solution in interval notation."
            answer: "[-3, 4)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $-3 \\le  x < 4$."
          - problem: "Solve $1\\le 5-x<9$. Give the solution in interval notation."
            answer: "(-4, 4]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $-4 < x \\le  4$."
          - problem: "Solve $-7<3-2x<13$. Give the solution in interval notation."
            answer: "(-5, 5)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $-5 < x < 5$."
          - problem: "Solve $-4\\le -x/3\\le 6$. Give the solution in interval notation."
            answer: "[-18, 12]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $-18 \\le  x \\le  12$."
        constraints: "both inequality signs flip; rewrite smallest-to-largest"
      - id: kp3
        name: "Multi-step 'or' unions"
        key_prerequisites: [and-or-inequalities]
        exemplars:
          - problem: "Solve $2x+1 < -5$ or $3x-2 > 10$."
            answer: "x < -3 or x > 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Subtract 1 then divide by 2 on the left; add 2 then divide by 3 on the right. Both endpoints are excluded."
          - problem: "Solve $-2x+3 >= 15$ or $4x+1 > 21$."
            answer: "x <= -6 or x > 5"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Subtract 3 and divide by -2, reversing the left sign. Subtract 1 and divide by 4 in the right branch."
          - problem: "Solve $3(x+2) <= -9$ or $2(x-1) >= 14$."
            answer: "x <= -5 or x >= 8"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Divide by 3 then subtract 2 in the left branch; divide by 2 then add 1 on the right. Include both endpoints."
          - problem: "Solve $x/2+3 < -1$ or $5-x/3 <= 2$."
            answer: "x < -8 or x >= 9"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Subtract 3 then multiply by 2 on the left. Subtract 5 then multiply by -3 on the right, reversing its sign."
        constraints: "each piece takes two steps; keep the union"
    diagnostic_exemplar:
      problem: 'Solve $-4 < -2x \le 6$.'
      answer: '-3 <= x < 2'
      solution_sketch: 'Divide all three parts by $-2$ and reverse both signs: $2 > x \ge -3$.'
    anki_seeds:
      - front: "In a three-part inequality, every operation must be applied to ___, and dividing by a negative flips ___."
        back: "all three parts; both inequality signs"
        type: basic

  - id: interval-notation
    name: "Interval Notation"
    # core: the notation later material answers in everywhere — precalculus
    # polynomial-inequalities, calculus-1 continuity and
    # increasing-decreasing-intervals, calculus-2 power-series all demand
    # interval-notation answers (re-audit R-01). proofs:interval-notation-real-sets
    # is the set-operations rigorization of this notation, one rung above.
    core: true
    difficulty: 0.52
    drill: false
    # Interval strings and unions ("[2, 7)", "(-∞, -2) ∪ (4, ∞)") are not
    # SymPy-parseable; the tutor grades them — same call as
    # precalculus:polynomial-inequalities and proofs:interval-notation-real-sets.
    answer_kind: multi-step
    expected_time_secs: 80
    prerequisites:
      - id: compound-inequalities
        weight: 0.6
        key: true
      - id: graphing-inequalities-number-line
        weight: 0.5
        key: true
      - id: and-or-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Bounded intervals and endpoint membership"
        key_prerequisites: [graphing-inequalities-number-line]
        exemplars:
          - problem: "Write $-8\\le x\\le -3$ in interval notation."
            answer: "[-8, -3]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $-8 \\le  x \\le  -3$."
          - problem: "Write $-1<x\\le 6$ in interval notation."
            answer: "(-1, 6]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $-1 < x \\le  6$."
          - problem: "Write $2\\le x<9$ in interval notation."
            answer: "[2, 9)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $2 \\le  x < 9$."
          - problem: "Write $-7<x<4$ in interval notation."
            answer: "(-7, 4)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Read the lower and upper bounds. Use a square bracket at an included endpoint and a round bracket at an excluded endpoint. The boundary calculation gives $-7 < x < 4$."
        constraints: "bounded intervals only; convert inequality -> interval and test one endpoint; integer endpoints"
      - id: kp2
        name: "Unbounded intervals with infinity"
        key_prerequisites: [graphing-inequalities-number-line]
        exemplars:
          - problem: 'Write $x > 2$ in interval notation.'
            answer: "(2, ∞)"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'A ray to the right; $\infty$ is not a number, so it always takes a round bracket.'
          - problem: 'Write $x \le -1$ in interval notation.'
            answer: "(-∞, -1]"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Every value at or below $-1$; the round bracket at $-\infty$ never closes, and the square bracket at $-1$ includes it.'
          - problem: 'Write the interval $[4, \infty)$ as an inequality.'
            answer: "x >= 4"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'A square bracket at $4$ becomes $\ge$; the ray extends right without bound.'
          - problem: 'Write $(-\infty, 3]$ as an inequality.'
            answer: "x <= 3"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The ray extends left and includes $3$.'
        constraints: "single rays both directions; infinity always gets a round bracket; convert both ways"
      - id: kp3
        name: "Unions for 'or' solutions"
        key_prerequisites: [compound-inequalities]
        exemplars:
          - problem: 'Write the solution of $x < -2$ or $x > 4$ in interval notation.'
            answer: "(-∞, -2) ∪ (4, ∞)"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Each ray becomes an interval; the "or" is written with the union symbol $\cup$.'
          - problem: 'Solve $2x + 1 \le -3$ or $x - 3 > 0$ and give the answer in interval notation.'
            answer: "(-∞, -2] ∪ (3, ∞)"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: '$2x \le -4$ gives $x \le -2$; the second piece gives $x > 3$.'
          - problem: 'Write $(-\infty, 1) \cup [5, \infty)$ as inequalities joined by "or".'
            answer: "x < 1 or x >= 5"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The interval $(-\infty, 1)$ is $x < 1$; $[5, \infty)$ is $x \ge 5$.'
          - problem: 'Solve $x + 1 \le -4$ or $2x - 3 > 5$ and give the answer in interval notation.'
            answer: "(-∞, -5] ∪ (4, ∞)"
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: '$x \le -5$ or $x > 4$, so $(-\infty,-5] \cup (4,\infty)$.'
        constraints: "two-piece unions from 'or' inequalities; at most two solving steps per piece; convert both ways"
    diagnostic_exemplar:
      problem: 'Solve $3x + 2 < -4$ or $x - 2 \ge 1$ and give the answer in interval notation.'
      answer_contract: {kind: inequality_union}
      answer: '(-∞, -2) ∪ [3, ∞)'
      solution_sketch: '$3x < -6 \to x < -2$ (round bracket); $x \ge 3$ (square bracket); take the union.'
    anki_seeds:
      - front: "Interval notation: square bracket vs round bracket?"
        back: "square [ includes the endpoint (<= or >=); round ( excludes it (< or >)"
        type: basic
      - front: "Which bracket always goes next to ∞ or -∞ in interval notation, and why?"
        back: "a round bracket — infinity is not a number, so it can never be included"
        type: basic
      - front: "An 'or' solution set like x < -2 or x > 4 is written in interval notation as..."
        back: "(-∞, -2) ∪ (4, ∞) — the union symbol ∪ joins the pieces"
        type: basic

  - id: inequality-word-problems
    name: "Inequality Word Problems"
    core: false                # enrichment / applications leaf topic
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 130
    prerequisites:
      - id: writing-inequalities-from-statements
        weight: 0.6
        key: true
      - id: linear-inequalities
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Budget (at most) problems"
        key_prerequisites: [writing-inequalities-from-statements, linear-inequalities]
        exemplars:
          - problem: "Shirts cost 8 euros each with 10 euros shipping. The budget is 58 euros. With $x$ the number bought, solve $8x+10\\le 58$ and give the maximum whole count."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(8)x \\le  48$. Divide by $8$ and preserve the comparison. The boundary is $6$. Take the greatest whole count at or below this bound; larger counts exceed the budget."
          - problem: "Each notebook costs 5 euros plus a 7 euro order fee. The budget is 42 euros. With $x$ the number bought, solve $5x+7\\le 42$ and give the maximum whole count."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(5)x \\le  35$. Divide by $5$ and preserve the comparison. The boundary is $7$. Take the greatest whole count at or below this bound; larger counts exceed the budget."
          - problem: "Tickets cost 12 euros each and booking costs 4 euros. The budget is 100 euros. With $x$ the number bought, solve $12x+4\\le 100$ and give the maximum whole count."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(12)x \\le  96$. Divide by $12$ and preserve the comparison. The boundary is $8$. Take the greatest whole count at or below this bound; larger counts exceed the budget."
          - problem: "Tokens cost 3 euros each; entry costs 9 euros. The budget is 36 euros. With $x$ the number bought, solve $3x+9\\le 36$ and give the maximum whole count."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Collect variable terms and constants: $(3)x \\le  27$. Divide by $3$ and preserve the comparison. The boundary is $9$. Take the greatest whole count at or below this bound; larger counts exceed the budget."
        constraints: "cost model with a cap; integer boundary"
      - id: kp2
        name: "Minimum (at least) problems"
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: "You have €20 and save €5 per week. Give the minimum weeks needed to reach at least €50."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$20+5w\\geq50$ gives $5w\\geq30$, so $w\\geq6$ and the minimum is $6$."
          - problem: "Two scores are $70$ and $80$. What minimum third score makes the average at least $80$?"
            answer: "90"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$(70+80+s)/3\\geq80$ gives $150+s\\geq240$, hence $s\\geq90$."
          - problem: "A tank needs at least $45$ L and already contains $9$ L. It fills at $6$ L/min. Find the minimum whole minutes."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$9+6t\\geq45$ gives $6t\\geq36$, hence $t\\geq6$."
          - problem: "A learner subtracts a savings target incorrectly. Starting at €12, saving €4 daily, what minimum whole days reaches €32?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The required increase is $32-12=20$ euros. Solve $4d\\geq20$ to get $d\\geq5$."
        constraints: "at-least targets; averages or savings"
      - id: kp3
        name: "Round the boundary sensibly"
        key_prerequisites: [writing-inequalities-from-statements]
        exemplars:
          - problem: "You have €20; tickets cost €3. What is the maximum whole ticket count?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3n\\leq20$ gives $n\\leq20/3=6+2/3$. Round down to $6$; seven tickets cost €21."
          - problem: "A €5 fee plus €4 per ride must fit within €30. Find the maximum whole rides."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$5+4n\\leq30$ gives $n\\leq25/4=6.25$. Six rides cost €29 and seven cost €33."
          - problem: "A shelf supports at most $25$ kg. Its existing load is $4$ kg; each new box is $6$ kg. Find the maximum whole boxes."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$4+6n\\leq25$ gives $n\\leq21/6=3.5$. Round down to $3$ to stay within the cap."
          - problem: "A learner rounds $50/8=6.25$ up to $7$ when buying €8 items with €50. Give the maximum affordable count."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The bound is $8n\\leq50$. Six items cost €48; seven cost €56 and exceed the cap."
        constraints: "whole-number contexts; round down for at-most caps"
    diagnostic_exemplar:
      problem: 'Rides cost €5 each plus a €7 entry fee, and you have €30. How many rides can you go on?'
      answer: '4'
      solution_sketch: '$5r + 7 \le 30$; $r \le 4.6$; round down to $4$.'
    anki_seeds:
      - front: "In an at-most word problem, a fractional boundary for a count of items is rounded ___."
        back: "down (you cannot buy a fraction of an item)"
        type: basic

  - id: basic-absolute-value-inequalities
    name: "Basic Absolute Value Inequalities"
    core: false                # terminal absolute-value solving branch
    difficulty: 0.50
    drill: false
    # Same shape as and-or-inequalities: compound solution sets SymPy cannot parse.
    answer_kind: multi-step
    expected_time_secs: 80
    prerequisites:
      - id: and-or-inequalities
        weight: 0.6
        key: true
      - id: absolute-value
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "|x| < a becomes an 'and' inequality"
        key_prerequisites: [and-or-inequalities]
        exemplars:
          - problem: "Solve $|x|<7$. Give the solution in interval notation."
            answer: "(-7, 7)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $0$ and dividing by positive $1$: $|x| < 7$. Thus $-7 < x < 7$. Subtract $0$ throughout and divide by $1$, preserving both comparisons. The boundary calculation gives $-7 < x < 7$."
          - problem: "Solve $|x|\\le 4$. Give the solution in interval notation."
            answer: "[-4, 4]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $0$ and dividing by positive $1$: $|x| \\le  4$. Thus $-4 \\le  x \\le  4$. Subtract $0$ throughout and divide by $1$, preserving both comparisons. The boundary calculation gives $-4 \\le  x \\le  4$."
          - problem: "Solve $9>|x|$. Give the solution in interval notation."
            answer: "(-9, 9)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $0$ and dividing by positive $1$: $|x| < 9$. Thus $-9 < x < 9$. Subtract $0$ throughout and divide by $1$, preserving both comparisons. The boundary calculation gives $-9 < x < 9$."
          - problem: "Solve $6\\ge |x|$. Give the solution in interval notation."
            answer: "[-6, 6]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $0$ and dividing by positive $1$: $|x| \\le  6$. Thus $-6 \\le  x \\le  6$. Subtract $0$ throughout and divide by $1$, preserving both comparisons. The boundary calculation gives $-6 \\le  x \\le  6$."
        constraints: "less-than gives a bounded interval"
      - id: kp2
        name: "|x| > a becomes an 'or' inequality"
        key_prerequisites: [and-or-inequalities]
        exemplars:
          - problem: "Solve $|x| > 4$."
            answer: "x < -4 or x > 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "A distance greater than 4 from zero places x on the two outer rays. Both endpoints are excluded."
          - problem: "Solve $|x| >= 2$."
            answer: "x <= -2 or x >= 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "A distance at least 2 includes -2 and 2 as well as all points farther from zero."
          - problem: "Solve $6 < |x|$."
            answer: "x < -6 or x > 6"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Read this as distance from zero greater than 6. Use two outer rays and exclude both endpoints."
          - problem: "Solve $7 <= |x|$."
            answer: "x <= -7 or x >= 7"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Distance from zero is at least 7. Include both endpoints and every point farther out."
        constraints: "greater-than gives two rays"
      - id: kp3
        name: "Degenerate cases"
        key_prerequisites: [absolute-value]
        exemplars:
          - problem: "Solve $|x| < -2$."
            answer: "no solution"
            answer_contract: {"kind": "label", "options": [["no solution"], ["all real numbers"]]}
            solution_sketch: "Absolute value is nonnegative, so it cannot be less than -2."
          - problem: "Solve $|x| >= -1$."
            answer: "all real numbers"
            answer_contract: {"kind": "label", "options": [["no solution"], ["all real numbers"]]}
            solution_sketch: "Every absolute value is at least zero, which is already greater than -1."
          - problem: "Classify (a) $|x| <= -4$; (b) $|x| > -3$. Answer a = ...; b = ... using no solution or all real numbers."
            answer: "a = no solution; b = all real numbers"
            answer_contract: {"kind": "multipart", "parts": [{"name": "a", "contract": {"kind": "label", "options": [["no solution"], ["all real numbers"]]}}, {"name": "b", "contract": {"kind": "label", "options": [["no solution"], ["all real numbers"]]}}]}
            solution_sketch: "Absolute value is nonnegative. Part a asks it to be at most -4, which is impossible. Part b asks it to exceed -3, which always holds."
          - problem: "Classify (a) $|x| >= -6$; (b) $|x| < -7$. Answer a = ...; b = ... using no solution or all real numbers."
            answer: "a = all real numbers; b = no solution"
            answer_contract: {"kind": "multipart", "parts": [{"name": "a", "contract": {"kind": "label", "options": [["no solution"], ["all real numbers"]]}}, {"name": "b", "contract": {"kind": "label", "options": [["no solution"], ["all real numbers"]]}}]}
            solution_sketch: "Zero is already greater than both negative bounds. Thus every absolute value meets part a, while none can meet part b."
        constraints: "negative right-hand side only"
    diagnostic_exemplar:
      problem: 'Solve $|x| > 3$.'
      answer_contract: {kind: inequality_union}
      answer: "x < -3 or x > 3"
      solution_sketch: 'Greater-than splits into an "or": the points more than $3$ from zero lie on either side.'
    anki_seeds:
      - front: "Rewrite |X| < a (a > 0) without absolute value:"
        back: "-a < X < a (an AND / conjunction)"
        type: basic
      - front: "Rewrite |X| > a (a > 0) without absolute value:"
        back: "X < -a or X > a (an OR / disjunction)"
        type: basic

  - id: absolute-value-inequalities
    name: "Absolute Value Inequalities"
    core: false
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 110
    prerequisites:
      - id: basic-absolute-value-inequalities
        weight: 0.7
        key: true
      - id: absolute-value-equations
        weight: 0.5
        key: true
      - id: compound-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "|linear| < a"
        key_prerequisites: [basic-absolute-value-inequalities]
        exemplars:
          - problem: "Solve $|x-3|<8$. Give the solution in interval notation."
            answer: "(-5, 11)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $0$ and dividing by positive $1$: $|x-3| < 8$. Thus $-8 < x-3 < 8$. Subtract $-3$ throughout and divide by $1$, preserving both comparisons. The boundary calculation gives $-5 < x < 11$."
          - problem: "Solve $|2x+1|\\le 7$. Give the solution in interval notation."
            answer: "[-4, 3]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $0$ and dividing by positive $1$: $|2x+1| \\le  7$. Thus $-7 \\le  2x+1 \\le  7$. Subtract $1$ throughout and divide by $2$, preserving both comparisons. The boundary calculation gives $-4 \\le  x \\le  3$."
          - problem: "Solve $5>|3x-2|$. Give the solution in interval notation."
            answer: "(-1, 7/3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $0$ and dividing by positive $1$: $|3x-2| < 5$. Thus $-5 < 3x-2 < 5$. Subtract $-2$ throughout and divide by $3$, preserving both comparisons. The boundary calculation gives $-1 < x < 7/3$."
          - problem: "Solve $9\\ge |4-x|$. Give the solution in interval notation."
            answer: "[-5, 13]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $0$ and dividing by positive $1$: $|4-x| \\le  9$. Thus $-9 \\le  4-x \\le  9$. Subtract $4$ throughout and divide by $-1$, reversing both comparisons. The boundary calculation gives $-5 \\le  x \\le  13$."
        constraints: "linear inside; bounded interval answers"
      - id: kp2
        name: "|linear| > a"
        key_prerequisites: [basic-absolute-value-inequalities]
        exemplars:
          - problem: "Solve $|2x+1| >= 5$."
            answer: "x <= -3 or x >= 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Split into 2x+1 <= -5 or 2x+1 >= 5. Subtract 1 and divide by positive 2."
          - problem: "Solve $|x+4| > 2$."
            answer: "x < -6 or x > -2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Split into x+4 < -2 or x+4 > 2. Subtract 4 in each strict branch."
          - problem: "Solve $|3-2x| > 7$."
            answer: "x < -2 or x > 5"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Split into 3-2x < -7 or 3-2x > 7. Subtract 3, divide by -2 and reverse each sign."
          - problem: "Solve $|x/3-2| >= 4$."
            answer: "x <= -6 or x >= 18"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Split into x/3-2 <= -4 or x/3-2 >= 4. Add 2 and multiply by positive 3."
        constraints: "two-ray answers; keep the union"
      - id: kp3
        name: "Isolate the absolute value first"
        key_prerequisites: [absolute-value-equations]
        exemplars:
          - problem: "Solve $2|x-4|+3\\le 15$. Give the solution in interval notation."
            answer: "[-2, 10]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $3$ and dividing by positive $2$: $|x-4| \\le  6$. Thus $-6 \\le  x-4 \\le  6$. Subtract $-4$ throughout and divide by $1$, preserving both comparisons. The boundary calculation gives $-2 \\le  x \\le  10$."
          - problem: "Solve $3|2x+1|-5<16$. Give the solution in interval notation."
            answer: "(-4, 3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $-5$ and dividing by positive $3$: $|2x+1| < 7$. Thus $-7 < 2x+1 < 7$. Subtract $1$ throughout and divide by $2$, preserving both comparisons. The boundary calculation gives $-4 < x < 3$."
          - problem: "Solve $19\\ge 4|x+2|+3$. Give the solution in interval notation."
            answer: "[-6, 2]"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $3$ and dividing by positive $4$: $|x+2| \\le  4$. Thus $-4 \\le  x+2 \\le  4$. Subtract $2$ throughout and divide by $1$, preserving both comparisons. The boundary calculation gives $-6 \\le  x \\le  2$."
          - problem: "Solve $5|3-x|-2<18$. Give the solution in interval notation."
            answer: "(-1, 7)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Isolate the magnitude by subtracting $-2$ and dividing by positive $5$: $|3-x| < 4$. Thus $-4 < 3-x < 4$. Subtract $3$ throughout and divide by $-1$, reversing both comparisons. The boundary calculation gives $-1 < x < 7$."
        constraints: "isolate the absolute value before splitting into cases"
    diagnostic_exemplar:
      problem: 'Solve $2|x - 3| - 1 \le 7$.'
      answer: '-1 <= x <= 7'
      solution_sketch: '$2|x - 3| \le 8$; $|x - 3| \le 4$; $-4 \le x - 3 \le 4$.'
    anki_seeds:
      - front: "Before splitting an absolute value inequality into cases, first ___."
        back: "isolate the absolute value expression on one side"
        type: basic

