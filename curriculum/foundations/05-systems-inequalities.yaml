  - id: substitution-with-isolated-variable
    name: "Substitution with an Isolated Variable"
    core: true
    difficulty: 0.46
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: multi-step-equations
        weight: 0.6
        key: true
      - id: checking-systems-solutions
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Substitute an isolated expression"
        key_prerequisites: [multi-step-equations]
        step_check:
          step: 'Substitute $y = 4x - 7$ into $3x + y = 21$'
          question: 'Why is $y=4x-7$ put into the second equation, not into itself?'
          options:
            - 'The second equation is always the longer one'
            - 'Each equation may be used only once in a system'
            - 'In its own equation it gives $4x-7=4x-7$, nothing new'
            - 'The first equation can only be used for the final step'
          answer: 'In its own equation it gives $4x-7=4x-7$, nothing new'
          why: 'An equation put into itself gives a statement that is always true; only the other equation turns into a new equation with one unknown.'
        try_first:
          problem: 'If $y=x+2$ and $x+y=10$, what is $x$?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'Replacing $y$ by $x+2$ in the second equation gives $2x+2=10$, so $x=4$. An isolated variable can be swapped into the other equation to leave one unknown.'
        exemplars:
          - problem: 'Solve the system $y=2x$, $x+y=18$.'
            answer: '(6, 12)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Replace $y$ by $2x$ in the second equation: $x+2x=18$, so $3x=18$ and $x=6$. Then $y=2(6)=12$.'
          - problem: 'Solve the system $y=x+3$, $2x+y=12$.'
            answer: '(3, 6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Replace $y$ by $x+3$ in the second equation: $2x+x+3=12$, so $3x=9$ and $x=3$. Then $y=3+3=6$.'
          - problem: 'Solve the system $x=2y-1$, $x+3y=14$.'
            answer: '(5, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Replace $x$ by $2y-1$ in the second equation: $2y-1+3y=14$, so $5y=15$ and $y=3$. Then $x=2(3)-1=5$.'
          - problem: 'Solve the system $y=9-2x$, $3x-y=11$.'
            answer: '(4, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Replace $y$ by $9-2x$ in the second equation: $3x-(9-2x)=11$, so $5x=20$ and $x=4$. Then $y=9-2(4)=1$.'
          - problem: 'A class has 28 students. There are 4 more girls than boys. How many girls are in the class?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $b$ be the number of boys and $g$ the number of girls, so $g=b+4$ and $g+b=28$. Substituting gives $2b+4=28$, so $b=12$. Then $g=12+4=16$.'
          - problem: 'A rectangle has a perimeter of 54 cm, and its length is twice its width. How long is the rectangle?'
            answer: '18'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'With $l=2w$ the perimeter equation $2l+2w=54$ becomes $6w=54$, so $w=9$ cm. Then $l=2(9)=18$ cm.'
          - problem: 'A family buys 3 adult tickets and 2 child tickets for 52 dollars. A child ticket costs 4 dollars less than an adult ticket. What does an adult ticket cost?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $a$ be the adult price and $c$ the child price, so $c=a-4$. Then $3a+2(a-4)=52$, so $5a=60$ and $a=12$ dollars.'
        constraints: "one equation already solved for a variable; integer solutions"
      - id: kp2
        name: "Equal-values method"
        key_prerequisites: [multi-step-equations]
        step_check:
          step: 'Set the expressions equal'
          question: 'Why can the two expressions for $y$ be set equal?'
          options:
            - 'At the solution both equal the one value of $y$'
            - 'Both expressions always have the same slope'
            - 'Expressions for the same variable are always equal'
            - 'The $x$ terms must cancel in any system'
          answer: 'At the solution both equal the one value of $y$'
          why: 'The solution has one value of $y$, and each equation says that value equals its expression, so the two expressions agree there.'
        exemplars:
          - problem: 'Solve the system $y=3x-2$, $y=x+4$.'
            answer: '(3, 7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Both expressions equal $y$, so $3x-2=x+4$. Then $2x=6$ and $x=3$, and $y=3(3)-2=7$.'
          - problem: 'Solve the system $y=5x$, $y=2x+9$.'
            answer: '(3, 15)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Both expressions equal $y$, so $5x=2x+9$. Then $3x=9$ and $x=3$, and $y=5(3)=15$.'
          - problem: 'Taxi Zip charges 4 dollars plus 2 dollars per kilometer, so $y=2x+4$ for $x$ kilometers. Taxi Zoom charges 1 dollar plus 3 dollars per kilometer, so $y=3x+1$. For what distance do the two taxis cost the same?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The costs are equal when $2x+4=3x+1$, so $x=3$. The taxis cost the same for 3 km.'
          - problem: 'Solve the system $y=2x+1$, $y=x+6$.'
            answer: '(5, 11)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Both expressions equal $y$, so $2x+1=x+6$ and $x=5$. Then $y=2(5)+1=11$, which matches $5+6=11$.'
          - problem: 'Mia has 90 dollars and spends 10 dollars a week, so $y=90-10x$ after $x$ weeks. Sam has 40 dollars and saves 15 dollars a week, so $y=40+15x$. After how many weeks do they have the same amount?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The amounts are equal when $90-10x=40+15x$, so $50=25x$ and $x=2$ weeks. Each then has 70 dollars.'
          - problem: 'Solve the system $y=4x$, $y=x+9$.'
            answer: '(3, 12)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Both expressions equal $y$, so $4x=x+9$. Then $3x=9$ and $x=3$, and $y=4(3)=12$.'
          - problem: 'Shop A charges 30 dollars to set up plus 0.50 dollars per copy, so $y=30+0.5x$ for $x$ copies. Shop B charges 10 dollars plus 1.50 dollars per copy, so $y=10+1.5x$. For how many copies do the two shops charge the same?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The charges are equal when $30+0.5x=10+1.5x$, so $20=x$. For 20 copies each shop charges 40 dollars.'
          - problem: 'Solve the system $y=-2x+7$, $y=x-5$.'
            answer: '(4, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Both expressions equal $y$, so $-2x+7=x-5$. Then $12=3x$ and $x=4$, and $y=4-5=-1$.'
        constraints: "both equations solved for y; set them equal"
      - id: kp3
        name: "Back-substitute and check"
        key_prerequisites: [checking-systems-solutions]
        step_check:
          step: 'Check in $4x + y = 21$'
          question: 'Why is the check made in $4x+y=21$ and not in $y=2x-9$?'
          options:
            - 'A check is always made in the longer equation'
            - 'The equation $y=2x-9$ cannot be checked'
            - 'Only the second equation of a system ever needs a check'
            - 'It fits $y=2x-9$ already, because $y$ came from it'
          answer: 'It fits $y=2x-9$ already, because $y$ came from it'
          why: 'The pair fits $y=2x-9$ by construction, so only the other equation can show a slip in solving for $x$.'
        exemplars:
          - problem: 'Solve the system $y=x-3$, $x+2y=15$ and check the solution in both equations.'
            answer: '(7, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Substituting gives $x+2(x-3)=15$, so $3x=21$ and $x=7$. Then $y=7-3=4$. Check: $4=7-3$ and $7+2(4)=15$.'
          - problem: 'Solve the system $x=3y$, $2x-y=20$.'
            answer: '(12, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Substitute $3y$ for $x$ in the second equation: $6y-y=20$, so $y=4$. Then $x=3(4)=12$. Check: $2(12)-4=20$.'
          - problem: 'Solve the system $y=8-x$, $2x-3y=1$.'
            answer: '(5, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Replace $y$ by $8-x$ in the second equation: $2x-3(8-x)=1$, so $5x=25$ and $x=5$. Then $y=8-5=3$. Check: $2(5)-3(3)=1$.'
          - problem: 'Solve the system $x=2y+5$, $3x+y=8$.'
            answer: '(3, -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Substitute $2y+5$ for $x$: $3(2y+5)+y=8$, so $7y=-7$ and $y=-1$. Then $x=2(-1)+5=3$. Check: $3(3)+(-1)=8$.'
          - problem: 'A notebook costs 3 dollars more than a pen. Two pens and three notebooks cost 29 dollars together. What does a notebook cost?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $n=p+3$. Then $2p+3(p+3)=29$, so $5p=20$ and $p=4$. A notebook costs $4+3=7$ dollars. Check: $2(4)+3(7)=29$.'
          - problem: 'Lena solves the system $y=2x-3$, $x+y=12$ and gets $(4,5)$. Check her answer and find the correct solution.'
            answer: '(5, 7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The pair $(4,5)$ satisfies $y=2x-3$ but not $x+y=12$, since $4+5=9$. Substituting gives $x+2x-3=12$, so $x=5$ and $y=7$.'
          - problem: 'An apple costs twice as much as a pear. Six apples and five pears cost 34 dollars. What does an apple cost?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $a=2p$. Then $6(2p)+5p=34$, so $17p=34$ and $p=2$. An apple costs $2(2)=4$ dollars.'
        constraints: "verify the pair in the equation not used for back-substitution"
    diagnostic_exemplar:
      problem: 'Solve the system $y = 3x$ and $x + y = 12$.'
      answer: "(3, 9)"
      solution_sketch: '$x + 3x = 12$; $x = 3$; $y = 9$.'
    anki_seeds:
      - front: "Substitution method for a system of equations:"
