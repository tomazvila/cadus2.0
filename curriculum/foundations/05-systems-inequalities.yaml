  - id: substitution-with-isolated-variable
    name: "Substitution with an Isolated Variable"
    core: true
    difficulty: 0.46
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: multi-step-equations
        weight: 0.6
        key: true
      - id: checking-systems-solutions
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Substitute an isolated expression"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Solve the system $y = 2x$, $x + y = 9$.'
            answer: "(3, 6)"
            answer_contract: {kind: exact}
            solution_sketch: '$x + 2x = 9$; $x = 3$; $y = 6$.'
          - problem: 'Solve the system $y = x + 1$, $2x + y = 7$.'
            answer: "(2, 3)"
            answer_contract: {kind: exact}
            solution_sketch: '$2x + x + 1 = 7$; $3x = 6$; $x = 2$; $y = 3$.'
          - problem: 'Solve the system $y = 3x$, $x + y = 12$.'
            answer: "(3, 9)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$x + 3x = 12$; $x = 3$; $y = 9$.'
          - problem: 'Solve the system $y = x + 2$, $3x + y = 10$.'
            answer: "(2, 4)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$3x + x + 2 = 10$; $4x = 8$; $x = 2$; $y = 4$.'
        constraints: "one equation already solved for a variable; integer solutions"
      - id: kp2
        name: "Equal-values method"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Solve the system $y = 3x - 2$, $y = x + 4$.'
            answer: "(3, 7)"
            answer_contract: {kind: exact}
            solution_sketch: '$3x - 2 = x + 4$; $2x = 6$; $x = 3$; $y = 7$.'
          - problem: 'Solve the system $y = 5x$, $y = 2x + 9$.'
            answer: "(3, 15)"
            answer_contract: {kind: exact}
            solution_sketch: '$5x = 2x + 9$; $3x = 9$; $x = 3$; $y = 15$.'
          - problem: 'Solve the system $y = 2x + 1$, $y = x + 6$.'
            answer: "(5, 11)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$2x + 1 = x + 6$; $x = 5$; $y = 11$.'
          - problem: 'Solve the system $y = 4x$, $y = x + 9$.'
            answer: "(3, 12)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$4x = x + 9$; $3x = 9$; $x = 3$; $y = 12$.'
        constraints: "both equations solved for y; set them equal"
      - id: kp3
        name: "Back-substitute and check"
        key_prerequisites: [checking-systems-solutions]
        exemplars:
          - problem: 'Solve the system $y = x - 2$, $x + 2y = 11$ and check your answer.'
            answer: "(5, 3)"
            answer_contract: {kind: exact}
            solution_sketch: '$x + 2(x - 2) = 11$; $3x = 15$; $x = 5$; $y = 3$; check $5 + 6 = 11$.'
          - problem: 'Solve the system $y = 4x$, $x + y = 15$ and check your answer.'
            answer: "(3, 12)"
            answer_contract: {kind: exact}
            solution_sketch: '$x + 4x = 15$; $5x = 15$; $x = 3$; $y = 12$; check $3 + 12 = 15$.'
          - problem: 'Solve the system $y = x - 3$, $x + 2y = 9$ and check your answer.'
            answer: "(5, 2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$x + 2(x - 3) = 9$; $3x = 15$; $x = 5$; $y = 2$; check $5 + 4 = 9$.'
          - problem: 'Solve the system $y = 3x$, $x + y = 20$ and check your answer.'
            answer: "(5, 15)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$4x = 20$; $x = 5$; $y = 15$; check $x + y = 20$: $5 + 15 = 20$.'
        constraints: "verify the pair in the equation not used for back-substitution"
    diagnostic_exemplar:
      problem: 'Solve the system $y = 3x$ and $x + y = 12$.'
      answer: "(3, 9)"
      solution_sketch: '$x + 3x = 12$; $x = 3$; $y = 9$.'
