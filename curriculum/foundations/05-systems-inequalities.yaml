unit: systems-inequalities
course: foundations
module: "Systems & Inequalities"
topics:
  - id: solutions-of-inequalities
    name: "Solutions of Inequalities"
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 50
    prerequisites:
      - id: evaluating-expressions
        weight: 0.6
        key: true
      - id: number-line-integers
        weight: 0.4
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Inequality statements true or false"
        key_prerequisites: [number-line-integers]
        step_check:
          step: 'On the number line, $-4$ lies to the right of $-8$'
          question: 'Why does $-4$ lie to the right of $-8$ on the number line?'
          options:
            - 'Because $4$ is less than $8$, so $-4$ is less than $-8$ as well'
            - 'Because $-4$ is closer to zero, and numbers grow to the right'
            - 'Because a minus sign always moves a number to the right of zero'
            - 'Because $-8$ is written second, so it is placed on the left side'
          answer: 'Because $-4$ is closer to zero, and numbers grow to the right'
          why: 'Numbers increase from left to right, and $-4$ is closer to zero than $-8$, so it is the greater number.'
        exemplars:
          - problem: 'Is the statement $-4<-9$ true or false?'
            answer: 'false'
            answer_contract: {"kind":"label","options":[["true","yes","correct","it is true","holds"],["false","no","incorrect","it is false","not true","wrong"]]}
            solution_sketch: 'On the number line $-4$ lies to the right of $-9$, so $-4$ is the greater number. A less-than sign needs the left number to be the smaller one, so the statement is false.'
          - problem: 'At dawn the temperature was $-8$ degrees Celsius and at noon it was $-2$ degrees Celsius. What was the lower of the two temperatures?'
            answer: '-8'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"\u00b0C","allow_omitted":true}
            solution_sketch: 'On the number line $-8$ lies to the left of $-2$. The number further left is the smaller one, so the lower temperature is $-8$ degrees Celsius.'
          - problem: 'Which is the greater number, $-11$ or $-6$?'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the number line $-6$ lies to the right of $-11$. The number further right is the greater one, so $-6$ is greater than $-11$.'
          - problem: 'A diver is at $-12$ m and a submarine is at $-20$ m, measured from the surface. Which one is deeper?'
            answer: 'submarine'
            answer_contract: {"kind":"label","options":[["submarine","the submarine"],["diver","the diver"]]}
            solution_sketch: 'The reading $-20$ lies to the left of $-12$, so $-20$ is the smaller number. A smaller reading means further below the surface, so the submarine is deeper.'
          - problem: 'Sam says $-15>-3$ because $15$ is greater than $3$. Which of the two numbers $-15$ and $-3$ is actually the greater one?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam looked at the digits and forgot the minus signs. On the number line $-3$ lies to the right of $-15$, so $-3$ is the greater number.'
          - problem: 'Give an integer $n$ with $-9<n<-6$.'
            answer: '-7'
            answer_contract: {"kind":"property","check":"integer_in_range","args":{"min":-8,"max":-7}}
            solution_sketch: 'The integers between $-9$ and $-6$, not counting the two ends, are $-8$ and $-7$. Either one works, since $-9<-7<-6$.'
          - problem: 'Which is the greater number, $-2.5$ or $-2.05$?'
            answer: '-2.05'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the number line $-2.05$ lies closer to zero than $-2.5$, so it lies to the right. The number further right is the greater one, so $-2.05$ is greater.'
        constraints: "integer comparisons; include negatives"
      - id: kp2
        name: "Test a value in an inequality"
        key_prerequisites: [evaluating-expressions]
        step_check:
          step: 'which allows equality'
          question: 'Why is $x=4$ a solution when both sides of $5x-2\le18$ equal $18$?'
          options:
            - 'The sign $\le$ means less than or equal, so equal sides count'
            - 'Because equal sides never count, so $x=4$ is not really a solution'
            - 'Because $18$ is much greater than the $2$ in the expression'
            - 'Because every value of $x$ gives equal sides in this inequality'
          answer: 'The sign $\le$ means less than or equal, so equal sides count'
          why: 'The sign $\le$ is true when the left side is smaller than or equal to the right side, and here $18=18$.'
        exemplars:
          - problem: 'Is $x=3$ a solution of $2x+4\le11$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","true","correct","yes, it is","it is a solution"],["no","it is not","false","incorrect","no, it is not","it is not a solution","not a solution"]]}
            solution_sketch: 'Substitute $x=3$ into the left side: $2(3)+4=10$. Since $10\le11$ is true, $x=3$ is a solution.'
          - problem: 'Which of the numbers $2$, $4$ and $6$ is a solution of $3x-2>14$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute each number into $3x-2$. For $x=2$ the value is $4$, for $x=4$ it is $10$ and for $x=6$ it is $16$. Only $16>14$ is true, so the solution is $6$.'
          - problem: 'A lift is allowed to carry at most $600$ kg and each crate weighs $85$ kg. Which is the greatest of these loads that the lift is allowed to carry: $6$, $7$ or $8$ crates?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Find the total weight of each load: $6\cdot85=510$, $7\cdot85=595$ and $8\cdot85=680$ kilograms. The loads of $6$ and $7$ crates are at most $600$ kg and $8$ crates are over the limit, so the greatest allowed number is $7$.'
          - problem: 'Sam tests $x=-2$ in $7-x<8$ and writes $7-(-2)=5$. What is the correct value of $7-x$ at $x=-2$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting a negative number means adding its opposite, so $7-(-2)=7+2=9$. Sam subtracted $2$ instead of adding it. Since $9<8$ is false, $-2$ is not a solution.'
          - problem: 'A ride requires riders to be at least $120$ cm tall. Mia is $118$ cm tall. Does she meet the requirement?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","she does","true","correct","yes, she does"],["no","she does not","false","incorrect","no, she does not"]]}
            solution_sketch: 'The requirement is $h\ge120$, where $h$ is the height in centimetres. For Mia $118\ge120$ is false, so she does not meet the requirement.'
          - problem: 'Give a whole number that is a solution of $x+5<9$.'
            answer: '2'
            answer_contract: {"kind":"property","check":"integer_in_range","args":{"min":0,"max":3}}
            solution_sketch: 'Substitute a whole number into $x+5$ and compare with $9$. For $x=2$ the value is $7$, and $7<9$ is true. The whole numbers $0$, $1$, $2$ and $3$ all work.'
          - problem: 'Test the numbers $8$, $10$ and $12$ in $\frac{x}{4}\ge3$. Which one is a solution?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide each number by $4$: $8\div4=2$, $10\div4=2.5$ and $12\div4=3$. Only $12$ gives a value that is at least $3$, so $12$ is the solution.'
        constraints: "substitute and compare; yes/no answers"
      - id: kp3
        name: "Boundary values and strictness"
        key_prerequisites: [evaluating-expressions]
        try_first:
          problem: 'Is $x=2$ a solution of $x+3<5$?'
          answer_contract: {"kind":"label","options":[["yes","it is","true","correct","yes, it is","it is a solution"],["no","it is not","false","incorrect","no, it is not","it is not a solution","not a solution"]]}
          answer: 'no'
          reveal: 'No: at $x=2$ the two sides are equal, since $2+3=5$, and a strict sign needs the left side to be smaller. Equal sides count only for $\le$ and $\ge$.'
        step_check:
          step: 'the boundary $x = 5$ is not included'
          question: 'Why is $x=5$ left out of the solutions of $3x-4<11$?'
          options:
            - 'Because $5$ solves the equation, and these are never solutions of the inequality'
            - 'Because $<$ allows only numbers larger than $5$ and no smaller ones'
            - 'At $x=5$ both sides equal $11$, and a strict sign needs the left side smaller'
            - 'Because boundaries are always left out, whatever sign is written'
          answer: 'At $x=5$ both sides equal $11$, and a strict sign needs the left side smaller'
          why: 'Strict signs $<$ and $>$ need the sides to differ, but at $x=5$ both sides are $11$; with $\le$ the boundary would count.'
        exemplars:
          - problem: 'What is the boundary value of $x+2\le6$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The boundary is where the two sides are equal, so solve $x+2=6$ and get $x=4$. Because the sign is $\le$, the boundary $4$ is itself a solution.'
          - problem: 'Is $x=-6$ a solution of $\frac{x}{3}\ge-2$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","true","correct","yes, it is","it is a solution"],["no","it is not","false","incorrect","no, it is not","it is not a solution","not a solution"]]}
            solution_sketch: 'Substitute $x=-6$: $\frac{-6}{3}=-2$. The comparison $-2\ge-2$ is true because $\ge$ allows equal sides, so $x=-6$ is a solution.'
          - problem: 'What is the greatest whole number that satisfies $2x<12$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The boundary is $x=6$, and the strict sign $<$ leaves it out. So the greatest whole number that works is the one just below it, $5$.'
          - problem: 'What is the greatest integer that satisfies $7-x\ge10$?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $7-x=10$ to get the boundary $x=-3$. The sign $\ge$ includes it, and $7-(-3)=10$ makes the comparison true. The next integer, $-2$, gives $9\ge10$, which is false, so the greatest integer is $-3$.'
          - problem: 'A bridge is only for vehicles lighter than $12$ tonnes. A truck weighs exactly $12$ tonnes. Is the truck allowed on the bridge?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","true","correct","yes, it is","it is allowed"],["no","it is not","false","incorrect","no, it is not","it is not allowed","not allowed"]]}
            solution_sketch: 'Lighter than $12$ tonnes is the strict condition $w<12$. For the truck, $12<12$ is false, so the truck is not allowed.'
          - problem: 'Tickets cost $4$ dollars each. Ana wants to spend less than $30$ dollars. What is the greatest number of tickets she can buy?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cost of $t$ tickets is $4t$, and $4t<30$ gives $t<7.5$. The greatest whole number below $7.5$ is $7$, and $7$ tickets cost $28$ dollars.'
          - problem: 'Pens cost $3$ dollars each and Ben has $20$ dollars. What is the greatest number of pens he can buy?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cost of $p$ pens is $3p$, and $3p\le20$ gives $p\le6\frac{2}{3}$. The greatest whole number allowed is $6$, and $6$ pens cost $18$ dollars.'
          - problem: 'What is the boundary value of $\frac{x}{3}>-2$?'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Solve the matching equation $\frac{x}{3}=-2$ by multiplying both sides by $3$, which gives $x=-6$. The strict sign $>$ leaves the boundary $-6$ out of the solutions.'
        constraints: "contrast strict vs inclusive at the boundary"
    diagnostic_exemplar:
      problem: 'Is $x = -2$ a solution of $3x + 1 \ge -5$?'
      answer_contract: {kind: label, options: [[yes], [no]]}
      answer: "yes"
      solution_sketch: '$3(-2) + 1 = -5$, and $-5 \ge -5$ is true.'
    anki_seeds:
      - front: "Of x < a and x <= a, which includes the boundary value a?"
        back: "only x <= a (inclusive); < and > exclude the boundary"
        type: basic

  - id: graphing-inequalities-number-line
    name: "Graphing Inequalities on a Number Line"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: solutions-of-inequalities
        weight: 0.7
        key: true
      - id: number-line-integers
        weight: 0.4
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[],"intervals":[],"rays":[{"from":"3","direction":"right","filled":true,"label":"x ≥ 3"}],"caption":"A filled circle at 3 with a ray to the right shows x ≥ 3. The circle is filled because 3 is included in the solutions. An open circle would leave 3 out."}]
        name: "Open vs closed circle"
        key_prerequisites: [solutions-of-inequalities]
        try_first:
          problem: 'On the graph of $x\le6$, is the number $6$ itself shaded?'
          answer_contract: {"kind":"label","options":[["yes","it is","true","correct","yes, it is","it is a solution"],["no","it is not","false","incorrect","no, it is not","it is not a solution","not a solution"]]}
          answer: 'yes'
          reveal: 'Yes: $6\le6$ is true, so $6$ is a solution and its circle is closed, which means shaded. With $x<6$ the circle would be open and $6$ would not be shaded.'
        step_check:
          step: 'Use a closed circle at $-4$'
          question: 'Why does the graph of $x\ge-4$ need a closed circle at $-4$?'
          options:
            - 'Because the ray goes right, and rays going right always start closed'
            - 'Because $-4$ is a solution itself, so the circle is filled in'
            - 'Because $-4$ is negative and negative numbers get filled circles'
            - 'Because $\ge$ means greater than, which leaves out $-4$ itself'
          answer: 'Because $-4$ is a solution itself, so the circle is filled in'
          why: 'A filled circle says the boundary belongs to the solutions, and $-4\ge-4$ is true.'
        exemplars:
          - problem: 'To graph $x\ge-4$ on a number line, is the circle at $-4$ open or closed?'
            answer: 'closed'
            answer_contract: {"kind":"label","options":[["closed","closed circle","filled","filled in","solid","shaded"],["open","open circle","hollow","empty","unfilled"]]}
            solution_sketch: 'The sign $\ge$ allows equality, so $-4$ is itself a solution. A solution is marked with a closed, filled circle, so the circle is closed.'
          - problem: 'A sign says that children under $12$ ride free. The ages $a$ that ride free satisfy $a<12$. On a number line graph, is the circle at $12$ open or closed?'
            answer: 'open'
            answer_contract: {"kind":"label","options":[["open","open circle","hollow","empty","unfilled"],["closed","closed circle","filled","filled in","solid","shaded"]]}
            solution_sketch: 'A child who is exactly $12$ does not ride free, because $12<12$ is false. The boundary is not a solution, so the circle at $12$ is open.'
          - problem: 'Sam graphs $x<3$ with a closed circle at $3$. Which number does his graph include that $x<3$ does not?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A closed circle at $3$ marks $3$ as a solution. But $3<3$ is false, so $3$ is not a solution of $x<3$, and Sam''s graph wrongly includes it.'
          - problem: 'The graphs of $x\ge2$ and $x>2$ differ in exactly one number. Which number is it?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both graphs shade every number greater than $2$. Only $x\ge2$ also includes $2$ itself, so the two graphs differ at the number $2$.'
          - problem: 'A lift is allowed to carry at most $600$ kg and each crate weighs $75$ kg, so the number of crates $c$ satisfies $75c\le600$. At which number does the circle go on the graph of $c$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide both sides by $75$ to get $c\le8$, because $600\div75=8$. The boundary is $8$, so the circle goes at $8$ and it is closed.'
          - problem: 'Cheese costs $4$ dollars per kilogram and Ana has less than $30$ dollars, so the mass $k$ she can buy satisfies $4k<30$. At which number does the circle go on the graph of $k$?'
            answer: '7.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide both sides by $4$ to get $k<7.5$, because $30\div4=7.5$. The boundary is $7.5$, so the circle goes at $7.5$ and it is open.'
        constraints: "closed for <= or >=; open for < or >"
      - id: kp2
        visuals: [{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[],"intervals":[],"rays":[{"from":"-2","direction":"left","filled":false,"label":"x < -2"}],"caption":"An open circle at -2 with a ray to the left shows x < -2. The ray points left because the solutions are the numbers less than -2."}]
        name: "Direction of the ray"
        key_prerequisites: [solutions-of-inequalities]
        step_check:
          step: 'values greater than $100$, which lie to its right'
          question: 'Why do values greater than $100$ lie to the right of $100$?'
          options:
            - 'Because $100$ is a large number, so the graph is drawn on the right'
            - 'Because only positive values are shaded, and these lie on the right'
            - 'Because numbers grow from left to right, larger ones lie right'
            - 'Because the sign $\ge$ always points right, whatever number is written'
          answer: 'Because numbers grow from left to right, larger ones lie right'
          why: 'On a number line the numbers increase towards the right, so everything greater than $100$ sits to its right; for $x\le100$ the ray would point left.'
        exemplars:
          - problem: 'When $x>4$ is graphed on a number line, does the ray point left or right?'
            answer: 'right'
            answer_contract: {"kind":"label","options":[["right","to the right","right side"],["left","to the left","left side"]]}
            solution_sketch: 'The solutions are the numbers greater than $4$. Greater numbers lie to the right on a number line, so the ray points right.'
          - problem: 'Which of the numbers $-5$, $-1$ and $0$ lies on the graph of $x\le-2$?'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph of $x\le-2$ is a ray to the left of $-2$, with $-2$ included. Of the three numbers only $-5$ is less than or equal to $-2$.'
          - problem: 'Which of the numbers $6$, $8$ and $10$ lies on the graph of $8>x$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The statement $8>x$ says that $8$ is greater than $x$, so $x$ is less than $8$. The graph is a ray pointing left from an open circle at $8$, so $8$ is not on it. Of the three numbers only $6$ lies on the graph.'
          - problem: 'A freezer must stay at or below $-18$ degrees, so the allowed temperatures $t$ satisfy $t\le-18$. Does the ray of the graph point left or right?'
            answer: 'left'
            answer_contract: {"kind":"label","options":[["left","to the left","left side"],["right","to the right","right side"]]}
            solution_sketch: 'The allowed temperatures are the numbers less than or equal to $-18$. Smaller numbers lie to the left, so the ray points left from $-18$.'
          - problem: 'Pens cost $2$ dollars each and a shopper wants to spend at least $18$ dollars on pens, so the number of pens $p$ satisfies $2p\ge18$. At which number does the ray of the graph start?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide both sides by $2$ to get $p\ge9$, because $18\div2=9$. The ray starts at $9$ and points to the right.'
          - problem: 'Sam graphs $x\ge-5$ with a ray pointing left. Which of the numbers $-8$ and $-2$ does his graph shade although it is not a solution?'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The solutions of $x\ge-5$ are the numbers to the right of $-5$. Sam''s ray points left, so it shades $-8$, and $-8\ge-5$ is false.'
        constraints: "> and >= point right; < and <= point left"
      - id: kp3
        visuals: [{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[],"intervals":[],"rays":[{"from":"1","direction":"right","filled":true}],"caption":"A closed circle at 1 with a ray to the right. The circle is closed, so 1 is included, and the ray points right, so the graph holds the numbers greater than 1."}]
        name: "Read the inequality from a graph"
        key_prerequisites: [solutions-of-inequalities]
        step_check:
          step: 'An open circle excludes the endpoint, so the comparison is strict'
          question: 'Why does an open circle at $30$ lead to $x>30$ and not $x\ge30$?'
          options:
            - 'The open circle leaves $30$ out, and only a strict sign does that'
            - 'The open circle shows the ray is short, so the sign must be strict'
            - 'The open circle shows $30$ is a solution, and $\ge$ would exclude it'
            - 'Open circles go with right rays, and $\ge$ goes with left rays'
          answer: 'The open circle leaves $30$ out, and only a strict sign does that'
          why: 'An open circle means $30$ is not a solution, and $30>30$ is false while $30\ge30$ is true, so the sign is $>$.'
        exemplars:
          - problem: 'A number line shows a closed circle at $-1$ with a ray to the left. Write the inequality.'
            answer: 'x <= -1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The closed circle includes $-1$, so the sign allows equality. The ray to the left shows numbers less than $-1$, so the inequality is $x\le-1$.'
          - problem: 'A number line shows an open circle at $4$ with a ray to the right. Write the inequality.'
            answer: 'x > 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The open circle leaves $4$ out, so the sign is strict. The ray to the right shows numbers greater than $4$, so the inequality is $x>4$.'
          - problem: 'The graph of the number $n$ of passengers allowed on a boat has a closed circle at $12$ and a ray to the left. Write the inequality for $n$.'
            answer: 'n <= 12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The closed circle includes $12$, and the ray to the left shows smaller numbers. So the number of passengers satisfies $n\le12$.'
          - problem: 'A number line shows a closed circle at $2$ with a ray to the right. Write the inequality.'
            answer: 'x >= 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The closed circle includes $2$, so the sign allows equality. The ray to the right shows numbers greater than $2$, so the inequality is $x\ge2$.'
          - problem: 'The graph of the storage temperature $t$ of a medicine has an open circle at $8$ and a ray to the left. Write the inequality for $t$.'
            answer: 't < 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The open circle leaves $8$ out, so the sign is strict. The ray to the left shows smaller numbers, so the temperature satisfies $t<8$.'
          - problem: 'A number line shows an open circle at $-5$ with a ray to the left. Sam writes $x>-5$. What is the correct inequality?'
            answer: 'x < -5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The open circle leaves $-5$ out, so the sign is strict. The ray to the left shows numbers less than $-5$, so the correct inequality is $x<-5$. Sam turned the sign the wrong way.'
        constraints: "single ray; integer endpoint"
    diagnostic_exemplar:
      problem: 'A number line shows an open circle at $-3$ with a ray to the right. Write the inequality.'
      answer: 'x > -3'
      solution_sketch: 'An open circle means strict, and a ray to the right means greater than.'
    anki_seeds:
      - front: "Number-line graphs of inequalities: open circle = ___, closed circle = ___."
        back: "strict (< or >); inclusive (<= or >=)"
        type: basic

  - id: one-step-inequalities
    name: "One-Step Inequalities"
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: one-step-equations
        weight: 0.6
        key: true
      - id: solutions-of-inequalities
        weight: 0.5
        key: true
      - id: graphing-inequalities-number-line
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Add or subtract on both sides"
        key_prerequisites: [one-step-equations]
        step_check:
          step: 'Add $7$ to both sides'
          question: 'Why does the sign stay $\ge$ when $7$ is added to both sides of $x-7\ge-2$?'
          options:
            - 'Adding the same number to both sides keeps their order, so the sign is kept'
            - 'Adding $7$ cancels the $-7$ and so turns the sign into an equals sign'
            - 'Adding a number to both sides always reverses the sign, and it is reversed twice'
            - 'The sign stays only because $-2$ is a negative number on the right side'
          answer: 'Adding the same number to both sides keeps their order, so the sign is kept'
          why: 'Moving both sides up by the same amount does not change which is greater, so the sign is kept.'
        exemplars:
          - problem: 'Solve $x+8\le21$.'
            answer: 'x <= 13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $8$ from both sides, because that undoes the addition of $8$: $x\le21-8$. This gives $x\le13$. Subtracting the same number from both sides keeps the sign.'
          - problem: 'Solve $x-7>9$.'
            answer: 'x > 16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $7$ to both sides, because that undoes the subtraction of $7$: $x>9+7$. This gives $x>16$. Adding the same number to both sides keeps the sign.'
          - problem: 'Solve $13<x+2$.'
            answer: 'x > 11'
            answer_contract: {"kind":"exact"}
