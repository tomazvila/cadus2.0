            answer: "residuals = (0,0); solution = yes"
            solution_sketch: "Insert horizontal coordinate 2 and vertical coordinate 5 into each equation. The first left-minus-right difference is 0; the second is 0. Both differences vanish, so the point lies on both lines."
            answer_contract: {"kind": "multipart", "parts": [{"name": "residuals", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "solution", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
          - problem: "Check the proposed point $(-1,4)$ in $3x+y=1$ and $2x-y=-7$. Report residuals as the ordered pair of left-side-minus-right-side differences for each equation after substitution; report solution as yes or no."
            answer: "residuals = (0,1); solution = no"
            solution_sketch: "Insert horizontal coordinate -1 and vertical coordinate 4 into each equation. The first left-minus-right difference is 0; the second is 1. A nonzero difference means that equation fails, so the pair cannot solve the system."
            answer_contract: {"kind": "multipart", "parts": [{"name": "residuals", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "solution", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
