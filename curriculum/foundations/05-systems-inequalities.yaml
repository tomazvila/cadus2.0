            solution_sketch: "Insert horizontal coordinate 3 and vertical coordinate -1 into each equation. The first left-minus-right difference is 1; the second is 0. A nonzero difference means that equation fails, so the pair cannot solve the system."
            answer_contract: {"kind": "multipart", "parts": [{"name": "residuals", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "solution", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
        constraints: "one equation passes, the other fails"
      - id: kp3
        name: "Pick the solution from candidates"
        key_prerequisites: [solutions-of-two-variable-equations]
        exemplars:
          - problem: "Which of $(1,4)$ or $(2,6)$ satisfies both $y=2x+2$ and $x+y=5$? Give the ordered pair."
            answer: "(1,4)"
            solution_sketch: "The first candidate gives $4=2(1)+2$ and $1+4=5$. The second lies on the first line but its coordinate sum is eight, so it fails the other equation."
            answer_contract: {"kind": "coordinates", "arity": 2}
          - problem: "Which of $(3,2)$ or $(-2,1)$ satisfies both $x+3y=1$ and $2x-y=-5$? Give the ordered pair."
            answer: "(-2,1)"
            solution_sketch: "The second candidate gives $-2+3(1)=1$ and $2(-2)-1=-5$. The first has coordinate sum with triple height equal to nine, so it fails the first equation."
            answer_contract: {"kind": "coordinates", "arity": 2}
          - problem: "Which of $(4,-1)$ or $(2,1)$ satisfies both $x/2+y=1$ and $x-y=5$? Give the ordered pair."
            answer: "(4,-1)"
            solution_sketch: "The first candidate gives $4/2+(-1)=1$ and $4-(-1)=5$. The second gives a difference of one, so it cannot satisfy both equations."
            answer_contract: {"kind": "coordinates", "arity": 2}
          - problem: "Which of $(0,3)$ or $(5,2)$ satisfies both $x=3y-1$ and $x+2y=9$? Give the ordered pair."
            answer: "(5,2)"
            solution_sketch: "The second candidate gives $5=3(2)-1$ and $5+2(2)=9$. The first would require the horizontal coordinate to be eight, so it fails."
            answer_contract: {"kind": "coordinates", "arity": 2}
        constraints: "two candidates; exactly one works"
    diagnostic_exemplar:
      problem: 'Which of $(1, 4)$ or $(3, 2)$ solves the system $x + y = 5$ and $2x - y = 4$?'
      answer: '(3, 2)'
      solution_sketch: '$(1, 4)$ fails the second equation ($2 - 4 = -2$); $(3, 2)$ satisfies both.'
    anki_seeds:
      - front: "An ordered pair is a solution of a system only if it satisfies ___."
        back: "every equation in the system"
        type: basic

