unit: systems-inequalities
course: foundations
module: "Systems & Inequalities"
topics:
  - id: solutions-of-inequalities
    name: "Solutions of Inequalities"
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 50
    prerequisites:
      - id: evaluating-expressions
        weight: 0.6
        key: true
      - id: number-line-integers
        weight: 0.4
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Inequality statements true or false"
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Is the statement $-3 < -5$ true or false?'
            answer: "false"
            solution_sketch: '$-3$ is to the right of $-5$ on the number line.'
          - problem: 'True or false: $4 \ge 4$?'
            answer: "true"
        constraints: "integer comparisons; include negatives"
      - id: kp2
        name: "Test a value in an inequality"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Is $x = 3$ a solution of $2x + 1 > 5$?'
            answer: "yes"
            solution_sketch: '$2(3) + 1 = 7 > 5$.'
          - problem: 'Is $x = 2$ a solution of $5 - x < 3$?'
            answer: "no"
            solution_sketch: '$5 - 2 = 3$, and $3 < 3$ is false.'
        constraints: "substitute and compare; yes/no answers"
      - id: kp3
        name: "Boundary values and strictness"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Is $x = 4$ a solution of $x + 2 \le 6$?'
            answer: "yes"
            solution_sketch: '$6 \le 6$ is true.'
          - problem: 'Is $x = 4$ a solution of $x + 2 < 6$?'
            answer: "no"
            solution_sketch: '$6 < 6$ is false.'
        constraints: "contrast strict vs inclusive at the boundary"
    diagnostic_exemplar:
      problem: 'Is $x = -2$ a solution of $3x + 1 \ge -5$?'
      answer: "yes"
      solution_sketch: '$3(-2) + 1 = -5$, and $-5 \ge -5$ is true.'
    anki_seeds:
      - front: "Of x < a and x <= a, which includes the boundary value a?"
        back: "only x <= a (inclusive); < and > exclude the boundary"
        type: basic

  - id: graphing-inequalities-number-line
    name: "Graphing Inequalities on a Number Line"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: solutions-of-inequalities
        weight: 0.7
        key: true
      - id: number-line-integers
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Open vs closed circle"
        key_prerequisites: [solutions-of-inequalities]
        exemplars:
          - problem: 'To graph $x \ge 3$, is the circle at $3$ open or closed?'
            answer: "closed"
          - problem: 'To graph $x < -1$, is the circle at $-1$ open or closed?'
            answer: "open"
        constraints: "closed for <= or >=; open for < or >"
      - id: kp2
        name: "Direction of the ray"
        key_prerequisites: [solutions-of-inequalities]
        exemplars:
          - problem: 'For $x > 2$, does the ray point left or right?'
            answer: "right"
          - problem: 'Describe the graph of $x \le 0$.'
            answer: "closed circle at 0, ray to the left"
        constraints: "> and >= point right; < and <= point left"
      - id: kp3
        name: "Read the inequality from a graph"
        key_prerequisites: [solutions-of-inequalities]
        exemplars:
          - problem: 'A number line shows a closed circle at $-1$ with a ray to the left. Write the inequality.'
            answer: "x <= -1"
          - problem: 'A number line shows an open circle at $4$ with a ray to the right. Write the inequality.'
            answer: "x > 4"
        constraints: "single ray; integer endpoint"
    diagnostic_exemplar:
      problem: 'A number line shows an open circle at $-3$ with a ray to the right. Write the inequality.'
      answer: 'x > -3'
      solution_sketch: 'An open circle means strict, and a ray to the right means greater than.'
    anki_seeds:
      - front: "Number-line graphs of inequalities: open circle = ___, closed circle = ___."
        back: "strict (< or >); inclusive (<= or >=)"
        type: basic

  - id: one-step-inequalities
    name: "One-Step Inequalities"
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: one-step-equations
        weight: 0.6
        key: true
      - id: solutions-of-inequalities
        weight: 0.5
        key: true
      - id: graphing-inequalities-number-line
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Add or subtract on both sides"
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: 'Solve $x + 5 > 9$.'
            answer: "x > 4"
          - problem: 'Solve $x - 3 \le 2$.'
            answer: "x <= 5"
        constraints: "integer constants; keep the inequality direction"
      - id: kp2
        name: "Multiply or divide by a positive"
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: 'Solve $4x < 20$.'
            answer: "x < 5"
          - problem: 'Solve $\frac{x}{3} \ge 2$.'
            answer: "x >= 6"
        constraints: "positive coefficients only; no sign flips"
      - id: kp3
        name: "Solve and describe the graph"
        key_prerequisites: [graphing-inequalities-number-line]
        exemplars:
          - problem: 'Solve $2x > 14$. On its number-line graph, is the circle at the boundary open or closed?'
            answer: "open"
            solution_sketch: '$x > 7$; a strict inequality excludes the boundary, so the circle is open.'
          - problem: 'Solve $x + 6 \le 10$. On its number-line graph, does the shaded ray point left or right?'
            answer: "left"
            solution_sketch: '$x \le 4$; "at most" shades everything below the boundary.'
        constraints: "pair the solution with its number-line picture"
    diagnostic_exemplar:
      problem: 'Solve $\frac{x}{4} \ge 3$.'
      answer: "x >= 12"
      solution_sketch: 'Multiply both sides by the positive $4$; a positive multiplier leaves the direction alone.'
    anki_seeds:
      - front: "Adding, subtracting, or multiplying/dividing by a POSITIVE number keeps the inequality direction ___."
        back: "unchanged"
        type: basic

  - id: two-step-inequalities
    name: "Two-Step Inequalities"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: expression
    expected_time_secs: 65
    prerequisites:
      - id: one-step-inequalities
        weight: 0.7
        key: true
      - id: two-step-equations
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Two steps with a positive coefficient"
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Solve $2x - 3 \le 7$.'
            answer: "x <= 5"
            solution_sketch: '$2x \le 10$; $x \le 5$.'
          - problem: 'Solve $3x + 4 > 19$.'
            answer: "x > 5"
        constraints: "undo addition first, then division; positive coefficients"
      - id: kp2
        name: "Two steps with fractions"
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Solve $\frac{x}{2} + 3 < 8$.'
            answer: "x < 10"
            solution_sketch: '$\frac{x}{2} < 5$; $x < 10$.'
          - problem: 'Solve $\frac{x}{4} - 1 \ge 1$.'
            answer: "x >= 8"
        constraints: "unit-fraction coefficients; integer answers"
      - id: kp3
        name: "Solve, then check a value"
        key_prerequisites: [one-step-inequalities]
        exemplars:
          - problem: 'Solve $5x - 2 < 13$. Is $x = 3$ a solution? (yes/no)'
            answer: "no"
            solution_sketch: '$5x < 15$; $x < 3$; the boundary $3$ is excluded.'
          - problem: 'Solve $2x + 1 \ge 9$. Is $x = 4$ included? (yes/no)'
            answer: "yes"
            solution_sketch: '$2x \ge 8$; $x \ge 4$; the boundary $4$ is included.'
        constraints: "check the boundary value against strictness"
    diagnostic_exemplar:
      problem: 'Solve $\frac{x}{3} + 2 \le 5$.'
      answer: 'x <= 9'
      solution_sketch: '$\frac{x}{3} \le 3$; multiply by $3$: $x \le 9$.'
    anki_seeds:
      - front: "Solve a two-step inequality in the same order as a two-step equation: undo ___ first, then ___."
        back: "addition/subtraction; multiplication/division"
        type: basic

  - id: linear-inequalities
    name: "Solving Linear Inequalities"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 70
    prerequisites:
      - id: two-step-inequalities
        weight: 0.7
        key: true
      - id: integer-multiplication-division
        weight: 0.5
        key: true
      - id: multi-step-equations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Flip the sign for a negative coefficient"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Solve $-3x < 12$.'
            answer: "x > -4"
            solution_sketch: 'Divide by $-3$ and reverse: $x > -4$.'
          - problem: 'Solve $-x + 2 \ge 5$.'
            answer: "x <= -3"
            solution_sketch: '$-x \ge 3$; multiply by $-1$ and reverse: $x \le -3$.'
        constraints: "reverse the inequality when dividing/multiplying by a negative"
      - id: kp2
        name: "Multi-step inequalities"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Solve $3(x - 2) > x + 4$.'
            answer: "x > 5"
            solution_sketch: '$3x - 6 > x + 4$; $2x > 10$; $x > 5$.'
          - problem: 'Solve $5 - 2x \le 11$.'
            answer: "x >= -3"
            solution_sketch: '$-2x \le 6$; $x \ge -3$.'
        constraints: "simplify both sides first; flip only for a negative divisor"
      - id: kp3
        name: "Variables on both sides"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Solve $2x + 7 < 5x - 2$.'
            answer: "x > 3"
            solution_sketch: '$9 < 3x$; $x > 3$.'
          - problem: 'Solve $4 - 3x \ge 2x - 6$.'
            answer: "x <= 2"
            solution_sketch: '$10 \ge 5x$; $x \le 2$.'
        constraints: "collect variables on the side that keeps the coefficient positive when possible"
    diagnostic_exemplar:
      problem: 'Solve $5 - 2x \ge x - 7$.'
      answer: 'x <= 4'
      solution_sketch: '$5 + 7 \ge x + 2x$; $12 \ge 3x$; $x \le 4$.'
    anki_seeds:
      - front: "When you multiply or divide both sides of an inequality by a negative number, you must ..."
        back: "reverse (flip) the inequality sign"
        type: basic

  - id: writing-inequalities-from-statements
    name: "Writing Inequalities from Statements"
    core: false                # translation leaf of the inequality word-problem branch
    difficulty: 0.40
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: one-step-inequalities
        weight: 0.6
        key: true
      - id: solutions-of-inequalities
        weight: 0.4
        key: true
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Translate comparison phrases"
        key_prerequisites: [solutions-of-inequalities]
        exemplars:
          - problem: 'Write an inequality: "$x$ is at least $12$".'
            answer: "x >= 12"
          - problem: 'Write an inequality for the number of items $n$: "fewer than $8$ items".'
            answer: "n < 8"
        constraints: "at least -> >=; at most -> <=; more/fewer than -> strict"
      - id: kp2
        name: "Translate phrases with operations"
        key_prerequisites: [one-step-inequalities]
        exemplars:
          - problem: 'Write an inequality: "$5$ more than twice $x$ is at most $17$".'
            answer: "2x + 5 <= 17"
          - problem: 'Write an inequality: "the quotient of $y$ and $3$ exceeds $6$".'
            answer: "y/3 > 6"
        constraints: "one or two operations; do not solve"
      - id: kp3
        name: "Interpret an inequality in context"
        key_prerequisites: [solutions-of-inequalities]
        exemplars:
          - problem: 'You need $n \ge 30$ points to advance. What is the fewest points that works?'
            answer: "30"
          - problem: 'A bag holds at most $15$ kg. Write the inequality for the weight $w$.'
            answer: "w <= 15"
        constraints: "single constraint; state units where natural"
    diagnostic_exemplar:
      problem: 'Write an inequality: "three less than a number $n$ is more than $10$".'
      answer: "n - 3 > 10"
      solution_sketch: '"Three less than $n$" is $n - 3$, and "more than" is a strict $>$.'
    anki_seeds:
      - front: "Translating: \"at least\" means ___ and \"at most\" means ___."
        back: ">= ; <="
        type: basic

  - id: and-or-inequalities
    name: "And / Or Inequalities"
    core: true
    difficulty: 0.46
    drill: false
    # Answers are compound solution sets ("-4 < x < 4", "x < -1 or x > 4"); SymPy cannot
    # parse chained comparisons or unions, so the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 75
    prerequisites:
      - id: linear-inequalities
        weight: 0.7
        key: true
      - id: graphing-inequalities-number-line
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Membership in a compound solution"
        key_prerequisites: [graphing-inequalities-number-line]
        exemplars:
          - problem: 'Is $x = 3$ in the solution set of $1 < x < 5$?'
            answer: "yes"
          - problem: 'Is $x = 0$ a solution of $x < -2$ or $x > 1$?'
            answer: "no"
            solution_sketch: '$0$ satisfies neither piece.'
        constraints: "test one value against the graph or the symbols"
      - id: kp2
        name: "'And' (between) inequalities"
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: 'Solve $-1 < x + 3 < 7$.'
            answer: "-4 < x < 4"
            solution_sketch: 'Subtract $3$ from all three parts.'
          - problem: 'Solve $2 \le 2x \le 10$.'
            answer: "1 <= x <= 5"
        constraints: "apply each operation to all three parts; one operation needed"
      - id: kp3
        name: "'Or' inequalities"
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: 'Solve $x - 1 < -2$ or $x - 1 > 3$.'
            answer: "x < -1 or x > 4"
          - problem: 'Solve $2x \le -6$ or $x + 1 > 5$.'
            answer: "x <= -3 or x > 4"
        constraints: "solve each piece separately; keep the union"
    diagnostic_exemplar:
      problem: 'Solve $x + 2 < 1$ or $x - 4 \ge 1$.'
      answer: 'x < -1 or x >= 5'
      solution_sketch: 'Solve each piece: $x < -1$; $x \ge 5$; keep the union.'
    anki_seeds:
      - front: "An 'and' compound inequality gives the ___ of the solution sets; an 'or' compound inequality gives the ___."
        back: "intersection (overlap / between); union"
        type: basic

  - id: compound-inequalities
    name: "Compound Inequalities"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: and-or-inequalities
        weight: 0.7
        key: true
      - id: linear-inequalities
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Multi-step three-part inequalities"
        key_prerequisites: [and-or-inequalities]
        exemplars:
          - problem: 'Solve $-5 \le 2x - 1 < 7$.'
            answer: "-2 <= x < 4"
            solution_sketch: 'Add $1$: $-4 \le 2x < 8$; divide by $2$.'
          - problem: 'Solve $3 < 2x + 1 \le 11$.'
            answer: "1 < x <= 5"
        constraints: "keep operations balanced across all parts"
      - id: kp2
        name: "Three-part with a negative coefficient"
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: 'Solve $-6 < -2x \le 4$.'
            answer: "-2 <= x < 3"
            solution_sketch: 'Divide by $-2$ and reverse both signs: $3 > x \ge -2$.'
          - problem: 'Solve $1 \le 5 - x < 7$.'
            answer: "-2 < x <= 4"
            solution_sketch: 'Subtract $5$: $-4 \le -x < 2$; multiply by $-1$: $4 \ge x > -2$.'
        constraints: "both inequality signs flip; rewrite smallest-to-largest"
      - id: kp3
        name: "Multi-step 'or' unions"
        key_prerequisites: [and-or-inequalities]
        exemplars:
          - problem: 'Solve $3x + 1 < -5$ or $2x - 3 > 5$.'
            answer: "x < -2 or x > 4"
            solution_sketch: '$3x < -6$ gives $x < -2$; $2x > 8$ gives $x > 4$.'
          - problem: 'Solve $4 - x \ge 6$ or $3x \ge 6$.'
            answer: "x <= -2 or x >= 2"
            solution_sketch: '$-x \ge 2$ flips to $x \le -2$; $x \ge 2$.'
        constraints: "each piece takes two steps; keep the union"
    diagnostic_exemplar:
      problem: 'Solve $-4 < -2x \le 6$.'
      answer: '-3 <= x < 2'
      solution_sketch: 'Divide all three parts by $-2$ and reverse both signs: $2 > x \ge -3$.'
    anki_seeds:
      - front: "In a three-part inequality, every operation must be applied to ___, and dividing by a negative flips ___."
        back: "all three parts; both inequality signs"
        type: basic

  - id: interval-notation
    name: "Interval Notation"
    # core: the notation later material answers in everywhere — precalculus
    # polynomial-inequalities, calculus-1 continuity and
    # increasing-decreasing-intervals, calculus-2 power-series all demand
    # interval-notation answers (re-audit R-01). proofs:interval-notation-real-sets
    # is the set-operations rigorization of this notation, one rung above.
    core: true
    difficulty: 0.52
    drill: false
    # Interval strings and unions ("[2, 7)", "(-∞, -2) ∪ (4, ∞)") are not
    # SymPy-parseable; the tutor grades them — same call as
    # precalculus:polynomial-inequalities and proofs:interval-notation-real-sets.
    answer_kind: multi-step
    expected_time_secs: 80
    prerequisites:
      - id: compound-inequalities
        weight: 0.6
        key: true
      - id: graphing-inequalities-number-line
        weight: 0.5
        key: true
      - id: and-or-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Bounded intervals and endpoint membership"
        key_prerequisites: [graphing-inequalities-number-line]
        exemplars:
          - problem: 'Write the solution of $2 \le x \le 7$ in interval notation.'
            answer: "[2, 7]"
            solution_sketch: 'Both endpoints are included, so both brackets are square.'
          - problem: 'Write $0 < x \le 5$ in interval notation.'
            answer: "(0, 5]"
            solution_sketch: 'Strict at $0$ gives a round bracket; inclusive at $5$ gives a square one.'
          - problem: 'Is $3$ a member of the interval $(3, 8]$?'
            answer: "no"
            solution_sketch: 'The round bracket at $3$ excludes the endpoint itself.'
        constraints: "bounded intervals only; convert inequality -> interval and test one endpoint; integer endpoints"
      - id: kp2
        name: "Unbounded intervals with infinity"
        key_prerequisites: [graphing-inequalities-number-line]
        exemplars:
          - problem: 'Write $x > 2$ in interval notation.'
            answer: "(2, ∞)"
            solution_sketch: 'A ray to the right; $\infty$ is not a number, so it always takes a round bracket.'
          - problem: 'Write $x \le -1$ in interval notation.'
            answer: "(-∞, -1]"
          - problem: 'Write the interval $[4, \infty)$ as an inequality.'
            answer: "x >= 4"
        constraints: "single rays both directions; infinity always gets a round bracket; convert both ways"
      - id: kp3
        name: "Unions for 'or' solutions"
        key_prerequisites: [compound-inequalities]
        exemplars:
          - problem: 'Write the solution of $x < -2$ or $x > 4$ in interval notation.'
            answer: "(-∞, -2) ∪ (4, ∞)"
            solution_sketch: 'Each ray becomes an interval; the "or" is written with the union symbol $\cup$.'
          - problem: 'Solve $2x + 1 \le -3$ or $x - 3 > 0$ and give the answer in interval notation.'
            answer: "(-∞, -2] ∪ (3, ∞)"
            solution_sketch: '$2x \le -4$ gives $x \le -2$; the second piece gives $x > 3$.'
          - problem: 'Write $(-\infty, 1) \cup [5, \infty)$ as inequalities joined by "or".'
            answer: "x < 1 or x >= 5"
        constraints: "two-piece unions from 'or' inequalities; at most two solving steps per piece; convert both ways"
    diagnostic_exemplar:
      problem: 'Solve $3x + 2 < -4$ or $x - 2 \ge 1$ and give the answer in interval notation.'
      answer: '(-∞, -2) ∪ [3, ∞)'
      solution_sketch: '$3x < -6 \to x < -2$ (round bracket); $x \ge 3$ (square bracket); take the union.'
    anki_seeds:
      - front: "Interval notation: square bracket vs round bracket?"
        back: "square [ includes the endpoint (<= or >=); round ( excludes it (< or >)"
        type: basic
      - front: "Which bracket always goes next to ∞ or -∞ in interval notation, and why?"
        back: "a round bracket — infinity is not a number, so it can never be included"
        type: basic
      - front: "An 'or' solution set like x < -2 or x > 4 is written in interval notation as..."
        back: "(-∞, -2) ∪ (4, ∞) — the union symbol ∪ joins the pieces"
        type: basic

  - id: inequality-word-problems
    name: "Inequality Word Problems"
    core: false                # enrichment / applications leaf topic
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 130
    prerequisites:
      - id: writing-inequalities-from-statements
        weight: 0.6
        key: true
      - id: linear-inequalities
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Budget (at most) problems"
        key_prerequisites: [writing-inequalities-from-statements, linear-inequalities]
        exemplars:
          - problem: 'T-shirts cost €8 each plus a flat €10 shipping fee. You can spend at most €50. How many shirts can you buy?'
            answer: "at most 5"
            solution_sketch: '$8x + 10 \le 50$; $x \le 5$.'
          - problem: 'A taxi charges €3 plus €2 per kilometre. What distances keep the fare at most €15?'
            answer: "at most 6 km"
            solution_sketch: '$2k + 3 \le 15$; $k \le 6$.'
        constraints: "cost model with a cap; integer boundary"
      - id: kp2
        name: "Minimum (at least) problems"
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: 'Your first three marks are $6$, $8$, and $7$ on the $0$–$10$ scale. What must you score on the fourth to average at least $7.5$?'
            answer: "at least 9"
            solution_sketch: '$\frac{21 + x}{4} \ge 7.5$; $21 + x \ge 30$; $x \ge 9$.'
          - problem: 'You have €60 and save €20 per week. After how many weeks will you have more than €200?'
            answer: "more than 7 weeks (so at least 8 full weeks)"
            solution_sketch: '$60 + 20w > 200$; $w > 7$.'
        constraints: "at-least targets; averages or savings"
      - id: kp3
        name: "Round the boundary sensibly"
        key_prerequisites: [writing-inequalities-from-statements]
        exemplars:
          - problem: 'Rides cost €4 each plus €6 entry, and you have €28. How many rides can you go on?'
            answer: "5"
            solution_sketch: '$4r + 6 \le 28$; $r \le 5.5$; round down to $5$ whole rides.'
          - problem: 'A van seats at most $12$ people and $5$ seats are taken. How many more people can board?'
            answer: "7"
            solution_sketch: '$5 + n \le 12$; $n \le 7$.'
        constraints: "whole-number contexts; round down for at-most caps"
    diagnostic_exemplar:
      problem: 'Rides cost €5 each plus a €7 entry fee, and you have €30. How many rides can you go on?'
      answer: '4'
      solution_sketch: '$5r + 7 \le 30$; $r \le 4.6$; round down to $4$.'
    anki_seeds:
      - front: "In an at-most word problem, a fractional boundary for a count of items is rounded ___."
        back: "down (you cannot buy a fraction of an item)"
        type: basic

  - id: basic-absolute-value-inequalities
    name: "Basic Absolute Value Inequalities"
    core: false                # terminal absolute-value solving branch
    difficulty: 0.50
    drill: false
    # Same shape as and-or-inequalities: compound solution sets SymPy cannot parse.
    answer_kind: multi-step
    expected_time_secs: 80
    prerequisites:
      - id: and-or-inequalities
        weight: 0.6
        key: true
      - id: absolute-value
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "|x| < a becomes an 'and' inequality"
        key_prerequisites: [and-or-inequalities]
        exemplars:
          - problem: 'Solve $|x| < 5$.'
            answer: "-5 < x < 5"
          - problem: 'Solve $|x| \le 3$.'
            answer: "-3 <= x <= 3"
        constraints: "less-than gives a bounded interval"
      - id: kp2
        name: "|x| > a becomes an 'or' inequality"
        key_prerequisites: [and-or-inequalities]
        exemplars:
          - problem: 'Solve $|x| > 4$.'
            answer: "x < -4 or x > 4"
          - problem: 'Solve $|x| \ge 2$.'
            answer: "x <= -2 or x >= 2"
        constraints: "greater-than gives two rays"
      - id: kp3
        name: "Degenerate cases"
        key_prerequisites: [absolute-value]
        exemplars:
          - problem: 'Solve $|x| < -2$.'
            answer: "no solution"
            solution_sketch: 'An absolute value is never negative.'
          - problem: 'Solve $|x| \ge -1$.'
            answer: "all real numbers"
            solution_sketch: '$|x| \ge 0 > -1$ always.'
        constraints: "negative right-hand side only"
    diagnostic_exemplar:
      problem: 'Solve $|x| > 3$.'
      answer: "x < -3 or x > 3"
      solution_sketch: 'Greater-than splits into an "or": the points more than $3$ from zero lie on either side.'
    anki_seeds:
      - front: "Rewrite |X| < a (a > 0) without absolute value:"
        back: "-a < X < a (an AND / conjunction)"
        type: basic
      - front: "Rewrite |X| > a (a > 0) without absolute value:"
        back: "X < -a or X > a (an OR / disjunction)"
        type: basic

  - id: absolute-value-inequalities
    name: "Absolute Value Inequalities"
    core: false
    difficulty: 0.55
