            answer: 'x <= -12'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Multiply both sides by $-\frac{3}{2}$ and reverse the comparison. This gives $x\le -12$.'
        constraints: "reverse the inequality when dividing/multiplying by a negative"
      - id: kp2
        name: "Multi-step inequalities"
        key_prerequisites: [multi-step-equations]
        step_check:
          step: 'Divide by positive $2$'
          question: 'Why does the comparison keep its direction when you divide by $2$?'
          options:
            - 'The direction reverses only when a fraction is involved'
            - 'The direction was already reversed when $2x$ was moved'
            - 'A positive divisor keeps the order of any two numbers'
            - 'Division never changes direction, whatever the divisor is'
          answer: 'A positive divisor keeps the order of any two numbers'
          why: 'Dividing $14>2x$ by positive $2$ gives $7>x$, and for example $4<6$ stays $2<3$.'
        exemplars:
          - problem: 'Solve $3(x-2)\le x+8$.'
            answer: 'x <= 7'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Distribute to get $3x-6\le x+8$. Subtract $x$ and add $6$ to get $2x\le 14$, so $x\le 7$.'
          - problem: 'Solve $5-2(x+3)>x+2$.'
            answer: 'x < -1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Distribute and combine to get $-2x-1>x+2$. Then $-3x>3$, and dividing by $-3$ reverses the comparison, so $x<-1$.'
          - problem: 'A rectangle is $6$ cm wide and $(x+3)$ cm long. For which values of $x$ is its perimeter at most $40$ cm?'
            answer: 'x <= 11'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The perimeter is $2(6+x+3)=2(x+9)$, and it must satisfy $2(x+9)\le 40$. Then $x+9\le 20$, so $x\le 11$.'
          - problem: 'Solve $4(x+1)\ge 2x-8$.'
            answer: 'x >= -6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Distribute to get $4x+4\ge 2x-8$. Subtract $2x$ and $4$ from both sides to get $2x\ge -12$, so $x\ge -6$.'
          - problem: 'Five friends each pay $(x+4)$ dollars for a ticket, and the group then receives a refund of $10$ dollars. For which values of $x$ is the total cost at most $70$ dollars?'
            answer: 'x <= 12'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The total is $5(x+4)-10=5x+10$, and it must be at most $70$. So $5x\le 60$ and $x\le 12$.'
          - problem: 'Solve $2(3-x)<5x+11$.'
            answer: 'x > -5/7'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Distribute to get $6-2x<5x+11$. Then $-5<7x$, and dividing by positive $7$ gives $x>-\frac{5}{7}$.'
          - problem: 'Sam solves $-3(x-2)<12$ and gets $x<-2$. What is the correct solution?'
            answer: 'x > -2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Distribute to get $-3x+6<12$, so $-3x<6$. Dividing by $-3$ reverses the comparison, so the correct solution is $x>-2$.'
          - problem: 'Solve $\frac{x+1}{2}\le \frac{x}{3}+2$.'
            answer: 'x <= 9'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Multiply both sides by $6$ to clear the fractions: $3(x+1)\le 2x+12$. Then $3x+3\le 2x+12$, so $x\le 9$.'
        constraints: "simplify both sides first; flip only for a negative divisor"
      - id: kp3
        name: "Variables on both sides"
        key_prerequisites: [multi-step-equations]
        step_check:
          step: 'Add $4x$ to both sides'
          question: 'Why add $4x$ to both sides here, and not subtract $3x$?'
          options:
            - 'It leaves $x$ with a positive coefficient, so nothing reverses'
            - 'Only the term with the larger coefficient can be moved'
            - 'Subtracting $3x$ would change the solution set of the inequality'
            - 'Variable terms are always added, while constants are subtracted'
          answer: 'It leaves $x$ with a positive coefficient, so nothing reverses'
          why: 'Subtracting $3x$ also works, but gives $-7x<14$, which needs a reversal to reach $x>-2$.'
        exemplars:
          - problem: 'Solve $2x+9\le 5x-3$.'
            answer: 'x >= 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $2x$ and add $3$ on both sides to get $12\le 3x$. Dividing by positive $3$ gives $4\le x$, which is $x\ge 4$.'
          - problem: 'Gym A charges a joining fee of $30$ dollars and $10$ dollars per month. Gym B has no joining fee and charges $15$ dollars per month. After how many months $m$ is Gym A the cheaper one?'
            answer: 'm > 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Gym A costs $30+10m$ and Gym B costs $15m$. Gym A is cheaper when $30+10m<15m$, so $30<5m$ and $m>6$.'
          - problem: 'Solve $7-3x>2x-8$.'
            answer: 'x < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Add $3x$ and add $8$ to both sides to get $15>5x$. Dividing by $5$ gives $3>x$, which is $x<3$.'
          - problem: 'One candle is $30$ cm tall and burns down $2$ cm every hour. Another is $24$ cm tall and burns down $1.5$ cm every hour. After how many hours $t$ is the first candle shorter than the second?'
            answer: 't > 12'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The heights are $30-2t$ and $24-1.5t$. The first is shorter when $30-2t<24-1.5t$, so $6<0.5t$ and $t>12$.'
          - problem: 'Solve $6-5x\le 3x+22$.'
            answer: 'x >= -2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Add $5x$ and subtract $22$ to get $-16\le 8x$. Dividing by $8$ gives $-2\le x$, so $x\ge -2$.'
          - problem: 'Solve $\frac{x}{2}+3>\frac{x}{4}+5$.'
            answer: 'x > 8'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $\frac{x}{4}$ and $3$ from both sides to get $\frac{x}{4}>2$. Multiplying by $4$ gives $x>8$.'
          - problem: 'Ben has $120$ dollars and saves $8$ dollars a week. Cara has $45$ dollars and saves $13$ dollars a week. After how many weeks $w$ does Cara have at least as much as Ben?'
            answer: 'w >= 15'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Cara has $45+13w$ and Ben has $120+8w$. Cara has at least as much when $45+13w\ge 120+8w$, so $5w\ge 75$ and $w\ge 15$.'
          - problem: 'Sam solves $5x+2<8x-7$ and writes $x<3$. What is the correct solution?'
            answer: 'x > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $5x$ and $7$ to get $9<3x$, so $3<x$. The solution is $x>3$, and $x=0$ shows that $x<3$ is wrong: $2<-7$ is false.'
        constraints: "collect variables on the side that keeps the coefficient positive when possible"
    diagnostic_exemplar:
      problem: 'Solve $5 - 2x \ge x - 7$.'
      answer: 'x <= 4'
      solution_sketch: '$5 + 7 \ge x + 2x$; $12 \ge 3x$; $x \le 4$.'
    anki_seeds:
      - front: "When you multiply or divide both sides of an inequality by a negative number, you must ..."
        back: "reverse (flip) the inequality sign"
        type: basic

  - id: writing-inequalities-from-statements
    name: "Writing Inequalities from Statements"
    core: false                # translation leaf of the inequality word-problem branch
    difficulty: 0.40
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: one-step-inequalities
        weight: 0.6
        key: true
      - id: solutions-of-inequalities
        weight: 0.4
        key: true
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Translate comparison phrases"
        key_prerequisites: [solutions-of-inequalities]
        step_check:
          step: 'the threshold and all smaller values'
          question: 'Why is "no more than $45$" written with $\le$ and not $<$?'
          options:
            - 'The word "more" in the phrase always points to $>$ or $\ge$'
            - 'The strict symbol $<$ is used only when the number is negative'
            - 'The value $45$ itself is allowed, so equality is included'
            - '"No more than" excludes the threshold, so $y<45$ is the same'
          answer: 'The value $45$ itself is allowed, so equality is included'
          why: 'A $y$ of exactly $45$ is "no more than $45$", and only $\le$ accepts $y=45$.'
        exemplars:
          - problem: 'Write "$x$ is at least $12$" as an inequality.'
            answer: 'x >= 12'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: '"At least" includes the threshold itself and everything above it. So the inequality is $x\ge 12$.'
          - problem: 'A bus holds at most $52$ passengers. Write an inequality for the number of passengers $p$ on the bus.'
            answer: 'p <= 52'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: '"At most" means the number can equal $52$ but cannot be larger. So $p\le 52$.'
          - problem: 'Write "$n$ is fewer than $8$" as an inequality.'
            answer: 'n < 8'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: '"Fewer than" excludes the threshold, so the comparison is strict. The inequality is $n<8$.'
          - problem: 'A runner must finish in under $25$ minutes to qualify. Write an inequality for the finishing time $t$ in minutes.'
            answer: 't < 25'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: '"Under" excludes $25$ itself, so the comparison is strict. The inequality is $t<25$.'
          - problem: 'Write "$y$ is no less than $-3$" as an inequality.'
            answer: 'y >= -3'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: '"No less than" means $y$ may equal $-3$ or be larger. So $y\ge -3$.'
          - problem: 'A suitcase goes on board free when it weighs no more than $23$ kg. Write an inequality for its weight $w$ in kilograms.'
            answer: 'w <= 23'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: '"No more than" includes $23$ and all smaller weights. So $w\le 23$.'
          - problem: 'A rental company charges extra when the distance $d$ exceeds $150$ km. Write an inequality for the distances that cost extra.'
            answer: 'd > 150'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: '"Exceeds" means strictly greater than, so $150$ km itself costs nothing extra. The inequality is $d>150$.'
          - problem: 'Sam writes "$x$ is at most $20$" as $x<20$. Write the correct inequality.'
            answer: 'x <= 20'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: '"At most" allows $x$ to equal $20$, so the comparison must include equality. The correct inequality is $x\le 20$.'
        constraints: "at least -> >=; at most -> <=; more/fewer than -> strict"
      - id: kp2
        name: "Translate phrases with operations"
        key_prerequisites: [one-step-inequalities]
        step_check:
          step: 'three less than that is $z/2-3$'
          question: 'Why is "three less than half of $z$" written $z/2-3$ and not $3-z/2$?'
          options:
            - 'The numbers are written in the order they appear in the sentence'
            - 'Subtraction commutes, so $3-z/2$ and $z/2-3$ have the same value'
            - '"Less than" always puts the smaller number first in the result'
            - '"Less than" subtracts from the quantity that comes after it'
          answer: '"Less than" subtracts from the quantity that comes after it'
          why: 'For $z=10$, three less than $5$ is $2$, and $5-3=2$ while $3-5=-2$.'
        exemplars:
          - problem: 'Write "$5$ more than twice $x$ is at most $17$" as an inequality.'
            answer: '2*x + 5 <= 17'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'Twice $x$ is $2x$, and $5$ more than that is $2x+5$. "At most" gives $2x+5\le 17$.'
          - problem: 'Write "the quotient of $y$ and $3$ exceeds $6$" as an inequality.'
            answer: 'y/3 > 6'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'The quotient of $y$ and $3$ is $y/3$. "Exceeds" is strict, so $\frac{y}{3}>6$.'
          - problem: 'Write "$7$ less than $4$ times $n$ is at least $9$" as an inequality.'
            answer: '4*n - 7 >= 9'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'Four times $n$ is $4n$, and $7$ less than that is $4n-7$. "At least" gives $4n-7\ge 9$.'
          - problem: 'A taxi charges a fee of $3$ dollars plus $2$ dollars per kilometre. Write an inequality that says a ride of $d$ km costs less than $25$ dollars.'
            answer: '2*d + 3 < 25'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'The ride costs $2d+3$ dollars, which is the fee plus $2$ dollars for each kilometre. "Less than" gives $2d+3<25$.'
          - problem: 'Four friends split a bill of $b$ dollars equally, and each pays more than $15$ dollars. Write an inequality for $b$.'
            answer: 'b/4 > 15'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'Splitting the bill four ways divides it by $4$, so each pays $b/4$ dollars. "More than" gives $\frac{b}{4}>15$.'
          - problem: 'Lena has $40$ dollars and buys $n$ notebooks at $3$ dollars each. She wants at least $10$ dollars left. Write an inequality for $n$.'
            answer: '40 - 3*n >= 10'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'The notebooks cost $3n$ dollars, so $40-3n$ dollars are left. "At least $10$" gives $40-3n\ge 10$.'
          - problem: 'Write "the sum of $3$ times $q$ and $8$ is below $20$" as an inequality.'
            answer: '3*q + 8 < 20'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'Three times $q$ is $3q$, and the sum with $8$ is $3q+8$. "Below" is strict, so $3q+8<20$.'
          - problem: 'Sam writes "three less than twice $n$ is more than $11$" as $3-2n>11$. Write the correct inequality.'
            answer: '2*n - 3 > 11'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'Twice $n$ is $2n$, and three less than that is $2n-3$, not $3-2n$. "More than" gives $2n-3>11$.'
          - problem: 'Write "half of $m$, increased by $3$, is at least $12$" as an inequality.'
            answer: 'm/2 + 3 >= 12'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'Half of $m$ is $m/2$, and increasing it by $3$ gives $m/2+3$. "At least" gives $\frac{m}{2}+3\ge 12$.'
        constraints: "one or two operations; do not solve"
      - id: kp3
        name: "Interpret an inequality in context"
        key_prerequisites: [solutions-of-inequalities]
        step_check:
          step: 'the boundary value itself is included'
          question: 'Why is the smallest amount that satisfies "at least $120$" exactly $120$?'
          options:
            - 'The smallest amount is always the first whole number after the boundary'
            - 'The phrase includes the boundary, and nothing below $120$ qualifies'
            - 'Any amount counts, because "at least" has no lower limit'
            - 'The boundary of an "at least" phrase is excluded, so $121$ is smallest'
          answer: 'The phrase includes the boundary, and nothing below $120$ qualifies'
          why: 'An amount of $120$ meets "at least $120$", while $119$ does not.'
        exemplars:
          - problem: 'A game needs at least $30$ points to advance. What is the lowest score that advances?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: '"At least $30$" includes $30$ itself. So the lowest score that advances is $30$.'
          - problem: 'A bridge sign says that vehicles must weigh less than $8$ tonnes. Trucks are weighed in whole tonnes. What is the heaviest truck that is allowed to cross?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: '"Less than $8$" excludes $8$. The greatest whole number below $8$ is $7$, so the heaviest truck weighs $7$ tonnes.'
          - problem: 'A crate holds at most $40$ kg. Write an inequality for the weight $w$ of its contents in kilograms.'
            answer: 'w <= 40'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: '"At most" means the contents can weigh $40$ kg or less. So $w\le 40$.'
          - problem: 'A fairground ride requires riders to be at least $120$ cm tall. Write an inequality for the height $h$ of a rider in centimetres.'
            answer: 'h >= 120'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: '"At least" includes a rider who is exactly $120$ cm tall and anyone taller. So the inequality is $h\ge 120$.'
          - problem: 'To pass an exam, a student needs more than $50$ points. Does a student with exactly $50$ points pass?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes he passes","yes she passes","he passes","she passes","passes","yes he does","yes she does"],["no","no he does not","no, he does not","no she does not","no, she does not","does not pass","he fails","she fails"]]}
            solution_sketch: '"More than $50$" is strict, so $50$ itself does not count. A student with exactly $50$ points does not pass.'
          - problem: 'Ana has used $3.2$ GB of a $5$ GB monthly data plan. Write an inequality for the amount $g$ of data in gigabytes that she can still use.'
            answer: 'g <= 1.8'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'The plan leaves $5-3.2=1.8$ GB. She can use at most that much, so $g\le 1.8$.'
          - problem: 'Tickets cost $6$ dollars each and you have $50$ dollars. What is the greatest number of tickets you can buy?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide $50$ by $6$ to get about $8.3$. You cannot buy part of a ticket, so you can buy at most $8$ tickets.'
          - problem: 'A school needs seats for at least $230$ students, and each bus carries $48$ students. What is the fewest number of buses that it needs?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide $230$ by $48$ to get about $4.8$. Four buses are too few, so the school needs $5$ buses.'
          - problem: 'A ride requires riders to be at least $21$ years old. Does a rider who is exactly $21$ years old qualify?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","yes he qualifies","yes she qualifies","he qualifies","she qualifies","qualifies","yes he does","yes she does"],["no","no he does not","no, he does not","no she does not","no, she does not","does not qualify","he does not qualify","she does not qualify"]]}
            solution_sketch: '"At least $21$" includes $21$ itself. So a rider who is exactly $21$ qualifies.'
        constraints: "single constraint; state units where natural"
    diagnostic_exemplar:
      problem: 'Write an inequality: "three less than a number $n$ is more than $10$".'
      answer_contract: {kind: polynomial_relation}
      answer: "n - 3 > 10"
      solution_sketch: '"Three less than $n$" is $n - 3$, and "more than" is a strict $>$.'
    anki_seeds:
      - front: "Translating: \"at least\" means ___ and \"at most\" means ___."
        back: ">= ; <="
        type: basic

  - id: and-or-inequalities
    name: "And / Or Inequalities"
    core: true
    difficulty: 0.46
    drill: false
    # Answers are compound solution sets ("-4 < x < 4", "x < -1 or x > 4"); SymPy cannot
    # parse chained comparisons or unions, so the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 75
    prerequisites:
      - id: linear-inequalities
        weight: 0.7
        key: true
      - id: graphing-inequalities-number-line
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Membership in a compound solution"
        key_prerequisites: [graphing-inequalities-number-line]
        step_check:
          step: 'An or statement needs at least one true comparison'
          question: 'Why is $-7$ a solution of $x\le -4$ or $x\ge 12$ although $-7\ge 12$ is false?'
          options:
            - 'An "or" statement needs one true comparison, and $-7\le -4$ is true'
            - 'An "or" statement needs both comparisons true, and $-7$ lies below both'
            - 'The first comparison always decides the answer for an "or" statement'
            - 'A false comparison is replaced by its opposite, $-7<12$, which is true'
          answer: 'An "or" statement needs one true comparison, and $-7\le -4$ is true'
          why: 'With "or", one true comparison is enough, and $-7\le -4$ is true.'
        try_first:
          problem: 'Does $x=3$ satisfy $x>1$ or $x<0$?'
          answer_contract: {"kind":"label","options":[["yes","yes it is","yes it does","it is","it does","it is a solution"],["no","no it is not","no it does not","it is not","it does not","not a solution"]]}
          answer: 'yes'
          reveal: 'An "or" statement is true when at least one comparison holds, and $3>1$ does. An "and" statement would need both comparisons to hold.'
        exemplars:
          - problem: 'For $x=-1$, which of the comparisons $x>-4$ and $x\le 2$ is true: the first, the second, both or neither?'
            answer: 'both'
            answer_contract: {"kind":"label","options":[["first","the first","first one","only the first"],["second","the second","second one","only the second"],["both","both of them","the first and the second","both are true"],["neither","none","neither of them","none of them"]]}
            solution_sketch: 'Test each comparison: $-1>-4$ is true and $-1\le 2$ is true. Because both hold, $x=-1$ satisfies the "and" statement.'
          - problem: 'A thermostat keeps the room temperature above $18$ degrees and below $24$ degrees. Temperatures are read in whole degrees. What is the highest temperature it allows?'
            answer: '23'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The room must be below $24$, and $24$ itself is excluded. The highest whole-degree temperature that is also above $18$ is $23$.'
          - problem: 'A number line shows a solid dot at $-4$ with a ray going left, and an open dot at $3$ with a ray going right. Which of the values $-4$, $0$ and $3$ lies in the solution set?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graph shows $x\le -4$ or $x>3$. The value $-4$ is included by the solid dot, $0$ lies in neither ray, and $3$ is excluded by the open dot.'
          - problem: 'Is $x=0$ a solution of "$x\le -5$ or $x>1$"?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes it is","yes it does","it is","it does","it is a solution"],["no","no it is not","no it does not","it is not","it does not","not a solution"]]}
            solution_sketch: 'Test each comparison: $0\le -5$ is false and $0>1$ is false. An "or" statement needs at least one true comparison, so $0$ is not a solution.'
          - problem: 'A pool admits swimmers whose age is more than $12$ and at most $17$ years. Ages are whole numbers. What is the youngest age admitted?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The age must be more than $12$ and at most $17$. The smallest whole number above $12$ is $13$, and $13$ is below $17$, so the youngest age admitted is $13$.'
          - problem: 'What is the smallest integer that satisfies both $x\ge -3$ and $x>-1$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both comparisons must hold, so $x$ must be greater than $-1$. The smallest integer above $-1$ is $0$.'
          - problem: 'A club gives a discount to anyone whose age $a$ satisfies $a<16$ or $a>60$. Ages are whole numbers. What is the oldest age that pays the full price?'
            answer: '60'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The discount applies to $a<16$ and to $a>60$. The ages that pay the full price are $16$ to $60$, so the oldest is $60$.'
        constraints: "test one value against the graph or the symbols"
      - id: kp2
        name: "'And' (between) inequalities"
        key_prerequisites: [linear-inequalities]
        step_check:
          step: 'Add $6$ to all three parts'
          question: 'Why must $6$ be added to all three parts and not only to the middle?'
          options:
            - 'Adding to the middle alone gives the same result, but is slower'
            - 'Each comparison needs the same change to stay a true statement'
            - 'The two outer numbers are bounds, and bounds never change'
            - 'Only inclusive endpoints, written with $\le$, change by addition'
          answer: 'Each comparison needs the same change to stay a true statement'
          why: 'Adding $6$ to the middle alone would give $-9\le x\le 15$, which is a different range from the correct $-3\le x\le 21$.'
        exemplars:
          - problem: 'Solve $-7<x+3<9$.'
            answer: '-10 < x < 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $3$ from all three parts: $-10<x<6$. Both ends are strict, so the endpoints are not included.'
          - problem: 'Solve $2\le 3x\le 17$.'
            answer: '2/3 <= x <= 17/3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Divide all three parts by positive $3$. This gives $\frac{2}{3}\le x\le \frac{17}{3}$.'
          - problem: 'A taxi fare is $4$ dollars plus $2$ dollars per kilometre. For which distances $d$ does the fare stay between $10$ and $20$ dollars?'
            answer: '3 < d < 8'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The fare $4+2d$ must satisfy $10<4+2d<20$. Subtract $4$ to get $6<2d<16$, then divide by $2$ to get $3<d<8$.'
          - problem: 'Solve $-4<x-5\le 6$.'
            answer: '1 < x <= 11'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Add $5$ to all three parts of the inequality. This gives $1<x\le 11$, with $11$ included and $1$ excluded.'
          - problem: 'A rectangle is $5$ m wide and $L$ m long. Its area is at least $30$ and at most $45$ square metres. Which lengths $L$ are possible?'
            answer: '6 <= L <= 9'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The area $5L$ satisfies $30\le 5L\le 45$. Dividing all three parts by $5$ gives $6\le L\le 9$.'
          - problem: 'Solve $-3\le \frac{x}{2}<8$.'
            answer: '-6 <= x < 16'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Multiply all three parts by positive $2$, which keeps both signs. This gives $-6\le x<16$.'
          - problem: 'A parcel is accepted when its weight $w$ in kilograms is more than $1$ and at most $20$. Write this as one inequality.'
            answer: '1 < w <= 20'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The weight must satisfy both $w>1$ and $w\le 20$. Together these are written $1<w\le 20$.'
          - problem: 'Sam solves $-6<2x<10$ and writes $-6<x<10$. What is the correct solution?'
            answer: '-3 < x < 5'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Sam divided only the middle part by $2$. Dividing all three parts by $2$ gives $-3<x<5$.'
        constraints: "apply each operation to all three parts; one operation needed"
      - id: kp3
        name: "'Or' inequalities"
        key_prerequisites: [linear-inequalities]
        step_check:
          step: 'Solve the first piece'
          question: 'Why are the two pieces of an "or" statement solved separately?'
          options:
            - 'The two pieces must have the same solution before they can be joined'
            - 'Operations apply to all parts, so one piece must be solved first'
            - 'They are two separate conditions with no shared middle part'
            - 'The first piece decides the direction of the second one'
          answer: 'They are two separate conditions with no shared middle part'
          why: 'Each piece restricts $x$ on its own, so each is solved on its own and the results are joined.'
        exemplars:
          - problem: 'Solve $x-1<-2$ or $x-1>3$.'
            answer: 'x < -1 or x > 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Add $1$ in each piece to get $x<-1$ or $x>4$. Both comparisons are strict, so the endpoints $-1$ and $4$ are excluded.'
          - problem: 'Solve $2x\le -6$ or $x+1>5$.'
            answer: 'x <= -3 or x > 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Divide the first piece by positive $2$ to get $x\le -3$. Subtract $1$ in the second piece to get $x>4$.'
          - problem: 'A sensor reports the value $3T-6$ for a temperature $T$. The alarm sounds when the value is below $0$ or above $30$. For which temperatures does the alarm sound?'
            answer: 'T < 2 or T > 12'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Solve $3T-6<0$ to get $T<2$. Solve $3T-6>30$ to get $T>12$. The alarm sounds in either case.'
          - problem: 'Solve $-x>5$ or $\frac{x}{2}\ge 3$.'
            answer: 'x < -5 or x >= 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Multiplying the first piece by $-1$ reverses it, so $x<-5$. Multiplying the second by $2$ gives $x\ge 6$.'
          - problem: 'A rope of length $x$ metres is cut into $3$ equal pieces. A piece is unusable when it is shorter than $2$ m or longer than $5$ m. For which values of $x$ are the pieces unusable?'
            answer: 'x < 6 or x > 15'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Each piece has length $x/3$. It is unusable when $\frac{x}{3}<2$ or $\frac{x}{3}>5$, which gives $x<6$ or $x>15$.'
          - problem: 'Solve $3x<-12$ or $2x\ge 14$.'
            answer: 'x < -4 or x >= 7'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Dividing the first piece by $3$ gives $x<-4$. Dividing the second by $2$ gives $x\ge 7$.'
          - problem: 'Sam solves $x+1<3$ or $x-1>6$ and writes $2>x>7$. Write the correct solution.'
            answer: 'x < 2 or x > 7'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The pieces give $x<2$ and $x>7$. No number is both below $2$ and above $7$, so the answer is a union of two rays: $x<2$ or $x>7$.'
          - problem: 'Solve $\frac{x}{3}>1$ or $-x\ge 2$.'
            answer: 'x <= -2 or x > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The first piece gives $x>3$. Multiplying the second by $-1$ reverses it, so $x\le -2$.'
        constraints: "solve each piece separately; keep the union"
    diagnostic_exemplar:
      problem: 'Solve $x + 2 < 1$ or $x - 4 \ge 1$.'
      answer_contract: {kind: inequality_union}
      answer: 'x < -1 or x >= 5'
      solution_sketch: 'Solve each piece: $x < -1$; $x \ge 5$; keep the union.'
    anki_seeds:
      - front: "An 'and' compound inequality gives the ___ of the solution sets; an 'or' compound inequality gives the ___."
        back: "intersection (overlap / between); union"
        type: basic

  - id: compound-inequalities
    name: "Compound Inequalities"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: and-or-inequalities
        weight: 0.7
        key: true
      - id: linear-inequalities
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Multi-step three-part inequalities"
        key_prerequisites: [and-or-inequalities]
        step_check:
          step: 'Divide all three parts by positive $5$'
          question: 'Why do both comparison signs stay the same when you divide by $5$?'
          options:
            - 'Signs reverse only when the middle part contains a constant'
            - 'Strict signs stay as they are, and only inclusive signs reverse'
            - 'The division by $5$ undoes the subtraction, so the signs return'
            - 'A positive divisor keeps the order of any two numbers'
          answer: 'A positive divisor keeps the order of any two numbers'
          why: 'For example $-7\le 5x$ gives $-7/5\le x$, and a positive divisor never changes order.'
        exemplars:
          - problem: 'Solve $-5\le 2x-1<7$.'
            answer: '-2 <= x < 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Add $1$ to all three parts: $-4\le 2x<8$. Divide by $2$ to get $-2\le x<4$.'
          - problem: 'Solve $3<2x+1\le 11$.'
            answer: '1 < x <= 5'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $1$ from all three parts: $2<2x\le 10$. Divide by $2$ to get $1<x\le 5$.'
          - problem: 'Hiring a bike costs $5$ dollars plus $3$ dollars per hour. Mia wants to pay at least $14$ and at most $26$ dollars. For how many hours $h$ can she hire it?'
            answer: '3 <= h <= 7'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The cost $5+3h$ satisfies $14\le 5+3h\le 26$. Subtract $5$ to get $9\le 3h\le 21$, then divide by $3$ to get $3\le h\le 7$.'
          - problem: 'Solve $5<3x-1\le 14$.'
            answer: '2 < x <= 5'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Add $1$ to all three parts: $6<3x\le 15$. Divide by $3$ to get $2<x\le 5$.'
          - problem: 'A baker uses $4c+2$ eggs for $c$ cakes. She wants to use more than $18$ and fewer than $50$ eggs. For which numbers of cakes $c$ is that so?'
            answer: '4 < c < 12'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Solve $18<4c+2<50$. Subtract $2$ to get $16<4c<48$, then divide by $4$ to get $4<c<12$.'
          - problem: 'Solve $-3\le \frac{x+1}{2}<4$.'
            answer: '-7 <= x < 7'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Multiply all three parts by $2$ to get $-6\le x+1<8$. Subtract $1$ to get $-7\le x<7$.'
          - problem: 'Sam solves $6<3x+3\le 15$. He subtracts $3$ from all parts but divides only the middle by $3$, and writes $3<x\le 12$. What is the correct solution?'
            answer: '1 < x <= 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'After subtracting $3$ the parts are $3<3x\le 12$. Dividing all three parts by $3$ gives $1<x\le 4$.'
          - problem: 'Solve $0\le 4x-8<20$.'
            answer: '2 <= x < 7'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Add $8$ to all three parts to get $8\le 4x<28$. Divide by $4$ to get $2\le x<7$.'
        constraints: "keep operations balanced across all parts"
      - id: kp2
        name: "Three-part with a negative coefficient"
        key_prerequisites: [linear-inequalities]
        step_check:
          step: 'Divide by $-4$ and reverse both signs'
          question: 'Why do both signs reverse when the three parts are divided by $-4$?'
          options:
            - 'Only the sign next to the negative coefficient reverses'
            - 'A negative divisor reverses every order, so both comparisons turn'
            - 'The signs reverse because the middle becomes smaller than the left'
            - 'The reversal moves the bounds from the left side to the right side'
          answer: 'A negative divisor reverses every order, so both comparisons turn'
          why: 'Dividing $-9<-4x\le 7$ by $-4$ gives $9/4>x\ge -7/4$, and every order flips together.'
        exemplars:
          - problem: 'Solve $-8<-2x\le 6$.'
            answer: '-3 <= x < 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Divide all three parts by $-2$ and reverse both signs: $4>x\ge -3$. Written from smallest to largest this is $-3\le x<4$.'
          - problem: 'Solve $1\le 5-x<9$.'
            answer: '-4 < x <= 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $5$ from all parts to get $-4\le -x<4$. Multiplying by $-1$ reverses both signs, giving $4\ge x>-4$, which is $-4<x\le 4$.'
          - problem: 'A tank holds $100$ litres and drains at $5$ litres per minute. For which times $t$ in minutes does it hold between $20$ and $60$ litres?'
            answer: '8 < t < 16'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The volume $100-5t$ satisfies $20<100-5t<60$. Subtract $100$ to get $-80<-5t<-40$, then divide by $-5$ and reverse both signs to get $8<t<16$.'
          - problem: 'Solve $-7<3-2x<13$.'
            answer: '-5 < x < 5'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $3$ to get $-10<-2x<10$. Dividing by $-2$ reverses both signs and gives $-5<x<5$.'
          - problem: 'A balloon is at a height of $1200$ m and descends $40$ m every minute. For which times $t$ in minutes is its height between $400$ m and $800$ m, ends included?'
            answer: '10 <= t <= 20'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The height $1200-40t$ satisfies $400\le 1200-40t\le 800$. Subtract $1200$ to get $-800\le -40t\le -400$, then divide by $-40$ and reverse both signs to get $10\le t\le 20$.'
          - problem: 'Solve $-4\le -\frac{x}{3}\le 6$.'
            answer: '-18 <= x <= 12'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Multiply all three parts by $-3$ and reverse both signs: $12\ge x\ge -18$. Written from smallest to largest this is $-18\le x\le 12$.'
          - problem: 'Sam divides $-6<-3x<9$ by $-3$ and writes $2<x<-3$. What is the correct solution?'
            answer: '-3 < x < 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Dividing by $-3$ gives $2>x>-3$, which reads $-3<x<2$ from smallest to largest. Sam wrote the bounds in the wrong order.'
          - problem: 'Solve $2<4-3x\le 10$.'
            answer: '-2 <= x < 2/3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $4$ to get $-2<-3x\le 6$. Dividing by $-3$ reverses both signs: $\frac{2}{3}>x\ge -2$, which is $-2\le x<\frac{2}{3}$.'
        constraints: "both inequality signs flip; rewrite smallest-to-largest"
      - id: kp3
        name: "Multi-step 'or' unions"
        key_prerequisites: [and-or-inequalities]
        step_check:
          step: 'Keep both branches'
          question: 'Why does the answer keep both branches and not only their overlap?'
          options:
            - 'Either branch makes it true, so both rays are solutions'
            - 'The overlap of the branches is empty, so only one branch can stay'
            - 'An "and" and an "or" statement have the same solution set'
            - 'The branch with the larger bound replaces the other one'
          answer: 'Either branch makes it true, so both rays are solutions'
          why: 'A value such as $-6$ satisfies only the first branch, yet $-6$ is a solution of the "or" statement.'
        exemplars:
          - problem: 'Solve $2x+1<-5$ or $3x-2>10$.'
            answer: 'x < -3 or x > 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The first piece gives $2x<-6$, so $x<-3$. The second gives $3x>12$, so $x>4$.'
          - problem: 'Solve $-2x+3\ge 15$ or $4x+1>21$.'
            answer: 'x <= -6 or x > 5'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The first piece gives $-2x\ge 12$, and dividing by $-2$ reverses it to $x\le -6$. The second gives $4x>20$, so $x>5$.'
          - problem: 'A sensor shows the value $2T+4$ for a temperature $T$. The alarm sounds when the value is below $0$ or above $40$. For which temperatures does it sound?'
            answer: 'T < -2 or T > 18'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The value $2T+4<0$ gives $2T<-4$, so $T<-2$. The value $2T+4>40$ gives $2T>36$, so $T>18$.'
          - problem: 'Solve $3(x+2)\le -9$ or $2(x-1)\ge 14$.'
            answer: 'x <= -5 or x >= 8'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The first piece gives $x+2\le -3$, so $x\le -5$. The second gives $x-1\ge 7$, so $x\ge 8$.'
          - problem: 'A fridge display shows $\frac{T}{2}+3$ for a temperature $T$. The alarm sounds when the display is below $1$ or above $6$. For which temperatures does it sound?'
            answer: 'T < -4 or T > 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The display $\frac{T}{2}+3<1$ gives $\frac{T}{2}<-2$, so $T<-4$. The display $\frac{T}{2}+3>6$ gives $T>6$.'
          - problem: 'Solve $\frac{x}{2}+3<-1$ or $5-\frac{x}{3}\le 2$.'
            answer: 'x < -8 or x >= 9'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The first piece gives $\frac{x}{2}<-4$, so $x<-8$. The second gives $-\frac{x}{3}\le -3$, and multiplying by $-3$ reverses it to $x\ge 9$.'
          - problem: 'Sam solves $2x-1<-7$ or $3x+2>14$ and writes $-3>x>4$. Write the correct solution.'
            answer: 'x < -3 or x > 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The pieces give $x<-3$ and $x>4$. No number satisfies both, so the answer is a union of two rays: $x<-3$ or $x>4$.'
          - problem: 'Solve $5-2x<-1$ or $5-2x>11$.'
            answer: 'x < -3 or x > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The first piece gives $-2x<-6$, and dividing by $-2$ reverses it to $x>3$. The second gives $-2x>6$, so $x<-3$.'
        constraints: "each piece takes two steps; keep the union"
    diagnostic_exemplar:
      problem: 'Solve $-4 < -2x \le 6$.'
      answer: '-3 <= x < 2'
      solution_sketch: 'Divide all three parts by $-2$ and reverse both signs: $2 > x \ge -3$.'
    anki_seeds:
      - front: "In a three-part inequality, every operation must be applied to ___, and dividing by a negative flips ___."
        back: "all three parts; both inequality signs"
        type: basic

  - id: interval-notation
    name: "Interval Notation"
    # core: the notation later material answers in everywhere — precalculus
    # polynomial-inequalities, calculus-1 continuity and
    # increasing-decreasing-intervals, calculus-2 power-series all demand
    # interval-notation answers (re-audit R-01). proofs:interval-notation-real-sets
    # is the set-operations rigorization of this notation, one rung above.
    core: true
    difficulty: 0.52
    drill: false
    # Interval strings and unions ("[2, 7)", "(-∞, -2) ∪ (4, ∞)") are not
    # SymPy-parseable; the tutor grades them — same call as
    # precalculus:polynomial-inequalities and proofs:interval-notation-real-sets.
    answer_kind: multi-step
    expected_time_secs: 80
    prerequisites:
      - id: compound-inequalities
        weight: 0.6
        key: true
      - id: graphing-inequalities-number-line
        weight: 0.5
        key: true
      - id: and-or-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Bounded intervals and endpoint membership"
        key_prerequisites: [graphing-inequalities-number-line]
        step_check:
          step: 'The upper endpoint $19$ is excluded by the strict sign'
          question: 'Why does the right end of $[-7,19)$ take a parenthesis?'
          options:
            - 'The right end of an interval always takes a parenthesis'
            - 'The strict sign $<$ excludes $x=19$, so $19$ is left out'
            - 'The larger endpoint is always the one that is left out'
            - 'A parenthesis marks the endpoint that has the larger number'
          answer: 'The strict sign $<$ excludes $x=19$, so $19$ is left out'
          why: 'A parenthesis means the endpoint itself is not in the set. The sign $<$ at $19$ says exactly that, while $\le$ at $-7$ gives a bracket.'
        try_first:
          problem: 'Is $x=10$ in the interval $[3, 10)$?'
          answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is"], ["no", "it is not", "no it is not", "it does not belong"]]}
          answer: 'no'
          reveal: 'The bracket at $3$ keeps $3$ in the set, but the parenthesis at $10$ leaves $10$ out. The brackets and parentheses tell you which endpoints belong.'
        exemplars:
          - problem: 'Write $-8\le x\le -3$ in interval notation.'
            answer: '[-8, -3]'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'Both endpoints are allowed by $\le$, so both get a square bracket. The smaller number goes first, which gives $[-8, -3]$.'
          - problem: 'Write $-1<x\le 6$ in interval notation.'
            answer: '(-1, 6]'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The sign $<$ at $-1$ leaves that endpoint out, so it gets a parenthesis. The sign $\le$ at $6$ keeps it in, so it gets a square bracket: $(-1, 6]$.'
          - problem: 'A lift may carry loads of at least $20$ kg and less than $800$ kg. Write the allowed loads $m$ in interval notation.'
            answer: '[20, 800)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'At least $20$ kg means $20$ is allowed, so a square bracket. Less than $800$ kg leaves $800$ out, so a parenthesis: $[20, 800)$.'
          - problem: 'Write $-7<x<4$ in interval notation.'
            answer: '(-7, 4)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'Both signs are strict, so neither endpoint belongs to the set. Both ends take a parenthesis: $(-7, 4)$.'
          - problem: 'Write $2\le x<9$ in interval notation.'
            answer: '[2, 9)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The left sign $\le$ includes $2$ and the right sign $<$ excludes $9$. The interval is $[2, 9)$.'
          - problem: 'Is $x=6$ in the interval $(-1, 6]$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is", "it belongs", "it does"], ["no", "it is not", "no it is not", "it does not belong", "it does not"]]}
            solution_sketch: 'The square bracket at $6$ means that $6$ belongs to the set. So $6$ is in the interval $(-1, 6]$.'
          - problem: 'An oven temperature $T$ must be above $170$ degrees but at most $190$ degrees. Write the allowed temperatures in interval notation.'
            answer: '(170, 190]'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'Above $170$ leaves $170$ out, so a parenthesis. At most $190$ allows $190$, so a square bracket: $(170, 190]$.'
          - problem: 'Sam writes the numbers $x$ with $3\le x<10$ as $(3, 10)$. What is the correct interval notation?'
            answer: '[3, 10)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The sign $\le$ at $3$ includes $3$, so the left end needs a square bracket. Sam used a parenthesis there, so the correct interval is $[3, 10)$.'
        constraints: "bounded intervals only; convert inequality -> interval and test one endpoint; integer endpoints"
      - id: kp2
        name: "Unbounded intervals with infinity"
        key_prerequisites: [graphing-inequalities-number-line]
        step_check:
          step: 'Both infinite ends use parentheses.'
          question: 'Why does $\infty$ always take a parenthesis?'
          options:
            - 'No number equals $\infty$, so there is no end value to include'
            - 'The inequality is strict at $\infty$, so it is left out'
            - 'Infinity is a number, but it is too large to be shown in a bracket'
            - 'A bracket is used only when the finite end has a $\ge$ sign'
          answer: 'No number equals $\infty$, so there is no end value to include'
          why: 'A bracket says that the end value belongs to the set. Since $\infty$ is not a number, nothing can belong at that end.'
        exemplars:
          - problem: 'Write $x>2$ in interval notation.'
            answer: '(2, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The values start just after $2$ and continue without end to the right. So the interval is $(2, \infty)$, with a parenthesis at both ends.'
          - problem: 'Write $x\le -1$ in interval notation.'
            answer: '(-∞, -1]'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'These are all numbers up to and including $-1$. The interval is $(-\infty, -1]$: a parenthesis at $-\infty$ and a bracket at $-1$.'
          - problem: 'A ride admits only people at least $120$ cm tall. Write the allowed heights $h$ in interval notation.'
            answer: '[120, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'At least $120$ cm includes $120$, so a bracket on the left. There is no upper limit, so the right end is $\infty$ with a parenthesis: $[120, \infty)$.'
          - problem: 'Write the interval $[4, \infty)$ as an inequality.'
            answer: 'x >= 4'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The bracket at $4$ means that $4$ is included. The interval goes right without end, so it is $x \ge 4$.'
          - problem: 'A freezer must stay below $-18$ degrees Celsius. Write the allowed temperatures $T$ in interval notation.'
            answer: '(-∞, -18)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'Below $-18$ means $-18$ itself is not allowed. The temperatures go down without end, so the interval is $(-\infty, -18)$.'
          - problem: 'Write $x\ge -3$ in interval notation.'
            answer: '[-3, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The value $-3$ is allowed, so the left end takes a bracket. The numbers continue without end to the right, which gives $[-3, \infty)$.'
          - problem: 'Write $(-\infty, 3]$ as an inequality.'
            answer: 'x <= 3'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The interval goes left without end and the bracket includes $3$. So it is $x \le 3$.'
          - problem: 'A bank account may never go below zero. Write the allowed balances $B$ in interval notation.'
            answer: '[0, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'A balance of exactly $0$ is allowed, so the left end is a bracket. Larger balances have no limit, so the interval is $[0, \infty)$.'
          - problem: 'Does the interval $(-\infty, -1]$ contain the number $-1$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "yes it does", "it contains it", "it is in the interval"], ["no", "it does not", "no it does not", "it is not in the interval"]]}
            solution_sketch: 'The square bracket at $-1$ means that $-1$ belongs to the interval. So the answer is yes.'
        constraints: "single rays both directions; infinity always gets a round bracket; convert both ways"
      - id: kp3
        name: "Unions for 'or' solutions"
        key_prerequisites: [compound-inequalities]
        step_check:
          step: 'Join them: $(-\infty,-6]\cup(7,\infty)$'
          question: 'Why are the two rays joined with $\cup$ and not written as one interval?'
          options:
            - 'The numbers between $-6$ and $7$ satisfy both of the inequalities'
            - 'A union is needed because the two rays point in different directions'
            - 'One interval would also contain the numbers between $-6$ and $7$'
            - 'Two intervals joined with or must always share one common endpoint'
          answer: 'One interval would also contain the numbers between $-6$ and $7$'
          why: 'A number such as $0$ satisfies neither branch, so it must stay out. The union keeps the two separate pieces.'
        exemplars:
          - problem: 'Write the solution of $x<-2$ or $x>4$ in interval notation.'
            answer: '(-∞, -2) ∪ (4, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'Each ray becomes an interval: $(-\infty, -2)$ and $(4, \infty)$. The word or is written with the union symbol $\cup$.'
          - problem: 'Solve $2x+1\le -3$ or $x-3>0$ and write the solution in interval notation.'
            answer: '(-∞, -2] ∪ (3, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The first inequality gives $2x\le -4$, so $x\le -2$. The second gives $x>3$, so the solution is $(-\infty,-2]\cup(3,\infty)$.'
          - problem: 'A fridge alarm sounds when the temperature $T$ is at most $1$ degree or at least $8$ degrees. Write the temperatures that sound the alarm in interval notation.'
            answer: '(-∞, 1] ∪ [8, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'At most $1$ gives $(-\infty, 1]$ and at least $8$ gives $[8, \infty)$. Either condition sounds the alarm, so the two intervals are joined by $\cup$.'
          - problem: 'Write $(-\infty, 1)\cup[5, \infty)$ using inequalities.'
            answer: 'x < 1 or x >= 5'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The interval $(-\infty,1)$ means $x<1$ and $[5,\infty)$ means $x\ge 5$. The union becomes the word or between them.'
          - problem: 'Solve $x+1\le -4$ or $2x-3>5$ and write the solution in interval notation.'
            answer: '(-∞, -5] ∪ (4, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The first inequality gives $x\le -5$. The second gives $2x>8$, so $x>4$, and the union is $(-\infty,-5]\cup(4,\infty)$.'
          - problem: 'Mia writes the solution of $x\le -1$ or $x\ge 3$ as $[-1, 3]$. What is the correct interval notation?'
            answer: '(-∞, -1] ∪ [3, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'The solutions are two outer rays, not the numbers between $-1$ and $3$. The correct notation is $(-\infty,-1]\cup[3,\infty)$.'
          - problem: 'Solve $-3x>9$ or $x+5\ge 8$ and write the solution in interval notation.'
            answer: '(-∞, -3) ∪ [3, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'Dividing $-3x>9$ by $-3$ reverses the sign and gives $x<-3$. The second inequality gives $x\ge 3$, so the solution is $(-\infty,-3)\cup[3,\infty)$.'
          - problem: 'A bus is free for children under $5$ years and for people aged $65$ or more. Write the ages $a$ that travel free in interval notation, starting at $0$.'
            answer: '[0, 5) ∪ [65, ∞)'
            answer_contract: {"kind":"required_inequality_notation"}
            solution_sketch: 'Under $5$ gives $[0, 5)$ because age $0$ is allowed and $5$ is not. Aged $65$ or more gives $[65, \infty)$, and the two intervals are joined by $\cup$.'
        constraints: "two-piece unions from 'or' inequalities; at most two solving steps per piece; convert both ways"
    diagnostic_exemplar:
      problem: 'Solve $3x + 2 < -4$ or $x - 2 \ge 1$ and give the answer in interval notation.'
      answer_contract: {kind: inequality_union}
      answer: '(-∞, -2) ∪ [3, ∞)'
      solution_sketch: '$3x < -6 \to x < -2$ (round bracket); $x \ge 3$ (square bracket); take the union.'
    anki_seeds:
      - front: "Interval notation: square bracket vs round bracket?"
        back: "square [ includes the endpoint (<= or >=); round ( excludes it (< or >)"
        type: basic
      - front: "Which bracket always goes next to ∞ or -∞ in interval notation, and why?"
        back: "a round bracket — infinity is not a number, so it can never be included"
        type: basic
      - front: "An 'or' solution set like x < -2 or x > 4 is written in interval notation as..."
        back: "(-∞, -2) ∪ (4, ∞) — the union symbol ∪ joins the pieces"
        type: basic

  - id: inequality-word-problems
    name: "Inequality Word Problems"
    core: false                # enrichment / applications leaf topic
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 130
    prerequisites:
      - id: writing-inequalities-from-statements
        weight: 0.6
        key: true
      - id: linear-inequalities
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Budget (at most) problems"
        key_prerequisites: [writing-inequalities-from-statements, linear-inequalities]
        step_check:
          step: 'Divide both sides by the positive 5'
          question: 'Why does the sign $\le$ stay the same when both sides are divided by $5$?'
          options:
            - 'Dividing by $5$ is exact here, so the sides keep their order'
            - 'The sign turns around only when the sides are not whole numbers'
            - 'The sign always turns around once and is turned back at the end'
            - 'The sign turns around only when we divide by a negative number'
          answer: 'The sign turns around only when we divide by a negative number'
          why: 'Dividing by a positive number keeps the order of the two sides, so $5x\le 85$ gives $x\le 17$ with the same sign.'
        exemplars:
          - problem: 'Shirts cost $8$ euros each and the shipping costs $10$ euros. The budget is $58$ euros. What is the greatest number of shirts that can be bought?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $x$ shirts the cost is $8x+10\le 58$, so $8x\le 48$ and $x\le 6$. The greatest whole number of shirts is $6$.'
          - problem: 'Each notebook costs $5$ euros and there is a $7$ euro order fee. The budget is $42$ euros. How many notebooks can be bought at most?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $x$ notebooks, $5x+7\le 42$ gives $5x\le 35$ and $x\le 7$. Seven notebooks cost exactly $42$ euros, so the answer is $7$.'
          - problem: 'A club has $95$ euros for a trip. Hiring the bus costs $35$ euros and each member pays $6$ euros for the entrance. How many members can go?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $m$ members the cost is $6m+35\le 95$, so $6m\le 60$ and $m\le 10$. At most $10$ members can go.'
          - problem: 'A taxi charges $3$ euros to start and $2$ euros for each kilometre. Ana has $25$ euros. How many whole kilometres can she ride?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fare for $k$ kilometres is $3+2k\le 25$, so $2k\le 22$ and $k\le 11$. She can ride $11$ kilometres.'
          - problem: 'Tickets cost $12$ euros each and booking costs $4$ euros. The budget is $100$ euros. How many tickets can be bought at most?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $t$ tickets, $12t+4\le 100$ gives $12t\le 96$, so $t\le 8$. The greatest number of tickets is $8$.'
          - problem: 'A phone plan costs $9$ euros a month plus $0.40$ euro for each extra GB. You want to pay at most $15$ euros in a month. How many extra GB can you use?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $g$ extra GB, $9+0.4g\le 15$ gives $0.4g\le 6$. Dividing by $0.4$ gives $g\le 15$, so you can use $15$ extra GB.'
          - problem: 'Tokens cost $3$ euros each and entry costs $9$ euros. The budget is $36$ euros. How many tokens can be bought?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $n$ tokens, $3n+9\le 36$ gives $3n\le 27$, so $n\le 9$. The answer is $9$ tokens.'
          - problem: 'Shirts cost $8$ euros each and the whole order has $10$ euros shipping. A shopper has $58$ euros to spend. Write an inequality for the number $x$ of shirts the shopper can buy.'
            answer: '8x + 10 <= 58'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'The cost of $x$ shirts is $8x$ euros plus $10$ euros shipping. The total must be at most $58$ euros, so the inequality is $8x+10\le 58$.'
        constraints: "cost model with a cap; integer boundary"
      - id: kp2
        name: "Minimum (at least) problems"
        key_prerequisites: [linear-inequalities]
        step_check:
          step: 'Multiply both sides by the positive 4'
          question: 'Why multiply both sides by $4$ at this point?'
          options:
            - 'Multiplying by $4$ makes the score $x$ four times as large as it was'
            - 'The average is a sum divided by $4$; multiplying by $4$ clears it'
            - 'Each of the four tests needs its own copy of $x$ on the left side'
            - 'Dividing by $4$ would turn the sign, so we multiply by $4$ instead'
          answer: 'The average is a sum divided by $4$; multiplying by $4$ clears it'
          why: 'The condition says that the sum divided by $4$ is at least $80$. Multiplying by the positive $4$ gives the sum at least $320$ and keeps the sign.'
        exemplars:
          - problem: 'Lena has $20$ euros and saves $5$ euros every week. After how many weeks will she first have at least $50$ euros?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $w$ weeks she has $20+5w\ge 50$, so $5w\ge 30$ and $w\ge 6$. The smallest number of weeks is $6$.'
          - problem: 'Two test scores are $70$ and $80$. What is the minimum third score that makes the average at least $80$?'
            answer: '90'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average condition is $(70+80+s)/3\ge 80$, so $150+s\ge 240$. Then $s\ge 90$, so the minimum score is $90$.'
          - problem: 'A school needs at least $130$ chairs for a hall. Chairs come in packs of $12$. How many packs must it buy?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $p$ packs, $12p\ge 130$ gives $p\ge 10.83$. Ten packs give only $120$ chairs, so the school must buy $11$ packs.'
          - problem: 'A tank must hold at least $45$ litres. It holds $9$ litres now and is filled at $6$ litres per minute. For how many whole minutes must it be filled?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $t$ minutes the tank holds $9+6t\ge 45$ litres, so $6t\ge 36$ and $t\ge 6$. It must be filled for $6$ minutes.'
          - problem: 'Leo has $12$ euros and saves $4$ euros every day. After how many whole days will he first have at least $32$ euros?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'He needs $32-12=20$ more euros. From $4d\ge 20$ we get $d\ge 5$, so he reaches the goal after $5$ days.'
          - problem: 'Your first three test scores are $62$, $78$ and $85$. What is the minimum score on the fourth test that makes your average at least $75$?'
            answer: '75'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The average condition is $(62+78+85+x)/4\ge 75$, so $225+x\ge 300$. Then $x\ge 75$, so the minimum score is $75$.'
          - problem: 'A baker pays $30$ euros for a market stall and earns $1.50$ euros profit on each loaf before that cost. She wants to make at least $180$ euros after paying for the stall. How many loaves must she sell?'
            answer: '140'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $n$ loaves, $1.5n-30\ge 180$ gives $1.5n\ge 210$. Dividing by $1.5$ gives $n\ge 140$, so she must sell $140$ loaves.'
          - problem: 'Leo has $12$ euros and saves $4$ euros every day. Write an inequality for the number of days $d$ after which he has at least $32$ euros.'
            answer: '12 + 4d >= 32'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'After $d$ days Leo has $12$ euros plus $4d$ euros. He needs at least $32$ euros, so the inequality is $12+4d\ge 32$.'
        constraints: "at-least targets; averages or savings"
      - id: kp3
        name: "Round the boundary sensibly"
        key_prerequisites: [writing-inequalities-from-statements]
        step_check:
          step: 'The largest whole count allowed is $3$'
          question: 'Why is the answer $3$ boxes and not $4$, although $34/9$ is closer to $4$?'
          options:
            - 'The count is always rounded to the nearest whole number, so $4$ would do'
            - 'The inequality $n\le 34/9$ forces $n$ to be smaller than $3$ boxes'
            - 'Four boxes would weigh $42$ kg, which is above the cap of $40$ kg'
            - 'Three boxes already reach the cap of $40$ kg exactly, so $3$ is the limit'
          answer: 'Four boxes would weigh $42$ kg, which is above the cap of $40$ kg'
          why: 'A whole count must satisfy $n\le 34/9=3.78$, so $4$ is too many. Rounding to the nearest whole number would break the cap.'
        try_first:
          problem: 'A ticket costs $4$ euros and you have $25$ euros. How many tickets can you buy?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'Dividing gives $25/4=6.25$, but a quarter of a ticket cannot be bought. Seven tickets cost $28$ euros, so the count rounds down to $6$.'
        exemplars:
          - problem: 'You have $20$ euros and a ticket costs $3$ euros. What is the greatest number of tickets you can buy?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition is $3n\le 20$, so $n\le 6\frac{2}{3}$. Seven tickets cost $21$ euros, which is too much, so the answer is $6$.'
          - problem: 'A ride costs $4$ euros and entry costs $5$ euros. A visitor wants to spend at most $34$ euros. How many rides can the visitor take?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition $5+4n\le 34$ gives $n\le 7.25$. Seven rides cost $33$ euros and eight cost $37$ euros, so the answer is $7$.'
          - problem: 'A shelf supports at most $25$ kg. It already holds $4$ kg and each new box weighs $6$ kg. How many boxes can be added?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition $4+6n\le 25$ gives $n\le 3.5$. Four boxes would weigh $28$ kg in total, so only $3$ boxes fit.'
          - problem: 'A lift carries at most $600$ kg. Ana weighs $70$ kg and takes boxes of $15$ kg each into the lift. How many boxes can she take at most?'
            answer: '35'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition $70+15n\le 600$ gives $n\le 35.33$. Thirty-six boxes would exceed the limit, so she can take $35$ boxes.'
          - problem: 'A class of $47$ pupils goes on a trip. Each minibus seats $9$ pupils. How many minibuses are needed?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition $9n\ge 47$ gives $n\ge 5.2$. Five minibuses seat only $45$ pupils, so $6$ minibuses are needed.'
          - problem: 'Sam has $75$ euros and wants to buy items that cost $9$ euros each. He computes $75/9\approx 8.33$ and rounds up to $9$ items. What is the greatest number of items he can really buy?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Nine items cost $81$ euros, which is more than $75$. Eight items cost $72$ euros, so the answer is $8$.'
          - problem: 'A rope is $100$ m long. A worker cuts pieces of $7$ m each. How many whole pieces can be cut?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition $7n\le 100$ gives $n\le 14.29$. Fourteen pieces use $98$ m, so $14$ pieces can be cut.'
          - problem: 'A ribbon is $90$ cm long. A shop cuts pieces of $8$ cm each. Write an inequality for the number $n$ of pieces that can be cut.'
            answer: '8n <= 90'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'The $n$ pieces use $8n$ cm of ribbon. The total cannot exceed $90$ cm, so the inequality is $8n\le 90$.'
        constraints: "whole-number contexts; round down for at-most caps"
    diagnostic_exemplar:
      problem: 'Rides cost €5 each plus a €7 entry fee, and you have €30. How many rides can you go on?'
      answer: '4'
      solution_sketch: '$5r + 7 \le 30$; $r \le 4.6$; round down to $4$.'
    anki_seeds:
      - front: "In an at-most word problem, a fractional boundary for a count of items is rounded ___."
        back: "down (you cannot buy a fraction of an item)"
        type: basic

  - id: basic-absolute-value-inequalities
    name: "Basic Absolute Value Inequalities"
    core: false                # terminal absolute-value solving branch
    difficulty: 0.50
    drill: false
    # Same shape as and-or-inequalities: compound solution sets SymPy cannot parse.
    answer_kind: multi-step
    expected_time_secs: 80
    prerequisites:
      - id: and-or-inequalities
        weight: 0.6
        key: true
      - id: absolute-value
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "|x| < a becomes an 'and' inequality"
        key_prerequisites: [and-or-inequalities]
        step_check:
          step: 'The distance from zero is less than $40$, so $-40<x<40$'
          question: 'Why does $|x|<40$ give one interval and not two separate pieces?'
          options:
            - 'The distance is below $40$ on only one side of zero'
            - 'Negative numbers have no distance, so only $0<x<40$ counts'
            - 'Both $x<40$ and $x>-40$ must hold at the same time'
            - 'The sign $<$ always gives two pieces joined by or'
          answer: 'Both $x<40$ and $x>-40$ must hold at the same time'
          why: 'A number is closer than $40$ to zero only if it is below $40$ and above $-40$ together, which is one interval.'
        try_first:
          problem: 'What is the greatest whole number $x$ with $|x|<5$?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'The numbers less than $5$ units from zero are the numbers between $-5$ and $5$. The greatest whole number among them is $4$.'
        exemplars:
          - problem: 'Solve $|x|<7$.'
            answer: '(-7, 7)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The distance of $x$ from zero is less than $7$. So $x$ lies between $-7$ and $7$ and both endpoints are left out: $(-7, 7)$.'
          - problem: 'Solve $|x|\le 4$.'
            answer: '[-4, 4]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The distance of $x$ from zero is at most $4$. So $-4\le x\le 4$ and both endpoints are included: $[-4, 4]$.'
          - problem: 'A thermostat keeps a room within $3$ degrees of the set temperature. The difference $d$ between the actual and the set temperature therefore satisfies $|d|\le 3$. Which values can $d$ take?'
            answer: '[-3, 3]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition $|d|\le 3$ means $-3\le d\le 3$. The room may be $3$ degrees too cold or too warm, so $[-3, 3]$.'
          - problem: 'Solve $9>|x|$.'
            answer: '(-9, 9)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Read the inequality as $|x|<9$. Then $-9<x<9$, so the solution is $(-9, 9)$.'
          - problem: 'Which numbers are less than $6$ units away from zero on the number line?'
            answer: '(-6, 6)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The distance of $x$ from zero is $|x|$, so the condition is $|x|<6$. The numbers between $-6$ and $6$ qualify: $(-6, 6)$.'
          - problem: 'A kitchen scale is accurate when its reading error $e$ (in grams, positive or negative) satisfies $|e|<2$. Which errors are accepted?'
            answer: '(-2, 2)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition $|e|<2$ means $-2<e<2$. The scale may read up to $2$ g too low or too high, but not exactly $2$ g.'
          - problem: 'Sam solves $|x|\le 5$ and writes $x\le 5$. What is the correct solution?'
            answer: '[-5, 5]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Sam found only the upper bound. A distance of at most $5$ from zero also needs $x\ge -5$, so the solution is $[-5, 5]$.'
          - problem: 'Solve $6\ge |x|$.'
            answer: '[-6, 6]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Read the inequality as $|x|\le 6$. Then $-6\le x\le 6$, so the solution is $[-6, 6]$.'
        constraints: "less-than gives a bounded interval"
      - id: kp2
        name: "|x| > a becomes an 'or' inequality"
        key_prerequisites: [and-or-inequalities]
        step_check:
          step: 'This puts $x$ on either outer ray: $x\le-50$ or $x\ge50$'
          question: 'Why is the answer an or statement and not an and statement?'
          options:
            - 'The numbers between $-50$ and $50$ are the ones farthest from zero'
            - 'The sign $\ge$ always gives an or statement, whatever the numbers'
            - 'The bounds $-50$ and $50$ are too far apart for an and statement'
            - 'A number is far from zero on the left or on the right, not both'
          answer: 'A number is far from zero on the left or on the right, not both'
          why: 'No number is both below $-50$ and above $50$. Each outer ray alone satisfies the inequality, so the two rays are joined with or.'
        exemplars:
          - problem: 'Solve $|x|>4$.'
            answer: 'x < -4 or x > 4'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The distance of $x$ from zero is more than $4$. So $x<-4$ or $x>4$, and both endpoints are left out.'
          - problem: 'Solve $|x|\ge 2$.'
            answer: 'x <= -2 or x >= 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The distance of $x$ from zero is at least $2$. So $x\le -2$ or $x\ge 2$, and both endpoints are included.'
          - problem: 'A seismograph raises an alert when the ground movement $m$ (in mm, positive or negative) satisfies $|m|\ge 5$. For which values of $m$ is the alert raised?'
            answer: 'm <= -5 or m >= 5'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition $|m|\ge 5$ means that $m\le -5$ or $m\ge 5$. A movement of $5$ mm in either direction raises the alert.'
          - problem: 'Solve $6<|x|$.'
            answer: 'x < -6 or x > 6'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Read the inequality as $|x|>6$. Then $x<-6$ or $x>6$, and both endpoints are left out.'
          - problem: 'Which numbers are more than $8$ units away from zero on the number line?'
            answer: 'x < -8 or x > 8'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The distance of $x$ from zero is $|x|$, so the condition is $|x|>8$. The numbers qualify if $x<-8$ or $x>8$.'
          - problem: 'A guitar string counts as out of tune when its pitch error $p$ (in cents, positive or negative) satisfies $|p|>10$. For which values of $p$ is the string out of tune?'
            answer: 'p < -10 or p > 10'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition $|p|>10$ means $p<-10$ or $p>10$. The string is out of tune when the pitch is more than $10$ cents too low or too high.'
          - problem: 'Sam solves $|x|>3$ and writes $-3<x<3$. What is the correct solution?'
            answer: 'x < -3 or x > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Sam wrote the numbers that are closer than $3$ to zero. A distance greater than $3$ needs the two outer rays: $x<-3$ or $x>3$.'
          - problem: 'Solve $7\le |x|$.'
            answer: 'x <= -7 or x >= 7'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Read the inequality as $|x|\ge 7$. Then $x\le -7$ or $x\ge 7$, and both endpoints are included.'
          - problem: 'Is $x=-5$ a solution of $|x|>4$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is", "it is a solution"], ["no", "it is not", "no it is not", "not a solution"]]}
            solution_sketch: 'The value $-5$ is $5$ units from zero, and $5>4$. So $-5$ is a solution.'
        constraints: "greater-than gives two rays"
      - id: kp3
        name: "Degenerate cases"
        key_prerequisites: [absolute-value]
        step_check:
          step: 'An absolute value is at least zero for every real input'
          question: 'Why does this fact settle $|x|\le-8$ at once?'
          options:
            - 'A number that is at least $0$ is never at most $-8$'
            - 'The bars turn the negative bound $-8$ into $8$'
            - 'The value $|x|$ is negative whenever $x$ is negative'
            - 'Negative bounds always give the answer all real numbers'
          answer: 'A number that is at least $0$ is never at most $-8$'
          why: 'Every value of $|x|$ is $0$ or larger, and $0$ is already larger than $-8$. So no $x$ makes $|x|\le-8$ true.'
        exemplars:
          - problem: 'Solve $|x|<-2$.'
            answer: 'no solution'
            answer_contract: {"kind": "label", "options": [["no solution", "none", "there is no solution", "empty set", "∅"], ["all real numbers", "every real number", "all numbers", "any real number", "all reals", "(-∞, ∞)", "all x", "any x"]]}
            solution_sketch: 'An absolute value is never negative, so it cannot be less than $-2$. No number $x$ satisfies the inequality.'
          - problem: 'Solve $|x|\ge -1$.'
            answer: 'all real numbers'
            answer_contract: {"kind": "label", "options": [["no solution", "none", "there is no solution", "empty set", "∅"], ["all real numbers", "every real number", "all numbers", "any real number", "all reals", "(-∞, ∞)", "all x", "any x"]]}
            solution_sketch: 'Every absolute value is at least $0$, and $0$ is greater than $-1$. So every real number is a solution.'
          - problem: 'Solve $-2<|x|<3$.'
            answer: '(-3, 3)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition $|x|>-2$ holds for every $x$, so only $|x|<3$ restricts the numbers. The solution is $-3<x<3$.'
          - problem: 'A machine part must have no error at all, so its error $e$ (in mm) satisfies $|e|\le 0$. Which values of $e$ are allowed?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value $|e|$ is never below $0$, so $|e|\le 0$ means $|e|=0$. The only allowed value is $e=0$.'
          - problem: 'A guard reports that a robot''s distance $|p|$ from the start point (at $p=0$ on a straight track) is more than $0$. Where can the robot be?'
            answer: 'p < 0 or p > 0'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The distance $|p|$ is positive for every $p$ except $0$. So the robot is anywhere except the start point: $p<0$ or $p>0$.'
          - problem: 'Solve $|x|<-3$ or $|x|<2$.'
            answer: '(-2, 2)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The first inequality has no solution. The second gives $-2<x<2$, so the union is $(-2, 2)$.'
          - problem: 'Solve $|x|>0$.'
            answer: 'x < 0 or x > 0'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The value $|x|$ is positive for every $x$ except $0$. So the solutions are $x<0$ or $x>0$.'
        constraints: "negative right-hand side only"
    diagnostic_exemplar:
      problem: 'Solve $|x| > 3$.'
      answer_contract: {kind: inequality_union}
      answer: "x < -3 or x > 3"
      solution_sketch: 'Greater-than splits into an "or": the points more than $3$ from zero lie on either side.'
    anki_seeds:
      - front: "Rewrite |X| < a (a > 0) without absolute value:"
        back: "-a < X < a (an AND / conjunction)"
        type: basic
      - front: "Rewrite |X| > a (a > 0) without absolute value:"
        back: "X < -a or X > a (an OR / disjunction)"
        type: basic

  - id: absolute-value-inequalities
    name: "Absolute Value Inequalities"
    core: false
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 110
    prerequisites:
      - id: basic-absolute-value-inequalities
        weight: 0.7
        key: true
      - id: absolute-value-equations
        weight: 0.5
        key: true
      - id: compound-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "|linear| < a"
        key_prerequisites: [basic-absolute-value-inequalities]
        step_check:
          step: 'Subtract 10 from all three parts'
          question: 'Why must $10$ be subtracted from all three parts and not only from the middle?'
          options:
            - 'Only the middle part contains $x$, so the outer two parts may stay'
            - 'Subtracting from the middle alone would reverse both of the signs'
            - 'All three parts are linked, so each change must reach every part'
            - 'The outer parts are bounds, so they are never allowed to change'
          answer: 'All three parts are linked, so each change must reach every part'
          why: 'A chain such as $-40<5x+10<40$ stays true only if the same number is subtracted from every part. Otherwise the bounds would be wrong.'
        exemplars:
          - problem: 'Solve $|x-3|<8$.'
            answer: '(-5, 11)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition means $-8<x-3<8$. Adding $3$ to all three parts gives $-5<x<11$.'
          - problem: 'Solve $|2x+1|\le 7$.'
            answer: '[-4, 3]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition means $-7\le 2x+1\le 7$. Subtracting $1$ gives $-8\le 2x\le 6$, and dividing by $2$ gives $-4\le x\le 3$.'
          - problem: 'A baker''s oven must stay within $12$ degrees of $180$ degrees. Which temperatures $T$ are allowed?'
            answer: '[168, 192]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The difference between $T$ and $180$ is at most $12$, so $|T-180|\le 12$. Then $168\le T\le 192$.'
          - problem: 'Solve $5>|3x-2|$.'
            answer: '(-1, 7/3)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Read the inequality as $|3x-2|<5$, which means $-5<3x-2<5$. Adding $2$ gives $-3<3x<7$, so $-1<x<7/3$.'
          - problem: 'A metal rod is accepted when its length $L$ differs from $50$ cm by less than $0.4$ cm. Which lengths are accepted?'
            answer: '(49.6, 50.4)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The difference between $L$ and $50$ is less than $0.4$, so $|L-50|<0.4$. Then $-0.4<L-50<0.4$, which gives $49.6<L<50.4$.'
          - problem: 'Solve $9\ge |4-x|$.'
            answer: '[-5, 13]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Read the inequality as $|4-x|\le 9$, so $-9\le 4-x\le 9$. Subtracting $4$ gives $-13\le -x\le 5$, and dividing by $-1$ reverses the signs: $-5\le x\le 13$.'
          - problem: 'A hiker stays within $2.5$ km of a hut at kilometre mark $12$ on a straight path. Which kilometre marks $k$ can the hiker be at?'
            answer: '[9.5, 14.5]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The distance of the hiker from the hut is $|k-12|\le 2.5$. So $-2.5\le k-12\le 2.5$ and $9.5\le k\le 14.5$.'
          - problem: 'Sam solves $|5-2x|<7$ and writes $(-6, 1)$. What is the correct solution?'
            answer: '(-1, 6)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition means $-7<5-2x<7$, so $-12<-2x<2$. Dividing by $-2$ reverses the signs and gives $-1<x<6$.'
        constraints: "linear inside; bounded interval answers"
      - id: kp2
        name: "|linear| > a"
        key_prerequisites: [basic-absolute-value-inequalities]
        step_check:
          step: 'Keep the union of both branches'
          question: 'Why does the answer keep both branches and not only one of them?'
          options:
            - 'Both branches must hold together, so the answer is their overlap'
            - 'Values far from the centre on either side are all solutions'
            - 'Only one branch can be true, so the other one serves as a check'
            - 'The branch with the larger solution set is the one that is kept'
          answer: 'Values far from the centre on either side are all solutions'
          why: 'The original inequality holds if the inside is above $22$ or below $-22$. Each branch gives a part of the solution set and nothing is lost.'
        exemplars:
          - problem: 'Solve $|2x+1|\ge 5$.'
            answer: 'x <= -3 or x >= 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Split into $2x+1\ge 5$ and $2x+1\le -5$. The first gives $x\ge 2$ and the second gives $x\le -3$.'
          - problem: 'Solve $|x+4|>2$.'
            answer: 'x < -6 or x > -2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Split into $x+4>2$ and $x+4<-2$. The first gives $x>-2$ and the second gives $x<-6$.'
          - problem: 'A pump is out of tolerance when its pressure $p$ differs from $40$ kPa by at least $6$ kPa. For which pressures is the pump out of tolerance?'
            answer: 'p <= 34 or p >= 46'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The difference is $|p-40|\ge 6$, so $p-40\ge 6$ or $p-40\le -6$. Then $p\ge 46$ or $p\le 34$.'
          - problem: 'Solve $|3-2x|>7$.'
            answer: 'x < -2 or x > 5'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Split into $3-2x>7$ and $3-2x<-7$. Dividing by $-2$ reverses each sign: $x<-2$ and $x>5$.'
          - problem: 'A van must stay more than $3$ km away from a depot at kilometre mark $5$ of a straight road. Which kilometre marks $k$ are allowed?'
            answer: 'k < 2 or k > 8'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The distance from the depot is $|k-5|>3$. So $k-5>3$ or $k-5<-3$, which gives $k>8$ or $k<2$.'
          - problem: 'Solve $|x/3-2|\ge 4$.'
            answer: 'x <= -6 or x >= 18'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Split into $x/3-2\ge 4$ and $x/3-2\le -4$. Adding $2$ and multiplying by $3$ gives $x\ge 18$ or $x\le -6$.'
          - problem: 'Sam solves $|x-1|>4$ and writes $-3<x<5$. What is the correct solution?'
            answer: 'x < -3 or x > 5'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Sam wrote the numbers closer than $4$ to $1$. A distance greater than $4$ gives $x-1>4$ or $x-1<-4$, so $x>5$ or $x<-3$.'
          - problem: 'Is $x=0$ a solution of $|2x-3|>2$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is", "it is a solution"], ["no", "it is not", "no it is not", "not a solution"]]}
            solution_sketch: 'At $x=0$ the value is $|-3|=3$, and $3>2$. So $0$ is a solution.'
        constraints: "two-ray answers; keep the union"
      - id: kp3
        name: "Isolate the absolute value first"
        key_prerequisites: [absolute-value-equations]
        step_check:
          step: 'Divide by 4: $|x + 6| \le 7$'
          question: 'Why divide by $4$ before the bars are rewritten as a chain?'
          options:
            - 'Dividing by $4$ turns the sign around, which the rewriting needs'
            - 'The $4$ would be added to both branches after the split is done'
            - 'The bars can be removed only when the numbers have become smaller'
            - 'The rewriting rule needs the bars alone on one side of the sign'
          answer: 'The rewriting rule needs the bars alone on one side of the sign'
          why: 'The rule $|A|\le 7$ means $-7\le A\le 7$ works only when $|A|$ stands alone. With $4|x+6|$ the bound would apply to the wrong quantity.'
        exemplars:
          - problem: 'Solve $2|x-4|+3\le 15$.'
            answer: '[-2, 10]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $3$ and divide by $2$ to get $|x-4|\le 6$. Then $-6\le x-4\le 6$, so $-2\le x\le 10$.'
          - problem: 'Solve $3|2x+1|-5<16$.'
            answer: '(-4, 3)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Add $5$ and divide by $3$ to get $|2x+1|<7$. Then $-7<2x+1<7$, so $-4<x<3$.'
          - problem: 'Solve $2|x+1|-3>5$.'
            answer: 'x < -5 or x > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Add $3$ and divide by $2$ to get $|x+1|>4$. Then $x+1>4$ or $x+1<-4$, so $x>3$ or $x<-5$.'
          - problem: 'A company pays $20+5|s-60|$ euros for a score $s$, where $60$ is the target score. For which scores is the pay below $50$ euros?'
            answer: '(54, 66)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition is $20+5|s-60|<50$, so $|s-60|<6$. Then $-6<s-60<6$, which gives $54<s<66$ for the allowed scores.'
          - problem: 'Solve $19\ge 4|x+2|+3$.'
            answer: '[-6, 2]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Read the inequality as $4|x+2|+3\le 19$. Then $|x+2|\le 4$, so $-4\le x+2\le 4$ and $-6\le x\le 2$.'
          - problem: 'Solve $10-2|x+3|\ge 2$.'
            answer: '[-7, 1]'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Subtract $10$ and divide by $-2$, which reverses the sign: $|x+3|\le 4$. Then $-4\le x+3\le 4$, so $-7\le x\le 1$.'
          - problem: 'The cost per hour of a machine is $4|t-30|+8$ euros, where $t$ is the temperature in degrees Celsius. For which temperatures is the cost at least $40$ euros?'
            answer: 't <= 22 or t >= 38'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'The condition is $4|t-30|+8\ge 40$, so $|t-30|\ge 8$. Then $t-30\ge 8$ or $t-30\le -8$, which gives $t\ge 38$ or $t\le 22$.'
          - problem: 'Solve $5|3-x|-2<18$.'
            answer: '(-1, 7)'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Add $2$ and divide by $5$ to get $|3-x|<4$. Then $-4<3-x<4$, and dividing by $-1$ reverses the signs: $-1<x<7$.'
        constraints: "isolate the absolute value before splitting into cases"
    diagnostic_exemplar:
      problem: 'Solve $2|x - 3| - 1 \le 7$.'
      answer: '-1 <= x <= 7'
      solution_sketch: '$2|x - 3| \le 8$; $|x - 3| \le 4$; $-4 \le x - 3 \le 4$.'
    anki_seeds:
      - front: "Before splitting an absolute value inequality into cases, first ___."
        back: "isolate the absolute value expression on one side"
        type: basic

  - id: graphing-linear-inequalities
