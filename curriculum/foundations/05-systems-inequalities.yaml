            solution_sketch: "Insert horizontal coordinate -1 and vertical coordinate 2 into each equation. The first left-minus-right difference is -1; the second is 1. A nonzero difference means that equation fails, so the pair cannot solve the system."
            answer_contract: {"kind": "multipart", "parts": [{"name": "residuals", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "solution", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
