          - problem: "Check this apparent graphical intersection $(3,2)$ in $2x+y=8$ and $x-y=2$. Report residuals as the ordered pair of left-side-minus-right-side differences for each equation after substitution; report solution as yes or no."
            answer: "residuals = (0,-1); solution = no"
            solution_sketch: "Insert horizontal coordinate 3 and vertical coordinate 2 into each equation. The first left-minus-right difference is 0; the second is -1. A nonzero difference means that equation fails, so the pair cannot solve the system."
            answer_contract: {"kind": "multipart", "parts": [{"name": "residuals", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "solution", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
          - problem: "The plotted crossing is estimated at $(4,1)$ in $x/2-y=1$ and $y+x=5$. Report residuals as the ordered pair of left-side-minus-right-side differences for each equation after substitution; report solution as yes or no."
            answer: "residuals = (0,0); solution = yes"
            solution_sketch: "Insert horizontal coordinate 4 and vertical coordinate 1 into each equation. The first left-minus-right difference is 0; the second is 0. Both differences vanish, so the point lies on both lines."
            answer_contract: {"kind": "multipart", "parts": [{"name": "residuals", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "solution", "contract": {"kind": "label", "options": [["yes"], ["no"]]}}]}
          - problem: "A rough sketch suggests $(-1,2)$ in $x=2y-4$ and $3x+y=-2$. Report residuals as the ordered pair of left-side-minus-right-side differences for each equation after substitution; report solution as yes or no."
