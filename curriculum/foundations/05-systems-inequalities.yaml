        weight: 0.5
        key: true
      - id: compound-inequalities
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "|linear| < a"
        key_prerequisites: [basic-absolute-value-inequalities]
        exemplars:
          - problem: 'Solve $|x - 2| < 6$.'
            answer: "-4 < x < 8"
            solution_sketch: '$-6 < x - 2 < 6$; add $2$.'
          - problem: 'Solve $|2x - 3| \le 5$.'
            answer: "-1 <= x <= 4"
            solution_sketch: '$-5 \le 2x - 3 \le 5$; add $3$, divide by $2$.'
        constraints: "linear inside; bounded interval answers"
      - id: kp2
        name: "|linear| > a"
        key_prerequisites: [basic-absolute-value-inequalities]
        exemplars:
          - problem: 'Solve $|2x + 1| \ge 5$.'
            answer: "x >= 2 or x <= -3"
            solution_sketch: '$2x + 1 \ge 5$ or $2x + 1 \le -5$.'
          - problem: 'Solve $|x + 4| > 2$.'
            answer: "x > -2 or x < -6"
        constraints: "two-ray answers; keep the union"
      - id: kp3
        name: "Isolate the absolute value first"
        key_prerequisites: [absolute-value-equations]
        exemplars:
          - problem: 'Solve $2|x - 1| + 3 \le 9$.'
            answer: "-2 <= x <= 4"
            solution_sketch: '$|x - 1| \le 3$; $-3 \le x - 1 \le 3$.'
          - problem: 'Solve $3|x| - 5 > 7$.'
            answer: "x < -4 or x > 4"
            solution_sketch: '$|x| > 4$.'
        constraints: "isolate the absolute value before splitting into cases"
    diagnostic_exemplar:
      problem: 'Solve $2|x - 3| - 1 \le 7$.'
      answer: '-1 <= x <= 7'
      solution_sketch: '$2|x - 3| \le 8$; $|x - 3| \le 4$; $-4 \le x - 3 \le 4$.'
    anki_seeds:
      - front: "Before splitting an absolute value inequality into cases, first ___."
        back: "isolate the absolute value expression on one side"
        type: basic

  - id: graphing-linear-inequalities
    name: "Graphing Linear Inequalities"
    core: false
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: graphing-linear-equations
        weight: 0.6
        key: true
      - id: linear-inequalities
        weight: 0.5
        key: true
      - id: slope-intercept-form
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Boundary line: solid or dashed"
        key_prerequisites: [graphing-linear-equations]
        exemplars:
          - problem: 'For $y > 2x + 1$, is the boundary line solid or dashed?'
            answer: "dashed"
            solution_sketch: 'Strict inequality ($>$) $\to$ dashed.'
          - problem: 'For $y \le -x + 3$, is the boundary line solid or dashed?'
            answer: "solid"
        constraints: "solid for <= or >=; dashed for < or >"
      - id: kp2
        name: "Test a point to choose the shaded side"
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: 'Is $(0, 0)$ a solution of $y < x + 2$?'
            answer: "yes"
            solution_sketch: '$0 < 0 + 2$ is true.'
          - problem: 'Is $(1, 4)$ a solution of $y \ge 2x + 1$?'
            answer: "yes"
            solution_sketch: '$4 \ge 2(1) + 1 = 3$ is true.'
        constraints: "substitute a test point; true -> shade that side"
      - id: kp3
        name: "Shade using the origin test"
        key_prerequisites: [linear-inequalities]
        exemplars:
          - problem: 'For $2x + 3y \le 6$, does the shaded region include the origin?'
            answer: "yes"
            solution_sketch: '$0 \le 6$ is true, so shade the side containing $(0, 0)$.'
          - problem: 'For $y > x - 1$, does the shaded region include the origin?'
            answer: "yes"
            solution_sketch: '$0 > -1$ is true.'
        constraints: "the origin is the easiest test point unless it is on the line"
    diagnostic_exemplar:
      problem: 'For $y > x - 1$, state whether the boundary is dashed or solid and whether $(0, 0)$ is a solution.'
      answer: "dashed; yes, (0, 0) is a solution"
      solution_sketch: '$>$ gives a dashed line; $0 > -1$ is true.'
    anki_seeds:
      - front: "Boundary line style for a linear inequality: solid vs dashed?"
        back: "solid for <= / >=, dashed for < / >"
        type: basic
      - front: "Which side of the boundary line do you shade for a linear inequality?"
        back: "the side where a test point makes the inequality true"
        type: basic

  - id: checking-systems-solutions
    name: "Checking Solutions of Systems"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: solutions-of-two-variable-equations
        weight: 0.7
        key: true
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Verify a pair in both equations"
        key_prerequisites: [solutions-of-two-variable-equations]
        exemplars:
          - problem: 'Is $(1, 4)$ the solution of the system $y = 3x + 1$ and $y = x + 3$?'
            answer: "yes"
            solution_sketch: '$3(1) + 1 = 4$ and $1 + 3 = 4$; both hold.'
          - problem: 'Is $(2, 5)$ the solution of $y = x + 3$ and $y = 2x + 1$?'
            answer: "yes"
            solution_sketch: '$2 + 3 = 5$ and $2(2) + 1 = 5$.'
        constraints: "check the point in BOTH equations"
      - id: kp2
        name: "Reject a pair that fails one equation"
        key_prerequisites: [solutions-of-two-variable-equations]
        exemplars:
          - problem: 'Is $(3, 2)$ a solution of the system $x + y = 5$ and $x - y = 2$?'
            answer: "no"
            solution_sketch: '$3 + 2 = 5$ holds, but $3 - 2 = 1 \ne 2$.'
          - problem: 'Is $(2, 1)$ a solution of $2x + y = 5$ and $3x - y = 4$?'
            answer: "no"
            solution_sketch: '$5$ holds, but $6 - 1 = 5 \ne 4$.'
        constraints: "one equation passes, the other fails"
      - id: kp3
        name: "Pick the solution from candidates"
        key_prerequisites: [solutions-of-two-variable-equations]
        exemplars:
          - problem: 'Which of $(1, 3)$ or $(2, 5)$ solves the system $y = 2x + 1$ and $y = x + 2$?'
            answer: "(1, 3)"
            solution_sketch: '$(1, 3)$ satisfies both; $(2, 5)$ fails $y = x + 2$.'
          - problem: 'Which of $(0, 2)$ or $(4, 6)$ solves $y = x + 2$ and $x + y = 10$?'
            answer: "(4, 6)"
            solution_sketch: '$6 = 4 + 2$ and $4 + 6 = 10$.'
        constraints: "two candidates; exactly one works"
    diagnostic_exemplar:
      problem: 'Which of $(1, 4)$ or $(3, 2)$ solves the system $x + y = 5$ and $2x - y = 4$?'
      answer: '(3, 2)'
      solution_sketch: '$(1, 4)$ fails the second equation ($2 - 4 = -2$); $(3, 2)$ satisfies both.'
    anki_seeds:
      - front: "An ordered pair is a solution of a system only if it satisfies ___."
        back: "every equation in the system"
        type: basic

  - id: graphing-systems
    name: "Solving Systems by Graphing"
    core: false
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: graphing-linear-equations
        weight: 0.6
        key: true
      - id: checking-systems-solutions
        weight: 0.5
        key: true
      - id: slope-intercept-form
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Solution as the intersection point"
        key_prerequisites: [graphing-linear-equations]
        exemplars:
          - problem: 'Where do the lines $y = x + 1$ and $y = -x + 5$ intersect?'
            answer: "(2, 3)"
            solution_sketch: '$x + 1 = -x + 5$; $2x = 4$; $x = 2$; $y = 3$.'
          - problem: 'Where do the lines $y = 2x$ and $y = x + 3$ intersect?'
            answer: "(3, 6)"
        constraints: "the intersection point is the solution"
      - id: kp2
        name: "Graph and intersect mixed forms"
        key_prerequisites: [graphing-linear-equations]
        exemplars:
          - problem: 'Graph $x + y = 4$ and $y = x + 2$. Where do they intersect?'
            answer: "(1, 3)"
            solution_sketch: '$x + (x + 2) = 4$; $x = 1$; $y = 3$.'
          - problem: 'Where do the lines $y = 3$ and $x = 2$ intersect?'
            answer: "(2, 3)"
        constraints: "standard form, slope-intercept, and horizontal/vertical lines"
      - id: kp3
        name: "Confirm a graphical estimate algebraically"
        key_prerequisites: [checking-systems-solutions]
        exemplars:
          - problem: 'The graphs suggest $(2, 3)$ solves $y = 2x - 1$ and $y = x + 1$. Verify.'
            answer: "yes, it checks in both"
            solution_sketch: '$2(2) - 1 = 3$ and $2 + 1 = 3$.'
          - problem: 'The graphs suggest $(3, 1)$ solves $x + y = 4$ and $x - y = 1$. Verify.'
            answer: "no; it fails x - y = 1"
            solution_sketch: '$3 + 1 = 4$ holds, but $3 - 1 = 2 \ne 1$.'
        constraints: "an estimate must be checked in both equations"
    diagnostic_exemplar:
      problem: 'Where do the lines $x + y = 6$ and $y = 2x$ intersect?'
      answer: '(2, 4)'
      solution_sketch: '$x + 2x = 6$; $x = 2$; $y = 4$.'
    anki_seeds:
      - front: "Graphically, the solution of a system of two lines appears as ___."
        back: "the intersection point of the graphs"
        type: basic

  - id: substitution-with-isolated-variable
    name: "Substitution with an Isolated Variable"
    core: true
    difficulty: 0.46
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: multi-step-equations
        weight: 0.6
        key: true
      - id: checking-systems-solutions
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Substitute an isolated expression"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Solve the system $y = 2x$, $x + y = 9$.'
            answer: "(3, 6)"
            solution_sketch: '$x + 2x = 9$; $x = 3$; $y = 6$.'
          - problem: 'Solve the system $y = x + 1$, $2x + y = 7$.'
            answer: "(2, 3)"
            solution_sketch: '$2x + x + 1 = 7$; $3x = 6$; $x = 2$; $y = 3$.'
        constraints: "one equation already solved for a variable; integer solutions"
      - id: kp2
        name: "Equal-values method"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Solve the system $y = 3x - 2$, $y = x + 4$.'
            answer: "(3, 7)"
            solution_sketch: '$3x - 2 = x + 4$; $2x = 6$; $x = 3$; $y = 7$.'
          - problem: 'Solve the system $y = 5x$, $y = 2x + 9$.'
            answer: "(3, 15)"
            solution_sketch: '$5x = 2x + 9$; $3x = 9$; $x = 3$; $y = 15$.'
        constraints: "both equations solved for y; set them equal"
      - id: kp3
        name: "Back-substitute and check"
        key_prerequisites: [checking-systems-solutions]
        exemplars:
          - problem: 'Solve the system $y = x - 2$, $x + 2y = 11$ and check your answer.'
            answer: "(5, 3)"
            solution_sketch: '$x + 2(x - 2) = 11$; $3x = 15$; $x = 5$; $y = 3$; check $5 + 6 = 11$.'
          - problem: 'Solve the system $y = 4x$, $x + y = 15$.'
            answer: "(3, 12)"
            solution_sketch: '$5x = 15$; $x = 3$; $y = 12$.'
        constraints: "verify the pair in the equation not used for back-substitution"
    diagnostic_exemplar:
      problem: 'Solve the system $y = 3x$ and $x + y = 12$.'
      answer: "(3, 9)"
      solution_sketch: '$x + 3x = 12$; $x = 3$; $y = 9$.'
    anki_seeds:
      - front: "Substitution method for a system of equations:"
        back: "solve one equation for a variable, substitute it into the other, solve, then back-substitute"
        type: basic

  - id: systems-substitution
    name: "Systems by Substitution"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: substitution-with-isolated-variable
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: true
      - id: distributive-property
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Isolate a variable, then substitute"
        key_prerequisites: [substitution-with-isolated-variable]
        exemplars:
          - problem: 'Solve the system $2x + y = 5$, $3x - y = 5$.'
            answer: "(2, 1)"
            solution_sketch: '$y = 5 - 2x$; $3x - (5 - 2x) = 5$; $5x = 10$; $x = 2$; $y = 1$.'
          - problem: 'Solve the system $x + 2y = 11$, $x = y + 2$.'
            answer: "(5, 3)"
            solution_sketch: '$(y + 2) + 2y = 11$; $3y = 9$; $y = 3$; $x = 5$.'
        constraints: "solve for the variable with coefficient 1; integer solutions"
      - id: kp2
        name: "Substitution with distribution"
        key_prerequisites: [distributive-property]
        exemplars:
          - problem: 'Solve the system $x = 2y + 1$, $3x - 4y = 7$.'
            answer: "(5, 2)"
            solution_sketch: '$3(2y + 1) - 4y = 7$; $2y + 3 = 7$; $y = 2$; $x = 5$.'
          - problem: 'Solve the system $y = 2x - 3$, $4x - 3y = 5$.'
            answer: "(2, 1)"
            solution_sketch: '$4x - 3(2x - 3) = 5$; $-2x + 9 = 5$; $x = 2$; $y = 1$.'
        constraints: "distribute a coefficient over the substituted expression"
      - id: kp3
        name: "Careful sign handling"
        key_prerequisites: [substitution-with-isolated-variable]
        exemplars:
          - problem: 'Solve the system $x + y = 10$, $x - y = 4$.'
            answer: "(7, 3)"
            solution_sketch: '$x = 10 - y$; $(10 - y) - y = 4$; $y = 3$; $x = 7$.'
          - problem: 'Solve the system $x - 2y = 1$, $2x + y = 12$.'
            answer: "(5, 2)"
            solution_sketch: '$x = 1 + 2y$; $2(1 + 2y) + y = 12$; $5y = 10$; $y = 2$; $x = 5$.'
        constraints: "subtraction of substituted expressions; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve the system by substitution: $x + 3y = 13$ and $2x - y = 5$.'
      answer: '(4, 3)'
      solution_sketch: '$x = 13 - 3y$; $2(13 - 3y) - y = 5$; $7y = 21$; $y = 3$ and $x = 4$.'
    anki_seeds:
      - front: "When neither equation of a system has an isolated variable, isolate the variable whose coefficient is ___."
        back: "1 (or -1) — it avoids fractions"
        type: basic

  - id: elimination-with-addition
    name: "Elimination by Adding Equations"
    core: true
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: substitution-with-isolated-variable
        weight: 0.4
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: multi-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Add when coefficients are opposites"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Solve the system $x + y = 7$, $x - y = 3$.'
            answer: "(5, 2)"
            solution_sketch: 'Add: $2x = 10$; $x = 5$; $y = 2$.'
          - problem: 'Solve the system $2x + y = 8$, $3x - y = 7$.'
            answer: "(3, 2)"
            solution_sketch: 'Add: $5x = 15$; $x = 3$; $y = 2$.'
        constraints: "coefficients already opposite; integer solutions"
      - id: kp2
        name: "Subtract when coefficients are equal"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Solve the system $x + 2y = 7$, $x + y = 4$.'
            answer: "(1, 3)"
            solution_sketch: 'Subtract: $y = 3$; then $x = 1$.'
          - problem: 'Solve the system $3x + y = 11$, $x + y = 5$.'
            answer: "(3, 2)"
            solution_sketch: 'Subtract: $2x = 6$; $x = 3$; $y = 2$.'
        constraints: "matching coefficients; subtract carefully"
      - id: kp3
        name: "Back-substitute and verify"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Solve the system $2x + y = 10$, $x - y = 2$ and check.'
            answer: "(4, 2)"
            solution_sketch: 'Add: $3x = 12$; $x = 4$; $y = 2$; check $8 + 2 = 10$ and $4 - 2 = 2$.'
          - problem: 'Solve the system $x + y = 6$, $x - y = 8$.'
            answer: "(7, -1)"
            solution_sketch: 'Add: $2x = 14$; $x = 7$; $y = -1$.'
        constraints: "solutions may include negatives; verify in both equations"
    diagnostic_exemplar:
      problem: 'Solve by elimination: $3x + y = 5$ and $x + y = 7$.'
      answer: '(-1, 8)'
      solution_sketch: 'Subtract the equations: $2x = -2$, so $x = -1$ and $y = 8$.'
    anki_seeds:
      - front: "Eliminate a variable by adding when its coefficients are ___, or subtracting when they are ___."
        back: "opposites; equal"
        type: basic

  - id: systems-elimination
    name: "Systems by Elimination"
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: multi-step
    expected_time_secs: 130
    prerequisites:
      - id: elimination-with-addition
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.4
      - id: distributive-property
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Scale one equation first"
        key_prerequisites: [elimination-with-addition]
        exemplars:
          - problem: 'Solve the system $2x + 3y = 12$, $x + y = 5$.'
            answer: "(3, 2)"
            solution_sketch: 'Multiply 2nd by $2$: $2x + 2y = 10$; subtract: $y = 2$; $x = 3$.'
          - problem: 'Solve the system $x + 2y = 11$, $3x - y = 5$.'
            answer: "(3, 4)"
            solution_sketch: 'Multiply 1st by $3$: $3x + 6y = 33$; subtract 2nd: $7y = 28$; $y = 4$; $x = 3$.'
        constraints: "scale to create opposite coefficients; integer solutions"
      - id: kp2
        name: "Scale both equations"
        key_prerequisites: [elimination-with-addition]
        exemplars:
          - problem: 'Solve the system $2x + 3y = 7$, $3x + 2y = 8$.'
            answer: "(2, 1)"
            solution_sketch: '$\times 3$ and $\times 2$: $6x + 9y = 21$, $6x + 4y = 16$; subtract: $5y = 5$; $y = 1$; $x = 2$.'
          - problem: 'Solve the system $3x + 4y = 10$, $2x + 3y = 7$.'
            answer: "(2, 1)"
            solution_sketch: '$\times 2$ and $\times 3$: $6x + 8y = 20$, $6x + 9y = 21$; subtract: $y = 1$; $x = 2$.'
        constraints: "scale both to match one variable; integer solutions"
      - id: kp3
        name: "Use a negative multiplier"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Solve the system $2x + 5y = 16$, $4x + 3y = 18$.'
            answer: "(3, 2)"
            solution_sketch: 'Multiply 1st by $-2$: $-4x - 10y = -32$; add: $-7y = -14$; $y = 2$; $x = 3$.'
          - problem: 'Solve the system $3x + 2y = 13$, $x + 4y = 11$.'
            answer: "(3, 2)"
            solution_sketch: 'Multiply 2nd by $-3$: $-3x - 12y = -33$; add: $-10y = -20$; $y = 2$; $x = 3$.'
        constraints: "negative multipliers turn subtraction into addition"
    diagnostic_exemplar:
      problem: 'Solve the system by elimination: $3x + 2y = 12$ and $2x + 3y = 13$.'
      answer: '(2, 3)'
      solution_sketch: 'Scale both: $9x + 6y = 36$ and $4x + 6y = 26$; subtract: $5x = 10$.'
    anki_seeds:
      - front: "Elimination method for a system of equations:"
        back: "scale one or both equations so a variable's coefficients are opposites, add to eliminate it, solve, then back-substitute"
        type: basic

  - id: systems-special-cases
    name: "Systems with No or Infinitely Many Solutions"
    core: true
    difficulty: 0.54
    drill: false
    answer_kind: expression
