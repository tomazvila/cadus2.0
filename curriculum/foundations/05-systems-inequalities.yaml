            solution_sketch: 'At $(1,5)$, $3(1)+2=5$ holds, and $1+5=6$ also holds. The point is on both lines, so it is exactly their crossing point.'
          - problem: 'From a graph, Ana reads the lines $2x+y=8$ and $x-y=2$ as crossing at $(3,2)$. Is she right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "she is right", "correct", "right"], ["no", "no it is not", "it is not", "she is not right", "wrong", "not right"]]}
            solution_sketch: 'At $(3,2)$, $2(3)+2=8$ holds, but $3-2=1$, not 2. The point is not on the second line, so Ana is not right.'
          - problem: 'A graph suggests that $y=2x-1$ and $y=-x+7$ cross near $(2,3)$. Find the exact crossing point.'
            answer: '(8/3,13/3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Equal heights give $2x-1=-x+7$, so $3x=8$ and $x=8/3$. Then $y=2(8/3)-1=13/3$. The estimate $(2,3)$ is close but not exact.'
          - problem: 'The graphs of two phone plans are $y=12+4x$ and $y=7x$, with $y$ the cost in dollars after $x$ gigabytes. A graph suggests the plans cost the same at 4 gigabytes and 27 dollars. Find the exact crossing point.'
            answer: '(4,28)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Equal costs give $12+4x=7x$, so $12=3x$ and $x=4$. Then $y=7(4)=28$, so the cost is 28 dollars, not 27.'
          - problem: 'A rough sketch puts the crossing of $x=2y-4$ and $3x+y=-2$ at $(-1,2)$. Find the exact crossing point.'
            answer: '(-8/7,10/7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Put $x=2y-4$ into the second equation: $3(2y-4)+y=-2$, so $7y=10$ and $y=10/7$. Then $x=2(10/7)-4=-8/7$.'
          - problem: 'Ana has 50 dollars and saves 10 dollars a week, so her savings are $y=50+10x$ after $x$ weeks. Ben has 20 dollars and saves 15 dollars a week, so $y=20+15x$. A graph suggests they have the same amount after 5 weeks. After how many weeks exactly?'
