        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'Solve the system $x + y = 3$, $x + y = 7$.'
            answer: "no solution"
            solution_sketch: 'Subtracting gives $0 = 4$, a contradiction.'
          - problem: 'Solve the system $2x + 2y = 8$, $x + y = 4$.'
            answer: "infinitely many solutions"
            solution_sketch: 'The first is twice the second; elimination gives $0 = 0$.'
        constraints: "elimination ends in a false statement (none) or 0 = 0 (infinite)"
      - id: kp2
        name: "Detect special cases from slopes and graphs"
        key_prerequisites: [slope-intercept-form]
        exemplars:
          - problem: 'How many solutions does the system $y = 2x + 1$, $y = 2x - 3$ have?'
            answer: "none"
            solution_sketch: 'Equal slopes, different intercepts $\to$ parallel.'
          - problem: 'How many solutions does the system $y = x + 2$, $2y = 2x + 4$ have?'
            answer: "infinitely many"
            solution_sketch: 'Same line.'
        constraints: "parallel -> none; same line -> infinitely many; else one"
      - id: kp3
        name: "Classify one / none / infinitely many"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'How many solutions does the system $y = 3x + 1$, $y = 2x + 1$ have?'
            answer: "exactly one"
            solution_sketch: 'Different slopes, so the lines cross once (at $(0, 1)$).'
          - problem: 'How many solutions does the system $6x - 2y = 10$, $3x - y = 5$ have?'
            answer: "infinitely many"
            solution_sketch: 'The first is twice the second: the same line.'
        constraints: "mix all three cases across generated problems"
    diagnostic_exemplar:
      problem: 'How many solutions does the system $4x - 2y = 6$, $2x - y = 3$ have?'
      answer: 'infinitely many'
      solution_sketch: 'Doubling the second equation gives the first: the two equations describe the same line.'
    anki_seeds:
      - front: "Graphically, a system of two lines has no solution when ___ and infinitely many when ___."
        back: "the lines are parallel (equal slope, different intercept); the lines are identical"
        type: basic

  - id: systems-of-linear-inequalities
    name: "Systems of Linear Inequalities"
    core: false               # supplemental, like its graphing prerequisites
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: graphing-linear-inequalities
        weight: 0.7
        key: true
      - id: graphing-systems
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Check a point against both inequalities"
        key_prerequisites: [graphing-linear-inequalities]
        exemplars:
          - problem: 'Is $(1, 1)$ a solution of the system $y \le x + 2$ and $y > -x$?'
            answer: "yes"
            solution_sketch: '$1 \le 3$ and $1 > -1$ both hold.'
          - problem: 'Is $(0, 4)$ a solution of the system $y < 2x + 1$ and $y \ge x$?'
            answer: "no"
            solution_sketch: '$4 < 1$ fails.'
        constraints: "the point must satisfy BOTH inequalities"
      - id: kp2
        name: "Boundary styles and the overlap region"
        key_prerequisites: [graphing-linear-inequalities]
        exemplars:
          - problem: 'For the system $y \le 2x + 1$, $y > -x + 4$, which boundary line is dashed?'
            answer: "y = -x + 4 (the strict one)"
          - problem: 'What is the solution region of a system of two linear inequalities?'
            answer: "the overlap (intersection) of the two shaded half-planes"
        constraints: "one strict and one inclusive inequality per problem"
      - id: kp3
        name: "Locate a point in the solution region"
        key_prerequisites: [graphing-linear-inequalities]
        exemplars:
          - problem: 'Which of $(0, 2)$ or $(2, 0)$ satisfies both $y > x$ and $y < x + 4$?'
            answer: "(0, 2)"
            solution_sketch: '$2 > 0$ and $2 < 4$; the other point fails $y > x$.'
          - problem: 'Does the origin satisfy the system $y \ge x - 3$ and $y \le -x + 5$?'
            answer: "yes"
            solution_sketch: '$0 \ge -3$ and $0 \le 5$.'
        constraints: "candidate points off the boundary lines"
    diagnostic_exemplar:
      problem: 'Is $(2, 3)$ a solution of the system $y > x$ and $y \le 2x$?'
      answer: "yes"
      solution_sketch: '$3 > 2$ and $3 \le 4$ both hold.'
    anki_seeds:
      - front: "The solution of a system of linear inequalities is the ___ of the individual shaded regions."
        back: "intersection (overlap)"
        type: basic

  - id: systems-money-problems
    name: "Money and Ticket Systems"
    # over-coverage: coin/ticket context schema for systems-substitution +
    # systems-elimination; the technique, not the context, is the prerequisite
    core: false
    difficulty: 0.54
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: systems-substitution
        weight: 0.5
        key: true
      - id: systems-elimination
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Count equation plus value equation"
        key_prerequisites: [systems-substitution]
        exemplars:
          - problem: 'Adult tickets cost €8 and child tickets €5. Ten tickets sold for €68. How many of each?'
            answer: "6 adult and 4 child"
            solution_sketch: '$a + c = 10$, $8a + 5c = 68$; $a = 6$, $c = 4$.'
          - problem: 'A jar has $5$-cent and $10$-cent coins: $12$ coins worth $95$ cents. How many of each?'
            answer: "5 five-cent and 7 ten-cent coins"
            solution_sketch: '$n + d = 12$, $5n + 10d = 95$; $n = 5$, $d = 7$.'
        constraints: "one count equation and one value equation"
      - id: kp2
        name: "Two-item purchase problems"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: '$3$ pens and $2$ notebooks cost €12; $1$ pen and $2$ notebooks cost €8. Find each price.'
            answer: "pens €2, notebooks €3"
            solution_sketch: 'Subtract: $2p = 4$; $p = 2$; $n = 3$.'
          - problem: '$2$ burgers and $1$ portion of chips cost €11; $1$ burger and $1$ portion of chips cost €7. Find each price.'
            answer: "burgers €4, chips €3"
            solution_sketch: 'Subtract: $b = 4$; $f = 3$.'
        constraints: "two purchases of the same two items; elimination-friendly numbers"
      - id: kp3
        name: "Solve and verify in context"
        key_prerequisites: [systems-substitution]
        exemplars:
          - problem: 'Adult tickets cost €10 and student tickets €6. Fifteen tickets sold for €110. How many adult tickets?'
            answer: "5"
            solution_sketch: '$a + s = 15$, $10a + 6s = 110$; $4a = 20$; $a = 5$.'
          - problem: 'A purse has $20$-cent and $5$-cent coins: $9$ coins worth €1.50. How many are $20$-cent coins?'
            answer: "7"
            solution_sketch: '$t + f = 9$, $20t + 5f = 150$; $15t = 105$; $t = 7$.'
        constraints: "verify counts are nonnegative integers and totals match"
    diagnostic_exemplar:
      problem: '$2$ coffees and $3$ buns cost €12; $1$ coffee and $2$ buns cost €7. What is the price of one coffee in euros?'
      answer: '3'
      solution_sketch: '$2c + 3b = 12$ and $c + 2b = 7$; eliminating $c$ gives $b = 2$, so $c = 3$.'
    anki_seeds:
      - front: "Money/ticket system setup: one equation counts the ___, the other totals the ___."
        back: "items; value (money)"
        type: basic

  - id: systems-mixture-problems
    name: "Mixture Systems"
    # over-coverage: acid/coffee-blend context schema — the percent-weighted
    # presentation of systems-money-problems, no new technique
    core: false
    difficulty: 0.56
    drill: false
    answer_kind: multi-step
    expected_time_secs: 170
    prerequisites:
      - id: systems-money-problems
        weight: 0.7
        key: true
      - id: percentages
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Set up the amount and value equations"
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'How much pure acid is in $12$ L of a $35\%$ acid solution?'
            answer: "4.2 L"
            solution_sketch: '$0.35 \times 12 = 4.2$.'
          - problem: 'Mixing $x$ L of $25\%$ acid with $y$ L of $60\%$ acid to get $20$ L of $40\%$ acid: give both equations.'
            answer: "x + y = 20 and 0.25x + 0.60y = 8"
            solution_sketch: 'Amounts sum to $20$; pure acid sums to $0.40(20) = 8$.'
        constraints: "amount equation plus concentration (pure-substance) equation"
      - id: kp2
        name: "Percent-solution mixtures"
        key_prerequisites: [systems-money-problems]
        exemplars:
          - problem: 'How many liters of $20\%$ acid and $50\%$ acid make $30$ L of $30\%$ acid?'
            answer: "20 L of 20% and 10 L of 50%"
            solution_sketch: '$x + y = 30$, $0.2x + 0.5y = 9$; $0.2x + 0.5(30 - x) = 9$; $x = 20$.'
          - problem: 'How many liters of $10\%$ and $40\%$ saline make $12$ L of $20\%$ saline?'
            answer: "8 L of 10% and 4 L of 40%"
            solution_sketch: '$x + y = 12$, $0.1x + 0.4y = 2.4$; $x = 8$, $y = 4$.'
        constraints: "target strength strictly between the two ingredient strengths"
      - id: kp3
        name: "Price-blend mixtures"
        key_prerequisites: [systems-money-problems]
        exemplars:
          - problem: 'Coffee at €8/kg is blended with coffee at €12/kg to make $10$ kg worth €9/kg. How much of each?'
            answer: "7.5 kg of €8 coffee and 2.5 kg of €12 coffee"
            solution_sketch: '$x + y = 10$, $8x + 12y = 90$; $4y = 10$; $y = 2.5$.'
          - problem: 'Nuts at €6/kg are mixed with raisins at €3/kg to make $9$ kg costing €36. How much of each?'
            answer: "3 kg nuts and 6 kg raisins"
            solution_sketch: '$n + r = 9$, $6n + 3r = 36$; $3n = 9$; $n = 3$.'
        constraints: "blend price between the two ingredient prices; halves allowed"
    diagnostic_exemplar:
      problem: 'How many liters each of $10\%$ and $30\%$ solution make $8$ L of $25\%$ solution?'
      answer: "2 L of 10% and 6 L of 30%"
      solution_sketch: '$x + y = 8$, $0.1x + 0.3y = 2$; $0.1x + 0.3(8 - x) = 2$; $0.2x = 0.4$; $x = 2$.'
    anki_seeds:
      - front: "Mixture system: amount equation x + y = total; the second equation totals the ___."
        back: "pure substance (or value): (conc1)x + (conc2)y = (target conc)(total)"
        type: basic

  - id: systems-rate-problems
    name: "Rate Systems (Current and Wind)"
    # over-coverage: current/wind and meeting-problem context schema for
    # systems-elimination; d = rt dressing, no new solving technique
    core: false
    difficulty: 0.57
    drill: false
    answer_kind: multi-step
    expected_time_secs: 170
    prerequisites:
      - id: systems-elimination
        weight: 0.6
        key: true
      - id: systems-substitution
        weight: 0.4
      - id: equation-word-problems
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Current and wind: sum and difference"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'A boat travels $12$ km/h downstream and $8$ km/h upstream. Find the boat speed and current speed.'
            answer: "boat 10 km/h, current 2 km/h"
            solution_sketch: '$b + c = 12$, $b - c = 8$; $b = 10$, $c = 2$.'
          - problem: 'A plane flies $500$ km/h with the wind and $460$ km/h against it. Find the plane speed and wind speed.'
            answer: "plane 480 km/h, wind 20 km/h"
            solution_sketch: '$p + w = 500$, $p - w = 460$; $p = 480$, $w = 20$.'
        constraints: "downstream = sum, upstream = difference of the two rates"
      - id: kp2
        name: "Compute the two speeds from d = rt first"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'A kayaker paddles $12$ km downstream in $2$ h and back in $3$ h. Find the kayak and current speeds.'
            answer: "kayak 5 km/h, current 1 km/h"
            solution_sketch: 'Speeds $\frac{12}{2} = 6$ and $\frac{12}{3} = 4$; $b + c = 6$, $b - c = 4$.'
          - problem: 'A plane flies $1200$ km with the wind in $4$ h and back in $5$ h. Find the plane and wind speeds.'
            answer: "plane 270 km/h, wind 30 km/h"
            solution_sketch: 'Speeds $300$ and $240$; $p + w = 300$, $p - w = 240$.'
        constraints: "distances divide evenly by the times"
      - id: kp3
        name: "Two travelers"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'Two cars $300$ km apart drive toward each other and meet in $3$ h. One is $20$ km/h faster. Find both speeds.'
            answer: "60 km/h and 40 km/h"
            solution_sketch: 'Combined speed $\frac{300}{3} = 100$; $r_1 + r_2 = 100$, $r_1 - r_2 = 20$.'
          - problem: 'Two trains leave stations $450$ km apart toward each other and meet in $5$ h. Their speeds differ by $10$ km/h. Find both.'
            answer: "50 km/h and 40 km/h"
            solution_sketch: 'Combined speed $90$; sum $90$, difference $10$.'
        constraints: "meeting problems: combined speed = total distance / time"
    diagnostic_exemplar:
      problem: 'A rower goes $18$ km downstream in $2$ h and returns in $3$ h. Find the rowing speed and the current speed.'
      answer: 'rowing speed 7.5 km/h, current 1.5 km/h'
      solution_sketch: 'Downstream $\frac{18}{2} = 9 = b + c$; upstream $\frac{18}{3} = 6 = b - c$; so $b = 7.5$ and $c = 1.5$.'
    anki_seeds:
      - front: "With a current or wind: downstream/tailwind speed = ___; upstream/headwind speed = ___."
        back: "b + c (sum); b - c (difference)"
        type: basic

  - id: systems-word-problems
    name: "Systems Word Problems"
    core: false                # word-problem genre; cone now supplemental
    difficulty: 0.58
    drill: false
    answer_kind: multi-step
    expected_time_secs: 165
    prerequisites:
      # the generic one-variable modelling capstone: every exemplar below is a
      # sentence-to-equation translation, generalised to two variables. It was
      # already an ancestor (via systems-rate-problems), so this edge adds no new
      # gate; it keeps translating-sentences-to-equations in the closure now that
      # the specialised money/rate feeders are supplemental.
      - id: equation-word-problems
        weight: 0.5
        key: true
      - id: systems-elimination
        weight: 0.4
        key: true
      - id: systems-substitution
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Set up two equations from a sum/difference"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'The sum of two numbers is $20$ and their difference is $6$. Find the numbers.'
            answer: "13 and 7"
            solution_sketch: '$x + y = 20$, $x - y = 6$; add: $x = 13$, $y = 7$.'
          - problem: 'Two numbers sum to $15$, and one is twice the other. Find them.'
            answer: "10 and 5"
            solution_sketch: '$x + y = 15$, $x = 2y$; $y = 5$, $x = 10$.'
        constraints: "define two variables; one relationship per sentence"
      - id: kp2
        name: "Geometry and age setups"
        key_prerequisites: [systems-substitution]
        exemplars:
          - problem: 'A rectangle''s length is $3$ more than twice its width, and its perimeter is $36$. Find the dimensions.'
            answer: "width 5, length 13"
            solution_sketch: '$l = 2w + 3$, $2l + 2w = 36$; $6w + 6 = 36$; $w = 5$, $l = 13$.'
          - problem: 'Two angles are supplementary and one is $30^\circ$ more than the other. Find both.'
            answer: "105 and 75 degrees"
            solution_sketch: '$x + y = 180$, $x = y + 30$; $y = 75$, $x = 105$.'
        constraints: "perimeter, supplementary/complementary angles, or ages"
      - id: kp3
        name: "Multi-relationship setups"
        key_prerequisites: [systems-elimination]
        exemplars:
          - problem: 'The sum of two numbers is $25$; twice the larger minus the smaller is $20$. Find the numbers.'
            answer: "15 and 10"
            solution_sketch: '$x + y = 25$, $2x - y = 20$; add: $3x = 45$; $x = 15$, $y = 10$.'
          - problem: 'Sam is $4$ years older than Tia and their ages sum to $30$. How old is each?'
            answer: "Sam 17, Tia 13"
            solution_sketch: '$s = t + 4$, $s + t = 30$; $2t + 4 = 30$; $t = 13$, $s = 17$.'
        constraints: "one scaled relationship plus one sum; integer answers"
    diagnostic_exemplar:
      problem: 'The sum of two numbers is $28$; twice the larger minus the smaller is $23$. Find the numbers.'
      answer: '17 and 11'
      solution_sketch: '$x + y = 28$ and $2x - y = 23$; adding gives $3x = 51$, so $x = 17$ and $y = 11$.'
    anki_seeds:
      - front: "To set up a systems word problem: define ___ variables and write one equation per ___."
        back: "two; stated relationship"
        type: basic
