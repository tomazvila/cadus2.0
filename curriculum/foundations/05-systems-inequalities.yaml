  - id: systems-substitution
    name: "Systems by Substitution"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: substitution-with-isolated-variable
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: true
      - id: distributive-property
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Isolate a variable, then substitute"
        key_prerequisites: [substitution-with-isolated-variable]
        step_check:
          step: 'Substitute this expression into the second equation'
          question: 'Why do we write $11-3y$ in parentheses when it replaces $x$ in $4x-y=18$?'
          options:
            - 'So the $4$ multiplies the whole expression, not just $11$'
            - 'So the new equation keeps both $x$ and $y$ in it'
            - 'So the $-y$ outside the brackets cancels the $-3y$ inside it'
            - 'So the $11$ can be moved to the right side at once'
          answer: 'So the $4$ multiplies the whole expression, not just $11$'
          why: 'The expression $11-3y$ stands for one number, so $4$ times it is $4(11-3y)=44-12y$. Without brackets the $-3y$ would escape the $4$.'
        try_first:
          problem: 'If $y=2x$ and $x+y=12$, what is $x$?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'Replace $y$ by $2x$ in the second equation: $x+2x=12$, so $3x=12$ and $x=4$. Substitution turns two unknowns into one.'
        exemplars:
          - problem: 'Solve the system $x+2y=16$, $3x+y=18$ by substitution.'
            answer: '(4, 6)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Isolate $x=16-2y$ from the first equation. Then $3(16-2y)+y=18$ gives $48-5y=18$, so $y=6$ and $x=16-12=4$. Check: $4+2(6)=16$ and $3(4)+6=18$.'
          - problem: 'Solve the system $2x-y=1$, $x+3y=11$ by substitution.'
            answer: '(2, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Isolate $x=11-3y$ from the second equation, since its coefficient is $1$. Then $2(11-3y)-y=1$ gives $22-7y=1$, so $y=3$ and $x=2$. Check: $2(2)-3=1$ and $2+3(3)=11$.'
          - problem: 'The sum of two numbers is $25$. The larger number is $7$ more than the smaller number. What is the smaller number?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let the larger number be $x$ and the smaller one $y$. Then $x+y=25$ and $x=y+7$, so $(y+7)+y=25$ and $2y=18$. The smaller number is $9$ and the larger is $16$.'
          - problem: 'Three pens and one notebook cost $11$ dollars. One pen and one notebook cost $5$ dollars. How many dollars does one notebook cost?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let a pen cost $x$ and a notebook $y$. The second equation gives $y=5-x$, so $3x+(5-x)=11$ and $2x=6$. A pen costs $3$ dollars, so a notebook costs $5-3=2$ dollars.'
          - problem: 'Solve the system $3x+y=2$, $x-2y=10$ by substitution.'
            answer: '(2, -4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Isolate $y=2-3x$ from the first equation. Then $x-2(2-3x)=10$ gives $7x-4=10$, so $x=2$ and $y=2-6=-4$. Check: $3(2)+(-4)=2$ and $2-2(-4)=10$.'
          - problem: 'A rectangle has perimeter $42$ cm. Its length is $5$ cm more than its width. What is the width?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Let the length be $x$ and the width $y$. Then $2x+2y=42$ and $x=y+5$, so $2(y+5)+2y=42$ and $4y=32$. The width is $8$ cm and the length is $13$ cm.'
          - problem: 'Solve the system $x-3y=9$, $2x+5y=7$ by substitution.'
            answer: '(6, -1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Isolate $x=9+3y$ from the first equation. Then $2(9+3y)+5y=7$ gives $18+11y=7$, so $y=-1$ and $x=9-3=6$. Check: $6-3(-1)=9$ and $2(6)+5(-1)=7$.'
          - problem: 'A group of $22$ people fills $7$ vehicles exactly. Each minibus carries $4$ people and each car carries $2$ people. How many minibuses are there?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $x$ be the number of minibuses and $y$ the number of cars. Then $x+y=7$ gives $y=7-x$, and $4x+2(7-x)=22$ gives $2x=8$. There are $4$ minibuses and $3$ cars.'
        constraints: "solve for the variable with coefficient 1; integer solutions"
      - id: kp2
        name: "Substitution with distribution"
        key_prerequisites: [distributive-property]
        step_check:
          step: 'Distribute the $-2$'
          question: 'Why does $-2(4x-5)$ become $-8x+10$ and not $-8x-10$?'
          options:
            - 'Only the first term inside the brackets is multiplied by $-2$'
            - 'A minus sign outside brackets changes only the sign of the answer'
            - 'The $-2$ multiplies each term inside, and $-2\times(-5)=+10$'
            - 'The product $-2\times(-5)$ is $-10$, since two minus signs add up'
          answer: 'The $-2$ multiplies each term inside, and $-2\times(-5)=+10$'
          why: 'Each term in the brackets is multiplied by $-2$: $-2\times4x=-8x$ and $-2\times(-5)=+10$, because a negative times a negative is positive.'
        exemplars:
          - problem: 'Solve the system $x=2y+3$, $3x-4y=19$ by substitution.'
            answer: '(13, 5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute $x=2y+3$ into the second equation. Distribute: $3(2y+3)-4y=19$ becomes $2y+9=19$, so $y=5$ and $x=13$. Check: $13=2(5)+3$ and $3(13)-4(5)=19$.'
          - problem: 'Solve the system $y=3x-2$, $5x-2y=0$ by substitution.'
            answer: '(4, 10)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute $y=3x-2$ into the second equation: $5x-2(3x-2)=0$. Distributing the $-2$ gives $-x+4=0$, so $x=4$ and $y=3(4)-2=10$. Check: $5(4)-2(10)=0$.'
          - problem: 'One number is $3$ less than twice a second number. Three times the first number plus five times the second number is $68$. What is the first number?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let the second number be $y$ and the first $x=2y-3$. Then $3(2y-3)+5y=68$ gives $11y-9=68$, so $y=7$. The first number is $2(7)-3=11$.'
          - problem: 'Solve the system $x=7-2y$, $4x+3y=13$ by substitution.'
            answer: '(1, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute $x=7-2y$ into the second equation: $4(7-2y)+3y=13$. Distribute to get $28-5y=13$, so $y=3$ and $x=7-6=1$. Check: $4(1)+3(3)=13$.'
          - problem: 'A rectangle has perimeter $72$ cm. Its length is $4$ cm less than three times its width. What is the length?'
            answer: '26'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Let the length be $x$ and the width $y$. Then $2(3y-4)+2y=72$ gives $8y-8=72$, so $y=10$. The length is $3(10)-4=26$ cm.'
          - problem: 'Solve the system $y=-2(x-1)$, $3x+2y=9$ by substitution.'
            answer: '(-5, 12)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute the whole expression: $3x+2(-2(x-1))=9$, which is $3x-4(x-1)=9$. Distribute to get $-x+4=9$, so $x=-5$ and $y=-2(-6)=12$.'
          - problem: 'Solve the system $x=3(y-1)$, $2x+y=15$ by substitution.'
            answer: '(6, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute $x=3(y-1)$ into the second equation: $2\cdot3(y-1)+y=15$. Distribute to get $7y-6=15$, so $y=3$ and $x=3(2)=6$. Check: $2(6)+3=15$.'
        constraints: "distribute a coefficient over the substituted expression"
      - id: kp3
        name: "Careful sign handling"
        key_prerequisites: [substitution-with-isolated-variable]
        step_check:
          step: 'Distribute the minus sign'
          question: 'Why is $3x-(15-x)$ equal to $3x-15+x$ and not $3x-15-x$?'
          options:
            - 'The minus sign applies only to the $15$, so $-x$ stays as it is'
            - 'The minus sign reverses the sign of every term in the brackets'
            - 'A minus sign in front of brackets means the brackets are dropped'
            - 'Two minus signs in one line always cancel the whole bracket'
          answer: 'The minus sign reverses the sign of every term in the brackets'
          why: 'Subtracting $(15-x)$ means subtracting $15$ and subtracting $-x$, and subtracting $-x$ is the same as adding $x$.'
        exemplars:
          - problem: 'Solve the system $x+y=3$, $2x-y=12$ by substitution.'
            answer: '(5, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Isolate $y=3-x$. Then $2x-(3-x)=12$ gives $3x-3=12$, so $x=5$ and $y=-2$. The minus before the brackets changes both signs inside. Check: $5+(-2)=3$ and $2(5)-(-2)=12$.'
          - problem: 'Solve the system $x-2y=-8$, $3x+y=-3$ by substitution.'
            answer: '(-2, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Isolate $x=2y-8$. Then $3(2y-8)+y=-3$ gives $7y-24=-3$, so $y=3$ and $x=2(3)-8=-2$. Check: $-2-2(3)=-8$ and $3(-2)+3=-3$.'
          - problem: 'The temperatures in two towns add up to $-2$ degrees Celsius. The first town is $14$ degrees colder than the second. What is the temperature in the first town?'
            answer: '-8'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'Let the first town be $x$ and the second $y$. Then $x+y=-2$ and $x=y-14$, so $(y-14)+y=-2$ and $2y=12$. The second town has $6$ degrees, so the first has $6-14=-8$ degrees.'
          - problem: 'Solve the system $2x+y=-4$, $x-3y=5$ by substitution.'
            answer: '(-1, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Isolate $y=-4-2x$. Then $x-3(-4-2x)=5$ gives $x+12+6x=5$, so $7x=-7$ and $x=-1$. Then $y=-4+2=-2$. Check: $-1-3(-2)=5$.'
          - problem: 'Kim and Joe have bank balances that add up to $40$ dollars. Kim''s balance is $60$ dollars less than Joe''s balance. A balance can be below zero. What is Kim''s balance in dollars?'
            answer: '-10'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let Kim have $x$ dollars and Joe $y$ dollars. Then $x+y=40$ and $x=y-60$, so $(y-60)+y=40$ and $2y=100$. Joe has $50$ dollars, so Kim has $50-60=-10$ dollars.'
          - problem: 'Sam solves $x+y=8$ and $4x-y=7$. He writes $y=8-x$ and then $4x-8-x=7$, so $3x=15$ and $x=5$. What is the correct value of $x$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The substitution must be $4x-(8-x)=7$, because the minus sign reverses both terms. This gives $4x-8+x=7$, so $5x=15$ and $x=3$. Then $y=8-3=5$.'
          - problem: 'Solve the system $2x-y=-5$, $x+2y=0$ by substitution.'
            answer: '(-2, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Isolate $y=2x+5$ from the first equation. Then $x+2(2x+5)=0$ gives $5x+10=0$, so $x=-2$ and $y=2(-2)+5=1$. Check: $2(-2)-1=-5$ and $-2+2(1)=0$.'
        constraints: "subtraction of substituted expressions; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve the system by substitution: $x + 3y = 13$ and $2x - y = 5$.'
      answer: '(4, 3)'
      solution_sketch: '$x = 13 - 3y$; $2(13 - 3y) - y = 5$; $7y = 21$; $y = 3$ and $x = 4$.'
    anki_seeds:
      - front: "When neither equation of a system has an isolated variable, isolate the variable whose coefficient is ___."
        back: "1 (or -1) — it avoids fractions"
        type: basic

  - id: elimination-with-addition
    name: "Elimination by Adding Equations"
    core: true
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: substitution-with-isolated-variable
        weight: 0.4
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: multi-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Add when coefficients are opposites"
        key_prerequisites: [integer-addition-subtraction]
        step_check:
          step: 'Add the two equations so the $y$-terms cancel'
          question: 'Why does adding the two equations remove $y$?'
          options:
            - 'Both equations contain $y$, and equal terms always cancel'
            - 'The coefficients $5$ and $-5$ are opposites, so they add to $0$'
            - 'Adding always removes the variable with the larger coefficient'
            - 'The right sides $21$ and $-9$ add up to a value that cancels $y$'
          answer: 'The coefficients $5$ and $-5$ are opposites, so they add to $0$'
          why: 'In $(3x+5y)+(3x-5y)$ the $y$-terms are $5y-5y=0$, so only $x$ remains: $6x=12$.'
        try_first:
          problem: 'If $x+y=10$ and $x-y=4$, what is $x$?'
          answer_contract: {"kind":"exact"}
          answer: '7'
          reveal: 'Adding the equations cancels $y$: $2x=14$, so $x=7$. When the coefficients of one variable are opposites, adding removes that variable at once.'
        exemplars:
          - problem: 'Solve the system $2x+y=17$, $3x-y=13$ by elimination.'
            answer: '(6, 5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $y$ coefficients $1$ and $-1$ are opposites, so add the equations: $5x=30$ and $x=6$. Then $y=17-12=5$. Check: $2(6)+5=17$ and $3(6)-5=13$.'
          - problem: 'Solve the system $x+3y=13$, $-x+2y=2$ by elimination.'
            answer: '(4, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $x$ coefficients $1$ and $-1$ are opposites, so add the equations: $5y=15$ and $y=3$. Then $x=13-9=4$. Check: $4+3(3)=13$ and $-4+2(3)=2$.'
          - problem: 'The sum of two numbers is $19$ and their difference is $5$. What is the larger number?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let the numbers be $x$ and $y$, with $x+y=19$ and $x-y=5$. Adding the equations cancels $y$ and gives $2x=24$. The larger number is $12$ and the smaller is $7$.'
          - problem: 'Solve the system $3x-2y=16$, $x+2y=0$ by elimination.'
            answer: '(4, -2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $y$ coefficients $-2$ and $2$ are opposites, so add the equations: $4x=16$ and $x=4$. Then $2y=-4$, so $y=-2$. Check: $3(4)-2(-2)=16$.'
          - problem: 'A boat travels at $18$ km/h with the current and at $10$ km/h against it. What is the speed of the current?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'Let $b$ be the speed of the boat in still water and $c$ the speed of the current. With the current the speeds add, so $b+c=18$, and against it $b-c=10$. Adding the equations cancels $c$ and gives $2b=28$, so $b=14$. Then $c=18-14=4$, so the current runs at $4$ km/h.'
          - problem: 'Solve the system $-2x-y=1$, $2x+4y=8$ by elimination.'
            answer: '(-2, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $x$ coefficients $-2$ and $2$ are opposites, so add the equations: $3y=9$ and $y=3$. Then $-2x=1+3$, so $x=-2$. Check: $2(-2)+4(3)=8$.'
          - problem: 'Solve the system $5x+2y=4$, $-5x+3y=-19$ by elimination.'
            answer: '(2, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $x$ coefficients $5$ and $-5$ are opposites, so add the equations: $5y=-15$ and $y=-3$. Then $5x=4+6=10$, so $x=2$. Check: $-5(2)+3(-3)=-19$.'
        constraints: "coefficients already opposite; integer solutions"
      - id: kp2
        name: "Subtract when coefficients are equal"
        key_prerequisites: [integer-addition-subtraction]
        step_check:
          step: 'Subtract the second equation from the first so the $x$-terms cancel'
          question: 'Why do we subtract here instead of adding?'
          options:
            - 'The $y$ coefficients $3$ and $1$ differ, so $y$ has to be removed'
            - 'Both right sides are positive, so they have to be subtracted'
            - 'Subtracting always gives smaller numbers to work with'
            - 'The $x$ coefficients are equal, so subtracting gives $4x-4x=0$'
          answer: 'The $x$ coefficients are equal, so subtracting gives $4x-4x=0$'
          why: 'Adding would give $8x$ and keep $x$. Subtracting the equations gives $(4x-4x)+(3y-y)=26-14$, which is $2y=12$.'
        exemplars:
          - problem: 'Solve the system $x+3y=19$, $x+y=9$ by elimination.'
            answer: '(4, 5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $x$ coefficients are equal, so subtract the second equation from the first: $2y=10$ and $y=5$. Then $x=9-5=4$. Check: $4+3(5)=19$ and $4+5=9$.'
          - problem: 'Solve the system $4x+y=15$, $x+y=6$ by elimination.'
            answer: '(3, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $y$ coefficients are equal, so subtract the second equation from the first: $3x=9$ and $x=3$. Then $y=6-3=3$. Check: $4(3)+3=15$.'
          - problem: 'Raj buys $1$ notebook and $4$ pens for $14$ dollars. Lea buys $1$ notebook and $2$ pens for $8$ dollars. How many dollars does one pen cost?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let a notebook cost $x$ and a pen $y$. Subtract Lea''s equation from Raj''s: $2y=6$, so $y=3$. A pen costs $3$ dollars and a notebook costs $8-6=2$ dollars.'
          - problem: 'Solve the system $2x-3y=17$, $2x+y=5$ by elimination.'
            answer: '(4, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $x$ coefficients are equal, so subtract the second equation from the first: $-4y=12$ and $y=-3$. Then $2x=5+3=8$, so $x=4$. Check: $2(4)-3(-3)=17$.'
          - problem: 'Three adult tickets and two child tickets cost $21$ dollars. Three adult tickets and one child ticket cost $18$ dollars. How many dollars does one adult ticket cost?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let an adult ticket cost $x$ and a child ticket $y$. Subtract the second equation from the first: $y=3$. Then $3x=18-3=15$, so an adult ticket costs $5$ dollars.'
          - problem: 'Solve the system $-x+2y=4$, $3x+2y=12$ by elimination.'
            answer: '(2, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $y$ coefficients are equal, so subtract the first equation from the second: $4x=8$ and $x=2$. Then $2y=4+2=6$, so $y=3$. Check: $3(2)+2(3)=12$.'
          - problem: 'Solve the system $5x+2y=11$, $5x-3y=-4$ by elimination.'
            answer: '(1, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $x$ coefficients are equal, so subtract the second equation from the first: $5y=15$ and $y=3$. Then $5x=11-6=5$, so $x=1$. Check: $5(1)-3(3)=-4$.'
        constraints: "matching coefficients; subtract carefully"
      - id: kp3
        name: "Back-substitute and verify"
        key_prerequisites: [multi-step-equations]
        step_check:
          step: 'Check in the first equation'
          question: 'Why is the check made in the first equation, when $y$ was found from the second?'
          options:
            - 'The first equation gives the value of $x$ that was just found'
            - 'A check is only needed in the equation with larger coefficients'
            - 'The solution must satisfy both equations; this one was unused'
            - 'Substituting a second time makes the first equation true by force'
          answer: 'The solution must satisfy both equations; this one was unused'
          why: 'A pair that fits only one equation is not a solution of the system. The first equation did not produce $y$, so it can reveal an error.'
        exemplars:
          - problem: 'Solve the system $2x+y=13$, $x-y=8$ by elimination and check the answer.'
            answer: '(7, -1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $y$ coefficients are opposites, so add the equations: $3x=21$ and $x=7$. Then $y=7-8=-1$. Check: $2(7)+(-1)=13$ and $7-(-1)=8$.'
          - problem: 'Solve the system $x+2y=-1$, $-x+3y=16$ by elimination and check the answer.'
            answer: '(-7, 3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $x$ coefficients are opposites, so add the equations: $5y=15$ and $y=3$. Then $x=-1-6=-7$. Check: $-7+2(3)=-1$ and $-(-7)+3(3)=16$.'
          - problem: 'The sum of two numbers is $6$ and their difference is $20$. What is the smaller number?'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let the numbers be $x$ and $y$, with $x+y=6$ and $x-y=20$. Adding the equations gives $2x=26$, so $x=13$. Then $y=6-13=-7$, the smaller number.'
          - problem: 'Solve the system $3x-2y=4$, $x+2y=-12$ by elimination and check the answer.'
            answer: '(-2, -5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The $y$ coefficients are opposites, so add the equations: $4x=-8$ and $x=-2$. Then $2y=-12+2=-10$, so $y=-5$. Check: $3(-2)-2(-5)=4$.'
          - problem: 'Dana solves $2x+y=8$ and $x-y=1$ and gets $(4, 0)$. Is Dana''s answer correct?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","not correct","incorrect","it is wrong","she is wrong","no it is not"],["yes","correct","it is correct","she is right","yes it is"]]}
            solution_sketch: 'Check the pair in both equations. In the first, $2(4)+0=8$ holds, but in the second $4-0=4$, not $1$. The pair fails one equation, so it is not the solution. The solution is $(3, 2)$.'
          - problem: 'The temperatures in two towns add up to $-3$ degrees Celsius and differ by $9$ degrees. What is the lower temperature?'
            answer: '-6'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'Let the warmer town be $x$ and the colder one $y$. Then $x+y=-3$ and $x-y=9$, so adding gives $2x=6$ and $x=3$. The lower temperature is $y=-3-3=-6$ degrees.'
          - problem: 'Sam solves $3x+y=11$ and $2x-y=4$. He adds the equations to get $5x=15$, so $x=3$, and then writes $y=11-3=8$. What is the correct value of $y$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value $x=3$ is right, but $y$ must come from $3x+y=11$, which gives $9+y=11$. So $y=2$. Check the second equation: $2(3)-2=4$.'
        constraints: "solutions may include negatives; verify in both equations"
    diagnostic_exemplar:
      problem: 'Solve by elimination: $3x + y = 5$ and $x + y = 7$.'
      answer: '(-1, 8)'
      solution_sketch: 'Subtract the equations: $2x = -2$, so $x = -1$ and $y = 8$.'
    anki_seeds:
      - front: "Eliminate a variable by adding when its coefficients are ___, or subtracting when they are ___."
        back: "opposites; equal"
        type: basic

  - id: systems-elimination
    name: "Systems by Elimination"
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: multi-step
    expected_time_secs: 130
    prerequisites:
      - id: elimination-with-addition
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.4
      - id: distributive-property
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: "Scale one equation first"
        key_prerequisites: [elimination-with-addition]
        step_check:
          step: 'Multiply the second equation by $-2$'
          question: 'Why multiply the second equation by $-2$ rather than by $2$?'
          options:
            - 'A negative multiplier always makes the numbers easier to add'
            - 'Multiplying by $2$ would change the solution of the system'
            - 'It turns $+2y$ into $-2y$, so adding cancels $y$'
            - 'It changes only the $y$ term, which is the one that must go'
          answer: 'It turns $+2y$ into $-2y$, so adding cancels $y$'
          why: 'The first equation has $2y$. The scaled second equation has $-2y$, so the sum has no $y$-term. Multiplying by $2$ would give $2y+2y=4y$.'
        try_first:
          problem: 'Multiply every term of $x+y=5$ by $2$. What is the right side of the new equation?'
          answer_contract: {"kind":"exact"}
          answer: '10'
          reveal: 'Both sides are multiplied: $2x+2y=10$. The new equation has the same solutions, so scaling is allowed, and it can make coefficients opposite.'
        exemplars:
          - problem: 'Solve the system $2x+3y=29$, $x+2y=18$ by elimination.'
            answer: '(4, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the second equation by $-2$ to get $-2x-4y=-36$. Adding it to the first gives $-y=-7$, so $y=7$. Then $x=18-14=4$. Check: $2(4)+3(7)=29$.'
          - problem: 'Solve the system $3x-2y=23$, $x+y=11$ by elimination.'
            answer: '(9, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the second equation by $2$ to get $2x+2y=22$. Adding it to the first gives $5x=45$, so $x=9$. Then $y=11-9=2$. Check: $3(9)-2(2)=23$.'
          - problem: 'A zoo sells adult tickets and child tickets. A family with $2$ adults and $3$ children pays $38$ dollars. A group with $1$ adult and $2$ children pays $22$ dollars. How many dollars does one adult ticket cost?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let an adult ticket cost $x$ and a child ticket $y$. Multiply the second equation by $-2$ and add it to the first: $-y=-6$, so $y=6$. Then $x=22-12=10$ dollars.'
          - problem: 'Solve the system $2x+y=9$, $3x-2y=31$ by elimination.'
            answer: '(7, -5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the first equation by $2$ to get $4x+2y=18$. Adding it to the second gives $7x=49$, so $x=7$. Then $y=9-14=-5$. Check: $3(7)-2(-5)=31$.'
          - problem: 'A farm has chickens and cows, $30$ animals in all. Together they have $80$ legs. How many cows are there?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $x$ be the chickens and $y$ the cows. Then $x+y=30$ and $2x+4y=80$. Multiply the first by $-2$ and add: $2y=20$, so there are $10$ cows and $20$ chickens.'
          - problem: 'Solve the system $4x+3y=-2$, $2x-y=-6$ by elimination.'
            answer: '(-2, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the second equation by $-2$ to get $-4x+2y=12$. Adding it to the first gives $5y=10$, so $y=2$. Then $2x=-6+2=-4$, so $x=-2$.'
          - problem: 'Solve the system $3x+y=7$, $5x-2y=8$ by elimination.'
            answer: '(2, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the first equation by $2$ to get $6x+2y=14$. Adding it to the second gives $11x=22$, so $x=2$. Then $y=7-6=1$. Check: $5(2)-2(1)=8$.'
        constraints: "scale to create opposite coefficients; integer solutions"
      - id: kp2
        name: "Scale both equations"
        key_prerequisites: [elimination-with-addition]
        step_check:
          step: 'Find a common multiple of the $y$-coefficients $3$ and $2$'
          question: 'Why scale the equations until both $y$ coefficients equal $6$?'
          options:
            - 'Both right sides then become equal, so they cancel as well'
            - 'Equal coefficients let one subtraction cancel $y$ completely'
            - 'The number $6$ is the product of the two equations'' constants'
            - 'It makes every coefficient in both equations a multiple of $6$'
          answer: 'Equal coefficients let one subtraction cancel $y$ completely'
          why: 'With $6y$ in both scaled equations, subtracting gives $6y-6y=0$, so only $x$ remains. Scaling does not change the solution of either equation.'
        exemplars:
          - problem: 'Solve the system $2x+3y=32$, $3x+2y=33$ by elimination.'
            answer: '(7, 6)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the first equation by $3$ and the second by $-2$, then add: $5y=30$, so $y=6$. Then $2x=32-18=14$, so $x=7$. Check: $3(7)+2(6)=33$.'
          - problem: 'Solve the system $3x-4y=2$, $2x+3y=7$ by elimination.'
            answer: '(2, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the first equation by $2$ and the second by $-3$, then add: $-17y=-17$, so $y=1$. Then $3x=2+4=6$, so $x=2$. Check: $2(2)+3(1)=7$.'
          - problem: 'Mia buys $2$ kg of apples and $3$ kg of pears for $13$ dollars. Noor buys $3$ kg of apples and $2$ kg of pears for $12$ dollars. How many dollars does $1$ kg of pears cost?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let apples cost $x$ and pears $y$ dollars per kg. Multiply the equations by $3$ and $-2$ and add: $5y=15$, so $y=3$. Then $2x=13-9=4$, so apples cost $2$ dollars.'
          - problem: 'Solve the system $4x+3y=-17$, $3x-2y=-17$ by elimination.'
            answer: '(-5, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the first equation by $2$ and the second by $3$, then add: $17x=-85$, so $x=-5$. Then $3y=-17+20=3$, so $y=1$. Check: $3(-5)-2(1)=-17$.'
          - problem: 'A school orders small and large boxes. Each small box holds $4$ pens and $3$ markers. Each large box holds $6$ pens and $5$ markers. The order has $44$ pens and $35$ markers in total. How many large boxes were ordered?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $x$ be the small boxes and $y$ the large boxes. Multiply the equations by $3$ and $-4$ and add: $-2y=-8$, so $y=4$. Then $4x=44-24=20$, so $x=5$.'
          - problem: 'Solve the system $3(x+y)+2y=47$, $2x-3y=6$ by elimination.'
            answer: '(9, 4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Expand the first equation to $3x+5y=47$. Multiply the equations by $3$ and $5$ and add: $19x=171$, so $x=9$. Then $3y=18-6=12$, so $y=4$.'
          - problem: 'Solve the system $5x+2y=-11$, $3x+5y=1$ by elimination.'
            answer: '(-3, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the first equation by $5$ and the second by $-2$, then add: $19x=-57$, so $x=-3$. Then $2y=-11+15=4$, so $y=2$. Check: $3(-3)+5(2)=1$.'
        constraints: "scale both to match one variable; integer solutions"
      - id: kp3
        name: "Use a negative multiplier"
        key_prerequisites: [integer-multiplication-division]
        step_check:
          step: 'Multiply the second equation by $-1$'
          question: 'Why does the right side $17$ also become $-17$?'
          options:
            - 'The right side always takes the sign of the $x$ coefficient'
            - 'The minus sign moves across the equals sign to the other side'
            - 'Subtracting an equation forces the constant to be negative'
            - 'Every term is multiplied, so both sides stay equal'
          answer: 'Every term is multiplied, so both sides stay equal'
          why: 'Multiplying only the left side would change the equation. With $-1$ on every term, $2x+3y=17$ becomes $-2x-3y=-17$.'
        exemplars:
          - problem: 'Solve the system $2x+5y=39$, $4x+3y=43$ by elimination.'
            answer: '(7, 5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the first equation by $-2$, including its right side, to get $-4x-10y=-78$. Adding gives $-7y=-35$, so $y=5$. Then $2x=39-25=14$, so $x=7$.'
          - problem: 'Solve the system $3x+2y=35$, $x+4y=35$ by elimination.'
            answer: '(7, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the second equation by $-3$, including its right side, to get $-3x-12y=-105$. Adding gives $-10y=-70$, so $y=7$. Then $x=35-28=7$.'
          - problem: 'Carlos buys $3$ cups of tea and $4$ cakes for $17$ dollars. Dee buys $1$ cup of tea and $2$ cakes for $7$ dollars. How many dollars does one cake cost?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Let tea cost $x$ and a cake $y$. Multiply Dee''s equation by $-3$ to get $-3x-6y=-21$. Adding to Carlos''s equation gives $-2y=-4$, so a cake costs $2$ dollars.'
          - problem: 'Solve the system $-2x+3y=29$, $-4x+y=23$ by elimination.'
            answer: '(-4, 7)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the first equation by $-2$ to get $4x-6y=-58$. Adding it to the second gives $-5y=-35$, so $y=7$. Then $-2x=29-21=8$, so $x=-4$.'
          - problem: 'Packs of screws come in two sizes. Three big packs and five small packs hold $49$ screws. Two big packs and three small packs hold $32$ screws. How many screws are in one big pack?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let a big pack hold $x$ screws and a small pack $y$. Multiply the equations by $2$ and $-3$ and add: $y=2$. Then $3x=49-10=39$, so a big pack holds $13$ screws.'
          - problem: 'Solve the system $5x-2y=-9$, $3x-4y=-11$ by elimination.'
            answer: '(-1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the first equation by $-2$ to get $-10x+4y=18$. Adding the second gives $-7x=7$, so $x=-1$. Then $-2y=-9+5=-4$, so $y=2$.'
          - problem: 'Solve the system $-3x+2y=-8$, $2x+y=3$ by elimination.'
            answer: '(2, -1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Multiply the second equation by $-2$ to get $-4x-2y=-6$. Adding it to the first gives $-7x=-14$, so $x=2$. Then $y=3-4=-1$. Check: $-3(2)+2(-1)=-8$.'
          - problem: 'Sam solves $3x+y=11$ and $x+2y=7$. He multiplies the first equation by $-2$ and writes $-6x-2y=11$. Adding the second equation gives $-5x=18$. What is the correct value of $x$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam forgot to multiply the right side. The scaled equation is $-6x-2y=-22$. Adding $x+2y=7$ gives $-5x=-15$, so $x=3$ and $y=2$.'
        constraints: "negative multipliers turn subtraction into addition"
    diagnostic_exemplar:
      problem: 'Solve the system by elimination: $3x + 2y = 12$ and $2x + 3y = 13$.'
      answer: '(2, 3)'
      solution_sketch: 'Scale both: $9x + 6y = 36$ and $4x + 6y = 26$; subtract: $5x = 10$.'
    anki_seeds:
      - front: "Elimination method for a system of equations:"
        back: "scale one or both equations so a variable's coefficients are opposites, add to eliminate it, solve, then back-substitute"
        type: basic

  - id: systems-special-cases
    name: "Systems with No or Infinitely Many Solutions"
    core: true
    difficulty: 0.54
    drill: false
    answer_kind: expression
    expected_time_secs: 100
    prerequisites:
      - id: systems-elimination
        weight: 0.6
        key: true
      - id: slope-intercept-form
        weight: 0.5
        key: true
      - id: slopes-of-parallel-perpendicular-lines
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Detect special cases algebraically"
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'This is a false statement'
          question: 'Why does the false statement $0=12$ mean the system has no solution?'
          options:
            - 'It means $x$ and $y$ must both be equal to $0$'
            - 'Any pair solving both equations would make $0=12$ true'
            - 'It shows an arithmetic slip, so the work must be redone'
            - 'The right sides differ, so the slopes must be different'
          answer: 'Any pair solving both equations would make $0=12$ true'
          why: 'Elimination only combines true statements about a solution. Since $0=12$ is never true, no pair can satisfy both equations.'
        try_first:
          problem: 'Can a pair $(x, y)$ satisfy both $x+y=3$ and $x+y=5$?'
          answer_contract: {"kind":"label","options":[["no","no it cannot","it cannot","cannot","impossible","never","not possible"],["yes","yes it can","it can","can","possible","it is possible"]]}
          answer: 'no'
          reveal: 'The same sum $x+y$ cannot equal $3$ and $5$. When elimination leaves a false statement such as $0=2$, the system has no solution.'
        exemplars:
          - problem: 'How many solutions does the system $3x+y=5$, $6x+2y=14$ have?'
            answer: 'no solutions'
            answer_contract: {"kind":"label","options":[["no solutions","none","no solution","there is no solution","zero","0","no points","the system has no solution"],["one solution","one","exactly one solution","a unique solution","1","one point","exactly one point","unique solution"],["infinitely many solutions","infinitely many","infinite","infinite solutions","infinitely many points","infinitely many solution","the system has infinitely many solutions","many"]]}
            solution_sketch: 'Multiply the first equation by $2$ to get $6x+2y=10$. Subtracting it from the second leaves $0=4$, which is false. No pair satisfies both equations, so there is no solution.'
          - problem: 'For what value of $a$ does the system $ax+y=5$, $6x+2y=14$ have no solution?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Doubling the first equation gives $2ax+2y=10$. The $x$ coefficients match when $2a=6$, so $a=3$. Then the left sides agree but the right sides $10$ and $14$ differ, so there is no solution.'
          - problem: 'On Monday, $2$ melons and $4$ pears cost $10$ dollars. On Tuesday, $3$ melons and $6$ pears cost $15$ dollars, at the same prices. How many pairs of prices for a melon and a pear fit both receipts?'
            answer: 'infinitely many'
            answer_contract: {"kind":"label","options":[["no solutions","none","no solution","there is no solution","zero","0","no points","the system has no solution"],["one solution","one","exactly one solution","a unique solution","1","one point","exactly one point","unique solution"],["infinitely many solutions","infinitely many","infinite","infinite solutions","infinitely many points","infinitely many solution","the system has infinitely many solutions","many"]]}
            solution_sketch: 'Multiply the Monday equation by $3$ and the Tuesday equation by $2$. Both become $6x+12y=30$, so subtracting gives $0=0$. The receipts say the same thing, so infinitely many price pairs fit.'
          - problem: 'For what value of $k$ does the system $2x-3y=7$, $-6x+9y=k$ have infinitely many solutions?'
            answer: '-21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the first equation by $-3$: $-6x+9y=-21$. The second equation is identical exactly when $k=-21$, and then elimination gives $0=0$.'
          - problem: 'Two receipts come from the same stall. Two melons and one pear cost $9$ dollars. Six melons and three pears cost $m$ dollars. For what $m$ do the two receipts fit infinitely many pairs of prices?'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the first receipt by $3$: six melons and three pears cost $27$ dollars. The receipts agree exactly when $m=27$, so the second adds no new information.'
          - problem: 'For what value of $b$ does the system $x+by=4$, $3x+6y=12$ have infinitely many solutions?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the first equation by $3$: $3x+3by=12$. The second equation is identical when $3b=6$, so $b=2$. Then elimination gives $0=0$.'
          - problem: 'For what value of $b$ does the system $2x+by=3$, $x+4y=7$ have no solution?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Double the second equation: $2x+8y=14$. The $x$ and $y$ coefficients match the first equation when $b=8$, but the right sides $3$ and $14$ differ, so there is no solution.'
        constraints: "elimination ends in a false statement (none) or 0 = 0 (infinite)"
      - id: kp2
        name: "Detect special cases from slopes and graphs"
        key_prerequisites: [slope-intercept-form]
        step_check:
          step: 'Both equations give $y=2x+1$, the same line'
          question: 'Why does a shared line mean infinitely many solutions?'
          options:
            - 'Each equation has two variables, so each has many solutions'
            - 'Equal slopes mean two lines cross again and again'
            - 'Every point of the line is on both graphs, so there are many'
            - 'The intercept is $1$, so the lines cross at every $y=1$ point'
          answer: 'Every point of the line is on both graphs, so there are many'
          why: 'A solution of a system is a point on both graphs. If the graphs are the same line, every point of it is a solution.'
        exemplars:
          - problem: 'How many points do the graphs of $y=2x+5$ and $y=2x-1$ have in common?'
            answer: 'no points'
            answer_contract: {"kind":"label","options":[["no points","none","no solutions","no solution","zero","0","no common point","there is no point"],["one point","one","exactly one point","1","one solution","exactly one solution","a unique point","unique solution"],["infinitely many points","infinitely many","infinite","infinite solutions","infinitely many solutions","every point of the line","many","infinitely many point"]]}
            solution_sketch: 'Both lines have slope $2$, but their $y$-intercepts are $5$ and $-1$. The lines are parallel and distinct, so they never meet and have no point in common.'
          - problem: 'Find the point where the graphs of $x=5$ and $y=3x-2$ cross.'
            answer: '(5, 13)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The line $x=5$ is vertical, and the other line has slope $3$, so they cross once. Put $x=5$ into $y=3x-2$ to get $y=13$. The crossing point is $(5,13)$.'
          - problem: 'Company A charges a call-out fee of $20$ dollars plus $3$ dollars per hour. Company B charges $5$ dollars per hour and no fee. After how many hours do the two companies charge the same amount?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'The charges are $y=20+3x$ and $y=5x$. The slopes differ, so the lines cross once. Setting $20+3x=5x$ gives $2x=20$, so $x=10$ hours.'
          - problem: 'How many points do the graphs of $y=-x+6$ and $2y=-2x+12$ have in common?'
            answer: 'infinitely many'
            answer_contract: {"kind":"label","options":[["no points","none","no solutions","no solution","zero","0","no common point","there is no point"],["one point","one","exactly one point","1","one solution","exactly one solution","a unique point","unique solution"],["infinitely many points","infinitely many","infinite","infinite solutions","infinitely many solutions","every point of the line","many","infinitely many point"]]}
            solution_sketch: 'Divide the second equation by $2$ to get $y=-x+6$. Both equations describe the same line, so every point of that line is shared and there are infinitely many.'
          - problem: 'Find the point where the graphs of $2x+y=9$ and $y=4$ cross.'
            answer: '(5/2, 4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The first line has slope $-2$ and the second is horizontal, so they cross once. Put $y=4$ into $2x+y=9$ to get $2x=5$, so $x=5/2$. The point is $(5/2, 4)$.'
          - problem: 'A drone is at a height of $10$ m and climbs $5$ m per minute. A second drone is at $34$ m and climbs $2$ m per minute. After how many minutes are the two drones at the same height?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"time","unit":"minute","allow_omitted":true}
            solution_sketch: 'The heights are $y=10+5t$ and $y=34+2t$. The slopes differ, so the lines cross once. Setting them equal gives $3t=24$, so $t=8$ minutes.'
          - problem: 'The line $y=mx+4$ and the line $y=-2x+9$ never meet. What is $m$?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Lines that never meet are parallel, so they have equal slopes: $m=-2$. The intercepts $4$ and $9$ differ, so the lines are distinct and do not coincide.'
        constraints: "parallel -> none; same line -> infinitely many; else one"
      - id: kp3
        name: "Classify one / none / infinitely many"
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'Subtract the second equation'
          question: 'Why does subtracting leave $0=5$ and not a value for $x$?'
          options:
            - 'The right sides $24$ and $19$ were subtracted in the wrong order'
            - 'Only $y$ cancels, and $x$ is then replaced by $0$'
            - 'Subtraction always ends in a false statement'
            - 'Both $x$ and $y$ cancel because the left sides are equal'
          answer: 'Both $x$ and $y$ cancel because the left sides are equal'
          why: 'After scaling, both equations have the left side $10x+2y$, so subtracting removes both variables and leaves only $24-19=5$ against $0$.'
        exemplars:
          - problem: 'How many solutions does the system $2x+y=3$, $x-y=6$ have?'
            answer: 'one solution'
            answer_contract: {"kind":"label","options":[["no solutions","none","no solution","there is no solution","zero","0","no points","the system has no solution"],["one solution","one","exactly one solution","a unique solution","1","one point","exactly one point","unique solution"],["infinitely many solutions","infinitely many","infinite","infinite solutions","infinitely many points","infinitely many solution","the system has infinitely many solutions","many"]]}
            solution_sketch: 'Adding the equations cancels $y$ and gives $3x=9$, so $x=3$. Then $x-y=6$ gives $y=3-6=-3$. One pair, $(3,-3)$, fits both equations.'
          - problem: 'Solve the system $x=2y-5$, $3x+y=13$.'
            answer: '(3, 4)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute $x=2y-5$ into the second equation: $3(2y-5)+y=13$ gives $7y=28$, so $y=4$. Then $x=2(4)-5=3$. Check: $3(3)+4=13$.'
          - problem: 'How many solutions does the system $y=4x-7$, $2y=8x-10$ have?'
            answer: 'no solutions'
            answer_contract: {"kind":"label","options":[["no solutions","none","no solution","there is no solution","zero","0","no points","the system has no solution"],["one solution","one","exactly one solution","a unique solution","1","one point","exactly one point","unique solution"],["infinitely many solutions","infinitely many","infinite","infinite solutions","infinitely many points","infinitely many solution","the system has infinitely many solutions","many"]]}
            solution_sketch: 'Halve the second equation to get $y=4x-5$. Both lines have slope $4$, but the intercepts $-7$ and $-5$ differ, so the lines are parallel and there is no solution.'
          - problem: 'For what value of $k$ does the system $kx+y=3$, $2x+y=7$ have no solution?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting the equations gives $(k-2)x=-4$. If $k=2$ the $x$-term vanishes and the equation reads $0=-4$, which is false, so there is no solution.'
          - problem: 'Printer A has already printed $34$ pages and prints $8$ pages per minute. Printer B has printed $6$ pages and prints $12$ pages per minute. After how many minutes have the two printers printed the same number of pages?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"time","unit":"minute","allow_omitted":true}
            solution_sketch: 'The page counts are $34+8t$ and $6+12t$. The rates differ, so the lines cross once. Setting them equal gives $28=4t$, so $t=7$ minutes.'
          - problem: 'For what value of $c$ does the system $\frac{x}{2}+\frac{y}{4}=1$, $2x+y=c$ have infinitely many solutions?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the first equation by $4$ to get $2x+y=4$. The second equation is the same line exactly when $c=4$, and then elimination gives $0=0$.'
          - problem: 'Lena has $50$ dollars saved and adds $7$ dollars per week. Max has $20$ dollars saved and adds $10$ dollars per week. After how many weeks do they have the same amount?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Their savings are $50+7w$ and $20+10w$. The rates differ, so the lines cross once. Setting them equal gives $30=3w$, so $w=10$ weeks.'
        constraints: "mix all three cases across generated problems"
    diagnostic_exemplar:
      problem: 'How many solutions does the system $4x - 2y = 6$, $2x - y = 3$ have?'
      answer_contract: {kind: label, options: [['no solutions', 'none'], ['one solution', 'one'], ['infinitely many', 'infinite']]}
      answer: 'infinitely many'
      solution_sketch: 'Doubling the second equation gives the first: the two equations describe the same line.'
    anki_seeds:
      - front: "Graphically, a system of two lines has no solution when ___ and infinitely many when ___."
        back: "the lines are parallel (equal slope, different intercept); the lines are identical"
        type: basic

  - id: systems-of-linear-inequalities
    name: "Systems of Linear Inequalities"
    core: false               # supplemental, like its graphing prerequisites
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: graphing-linear-inequalities
        weight: 0.7
        key: true
      - id: graphing-systems
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Check a point against both inequalities"
        key_prerequisites: [graphing-linear-inequalities]
        step_check:
          step: 'Both inequalities hold, so the point is a solution.'
          question: 'Why must both comparisons be true before the point counts as a solution?'
          options:
            - 'The two comparisons are added, so their total must be true'
            - 'The system asks for points that satisfy each inequality'
            - 'One true comparison is enough, since the other only restates it'
            - 'Only the strict inequality counts; the other one is optional'
          answer: 'The system asks for points that satisfy each inequality'
          why: 'A system is a list of conditions that must all hold at once, so a point that fails any one of them is not a solution.'
        try_first:
          problem: 'Is $(4, 2)$ a solution of the system $y > x - 3$ and $y > x + 1$?'
          answer_contract: {"kind": "label", "options": [["yes", "it is a solution", "it is", "solution"], ["no", "it is not a solution", "it is not", "not a solution"]]}
          answer: 'no'
          reveal: 'The point passes the first comparison ($2 > 1$) but fails the second ($2 > 5$ is false). A point solves a system only when it passes every comparison.'
        exemplars:
          - problem: 'Is $(1, 2)$ a solution of the system $y > x$ and $y \le -x + 4$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a solution", "it is", "solution"], ["no", "it is not a solution", "it is not", "not a solution"]]}
            solution_sketch: 'At $(1, 2)$ the first inequality reads $2 > 1$, which is true. The second reads $2 \le 3$, which is also true, so the point satisfies both.'
          - problem: 'What is the largest whole number $x$ for which $(x, 2)$ is a solution of the system $y > x - 3$ and $y \le 2x$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $y = 2$ the first inequality gives $2 > x - 3$, so $x < 5$. The second gives $2 \le 2x$, so $x \ge 1$. The largest whole number from $1$ up to below $5$ is $4$.'
          - problem: 'A van carries $x$ small boxes and $y$ large boxes. It may hold at most $12$ boxes, so $x + y \le 12$, and the load limit gives $3x + 5y \le 45$. With $5$ small boxes loaded, what is the largest number of large boxes the van can carry?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x = 5$ the box limit gives $y \le 7$. The load limit gives $15 + 5y \le 45$, so $y \le 6$. Both limits must hold, so the smaller bound wins and the answer is $6$.'
          - problem: 'Sam checks $(2, 3)$ against the system $2x + y < 7$ and $y \ge x - 2$. He sees that $3 \ge 0$ is true and says the point is a solution. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "Sam is right", "right"], ["no", "Sam is not right", "Sam is wrong", "wrong"]]}
            solution_sketch: 'Sam checked only the second inequality. In the first, $2(2) + 3 = 7$, and $7 < 7$ is false because the inequality is strict, so the point is not a solution.'
          - problem: 'What is the smallest whole number $y$ for which $(3, y)$ is a solution of the system $y > 2x + 1$ and $y < x + 10$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 3$ the first inequality gives $y > 7$ and the second gives $y < 13$. The smallest whole number above $7$ is $8$, and $8 < 13$ holds, so the answer is $8$.'
          - problem: 'A gardener plants $x$ tomato plants and $y$ pepper plants in a bed. The bed needs at least $12$ plants in all, $x + y \ge 12$, and no more than twice as many tomato plants as pepper plants, $x \le 2y$. If the gardener plants $5$ pepper plants, what is the fewest tomato plants the gardener can plant?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $y = 5$ the first condition gives $x \ge 7$. The second gives $x \le 10$. The fewest tomato plants that satisfy both is $7$.'
          - problem: 'A shopper buys $x$ notebooks at €3 each and $y$ pens at €2 each and has €17 to spend, so $3x + 2y \le 17$. The basket holds at most $8$ items, so $x + y \le 8$. If the shopper buys $4$ notebooks, what is the largest number of pens the shopper can buy?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x = 4$ the money limit gives $12 + 2y \le 17$, so $y \le 2.5$. The basket limit gives $y \le 4$. Pens come in whole numbers, so the answer is $2$.'
        constraints: 'the point must satisfy BOTH inequalities; whole-number coordinates; contexts with two limits'
      - id: kp2
        name: "Boundary styles and the overlap region"
        key_prerequisites: [graphing-linear-inequalities]
        step_check:
          step: 'Draw $y=-2x+6$ as a dashed line because the second comparison is strict.'
          question: 'Why is the line $y=-2x+6$ dashed?'
          options:
            - 'A strict comparison leaves out the points on its own line'
            - 'The line has a negative slope, so it cannot be solid'
            - 'It is the second inequality, and only the first can be solid'
            - 'A dashed line shows the side that is shaded first'
          answer: 'A strict comparison leaves out the points on its own line'
          why: 'A solid line says the boundary points are included, and a dashed line says they are left out; only the comparison sign decides, not the slope or the order.'
        exemplars:
          - problem: 'The point $(1, 5)$ lies on the line $y = 2x + 3$. Is it a solution of the system $y \le 2x + 3$ and $y > -x + 1$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is a solution", "it is", "solution"], ["no", "it is not a solution", "it is not", "not a solution"]]}
            solution_sketch: 'The first inequality allows points on its line, so $5 \le 5$ is true. The second reads $5 > 0$, which is also true, so the point is a solution.'
          - problem: 'The point $(0, 1)$ lies on the line $y = -x + 1$. Is it a solution of the system $y \le 2x + 3$ and $y > -x + 1$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is a solution", "it is", "solution"], ["no", "it is not a solution", "it is not", "not a solution"]]}
            solution_sketch: 'The first inequality reads $1 \le 3$, which is true. The second reads $1 > 1$, which is false because that inequality is strict and excludes its own line, so the point is not a solution.'
          - problem: 'For the system $y \le 2x + 3$ and $y > -x + 1$, which boundary line is drawn dashed?'
            answer: 'y = -x + 1'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A strict inequality leaves out the points of its own boundary, so its line is dashed. Here $y > -x + 1$ is strict, so $y = -x + 1$ is dashed, and the line $y = 2x + 3$ of the inclusive inequality is solid.'
          - problem: 'At which point do the boundary lines of the system $y \ge x - 3$ and $y < -2x + 6$ meet?'
            answer: '(3, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The boundary lines are $y = x - 3$ and $y = -2x + 6$. Setting $x - 3 = -2x + 6$ gives $3x = 9$, so $x = 3$ and $y = 0$.'
          - problem: 'For the system $y \ge x - 3$ and $y < -2x + 6$, what is the largest whole number $y$ for which $(1, y)$ is a solution?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 1$ the system says $y \ge -2$ and $y < 4$. The value $4$ is excluded because the second inequality is strict, so the largest whole number is $3$.'
          - problem: 'Write the equation of the boundary line that is drawn solid for the system $y \ge x - 3$ and $y < -2x + 6$.'
            answer: 'y = x - 3'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The first inequality includes equality, so its boundary line is solid. The second is strict, so its line is dashed. The solid line is therefore $y = x - 3$.'
          - problem: 'A bakery makes $x$ loaves and $y$ rolls. It makes at least twice as many rolls as loaves, $y \ge 2x$, and fewer than $30$ items in all, $x + y < 30$. If the bakery bakes $8$ loaves, what is the largest number of rolls it can bake?'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x = 8$ the first condition gives $y \ge 16$. The second gives $y < 22$, and $22$ is excluded, so the largest number of rolls is $21$.'
          - problem: 'A customer buys $x$ shirts at €12 each and $y$ hats at €6 each and spends less than €50, so $12x + 6y < 50$. The customer buys at least $3$ items, so $x + y \ge 3$. With $2$ shirts, what is the largest number of hats the customer can buy?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x = 2$ the spending condition gives $24 + 6y < 50$, so $y < 4.33$. The item condition gives $y \ge 1$. The largest whole number of hats is $4$.'
          - problem: 'For the system $y \ge x - 3$ and $y < -2x + 6$, what is the smallest integer $y$ for which $(0, y)$ is a solution?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x = 0$ the system says $y \ge -3$ and $y < 6$. The value $-3$ is allowed because the first inequality is inclusive, so the smallest whole number is $-3$.'
        constraints: 'one strict and one inclusive inequality per problem; boundary points, corner points and contexts with strict and inclusive limits'
      - id: kp3
        name: "Locate a point in the solution region"
        key_prerequisites: [graphing-linear-inequalities]
        step_check:
          step: 'Test $(3, -4)$ in the first inequality: $-4 > 7$ is false, so this point fails.'
          question: 'Why can we reject $(3,-4)$ without testing the second inequality?'
          options:
            - 'The second inequality always gives the same result as the first'
            - 'A negative $y$-value is always outside the region'
            - 'The first inequality is the more important of the two'
            - 'A point must satisfy both, so one false inequality is enough'
          answer: 'A point must satisfy both, so one false inequality is enough'
          why: 'A solution of a system must pass every inequality, so a single failed comparison already rules the point out.'
        exemplars:
          - problem: 'Which of the points $(1, 3)$ and $(2, 1)$ is a solution of the system $y > x + 1$ and $y < x + 5$?'
            answer: '(1, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $(1, 3)$ we get $3 > 2$ and $3 < 6$, both true. At $(2, 1)$ the first inequality reads $1 > 3$, which is false, so only $(1, 3)$ is a solution.'
          - problem: 'Which of the points $(0, 7)$, $(2, 3)$ and $(5, 0)$ is a solution of the system $x + y < 6$ and $y \ge x$?'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $(0, 7)$ the sum is $7$, which is not below $6$. At $(5, 0)$ we have $0 \ge 5$, which is false. At $(2, 3)$ the sum $5$ is below $6$ and $3 \ge 2$, so $(2, 3)$ works.'
          - problem: 'A school trip has $x$ teachers and $y$ students. The rules are $y \le 8x$ (at most $8$ students for each teacher) and $x + y \le 40$ (at most $40$ people in all). Which of the plans $(3, 28)$, $(4, 30)$ and $(5, 38)$ follows both rules?'
            answer: '(4, 30)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Plan $(3, 28)$ needs $28 \le 24$, which fails. Plan $(5, 38)$ has $43$ people, which is over $40$. Plan $(4, 30)$ has $30 \le 32$ and $34 \le 40$, so it follows both rules.'
          - problem: 'Which of the points $(3, 6)$ and $(2, 4)$ is a solution of the system $y > 2x - 1$ and $y < -x + 8$?'
            answer: '(2, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $(3, 6)$ the first inequality holds ($6 > 5$) but the second reads $6 < 5$, which is false. At $(2, 4)$ we get $4 > 3$ and $4 < 6$, so $(2, 4)$ is the solution.'
          - problem: 'For which whole number $x$ is $(x, 5)$ a solution of the system $y > 2x + 1$ and $y \le x + 4$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $y = 5$ the first inequality gives $5 > 2x + 1$, so $x < 2$. The second gives $5 \le x + 4$, so $x \ge 1$. The only whole number that meets both is $1$.'
          - problem: 'Sam tests the point $(4, 1)$ against the system $y > x - 2$ and $y < -x + 6$. He checks only the second inequality, finds that $1 < 2$ is true, and says the point is a solution. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "Sam is right", "right"], ["no", "Sam is not right", "Sam is wrong", "wrong"]]}
            solution_sketch: 'The second inequality does hold. The first reads $1 > 2$, which is false, so the point fails it and is not a solution of the system.'
          - problem: 'A café sells $x$ sandwiches and $y$ salads in a lunch hour. The manager wants at least $20$ items sold, $x + y \ge 20$, and at most $4$ more salads than sandwiches, $y \le x + 4$. Which of the results $(7, 10)$, $(10, 12)$ and $(14, 3)$ meets both targets?'
            answer: '(10, 12)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Result $(7, 10)$ has only $17$ items, and $(14, 3)$ also has only $17$. Result $(10, 12)$ has $22$ items and $12 \le 14$, so it meets both targets.'
        constraints: 'candidate points off the boundary lines; two or three candidates; contexts with a rule for each limit'
    diagnostic_exemplar:
      problem: 'Is $(2, 3)$ a solution of the system $y > x$ and $y \le 2x$?'
      answer_contract: {kind: label, options: [[yes], [no]]}
      answer: "yes"
      solution_sketch: '$3 > 2$ and $3 \le 4$ both hold.'
    anki_seeds:
      - front: "The solution of a system of linear inequalities is the ___ of the individual shaded regions."
        back: "intersection (overlap)"
        type: basic

  - id: systems-money-problems
    name: "Money and Ticket Systems"
    # over-coverage: coin/ticket context schema for systems-substitution +
    # systems-elimination; the technique, not the context, is the prerequisite
    core: false
    difficulty: 0.54
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: systems-substitution
        weight: 0.5
        key: true
      - id: systems-elimination
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Count equation plus value equation"
        key_prerequisites: [systems-substitution]
        step_check:
          step: 'Write the value equation: $3p+2e=63$.'
          question: 'Why is the value equation $3p+2e=63$ and not $p+e=63$?'
          options:
            - 'The total of €63 counts items, so each item adds $1$'
            - 'Each item adds its own price, so the counts need price weights'
            - 'Pens and erasers cost the same, so the weights cancel'
            - 'The number $63$ must be shared equally between pens and erasers'
          answer: 'Each item adds its own price, so the counts need price weights'
          why: 'The count equation adds items, and the value equation adds money, so each count is multiplied by the price of one item.'
        try_first:
          problem: 'A bag holds $10$ coins. Each coin is worth €1 or €2, and the bag holds €16 in all. How many €2 coins are in the bag?'
          answer_contract: {"kind": "exact"}
          answer: '6'
          reveal: 'Ten coins would be worth only €10 if all were €1 coins. Each €2 coin adds €1 more, so €6 extra means six €2 coins; two equations say the same.'
        exemplars:
          - problem: 'A theatre sold $17$ tickets for a matinee. Adult tickets cost €9 and child tickets cost €4, and the takings were €108. How many adult tickets were sold?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $a$ be the adult tickets and $c$ the child tickets. Then $a + c = 17$ and $9a + 4c = 108$. Replacing $c$ by $17 - a$ gives $5a + 68 = 108$, so $a = 8$.'
          - problem: 'A jar holds $13$ coins. Each is a five-cent coin or a twenty-cent coin, and together they are worth $155$ cents. How many twenty-cent coins are in the jar?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $f$ be the five-cent coins and $t$ the twenty-cent coins. Then $f + t = 13$ and $5f + 20t = 155$. Replacing $f$ by $13 - t$ gives $65 + 15t = 155$, so $t = 6$.'
          - problem: 'A museum sold $a$ adult tickets at €14 each and $c$ child tickets at €6 each, and the takings were €410. Write an equation for the takings.'
            answer: '14a + 6c = 410'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Each adult ticket brings €14, so the adult tickets bring $14a$ euros. The child tickets bring $6c$ euros, and the two amounts add up to the takings, so $14a + 6c = 410$.'
          - problem: 'A canteen sold $19$ meal vouchers. Large vouchers are worth €12 and small vouchers €7, and the total value was €173. How much money did the small vouchers bring in?'
            answer: '77'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The counts satisfy $l + s = 19$ and $12l + 7s = 173$, which gives $l = 8$ and $s = 11$. The small vouchers bring in $11 \times 7 = 77$ euros.'
          - problem: 'A kiosk sold $11$ tokens, standard ones at €6 and premium ones at €15, for €138 in all. How many more premium tokens than standard tokens were sold?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counts satisfy $s + p = 11$ and $6s + 15p = 138$, which gives $s = 3$ and $p = 8$. There were $8 - 3 = 5$ more premium tokens.'
          - problem: 'A cinema sold $24$ tickets, adult tickets at €11 and child tickets at €5, for €174. Sam reasons: "If all $24$ were adult tickets, the takings would be €264. That is €90 too much, and a child ticket costs €5 less than an adult ticket, so there were $90 \div 5 = 18$ child tickets." What is the correct number of child tickets?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A child ticket costs €6 less than an adult ticket, not €5, because $11 - 5 = 6$. So the number of child tickets is $90 \div 6 = 15$, and the $9$ adult tickets give $99 + 75 = 174$.'
          - problem: 'A parking meter holds only €1 coins and €2 coins. It holds $x$ one-euro coins and $y$ two-euro coins, $40$ coins in all, worth €58. Write an equation for the value of the coins.'
            answer: 'x + 2y = 58'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The one-euro coins are worth $x$ euros and the two-euro coins are worth $2y$ euros. Together they are worth €58, so $x + 2y = 58$.'
          - problem: 'Dina spends exactly €93 on $30$ items. Each item costs either €2 or €5. How many items cost €5?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $t$ be the €2 items and $f$ the €5 items. Then $t + f = 30$ and $2t + 5f = 93$. Replacing $t$ by $30 - f$ gives $60 + 3f = 93$, so $f = 11$.'
          - problem: 'A cash box holds $21$ banknotes, all of them €5 or €10 notes, worth €170 in total. How many €10 notes are there?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $f$ be the €5 notes and $t$ the €10 notes. Then $f + t = 21$ and $5f + 10t = 170$. Replacing $f$ by $21 - t$ gives $105 + 5t = 170$, so $t = 13$.'
        constraints: 'one count equation and one value equation; ask for one count, one amount of money or a difference; include a spend-it-all item and a reasoning-repair item'
      - id: kp2
        name: "Two-item purchase problems"
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'Multiply the second equation by $2$: $4p+6m=56$'
          question: 'Why multiply the second equation by $2$ before subtracting?'
          options:
            - 'It makes the $m$-terms equal, so subtracting removes $m$'
            - 'It doubles the total cost, which the problem requires'
            - 'It matches the $p$-terms, so subtracting removes them'
            - 'It clears the fractions in the second equation'
          answer: 'It matches the $p$-terms, so subtracting removes them'
          why: 'Both equations now contain $4p$, so subtracting one from the other leaves an equation in $m$ alone.'
        exemplars:
          - problem: 'Three pens and two notebooks cost €29. One pen and two notebooks cost €15. What does one pen cost?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Subtracting the second purchase from the first removes the notebooks: two pens cost $29 - 15 = 14$ euros. So one pen costs $14 \div 2 = 7$ euros.'
          - problem: 'Two sandwiches and one drink cost €17. One sandwich and three drinks cost €26. What does one sandwich cost?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Let $s$ be the price of a sandwich and $d$ the price of a drink. Then $2s + d = 17$ and $s + 3d = 26$. Doubling the second equation and subtracting the first gives $5d = 35$, so $d = 7$ and $s = 5$.'
          - problem: 'One apple and four pears cost €23. Three apples and two pears cost €29. How much do five apples cost?'
            answer: '35'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Tripling the first purchase gives $3a + 12p = 69$, and subtracting the second purchase leaves $10p = 40$, so $p = 4$ and $a = 7$. Five apples cost $5 \times 7 = 35$ euros.'
          - problem: 'Four coffees and three buns cost €47. Two coffees and one bun cost €21. What does one coffee cost?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Tripling the second purchase gives six coffees and three buns for €63. Subtracting the first purchase leaves two coffees for $63 - 47 = 16$ euros. So one coffee costs $16 \div 2 = 8$ euros.'
          - problem: 'At a bakery a loaf costs $l$ euros and a roll costs $r$ euros. Five loaves and four rolls cost €31. Write an equation for this purchase.'
            answer: '5l + 4r = 31'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Five loaves cost $5l$ euros and four rolls cost $4r$ euros. The two amounts add up to the total cost, so $5l + 4r = 31$.'
          - problem: 'Sam buys two books and one pen for €19, and three books and one pen for €27. He subtracts the first purchase from the second and says that a pen costs €8. What does one pen cost?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The subtraction leaves one book, so one book costs $27 - 19 = 8$ euros, not a pen. Then two books cost $16$ euros, so the pen costs $19 - 16 = 3$ euros.'
          - problem: 'Maya pays €36 for three notebooks and four pens, and €32 for five notebooks and two pens. How many pens can she buy with €54?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Doubling the second purchase gives ten notebooks and four pens for €64. Subtracting the first purchase leaves seven notebooks for €28, so a notebook costs €4 and a pen costs €6. Then $54 \div 6 = 9$ pens.'
          - problem: 'Five notebooks and three pens cost €37. Two notebooks and three pens cost €22. What do ten notebooks cost?'
            answer: '50'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Subtracting the second purchase from the first removes the pens: three notebooks cost $37 - 22 = 15$ euros. So one notebook costs €5 and ten notebooks cost $10 \times 5 = 50$ euros.'
        constraints: 'two purchases of the same two items; elimination-friendly numbers; ask for one price, a multiple or a how-many-can-be-bought'
      - id: kp3
        name: "Solve and verify in context"
        key_prerequisites: [systems-substitution]
        step_check:
          step: 'Both counts are nonnegative integers.'
          question: 'Why do we check that both counts are nonnegative integers?'
          options:
            - 'Tickets come in whole numbers and cannot be negative'
            - 'The value equation only works for whole-number solutions'
            - 'A negative count would make the total revenue too small'
            - 'Counts must be even so the two ticket types balance'
          answer: 'Tickets come in whole numbers and cannot be negative'
          why: 'The algebra can return a fraction or a negative number, but tickets are counted in whole numbers, so such a solution would not fit the situation.'
        exemplars:
          - problem: 'A fair sold $28$ tickets. Standard tickets cost €5 and premium tickets €12, and the takings were €245. How many premium tickets were sold?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $s$ be the standard tickets and $p$ the premium tickets. Then $s + p = 28$ and $5s + 12p = 245$. Replacing $s$ by $28 - p$ gives $140 + 7p = 245$, so $p = 15$ and $s = 13$.'
          - problem: 'A drawer holds $18$ coins, each worth $25$ cents or $10$ cents, with a total value of $285$ cents. How many $25$-cent coins are there?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $q$ be the $25$-cent coins and $d$ the $10$-cent coins. Then $q + d = 18$ and $25q + 10d = 285$. Replacing $d$ by $18 - q$ gives $180 + 15q = 285$, so $q = 7$.'
          - problem: 'A shop has a pile of $16$ coupons, each worth €8 or €3, and the pile is worth €48 in all. How many €8 coupons are in the pile?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $e$ be the €8 coupons and $t$ the €3 coupons. Then $e + t = 16$ and $8e + 3t = 48$. Replacing $t$ by $16 - e$ gives $5e + 48 = 48$, so $e = 0$, and all $16$ coupons are worth €3.'
          - problem: 'A machine dispensed $23$ tokens, basic ones worth €4 and deluxe ones worth €9, with a total value of €147. How much money did the basic tokens bring in?'
            answer: '48'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The counts satisfy $b + d = 23$ and $4b + 9d = 147$, which gives $b = 12$ and $d = 11$. The basic tokens bring in $12 \times 4 = 48$ euros.'
          - problem: 'A clerk says that $20$ notes, each worth €7 or €4, add up to €127. Is that possible?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is possible", "possible"], ["no", "it is not possible", "not possible", "impossible"]]}
            solution_sketch: 'If $s$ notes are worth €7 and $f$ notes are worth €4, then $s + f = 20$ and $7s + 4f = 127$. Replacing $f$ by $20 - s$ gives $3s = 47$, which is not a whole number, so the claim is not possible.'
          - problem: 'A box holds $40$ coins, each worth $10$ cents or $50$ cents, and the coins are worth €10.40 in all. How many $10$-cent coins are in the box?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $1040$ cents. With $t$ coins of $10$ cents and $f$ coins of $50$ cents, $t + f = 40$ and $10t + 50f = 1040$. Replacing $t$ by $40 - f$ gives $400 + 40f = 1040$, so $f = 16$ and $t = 24$.'
          - problem: 'A stall sells $14$ items at €3 or €8 each and takes €72. How many €8 items does it sell?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Let $t$ be the €3 items and $e$ the €8 items. Then $t + e = 14$ and $3t + 8e = 72$. Replacing $t$ by $14 - e$ gives $42 + 5e = 72$, so $e = 6$.'
        constraints: 'check that counts are nonnegative whole numbers and that the totals match; ask for a count, an amount of money or whether a total is possible; mix cents and euros in one item'
    diagnostic_exemplar:
      problem: '$2$ coffees and $3$ buns cost €12; $1$ coffee and $2$ buns cost €7. What is the price of one coffee in euros?'
      answer: '3'
      answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
      solution_sketch: '$2c + 3b = 12$ and $c + 2b = 7$; eliminating $c$ gives $b = 2$, so $c = 3$.'
    anki_seeds:
      - front: "Money/ticket system setup: one equation counts the ___, the other totals the ___."
        back: "items; value (money)"
        type: basic

  - id: systems-mixture-problems
    name: "Mixture Systems"
    # over-coverage: acid/coffee-blend context schema — the percent-weighted
    # presentation of systems-money-problems, no new technique
    core: false
    difficulty: 0.56
    drill: false
    answer_kind: multi-step
    expected_time_secs: 170
    prerequisites:
      - id: systems-money-problems
        weight: 0.7
        key: true
      - id: percentages
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Set up the amount and value equations"
        key_prerequisites: [percentages]
        step_check:
          step: 'The pure-dye contributions are $0.10x$ and $0.90y$ litres.'
          question: 'Why is the pure-dye amount of the first solution $0.10x$ litres?'
          options:
            - 'The dye is $10\%$ of the total $50$ L, so it is fixed'
            - 'The $10\%$ is added to $x$ to give the dye amount'
            - 'Only $10\%$ of the $x$ litres is pure dye'
            - 'The first solution contains $10$ litres of pure dye'
          answer: 'Only $10\%$ of the $x$ litres is pure dye'
          why: 'A percent of a quantity is that fraction times the quantity, so $10\%$ of $x$ litres is $0.10x$ litres of dye.'
        try_first:
          problem: 'How many litres of pure alcohol are in $5$ litres of a $40\%$ alcohol solution?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The solution is $40\%$ alcohol, so the alcohol is $0.40 \times 5 = 2$ litres. Mixture problems use this idea for each ingredient.'
        exemplars:
          - problem: 'How many litres of pure acid are in $x$ litres of a $10\%$ acid solution?'
            answer: '0.1x'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Ten percent means $0.10$ of the amount. So $x$ litres of the solution hold $0.1x$ litres of pure acid.'
          - problem: 'A chemist mixes $x$ litres of $10\%$ acid with $y$ litres of $50\%$ acid to make $16$ litres of mixture. Write an equation for the total volume.'
            answer: 'x + y = 16'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The two amounts must add up to the whole mixture, so $x + y = 16$. The equation $y = 16 - x$ says the same thing.'
          - problem: 'A chemist mixes $x$ litres of $10\%$ acid with $y$ litres of $50\%$ acid to make $16$ litres of $25\%$ acid. Write an equation for the litres of pure acid.'
            answer: '0.1x + 0.5y = 4'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The first ingredient holds $0.1x$ litres of pure acid and the second holds $0.5y$ litres. The $16$ litres of $25\%$ acid hold $0.25 \times 16 = 4$ litres, so $0.1x + 0.5y = 4$.'
          - problem: 'A chemist mixes $10\%$ acid and $50\%$ acid to make $20$ litres of $35\%$ acid. How many litres of pure acid does the $20$ litres contain?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The mixture is $35\%$ pure acid. So the $20$ litres contain $0.35 \times 20 = 7$ litres of pure acid.'
          - problem: 'A lab dilutes pure acid with water to make $9$ litres of $40\%$ acid. How many litres of pure acid does the mixture contain?'
            answer: '3.6'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The mixture is $40\%$ pure acid. So the $9$ litres contain $0.40 \times 9 = 3.6$ litres of pure acid.'
          - problem: 'Sam mixes $x$ litres of $30\%$ solution with $y$ litres of $80\%$ solution to make $20$ litres of $55\%$ solution. He writes $0.30x + 0.80y = 55$. What number should be on the right side?'
            answer: '11'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The left side counts litres of pure substance, so the right side must too. The $20$ litres at $55\%$ hold $0.55 \times 20 = 11$ litres, not $55$.'
          - problem: 'A lab mixes $x$ litres of $40\%$ salt solution with $y$ litres of water to make $12$ litres of $15\%$ salt solution. Write an equation for the litres of salt.'
            answer: '0.4x = 1.8'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Water holds no salt, so only the first solution adds salt, $0.4x$ litres. The $12$ litres of $15\%$ solution hold $0.15 \times 12 = 1.8$ litres of salt, so $0.4x = 1.8$.'
          - problem: 'A $12$-litre mixture contains $3$ litres of pure acid. What percent of the mixture is pure acid?'
            answer: '25%'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pure acid is $3$ litres out of $12$ litres, which is $3 \div 12 = 0.25$. So the mixture is $25\%$ pure acid.'
        constraints: 'amount equation plus pure-substance equation; ask for a pure amount, an expression, one variable in terms of the other, or a strength'
      - id: kp2
        name: "Percent-solution mixtures"
        key_prerequisites: [systems-money-problems]
        step_check:
          step: 'Substitute $x=45-y$: $0.05(45-y)+0.80y=13.5$.'
          question: 'Why does $45-y$ replace $x$ in the dye equation?'
          options:
            - 'The dye equation only contains $y$, so $x$ must vanish'
            - 'Subtracting $y$ from $45$ gives the dye amount'
            - 'Both ingredients must have the same volume, $45-y$'
            - 'The volumes add to $45$ L, so $x$ is $45$ minus $y$'
          answer: 'The volumes add to $45$ L, so $x$ is $45$ minus $y$'
          why: 'The amount equation $x+y=45$ says $x=45-y$, so the substitution leaves one unknown in the dye equation.'
        exemplars:
          - problem: 'How many litres of $10\%$ acid are needed to make $18$ litres of $20\%$ acid by mixing it with $40\%$ acid?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'Let $x$ and $y$ be the litres of $10\%$ and $40\%$ acid. Then $x + y = 18$ and $0.1x + 0.4y = 3.6$. Replacing $x$ by $18 - y$ gives $1.8 + 0.3y = 3.6$, so $y = 6$ and $x = 12$.'
          - problem: 'A lab dilutes pure acid with water to make $7$ litres of $30\%$ acid. How much pure acid does it use?'
            answer: '2.1'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'Water holds no acid, so all the acid comes from the pure acid. The mixture holds $0.30 \times 7 = 2.1$ litres of acid, so the lab uses $2.1$ litres of pure acid.'
          - problem: 'A $20\%$ alcohol solution and an $80\%$ alcohol solution are mixed to make $15$ litres of $40\%$ solution. How many litres of the $80\%$ solution are used?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'Let $x$ and $y$ be the litres of the $20\%$ and $80\%$ solutions. Then $x + y = 15$ and $0.2x + 0.8y = 6$. Replacing $x$ by $15 - y$ gives $3 + 0.6y = 6$, so $y = 5$.'
          - problem: 'A $25\%$ solution and a $75\%$ solution are mixed to make $24$ litres containing $15$ litres of pure substance. How many litres of the $25\%$ solution are used?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'Let $x$ and $y$ be the litres of the $25\%$ and $75\%$ solutions. Then $x + y = 24$ and $0.25x + 0.75y = 15$. Replacing $x$ by $24 - y$ gives $6 + 0.5y = 15$, so $y = 18$ and $x = 6$.'
          - problem: 'Sam mixes a $20\%$ dye solution with a $60\%$ dye solution to make $30$ litres of $50\%$ solution. He argues that $50\%$ lies between the two strengths, so $15$ litres of each is right. How many litres of the $60\%$ solution are really needed?'
            answer: '22.5'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'Fifteen litres of each would give $0.2(15) + 0.6(15) = 12$ litres of dye, but $0.5 \times 30 = 15$ litres are needed. Solving $x + y = 30$ and $0.2x + 0.6y = 15$ gives $y = 22.5$ litres of the $60\%$ solution.'
          - problem: 'A $40\%$ juice concentrate is diluted with water to make $24$ litres of $15\%$ juice. How many litres of concentrate are used?'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The final drink holds $0.15 \times 24 = 3.6$ litres of pure juice, and all of it comes from the concentrate. So the concentrate used is $3.6 \div 0.4 = 9$ litres.'
          - problem: 'Can a $50\%$ acid solution be made by mixing a $10\%$ solution with a $40\%$ solution?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "can"], ["no", "it cannot", "cannot", "can't", "it can't", "impossible", "not possible"]]}
            solution_sketch: 'A mixture is never stronger than its strongest ingredient. Here both ingredients are weaker than $50\%$, so the mixture is at most $40\%$ and the answer is no.'
        constraints: 'target strength strictly between the two ingredient strengths; ask for one amount; include dilution with water and one impossible target'
      - id: kp3
        name: "Price-blend mixtures"
        key_prerequisites: [systems-money-problems]
        step_check:
          step: 'Write the value equation: $4x+20y=10(16)=160$.'
          question: 'Why is the right side of the value equation $10(16)$?'
          options:
            - 'The two prices €4 and €20 average to €10 per kg'
            - 'The blend costs €10 per kg and has $16$ kg'
            - 'There are $10$ kg of each ingredient in the $16$ kg'
            - 'The mass equation gives $10$ for the right side'
          answer: 'The blend costs €10 per kg and has $16$ kg'
          why: 'Total value is price per kilogram times kilograms, so $16$ kg at €10 per kg is worth €160, which the two ingredients must add up to.'
        exemplars:
          - problem: 'Tea at €6 per kilogram and tea at €14 per kilogram are blended to make $12$ kilograms worth €9 per kilogram. How many kilograms of the €14 tea are used?'
            answer: '4.5'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'Let $x$ and $y$ be the kilograms of the €6 and €14 tea. Then $x + y = 12$ and $6x + 14y = 108$. Replacing $x$ by $12 - y$ gives $72 + 8y = 108$, so $y = 4.5$.'
          - problem: 'Nuts at €8 per kilogram and nuts at €20 per kilogram are mixed to make $10$ kilograms worth €128 in all. How many kilograms of the €8 nuts are used?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'Let $x$ and $y$ be the kilograms of the €8 and €20 nuts. Then $x + y = 10$ and $8x + 20y = 128$. Replacing $x$ by $10 - y$ gives $80 + 12y = 128$, so $y = 4$ and $x = 6$.'
          - problem: 'Coffee at $1600$ cents per kilogram and coffee at $1000$ cents per kilogram are mixed to make $9$ kilograms worth €12 per kilogram. How many kilograms of the dearer coffee are used?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'In euros the prices are €16 and €10 per kilogram. Then $x + y = 9$ and $16x + 10y = 108$. Replacing $y$ by $9 - x$ gives $90 + 6x = 108$, so $x = 3$ kilograms of the dearer coffee.'
          - problem: 'Grain at €4 per kilogram and grain at €10 per kilogram are blended to make $15000$ grams worth €6 per kilogram. How many kilograms of the €10 grain are used?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The blend is $15$ kilograms. Then $x + y = 15$ and $4x + 10y = 90$. Replacing $x$ by $15 - y$ gives $60 + 6y = 90$, so $y = 5$ kilograms of the €10 grain.'
          - problem: 'Coffee at €9 per kilogram and coffee at €13 per kilogram are blended to make $20$ kilograms worth €10 per kilogram. With $x$ kilograms of the €9 coffee and $y$ kilograms of the €13 coffee, write an equation for the total cost of the blend.'
            answer: '9x + 13y = 200'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The €9 coffee costs $9x$ euros and the €13 coffee costs $13y$ euros. The blend of $20$ kilograms at €10 per kilogram is worth $200$ euros, so $9x + 13y = 200$.'
          - problem: 'A baker mixes $4$ kilograms of flour at €5 per kilogram with $6$ kilograms of flour at €10 per kilogram. What is the price of the mixture per kilogram?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The mixture costs $4 \times 5 + 6 \times 10 = 80$ euros and has a mass of $10$ kilograms. The price per kilogram is $80 \div 10 = 8$ euros.'
          - problem: 'Sam mixes $6$ kilograms of rice at €8 per kilogram with $2$ kilograms of rice at €16 per kilogram. He averages the two prices and says the mixture costs €12 per kilogram. What is the correct price per kilogram?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'There is more of the cheaper rice, so the price must be closer to €8 than to €16. The mixture costs $6 \times 8 + 2 \times 16 = 80$ euros for $8$ kilograms, which is $80 \div 8 = 10$ euros per kilogram.'
          - problem: 'A shop wants $18$ kilograms of mixture worth €10 per kilogram, made from rice at €6 per kilogram and rice at €12 per kilogram. How many kilograms of the €12 rice are needed?'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'Let $x$ and $y$ be the kilograms of the €6 and €12 rice. Then $x + y = 18$ and $6x + 12y = 180$. Replacing $x$ by $18 - y$ gives $108 + 6y = 180$, so $y = 12$.'
        constraints: 'blend price between the two ingredient prices; halves allowed; ask for one mass or for the price of a given blend; include grams and cents conversions'
    diagnostic_exemplar:
      problem: 'How many liters each of $10\%$ and $30\%$ solution make $8$ L of $25\%$ solution?'
      answer_contract: {kind: multipart, parts: [{name: 10_percent, contract: {kind: unit, quantity: volume, unit: L}}, {name: 30_percent, contract: {kind: unit, quantity: volume, unit: L}}]}
      answer: "10_percent = 2 L; 30_percent = 6 L"
      solution_sketch: '$x + y = 8$, $0.1x + 0.3y = 2$; $0.1x + 0.3(8 - x) = 2$; $0.2x = 0.4$; $x = 2$.'
    anki_seeds:
      - front: "Mixture system: amount equation x + y = total; the second equation totals the ___."
        back: "pure substance (or value): (conc1)x + (conc2)y = (target conc)(total)"
        type: basic

  - id: systems-rate-problems
    name: "Rate Systems (Current and Wind)"
    # over-coverage: current/wind and meeting-problem context schema for
    # systems-elimination; d = rt dressing, no new solving technique
    core: false
    difficulty: 0.57
    drill: false
    answer_kind: multi-step
    expected_time_secs: 170
    prerequisites:
      - id: systems-elimination
        weight: 0.6
        key: true
      - id: systems-substitution
        weight: 0.4
      - id: equation-word-problems
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Current and wind: sum and difference"
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'Add: $2b=36$, so $b=18$.'
          question: 'Why does adding the two equations remove $c$?'
          options:
            - 'The current speed is zero once the speeds are added'
            - 'One has $+c$ and the other $-c$, so they cancel'
            - 'Adding always removes the smaller unknown'
            - 'The two equations have the same right side'
          answer: 'One has $+c$ and the other $-c$, so they cancel'
          why: 'The terms $+c$ and $-c$ add to zero, which leaves $2b$ equal to the sum of the two ground speeds.'
        exemplars:
          - problem: 'A boat travels at $18$ km/h over the ground with the current and $10$ km/h against it. What is the speed of the boat in still water?'
            answer: '14'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'With the current the speeds add, so $b + c = 18$. Against it they subtract, so $b - c = 10$. Adding gives $2b = 28$, so $b = 14$ km/h.'
          - problem: 'A plane flies at $540$ km/h over the ground with the wind and $420$ km/h against it. What is the speed of the wind?'
            answer: '60'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The ground speeds are $a + w = 540$ and $a - w = 420$. Subtracting gives $2w = 120$, so the wind speed is $60$ km/h.'
          - problem: 'A kayaker paddles at $200$ metres per minute over the ground with the current and $150$ metres per minute against it. What is the kayaker''s speed in still water, in km/h?'
            answer: '10.5'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'Adding $k + c = 200$ and $k - c = 150$ gives $2k = 350$, so $k = 175$ metres per minute. In one hour that is $175 \times 60 = 10500$ metres, which is $10.5$ km/h.'
          - problem: 'A ferry travels at $37$ km/h downstream and $25$ km/h upstream. Sam subtracts the two speeds and says the current is $12$ km/h. What is the speed of the current?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The difference of the ground speeds is $2c$, because the current is added once and subtracted once. So $c = 12 \div 2 = 6$ km/h, and the ferry''s still-water speed is $31$ km/h.'
          - problem: 'A plane''s ground speed is $480$ km/h with the wind and $420$ km/h against it. Let $p$ be the plane''s speed in still air and $w$ the speed of the wind, both in km/h. Write an equation for the flight against the wind.'
            answer: 'p - w = 420'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Against the wind the ground speed is the speed in still air minus the speed of the wind. So $p - w = 420$.'
          - problem: 'A rower''s ground speed is $9$ km/h downstream and $5$ km/h upstream. Let $r$ be the rower''s speed in still water and $c$ the speed of the current, both in km/h. Write an equation for the trip downstream.'
            answer: 'r + c = 9'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Downstream the current adds to the rower''s speed, so the ground speed is the sum of the two speeds. So $r + c = 9$.'
          - problem: 'A swimmer swims at $3$ km/h in still water. The river current is $1$ km/h. How long does the swimmer take to swim $4$ km upstream?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'Against the current the ground speed is $3 - 1 = 2$ km/h. The time is the distance divided by the speed, $4 \div 2 = 2$ hours.'
          - problem: 'A rowing crew rows at $9$ km/h in still water. The current is $2$ km/h. How far does the crew travel downstream in $3$ hours?'
            answer: '33'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'Downstream the ground speed is $9 + 2 = 11$ km/h. The distance is the speed times the time, $11 \times 3 = 33$ km.'
          - problem: 'A cyclist rides at $22$ km/h over the ground into a headwind and at $30$ km/h with the same wind behind. What is the cyclist''s speed in still air?'
            answer: '26'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'Let $c$ be the cyclist''s speed and $w$ the wind speed. Then $c - w = 22$ and $c + w = 30$. Adding gives $2c = 52$, so $c = 26$ km/h.'
        constraints: 'ground speeds with and against the current or wind are given; ask for the still-water speed, the current or a trip time or distance; include one unit conversion'
      - id: kp2
        name: "Compute the two speeds from d = rt first"
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'Compute the downstream speed: $40 \div 4=10$ km/h'
          question: 'Why divide the distance by the time to get the downstream speed?'
          options:
            - 'Dividing gives the still-water speed directly'
            - 'The time must be shared between the two directions'
            - 'Speed is the distance covered in one hour'
            - 'Division removes the effect of the current'
          answer: 'Speed is the distance covered in one hour'
          why: 'Speed is distance per unit of time, so $40$ km in $4$ hours means $10$ km each hour; this ground speed still includes the current.'
        exemplars:
          - problem: 'A canoe travels $42$ km in $2$ hours with the current and $42$ km in $3$ hours against it. What is the speed of the current?'
            answer: '3.5'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'With the current the ground speed is $42 \div 2 = 21$ km/h. Against it, it is $42 \div 3 = 14$ km/h. The current is half the difference, $(21 - 14) \div 2 = 3.5$ km/h.'
          - problem: 'A plane flies $1800$ km in $3$ hours with the wind and $2000$ km in $4$ hours against it. What is its speed in still air?'
            answer: '550'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'With the wind the ground speed is $1800 \div 3 = 600$ km/h. Against it, it is $2000 \div 4 = 500$ km/h. The speed in still air is the average, $(600 + 500) \div 2 = 550$ km/h.'
          - problem: 'A launch travels $60$ km in $180$ minutes downstream and $48$ km in $240$ minutes upstream. What is the speed of the current?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'Convert the times: $180$ minutes is $3$ hours and $240$ minutes is $4$ hours. The ground speeds are $60 \div 3 = 20$ km/h and $48 \div 4 = 12$ km/h. The current is $(20 - 12) \div 2 = 4$ km/h.'
          - problem: 'A ferry log lists an upstream trip of $45$ km taking $3$ hours and a downstream trip of $35$ km taking $1$ hour. What is the ferry''s speed in still water?'
            answer: '25'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'Upstream the ground speed is $45 \div 3 = 15$ km/h, and downstream it is $35 \div 1 = 35$ km/h. The still-water speed is the average, $(35 + 15) \div 2 = 25$ km/h.'
          - problem: 'A river boat travels at $16$ km/h in still water and the current is $4$ km/h. How much longer does a $60$ km trip upstream take than the same trip downstream?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'Upstream the ground speed is $12$ km/h, so the trip takes $60 \div 12 = 5$ hours. Downstream it is $20$ km/h, so the trip takes $60 \div 20 = 3$ hours. The upstream trip takes $2$ hours longer.'
          - problem: 'A canoe travels $30$ km downstream in $2$ hours. Let $b$ be the canoe''s speed in still water and $c$ the speed of the current, both in km/h. Write an equation for the downstream trip.'
            answer: 'b + c = 15'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The ground speed downstream is the distance divided by the time, $30 \div 2 = 15$ km/h. Downstream the current adds to the speed in still water, so $b + c = 15$.'
          - problem: 'A rowing team covers $24$ km downstream in $2$ hours and $24$ km upstream in $3$ hours. Sam adds the times and divides $48$ km by $5$ hours, getting a rowing speed of $9.6$ km/h. What is the correct rowing speed?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The ground speeds are $24 \div 2 = 12$ km/h downstream and $24 \div 3 = 8$ km/h upstream. The rowing speed is the average of the two, $(12 + 8) \div 2 = 10$ km/h, so Sam''s $48 \div 5$ does not describe either direction.'
          - problem: 'A swimmer swims $3$ km downstream in $30$ minutes and $3$ km back upstream in $45$ minutes. What is the swimmer''s speed in still water?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'Downstream the speed is $3 \div 0.5 = 6$ km/h, since $30$ minutes is $0.5$ hours. Upstream it is $3 \div 0.75 = 4$ km/h. The still-water speed is $(6 + 4) \div 2 = 5$ km/h.'
        constraints: 'distances and times are given instead of speeds; divide each distance by its time first; times may be in minutes; ask for one speed or a time difference'
      - id: kp3
        name: "Two travelers"
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'Compute the combined speed: $56 \div 7=8$ km/h'
          question: 'Why is $56 \div 7$ the sum of the two speeds and not one speed?'
          options:
            - 'Together the hikers close the whole $56$ km gap in $7$ h'
            - 'The faster hiker alone covers the whole $56$ km'
            - 'The slower hiker sets the pace for both of them'
            - 'Each hiker walks half of the $56$ km, so the speeds are equal'
          answer: 'Together the hikers close the whole $56$ km gap in $7$ h'
          why: 'The distances the two hikers walk add up to the starting gap, so their speeds add up to the gap divided by the time.'
        exemplars:
          - problem: 'Two cars start $420$ km apart and drive toward each other, meeting after $3$ hours. One car is $12$ km/h faster than the other. What is the speed of the faster car?'
            answer: '76'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'Together the cars close the gap at $420 \div 3 = 140$ km/h, so $f + s = 140$. Also $f - s = 12$. Adding gives $2f = 152$, so the faster car goes $76$ km/h.'
          - problem: 'Two trains start $660$ km apart and travel toward each other, meeting after $6$ hours. During those $6$ hours the faster train covers $108$ km more than the slower one. What is the speed of the slower train?'
            answer: '46'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The combined speed is $660 \div 6 = 110$ km/h. In one hour the faster train covers $108 \div 6 = 18$ km more, so $f - s = 18$. Then $2s = 110 - 18 = 92$ and $s = 46$ km/h.'
          - problem: 'Two cyclists start $99$ km apart and ride toward each other, meeting after $180$ minutes. One is $5$ km/h faster than the other. What is the speed of the faster cyclist?'
            answer: '19'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The meeting time is $3$ hours, so the combined speed is $99 \div 3 = 33$ km/h. With $f - s = 5$, adding gives $2f = 38$, so the faster cyclist rides $19$ km/h.'
          - problem: 'Two walkers start $60$ km apart and walk toward each other, meeting after $4$ hours. One walker walks one and a half times as fast as the other. What is the speed of the slower walker?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The combined speed is $60 \div 4 = 15$ km/h. If the slower walker goes $s$, the faster goes $1.5s$, so $2.5s = 15$ and $s = 6$ km/h.'
          - problem: 'Two hikers start $80$ km apart and walk toward each other, meeting after $8$ hours. One hiker is $4$ km/h faster than the other. Sam computes $80 \div 8 = 10$ and says the faster hiker walks at $10 + 4 = 14$ km/h. What is the speed of the faster hiker?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}
            solution_sketch: 'The number $10$ km/h is the sum of both speeds, not the slower speed. Adding $f + s = 10$ and $f - s = 4$ gives $2f = 14$, so the faster hiker walks at $7$ km/h.'
          - problem: 'Two cyclists start $90$ km apart and ride toward each other, meeting after $3$ hours. Let $f$ and $s$ be their speeds in km/h. Write an equation for the distance the two cyclists cover together.'
            answer: '3f + 3s = 90'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'In $3$ hours the first cyclist covers $3f$ kilometres and the second covers $3s$ kilometres. Together they cover the whole $90$ km gap, so $3f + 3s = 90$.'
          - problem: 'Two trucks leave towns $300$ km apart at the same time and drive toward each other at $55$ km/h and $45$ km/h. How long does it take them to meet?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "h", "allow_omitted": true}
            solution_sketch: 'Together the trucks close the gap at $55 + 45 = 100$ km/h. The time to close $300$ km is $300 \div 100 = 3$ hours.'
          - problem: 'A bus and a van leave towns $250$ km apart at the same time and drive toward each other, the bus at $60$ km/h and the van at $40$ km/h. How far from the bus''s town do they meet?'
            answer: '150'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'They close the gap at $60 + 40 = 100$ km/h, so they meet after $250 \div 100 = 2.5$ hours. In that time the bus travels $60 \times 2.5 = 150$ km.'
        constraints: 'travelers move toward each other; combined speed is the distance divided by the meeting time; a second relation (difference, ratio) gives the other equation; include a time and a meeting-point question'
    diagnostic_exemplar:
      problem: 'A rower goes $18$ km downstream in $2$ h and returns in $3$ h. Find the rowing speed and the current speed.'
      answer_contract: {kind: multipart, parts: [{name: rowing, contract: {kind: unit, quantity: speed, unit: km/h}}, {name: current, contract: {kind: unit, quantity: speed, unit: km/h}}]}
      answer: 'rowing = 7.5 km/h; current = 1.5 km/h'
      solution_sketch: 'Downstream $\frac{18}{2} = 9 = b + c$; upstream $\frac{18}{3} = 6 = b - c$; so $b = 7.5$ and $c = 1.5$.'
    anki_seeds:
      - front: "With a current or wind: downstream/tailwind speed = ___; upstream/headwind speed = ___."
        back: "b + c (sum); b - c (difference)"
        type: basic

  - id: systems-word-problems
    name: "Systems Word Problems"
    core: false                # word-problem genre; cone now supplemental
    difficulty: 0.58
    drill: false
    answer_kind: multi-step
    expected_time_secs: 165
    prerequisites:
      # the generic one-variable modelling capstone: every exemplar below is a
      # sentence-to-equation translation, generalised to two variables. It was
      # already an ancestor (via systems-rate-problems), so this edge adds no new
      # gate; it keeps translating-sentences-to-equations in the closure now that
      # the specialised money/rate feeders are supplemental.
      - id: equation-word-problems
        weight: 0.5
        key: true
      - id: systems-elimination
        weight: 0.4
        key: true
      - id: systems-substitution
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Set up two equations from a sum/difference"
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'Add the two equations: $2x=46$'
          question: 'Why does adding the two equations leave only $x$?'
          options:
            - 'The $y$ terms are $+y$ and $-y$, so they add to zero'
            - 'Adding always removes the variable that is named second'
            - 'Both equations equal numbers, so the unknowns cancel out'
            - 'The sum and difference facts are about the same quantity'
          answer: 'The $y$ terms are $+y$ and $-y$, so they add to zero'
          why: 'The first equation has $+y$ and the second has $-y$, so $y+(-y)=0$ and $x+x=2x$ remains; a pair like $x+y$ and $x+y$ would not cancel.'
        try_first:
          problem: 'The sum of two numbers is $20$ and their difference is $4$. What is the larger number?'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'Add the two facts: the smaller number cancels and leaves twice the larger number, $24$. So the larger number is $12$, and the same adding step solves every sum and difference problem.'
        exemplars:
          - problem: 'The sum of two numbers is $41$ and their difference is $9$. Find the two numbers.'
            answer: '25, 16'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'Let $x$ be the larger number and $y$ the smaller. Then $x+y=41$ and $x-y=9$, and adding the two equations gives $2x=50$, so $x=25$ and $y=16$.'
          - problem: 'Two classes have $48$ students altogether. Class X has $6$ more students than class Y. How many students are in class Y?'
            answer: '21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $x$ and $y$ be the sizes of class X and class Y, so $x+y=48$ and $x-y=6$. Adding gives $2x=54$, so $x=27$ and class Y has $48-27=21$ students.'
          - problem: 'Ana and Ben share $90$ dollars so that Ana receives $14$ dollars more than Ben. How much does Ben receive?'
            answer: '38 dollars'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollars","allow_omitted":true}
            solution_sketch: 'Let $x$ be Ana''s share and $y$ Ben''s share, so $x+y=90$ and $x-y=14$. Subtracting the second equation from the first gives $2y=76$, so Ben receives $38$ dollars.'
          - problem: 'A box and a crate have a combined mass of $25$ kg. The crate is $3$ kg heavier than the box. What is the mass of the crate?'
            answer: '14 kg'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'Let $x$ be the mass of the crate and $y$ the mass of the box, so $x+y=25$ and $x-y=3$. Adding gives $2x=28$, so the crate has a mass of $14$ kg.'
          - problem: 'Leo and Mia hiked $30$ km in total over a weekend, and Mia hiked $8$ km further than Leo. How far did Leo hike?'
            answer: '11 km'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Let $x$ be the distance Mia hiked and $y$ the distance Leo hiked, so $x+y=30$ and $x-y=8$. Subtracting gives $2y=22$, so Leo hiked $11$ km.'
          - problem: 'Two planks have a total length of $36$ cm and differ in length by $10$ cm. Sam says that they are $26$ cm and $10$ cm long. What are the correct lengths?'
            answer: '23, 13'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'Sam''s lengths add to $36$ cm, but they differ by $16$ cm, not $10$ cm. The correct equations are $x+y=36$ and $x-y=10$, which give $2x=46$, so the planks are $23$ cm and $13$ cm long.'
          - problem: 'A rope $52$ m long is cut into two pieces. One piece is $18$ m longer than the other. How long is the shorter piece?'
            answer: '17 m'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Let $x$ be the longer piece and $y$ the shorter piece, so $x+y=52$ and $x-y=18$. Subtracting gives $2y=34$, so the shorter piece is $17$ m long. Dividing $52$ by $2$ would be wrong, because the two pieces are not equal.'
        constraints: "define two variables; one relationship per sentence"
      - id: kp2
        name: "Geometry and age setups"
        key_prerequisites: [systems-substitution]
        step_check:
          step: 'Write the ratio equation: $f=4s$'
          question: 'Why is the ratio written $f=4s$ and not $s=4f$?'
          options:
            - 'The letter named first is always the one that gets multiplied'
            - 'The father is $4$ times as old, so $f$ is the multiple'
            - 'The son is younger, so his age gets the larger multiplier'
            - 'Both forms are equivalent, so the choice does not matter'
          answer: 'The father is $4$ times as old, so $f$ is the multiple'
          why: '''Four times as old'' multiplies the age of the younger person; with $s=4f$ the son would be older, and $s+f=55$ would give $s=44$, not $11$.'
        exemplars:
          - problem: 'A rectangular garden has a perimeter of $46$ m. Its length is $5$ m more than its width. Find the length and the width of the garden.'
            answer: '14, 9'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'Let $x$ be the length and $y$ the width. The perimeter gives $2x+2y=46$, so $x+y=23$, and also $x-y=5$. Adding gives $2x=28$, so the length is $14$ m and the width is $9$ m.'
          - problem: 'Two supplementary angles differ by $40$ degrees. What is the size of the larger angle?'
            answer: '110 degrees'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"degrees","allow_omitted":true}
            solution_sketch: 'Supplementary angles add to $180$ degrees, so $x+y=180$ and $x-y=40$. Adding gives $2x=220$, so the larger angle is $110$ degrees.'
          - problem: 'Mira is $3$ times as old as her brother Tom. Together they are $28$ years old. How old is Tom?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $x$ be Mira''s age and $y$ Tom''s age, so $x=3y$ and $x+y=28$. Substituting gives $4y=28$, so Tom is $7$ years old and Mira is $21$.'
          - problem: 'Sam is told that two complementary angles differ by $10$ degrees. He adds the angles to $180$ and finds $95$ and $85$ degrees. What are the correct sizes of the two angles?'
            answer: '50, 40'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'Complementary angles add to $90$ degrees, not $180$ degrees, so $x+y=90$ and $x-y=10$. Adding gives $2x=100$, so the angles are $50$ and $40$ degrees.'
          - problem: 'A rectangle has a perimeter of $60$ cm and its length is twice its width. What is the width?'
            answer: '10 cm'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Let $x$ be the length and $y$ the width. The perimeter gives $x+y=30$, and the length gives $x=2y$. Substituting gives $3y=30$, so the width is $10$ cm.'
          - problem: 'A mother is $26$ years older than her daughter, and the sum of their ages is $50$. How old is the mother?'
            answer: '38'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $x$ be the mother''s age and $y$ her daughter''s age, so $x-y=26$ and $x+y=50$. Adding gives $2x=76$, so the mother is $38$ years old.'
          - problem: 'The perimeter of a rectangular field is $80$ m. Its length is $3$ times its width. How long is the field?'
            answer: '30 m'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Half the perimeter is $x+y=40$, where $x$ is the length and $y$ the width, and $x=3y$. Substituting gives $4y=40$, so $y=10$ and the length is $x=30$ m.'
        constraints: "perimeter, supplementary/complementary angles, or ages"
      - id: kp3
        name: "Multi-relationship setups"
        key_prerequisites: [systems-elimination]
        step_check:
          step: 'Check the scaled equation: $3(28)-20=84-20=64$'
          question: 'Why check the values in $3x-y=64$ and not only in $x+y=48$?'
          options:
            - 'The scaled equation is the only true fact in the problem'
            - 'Checking one equation is enough, because the other follows'
            - 'The sum equation already produced $y$, so it fits there'
            - 'The check turns the two values into an ordered pair'
          answer: 'The sum equation already produced $y$, so it fits there'
          why: 'The value $y=20$ was found from $x+y=48$, so that equation always holds; only $3x-y=64$ tests whether $x=28$ is right.'
        exemplars:
          - problem: 'The sum of two numbers is $23$. One number is $2$ more than twice the other. Find the two numbers.'
            answer: '16, 7'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'Let $y$ be the smaller number, so the other is $x=2y+2$. Then $x+y=23$ gives $3y+2=23$, so $y=7$ and $x=16$.'
          - problem: 'A group of $35$ people is made up of adults and children. There are $3$ more than three times as many children as adults. How many children are in the group?'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $x$ be the number of adults and $y$ the number of children, so $x+y=35$ and $y=3x+3$. Substituting gives $4x+3=35$, so $x=8$ and there are $27$ children.'
          - problem: 'Two tanks hold $50$ L of water altogether. Tank A holds $5$ L less than four times as much as tank B. How much water is in tank A?'
            answer: '39 L'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'Let $x$ and $y$ be the amounts in tank A and tank B, so $x+y=50$ and $x=4y-5$. Substituting gives $5y-5=50$, so $y=11$ and tank A holds $39$ L.'
          - problem: 'Two lengths add up to $20$ cm, and the longer is $2$ cm more than twice the shorter. Sam says that the lengths are $13$ cm and $7$ cm. What are the correct lengths?'
            answer: '14, 6'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'Sam''s lengths add to $20$ cm, but $2\cdot7+2=16$, not $13$. The correct equations are $x+y=20$ and $x=2y+2$, which give $3y+2=20$, so $y=6$ and $x=14$.'
          - problem: 'Ben has $4$ times as many stickers as Ana. Together they have $65$ stickers. How many stickers does Ana have?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $x$ be the number of stickers Ben has and $y$ the number Ana has, so $x=4y$ and $x+y=65$. Substituting gives $5y=65$, so Ana has $13$ stickers.'
          - problem: 'The sum of two numbers is $31$, and twice the larger number minus the smaller number is $17$. Find the two numbers.'
            answer: '16, 15'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'Let $x$ be the larger number and $y$ the smaller, so $x+y=31$ and $2x-y=17$. Adding gives $3x=48$, so $x=16$ and $y=15$.'
          - problem: 'Two boxes hold $70$ books altogether. Box A holds $8$ fewer than twice as many books as box B. How many books are in box B?'
            answer: '26'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let $x$ and $y$ be the numbers of books in box A and box B, so $x+y=70$ and $x=2y-8$. Substituting gives $3y-8=70$, so $y=26$ and box A holds $44$ books.'
        constraints: "one scaled relationship plus one sum; integer answers"
    diagnostic_exemplar:
      problem: 'The sum of two numbers is $28$; twice the larger minus the smaller is $23$. Find the numbers.'
      answer_contract: {kind: list, ordered: false, member: {kind: exact}}
      answer: '17 and 11'
      solution_sketch: '$x + y = 28$ and $2x - y = 23$; adding gives $3x = 51$, so $x = 17$ and $y = 11$.'
    anki_seeds:
      - front: "To set up a systems word problem: define ___ variables and write one equation per ___."
        back: "two; stated relationship"
        type: basic
