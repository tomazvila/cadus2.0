        visuals: [{"kind":"coordinate","x_min":"-6","x_max":"6","y_min":"-6","y_max":"6","x_tick":"1","y_tick":"1","points":[],"segments":[],"shaded_half_planes":[{"through_a":{"x":"-4","y":"-4"},"through_b":{"x":"4","y":"4"},"solid":true,"shade_toward":{"x":"4","y":"0"},"label":"y ≤ x"}],"caption":"The graph of y ≤ x has a solid boundary through (-4,-4) and (4,4), shaded toward (4,0)."}]
        name: "Boundary line: solid or dashed"
        key_prerequisites: [graphing-linear-equations]
        step_check:
          step: 'Every point on the boundary satisfies the inequality'
          question: 'Why is the boundary line drawn solid for $y\ge-x+4$?'
          options:
            - 'The negative slope of the line forces it to be solid'
            - 'A solid line tells you which side is shaded'
            - '$\ge$ allows equality, so line points count'
            - '$\ge$ is strict, so line points are excluded'
          answer: '$\ge$ allows equality, so line points count'
          why: 'The sign $\ge$ includes equality, so every point on the line is a solution and the line is solid; a strict sign would make it dashed.'
        exemplars:
          - problem: 'Is the boundary line of $y>-3x+5$ solid or dashed?'
            answer: 'dashed'
            answer_contract: {"kind": "label", "options": [["solid", "a solid line", "solid line", "it is solid", "continuous"], ["dashed", "a dashed line", "dashed line", "it is dashed", "dotted", "broken"]]}
            solution_sketch: 'The sign $>$ is strict, so points on the boundary line $y=-3x+5$ do not satisfy the inequality. The boundary line is therefore dashed.'
          - problem: 'Mia may spend at most 40 dollars on pens at 2 dollars each and notebooks at 5 dollars each, so $2x+5y\le40$ for $x$ pens and $y$ notebooks. Should the boundary line of this inequality be drawn solid or dashed?'
            answer: 'solid'
            answer_contract: {"kind": "label", "options": [["solid", "a solid line", "solid line", "it is solid", "continuous"], ["dashed", "a dashed line", "dashed line", "it is dashed", "dotted", "broken"]]}
            solution_sketch: 'The sign $\le$ allows equality, so spending exactly 40 dollars is allowed. Points on the line $2x+5y=40$ are solutions, so the line is solid.'
          - problem: 'What is the $y$-intercept of the boundary line of $y<-2x+4$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The boundary line is $y=-2x+4$. It crosses the $y$-axis where $x=0$, which gives $y=4$.'
          - problem: 'Which of the points $(1,7)$ and $(1,5)$ lies on the boundary line of $y\ge5x+2$?'
            answer: '(1,7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The boundary line is $y=5x+2$. At $x=1$ it has height $5(1)+2=7$, so $(1,7)$ is on the line and $(1,5)$ is not.'
          - problem: 'A lift may carry at most 600 kg. It carries $x$ small crates of 20 kg and $y$ large crates of 30 kg, so $20x+30y\le600$. On the boundary line, with no small crates, how many large crates are in the lift?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x=0$ the boundary line $20x+30y=600$ gives $30y=600$. Dividing by 30 gives $y=20$ large crates.'
          - problem: 'What is the slope of the boundary line of $2x+y>7$?'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The boundary line is $2x+y=7$, which rearranges to $y=-2x+7$. The coefficient of $x$ is the slope, so the slope is -2.'
          - problem: 'A gym charges 10 dollars per class and 4 dollars per smoothie. Jo wants to spend less than 60 dollars, so $10x+4y<60$ for $x$ classes and $y$ smoothies. On the boundary line, how many classes does Jo buy when she buys no smoothies?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $y=0$ the boundary line $10x+4y=60$ gives $10x=60$. Dividing by 10 gives $x=6$ classes.'
        constraints: "solid for <= or >=; dashed for < or >"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-6","x_max":"6","y_min":"-6","y_max":"6","x_tick":"1","y_tick":"1","points":[],"segments":[],"shaded_half_planes":[{"through_a":{"x":"-4","y":"-4"},"through_b":{"x":"4","y":"4"},"solid":false,"shade_toward":{"x":"4","y":"0"},"label":"y < x"}],"caption":"Testing (4,0) in y < x gives a true statement, so the region containing (4,0) is shaded."}]
        name: "Test a point to choose the shaded side"
        key_prerequisites: [linear-inequalities]
        step_check:
          step: 'Substitute the test point'
          question: 'Why does one true test point tell you to shade the whole side containing it?'
          options:
            - 'Only the points near the test point are solutions'
            - 'Every point on that side gives the same result'
            - 'The test point must lie on the boundary line itself'
            - 'A true result means the boundary line must be solid'
          answer: 'Every point on that side gives the same result'
          why: 'Moving across the boundary line is the only way to change a true statement into a false one, so one point decides the whole side.'
        try_first:
          problem: 'Does the point $(0,5)$ make $y>x+1$ true?'
          answer_contract: {"kind": "label", "options": [["yes", "yes it does", "it does", "correct", "true"], ["no", "no it does not", "it does not", "incorrect", "false"]]}
          answer: 'yes'
          reveal: 'Substituting gives $5>0+1$, which is true. All points on one side of a line give the same result, so one test point decides which side to shade.'
        exemplars:
          - problem: 'For the inequality $y<x+2$, is the point $(2,1)$ on the shaded side of the boundary line?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "on the shaded side", "shaded", "it does"], ["no", "no it is not", "it is not", "not on the shaded side", "not shaded", "it does not"]]}
            solution_sketch: 'Substitute $(2,1)$ into $y<x+2$. The result is $1<2+2=4$, which is true. A true statement means the point is on the shaded side.'
          - problem: 'For the inequality $y\ge3x-1$, is the point $(2,4)$ on the shaded side of the boundary line?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "on the shaded side", "shaded", "it does"], ["no", "no it is not", "it is not", "not on the shaded side", "not shaded", "it does not"]]}
            solution_sketch: 'Substitute $(2,4)$ into $y\ge3x-1$. The result is $4\ge3(2)-1=5$, which is false. A false statement means the point is not on the shaded side.'
          - problem: 'Which of the points $(1,2)$ and $(4,0)$ satisfies $y>2x-3$?'
            answer: '(1,2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $(1,2)$ we get $2>2(1)-3=-1$, which is true. At $(4,0)$ we get $0>2(4)-3=5$, which is false. So $(1,2)$ is the point that satisfies the inequality.'
          - problem: 'A club sells cakes for 3 dollars and drinks for 2 dollars. It wants to raise at least 60 dollars, so $3x+2y\ge60$ for $x$ cakes and $y$ drinks. Which sale meets the goal, $(10,12)$ or $(14,10)$?'
            answer: '(14,10)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The sale $(10,12)$ raises $3(10)+2(12)=54$ dollars, which is less than 60. The sale $(14,10)$ raises $3(14)+2(10)=62$ dollars, so it meets the goal.'
          - problem: 'What is the largest whole number $k$ for which $(2,k)$ lies in the shaded region of $y<3x-1$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substituting $x=2$ gives $k<3(2)-1=5$. The largest whole number below 5 is 4.'
          - problem: 'A truck may carry at most 1000 kg. It carries 8 crates of 50 kg and 7 crates of 80 kg, which is the point $(8,7)$ for $50x+80y\le1000$. How many kilograms of spare capacity remain?'
            answer: '40'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'Substitute $(8,7)$ to get $50(8)+80(7)=400+560=960$ kg. The limit is 1000 kg, so $1000-960=40$ kg of capacity remain.'
          - problem: 'Which of the points $(-1,3)$ and $(2,-3)$ satisfies $2x-y>4$?'
            answer: '(2,-3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $(-1,3)$ we get $2(-1)-3=-5$, which is not greater than 4. At $(2,-3)$ we get $2(2)-(-3)=7$, which is greater than 4. So $(2,-3)$ satisfies the inequality.'
        constraints: "substitute a test point; true -> shade that side"
      - id: kp3
        visuals: [{"kind":"coordinate","x_min":"-6","x_max":"6","y_min":"-6","y_max":"6","x_tick":"1","y_tick":"1","points":[],"segments":[],"shaded_half_planes":[{"through_a":{"x":"1","y":"0"},"through_b":{"x":"2","y":"1"},"solid":true,"shade_toward":{"x":"0","y":"-2"},"label":"y ≤ x - 1"}],"caption":"The origin fails y ≤ x - 1. Shade the side containing (0,-2), which satisfies the inequality."}]
        name: "Shade using the origin test"
        key_prerequisites: [linear-inequalities]
        step_check:
          step: 'does not pass through $(0,0)$'
          question: 'Why must you first see that the boundary line misses the origin?'
          options:
            - 'The origin must be on the line for the test to work'
            - 'A line through the origin is always dashed'
            - 'The test works only when the slope is positive'
            - 'A point on the line is on neither side'
          answer: 'A point on the line is on neither side'
          why: 'A point on the boundary line is on neither side, so it tells you nothing about the shading; use a different point instead.'
        exemplars:
          - problem: 'For $2x+3y+5\le23$, is the origin in the shaded region?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "in the shaded region", "inside", "it does"], ["no", "no it is not", "it is not", "not in the shaded region", "outside", "it does not"]]}
            solution_sketch: 'Substitute $(0,0)$ into the left side: $2(0)+3(0)+5=5$. The statement $5\le23$ is true, so the origin is in the shaded region.'
          - problem: 'Is the origin in the shaded region of $y-2x-4>0$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "in the shaded region", "inside", "it does"], ["no", "no it is not", "it is not", "not in the shaded region", "outside", "it does not"]]}
            solution_sketch: 'Substitute $(0,0)$ into the left side: $0-2(0)-4=-4$. The statement $-4>0$ is false, so the origin is not in the shaded region.'
          - problem: 'For the inequality $y>2x+k$, the origin lies in the shaded region only when $k$ is small enough. What is the largest whole number $k$ that works?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At the origin the inequality becomes $0>k$. The largest whole number below 0 is -1.'
          - problem: 'A cafe must earn at least 80 dollars a day from coffees at 4 dollars and muffins at 3 dollars, so $4x+3y\ge80$. If it sells nothing, which is the origin, by how many dollars does it miss the goal?'
            answer: '80'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'At the origin the earnings are $4(0)+3(0)=0$ dollars, which is not at least 80. The shortfall is $80-0=80$ dollars, so the origin is outside the shaded region.'
          - problem: 'For $y\le x-1$, by how many units is the origin above the boundary line?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x=0$ the boundary line has height $0-1=-1$. The origin has height 0, so it is $0-(-1)=1$ unit above the line, and it fails $y\le x-1$.'
          - problem: 'Sam tests the origin in $y\ge2x+5$ and finds that it fails. Which of the points $(0,8)$ and $(0,2)$ is on the shaded side?'
            answer: '(0,8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At the origin $0\ge5$ is false, so the shaded side is the other side. At $(0,8)$ we get $8\ge5$, which is true. At $(0,2)$ we get $2\ge5$, which is false.'
          - problem: 'A student has 50 dollars to spend on films at 8 dollars and games at 5 dollars, so $8x+5y\le50$. At the origin, how many dollars of the budget are left?'
            answer: '50'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'At the origin the spending is $8(0)+5(0)=0$ dollars. All $50-0=50$ dollars are left, so the origin satisfies the inequality.'
        constraints: "the origin is the easiest test point unless it is on the line"
    diagnostic_exemplar:
      problem: 'For $y > x - 1$, state whether the boundary is dashed or solid and whether $(0, 0)$ is a solution.'
      answer_contract: {kind: multipart, parts: [{name: boundary, contract: {kind: label, options: [[dashed], [solid]]}}, {name: point, contract: {kind: label, options: [[yes], [no]]}}]}
      answer: "boundary = dashed; point = yes"
      solution_sketch: '$>$ gives a dashed line; $0 > -1$ is true.'
    anki_seeds:
      - front: "Boundary line style for a linear inequality: solid vs dashed?"
        back: "solid for <= / >=, dashed for < / >"
        type: basic
      - front: "Which side of the boundary line do you shade for a linear inequality?"
        back: "the side where a test point makes the inequality true"
        type: basic

  - id: checking-systems-solutions
    name: "Checking Solutions of Systems"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: solutions-of-two-variable-equations
        weight: 0.7
        key: true
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Verify a pair in both equations"
        key_prerequisites: [solutions-of-two-variable-equations]
        step_check:
          step: 'The same pair satisfies both equations'
          question: 'Why is it not enough that $(3,7)$ satisfies only the first equation?'
          options:
            - 'The second equation is the only one that matters'
            - 'A solution must make every equation true at once'
            - 'A point on one line is always on the other line too'
            - 'The pair must give equal left sides in the two equations'
          answer: 'A solution must make every equation true at once'
          why: 'A system asks for one pair that works in every equation; a pair that fits only one equation lies on only one of the lines.'
        exemplars:
          - problem: 'Is $(2,5)$ a solution of the system $y=2x+1$, $x+y=7$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "it is a solution", "is a solution", "correct"], ["no", "no it is not", "it is not", "not a solution", "is not a solution", "wrong"]]}
            solution_sketch: 'In the first equation, $2(2)+1=5$, which matches $y=5$. In the second equation, $2+5=7$ also holds. The pair satisfies both equations, so it is a solution.'
          - problem: 'A cafe sells small cups for 3 dollars and large cups for 4 dollars. A table orders 6 cups and pays 22 dollars. The waiter says they had 3 small cups and 3 large cups. Can the waiter be right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes he can", "he can", "he can be right", "he is right", "correct"], ["no", "no he cannot", "he cannot", "he cannot be right", "he is wrong", "wrong", "no it is not", "it is not"]]}
            solution_sketch: 'Three small and 3 large cups make 6 cups, so the count fits. The cost is $3(3)+4(3)=21$ dollars, not 22 dollars, so the claim fails.'
          - problem: 'The point $(3,1)$ lies on both lines $y=kx-5$ and $x+2y=5$. Find $k$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The point satisfies $x+2y=5$, since $3+2(1)=5$. Substituting into $y=kx-5$ gives $1=3k-5$, so $3k=6$ and $k=2$.'
          - problem: 'The point $(4,-2)$ satisfies $\frac{x}{2}+y=0$ and also $y-x=c$. Find $c$.'
            answer: '-6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first equation holds, since $\frac{4}{2}+(-2)=0$. For the second equation, the value of $c$ is $y-x=-2-4=-6$.'
          - problem: 'A van carries 9 boxes, small ones of 2 kg and large ones of 5 kg. The driver says there are 6 small boxes and 3 large boxes and that the load weighs 30 kg. By how many kilograms is the driver''s weight wrong?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}
            solution_sketch: 'The count fits, since $6+3=9$. The true weight is $2(6)+5(3)=27$ kg, so the stated 30 kg is wrong by $30-27=3$ kg.'
          - problem: 'For what value of $a$ is $(a,3)$ a solution of both $y=x+2$ and $x+y=4$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $y=x+2$ with $y=3$ we get $a=1$. The second equation also holds, since $1+3=4$. So $a=1$ makes the pair a solution of both.'
        constraints: "check the point in BOTH equations"
      - id: kp2
        name: "Reject a pair that fails one equation"
        key_prerequisites: [solutions-of-two-variable-equations]
        step_check:
          step: 'In the second, the left side is $3(4)-1=11$, which differs from $10$'
          question: 'Why is $(4,1)$ rejected although it satisfies $x+2y=6$?'
          options:
            - 'A pair is rejected when its two sums differ from each other'
            - 'A pair that fits one equation is a solution of half the system'
            - 'One equation that fails is enough to show it is not a solution'
            - 'The first equation of a system does not count toward the answer'
          answer: 'One equation that fails is enough to show it is not a solution'
          why: 'A solution must satisfy every equation, so a single failed equation rules the pair out whatever the other equations say.'
        exemplars:
          - problem: 'Is $(2,3)$ a solution of the system $y=x+1$, $2x+y=8$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "it is a solution", "is a solution", "correct"], ["no", "no it is not", "it is not", "not a solution", "is not a solution", "wrong"]]}
            solution_sketch: 'The first equation holds, since $2+1=3$. In the second equation, $2(2)+3=7$, not 8. The pair fails one equation, so it is not a solution.'
          - problem: 'Is $(-2,5)$ a solution of the system $3x-y=-11$, $x+y=3$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "it is a solution", "is a solution", "correct"], ["no", "no it is not", "it is not", "not a solution", "is not a solution", "wrong"]]}
            solution_sketch: 'In the first equation, $3(-2)-5=-11$, which holds. In the second equation, $-2+5=3$, which also holds. Both equations hold, so the pair is a solution.'
          - problem: 'Sam checks $(6,2)$ in $\frac{x}{3}+y=4$, sees that it works, and says it solves the system that also has $y-x=-5$. What is the value of $y-x$ at $(6,2)$?'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first equation holds, since $\frac{6}{3}+2=4$. But $y-x=2-6=-4$, not -5. Sam did not check the second equation, and the pair is not a solution.'
          - problem: 'A florist sells roses for 3 dollars and tulips for 2 dollars. A customer buys 3 roses and 2 tulips, 5 flowers in all, and says the bill was 14 dollars. By how many dollars is the bill wrong?'
            answer: '1'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The flower count fits, since $3+2=5$. The bill should be $3(3)+2(2)=13$ dollars, so the stated 14 dollars is wrong by 1 dollar.'
          - problem: 'At $(2,3)$, by how much do the two sides of $x=2y+1$ differ?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left side is 2. The right side is $2(3)+1=7$. The sides differ by $7-2=5$, so the pair fails this equation.'
          - problem: 'A garden is said to be 7 m long and 4 m wide, to be 3 m longer than it is wide, and to have a perimeter of 20 m. By how many metres is the stated perimeter wrong?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The length fits, since $4+3=7$. The perimeter is $2(7+4)=22$ m, so the stated 20 m is wrong by $22-20=2$ m.'
        constraints: "one equation passes, the other fails"
      - id: kp3
        name: "Pick the solution from candidates"
        key_prerequisites: [solutions-of-two-variable-equations]
        step_check:
          step: 'For $(3,11)$, $2(3)+5=11$, but $3+11=14$ differs from $17$'
          question: 'Why is $(3,11)$ ruled out although it satisfies $y=2x+5$?'
          options:
            - 'It fails $x+y=17$, and a solution must satisfy both'
            - 'Its two coordinates are too far apart to be a solution'
            - 'The first candidate is always ruled out'
            - 'A true first equation makes the second one false'
          answer: 'It fails $x+y=17$, and a solution must satisfy both'
          why: 'Passing one equation is not enough; $(3,11)$ fails the second equation, so the other candidate must be the solution.'
        exemplars:
          - problem: 'Which of $(1,4)$ and $(2,6)$ is a solution of the system $y=2x+2$, $x+y=5$?'
            answer: '(1,4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $(1,4)$, $2(1)+2=4$ and $1+4=5$, so both equations hold. The pair $(2,6)$ fails the second equation, since $2+6=8$.'
          - problem: 'Which of $(3,2)$ and $(-2,1)$ is a solution of the system $x+3y=1$, $2x-y=-5$?'
            answer: '(-2,1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $(-2,1)$, $-2+3(1)=1$ and $2(-2)-1=-5$, so both equations hold. The pair $(3,2)$ fails the first equation, since $3+3(2)=9$.'
          - problem: 'A cafe sells muffins for 3 dollars and bagels for 2 dollars. A customer buys 8 items and pays 19 dollars. Which of $(m,b)=(3,5)$ and $(5,3)$, the numbers of muffins and bagels, could the order have been?'
            answer: '(3,5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The pair $(3,5)$ gives $3+5=8$ items and $3(3)+2(5)=19$ dollars, so it fits both facts. The pair $(5,3)$ costs $3(5)+2(3)=21$ dollars, which does not match.'
          - problem: 'Which of $(4,-1)$ and $(2,1)$ is a solution of the system $\frac{x}{2}+y=1$, $x-y=5$?'
            answer: '(4,-1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $(4,-1)$, $\frac{4}{2}+(-1)=1$ and $4-(-1)=5$, so both equations hold. The pair $(2,1)$ gives $2-1=1$, not 5.'
          - problem: 'Which of $(0,3)$, $(5,2)$ and $(2,7)$ is a solution of the system $x=3y-1$, $x+2y=9$?'
            answer: '(5,2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $(5,2)$, $3(2)-1=5$ and $5+2(2)=9$, so both equations hold. The pair $(0,3)$ gives $3(3)-1=8$, not 0, and $(2,7)$ gives $3(7)-1=20$, not 2.'
          - problem: 'A rectangle has a perimeter of 30 cm, and its length is 3 cm more than its width. Which of $(l,w)=(9,6)$ and $(10,7)$, in centimetres, could be its size?'
            answer: '(9,6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The pair $(9,6)$ gives $9=6+3$ and $2(9+6)=30$, so both facts hold. The pair $(10,7)$ has perimeter $2(10+7)=34$ cm, which is too large.'
        constraints: "two or three candidates; exactly one works"
    diagnostic_exemplar:
      problem: 'Which of $(1, 4)$ or $(3, 2)$ solves the system $x + y = 5$ and $2x - y = 4$?'
      answer: '(3, 2)'
      solution_sketch: '$(1, 4)$ fails the second equation ($2 - 4 = -2$); $(3, 2)$ satisfies both.'
    anki_seeds:
      - front: "An ordered pair is a solution of a system only if it satisfies ___."
        back: "every equation in the system"
        type: basic

  - id: graphing-systems
    name: "Solving Systems by Graphing"
    core: false
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: graphing-linear-equations
        weight: 0.6
        key: true
      - id: checking-systems-solutions
        weight: 0.5
        key: true
      - id: slope-intercept-form
        weight: 0.3
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"1","y":"3","label":"I"}],"segments":[{"from":{"x":"-2","y":"0","label":null},"to":{"x":"4","y":"6","label":null}},{"from":{"x":"-2","y":"6","label":null},"to":{"x":"4","y":"0","label":null}}],"caption":"The lines y = x + 2 and y = -x + 4 cross at the point I = (1, 3), the solution of the pair. Only the displayed segments are drawn."}]
        name: "Solution as the intersection point"
        key_prerequisites: [graphing-linear-equations]
        step_check:
          step: 'At the intersection the heights agree'
          question: 'Why can you write $3x-4=-2x+11$ at the intersection?'
          options:
            - 'Both lines have the same slope at that point'
            - 'The point is on both lines, so one $y$ fits both'
            - 'The two lines must both pass through the origin'
            - 'The $x$-values of the two lines add up to zero there'
          answer: 'The point is on both lines, so one $y$ fits both'
          why: 'The crossing point is on both lines, so its height is $3x-4$ and also $-2x+11$; setting them equal leaves one equation in $x$.'
        try_first:
          problem: 'The lines $y=x$ and $y=10-x$ cross at one point. What is the $x$-coordinate of that point?'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'At the crossing both lines have the same height, so $x=10-x$ and $x=5$. The crossing point is the one pair of numbers that works for both equations.'
        exemplars:
          - problem: 'The lines $y=x+1$ and $y=5-x$ intersect. Find the point where they cross.'
            answer: '(2,3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At the crossing the heights agree: $x+1=5-x$, so $2x=4$ and $x=2$. Then $y=2+1=3$.'
          - problem: 'Gym A charges a joining fee of 20 dollars plus 10 dollars a month, so its cost is $y=10x+20$ after $x$ months. Gym B charges 15 dollars a month with no fee, so $y=15x$. After how many months do the two gyms cost the same?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The costs are equal when $10x+20=15x$, so $20=5x$ and $x=4$ months. Each gym then costs 60 dollars.'
          - problem: 'Line A passes through $(0,2)$ and $(1,5)$. Line B has slope $-1$ and passes through $(0,10)$. Find the point where the two lines cross.'
            answer: '(2,8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Line A has slope 3 and $y$-intercept 2, so $y=3x+2$. Line B is $y=-x+10$. Equal heights give $3x+2=-x+10$, so $x=2$ and $y=8$.'
          - problem: 'A company''s cost is $y=2x+12$ thousand dollars and its revenue is $y=5x$ thousand dollars when it sells $x$ thousand items. Find the break-even point.'
            answer: '(4,20)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Break-even is where cost equals revenue: $2x+12=5x$, so $3x=12$ and $x=4$. Then $y=5(4)=20$.'
          - problem: 'A candle 20 cm tall burns down 2 cm each hour, so its height is $y=20-2x$ after $x$ hours. A second candle 14 cm tall burns down 1 cm each hour, so $y=14-x$. After how many hours are the two candles the same height?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}
            solution_sketch: 'The heights are equal when $20-2x=14-x$, so $x=6$. Both candles are then 8 cm tall.'
          - problem: 'Sam finds where $y=3$ meets $y=x-1$ and writes $(3,4)$. What is the correct intersection point?'
            answer: '(4,3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The first line fixes the height at 3. Then $3=x-1$ gives $x=4$, so the point is $(4,3)$. Sam swapped the two coordinates.'
          - problem: 'Find the point where the graphs of $y=3x-4$ and $y=-2x+11$ cross.'
            answer: '(3,5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Equal heights give $3x-4=-2x+11$, so $5x=15$ and $x=3$. Then $y=3(3)-4=5$, and the second line gives $-2(3)+11=5$ as well.'
        constraints: "the intersection point is the solution"
      - id: kp2
        visuals: [{"kind":"coordinate","x_min":"-8","x_max":"8","y_min":"-8","y_max":"8","x_tick":"1","y_tick":"1","points":[{"x":"1","y":"3","label":"I"}],"segments":[{"from":{"x":"-2","y":"0","label":null},"to":{"x":"4","y":"6","label":null}},{"from":{"x":"-2","y":"6","label":null},"to":{"x":"4","y":"0","label":null}}],"caption":"The lines y = x + 2 and y = -x + 4 cross at the point I = (1, 3), the solution of the pair. Only the displayed segments are drawn."}]
        name: "Graph and intersect mixed forms"
        key_prerequisites: [graphing-linear-equations]
        step_check:
          step: 'A shared point has $y=5$'
          question: 'Why can you replace $y$ by $5$ in $4x-y=19$?'
          options:
            - 'Every line in the system has the height 5'
            - 'The $y$ term is always replaced by the larger number'
            - 'The equation $4x-y=19$ is horizontal as well'
            - 'The shared point is on $y=5$, so its height is 5'
          answer: 'The shared point is on $y=5$, so its height is 5'
          why: 'A point on the horizontal line $y=5$ has height 5, and the shared point is also on the second line, so putting $y=5$ into its equation leaves one unknown.'
        exemplars:
          - problem: 'Find the intersection of the lines $2x+y=7$ and $y=x+1$.'
            answer: '(2,3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Substitute $y=x+1$ into the first equation: $2x+x+1=7$, so $3x=6$ and $x=2$. Then $y=2+1=3$.'
          - problem: 'Where does the vertical line $x=-2$ meet the horizontal line $y=4$?'
            answer: '(-2,4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Every point of the vertical line has $x=-2$, and every point of the horizontal line has $y=4$. They meet at the one point $(-2,4)$.'
          - problem: 'A shop''s budget line is $x+2y=10$ and its demand is the horizontal line $y=3$. Where do the two lines cross?'
            answer: '(4,3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Put $y=3$ into the budget line: $x+2(3)=10$, so $x=4$. The lines cross at $(4,3)$.'
          - problem: 'Sam draws $x=3$ as a horizontal line and then finds where it meets $y=-x+5$. What is the correct intersection point?'
            answer: '(3,2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The line $x=3$ is vertical, so every point on it has $x=3$. Then $y=-3+5=2$, so the intersection is $(3,2)$.'
          - problem: 'Find the intersection of $x+y=8$ and $3x-y=4$.'
            answer: '(3,5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'From $x+y=8$ we get $y=8-x$. Then $3x-(8-x)=4$, so $4x=12$ and $x=3$. Then $y=8-3=5$.'
          - problem: 'On a map, a road follows the line $2x-y=3$ and a river follows the line $y=-x+9$. Where does the road cross the river?'
            answer: '(4,5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Put $y=-x+9$ into the road''s equation: $2x-(-x+9)=3$, so $3x=12$ and $x=4$. Then $y=-4+9=5$.'
          - problem: 'Find where the line $5x-y=20$ meets the horizontal line $y=-5$.'
            answer: '(3,-5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Put $y=-5$ into the first equation: $5x+5=20$, so $5x=15$ and $x=3$. The lines meet at $(3,-5)$.'
        constraints: "standard form, slope-intercept, and horizontal/vertical lines"
      - id: kp3
        name: "Confirm a graphical estimate algebraically"
        key_prerequisites: [checking-systems-solutions]
        step_check:
          step: 'The estimate fails the second equation, so it is not a system solution'
          question: 'Why is the estimate rejected although it fits $2x+y=9$?'
          options:
            - 'It misses the second line, and a crossing must fit both'
            - 'A graph reading is rejected whenever it fits only one line'
            - 'A point on one line is never on the other line'
            - 'The second equation is more important than the first'
          answer: 'It misses the second line, and a crossing must fit both'
          why: 'The true crossing lies on both lines; the estimate misses the second line, so it is close to the crossing but not equal to it.'
        exemplars:
