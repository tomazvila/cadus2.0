  - id: equations-with-fractions
    name: "Equations with Fractions"
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: multi-step-equations
        weight: 0.7
        key: true
      - id: adding-subtracting-fractions
        weight: 0.7
        key: true
      - id: multiplying-fractions
        weight: 0.6
      - id: dividing-fractions
        weight: 0.4
      - id: gcf-lcm
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Isolate a single fractional term"
        key_prerequisites: [multiplying-fractions]
        exemplars:
          - problem: "Solve $\\frac{x}{2} + 3 = 7$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$\\frac{x}{2} = 4$; $x = 8$."
          - problem: "Solve $\\frac{2}{3}x = 8$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply by $\\frac{3}{2}$: $x = 12$."
          - problem: "Solve $5-x/4=8$."
            answer: "-12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Subtract $5$: $-x/4=3$. Multiply by $-4$: $x=-12$."
          - problem: "One third of the difference between $x$ and $2$ is $5$. Find $x$."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$(x-2)/3=5$. Multiply by $3$: $x-2=15$. Add $2$: $x=17$."
        constraints: "one fractional term; integer solution"
      - id: kp2
        name: "Clear denominators with the LCD"
        key_prerequisites: [adding-subtracting-fractions]
        exemplars:
          - problem: "Solve $\\frac{x}{3} + \\frac{x}{6} = 5$."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply by $6$: $2x + x = 30$; $3x = 30$; $x = 10$."
          - problem: "Solve $\\frac{x + 1}{2} = \\frac{x - 1}{3}$."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3(x + 1) = 2(x - 1)$; $3x + 3 = 2x - 2$; $x = -5$."
          - problem: "Solve $x/4+1/2=x/6+1$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply every term by LCD $12$: $3x+6=2x+12$. Collecting gives $x=6$."
          - problem: "A learner clears denominators in $x/2-x/3=4$ but leaves $4$ unchanged. Solve correctly."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply every term by $6$: $3x-2x=24$. The left side is $x$, so $x=24$."
        constraints: "multiply EVERY term by the LCD; integer solution"
      - id: kp3
        name: "Fractions combined with distribution"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: "Solve $\\frac{2}{3}(x - 6) = 4$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Distributing produces variable term $2x/3$ and constant $-4$. Move that constant to the other side: $2x/3=8$, hence $x=12$. Check: the inner difference is $6$, and two thirds of it is $4$."
          - problem: "Solve $(x+4)/2+(x-2)/3=8$ and check."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply by $6$: $3(x+4)+2(x-2)=48$. Expand to $5x+8=48$, giving $x=8$. Check: the two quotients are $6$ and $2$, whose sum is $8$."
          - problem: "Solve $3(x-2)/4=(x+6)/2$ and check."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply by $4$: $3x-6=2x+12$, hence $x=18$. Check: $3(18-2)/4=12$ and $(18+6)/2=12$."
          - problem: "Correct the distribution in $(x-3)/2-(x+1)/4=1$, then solve and check."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply by $4$: $2(x-3)-(x+1)=4$. Expand: $x-7=4$, so $x=11$. Check: the first quotient is $4$, the second $3$, and their difference is $1$."
        constraints: "integer solutions; check by substituting back"
    diagnostic_exemplar:
      problem: 'Solve $\frac{2}{3}(x - 3) = \frac{x}{2}$.'
      answer: '12'
      solution_sketch: 'Multiply by the LCD $6$: $4(x - 3) = 3x$; $4x - 12 = 3x$; $x = 12$.'
    anki_seeds:
      - front: "First step to solve an equation containing fractions:"
        back: "multiply every term on both sides by the least common denominator (LCD) to clear the fractions"
        type: basic

  - id: rearranging-formulas
    name: "Rearranging Simple Formulas"
    core: true
    difficulty: 0.44
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: two-step-equations
        weight: 0.7
        key: true
      - id: evaluating-formulas
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "One-step rearrangements"
        key_prerequisites: [two-step-equations, evaluating-formulas]
        exemplars:
          - problem: 'Solve $y = x + b$ for $x$.'
            answer: "x = y - b"
            answer_contract: {kind: exact}
            solution_sketch: 'Subtract $b$ from both sides: $x = y - b$.'
          - problem: 'Solve $d = rt$ for $t$. Assume $r\ne0$.'
            answer: "t = d/r"
            answer_contract: {kind: exact}
            solution_sketch: 'Divide both sides by $r$. Division is valid because $r\ne0$.'
          - problem: 'Solve $p = q - r$ for $q$.'
            answer: "q = p + r"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $r$ to both sides.'
          - problem: 'Solve $A = bh$ for $h$. Assume $b\ne0$.'
            answer: "h = A/b"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide both sides by $b$. Division is valid because $b\ne0$.'
        constraints: "one inverse operation; target variable appears once"
      - id: kp2
        name: "Two-step rearrangements"
        key_prerequisites: [two-step-equations, evaluating-formulas]
        exemplars:
          - problem: 'Solve $C = 2 \cdot \pi \cdot r$ for $r$.'
            answer: "r = C/(2*pi)"
            answer_contract: {kind: exact}
            solution_sketch: 'Divide both sides by $2\pi$.'
          - problem: 'Solve $P = 2l + 2w$ for $l$.'
            answer: "l = (P - 2w)/2"
            answer_contract: {kind: exact}
            solution_sketch: 'Subtract $2w$, then divide by $2$.'
          - problem: 'Solve $V = lwh$ for $w$ (treat $l$ and $h$ as known). Assume $lh\ne0$.'
            answer: "w = V/(l*h)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide both sides by $l$ and by $h$. Division is valid because $lh\ne0$.'
          - problem: 'Solve $y = mx + b$ for $x$ (treat $m$ and $b$ as known). Assume $m\ne0$.'
            answer: "x = (y - b)/m"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $b$, then divide by $m$. Division is valid because $m\ne0$.'
        constraints: "two inverse operations; target variable appears once"
    diagnostic_exemplar:
      problem: 'Solve $v = u + at$ for $t$.'
      answer: "t = (v - u)/a"
      solution_sketch: 'Subtract $u$, then divide by $a$.'
    anki_seeds:
      - front: "Rearranging a formula uses the same moves as solving an equation, except..."
        back: "the other quantities stay as letters; apply inverse operations to isolate the target variable"
        type: basic

  - id: literal-equations
    name: "Literal Equations and Formulas"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 110
    prerequisites:
      - id: rearranging-formulas
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.6
        key: true
      - id: distributive-property
        weight: 0.3
      - id: dividing-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Multi-term formulas"
        key_prerequisites: [multi-step-equations, rearranging-formulas]
        exemplars:
          - problem: 'Solve $ax + b = c$ for $x$. Assume $a\ne0$.'
            answer: "x = (c - b)/a"
            answer_contract: {kind: exact}
            solution_sketch: 'Subtract $b$, then divide by $a$. Division is valid because $a\ne0$.'
          - problem: 'Solve $A = \frac{1}{2}bh$ for $h$. Assume $b\ne0$.'
            answer: "h = 2A/b"
            answer_contract: {kind: exact}
            solution_sketch: 'Multiply by $2$, divide by $b$. Division is valid because $b\ne0$.'
          - problem: 'Solve $px + q = r$ for $x$. Assume $p\ne0$.'
            answer: "x = (r - q)/p"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $q$, then divide by $p$. Division is valid because $p\ne0$.'
          - problem: 'Solve $V = \frac{1}{3}Bh$ for $B$. Assume $h\ne0$.'
            answer: "B = 3V/h"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $3$, divide by $h$. Division is valid because $h\ne0$.'
        constraints: "target variable appears once; keep other letters symbolic"
      - id: kp2
        name: "Target variable in more than one term"
        key_prerequisites: [distributive-property]
        exemplars:
          - problem: 'Solve $ax + bx = c$ for $x$. Assume $a+b\ne0$.'
            answer: "x = c/(a + b)"
            answer_contract: {kind: exact}
            solution_sketch: 'Factor: $x(a + b) = c$; divide by $(a + b)$. Division is valid because $a+b\ne0$.'
          - problem: 'Solve $x = \frac{y - 3}{2}$ for $y$.'
            answer: "y = 2x + 3"
            answer_contract: {kind: exact}
            solution_sketch: '$2x = y - 3$; $y = 2x + 3$.'
          - problem: 'Solve $mx - nx = k$ for $x$. Assume $m-n\ne0$.'
            answer: "x = k/(m - n)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor: $x(m - n) = k$; divide by $(m - n)$. Division is valid because $m-n\ne0$.'
          - problem: 'Solve $y = \frac{x + 5}{3}$ for $x$.'
            answer: "x = 3y - 5"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$3y = x + 5$; $x = 3y - 5$.'
        constraints: "may require factoring out the target variable"
      - id: kp3
        name: "Formulas requiring distribution or clearing a fraction"
        key_prerequisites: [distributive-property, rearranging-formulas]
        exemplars:
          - problem: 'Solve $S = 2(l + w)$ for $w$.'
            answer: "w = S/2 - l"
            answer_contract: {kind: exact}
            solution_sketch: 'Divide by $2$: $\frac{S}{2} = l + w$; subtract $l$.'
          - problem: 'Solve $A = \frac{1}{2}h(a + b)$ for $a$. Assume $h\ne0$.'
            answer: "a = 2A/h - b"
            answer_contract: {kind: exact}
            solution_sketch: 'Multiply by $2$: $2A = h(a + b)$; divide by $h$; subtract $b$. Division is valid because $h\ne0$.'
          - problem: 'Solve $P = 2(a + b)$ for $b$.'
            answer: "b = P/2 - a"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide by $2$: $\frac{P}{2} = a + b$; subtract $a$.'
          - problem: 'Solve $T = \frac{1}{2}k(m + n)$ for $m$. Assume $k\ne0$.'
            answer: "m = 2T/k - n"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $2$: $2T = k(m + n)$; divide by $k$; subtract $n$. Division is valid because $k\ne0$.'
        constraints: "undo an outer factor before reaching the target variable"
    diagnostic_exemplar:
      problem: 'Solve $ax - bx = c$ for $x$.'
      answer: 'x = c/(a - b)'
      solution_sketch: 'Factor the left side: $x(a - b) = c$, then divide by $a - b$.'
    anki_seeds:
      - front: "To solve a literal equation for a variable that appears in two terms, first ..."
        back: "factor that variable out of both terms, then divide"
        type: basic

  - id: basic-absolute-value-equations
    name: "Basic Absolute Value Equations"
    core: false                # head of the terminal absolute-value solving branch
    difficulty: 0.42
    drill: false
    answer_kind: multi-step
    expected_time_secs: 75
    prerequisites:
      - id: absolute-value
        weight: 0.7
        key: true
      - id: one-step-equations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Solve |x| = a"
        key_prerequisites: [absolute-value]
        try_first:
          problem: 'A buoy floats on a straight shoreline marked in metres, with the lighthouse at $0$. The buoy is exactly $23$ m from the lighthouse. Give the set of all positions where it could be.'
          answer_contract: {"kind":"exact"}
          answer: '{-23,23}'
          reveal: 'Distance ignores direction, so there are two positions, one on each side: $-23$ and $23$. That is exactly what $|x|=23$ asks for.'
        step_check:
          step: 'The left position is $-30$'
          question: 'Why does $|x|=30$ have two solutions?'
          options:
            - 'Both $-30$ and $30$ are $30$ units from zero'
            - 'Absolute value makes a number negative, so only $-30$ works'
            - 'Only $30$ works, because absolute values are positive'
          answer: 'Both $-30$ and $30$ are $30$ units from zero'
          why: '$|x|$ is the distance of $x$ from zero, and distance ignores direction: the output $|x|$ is never negative, but $x$ itself can be.'
        exemplars:
          - problem: 'Solve $|x| = 7$.'
            answer: '-7, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Absolute value measures distance from zero. The two numbers at distance $7$ are $x = -7$ and $x = 7$.'
          - problem: 'Which numbers on the number line are exactly $4$ units from $0$?'
            answer: '-4, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There is one such number on each side of zero. Moving left $4$ gives $-4$ and moving right $4$ gives $4$.'
          - problem: 'A student solves $|x| = 9$ and writes only $x = 9$. Solve the equation completely.'
            answer: '-9, 9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A number and its negative have the same absolute value, and $|-9| = 9$ as well. The solutions are $x = -9$ and $x = 9$.'
          - problem: 'At which $x$-coordinates does the graph of $y = |x|$ meet the line $y = 5$?'
            answer: '-5, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graphs meet where $|x| = 5$. The two points are equally far from zero, at $x = -5$ and $x = 5$.'
          - problem: 'Solve $|x| = 2.5$.'
            answer: '-2.5, 2.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both $2.5$ and $-2.5$ are $2.5$ units from zero. The solutions are $x = -2.5$ and $x = 2.5$.'
          - problem: 'Solve $|y| = \frac{3}{4}$.'
            answer: '-3/4, 3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numbers $\frac{3}{4}$ units from zero lie on both sides of zero. The solutions are $y = -\frac{3}{4}$ and $y = \frac{3}{4}$.'
        constraints: "right side positive; two solutions"
      - id: kp2
        name: "Solve |x + b| = c with a one-step inside"
        key_prerequisites: [one-step-equations, absolute-value]
        step_check:
          step: 'The inside value is either six or negative six'
          question: 'Why do we also solve $x+9=-6$?'
          options:
            - 'The inside can equal $-6$, because $|-6|=6$'
            - 'Only $x+9=6$ is needed; the second equation is just a check'
            - 'Split the bars as $|x|+9=6$, so $|x|=-3$ and there is no solution'
          answer: 'The inside can equal $-6$, because $|-6|=6$'
          why: 'Any number with absolute value $6$ is $6$ or $-6$, so the whole inside $x+9$ can be either; bars do not split over a sum, since $|x+9|\ne|x|+9$ for negative $x$.'
        exemplars:
          - problem: 'Solve $|x - 3| = 5$.'
            answer: '-2, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inside is $5$ or $-5$. From $x - 3 = 5$ we get $x = 8$, and from $x - 3 = -5$ we get $x = -2$.'
          - problem: 'At which $x$-coordinates does the graph of $y = |x + 4|$ meet the line $y = 2$?'
            answer: '-6, -2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graphs meet where $x + 4 = 2$ or $x + 4 = -2$. These give $x = -2$ and $x = -6$.'
          - problem: 'Which numbers on the number line are exactly $6$ units from $2$?'
            answer: '-4, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The distance from $x$ to $2$ is $|x - 2|$, so solve $|x - 2| = 6$. Then $x - 2 = 6$ gives $8$ and $x - 2 = -6$ gives $-4$.'
          - problem: 'A student solves $|x + 2| = 5$ and finds only $x = 3$. Solve the equation completely.'
            answer: '-7, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The positive case $x + 2 = 5$ gives $x = 3$. The missed case $x + 2 = -5$ gives $x = -7$.'
          - problem: 'Solve $|x - 2| = 5$.'
            answer: '-3, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inside is $5$ or $-5$. From $x - 2 = 5$ we get $x = 7$, and from $x - 2 = -5$ we get $x = -3$.'
          - problem: 'Solve $|x + 6| = 1$.'
            answer: '-7, -5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inside is $1$ or $-1$. From $x + 6 = 1$ we get $x = -5$, and from $x + 6 = -1$ we get $x = -7$.'
        constraints: "split into two one-step equations; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $|x - 4| = 6$.'
      answer: "x = 10 or x = -2"
      solution_sketch: '$x - 4 = 6 \to x = 10$; $x - 4 = -6 \to x = -2$.'
    anki_seeds:
      - front: "If |X| = a with a > 0, then X = ?"
        back: "X = a or X = -a"
        type: basic

  - id: absolute-value-equations
    name: "Absolute Value Equations"
    core: false                # terminal absolute-value solving branch
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: basic-absolute-value-equations
        weight: 0.7
        key: true
      - id: two-step-equations
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Absolute value of a linear expression"
        key_prerequisites: [two-step-equations, basic-absolute-value-equations]
        step_check:
          step: 'Case 2: $6x - 15 = -27$'
          question: 'In case 2, which part is set equal to $-27$?'
          options:
            - 'The whole inside, $6x-15$'
            - 'Only the $x$-term changes sign: $-6x-15=27$'
            - 'Only the constant changes sign: $6x+15=27$'
          answer: 'The whole inside, $6x-15$'
          why: 'The bars wrap the whole expression, so the whole inside equals $27$ or $-27$; flipping the sign of one term inside gives a different equation.'
        exemplars:
          - problem: 'Solve $|2x + 1| = 9$.'
            answer: '-5, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inside is $9$ or $-9$. From $2x + 1 = 9$ we get $x = 4$, and from $2x + 1 = -9$ we get $x = -5$.'
          - problem: 'At which $x$-coordinates does the graph of $y = |3x - 6|$ meet the line $y = 12$?'
            answer: '-2, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graphs meet where $3x - 6 = 12$ or $3x - 6 = -12$. Solving gives $x = 6$ or $x = -2$.'
          - problem: 'Solve $|4x - 8| = 12$.'
            answer: '-1, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $4x - 8 = 12$ or $4x - 8 = -12$. Then $4x = 20$ or $4x = -4$, so $x = 5$ or $x = -1$.'
          - problem: 'A student solves $|5x + 5| = 15$ and finds only $x = 2$. Solve the equation completely.'
            answer: '-4, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The case $5x + 5 = 15$ gives $x = 2$. The missed case $5x + 5 = -15$ gives $5x = -20$, so $x = -4$.'
          - problem: 'Solve $|2x - 3| = 7$.'
            answer: '-2, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inside is $7$ or $-7$. From $2x - 3 = 7$ we get $x = 5$, and from $2x - 3 = -7$ we get $x = -2$.'
          - problem: 'Solve $|3x + 2| = 4$.'
            answer: '-2, 2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $3x + 2 = 4$ we get $3x = 2$, so $x = 2/3$. From $3x + 2 = -4$ we get $3x = -6$, so $x = -2$.'
        constraints: "split into two linear equations; integer solutions"
      - id: kp2
        name: "Isolate the absolute value first"
        key_prerequisites: [two-step-equations, basic-absolute-value-equations]
        step_check:
          step: 'Add 5 to both sides: $3|x - 4| = 21$'
          question: 'Why isolate $|x-4|$ before splitting into two cases?'
          options:
            - 'The two-case rule applies only to $|\text{inside}| = \text{number}$'
            - 'Splitting first works too: $3(x-4)-5=16$ or $3(x-4)-5=-16$'
            - 'Only to make the numbers smaller'
          answer: 'The two-case rule applies only to $|\text{inside}| = \text{number}$'
          why: 'Splitting early gives $3(x-4)-5=-16$, so $x=\tfrac13$, which fails: $3|\tfrac13-4|-5=6$, not $16$.'
        exemplars:
          - problem: 'Solve $|x + 2| - 3 = 4$.'
            answer: '-9, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $3$ to isolate the absolute value: $|x + 2| = 7$. The cases $x + 2 = 7$ and $x + 2 = -7$ give $x = 5$ and $x = -9$.'
          - problem: 'Solve $2|x| = 10$.'
            answer: '-5, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide by $2$ to isolate the absolute value: $|x| = 5$. The solutions are $x = -5$ and $x = 5$.'
          - problem: 'Solve $3|2x - 1| + 4 = 13$.'
            answer: '-1, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $4$ and divide by $3$: $|2x - 1| = 3$. Then $2x - 1 = 3$ gives $x = 2$ and $2x - 1 = -3$ gives $x = -1$.'
          - problem: 'Solve $10 - 2|x + 3| = 2$.'
            answer: '-7, 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $10$ and divide by $-2$: $|x + 3| = 4$. The cases $x + 3 = 4$ and $x + 3 = -4$ give $x = 1$ and $x = -7$.'
          - problem: 'Solve $\frac{|x - 4|}{3} = 2$.'
            answer: '-2, 10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $3$ to isolate the absolute value: $|x - 4| = 6$. The cases $x - 4 = 6$ and $x - 4 = -6$ give $x = 10$ and $x = -2$.'
          - problem: 'Solve $4|x + 1| - 7 = 5$.'
            answer: '-4, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $7$ and divide by $4$: $|x + 1| = 3$. The cases $x + 1 = 3$ and $x + 1 = -3$ give $x = 2$ and $x = -4$.'
        constraints: "isolate |..| before splitting into cases"
      - id: kp3
        name: "Recognize no-solution cases"
        key_prerequisites: [basic-absolute-value-equations]
        step_check:
          step: 'Divide by 5: $|2x + 3| = -1$'
          question: 'Why does $|2x+3|=-1$ have no solution?'
          options:
            - 'An absolute value is a distance, so it is never negative'
            - 'Split it: $2x+3=-1$ gives $x=-2$'
            - 'Drop the bars and the sign: $2x+3=1$ gives $x=-1$'
          answer: 'An absolute value is a distance, so it is never negative'
          why: '$|2x+3|\ge0$ for every $x$; the case split needs a right side of $0$ or more, and $x=-2$ gives $|-1|=1$, not $-1$.'
        exemplars:
          - problem: 'Solve $|x - 5| = -3$.'
            answer: 'no solution'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'An absolute value is a distance, so it is never negative. No number makes $|x - 5|$ equal $-3$, so there is no solution.'
          - problem: 'Does $|2x| + 7 = 3$ have a solution?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","it does not","no solution","there is no solution"],["yes","it does","it has a solution","there is a solution"]]}
            solution_sketch: 'Subtract $7$ to isolate the absolute value: $|2x| = -4$. An absolute value is never negative, so the equation has no solution.'
          - problem: 'Solve $|x + 3| + 4 = 4$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $4$: $|x + 3| = 0$. Only zero has absolute value $0$, so $x + 3 = 0$ and the single solution is $x = -3$.'
          - problem: 'Solve $5 - |x + 1| = 2$.'
            answer: '-4, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $5$ and multiply by $-1$: $|x + 1| = 3$, which is positive. The cases give $x = 2$ and $x = -4$.'
          - problem: 'Give an integer value of $c$ for which $|x - 2| = c$ has no solution.'
            answer: '-1'
            answer_contract: {"kind":"property","check":"integer_in_range","args":{"max":-1}}
            solution_sketch: 'An absolute value is never negative, so any negative $c$ works, such as $c = -1$. Other answers include $-2$ and $-10$; $c = 0$ gives the solution $x = 2$.'
          - problem: 'Solve $|2x - 1| + 6 = 9$.'
            answer: '-1, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $6$: $|2x - 1| = 3$, which is positive, so there are two cases. They give $x = 2$ and $x = -1$.'
        constraints: "isolated absolute value equals a negative number"
    diagnostic_exemplar:
      problem: 'Solve $|3x - 1| - 2 = 6$.'
      answer: 'x = 3 or x = -7/3'
      solution_sketch: '$|3x - 1| = 8$; $3x - 1 = 8 \to x = 3$; $3x - 1 = -8 \to x = -\frac{7}{3}$.'
    anki_seeds:
      - front: "If |X| = a with a > 0, then X = ? "
        back: "X = a or X = -a (isolate the absolute value first)"
        type: basic
      - front: "If |X| = a and a < 0, the equation has ..."
        back: "no solution (absolute value is never negative)"
        type: basic

  - id: translating-sentences-to-equations
    name: "Translating Sentences into Equations"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: translating-phrases-to-expressions
        weight: 0.7
        key: true
      - id: two-step-equations
        weight: 0.6
        key: true
      - id: one-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Translate and solve one- and two-step sentences"
        key_prerequisites: [two-step-equations, translating-phrases-to-expressions]
        step_check:
          step: 'Subtract $9$ from both sides'
          question: 'Why is $9$ removed before dividing by $4$?'
          options:
            - 'Undo in reverse order: $+9$ was applied last, so it is undone first'
            - 'Subtraction always comes before division in the order of operations'
            - 'Dividing first is not allowed when the right side is odd'
          answer: 'Undo in reverse order: $+9$ was applied last, so it is undone first'
          why: 'Building $4x+9$ multiplies by $4$ first and adds $9$ last, so solving reverses that; dividing first works only if every term is divided: $x+\tfrac94=\tfrac{41}{4}$.'
        exemplars:
          - problem: 'A number increased by $7$ is $22$. Find the number.'
            answer: '15'
            answer_contract: {kind: exact}
            solution_sketch: 'The sentence gives $x + 7 = 22$. Subtract $7$ from both sides, so $x = 15$.'
          - problem: 'Twice a number minus $5$ is $9$. Find the number.'
            answer: '7'
            answer_contract: {kind: exact}
            solution_sketch: 'The sentence gives $2x - 5 = 9$. Add $5$ to get $2x = 14$, so $x = 7$.'
          - problem: 'A number decreased by $9$ is $14$. Find the number.'
            answer: '23'
            answer_contract: {kind: exact}
            solution_sketch: 'The sentence gives $x - 9 = 14$. Add $9$ to both sides, so $x = 23$.'
          - problem: 'Three times a number plus $8$ is $35$. Find the number.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sentence gives $3x + 8 = 35$. Subtract $8$ to get $3x = 27$, so $x = 9$.'
          - problem: 'The quotient of a number and $4$ is $6$. Find the number.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sentence gives $x/4 = 6$. Multiply both sides by $4$, so $x = 24$.'
          - problem: 'Four more than half a number is $13$. Find the number.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sentence gives $x/2 + 4 = 13$. Subtract $4$ to get $x/2 = 9$, then multiply by $2$, so $x = 18$.'
        constraints: "define one variable; integer answer"
      - id: kp2
        name: "Write the equation without solving"
        key_prerequisites: [translating-phrases-to-expressions]
        step_check:
          step: 'The phrase "increased by 3"'
          question: 'Why is the left side $w/9+3$ and not $(w+3)/9$?'
          options:
            - '"Increased by $3$" acts on the quotient already formed'
            - 'Both mean the same thing'
            - 'Division always happens last'
          answer: '"Increased by $3$" acts on the quotient already formed'
          why: 'The sentence forms the quotient of $w$ and $9$ first, then increases that result; with $w=45$, $w/9+3=8$ but $(w+3)/9\approx5.33$.'
        exemplars:
          - problem: 'Write an equation for: $5$ more than $3$ times a number $n$ is $26$.'
            answer: '3*n + 5 = 26'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'Multiply $n$ by $3$, then add $5$. The word "is" sets this expression equal to $26$, giving $3n + 5 = 26$.'
          - problem: 'Write an equation for: the quotient of a number $y$ and $4$ is $12$.'
            answer: 'y/4 = 12'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'The number $y$ is the dividend and $4$ is the divisor. Set their quotient equal to $12$: $y/4 = 12$.'
          - problem: 'Write an equation for: $4$ times the sum of a number $x$ and $7$ is $44$.'
            answer: '4*(x + 7) = 44'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'First form the sum $x + 7$. Multiply the whole sum by $4$ and set the product equal to $44$: $4(x + 7) = 44$.'
          - problem: 'Write an equation for: $9$ less than the quotient of a number $x$ and $3$ is $2$.'
            answer: 'x/3 - 9 = 2'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'First divide $x$ by $3$. Subtract $9$ from that quotient and set the difference equal to $2$: $x/3 - 9 = 2$.'
          - problem: 'Write an equation for: the difference of $17$ and twice a number $x$ is $5$.'
            answer: '17 - 2*x = 5'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'Twice the number is $2x$. Subtract it from $17$, in the stated order, and set the difference equal to $5$: $17 - 2x = 5$.'
          - problem: 'Write an equation for: the difference of a number $x$ and $5$, divided by $7$, is $3$.'
            answer: '(x - 5)/7 = 3'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'First subtract $5$ from $x$. Divide the whole difference by $7$ and set the quotient equal to $3$: $(x - 5)/7 = 3$.'
        constraints: '"is" marks the equals sign; preserve grouping and operation order; do not simplify or solve'
    diagnostic_exemplar:
      problem: 'Seven less than twice a number is $11$. Find the number.'
      answer: "9"
      solution_sketch: '$2x - 7 = 11$; $2x = 18$; $x = 9$.'
    anki_seeds:
      - front: "In a word sentence, the word 'is' usually translates to..."
        back: "the equals sign"
        type: basic

  - id: consecutive-integer-problems
    name: "Number and Consecutive Integer Problems"
    # over-coverage: consecutive-integer context schema over
    # translating-sentences-to-equations + multi-step-equations
    core: false
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: translating-sentences-to-equations
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Multi-step number problems"
        key_prerequisites: [translating-sentences-to-equations, multi-step-equations]
        step_check:
          step: 'Combine like terms: $4x=52$'
          question: 'Why does $x+3x$ combine to $4x$?'
          options:
            - 'One $x$ plus three $x$''s is four $x$''s'
            - '$x+3x=3x^2$'
            - '$x+3x=4x^2$'
          answer: 'One $x$ plus three $x$''s is four $x$''s'
          why: 'Like terms add their coefficients, $1x+3x=4x$; adding never raises the power, and only multiplying $x\cdot3x$ gives $3x^2$.'
        exemplars:
          - problem: 'The sum of a number and twice the number is $24$. Find the number.'
            answer: "8"
            answer_contract: {kind: exact}
            solution_sketch: '$x + 2x = 24$; $3x = 24$; $x = 8$.'
          - problem: 'Seven less than three times a number is $20$. Find the number.'
            answer: "9"
            answer_contract: {kind: exact}
            solution_sketch: '$3x - 7 = 20$; $3x = 27$; $x = 9$.'
          - problem: 'Five less than four times a number is $23$. Find the number.'
            answer: "7"
            answer_contract: {kind: exact}
            solution_sketch: '$4x - 5 = 23$; $4x = 28$; $x = 7$.'
          - problem: 'The sum of a number and three times the number is $44$. Find the number.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sentence gives $x + 3x = 44$. Combine like terms to get $4x = 44$, so $x = 11$.'
        constraints: "one unknown; combine like terms or two steps; integer answer"
      - id: kp2
        name: "Consecutive integers and totals"
        key_prerequisites: [multi-step-equations]
        try_first:
          problem: 'Three consecutive integers add up to $48$. What is the smallest of them?'
          answer_contract: {"kind":"exact"}
          answer: '15'
          reveal: 'Call the smallest $x$; the others are $x+1$ and $x+2$, so $3x+3=48$ and $x=15$. One letter plus steps of one turns guessing into an equation.'
        step_check:
          step: 'Let the integers be $x,x+2,x+4$'
          question: 'Why are the odd integers written $x, x+2, x+4$?'
          options:
            - 'Consecutive odd integers are $2$ apart'
            - 'Odd steps keep a number odd, so use $x, x+1, x+3$'
            - 'Steps of $1$ work for every kind of consecutive integers'
          answer: 'Consecutive odd integers are $2$ apart'
          why: 'Between two odd numbers there is always one even number, so $19, 21, 23$ differ by $2$; steps of $1$ alternate odd and even.'
        exemplars:
          - problem: 'Two consecutive integers sum to $27$. Find them.'
            answer: '13, 14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call them $x$ and $x + 1$, so $2x + 1 = 27$. Then $x = 13$, and the integers are $13$ and $14$.'
          - problem: 'The sum of three consecutive integers is $42$. Find them.'
            answer: '13, 14, 15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call them $x$, $x + 1$, $x + 2$, so $3x + 3 = 42$. Then $x = 13$, and the integers are $13$, $14$ and $15$.'
          - problem: 'Two consecutive even integers sum to $46$. Find them.'
            answer: '22, 24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call them $x$ and $x + 2$, so $2x + 2 = 46$. Then $x = 22$, and the integers are $22$ and $24$.'
          - problem: 'Three consecutive odd integers have a sum of $33$. Find them.'
            answer: '9, 11, 13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the integers as $x$, $x + 2$, $x + 4$. Their sum gives $3x + 6 = 33$, so $x = 9$ and the integers are $9$, $11$ and $13$.'
          - problem: 'The sum of four consecutive integers is $74$. Find them.'
            answer: '17, 18, 19, 20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call them $x$, $x + 1$, $x + 2$, $x + 3$, so $4x + 6 = 74$. Then $x = 17$, and the integers are $17$, $18$, $19$ and $20$.'
          - problem: 'For two consecutive even integers, the smaller plus three times the larger is $62$. Find the integers.'
            answer: '14, 16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call them $x$ and $x + 2$, so $x + 3(x + 2) = 62$. Then $4x + 6 = 62$ gives $x = 14$, and the integers are $14$ and $16$.'
        constraints: "represent related quantities in terms of one variable"
    diagnostic_exemplar:
      problem: 'Three consecutive even integers sum to $48$. Find them.'
      answer_contract: {kind: list, ordered: false, member: {kind: exact}}
      answer: '14, 16, 18'
      solution_sketch: '$x + (x + 2) + (x + 4) = 48$; $3x + 6 = 48$; $x = 14$.'
    anki_seeds:
      - front: "Consecutive integers starting at x are written..."
        back: "x, x + 1, x + 2, ... (consecutive even or odd integers step by 2: x, x + 2, ...)"
        type: basic

