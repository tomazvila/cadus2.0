  - id: variables-both-sides
    name: "Equations with Variables on Both Sides"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: two-step-equations
        weight: 0.8
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Collect the variable on one side"
        key_prerequisites: [two-step-equations, combining-like-terms]
        exemplars:
          - problem: "Solve $5x + 3 = 2x + 18$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Subtract $2x$: $3x + 3 = 18$; $3x = 15$; $x = 5$."
          - problem: "The lines $y=4x-7$ and $y=x+5$ intersect at one point. Find its $x$-coordinate."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "At the intersection the outputs agree: $4x-7=x+5$. Thus $3x=12$ and $x=4$."
          - problem: "Two lengths are $2x+8$ and $5x-1$. They are equal. Find $x$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set $2x+8=5x-1$. Subtract $2x$ and add $1$: $9=3x$, so $x=3$."
          - problem: "A learner cancels all variable terms in $6x+2=4x+10$. Find the solution."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Subtracting $4x$ leaves $2x+2=10$; subtract $2$ and divide by $2$ to get $x=4$."
        constraints: "variable on both sides; integer solutions"
      - id: kp2
        name: "Negative coefficients and constants on both sides"
        key_prerequisites: [two-step-equations, combining-like-terms]
        exemplars:
          - problem: "Solve $2 - 5x = 2x + 16$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Add $5x$: $2 = 7x + 16$; $-14 = 7x$; $x = -2$."
          - problem: "Find the $x$-coordinate where the graphs $y=-2x-9$ and $y=-5x+3$ meet."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Equal outputs give $-2x-9=-5x+3$. Add $5x$, then add $9$: $3x=12$, so $x=4$."
          - problem: "Two signed changes $7-4x$ and $-x-8$ are equal. Find $x$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set $7-4x=-x-8$. Add $4x$: $7=3x-8$. Add $8$ and divide by $3$: $x=5$."
          - problem: "Correct the sign error in solving $-6x+1=-2x-11$ as $x=-3$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Add $6x$ to both sides: $1=4x-11$. Thus $12=4x$ and $x=3$."
        constraints: "move the smaller variable term to avoid negative coefficients; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $5 - 2x = 3x - 10$.'
      answer: '3'
      solution_sketch: '$5 + 10 = 3x + 2x$; $15 = 5x$; $x = 3$.'
    anki_seeds:
      - front: "First move when an equation has the variable on both sides:"
        back: "add or subtract a variable term to collect all variable terms on one side"
        type: basic

  - id: distribute-then-solve
