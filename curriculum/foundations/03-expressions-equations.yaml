  - id: equations-special-cases
    name: "Equations with No Solution or Infinitely Many"
    core: false                # classification leaf; the equation-solving rules stay core
    difficulty: 0.48
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: multi-step-equations
        weight: 0.7
        key: true
      - id: variables-both-sides
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Recognize no-solution equations"
        key_prerequisites: [variables-both-sides]
        try_first:
          problem: 'How many real numbers $x$ make $2x+1=2x+6$ true?'
          answer_contract: {"kind":"exact"}
          answer: '0'
          reveal: 'Subtracting $2x$ leaves $1=6$, which is false whatever $x$ is, so no number works. When the variable cancels, the leftover statement decides.'
        step_check:
          step: 'Subtract $4x$ from both sides: $12 = -7$'
          question: 'What does the false statement $12=-7$ tell you?'
          options:
            - 'No value of $x$ makes the equation true'
            - '$x=0$, because the $x$-terms are gone'
            - 'Every $x$ works, because the $x$-terms cancelled'
          answer: 'No value of $x$ makes the equation true'
          why: 'Once the $x$-terms cancel, the leftover statement decides: false means no solution, true (like $12=12$) means every number works.'
        exemplars:
          - problem: 'Solve $3x + 5 = 3x - 2$.'
            answer: 'no solution'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'Subtracting $3x$ from both sides leaves $5 = -2$, which is false. No value of $x$ works, so the equation has no solution.'
          - problem: 'For what value of $a$ does $ax + 2 = 6x - 1$ have no solution?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $a = 6$, subtracting $6x$ leaves $2 = -1$, which is false. Any other $a$ leaves an $x$-term, so there is exactly one solution.'
          - problem: 'For what value of $m$ does $mx - 3 = 2(4x + 1)$ have no solution?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right side expands to $8x + 2$. With $m = 8$ the $x$-terms cancel and leave $-3 = 2$, which is false.'
          - problem: 'Solve $2(x + 4) = 2x + 8$.'
            answer: 'all real numbers'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'The left side expands to $2x + 8$, the same as the right side. Every value of $x$ works, so the solution is all real numbers.'
          - problem: 'For what value of $b$ does $3(bx + 2) = 12x + 1$ have no solution?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left side expands to $3bx + 6$. With $b = 4$ it becomes $12x + 6 = 12x + 1$, which leaves $6 = 1$, false.'
          - problem: 'For what value of $a$ does $\frac{x}{2} + 3 = ax + 4$ have no solution?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $x$-terms cancel only when $a = 1/2$. Then the equation leaves $3 = 4$, which is false, so there is no solution.'
        constraints: "variable terms cancel leaving a false statement"
      - id: kp2
        name: "Recognize identities"
        key_prerequisites: [multi-step-equations]
        step_check:
          step: 'Both sides are identical'
          question: 'Why is the answer "all real numbers" and not $x=0$?'
          options:
            - 'The two sides agree for every $x$, so every number is a solution'
            - '$x$ disappears, so $x=0$'
            - 'The equation says nothing, so there is no solution'
          answer: 'The two sides agree for every $x$, so every number is a solution'
          why: '$5(x-2)$ and $5x-10$ are the same expression, so any value gives equal sides: with $x=7$ both are $25$.'
        exemplars:
          - problem: 'Solve $2(3x + 4) = 6x + 8$.'
            answer: 'all real numbers'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'The left side expands to $6x + 8$, identical to the right side. Every value of $x$ makes the sides equal, so the solution is all real numbers.'
          - problem: 'For what value of $c$ is every real number a solution of $4(x - 3) = 4x + c$?'
            answer: '-12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left side expands to $4x - 12$. The two sides are identical exactly when $c = -12$.'
          - problem: 'For what value of $k$ is every real number a solution of $5x + k = 5(x + 2)$?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right side expands to $5x + 10$. The two sides are identical exactly when $k = 10$.'
          - problem: 'Solve $4x - 2x + 7 = 2x + 9$.'
            answer: 'no solution'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'The left side simplifies to $2x + 7$. Subtracting $2x$ leaves $7 = 9$, which is false, so there is no solution.'
          - problem: 'For what value of $a$ does $ax + 6 = 3(2x + 2)$ have infinitely many solutions?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right side expands to $6x + 6$. With $a = 6$ the two sides are identical, so every real number is a solution.'
          - problem: 'For what value of $c$ is every real number a solution of $\frac{6x + c}{3} = 2x + 3$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply both sides by $3$: $6x + c = 6x + 9$. The sides are identical exactly when $c = 9$.'
        constraints: "variable terms cancel leaving a true statement"
      - id: kp3
        name: "Classify: one solution, none, or infinitely many"
        key_prerequisites: [multi-step-equations, variables-both-sides]
        step_check:
          step: 'Subtract five: $x=0$'
          question: 'The equation reduced to $x=0$. How many solutions does it have?'
          options:
            - 'One solution: the number $0$'
            - 'No solution, because $x$ equals nothing'
            - 'All real numbers, because the $5$s cancelled'
          answer: 'One solution: the number $0$'
          why: '$x=0$ names one value that works; "no solution" needs a false statement like $5=7$, and "all reals" needs a true one like $5=5$ with no $x$ left.'
        exemplars:
          - problem: 'Solve $7x + 6 = 4x + 6$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $6$ and then $4x$: $3x = 0$, so $x = 0$. Zero is one valid solution, which differs from having no solution.'
          - problem: 'Solve $4(2x + 3) = 8x + 15$.'
            answer: 'no solution'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'Expanding gives $8x + 12 = 8x + 15$. Subtracting $8x$ leaves $12 = 15$, which is false, so there is no solution.'
          - problem: 'Solve $9(x + 2) = 9x + 18$.'
            answer: 'all real numbers'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'Expanding gives $9x + 18$, identical to the right side. Every value of $x$ works, so the solution is all real numbers.'
          - problem: 'Plan A charges $12$ dollars plus $4$ dollars per gigabyte. Plan B charges $3$ dollars plus $7$ dollars per gigabyte. For how many gigabytes do the plans cost the same?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set the costs equal: $12 + 4g = 3 + 7g$. Subtract $4g$ and $3$ to get $9 = 3g$, so $g = 3$ gigabytes.'
          - problem: 'Solve $2(3x - 1) = 4x + 6$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expanding gives $6x - 2 = 4x + 6$. Subtract $4x$ and add $2$: $2x = 8$, so $x = 4$.'
          - problem: 'Solve $5x + 3 - 2x = 3(x + 1) + x$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left side is $3x + 3$ and the right side is $4x + 3$. Subtracting $3x + 3$ leaves $0 = x$, so the one solution is $x = 0$.'
        constraints: "mix all three outcomes; do not confuse x = 0 with no solution"
    diagnostic_exemplar:
      problem: 'Solve $3(2x - 1) = 6x + 5$.'
      answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
      answer: 'no solution'
      solution_sketch: '$6x - 3 = 6x + 5$ leaves $-3 = 5$, which is false.'
    anki_seeds:
      - front: "If solving an equation ends in a false statement like 8 = 5, the equation has..."
        back: "no solution"
        type: basic
      - front: "If solving an equation ends in a true statement like 7 = 7, the equation has..."
        back: "infinitely many solutions (every real number; it is an identity)"
        type: basic

