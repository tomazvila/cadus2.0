        weight: 0.6
        key: true
      - id: one-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Translate and solve one- and two-step sentences"
        key_prerequisites: [two-step-equations, translating-phrases-to-expressions]
        exemplars:
          - problem: 'A number increased by $7$ is $22$. Find the number.'
            answer: "15"
            answer_contract: {kind: exact}
            solution_sketch: '$x + 7 = 22$; $x = 15$.'
          - problem: 'Twice a number minus $5$ is $9$. Find the number.'
            answer: "7"
            answer_contract: {kind: exact}
            solution_sketch: '$2x - 5 = 9$; $2x = 14$; $x = 7$.'
          - problem: 'A number decreased by $9$ is $14$. Find the number.'
            answer: "23"
            answer_contract: {kind: exact}
            solution_sketch: '$x - 9 = 14$; $x = 23$.'
          - problem: 'Three times a number plus $8$ is $29$. Find the number.'
            answer: "7"
            answer_contract: {kind: exact}
            solution_sketch: '$3x + 8 = 29$; $3x = 21$; $x = 7$.'
        constraints: "define one variable; integer answer"
      - id: kp2
        name: "Write the equation without solving"
        key_prerequisites: [translating-phrases-to-expressions]
        exemplars:
          - problem: "Write an equation: $5$ more than $3$ times a number $n$ is $26$. Use * for multiplication and / for division. Preserve the stated operations; do not simplify or solve."
            answer: "3*n + 5 = 26"
            answer_contract: {"kind": "relation_setup"}
            solution_sketch: "Multiply $n$ by $3$, then add $5$. The word \"is\" sets this expression equal to $26$."
          - problem: "Write an equation: the quotient of a number $y$ and $4$ is $12$. Use * for multiplication and / for division. Preserve the stated operations; do not simplify or solve."
            answer: "y/4 = 12"
            answer_contract: {"kind": "relation_setup"}
            solution_sketch: "The number $y$ is the dividend and $4$ is the divisor. Set their quotient equal to $12$."
          - problem: "Write an equation: $4$ times the sum of a number $x$ and $7$ is $44$. Use * for multiplication and / for division. Preserve the stated operations; do not simplify or solve."
            answer: "4*(x + 7) = 44"
            answer_contract: {"kind": "relation_setup"}
            solution_sketch: "First form the sum $x + 7$. Multiply the whole sum by $4$ and set the product equal to $44$."
          - problem: "Write an equation: $9$ less than the quotient of a number $x$ and $3$ is $2$. Use * for multiplication and / for division. Preserve the stated operations; do not simplify or solve."
            answer: "x/3 - 9 = 2"
            answer_contract: {"kind": "relation_setup"}
            solution_sketch: "First divide $x$ by $3$. Subtract $9$ from that quotient and set the difference equal to $2$."
          - problem: "Write an equation: the difference of $17$ and $2$ times a number $x$ is $5$. Use * for multiplication and / for division. Preserve the stated operations; do not simplify or solve."
            answer: "17 - 2*x = 5"
            answer_contract: {"kind": "relation_setup"}
            solution_sketch: "Form the product $2*x$. Subtract this product from $17$, in the stated order, and set the difference equal to $5$."
          - problem: "Write an equation: the quotient of the difference of a number $x$ and $5$, and $7$, is $3$. Use * for multiplication and / for division. Preserve the stated operations; do not simplify or solve."
            answer: "(x - 5)/7 = 3"
            answer_contract: {"kind": "relation_setup"}
            solution_sketch: "First subtract $5$ from $x$. Divide the whole difference by $7$ and set the quotient equal to $3$."
        constraints: '"is" marks the equals sign; preserve grouping and operation order; do not simplify or solve'
    diagnostic_exemplar:
      problem: 'Seven less than twice a number is $11$. Find the number.'
      answer: "9"
      solution_sketch: '$2x - 7 = 11$; $2x = 18$; $x = 9$.'
    anki_seeds:
      - front: "In a word sentence, the word 'is' usually translates to..."
        back: "the equals sign"
        type: basic

