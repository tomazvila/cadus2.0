            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $2x$ from both sides: $3x + 3 = 18$. Subtract $3$: $3x = 15$. Divide by $3$: $x = 5$.'
          - problem: 'One gym charges $24$ dollars to join and $6$ dollars per visit. A second gym has no joining fee and charges $10$ dollars per visit. After how many visits do the two gyms cost the same?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set the costs equal: $6v + 24 = 10v$. Subtract $6v$: $24 = 4v$. Divide by $4$: $v = 6$ visits.'
          - problem: 'The lines $y = 7x - 3$ and $y = 3x + 9$ intersect at one point. What is its $x$-coordinate?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At the intersection the outputs are equal: $7x - 3 = 3x + 9$. Subtract $3x$ and add $3$: $4x = 12$, so $x = 3$.'
          - problem: 'The two equal sides of an isosceles triangle measure $2x + 8$ cm and $5x - 1$ cm. How long is each of these sides?'
            answer: '14'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The sides are equal, so $2x + 8 = 5x - 1$. This gives $9 = 3x$ and $x = 3$. Each side is $2(3) + 8 = 14$ cm.'
          - problem: 'Dev solves $6x + 2 = 4x + 10$ and writes $x = 8$. What is the correct value of $x$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $4x$ from both sides: $2x + 2 = 10$. Subtract $2$: $2x = 8$. Divide by $2$: $x = 4$.'
          - problem: 'A plant is $12$ cm tall and grows $3$ cm each week. A second plant is $30$ cm tall and grows $1$ cm each week. After how many weeks are the plants equally tall?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set the heights equal: $12 + 3w = 30 + w$. Subtract $w$ and $12$: $2w = 18$. Divide by $2$: $w = 9$ weeks.'
          - problem: 'Solve $7x - 5 = 4x + 16$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $4x$ and add $5$: $3x = 21$. Divide by $3$: $x = 7$.'
          - problem: 'Phone plan A costs $15$ dollars plus $2$ dollars per gigabyte. Plan B costs $3$ dollars plus $5$ dollars per gigabyte. For how many gigabytes do the plans cost the same?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set the costs equal: $15 + 2g = 3 + 5g$. Subtract $2g$ and $3$: $12 = 3g$. Divide by $3$: $g = 4$ gigabytes.'
        constraints: "variable on both sides; integer solutions"
      - id: kp2
        name: "Negative coefficients and constants on both sides"
        key_prerequisites: [two-step-equations, combining-like-terms]
        exemplars:
          - problem: 'Solve $2 - 5x = 2x + 16$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $5x$ to both sides: $2 = 7x + 16$. Subtract $16$: $-14 = 7x$. Divide by $7$: $x = -2$.'
          - problem: 'Find the $x$-coordinate where the graphs of $y = -2x - 9$ and $y = -5x + 3$ meet.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Equal outputs give $-2x - 9 = -5x + 3$. Add $5x$ and add $9$: $3x = 12$, so $x = 4$.'
          - problem: 'Tank A holds $80$ litres and loses $2$ litres each minute. Tank B holds $98$ litres and loses $5$ litres each minute. After how many minutes do the tanks hold the same amount?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            solution_sketch: 'Set the amounts equal: $80 - 2t = 98 - 5t$. Add $5t$ and subtract $80$: $3t = 18$. Divide by $3$: $t = 6$ minutes.'
          - problem: 'For which value of $x$ are $7 - 4x$ and $-x - 8$ equal?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $7 - 4x = -x - 8$. Add $4x$: $7 = 3x - 8$. Add $8$: $15 = 3x$, so $x = 5$.'
          - problem: 'Kim solves $-6x + 1 = -2x - 11$ and writes $x = -3$. What is the correct value of $x$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $6x$ to both sides: $1 = 4x - 11$. Add $11$: $12 = 4x$. Divide by $4$: $x = 3$.'
          - problem: 'A diver at a depth of $5$ m descends $3$ m each minute. A second diver at a depth of $21$ m rises $5$ m each minute. After how many minutes are they at the same depth?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            solution_sketch: 'Set the depths equal: $5 + 3t = 21 - 5t$. Add $5t$ and subtract $5$: $8t = 16$. Divide by $8$: $t = 2$ minutes.'
          - problem: 'Solve $-3x - 7 = 5x + 17$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $3x$ to both sides: $-7 = 8x + 17$. Subtract $17$: $-24 = 8x$. Divide by $8$: $x = -3$.'
          - problem: 'A hot drink is at $80$ °C and cools $6$ degrees each minute. A cold drink is at $10$ °C and warms $4$ degrees each minute. After how many minutes do the drinks have the same temperature?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set the temperatures equal: $80 - 6t = 10 + 4t$. Add $6t$ and subtract $10$: $70 = 10t$. Divide by $10$: $t = 7$ minutes.'
        constraints: "move the smaller variable term to avoid negative coefficients; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $5 - 2x = 3x - 10$.'
      answer: '3'
      solution_sketch: '$5 + 10 = 3x + 2x$; $15 = 5x$; $x = 3$.'
    anki_seeds:
      - front: "First move when an equation has the variable on both sides:"
        back: "add or subtract a variable term to collect all variable terms on one side"
        type: basic

  - id: distribute-then-solve
    name: "Solving Equations with Parentheses"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: distributive-property
        weight: 0.7
        key: true
      - id: two-step-equations
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Distribute, then solve the two-step equation"
        key_prerequisites: [distributive-property, two-step-equations]
        exemplars:
          - problem: 'Solve $3(x+4)=27$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute the $3$ to get $3x+12=27$. Subtract $12$ to get $3x=15$, then divide by $3$ to get $x=5$.'
          - problem: 'A rectangle is $7$ cm wide and has a perimeter of $38$ cm. Find its length.'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The perimeter is $2(x+7)=38$, where $x$ is the length. Distribute to get $2x+14=38$, so $2x=24$ and the length is $12$ cm.'
          - problem: 'Solve $6(x-3)=30$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute the $6$ to both terms: $6x-18=30$. Add $18$ to get $6x=48$, then divide by $6$ to get $x=8$.'
          - problem: 'Three friends each buy a ticket and a program that costs €4. Together they spend €45. How much does one ticket cost?'
            answer: '11'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Each friend pays $x+4$ euros, so $3(x+4)=45$. This gives $3x+12=45$ and $3x=33$, so one ticket costs €11.'
          - problem: 'Sam solves $5(x-2)=35$ by writing $5x-2=35$. What is the correct solution?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The $5$ must multiply both terms in the bracket, so $5(x-2)=5x-10$. Then $5x-10=35$ gives $5x=45$ and $x=9$.'
          - problem: 'Solve $4(2x+1)=60$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute the $4$ to get $8x+4=60$. Subtract $4$ to get $8x=56$, then divide by $8$ to get $x=7$.'
          - problem: 'Three identical boxes each hold $2x-1$ counters, and there are $15$ counters in all. Find $x$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The total is $3(2x-1)=15$, which distributes to $6x-3=15$. Add $3$ to get $6x=18$, then divide by $6$ to get $x=3$.'
        constraints: "one set of parentheses; positive multiplier; integer solutions"
      - id: kp2
        name: "Negative multipliers and extra constant terms"
        key_prerequisites: [distributive-property, two-step-equations]
        exemplars:
          - problem: 'Solve $-2(x-4)=10$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute $-2$ to get $-2x+8=10$. Subtract $8$ to get $-2x=2$, then divide by $-2$ to get $x=-1$.'
          - problem: 'Solve $-3(2x+1)+5=14$.'
            answer: '-2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute to get $-6x-3+5=14$, which combines to $-6x+2=14$. Then $-6x=12$ and $x=-2$.'
          - problem: 'A machine takes an input $x$ and gives the output $7-2(x+4)$. The output is $-9$. What was the input?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $7-2(x+4)=-9$ and distribute: $7-2x-8=-9$, so $-2x-1=-9$. Then $-2x=-8$ and the input was $x=4$.'
          - problem: 'A prepaid card holds €50. Four downloads that each cost €3 more than the standard fee leave €14 on the card. What is the standard fee?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'One download costs $x+3$ euros, so $50-4(x+3)=14$. This gives $50-4x-12=14$, so $-4x=-24$ and the fee is €6.'
          - problem: 'Sam solves $-(3x-5)-2=12$ and writes $-3x-7=12$. What is the correct solution?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leading minus changes both signs inside: $-3x+5-2=12$. This is $-3x+3=12$, so $-3x=9$ and $x=-3$.'
          - problem: 'Solve $10-4(x-3)=2$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute $-4$ to get $10-4x+12=2$, which combines to $22-4x=2$. Then $-4x=-20$ and $x=5$.'
          - problem: 'Solve $-5(3-x)=-20$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute $-5$ to get $-15+5x=-20$. Add $15$ to get $5x=-5$, so $x=-1$.'
        constraints: "watch signs when distributing a negative; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $-3(x - 2) = 18$.'
      answer: '-4'
      solution_sketch: '$-3x + 6 = 18$; $-3x = 12$; $x = -4$.'
    anki_seeds:
      - front: "When an equation contains parentheses, the usual first step is to..."
        back: "distribute to remove the parentheses, then solve as a multi-step equation"
        type: basic

  - id: multi-step-equations
    name: "Multi-Step Equations"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: variables-both-sides
        weight: 0.7
        key: true
      - id: distribute-then-solve
        weight: 0.7
        key: true
      - id: combining-like-terms
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: "Combine like terms before solving"
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Solve $3x+2x+4=24$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Combine $3x+2x$ into $5x$ to get $5x+4=24$. Subtract $4$ to get $5x=20$, then divide by $5$ to get $x=4$.'
          - problem: 'The function $f(x)=7x-3x-5$ has the output $15$. What is the input?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Combine the two $x$-terms to get $f(x)=4x-5$. Set $4x-5=15$, so $4x=20$ and the input is $x=5$.'
          - problem: 'The sides of a triangle are $x$, $2x+1$ and $3x-1$, and its perimeter is $42$. Find $x$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Adding the three sides gives $x+2x+1+3x-1=42$, which combines to $6x=42$. So $x=7$.'
          - problem: 'Sam solves $9+4x-6x=1$ and combines the $x$-terms to get $10x$. What is the correct solution?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coefficient of $x$ is $4-6=-2$, not $10$. So $9-2x=1$, which gives $-2x=-8$ and $x=4$.'
          - problem: 'A taxi charges a €4 pick-up fee, €2 per kilometre and a night surcharge of €1 per kilometre. A night ride costs €22. How long was the ride?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'Each kilometre costs $2+1=3$ euros, so $4+2k+k=22$ gives $3k+4=22$. Then $3k=18$ and the ride was $6$ km long.'
          - problem: 'The four sides of a field measure $x$, $x+3$, $2x$ and $x+5$ metres. The fence around it is $48$ m long. Find $x$.'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The fence is the sum of the sides: $x+x+3+2x+x+5=48$. This combines to $5x+8=48$, so $5x=40$ and $x=8$.'
          - problem: 'Solve $10-x+4x-3=22$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Combine $-x+4x$ into $3x$ and $10-3$ into $7$ to get $3x+7=22$. Then $3x=15$ and $x=5$.'
        constraints: "combine on one side; integer solutions"
      - id: kp2
        name: "Distribute and collect across both sides"
        key_prerequisites: [distribute-then-solve, variables-both-sides]
        exemplars:
          - problem: 'Solve $3(2x-1)=4x+9$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute to get $6x-3=4x+9$. Subtract $4x$ to get $2x-3=9$, add $3$ to get $2x=12$, then $x=6$.'
          - problem: 'Solve $5(x-2)=2(x+7)$.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute both sides: $5x-10=2x+14$. Subtract $2x$ and add $10$ to get $3x=24$, so $x=8$.'
          - problem: 'A rectangle of height $3$ and width $x+1$ has the same area as a rectangle of height $2$ and width $x+4$. Find $x$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The areas are equal, so $3(x+1)=2(x+4)$, which expands to $3x+3=2x+8$. Subtract $2x$ and $3$ to get $x=5$.'
          - problem: 'Lena buys $3$ shirts and gets €2 off each shirt. Tom buys $2$ of the same shirts at full price and a €4 cap. They pay the same amount. What does one shirt cost at full price?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Lena pays $3(x-2)$ and Tom pays $2x+4$. From $3x-6=2x+4$ we get $x=10$, so a shirt costs €10.'
          - problem: 'Sam says the solution of $2(x-3)=3-x$ is $2$. What is the correct solution?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand to get $2x-6=3-x$. Add $x$ and $6$ to both sides to get $3x=9$, so $x=3$. Check: both sides equal $0$.'
          - problem: 'Solve $4(x+1)-2=3(x-2)$.'
            answer: '-8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Distribute to get $4x+4-2=3x-6$, so $4x+2=3x-6$. Subtract $3x$ and $2$ to get $x=-8$.'
          - problem: 'A square with side $x+1$ cm has the same perimeter as an equilateral triangle with side $x+5$ cm. Find $x$.'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The square has perimeter $4(x+1)$ and the triangle has $3(x+5)$. From $4x+4=3x+15$ we get $x=11$; both perimeters are $48$ cm.'
        constraints: "parentheses on one or both sides; integer solutions"
      - id: kp3
        name: "Full pipeline: distribute, combine, collect, solve"
        key_prerequisites: [distribute-then-solve, variables-both-sides]
        exemplars:
          - problem: 'Solve $4x+6-x=2(x+5)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left side combines to $3x+6$ and the right side expands to $2x+10$. Subtract $2x$ and $6$ to get $x=4$.'
          - problem: 'Solve $2(3x-1)-x=3(x+2)+4$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand and combine: $6x-2-x=3x+6+4$, so $5x-2=3x+10$. Collect to get $2x=12$, hence $x=6$.'
          - problem: 'Solve $2(x+3)+2x=3(x+2)+\frac{x}{2}$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expand and combine to get $4x+6=\frac{7x}{2}+6$. Subtract $6$ and $\frac{7x}{2}$ to obtain $\frac{x}{2}=0$, hence $x=0$.'
          - problem: 'Sam expands $5-2(x-1)$ as $5-2x-2$ while solving $5-2(x-1)+3x=4(x+1)-3$. What is the correct solution?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The correct expansion is $5-2x+2$, so the left side is $x+7$ and the right side is $4x+1$. Then $6=3x$, so $x=2$.'
          - problem: 'A small box holds $x$ pencils and a large box holds $3$ more. Mia has $2$ large boxes and $4$ loose pencils. Leo has $3$ small boxes and $2$ loose pencils. They have the same number of pencils. How many pencils does a small box hold?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Mia has $2(x+3)+4$ pencils and Leo has $3x+2$. From $2x+10=3x+2$ we get $x=8$; each of them has $26$ pencils.'
          - problem: 'Solve $6-3(x-1)=2(x+4)-4x$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left side is $9-3x$ and the right side is $8-2x$. Add $3x$ and subtract $8$ to get $1=x$.'
          - problem: 'A rectangle with width $x-1$ cm and length $2x+4$ cm has the same perimeter as a square with side $x+3$ cm. Find $x$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The perimeters are equal, so $2(x-1)+2(2x+4)=4(x+3)$. This is $6x+6=4x+12$, so $2x=6$ and $x=3$.'
        constraints: "requires all three simplification moves; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $5x - 2(x - 3) = 2x + 11$.'
      answer: '5'
      solution_sketch: '$5x - 2x + 6 = 2x + 11$; $3x + 6 = 2x + 11$; $x = 5$.'
    anki_seeds:
      - front: "General strategy for a multi-step linear equation:"
        back: "distribute, combine like terms, collect the variable on one side, then solve the resulting two-step equation"
        type: basic

  - id: equations-special-cases
    name: "Equations with No Solution or Infinitely Many"
    core: false                # classification leaf; the equation-solving rules stay core
    difficulty: 0.48
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: multi-step-equations
        weight: 0.7
        key: true
      - id: variables-both-sides
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Recognize no-solution equations"
        key_prerequisites: [variables-both-sides]
        try_first:
          problem: 'How many real numbers $x$ make $2x+1=2x+6$ true?'
          answer_contract: {"kind":"exact"}
          answer: '0'
          reveal: 'Subtracting $2x$ leaves $1=6$, which is false whatever $x$ is, so no number works. When the variable cancels, the leftover statement decides.'
        exemplars:
          - problem: 'Solve $3x + 5 = 3x - 2$.'
            answer: 'no solution'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'Subtracting $3x$ from both sides leaves $5 = -2$, which is false. No value of $x$ works, so the equation has no solution.'
          - problem: 'For what value of $a$ does $ax + 2 = 6x - 1$ have no solution?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $a = 6$, subtracting $6x$ leaves $2 = -1$, which is false. Any other $a$ leaves an $x$-term, so there is exactly one solution.'
          - problem: 'For what value of $m$ does $mx - 3 = 2(4x + 1)$ have no solution?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right side expands to $8x + 2$. With $m = 8$ the $x$-terms cancel and leave $-3 = 2$, which is false.'
          - problem: 'Solve $2(x + 4) = 2x + 5$.'
            answer: "no real solution"
            answer_contract: {"kind":"label","options":[["no real solution","no solution","none","no solutions","there is no solution","no real solutions","no real number"],["all real numbers","every real number","infinitely many solutions","any real number"]]}
            solution_sketch: 'Expand the left side to get $2x + 8 = 2x + 5$. Subtracting $2x$ leaves $8 = 5$, which is false, so no value of $x$ works.'
          - problem: 'For what value of $b$ does $3(bx + 2) = 12x + 1$ have no solution?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left side expands to $3bx + 6$. With $b = 4$ it becomes $12x + 6 = 12x + 1$, which leaves $6 = 1$, false.'
          - problem: 'For what value of $a$ does $\frac{x}{2} + 3 = ax + 4$ have no solution?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $x$-terms cancel only when $a = 1/2$. Then the equation leaves $3 = 4$, which is false, so there is no solution.'
        constraints: "variable terms cancel leaving a false statement"
      - id: kp2
        name: "Recognize identities"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Solve $2(3x + 4) = 6x + 8$.'
            answer: 'all real numbers'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'The left side expands to $6x + 8$, identical to the right side. Every value of $x$ makes the sides equal, so the solution is all real numbers.'
          - problem: 'For what value of $c$ is every real number a solution of $4(x - 3) = 4x + c$?'
            answer: '-12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left side expands to $4x - 12$. The two sides are identical exactly when $c = -12$.'
          - problem: 'For what value of $k$ is every real number a solution of $5x + k = 5(x + 2)$?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right side expands to $5x + 10$. The two sides are identical exactly when $k = 10$.'
          - problem: 'Solve $4x - 2x + 7 = 2x + 7$.'
            answer: "every real number"
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution"],["every real number","all real numbers","infinitely many solutions","any real number","all real x","all reals"]]}
            solution_sketch: 'The left side simplifies to $2x + 7$, the same as the right side. Subtracting $2x$ leaves $7 = 7$, which is always true, so every real number is a solution.'
          - problem: 'For what value of $a$ does $ax + 6 = 3(2x + 2)$ have infinitely many solutions?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right side expands to $6x + 6$. With $a = 6$ the two sides are identical, so every real number is a solution.'
          - problem: 'For what value of $c$ is every real number a solution of $\frac{6x + c}{3} = 2x + 3$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply both sides by $3$: $6x + c = 6x + 9$. The sides are identical exactly when $c = 9$.'
        constraints: "variable terms cancel leaving a true statement"
      - id: kp3
        name: "Classify: one solution, none, or infinitely many"
        key_prerequisites: [multi-step-equations, variables-both-sides]
        exemplars:
          - problem: 'Solve $7x + 6 = 4x + 6$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $6$ and then $4x$: $3x = 0$, so $x = 0$. Zero is one valid solution, which differs from having no solution.'
          - problem: 'Solve $4(2x + 3) = 8x + 15$.'
            answer: 'no solution'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'Expanding gives $8x + 12 = 8x + 15$. Subtracting $8x$ leaves $12 = 15$, which is false, so there is no solution.'
          - problem: 'Solve $9(x + 2) = 9x + 18$.'
            answer: 'all real numbers'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'Expanding gives $9x + 18$, identical to the right side. Every value of $x$ works, so the solution is all real numbers.'
          - problem: 'Plan A charges $12$ dollars plus $4$ dollars per gigabyte. Plan B charges $3$ dollars plus $7$ dollars per gigabyte. For how many gigabytes do the plans cost the same?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set the costs equal: $12 + 4g = 3 + 7g$. Subtract $4g$ and $3$ to get $9 = 3g$, so $g = 3$ gigabytes.'
          - problem: 'Solve $2(3x - 1) = 4x + 6$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expanding gives $6x - 2 = 4x + 6$. Subtract $4x$ and add $2$: $2x = 8$, so $x = 4$.'
          - problem: 'Solve $5x + 3 - 2x = 3(x + 1) + x$.'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left side is $3x + 3$ and the right side is $4x + 3$. Subtracting $3x + 3$ leaves $0 = x$, so the one solution is $x = 0$.'
        constraints: "mix all three outcomes; do not confuse x = 0 with no solution"
    diagnostic_exemplar:
      problem: 'Solve $3(2x - 1) = 6x + 5$.'
      answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
      answer: 'no solution'
      solution_sketch: '$6x - 3 = 6x + 5$ leaves $-3 = 5$, which is false.'
    anki_seeds:
      - front: "If solving an equation ends in a false statement like 8 = 5, the equation has..."
        back: "no solution"
        type: basic
      - front: "If solving an equation ends in a true statement like 7 = 7, the equation has..."
        back: "infinitely many solutions (every real number; it is an identity)"
        type: basic

  - id: equations-with-decimals
    name: "Equations with Decimals"
    core: false                # format-specific drill; multi-step-equations stays core
    difficulty: 0.48
    drill: false
    answer_kind: numeric
    expected_time_secs: 100
    prerequisites:
      - id: multi-step-equations
        weight: 0.6
        key: true
      - id: decimal-operations
        weight: 0.5
        key: true
      - id: signed-decimal-operations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Solve directly with decimal arithmetic"
        key_prerequisites: [decimal-operations, multi-step-equations]
        exemplars:
          - problem: "Solve $0.5x + 1.2 = 3.2$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $1.2$ from both sides: $0.5x=2$. Divide by $0.5$ to get $x=4$, and $0.5(4)+1.2=3.2$ checks it.'
          - problem: "Solve $2.4x = -7.2$."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide both sides by $2.4$. Since $72/24=3$ and the signs differ, $x=-3$.'
          - problem: 'A phone plan charges $1.50$ euros per gigabyte plus a fixed fee of $0.50$ euros. One month costs $8.00$ euros. How many gigabytes were used?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $x$ gigabytes, $1.5x+0.5=8$. Subtract $0.5$ to get $1.5x=7.5$, and divide to get $x=5$.'
          - problem: 'Solve $1.2 - 0.4x = 2.8$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $1.2$ from both sides: $-0.4x=1.6$. Divide by $-0.4$ to get $x=-4$; dividing by a negative gives a negative result.'
          - problem: 'Solve $0.6x + 2.3 = -1.3$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $2.3$ from both sides: $0.6x=-3.6$. Divide by $0.6$ to get $x=-6$.'
          - problem: 'Solve $7 = 2.5x - 0.5$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $0.5$ to both sides: $7.5=2.5x$. Divide by $2.5$ to get $x=3$.'
        constraints: "one decimal place; integer solutions"
      - id: kp2
        name: "Clear decimals by multiplying by a power of 10"
        key_prerequisites: [decimal-operations, multi-step-equations]
        exemplars:
          - problem: "Solve $0.3x - 1.5 = 0.6$."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply every term by $10$: $3x-15=6$. Then $3x=21$ and $x=7$.'
          - problem: "Solve $0.25x+0.50=1.75$ by clearing decimals."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply every term by $100$: $25x+50=175$. Then $25x=125$ and $x=5$."
          - problem: "Clear decimals on both sides to solve $0.4x+0.2=0.1x+2.0$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply every term by $10$: $4x+2=x+20$. Collect to get $3x=18$, hence $x=6$."
          - problem: 'Solve $0.06x - 0.12 = 0.42$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply every term by $100$: $6x-12=42$. Add $12$ and divide by $6$ to get $x=9$.'
          - problem: 'Solve $0.2(x - 3) = 1.4$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply both sides by $10$: $2(x-3)=14$. Divide by $2$ to get $x-3=7$, so $x=10$.'
          - problem: 'Solve $1.5x - 0.75 = 0.5x + 2.25$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply every term by $100$: $150x-75=50x+225$. Collect terms to get $100x=300$, so $x=3$.'
        constraints: "multiply EVERY term by 10 or 100; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $0.25x - 0.75 = 1.5$.'
      answer: '9'
      solution_sketch: 'Multiply every term by $100$: $25x - 75 = 150$; $25x = 225$; $x = 9$.'
    anki_seeds:
      - front: "To clear decimals from an equation, multiply every term by..."
        back: "the power of 10 that makes all coefficients whole numbers"
        type: basic

  - id: equations-with-fractions
    name: "Equations with Fractions"
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: multi-step-equations
        weight: 0.7
        key: true
      - id: adding-subtracting-fractions
        weight: 0.7
        key: true
      - id: multiplying-fractions
        weight: 0.6
      - id: dividing-fractions
        weight: 0.4
      - id: gcf-lcm
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Isolate a single fractional term"
        key_prerequisites: [multiplying-fractions]
        exemplars:
          - problem: "Solve $\\frac{x}{2} + 3 = 7$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$\\frac{x}{2} = 4$; $x = 8$."
          - problem: "Solve $\\frac{2}{3}x = 8$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply by $\\frac{3}{2}$: $x = 12$."
          - problem: "Solve $5-x/4=8$."
            answer: "-12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Subtract $5$: $-x/4=3$. Multiply by $-4$: $x=-12$."
          - problem: "One third of the difference between $x$ and $2$ is $5$. Find $x$."
            answer: "17"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$(x-2)/3=5$. Multiply by $3$: $x-2=15$. Add $2$: $x=17$."
        constraints: "one fractional term; integer solution"
      - id: kp2
        name: "Clear denominators with the LCD"
        key_prerequisites: [adding-subtracting-fractions]
        try_first:
          problem: 'Solve $\frac{x}{2} + \frac{x}{3} = 10$.'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'Multiplying every term by $6$ gives $3x+2x=60$, so $x=12$. One multiplication by a common denominator removes all the fractions at once.'
        exemplars:
          - problem: "Solve $\\frac{x}{3} + \\frac{x}{6} = 5$."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply by $6$: $2x + x = 30$; $3x = 30$; $x = 10$."
          - problem: "Solve $\\frac{x + 1}{2} = \\frac{x - 1}{3}$."
            answer: "-5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3(x + 1) = 2(x - 1)$; $3x + 3 = 2x - 2$; $x = -5$."
          - problem: "Solve $x/4+1/2=x/6+1$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply every term by LCD $12$: $3x+6=2x+12$. Collecting gives $x=6$."
          - problem: "A learner clears denominators in $x/2-x/3=4$ but leaves $4$ unchanged. Solve correctly."
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply every term by $6$: $3x-2x=24$. The left side is $x$, so $x=24$."
        constraints: "multiply EVERY term by the LCD; integer solution"
      - id: kp3
        name: "Fractions combined with distribution"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: "Solve $\\frac{2}{3}(x - 6) = 4$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Distributing produces variable term $2x/3$ and constant $-4$. Move that constant to the other side: $2x/3=8$, hence $x=12$. Check: the inner difference is $6$, and two thirds of it is $4$."
          - problem: "Solve $(x+4)/2+(x-2)/3=8$ and check."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply by $6$: $3(x+4)+2(x-2)=48$. Expand to $5x+8=48$, giving $x=8$. Check: the two quotients are $6$ and $2$, whose sum is $8$."
          - problem: "Solve $3(x-2)/4=(x+6)/2$ and check."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply by $4$: $3x-6=2x+12$, hence $x=18$. Check: $3(18-2)/4=12$ and $(18+6)/2=12$."
          - problem: 'Solve $\frac{x-3}{2}-\frac{x+1}{4}=1$ and check.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply every term by $4$: $2(x-3)-(x+1)=4$. Expand: $x-7=4$, so $x=11$. Check: the first quotient is $4$, the second $3$, and their difference is $1$.'
          - problem: 'Solve $\frac{3}{4}(x + 8) = 9$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply both sides by $\frac{4}{3}$: $x+8=12$. Subtract $8$ to get $x=4$; check: $\frac34\cdot12=9$.'
          - problem: 'Solve $\frac{2}{3}(x + 1) - \frac{x}{2} = 3$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply every term by $6$: $4(x+1)-3x=18$. Expand: $4x+4-3x=18$, so $x+4=18$ and $x=14$.'
        constraints: "integer solutions; check by substituting back"
    diagnostic_exemplar:
      problem: 'Solve $\frac{2}{3}(x - 3) = \frac{x}{2}$.'
      answer: '12'
      solution_sketch: 'Multiply by the LCD $6$: $4(x - 3) = 3x$; $4x - 12 = 3x$; $x = 12$.'
    anki_seeds:
      - front: "First step to solve an equation containing fractions:"
        back: "multiply every term on both sides by the least common denominator (LCD) to clear the fractions"
        type: basic

  - id: rearranging-formulas
    name: "Rearranging Simple Formulas"
    core: true
    difficulty: 0.44
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: two-step-equations
        weight: 0.7
        key: true
      - id: evaluating-formulas
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "One-step rearrangements"
        key_prerequisites: [two-step-equations, evaluating-formulas]
        try_first:
          problem: 'A rectangle has area $A=bh$. If $A=35$ and $b=7$, what is $h$?'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'You divided the area by the base, and the same move works with letters: dividing both sides of $A=bh$ by $b$ gives $h=A/b$. Rearranging a formula uses the steps of solving an equation.'
        exemplars:
          - problem: 'Solve $y=x+b$ for $x$.'
            answer: 'x = y - b'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $b$ from both sides to get $y-b=x$. So $x=y-b$, and substituting back gives $(y-b)+b=y$.'
          - problem: 'Solve $d=rt$ for $t$. Assume $r\ne0$.'
            answer: 't = d/r'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide both sides by $r$, which is allowed because $r\ne0$. This gives $t=d/r$, and $r(d/r)=d$ checks it.'
          - problem: 'The perimeter of a square with side $s$ is $P=4s$. Solve this formula for $s$.'
            answer: 's = P/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The side $s$ is multiplied by $4$, so divide both sides by $4$. This gives $s=P/4$; a square with perimeter $20$ has side $5$.'
          - problem: 'Solve $p=q-r$ for $q$.'
            answer: 'q = p + r'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Add $r$ to both sides to undo the subtraction. This gives $q=p+r$, and $(p+r)-r=p$ checks it.'
          - problem: 'Speed is $v=\frac{d}{t}$, where $d$ is the distance and $t$ the time. Solve for $d$.'
            answer: 'd = vt'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $d$ is divided by $t$, so multiply both sides by $t$. This gives $d=vt$: speed times time is distance.'
          - problem: '$n$ pens at the price $p$ each cost $C=np$ in total. Solve for $n$. Assume $p\ne0$.'
            answer: 'n = C/p'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The count $n$ is multiplied by the price $p$, so divide both sides by $p$. This gives $n=C/p$: the total cost divided by the price is the number of pens.'
          - problem: 'Solve $A=bh$ for $h$. Assume $b\ne0$.'
            answer: 'h = A/b'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide both sides by $b$, which is allowed because $b\ne0$. This gives $h=A/b$, and $b(A/b)=A$ checks it.'
          - problem: 'The average price of an item is $a=\frac{c}{n}$, where $c$ is the total cost of $n$ items. Solve for $c$.'
            answer: 'c = an'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $c$ is divided by $n$, so multiply both sides by $n$. This gives $c=an$: average price times the count is total cost.'
        constraints: "one inverse operation; target variable appears once"
      - id: kp2
        name: "Two-step rearrangements"
        key_prerequisites: [two-step-equations, evaluating-formulas]
        exemplars:
          - problem: 'Solve $P=2l+2w$ for $l$.'
            answer: 'l = (P - 2w)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $2w$ from both sides: $P-2w=2l$. Divide by $2$ to get $l=(P-2w)/2$, which also equals $P/2-w$.'
          - problem: 'The circumference of a circle with radius $r$ is $C=2\pi r$. Solve for $r$.'
            answer: 'r = C/(2*pi)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The radius is multiplied by $2$ and by $\pi$, so divide both sides by $2\pi$. This gives $r=C/(2\pi)$.'
          - problem: 'Solve $y=mx+b$ for $x$. Assume $m\ne0$.'
            answer: 'x = (y - b)/m'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $b$ from both sides: $y-b=mx$. Divide by $m$, which is allowed because $m\ne0$, to get $x=(y-b)/m$.'
          - problem: 'A plumber charges a call-out fee $f$ plus $r$ per hour, so a job of $h$ hours costs $T=f+rh$. Solve for $h$. Assume $r\ne0$.'
            answer: 'h = (T - f)/r'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract the fee $f$ from both sides to get $T-f=rh$. Divide by $r$, which is allowed because $r\ne0$, to get $h=(T-f)/r$.'
          - problem: 'The area of a triangle is $A=\frac{1}{2}bh$. Solve for $h$. Assume $b\ne0$.'
            answer: 'h = 2A/b'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply both sides by $2$ to clear the half: $2A=bh$. Divide by $b$ to get $h=2A/b$.'
          - problem: 'The Fahrenheit temperature is $F=\frac{9}{5}C+32$, where $C$ is the Celsius temperature. Solve for $C$.'
            answer: 'C = 5(F - 32)/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $32$ from both sides: $F-32=\frac{9}{5}C$. Multiply by $\frac{5}{9}$ to get $C=5(F-32)/9$.'
          - problem: 'Solve $V=lwh$ for $l$. Assume $wh\ne0$.'
            answer: 'l = V/(wh)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $l$ is multiplied by $w$ and by $h$, so divide both sides by $wh$. This gives $l=V/(wh)$, because $wh\ne0$.'
        constraints: "two inverse operations; target variable appears once"
    diagnostic_exemplar:
      problem: 'Solve $v = u + at$ for $t$.'
      answer: "t = (v - u)/a"
      solution_sketch: 'Subtract $u$, then divide by $a$.'
    anki_seeds:
      - front: "Rearranging a formula uses the same moves as solving an equation, except..."
        back: "the other quantities stay as letters; apply inverse operations to isolate the target variable"
        type: basic

  - id: literal-equations
    name: "Literal Equations and Formulas"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 110
    prerequisites:
      - id: rearranging-formulas
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.6
        key: true
      - id: distributive-property
        weight: 0.3
      - id: dividing-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Multi-term formulas"
        key_prerequisites: [multi-step-equations, rearranging-formulas]
        exemplars:
          - problem: 'Solve $px+q=r$ for $x$. Assume $p\ne0$.'
            answer: 'x = (r - q)/p'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $q$ from both sides to get $px=r-q$. Divide by $p$, which is allowed because $p\ne0$, to get $x=(r-q)/p$.'
          - problem: 'The volume of a pyramid is $V=\frac{1}{3}Bh$, where $B$ is the area of the base. Solve for $B$. Assume $h\ne0$.'
            answer: 'B = 3V/h'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply both sides by $3$ to get $3V=Bh$. Divide by $h$, which is allowed because $h\ne0$, to get $B=3V/h$.'
          - problem: 'The perimeter of a triangle with sides $a$, $b$ and $c$ is $P=a+b+c$. Solve for $c$.'
            answer: 'c = P - a - b'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $a$ and $b$ from both sides. This gives $c=P-a-b$; for example, $P=12$, $a=3$ and $b=4$ give $c=5$.'
          - problem: 'A car rental costs $C=f+rd$ for $d$ days, with a fixed fee $f$ and a daily rate $r$. Solve for $r$. Assume $d\ne0$.'
            answer: 'r = (C - f)/d'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract the fee $f$ from both sides to get $C-f=rd$. Divide by $d$, which is allowed because $d\ne0$, to get $r=(C-f)/d$.'
          - problem: 'Sam solves $ax+b=c$ for $x$ and writes $x=c-\frac{b}{a}$. What is the correct formula? Assume $a\ne0$.'
            answer: 'x = (c - b)/a'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $b$ from both sides first, then divide the whole result $c-b$ by $a$. This gives $x=(c-b)/a$; Sam divided only $b$ by $a$.'
          - problem: 'The kinetic energy of a moving object is $K=\frac{1}{2}mv^2$. Solve for $m$. Assume $v\ne0$.'
            answer: 'm = 2K/v^2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply both sides by $2$ to get $2K=mv^2$. Divide by $v^2$, which is allowed because $v\ne0$, to get $m=2K/v^2$.'
          - problem: 'The simple interest on a deposit $p$ at the yearly rate $r$ after $t$ years is $i=prt$. Solve for $t$. Assume $pr\ne0$.'
            answer: 't = i/(pr)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The time $t$ is multiplied by $p$ and by $r$, so divide both sides by $pr$. This gives $t=i/(pr)$, because $pr\ne0$.'
        constraints: "target variable appears once; keep other letters symbolic"
      - id: kp2
        name: "Target variable in more than one term"
        key_prerequisites: [distributive-property]
        try_first:
          problem: 'If $2x+3x=20$, what is $x$?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'You combined $2x+3x$ into $5x$ and then divided by $5$. With letters, $ax+bx$ combines into $(a+b)x$ in the same way, and one division by $a+b$ solves for $x$.'
        exemplars:
          - problem: 'Solve $ax+bx=c$ for $x$. Assume $a+b\ne0$.'
            answer: 'x = c/(a + b)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor out $x$: $x(a+b)=c$. Divide by $a+b$, which is allowed because $a+b\ne0$, to get $x=c/(a+b)$.'
          - problem: 'Solve $x=\frac{y-3}{2}$ for $y$.'
            answer: 'y = 2x + 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply both sides by $2$ to get $2x=y-3$. Add $3$ to both sides to get $y=2x+3$.'
          - problem: 'Solve $mx-nx=k$ for $x$. Assume $m-n\ne0$.'
            answer: 'x = k/(m - n)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor out $x$: $x(m-n)=k$. Divide by $m-n$, which is allowed because $m-n\ne0$, to get $x=k/(m-n)$.'
          - problem: 'A shop sells pens at the price $p$ and pencils at the price $q$. The total cost of $n$ pens and $n$ pencils is $C=np+nq$. Solve for $n$. Assume $p+q\ne0$.'
            answer: 'n = C/(p + q)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor out $n$: $C=n(p+q)$. Divide by $p+q$, which is allowed because $p+q\ne0$, to get $n=C/(p+q)$.'
          - problem: 'Two cyclists leave the same point and ride in opposite directions at the speeds $u$ and $v$. After the time $t$ they are $d=ut+vt$ apart. Solve for $t$. Assume $u+v\ne0$.'
            answer: 't = d/(u + v)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor out $t$: $d=t(u+v)$. Divide by $u+v$, which is allowed because $u+v\ne0$, to get $t=d/(u+v)$.'
          - problem: 'Solve $y=\frac{x+5}{3}$ for $x$.'
            answer: 'x = 3y - 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply both sides by $3$ to get $3y=x+5$. Subtract $5$ from both sides to get $x=3y-5$.'
          - problem: 'Solve $ax+b=cx+d$ for $x$. Assume $a-c\ne0$.'
            answer: 'x = (d - b)/(a - c)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Collect the $x$-terms on the left and the other terms on the right: $ax-cx=d-b$. Factor to get $x(a-c)=d-b$, then divide by $a-c$.'
        constraints: "may require factoring out the target variable"
      - id: kp3
        name: "Formulas requiring distribution or clearing a fraction"
        key_prerequisites: [distributive-property, rearranging-formulas]
        exemplars:
          - problem: 'Solve $S=2(l+w)$ for $w$.'
            answer: 'w = S/2 - l'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide both sides by $2$ to get $\frac{S}{2}=l+w$. Subtract $l$ from both sides to get $w=S/2-l$.'
          - problem: 'The area of a trapezoid with parallel sides $a$ and $b$ and height $h$ is $A=\frac{1}{2}h(a+b)$. Solve for $a$. Assume $h\ne0$.'
            answer: 'a = 2A/h - b'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply by $2$ to get $2A=h(a+b)$. Divide by $h$, which is allowed because $h\ne0$, then subtract $b$ to get $a=2A/h-b$.'
          - problem: 'Solve $y-k=m(x-h)$ for $x$. Assume $m\ne0$.'
            answer: 'x = (y - k)/m + h'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide both sides by $m$, which is allowed because $m\ne0$, to get $\frac{y-k}{m}=x-h$. Add $h$ to get $x=(y-k)/m+h$.'
          - problem: 'A savings account with the deposit $p$ grows to $A=p(1+rt)$ after the time $t$ at the rate $r$. Solve for $r$. Assume $pt\ne0$.'
            answer: 'r = (A - p)/(pt)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide by $p$ to get $\frac{A}{p}=1+rt$, then subtract $1$ to get $\frac{A}{p}-1=rt$. Divide by $t$ to get $r=(A-p)/(pt)$.'
          - problem: 'Sam solves $T=\frac{1}{2}k(m+n)$ for $m$ and writes $m=\frac{2T}{k}+n$. What is the correct formula? Assume $k\ne0$.'
            answer: 'm = 2T/k - n'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply by $2$ and divide by $k$ to get $\frac{2T}{k}=m+n$. Then subtract $n$, not add it, to get $m=2T/k-n$.'
          - problem: 'The sum of the first $n$ terms of a sequence is $S=\frac{n}{2}(a+l)$, where $a$ is the first term and $l$ the last. Solve for $l$. Assume $n\ne0$.'
            answer: 'l = 2S/n - a'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply by $2$ to get $2S=n(a+l)$. Divide by $n$, which is allowed because $n\ne0$, then subtract $a$ to get $l=2S/n-a$.'
          - problem: 'The Celsius temperature is $C=\frac{5}{9}(F-32)$. Solve for $F$.'
            answer: 'F = 9C/5 + 32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply both sides by $\frac{9}{5}$ to get $\frac{9C}{5}=F-32$. Add $32$ to get $F=9C/5+32$.'
        constraints: "undo an outer factor before reaching the target variable"
    diagnostic_exemplar:
      problem: 'Solve $ax - bx = c$ for $x$.'
      answer: 'x = c/(a - b)'
      solution_sketch: 'Factor the left side: $x(a - b) = c$, then divide by $a - b$.'
    anki_seeds:
      - front: "To solve a literal equation for a variable that appears in two terms, first ..."
        back: "factor that variable out of both terms, then divide"
        type: basic

  - id: basic-absolute-value-equations
    name: "Basic Absolute Value Equations"
    core: false                # head of the terminal absolute-value solving branch
    difficulty: 0.42
    drill: false
    answer_kind: multi-step
    expected_time_secs: 75
    prerequisites:
      - id: absolute-value
        weight: 0.7
        key: true
      - id: one-step-equations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: "Solve |x| = a"
        key_prerequisites: [absolute-value]
        try_first:
          problem: 'A buoy floats on a straight shoreline marked in metres, with the lighthouse at $0$. The buoy is exactly $23$ m from the lighthouse. Give the set of all positions where it could be.'
          answer_contract: {"kind":"exact"}
          answer: '{-23,23}'
          reveal: 'Distance ignores direction, so there are two positions, one on each side: $-23$ and $23$. That is exactly what $|x|=23$ asks for.'
        exemplars:
          - problem: 'Solve $|x| = 7$.'
            answer: '-7, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Absolute value measures distance from zero. The two numbers at distance $7$ are $x = -7$ and $x = 7$.'
          - problem: 'Which numbers on the number line are exactly $4$ units from $0$?'
            answer: '-4, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There is one such number on each side of zero. Moving left $4$ gives $-4$ and moving right $4$ gives $4$.'
          - problem: 'A student solves $|x| = 9$ and writes only $x = 9$. Solve the equation completely.'
            answer: '-9, 9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A number and its negative have the same absolute value, and $|-9| = 9$ as well. The solutions are $x = -9$ and $x = 9$.'
          - problem: 'At which $x$-coordinates does the graph of $y = |x|$ meet the line $y = 5$?'
            answer: '-5, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graphs meet where $|x| = 5$. The two points are equally far from zero, at $x = -5$ and $x = 5$.'
          - problem: 'Solve $|x| = 2.5$.'
            answer: '-2.5, 2.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both $2.5$ and $-2.5$ are $2.5$ units from zero. The solutions are $x = -2.5$ and $x = 2.5$.'
          - problem: 'Solve $|y| = \frac{3}{4}$.'
            answer: '-3/4, 3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numbers $\frac{3}{4}$ units from zero lie on both sides of zero. The solutions are $y = -\frac{3}{4}$ and $y = \frac{3}{4}$.'
        constraints: "right side positive; two solutions"
      - id: kp2
        name: "Solve |x + b| = c with a one-step inside"
        key_prerequisites: [one-step-equations, absolute-value]
        exemplars:
          - problem: 'Solve $|x - 3| = 5$.'
            answer: '-2, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inside is $5$ or $-5$. From $x - 3 = 5$ we get $x = 8$, and from $x - 3 = -5$ we get $x = -2$.'
          - problem: 'At which $x$-coordinates does the graph of $y = |x + 4|$ meet the line $y = 2$?'
            answer: '-6, -2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graphs meet where $x + 4 = 2$ or $x + 4 = -2$. These give $x = -2$ and $x = -6$.'
          - problem: 'Which numbers on the number line are exactly $6$ units from $2$?'
            answer: '-4, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The distance from $x$ to $2$ is $|x - 2|$, so solve $|x - 2| = 6$. Then $x - 2 = 6$ gives $8$ and $x - 2 = -6$ gives $-4$.'
          - problem: 'A student solves $|x + 2| = 5$ and finds only $x = 3$. Solve the equation completely.'
            answer: '-7, 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The positive case $x + 2 = 5$ gives $x = 3$. The missed case $x + 2 = -5$ gives $x = -7$.'
          - problem: 'Solve $|x - 2| = 5$.'
            answer: '-3, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inside is $5$ or $-5$. From $x - 2 = 5$ we get $x = 7$, and from $x - 2 = -5$ we get $x = -3$.'
          - problem: 'Solve $|x + 6| = 1$.'
            answer: '-7, -5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inside is $1$ or $-1$. From $x + 6 = 1$ we get $x = -5$, and from $x + 6 = -1$ we get $x = -7$.'
        constraints: "split into two one-step equations; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $|x - 4| = 6$.'
      answer: "x = 10 or x = -2"
      solution_sketch: '$x - 4 = 6 \to x = 10$; $x - 4 = -6 \to x = -2$.'
    anki_seeds:
      - front: "If |X| = a with a > 0, then X = ?"
        back: "X = a or X = -a"
        type: basic

  - id: absolute-value-equations
    name: "Absolute Value Equations"
    core: false                # terminal absolute-value solving branch
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: basic-absolute-value-equations
        weight: 0.7
        key: true
      - id: two-step-equations
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Absolute value of a linear expression"
        key_prerequisites: [two-step-equations, basic-absolute-value-equations]
        exemplars:
          - problem: 'Solve $|2x + 1| = 9$.'
            answer: '-5, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inside is $9$ or $-9$. From $2x + 1 = 9$ we get $x = 4$, and from $2x + 1 = -9$ we get $x = -5$.'
          - problem: 'At which $x$-coordinates does the graph of $y = |3x - 6|$ meet the line $y = 12$?'
            answer: '-2, 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The graphs meet where $3x - 6 = 12$ or $3x - 6 = -12$. Solving gives $x = 6$ or $x = -2$.'
          - problem: 'A sensor reports the size of an error, $|4x - 8|$, as $12$. What values of $x$ are possible?'
            answer: "-1, 5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The expression inside is either $12$ or $-12$. From $4x - 8 = 12$ we get $x = 5$, and from $4x - 8 = -12$ we get $x = -1$.'
          - problem: 'A student solves $|5x + 5| = 15$ and finds only $x = 2$. Solve the equation completely.'
            answer: '-4, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The case $5x + 5 = 15$ gives $x = 2$. The missed case $5x + 5 = -15$ gives $5x = -20$, so $x = -4$.'
          - problem: 'Solve $|2x - 3| = 7$.'
            answer: '-2, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inside is $7$ or $-7$. From $2x - 3 = 7$ we get $x = 5$, and from $2x - 3 = -7$ we get $x = -2$.'
          - problem: 'Solve $|3x + 2| = 4$.'
            answer: '-2, 2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $3x + 2 = 4$ we get $3x = 2$, so $x = 2/3$. From $3x + 2 = -4$ we get $3x = -6$, so $x = -2$.'
        constraints: "split into two linear equations; integer solutions"
      - id: kp2
        name: "Isolate the absolute value first"
        key_prerequisites: [two-step-equations, basic-absolute-value-equations]
        exemplars:
          - problem: 'Solve $|x + 2| - 3 = 4$.'
            answer: '-9, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $3$ to isolate the absolute value: $|x + 2| = 7$. The cases $x + 2 = 7$ and $x + 2 = -7$ give $x = 5$ and $x = -9$.'
          - problem: 'Solve $2|x| = 10$.'
            answer: '-5, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide by $2$ to isolate the absolute value: $|x| = 5$. The solutions are $x = -5$ and $x = 5$.'
          - problem: 'Solve $3|2x - 1| + 4 = 13$.'
            answer: '-1, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $4$ and divide by $3$: $|2x - 1| = 3$. Then $2x - 1 = 3$ gives $x = 2$ and $2x - 1 = -3$ gives $x = -1$.'
          - problem: 'Solve $10 - 2|x + 3| = 2$.'
            answer: '-7, 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $10$ and divide by $-2$: $|x + 3| = 4$. The cases $x + 3 = 4$ and $x + 3 = -4$ give $x = 1$ and $x = -7$.'
          - problem: 'Solve $\frac{|x - 4|}{3} = 2$.'
            answer: '-2, 10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by $3$ to isolate the absolute value: $|x - 4| = 6$. The cases $x - 4 = 6$ and $x - 4 = -6$ give $x = 10$ and $x = -2$.'
          - problem: 'Solve $4|x + 1| - 7 = 5$.'
            answer: '-4, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $7$ and divide by $4$: $|x + 1| = 3$. The cases $x + 1 = 3$ and $x + 1 = -3$ give $x = 2$ and $x = -4$.'
        constraints: "isolate |..| before splitting into cases"
      - id: kp3
        name: "Recognize no-solution cases"
        key_prerequisites: [basic-absolute-value-equations]
        exemplars:
          - problem: 'Solve $|x - 5| = -3$.'
            answer: 'no solution'
            answer_contract: {"kind":"label","options":[["no solution","none","no solutions","there is no solution","no real solution","no real solutions"],["all real numbers","every real number","infinitely many solutions","any real number","all reals","infinitely many","all real x","every number"]]}
            solution_sketch: 'An absolute value is a distance, so it is never negative. No number makes $|x - 5|$ equal $-3$, so there is no solution.'
          - problem: 'Solve $|2x| + 7 = 3$.'
            answer: "no real solution"
            answer_contract: {"kind":"label","options":[["no real solution","no solution","none","no solutions","there is no solution","no real solutions","no real number"],["all real numbers","every real number","infinitely many solutions","any real number"]]}
            solution_sketch: 'Subtract $7$ to isolate the absolute value: $|2x| = -4$. An absolute value is never negative, so the equation has no solution.'
          - problem: 'Solve $|x + 3| + 4 = 4$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $4$: $|x + 3| = 0$. Only zero has absolute value $0$, so $x + 3 = 0$ and the single solution is $x = -3$.'
          - problem: 'Solve $5 - |x + 1| = 2$.'
            answer: '-4, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $5$ and multiply by $-1$: $|x + 1| = 3$, which is positive. The cases give $x = 2$ and $x = -4$.'
          - problem: 'Give an integer value of $c$ for which $|x - 2| = c$ has no solution.'
            answer: '-1'
            answer_contract: {"kind":"property","check":"integer_in_range","args":{"max":-1}}
            solution_sketch: 'An absolute value is never negative, so any negative $c$ works, such as $c = -1$. Other answers include $-2$ and $-10$; $c = 0$ gives the solution $x = 2$.'
          - problem: 'Solve $|2x - 1| + 6 = 9$.'
            answer: '-1, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $6$: $|2x - 1| = 3$, which is positive, so there are two cases. They give $x = 2$ and $x = -1$.'
        constraints: "isolated absolute value equals a negative number"
    diagnostic_exemplar:
      problem: 'Solve $|3x - 1| - 2 = 6$.'
      answer: 'x = 3 or x = -7/3'
      solution_sketch: '$|3x - 1| = 8$; $3x - 1 = 8 \to x = 3$; $3x - 1 = -8 \to x = -\frac{7}{3}$.'
    anki_seeds:
      - front: "If |X| = a with a > 0, then X = ? "
        back: "X = a or X = -a (isolate the absolute value first)"
        type: basic
      - front: "If |X| = a and a < 0, the equation has ..."
        back: "no solution (absolute value is never negative)"
        type: basic

  - id: translating-sentences-to-equations
    name: "Translating Sentences into Equations"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: translating-phrases-to-expressions
        weight: 0.7
        key: true
      - id: two-step-equations
        weight: 0.6
        key: true
      - id: one-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Translate and solve one- and two-step sentences"
        key_prerequisites: [two-step-equations, translating-phrases-to-expressions]
        exemplars:
          - problem: 'A number increased by $7$ is $22$. Find the number.'
            answer: '15'
            answer_contract: {kind: exact}
            solution_sketch: 'The sentence gives $x + 7 = 22$. Subtract $7$ from both sides, so $x = 15$.'
          - problem: 'Twice a number minus $5$ is $9$. Find the number.'
            answer: '7'
            answer_contract: {kind: exact}
            solution_sketch: 'The sentence gives $2x - 5 = 9$. Add $5$ to get $2x = 14$, so $x = 7$.'
          - problem: 'A number decreased by $9$ is $14$. Find the number.'
            answer: '23'
            answer_contract: {kind: exact}
            solution_sketch: 'The sentence gives $x - 9 = 14$. Add $9$ to both sides, so $x = 23$.'
          - problem: 'Three times a number plus $8$ is $35$. Find the number.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sentence gives $3x + 8 = 35$. Subtract $8$ to get $3x = 27$, so $x = 9$.'
          - problem: 'The quotient of a number and $4$ is $6$. Find the number.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sentence gives $x/4 = 6$. Multiply both sides by $4$, so $x = 24$.'
          - problem: 'Four more than half a number is $13$. Find the number.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sentence gives $x/2 + 4 = 13$. Subtract $4$ to get $x/2 = 9$, then multiply by $2$, so $x = 18$.'
        constraints: "define one variable; integer answer"
      - id: kp2
        name: "Write the equation without solving"
        key_prerequisites: [translating-phrases-to-expressions]
        exemplars:
          - problem: 'Write an equation for: $5$ more than $3$ times a number $n$ is $26$.'
            answer: '3*n + 5 = 26'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'Multiply $n$ by $3$, then add $5$. The word "is" sets this expression equal to $26$, giving $3n + 5 = 26$.'
          - problem: 'Write an equation for: the quotient of a number $y$ and $4$ is $12$.'
            answer: 'y/4 = 12'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'The number $y$ is the dividend and $4$ is the divisor. Set their quotient equal to $12$: $y/4 = 12$.'
          - problem: 'Write an equation for: $4$ times the sum of a number $x$ and $7$ is $44$.'
            answer: '4*(x + 7) = 44'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'First form the sum $x + 7$. Multiply the whole sum by $4$ and set the product equal to $44$: $4(x + 7) = 44$.'
          - problem: 'Write an equation for: $9$ less than the quotient of a number $x$ and $3$ is $2$.'
            answer: 'x/3 - 9 = 2'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'First divide $x$ by $3$. Subtract $9$ from that quotient and set the difference equal to $2$: $x/3 - 9 = 2$.'
          - problem: 'Write an equation for: the difference of $17$ and twice a number $x$ is $5$.'
            answer: '17 - 2*x = 5'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'Twice the number is $2x$. Subtract it from $17$, in the stated order, and set the difference equal to $5$: $17 - 2x = 5$.'
          - problem: 'Write an equation for: the difference of a number $x$ and $5$, divided by $7$, is $3$.'
            answer: '(x - 5)/7 = 3'
            answer_contract: {"kind":"relation_setup"}
            solution_sketch: 'First subtract $5$ from $x$. Divide the whole difference by $7$ and set the quotient equal to $3$: $(x - 5)/7 = 3$.'
        constraints: '"is" marks the equals sign; preserve grouping and operation order; do not simplify or solve'
    diagnostic_exemplar:
      problem: 'Seven less than twice a number is $11$. Find the number.'
      answer: "9"
      solution_sketch: '$2x - 7 = 11$; $2x = 18$; $x = 9$.'
    anki_seeds:
      - front: "In a word sentence, the word 'is' usually translates to..."
        back: "the equals sign"
        type: basic

  - id: consecutive-integer-problems
    name: "Number and Consecutive Integer Problems"
    # over-coverage: consecutive-integer context schema over
    # translating-sentences-to-equations + multi-step-equations
    core: false
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: translating-sentences-to-equations
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Multi-step number problems"
        key_prerequisites: [translating-sentences-to-equations, multi-step-equations]
        exemplars:
          - problem: 'The sum of a number and twice the number is $24$. Find the number.'
            answer: "8"
            answer_contract: {kind: exact}
            solution_sketch: '$x + 2x = 24$; $3x = 24$; $x = 8$.'
          - problem: 'Seven less than three times a number is $20$. Find the number.'
            answer: "9"
            answer_contract: {kind: exact}
            solution_sketch: '$3x - 7 = 20$; $3x = 27$; $x = 9$.'
          - problem: 'Five less than four times a number is $23$. Find the number.'
            answer: "7"
            answer_contract: {kind: exact}
            solution_sketch: '$4x - 5 = 23$; $4x = 28$; $x = 7$.'
          - problem: 'The sum of a number and three times the number is $44$. Find the number.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sentence gives $x + 3x = 44$. Combine like terms to get $4x = 44$, so $x = 11$.'
        constraints: "one unknown; combine like terms or two steps; integer answer"
      - id: kp2
        name: "Consecutive integers and totals"
        key_prerequisites: [multi-step-equations]
        try_first:
          problem: 'Three consecutive integers add up to $48$. What is the smallest of them?'
          answer_contract: {"kind":"exact"}
          answer: '15'
          reveal: 'Call the smallest $x$; the others are $x+1$ and $x+2$, so $3x+3=48$ and $x=15$. One letter plus steps of one turns guessing into an equation.'
        exemplars:
          - problem: 'Two consecutive integers sum to $27$. Find them.'
            answer: '13, 14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call them $x$ and $x + 1$, so $2x + 1 = 27$. Then $x = 13$, and the integers are $13$ and $14$.'
          - problem: 'The sum of three consecutive integers is $42$. Find them.'
            answer: '13, 14, 15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call them $x$, $x + 1$, $x + 2$, so $3x + 3 = 42$. Then $x = 13$, and the integers are $13$, $14$ and $15$.'
          - problem: 'Two consecutive even integers sum to $46$. Find them.'
            answer: '22, 24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call them $x$ and $x + 2$, so $2x + 2 = 46$. Then $x = 22$, and the integers are $22$ and $24$.'
          - problem: 'Three consecutive odd integers have a sum of $33$. Find them.'
            answer: '9, 11, 13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the integers as $x$, $x + 2$, $x + 4$. Their sum gives $3x + 6 = 33$, so $x = 9$ and the integers are $9$, $11$ and $13$.'
          - problem: 'The sum of four consecutive integers is $74$. Find them.'
            answer: '17, 18, 19, 20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call them $x$, $x + 1$, $x + 2$, $x + 3$, so $4x + 6 = 74$. Then $x = 17$, and the integers are $17$, $18$, $19$ and $20$.'
          - problem: 'For two consecutive even integers, the smaller plus three times the larger is $62$. Find the integers.'
            answer: '14, 16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Call them $x$ and $x + 2$, so $x + 3(x + 2) = 62$. Then $4x + 6 = 62$ gives $x = 14$, and the integers are $14$ and $16$.'
        constraints: "represent related quantities in terms of one variable"
    diagnostic_exemplar:
      problem: 'Three consecutive even integers sum to $48$. Find them.'
      answer_contract: {kind: list, ordered: false, member: {kind: exact}}
      answer: '14, 16, 18'
      solution_sketch: '$x + (x + 2) + (x + 4) = 48$; $3x + 6 = 48$; $x = 14$.'
    anki_seeds:
      - front: "Consecutive integers starting at x are written..."
        back: "x, x + 1, x + 2, ... (consecutive even or odd integers step by 2: x, x + 2, ...)"
        type: basic

  - id: money-geometry-problems
    name: "Money and Geometry Equation Problems"
    # over-coverage: ticket-price and perimeter context schema over the same
    # translating-sentences-to-equations + multi-step-equations pair
    core: false
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: translating-sentences-to-equations
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Money and cost setups"
        key_prerequisites: [translating-sentences-to-equations]
        exemplars:
          - problem: 'A gym charges a €20 joining fee plus €15 per month. Mia has paid €110 in total. For how many months has she been a member?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cost is $15m+20=110$. Subtract $20$ to get $15m=90$, then divide by $15$ to get $m=6$ months.'
          - problem: 'Tickets cost €8 each and you spent €56. How many tickets did you buy?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cost of $x$ tickets is $8x=56$. Divide both sides by $8$ to get $x=7$.'
          - problem: 'A taxi charges a €3 base fare plus €2 per kilometre. The fare was €23. How many kilometres was the ride?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}
            solution_sketch: 'The fare is $2k+3=23$. Subtract $3$ to get $2k=20$, then divide by $2$ to get $k=10$, so the ride was $10$ km.'
          - problem: 'You have €60 and buy notebooks at €7 each, which leaves you €4. How many notebooks did you buy?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The spent amount is $60-4=56$ euros, so $7n=56$. Divide by $7$ to get $n=8$.'
          - problem: 'Notebooks cost €5 each. After a €4 coupon, the total is €41. How many notebooks were bought?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coupon takes €4 off, so $5n-4=41$. Add $4$ to get $5n=45$, then divide by $5$ to get $n=9$.'
          - problem: 'Four friends share the cost of a pizza equally, and each also buys a €3 drink. Each friend spends €10 in all. How much does the pizza cost?'
            answer: '28'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'Each friend pays $\frac{p}{4}+3=10$ euros. Subtract $3$ to get $\frac{p}{4}=7$, then multiply by $4$ to get $p=28$, so the pizza costs €28.'
          - problem: 'A school buys $12$ identical calculators and pays a €15 delivery fee. The bill is €279. How much does one calculator cost?'
            answer: '22'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The bill is $12c+15=279$. Subtract $15$ to get $12c=264$, then divide by $12$ to get $c=22$, so one calculator costs €22.'
        constraints: "unit price times quantity, possibly plus a fixed fee; whole-number answers"
      - id: kp2
        name: "Perimeter and side-length setups"
        key_prerequisites: [multi-step-equations, translating-sentences-to-equations]
        exemplars:
          - problem: 'A rectangle''s length is $3$ cm more than its width and its perimeter is $26$ cm. Find the width.'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'With width $w$, the perimeter is $2w+2(w+3)=26$. This is $4w+6=26$, so $4w=20$ and the width is $5$ cm.'
          - problem: 'A triangle has sides $x$, $x+2$ and $x+4$, and its perimeter is $30$. Find the shortest side.'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The perimeter is $x+(x+2)+(x+4)=30$, so $3x+6=30$ and $3x=24$. The shortest side is $x=8$.'
          - problem: 'An isosceles triangle has two equal sides of $2x$ cm and a base of $x+3$ cm. Its perimeter is $33$ cm. Find $x$.'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'Add the sides: $2x+2x+(x+3)=33$. This gives $5x+3=33$, so $5x=30$ and $x=6$; the sides are $12$, $12$ and $9$ cm.'
          - problem: 'A square has the side $x-2$ cm and a perimeter of $28$ cm. Find $x$.'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The perimeter is $4(x-2)=28$, so $x-2=7$ and $x=9$. Four sides of $7$ cm give $28$ cm.'
          - problem: 'A farmer has $60$ m of fencing for a rectangular pen whose length is twice its width. How long is the pen?'
            answer: '20'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'With width $w$ and length $2w$, the fence is $2w+2(2w)=60$. This gives $6w=60$, so $w=10$ and the length is $2w=20$ m.'
          - problem: 'A rectangular pen uses a wall for one side, so only three sides need a fence. The length along the wall is $4$ m more than the width, and the fence is $40$ m long. Find the width.'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The fence covers two widths and one length: $2w+(w+4)=40$. This gives $3w=36$, so the width is $12$ m.'
          - problem: 'A rectangle''s length is $5$ cm more than its width and its perimeter is $50$ cm. Sam solves $w+(w+5)=50$. What is the correct width?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'Sam counted only one width and one length, but the perimeter has two of each: $2w+2(w+5)=50$. Then $4w+10=50$, so $w=10$ cm.'
          - problem: 'A square with side $9$ cm and an equilateral triangle have the same perimeter. Find the side of the triangle.'
            answer: '12'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The square has perimeter $4\times9=36$ cm, so $3s=36$ for the triangle. Then $s=12$, and the triangle side is $12$ cm.'
        constraints: "express each side in terms of one variable; check units"
    diagnostic_exemplar:
      problem: 'The length of a rectangle is $5$ more than its width and the perimeter is $38$. Find the width.'
      answer: '7'
      solution_sketch: '$2(w + 5) + 2w = 38$; $4w + 10 = 38$; $w = 7$.'
    anki_seeds:
      - front: "The perimeter of a rectangle in terms of width w and length l:"
        back: "P = 2w + 2l"
        type: basic

  - id: equation-word-problems
    name: "Writing and Solving Equations from Words"
    core: false                # word-problem genre; cone now supplemental
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      # the technique the two demoted context schemas were supplying: every KP
      # below defines a variable and writes an equation from a sentence
      - id: translating-sentences-to-equations
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Two quantities sharing a total"
        key_prerequisites: [translating-sentences-to-equations, multi-step-equations]
        exemplars:
          - problem: 'Maya and Liam sold $51$ raffle tickets in all; Maya sold twice as many as Liam. How many did Maya sell?'
            answer: "34"
            answer_contract: {kind: exact}
            solution_sketch: 'Liam $x$, Maya $2x$: $3x = 51$; $x = 17$; Maya sold $34$.'
          - problem: 'A $36$ cm ribbon is cut into two pieces; one piece is $8$ cm longer than the other. How long is the shorter piece?'
            answer: "14"
            answer_contract: {kind: exact}
            solution_sketch: '$x + (x + 8) = 36$; $2x = 28$; $x = 14$.'
          - problem: 'Two clubs have $60$ members combined; the chess club has three times as many members as the debate club. How many are in the chess club?'
            answer: "45"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Debate $x$, chess $3x$: $4x = 60$; $x = 15$; chess has $45$.'
          - problem: 'A $40$ m rope is cut into two pieces; one piece is $6$ m longer than the other. How long is the shorter piece?'
            answer: "17"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$x + (x + 6) = 40$; $2x = 34$; $x = 17$.'
        constraints: "express both quantities with one variable; answer the question asked"
      - id: kp2
        name: "Break-even setups with the variable on both sides"
        key_prerequisites: [variables-both-sides, multi-step-equations]
        exemplars:
          - problem: "Plan A costs €20 plus €5 per class; Plan B costs €10 plus €7 per class. For how many classes do the plans cost the same?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$20 + 5c = 10 + 7c$; $10 = 2c$; $c = 5$."
          - problem: "Tank A holds $300$ L and drains at $15$ L/min; tank B holds $180$ L and drains at $5$ L/min. After how many minutes do they hold the same amount?"
            answer: "12"
            answer_contract: {"kind":"unit","quantity":"time","unit":"minute","allow_omitted":true}
            solution_sketch: "$300 - 15t = 180 - 5t$; $120 = 10t$; $t = 12$."
          - problem: "A shop has fixed costs €90 and costs €3 per item. It sells each item for €8. How many items must it sell to break even?"
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set cost equal to revenue: $90+3n=8n$. Subtract $3n$: $90=5n$, hence $n=18$."
          - problem: "A runner starts $120$ m ahead at $4$ m/s. A second runner follows at $6$ m/s. After how many seconds are their positions equal?"
            answer: "60"
            answer_contract: {"kind":"unit","quantity":"time","unit":"second","allow_omitted":true}
            solution_sketch: "The positions are $120+4t$ and $6t$. Equating gives $120=2t$, hence $t=60$ seconds."
          - problem: 'Gym A charges a €48 joining fee plus €14 per month. Gym B charges €22 per month with no fee. After how many months have both gyms cost the same?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set the totals equal: $48 + 14m = 22m$. Subtract $14m$ to get $48 = 8m$, so $m = 6$ months.'
          - problem: 'Candle A is $30$ cm tall and burns $2$ cm per hour. Candle B is $22$ cm tall and burns $1$ cm per hour. After how many hours are they the same height?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'The heights are $30 - 2t$ and $22 - t$. Setting them equal gives $8 = t$, so after $8$ hours both are $14$ cm tall.'
        constraints: "two linear models set equal; positive integer answers"
      - id: kp3
        name: "Age and comparison problems"
        key_prerequisites: [translating-sentences-to-equations, multi-step-equations]
        exemplars:
          - problem: 'Ana is $4$ years older than Ben, and the sum of their ages is $30$. How old is Ana?'
            answer: "17"
            answer_contract: {kind: exact}
            solution_sketch: 'Ben $x$, Ana $x + 4$: $2x + 4 = 30$; $x = 13$; Ana is $17$.'
          - problem: 'A father is $3$ times as old as his son. In $12$ years he will be twice as old as his son. How old is the son now?'
            answer: "12"
            answer_contract: {kind: exact}
            solution_sketch: '$3s + 12 = 2(s + 12)$; $3s + 12 = 2s + 24$; $s = 12$.'
          - problem: 'Nora is $6$ years older than Omar, and the sum of their ages is $32$. How old is Nora?'
            answer: '19'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let Omar be $x$, so Nora is $x + 6$ and $2x + 6 = 32$. Then $x = 13$, so Nora is $19$.'
          - problem: 'A father is $5$ times as old as his son. In $10$ years he will be $3$ times as old as his son. How old is the son now?'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$5s + 10 = 3(s + 10)$; $5s + 10 = 3s + 30$; $s = 10$.'
        constraints: "relate ages now and after a time shift; integer answers"
    diagnostic_exemplar:
      problem: 'A mother is $4$ times as old as her daughter. In $6$ years she will be $3$ times as old as her daughter. How old is the daughter now?'
      answer: '12'
      solution_sketch: '$4d + 6 = 3(d + 6)$; $4d + 6 = 3d + 18$; $d = 12$.'
    anki_seeds:
      - front: "Setup when two quantities share a total and one is k times the other:"
        back: "let the smaller be x and the other kx; then x + kx = total"
        type: basic
      - front: "Break-even setup for two linear plans:"
        back: "set cost A = cost B and solve for the shared variable"
        type: basic
      - front: "Age problems: 'in t years' means each person's age becomes..."
        back: "current age + t (add t to every age before comparing)"
        type: basic
