unit: expressions-equations
course: foundations
module: "Expressions & Equations"
topics:
  - id: parts-of-an-expression
    name: "Parts of an Algebraic Expression"
    core: true
    difficulty: 0.20
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: order-of-operations
        weight: 0.5
        key: true
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Terms, coefficients, and constants"
        key_prerequisites: [order-of-operations]
        exemplars:
          - problem: 'How many terms does $4x + 7 - 2y$ have?'
            answer: "3"
            solution_sketch: 'Terms are separated by $+$ and $-$: $4x$, $7$, $-2y$.'
          - problem: 'What is the coefficient of $y$ in $3x - 5y + 2$?'
            answer: "-5"
            solution_sketch: 'The term is $-5y$; the sign belongs to the coefficient.'
          - problem: 'What is the constant term of $2x^2 + 3x - 8$?'
            answer: "-8"
            solution_sketch: 'The constant term has no variable factor: $-8$.'
          - problem: 'How many terms does $5x - 3y + 8$ have?'
            answer: "3"
            solution_sketch: 'Terms are separated by $+$ and $-$: $5x$, $-3y$, $8$.'
        constraints: "two to four terms; integer coefficients from -9 to 9"
      - id: kp2
        name: "Identify like terms"
        key_prerequisites: [order-of-operations]
        exemplars:
          - problem: "In $5x + 3y - 2x + 7$, one other term is a like term of $5x$. Which term is it?"
            answer: "-2x"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Like terms have the same variable part; $5x$ and $-2x$ both have $x$."
          - problem: "Are $4a^2$ and $4a$ like terms? Answer yes or no."
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "The variable parts $a^2$ and $a$ differ."
          - problem: "In $2xy + 5x + 3xy - 1$, collect the terms whose variable part is $xy$. Give their sum."
            answer: "5xy"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The matching terms are $2xy$ and $3xy$; adding their coefficients gives $(2+3)xy=5xy$."
          - problem: "A term must be like $-4x^2$. Choose $7x$, $7x^2$, or $7y^2$."
            answer: "7x^2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The variable and its exponent must both match: the required variable part is $x^2$."
        constraints: "at most two variables; exponents <= 2"
    diagnostic_exemplar:
      problem: 'In $6a - 4b + 2 - 9a$, which term is a like term of $6a$?'
      answer: '-9a'
      solution_sketch: 'Like terms have the same variable to the same power.'
    anki_seeds:
      - front: "The coefficient of a term is..."
        back: "its numerical factor, including the sign (in -5y the coefficient is -5)"
        type: basic
      - front: "Like terms are terms with..."
        back: "exactly the same variable part (same variables to the same powers)"
        type: basic

  - id: substituting-values
    name: "Substituting Values into Expressions"
    core: true
    difficulty: 0.22
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: order-of-operations
        weight: 0.7
        key: true
      - id: multiplication-tables
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Substitute one value into a linear expression"
        key_prerequisites: [order-of-operations]
        exemplars:
          - problem: 'Evaluate $3x + 5$ when $x = 4$.'
            answer: "17"
            solution_sketch: '$3(4) + 5 = 12 + 5 = 17$.'
          - problem: 'Evaluate $2a - 7$ when $a = 10$.'
            answer: "13"
            solution_sketch: '$2(10) - 7 = 13$.'
          - problem: 'Evaluate $10 - 2m$ when $m = 3$.'
            answer: "4"
            solution_sketch: '$10 - 2(3) = 4$.'
          - problem: 'Evaluate $4x - 5$ when $x = 6$.'
            answer: "19"
            solution_sketch: '$4(6) - 5 = 19$.'
        constraints: "one variable; positive integer inputs; coefficients <= 9"
      - id: kp2
        name: "Two variables with whole-number inputs"
        key_prerequisites: [order-of-operations, multiplication-tables]
        exemplars:
          - problem: "Evaluate $2ab$ when $a = 5$ and $b = 3$."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2 \\times 5 \\times 3 = 30$."
          - problem: "Evaluate $x + 3y$ when $x = 2$ and $y = 4$."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2+3(4)=2+12=14$."
          - problem: "A rectangle has width $a=4$ and length $b=7$. Evaluate $2(a+b)$."
            answer: "22"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Add inside the parentheses first: $2(4+7)=2(11)=22$."
          - problem: "For $p=9$ and $q=3$, find the value of $(p-q)/q$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The numerator is $9-3=6$; dividing by $q$ gives $6/3=2$."
        constraints: "two variables; positive integer inputs <= 10"
    diagnostic_exemplar:
      problem: 'Evaluate $2x + 3y$ when $x = 4$ and $y = 5$.'
      answer: '23'
      solution_sketch: '$8 + 15 = 23$.'
    anki_seeds:
      - front: "A coefficient written next to a variable, as in 3x, means..."
        back: "multiplication: 3x = 3 times x"
        type: basic

  - id: evaluating-expressions
    name: "Evaluating Algebraic Expressions"
    core: true
    difficulty: 0.28
    drill: false
    answer_kind: numeric
    expected_time_secs: 50
    prerequisites:
      - id: substituting-values
        weight: 0.8
        key: true
      - id: integer-multiplication-division
        weight: 0.6
      - id: integer-addition-subtraction
        weight: 0.6
      - id: integer-exponents-intro
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Expressions with exponents"
        key_prerequisites: [substituting-values, integer-exponents-intro]
        exemplars:
          - problem: "Evaluate $x^2 + y$ when $x = 3$ and $y = 4$."
            answer: "13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3^2 + 4 = 9 + 4 = 13$."
          - problem: "Evaluate $2a^2$ when $a = 3$."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Exponent first: $2 \\times 9 = 18$."
          - problem: "Evaluate $(a+b)^2$ for $a=2$ and $b=5$."
            answer: "49"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The grouped base is $2+5=7$; its square is $7^2=49$."
          - problem: "A square has side $s=6$. Evaluate $s^2-4s$, the numerical difference between its area and perimeter."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The area value is $6^2=36$ and the perimeter value is $4(6)=24$; $36-24=12$."
        constraints: "exponents <= 2; positive inputs"
      - id: kp2
        name: "Negative inputs with order of operations"
        key_prerequisites: [integer-addition-subtraction, integer-multiplication-division]
        exemplars:
          - problem: "Evaluate $x^2 - 3x$ when $x = -2$."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$(-2)^2 - 3(-2) = 4 + 6 = 10$."
          - problem: "Evaluate $\\frac{a - b}{2}$ when $a = -3$ and $b = 9$."
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$\\frac{-3 - 9}{2} = -\\frac{12}{2} = -6$."
          - problem: "For $x=-4$, evaluate $(-x)^2$."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Negating the input gives $-(-4)=4$; then $4^2=16$."
          - problem: "For $a=-3$, evaluate $-a^2$."
            answer: "-9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The exponent applies to $a$ before the leading minus: $-((-3)^2)=-9$."
        constraints: "inputs in -9..9; watch sign of squared negatives"
      - id: kp3
        name: "Multi-term expressions with negatives and exponents"
        key_prerequisites: [substituting-values, integer-exponents-intro]
        exemplars:
          - problem: "Evaluate $-x^2+5x+2$ for $x=-1$."
            answer: "-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$-(-1)^2+5(-1)+2=-1-5+2=-4$."
          - problem: "Evaluate $2x^2-x+1$ for $x=-3$."
            answer: "22"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2(-3)^2-(-3)+1=18+3+1=22$."
          - problem: "A learner evaluated $(-x)^2+2x-3$ at $x=-2$ as $-11$. Find the correct value."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The grouped base is $-(-2)=2$, so its square is $4$. The three terms give $4-4-3=-3$."
          - problem: "For $a=-2$ and $b=3$, evaluate $a^2-ab-b^2$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$(-2)^2-(-2)(3)-3^2=4+6-9=1$."
        constraints: "three terms; inputs in -9..9; distinguish -x^2 from (-x)^2"
    diagnostic_exemplar:
      problem: 'Evaluate $3x^2 - 2x$ when $x = -2$.'
      answer: "16"
      solution_sketch: '$3(4) - 2(-2) = 12 + 4 = 16$.'
    anki_seeds:
      - front: "To evaluate an algebraic expression, first ... then ..."
        back: "substitute the given value(s), then simplify following the order of operations (PEMDAS)"
        type: basic

  - id: translating-phrases-to-expressions
    name: "Translating Phrases into Expressions"
    core: true
    difficulty: 0.24
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: parts-of-an-expression
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Sum and difference phrases"
        key_prerequisites: [parts-of-an-expression]
        exemplars:
          - problem: 'Write an expression: $7$ more than a number $n$.'
            answer: "n + 7"
            solution_sketch: '"$7$ more than" adds: $n + 7$.'
          - problem: 'Write an expression: the difference of a number $x$ and $4$.'
            answer: "x - 4"
            solution_sketch: 'The difference subtracts in the stated order: $x - 4$.'
          - problem: 'Write an expression: $9$ more than a number $m$.'
            answer: "m + 9"
            solution_sketch: '"$9$ more than" adds: $m + 9$.'
          - problem: 'Write an expression: the difference of a number $y$ and $6$.'
            answer: "y - 6"
            solution_sketch: 'The difference subtracts in the stated order: $y - 6$.'
        constraints: "one operation; single variable"
      - id: kp2
        name: "Product and quotient phrases"
        key_prerequisites: [parts-of-an-expression]
        exemplars:
          - problem: 'Write an expression: the product of $6$ and $w$.'
            answer: "6w"
            solution_sketch: 'Product means multiply: $6w$.'
          - problem: 'Write an expression: the quotient of $y$ and $5$.'
            answer: "y/5"
            solution_sketch: 'Quotient means divide: $y/5$.'
          - problem: 'Write an expression: the product of $8$ and $v$.'
            answer: "8v"
            solution_sketch: 'Product means multiply: $8v$.'
          - problem: 'Write an expression: the quotient of $z$ and $9$.'
            answer: "z/9"
            solution_sketch: 'Quotient means divide: $z/9$.'
        constraints: "one operation; single variable"
      - id: kp3
        name: "Two-operation phrases"
        key_prerequisites: [parts-of-an-expression]
        exemplars:
          - problem: 'Write an expression: $3$ less than twice a number $n$.'
            answer: "2n - 3"
            solution_sketch: '"$3$ less than" reverses the order: start with $2n$, subtract $3$.'
          - problem: 'Write an expression: $5$ more than the product of $4$ and $t$.'
            answer: "4t + 5"
            solution_sketch: 'The product $4t$ comes first, then add $5$.'
          - problem: 'Write an expression: $5$ less than three times a number $m$.'
            answer: "3m - 5"
            solution_sketch: '"$5$ less than" reverses the order: start with $3m$, subtract $5$.'
          - problem: 'Write an expression: $7$ more than the product of $6$ and $w$.'
            answer: "6w + 7"
            solution_sketch: 'The product $6w$ comes first, then add $7$.'
        constraints: "two operations; watch order-reversing phrases (less than, fewer than)"
    diagnostic_exemplar:
      problem: 'Write an expression: $8$ less than three times a number $x$.'
      answer: "3x - 8"
      solution_sketch: '"Three times a number" is $3x$; "$8$ less than" subtracts from it, so the $8$ comes second.'
    anki_seeds:
      - front: "The phrase 'a less than b' translates to..."
        back: "b - a (the order reverses)"
        type: basic

  - id: writing-expressions-from-patterns
    name: "Writing Expressions from Patterns"
    core: false                # translation leaf; translating-phrases stays core
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: translating-phrases-to-expressions
        weight: 0.6
        key: true
      - id: evaluating-expressions
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Expression from a table of values"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "A table follows a linear rule and pairs $n = 1, 2, 3$ with $5, 8, 11$. Write the rule for the value at any position $n$."
            answer: "3n + 2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Values climb by $3$ each step, so $3n + c$; at $n = 1$, $3 + c = 5$ gives $c = 2$."
          - problem: "A table follows a linear rule and has $(n,v)=(2,7),(4,13),(6,19)$. Write $v$ as an expression in $n$."
            answer: "3n+1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A change of $2$ positions adds $6$, so each position adds $3$. At the first entry, $7-3(2)=1$; the rule is $3n+1$."
          - problem: "A table starts with $(n,v)=(0,4)$ and each increase of $1$ in $n$ adds $5$ to $v$. Write the rule for $v$."
            answer: "5n+4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Each step contributes $5n$ from position zero, whose value is $4$. At position zero, the variable contribution vanishes, leaving the required first value $4$."
          - problem: "A table follows a linear rule, lists $n:1,2,3$ and $v:9,11,13$, and a learner proposes $2n+9$. Correct the rule for every position."
            answer: "2n+7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The step is $2$, but position $1$ already includes one step. The constant is $9-2=7$, so the first value is $2(1)+7=9$."
        constraints: "linear patterns with positive integer step; check against the first entry"
      - id: kp2
        name: "Expression from a real-world rule"
        key_prerequisites: [translating-phrases-to-expressions]
        exemplars:
          - problem: 'A gym charges €20 to join plus €8 per month. Write an expression for the total cost after $m$ months.'
            answer: "8m + 20"
            solution_sketch: 'Fixed €20 plus €8 per month: $8m + 20$.'
          - problem: 'A toothpick pattern uses $3$ toothpicks for $1$ triangle, $5$ for $2$, $7$ for $3$, adding $2$ per triangle. Write an expression for the toothpicks in $n$ triangles.'
            answer: "2n + 1"
            solution_sketch: 'Each additional triangle adds $2$ toothpicks. Starting from $3$ for one triangle gives $3+2(n-1)=2n+1$.'
          - problem: 'A parking garage charges €5 to enter plus €3 per hour. Write an expression for the total cost after $h$ hours.'
            answer: "3h + 5"
            solution_sketch: 'The rate $3$ per hour is the coefficient; the flat $5$ is added once.'
          - problem: 'A fence post pattern uses $4$ posts for $1$ section, $7$ for $2$, $10$ for $3$, adding $3$ per section. Write an expression for the posts in $n$ sections.'
            answer: "3n + 1"
            solution_sketch: 'Step $3$ per section; $3(1) + 1 = 4$ checks.'
        constraints: "start value plus constant rate; single variable"
    diagnostic_exemplar:
      problem: 'A table pairs $n = 1, 2, 3$ with $7$, $11$, $15$. Write an expression for the value at position $n$.'
      answer: '4n + 3'
      solution_sketch: 'The step is $4$, and at $n = 1$ the value is $7 = 4 + 3$.'
    anki_seeds:
      - front: "In a linear pattern, the number added each step becomes the ... of the expression."
        back: "coefficient of the variable (the constant rate)"
        type: basic

  - id: evaluating-formulas
    name: "Evaluating Formulas"
    core: true
    difficulty: 0.30
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: evaluating-expressions
        weight: 0.7
        key: true
      - id: multiplying-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"geometry","figure":{"shape":"polygon","vertices":[{"x":"0","y":"0","label":"A"},{"x":"7","y":"0","label":"B"},{"x":"7","y":"4","label":"C"},{"x":"0","y":"4","label":"D"}],"right_angles":[0,1,2,3]},"caption":"Reference example: A reference rectangle has width 7 and height 4. Coordinates give the side lengths; this diagram is an independent example."}]
        name: "Geometry formulas"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "Use $A = lw$ to find the area when $l = 8$ and $w = 5$."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$A=lw=8(5)=40$."
          - problem: "Use $P = 2l + 2w$ to find the perimeter when $l = 7$ and $w = 3$."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2(7) + 2(3) = 14 + 6 = 20$."
          - problem: "Use $A = \\frac{1}{2}bh$ to find the area when $b = 10$ and $h = 7$."
            answer: "35"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$A=bh/2=10(7)/2=35$."
          - problem: "Use $A=(a+b)h/2$ for a trapezoid with parallel sides $a=5$, $b=9$ and height $h=4$."
            answer: "28"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Average the parallel sides: $(5+9)/2=7$. Multiplying by the height gives $7(4)=28$."
        constraints: "whole-number inputs; area/perimeter formulas"
      - id: kp2
        name: "Rate and science formulas"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: "Use $d = rt$ to find the distance when $r = 55$ and $t = 3$."
            answer: "165"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$d=rt=55(3)=165$."
          - problem: "Use $E = \\frac{1}{2}mv^2$ to find the kinetic energy in joules when $m = 6$ and $v = 4$."
            answer: "48"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$\\frac{1}{2}(6) = 3$; $3 \\times 4^2 = 3 \\times 16 = 48$."
          - problem: "Use $d=at^2/2$ with $a=4$ and $t=3$ to find distance from rest."
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Square the time first: $3^2=9$. Then $d=4(9)/2=18$."
          - problem: "Use $F=9C/5+32$ with $C=10$ to calculate the temperature in degrees Fahrenheit."
            answer: "50"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The scaled temperature is $9(10)/5=18$; adding the offset gives $18+32=50$."
        constraints: "inputs chosen so fraction coefficients produce whole numbers"
    diagnostic_exemplar:
      problem: 'Use $E = \frac{1}{2}mv^2$ to find the kinetic energy in joules when $m = 4$ and $v = 5$.'
      answer: '50'
      solution_sketch: '$E = \frac{1}{2}(4)(5^2) = 2 \times 25 = 50$.'
    anki_seeds:
      - front: "A formula is an equation that..."
        back: "states a relationship between quantities; evaluate it by substituting known values"
        type: basic

  - id: combining-like-terms
    name: "Combining Like Terms"
    core: true
    difficulty: 0.30
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: integer-addition-subtraction
        weight: 0.7
        key: true
      - id: parts-of-an-expression
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Combine like terms with positive coefficients"
        key_prerequisites: [parts-of-an-expression]
        exemplars:
          - problem: "Simplify $3x + 5x$."
            answer: "8x"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3x+5x=(3+5)x=8x$."
          - problem: "Simplify $7a+2a+4a$."
            answer: "13a"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$7a+2a+4a=(7+2+4)a=13a$."
          - problem: "A triangle has side lengths $2x$, $3x$, and $4x$. Express its perimeter as one term."
            answer: "9x"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The perimeter is $2x+3x+4x=(2+3+4)x=9x$."
          - problem: "A learner claims $4y+6y=10y^2$. Correct the simplified expression."
            answer: "10y"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Like terms keep their common variable part: $(4+6)y=10y$, with no change to the exponent."
        constraints: "single variable; positive coefficients <= 9"
      - id: kp2
        name: "Negative coefficients and subtraction"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: "Simplify $8y - 3y$."
            answer: "5y"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$8y-3y=(8-3)y=5y$."
          - problem: "Simplify $-3x-5x+2x$."
            answer: "-6x"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The signed coefficients sum to $-3-5+2=-6$."
          - problem: "A balance changes by $-7x$, then $+2x$, then $-x$. Write the net change as one term."
            answer: "-6x"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Add the three signed changes: $(-7+2-1)x=-6x$."
          - problem: "A learner claims $2x-8x=6x$. Correct the simplified expression."
            answer: "-6x"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Subtracting the coefficients gives $2-8=-6$, so the remaining term is $-6x$."
        constraints: "results may be negative; single variable"
      - id: kp3
        name: "Multiple variable types and constants"
        key_prerequisites: [integer-addition-subtraction, parts-of-an-expression]
        exemplars:
          - problem: "Simplify $3x+2y+4+5x-y-7$."
            answer: "8x+y-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Group by variable part: $(3+5)x+(2-1)y+(4-7)=8x+y-3$."
          - problem: "Combine the three charges $2x+3y+1$, $x-y+4$, and $3x+2y-2$."
            answer: "6x+4y+3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The coefficients of $x$ sum to $2+1+3=6$, those of $y$ to $3-1+2=4$, and constants to $1+4-2=3$."
          - problem: "Simplify $5x^2+3x-2+x^2-7x+6$."
            answer: "6x^2-4x+4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The $x^2$, $x$, and constant groups give $(5+1)x^2+(3-7)x+(-2+6)=6x^2-4x+4$."
          - problem: "A learner combined $4x-2y+3-6x+5y-1$ into $x+2$. Correct the expression."
            answer: "-2x+3y+2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Different variable parts stay separate. The three sums are $(4-6)x$, $(-2+5)y$, and $3-1$."
        constraints: "two variable types plus constants; keep unlike terms separate"
    diagnostic_exemplar:
      problem: 'Simplify $5x + 3 - 2x + 8$.'
      answer: "3x + 11"
      solution_sketch: '$(5x - 2x) + (3 + 8) = 3x + 11$.'
    anki_seeds:
      - front: "Like terms are terms that ..."
        back: "have the same variable(s) raised to the same power; combine them by adding/subtracting their coefficients"
        type: basic

  - id: distributive-property
    name: "The Distributive Property"
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: integer-multiplication-division
        weight: 0.7
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Distribute a positive factor over a sum"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: "Expand $3(x + 4)$."
            answer: "3x + 12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3(x+4)=3x+3(4)=3x+12$."
          - problem: "A rectangle has height $4$ and width $2x+3$. Expand its area expression."
            answer: "8x+12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply the height by both parts of the width: $4(2x+3)=4(2x)+4(3)=8x+12$."
          - problem: "A learner writes $5(x+2)=5x+2$. Expand the left side correctly."
            answer: "5x+10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The outer factor multiplies both summands: $5x+5(2)=5x+10$."
          - problem: "Expand $(x+6)2$."
            answer: "2x+12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Commutativity gives $2(x+6)$; distributing gives $2x+2(6)=2x+12$."
        constraints: "positive factor; two-term binomial"
      - id: kp2
        name: "Negative multipliers and subtraction"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: "Expand $-2(x - 5)$."
            answer: "-2x + 10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$-2 \\cdot x = -2x$; $-2 \\cdot (-5) = +10$."
          - problem: "Expand $-(3y + 7)$."
            answer: "-3y - 7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$-(3y+7)=(-1)(3y)+(-1)(7)=-3y-7$."
          - problem: "Expand $-3(2x+5)$."
            answer: "-6x-15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both products are negative: $(-3)(2x)+(-3)(5)=-6x-15$."
          - problem: "Correct the sign error in $-(4-x)=-4-x$ by expanding the left side."
            answer: "x-4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiplying $-x$ by $-1$ gives $+x$: $(-1)(4)+(-1)(-x)=-4+x$."
        constraints: "negative factor or leading minus; watch both signs"
      - id: kp3
        name: "Distribute then combine like terms"
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: "Expand and simplify $2(x + 3) + 4x$."
            answer: "6x + 6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2x + 6 + 4x = 6x + 6$."
          - problem: "Expand and simplify $3(a - 2) - (a + 1)$."
            answer: "2a - 7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3a - 6 - a - 1 = 2a - 7$."
          - problem: "Subtract the expression $2(x-5)$ from $3x+1$, then simplify."
            answer: "x+11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$(3x+1)-2(x-5)=3x+1-2x+10=x+11$."
          - problem: "A rectangle has length $2x+1$ and width $x+3$. Expand and simplify $2(2x+1)+2(x+3)$."
            answer: "6x+8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The two products give $4x+2+2x+6$; collecting like terms gives $6x+8$."
        constraints: "combine after distributing; single variable"
    diagnostic_exemplar:
      problem: 'Expand and simplify $5 - 3(x - 2)$.'
      answer: '-3x + 11'
      solution_sketch: '$5 - 3x + 6 = -3x + 11$.'
    anki_seeds:
      - front: "Distributive property: a(b + c) = ?"
        back: "ab + ac"
        type: basic

  - id: factoring-linear-expressions
    name: "Factoring Linear Expressions"
    core: false                # early GCF drill; factoring-gcf stays core
    difficulty: 0.34
    drill: false
    answer_kind: expression
    expected_time_secs: 70
    prerequisites:
      - id: distributive-property
        weight: 0.7
        key: true
      - id: gcf-lcm
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Factor out the GCF"
        key_prerequisites: [distributive-property, gcf-lcm]
        exemplars:
          - problem: "Factor $6x+9$ by its GCF and check by expanding."
            answer: "3(2x+3)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The integer GCF is $3$; divide both terms by it to get $2x$ and $3$. Expansion multiplies back to $6x+9$."
          - problem: "A rectangle has area $8x+12$ and integer height equal to the GCF of the two coefficients. Factor its area and check."
            answer: "4(2x+3)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The GCF of $8$ and $12$ is $4$, giving width $2x+3$. Multiplying height by width returns $8x+12$."
          - problem: "A learner factors $10x+15$ using $2$. Factor using the greatest common factor and verify."
            answer: "5(2x+3)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The coefficients share greatest integer factor $5$, and the quotients are $2x$ and $3$. The products $5(2x)$ and $5(3)$ return the original terms."
          - problem: "Factor the difference $14x-21$ by its GCF and expand to check."
            answer: "7(2x-3)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The GCF is $7$. Dividing gives $2x-3$, and distribution gives $14x-21$, including the negative constant."
        constraints: "two terms; GCF between 2 and 9; verify by expanding"
      - id: kp2
        name: "Factor with negatives and two variables"
        key_prerequisites: [distributive-property, gcf-lcm]
        exemplars:
          - problem: "Factor $-4x-8$ by extracting $-4$, then check."
            answer: "-4(x+2)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The quotients are $x$ and $2$. Expanding multiplies each by $-4$, restoring $-4x-8$."
          - problem: "Factor $12x+18y$ by the GCF and check both terms."
            answer: "6(2x+3y)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The integer GCF is $6$; division yields $2x$ and $3y$. The products recover $12x$ and $18y$."
          - problem: "A signed balance is $-6x+9y$. Factor out $-3$ and check the signs."
            answer: "-3(2x-3y)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The quotients are $2x$ and $-3y$. A negative times a negative restores the positive term $9y$."
          - problem: "A learner writes $-8x-12y=-4(2x-3y)$. Correct the factorization and expand to check."
            answer: "-4(2x+3y)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "Both original terms are negative; dividing each by $-4$ gives positive quotients $2x$ and $3y$. Distribution therefore restores both negative terms."
        constraints: "GCF may be negative; expand to check both signs"
    diagnostic_exemplar:
      problem: 'Factor $9x + 15y$.'
      answer: "3(3x + 5y)"
      solution_sketch: 'The GCF of $9$ and $15$ is $3$: $3(3x + 5y)$.'
    anki_seeds:
      - front: "Factoring a linear expression is the reverse of..."
        back: "distributing: pull the GCF out front and divide each term by it"
        type: basic

  - id: equivalent-expressions
    name: "Identifying Equivalent Expressions"
    core: false                # recognition leaf; distributive/like-terms stay core
    difficulty: 0.34
    drill: false
    answer_kind: expression
    expected_time_secs: 75
    prerequisites:
      - id: distributive-property
        weight: 0.6
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: substituting-values
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Decide equivalence by simplifying"
        key_prerequisites: [distributive-property, combining-like-terms]
        exemplars:
          - problem: "Are $2(x + 3)$ and $2x + 6$ equivalent? Answer yes or no."
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "Expanding $2(x + 3)$ gives exactly $2x + 6$."
          - problem: "Are $3x + 4x$ and $7x^2$ equivalent? Answer yes or no."
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "$3x + 4x = 7x$, not $7x^2$."
          - problem: "Is $5x-2(x-3)$ equivalent to $3x+6$? Answer yes or no."
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "$5x-2x+6=3x+6$, so the expressions have identical coefficients."
          - problem: "A square has perimeter $4x$. A learner proposes $x^2$ as an equivalent expression for every $x$. Is the claim valid? Answer yes or no."
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes"], ["no"]]}
            solution_sketch: "At $x=2$, the perimeter is $4(2)=8$ while the proposed expression is $2^2=4$. One counterexample disproves equivalence."
        constraints: "one expression simplifies (or fails to) into the other; single variable"
      - id: kp2
        name: "Simplify to a standard equivalent form"
        key_prerequisites: [distributive-property, combining-like-terms]
        exemplars:
          - problem: "Write $4(2x - 1) + 3$ in the form $ax + b$."
            answer: "8x - 1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$8x - 4 + 3 = 8x - 1$."
          - problem: "Write $5(x + 2) - 3(x - 1)$ in the form $ax + b$."
            answer: "2x + 13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$5x + 10 - 3x + 3 = 2x + 13$."
          - problem: "A rectangle has sides $x+3$ and $2x-1$. Express its perimeter in the form $ax+b$."
            answer: "6x+4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand $2(x+3)+2(2x-1)=2x+6+4x-2$, then combine to get $6x+4$."
          - problem: "Correct the expansion and collection in $3(x-2)+x=3x-2$. Give the form $ax+b$."
            answer: "4x-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Distributing gives $3x-6+x$. The $x$ coefficients add to $4$, while the constant remains $-6$."
        constraints: "distribute and combine; integer coefficients"
    diagnostic_exemplar:
      problem: 'Write $3(2x + 1) - 2(x - 4)$ in the form $ax + b$.'
      answer: "4x + 11"
      solution_sketch: '$6x + 3 - 2x + 8$; note $-2(-4) = +8$.'
    anki_seeds:
      - front: "Two expressions are equivalent when..."
        back: "they take the same value for every value of the variable (simplifying one yields the other)"
        type: basic
      - front: "A quick way to show two expressions are NOT equivalent:"
        back: "find one value of the variable where they evaluate differently"
        type: basic

  - id: checking-a-solution
    name: "Checking a Solution to an Equation"
    core: true
    difficulty: 0.26
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: substituting-values
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Verify a value by substitution"
        key_prerequisites: [substituting-values]
        exemplars:
          - problem: 'Is $x = 4$ a solution of $3x - 5 = 7$? Answer yes or no.'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$3(4) - 5 = 7$; both sides equal $7$.'
          - problem: 'Is $x = 3$ a solution of $x + 8 = 12$? Answer yes or no.'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$3 + 8 = 11 \ne 12$.'
          - problem: 'Is $m = -2$ a solution of $2m + 9 = 5$? Answer yes or no.'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$2(-2) + 9 = 5$.'
          - problem: 'Is $t = -3$ a solution of $5t + 2 = -13$? Answer yes or no.'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$5(-3) + 2 = -13$.'
        constraints: "one- or two-step equations; integer candidates in -9..9"
      - id: kp2
        name: "Pick the solution from candidates"
        key_prerequisites: [substituting-values]
        exemplars:
          - problem: "Which of $x = 2$, $x = 3$, $x = 4$ solves $5x - 6 = 9$?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$5(3) - 6 = 9$."
          - problem: "Test $x=-2$, $x=0$, and $x=2$ in $x^2+x=6$. Which candidate works?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The left sides are respectively $2$, $0$, and $6$, from squaring each candidate and adding it. Only $x=2$ gives $6$."
          - problem: "A machine maps $x$ to $3(x-1)$. Which input $1$, $2$, or $4$ produces $9$?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The three outputs are $0$, $3$, and $9$; only input $4$ works."
          - problem: "Which of $-6$, $-3$, or $6$ solves $x/3=-2$?"
            answer: "-6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Dividing the candidates by $3$ gives $-2$, $-1$, and $2$. The first matches the right side."
        constraints: "three candidates; exactly one works"
    diagnostic_exemplar:
      problem: 'Which of $x = -2$, $x = 1$, $x = 3$ solves $4x - 5 = -1$?'
      answer: '1'
      solution_sketch: '$4(1) - 5 = -1$; the other candidates give $-13$ and $7$.'
    anki_seeds:
      - front: "A value is a solution of an equation when..."
        back: "substituting it makes both sides equal"
        type: basic

