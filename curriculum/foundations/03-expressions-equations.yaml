      answer_contract: {kind: list, ordered: false, member: {kind: exact}}
      answer: '14, 16, 18'
      solution_sketch: '$x + (x + 2) + (x + 4) = 48$; $3x + 6 = 48$; $x = 14$.'
    anki_seeds:
      - front: "Consecutive integers starting at x are written..."
        back: "x, x + 1, x + 2, ... (consecutive even or odd integers step by 2: x, x + 2, ...)"
        type: basic

  - id: money-geometry-problems
    name: "Money and Geometry Equation Problems"
    # over-coverage: ticket-price and perimeter context schema over the same
    # translating-sentences-to-equations + multi-step-equations pair
    core: false
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: translating-sentences-to-equations
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Money and cost setups"
        key_prerequisites: [translating-sentences-to-equations]
        exemplars:
          - problem: "Tickets cost €8 each and you spent €56. How many tickets did you buy?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$8x = 56$; $x = 7$."
          - problem: "A taxi charges a €3 base fare plus €2 per kilometre. The fare was €17. How many kilometres was the ride?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2k + 3 = 17$; $2k = 14$; $k = 7$."
          - problem: "You have €50 and buy notebooks at €6 each, leaving €8. How many notebooks did you buy?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The spent amount is $50-8=42$ euros; $6n=42$ gives $n=7$."
          - problem: "Notebooks cost €5 each. After a €4 coupon, the total is €26. How many notebooks were bought?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The coupon gives $5n-4=26$. Add $4$ to get $5n=30$, then divide by $5$: $n=6$."
        constraints: "unit price times quantity, possibly plus a fixed fee; whole-number answers"
      - id: kp2
        visuals: [{"kind":"geometry","figure":{"shape":"polygon","vertices":[{"x":"0","y":"0","label":"A"},{"x":"7","y":"0","label":"B"},{"x":"7","y":"4","label":"C"},{"x":"0","y":"4","label":"D"}],"right_angles":[0,1,2,3]},"caption":"Reference example: A reference rectangle has width 7 and height 4. Coordinates give the side lengths; this diagram is an independent example."}]
        name: "Perimeter and side-length setups"
        key_prerequisites: [multi-step-equations, translating-sentences-to-equations]
        exemplars:
          - problem: "A rectangle's length is $3$ more than its width and the perimeter is $26$. Find the width."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2w + 2(w + 3) = 26$; $4w + 6 = 26$; $w = 5$."
          - problem: "A triangle has sides $x$, $x + 2$, and $x + 4$, and its perimeter is $30$. Find the shortest side."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3x + 6 = 30$; $3x = 24$; $x = 8$."
          - problem: "An isosceles triangle has equal sides $2x$ cm and base $x+3$ cm. Its perimeter is $28$ cm. Find $x$ in cm."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Add the sides: $2x+2x+(x+3)=28$. Then $5x=25$, hence $x=5$ cm; the side lengths are $10,10,8$ cm."
          - problem: "A square has side $x-2$ cm and perimeter $24$ cm. Find $x$ in cm."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$4(x-2)=24$ gives $x-2=6$, hence $x=8$ cm. Four sides of $6$ cm total $24$ cm."
        constraints: "express each side in terms of one variable; check units"
    diagnostic_exemplar:
      problem: 'The length of a rectangle is $5$ more than its width and the perimeter is $38$. Find the width.'
      answer: '7'
      solution_sketch: '$2(w + 5) + 2w = 38$; $4w + 10 = 38$; $w = 7$.'
    anki_seeds:
      - front: "The perimeter of a rectangle in terms of width w and length l:"
        back: "P = 2w + 2l"
        type: basic

  - id: equation-word-problems
    name: "Writing and Solving Equations from Words"
    core: false                # word-problem genre; cone now supplemental
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      # the technique the two demoted context schemas were supplying: every KP
      # below defines a variable and writes an equation from a sentence
      - id: translating-sentences-to-equations
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Two quantities sharing a total"
        key_prerequisites: [translating-sentences-to-equations, multi-step-equations]
        exemplars:
          - problem: 'Maya and Liam sold $51$ raffle tickets in all; Maya sold twice as many as Liam. How many did Maya sell?'
            answer: "34"
            answer_contract: {kind: exact}
            solution_sketch: 'Liam $x$, Maya $2x$: $3x = 51$; $x = 17$; Maya sold $34$.'
          - problem: 'A $36$ cm ribbon is cut into two pieces; one piece is $8$ cm longer than the other. How long is the shorter piece?'
            answer: "14"
            answer_contract: {kind: exact}
            solution_sketch: '$x + (x + 8) = 36$; $2x = 28$; $x = 14$.'
          - problem: 'Two clubs have $60$ members combined; the chess club has three times as many members as the debate club. How many are in the chess club?'
            answer: "45"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Debate $x$, chess $3x$: $4x = 60$; $x = 15$; chess has $45$.'
          - problem: 'A $40$ m rope is cut into two pieces; one piece is $6$ m longer than the other. How long is the shorter piece?'
            answer: "17"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$x + (x + 6) = 40$; $2x = 34$; $x = 17$.'
        constraints: "express both quantities with one variable; answer the question asked"
      - id: kp2
        name: "Break-even setups with the variable on both sides"
        key_prerequisites: [variables-both-sides, multi-step-equations]
        exemplars:
          - problem: "Plan A costs €20 plus €5 per class; Plan B costs €10 plus €7 per class. For how many classes do the plans cost the same?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$20 + 5c = 10 + 7c$; $10 = 2c$; $c = 5$."
          - problem: "Tank A holds $300$ L and drains at $15$ L/min; tank B holds $180$ L and drains at $5$ L/min. After how many minutes do they hold the same amount?"
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$300 - 15t = 180 - 5t$; $120 = 10t$; $t = 12$."
          - problem: "A shop has fixed costs €90 and costs €3 per item. It sells each item for €8. How many items must it sell to break even?"
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set cost equal to revenue: $90+3n=8n$. Subtract $3n$: $90=5n$, hence $n=18$."
          - problem: "A runner starts $120$ m ahead at $4$ m/s. A second runner follows at $6$ m/s. After how many seconds are their positions equal?"
            answer: "60"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The positions are $120+4t$ and $6t$. Equating gives $120=2t$, hence $t=60$ seconds."
        constraints: "two linear models set equal; positive integer answers"
      - id: kp3
        name: "Age and comparison problems"
        key_prerequisites: [translating-sentences-to-equations, multi-step-equations]
        exemplars:
          - problem: 'Ana is $4$ years older than Ben, and the sum of their ages is $30$. How old is Ana?'
            answer: "17"
            answer_contract: {kind: exact}
            solution_sketch: 'Ben $x$, Ana $x + 4$: $2x + 4 = 30$; $x = 13$; Ana is $17$.'
          - problem: 'A father is $3$ times as old as his son. In $12$ years he will be twice as old as his son. How old is the son now?'
            answer: "12"
            answer_contract: {kind: exact}
            solution_sketch: '$3s + 12 = 2(s + 12)$; $3s + 12 = 2s + 24$; $s = 12$.'
          - problem: 'Nora is $6$ years older than Omar, and the sum of their ages is $28$. How old is Nora?'
            answer: "17"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Omar $x$, Nora $x + 6$: $2x + 6 = 28$; $x = 11$; Nora is $17$.'
          - problem: 'A father is $5$ times as old as his son. In $10$ years he will be $3$ times as old as his son. How old is the son now?'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$5s + 10 = 3(s + 10)$; $5s + 10 = 3s + 30$; $s = 10$.'
        constraints: "relate ages now and after a time shift; integer answers"
    diagnostic_exemplar:
      problem: 'A mother is $4$ times as old as her daughter. In $6$ years she will be $3$ times as old as her daughter. How old is the daughter now?'
      answer: '12'
      solution_sketch: '$4d + 6 = 3(d + 6)$; $4d + 6 = 3d + 18$; $d = 12$.'
    anki_seeds:
      - front: "Setup when two quantities share a total and one is k times the other:"
        back: "let the smaller be x and the other kx; then x + kx = total"
        type: basic
      - front: "Break-even setup for two linear plans:"
        back: "set cost A = cost B and solve for the shared variable"
        type: basic
      - front: "Age problems: 'in t years' means each person's age becomes..."
        back: "current age + t (add t to every age before comparing)"
        type: basic
