          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'You undid the steps backwards: subtract $2$ to get $12$, then divide by $3$ to get $4$. This is how $3x+2=14$ is solved.'
        exemplars:
          - problem: 'Solve $2x + 3 = 11$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $3$ from both sides: $2x = 8$. Then divide by $2$ to get $x = 4$.'
          - problem: 'A taxi charges a fixed fee of $4$ dollars plus $3$ dollars per kilometre. A ride costs $25$ dollars. How long is the ride?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The cost is $3x + 4 = 25$. Subtract the fixed fee: $3x = 21$. Divide by $3$: $x = 7$ km.'
          - problem: 'For $f(x) = 5x - 7$, which input gives the output $18$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $5x - 7 = 18$. Add $7$ to get $5x = 25$, then divide by $5$ to get $x = 5$.'
          - problem: 'Ravi buys $4$ notebooks at the same price and pays $2$ dollars for delivery. The total is $38$ dollars. What does one notebook cost?'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The total is $4x + 2 = 38$. Subtract the delivery fee: $4x = 36$. Divide by $4$: $x = 9$ dollars.'
          - problem: 'Jo solves $2x + 5 = 17$ by dividing only $2x$ by $2$, and gets $x = 12$. What is the correct value of $x$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First subtract $5$ from both sides, which gives $2x = 12$. Then divide both sides by $2$, which gives $x = 6$.'
          - problem: 'A gym charges a joining fee of $15$ euros and $12$ euros per month. Mia has paid $111$ euros in total. For how many months has she been a member?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total is $12x + 15 = 111$. Subtract the joining fee: $12x = 96$. Divide by $12$: $x = 8$ months.'
          - problem: 'Solve $5x - 9 = 36$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $9$ to both sides: $5x = 45$. Divide by $5$ to get $x = 9$.'
          - problem: 'A rectangle is $9$ cm long and its perimeter is $30$ cm. How wide is the rectangle?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The perimeter is $2w + 18 = 30$. Subtract $18$: $2w = 12$. Divide by $2$: $w = 6$ cm.'
        constraints: "integer solutions; undo addition before multiplication"
      - id: kp2
        name: "Division form and negative coefficients"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Solve $\frac{x}{3} + 2 = 6$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $2$ from both sides: $x/3 = 4$. Multiply both sides by $3$: $x = 12$.'
          - problem: 'Solve $-2x + 5 = 13$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $5$ from both sides: $-2x = 8$. Divide by $-2$: $x = -4$.'
          - problem: 'A machine divides its input by $-4$ and then subtracts $3$. The output is $2$. What was the input?'
            answer: '-20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The machine gives $x/(-4) - 3 = 2$. Add $3$ to get $x/(-4) = 5$. Multiply by $-4$: $x = -20$.'
          - problem: 'Pia solves $8 - 3x = 26$ and writes $x = 6$. What is the correct value of $x$?'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $8$ from both sides: $-3x = 18$. Divide by $-3$ and keep the sign: $x = -6$.'
          - problem: 'A bill is split equally among $5$ friends. Each friend adds a $2$ dollar tip and then pays $11$ dollars in all. How large was the bill?'
            answer: '45'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Each friend pays $x/5 + 2 = 11$. Subtract the tip: $x/5 = 9$. Multiply by $5$: $x = 45$ dollars.'
          - problem: 'A tank holds $90$ litres, and a tap removes $6$ litres each minute. After how many minutes are $48$ litres left?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"time","unit":"min","allow_omitted":true}
            solution_sketch: 'The amount left is $90 - 6t = 48$. Subtract $90$: $-6t = -42$. Divide by $-6$: $t = 7$ minutes.'
          - problem: 'Solve $\frac{x}{-5} + 3 = 10$.'
            answer: '-35'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $3$ from both sides: $x/(-5) = 7$. Multiply by $-5$: $x = -35$.'
          - problem: 'At $6$ pm the temperature is $4$ °C and it falls $2$ degrees each hour. After how many hours is it $-8$ °C?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'The temperature is $4 - 2t = -8$. Subtract $4$: $-2t = -12$. Divide by $-2$: $t = 6$ hours.'
        constraints: "integer solutions; watch sign when dividing by a negative"
    diagnostic_exemplar:
      problem: 'Solve $-3x + 7 = 19$.'
      answer: '-4'
      solution_sketch: '$-3x = 12$; $x = -4$.'
    anki_seeds:
      - front: "Order of operations to SOLVE a two-step equation ax + b = c:"
        back: "undo addition/subtraction first, then undo multiplication/division"
        type: basic

  - id: variables-both-sides
