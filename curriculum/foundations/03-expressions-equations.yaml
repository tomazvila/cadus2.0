    core: true
    difficulty: 0.42
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: distributive-property
        weight: 0.7
        key: true
      - id: two-step-equations
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: "Distribute, then solve the two-step equation"
        key_prerequisites: [distributive-property, two-step-equations]
        exemplars:
          - problem: "Solve $2(x + 3) = 16$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2x + 6 = 16$; $2x = 10$; $x = 5$."
          - problem: "Three identical boxes each contain $2x-1$ counters, for $15$ counters total. Find $x$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3(2x-1)=15$ distributes to $6x-3=15$. Add $3$, then divide by $6$: $x=3$."
          - problem: "A rectangle of height $4$ and width $x+2$ has area $28$. Find $x$ by distributing."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$4(x+2)=28$ expands to $4x+8=28$. Then $4x=20$, so $x=5$."
          - problem: "A learner writes $5(x-2)=15$ as $5x-2=15$. Solve the original equation."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Distribute to both terms: $5x-10=15$; then $5x=25$ and $x=5$."
        constraints: "one set of parentheses; positive multiplier; integer solutions"
      - id: kp2
        name: "Negative multipliers and extra constant terms"
        key_prerequisites: [distributive-property, two-step-equations]
        exemplars:
          - problem: "Solve $-2(x - 4) = 10$."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$-2x + 8 = 10$; $-2x = 2$; $x = -1$."
          - problem: "Solve $-3(2x+1)+5=14$."
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Distribute: $-6x-3+5=14$. Combine and subtract $2$: $-6x=12$; $x=-2$."
          - problem: "A machine computes $7-2(x+4)$. Its output is $-9$. Find the input."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$7-2x-8=-9$ simplifies to $-2x-1=-9$. Thus $-2x=-8$ and $x=4$."
          - problem: "Correct the expansion used to solve $-(3x-5)-2=12$ as $-3x-7=12$."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The leading minus changes both signs: $-3x+5-2=12$. Thus $-3x=9$, giving $x=-3$."
        constraints: "watch signs when distributing a negative; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $-3(x - 2) = 18$.'
      answer: '-4'
      solution_sketch: '$-3x + 6 = 18$; $-3x = 12$; $x = -4$.'
    anki_seeds:
      - front: "When an equation contains parentheses, the usual first step is to..."
        back: "distribute to remove the parentheses, then solve as a multi-step equation"
        type: basic

  - id: multi-step-equations
    name: "Multi-Step Equations"
    core: true
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: variables-both-sides
        weight: 0.7
        key: true
      - id: distribute-then-solve
        weight: 0.7
        key: true
      - id: combining-like-terms
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: "Combine like terms before solving"
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: "Solve $3x + 2x + 4 = 24$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$5x + 4 = 24$; $5x = 20$; $x = 4$."
          - problem: "For $f(x)=7x-3x-5$, find the input whose output is $11$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Combine the two input terms: $f(x)=4x-5$. Set $4x-5=11$, then solve $4x=16$, so $x=4$."
          - problem: "The sides of a triangle are $x$, $2x+1$, and $3x-1$. Its perimeter is $36$. Find $x$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Adding the three sides gives $x+2x+1+3x-1=36$, hence $6x=36$ and $x=6$."
          - problem: "Correct the collection in $9+4x-6x=1$: a learner used $10x$. Find $x$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The variable coefficient is $4-6=-2$. Thus $9-2x=1$, $-2x=-8$, and $x=4$."
        constraints: "combine on one side; integer solutions"
      - id: kp2
        name: "Distribute and collect across both sides"
        key_prerequisites: [distribute-then-solve, variables-both-sides]
        exemplars:
          - problem: "Solve $3(2x - 1) = 4x + 9$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$6x - 3 = 4x + 9$; $2x = 12$; $x = 6$."
          - problem: "Solve $5(x - 2) = 2(x + 4)$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$5x - 10 = 2x + 8$; $3x = 18$; $x = 6$."
          - problem: "A rectangle of height $3$ and width $x+1$ has the same area as one of height $2$ and width $x+4$. Find $x$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3(x+1)=2(x+4)$ expands to $3x+3=2x+8$. Subtracting $2x$ and $3$ gives $x=5$."
          - problem: "Correct the claim that $2(x-3)=3-x$ has solution $2$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand: $2x-6=3-x$. Add $x$ and $6$: $3x=9$, giving $x=3$."
        constraints: "parentheses on one or both sides; integer solutions"
      - id: kp3
        name: "Full pipeline: distribute, combine, collect, solve"
        key_prerequisites: [distribute-then-solve, variables-both-sides]
        exemplars:
          - problem: "Solve $4x + 6 - x = 2(x + 5)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$3x + 6 = 2x + 10$; $x = 4$."
          - problem: "Solve $2(3x-1)-x=3(x+2)+4$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand and combine: $6x-2-x=3x+6+4$, so $5x-2=3x+10$. Collect: $2x=12$, hence $x=6$."
          - problem: "Solve $2(x+3)+2x=3(x+2)+x/2$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand and combine to get $4x+6=7x/2+6$. Collect to obtain $x/2=0$, hence $x=0$."
          - problem: "A learner loses a minus sign in $5-2(x-1)+3x=4(x+1)-3$. Solve correctly."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The sides simplify to $7+x$ and $4x+1$. Subtracting $x+1$ leaves $6=3x$, so $x=2$."
        constraints: "requires all three simplification moves; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $5x - 2(x - 3) = 2x + 11$.'
      answer: '5'
      solution_sketch: '$5x - 2x + 6 = 2x + 11$; $3x + 6 = 2x + 11$; $x = 5$.'
    anki_seeds:
      - front: "General strategy for a multi-step linear equation:"
        back: "distribute, combine like terms, collect the variable on one side, then solve the resulting two-step equation"
        type: basic

  - id: equations-special-cases
    name: "Equations with No Solution or Infinitely Many"
    core: false                # classification leaf; the equation-solving rules stay core
    difficulty: 0.48
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: multi-step-equations
        weight: 0.7
        key: true
      - id: variables-both-sides
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Recognize no-solution equations"
        key_prerequisites: [variables-both-sides]
        exemplars:
          - problem: "How many real solutions does $3x + 5 = 3x - 2$ have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Subtracting $3x$ leaves $5 = -2$, which is false."
          - problem: "How many real solutions does $2(x + 4) = 2x + 5$ have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$2x + 8 = 2x + 5$ gives $8 = 5$, false."
          - problem: "How many real solutions does $5x-2x+4=3x+9$ have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Combining on the left gives $3x+4$. Removing $3x$ from both sides would require $4=9$, a false comparison."
          - problem: "How many real solutions does $x/2+3=(x+8)/2$ have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Multiply by $2$: $x+6=x+8$. Removing $x$ would require $6=8$, which is false."
        constraints: "variable terms cancel leaving a false statement"
      - id: kp2
        name: "Recognize identities"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: "How many real values fail to satisfy $2(3x + 4) = 6x + 8$?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both sides expand to $6x + 8$; every value works."
          - problem: "How many real values fail to satisfy $4x - 2x + 7 = 2x + 7$?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The left side simplifies to $2x + 7$, identical to the right."
          - problem: "How many real values fail to satisfy $(6x+9)/3=2x+3$?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Divide each numerator term by $3$: $(6x+9)/3=2x+3$. This equals the right side for every real $x$, so zero real values fail to satisfy the equation.'
          - problem: "A learner claims $7-(2x+3)=4-2x$ has only solution $0$. How many real values actually fail to satisfy the equation?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expanding the left gives $7-2x-3=4-2x$. Both sides therefore produce the same value at every real input."
        constraints: "variable terms cancel leaving a true statement"
      - id: kp3
        name: "Classify: one solution, none, or infinitely many"
        key_prerequisites: [multi-step-equations, variables-both-sides]
        exemplars:
          - problem: "Classify $3(x-1)=3x-3$: one solution, no solution, or all real numbers."
            answer: "all real numbers"
            answer_contract: {"kind": "label", "options": [["one solution"], ["no solution"], ["all real numbers"]]}
            solution_sketch: "Distribution makes the left side $3x-3$, identical to the right for every real input."
          - problem: "Classify $2x+3=x+3$: one solution, no solution, or all real numbers."
            answer: "one solution"
            answer_contract: {"kind": "label", "options": [["one solution"], ["no solution"], ["all real numbers"]]}
            solution_sketch: "Subtracting $x$ and $3$ leaves $x=0$. Exactly one real value works."
          - problem: "Classify $2(x+1)=2x+5$: one solution, no solution, or all real numbers."
            answer: "no solution"
            answer_contract: {"kind": "label", "options": [["one solution"], ["no solution"], ["all real numbers"]]}
            solution_sketch: "Expanding and removing $2x$ would require $2=5$, a false comparison."
          - problem: "A learner calls $x/2+1=3$ impossible because the answer is positive. Classify it: one solution, no solution, or all real numbers."
            answer: "one solution"
            answer_contract: {"kind": "label", "options": [["one solution"], ["no solution"], ["all real numbers"]]}
            solution_sketch: "Subtract $1$ and multiply by $2$: $x=4$. The nonzero coefficient gives a unique value."
        constraints: "mix all three outcomes; do not confuse x = 0 with no solution"
    diagnostic_exemplar:
      problem: 'Solve $3(2x - 1) = 6x + 5$.'
      answer_contract: {kind: label, options: [['no solution'], ['all real numbers']]}
      answer: 'no solution'
      solution_sketch: '$6x - 3 = 6x + 5$ leaves $-3 = 5$, which is false.'
    anki_seeds:
      - front: "If solving an equation ends in a false statement like 8 = 5, the equation has..."
        back: "no solution"
        type: basic
      - front: "If solving an equation ends in a true statement like 7 = 7, the equation has..."
        back: "infinitely many solutions (every real number; it is an identity)"
        type: basic

