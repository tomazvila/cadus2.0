unit: expressions-equations
course: foundations
module: "Expressions & Equations"
topics:
  - id: parts-of-an-expression
    name: "Parts of an Algebraic Expression"
    core: true
    difficulty: 0.20
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: order-of-operations
        weight: 0.5
        key: true
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Terms, coefficients, and constants"
        key_prerequisites: [order-of-operations]
        exemplars:
          - problem: 'How many terms does $4x + 7 - 2y$ have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Terms are separated by $+$ and $-$ signs. The three terms are $4x$, $7$ and $-2y$, so the expression has 3 terms.'
          - problem: 'What is the coefficient of $y$ in $3x - 5y + 2$?'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The term with $y$ is $-5y$. The sign belongs to the term, so the coefficient is $-5$.'
          - problem: 'What is the constant term of $2x^2 + 3x - 8$?'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The constant term has no variable factor. The only such term is $-8$, with its sign.'
          - problem: 'Sam reads the coefficient of $x$ in $9 - 4x + 2y$ as $4$. What is the correct coefficient?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The term with $x$ is $-4x$, because the minus sign in front belongs to it. The coefficient is therefore $-4$.'
          - problem: 'A plumber charges $45$ dollars for the call-out and $30$ dollars for each hour. The cost of a job of $h$ hours is $30h + 45$ dollars. What is the coefficient of $h$?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient is the number that multiplies $h$ in $30h$. Here that is the hourly charge, $30$.'
          - problem: 'A phone plan costs $12$ dollars per month plus a one-time activation fee, so $12m + 25$ is the cost after $m$ months. What is the constant term?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The term $12m$ changes with the number of months. The term $25$ does not contain $m$, so it is the constant term, the one-time fee.'
          - problem: 'What is the coefficient of $y$ in $7x + y - 3$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The term $y$ means $1 \times y$. The coefficient is the unwritten factor $1$.'
          - problem: 'How many terms does $3(x + 2) - 5y$ have?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parentheses hold $x + 2$ as one factor of the first term. The terms are $3(x+2)$ and $-5y$, so there are 2 terms.'
          - problem: 'How many terms does $5a^2 - 3ab + b - 9$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split at each outer $+$ or $-$ sign. The terms are $5a^2$, $-3ab$, $b$ and $-9$, which makes 4 terms.'
        constraints: "two to four terms (a product of a number and a bracket counts as one term); integer coefficients from -9 to 9; contexts give a cost expression and ask for its coefficient or constant"
      - id: kp2
        name: "Identify like terms"
        key_prerequisites: [order-of-operations]
        try_first:
          problem: 'Are $3x^2$ and $5x$ like terms?'
          answer_contract: {"kind":"label","options":[["no","not like terms","they are not like terms","not","no they are not"],["yes","like terms","they are like terms","yes they are"]]}
          answer: 'no'
          reveal: 'The letter is the same, but the powers differ: $x^2$ and $x$. Like terms need the same variable part, including every exponent.'
        exemplars:
          - problem: 'In $5x + 3y - 2x + 7$, which term is like $5x$?'
            answer: '-2x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Like terms have the same variable part. Both $5x$ and $-2x$ have the part $x$, so $-2x$ is the like term.'
          - problem: 'Which of $-3a^2$, $4a$, $7a$ and $-4a$ is like $4a^2$?'
            answer: '-3a^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Like terms have the same variable part, including the exponent. The terms $4a$, $7a$ and $-4a$ have part $a$, while $-3a^2$ has part $a^2$.'
          - problem: 'In $2xy + 5x + 3xy - 1$, which term is like $2xy$?'
            answer: '3xy'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The variable part of $2xy$ is $xy$. Only $3xy$ has the same part, because $5x$ lacks the factor $y$.'
          - problem: 'Are $6x^2y$ and $-2xy^2$ like terms?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","not like terms","they are not like terms","not","no they are not"],["yes","like terms","they are like terms","yes they are"]]}
            solution_sketch: 'The first term has part $x^2y$ and the second has part $xy^2$. The exponents of $x$ and $y$ differ, so they are not like terms.'
          - problem: 'A baker records trays baked as $5c + 3m + 2c$, where $c$ counts trays of cookies and $m$ counts trays of muffins. Which other term counts the same kind of tray as $5c$?'
            answer: '2c'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only trays of the same kind can be added. The term $2c$ counts cookie trays, like $5c$, so it combines with it. The term $3m$ counts muffins.'
          - problem: 'In $3x + 8 - 5x - 2$, which term is like $8$?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Constants have no variable part, so they are like terms with each other. The other constant is $-2$.'
          - problem: 'A cafe records its daily profit in dollars as $12t + 5c - 4t + 7$, where $t$ counts teas and $c$ counts cakes. Which term is like $12t$?'
            answer: '-4t'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both $12t$ and $-4t$ contain only $t$ to the first power. The term $5c$ has a different letter and $7$ has none.'
          - problem: 'Sam combines $7x^2 + 3x + 2x^2$ and says $3x$ is like $7x^2$ because both contain $x$. Which term is really like $7x^2$?'
            answer: '2x^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The variable part of $7x^2$ is $x^2$, not just $x$. The term $2x^2$ has the same part, while $3x$ has part $x$.'
        constraints: "at most two variables; exponents <= 2; constants are like terms of each other"
    diagnostic_exemplar:
      problem: 'In $6a - 4b + 2 - 9a$, which term is a like term of $6a$?'
      answer: '-9a'
      solution_sketch: 'Like terms have the same variable to the same power.'
    anki_seeds:
      - front: "The coefficient of a term is..."
        back: "its numerical factor, including the sign (in -5y the coefficient is -5)"
        type: basic
      - front: "Like terms are terms with..."
        back: "exactly the same variable part (same variables to the same powers)"
        type: basic

  - id: substituting-values
    name: "Substituting Values into Expressions"
    core: true
    difficulty: 0.22
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: order-of-operations
        weight: 0.7
        key: true
      - id: multiplication-tables
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Substitute one value into a linear expression"
        key_prerequisites: [order-of-operations]
        try_first:
          problem: 'If $n = 3$, what is the value of $5n$?'
          answer_contract: {"kind":"exact"}
          answer: '15'
          reveal: 'A number written next to a letter means multiplication, so $5n$ is $5 \times 3 = 15$. It is not the number $53$.'
        exemplars:
          - problem: 'Evaluate $3x + 5$ when $x = 4$.'
            answer: '17'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ with $4$ to get $3(4) + 5$. Multiplying first gives $12 + 5 = 17$.'
          - problem: 'Evaluate $2a - 7$ when $a = 10$.'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $a$ with $10$ to get $2(10) - 7$. Then $20 - 7 = 13$.'
          - problem: 'Evaluate $10 - 2m$ when $m = 3$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $m$ with $3$ to get $10 - 2(3)$. Multiply first: $10 - 6 = 4$.'
          - problem: 'A shop charges $4$ dollars per sandwich plus a $3$ dollar delivery fee, so $s$ sandwiches cost $4s + 3$ dollars. What is the cost of $6$ sandwiches?'
            answer: '27'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Replace $s$ with $6$ to get $4(6) + 3$. Multiplying first gives $24 + 3 = 27$ dollars.'
          - problem: 'Sam evaluates $8 - 3x$ when $x = 5$ and gets $25$. What is the correct value?'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam subtracted first, which is wrong. Multiplication comes first: $8 - 3(5) = 8 - 15 = -7$.'
          - problem: 'A group splits a bill of $b$ dollars equally among $4$ friends, and each friend also adds a $3$ dollar tip. Each pays $\frac{b}{4} + 3$ dollars. How much does each pay when $b = 84$?'
            answer: '24'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Replace $b$ with $84$. Dividing first gives $84 \div 4 = 21$, and adding the tip gives $21 + 3 = 24$ dollars.'
          - problem: 'Evaluate $\frac{x}{3} - 2$ when $x = 18$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ with $18$. Dividing first gives $18 \div 3 = 6$, and then $6 - 2 = 4$.'
          - problem: 'Evaluate $\frac{3x + 1}{5}$ when $x = 3$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator is $3(3) + 1 = 10$. Dividing by $5$ gives $2$.'
        constraints: "one variable; positive integer inputs; coefficients <= 9; contexts include sharing (division) and fees (multiplication)"
      - id: kp2
        name: "Two variables with whole-number inputs"
        key_prerequisites: [order-of-operations, multiplication-tables]
        exemplars:
          - problem: 'Evaluate $x + 3y$ when $x = 2$ and $y = 4$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Replace $x$ with $2$ and $y$ with $4$ to get $2 + 3(4)$. Then $2 + 12 = 14$.'
          - problem: 'Evaluate $2ab$ when $a = 5$ and $b = 3$.'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adjacent factors mean multiplication, so $2ab$ is $2 \times 5 \times 3$. The product is $30$.'
          - problem: 'The perimeter of a rectangle with width $w$ and length $l$ is $2(w + l)$. What is the perimeter when $w = 4$ cm and $l = 7$ cm?'
            answer: '22'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Add inside the parentheses first: $2(4 + 7) = 2(11)$. The perimeter is $22$ cm.'
          - problem: 'Evaluate $\frac{p - q}{q}$ when $p = 9$ and $q = 3$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator is $9 - 3 = 6$. Dividing by $q = 3$ gives $2$.'
          - problem: 'A car travels $d$ kilometres in $t$ hours, so its average speed is $\frac{d}{t}$ kilometres per hour. What is the speed when $d = 210$ and $t = 3$?'
            answer: '70'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'Replace $d$ with $210$ and $t$ with $3$. The speed is $210 \div 3 = 70$ km/h.'
          - problem: 'A family buys $3$ adult tickets at $a$ dollars each and $2$ child tickets at $c$ dollars each, so the total is $3a + 2c$ dollars. What is the total when $a = 12$ and $c = 7$?'
            answer: '50'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Replace $a$ with $12$ and $c$ with $7$ to get $3(12) + 2(7)$. Then $36 + 14 = 50$ dollars.'
          - problem: 'Sam evaluates $4x - y$ when $x = 3$ and $y = 5$ and writes $4(5) - 3 = 17$. What is the correct value?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam swapped the values. Replace $x$ with $3$ and $y$ with $5$ to get $4(3) - 5 = 12 - 5 = 7$.'
          - problem: 'The mean of two test scores $a$ and $b$ is $\frac{a + b}{2}$. What is the mean when $a = 78$ and $b = 92$?'
            answer: '85'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the scores first: $78 + 92 = 170$. Dividing by $2$ gives the mean $85$.'
        constraints: "two variables; positive integer inputs <= 10 in drills, larger values in contexts; contexts include rates (division) and totals (multiplication)"
    diagnostic_exemplar:
      problem: 'Evaluate $2x + 3y$ when $x = 4$ and $y = 5$.'
      answer: '23'
      solution_sketch: '$8 + 15 = 23$.'
    anki_seeds:
      - front: "A coefficient written next to a variable, as in 3x, means..."
        back: "multiplication: 3x = 3 times x"
        type: basic

  - id: evaluating-expressions
    name: "Evaluating Algebraic Expressions"
    core: true
    difficulty: 0.28
    drill: false
    answer_kind: numeric
    expected_time_secs: 50
    prerequisites:
      - id: substituting-values
        weight: 0.8
        key: true
      - id: integer-multiplication-division
        weight: 0.6
      - id: integer-addition-subtraction
        weight: 0.6
      - id: integer-exponents-intro
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Expressions with exponents"
        key_prerequisites: [substituting-values, integer-exponents-intro]
        exemplars:
          - problem: 'Evaluate $x^2 + y$ when $x = 3$ and $y = 4$.'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square $x$ first: $3^2 = 9$. Then add $y$ to get $9 + 4 = 13$.'
          - problem: 'Evaluate $2a^2$ when $a = 3$.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent applies only to $a$, so square first: $3^2 = 9$. Then $2 \times 9 = 18$.'
          - problem: 'Evaluate $(a + b)^2$ when $a = 2$ and $b = 5$.'
            answer: '49'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base is the whole group, $2 + 5 = 7$. Its square is $7^2 = 49$.'
          - problem: 'A square tile has side $s$ metres. Its area minus its perimeter, taken as plain numbers, is $s^2 - 4s$. What is this difference when $s = 6$?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area value is $6^2 = 36$ and the perimeter value is $4(6) = 24$. The difference is $36 - 24 = 12$.'
          - problem: 'An object dropped from rest falls $5t^2$ metres in $t$ seconds. How far has it fallen after $4$ seconds?'
            answer: '80'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Square the time first: $4^2 = 16$. Then multiply by $5$ to get $80$ metres.'
          - problem: 'When $n$ people each shake hands once with everyone else, the number of handshakes is $\frac{n^2 - n}{2}$. How many handshakes are there when $n = 8$?'
            answer: '28'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Evaluate the numerator first: $8^2 - 8 = 64 - 8 = 56$. Dividing by $2$ gives $28$ handshakes.'
          - problem: 'Sam evaluates $3x^2$ when $x = 4$ and gets $12^2 = 144$. What is the correct value?'
            answer: '48'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent applies only to $x$. So $4^2 = 16$, and $3 \times 16 = 48$.'
          - problem: 'Evaluate $\frac{x^2 + 8}{4}$ when $x = 4$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator is $4^2 + 8 = 16 + 8 = 24$. Dividing by $4$ gives $6$.'
        constraints: "exponents <= 2; positive inputs; contexts include formulas with a square and with a division"
      - id: kp2
        name: "Negative inputs with order of operations"
        key_prerequisites: [integer-addition-subtraction, integer-multiplication-division]
        try_first:
          problem: 'What is the value of $x^2$ when $x = -5$?'
          answer_contract: {"kind":"exact"}
          answer: '25'
          reveal: 'The base is $-5$, and $(-5)(-5) = 25$. A negative number squared is positive, so a negative input needs parentheses.'
        exemplars:
          - problem: 'Evaluate $x^2 - 3x$ when $x = -2$.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute with parentheses: $(-2)^2 - 3(-2) = 4 + 6$. The value is $10$.'
          - problem: 'Evaluate $\frac{a - b}{2}$ when $a = -3$ and $b = 9$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator is $-3 - 9 = -12$. Dividing by $2$ gives $-6$.'
          - problem: 'Evaluate $(-x)^2$ when $x = -4$.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The group $-x$ is $-(-4) = 4$. Squaring it gives $4^2 = 16$.'
          - problem: 'Evaluate $-a^2$ when $a = -3$.'
            answer: '-9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent applies to $a$ before the leading minus. So $(-3)^2 = 9$, and the result is $-9$.'
          - problem: 'To convert a Celsius temperature $C$ to Fahrenheit, compute $\frac{9C}{5} + 32$. What is the Fahrenheit temperature when $C = -10$?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply first: $9(-10) = -90$. Dividing by $5$ gives $-18$, and adding $32$ gives $14$.'
          - problem: 'To convert a Fahrenheit temperature $F$ to Celsius, compute $\frac{5(F - 32)}{9}$. What is the Celsius temperature when $F = -4$?'
            answer: '-20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bracket is $-4 - 32 = -36$. Then $5(-36) = -180$, and dividing by $9$ gives $-20$.'
          - problem: 'Sam evaluates $-x^2 + 3x$ when $x = -2$ and writes $4 - 6 = -2$. What is the correct value?'
            answer: '-10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square the input first: $(-2)^2 = 4$, and the outside minus makes it $-4$. Then $3(-2) = -6$, so the sum is $-10$.'
          - problem: 'Evaluate $x^2 + 4x$ when $x = -5$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute with parentheses: $(-5)^2 + 4(-5) = 25 - 20$. The value is $5$.'
        constraints: "inputs in -9..9 (temperature inputs down to -10); watch the sign of squared negatives; contexts include temperature conversions"
      - id: kp3
        name: "Multi-term expressions with negatives and exponents"
        key_prerequisites: [substituting-values, integer-exponents-intro]
        exemplars:
          - problem: 'Evaluate $2x^2 - x + 1$ when $x = -3$.'
            answer: '22'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute with parentheses: $2(-3)^2 - (-3) + 1 = 18 + 3 + 1$. The value is $22$.'
          - problem: 'Evaluate $-x^2 + 5x + 2$ when $x = -1$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute: $-(-1)^2 + 5(-1) + 2 = -1 - 5 + 2$. The value is $-4$.'
          - problem: 'Sam evaluates $(-x)^2 + 2x - 3$ when $x = -2$ and gets $-11$. What is the correct value?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The group $-x$ equals $2$, so its square is $4$. The three terms give $4 - 4 - 3 = -3$.'
          - problem: 'Evaluate $a^2 - ab - b^2$ when $a = -2$ and $b = 3$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute: $(-2)^2 - (-2)(3) - 3^2 = 4 + 6 - 9$. The value is $1$.'
          - problem: 'The height in metres of a ball above the ground $t$ seconds after a throw is $-5t^2 + 20t + 15$. How high is the ball after $3$ seconds?'
            answer: '30'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Square first: $3^2 = 9$, and the minus makes $-45$. Then $20(3) = 60$, so $-45 + 60 + 15 = 30$ metres.'
          - problem: 'The temperature in degrees Celsius $x$ hours after midnight is $\frac{x^2}{2} - 4x - 6$, and times before midnight are negative. What is the temperature at $x = -2$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The square is $(-2)^2 = 4$, and half of it is $2$. The other terms give $-4(-2) = 8$, so $2 + 8 - 6 = 4$.'
          - problem: 'Evaluate $3 - 2x - x^2$ when $x = -4$.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute: $3 - 2(-4) - (-4)^2 = 3 + 8 - 16$. The value is $-5$.'
          - problem: 'Evaluate $x^2 - xy + y^2$ when $x = -3$ and $y = -2$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product $xy$ is $(-3)(-2) = 6$. So $9 - 6 + 4 = 7$.'
        constraints: "three terms; inputs in -9..9; distinguish -x^2 from (-x)^2; contexts include a projectile height and a temperature model"
    diagnostic_exemplar:
      problem: 'Evaluate $3x^2 - 2x$ when $x = -2$.'
      answer: "16"
      solution_sketch: '$3(4) - 2(-2) = 12 + 4 = 16$.'
    anki_seeds:
      - front: "To evaluate an algebraic expression, first ... then ..."
        back: "substitute the given value(s), then simplify following the order of operations (PEMDAS)"
        type: basic

  - id: translating-phrases-to-expressions
    name: "Translating Phrases into Expressions"
    core: true
    difficulty: 0.24
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: parts-of-an-expression
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Sum and difference phrases"
        key_prerequisites: [parts-of-an-expression]
        exemplars:
          - problem: 'Write an expression: $7$ more than a number $n$.'
            answer: 'n + 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: '"$7$ more than" adds $7$ to the number. The expression is $n + 7$, which can also be written $7 + n$.'
          - problem: 'Write an expression: the difference of a number $x$ and $4$.'
            answer: 'x - 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A difference subtracts the second quantity from the first. The expression is $x - 4$, and $4 - x$ would be a different number.'
          - problem: 'Write an expression: a number $m$ decreased by $9$.'
            answer: 'm - 9'
            answer_contract: {"kind":"exact"}
            solution_sketch: '"Decreased by $9$" takes $9$ away from $m$. The expression is $m - 9$.'
          - problem: 'Write an expression: $6$ less than a number $y$.'
            answer: 'y - 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: '"$6$ less than $y$" starts from $y$ and takes $6$ away. The order reverses from the words, so the expression is $y - 6$.'
          - problem: 'Write an expression: the sum of $12$ and a number $k$.'
            answer: '12 + k'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A sum adds the two quantities. The expression is $12 + k$, which equals $k + 12$.'
          - problem: 'Write an expression: a number $t$ subtracted from $20$.'
            answer: '20 - t'
            answer_contract: {"kind":"exact"}
            solution_sketch: '"Subtracted from $20$" means $20$ is the starting amount. Take $t$ away from it to get $20 - t$.'
        constraints: "one operation; single variable"
      - id: kp2
        name: "Product and quotient phrases"
        key_prerequisites: [parts-of-an-expression]
        exemplars:
          - problem: 'Write an expression: the product of $6$ and $w$.'
            answer: '6w'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Product means multiply. The expression is $6w$, meaning $6$ times $w$.'
          - problem: 'Write an expression: the quotient of $y$ and $5$.'
            answer: 'y/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Quotient means divide the first quantity by the second. The expression is $y/5$.'
          - problem: 'Write an expression: a number $v$ multiplied by $8$.'
            answer: '8v'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying $v$ by $8$ gives $8$ times $v$. The coefficient is written first, so the expression is $8v$.'
          - problem: 'Write an expression: $12$ divided by a number $z$.'
            answer: '12/z'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $12$ is divided, and $z$ is the divisor. The expression is $12/z$, which differs from $z/12$.'
          - problem: 'Write an expression: twice a number $k$.'
            answer: '2k'
            answer_contract: {"kind":"exact"}
            solution_sketch: '"Twice" means two times. The expression is $2k$.'
          - problem: 'Write an expression: half of a number $h$.'
            answer: 'h/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Half of a number divides it by $2$. The expression is $h/2$, which can also be written $\tfrac12 h$.'
        constraints: "one operation; single variable"
      - id: kp3
        name: "Two-operation phrases"
        key_prerequisites: [parts-of-an-expression]
        exemplars:
          - problem: 'Write an expression: $3$ less than twice a number $n$.'
            answer: "2n - 3"
            solution_sketch: '"$3$ less than" reverses the order: start with $2n$, subtract $3$.'
          - problem: 'Write an expression: $5$ more than the product of $4$ and $t$.'
            answer: "4t + 5"
            solution_sketch: 'The product $4t$ comes first, then add $5$.'
          - problem: 'Write an expression: $5$ less than three times a number $m$.'
            answer: "3m - 5"
            solution_sketch: '"$5$ less than" reverses the order: start with $3m$, subtract $5$.'
          - problem: 'Write an expression: $7$ more than the product of $6$ and $w$.'
            answer: "6w + 7"
            solution_sketch: 'The product $6w$ comes first, then add $7$.'
        constraints: "two operations; watch order-reversing phrases (less than, fewer than)"
    diagnostic_exemplar:
      problem: 'Write an expression: $8$ less than three times a number $x$.'
      answer: "3x - 8"
      solution_sketch: '"Three times a number" is $3x$; "$8$ less than" subtracts from it, so the $8$ comes second.'
    anki_seeds:
      - front: "The phrase 'a less than b' translates to..."
        back: "b - a (the order reverses)"
        type: basic

  - id: writing-expressions-from-patterns
    name: "Writing Expressions from Patterns"
    core: false                # translation leaf; translating-phrases stays core
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: translating-phrases-to-expressions
        weight: 0.6
        key: true
      - id: evaluating-expressions
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Expression from a table of values"
        key_prerequisites: [evaluating-expressions]
        try_first:
          problem: 'A table pairs $n = 1, 2, 3$ with the values $7, 10, 13$. What is the value at $n = 4$?'
          answer_contract: {"kind":"exact"}
          answer: '16'
          reveal: 'Each step in $n$ adds $3$, so the next value is $13 + 3 = 16$. That constant step is the coefficient of $n$ in the rule.'
        exemplars:
          - problem: 'A table follows a linear rule and pairs $n = 1, 2, 3$ with $5, 8, 11$. What is the rule for the value at position $n$?'
            answer: '3n + 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step adds $3$, so the rule starts with $3n$. At $n = 1$ this gives $3$, and the table shows $5$, so add $2$. The rule is $3n + 2$.'
          - problem: 'A table follows a linear rule with $(n, v) = (2, 7), (4, 13), (6, 19)$. Write the rule for $v$ in terms of $n$.'
            answer: '3n + 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A change of $2$ in $n$ adds $6$, so each step adds $3$. At $n = 2$, $3n$ gives $6$ and the table shows $7$, so the constant is $1$. The rule is $3n + 1$.'
          - problem: 'A table has $(n, v) = (0, 4)$, and each increase of $1$ in $n$ adds $5$ to $v$. Write the rule for $v$.'
            answer: '5n + 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step adds $5$, so the rule has the part $5n$. At $n = 0$ that part is zero, so the constant is the value $4$. The rule is $5n + 4$.'
          - problem: 'The values of a linear pattern at $n = 1, 2, 3$ are $9, 11, 13$. Sam writes the rule as $2n + 9$. What is the correct rule?'
            answer: '2n + 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The step is $2$, but position $1$ already includes one step. The constant is $9 - 2 = 7$, and the rule $2n + 7$ gives $9$ at $n = 1$.'
          - problem: 'A linear pattern pairs $n = 1, 2, 3$ with $20, 17, 14$. Write the value at position $n$.'
            answer: '23 - 3n'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step subtracts $3$, so the rule has the part $-3n$. At $n = 1$ this gives $-3$, and the table shows $20$, so the constant is $23$. The rule is $23 - 3n$.'
          - problem: 'A taxi fare table pairs $1, 2, 3$ kilometres with fares of $5, 7, 9$ dollars. Write the fare in dollars for $k$ kilometres.'
            answer: '2k + 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each extra kilometre adds $2$ dollars, so the rule has the part $2k$. At $k = 1$ this gives $2$, and the fare is $5$, so there is a fixed charge of $3$. The rule is $2k + 3$.'
          - problem: 'A candle burns down at a steady rate. Its height is $28, 26, 24$ centimetres after $1, 2, 3$ hours. Write its height in centimetres after $t$ hours.'
            answer: '30 - 2t'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The height drops $2$ centimetres each hour, so the rule has the part $-2t$. At $t = 1$ this gives $-2$ and the height is $28$, so the start is $30$. The rule is $30 - 2t$.'
          - problem: 'A linear pattern has the values $14, 22, 30$ at $n = 3, 5, 7$. Write the value at position $n$.'
            answer: '4n + 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A change of $2$ in $n$ adds $8$, so each step adds $4$. At $n = 3$, $4n$ gives $12$ and the table shows $14$, so the constant is $2$. The rule is $4n + 2$.'
          - problem: 'A table pairs $n = 2, 4, 6$ with the values $1, 2, 3$. Write the value at position $n$.'
            answer: 'n/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each value is half of its position, so the rule is $\frac{n}{2}$. A check at $n = 6$ gives $3$, as in the table.'
        constraints: "linear patterns with an integer or half step; check against the first entry; contexts include fares and a candle"
      - id: kp2
        name: "Expression from a real-world rule"
        key_prerequisites: [translating-phrases-to-expressions]
        exemplars:
          - problem: 'A gym charges a joining fee of $20$ euros and $8$ euros per month. Write an expression for the total cost in euros after $m$ months.'
            answer: '8m + 20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The monthly charge is $8$ times the number of months, so $8m$. The joining fee of $20$ is paid once, so the total is $8m + 20$.'
          - problem: 'A toothpick pattern uses $3$ toothpicks for $1$ triangle, $5$ for $2$, and $7$ for $3$, adding $2$ per triangle. Write an expression for the toothpicks in $n$ triangles.'
            answer: '2n + 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each triangle adds $2$ toothpicks, but the first has $3$. Starting from $3$ and adding $2(n - 1)$ gives $3 + 2n - 2 = 2n + 1$.'
          - problem: 'A parking garage charges $5$ euros to enter plus $3$ euros per hour. Write an expression for the total cost in euros after $h$ hours.'
            answer: '3h + 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The hourly rate $3$ is multiplied by the hours, so $3h$. The entry fee of $5$ is paid once, so the total is $3h + 5$.'
          - problem: 'A fence uses $4$ posts for $1$ section, $7$ for $2$ sections, and $10$ for $3$ sections, adding $3$ posts per section. Write an expression for the posts in $n$ sections.'
            answer: '3n + 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each section adds $3$ posts, so the rule has the part $3n$. One section needs $4$ posts, which is $3 + 1$, so the rule is $3n + 1$.'
          - problem: 'A bill of $120$ dollars is shared equally among $n$ people. Write an expression for what each person pays in dollars.'
            answer: '120/n'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sharing equally means dividing the bill by the number of people. Each person pays $\frac{120}{n}$ dollars.'
          - problem: 'A tank holds $500$ litres and drains at $20$ litres per minute. Write an expression for the litres left after $t$ minutes.'
            answer: '500 - 20t'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tank loses $20$ litres each minute, so $20t$ litres leave after $t$ minutes. The litres left are $500 - 20t$.'
          - problem: 'A $60$ metre rope is cut into $n$ equal pieces. Write an expression for the length of each piece in metres.'
            answer: '60/n'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Cutting into equal pieces means dividing the length by the number of pieces. Each piece is $\frac{60}{n}$ metres.'
          - problem: 'A bike hire costs $6$ euros plus $4$ euros per hour. Sam writes the cost after $h$ hours as $10h$. What is the correct expression?'
            answer: '4h + 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam added the fee to the rate, but the fee of $6$ is paid once. Only the rate of $4$ is multiplied by the hours, so the cost is $4h + 6$.'
        constraints: "start value plus constant rate; single variable; contexts include sharing and cutting (division) and decreasing amounts"
    diagnostic_exemplar:
      problem: 'A table pairs $n = 1, 2, 3$ with $7$, $11$, $15$. Write an expression for the value at position $n$.'
      answer: '4n + 3'
      solution_sketch: 'The step is $4$, and at $n = 1$ the value is $7 = 4 + 3$.'
    anki_seeds:
      - front: "In a linear pattern, the number added each step becomes the ... of the expression."
        back: "coefficient of the variable (the constant rate)"
        type: basic

  - id: evaluating-formulas
    name: "Evaluating Formulas"
    core: true
    difficulty: 0.30
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: evaluating-expressions
        weight: 0.7
        key: true
      - id: multiplying-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Geometry formulas"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Use $A = lw$ to find the area of a rectangle with $l = 8$ m and $w = 5$ m.'
            answer: '40'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Substitute $l=8$ and $w=5$ into $A=lw$ to get $A=8(5)$. Multiplying gives $40$, so the area is $40$ square metres.'
          - problem: 'A farmer fences a rectangular field $30$ m long and $18$ m wide. Use $P = 2l + 2w$ to find the length of fence needed.'
            answer: '96'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The fence runs once around the field, so use $P=2l+2w$ with $l=30$ and $w=18$. Then $P=2(30)+2(18)=60+36=96$ metres.'
          - problem: 'Use $A = \frac{1}{2}bh$ to find the area when $b = 10$ and $h = 7$.'
            answer: '35'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $b=10$ and $h=7$ into the formula. Then $A=\frac{1}{2}(10)(7)=\frac{1}{2}(70)=35$.'
          - problem: 'A triangular sail has base $6$ m and height $5$ m. Use $A = \frac{1}{2}bh$ to find its area.'
            answer: '15'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Half the base times the height gives the area of a triangle. Here $A=\frac{1}{2}(6)(5)=15$ square metres.'
          - problem: 'Use $A=(a+b)h/2$ to find the area of a trapezoid with parallel sides $a=5$, $b=9$ and height $h=4$.'
            answer: '28'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Average the parallel sides: $(5+9)/2=7$. Multiplying by the height gives $7(4)=28$.'
          - problem: 'A box is $6$ cm long, $5$ cm wide and $4$ cm high. Use $V = lwh$ to find its volume.'
            answer: '120'
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'Substitute the three edge lengths into $V=lwh$ to get $V=6(5)(4)$. Multiplying gives $120$ cubic centimetres.'
          - problem: 'Mia uses $P = 2l + 2w$ with $l = 9$ and $w = 4$ and writes $P = 2\cdot 9 + 4 = 22$. What is the correct perimeter?'
            answer: '26'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Mia doubled only the length. Both sides must be doubled, so $P=2(9)+2(4)=18+8=26$.'
          - problem: 'Use $A = \pi r^2$ with $\pi \approx 3.14$ to find the area of a circle with radius $10$ cm.'
            answer: '314'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'Square the radius first: $10^2=100$. Then $A=3.14(100)=314$ square centimetres.'
        constraints: "whole-number inputs; area/perimeter formulas"
      - id: kp2
        name: "Rate and science formulas"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'A car drives at $r = 55$ km/h for $t = 3$ hours. Use $d = rt$ to find the distance travelled.'
            answer: '165'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Substitute $r=55$ and $t=3$ into $d=rt$. Then $d=55(3)=165$ kilometres.'
          - problem: 'A train travels $d = 240$ km at a speed of $r = 60$ km/h. Use $t = \frac{d}{r}$ to find the time taken.'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"hour","allow_omitted":true}
            solution_sketch: 'The formula $t=d/r$ divides the distance by the speed. Here $t=240/60=4$ hours.'
          - problem: 'A $6$ kg trolley moves at $4$ m/s. Use $E = \frac{1}{2}mv^2$ to find its kinetic energy in joules.'
            answer: '48'
            answer_contract: {"kind":"unit","quantity":"energy","unit":"joule","allow_omitted":true}
            solution_sketch: 'Square the speed first: $4^2=16$. Then $E=\frac{1}{2}(6)(16)=3(16)=48$ joules.'
          - problem: 'Use $d=at^2/2$ with $a=4$ and $t=3$ to find the distance travelled from rest.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square the time first: $3^2=9$. Then $d=4(9)/2=18$.'
          - problem: 'Use $F=9C/5+32$ to convert a temperature of $10$ degrees Celsius to degrees Fahrenheit.'
            answer: '50'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°F","allow_omitted":true}
            solution_sketch: 'The scaled temperature is $9(10)/5=18$. Adding the offset gives $18+32=50$ degrees Fahrenheit.'
          - problem: 'A cyclist rides $d = 36$ km in $t = 3$ hours. Use $v = \frac{d}{t}$ to find the average speed.'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'Average speed is distance divided by time. Here $v=36/3=12$ kilometres per hour.'
          - problem: 'A bank pays simple interest $I = Prt$. Find the interest in euros on $P = 500$ euros at $r = 0.04$ for $t = 3$ years.'
            answer: '60'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Multiply the three values: $I=500(0.04)(3)=20(3)=60$. The interest is $60$ euros.'
          - problem: 'Leo uses $d=at^2/2$ with $a=8$ and $t=3$ and writes $d=(8\cdot3)^2/2=288$. What is the correct distance?'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Leo squared the product $at$ instead of only $t$. The correct order is $3^2=9$, then $d=8(9)/2=36$.'
        constraints: "inputs chosen so fraction coefficients produce whole numbers"
    diagnostic_exemplar:
      problem: 'Use $E = \frac{1}{2}mv^2$ to find the kinetic energy in joules when $m = 4$ and $v = 5$.'
      answer: '50'
      answer_contract: {"kind":"unit","quantity":"energy","unit":"joule","allow_omitted":true}
      solution_sketch: '$E = \frac{1}{2}(4)(5^2) = 2 \times 25 = 50$.'
    anki_seeds:
      - front: "A formula is an equation that..."
        back: "states a relationship between quantities; evaluate it by substituting known values"
        type: basic

  - id: combining-like-terms
    name: "Combining Like Terms"
    core: true
    difficulty: 0.30
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: integer-addition-subtraction
        weight: 0.7
        key: true
      - id: parts-of-an-expression
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Combine like terms with positive coefficients"
        key_prerequisites: [parts-of-an-expression]
        exemplars:
          - problem: 'Simplify $3x + 5x$.'
            answer: '8x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Both terms have the variable part $x$, so they are like terms. Add the coefficients: $3+5=8$, so the sum is $8x$.'
          - problem: 'Simplify $7a+2a+4a$.'
            answer: '13a'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'All three terms have the variable part $a$. Add the coefficients: $7+2+4=13$, so the sum is $13a$.'
          - problem: 'A triangle has sides of length $2x$, $3x$ and $4x$. Find its perimeter.'
            answer: '9x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The perimeter is the sum of the three sides. Adding $2x+3x+4x$ gives $(2+3+4)x=9x$.'
          - problem: 'Ana buys $7$ pens and Ben buys $4$ pens, all at $p$ euros each. Write an expression for what they spend together.'
            answer: '11p'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Together they buy $7+4=11$ pens, each costing $p$ euros. The total is $7p+4p=11p$ euros.'
          - problem: 'Tom writes $4y+6y=10y^2$. What is the correct simplified expression for $4y+6y$?'
            answer: '10y'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Adding like terms adds the coefficients and leaves the variable part unchanged. So $4y+6y=(4+6)y=10y$, with no square.'
          - problem: 'Simplify $5m+m+2m$.'
            answer: '8m'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The term $m$ has coefficient $1$, so the coefficients are $5+1+2$. Their sum is $8$, giving $8m$.'
          - problem: 'A rectangle is $5x$ cm long and $2x$ cm wide. Find its perimeter.'
            answer: '14x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Add the four sides: $5x+2x+5x+2x$. The coefficients add to $14$, so the perimeter is $14x$ centimetres.'
        constraints: "single variable; positive coefficients <= 9"
      - id: kp2
        name: "Negative coefficients and subtraction"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $8y - 3y$.'
            answer: '5y'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Both terms have the variable part $y$. Subtract the coefficients: $8-3=5$, so the result is $5y$.'
          - problem: 'Simplify $-4x-5x+2x$.'
            answer: '-7x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'All three terms have the variable part $x$, so add their signed coefficients. We get $-4-5+2=-7$, so the result is $-7x$.'
          - problem: 'A balance changes by $-7x$, then by $+2x$, then by $-x$. Find the net change.'
            answer: '-6x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The net change is the sum of the three signed changes. The last coefficient is $-1$, so $-7+2-1=-6$ and the net change is $-6x$.'
          - problem: 'Dee writes $5a-8a=3a$. What is the correct value of $5a-8a$?'
            answer: '-3a'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Subtracting $8a$ from $5a$ gives $(5-8)a$. Since $5-8=-3$, the correct value is $-3a$, not $3a$.'
          - problem: 'A stall starts the day with $12c$ cups, sells $4c$ cups in the morning and $5c$ cups in the afternoon. How many cups are left?'
            answer: '3c'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Selling cups takes them away, so subtract: $12c-4c-5c=(12-4-5)c$. That leaves $3c$ cups.'
          - problem: 'Simplify $-x-6x+2x$.'
            answer: '-5x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The term $-x$ has coefficient $-1$, so add $-1-6+2$. The sum is $-5$ and the result is $-5x$.'
          - problem: 'During one day the temperature changes by $+6t$, $-9t$ and $-4t$ degrees. Find the total change.'
            answer: '-7t'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Add the three signed changes: $6-9-4=-7$. The temperature falls overall, so the total change is $-7t$ degrees.'
        constraints: "results may be negative; single variable"
      - id: kp3
        name: "Multiple variable types and constants"
        key_prerequisites: [integer-addition-subtraction, parts-of-an-expression]
        exemplars:
          - problem: 'Simplify $3x+2y+4+5x-y-7$.'
            answer: '8x+y-3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Group the terms by variable part: $(3+5)x+(2-1)y+(4-7)$. This simplifies to $8x+y-3$.'
          - problem: 'Three boxes hold $2x+3y+1$, $x-y+4$ and $3x+2y-2$ marbles. How many marbles are there in all?'
            answer: '6x+4y+3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Add the three expressions. The coefficients of $x$ sum to $2+1+3=6$, those of $y$ to $3-1+2=4$, and the constants to $1+4-2=3$.'
          - problem: 'Simplify $5x^2+3x-2+x^2-7x+6$.'
            answer: '6x^2-4x+4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Collect the $x^2$ terms, the $x$ terms and the constants: $(5+1)x^2+(3-7)x+(-2+6)=6x^2-4x+4$.'
          - problem: 'Pam combines $4x-2y+3-6x+5y-1$ into $x+2$. What is the correct simplified expression?'
            answer: '-2x+3y+2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Different variable parts stay separate. The three sums are $(4-6)x=-2x$, $(-2+5)y=3y$ and $3-1=2$.'
          - problem: 'A triangle has sides $2x+1$, $3x-2$ and $x+6$. Find its perimeter.'
            answer: '6x+5'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The perimeter is the sum of the sides. The $x$ terms give $2+3+1=6$ and the constants give $1-2+6=5$, so the perimeter is $6x+5$.'
          - problem: 'Ana spends $3n+2p$ euros on Monday and $4n+5p$ euros on Tuesday, then gets $6$ euros back. Write her total spending.'
            answer: '7n+7p-6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Add the two days: $(3+4)n+(2+5)p=7n+7p$. Subtracting the $6$ euros returned gives $7n+7p-6$.'
          - problem: 'Simplify $2a^2+5a-3a^2-a+4$.'
            answer: '-a^2+4a+4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The $a^2$ terms give $2-3=-1$, so $-a^2$. The $a$ terms give $5-1=4$, and the constant is $4$, so the result is $-a^2+4a+4$.'
        constraints: "two variable types plus constants; keep unlike terms separate"
    diagnostic_exemplar:
      problem: 'Simplify $5x + 3 - 2x + 8$.'
      answer: "3x + 11"
      solution_sketch: '$(5x - 2x) + (3 + 8) = 3x + 11$.'
    anki_seeds:
      - front: "Like terms are terms that ..."
        back: "have the same variable(s) raised to the same power; combine them by adding/subtracting their coefficients"
        type: basic

  - id: distributive-property
    name: "The Distributive Property"
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: integer-multiplication-division
        weight: 0.7
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Distribute a positive factor over a sum"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Expand $3(x + 4)$.'
            answer: '3x+12'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The factor $3$ multiplies both terms in the bracket: $3(x+4)=3x+3(4)=3x+12$.'
          - problem: 'A rectangle is $4$ m high and $2x+3$ m wide. Write its area without brackets.'
            answer: '8x+12'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The area is the height times the width, $4(2x+3)$. Multiply the height by both parts of the width: $4(2x)+4(3)=8x+12$.'
          - problem: 'Ravi writes $5(x+2)=5x+2$. What is the correct expansion of $5(x+2)$?'
            answer: '5x+10'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The outer factor multiplies both terms inside the bracket, not only the first. So $5(x+2)=5x+5(2)=5x+10$.'
          - problem: 'Expand $(x+6)\cdot2$.'
            answer: '2x+12'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The order of the factors does not matter, so this equals $2(x+6)$. Distributing gives $2x+2(6)=2x+12$.'
          - problem: 'Four friends each buy a ticket that costs $t$ euros and a snack that costs $3$ euros. Write their total cost without brackets.'
            answer: '4t+12'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Each friend pays $t+3$ euros, and there are $4$ friends, so the total is $4(t+3)$. Distributing gives $4t+12$ euros.'
          - problem: 'A rope of length $6x+10$ metres is cut into two equal pieces. Write the length of one piece as a sum of terms.'
            answer: '3x+5'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Each piece is half of the rope, so its length is $\frac{1}{2}(6x+10)$. Halving both terms gives $3x+5$ metres.'
          - problem: 'Expand $6(a+3b)$.'
            answer: '6a+18b'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The factor $6$ multiplies both terms: $6(a)+6(3b)$. This gives $6a+18b$.'
        constraints: "positive factor; two-term binomial"
      - id: kp2
        name: "Negative multipliers and subtraction"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Expand $-2(x - 5)$.'
            answer: '-2x+10'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Multiply both terms by $-2$. Then $-2\cdot x=-2x$ and $-2\cdot(-5)=+10$, so the result is $-2x+10$.'
          - problem: 'Expand $-(3y + 7)$.'
            answer: '-3y-7'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'A leading minus means multiplication by $-1$: $(-1)(3y)+(-1)(7)=-3y-7$. Both signs inside the bracket reverse.'
          - problem: 'Expand $-3(2x+5)$.'
            answer: '-6x-15'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Both products are negative because the factor is negative. So $(-3)(2x)+(-3)(5)=-6x-15$.'
          - problem: 'Kim writes $-(4-x)=-4-x$. What is the correct expansion of $-(4-x)$?'
            answer: 'x-4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Multiplying $-x$ by $-1$ gives $+x$, which Kim missed. So $(-1)(4)+(-1)(-x)=-4+x=x-4$.'
          - problem: 'A customer''s balance changes by $-3$ euros for each of $n+4$ items bought. Write the change in the balance without brackets.'
            answer: '-3n-12'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The total change is $-3(n+4)$. Multiplying both terms by $-3$ gives $-3n-12$ euros.'
          - problem: 'A submarine changes its height by $-4$ m each minute for $t-3$ minutes. Write its total change in height without brackets.'
            answer: '-4t+12'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The change is $-4(t-3)$. Multiplying gives $-4t$ and $(-4)(-3)=+12$, so the result is $-4t+12$ metres.'
          - problem: 'Expand $-\frac{1}{2}(4x-6)$.'
            answer: '-2x+3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Multiply both terms by $-\frac{1}{2}$. Then $-\frac{1}{2}(4x)=-2x$ and $-\frac{1}{2}(-6)=+3$, so the result is $-2x+3$.'
          - problem: 'Expand $-4(3-2y)$.'
            answer: '8y-12'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Multiply both terms by $-4$: $(-4)(3)=-12$ and $(-4)(-2y)=+8y$. So the result is $8y-12$.'
        constraints: "negative factor or leading minus; watch both signs"
      - id: kp3
        name: "Distribute then combine like terms"
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Expand and simplify $2(x + 3) + 4x$.'
            answer: '6x+6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Distribute first: $2x+6+4x$. Combining $2x+4x$ gives $6x+6$.'
          - problem: 'Expand and simplify $3(a - 2) - (a + 1)$.'
            answer: '2a-7'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Distribute: $3a-6-a-1$, where the leading minus reverses both signs of $a+1$. Combining gives $2a-7$.'
          - problem: 'Subtract $2(x-5)$ from $3x+1$ and simplify.'
            answer: 'x+11'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Write the difference as $(3x+1)-2(x-5)$. Distributing gives $3x+1-2x+10$, which simplifies to $x+11$.'
          - problem: 'A rectangle has length $2x+1$ and width $x+3$. Find its perimeter.'
            answer: '6x+8'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The perimeter is $2(2x+1)+2(x+3)$. The products give $4x+2+2x+6$, and collecting like terms gives $6x+8$.'
          - problem: 'Three tickets cost $x+4$ euros each and two tickets cost $x-1$ euros each. Write the total cost in euros as a simplified expression.'
            answer: '5x+10'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The total is $3(x+4)+2(x-1)$. Distributing gives $3x+12+2x-2$, which simplifies to $5x+10$.'
          - problem: 'Expand and simplify $4(2y-1)-3(y-2)$.'
            answer: '5y+2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Distribute: $8y-4-3y+6$. Collecting like terms gives $5y+2$.'
          - problem: 'Expand and simplify $\frac{1}{2}(8x+4)+3(x-1)$.'
            answer: '7x-1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The first product is $4x+2$ and the second is $3x-3$. Their sum is $7x-1$.'
          - problem: 'Lena simplifies $6-2(x-3)$ as $4(x-3)=4x-12$. What is the correct simplified expression?'
            answer: '-2x+12'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Lena subtracted $2$ from $6$ before multiplying, which breaks the order of operations. Distribute first: $6-2x+6=-2x+12$.'
        constraints: "combine after distributing; single variable"
    diagnostic_exemplar:
      problem: 'Expand and simplify $5 - 3(x - 2)$.'
      answer: '-3x + 11'
      solution_sketch: '$5 - 3x + 6 = -3x + 11$.'
    anki_seeds:
      - front: "Distributive property: a(b + c) = ?"
        back: "ab + ac"
        type: basic

  - id: factoring-linear-expressions
    name: "Factoring Linear Expressions"
    core: false                # early GCF drill; factoring-gcf stays core
    difficulty: 0.34
    drill: false
    answer_kind: expression
    expected_time_secs: 70
    prerequisites:
      - id: distributive-property
        weight: 0.7
        key: true
      - id: gcf-lcm
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Factor out the GCF"
        key_prerequisites: [distributive-property, gcf-lcm]
        try_first:
          problem: 'The expression $12x+20$ is equal to $k(3x+5)$. What number is $k$?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'Multiplying $4$ by $3x$ and by $5$ gives back $12x+20$, so $k=4$. Factoring runs distribution backwards: find the number every term shares and divide it out.'
        exemplars:
          - problem: "Factor $6x+9$ by its GCF and check by expanding."
            answer: "3(2x+3)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The integer GCF is $3$; divide both terms by it to get $2x$ and $3$. Expansion multiplies back to $6x+9$."
          - problem: "A rectangle has area $8x+12$ and integer height equal to the GCF of the two coefficients. Factor its area and check."
            answer: "4(2x+3)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The GCF of $8$ and $12$ is $4$, giving width $2x+3$. Multiplying height by width returns $8x+12$."
          - problem: 'Ana factors $10x+15$ as $5(2x+15)$. Write the correct factorization.'
            answer: '5(2x+3)'
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: 'Every term must be divided by the GCF $5$, and $15/5=3$, so the bracket is $2x+3$. Ana divided only the $x$-term; expanding $5(2x+3)$ gives back $10x+15$.'
          - problem: "Factor the difference $14x-21$ by its GCF and expand to check."
            answer: "7(2x-3)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The GCF is $7$. Dividing gives $2x-3$, and distribution gives $14x-21$, including the negative constant."
        constraints: "two terms; GCF between 2 and 9; verify by expanding"
      - id: kp2
        name: "Factor with negatives and two variables"
        key_prerequisites: [distributive-property, gcf-lcm]
        exemplars:
          - problem: "Factor $-4x-8$ by extracting $-4$, then check."
            answer: "-4(x+2)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The quotients are $x$ and $2$. Expanding multiplies each by $-4$, restoring $-4x-8$."
          - problem: "Factor $12x+18y$ by the GCF and check both terms."
            answer: "6(2x+3y)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "The integer GCF is $6$; division yields $2x$ and $3y$. The products recover $12x$ and $18y$."
          - problem: 'Factor $-3$ out of $-6x+9y$.'
            answer: '-3(2x-3y)'
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: 'Divide each term by $-3$: $-6x/(-3)=2x$ and $9y/(-3)=-3y$. So the result is $-3(2x-3y)$, and expanding restores $+9y$ because a negative times a negative is positive.'
          - problem: "A learner writes $-8x-12y=-4(2x-3y)$. Correct the factorization and expand to check."
            answer: "-4(2x+3y)"
            answer_contract: {"kind": "required_form", "form": "factored_linear"}
            solution_sketch: "Both original terms are negative; dividing each by $-4$ gives positive quotients $2x$ and $3y$. Distribution therefore restores both negative terms."
        constraints: "GCF may be negative; expand to check both signs"
    diagnostic_exemplar:
      problem: 'Factor $9x + 15y$.'
      answer: "3(3x + 5y)"
      solution_sketch: 'The GCF of $9$ and $15$ is $3$: $3(3x + 5y)$.'
    anki_seeds:
      - front: "Factoring a linear expression is the reverse of..."
        back: "distributing: pull the GCF out front and divide each term by it"
        type: basic

  - id: equivalent-expressions
    name: "Identifying Equivalent Expressions"
    core: false                # recognition leaf; distributive/like-terms stay core
    difficulty: 0.34
    drill: false
    answer_kind: expression
    expected_time_secs: 75
    prerequisites:
      - id: distributive-property
        weight: 0.6
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: substituting-values
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Decide equivalence by simplifying"
        key_prerequisites: [distributive-property, combining-like-terms]
        exemplars:
          - problem: 'Are $4(x + 3)$ and $4x + 3$ equivalent?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, they are","they are","equivalent","they are equivalent"],["no","no, they are not","they are not","not equivalent","they are not equivalent"]]}
            solution_sketch: 'Distributing gives $4(x+3)=4x+12$. The constant terms $12$ and $3$ differ, so the expressions are not equivalent; at $x=0$ they give $12$ and $3$.'
          - problem: 'Are $2(3x - 5) - 4x$ and $2x - 10$ equivalent?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","yes, they are","they are","equivalent","they are equivalent"],["no","no, they are not","they are not","not equivalent","they are not equivalent"]]}
            solution_sketch: 'Distributing gives $6x-10-4x$, and combining the $x$-terms gives $2x-10$. The simplified form matches the second expression, so they are equivalent for every $x$.'
          - problem: 'Which of $3x + 8$, $3x - 8$ and $7x + 8$ is equivalent to $5x - 2(x - 4)$?'
            answer: '3x + 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Distributing gives $-2(x-4)=-2x+8$, so the expression is $5x-2x+8=3x+8$. The choice $3x-8$ comes from a sign error with $-2\cdot(-4)$, and $7x+8$ from adding $2x$.'
          - problem: 'Find $k$ so that $k(x + 5) - 2x$ is equivalent to $5x + 35$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expanding gives $kx+5k-2x=(k-2)x+5k$. Matching the $x$-coefficients gives $k-2=5$, so $k=7$, and the constant $5k=35$ agrees.'
          - problem: 'What number goes in the box so that $6x - 3(x - \square) = 3x + 12$ for every $x$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Expanding gives $6x-3x+3\cdot\square=3x+3\cdot\square$. The constants must match, so $3\cdot\square=12$ and the box holds $4$.'
          - problem: 'Find the number $b$ that makes $3(x - 2) + 5$ equivalent to $3x + b$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Distributing gives $3x-6+5$, and the constants combine to $-1$. So $3(x-2)+5=3x-1$ for every $x$, and $b=-1$.'
        constraints: "one expression simplifies (or fails to) into the other; single variable"
      - id: kp2
        name: "Simplify to a standard equivalent form"
        key_prerequisites: [distributive-property, combining-like-terms]
        exemplars:
          - problem: "Write $4(2x - 1) + 3$ in the form $ax + b$."
            answer: "8x - 1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$8x - 4 + 3 = 8x - 1$."
          - problem: "Write $5(x + 2) - 3(x - 1)$ in the form $ax + b$."
            answer: "2x + 13"
            answer_contract: {"kind": "exact"}
            solution_sketch: "$5x + 10 - 3x + 3 = 2x + 13$."
          - problem: "A rectangle has sides $x+3$ and $2x-1$. Express its perimeter in the form $ax+b$."
            answer: "6x+4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Expand $2(x+3)+2(2x-1)=2x+6+4x-2$, then combine to get $6x+4$."
          - problem: 'Sam simplifies $3(x-2)+x$ to $3x-2$. Write the correct simplification in the form $ax+b$.'
            answer: '4x-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Distributing gives $3x-6+x$, because the $3$ multiplies the $-2$ as well. The $x$-terms add to $4x$ and the constant stays $-6$, so the result is $4x-6$.'
        constraints: "distribute and combine; integer coefficients"
    diagnostic_exemplar:
      problem: 'Write $3(2x + 1) - 2(x - 4)$ in the form $ax + b$.'
      answer: "4x + 11"
      solution_sketch: '$6x + 3 - 2x + 8$; note $-2(-4) = +8$.'
    anki_seeds:
      - front: "Two expressions are equivalent when..."
        back: "they take the same value for every value of the variable (simplifying one yields the other)"
        type: basic
      - front: "A quick way to show two expressions are NOT equivalent:"
        back: "find one value of the variable where they evaluate differently"
        type: basic

  - id: checking-a-solution
    name: "Checking a Solution to an Equation"
    core: true
    difficulty: 0.26
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: substituting-values
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Verify a value by substitution"
        key_prerequisites: [substituting-values]
        exemplars:
          - problem: 'Is $x = -3$ a solution of $3x + 4 = -5$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","x=-3 is a solution","it is a solution","x = -3 is a solution","yes it is","yes, it is a solution"],["no","no, it is not","it is not","not a solution","is not a solution","it is not a solution","x = -3 is not a solution","no it is not"]]}
            solution_sketch: 'Substituting gives $3(-3)+4=-9+4=-5$ on the left. That equals the right side $-5$, so $x=-3$ is a solution.'
          - problem: 'Kai says $x = 4$ solves $-3x + 9 = 3$. Is Kai right?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","kai is wrong","he is wrong","not a solution","no, kai is wrong","kai is not right","no it isn't","no, kai is not right"],["yes","kai is right","he is right","it is a solution","yes, kai is right","yes, it is","kai is correct","yes, kai is correct"]]}
            solution_sketch: 'Substitute $x = 4$: the left side is $-3(4) + 9 = -12 + 9 = -3$, not $3$. So Kai is wrong; the solution is $x = 2$.'
          - problem: '$x = 5$ is a solution of $ax - 7 = 8$. Find $a$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substituting $x=5$ gives $5a-7=8$. Then $5a=15$, so $a=3$; check: $3(5)-7=8$.'
          - problem: '$x = -1$ is a solution of $2x + k = 9$. Find $k$.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substituting $x=-1$ gives $2(-1)+k=9$, so $-2+k=9$. Therefore $k=11$, and $2(-1)+11=9$ checks it.'
          - problem: 'A gym charges $12$ euros to join plus $5$ euros per visit, so $5v+12=47$ describes a total of $47$ euros. Zoe says $v=6$ is the number of visits. What total does $v=6$ give?'
            answer: '42'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Substitute $v=6$ into the left side: $5(6)+12=30+12=42$. This is not $47$, so Zoe is wrong.'
          - problem: 'The water in a tank is $90-6t$ litres after $t$ minutes. Mo says the tank is empty when $t=15$. How many litres does the formula give at $t=15$?'
            answer: '0'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Substitute $t=15$: $90-6(15)=90-90=0$. The formula gives $0$ litres, so the tank is empty and Mo is right.'
          - problem: 'Replace the $-15$ in $6x + 2 = -15$ by a number so that $x = -2$ becomes a solution. Which number works?'
            answer: '-10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Substitute $x = -2$ into the left side: $6(-2) + 2 = -12 + 2 = -10$. So $x = -2$ solves $6x + 2 = -10$, and it does not solve the original equation with $-15$.'
        constraints: "one- or two-step equations; integer candidates in -9..9"
      - id: kp2
        name: "Pick the solution from candidates"
        key_prerequisites: [substituting-values]
        exemplars:
          - problem: 'Which of $x = 2$, $x = 3$, $x = 4$ solves $5x - 6 = 9$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left sides are $5(2)-6=4$, $5(3)-6=9$ and $5(4)-6=14$. Only $x=3$ gives the right side $9$.'
          - problem: 'Test $x=-2$, $x=0$ and $x=2$ in $x^2+x=6$. Which candidate works?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left sides are $2$, $0$ and $6$, found by squaring each candidate and adding it. Only $x=2$ gives $6$.'
          - problem: 'A machine maps $x$ to $3(x-1)$. Which input $1$, $2$ or $4$ produces $9$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The outputs are $3(0)=0$, $3(1)=3$ and $3(3)=9$. Only input $4$ produces $9$.'
          - problem: 'Which of $-6$, $-3$ or $6$ solves $x/3=-2$?'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing the candidates by $3$ gives $-2$, $-1$ and $2$. The first matches the right side, so the solution is $-6$.'
          - problem: 'Which of $-1$, $2$, $5$ is a solution of $3(x - 1) = 12$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The left side is $3(-2)=-6$ for $-1$, $3(1)=3$ for $2$, and $3(4)=12$ for $5$. Only $x=5$ gives $12$.'
          - problem: 'Which of $x = -4$, $x = -1$, $x = 4$ solves $2x + 5 = x + 1$?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $x=-4$ both sides equal $-3$. For $x=-1$ the sides are $3$ and $0$, and for $x=4$ they are $13$ and $5$, so only $x=-4$ works.'
          - problem: 'A phone plan costs $15+2g$ euros for $g$ gigabytes. Which of $g=4$, $g=5$, $g=6$ gives a bill of $27$ euros?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bills are $15+2(4)=23$, $15+2(5)=25$ and $15+2(6)=27$. Only $g=6$ gives $27$ euros.'
          - problem: '$48$ euros are shared equally among $n$ people, so each person gets $48/n$ euros. Which of $n=4$, $n=6$, $n=8$ gives $6$ euros each?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The shares are $48/4=12$, $48/6=8$ and $48/8=6$ euros. Only $n=8$ gives $6$ euros each.'
        constraints: "three candidates; exactly one works"
    diagnostic_exemplar:
      problem: 'Which of $x = -2$, $x = 1$, $x = 3$ solves $4x - 5 = -1$?'
      answer: '1'
      solution_sketch: '$4(1) - 5 = -1$; the other candidates give $-13$ and $7$.'
    anki_seeds:
      - front: "A value is a solution of an equation when..."
        back: "substituting it makes both sides equal"
        type: basic

  - id: addition-subtraction-equations
    name: "Addition and Subtraction Equations"
    core: true
    difficulty: 0.24
    drill: true
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: integer-addition-subtraction
        weight: 0.7
        key: true
      - id: checking-a-solution
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: "Solve x + a = b"
        key_prerequisites: [integer-addition-subtraction]
        try_first:
          problem: 'A box holds some marbles. After $8$ more marbles are put in, the box holds $20$. How many marbles were in the box at first?'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'You undid the adding by taking $8$ away from the total: $20-8=12$. The same move solves $x+8=20$.'
        exemplars:
          - problem: 'Solve $x + 7 = 12$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'To undo the addition of $7$, subtract $7$ from both sides. This leaves $x = 12 - 7 = 5$.'
          - problem: 'Mia has some stickers. A friend gives her $9$ more, and now she has $24$. How many stickers did Mia have at first?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Mia''s stickers plus $9$ make $24$, so $x + 9 = 24$. Subtract $9$ from both sides: $x = 24 - 9 = 15$.'
          - problem: 'Solve $x + 13 = 4$.'
            answer: '-9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $13$ from both sides: $x = 4 - 13$. The result is $x = -9$, a negative number.'
          - problem: 'During the night the temperature rose by $6$ degrees and reached $-2$ °C. What was the temperature before it rose?'
            answer: '-8'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The rise of $6$ gives $x + 6 = -2$. Subtract $6$ from both sides: $x = -2 - 6 = -8$.'
          - problem: 'Sam solves $x + 5 = -2$ and writes $x = 3$. What is the correct value of $x$?'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'To undo $+5$, subtract $5$ from both sides, not from only one side. Then $x = -2 - 5 = -7$.'
          - problem: 'A lift goes up $4$ floors and stops at floor $-1$. Which floor did it start from?'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The start floor $x$ and the $4$ floors up give $x + 4 = -1$. Subtract $4$: $x = -1 - 4 = -5$.'
          - problem: 'Solve $x + (-6) = 8$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adding $-6$ is the same as subtracting $6$, so undo it by adding $6$. Then $x = 8 + 6 = 14$.'
          - problem: 'A plank is joined end to end with a $45$ cm plank, and together they measure $120$ cm. How long is the first plank?'
            answer: '75'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The two lengths add up to the total, so $x + 45 = 120$. Subtract $45$: $x = 120 - 45 = 75$ cm.'
        constraints: "subtract to undo addition; integer solutions"
      - id: kp2
        name: "Solve x - a = b"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Solve $x - 6 = 10$.'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'To undo the subtraction of $6$, add $6$ to both sides. This gives $x = 10 + 6 = 16$.'
          - problem: 'Tom spent $12$ dollars at the fair and has $9$ dollars left. How much money did he have before the fair?'
            answer: '21'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Tom''s money minus the $12$ spent leaves $9$, so $x - 12 = 9$. Add $12$ to both sides: $x = 9 + 12 = 21$ dollars.'
          - problem: 'Solve $x - 8 = -5$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add $8$ to both sides to undo the subtraction. Then $x = -5 + 8 = 3$.'
          - problem: 'During the day the temperature fell by $9$ degrees and reached $-4$ °C. What was the temperature before the fall?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The fall of $9$ gives $x - 9 = -4$. Add $9$ to both sides: $x = -4 + 9 = 5$.'
          - problem: 'Ana solves $x - 4 = 11$ and writes $x = 7$. What is the correct value of $x$?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $4$ is subtracted from $x$, so it must be added to both sides, not taken away again. Then $x = 11 + 4 = 15$.'
          - problem: 'A baker sold $35$ rolls and has $48$ rolls left. How many rolls did the baker have at the start?'
            answer: '83'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The start amount minus the $35$ sold leaves $48$, so $x - 35 = 48$. Add $35$: $x = 48 + 35 = 83$.'
          - problem: 'Solve $x - (-3) = 10$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $-3$ is the same as adding $3$, so $x + 3 = 10$. Subtract $3$ to get $x = 7$.'
          - problem: 'A piece $15$ m long is cut off a rope, and $28$ m of rope remain. How long was the rope before it was cut?'
            answer: '43'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The rope minus the $15$ m piece leaves $28$ m, so $x - 15 = 28$. Add $15$: $x = 28 + 15 = 43$ m.'
        constraints: "add to undo subtraction; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $x + 9 = 2$.'
      answer: "-7"
      solution_sketch: 'Subtract $9$: $x = -7$.'
    anki_seeds:
      - front: "To undo adding a number to the variable, ..."
        back: "subtract that number from both sides (and vice versa)"
        type: basic

  - id: one-step-equations
    name: "One-Step Equations"
    core: true
    difficulty: 0.28
    drill: true
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: addition-subtraction-equations
        weight: 0.7
        key: true
      - id: integer-multiplication-division
        weight: 0.7
        key: true
      - id: checking-a-solution
        weight: 0.3
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Solve by dividing"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Solve $3x = 21$.'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $3$ multiplies $x$, so divide both sides by $3$. This gives $x = 21/3 = 7$.'
          - problem: 'Seven equal packets hold $42$ beads altogether. How many beads are in one packet?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $42$ beads are shared equally among $7$ packets, so $7x = 42$. Divide by $7$: $x = 6$.'
          - problem: 'For $f(x) = -3x$, which input gives the output $18$?'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $-3x = 18$. Divide both sides by $-3$, which gives $x = -6$.'
          - problem: 'A rectangle has area $54$ cm$^2$ and width $6$ cm. How long is the rectangle?'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Area is length times width, so $6x = 54$. Divide by $6$: $x = 9$ cm.'
          - problem: 'Sam solves $4x = 20$ and writes $x = 80$. What is the correct value of $x$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $4$ multiplies $x$, so it is undone by dividing, not by multiplying. Then $x = 20/4 = 5$.'
          - problem: 'Each ticket costs $8$ dollars. Ana pays $64$ dollars for tickets. How many tickets does she buy?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of tickets times $8$ equals the total, so $8x = 64$. Divide by $8$: $x = 8$ tickets.'
          - problem: 'Four friends each pay the same amount, and together they pay $52$ dollars. How much does each friend pay?'
            answer: '13'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The total is four times one payment, so $4x = 52$. Divide by $4$: $x = 13$ dollars.'
          - problem: 'A cyclist rides for $5$ hours at a steady speed and covers $85$ km. What is the speed?'
            answer: '17'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"km/h","allow_omitted":true}
            solution_sketch: 'Distance is speed times time, so $5x = 85$. Divide by $5$: $x = 17$ km/h.'
        constraints: "exact integer solutions; coefficients <= 9"
      - id: kp2
        name: "Solve division forms by multiplying"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Solve $\frac{x}{5} = 4$.'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $x$ is divided by $5$, so multiply both sides by $5$. This gives $x = 4 \cdot 5 = 20$.'
          - problem: 'A box of sweets is shared equally among $6$ children, and each child gets $4$ sweets. How many sweets were in the box?'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One share is $x/6 = 4$. Multiply both sides by $6$: $x = 4 \cdot 6 = 24$ sweets.'
          - problem: 'Solve $\frac{x}{-3} = 6$.'
            answer: '-18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply both sides by $-3$. Then $x = 6 \cdot (-3) = -18$.'
          - problem: 'A machine divides its input by $8$, and its output is $2$. What was the input?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The machine gives $x/8 = 2$. Multiply the output by $8$ to get the input: $x = 16$.'
          - problem: 'Lena solves $\frac{x}{4} = 12$ and writes $x = 3$. What is the correct value of $x$?'
            answer: '48'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $x$ is divided by $4$, so it is undone by multiplying, not dividing. Then $x = 12 \cdot 4 = 48$.'
          - problem: 'Water in a tank is poured equally into $7$ buckets, and each bucket gets $3$ litres. How much water was in the tank?'
            answer: '21'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"L","allow_omitted":true}
            solution_sketch: 'One bucket holds $x/7 = 3$ litres. Multiply by $7$: $x = 3 \cdot 7 = 21$ litres.'
          - problem: 'Solve $\frac{x}{-9} = -2$.'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply both sides by $-9$. Two negative factors give a positive product, so $x = (-2)(-9) = 18$.'
          - problem: 'A ribbon is cut into $5$ equal pieces, and each piece is $12$ cm long. How long was the ribbon?'
            answer: '60'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'One piece is $x/5 = 12$ cm. Multiply by $5$: $x = 12 \cdot 5 = 60$ cm.'
        constraints: "divisors from -9 to 9; integer solutions"
      - id: kp3
        name: "Mixed one-step equations, negative coefficients"
        key_prerequisites: [integer-multiplication-division, addition-subtraction-equations]
        exemplars:
          - problem: 'Solve $-4x = -24$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide both sides by $-4$. A negative divided by a negative is positive, so $x = 6$.'
          - problem: 'Solve $x + 11 = 3$.'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $11$ is added to $x$, so subtract $11$ from both sides. This gives $x = 3 - 11 = -8$.'
          - problem: 'The temperature fell by $5$ degrees and is now $-3$ °C. What was the temperature before it fell?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The fall of $5$ gives $x - 5 = -3$. Add $5$ to both sides: $x = -3 + 5 = 2$.'
          - problem: 'Solve $\frac{x}{-5} = -3$.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $x$ is divided by $-5$, so multiply both sides by $-5$. Then $x = (-3)(-5) = 15$.'
          - problem: 'Omar solves $-3x = 33$ and writes $x = 11$. What is the correct value of $x$?'
            answer: '-11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide both sides by $-3$ and keep the sign: $x = 33/(-3) = -11$. A positive and a negative number give a negative quotient.'
          - problem: 'A submarine dives at a steady rate. After $5$ minutes its depth has changed by $-45$ metres. By how many metres does its depth change each minute?'
            answer: '-9'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Five equal changes make $-45$, so $5x = -45$. Divide by $5$: $x = -9$ metres each minute.'
          - problem: 'Solve $x - 15 = -4$.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $15$ is subtracted from $x$, so add $15$ to both sides. This gives $x = -4 + 15 = 11$.'
          - problem: 'Six players on a team each score the same number of points, and the team total is $-54$ points. Points can be below zero in this game. How many points does each player score?'
            answer: '-9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total is six times one score, so $6x = -54$. Divide by $6$: $x = -9$ points.'
          - problem: 'A school shares a box of pencils equally among $8$ classes, and each class gets $6$ pencils. How many pencils were in the box?'
            answer: '48'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One share is $x/8 = 6$ pencils. Multiply both sides by $8$: $x = 6 \cdot 8 = 48$ pencils.'
        constraints: "choose the correct inverse operation; integer solutions"
    diagnostic_exemplar:
      problem: 'Solve $-6x = 42$.'
      answer: "-7"
      solution_sketch: 'Divide by $-6$: $x = -7$.'
    anki_seeds:
      - front: "To solve a one-step equation, apply the ... to both sides."
        back: "inverse operation (undo what is done to the variable)"
        type: basic

  - id: two-step-equations
    name: "Two-Step Equations"
    core: true
