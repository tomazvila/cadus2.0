    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: basic-absolute-value-equations
        weight: 0.7
        key: true
      - id: two-step-equations
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Absolute value of a linear expression"
        key_prerequisites: [two-step-equations, basic-absolute-value-equations]
        exemplars:
          - problem: 'Solve $|2x + 1| = 9$.'
            answer: "x = 4 or x = -5"
            solution_sketch: '$2x + 1 = 9 \to x = 4$; $2x + 1 = -9 \to x = -5$.'
          - problem: 'Solve $|3x - 6| = 12$.'
            answer: "x = 6 or x = -2"
            solution_sketch: '$3x - 6 = 12 \to x = 6$; $3x - 6 = -12 \to x = -2$.'
        constraints: "split into two linear equations; integer solutions"
      - id: kp2
        name: "Isolate the absolute value first"
        key_prerequisites: [two-step-equations, basic-absolute-value-equations]
        exemplars:
          - problem: 'Solve $|x + 2| - 3 = 4$.'
            answer: "x = 5 or x = -9"
            solution_sketch: '$|x + 2| = 7$; $x + 2 = 7$ or $x + 2 = -7$.'
          - problem: 'Solve $2|x| = 10$.'
            answer: "x = 5 or x = -5"
            solution_sketch: '$|x| = 5$.'
        constraints: "isolate |..| before splitting into cases"
      - id: kp3
        name: "Recognize no-solution cases"
        key_prerequisites: [basic-absolute-value-equations]
        exemplars:
          - problem: 'Solve $|x - 5| = -3$.'
            answer: "no solution"
            solution_sketch: 'An absolute value is never negative.'
          - problem: 'Solve $|2x| + 7 = 3$.'
            answer: "no solution"
            solution_sketch: 'Isolating gives $|2x| = -4$, impossible.'
        constraints: "isolated absolute value equals a negative number"
    diagnostic_exemplar:
      problem: 'Solve $|3x - 1| - 2 = 6$.'
      answer: 'x = 3 or x = -7/3'
      solution_sketch: '$|3x - 1| = 8$; $3x - 1 = 8 \to x = 3$; $3x - 1 = -8 \to x = -\frac{7}{3}$.'
    anki_seeds:
      - front: "If |X| = a with a > 0, then X = ? "
        back: "X = a or X = -a (isolate the absolute value first)"
        type: basic
      - front: "If |X| = a and a < 0, the equation has ..."
        back: "no solution (absolute value is never negative)"
        type: basic

  - id: translating-sentences-to-equations
    name: "Translating Sentences into Equations"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: translating-phrases-to-expressions
        weight: 0.7
        key: true
      - id: two-step-equations
        weight: 0.6
        key: true
      - id: one-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Translate and solve one- and two-step sentences"
        key_prerequisites: [two-step-equations, translating-phrases-to-expressions]
        exemplars:
          - problem: 'A number increased by $7$ is $22$. Find the number.'
            answer: "15"
            solution_sketch: '$x + 7 = 22$; $x = 15$.'
          - problem: 'Twice a number minus $5$ is $9$. Find the number.'
            answer: "7"
            solution_sketch: '$2x - 5 = 9$; $2x = 14$; $x = 7$.'
        constraints: "define one variable; integer answer"
      - id: kp2
        name: "Write the equation without solving"
        key_prerequisites: [translating-phrases-to-expressions]
        exemplars:
          - problem: 'Write an equation: five more than three times a number $n$ is $26$.'
            answer: "3n + 5 = 26"
          - problem: 'Write an equation: the quotient of a number $y$ and $4$ is $12$.'
            answer: "y/4 = 12"
        constraints: '"is" marks the equals sign; do not solve'
    diagnostic_exemplar:
      problem: 'Seven less than twice a number is $11$. Find the number.'
      answer: "9"
      solution_sketch: '$2x - 7 = 11$; $2x = 18$; $x = 9$.'
    anki_seeds:
      - front: "In a word sentence, the word 'is' usually translates to..."
        back: "the equals sign"
        type: basic

  - id: consecutive-integer-problems
    name: "Number and Consecutive Integer Problems"
    # over-coverage: consecutive-integer context schema over
    # translating-sentences-to-equations + multi-step-equations
    core: false
    difficulty: 0.48
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: translating-sentences-to-equations
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Multi-step number problems"
        key_prerequisites: [translating-sentences-to-equations, multi-step-equations]
        exemplars:
          - problem: 'The sum of a number and twice the number is $24$. Find the number.'
            answer: "8"
            solution_sketch: '$x + 2x = 24$; $3x = 24$; $x = 8$.'
          - problem: 'Seven less than three times a number is $20$. Find the number.'
            answer: "9"
            solution_sketch: '$3x - 7 = 20$; $3x = 27$; $x = 9$.'
        constraints: "one unknown; combine like terms or two steps; integer answer"
      - id: kp2
        name: "Consecutive integers and totals"
        key_prerequisites: [multi-step-equations]
        exemplars:
          - problem: 'Two consecutive integers sum to $27$. Find them.'
            answer: "13 and 14"
            solution_sketch: '$x + (x + 1) = 27$; $2x + 1 = 27$; $x = 13$.'
          - problem: 'The sum of three consecutive integers is $42$. Find them.'
            answer: "13, 14, and 15"
            solution_sketch: '$3x + 3 = 42$; $x = 13$.'
          - problem: 'Two consecutive even integers sum to $46$. Find them.'
            answer: "22 and 24"
            solution_sketch: '$x + (x + 2) = 46$; $2x = 44$; $x = 22$.'
        constraints: "represent related quantities in terms of one variable"
    diagnostic_exemplar:
      problem: 'Three consecutive even integers sum to $48$. Find them.'
      answer: '14, 16, and 18'
      solution_sketch: '$x + (x + 2) + (x + 4) = 48$; $3x + 6 = 48$; $x = 14$.'
    anki_seeds:
      - front: "Consecutive integers starting at x are written..."
        back: "x, x + 1, x + 2, ... (consecutive even or odd integers step by 2: x, x + 2, ...)"
        type: basic

  - id: money-geometry-problems
    name: "Money and Geometry Equation Problems"
    # over-coverage: ticket-price and perimeter context schema over the same
    # translating-sentences-to-equations + multi-step-equations pair
    core: false
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      - id: translating-sentences-to-equations
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Money and cost setups"
        key_prerequisites: [translating-sentences-to-equations]
        exemplars:
          - problem: 'Tickets cost €8 each and you spent €56. How many tickets did you buy?'
            answer: "7"
            answer_contract: {kind: exact}
            solution_sketch: '$8x = 56$; $x = 7$.'
          - problem: 'A taxi charges a €3 base fare plus €2 per kilometre. The fare was €17. How many kilometres was the ride?'
            answer: "7"
            answer_contract: {kind: exact}
            solution_sketch: '$2k + 3 = 17$; $2k = 14$; $k = 7$.'
        constraints: "unit price times quantity, possibly plus a fixed fee; whole-number answers"
      - id: kp2
        name: "Perimeter and side-length setups"
        key_prerequisites: [multi-step-equations, translating-sentences-to-equations]
        exemplars:
          - problem: 'A rectangle''s length is $3$ more than its width and the perimeter is $26$. Find the width.'
            answer: "5"
            answer_contract: {kind: exact}
            solution_sketch: '$2w + 2(w + 3) = 26$; $4w + 6 = 26$; $w = 5$.'
          - problem: 'A triangle has sides $x$, $x + 2$, and $x + 4$, and its perimeter is $30$. Find the shortest side.'
            answer: "8"
            answer_contract: {kind: exact}
            solution_sketch: '$3x + 6 = 30$; $3x = 24$; $x = 8$.'
        constraints: "express each side in terms of one variable; check units"
    diagnostic_exemplar:
      problem: 'The length of a rectangle is $5$ more than its width and the perimeter is $38$. Find the width.'
      answer: '7'
      solution_sketch: '$2(w + 5) + 2w = 38$; $4w + 10 = 38$; $w = 7$.'
    anki_seeds:
      - front: "The perimeter of a rectangle in terms of width w and length l:"
        back: "P = 2w + 2l"
        type: basic

  - id: equation-word-problems
    name: "Writing and Solving Equations from Words"
    core: false                # word-problem genre; cone now supplemental
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 150
    prerequisites:
      # the technique the two demoted context schemas were supplying: every KP
      # below defines a variable and writes an equation from a sentence
      - id: translating-sentences-to-equations
        weight: 0.7
        key: true
      - id: multi-step-equations
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Two quantities sharing a total"
        key_prerequisites: [translating-sentences-to-equations, multi-step-equations]
        exemplars:
          - problem: 'Maya and Liam sold $51$ raffle tickets in all; Maya sold twice as many as Liam. How many did Maya sell?'
            answer: "34"
            answer_contract: {kind: exact}
            solution_sketch: 'Liam $x$, Maya $2x$: $3x = 51$; $x = 17$; Maya sold $34$.'
          - problem: 'A $36$ cm ribbon is cut into two pieces; one piece is $8$ cm longer than the other. How long is the shorter piece?'
            answer: "14"
            answer_contract: {kind: exact}
            solution_sketch: '$x + (x + 8) = 36$; $2x = 28$; $x = 14$.'
        constraints: "express both quantities with one variable; answer the question asked"
      - id: kp2
        name: "Break-even setups with the variable on both sides"
        key_prerequisites: [variables-both-sides, multi-step-equations]
        exemplars:
          - problem: 'Plan A costs €20 plus €5 per class; Plan B costs €10 plus €7 per class. For how many classes do the plans cost the same?'
            answer: "5"
            answer_contract: {kind: exact}
            solution_sketch: '$20 + 5c = 10 + 7c$; $10 = 2c$; $c = 5$.'
          - problem: 'Tank A holds $300$ L and drains at $15$ L/min; tank B holds $180$ L and drains at $5$ L/min. After how many minutes do they hold the same amount?'
            answer: "12"
            answer_contract: {kind: exact}
            solution_sketch: '$300 - 15t = 180 - 5t$; $120 = 10t$; $t = 12$.'
        constraints: "two linear models set equal; positive integer answers"
      - id: kp3
        name: "Age and comparison problems"
        key_prerequisites: [translating-sentences-to-equations, multi-step-equations]
        exemplars:
          - problem: 'Ana is $4$ years older than Ben, and the sum of their ages is $30$. How old is Ana?'
            answer: "17"
            answer_contract: {kind: exact}
            solution_sketch: 'Ben $x$, Ana $x + 4$: $2x + 4 = 30$; $x = 13$; Ana is $17$.'
          - problem: 'A father is $3$ times as old as his son. In $12$ years he will be twice as old as his son. How old is the son now?'
            answer: "12"
            answer_contract: {kind: exact}
            solution_sketch: '$3s + 12 = 2(s + 12)$; $3s + 12 = 2s + 24$; $s = 12$.'
        constraints: "relate ages now and after a time shift; integer answers"
    diagnostic_exemplar:
      problem: 'A mother is $4$ times as old as her daughter. In $6$ years she will be $3$ times as old as her daughter. How old is the daughter now?'
      answer: '12'
      solution_sketch: '$4d + 6 = 3(d + 6)$; $4d + 6 = 3d + 18$; $d = 12$.'
    anki_seeds:
      - front: "Setup when two quantities share a total and one is k times the other:"
        back: "let the smaller be x and the other kx; then x + kx = total"
        type: basic
      - front: "Break-even setup for two linear plans:"
        back: "set cost A = cost B and solve for the shared variable"
        type: basic
      - front: "Age problems: 'in t years' means each person's age becomes..."
        back: "current age + t (add t to every age before comparing)"
        type: basic
