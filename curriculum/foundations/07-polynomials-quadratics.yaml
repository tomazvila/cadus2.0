  - id: converting-to-vertex-form
    name: Converting Quadratics to Vertex Form
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: completing-the-square
        weight: 0.8
        key: true
      - id: parabola-vertex-form
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Monic standard form to vertex form
        key_prerequisites: [completing-the-square, parabola-vertex-form]
        exemplars:
          - problem: 'Write $y = x^2 + 6x + 5$ in vertex form.'
            answer: "y = (x + 3)^2 - 4"
            answer_contract: {kind: exact}
            solution_sketch: 'Add and subtract $9$: $(x^2 + 6x + 9) - 9 + 5$.'
          - problem: 'An area-square completion for $x^2-4x+7$ isolates $x^2-4x+4$ and a remainder. Write the equation $y=x^2-4x+7$ in vertex form.'
            answer: "y = (x - 2)^2 + 3"
            answer_contract: {kind: exact}
            solution_sketch: 'Add and subtract $4$: $(x^2 - 4x + 4) - 4 + 7$.'
          - problem: 'A learner rewrites $y=x^2+8x+10$ as $y=(x+4)^2+10$. Correct the vertex-form equation.'
            answer: "y = (x + 4)^2 - 6"
            answer_contract: {kind: exact}
            solution_sketch: 'Add and subtract $16$: $(x^2 + 8x + 16) - 16 + 10$.'
          - problem: 'A monic quadratic''s coefficient row is $(1,-10,21)$. Write its $y$ equation in vertex form by completing the square.'
            answer: "y = (x - 5)^2 - 4"
            answer_contract: {kind: exact}
            solution_sketch: 'Add and subtract $25$: $(x^2 - 10x + 25) - 25 + 21$.'
        constraints: "monic; even middle coefficient"
      - id: kp2
        name: Factor out a leading coefficient first
        key_prerequisites: [completing-the-square]
        exemplars:
          - problem: 'Write $y = 2x^2 - 8x + 3$ in vertex form.'
            answer: "y = 2(x - 2)^2 - 5"
            answer_contract: {kind: exact}
            solution_sketch: '$2(x^2 - 4x) + 3 = 2((x-2)^2 - 4) + 3$.'
          - problem: 'Rewrite the arch model $y=-x^2+2x+3$ in vertex form, extracting the leading coefficient from the $x$ terms first.'
            answer: "y = -(x - 1)^2 + 4"
            answer_contract: {kind: exact}
            solution_sketch: '$-(x^2 - 2x) + 3 = -((x-1)^2 - 1) + 3$.'
          - problem: 'A learner rewrites $y=3x^2-12x+5$ as $y=3(x-2)^2+1$. Correct the outside constant.'
            answer: "y = 3(x - 2)^2 - 7"
            answer_contract: {kind: exact}
            solution_sketch: '$3(x^2 - 4x) + 5 = 3((x-2)^2 - 4) + 5$.'
          - problem: 'A quadratic''s coefficient row is $(-2,-8,1)$. Write its $y$ equation in vertex form, factoring the leading coefficient out of the $x$ terms.'
            answer: "y = -2(x + 2)^2 + 9"
            answer_contract: {kind: exact}
            solution_sketch: '$-2(x^2 + 4x) + 1 = -2((x+2)^2 - 4) + 1$.'
        constraints: "factor a out of the x-terms only"
      - id: kp3
        name: Read the vertex and extreme value from the result
        key_prerequisites: [parabola-vertex-form, completing-the-square]
        exemplars:
          - problem: 'Convert $y = x^2 + 10x + 30$ to vertex form and give the minimum value of $y$.'
            answer: "vertex_form = (x + 5)^2 + 5; minimum = 5"
            answer_contract: {kind: multipart, parts: [{name: vertex_form, contract: {kind: exact}}, {name: minimum, contract: {kind: exact}}]}
            solution_sketch: 'Add and subtract $25$: $y=(x+5)^2+30-25=(x+5)^2+5$. The square''s minimum is zero, so the minimum output is $5$.'
          - problem: 'Convert $y = 3x^2 + 6x + 1$ to vertex form and give the vertex.'
            answer: "vertex_form = 3(x + 1)^2 - 2; vertex = (-1, -2)"
            answer_contract: {kind: multipart, parts: [{name: vertex_form, contract: {kind: exact}}, {name: vertex, contract: {kind: coordinates, arity: 2}}]}
            solution_sketch: '$3(x^2 + 2x) + 1 = 3((x+1)^2 - 1) + 1$.'
          - problem: 'A parabolic cross-section has equation $y=x^2+12x+40$. Complete the square to express its vertex form and give the minimum height.'
            answer: "vertex_form = (x + 6)^2 + 4; minimum = 4"
            answer_contract: {kind: multipart, parts: [{name: vertex_form, contract: {kind: exact}}, {name: minimum, contract: {kind: exact}}]}
            solution_sketch: 'Add and subtract $36$: $y=(x+6)^2+40-36=(x+6)^2+4$. The square is nonnegative, so the minimum height is $4$.'
          - problem: 'A learner rewrites $y=2x^2+4x+5$ as $2(x+1)^2+5$. Correct the vertex-form expression and give the vertex.'
            answer: "vertex_form = 2(x + 1)^2 + 3; vertex = (-1, 3)"
            answer_contract: {kind: multipart, parts: [{name: vertex_form, contract: {kind: exact}}, {name: vertex, contract: {kind: coordinates, arity: 2}}]}
            solution_sketch: '$2(x^2 + 2x) + 5 = 2((x+1)^2 - 1) + 5$.'
        constraints: "conversion plus one interpretive question"
    diagnostic_exemplar:
      problem: 'Write $y = 2x^2 + 8x + 3$ in vertex form.'
      answer: 'y = 2(x + 2)^2 - 5'
      solution_sketch: '$2(x^2 + 4x) + 3 = 2((x + 2)^2 - 4) + 3$.'
    anki_seeds:
      - front: "To convert y = x^2 + bx + c to vertex form, ..."
        back: "complete the square: y = (x + b/2)^2 + (c - (b/2)^2)"
        type: basic

  - id: quadratic-applications
