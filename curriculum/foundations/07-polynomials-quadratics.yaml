        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'For $3x^2 - 5x + 2 = 0$, state $a$, $b$, and $c$.'
            answer: "a = 3; b = -5; c = 2"
            answer_contract: {kind: multipart, parts: [{name: a, contract: {kind: exact}}, {name: b, contract: {kind: exact}}, {name: c, contract: {kind: exact}}]}
            solution_sketch: 'Read the coefficients directly off the standard form $3x^2 - 5x + 2 = 0$.'
          - problem: 'Rewrite $x^2 = 4x - 3$ in standard form and state $a$, $b$, $c$.'
            answer: "x^2 - 4x + 3 = 0; a = 1, b = -4, c = 3"
            solution_sketch: 'Move every term to one side: $x^2 - 4x + 3 = 0$, so $a = 1$, $b = -4$, $c = 3$.'
        constraints: "include rearrangement into standard form; signs matter"
      - id: kp2
        name: Rational roots from the formula
        key_prerequisites: [evaluating-expressions, square-roots]
        exemplars:
          - problem: 'Solve $x^2 + 5x + 6 = 0$ using the quadratic formula.'
            answer: "x = -2 or x = -3"
            solution_sketch: '$a = 1$, $b = 5$, $c = 6$; disc $= 1$; $x = \frac{-5 \pm 1}{2}$.'
          - problem: 'Solve $2x^2 - 7x + 3 = 0$ using the quadratic formula.'
            answer: "x = 3 or x = 1/2"
            solution_sketch: 'disc $= 25$; $x = \frac{7 \pm 5}{4}$.'
        constraints: "perfect-square discriminant"
      - id: kp3
        name: Perfect-square discriminants with a > 1
        key_prerequisites: [evaluating-expressions, square-roots]
        exemplars:
