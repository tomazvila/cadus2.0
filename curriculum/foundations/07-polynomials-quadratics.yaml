    knowledge_points:
      - id: kp1
        visuals: [{"kind":"geometry","figure":{"shape":"polygon","vertices":[{"x":"0","y":"0","label":"A"},{"x":"7","y":"0","label":"B"},{"x":"7","y":"4","label":"C"},{"x":"0","y":"4","label":"D"}],"right_angles":[0,1,2,3]},"caption":"Reference example: A reference rectangle has width 7 and height 4. Coordinates give the side lengths; this diagram is an independent example."}]
        name: Area and consecutive-integer models
        key_prerequisites: [quadratic-equations-factoring]
        exemplars:
          - problem: 'A rectangle''s length is $3$ more than its width and its area is $40$. Find the width.'
            answer: "5"
            answer_contract: {kind: exact}
            solution_sketch: '$w(w+3) = 40$; $w^2 + 3w - 40 = 0$; $(w+8)(w-5) = 0$; $w = 5$.'
          - problem: 'The product of two consecutive positive integers is $56$. Find them.'
            answer: "smaller = 7; larger = 8"
            answer_contract: {kind: multipart, parts: [{name: smaller, contract: {kind: exact}}, {name: larger, contract: {kind: exact}}]}
            solution_sketch: '$n(n+1) = 56$; $n^2 + n - 56 = 0$; $(n+8)(n-7) = 0$; $n = 7$, so the integers are $7$ and $8$.'
          - problem: 'A rectangle has area $45$ square units and length $4$ more than its width. A learner accepts width $-9$ from the quadratic model. Find the admissible width.'
            answer: "5"
            answer_contract: {kind: exact}
            solution_sketch: 'The width satisfies $w(w+4)=45$, or $(w+9)(w-5)=0$. Positive dimensions require $w=5$.'
          - problem: 'An array has $90$ cells and one more column than rows. Find the row and column counts, reported as smaller and larger.'
            answer: "smaller = 9; larger = 10"
            answer_contract: {kind: multipart, parts: [{name: smaller, contract: {kind: exact}}, {name: larger, contract: {kind: exact}}]}
            solution_sketch: 'If the row count is $n$, then $n(n+1)=90$, so $(n-9)(n+10)=0$. Counts are positive, giving $9$ rows and $10$ columns.'
        constraints: 'area or consecutive-integer setups; the quadratic factors over the integers; discard the negative root'
      - id: kp2
        name: Projectile height and maximum-value problems
        key_prerequisites: [quadratic-graphs-vertex]
        exemplars:
          - problem: 'A ball''s height in metres is $h = -5t^2 + 10t$. At what time $t > 0$ does it hit the ground ($h = 0$)?'
            answer: "2 s"
            answer_contract: {"kind":"unit","quantity":"time","unit":"s"}
            solution_sketch: '$-5t(t-2) = 0$; $t = 2$.'
          - problem: 'For $h = -5t^2 + 30t$ (metres), find the maximum height.'
            answer: "45 m"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m"}
            solution_sketch: 'The vertex sits at $t = \frac{-b}{2a} = 3$, where $h = -45 + 90 = 45$.'
          - problem: 'For the flight model $h=-5t^2+20t$ metres, a learner selects $t=0$ as the landing time. Find the positive time when the ball returns to ground level, with units.'
            answer: "4 s"
            answer_contract: {"kind":"unit","quantity":"time","unit":"s"}
            solution_sketch: '$-5t(t-4) = 0$; $t = 4$.'
          - problem: 'A flight record gives $h(t)=-5t^2+40t$ metres. Locate the vertex to find the peak height, with units.'
            answer: "80 m"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m"}
            solution_sketch: 'The vertex sits at $t = \frac{-b}{2a} = 4$, where $h = -80 + 160 = 80$.'
        constraints: 'height models h = -5t^2 + bt with b a multiple of 5; answer the landing time or the maximum height, with units'
    diagnostic_exemplar:
      problem: 'A ball''s height in metres is $h = -5t^2 + 20t$. What is the maximum height it reaches?'
      answer: "20 m"
      solution_sketch: 'The maximum sits at the vertex $t = \frac{-b}{2a} = 2$, where $h = -20 + 40$.'
