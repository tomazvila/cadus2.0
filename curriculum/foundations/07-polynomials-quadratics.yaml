            answer: '(-1, -6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The lowest point is the vertex, at $x = -2/2 = -1$. Then $y = 1 - 2 - 5 = -6$, so the lowest point is $(-1, -6)$.'
