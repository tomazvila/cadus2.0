unit: polynomials-quadratics
course: foundations
module: "Polynomials & Quadratics"
topics:
  - id: polynomial-basics
    name: Polynomial Vocabulary and Standard Form
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: integer-exponents-intro
        weight: 0.5
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Degree and leading coefficient
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'State the degree and leading coefficient of $4x^3 - x + 7$.'
            answer: "degree = 3; leading_coefficient = 4"
            answer_contract: {kind: multipart, parts: [{name: degree, contract: {kind: exact}}, {name: leading_coefficient, contract: {kind: exact}}]}
            solution_sketch: 'The highest power present is $x^3$, with coefficient $4$.'
          - problem: 'State the degree of $5x^2 - 2x^4 + 1$.'
            answer: "4"
            solution_sketch: 'The highest power present is $x^4$.'
          - problem: 'A coefficient table lists powers $5,2,1$ with coefficients $6,-3,1$. State the degree and leading coefficient.'
            answer: "degree = 5; leading_coefficient = 6"
            answer_contract: {kind: multipart, parts: [{name: degree, contract: {kind: exact}}, {name: leading_coefficient, contract: {kind: exact}}]}
            solution_sketch: 'The highest power present is $x^5$, with coefficient $6$.'
          - problem: 'After simplifying $3x^5-2x^4+7x^3-3x^5-1$, state the degree and leading coefficient.'
            answer: "degree = 4; leading_coefficient = -2"
            answer_contract: {kind: multipart, parts: [{name: degree, contract: {kind: exact}}, {name: leading_coefficient, contract: {kind: exact}}]}
            solution_sketch: 'The two $x^5$ terms cancel. The highest remaining term is $-2x^4$, so the degree is $4$ and its coefficient is $-2$.'
        constraints: "degree <= 5; integer coefficients"
      - id: kp2
        name: Classify by number of terms
        key_prerequisites: []
        exemplars:
          - problem: 'Classify $3x^2 - 5x$ as a monomial, binomial, or trinomial.'
            answer: "binomial"
            answer_contract: {kind: label, options: [["monomial"], ["binomial"], ["trinomial"]]}
            solution_sketch: 'The nonzero terms are $3x^2$ and $-5x$. Two terms make a binomial.'
          - problem: 'After combining like terms in $x^2+5x-3x+1$, classify the result as a monomial, binomial, or trinomial.'
            answer: "trinomial"
            answer_contract: {kind: label, options: [["monomial"], ["binomial"], ["trinomial"]]}
            solution_sketch: 'The linear terms combine to $2x$. The remaining terms $x^2$, $2x$, and $1$ give a trinomial.'
          - problem: 'An algebra-tile model contains seven positive $x^4$ pieces and no other pieces. Classify its polynomial as a monomial, binomial, or trinomial.'
            answer: "monomial"
            answer_contract: {kind: label, options: [["monomial"], ["binomial"], ["trinomial"]]}
            solution_sketch: 'All seven pieces represent one like-term group, $7x^4$, so the polynomial is a monomial.'
          - problem: 'A coefficient table has nonzero entries $1,-5,6$ at powers $2,1,0$. Classify the polynomial as a monomial, binomial, or trinomial.'
            answer: "trinomial"
            answer_contract: {kind: label, options: [["monomial"], ["binomial"], ["trinomial"]]}
            solution_sketch: 'Each nonzero coefficient contributes a term: $x^2$, $-5x$, and $6$. Three terms give a trinomial.'
        constraints: "one to three terms"
      - id: kp3
        name: Write polynomials in standard form
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Write $3 - x^2 + 5x$ in standard form.'
            answer: "-x^2 + 5x + 3"
            solution_sketch: 'Descending order is $-x^2 + 5x + 3$; no like terms to combine.'
          - problem: 'Simplify and write in standard form: $2x + x^3 + 4x - 1$.'
            answer: "x^3 + 6x - 1"
            solution_sketch: 'Combine $2x + 4x$; order by descending degree.'
          - problem: 'An algebra-tile inventory contains five positive square tiles, three positive $x$ tiles, and seven negative unit tiles. Write its polynomial in descending powers.'
            answer: "5x^2 + 3x - 7"
            solution_sketch: 'The tile groups represent $5x^2$, $3x$, and $-7$; descending powers are $2,1,0$.'
          - problem: 'A coefficient list gives the constant $5$, the $x$ coefficient $2$, and two cubic contributions $-1$ and $-3$. Write the polynomial in standard form.'
            answer: "-4x^3 + 2x + 5"
            solution_sketch: 'The cubic contributions add to $-4$; the coefficient of $x^2$ is zero. Descending order gives $-4x^3+2x+5$.'
        constraints: "descending powers; combine like terms first"
    diagnostic_exemplar:
      problem: 'State the degree and leading coefficient of $7 + 2x - 5x^3$.'
      answer_contract: {kind: multipart, parts: [{name: degree, contract: {kind: exact}}, {name: leading_coefficient, contract: {kind: exact}}]}
      answer: "degree = 3; leading_coefficient = -5"
      solution_sketch: 'Standard form is $-5x^3 + 2x + 7$.'
    anki_seeds:
      - front: "The degree of a polynomial in one variable is ..."
        back: "the largest exponent that appears on the variable"
        type: basic
      - front: "Monomial, binomial, trinomial = polynomials with ___ terms"
        back: "1, 2, 3"
        type: basic

  - id: evaluating-polynomials
    name: Evaluating Polynomials
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: evaluating-expressions
        weight: 0.8
        key: true
      - id: polynomial-basics
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Evaluate at positive integers
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Evaluate $x^2 + 3x - 2$ at $x = 2$.'
            answer: "8"
            solution_sketch: '$4 + 6 - 2 = 8$.'
          - problem: 'Use Horner form $p(x)=x(2x^2-1)$ to find $p(3)$.'
            answer: "51"
            solution_sketch: 'Work inside out: $2(3)^2-1=17$, then $3(17)=51$.'
          - problem: 'Complete the output entry for input $3$ in the function table for $p(x)=x^2-5x+4$.'
            answer: "-2"
            solution_sketch: '$9 - 15 + 4 = -2$.'
          - problem: 'A machine maps a positive integer $x$ to $3x^2+x-1$. What output corresponds to input $4$?'
            answer: "51"
            solution_sketch: '$48 + 4 - 1 = 51$.'
        constraints: "degree <= 3; small positive inputs"
      - id: kp2
        name: Evaluate at negative inputs
        key_prerequisites: [evaluating-expressions, integer-multiplication-division]
        exemplars:
          - problem: 'Evaluate $x^2 - 4x + 1$ at $x = -2$.'
            answer: "13"
            solution_sketch: '$(-2)^2 = 4$; $4 + 8 + 1 = 13$.'
          - problem: 'A student obtains $14$ for $p(-3)$ when $p(x)=-x^2+5$ by squaring the minus sign with the input. Give the correct output.'
            answer: "-4"
            solution_sketch: 'Only the input is squared: $-(-3)^2+5=-9+5=-4$.'
          - problem: 'Complete the output entry at input $-4$ in a table for $p(x)=x(x+3)-5$.'
            answer: "-1"
            solution_sketch: 'Horner form gives $(-4)(-4+3)-5=4-5=-1$.'
          - problem: 'For the even polynomial $p(x)=-2x^2+3$, the table gives $p(2)=-5$. Find $p(-2)$ using symmetry.'
            answer: "-5"
            solution_sketch: 'An even power has the same value at opposite inputs. Substituting $-2$ therefore gives the stated table value, $-5$.'
        constraints: "watch (-a)^2 vs -a^2"
      - id: kp3
        name: Evaluate formula-style polynomials
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'The height of a ball in metres is $h = -5t^2 + 20t$. Find $h$ at $t = 1$.'
            answer: "15"
            solution_sketch: '$-5 + 20 = 15$.'
          - problem: 'For $P = n^2 + 3n$, find $P$ at $n = 5$.'
            answer: "40"
            solution_sketch: '$25 + 15 = 40$.'
          - problem: 'The area of a square garden in square metres is $A = s^2$. Find $A$ at $s = 6$.'
            answer: '36'
            solution_sketch: '$6^2 = 36$.'
          - problem: 'For $C = 2n^2 - n$, find $C$ at $n = 4$.'
            answer: "28"
            solution_sketch: '$2(16) - 4 = 28$.'
        constraints: "single substitution; clean integer outputs"
    diagnostic_exemplar:
      problem: 'Evaluate $x^2 - 2x + 3$ at $x = -1$.'
      answer: "6"
      solution_sketch: '$1 + 2 + 3 = 6$.'
    anki_seeds:
      - front: "At x = -2, x^2 evaluates to ___ but -x^2 evaluates to ___"
        back: "4; -4 (the square applies before the leading minus)"
        type: basic

  - id: adding-polynomials
    name: Adding Polynomials
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: combining-like-terms
        weight: 0.9
        key: true
      - id: polynomial-basics
        weight: 0.4
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Add linear polynomials
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Add $(2x + 9) + (5x - 3)$.'
            answer: "7x + 6"
            solution_sketch: '$2x + 5x = 7x$; $9 - 3 = 6$.'
          - problem: 'Two consecutive path sections have lengths $4x-7$ and $x+2$, with $x>2$. Write their total length in standard form.'
            answer: "5x - 5"
            solution_sketch: '$4x + x = 5x$; $-7 + 2 = -5$.'
          - problem: 'Add coefficient rows $(3,4)$ and $(2,-10)$, ordered as $(x,1)$. Write the resulting linear polynomial.'
            answer: "5x - 6"
            solution_sketch: '$3x + 2x = 5x$; $4 - 10 = -6$.'
          - problem: 'A student adds $(6x-1)+(-2x+5)$ and writes $8x+4$. Correct the polynomial.'
            answer: "4x + 4"
            solution_sketch: 'The second $x$ coefficient is negative: $6+(-2)=4$. The constants give $-1+5=4$.'
        constraints: "degree 1; integer coefficients"
      - id: kp2
        name: Add quadratics term by term
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Add $(3x^2 + 2x - 5) + (x^2 - 4x + 7)$.'
            answer: "4x^2 - 2x + 2"
            solution_sketch: '$3x^2 + x^2 = 4x^2$; $2x - 4x = -2x$; $-5 + 7 = 2$.'
          - problem: 'An algebra-tile tray represents $x^2-3x$ and another $2x^2+x-4$. Write the polynomial represented when the trays are combined.'
            answer: "3x^2 - 2x - 4"
            solution_sketch: '$x^2 + 2x^2 = 3x^2$; $-3x + x = -2x$.'
          - problem: 'Add coefficient rows $(4,-1,2)$ and $(2,3,-5)$ in columns $(x^2,x,1)$. Write the resulting polynomial.'
            answer: "6x^2 + 2x - 3"
            solution_sketch: '$4x^2 + 2x^2 = 6x^2$; $-x + 3x = 2x$; $2 - 5 = -3$.'
          - problem: 'Two garden plots have areas $x^2+5x$ and $3x^2-2x+6$ square metres, with $x>1$. Write the total area polynomial.'
            answer: "4x^2 + 3x + 6"
            solution_sketch: '$x^2 + 3x^2 = 4x^2$; $5x - 2x = 3x$.'
        constraints: "degree 2; line up like terms"
      - id: kp3
        name: Add with missing terms
        key_prerequisites: [combining-like-terms, polynomial-basics]
        exemplars:
          - problem: 'Add $(x^3 + 2x - 1) + (x^2 - 2x + 4)$.'
            answer: "x^3 + x^2 + 3"
            solution_sketch: '$2x - 2x = 0$; no other like terms overlap.'
          - problem: 'Add coefficient rows $(2,0,-1,0)$ and $(1,0,0,5)$ in columns $(x^3,x^2,x,1)$. Write the sum in standard form.'
            answer: "3x^3 - x + 5"
            solution_sketch: '$2x^3 + x^3 = 3x^3$; no other like terms overlap.'
          - problem: 'Two volume contributions are $x^3-4x$ and $2x^2+4x-3$, for $x>3$. Write their total as a polynomial and combine the cancelling terms.'
            answer: "x^3 + 2x^2 - 3"
            solution_sketch: '$-4x + 4x = 0$; combine the remaining terms.'
          - problem: 'A student adds $(3x^3+2x^2)+(x^3-2x^2+7)$ and keeps $4x^2$ in the answer. Correct the sum.'
            answer: "4x^3 + 7"
            solution_sketch: '$2x^2 - 2x^2 = 0$; $3x^3 + x^3 = 4x^3$.'
        constraints: "some powers absent; keep standard form"
    diagnostic_exemplar:
      problem: 'Add $(2x^3 + x - 5) + (x^2 - 3x + 2)$.'
      answer: '2x^3 + x^2 - 2x - 3'
      solution_sketch: 'Only the $x$ terms and the constants pair up: $x - 3x = -2x$ and $-5 + 2 = -3$.'
    anki_seeds:
      - front: "Like terms in polynomials have the same ..."
        back: "variable raised to the same power (only coefficients differ)"
        type: basic

  - id: polynomial-addition-subtraction
    name: Adding and Subtracting Polynomials
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: adding-polynomials
        weight: 0.8
        key: true
      - id: distributive-property
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
      - id: evaluating-expressions
        weight: 0.0            # conceptual-familiarity only (no implicit reps)
    knowledge_points:
      - id: kp1
        name: Subtract polynomials by distributing the negative
        key_prerequisites: [distributive-property]
        constraints: "subtraction distributes over every term of the second polynomial"
        exemplars:
          - problem: 'Subtract $(5x^2 - 3x + 4) - (2x^2 + x - 6)$.'
            answer: "3x^2 - 4x + 10"
            solution_sketch: 'Distribute the minus: $5x^2 - 2x^2 = 3x^2$; $-3x - x = -4x$; $4 - (-6) = 10$.'
          - problem: 'A length $3x-8$ is cut from a bar of length $7x-2$, with $x>3$. Write the remaining length as a polynomial.'
            answer: "4x + 6"
            solution_sketch: 'Distribute the minus: $7x - 3x = 4x$; $-2 - (-8) = 6$.'
          - problem: 'Subtract coefficient row $(3,4,-1)$ from $(6,-2,5)$ in columns $(x^2,x,1)$. Write the resulting polynomial.'
            answer: "3x^2 - 6x + 6"
            solution_sketch: 'Distribute the minus: $6x^2 - 3x^2 = 3x^2$; $-2x - 4x = -6x$; $5 - (-1) = 6$.'
          - problem: 'A student writes $(4x-9)-(x-2)=3x-11$. Correct the result by distributing the subtraction sign.'
            answer: "3x - 7"
            solution_sketch: 'Distribute the minus: $4x - x = 3x$; $-9 - (-2) = -7$.'
      - id: kp2
        name: Subtract with missing terms and cancellation
        key_prerequisites: [adding-polynomials, distributive-property]
        exemplars:
          - problem: 'Simplify $(x^3 + 2x - 1) - (x^3 - x^2 + 2x - 4)$.'
            answer: "x^2 + 3"
            solution_sketch: '$x^3$ cancels; $+x^2$; $2x - 2x = 0$; $-1 + 4 = 3$.'
          - problem: 'Simplify $(2x^2 + 5) - (x^2 + 3x)$.'
            answer: "x^2 - 3x + 5"
            solution_sketch: 'Distribute the minus: $2x^2 - x^2 = x^2$; the $-3x$ carries through.'
          - problem: 'Find $P-Q$ from coefficient rows $P=(1,0,3,0)$ and $Q=(1,-2,1,-4)$ in columns $(x^3,x^2,x,1)$.'
            answer: "2x^2 + 2x + 4"
            solution_sketch: '$x^3$ cancels; $+2x^2$; $3x - x = 2x$; $0 - (-4) = 4$.'
          - problem: 'A tile tray represents $3x^2+2x$. Removing a tray representing $x^2+2x-6$ uses zero pairs for the negative units. What polynomial remains?'
            answer: "2x^2 + 6"
            solution_sketch: '$3x^2 - x^2 = 2x^2$; $2x - 2x = 0$; $0 - (-6) = 6$.'
        constraints: 'some powers absent from one polynomial; terms may cancel completely; degree <= 3'
      - id: kp3
        name: Combine three polynomials
        key_prerequisites: [adding-polynomials]
        exemplars:
          - problem: 'Simplify $(4x^2 - 1) + (x^2 + 6x) - (2x^2 - 3)$.'
            answer: "3x^2 + 6x + 2"
            solution_sketch: '$4x^2 + x^2 - 2x^2 = 3x^2$; the $6x$ carries; $-1 - (-3) = 2$.'
          - problem: 'Simplify $(x^2 + 2x) + (3x^2 - x) - (2x^2 + 4)$.'
            answer: "2x^2 + x - 4"
            solution_sketch: 'Combine the $x^2$ coefficients $1 + 3 - 2$ to get $2x^2$; the $x$ terms give $2x - x = x$; the constants give $0 - 4 = -4$.'
          - problem: 'A stock model starts at $2x^2+x$, receives $x^2-5$, and dispatches $x^2-3x$, with $x>5$. Write the net stock polynomial.'
            answer: "2x^2 + 4x - 5"
            solution_sketch: '$2x^2 + x^2 - x^2 = 2x^2$; $x - (-3x) = 4x$; $0 - 5 = -5$.'
          - problem: 'Compute $P+Q-R$ using coefficient rows $P=(1,0,-4)$, $Q=(2,1,0)$, $R=(1,-2,1)$ in columns $(x^2,x,1)$.'
            answer: "2x^2 + 3x - 5"
            solution_sketch: '$1 + 2 - 1 = 2$ for $x^2$; $x - (-2x) = 3x$; $-4 - 1 = -5$.'
        constraints: 'three polynomials, at least one subtracted; degree <= 2; answer in standard form'
    diagnostic_exemplar:
      problem: 'Simplify $(3x^2 + 5) + (x^2 - 2x) - (2x^2 + 3)$.'
      answer: '2x^2 - 2x + 2'
      solution_sketch: 'Distribute the minus: $3x^2 + 5 + x^2 - 2x - 2x^2 - 3$.'
    anki_seeds:
      - front: "When subtracting polynomials, the minus sign..."
        back: "distributes to every term of the polynomial being subtracted."
        type: basic
      - front: "When adding or subtracting polynomials, you may only combine..."
        back: "like terms (same variable and same exponent)."
        type: basic

  - id: multiplying-monomials-polynomials
    name: Multiplying a Monomial by a Polynomial
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: distributive-property
        weight: 0.9
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Monomial times a monomial
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Multiply $(3x^2)(5x^4)$.'
            answer: "15x^6"
            solution_sketch: '$3 \cdot 5 = 15$; $2 + 4 = 6$.'
          - problem: 'Write $(-2x)(4x^3)$ as a single monomial using repeated factors $x\cdot x\cdot x\cdot x$.'
            answer: "-8x^4"
            solution_sketch: '$-2 \cdot 4 = -8$; $1 + 3 = 4$.'
          - problem: 'A rectangular garden bed has length $4x^3$ and width $2x^2$. Write its area as a monomial.'
            answer: "8x^5"
            solution_sketch: 'Area is length times width: multiply the coefficients $4 \cdot 2 = 8$ and add the exponents $3 + 2 = 5$.'
          - problem: 'A student multiplies $(-3x^2)(5x)$ and reports $-15x^2$. Correct the product.'
            answer: "-15x^3"
            solution_sketch: 'The coefficients give $-15$; the variable factors are $x\cdot x\cdot x=x^3$.'
        constraints: "single-variable monomials; integer coefficients"
      - id: kp2
        name: Monomial times a binomial or trinomial
        key_prerequisites: [distributive-property, exponent-product-quotient-rules]
        exemplars:
          - problem: 'Expand $3x(2x^2 - 4x + 5)$.'
            answer: "6x^3 - 12x^2 + 15x"
            solution_sketch: 'The three products are $3x(2x^2)=6x^3$, $3x(-4x)=-12x^2$, and $3x(5)=15x$.'
          - problem: 'Expand $2x(x + 7)$.'
            answer: "2x^2 + 14x"
            solution_sketch: 'Multiply $2x$ by each term: $2x(x)=2x^2$ and $2x(7)=14x$.'
          - problem: 'A multiplication grid has row label $4x$ and column labels $3x^2,-x,2$. Add the three cell products and write the polynomial.'
            answer: "12x^3 - 4x^2 + 8x"
            solution_sketch: 'The cells are $12x^3$, $-4x^2$, and $8x$; they have different powers and remain separate.'
          - problem: 'A rectangle has width $5x$ and length $(x + 3)$. Write its area as a polynomial in standard form.'
            answer: "5x^2 + 15x"
            solution_sketch: 'Area is width times length: distribute $5x$ over $(x + 3)$ to get $5x \cdot x + 5x \cdot 3$.'
        constraints: "positive monomial in front"
      - id: kp3
        name: Negative monomials
        key_prerequisites: [distributive-property, integer-multiplication-division]
        exemplars:
          - problem: 'Expand $-2x^2(x - 3)$.'
            answer: "-2x^3 + 6x^2"
            solution_sketch: 'Both products flip sign: $-2x^3$, $+6x^2$.'
          - problem: 'Expand $-4x(x^2 - 2x - 1)$.'
            answer: "-4x^3 + 8x^2 + 4x"
            solution_sketch: 'Every product flips sign: $-4x^3$, $+8x^2$, $+4x$.'
          - problem: 'Use the distributive property to expand $-3x^2(x - 4)$, listing each signed product separately.'
            answer: "-3x^3 + 12x^2"
            solution_sketch: 'List each product with its sign: $(-3x^2)(x)$ gives $-3x^3$ and $(-3x^2)(-4)$ gives $12x^2$.'
          - problem: 'Correct the expansion $-5x(x^2-3x+2)=-5x^3-15x^2-10x$.'
            answer: "-5x^3 + 15x^2 - 10x"
            solution_sketch: 'The middle product is $(-5x)(-3x)=15x^2$; the other products are $-5x^3$ and $-10x$.'
        constraints: "leading negative; track every sign"
    diagnostic_exemplar:
      problem: 'Expand $-3x(x^2 - 2x + 4)$.'
      answer: '-3x^3 + 6x^2 - 12x'
      solution_sketch: 'Distribute $-3x$ to each term, tracking every sign.'
    anki_seeds:
      - front: "Multiplying monomials: (ax^m)(bx^n) = ?"
        back: "(a*b) x^(m+n)"
        type: basic

  - id: multiplying-binomials
    name: Multiplying Binomials (FOIL)
    core: true
    difficulty: 0.48
    drill: true                # fluency / automaticity-drill topic
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: multiplying-monomials-polynomials
        weight: 0.8
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Monic binomials (x + a)(x + b)
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Expand $(x + 3)(x + 5)$.'
            answer: "x^2 + 8x + 15"
            solution_sketch: '$x^2 + 5x + 3x + 15 = x^2 + 8x + 15$.'
          - problem: 'A $2$ by $2$ product grid has row labels $x,-4$ and column labels $x,6$. Write the sum of its four cell products in standard form.'
            answer: "x^2 + 2x - 24"
            solution_sketch: '$x^2 + 6x - 4x - 24 = x^2 + 2x - 24$.'
          - problem: 'A rectangle has length $(x + 2)$ and width $(x + 9)$. Write its area as a polynomial in standard form.'
            answer: "x^2 + 11x + 18"
            solution_sketch: 'Multiply length by width using FOIL: $x \cdot x + x \cdot 9 + 2 \cdot x + 2 \cdot 9$, then combine.'
          - problem: 'Correct the proposed expansion $(x-5)(x+8)=x^2+13x-40$.'
            answer: "x^2 + 3x - 40"
            solution_sketch: 'The cross-products are $8x$ and $-5x$, whose sum is $3x$; the constant product is $-40$.'
        constraints: "leading coefficient 1; integer constants"
      - id: kp2
        name: One leading coefficient
        key_prerequisites: [multiplying-monomials-polynomials]
        exemplars:
          - problem: 'Expand $(2x - 1)(x + 4)$.'
            answer: "2x^2 + 7x - 4"
            solution_sketch: '$2x^2 + 8x - x - 4$.'
          - problem: 'Use a product grid with row labels $3x,2$ and column labels $x,-5$ to write the expanded polynomial.'
            answer: "3x^2 - 13x - 10"
            solution_sketch: '$3x^2 - 15x + 2x - 10 = 3x^2 - 13x - 10$.'
          - problem: 'A rectangle has length $(4x - 3)$ cm and width $(x + 2)$ cm. Write its area as a polynomial.'
            answer: "4x^2 + 5x - 6"
            solution_sketch: 'Area is length times width: $4x \cdot x + 4x \cdot 2 - 3 \cdot x - 3 \cdot 2$, then combine like terms.'
          - problem: 'Correct the proposed expansion $(2x+5)(x-3)=2x^2+2x-15$.'
            answer: "2x^2 - x - 15"
            solution_sketch: 'The cross-products are $-6x$ and $5x$, which add to $-x$, not $2x$.'
        constraints: "one binomial has coefficient > 1"
      - id: kp3
        name: Both leading coefficients greater than 1
        key_prerequisites: [multiplying-monomials-polynomials, combining-like-terms]
        exemplars:
          - problem: 'Expand $(3x - 2)(2x + 5)$.'
            answer: "6x^2 + 11x - 10"
            solution_sketch: '$6x^2 + 15x - 4x - 10$.'
          - problem: 'A rectangle has side lengths $2x-3$ and $2x-1$, for $x>2$. Write its area polynomial.'
            answer: "4x^2 - 8x + 3"
            solution_sketch: '$4x^2 - 2x - 6x + 3 = 4x^2 - 8x + 3$.'
          - problem: 'A product grid uses row labels $3x,4$ and column labels $2x,-1$. Combine its four cells into a polynomial.'
            answer: "6x^2 + 5x - 4"
            solution_sketch: '$6x^2 - 3x + 8x - 4 = 6x^2 + 5x - 4$.'
          - problem: 'Correct $(2x-5)(3x+2)=6x^2+19x-10$ by checking both cross-products.'
            answer: "6x^2 - 11x - 10"
            solution_sketch: '$6x^2 + 4x - 15x - 10 = 6x^2 - 11x - 10$.'
        constraints: "small coefficients; all four sign patterns"
    diagnostic_exemplar:
      problem: 'Expand $(2x + 3)(3x - 4)$.'
      answer: '6x^2 + x - 12'
      solution_sketch: '$6x^2 - 8x + 9x - 12$.'
    anki_seeds:
      - front: "What does FOIL stand for when multiplying two binomials?"
        back: "First, Outer, Inner, Last — the four products of (a+b)(c+d)."
        type: basic

  - id: polynomial-multiplication
    name: Multiplying Polynomials
    core: true
    difficulty: 0.5
    drill: false               # L4 audit: expansion is multi-step, not a 6s recall skill
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: multiplying-binomials
        weight: 0.8
        key: true
      - id: multiplying-monomials-polynomials
        weight: 0.6
        key: true
      - id: combining-like-terms
        weight: 0.5
      - id: polynomial-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Binomial times a trinomial
        key_prerequisites: [multiplying-binomials, multiplying-monomials-polynomials]
        exemplars:
          - problem: 'Expand $(x + 2)(x^2 - 3x + 1)$.'
            answer: "x^3 - x^2 - 5x + 2"
            solution_sketch: '$x(x^2 - 3x + 1) + 2(x^2 - 3x + 1)$, then combine.'
          - problem: 'Expand $(2x - 1)(x^2 + x - 3)$.'
            answer: "2x^3 + x^2 - 7x + 3"
            solution_sketch: '$2x(x^2 + x - 3) - 1(x^2 + x - 3)$, then combine.'
          - problem: 'A rectangular prism has one dimension $x-3$ and cross-sectional area $x^2+2x+4$, with $x>3$. Write its volume polynomial.'
            answer: "x^3 - x^2 - 2x - 12"
            solution_sketch: '$x(x^2 + 2x + 4) - 3(x^2 + 2x + 4)$, then combine.'
          - problem: 'A product grid has rows $x,4$ and columns $x^2,-x,2$. Sum its six cells in standard form.'
            answer: "x^3 + 3x^2 - 2x + 8"
            solution_sketch: '$x(x^2 - x + 2) + 4(x^2 - x + 2)$, then combine.'
        constraints: "six products, then combine like terms"
      - id: kp2
        name: Products of three factors
        key_prerequisites: [multiplying-binomials]
        exemplars:
          - problem: 'Expand $(x + 1)(x + 2)(x + 3)$.'
            answer: "x^3 + 6x^2 + 11x + 6"
            solution_sketch: '$(x+1)(x+2) = x^2 + 3x + 2$; multiply by $(x+3)$.'
          - problem: 'Expand $x(x - 2)(x + 5)$.'
            answer: "x^3 + 3x^2 - 10x"
            solution_sketch: '$(x-2)(x+5) = x^2 + 3x - 10$; distribute $x$.'
          - problem: 'A box has dimensions $x+2$, $x-3$, and $x+1$, with $x>3$. Write its volume in standard form.'
            answer: "x^3 - 7x - 6"
            solution_sketch: '$(x+2)(x-3) = x^2 - x - 6$; multiply by $(x+1)$.'
          - problem: 'A student expands $x(x+3)(x-4)$ as $x^3-x^2-12$. Correct the product.'
            answer: "x^3 - x^2 - 12x"
            solution_sketch: 'The binomials give $x^2-x-12$; multiplication by the outside $x$ gives $x^3-x^2-12x$.'
        constraints: "multiply two factors first, then the third"
      - id: kp3
        name: Larger products with many like terms
        key_prerequisites: [multiplying-binomials, combining-like-terms]
        exemplars:
          - problem: 'Expand $(x^2 + 2x - 1)(x^2 - x + 3)$.'
            answer: "x^4 + x^3 + 7x - 3"
            solution_sketch: 'Nine products; the $x^2$ terms cancel: $3 - 2 - 1 = 0$.'
          - problem: 'Expand $(x^2 + x + 1)(x^2 - x + 1)$.'
            answer: "x^4 + x^2 + 1"
            solution_sketch: 'Group as $((x^2+1)+x)((x^2+1)-x)=(x^2+1)^2-x^2=x^4+x^2+1$; the odd powers cancel.'
          - problem: 'A $3$ by $3$ grid has rows $x^2,-x,2$ and columns $x^2,x,-1$. Sum all nine products, including cancellations.'
            answer: "x^4 + 3x - 2"
            solution_sketch: 'The cubic terms cancel. Quadratic coefficients sum to $-1-1+2=0$; linear terms give $x+2x=3x$, and the constant is $-2$. The result is $x^4+3x-2$.'
          - problem: 'Two polynomial factors represent a rectangle''s sides: $x^2+3x-2$ and $x^2-2x+1$, with $x>2$. Write its area in standard form.'
            answer: "x^4 + x^3 - 7x^2 + 7x - 2"
            solution_sketch: 'Collect the nine products by degree: cubic coefficients $-2+3=1$, quadratic coefficients $1-6-2=-7$, linear coefficients $3+4=7$, and constant $-2$.'
        constraints: "trinomial times trinomial; watch cancellation"
    diagnostic_exemplar:
      problem: 'Expand $(x + 3)(x^2 - 2x + 4)$.'
      answer: "x^3 + x^2 - 2x + 12"
      solution_sketch: '$x^3 - 2x^2 + 4x + 3x^2 - 6x + 12$.'
    anki_seeds:
      - front: "Multiplying a binomial by a trinomial produces how many products before combining?"
        back: "6 (each of 2 terms times each of 3 terms)"
        type: basic

  - id: special-products
    name: Special Products of Binomials
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: multiplying-binomials
        weight: 0.8
        key: true
      - id: combining-like-terms
        weight: 0.4
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Square of a sum and of a difference
        key_prerequisites: [multiplying-binomials]
        exemplars:
          - problem: 'Expand $(x + 5)^2$.'
            answer: "x^2 + 10x + 25"
            solution_sketch: '$a^2 + 2ab + b^2$ with $a = x$, $b = 5$.'
          - problem: 'Correct the proposed square $(x-4)^2=x^2+16$ by restoring the cross-product term.'
            answer: "x^2 - 8x + 16"
            solution_sketch: '$a^2 - 2ab + b^2$ with $a = x$, $b = 4$.'
          - problem: 'A square has side length $(x + 6)$. Write its area as a polynomial.'
            answer: "x^2 + 12x + 36"
            solution_sketch: 'Area of a square is side squared: $(x + 6)^2 = x^2 + 2(6)x + 36$.'
          - problem: 'Use the pattern $a^2 - 2ab + b^2$ to expand $(x - 9)^2$, showing the middle term explicitly.'
            answer: "x^2 - 18x + 81"
            solution_sketch: 'With $a = x$ and $b = 9$: $x^2 - 2(x)(9) + 9^2$ gives $x^2 - 18x + 81$.'
        constraints: "(a ± b)^2 = a^2 ± 2ab + b^2; never just a^2 + b^2"
      - id: kp2
        name: Product of conjugates
        key_prerequisites: [multiplying-binomials]
        exemplars:
          - problem: 'Expand $(x + 7)(x - 7)$.'
            answer: "x^2 - 49"
            solution_sketch: 'The cross-products are $-7x$ and $7x$, so they cancel. The remaining terms are $x^2$ and $-49$.'
          - problem: 'A product grid has rows $2x,3$ and columns $2x,-3$. Use cancellation to write its total as a polynomial.'
            answer: "4x^2 - 9"
            solution_sketch: 'Middle terms cancel: $a^2 - b^2$ with $a = 2x$, $b = 3$.'
          - problem: 'A rectangular field has sides $x+10$ and $x-10$ metres, with $x>10$. Write its area polynomial.'
            answer: "x^2 - 100"
            solution_sketch: 'The two measurements are conjugates, so the outer and inner products cancel: $a^2 - b^2$ with $a = x$, $b = 10$.'
          - problem: 'A student writes $(3x+1)(3x-1)=9x^2+1$. Correct the constant term and give the polynomial.'
            answer: "9x^2 - 1"
            solution_sketch: 'Outer $3x \cdot (-1)$ and inner $1 \cdot 3x$ cancel, leaving $(3x)^2 - 1^2$.'
        constraints: "(a + b)(a - b) = a^2 - b^2"
      - id: kp3
        name: Special products with coefficients
        key_prerequisites: [multiplying-binomials]
        exemplars:
          - problem: 'Expand $(3x - 4)^2$.'
            answer: "9x^2 - 24x + 16"
            solution_sketch: '$(3x)^2 - 2(3x)(4) + 4^2$.'
          - problem: 'Correct $(2x+5)^2=4x^2+10x+25$ by recomputing the middle term.'
            answer: "4x^2 + 20x + 25"
            solution_sketch: '$(2x)^2 + 2(2x)(5) + 5^2$.'
          - problem: 'A square tile has side length $(5x - 2)$. Write its area as a polynomial.'
            answer: "25x^2 - 20x + 4"
            solution_sketch: 'Area of a square is side squared: $(5x)^2 - 2(5x)(2) + 2^2$.'
          - problem: 'Use the pattern $a^2 + 2ab + b^2$ to expand $(4x + 3)^2$, showing the middle term explicitly.'
            answer: "16x^2 + 24x + 9"
            solution_sketch: 'With $a = 4x$ and $b = 3$: $(4x)^2 + 2(4x)(3) + 3^2$ gives $16x^2 + 24x + 9$.'
        constraints: "a = coefficient times x; compute 2ab carefully"
    diagnostic_exemplar:
      problem: 'Expand $(2x - 5)^2$.'
      answer: '4x^2 - 20x + 25'
      solution_sketch: '$(2x)^2 - 2(2x)(5) + 5^2$.'
    anki_seeds:
      - front: "(a + b)^2 = ?"
        back: "a^2 + 2ab + b^2"
        type: basic
      - front: "(a + b)(a - b) = ?"
        back: "a^2 - b^2"
        type: basic

  - id: binomial-cubes
    name: Cubing a Binomial
    core: false                # special-product extension, terminal
    difficulty: 0.60
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: special-products
        weight: 0.7
        key: true
      - id: polynomial-multiplication
        weight: 0.6
        key: true
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Expand (a + b)^3 by repeated multiplication
        key_prerequisites: [special-products, polynomial-multiplication]
        exemplars:
          - problem: 'Expand $(x + 5)^3$.'
            answer: "x^3 + 15x^2 + 75x + 125"
            solution_sketch: '$(x+5)^2 = x^2 + 10x + 25$; multiply by $(x+5)$.'
          - problem: 'A cube has edge length $(x + 1)$. Write its volume as a polynomial in standard form.'
            answer: "x^3 + 3x^2 + 3x + 1"
            solution_sketch: 'Volume is edge cubed: $(x+1)^2 = x^2 + 2x + 1$; multiply by $(x+1)$.'
          - problem: 'A product grid has rows $x,2$ and columns $x^2,4x,4$, the terms of $(x+2)^2$. Sum all cells to expand $(x+2)^3$.'
            answer: "x^3 + 6x^2 + 12x + 8"
            solution_sketch: 'With $a = x$, $b = 2$: $x^3 + 3(x^2)(2) + 3(x)(4) + 8$.'
          - problem: 'A student expands $(x+3)^3$ as $x^3+9x^2+9x+27$. Correct it by multiplying $(x+3)^2$ by $(x+3)$.'
            answer: "x^3 + 9x^2 + 27x + 27"
            solution_sketch: 'The square is $x^2+6x+9$. The linear terms in the next product are $18x+9x=27x$, giving $x^3+9x^2+27x+27$.'
        constraints: "square first, then multiply by the remaining factor"
      - id: kp2
        name: Cubes of differences
        key_prerequisites: [special-products, polynomial-multiplication]
        exemplars:
          - problem: 'Expand $(x - 3)^3$.'
            answer: "x^3 - 9x^2 + 27x - 27"
            solution_sketch: 'First square to obtain $x^2-6x+9$. Multiply by $x-3$: the quadratic terms total $-9x^2$, linear terms total $27x$, and the constant is $-27$.'
          - problem: 'A cube has edge length $(x - 2)$. Write its volume as a polynomial in standard form.'
            answer: "x^3 - 6x^2 + 12x - 8"
            solution_sketch: 'Volume is edge cubed: $(x-2)^2 = x^2 - 4x + 4$; multiply by $(x-2)$.'
          - problem: 'Use the binomial-cube pattern $a^3 - 3a^2b + 3ab^2 - b^3$ to expand $(x - 4)^3$.'
            answer: "x^3 - 12x^2 + 48x - 64"
            solution_sketch: 'With $a = x$, $b = 4$: $x^3 - 3(x^2)(4) + 3(x)(16) - 64$.'
          - problem: 'Correct the sign error in $(x-5)^3=x^3-15x^2-75x-125$ by multiplying $(x-5)^2$ by $(x-5)$.'
            answer: "x^3 - 15x^2 + 75x - 125"
            solution_sketch: 'The square is $x^2-10x+25$. The linear products are $50x+25x=75x$; the constant is $-125$.'
        constraints: "alternating signs in the expansion"
      - id: kp3
        name: Use the formula a^3 ± 3a^2b + 3ab^2 ± b^3
        key_prerequisites: [special-products]
        exemplars:
          - problem: 'Expand $(2x + 1)^3$ using the binomial-cube pattern.'
            answer: "8x^3 + 12x^2 + 6x + 1"
            solution_sketch: '$a = 2x$, $b = 1$: $8x^3 + 3(4x^2) + 3(2x) + 1$.'
          - problem: 'A cube has side $x+4$. Use coefficients $1,3,3,1$ to write its volume polynomial.'
            answer: "x^3 + 12x^2 + 48x + 64"
            solution_sketch: '$a = x$, $b = 4$: $x^3 + 3(4x^2) + 3(16x) + 64$.'
          - problem: 'In a binomial-cube coefficient table, substitute $a=3x$, $b=1$ into columns $a^3,3a^2b,3ab^2,b^3$. Write their sum.'
            answer: "27x^3 + 27x^2 + 9x + 1"
            solution_sketch: '$a = 3x$, $b = 1$: $27x^3 + 3(9x^2) + 3(3x) + 1$.'
          - problem: 'Correct $(x+5)^3=x^3+15x^2+15x+125$ using the binomial-cube formula.'
            answer: "x^3 + 15x^2 + 75x + 125"
            solution_sketch: '$a = x$, $b = 5$: $x^3 + 3(5x^2) + 3(25x) + 125$.'
        constraints: "coefficients 1-3-3-1 with powers stepping down"
    diagnostic_exemplar:
      problem: 'Expand $(2x - 1)^3$.'
      answer: '8x^3 - 12x^2 + 6x - 1'
      solution_sketch: 'Coefficients $1, 3, 3, 1$ with $a = 2x$ and $b = -1$.'
    anki_seeds:
      - front: "(a + b)^3 = ?"
        back: "a^3 + 3a^2 b + 3ab^2 + b^3"
        type: basic

  - id: dividing-polynomials-by-monomials
    name: Dividing a Polynomial by a Monomial
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: exponent-product-quotient-rules
        weight: 0.7
        key: true
      - id: multiplying-monomials-polynomials
        weight: 0.5
        key: true
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Divide each term by the monomial
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Divide $\frac{6x^3 - 9x^2 + 3x}{3x}$.'
            answer: "2x^2 - 3x + 1"
            solution_sketch: 'The three quotients are $6x^3/(3x)=2x^2$, $-9x^2/(3x)=-3x$, and $3x/(3x)=1$. Add them.'
          - problem: 'Divide $\frac{8x^4 + 4x^2}{4x^2}$.'
            answer: "2x^2 + 1"
            solution_sketch: 'Divide each term: $8x^4/(4x^2)=2x^2$ and $4x^2/(4x^2)=1$. The quotient is $2x^2+1$.'
          - problem: 'A rectangle has area $15x^4-5x^2$ and width $5x^2$, for $x>1$. Write its length polynomial.'
            answer: "3x^2 - 1"
            solution_sketch: 'Length is area divided by width. The term quotients are $15x^4/(5x^2)=3x^2$ and $-5x^2/(5x^2)=-1$.'
          - problem: 'A quotient table divides terms $6x^5$ and $-9x^3$ by $3x^2$. Combine the two quotients.'
            answer: "2x^3 - 3x"
            solution_sketch: 'Divide coefficients and subtract the divisor''s exponent: $6x^5/(3x^2)=2x^3$ and $-9x^3/(3x^2)=-3x$.'
        constraints: "every term divisible; positive coefficients on the divisor"
      - id: kp2
        name: Negative coefficients and signs
        key_prerequisites: [exponent-product-quotient-rules, integer-multiplication-division]
        exemplars:
          - problem: 'Divide $\frac{-10x^3 + 5x^2}{5x}$.'
            answer: "-2x^2 + x"
            solution_sketch: '$-10/5 = -2$; $5/5 = 1$.'
          - problem: 'Divide $\frac{12x^5 - 8x^3}{-4x^2}$.'
            answer: "-3x^3 + 2x"
            solution_sketch: '$12/-4 = -3$; $-8/-4 = 2$.'
          - problem: 'Correct $(-6x^4+9x^3)/(3x^2)=-2x^2+3x^3$ by checking the exponent subtraction.'
            answer: "-2x^2 + 3x"
            solution_sketch: 'Each term divides by $3x^2$: $-6x^4$ gives $-2x^2$ and $9x^3$ gives $3x$.'
          - problem: 'Divide $\frac{-20x^4 + 15x^3 - 5x^2}{-5x^2}$.'
            answer: "4x^2 - 3x + 1"
            solution_sketch: 'Divide all three terms by $-5x^2$: $-20x^4$ gives $4x^2$, $15x^3$ gives $-3x$, and $-5x^2$ gives $1$.'
        constraints: "track the sign of each quotient term"
      - id: kp3
        name: Two variables
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Divide $\frac{9x^2y^3 + 6xy^2}{3xy}$.'
            answer: "3xy^2 + 2y"
            solution_sketch: 'The quotients are $9x^2y^3/(3xy)=3xy^2$ and $6xy^2/(3xy)=2y$, found by subtracting the exponents of each variable.'
          - problem: 'Divide $\frac{4a^3b - 2a^2b^2}{2a^2b}$.'
            answer: "2a - b"
            solution_sketch: 'Divide $4a^3b$ by $2a^2b$ to get $2a$. Divide $-2a^2b^2$ by the same divisor to get $-b$. Add the two quotients.'
          - problem: 'For nonzero $x,y$, a product equals $15x^3y^2+10x^2y^3$ and one factor is $5x^2y$. Find the other polynomial factor.'
            answer: "3xy + 2y^2"
            solution_sketch: 'Divide coefficients and subtract exponents per variable: $3xy$ and $2y^2$.'
          - problem: 'Correct $(8a^2b^3-4ab^2)/(4ab)=2ab^2-1$ by dividing the second term in both variables.'
            answer: "2ab^2 - b"
            solution_sketch: 'Divide coefficients and subtract exponents per variable: $2ab^2$ and $-b$.'
        constraints: "each variable handled separately"
    diagnostic_exemplar:
      problem: 'Divide $\frac{9x^3y^2 - 6x^2y}{-3x^2y}$.'
      answer: '-3xy + 2'
      solution_sketch: '$\frac{9x^3y^2}{-3x^2y} = -3xy$ and $\frac{-6x^2y}{-3x^2y} = 2$.'
    anki_seeds:
      - front: "To divide a polynomial by a monomial ..."
        back: "divide every term of the polynomial by the monomial"
        type: basic

  - id: polynomial-division
    name: Dividing Polynomials
    core: true                 # promoted: prerequisite of calculus-2 core topics (partial fractions)
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: dividing-polynomials-by-monomials
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.6
        key: true
      - id: polynomial-addition-subtraction
        weight: 0.6
        key: true
      - id: distributive-property
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Long division with no remainder
        key_prerequisites: [polynomial-multiplication]
        exemplars:
          - problem: 'Divide $\frac{x^2 + 5x + 6}{x + 2}$.'
            answer: "x + 3"
            solution_sketch: 'The leading quotient is $x$. Subtract $x(x+2)$ to leave $3x+6$; then divide by $x+2$ to get $3$. The quotient is $x+3$ with remainder zero.'
          - problem: 'Divide $\frac{x^2 - 7x + 12}{x - 3}$.'
            answer: "x - 4"
            solution_sketch: 'The leading quotient is $x$. Subtract $x(x-3)$ to leave $-4x+12$; the next quotient term is $-4$, leaving no remainder.'
          - problem: 'Use long division to find the missing polynomial $Q$ in $x^2+x-6=(x-2)Q$.'
            answer: "x + 3"
            solution_sketch: 'Long division starts with $x$. Subtract $x(x-2)$ from the dividend to leave $3x-6$; dividing once more gives $3$ and zero remainder.'
          - problem: 'A rectangle has area $x^2-x-20$ and width $x+4$, with $x>5$. Use long division to find its length.'
            answer: "x - 5"
            solution_sketch: 'Length is the area divided by $x+4$. The first quotient term $x$ leaves $-5x-20$ after subtraction; the next term $-5$ leaves remainder zero.'
        constraints: "quadratic over linear; exact division"
      - id: kp2
        name: Long division with a remainder
        key_prerequisites: [polynomial-multiplication, polynomial-addition-subtraction]
        exemplars:
          - problem: 'Divide $\frac{x^2 + 3x + 5}{x + 1}$. Give quotient and remainder.'
            answer: "x + 2 remainder 3"
            solution_sketch: '$(x+1)(x+2) = x^2 + 3x + 2$; $5 - 2 = 3$ remainder.'
          - problem: 'Divide $\frac{2x^2 - x - 1}{x - 2}$.'
            answer: "2x + 3 remainder 5"
            solution_sketch: '$(x-2)(2x+3) = 2x^2 - x - 6$; $-1 - (-6) = 5$.'
          - problem: 'Find $Q$ and $R$ in $x^2+5x+8=(x+2)Q+R$, where $R$ is constant, using long division.'
            answer: "x + 3 remainder 2"
            solution_sketch: '$(x+2)(x+3) = x^2 + 5x + 6$; $8 - 6 = 2$ remainder.'
          - problem: 'A student divides $3x^2-x+4$ by $x-1$ and proposes quotient $3x+2$ and remainder $2$. Correct the quotient-remainder result.'
            answer: "3x + 2 remainder 6"
            solution_sketch: '$(x-1)(3x+2) = 3x^2 - x - 2$; $4 - (-2) = 6$ remainder.'
        constraints: "state quotient and remainder separately"
      - id: kp3
        name: Missing terms in the dividend
        key_prerequisites: [polynomial-multiplication, polynomial-addition-subtraction]
        exemplars:
          - problem: 'Divide $\frac{x^3 - 8}{x - 2}$.'
            answer: "x^2 + 2x + 4"
            solution_sketch: 'Use dividend coefficients $1,0,0,-8$. Subtract $x^2(x-2)$ to leave $2x^2-8$, then $2x(x-2)$ to leave $4x-8$, and finally $4(x-2)$. The quotient is $x^2+2x+4$.'
          - problem: 'Divide $\frac{x^3 + 1}{x + 1}$.'
            answer: "x^2 - x + 1"
            solution_sketch: 'Use $x^3+0x^2+0x+1$. Quotient terms $x^2$, $-x$, and $1$ successively leave remainders $-x^2+1$, $x+1$, and $0$.'
          - problem: 'A coefficient row for the dividend is $(1,0,0,-27)$ in descending cubic order. Divide by $x-3$ using long division and write the quotient.'
            answer: "x^2 + 3x + 9"
            solution_sketch: 'Use $x^3+0x^2+0x-27$. Successive quotient terms $x^2$, $3x$, and $9$ leave $3x^2-27$, then $9x-27$, then zero.'
          - problem: 'Use long division with zero placeholders to find $Q$ in $x^3+8=(x+2)Q$.'
            answer: "x^2 - 2x + 4"
            solution_sketch: 'Use $x^3+0x^2+0x+8$. The quotient terms $x^2$, $-2x$, and $4$ leave $-2x^2+8$, then $4x+8$, then zero.'
        constraints: "write 0-coefficient placeholders for absent powers"
    diagnostic_exemplar:
      problem: 'Divide $\frac{x^3 + 5}{x - 1}$. Give quotient and remainder.'
      answer: "x^2 + x + 1 remainder 6"
      solution_sketch: 'Restore the missing terms as $x^3 + 0x^2 + 0x + 5$; synthetic division by $c = 1$ gives the row $1, 1, 1$ with remainder $6$.'
    anki_seeds:
      - front: "Before polynomial long division, rewrite the dividend with..."
        back: "0-coefficient placeholders for any missing powers."
        type: basic
      - front: "Check for polynomial division: dividend = ?"
        back: "divisor × quotient + remainder"
        type: basic

  - id: synthetic-division
    name: Synthetic Division
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: polynomial-division
        weight: 0.8
        key: true
      - id: evaluating-polynomials
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Synthetic division by x - c
        key_prerequisites: [polynomial-division]
        exemplars:
          - problem: 'Use synthetic division to divide $x^2 + 5x + 6$ by $x + 2$.'
            answer: "x + 3"
            solution_sketch: '$c = -2$; row $1, 5, 6$ gives $1, 3, 0$.'
          - problem: 'Use synthetic division to divide $x^3 - 6x^2 + 11x - 6$ by $x - 1$.'
            answer: "x^2 - 5x + 6"
            solution_sketch: '$c = 1$; $1, -5, 6, 0$.'
          - problem: 'The dividend coefficient row is $(1,-1,-6)$. Use synthetic value $3$ to find the quotient polynomial.'
            answer: "x + 2"
            solution_sketch: '$c = 3$; row $1, -1, -6$ gives $1, 2, 0$.'
          - problem: 'Use synthetic division to find $Q$ in $x^3-3x^2-4x+12=(x-2)Q$.'
            answer: "x^2 - x - 6"
            solution_sketch: '$c = 2$; row $1, -3, -4, 12$ gives $1, -1, -6, 0$.'
        constraints: "linear divisor with leading coefficient 1; remainder 0"
      - id: kp2
        name: Read off the remainder
        key_prerequisites: [polynomial-division]
        exemplars:
          - problem: 'Use synthetic division to divide $x^2 + 3x + 5$ by $x + 1$. Give quotient and remainder.'
            answer: "x + 2 remainder 3"
            solution_sketch: '$c = -1$; $1, 2, 3$.'
          - problem: 'Use synthetic division to divide $2x^3 - 3x + 1$ by $x - 2$. Give quotient and remainder.'
            answer: "2x^2 + 4x + 5 remainder 11"
            solution_sketch: 'Insert $0$ for the missing $x^2$: $2, 4, 5, 11$.'
          - problem: 'The coefficient row $(1,1,4)$ is divided using synthetic value $1$. Give the quotient polynomial and remainder.'
            answer: "x + 2 remainder 6"
            solution_sketch: '$c = 1$; row $1, 1, 4$ gives $1, 2, 6$.'
          - problem: 'A student uses coefficient row $(2,-1,5)$ for $(2x^3-x+5)/(x-1)$. Restore the missing-power placeholder and give the correct quotient and remainder.'
            answer: "2x^2 + 2x + 1 remainder 6"
            solution_sketch: 'Insert $0$ for the missing $x^2$: $2, 2, 1, 6$.'
        constraints: "include 0 placeholders for missing powers"
      - id: kp3
        name: The remainder theorem
        key_prerequisites: [evaluating-polynomials, polynomial-division]
        exemplars:
          - problem: 'Without dividing, find the remainder when $x^2 - 4x + 7$ is divided by $x - 3$.'
            answer: "4"
            solution_sketch: '$p(3) = 9 - 12 + 7 = 4$.'
          - problem: 'Without dividing, find the remainder when $x^3 - 2x^2 + x - 5$ is divided by $x - 2$.'
            answer: "-3"
            solution_sketch: '$p(2) = 8 - 8 + 2 - 5 = -3$.'
          - problem: 'A division identity reads $x^2+3x-1=(x-2)Q(x)+R$. Find the constant $R$ by substitution, without finding $Q$.'
            answer: "9"
            solution_sketch: '$p(2) = 4 + 6 - 1 = 9$.'
          - problem: 'A polynomial evaluator reports $p(1)=-3$ for $p(x)=x^3+x^2-5$. What remainder must division by $x-1$ leave?'
            answer: "-3"
            solution_sketch: 'At $x=1$, the term $(x-1)Q(x)$ vanishes, so the division identity gives $R=p(1)=-3$.'
        constraints: "remainder on division by x - c equals p(c)"
    diagnostic_exemplar:
      problem: 'Use synthetic division to divide $x^3 - 4x + 6$ by $x + 2$. Give quotient and remainder.'
      answer: 'x^2 - 2x remainder 6'
      solution_sketch: '$c = -2$; the row $1, 0, -4, 6$ gives $1, -2, 0$ with remainder $6$.'
    anki_seeds:
      - front: "Remainder theorem: dividing p(x) by (x - c) leaves remainder ..."
        back: "p(c)"
        type: basic
      - front: "Synthetic division works only when the divisor has the form ..."
        back: "x - c (linear, leading coefficient 1)"
        type: basic

  - id: gcf-of-monomials
    name: GCF of Monomials
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: gcf-lcm
        weight: 0.8
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.5
        key: true
      - id: prime-factorization
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: GCF of coefficients
        key_prerequisites: [gcf-lcm]
        exemplars:
          - problem: 'Find the GCF of $28$ and $42$.'
            answer: "14"
            solution_sketch: '$28 = 2^2 \cdot 7$, $42 = 2 \cdot 3 \cdot 7$; take $2 \cdot 7$.'
          - problem: 'Two prime-factor lists are $2\cdot3^2$ and $3^2\cdot5$. Find their greatest common factor.'
            answer: "9"
            solution_sketch: '$18 = 2 \cdot 3^2$, $45 = 3^2 \cdot 5$; take $3^2 = 9$.'
          - problem: 'A florist has $24$ roses and $36$ lilies. What is the greatest number of identical bouquets using every flower?'
            answer: "12"
            solution_sketch: 'The bouquet count must divide both totals. Their prime factors share $2^2\cdot3=12$, so twelve bouquets are possible.'
          - problem: 'A student claims the GCF of $16$ and $40$ is $4$. Give the largest common factor.'
            answer: "8"
            solution_sketch: 'Both numbers divide by $8$: $16=2(8)$ and $40=5(8)$. Since $2$ and $5$ are coprime, no larger common factor exists.'
        constraints: "two-digit integers"
      - id: kp2
        name: GCF of one-variable monomials
        key_prerequisites: [gcf-lcm, exponent-product-quotient-rules]
        exemplars:
          - problem: 'Find the GCF of $12x^3$ and $18x^2$.'
            answer: "6x^2"
            solution_sketch: '$\text{GCF}(12, 18) = 6$; lowest power of $x$ is $x^2$.'
          - problem: 'A monomial table lists coefficient/exponent pairs $(8,2)$ and $(20,1)$ for the variable $x$. Find the GCF monomial.'
            answer: "4x"
            solution_sketch: '$\text{GCF}(8, 20) = 4$; lowest power of $x$ is $x^1$.'
          - problem: 'A student proposes $5x^4$ as the GCF of $15x^4$ and $25x^2$. Correct the monomial.'
            answer: "5x^2"
            solution_sketch: '$\text{GCF}(15, 25) = 5$; lowest power of $x$ is $x^2$.'
          - problem: 'A common monomial factor must divide both terms of $9x^3+6x$. Find the greatest such monomial.'
            answer: "3x"
            solution_sketch: '$\text{GCF}(9, 6) = 3$; lowest power of $x$ is $x^1$.'
        constraints: "take the lowest power of the shared variable"
      - id: kp3
        name: GCF with two variables or three monomials
        key_prerequisites: [gcf-lcm, exponent-product-quotient-rules]
        exemplars:
          - problem: 'Find the GCF of $12x^2y^3$ and $18xy^4$.'
            answer: "6xy^3"
            solution_sketch: 'Coefficient GCF $6$; lowest powers $x$ and $y^3$.'
          - problem: 'Find the GCF of $6x^3$, $9x^2$, and $12x$.'
            answer: "3x"
            solution_sketch: 'Coefficient GCF $3$; lowest power $x^1$.'
          - problem: 'Exponent-table rows $(10,3,2)$ and $(15,1,4)$ list coefficient, $x$ exponent, and $y$ exponent. Find the GCF of the represented monomials.'
            answer: "5xy^2"
            solution_sketch: 'Coefficient GCF $5$; lowest powers $x^1$ and $y^2$.'
          - problem: 'A student proposes $4x^2y^2$ as the common monomial factor of $8x^2y$, $12xy^2$, and $20xy$. Correct the GCF.'
            answer: "4xy"
            solution_sketch: 'Coefficient GCF $4$; lowest powers $x^1$ and $y^1$.'
        constraints: "lowest power of each shared variable"
    diagnostic_exemplar:
      problem: 'Find the GCF of $12x^3y^2$ and $18x^2y^4$.'
      answer: '6x^2 y^2'
      solution_sketch: 'GCF$(12, 18) = 6$; take the lowest power of each variable, $x^2$ and $y^2$.'
    anki_seeds:
      - front: "The GCF of two monomials takes the ___ power of each shared variable."
        back: "lowest"
        type: basic

  - id: factoring-gcf
    name: Factoring Out the Greatest Common Factor
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: gcf-of-monomials
        weight: 0.8
        key: true
      - id: distributive-property
        weight: 1.0
        key: true
      - id: polynomial-multiplication
        weight: 0.3
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Factor the GCF out of a polynomial
        key_prerequisites: [distributive-property, gcf-of-monomials]
        exemplars:
          - problem: 'Factor $6x^2 + 9x$.'
            answer: "3x(2x + 3)"
            solution_sketch: 'GCF is $3x$; $\frac{6x^2}{3x} = 2x$, $\frac{9x}{3x} = 3$.'
          - problem: 'A design model has volume $10x^3 - 15x^2 + 5x$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors by extracting its GCF.'
            answer: "5x(2x^2 - 3x + 1)"
            solution_sketch: 'The coefficient GCF is $5$ and every term contains $x$. Dividing by $5x$ gives $2x^2$, $-3x$, and $1$, so extract $5x$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $8$; power $1$: coefficient $12$. Reconstruct it and write its factored form over the integers.'
            answer: '4*x*(2*x + 3)'
            solution_sketch: 'GCF is $4x$; $\frac{8x^2}{4x} = 2x$, $\frac{12x}{4x} = 3$.'
          - problem: 'A learner extracts $3x$ from $9x^3-6x^2+3x$ but writes $3x(3x^2-2x)$. Correct the factored expression.'
            answer: '3*x*(3*x^2 - 2*x + 1)'
            solution_sketch: 'GCF is $3x$; $\frac{9x^3}{3x} = 3x^2$, $\frac{-6x^2}{3x} = -2x$, $\frac{3x}{3x} = 1$.'
        constraints: "verify by redistributing"
      - id: kp2
        name: Factor out a negative or higher-power GCF
        key_prerequisites: [integer-multiplication-division, gcf-of-monomials]
        exemplars:
          - problem: 'Factor $-4x^2 - 8x$.'
            answer: "-4x(x + 2)"
            solution_sketch: 'Factor out $-4x$ so the leading sign is positive inside.'
          - problem: 'A design model has volume $14x^4 + 21x^3 - 7x^2$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors by extracting its GCF.'
            answer: "7x^2(2x^2 + 3x - 1)"
            solution_sketch: 'Coefficients share $7$ and the smallest exponent is $2$. Divide by $7x^2$: the remaining terms are $2x^2$, $3x$, and $-1$.'
          - problem: 'Extract a negative GCF from $-6x^2-9x$, leaving a positive leading coefficient inside the bracket.'
            answer: '-3*x*(2*x + 3)'
            solution_sketch: 'Factor out $-3x$ so the leading sign is positive inside.'
          - problem: 'A learner proposes $4x^2(3x^2-2x)$ for $12x^4-8x^3+4x^2$. Restore the missing term and give the factored expression.'
            answer: '4*x^2*(3*x^2 - 2*x + 1)'
            solution_sketch: 'GCF is $4x^2$; $\frac{12x^4}{4x^2} = 3x^2$, $\frac{-8x^3}{4x^2} = -2x$, $\frac{4x^2}{4x^2} = 1$.'
        constraints: "watch the leftover 1 when a term equals the GCF"
      - id: kp3
        name: Factor out a common binomial
        key_prerequisites: [distributive-property]
        exemplars:
          - problem: 'Factor $3x(x + 2) + 5(x + 2)$.'
            answer: "(x + 2)(3x + 5)"
            solution_sketch: 'The binomial $(x + 2)$ is the common factor.'
          - problem: 'Two adjacent rectangles share width $x-4$ and have lengths $x$ and $3$, with $x>4$. Their total area is $x(x-4)+3(x-4)$. Write it as one product.'
            answer: "(x - 4)(x + 3)"
            solution_sketch: 'The binomial $(x - 4)$ is the common factor.'
          - problem: 'A factor table lists two products: $4x$ times $(x+5)$, and $3$ times $(x+5)$. Factor their sum without expanding the common binomial.'
            answer: '(x + 5)*(4*x + 3)'
            solution_sketch: 'The binomial $(x + 5)$ is the common factor.'
          - problem: 'Correct the incomplete extraction $2x(x-1)-5(x-1)=(x-1)(2x)$.'
            answer: '(x - 1)*(2*x - 5)'
            solution_sketch: 'Both summands contain $(x-1)$. Their remaining factors are $2x$ and $-5$, so the second bracket is $2x-5$.'
        constraints: "common factor is a binomial; sets up factoring by grouping"
    diagnostic_exemplar:
      problem: 'Factor completely: $4x(x + 1) - 8(x + 1)$.'
      answer: '4(x + 1)(x - 2)'
      solution_sketch: 'Pull out $(x + 1)$: $(x + 1)(4x - 8)$, then factor $4$ from the second bracket.'
    anki_seeds:
      - front: "The first step of any factoring problem:"
        back: "factor out the greatest common factor (GCF); verify by redistributing."
        type: basic
      - front: "If a polynomial's leading term is negative, factor out..."
        back: "a negative GCF, so the leading term inside the parentheses is positive."
        type: basic
      - front: "When a term equals the GCF itself, the factored form keeps..."
        back: "a 1 in its place (e.g. 5x² + 5x = 5x(x + 1))."
        type: basic

  - id: factoring-by-grouping
    name: Factoring by Grouping
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: factoring-gcf
        weight: 0.8
        key: true
      - id: distributive-property
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Group four-term polynomials
        key_prerequisites: [factoring-gcf]
        exemplars:
          - problem: 'Factor $x^3 + 2x^2 + 3x + 6$.'
            answer: "(x + 2)(x^2 + 3)"
            solution_sketch: '$x^2(x+2) + 3(x+2) = (x+2)(x^2+3)$.'
          - problem: 'A design model has volume $x^3 - 4x^2 + 2x - 8$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x - 4)(x^2 + 2)"
            solution_sketch: '$x^2(x - 4) + 2(x - 4) = (x - 4)(x^2 + 2)$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $3$: coefficient $1$; power $2$: coefficient $-5$; power $1$: coefficient $3$; power $0$: coefficient $-15$. Reconstruct it and write its factored form over the integers.'
            answer: '(x - 5)*(x^2 + 3)'
            solution_sketch: '$x^2(x - 5) + 3(x - 5) = (x - 5)(x^2 + 3)$.'
          - problem: 'A learner groups $x^3-2x^2+7x-14$ as $x^2(x-2)+7(x-2)$ and stops. Complete the factorization.'
            answer: '(x - 2)*(x^2 + 7)'
            solution_sketch: 'Both groups contain $x-2$. Extract it to obtain $(x-2)(x^2+7)$; the quadratic has no integer factors.'
        constraints: 'four terms with leading coefficient 1; group the first two and the last two; integer coefficients'
      - id: kp2
        name: Grouping with a common binomial factor
        key_prerequisites: [factoring-gcf, distributive-property]
        exemplars:
          - problem: 'Factor $6x^2 + 3x + 4x + 2$.'
            answer: "(2x + 1)(3x + 2)"
            solution_sketch: '$3x(2x+1) + 2(2x+1) = (2x+1)(3x+2)$.'
          - problem: 'A design model has volume $2x^3 - x^2 - 6x + 3$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(2x - 1)(x^2 - 3)"
            solution_sketch: '$x^2(2x - 1) - 3(2x - 1) = (2x - 1)(x^2 - 3)$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $3$: coefficient $3$; power $2$: coefficient $-2$; power $1$: coefficient $12$; power $0$: coefficient $-8$. Reconstruct it and write its factored form over the integers.'
            answer: '(3*x - 2)*(x^2 + 4)'
            solution_sketch: '$x^2(3x - 2) + 4(3x - 2) = (3x - 2)(x^2 + 4)$.'
          - problem: 'Correct the grouped factorization $2x^3-5x^2+6x-15=(2x-5)(x^2+6)$.'
            answer: '(2*x - 5)*(x^2 + 3)'
            solution_sketch: 'The groups are $x^2(2x-5)$ and $3(2x-5)$. The second bracket must be $x^2+3$.'
        constraints: 'leading coefficient may exceed 1; both groups must leave the same binomial factor'
    diagnostic_exemplar:
      problem: 'Factor $2x^3 + 3x^2 - 10x - 15$.'
      answer: '(2x + 3)(x^2 - 5)'
      solution_sketch: '$x^2(2x + 3) - 5(2x + 3)$.'
    anki_seeds:
      - front: "To factor a four-term polynomial by grouping..."
        back: "factor a GCF from each pair of terms, then factor out the common binomial."
        type: basic
      - front: "Grouping has worked when..."
        back: "both groups leave the same binomial factor; if not, regroup or factor out a negative."
        type: basic

  - id: factoring-monic-trinomials
    name: Factoring Monic Trinomials
    core: true
    difficulty: 0.55
    drill: false               # L4 audit: multi-step factoring cannot fit the 6s drill countdown
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: multiplying-binomials
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: integer-multiplication-division
        weight: 0.5
        key: true
      - id: factoring-gcf
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Positive b and c
        key_prerequisites: [integer-multiplication-division, integer-addition-subtraction]
        constraints: "two integers that multiply to c and add to b; both positive"
        exemplars:
          - problem: 'Factor $x^2 + 7x + 12$.'
            answer: "(x + 3)(x + 4)"
            solution_sketch: '$3 \cdot 4 = 12$ and $3 + 4 = 7$.'
          - problem: 'A design model has area $x^2 + 9x + 20$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x + 4)(x + 5)"
            solution_sketch: '$4 \cdot 5 = 20$ and $4 + 5 = 9$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $1$; power $1$: coefficient $8$; power $0$: coefficient $12$. Reconstruct it and write its factored form over the integers.'
            answer: '(x + 2)*(x + 6)'
            solution_sketch: '$6 \cdot 2 = 12$ and $6 + 2 = 8$.'
          - problem: 'A learner proposes $(x+1)(x+21)$ for $x^2+10x+21$. Replace it with the correct factorization.'
            answer: '(x + 3)*(x + 7)'
            solution_sketch: 'The proposed constants multiply to $21$ but add to $22$. The pair $3,7$ has product $21$ and sum $10$.'
      - id: kp2
        name: Negative constant term
        key_prerequisites: [integer-multiplication-division, integer-addition-subtraction]
        constraints: "c < 0: the factor pair has opposite signs"
        exemplars:
          - problem: 'Factor $x^2 + 2x - 15$.'
            answer: "(x + 5)(x - 3)"
            solution_sketch: '$5 \cdot (-3) = -15$ and $5 - 3 = 2$.'
          - problem: 'A design model has area $x^2 - 3x - 10$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x - 5)(x + 2)"
            solution_sketch: '$-5 \cdot 2 = -10$ and $-5 + 2 = -3$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $1$; power $1$: coefficient $4$; power $0$: coefficient $-21$. Reconstruct it and write its factored form over the integers.'
            answer: '(x - 3)*(x + 7)'
            solution_sketch: '$7 \cdot (-3) = -21$ and $7 - 3 = 4$.'
          - problem: 'A learner proposes $(x-5)(x+8)$ for $x^2-3x-40$. Correct the signs in the factorization.'
            answer: '(x - 8)*(x + 5)'
            solution_sketch: 'The constants must multiply to $-40$ and add to $-3$: use $-8$ and $5$.'
      - id: kp3
        name: Negative middle term, positive constant
        key_prerequisites: [integer-multiplication-division, integer-addition-subtraction]
        constraints: "b < 0, c > 0: both factors negative"
        exemplars:
          - problem: 'Factor $x^2 - 5x + 6$.'
            answer: "(x - 2)(x - 3)"
            solution_sketch: '$(-2)(-3) = 6$ and $-2 - 3 = -5$.'
          - problem: 'A design model has area $x^2 - 9x + 14$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x - 2)(x - 7)"
            solution_sketch: '$(-2)(-7) = 14$ and $-2 - 7 = -9$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $1$; power $1$: coefficient $-7$; power $0$: coefficient $12$. Reconstruct it and write its factored form over the integers.'
            answer: '(x - 4)*(x - 3)'
            solution_sketch: '$(-3)(-4) = 12$ and $-3 - 4 = -7$.'
          - problem: 'Correct $(x+4)(x+5)$ as a factorization of $x^2-9x+20$.'
            answer: '(x - 5)*(x - 4)'
            solution_sketch: 'The positive product and negative sum require two negative constants: $-4-5=-9$ and $(-4)(-5)=20$.'
    diagnostic_exemplar:
      problem: 'Factor $x^2 - 2x - 24$.'
      answer: '(x - 6)(x + 4)'
      solution_sketch: '$-6 \times 4 = -24$ and $-6 + 4 = -2$.'
    anki_seeds:
      - front: "To factor x^2 + bx + c, find two numbers that..."
        back: "multiply to c and add to b."
        type: basic

  - id: factoring-trinomials
    name: Factoring Trinomials
    core: true
    difficulty: 0.65
    drill: false               # L4 audit: multi-step factoring cannot fit the 6s drill countdown
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: factoring-monic-trinomials
        weight: 0.8
        key: true
      - id: factoring-by-grouping
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.5
      - id: factoring-gcf
        weight: 0.5
      - id: integer-multiplication-division
        weight: 0.4
    encompassings_extra:
      # sibling factoring pattern: practising trinomials implicitly rehearses
      # recognising a difference of squares (not an ancestor of this topic).
      - id: difference-of-squares
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Leading coefficient not equal to 1 (ac-method)
        key_prerequisites: [factoring-monic-trinomials, factoring-by-grouping]
        constraints: "split bx using two integers that multiply to ac and add to b"
        exemplars:
          - problem: 'Factor $2x^2 + 7x + 3$.'
            answer: "(2x + 1)(x + 3)"
            solution_sketch: '$ac = 6$; split $7x$ as $6x + x$; group.'
          - problem: 'A design model has area $3x^2 - 10x + 8$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(3x - 4)(x - 2)"
            solution_sketch: '$ac = 24$; split $-10x$ as $-6x - 4x$; group.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $2$; power $1$: coefficient $5$; power $0$: coefficient $3$. Reconstruct it and write its factored form over the integers.'
            answer: '(x + 1)*(2*x + 3)'
            solution_sketch: '$ac = 6$; split $5x$ as $2x + 3x$; group.'
          - problem: 'The $ac$ method splits $3x^2+7x+2$ into $3x^2+6x+x+2$. Finish the factorization by grouping.'
            answer: '(x + 2)*(3*x + 1)'
            solution_sketch: 'Group as $3x(x+2)+1(x+2)$, then extract the shared $x+2$.'
      - id: kp2
        name: Non-monic trinomials with negative constants
        key_prerequisites: [factoring-monic-trinomials, factoring-by-grouping]
        exemplars:
          - problem: 'Factor $6x^2 + x - 2$.'
            answer: "(3x + 2)(2x - 1)"
            solution_sketch: '$ac = -12$; split $x$ as $4x - 3x$; group.'
          - problem: 'A design model has area $4x^2 - 4x - 3$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(2x - 3)(2x + 1)"
            solution_sketch: '$ac = -12$; split $-4x$ as $-6x + 2x$; group.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $5$; power $1$: coefficient $3$; power $0$: coefficient $-2$. Reconstruct it and write its factored form over the integers.'
            answer: '(x + 1)*(5*x - 2)'
            solution_sketch: '$ac = -10$; split $3x$ as $5x - 2x$; group.'
          - problem: 'The middle term of $6x^2+5x-4$ is split as $8x-3x$. Finish the $ac$-method factorization.'
            answer: '(2*x - 1)*(3*x + 4)'
            solution_sketch: 'Write $2x(3x+4)-1(3x+4)$ and extract $3x+4$.'
        constraints: 'leading coefficient > 1 and negative constant term; the split pair has opposite signs'
      - id: kp3
        name: Factor out a GCF first, then the trinomial
        key_prerequisites: [factoring-gcf, factoring-monic-trinomials]
        exemplars:
          - problem: 'Factor $2x^2 + 10x + 12$.'
            answer: "2(x + 2)(x + 3)"
            solution_sketch: '$2(x^2 + 5x + 6) = 2(x+2)(x+3)$.'
          - problem: 'A design model has area $6x^2 - 15x - 9$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "3(2x + 1)(x - 3)"
            solution_sketch: 'Extract $3$, leaving $2x^2-5x-3$. Split $-5x$ as $-6x+x$, group as $2x(x-3)+(x-3)$, and obtain $3(2x+1)(x-3)$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $2$; power $1$: coefficient $12$; power $0$: coefficient $10$. Reconstruct it and write its factored form over the integers.'
            answer: '2*(x + 1)*(x + 5)'
            solution_sketch: '$2(x^2 + 6x + 5) = 2(x+1)(x+5)$.'
          - problem: 'A learner stops at $2(2x^2+2x-12)$ while factoring $4x^2+4x-24$. Complete the factorization.'
            answer: '4*(x - 2)*(x + 3)'
            solution_sketch: 'Extract the remaining $2$ to get $4(x^2+x-6)$. The constants $3,-2$ multiply to $-6$ and add to $1$.'
        constraints: 'integer GCF 2-3 common to all three terms; factor it out before the ac-method'
    diagnostic_exemplar:
      problem: 'Factor $6x^2 + 9x - 6$.'
      answer: '3(2x - 1)(x + 2)'
      solution_sketch: 'GCF $3$ first: $3(2x^2 + 3x - 2)$; then $ac = -4$, so split $3x$ as $4x - x$.'
    anki_seeds:
      - front: "ac-method for ax^2 + bx + c: find two numbers that multiply to ___ and add to ___"
        back: "ac; b (then split the middle term and factor by grouping)"
        type: basic

  - id: difference-of-squares
    name: Factoring a Difference of Squares
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: polynomial-multiplication
        weight: 0.5
        key: true
      - id: square-roots
        weight: 0.5
        key: true
      - id: factoring-gcf
        weight: 0.4
      - id: simplifying-radicals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Recognize and factor a^2 - b^2
        key_prerequisites: [polynomial-multiplication, square-roots]
        exemplars:
          - problem: 'Factor $x^2 - 9$.'
            answer: "(x + 3)(x - 3)"
            solution_sketch: '$x^2 - 3^2 = (x + 3)(x - 3)$.'
          - problem: 'A design model has area $x^2 - 49$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x + 7)(x - 7)"
            solution_sketch: '$x^2 - 7^2 = (x + 7)(x - 7)$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $1$; power $0$: coefficient $-25$. Reconstruct it and write its factored form over the integers.'
            answer: '(x - 5)*(x + 5)'
            solution_sketch: '$x^2 - 5^2 = (x + 5)(x - 5)$.'
          - problem: 'A learner writes $x^2-100=(x-10)^2$. Correct the factorization.'
            answer: '(x-10)*(x+10)'
            solution_sketch: 'The squares are $x^2$ and $10^2$. Opposite signs cancel the cross terms: $(x-10)(x+10)=x^2-100$.'
        constraints: 'monic square minus a perfect-square constant up to 100; no GCF to remove'
      - id: kp2
        name: Coefficients and higher even powers
        key_prerequisites: [square-roots]
        exemplars:
          - problem: 'Factor $4x^2 - 25$.'
            answer: "(2x + 5)(2x - 5)"
            solution_sketch: '$(2x)^2 - 5^2$.'
          - problem: 'A design model has volume $9x^4 - 16$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(3x^2 + 4)(3x^2 - 4)"
            solution_sketch: '$(3x^2)^2 - 4^2$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $16$; power $0$: coefficient $-9$. Reconstruct it and write its factored form over the integers.'
            answer: '(4*x - 3)*(4*x + 3)'
            solution_sketch: '$(4x)^2 - 3^2$.'
          - problem: 'Correct $(5x-2)(5x+2)$ as a factorization of $25x^4-4$.'
            answer: '(5*x^2 - 2)*(5*x^2 + 2)'
            solution_sketch: 'The square root of $25x^4$ is $5x^2$. The conjugate factors are therefore $5x^2-2$ and $5x^2+2$.'
        constraints: 'perfect-square coefficients; even powers up to 4'
      - id: kp3
        name: Factor a GCF first, or factor repeatedly
        key_prerequisites: [factoring-gcf]
        exemplars:
          - problem: 'Factor $2x^2 - 18$.'
            answer: "2(x + 3)(x - 3)"
            solution_sketch: 'Extract the coefficient GCF $2$, leaving $x^2-9=x^2-3^2$. The conjugate factors are $x-3$ and $x+3$.'
          - problem: 'A design model has volume $x^4 - 16$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x^2 + 4)(x + 2)(x - 2)"
            solution_sketch: '$x^4 - 16 = (x^2 + 4)(x^2 - 4)$, and $x^2 - 4$ splits again.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $3$; power $0$: coefficient $-27$. Reconstruct it and write its factored form over the integers.'
            answer: '3*(x - 3)*(x + 3)'
            solution_sketch: 'The coefficients reconstruct $3x^2-27$. Extract $3$ to leave $x^2-9$; its square roots give factors $x-3$ and $x+3$.'
          - problem: 'A learner stops at $(x^2-9)(x^2+9)$ when factoring $x^4-81$. Complete the factorization over the integers.'
            answer: '(x - 3)*(x + 3)*(x^2 + 9)'
            solution_sketch: 'The factor $x^2-9$ is another difference of squares, $(x-3)(x+3)$; $x^2+9$ remains irreducible over the integers.'
        constraints: 'an integer GCF or a factor that is itself a difference of squares; factor completely'
    diagnostic_exemplar:
      problem: 'Factor completely: $x^4 - 1$.'
      answer: '(x^2 + 1)(x + 1)(x - 1)'
      solution_sketch: '$x^4 - 1 = (x^2 + 1)(x^2 - 1)$, and $x^2 - 1$ splits again.'
    anki_seeds:
      - front: "a^2 - b^2 factors as..."
        back: "(a + b)(a - b)"
        type: basic

  - id: perfect-square-trinomials
    name: Factoring Perfect Square Trinomials
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: special-products
        weight: 0.7
        key: true
      - id: factoring-monic-trinomials
        weight: 0.5
        key: true
      - id: square-roots
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Recognize the pattern a^2 ± 2ab + b^2
        key_prerequisites: [special-products, square-roots]
        exemplars:
          - problem: 'The trinomial $x^2 + 6x + 9$ is a perfect square. Factor it.'
            answer: "(x + 3)^2"
            solution_sketch: '$9 = 3^2$ and $6x = 2 \cdot 3 \cdot x$, so it is $(x + 3)^2$.'
          - problem: 'Is $x^2 + 5x + 25$ a perfect square trinomial?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The middle term would need to be $2 \cdot 5x = 10x$.'
          - problem: 'An area model has one $x^2$ square, two strips of area $4x$, and a corner of area $16$. Write the total area as a squared binomial.'
            answer: '(x + 4)^2'
            solution_sketch: 'The strips total $8x=2(x)(4)$ and the corner is $4^2$, so the assembled square has side $x+4$.'
          - problem: 'A student calls $x^2+4x+16$ a perfect-square trinomial because its end terms are squares. Is the claim valid? Answer yes or no.'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The end terms would require $a=x$ and $b=4$, so the middle term must be $2ab=8x$. The actual $4x$ fails that test.'
        constraints: "check the middle term against 2ab"
      - id: kp2
        name: Factor monic perfect squares
        key_prerequisites: [factoring-monic-trinomials, special-products]
        exemplars:
          - problem: 'Factor $x^2 + 10x + 25$.'
            answer: "(x + 5)^2"
            solution_sketch: '$25 = 5^2$ and $10x = 2 \cdot 5 \cdot x$.'
          - problem: 'A design model has area $x^2 - 12x + 36$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x - 6)^2"
            solution_sketch: 'The constant is $36=6^2$ and the middle term is $-12x=-2(x)(6)$. These match the square $(x-6)^2$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $1$; power $1$: coefficient $14$; power $0$: coefficient $49$. Reconstruct it and write its factored form over the integers.'
            answer: '(x + 7)^2'
            solution_sketch: '$49 = 7^2$ and $14x = 2 \cdot 7 \cdot x$.'
          - problem: 'Correct $(x+8)^2$ as a factorization of $x^2-16x+64$.'
            answer: '(x - 8)^2'
            solution_sketch: 'Since $64=8^2$ and the middle term is $-2(x)(8)$, the binomial is $x-8$.'
        constraints: "constant is a perfect square; sign follows the middle term"
      - id: kp3
        name: Perfect squares with leading coefficients
        key_prerequisites: [special-products, square-roots]
        exemplars:
          - problem: 'Factor $4x^2 - 12x + 9$.'
            answer: "(2x - 3)^2"
            solution_sketch: '$(2x)^2$, $3^2$, and $12x = 2 \cdot 2x \cdot 3$.'
          - problem: 'A design model has area $9x^2 + 30x + 25$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(3x + 5)^2"
            solution_sketch: '$(3x)^2$, $5^2$, and $30x = 2 \cdot 3x \cdot 5$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $2$: coefficient $16$; power $1$: coefficient $-24$; power $0$: coefficient $9$. Reconstruct it and write its factored form over the integers.'
            answer: '(4*x - 3)^2'
            solution_sketch: '$(4x)^2$, $3^2$, and $24x = 2 \cdot 4x \cdot 3$.'
          - problem: 'Correct $(5x+4)^2$ as a factorization of $25x^2+20x+4$.'
            answer: '(5*x + 2)^2'
            solution_sketch: 'The end terms are $(5x)^2$ and $2^2$. The middle term $2(5x)(2)=20x$ confirms $(5x+2)^2$.'
        constraints: "both end terms perfect squares; verify 2ab"
    diagnostic_exemplar:
      problem: 'Factor $9x^2 - 24x + 16$.'
      answer: '(3x - 4)^2'
      solution_sketch: '$9x^2 = (3x)^2$, $16 = 4^2$, and $2(3x)(4) = 24x$.'
    anki_seeds:
      - front: "a^2 + 2ab + b^2 factors as..."
        back: "(a + b)^2"
        type: basic

  - id: sum-difference-of-cubes
    name: Factoring Sums and Differences of Cubes
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: difference-of-squares
        weight: 0.5
        key: true
      - id: polynomial-multiplication
        weight: 0.6
        key: true
      - id: cube-roots
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Difference of cubes a^3 - b^3
        key_prerequisites: [cube-roots, polynomial-multiplication]
        exemplars:
          - problem: 'Factor $x^3 - 8$.'
            answer: "(x - 2)(x^2 + 2x + 4)"
            solution_sketch: '$a = x$, $b = 2$: $(a - b)(a^2 + ab + b^2)$.'
          - problem: 'A design model has volume $x^3 - 27$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x - 3)(x^2 + 3x + 9)"
            solution_sketch: '$a = x$, $b = 3$: $(a - b)(a^2 + ab + b^2)$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $3$: coefficient $1$; power $0$: coefficient $-64$. Reconstruct it and write its factored form over the integers.'
            answer: '(x - 4)*(x^2 + 4*x + 16)'
            solution_sketch: '$a = x$, $b = 4$: $(a - b)(a^2 + ab + b^2)$.'
          - problem: 'Correct $(x-5)(x^2-5x+25)$ as a factorization of $x^3-125$.'
            answer: '(x - 5)*(x^2 + 5*x + 25)'
            solution_sketch: 'For a cube difference the quadratic cross term is positive: $x^2+5x+25$. Multiplication cancels the two middle powers.'
        constraints: "b is a small perfect cube root"
      - id: kp2
        name: Sum of cubes a^3 + b^3
        key_prerequisites: [cube-roots, polynomial-multiplication]
        exemplars:
          - problem: 'Factor $x^3 + 1$.'
            answer: "(x + 1)(x^2 - x + 1)"
            solution_sketch: '$(a + b)(a^2 - ab + b^2)$ with $b = 1$.'
          - problem: 'A design model has volume $x^3 + 64$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x + 4)(x^2 - 4x + 16)"
            solution_sketch: '$(a + b)(a^2 - ab + b^2)$ with $b = 4$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $3$: coefficient $1$; power $0$: coefficient $8$. Reconstruct it and write its factored form over the integers.'
            answer: '(x + 2)*(x^2 - 2*x + 4)'
            solution_sketch: '$(a + b)(a^2 - ab + b^2)$ with $b = 2$.'
          - problem: 'Correct $(x+5)(x^2+5x+25)$ as a factorization of $x^3+125$.'
            answer: '(x + 5)*(x^2 - 5*x + 25)'
            solution_sketch: 'For a cube sum the quadratic middle term has the opposite sign: $x^2-5x+25$.'
        constraints: "middle sign of the trinomial is opposite the binomial sign"
      - id: kp3
        name: Cubes with coefficients
        key_prerequisites: [cube-roots, polynomial-multiplication]
        exemplars:
          - problem: 'Factor $8x^3 - 27$.'
            answer: "(2x - 3)(4x^2 + 6x + 9)"
            solution_sketch: 'The cube roots are $2x$ and $3$. Use $a-b$ and $a^2+ab+b^2$ to obtain $(2x-3)(4x^2+6x+9)$.'
          - problem: 'A design model has volume $27x^3 + 1$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(3x + 1)(9x^2 - 3x + 1)"
            solution_sketch: 'The cube roots are $3x$ and $1$. A cube sum factors into $a+b$ and $a^2-ab+b^2$, giving $(3x+1)(9x^2-3x+1)$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $3$: coefficient $8$; power $0$: coefficient $-1$. Reconstruct it and write its factored form over the integers.'
            answer: '(2*x - 1)*(4*x^2 + 2*x + 1)'
            solution_sketch: 'Reconstruct $8x^3-1=(2x)^3-1^3$. A cube difference gives $(2x-1)((2x)^2+2x+1)$.'
          - problem: 'The cube roots of $64x^3$ and $27$ are $4x$ and $3$. A learner uses $(4x+3)(16x^2+12x+9)$. Correct the sum-of-cubes factorization.'
            answer: '(4*x + 3)*(16*x^2 - 12*x + 9)'
            solution_sketch: 'The linear factor is $4x+3$; the quadratic is $(4x)^2-(4x)(3)+3^2=16x^2-12x+9$.'
        constraints: "a = (coefficient root) x; trinomial never factors further over the integers"
    diagnostic_exemplar:
      problem: 'Factor $27x^3 - 8$.'
      answer: '(3x - 2)(9x^2 + 6x + 4)'
      solution_sketch: '$(a - b)(a^2 + ab + b^2)$ with $a = 3x$ and $b = 2$.'
    anki_seeds:
      - front: "a^3 - b^3 factors as..."
        back: "(a - b)(a^2 + ab + b^2)"
        type: basic
      - front: "a^3 + b^3 factors as..."
        back: "(a + b)(a^2 - ab + b^2)"
        type: basic

  - id: quadratics-in-form
    name: Factoring Expressions in Quadratic Form
    core: false                # special-case factoring technique, terminal
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: factoring-trinomials
        weight: 0.7
        key: true
      - id: difference-of-squares
        weight: 0.5
        key: true
      - id: power-rule-exponents
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Substitute u for the middle power
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: 'Factor $x^4 + 5x^2 + 6$.'
            answer: "(x^2 + 2)(x^2 + 3)"
            solution_sketch: 'Let $u = x^2$: $u^2 + 5u + 6 = (u+2)(u+3)$.'
          - problem: 'A design model has volume $x^4 - 7x^2 + 10$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x^2 - 2)(x^2 - 5)"
            solution_sketch: 'Let $u = x^2$: $u^2 - 7u + 10 = (u - 2)(u - 5)$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $4$: coefficient $1$; power $2$: coefficient $6$; power $0$: coefficient $8$. Reconstruct it and write its factored form over the integers.'
            answer: '(x^2 + 2)*(x^2 + 4)'
            solution_sketch: 'Let $u = x^2$: $u^2 + 6u + 8 = (u+2)(u+4)$.'
          - problem: 'The substitution $u=x^2$ changes $x^4-8x^2+15$ into $(u-3)(u-5)$. Return to $x$ and give the integer factorization.'
            answer: '(x^2 - 5)*(x^2 - 3)'
            solution_sketch: 'Replace each $u$ by $x^2$, obtaining $(x^2-3)(x^2-5)$. Neither constant is a perfect square, so neither factor splits over the integers.'
        constraints: "trinomials in x^2; factors do not split further over the integers"
      - id: kp2
        name: Factor completely when the pieces split further
        key_prerequisites: [factoring-trinomials, difference-of-squares]
        exemplars:
          - problem: 'Factor $x^4 - 5x^2 + 4$ completely.'
            answer: "(x - 1)(x + 1)(x - 2)(x + 2)"
            solution_sketch: '$(x^2 - 1)(x^2 - 4)$; each is a difference of squares.'
          - problem: 'An area model has polynomial $x^4-13x^2+36$, with $x>3$. Use $u=x^2$, then differences of squares, to write the area as a product of integer linear factors.'
            answer: "(x - 2)(x + 2)(x - 3)(x + 3)"
            solution_sketch: '$(x^2 - 4)(x^2 - 9)$; each is a difference of squares.'
          - problem: 'A polynomial has the following nonzero coefficients: power $4$: coefficient $1$; power $2$: coefficient $-17$; power $0$: coefficient $16$. Reconstruct it and write its factored form over the integers.'
            answer: '(x - 4)*(x - 1)*(x + 1)*(x + 4)'
            solution_sketch: '$(x^2 - 1)(x^2 - 16)$; each is a difference of squares.'
          - problem: 'A learner stops at $(x^2-9)(x^2-16)$ for $x^4-25x^2+144$. Finish factoring every factor over the integers.'
            answer: '(x - 4)*(x - 3)*(x + 3)*(x + 4)'
            solution_sketch: 'Each factor is a difference of squares: $x^2-9=(x-3)(x+3)$ and $x^2-16=(x-4)(x+4)$.'
        constraints: "check every factor for a further difference of squares"
      - id: kp3
        name: Sixth powers and non-monic quadratic form
        key_prerequisites: [factoring-trinomials]
        exemplars:
          - problem: 'Factor $x^6 + 5x^3 + 6$.'
            answer: "(x^3 + 2)(x^3 + 3)"
            solution_sketch: 'Let $u = x^3$: $u^2 + 5u + 6 = (u+2)(u+3)$; both cubic factors are irreducible over the integers.'
          - problem: 'A design model has volume $2x^4 + 5x^2 + 2$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(2x^2 + 1)(x^2 + 2)"
            solution_sketch: 'Let $u = x^2$: $ac = 4$; split $5u$ as $4u + u$.'
          - problem: 'A polynomial has the following nonzero coefficients: power $6$: coefficient $1$; power $3$: coefficient $7$; power $0$: coefficient $12$. Reconstruct it and write its factored form over the integers.'
            answer: '(x^3 + 3)*(x^3 + 4)'
            solution_sketch: 'Let $u = x^3$: $u^2 + 7u + 12 = (u+3)(u+4)$; both cubic factors are irreducible over the integers.'
          - problem: 'The substitution $u=x^2$ gives $3u^2+7u+2=(3u+1)(u+2)$. Write the factorization of $3x^4+7x^2+2$ in $x$.'
            answer: '(x^2 + 2)*(3*x^2 + 1)'
            solution_sketch: 'Replace $u$ with $x^2$ in both brackets: $(3x^2+1)(x^2+2)$; each quadratic remains irreducible over the integers.'
        constraints: "u-substitution with u = x^3 or non-monic in u"
    diagnostic_exemplar:
      problem: 'Factor $x^4 - 10x^2 + 9$ completely.'
      answer: '(x - 1)(x + 1)(x - 3)(x + 3)'
      solution_sketch: 'With $u = x^2$: $u^2 - 10u + 9 = (u - 1)(u - 9)$; both factors split again.'
    anki_seeds:
      - front: "An expression like x^4 + bx^2 + c is 'in quadratic form' because ..."
        back: "substituting u = x^2 turns it into the quadratic u^2 + bu + c"
        type: basic

  - id: choosing-factoring-strategy
    name: Choosing a Factoring Strategy
    core: false                # mixed-practice capstone; the techniques it selects among
                               # stay core. Matches its four siblings tree-wide
                               # (choosing-integration-technique, strategy-for-testing-series,
                               # choosing-summary-statistics, combinations-vs-permutations).
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: factoring-trinomials
        weight: 0.7
        key: true
      - id: difference-of-squares
        weight: 0.6
        key: true
      - id: factoring-gcf
        weight: 0.6
        key: true
      - id: factoring-by-grouping
        weight: 0.5
      - id: perfect-square-trinomials
        weight: 0.4
      - id: sum-difference-of-cubes
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Identify the right first move
        key_prerequisites: [factoring-gcf, difference-of-squares, factoring-trinomials]
        exemplars:
          - problem: 'Which strategy applies first to $5x^2 - 45$: GCF, difference of squares, or trinomial factoring?'
            answer: "GCF"
            answer_contract: {kind: label, options: [["GCF"], ["difference of squares"], ["trinomial factoring"]]}
            solution_sketch: 'Always check for a GCF before pattern-matching: $5x^2 - 45 = 5(x^2 - 9)$.'
          - problem: 'Identify the pattern in $x^2 - 16x + 64$ and factor it.'
            answer: "(x - 8)^2"
            solution_sketch: 'Perfect square trinomial: $64 = 8^2$ and $16x = 2 \cdot 8 \cdot x$.'
          - problem: 'For $3x^2-27$, first check a common coefficient, then the remaining two-term pattern. Write the complete factorization.'
            answer: '3*(x - 3)*(x + 3)'
            solution_sketch: 'All coefficients share $3$, leaving $x^2-9$. Factor the difference of squares as $(x-3)(x+3)$.'
          - problem: 'A learner selects difference of squares for $x^2+20x+100$. Correct the choice by writing the polynomial in its matching factored pattern.'
            answer: '(x + 10)^2'
            solution_sketch: 'There are three terms and the middle one is $2(x)(10)$, so the perfect-square pattern gives $(x+10)^2$.'
        constraints: "GCF first, then count terms, then match a pattern"
      - id: kp2
        name: Factor completely in two steps
        key_prerequisites: [factoring-gcf, difference-of-squares, factoring-trinomials]
        exemplars:
          - problem: 'Factor $2x^3 - 8x$ completely.'
            answer: "2x(x + 2)(x - 2)"
            solution_sketch: '$2x(x^2 - 4)$; then difference of squares.'
          - problem: 'A design model has area $3x^2 + 12x + 12$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "3(x + 2)^2"
            solution_sketch: '$3(x^2 + 4x + 4)$; perfect square inside.'
          - problem: 'A polynomial has the following nonzero coefficients: power $3$: coefficient $3$; power $1$: coefficient $-12$. Reconstruct it and write its factored form over the integers.'
            answer: '3*x*(x - 2)*(x + 2)'
            solution_sketch: '$3x(x^2 - 4)$; then difference of squares.'
          - problem: 'A learner extracts $2$ from $2x^2+20x+50$ and stops at $2(x^2+10x+25)$. Complete the factorization.'
            answer: '2*(x + 5)^2'
            solution_sketch: 'The inner trinomial has end terms $x^2$ and $5^2$ and middle term $2(x)(5)$, so it is $(x+5)^2$.'
        constraints: "GCF plus one pattern"
      - id: kp3
        name: Mixed multi-step factoring
        key_prerequisites: [difference-of-squares, factoring-trinomials, factoring-by-grouping]
        exemplars:
          - problem: 'Factor $x^4 - 81$ completely.'
            answer: "(x^2 + 9)(x + 3)(x - 3)"
            solution_sketch: 'Difference of squares twice; $x^2 + 9$ stays prime.'
          - problem: 'A design model has volume $x^3 + 3x^2 - 4x - 12$ for $x>20$. Write this model as a product of integer-coefficient polynomial factors, factoring completely over the integers.'
            answer: "(x + 3)(x + 2)(x - 2)"
            solution_sketch: 'Group: $x^2(x+3) - 4(x+3)$; then difference of squares.'
          - problem: 'A polynomial has the following nonzero coefficients: power $4$: coefficient $1$; power $0$: coefficient $-16$. Reconstruct it and write its factored form over the integers.'
            answer: '(x - 2)*(x + 2)*(x^2 + 4)'
            solution_sketch: 'Difference of squares twice; $x^2 + 4$ stays prime.'
          - problem: 'A learner groups $x^3+2x^2-9x-18$ into $(x+2)(x^2-9)$. Complete the integer factorization.'
            answer: '(x - 3)*(x + 2)*(x + 3)'
            solution_sketch: 'The second factor is $(x-3)(x+3)$. The complete product is $(x+2)(x-3)(x+3)$.'
        constraints: "up to three steps; state prime factors as-is"
    diagnostic_exemplar:
      problem: 'Factor $2x^4 - 32$ completely.'
      answer: '2(x^2 + 4)(x + 2)(x - 2)'
      solution_sketch: 'GCF $2$ first: $2(x^4 - 16)$; then two rounds of difference of squares.'
    anki_seeds:
      - front: "The first step in ANY factoring problem is ..."
        back: "factor out the GCF"
        type: basic
      - front: "After factoring, how do you check the result?"
        back: "multiply the factors back out"
        type: basic

  - id: zero-product-property
    name: The Zero Product Property
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: multi-step
    expected_time_secs: 60
    prerequisites:
      - id: one-step-equations
        weight: 0.6
        key: true
      - id: two-step-equations
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Solve pre-factored monic equations
        key_prerequisites: [one-step-equations]
        exemplars:
          - problem: 'Solve $(x - 3)(x + 5) = 0$.'
            answer: "x = 3 or x = -5"
            answer_contract: {kind: exact}
            solution_sketch: 'The factors give $x-3=0$ or $x+5=0$. Solving the linear equations gives $x=3$ or $x=-5$.'
          - problem: 'The graph $y=x(x-4)$ meets the horizontal axis where a factor vanishes. Find all corresponding $x$ values.'
            answer: "x = 0 or x = 4"
            answer_contract: {kind: exact}
            solution_sketch: 'At an axis intersection the product is zero. The factors $x$ and $x-4$ give $x=0$ and $x=4$.'
          - problem: 'A student keeps only $x=6$ from $(x-6)(x+2)=0$. Give the complete solution set.'
            answer: "x = 6 or x = -2"
            answer_contract: {kind: exact}
            solution_sketch: 'The second factor also can vanish: $x+2=0$ gives $-2$. Together with $x-6=0$, the full root set is $6,-2$.'
          - problem: 'A rectangular model has signed area $A=x(x+9)$. Find every real parameter $x$ for which this algebraic area is zero.'
            answer: "x = 0 or x = -9"
            answer_contract: {kind: exact}
            solution_sketch: 'The area product vanishes at $x=0$ or $x+9=0$. Both are allowed real parameters, giving $0,-9$.'
        constraints: "already factored; integer roots"
      - id: kp2
        name: Factors with coefficients
        key_prerequisites: [two-step-equations]
        exemplars:
          - problem: 'Solve $(2x - 1)(3x + 4) = 0$.'
            answer: "x = 1/2 or x = -4/3"
            answer_contract: {kind: exact}
            solution_sketch: '$2x = 1$ or $3x = -4$.'
          - problem: 'The graph $y=(5x+2)(x-6)$ meets the horizontal axis. Find both $x$ coordinates from the factors.'
            answer: "x = -2/5 or x = 6"
            answer_contract: {kind: exact}
            solution_sketch: '$5x = -2$ or $x = 6$.'
          - problem: 'A learner obtains $x=2$ or $x=-5$ from $(3x-2)(2x+5)=0$. Correct the solutions.'
            answer: "x = 2/3 or x = -5/2"
            answer_contract: {kind: exact}
            solution_sketch: '$3x = 2$ or $2x = -5$.'
          - problem: 'A signed product model is $P=(4x+1)(x-3)$. Find all real parameters giving $P=0$.'
            answer: "x = -1/4 or x = 3"
            answer_contract: {kind: exact}
            solution_sketch: '$4x = -1$ or $x = 3$.'
        constraints: "linear factors with small coefficients; fractional roots allowed"
      - id: kp3
        name: Three factors
        key_prerequisites: [one-step-equations, two-step-equations]
        exemplars:
          - problem: 'Solve $x(x - 2)(x + 7) = 0$.'
            answer: "x = 0 or x = 2 or x = -7"
            answer_contract: {kind: exact}
            solution_sketch: 'Set each variable factor to zero: $x=0$, $x-2=0$, or $x+7=0$. The roots are $0,2,-7$.'
          - problem: 'Find all horizontal-axis crossing values of $y=2x(x+1)(x-5)$ using the zero-product property.'
            answer: "x = 0 or x = -1 or x = 5"
            answer_contract: {kind: exact}
            solution_sketch: 'The constant 2 is never zero; three variable factors.'
          - problem: 'A student cancels $x$ in $x(x-3)(x+4)=0$ and loses a root. Give the complete solution set.'
            answer: "x = 0 or x = 3 or x = -4"
            answer_contract: {kind: exact}
            solution_sketch: 'The factor $x$ contributes zero; cancelling it would lose that root. The other equations $x-3=0$ and $x+4=0$ give $3$ and $-4$.'
          - problem: 'The signed volume model $V=3x(x+1)(x-6)$ vanishes. Find every real parameter value that makes any variable factor zero.'
            answer: "x = 0 or x = -1 or x = 6"
            answer_contract: {kind: exact}
            solution_sketch: 'The constant 3 is never zero; three variable factors.'
        constraints: "one root per variable factor"
    diagnostic_exemplar:
      problem: 'Solve $x(2x - 5)(x + 3) = 0$.'
      answer_contract: {kind: exact}
      answer: 'x = 0 or x = 5/2 or x = -3'
      solution_sketch: 'Set each of the three factors equal to zero.'
    anki_seeds:
      - front: "Zero Product Property: if a*b = 0 then..."
        back: "a = 0 or b = 0"
        type: basic

  - id: quadratic-equations-factoring
    name: Solving Quadratic Equations by Factoring
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: zero-product-property
        weight: 0.8
        key: true
      - id: factoring-trinomials
        weight: 0.8
        key: true
      - id: factoring-gcf
        weight: 0.5
      - id: difference-of-squares
        weight: 0.5
      - id: two-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Factor a monic quadratic, then solve
        key_prerequisites: [factoring-trinomials, zero-product-property]
        exemplars:
          - problem: 'Solve $x^2 + 7x + 12 = 0$.'
            answer: "x = -3 or x = -4"
            answer_contract: {kind: exact}
            solution_sketch: '$(x+3)(x+4) = 0$.'
          - problem: 'Find all horizontal-axis crossing values of $y=x^2-5x-14$ by factoring its quadratic.'
            answer: "x = 7 or x = -2"
            answer_contract: {kind: exact}
            solution_sketch: '$(x-7)(x+2) = 0$.'
          - problem: 'A learner proposes roots $-4$ and $9$ for $x^2+5x-36=0$. Correct both roots by factoring.'
            answer: "x = 4 or x = -9"
            answer_contract: {kind: exact}
            solution_sketch: '$(x-4)(x+9) = 0$.'
          - problem: 'A quadratic''s coefficient row is $(1,9,18)$ in descending order. Set the polynomial equal to zero and solve by factoring.'
            answer: "x = -3 or x = -6"
            answer_contract: {kind: exact}
            solution_sketch: '$(x+3)(x+6) = 0$.'
        constraints: 'monic trinomial already equal to 0; integer roots'
      - id: kp2
        name: Rearrange to standard form first
        key_prerequisites: [factoring-trinomials, two-step-equations]
        exemplars:
          - problem: 'Solve $x^2 + 6x = -8$.'
            answer: "x = -2 or x = -4"
            answer_contract: {kind: exact}
            solution_sketch: '$x^2 + 6x + 8 = 0$; $(x+2)(x+4) = 0$.'
          - problem: 'Find the $x$ coordinates where the curves $y=3x^2$ and $y=12x$ intersect. Rearrange and solve by factoring.'
            answer: "x = 0 or x = 4"
            answer_contract: {kind: exact}
            solution_sketch: '$3x^2 - 12x = 0$; $3x(x - 4) = 0$. Never divide by $x$.'
          - problem: 'A learner rearranges $x^2+4x=21$ as $x^2+4x+21=0$. Correct the rearrangement and give all roots by factoring.'
            answer: "x = 3 or x = -7"
            answer_contract: {kind: exact}
            solution_sketch: '$x^2 + 4x - 21 = 0$; $(x+7)(x-3) = 0$.'
          - problem: 'A signed-area model equates $5x^2$ and $20x$. Move the terms to one side and find every real solution, including zero.'
            answer: "x = 4 or x = 0"
            answer_contract: {kind: exact}
            solution_sketch: '$5x^2 - 20x = 0$; $5x(x - 4) = 0$. Never divide by $x$.'
        constraints: 'terms on both sides; collect into standard form before factoring; integer roots'
      - id: kp3
        name: Non-monic quadratics and special patterns
        key_prerequisites: [factoring-trinomials, zero-product-property]
        exemplars:
          - problem: 'Solve $2x^2 - 5x - 3 = 0$.'
            answer: "x = 3 or x = -1/2"
            answer_contract: {kind: exact}
            solution_sketch: '$(2x + 1)(x - 3) = 0$.'
          - problem: 'Find the horizontal-axis crossing values of $y=x^2-25$ by factoring a difference of squares.'
            answer: "x = 5 or x = -5"
            answer_contract: {kind: exact}
            solution_sketch: 'Difference of squares: $(x+5)(x-5) = 0$.'
          - problem: 'A learner factors $3x^2+5x-2$ as $(3x-1)(x+2)$ but reports $x=1,-2$. Correct the solution set.'
            answer: "x = 1/3 or x = -2"
            answer_contract: {kind: exact}
            solution_sketch: '$(3x - 1)(x + 2) = 0$.'
          - problem: 'A quadratic''s coefficient row is $(1,0,-64)$. Set it equal to zero and solve by factoring the special pattern.'
            answer: "x = 8 or x = -8"
            answer_contract: {kind: exact}
            solution_sketch: 'Difference of squares: $(x+8)(x-8) = 0$.'
        constraints: 'leading coefficient > 1 or a difference-of-squares pattern; roots may be fractions'
    diagnostic_exemplar:
      problem: 'Solve $2x^2 + 7x = -3$.'
      answer: "x = -1/2 or x = -3"
      solution_sketch: 'Standard form $2x^2 + 7x + 3 = 0$ factors as $(2x + 1)(x + 3)$.'
    anki_seeds:
      - front: "Why is dividing both sides of 3x^2 = 12x by x a mistake?"
        back: "It silently discards the root x = 0; move everything to one side and factor instead."
        type: basic

  - id: square-root-property
    name: Solving Quadratics with the Square Root Property
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 90
    prerequisites:
      - id: square-roots
        weight: 0.6
        key: true
      - id: simplifying-radicals
        weight: 0.5
        key: true
      - id: two-step-equations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Solve x^2 = k
        key_prerequisites: [square-roots]
        exemplars:
          - problem: 'Solve $x^2 = 49$.'
            answer: "x = 7 or x = -7"
            answer_contract: {kind: exact}
            solution_sketch: 'Both square roots: $x = \pm 7$.'
          - problem: 'The graph $y=x^2$ intersects the horizontal line $y=100$. Find both $x$ coordinates using square roots.'
            answer: "x = 10 or x = -10"
            answer_contract: {kind: exact}
            solution_sketch: 'Both square roots: $x = \pm 10$.'
          - problem: 'A student concludes $x=9$ from $x^2=81$. Give the complete real solution set.'
            answer: "x = 9 or x = -9"
            answer_contract: {kind: exact}
            solution_sketch: 'Both square roots: $x = \pm 9$.'
          - problem: 'On a number line, the squared distance of $x$ from zero is $144$. Find all signed coordinates $x$.'
            answer: "x = 12 or x = -12"
            answer_contract: {kind: exact}
            solution_sketch: 'Distance is $\sqrt{144}=12$, so the two coordinates are $12$ and $-12$.'
        constraints: "perfect-square k; always two roots"
      - id: kp2
        name: Isolate the square first
        key_prerequisites: [two-step-equations, square-roots]
        exemplars:
          - problem: 'Solve $3(x-1)^2-27=0$ by first isolating the square.'
            answer: 'x = 4 or x = -2'
            answer_contract: {kind: exact}
            solution_sketch: 'Divide by $3$ after adding $27$: $(x-1)^2=9$. Thus $x-1=3$ or $x-1=-3$, giving $4$ and $-2$.'
          - problem: 'The parabola $y=(x-3)^2$ meets the line $y=16$. Find both $x$ coordinates using the square-root property.'
            answer: "x = 7 or x = -1"
            answer_contract: {kind: exact}
            solution_sketch: '$x - 3 = \pm 4$.'
          - problem: 'Correct a learner''s single solution $x=6$ for $2(x-2)^2-32=0$. Give all real solutions.'
            answer: 'x = 6 or x = -2'
            answer_contract: {kind: exact}
            solution_sketch: 'Isolate $(x-2)^2=16$, then use both signs: $x-2=\pm4$. The roots are $6$ and $-2$.'
          - problem: 'A number-line coordinate has squared distance $25$ from $-2$. Find all coordinates using $(x+2)^2=25$.'
            answer: "x = 3 or x = -7"
            answer_contract: {kind: exact}
            solution_sketch: '$x + 2 = \pm 5$.'
        constraints: "shifted squares (x - h)^2 = k with perfect-square k"
      - id: kp3
        name: Irrational solutions
        key_prerequisites: [simplifying-radicals]
        exemplars:
          - problem: 'Solve $x^2 = 12$. Give exact answers.'
            answer: "x = 2*sqrt(3) or x = -2*sqrt(3)"
            answer_contract: {kind: exact}
            solution_sketch: '$\pm\sqrt{12} = \pm 2\sqrt{3}$.'
          - problem: 'Find the $x$ coordinates where $y=(x+1)^2$ meets $y=5$. Keep both answers exact.'
            answer: "x = -1 + sqrt(5) or x = -1 - sqrt(5)"
            answer_contract: {kind: exact}
            solution_sketch: '$x + 1 = \pm\sqrt{5}$.'
          - problem: 'A student writes $x=\pm10$ for $x^2=20$. Give the corrected real solutions with simplified radicals.'
            answer: "x = 2*sqrt(5) or x = -2*sqrt(5)"
            answer_contract: {kind: exact}
            solution_sketch: '$\pm\sqrt{20} = \pm 2\sqrt{5}$.'
          - problem: 'A coordinate has squared distance $8$ from $2$ on a number line. Find all such coordinates in exact radical form.'
            answer: "x = 2 + 2*sqrt(2) or x = 2 - 2*sqrt(2)"
            answer_contract: {kind: exact}
            solution_sketch: '$x - 2 = \pm\sqrt{8} = \pm 2\sqrt{2}$.'
        constraints: "simplify the radical; exact form, no decimals"
    diagnostic_exemplar:
      problem: 'Solve $(x + 3)^2 = 7$. Give exact answers.'
      answer: 'x = -3 + sqrt(7) or x = -3 - sqrt(7)'
      solution_sketch: 'Take roots: $x + 3 = \pm\sqrt{7}$.'
    anki_seeds:
      - front: "Square root property: if x^2 = k (k > 0) then x = ?"
        back: "x = +sqrt(k) or x = -sqrt(k) — always both signs"
        type: basic

