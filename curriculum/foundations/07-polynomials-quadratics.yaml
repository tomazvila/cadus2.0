            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The cost is lowest at the vertex, where $x = 40/2 = 20$. Then $C = 400 - 800 + 500 = 100$, so the lowest cost is $100$ dollars per hour.'
          - problem: 'What is the vertex of $y = x^2 + 4x + 1$?'
            answer: '(-2, -3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $x = -4/2 = -2$. Then $y = 4 - 8 + 1 = -3$, so the vertex is $(-2, -3)$.'
          - problem: 'A cable hangs in the shape $y = x^2 - 12x + 40$, where $x$ is the distance along the road in metres and $y$ is the height above the road in metres. How far above the road is the lowest point of the cable?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The lowest point is the vertex, at $x = 12/2 = 6$. Then $y = 36 - 72 + 40 = 4$, so the cable is $4$ m above the road.'
          - problem: 'Find the vertex of $y = x^2 - 10x + 30$.'
            answer: '(5, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The vertex has $x = 10/2 = 5$. Then $y = 25 - 50 + 30 = 5$, so the vertex is $(5, 5)$.'
          - problem: 'What is the vertex of $y = x^2 - 4$?'
            answer: '(0, -4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The linear coefficient is $b = 0$, so $x = 0$. Then $y = 0 - 4 = -4$, and the vertex is $(0, -4)$.'
        constraints: 'monic standard form with even b; vertex has integer coordinates'
      - id: kp2
        name: Intercepts together with the vertex
        key_prerequisites: [quadratic-equations-factoring]
        exemplars:
          - problem: 'At which values of $x$ does the graph of $y = x^2 - 4x + 3$ cross the $x$-axis?'
            answer: '1, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The graph crosses the $x$-axis where $y = 0$. Factoring $x^2 - 4x + 3 = (x - 1)(x - 3) = 0$ gives $x = 1$ and $x = 3$.'
          - problem: 'Find the vertex and the $y$-intercept of $y = x^2 + 2x - 8$.'
            answer: 'vertex = (-1, -9); y_intercept = (0, -8)'
            answer_contract: {"kind": "multipart", "parts": [{"name": "vertex", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "y_intercept", "contract": {"kind": "coordinates", "arity": 2}}]}
            solution_sketch: 'The vertex has $x = -2/2 = -1$ and $y = 1 - 2 - 8 = -9$, so it is $(-1, -9)$. At $x = 0$ the output is $-8$, so the $y$-intercept is $(0, -8)$.'
          - problem: 'The graph of $y = x^2 - 2x - 15$ crosses the $x$-axis at two points. How far apart are they?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factoring $x^2 - 2x - 15 = (x - 5)(x + 3) = 0$ gives crossings at $x = 5$ and $x = -3$. They are $5 - (-3) = 8$ units apart.'
          - problem: 'Sam says the $y$-intercept of $y = x^2 - 2x - 3$ is $(0, 3)$. What is the correct $y$-intercept?'
            answer: '(0, -3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'At $x = 0$ the output is $0 - 0 - 3 = -3$, not $3$. So the $y$-intercept is $(0, -3)$.'
          - problem: 'A skate bowl has the cross-section $y = x^2 - 10x + 16$, where $x$ is the horizontal distance in metres and $y$ is the height in metres above street level. How wide is the bowl at street level?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Street level is $y = 0$, and $x^2 - 10x + 16 = (x - 2)(x - 8) = 0$ gives $x = 2$ and $x = 8$. The bowl is $8 - 2 = 6$ m wide.'
          - problem: 'A skate bowl has the cross-section $y = x^2 - 8x + 7$, where $x$ is the horizontal distance in metres and $y$ is the height in metres above street level. How far below street level is the bottom of the bowl?'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The bottom is the vertex, at $x = 8/2 = 4$. Then $y = 16 - 32 + 7 = -9$, so the bottom is $9$ m below street level.'
          - problem: 'Find the vertex and the $x$-intercepts of $y = x^2 - 6x + 8$.'
            answer: 'vertex = (3, -1); left_intercept = (2, 0); right_intercept = (4, 0)'
            answer_contract: {"kind": "multipart", "parts": [{"name": "vertex", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "left_intercept", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "right_intercept", "contract": {"kind": "coordinates", "arity": 2}}]}
            solution_sketch: 'Factoring $x^2 - 6x + 8 = (x - 2)(x - 4)$ gives the $x$-intercepts $(2, 0)$ and $(4, 0)$. The axis is halfway between them at $x = 3$, and $y = 9 - 18 + 8 = -1$, so the vertex is $(3, -1)$.'
        constraints: 'monic and factorable over the integers; give intercepts as points'
      - id: kp3
        name: All the features for a full sketch
        key_prerequisites: [quadratic-equations-factoring, parabola-vertex-form]
        exemplars:
          - problem: 'For $y = x^2 - 2x - 3$, give the direction of opening, the vertex, the $x$-intercepts and the $y$-intercept.'
            answer: 'direction = upward; vertex = (1, -4); left_intercept = (-1, 0); right_intercept = (3, 0); y_intercept = (0, -3)'
            answer_contract: {"kind": "multipart", "parts": [{"name": "direction", "contract": {"kind": "label", "options": [["upward", "up", "upwards", "opens upward", "it opens upward"], ["downward", "down", "downwards", "opens downward", "it opens downward"]]}}, {"name": "vertex", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "left_intercept", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "right_intercept", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "y_intercept", "contract": {"kind": "coordinates", "arity": 2}}]}
            solution_sketch: 'The leading coefficient is $1$, so it opens upward. Factoring $(x + 1)(x - 3)$ gives the intercepts $(-1, 0)$ and $(3, 0)$, the axis is $x = 1$ with $y = -4$, and at $x = 0$ the output is $-3$.'
          - problem: 'A footbridge arch has height $y = -x^2 + 6x$ metres at a horizontal distance of $x$ metres from one end. How high is the arch at its highest point?'
            answer: '9'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The arch opens downward, so its highest point is the vertex. At $x = -6/(-2) = 3$ the height is $-9 + 18 = 9$, so the arch is $9$ m high.'
          - problem: 'A tunnel entrance has the shape $y = -x^2 + 8x - 7$, where $x$ is the distance along the ground in metres and $y$ is the height in metres. How wide is the tunnel at ground level?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'At ground level $y = 0$, so $x^2 - 8x + 7 = (x - 1)(x - 7) = 0$. The ground points are at $x = 1$ and $x = 7$, so the tunnel is $6$ m wide.'
          - problem: 'Sam marks $(5, -25)$ as the vertex of $y = -x^2 + 10x$. What is the correct vertex?'
            answer: '(5, 25)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The vertex has $x = -10/(-2) = 5$. Then $y = -25 + 50 = 25$, so the vertex is $(5, 25)$ and Sam lost a sign.'
          - problem: 'For $y = -x^2 + 2x + 8$, give the direction of opening, the vertex, the $x$-intercepts and the $y$-intercept.'
            answer: 'direction = downward; vertex = (1, 9); left_intercept = (-2, 0); right_intercept = (4, 0); y_intercept = (0, 8)'
            answer_contract: {"kind": "multipart", "parts": [{"name": "direction", "contract": {"kind": "label", "options": [["upward", "up", "upwards", "opens upward", "it opens upward"], ["downward", "down", "downwards", "opens downward", "it opens downward"]]}}, {"name": "vertex", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "left_intercept", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "right_intercept", "contract": {"kind": "coordinates", "arity": 2}}, {"name": "y_intercept", "contract": {"kind": "coordinates", "arity": 2}}]}
            solution_sketch: 'The leading coefficient is $-1$, so it opens downward. Factoring $-(x - 4)(x + 2)$ gives the intercepts $(-2, 0)$ and $(4, 0)$, the axis is $x = 1$ with $y = 9$, and at $x = 0$ the output is $8$.'
          - problem: 'Does the graph of $y = x^2 - 4x + 5$ cross the $x$-axis?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "it does", "it crosses"], ["no", "no, it does not", "it does not", "never", "it never does", "not"]]}
            solution_sketch: 'The parabola opens upward and its vertex is at $x = 2$, where $y = 4 - 8 + 5 = 1$. The lowest point is above the axis, so the graph never crosses the $x$-axis.'
          - problem: 'A model rocket has height $h = -t^2 + 10t$ metres after $t$ seconds. When does it land?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'It lands when $h = 0$: $-t^2 + 10t = -t(t - 10) = 0$, so $t = 0$ or $t = 10$. The launch is at $t = 0$, so it lands after $10$ seconds.'
          - problem: 'A rocket has height $h = -t^2 + 12t$ metres after $t$ seconds. For how many seconds is it higher than $20$ m?'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'Setting $h = 20$ gives $t^2 - 12t + 20 = (t - 2)(t - 10) = 0$. The rocket is above $20$ m from $t = 2$ to $t = 10$, which is $8$ seconds.'
        constraints: 'leading coefficient 1 or -1; ask for opening direction, vertex and intercepts together'
    diagnostic_exemplar:
      problem: 'Find the vertex and $x$-intercepts of $y = x^2 - 2x - 8$.'
      answer_contract: {kind: multipart, parts: [{name: vertex, contract: {kind: coordinates, arity: 2}}, {name: left_intercept, contract: {kind: coordinates, arity: 2}}, {name: right_intercept, contract: {kind: coordinates, arity: 2}}]}
      answer: "vertex = (1, -9); left_intercept = (-2, 0); right_intercept = (4, 0)"
      solution_sketch: '$x = \frac{-b}{2a} = 1$ gives $y = -9$; factoring $x^2 - 2x - 8 = (x - 4)(x + 2)$ gives the intercepts.'
    anki_seeds:
      - front: "For y = ax^2 + bx + c, the axis of symmetry (vertex x-coordinate) is..."
        back: "x = -b / (2a)"
        type: basic

  - id: converting-to-vertex-form
    name: Converting Quadratics to Vertex Form
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: completing-the-square
        weight: 0.8
        key: true
      - id: parabola-vertex-form
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Monic standard form to vertex form
        key_prerequisites: [completing-the-square, parabola-vertex-form]
        exemplars:
          - problem: 'Write $y = x^2 + 6x + 5$ in vertex form.'
            answer: 'y = (x + 3)^2 - 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Half of $6$ is $3$, and $3^2 = 9$. So $y = (x^2 + 6x + 9) - 9 + 5 = (x + 3)^2 - 4$.'
          - problem: 'Write $y = x^2 - 4x + 7$ in vertex form.'
            answer: 'y = (x - 2)^2 + 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Half of $-4$ is $-2$, and $(-2)^2 = 4$. So $y = (x^2 - 4x + 4) - 4 + 7 = (x - 2)^2 + 3$.'
          - problem: 'Sam rewrites $y = x^2 + 8x + 10$ as $y = (x + 4)^2 + 10$. What is the correct vertex form?'
            answer: 'y = (x + 4)^2 - 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam forgot to subtract the $16$ that completing the square adds. So $y = (x^2 + 8x + 16) - 16 + 10 = (x + 4)^2 - 6$.'
          - problem: 'Write $y = x^2 - 10x + 21$ in vertex form.'
            answer: 'y = (x - 5)^2 - 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Half of $-10$ is $-5$, and $(-5)^2 = 25$. So $y = (x^2 - 10x + 25) - 25 + 21 = (x - 5)^2 - 4$.'
          - problem: 'The cross-section of a skate bowl is $y = x^2 - 6x + 11$, with $x$ and $y$ in metres. Write its equation in vertex form.'
            answer: 'y = (x - 3)^2 + 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Half of $-6$ is $-3$, so $9$ is added and subtracted. Then $y = (x^2 - 6x + 9) - 9 + 11 = (x - 3)^2 + 2$.'
          - problem: 'A square garden has side $x$ metres. A bed $x$ m by $10$ m is cut lengthwise into two equal strips, and the strips are laid along two adjacent sides of the garden. What area must be added in the corner so that the garden and the strips form one larger square?'
            answer: '25'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'Each strip is $x$ m by $10 \div 2 = 5$ m. The corner needs a square of side $5$ m, so its area is $5 \cdot 5 = 25$ m$^2$, and $x^2 + 10x + 25 = (x + 5)^2$.'
          - problem: 'Write $y = x^2 + 2x - 3$ in vertex form.'
            answer: 'y = (x + 1)^2 - 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Half of $2$ is $1$, and $1^2 = 1$. So $y = (x^2 + 2x + 1) - 1 - 3 = (x + 1)^2 - 4$.'
          - problem: 'Write $y = x^2 - 14x + 60$ in vertex form.'
            answer: 'y = (x - 7)^2 + 11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Half of $-14$ is $-7$, and $(-7)^2 = 49$. So $y = (x^2 - 14x + 49) - 49 + 60 = (x - 7)^2 + 11$.'
        constraints: "monic; even middle coefficient"
      - id: kp2
        name: Factor out a leading coefficient first
        key_prerequisites: [completing-the-square]
        exemplars:
          - problem: 'Write $y = 2x^2 - 8x + 3$ in vertex form.'
            answer: 'y = 2(x - 2)^2 - 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $2$ from the $x$ terms: $2(x^2 - 4x) + 3 = 2((x - 2)^2 - 4) + 3$. The outside constant is $-8 + 3 = -5$, so $y = 2(x - 2)^2 - 5$.'
          - problem: 'A footbridge arch has height $y = -x^2 + 2x + 3$ metres at horizontal distance $x$ metres. Write its equation in vertex form.'
            answer: 'y = -(x - 1)^2 + 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $-1$ from the $x$ terms: $-(x^2 - 2x) + 3 = -((x - 1)^2 - 1) + 3$. Distributing the minus sign gives $y = -(x - 1)^2 + 4$.'
          - problem: 'Sam rewrites $y = 3x^2 - 12x + 5$ as $y = 3(x - 2)^2 + 1$. What is the correct vertex form?'
            answer: 'y = 3(x - 2)^2 - 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam did not multiply the $-4$ inside the bracket by $3$. So $3(x^2 - 4x) + 5 = 3((x - 2)^2 - 4) + 5 = 3(x - 2)^2 - 7$.'
          - problem: 'Write $y = -2x^2 - 8x + 1$ in vertex form.'
            answer: 'y = -2(x + 2)^2 + 9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $-2$ from the $x$ terms: $-2(x^2 + 4x) + 1 = -2((x + 2)^2 - 4) + 1$. The outside constant is $8 + 1 = 9$, so $y = -2(x + 2)^2 + 9$.'
          - problem: 'Write $y = 4x^2 + 24x + 5$ in vertex form.'
            answer: 'y = 4(x + 3)^2 - 31'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $4$ from the $x$ terms: $4(x^2 + 6x) + 5 = 4((x + 3)^2 - 9) + 5$. The outside constant is $-36 + 5 = -31$, so $y = 4(x + 3)^2 - 31$.'
          - problem: 'A ball''s height in metres is $h = -5t^2 + 20t + 1$ after $t$ seconds. Write this equation in vertex form.'
            answer: 'h = -5(t - 2)^2 + 21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $-5$ from the $t$ terms: $-5(t^2 - 4t) + 1 = -5((t - 2)^2 - 4) + 1$. The outside constant is $20 + 1 = 21$, so $h = -5(t - 2)^2 + 21$.'
          - problem: 'Write $y = 3x^2 + 6x - 1$ in vertex form.'
            answer: 'y = 3(x + 1)^2 - 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $3$ from the $x$ terms: $3(x^2 + 2x) - 1 = 3((x + 1)^2 - 1) - 1$. The outside constant is $-3 - 1 = -4$, so $y = 3(x + 1)^2 - 4$.'
          - problem: 'Write $y = 2x^2 + 12x + 7$ in vertex form.'
            answer: 'y = 2(x + 3)^2 - 11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $2$ from the $x$ terms: $2(x^2 + 6x) + 7 = 2((x + 3)^2 - 9) + 7$. The outside constant is $-18 + 7 = -11$, so $y = 2(x + 3)^2 - 11$.'
        constraints: "factor a out of the x-terms only"
      - id: kp3
        name: Read the vertex and extreme value from the result
        key_prerequisites: [parabola-vertex-form, completing-the-square]
        exemplars:
          - problem: 'Convert $y = x^2 + 10x + 30$ to vertex form and give the minimum value of $y$.'
            answer: 'vertex_form = (x + 5)^2 + 5; minimum = 5'
            answer_contract: {"kind": "multipart", "parts": [{"name": "vertex_form", "contract": {"kind": "exact"}}, {"name": "minimum", "contract": {"kind": "exact"}}]}
            solution_sketch: 'Add and subtract $25$: $y = (x + 5)^2 + 30 - 25 = (x + 5)^2 + 5$. The square is never negative, so the minimum output is $5$.'
          - problem: 'Find the vertex of the parabola $y = 2x^2 + 8x + 11$.'
            answer: '(-2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Factor $2$ from the $x$ terms: $2(x^2 + 4x) + 11 = 2((x + 2)^2 - 4) + 11 = 2(x + 2)^2 + 3$. The vertex is $(-2, 3)$.'
          - problem: 'A parabolic cross-section has the equation $y = x^2 + 12x + 40$, where $y$ is the height in metres. Complete the square to find the minimum height.'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Add and subtract $36$: $y = (x + 6)^2 + 40 - 36 = (x + 6)^2 + 4$. The square is never negative, so the minimum height is $4$ m.'
          - problem: 'Sam rewrites $y = 2x^2 + 4x + 5$ as $2(x + 1)^2 + 5$. Give the correct vertex form and the vertex.'
            answer: 'vertex_form = 2(x + 1)^2 + 3; vertex = (-1, 3)'
            answer_contract: {"kind": "multipart", "parts": [{"name": "vertex_form", "contract": {"kind": "exact"}}, {"name": "vertex", "contract": {"kind": "coordinates", "arity": 2}}]}
            solution_sketch: 'Sam forgot that the $-1$ inside the bracket is multiplied by $2$. So $2(x^2 + 2x) + 5 = 2((x + 1)^2 - 1) + 5 = 2(x + 1)^2 + 3$, with vertex $(-1, 3)$.'
          - problem: 'What is the maximum value of $y = -x^2 + 6x - 4$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $-1$ from the $x$ terms: $-(x^2 - 6x) - 4 = -((x - 3)^2 - 9) - 4 = -(x - 3)^2 + 5$. The square term is never positive, so the maximum value is $5$.'
          - problem: 'A bakery''s daily profit in dollars from $x$ trays is $P = -2x^2 + 40x - 100$. How many trays give the greatest profit?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor $-2$ from the $x$ terms: $-2(x^2 - 20x) - 100 = -2((x - 10)^2 - 100) - 100 = -2(x - 10)^2 + 100$. The profit is greatest when $x - 10 = 0$, so at $10$ trays.'
          - problem: 'A model rocket''s height in metres is $h = -5t^2 + 30t + 2$ after $t$ seconds. What is the greatest height?'
            answer: '47'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Factor $-5$ from the $t$ terms: $-5(t^2 - 6t) + 2 = -5((t - 3)^2 - 9) + 2 = -5(t - 3)^2 + 47$. The greatest height is $47$ m, reached at $t = 3$ s.'
          - problem: 'Does the graph of $y = x^2 - 6x + 13$ cross the $x$-axis?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "it does", "it crosses"], ["no", "no, it does not", "it does not", "never", "it never does", "not"]]}
            solution_sketch: 'Completing the square gives $y = (x - 3)^2 + 4$. The square is never negative, so $y \ge 4$ and the graph stays above the $x$-axis.'
        constraints: "conversion plus one interpretive question"
    diagnostic_exemplar:
      problem: 'Write $y = 2x^2 + 8x + 3$ in vertex form.'
      answer: 'y = 2(x + 2)^2 - 5'
      solution_sketch: '$2(x^2 + 4x) + 3 = 2((x + 2)^2 - 4) + 3$.'
    anki_seeds:
      - front: "To convert y = x^2 + bx + c to vertex form, ..."
        back: "complete the square: y = (x + b/2)^2 + (c - (b/2)^2)"
        type: basic

  - id: quadratic-applications
    name: Quadratic Word Problems
    core: false                # supplemental applications capstone
    difficulty: 0.75
    drill: false
    answer_kind: multi-step
    expected_time_secs: 240
    prerequisites:
      - id: quadratic-equations-factoring
        weight: 0.6
        key: true
      - id: quadratic-formula
        weight: 0.5
        key: true
      - id: quadratic-graphs-vertex
        weight: 0.4
      - id: multi-step-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Area and consecutive-integer models
        key_prerequisites: [quadratic-equations-factoring]
        exemplars:
          - problem: 'A rectangular garden is $3$ m longer than it is wide. Its area is $40$ m$^2$. How wide is the garden?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'With width $w$, the length is $w+3$, so $w(w+3)=40$. This gives $w^2+3w-40=0$, or $(w+8)(w-5)=0$. A width cannot be negative, so the garden is $5$ m wide.'
          - problem: 'Two consecutive positive integers have product $56$. What are the two integers?'
            answer: '7, 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let the smaller integer be $n$, so $n(n+1)=56$ and $n^2+n-56=0$. This factors as $(n+8)(n-7)=0$. The integers are positive, so $n=7$ and the integers are $7$ and $8$.'
          - problem: 'A rectangle has area $45$ cm$^2$, and its length is $4$ cm more than its width. Nadia solves $w(w+4)=45$ and gets $w=-9$ or $w=5$. How long is the rectangle?'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'From $(w+9)(w-5)=0$ only $w=5$ is a possible width, because a width cannot be negative. The length is $w+4=9$ cm, and $5\cdot9=45$ confirms the area.'
          - problem: 'A seating plan has $110$ seats. Every row has one more seat than the number of rows. How many rows are there?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $n$ rows, each row has $n+1$ seats, so $n(n+1)=110$ and $n^2+n-110=0$. This factors as $(n+11)(n-10)=0$. A count of rows is positive, so there are $10$ rows.'
          - problem: 'A group of friends shares the cost of a cabin that costs $240$ euros. With $2$ more friends, each person would pay $6$ euros less. How many friends are in the group now?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $n$ friends each pays $240/n$, and with $n+2$ friends each pays $240/(n+2)$. The difference is $6$, so $240(n+2)-240n=6n(n+2)$, which gives $n(n+2)=80$. This factors as $(n+10)(n-8)=0$, so $n=8$. Check: $30-24=6$.'
          - problem: 'A lawn measures $12$ m by $8$ m. A path of equal width is laid all the way around it. The lawn and the path together cover $192$ m$^2$. How wide is the path?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The outer rectangle measures $(12+2x)$ by $(8+2x)$, so $(12+2x)(8+2x)=192$. This gives $x^2+10x-24=0$, or $(x+12)(x-2)=0$. A width is positive, so the path is $2$ m wide.'
          - problem: 'A rectangular field has perimeter $40$ m and area $96$ m$^2$. What are the lengths of its two sides?'
            answer: '8, 12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The two sides add up to half the perimeter, $20$ m. If one side is $w$, the other is $20-w$, so $w(20-w)=96$ and $w^2-20w+96=0$. This factors as $(w-8)(w-12)=0$, so the sides are $8$ m and $12$ m.'
          - problem: 'A triangle''s base is $4$ cm longer than its height, and its area is $30$ cm$^2$. How tall is the triangle?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The area is half of base times height, so $\frac12h(h+4)=30$ and $h(h+4)=60$. This gives $h^2+4h-60=0$, or $(h+10)(h-6)=0$. The height is positive, so $h=6$ cm and the base is $10$ cm.'
          - problem: 'Two consecutive odd positive integers have product $143$. What are they?'
            answer: '11, 13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Let the smaller odd integer be $n$, so the next is $n+2$ and $n(n+2)=143$. This gives $n^2+2n-143=0$, or $(n+13)(n-11)=0$. The integers are positive, so they are $11$ and $13$.'
          - problem: 'The squares of two consecutive positive integers add up to $85$. What are the integers?'
            answer: '6, 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With smaller integer $n$, $n^2+(n+1)^2=85$ gives $2n^2+2n-84=0$, so $n^2+n-42=0$. This factors as $(n+7)(n-6)=0$. The integers are positive, so they are $6$ and $7$.'
        constraints: 'area, perimeter, cost-sharing and consecutive-number setups; the quadratic factors over the integers; discard the root that does not fit the problem'
      - id: kp2
        name: Projectile height and maximum-value problems
        key_prerequisites: [quadratic-graphs-vertex]
        exemplars:
          - problem: 'A ball is thrown upward, and its height in metres after $t$ seconds is $h=-5t^2+30t$. When does the ball land?'
            answer: '6'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The ball is on the ground when $h=0$: $-5t(t-6)=0$. The solutions are $t=0$, the throw, and $t=6$. The ball lands after $6$ seconds.'
          - problem: 'A ball is thrown upward, and its height in metres after $t$ seconds is $h=-5t^2+30t$. What is the greatest height the ball reaches?'
            answer: '45'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The highest point is at the vertex, $t=\frac{-30}{2(-5)}=3$. Then $h=-5\cdot9+30\cdot3=-45+90=45$, so the maximum height is $45$ m.'
          - problem: 'A stone is thrown upward, and its height in metres after $t$ seconds is $h=-5t^2+20t$. For how many seconds is the stone in the air?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The stone is in the air from the throw at $t=0$ until it lands at $h=0$. From $-5t(t-4)=0$ the landing time is $t=4$, so the stone is in the air for $4$ seconds.'
          - problem: 'The height of a toy rocket in metres is $h=-5t^2+40t$, where $t$ is the time in seconds. How high does the rocket go?'
            answer: '80'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The peak is at $t=\frac{-40}{2(-5)}=4$. Then $h=-5\cdot16+40\cdot4=-80+160=80$, so the rocket reaches $80$ m.'
          - problem: 'A ball is thrown upward, and its height in metres after $t$ seconds is $h=-5t^2+30t$. At what times is the ball $25$ m above the ground?'
            answer: '1, 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Set $-5t^2+30t=25$ and divide by $-5$: $t^2-6t+5=0$, so $(t-1)(t-5)=0$. The ball is $25$ m high on the way up at $t=1$ and on the way down at $t=5$.'
          - problem: 'A ball is thrown upward, and its height in metres after $t$ seconds is $h=-5t^2+10t$. After how many seconds does the ball reach its highest point?'
            answer: '1'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The ball is on the ground at $t=0$ and $t=2$, and the path is symmetric, so the highest point is halfway between them. The vertex formula agrees: $t=\frac{-10}{2(-5)}=1$ second.'
          - problem: 'A ball is thrown upward from a roof. Its height in metres after $t$ seconds is $h=-5t^2+10t+15$. When does the ball hit the ground?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The ball is on the ground when $h=0$. Dividing by $-5$ gives $t^2-2t-3=0$, so $(t-3)(t+1)=0$. A time cannot be negative, so the ball lands after $3$ seconds.'
          - problem: 'A stone is thrown upward from a platform. Its height in metres after $t$ seconds is $h=-5t^2+20t+25$. When does the stone reach the ground?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'Set $h=0$ and divide by $-5$: $t^2-4t-5=0$, so $(t-5)(t+1)=0$. The root $t=-1$ is before the throw, so the stone lands at $t=5$ seconds.'
          - problem: 'A ball is thrown upward, and its height in metres after $t$ seconds is $h=-5t^2+30t$. For how many seconds is the ball more than $40$ m above the ground?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'Set $-5t^2+30t=40$: $t^2-6t+8=0$, so $(t-2)(t-4)=0$. The ball is at $40$ m when $t=2$ and $t=4$, and it is higher in between, so it is above $40$ m for $4-2=2$ seconds.'
        constraints: 'height models h = -5t^2 + bt (+ c); landing time, maximum height, time at a given height or time above a given height; the quadratic factors over the integers'
