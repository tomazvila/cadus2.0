    knowledge_points:
      - id: kp1
        name: Compute the discriminant b^2 - 4ac
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Find the discriminant of $x^2 + 3x + 2$.'
            answer: "1"
            solution_sketch: '$3^2 - 4(1)(2) = 9 - 8 = 1$.'
          - problem: 'A coefficient table gives $a=2,b=-4,c=5$. Calculate $b^2-4ac$.'
            answer: "-24"
            solution_sketch: '$(-4)^2 - 4(2)(5) = 16 - 40 = -24$.'
          - problem: 'A learner uses $-36$ for $b^2$ in $x^2-6x+5=0$. Correct the discriminant.'
            answer: "16"
            solution_sketch: '$(-6)^2 - 4(1)(5) = 36 - 20 = 16$.'
          - problem: 'For the intersection equation $3x^2+5x=-1$, calculate the discriminant after moving the constant left.'
            answer: "13"
            solution_sketch: '$5^2 - 4(3)(1) = 25 - 12 = 13$.'
        constraints: 'integer a, b, c with coefficients at most 6 in size; answer is the signed value of b^2 - 4ac'
      - id: kp2
        name: Determine the number and nature of real roots
        key_prerequisites: [quadratic-formula]
        exemplars:
          - problem: 'How many real solutions does $x^2 - 6x + 9 = 0$ have? Use the discriminant.'
            answer: "1"
            solution_sketch: 'disc $= 36 - 36 = 0$: exactly one repeated real root.'
          - problem: 'How many horizontal-axis intersection points does $y=x^2+x+1$ have? Decide from the discriminant.'
            answer: "0"
            solution_sketch: 'disc $= 1 - 4 = -3 < 0$: no real roots.'
          - problem: 'A quadratic''s coefficient row is $(1,-5,2)$. Use its discriminant to give the number of distinct real zeros.'
            answer: "2"
            solution_sketch: 'disc $= 25 - 8 = 17 > 0$: two distinct real roots.'
          - problem: 'A learner claims two real zeros for $2x^2-3x+5$ because it is quadratic. Give the actual number using the discriminant.'
            answer: "0"
            solution_sketch: 'disc $= 9 - 40 = -31 < 0$: no real roots.'
        constraints: 'answer is the count 0, 1, or 2; cover all three cases across problems'
    diagnostic_exemplar:
      problem: 'How many real solutions does $2x^2 + 3x + 4 = 0$ have? Use the discriminant.'
      answer: '0'
      solution_sketch: '$3^2 - 4(2)(4) = 9 - 32 = -23 < 0$, so there are no real solutions.'
    anki_seeds:
      - front: "What does the discriminant b^2 - 4ac tell you about the roots?"
        back: ">0 two real roots, =0 one repeated root, <0 no real roots."
        type: basic

