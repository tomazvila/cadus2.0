          options:
            - 'Every factor pair of $30$ adds to $11$'
            - 'In $(x + p)(x + q)$ the middle term is $(p + q)x$'
            - 'Adding the pair checks that its product is $30$'
          answer: 'In $(x + p)(x + q)$ the middle term is $(p + q)x$'
          why: 'Expanding $(x + p)(x + q)$ gives $x^2 + (p + q)x + pq$, so $p + q$ must match $11$ and $pq$ must match $30$.'
        exemplars:
          - problem: 'Factor $x^2 + 7x + 12$.'
            answer: '(x + 3)(x + 4)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $12$ and sum $7$. Since $3 \cdot 4 = 12$ and $3 + 4 = 7$, the result is $(x + 3)(x + 4)$.'
          - problem: 'A rectangle has area $x^2 + 9x + 20$ square metres and width $x + 4$ metres. Find its length.'
            answer: 'x + 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width. Since $4 \cdot 5 = 20$ and $4 + 5 = 9$, the area is $(x + 4)(x + 5)$, so the length is $x + 5$ metres.'
          - problem: 'Factor $n^2 + 8n + 12$.'
            answer: '(n + 2)(n + 6)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $12$ and sum $8$. The pair $2$ and $6$ works, so the result is $(n + 2)(n + 6)$.'
          - problem: 'Sam factors $x^2 + 10x + 21$ as $(x + 1)(x + 21)$. What is the correct factorization?'
            answer: '(x + 3)(x + 7)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam''s constants multiply to $21$ but add to $22$. The pair $3$ and $7$ has product $21$ and sum $10$, so the result is $(x + 3)(x + 7)$.'
          - problem: 'A square photo of side $x$ cm is mounted on a card. The card is a rectangle of area $x^2 + 6x + 8$ square cm, and each of its sides is longer than $x$ by a whole number of centimetres. Factor the area to find the dimensions of the card.'
            answer: '(x + 2)(x + 4)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two whole numbers with product $8$ and sum $6$. The pair $2$ and $4$ works, so the card measures $x + 2$ by $x + 4$ centimetres.'
          - problem: 'Find every positive integer $b$ for which $x^2 + bx + 12$ factors as $(x + p)(x + q)$ with integers $p$ and $q$.'
            answer: '7, 8, 13'
            answer_contract: {"kind":"list","ordered":false,"member":{"kind":"exact"}}
            solution_sketch: 'We need $pq = 12$ and $b = p + q > 0$, so $p$ and $q$ are both positive. The pairs $3, 4$, $2, 6$ and $1, 12$ give $b = 7$, $8$ and $13$.'
          - problem: 'Factor $t^2 + 13t + 36$.'
            answer: '(t + 4)(t + 9)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $36$ and sum $13$. The pair $4$ and $9$ works, so the result is $(t + 4)(t + 9)$.'
      - id: kp2
        name: Negative constant term
        key_prerequisites: [integer-multiplication-division, integer-addition-subtraction]
        constraints: "c < 0: the factor pair has opposite signs"
        step_check:
          step: 'Find two integers with product $-40$ and sum $3$'
          question: 'Why must the two integers have opposite signs?'
          options:
            - 'Their sum $3$ is positive'
            - 'Their product $-40$ is negative'
            - 'The coefficient of $x^2$ is $1$'
          answer: 'Their product $-40$ is negative'
          why: 'Two numbers with the same sign have a positive product, so a negative product forces opposite signs; the positive sum then says the positive one is larger.'
        exemplars:
          - problem: 'Factor $x^2 + 2x - 15$.'
            answer: '(x + 5)(x - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $-15$ and sum $2$. Since $5 \cdot (-3) = -15$ and $5 - 3 = 2$, the result is $(x + 5)(x - 3)$.'
          - problem: 'Factor $x^2 - 3x - 10$.'
            answer: '(x - 5)(x + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $-10$ and sum $-3$. Since $-5 \cdot 2 = -10$ and $-5 + 2 = -3$, the result is $(x - 5)(x + 2)$.'
          - problem: 'Sam factors $x^2 - 3x - 40$ as $(x - 5)(x + 8)$. What is the correct factorization?'
            answer: '(x - 8)(x + 5)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam''s constants add to $+3$, so the signs are swapped. The constants must multiply to $-40$ and add to $-3$, which gives $-8$ and $5$: $(x - 8)(x + 5)$.'
          - problem: 'A rectangular plot has area $x^2 + 4x - 21$ square metres and width $x - 3$ metres. Find its length.'
            answer: 'x + 7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width. Since $7 \cdot (-3) = -21$ and $7 - 3 = 4$, the area is $(x - 3)(x + 7)$, so the length is $x + 7$ metres.'
          - problem: 'A square of side $x$ cm is changed into a rectangle by lengthening one side and shortening the other, each by a whole number of centimetres. The rectangle has area $x^2 + 5x - 14$ square cm. By how many centimetres was one side shortened?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Factor the area: $7 \cdot (-2) = -14$ and $7 - 2 = 5$, so it is $(x + 7)(x - 2)$. One side grew by $7$ cm and the other was shortened by $2$ cm.'
          - problem: 'Factor $m^2 - m - 42$.'
            answer: '(m - 7)(m + 6)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $-42$ and sum $-1$. The pair $-7$ and $6$ works, so the result is $(m - 7)(m + 6)$.'
          - problem: 'Factor $y^2 - 2y - 48$.'
            answer: '(y - 8)(y + 6)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $-48$ and sum $-2$. The pair $-8$ and $6$ works, so the result is $(y - 8)(y + 6)$.'
      - id: kp3
        name: Negative middle term, positive constant
        key_prerequisites: [integer-multiplication-division, integer-addition-subtraction]
        constraints: "b < 0, c > 0: both factors negative"
        step_check:
          step: 'since the sum is negative and the product is positive, both integers are negative'
          question: 'Why must both integers be negative?'
          options:
            - 'A negative middle term needs one negative and one positive integer'
            - 'The constant $40$ is positive, so both integers are positive'
            - 'A positive product needs equal signs, and a negative sum rules out two positives'
          answer: 'A positive product needs equal signs, and a negative sum rules out two positives'
          why: '$(-5)(-8) = 40$ keeps the product positive, while $-5 + (-8) = -13$ gives the negative middle coefficient.'
        exemplars:
          - problem: 'Factor $x^2 - 5x + 6$.'
            answer: '(x - 2)(x - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $6$ and sum $-5$. Both are negative: $(-2)(-3) = 6$ and $-2 - 3 = -5$, so the result is $(x - 2)(x - 3)$.'
          - problem: 'Factor $a^2 - 9a + 14$.'
            answer: '(a - 2)(a - 7)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $14$ and sum $-9$. The pair $-2$ and $-7$ works, so the result is $(a - 2)(a - 7)$.'
          - problem: 'Sam factors $x^2 - 9x + 20$ as $(x + 4)(x + 5)$. What is the correct factorization?'
            answer: '(x - 4)(x - 5)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam''s constants add to $+9$. A positive product and a negative sum need two negative constants: $(-4)(-5) = 20$ and $-4 - 5 = -9$, so the result is $(x - 4)(x - 5)$.'
          - problem: 'A rectangle has area $x^2 - 7x + 12$ square metres and length $x - 3$ metres. Find its width.'
            answer: 'x - 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Width is area divided by length. Since $(-3)(-4) = 12$ and $-3 - 4 = -7$, the area is $(x - 3)(x - 4)$, so the width is $x - 4$ metres.'
          - problem: 'A square garden has side $x$ metres. Both sides are shortened by whole numbers of metres, giving a rectangle of area $x^2 - 11x + 24$ square metres. Factor the area to find the new side lengths.'
            answer: '(x - 3)(x - 8)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two negative numbers with product $24$ and sum $-11$. The pair $-3$ and $-8$ works, so the new sides are $x - 3$ and $x - 8$ metres.'
          - problem: 'Factor $x^2 - 12x + 35$.'
            answer: '(x - 5)(x - 7)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $35$ and sum $-12$. The pair $-5$ and $-7$ works, so the result is $(x - 5)(x - 7)$.'
          - problem: 'Factor $p^2 - 10p + 16$.'
            answer: '(p - 2)(p - 8)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Look for two numbers with product $16$ and sum $-10$. The pair $-2$ and $-8$ works, so the result is $(p - 2)(p - 8)$.'
    diagnostic_exemplar:
      problem: 'Factor $x^2 - 2x - 24$.'
      answer: '(x - 6)(x + 4)'
      solution_sketch: '$-6 \times 4 = -24$ and $-6 + 4 = -2$.'
    anki_seeds:
      - front: "To factor x^2 + bx + c, find two numbers that..."
        back: "multiply to c and add to b."
        type: basic

  - id: factoring-trinomials
    name: Factoring Trinomials
    core: true
    difficulty: 0.65
    drill: false               # L4 audit: multi-step factoring cannot fit the 6s drill countdown
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: factoring-monic-trinomials
        weight: 0.8
        key: true
      - id: factoring-by-grouping
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.5
      - id: factoring-gcf
        weight: 0.5
      - id: integer-multiplication-division
        weight: 0.4
    encompassings_extra:
      # sibling factoring pattern: practising trinomials implicitly rehearses
      # recognising a difference of squares (not an ancestor of this topic).
      - id: difference-of-squares
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Leading coefficient not equal to 1 (ac-method)
        key_prerequisites: [factoring-monic-trinomials, factoring-by-grouping]
        constraints: "split bx using two integers that multiply to ac and add to b"
        try_first:
          problem: 'Two integers have product $2 \cdot 3 = 6$ and sum $7$. What is the larger of the two?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'The integers are $6$ and $1$. They split the middle term of $2x^2 + 7x + 3$ into $6x + x$, and grouping $2x(x + 3) + 1(x + 3)$ then gives $(2x + 1)(x + 3)$.'
        step_check:
          step: 'Find two integers that multiply to $30$ and add to $17$'
          question: 'Why look for integers that multiply to $30$ rather than to $6$?'
          options:
            - 'The constant $6$ has too few factor pairs to work'
            - 'Multiplying by $5$ removes the leading coefficient from the answer'
            - '$30$ is $a \cdot c$, and only then do the split terms regroup'
          answer: '$30$ is $a \cdot c$, and only then do the split terms regroup'
          why: 'Splitting $17x$ as $2x + 15x$ with $2 \cdot 15 = 5 \cdot 6$ makes both pairs share a binomial: $x(5x + 2) + 3(5x + 2)$.'
        exemplars:
          - problem: 'Factor $2x^2 + 7x + 3$.'
            answer: '(2x + 1)(x + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Here $ac = 6$, and $6 + 1 = 7$, so split $7x$ as $6x + x$. Grouping gives $2x(x + 3) + 1(x + 3) = (2x + 1)(x + 3)$.'
          - problem: 'Factor $3x^2 - 10x + 8$.'
            answer: '(3x - 4)(x - 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Here $ac = 24$, and $-6 - 4 = -10$, so split $-10x$ as $-6x - 4x$. Grouping gives $3x(x - 2) - 4(x - 2) = (3x - 4)(x - 2)$.'
          - problem: 'Sam factors $3x^2 + 7x + 2$ as $(3x + 2)(x + 1)$. What is the correct factorization?'
            answer: '(3x + 1)(x + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam''s product expands to $3x^2 + 5x + 2$, so the middle term is wrong. With $ac = 6$, split $7x$ as $6x + x$: $3x(x + 2) + 1(x + 2) = (3x + 1)(x + 2)$.'
          - problem: 'A rectangle has area $6x^2 + 19x + 15$ square centimetres and width $2x + 3$ centimetres. Find its length.'
            answer: '3x + 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width. With $ac = 90$, split $19x$ as $9x + 10x$: $3x(2x + 3) + 5(2x + 3) = (2x + 3)(3x + 5)$, so the length is $3x + 5$ centimetres.'
          - problem: 'Factor $2y^2 + 5y + 3$.'
            answer: '(y + 1)(2y + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Here $ac = 6$, and $2 + 3 = 5$, so split $5y$ as $2y + 3y$. Grouping gives $2y(y + 1) + 3(y + 1) = (y + 1)(2y + 3)$.'
          - problem: 'A rectangular rug has area $4x^2 + 8x + 3$ square metres. Factor the area to find expressions for its length and width.'
            answer: '(2x + 1)(2x + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Here $ac = 12$, and $2 + 6 = 8$, so split $8x$ as $2x + 6x$. Grouping gives $2x(2x + 1) + 3(2x + 1) = (2x + 1)(2x + 3)$, so the sides are $2x + 1$ and $2x + 3$ metres.'
          - problem: 'Factor $5x^2 - 17x + 6$.'
            answer: '(5x - 2)(x - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Here $ac = 30$, and $-15 - 2 = -17$, so split $-17x$ as $-15x - 2x$. Grouping gives $5x(x - 3) - 2(x - 3) = (5x - 2)(x - 3)$.'
      - id: kp2
        name: Non-monic trinomials with negative constants
        key_prerequisites: [factoring-monic-trinomials, factoring-by-grouping]
        step_check:
          step: 'Group and factor each pair'
          question: 'Why is $-4$, not $4$, taken out of $-4x - 12$?'
          options:
            - 'The GCF of two negative terms is always negative'
            - 'Taking out $-4$ leaves $x + 3$, the same bracket as the first group'
            - 'Taking out $4$ would change the value of $-4x - 12$'
          answer: 'Taking out $-4$ leaves $x + 3$, the same bracket as the first group'
          why: '$-4x - 12 = -4(x + 3)$ matches $3x(x + 3)$; taking out $4$ gives $4(-x - 3)$, a different bracket, so grouping would stall.'
        exemplars:
          - problem: 'Factor $6x^2 + x - 2$.'
            answer: '(3x + 2)(2x - 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Here $ac = -12$, and $4 - 3 = 1$, so split $x$ as $4x - 3x$. Grouping gives $2x(3x + 2) - 1(3x + 2) = (3x + 2)(2x - 1)$.'
          - problem: 'Factor $4x^2 - 4x - 3$.'
            answer: '(2x - 3)(2x + 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Here $ac = -12$, and $-6 + 2 = -4$, so split $-4x$ as $-6x + 2x$. Grouping gives $2x(2x - 3) + 1(2x - 3) = (2x - 3)(2x + 1)$.'
          - problem: 'Sam factors $6x^2 + 5x - 4$ as $(3x - 4)(2x + 1)$. What is the correct factorization?'
            answer: '(2x - 1)(3x + 4)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam''s product expands to $6x^2 - 5x - 4$, so the signs are swapped. With $ac = -24$, split $5x$ as $8x - 3x$: $2x(3x + 4) - 1(3x + 4) = (2x - 1)(3x + 4)$.'
          - problem: 'A rectangular banner has area $3x^2 + 5x - 2$ square metres and length $x + 2$ metres. Find its width.'
            answer: '3x - 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Width is area divided by length. With $ac = -6$, split $5x$ as $6x - x$: $3x(x + 2) - 1(x + 2) = (x + 2)(3x - 1)$, so the width is $3x - 1$ metres.'
          - problem: 'Factor $5n^2 + 3n - 2$.'
            answer: '(n + 1)(5n - 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Here $ac = -10$, and $5 - 2 = 3$, so split $3n$ as $5n - 2n$. Grouping gives $5n(n + 1) - 2(n + 1) = (n + 1)(5n - 2)$.'
          - problem: 'A rectangular field has area $10x^2 - x - 3$ square metres. Factor the area to find expressions for its length and width.'
            answer: '(5x - 3)(2x + 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Here $ac = -30$, and $5 - 6 = -1$, so split $-x$ as $5x - 6x$. Grouping gives $5x(2x + 1) - 3(2x + 1) = (5x - 3)(2x + 1)$, so the sides are $5x - 3$ and $2x + 1$ metres.'
          - problem: 'Factor $8x^2 - 2x - 15$.'
            answer: '(4x + 5)(2x - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Here $ac = -120$, and $10 - 12 = -2$, so split $-2x$ as $10x - 12x$. Grouping gives $2x(4x + 5) - 3(4x + 5) = (4x + 5)(2x - 3)$.'
        constraints: 'leading coefficient > 1 and negative constant term; the split pair has opposite signs'
      - id: kp3
        name: Factor out a GCF first, then the trinomial
        key_prerequisites: [factoring-gcf, factoring-monic-trinomials]
        step_check:
          step: 'Extract the GCF $3$'
          question: 'Why take out the $3$ before looking for a factor pair?'
          options:
            - 'The trinomial left is simpler, and the $3$ belongs in the final product'
            - 'A trinomial with a common factor cannot be factored any other way'
            - 'Taking out $3$ turns the trinomial into a perfect square'
          answer: 'The trinomial left is simpler, and the $3$ belongs in the final product'
          why: '$3x^2 + 21x + 30 = 3(x^2 + 7x + 10) = 3(x + 2)(x + 5)$; an answer like $(3x + 6)(x + 5)$ hides the $3$ inside a bracket and is not complete.'
        exemplars:
          - problem: 'Factor $2x^2 + 10x + 12$ completely.'
            answer: '2(x + 2)(x + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take out $2$ to get $2(x^2 + 5x + 6)$. Since $2 \cdot 3 = 6$ and $2 + 3 = 5$, the result is $2(x + 2)(x + 3)$.'
          - problem: 'Factor $6x^2 - 15x - 9$ completely.'
            answer: '3(2x + 1)(x - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take out $3$, leaving $2x^2 - 5x - 3$. Split $-5x$ as $-6x + x$ and group as $2x(x - 3) + 1(x - 3)$, so the result is $3(2x + 1)(x - 3)$.'
          - problem: 'Sam factors $4x^2 + 4x - 24$ as $2(2x^2 + 2x - 12)$. What is the complete factorization?'
            answer: '4(x - 2)(x + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The bracket still has the common factor $2$, so the GCF is $4$: $4(x^2 + x - 6)$. The constants $3$ and $-2$ multiply to $-6$ and add to $1$, giving $4(x - 2)(x + 3)$.'
          - problem: 'A box has volume $2x^3 + 14x^2 + 24x$ cubic centimetres. Factor the volume completely to find expressions for its three dimensions.'
            answer: '2x(x + 3)(x + 4)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take out $2x$ to get $2x(x^2 + 7x + 12)$. Since $3 \cdot 4 = 12$ and $3 + 4 = 7$, the volume is $2x(x + 3)(x + 4)$, so the dimensions are $2x$, $x + 3$ and $x + 4$ centimetres.'
          - problem: 'Ana factors $3x^2 + 21x + 36$ as $(3x + 9)(x + 4)$. What is the complete factorization?'
            answer: '3(x + 3)(x + 4)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Ana''s product is correct but not complete, because $3x + 9 = 3(x + 3)$. So the complete factorization is $3(x + 3)(x + 4)$.'
          - problem: 'A rectangle has area $4x^2 + 20x + 24$ square metres and width $x + 2$ metres. Find its length.'
            answer: '4x + 12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width. The area is $4(x^2 + 5x + 6) = 4(x + 2)(x + 3)$, so the length is $4(x + 3) = 4x + 12$ metres.'
          - problem: 'Factor $5y^2 - 5y - 30$ completely.'
            answer: '5(y - 3)(y + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take out $5$ to get $5(y^2 - y - 6)$. The constants $-3$ and $2$ multiply to $-6$ and add to $-1$, so the result is $5(y - 3)(y + 2)$.'
          - problem: 'The height of a rocket $t$ seconds after launch is $-5t^2 + 15t + 50$ metres. Factor this expression completely.'
            answer: '-5(t - 5)(t + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take out $-5$ to get $-5(t^2 - 3t - 10)$. The constants $-5$ and $2$ multiply to $-10$ and add to $-3$, so the height is $-5(t - 5)(t + 2)$, which is zero at $t = 5$.'
        constraints: 'integer GCF 2-3 common to all three terms; factor it out before the ac-method'
    diagnostic_exemplar:
      problem: 'Factor $6x^2 + 9x - 6$.'
      answer: '3(2x - 1)(x + 2)'
      solution_sketch: 'GCF $3$ first: $3(2x^2 + 3x - 2)$; then $ac = -4$, so split $3x$ as $4x - x$.'
    anki_seeds:
      - front: "ac-method for ax^2 + bx + c: find two numbers that multiply to ___ and add to ___"
        back: "ac; b (then split the middle term and factor by grouping)"
        type: basic

  - id: difference-of-squares
    name: Factoring a Difference of Squares
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: polynomial-multiplication
        weight: 0.5
        key: true
      - id: square-roots
        weight: 0.5
        key: true
      - id: factoring-gcf
        weight: 0.4
      - id: simplifying-radicals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Recognize and factor a^2 - b^2
        key_prerequisites: [polynomial-multiplication, square-roots]
        try_first:
          problem: 'Calculate $21 \times 19$ without a calculator.'
          answer_contract: {"kind":"exact"}
          answer: '399'
          reveal: 'Write $21 \times 19 = (20 + 1)(20 - 1) = 20^2 - 1^2 = 400 - 1 = 399$. The same pattern runs backwards to factor $x^2 - 1$ as $(x + 1)(x - 1)$.'
        step_check:
          step: 'Since $36=6^2$, the conjugate factors are $x-6$ and $x+6$'
          question: 'Why do $x - 6$ and $x + 6$ multiply back to $x^2 - 36$?'
          options:
            - 'Any two binomials with constant $6$ multiply to $x^2 - 36$'
            - '$(x - 6)^2$ and $(x - 6)(x + 6)$ are the same product'
            - 'The cross terms $6x$ and $-6x$ cancel, leaving $x^2 - 6^2$'
          answer: 'The cross terms $6x$ and $-6x$ cancel, leaving $x^2 - 6^2$'
          why: '$(x - 6)(x + 6) = x^2 + 6x - 6x - 36 = x^2 - 36$; with equal signs, as in $(x - 6)^2$, the cross terms add instead of cancelling.'
        exemplars:
          - problem: 'Factor $x^2 - 9$.'
            answer: '(x + 3)(x - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms are squares: $x^2 - 9 = x^2 - 3^2$. A difference of squares factors as $(x + 3)(x - 3)$.'
          - problem: 'Factor $y^2 - 49$.'
            answer: '(y + 7)(y - 7)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms are squares: $y^2 - 49 = y^2 - 7^2$. The conjugate factors are $y + 7$ and $y - 7$.'
          - problem: 'Sam factors $x^2 - 100$ as $(x - 10)^2$. What is the correct factorization?'
            answer: '(x - 10)(x + 10)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam''s square expands to $x^2 - 20x + 100$. Opposite signs make the cross terms cancel: $(x - 10)(x + 10) = x^2 - 100$.'
          - problem: 'Calculate $51 \times 49$ without a calculator.'
            answer: '2499'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the product as $(50 + 1)(50 - 1)$, a difference of squares. It equals $50^2 - 1^2 = 2500 - 1 = 2499$.'
          - problem: 'A square garden of side $x$ metres has a square pond of side $5$ metres in it. Write the area of the rest of the garden in factored form.'
            answer: '(x + 5)(x - 5)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The remaining area is $x^2 - 5^2 = x^2 - 25$ square metres. As a difference of squares it factors as $(x + 5)(x - 5)$.'
          - problem: 'Factor $a^2 - 64$.'
            answer: '(a + 8)(a - 8)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms are squares: $a^2 - 64 = a^2 - 8^2$. The conjugate factors are $a + 8$ and $a - 8$.'
          - problem: 'Calculate $103^2 - 97^2$ without a calculator.'
            answer: '1200'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor the difference of squares: $103^2 - 97^2 = (103 + 97)(103 - 97)$. That is $200 \cdot 6 = 1200$.'
          - problem: 'Factor $x^2 - 1$.'
            answer: '(x + 1)(x - 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Since $1 = 1^2$, the expression is $x^2 - 1^2$. It factors as $(x + 1)(x - 1)$.'
        constraints: 'monic square minus a perfect-square constant up to 100; no GCF to remove'
      - id: kp2
        name: Coefficients and higher even powers
        key_prerequisites: [square-roots]
        step_check:
          step: 'Write $(4x^2)^2-15^2$'
          question: 'Why is $16x^4$ written as $(4x^2)^2$?'
          options:
            - '$(4x)^4 = 16x^4$, so the square root is $4x$'
            - 'Only the coefficient $16$ has to be a square'
            - '$4x^2$ times itself is $16x^4$, so it is the square root'
          answer: '$4x^2$ times itself is $16x^4$, so it is the square root'
          why: 'Squaring $4x^2$ squares both parts: $4^2 = 16$ and $(x^2)^2 = x^4$; by contrast $(4x)^4 = 256x^4$.'
        exemplars:
          - problem: 'Factor $4x^2 - 25$.'
            answer: '(2x + 5)(2x - 5)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms are squares: $4x^2 = (2x)^2$ and $25 = 5^2$. The factors are $(2x + 5)(2x - 5)$.'
          - problem: 'Factor $9x^4 - 16$.'
            answer: '(3x^2 + 4)(3x^2 - 4)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Write $9x^4 - 16 = (3x^2)^2 - 4^2 = (3x^2 + 4)(3x^2 - 4)$. Neither factor splits further, because $3$ is not a square.'
          - problem: 'Sam factors $25x^4 - 4$ as $(5x - 2)(5x + 2)$. What is the correct factorization?'
            answer: '(5x^2 - 2)(5x^2 + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam''s product is $25x^2 - 4$. The square root of $25x^4$ is $5x^2$, so the factors are $5x^2 - 2$ and $5x^2 + 2$.'
          - problem: 'A square tile of side $3x$ cm has a square hole of side $2$ cm cut out of it. Write the remaining area in factored form.'
            answer: '(3x + 2)(3x - 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The remaining area is $(3x)^2 - 2^2 = 9x^2 - 4$ square centimetres. As a difference of squares it is $(3x + 2)(3x - 2)$.'
          - problem: 'Factor $16y^2 - 9$.'
            answer: '(4y - 3)(4y + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms are squares: $16y^2 = (4y)^2$ and $9 = 3^2$. The factors are $(4y - 3)(4y + 3)$.'
          - problem: 'A rectangle has area $49x^2 - 1$ square units and width $7x - 1$ units. Find its length.'
            answer: '7x + 1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width. Since $49x^2 - 1 = (7x - 1)(7x + 1)$, the length is $7x + 1$ units.'
          - problem: 'Factor $x^2 - 4y^2$.'
            answer: '(x + 2y)(x - 2y)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms are squares: $4y^2 = (2y)^2$. So $x^2 - (2y)^2 = (x + 2y)(x - 2y)$.'
          - problem: 'Factor $81 - x^2$.'
            answer: '(9 - x)(9 + x)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The first term is the square $9^2$ and the second is $x^2$. So $81 - x^2 = (9 - x)(9 + x)$.'
        constraints: 'perfect-square coefficients; even powers up to 4'
      - id: kp3
        name: Factor a GCF first, or factor repeatedly
        key_prerequisites: [factoring-gcf]
        step_check:
          step: 'Extract $3$: $3(x^2-16)$'
          question: 'Why take out the $3$ before using the difference of squares?'
          options:
            - 'The difference of squares works only when the coefficient is $3$'
            - '$3x^2$ and $48$ are not squares, but $x^2$ and $16$ are'
            - 'Taking out $3$ turns the expression into a perfect-square trinomial'
          answer: '$3x^2$ and $48$ are not squares, but $x^2$ and $16$ are'
          why: 'After removing the common factor, $x^2 - 16 = x^2 - 4^2$ fits the pattern, giving $3(x - 4)(x + 4)$.'
        exemplars:
          - problem: 'Factor $2x^2 - 18$ completely.'
            answer: '2(x + 3)(x - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take out the common factor $2$, leaving $x^2 - 9 = x^2 - 3^2$. The result is $2(x + 3)(x - 3)$.'
          - problem: 'Factor $x^4 - 16$ completely.'
            answer: '(x^2 + 4)(x + 2)(x - 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'First $x^4 - 16 = (x^2 + 4)(x^2 - 4)$. The factor $x^2 - 4$ is again a difference of squares, so the result is $(x^2 + 4)(x + 2)(x - 2)$.'
          - problem: 'Sam factors $x^4 - 81$ as $(x^2 - 9)(x^2 + 9)$. What is the complete factorization?'
            answer: '(x - 3)(x + 3)(x^2 + 9)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam stopped too early: $x^2 - 9$ is another difference of squares, $(x - 3)(x + 3)$. The sum $x^2 + 9$ does not factor, so the result is $(x - 3)(x + 3)(x^2 + 9)$.'
          - problem: 'A square metal plate of side $x$ cm has a square of side $2$ cm cut from each of its four corners. Write the remaining area in factored form.'
            answer: '(x - 4)(x + 4)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The four corners remove $4 \cdot 2^2 = 16$ square centimetres, leaving $x^2 - 16$. As a difference of squares this is $(x - 4)(x + 4)$.'
          - problem: 'Two square tiles have sides $5x$ cm and $5$ cm. Write the difference of their areas in completely factored form.'
            answer: '25(x - 1)(x + 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The difference is $25x^2 - 25$. Take out $25$ to get $25(x^2 - 1)$, which gives $25(x - 1)(x + 1)$.'
          - problem: 'Factor $3y^2 - 27$ completely.'
            answer: '3(y - 3)(y + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take out $3$ to get $3(y^2 - 9)$. Since $9 = 3^2$, the result is $3(y - 3)(y + 3)$.'
          - problem: 'Factor $5x^3 - 20x$ completely.'
            answer: '5x(x - 2)(x + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take out $5x$ to get $5x(x^2 - 4)$. Since $4 = 2^2$, the result is $5x(x - 2)(x + 2)$.'
          - problem: 'Factor $16x^4 - 1$ completely.'
            answer: '(4x^2 + 1)(2x + 1)(2x - 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'First $16x^4 - 1 = (4x^2 + 1)(4x^2 - 1)$. Then $4x^2 - 1 = (2x + 1)(2x - 1)$, so the result is $(4x^2 + 1)(2x + 1)(2x - 1)$.'
        constraints: 'an integer GCF or a factor that is itself a difference of squares; factor completely'
    diagnostic_exemplar:
      problem: 'Factor completely: $x^4 - 1$.'
      answer: '(x^2 + 1)(x + 1)(x - 1)'
      solution_sketch: '$x^4 - 1 = (x^2 + 1)(x^2 - 1)$, and $x^2 - 1$ splits again.'
    anki_seeds:
      - front: "a^2 - b^2 factors as..."
        back: "(a + b)(a - b)"
        type: basic

  - id: perfect-square-trinomials
    name: Factoring Perfect Square Trinomials
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: special-products
        weight: 0.7
        key: true
      - id: factoring-monic-trinomials
        weight: 0.5
        key: true
      - id: square-roots
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Recognize the pattern a^2 ± 2ab + b^2
        key_prerequisites: [special-products, square-roots]
        try_first:
          problem: 'Expand $(x + 5)^2$. What is the coefficient of $x$?'
          answer_contract: {"kind":"exact"}
          answer: '10'
          reveal: 'Since $(x + 5)^2 = x^2 + 5x + 5x + 25$, the middle coefficient is twice $5$. A trinomial is a perfect square only when its middle term is twice the product of the square roots of its end terms.'
        step_check:
          step: 'The required middle term would be $2(x)(4)=8x$'
          question: 'Why must the middle term be $2(x)(4)$?'
          options:
            - 'The middle term of a square is the product $(x)(4)$ of the roots'
            - 'Squaring $x + 4$ gives the cross term $4x$ twice'
            - 'Any middle term works once both end terms are squares'
          answer: 'Squaring $x + 4$ gives the cross term $4x$ twice'
          why: '$(x + 4)^2 = x^2 + 4x + 4x + 16 = x^2 + 8x + 16$; since $x^2 + 6x + 16$ has $6x$, it is not a perfect square.'
        exemplars:
          - problem: 'Is $x^2 + 10x + 25$ a perfect square trinomial?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","a perfect square","it is a perfect square"],["no","no, it is not","it is not","not a perfect square","it is not a perfect square"]]}
            solution_sketch: 'The end terms are $x^2$ and $5^2$. Twice their roots multiplied is $2(x)(5) = 10x$, which matches, so it is $(x + 5)^2$.'
          - problem: 'For what positive value of $k$ is $x^2 + kx + 25$ a perfect square trinomial?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The end terms are $x^2$ and $5^2$, so the square would be $(x + 5)^2$. Its middle term is $2(x)(5) = 10x$, so $k = 10$.'
          - problem: 'An area model has one $x^2$ square, two strips of area $4x$, and a corner square of area $16$. Write the total area as a squared binomial.'
            answer: '(x + 4)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The total area is $x^2 + 8x + 16$. The strips total $8x = 2(x)(4)$ and the corner is $4^2$, so the pieces form a square of side $x + 4$.'
          - problem: 'For what value of $c$ is $x^2 - 14x + c$ a perfect square trinomial?'
            answer: '49'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The middle term $-14x$ must equal $-2(x)(b)$, so $b = 7$. The constant must be $b^2 = 49$, making $(x - 7)^2$.'
          - problem: 'Is $x^2 + 12x + 16$ a perfect square trinomial?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","a perfect square","it is a perfect square"],["no","no, it is not","it is not","not a perfect square","it is not a perfect square"]]}
            solution_sketch: 'The end terms are $x^2$ and $4^2$, so a square would need the middle term $2(x)(4) = 8x$. The actual middle term is $12x$, so it is not a perfect square.'
          - problem: 'A square patio has area $x^2 + 18x + 81$ square metres. Find its side length.'
            answer: 'x + 9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $x^2 + 2(x)(9) + 9^2 = (x + 9)^2$. The side of a square is the square root of its area, so the side is $x + 9$ metres.'
          - problem: 'Sam says $x^2 + 8x + 64$ is a perfect square because $x^2$ and $64$ are squares. What middle term, with a positive coefficient, would make it one?'
            answer: '16x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The roots of the end terms are $x$ and $8$, so the square is $(x + 8)^2$. Its middle term is $2(x)(8) = 16x$, not $8x$.'
          - problem: 'For what positive value of $k$ is $4x^2 + kx + 9$ a perfect square trinomial?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The end terms are $(2x)^2$ and $3^2$, so the square would be $(2x + 3)^2$. Its middle term is $2(2x)(3) = 12x$, so $k = 12$.'
        constraints: "check the middle term against 2ab"
      - id: kp2
        name: Factor monic perfect squares
        key_prerequisites: [factoring-monic-trinomials, special-products]
        step_check:
          step: 'Since $289=17^2$ and $2(17)=34$'
          question: 'Why check that $2(17) = 34$ after finding $289 = 17^2$?'
          options:
            - 'It decides whether the binomial uses a plus or a minus sign'
            - 'A square constant is not enough; the middle term must be $2 \cdot 17x$'
            - 'It confirms that $17$ is a prime number'
          answer: 'A square constant is not enough; the middle term must be $2 \cdot 17x$'
          why: '$x^2 - 30x + 289$ also ends in $17^2$ but is not a perfect square; only $-34x$ matches $(x - 17)^2 = x^2 - 34x + 289$.'
        exemplars:
          - problem: 'Factor $x^2 + 10x + 25$.'
            answer: '(x + 5)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The constant is $25 = 5^2$ and the middle term is $10x = 2(x)(5)$. So the trinomial is $(x + 5)^2$.'
          - problem: 'Factor $x^2 - 12x + 36$.'
            answer: '(x - 6)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The constant is $36 = 6^2$ and the middle term is $-12x = -2(x)(6)$. So the trinomial is $(x - 6)^2$.'
          - problem: 'Sam factors $x^2 - 16x + 64$ as $(x + 8)^2$. What is the correct factorization?'
            answer: '(x - 8)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam''s square expands to $x^2 + 16x + 64$. The middle term is negative, so the binomial is $x - 8$ and the result is $(x - 8)^2$.'
          - problem: 'A square rug has area $x^2 - 8x + 16$ square feet, where $x > 4$. Find the length of one side.'
            answer: 'x - 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $x^2 - 2(x)(4) + 4^2 = (x - 4)^2$. The side is the square root of the area, so it is $x - 4$ feet.'
          - problem: 'Factor $y^2 + 14y + 49$.'
            answer: '(y + 7)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The constant is $49 = 7^2$ and the middle term is $14y = 2(y)(7)$. So the trinomial is $(y + 7)^2$.'
          - problem: 'A square picture of side $x$ inches has a frame of the same width all around it. The framed picture covers $x^2 + 6x + 9$ square inches. How wide is the frame?'
            answer: '1.5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"in","allow_omitted":true}
            solution_sketch: 'The area is $(x + 3)^2$, so the framed side is $x + 3$ inches. The frame adds its width on both sides, so the width is $3 \div 2 = 1.5$ inches.'
          - problem: 'Factor $x^2 - 20x + 100$.'
            answer: '(x - 10)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The constant is $100 = 10^2$ and the middle term is $-20x = -2(x)(10)$. So the trinomial is $(x - 10)^2$.'
          - problem: 'Factor $a^2 + 2a + 1$.'
            answer: '(a + 1)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The constant is $1 = 1^2$ and the middle term is $2a = 2(a)(1)$. So the trinomial is $(a + 1)^2$.'
        constraints: "constant is a perfect square; sign follows the middle term"
      - id: kp3
        name: Perfect squares with leading coefficients
        key_prerequisites: [special-products, square-roots]
        step_check:
          step: 'Twice their product is $2(4x)(3)=24x$'
          question: 'Why compare $2(4x)(3)$ with the middle term $24x$?'
          options:
            - 'In $(4x + 3)^2$ the two cross terms add up to $2(4x)(3)$'
            - 'The product $(4x)(3)$ alone must equal the middle term'
            - 'It shows that the leading coefficient $16$ is a square'
          answer: 'In $(4x + 3)^2$ the two cross terms add up to $2(4x)(3)$'
          why: '$(4x + 3)^2 = 16x^2 + 12x + 12x + 9$, so the cross terms give $24x$; any other middle term rules out a square.'
        exemplars:
          - problem: 'Factor $4x^2 - 12x + 9$.'
            answer: '(2x - 3)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The end terms are $(2x)^2$ and $3^2$, and $2(2x)(3) = 12x$ matches the middle term. The middle term is negative, so the result is $(2x - 3)^2$.'
          - problem: 'Factor $9x^2 + 30x + 25$.'
            answer: '(3x + 5)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The end terms are $(3x)^2$ and $5^2$, and $2(3x)(5) = 30x$ matches the middle term. So the result is $(3x + 5)^2$.'
          - problem: 'Sam factors $25x^2 + 20x + 4$ as $(5x + 4)^2$. What is the correct factorization?'
            answer: '(5x + 2)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam used $4$ instead of its square root. The end terms are $(5x)^2$ and $2^2$, and $2(5x)(2) = 20x$, so the result is $(5x + 2)^2$.'
          - problem: 'A square tablecloth has area $4x^2 + 20x + 25$ square feet. Find the length of one side.'
            answer: '2x + 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $(2x)^2 + 2(2x)(5) + 5^2 = (2x + 5)^2$. The side is the square root of the area, so it is $2x + 5$ feet.'
          - problem: 'Factor $16y^2 - 24y + 9$.'
            answer: '(4y - 3)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The end terms are $(4y)^2$ and $3^2$, and $2(4y)(3) = 24y$ matches the middle term. The middle term is negative, so the result is $(4y - 3)^2$.'
          - problem: 'A square courtyard has area $9x^2 - 42x + 49$ square metres, where $x > 3$. Find its perimeter.'
            answer: '12x - 28'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $(3x)^2 - 2(3x)(7) + 7^2 = (3x - 7)^2$, so each side is $3x - 7$ metres. The perimeter is $4(3x - 7) = 12x - 28$ metres.'
          - problem: 'Factor $49x^2 - 28x + 4$.'
            answer: '(7x - 2)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The end terms are $(7x)^2$ and $2^2$, and $2(7x)(2) = 28x$ matches the middle term. The middle term is negative, so the result is $(7x - 2)^2$.'
          - problem: 'Factor $2x^2 + 12x + 18$ completely.'
            answer: '2(x + 3)^2'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take out $2$ to get $2(x^2 + 6x + 9)$. The bracket is $(x + 3)^2$, since $9 = 3^2$ and $6x = 2(x)(3)$, so the result is $2(x + 3)^2$.'
        constraints: "both end terms perfect squares; verify 2ab"
    diagnostic_exemplar:
      problem: 'Factor $9x^2 - 24x + 16$.'
      answer: '(3x - 4)^2'
      solution_sketch: '$9x^2 = (3x)^2$, $16 = 4^2$, and $2(3x)(4) = 24x$.'
    anki_seeds:
      - front: "a^2 + 2ab + b^2 factors as..."
        back: "(a + b)^2"
        type: basic

  - id: sum-difference-of-cubes
    name: Factoring Sums and Differences of Cubes
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 120
