            answer_contract: {kind: multipart, parts: [{name: x, contract: {kind: exact}}, {name: y, contract: {kind: exact}}]}
            solution_sketch: 'Axis through the vertex; $(0-2)^2 - 1 = 3$.'
          - problem: 'Complete the output entry at $x=1$ in a table for the vertex-form graph $y=-(x+1)^2+4$.'
            answer: "0"
            answer_contract: {kind: exact}
            solution_sketch: '$-(2)^2 + 4 = 0$.'
          - problem: 'For $y=(x-1)^2+2$, a learner gives axis $x=-1$. Correct the axis and also give the ordinate at $x=3$.'
            answer: "x = 1; y = 6"
            answer_contract: {kind: multipart, parts: [{name: x, contract: {kind: exact}}, {name: y, contract: {kind: exact}}]}
