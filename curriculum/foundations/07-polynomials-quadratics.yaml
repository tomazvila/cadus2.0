      - id: completing-the-square
        weight: 0.4
        key: true
      - id: square-roots
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Irrational roots that need a simplified radical
        key_prerequisites: [simplifying-radicals, applying-the-quadratic-formula]
        exemplars:
          - problem: 'Solve $x^2 - 4x + 1 = 0$ using the quadratic formula.'
            answer: "x = 2 + √3 or x = 2 - √3"
            solution_sketch: 'disc $= 12$; $\sqrt{12} = 2\sqrt{3}$; $x = \frac{4 \pm 2\sqrt{3}}{2} = 2 \pm \sqrt{3}$.'
          - problem: 'Solve $x^2 + 6x + 4 = 0$ using the quadratic formula.'
            answer: "x = -3 + √5 or x = -3 - √5"
        constraints: "discriminant has a perfect-square factor; fraction reduces fully"
      - id: kp2
        name: Radical results over a denominator
        key_prerequisites: [simplifying-radicals, applying-the-quadratic-formula]
        exemplars:
          - problem: 'Solve $2x^2 + 4x - 3 = 0$ using the quadratic formula.'
            answer: "x = (-2 + √10)/2 or x = (-2 - √10)/2"
            solution_sketch: 'disc $= 40$; $\frac{-4 \pm 2\sqrt{10}}{4} = \frac{-2 \pm \sqrt{10}}{2}$.'
          - problem: 'Solve $3x^2 - 2x - 2 = 0$ using the quadratic formula.'
            answer: "x = (1 + √7)/3 or x = (1 - √7)/3"
            solution_sketch: 'disc $= 28$; $\frac{2 \pm 2\sqrt{7}}{6} = \frac{1 \pm \sqrt{7}}{3}$.'
        constraints: "cancel the common factor between numerator and denominator"
      - id: kp3
        name: Reduce fully and spot no-real-solution cases
        key_prerequisites: [simplifying-radicals, applying-the-quadratic-formula]
        exemplars:
          - problem: 'Solve $2x^2 + 6x + 3 = 0$ using the quadratic formula.'
            answer: "x = (-3 + √3)/2 or x = (-3 - √3)/2"
            solution_sketch: 'disc $= 12$; $\frac{-6 \pm 2\sqrt{3}}{4} = \frac{-3 \pm \sqrt{3}}{2}$.'
          - problem: 'How many real solutions does $x^2 + 2x + 5 = 0$ have?'
            answer: "0"
            solution_sketch: 'disc $= 4 - 20 = -16 < 0$.'
        constraints: "negative discriminant means no real roots; state it, do not invent decimals"
    diagnostic_exemplar:
      problem: 'Solve $2x^2 - 6x + 1 = 0$ using the quadratic formula.'
      answer: 'x = (3 + √7)/2 or x = (3 - √7)/2'
      solution_sketch: 'disc $= 36 - 8 = 28$; $x = \frac{6 \pm 2\sqrt{7}}{4} = \frac{3 \pm \sqrt{7}}{2}$.'
    anki_seeds:
      - front: "For ax^2 + bx + c = 0, x = (-b ± √({{c1::b^2 - 4ac}})) / (2a)."
        back: "b^2 - 4ac"
        type: cloze

  - id: discriminant
    name: The Discriminant
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: quadratic-formula
        weight: 0.6
        key: true
      - id: evaluating-expressions
        weight: 0.5
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Compute the discriminant b^2 - 4ac
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Find the discriminant of $x^2 + 3x + 2$.'
            answer: "1"
            solution_sketch: '$3^2 - 4(1)(2) = 9 - 8 = 1$.'
          - problem: 'Find the discriminant of $2x^2 - 4x + 5$.'
            answer: "-24"
        constraints: 'integer a, b, c with coefficients at most 6 in size; answer is the signed value of b^2 - 4ac'
      - id: kp2
        name: Determine the number and nature of real roots
        key_prerequisites: [quadratic-formula]
        exemplars:
          - problem: 'How many real solutions does $x^2 - 6x + 9 = 0$ have? Use the discriminant.'
            answer: "1"
            solution_sketch: 'disc $= 36 - 36 = 0$: exactly one repeated real root.'
          - problem: 'How many real solutions does $x^2 + x + 1 = 0$ have?'
            answer: "0"
            solution_sketch: 'disc $= 1 - 4 = -3 < 0$: no real roots.'
          - problem: 'How many real solutions does $x^2 - 5x + 2 = 0$ have?'
            answer: "2"
            solution_sketch: 'disc $= 25 - 8 = 17 > 0$: two distinct real roots.'
        constraints: 'answer is the count 0, 1, or 2; cover all three cases across problems'
    diagnostic_exemplar:
      problem: 'How many real solutions does $2x^2 + 3x + 4 = 0$ have? Use the discriminant.'
      answer: '0'
      solution_sketch: '$3^2 - 4(2)(4) = 9 - 32 = -23 < 0$, so there are no real solutions.'
    anki_seeds:
      - front: "What does the discriminant b^2 - 4ac tell you about the roots?"
        back: ">0 two real roots, =0 one repeated root, <0 no real roots."
        type: basic

