            answer: "direction = upward; extreme_value = -1"
            answer_contract: {kind: multipart, parts: [{name: direction, contract: {kind: label, options: [[upward], [downward]]}}, {name: extreme_value, contract: {kind: exact}}]}
            solution_sketch: '$a = 1 > 0$; the vertex $y$-value is the min.'
          - problem: 'A learner calls $-4$ a maximum for $y=3(x-2)^2-4$. Give the correct opening direction and extreme value.'
