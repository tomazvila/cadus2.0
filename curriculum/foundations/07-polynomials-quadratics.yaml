unit: polynomials-quadratics
course: foundations
module: "Polynomials & Quadratics"
topics:
  - id: polynomial-basics
    name: Polynomial Vocabulary and Standard Form
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: integer-exponents-intro
        weight: 0.5
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Degree and leading coefficient
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'State the degree and leading coefficient of $4x^3 - x + 7$.'
            answer: "degree = 3; leading_coefficient = 4"
            answer_contract: {kind: multipart, parts: [{name: degree, contract: {kind: exact}}, {name: leading_coefficient, contract: {kind: exact}}]}
            solution_sketch: 'The highest power present is $x^3$, with coefficient $4$.'
          - problem: 'State the degree of $5x^2 - 2x^4 + 1$.'
            answer: "4"
            solution_sketch: 'The highest power present is $x^4$.'
        constraints: "degree <= 5; integer coefficients"
      - id: kp2
        name: Classify by number of terms
        key_prerequisites: []
        exemplars:
          - problem: 'Classify $3x^2 - 5x$ as a monomial, binomial, or trinomial.'
            answer: "binomial"
            answer_contract: {kind: label, options: [["monomial"], ["binomial"], ["trinomial"]]}
            solution_sketch: 'Two terms separated by subtraction make a binomial.'
          - problem: 'Classify $x^2 + 2x + 1$ as a monomial, binomial, or trinomial.'
            answer: "trinomial"
            answer_contract: {kind: label, options: [["monomial"], ["binomial"], ["trinomial"]]}
            solution_sketch: 'Three terms separated by addition make a trinomial.'
        constraints: "one to three terms"
      - id: kp3
        name: Write polynomials in standard form
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Write $3 - x^2 + 5x$ in standard form.'
            answer: "-x^2 + 5x + 3"
          - problem: 'Simplify and write in standard form: $2x + x^3 + 4x - 1$.'
            answer: "x^3 + 6x - 1"
            solution_sketch: 'Combine $2x + 4x$; order by descending degree.'
        constraints: "descending powers; combine like terms first"
    diagnostic_exemplar:
      problem: 'State the degree and leading coefficient of $7 + 2x - 5x^3$.'
      answer_contract: {kind: multipart, parts: [{name: degree, contract: {kind: exact}}, {name: leading_coefficient, contract: {kind: exact}}]}
      answer: "degree = 3; leading_coefficient = -5"
      solution_sketch: 'Standard form is $-5x^3 + 2x + 7$.'
    anki_seeds:
      - front: "The degree of a polynomial in one variable is ..."
        back: "the largest exponent that appears on the variable"
        type: basic
      - front: "Monomial, binomial, trinomial = polynomials with ___ terms"
        back: "1, 2, 3"
        type: basic

  - id: evaluating-polynomials
    name: Evaluating Polynomials
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: evaluating-expressions
        weight: 0.8
        key: true
      - id: polynomial-basics
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Evaluate at positive integers
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Evaluate $x^2 + 3x - 2$ at $x = 2$.'
            answer: "8"
            solution_sketch: '$4 + 6 - 2 = 8$.'
          - problem: 'Evaluate $2x^3 - x$ at $x = 3$.'
            answer: "51"
            solution_sketch: '$54 - 3 = 51$.'
        constraints: "degree <= 3; small positive inputs"
      - id: kp2
        name: Evaluate at negative inputs
        key_prerequisites: [evaluating-expressions, integer-multiplication-division]
        exemplars:
          - problem: 'Evaluate $x^2 - 4x + 1$ at $x = -2$.'
            answer: "13"
            solution_sketch: '$(-2)^2 = 4$; $4 + 8 + 1 = 13$.'
          - problem: 'Evaluate $-x^2 + 5$ at $x = -3$.'
            answer: "-4"
            solution_sketch: '$-(9) + 5 = -4$.'
        constraints: "watch (-a)^2 vs -a^2"
      - id: kp3
        name: Evaluate formula-style polynomials
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'The height of a ball in metres is $h = -5t^2 + 20t$. Find $h$ at $t = 1$.'
            answer: "15"
            solution_sketch: '$-5 + 20 = 15$.'
          - problem: 'For $P = n^2 + 3n$, find $P$ at $n = 5$.'
            answer: "40"
        constraints: "single substitution; clean integer outputs"
    diagnostic_exemplar:
      problem: 'Evaluate $x^2 - 2x + 3$ at $x = -1$.'
      answer: "6"
      solution_sketch: '$1 + 2 + 3 = 6$.'
    anki_seeds:
      - front: "At x = -2, x^2 evaluates to ___ but -x^2 evaluates to ___"
        back: "4; -4 (the square applies before the leading minus)"
        type: basic

  - id: adding-polynomials
    name: Adding Polynomials
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: combining-like-terms
        weight: 0.9
        key: true
      - id: polynomial-basics
        weight: 0.4
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Add linear polynomials
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Add $(2x + 9) + (5x - 3)$.'
            answer: "7x + 6"
          - problem: 'Add $(4x - 7) + (x + 2)$.'
            answer: "5x - 5"
        constraints: "degree 1; integer coefficients"
      - id: kp2
        name: Add quadratics term by term
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Add $(3x^2 + 2x - 5) + (x^2 - 4x + 7)$.'
            answer: "4x^2 - 2x + 2"
            solution_sketch: '$3x^2 + x^2 = 4x^2$; $2x - 4x = -2x$; $-5 + 7 = 2$.'
          - problem: 'Add $(x^2 - 3x) + (2x^2 + x - 4)$.'
            answer: "3x^2 - 2x - 4"
        constraints: "degree 2; line up like terms"
      - id: kp3
        name: Add with missing terms
        key_prerequisites: [combining-like-terms, polynomial-basics]
        exemplars:
          - problem: 'Add $(x^3 + 2x - 1) + (x^2 - 2x + 4)$.'
            answer: "x^3 + x^2 + 3"
            solution_sketch: '$2x - 2x = 0$; no other like terms overlap.'
          - problem: 'Add $(2x^3 - x) + (x^3 + 5)$.'
            answer: "3x^3 - x + 5"
        constraints: "some powers absent; keep standard form"
    diagnostic_exemplar:
      problem: 'Add $(2x^3 + x - 5) + (x^2 - 3x + 2)$.'
      answer: '2x^3 + x^2 - 2x - 3'
      solution_sketch: 'Only the $x$ terms and the constants pair up: $x - 3x = -2x$ and $-5 + 2 = -3$.'
    anki_seeds:
      - front: "Like terms in polynomials have the same ..."
        back: "variable raised to the same power (only coefficients differ)"
        type: basic

  - id: polynomial-addition-subtraction
    name: Adding and Subtracting Polynomials
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: adding-polynomials
        weight: 0.8
        key: true
      - id: distributive-property
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
      - id: evaluating-expressions
        weight: 0.0            # conceptual-familiarity only (no implicit reps)
    knowledge_points:
      - id: kp1
        name: Subtract polynomials by distributing the negative
        key_prerequisites: [distributive-property]
        constraints: "subtraction distributes over every term of the second polynomial"
        exemplars:
          - problem: 'Subtract $(5x^2 - 3x + 4) - (2x^2 + x - 6)$.'
            answer: "3x^2 - 4x + 10"
            solution_sketch: 'Distribute the minus: $5x^2 - 2x^2 = 3x^2$; $-3x - x = -4x$; $4 - (-6) = 10$.'
          - problem: 'Subtract $(7x - 2) - (3x - 8)$.'
            answer: "4x + 6"
      - id: kp2
        name: Subtract with missing terms and cancellation
        key_prerequisites: [adding-polynomials, distributive-property]
        exemplars:
          - problem: 'Simplify $(x^3 + 2x - 1) - (x^3 - x^2 + 2x - 4)$.'
            answer: "x^2 + 3"
            solution_sketch: '$x^3$ cancels; $+x^2$; $2x - 2x = 0$; $-1 + 4 = 3$.'
          - problem: 'Simplify $(2x^2 + 5) - (x^2 + 3x)$.'
            answer: "x^2 - 3x + 5"
        constraints: 'some powers absent from one polynomial; terms may cancel completely; degree <= 3'
      - id: kp3
        name: Combine three polynomials
        key_prerequisites: [adding-polynomials]
        exemplars:
          - problem: 'Simplify $(4x^2 - 1) + (x^2 + 6x) - (2x^2 - 3)$.'
            answer: "3x^2 + 6x + 2"
          - problem: 'Simplify $(x^2 + 2x) + (3x^2 - x) - (2x^2 + 4)$.'
            answer: "2x^2 + x - 4"
        constraints: 'three polynomials, at least one subtracted; degree <= 2; answer in standard form'
    diagnostic_exemplar:
      problem: 'Simplify $(3x^2 + 5) + (x^2 - 2x) - (2x^2 + 3)$.'
      answer: '2x^2 - 2x + 2'
      solution_sketch: 'Distribute the minus: $3x^2 + 5 + x^2 - 2x - 2x^2 - 3$.'
    anki_seeds:
      - front: "When subtracting polynomials, the minus sign..."
        back: "distributes to every term of the polynomial being subtracted."
        type: basic
      - front: "When adding or subtracting polynomials, you may only combine..."
        back: "like terms (same variable and same exponent)."
        type: basic

  - id: multiplying-monomials-polynomials
    name: Multiplying a Monomial by a Polynomial
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: distributive-property
        weight: 0.9
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Monomial times a monomial
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Multiply $(3x^2)(5x^4)$.'
            answer: "15x^6"
            solution_sketch: '$3 \cdot 5 = 15$; $2 + 4 = 6$.'
          - problem: 'Multiply $(-2x)(4x^3)$.'
            answer: "-8x^4"
        constraints: "single-variable monomials; integer coefficients"
      - id: kp2
        name: Monomial times a binomial or trinomial
        key_prerequisites: [distributive-property, exponent-product-quotient-rules]
        exemplars:
          - problem: 'Expand $3x(2x^2 - 4x + 5)$.'
            answer: "6x^3 - 12x^2 + 15x"
            solution_sketch: 'Distribute $3x$ to each term.'
          - problem: 'Expand $2x(x + 7)$.'
            answer: "2x^2 + 14x"
        constraints: "positive monomial in front"
      - id: kp3
        name: Negative monomials
        key_prerequisites: [distributive-property, integer-multiplication-division]
        exemplars:
          - problem: 'Expand $-2x^2(x - 3)$.'
            answer: "-2x^3 + 6x^2"
            solution_sketch: 'Both products flip sign: $-2x^3$, $+6x^2$.'
          - problem: 'Expand $-4x(x^2 - 2x - 1)$.'
            answer: "-4x^3 + 8x^2 + 4x"
        constraints: "leading negative; track every sign"
    diagnostic_exemplar:
      problem: 'Expand $-3x(x^2 - 2x + 4)$.'
      answer: '-3x^3 + 6x^2 - 12x'
      solution_sketch: 'Distribute $-3x$ to each term, tracking every sign.'
    anki_seeds:
      - front: "Multiplying monomials: (ax^m)(bx^n) = ?"
        back: "(a*b) x^(m+n)"
        type: basic

  - id: multiplying-binomials
    name: Multiplying Binomials (FOIL)
    core: true
    difficulty: 0.48
    drill: true                # fluency / automaticity-drill topic
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: multiplying-monomials-polynomials
        weight: 0.8
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Monic binomials (x + a)(x + b)
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Expand $(x + 3)(x + 5)$.'
            answer: "x^2 + 8x + 15"
            solution_sketch: '$x^2 + 5x + 3x + 15 = x^2 + 8x + 15$.'
          - problem: 'Expand $(x - 4)(x + 6)$.'
            answer: "x^2 + 2x - 24"
        constraints: "leading coefficient 1; integer constants"
      - id: kp2
        name: One leading coefficient
        key_prerequisites: [multiplying-monomials-polynomials]
        exemplars:
          - problem: 'Expand $(2x - 1)(x + 4)$.'
            answer: "2x^2 + 7x - 4"
            solution_sketch: '$2x^2 + 8x - x - 4$.'
          - problem: 'Expand $(3x + 2)(x - 5)$.'
            answer: "3x^2 - 13x - 10"
        constraints: "one binomial has coefficient > 1"
      - id: kp3
        name: Both leading coefficients greater than 1
        key_prerequisites: [multiplying-monomials-polynomials, combining-like-terms]
        exemplars:
          - problem: 'Expand $(3x - 2)(2x + 5)$.'
            answer: "6x^2 + 11x - 10"
            solution_sketch: '$6x^2 + 15x - 4x - 10$.'
          - problem: 'Expand $(2x - 3)(2x - 1)$.'
            answer: "4x^2 - 8x + 3"
        constraints: "small coefficients; all four sign patterns"
    diagnostic_exemplar:
      problem: 'Expand $(2x + 3)(3x - 4)$.'
      answer: '6x^2 + x - 12'
      solution_sketch: '$6x^2 - 8x + 9x - 12$.'
    anki_seeds:
      - front: "What does FOIL stand for when multiplying two binomials?"
        back: "First, Outer, Inner, Last — the four products of (a+b)(c+d)."
        type: basic

  - id: polynomial-multiplication
    name: Multiplying Polynomials
    core: true
    difficulty: 0.5
    drill: false               # L4 audit: expansion is multi-step, not a 6s recall skill
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: multiplying-binomials
        weight: 0.8
        key: true
      - id: multiplying-monomials-polynomials
        weight: 0.6
        key: true
      - id: combining-like-terms
        weight: 0.5
      - id: polynomial-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Binomial times a trinomial
        key_prerequisites: [multiplying-binomials, multiplying-monomials-polynomials]
        exemplars:
          - problem: 'Expand $(x + 2)(x^2 - 3x + 1)$.'
            answer: "x^3 - x^2 - 5x + 2"
            solution_sketch: '$x(x^2 - 3x + 1) + 2(x^2 - 3x + 1)$, then combine.'
          - problem: 'Expand $(2x - 1)(x^2 + x - 3)$.'
            answer: "2x^3 + x^2 - 7x + 3"
        constraints: "six products, then combine like terms"
      - id: kp2
        name: Products of three factors
        key_prerequisites: [multiplying-binomials]
        exemplars:
          - problem: 'Expand $(x + 1)(x + 2)(x + 3)$.'
            answer: "x^3 + 6x^2 + 11x + 6"
            solution_sketch: '$(x+1)(x+2) = x^2 + 3x + 2$; multiply by $(x+3)$.'
          - problem: 'Expand $x(x - 2)(x + 5)$.'
            answer: "x^3 + 3x^2 - 10x"
            solution_sketch: '$(x-2)(x+5) = x^2 + 3x - 10$; distribute $x$.'
        constraints: "multiply two factors first, then the third"
      - id: kp3
        name: Larger products with many like terms
        key_prerequisites: [multiplying-binomials, combining-like-terms]
        exemplars:
          - problem: 'Expand $(x^2 + 2x - 1)(x^2 - x + 3)$.'
            answer: "x^4 + x^3 + 7x - 3"
            solution_sketch: 'Nine products; the $x^2$ terms cancel: $3 - 2 - 1 = 0$.'
          - problem: 'Expand $(x^2 + x + 1)(x^2 - x + 1)$.'
            answer: "x^4 + x^2 + 1"
        constraints: "trinomial times trinomial; watch cancellation"
    diagnostic_exemplar:
      problem: 'Expand $(x + 3)(x^2 - 2x + 4)$.'
      answer: "x^3 + x^2 - 2x + 12"
      solution_sketch: '$x^3 - 2x^2 + 4x + 3x^2 - 6x + 12$.'
    anki_seeds:
      - front: "Multiplying a binomial by a trinomial produces how many products before combining?"
        back: "6 (each of 2 terms times each of 3 terms)"
        type: basic

  - id: special-products
    name: Special Products of Binomials
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: multiplying-binomials
        weight: 0.8
        key: true
      - id: combining-like-terms
        weight: 0.4
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Square of a sum and of a difference
        key_prerequisites: [multiplying-binomials]
        exemplars:
          - problem: 'Expand $(x + 5)^2$.'
            answer: "x^2 + 10x + 25"
            solution_sketch: '$a^2 + 2ab + b^2$ with $a = x$, $b = 5$.'
          - problem: 'Expand $(x - 4)^2$.'
            answer: "x^2 - 8x + 16"
        constraints: "(a ± b)^2 = a^2 ± 2ab + b^2; never just a^2 + b^2"
      - id: kp2
        name: Product of conjugates
        key_prerequisites: [multiplying-binomials]
        exemplars:
          - problem: 'Expand $(x + 7)(x - 7)$.'
            answer: "x^2 - 49"
            solution_sketch: 'Middle terms cancel: $a^2 - b^2$.'
          - problem: 'Expand $(2x + 3)(2x - 3)$.'
            answer: "4x^2 - 9"
        constraints: "(a + b)(a - b) = a^2 - b^2"
      - id: kp3
        name: Special products with coefficients
        key_prerequisites: [multiplying-binomials]
        exemplars:
          - problem: 'Expand $(3x - 4)^2$.'
            answer: "9x^2 - 24x + 16"
            solution_sketch: '$(3x)^2 - 2(3x)(4) + 4^2$.'
          - problem: 'Expand $(2x + 5)^2$.'
            answer: "4x^2 + 20x + 25"
        constraints: "a = coefficient times x; compute 2ab carefully"
    diagnostic_exemplar:
      problem: 'Expand $(2x - 5)^2$.'
      answer: '4x^2 - 20x + 25'
      solution_sketch: '$(2x)^2 - 2(2x)(5) + 5^2$.'
    anki_seeds:
      - front: "(a + b)^2 = ?"
        back: "a^2 + 2ab + b^2"
        type: basic
      - front: "(a + b)(a - b) = ?"
        back: "a^2 - b^2"
        type: basic

  - id: binomial-cubes
    name: Cubing a Binomial
    core: false                # special-product extension, terminal
    difficulty: 0.60
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: special-products
        weight: 0.7
        key: true
      - id: polynomial-multiplication
        weight: 0.6
        key: true
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Expand (a + b)^3 by repeated multiplication
        key_prerequisites: [special-products, polynomial-multiplication]
        exemplars:
          - problem: 'Expand $(x + 5)^3$.'
            answer: "x^3 + 15x^2 + 75x + 125"
            solution_sketch: '$(x+5)^2 = x^2 + 10x + 25$; multiply by $(x+5)$.'
          - problem: 'Expand $(x + 1)^3$.'
            answer: "x^3 + 3x^2 + 3x + 1"
        constraints: "square first, then multiply by the remaining factor"
      - id: kp2
        name: Cubes of differences
        key_prerequisites: [special-products, polynomial-multiplication]
        exemplars:
          - problem: 'Expand $(x - 3)^3$.'
            answer: "x^3 - 9x^2 + 27x - 27"
            solution_sketch: 'Signs alternate: $+, -, +, -$.'
          - problem: 'Expand $(x - 2)^3$.'
            answer: "x^3 - 6x^2 + 12x - 8"
            solution_sketch: '$(x-2)^2 = x^2 - 4x + 4$; multiply by $(x-2)$.'
        constraints: "alternating signs in the expansion"
      - id: kp3
        name: Use the formula a^3 ± 3a^2b + 3ab^2 ± b^3
        key_prerequisites: [special-products]
        exemplars:
          - problem: 'Expand $(2x + 1)^3$ using the binomial-cube pattern.'
            answer: "8x^3 + 12x^2 + 6x + 1"
            solution_sketch: '$a = 2x$, $b = 1$: $8x^3 + 3(4x^2) + 3(2x) + 1$.'
          - problem: 'Expand $(x + 4)^3$ using the binomial-cube pattern.'
            answer: "x^3 + 12x^2 + 48x + 64"
        constraints: "coefficients 1-3-3-1 with powers stepping down"
    diagnostic_exemplar:
      problem: 'Expand $(2x - 1)^3$.'
      answer: '8x^3 - 12x^2 + 6x - 1'
      solution_sketch: 'Coefficients $1, 3, 3, 1$ with $a = 2x$ and $b = -1$.'
    anki_seeds:
      - front: "(a + b)^3 = ?"
        back: "a^3 + 3a^2 b + 3ab^2 + b^3"
        type: basic

  - id: dividing-polynomials-by-monomials
    name: Dividing a Polynomial by a Monomial
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: exponent-product-quotient-rules
        weight: 0.7
        key: true
      - id: multiplying-monomials-polynomials
        weight: 0.5
        key: true
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Divide each term by the monomial
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Divide $\frac{6x^3 - 9x^2 + 3x}{3x}$.'
            answer: "2x^2 - 3x + 1"
            solution_sketch: 'Divide each term by $3x$.'
          - problem: 'Divide $\frac{8x^4 + 4x^2}{4x^2}$.'
            answer: "2x^2 + 1"
        constraints: "every term divisible; positive coefficients on the divisor"
      - id: kp2
        name: Negative coefficients and signs
        key_prerequisites: [exponent-product-quotient-rules, integer-multiplication-division]
        exemplars:
          - problem: 'Divide $\frac{-10x^3 + 5x^2}{5x}$.'
            answer: "-2x^2 + x"
            solution_sketch: '$-10/5 = -2$; $5/5 = 1$.'
          - problem: 'Divide $\frac{12x^5 - 8x^3}{-4x^2}$.'
            answer: "-3x^3 + 2x"
        constraints: "track the sign of each quotient term"
      - id: kp3
        name: Two variables
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Divide $\frac{9x^2y^3 + 6xy^2}{3xy}$.'
            answer: "3xy^2 + 2y"
            solution_sketch: 'Divide coefficients and subtract exponents per variable.'
          - problem: 'Divide $\frac{4a^3b - 2a^2b^2}{2a^2b}$.'
            answer: "2a - b"
        constraints: "each variable handled separately"
    diagnostic_exemplar:
      problem: 'Divide $\frac{9x^3y^2 - 6x^2y}{-3x^2y}$.'
      answer: '-3xy + 2'
      solution_sketch: '$\frac{9x^3y^2}{-3x^2y} = -3xy$ and $\frac{-6x^2y}{-3x^2y} = 2$.'
    anki_seeds:
      - front: "To divide a polynomial by a monomial ..."
        back: "divide every term of the polynomial by the monomial"
        type: basic

  - id: polynomial-division
    name: Dividing Polynomials
    core: true                 # promoted: prerequisite of calculus-2 core topics (partial fractions)
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: dividing-polynomials-by-monomials
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.6
        key: true
      - id: polynomial-addition-subtraction
        weight: 0.6
        key: true
      - id: distributive-property
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Long division with no remainder
        key_prerequisites: [polynomial-multiplication]
        exemplars:
          - problem: 'Divide $\frac{x^2 + 5x + 6}{x + 2}$.'
            answer: "x + 3"
            solution_sketch: '$(x+2)(x+3) = x^2 + 5x + 6$.'
          - problem: 'Divide $\frac{x^2 - 7x + 12}{x - 3}$.'
            answer: "x - 4"
        constraints: "quadratic over linear; exact division"
      - id: kp2
        name: Long division with a remainder
        key_prerequisites: [polynomial-multiplication, polynomial-addition-subtraction]
        exemplars:
          - problem: 'Divide $\frac{x^2 + 3x + 5}{x + 1}$. Give quotient and remainder.'
            answer: "x + 2 remainder 3"
            solution_sketch: '$(x+1)(x+2) = x^2 + 3x + 2$; $5 - 2 = 3$ remainder.'
          - problem: 'Divide $\frac{2x^2 - x - 1}{x - 2}$.'
            answer: "2x + 3 remainder 5"
        constraints: "state quotient and remainder separately"
      - id: kp3
        name: Missing terms in the dividend
        key_prerequisites: [polynomial-multiplication, polynomial-addition-subtraction]
        exemplars:
          - problem: 'Divide $\frac{x^3 - 8}{x - 2}$.'
            answer: "x^2 + 2x + 4"
            solution_sketch: 'Insert $0x^2 + 0x$ placeholders before dividing.'
          - problem: 'Divide $\frac{x^3 + 1}{x + 1}$.'
            answer: "x^2 - x + 1"
        constraints: "write 0-coefficient placeholders for absent powers"
    diagnostic_exemplar:
      problem: 'Divide $\frac{x^3 + 5}{x - 1}$. Give quotient and remainder.'
      answer: "x^2 + x + 1 remainder 6"
      solution_sketch: 'Restore the missing terms as $x^3 + 0x^2 + 0x + 5$; synthetic division by $c = 1$ gives the row $1, 1, 1$ with remainder $6$.'
    anki_seeds:
      - front: "Before polynomial long division, rewrite the dividend with..."
        back: "0-coefficient placeholders for any missing powers."
        type: basic
      - front: "Check for polynomial division: dividend = ?"
        back: "divisor × quotient + remainder"
        type: basic

  - id: synthetic-division
    name: Synthetic Division
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: polynomial-division
        weight: 0.8
        key: true
      - id: evaluating-polynomials
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Synthetic division by x - c
        key_prerequisites: [polynomial-division]
        exemplars:
          - problem: 'Use synthetic division to divide $x^2 + 5x + 6$ by $x + 2$.'
            answer: "x + 3"
            solution_sketch: '$c = -2$; row $1, 5, 6$ gives $1, 3, 0$.'
          - problem: 'Use synthetic division to divide $x^3 - 6x^2 + 11x - 6$ by $x - 1$.'
            answer: "x^2 - 5x + 6"
            solution_sketch: '$c = 1$; $1, -5, 6, 0$.'
        constraints: "linear divisor with leading coefficient 1; remainder 0"
      - id: kp2
        name: Read off the remainder
        key_prerequisites: [polynomial-division]
        exemplars:
          - problem: 'Use synthetic division to divide $x^2 + 3x + 5$ by $x + 1$. Give quotient and remainder.'
            answer: "x + 2 remainder 3"
            solution_sketch: '$c = -1$; $1, 2, 3$.'
          - problem: 'Use synthetic division to divide $2x^3 - 3x + 1$ by $x - 2$. Give quotient and remainder.'
            answer: "2x^2 + 4x + 5 remainder 11"
            solution_sketch: 'Insert $0$ for the missing $x^2$: $2, 4, 5, 11$.'
        constraints: "include 0 placeholders for missing powers"
      - id: kp3
        name: The remainder theorem
        key_prerequisites: [evaluating-polynomials, polynomial-division]
        exemplars:
          - problem: 'Without dividing, find the remainder when $x^2 - 4x + 7$ is divided by $x - 3$.'
            answer: "4"
            solution_sketch: '$p(3) = 9 - 12 + 7 = 4$.'
          - problem: 'Without dividing, find the remainder when $x^3 - 2x^2 + x - 5$ is divided by $x - 2$.'
            answer: "-3"
            solution_sketch: '$p(2) = 8 - 8 + 2 - 5 = -3$.'
        constraints: "remainder on division by x - c equals p(c)"
    diagnostic_exemplar:
      problem: 'Use synthetic division to divide $x^3 - 4x + 6$ by $x + 2$. Give quotient and remainder.'
      answer: 'x^2 - 2x remainder 6'
      solution_sketch: '$c = -2$; the row $1, 0, -4, 6$ gives $1, -2, 0$ with remainder $6$.'
    anki_seeds:
      - front: "Remainder theorem: dividing p(x) by (x - c) leaves remainder ..."
        back: "p(c)"
        type: basic
      - front: "Synthetic division works only when the divisor has the form ..."
        back: "x - c (linear, leading coefficient 1)"
        type: basic

  - id: gcf-of-monomials
    name: GCF of Monomials
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: gcf-lcm
        weight: 0.8
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.5
        key: true
      - id: prime-factorization
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: GCF of coefficients
        key_prerequisites: [gcf-lcm]
        exemplars:
          - problem: 'Find the GCF of $28$ and $42$.'
            answer: "14"
            solution_sketch: '$28 = 2^2 \cdot 7$, $42 = 2 \cdot 3 \cdot 7$; take $2 \cdot 7$.'
          - problem: 'Find the GCF of $18$ and $45$.'
            answer: "9"
        constraints: "two-digit integers"
      - id: kp2
        name: GCF of one-variable monomials
        key_prerequisites: [gcf-lcm, exponent-product-quotient-rules]
        exemplars:
          - problem: 'Find the GCF of $12x^3$ and $18x^2$.'
            answer: "6x^2"
            solution_sketch: '$\text{GCF}(12, 18) = 6$; lowest power of $x$ is $x^2$.'
          - problem: 'Find the GCF of $8x^2$ and $20x$.'
            answer: "4x"
        constraints: "take the lowest power of the shared variable"
      - id: kp3
        name: GCF with two variables or three monomials
        key_prerequisites: [gcf-lcm, exponent-product-quotient-rules]
        exemplars:
          - problem: 'Find the GCF of $12x^2y^3$ and $18xy^4$.'
            answer: "6xy^3"
            solution_sketch: 'Coefficient GCF $6$; lowest powers $x$ and $y^3$.'
          - problem: 'Find the GCF of $6x^3$, $9x^2$, and $12x$.'
            answer: "3x"
        constraints: "lowest power of each shared variable"
    diagnostic_exemplar:
      problem: 'Find the GCF of $12x^3y^2$ and $18x^2y^4$.'
      answer: '6x^2 y^2'
      solution_sketch: 'GCF$(12, 18) = 6$; take the lowest power of each variable, $x^2$ and $y^2$.'
    anki_seeds:
      - front: "The GCF of two monomials takes the ___ power of each shared variable."
        back: "lowest"
        type: basic

  - id: factoring-gcf
    name: Factoring Out the Greatest Common Factor
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: gcf-of-monomials
        weight: 0.8
        key: true
      - id: distributive-property
        weight: 1.0
        key: true
      - id: polynomial-multiplication
        weight: 0.3
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Factor the GCF out of a polynomial
        key_prerequisites: [distributive-property, gcf-of-monomials]
        exemplars:
          - problem: 'Factor $6x^2 + 9x$.'
            answer: "3x(2x + 3)"
            solution_sketch: 'GCF is $3x$; $\frac{6x^2}{3x} = 2x$, $\frac{9x}{3x} = 3$.'
          - problem: 'Factor $10x^3 - 15x^2 + 5x$.'
            answer: "5x(2x^2 - 3x + 1)"
        constraints: "verify by redistributing"
      - id: kp2
        name: Factor out a negative or higher-power GCF
        key_prerequisites: [integer-multiplication-division, gcf-of-monomials]
        exemplars:
          - problem: 'Factor $-4x^2 - 8x$.'
            answer: "-4x(x + 2)"
            solution_sketch: 'Factor out $-4x$ so the leading sign is positive inside.'
          - problem: 'Factor $14x^4 + 21x^3 - 7x^2$.'
            answer: "7x^2(2x^2 + 3x - 1)"
        constraints: "watch the leftover 1 when a term equals the GCF"
      - id: kp3
        name: Factor out a common binomial
        key_prerequisites: [distributive-property]
        exemplars:
          - problem: 'Factor $3x(x + 2) + 5(x + 2)$.'
            answer: "(x + 2)(3x + 5)"
            solution_sketch: 'The binomial $(x + 2)$ is the common factor.'
          - problem: 'Factor $x(x - 4) + 3(x - 4)$.'
            answer: "(x - 4)(x + 3)"
        constraints: "common factor is a binomial; sets up factoring by grouping"
    diagnostic_exemplar:
      problem: 'Factor completely: $4x(x + 1) - 8(x + 1)$.'
      answer: '4(x + 1)(x - 2)'
      solution_sketch: 'Pull out $(x + 1)$: $(x + 1)(4x - 8)$, then factor $4$ from the second bracket.'
    anki_seeds:
      - front: "The first step of any factoring problem:"
        back: "factor out the greatest common factor (GCF); verify by redistributing."
        type: basic
      - front: "If a polynomial's leading term is negative, factor out..."
        back: "a negative GCF, so the leading term inside the parentheses is positive."
        type: basic
      - front: "When a term equals the GCF itself, the factored form keeps..."
        back: "a 1 in its place (e.g. 5x² + 5x = 5x(x + 1))."
        type: basic

  - id: factoring-by-grouping
    name: Factoring by Grouping
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: factoring-gcf
        weight: 0.8
        key: true
      - id: distributive-property
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Group four-term polynomials
        key_prerequisites: [factoring-gcf]
        exemplars:
          - problem: 'Factor $x^3 + 2x^2 + 3x + 6$.'
            answer: "(x + 2)(x^2 + 3)"
            solution_sketch: '$x^2(x+2) + 3(x+2) = (x+2)(x^2+3)$.'
          - problem: 'Factor $x^3 - 4x^2 + 2x - 8$.'
            answer: "(x - 4)(x^2 + 2)"
        constraints: 'four terms with leading coefficient 1; group the first two and the last two; integer coefficients'
      - id: kp2
        name: Grouping with a common binomial factor
        key_prerequisites: [factoring-gcf, distributive-property]
        exemplars:
          - problem: 'Factor $6x^2 + 3x + 4x + 2$.'
            answer: "(2x + 1)(3x + 2)"
            solution_sketch: '$3x(2x+1) + 2(2x+1) = (2x+1)(3x+2)$.'
          - problem: 'Factor $2x^3 - x^2 - 6x + 3$.'
            answer: "(2x - 1)(x^2 - 3)"
        constraints: 'leading coefficient may exceed 1; both groups must leave the same binomial factor'
    diagnostic_exemplar:
      problem: 'Factor $2x^3 + 3x^2 - 10x - 15$.'
      answer: '(2x + 3)(x^2 - 5)'
      solution_sketch: '$x^2(2x + 3) - 5(2x + 3)$.'
    anki_seeds:
      - front: "To factor a four-term polynomial by grouping..."
        back: "factor a GCF from each pair of terms, then factor out the common binomial."
        type: basic
      - front: "Grouping has worked when..."
        back: "both groups leave the same binomial factor; if not, regroup or factor out a negative."
        type: basic

  - id: factoring-monic-trinomials
    name: Factoring Monic Trinomials
    core: true
