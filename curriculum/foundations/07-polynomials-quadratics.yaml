      - id: factoring-monic-trinomials
        weight: 0.5
        key: true
      - id: square-roots
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Recognize the pattern a^2 ± 2ab + b^2
        key_prerequisites: [special-products, square-roots]
        exemplars:
          - problem: 'The trinomial $x^2 + 6x + 9$ is a perfect square. Factor it.'
            answer: "(x + 3)^2"
            solution_sketch: '$9 = 3^2$ and $6x = 2 \cdot 3 \cdot x$, so it is $(x + 3)^2$.'
          - problem: 'Is $x^2 + 5x + 25$ a perfect square trinomial?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The middle term would need to be $2 \cdot 5x = 10x$.'
        constraints: "check the middle term against 2ab"
      - id: kp2
        name: Factor monic perfect squares
        key_prerequisites: [factoring-monic-trinomials, special-products]
        exemplars:
          - problem: 'Factor $x^2 + 10x + 25$.'
            answer: "(x + 5)^2"
          - problem: 'Factor $x^2 - 12x + 36$.'
            answer: "(x - 6)^2"
            solution_sketch: 'Minus middle term means $(x - b)^2$.'
        constraints: "constant is a perfect square; sign follows the middle term"
      - id: kp3
        name: Perfect squares with leading coefficients
        key_prerequisites: [special-products, square-roots]
        exemplars:
          - problem: 'Factor $4x^2 - 12x + 9$.'
            answer: "(2x - 3)^2"
            solution_sketch: '$(2x)^2$, $3^2$, and $12x = 2 \cdot 2x \cdot 3$.'
          - problem: 'Factor $9x^2 + 30x + 25$.'
            answer: "(3x + 5)^2"
        constraints: "both end terms perfect squares; verify 2ab"
    diagnostic_exemplar:
      problem: 'Factor $9x^2 - 24x + 16$.'
      answer: '(3x - 4)^2'
      solution_sketch: '$9x^2 = (3x)^2$, $16 = 4^2$, and $2(3x)(4) = 24x$.'
    anki_seeds:
      - front: "a^2 + 2ab + b^2 factors as..."
        back: "(a + b)^2"
        type: basic

  - id: sum-difference-of-cubes
    name: Factoring Sums and Differences of Cubes
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: difference-of-squares
        weight: 0.5
        key: true
      - id: polynomial-multiplication
        weight: 0.6
        key: true
      - id: cube-roots
        weight: 0.5
        key: true
