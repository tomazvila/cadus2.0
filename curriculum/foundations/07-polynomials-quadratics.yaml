            solution_sketch: 'The coefficient $a = -2$ is negative, so the parabola opens downward. The vertex output $3$ is then the maximum value.'
          - problem: 'What is the smallest value of $y = 3(x - 2)^2 - 4$?'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A square is never negative, so $3(x - 2)^2 \ge 0$ and $y \ge -4$. The value $-4$ is reached at $x = 2$.'
          - problem: 'A diver''s height above the water in metres is $h = -4(t - 0.5)^2 + 11$, where $t$ is the time in seconds after leaving the board. What is the greatest height of the diver?'
            answer: '11'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The term $-4(t - 0.5)^2$ is never positive, so $h \le 11$. The greatest height is $11$ m, reached at $t = 0.5$ s.'
          - problem: 'Sam says that $y = (x - 3)^2 + 5$ has a maximum value of $5$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, he is", "he is", "right", "it is"], ["no", "no, he is not", "he is not", "wrong", "it is not", "not right"]]}
            solution_sketch: 'The coefficient of the square is $1$, which is positive, so the parabola opens upward. Then $5$ is the minimum value, not the maximum, and Sam is wrong.'
          - problem: 'What is the largest value of $y = -(x + 5)^2 + 2$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The term $-(x + 5)^2$ is never positive, so $y \le 2$. The value $2$ is reached at $x = -5$.'
          - problem: 'A bakery''s daily profit in dollars from selling $x$ cakes is $P = -2(x - 30)^2 + 450$. What is the greatest daily profit?'
            answer: '450'
            answer_contract: {"kind": "unit", "quantity": "dollar", "unit": "dollar", "allow_omitted": true}
            solution_sketch: 'The term $-2(x - 30)^2$ is never positive, so $P \le 450$. The greatest profit is $450$ dollars, reached when $x = 30$ cakes.'
          - problem: 'The cost in thousands of dollars of making $x$ hundred chairs is $C = 2(x - 6)^2 + 40$. How many chairs should be made to give the lowest cost?'
            answer: '600'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The square is smallest when $x - 6 = 0$, so $x = 6$. Since $x$ counts hundreds of chairs, the lowest cost is at $600$ chairs.'
        constraints: "sign of a decides direction; k is the extreme value"
      - id: kp3
        name: Axis of symmetry and points on the graph
        key_prerequisites: [evaluating-polynomials, coordinate-plane]
        exemplars:
          - problem: 'What is the axis of symmetry of $y = (x + 3)^2 - 1$?'
            answer: 'x = -3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The axis of symmetry is the vertical line through the vertex. The bracket $x + 3$ is zero at $x = -3$, so the axis is $x = -3$.'
          - problem: 'Find $y$ when $x = 1$ on the graph of $y = -(x + 1)^2 + 4$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $x = 1$ to get $-(1 + 1)^2 + 4 = -4 + 4 = 0$. So the point $(1, 0)$ lies on the parabola.'
          - problem: 'Sam says the axis of symmetry of $y = (x - 1)^2 + 2$ is $x = -1$. What is the correct axis?'
            answer: 'x = 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bracket $x - 1$ is zero at $x = 1$, not at $x = -1$. So the axis of symmetry is $x = 1$.'
          - problem: 'The point $(0, 1)$ lies on the parabola $y = -(x - 2)^2 + 5$. Use symmetry to find the other point of the parabola with $y = 1$.'
            answer: '(4, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The axis is $x = 2$, and $x = 0$ is $2$ units to its left. The mirror point is $2$ units to its right, at $x = 4$, so the point is $(4, 1)$.'
          - problem: 'An arch is modelled by $y = -0.25(x - 6)^2 + 9$, where $x$ is the distance in metres along the ground from the left foot and $y$ is the height in metres. How high is the arch $2$ m from the left foot?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Substitute $x = 2$ to get $-0.25(2 - 6)^2 + 9 = -0.25 \cdot 16 + 9 = -4 + 9 = 5$. So the arch is $5$ m high there.'
          - problem: 'A ball''s height in metres is $h = -5(t - 3)^2 + 45$ after $t$ seconds. At $t = 1$ s the ball is $25$ m high. At what other time is it $25$ m high?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'The axis of symmetry is $t = 3$. The time $t = 1$ is $2$ s before it, so the ball is at the same height $2$ s after it, at $t = 5$.'
          - problem: 'Find $y$ when $x = -1$ on the graph of $y = -2(x - 3)^2 + 8$.'
            answer: '-24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Substitute $x = -1$ into the equation. Then $-2(-1 - 3)^2 + 8 = -2 \cdot 16 + 8 = -32 + 8 = -24$.'
          - problem: 'The parabola $y = (x - 4)^2 - 9$ crosses the $x$-axis at $x = 1$. At which other value of $x$ does it cross the $x$-axis?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The axis of symmetry is $x = 4$, and $x = 1$ is $3$ units to its left. The other crossing is $3$ units to its right, at $x = 7$.'
        constraints: "evaluate one or two points besides the vertex"
    diagnostic_exemplar:
      problem: 'Does $y = -3(x + 2)^2 + 5$ open upward or downward, and what is its maximum or minimum value?'
      answer_contract: {"kind": "multipart", "parts": [{"name": "direction", "contract": {"kind": "label", "options": [["upward", "up", "upwards", "opens upward", "it opens upward"], ["downward", "down", "downwards", "opens downward", "it opens downward"]]}}, {"name": "maximum", "contract": {"kind": "exact"}}]}
      answer: "direction = downward; maximum = 5"
      solution_sketch: '$a = -3 < 0$, so it opens downward and the vertex value $5$ is the maximum.'
