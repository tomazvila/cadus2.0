unit: polynomials-quadratics
course: foundations
module: "Polynomials & Quadratics"
topics:
  - id: polynomial-basics
    name: Polynomial Vocabulary and Standard Form
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: integer-exponents-intro
        weight: 0.5
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Degree and leading coefficient
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'State the degree and leading coefficient of $4x^3 - x + 7$.'
            answer: "degree = 3; leading_coefficient = 4"
            answer_contract: {kind: multipart, parts: [{name: degree, contract: {kind: exact}}, {name: leading_coefficient, contract: {kind: exact}}]}
            solution_sketch: 'The highest power present is $x^3$, with coefficient $4$.'
          - problem: 'State the degree of $5x^2 - 2x^4 + 1$.'
            answer: "4"
            solution_sketch: 'The highest power present is $x^4$.'
          - problem: 'A coefficient table lists powers $5,2,1$ with coefficients $6,-3,1$. State the degree and leading coefficient.'
            answer: "degree = 5; leading_coefficient = 6"
            answer_contract: {kind: multipart, parts: [{name: degree, contract: {kind: exact}}, {name: leading_coefficient, contract: {kind: exact}}]}
            solution_sketch: 'The highest power present is $x^5$, with coefficient $6$.'
          - problem: 'After simplifying $3x^5-2x^4+7x^3-3x^5-1$, state the degree and leading coefficient.'
            answer: "degree = 4; leading_coefficient = -2"
            answer_contract: {kind: multipart, parts: [{name: degree, contract: {kind: exact}}, {name: leading_coefficient, contract: {kind: exact}}]}
            solution_sketch: 'The two $x^5$ terms cancel. The highest remaining term is $-2x^4$, so the degree is $4$ and its coefficient is $-2$.'
        constraints: "degree <= 5; integer coefficients"
      - id: kp2
        name: Classify by number of terms
        key_prerequisites: []
        exemplars:
          - problem: "Select the classification of 9x^2 - 4x by number of terms."
            answer: "binomial"
            answer_contract: {"kind": "label", "options": [["monomial"], ["binomial"], ["trinomial"], ["quadrinomial"]]}
            solution_sketch: "The full polynomial is 9x^2 - 4x. Step 1 uses the definition of a term: the nonzero terms are 9x^2 and -4x. Step 2 uses the term-count naming rule: two terms make a binomial. The wrong option monomial comes from counting only the leading term; trinomial comes from treating the subtraction sign as a separate term; quadrinomial comes from counting the coefficient and the power as separate terms. The answer is binomial."
          - problem: "After combining like terms in x^2 + 7x - 2x + 4, state the number of terms in the combined result."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full expression is x^2 + 7x - 2x + 4. Step 1 uses combining like terms: 7x - 2x = 5x, so the expression becomes x^2 + 5x + 4. Step 2 uses the term-count rule: the nonzero terms are x^2, 5x, and 4, so there are three terms. The number of terms is 3."
          - problem: "An algebra-tile model contains six positive x^5 pieces and no other pieces. State the number of terms in its polynomial."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full polynomial is 6x^5. Step 1 uses like-term grouping: all six x^5 pieces form one term. Step 2 uses the term-count rule: a single nonzero term means the polynomial has one term. The number of terms is 1."
          - problem: "A coefficient table has nonzero entries 4, -7, 2 at powers 3, 1, 0. Select the classification of the polynomial by number of terms."
            answer: "trinomial"
            answer_contract: {"kind": "label", "options": [["monomial"], ["binomial"], ["trinomial"], ["quadrinomial"]]}
            solution_sketch: "The full polynomial is 4x^3 - 7x + 2. Step 1 uses the definition of a term: the nonzero terms are 4x^3, -7x, and 2. Step 2 uses the term-count naming rule: three terms make a trinomial. The wrong option monomial comes from counting only the leading term; binomial comes from missing the constant term; quadrinomial comes from counting coefficients as extra terms. The answer is trinomial."
        constraints: "one to three terms"
      - id: kp3
        name: Write polynomials in standard form
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Write $3 - x^2 + 5x$ in standard form.'
            answer: "-x^2 + 5x + 3"
            solution_sketch: 'Descending order is $-x^2 + 5x + 3$; no like terms to combine.'
          - problem: 'Simplify and write in standard form: $2x + x^3 + 4x - 1$.'
            answer: "x^3 + 6x - 1"
            solution_sketch: 'Combine $2x + 4x$; order by descending degree.'
          - problem: 'An algebra-tile inventory contains five positive square tiles, three positive $x$ tiles, and seven negative unit tiles. Write its polynomial in descending powers.'
            answer: "5x^2 + 3x - 7"
            solution_sketch: 'The tile groups represent $5x^2$, $3x$, and $-7$; descending powers are $2,1,0$.'
          - problem: 'A coefficient list gives the constant $5$, the $x$ coefficient $2$, and two cubic contributions $-1$ and $-3$. Write the polynomial in standard form.'
            answer: "-4x^3 + 2x + 5"
            solution_sketch: 'The cubic contributions add to $-4$; the coefficient of $x^2$ is zero. Descending order gives $-4x^3+2x+5$.'
        constraints: "descending powers; combine like terms first"
    diagnostic_exemplar:
      problem: 'State the degree and leading coefficient of $7 + 2x - 5x^3$.'
      answer_contract: {kind: multipart, parts: [{name: degree, contract: {kind: exact}}, {name: leading_coefficient, contract: {kind: exact}}]}
      answer: "degree = 3; leading_coefficient = -5"
      solution_sketch: 'Standard form is $-5x^3 + 2x + 7$.'
    anki_seeds:
      - front: "The degree of a polynomial in one variable is ..."
        back: "the largest exponent that appears on the variable"
        type: basic
      - front: "Monomial, binomial, trinomial = polynomials with ___ terms"
        back: "1, 2, 3"
        type: basic

  - id: evaluating-polynomials
    name: Evaluating Polynomials
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: evaluating-expressions
        weight: 0.8
        key: true
      - id: polynomial-basics
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Evaluate at positive integers
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Evaluate $x^2 + 3x - 2$ at $x = 2$.'
            answer: "8"
            solution_sketch: '$4 + 6 - 2 = 8$.'
          - problem: 'Use Horner form $p(x)=x(2x^2-1)$ to find $p(3)$.'
            answer: "51"
            solution_sketch: 'Work inside out: $2(3)^2-1=17$, then $3(17)=51$.'
          - problem: 'Complete the output entry for input $3$ in the function table for $p(x)=x^2-5x+4$.'
            answer: "-2"
            solution_sketch: '$9 - 15 + 4 = -2$.'
          - problem: 'A machine maps a positive integer $x$ to $3x^2+x-1$. What output corresponds to input $4$?'
            answer: "51"
            solution_sketch: '$48 + 4 - 1 = 51$.'
        constraints: "degree <= 3; small positive inputs"
      - id: kp2
        name: Evaluate at negative inputs
        key_prerequisites: [evaluating-expressions, integer-multiplication-division]
        exemplars:
          - problem: 'Evaluate $x^2 - 4x + 1$ at $x = -2$.'
            answer: "13"
            solution_sketch: '$(-2)^2 = 4$; $4 + 8 + 1 = 13$.'
          - problem: 'A student obtains $14$ for $p(-3)$ when $p(x)=-x^2+5$ by squaring the minus sign with the input. Give the correct output.'
            answer: "-4"
            solution_sketch: 'Only the input is squared: $-(-3)^2+5=-9+5=-4$.'
          - problem: 'Complete the output entry at input $-4$ in a table for $p(x)=x(x+3)-5$.'
            answer: "-1"
            solution_sketch: 'Horner form gives $(-4)(-4+3)-5=4-5=-1$.'
          - problem: 'For the even polynomial $p(x)=-2x^2+3$, the table gives $p(2)=-5$. Find $p(-2)$ using symmetry.'
            answer: "-5"
            solution_sketch: 'An even power has the same value at opposite inputs. Substituting $-2$ therefore gives the stated table value, $-5$.'
        constraints: "watch (-a)^2 vs -a^2"
      - id: kp3
        name: Evaluate formula-style polynomials
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'The height of a ball in metres is $h = -5t^2 + 20t$. Find $h$ at $t = 1$.'
            answer: "15"
            solution_sketch: '$-5 + 20 = 15$.'
          - problem: 'For $P = n^2 + 3n$, find $P$ at $n = 5$.'
            answer: "40"
            solution_sketch: '$25 + 15 = 40$.'
          - problem: 'The area of a square garden in square metres is $A = s^2$. Find $A$ at $s = 6$.'
            answer: '36'
            solution_sketch: '$6^2 = 36$.'
          - problem: 'For $C = 2n^2 - n$, find $C$ at $n = 4$.'
            answer: "28"
            solution_sketch: '$2(16) - 4 = 28$.'
        constraints: "single substitution; clean integer outputs"
    diagnostic_exemplar:
      problem: 'Evaluate $x^2 - 2x + 3$ at $x = -1$.'
      answer: "6"
      solution_sketch: '$1 + 2 + 3 = 6$.'
    anki_seeds:
      - front: "At x = -2, x^2 evaluates to ___ but -x^2 evaluates to ___"
        back: "4; -4 (the square applies before the leading minus)"
        type: basic

  - id: adding-polynomials
    name: Adding Polynomials
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: combining-like-terms
        weight: 0.9
        key: true
      - id: polynomial-basics
        weight: 0.4
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Add linear polynomials
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Add $(2x + 9) + (5x - 3)$.'
            answer: "7x + 6"
            solution_sketch: '$2x + 5x = 7x$; $9 - 3 = 6$.'
          - problem: 'Two consecutive path sections have lengths $4x-7$ and $x+2$, with $x>2$. Write their total length in standard form.'
            answer: "5x - 5"
            solution_sketch: '$4x + x = 5x$; $-7 + 2 = -5$.'
          - problem: 'Add coefficient rows $(3,4)$ and $(2,-10)$, ordered as $(x,1)$. Write the resulting linear polynomial.'
            answer: "5x - 6"
            solution_sketch: '$3x + 2x = 5x$; $4 - 10 = -6$.'
          - problem: 'A student adds $(6x-1)+(-2x+5)$ and writes $8x+4$. Correct the polynomial.'
            answer: "4x + 4"
            solution_sketch: 'The second $x$ coefficient is negative: $6+(-2)=4$. The constants give $-1+5=4$.'
        constraints: "degree 1; integer coefficients"
      - id: kp2
        name: Add quadratics term by term
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Add $(3x^2 + 2x - 5) + (x^2 - 4x + 7)$.'
            answer: "4x^2 - 2x + 2"
            solution_sketch: '$3x^2 + x^2 = 4x^2$; $2x - 4x = -2x$; $-5 + 7 = 2$.'
          - problem: 'An algebra-tile tray represents $x^2-3x$ and another $2x^2+x-4$. Write the polynomial represented when the trays are combined.'
            answer: "3x^2 - 2x - 4"
            solution_sketch: '$x^2 + 2x^2 = 3x^2$; $-3x + x = -2x$.'
          - problem: 'Add coefficient rows $(4,-1,2)$ and $(2,3,-5)$ in columns $(x^2,x,1)$. Write the resulting polynomial.'
            answer: "6x^2 + 2x - 3"
            solution_sketch: '$4x^2 + 2x^2 = 6x^2$; $-x + 3x = 2x$; $2 - 5 = -3$.'
          - problem: 'Two garden plots have areas $x^2+5x$ and $3x^2-2x+6$ square metres, with $x>1$. Write the total area polynomial.'
            answer: "4x^2 + 3x + 6"
            solution_sketch: '$x^2 + 3x^2 = 4x^2$; $5x - 2x = 3x$.'
        constraints: "degree 2; line up like terms"
      - id: kp3
        name: Add with missing terms
        key_prerequisites: [combining-like-terms, polynomial-basics]
        exemplars:
          - problem: 'Add $(x^3 + 2x - 1) + (x^2 - 2x + 4)$.'
            answer: "x^3 + x^2 + 3"
            solution_sketch: '$2x - 2x = 0$; no other like terms overlap.'
          - problem: 'Add coefficient rows $(2,0,-1,0)$ and $(1,0,0,5)$ in columns $(x^3,x^2,x,1)$. Write the sum in standard form.'
            answer: "3x^3 - x + 5"
            solution_sketch: '$2x^3 + x^3 = 3x^3$; no other like terms overlap.'
          - problem: 'Two volume contributions are $x^3-4x$ and $2x^2+4x-3$, for $x>3$. Write their total as a polynomial and combine the cancelling terms.'
            answer: "x^3 + 2x^2 - 3"
            solution_sketch: '$-4x + 4x = 0$; combine the remaining terms.'
          - problem: 'A student adds $(3x^3+2x^2)+(x^3-2x^2+7)$ and keeps $4x^2$ in the answer. Correct the sum.'
            answer: "4x^3 + 7"
            solution_sketch: '$2x^2 - 2x^2 = 0$; $3x^3 + x^3 = 4x^3$.'
        constraints: "some powers absent; keep standard form"
    diagnostic_exemplar:
      problem: 'Add $(2x^3 + x - 5) + (x^2 - 3x + 2)$.'
      answer: '2x^3 + x^2 - 2x - 3'
      solution_sketch: 'Only the $x$ terms and the constants pair up: $x - 3x = -2x$ and $-5 + 2 = -3$.'
    anki_seeds:
      - front: "Like terms in polynomials have the same ..."
        back: "variable raised to the same power (only coefficients differ)"
        type: basic

  - id: polynomial-addition-subtraction
    name: Adding and Subtracting Polynomials
    core: true
    difficulty: 0.4
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: adding-polynomials
        weight: 0.8
        key: true
      - id: distributive-property
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
      - id: evaluating-expressions
        weight: 0.0            # conceptual-familiarity only (no implicit reps)
    knowledge_points:
      - id: kp1
        name: Subtract polynomials by distributing the negative
        key_prerequisites: [distributive-property]
        constraints: "subtraction distributes over every term of the second polynomial"
        exemplars:
          - problem: 'Subtract $(5x^2 - 3x + 4) - (2x^2 + x - 6)$.'
            answer: "3x^2 - 4x + 10"
            solution_sketch: 'Distribute the minus: $5x^2 - 2x^2 = 3x^2$; $-3x - x = -4x$; $4 - (-6) = 10$.'
          - problem: 'A length $3x-8$ is cut from a bar of length $7x-2$, with $x>3$. Write the remaining length as a polynomial.'
            answer: "4x + 6"
            solution_sketch: 'Distribute the minus: $7x - 3x = 4x$; $-2 - (-8) = 6$.'
          - problem: 'Subtract coefficient row $(3,4,-1)$ from $(6,-2,5)$ in columns $(x^2,x,1)$. Write the resulting polynomial.'
            answer: "3x^2 - 6x + 6"
            solution_sketch: 'Distribute the minus: $6x^2 - 3x^2 = 3x^2$; $-2x - 4x = -6x$; $5 - (-1) = 6$.'
          - problem: 'A student writes $(4x-9)-(x-2)=3x-11$. Correct the result by distributing the subtraction sign.'
            answer: "3x - 7"
            solution_sketch: 'Distribute the minus: $4x - x = 3x$; $-9 - (-2) = -7$.'
      - id: kp2
        name: Subtract with missing terms and cancellation
        key_prerequisites: [adding-polynomials, distributive-property]
        exemplars:
          - problem: 'Simplify $(x^3 + 2x - 1) - (x^3 - x^2 + 2x - 4)$.'
            answer: "x^2 + 3"
            solution_sketch: '$x^3$ cancels; $+x^2$; $2x - 2x = 0$; $-1 + 4 = 3$.'
          - problem: 'Simplify $(2x^2 + 5) - (x^2 + 3x)$.'
            answer: "x^2 - 3x + 5"
            solution_sketch: 'Distribute the minus: $2x^2 - x^2 = x^2$; the $-3x$ carries through.'
          - problem: 'Find $P-Q$ from coefficient rows $P=(1,0,3,0)$ and $Q=(1,-2,1,-4)$ in columns $(x^3,x^2,x,1)$.'
            answer: "2x^2 + 2x + 4"
            solution_sketch: '$x^3$ cancels; $+2x^2$; $3x - x = 2x$; $0 - (-4) = 4$.'
          - problem: 'A tile tray represents $3x^2+2x$. Removing a tray representing $x^2+2x-6$ uses zero pairs for the negative units. What polynomial remains?'
            answer: "2x^2 + 6"
            solution_sketch: '$3x^2 - x^2 = 2x^2$; $2x - 2x = 0$; $0 - (-6) = 6$.'
        constraints: 'some powers absent from one polynomial; terms may cancel completely; degree <= 3'
      - id: kp3
        name: Combine three polynomials
        key_prerequisites: [adding-polynomials]
        exemplars:
          - problem: 'Simplify $(4x^2 - 1) + (x^2 + 6x) - (2x^2 - 3)$.'
            answer: "3x^2 + 6x + 2"
            solution_sketch: '$4x^2 + x^2 - 2x^2 = 3x^2$; the $6x$ carries; $-1 - (-3) = 2$.'
          - problem: 'Simplify $(x^2 + 2x) + (3x^2 - x) - (2x^2 + 4)$.'
            answer: "2x^2 + x - 4"
            solution_sketch: 'Combine the $x^2$ coefficients $1 + 3 - 2$ to get $2x^2$; the $x$ terms give $2x - x = x$; the constants give $0 - 4 = -4$.'
          - problem: 'A stock model starts at $2x^2+x$, receives $x^2-5$, and dispatches $x^2-3x$, with $x>5$. Write the net stock polynomial.'
            answer: "2x^2 + 4x - 5"
            solution_sketch: '$2x^2 + x^2 - x^2 = 2x^2$; $x - (-3x) = 4x$; $0 - 5 = -5$.'
          - problem: 'Compute $P+Q-R$ using coefficient rows $P=(1,0,-4)$, $Q=(2,1,0)$, $R=(1,-2,1)$ in columns $(x^2,x,1)$.'
            answer: "2x^2 + 3x - 5"
            solution_sketch: '$1 + 2 - 1 = 2$ for $x^2$; $x - (-2x) = 3x$; $-4 - 1 = -5$.'
        constraints: 'three polynomials, at least one subtracted; degree <= 2; answer in standard form'
    diagnostic_exemplar:
      problem: 'Simplify $(3x^2 + 5) + (x^2 - 2x) - (2x^2 + 3)$.'
      answer: '2x^2 - 2x + 2'
      solution_sketch: 'Distribute the minus: $3x^2 + 5 + x^2 - 2x - 2x^2 - 3$.'
    anki_seeds:
      - front: "When subtracting polynomials, the minus sign..."
        back: "distributes to every term of the polynomial being subtracted."
        type: basic
      - front: "When adding or subtracting polynomials, you may only combine..."
        back: "like terms (same variable and same exponent)."
        type: basic

  - id: multiplying-monomials-polynomials
    name: Multiplying a Monomial by a Polynomial
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: distributive-property
        weight: 0.9
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Monomial times a monomial
        key_prerequisites: [exponent-product-quotient-rules]
        step_check:
          step: 'The variable exponent is $4+5=9$.'
          question: 'Why are the exponents $4$ and $5$ added rather than multiplied?'
          options:
            - 'Exponents are added whenever two terms are combined, as in $x^4+x^5$'
            - 'Four factors of $x$ times five more factors of $x$ make nine factors'
            - 'Adding is only a shortcut, and $x^{20}$ would be equally correct'
          answer: 'Four factors of $x$ times five more factors of $x$ make nine factors'
          why: '$x^4\cdot x^5=(x\cdot x\cdot x\cdot x)(x\cdot x\cdot x\cdot x\cdot x)=x^9$; multiplying exponents belongs to a power of a power such as $(x^4)^5$.'
        exemplars:
          - problem: 'Multiply $(3x^2)(5x^4)$.'
            answer: '15x^6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Multiply the coefficients, $3 \cdot 5 = 15$, and add the exponents, $2 + 4 = 6$. The product is $15x^6$.'
          - problem: 'Multiply $(-2x)(4x^3)$.'
            answer: '-8x^4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The coefficients give $(-2) \cdot 4 = -8$. The bare $x$ has exponent $1$, so the exponent is $1 + 3 = 4$ and the product is $-8x^4$.'
          - problem: 'A rectangular garden bed has length $4x^3$ and width $2x^2$. Find its area.'
            answer: '8x^5'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Area is length times width, so multiply $(4x^3)(2x^2)$. The coefficients give $4 \cdot 2 = 8$ and the exponents give $3 + 2 = 5$, so the area is $8x^5$.'
          - problem: 'Priya multiplies $(-3x^2)(5x)$ and gets $-15x^2$. What is the correct product?'
            answer: '-15x^3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The coefficients give $-15$, which Priya found. She forgot that $x$ is $x^1$, so the exponent is $2 + 1 = 3$ and the product is $-15x^3$.'
          - problem: 'Multiply $(-6x^3)(-2x^5)$.'
            answer: '12x^8'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Two negative coefficients give a positive product, $(-6)(-2) = 12$. The exponents add to $3 + 5 = 8$, so the product is $12x^8$.'
          - problem: 'A cube has edge length $3x^2$. Find its volume.'
            answer: '27x^6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The volume of a cube is edge times edge times edge, $(3x^2)(3x^2)(3x^2)$. The coefficients give $27$ and the exponents give $2 + 2 + 2 = 6$, so the volume is $27x^6$.'
          - problem: 'A square tile has side length $5x^4$. Find its area.'
            answer: '25x^8'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The area of a square is side times side, $(5x^4)(5x^4)$. The coefficients give $25$ and the exponents give $4 + 4 = 8$, so the area is $25x^8$.'
          - problem: 'Multiply $(2x)(-3x^2)(4x)$.'
            answer: '-24x^4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The coefficients give $2 \cdot (-3) \cdot 4 = -24$. The exponents add to $1 + 2 + 1 = 4$, so the product is $-24x^4$.'
        constraints: "single-variable monomials; integer coefficients"
      - id: kp2
        name: Monomial times a binomial or trinomial
        key_prerequisites: [distributive-property, exponent-product-quotient-rules]
        step_check:
          step: 'The powers differ'
          question: 'Why are $15x^3$, $-5x^2$ and $40x$ left as three separate terms?'
          options:
            - 'They should really be added to give the single term $50x^6$'
            - 'They have different powers of $x$, so they are not like terms'
            - 'Only terms that have the same coefficient can be combined'
          answer: 'They have different powers of $x$, so they are not like terms'
          why: 'Like terms need the same power of $x$; $x^3$, $x^2$ and $x$ are different, so the sum cannot be shortened.'
        exemplars:
          - problem: 'Expand $3x(2x^2 - 4x + 5)$.'
            answer: '6x^3 - 12x^2 + 15x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Multiply $3x$ by each term: $3x(2x^2)=6x^3$, $3x(-4x)=-12x^2$ and $3x(5)=15x$. The powers differ, so the result is $6x^3-12x^2+15x$.'
          - problem: 'Expand $2x(x + 7)$.'
            answer: '2x^2 + 14x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Multiply $2x$ by each term in the bracket: $2x(x)=2x^2$ and $2x(7)=14x$. The result is $2x^2+14x$.'
          - problem: 'A rectangle has width $5x$ and length $x + 3$. Write and expand an expression for its area.'
            answer: '5x^2 + 15x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Area is width times length, $5x(x+3)$. Distributing gives $5x \cdot x + 5x \cdot 3$, so the area is $5x^2+15x$.'
          - problem: 'Expand $4x^2(3x^2 + x - 6)$.'
            answer: '12x^4 + 4x^3 - 24x^2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The three products are $4x^2(3x^2)=12x^4$, $4x^2(x)=4x^3$ and $4x^2(-6)=-24x^2$. The result is $12x^4+4x^3-24x^2$.'
          - problem: 'Leo expands $3x^2(2x + 5)$ and gets $6x^3 + 5$. What is the correct expansion?'
            answer: '6x^3 + 15x^2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Leo multiplied only the first term by $3x^2$. The second product is $3x^2(5)=15x^2$, so the expansion is $6x^3+15x^2$.'
          - problem: 'A box has a square base of side $2x$ and height $x + 4$. Write and expand an expression for its volume.'
            answer: '4x^3 + 16x^2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The base area is $(2x)^2=4x^2$, and volume is base area times height, $4x^2(x+4)$. Distributing gives a volume of $4x^3+16x^2$.'
          - problem: 'Expand $6x(x^3 - 2x^2 + 3)$.'
            answer: '6x^4 - 12x^3 + 18x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The three products are $6x^4$, $-12x^3$ and $18x$. No two have the same power, so the result is $6x^4-12x^3+18x$.'
          - problem: 'A photo is $2x$ cm tall, and its width is $3$ cm more than its height. Write and expand an expression for its area.'
            answer: '4x^2 + 6x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The width is $2x+3$, so the area is $2x(2x+3)$. Distributing gives $2x \cdot 2x + 2x \cdot 3 = 4x^2+6x$.'
        constraints: "positive monomial in front"
      - id: kp3
        name: Negative monomials
        key_prerequisites: [distributive-property, integer-multiplication-division]
        step_check:
          step: 'The second is $(-6x^2)(-5x)=30x^3$.'
          question: 'Why is the second product positive?'
          options:
            - 'The minus in front only affects the first term in the bracket'
            - 'The term with the larger power decides the sign of the product'
            - 'Both factors are negative, and negative times negative is positive'
          answer: 'Both factors are negative, and negative times negative is positive'
          why: '$-6x^2$ and $-5x$ are both negative, and $(-6)(-5)=30$, so the product is $+30x^3$.'
        exemplars:
          - problem: 'Expand $-2x^2(x - 3)$.'
            answer: '-2x^3 + 6x^2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Multiply $-2x^2$ by each term: $(-2x^2)(x)=-2x^3$ and $(-2x^2)(-3)=6x^2$. The result is $-2x^3+6x^2$.'
          - problem: 'Expand $-4x(x^2 - 2x - 1)$.'
            answer: '-4x^3 + 8x^2 + 4x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The products are $(-4x)(x^2)=-4x^3$, $(-4x)(-2x)=8x^2$ and $(-4x)(-1)=4x$. The result is $-4x^3+8x^2+4x$.'
          - problem: 'Noah expands $-5x(x^2 - 3x + 2)$ and gets $-5x^3 - 15x^2 - 10x$. What is the correct expansion?'
            answer: '-5x^3 + 15x^2 - 10x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The middle product is $(-5x)(-3x)=15x^2$, positive because both factors are negative. The correct expansion is $-5x^3+15x^2-10x$.'
          - problem: 'Expand $-3x^2(2x^2 - 5x - 4)$.'
            answer: '-6x^4 + 15x^3 + 12x^2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The products are $-6x^4$, $(-3x^2)(-5x)=15x^3$ and $(-3x^2)(-4)=12x^2$. The result is $-6x^4+15x^3+12x^2$.'
          - problem: 'A rectangular lawn measures $3x$ by $x + 6$. A flower bed measuring $2x$ by $x - 1$ is dug out of it. Write and expand an expression for the area of lawn that remains.'
            answer: 'x^2 + 20x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The remaining area is $3x(x+6) - 2x(x-1)$. Distributing $-2x$ gives $3x^2+18x-2x^2+2x$, which simplifies to $x^2+20x$.'
          - problem: 'A poster measures $6x$ by $2x + 5$. A photo measuring $x$ by $3x - 4$ is glued onto it. Write and expand an expression for the area of the poster left uncovered.'
            answer: '9x^2 + 34x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The uncovered area is $6x(2x+5) - x(3x-4)$. Distributing $-x$ gives $12x^2+30x-3x^2+4x$, which simplifies to $9x^2+34x$.'
          - problem: 'Expand $-x(4 - 7x + x^2)$.'
            answer: '-x^3 + 7x^2 - 4x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The products are $-4x$, $(-x)(-7x)=7x^2$ and $-x^3$. In descending powers the result is $-x^3+7x^2-4x$.'
          - problem: 'Expand $-6x^3(-x^2 + 2x - 5)$.'
            answer: '6x^5 - 12x^4 + 30x^3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Every sign flips: $(-6x^3)(-x^2)=6x^5$, $(-6x^3)(2x)=-12x^4$ and $(-6x^3)(-5)=30x^3$. The result is $6x^5-12x^4+30x^3$.'
        constraints: "leading negative; track every sign"
    diagnostic_exemplar:
      problem: 'Expand $-3x(x^2 - 2x + 4)$.'
      answer: '-3x^3 + 6x^2 - 12x'
      solution_sketch: 'Distribute $-3x$ to each term, tracking every sign.'
    anki_seeds:
      - front: "Multiplying monomials: (ax^m)(bx^n) = ?"
        back: "(a*b) x^(m+n)"
        type: basic

  - id: multiplying-binomials
    name: Multiplying Binomials (FOIL)
    core: true
    difficulty: 0.48
    drill: true                # fluency / automaticity-drill topic
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: multiplying-monomials-polynomials
        weight: 0.8
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: integer-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Monic binomials (x + a)(x + b)
        key_prerequisites: [combining-like-terms]
        try_first:
          problem: 'Work out $(10+3)(10+4)$ by multiplying each part of the first bracket by each part of the second and adding the four results.'
          answer_contract: {"kind":"exact"}
          answer: '182'
          reveal: 'The four products $100$, $40$, $30$ and $12$ add to $182$, which is $13 \cdot 14$. Multiplying $(x+3)(x+4)$ works the same way: every term of one bracket meets every term of the other.'
        step_check:
          step: 'Combine $-9x+7x=-2x$.'
          question: 'Why are $-9x$ and $7x$ combined while $x^2$ and $-63$ stay separate?'
          options:
            - 'The outer and inner products always cancel each other out'
            - 'They are like terms, since both are a number times $x$'
            - 'Combining them makes the answer have exactly three terms'
          answer: 'They are like terms, since both are a number times $x$'
          why: '$-9x$ and $7x$ both multiply $x^1$, so they add to $-2x$; $x^2$ and $-63$ have different powers and stay apart.'
        exemplars:
          - problem: 'Expand $(x + 3)(x + 5)$.'
            answer: 'x^2 + 8x + 15'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $x^2$, $5x$, $3x$ and $15$. Combining $5x+3x=8x$ gives $x^2+8x+15$.'
          - problem: 'Expand $(x - 4)(x + 6)$.'
            answer: 'x^2 + 2x - 24'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $x^2$, $6x$, $-4x$ and $-24$. Combining $6x-4x=2x$ gives $x^2+2x-24$.'
          - problem: 'A rectangle has length $x + 2$ and width $x + 9$. Write and expand an expression for its area.'
            answer: 'x^2 + 11x + 18'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Area is length times width, $(x+2)(x+9)$. The products $x^2$, $9x$, $2x$ and $18$ combine to $x^2+11x+18$.'
          - problem: 'Sara expands $(x - 5)(x + 8)$ and gets $x^2 + 13x - 40$. What is the correct expansion?'
            answer: 'x^2 + 3x - 40'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The cross-products are $8x$ and $-5x$, which add to $3x$; Sara added $8$ and $5$ without the sign. The correct expansion is $x^2+3x-40$.'
          - problem: 'Expand $(x - 7)(x - 2)$.'
            answer: 'x^2 - 9x + 14'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $x^2$, $-2x$, $-7x$ and $(-7)(-2)=14$. Combining the middle terms gives $x^2-9x+14$.'
          - problem: 'A square garden has side $x$ metres. One side is lengthened by $6$ metres and the other is shortened by $2$ metres. Write and expand an expression for the area of the new garden.'
            answer: 'x^2 + 4x - 12'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The new garden measures $x+6$ by $x-2$, so its area is $(x+6)(x-2)$. The products $x^2$, $-2x$, $6x$ and $-12$ combine to $x^2+4x-12$.'
          - problem: 'Expand $(x - 9)(x + 1)$.'
            answer: 'x^2 - 8x - 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $x^2$, $x$, $-9x$ and $-9$. Combining $x-9x=-8x$ gives $x^2-8x-9$.'
        constraints: "leading coefficient 1; integer constants"
      - id: kp2
        name: One leading coefficient
        key_prerequisites: [multiplying-monomials-polynomials]
        step_check:
          step: 'The linear terms combine to $7x$.'
          question: 'Why is the middle term $7x$ and not $2x-3x=-x$?'
          options:
            - 'The outer product is $5x\cdot2=10x$, so the coefficient $5$ counts'
            - 'Add the two constants, $-3+2$, and then change the sign'
            - 'Multiply the constants and then add the leading coefficient'
          answer: 'The outer product is $5x\cdot2=10x$, so the coefficient $5$ counts'
          why: 'The middle term is $10x+(-3x)=7x$; the shortcut of adding the constants only works when both leading coefficients are $1$.'
        exemplars:
          - problem: 'Expand $(2x - 1)(x + 4)$.'
            answer: '2x^2 + 7x - 4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $2x^2$, $8x$, $-x$ and $-4$. Combining $8x-x=7x$ gives $2x^2+7x-4$.'
          - problem: 'Expand $(3x + 2)(x - 5)$.'
            answer: '3x^2 - 13x - 10'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $3x^2$, $-15x$, $2x$ and $-10$. Combining $-15x+2x=-13x$ gives $3x^2-13x-10$.'
          - problem: 'A rectangle has length $4x - 3$ and width $x + 2$. Write and expand an expression for its area.'
            answer: '4x^2 + 5x - 6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Area is $(4x-3)(x+2)$. The products $4x^2$, $8x$, $-3x$ and $-6$ combine to $4x^2+5x-6$.'
          - problem: 'Omar expands $(2x + 5)(x - 3)$ and gets $2x^2 + 2x - 15$. What is the correct expansion?'
            answer: '2x^2 - x - 15'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The cross-products are $2x(-3)=-6x$ and $5x$, which add to $-x$. The correct expansion is $2x^2-x-15$.'
          - problem: 'Expand $(x - 6)(5x - 1)$.'
            answer: '5x^2 - 31x + 6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $5x^2$, $-x$, $-30x$ and $6$. Combining $-x-30x=-31x$ gives $5x^2-31x+6$.'
          - problem: 'A picture is $x$ cm wide and $2x$ cm tall. A frame $3$ cm wide is put around it on every side. Write and expand an expression for the area covered by the picture and frame.'
            answer: '2x^2 + 18x + 36'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The frame adds $3$ cm on both sides, so the outer size is $x+6$ by $2x+6$. Multiplying gives $2x^2+6x+12x+36=2x^2+18x+36$.'
          - problem: 'Expand $(x + 8)(4x + 3)$.'
            answer: '4x^2 + 35x + 24'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $4x^2$, $3x$, $32x$ and $24$. Combining $3x+32x=35x$ gives $4x^2+35x+24$.'
          - problem: 'A garden is $x$ metres wide and twice as long as it is wide. Its length is cut by $4$ metres and its width is increased by $1$ metre. Write and expand an expression for the new area.'
            answer: '2x^2 - 2x - 4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The new garden measures $2x-4$ by $x+1$. The products $2x^2$, $2x$, $-4x$ and $-4$ combine to $2x^2-2x-4$.'
        constraints: "one binomial has coefficient > 1"
      - id: kp3
        name: Both leading coefficients greater than 1
        key_prerequisites: [multiplying-monomials-polynomials, combining-like-terms]
        step_check:
          step: 'Combine $-8x+15x=7x$.'
          question: 'Where do the products $-8x$ and $15x$ come from?'
          options:
            - '$4x\cdot3x$ and $5\cdot(-2)$, the first and last products'
            - '$4x\cdot5$ and $3x\cdot(-2)$, terms taken from the same bracket'
            - '$4x\cdot(-2)$ and $5\cdot3x$, the outer and inner products'
          answer: '$4x\cdot(-2)$ and $5\cdot3x$, the outer and inner products'
          why: 'In $(4x+5)(3x-2)$ the outer product is $4x(-2)=-8x$ and the inner product is $5(3x)=15x$; first and last give $12x^2$ and $-10$.'
        exemplars:
          - problem: 'Expand $(3x - 2)(2x + 5)$.'
            answer: '6x^2 + 11x - 10'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $6x^2$, $15x$, $-4x$ and $-10$. Combining $15x-4x=11x$ gives $6x^2+11x-10$.'
          - problem: 'Expand $(4x + 3)(2x + 1)$.'
            answer: '8x^2 + 10x + 3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $8x^2$, $4x$, $6x$ and $3$. Combining $4x+6x=10x$ gives $8x^2+10x+3$.'
          - problem: 'A rectangle has side lengths $2x - 3$ and $2x - 1$, where $x > 2$. Write and expand an expression for its area.'
            answer: '4x^2 - 8x + 3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Area is $(2x-3)(2x-1)$. The products $4x^2$, $-2x$, $-6x$ and $3$ combine to $4x^2-8x+3$.'
          - problem: 'Kim expands $(2x - 5)(3x + 2)$ and gets $6x^2 + 19x - 10$. What is the correct expansion?'
            answer: '6x^2 - 11x - 10'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The cross-products are $2x \cdot 2 = 4x$ and $-5 \cdot 3x = -15x$, which add to $-11x$. The correct expansion is $6x^2-11x-10$.'
          - problem: 'Expand $(5x - 2)(3x - 4)$.'
            answer: '15x^2 - 26x + 8'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $15x^2$, $-20x$, $-6x$ and $8$. Combining $-20x-6x=-26x$ gives $15x^2-26x+8$.'
          - problem: 'A square tile has side $2x$ cm. A new tile is made $3$ cm longer and $1$ cm narrower than the square one. Write and expand an expression for the area of the new tile.'
            answer: '4x^2 + 4x - 3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The new tile measures $2x+3$ by $2x-1$. The products $4x^2$, $-2x$, $6x$ and $-3$ combine to $4x^2+4x-3$.'
          - problem: 'Expand $(-3x + 2)(4x + 5)$.'
            answer: '-12x^2 - 7x + 10'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The four products are $-12x^2$, $-15x$, $8x$ and $10$. Combining $-15x+8x=-7x$ gives $-12x^2-7x+10$.'
          - problem: 'A box is $2$ units tall and its base measures $3x + 1$ by $2x + 5$. Write and expand an expression for its volume.'
            answer: '12x^2 + 34x + 10'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Volume is $2(3x+1)(2x+5)$. The binomials give $6x^2+17x+5$, and doubling gives $12x^2+34x+10$.'
        constraints: "small coefficients; all four sign patterns"
    diagnostic_exemplar:
      problem: 'Expand $(2x + 3)(3x - 4)$.'
      answer: '6x^2 + x - 12'
      solution_sketch: '$6x^2 - 8x + 9x - 12$.'
    anki_seeds:
      - front: "What does FOIL stand for when multiplying two binomials?"
        back: "First, Outer, Inner, Last — the four products of (a+b)(c+d)."
        type: basic

  - id: polynomial-multiplication
    name: Multiplying Polynomials
    core: true
    difficulty: 0.5
    drill: false               # L4 audit: expansion is multi-step, not a 6s recall skill
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: multiplying-binomials
        weight: 0.8
        key: true
      - id: multiplying-monomials-polynomials
        weight: 0.6
        key: true
      - id: combining-like-terms
        weight: 0.5
      - id: polynomial-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Binomial times a trinomial
        key_prerequisites: [multiplying-binomials, multiplying-monomials-polynomials]
        step_check:
          step: 'Multiplying by $-5$ gives $-5x^2-15x+10$.'
          question: 'Why does the $-5$ row end in $+10$?'
          options:
            - '$(-5)\cdot(-2)=10$, since two negative factors give a positive'
            - 'The sign of the $-5$ is applied only to the first product'
            - 'The last product always keeps the sign of the binomial term'
          answer: '$(-5)\cdot(-2)=10$, since two negative factors give a positive'
          why: 'The last trinomial term is $-2$, and $(-5)(-2)=+10$; the row is $-5x^2-15x+10$.'
        exemplars:
          - problem: 'Expand $(x + 2)(x^2 - 3x + 1)$.'
            answer: 'x^3 - x^2 - 5x + 2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The $x$ row is $x^3-3x^2+x$ and the $2$ row is $2x^2-6x+2$. Combining like powers gives $x^3-x^2-5x+2$.'
          - problem: 'Expand $(2x - 1)(x^2 + x - 3)$.'
            answer: '2x^3 + x^2 - 7x + 3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The $2x$ row is $2x^3+2x^2-6x$ and the $-1$ row is $-x^2-x+3$. Combining like powers gives $2x^3+x^2-7x+3$.'
          - problem: 'A box has height $x - 3$ and a base of area $x^2 + 2x + 4$, where $x > 3$. Write and expand an expression for its volume.'
            answer: 'x^3 - x^2 - 2x - 12'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Volume is base area times height, $(x-3)(x^2+2x+4)$. The rows $x^3+2x^2+4x$ and $-3x^2-6x-12$ combine to $x^3-x^2-2x-12$.'
          - problem: 'Expand $(x + 4)(x^2 - x + 2)$.'
            answer: 'x^3 + 3x^2 - 2x + 8'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The $x$ row is $x^3-x^2+2x$ and the $4$ row is $4x^2-4x+8$. Combining like powers gives $x^3+3x^2-2x+8$.'
          - problem: 'Ravi expands $(x - 3)(x^2 + 3x + 9)$ and gets $x^3 + 6x^2 + 18x - 27$. What is the correct expansion?'
            answer: 'x^3 - 27'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The $x$ row is $x^3+3x^2+9x$ and the $-3$ row is $-3x^2-9x-27$, so the middle terms cancel. The correct expansion is $x^3-27$.'
          - problem: 'A rectangle has width $x + 5$ and length $2x^2 - x + 3$. Write and expand an expression for its area.'
            answer: '2x^3 + 9x^2 - 2x + 15'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Area is $(x+5)(2x^2-x+3)$. The rows $2x^3-x^2+3x$ and $10x^2-5x+15$ combine to $2x^3+9x^2-2x+15$.'
          - problem: 'Expand $(3x + 1)(x^2 - 4x - 2)$.'
            answer: '3x^3 - 11x^2 - 10x - 2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The $3x$ row is $3x^3-12x^2-6x$ and the $1$ row is $x^2-4x-2$. Combining like powers gives $3x^3-11x^2-10x-2$.'
          - problem: 'Expand $(x^2 - 2)(x^2 + 5x - 1)$.'
            answer: 'x^4 + 5x^3 - 3x^2 - 10x + 2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The $x^2$ row is $x^4+5x^3-x^2$ and the $-2$ row is $-2x^2-10x+2$. Combining like powers gives $x^4+5x^3-3x^2-10x+2$.'
        constraints: "six products, then combine like terms"
      - id: kp2
        name: Products of three factors
        key_prerequisites: [multiplying-binomials]
        step_check:
          step: 'The first two factors give $x^2-2x-8$.'
          question: 'Why may $(x-4)(x+2)$ be multiplied first, with $(x+6)$ brought in afterwards?'
          options:
            - 'Multiplication is associative, so any pair may be multiplied first'
            - 'The factor with the largest constant must always be left until last'
            - 'Order of operations says the leftmost pair must always go first'
          answer: 'Multiplication is associative, so any pair may be multiplied first'
          why: '$(x-4)(x+2)(x+6)$ is one product; grouping it as $[(x-4)(x+2)](x+6)$ or in any other way gives the same polynomial.'
        exemplars:
          - problem: 'Expand $(x + 1)(x + 2)(x + 3)$.'
            answer: 'x^3 + 6x^2 + 11x + 6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'First $(x+1)(x+2)=x^2+3x+2$. Multiplying by $x+3$ gives $x^3+3x^2+3x^2+9x+2x+6=x^3+6x^2+11x+6$.'
          - problem: 'Expand $x(x - 2)(x + 5)$.'
            answer: 'x^3 + 3x^2 - 10x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'First $(x-2)(x+5)=x^2+3x-10$. Distributing $x$ gives $x^3+3x^2-10x$.'
          - problem: 'A box has dimensions $x + 2$, $x - 3$ and $x + 1$, where $x > 3$. Write and expand an expression for its volume.'
            answer: 'x^3 - 7x - 6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'First $(x+2)(x-3)=x^2-x-6$. Multiplying by $x+1$ gives $x^3+x^2-x^2-x-6x-6$, which is $x^3-7x-6$.'
          - problem: 'Ella expands $x(x + 3)(x - 4)$ and gets $x^3 - x^2 - 12$. What is the correct expansion?'
            answer: 'x^3 - x^2 - 12x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The binomials give $x^2-x-12$, and the outside $x$ multiplies every term, including $-12$. The correct expansion is $x^3-x^2-12x$.'
          - problem: 'An open box is made from a $20$ cm by $12$ cm sheet of card by cutting a square of side $x$ cm from each corner and folding up the sides. Write and expand an expression for the volume of the box.'
            answer: '4x^3 - 64x^2 + 240x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The base measures $20-2x$ by $12-2x$ and the height is $x$. The base area is $240-64x+4x^2$, so the volume is $4x^3-64x^2+240x$.'
          - problem: 'Expand $(2x - 1)(x + 3)(x - 2)$.'
            answer: '2x^3 + x^2 - 13x + 6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'First $(x+3)(x-2)=x^2+x-6$. Multiplying by $2x-1$ gives $2x^3+2x^2-12x-x^2-x+6=2x^3+x^2-13x+6$.'
          - problem: 'A cube has edge $x$ cm. A box is made $2$ cm longer, $3$ cm wider and $1$ cm shorter than the cube. Write and expand an expression for the volume of the box.'
            answer: 'x^3 + 4x^2 + x - 6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The box measures $x+2$ by $x+3$ by $x-1$. First $(x+2)(x+3)=x^2+5x+6$, and multiplying by $x-1$ gives $x^3+4x^2+x-6$.'
          - problem: 'Expand $(x + 4)(x + 4)(x - 1)$.'
            answer: 'x^3 + 7x^2 + 8x - 16'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'First $(x+4)(x+4)=x^2+8x+16$. Multiplying by $x-1$ gives $x^3+8x^2+16x-x^2-8x-16=x^3+7x^2+8x-16$.'
        constraints: "multiply two factors first, then the third"
      - id: kp3
        name: Larger products with many like terms
        key_prerequisites: [multiplying-binomials, combining-like-terms]
        step_check:
          step: 'The cubic terms cancel'
          question: 'Why do the cubic terms cancel?'
          options:
            - 'A product of two quadratics never contains an $x^3$ term'
            - 'The $x^2$ row gives $-2x^3$ and the $2x$ row gives $+2x^3$'
            - 'Cubic terms are dropped once the $x^4$ term has been written'
          answer: 'The $x^2$ row gives $-2x^3$ and the $2x$ row gives $+2x^3$'
          why: '$x^2\cdot(-2x)=-2x^3$ and $2x\cdot x^2=2x^3$ add to zero, so no $x^3$ term remains.'
        exemplars:
          - problem: 'Expand $(x^2 + 2x - 1)(x^2 - x + 3)$.'
            answer: 'x^4 + x^3 + 7x - 3'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The nine products give cubic coefficients $-1+2=1$, quadratic coefficients $3-2-1=0$, linear coefficients $6+1=7$ and constant $-3$. The result is $x^4+x^3+7x-3$.'
          - problem: 'Expand $(x^2 + x + 1)(x^2 - x + 1)$.'
            answer: 'x^4 + x^2 + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The cubic terms $-x^3+x^3$ and the linear terms $x-x$ cancel. The quadratic coefficients add to $1-1+1=1$, so the result is $x^4+x^2+1$.'
          - problem: 'A rectangle has sides $x^2 + 3x - 2$ and $x^2 - 2x + 1$, where $x > 2$. Write and expand an expression for its area.'
            answer: 'x^4 + x^3 - 7x^2 + 7x - 2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Collect the nine products by power: cubic $-2+3=1$, quadratic $1-6-2=-7$, linear $3+4=7$ and constant $-2$. The area is $x^4+x^3-7x^2+7x-2$.'
          - problem: 'Expand $(x^2 - x + 2)(x^2 + x - 1)$.'
            answer: 'x^4 + 3x - 2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The cubic terms $x^3-x^3$ cancel, and the quadratic coefficients $-1-1+2$ add to zero. The linear terms give $x+2x=3x$, so the result is $x^4+3x-2$.'
          - problem: 'Zoe expands $(x^2 + 3x + 1)(x^2 - 3x + 1)$ and gets $x^4 + 2x^2 + 1$. What is the correct expansion?'
            answer: 'x^4 - 7x^2 + 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Zoe left out the product $(3x)(-3x)=-9x^2$. The quadratic coefficients are $1-9+1=-7$, so the correct expansion is $x^4-7x^2+1$.'
          - problem: 'A theatre has $x^2 + 2x - 1$ rows with $x^2 - 3x + 5$ seats in each row. Write and expand an expression for the total number of seats.'
            answer: 'x^4 - x^3 - 2x^2 + 13x - 5'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The total is rows times seats per row, $(x^2+2x-1)(x^2-3x+5)$. Collecting the nine products gives cubic $-3+2=-1$, quadratic $5-6-1=-2$, linear $10+3=13$ and constant $-5$, so the total is $x^4-x^3-2x^2+13x-5$.'
          - problem: 'Expand $(2x^2 - x + 3)(x^2 + 4x - 2)$.'
            answer: '2x^4 + 7x^3 - 5x^2 + 14x - 6'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Collect the nine products by power: cubic $8-1=7$, quadratic $-4-4+3=-5$, linear $2+12=14$ and constant $-6$. The result is $2x^4+7x^3-5x^2+14x-6$.'
          - problem: 'Expand $(x^2 + 2x + 3)(x^2 + 2x + 3)$.'
            answer: 'x^4 + 4x^3 + 10x^2 + 12x + 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Collect the nine products by power: cubic $2+2=4$, quadratic $3+4+3=10$, linear $6+6=12$ and constant $9$. The result is $x^4+4x^3+10x^2+12x+9$.'
        constraints: "trinomial times trinomial; watch cancellation"
    diagnostic_exemplar:
      problem: 'Expand $(x + 3)(x^2 - 2x + 4)$.'
      answer: "x^3 + x^2 - 2x + 12"
      solution_sketch: '$x^3 - 2x^2 + 4x + 3x^2 - 6x + 12$.'
    anki_seeds:
      - front: "Multiplying a binomial by a trinomial produces how many products before combining?"
        back: "6 (each of 2 terms times each of 3 terms)"
        type: basic

  - id: special-products
    name: Special Products of Binomials
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: multiplying-binomials
        weight: 0.8
        key: true
      - id: combining-like-terms
        weight: 0.4
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Square of a sum and of a difference
        key_prerequisites: [multiplying-binomials]
        try_first:
          problem: 'Calculate $(3+4)^2 - (3^2 + 4^2)$.'
          answer_contract: {"kind":"exact"}
          answer: '24'
          reveal: '$(3+4)^2=49$ but $3^2+4^2=25$; the missing $24$ is $2\cdot3\cdot4$. Squaring a sum always adds twice the product of the two terms.'
        step_check:
          step: 'The three terms are $x^2$, $-2(x)(5)=-10x$ and $5^2=25$.'
          question: 'Why does $(x-5)^2$ have the middle term $-10x$?'
          options:
            - 'The exponent $2$ is multiplied by $-5$ to give the coefficient'
            - 'Writing $(x-5)(x-5)$ gives two cross-products of $-5x$ each'
            - 'It is optional, since $x^2+25$ is also a correct expansion'
          answer: 'Writing $(x-5)(x-5)$ gives two cross-products of $-5x$ each'
          why: '$(x-5)(x-5)=x^2-5x-5x+25$; dropping the middle term is the most common error with squares.'
        exemplars:
          - problem: 'Expand $(x + 5)^2$.'
            answer: 'x^2 + 10x + 25'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Use $a^2+2ab+b^2$ with $a=x$ and $b=5$. The middle term is $2(x)(5)=10x$, so the result is $x^2+10x+25$.'
          - problem: 'Expand $(x - 9)^2$.'
            answer: 'x^2 - 18x + 81'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Use $a^2-2ab+b^2$ with $a=x$ and $b=9$. The middle term is $-2(x)(9)=-18x$, so the result is $x^2-18x+81$.'
          - problem: 'A square has side length $x + 6$. Write and expand an expression for its area.'
            answer: 'x^2 + 12x + 36'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The area of a square is its side squared, $(x+6)^2$. The middle term is $2(x)(6)=12x$, so the area is $x^2+12x+36$.'
          - problem: 'Jonas writes $(x - 4)^2 = x^2 + 16$. What is the correct expansion of $(x - 4)^2$?'
            answer: 'x^2 - 8x + 16'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Jonas dropped both cross-products and the sign. Writing $(x-4)(x-4)$ gives $x^2-4x-4x+16$, which is $x^2-8x+16$.'
          - problem: 'A square lawn has side $x$ metres. A path $2$ metres wide is laid around the outside of the lawn. Write and expand an expression for the total area of the lawn and path.'
            answer: 'x^2 + 8x + 16'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The path adds $2$ metres on each side, so the outer square has side $x+4$. Its area is $(x+4)^2=x^2+8x+16$.'
          - problem: 'Expand $(x - 11)^2$.'
            answer: 'x^2 - 22x + 121'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Use $a^2-2ab+b^2$ with $a=x$ and $b=11$. The middle term is $-22x$ and $11^2=121$, so the result is $x^2-22x+121$.'
          - problem: 'A square photo has side $x$ cm. It is trimmed to a smaller square whose side is $3$ cm shorter. Write and expand an expression for the area of the trimmed photo.'
            answer: 'x^2 - 6x + 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The trimmed side is $x-3$, so the area is $(x-3)^2$. The middle term is $-2(x)(3)=-6x$, giving $x^2-6x+9$.'
          - problem: 'Expand $(a + 7)^2$.'
            answer: 'a^2 + 14a + 49'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Square the first term, double the product and square the last term. This gives $a^2+2(a)(7)+49=a^2+14a+49$.'
        constraints: "(a ± b)^2 = a^2 ± 2ab + b^2; never just a^2 + b^2"
      - id: kp2
        name: Product of conjugates
        key_prerequisites: [multiplying-binomials]
        try_first:
          problem: 'Work out $21 \times 19$ without a calculator.'
          answer_contract: {"kind":"exact"}
          answer: '399'
          reveal: '$21\times19=(20+1)(20-1)=400-20+20-1=399$. The two cross-products cancel, which is why $(a+b)(a-b)=a^2-b^2$.'
        step_check:
          step: 'The product is $(5x)^2-9^2=25x^2-81$.'
          question: 'Why does no $x$-term appear in the product?'
          options:
            - 'Terms in $x$ are always dropped when two binomials are multiplied'
            - 'The cross-products $-45x$ and $+45x$ cancel each other out'
            - 'Conjugates have no constant term to multiply by the $x$-term'
          answer: 'The cross-products $-45x$ and $+45x$ cancel each other out'
          why: '$(5x)(-9)=-45x$ and $9(5x)=45x$ add to zero, leaving $(5x)^2-9^2$.'
        exemplars:
          - problem: 'Expand $(x + 7)(x - 7)$.'
            answer: 'x^2 - 49'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The cross-products $-7x$ and $7x$ cancel. The remaining terms are $x^2$ and $-49$, so the result is $x^2-49$.'
          - problem: 'Expand $(2x + 3)(2x - 3)$.'
            answer: '4x^2 - 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Use $a^2-b^2$ with $a=2x$ and $b=3$. The cross-products cancel, so the result is $4x^2-9$.'
          - problem: 'A rectangular field has sides $x + 10$ metres and $x - 10$ metres, where $x > 10$. Write and expand an expression for its area.'
            answer: 'x^2 - 100'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The area is $(x+10)(x-10)$, a product of conjugates. The cross-products cancel and the area is $x^2-100$.'
          - problem: 'Lena writes $(3x + 1)(3x - 1) = 9x^2 + 1$. What is the correct product?'
            answer: '9x^2 - 1'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The last product is $1 \cdot (-1) = -1$, not $+1$. The cross-products cancel, so the correct product is $9x^2-1$.'
          - problem: 'A square has side $x$. One pair of opposite sides is lengthened by $4$ and the other pair is shortened by $4$. Write and expand an expression for the area of the new rectangle.'
            answer: 'x^2 - 16'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The new rectangle measures $x+4$ by $x-4$. The cross-products cancel, so the area is $x^2-16$, which is $16$ less than the square.'
          - problem: 'Expand $(6x - 5)(6x + 5)$.'
            answer: '36x^2 - 25'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Use $a^2-b^2$ with $a=6x$ and $b=5$. Squaring the whole term gives $36x^2$, so the result is $36x^2-25$.'
          - problem: 'Expand $(x^2 + 3)(x^2 - 3)$.'
            answer: 'x^4 - 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Use $a^2-b^2$ with $a=x^2$ and $b=3$. Since $(x^2)^2=x^4$, the result is $x^4-9$.'
          - problem: 'Expand $(4 - x)(4 + x)$.'
            answer: '16 - x^2'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Use $a^2-b^2$ with $a=4$ and $b=x$. The cross-products $4x$ and $-4x$ cancel, so the result is $16-x^2$.'
        constraints: "(a + b)(a - b) = a^2 - b^2"
      - id: kp3
        name: Special products with coefficients
        key_prerequisites: [multiplying-binomials]
        step_check:
          step: 'The middle term is $-2(7x)(3)=-42x$'
          question: 'Why is the middle term $-42x$ rather than $-21x$?'
          options:
            - 'The cross-product $-21x$ occurs twice, once outer and once inner'
            - 'Squaring the binomial doubles every one of its terms'
            - 'The coefficient of $x$ is always doubled when a binomial is squared'
          answer: 'The cross-product $-21x$ occurs twice, once outer and once inner'
          why: '$(7x-3)(7x-3)$ has outer product $-21x$ and inner product $-21x$, which add to $-42x=-2(7x)(3)$.'
        exemplars:
          - problem: 'Expand $(3x - 4)^2$.'
            answer: '9x^2 - 24x + 16'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Use $a=3x$ and $b=4$. The terms are $(3x)^2=9x^2$, $-2(3x)(4)=-24x$ and $16$, so the result is $9x^2-24x+16$.'
          - problem: 'Expand $(4x + 3)^2$.'
            answer: '16x^2 + 24x + 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Use $a=4x$ and $b=3$. The terms are $(4x)^2=16x^2$, $2(4x)(3)=24x$ and $9$, so the result is $16x^2+24x+9$.'
          - problem: 'A square tile has side length $5x - 2$. Write and expand an expression for its area.'
            answer: '25x^2 - 20x + 4'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The area is $(5x-2)^2$. The terms are $(5x)^2=25x^2$, $-2(5x)(2)=-20x$ and $4$, so the area is $25x^2-20x+4$.'
          - problem: 'Ade writes $(2x + 5)^2 = 4x^2 + 10x + 25$. What is the correct expansion?'
            answer: '4x^2 + 20x + 25'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Ade counted the cross-product $10x$ only once. The middle term is $2(2x)(5)=20x$, so the expansion is $4x^2+20x+25$.'
          - problem: 'A square window has side $3x$ cm. A frame $2$ cm wide is fitted around it. Write and expand an expression for the area of the frame alone.'
            answer: '24x + 16'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The outer square has side $3x+4$, so its area is $9x^2+24x+16$. Subtracting the window area $9x^2$ leaves $24x+16$.'
          - problem: 'Expand $(2x - 7)^2$.'
            answer: '4x^2 - 28x + 49'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'Use $a=2x$ and $b=7$. The terms are $4x^2$, $-2(2x)(7)=-28x$ and $49$, so the result is $4x^2-28x+49$.'
          - problem: 'Each side of a square garden of side $4x$ metres is reduced by $3$ metres. Write and expand an expression for the new area.'
            answer: '16x^2 - 24x + 9'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The new side is $4x-3$, so the area is $(4x-3)^2$. The terms are $16x^2$, $-24x$ and $9$, giving $16x^2-24x+9$.'
          - problem: 'Expand and simplify $(3x + 5)^2 - (3x - 5)^2$.'
            answer: '60x'
            answer_contract: {"kind":"required_form","form":"expanded_polynomial"}
            solution_sketch: 'The squares are $9x^2+30x+25$ and $9x^2-30x+25$. Subtracting cancels $9x^2$ and $25$ and leaves $60x$.'
        constraints: "a = coefficient times x; compute 2ab carefully"
    diagnostic_exemplar:
      problem: 'Expand $(2x - 5)^2$.'
      answer: '4x^2 - 20x + 25'
      solution_sketch: '$(2x)^2 - 2(2x)(5) + 5^2$.'
    anki_seeds:
      - front: "(a + b)^2 = ?"
        back: "a^2 + 2ab + b^2"
        type: basic
      - front: "(a + b)(a - b) = ?"
        back: "a^2 - b^2"
        type: basic

  - id: binomial-cubes
    name: Cubing a Binomial
    core: false                # special-product extension, terminal
    difficulty: 0.60
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: special-products
        weight: 0.7
        key: true
      - id: polynomial-multiplication
        weight: 0.6
        key: true
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Expand (a + b)^3 by repeated multiplication
        key_prerequisites: [special-products, polynomial-multiplication]
        exemplars:
          - problem: 'Expand $(x + 5)^3$.'
            answer: "x^3 + 15x^2 + 75x + 125"
            solution_sketch: '$(x+5)^2 = x^2 + 10x + 25$; multiply by $(x+5)$.'
          - problem: 'A cube has edge length $(x + 1)$. Write its volume as a polynomial in standard form.'
            answer: "x^3 + 3x^2 + 3x + 1"
            solution_sketch: 'Volume is edge cubed: $(x+1)^2 = x^2 + 2x + 1$; multiply by $(x+1)$.'
          - problem: 'A product grid has rows $x,2$ and columns $x^2,4x,4$, the terms of $(x+2)^2$. Sum all cells to expand $(x+2)^3$.'
            answer: "x^3 + 6x^2 + 12x + 8"
            solution_sketch: 'With $a = x$, $b = 2$: $x^3 + 3(x^2)(2) + 3(x)(4) + 8$.'
          - problem: 'A student expands $(x+3)^3$ as $x^3+9x^2+9x+27$. Correct it by multiplying $(x+3)^2$ by $(x+3)$.'
            answer: "x^3 + 9x^2 + 27x + 27"
            solution_sketch: 'The square is $x^2+6x+9$. The linear terms in the next product are $18x+9x=27x$, giving $x^3+9x^2+27x+27$.'
        constraints: "square first, then multiply by the remaining factor"
      - id: kp2
        name: Cubes of differences
        key_prerequisites: [special-products, polynomial-multiplication]
        exemplars:
          - problem: 'Expand $(x - 3)^3$.'
            answer: "x^3 - 9x^2 + 27x - 27"
            solution_sketch: 'First square to obtain $x^2-6x+9$. Multiply by $x-3$: the quadratic terms total $-9x^2$, linear terms total $27x$, and the constant is $-27$.'
          - problem: 'A cube has edge length $(x - 2)$. Write its volume as a polynomial in standard form.'
            answer: "x^3 - 6x^2 + 12x - 8"
            solution_sketch: 'Volume is edge cubed: $(x-2)^2 = x^2 - 4x + 4$; multiply by $(x-2)$.'
          - problem: 'Use the binomial-cube pattern $a^3 - 3a^2b + 3ab^2 - b^3$ to expand $(x - 4)^3$.'
            answer: "x^3 - 12x^2 + 48x - 64"
            solution_sketch: 'With $a = x$, $b = 4$: $x^3 - 3(x^2)(4) + 3(x)(16) - 64$.'
          - problem: 'Correct the sign error in $(x-5)^3=x^3-15x^2-75x-125$ by multiplying $(x-5)^2$ by $(x-5)$.'
            answer: "x^3 - 15x^2 + 75x - 125"
            solution_sketch: 'The square is $x^2-10x+25$. The linear products are $50x+25x=75x$; the constant is $-125$.'
        constraints: "alternating signs in the expansion"
      - id: kp3
        name: Use the formula a^3 ± 3a^2b + 3ab^2 ± b^3
        key_prerequisites: [special-products]
        exemplars:
          - problem: 'Expand $(2x + 1)^3$ using the binomial-cube pattern.'
            answer: "8x^3 + 12x^2 + 6x + 1"
            solution_sketch: '$a = 2x$, $b = 1$: $8x^3 + 3(4x^2) + 3(2x) + 1$.'
          - problem: 'A cube has side $x+4$. Use coefficients $1,3,3,1$ to write its volume polynomial.'
            answer: "x^3 + 12x^2 + 48x + 64"
            solution_sketch: '$a = x$, $b = 4$: $x^3 + 3(4x^2) + 3(16x) + 64$.'
          - problem: 'In a binomial-cube coefficient table, substitute $a=3x$, $b=1$ into columns $a^3,3a^2b,3ab^2,b^3$. Write their sum.'
            answer: "27x^3 + 27x^2 + 9x + 1"
            solution_sketch: '$a = 3x$, $b = 1$: $27x^3 + 3(9x^2) + 3(3x) + 1$.'
          - problem: 'Correct $(x+5)^3=x^3+15x^2+15x+125$ using the binomial-cube formula.'
            answer: "x^3 + 15x^2 + 75x + 125"
            solution_sketch: '$a = x$, $b = 5$: $x^3 + 3(5x^2) + 3(25x) + 125$.'
        constraints: "coefficients 1-3-3-1 with powers stepping down"
    diagnostic_exemplar:
      problem: 'Expand $(2x - 1)^3$.'
      answer: '8x^3 - 12x^2 + 6x - 1'
      solution_sketch: 'Coefficients $1, 3, 3, 1$ with $a = 2x$ and $b = -1$.'
    anki_seeds:
      - front: "(a + b)^3 = ?"
        back: "a^3 + 3a^2 b + 3ab^2 + b^3"
        type: basic

  - id: dividing-polynomials-by-monomials
    name: Dividing a Polynomial by a Monomial
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: exponent-product-quotient-rules
        weight: 0.7
        key: true
      - id: multiplying-monomials-polynomials
        weight: 0.5
        key: true
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Divide each term by the monomial
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Divide $\frac{6x^3 - 9x^2 + 3x}{3x}$.'
            answer: "2x^2 - 3x + 1"
            solution_sketch: 'The three quotients are $6x^3/(3x)=2x^2$, $-9x^2/(3x)=-3x$, and $3x/(3x)=1$. Add them.'
          - problem: 'Divide $\frac{8x^4 + 4x^2}{4x^2}$.'
            answer: "2x^2 + 1"
            solution_sketch: 'Divide each term: $8x^4/(4x^2)=2x^2$ and $4x^2/(4x^2)=1$. The quotient is $2x^2+1$.'
          - problem: 'A rectangle has area $15x^4-5x^2$ and width $5x^2$, for $x>1$. Write its length polynomial.'
            answer: "3x^2 - 1"
            solution_sketch: 'Length is area divided by width. The term quotients are $15x^4/(5x^2)=3x^2$ and $-5x^2/(5x^2)=-1$.'
          - problem: 'A quotient table divides terms $6x^5$ and $-9x^3$ by $3x^2$. Combine the two quotients.'
            answer: "2x^3 - 3x"
            solution_sketch: 'Divide coefficients and subtract the divisor''s exponent: $6x^5/(3x^2)=2x^3$ and $-9x^3/(3x^2)=-3x$.'
        constraints: "every term divisible; positive coefficients on the divisor"
      - id: kp2
        name: Negative coefficients and signs
        key_prerequisites: [exponent-product-quotient-rules, integer-multiplication-division]
        exemplars:
          - problem: 'Divide $\frac{-10x^3 + 5x^2}{5x}$.'
            answer: "-2x^2 + x"
            solution_sketch: '$-10/5 = -2$; $5/5 = 1$.'
          - problem: 'Divide $\frac{12x^5 - 8x^3}{-4x^2}$.'
            answer: "-3x^3 + 2x"
            solution_sketch: '$12/-4 = -3$; $-8/-4 = 2$.'
          - problem: 'Correct $(-6x^4+9x^3)/(3x^2)=-2x^2+3x^3$ by checking the exponent subtraction.'
            answer: "-2x^2 + 3x"
            solution_sketch: 'Each term divides by $3x^2$: $-6x^4$ gives $-2x^2$ and $9x^3$ gives $3x$.'
          - problem: 'Divide $\frac{-20x^4 + 15x^3 - 5x^2}{-5x^2}$.'
            answer: "4x^2 - 3x + 1"
            solution_sketch: 'Divide all three terms by $-5x^2$: $-20x^4$ gives $4x^2$, $15x^3$ gives $-3x$, and $-5x^2$ gives $1$.'
        constraints: "track the sign of each quotient term"
      - id: kp3
        name: Two variables
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Divide $\frac{9x^2y^3 + 6xy^2}{3xy}$.'
            answer: "3xy^2 + 2y"
            solution_sketch: 'The quotients are $9x^2y^3/(3xy)=3xy^2$ and $6xy^2/(3xy)=2y$, found by subtracting the exponents of each variable.'
          - problem: 'Divide $\frac{4a^3b - 2a^2b^2}{2a^2b}$.'
            answer: "2a - b"
            solution_sketch: 'Divide $4a^3b$ by $2a^2b$ to get $2a$. Divide $-2a^2b^2$ by the same divisor to get $-b$. Add the two quotients.'
          - problem: 'For nonzero $x,y$, a product equals $15x^3y^2+10x^2y^3$ and one factor is $5x^2y$. Find the other polynomial factor.'
            answer: "3xy + 2y^2"
            solution_sketch: 'Divide coefficients and subtract exponents per variable: $3xy$ and $2y^2$.'
          - problem: 'Correct $(8a^2b^3-4ab^2)/(4ab)=2ab^2-1$ by dividing the second term in both variables.'
            answer: "2ab^2 - b"
            solution_sketch: 'Divide coefficients and subtract exponents per variable: $2ab^2$ and $-b$.'
        constraints: "each variable handled separately"
    diagnostic_exemplar:
      problem: 'Divide $\frac{9x^3y^2 - 6x^2y}{-3x^2y}$.'
      answer: '-3xy + 2'
      solution_sketch: '$\frac{9x^3y^2}{-3x^2y} = -3xy$ and $\frac{-6x^2y}{-3x^2y} = 2$.'
    anki_seeds:
      - front: "To divide a polynomial by a monomial ..."
        back: "divide every term of the polynomial by the monomial"
        type: basic

  - id: polynomial-division
    name: Dividing Polynomials
    core: true                 # promoted: prerequisite of calculus-2 core topics (partial fractions)
    difficulty: 0.65
    drill: false
    answer_kind: expression
    expected_time_secs: 180
    prerequisites:
      - id: dividing-polynomials-by-monomials
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.6
        key: true
      - id: polynomial-addition-subtraction
        weight: 0.6
        key: true
      - id: distributive-property
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Long division with no remainder
        key_prerequisites: [polynomial-multiplication]
        exemplars:
          - problem: 'Divide $\frac{x^2 + 5x + 6}{x + 2}$.'
            answer: "x + 3"
            solution_sketch: 'The leading quotient is $x$. Subtract $x(x+2)$ to leave $3x+6$; then divide by $x+2$ to get $3$. The quotient is $x+3$ with remainder zero.'
          - problem: 'Divide $\frac{x^2 - 7x + 12}{x - 3}$.'
            answer: "x - 4"
            solution_sketch: 'The leading quotient is $x$. Subtract $x(x-3)$ to leave $-4x+12$; the next quotient term is $-4$, leaving no remainder.'
          - problem: 'Use long division to find the missing polynomial $Q$ in $x^2+x-6=(x-2)Q$.'
            answer: "x + 3"
            solution_sketch: 'Long division starts with $x$. Subtract $x(x-2)$ from the dividend to leave $3x-6$; dividing once more gives $3$ and zero remainder.'
          - problem: 'A rectangle has area $x^2-x-20$ and width $x+4$, with $x>5$. Use long division to find its length.'
            answer: "x - 5"
            solution_sketch: 'Length is the area divided by $x+4$. The first quotient term $x$ leaves $-5x-20$ after subtraction; the next term $-5$ leaves remainder zero.'
        constraints: "quadratic over linear; exact division"
      - id: kp2
        name: Long division with a remainder
        key_prerequisites: [polynomial-multiplication, polynomial-addition-subtraction]
        exemplars:
          - problem: 'Divide $\frac{x^2 + 3x + 5}{x + 1}$. Give quotient and remainder.'
            answer: "x + 2 remainder 3"
            solution_sketch: '$(x+1)(x+2) = x^2 + 3x + 2$; $5 - 2 = 3$ remainder.'
          - problem: 'Divide $\frac{2x^2 - x - 1}{x - 2}$.'
            answer: "2x + 3 remainder 5"
            solution_sketch: '$(x-2)(2x+3) = 2x^2 - x - 6$; $-1 - (-6) = 5$.'
          - problem: 'Find $Q$ and $R$ in $x^2+5x+8=(x+2)Q+R$, where $R$ is constant, using long division.'
            answer: "x + 3 remainder 2"
            solution_sketch: '$(x+2)(x+3) = x^2 + 5x + 6$; $8 - 6 = 2$ remainder.'
          - problem: 'A student divides $3x^2-x+4$ by $x-1$ and proposes quotient $3x+2$ and remainder $2$. Correct the quotient-remainder result.'
            answer: "3x + 2 remainder 6"
            solution_sketch: '$(x-1)(3x+2) = 3x^2 - x - 2$; $4 - (-2) = 6$ remainder.'
        constraints: "state quotient and remainder separately"
      - id: kp3
        name: Missing terms in the dividend
        key_prerequisites: [polynomial-multiplication, polynomial-addition-subtraction]
        exemplars:
          - problem: 'Divide $\frac{x^3 - 8}{x - 2}$.'
            answer: "x^2 + 2x + 4"
            solution_sketch: 'Use dividend coefficients $1,0,0,-8$. Subtract $x^2(x-2)$ to leave $2x^2-8$, then $2x(x-2)$ to leave $4x-8$, and finally $4(x-2)$. The quotient is $x^2+2x+4$.'
          - problem: 'Divide $\frac{x^3 + 1}{x + 1}$.'
            answer: "x^2 - x + 1"
            solution_sketch: 'Use $x^3+0x^2+0x+1$. Quotient terms $x^2$, $-x$, and $1$ successively leave remainders $-x^2+1$, $x+1$, and $0$.'
          - problem: 'A coefficient row for the dividend is $(1,0,0,-27)$ in descending cubic order. Divide by $x-3$ using long division and write the quotient.'
            answer: "x^2 + 3x + 9"
            solution_sketch: 'Use $x^3+0x^2+0x-27$. Successive quotient terms $x^2$, $3x$, and $9$ leave $3x^2-27$, then $9x-27$, then zero.'
          - problem: 'Use long division with zero placeholders to find $Q$ in $x^3+8=(x+2)Q$.'
            answer: "x^2 - 2x + 4"
            solution_sketch: 'Use $x^3+0x^2+0x+8$. The quotient terms $x^2$, $-2x$, and $4$ leave $-2x^2+8$, then $4x+8$, then zero.'
        constraints: "write 0-coefficient placeholders for absent powers"
    diagnostic_exemplar:
      problem: 'Divide $\frac{x^3 + 5}{x - 1}$. Give quotient and remainder.'
      answer: "x^2 + x + 1 remainder 6"
      solution_sketch: 'Restore the missing terms as $x^3 + 0x^2 + 0x + 5$; synthetic division by $c = 1$ gives the row $1, 1, 1$ with remainder $6$.'
    anki_seeds:
      - front: "Before polynomial long division, rewrite the dividend with..."
        back: "0-coefficient placeholders for any missing powers."
        type: basic
      - front: "Check for polynomial division: dividend = ?"
        back: "divisor × quotient + remainder"
        type: basic

  - id: synthetic-division
    name: Synthetic Division
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: expression
    expected_time_secs: 150
    prerequisites:
      - id: polynomial-division
        weight: 0.8
        key: true
      - id: evaluating-polynomials
        weight: 0.4
        key: true
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Synthetic division by x - c
        key_prerequisites: [polynomial-division]
        exemplars:
          - problem: 'Use synthetic division to divide $x^2 + 5x + 6$ by $x + 2$.'
            answer: "x + 3"
            solution_sketch: '$c = -2$; row $1, 5, 6$ gives $1, 3, 0$.'
          - problem: 'Use synthetic division to divide $x^3 - 6x^2 + 11x - 6$ by $x - 1$.'
            answer: "x^2 - 5x + 6"
            solution_sketch: '$c = 1$; $1, -5, 6, 0$.'
          - problem: 'The dividend coefficient row is $(1,-1,-6)$. Use synthetic value $3$ to find the quotient polynomial.'
            answer: "x + 2"
            solution_sketch: '$c = 3$; row $1, -1, -6$ gives $1, 2, 0$.'
          - problem: 'Use synthetic division to find $Q$ in $x^3-3x^2-4x+12=(x-2)Q$.'
            answer: "x^2 - x - 6"
            solution_sketch: '$c = 2$; row $1, -3, -4, 12$ gives $1, -1, -6, 0$.'
        constraints: "linear divisor with leading coefficient 1; remainder 0"
      - id: kp2
        name: Read off the remainder
        key_prerequisites: [polynomial-division]
        exemplars:
          - problem: 'Use synthetic division to divide $x^2 + 3x + 5$ by $x + 1$. Give quotient and remainder.'
            answer: "x + 2 remainder 3"
            solution_sketch: '$c = -1$; $1, 2, 3$.'
          - problem: 'Use synthetic division to divide $2x^3 - 3x + 1$ by $x - 2$. Give quotient and remainder.'
            answer: "2x^2 + 4x + 5 remainder 11"
            solution_sketch: 'Insert $0$ for the missing $x^2$: $2, 4, 5, 11$.'
          - problem: 'The coefficient row $(1,1,4)$ is divided using synthetic value $1$. Give the quotient polynomial and remainder.'
            answer: "x + 2 remainder 6"
            solution_sketch: '$c = 1$; row $1, 1, 4$ gives $1, 2, 6$.'
          - problem: 'A student uses coefficient row $(2,-1,5)$ for $(2x^3-x+5)/(x-1)$. Restore the missing-power placeholder and give the correct quotient and remainder.'
            answer: "2x^2 + 2x + 1 remainder 6"
            solution_sketch: 'Insert $0$ for the missing $x^2$: $2, 2, 1, 6$.'
        constraints: "include 0 placeholders for missing powers"
      - id: kp3
        name: The remainder theorem
        key_prerequisites: [evaluating-polynomials, polynomial-division]
        exemplars:
          - problem: 'Without dividing, find the remainder when $x^2 - 4x + 7$ is divided by $x - 3$.'
            answer: "4"
            solution_sketch: '$p(3) = 9 - 12 + 7 = 4$.'
          - problem: 'Without dividing, find the remainder when $x^3 - 2x^2 + x - 5$ is divided by $x - 2$.'
            answer: "-3"
            solution_sketch: '$p(2) = 8 - 8 + 2 - 5 = -3$.'
          - problem: 'A division identity reads $x^2+3x-1=(x-2)Q(x)+R$. Find the constant $R$ by substitution, without finding $Q$.'
            answer: "9"
            solution_sketch: '$p(2) = 4 + 6 - 1 = 9$.'
          - problem: 'A polynomial evaluator reports $p(1)=-3$ for $p(x)=x^3+x^2-5$. What remainder must division by $x-1$ leave?'
            answer: "-3"
            solution_sketch: 'At $x=1$, the term $(x-1)Q(x)$ vanishes, so the division identity gives $R=p(1)=-3$.'
        constraints: "remainder on division by x - c equals p(c)"
    diagnostic_exemplar:
      problem: 'Use synthetic division to divide $x^3 - 4x + 6$ by $x + 2$. Give quotient and remainder.'
      answer: 'x^2 - 2x remainder 6'
      solution_sketch: '$c = -2$; the row $1, 0, -4, 6$ gives $1, -2, 0$ with remainder $6$.'
    anki_seeds:
      - front: "Remainder theorem: dividing p(x) by (x - c) leaves remainder ..."
        back: "p(c)"
        type: basic
      - front: "Synthetic division works only when the divisor has the form ..."
        back: "x - c (linear, leading coefficient 1)"
        type: basic

  - id: gcf-of-monomials
    name: GCF of Monomials
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: gcf-lcm
        weight: 0.8
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.5
        key: true
      - id: prime-factorization
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: GCF of coefficients
        key_prerequisites: [gcf-lcm]
        step_check:
          step: 'The shared prime factors give $2\cdot13=26$'
          question: 'Why does the GCF use $2\cdot13$ and not $2^2\cdot13$?'
          options:
            - 'A GCF never contains a squared prime'
            - '$78=2\cdot3\cdot13$ has only one factor of $2$'
            - 'The smaller number $52$ sets every exponent'
          answer: '$78=2\cdot3\cdot13$ has only one factor of $2$'
          why: 'A common factor must divide both numbers, so each shared prime takes the lower of its two exponents: $2^1$ because $78$ has a single $2$, and $13^1$.'
        exemplars:
          - problem: 'Find the GCF of $28$ and $42$.'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $28 = 2^2 \cdot 7$ and $42 = 2 \cdot 3 \cdot 7$. The shared primes with their lower exponents are $2$ and $7$, so the GCF is $2 \cdot 7 = 14$.'
          - problem: 'Find the greatest common factor of $18$ and $45$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $18 = 2 \cdot 3^2$ and $45 = 3^2 \cdot 5$. Only the prime $3$ is shared, with lower exponent $2$, so the GCF is $3^2 = 9$.'
          - problem: 'A florist has $24$ roses and $36$ lilies. What is the greatest number of identical bouquets she can make using every flower?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of bouquets must divide both $24$ and $36$. Their greatest common factor is $2^2 \cdot 3 = 12$, so she can make $12$ bouquets of $2$ roses and $3$ lilies.'
          - problem: 'Sam says the GCF of $16$ and $40$ is $4$. What is the correct GCF?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both numbers are multiples of $8$: $16 = 2 \cdot 8$ and $40 = 5 \cdot 8$. The quotients $2$ and $5$ share no factor, so the GCF is $8$, not $4$.'
          - problem: 'A rectangular floor measures $84$ cm by $56$ cm. It is to be covered with equal square tiles, without cutting any tile. What is the largest possible side length of a tile?'
            answer: '28'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The tile side must divide both $84$ and $56$ exactly. Since $84 = 2^2 \cdot 3 \cdot 7$ and $56 = 2^3 \cdot 7$, the GCF is $2^2 \cdot 7 = 28$, so the largest tile has side $28$ cm.'
          - problem: 'Find the GCF of $36$, $60$ and $84$.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factor $36 = 2^2 \cdot 3^2$, $60 = 2^2 \cdot 3 \cdot 5$ and $84 = 2^2 \cdot 3 \cdot 7$. The primes in all three are $2^2$ and $3$, so the GCF is $12$.'
          - problem: 'A teacher packs $48$ pencils and $72$ erasers into identical packs with nothing left over. What is the greatest number of packs she can make?'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of packs must divide both $48$ and $72$. Since $48 = 2^4 \cdot 3$ and $72 = 2^3 \cdot 3^2$, the GCF is $2^3 \cdot 3 = 24$, giving $24$ packs of $2$ pencils and $3$ erasers.'
        constraints: "two-digit integers"
      - id: kp2
        name: GCF of one-variable monomials
        key_prerequisites: [gcf-lcm, exponent-product-quotient-rules]
        step_check:
          step: 'The lowest shared power is $x^3$'
          question: 'Why is the variable part of the GCF $x^3$ rather than $x^5$?'
          options:
            - 'The GCF takes the power from the term with the smaller coefficient'
            - 'The GCF takes the higher power so that both terms fit inside it'
            - '$x^3$ divides both $x^5$ and $x^3$, but $x^5$ does not divide $x^3$'
          answer: '$x^3$ divides both $x^5$ and $x^3$, but $x^5$ does not divide $x^3$'
          why: 'A common factor must divide every term: $x^5 = x^3 \cdot x^2$, while $x^5$ is too big to divide $25x^3$.'
        exemplars:
          - problem: 'Find the GCF of $12x^3$ and $18x^2$.'
            answer: '6x^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient GCF is $\gcd(12, 18) = 6$. The lowest power of $x$ in both terms is $x^2$, so the GCF is $6x^2$.'
          - problem: 'Find the greatest common factor of $8x^2$ and $20x$.'
            answer: '4x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient GCF is $\gcd(8, 20) = 4$. The lowest power of $x$ is $x^1$, so the GCF is $4x$.'
          - problem: 'Two rectangles have areas $14x^3$ and $21x^5$ square units, and they have the same width, a monomial. What is the largest possible width?'
            answer: '7x^3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A common width must divide both areas, so the largest one is their GCF. The coefficient GCF is $7$ and the lowest power is $x^3$, giving $7x^3$.'
          - problem: 'Sam says the GCF of $15x^4$ and $25x^2$ is $5x^4$. What is the correct GCF?'
            answer: '5x^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient GCF $5$ is right. But $x^4$ does not divide $25x^2$; the lowest power is $x^2$, so the GCF is $5x^2$.'
          - problem: 'What is the largest monomial that divides both terms of $9x^3 + 6x$?'
            answer: '3x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient GCF of $9$ and $6$ is $3$. The lowest power of $x$ in the two terms is $x^1$, so the largest common monomial is $3x$.'
          - problem: 'Boards of lengths $20x^3$ and $30x^2$ are cut into pieces that all have the same length, a monomial, with nothing left over. What is the longest possible piece?'
            answer: '10x^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The piece length must divide both board lengths, so the longest piece is their GCF. The coefficient GCF is $10$ and the lowest power is $x^2$, giving $10x^2$.'
          - problem: 'Find the GCF of $16a^5$ and $24a^3$.'
            answer: '8a^3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient GCF is $\gcd(16, 24) = 8$. The lowest power of $a$ is $a^3$, so the GCF is $8a^3$.'
        constraints: "take the lowest power of the shared variable"
      - id: kp3
        name: GCF with two variables or three monomials
        key_prerequisites: [gcf-lcm, exponent-product-quotient-rules]
        step_check:
          step: 'The lowest exponents are $2$ for both $x$ and $y$'
          question: 'Why does the GCF of $20x^3y^2$ and $30x^2y^4$ contain $y^2$ and not $y^4$?'
          options:
            - 'Only $y^2$ divides $20x^3y^2$, so it is the highest common power'
            - 'The coefficient GCF $10$ fixes the exponent of $y$'
            - 'The exponent of $y$ is the larger exponent divided by two'
          answer: 'Only $y^2$ divides $20x^3y^2$, so it is the highest common power'
          why: 'Each variable takes the lowest exponent that appears in every term; $20x^3y^2$ has only $y^2$, so $y^4$ cannot divide it.'
        exemplars:
          - problem: 'Find the GCF of $12x^2y^3$ and $18xy^4$.'
            answer: '6xy^3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient GCF is $6$. The lowest powers are $x^1$ and $y^3$, so the GCF is $6xy^3$.'
          - problem: 'Find the GCF of $6x^3$, $9x^2$ and $12x$.'
            answer: '3x'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient GCF of $6$, $9$ and $12$ is $3$. The lowest power of $x$ among the three terms is $x^1$, so the GCF is $3x$.'
          - problem: 'Find the greatest common factor of $10a^3b^2$ and $15ab^4$.'
            answer: '5ab^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient GCF is $5$. The lowest powers are $a^1$ and $b^2$, so the GCF is $5ab^2$.'
          - problem: 'Sam says the GCF of $8x^2y$, $12xy^2$ and $20xy$ is $4x^2y^2$. What is the correct GCF?'
            answer: '4xy'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient GCF $4$ is right. But $20xy$ contains only $x^1$ and $y^1$, so neither $x^2$ nor $y^2$ is common, and the GCF is $4xy$.'
          - problem: 'Three rectangular panels have areas $18x^2y$, $24xy^2$ and $30xy$ square units, and all three have the same width, a monomial. What is the largest possible width?'
            answer: '6xy'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A common width must divide all three areas, so the largest one is their GCF. The coefficient GCF of $18$, $24$ and $30$ is $6$, and the lowest powers are $x^1$ and $y^1$, giving $6xy$.'
          - problem: 'Two rectangular plots have areas $16m^3n^2$ and $40m^2n^3$ square metres and the same width, a monomial. Find the largest possible width.'
            answer: '8m^2n^2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The width must divide both areas, so the largest width is their GCF. The coefficient GCF is $8$ and the lowest powers are $m^2$ and $n^2$, giving $8m^2n^2$.'
          - problem: 'Find the GCF of $x^2y$ and $xy^2z$.'
            answer: 'xy'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both terms contain $x$ and $y$, each at least to the first power. The variable $z$ is missing from $x^2y$, so it is not shared, and the GCF is $xy$.'
        constraints: "lowest power of each shared variable"
    diagnostic_exemplar:
      problem: 'Find the GCF of $12x^3y^2$ and $18x^2y^4$.'
      answer: '6x^2 y^2'
      solution_sketch: 'GCF$(12, 18) = 6$; take the lowest power of each variable, $x^2$ and $y^2$.'
    anki_seeds:
      - front: "The GCF of two monomials takes the ___ power of each shared variable."
        back: "lowest"
        type: basic

  - id: factoring-gcf
    name: Factoring Out the Greatest Common Factor
    core: true
    difficulty: 0.5
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: gcf-of-monomials
        weight: 0.8
        key: true
      - id: distributive-property
        weight: 1.0
        key: true
      - id: polynomial-multiplication
        weight: 0.3
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Factor the GCF out of a polynomial
        key_prerequisites: [distributive-property, gcf-of-monomials]
        step_check:
          step: 'Divide each term by $7xy$'
          question: 'Why is each term divided by $7xy$ to find what goes inside the brackets?'
          options:
            - 'Dividing by the GCF turns every term in the brackets into $1$'
            - 'The bracket times $7xy$ must give back each original term'
            - 'Dividing removes the variables, so the bracket holds only numbers'
          answer: 'The bracket times $7xy$ must give back each original term'
          why: 'Factoring undoes distribution: $7xy \cdot 2x = 14x^2y$ and $7xy \cdot 3 = 21xy$, so the bracket holds the quotients $2x$ and $3$.'
        exemplars:
          - problem: 'Factor $6x^2 + 9x$.'
            answer: '3x(2x + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The GCF of $6x^2$ and $9x$ is $3x$. Dividing gives $6x^2 \div 3x = 2x$ and $9x \div 3x = 3$, so $6x^2 + 9x = 3x(2x + 3)$.'
          - problem: 'Factor $10x^3 - 15x^2 + 20x$.'
            answer: '5x(2x^2 - 3x + 4)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The coefficient GCF is $5$ and every term contains $x$, so the GCF is $5x$. Dividing each term by $5x$ leaves $2x^2 - 3x + 4$, which has no integer factors.'
          - problem: 'Factor $8y^2 + 12y$.'
            answer: '4y(2y + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The GCF of $8y^2$ and $12y$ is $4y$. Dividing gives $2y$ and $3$, so the factored form is $4y(2y + 3)$.'
          - problem: 'Sam factors $9x^3 - 6x^2 + 3x$ as $3x(3x^2 - 2x)$. What is the correct factorization?'
            answer: '3x(3x^2 - 2x + 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam lost the last term: $3x \div 3x = 1$, not $0$. The quotients are $3x^2$, $-2x$ and $1$, so the factorization is $3x(3x^2 - 2x + 1)$.'
          - problem: 'A rectangle has area $12x^2 + 8x$ square centimetres and width $4x$ centimetres. Find its length.'
            answer: '3x + 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width. Dividing each term by $4x$ gives $12x^2 \div 4x = 3x$ and $8x \div 4x = 2$, so the length is $3x + 2$ centimetres.'
          - problem: 'The height of a ball $t$ seconds after it is kicked is $20t - 5t^2$ metres. Factor this expression.'
            answer: '5t(4 - t)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms contain $5$ and $t$, so the GCF is $5t$. Dividing gives $20t \div 5t = 4$ and $-5t^2 \div 5t = -t$, so the height is $5t(4 - t)$, which is zero at $t = 0$ and $t = 4$.'
          - problem: 'Factor $12a^2b - 18ab^2$.'
            answer: '6ab(2a - 3b)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The coefficient GCF is $6$, and both terms contain $a$ and $b$ to at least the first power. Dividing by $6ab$ leaves $2a - 3b$, so the result is $6ab(2a - 3b)$.'
          - problem: 'A garden has area $x^2 + 6x$ square metres and width $x$ metres. How long is it?'
            answer: 'x + 6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width. Since $x^2 + 6x = x(x + 6)$, dividing by $x$ leaves a length of $x + 6$ metres.'
        constraints: "verify by redistributing"
      - id: kp2
        name: Factor out a negative or higher-power GCF
        key_prerequisites: [integer-multiplication-division, gcf-of-monomials]
        step_check:
          step: 'The term quotients are $2x^2$, $-5x$ and $1$'
          question: 'Why is the last quotient $1$?'
          options:
            - 'Every bracket must end with $+1$ after factoring'
            - 'The $1$ stands for the $x$ that moved outside the bracket'
            - 'The last term $-2x$ equals the factor, and $-2x \div (-2x) = 1$'
          answer: 'The last term $-2x$ equals the factor, and $-2x \div (-2x) = 1$'
          why: 'Each term is divided by $-2x$; a term equal to the factor leaves $1$, and without it redistributing would lose the term $-2x$.'
        exemplars:
          - problem: 'Factor out $-4x$ from $-4x^2 - 8x$.'
            answer: '-4x(x + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Divide each term by $-4x$: $-4x^2 \div (-4x) = x$ and $-8x \div (-4x) = 2$. The result is $-4x(x + 2)$.'
          - problem: 'Factor $14x^4 + 21x^3 - 7x^2$.'
            answer: '7x^2(2x^2 + 3x - 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The coefficients share $7$ and the lowest power is $x^2$, so the GCF is $7x^2$. Dividing leaves $2x^2 + 3x - 1$, which has no integer factors.'
          - problem: 'Sam factors $12x^4 - 8x^3 + 4x^2$ as $4x^2(3x^2 - 2x)$. What is the correct factorization?'
            answer: '4x^2(3x^2 - 2x + 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The last term $4x^2$ equals the GCF, so it leaves $1$ in the bracket. The quotients are $3x^2$, $-2x$ and $1$, giving $4x^2(3x^2 - 2x + 1)$.'
          - problem: 'A ball is thrown upward, and its height after $t$ seconds is $-16t^2 + 48t$ feet. Factor this expression by taking out $-16t$.'
            answer: '-16t(t - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Divide each term by $-16t$: $-16t^2 \div (-16t) = t$ and $48t \div (-16t) = -3$. So the height is $-16t(t - 3)$, which is zero when $t = 0$ or $t = 3$.'
          - problem: 'A box has volume $6x^3 + 9x^2$ cubic units, and its base has area $3x^2$ square units. Find its height.'
            answer: '2x + 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Height is volume divided by base area. Dividing each term by $3x^2$ gives $2x$ and $3$, so the height is $2x + 3$ units.'
          - problem: 'Factor $-5x^3 + 15x^2 - 5x$ by taking out a negative common factor.'
            answer: '-5x(x^2 - 3x + 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The GCF is $5x$; take out $-5x$. Dividing gives $x^2$, $-3x$ and $1$, so the result is $-5x(x^2 - 3x + 1)$.'
          - problem: 'Factor $-6x^2 - 9x$ by taking out a negative common factor.'
            answer: '-3x(2x + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The GCF of the magnitudes is $3x$, so take out $-3x$. Dividing gives $2x$ and $3$, and the result is $-3x(2x + 3)$.'
        constraints: "watch the leftover 1 when a term equals the GCF"
      - id: kp3
        name: Factor out a common binomial
        key_prerequisites: [distributive-property]
        step_check:
          step: 'Factor $(x - 6)$ out of both terms'
          question: 'Why can $(x - 6)$ be factored out of $5x(x - 6) + 2(x - 6)$?'
          options:
            - 'It multiplies both terms, so the distributive law runs in reverse'
            - 'Both terms contain $x$, so $x - 6$ is the GCF of $5x$ and $2$'
            - 'The brackets must be expanded first and then regrouped'
          answer: 'It multiplies both terms, so the distributive law runs in reverse'
          why: 'The sum has the form $5x \cdot B + 2 \cdot B$ with $B = x - 6$, which equals $(5x + 2)B$.'
        exemplars:
          - problem: 'Factor $3x(x + 2) + 5(x + 2)$.'
            answer: '(x + 2)(3x + 5)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms contain the binomial $(x + 2)$. Taking it out leaves $3x$ and $5$, so the product is $(x + 2)(3x + 5)$.'
          - problem: 'Two rectangles share the width $x - 4$ and have lengths $x$ and $3$, where $x > 4$. Their total area is $x(x - 4) + 3(x - 4)$. Write the total area as a single product.'
            answer: '(x - 4)(x + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both areas contain the width $(x - 4)$. Taking it out leaves the combined length $x + 3$, so the total area is $(x - 4)(x + 3)$.'
          - problem: 'Factor $4y(y + 5) + 3(y + 5)$.'
            answer: '(y + 5)(4y + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The common binomial is $(y + 5)$. The factors left behind are $4y$ and $3$, so the product is $(y + 5)(4y + 3)$.'
          - problem: 'Sam writes $2x(x - 1) - 5(x - 1) = (x - 1)(2x)$. What is the correct factorization?'
            answer: '(x - 1)(2x - 5)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms contain $(x - 1)$. The factors left behind are $2x$ and $-5$, so Sam dropped the $-5$; the result is $(x - 1)(2x - 5)$.'
          - problem: 'Factor $x(x - 7) - (x - 7)$.'
            answer: '(x - 7)(x - 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The second term is $-1 \cdot (x - 7)$. Taking out $(x - 7)$ leaves $x$ and $-1$, so the result is $(x - 7)(x - 1)$.'
          - problem: 'A garden has two rectangular beds side by side, both $x + 6$ metres deep. Their widths are $2x$ metres and $5$ metres. Write the total area as a single product.'
            answer: '(x + 6)(2x + 5)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The areas are $2x(x + 6)$ and $5(x + 6)$. Both contain $(x + 6)$, so the total area is $(x + 6)(2x + 5)$ square metres.'
          - problem: 'Factor $a(b + 4) - 3(b + 4)$.'
            answer: '(b + 4)(a - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Both terms contain the binomial $(b + 4)$. Taking it out leaves $a$ and $-3$, so the result is $(b + 4)(a - 3)$.'
        constraints: "common factor is a binomial; sets up factoring by grouping"
    diagnostic_exemplar:
      problem: 'Factor completely: $4x(x + 1) - 8(x + 1)$.'
      answer: '4(x + 1)(x - 2)'
      solution_sketch: 'Pull out $(x + 1)$: $(x + 1)(4x - 8)$, then factor $4$ from the second bracket.'
    anki_seeds:
      - front: "The first step of any factoring problem:"
        back: "factor out the greatest common factor (GCF); verify by redistributing."
        type: basic
      - front: "If a polynomial's leading term is negative, factor out..."
        back: "a negative GCF, so the leading term inside the parentheses is positive."
        type: basic
      - front: "When a term equals the GCF itself, the factored form keeps..."
        back: "a 1 in its place (e.g. 5x² + 5x = 5x(x + 1))."
        type: basic

  - id: factoring-by-grouping
    name: Factoring by Grouping
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: factoring-gcf
        weight: 0.8
        key: true
      - id: distributive-property
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Group four-term polynomials
        key_prerequisites: [factoring-gcf]
        try_first:
          problem: 'Is $x^3 + 5x^2 + 2x + 10$ equal to $(x + 5)(x^2 + 2)$?'
          answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","they are equal","equal"],["no","no, it is not","it is not","they are not equal","not equal"]]}
          answer: 'yes'
          reveal: 'Expanding gives $x^3 + 2x + 5x^2 + 10$, the same four terms. Grouping runs this backwards: $x^2(x + 5) + 2(x + 5)$ shows the shared factor $x + 5$.'
        step_check:
          step: 'Extract each group GCF'
          question: 'Why is it useful that both groups leave the bracket $(x + 5)$?'
          options:
            - 'Matching brackets show the polynomial is a perfect square'
            - 'The repeated $(x + 5)$ is a common factor of the two products'
            - 'It shows that $x = 5$ makes the polynomial zero'
          answer: 'The repeated $(x + 5)$ is a common factor of the two products'
          why: '$x^2(x + 5) + 4(x + 5)$ has the form $x^2B + 4B$ with $B = x + 5$, so it equals $(x + 5)(x^2 + 4)$.'
        exemplars:
          - problem: 'Factor $x^3 + 2x^2 + 3x + 6$.'
            answer: '(x + 2)(x^2 + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Group as $x^2(x + 2) + 3(x + 2)$. Both groups contain $(x + 2)$, so the result is $(x + 2)(x^2 + 3)$.'
          - problem: 'Factor $x^3 - 4x^2 + 2x - 8$ by grouping.'
            answer: '(x - 4)(x^2 + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Group as $x^2(x - 4) + 2(x - 4)$. The common binomial is $(x - 4)$, so the result is $(x - 4)(x^2 + 2)$.'
          - problem: 'Sam groups $x^3 - 2x^2 + 7x - 14$ as $x^2(x - 2) + 7(x - 2)$ and stops. What is the factorization?'
            answer: '(x - 2)(x^2 + 7)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Sam still has a sum of two products. Both contain $x - 2$, so extract it to get $(x - 2)(x^2 + 7)$; the quadratic has no integer factors.'
          - problem: 'A box has volume $x^3 + 6x^2 + 5x + 30$ cubic centimetres and height $x + 6$ centimetres. Find the area of its base.'
            answer: 'x^2 + 5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Base area is volume divided by height. Grouping gives $x^2(x + 6) + 5(x + 6) = (x + 6)(x^2 + 5)$, so the base area is $x^2 + 5$ square centimetres.'
          - problem: 'Factor $y^3 - 5y^2 + 3y - 15$.'
            answer: '(y - 5)(y^2 + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Group as $y^2(y - 5) + 3(y - 5)$. The shared binomial is $(y - 5)$, so the result is $(y - 5)(y^2 + 3)$.'
          - problem: 'A rectangle has area $x^3 + x^2 + 9x + 9$ square units. Factor the area to find expressions for its length and width.'
            answer: '(x + 1)(x^2 + 9)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Group as $x^2(x + 1) + 9(x + 1)$, which gives $(x + 1)(x^2 + 9)$. The sides are $x + 1$ and $x^2 + 9$ units.'
          - problem: 'Factor $x^3 + 4x^2 - 3x - 12$.'
            answer: '(x + 4)(x^2 - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take $x^2$ from the first pair and $-3$ from the second: $x^2(x + 4) - 3(x + 4)$. The result is $(x + 4)(x^2 - 3)$, since $3$ is not a perfect square.'
        constraints: 'four terms with leading coefficient 1; group the first two and the last two; integer coefficients'
      - id: kp2
        name: Grouping with a common binomial factor
        key_prerequisites: [factoring-gcf, distributive-property]
        step_check:
          step: 'Extract $x^2$ and $3$'
          question: 'Why is $3$ the factor taken out of $9x + 6$?'
          options:
            - 'It matches the leading coefficient $3$ of the polynomial'
            - 'Any common factor works, and $3$ is the smallest'
            - 'It is the GCF of $9x$ and $6$ and leaves the same $3x + 2$'
          answer: 'It is the GCF of $9x$ and $6$ and leaves the same $3x + 2$'
          why: '$9x + 6 = 3(3x + 2)$ leaves the bracket that also appears in $x^2(3x + 2)$, which is what lets the binomial factor out.'
        exemplars:
          - problem: 'Factor $6x^2 + 3x + 4x + 2$.'
            answer: '(2x + 1)(3x + 2)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Group as $3x(2x + 1) + 2(2x + 1)$. The shared binomial is $(2x + 1)$, so the result is $(2x + 1)(3x + 2)$.'
          - problem: 'Factor $2x^3 - x^2 - 6x + 3$.'
            answer: '(2x - 1)(x^2 - 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take $x^2$ from the first pair and $-3$ from the second: $x^2(2x - 1) - 3(2x - 1)$. The result is $(2x - 1)(x^2 - 3)$.'
          - problem: 'Sam factors $2x^3 - 5x^2 + 6x - 15$ as $(2x - 5)(x^2 + 6)$. What is the correct factorization?'
            answer: '(2x - 5)(x^2 + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'The groups are $x^2(2x - 5)$ and $3(2x - 5)$, because $6x - 15 = 3(2x - 5)$. So the second bracket is $x^2 + 3$, not $x^2 + 6$.'
          - problem: 'A box has volume $2x^3 + 3x^2 + 8x + 12$ cubic centimetres, and its base has area $x^2 + 4$ square centimetres. Find its height.'
            answer: '2x + 3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Height is volume divided by base area. Grouping gives $x^2(2x + 3) + 4(2x + 3) = (2x + 3)(x^2 + 4)$, so the height is $2x + 3$ centimetres.'
          - problem: 'Factor $3y^3 - 2y^2 + 12y - 8$.'
            answer: '(3y - 2)(y^2 + 4)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Group as $y^2(3y - 2) + 4(3y - 2)$. The shared binomial is $(3y - 2)$, so the result is $(3y - 2)(y^2 + 4)$.'
          - problem: 'The floor of a storage unit is a rectangle with area $3x^3 - 6x^2 + 5x - 10$ square metres. Factor the area to find expressions for its length and width.'
            answer: '(x - 2)(3x^2 + 5)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Group as $3x^2(x - 2) + 5(x - 2)$, which gives $(x - 2)(3x^2 + 5)$. The sides are $x - 2$ and $3x^2 + 5$ metres.'
          - problem: 'Factor $4x^3 + 6x^2 - 2x - 3$.'
            answer: '(2x + 3)(2x^2 - 1)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Take $2x^2$ from the first pair and $-1$ from the second: $2x^2(2x + 3) - 1(2x + 3)$. The result is $(2x + 3)(2x^2 - 1)$.'
          - problem: 'Factor $ax + ay + 3x + 3y$.'
            answer: '(x + y)(a + 3)'
            answer_contract: {"kind":"required_form","form":"factored_polynomial"}
            solution_sketch: 'Group as $a(x + y) + 3(x + y)$. The shared binomial is $(x + y)$, so the result is $(x + y)(a + 3)$.'
        constraints: 'leading coefficient may exceed 1; both groups must leave the same binomial factor'
    diagnostic_exemplar:
      problem: 'Factor $2x^3 + 3x^2 - 10x - 15$.'
      answer: '(2x + 3)(x^2 - 5)'
      solution_sketch: '$x^2(2x + 3) - 5(2x + 3)$.'
    anki_seeds:
      - front: "To factor a four-term polynomial by grouping..."
        back: "factor a GCF from each pair of terms, then factor out the common binomial."
        type: basic
      - front: "Grouping has worked when..."
        back: "both groups leave the same binomial factor; if not, regroup or factor out a negative."
        type: basic

  - id: factoring-monic-trinomials
