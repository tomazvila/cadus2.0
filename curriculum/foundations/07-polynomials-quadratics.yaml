            answer: "x = 1/2 or x = -2/3"
            solution_sketch: 'disc $= 1 + 48 = 49$; $x = \frac{-1 \pm 7}{12}$.'
          - problem: 'Solve $4x^2 - 4x - 3 = 0$ using the quadratic formula.'
            answer: "x = 3/2 or x = -1/2"
            solution_sketch: 'disc $= 16 + 48 = 64$; $x = \frac{4 \pm 8}{8}$.'
        constraints: "fractional roots reduce to lowest terms"
    diagnostic_exemplar:
