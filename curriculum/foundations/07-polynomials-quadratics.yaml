  - id: discriminant
    name: The Discriminant
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: quadratic-formula
        weight: 0.6
        key: true
      - id: evaluating-expressions
        weight: 0.5
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Compute the discriminant b^2 - 4ac
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'Find the discriminant of $x^2 + 3x + 2$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coefficients are $a = 1$, $b = 3$ and $c = 2$. The discriminant is $b^2 - 4ac = 9 - 8 = 1$.'
          - problem: 'What is the discriminant of $2x^2 - 4x + 5$?'
            answer: '-24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coefficients are $a = 2$, $b = -4$ and $c = 5$. Then $b^2 - 4ac = 16 - 40 = -24$.'
          - problem: 'Sam finds the discriminant of $x^2 - 6x + 5$ as $-6^2 - 4(1)(5) = -56$. What is the correct discriminant?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam squared only the $6$ and left the minus sign outside. The square of $b = -6$ is $(-6)^2 = 36$, so $b^2 - 4ac = 36 - 20 = 16$.'
          - problem: 'Find the discriminant of $3x^2 + 5x = -1$.'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Add $1$ to both sides to get $3x^2 + 5x + 1 = 0$, so $a = 3$, $b = 5$ and $c = 1$. Then $b^2 - 4ac = 25 - 12 = 13$.'
          - problem: 'A ball''s height is $h = -5t^2 + 12t + 2$ metres after $t$ seconds. To find when the ball is $10$ m high, Mia writes $-5t^2 + 12t + 2 = 10$. Find the discriminant of this equation.'
            answer: '-16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $10$ from both sides to get $-5t^2 + 12t - 8 = 0$. So $a = -5$, $b = 12$, $c = -8$, and $b^2 - 4ac = 144 - 160 = -16$.'
          - problem: 'A rectangular lawn has width $w$ metres, length $2w + 3$ metres and area $20$ m$^2$, so $w$ satisfies $2w^2 + 3w = 20$. Find the discriminant of this equation.'
            answer: '169'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Subtract $20$ to get $2w^2 + 3w - 20 = 0$, so $a = 2$, $b = 3$ and $c = -20$. Then $b^2 - 4ac = 9 + 160 = 169$.'
          - problem: 'Find the discriminant of $y = (x - 2)^2 - 5$.'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Expanding gives $y = x^2 - 4x - 1$, so $a = 1$, $b = -4$ and $c = -1$. Then $b^2 - 4ac = 16 + 4 = 20$.'
          - problem: 'What is the discriminant of $-x^2 + 4x - 4$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $a = -1$, $b = 4$ and $c = -4$. Then $b^2 - 4ac = 16 - 16 = 0$.'
        constraints: 'integer a, b, c with coefficients at most 6 in size; answer is the signed value of b^2 - 4ac'
      - id: kp2
        name: Determine the number and nature of real roots
        key_prerequisites: [quadratic-formula]
        try_first:
          problem: 'How many real numbers $x$ satisfy $x^2 = -9$?'
          answer_contract: {"kind": "exact"}
          answer: '0'
          reveal: 'No real number has a negative square, so there are none. The discriminant detects this: when $b^2 - 4ac$ is negative, the square root in the quadratic formula is not a real number and the equation has no real solution.'
        exemplars:
          - problem: 'How many real solutions does $x^2 - 3x - 10 = 0$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The discriminant is $(-3)^2 - 4(1)(-10) = 9 + 40 = 49$. It is positive, so there are $2$ distinct real solutions.'
          - problem: 'How many times does the graph of $y = x^2 + x + 1$ cross the $x$-axis?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The graph crosses the $x$-axis where $x^2 + x + 1 = 0$. The discriminant is $1 - 4 = -3$, which is negative, so there are $0$ crossings.'
          - problem: 'A ball thrown up from the ground has height $h = -5t^2 + 20t$ metres after $t$ seconds. Does the ball ever reach a height of $25$ m?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "it does", "it reaches", "it is"], ["no", "no, it does not", "it does not", "never", "it never does", "not"]]}
            solution_sketch: 'Setting $h = 25$ gives $-5t^2 + 20t - 25 = 0$, which is $t^2 - 4t + 5 = 0$ after dividing by $-5$. Its discriminant is $16 - 20 = -4$, which is negative, so there is no such time and the answer is no.'
          - problem: 'How many real solutions does $x^2 - 6x + 9 = 0$ have?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The discriminant is $(-6)^2 - 4(1)(9) = 36 - 36 = 0$. A zero discriminant gives exactly $1$ repeated real solution.'
          - problem: 'A water jet leaves a nozzle on the ground and follows $y = -x^2 + 6x$, with $x$ and $y$ in metres. Does the jet ever reach a height of $8$ m?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "it does", "it reaches", "it is"], ["no", "no, it does not", "it does not", "never", "it never does", "not"]]}
            solution_sketch: 'Setting $y = 8$ gives $-x^2 + 6x - 8 = 0$, which is $x^2 - 6x + 8 = 0$. Its discriminant is $36 - 32 = 4$, which is positive, so the jet reaches $8$ m and the answer is yes.'
          - problem: 'For which value of $k$ does $x^2 + 6x + k = 0$ have exactly one real solution?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One solution needs a zero discriminant: $6^2 - 4(1)k = 36 - 4k = 0$. So $k = 9$, and indeed $x^2 + 6x + 9 = (x + 3)^2$.'
          - problem: 'Priya says $2x^2 - 3x + 5 = 0$ has two real solutions because it is a quadratic. How many real solutions does it have?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The discriminant is $(-3)^2 - 4(2)(5) = 9 - 40 = -31$. It is negative, so there are $0$ real solutions, and Priya is wrong.'
          - problem: 'How many points do the parabola $y = x^2 + 2x$ and the line $y = 4x - 1$ have in common?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common points satisfy $x^2 + 2x = 4x - 1$, which is $x^2 - 2x + 1 = 0$. The discriminant is $4 - 4 = 0$, so there is exactly $1$ common point.'
          - problem: 'A shop makes a profit of $P = -x^2 + 10x - 30$ dollars from selling $x$ items. For how many values of $x$ is the profit exactly $-5$ dollars?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Setting $P = -5$ gives $-x^2 + 10x - 25 = 0$, which is $x^2 - 10x + 25 = 0$. The discriminant is $100 - 100 = 0$, so exactly $1$ value of $x$ works.'
        constraints: 'answer is the count 0, 1, or 2; cover all three cases across problems'
    diagnostic_exemplar:
      problem: 'How many real solutions does $2x^2 + 3x + 4 = 0$ have? Use the discriminant.'
      answer: '0'
      solution_sketch: '$3^2 - 4(2)(4) = 9 - 32 = -23 < 0$, so there are no real solutions.'
    anki_seeds:
      - front: "What does the discriminant b^2 - 4ac tell you about the roots?"
        back: ">0 two real roots, =0 one repeated root, <0 no real roots."
        type: basic

  - id: parabola-vertex-form
    name: Parabolas in Vertex Form
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: coordinate-plane
        weight: 0.5
        key: true
      - id: evaluating-polynomials
        weight: 0.5
        key: true
      - id: graphing-linear-equations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Read the vertex from vertex form
        key_prerequisites: [coordinate-plane]
        try_first:
          problem: 'At which value of $x$ does $(x - 4)^2$ take its smallest value?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'A square is never negative, and $(x - 4)^2$ equals $0$ only when $x = 4$. So the graph of $y = (x - 4)^2 + k$ has its lowest point at $x = 4$, and that is the horizontal coordinate of the vertex.'
        exemplars:
          - problem: 'Give the vertex of $y = (x - 3)^2 + 4$.'
            answer: '(3, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The squared term is zero when $x - 3 = 0$, so $x = 3$. The outside constant is $4$, so the vertex is $(3, 4)$.'
          - problem: 'The parabola $y = x^2$ is moved $2$ units left and $5$ units down. What is the vertex of the new parabola?'
            answer: '(-2, -5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The vertex of $y = x^2$ is $(0, 0)$. Moving it $2$ units left and $5$ units down gives $(-2, -5)$, and the new equation is $y = (x + 2)^2 - 5$.'
          - problem: 'Sam reads the vertex of $y = (x - 5)^2 - 2$ as $(-5, -2)$. What is the correct vertex?'
            answer: '(5, -2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The bracket $x - 5$ is zero at $x = 5$, not at $x = -5$. The outside constant is $-2$, so the vertex is $(5, -2)$.'
          - problem: 'What is the vertex of $y = -3(x + 6)^2 + 1$?'
            answer: '(-6, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The bracket $x + 6$ is zero at $x = -6$. The factor $-3$ does not move the vertex, so it is $(-6, 1)$.'
          - problem: 'A fountain jet follows $y = -0.5(x - 4)^2 + 3$, where $x$ is the distance from the nozzle in metres and $y$ is the height in metres. Where is the highest point of the jet?'
            answer: '(4, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The jet opens downward, so its vertex is its highest point. The bracket is zero at $x = 4$ and the outside constant is $3$, so the point is $(4, 3)$.'
          - problem: 'Write the equation of the parabola obtained by moving $y = x^2$ to the right $2$ units and down $3$ units.'
            answer: 'y = (x - 2)^2 - 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Moving right $2$ units replaces $x$ by $x - 2$, and moving down $3$ units subtracts $3$. The equation is $y = (x - 2)^2 - 3$.'
          - problem: 'What is the vertex of $y = 2(x - 7)^2$?'
            answer: '(7, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The bracket is zero at $x = 7$, and there is no outside constant, so $k = 0$. The vertex is $(7, 0)$.'
          - problem: 'A ball''s height in metres is $h = -5(t - 2)^2 + 20$ after $t$ seconds. At what time does the ball reach its greatest height?'
            answer: '2'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'The squared term is zero when $t - 2 = 0$, and then the height is largest. So the ball is highest after $2$ seconds.'
        constraints: "y = a(x - h)^2 + k; watch the sign of h"
      - id: kp2
        name: Opening direction and max/min value
        key_prerequisites: [coordinate-plane]
        exemplars:
          - problem: 'Does $y = -2(x - 1)^2 + 3$ open upward or downward, and what is its maximum or minimum value?'
