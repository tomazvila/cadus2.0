            solution_sketch: '$a = 3 > 0$; the vertex $y$-value is the min.'
          - problem: 'A model $y=-(x+5)^2+2$ subtracts a nonnegative square from $2$. State its opening direction and extreme value.'
            answer: "direction = downward; extreme_value = 2"
            answer_contract: {kind: multipart, parts: [{name: direction, contract: {kind: label, options: [[upward], [downward]]}}, {name: extreme_value, contract: {kind: exact}}]}
            solution_sketch: '$a = -1 < 0$; the vertex $y$-value is the max.'
