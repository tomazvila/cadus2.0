            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Sam used the wrong sign, because $-b/(2a) = 8/2 = 4$. Then $y = 16 - 32 + 10 = -6$, so the vertex is $(4, -6)$.'
