        back: "w(w + k) = area; solve the quadratic and reject the negative root"
        type: basic
      - front: "For a projectile height model h(t): hitting the ground means ___, and the maximum height is at ___"
        back: "h = 0; the vertex, t = −b/(2a)"
        type: basic
