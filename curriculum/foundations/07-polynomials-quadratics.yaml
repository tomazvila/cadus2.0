        exemplars:
          - problem: 'A ball''s height in metres is $h = -5t^2 + 10t$. At what time $t > 0$ does it hit the ground ($h = 0$)?'
            answer: "2 s"
            answer_contract: {"kind":"unit","quantity":"time","unit":"s"}
            solution_sketch: '$-5t(t-2) = 0$; $t = 2$.'
          - problem: 'For $h = -5t^2 + 30t$ (metres), find the maximum height.'
            answer: "45 m"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m"}
        constraints: 'height models h = -5t^2 + bt with b a multiple of 5; answer the landing time or the maximum height, with units'
    diagnostic_exemplar:
      problem: 'A ball''s height in metres is $h = -5t^2 + 20t$. What is the maximum height it reaches?'
      answer: "20 m"
      solution_sketch: 'The maximum sits at the vertex $t = \frac{-b}{2a} = 2$, where $h = -20 + 40$.'
    anki_seeds:
