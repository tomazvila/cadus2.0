  - id: converting-to-vertex-form
    name: Converting Quadratics to Vertex Form
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: multi-step
    expected_time_secs: 180
    prerequisites:
      - id: completing-the-square
        weight: 0.8
        key: true
      - id: parabola-vertex-form
        weight: 0.6
        key: true
      - id: polynomial-multiplication
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Monic standard form to vertex form
        key_prerequisites: [completing-the-square, parabola-vertex-form]
        exemplars:
          - problem: 'Write $y = x^2 + 6x + 5$ in vertex form.'
            answer: "y = (x + 3)^2 - 4"
            solution_sketch: 'Add and subtract $9$: $(x^2 + 6x + 9) - 9 + 5$.'
          - problem: 'Write $y = x^2 - 4x + 7$ in vertex form.'
            answer: "y = (x - 2)^2 + 3"
        constraints: "monic; even middle coefficient"
      - id: kp2
        name: Factor out a leading coefficient first
        key_prerequisites: [completing-the-square]
        exemplars:
          - problem: 'Write $y = 2x^2 - 8x + 3$ in vertex form.'
            answer: "y = 2(x - 2)^2 - 5"
            solution_sketch: '$2(x^2 - 4x) + 3 = 2((x-2)^2 - 4) + 3$.'
          - problem: 'Write $y = -x^2 + 2x + 3$ in vertex form.'
            answer: "y = -(x - 1)^2 + 4"
            solution_sketch: '$-(x^2 - 2x) + 3 = -((x-1)^2 - 1) + 3$.'
        constraints: "factor a out of the x-terms only"
      - id: kp3
        name: Read the vertex and extreme value from the result
        key_prerequisites: [parabola-vertex-form, completing-the-square]
        exemplars:
          - problem: 'Convert $y = x^2 + 10x + 30$ to vertex form and give the minimum value of $y$.'
            answer: "vertex_form = (x + 5)^2 + 5; minimum = 5"
            answer_contract: {kind: multipart, parts: [{name: vertex_form, contract: {kind: exact}}, {name: minimum, contract: {kind: exact}}]}
            solution_sketch: 'Vertex $(-5, 5)$; opens upward.'
          - problem: 'Convert $y = 3x^2 + 6x + 1$ to vertex form and give the vertex.'
            answer: "vertex_form = 3(x + 1)^2 - 2; vertex = (-1, -2)"
            answer_contract: {kind: multipart, parts: [{name: vertex_form, contract: {kind: exact}}, {name: vertex, contract: {kind: coordinates, arity: 2}}]}
            solution_sketch: '$3(x^2 + 2x) + 1 = 3((x+1)^2 - 1) + 1$.'
        constraints: "conversion plus one interpretive question"
    diagnostic_exemplar:
      problem: 'Write $y = 2x^2 + 8x + 3$ in vertex form.'
      answer: 'y = 2(x + 2)^2 - 5'
      solution_sketch: '$2(x^2 + 4x) + 3 = 2((x + 2)^2 - 4) + 3$.'
    anki_seeds:
      - front: "To convert y = x^2 + bx + c to vertex form, ..."
        back: "complete the square: y = (x + b/2)^2 + (c - (b/2)^2)"
        type: basic

