            answer: "(2x + 5)(2x - 5)"
            solution_sketch: '$(2x)^2 - 5^2$.'
          - problem: 'Factor $9x^4 - 16$.'
            answer: "(3x^2 + 4)(3x^2 - 4)"
        constraints: 'perfect-square coefficients; even powers up to 4'
      - id: kp3
        name: Factor a GCF first, or factor repeatedly
        key_prerequisites: [factoring-gcf]
        exemplars:
