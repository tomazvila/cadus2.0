      {"problem": "Convert $2$ square metres to square centimetres.", "answer": "20000", "solution_sketch": "Squaring $100$ cm/m gives $10000$ square cm per square m; $2\\cdot10000=20000$.", "answer_contract": {"kind": "exact"}}, {"problem": "Convert $3500$ cubic centimetres to litres.", "answer": "3.5", "solution_sketch": "Each litre is $1000$ cubic cm, so $3500/1000=3.5$ litres.", "answer_contract": {"kind": "exact"}},
      {"problem": "A tank has volume $0.4$ cubic metres. How many litres does it hold?", "answer": "400", "solution_sketch": "A cubic metre is $1000$ litres; $0.4\\cdot1000=400$ litres.", "answer_contract": {"kind": "exact"}}, {"problem": "A cube has edge $20$ cm. Find its volume in litres.", "answer": "8", "solution_sketch": "Cube the edge: $20^3=8000$ cubic cm. Divide by $1000$ cubic cm per litre to get $8$ litres.", "answer_contract": {"kind": "exact"}}
    ]}
  ]}
