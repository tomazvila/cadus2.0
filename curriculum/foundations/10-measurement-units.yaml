# Phase C (gap I-18): metric unit conversion / dimensional analysis.
# The tree is deliberately Europeanised (metric units, EUR) and its word problems
# use cm/m/km, g/kg, ml/l and km/h throughout — yet before this unit no topic
# taught converting between metric units at all (the only KP-level touch was
# geometry's density-measurement-problems "Capacity and unit conversion").
unit: measurement-units
course: foundations
module: "Measurement & Units"
topics:
  - id: metric-unit-conversion
    name: Metric Unit Conversion
    # core: baseline measurement machinery — geometry's measurement/density word
    # problems and rate problems tree-wide assume fluent metric conversion.
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: decimal-multiplication-powers-of-ten
        weight: 0.7
        key: true
      - id: decimal-place-value
        weight: 0.4
      - id: decimal-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Length units (mm, cm, m, km)
        key_prerequisites: [decimal-multiplication-powers-of-ten]
        constraints: "one-step conversions; 10 mm = 1 cm, 100 cm = 1 m, 1000 m = 1 km; target unit always named in the problem; answers are bare numbers with exact decimals"
        exemplars:
          - problem: 'Convert $3.5$ m to centimetres.'
            answer: "350"
            solution_sketch: '$1$ m $= 100$ cm, so multiply by $100$: $3.5 \cdot 100 = 350$.'
          - problem: 'Convert $1250$ m to kilometres.'
            answer: "1.25"
            solution_sketch: 'Going to the larger unit divides: $1250 \div 1000 = 1.25$.'
          - problem: 'Convert $42$ mm to centimetres.'
            answer: "4.2"
      - id: kp2
        name: Mass and capacity units (mg, g, kg, t; ml, l)
        key_prerequisites: [decimal-multiplication-powers-of-ten]
        constraints: "one-step conversions; 1000 mg = 1 g, 1000 g = 1 kg, 1000 kg = 1 t, 1000 ml = 1 l; exact decimal answers"
        exemplars:
          - problem: 'Convert $0.75$ kg to grams.'
            answer: "750"
          - problem: 'Convert $2500$ ml to litres.'
            answer: "2.5"
            solution_sketch: '$1$ l $= 1000$ ml, so divide by $1000$.'
          - problem: 'Convert $3.2$ t to kilograms.'
            answer: "3200"
      - id: kp3
        name: Two-step conversions and mixed-unit comparisons
        key_prerequisites: [decimal-multiplication-powers-of-ten, decimal-operations]
        constraints: "chain two steps (e.g. km to cm) or bring both quantities to a common unit before comparing; answers stay exact"
        exemplars:
          - problem: 'Convert $0.6$ km to centimetres.'
            answer: "60000"
            solution_sketch: '$0.6$ km $= 600$ m $= 60000$ cm.'
          - problem: 'A bottle holds $1.5$ l and a glass holds $250$ ml. How many glasses does the bottle fill?'
            answer: "6"
            solution_sketch: '$1.5$ l $= 1500$ ml; $1500 \div 250 = 6$.'
          - problem: 'By how many grams is $4.8$ kg heavier than $650$ g?'
            answer: "4150"
            solution_sketch: '$4.8$ kg $= 4800$ g; $4800 - 650 = 4150$.'
    diagnostic_exemplar:
      problem: 'A jug holds $1.8$ l and a glass holds $150$ ml. How many glasses does the jug fill?'
      answer: "12"
      solution_sketch: 'Work in one unit: $1.8$ l $= 1800$ ml, and $1800 \div 150 = 12$.'
    anki_seeds:
      - front: "1 km = ? m"
        back: "1000 m"
        type: basic
      - front: "1 m = ? cm"
        back: "100 cm"
        type: basic
      - front: "1 l = ? ml"
        back: "1000 ml"
        type: basic

  - id: dimensional-analysis
    name: Dimensional Analysis
    # core: false — terminal skill; no other topic consumes rate/area/volume unit
    # conversion (requirements §7 defaults a second unit-conversion topic to
    # supplemental).
    core: false
    difficulty: 0.5
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: metric-unit-conversion
        weight: 0.8
        key: true
      - id: unit-rates
        weight: 0.5
        key: true
      - id: multiplying-fractions
        weight: 0.4
      - id: decimal-operations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Unit factors and chained conversions
        key_prerequisites: [metric-unit-conversion, multiplying-fractions]
        constraints: "multiply by at most two unit factors; metric and time units only; values chosen for exact answers"
        exemplars:
          - problem: 'Convert $2.5$ hours to seconds.'
            answer: "9000"
            solution_sketch: 'Multiply by $60$ min/h and $60$ s/min: $2.5 \cdot 60 \cdot 60 = 9000$.'
          - problem: 'Convert $1$ day to minutes.'
            answer: "1440"
          - problem: 'Ribbon costs €$4$ per metre. What is the cost, in euros, of $250$ cm of ribbon?'
            answer: "10"
            solution_sketch: '$250$ cm $= 2.5$ m; the cm cancel and $2.5 \cdot 4 = 10$.'
      - id: kp2
        name: Converting rates (km/h and m/s)
        key_prerequisites: [unit-rates, metric-unit-conversion]
        constraints: "speeds divisible by 3.6 (km/h to m/s) or integers times 3.6 (m/s to km/h) so answers are exact"
        exemplars:
          - problem: 'Convert $72$ km/h to m/s.'
            answer: "20"
            solution_sketch: '$72$ km/h $= \frac{72000 \text{ m}}{3600 \text{ s}} = 20$ m/s (divide by $3.6$).'
          - problem: 'Convert $15$ m/s to km/h.'
            answer: "54"
            solution_sketch: 'Multiply by $3.6$: $15 \cdot 3.6 = 54$.'
          - problem: 'A pump moves $0.3$ litres per second. How many litres per hour is that?'
            answer: "1080"
      - id: kp3
        visuals: [{"kind":"geometry","figure":{"shape":"polygon","vertices":[{"x":"0","y":"0","label":"A"},{"x":"100","y":"0","label":"B"},{"x":"100","y":"100","label":"C"},{"x":"0","y":"100","label":"D"}],"right_angles":[0,1,2,3]},"caption":"Reference example: coordinates are centimetres. This square has side 100 cm = 1 m, so its area is 10000 square centimetres = 1 square metre."}]
        name: Area and volume units
        key_prerequisites: [metric-unit-conversion]
        constraints: "square or cube the length factor: 1 m² = 10000 cm², 1 l = 1000 cm³, 1 m³ = 1000 l; exact answers"
        exemplars:
          - problem: 'Convert $2$ m² to cm².'
            answer: "20000"
            solution_sketch: '$1$ m $= 100$ cm, so $1$ m² $= 100^2 = 10000$ cm² — the factor is squared, not reused.'
          - problem: 'Convert $3500$ cm³ to litres.'
            answer: "3.5"
            solution_sketch: '$1$ l $= 1000$ cm³.'
          - problem: 'A tank has volume $0.4$ m³. How many litres does it hold?'
            answer: "400"
    diagnostic_exemplar:
      problem: 'A tank of volume $0.9$ m³ is filled at $30$ litres per minute. How many seconds does it take to fill?'
      answer: "1800"
      solution_sketch: '$0.9$ m³ $= 900$ l, so filling takes $\frac{900}{30} = 30$ min $= 1800$ s.'
    anki_seeds:
      - front: "km/h → m/s: divide by..."
        back: "3.6"
        type: basic
      - front: "1 m² = ? cm²"
        back: "10000 cm² (the length factor 100, squared)"
        type: basic
      - front: "1 m³ = ? l"
        back: "1000 l"
        type: basic
