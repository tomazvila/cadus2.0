  {"id": "metric-unit-conversion", "name": "Metric Unit Conversion", "core": true, "difficulty": 0.3, "drill": false, "answer_kind": "numeric", "expected_time_secs": 90, "prerequisites": [{"id": "decimal-multiplication-powers-of-ten", "weight": 0.7, "key": true}, {"id": "decimal-place-value", "weight": 0.4}, {"id": "decimal-operations", "weight": 0.3}], "diagnostic_exemplar": {"problem": "A jug holds $1.8$ l and a glass holds $150$ ml. How many glasses does the jug fill?", "answer": "12", "solution_sketch": "Work in one unit: $1.8$ l $= 1800$ ml, and $1800 \\div 150 = 12$."}, "anki_seeds": [{"front": "1 km = ? m", "back": "1000 m", "type": "basic"}, {"front": "1 m = ? cm", "back": "100 cm", "type": "basic"}, {"front": "1 l = ? ml", "back": "1000 ml", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Length units (mm, cm, m, km)", "key_prerequisites": ["decimal-multiplication-powers-of-ten"], "constraints": "one-step conversions; 10 mm = 1 cm, 100 cm = 1 m, 1000 m = 1 km; target unit always named in the problem; answers are bare numbers with exact decimals", "exemplars": [
      {"problem": "Convert $3.5$ m to centimetres.", "answer": "350", "solution_sketch": "Each metre contains $100$ cm, so $3.5\\cdot100=350$ cm.", "answer_contract": {"kind": "exact"}}, {"problem": "A distance marker reads $1250$ m. Write its distance in kilometres as a number.", "answer": "1.25", "solution_sketch": "Group metres into thousands: $1250/1000=1.25$ km.", "answer_contract": {"kind": "exact"}},
      {"problem": "A ruler marks a length of $42$ mm. How many centimetres is that?", "answer": "4.2", "solution_sketch": "Each group of $10$ mm is one cm, so $42/10=4.2$ cm.", "answer_contract": {"kind": "exact"}}, {"problem": "Complete the conversion equation $d\\text{ km}=7000\\text{ m}$ by giving $d$.", "answer": "7", "solution_sketch": "Since one km is $1000$ m, $1000d=7000$ and $d=7$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Mass and capacity units (mg, g, kg, t; ml, l)", "key_prerequisites": ["decimal-multiplication-powers-of-ten"], "constraints": "one-step conversions; 1000 mg = 1 g, 1000 g = 1 kg, 1000 kg = 1 t, 1000 ml = 1 l; exact decimal answers", "exemplars": [
      {"problem": "Convert $0.75$ kg to grams.", "answer": "750", "solution_sketch": "One kg contains $1000$ g; $0.75\\cdot1000=750$ g.", "answer_contract": {"kind": "exact"}}, {"problem": "A measuring jug contains $2500$ ml. Give its volume in litres.", "answer": "2.5", "solution_sketch": "Divide by $1000$ ml per litre: $2500/1000=2.5$ l.", "answer_contract": {"kind": "exact"}},
      {"problem": "Complete $m\\text{ t}=3200\\text{ kg}$ by giving $m$.", "answer": "3.2", "solution_sketch": "Each tonne contributes $1000$ kg, so $1000m=3200$ and $m=3.2$.", "answer_contract": {"kind": "exact"}}, {"problem": "A mass label reads $4500$ mg. Express it in grams.", "answer": "4.5", "solution_sketch": "There are $1000$ mg per gram; $4500/1000=4.5$ g.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp3", "name": "Two-step conversions and mixed-unit comparisons", "key_prerequisites": ["decimal-multiplication-powers-of-ten", "decimal-operations"], "constraints": "chain two steps (e.g. km to cm) or bring both quantities to a common unit before comparing; answers stay exact", "exemplars": [
      {"problem": "Convert $0.6$ km to centimetres.", "answer": "60000", "solution_sketch": "Chain the factors: $0.6\\cdot1000\\cdot100=60000$ cm.", "answer_contract": {"kind": "exact"}}, {"problem": "A bottle holds $1.5$ l and a glass $250$ ml. How many full glasses does the bottle fill?", "answer": "6", "solution_sketch": "Convert the bottle to $1500$ ml, then divide by $250$ ml per glass: $1500/250=6$.", "answer_contract": {"kind": "exact"}},
      {"problem": "By how many grams is $4.8$ kg heavier than $650$ g?", "answer": "4150", "solution_sketch": "Convert the first mass to $4800$ g; the difference is $4800-650=4150$ g.", "answer_contract": {"kind": "exact"}}, {"problem": "A cable has two sections, $0.02$ km and $350$ cm. Find its total length in metres.", "answer": "23.5", "solution_sketch": "Convert each section: $0.02\\cdot1000=20$ m and $350/100=3.5$ m. Add to $23.5$ m.", "answer_contract": {"kind": "exact"}}
    ]}
  ]},
  {"id": "dimensional-analysis", "name": "Dimensional Analysis", "core": false, "difficulty": 0.5, "drill": false, "answer_kind": "numeric", "expected_time_secs": 120, "prerequisites": [{"id": "metric-unit-conversion", "weight": 0.8, "key": true}, {"id": "unit-rates", "weight": 0.5, "key": true}, {"id": "multiplying-fractions", "weight": 0.4}, {"id": "decimal-operations", "weight": 0.3}], "diagnostic_exemplar": {"problem": "A tank of volume $0.9$ m³ is filled at $30$ litres per minute. How many seconds does it take to fill?", "answer": "1800", "solution_sketch": "$0.9$ m³ $= 900$ l, so filling takes $\\frac{900}{30} = 30$ min $= 1800$ s."}, "anki_seeds": [{"front": "km/h → m/s: divide by...", "back": "3.6", "type": "basic"}, {"front": "1 m² = ? cm²", "back": "10000 cm² (the length factor 100, squared)", "type": "basic"}, {"front": "1 m³ = ? l", "back": "1000 l", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Unit factors and chained conversions", "key_prerequisites": ["metric-unit-conversion", "multiplying-fractions"], "constraints": "multiply by at most two unit factors; metric and time units only; values chosen for exact answers", "exemplars": [
      {"problem": "Convert $2.5$ hours to seconds.", "answer": "9000", "solution_sketch": "Multiply by $60$ min/h and $60$ s/min; hours and minutes cancel: $2.5\\cdot60\\cdot60=9000$ s.", "answer_contract": {"kind": "exact"}}, {"problem": "Convert one day to minutes.", "answer": "1440", "solution_sketch": "Multiply $1$ day by $24$ h/day and $60$ min/h: the remaining unit is minutes and the value is $1440$.", "answer_contract": {"kind": "exact"}},
      {"problem": "Ribbon costs €$4$ per metre. What is the cost in euros of $250$ cm?", "answer": "10", "solution_sketch": "$(250\\text{ cm})(1\\text{ m}/100\\text{ cm})(4\\text{ EUR}/\\text{m})=10\\text{ EUR}$; cm and m cancel.", "answer_contract": {"kind": "exact"}}, {"problem": "A machine uses $3$ grams of material per second. How many kilograms does it use in $2000$ seconds?", "answer": "6", "solution_sketch": "$(2000\\text{ s})(3\\text{ g}/\\text{s})(1\\text{ kg}/1000\\text{ g})=6\\text{ kg}$.", "answer_contract": {"kind": "exact"}}
    ]},
    {"id": "kp2", "name": "Converting rates (km/h and m/s)", "key_prerequisites": ["unit-rates", "metric-unit-conversion"], "constraints": "speeds divisible by 3.6 (km/h to m/s) or integers times 3.6 (m/s to km/h) so answers are exact", "exemplars": [
