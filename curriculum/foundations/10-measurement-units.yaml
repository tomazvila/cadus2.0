      {"problem": "A pump moves $0.3$ litres each second. How many litres per hour is that?", "answer": "1080", "solution_sketch": "Multiply the rate by $3600$ seconds per hour: $0.3\\cdot3600=1080$ l/h.", "answer_contract": {"kind": "exact"}}, {"problem": "A cyclist covers $90$ metres in $5$ seconds at constant speed. Express that speed in km/h.", "answer": "64.8", "solution_sketch": "First $90/5=18$ m/s; then $18\\cdot3600/1000=64.8$ km/h.", "answer_contract": {"kind": "exact"}}
    ]},
