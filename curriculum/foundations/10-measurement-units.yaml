unit: "measurement-units"
course: "foundations"
module: "Measurement & Units"
topics: [
  {"id": "metric-unit-conversion", "name": "Metric Unit Conversion", "core": true, "difficulty": 0.3, "drill": false, "answer_kind": "numeric", "expected_time_secs": 90, "prerequisites": [{"id": "decimal-multiplication-powers-of-ten", "weight": 0.7, "key": true}, {"id": "decimal-place-value", "weight": 0.4}, {"id": "decimal-operations", "weight": 0.3}], "diagnostic_exemplar": {"problem": "A jug holds $1.8$ l and a glass holds $150$ ml. How many glasses does the jug fill?", "answer": "12", "solution_sketch": "Work in one unit: $1.8$ l $= 1800$ ml, and $1800 \\div 150 = 12$."}, "anki_seeds": [{"front": "1 km = ? m", "back": "1000 m", "type": "basic"}, {"front": "1 m = ? cm", "back": "100 cm", "type": "basic"}, {"front": "1 l = ? ml", "back": "1000 ml", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Length units (mm, cm, m, km)", "key_prerequisites": ["decimal-multiplication-powers-of-ten"], "constraints": "one-step conversions; 10 mm = 1 cm, 100 cm = 1 m, 1000 m = 1 km; target unit always named in the problem; answers are bare numbers with exact decimals", "exemplars": [
      {"problem": "Convert $3.5$ m to centimetres.", "answer": "350", "solution_sketch": "A metre has $100$ cm, so we multiply the number of metres by $100$. This gives $3.5\\cdot100=350$ cm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}},
      {"problem": "A distance marker on a path reads $1250$ m. How many kilometres is that?", "answer": "1.25", "solution_sketch": "A kilometre is $1000$ m, so we divide the number of metres by $1000$. This gives $1250/1000=1.25$ km.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}},
      {"problem": "A strip of tape is $42$ mm long. How many centimetres is that?", "answer": "4.2", "solution_sketch": "Each group of $10$ mm makes one cm, so we divide by $10$. This gives $42/10=4.2$ cm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}},
      {"problem": "A snail has crawled $730$ cm along a wall. How many metres is that?", "answer": "7.3", "solution_sketch": "A metre is $100$ cm, so we divide by $100$. This gives $730/100=7.3$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "A bolt is $0.045$ m long. How many millimetres is that?", "answer": "45", "solution_sketch": "A metre is $1000$ mm, so we multiply by $1000$. This gives $0.045\\cdot1000=45$ mm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "mm", "allow_omitted": true}},
      {"problem": "Convert $6.2$ km to metres. What is the length in metres?", "answer": "6200", "solution_sketch": "A kilometre is $1000$ m, not $100$ m. So $6.2$ km is $6.2\\cdot1000=6200$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "A hiking trail is $12.5$ km long. How many metres is that?", "answer": "12500", "solution_sketch": "Each km has $1000$ m, so we multiply by $1000$. This gives $12.5\\cdot1000=12500$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "A cyclist has ridden $7000$ m. How far is that in kilometres?", "answer": "7", "solution_sketch": "A kilometre is $1000$ m, so we divide the number of metres by $1000$. This gives $7000/1000=7$ km.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}}
    ]},
    {"id": "kp2", "name": "Mass and capacity units (mg, g, kg, t; ml, l)", "key_prerequisites": ["decimal-multiplication-powers-of-ten"], "constraints": "one-step conversions; 1000 mg = 1 g, 1000 g = 1 kg, 1000 kg = 1 t, 1000 ml = 1 l; exact decimal answers", "exemplars": [
      {"problem": "Convert $0.75$ kg to grams.", "answer": "750", "solution_sketch": "One kg contains $1000$ g, so we multiply by $1000$. This gives $0.75\\cdot1000=750$ g.", "answer_contract": {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}},
      {"problem": "A measuring jug contains $2500$ ml of water. How many litres is that?", "answer": "2.5", "solution_sketch": "A litre is $1000$ ml, so we divide by $1000$. This gives $2500/1000=2.5$ litres.", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}},
      {"problem": "A lorry carries $3.2$ tonnes of sand. How many kilograms is that?", "answer": "3200", "solution_sketch": "A tonne is $1000$ kg, so we multiply by $1000$. This gives $3.2\\cdot1000=3200$ kg.", "answer_contract": {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}},
      {"problem": "A medicine label reads $4500$ mg. How many grams is that?", "answer": "4.5", "solution_sketch": "A gram is $1000$ mg, so we divide by $1000$. This gives $4500/1000=4.5$ g.", "answer_contract": {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}},
      {"problem": "A tablet contains $250$ mg of a medicine. How many grams is that?", "answer": "0.25", "solution_sketch": "A gram is $1000$ mg, so we divide by $1000$. This gives $250/1000=0.25$ g.", "answer_contract": {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}},
      {"problem": "A bottle holds $0.33$ litres. How many millilitres is that?", "answer": "330", "solution_sketch": "A litre is $1000$ ml, so we multiply by $1000$. This gives $0.33\\cdot1000=330$ ml.", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "ml", "allow_omitted": true}},
      {"problem": "A ship unloads $4.2$ tonnes of grain. How many kilograms is that?", "answer": "4200", "solution_sketch": "A tonne is $1000$ kg, so we multiply by $1000$. This gives $4.2\\cdot1000=4200$ kg.", "answer_contract": {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}},
      {"problem": "What is $0.6$ litres in millilitres?", "answer": "600", "solution_sketch": "A litre is $1000$ ml, not $100$ ml. So $0.6$ litres is $0.6\\cdot1000=600$ ml.", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "ml", "allow_omitted": true}}
    ]},
    {"id": "kp3", "name": "Two-step conversions and mixed-unit comparisons", "key_prerequisites": ["decimal-multiplication-powers-of-ten", "decimal-operations"], "constraints": "chain two steps (e.g. km to cm) or bring both quantities to a common unit before comparing; answers stay exact", "exemplars": [
      {"problem": "Convert $0.6$ km to centimetres.", "answer": "60000", "solution_sketch": "First $0.6$ km is $0.6\\cdot1000=600$ m. Then $600$ m is $600\\cdot100=60000$ cm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}},
      {"problem": "A bottle holds $1.5$ litres and a glass holds $250$ ml. How many full glasses does the bottle fill?", "answer": "6", "solution_sketch": "First write the bottle in millilitres: $1.5$ litres is $1500$ ml. Then divide by the size of one glass: $1500/250=6$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A parcel weighs $4.8$ kg and a letter weighs $650$ g. How many grams heavier is the parcel?", "answer": "4150", "solution_sketch": "First write the parcel in grams: $4.8$ kg is $4800$ g. The difference is $4800-650=4150$ g.", "answer_contract": {"kind": "unit", "quantity": "mass", "unit": "g", "allow_omitted": true}},
      {"problem": "A cable has two sections, one $0.02$ km long and one $350$ cm long. How long is the cable in metres?", "answer": "23.5", "solution_sketch": "Write each section in metres: $0.02$ km is $20$ m and $350$ cm is $3.5$ m. The total is $20+3.5=23.5$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "Convert $3600000$ mm to kilometres.", "answer": "3.6", "solution_sketch": "First $3600000$ mm is $3600000/1000=3600$ m. Then $3600$ m is $3600/1000=3.6$ km.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "km", "allow_omitted": true}},
      {"problem": "A bag holds $2.4$ kg of flour. Each loaf uses $300$ g. How many loaves can be made from the bag?", "answer": "8", "solution_sketch": "Write the bag in grams: $2.4$ kg is $2400$ g. The number of loaves is $2400/300=8$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A bakery uses $75$ g of butter for each cake. How many kilograms of butter does it use for $24$ cakes?", "answer": "1.8", "solution_sketch": "For $24$ cakes it uses $75\\cdot24=1800$ g. Then $1800$ g is $1800/1000=1.8$ kg.", "answer_contract": {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}},
      {"problem": "How many pieces of ribbon $40$ cm long can be cut from a ribbon $12$ m long?", "answer": "30", "solution_sketch": "Write the long ribbon in centimetres: $12$ m is $1200$ cm. The number of pieces is $1200/40=30$.", "answer_contract": {"kind": "exact"}},
      {"problem": "What is the difference in metres between $0.9$ km and $85000$ cm?", "answer": "50", "solution_sketch": "We write both in metres: $0.9$ km is $900$ m and $85000$ cm is $850$ m. The difference is $900-850=50$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}}
    ]}
  ]},
  {"id": "dimensional-analysis", "name": "Dimensional Analysis", "core": false, "difficulty": 0.5, "drill": false, "answer_kind": "numeric", "expected_time_secs": 120, "prerequisites": [{"id": "metric-unit-conversion", "weight": 0.8, "key": true}, {"id": "unit-rates", "weight": 0.5, "key": true}, {"id": "multiplying-fractions", "weight": 0.4}, {"id": "decimal-operations", "weight": 0.3}], "diagnostic_exemplar": {"problem": "A tank of volume $0.9$ m³ is filled at $30$ litres per minute. How many seconds does it take to fill?", "answer": "1800", "solution_sketch": "$0.9$ m³ $= 900$ l, so filling takes $\\frac{900}{30} = 30$ min $= 1800$ s.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "second", "allow_omitted": true}}, "anki_seeds": [{"front": "km/h → m/s: divide by...", "back": "3.6", "type": "basic"}, {"front": "1 m² = ? cm²", "back": "10000 cm² (the length factor 100, squared)", "type": "basic"}, {"front": "1 m³ = ? l", "back": "1000 l", "type": "basic"}], "knowledge_points": [
    {"id": "kp1", "name": "Unit factors and chained conversions", "key_prerequisites": ["metric-unit-conversion", "multiplying-fractions"], "constraints": "multiply by at most two unit factors; metric and time units only; values chosen for exact answers", "exemplars": [
      {"problem": "Convert $2.5$ hours to seconds.", "answer": "9000", "solution_sketch": "Multiply by $60$ min per hour and by $60$ s per minute. The hours and the minutes cancel, and $2.5\\cdot60\\cdot60=9000$ s.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "second", "allow_omitted": true}},
      {"problem": "How many minutes are in one day?", "answer": "1440", "solution_sketch": "Multiply $1$ day by $24$ h per day and by $60$ min per hour. The days and the hours cancel, and $24\\cdot60=1440$ min.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "minute", "allow_omitted": true}},
      {"problem": "Ribbon costs $4$ euros per metre. What is the cost of $250$ cm of ribbon?", "answer": "10", "solution_sketch": "Write $250$ cm as $2.5$ m using $1\\text{ m}/100\\text{ cm}$. Then $2.5\\text{ m}\\cdot4\\text{ euros}/\\text{m}=10$ euros.", "answer_contract": {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}},
      {"problem": "A machine uses $3$ grams of material every second. How many kilograms does it use in $2000$ seconds?", "answer": "6", "solution_sketch": "In $2000$ s it uses $2000\\cdot3=6000$ g. Multiplying by $1\\text{ kg}/1000\\text{ g}$ gives $6$ kg.", "answer_contract": {"kind": "unit", "quantity": "mass", "unit": "kg", "allow_omitted": true}},
      {"problem": "A printer uses $0.5$ g of toner for each page. A cartridge holds $0.2$ kg of toner. How many pages can the cartridge print?", "answer": "400", "solution_sketch": "The cartridge holds $0.2$ kg $=200$ g of toner. The number of pages is $200\\text{ g}\\div0.5\\text{ g per page}=400$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A snail moves at $90$ cm per minute. How many metres does it move in $2$ hours?", "answer": "108", "solution_sketch": "In $2$ hours there are $120$ minutes, so the snail moves $90\\cdot120=10800$ cm. Dividing by $100$ cm per metre gives $108$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "A lorry unloads $3.6$ tonnes of sand at $40$ kg per minute. How many hours does the unloading take?", "answer": "1.5", "solution_sketch": "The load is $3.6$ tonnes $=3600$ kg. The time is $3600/40=90$ minutes, which is $90/60=1.5$ hours.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "hour", "allow_omitted": true}},
      {"problem": "Convert $3$ hours to seconds. What is the number of seconds?", "answer": "10800", "solution_sketch": "Hours to seconds needs two factors: $60$ min per hour and $60$ s per minute. So $3\\cdot60\\cdot60=10800$ s.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "second", "allow_omitted": true}},
      {"problem": "Cable costs $3.50$ euros per metre. What does a piece $40$ cm long cost?", "answer": "1.4", "solution_sketch": "Write $40$ cm as $0.4$ m. Then the cost is $0.4\\cdot3.50=1.4$ euros.", "answer_contract": {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}}
    ]},
    {"id": "kp2", "name": "Converting rates (km/h and m/s)", "key_prerequisites": ["unit-rates", "metric-unit-conversion"], "constraints": "speeds divisible by 3.6 (km/h to m/s) or integers times 3.6 (m/s to km/h) so answers are exact", "exemplars": [
      {"problem": "Convert $72$ km/h to m/s.", "answer": "20", "solution_sketch": "Multiply by $1000$ m per km and by $1\\text{ h}/3600\\text{ s}$. Then $72\\cdot1000/3600=20$ m/s.", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}},
      {"problem": "Convert $15$ m/s to km/h.", "answer": "54", "solution_sketch": "In one hour there are $3600$ s, so $15$ m/s is $54000$ m per hour. Dividing by $1000$ m per km gives $54$ km/h.", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}},
      {"problem": "A pump moves $0.3$ litres each second. How many litres per hour is that?", "answer": "1080", "solution_sketch": "There are $3600$ seconds in an hour, so we multiply the rate by $3600$. This gives $0.3\\cdot3600=1080$ litres per hour.", "answer_contract": {"kind": "unit", "quantity": "flow", "unit": "L/h", "allow_omitted": true}},
      {"problem": "A cyclist covers $90$ metres in $5$ seconds at constant speed. How fast is that in km/h?", "answer": "64.8", "solution_sketch": "The speed is distance divided by time, $90/5=18$ m/s. Multiplying by $3600$ s per hour and dividing by $1000$ m per km gives $18\\cdot3600/1000=64.8$ km/h.", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}},
      {"problem": "A train travels at $126$ km/h. How many metres does it cover in $10$ seconds?", "answer": "350", "solution_sketch": "In m/s the speed is $126/3.6=35$ m/s. In $10$ s the train covers $35\\cdot10=350$ m.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}},
      {"problem": "A car travels at $90$ km/h. How many seconds does it need to cover $500$ m?", "answer": "20", "solution_sketch": "In m/s the speed is $90/3.6=25$ m/s. The time is $500/25=20$ s.", "answer_contract": {"kind": "unit", "quantity": "time", "unit": "second", "allow_omitted": true}},
      {"problem": "A tap delivers $12$ litres per minute. How many millilitres per second is that?", "answer": "200", "solution_sketch": "In one minute the tap delivers $12000$ ml. Dividing by $60$ s gives $12000/60=200$ ml per second.", "answer_contract": {"kind": "unit", "quantity": "flow", "unit": "ml/s", "allow_omitted": true}},
      {"problem": "A falcon dives at $32$ m/s. A train travels at $126$ km/h. Which is faster?", "answer": "the train", "solution_sketch": "We write both speeds in m/s. The train goes $126/3.6=35$ m/s, which is more than the falcon's $32$ m/s, so the train is faster.", "answer_contract": {"kind": "label", "options": [["the train", "train", "126 km/h", "the train is faster"], ["the falcon", "falcon", "32 m/s", "the falcon is faster"]]}},
      {"problem": "A river flows at $1.5$ m/s. How fast is that in kilometres per hour?", "answer": "5.4", "solution_sketch": "In one hour the water moves $1.5\\cdot3600=5400$ m. Dividing by $1000$ m per km gives $5.4$ km/h.", "answer_contract": {"kind": "unit", "quantity": "speed", "unit": "km/h", "allow_omitted": true}}
    ]},
    {"id": "kp3", "name": "Area and volume units", "key_prerequisites": ["metric-unit-conversion"], "constraints": "square or cube the length factor: 1 m² = 10000 cm², 1 l = 1000 cm³, 1 m³ = 1000 l; exact answers", "exemplars": [
      {"problem": "Convert $2$ square metres to square centimetres.", "answer": "20000", "solution_sketch": "A metre is $100$ cm, so a square metre is $100\\cdot100=10000$ square cm. Then $2\\cdot10000=20000$.", "answer_contract": {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}},
      {"problem": "Convert $3500$ cubic centimetres to litres.", "answer": "3.5", "solution_sketch": "Each litre is $1000$ cubic cm, so we divide by $1000$. This gives $3500/1000=3.5$ litres.", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}},
      {"problem": "A tank has a volume of $0.4$ cubic metres. How many litres does it hold?", "answer": "400", "solution_sketch": "A cubic metre is $1000$ litres, so we multiply by $1000$. This gives $0.4\\cdot1000=400$ litres.", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}},
      {"problem": "A cube has an edge of $20$ cm. What is its volume in litres?", "answer": "8", "solution_sketch": "The volume is $20^3=8000$ cubic cm. Dividing by $1000$ cubic cm per litre gives $8$ litres.", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}},
      {"problem": "A floor of $12$ m$^2$ is covered with square tiles of side $20$ cm. How many tiles are needed?", "answer": "300", "solution_sketch": "The floor is $12\\cdot10000=120000$ square cm and one tile is $20\\cdot20=400$ square cm. The number of tiles is $120000/400=300$.", "answer_contract": {"kind": "exact"}},
      {"problem": "A rectangular tank measures $50$ cm by $40$ cm by $30$ cm. How many litres of water does it hold when full?", "answer": "60", "solution_sketch": "The volume is $50\\cdot40\\cdot30=60000$ cubic cm. Dividing by $1000$ cubic cm per litre gives $60$ litres.", "answer_contract": {"kind": "unit", "quantity": "volume", "unit": "litre", "allow_omitted": true}},
      {"problem": "A tank holds $2400$ litres of water. Its base measures $2$ m by $1$ m. How deep is the water, in centimetres?", "answer": "120", "solution_sketch": "The volume is $2400$ litres $=2.4$ cubic metres and the base is $2$ square metres. The depth is $2.4/2=1.2$ m, which is $120$ cm.", "answer_contract": {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}},
      {"problem": "Convert $3$ square metres to square centimetres. What is the number of square centimetres?", "answer": "30000", "solution_sketch": "An area factor is the length factor squared: $100^2=10000$. So $3$ square metres is $3\\cdot10000=30000$ square cm.", "answer_contract": {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}},
      {"problem": "A water butt holds $250$ litres. How many cups of $500$ cm³ can be filled from it?", "answer": "500", "solution_sketch": "The butt holds $250\\cdot1000=250000$ cubic cm. The number of cups is $250000/500=500$.", "answer_contract": {"kind": "exact"}}
    ]}
  ]}
]
