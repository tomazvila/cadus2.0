            answer: "18"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The size of a change is its distance from $0$, so it is $|-18| = 18$. The account moved by $18$ dollars.'
          - problem: 'Which is farther from $0$ on the number line, $-15$ or $12$?'
            answer: "-15"
            answer_contract: {"kind":"label","options":[["-15","negative 15","minus 15","-15 is farther","the first"],["12","positive 12","12 is farther","the second"]]}
            solution_sketch: 'We have $|-15| = 15$ and $|12| = 12$. Since $15$ is larger than $12$, the number $-15$ is farther from $0$.'
          - problem: 'What is the value of $|-13|$?'
            answer: "13"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bars give the distance of $-13$ from $0$, and a distance is never negative. So $|-13| = 13$.'
          - problem: 'What is $|0|$?'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $0$ is at distance $0$ from itself. So $|0| = 0$, and this is the only number with absolute value $0$.'
        constraints: "integers from -20 to 20"
      - id: kp2
        name: Absolute value in expressions
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Compute $|-4| + |3|$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $|-4| = 4$ and $|3| = 3$. Adding them gives $4 + 3 = 7$.'
