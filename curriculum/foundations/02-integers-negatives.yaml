    knowledge_points:
      - id: kp1
        name: Products of several signed factors
        key_prerequisites: [multiplying-integers]
        exemplars:
          - problem: 'Compute $-2 \times 3 \times (-4)$.'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $-2 \times 3 = -6$. Then $-6 \times (-4) = 24$, because two negative factors make the product positive.'
          - problem: 'Compute $(-1)(-2)(-3)$.'
            answer: "-6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are three negative factors, an odd count, so the product is negative. The sizes give $1 \times 2 \times 3 = 6$, so the product is $-6$.'
          - problem: 'The bank takes $\$5$ from each of $3$ accounts every month. What is the total change in the balances after $4$ months?'
            answer: "-60"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Each withdrawal is $-5$ dollars, and there are $3$ accounts over $4$ months. The change is $(-5) \times 3 \times 4 = -60$ dollars.'
          - problem: 'Compute $-3 \times (-2) \times 5$.'
            answer: "30"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two negative factors, an even count, give a positive product. The sizes give $3 \times 2 \times 5 = 30$.'
          - problem: 'A club cancels $3$ debts of $\$4$ each every month for $6$ months. What is the total change in the club''s balance?'
            answer: "72"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Cancelling a debt of $4$ dollars is a change of $(-1)(-4)$. Over $3$ debts and $6$ months the change is $(-3)(-4)(6) = 72$ dollars.'
          - problem: 'Compute $(-5)(4)(-2)$.'
            answer: "40"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two negative factors make the product positive. The sizes give $5 \times 4 \times 2 = 40$.'
          - problem: 'Compute $-2 \times (-2) \times (-2)$.'
            answer: "-8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three negative factors, an odd count, give a negative product. The sizes give $2 \times 2 \times 2 = 8$, so the product is $-8$.'
          - problem: 'Find the value of $(-4)(-3)(-2)$.'
            answer: "-24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The size is $4 \times 3 \times 2 = 24$, and there are three negative factors. An odd count gives a negative product, $-24$.'
        constraints: "three factors; values from -12 to 12 (contexts may use other sizes)"
      - id: kp2
        name: Mixed multiplication and division chains
        key_prerequisites: [multiplying-integers, dividing-integers]
        exemplars:
          - problem: 'Compute $-36 \div (-6) \times 2$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Work from left to right. First $-36 \div (-6) = 6$, then $6 \times 2 = 12$.'
          - problem: 'The temperature changed by $-36$ degrees Celsius over $9$ hours at a steady rate. At that rate, what is the change in temperature over $5$ hours?'
            answer: "-20"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The change per hour is $-36 \div 9 = -4$ degrees. Over $5$ hours the change is $-4 \times 5 = -20$ degrees.'
          - problem: 'Compute $54 \div (-9) \times 4$.'
            answer: "-24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Work from left to right. First $54 \div (-9) = -6$, then $-6 \times 4 = -24$.'
          - problem: 'Compute $-40 \div 5 \times (-3)$.'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $-40 \div 5 = -8$. Then $-8 \times (-3) = 24$, since two negatives give a positive.'
          - problem: 'A shop lost $\$840$ in $7$ months at a steady rate. What is the change in its balance over $12$ months at the same rate?'
            answer: "-1440"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The change per month is $-840 \div 7 = -120$ dollars. Over $12$ months the change is $-120 \times 12 = -1440$ dollars.'
          - problem: 'Compute $-6 \times 7 \div (-2)$.'
            answer: "21"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $-6 \times 7 = -42$. Then $-42 \div (-2) = 21$.'
          - problem: 'Find the value of $-48 \div 6 \times (-2)$.'
            answer: "16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Division and multiplication have equal priority, so the order is left to right. First $-48 \div 6 = -8$, then $-8 \times (-2) = 16$.'
          - problem: 'Compute $-8 \times 9 \div (-12)$.'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $-8 \times 9 = -72$. Then $-72 \div (-12) = 6$.'
        constraints: "left-to-right chains of two operations; exact quotients"
      - id: kp3
        name: Sign from the count of negative factors
        key_prerequisites: [multiplying-integers]
        exemplars:
