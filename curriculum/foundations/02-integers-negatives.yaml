            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $8$ is the same as adding $-8$, so $3 - 8 = 3 + (-8)$. The signs differ and $8 - 3 = 5$, so the result is $-5$.'
          - problem: 'What is $-2$ minus $6$?'
            answer: "-8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $6$ is the same as adding $-6$, so we get $-2 + (-6)$. Both numbers are negative, so the sizes add to $8$ and the result is $-8$.'
          - problem: 'The temperature is $3$ degrees and then drops by $12$ degrees. What is the new temperature?'
            answer: "-9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A drop of $12$ means subtracting $12$, so the new temperature is $3 - 12 = 3 + (-12)$. The signs differ and $12 - 3 = 9$, so the result is $-9$ degrees.'
          - problem: 'Subtract $9$ from $-5$.'
            answer: "-14"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We compute $-5 - 9 = -5 + (-9)$. Both numbers are negative, so the sizes add to $14$ and the result is $-14$.'
          - problem: 'Find the difference when $11$ is taken from $4$.'
            answer: "-7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking $11$ from $4$ gives $4 - 11 = 4 + (-11)$. The signs differ and $11 - 4 = 7$, so the result is $-7$.'
          - problem: 'Mia''s bank account holds $20$ dollars and a purchase takes $35$ dollars from it. The account may be overdrawn. What is her balance now?'
            answer: "-15"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The balance is $20 - 35 = 20 + (-35)$. The signs differ and $35 - 20 = 15$, so the balance is $-15$ dollars.'
          - problem: 'A submarine is at an elevation of $-40$ m and dives $25$ m deeper. What is its new elevation?'
            answer: "-65"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Diving deeper lowers the elevation, so the new elevation is $-40 - 25 = -40 + (-25)$. Both numbers are negative, so the sizes add to $65$ and the result is $-65$ m.'
          - problem: 'Find the value of $-4 - 7$.'
            answer: "-11"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $7$ is the same as adding $-7$, so we get $-4 + (-7)$. Both numbers are negative, so the sizes add to $11$ and the result is $-11$.'
        constraints: "integers from -12 to 12; subtrahend positive"
      - id: kp2
        name: Subtracting a negative
        key_prerequisites: [opposites-of-integers]
        try_first:
          problem: 'The temperature at the top of a mountain is $-3$ degrees and at its base it is $5$ degrees. How many degrees warmer is the base than the top?'
          answer_contract: {"kind":"exact"}
          answer: '8'
          reveal: 'The gap is the warmer reading minus the colder one, $5 - (-3)$. Taking away a negative number adds its positive, so the base is $5 + 3 = 8$ degrees warmer.'
        exemplars:
          - problem: 'Compute $5 - (-3)$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $-3$ is the same as adding $3$. So $5 - (-3) = 5 + 3 = 8$.'
