      - id: multiplication-tables
        weight: 0.7
        key: true
      - id: multi-digit-multiplication
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Read and write powers
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Write $4 \times 4 \times 4$ in exponent form.'
            answer: "4^3"
            solution_sketch: 'Three equal factors of $4$: $4^3$.'
          - problem: 'Compute $2^3$.'
            answer: "8"
            solution_sketch: '$2 \times 2 \times 2 = 8$.'
          - problem: 'Evaluate $5^3$.'
            answer: "125"
            solution_sketch: '$5 \times 5 \times 5 = 125$.'
          - problem: 'Write $6 \times 6 \times 6 \times 6$ in exponent form.'
            answer: "6^4"
            solution_sketch: 'Four equal factors of $6$: $6^4$.'
        constraints: "base 2-6, exponent 2-4"
      - id: kp2
        name: Evaluate small powers
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $5^2$.'
            answer: "25"
            solution_sketch: '$5 \times 5 = 25$.'
          - problem: 'Evaluate $3^3$.'
            answer: "27"
            solution_sketch: '$3 \times 3 \times 3 = 27$.'
          - problem: 'What is $10^4$?'
            answer: "10000"
            solution_sketch: 'Each factor of $10$ appends a zero: $10{,}000$.'
          - problem: 'Find the value of $2^4$.'
            answer: "16"
            solution_sketch: '$2 \times 2 \times 2 \times 2 = 16$.'
        constraints: "base 2-10, exponent 2-4; products at most 10000"
    diagnostic_exemplar:
      problem: 'Compute $6^2$.'
      answer: "36"
      solution_sketch: '$6^2$ means $6 \times 6 = 36$ — not $6 \times 2$.'
    anki_seeds:
      - front: "The expression a^n means..."
        back: "the product of n factors of a"
        type: basic

  - id: integer-exponents-intro
    name: Introduction to Integer Exponents
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 55
    prerequisites:
      - id: exponent-notation
        weight: 0.7
        key: true
      - id: integer-multiplication-division
        weight: 0.7
        key: true
      - id: order-of-operations
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Negative bases
        key_prerequisites: [integer-multiplication-division, exponent-notation]
        exemplars:
          - problem: 'Compute $(-3)^2$.'
            answer: "9"
            solution_sketch: '$(-3) \times (-3) = 9$.'
          - problem: 'Evaluate $(-2)^3$.'
            answer: "-8"
            solution_sketch: '$(-2) \times (-2) \times (-2) = -8$; an odd number of negatives is negative.'
          - problem: 'What is $(-4)^2$?'
            answer: "16"
            solution_sketch: '$(-4) \times (-4) = 16$; an even number of negative factors gives a positive result.'
          - problem: 'Find the value of $(-4)^4$.'
            answer: "256"
            solution_sketch: '$(-4) \times (-4) \times (-4) \times (-4) = 256$; an even number of negative factors gives a positive result.'
        constraints: "base -4 to -2, exponent 2-4; base in parentheses"
      - id: kp2
        name: Distinguish -a^n from (-a)^n
        key_prerequisites: [order-of-operations, integer-multiplication-division]
        exemplars:
          - problem: 'Compute $-2^4$.'
            answer: "-16"
            solution_sketch: 'Without parentheses the exponent binds first: $-(2^4) = -16$.'
          - problem: 'Compute $(-2)^4$.'
            answer: "16"
            solution_sketch: 'The parentheses put the minus inside: four negative factors give a positive.'
          - problem: 'Evaluate $-3^3$.'
            answer: "-27"
            solution_sketch: 'The exponent binds first: $-(3^3) = -(27) = -27$.'
          - problem: 'What is $(-3)^3$?'
            answer: "-27"
            solution_sketch: '$(-3) \times (-3) \times (-3) = -27$; an odd number of negative factors gives a negative result.'
        constraints: "pair -a^n with (-a)^n; base 2-4, exponent 2-4"
      - id: kp3
        name: Exponents in the order of operations
        key_prerequisites: [order-of-operations, exponent-notation]
        exemplars:
          - problem: 'Compute $2^3 + 3^2$.'
            answer: "17"
            solution_sketch: '$8 + 9 = 17$.'
          - problem: 'Compute $(5 - 8)^2$.'
            answer: "9"
            solution_sketch: 'Inside first: $(-3)^2 = 9$.'
          - problem: 'Compute $2 \times (-3)^2$.'
            answer: "18"
            solution_sketch: 'Exponent before multiplication: $2 \times 9 = 18$.'
          - problem: 'Compute $(-3)^3 + 5^2$.'
            answer: "-2"
            solution_sketch: '$(-3)^3 = -27$; $5^2 = 25$; $-27 + 25 = -2$.'
        constraints: "exponents mixed with one or two other operations"
    diagnostic_exemplar:
      problem: 'Compute $(-2)^4 + (-2^3)$.'
      answer: '8'
      solution_sketch: '$(-2)^4 = 16$ and $-2^3 = -8$, so $16 - 8 = 8$.'
    anki_seeds:
      - front: "Difference between (-a)^2 and -a^2:"
        back: "(-a)^2 is positive (the minus is inside); -a^2 is negative (the exponent applies before the minus sign)"
        type: basic

  - id: temperature-elevation-problems
    name: Temperature and Elevation Problems
    # over-coverage: thermometer/elevation dressing on adding-integers +
    # subtracting-integers; its only dependent is already supplemental
    core: false
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: adding-integers
        weight: 0.6
        key: true
      - id: subtracting-integers
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Apply a single signed change
        key_prerequisites: [adding-integers]
        exemplars:
          - problem: 'The temperature was $-4\text{ C}$ and rose $9\text{ C}$. What is the new temperature in C?'
            answer: "5"
            solution_sketch: '$-4 + 9 = 5$.'
          - problem: 'A diver at $-30\text{ m}$ descends another $15\text{ m}$. What is the new depth in meters?'
            answer: "-45"
            solution_sketch: '$-30 - 15 = -45$.'
          - problem: 'The temperature was $-12\text{ C}$ and dropped $7\text{ C}$. What is the new temperature in C?'
            answer: "-19"
            solution_sketch: '$-12 - 7 = -19$.'
          - problem: 'A hiker at $40\text{ m}$ elevation climbs another $25\text{ m}$. What is the new elevation in meters?'
            answer: "65"
            solution_sketch: '$40 + 25 = 65$.'
        constraints: "single-step signed addition/subtraction; values from -60 to 60"
      - id: kp2
        name: Find the change or gap between two levels
        key_prerequisites: [subtracting-integers]
        exemplars:
          - problem: 'The temperature rose from $-8\text{ C}$ to $6\text{ C}$. By how many degrees did it rise?'
            answer: "14"
            solution_sketch: '$6 - (-8) = 14$.'
          - problem: 'A plane flies at $2400\text{ m}$ while a submarine sits at $-60\text{ m}$. What is the vertical distance between them in meters?'
            answer: "2460"
            solution_sketch: '$2400 - (-60) = 2460$.'
          - problem: 'A weather balloon rose from $-15\text{ m}$ to $60\text{ m}$. By how many metres did it rise?'
            answer: "75"
            solution_sketch: '$60 - (-15) = 75$.'
          - problem: 'The temperature fell from $-3\text{ C}$ to $-18\text{ C}$. By how many degrees did it fall?'
            answer: "15"
            solution_sketch: '$-3 - (-18) = 15$.'
        constraints: "difference of two signed levels; subtract end minus start"
    diagnostic_exemplar:
      problem: 'A hiker stands at $350$ m while a cave explorer is at $-40$ m. What is the vertical distance between them in metres?'
      answer: '390'
      solution_sketch: '$350 - (-40) = 390$.'
    anki_seeds:
      - front: "To find how much a quantity changed, compute..."
        back: "final value minus initial value (works even when either is negative)"
        type: basic

  - id: integer-word-problems
    name: Integer Word Problems
    core: false                # enrichment / applications leaf topic
    difficulty: 0.35
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: temperature-elevation-problems
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.5
      - id: absolute-value
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Net change over multiple steps
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'An account has €50, then an €80 withdrawal is made. What is the balance in euros?'
            answer: "-30"
            answer_contract: {kind: exact}
            solution_sketch: '$50 - 80 = -30$.'
          - problem: 'A team gains $7$ metres, loses $12$, then gains $5$. What is the net gain in metres?'
            answer: "0"
            answer_contract: {kind: exact}
            solution_sketch: '$7 - 12 + 5 = 0$.'
          - problem: 'A hot air balloon at $120$ m descends $45$ m, then descends another $30$ m. What is its height in meters?'
            answer: "45"
            answer_contract: {kind: exact}
            solution_sketch: '$120 - 45 - 30 = 45$.'
          - problem: 'A submarine at $-40$ m rises $25$ m, then descends $60$ m. What is its depth in meters?'
            answer: "-75"
            answer_contract: {kind: exact}
            solution_sketch: '$-40 + 25 - 60 = -75$.'
        constraints: "two or three signed steps"
      - id: kp2
        name: Repeated signed changes
        key_prerequisites: [integer-multiplication-division, integer-addition-subtraction]
        exemplars:
          - problem: 'A player starts with $10$ points and loses $4$ points on each of $3$ turns. What is the final score?'
            answer: "-2"
            answer_contract: {kind: exact}
            solution_sketch: '$10 + 3 \times (-4) = 10 - 12 = -2$.'
          - problem: 'Starting at $4\text{ C}$, the temperature drops $3\text{ C}$ every hour for $5$ hours. What is the final temperature in C?'
            answer: "-11"
            answer_contract: {kind: exact}
            solution_sketch: '$4 + 5 \times (-3) = 4 - 15 = -11$.'
          - problem: 'A stock starts at $\$80$ and loses $\$15$ each of the next $3$ trading days. What is its value in dollars?'
            answer: "35"
            answer_contract: {kind: exact}
            solution_sketch: '$80 - 3 \times 15 = 35$.'
          - problem: 'A hiker starts at $-20$ m elevation and climbs $8$ m every $10$ minutes for $50$ minutes. What is the new elevation in meters after $50$ minutes?'
            answer: "20"
            answer_contract: {kind: exact}
            solution_sketch: '$-20 + 5 \times 8 = 20$.'
        constraints: "one multiplication of a signed rate by a count, plus a start value"
    diagnostic_exemplar:
      problem: 'Starting at $6\text{ C}$, the temperature drops $4\text{ C}$ every hour for $3$ hours. What is the final temperature in C?'
      answer: '-6'
      solution_sketch: '$6 + 3 \times (-4) = 6 - 12 = -6$.'
    anki_seeds:
      - front: "Setup for a start value with n repeated signed changes of size r:"
        back: "final = start + n × r (r is negative for losses or drops)"
        type: basic
      - front: "In a signed word problem, gains/deposits/rises translate to ___ and losses/withdrawals/drops to ___"
        back: "adding a positive number; adding a negative number (subtracting)"
        type: basic
