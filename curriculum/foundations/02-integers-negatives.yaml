unit: integers-negatives
course: foundations
module: "Integers"
topics:
  - id: plotting-integers
    name: Plotting and Reading Integers
    core: true
    difficulty: 0.1
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: place-value
        weight: 0.5
        key: true
      - id: single-digit-addition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Signed numbers describe direction from zero
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'The temperature is $5$ degrees below zero. What integer represents this temperature?'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Below zero is the negative direction, so $5$ degrees below zero is $-5$. The sign carries the direction and the digit carries the amount.'
          - problem: 'A gain of $3$ metres is written $+3$. What integer represents a loss of $8$ metres?'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A loss is the opposite direction to a gain. A loss of $8$ metres is therefore written $-8$.'
          - problem: 'A scuba diver is $18$ metres below sea level. What integer represents this depth?'
            answer: '-18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sea level is the reference value zero. A position below it is negative, so the diver is at $-18$.'
          - problem: 'The value of an investment rises by $\$11$. What integer represents this change?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A rise in value is a move in the positive direction. A rise of $\$11$ is the integer $11$.'
          - problem: 'A lift starts at floor $0$ and goes down $4$ floors, then down $3$ more floors. What integer shows the floor it ends on?'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both moves go below floor $0$, so the distances add: $4+3=7$ floors down. Below zero is negative, so the lift ends on floor $-7$.'
          - problem: 'Tom owes his friend $\$9$. If money he has counts as positive, what integer shows Tom''s money?'
            answer: '-9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Money owed is the opposite of money held. Debts are written as negative integers, so Tom''s money is $-9$.'
          - problem: 'A submarine is $30$ metres below sea level. It rises until it is exactly at sea level. What integer shows its height now?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sea level is the reference, so being exactly at sea level means no distance above or below. That height is the integer $0$.'
          - problem: 'A golfer finishes $4$ strokes under par, and par counts as $0$. What integer shows the golfer''s score?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Under par is below the reference value $0$, so it is negative. The golfer''s score is $-4$.'
        constraints: "real-world contexts (temperature, elevation, money); values from -20 to 20"
      - id: kp2
        name: Locate integers on the number line
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'What integer is $4$ units to the left of $0$ on the number line?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Left of $0$ is the negative side of the number line. Four units to the left of $0$ is $-4$.'
          - problem: 'Start at $0$ and move $6$ units to the right. What integer do you land on?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Right of $0$ is the positive side. Six units to the right of $0$ is $6$.'
          - problem: 'A grasshopper starts at $0$ and hops $9$ units in the negative direction. What integer is it on now?'
            answer: '-9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Hopping in the negative direction from $0$ by $9$ units lands on $-9$. The hop goes left on the number line.'
          - problem: 'Start at $0$ and move $2$ units to the right, then $7$ units to the left. What integer do you land on?'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two units right of $0$ reaches $2$. From $2$, seven units left lands on $-5$.'
          - problem: 'A hiker is at marker $-5$ on a trail line where east is the positive direction. She walks $8$ units east. What integer marks her new position?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'East is the positive direction, so the hiker moves right from $-5$. After $5$ units she is at $0$, and $3$ more units bring her to $3$.'
          - problem: 'A lift is on floor $2$ and goes down $5$ floors. What integer shows the floor it is on now?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Going down moves left on the number line. From $2$, two floors down reaches $0$ and three more reach $-3$.'
          - problem: 'A frog is at $-2$ on a number line and jumps $5$ units to the left. What integer does it land on?'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Left is the negative direction. Starting at $-2$ and moving $5$ units left gives $-7$.'
          - problem: 'Point $C$ is $3$ units to the right of $-8$ on a number line. What integer is point $C$?'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Moving right from $-8$ increases the value. Three units right of $-8$ is $-5$.'
        constraints: "integers from -10 to 10; moves start at 0"
    diagnostic_exemplar:
      problem: 'What integer is $7$ units to the left of $0$?'
      answer: "-7"
      solution_sketch: 'Left of zero is negative, so seven units left is $-7$.'
    anki_seeds:
      - front: "On a horizontal number line, negative integers lie to the ___ of zero."
        back: "left"
        type: basic

  - id: opposites-of-integers
    name: Opposites of Integers
    core: true
    difficulty: 0.12
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: plotting-integers
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Opposite of an integer
        key_prerequisites: [plotting-integers]
        try_first:
          problem: 'What number is as far to the left of $0$ as $9$ is to the right of $0$?'
          answer_contract: {"kind":"exact"}
          answer: '-9'
          reveal: 'The number is the mirror image of $9$ across $0$, which is its opposite. In the lesson you learn why the opposite of $9$ is $-9$.'
        exemplars:
          - problem: 'What is the opposite of $-7$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The opposite is the mirror image across $0$: it has the same distance from $0$ on the other side. The opposite of $-7$ is $7$.'
          - problem: 'What number is the same distance from $0$ as $12$, but on the other side?'
            answer: '-12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numbers $12$ and $-12$ sit the same distance from $0$ on opposite sides. The answer is $-12$.'
          - problem: 'What is the opposite of $0$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The opposite of a number lies on the other side of $0$. The number $0$ has no other side, so its opposite is $0$ itself.'
          - problem: 'Reflect $-20$ across $0$ on the number line. What integer results?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A reflection across $0$ keeps the distance and swaps the side. The reflection of $-20$ is $20$.'
          - problem: 'On Monday the balance of an account changes by $+\$35$. What change on Tuesday would undo it?'
            answer: '-35'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'To undo a change, apply its opposite. The opposite of $+35$ is $-35$.'
          - problem: 'A diver descends $14$ metres, which is a change of $-14$. What integer shows the change that brings her back to where she started?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Climbing back is the opposite move to descending. The opposite of $-14$ is $14$.'
          - problem: 'What is the opposite of $5$?'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The opposite of a number is on the other side of $0$ at the same distance. The reciprocal $\frac{1}{5}$ is a different idea, so the opposite of $5$ is $-5$.'
          - problem: 'The point $P$ is $16$ units to the right of $0$. Its mirror image across $0$ is the point $Q$. What integer is at $Q$?'
            answer: '-16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The mirror image of $16$ across $0$ is its opposite. The point $Q$ is at $-16$.'
        constraints: "integers from -20 to 20; include 0 occasionally"
      - id: kp2
        name: Opposite of an opposite
        key_prerequisites: [plotting-integers]
        exemplars:
          - problem: 'Simplify $-(-4)$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inner number is $-4$. The outer minus takes its opposite, which is $4$.'
          - problem: 'Simplify $-(-(-9))$.'
            answer: '-9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each minus sign flips the sign once. Working from the inside: $-(-9)=9$, then $-(9)=-9$.'
          - problem: 'What is the opposite of the opposite of $8$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The opposite of $8$ is $-8$. The opposite of $-8$ is $8$, so two flips return the original number.'
          - problem: 'Reflect $0$ across zero, then reflect the result across zero again. What integer do you get?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Reflecting $0$ across zero gives $0$ every time. After two reflections the result is still $0$.'
          - problem: 'A thermostat reading starts at $-6$ degrees. It is changed to its opposite, and the new reading is changed to its opposite again. What is the reading at the end?'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first change gives $6$ and the second gives $-6$. Two flips return the reading to its start, $-6$.'
          - problem: 'Ana''s balance changes by $-15$ dollars for a charge. The bank cancels the charge, then cancels the cancellation. What is the balance change now?'
            answer: '-15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Cancelling the charge gives the opposite, $15$. Cancelling that gives the opposite again, $-15$, so the charge stands.'
          - problem: 'Find the value of $-(-(-(-3)))$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four minus signs flip the sign four times. An even number of flips keeps the sign of $3$, so the value is $3$.'
          - problem: 'A number $n$ satisfies $-n=-7$. What is $n$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The opposite of $n$ is $-7$. So $n$ is the opposite of $-7$, which is $7$.'
        constraints: "up to three nested opposites; integers from -12 to 12"
    diagnostic_exemplar:
      problem: 'Compute $-(-11)$.'
      answer: "11"
      solution_sketch: 'The opposite of the opposite is the number itself: $11$.'
    anki_seeds:
      - front: "The opposite of a number is the number ..."
        back: "the same distance from 0 on the other side of the number line; -(-a) = a"
        type: basic

  - id: number-line-integers
    name: Integers on the Number Line
    core: true
    difficulty: 0.15
    drill: false
    answer_kind: numeric
    expected_time_secs: 40
    prerequisites:
      - id: plotting-integers
        weight: 0.7
        key: true
      - id: opposites-of-integers
        weight: 0.4
      - id: place-value
        weight: 0.3
      - id: single-digit-addition
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Order and compare integers
        key_prerequisites: [plotting-integers]
        exemplars:
          - problem: 'Which is greater, $-3$ or $-5$?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the number line, $-3$ is to the right of $-5$. The integer farther right is greater, so $-3$ is greater.'
          - problem: 'Order from least to greatest: $2$, $-4$, $0$, $-1$.'
            answer: '-4, -1, 0, 2'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'Place the numbers on the number line and read from left to right. The order is $-4$, $-1$, $0$, $2$.'
          - problem: 'Which integer is smaller, $-8$ or $-6$?'
            answer: '-8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integer $-8$ is to the left of $-6$ on the number line. The integer farther left is smaller, so $-8$ is smaller.'
          - problem: 'On Monday the low temperature was $-4$ degrees and on Tuesday it was $-9$ degrees. Which day was colder?'
            answer: 'Tuesday'
            answer_contract: {"kind":"label","options":[["tuesday","tuesday was colder","tue"],["monday","monday was colder","mon"]]}
            solution_sketch: 'Colder means farther left on the number line. The value $-9$ is to the left of $-4$, so Tuesday was colder.'
          - problem: 'The overnight temperatures in five cities were $3$, $-7$, $-2$, $0$ and $-10$ degrees. List them from coldest to warmest.'
            answer: '-10, -7, -2, 0, 3'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'The coldest is the farthest left on the number line. Reading from left to right gives $-10$, $-7$, $-2$, $0$, $3$.'
          - problem: 'Which is greater, $-12$ or $-3$?'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the number line $-3$ is to the right of $-12$, so $-3$ is greater.'
          - problem: 'Ana has a bank balance of $-\$12$ and Ben has a balance of $-\$7$. Who has more money?'
            answer: 'Ben'
            answer_contract: {"kind":"label","options":[["ana","ana has more","ana has more money"],["ben","ben has more","ben has more money"]]}
            solution_sketch: 'More money means farther right on the number line. The value $-7$ is to the right of $-12$, so Ben has more money.'
          - problem: 'Which of $-6$, $-1$, $-9$ and $-4$ is the greatest?'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Place the four numbers on the number line. The rightmost one is $-1$, so it is the greatest.'
          - problem: 'Order from greatest to least: $-2$, $5$, $-7$, $0$, $-5$.'
            answer: '5, 0, -2, -5, -7'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'The greatest is the farthest right on the number line. Reading from right to left gives $5$, $0$, $-2$, $-5$, $-7$.'
        constraints: "integers from -10 to 10"
      - id: kp2
        visuals: [{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[{"at":"-2","filled":true},{"at":"3","filled":true}],"intervals":[],"caption":"A number line with the two points the problem gives."},{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[{"at":"-8","filled":true},{"at":"-1","filled":true}],"intervals":[],"caption":"A number line with the two points the problem gives."},{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[{"at":"-7","label":"A","filled":true},{"at":"4","label":"B","filled":true}],"intervals":[],"caption":"A number line with point A at -7 and point B at 4."},{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[{"at":"-9","filled":true},{"at":"-3","filled":true}],"intervals":[],"caption":"A number line with the start point -9 and the end point -3."},{"kind":"number_line","min":"-10","max":"10","tick":"1","points":[{"at":"-4","filled":true},{"at":"7","filled":true}],"intervals":[],"caption":"A number line with the two points the problem gives."}]
        name: Distance between integers
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'How many units apart are $-2$ and $3$ on the number line?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            visual: 0
            solution_sketch: 'From $-2$ to $0$ is $2$ units and from $0$ to $3$ is $3$ units. The total is $2+3=5$.'
          - problem: 'What is the distance between $-8$ and $-1$ on the number line?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            visual: 1
            solution_sketch: 'Both numbers are on the same side of zero. Counting up from $-8$ to $-1$ gives $7$ units.'
          - problem: 'Points $A$ and $B$ sit at $-7$ and $4$ on a number line. How far apart are they?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            visual: 2
            solution_sketch: 'From $-7$ to $0$ is $7$ units and from $0$ to $4$ is $4$ units. The total is $7+4=11$.'
          - problem: 'By how many units do you move to get from $-9$ to $-3$ on the number line?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            visual: 3
            solution_sketch: 'Count up from $-9$ to $-3$ on the number line. That is $6$ units to the right.'
          - problem: 'The temperature fell from $4$ degrees at noon to $-9$ degrees at midnight. By how many degrees did it fall?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fall goes from $4$ down to $0$, which is $4$ degrees, and from $0$ down to $-9$, which is $9$ degrees. The total fall is $4+9=13$ degrees.'
          - problem: 'A submarine at $-40$ metres rises to $-15$ metres. How far does it rise?'
            answer: '25'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Both depths are below sea level. The rise is the difference $40-15=25$ metres.'
          - problem: 'A lift in a mine shaft starts $12$ metres above ground level and goes down to $-28$ metres. How far does the lift travel?'
            answer: '40'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'From $12$ down to $0$ is $12$ metres, and from $0$ down to $-28$ is $28$ metres. The lift travels $12+28=40$ metres.'
          - problem: 'What is the distance between $-4$ and $7$?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            visual: 4
            solution_sketch: 'The number $-4$ is on the other side of zero from $7$. The gaps $4$ and $7$ add, so the distance is $11$.'
        constraints: "integers from -10 to 10"
    diagnostic_exemplar:
      problem: 'How many units apart are $-4$ and $3$ on the number line?'
      answer: "7"
      solution_sketch: '$4$ units up to $0$, then $3$ more: $7$.'
    anki_seeds:
      - front: "On a number line, a number to the right is always ___ than a number to its left."
        back: "greater"
        type: basic

  - id: comparing-integers
    name: Comparing Integers with Inequality Symbols
    core: false                # comparison destination; number-line-integers stays core
    difficulty: 0.18
    drill: false
    # Answers are bare relation symbols, true/false, and inequality chains — none of
    # which the SymPy override can adjudicate; the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 45
    prerequisites:
      - id: number-line-integers
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: Write < or > between two integers
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Which symbol, $<$ or $>$, makes the statement $-8 \;\square\; -3$ true?'
            answer: '<'
            answer_contract: {"kind":"label","options":[["<","less than","is less than","smaller","-8 < -3","-8<-3"],[">","greater than","is greater than","larger"]]}
            solution_sketch: 'On the number line $-8$ is to the left of $-3$. The integer on the left is smaller, so the true statement is $-8<-3$.'
          - problem: 'On a winter night Oslo is at $-11$ degrees and Bergen is at $-4$ degrees. What is the temperature of the colder city?'
            answer: '-11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The colder city has the temperature farther left on the number line. The value $-11$ is left of $-4$, so the colder temperature is $-11$.'
          - problem: 'A submarine is at $-5$ metres and a diver is at $-11$ metres. Which symbol, $<$ or $>$, makes the statement $-5 \;\square\; -11$ true?'
            answer: '>'
            answer_contract: {"kind":"label","options":[["<","less than","is less than","smaller"],[">","greater than","is greater than","larger","-5 > -11","-5>-11"]]}
            solution_sketch: 'The depth $-5$ is to the right of $-11$ on the number line. The integer on the right is greater, so the true statement is $-5>-11$.'
          - problem: 'What is the smallest integer greater than $-6$?'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Greater than $-6$ means to the right of $-6$ on the number line. The first integer to the right is $-5$.'
          - problem: 'What is the greatest integer less than $-3$?'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Less than $-3$ means to the left of $-3$ on the number line. The first integer to the left is $-4$.'
          - problem: 'A number $x$ lies to the left of $-5$ on the number line, and the distance between $x$ and $-5$ is $4$. What is $x$?'
            answer: '-9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Lying to the left of $-5$ means $x$ is smaller than $-5$. Moving $4$ units left of $-5$ gives $-5-4=-9$.'
          - problem: 'List every integer $n$ with $-4<n<1$.'
            answer: '-3, -2, -1, 0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The integers strictly between $-4$ and $1$ lie to the right of $-4$ and to the left of $1$. They are $-3$, $-2$, $-1$ and $0$.'
          - problem: 'In a golf game the lowest score wins. Ana scored $-7$ and Ben scored $-2$. What was the winning score?'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The lowest score is the one farthest left on the number line. The value $-7$ is left of $-2$, so the winning score was $-7$.'
          - problem: 'Which is greater, $-9$ or $-2$?'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'On the number line $-2$ is to the right of $-9$, so $-2$ is greater.'
        constraints: "integers from -12 to 12; include negative-negative pairs"
      - id: kp2
        name: Judge and write inequality statements
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Write $3$, $-1$, $-4$ as a chain from least to greatest using $<$.'
            answer: '-4 < -1 < 3'
            answer_contract: {"kind":"ascending_chain"}
            solution_sketch: 'On the number line the order from left to right is $-4$, $-1$, $3$. Joining neighbors with $<$ gives $-4<-1<3$.'
          - problem: 'Is the statement $-7<-9$ true?'
            answer: 'No'
            answer_contract: {"kind":"label","options":[["yes","yes it is","true","it is true","correct"],["no","no it is not","false","it is not true","not true","incorrect"]]}
            solution_sketch: 'On the number line $-7$ is to the right of $-9$, so $-7>-9$. The statement $-7<-9$ is not true.'
          - problem: 'Arrange $-2$, $-8$, $-5$ in increasing order using $<$.'
            answer: '-8 < -5 < -2'
            answer_contract: {"kind":"ascending_chain"}
            solution_sketch: 'On the number line the increasing order is $-8$, $-5$, $-2$. Joining them with $<$ gives $-8<-5<-2$.'
          - problem: 'Is $-6<3$ a true statement?'
            answer: 'Yes'
            answer_contract: {"kind":"label","options":[["yes","yes it is","true","it is true","correct"],["no","no it is not","false","it is not true","not true","incorrect"]]}
            solution_sketch: 'On the number line $-6$ is to the left of $3$. The integer on the left is smaller, so $-6<3$ is true.'
          - problem: 'Arrange $4$, $-2$, $-7$ from greatest to least.'
            answer: '4, -2, -7'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'The greatest integer is the farthest right on the number line. Reading from right to left gives $4$, $-2$, $-7$.'
          - problem: 'At three weather stations the temperatures are $-3$, $5$ and $-10$ degrees. Write them from coldest to warmest using $<$.'
            answer: '-10 < -3 < 5'
            answer_contract: {"kind":"ascending_chain"}
            solution_sketch: 'The coldest temperature is the farthest left on the number line. The order is $-10$, $-3$, $5$, so the chain is $-10<-3<5$.'
          - problem: 'Three divers are at depths of $-14$, $-6$ and $-9$ metres. Write their positions from the highest to the lowest.'
            answer: '-6, -9, -14'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'The highest position is the farthest right on the number line. Reading from right to left gives $-6$, $-9$, $-14$.'
          - problem: 'Put $-4$, $-8$ and $0$ in order from least to greatest.'
            answer: '-8 < -4 < 0'
            answer_contract: {"kind":"ascending_chain"}
            solution_sketch: 'On the number line $-8$ is farther left than $-4$. The chain is $-8<-4<0$.'
          - problem: 'Give an integer $n$ with $-9<n<-5$.'
            answer: '-7'
            answer_contract: {"kind":"property","check":"integer_in_range","args":{"min":-8,"max":-6}}
            solution_sketch: 'The integers between $-9$ and $-5$ are $-8$, $-7$ and $-6$. Any one of them works, for example $-7$.'
        constraints: "true/false judgments and chains of up to three integers"
    diagnostic_exemplar:
      problem: 'Write $5$, $-2$, $-9$ as a chain from least to greatest using $<$.'
