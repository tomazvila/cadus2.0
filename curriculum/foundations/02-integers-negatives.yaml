            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two negatives make a positive quotient. Since $18 \div 3 = 6$, the quotient is $6$.'
          - problem: 'A tank is draining, and its volume changes by $-6$ litres each minute. The total change was $-54$ litres. For how many minutes did it drain?'
            answer: "9"
            answer_contract: {"kind":"unit","quantity":"time","unit":"minute","allow_omitted":true}
            solution_sketch: 'The number of minutes is the total change divided by the change per minute. So $-54 \div (-6) = 9$ minutes.'
          - problem: 'Divide $-48$ by $-6$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both numbers are negative, so the quotient is positive. Since $48 \div 6 = 8$, the quotient is $8$.'
          - problem: 'A submarine''s depth changes by $-15$ metres each minute. Its depth changed by $-165$ metres in all. How many minutes did the dive last?'
            answer: "11"
            answer_contract: {"kind":"unit","quantity":"time","unit":"minute","allow_omitted":true}
            solution_sketch: 'The time is the total change divided by the change per minute. So $-165 \div (-15) = 11$ minutes.'
          - problem: 'What is $-45$ divided by $-9$?'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two negatives give a positive quotient. Since $45 \div 9 = 5$, the quotient is $5$.'
          - problem: 'Find the value of $-60 \div (-5)$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The size is $60 \div 5 = 12$. Two negatives give a positive quotient, so the value is $12$.'
          - problem: 'Find the quotient of $-84$ and $-12$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both numbers are negative, so the quotient is positive. Since $84 \div 12 = 7$, the quotient is $7$.'
        constraints: "divides evenly; values from -60 to 60 (contexts may use larger sizes); both negative"
    diagnostic_exemplar:
      problem: 'Compute $-54 \div (-9)$.'
      answer: "6"
      solution_sketch: 'Two negatives give a positive quotient: $54 \div 9 = 6$.'
    anki_seeds:
      - front: "Division follows the same sign rules as..."
        back: "multiplication (same signs give positive, different signs give negative)"
        type: basic

  - id: integer-multiplication-division
    name: Multiplying and Dividing Integers
    core: true
