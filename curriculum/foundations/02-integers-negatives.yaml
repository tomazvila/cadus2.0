            answer: "16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are four negative factors, an even count, so the product is positive. The sizes give $2^4 = 16$.'
          - problem: 'A number machine multiplies its input by $-2$ each time it runs. You enter $3$ and run it $5$ times in a row. What number comes out?'
            answer: "-96"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The result is $3 \times (-2)^5$. Five negative factors give a negative product, and $3 \times 32 = 96$, so the number is $-96$.'
          - problem: 'Compute $-2 \times (-2) \times (-2) \times (-2) \times (-2)$.'
            answer: "-32"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are five negative factors, an odd count, so the product is negative. The sizes give $2^5 = 32$, so the product is $-32$.'
          - problem: 'Compute $-3 \times (-1) \times 4 \times (-2) \times (-1)$.'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are four negative factors, an even count, so the product is positive. The sizes give $3 \times 1 \times 4 \times 2 \times 1 = 24$.'
          - problem: 'Is the product $(-3)(-7)(-2)(-5)(-4)$ positive or negative?'
            answer: "negative"
            answer_contract: {"kind":"label","options":[["negative","it is negative","a negative number","negative number","a negative product","negative product","neg"],["positive","it is positive","a positive number","positive number","a positive product","positive product","pos"]]}
            solution_sketch: 'All five factors are negative, and five is an odd count. An odd count of negative factors gives a negative product.'
          - problem: 'Compute $(-2) \times 5 \times (-1) \times (-3) \times (-4)$.'
            answer: "120"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The negative factors are $-2$, $-1$, $-3$ and $-4$, an even count, so the product is positive. The sizes give $2 \times 5 \times 1 \times 3 \times 4 = 120$.'
          - problem: 'A number machine multiplies its input by $-3$ each time it runs. You enter $2$ and run it $4$ times in a row. What number comes out?'
            answer: "162"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The result is $2 \times (-3)^4$. Four negative factors give a positive product, and $2 \times 81 = 162$.'
          - problem: 'Find the value of $(-1)(-1)(-1)(-1)(-1)(-1)(-1)$.'
            answer: "-1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Pairs of $-1$ do give $1$, but there are seven factors, an odd count. One factor is left over, so the product is $-1$.'
        constraints: "three to five factors, or a repeated multiplier; reason from parity of negatives"
    diagnostic_exemplar:
      problem: 'Compute $(-2)(-3)(-4) \div 6$.'
      answer: '-4'
      solution_sketch: 'Three negative factors give a negative product, $-24$; then $-24 \div 6 = -4$.'
    anki_seeds:
