            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $-6$ sits $6$ units to the left of $0$ on the number line. A distance is never negative, so $|-6| = 6$.'
          - problem: 'A diver is at an elevation of $-23$ m relative to the surface of a lake. How far is the diver from the surface?'
            answer: "23"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
