            solution_sketch: 'Both numbers are positive, so add them as usual: $8 + 5 = 13$. The sum keeps the positive sign.'
          - problem: 'A weather station records a change of $-4$ degrees on Monday and a change of $-7$ degrees on Tuesday. What is the total change over the two days?'
            answer: "-11"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both changes are drops, so the total change is $-4 + (-7)$. The sizes add to $4 + 7 = 11$ and the sign stays negative, so the total is $-11$ degrees.'
          - problem: 'Lena''s balance with her brother is $-12$ dollars and her balance with a friend is $-8$ dollars. What is her balance overall?'
            answer: "-20"
