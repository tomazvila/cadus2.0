            answer_contract: {"kind":"exact"}
            solution_sketch: 'Division comes before subtraction, so $12 \div (-4) = -3$ first. Then $10 - (-3) = 13$.'
          - problem: 'Dan''s balance is $\$20$. The bank takes $\$15$ every week for $4$ weeks. The account may be overdrawn. What is his balance after $4$ weeks?'
            answer: "-40"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The bank takes $15 \times 4 = 60$ dollars in all, found before subtracting. The balance is $20 - 60 = -40$ dollars.'
          - problem: 'Compute $-8 - 3 \times (-2)$.'
            answer: "-2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplication comes first: $3 \times (-2) = -6$. Then $-8 - (-6) = -8 + 6 = -2$.'
          - problem: 'Compute $9 + 8 \div (-4)$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Division comes first: $8 \div (-4) = -2$. Then $9 + (-2) = 7$.'
          - problem: 'The temperature is $4$ degrees Celsius. A cold front then changes it by $-30$ degrees in total, spread equally over $5$ hours. What is the temperature after $2$ of those hours?'
            answer: "-8"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The change per hour is $-30 \div 5 = -6$ degrees. After $2$ hours the change is $-12$ degrees, so the temperature is $4 + (-12) = -8$.'
          - problem: 'Find the value of $-6 + 2 \times (-5)$.'
            answer: "-16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplication comes before addition, so $2 \times (-5) = -10$ first. Then $-6 + (-10) = -16$.'
          - problem: 'Compute $-12 - 18 \div (-6)$.'
            answer: "-9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Division comes first: $18 \div (-6) = -3$. Then $-12 - (-3) = -12 + 3 = -9$.'
        constraints: "one multiplication or division plus one addition or subtraction; values from -12 to 12 (contexts may use larger sizes)"
      - id: kp2
        name: Parentheses with signed numbers
        key_prerequisites: [order-of-operations, integer-addition-subtraction]
        exemplars:
          - problem: 'Compute $(-3 + 7) \times (-2)$.'
            answer: "-8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Work inside the parentheses first: $-3 + 7 = 4$. Then $4 \times (-2) = -8$.'
          - problem: 'Three hikers each start at elevation $-5$ metres and then climb $2$ metres. What is the sum of their new elevations?'
            answer: "-9"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Each hiker is now at $-5 + 2 = -3$ metres. For $3$ hikers the sum is $3 \times (-3) = -9$.'
          - problem: 'Compute $-2(5 - 9)$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Work inside the parentheses first: $5 - 9 = -4$. Then $-2 \times (-4) = 8$.'
          - problem: 'What is the average of the temperatures $-9$ degrees Celsius and $-3$ degrees Celsius?'
            answer: "-6"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The average is the sum divided by the count, and the sum comes first. So $(-9 + (-3)) \div 2 = -12 \div 2 = -6$.'
          - problem: 'Compute $(-6 - 4) \times (-3)$.'
            answer: "30"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Inside the parentheses first: $-6 - 4 = -10$. Then $-10 \times (-3) = 30$.'
          - problem: 'Multiply $3$ by the quantity $4 - 10$.'
            answer: "-18"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Inside the quantity first: $4 - 10 = -6$. Then $3 \times (-6) = -18$.'
          - problem: 'Find the value of $-3(2 - 7)$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parentheses group $2 - 7 = -5$, so the value is $-3 \times (-5) = 15$.'
          - problem: 'Compute $(-8 + 2) \div (-3)$.'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Inside the parentheses first: $-8 + 2 = -6$. Then $-6 \div (-3) = 2$.'
        constraints: "one set of parentheses; values from -12 to 12 (contexts may use larger sizes)"
      - id: kp3
        name: Absolute value bars as grouping
        key_prerequisites: [integer-addition-subtraction, integer-multiplication-division]
        exemplars:
          - problem: 'Compute $3|-4| - 10$.'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bars give $|-4| = 4$ first. Then $3 \times 4 - 10 = 12 - 10 = 2$.'
          - problem: 'Compute $|2 - 9| + (-3)$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Inside the bars $2 - 9 = -7$, and $|-7| = 7$. Then $7 + (-3) = 4$.'
          - problem: 'Two bus stops lie on a straight road at $-6$ km and $9$ km from the depot. A bus makes $4$ one-way trips between the stops. How many kilometres does it travel?'
            answer: "60"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The distance between the stops is $|9 - (-6)| = 15$ km. Four trips give $4 \times 15 = 60$ km.'
          - problem: 'Compute $15 - 2|-9|$.'
            answer: "-3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bars give $|-9| = 9$ first. Then multiply before subtracting: $15 - 2 \times 9 = 15 - 18 = -3$.'
          - problem: 'A heater costs $\$2$ for every degree the temperature changes. The temperature rises from $-8$ degrees to $5$ degrees. How many dollars does the heater cost?'
            answer: "26"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The change is $|5 - (-8)| = 13$ degrees. At $2$ dollars per degree the cost is $2 \times 13 = 26$ dollars.'
          - problem: 'Compute $-2|4 - 11| + 5$.'
            answer: "-9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Work inside the bars first: $4 - 11 = -7$ and $|-7| = 7$. Then $-2 \times 7 + 5 = -14 + 5 = -9$.'
          - problem: 'Find the value of $10 - 3|-4|$.'
            answer: "-2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bars give $|-4| = 4$, and multiplication comes before subtraction: $10 - 12 = -2$.'
        constraints: "absolute value evaluated before outside operations"
    diagnostic_exemplar:
      problem: 'Compute $2|3 - 8| - 12$.'
      answer: '-2'
      solution_sketch: '$|3 - 8| = 5$; $2 \times 5 = 10$; $10 - 12 = -2$.'
    anki_seeds:
      - front: "Absolute value bars act like ___ in the order of operations."
        back: "parentheses (evaluate inside them first)"
        type: basic

  - id: ordering-rational-numbers
    name: Ordering Negative Fractions and Decimals
    core: false                # comparison destination; the number line stays core
    difficulty: 0.3
    drill: false
    answer_kind: expression
    expected_time_secs: 75
    prerequisites:
      - id: comparing-integers
        weight: 0.6
        key: true
      - id: fraction-decimal-conversion
        weight: 0.6
        key: true
      - id: number-line-integers
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Compare two negative rationals
        key_prerequisites: [comparing-integers, fraction-decimal-conversion]
        try_first:
          problem: 'Which is greater, $-0.9$ or $-0.95$?'
          answer_contract: {"kind":"exact"}
          answer: '-0.9'
          reveal: 'Both are negative, so the one closer to zero is greater. Here $-0.9$ is closer to zero than $-0.95$.'
        exemplars:
          - problem: 'Which is greater, $-0.4$ or $-0.6$?'
            answer: '-0.4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $-0.4$ is $0.4$ from zero and $-0.6$ is $0.6$ from zero. The number closer to zero is greater, so $-0.4$ is greater.'
          - problem: 'Which is greater, $-\frac12$ or $-\frac13$?'
            answer: '-1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In decimals, $-\frac12=-0.5$ and $-\frac13\approx-0.33$. The number $-\frac13$ is closer to zero, so it is greater.'
          - problem: 'On Monday the low temperature at a station was $-3.5\,^\circ\mathrm{C}$. On Tuesday it was $-3.25\,^\circ\mathrm{C}$. Which day was colder?'
            answer: 'Monday'
            answer_contract: {"kind":"label","options":[["Monday","mon","Monday was colder","colder on Monday","it was Monday"],["Tuesday","tue","Tuesday was colder","colder on Tuesday","it was Tuesday"]]}
            solution_sketch: 'The colder day has the smaller temperature. Since $-3.5<-3.25$, Monday was colder.'
          - problem: 'Between $-\frac35$ and $-\frac7{10}$, which is the greater value?'
            answer: '-3/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write both with denominator $10$: $-\frac35=-\frac6{10}$ and $-\frac7{10}$. Since $\frac6{10}<\frac7{10}$, the number $-\frac35$ is closer to zero and greater.'
          - problem: 'Diver A reads $-12.5$ m and diver B reads $-12.05$ m, both measured from the water surface. Which reading is the higher one?'
            answer: '-12.05'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The higher reading is the greater number. Since $12.05<12.5$, the value $-12.05$ is closer to zero and greater.'
          - problem: 'Which is smaller, $-\frac58$ or $-0.6$?'
            answer: '-5/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In decimals, $-\frac58=-0.625$. Since $0.625>0.6$, the number $-0.625$ is farther below zero and is the smaller one.'
          - problem: 'Ana owes $4.50$ dollars, so her balance is $-4.50$. Ben owes $4.05$ dollars, so his balance is $-4.05$. Who has the greater balance?'
            answer: 'Ben'
            answer_contract: {"kind":"label","options":[["Ana","Ana has the greater balance","Ana has more","Ana''s balance is greater"],["Ben","Ben has the greater balance","Ben has more","Ben''s balance is greater"]]}
            solution_sketch: 'Compare $-4.50$ and $-4.05$. Since $4.05<4.50$, the number $-4.05$ is closer to zero, so Ben has the greater balance.'
          - problem: 'Which is greater, $-0.75$ or $-0.5$?'
            answer: '-0.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For negative numbers the larger distance from zero means the smaller number, so $-0.5$ is greater.'
        constraints: "denominators up to 10; one or two decimal places; both values negative"
      - id: kp2
        name: Order a mixed list of rationals
        key_prerequisites: [comparing-integers, fraction-decimal-conversion]
        exemplars:
          - problem: 'Order from least to greatest: $-1.5$, $-\frac34$, $0.2$, $-2$.'
            answer: '-2, -1.5, -3/4, 0.2'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'In decimals the numbers are $-1.5$, $-0.75$, $0.2$ and $-2$. From least to greatest they are $-2<-1.5<-0.75<0.2$.'
          - problem: 'Order from least to greatest: $\frac12$, $-\frac14$, $-0.3$.'
            answer: '-0.3, -1/4, 1/2'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'In decimals the numbers are $0.5$, $-0.25$ and $-0.3$. From least to greatest they are $-0.3<-0.25<0.5$.'
          - problem: 'Order from greatest to least: $-\frac25$, $-0.35$, $-\frac12$, $-0.45$.'
            answer: '-0.35, -2/5, -0.45, -1/2'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'In decimals the numbers are $-0.4$, $-0.35$, $-0.5$ and $-0.45$. The one closest to zero is greatest, so the order is $-0.35>-0.4>-0.45>-0.5$.'
          - problem: 'Night temperatures in four towns were $-1.2$, $-\frac54$, $-\frac9{10}$ and $0.5$ degrees Celsius. List them from the coldest to the warmest.'
            answer: '-5/4, -1.2, -9/10, 0.5'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'In decimals the temperatures are $-1.2$, $-1.25$, $-0.9$ and $0.5$. The coldest is the least, so the order is $-1.25<-1.2<-0.9<0.5$.'
          - problem: 'Four accounts have the balances $-6.4$, $-\frac{13}2$, $-6.45$ and $-\frac{25}4$ dollars. List the balances from the lowest to the highest.'
            answer: '-13/2, -6.45, -6.4, -25/4'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'In decimals the balances are $-6.4$, $-6.5$, $-6.45$ and $-6.25$. From lowest to highest they are $-6.5<-6.45<-6.4<-6.25$.'
          - problem: 'Order from least to greatest: $-\frac13$, $-0.3$, $-\frac14$, $0$.'
            answer: '-1/3, -0.3, -1/4, 0'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'In decimals the numbers are about $-0.33$, $-0.3$, $-0.25$ and $0$. From least to greatest they are $-\frac13<-0.3<-\frac14<0$.'
          - problem: 'Which of the numbers $-0.6$, $-0.3$, $-0.2$ and $0.3$ lies between $-\frac12$ and $-\frac14$?'
            answer: '-0.3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In decimals the interval runs from $-0.5$ to $-0.25$. Only $-0.3$ is greater than $-0.5$ and less than $-0.25$.'
          - problem: 'Put $-0.25$, $-\frac12$, $-0.8$ in order from least to greatest.'
            answer: '-0.8, -1/2, -0.25'
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'For negative numbers the order is the reverse of the order of the distances from zero. The order is $-0.8<-0.5<-0.25$.'
        constraints: "three or four values mixing fractions and decimals; denominators up to 10"
    diagnostic_exemplar:
      problem: 'Order from least to greatest: $-0.5$, $-\frac23$, $0.25$.'
      answer: '-2/3, -0.5, 0.25'
      answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
      solution_sketch: 'In decimals $-\frac23\approx-0.67$, which is less than $-0.5$. Then $-0.5<0.25$, so the order is $-\frac23<-0.5<0.25$.'
    anki_seeds:
      - front: "To compare a negative fraction and a negative decimal, first..."
        back: "convert them to the same form (usually both to decimals), then the one farther right on the number line is greater"
        type: basic

  - id: signed-decimal-operations
    name: Operations with Signed Decimals
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 70
    prerequisites:
      - id: integer-addition-subtraction
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.5
        key: true
      - id: decimal-operations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Adding and subtracting signed decimals
        key_prerequisites: [integer-addition-subtraction, decimal-operations]
        exemplars:
          - problem: 'Compute $-6.3+2.8$.'
            answer: '-3.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The signs differ, so subtract the smaller magnitude from the larger: $6.3-2.8=3.5$. The larger magnitude is negative, so the result is $-3.5$.'
          - problem: 'Compute $-3.2-1.8$.'
            answer: '-5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $1.8$ moves further below zero, like adding the opposite. Both numbers are negative, so add the magnitudes: $3.2+1.8=5$ and the result is $-5$.'
          - problem: 'Subtract $7.5$ from $4.3$.'
            answer: '-3.2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The expression is $4.3-7.5$. The magnitude $7.5$ is larger, and it is subtracted, so the result is negative: $7.5-4.3=3.2$ gives $-3.2$.'
          - problem: 'At dawn the temperature was $-4.6\,^\circ\mathrm{C}$. By noon it had risen by $7.1$ degrees. What was the temperature at noon?'
            answer: '2.5'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'A rise is added: $-4.6+7.1$. The signs differ, and $7.1-4.6=2.5$ with the positive number larger, so the temperature was $2.5$ degrees Celsius.'
          - problem: 'Compute $-4.2+(-1.5)$.'
            answer: '-5.7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both numbers are negative, so add the magnitudes: $4.2+1.5=5.7$. Keep the negative sign, so the result is $-5.7$.'
          - problem: 'Ana has $12.40$ dollars of debt, so her balance is $-12.40$. She pays in $8.75$ dollars. What is her balance now?'
            answer: '-3.65'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Paying in adds money: $-12.40+8.75$. Subtract the magnitudes, $12.40-8.75=3.65$, and keep the sign of the larger one, so the balance is $-3.65$ dollars.'
          - problem: 'A submarine is at $-35.6$ m, measured from the sea surface. It dives a further $12.9$ m. What is its position now?'
            answer: '-48.5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Diving moves it further down, so subtract: $-35.6-12.9$. Both parts go below zero, so add the magnitudes: $35.6+12.9=48.5$ and the position is $-48.5$ m.'
          - problem: 'Compute $-0.75-(-2.5)$.'
            answer: '1.75'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting a negative number is the same as adding its opposite: $-0.75+2.5$. The signs differ and $2.5-0.75=1.75$ with the positive number larger, so the result is $1.75$.'
          - problem: 'One night the temperature fell to $-8.4\,^\circ\mathrm{C}$. The next afternoon it reached $-1.9\,^\circ\mathrm{C}$. By how many degrees did it rise?'
            answer: '6.5'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The rise is the final value minus the starting value: $-1.9-(-8.4)$. This equals $-1.9+8.4=6.5$, so the temperature rose by $6.5$ degrees.'
          - problem: 'Find the value of $-3.6-2.4$.'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both numbers are negative, so the magnitudes add: $3.6+2.4=6$, so the correct value is $-6$.'
        constraints: "1 or 2 decimal places; values from -50 to 50"
      - id: kp2
        name: Multiplying and dividing signed decimals
        key_prerequisites: [integer-multiplication-division, decimal-operations]
        exemplars:
          - problem: 'Compute $-0.5\times6$.'
            answer: '-3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One factor is negative, so the product is negative. The magnitudes give $0.5\times6=3$, so the product is $-3$.'
          - problem: 'Compute $-4.2\div(-0.7)$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The signs are the same, so the quotient is positive. Multiply both numbers by $10$ to get $42\div7=6$.'
          - problem: 'A diver sinks at a steady $0.6$ m each minute from the surface. What is her position relative to the surface after $7.5$ minutes?'
            answer: '-4.5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Her position changes by $-0.6$ m each minute for $7.5$ minutes, so multiply: $-0.6\times7.5$. The magnitudes give $0.6\times7.5=4.5$ and the sign is negative, so the position is $-4.5$ m.'
          - problem: 'The temperature fell from $2.4\,^\circ\mathrm{C}$ to $-3.6\,^\circ\mathrm{C}$ at a steady rate over $4$ hours. By how many degrees did it change each hour?'
            answer: '-1.5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total change is $-3.6-2.4=-6$ degrees. Dividing the change by the $4$ hours gives $-6\div4=-1.5$ degrees each hour.'
          - problem: 'Compute $-2.5\times(-0.4)$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The signs are the same, so the product is positive. The magnitudes give $2.5\times0.4=1$.'
          - problem: 'A shop''s balance changed by $-45.50$ dollars over $7$ days, with the same change every day. What was the change per day?'
            answer: '-6.5'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The total change is shared equally over $7$ days, so divide: $-45.50\div7$. The magnitudes give $45.5\div7=6.5$ and the sign is negative, so the change is $-6.5$ dollars per day.'
          - problem: 'A diver goes down in steps of $0.4$ m. How many steps does she need to reach $-3.6$ m?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each step changes the position by $-0.4$ m. The number of steps is $-3.6\div(-0.4)$, and the signs match, so it is positive: $36\div4=9$.'
          - problem: 'Divide $-7.2$ by $-0.8$.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The signs are the same, so the quotient is positive. Multiply both numbers by $10$ to get $72\div8=9$.'
          - problem: 'Compute $0.6\times(-1.5)$.'
            answer: '-0.9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The factors have different signs, so the product is negative. The magnitudes give $0.6\times1.5=0.9$, so the product is $-0.9$.'
          - problem: 'Find the value of $-1.2\times(-0.3)$.'
            answer: '0.36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The two factors are both negative, so the product is positive. The magnitudes give $1.2\times0.3=0.36$, so the value is $0.36$.'
          - problem: 'Compute $-3.6\div0.9$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The signs differ, so the quotient is negative. Multiply both numbers by $10$ to get $36\div9=4$, so the result is $-4$.'
        constraints: "1 decimal place; exact quotients; values from -50 to 50"
    diagnostic_exemplar:
      problem: 'Compute $-3.6\div(-0.9)$.'
      answer: '4'
      answer_contract: {"kind":"exact"}
      solution_sketch: 'The signs are the same, so the quotient is positive. Multiply both numbers by $10$ to get $36\div9=4$.'
    anki_seeds:
      - front: "Integer sign rules apply to decimal arithmetic..."
        back: "unchanged; only the place-value bookkeeping differs"
        type: basic

  - id: adding-subtracting-negative-fractions
    name: Adding and Subtracting Negative Fractions
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: adding-subtracting-fractions
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Signed fractions where one denominator divides the other
        key_prerequisites: [adding-subtracting-fractions, integer-addition-subtraction]
        exemplars:
          - problem: 'Compute $-\frac12+\frac14$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The common denominator is $4$, so $-\frac12=-\frac24$. Then $-\frac24+\frac14=-\frac14$.'
          - problem: 'Compute $-\frac23-\frac16$.'
            answer: '-5/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The common denominator is $6$, so $-\frac23=-\frac46$. Then $-\frac46-\frac16=-\frac56$.'
          - problem: 'Subtract $\frac14$ from $-\frac38$.'
            answer: '-5/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The expression is $-\frac38-\frac14$. With denominator $8$ it is $-\frac38-\frac28=-\frac58$.'
          - problem: 'A hiker starts $\frac56$ km below base camp, so her position is $-\frac56$ km. She climbs $\frac13$ km. What is her position now?'
            answer: '-1/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Climbing adds to the position: $-\frac56+\frac13$. With denominator $6$ this is $-\frac56+\frac26=-\frac36$. The position is $-\frac12$ km.'
          - problem: 'Compute $-\frac5{12}+\left(-\frac14\right)$.'
            answer: '-2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The common denominator is $12$, so $-\frac14=-\frac3{12}$. Then $-\frac5{12}-\frac3{12}=-\frac8{12}$, which reduces to $-\frac23$.'
          - problem: 'A diver is at $-\frac34$ m. She sinks another $\frac12$ m. What is her position now?'
            answer: '-5/4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Sinking moves her down, so subtract: $-\frac34-\frac12$. With denominator $4$ this is $-\frac34-\frac24=-\frac54$ m.'
          - problem: 'A reservoir level was $-\frac58$ m compared with its usual level. After rain it rose by $\frac14$ m. What is the level now?'
            answer: '-3/8'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'A rise is added: $-\frac58+\frac14$. With denominator $8$ this is $-\frac58+\frac28=-\frac38$ m.'
          - problem: 'A bird is $\frac14$ m above the water. A fish is at $-\frac58$ m. How many metres higher than the fish is the bird?'
            answer: '7/8'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The distance is the higher position minus the lower one: $\frac14-\left(-\frac58\right)$. This is $\frac28+\frac58=\frac78$ m.'
          - problem: 'Find the value of $-\frac13-\frac16$.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Fractions need a common denominator. With denominator $6$ the sum is $-\frac26-\frac16=-\frac36=-\frac12$.'
          - problem: 'Compute $\frac38-\frac12$.'
            answer: '-1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With denominator $8$, $\frac12=\frac48$. Then $\frac38-\frac48=-\frac18$.'
        constraints: "one denominator divides the other; denominators up to 12"
      - id: kp2
        name: Signed fractions needing an LCD
        key_prerequisites: [adding-subtracting-fractions, integer-addition-subtraction]
        exemplars:
          - problem: 'Compute $-\frac13+\frac15$.'
            answer: '-2/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Neither denominator divides the other, so use $15$. Then $-\frac5{15}+\frac3{15}=-\frac2{15}$.'
          - problem: 'Compute $-\frac34+\frac16$.'
            answer: '-7/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The common denominator is $12$. Then $-\frac9{12}+\frac2{12}=-\frac7{12}$.'
          - problem: 'A reservoir level is $-\frac35$ m compared with its usual level. Rain raises it by $\frac34$ m. What is the level now?'
            answer: '3/20'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The common denominator is $20$. Then $-\frac35+\frac34=-\frac{12}{20}+\frac{15}{20}=\frac3{20}$ m.'
          - problem: 'Compute $-\frac58-\left(-\frac16\right)$.'
            answer: '-11/24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting a negative number is adding its opposite: $-\frac58+\frac16$. With denominator $24$ this is $-\frac{15}{24}+\frac4{24}=-\frac{11}{24}$.'
          - problem: 'Find $\frac13$ minus $\frac34$.'
            answer: '-5/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The common denominator is $12$. Then $\frac4{12}-\frac9{12}=-\frac5{12}$.'
          - problem: 'A share price fell by $\frac34$ dollar on Monday and by $\frac16$ dollar on Tuesday. What was the total change in the price?'
            answer: '-11/12'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Both days are falls, so the changes are $-\frac34$ and $-\frac16$. With denominator $12$ the total is $-\frac9{12}-\frac2{12}=-\frac{11}{12}$ dollar.'
          - problem: 'A seabird is $\frac23$ m above the water and a fish is at $-\frac35$ m. How many metres higher than the fish is the bird?'
            answer: '19/15'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The distance is the higher position minus the lower one: $\frac23-\left(-\frac35\right)$. With denominator $15$ this is $\frac{10}{15}+\frac9{15}=\frac{19}{15}$ m.'
          - problem: 'Find the value of $-\frac12+\frac13$.'
            answer: '-1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Fractions need a common denominator before they are added. With denominator $6$ this is $-\frac36+\frac26=-\frac16$.'
          - problem: 'Compute $-\frac7{10}+\frac2{15}$.'
            answer: '-17/30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The common denominator is $30$. Then $-\frac{21}{30}+\frac4{30}=-\frac{17}{30}$.'
          - problem: 'Compute $-\frac34-\frac15$.'
            answer: '-19/20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The common denominator is $20$. Then $-\frac{15}{20}-\frac4{20}=-\frac{19}{20}$.'
        constraints: "denominators up to 15; answers in lowest terms"
    diagnostic_exemplar:
      problem: 'Compute $-\frac23+\frac14$.'
      answer: '-5/12'
      answer_contract: {"kind":"exact"}
      solution_sketch: 'The common denominator is $12$. Then $-\frac8{12}+\frac3{12}=-\frac5{12}$.'
    anki_seeds:
      - front: "The sign rules for adding fractions are..."
        back: "the same as for integers; the fraction work only changes how you find the absolute values"
        type: basic

  - id: negative-fractions-decimals
    name: Negative Fractions and Decimals
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 85
    prerequisites:
      - id: adding-subtracting-negative-fractions
        weight: 0.7
        key: true
      - id: signed-decimal-operations
        weight: 0.6
        key: true
      - id: multiplying-fractions
        weight: 0.4
      - id: dividing-fractions
        weight: 0.3
      - id: mixed-numbers
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Multiplying and dividing negative fractions
        key_prerequisites: [multiplying-fractions, dividing-fractions]
        exemplars:
          - problem: 'Compute $-\frac23\times\frac34$.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One factor is negative, so the product is negative. The magnitudes give $\frac{2\times3}{3\times4}=\frac6{12}=\frac12$.'
          - problem: 'Compute $-\frac12\div\frac14$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One factor is negative, so the quotient is negative. Dividing by $\frac14$ means multiplying by $4$, so $\frac12\times4=2$.'
          - problem: 'Compute $-\frac56\times\left(-\frac3{10}\right)$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both factors are negative, so the product is positive. The magnitudes give $\frac{15}{60}=\frac14$.'
          - problem: 'The water level of a pond changes by $-\frac38$ cm each day. What is the total change in the level after $4$ days?'
            answer: '-3/2'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The total change is the change per day times the number of days: $-\frac38\times4$. This is $-\frac{12}8=-\frac32$ cm.'
          - problem: 'Compute $-\frac34\div\left(-\frac98\right)$.'
            answer: '2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both numbers are negative, so the quotient is positive. Multiply by the reciprocal: $\frac34\times\frac89=\frac{24}{36}=\frac23$.'
          - problem: 'A diver goes down $\frac38$ m with each step. How many steps does she need to reach $-\frac94$ m?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of steps is the total depth divided by the depth of one step: $\frac94\div\frac38$. This is $\frac94\times\frac83=\frac{72}{12}=6$.'
          - problem: 'A snow pile melts at a steady rate. Its height changes by $-\frac{15}4$ cm over $5$ hours. What is the change in height each hour?'
            answer: '-3/4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The total change is shared equally over $5$ hours, so divide: $-\frac{15}4\div5$. This is $-\frac{15}{20}=-\frac34$ cm.'
          - problem: 'Find the value of $-\frac23\times\left(-\frac34\right)$.'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both factors are negative, so the product is positive. The magnitudes give $\frac{6}{12}=\frac12$, so the value is $\frac12$.'
          - problem: 'Compute $\frac49\div\left(-\frac23\right)$.'
            answer: '-2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The signs differ, so the quotient is negative. Multiply by the reciprocal: $\frac49\times\frac32=\frac{12}{18}=\frac23$, so the result is $-\frac23$.'
        constraints: "denominators up to 12; answers in lowest terms"
      - id: kp2
        name: Mixed fraction-decimal expressions
        key_prerequisites: [adding-subtracting-negative-fractions, signed-decimal-operations]
        exemplars:
          - problem: 'Compute $-0.5+\left(-\frac14\right)$.'
            answer: '-3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-0.5$ as $-\frac12$, which is $-\frac24$. Then $-\frac24-\frac14=-\frac34$.'
          - problem: 'Compute $-\frac35\times0.5$.'
            answer: '-3/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $0.5$ as $\frac12$. One factor is negative, so $-\frac35\times\frac12=-\frac3{10}$.'
          - problem: 'Compute $-0.4\times\left(-\frac58\right)$.'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $-0.4$ as $-\frac4{10}$. Both factors are negative, so the product is positive: $\frac4{10}\times\frac58=\frac{20}{80}=\frac14$.'
          - problem: 'The water level in a pool was $-0.4$ m compared with the usual level. Then it fell by a further $\frac38$ m. What is the level now?'
            answer: '-31/40'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Write $-0.4$ as $-\frac25$. The level is $-\frac25-\frac38$, and with denominator $40$ this is $-\frac{16}{40}-\frac{15}{40}=-\frac{31}{40}$ m.'
          - problem: 'Compute $\frac34-1.25$.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $1.25$ as $\frac54$. Then $\frac34-\frac54=-\frac24=-\frac12$.'
          - problem: 'A diver''s depth changes by $-\frac34$ m every minute. After how many minutes does she reach $-4.5$ m?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of minutes is the total depth divided by the change per minute: $-4.5\div\left(-\frac34\right)$. This is $\frac92\times\frac43=6$.'
          - problem: 'A drone''s height changes by $-0.8$ m each second. What is the total change in height after $\frac54$ seconds?'
            answer: '-1'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The total change is the change per second times the time: $-0.8\times\frac54$. Since $0.8\times1.25=1$, the total change is $-1$ m.'
          - problem: 'Find the value of $-0.5+\frac14$.'
            answer: '-1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The signs differ here, so the magnitudes are subtracted. Write $-0.5$ as $-\frac24$. Then $-\frac24+\frac14=-\frac14$.'
          - problem: 'Compute $-1.5\div\frac34$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $1.5$ as $\frac32$. The signs differ, so the quotient is negative: $\frac32\times\frac43=2$, and the result is $-2$.'
          - problem: 'Compute $-\frac7{10}+0.2$.'
            answer: '-1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $0.2$ as $\frac2{10}$. Then $-\frac7{10}+\frac2{10}=-\frac5{10}=-\frac12$.'
        constraints: "convert to one form first; denominators up to 10"
      - id: kp3
        name: Signed mixed numbers
        key_prerequisites: [mixed-numbers, adding-subtracting-negative-fractions]
        exemplars:
          - problem: 'Compute $-1\frac12+2\frac14$.'
            answer: '3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write both as improper fractions: $-\frac32$ and $\frac94$. With denominator $4$ the sum is $-\frac64+\frac94=\frac34$.'
          - problem: 'Compute $-2\frac13-1\frac16$.'
            answer: '-7/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write both as improper fractions: $-\frac73$ and $\frac76$. With denominator $6$ the result is $-\frac{14}6-\frac76=-\frac{21}6=-\frac72$.'
          - problem: 'Subtract $1\frac12$ from $-1\frac14$.'
            answer: '-11/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The expression is $-\frac54-\frac32$. With denominator $4$ it is $-\frac54-\frac64=-\frac{11}4$.'
          - problem: 'Compute $-2\frac12+\left(-1\frac14\right)$.'
            answer: '-15/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write both as improper fractions: $-\frac52$ and $-\frac54$. With denominator $4$ the sum is $-\frac{10}4-\frac54=-\frac{15}4$.'
          - problem: 'A hiker is $1\frac12$ km below base camp, at position $-1\frac12$ km. She climbs $2\frac34$ km. What is her position now?'
            answer: '5/4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Climbing adds: $-\frac32+\frac{11}4$. With denominator $4$ this is $-\frac64+\frac{11}4=\frac54$ km.'
          - problem: 'A diver goes down in steps of $1\frac34$ m. How many steps does she need to reach $-3\frac12$ m?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of steps is the total depth divided by one step: $-\frac72\div\left(-\frac74\right)$. This is $\frac72\times\frac47=2$.'
          - problem: 'The temperature was $-3\frac12\,^\circ\mathrm{C}$ and then fell by $2\frac14$ degrees. What is the temperature now?'
            answer: '-5.75'
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'A fall is subtracted: $-\frac72-\frac94$. With denominator $4$ this is $-\frac{14}4-\frac94=-\frac{23}4$, which is $-5.75$ degrees.'
          - problem: 'A mountain peak is $2\frac13$ km above sea level and a trench floor is $1\frac12$ km below sea level, at $-1\frac12$ km. How many kilometres higher than the trench is the peak?'
            answer: '23/6'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The distance is the higher position minus the lower one: $\frac73-\left(-\frac32\right)$. With denominator $6$ this is $\frac{14}6+\frac96=\frac{23}6$ km.'
          - problem: 'Find the value of $-1\frac12+\frac34$.'
            answer: '-3/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the mixed number as an improper fraction: $-1\frac12=-\frac32=-\frac64$. Then $-\frac64+\frac34=-\frac34$.'
        constraints: "convert to improper fractions first; denominators up to 12"
    diagnostic_exemplar:
      problem: 'Compute $-1\frac12\times0.4$.'
      answer: '-3/5'
      answer_contract: {"kind":"exact"}
      solution_sketch: 'Write $-1\frac12$ as $-\frac32$ and $0.4$ as $\frac25$. Then $-\frac32\times\frac25=-\frac6{10}=-\frac35$.'
    anki_seeds:
      - front: "The sign rules for multiplication and division apply to fractions and decimals..."
        back: "exactly as they do to integers"
        type: basic

  - id: exponent-notation
    name: Exponent Notation
    core: true
    difficulty: 0.22
    drill: false
    answer_kind: numeric
    expected_time_secs: 50
    prerequisites:
      - id: multiplication-tables
        weight: 0.7
        key: true
      - id: multi-digit-multiplication
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Read and write powers
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Write $4 \times 4 \times 4$ in exponent form.'
            answer: "4^3"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The factor $4$ is used three times, so the base is $4$ and the exponent is $3$. The product is written $4^3$.'
          - problem: 'How many times does $7$ appear as a factor in $7^5$?'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In a power, the exponent tells how many equal factors are multiplied. Here the exponent is $5$, so $7$ appears $5$ times.'
          - problem: 'A floor is tiled with $6$ rows of $6$ square tiles. Write the number of tiles as a power of $6$.'
            answer: "6^2"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The number of tiles is $6 \times 6$, two equal factors of $6$. So it is written $6^2$, which is $36$ tiles.'
          - problem: 'Write $6 \times 6 \times 6 \times 6$ in exponent form.'
            answer: "6^4"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'There are four equal factors of $6$. So the base is $6$ and the exponent is $4$, giving $6^4$.'
          - problem: 'How should $2 \times 2 \times 2 \times 2 \times 2$ be written in exponent form?'
            answer: "2^5"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The count of factors is the exponent. There are five factors of $2$, so the product is $2^5$.'
          - problem: 'A cube-shaped box is packed with small cubes: $3$ layers, each with $3$ rows of $3$ cubes. Write the number of cubes as a power of $3$.'
            answer: "3^3"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The number of cubes is $3 \times 3 \times 3$, three equal factors of $3$. So it is written $3^3$, which is $27$ cubes.'
          - problem: 'Write $10 \times 10 \times 10 \times 10 \times 10$ in exponent form.'
            answer: "10^5"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'There are five equal factors of $10$. So the base is $10$ and the exponent is $5$, giving $10^5$.'
        constraints: "base 2-10, exponent 2-5; a product of equal factors, a count of factors, or a count that is a power (rows, layers); pure notation with two honest contexts"
      - id: kp2
        name: Evaluate small powers
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'What is the value of $3^4$?'
            answer: "81"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power $3^4$ is four factors of $3$. Multiply step by step: $3 \times 3 = 9$, $9 \times 3 = 27$, $27 \times 3 = 81$.'
          - problem: 'By how much does $2^5$ exceed $5^2$?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $2^5 = 32$ and $5^2 = 25$. The difference is $32 - 25 = 7$.'
          - problem: 'A square garden measures $8$ m on each side. What is its area?'
            answer: "64"
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Area is side times side, so $8 \times 8 = 8^2 = 64$. The area is $64$ square meters.'
          - problem: 'A cube-shaped crate has edges of $5$ cm. What is its volume?'
            answer: "125"
            answer_contract: {"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}
            solution_sketch: 'Volume is edge times edge times edge, so $5 \times 5 \times 5 = 5^3 = 125$. The volume is $125$ cubic centimeters.'
          - problem: 'A warehouse holds $2^6$ boxes, and each truck carries $2^3$ boxes. How many truck loads empty the warehouse?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Evaluate the powers: $2^6 = 64$ and $2^3 = 8$. The number of loads is the total divided by one load, $64 \div 8 = 8$.'
          - problem: 'What is the value of $2^4$?'
            answer: "16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The power $2^4$ is four factors of $2$. So $2 \times 2 \times 2 \times 2 = 16$.'
          - problem: 'What is $10^4$?'
            answer: "10000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each factor of $10$ adds one zero. Four factors give $10\,000$, so the value is $10000$.'
        constraints: "base 2-10, exponent 2-6; values at most 10000; includes area, volume and a division of two powers"
    diagnostic_exemplar:
      problem: 'Compute $6^2$.'
      answer: "36"
      solution_sketch: '$6^2$ means $6 \times 6 = 36$ — not $6 \times 2$.'
    anki_seeds:
      - front: "The expression a^n means..."
        back: "the product of n factors of a"
        type: basic

  - id: integer-exponents-intro
    name: Introduction to Integer Exponents
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 55
    prerequisites:
      - id: exponent-notation
        weight: 0.7
        key: true
      - id: integer-multiplication-division
        weight: 0.7
        key: true
      - id: order-of-operations
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Negative bases
        key_prerequisites: [integer-multiplication-division, exponent-notation]
        try_first:
          problem: 'Multiply $(-1) \times (-1) \times (-1) \times (-1) \times (-1)$.'
          answer_contract: {"kind":"exact"}
          answer: '-1'
          reveal: 'The factors pair up into products of $+1$, and one $-1$ is left over, so the product is $-1$. An odd number of negative factors gives a negative result.'
        exemplars:
          - problem: 'Compute $(-2)^3$.'
            answer: "-8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are three factors of $-2$. The first two give $+4$, and then $4 \times (-2) = -8$.'
          - problem: 'Evaluate $(-4)^2$.'
            answer: "16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two negative factors give a positive product. So $(-4) \times (-4) = 16$.'
          - problem: 'A game starts your score at $1$. Every round multiplies your score by $-2$. A score can go below zero. What is your score after $5$ rounds?'
            answer: "-32"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $5$ rounds the score is $(-2)^5$. Five negative factors give a negative result, and $2^5 = 32$, so the score is $-32$.'
          - problem: 'Evaluate $(-5)^4$.'
            answer: "625"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four negative factors give a positive result. So $(-5)^4 = 5^4 = 625$.'
          - problem: 'Find the value of $(-3)^4$.'
            answer: "81"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four negative factors pair up into positives. So $(-3)^4 = 81$.'
          - problem: 'A number machine multiplies its input by $-3$ each time it runs. Starting from $1$, what number comes out after $3$ runs?'
            answer: "-27"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $3$ runs the result is $(-3)^3$. Three negative factors give a negative result, and $3^3 = 27$, so the output is $-27$.'
          - problem: 'What is $\dfrac{(-2)^6}{(-2)^3}$?'
            answer: "-8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Evaluate each power: $(-2)^6 = 64$ and $(-2)^3 = -8$. Then $64 \div (-8) = -8$.'
          - problem: 'Evaluate $(-1)^{15}$.'
            answer: "-1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Pairs of $-1$ multiply to $+1$, and $15$ is odd, so one $-1$ is left over. The product is $-1$.'
        constraints: "base -5 to -1, exponent 2-6 or an odd or even power of -1; base in parentheses; includes repeated multiplication by a negative number"
      - id: kp2
        name: Distinguish -a^n from (-a)^n
        key_prerequisites: [order-of-operations, integer-multiplication-division]
        exemplars:
          - problem: 'Compute $-2^4$.'
            answer: "-16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Without parentheses the exponent applies to the $2$ only. So $2^4 = 16$, and the minus sign gives $-16$.'
          - problem: 'Compute $(-2)^4$.'
            answer: "16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parentheses put the minus sign inside the base. Four negative factors give a positive product, $16$.'
          - problem: 'Evaluate $-3^3$.'
            answer: "-27"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent applies to the $3$ first, so $3^3 = 27$. Then the minus sign gives $-27$.'
          - problem: 'Compute $(-3)^2 - (-3^2)$.'
            answer: "18"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(-3)^2 = 9$ and $-3^2 = -9$. Then $9 - (-9) = 18$.'
          - problem: 'In a game, a player loses $x^2$ points when the dice show $x$. If the dice show $6$, what is the change in the player''s score?'
            answer: "-36"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The player loses $6^2 = 36$ points. A loss is a negative change, so the change in score is $-36$.'
          - problem: 'What is the square of $-6$?'
            answer: "36"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The minus sign is part of the number that is squared. The square of $-6$ is $(-6)^2 = (-6) \times (-6) = 36$.'
          - problem: 'A cave explorer''s elevation in meters is modeled by $-n^3$ after $n$ hours. What is her elevation after $4$ hours?'
            answer: "-64"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The exponent applies to $n = 4$ first, so $4^3 = 64$. The minus sign then gives an elevation of $-64$ meters.'
          - problem: 'Compute $(-3)^2 - 3^2$.'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(-3)^2 = 9$ and $3^2 = 9$. Then $9 - 9 = 0$.'
        constraints: "pair -a^n with (-a)^n; base 2-6, exponent 2-4; includes a loss modeled by x squared and an elevation modeled by minus n cubed"
      - id: kp3
        name: Exponents in the order of operations
        key_prerequisites: [order-of-operations, exponent-notation]
        exemplars:
          - problem: 'Compute $2^3 + 3^2$.'
            answer: "17"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Powers come before addition. So $2^3 = 8$, $3^2 = 9$, and $8 + 9 = 17$.'
          - problem: 'Compute $(5 - 8)^2$.'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Work inside the parentheses first: $5 - 8 = -3$. Then $(-3)^2 = 9$.'
          - problem: 'Compute $2 \times (-3)^2$.'
            answer: "18"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent comes before multiplication. So $(-3)^2 = 9$, and $2 \times 9 = 18$.'
          - problem: 'A cube-shaped tank has edges of $4$ m, and a small cube-shaped box has edges of $2$ m. How many boxes fit in the tank?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tank volume is $4^3 = 64$ cubic meters and a box is $2^3 = 8$ cubic meters. The number of boxes is $64 \div 8 = 8$.'
          - problem: 'Compute $(-3)^3 + 5^2$.'
            answer: "-2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(-3)^3 = -27$ and $5^2 = 25$. Then $-27 + 25 = -2$.'
          - problem: 'Find the value of $3 \times 2^3$.'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent comes before multiplication. So $2^3 = 8$, and $3 \times 8 = 24$.'
          - problem: 'A square room is $5$ m by $5$ m. A hallway next to it is $2$ m by $3$ m. What is the total floor area?'
            answer: "31"
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The room has area $5^2 = 25$ and the hallway has area $2 \times 3 = 6$. The total is $25 + 6 = 31$ square meters.'
          - problem: 'Compute $10 - 2 \times 3^2$.'
            answer: "-8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent comes first: $3^2 = 9$. Then multiply, $2 \times 9 = 18$, and subtract, $10 - 18 = -8$.'
        constraints: "exponents mixed with one or two other operations; includes areas and a volume ratio"
    diagnostic_exemplar:
      problem: 'Compute $(-2)^4 + (-2^3)$.'
      answer: '8'
      answer_contract: {"kind":"exact"}
      solution_sketch: '$(-2)^4 = 16$ and $-2^3 = -8$, so $16 - 8 = 8$.'
    anki_seeds:
      - front: "Difference between (-a)^2 and -a^2:"
        back: "(-a)^2 is positive (the minus is inside); -a^2 is negative (the exponent applies before the minus sign)"
        type: basic

  - id: temperature-elevation-problems
    name: Temperature and Elevation Problems
    # over-coverage: thermometer/elevation dressing on adding-integers +
    # subtracting-integers; its only dependent is already supplemental
    core: false
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: adding-integers
        weight: 0.6
        key: true
      - id: subtracting-integers
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Apply a single signed change
        key_prerequisites: [adding-integers]
        exemplars:
          - problem: 'At dawn the temperature was $-4^\circ\text{C}$. By noon it had risen $9^\circ\text{C}$. What was the temperature at noon?'
            answer: "5"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'A rise is a positive change, so add: $-4 + 9 = 5$. The temperature at noon was $5^\circ\text{C}$.'
          - problem: 'A diver is at an elevation of $-30$ m relative to sea level and descends another $15$ m. What is her new elevation?'
            answer: "-45"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'A descent is a negative change, so add $-15$ to the starting elevation. Then $-30 + (-15) = -45$ meters.'
          - problem: 'Overnight the temperature was $-12^\circ\text{C}$. By morning it had dropped $7^\circ\text{C}$. What was the temperature in the morning?'
            answer: "-19"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'A drop is a negative change, so add $-7$. Then $-12 + (-7) = -19$ degrees Celsius.'
          - problem: 'A hiker at an elevation of $40$ m climbs another $25$ m. What is her new elevation?'
            answer: "65"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'A climb is a positive change, so add: $40 + 25 = 65$. Her new elevation is $65$ meters.'
          - problem: 'A freezer at $-18^\circ\text{C}$ warms by $11^\circ\text{C}$ during a power cut. What is its temperature then?'
            answer: "-7"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'Warming is a positive change, so add: $-18 + 11 = -7$. The freezer is then at $-7^\circ\text{C}$, still below zero.'
          - problem: 'A temperature of $-8^\circ\text{C}$ falls by $5^\circ\text{C}$. What is the new temperature?'
            answer: "-13"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'A fall is a negative change, so subtract $5$. The temperature is $-8 - 5 = -13$ degrees Celsius.'
          - problem: 'After falling $8^\circ\text{C}$, the temperature is $-3^\circ\text{C}$. What was the temperature before the fall?'
            answer: "5"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The fall took $8$ degrees away, so undo it by adding $8$. Then $-3 + 8 = 5$ degrees Celsius.'
          - problem: 'A drone at an elevation of $12$ m drops $20$ m. What is its new elevation?'
            answer: "-8"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'A drop is a negative change, so $12 - 20 = -8$. The drone ends $8$ meters below the reference level.'
        constraints: "single-step signed addition/subtraction, or undoing one change; values from -60 to 60"
      - id: kp2
        name: Find the change or gap between two levels
        key_prerequisites: [subtracting-integers]
        exemplars:
          - problem: 'The temperature rose from $-8^\circ\text{C}$ to $6^\circ\text{C}$. By how many degrees did it rise?'
            answer: "14"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The change is the end minus the start: $6 - (-8) = 14$. So the temperature rose $14$ degrees.'
          - problem: 'A plane flies at an elevation of $2400$ m while a submarine sits at $-60$ m. What is the vertical distance between them?'
            answer: "2460"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The distance is the higher level minus the lower level: $2400 - (-60) = 2460$. The vertical distance is $2460$ meters.'
          - problem: 'A weather balloon rose from $-15$ m to $60$ m. By how many meters did it rise?'
            answer: "75"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The rise is the end minus the start: $60 - (-15) = 75$. The balloon rose $75$ meters.'
          - problem: 'The temperature fell from $-3^\circ\text{C}$ to $-18^\circ\text{C}$. By how many degrees did it fall?'
            answer: "15"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The change is $-18 - (-3) = -15$, so the temperature fell by $15$ degrees. The size of the fall is $15$.'
          - problem: 'The temperature changed from $27^\circ\text{C}$ to $-35^\circ\text{C}$. What was the change in temperature?'
            answer: "-62"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The change is the end minus the start: $-35 - 27 = -62$. The negative sign shows a fall of $62$ degrees.'
          - problem: 'The highest point of a region is $1200$ m above sea level and its lowest point is $30$ m below sea level. What is the difference in elevation between them?'
            answer: "1230"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The elevations are $1200$ and $-30$. The difference is $1200 - (-30) = 1230$ meters.'
          - problem: 'Over $4$ hours the temperature fell steadily from $3^\circ\text{C}$ to $-9^\circ\text{C}$. By how many degrees did it fall each hour?'
            answer: "3"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The total fall is $3 - (-9) = 12$ degrees. The fall is the same each hour, so divide by $4$ hours: $12 \div 4 = 3$ degrees per hour.'
          - problem: 'What is the gap between a hill at $120$ m and a valley at $-35$ m?'
            answer: "155"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The valley level is negative. The gap is $120 - (-35) = 155$ meters.'
        constraints: "difference of two signed levels; subtract end minus start; includes a steady rate found by dividing the total change by a count"
    diagnostic_exemplar:
      problem: 'A hiker stands at $350$ m while a cave explorer is at $-40$ m. What is the vertical distance between them?'
      answer: '390'
      answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
      solution_sketch: '$350 - (-40) = 390$.'
    anki_seeds:
      - front: "To find how much a quantity changed, compute..."
        back: "final value minus initial value (works even when either is negative)"
        type: basic

  - id: integer-word-problems
    name: Integer Word Problems
    core: false                # enrichment / applications leaf topic
    difficulty: 0.35
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: temperature-elevation-problems
        weight: 0.6
        key: true
      - id: integer-addition-subtraction
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.5
      - id: absolute-value
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Net change over multiple steps
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'A bank account holds €50. A bill of €80 is paid from it. The account may be overdrawn. What is the balance?'
            answer: "-30"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Paying a bill is a negative change, so $50 - 80 = -30$. The balance is $-30$ euros, which means the account is overdrawn.'
          - problem: 'A football team gains $7$ m, loses $12$ m, then gains $5$ m. What is the net change in its position?'
            answer: "0"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Write the steps as $+7$, $-12$ and $+5$. Then $7 - 12 + 5 = 0$, so the team ends where it started.'
          - problem: 'A hot air balloon at $120$ m descends $45$ m, then descends another $30$ m. What is its height?'
            answer: "45"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Both moves are descents, so subtract both: $120 - 45 - 30 = 45$. The balloon is at $45$ meters.'
          - problem: 'A submarine at $-40$ m rises $25$ m, then descends $60$ m. What is its elevation?'
            answer: "-75"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'A rise is positive and a descent is negative, so $-40 + 25 - 60 = -75$. The submarine is at $-75$ meters.'
          - problem: 'A shop makes a profit of €120 on Monday, a loss of €45 on Tuesday and a loss of €90 on Wednesday. What is the total result for the three days?'
            answer: "-15"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'A profit is positive and a loss is negative. So $120 - 45 - 90 = -15$, which is a total loss of $15$ euros.'
          - problem: 'A player has $15$ points. She loses $20$ points, wins $8$ points and then loses $6$ points. The score can go below zero. What is her score?'
            answer: "-3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the signed changes to the start: $15 - 20 + 8 - 6 = -3$. Her score is $-3$.'
          - problem: 'A diver at $-12$ m descends $8$ m and then rises $3$ m. What is the elevation of the diver?'
            answer: "-17"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'A rise adds to the elevation. The sum is $-12 - 8 + 3 = -17$ meters.'
          - problem: 'After losing €35 and then gaining €20, Ana''s balance is -€10. What was her balance at the start?'
            answer: "5"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The net change is $-35 + 20 = -15$. So the start plus $-15$ is $-10$, and the start was $-10 + 15 = 5$ euros.'
        constraints: "two or three signed steps, or finding the start from the end; no unnatural phrasing"
      - id: kp2
        name: Repeated signed changes
        key_prerequisites: [integer-multiplication-division, integer-addition-subtraction]
        exemplars:
          - problem: 'A player starts with $10$ points and loses $4$ points on each of $3$ turns. The score can go below zero. What is the final score?'
            answer: "-2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total change is $3 \times (-4) = -12$. Add it to the start: $10 - 12 = -2$.'
          - problem: 'Starting at $4^\circ\text{C}$, the temperature drops $3^\circ\text{C}$ every hour for $5$ hours. What is the final temperature?'
            answer: "-11"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The total change is $5 \times (-3) = -15$. Add it to the start: $4 - 15 = -11$ degrees Celsius.'
          - problem: 'A stock starts at $\$80$ and loses $\$15$ on each of the next $3$ trading days. What is its value then?'
            answer: "35"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The total change is $3 \times (-15) = -45$. Add it to the start: $80 - 45 = 35$ dollars.'
          - problem: 'A hiker starts at an elevation of $-20$ m and climbs $8$ m every $10$ minutes for $50$ minutes. What is her elevation after $50$ minutes?'
            answer: "20"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'In $50$ minutes there are $5$ periods of $10$ minutes, so the climb is $5 \times 8 = 40$ m. Then $-20 + 40 = 20$ meters.'
          - problem: 'A diver at $0$ m descends at a steady $3$ m each minute. After how many minutes is she at $-42$ m?'
            answer: "14"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total change is $-42$ m and each minute changes the depth by $-3$ m. So the number of minutes is $-42 \div (-3) = 14$.'
          - problem: 'A temperature of $6^\circ\text{C}$ falls by $4^\circ\text{C}$ every hour. After how many hours does it reach $-10^\circ\text{C}$?'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total change is $-10 - 6 = -16$ degrees. Each hour changes it by $-4$, so the number of hours is $-16 \div (-4) = 4$.'
          - problem: 'Ana''s account balance is -€40. She pays in €15 each week for $6$ weeks. What is her balance then?'
            answer: "50"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The deposits total $6 \times 15 = 90$. Add them to the balance: $-40 + 90 = 50$ euros.'
          - problem: 'A submarine goes from $0$ m to $-84$ m in $7$ equal descents. How many meters does it descend each time?'
            answer: "12"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The total descent is $84$ m in $7$ equal steps. So each descent is $84 \div 7 = 12$ meters.'
          - problem: 'A temperature of $2^\circ\text{C}$ drops $5^\circ\text{C}$ each hour for $4$ hours. What is the final temperature?'
            answer: "-18"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'The drop of $5$ happens $4$ times. The total change is $4 \times (-5) = -20$, so $2 - 20 = -18$ degrees Celsius.'
        constraints: "one multiplication of a signed rate by a count plus a start value, or one division of a total change by a rate or a count"
    diagnostic_exemplar:
      problem: 'Starting at $6^\circ\text{C}$, the temperature drops $4^\circ\text{C}$ every hour for $3$ hours. What is the final temperature?'
      answer: '-6'
      answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
      solution_sketch: '$6 + 3 \times (-4) = 6 - 12 = -6$.'
    anki_seeds:
      - front: "Setup for a start value with n repeated signed changes of size r:"
        back: "final = start + n × r (r is negative for losses or drops)"
        type: basic
      - front: "In a signed word problem, gains/deposits/rises translate to ___ and losses/withdrawals/drops to ___"
        back: "adding a positive number; adding a negative number (subtracting)"
        type: basic
