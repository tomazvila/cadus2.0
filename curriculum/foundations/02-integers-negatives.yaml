          - problem: 'What is the absolute value of $9$?'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $9$ is $9$ units from $0$ on the number line. A positive number is its own absolute value, so the answer is $9$.'
          - problem: 'Which numbers are exactly $8$ units from $0$ on the number line?'
            answer: "-8, 8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One number lies $8$ units to the right of $0$, which is $8$. The other lies $8$ units to the left of $0$, which is $-8$. Both have absolute value $8$.'
