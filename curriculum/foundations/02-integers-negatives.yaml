            answer: "12"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Ana is $|-7| = 7$ m from the door and Ben is $|-5| = 5$ m from it. Together that is $7 + 5 = 12$ m.'
          - problem: 'Compute $|-10| - |-4|$.'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $|-10| = 10$ and $|-4| = 4$. Subtracting gives $10 - 4 = 6$.'
          - problem: 'A submarine is at $-35$ m and a diver is at $-12$ m relative to sea level. How much farther from the surface is the submarine than the diver?'
            answer: "23"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The submarine is $|-35| = 35$ m from the surface and the diver is $|-12| = 12$ m from it. The difference is $35 - 12 = 23$ m.'
          - problem: 'Subtract $|-9|$ from $|7|$.'
            answer: "-2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $|7| = 7$ and $|-9| = 9$. Then $7 - 9 = -2$.'
          - problem: 'Compute $|2 - 9| + |-4|$.'
            answer: "11"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $2 - 9 = -7$, so $|2 - 9| = 7$. Also $|-4| = 4$, and $7 + 4 = 11$.'
          - problem: 'Two thermometers read $-14$ degrees and $6$ degrees. How many degrees farther from $0$ is the first reading than the second?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first reading is $|-14| = 14$ degrees from $0$ and the second is $|6| = 6$ degrees from $0$. The difference is $14 - 6 = 8$ degrees.'
          - problem: 'Find the value of $|-6| + |2|$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each absolute value is a distance, so $|-6| = 6$ and $|2| = 2$. Their sum is $6 + 2 = 8$.'
        constraints: "sum or difference of two absolute values"
    diagnostic_exemplar:
      problem: 'Compute $|-9| - |5|$.'
      answer: "4"
      answer_contract: {"kind":"exact"}
      solution_sketch: 'Take each absolute value first: $9 - 5 = 4$.'
