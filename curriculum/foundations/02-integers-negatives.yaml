        key: true
    knowledge_points:
      - id: kp1
        name: Products with one negative factor
        key_prerequisites: [multiplication-tables, adding-integers]
        exemplars:
          - problem: 'Compute $-4 \times 3$.'
            answer: "-12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three groups of $-4$ are added: $-4 + (-4) + (-4) = -12$. One factor is negative, so the product is negative.'
          - problem: 'The temperature falls $3$ degrees Celsius every hour. What is the change in temperature after $5$ hours?'
            answer: "-15"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
            solution_sketch: 'Each hour changes the temperature by $-3$ degrees. After $5$ hours the change is $5 \times (-3) = -15$ degrees.'
          - problem: 'Compute $7 \times (-6)$.'
            answer: "-42"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only one factor is negative, so the product is negative. Multiplying the sizes gives $7 \times 6 = 42$, so the product is $-42$.'
          - problem: 'A gym takes $\$12$ from Ana''s account every month. What is the change in her balance after $4$ months?'
            answer: "-48"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Each month changes the balance by $-12$ dollars. After $4$ months the change is $4 \times (-12) = -48$ dollars.'
          - problem: 'Find the product of $-9$ and $4$.'
            answer: "-36"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The factors have different signs, so the product is negative. Since $9 \times 4 = 36$, the product is $-36$.'
          - problem: 'Find the value of $-8 \times 5$.'
            answer: "-40"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The size is $8 \times 5 = 40$. One factor is negative, so the product is $-40$.'
          - problem: 'A share loses $\$15$ in value. Li owns $6$ such shares. What is the total change in the value of her shares?'
            answer: "-90"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Each share changes by $-15$ dollars. For $6$ shares the change is $6 \times (-15) = -90$ dollars.'
        constraints: "factors from -12 to 12 (contexts may use larger sizes); exactly one negative factor"
      - id: kp2
        name: Products with two negative factors
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $-6 \times (-5)$.'
            answer: "30"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both factors are negative, so the product is positive. Since $6 \times 5 = 30$, the product is $30$.'
          - problem: 'Compute $(-8)(-4)$.'
            answer: "32"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two negative factors give a positive product. Multiplying the sizes gives $8 \times 4 = 32$.'
          - problem: 'A club cancels $9$ debts of $\$5$ each. What is the change in the club''s balance?'
            answer: "45"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Each debt is $-5$ dollars, and cancelling $9$ of them removes $9$ copies of $-5$. The change is $(-9)(-5) = 45$ dollars, a gain.'
          - problem: 'A tank loses water, so its volume changes by $-4$ litres each minute. Count time from now, with the future positive, so $7$ minutes ago is time $-7$. How many litres more than now did the tank hold then?'
            answer: "28"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'The change in volume from now to time $-7$ is the rate times the time, $(-4)(-7) = 28$. So the tank held $28$ litres more then.'
          - problem: 'Find the product of $-9$ and $-3$.'
            answer: "27"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two negative factors give a positive product. Since $9 \times 3 = 27$, the product is $27$.'
          - problem: 'Find the value of $(-7)(-6)$.'
            answer: "42"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The size is $7 \times 6 = 42$. Both factors are negative, so the product is positive, $42$.'
          - problem: 'Multiply $-12$ by $-11$.'
            answer: "132"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two negative factors give a positive product. Since $12 \times 11 = 132$, the product is $132$.'
        constraints: "factors from -12 to 12 (contexts may use other sizes); both factors negative"
    diagnostic_exemplar:
      problem: 'Compute $-6 \times (-8)$.'
      answer: "48"
      solution_sketch: 'Two negative factors give a positive product: $6 \times 8 = 48$.'
    anki_seeds:
      - front: "The product of two negative numbers is..."
        back: "positive"
        type: basic
      - front: "The product of a negative and a positive number is..."
        back: "negative"
        type: basic

  - id: dividing-integers
