            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add left to right: $-7 + 2 = -5$. Then $-5 + 5 = 0$, so the total is $0$.'
          - problem: 'Compute $15 + (-4) + (-15)$.'
            answer: "-4"
