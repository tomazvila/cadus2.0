            answer: "7"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height of the surface above the floor is the upper level minus the lower level, $-5 - (-12)$. Subtracting $-12$ is the same as adding $12$, so $-5 + 12 = 7$ m.'
          - problem: 'What is $-4$ minus $-9$?'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $-9$ from $-4$ is the same as adding $9$ to $-4$. So $-4 + 9 = 5$.'
          - problem: 'Subtract $-6$ from $8$.'
            answer: "14"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $-6$ from $8$ is the same as adding $6$ to $8$. So $8 + 6 = 14$.'
          - problem: 'The lowest temperature last winter was $-18$ degrees and the highest temperature was $27$ degrees. How many degrees apart are the two temperatures?'
            answer: "45"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The gap is the highest minus the lowest, $27 - (-18)$. Subtracting $-18$ is the same as adding $18$, so $27 + 18 = 45$ degrees.'
          - problem: 'Find $-10$ minus $-3$.'
            answer: "-7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $-3$ from $-10$ is the same as adding $3$ to $-10$. So $-10 + 3 = -7$.'
          - problem: 'Find the value of $6 - (-4)$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $-4$ is the same as adding $4$, so $6 - (-4) = 6 + 4$. The result is $10$.'
          - problem: 'Compute $-7 - (-7)$.'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $-7$ is the same as adding $7$. So $-7 + 7 = 0$, because the two numbers are opposites.'
        constraints: "integers from -12 to 12; subtrahend negative"
    diagnostic_exemplar:
      problem: 'Compute $-6 - (-2)$.'
      answer: "-4"
      answer_contract: {"kind":"exact"}
      solution_sketch: '$-6 + 2 = -4$.'
    anki_seeds:
