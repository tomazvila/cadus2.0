          - problem: 'Compute $9 - 4 + 7$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $9 - 4 = 5$. Then $5 + 7 = 12$.'
          - problem: 'Ali''s balance is $20$ dollars. He pays $35$ dollars, deposits $10$ dollars and then pays $4$ dollars. The account may be overdrawn. What is his balance now?'
            answer: "-9"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The balance is $20 - 35 + 10 - 4$. First $20 - 35 = -15$, then $-15 + 10 = -5$, and $-5 - 4 = -9$ dollars.'
          - problem: 'In a building the ground floor is floor $0$ and the basement floors are numbered $-1$, $-2$ and so on. A lift starts at floor $2$, goes down $6$ floors, up $3$ floors and down $5$ floors. Which floor is it on now?'
            answer: "-6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The floor number is $2 - 6 + 3 - 5$. First $2 - 6 = -4$, then $-4 + 3 = -1$, and $-1 - 5 = -6$.'
          - problem: 'Compute $-2 + 5 - (-4) - 7$.'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $-2 + 5 = 3$. Then $3 - (-4) = 7$, and $7 - 7 = 0$.'
          - problem: 'Find the value of $8 - 15 - (-6)$.'
            answer: "-1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $8 - 15 = -7$. Then $-7 - (-6) = -7 + 6 = -1$.'
        constraints: "three or four terms; integers from -15 to 15"
      - id: kp3
        name: Missing terms in signed sums
        key_prerequisites: [adding-integers, subtracting-integers]
        exemplars:
          - problem: 'What number makes $\square + (-4) = 3$ true?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Undo the addition of $-4$ by adding $4$ to $3$, which gives $7$. Check: $7 + (-4) = 3$.'
          - problem: 'What number makes $-5 - \square = -9$ true?'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The missing number is the amount taken away, so $\square = -5 - (-9) = -5 + 9 = 4$. Check: $-5 - 4 = -9$.'
          - problem: 'The temperature fell by $9$ degrees during the night and was $-4$ degrees in the morning. What was the temperature at the start of the night?'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The start temperature $t$ satisfies $t - 9 = -4$. Undo the subtraction by adding $9$: $t = -4 + 9 = 5$ degrees.'
          - problem: 'What number makes $\square + 6 = -2$ true?'
            answer: "-8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Undo the addition of $6$ by subtracting it: $\square = -2 - 6 = -8$. Check: $-8 + 6 = -2$.'
          - problem: 'A diver rises $6$ m and is then at an elevation of $-14$ m. At what elevation did the diver start?'
            answer: "-20"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The start elevation $e$ satisfies $e + 6 = -14$. Undo the addition by subtracting $6$: $e = -14 - 6 = -20$ m.'
          - problem: 'Rosa''s balance changed from $12$ dollars to $-5$ dollars after one payment. How large was the payment?'
            answer: "17"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'The payment $p$ satisfies $12 - p = -5$. So $p = 12 - (-5) = 12 + 5 = 17$ dollars.'
          - problem: 'Find the value of $\square$ that satisfies $-3 - \square = -10$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking $\square$ away from $-3$ leaves $-10$, so $\square = -3 - (-10) = -3 + 10 = 7$. Check: $-3 - 7 = -10$.'
          - problem: 'What number makes $\square - (-6) = 2$ true?'
            answer: "-4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting $-6$ adds $6$, so $\square + 6 = 2$ and $\square = 2 - 6 = -4$. Check: $-4 - (-6) = 2$.'
          - problem: 'What number goes in the box? $\square - 3 = -15$'
            answer: "-12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Undo the subtraction of $3$ by adding $3$: $\square = -15 + 3 = -12$. Check: $-12 - 3 = -15$.'
        constraints: "one missing term; integers from -15 to 15"
    diagnostic_exemplar:
      problem: 'What number makes $-5 + \square - (-3) = 4$ true?'
      answer: '6'
      answer_contract: {"kind":"exact"}
      solution_sketch: 'The left side is $\square - 2$, so $\square = 6$.'
    anki_seeds:
      - front: "To simplify a long chain of integer additions and subtractions, first rewrite every subtraction as..."
        back: "addition of the opposite, then add left to right"
        type: basic

  - id: multiplying-integers
    name: Multiplying Integers
    core: true
    difficulty: 0.2
    drill: true
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: multiplication-tables
        weight: 0.6
        key: true
