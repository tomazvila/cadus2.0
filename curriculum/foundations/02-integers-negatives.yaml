unit: integers-negatives
course: foundations
module: "Integers"
topics:
  - id: plotting-integers
    name: Plotting and Reading Integers
    core: true
    difficulty: 0.1
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: place-value
        weight: 0.5
        key: true
      - id: single-digit-addition
        weight: 0.2
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"number_line","min":"-8","max":"8","tick":"1","points":[{"at":"-6","label":"A","filled":true},{"at":"2","label":"B","filled":true}],"intervals":[],"caption":"Reference example: A is at -6 and B is at 2. Both positions use the same zero and unit spacing."}]
        name: Signed numbers describe direction from zero
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'The temperature is $5$ degrees below zero. What integer represents this temperature?'
            answer: "-5"
            solution_sketch: 'Below zero is negative: $5$ degrees below zero is $-5$.'
          - problem: 'A gain of $3$ metres is written $+3$. What integer represents a loss of $8$ metres?'
            answer: "-8"
            solution_sketch: 'A loss is the opposite of a gain: a loss of $8$ metres is $-8$.'
          - problem: 'A scuba diver is $18$ metres below sea level. What integer represents this depth?'
            answer: "-18"
            solution_sketch: 'Below sea level is negative: a depth of $18$ metres below is $-18$.'
          - problem: 'The value of an investment rises by $\$11$. What integer represents this change?'
            answer: "11"
            solution_sketch: 'A rise in value is a positive integer: a rise of $\$11$ is $+11$.'
        constraints: "real-world contexts (temperature, elevation, money); values from -20 to 20"
      - id: kp2
        visuals: [{"kind":"number_line","min":"-8","max":"8","tick":"1","points":[{"at":"-6","label":"A","filled":true},{"at":"2","label":"B","filled":true}],"intervals":[],"caption":"Reference example: A is at -6 and B is at 2. Both positions use the same zero and unit spacing."}]
        name: Locate integers on the number line
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'What integer is $4$ units to the left of $0$ on the number line?'
            answer: "-4"
            solution_sketch: 'Left of $0$ is negative; $4$ units left is $-4$.'
          - problem: 'Start at $0$ and move $6$ units to the right. What integer do you land on?'
            answer: "6"
            solution_sketch: 'Right of $0$ is positive; $6$ units right is $6$.'
          - problem: 'A grasshopper starts at $0$ and hops $9$ units toward the negative direction. What integer is it on now?'
            answer: "-9"
            solution_sketch: 'Hopping toward the negative direction from $0$ by $9$ units lands on $-9$.'
          - problem: 'Start at $0$ and move $3$ units to the right, then $7$ units to the left. What integer do you land on?'
            answer: "-4"
            solution_sketch: 'Three units right of $0$ reaches $3$; from $3$, seven units left lands on $-4$.'
        constraints: "integers from -10 to 10; moves start at 0"
    diagnostic_exemplar:
      problem: 'What integer is $7$ units to the left of $0$?'
      answer: "-7"
      solution_sketch: 'Left of zero is negative, so seven units left is $-7$.'
    anki_seeds:
      - front: "On a horizontal number line, negative integers lie to the ___ of zero."
        back: "left"
        type: basic

  - id: opposites-of-integers
    name: Opposites of Integers
    core: true
    difficulty: 0.12
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: plotting-integers
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Opposite of an integer
        key_prerequisites: [plotting-integers]
        exemplars:
          - problem: 'What is the opposite of $-7$?'
            answer: "7"
            solution_sketch: 'The opposite is the mirror image across $0$: same distance, other side.'
          - problem: 'What number is the same distance from $0$ as $12$, but on the other side?'
            answer: "-12"
            solution_sketch: '$12$ and $-12$ sit the same distance from $0$, on opposite sides.'
          - problem: 'What is the additive inverse of $0$?'
            answer: "0"
            solution_sketch: 'The additive inverse of $0$ is $0$ itself; $0$ is its own mirror image.'
          - problem: 'Reflect $-20$ across $0$ on the number line. What integer results?'
            answer: "20"
            solution_sketch: 'Reflecting across $0$ preserves distance while swapping the side: $-20$ reflects to $20$.'
        constraints: "integers from -20 to 20; include 0 occasionally"
      - id: kp2
        name: Opposite of an opposite
        key_prerequisites: [plotting-integers]
        exemplars:
          - problem: 'Compute $-(-4)$.'
            answer: "4"
            solution_sketch: 'The opposite of $-4$ is $4$.'
          - problem: 'Compute $-(-(-9))$.'
            answer: "-9"
            solution_sketch: 'Each minus flips the sign: $-(-(-9)) = -(9) = -9$.'
          - problem: 'What is the opposite of the opposite of $8$?'
            answer: "8"
            solution_sketch: 'An even number of sign flips (two) returns the original number, $8$.'
          - problem: 'Reflecting $0$ across zero, then reflecting the result across zero again, gives what integer?'
            answer: "0"
            solution_sketch: 'Reflecting $0$ across zero always lands back on $0$, however many times it repeats.'
        constraints: "up to three nested opposites; integers from -12 to 12"
    diagnostic_exemplar:
      problem: 'Compute $-(-11)$.'
      answer: "11"
      solution_sketch: 'The opposite of the opposite is the number itself: $11$.'
    anki_seeds:
      - front: "The opposite of a number is the number ..."
        back: "the same distance from 0 on the other side of the number line; -(-a) = a"
        type: basic

  - id: number-line-integers
    name: Integers on the Number Line
    core: true
    difficulty: 0.15
    drill: false
    answer_kind: numeric
    expected_time_secs: 40
    prerequisites:
      - id: plotting-integers
        weight: 0.7
        key: true
      - id: opposites-of-integers
        weight: 0.4
      - id: place-value
        weight: 0.3
      - id: single-digit-addition
        weight: 0.3
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"number_line","min":"-8","max":"8","tick":"1","points":[{"at":"-6","label":"A","filled":true},{"at":"2","label":"B","filled":true}],"intervals":[],"caption":"Reference example: A is at -6 and B is at 2. Both positions use the same zero and unit spacing."}]
        name: Order and compare integers
        key_prerequisites: [plotting-integers]
        exemplars:
          - problem: 'Which is greater, $-3$ or $-5$?'
            answer: "-3"
            solution_sketch: '$-3$ is to the right of $-5$ on the number line.'
          - problem: 'Order from least to greatest: $2$, $-4$, $0$, $-1$.'
            answer: "-4, -1, 0, 2"
            solution_sketch: 'Placed on the number line, the order is $-4, -1, 0, 2$.'
          - problem: 'Which integer is smaller, $-8$ or $-6$?'
            answer: "-8"
            solution_sketch: '$-8$ is to the left of $-6$ on the number line, so $-8$ is the smaller value.'
          - problem: 'Order from least to greatest: $2$, $-4$, $0$, $-1$, $5$.'
            answer: "-4, -1, 0, 2, 5"
            solution_sketch: 'Placed on the number line, the order is -4, -1, 0, 2, 5.'
        constraints: "integers from -10 to 10"
      - id: kp2
        visuals: [{"kind":"number_line","min":"-8","max":"8","tick":"1","points":[{"at":"-6","label":"A","filled":true},{"at":"2","label":"B","filled":true}],"intervals":[],"caption":"Reference example: A is at -6 and B is at 2. Both positions use the same zero and unit spacing."}]
        name: Distance between integers
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'How many units apart are $-2$ and $3$ on the number line?'
            answer: "5"
            solution_sketch: 'From $-2$ to $0$ is $2$, from $0$ to $3$ is $3$; total $5$.'
          - problem: 'What is the distance between $-6$ and $-1$ on the number line?'
            answer: "5"
            solution_sketch: 'Count from $-6$ up to $-1$: $5$ units.'
          - problem: 'Points $A$ and $B$ sit at $-7$ and $4$. How far apart are they?'
            answer: "11"
            solution_sketch: 'From $-7$ to $0$ is $7$, from $0$ to $4$ is $4$; total $11$.'
          - problem: 'By how many units do you move to get from $-9$ to $-3$ on the number line?'
            answer: "6"
            solution_sketch: 'Count from $-9$ up to $-3$: $6$ units.'
        constraints: "integers from -10 to 10"
    diagnostic_exemplar:
      problem: 'How many units apart are $-4$ and $3$ on the number line?'
      answer: "7"
      solution_sketch: '$4$ units up to $0$, then $3$ more: $7$.'
    anki_seeds:
      - front: "On a number line, a number to the right is always ___ than a number to its left."
        back: "greater"
        type: basic

  - id: comparing-integers
    name: Comparing Integers with Inequality Symbols
    core: false                # comparison destination; number-line-integers stays core
    difficulty: 0.18
    drill: false
    # Answers are bare relation symbols, true/false, and inequality chains — none of
    # which the SymPy override can adjudicate; the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 45
    prerequisites:
      - id: number-line-integers
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: Write < or > between two integers
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Fill in $<$ or $>$: $-5 \;\square\; -2$.'
            answer: "<"
            answer_contract: {"kind":"label","options":[["<"],[">"]]}
            solution_sketch: '$-5$ is left of $-2$, so $-5 < -2$.'
          - problem: 'Fill in $<$ or $>$: $3 \;\square\; -7$.'
            answer: ">"
            answer_contract: {"kind":"label","options":[["<"],[">"]]}
            solution_sketch: '$3$ is right of $-7$ on the number line, so $3 > -7$.'
          - problem: 'Which symbol, $<$ or $>$, makes $-9 \;\square\; -1$ true?'
            answer: "<"
            answer_contract: {"kind":"label","options":[["<"],[">"]]}
            solution_sketch: '$-9$ is left of $-1$ on the number line, so $-9 < -1$.'
          - problem: 'Insert $<$ or $>$ to make a true statement: $0 \;\square\; -6$.'
            answer: ">"
            answer_contract: {"kind":"label","options":[["<"],[">"]]}
            solution_sketch: '$0$ is right of $-6$ on the number line, so $0 > -6$.'
        constraints: "integers from -12 to 12; include negative-negative pairs"
      - id: kp2
        name: Judge and write inequality statements
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'True or false: $-7 < -9$.'
            answer: "false"
            answer_contract: {"kind":"label","options":[["true"],["false"]]}
            solution_sketch: '$-7$ is right of $-9$, so $-7 > -9$.'
          - problem: 'Write $3$, $-1$, $-4$ as a chain from least to greatest using $<$.'
            answer: "-4 < -1 < 3"
            answer_contract: {kind: ascending_chain}
            solution_sketch: 'On the number line the order least to greatest is $-4 < -1 < 3$.'
          - problem: 'True or false: $-3 < 2$.'
            answer: "true"
            answer_contract: {"kind":"label","options":[["true"],["false"]]}
            solution_sketch: '$-3$ compares to $2$ with $<$, so the statement is true.'
          - problem: 'Arrange $-2$, $-8$, $-5$ in increasing order using $<$.'
            answer: "-8 < -5 < -2"
            answer_contract: {kind: ascending_chain}
            solution_sketch: 'On the number line the increasing order is -8 < -5 < -2.'
        constraints: "true/false judgments and chains of up to three integers"
    diagnostic_exemplar:
      problem: 'Write $5$, $-2$, $-9$ as a chain from least to greatest using $<$.'
      answer_contract: {kind: ascending_chain}
      answer: '-9 < -2 < 5'
      solution_sketch: 'On the number line $-9$ is furthest left and $5$ furthest right.'
    anki_seeds:
      - front: "The inequality symbol always opens toward the ___ number."
        back: "greater"
        type: basic

  - id: absolute-value
    name: Absolute Value
    core: true
    difficulty: 0.15
    drill: false
    answer_kind: numeric
    expected_time_secs: 35
    prerequisites:
      - id: number-line-integers
        weight: 0.7
        key: true
      - id: opposites-of-integers
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Absolute value of an integer
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Compute $|-6|$.'
            answer: "6"
            solution_sketch: 'The distance of $-6$ from $0$ is $6$.'
          - problem: 'What is the absolute value of $9$?'
            answer: "9"
            solution_sketch: 'The distance of $9$ from $0$ is $9$.'
          - problem: 'A temperature reading of $-13$ degrees has what absolute value?'
            answer: "13"
            solution_sketch: 'A reading of $-13$ sits $13$ units from $0$, so its absolute value is $13$.'
          - problem: 'What absolute value does $0$ have?'
            answer: "0"
            solution_sketch: 'The distance of $0$ from $0$ is $0$.'
        constraints: "integers from -20 to 20"
      - id: kp2
        name: Absolute value in expressions
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Compute $|-4| + |3|$.'
            answer: "7"
            solution_sketch: '$|-4| = 4$, $|3| = 3$; $4 + 3 = 7$.'
          - problem: 'Compute $|-10| - |-4|$.'
            answer: "6"
            solution_sketch: '$|-10| = 10$, $|-4| = 4$; $10 - 4 = 6$.'
          - problem: 'Add the absolute values of $-8$ and $-2$.'
            answer: "10"
            solution_sketch: '$|-8| = 8$ and $|-2| = 2$; the sum of these two distances is $10$.'
          - problem: 'Subtract $|-9|$ from $|7|$.'
            answer: "-2"
            solution_sketch: '$|7| = 7$ and $|-9| = 9$; $7$ minus $9$ leaves $-2$.'
        constraints: "sum or difference of two absolute values"
    diagnostic_exemplar:
      problem: 'Compute $|-9| - |5|$.'
      answer: "4"
      solution_sketch: 'Take each absolute value first: $9 - 5 = 4$.'
    anki_seeds:
      - front: "The absolute value of a number is..."
        back: "its distance from 0 on the number line (always 0 or positive)"
        type: basic

  - id: adding-integers
    name: Adding Integers
    core: true
    difficulty: 0.18
    drill: true
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: number-line-integers
        weight: 0.6
        key: true
      - id: absolute-value
        weight: 0.5
        key: true
      - id: multi-digit-addition-subtraction
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Adding integers with the same sign
        key_prerequisites: [absolute-value]
        exemplars:
          - problem: 'Compute $-3 + (-5)$.'
            answer: "-8"
            solution_sketch: "Same signs: add absolute values, keep the sign."
          - problem: 'Find the sum of $-7$ and $-2$.'
            answer: "-9"
            solution_sketch: 'Same signs: $7 + 2 = 9$, keep the sign: $-9$.'
          - problem: 'Add $-9$ and $-6$.'
            answer: "-15"
            solution_sketch: 'Same signs: $9 + 6 = 15$, keep the sign: $-15$.'
          - problem: 'Compute $8 + 5$.'
            answer: "13"
            solution_sketch: 'Same signs: $8 + 5 = 13$, keep the sign: $13$.'
        constraints: "integers from -12 to 12; both addends negative or both positive"
      - id: kp2
        name: Adding integers with different signs
        key_prerequisites: [absolute-value]
        exemplars:
          - problem: 'Compute $-7 + 4$.'
            answer: "-3"
            solution_sketch: 'Different signs: $7 - 4 = 3$, keep sign of the larger absolute value (-).'
          - problem: 'Compute $9 + (-4)$.'
            answer: "5"
            solution_sketch: 'Different signs: $9 - 4 = 5$, keep the sign of the larger absolute value: $5$.'
          - problem: 'What is $-10$ plus $3$?'
            answer: "-7"
            solution_sketch: 'Different signs: $10 - 3 = 7$, keep the sign of the larger absolute value: $-7$.'
          - problem: 'Combine $6$ and $-2$ using addition.'
            answer: "4"
            solution_sketch: 'Different signs: $6 - 2 = 4$, keep the sign of the larger absolute value: $4$.'
        constraints: "integers from -12 to 12; one positive, one negative addend"
      - id: kp3
        name: Additive inverses and zero sums
        key_prerequisites: [number-line-integers]
        exemplars:
          - problem: 'Compute $-6 + 6$.'
            answer: "0"
            solution_sketch: 'Opposites sum to $0$.'
          - problem: 'Compute $-8 + 3 + 5$.'
            answer: "0"
            solution_sketch: '$-8 + 3 = -5$; $-5 + 5 = 0$.'
          - problem: 'What is the sum of $-9$ and its opposite, $9$?'
            answer: "0"
            solution_sketch: 'A number and its opposite always sum to $0$.'
          - problem: 'Three numbers, $-7$, $2$, and $5$, are added together. What is the total?'
            answer: "0"
            solution_sketch: 'Adding left to right, $-7$ and $2$ give $-5$, and $-5$ combined with $5$ leaves $0$.'
        constraints: "sums that cancel to 0; up to three addends from -12 to 12"
    diagnostic_exemplar:
      problem: 'Compute $-6 + (-5) + 8$.'
      answer: '-3'
      solution_sketch: '$-6 + (-5) = -11$; then $-11 + 8 = -3$.'
    anki_seeds:
      - front: "To add two numbers with different signs, subtract the smaller absolute value from the larger and..."
        back: "keep the sign of the number with the larger absolute value"
        type: basic
      - front: "The sum of a number and its opposite is..."
        back: "0"
        type: basic

  - id: subtracting-integers
    name: Subtracting Integers
    core: true
    difficulty: 0.22
    drill: true
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: adding-integers
        weight: 0.8
        key: true
      - id: opposites-of-integers
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Rewrite subtraction as adding the opposite
        key_prerequisites: [adding-integers]
        exemplars:
          - problem: 'Compute $3 - 8$.'
            answer: "-5"
            solution_sketch: '$3 + (-8) = -5$.'
          - problem: 'What is $-2$ minus $6$?'
            answer: "-8"
            solution_sketch: 'Adding the opposite of $6$ to $-2$ gives $-8$.'
          - problem: 'Subtract $9$ from $-5$.'
            answer: "-14"
            solution_sketch: 'Adding the opposite of $9$ to $-5$ gives $-14$.'
          - problem: 'Find the difference when $11$ is taken from $4$.'
            answer: "-7"
            solution_sketch: 'Adding the opposite of $11$ to $4$ gives $-7$.'
        constraints: "integers from -12 to 12; subtrahend positive"
      - id: kp2
        name: Subtracting a negative
        key_prerequisites: [opposites-of-integers]
        exemplars:
          - problem: 'Compute $5 - (-3)$.'
            answer: "8"
            solution_sketch: 'Subtracting $-3$ is the same as adding $3$.'
          - problem: 'What is $-4$ minus $-9$?'
            answer: "5"
            solution_sketch: 'Subtracting $-9$ from $-4$ is the same as adding $9$ to $-4$.'
          - problem: 'Subtract $-6$ from $8$.'
            answer: "14"
            solution_sketch: 'Subtracting $-6$ from $8$ is the same as adding $6$ to $8$.'
          - problem: 'Find $-10$ minus $-3$.'
            answer: "-7"
            solution_sketch: 'Subtracting $-3$ from $-10$ is the same as adding $3$ to $-10$.'
        constraints: "integers from -12 to 12; subtrahend negative"
    diagnostic_exemplar:
      problem: 'Compute $-6 - (-2)$.'
      answer: "-4"
      solution_sketch: '$-6 + 2 = -4$.'
    anki_seeds:
      - front: "Subtracting a negative number is the same as..."
        back: "adding its positive: a - (-b) = a + b"
        type: basic

  - id: integer-addition-subtraction
    name: Adding and Subtracting Integers
    core: true
    difficulty: 0.25
    drill: true
    answer_kind: numeric
    expected_time_secs: 40
    prerequisites:
      - id: adding-integers
        weight: 0.8
        key: true
      - id: subtracting-integers
        weight: 0.8
        key: true
      - id: multi-digit-addition-subtraction
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Mixed two-term sums and differences
        key_prerequisites: [adding-integers, subtracting-integers]
        exemplars:
          - problem: 'Compute $4 - 9$.'
            answer: "-5"
            solution_sketch: '$4 + (-9) = -5$.'
          - problem: 'Compute $-3 - (-7)$.'
            answer: "4"
            solution_sketch: '$-3 + 7 = 4$.'
          - problem: 'Compute $-8 + (-3)$.'
            answer: "-11"
            solution_sketch: 'Same signs: $8 + 3 = 11$, keep the sign: $-11$.'
          - problem: 'Take $-5$ away from $6$.'
            answer: "11"
            solution_sketch: 'Taking away $-5$ is the same as adding $5$ to $6$.'
        constraints: "integers from -12 to 12; mix all four sign cases"
      - id: kp2
        name: Chains of three or more terms
        key_prerequisites: [adding-integers, subtracting-integers]
        exemplars:
          - problem: 'Compute $-2 + 5 - (-4) - 7$.'
            answer: "0"
            solution_sketch: '$-2 + 5 = 3$; $3 + 4 = 7$; $7 - 7 = 0$.'
          - problem: 'Compute $10 - 15 + (-3)$.'
            answer: "-8"
            solution_sketch: '$10 - 15 = -5$; then $-5 + (-3) = -8$.'
          - problem: 'Compute $9 - 4 + 7$.'
            answer: "12"
            solution_sketch: '$9 - 4 = 5$; then $5 + 7 = 12$.'
          - problem: 'Compute $-6 + 11 - 8 + 3$.'
            answer: "0"
            solution_sketch: '$-6 + 11 = 5$; then $5 - 8 = -3$; then $-3 + 3 = 0$.'
        constraints: "three or four terms; integers from -15 to 15"
      - id: kp3
        name: Missing terms in signed sums
        key_prerequisites: [adding-integers, subtracting-integers]
        exemplars:
          - problem: 'What number makes $\square + (-4) = 3$ true?'
            answer: "7"
            solution_sketch: 'Need $4$ more than $3$ after losing $4$: $7 + (-4) = 3$.'
          - problem: 'What number makes $-5 - \square = -9$ true?'
            answer: "4"
            solution_sketch: '$-5 - 4 = -9$.'
          - problem: 'What number makes $\square + 6 = -2$ true?'
            answer: "-8"
            solution_sketch: '$\square = -2 - 6 = -8$; check: $-8 + 6 = -2$.'
          - problem: 'Find the value of $\square$ that satisfies $-3 - \square = -10$.'
            answer: "7"
            solution_sketch: 'Isolating the unknown gives $\square$ equal to $-3$ minus $-10$, which is $7$.'
        constraints: "one missing term; integers from -12 to 12"
    diagnostic_exemplar:
      problem: 'What number makes $-5 + \square - (-3) = 4$ true?'
      answer: '6'
      solution_sketch: 'The left side is $\square - 2$, so $\square = 6$.'
    anki_seeds:
      - front: "To simplify a long chain of integer additions and subtractions, first rewrite every subtraction as..."
        back: "addition of the opposite, then add left to right"
        type: basic

  - id: multiplying-integers
    name: Multiplying Integers
    core: true
    difficulty: 0.2
    drill: true
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: multiplication-tables
        weight: 0.6
        key: true
      - id: adding-integers
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Products with one negative factor
        key_prerequisites: [multiplication-tables, adding-integers]
        exemplars:
          - problem: 'Compute $-4 \times 3$.'
            answer: "-12"
            solution_sketch: 'Three groups of $-4$: $-4 + (-4) + (-4) = -12$.'
          - problem: 'Compute $7 \times (-6)$.'
            answer: "-42"
            solution_sketch: 'One negative factor: the product is negative; $7 \times 6 = 42$.'
          - problem: 'Find the product of $-9$ and $4$.'
            answer: "-36"
            solution_sketch: '1 negative factor (odd): the product is negative; $9 \times 4 = 36$.'
          - problem: 'Multiply $8$ by $-3$.'
            answer: "-24"
