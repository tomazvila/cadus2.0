            solution_sketch: 'The debt is a change of $-84$ dollars, shared by $4$ friends. Each change is $-84 \div 4 = -21$ dollars.'
          - problem: 'Compute $48 \div (-8)$.'
            answer: "-6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The signs differ, so the quotient is negative. Since $48 \div 8 = 6$, the quotient is $-6$.'
          - problem: 'The temperature fell $18$ degrees in $6$ hours at a steady rate. What is the change in temperature per hour?'
            answer: "-3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total change is $-18$ degrees over $6$ hours. Each hour the change is $-18 \div 6 = -3$ degrees.'
          - problem: 'Divide $-72$ by $8$.'
            answer: "-9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only one number is negative, so the quotient is negative. Since $72 \div 8 = 9$, the quotient is $-9$.'
          - problem: 'A diver sinks steadily to $52$ metres below the surface in $4$ minutes. What is the change in her elevation each minute?'
            answer: "-13"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Her elevation changes by $-52$ metres in $4$ minutes. Each minute the change is $-52 \div 4 = -13$ metres.'
          - problem: 'Find the value of $56 \div (-8)$.'
            answer: "-7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The size is $56 \div 8 = 7$. The signs differ, so the quotient is $-7$.'
          - problem: 'The temperature changes by $-4$ degrees Celsius every hour. What is the total change in temperature after $5$ hours?'
            answer: "-20"
            answer_contract: {"kind":"unit","quantity":"temperature","unit":"°C","allow_omitted":true}
