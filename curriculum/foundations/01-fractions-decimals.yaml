      - id: equivalent-fractions
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Multiply numerators and denominators
        key_prerequisites: [multiplication-tables]
        step_check:
          step: 'Multiply the numerators: $3 \times 2 = 6$.'
          question: 'Why is the numerator of $\frac{3}{4}\times\frac{2}{5}$ found by multiplying $3\times2$ and not by adding $3+2$?'
          options:
            - 'Multiplying fractions needs a common denominator first, as adding does'
            - 'It counts $3\times2$ pieces, each one twentieth of the whole'
            - 'Adding the numerators gives the same value as multiplying them here'
            - 'The numerators are multiplied only because the denominators are multiplied'
          answer: 'It counts $3\times2$ pieces, each one twentieth of the whole'
          why: 'Taking $\frac{3}{4}$ of $\frac{2}{5}$ cuts the whole into $4\times5=20$ equal pieces and counts $3\times2=6$ of them, so the product is $\frac{6}{20}$.'
        try_first:
          problem: 'What fraction of a whole pizza is half of one third of the pizza?'
          answer_contract: {"kind":"exact"}
          answer: '1/6'
          reveal: 'Half of a third is a sixth: cutting each third in two makes six equal pieces in the whole pizza. In symbols, $\frac12\times\frac13=\frac{1\times1}{2\times3}=\frac16$.'
        exemplars:
          - problem: 'Find $\frac{2}{3}\times\frac{4}{5}$.'
            answer: '8/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the numerators: $2\times4=8$. Multiply the denominators: $3\times5=15$, so the product is $\frac{8}{15}$.'
          - problem: 'A rectangle measures $\frac{1}{2}$ m by $\frac{3}{7}$ m. What is its area in square metres?'
            answer: '3/14'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area of a rectangle is its length times its width. So the area is $\frac{1\times3}{2\times7}=\frac{3}{14}$ square metre.'
          - problem: 'A bottle holds $\frac{2}{7}$ litre of juice. Tom drinks $\frac{3}{5}$ of it. How many litres does he drink?'
            answer: '6/35'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Taking a fraction of an amount means multiplying. So Tom drinks $\frac{3}{5}\times\frac{2}{7}=\frac{6}{35}$ litre of the juice.'
          - problem: 'A recipe needs $\frac{3}{4}$ litre of milk. Mia makes only $\frac{3}{5}$ of the recipe. How many litres of milk does she use?'
            answer: '9/20'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'She uses a fraction of the milk, so multiply. The amount is $\frac{3}{5}\times\frac{3}{4}=\frac{9}{20}$ litre.'
          - problem: 'Ana has $\frac{5}{6}$ of a chocolate bar. She eats $\frac{1}{4}$ of what she has. What fraction of the whole bar does she eat?'
            answer: '5/24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'She eats a quarter of five sixths, so multiply. Then $\frac{1}{4}\times\frac{5}{6}=\frac{5}{24}$ of the whole bar.'
          - problem: 'Sam works out $\frac{3}{8}\times\frac{5}{7}$ as $\frac{15}{7}$. What is the correct value?'
            answer: '15/56'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam multiplied the numerators but forgot to multiply the denominators. The correct product is $\frac{3\times5}{8\times7}=\frac{15}{56}$.'
          - problem: 'A grid has $7$ columns and $3$ rows. Four of the columns are shaded blue and two of the rows are shaded yellow. What fraction of the grid is both blue and yellow?'
            answer: '8/21'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The overlap holds $4\times2=8$ cells. The grid has $7\times3=21$ cells, so the fraction is $\frac{8}{21}$.'
          - problem: 'Is $\frac{3}{4}$ of $\frac{5}{6}$ more or less than $\frac{5}{6}$?'
            answer: 'less'
            answer_contract: {"kind":"label","options":[["less","it is less","smaller","less than","less than 5/6"],["more","it is more","larger","greater","more than"]]}
            solution_sketch: 'Three quarters of an amount is smaller than the whole amount. Here $\frac{3}{4}\times\frac{5}{6}=\frac{5}{8}$, which is less than $\frac{5}{6}$.'
        constraints: "numerators and denominators up to 9; result already in lowest terms"
      - id: kp2
        name: Simplifying the result
        key_prerequisites: [equivalent-fractions]
        step_check:
          step: 'Find the GCD of 12 and 35, which is 1.'
          question: 'Why does a GCD of $1$ show that $\frac{12}{35}$ cannot be reduced?'
          options:
            - 'Because $12$ is smaller than $35$, so the fraction is already proper'
            - 'The GCD counts how many times $12$ goes into $35$, and that is too few'
            - 'Because $35$ is odd, so it cannot be divided down any further'
            - 'No whole number above $1$ divides both $12$ and $35$ evenly'
          answer: 'No whole number above $1$ divides both $12$ and $35$ evenly'
          why: 'A fraction reduces when top and bottom share a factor above $1$. The numbers $12$ and $35$ share none, so $\frac{12}{35}$ is already in lowest terms.'
        exemplars:
          - problem: 'Simplify $\frac{2}{3}\times\frac{3}{4}$.'
            answer: '1/2'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Multiply across to get $\frac{6}{12}$. Divide the top and bottom by $6$ to get $\frac{1}{2}$.'
          - problem: 'A rectangle is $\frac{4}{9}$ m long and $\frac{3}{8}$ m wide. What is its area in square metres?'
            answer: '1/6'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area is $\frac{4\times3}{9\times8}=\frac{12}{72}$. Dividing the top and bottom by $12$ gives $\frac{1}{6}$ square metre.'
          - problem: 'A measure holds $\frac{3}{10}$ litre of syrup. Lena pours out $\frac{5}{6}$ of it. How many litres does she pour?'
            answer: '1/4'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'A fraction of an amount means multiplying: $\frac{5}{6}\times\frac{3}{10}=\frac{15}{60}$. Dividing the top and bottom by $15$ gives $\frac{1}{4}$ litre.'
          - problem: 'Of a garden, $\frac{5}{12}$ is planted with vegetables, and $\frac{3}{10}$ of the vegetable part is beans. What fraction of the whole garden is beans?'
            answer: '1/8'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The beans are $\frac{3}{10}$ of $\frac{5}{12}$. That is $\frac{15}{120}$, and dividing the top and bottom by $15$ gives $\frac{1}{8}$ of the garden.'
          - problem: 'A grid has $7$ columns and $9$ rows. Six of the columns are shaded blue and seven of the rows are shaded yellow. What fraction of the grid is both blue and yellow?'
            answer: '2/3'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The overlap holds $6\times7=42$ cells out of $7\times9=63$. Dividing the top and bottom by $21$ gives $\frac{2}{3}$.'
          - problem: 'Sam multiplies $\frac{4}{6}\times\frac{3}{5}$ and gets $\frac{12}{30}$. He divides the top and bottom by $3$ and writes $\frac{4}{10}$. What is the fully simplified value?'
            answer: '2/5'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Sam stopped too early, because $4$ and $10$ still share the factor $2$. Dividing both by $2$ gives $\frac{2}{5}$.'
          - problem: 'A bottle holds $\frac{3}{4}$ litre. Lena drinks $\frac{2}{3}$ of it. How many litres does she drink?'
            answer: '1/2'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'She drinks a fraction of the bottle, so multiply: $\frac{2}{3}\times\frac{3}{4}=\frac{6}{12}$. Dividing the top and bottom by $6$ gives $\frac{1}{2}$ litre.'
          - problem: 'Simplify $\frac{9}{10}\times\frac{5}{12}$.'
            answer: '3/8'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Multiplying across gives $\frac{45}{120}$. Dividing the top and bottom by $15$ gives $\frac{3}{8}$.'
        constraints: "result reducible; values up to 12"
      - id: kp3
        name: Cross-cancelling and whole-number factors
        key_prerequisites: [fraction-of-a-number]
        step_check:
          step: 'Cancel the common factor: $\frac{7}{14} = \frac{1}{2}$.'
          question: 'Why can the $7$ in one fraction cancel with the $14$ in the other fraction?'
          options:
            - 'Cancelling works only inside one fraction, so $7$ and $14$ must stay'
            - 'Any two numbers that share a factor cancel, even when they are added'
            - 'The product has $7$ on top and $14$ below, so $7$ divides both of them'
            - 'Cancelling changes the value, but the last division by $7$ puts it back'
          answer: 'The product has $7$ on top and $14$ below, so $7$ divides both of them'
          why: 'The product $\frac{7\times4}{8\times14}$ is one fraction. Dividing its top and bottom by the common factor $7$ does not change its value, and it makes the numbers smaller.'
        exemplars:
          - problem: 'Simplify $\frac{5}{6}\times\frac{9}{10}$.'
            answer: '3/4'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Cancel $5$ against $10$ to leave $\frac{1}{2}$, and $9$ against $6$ to leave $\frac{3}{2}$. Then $\frac{1\times3}{2\times2}=\frac{3}{4}$.'
          - problem: 'Find $3\times\frac{2}{5}$.'
            answer: '6/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the whole number $3$ as $\frac{3}{1}$. Then multiply across to get $\frac{3\times2}{1\times5}=\frac{6}{5}$.'
          - problem: 'A rectangle is $\frac{8}{15}$ m long and $\frac{5}{12}$ m wide. What is its area in square metres?'
            answer: '2/9'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Cancel $5$ against $15$ to leave $3$, and $8$ against $12$ to leave $\frac{2}{3}$. The area is $\frac{2}{3\times3}=\frac{2}{9}$ square metre.'
          - problem: 'Four bottles each hold $\frac{5}{6}$ litre of juice. How many litres of juice is that in all?'
            answer: '10/3'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Four equal amounts means multiplying: $4\times\frac{5}{6}$. Cancel $4$ against $6$ to get $\frac{2\times5}{3}=\frac{10}{3}$ litres.'
          - problem: 'A staircase has $12$ steps, and each step is $\frac{3}{20}$ m high. How high is the staircase in metres?'
            answer: '9/5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height is $12\times\frac{3}{20}$. Cancel $12$ against $20$ to leave $3$ and $5$, so the height is $\frac{3\times3}{5}=\frac{9}{5}$ m.'
          - problem: 'Sam works out $\frac{4}{9}\times3$ as $\frac{12}{27}$. What is the correct value?'
            answer: '4/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam multiplied the denominator by $3$ as well. Write $3$ as $\frac{3}{1}$, then cancel the $3$ against $9$ to get $\frac{4}{3}$.'
          - problem: 'In a class of $28$ pupils, $\frac{3}{7}$ walk to school. How many pupils walk?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Cancel the $7$ against the $28$ to leave $4$. Then $3\times4=12$, so $12$ pupils walk to school.'
          - problem: 'Simplify $\frac{14}{15}\times\frac{9}{28}$.'
            answer: '3/10'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Cancel $14$ against $28$ to leave $\frac{1}{2}$, and $9$ against $15$ to leave $\frac{3}{5}$. Then $\frac{1\times3}{2\times5}=\frac{3}{10}$.'
        constraints: "cancel common factors before multiplying; values up to 28"
    diagnostic_exemplar:
      problem: 'Compute $\frac{3}{4} \times \frac{2}{9}$.'
      answer: "1/6"
      solution_sketch: 'Cross-cancel first: $\frac{3}{9} = \frac{1}{3}$ and $\frac{2}{4} = \frac{1}{2}$, leaving $\frac{1}{6}$.'
    anki_seeds:
      - front: "To multiply two fractions, multiply the numerators together and multiply the..."
        back: "denominators together"
        type: basic

  - id: dividing-fractions
    name: Dividing Fractions
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 75
    prerequisites:
      - id: multiplying-fractions
        weight: 0.8
        key: true
      - id: fraction-basics
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Reciprocals
        key_prerequisites: [fraction-basics]
        step_check:
          step: 'Swap the numerator and denominator: 9/2 becomes 2/9'
          question: 'Why is $\frac{2}{9}$ the reciprocal of $\frac{9}{2}$?'
          options:
            - 'The product $\frac{9}{2}\times\frac{2}{9}$ equals $1$'
            - 'Swapping the parts always makes a fraction smaller than $1$'
            - 'The reciprocal has the same value, written upside down'
            - 'The sum $\frac{9}{2}+\frac{2}{9}$ is equal to $1$'
          answer: 'The product $\frac{9}{2}\times\frac{2}{9}$ equals $1$'
          why: 'Two numbers are reciprocals when their product is $1$. Here $\frac{9}{2}\times\frac{2}{9}=\frac{18}{18}=1$, and the swap is the quick way to find such a number.'
        exemplars:
          - problem: 'What is the reciprocal of $\frac{3}{5}$?'
            answer: '5/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the numerator and the denominator to get $\frac{5}{3}$. Check the result: $\frac{3}{5}\times\frac{5}{3}=1$.'
          - problem: 'What is the reciprocal of $4$?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A whole number $4$ is $\frac{4}{1}$, so its reciprocal is $\frac{1}{4}$. Check: $4\times\frac{1}{4}=1$.'
          - problem: 'What number multiplied by $\frac{5}{8}$ gives $1$?'
            answer: '8/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number that multiplies $\frac{5}{8}$ to give $1$ is its reciprocal. Check: $\frac{5}{8}\times\frac{8}{5}=1$, so the number is $\frac{8}{5}$.'
          - problem: 'Nine equal pieces exactly cover one whole strip. What fraction of the strip is each piece?'
            answer: '1/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Nine equal pieces make one whole, so each piece is $\frac{1}{9}$ of the strip. Check: $9\times\frac{1}{9}=1$, so $\frac{1}{9}$ is the reciprocal of $9$.'
          - problem: 'A cup holds $\frac{2}{7}$ litre. How many cups of this size make exactly one litre?'
            answer: '7/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The count is $1\div\frac{2}{7}$, which is the reciprocal of $\frac{2}{7}$. So $\frac{7}{2}$ cups make one litre.'
          - problem: 'Sam says the reciprocal of $5$ is $-5$. What is the correct reciprocal of $5$?'
            answer: '1/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam changed the sign instead of swapping. The reciprocal of $5=\frac{5}{1}$ is $\frac{1}{5}$, since $5\times\frac{1}{5}=1$.'
          - problem: 'What is the reciprocal of $\frac{1}{6}$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Swap the numerator and the denominator to get $\frac{6}{1}=6$. Check the result: $\frac{1}{6}\times6=1$.'
          - problem: 'Is there a number that multiplies with $0$ to give $1$?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","there is"],["no","there is not","there is no such number","none","no number","no such number"]]}
            solution_sketch: 'Zero times any number is $0$, never $1$. So $0$ has no reciprocal, and the answer is no.'
        constraints: "simple fractions and whole numbers"
      - id: kp2
        name: Divide by multiplying by the reciprocal
        key_prerequisites: [multiplying-fractions]
        step_check:
          step: 'Multiply by the reciprocal of the divisor'
          question: 'Why does dividing by $\frac{7}{12}$ give the same result as multiplying by $\frac{12}{7}$?'
          options:
            - 'Division always gives the same result as multiplication when the fractions are proper'
            - 'The divisor is turned upside down because it is the smaller fraction'
            - 'Each whole holds $\frac{12}{7}$ pieces of that size, so multiply by $\frac{12}{7}$'
            - 'The first fraction is flipped and the second fraction stays as it is'
          answer: 'Each whole holds $\frac{12}{7}$ pieces of that size, so multiply by $\frac{12}{7}$'
          why: 'One whole holds $\frac{12}{7}$ pieces of size $\frac{7}{12}$, so $\frac{5}{6}$ of a whole holds $\frac{5}{6}\times\frac{12}{7}$ of them. That count is the quotient.'
        try_first:
          problem: 'A pizza is cut into slices that are each $\frac{1}{8}$ of the pizza. A group eats $\frac{3}{4}$ of the pizza. How many slices do they eat?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'They eat $6$ slices, because $\frac{3}{4}=\frac{6}{8}$. Dividing by a fraction asks how many pieces of that size fit into the amount.'
        exemplars:
          - problem: 'Find $\frac{2}{3}\div\frac{4}{5}$.'
            answer: '5/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'To divide, multiply by the reciprocal of $\frac{4}{5}$: $\frac{2}{3}\times\frac{5}{4}=\frac{10}{12}$. This simplifies to $\frac{5}{6}$.'
          - problem: 'A jug holds $\frac{2}{3}$ litre. A cup holds $\frac{4}{9}$ litre. How many cups does the jug fill?'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the jug by the cup: $\frac{2}{3}\div\frac{4}{9}=\frac{2}{3}\times\frac{9}{4}=\frac{18}{12}=\frac{3}{2}$. The jug fills $1\frac{1}{2}$ cups.'
          - problem: 'A rectangle has area $\frac{5}{6}$ square metre and width $\frac{2}{3}$ metre. How long is it in metres?'
            answer: '5/4'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Length is area divided by width: $\frac{5}{6}\times\frac{3}{2}=\frac{15}{12}=\frac{5}{4}$. The rectangle is $\frac{5}{4}$ m long.'
          - problem: 'One step is $\frac{5}{8}$ m long. How many steps does it take to cover $\frac{3}{4}$ m?'
            answer: '6/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of steps is $\frac{3}{4}\div\frac{5}{8}=\frac{3}{4}\times\frac{8}{5}=\frac{24}{20}=\frac{6}{5}$. That is a little more than one step.'
          - problem: 'A jug holds $\frac{1}{3}$ litre. A cup holds $\frac{4}{5}$ litre. What fraction of the cup does the jug fill?'
            answer: '5/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the jug by the cup: $\frac{1}{3}\div\frac{4}{5}=\frac{1}{3}\times\frac{5}{4}=\frac{5}{12}$. The jug fills less than half the cup.'
          - problem: 'A cup holds $\frac{3}{4}$ litre. How many litres are in $\frac{2}{3}$ of a cup?'
            answer: '1/2'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'A fraction of a cup is found by multiplying, not dividing. So the amount is $\frac{2}{3}\times\frac{3}{4}=\frac{6}{12}=\frac{1}{2}$ litre.'
          - problem: 'Sam works out $\frac{3}{4}\div\frac{2}{5}$ as $\frac{3}{4}\times\frac{2}{5}=\frac{3}{10}$. What is the correct value?'
            answer: '15/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam did not flip the divisor, so he multiplied by the wrong number. The correct work is $\frac{3}{4}\times\frac{5}{2}=\frac{15}{8}$.'
          - problem: 'Find $\frac{7}{10}\div\frac{2}{5}$.'
            answer: '7/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'To divide, multiply by the reciprocal of the divisor: $\frac{7}{10}\times\frac{5}{2}=\frac{35}{20}$. This simplifies to $\frac{7}{4}$.'
          - problem: 'Is $\frac{3}{4}\div\frac{1}{2}$ larger or smaller than $\frac{3}{4}$?'
            answer: 'larger'
            answer_contract: {"kind":"label","options":[["larger","it is larger","bigger","greater","more","larger than","larger than 3/4"],["smaller","it is smaller","less","lesser","smaller than"]]}
            solution_sketch: 'Dividing by a number less than $1$ gives a larger result. Here $\frac{3}{4}\div\frac{1}{2}=\frac{3}{2}$, which is larger than $\frac{3}{4}$.'
        constraints: "denominators up to 12"
      - id: kp3
        name: Dividing with whole numbers
        key_prerequisites: [multiplying-fractions]
        step_check:
          step: 'Rewrite the whole number as a fraction: 6 = 6/1.'
          question: 'Why can $6$ be written as $\frac{6}{1}$ without changing the problem?'
          options:
            - 'Putting $1$ underneath makes the whole number six times smaller'
            - 'Dividing $6$ by $1$ leaves $6$, so $\frac{6}{1}$ keeps its value'
            - 'Every whole number turns into its reciprocal when it is written so'
            - 'A whole number needs a denominator that matches the other fraction'
          answer: 'Dividing $6$ by $1$ leaves $6$, so $\frac{6}{1}$ keeps its value'
          why: 'A fraction bar means division, and $6\div1=6$. So $\frac{6}{1}$ is just another name for $6$, and now both numbers are fractions that the usual rule can handle.'
        exemplars:
          - problem: 'Find $\frac{3}{4}\div2$.'
            answer: '3/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $2$ as $\frac{2}{1}$. Then multiply by its reciprocal to get $\frac{3}{4}\times\frac{1}{2}=\frac{3}{8}$.'
          - problem: 'Find $5\div\frac{1}{3}$.'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply by the reciprocal of $\frac{1}{3}$: $5\times\frac{3}{1}=15$. Five wholes hold $15$ thirds.'
          - problem: 'Three cups share $\frac{5}{6}$ litre of water equally. How many litres does each cup get?'
            answer: '5/18'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Sharing equally means dividing by $3$. So one share is $\frac{5}{6}\div3=\frac{5}{6}\times\frac{1}{3}=\frac{5}{18}$ litre.'
          - problem: 'A rope is $8$ m long. How many pieces of length $\frac{2}{5}$ m can be cut from it?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of pieces is the number of times $\frac{2}{5}$ fits into $8$. So $8\div\frac{2}{5}=8\times\frac{5}{2}=20$ pieces.'
          - problem: 'Four friends share $\frac{2}{3}$ of a pizza equally. What fraction of the whole pizza does each friend get?'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sharing equally among four means dividing by $4$. So $\frac{2}{3}\times\frac{1}{4}=\frac{2}{12}=\frac{1}{6}$, and each friend gets $\frac{1}{6}$ of the pizza.'
          - problem: 'A bottle holds $\frac{3}{4}$ litre. How many litres are in $6$ bottles?'
            answer: '9/2'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Six equal bottles mean multiplying, not dividing. So the total is $6\times\frac{3}{4}=\frac{18}{4}=\frac{9}{2}$ litres.'
          - problem: 'Sam works out $4\div\frac{2}{3}$ as $4\times\frac{2}{3}$. What is the correct value of $4\div\frac{2}{3}$?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam did not flip the divisor, so he multiplied by the wrong number. The correct work is $4\times\frac{3}{2}=\frac{12}{2}=6$.'
          - problem: 'Find $6\div\frac{3}{4}$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'To divide by a fraction, multiply by the reciprocal of the divisor. So $6\times\frac{4}{3}=\frac{24}{3}=8$.'
          - problem: 'How many glasses of $\frac{3}{4}$ litre can be filled from $9$ litres of juice?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of glasses is the number of times $\frac{3}{4}$ fits into $9$. So $9\div\frac{3}{4}=9\times\frac{4}{3}=12$ glasses.'
        constraints: "one operand is a whole number"
    diagnostic_exemplar:
      problem: 'Compute $\frac{3}{5} \div 6$.'
      answer: '1/10'
      solution_sketch: 'The reciprocal of $6$ is $\frac{1}{6}$: $\frac{3}{5} \times \frac{1}{6} = \frac{3}{30} = \frac{1}{10}$.'
    anki_seeds:
      - front: "To divide by a fraction, multiply by its..."
        back: "reciprocal (flip the second fraction)"
        type: basic

