unit: fractions-decimals
course: foundations
module: "Fractions & Decimals"
topics:
  # --------------------------------------------------------------------- #
  # Fraction concepts
  # --------------------------------------------------------------------- #
  - id: fraction-basics
    name: Understanding Fractions
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: long-division-one-digit
        weight: 0.5
        key: true
      - id: place-value
        weight: 0.0            # conceptual-only: part-whole idea, no place-value practice
    knowledge_points:
      - id: kp1
        name: A fraction as part of a whole
        key_prerequisites: [long-division-one-digit]
        step_check:
          step: 'Write the marked count over the total count'
          question: 'Why does the marked count go on top and the total count on the bottom of $\frac{5}{9}$?'
          options:
            - 'The top number is the size of each equal part of the strip'
            - 'The number found first is always the one written on the bottom'
            - 'The bottom number says how many equal parts make the whole'
            - 'The bottom number counts the parts that are marked'
          answer: 'The bottom number says how many equal parts make the whole'
          why: 'The denominator names the equal parts in the whole and the numerator counts how many of them are marked, so $5$ marked parts of $9$ give $\frac{5}{9}$.'
        exemplars:
          - problem: 'In a strip of $8$ equal parts, $3$ parts are shaded. What fraction of the strip is shaded?'
            answer: '3/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The strip has $8$ equal parts, so the denominator is $8$. Three of them are shaded, so the numerator is $3$ and the fraction is $3/8$.'
          - problem: 'Write "two out of five" as a fraction.'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The words name $2$ parts out of $5$ equal parts. The selected count goes on top and the total on the bottom, giving $2/5$.'
          - problem: 'A strip has $11$ equal panels. Four are blank and the rest are coloured. What fraction of the strip is coloured?'
            answer: '7/11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coloured panels number $11-4=7$. They are $7$ of the $11$ equal panels, so the fraction is $7/11$.'
          - problem: 'A pizza is cut into $10$ equal slices. Lena eats $3$ slices and Omar eats $2$ slices. What fraction of the pizza is left?'
            answer: '5/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Together they eat $3+2=5$ slices, so $10-5=5$ slices are left. These are $5$ of the $10$ equal slices, so $5/10$ of the pizza is left.'
          - problem: 'A square grid has $3$ rows and $3$ columns of equal cells. The four corner cells are shaded. What fraction of the grid is shaded?'
            answer: '4/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The grid has $3\times3=9$ equal cells. Four of them are shaded, so $4/9$ of the grid is shaded.'
          - problem: 'Sam says that $2$ shaded parts out of $7$ equal parts make the fraction $\frac{7}{2}$. What is the correct fraction?'
            answer: '2/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The shaded parts are the selected count, so they go on top. The $7$ equal parts are the total, so they go on the bottom and the fraction is $2/7$.'
          - problem: 'A rectangle $8$ cm wide is cut by one vertical line, $3$ cm from its left edge, into two pieces. Is the left piece one half of the rectangle?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","yes it is","yes, it is","it is one half","one half"],["no","it is not","no it is not","no, it is not","not one half","it is not one half"]]}
            solution_sketch: 'A half needs two equal parts, each $4$ cm wide. The left piece is only $3$ cm wide, so it is $3/8$ of the rectangle and not one half.'
          - problem: 'A ribbon is cut into equal pieces. Three of the pieces are $\frac{3}{7}$ of the ribbon. Into how many equal pieces is the whole ribbon cut?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator of $\frac{3}{7}$ counts all the equal pieces in the whole ribbon. So the ribbon is cut into $7$ equal pieces.'
        constraints: "denominators 2-12"
      - id: kp2
        name: Fractions of a set
        key_prerequisites: [long-division-one-digit]
        step_check:
          step: 'Find the total number of shapes'
          question: 'Why must the hearts and the stars be added before the fraction of hearts is written?'
          options:
            - 'The bottom number counts every shape, not only hearts'
            - 'The bottom number is the number of stars in the set'
            - 'The top number must be the sum of both kinds of shape'
            - 'Both counts must be added so the fraction can be reduced'
          answer: 'The bottom number counts every shape, not only hearts'
          why: 'A fraction of a set compares one group with the whole set, so the denominator is the total $7+11=18$ and the hearts are the numerator.'
        exemplars:
          - problem: 'In a class of $20$ pupils, $9$ are boys. What fraction of the class are boys?'
            answer: '9/20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The whole class is $20$ pupils and the boys are $9$ of them. So the fraction of boys is $9/20$.'
          - problem: 'What fraction of a dozen eggs is $5$ eggs?'
            answer: '5/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A dozen is $12$ eggs, so the whole set has $12$ items. Five of them make $5/12$.'
          - problem: 'A tray holds $5$ red counters and $13$ blue counters. What fraction of all the counters is red?'
            answer: '5/18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The whole set is $5+13=18$ counters. Five of them are red, so the fraction is $5/18$.'
          - problem: 'A bag has $6$ green sweets, $4$ red sweets and $2$ yellow sweets. What fraction of the sweets is not green?'
            answer: '6/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bag holds $6+4+2=12$ sweets. The sweets that are not green are $4+2=6$, so the fraction is $6/12$.'
          - problem: 'In a garden of $24$ plants, $7$ are roses. What fraction of the plants are not roses?'
            answer: '17/24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The plants that are not roses number $24-7=17$. The whole garden has $24$ plants, so the fraction is $17/24$.'
          - problem: 'A team plays $15$ games. It wins $6$ games and loses $4$ games, and the other games are draws. What fraction of the games are draws?'
            answer: '5/15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The draws number $15-6-4=5$. They are $5$ of the $15$ games, so the fraction is $5/15$.'
          - problem: 'A box holds $3$ apples and $8$ pears. Sam says that $\frac{3}{8}$ of the fruit is apples. What is the correct fraction?'
            answer: '3/11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The whole set of fruit is $3+8=11$ pieces, not only the pears. The apples are $3$ of these $11$ pieces, so the fraction is $3/11$.'
          - problem: 'In a month of $30$ days it rains on $7$ days and snows on $2$ other days. On what fraction of the days is there neither rain nor snow?'
            answer: '21/30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Rain or snow falls on $7+2=9$ days. The other $30-9=21$ days are dry, so the fraction is $21/30$.'
        constraints: "whole numbers up to 30; do not require simplifying"
      - id: kp3
        name: Comparing simple fractions and the whole
        key_prerequisites: [long-division-one-digit]
        step_check:
          step: 'A larger denominator splits the same whole into more, smaller pieces'
          question: 'Why is $\frac{1}{9}$ a smaller piece than $\frac{1}{6}$ of the same whole?'
          options:
            - 'The number $9$ is larger, so the fraction $\frac{1}{9}$ is larger'
            - 'The numerators are equal, so both pieces have the same size'
            - 'Nine pieces take up more of the whole than six pieces do'
            - 'Cutting the same whole into more parts makes each part smaller'
          answer: 'Cutting the same whole into more parts makes each part smaller'
          why: 'The whole stays the same size, so splitting it into $9$ equal pieces leaves each piece smaller than when it is split into $6$ pieces.'
        try_first:
          problem: 'Mia cuts a cake into $6$ equal slices. Ben cuts an identical cake into $12$ equal slices. How many of Ben''s slices are as large as one of Mia''s slices?'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'A slice of Mia''s cake is $\frac{1}{6}$ of the cake and a slice of Ben''s is $\frac{1}{12}$, so $2$ of Ben''s slices fill one of Mia''s. The more slices a cake is cut into, the smaller each slice is.'
        exemplars:
          - problem: 'Which is larger, $\frac{1}{2}$ or $\frac{1}{3}$?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both fractions have numerator $1$, so compare the denominators. A whole cut into $2$ parts has larger parts than a whole cut into $3$ parts, so $1/2$ is larger.'
          - problem: 'A pizza is cut into $4$ equal slices and Mia eats all of the slices. What fraction of the pizza does she eat?'
            answer: '4/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each slice is $1/4$ of the pizza and she eats all $4$ slices. So she eats $4/4$ of the pizza, which is the whole pizza.'
          - problem: 'Two identical cakes are cut into quarters and sixths. Which fraction describes the smaller single slice?'
            answer: '1/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Six equal slices cut the same whole more finely than four equal slices. So a sixth is the smaller slice and the fraction is $1/6$.'
          - problem: 'Tom cuts a pie into $10$ equal pieces. Zoe cuts an identical pie into $8$ equal pieces. Each of them takes one piece. Who takes the larger piece?'
            answer: 'zoe'
            answer_contract: {"kind":"label","options":[["zoe","zoe takes the larger piece","zoe takes more"],["tom","tom takes the larger piece","tom takes more"]]}
            solution_sketch: 'Tom''s piece is $1/10$ of a pie and Zoe''s piece is $1/8$ of an identical pie. Eight pieces cut the pie more coarsely than ten pieces, so Zoe takes the larger piece.'
          - problem: 'Which is smaller, $\frac{1}{8}$ or $\frac{1}{5}$?'
            answer: '1/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both fractions have numerator $1$, so compare the denominators $8$ and $5$. The larger denominator $8$ cuts the whole into smaller pieces, so $1/8$ is smaller.'
          - problem: 'A jug holds $6$ equal cups when it is full. Ana pours in $4$ cups. What fraction of the full jug is still empty?'
            answer: '2/6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The jug has $6$ equal cups and $4$ are filled, so $6-4=2$ cups are empty. These are $2$ of the $6$ cups, so $2/6$ of the jug is empty.'
          - problem: 'Sam says that $\frac{1}{10}$ is larger than $\frac{1}{4}$ because $10$ is larger than $4$. Which of the two fractions is really the larger one?'
            answer: '1/4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A whole cut into $4$ equal parts has larger parts than the same whole cut into $10$ parts. So $1/4$ is the larger fraction.'
        constraints: "unit fractions or the whole; denominators 2-10"
    diagnostic_exemplar:
      problem: 'If $7$ of $10$ equal squares are shaded, what fraction is shaded?'
      answer: "7/10"
      solution_sketch: 'Shaded parts over total parts: $\frac{7}{10}$.'
    anki_seeds:
      - front: "In the fraction a/b, the top number a is the {{c1::numerator}} and the bottom number b is the {{c2::denominator}}."
        back: "numerator; denominator"
        type: cloze

  - id: fractions-on-number-line
    name: Fractions on the Number Line
    core: true
    difficulty: 0.22
    drill: false
    answer_kind: expression
    expected_time_secs: 50
    prerequisites:
      - id: fraction-basics
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        visuals: [{"kind":"number_line","min":"0","max":"1","tick":"1/5","points":[{"at":"2/5","label":"P","filled":true}],"intervals":[],"caption":"Reference example: Point P represents 2/5. Each unit is divided into 5 equal parts."},{"kind":"fraction","parts":5,"shaded":2,"shape":"bar","caption":"Reference example: 2 shaded parts of size 1/5."}]
        name: Reading fractions between 0 and 1
        key_prerequisites: [fraction-basics]
        step_check:
          step: 'seven steps less two steps is five steps'
          question: 'Why is the distance from $A$ to $B$ found by subtracting the step counts?'
          options:
            - 'Distances on a number line are found by adding the two positions together'
            - 'Both points count from $0$ in steps of $\frac{1}{9}$, so $7-2$ steps separate them'
            - 'The distance is the larger position divided by the smaller one, $7 \div 2$'
            - 'The distance is the count of all tick marks drawn from $0$ up to the point $B$ itself'
          answer: 'Both points count from $0$ in steps of $\frac{1}{9}$, so $7-2$ steps separate them'
          why: '$A$ and $B$ share the starting point $0$ and the step size $\frac{1}{9}$, so the gap is $\frac{7}{9}-\frac{2}{9}=\frac{5}{9}$.'
        exemplars:
          - problem: 'A number line from $0$ to $1$ is divided into $4$ equal parts. What fraction sits at the third tick mark after $0$?'
            answer: "3/4"
            solution_sketch: 'Each tick is $\frac{1}{4}$; the third tick after $0$ is $\frac{3}{4}$.'
          - problem: 'On a number line marked in sixths from $0$ to $1$, point $P$ is one tick to the left of $1$. What fraction labels $P$?'
            answer: "5/6"
            solution_sketch: 'One whole is $6/6$. Move left one sixth: $6/6-1/6=5/6$.'
          - problem: 'Point $P$ is halfway between $1/4$ and $1/2$ on a number line marked in eighths. What fraction labels $P$?'
            answer: "3/8"
            solution_sketch: 'The endpoints are $2/8$ and $4/8$. The intervening tick is $3/8$.'
          - problem: 'On a number line marked in tenths, start at $1/2$ and move two ticks right. What fraction do you reach?'
            answer: "7/10"
            solution_sketch: 'Start at $1/2=5/10$; two more tenths give $5/10+2/10=7/10$.'
          - problem: 'A number line from $0$ to $1$ is divided into $8$ equal parts. Point $A$ is at the third tick after $0$ and point $B$ is at the seventh. How far apart are $A$ and $B$?'
            answer: "1/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each tick is $\frac{1}{8}$, and $B$ is $7-3=4$ ticks beyond $A$. The distance is $\frac{4}{8}=\frac{1}{2}$.'
          - problem: 'On a number line from $0$ to $1$ marked in fifths, point $Q$ is two ticks to the left of $1$. What fraction labels $Q$?'
            answer: "3/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One whole is $\frac{5}{5}$. Two ticks to the left is $\frac{5}{5}-\frac{2}{5}=\frac{3}{5}$.'
        constraints: "denominators 2-10, fractions between 0 and 1"
      - id: kp2
        visuals: [{"kind":"number_line","min":"0","max":"3","tick":"1/3","points":[{"at":"8/3","label":"P","filled":true}],"intervals":[],"caption":"Reference example: Point P represents 8/3. Each unit is divided into 3 equal parts."},{"kind":"fraction","parts":3,"shaded":8,"shape":"bar","caption":"Reference example: 8 shaded parts of size 1/3."}]
        name: Locating fractions greater than one
        key_prerequisites: [fraction-basics]
        step_check:
          step: 'A tick strictly between them has a numerator strictly between $24$ and $30$.'
          question: 'Why must the numerator lie strictly between $24$ and $30$?'
          options:
            - 'A numerator must be a multiple of $6$ for the fraction to land on a tick'
            - 'Every fraction greater than $4$ has a numerator greater than $30$'
            - 'A tick between two whole numbers must have a numerator below $6$'
            - 'With the same denominator, a larger numerator lies farther to the right'
          answer: 'With the same denominator, a larger numerator lies farther to the right'
          why: 'All the ticks count sixths from $0$, so the ticks between $\frac{24}{6}=4$ and $\frac{30}{6}=5$ have numerators from $25$ to $29$.'
        exemplars:
          - problem: '$\frac{7}{4}$ lies between two consecutive whole numbers. What is the smaller one?'
            answer: "1"
            solution_sketch: '$\frac{4}{4} = 1$ and $\frac{8}{4} = 2$; $\frac{7}{4}$ is between them, so the smaller is $1$.'
          - problem: 'On a number line marked in thirds, start at $3$ and move two ticks right. What number do you reach?'
            answer: "11/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three wholes are $\frac{9}{3}$. Two more thirds give $\frac{11}{3}$, which is $3\frac{2}{3}$.'
          - problem: 'What number lies one fifth to the left of $2$ on a number line?'
            answer: "9/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $2$ as $\frac{10}{5}$. One fifth less is $\frac{9}{5}$, which is $1\frac{4}{5}$.'
          - problem: 'On a number line marked in sixths, which tick lies halfway between $2$ and $2\frac{1}{3}$?'
            answer: "13/6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In sixths the endpoints are $\frac{12}{6}$ and $\frac{14}{6}$. The tick halfway between them is $\frac{13}{6}$, or $2\frac{1}{6}$.'
          - problem: '$\frac{17}{5}$ lies between two consecutive whole numbers. What is the larger one?'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three is $\frac{15}{5}$ and four is $\frac{20}{5}$. Since $15<17<20$, $\frac{17}{5}$ lies between $3$ and $4$, so the larger one is $4$.'
          - problem: 'On a number line marked in fifths, point $A$ is at $\frac{8}{5}$ and point $B$ is at $\frac{14}{5}$. How far apart are they?'
            answer: "6/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both points count fifths from $0$, so they are $14-8=6$ ticks apart. The distance is $\frac{6}{5}$, or $1\frac{1}{5}$.'
        constraints: "improper fractions with denominators 2-6"
      - id: kp3
        visuals: [{"kind":"number_line","min":"0","max":"4","tick":"1/3","points":[{"at":"12/3","label":"P","filled":true}],"intervals":[],"caption":"Reference example: Point P represents 12/3. Each unit is divided into 3 equal parts."},{"kind":"fraction","parts":3,"shaded":12,"shape":"bar","caption":"Reference example: 12 shaded parts of size 1/3."}]
        name: Whole numbers as fractions
        key_prerequisites: [fraction-basics]
        step_check:
          step: 'The division is exact, so the tick falls on a whole unit'
          question: 'Why does the tick $\frac{45}{9}$ land exactly on a whole number?'
          options:
            - '$45$ is a multiple of $9$, so the intervals fill complete units'
            - 'Any fraction whose numerator is larger than its denominator is whole'
            - 'Both $45$ and $9$ are odd, so their quotient is a whole number'
            - 'The numerator $45$ ends in $5$, so the tick falls on a whole unit'
          answer: '$45$ is a multiple of $9$, so the intervals fill complete units'
          why: '$45=5\times9$, so forty-five ninths fill exactly five units; $\frac{47}{9}$ also has a numerator above its denominator but lands between $5$ and $6$.'
        exemplars:
          - problem: 'How many thirds make $2$?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each whole contains $3$ thirds. Two wholes contain $2\times3=6$ thirds, so $2=\frac{6}{3}$.'
          - problem: 'A number line has five equal steps per unit. How many fifth-sized steps from $0$ reach $3$?'
            answer: "15"
            solution_sketch: 'Each of the three units contains five steps, so $3\times5=15$ steps.'
          - problem: 'On a number line marked in sevenths, a tick is labelled $\frac{21}{7}$. Which whole number is at that tick?'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Seven sevenths make one whole. Since $21\div7=3$, the tick $\frac{21}{7}$ is the whole number $3$.'
          - problem: 'Fill in the box: $5=\frac{\square}{8}$.'
            answer: "40"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each whole is $\frac{8}{8}$. Five wholes are $5\times8=40$ eighths, so $5=\frac{40}{8}$.'
          - problem: "A jug is filled with quarter-cup scoops. How many scoops fill 3 cups?"
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Each cup holds 4 quarter-cup scoops. Multiply 3 cups by 4 scoops per cup to reach 12 scoops. The answer is 12."
          - problem: 'On a number line marked in quarters, how many ticks from $0$ is the number $6$?'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each whole unit holds $4$ quarter-ticks. Six units hold $6\times4=24$ ticks, so $6=\frac{24}{4}$.'
        constraints: "denominators 2-10"
    diagnostic_exemplar:
      problem: 'A number line from $0$ to $3$ is divided into thirds. What fraction sits at the seventh tick mark after $0$?'
      answer: '7/3'
      solution_sketch: 'Each tick is $\frac{1}{3}$, so the seventh is $\frac{7}{3}$, which lies between $2$ and $3$.'
    anki_seeds:
      - front: "On the number line, the fraction a/b means..."
        back: "a steps of size 1/b starting from 0"
        type: basic

  - id: equivalent-fractions
    name: Equivalent Fractions
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: fraction-basics
        weight: 0.8
        key: true
      - id: multiplication-tables
        weight: 0.6
        key: true
      - id: greatest-common-factor
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Scaling up
        key_prerequisites: [multiplication-tables]
        step_check:
          step: 'Multiply numerator and denominator by $5$'
          question: 'Why does multiplying both $3$ and $5$ by $5$ leave the value of $\frac{3}{5}$ unchanged?'
          options:
            - 'Multiplying by $5$ makes the fraction five times as large'
            - 'The same number of equal parts is added to the top and bottom'
            - 'Only the denominator decides the size of a fraction'
            - 'Every piece is cut into $5$ smaller ones, so the share stays'
          answer: 'Every piece is cut into $5$ smaller ones, so the share stays'
          why: 'Cutting every piece into $5$ smaller ones gives $5$ times as many parts in the whole and $5$ times as many selected parts, so the share is the same: $\frac{3}{5}=\frac{15}{25}$.'
        exemplars:
          - problem: 'Find the number that makes the fractions equal: $\frac{2}{3}=\frac{\square}{9}$.'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $3$ is multiplied by $3$ to give $9$. The numerator must be multiplied by $3$ as well, so the missing number is $2\times3=6$.'
          - problem: 'A strip is cut into $5$ equal parts, and each part is then cut into $3$ equal small pieces. Three of the original parts are shaded. How many small pieces are shaded?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The strip has $5\times3=15$ small pieces. Each shaded part holds $3$ small pieces, so $3\times3=9$ pieces are shaded and $3/5=9/15$.'
          - problem: 'Find the number that makes the fractions equal: $\frac{4}{7}=\frac{20}{\square}$.'
            answer: '35'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator $4$ is multiplied by $5$ to give $20$. The denominator must be multiplied by $5$ as well, so the missing number is $7\times5=35$.'
          - problem: 'A number line is marked in sixths. A second number line of the same length is marked in twenty-fourths. What numerator labels the point that was at $\frac{5}{6}$?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each sixth holds $24\div6=4$ twenty-fourths. So $5/6$ is $5\times4=20$ twenty-fourths and the label is $20/24$.'
          - problem: 'A recipe needs $\frac{2}{3}$ of a litre of juice. The carton is marked in twelfths of a litre. How many twelfths of a litre is that?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One third holds $12\div3=4$ twelfths. So $2/3$ is $2\times4=8$ twelfths of a litre.'
          - problem: 'Sam writes $\frac{3}{4}=\frac{12}{20}$. The numerator $12$ is wrong. What number should replace $12$?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator $4$ is multiplied by $5$ to give $20$. The numerator must be multiplied by $5$ too, so it is $3\times5=15$, not $12$.'
          - problem: 'Is $\frac{5}{8}$ equal to $\frac{15}{24}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","they are equal","equal","yes they are","yes, they are"],["no","they are not equal","not equal","no they are not","no, they are not"]]}
            solution_sketch: 'The denominator $8$ is multiplied by $3$ to give $24$. Multiplying $5$ by $3$ gives $15$, so the fractions are equal.'
          - problem: 'A fraction changes from $\frac{3}{8}$ to $\frac{21}{56}$ when its numerator and denominator are multiplied by the same number. What is that number?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator goes from $8$ to $56$, so the factor is $56\div8=7$. A check on the numerator gives $3\times7=21$.'
        constraints: "target denominator is a small multiple of the original"
      - id: kp2
        name: Simplifying to lowest terms
        key_prerequisites: [greatest-common-factor]
        step_check:
          step: 'Divide the numerator by the GCF'
          question: 'Why is the value of $\frac{12}{30}$ unchanged when $12$ and $30$ are both divided by $6$?'
          options:
            - 'Dividing makes the fraction smaller, but it is still called equal'
            - 'The GCF is the only number that keeps the value the same'
            - 'Both parts shrink by the same factor, so the share is kept'
            - 'The numerator is divided by $6$ and the denominator is left alone'
          answer: 'Both parts shrink by the same factor, so the share is kept'
          why: 'Grouping the parts into sixes gives $2$ groups out of $5$ groups, the same share as $12$ out of $30$, so $\frac{12}{30}=\frac{2}{5}$.'
        exemplars:
          - problem: 'Simplify $\frac{6}{9}$.'
            answer: '2/3'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The GCF of $6$ and $9$ is $3$. Dividing both numbers by $3$ gives $2/3$.'
          - problem: 'Ten of the $25$ counters in a box are blue. What fraction of the counters are blue? Simplify the fraction.'
            answer: '2/5'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The fraction of blue counters is $10/25$. The GCF of $10$ and $25$ is $5$, so the simplified fraction is $2/5$.'
          - problem: 'Simplify $\frac{9}{21}$.'
            answer: '3/7'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The GCF of $9$ and $21$ is $3$. Dividing both numbers by $3$ gives $3/7$, and $3$ and $7$ share no factor above $1$.'
          - problem: 'Sam simplifies $\frac{18}{24}$ to $\frac{9}{12}$ and stops. What is the fully simplified fraction?'
            answer: '3/4'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The numbers $9$ and $12$ still share the factor $3$. Dividing both by $3$ gives $3/4$, and now no common factor above $1$ is left.'
          - problem: 'Of the $45$ pupils in a year group, $35$ walk to school. What fraction of the pupils walk? Simplify the fraction.'
            answer: '7/9'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The fraction is $35/45$. The GCF of $35$ and $45$ is $5$, so the simplified fraction is $7/9$.'
          - problem: 'Is $\frac{14}{35}$ in lowest terms?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","yes it is","yes, it is"],["no","it is not","no it is not","no, it is not"]]}
            solution_sketch: 'The numbers $14$ and $35$ share the factor $7$. So the fraction can be divided further to $2/5$ and is not in lowest terms.'
          - problem: 'A board is $64$ cm long and $24$ cm of it is painted. What fraction of the board is painted? Simplify the fraction.'
            answer: '3/8'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The painted part is $24/64$ of the board. The GCF of $24$ and $64$ is $8$, so the simplified fraction is $3/8$.'
        constraints: "numerator and denominator up to 30"
      - id: kp3
        name: Larger GCFs and comparing
        key_prerequisites: [greatest-common-factor]
        step_check:
          step: 'Divide the denominator by the GCF'
          question: 'Why must $45$ be divided by $15$ when $30$ has been divided by $15$?'
          options:
            - 'Dividing only the top would change the value of the fraction'
            - 'Both results must end in the same digit as the originals'
            - 'The GCF only divides evenly into the larger number'
            - 'The simplified fraction needs a smaller denominator than numerator'
          answer: 'Dividing only the top would change the value of the fraction'
          why: 'Both parts must change by the same factor to keep the share equal: $\frac{30}{15}\Big/\frac{45}{15}=\frac{2}{3}$, which is the value of $\frac{30}{45}$.'
        exemplars:
          - problem: 'Simplify $\frac{24}{36}$.'
            answer: '2/3'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The GCF of $24$ and $36$ is $12$. Dividing both numbers by $12$ gives $2/3$.'
          - problem: 'Simplify $\frac{45}{60}$.'
            answer: '3/4'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Write $45=3\times3\times5$ and $60=2\times2\times3\times5$. The common factor is $3\times5=15$, so dividing both by $15$ gives $3/4$.'
          - problem: 'Find the number that makes the fractions equal: $\frac{18}{24}=\frac{\square}{36}$.'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fraction $18/24$ simplifies to $3/4$ by dividing by $6$. Then $36\div4=9$, so the numerator is $3\times9=27$.'
          - problem: 'Find the number that makes the fractions equal: $\frac{24}{36}=\frac{20}{\square}$.'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fraction $24/36$ simplifies to $2/3$ by dividing by $12$. Then $20\div2=10$, so the denominator is $3\times10=30$.'
          - problem: 'In a league of $84$ players, $36$ come from the home city. What fraction of the players are from the home city? Simplify the fraction.'
            answer: '3/7'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The fraction is $36/84$. The GCF of $36$ and $84$ is $12$, so the simplified fraction is $3/7$.'
          - problem: 'A tank holds $90$ litres when it is full. It now holds $54$ litres of water. What fraction of the tank is full? Simplify the fraction.'
            answer: '3/5'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The tank is $54/90$ full. The GCF of $54$ and $90$ is $18$, so the simplified fraction is $3/5$.'
          - problem: 'Sam simplifies $\frac{16}{40}$ by dividing the top by $4$ and the bottom by $8$. He gets $\frac{4}{5}$. What is the correct simplified fraction?'
            answer: '2/5'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Both parts must be divided by the same number. The GCF of $16$ and $40$ is $8$, so the correct fraction is $2/5$.'
          - problem: 'Are $\frac{28}{42}$ and $\frac{30}{45}$ equal?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","they are equal","equal","yes they are","yes, they are"],["no","they are not equal","not equal","no they are not","no, they are not"]]}
            solution_sketch: 'Dividing $28$ and $42$ by $14$ gives $2/3$. Dividing $30$ and $45$ by $15$ also gives $2/3$, so the fractions are equal.'
        constraints: "values up to 60"
    diagnostic_exemplar:
      problem: 'Write $\frac{36}{54}$ as an equivalent fraction with denominator $9$.'
      answer: '6/9'
      solution_sketch: '$\frac{36}{54} = \frac{2}{3}$ (divide by $18$), and $\frac{2}{3} = \frac{6}{9}$.'
    anki_seeds:
      - front: "To make an equivalent fraction, multiply or divide the numerator and denominator by..."
        back: "the same nonzero number"
        type: basic
      - front: "A fraction is in lowest terms when the GCF of its numerator and denominator is..."
        back: "1"
        type: basic

  - id: comparing-ordering-fractions
    name: Comparing and Ordering Fractions
    core: false                # comparison destination; the fraction machinery stays core
    difficulty: 0.3
    drill: false
    answer_kind: expression
    expected_time_secs: 70
    prerequisites:
      - id: equivalent-fractions
        weight: 0.9
        key: true
      - id: least-common-multiple
        weight: 0.6
        key: true
      - id: fractions-on-number-line
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Same denominator or same numerator
        key_prerequisites: [fractions-on-number-line]
        try_first:
          problem: 'Is $\frac{3}{7}$ of a pizza more than $\frac{3}{8}$ of the same pizza?'
          answer_contract: {"kind":"label","options":[["yes","it is","it is more"],["no","it is not","it is less"]]}
          answer: 'yes'
          reveal: 'Yes: both are three pieces, but a seventh is a bigger piece than an eighth, so $\frac{3}{7}>\frac{3}{8}$. With equal numerators, the smaller denominator gives the larger fraction.'
        step_check:
          step: 'A sixth is the larger piece.'
          question: 'Why is a sixth of a cup larger than a twelfth of a cup?'
          options:
            - 'A larger denominator always means a larger piece of the cup'
            - 'Both amounts have numerator five, so the pieces are the same size'
            - 'The cup is split into fewer equal parts, so each part is bigger'
            - 'Twelve is the larger number, so a twelfth is the larger amount'
          answer: 'The cup is split into fewer equal parts, so each part is bigger'
          why: 'Splitting the same cup into $6$ parts instead of $12$ makes each part twice as large, so $\frac{1}{6}>\frac{1}{12}$.'
        exemplars:
          - problem: 'Which is larger, $\frac{3}{8}$ or $\frac{5}{8}$?'
            answer: "5/8"
            solution_sketch: 'Same denominator: compare numerators, $5 > 3$.'
          - problem: 'Two strips of the same length are cut, one into fifths and one into sevenths. Which is longer, $\frac{2}{5}$ of a strip or $\frac{2}{7}$ of a strip?'
            answer: "2/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A fifth is longer than a seventh, because the strip is cut into fewer pieces. Two pieces of each, so $\frac{2}{5}$ of a strip is longer than $\frac{2}{7}$.'
          - problem: 'Two walkers leave the same gate. One walks $\frac{5}{12}$ km and the other walks $\frac{5}{8}$ km. Which distance is shorter?'
            answer: "5/12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both distances are five equal parts of a kilometre, and a twelfth is smaller than an eighth. So $\frac{5}{12}$ km is the shorter distance.'
          - problem: 'Give a fraction between $\frac{3}{8}$ and $\frac{5}{8}$.'
            answer: "1/2"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "3/8", "high": "5/8"}}
            solution_sketch: 'With equal denominators, compare numerators: $\frac{4}{8} = \frac{1}{2}$ has numerator $4$, between $3$ and $5$. Writing both in sixteenths gives more choices: $\frac{7}{16}$ and $\frac{9}{16}$ also lie between $\frac{6}{16}$ and $\frac{10}{16}$.'
          - problem: 'Find a fraction between $\frac{1}{4}$ and $\frac{1}{3}$.'
            answer: "2/7"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "1/4", "high": "1/3"}}
            solution_sketch: 'The numerators match, so make them larger: $\frac{1}{4} = \frac{2}{8}$ and $\frac{1}{3} = \frac{2}{6}$. A denominator between $6$ and $8$ gives $\frac{2}{7}$, which lies between them. In twenty-fourths, $\frac{6}{24} < \frac{7}{24} < \frac{8}{24}$ works too.'
          - problem: 'Three litres of juice are shared equally among either $4$ people or $10$ people. Which share is smaller, $\frac{3}{4}$ litre or $\frac{3}{10}$ litre?'
            answer: "3/10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'More people means each share is smaller. The share for $10$ people, $\frac{3}{10}$ litre, is smaller than $\frac{3}{4}$ litre.'
        constraints: "denominators up to 12"
      - id: kp2
        name: Comparing with common denominators
        key_prerequisites: [least-common-multiple]
        step_check:
          step: '$5/8=15/24$ and $7/12=14/24$.'
          question: 'Why can $5/8$ and $7/12$ be compared by comparing $15$ and $14$?'
          options:
            - 'Both are now counted in twenty-fourths, pieces of the same size'
            - 'Multiplying top and bottom by $3$ and $2$ makes both fractions bigger'
            - 'The fraction with the larger denominator is always the smaller one'
            - 'Only the numerators matter, so $5$ and $7$ could be compared too'
          answer: 'Both are now counted in twenty-fourths, pieces of the same size'
          why: 'Once both fractions use the same unit, $\frac{1}{24}$, the one with more pieces is larger; rewriting changes the names of the fractions, not their values.'
        exemplars:
          - problem: 'Which is larger, $\frac{2}{3}$ or $\frac{3}{5}$?'
            answer: "2/3"
            solution_sketch: '$\frac{2}{3} = \frac{10}{15}$ and $\frac{3}{5} = \frac{9}{15}$.'
          - problem: 'On a number line, one point is at $\frac{5}{6}$ and another is at $\frac{7}{9}$. Which point is farther from $0$?'
            answer: "5/6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In eighteenths, $\frac{5}{6} = \frac{15}{18}$ and $\frac{7}{9} = \frac{14}{18}$. So the point at $\frac{5}{6}$ is farther from $0$.'
          - problem: 'One jug is $\frac{3}{4}$ full and an identical jug is $\frac{5}{7}$ full. How full is the fuller jug?'
            answer: "3/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Over $28$ the fractions are $\frac{21}{28}$ and $\frac{20}{28}$. Since $21>20$, the fuller jug is $\frac{3}{4}$ full.'
          - problem: 'Give a fraction that is greater than $\frac{3}{5}$ but less than $\frac{2}{3}$.'
            answer: "19/30"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "3/5", "high": "2/3"}}
            solution_sketch: 'Over $15$ the two are $\frac{9}{15}$ and $\frac{10}{15}$, with no fifteenth between them, so use thirtieths: $\frac{18}{30} < \frac{19}{30} < \frac{20}{30}$. A decimal such as $0.65$ also works, since $\frac{3}{5} = 0.6$ and $\frac{2}{3} = 0.666\ldots$.'
          - problem: 'Find a fraction between $\frac{2}{5}$ and $\frac{1}{2}$.'
            answer: "9/20"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "2/5", "high": "1/2"}}
            solution_sketch: 'Over $10$ the two are $\frac{4}{10}$ and $\frac{5}{10}$, which are neighbours, so double again: $\frac{8}{20} < \frac{9}{20} < \frac{10}{20}$. Any value strictly between $0.4$ and $0.5$, such as $\frac{4}{9}$ or $0.45$, also works; $\frac{1}{2}$ itself does not.'
          - problem: 'Which is smaller, $\frac{4}{9}$ or $\frac{5}{12}$?'
            answer: "5/12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Over $36$ the fractions are $\frac{16}{36}$ and $\frac{15}{36}$. Since $15<16$, $\frac{5}{12}$ is smaller.'
        constraints: "unlike denominators up to 12"
      - id: kp3
        name: Ordering and benchmark comparisons
        key_prerequisites: [equivalent-fractions]
        step_check:
          step: 'Double the numerator: 2 x 3 = 6.'
          question: 'Why does doubling the numerator help compare $3/7$ with $1/2$?'
          options:
            - 'Doubling the numerator turns $3/7$ into an equal fraction, $6/7$, to compare'
            - 'The fraction with the larger numerator is always the larger of the two fractions'
            - 'Doubling $3$ gives $6$, and $6/7$ is close to $1$, so $3/7$ must be above $1/2$'
            - 'A fraction equals $1/2$ exactly when twice its numerator equals the denominator'
          answer: 'A fraction equals $1/2$ exactly when twice its numerator equals the denominator'
          why: 'Half of $7$ is $3.5$, so $3/7<1/2$ exactly when $2\times3<7$; doubling only the numerator gives $6/7$, which is a different number.'
        exemplars:
          - problem: 'Order from least to greatest: $\frac{1}{2}$, $\frac{3}{8}$, $\frac{5}{8}$.'
            answer: "3/8, 1/2, 5/8"
            solution_sketch: 'Over $8$: $\frac{3}{8} < \frac{4}{8} < \frac{5}{8}$.'
          - problem: 'Which is greater, $\frac{5}{9}$ or $\frac{1}{2}$?'
            answer: "5/9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Half of $9$ is $4.5$, and the numerator $5$ is more than that. So $\frac{5}{9}$ is more than $\frac{1}{2}$.'
          - problem: 'Which of $\frac{1}{3}$, $\frac{5}{12}$ and $\frac{1}{4}$ lies between the other two?'
            answer: "1/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In twelfths the numbers are $\frac{4}{12}$, $\frac{5}{12}$ and $\frac{3}{12}$. The middle one is $\frac{4}{12}=\frac{1}{3}$.'
          - problem: 'Find a fraction less than $1$ that is closer to $1$ than to $\frac{1}{2}$.'
            answer: "5/6"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "3/4", "high": "1"}}
            solution_sketch: 'Halfway between $\frac{1}{2}$ and $1$ is $\frac{3}{4}$, so any fraction strictly between $\frac{3}{4}$ and $1$ is closer to $1$: $\frac{5}{6}$, $\frac{7}{8}$, $\frac{9}{10}$, and so on. For $\frac{5}{6}$: it is $\frac{1}{6}$ below $1$ and $\frac{1}{3}$ above $\frac{1}{2}$.'
          - problem: 'Give a fraction that lies between $\frac{5}{9}$ and $\frac{4}{7}$.'
            answer: "9/16"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "5/9", "high": "4/7"}}
            solution_sketch: 'Cross-multiplying shows $\frac{5}{9} < \frac{4}{7}$, since $35 < 36$. Over $63$ they are $\frac{35}{63}$ and $\frac{36}{63}$, neighbours, so use $126$ths: $\frac{71}{126}$ lies between. Adding the numerators and the denominators also works: $\frac{5 + 4}{9 + 7} = \frac{9}{16}$ always lies between the two.'
          - problem: 'Order from least to greatest: $\frac{7}{12}$, $\frac{2}{5}$, $\frac{1}{2}$.'
            answer: "2/5, 1/2, 7/12"
            answer_contract: {"kind":"list","ordered":true,"member":{"kind":"exact"}}
            solution_sketch: 'Use the benchmark $\frac{1}{2}$: $\frac{2}{5}$ is less than half because $2\times2<5$, and $\frac{7}{12}$ is more than half because $2\times7>12$. The order is $\frac{2}{5}$, $\frac{1}{2}$, $\frac{7}{12}$.'
          - problem: 'A tank is $\frac{4}{7}$ full. How much more of the tank is full than empty?'
            answer: "1/7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The empty part is $1 - \frac{4}{7} = \frac{3}{7}$. The full part is larger by $\frac{4}{7} - \frac{3}{7} = \frac{1}{7}$, so the tank is just over half full.'
        constraints: "3 fractions or a benchmark of 1/2 or 1"
    diagnostic_exemplar:
      problem: 'Order from least to greatest: $\frac{2}{3}$, $\frac{5}{8}$, $\frac{3}{4}$.'
      answer: '5/8, 2/3, 3/4'
      solution_sketch: 'Over $24$: $\frac{16}{24}$, $\frac{15}{24}$, $\frac{18}{24}$.'
    anki_seeds:
      - front: "With the same numerator, the fraction with the smaller denominator is..."
        back: "larger (fewer pieces means bigger pieces)"
        type: basic
      - front: "Benchmark test: a/b is greater than 1/2 exactly when..."
        back: "2a > b"
        type: basic

  # --------------------------------------------------------------------- #
  # Fraction arithmetic
  # --------------------------------------------------------------------- #
  - id: adding-subtracting-like-fractions
    name: Adding and Subtracting Like Fractions
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: fraction-basics
        weight: 0.9
        key: true
      - id: equivalent-fractions
        weight: 0.5
      - id: subtraction-facts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Adding with like denominators
        key_prerequisites: [fraction-basics]
        step_check:
          step: 'Keep the denominator the same'
          question: 'Why does the denominator stay $6$ when $\frac{2}{6}$ and $\frac{3}{6}$ are added?'
          options:
            - 'The denominator only changes when the sum is more than $1$'
            - 'The pieces are still sixths; only how many of them grows'
            - 'A fraction has one denominator, so the larger one is kept'
            - 'The sum $2+3=5$ has already used up the denominators'
          answer: 'The pieces are still sixths; only how many of them grows'
          why: 'Both fractions count pieces of the same size, sixths, so adding them counts $2+3=5$ sixths in all and the size of the piece does not change.'
        exemplars:
          - problem: 'Find $\frac{1}{5}+\frac{2}{5}$.'
            answer: '3/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both fractions count fifths, so add the numbers of fifths. $1+2=3$ fifths, which is $3/5$.'
          - problem: 'Anna eats $\frac{2}{9}$ of a cake and Ben eats $\frac{4}{9}$ of the same cake. What fraction of the cake do they eat together?'
            answer: '6/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both parts are ninths of the same cake. Together they eat $2+4=6$ ninths, which is $6/9$ of the cake.'
          - problem: 'Two ribbon pieces are $\frac{3}{11}$ m and $\frac{5}{11}$ m long. They are joined end to end. How long is the joined ribbon?'
            answer: '8/11'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Both lengths are counted in elevenths of a metre. So the joined ribbon is $(3+5)/11=8/11$ m long.'
          - problem: 'A mosaic has nine equal cells. Four cells are blue and three cells are red. What fraction of the cells is blue or red?'
            answer: '7/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'No cell is both blue and red, so the counts add: $4+3=7$ cells. They are $7$ of the $9$ cells, so the fraction is $7/9$.'
          - problem: 'A bug sits at $\frac{1}{8}$ on a number line marked in eighths. It hops $5$ eighths to the right. Where does it land?'
            answer: '6/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bug moves from the mark $1/8$ by $5$ more eighths. It lands at $(1+5)/8=6/8$.'
          - problem: 'A tank is $\frac{3}{10}$ full. A shower fills another $\frac{4}{10}$ of the tank. What fraction of the tank is full now?'
            answer: '7/10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both amounts are tenths of the same tank. Together they make $3+4=7$ tenths, so $7/10$ of the tank is full.'
          - problem: 'Sam adds $\frac{2}{7}+\frac{3}{7}$ and writes $\frac{5}{14}$. What is the correct sum?'
            answer: '5/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only the numerators are added, because the pieces stay sevenths. So $2+3=5$ and the sum is $5/7$, not $5/14$.'
          - problem: 'Lena reads $\frac{3}{12}$ of a book on Monday and $\frac{5}{12}$ of it on Tuesday. What fraction of the book has she read?'
            answer: '8/12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both amounts are twelfths of the same book. Together she has read $3+5=8$ twelfths, which is $8/12$ of the book.'
        constraints: "same denominator up to 12; sum less than 1, no simplifying needed"
      - id: kp2
        name: Subtracting with like denominators
        key_prerequisites: [subtraction-facts]
        step_check:
          step: 'Subtract the numerators'
          question: 'Why is only the numerator of $\frac{9}{12}$ changed when $\frac{3}{12}$ is taken away?'
          options:
            - 'Twelfths are the unit, so $3$ are taken from $9$ twelfths'
            - 'The denominators are subtracted too, but $12-12$ is left out'
            - 'The top number tells the size of each piece, so it must change'
            - 'Subtracting fractions only works when the answer is one half'
          answer: 'Twelfths are the unit, so $3$ are taken from $9$ twelfths'
          why: 'The pieces are all twelfths, so taking away $3$ of them leaves $9-3=6$ twelfths and the size of the piece stays the same.'
        exemplars:
          - problem: 'Find $\frac{7}{9}-\frac{4}{9}$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both fractions count ninths, so subtract the numbers of ninths. $7-4=3$ ninths, which is $3/9=1/3$.'
          - problem: 'A bottle holds $\frac{9}{10}$ litre of juice. Ana pours out $\frac{3}{10}$ litre. How much juice is left in the bottle?'
            answer: '3/5'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'The amounts are counted in tenths of a litre. So $9-3=6$ tenths are left, which is $6/10=3/5$ litre.'
          - problem: 'A hiker has walked $\frac{5}{12}$ of a trail and her friend has walked $\frac{11}{12}$ of it. How much further along the trail is the friend?'
            answer: '1/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both positions are counted in twelfths of the trail. The difference is $11-5=6$ twelfths, which is $6/12=1/2$ of the trail.'
          - problem: 'A bug sits at $\frac{8}{9}$ on a number line marked in ninths. It crawls $\frac{2}{9}$ to the left. Where does it stop?'
            answer: '2/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bug moves back $2$ ninths from the mark $8/9$. It stops at $(8-2)/9=6/9$, which is $2/3$.'
          - problem: 'A cake needs $\frac{11}{16}$ kg of sugar. Tom has already measured $\frac{5}{16}$ kg. How much more sugar must he add?'
            answer: '3/8'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The amounts are counted in sixteenths of a kilogram. Tom must add $11-5=6$ sixteenths, which is $6/16=3/8$ kg.'
          - problem: 'Sam works out $\frac{11}{15}-\frac{5}{15}$ and writes $\frac{6}{30}$. What is the correct difference?'
            answer: '2/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator stays $15$, because the pieces are fifteenths. So $11-5=6$ and the difference is $6/15=2/5$.'
          - problem: 'Is $\frac{9}{10}-\frac{4}{10}$ equal to $\frac{1}{2}$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","they are equal","equal","yes they are","yes, they are"],["no","they are not equal","not equal","no they are not","no, they are not"]]}
            solution_sketch: 'The difference is $(9-4)/10=5/10$. Dividing top and bottom by $5$ gives $1/2$, so the two values are equal.'
          - problem: 'A plate holds $\frac{9}{11}$ of a pizza. After some of it is eaten, $\frac{4}{11}$ of the pizza is left on the plate. What fraction of the pizza is eaten?'
            answer: '5/11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both amounts are elevenths of the whole pizza. The eaten part is the difference $9/11-4/11$, which is $5/11$.'
        constraints: "same denominator up to 12; simplify the result"
      - id: kp3
        name: Sums past one and simplifying
        key_prerequisites: [equivalent-fractions]
        step_check:
          step: 'Simplify the fraction by dividing numerator and denominator by 4'
          question: 'Why can the numerator and denominator of $\frac{12}{8}$ both be divided by $4$?'
          options:
            - 'Four is the only number that divides both $12$ and $8$'
            - 'Dividing by $4$ turns the fraction into a whole number'
            - 'The sum of two fractions must be divided by $4$'
            - 'Dividing both by one number keeps the value equal'
          answer: 'Dividing both by one number keeps the value equal'
          why: 'Dividing top and bottom by the same number gives an equal fraction, so $\frac{12}{8}=\frac{3}{2}$; here $4$ is the greatest such number.'
        exemplars:
          - problem: 'Find $\frac{5}{6}+\frac{5}{6}$.'
            answer: '5/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both fractions count sixths, so $5+5=10$ sixths in all. The sum is $10/6=5/3$.'
          - problem: 'Two $\frac{3}{4}$-litre measures of water are poured into an empty jug. How much water is in the jug?'
            answer: '3/2'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'The two measures hold $3+3=6$ quarters of a litre together. That is $6/4=3/2$ litres.'
          - problem: 'A snail crawls $\frac{7}{9}$ m up a wall and then $\frac{5}{9}$ m more. How far does it crawl in all?'
            answer: '4/3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The two distances are counted in ninths of a metre. The total is $(7+5)/9=12/9=4/3$ m.'
          - problem: 'Add $\frac{9}{10}+\frac{7}{10}$ and simplify the result.'
            answer: '8/5'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The numerators add to $9+7=16$, so the sum is $16/10$. Dividing top and bottom by $2$ gives $8/5$.'
          - problem: 'Lena runs $\frac{9}{12}$ km before school and $\frac{5}{12}$ km after school. How many kilometres does she run in all?'
            answer: '7/6'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The distances are counted in twelfths of a kilometre. The total is $(9+5)/12=14/12=7/6$ km.'
          - problem: 'Sam adds $\frac{4}{5}+\frac{3}{5}$ and writes $\frac{7}{10}$. What is the correct sum?'
            answer: '7/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator stays $5$, because the pieces are fifths. So $4+3=7$ and the correct sum is $7/5$.'
          - problem: 'Is $\frac{7}{12}+\frac{6}{12}$ greater than $1$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is","yes it is","yes, it is","it is greater","greater","it is greater than 1"],["no","it is not","no it is not","no, it is not","not greater","it is not greater","it is less"]]}
            solution_sketch: 'The sum is $(7+6)/12=13/12$. Since $13$ is more than $12$, the sum is greater than $1$.'
          - problem: 'Jo has $\frac{5}{7}$ of a pizza and is given some more. Now Jo has $\frac{9}{7}$ of a pizza. How much pizza was Jo given?'
            answer: '4/7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The amount given is the new total minus what Jo had. That is $9/7-5/7=4/7$ of a pizza.'
        constraints: "same denominator; results may exceed 1, give lowest terms"
    diagnostic_exemplar:
      problem: 'Compute $\frac{7}{10} + \frac{9}{10}$.'
      answer: "8/5"
      solution_sketch: 'Like denominators add straight across: $\frac{16}{10} = \frac{8}{5}$.'
    anki_seeds:
      - front: "To add fractions with the same denominator, add the numerators and..."
        back: "keep the denominator"
        type: basic

  - id: adding-subtracting-fractions
    name: Adding and Subtracting Fractions
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: expression
    expected_time_secs: 85
    prerequisites:
      - id: adding-subtracting-like-fractions
        weight: 0.9
        key: true
      - id: equivalent-fractions
        weight: 0.8
        key: true
      - id: least-common-multiple
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: One denominator divides the other
        key_prerequisites: [adding-subtracting-like-fractions]
        step_check:
          step: '$\frac{2}{3} = \frac{4}{6}$'
          question: 'Why is $\frac{2}{3}$ rewritten as $\frac{4}{6}$ before subtracting?'
          options:
            - 'Doubling the top and bottom makes $\frac{2}{3}$ a larger number to work with'
            - 'The first fraction must have the bigger denominator before we can subtract'
            - 'Only fractions with equal-sized pieces can be subtracted by numerators'
            - 'Only fractions with equal numerators can be subtracted from each other'
          answer: 'Only fractions with equal-sized pieces can be subtracted by numerators'
          why: '$\frac{2}{3}$ and $\frac{4}{6}$ are the same amount; once both are in sixths, $4-1=3$ sixths remain.'
        exemplars:
          - problem: 'Compute $\frac{1}{2} + \frac{3}{8}$.'
            answer: "7/8"
            solution_sketch: '$\frac{1}{2} = \frac{4}{8}$; $\frac{4}{8} + \frac{3}{8} = \frac{7}{8}$.'
          - problem: 'Compute $\frac{5}{6} - \frac{1}{3}$.'
            answer: "1/2"
            solution_sketch: '$\frac{5}{6} - \frac{2}{6} = \frac{3}{6} = \frac{1}{2}$.'
          - problem: 'A $\frac{1}{3}$ m rod is joined end to end with a $\frac{5}{9}$ m rod. How long is the joined rod?'
            answer: "8/9"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Rewrite one third as three ninths. Then $\frac{3}{9}+\frac{5}{9}=\frac{8}{9}$ m.'
          - problem: 'A number line is marked in twelfths. Start at $\frac{3}{4}$ and move one tick to the left. Where do you land?'
            answer: "2/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In twelfths, $\frac{3}{4} = \frac{9}{12}$, and one tick to the left is $\frac{9}{12} - \frac{1}{12} = \frac{8}{12}$. That simplifies to $\frac{2}{3}$.'
          - problem: 'Compute $\frac{7}{10} - \frac{1}{2}$.'
            answer: "1/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Rewrite $\frac{1}{2}$ as $\frac{5}{10}$. Then $\frac{7}{10}-\frac{5}{10}=\frac{2}{10}=\frac{1}{5}$.'
        constraints: "one denominator a multiple of the other, up to 12"
      - id: kp2
        name: Unlike denominators via the LCM
        key_prerequisites: [least-common-multiple]
        try_first:
          problem: 'Is $\frac{1}{2} + \frac{1}{3}$ equal to $\frac{2}{5}$?'
          answer_contract: {"kind":"label","options":[["yes","it is","equal"],["no","it is not","not equal"]]}
          answer: 'no'
          reveal: 'No: $\frac{2}{5}$ is less than $\frac{1}{2}$, so it cannot be $\frac{1}{2}$ plus something more. Halves and thirds are different-sized pieces; in sixths the sum is $\frac{3}{6}+\frac{2}{6}=\frac{5}{6}$.'
        step_check:
          step: 'The LCM is $15$.'
          question: 'Why is $15$ used as the common denominator?'
          options:
            - 'Adding the denominators $3$ and $5$ gives the new denominator'
            - 'It is the smallest number that both $3$ and $5$ divide into'
            - 'A larger denominator makes both fractions bigger and easier to add'
            - 'It is $3\times5$, and the product of denominators is always least'
          answer: 'It is the smallest number that both $3$ and $5$ divide into'
          why: 'Thirds and fifths both split evenly into fifteenths, and $15$ is the smallest such number; rewriting changes the names of the fractions, not their values.'
        exemplars:
          - problem: 'Compute $\frac{1}{4} + \frac{1}{6}$.'
            answer: "5/12"
            solution_sketch: '$\text{LCM}(4, 6) = 12$; $\frac{3}{12} + \frac{2}{12} = \frac{5}{12}$.'
          - problem: 'A jug holds $\frac{1}{2}$ litre of water. Then $\frac{1}{3}$ litre more is poured in. How much water is in the jug now?'
            answer: "5/6"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Write both amounts in sixths: $\frac{1}{2}=\frac{3}{6}$ and $\frac{1}{3}=\frac{2}{6}$. The jug now holds $\frac{5}{6}$ litre.'
          - problem: 'Compute $\frac{3}{4} - \frac{1}{6}$.'
            answer: "7/12"
            solution_sketch: '$\frac{9}{12} - \frac{2}{12} = \frac{7}{12}$.'
          - problem: 'Two intervals lie end to end on a number line. One is $\frac{5}{8}$ long and the other is $\frac{1}{6}$ long. How long are they together?'
            answer: "19/24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Use the common denominator $24$: $\frac{5}{8} = \frac{15}{24}$ and $\frac{1}{6} = \frac{4}{24}$. Together the intervals are $\frac{19}{24}$ long.'
        constraints: "denominators up to 12, unlike"
      - id: kp3
        name: Sums greater than one and three fractions
        key_prerequisites: [equivalent-fractions]
        step_check:
          step: 'Add the numerators: $8 + 9 + 1 = 18$.'
          question: 'Why are only the numerators added in this step?'
          options:
            - 'The denominators are added too, which gives a denominator of $36$ in the end'
            - 'The denominator is dropped because the final answer will be a whole number'
            - 'The numerators are added and the denominators multiplied, as in a product'
            - 'All three fractions now count twelfths, so we add the number of twelfths'
          answer: 'All three fractions now count twelfths, so we add the number of twelfths'
          why: 'Twelfths are the unit, like counting $8+9+1$ apples; adding the denominators too would change the size of the pieces.'
        exemplars:
          - problem: 'Compute $\frac{3}{4} + \frac{5}{6}$.'
            answer: "19/12"
            solution_sketch: '$\frac{3}{4} = \frac{9}{12}$ and $\frac{5}{6} = \frac{10}{12}$; $\frac{9}{12} + \frac{10}{12} = \frac{19}{12}$.'
          - problem: 'Compute $\frac{1}{2} + \frac{2}{3} + \frac{1}{6}$.'
            answer: "4/3"
            solution_sketch: '$\frac{3}{6} + \frac{4}{6} + \frac{1}{6} = \frac{8}{6} = \frac{4}{3}$.'
          - problem: 'A painter uses $\frac{7}{8}$ of a can of paint on one wall and $\frac{5}{6}$ of a can on another. How much paint does she use altogether?'
            answer: "41/24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Convert to twenty-fourths: $\frac{21}{24}+\frac{20}{24}=\frac{41}{24}$. She uses $\frac{41}{24}$, or $1\frac{17}{24}$, cans.'
          - problem: 'Compute $\frac{1}{3} + \frac{1}{4} + \frac{1}{2}$.'
            answer: "13/12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The LCM of $3$, $4$ and $2$ is $12$. Then $\frac{4}{12}+\frac{3}{12}+\frac{6}{12}=\frac{13}{12}$.'
        constraints: "denominators up to 12; results may exceed 1"
    diagnostic_exemplar:
      problem: 'Compute $\frac{1}{2} + \frac{3}{4} + \frac{1}{6}$.'
      answer: '17/12'
      solution_sketch: 'LCD $12$: $\frac{6}{12} + \frac{9}{12} + \frac{2}{12} = \frac{17}{12}$.'
    anki_seeds:
      - front: "To add or subtract fractions with unlike denominators, first..."
        back: "rewrite each fraction over the LCM of the denominators"
        type: basic

  - id: fraction-of-a-number
    name: Fraction of a Number
    core: true
    difficulty: 0.26
    drill: false
    answer_kind: numeric
    expected_time_secs: 55
    prerequisites:
      - id: fraction-basics
        weight: 0.8
        key: true
      - id: division-facts
        weight: 0.8
        key: true
      - id: multiplication-tables
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Unit fraction of a number
        key_prerequisites: [division-facts]
        step_check:
          step: 'Divide the whole count by seven'
          question: 'Why is one seventh of the $42$ pears found by dividing $42$ by $7$?'
          options:
            - 'Seven equal groups of pears make up the whole crate'
            - 'Division always makes a quantity smaller, as a fraction does'
            - 'The $7$ is taken away from the $42$ pears one by one'
            - 'One seventh means $7$ pears out of every pear in the crate'
          answer: 'Seven equal groups of pears make up the whole crate'
          why: 'One seventh is one of $7$ equal groups, and splitting $42$ pears into $7$ equal groups gives $42\div7=6$ pears in each group.'
        exemplars:
          - problem: 'What is $\frac{1}{3}$ of $12$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Splitting $12$ into $3$ equal parts gives $12\div3=4$. So one third of $12$ is $4$.'
          - problem: 'A set has $40$ counters. How many counters are in one fifth of the set?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One fifth means one of $5$ equal parts. So one fifth of the set is $40\div5=8$ counters.'
          - problem: 'A strip of paper $28$ cm long is folded into four equal sections. How long is one section?'
            answer: '7'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'One section is one quarter of the strip. Its length is $28\div4=7$ cm.'
          - problem: 'A number line from $0$ to $54$ has six equal intervals. Which number labels the first mark after $0$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first mark is one sixth of the way to $54$. That number is $54\div6=9$.'
          - problem: 'One tenth of the $60$ seats in a hall are reserved. How many seats are reserved?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One tenth means one of $10$ equal groups. So $60\div10=6$ seats are reserved.'
          - problem: 'Sam says that one ninth of $45$ is $405$. What is one ninth of $45$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One ninth of a quantity is found by dividing by $9$, not by multiplying. So $45\div9=5$ is the correct value.'
          - problem: 'One third of a class goes on a trip, and $9$ pupils go. How many pupils are in the class?'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $9$ pupils are one of $3$ equal parts of the class. So the whole class is $3\times9=27$ pupils.'
        constraints: "denominator divides the whole number evenly"
      - id: kp2
        name: General fraction of a number
        key_prerequisites: [multiplication-tables]
        step_check:
          step: 'Five sixths contains five of those parts'
          question: 'Why is $11$ multiplied by $5$ after $66$ has been divided by $6$?'
          options:
            - 'Multiplying by $5$ undoes the division by $6$ exactly'
            - 'The numerator $5$ tells how many parts the whole is cut into'
            - 'Every fraction of a length is found by multiplying by $5$'
            - 'One part is $11$ cm and five sixths is five of those parts'
          answer: 'One part is $11$ cm and five sixths is five of those parts'
          why: 'The division by $6$ gives the size of one sixth, $11$ cm. The numerator $5$ counts how many sixths are wanted, so $5\times11=55$ cm.'
        try_first:
          problem: 'A box holds $30$ chocolates and $\frac{2}{5}$ of them are dark. How many chocolates are dark?'
          answer_contract: {"kind":"exact"}
          answer: '12'
          reveal: 'One fifth of $30$ is $6$ chocolates, and two fifths is $2\times6=12$ chocolates. The denominator sets the size of one part and the numerator counts the parts.'
        exemplars:
          - problem: 'What is $\frac{2}{3}$ of $12$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One third of $12$ is $12\div3=4$. So two thirds of $12$ is $2\times4=8$.'
          - problem: 'A rectangle of $20$ cells is arranged in four equal columns. Three of the columns are coloured. How many cells are coloured?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each column is one quarter of the cells and has $20\div4=5$ cells. Three columns have $3\times5=15$ cells.'
          - problem: 'A road is $45$ km long and $\frac{2}{5}$ of it is repaired. How many kilometres of the road are repaired?'
            answer: '18'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'One fifth of the road is $45\div5=9$ km. So two fifths is $2\times9=18$ km.'
          - problem: 'What is $\frac{7}{8}$ of $32$?'
            answer: '28'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One eighth of $32$ is $32\div8=4$. So seven eighths of $32$ is $7\times4=28$.'
          - problem: 'Two fifths of a journey is $24$ km. How long is the whole journey?'
            answer: '60'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Two fifths is $24$ km, so one fifth is $24\div2=12$ km. The whole journey is $5\times12=60$ km.'
          - problem: 'Three quarters of a full tank is $27$ litres. How many litres does the full tank hold?'
            answer: '36'
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Three quarters is $27$ litres, so one quarter is $27\div3=9$ litres. The full tank holds $4\times9=36$ litres.'
          - problem: 'Sam finds $\frac{3}{5}$ of $40$ by working out $40\times3=120$ and stopping. What is the correct value?'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The whole must be divided into $5$ equal parts first. One part is $40\div5=8$, so three parts are $3\times8=24$.'
          - problem: 'Is $\frac{2}{3}$ of $18$ equal to $\frac{3}{4}$ of $16$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","they are equal","equal","yes they are","yes, they are"],["no","they are not equal","not equal","no they are not","no, they are not"]]}
            solution_sketch: 'Two thirds of $18$ is $2\times6=12$. Three quarters of $16$ is $3\times4=12$, so the two values are equal.'
          - problem: 'Ana has €48 and spends $\frac{5}{6}$ of it. How many euros does she have left?'
            answer: '8'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'One sixth of €48 is $48\div6=8$, so she spends $5\times8=40$ euros. She has $48-40=8$ euros left.'
        constraints: "denominator divides the whole number; numerator 2-9"
      - id: kp3
        name: Fraction of a quantity in context
        key_prerequisites: [division-facts]
        step_check:
          step: 'The whole is the full capacity'
          question: 'Why is the full capacity of $54$ litres divided into ninths, and not the amount of water?'
          options:
            - 'The fraction is of the tank, so the tank is the whole'
            - 'The larger number is always the one that gets divided'
            - 'The amount of water is the whole and it is not known yet'
            - 'Dividing $54$ is easier than dividing the water amount'
          answer: 'The fraction is of the tank, so the tank is the whole'
          why: 'The fraction $\frac{4}{9}$ describes how full the tank is, so it is a fraction of the full capacity, and $\frac{4}{9}\times54=24$ litres.'
        exemplars:
          - problem: 'Three fifths of the $25$ pupils in a class walk to school. How many pupils walk?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One fifth of the class is $25\div5=5$ pupils. So three fifths is $3\times5=15$ pupils.'
          - problem: 'It rained on $\frac{2}{7}$ of the $28$ days of February. On how many days did it rain?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One seventh of $28$ days is $28\div7=4$ days. So two sevenths is $2\times4=8$ days.'
          - problem: 'A bag holds $48$ marbles and $\frac{5}{8}$ of them are blue. How many marbles are not blue?'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One eighth of $48$ is $48\div8=6$, so there are $5\times6=30$ blue marbles. Then $48-30=18$ marbles are not blue.'
          - problem: 'A recipe uses $\frac{3}{10}$ of a $70$ g bag of nuts. How many grams of nuts does the recipe use?'
            answer: '21'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            solution_sketch: 'One tenth of $70$ g is $70\div10=7$ g. So three tenths is $3\times7=21$ g.'
          - problem: 'Three eighths of the pupils in a class cycle to school, and $12$ pupils cycle. How many pupils are in the class?'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three eighths is $12$ pupils, so one eighth is $12\div3=4$ pupils. The whole class is $8\times4=32$ pupils.'
          - problem: 'Mia reads $\frac{3}{8}$ of a $64$-page book on Monday. How many pages are left for her to read?'
            answer: '40'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One eighth of $64$ is $64\div8=8$ pages, so she reads $3\times8=24$ pages. Then $64-24=40$ pages are left.'
          - problem: 'Sam works out $\frac{3}{4}$ of $24$ pupils as $32$ pupils, by dividing $24$ by $\frac{3}{4}$. What is the correct number of pupils?'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A fraction of a whole is smaller than the whole, so $32$ cannot be right. One quarter of $24$ is $24\div4=6$, so three quarters is $3\times6=18$ pupils.'
          - problem: 'A hiker has walked $\frac{5}{9}$ of a trail, which is $15$ km. How long is the whole trail?'
            answer: '27'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Five ninths is $15$ km, so one ninth is $15\div5=3$ km. The whole trail is $9\times3=27$ km.'
        constraints: "whole-number answers; quantities up to 70"
    diagnostic_exemplar:
      problem: '$\frac{3}{8}$ of the $32$ pupils in a class cycle to school. How many cycle?'
      answer: '12'
      solution_sketch: '$32 \div 8 = 4$, then $3 \times 4 = 12$.'
    anki_seeds:
      - front: "To find a/b of a number n, divide n by b and then..."
        back: "multiply the result by a"
        type: basic

  - id: multiplying-fractions
