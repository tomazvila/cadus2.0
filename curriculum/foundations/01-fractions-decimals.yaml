  # Mixed numbers
  # --------------------------------------------------------------------- #
  - id: improper-fractions-mixed-numbers
    name: Improper Fractions and Mixed Number Conversions
    core: true
    difficulty: 0.28
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: fraction-basics
        weight: 0.8
        key: true
      - id: division-with-remainders
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: Improper fraction to mixed number
        key_prerequisites: [division-with-remainders]
        try_first:
          problem: 'You have $19$ pieces, each one fifth of a strip. How many complete strips can you make?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'Five fifths make one strip, so $19$ fifths make $3$ strips with $4$ fifths left over: $\frac{19}{5}=3\frac{4}{5}$. Dividing the numerator by the denominator gives the whole part; the remainder stays as fifths.'
        step_check:
          step: '6 goes into 29 four whole times, since 6 x 4 = 24.'
          question: 'Why is the whole part found by dividing $29$ by $6$?'
          options:
            - 'Every $6$ sixths make one whole, so we count groups of $6$'
            - 'The whole part is always the numerator minus the denominator'
            - 'Dividing makes the fraction small enough to fit below one'
            - 'The whole part is the remainder left after $29$ is divided by $6$'
          answer: 'Every $6$ sixths make one whole, so we count groups of $6$'
          why: 'Six sixths equal $1$, so $24$ sixths make $4$ wholes and the remaining $5$ sixths form the fraction part.'
        exemplars:
          - problem: 'Write $\frac{7}{2}$ as a mixed number.'
            answer: "3 1/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide: $7\div2=3$ remainder $1$. So $\frac{7}{2}=3\frac{1}{2}$.'
          - problem: 'Seventeen pieces, each one fifth of a pizza, are put back together. How many pizzas do they make, as a mixed number?'
            answer: "3 2/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Five fifths make one pizza, and $17 = 3 \times 5 + 2$. So the pieces make $3$ whole pizzas and $\frac{2}{5}$ of another, which is $3\frac{2}{5}$.'
          - problem: 'A ribbon is $\frac{22}{5}$ m long. Express its length as a mixed number.'
            answer: "4 2/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide: $22=4\times5+2$. The ribbon is $4\frac{2}{5}$ m long.'
          - problem: 'Write $\frac{33}{4}$ as a mixed number.'
            answer: "8 1/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide: $33=8\times4+1$. So $\frac{33}{4}=8\frac{1}{4}$.'
          - problem: 'Convert $\frac{29}{8}$ to a mixed number.'
            answer: "3 5/8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide: $29=3\times8+5$. So $\frac{29}{8}=3\frac{5}{8}$.'
          - problem: 'A recipe uses $23$ quarter-cups of flour. How many cups of flour is that?'
            answer: "5 3/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four quarter-cups make one cup, and $23=5\times4+3$. That is $\frac{23}{4}=5\frac{3}{4}$ cups.'
        constraints: "single-digit whole parts; denominators up to 8"
      - id: kp2
        name: Mixed number to improper fraction
        key_prerequisites: [fraction-basics]
        step_check:
          step: 'Multiply the whole number by the denominator: 5 x 7 = 35.'
          question: 'Why multiply the whole number $5$ by the denominator $7$?'
          options:
            - 'Multiplying makes the numerator larger than the denominator'
            - 'Each whole contains $7$ sevenths, so $5$ wholes are $35$ sevenths'
            - 'In every fraction the whole number and denominator are multiplied'
            - 'The product $35$ becomes the new denominator of the improper fraction'
          answer: 'Each whole contains $7$ sevenths, so $5$ wholes are $35$ sevenths'
          why: 'One whole is $\frac{7}{7}$, so $5$ wholes are $\frac{35}{7}$; adding the $3$ extra sevenths gives $\frac{38}{7}$.'
        exemplars:
          - problem: 'Write $2\frac{3}{4}$ as an improper fraction.'
            answer: "11/4"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Two wholes are $2\times4=8$ quarters. Add $3$ quarters to get $\frac{11}{4}$.'
          - problem: 'Four whole strips and one third of a strip are all cut into thirds. How many thirds are there?'
            answer: "13"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each whole strip gives $3$ thirds, so four strips give $12$ thirds. With the extra third there are $13$ thirds, so $4\frac{1}{3} = \frac{13}{3}$.'
          - problem: 'A number line is marked in fifths. How many fifth-steps from $0$ is the point $3\frac{4}{5}$?'
            answer: "19"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each whole number is $5$ fifth-steps, so $3$ is $15$ steps from $0$. Four more steps reach $3\frac{4}{5}$, which is $19$ steps, so $3\frac{4}{5} = \frac{19}{5}$.'
          - problem: 'Convert $6\frac{1}{8}$ to an improper fraction.'
            answer: "49/8"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Six wholes are $6\times8=48$ eighths. Add $1$ eighth to get $\frac{49}{8}$.'
          - problem: 'Convert $7\frac{2}{9}$ to an improper fraction.'
            answer: "65/9"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Seven wholes are $7\times9=63$ ninths. Add $2$ ninths to get $\frac{65}{9}$.'
          - problem: 'A baker has $2\frac{5}{6}$ cups of flour and a $\frac{1}{6}$-cup scoop. How many scoops of flour does she have?'
            answer: "17"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each cup holds $6$ scoops, so two cups hold $12$ scoops. Adding $5$ more gives $17$ scoops, since $2\frac{5}{6}=\frac{17}{6}$.'
        constraints: "whole parts 1-9; denominators up to 8"
      - id: kp3
        name: Comparing and locating mixed numbers
        key_prerequisites: [fraction-basics]
        step_check:
          step: 'The fraction part is $\frac{4}{7}$, and $0 < \frac{4}{7} < 1$.'
          question: 'Why does it matter that $\frac{4}{7}$ is less than $1$?'
          options:
            - 'Any fraction part makes the number round up to $7$'
            - 'A fraction part below $1$ is subtracted from the $6$'
            - 'Adding less than one whole to $6$ cannot reach $7$'
            - 'The fraction part must be below $1$ to be multiplied by $6$'
          answer: 'Adding less than one whole to $6$ cannot reach $7$'
          why: '$6\frac{4}{7}$ means $6+\frac{4}{7}$, and adding a proper fraction to $6$ lands strictly between $6$ and $7$.'
        exemplars:
          - problem: 'A number line marks $3\frac{2}{3}$ and $\frac{11}{3}$. What is the distance between the two marks?'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Convert: $3\frac{2}{3}=\frac{9+2}{3}=\frac{11}{3}$. The two marks are the same point, so the distance is $0$.'
          - problem: '$3\frac{2}{5}$ lies between two consecutive whole numbers. What is the smaller one?'
            answer: "3"
            solution_sketch: 'The whole part is $3$, and $\frac{2}{5} < 1$, so it sits between $3$ and $4$.'
          - problem: 'Which is greater, $2\frac{3}{5}$ or $\frac{12}{5}$?'
            answer: "2 3/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Convert: $2\frac{3}{5}=\frac{13}{5}$. Since $13>12$, the greater number is $2\frac{3}{5}$.'
          - problem: 'Which point is farther right on a number line, $\frac{13}{4}$ or $3\frac{1}{2}$?'
            answer: "3 1/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write both in quarters: $\frac{13}{4} = 3\frac{1}{4}$ and $3\frac{1}{2} = 3\frac{2}{4}$. So $3\frac{1}{2}$ is farther right.'
          - problem: '$\frac{23}{6}$ lies between two consecutive whole numbers. What is the larger one?'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide: $23=3\times6+5$, so $\frac{23}{6}=3\frac{5}{6}$. It lies between $3$ and $4$, and the larger one is $4$.'
          - problem: 'Give a number between $2\frac{1}{3}$ and $2\frac{1}{2}$.'
            answer: "12/5"
            answer_contract: {"kind":"property","check":"between","args":{"low":"7/3","high":"5/2"}}
            solution_sketch: 'In thirtieths the bounds are $\frac{70}{30}$ and $\frac{75}{30}$, so $\frac{72}{30}=\frac{12}{5}=2\frac{2}{5}$ works. Others include $2\frac{3}{8}$ and $2.45$.'
        constraints: "denominators up to 8"
    diagnostic_exemplar:
      problem: 'Which is larger, $\frac{15}{4}$ or $3\frac{1}{2}$?'
      answer: '15/4'
      solution_sketch: '$3\frac{1}{2} = \frac{7}{2} = \frac{14}{4}$, which is less than $\frac{15}{4}$.'
    anki_seeds:
      - front: "To convert the mixed number a b/c to an improper fraction, compute..."
        back: "(a x c + b) / c"
        type: basic

  - id: mixed-numbers
    name: Mixed Numbers and Improper Fractions
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: expression
    expected_time_secs: 85
    prerequisites:
      - id: improper-fractions-mixed-numbers
        weight: 0.9
        key: true
      - id: adding-subtracting-fractions
        weight: 0.8
        key: true
      - id: multiplying-fractions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Add mixed numbers
        key_prerequisites: [adding-subtracting-fractions]
        step_check:
          step: 'Common denominator 12: 13/4 = 39/12, 17/6 = 34/12'
          question: 'Why are $13/4$ and $17/6$ rewritten in twelfths?'
          options:
            - '$12$ is a common multiple of $4$ and $6$, so the pieces become equal'
            - 'Mixed numbers must always be written with a denominator of $12$'
            - 'Twelfths make both fractions larger, so the sum is easier to find'
            - '$12$ is the sum of the whole parts and of the denominators $4$ and $6$'
          answer: '$12$ is a common multiple of $4$ and $6$, so the pieces become equal'
          why: 'Quarters and sixths are different-sized pieces; in twelfths, $39+34=73$ counts pieces of one size.'
        exemplars:
          - problem: 'Compute $1\frac{1}{2} + 2\frac{1}{4}$.'
            answer: "3 3/4"
            solution_sketch: '$\frac{6}{4} + \frac{9}{4} = \frac{15}{4} = 3\frac{3}{4}$.'
          - problem: 'Two boards measure $2\frac{2}{3}$ m and $1\frac{1}{2}$ m. Laid end to end, how long are they?'
            answer: "4 1/6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The whole parts total $3$. The fraction parts total $\frac{4}{6}+\frac{3}{6}=\frac{7}{6}=1\frac{1}{6}$, giving $4\frac{1}{6}$ m.'
          - problem: 'Start at $1\frac{1}{3}$ on a number line and move $1\frac{1}{2}$ units to the right. Where do you land?'
            answer: "2 5/6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the whole parts: $1 + 1 = 2$. Add the fractions in sixths: $\frac{2}{6} + \frac{3}{6} = \frac{5}{6}$. You land at $2\frac{5}{6}$.'
          - problem: 'A recipe uses $3\frac{2}{5}$ cups of flour and $1\frac{1}{2}$ cups of sugar. How many cups is that altogether?'
            answer: "4 9/10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Convert: $\frac{17}{5}+\frac{3}{2}=\frac{34}{10}+\frac{15}{10}=\frac{49}{10}$. That is $4\frac{9}{10}$ cups.'
          - problem: 'Add $2\frac{3}{4}$ and $1\frac{5}{8}$.'
            answer: "4 3/8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The whole parts give $3$. The fraction parts give $\frac{6}{8}+\frac{5}{8}=\frac{11}{8}=1\frac{3}{8}$, so the sum is $4\frac{3}{8}$.'
          - problem: 'A hiker walks $3\frac{5}{6}$ km before lunch and $2\frac{3}{4}$ km after lunch. How far does she walk in total?'
            answer: "6 7/12"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Convert: $\frac{23}{6}+\frac{11}{4}=\frac{46}{12}+\frac{33}{12}=\frac{79}{12}$. That is $6\frac{7}{12}$ km.'
        constraints: "denominators up to 6"
      - id: kp2
        name: Subtract mixed numbers, with regrouping
        key_prerequisites: [improper-fractions-mixed-numbers]
        step_check:
          step: 'Regroup $4\frac{1}{5}$ by borrowing 1 from the whole number part'
          question: 'Why is $4\frac{1}{5}$ rewritten as $3\frac{6}{5}$?'
          options:
            - 'Borrowing $1$ adds $\frac{1}{5}$ to the fraction part, giving $\frac{2}{5}$'
            - 'We may subtract the smaller fraction from the larger one: $\frac{3}{5}-\frac{1}{5}$'
            - '$\frac{3}{5}$ cannot come out of $\frac{1}{5}$, so a whole becomes $\frac{5}{5}$'
            - 'Borrowing $1$ from the $4$ adds $\frac{1}{10}$, one tenth, to the fraction'
          answer: '$\frac{3}{5}$ cannot come out of $\frac{1}{5}$, so a whole becomes $\frac{5}{5}$'
          why: 'One whole is $\frac{5}{5}$, so $4\frac{1}{5}=3+\frac{5}{5}+\frac{1}{5}=3\frac{6}{5}$, and now $\frac{6}{5}-\frac{3}{5}$ works.'
        exemplars:
          - problem: 'Compute $3\frac{1}{3} - 1\frac{2}{3}$.'
            answer: "1 2/3"
            solution_sketch: '$\frac{10}{3} - \frac{5}{3} = \frac{5}{3} = 1\frac{2}{3}$.'
          - problem: 'A $5\frac{1}{4}$-metre rope has $2\frac{3}{4}$ metres cut off. How much rope is left?'
            answer: "2 1/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Regroup $5\frac{1}{4}=4\frac{5}{4}$. Subtract to get $2\frac{2}{4}=2\frac{1}{2}$ m.'
          - problem: 'How far apart are $1\frac{3}{5}$ and $4\frac{1}{5}$ on a number line?'
            answer: "2 3/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $1\frac{3}{5}$ to $2$ is $\frac{2}{5}$, and from $2$ to $4\frac{1}{5}$ is $2\frac{1}{5}$. The total is $2\frac{3}{5}$.'
          - problem: 'Compute $6\frac{1}{6} - 2\frac{5}{6}$.'
            answer: "3 1/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Regroup $6\frac{1}{6}=5\frac{7}{6}$. Then $5\frac{7}{6}-2\frac{5}{6}=3\frac{2}{6}=3\frac{1}{3}$.'
          - problem: 'A tank holds $7\frac{1}{3}$ litres of water. After $4\frac{3}{4}$ litres are used, how much water is left?'
            answer: "2 7/12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Convert: $\frac{22}{3}-\frac{19}{4}=\frac{88}{12}-\frac{57}{12}=\frac{31}{12}$. That is $2\frac{7}{12}$ litres.'
        constraints: "fraction part of the subtrahend may exceed the minuend's"
      - id: kp3
        name: Multiply mixed numbers
        key_prerequisites: [multiplying-fractions]
        step_check:
          step: 'Convert the mixed number to an improper fraction'
          question: 'Why convert $3\frac{1}{2}$ to $\frac{7}{2}$ before multiplying?'
          options:
            - 'Mixed numbers can be added but never multiplied by fractions'
            - 'Multiplying whole parts and fraction parts separately gives the same'
            - 'Converting first makes the number smaller, so the product is easier'
            - 'A single fraction lets us multiply numerators and denominators'
          answer: 'A single fraction lets us multiply numerators and denominators'
          why: '$3\frac{1}{2}$ means $3+\frac{1}{2}$, and the whole $3$ must be multiplied too; $\frac{7}{2}\times\frac{2}{5}$ handles the whole value at once.'
        exemplars:
          - problem: 'Compute $1\frac{1}{2} \times \frac{2}{3}$.'
            answer: "1"
            solution_sketch: '$\frac{3}{2} \times \frac{2}{3} = \frac{6}{6} = 1$.'
          - problem: 'Compute $2\frac{1}{4} \times 2$.'
            answer: "4 1/2"
            solution_sketch: '$\frac{9}{4} \times 2 = \frac{18}{4} = 4\frac{1}{2}$.'
          - problem: 'A rectangle is $2\frac{2}{3}$ m long and $\frac{3}{4}$ m wide. What is its area?'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Convert $2\frac{2}{3}=\frac{8}{3}$. The area is $\frac{8}{3}\times\frac{3}{4}=\frac{8}{4}=2$ square metres.'
          - problem: 'Four jars each contain $1\frac{3}{4}$ litres. How many litres are there altogether?'
            answer: "7"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Each jar contains $7/4$ litres; $4\times7/4=7$ litres altogether.'
          - problem: 'Compute $1\frac{2}{3} \times 2\frac{1}{4}$.'
            answer: "3 3/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Convert: $\frac{5}{3}\times\frac{9}{4}=\frac{45}{12}=\frac{15}{4}$. That is $3\frac{3}{4}$.'
        constraints: "convert to improper fractions first"
    diagnostic_exemplar:
      problem: 'Compute $4\frac{1}{4} - 1\frac{2}{3}$.'
      answer: "2 7/12"
      solution_sketch: '$\frac{17}{4} - \frac{5}{3} = \frac{51}{12} - \frac{20}{12} = \frac{31}{12}$.'
    anki_seeds:
      - front: "To add or subtract mixed numbers reliably, first convert each to..."
        back: "an improper fraction (then convert the result back)"
        type: basic

  - id: dividing-mixed-numbers
    name: Dividing Mixed Numbers
    core: false                # mixed-number format leaf; dividing-fractions stays core
    difficulty: 0.4
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: mixed-numbers
        weight: 0.8
        key: true
      - id: dividing-fractions
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: Mixed number divided by a fraction
        key_prerequisites: [dividing-fractions]
        step_check:
          step: 'Convert the mixed number: 5 1/3 = 16/3.'
          question: 'Why convert $5\frac{1}{3}$ to $\frac{16}{3}$ before dividing?'
          options:
            - 'Dividing only the fraction part is enough: $\frac{1}{3}\div\frac{1}{3}=1$'
            - 'The reciprocal rule needs one fraction, not a whole part plus a fraction'
            - 'Converting makes $5\frac{1}{3}$ smaller, so it is easier to divide'
            - 'An improper fraction is needed only so that the answer is in lowest terms'
          answer: 'The reciprocal rule needs one fraction, not a whole part plus a fraction'
          why: '$5\frac{1}{3}$ is the single value $\frac{16}{3}$; dividing only its fraction part would ignore the five wholes, which hold $15$ of the thirds.'
        exemplars:
          - problem: 'Compute $2\frac{1}{2} \div \frac{1}{2}$.'
            answer: "5"
            solution_sketch: '$\frac{5}{2} \times \frac{2}{1} = 5$.'
          - problem: 'How many $2/3$-litre servings are in $1\frac{1}{3}$ litres?'
            answer: "2"
            solution_sketch: 'Convert $1\frac{1}{3}=4/3$. Then $(4/3)(3/2)=2$ servings.'
          - problem: 'A rectangle has area $3\frac{3}{4}$ square metres and width $1/4$ metre. What is its length in metres?'
            answer: "15"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The area is $15/4$. Length is $(15/4)\div(1/4)=15$ metres.'
          - problem: 'A $2\frac{1}{2}$ kg bag of rice is split into $\frac{5}{6}$ kg portions. How many portions are there?'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Convert $2\frac{1}{2}=\frac{5}{2}$. Then $\frac{5}{2}\times\frac{6}{5}=\frac{30}{10}=3$ portions.'
        constraints: "denominators up to 6"
      - id: kp2
        name: Mixed number divided by a mixed number
        key_prerequisites: [mixed-numbers]
        step_check:
          step: 'Multiply by the reciprocal: (10/3) * (4/5).'
          question: 'Why does dividing by $5/4$ become multiplying by $4/5$?'
          options:
            - 'Both fractions are flipped before they are multiplied together'
            - 'The reciprocal of $1\frac{1}{4}$ is $1\frac{4}{1}$, which is $5$'
            - 'Dividing by any fraction gives the same result as multiplying by it'
            - 'Multiplying by $4/5$ undoes multiplying by $5/4$, as division asks'
          answer: 'Multiplying by $4/5$ undoes multiplying by $5/4$, as division asks'
          why: 'Dividing by a number asks what times it gives $10/3$; since $\frac{5}{4}\times\frac{4}{5}=1$, multiplying by $4/5$ answers that. Only the divisor is flipped.'
        exemplars:
          - problem: 'Compute $3\frac{1}{2} \div 1\frac{3}{4}$.'
            answer: "2"
            solution_sketch: '$\frac{7}{2} \div \frac{7}{4} = \frac{7}{2} \times \frac{4}{7} = 2$.'
          - problem: 'A $2\frac{1}{4}$ m rod lies beside a $1\frac{1}{2}$ m rod. How many times as long as the shorter rod is the longer rod?'
            answer: "3/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the lengths: $2\frac{1}{4} \div 1\frac{1}{2} = \frac{9}{4} \div \frac{3}{2} = \frac{9}{4} \times \frac{2}{3} = \frac{3}{2}$. The longer rod is $1\frac{1}{2}$ times as long.'
          - problem: 'A rectangle has area $4\frac{1}{2}$ square metres and width $1\frac{1}{5}$ metres. How long is it?'
            answer: "15/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width: $\frac{9}{2}\times\frac{5}{6}=\frac{45}{12}=\frac{15}{4}$. The rectangle is $3\frac{3}{4}$ m long.'
          - problem: 'How many jumps of $1\frac{1}{4}$ units reach $3\frac{3}{4}$ from zero on a number line?'
            answer: "3"
            solution_sketch: 'The distance is $15/4$ and each jump is $5/4$. Their quotient is $(15/4)(4/5)=3$.'
          - problem: 'Divide $4\frac{2}{3}$ by $1\frac{3}{4}$.'
            answer: "8/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Convert: $\frac{14}{3}\times\frac{4}{7}=\frac{56}{21}=\frac{8}{3}$. That is $2\frac{2}{3}$.'
          - problem: 'A car travels $12\frac{1}{2}$ km on $1\frac{1}{4}$ litres of fuel. How many kilometres does it travel per litre?'
            answer: "10"
            answer_contract: {"kind":"unit","quantity":"length_per_volume","unit":"km/L","allow_omitted":true}
            solution_sketch: 'Divide distance by fuel: $\frac{25}{2}\times\frac{4}{5}=\frac{100}{10}=10$. The car travels $10$ km per litre.'
        constraints: "denominators up to 6; give the answer in lowest terms"
      - id: kp3
        name: Division in context
        key_prerequisites: [dividing-fractions]
        step_check:
          step: 'Short straps: $\frac{15}{2}\div\frac{3}{8}=\frac{15}{2}\times\frac{8}{3}=\frac{120}{6}=20$'
          question: 'Why is the number of short straps found by dividing $\frac{15}{2}$ by $\frac{3}{8}$?'
          options:
            - 'Each strap is $\frac{3}{8}$ of the ribbon, so we multiply by $\frac{3}{8}$'
            - 'Subtracting $\frac{3}{8}$ once from $\frac{15}{2}$ gives the count'
            - 'It counts how many $\frac{3}{8}$ m lengths fit into $7\frac{1}{2}$ m'
            - 'Dividing by a fraction always gives a result smaller than $\frac{15}{2}$'
          answer: 'It counts how many $\frac{3}{8}$ m lengths fit into $7\frac{1}{2}$ m'
          why: 'Asking how many pieces of one size fit into a length is a division; multiplying would give the length of $\frac{3}{8}$ of the ribbon instead.'
        exemplars:
          - problem: 'How many $\frac{3}{4}$-cup servings are in $4\frac{1}{2}$ cups of rice?'
            answer: "6"
            solution_sketch: '$\frac{9}{2} \div \frac{3}{4} = \frac{9}{2} \times \frac{4}{3} = 6$.'
          - problem: 'A ribbon $5\frac{1}{4}$ m long is cut into $\frac{3}{4}$ m pieces. How many pieces?'
            answer: "7"
            solution_sketch: '$\frac{21}{4} \times \frac{4}{3} = 7$.'
          - problem: 'A container holds $6\frac{2}{3}$ litres of paint poured into $\frac{2}{3}$-litre cans. How many cans are filled?'
            answer: "10"
            solution_sketch: '$\frac{20}{3} \times \frac{3}{2} = 10$.'
          - problem: 'A board $8\frac{1}{4}$ ft long is cut into $\frac{3}{4}$ ft pieces. How many pieces?'
            answer: "11"
            solution_sketch: '$\frac{33}{4} \times \frac{4}{3} = 11$.'
        constraints: "whole-number answers in context"
    diagnostic_exemplar:
      problem: 'A ribbon $5\frac{1}{4}$ m long is cut into $1\frac{3}{4}$ m pieces. How many pieces?'
      answer: '3'
      solution_sketch: '$\frac{21}{4} \div \frac{7}{4} = \frac{21}{4} \times \frac{4}{7} = 3$.'
    anki_seeds:
      - front: "Before dividing mixed numbers, always convert them to..."
        back: "improper fractions, then multiply by the reciprocal"
        type: basic

  - id: fraction-word-problems
    name: Fraction Word Problems
    # over-coverage: contextual dressing on adding-subtracting-fractions,
    # multiplying-fractions and dividing-fractions; no new technique
    core: false
    difficulty: 0.4
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: adding-subtracting-fractions
        weight: 0.8
        key: true
      - id: multiplying-fractions
        weight: 0.7
        key: true
      - id: dividing-fractions
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Adding and subtracting in context
        key_prerequisites: [adding-subtracting-fractions]
        step_check:
          step: 'Rewrite 3/4 as 9/12.'
          question: 'Why rewrite $3/4$ as $9/12$ before subtracting $5/12$?'
          options:
            - 'Subtracting directly gives $\frac{3-5}{4-12}$, which is the same amount'
            - 'Numerators can be subtracted only when both fractions count twelfths'
            - 'The tank holds more water when it is measured in twelfths than quarters'
            - 'Rewriting makes the first fraction bigger, so the difference is positive'
          answer: 'Numerators can be subtracted only when both fractions count twelfths'
          why: '$3/4$ and $9/12$ name the same amount of water; in twelfths, $9-5=4$ twelfths remain.'
        exemplars:
          - problem: 'Lena ran $\frac{3}{4}$ km, rested, then ran $\frac{2}{3}$ km. How far did she run in total?'
            answer: "17/12"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Over $12$: $\frac{9}{12}+\frac{8}{12}=\frac{17}{12}$. She ran $\frac{17}{12}$ km, which is $1\frac{5}{12}$ km.'
          - problem: 'A recipe needs $\frac{2}{3}$ cup of milk, and you have measured $\frac{1}{2}$ cup. How much more milk do you need?'
            answer: "1/6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Over $6$: $\frac{4}{6}-\frac{3}{6}=\frac{1}{6}$. You need $\frac{1}{6}$ cup more.'
          - problem: 'A painter used $\frac{5}{6}$ of a can of paint on one wall and $\frac{1}{4}$ of a can on another. How much paint did he use in total?'
            answer: "13/12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Over $12$: $\frac{10}{12}+\frac{3}{12}=\frac{13}{12}$. He used $\frac{13}{12}$ cans, which is $1\frac{1}{12}$ cans.'
          - problem: 'A tank is $\frac{7}{8}$ full. After some water is used, it is $\frac{1}{3}$ full. What fraction of the tank was used?'
            answer: "13/24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Over $24$: $\frac{21}{24}-\frac{8}{24}=\frac{13}{24}$. The water used is $\frac{13}{24}$ of the tank.'
        constraints: "denominators up to 12; exact fraction answers in lowest terms"
      - id: kp2
        name: Fraction-of-a-quantity in context
        key_prerequisites: [multiplying-fractions]
        step_check:
          step: 'one seventh measures $32 \div 4 = 8$ cm'
          question: 'Why is $32$ divided by $4$?'
          options:
            - 'The $32$ cm left is four sevenths, so one seventh is a quarter of it'
            - '$32$ cm is the three sevenths that were used, so split it into parts'
            - 'The roll was cut into four equal pieces before any tape was used'
            - 'The whole roll is $32$ cm, so a seventh of it is $32$ split by $4$'
          answer: 'The $32$ cm left is four sevenths, so one seventh is a quarter of it'
          why: 'Using $\frac{3}{7}$ leaves $\frac{4}{7}$, and the $32$ cm is that remaining part, so each seventh is $32\div4=8$ cm.'
        exemplars:
          - problem: 'Of $24$ students, $\frac{3}{8}$ play football. How many students do NOT play football?'
            answer: "15"
            answer_contract: {kind: exact}
            solution_sketch: '$\frac{3}{8} \times 24 = 9$ play; $24 - 9 = 15$ do not.'
          - problem: 'Maria has read $\frac{3}{5}$ of a $20$-page booklet. How many pages remain?'
            answer: "8"
            answer_contract: {kind: exact}
            solution_sketch: '$\frac{3}{5} \times 20 = 12$; $20 - 12 = 8$.'
          - problem: 'A library has $36$ new books. Five ninths are fiction; the rest are reference books. How many reference books are there?'
            answer: "16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Fiction accounts for $(36\div9)\times5=20$ books; $36-20=16$ are reference books.'
          - problem: 'A tank holds $45$ litres when full. It is currently $\frac{2}{9}$ full. How many more litres are needed to fill it?'
            answer: "35"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\frac{2}{9} \times 45 = 10$; $45 - 10 = 35$.'
        constraints: "two steps; whole-number answers"
      - id: kp3
        name: Division and multi-step problems
        key_prerequisites: [dividing-fractions]
        step_check:
          step: 'Count the bottles by dividing'
          question: 'Why is the number of bottles $20 \div \frac{4}{7}$?'
          options:
            - 'Each bottle is $\frac{4}{7}$ of the vat, so there are $20\times\frac{4}{7}$'
            - 'Dividing by a fraction always gives a number smaller than $20$'
            - 'It counts how many $\frac{4}{7}$-litre portions fit into $20$ litres'
            - 'The bottles share the $20$ litres, so each gets $\frac{4}{7}$ of it'
          answer: 'It counts how many $\frac{4}{7}$-litre portions fit into $20$ litres'
          why: 'Counting portions of one size inside a total is division; $20\div\frac{4}{7}=35$, more than $20$ because each portion is less than a litre.'
        exemplars:
          - problem: 'How many $\frac{2}{3}$-cup servings can be poured from $4$ cups of juice?'
            answer: "6"
            answer_contract: {kind: exact}
            solution_sketch: '$4 \div \frac{2}{3} = 4 \times \frac{3}{2} = 6$.'
          - problem: 'Each muffin uses $\frac{1}{4}$ cup of sugar. How many muffins can be made with $3$ cups?'
            answer: "12"
            answer_contract: {kind: exact}
            solution_sketch: '$3 \times \frac{4}{1} = \frac{12}{1} = 12$.'
          - problem: 'A $6$-metre path is paved with tiles that each cover $3/5$ metre along its length. How many tiles are needed?'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the path length by one tile length: $6\div(3/5)=6\times5/3=10$ tiles.'
          - problem: 'Each candle uses $\frac{5}{8}$ cup of wax. How many candles can be made with $10$ cups of wax?'
            answer: "16"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$10 \times \frac{8}{5} = \frac{80}{5} = 16$.'
        constraints: "division by a fraction; whole-number answers"
    diagnostic_exemplar:
      problem: 'How many $\frac{3}{4}$-litre bottles can be filled from $6$ litres of juice?'
      answer: "8"
      solution_sketch: 'This is a division: $6 \div \frac{3}{4} = 6 \times \frac{4}{3} = 8$.'
    anki_seeds:
      - front: "A word problem asking 'how many pieces of size a/b fit into c' is solved by computing..."
        back: "c divided by a/b (multiply c by the reciprocal)"
        type: basic

  # --------------------------------------------------------------------- #
  # Decimals
  # --------------------------------------------------------------------- #
  - id: decimal-place-value
    name: Decimal Place Value
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: expression
    expected_time_secs: 40
    prerequisites:
      - id: place-value
        weight: 0.8
        key: true
      - id: fraction-basics
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Tenths and hundredths
        key_prerequisites: [place-value]
        step_check:
          step: 'The tenths place has value 0.1 per unit'
          question: 'Why is the $9$ in $7.92$ worth $0.9$ and not $9$?'
          options:
            - 'The $9$ is divided by the $2$ that follows it in the number'
            - 'Digits after the decimal point are worth their face value'
            - 'It sits in the tenths place, so it counts $9$ lots of $0.1$'
            - 'It is the second digit, so it is worth $9\times0.01$'
          answer: 'It sits in the tenths place, so it counts $9$ lots of $0.1$'
          why: 'The first place after the point counts tenths, so a digit there is worth that digit times $0.1$. Here $9\times0.1=0.9$.'
        exemplars:
          - problem: 'What digit is in the tenths place of $3.47$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tenths place is the first place after the decimal point. In $3.47$ that digit is $4$, and the $7$ is in the hundredths place.'
          - problem: 'What is the value of the digit $6$ in $0.65$?'
            answer: '0.6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $6$ is the first digit after the point, so it is in the tenths place. Its value is $6$ tenths, which is $0.6$.'
          - problem: 'What digit is in the hundredths place of $5.82$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The hundredths place is the second place after the decimal point. In $5.82$ that digit is $2$.'
          - problem: 'What number must be added to $0.9$ to make $0.93$?'
            answer: '0.03'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $0.93$ is $9$ tenths and $3$ hundredths. The $0.9$ already has the $9$ tenths, so the missing part is $0.03$.'
          - problem: 'The odometer of a bicycle shows $12.58$ km. Which digit of the reading shows the hundredths of a kilometre?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The hundredths digit is the second digit after the point. In $12.58$ that digit is $8$.'
          - problem: 'A sprinter runs $100$ m in $10.84$ seconds. What is the value of the digit $8$ in this time, in seconds?'
            answer: '0.8'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The $8$ is the first digit after the point, so it is in the tenths place. Its value is $8\times0.1=0.8$ seconds.'
          - problem: 'A strip is cut into $10$ equal pieces, and each piece is cut into $10$ smaller pieces. Mia colours $3$ of the large pieces and $5$ of the small pieces. What decimal part of the whole strip is coloured?'
            answer: '0.35'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each large piece is $0.1$ of the strip, and each small piece is $0.01$. So $3\times0.1+5\times0.01=0.35$.'
          - problem: 'Sam says that the digit $8$ in $0.58$ is worth $8$ tenths. What is the value of the $8$?'
            answer: '0.08'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $8$ is the second digit after the point, so it is in the hundredths place. Its value is $8\times0.01=0.08$.'
        constraints: "numbers with 1-2 decimal places"
      - id: kp2
        name: Decimals as fractions over 10 and 100
        key_prerequisites: [fraction-basics]
        step_check:
          step: 'Each tenth equals ten hundredths, so $9$ tenths equal $9\times10$ hundredths'
          question: 'Why do $9$ tenths make $90$ hundredths?'
          options:
            - 'Each tenth is cut into $10$ hundredths, so $9$ tenths give $9\times10$'
            - 'A hundredth is ten times larger than a tenth, so there are ten times more'
            - 'Tenths and hundredths are equal in size, so the count stays at $9$'
            - 'The $0$ in $0.90$ is a new digit that adds $90$ to the number'
          answer: 'Each tenth is cut into $10$ hundredths, so $9$ tenths give $9\times10$'
          why: 'One tenth is the same length as $10$ hundredths, so $9$ tenths hold $9\times10=90$ hundredths. That gives $0.9=\frac{90}{100}$.'
        try_first:
          problem: 'How many hundredths make one tenth?'
          answer_contract: {"kind":"exact"}
          answer: '10'
          reveal: 'Ten hundredths make one tenth, because $0.1=0.10$. That is why $0.9=\frac{9}{10}=\frac{90}{100}$.'
        exemplars:
          - problem: 'Write $0.7$ as a fraction.'
            answer: '7/10'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'One decimal place means tenths. So $0.7$ is $7$ tenths, which is $\frac{7}{10}$.'
          - problem: 'A grid has $100$ equal cells and $29$ of them are shaded. What fraction of the grid is shaded?'
            answer: '29/100'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Each cell is $\frac{1}{100}$ of the grid. So $29$ cells make $\frac{29}{100}$, which is $0.29$ as a decimal.'
          - problem: 'Write $\frac{3}{10}$ as a decimal.'
            answer: '0.3'
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'A denominator of $10$ means tenths. So $\frac{3}{10}=3\div10=0.3$, which is the same number written as a decimal.'
          - problem: 'How many hundredths is $0.9$?'
            answer: '90'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $0.9=0.90$. That is $90$ hundredths, because each tenth is $10$ hundredths and $9\times10=90$.'
          - problem: 'A wire is $0.47$ m long. What fraction of a metre is that?'
            answer: '47/100'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Two decimal places mean hundredths. So $0.47$ m is $\frac{47}{100}$ of a metre.'
          - problem: 'A shop sells a sticker for one hundredth of a euro. What is the price of $63$ stickers in euros?'
            answer: '0.63'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Each sticker costs $\frac{1}{100}$ of a euro, so $63$ stickers cost $\frac{63}{100}$ of a euro. That is $0.63$ euro.'
          - problem: 'A water tank is $\frac{7}{100}$ full. What decimal part of the tank is full?'
            answer: '0.07'
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Hundredths need two decimal places. So $\frac{7}{100}=0.07$, with a zero in the tenths place.'
          - problem: 'Sam says $0.07=\frac{7}{10}$. What fraction is correct?'
            answer: '7/100'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The $7$ is in the hundredths place, not the tenths place. So $0.07=\frac{7}{100}$.'
          - problem: 'A point on a number line lies $0.83$ of the way from $0$ to $1$. Write its position as a fraction.'
            answer: '83/100'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Two decimal places mean hundredths. The point is $83$ steps of $\frac{1}{100}$ from zero, so it sits at $\frac{83}{100}$.'
        constraints: "denominators 10 or 100; no simplifying required"
      - id: kp3
        name: Thousandths
        key_prerequisites: [place-value]
        step_check:
          step: 'The thousandths place has value 0.001 per unit'
          question: 'Why is the $6$ in $9.246$ worth $0.006$ and not $0.6$?'
          options:
            - 'The $6$ is the last digit, so it is always worth $0.006$'
            - 'Small digits such as $6$ are worth less than large digits'
            - 'Three digits follow the point, so the $6$ is multiplied by $0.3$'
            - 'The $6$ is in the third place after the point: thousandths'
          answer: 'The $6$ is in the third place after the point: thousandths'
          why: 'The places after the point are tenths, hundredths and thousandths, and the $6$ is in the third one. So its value is $6\times0.001=0.006$.'
        exemplars:
          - problem: 'What is the value of the digit $5$ in $2.359$?'
            answer: '0.05'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $5$ is the second digit after the point, so it is in the hundredths place. Its value is $5\times0.01=0.05$.'
          - problem: 'What digit is in the thousandths place of $0.408$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The thousandths place is the third place after the decimal point. In $0.408$ that digit is $8$.'
          - problem: 'If $4.196=4+0.1+x+0.006$, what is $x$?'
            answer: '0.09'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The missing place is the hundredths place, and its digit in $4.196$ is $9$. So $x=9\times0.01=0.09$.'
          - problem: 'A sheet of paper is $0.104$ mm thick. How many thousandths of a millimetre is that?'
            answer: '104'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three decimal places mean thousandths. So $0.104$ mm is $104$ thousandths of a millimetre.'
          - problem: 'A pharmacist weighs a sample at $0.382$ g. What is the value of the digit $8$ in grams?'
            answer: '0.08'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            solution_sketch: 'The $8$ is the second digit after the point, so it is in the hundredths place. Its value is $8\times0.01=0.08$ g.'
          - problem: 'Write $0.049$ as a fraction.'
            answer: '49/1000'
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Three decimal places mean thousandths, and the last digits $049$ count $49$ of them. So $0.049=\frac{49}{1000}$.'
          - problem: 'Sam says that $0.405$ has a $5$ in the hundredths place. What digit is in the hundredths place?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The hundredths place is the second place after the point. In $0.405$ that digit is $0$, and the $5$ is in the thousandths place.'
          - problem: 'A parcel has a mass of $2.375$ kg. How many grams is that?'
            answer: '2375'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            solution_sketch: 'One thousandth of a kilogram is one gram. So $2.375$ kg is $2375$ thousandths of a kilogram, which is $2375$ g.'
        constraints: "numbers with 3 decimal places"
    diagnostic_exemplar:
      problem: 'Write $0.037$ as a fraction.'
      answer: '37/1000'
      solution_sketch: 'Three decimal places means thousandths.'
    anki_seeds:
      - front: "In 0.47, the 4 is in the {{c1::tenths}} place and the 7 is in the {{c2::hundredths}} place."
        back: "tenths; hundredths"
        type: cloze

  - id: comparing-ordering-decimals
    name: Comparing and Ordering Decimals
    core: true
    difficulty: 0.22
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: decimal-place-value
        weight: 0.9
        key: true
      - id: comparing-ordering-whole-numbers
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Comparing two decimals
        key_prerequisites: [decimal-place-value]
        step_check:
          step: 'Writing the pair as $0.90$ and $0.48$ aligns equal place values.'
          question: 'Why rewrite $0.9$ as $0.90$ before comparing it with $0.48$?'
          options:
            - 'Only decimals with equally many digits can ever be compared'
            - 'It lines up tenths with tenths and hundredths with hundredths'
            - 'The extra zero makes $0.9$ ten times larger, so it is easier'
            - 'A decimal with two digits is always larger than one with one digit'
          answer: 'It lines up tenths with tenths and hundredths with hundredths'
          why: 'The zero adds nothing to the value; it only lets the digits be compared place by place, tenths first.'
        exemplars:
          - problem: 'Which is larger, $0.7$ or $0.65$?'
            answer: "0.7"
            solution_sketch: 'Compare tenths: $7 > 6$, so $0.7 > 0.65$.'
          - problem: 'Two runners finish a race in $2.09$ minutes and $2.4$ minutes. Which time is faster?'
            answer: "2.09"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Pad $2.4$ to $2.40$. Since $2.09<2.40$, the smaller time $2.09$ minutes is faster.'
          - problem: 'Which lies farther right on a number line, $0.45$ or $0.5$?'
            answer: "0.5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $0.5$ as $0.50$, which is fifty hundredths, while $0.45$ is forty-five hundredths. The larger number $0.5$ lies farther right.'
          - problem: 'A shelf opening is $3.08$ m wide. A board is $3.2$ m long. Which measurement is smaller?'
            answer: "3.08"
            solution_sketch: 'Write $3.2=3.20$. The tenths digits $0<2$ establish $3.08<3.20$.'
          - problem: 'Which is smaller, $0.099$ or $0.1$?'
            answer: "0.099"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Pad $0.1$ to $0.100$. At the tenths place $0<1$, so $0.099$ is smaller even though it has more digits.'
          - problem: 'Write a decimal that is greater than $0.3$ but less than $0.31$.'
            answer: "0.305"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "0.3", "high": "0.31"}}
            solution_sketch: 'Pad to thousandths: $0.300$ and $0.310$. Any decimal strictly between them works, such as $0.305$, $0.301$ or $0.3099$.'
        constraints: "1-2 decimal places; traps where more digits does not mean larger"
      - id: kp2
        name: Trailing zeros
        key_prerequisites: [decimal-place-value]
        step_check:
          step: 'Drop the three end zeros.'
          question: 'Why does dropping the end zeros of $1.7000$ leave the length unchanged?'
          options:
            - 'Each end zero counts zero of its place, so it adds nothing'
            - 'Zeros at the end of any number can be dropped freely'
            - 'The seven moves left to fill the empty places the zeros leave'
            - 'Zeros after a decimal point never change any number'
          answer: 'Each end zero counts zero of its place, so it adds nothing'
          why: 'A zero after the last nonzero decimal digit means none of that place; dropping zeros from a whole number such as $170$ does change it, because there the zero fixes the place of the $7$.'
        exemplars:
          - problem: 'Which of $0.3$, $0.30$, $0.03$ and $0.300$ has a different value from the other three?'
            answer: "0.03"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The trailing zeros in $0.30$ and $0.300$ add nothing, so both equal $0.3$, three tenths. The number $0.03$ is three hundredths, so it is the odd one out.'
          - problem: 'How many hundredths are there in $0.4$?'
            answer: "40"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $0.4$ as $0.40$; the trailing zero does not change the value. So $0.4$ is $40$ hundredths.'
          - problem: 'Sam says $0.50$ is ten times as large as $0.5$, because $50$ is ten times $5$. Is Sam right?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["no","he is not right","sam is not right","not right","he is wrong","sam is wrong","wrong"],["yes","he is right","sam is right","right"]]}
            solution_sketch: 'Both numbers are five tenths; the zero in the hundredths place of $0.50$ adds nothing. So $0.50=0.5$ and Sam is not right.'
          - problem: 'Compute $0.60 - 0.6$.'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The trailing zero means $0.60$ is the same number as $0.6$. A number minus itself is $0$.'
          - problem: 'A board is labelled $3.20$ m and another is labelled $3.2$ m. Are the two boards the same length?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes","they are","same","the same","same length","they are the same length"],["no","they are not","different","not the same"]]}
            solution_sketch: 'Both labels mean three metres and two tenths of a metre. The trailing zero in $3.20$ adds no length, so yes, the boards are the same length.'
          - problem: 'How many thousandths are there in $0.6$?'
            answer: "600"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $0.6$ as $0.600$ by adding trailing zeros, which leaves the value unchanged. So $0.6$ is $600$ thousandths.'
        constraints: "pairs differing only by trailing zeros"
      - id: kp3
        name: Ordering lists of decimals
        key_prerequisites: [decimal-place-value]
        step_check:
          step: 'so $4.475$ is the least of the three even though it carries the most digits'
          question: 'Why is $4.475$ the least of $4.5$, $4.475$ and $4.51$?'
          options:
            - 'Its last digit is smaller than the other last digits'
            - 'A decimal with more digits is always the smaller one'
            - 'Its hundredths digit $7$ is larger, so the number is smaller'
            - 'Its tenths digit $4$ is smaller than the other tenths digits'
          answer: 'Its tenths digit $4$ is smaller than the other tenths digits'
          why: 'Decimals with the same whole part are decided at the first place where they differ, here the tenths; the number of digits does not decide the order.'
        exemplars:
          - problem: 'Order from least to greatest: $0.3$, $0.28$, $0.302$.'
            answer: "0.28, 0.3, 0.302"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: 'Pad to thousandths: $0.300$, $0.280$, $0.302$. Compared place by place, the order is $0.28$, $0.3$, $0.302$.'
          - problem: 'Which is greatest: $1.45$, $1.5$, or $1.405$?'
            answer: "1.5"
            solution_sketch: 'Comparing place by place, $1.5$ is the greatest of $1.45$, $1.5$, $1.405$.'
          - problem: 'Three race times are $0.6$, $0.55$, and $0.603$ minutes. Which is the middle time?'
            answer: "0.6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Align thousandths: $0.550<0.600<0.603$. The middle value is $0.6$ minutes.'
          - problem: 'Which of $2.07$, $2.7$ and $2.099$ lies farthest left on a number line?'
            answer: "2.07"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Align places: $2.070<2.099<2.700$. The least number, $2.07$, lies farthest left.'
          - problem: 'Order from greatest to least: $5.06$, $5.6$, $5.059$.'
            answer: "5.6, 5.06, 5.059"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: 'Pad to thousandths: $5.060$, $5.600$, $5.059$. The tenths decide that $5.6$ is greatest, and the thousandths put $5.06$ above $5.059$, giving $5.6$, $5.06$, $5.059$.'
          - problem: 'Order from least to greatest: $1.3$, $1.03$, $1.29$, $1.301$.'
            answer: "1.03, 1.29, 1.3, 1.301"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: 'Pad to thousandths: $1.300$, $1.030$, $1.290$, $1.301$. Comparing place by place gives $1.03$, $1.29$, $1.3$, $1.301$.'
        constraints: "3 decimals with different numbers of places"
    diagnostic_exemplar:
      problem: 'Order from least to greatest: $0.4$, $0.38$, $0.409$.'
      answer: '0.38, 0.4, 0.409'
      solution_sketch: 'Pad to three places: $0.400$, $0.380$, $0.409$.'
    anki_seeds:
      - front: "To compare decimals, line up the decimal points and compare digits..."
        back: "place by place from left to right (pad with trailing zeros if needed)"
        type: basic

  - id: rounding-decimals
    name: Rounding Decimals
    core: false                # estimation leaf; rounding-whole-numbers stays core
    difficulty: 0.24
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: decimal-place-value
        weight: 0.8
        key: true
      - id: rounding-whole-numbers
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: Round to the nearest whole number
        key_prerequisites: [rounding-whole-numbers]
        step_check:
          step: 'The tenths digit is 5, exactly at the halfway boundary'
          question: 'Why is $15.5$ exactly halfway between $15$ and $16$?'
          options:
            - 'Half of $15$ is $7.5$, so $15.5$ lies at the middle of the range'
            - 'It is $0.5$ above $15$ and $0.5$ below $16$, so they are equal'
            - 'The whole part $15$ is odd, so the decimal part must be half'
            - 'A tenths digit of $5$ is still below $16$, so it is nearer to $15$'
          answer: 'It is $0.5$ above $15$ and $0.5$ below $16$, so they are equal'
          why: 'The distance from $15$ is $15.5-15=0.5$ and the distance to $16$ is $16-15.5=0.5$. With equal distances, the rule that halves round up sends $15.5$ to $16$.'
        exemplars:
          - problem: 'Round $3.6$ to the nearest whole number.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $3.6$ is $0.4$ from $4$ and $0.6$ from $3$. So it is nearer to $4$.'
          - problem: 'A scale reads $12.38$ kg. What is the mass to the nearest whole kilogram?'
            answer: '12'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The reading $12.38$ is $0.38$ from $12$ and $0.62$ from $13$. So it rounds to $12$ kg.'
          - problem: 'Round $8.5$ to the nearest whole number.'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $8.5$ is $0.5$ from $8$ and $0.5$ from $9$. By the usual rule, a half rounds up, so the result is $9$.'
          - problem: 'A road sign says the next town is $15.29$ km away. What is that distance to the nearest kilometre?'
            answer: '15'
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The distance $15.29$ is $0.29$ from $15$ and $0.71$ from $16$. So it rounds to $15$ km.'
          - problem: 'Sam rounds $29.49$ to the nearest whole number by first rounding $0.49$ up to $0.5$ and then up again, to get $30$. What is the correct result?'
            answer: '29'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only the tenths digit matters, and it is $4$. So $29.49$ is nearer to $29$ than to $30$, and Sam must not round twice.'
          - problem: 'The temperature at noon was $18.7$ degrees Celsius. What is it to the nearest degree?'
            answer: '19'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number $18.7$ is $0.7$ from $18$ and $0.3$ from $19$. So it rounds to $19$.'
        constraints: "1-2 decimal places"
      - id: kp2
        name: Round to the nearest tenth or hundredth
        key_prerequisites: [decimal-place-value]
        step_check:
          step: 'Round the tenths digit 8 up to 9'
          question: 'Why does $9.85$ round up to $9.9$ and not down to $9.8$?'
          options:
            - 'The tenths digit $8$ is large, so it has to go up by one'
            - 'Rounding to the nearest tenth always raises the last kept digit'
            - 'The hundredths digit $5$ is dropped, and the tenths digit stays at $8$'
            - 'The hundredths digit is $5$ or more, so $9.85$ rounds up to $9.9$'
          answer: 'The hundredths digit is $5$ or more, so $9.85$ rounds up to $9.9$'
          why: 'Rounding to the nearest tenth looks at the hundredths digit. A $5$ or more means the number is at least halfway to the next tenth, so $9.85$ becomes $9.9$.'
        exemplars:
          - problem: 'Round $0.847$ to the nearest tenth.'
            answer: '0.8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The hundredths digit is $4$, which is less than $5$. So the tenths digit $8$ stays, and the result is $0.8$.'
          - problem: 'Round $2.463$ to the nearest hundredth.'
            answer: '2.46'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The thousandths digit is $3$, which is less than $5$. So the hundredths digit $6$ stays, and the result is $2.46$.'
          - problem: 'A digital scale reads $0.256$ kg but shows only two decimal places. What does it show?'
            answer: '0.26'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The thousandths digit is $6$, so the hundredths digit rises from $5$ to $6$. The display shows $0.26$ kg.'
          - problem: 'A sprinter runs $100$ m in $10.847$ seconds. What is the time to the nearest hundredth of a second?'
            answer: '10.85'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The thousandths digit is $7$, so the hundredths digit $4$ rises to $5$. The time is $10.85$ seconds.'
          - problem: 'On a number line marked in tenths, which mark is closest to $5.734$?'
            answer: '5.7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The distance to $5.7$ is $5.734-5.7=0.034$. The distance to $5.8$ is $0.066$, so $5.7$ is closest.'
          - problem: 'Sam rounds $3.449$ to the nearest tenth by first rounding to $3.45$ and then to $3.5$. What is the correct result?'
            answer: '3.4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only the hundredths digit matters, and it is $4$. So $3.449$ rounds to $3.4$, and Sam must not round twice.'
          - problem: 'A pool is $2.347$ m deep. What is its depth to the nearest centimetre?'
            answer: '2.35'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'A centimetre is $0.01$ m, so round to the hundredths place. The thousandths digit $7$ raises $2.34$ to $2.35$ m.'
        constraints: "2-3 decimal places"
      - id: kp3
        name: Money and carrying the round
        key_prerequisites: [rounding-whole-numbers]
        step_check:
          step: 'The carry passes through both nines after the decimal point'
          question: 'Why does adding one cent to $19.99$ give $20.00$?'
          options:
            - 'Each $9$ plus one unit makes ten, so write $0$ and carry $1$'
            - 'Each $9$ rounds down to $8$ and the extra cent is lost on the way'
            - 'The cent is added to the last digit only, so the result is $19.100$'
            - 'The two nines are removed and the whole part rises by $1$ for each'
          answer: 'Each $9$ plus one unit makes ten, so write $0$ and carry $1$'
          why: 'In $19.99$, the last $9$ plus $1$ makes ten, so write $0$ and carry $1$. The carry turns the next $9$ into $0$ as well, and the whole part becomes $20$.'
        try_first:
          problem: 'What is $0.99+0.01$?'
          answer_contract: {"kind":"exact"}
          answer: '1'
          reveal: 'The sum is $1$: the last $9$ plus $1$ makes ten, so a zero is written and one is carried, again into the next place. Rounding up a $9$ works in the same way.'
        exemplars:
          - problem: 'A bill comes to $7.483$ euros. What is the amount to the nearest cent?'
            answer: '7.48'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'A cent is $0.01$ euro, so round to the hundredths place. The thousandths digit $3$ is less than $5$, so the amount is $7.48$ euros.'
          - problem: 'Round $9.96$ to the nearest tenth.'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The hundredths digit $6$ rounds the $9$ up. The carry goes into the ones place, so the result is $10.0$.'
          - problem: 'A checkout computes $4.996$ euros before rounding. What is the amount to pay, to the nearest cent?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The thousandths digit is $6$, so $4.99$ gains $0.01$. The carry passes through both nines, giving $5.00$ euros.'
          - problem: 'Round $2.995$ to the nearest hundredth.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The thousandths digit is $5$, so a half rounds up. The carry passes through both nines, giving $3.00$.'
          - problem: 'Three friends share a bill of $50$ euros equally. How much does each friend pay, to the nearest cent?'
            answer: '16.67'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Each friend pays $50\div3=16.666\ldots$ euros. The thousandths digit is $6$, so $16.66$ rounds up to $16.67$ euros.'
          - problem: 'Cheese costs $6.99$ euros per kilogram. Ben buys $0.35$ kg. What does he pay, to the nearest cent?'
            answer: '2.45'
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The cost is $6.99\times0.35=2.4465$ euros. The thousandths digit is $6$, so $2.44$ rounds up to $2.45$ euros.'
          - problem: 'Sam rounds $5.996$ to the nearest hundredth and writes $5.90$. What is the correct result?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The thousandths digit is $6$, so the hundredths digit $9$ rounds up. The carry passes through both nines, giving $6.00$.'
        constraints: "include cases where rounding carries across places"
    diagnostic_exemplar:
      problem: 'Round $6.97$ to the nearest tenth.'
      answer: "7.0"
      solution_sketch: 'The hundredths digit $7$ rounds the $9$ up, and the carry makes it $7.0$.'
    anki_seeds:
      - front: "Rounding decimals uses the same rule as whole numbers: look at the digit..."
        back: "one place to the right of the target place (5 or more rounds up)"
        type: basic

  - id: decimal-multiplication-powers-of-ten
    name: Decimals Times Powers of Ten
    core: true
    difficulty: 0.22
    drill: false
    answer_kind: numeric
    expected_time_secs: 40
    prerequisites:
      - id: decimal-place-value
        weight: 0.9
        key: true
      - id: multiplying-by-powers-of-ten
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Multiply by 10 and 100
        key_prerequisites: [multiplying-by-powers-of-ten]
        step_check:
          step: 'Multiplying by 100 moves the decimal point two places to the right.'
          question: 'Why does multiplying by $100$ move the decimal point two places right?'
          options:
            - 'Each digit becomes worth $100$ times as much, two places higher'
            - 'Multiplying by $100$ adds two zeros to the end of $7.2$'
            - 'The number $7.2$ has exactly two digits, so the point moves two'
            - 'Multiplying always moves the decimal point right by two places'
          answer: 'Each digit becomes worth $100$ times as much, two places higher'
          why: 'Every place is worth ten times the place to its right, so a hundredfold value means two places left for each digit; writing $7.200$ adds zeros but leaves the value unchanged.'
        exemplars:
          - problem: 'Compute $0.47 \times 10$.'
            answer: "4.7"
            solution_sketch: 'Move the decimal point one place right.'
          - problem: 'A hundred identical packets each weigh $3.6$ g. What is their total mass in grams?'
            answer: "360"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            solution_sketch: 'One hundred groups of $3.6$ give $3.6\times100=360$ g.'
          - problem: 'A place-value chart shifts every digit of $0.09$ one column left. What number results?'
            answer: "0.9"
            solution_sketch: 'Nine hundredths become nine tenths after multiplication by $10$: $0.09\times10=0.9$.'
          - problem: 'Convert $1.25$ metres to centimetres, using $100$ centimetres per metre.'
            answer: "125"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: '$1$ m contributes $100$ cm and $0.25$ m contributes $25$ cm, totalling $125$ cm.'
        constraints: "1-2 decimal places"
      - id: kp2
        name: Divide by 10 and 100
        key_prerequisites: [decimal-place-value]
        step_check:
          step: 'Dividing by 100 moves the decimal point two places to the left.'
          question: 'Why does dividing by $100$ move the decimal point two places left?'
          options:
            - 'Dividing by $100$ removes two zeros from the end of the number'
            - 'The answer must always be less than $1$, so the point moves left'
            - 'The point moves left one place for each digit of the number $156$'
            - 'Each digit becomes worth one hundredth as much, two places lower'
          answer: 'Each digit becomes worth one hundredth as much, two places lower'
          why: 'Each place is worth one tenth of the place to its left, so dividing by $100$ moves every digit two places right, which reads as the point moving two places left; $156$ has no end zeros to remove.'
        exemplars:
          - problem: 'Compute $25 \div 100$.'
            answer: "0.25"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing by $100$ moves every digit two places to the right of where it was. The $2$ tens become $2$ tenths and the $5$ ones become $5$ hundredths, so the result is $0.25$.'
          - problem: 'Share $4.2$ litres equally among ten bottles. How many litres go into each?'
            answer: "0.42"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Ten equal shares give $4.2\div10=0.42$ litre per bottle.'
          - problem: 'Convert $6$ centimetres to metres, using $100$ centimetres per metre.'
            answer: "0.06"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Six centimetres are six hundredths of a metre: $6/100=0.06$ m.'
          - problem: 'A place-value chart shifts the digits of $18.5$ one column right. What number results?'
            answer: "1.85"
            solution_sketch: 'The tens become ones, ones become tenths, and tenths become hundredths: $18.5\div10=1.85$.'
          - problem: 'Compute $3.4 \div 100$.'
            answer: "0.034"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing by $100$ moves the decimal point two places left. A zero fills the empty tenths place, so $3.4\div100=0.034$.'
          - problem: 'Ten identical pencils weigh $56$ g altogether. How much does one pencil weigh, in grams?'
            answer: "5.6"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            solution_sketch: 'One pencil weighs $56\div10$ grams. Dividing by $10$ moves the decimal point one place left, so each pencil weighs $5.6$ g.'
        constraints: "results have at most 3 decimal places"
      - id: kp3
        name: Thousands and combined moves
        key_prerequisites: [multiplying-by-powers-of-ten]
        step_check:
          step: 'Multiplying by 1000 moves the decimal point three places to the right.'
          question: 'Why does multiplying by $1000$ move the decimal point three places?'
          options:
            - '$0.048$ has three decimal places, so the point moves three'
            - '$1000=10\times10\times10$, and each $10$ moves it one place'
            - '$1000$ has three digits after its first digit, so add three zeros'
            - 'Each zero of $1000$ adds a zero to the end of $0.048$'
          answer: '$1000=10\times10\times10$, and each $10$ moves it one place'
          why: 'Multiplying by $1000$ is multiplying by $10$ three times, and each factor of $10$ shifts every digit one place left; the number of decimal places in $0.048$ plays no part.'
        exemplars:
          - problem: 'Compute $0.05 \times 1000$.'
            answer: "50"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying by $1000$ moves the decimal point three places right. Pad $0.05$ to $0.050$ and shift: $0.05\times1000=50$.'
          - problem: 'Compute $7.5 \div 1000$.'
            answer: "0.0075"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing by $1000$ moves the decimal point three places left. Zeros fill the tenths and hundredths places, so $7.5\div1000=0.0075$.'
          - problem: 'Convert $0.9$ kilometres to metres, using $1000$ metres per kilometre.'
            answer: "900"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Nine tenths of $1000$ metres is $900$ metres: $0.9\times1000=900$.'
          - problem: 'Divide $12$ by $10$, then divide the result by $100$. What number do you get?'
            answer: "0.012"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$12\div10=1.2$ and $1.2\div100=0.012$. The decimal point moves three places left in total, the same as dividing by $1000$.'
        constraints: "shifts of 3 places, may need padding zeros"
    diagnostic_exemplar:
      problem: 'Compute $6.3 \div 1000$.'
      answer: "0.0063"
      solution_sketch: 'Dividing by $1000$ moves the point three places left: $0.0063$.'
    anki_seeds:
      - front: "Multiplying a decimal by 10 moves the decimal point..."
        back: "one place to the right (dividing by 10 moves it one place left)"
        type: basic

  - id: decimal-addition-subtraction
    name: Adding and Subtracting Decimals
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: numeric
    expected_time_secs: 50
    prerequisites:
      - id: decimal-place-value
        weight: 0.8
        key: true
      - id: multi-digit-addition-subtraction
        weight: 0.8
        key: true
    knowledge_points:
      - id: kp1
        name: Adding decimals
        key_prerequisites: [multi-digit-addition-subtraction]
        step_check:
          step: 'Line up the decimal points'
          question: 'Why must the decimal points be lined up before the digits are added?'
          options:
            - 'The numbers then have the same count of digits in all'
            - 'The point is then in the right place for the answer'
            - 'The digits in one column then have the same place value'
            - 'Adding always starts at the decimal point and moves out'
          answer: 'The digits in one column then have the same place value'
          why: 'Only digits of the same place value can be added together: tenths with tenths, hundredths with hundredths. Lining up the points puts them in the same column.'
        exemplars:
          - problem: 'Compute $4.38 + 2.55$.'
            answer: "6.93"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Line up the points and add hundredths: $8+5=13$, write $3$ and carry $1$. Then $3+5+1=9$ tenths and $4+2=6$ ones, so the sum is $6.93$.'
          - problem: 'Join a $3.4$-metre cable and a $2.15$-metre cable. What is their total length?'
            answer: "5.55"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Write $3.4$ as $3.40$ so the hundredths line up. Then $3.40+2.15=5.55$ metres.'
          - problem: 'What is $9.08 + 0.7$?'
            answer: "9.78"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $0.7$ as $0.70$. Then $9.08=908/100$ and $0.70=70/100$, so the sum is $978/100=9.78$.'
          - problem: 'Maya runs $3.2$ km on Monday and $4.75$ km on Wednesday. How far has she run in all?'
            answer: "7.95"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Write $3.2$ as $3.20$. Then $3.20+4.75=7.95$, so she has run $7.95$ km.'
          - problem: 'Start at $4.6$ on a number line. Move $1$ unit right, then $0.75$ unit right. Which number are you at?'
            answer: "6.35"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Moving right adds. First $4.6+1=5.6$, then $5.60+0.75=6.35$.'
          - problem: 'Three parcels have masses $2.4$ kg, $0.85$ kg and $1.5$ kg. What is the mass of all three together?'
            answer: "4.75"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'Write every mass to two places: $2.40+0.85+1.50$. The sum is $4.75$ kg.'
          - problem: 'Sam adds $0.7 + 0.45$ and writes $0.52$. What is the correct sum?'
            answer: "1.15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam added $7+45$ without lining up the places. Write $0.7$ as $0.70$: $0.70+0.45=1.15$.'
        constraints: "1-3 decimal places; align the decimal points; sums of two or three numbers"
      - id: kp2
        name: Subtracting decimals
        key_prerequisites: [decimal-place-value]
        step_check:
          step: 'Write $9$ as $9.00$'
          question: 'Why is $9$ written as $9.00$ before $4.62$ is subtracted from it?'
          options:
            - 'It makes $9$ a larger number than it was before'
            - 'It gives $9$ the tenths and hundredths to regroup'
            - 'Whole numbers cannot be subtracted from decimals'
            - 'The answer needs the same count of digits as $9.00$'
          answer: 'It gives $9$ the tenths and hundredths to regroup'
          why: '$9$ and $9.00$ are the same number. The zeros only show the empty tenths and hundredths places, which the subtraction needs for regrouping.'
        exemplars:
          - problem: 'Compute $7.3 - 2.85$.'
            answer: "4.45"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $7.3$ as $7.30$. Regroup one tenth into ten hundredths: $7.30-2.85=4.45$.'
          - problem: 'A $6$-metre ribbon is shortened by $2.35$ metres. What length remains?'
            answer: "3.65"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Write $6=6.00$ and regroup one unit into hundredths: $6.00-2.35=3.65$ metres.'
          - problem: 'How far apart are the points $3.45$ and $8.2$ on a number line?'
            answer: "4.75"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The distance is the larger number minus the smaller. From $3.45$ to $4$ is $0.55$, and from $4$ to $8.2$ is $4.2$. Their sum is $4.75$.'
          - problem: 'A tank holds $12.5$ litres. After $4.75$ litres are drawn off, how much is left?'
            answer: "7.75"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Drawing off takes away. Write $12.5$ as $12.50$: $12.50-4.75=7.75$ litres.'
          - problem: 'Sam computes $10 - 4.6$ by taking $5$ from $10$ and stops at $5$. What is the correct value?'
            answer: "5.4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam took away $5$, which is $0.4$ more than $4.6$. So $0.4$ must be added back: $5+0.4=5.4$.'
          - problem: 'A runner finishes in $12.4$ seconds and the winner finishes in $11.85$ seconds. How much longer did the runner take?'
            answer: "0.55"
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The difference of the times is $12.40-11.85=0.55$. The runner took $0.55$ seconds longer.'
          - problem: 'What is $0.5 - 0.125$?'
            answer: "0.375"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $0.5$ as $0.500$. Then $500$ thousandths minus $125$ thousandths is $375$ thousandths, which is $0.375$.'
        constraints: "operands may have different numbers of decimal places"
      - id: kp3
        name: Money computations
        key_prerequisites: [multi-digit-addition-subtraction]
        step_check:
          step: 'Add the cents: 60 + 35 = 95 cents'
          question: 'Why does a sum of $95$ cents become $.95$ in the total?'
          options:
            - 'Cents are the digits written to the left of the point'
            - '$95$ cents is $95$ tenths of one euro, or $9.5$'
            - 'Every sum of cents is written with a point before it'
            - '$95$ cents is $95$ hundredths of one euro, or $0.95$'
          answer: '$95$ cents is $95$ hundredths of one euro, or $0.95$'
          why: 'One cent is one hundredth of a euro, so $95$ cents is $0.95$ euro. Written to the right of the point it joins the euros: $13+0.95=13.95$.'
        exemplars:
          - problem: 'A notebook costs €6.85 and a pen costs €2.40. What do they cost together?'
            answer: "9.25"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Add the cents: $85+40=125$ cents, which is one euro and $25$ cents. Then $6+2+1=9$ euros, so the cost is €9.25.'
          - problem: 'You pay for a €13.45 item with a €20 note. How much change do you get?'
            answer: "6.55"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Change is what remains of the note: $20.00-13.45=6.55$ euros.'
          - problem: 'A receipt lists €9.35 for food and €4.90 for drinks. What is the combined cost?'
            answer: "14.25"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Add the cents: $935+490=1425$ cents, which is €14.25.'
          - problem: 'An account balance of €20.00 falls to €17.60. How much was spent?'
            answer: "2.40"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The amount spent is the fall in the balance: $20.00-17.60=2.40$ euros.'
          - problem: 'Lena buys a €3.75 sandwich and a €1.90 juice and pays with a €10 note. How much change does she get?'
            answer: "4.35"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The two items cost $3.75+1.90=5.65$ euros. The change is $10.00-5.65=4.35$ euros.'
          - problem: 'Tom has €15.20. He spends €6.45 on a book and €2.80 on lunch. How much does he have left?'
            answer: "5.95"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'He spends $6.45+2.80=9.25$ euros in all. What is left is $15.20-9.25=5.95$ euros.'
          - problem: 'One shop sells a jacket for €48.90 and another sells the same jacket for €45.75. How much cheaper is the second shop?'
            answer: "3.15"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The difference of the two prices is $48.90-45.75=3.15$. The second shop is €3.15 cheaper.'
        constraints: "euro amounts to the cent; sums, change and differences"
    diagnostic_exemplar:
      problem: 'Compute $7 - 3.65$.'
      answer: "3.35"
      solution_sketch: 'Write $7$ as $7.00$ and line up the points: $7.00 - 3.65 = 3.35$.'
    anki_seeds:
      - front: "Before adding or subtracting decimals in columns, you must line up..."
        back: "the decimal points (pad with trailing zeros as needed)"
        type: basic

  - id: decimal-operations
    name: Decimal Operations
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: decimal-addition-subtraction
        weight: 0.8
        key: true
      - id: multi-digit-multiplication
        weight: 0.6
        key: true
      - id: long-division-one-digit
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: Multiply decimals
        key_prerequisites: [multi-digit-multiplication]
        step_check:
          step: 'Count the total decimal places in the factors'
          question: 'Why does the product $3.7 \times 0.9$ have two decimal places?'
          options:
            - 'The product has the same decimal places as the longer factor'
            - 'Each factor adds one place, because every decimal has one'
            - 'The point is always put two places from the right in a product'
            - 'Each factor is tenths, and tenths times tenths is hundredths'
          answer: 'Each factor is tenths, and tenths times tenths is hundredths'
          why: '$3.7\times0.9=\frac{37}{10}\times\frac{9}{10}=\frac{333}{100}$. Two tenths factors make hundredths, so the point goes two places from the right.'
        exemplars:
          - problem: 'Compute $0.6 \times 0.4$.'
            answer: "0.24"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$6\times4=24$, and the factors have $1+1=2$ decimal places in all. So $0.6\times0.4=0.24$.'
          - problem: 'Five jars each hold $1.2$ litres. How many litres do they hold altogether?'
            answer: "6"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Five groups of $1.2$ contain $5\times1.2=6$ litres.'
          - problem: 'Find the area of a rectangle with sides $2.5$ m and $0.3$ m.'
            answer: "0.75"
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area is $2.5\times0.3$. As fractions this is $(25/10)(3/10)=75/100$, so the area is $0.75$ square metre.'
          - problem: 'A unit square is divided into a $10 \times 10$ grid of equal cells. A rectangle $8$ cells wide and $7$ cells tall is shaded. What decimal part of the square is shaded?'
            answer: "0.56"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rectangle is $0.8$ of the square wide and $0.7$ of it tall, so it covers $0.8 \times 0.7 = 0.56$ of the square. Check by counting: $8 \times 7 = 56$ cells of the $100$.'
          - problem: 'Petrol costs €$1.80$ per litre. How much do $2.5$ litres cost?'
            answer: "4.5"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The cost is $2.5\times1.80$. Since $25\times18=450$ and the factors have two decimal places in total, the cost is €$4.50$.'
          - problem: 'Find the product of $1.2$ and $0.3$.'
            answer: "0.36"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$12\times3=36$, and the factors have two decimal places between them. So $1.2\times0.3=0.36$, which is a little more than a third of $1$.'
          - problem: 'A loaf needs $0.45$ kg of flour. How much flour do $6$ loaves need?'
            answer: "2.7"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'Six loaves need six times the flour of one loaf: $6\times0.45=2.7$ kg.'
          - problem: 'Dana computes $0.3 \times 0.2$ and writes $0.6$. What is the correct product?'
            answer: "0.06"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$3\times2=6$, and the factors have two decimal places in all. So the product is $0.06$, not $0.6$.'
          - problem: 'A cyclist rides at $14.5$ km per hour for $0.4$ hour. How far does she ride?'
            answer: "5.8"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Distance is speed times time: $14.5\times0.4=5.8$ km.'
        constraints: "at most 2 decimal places per factor"
      - id: kp2
        name: Divide by a whole number
        key_prerequisites: [long-division-one-digit]
        step_check:
          step: 'bring down the 2 to make 42 tenths'
          question: 'Why does bringing down the $2$ make $42$ tenths and not $42$ ones?'
          options:
            - 'The $2$ is a tenths digit, so each digit brought down is tenths'
            - 'The $4$ left over is $40$ tenths, and the $2$ adds two more'
            - 'The remainder $4$ is always written with a tenths place after it'
            - 'Bringing down a digit always multiplies the remainder by ten'
          answer: 'The $4$ left over is $40$ tenths, and the $2$ adds two more'
          why: 'The $4$ ones left over equal $40$ tenths. With the $2$ tenths of $11.2$ that makes $42$ tenths, and $42\div7=6$ tenths.'
        exemplars:
          - problem: 'Compute $8.4 \div 6$.'
            answer: "1.4"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$8.4$ is $84$ tenths, and $84\div6=14$. So there are $14$ tenths in each share, which is $1.4$.'
          - problem: 'Share $7.2$ litres equally among six containers. How many litres go in each?'
            answer: "1.2"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: '$7.2$ litres is $72$ tenths. Each container gets $72\div6=12$ tenths, or $1.2$ litres.'
          - problem: 'A rectangle has area $2.8$ square metres and length $5$ metres. What is its width?'
            answer: "0.56"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Width is area divided by length: $2.8\div5=280/500=0.56$ metre.'
          - problem: 'What number is halfway between $0$ and $1.7$ on a number line?'
            answer: "0.85"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Halfway means half of the span: $1.7\div2=170/200=0.85$.'
          - problem: 'Four friends split a bill of €$25.40$ equally. How much does each pay?'
            answer: "6.35"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Divide $25.40$ by $4$: $24\div4=6$ and $1.40\div4=0.35$. Each friend pays €$6.35$.'
          - problem: 'Dana divides $0.54 \div 6$ and writes $0.9$. What is the correct quotient?'
            answer: "0.09"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$0.54$ is $54$ hundredths, and $54\div6=9$. So the quotient is $9$ hundredths, $0.09$, with a zero in the tenths place.'
          - problem: 'A board $2.4$ m long is cut into $8$ equal pieces. How long is each piece?'
            answer: "0.3"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Equal pieces mean division: $2.4\div8$. $24$ tenths divided by $8$ is $3$ tenths, so each piece is $0.3$ m.'
        constraints: "1-digit divisor; quotients terminate within 2 decimal places"
      - id: kp3
        name: Divide by a decimal
        key_prerequisites: [long-division-one-digit]
        step_check:
          step: 'Multiply both numbers by ten to make the divisor whole'
          question: 'Why does multiplying both numbers by ten leave the answer to $0.96 \div 0.4$ unchanged?'
          options:
            - 'Multiplying by ten moves the point, and the point does not matter'
            - 'The quotient is about the same size, so a small change is fine'
            - 'Both numbers grow ten times, so the ratio of them is the same'
            - 'Dividing by ten after the division would undo the multiplication'
          answer: 'Both numbers grow ten times, so the ratio of them is the same'
          why: 'A quotient tells how many times the divisor fits into the dividend. Scaling both by ten scales the pieces and the whole alike, so $0.96\div0.4=9.6\div4$.'
        try_first:
          problem: 'How many $0.2$-litre cups can be filled from a $1.2$-litre jug?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'The question is how many times $0.2$ fits into $1.2$, which is a division. Multiplying both by ten gives $12\div2=6$, because a ratio of two numbers does not change when both are scaled.'
        exemplars:
          - problem: 'Compute $4.5 \div 0.5$.'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scale both numbers by $10$ to make the divisor whole: $45 \div 5 = 9$.'
          - problem: 'How many $0.07$-metre pieces can be cut from $0.84$ metre of ribbon?'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of pieces is $0.84\div0.07$. Scale both measurements by $100$: $84\div7=12$ pieces.'
          - problem: 'A rectangle has area $3.6$ square metres and width $0.9$ metre. What is its length?'
            answer: "4"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Length is area divided by width: $3.6\div0.9=36\div9=4$ metres.'
          - problem: 'A bottle holds $1.5$ litres. How many $0.25$-litre glasses can be filled from it?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of glasses is $1.5\div0.25$. Scale both by $100$ to get $150\div25=6$ glasses.'
          - problem: 'Petrol costs €$1.60$ per litre. Mia pays €$28.80$. How many litres does she buy?'
            answer: "18"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Litres are the total cost divided by the price per litre: $28.80\div1.60=2880\div160=18$ litres.'
          - problem: 'Ben computes $2.4 \div 0.6$ and writes $0.4$. What is the correct quotient?'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scale both numbers by $10$: $2.4\div0.6=24\div6=4$. The answer $0.4$ is too small, because $0.6$ fits into $2.4$ more than once.'
          - problem: 'A snail crawls $0.3$ m each minute. How many minutes does it need to crawl $3.3$ m?'
            answer: "11"
            answer_contract: {"kind":"unit","quantity":"time","unit":"minute","allow_omitted":true}
            solution_sketch: 'Minutes are the distance divided by the distance per minute: $3.3\div0.3=33\div3=11$ minutes.'
        constraints: "shift both numbers until the divisor is whole"
    diagnostic_exemplar:
      problem: 'Compute $5.6 \div 0.7$.'
      answer: "8"
      solution_sketch: 'Scale both by $10$ to clear the divisor: $56 \div 7 = 8$.'
    anki_seeds:
      - front: "When multiplying decimals, the number of decimal places in the product equals..."
        back: "the total number of decimal places in the two factors"
        type: basic
      - front: "To divide by a decimal (e.g. 4.5 / 0.5), first..."
        back: "multiply both numbers by the same power of ten to make the divisor whole"
        type: basic

  - id: fraction-decimal-conversion
    name: Converting Between Fractions and Decimals
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: expression
    expected_time_secs: 65
    prerequisites:
      - id: long-division
        weight: 0.6
        key: true
      - id: decimal-place-value
        weight: 0.5
      - id: equivalent-fractions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Fraction to decimal
        key_prerequisites: [long-division]
        step_check:
          step: 'Divide 3 by 10'
          question: 'Why does dividing $3$ by $10$ give the decimal for $\frac{3}{10}$?'
          options:
            - 'Dividing by $10$ always gives a number that is less than $1$'
            - 'A fraction bar means divide, so $\frac{3}{10}$ is $3\div10$'
            - 'The numerator is always the smaller number in a fraction'
            - 'Dividing by $10$ is the opposite of multiplying by $10$'
          answer: 'A fraction bar means divide, so $\frac{3}{10}$ is $3\div10$'
          why: 'The fraction $\frac{3}{10}$ means three of ten equal parts of one, which is $3\div10=0.3$. The same is true for every fraction.'
        exemplars:
          - problem: 'Write $\frac{3}{4}$ as a decimal.'
            answer: "0.75"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: '$3 \div 4 = 0.75$. Check: $\frac{3}{4}=\frac{75}{100}$.'
          - problem: 'One fifth of a strip of ten equal cells is shaded. What decimal part of the strip is shaded?'
            answer: "0.2"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'One fifth of ten cells is two cells, so two tenths of the strip is shaded. Since $1/5=2/10$, the decimal is $0.2$.'
          - problem: 'Three litres of juice are poured equally into eight bottles. Write the amount in each bottle, in litres, as a decimal.'
            answer: "0.375"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Each bottle gets $3/8$ litre. Dividing $3$ by $8$, or writing $3/8=375/1000$, gives $0.375$ litre.'
          - problem: 'Give a decimal between $\frac{1}{4}$ and $\frac{3}{10}$.'
            answer: "0.28"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "1/4", "high": "3/10"}}
            solution_sketch: 'Convert both: $\frac{1}{4} = 0.25$ and $\frac{3}{10} = 0.3$. Any decimal strictly between, such as $0.26$, $0.28$ or $0.2999$, works.'
          - problem: 'A $5$ m ribbon is cut into $4$ equal pieces. Write the length of each piece, in metres, as a decimal.'
            answer: "1.25"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Each piece is $5\div4=1.25$ metres long. Check: four pieces of $1.25$ make $5$.'
          - problem: 'A number line from $0$ to $1$ is split into ten equal steps. Which decimal labels the point $\frac{7}{10}$?'
            answer: "0.7"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Seven steps of one tenth each make seven tenths. Seven tenths is written $0.7$.'
          - problem: 'Write a decimal that lies between $\frac{3}{5}$ and $\frac{7}{10}$.'
            answer: "0.65"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "3/5", "high": "7/10"}}
            solution_sketch: 'Convert both: $\frac{3}{5} = 0.6$ and $\frac{7}{10} = 0.7$. Any decimal strictly between works, for example $0.65$, $0.61$ or $0.699$.'
          - problem: 'Sam says that $\frac{1}{8}$ is $0.8$ as a decimal. What is the correct decimal?'
            answer: "0.125"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'A fraction means division, so $\frac{1}{8}=1\div8=0.125$. Sam wrote the denominator as the decimal digit.'
        constraints: "terminating decimals; denominators 2, 4, 5, 8, 10"
      - id: kp2
        name: Decimal to fraction
        key_prerequisites: [equivalent-fractions]
        step_check:
          step: 'Divide top and bottom by 2'
          question: 'Why does dividing the top and the bottom of $\frac{4}{10}$ by $2$ leave its value unchanged?'
          options:
            - 'Both parts become smaller, so the fraction stays the same size'
            - 'It divides the fraction by $2$ and then multiplies it by $2$'
            - 'Dividing top and bottom by one number is multiplying by $1$'
            - 'Two is the only number that goes into both $4$ and $10$'
          answer: 'Dividing top and bottom by one number is multiplying by $1$'
          why: 'Dividing top and bottom by $2$ means multiplying by $\frac{1}{2}\div\frac{1}{2}$, which is $1$. The fraction is written in smaller numbers but names the same amount.'
        exemplars:
          - problem: 'Write $0.6$ as a fraction in lowest terms.'
            answer: "3/5"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: '$0.6 = \frac{6}{10} = \frac{3}{5}$.'
          - problem: 'In a hundred-cell grid, $0.25$ of the cells are shaded. What fraction of the grid is shaded, in lowest terms?'
            answer: "1/4"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: '$0.25$ is $25/100$. Dividing top and bottom by their greatest common factor $25$ gives $1/4$.'
          - problem: 'A pencil is $0.35$ m long. What fraction of a metre is that, in lowest terms?'
            answer: "7/20"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: '$0.35$ m is $35/100$ of a metre. Dividing top and bottom by $5$ gives $7/20$ of a metre.'
          - problem: 'A number line from $0$ to $1$ is marked in tenths. A point is eight ticks from $0$. What fraction in lowest terms labels it?'
            answer: "4/5"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Eight tenths is $\frac{8}{10}$, the decimal $0.8$. Divide top and bottom by $2$ to get $\frac{4}{5}$ in lowest terms.'
          - problem: 'A screw is $0.125$ inch long. What fraction of an inch is that, in lowest terms?'
            answer: "1/8"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: '$0.125$ is $125/1000$. The greatest common factor of $125$ and $1000$ is $125$, so the fraction is $1/8$ of an inch.'
          - problem: 'Give a fraction between $0.4$ and $0.45$.'
            answer: "17/40"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "0.4", "high": "0.45"}}
            solution_sketch: '$0.4 = \frac{2}{5}$ and $0.45 = \frac{9}{20}$. Over $40$ they are $\frac{16}{40}$ and $\frac{18}{40}$, so $\frac{17}{40}$ lies between. $\frac{3}{7} = 0.428\ldots$ also works.'
          - problem: 'Find a fraction between $0.7$ and $0.75$.'
            answer: "29/40"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "0.7", "high": "0.75"}}
            solution_sketch: '$0.7 = \frac{7}{10}$ and $0.75 = \frac{3}{4}$. Over $20$ they are $\frac{14}{20}$ and $\frac{15}{20}$, neighbours, so go to $40$ths: $\frac{29}{40}$ lies between. $0.72 = \frac{18}{25}$ works too.'
          - problem: 'Ana writes $0.05$ as $\frac{1}{50}$. What is the correct fraction in lowest terms?'
            answer: "1/20"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: '$0.05$ is $5$ hundredths, so it is $\frac{5}{100}$. Dividing top and bottom by $5$ gives $\frac{1}{20}$.'
        constraints: "1-3 decimal places"
      - id: kp3
        name: Longer divisions and repeating decimals
        key_prerequisites: [long-division]
        step_check:
          step: 'This returns to the earlier remainder, so the block $36$ repeats'
          question: 'Why does the digit block $36$ repeat once the remainder $4$ comes back?'
          options:
            - 'The remainder $4$ is the numerator of the original fraction'
            - 'A remainder that appears twice makes the division end'
            - 'The denominator $11$ has only the digits $3$ and $6$'
            - 'Each new digit depends only on the remainder just before it'
          answer: 'Each new digit depends only on the remainder just before it'
          why: 'The next digit and remainder come only from the current remainder and the divisor. The same remainder $4$ therefore starts the same digits $3$, $6$ again.'
        exemplars:
          - problem: 'Write $\frac{7}{8}$ as a decimal.'
            answer: "0.875"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: '$7 \div 8 = 0.875$, and the remainder reaches $0$ after three digits.'
          - problem: 'Write $\frac{1}{3}$ as a decimal, rounded to three decimal places.'
            answer: "0.333"
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: '$1 \div 3 = 0.333\ldots$ repeats forever; to three places it is $0.333$.'
          - problem: 'Five litres of water are shared equally among sixteen bottles. Write the amount per bottle, in litres, as a decimal.'
            answer: "0.3125"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Each bottle gets $5/16$ litre. Since $5/16=(5\times625)/(16\times625)=3125/10000$, the amount is $0.3125$ litre.'
          - problem: 'Give a fraction that lies between $0.33$ and $0.34$.'
            answer: "1/3"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "0.33", "high": "0.34"}}
            solution_sketch: '$\frac{1}{3} = 0.333\ldots$, which is more than $0.33$ and less than $0.34$. A terminating choice such as $0.335 = \frac{67}{200}$ works too.'
          - problem: 'Give a number between $0.8$ and $\frac{5}{6}$.'
            answer: "0.82"
            answer_contract: {"kind": "property", "check": "between", "args": {"low": "0.8", "high": "5/6"}}
            solution_sketch: '$\frac{5}{6} = 0.8333\ldots$, so any number above $0.8$ and below $0.8333\ldots$ works, such as $0.81$, $0.82$ or $\frac{9}{11} = 0.8181\ldots$. $0.84$ is too large, because it is past $0.8333\ldots$.'
          - problem: 'A $2$ m rope is cut into three equal pieces. How long is each piece in metres, rounded to three decimal places?'
            answer: "0.667"
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Each piece is $2/3$ m, and $2\div3=0.6666\ldots$. The fourth decimal digit is $6$, so the third rounds up to give $0.667$ m.'
          - problem: 'Three pizzas are shared equally among seven friends. How much pizza does each friend get, to three decimal places?'
            answer: "0.429"
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Each friend gets $3\div7=0.42857\ldots$ of a pizza. The fourth digit is $5$, so the third digit rounds up and each friend gets $0.429$.'
          - problem: 'Write $\frac{5}{11}$ as a decimal, rounded to three decimal places.'
            answer: "0.455"
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: '$5\div11=0.454545\ldots$ with the block $45$ repeating. The fourth digit is $5$, so the third digit rounds up to give $0.455$.'
        constraints: "may include a simple repeating decimal"
    diagnostic_exemplar:
      problem: 'Write $\frac{5}{8}$ as a decimal.'
      answer: "0.625"
      solution_sketch: 'Divide $5$ by $8$, or scale to $\frac{625}{1000} = 0.625$.'
    anki_seeds:
      - front: "To convert a fraction to a decimal, you..."
        back: "divide the numerator by the denominator"
        type: basic

  # --------------------------------------------------------------------- #
  # Percentages
  # --------------------------------------------------------------------- #
  - id: percent-conversions
    name: Percent, Decimal, and Fraction Conversions
    core: true
    difficulty: 0.26
    drill: false
    answer_kind: expression
    expected_time_secs: 50
    prerequisites:
      - id: fraction-decimal-conversion
        weight: 0.8
        key: true
      - id: decimal-multiplication-powers-of-ten
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Percent and decimal
        key_prerequisites: [decimal-multiplication-powers-of-ten]
        step_check:
          step: '62% = 62/100'
          question: 'Why is $62\%$ equal to $62/100$?'
          options:
            - '$62$ has two digits, so it goes over $100$'
            - 'A percent is always a share of the number $62$'
            - 'Percent means per hundred: $62$ out of every $100$'
            - 'Every whole number goes over $100$ to become a decimal'
          answer: 'Percent means per hundred: $62$ out of every $100$'
          why: '"Per cent" means "per hundred", so $n\%$ always means $n/100$; the number of digits plays no part, since $5\%=5/100$ and $125\%=125/100$.'
        exemplars:
          - problem: 'Write $45\%$ as a decimal.'
            answer: "0.45"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Percent means hundredths, so $45\% = 45/100$. Move the decimal point two places left: $45\% = 0.45$.'
          - problem: 'Write $0.07$ as a percent.'
            answer: "7%"
            answer_contract: {"kind":"label","options":[["7%","7 %","7","7 percent","7 per cent"],["0.07%","0.07 %","0.07","0.07 percent"],["70%","70 %","70","70 percent"],["700%","700 %","700","700 percent"]]}
            solution_sketch: 'The decimal $0.07$ is $7$ hundredths. Move the decimal point two places right: $0.07 = 7\%$.'
          - problem: 'Eight squares of a $10\times10$ grid are shaded, so $8\%$ of the grid is shaded. What decimal of the grid is shaded?'
            answer: "0.08"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Eight of the hundred squares is $8/100$ of the grid. Eight hundredths is $0.08$, with the $8$ in the hundredths place.'
          - problem: 'A number line from $0$ to $1$ is relabelled so that $0$ is $0\%$ and $1$ is $100\%$. What percent labels the point $0.6$?'
            answer: "60%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The whole interval is $100\%$, so each tenth is $10\%$. The point $0.6$ is six tenths along, so it is labelled $60\%$.'
          - problem: 'Write $3\%$ as a decimal.'
            answer: "0.03"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Three percent is $3/100$, three hundredths. So $3\% = 0.03$, and $0.3$ would be $30\%$.'
          - problem: 'A savings account pays interest at $4\%$ per year. What is this rate as a decimal?'
            answer: "0.04"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Four percent is four hundredths, $4/100$. Move the decimal point two places left: $4\% = 0.04$.'
        constraints: "whole-number percents"
      - id: kp2
        name: Percent and fraction
        key_prerequisites: [fraction-decimal-conversion]
        step_check:
          step: 'Divide the top and bottom by gcd(35,100) = 5'
          question: 'Why is $7/20$ in lowest terms after dividing by $5$?'
          options:
            - '$7$ is prime, so a fraction with top $7$ is always in lowest terms'
            - '$20$ is even and $7$ is odd, so nothing more can cancel out'
            - 'Dividing once always leaves a fraction in its lowest terms'
            - '$5$ is the greatest common divisor, so no common factor is left'
          answer: '$5$ is the greatest common divisor, so no common factor is left'
          why: 'Dividing by the gcd removes every common factor at once; a prime numerator is not enough, since $7/14$ still reduces, and odd over even can reduce too, as $3/6$ shows.'
        exemplars:
          - problem: 'Write $25\%$ as a fraction in lowest terms.'
            answer: "1/4"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Percent means hundredths, so $25\% = \frac{25}{100}$. Divide top and bottom by $25$: $\frac{25}{100} = \frac{1}{4}$.'
          - problem: 'Write $\frac{3}{4}$ as a percent.'
            answer: "75%"
            answer_contract: {"kind":"label","options":[["75%","75 %","75","75 percent","75 per cent"],["0.75%","0.75 %","0.75","0.75 percent"],["34%","34 %","34","34 percent"],["7.5%","7.5 %","7.5","7.5 percent"]]}
            solution_sketch: 'Multiply top and bottom by $25$: $\frac{3}{4} = \frac{75}{100}$. Seventy-five hundredths is $75\%$.'
          - problem: '$60\%$ of a grid is shaded. What fraction of the grid is shaded, in simplest form?'
            answer: "3/5"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The shaded part is $60/100$ of the grid. Divide top and bottom by $20$: $60/100 = 3/5$.'
          - problem: 'A fuel gauge shows that the tank is $40\%$ full. What fraction of the tank is full, in simplest form?'
            answer: "2/5"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'The full part is $40\% = 40/100$ of the tank. Cancel the common factor $20$ to obtain $2/5$.'
        constraints: "percents that simplify to small fractions"
      - id: kp3
        name: Benchmarks and percents beyond 100
        key_prerequisites: [fraction-decimal-conversion]
        try_first:
          problem: 'A plant was $10$ cm tall and is now $25$ cm tall. How many times its old height is its new height?'
          answer_contract: {"kind":"exact"}
          answer: '2.5'
          reveal: 'The new height is $2.5$ times the old one, which is $250\%$ of it. A percent above $100$ simply describes an amount larger than the whole.'
        step_check:
          step: 'Multiply by 100 to express as a percent'
          question: 'Why does multiplying $1.75$ by $100$ give the percent?'
          options:
            - 'A percent counts hundredths, and $1.75$ is $175$ hundredths'
            - 'Percents cannot be above $100$, so the number is scaled up'
            - 'Multiplying by $100$ removes the decimal point from any number'
            - 'Multiplying by $100$ rounds $1.75$ to the nearest whole percent'
          answer: 'A percent counts hundredths, and $1.75$ is $175$ hundredths'
          why: '$1.75 = 175/100$, and $n/100$ is $n\%$; one whole and three quarters is $175\%$, so a percent can pass $100$.'
        exemplars:
          - problem: 'Write $\frac{1}{5}$ as a percent.'
            answer: "20%"
            answer_contract: {"kind":"label","options":[["20%","20 %","20","20 percent","20 per cent"],["5%","5 %","5","5 percent"],["15%","15 %","15","15 percent"],["0.2%","0.2 %","0.2","0.2 percent"]]}
            solution_sketch: 'Multiply top and bottom by $20$: $\frac{1}{5} = \frac{20}{100}$. Twenty hundredths is $20\%$.'
          - problem: 'Write $125\%$ as a decimal.'
            answer: "1.25"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Percent means hundredths, so $125\% = 125/100$. Move the decimal point two places left: $125\% = 1.25$.'
          - problem: 'A strip is divided into ten equal parts, and three of the parts are shaded. What percent of the strip is shaded?'
            answer: "30%"
            answer_contract: {"kind":"label","options":[["30%","30 %","30","30 percent","30 per cent"],["3%","3 %","3","3 percent"],["0.3%","0.3 %","0.3","0.3 percent"],["300%","300 %","300","300 percent"]]}
            solution_sketch: 'Each tenth of the strip is $10\%$. Three tenths give $3\times10\% = 30\%$.'
          - problem: 'A recipe is scaled up to $150\%$ of its original size. By what decimal number is each quantity multiplied?'
            answer: "1.5"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'The new size is $150\% = 100\% + 50\%$ of the original. That is $1 + 0.5 = 1.5$ times each quantity.'
          - problem: 'Write $120\%$ as a fraction in simplest form.'
            answer: "6/5"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: 'Percent means hundredths, so $120\% = 120/100$. Divide top and bottom by $20$ to obtain $6/5$, more than one whole.'
          - problem: 'Two whole squares and one quarter of a third square are shaded. One whole square counts as $100\%$. What percent is shaded?'
            answer: "225%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each whole square is $100\%$ and a quarter square is $25\%$. The total is $100\% + 100\% + 25\% = 225\%$.'
        constraints: "benchmark fractions (halves, quarters, fifths, tenths); percents up to 200"
    diagnostic_exemplar:
      problem: 'Write $\frac{7}{4}$ as a percent.'
      answer: '175%'
      answer_contract: {"kind":"label","options":[["175%","175 %","175","175 percent","175 per cent"],["1.75%","1.75 %","1.75","1.75 percent"],["17.5%","17.5 %","17.5","17.5 percent"],["74%","74 %","74","74 percent"]]}
      solution_sketch: 'First $\frac{7}{4} = 1.75$. Then $1.75 \times 100 = 175$, so $\frac{7}{4} = 175\%$.'
    anki_seeds:
      - front: "The word 'percent' means..."
        back: "per hundred (out of 100)"
        type: basic
      - front: "To convert a decimal to a percent, multiply by..."
        back: "100 (move the decimal point two places right)"
        type: basic

  - id: percent-of-a-number
    name: Percent of a Number
    core: true
    difficulty: 0.28
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: percent-conversions
        weight: 0.9
        key: true
      - id: decimal-operations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Percent of a number via decimals
        key_prerequisites: [decimal-operations]
        step_check:
          step: 'Convert 45% to the decimal 0.45.'
          question: 'Why can $45\%$ of $220$ be found by multiplying $220$ by $0.45$?'
          options:
            - 'A percent of a number is the number divided by the percent'
            - '$45\%$ of $220$ means $45$ is taken away from $220$'
            - '"Of" means multiply, and $45\%$ is $45/100 = 0.45$'
            - '$0.45$ is the share of $220$ left after a $45\%$ discount'
          answer: '"Of" means multiply, and $45\%$ is $45/100 = 0.45$'
          why: '$45\%$ of $220$ is $45$ hundredths of $220$, that is $\frac{45}{100}\times220 = 0.45\times220$; dividing by the percent answers the reverse question.'
        exemplars:
          - problem: 'What is $20\%$ of $60$?'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $20\%$ as the decimal $0.20$. Then $0.20 \times 60 = 12$.'
          - problem: 'A $60$-litre tank is $35\%$ full. How many litres are in the tank?'
            answer: "21"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Write $35\%$ as $0.35$. Then $60\times0.35 = 21$ litres are in the tank.'
          - problem: 'A bar split into $100$ equal parts represents $40$ kg. How many kilograms do $35$ of the parts represent?'
            answer: "14"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'Each part is $40 \div 100 = 0.4$ kg. So $35$ parts represent $35 \times 0.4 = 14$ kg, which is $35\%$ of $40$.'
          - problem: 'A shop gives a $12\%$ rebate on a €150 purchase. How many euros is the rebate?'
            answer: "18"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Convert $12\%$ to $0.12$. Then $150\times0.12 = 18$, so the rebate is $18$ euros.'
        constraints: "results are whole numbers"
      - id: kp2
        name: Mental benchmarks
        key_prerequisites: [percent-conversions]
        step_check:
          step: 'Halve $640$ to get $320$'
          question: 'Why does halving $640$ twice give $25\%$ of it?'
          options:
            - 'Each halving takes away $25\%$ of the invoice, so two do'
            - 'Half of a half is one quarter, and $25\%$ is one quarter'
            - '$25$ divides $640$ exactly, so halving twice is allowed'
            - 'Each halving removes $12.5\%$, so two halvings leave $25\%$'
          answer: 'Half of a half is one quarter, and $25\%$ is one quarter'
          why: '$\frac12\times\frac12 = \frac14 = 25\%$; the first halving alone already takes $50\%$, so each halving removes half of what is left.'
        exemplars:
          - problem: 'What is $10\%$ of $350$?'
            answer: "35"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$10\%$ is one tenth. One tenth of $350$ is $350\div10 = 35$.'
          - problem: 'Without a calculator, find $25\%$ of €200 in euros.'
            answer: "50"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: '$25\%$ is one quarter. So $200\div4 = 50$ euros.'
          - problem: 'A school has $84$ pupils, and $50\%$ of them walk to school. How many pupils walk to school?'
            answer: "42"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$50\%$ is one half. Half of $84$ is $84\div2 = 42$ pupils.'
          - problem: 'A restaurant adds a $10\%$ service charge to a €120 bill. How many euros is the service charge?'
            answer: "12"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: '$10\%$ is one tenth. One tenth of $120$ is $120\div10 = 12$ euros.'
        constraints: "10%, 25%, 50% of clean numbers, done mentally"
      - id: kp3
        name: Larger and smaller percents
        key_prerequisites: [percent-conversions]
        step_check:
          step: 'Convert 12% to the decimal 0.12.'
          question: 'Why is $12\%$ written as $0.12$ and not as $1.2$?'
          options:
            - '$12\%$ is $12$ hundredths, and $12/100 = 0.12$'
            - 'As decimals, percents are always less than $1$'
            - 'The decimal point always goes in front of the first digit'
            - '$12\%$ is $12$ tenths, so the point moves only one place'
          answer: '$12\%$ is $12$ hundredths, and $12/100 = 0.12$'
          why: '$n\% = n/100$, so the point moves two places left: $12\% = 0.12$ and $150\% = 1.5$, which shows a percent can exceed $1$.'
        exemplars:
          - problem: 'What is $150\%$ of $40$?'
            answer: "60"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $150\%$ as the decimal $1.5$. Then $1.5 \times 40 = 60$.'
          - problem: 'A sample contains $250$ grains. Four percent are marked. How many grains are marked?'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One percent is $250/100=2.5$ grains; four percent is $4\times2.5=10$ grains.'
          - problem: 'A copier enlarges an $18$ cm line to $200\%$ of its length. How long is the copy in cm?'
            answer: "36"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: '$200\%$ is twice the original. So the copy is $2\times18=36$ cm long.'
          - problem: 'A €150 balance earns a one-time bonus of $2\%$. How many euros is the bonus?'
            answer: "3"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Write $2\%$ as $0.02$. The bonus is $150\times0.02=3$ euros.'
        constraints: "percents from 1% to 200%; whole-number answers"
    diagnostic_exemplar:
      problem: 'What is $120\%$ of $45$?'
      answer: '54'
      solution_sketch: '$1.2 \times 45 = 54$.'
    anki_seeds:
      - front: "To find x% of a number, multiply the number by..."
        back: "x/100 (i.e. the decimal form of the percent)"
        type: basic

  - id: percentages
    name: Percentages
    core: true
    difficulty: 0.3
    drill: false
    # Most answers here are percents ("25%") or comparisons ("25% of 80"), which the
    # SymPy override cannot parse or adjudicate; multi-step hands grading to the tutor.
    answer_kind: multi-step
    expected_time_secs: 70
    prerequisites:
      - id: percent-conversions
        weight: 0.8
        key: true
      - id: percent-of-a-number
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: Finding what percent one number is of another
        key_prerequisites: [percent-conversions]
        step_check:
          step: 'Express the ratio per hundred'
          question: 'Why is $0.25$ multiplied by $100$?'
          options:
            - 'It undoes the division of $9$ by $36$ that came just before'
            - 'The whole always has $100$ units, so the meter has $100$ units'
            - 'A percent counts per hundred, and $0.25$ is $25$ hundredths'
            - 'Multiplying by $100$ turns $0.25$ into the number of units used'
          answer: 'A percent counts per hundred, and $0.25$ is $25$ hundredths'
          why: '$9/36 = 0.25 = 25/100$, and $25$ per hundred is $25\%$; the whole here is $36$ units, and the multiplication only rewrites the same fraction per hundred.'
        exemplars:
          - problem: '$12$ is what percent of $48$?'
            answer: "25%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the part by the whole: $\frac{12}{48} = 0.25$. As a percent this is $25\%$.'
          - problem: 'A bar represents $24$ units, and $18$ of those units are shaded. What percent of the bar is shaded?'
            answer: "75%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The shaded fraction is $18/24=3/4$. Multiplying by $100$ gives $75\%$.'
          - problem: 'Fourteen of forty seedlings survive. What percent of the seedlings survive?'
            answer: "35%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The survival fraction is $14/40=0.35$. That is $35\%$ of the seedlings.'
          - problem: 'A download has reached $9$ MB of its $60$ MB. What percent of the download is complete?'
            answer: "15%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The completed fraction is $9/60=3/20=15/100$. So $15\%$ of the download is complete.'
          - problem: 'What percent of $80$ is $52$?'
            answer: "65%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the part by the whole: $52/80 = 0.65$. As a percent this is $65\%$.'
          - problem: 'A class has $25$ students, and $7$ of them wear glasses. What percent of the class wear glasses?'
            answer: "28%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fraction is $7/25$. Multiply top and bottom by $4$: $7/25 = 28/100 = 28\%$.'
        constraints: "part/whole gives a benchmark percent"
      - id: kp2
        name: One-step percents in context
        key_prerequisites: [percent-of-a-number]
        step_check:
          step: 'Divide correct answers by total'
          question: 'Why is $39$ divided by $60$, and not $60$ by $39$?'
          options:
            - 'The larger number always goes on the bottom of the fraction'
            - 'Division must give a number greater than $1$ to be a percent'
            - 'The number asked about first is always the one that is divided'
            - 'The part is compared with the whole, so the part goes on top'
          answer: 'The part is compared with the whole, so the part goes on top'
          why: 'A percent of a whole is part divided by whole; the larger-on-the-bottom rule fails when the part exceeds the whole, as $30$ out of $24$ is $125\%$.'
        exemplars:
          - problem: 'A €40 item is $10\%$ off. How many euros is the discount?'
            answer: "4"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Write $10\%$ as $0.10$. The discount is $0.10 \times 40 = 4$ euros.'
          - problem: 'You answered $45$ of $50$ questions correctly. What percent is that?'
            answer: "90%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the part by the whole: $\frac{45}{50} = 0.9$. As a percent this is $90\%$.'
          - problem: 'A battery holds $65$ watt-hours when full and is charged to $20\%$. How many watt-hours are stored?'
            answer: "13"
            answer_contract: {"kind":"unit","quantity":"energy","unit":"Wh","allow_omitted":true}
            solution_sketch: 'Twenty percent is one fifth. One fifth of $65$ watt-hours is $65\div5=13$ watt-hours.'
          - problem: 'Seventeen of twenty seats are occupied. What percent of the seats are occupied?'
            answer: "85%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fraction is $17/20=85/100$. So $85\%$ of the seats are occupied.'
          - problem: 'A bike priced at €250 is sold with $20\%$ off. How many euros does the buyer save?'
            answer: "50"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Write $20\%$ as $0.20$. The saving is $0.20\times250 = 50$ euros.'
          - problem: 'Six of the $40$ apples in a crate are bruised. What percent of the apples are bruised?'
            answer: "15%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fraction is $6/40 = 3/20$. Multiply top and bottom by $5$: $15/100 = 15\%$.'
        constraints: "single-step; whole-number answers"
      - id: kp3
        name: Choosing the right computation
        key_prerequisites: [percent-of-a-number]
        step_check:
          step: 'Compare: 18 is larger than 17.5.'
          question: 'Why are the amounts $18$ and $17.5$ compared, and not the percents $40\%$ and $35\%$?'
          options:
            - 'The larger percent always gives the larger amount of the two'
            - 'The percents are of different wholes, so only amounts compare'
            - 'Percents can be compared only when they add up to $100\%$'
            - 'Only amounts in euros can be compared, never percents of them'
          answer: 'The percents are of different wholes, so only amounts compare'
          why: '$40\%$ of $45$ and $35\%$ of $50$ take shares of different wholes; $10\%$ of $500$ is larger than $90\%$ of $50$, so a larger percent can give a smaller amount.'
        exemplars:
          - problem: 'To pass a $30$-question quiz you need $80\%$ correct. How many questions is that?'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $80\%$ as $0.8$. Then $0.8 \times 30 = 24$ questions.'
          - problem: 'Shop A gives a rebate of $40\%$ on a €50 purchase, and shop B gives $60\%$ on a €30 purchase. How many euros is the larger rebate?'
            answer: "20"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The rebates are $0.40\times50=20$ and $0.60\times30=18$ euros. The larger rebate is $20$ euros.'
          - problem: 'A team wins $15$ of its $25$ games. What percentage of its games does it win?'
            answer: "60%"
            answer_contract: {"kind":"label","options":[["60%","60 %","60","60 percent","60 per cent"],["6%","6 %","6","6 percent"],["0.6%","0.6 %","0.6","0.6 percent"],["40%","40 %","40","40 percent"]]}
            solution_sketch: 'The part is $15$ and the whole is $25$. So $(15/25)\times100=60$, a win percentage of $60\%$.'
          - problem: 'Which is smaller: $25\%$ of $80$, or $30\%$ of $60$?'
            answer: "30% of 60"
            answer_contract: {"kind":"label","options":[["30% of 60","30 % of 60","30 percent of 60","18","30% of 60 = 18","30% of 60 is smaller"],["25% of 80","25 % of 80","25 percent of 80","20","25% of 80 = 20","25% of 80 is smaller"],["they are equal","equal","the same","they are the same"],["cannot be compared","cannot tell","can not be compared"]]}
            solution_sketch: 'Work out each amount: $25\%$ of $80$ is $0.25\times80=20$, and $30\%$ of $60$ is $0.30\times60=18$. Since $18 < 20$, $30\%$ of $60$ is smaller.'
          - problem: 'In a survey of $200$ people, $35\%$ said they cycle to work. How many people said they cycle?'
            answer: "70"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'This asks for a part, so multiply: $0.35\times200 = 70$. So $70$ people said they cycle.'
          - problem: 'A choir has $32$ members, and $8$ of them are tenors. What percent of the choir are tenors?'
            answer: "25%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'This asks for a percent, so divide the part by the whole: $8/32 = 1/4$. One quarter is $25\%$.'
        constraints: "mix of find-the-part and find-the-percent forms"
    diagnostic_exemplar:
      problem: 'To pass a $40$-question test you need $85\%$ correct. How many questions must you answer correctly?'
      answer: "34"
      solution_sketch: '$0.85 \times 40 = 34$.'
    anki_seeds:
      - front: "To find what percent a part is of a whole, compute..."
        back: "part / whole, then multiply by 100"
        type: basic

  - id: percent-finding-the-whole
    name: Finding the Whole from a Percent
    core: false                # feeds only percent-applications; percentages stays core
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 80
    prerequisites:
      - id: percentages
        weight: 0.9
        key: true
      - id: decimal-operations
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Find the whole given the part and percent
        key_prerequisites: [percentages]
        try_first:
          problem: '$10\%$ of a number is $7$. What is the number?'
          answer_contract: {"kind":"exact"}
          answer: '70'
          reveal: 'Ten lots of $10\%$ make the whole $100\%$, so the number is $10\times7=70$. Here the part is known and the whole is unknown, the reverse of finding a percent of a number.'
        step_check:
          step: '18 ÷ 0.10 = 180'
          question: 'Why is $18$ divided by $0.10$ instead of multiplied by it?'
          options:
            - 'Any question with a percent in it is solved by dividing by it'
            - 'Dividing by a decimal gives the same result as multiplying by it'
            - 'The whole times $0.10$ is $18$, so the whole is $18\div0.10$'
            - '$18$ is the whole, and dividing by $0.10$ finds $10\%$ of it'
          answer: 'The whole times $0.10$ is $18$, so the whole is $18\div0.10$'
          why: '$0.10\times\text{whole}=18$ is undone by dividing by $0.10$; multiplying, $0.10\times18=1.8$, would find $10\%$ of $18$, a different question.'
        exemplars:
          - problem: '$15$ is $30\%$ of what number?'
            answer: "50"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number times $0.30$ is $15$. So the number is $15 \div 0.30 = 50$.'
          - problem: 'A bar has $40\%$ shaded, representing $24$ units. What does the whole bar represent?'
            answer: "60"
            solution_sketch: '$40\%=2/5$, so one fifth represents $24\div2=12$ units. Five fifths represent $12\times5=60$ units.'
          - problem: '$70\%$ of a number is $21$. What is the number?'
            answer: "30"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the statement as $0.70\times x=21$. Divide both sides by $0.70$: $x=21/0.70=30$.'
          - problem: 'A €9 deposit covers $20\%$ of a ticket price. What is the full price in euros?'
            answer: "45"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: '$20\%$ is one fifth of the price. So the full price is $9\times5=45$ euros.'
        constraints: "benchmark percents; whole-number answers"
      - id: kp2
        name: Harder percents
        key_prerequisites: [decimal-operations]
        step_check:
          step: 'so divide: $54 \div 0.12=450$'
          question: 'Why is the deposit $54$ divided by $0.12$?'
          options:
            - '$0.12$ times the price is $54$, so the price is $54 \div 0.12$'
            - 'The price is $54$ plus $12\%$ of $54$, so $54$ is multiplied up'
            - 'The price is $12\%$ of $54$, so it is found as $0.12 \times 54$'
            - 'Dividing by $0.12$ removes the deposit from the price of $54$'
          answer: '$0.12$ times the price is $54$, so the price is $54 \div 0.12$'
          why: 'The deposit is the part and the price is the whole: $0.12\times\text{price}=54$, so $\text{price}=54\div0.12=450$, as the check $0.12\times450=54$ confirms.'
        exemplars:
          - problem: '$36$ is $45\%$ of what number?'
            answer: "80"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number times $0.45$ is $36$. So the number is $36 \div 0.45 = 80$.'
          - problem: 'A download is $5\%$ complete after $8$ MB. How many MB is the whole download?'
            answer: "160"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One percent is $8\div5=1.6$ MB. One hundred percent is $1.6\times100=160$ MB.'
          - problem: '$65\%$ of a number is $39$. What is the number?'
            answer: "60"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the statement as $0.65\times x=39$. Then $x=39\times100/65=60$.'
          - problem: 'A €7 fee is $35\%$ of a booking price. What is the booking price in euros?'
            answer: "20"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The price times $0.35$ is $7$. So the price is $7\div0.35=20$ euros.'
        constraints: "percents that are not simple benchmarks"
      - id: kp3
        name: Finding the whole in context
        key_prerequisites: [percentages]
        step_check:
          step: '40 = 0.08 × total'
          question: 'Why is the equation $40 = 0.08 \times \text{total}$?'
          options:
            - '$40$ is the whole class, and $8\%$ of it is absent'
            - 'The $40$ absent students are $8\%$ of the whole class'
            - 'The total is $8\%$ more than $40$, so we multiply'
            - 'The class total is $40$ students plus the $8\%$ who left'
          answer: 'The $40$ absent students are $8\%$ of the whole class'
          why: 'The part ($40$) equals the percent ($0.08$) times the unknown whole; reading $40$ as the whole would answer a different question, since $8\%$ of $40$ is only $3.2$.'
        exemplars:
          - problem: 'A deposit of €30 is $20\%$ of the price of a bike. What is the price?'
            answer: "150"
            solution_sketch: '$30 \div 0.20 = 150$.'
          - problem: '$12$ students are absent today, which is $15\%$ of the class. How many students are in the class?'
            answer: "80"
            solution_sketch: '$12 \div 0.15 = 80$.'
          - problem: 'A discount of €18 is $10\%$ of the price of a phone. What is the price?'
            answer: "180"
            solution_sketch: '$18 \div 0.1 = 180$.'
          - problem: '$16$ students are late today, which is $8\%$ of the class. How many students are in the class?'
            answer: "200"
            solution_sketch: '$16 \div 0.08 = 200$.'
        constraints: "one unknown whole; whole-number answers"
    diagnostic_exemplar:
      problem: 'A deposit of €27 is $15\%$ of the price of a laptop. What is the price in euros?'
      answer: "180"
      answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
      solution_sketch: '$0.15p = 27$, so $p = \frac{27}{0.15} = 180$.'
    anki_seeds:
      - front: "If a part and its percent are known, the whole equals..."
        back: "part divided by the percent written as a decimal"
        type: basic

  # --------------------------------------------------------------------- #
  # Ratios, rates, and proportions
  # --------------------------------------------------------------------- #
  - id: understanding-ratios
    name: Understanding Ratios
    core: true
    difficulty: 0.28
    drill: false
    # Ratio answers ("2:3") are not SymPy expressions; the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 60
    prerequisites:
      - id: equivalent-fractions
        weight: 0.8
        key: true
      - id: division-facts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Writing ratios
        key_prerequisites: [equivalent-fractions]
        try_first:
          problem: 'A bag holds $4$ red counters and $6$ blue counters. For every $2$ red counters, how many blue counters are there?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'Split the bag into $2$ equal groups, each with $2$ red and $3$ blue counters, so there are $3$ blue for every $2$ red. That comparison is the ratio $4:6$, which simplifies to $2:3$.'
        step_check:
          step: 'Find the total count: $10 + 15 = 25$.'
          question: 'Why add $10+15$ before writing the ratio?'
          options:
            - 'Every ratio must include the sum of its parts as its second term'
            - 'Adding first makes the numbers easier to simplify into lowest terms'
            - 'The ratio compares forks with spoons, so both counts are added up'
            - 'The ratio compares forks with all utensils, so it needs the total'
          answer: 'The ratio compares forks with all utensils, so it needs the total'
          why: 'A part-to-whole ratio puts the whole group second; a part-to-part ratio such as forks to spoons would use $10:15$ with no adding.'
        exemplars:
          - problem: 'There are $6$ apples and $9$ oranges. Write the ratio of apples to oranges in simplest form.'
            answer: "2:3"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: '$\text{GCF}(6, 9) = 3$; $6:9 = 2:3$.'
          - problem: 'A bag has $3$ red and $5$ blue marbles. Write the ratio of red marbles to all the marbles.'
            answer: "3:8"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'The bag holds $3 + 5 = 8$ marbles in total. Red to all marbles is $3:8$, already in simplest form.'
          - problem: 'There are $4$ dogs and $10$ cats. Write the ratio of dogs to cats in simplest form.'
            answer: "2:5"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: '$\text{GCF}(4, 10) = 2$; $4:10 = 2:5$.'
          - problem: 'A drawer has $5$ pens and $7$ pencils. Write the ratio of pens to all the items in the drawer.'
            answer: "5:12"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'The drawer holds $5 + 7 = 12$ items. Pens to all items is $5:12$, and $5$ and $12$ share no factor except $1$.'
          - problem: 'A fruit bowl holds $8$ bananas and $12$ pears. Write the ratio of pears to bananas in simplest form.'
            answer: "3:2"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'Pears come first, so the ratio is $12:8$. Dividing both parts by their GCF $4$ gives $3:2$.'
          - problem: 'A class has $14$ girls and $16$ boys. Write the ratio of boys to the whole class in simplest form.'
            answer: "8:15"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'The class has $14+16=30$ pupils, so boys to the whole class is $16:30$. Dividing both parts by $2$ gives $8:15$.'
        constraints: "part:part and part:whole forms; parts up to 20"
      - id: kp2
        name: Simplifying ratios
        key_prerequisites: [division-facts]
        step_check:
          step: 'The simplest form is $7:11$.'
          question: 'Why is $7:11$ the simplest form of $14:22$?'
          options:
            - 'Both $7$ and $11$ are odd numbers, so it stops'
            - '$7$ and $11$ have no common factor except $1$'
            - 'Neither part can be halved again, so it is done'
            - 'Both parts are below $12$, so they cannot shrink'
          answer: '$7$ and $11$ have no common factor except $1$'
          why: 'A ratio is in simplest form when its parts share no factor other than $1$; $9:15$ has two odd parts and cannot be halved, yet both divide by $3$.'
        exemplars:
          - problem: 'Simplify the ratio $8:12$.'
            answer: "2:3"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'Divide both parts by GCF $4$.'
          - problem: 'A drink is made from $15$ ml of juice and $35$ ml of water. Write the ratio of juice to water in simplest form.'
            answer: "3:7"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'The ratio is $15:35$. Both parts divide by their GCF $5$, giving $3:7$.'
          - problem: 'A $120$ cm rope is cut into pieces of $45$ cm and $75$ cm. Write the ratio of the shorter piece to the longer piece in simplest form.'
            answer: "3:5"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'The ratio is $45:75$. Both parts divide by their GCF $15$, giving $3:5$.'
          - problem: 'Ana simplifies $18:24$ to $9:12$ and stops. Write $18:24$ in simplest form.'
            answer: "3:4"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'Both parts of $9:12$ still divide by $3$, so Ana stopped too early: $9:12=3:4$. Dividing $18:24$ by the GCF $6$ gives $3:4$ in one step.'
          - problem: 'Write the ratio $40$ cm to $1$ m in simplest form.'
            answer: "2:5"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'Use the same unit first: $1$ m is $100$ cm, so the ratio is $40:100$. Dividing both parts by $20$ gives $2:5$.'
          - problem: 'Simplify $28:42$.'
            answer: "2:3"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'The greatest common factor of $28$ and $42$ is $14$. Dividing both parts by $14$ gives $2:3$.'
        constraints: "parts up to 40"
      - id: kp3
        name: Equivalent ratios
        key_prerequisites: [equivalent-fractions]
        step_check:
          step: 'The first terms give a scale factor: 30 ÷ 6 = 5.'
          question: 'Why divide $30$ by $6$ to complete $6:11 = 30:\square$?'
          options:
            - 'It finds the factor that turns $6$ into $30$, used for both terms'
            - 'It finds how much was added to $6$ to reach $30$, for both terms'
            - 'Dividing the two given first terms always gives the missing term'
            - 'It makes the first terms equal, so the second terms can be added up'
          answer: 'It finds the factor that turns $6$ into $30$, used for both terms'
          why: 'Equivalent ratios multiply both terms by the same factor; adding $24$ to each term instead would give $6:11=30:35$, which is a different ratio.'
        exemplars:
          - problem: 'Fill in: $2:3 = 8:\square$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both parts were multiplied by $4$.'
          - problem: 'Are the ratios $4:6$ and $10:15$ equivalent?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes","they are","equivalent","they are equivalent","yes they are"],["no","they are not","not equivalent","they are not equivalent","no they are not"]]}
            solution_sketch: 'Dividing $4:6$ by $2$ gives $2:3$, and dividing $10:15$ by $5$ also gives $2:3$. Both simplify to the same ratio, so yes, they are equivalent.'
          - problem: 'Fill in: $3:5 = \square:25$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second part scales by $25\div5=5$. The first part becomes $3\times5=15$.'
          - problem: 'Tom says $3:4$ is equivalent to $5:6$, because he added $2$ to both parts. Is Tom right?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["no","he is not right","tom is not right","not right","he is wrong","tom is wrong","wrong"],["yes","he is right","tom is right","right"]]}
            solution_sketch: 'Equivalent ratios multiply both parts by the same number. Adding $2$ changes the comparison: $3/4=0.75$ but $5/6\approx0.83$, so Tom is not right.'
          - problem: 'Find the missing number: $\square:9 = 20:36$.'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second parts scale from $9$ to $36$, a factor of $4$. Dividing $20$ by $4$ gives the missing first part, $5$.'
          - problem: 'Find the missing number: $12:\square = 3:5$.'
            answer: "20"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first part $12$ is $4$ times $3$. So the missing part is $4\times5=20$, giving $12:20=3:5$.'
        constraints: "scale factors 2-5"
    diagnostic_exemplar:
      problem: 'In a class of $30$ pupils there are $12$ boys. Write the ratio of boys to girls in simplest form.'
      answer_contract: {kind: reduced_ratio}
      answer: '2:3'
      solution_sketch: 'There are $30 - 12 = 18$ girls, and $12:18$ simplifies to $2:3$.'
    anki_seeds:
      - front: "A part-to-part ratio compares two groups; a part-to-whole ratio compares one group to..."
        back: "the total of all groups"
        type: basic

  - id: ratio-tables-equivalent-ratios
    name: Ratio Tables
    core: false                # scaffold representation leaf; ratios-proportions stays core
    difficulty: 0.3
    drill: false
    answer_kind: multi-step
    expected_time_secs: 70
    prerequisites:
      - id: understanding-ratios
        weight: 0.9
        key: true
      - id: multiplication-tables
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Completing a ratio table
        key_prerequisites: [understanding-ratios]
        step_check:
          step: 'Multiply the plank count by the same factor: $4 \times 11=44$.'
          question: 'Why is the plank count multiplied by $11$?'
          options:
            - 'Both counts must grow by the same amount, $70$, to keep it'
            - 'The plank count must stay the smaller number of the two'
            - 'Only the plank count changes, so it is multiplied by $11$'
            - 'Both counts must grow by the same factor to keep the ratio'
          answer: 'Both counts must grow by the same factor to keep the ratio'
          why: 'Each row of a ratio table is the first row times one number; adding $70$ planks would give $77:74$, which is a different ratio.'
        exemplars:
          - problem: 'A recipe uses $2$ eggs for every $3$ cups of flour. How many cups of flour go with $4$ eggs?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Double both parts of $2:3$ to get $4:6$.'
          - problem: 'A ratio table pairs $3$ with $12$. Scale the first entry to $9$. What is the matching second entry?'
            answer: "36"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first entry scales by $9\div3=3$; multiply $12$ by $3$ to get $36$.'
          - problem: 'A ratio table has the rows $4$ eggs with $6$ cups of flour and $6$ eggs with $9$ cups of flour. How many cups of flour go with $10$ eggs?'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Adding the two rows gives $4+6=10$ eggs with $6+9=15$ cups. The ratio stays $2:3$, so $10$ eggs need $15$ cups of flour.'
          - problem: 'A mill turns $4$ kg of grain into $10$ loaves. How many loaves does $20$ kg of grain make?'
            answer: "50"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The grain scales by $20\div4=5$. The loaves scale by the same factor, so $10\times5=50$ loaves.'
        constraints: "whole-number scale factors"
      - id: kp2
        name: Scaling ratios up and down
        key_prerequisites: [understanding-ratios]
        step_check:
          step: 'Divide the blue count by the same factor: $15 \div 3=5$.'
          question: 'Why is the blue count divided by $3$?'
          options:
            - 'Subtracting $12$ blue tiles matches the $12$ red tiles removed'
            - '$15$ is the only number here that is a multiple of $3$'
            - 'The red count was divided by $3$, and both must change alike'
            - 'The blue count must stay larger than the red count, so we divide'
          answer: 'The red count was divided by $3$, and both must change alike'
          why: 'Scaling a ratio down divides both parts by the same number; subtracting $12$ from both would give $6:3$, a different pattern.'
        exemplars:
          - problem: 'Punch mixes $3$ parts juice with $2$ parts soda. With $9$ cups of juice, how many cups of soda?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scale factor $3$: $2 \times 3 = 6$.'
          - problem: 'A map uses $1$ cm for every $4$ km. How many km does $7$ cm represent?'
            answer: "28"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Scale factor $7$: $4 \times 7 = 28$.'
          - problem: 'A smoothie mixes $2$ parts yogurt with $5$ parts fruit. With $8$ cups of yogurt, how many cups of fruit?'
            answer: "20"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scale factor $4$: $5 \times 4 = 20$.'
          - problem: 'A blueprint uses $1$ cm for every $6$ m. A wall is $42$ m long. How many cm long is its drawing?'
            answer: "7"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Scale $1:6$ by $42\div6=7$ to obtain $7:42$; the drawing is $7$ cm long.'
        constraints: "scale factors 2-8; whole-number answers"
      - id: kp3
        name: Comparing ratios
        key_prerequisites: [understanding-ratios]
        try_first:
          problem: 'Juice A is $1$ cup of syrup to $4$ cups of water. Juice B is $2$ cups of syrup to $10$ cups of water. Is juice A stronger than juice B?'
          answer_contract: {"kind":"label","options":[["yes","it is","a is stronger"],["no","it is not","b is stronger"]]}
          answer: 'yes'
          reveal: 'Doubled, juice A is $2$ cups of syrup to $8$ cups of water, so with the same syrup it uses less water. Rewriting both ratios with a common part is how ratios are compared.'
        step_check:
          step: 'Use a common time of $12$ hours'
          question: 'Why rewrite both cars for the same time of $12$ hours?'
          options:
            - 'With equal times, the larger distance shows the faster car'
            - '$260$ km is more than $150$ km, so B needs no rewriting'
            - '$12$ hours is how long both trips take together'
            - 'Two rates can be compared only when both times are $12$ hours'
          answer: 'With equal times, the larger distance shows the faster car'
          why: 'Two rates can be compared directly only when one part is the same; $260$ and $150$ km were covered in different times, and the trips together last $7$ hours, not $12$.'
        exemplars:
          - problem: 'Mix A uses $9$ cups of concentrate with $15$ cups of water. Mix B uses $12$ cups of concentrate with $20$ cups of water. Which mix is stronger, or are they equally strong?'
            answer: "equal"
            answer_contract: {"kind":"label","options":[["equal","equally strong","they are equally strong","the same","same","neither","they are the same"],["mix a","a","mix a is stronger"],["mix b","b","mix b is stronger"]]}
            solution_sketch: 'Scale both to $60$ cups of water: A becomes $36:60$ and B becomes $36:60$. Both use $36$ cups of concentrate for $60$ cups of water, so they are equally strong.'
          - problem: 'Runner A covers $400$ m in $80$ s. Runner B covers $300$ m in $50$ s. Which runner is faster?'
            answer: "runner b"
            answer_contract: {"kind":"label","options":[["runner b","b","b is faster","runner b is faster"],["runner a","a","a is faster","runner a is faster"]]}
            solution_sketch: 'Scale both to $400$ s: A runs $400\times5=2000$ m and B runs $300\times8=2400$ m. In the same time B runs farther, so runner B is faster.'
          - problem: 'Mix A uses $2$ scoops of cocoa per $3$ cups of milk. Mix B uses $3$ scoops per $5$ cups of milk. For $15$ cups of milk, how many more scoops of cocoa does Mix A use than Mix B?'
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply $2:3$ by $5$ to get $10:15$, so Mix A uses $10$ scoops for $15$ cups; multiply $3:5$ by $3$ to get $9:15$, so Mix B uses $9$ scoops. Mix A uses $10-9=1$ more scoop.'
          - problem: 'Paint A uses $4$ scoops of pigment per $5$ cups of base. Paint B uses $6$ scoops per $8$ cups of base. For $40$ cups of base, how many more scoops of pigment does Paint A use than Paint B?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply $4:5$ by $8$ to get $32:40$, so Paint A uses $32$ scoops for $40$ cups; multiply $6:8$ by $5$ to get $30:40$, so Paint B uses $30$ scoops. Paint A uses $32-30=2$ more scoops.'
          - problem: 'Shop A sells $3$ kg of apples for €$4.50$. Shop B sells $5$ kg for €$7.00$. How much less does Shop B charge than Shop A for $15$ kg, in euros?'
            answer: "1.5"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'For $15$ kg, Shop A charges $5\times4.50=22.50$ euros and Shop B charges $3\times7.00=21$ euros. Shop B charges $22.50-21=1.50$ euros less, that is €$1.5$.'
          - problem: 'Recipe A uses $2$ cups of sugar for $5$ cups of flour. Recipe B uses $3$ cups of sugar for $8$ cups of flour. With $40$ cups of flour, how many cups of sugar does the sweeter recipe use?'
            answer: "16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scale both to $40$ cups of flour: A becomes $16:40$ and B becomes $15:40$. Recipe A is sweeter and uses $16$ cups of sugar.'
        constraints: "compare after rewriting with a common part"
    diagnostic_exemplar:
      problem: 'Which mix is stronger: $3$ scoops of cocoa per $4$ cups of milk, or $4$ scoops per $6$ cups?'
      answer_contract: {kind: label, options: [['3 scoops per 4 cups', 'the first mix'], ['4 scoops per 6 cups', 'the second mix']]}
      answer: '3 scoops per 4 cups'
      solution_sketch: '$\frac{3}{4} = 0.75$ against $\frac{4}{6} \approx 0.67$.'
    anki_seeds:
      - front: "Two ratios are equivalent when both parts of one are obtained from the other by..."
        back: "multiplying (or dividing) by the same number"
        type: basic

  - id: unit-rates
    name: Unit Rates
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: multi-step
    expected_time_secs: 75
    prerequisites:
      - id: understanding-ratios
        weight: 0.8
        key: true
      - id: decimal-operations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Computing a unit rate
        key_prerequisites: [understanding-ratios]
        try_first:
          problem: 'A tap fills a $20$ litre bucket in $4$ minutes at a steady rate. How many litres does it pour in one minute?'
          answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
          answer: '5'
          reveal: 'The $20$ litres are shared equally among the $4$ minutes, so each minute brings $20\div4=5$ litres. An amount for one unit of the other quantity is called a unit rate.'
        step_check:
          step: 'Divide total distance by total time: 372 ÷ 6.'
          question: 'Why is the speed found by dividing $372$ by $6$?'
          options:
            - 'The larger number is always divided by the smaller one'
            - 'Dividing by $6$ turns the hours into minutes'
            - 'Speed is the time divided by the distance travelled'
            - 'The distance is shared equally among the $6$ hours'
          answer: 'The distance is shared equally among the $6$ hours'
          why: 'Speed in km per hour is the distance covered in one hour, so the total distance is split into $6$ equal hourly parts.'
        exemplars:
          - problem: 'A car travels $240$ km in $4$ hours. What is its speed in km per hour?'
            answer: "60"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: '$240 \div 4 = 60$.'
          - problem: 'A car travels $180$ km on $12$ litres of fuel. How many km per litre?'
            answer: "15"
            answer_contract: {"kind":"unit","quantity":"length_per_volume","unit":"km/L","allow_omitted":true}
            solution_sketch: '$180 \div 12 = 15$.'
          - problem: 'A printer prints $180$ pages in $4$ minutes. How many pages per minute?'
            answer: "45"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$180 \div 4 = 45$.'
          - problem: 'A hose fills a $150$ litre tub in $6$ minutes. How many litres per minute?'
            answer: "25"
            answer_contract: {"kind":"unit","quantity":"flow","unit":"L/min","allow_omitted":true}
            solution_sketch: '$150 \div 6 = 25$.'
        constraints: "divide to a whole-number rate"
      - id: kp2
        name: Unit prices and better buys
        key_prerequisites: [decimal-operations]
        step_check:
          step: 'Convert €4.80 to cents: 480 cents.'
          question: 'Why convert €$4.80$ to $480$ cents before dividing?'
          options:
            - 'A price in euros can never be divided by a whole number of pens'
            - 'Converting to cents makes each pen cost more than in euros'
            - 'The answer is wanted in cents, and $480$ divides evenly by $8$'
            - 'Prices must always be worked out in cents, never in euros'
          answer: 'The answer is wanted in cents, and $480$ divides evenly by $8$'
          why: 'Working in cents gives the unit price in the unit asked for; $4.80\div8=0.60$ euros is the same price, so converting changes only the unit.'
        exemplars:
          - problem: 'Jar A holds $300$ g of honey and costs €$3.60$. Jar B holds $400$ g and costs €$4.00$. Which jar is the better buy?'
            answer: "jar b"
            answer_contract: {"kind":"label","options":[["jar b","b","jar b is the better buy","b is the better buy","jar b is better"],["jar a","a","jar a is the better buy","a is the better buy","jar a is better"]]}
            solution_sketch: 'Per $100$ g, jar A costs $3.60\div3=1.20$ euros and jar B costs $4.00\div4=1.00$ euro. Jar B costs less for the same amount, so jar B is the better buy.'
          - problem: 'Six eggs cost €$2.40$. What is the cost per egg in cents?'
            answer: "40"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"cent","allow_omitted":true}
            solution_sketch: '$2.40 \div 6 = 0.4$ euros, which is $40$ cents.'
          - problem: 'Bag A holds $250$ g of rice and costs €$2.00$. Bag B holds $500$ g and costs €$4.50$. Which bag is the better buy?'
            answer: "bag a"
            answer_contract: {"kind":"label","options":[["bag a","a","bag a is the better buy","a is the better buy","bag a is better"],["bag b","b","bag b is the better buy","b is the better buy","bag b is better"]]}
            solution_sketch: 'Two bags A hold $500$ g and cost $2\times2.00=4.00$ euros, while bag B costs $4.50$ euros for the same $500$ g. Bag A is cheaper per gram, so bag A is the better buy.'
          - problem: 'Four notebooks cost €5.00. What is the cost per notebook in cents?'
            answer: "125"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"cent","allow_omitted":true}
            solution_sketch: '$5.00 \div 4 = 1.25$ euros, which is $125$ cents.'
          - problem: "A pack of 8 batteries costs 6.40 euros. Find the cost per battery in cents."
            answer: "80"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"cent","allow_omitted":true}
            solution_sketch: "Step 1 (unit price): divide 6.40 by 8 to get 0.80 euros per battery. Step 2 (convert to cents): 0.80 euros is 80 cents, so the answer is 80."
          - problem: "A 3 kg bag of flour costs 4.50 euros. Find the cost per kilogram in cents."
            answer: "150"
            answer_contract: {"kind":"unit","quantity":"euro_per_mass","unit":"cents/kg","allow_omitted":true}
            solution_sketch: "Step 1 (unit price): divide 4.50 by 3 to get 1.50 euros per kilogram. Step 2 (convert to cents): 1.50 euros is 150 cents, so the answer is 150."
        constraints: "money per unit; 2-decimal answers or cents"
      - id: kp3
        name: Using a rate to scale up
        key_prerequisites: [understanding-ratios]
        step_check:
          step: 'Multiply the rate by the number of hours: 24 × 9.'
          question: 'Why is the total found by multiplying $24$ by $9$?'
          options:
            - 'Multiplying the two numbers given always gives a total'
            - 'Each of the $9$ hours adds another $24$ pages'
            - 'Each extra hour adds one page, so the rate grows'
            - 'Each page takes $9$ hours, so the time is $24$ times $9$'
          answer: 'Each of the $9$ hours adds another $24$ pages'
          why: 'A rate of $24$ pages per hour means $9$ hours hold $9$ equal groups of $24$ pages, and the total of equal groups is a product.'
        exemplars:
          - problem: 'At $55$ km per hour, how far do you travel in $3$ hours?'
            answer: "165"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: '$55 \times 3 = 165$.'
          - problem: 'Ria types $38$ words per minute. How many words in $5$ minutes?'
            answer: "190"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$38 \times 5 = 190$.'
          - problem: 'A conveyor moves $72$ boxes per hour. How many boxes move during four hours?'
            answer: "288"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four equal hourly groups contain $72\times4=288$ boxes.'
          - problem: 'A pump moves $45$ litres of water per minute. How many litres does it move in $8$ minutes?'
            answer: "360"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Each of the $8$ minutes moves another $45$ litres. So the pump moves $45\times8=360$ litres.'
        constraints: "rate times whole-number quantity"
    diagnostic_exemplar:
      problem: 'A $500$ g pack of muesli costs €4.00 and a $750$ g pack costs €5.25. Which is the better buy (lower cost per $100$ g)?'
      answer_contract: {kind: label, options: [['the 500 g pack', '500 g'], ['the 750 g pack', '750 g']]}
      answer: "the 750 g pack"
      solution_sketch: 'Cost per $100$ g: $\frac{4.00}{5} = 0.80$ against $\frac{5.25}{7.5} = 0.70$.'
    anki_seeds:
      - front: "A unit rate is a ratio whose second quantity is..."
        back: "1 (e.g. km per 1 hour, euros per 1 item)"
        type: basic

  - id: ratios-proportions
    name: Ratios and Proportions
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: understanding-ratios
        weight: 0.8
        key: true
      - id: unit-rates
        weight: 0.6
        key: true
      - id: multiplying-fractions
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Solving a proportion
        key_prerequisites: [multiplying-fractions]
        step_check:
          step: 'The denominator scales from $4$ to $8$ by a factor of $2$.'
          question: 'Why must the numerator $7$ also be multiplied by $2$?'
          options:
            - 'The numerator must grow by $4$, as the denominator did'
            - 'The numerator is always half of the denominator here'
            - 'Equal fractions multiply top and bottom by the same number'
            - 'Only the denominator is scaled, so the numerator stays at $7$'
          answer: 'Equal fractions multiply top and bottom by the same number'
          why: 'Multiplying the top and bottom of $7/4$ by $2$ gives the same value $14/8$; adding $4$ to each part would give $11/8$, a different number.'
        exemplars:
          - problem: 'Solve for $x$: $\frac{3}{4} = \frac{x}{12}$.'
            answer: "9"
            solution_sketch: 'Cross-multiply: $4x = 36$, so $x = 9$.'
          - problem: 'Solve for $x$: $\frac{2}{5} = \frac{6}{x}$.'
            answer: "15"
            solution_sketch: 'Cross-multiply: $2x = 30$, so $x = 15$.'
          - problem: 'Solve for $x$: $5:6 = x:24$.'
            answer: "20"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second parts scale by $24\div6=4$. So $x=5\times4=20$.'
          - problem: 'Solve for $x$: $\frac{4}{9} = \frac{20}{x}$.'
            answer: "45"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Cross-multiply: $4x=9\times20=180$. So $x=180/4=45$.'
        constraints: "one unknown; whole-number solution"
      - id: kp2
        name: Proportion word problems
        key_prerequisites: [unit-rates]
        step_check:
          step: 'Divide to find the unit price: $21 \div 7=3$ euros per ticket.'
          question: 'Why find the price of one ticket first?'
          options:
            - 'Five more tickets then cost five more euros than seven do'
            - 'Dividing the two given numbers always gives the answer'
            - 'The price of one ticket is the total price minus the ticket count'
            - 'Then any number of tickets costs that price times the count'
          answer: 'Then any number of tickets costs that price times the count'
          why: 'At a fixed rate the cost is the unit price times the number of tickets; each extra ticket adds €$3$, not €$1$.'
        exemplars:
          - problem: 'If $3$ pens cost €6, how much do $5$ pens cost?'
            answer: "10"
            solution_sketch: 'Unit rate €2 per pen; $5 \times 2 = 10$.'
          - problem: 'A recipe uses $8$ cups of rice for $4$ people. How many cups are needed for $12$ people?'
            answer: "24"
            solution_sketch: 'The rate is $8\div4=2$ cups per person; $12\times2=24$ cups.'
          - problem: 'Four trays hold $12$ portions. At the same rate, how many portions fill $6$ trays?'
            answer: "18"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each tray holds $12\div4=3$ portions. So $6$ trays hold $6\times3=18$ portions.'
          - problem: 'A cyclist rides $18$ km in $3$ hours. At the same speed, how many km does she ride in $9$ hours?'
            answer: "54"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Her speed is $18\div3=6$ km per hour. In $9$ hours she rides $9\times6=54$ km.'
        constraints: "whole-number rates and answers"
      - id: kp3
        name: Scale and indirect measurement
        key_prerequisites: [understanding-ratios]
        step_check:
          step: 'The drawn length scales by $10 \div 2=5$.'
          question: 'Why does the real length scale by the same factor $5$?'
          options:
            - 'The real length grows by $8$ cm, like the drawn length'
            - 'Drawn and real lengths stay in the ratio $2:500$'
            - '$500$ is a multiple of $5$, so it scales by $5$'
            - 'Each drawn centimetre stands for $5$ real ones on this map'
          answer: 'Drawn and real lengths stay in the ratio $2:500$'
          why: 'A scale drawing keeps one fixed ratio between drawn and real lengths, so multiplying the drawn length by $5$ multiplies the real length by $5$.'
        exemplars:
          - problem: 'A model car is built at a $1:24$ scale. The model is $7$ cm long. How long is the real car in cm?'
            answer: "168"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The real object is $24$ times the model: $7 \times 24 = 168$.'
          - problem: 'A $1.6$ m person casts a $2.4$ m shadow while a tree casts a $24$ m shadow. How tall is the tree in metres?'
            answer: "16"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: '$\frac{1.6}{2.4} = \frac{h}{24}$, so $h = 24 \times \frac{1.6}{2.4} = 16$.'
          - problem: 'A scale drawing uses $1$ cm for $48$ cm. A real object is $288$ cm long. How long is its drawing in cm?'
            answer: "6"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The drawing-to-real ratio is $1:48$; $288\div48=6$ cm on the drawing.'
          - problem: 'A $2$ m pole casts a $3$ m shadow. At the same time a tower casts a $12$ m shadow. Find the tower height in metres.'
            answer: "8"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The shadow scale factor is $12\div3=4$; the tower height is $2\times4=8$ m.'
        constraints: "same-units proportions; whole-number answers"
    diagnostic_exemplar:
      problem: 'A model boat is built at a $1:36$ scale. The model is $9$ cm long. How long is the real boat in cm?'
      answer: "324"
      answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
      solution_sketch: 'The real boat is $36$ times the model: $9 \times 36 = 324$.'
    anki_seeds:
      - front: "In a proportion a/b = c/d, cross-multiplication gives the equation..."
        back: "a x d = b x c"
        type: basic

  - id: percent-applications
    name: Percent Applications
    core: false                # enrichment / applications leaf topic
    difficulty: 0.4
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: percentages
        weight: 0.7
        key: true
      - id: percent-finding-the-whole
        weight: 0.6
        key: true
      - id: decimal-operations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Percent increase and decrease
        key_prerequisites: [percentages]
        step_check:
          step: 'the new price is 115% of the old price'
          question: 'Why is the new price $115\%$ of the old price?'
          options:
            - 'The old price is kept ($100\%$) and $15\%$ more is added'
            - 'A $15\%$ increase always adds exactly €15 to the old price'
            - 'The new price is $15\%$ of the old price, so multiply by $0.15$'
            - 'Percents above $100\%$ show a price that has been doubled'
          answer: 'The old price is kept ($100\%$) and $15\%$ more is added'
          why: '$100\% + 15\% = 115\%$, so one multiplication by $1.15$ gives the new price; multiplying by $0.15$ gives only the increase.'
        exemplars:
          - problem: 'A shirt costs €50 and is marked up $20\%$. What is the new price in euros?'
            answer: "60"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The new price is $120\%$ of the old one. So $50 \times 1.20 = 60$ euros.'
          - problem: 'An €84 jacket is $25\%$ off. What is the sale price in euros?'
            answer: "63"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The sale price is $75\%$ of the old price. So $84 \times 0.75 = 63$ euros.'
          - problem: 'A €70 item is marked up $30\%$. What is the new price in euros?'
            answer: "91"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The new price is $130\%$ of the old one. So $70 \times 1.3 = 91$ euros.'
          - problem: 'A wholesaler reduces a €120 price by $15\%$. What is the new price in euros?'
            answer: "102"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The remaining price is $100\%-15\%=85\%$ of the old one. So $120\times0.85=102$ euros.'
        constraints: "single percent change; whole-euro answers"
      - id: kp2
        name: Reversing a percent change
        key_prerequisites: [percent-finding-the-whole]
        try_first:
          problem: 'After a $50\%$ discount, a book costs €10. What was its original price in euros?'
          answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
          answer: '20'
          reveal: 'The €10 is half of the original price, so the original was €20, not €15. The discount was a percent of the original price, so undo it by dividing by what is left.'
        step_check:
          step: 'leaves $75\%$ of the original price'
          question: 'Why is $96$ divided by $0.75$, rather than increased by $25\%$?'
          options:
            - 'Adding $25\%$ of $96$ gives the same answer, only more slowly'
            - 'A discount is always reversed by adding the same percent back'
            - 'The $25\%$ was taken from the original price, not from $96$'
            - 'Dividing by $0.75$ finds $75\%$ of $96$, which is the original'
          answer: 'The $25\%$ was taken from the original price, not from $96$'
          why: '$96$ is $75\%$ of the original, so the original is $96\div0.75=128$; adding $25\%$ of $96$ gives only $120$, because $25\%$ of the smaller price is less.'
        exemplars:
          - problem: 'After a $30\%$ discount, a coat sells for €42. What was the original price in euros?'
            answer: "60"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: '$42$ is $70\%$ of the original. So the original is $42 \div 0.70 = 60$ euros.'
          - problem: 'A price rose $10\%$ to €88. What was the price before the increase?'
            answer: "80"
            answer_contract: {kind: exact}
            solution_sketch: '$88$ is $110\%$ of the old price. So the old price is $88 \div 1.10 = 80$ euros.'
          - problem: 'After a $20\%$ discount, a lamp sells for €36. What was the original price in euros?'
            answer: "45"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: '$36$ is $80\%$ of the original. So the original is $36 \div 0.8 = 45$ euros.'
          - problem: 'After a $25\%$ increase, a price is €90. What was the original price in euros?'
            answer: "72"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The new price is $125\%$ of the original, so $1.25x=90$. Then $x=90/1.25=72$ euros.'
        constraints: "divide by (1 +/- p/100); whole-euro answers"
      - id: kp3
        name: Multi-step percent problems
        key_prerequisites: [percentages]
        step_check:
          step: 'Apply the second discount to the new price'
          question: 'Why do discounts of $20\%$ and then $10\%$ not make a $30\%$ discount?'
          options:
            - 'Percents can never be added together, even of one price'
            - 'The second discount is always larger than the first one'
            - 'The two discounts multiply to $2\%$, they do not add to $30\%$'
            - 'The $10\%$ is taken from the reduced price, not from €150'
          answer: 'The $10\%$ is taken from the reduced price, not from €150'
          why: '$150\times0.80\times0.90=150\times0.72$, a $28\%$ discount in total, because the second $10\%$ is $10\%$ of €120.'
        exemplars:
          - problem: 'A €40 meal has an $8\%$ service charge and a $15\%$ tip, each computed on the €40. What is the total in euros?'
            answer: "49.20"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The service charge is $0.08\times40=3.20$ and the tip is $0.15\times40=6.00$. The total is $40+3.20+6.00=49.20$ euros.'
          - problem: 'A population of $200$ grows $10\%$, then grows $10\%$ again. What is the final population?'
            answer: "242"
            answer_contract: {kind: exact}
            solution_sketch: 'The first growth gives $200 \times 1.1 = 220$. The second growth gives $220 \times 1.1 = 242$.'
          - problem: 'A €60 order receives a $10\%$ discount, then a $5\%$ delivery surcharge on the discounted price. Find the final price in euros.'
            answer: "56.70"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The discount gives $60\times0.90=54$ euros. Then $54\times1.05=56.70$ euros.'
          - problem: 'A €500 price rises $20\%$ and then falls $20\%$ from the increased value. What is the final price in euros?'
            answer: "480"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The increase gives $500\times1.20=600$. The decrease gives $600\times0.80=480$ euros.'
        constraints: "two-step; answers to the cent or whole number"
    diagnostic_exemplar:
      problem: 'After a $20\%$ discount, a rucksack sells for €48. What was the original price in euros?'
      answer: "60"
      answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
      solution_sketch: 'The sale price is $80\%$ of the original, so $p = \frac{48}{0.8} = 60$.'
    anki_seeds:
      - front: "The new amount after a p% increase equals the original times..."
        back: "(1 + p/100)"
        type: basic
      - front: "The new amount after a p% decrease equals the original times..."
        back: "(1 - p/100)"
        type: basic

  - id: simple-interest
    name: Simple Interest
    # over-coverage: I = Prt is a percent application, same class as the already
    # supplemental percent-applications; not a university prerequisite
    core: false
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 100
    prerequisites:
      - id: percent-of-a-number
        weight: 0.9
        key: true
      - id: decimal-operations
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Interest for one year
        key_prerequisites: [percent-of-a-number]
        step_check:
          step: 'Convert the annual percentage to a decimal'
          question: 'Why is $7\%$ changed to $0.07$ before it is multiplied by the principal?'
          options:
            - 'A rate must always be a number less than one'
            - '$7\%$ means $7$ hundredths, and $7\div100=0.07$'
            - '$7\%$ means $7$ tenths of the principal, or $0.7$'
            - 'The principal is in euros and the rate is not'
          answer: '$7\%$ means $7$ hundredths, and $7\div100=0.07$'
          why: 'A percent is a number of hundredths. The interest is $7$ hundredths of the principal, so the rate used in the product is $\frac{7}{100}=0.07$.'
        exemplars:
          - problem: '€500 is deposited at $4\%$ simple interest per year. How much interest is earned in one year?'
            answer: "20"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The interest is $4\%$ of the principal: $500\times0.04=20$ euros.'
          - problem: '€1200 is borrowed at $3\%$ simple interest per year. How much interest accrues in one year?'
            answer: "36"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The interest is $3\%$ of the loan: $1200\times0.03=36$ euros.'
          - problem: 'A bank pays $6\%$ simple interest per year on €900. How much interest does the account earn in a year?'
            answer: "54"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Convert the rate to $0.06$: $900\times0.06=54$ euros of interest.'
          - problem: 'A savings account pays $3\%$ simple interest per year and paid €42 of interest in one year. How much money was deposited?'
            answer: "1400"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The interest is $3\%$ of the deposit, so $0.03\times P=42$. Dividing gives $P=42\div0.03=1400$ euros.'
          - problem: 'A €1500 loan charges $2\%$ simple interest per year. How much interest is charged in one year?'
            answer: "30"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'One percent of $1500$ is $15$ euros, so two percent is $2\times15=30$ euros.'
          - problem: 'Sam finds the one-year interest on €700 at $5\%$ simple interest by computing $700\times5$ and gets $3500$. What is the correct interest in euros?'
            answer: "35"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Sam used $5$ in place of $0.05$. The correct interest is $700\times0.05=35$ euros, and $3500$ is $100$ times too large.'
          - problem: 'A bank charges €63 of simple interest in one year on a €900 loan. What is the annual rate?'
            answer: "7%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rate is the interest divided by the principal: $63\div900=0.07$, which is $7\%$ per year.'
        constraints: "one year; whole-euro answers; the interest, the principal or the rate may be unknown"
      - id: kp2
        name: The formula I = Prt
        key_prerequisites: [percent-of-a-number]
        step_check:
          step: 'Five years earn $30 \times 5=150$ euros'
          question: 'Why is the one-year interest of $30$ euros simply multiplied by $5$?'
          options:
            - 'Interest is added to the principal, so later years earn more'
            - 'The rate is found by dividing the interest by the five years'
            - 'Simple interest is paid on the original principal every year'
            - 'The principal is spent in the first year, so it is paid back'
          answer: 'Simple interest is paid on the original principal every year'
          why: 'Simple interest never joins the principal, so every year earns the same $750\times0.04=30$ euros. Five equal years give $5\times30=150$ euros.'
        exemplars:
          - problem: '€800 earns $5\%$ simple interest per year for $3$ years. How much interest is that in total?'
            answer: "120"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: '$I=Prt=800\times0.05\times3=40\times3=120$ euros.'
          - problem: '€2000 earns $2.5\%$ simple interest per year for $4$ years. How much interest is that in total?'
            answer: "200"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: '$I=Prt=2000\times0.025\times4=50\times4=200$ euros.'
          - problem: 'A €500 deposit earns $4\%$ simple interest each year. How much interest has it earned after $5$ years?'
            answer: "100"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Each year earns $500\times0.04=20$ euros. Five years earn $5\times20=100$ euros.'
          - problem: 'Two €750 deposits each earn $3\%$ simple interest per year for two years. How much interest do they earn together?'
            answer: "90"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'One deposit earns $750\times0.03\times2=45$ euros; together they earn $2\times45=90$ euros.'
          - problem: 'A €1200 deposit at $3\%$ simple interest per year has earned €180 of interest. For how many years has it been in the account?'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One year earns $1200\times0.03=36$ euros. The number of years is $180\div36=5$.'
          - problem: 'Mia says that €400 at $5\%$ simple interest for $3$ years earns $400\times0.05=20$ euros. What interest does it earn?'
            answer: "60"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Mia found the interest for one year only. For $3$ years it is $400\times0.05\times3=60$ euros.'
          - problem: 'A deposit at $4\%$ simple interest per year earned €96 in $3$ years. How much was deposited?'
            answer: "800"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Each euro of principal earns $0.04\times3=0.12$ euro in $3$ years. So the principal is $96\div0.12=800$ euros.'
        constraints: "whole-number years; whole-euro answers; the interest, the principal or the time may be unknown"
      - id: kp3
        name: Totals and finding the rate
        key_prerequisites: [decimal-operations]
        step_check:
          step: 'Balance = principal + interest'
          question: 'Why is the balance the principal plus the interest and not the interest alone?'
          options:
            - 'The interest is only the extra amount earned on the deposit'
            - 'The principal is spent when the interest starts to be paid'
            - 'The balance is the rate times the principal and the years'
            - 'The interest is part of the principal, so it is counted twice'
          answer: 'The interest is only the extra amount earned on the deposit'
          why: 'The account still holds the original principal, and the interest is the extra amount earned on it. The balance is both together: $750+135=885$.'
        exemplars:
          - problem: '€600 is deposited at $5\%$ simple interest per year. What is the account balance after $2$ years?'
            answer: "660"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Interest is $600\times0.05\times2=60$ euros. The balance is $600+60=660$ euros.'
          - problem: 'A €400 deposit earned €60 of simple interest over $3$ years. What was the annual interest rate?'
            answer: "5%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One year earned $60\div3=20$ euros. The rate is $20\div400=0.05$, which is $5\%$ per year.'
          - problem: 'A loan of €300 charges $8\%$ simple interest per year for four years. How much must be paid back altogether?'
            answer: "396"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Interest is $300\times0.08\times4=96$ euros; principal plus interest is $300+96=396$ euros.'
          - problem: 'A €500 deposit earned €75 of simple interest in five years. What was the annual interest rate?'
            answer: "3%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One year earned $75\div5=15$ euros. The rate is $15\div500=0.03$, which is $3\%$ per year.'
          - problem: 'After $2$ years at $4\%$ simple interest per year, an account holds €1080. How much was deposited?'
            answer: "1000"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'In $2$ years each euro earns $0.04\times2=0.08$ euro, so each euro becomes $1.08$ euros. The deposit is $1080\div1.08=1000$ euros.'
          - problem: 'Eli says that €200 at $3\%$ simple interest for $2$ years has a balance of $200\times0.03\times2=12$ euros. What is the balance?'
            answer: "212"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Eli found only the interest. The balance also holds the principal: $200+12=212$ euros.'
          - problem: 'A loan of €1000 must be repaid with €1210 after $3$ years of simple interest. What is the annual interest rate?'
            answer: "7%"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The interest is $1210-1000=210$ euros, or $70$ euros per year. The rate is $70\div1000=0.07$, which is $7\%$ per year.'
        constraints: "balance = principal + interest; clean rates"
    diagnostic_exemplar:
      problem: '€500 is deposited at $4\%$ simple interest per year. What is the account balance after $3$ years?'
      answer: "560"
      solution_sketch: '$I = Prt = 500 \times 0.04 \times 3 = 60$; the balance is $500 + 60$.'
    anki_seeds:
      - front: "Simple interest formula: I equals..."
        back: "P x r x t (principal x annual rate as a decimal x years)"
        type: basic
      - front: "With simple interest, the final balance equals..."
        back: "principal + interest, i.e. P(1 + rt)"
        type: basic
