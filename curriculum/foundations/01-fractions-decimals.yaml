        exemplars:
          - problem: 'Which is larger, $0.7$ or $0.65$?'
            answer: "0.7"
            solution_sketch: 'Compare tenths: $7 > 6$, so $0.7 > 0.65$.'
          - problem: 'Which is larger, $2.09$ or $2.4$?'
            answer: "2.4"
        constraints: "1-2 decimal places; traps where more digits does not mean larger"
      - id: kp2
        name: Trailing zeros
        key_prerequisites: [decimal-place-value]
        exemplars:
          - problem: 'Are $0.5$ and $0.50$ equal? (yes/no)'
            answer: "yes"
          - problem: 'Compare $0.080$ and $0.08$: is the first larger, smaller, or equal?'
            answer: "equal"
            solution_sketch: 'Trailing zeros after the decimal point do not change the value.'
        constraints: "pairs differing only by trailing zeros"
      - id: kp3
        name: Ordering lists of decimals
        key_prerequisites: [decimal-place-value]
        exemplars:
          - problem: 'Order from least to greatest: $0.3$, $0.28$, $0.302$.'
            answer: "0.28, 0.3, 0.302"
            solution_sketch: 'Pad to thousandths: $0.300$, $0.280$, $0.302$.'
          - problem: 'Which is greatest: $1.45$, $1.5$, or $1.405$?'
            answer: "1.5"
        constraints: "3 decimals with different numbers of places"
    diagnostic_exemplar:
      problem: 'Order from least to greatest: $0.4$, $0.38$, $0.409$.'
      answer: '0.38, 0.4, 0.409'
      solution_sketch: 'Pad to three places: $0.400$, $0.380$, $0.409$.'
    anki_seeds:
      - front: "To compare decimals, line up the decimal points and compare digits..."
        back: "place by place from left to right (pad with trailing zeros if needed)"
        type: basic

