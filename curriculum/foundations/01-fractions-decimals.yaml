      - id: kp2
        name: Harder percents
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: '$36$ is $45\%$ of what number?'
            answer: "80"
            solution_sketch: '$36 \div 0.45 = 80$.'
          - problem: 'A progress bar shows $5\%$ complete after $8$ units. Find its full capacity.'
            answer: "160"
            solution_sketch: 'One percent represents $8\div5=1.6$ units; one hundred percent represents $1.6\times100=160$ units.'
          - problem: 'Complete $0.65\times x=39$ to recover the whole of which $39$ is $65\%$.'
            answer: "60"
            solution_sketch: '$0.65=65/100$; $x=39\times100/65=60$.'
          - problem: 'A €7 fee equals $35\%$ of a booking price. Find the whole booking price in euros.'
            answer: "20"
            solution_sketch: '$35\%=7/20$; $7\div(7/20)=20$ euros.'
        constraints: "percents that are not simple benchmarks"
      - id: kp3
        name: Finding the whole in context
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'A deposit of €30 is $20\%$ of the price of a bike. What is the price?'
            answer: "150"
            solution_sketch: '$30 \div 0.20 = 150$.'
          - problem: '$12$ students are absent today, which is $15\%$ of the class. How many students are in the class?'
            answer: "80"
            solution_sketch: '$12 \div 0.15 = 80$.'
          - problem: 'A discount of €18 is $10\%$ of the price of a phone. What is the price?'
            answer: "180"
            solution_sketch: '$18 \div 0.1 = 180$.'
          - problem: '$16$ students are late today, which is $8\%$ of the class. How many students are in the class?'
            answer: "200"
            solution_sketch: '$16 \div 0.08 = 200$.'
        constraints: "one unknown whole; whole-number answers"
    diagnostic_exemplar:
      problem: 'A deposit of €27 is $15\%$ of the price of a laptop. What is the price in euros?'
      answer: "180"
      solution_sketch: '$0.15p = 27$, so $p = \frac{27}{0.15} = 180$.'
    anki_seeds:
      - front: "If a part and its percent are known, the whole equals..."
        back: "part divided by the percent written as a decimal"
        type: basic

  # --------------------------------------------------------------------- #
  # Ratios, rates, and proportions
  # --------------------------------------------------------------------- #
  - id: understanding-ratios
    name: Understanding Ratios
    core: true
    difficulty: 0.28
    drill: false
    # Ratio answers ("2:3") are not SymPy expressions; the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 60
    prerequisites:
      - id: equivalent-fractions
        weight: 0.8
        key: true
      - id: division-facts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Writing ratios
        key_prerequisites: [equivalent-fractions]
        exemplars:
          - problem: 'There are $6$ apples and $9$ oranges. Write the ratio of apples to oranges in simplest form.'
            answer: "2:3"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: '$\text{GCF}(6, 9) = 3$; $6:9 = 2:3$.'
          - problem: 'A bag has $3$ red and $5$ blue marbles. Write the ratio of red marbles to ALL marbles.'
            answer: "3:8"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'Total is $3 + 5 = 8$; $3:8$.'
          - problem: 'There are $4$ dogs and $10$ cats. Write the ratio of dogs to cats in simplest form.'
            answer: "2:5"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: '$\text{GCF}(4, 10) = 2$; $4:10 = 2:5$.'
          - problem: 'A drawer has $5$ pens and $7$ pencils. Write the ratio of pens to ALL items in the drawer.'
            answer: "5:12"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'Total is $5 + 7 = 12$; $5:12$.'
        constraints: "part:part and part:whole forms; parts up to 20"
      - id: kp2
        name: Simplifying ratios
        key_prerequisites: [division-facts]
        exemplars:
          - problem: 'Simplify the ratio $8:12$.'
            answer: "2:3"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'Divide both parts by GCF $4$.'
          - problem: 'A drink uses $15$ parts juice and $25$ parts water. Group both counts into packets of five. Give the reduced juice-to-water ratio.'
            answer: "3:5"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: '$15\div5=3$ and $25\div5=5$; the reduced ratio is $3:5$.'
          - problem: 'Reduce $12:30$ using their prime factors $12=2\times2\times3$ and $30=2\times3\times5$.'
            answer: "2:5"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'Cancel the shared factor $2\times3=6$ from both parts to get $2:5$.'
          - problem: 'The ratio $18:24$ was reduced once to $9:12$. Finish reducing it to its simplest form.'
            answer: "3:4"
            answer_contract: {"kind":"reduced_ratio"}
            solution_sketch: 'Both remaining parts divide by $3$: $9:12=3:4$, and $3$ and $4$ are coprime.'
        constraints: "parts up to 40"
      - id: kp3
        name: Equivalent ratios
        key_prerequisites: [equivalent-fractions]
        exemplars:
          - problem: 'Fill in: $2:3 = 8:\square$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both parts were multiplied by $4$.'
          - problem: 'Are $4:6$ and $10:15$ equivalent? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Both simplify to $2:3$.'
          - problem: 'Fill in: $3:5 = \square:20$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The second part scales by $20\div5=4$; the first becomes $3\times4=12$.'
          - problem: 'A recipe scales $3:4$ to $9:12$. Does each part use the same scale factor? Answer yes or no.'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$9\div3=3$ and $12\div4=3$, so both parts use scale factor $3$.'
        constraints: "scale factors 2-5"
    diagnostic_exemplar:
      problem: 'In a class of $30$ pupils there are $12$ boys. Write the ratio of boys to girls in simplest form.'
      answer_contract: {kind: reduced_ratio}
      answer: '2:3'
      solution_sketch: 'There are $30 - 12 = 18$ girls, and $12:18$ simplifies to $2:3$.'
    anki_seeds:
      - front: "A part-to-part ratio compares two groups; a part-to-whole ratio compares one group to..."
        back: "the total of all groups"
        type: basic

  - id: ratio-tables-equivalent-ratios
    name: Ratio Tables
    core: false                # scaffold representation leaf; ratios-proportions stays core
    difficulty: 0.3
    drill: false
    answer_kind: multi-step
    expected_time_secs: 70
    prerequisites:
      - id: understanding-ratios
        weight: 0.9
        key: true
      - id: multiplication-tables
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Completing a ratio table
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'A recipe uses $2$ eggs for every $3$ cups of flour. How many cups of flour go with $4$ eggs?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Double both parts of $2:3$ to get $4:6$.'
          - problem: 'A ratio table pairs $3$ with $12$. Scale the first entry to $9$. What is the matching second entry?'
            answer: "36"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first entry scales by $9\div3=3$; multiply $12$ by $3$ to get $36$.'
          - problem: 'A table pairs $3$ eggs with $5$ cups of flour. Combine three identical rows. How many cups pair with $9$ eggs?'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the flour entries $5+5+5=15$ while the egg entries total $3+3+3=9$.'
          - problem: 'A machine pairs $4$ input units with $10$ output units. A table row has $20$ input units. Complete its output entry.'
            answer: "50"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The row is $20\div4=5$ times the basic row, so output is $10\times5=50$.'
        constraints: "whole-number scale factors"
      - id: kp2
        name: Scaling ratios up and down
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'Punch mixes $3$ parts juice with $2$ parts soda. With $9$ cups of juice, how many cups of soda?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scale factor $3$: $2 \times 3 = 6$.'
          - problem: 'A map uses $1$ cm for every $4$ km. How many km does $7$ cm represent?'
            answer: "28"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scale factor $7$: $4 \times 7 = 28$.'
          - problem: 'A smoothie mixes $2$ parts yogurt with $5$ parts fruit. With $8$ cups of yogurt, how many cups of fruit?'
            answer: "20"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scale factor $4$: $5 \times 4 = 20$.'
          - problem: 'A blueprint uses $1$ cm for every $6$ m. A wall is $42$ m long. How many cm long is its drawing?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scale $1:6$ by $42\div6=7$ to obtain $7:42$; the drawing is $7$ cm long.'
        constraints: "scale factors 2-8; whole-number answers"
      - id: kp3
        name: Comparing ratios
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'Class A has $12$ girls and $18$ boys; Class B has $10$ girls and $15$ boys. Do the classes have the same girl-to-boy ratio? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'Both simplify to $2:3$.'
          - problem: 'Which mix is stronger: $2$ scoops of cocoa per $3$ cups of milk, or $3$ scoops per $5$ cups?'
            answer: "2 scoops per 3 cups"
            answer_contract: {"kind":"label","options":[["2 scoops per 3 cups"],["3 scoops per 5 cups"]]}
            solution_sketch: 'Compare $\frac{2}{3} = \frac{10}{15}$ with $\frac{3}{5} = \frac{9}{15}$.'
          - problem: 'Mix A uses $9$ cups of concentrate with $15$ cups of water. Mix B uses $12$ with $20$. Give the common concentrate amount when both are scaled to $60$ cups of water.'
            answer: "36"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Scale A by $4$ to $36:60$ and B by $3$ to $36:60$. Both use $36$ cups of concentrate.'
          - problem: 'Paint A uses $3$ scoops of pigment per $8$ cups of base; paint B uses $5$ per $12$. Which uses fewer scoops when both are scaled to $24$ cups of base? Answer A or B.'
            answer: "A"
            answer_contract: {"kind":"label","options":[["A"],["B"]]}
            solution_sketch: 'A scales to $9:24$ and B to $10:24$. Since $9<10$, A uses fewer scoops.'
        constraints: "compare after rewriting with a common part"
    diagnostic_exemplar:
      problem: 'Which mix is stronger: $3$ scoops of cocoa per $4$ cups of milk, or $4$ scoops per $6$ cups?'
      answer_contract: {kind: label, options: [['3 scoops per 4 cups', 'the first mix'], ['4 scoops per 6 cups', 'the second mix']]}
      answer: '3 scoops per 4 cups'
      solution_sketch: '$\frac{3}{4} = 0.75$ against $\frac{4}{6} \approx 0.67$.'
    anki_seeds:
      - front: "Two ratios are equivalent when both parts of one are obtained from the other by..."
        back: "multiplying (or dividing) by the same number"
        type: basic

  - id: unit-rates
    name: Unit Rates
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: multi-step
    expected_time_secs: 75
    prerequisites:
      - id: understanding-ratios
        weight: 0.8
        key: true
      - id: decimal-operations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Computing a unit rate
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'A car travels $240$ km in $4$ hours. What is its speed in km per hour?'
            answer: "60"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$240 \div 4 = 60$.'
          - problem: 'A car travels $180$ km on $12$ litres of fuel. How many km per litre?'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$180 \div 12 = 15$.'
          - problem: 'A printer prints $180$ pages in $4$ minutes. How many pages per minute?'
            answer: "45"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$180 \div 4 = 45$.'
          - problem: 'A hose fills a $150$ litre tub in $6$ minutes. How many litres per minute?'
            answer: "25"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$150 \div 6 = 25$.'
        constraints: "divide to a whole-number rate"
      - id: kp2
        name: Unit prices and better buys
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: 'A $300$ g jar costs €3.60 and a $400$ g jar costs €4.00. Which is the better buy (lower cost per $100$ g)?'
            answer: "the 400 g jar"
            answer_contract: {"kind":"label","options":[["the 400 g jar"],["the 300 g jar"]]}
            solution_sketch: '$3.60 \div 3 = 1.20$ per $100$ g versus $4.00 \div 4 = 1.00$ per $100$ g.'
          - problem: 'Six eggs cost €2.40. What is the cost per egg in cents?'
            answer: "40"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$2.40 \div 6 = 0.4$ euros, which is $40$ cents.'
          - problem: 'A $250$ g bag costs €2.00 and a $500$ g bag costs €4.50. Which is the better buy (lower cost per $100$ g)?'
            answer: "the 250 g bag"
            answer_contract: {"kind":"label","options":[["the 250 g bag"],["the 500 g bag"]]}
            solution_sketch: '$2.00 \div 2.5 = 0.8$ per $100$ g versus $4.50 \div 5 = 0.9$ per $100$ g.'
          - problem: 'Four notebooks cost €5.00. What is the cost per notebook in cents?'
            answer: "125"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$5.00 \div 4 = 1.25$ euros, which is $125$ cents.'
        constraints: "money per unit; 2-decimal answers or cents"
      - id: kp3
        name: Using a rate to scale up
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'At $55$ km per hour, how far do you travel in $3$ hours?'
            answer: "165"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$55 \times 3 = 165$.'
          - problem: 'Ria types $38$ words per minute. How many words in $5$ minutes?'
            answer: "190"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$38 \times 5 = 190$.'
          - problem: 'A conveyor moves $72$ boxes per hour. How many boxes move during four hours?'
            answer: "288"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four equal hourly groups contain $72\times4=288$ boxes.'
          - problem: 'A table lists $45$ words per minute. Complete the total-word entry for $8$ minutes.'
            answer: "360"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the per-minute rate by the duration: $45\times8=360$ words.'
        constraints: "rate times whole-number quantity"
    diagnostic_exemplar:
      problem: 'A $500$ g pack of muesli costs €4.00 and a $750$ g pack costs €5.25. Which is the better buy (lower cost per $100$ g)?'
      answer_contract: {kind: label, options: [['the 500 g pack', '500 g'], ['the 750 g pack', '750 g']]}
      answer: "the 750 g pack"
      solution_sketch: 'Cost per $100$ g: $\frac{4.00}{5} = 0.80$ against $\frac{5.25}{7.5} = 0.70$.'
    anki_seeds:
      - front: "A unit rate is a ratio whose second quantity is..."
        back: "1 (e.g. km per 1 hour, euros per 1 item)"
        type: basic

  - id: ratios-proportions
    name: Ratios and Proportions
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: understanding-ratios
        weight: 0.8
        key: true
      - id: unit-rates
        weight: 0.6
        key: true
      - id: multiplying-fractions
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Solving a proportion
        key_prerequisites: [multiplying-fractions]
        exemplars:
          - problem: 'Solve for $x$: $\frac{3}{4} = \frac{x}{12}$.'
            answer: "9"
            solution_sketch: 'Cross-multiply: $4x = 36$, so $x = 9$.'
          - problem: 'Solve for $x$: $\frac{2}{5} = \frac{6}{x}$.'
            answer: "15"
            solution_sketch: 'Cross-multiply: $2x = 30$, so $x = 15$.'
          - problem: 'Two ratios are equal: $5:6=x:18$. Use the scale factor between corresponding second parts to find $x$.'
            answer: "15"
            solution_sketch: '$18\div6=3$, so $x=5\times3=15$.'
          - problem: 'Solve $4/9=20/x$ by cross-multiplication.'
            answer: "45"
            solution_sketch: '$4x=9\times20=180$, so $x=180/4=45$.'
        constraints: "one unknown; whole-number solution"
      - id: kp2
        name: Proportion word problems
        key_prerequisites: [unit-rates]
        exemplars:
          - problem: 'If $3$ pens cost €6, how much do $5$ pens cost?'
            answer: "10"
            solution_sketch: 'Unit rate €2 per pen; $5 \times 2 = 10$.'
          - problem: 'A recipe uses $8$ cups of rice for $4$ people. How many cups are needed for $12$ people?'
            answer: "24"
            solution_sketch: 'The rate is $8\div4=2$ cups per person; $12\times2=24$ cups.'
          - problem: 'A machine fills $4$ trays with $12$ portions. At the same whole-number rate, how many portions fill $6$ trays?'
            answer: "18"
            solution_sketch: '$12\div4=3$ portions per tray; $6\times3=18$ portions.'
          - problem: 'A distance table pairs $3$ hours with $18$ km. At the same rate, complete the distance for $9$ hours.'
            answer: "54"
            solution_sketch: 'The rate is $18\div3=6$ km per hour, so $9\times6=54$ km.'
        constraints: "whole-number rates and answers"
      - id: kp3
        name: Scale and indirect measurement
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'A model car is built at a $1:24$ scale. The model is $7$ cm long. How long is the real car in cm?'
            answer: "168"
            solution_sketch: 'The real object is $24$ times the model: $7 \times 24 = 168$.'
          - problem: 'A $1.6$ m person casts a $2.4$ m shadow while a tree casts a $24$ m shadow. How tall is the tree in metres?'
            answer: "16"
            solution_sketch: '$\frac{1.6}{2.4} = \frac{h}{24}$, so $h = 24 \times \frac{1.6}{2.4} = 16$.'
          - problem: 'A scale drawing uses $1$ cm for $48$ cm. A real object is $288$ cm long. How long is its drawing in cm?'
            answer: "6"
            solution_sketch: 'The drawing-to-real ratio is $1:48$; $288\div48=6$ cm on the drawing.'
          - problem: 'A $2$ m pole casts a $3$ m shadow. At the same time a tower casts a $12$ m shadow. Find the tower height in metres.'
            answer: "8"
            solution_sketch: 'The shadow scale factor is $12\div3=4$; the tower height is $2\times4=8$ m.'
        constraints: "same-units proportions; whole-number answers"
    diagnostic_exemplar:
      problem: 'A model boat is built at a $1:36$ scale. The model is $9$ cm long. How long is the real boat in cm?'
      answer: "324"
      solution_sketch: 'The real boat is $36$ times the model: $9 \times 36 = 324$.'
    anki_seeds:
      - front: "In a proportion a/b = c/d, cross-multiplication gives the equation..."
        back: "a x d = b x c"
        type: basic

  - id: percent-applications
    name: Percent Applications
    core: false                # enrichment / applications leaf topic
    difficulty: 0.4
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: percentages
        weight: 0.7
        key: true
      - id: percent-finding-the-whole
        weight: 0.6
        key: true
      - id: decimal-operations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Percent increase and decrease
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'A shirt costs €50 and is marked up $20\%$. What is the new price in euros?'
            answer: "60"
            answer_contract: {kind: exact}
            solution_sketch: '$50 \times 1.20 = 60$.'
          - problem: 'An €80 jacket is $25\%$ off. What is the sale price in euros?'
            answer: "60"
            answer_contract: {kind: exact}
            solution_sketch: '$80 \times 0.75 = 60$.'
          - problem: 'A €70 item is marked up $30\%$. What is the new price in euros?'
            answer: "91"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$70 \times 1.3 = 91$.'
          - problem: 'A wholesaler reduces a €120 price by $15\%$. Use the remaining-percent multiplier to give the new price in euros.'
            answer: "102"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The remaining price is $100\%-15\%=85\%$; $120\times0.85=102$ euros.'
        constraints: "single percent change; whole-euro answers"
      - id: kp2
        name: Reversing a percent change
        key_prerequisites: [percent-finding-the-whole]
        exemplars:
          - problem: 'After a $30\%$ discount, a coat sells for €42. What was the original price in euros?'
            answer: "60"
            answer_contract: {kind: exact}
            solution_sketch: '$42$ is $70\%$ of the original: $42 \div 0.70 = 60$.'
          - problem: 'A price rose $10\%$ to €88. What was the price before the increase?'
            answer: "80"
            answer_contract: {kind: exact}
            solution_sketch: '$88 \div 1.10 = 80$.'
          - problem: 'After a $20\%$ discount, a lamp sells for €64. What was the original price in euros?'
            answer: "80"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$64$ is $0.8$ times the original: $64 \div 0.8 = 80$.'
          - problem: 'After a $25\%$ increase, a price is €75. Complete $1.25x=75$ to find the original price in euros.'
            answer: "60"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide by the retained multiplier: $x=75/1.25=60$ euros.'
        constraints: "divide by (1 +/- p/100); whole-euro answers"
      - id: kp3
        name: Multi-step percent problems
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'A €40 meal has an $8\%$ service charge and a $15\%$ tip, each computed on the €40. What is the total in euros?'
            answer: "49.20"
            answer_contract: {kind: exact}
            solution_sketch: 'Tax $3.20$ + tip $6.00 + 40 = 49.20$.'
          - problem: 'A population of $200$ grows $10\%$, then grows $10\%$ again. What is the final population?'
            answer: "242"
            answer_contract: {kind: exact}
            solution_sketch: '$200 \times 1.1 = 220$, then $220 \times 1.1 = 242$.'
          - problem: 'A €60 order receives a $10\%$ discount, then a $5\%$ delivery surcharge on the discounted price. Find the final price in euros.'
            answer: "56.70"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The discount gives $60\times0.90=54$ euros. Then $54\times1.05=56.70$ euros.'
          - problem: 'A €500 price rises $20\%$ and then falls $20\%$ from the increased value. Give the final price in euros.'
            answer: "480"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The increase gives $500\times1.20=600$; the decrease gives $600\times0.80=480$ euros.'
        constraints: "two-step; answers to the cent or whole number"
    diagnostic_exemplar:
      problem: 'After a $20\%$ discount, a rucksack sells for €48. What was the original price in euros?'
      answer: "60"
      solution_sketch: 'The sale price is $80\%$ of the original, so $p = \frac{48}{0.8} = 60$.'
    anki_seeds:
      - front: "The new amount after a p% increase equals the original times..."
        back: "(1 + p/100)"
        type: basic
      - front: "The new amount after a p% decrease equals the original times..."
        back: "(1 - p/100)"
        type: basic

