          - problem: 'Compute $2\frac{1}{4} \div 1\frac{1}{2}$.'
            answer: "3/2"
            solution_sketch: '$\frac{9}{4} \times \frac{2}{3} = \frac{18}{12} = \frac{3}{2}$.'
