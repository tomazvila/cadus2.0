    expected_time_secs: 100
    prerequisites:
      - id: percent-of-a-number
        weight: 0.9
        key: true
      - id: decimal-operations
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Interest for one year
        key_prerequisites: [percent-of-a-number]
        exemplars:
          - problem: '€500 is deposited at $4\%$ simple interest per year. How much interest is earned in one year?'
            answer: "20"
            solution_sketch: '$500 \times 0.04 = 20$.'
          - problem: '€1 200 is borrowed at $3\%$ simple interest per year. How much interest accrues in one year?'
            answer: "36"
            solution_sketch: '$1200 \times 0.03 = 36$.'
          - problem: 'A table lists principal €900, annual simple rate $6\%$, and duration one year. Complete the interest entry in euros.'
            answer: "54"
            solution_sketch: 'Convert the rate to $0.06$: $I=900\times0.06\times1=54$ euros.'
          - problem: 'For a one-year €1500 loan at $2\%$ simple interest, compute interest by first finding one percent. Give euros.'
            answer: "30"
            solution_sketch: 'One percent is $1500\div100=15$ euros. Two percent is $2\times15=30$ euros.'
        constraints: "one year; whole-euro answers"
      - id: kp2
        name: The formula I = Prt
        key_prerequisites: [percent-of-a-number]
        exemplars:
          - problem: '€800 earns $5\%$ simple interest per year for $3$ years. How much interest in total?'
            answer: "120"
            solution_sketch: '$I = 800 \times 0.05 \times 3 = 120$.'
          - problem: 'A simple-interest table has $P=2000$, $r=0.025$ per year, and $t=4$ years. Find $I$ in euros.'
            answer: "200"
            solution_sketch: '$I=Prt=2000\times0.025\times4=50\times4=200$ euros.'
          - problem: 'A €600 principal earns $4\%$ simple interest each year. Add five equal yearly interest amounts to find the interest over five years.'
            answer: "120"
            solution_sketch: 'Each year earns $600\times0.04=24$ euros. Five years earn $5\times24=120$ euros.'
          - problem: 'Two €750 deposits each earn $3\%$ simple interest for two years. Find their combined interest in euros.'
            answer: "90"
            solution_sketch: 'One deposit earns $750\times0.03\times2=45$ euros; together they earn $2\times45=90$ euros.'
        constraints: "whole-number years; whole-euro answers"
      - id: kp3
        name: Totals and finding the rate
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: '€600 is deposited at $5\%$ simple interest per year. What is the account balance after $2$ years?'
            answer: "660"
            solution_sketch: 'Interest $600 \times 0.05 \times 2 = 60$; balance $600 + 60 = 660$.'
          - problem: 'A €400 deposit earned €60 of simple interest over $3$ years. The annual rate is $r\%$. Find $r$.'
            answer: "5"
            solution_sketch: '$r = \frac{60}{400 \times 3} = 0.05 = 5\%$.'
          - problem: 'A loan of €300 charges $8\%$ simple interest per year for four years. Find the principal plus all interest, in euros.'
            answer: "396"
            solution_sketch: 'Interest is $300\times0.08\times4=96$ euros; principal plus interest is $300+96=396$ euros.'
          - problem: 'A table lists principal €500, total simple interest €75, and duration five years. Find the annual percent rate as a number.'
            answer: "3"
            solution_sketch: 'One year earns $75\div5=15$ euros. The percent rate is $(15/500)\times100=3$.'
        constraints: "balance = principal + interest; clean rates"
    diagnostic_exemplar:
      problem: '€500 is deposited at $4\%$ simple interest per year. What is the account balance after $3$ years?'
      answer: "560"
      solution_sketch: '$I = Prt = 500 \times 0.04 \times 3 = 60$; the balance is $500 + 60$.'
    anki_seeds:
      - front: "Simple interest formula: I equals..."
        back: "P x r x t (principal x annual rate as a decimal x years)"
        type: basic
      - front: "With simple interest, the final balance equals..."
        back: "principal + interest, i.e. P(1 + rt)"
        type: basic
