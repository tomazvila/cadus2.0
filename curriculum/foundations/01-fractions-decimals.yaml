        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Adding and subtracting in context
        key_prerequisites: [adding-subtracting-fractions]
        exemplars:
          - problem: 'Lena ran $\frac{3}{4}$ km, rested, then ran $\frac{2}{3}$ km. How far did she run in total (as a fraction of a kilometre)?'
            answer: "17/12"
            solution_sketch: '$\frac{9}{12} + \frac{8}{12} = \frac{17}{12}$.'
          - problem: 'A recipe needs $\frac{2}{3}$ cup of milk; you have measured $\frac{1}{2}$ cup. How much more is needed?'
            answer: "1/6"
        constraints: "denominators up to 12; exact fraction answers"
      - id: kp2
        name: Fraction-of-a-quantity in context
        key_prerequisites: [multiplying-fractions]
        exemplars:
          - problem: 'Of $24$ students, $\frac{3}{8}$ play football. How many students do NOT play football?'
            answer: "15"
            solution_sketch: '$\frac{3}{8} \times 24 = 9$ play; $24 - 9 = 15$ do not.'
          - problem: 'Maria has read $\frac{3}{5}$ of a $20$-page booklet. How many pages remain?'
            answer: "8"
        constraints: "two steps; whole-number answers"
      - id: kp3
        name: Division and multi-step problems
        key_prerequisites: [dividing-fractions]
        exemplars:
          - problem: 'How many $\frac{2}{3}$-cup servings can be poured from $4$ cups of juice?'
            answer: "6"
            solution_sketch: '$4 \div \frac{2}{3} = 4 \times \frac{3}{2} = 6$.'
          - problem: 'Each muffin uses $\frac{1}{4}$ cup of sugar. How many muffins can be made with $3$ cups?'
            answer: "12"
        constraints: "division by a fraction; whole-number answers"
    diagnostic_exemplar:
      problem: 'How many $\frac{3}{4}$-litre bottles can be filled from $6$ litres of juice?'
      answer: "8"
      solution_sketch: 'This is a division: $6 \div \frac{3}{4} = 6 \times \frac{4}{3} = 8$.'
    anki_seeds:
      - front: "A word problem asking 'how many pieces of size a/b fit into c' is solved by computing..."
        back: "c divided by a/b (multiply c by the reciprocal)"
        type: basic

  # --------------------------------------------------------------------- #
  # Decimals
  # --------------------------------------------------------------------- #
  - id: decimal-place-value
