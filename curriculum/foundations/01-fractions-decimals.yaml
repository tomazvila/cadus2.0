    knowledge_points:
      - id: kp1
        name: Percent of a number via decimals
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: 'What is $20\%$ of $60$?'
            answer: "12"
            solution_sketch: '$0.20 \times 60 = 12$.'
          - problem: 'What is $15\%$ of $80$?'
            answer: "12"
        constraints: "results are whole numbers"
      - id: kp2
        name: Mental benchmarks
        key_prerequisites: [percent-conversions]
        exemplars:
          - problem: 'What is $10\%$ of $350$?'
            answer: "35"
            solution_sketch: '$10\%$ is one tenth: move the decimal point.'
          - problem: 'What is $25\%$ of $200$?'
            answer: "50"
        constraints: "10%, 25%, 50% of clean numbers, done mentally"
      - id: kp3
        name: Larger and smaller percents
        key_prerequisites: [percent-conversions]
        exemplars:
          - problem: 'What is $150\%$ of $40$?'
            answer: "60"
            solution_sketch: '$1.5 \times 40 = 60$.'
          - problem: 'What is $4\%$ of $250$?'
            answer: "10"
        constraints: "percents from 1% to 200%; whole-number answers"
    diagnostic_exemplar:
      problem: 'What is $120\%$ of $45$?'
      answer: '54'
      solution_sketch: '$1.2 \times 45 = 54$.'
    anki_seeds:
      - front: "To find x% of a number, multiply the number by..."
        back: "x/100 (i.e. the decimal form of the percent)"
        type: basic

  - id: percentages
    name: Percentages
    core: true
    difficulty: 0.3
    drill: false
    # Most answers here are percents ("25%") or comparisons ("25% of 80"), which the
    # SymPy override cannot parse or adjudicate; multi-step hands grading to the tutor.
    answer_kind: multi-step
    expected_time_secs: 70
    prerequisites:
      - id: percent-conversions
        weight: 0.8
        key: true
      - id: percent-of-a-number
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: Finding what percent one number is of another
        key_prerequisites: [percent-conversions]
        exemplars:
          - problem: '$12$ is what percent of $48$?'
            answer: "25%"
            solution_sketch: '$\frac{12}{48} = 0.25 = 25\%$.'
          - problem: '$18$ is what percent of $24$?'
            answer: "75%"
        constraints: "part/whole gives a benchmark percent"
      - id: kp2
        name: One-step percents in context
        key_prerequisites: [percent-of-a-number]
        exemplars:
          - problem: 'A €40 item is $10\%$ off. How many euros is the discount?'
            answer: "4"
            solution_sketch: '$0.10 \times 40 = 4$.'
          - problem: 'You answered $45$ of $50$ questions correctly. What percent is that?'
            answer: "90%"
        constraints: "single-step; whole-number answers"
      - id: kp3
        name: Choosing the right computation
        key_prerequisites: [percent-of-a-number]
        exemplars:
          - problem: 'Which is larger: $25\%$ of $80$ or $30\%$ of $60$?'
            answer: "25% of 80"
            solution_sketch: '$0.25 \times 80 = 20$ versus $0.30 \times 60 = 18$.'
          - problem: 'To pass a $30$-question quiz you need $80\%$ correct. How many questions is that?'
            answer: "24"
        constraints: "mix of find-the-part and find-the-percent forms"
    diagnostic_exemplar:
      problem: 'To pass a $40$-question test you need $85\%$ correct. How many questions must you answer correctly?'
      answer: "34"
      solution_sketch: '$0.85 \times 40 = 34$.'
    anki_seeds:
      - front: "To find what percent a part is of a whole, compute..."
        back: "part / whole, then multiply by 100"
        type: basic

  - id: percent-finding-the-whole
    name: Finding the Whole from a Percent
    core: false                # feeds only percent-applications; percentages stays core
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 80
    prerequisites:
      - id: percentages
        weight: 0.9
        key: true
      - id: decimal-operations
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Find the whole given the part and percent
        key_prerequisites: [percentages]
        exemplars:
          - problem: '$15$ is $30\%$ of what number?'
            answer: "50"
            solution_sketch: '$15 \div 0.30 = 50$.'
          - problem: '$24$ is $40\%$ of what number?'
            answer: "60"
        constraints: "benchmark percents; whole-number answers"
      - id: kp2
        name: Harder percents
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: '$36$ is $45\%$ of what number?'
            answer: "80"
            solution_sketch: '$36 \div 0.45 = 80$.'
          - problem: '$8$ is $5\%$ of what number?'
            answer: "160"
        constraints: "percents that are not simple benchmarks"
      - id: kp3
        name: Finding the whole in context
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'A deposit of €30 is $20\%$ of the price of a bike. What is the price?'
            answer: "150"
            solution_sketch: '$30 \div 0.20 = 150$.'
          - problem: '$12$ students are absent today, which is $15\%$ of the class. How many students are in the class?'
            answer: "80"
        constraints: "one unknown whole; whole-number answers"
    diagnostic_exemplar:
      problem: 'A deposit of €27 is $15\%$ of the price of a laptop. What is the price in euros?'
      answer: "180"
      solution_sketch: '$0.15p = 27$, so $p = \frac{27}{0.15} = 180$.'
    anki_seeds:
      - front: "If a part and its percent are known, the whole equals..."
        back: "part divided by the percent written as a decimal"
        type: basic

  # --------------------------------------------------------------------- #
  # Ratios, rates, and proportions
  # --------------------------------------------------------------------- #
  - id: understanding-ratios
    name: Understanding Ratios
    core: true
    difficulty: 0.28
    drill: false
    # Ratio answers ("2:3") are not SymPy expressions; the tutor grades them.
    answer_kind: multi-step
    expected_time_secs: 60
    prerequisites:
      - id: equivalent-fractions
        weight: 0.8
        key: true
      - id: division-facts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Writing ratios
        key_prerequisites: [equivalent-fractions]
        exemplars:
          - problem: 'There are $6$ apples and $9$ oranges. Write the ratio of apples to oranges in simplest form.'
            answer: "2:3"
          - problem: 'A bag has $3$ red and $5$ blue marbles. Write the ratio of red marbles to ALL marbles.'
            answer: "3:8"
        constraints: "part:part and part:whole forms; parts up to 20"
      - id: kp2
        name: Simplifying ratios
        key_prerequisites: [division-facts]
        exemplars:
          - problem: 'Simplify the ratio $8:12$.'
            answer: "2:3"
            solution_sketch: 'Divide both parts by GCF $4$.'
          - problem: 'Simplify the ratio $15:25$.'
            answer: "3:5"
          - problem: 'Simplify the ratio $12:30$.'
            answer: "2:5"
        constraints: "parts up to 40"
      - id: kp3
        name: Equivalent ratios
        key_prerequisites: [equivalent-fractions]
        exemplars:
          - problem: 'Fill in: $2:3 = 8:\square$.'
            answer: "12"
            solution_sketch: 'Both parts were multiplied by $4$.'
          - problem: 'Are $4:6$ and $10:15$ equivalent? (yes/no)'
            answer: "yes"
            solution_sketch: 'Both simplify to $2:3$.'
        constraints: "scale factors 2-5"
    diagnostic_exemplar:
      problem: 'In a class of $30$ pupils there are $12$ boys. Write the ratio of boys to girls in simplest form.'
      answer: '2:3'
      solution_sketch: 'There are $30 - 12 = 18$ girls, and $12:18$ simplifies to $2:3$.'
    anki_seeds:
      - front: "A part-to-part ratio compares two groups; a part-to-whole ratio compares one group to..."
        back: "the total of all groups"
        type: basic

  - id: ratio-tables-equivalent-ratios
    name: Ratio Tables
    core: false                # scaffold representation leaf; ratios-proportions stays core
    difficulty: 0.3
    drill: false
    answer_kind: multi-step
    expected_time_secs: 70
    prerequisites:
      - id: understanding-ratios
        weight: 0.9
        key: true
      - id: multiplication-tables
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Completing a ratio table
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'A recipe uses $2$ eggs for every $3$ cups of flour. How many cups of flour go with $4$ eggs?'
            answer: "6"
            solution_sketch: 'Double both parts of $2:3$ to get $4:6$.'
          - problem: 'A table shows the ratio $3:12$. What number pairs with $5$ in the same table?'
            answer: "20"
            solution_sketch: '$3:12$ is $1:4$, so $5$ pairs with $20$.'
        constraints: "whole-number scale factors"
      - id: kp2
        name: Scaling ratios up and down
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'Punch mixes $3$ parts juice with $2$ parts soda. With $9$ cups of juice, how many cups of soda?'
            answer: "6"
          - problem: 'A map uses $1$ cm for every $4$ km. How many km does $7$ cm represent?'
            answer: "28"
        constraints: "scale factors 2-8; whole-number answers"
      - id: kp3
        name: Comparing ratios
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'Class A has $12$ girls and $18$ boys; Class B has $10$ girls and $15$ boys. Do the classes have the same girl-to-boy ratio? (yes/no)'
            answer: "yes"
            solution_sketch: 'Both simplify to $2:3$.'
          - problem: 'Which mix is stronger: $2$ scoops of cocoa per $3$ cups of milk, or $3$ scoops per $5$ cups?'
            answer: "2 scoops per 3 cups"
            solution_sketch: 'Compare $\frac{2}{3} = \frac{10}{15}$ with $\frac{3}{5} = \frac{9}{15}$.'
        constraints: "compare after rewriting with a common part"
    diagnostic_exemplar:
      problem: 'Which mix is stronger: $3$ scoops of cocoa per $4$ cups of milk, or $4$ scoops per $6$ cups?'
      answer: '3 scoops per 4 cups'
      solution_sketch: '$\frac{3}{4} = 0.75$ against $\frac{4}{6} \approx 0.67$.'
    anki_seeds:
      - front: "Two ratios are equivalent when both parts of one are obtained from the other by..."
        back: "multiplying (or dividing) by the same number"
        type: basic

  - id: unit-rates
    name: Unit Rates
    core: true
    difficulty: 0.32
    drill: false
    answer_kind: multi-step
    expected_time_secs: 75
    prerequisites:
      - id: understanding-ratios
        weight: 0.8
        key: true
      - id: decimal-operations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Computing a unit rate
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'A car travels $240$ km in $4$ hours. What is its speed in km per hour?'
            answer: "60"
          - problem: 'A car travels $180$ km on $12$ litres of fuel. How many km per litre?'
            answer: "15"
          - problem: 'A printer prints $180$ pages in $4$ minutes. How many pages per minute?'
            answer: "45"
        constraints: "divide to a whole-number rate"
      - id: kp2
        name: Unit prices and better buys
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: 'A $300$ g jar costs €3.60 and a $400$ g jar costs €4.00. Which is the better buy (lower cost per $100$ g)?'
            answer: "the 400 g jar"
            solution_sketch: '$3.60 \div 3 = 1.20$ per $100$ g versus $4.00 \div 4 = 1.00$ per $100$ g.'
          - problem: 'Six eggs cost €2.40. What is the cost per egg in cents?'
            answer: "40"
        constraints: "money per unit; 2-decimal answers or cents"
      - id: kp3
        name: Using a rate to scale up
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'At $55$ km per hour, how far do you travel in $3$ hours?'
            answer: "165"
          - problem: 'Ria types $38$ words per minute. How many words in $5$ minutes?'
            answer: "190"
        constraints: "rate times whole-number quantity"
    diagnostic_exemplar:
      problem: 'A $500$ g pack of muesli costs €4.00 and a $750$ g pack costs €5.25. Which is the better buy (lower cost per $100$ g)?'
      answer: "the 750 g pack"
      solution_sketch: 'Cost per $100$ g: $\frac{4.00}{5} = 0.80$ against $\frac{5.25}{7.5} = 0.70$.'
    anki_seeds:
      - front: "A unit rate is a ratio whose second quantity is..."
        back: "1 (e.g. km per 1 hour, euros per 1 item)"
        type: basic

  - id: ratios-proportions
    name: Ratios and Proportions
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: understanding-ratios
        weight: 0.8
        key: true
      - id: unit-rates
        weight: 0.6
        key: true
      - id: multiplying-fractions
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Solving a proportion
        key_prerequisites: [multiplying-fractions]
        exemplars:
          - problem: 'Solve for $x$: $\frac{3}{4} = \frac{x}{12}$.'
            answer: "9"
            solution_sketch: 'Cross-multiply: $4x = 36$, so $x = 9$.'
          - problem: 'Solve for $x$: $\frac{2}{5} = \frac{6}{x}$.'
            answer: "15"
        constraints: "one unknown; whole-number solution"
      - id: kp2
        name: Proportion word problems
        key_prerequisites: [unit-rates]
        exemplars:
          - problem: 'If $3$ pens cost €6, how much do $5$ pens cost?'
            answer: "10"
            solution_sketch: 'Unit rate €2 per pen; $5 \times 2 = 10$.'
          - problem: 'A recipe for $4$ people uses $3$ cups of rice. How many cups for $12$ people?'
            answer: "9"
        constraints: "whole-number rates and answers"
      - id: kp3
        name: Scale and indirect measurement
        key_prerequisites: [understanding-ratios]
        exemplars:
          - problem: 'A model car is built at a $1:24$ scale. The model is $7$ cm long. How long is the real car in cm?'
            answer: "168"
          - problem: 'A $1.6$ m person casts a $2.4$ m shadow while a tree casts a $24$ m shadow. How tall is the tree in metres?'
            answer: "16"
            solution_sketch: '$\frac{1.6}{2.4} = \frac{h}{24}$, so $h = 24 \times \frac{1.6}{2.4} = 16$.'
        constraints: "same-units proportions; whole-number answers"
    diagnostic_exemplar:
      problem: 'A model boat is built at a $1:36$ scale. The model is $9$ cm long. How long is the real boat in cm?'
      answer: "324"
      solution_sketch: 'The real boat is $36$ times the model: $9 \times 36 = 324$.'
    anki_seeds:
      - front: "In a proportion a/b = c/d, cross-multiplication gives the equation..."
        back: "a x d = b x c"
        type: basic

  - id: percent-applications
    name: Percent Applications
    core: false                # enrichment / applications leaf topic
    difficulty: 0.4
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: percentages
        weight: 0.7
        key: true
      - id: percent-finding-the-whole
        weight: 0.6
        key: true
      - id: decimal-operations
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Percent increase and decrease
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'A shirt costs €50 and is marked up $20\%$. What is the new price in euros?'
            answer: "60"
            solution_sketch: '$50 \times 1.20 = 60$.'
          - problem: 'An €80 jacket is $25\%$ off. What is the sale price in euros?'
            answer: "60"
            solution_sketch: '$80 \times 0.75 = 60$.'
        constraints: "single percent change; whole-euro answers"
      - id: kp2
        name: Reversing a percent change
        key_prerequisites: [percent-finding-the-whole]
        exemplars:
          - problem: 'After a $30\%$ discount, a coat sells for €42. What was the original price in euros?'
            answer: "60"
            solution_sketch: '$42$ is $70\%$ of the original: $42 \div 0.70 = 60$.'
          - problem: 'A price rose $10\%$ to €88. What was the price before the increase?'
            answer: "80"
            solution_sketch: '$88 \div 1.10 = 80$.'
        constraints: "divide by (1 +/- p/100); whole-euro answers"
      - id: kp3
        name: Multi-step percent problems
        key_prerequisites: [percentages]
        exemplars:
          - problem: 'A €40 meal has an $8\%$ service charge and a $15\%$ tip, each computed on the €40. What is the total in euros?'
            answer: "49.20"
            solution_sketch: 'Tax $3.20$ + tip $6.00 + 40 = 49.20$.'
          - problem: 'A population of $200$ grows $10\%$, then grows $10\%$ again. What is the final population?'
            answer: "242"
            solution_sketch: '$200 \times 1.1 = 220$, then $220 \times 1.1 = 242$.'
        constraints: "two-step; answers to the cent or whole number"
    diagnostic_exemplar:
      problem: 'After a $20\%$ discount, a rucksack sells for €48. What was the original price in euros?'
      answer: "60"
      solution_sketch: 'The sale price is $80\%$ of the original, so $p = \frac{48}{0.8} = 60$.'
    anki_seeds:
      - front: "The new amount after a p% increase equals the original times..."
        back: "(1 + p/100)"
        type: basic
      - front: "The new amount after a p% decrease equals the original times..."
        back: "(1 - p/100)"
        type: basic

  - id: simple-interest
    name: Simple Interest
    # over-coverage: I = Prt is a percent application, same class as the already
    # supplemental percent-applications; not a university prerequisite
    core: false
    difficulty: 0.45
    drill: false
    answer_kind: numeric
    expected_time_secs: 100
    prerequisites:
      - id: percent-of-a-number
        weight: 0.9
        key: true
      - id: decimal-operations
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Interest for one year
        key_prerequisites: [percent-of-a-number]
        exemplars:
          - problem: '€500 is deposited at $4\%$ simple interest per year. How much interest is earned in one year?'
            answer: "20"
            solution_sketch: '$500 \times 0.04 = 20$.'
          - problem: '€1 200 is borrowed at $3\%$ simple interest per year. How much interest accrues in one year?'
            answer: "36"
        constraints: "one year; whole-euro answers"
      - id: kp2
        name: The formula I = Prt
        key_prerequisites: [percent-of-a-number]
        exemplars:
          - problem: '€800 earns $5\%$ simple interest per year for $3$ years. How much interest in total?'
            answer: "120"
            solution_sketch: '$I = 800 \times 0.05 \times 3 = 120$.'
          - problem: '€2 000 earns $2.5\%$ simple interest per year for $4$ years. How much interest in total?'
            answer: "200"
        constraints: "whole-number years; whole-euro answers"
      - id: kp3
        name: Totals and finding the rate
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: '€600 is deposited at $5\%$ simple interest per year. What is the account balance after $2$ years?'
            answer: "660"
            solution_sketch: 'Interest $600 \times 0.05 \times 2 = 60$; balance $600 + 60 = 660$.'
          - problem: 'A €400 deposit earned €60 of simple interest over $3$ years. The annual rate is $r\%$. Find $r$.'
            answer: "5"
            solution_sketch: '$r = \frac{60}{400 \times 3} = 0.05 = 5\%$.'
        constraints: "balance = principal + interest; clean rates"
    diagnostic_exemplar:
      problem: '€500 is deposited at $4\%$ simple interest per year. What is the account balance after $3$ years?'
      answer: "560"
      solution_sketch: '$I = Prt = 500 \times 0.04 \times 3 = 60$; the balance is $500 + 60$.'
    anki_seeds:
      - front: "Simple interest formula: I equals..."
        back: "P x r x t (principal x annual rate as a decimal x years)"
        type: basic
      - front: "With simple interest, the final balance equals..."
        back: "principal + interest, i.e. P(1 + rt)"
        type: basic
