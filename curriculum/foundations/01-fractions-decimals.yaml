      - id: decimal-multiplication-powers-of-ten
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Percent and decimal
        key_prerequisites: [decimal-multiplication-powers-of-ten]
        exemplars:
          - problem: 'Write $45\%$ as a decimal.'
            answer: "0.45"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Move the decimal point two places left: $45\% = 0.45$.'
          - problem: 'Write $0.07$ as a percent. Give just the number.'
            answer: "7"
            solution_sketch: 'Move the decimal point two places right: $0.07 = 7\%$.'
          - problem: 'An eight-cell region is shaded on a hundred-cell grid, representing $8\%$. What decimal part is shaded?'
            answer: "0.08"
            solution_sketch: 'Eight hundredths are $8/100=0.08$.'
          - problem: 'A decimal number-line point is at $0.6$. Relabel the unit interval from $0\%$ to $100\%$. Give the percent number at that point.'
            answer: "60"
            solution_sketch: 'Six tenths equal sixty hundredths: $0.6\times100=60$ percent.'
        constraints: "whole-number percents"
      - id: kp2
        name: Percent and fraction
        key_prerequisites: [fraction-decimal-conversion]
        exemplars:
          - problem: 'Write $25\%$ as a fraction in lowest terms.'
            answer: "1/4"
            answer_contract: {"kind":"required_form","form":"reduced_fraction"}
            solution_sketch: '$25\% = \frac{25}{100} = \frac{1}{4}$.'
          - problem: 'Write $\frac{3}{4}$ as a percent. Give just the number.'
            answer: "75"
            solution_sketch: '$\frac{3}{4} = 0.75 = 75\%$.'
          - problem: 'A hundred-cell grid is $60\%$ shaded. Group the cells in twenties. Give the shaded fraction in lowest terms.'
            answer: "3/5"
            solution_sketch: '$60/100=(60\div20)/(100\div20)=3/5$.'
          - problem: 'A fuel gauge reads $40\%$ full. Give the filled fraction of the tank in lowest terms.'
            answer: "2/5"
            solution_sketch: '$40\%=40/100$; cancel $20$ to obtain $2/5$.'
        constraints: "percents that simplify to small fractions"
      - id: kp3
        name: Benchmarks and percents beyond 100
        key_prerequisites: [fraction-decimal-conversion]
        exemplars:
          - problem: 'Write $\frac{1}{5}$ as a percent. Give just the number.'
            answer: "20"
            solution_sketch: '$\frac{1}{5} = 0.2 = 20\%$.'
          - problem: 'Write $125\%$ as a decimal.'
            answer: "1.25"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Move the decimal point two places left: $125\% = 1.25$.'
          - problem: 'A strip divided into ten equal parts has three parts covered. Give the percent of the whole strip covered, as a number.'
            answer: "30"
            solution_sketch: 'Each tenth is $10\%$, so three tenths give $3\times10=30$ percent.'
          - problem: 'A diagram shows one full unit and half of another, labelled $150\%$. Write the amount as a decimal number of units.'
            answer: "1.5"
            solution_sketch: '$150\%=100\%+50\%=1+0.5=1.5$ units.'
        constraints: "benchmark fractions (halves, quarters, fifths, tenths); percents up to 200"
    diagnostic_exemplar:
      problem: 'Write $\frac{7}{4}$ as a percent. Give just the number.'
      answer: '175'
      solution_sketch: '$\frac{7}{4} = 1.75$, and $1.75 \times 100 = 175$.'
    anki_seeds:
      - front: "The word 'percent' means..."
        back: "per hundred (out of 100)"
        type: basic
      - front: "To convert a decimal to a percent, multiply by..."
        back: "100 (move the decimal point two places right)"
        type: basic

  - id: percent-of-a-number
    name: Percent of a Number
    core: true
    difficulty: 0.28
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: percent-conversions
        weight: 0.9
        key: true
      - id: decimal-operations
        weight: 0.6
        key: true
    knowledge_points:
      - id: kp1
        name: Percent of a number via decimals
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: 'What is $20\%$ of $60$?'
            answer: "12"
            solution_sketch: '$0.20 \times 60 = 12$.'
          - problem: 'A $80$-litre tank is $15\%$ full. Convert the percent to a decimal and find the litres inside.'
            answer: "12"
            solution_sketch: '$15\%=0.15$; $80\times0.15=12$ litres.'
          - problem: 'A hundred-part bar represents $40$ units. Find the amount represented by $35$ parts using a decimal multiplier.'
            answer: "14"
            solution_sketch: 'The selected share is $35/100=0.35$; $40\times0.35=14$ units.'
          - problem: 'A shop rebates $12\%$ of a €150 purchase. How many euros is the rebate?'
            answer: "18"
            solution_sketch: 'Convert $12\%$ to $0.12$; $150\times0.12=18$ euros.'
        constraints: "results are whole numbers"
      - id: kp2
        name: Mental benchmarks
        key_prerequisites: [percent-conversions]
        exemplars:
          - problem: 'What is $10\%$ of $350$?'
            answer: "35"
            solution_sketch: '$10\%$ is one tenth: move the decimal point.'
          - problem: 'Mentally find the quarter-share of €200 corresponding to $25\%$. Give euros.'
            answer: "50"
            solution_sketch: '$25\%$ is one quarter, so $200\div4=50$ euros.'
          - problem: 'A bar represents $84$ units. One half is shaded. How many units does its $50\%$ shaded region represent?'
            answer: "42"
            solution_sketch: '$50\%$ is one half: $84\div2=42$ units.'
          - problem: 'A €120 bill has a $10\%$ service charge. Use place value to find the charge in euros mentally.'
            answer: "12"
            solution_sketch: 'One tenth of $120$ is $120\div10=12$ euros.'
        constraints: "10%, 25%, 50% of clean numbers, done mentally"
      - id: kp3
        name: Larger and smaller percents
        key_prerequisites: [percent-conversions]
        exemplars:
          - problem: 'What is $150\%$ of $40$?'
            answer: "60"
            solution_sketch: '$1.5 \times 40 = 60$.'
          - problem: 'A sample contains $250$ grains. Four percent are marked. How many grains are marked?'
            answer: "10"
            solution_sketch: 'One percent is $250/100=2.5$ grains; four percent is $4\times2.5=10$ grains.'
          - problem: 'A copier enlarges an $18$ cm line to $200\%$ of its length. How long is the copy in cm?'
            answer: "36"
            solution_sketch: '$200\%$ is twice the original: $2\times18=36$ cm.'
          - problem: 'A €150 balance earns a one-time bonus of $2\%$. Find just the bonus in euros.'
            answer: "3"
            solution_sketch: '$2\%=0.02$, so the bonus is $150\times0.02=3$ euros.'
        constraints: "percents from 1% to 200%; whole-number answers"
    diagnostic_exemplar:
      problem: 'What is $120\%$ of $45$?'
      answer: '54'
      solution_sketch: '$1.2 \times 45 = 54$.'
    anki_seeds:
      - front: "To find x% of a number, multiply the number by..."
        back: "x/100 (i.e. the decimal form of the percent)"
        type: basic

  - id: percentages
    name: Percentages
    core: true
    difficulty: 0.3
    drill: false
    # Most answers here are percents ("25%") or comparisons ("25% of 80"), which the
    # SymPy override cannot parse or adjudicate; multi-step hands grading to the tutor.
    answer_kind: multi-step
    expected_time_secs: 70
    prerequisites:
      - id: percent-conversions
        weight: 0.8
        key: true
      - id: percent-of-a-number
        weight: 0.9
        key: true
    knowledge_points:
