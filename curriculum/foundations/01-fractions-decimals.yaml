            solution_sketch: '$\frac{9}{2} \div \frac{3}{4} = \frac{9}{2} \times \frac{4}{3} = 6$.'
          - problem: 'A ribbon $5\frac{1}{4}$ m long is cut into $\frac{3}{4}$ m pieces. How many pieces?'
            answer: "7"
        constraints: "whole-number answers in context"
    diagnostic_exemplar:
      problem: 'A ribbon $5\frac{1}{4}$ m long is cut into $1\frac{3}{4}$ m pieces. How many pieces?'
      answer: '3'
      solution_sketch: '$\frac{21}{4} \div \frac{7}{4} = \frac{21}{4} \times \frac{4}{7} = 3$.'
    anki_seeds:
      - front: "Before dividing mixed numbers, always convert them to..."
        back: "improper fractions, then multiply by the reciprocal"
        type: basic

  - id: fraction-word-problems
