unit: arithmetic-core
course: foundations
module: "Arithmetic"
topics:
  # --------------------------------------------------------------------- #
  # Mastery-floor roots (kept minimal at 2 KPs each; no prerequisites).
  # --------------------------------------------------------------------- #
  - id: single-digit-addition
    name: Single-Digit Addition
    core: true
    difficulty: 0.05
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites: []          # mastery-floor root
    knowledge_points:
      - id: kp1
        name: Sums within ten
        exemplars:
          - problem: 'Compute $3 + 4$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Join a group of $3$ and a group of $4$ and count all the objects. There are $7$ in all, so $3 + 4 = 7$.'
          - problem: 'A box has $6$ red pens and $2$ blue pens. How many pens are in the box?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The red pens and the blue pens are put together, so we add them. $6 + 2 = 8$ pens.'
          - problem: 'What number goes in the box? $5 + 4 = \square$'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count on $4$ from $5$: $6, 7, 8, 9$. So the box holds $9$, and $5 + 4 = 9$.'
          - problem: 'Evaluate $2 + 8$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numbers $8$ and $2$ make a ten. So $2 + 8 = 10$.'
          - problem: 'Sam scores $2$ points in the first game and $4$ points in the second game. How many points does he score in all?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The points from both games are put together, so we add. $2 + 4 = 6$ points in all.'
          - problem: 'Ella needs $9$ eggs for a cake and has $5$. How many more eggs does she need?'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We look for the number that makes $5$ up to $9$. Counting on from $5$ gives $6, 7, 8, 9$, which is $4$ steps, so she needs $4$ more eggs.'
          - problem: 'Noah writes $7 + 2 = 8$. What is the correct sum?'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count on $2$ from $7$: $8, 9$. So $7 + 2 = 9$, and Noah is one short.'
        constraints: "both addends 0-9, sum <= 10; also word problems and a missing addend"
      - id: kp2
        name: Sums within twenty (bridging ten)
        try_first:
          problem: 'What is $9 + 6$?'
          answer_contract: {"kind":"exact"}
          answer: '15'
          reveal: 'Most people fill the ten first: $9 + 1 = 10$, then $10 + 5 = 15$. Splitting one number to make a ten turns every sum in the teens into an easy one.'
        exemplars:
          - problem: 'Compute $8 + 7$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Make ten: $8 + 2 = 10$, using $2$ of the $7$. The other $5$ is left, so $10 + 5 = 15$.'
          - problem: 'Liam has $9$ toy cars and is given $5$ more. How many cars does he have now?'
            answer: "14"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cars are put together, so we add. Make ten: $9 + 1 = 10$, then $10 + 4 = 14$ cars.'
          - problem: 'What number goes in the box? $7 + 5 = \square$'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Make ten: $7 + 3 = 10$, using $3$ of the $5$. The other $2$ is left, so $10 + 2 = 12$.'
          - problem: 'Evaluate $9 + 9$.'
            answer: "18"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Make ten: $9 + 1 = 10$, using $1$ of the second $9$. The other $8$ is left, so $10 + 8 = 18$.'
          - problem: 'A cafe sells $9$ coffees before noon and $7$ after noon. How many coffees does it sell in the day?'
            answer: "16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The two parts of the day are put together, so we add. Make ten: $9 + 1 = 10$, then $10 + 6 = 16$ coffees.'
          - problem: 'Hana needs $15$ stamps and has $8$. How many more stamps does she need?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We look for the number that makes $8$ up to $15$. From $8$ to $10$ is $2$, and from $10$ to $15$ is $5$, so she needs $2 + 5 = 7$ stamps.'
          - problem: 'Omar adds $6 + 7$ and gets $12$. What is the correct sum?'
            answer: "13"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Make ten: $6 + 4 = 10$, using $4$ of the $7$. The other $3$ is left, so $10 + 3 = 13$.'
        constraints: "both addends 0-9, sum 11-18; also word problems and a missing addend"
    diagnostic_exemplar:
      problem: 'Compute $8 + 5$.'
      answer: "13"
      solution_sketch: 'Make ten: $8 + 2 = 10$, with $3$ of the $5$ left over, so $10 + 3 = 13$.'
    anki_seeds:
      - front: "Make-ten strategy: to add 8 + 5, first take 2 from the 5 to make 8 into..."
        back: "10, leaving 3 more: 10 + 3 = 13"
        type: basic

  - id: subtraction-facts
    name: Subtraction Facts
    core: true
    difficulty: 0.07
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites:
      - id: single-digit-addition
        weight: 1.0
        key: true
    knowledge_points:
      - id: kp1
        name: Differences within ten
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'Compute $9 - 4$.'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count back $4$ from $9$: $8, 7, 6, 5$. So $9 - 4 = 5$.'
          - problem: 'A basket holds $7$ apples. Three apples are eaten. How many apples are left?'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Eating apples takes them away, so we subtract. Counting back $3$ from $7$ gives $6, 5, 4$, so $4$ apples are left.'
          - problem: 'What number goes in the box? $10 - 7 = \square$'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Think of the number that adds to $7$ to make $10$. That number is $3$, so $10 - 7 = 3$.'
          - problem: 'Evaluate $8 - 8$.'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Taking all $8$ away leaves nothing. So $8 - 8 = 0$.'
          - problem: 'A ribbon is $9$ metres long. Rosa cuts off $2$ metres. How long is the piece that is left?'
            answer: "7"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Cutting off a piece takes it away, so we subtract. $9 - 2 = 7$, so the piece is $7$ metres long.'
          - problem: 'Kai has $2$ marbles and his friend has $8$. How many more marbles does his friend have?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'To compare, we find the difference. Count up from $2$ to $8$: that is $6$ steps, so $8 - 2 = 6$ more marbles.'
          - problem: 'Ben says $5 - 3 = 8$. What is the correct difference?'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Counting back $3$ from $5$ gives $4, 3, 2$. So $5 - 3 = 2$, and Ben added instead of subtracting.'
        constraints: "minuend 0-10, nonnegative difference; also take-away and comparison problems"
      - id: kp2
        name: Differences from the teens (bridging ten)
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'Compute $15 - 8$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Go back through ten: $15 - 5 = 10$, using $5$ of the $8$. The other $3$ is left to take away, so $10 - 3 = 7$.'
          - problem: 'A parking lot has $14$ cars. Six cars drive away. How many cars are left?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Cars driving away are taken away, so we subtract. Go back through ten: $14 - 4 = 10$, then $10 - 2 = 8$ cars.'
          - problem: 'What number goes in the box? $12 - 9 = \square$'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Go back through ten: $12 - 2 = 10$, using $2$ of the $9$. The other $7$ is left, so $10 - 7 = 3$.'
          - problem: 'Evaluate $18 - 9$.'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Go back through ten: $18 - 8 = 10$, using $8$ of the $9$. The other $1$ is left, so $10 - 1 = 9$.'
          - problem: 'A tray held $13$ muffins. By noon only $5$ were left. How many muffins were sold?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sold muffins are the ones that went from the tray, so we subtract. $13 - 3 = 10$, then $10 - 2 = 8$ muffins.'
          - problem: 'Zoe has $14$ stickers and Yuri has $9$. How many more stickers does Zoe have?'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'To compare, we find the difference $14 - 9$. Go back through ten: $14 - 4 = 10$, then $10 - 5 = 5$ more stickers.'
          - problem: 'Lena works out $15 - 7$ and gets $9$. What is the correct difference?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Go back through ten: $15 - 5 = 10$, then $10 - 2 = 8$. So Lena is one too high.'
        constraints: "minuend 11-18, subtrahend 2-9; also take-away and comparison problems"
    diagnostic_exemplar:
      problem: 'Compute $13 - 7$.'
      answer: "6"
      solution_sketch: 'Bridge ten: $13 - 3 = 10$, then $10 - 4 = 6$.'
    anki_seeds:
      - front: "Every addition fact gives two subtraction facts: from 8 + 5 = 13 we get..."
        back: "13 - 5 = 8 and 13 - 8 = 5"
        type: basic

  - id: multiplication-tables
    name: Multiplication Tables
    core: true
    difficulty: 0.1
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites: []          # mastery-floor root
    knowledge_points:
      - id: kp1
        name: Facts through 10 x 10
        exemplars:
          - problem: 'Compute $6 \times 7$.'
            answer: "42"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the $7$ into $5$ and $2$. Then $6 \times 5 = 30$ and $6 \times 2 = 12$, so $6 \times 7 = 30 + 12 = 42$.'
          - problem: 'A classroom has $8$ rows of $4$ desks. How many desks are there?'
            answer: "32"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Equal rows call for multiplication. $8 \times 4 = 8 \times 2 \times 2 = 16 \times 2 = 32$ desks.'
          - problem: 'What number goes in the box? $9 \times 6 = \square$'
            answer: "54"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Nine sixes are ten sixes less one six. So $9 \times 6 = 60 - 6 = 54$.'
          - problem: 'Evaluate $10 \times 10$.'
            answer: "100"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ten tens make one hundred. So $10 \times 10 = 100$.'
          - problem: 'Tickets for a show cost $7$ dollars each. How many dollars do $8$ tickets cost?'
            answer: "56"
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Equal prices call for multiplication. $7 \times 8 = 7 \times 5 + 7 \times 3 = 35 + 21 = 56$ dollars.'
          - problem: 'A bakery packs $48$ rolls into bags of $6$. How many bags does it fill?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We ask how many groups of $6$ fit in $48$, so we divide. Since $6 \times 8 = 48$, the bakery fills $8$ bags.'
          - problem: 'Priya says $6 \times 8 = 42$. What is the correct product?'
            answer: "48"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the $8$ into $5$ and $3$. Then $6 \times 5 = 30$ and $6 \times 3 = 18$, so $6 \times 8 = 48$.'
        constraints: "both factors 0-10; also equal-groups word problems and one division context"
      - id: kp2
        name: Facts with 11 and 12
        exemplars:
          - problem: 'Compute $12 \times 7$.'
            answer: "84"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the $12$ into $10$ and $2$. Then $10 \times 7 = 70$ and $2 \times 7 = 14$, so $12 \times 7 = 70 + 14 = 84$.'
          - problem: 'A theater has $11$ rows with $8$ seats in each row. How many seats does it have?'
            answer: "88"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Equal rows call for multiplication. $10 \times 8 = 80$ and $1 \times 8 = 8$, so there are $80 + 8 = 88$ seats.'
          - problem: 'What number goes in the box? $12 \times 12 = \square$'
            answer: "144"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split one $12$ into $10$ and $2$. Then $10 \times 12 = 120$ and $2 \times 12 = 24$, so the box holds $120 + 24 = 144$.'
          - problem: 'Compute $11 \times 9$.'
            answer: "99"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the $11$ into $10$ and $1$. Then $10 \times 9 = 90$ and $1 \times 9 = 9$, so $11 \times 9 = 99$.'
          - problem: 'Eggs are sold by the dozen. How many eggs are in $9$ dozen?'
            answer: "108"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A dozen is $12$, so we multiply. $10 \times 9 = 90$ and $2 \times 9 = 18$, so there are $90 + 18 = 108$ eggs.'
          - problem: 'A school buys $132$ chairs and sets them out in rows of $12$. How many rows are there?'
            answer: "11"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We ask how many groups of $12$ fit in $132$, so we divide. Since $12 \times 11 = 132$, there are $11$ rows.'
          - problem: 'Pat says $12 \times 6 = 62$. What is the correct product?'
            answer: "72"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the $12$ into $10$ and $2$. Then $10 \times 6 = 60$ and $2 \times 6 = 12$, so $12 \times 6 = 60 + 12 = 72$.'
        constraints: "one factor 11 or 12, the other 2-12; also equal-groups word problems and one division context"
    diagnostic_exemplar:
      problem: 'Compute $12 \times 6$.'
      answer: "72"
      solution_sketch: 'Split the $12$: $10 \times 6 + 2 \times 6 = 60 + 12 = 72$.'
    anki_seeds:
      - front: "Nines trick: for 9 x n, the two digits of the answer always sum to..."
        back: "9 (e.g. 9 x 6 = 54, and 5 + 4 = 9)"
        type: basic

  - id: division-facts
    name: Division Facts
    core: true
    difficulty: 0.12
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites:
      - id: multiplication-tables
        weight: 1.0
        key: true
    knowledge_points:
      - id: kp1
        name: Quotients from the tables
        key_prerequisites: [multiplication-tables]
        try_first:
          problem: 'A pack of $40$ pencils is shared equally among $5$ children. How many pencils does each child get?'
          answer_contract: {"kind":"exact"}
          answer: '8'
          reveal: 'Sharing $40$ into $5$ equal parts asks which number times $5$ gives $40$. Since $5 \times 8 = 40$, each child gets $8$: division is multiplication read backwards.'
        exemplars:
          - problem: 'Compute $42 \div 6$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ask which number times $6$ gives $42$. Since $6 \times 7 = 42$, we have $42 \div 6 = 7$.'
          - problem: 'A baker shares $54$ cookies equally among $9$ friends. How many cookies does each friend get?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sharing equally calls for division. Since $9 \times 6 = 54$, each friend gets $6$ cookies.'
          - problem: 'What number goes in the box? $32 \div 8 = \square$'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ask which number times $8$ gives $32$. Since $8 \times 4 = 32$, the box holds $4$.'
          - problem: 'Evaluate $100 \div 10$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ask which number times $10$ gives $100$. Since $10 \times 10 = 100$, the quotient is $10$.'
          - problem: 'Each of $7$ bags holds $8$ apples. How many apples are there altogether?'
            answer: "56"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Equal bags call for multiplication, not division. $7 \times 8 = 56$ apples.'
          - problem: 'A coach has $45$ players and puts $5$ players in each team. How many teams are there?'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We ask how many groups of $5$ fit in $45$, so we divide. Since $5 \times 9 = 45$, there are $9$ teams.'
          - problem: 'Rita says $28 \div 4 = 24$. What is the correct quotient?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ask which number times $4$ gives $28$. Since $4 \times 7 = 28$, the quotient is $7$, and Rita subtracted instead of dividing.'
        constraints: "dividend is a product of two factors 2-10; divides evenly; also sharing, grouping and one multiplication context"
      - id: kp2
        name: Missing-factor form
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'What number goes in the box? $6 \times \square = 48$'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The missing factor is $48 \div 6$. Since $6 \times 8 = 48$, the box holds $8$.'
          - problem: 'Compute $72 \div 8$.'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ask which number times $8$ gives $72$. Since $8 \times 9 = 72$, we have $72 \div 8 = 9$.'
          - problem: 'Find $\square$ so that $\square \times 9 = 54$.'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The missing factor is $54 \div 9$. Since $9 \times 6 = 54$, the box holds $6$.'
          - problem: 'What number goes in the box? $\square \times 5 = 35$'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The missing factor is $35 \div 5$. Since $5 \times 7 = 35$, the box holds $7$.'
          - problem: 'Maya buys pens at $4$ dollars each and pays $36$ dollars. How many pens does she buy?'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The price of one pen times the number of pens is $36$, so we divide. $36 \div 4 = 9$ pens.'
          - problem: 'A rectangle has an area of $54$ square centimeters and a width of $6$ centimeters. How long is the rectangle?'
            answer: "9"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Area is length times width, so the length is the missing factor in $\square \times 6 = 54$. Dividing gives $54 \div 6 = 9$ centimeters.'
          - problem: 'Dev solves $4 \times \square = 28$ and writes $24$ in the box. What is the correct number?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The missing factor is $28 \div 4$. Since $4 \times 7 = 28$, the box holds $7$, and Dev subtracted $4$ instead of dividing.'
        constraints: "facts through 10 x 10, stated as division, as a missing factor, or in a word problem"
    diagnostic_exemplar:
      problem: 'What number goes in the box? $8 \times \square = 56$'
      answer: '7'
      solution_sketch: 'The missing factor is $56 \div 8 = 7$.'
    anki_seeds:
      - front: "The division 42 / 6 asks the multiplication question..."
        back: "6 times what equals 42? (answer: 7)"
        type: basic

  - id: perfect-squares
    name: Perfect Squares
    core: true
    difficulty: 0.15
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites:
      - id: multiplication-tables
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: Squares through twelve squared
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $7^2$.'
            answer: "49"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent $2$ means two factors of $7$. So $7^2 = 7 \times 7 = 49$.'
          - problem: 'A square garden has sides of length $9$ m. What is its area?'
            answer: "81"
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area of a square is its side times its side. So the area is $9 \times 9 = 81$ square metres.'
          - problem: 'Evaluate $12^2$.'
            answer: "144"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The square of $12$ is $12 \times 12$. This product is $144$.'
          - problem: 'A square floor is tiled in $8$ rows of $8$ tiles. How many tiles are there?'
            answer: "64"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each row has $8$ tiles and there are $8$ rows. So the floor has $8 \times 8 = 64$ tiles.'
          - problem: 'A square courtyard has an area of $121$ square metres. How long is one side?'
            answer: "11"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The area is the side times the side, so the side is the number that multiplied by itself gives $121$. Since $11 \times 11 = 121$, the side is $11$ metres.'
          - problem: 'Sam says that $6^2 = 12$. What is the correct value of $6^2$?'
            answer: "36"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam doubled $6$ instead of multiplying $6$ by itself. The correct value is $6 \times 6 = 36$.'
          - problem: 'How many more tiles does a square of $10$ by $10$ tiles need than a square of $9$ by $9$ tiles?'
            answer: "19"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The large square has $10^2 = 100$ tiles and the small square has $9^2 = 81$ tiles. The difference is $100 - 81 = 19$ tiles.'
        constraints: "base 1-12"
      - id: kp2
        name: Recognizing perfect squares
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'What whole number multiplied by itself gives $64$?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Look for the square fact that ends at $64$. Since $8 \times 8 = 64$, the number is $8$.'
          - problem: 'What number squared gives $121$?'
            answer: "11"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The square of $11$ is $11 \times 11 = 121$. So the number is $11$.'
          - problem: 'Exactly one perfect square lies between $45$ and $55$. What is it?'
            answer: "49"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square the whole numbers near the range. We have $6^2 = 36$, which is too small, and $8^2 = 64$, which is too large. So $7^2 = 49$ is the one square between $45$ and $55$.'
          - problem: 'What is the smallest perfect square greater than $90$?'
            answer: "100"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The square $9^2 = 81$ is still below $90$. The next square is $10^2 = 100$, and no square lies between $81$ and $100$.'
          - problem: 'A teacher sets out $49$ chairs in a square, with as many rows as chairs in each row. How many chairs are in each row?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of rows equals the number of chairs in a row, so the number of chairs in a row multiplied by itself is $49$. Since $7 \times 7 = 49$, each row has $7$ chairs.'
          - problem: 'A quilt is made of $144$ square patches laid out in a square. How many patches are in one row?'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The patches fill a square, so the patches in one row multiplied by themselves give $144$. Since $12 \times 12 = 144$, one row has $12$ patches.'
          - problem: 'Which of the numbers $48$, $56$, $63$, $81$ is a perfect square?'
            answer: "81"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compare each number with the square facts. The squares near them are $49$, $64$ and $81$, so $48$, $56$ and $63$ are not squares. Only $81 = 9 \times 9$ is a perfect square.'
          - problem: 'Is $50$ a perfect square?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","50 is a perfect square","it is a perfect square","a perfect square"],["no","no, it is not","it is not","50 is not a perfect square","it is not a perfect square","not a perfect square","no, it isn't","it isn't"]]}
            solution_sketch: 'The squares near $50$ are $7^2 = 49$ and $8^2 = 64$. No whole number multiplied by itself gives $50$, so it is not a perfect square.'
        constraints: "numbers up to 150"
    diagnostic_exemplar:
      problem: 'What whole number squared gives $144$?'
      answer: '12'
      solution_sketch: '$12^2 = 144$.'
    anki_seeds:
      - front: "13 squared ="
