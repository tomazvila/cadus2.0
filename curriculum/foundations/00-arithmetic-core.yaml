  # --------------------------------------------------------------------- #
  # Expressions and order of operations
  # --------------------------------------------------------------------- #
  - id: whole-number-exponents
    name: Whole-Number Exponents
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: expression
    expected_time_secs: 50
    prerequisites:
      - id: multiplication-tables
        weight: 0.8
        key: true
      - id: perfect-squares
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Exponent notation
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Write $3 \times 3 \times 3 \times 3$ using an exponent.'
            answer: "3^4"
            solution_sketch: 'Four factors of $3$ is $3^4$.'
          - problem: 'Write $5^3$ as a repeated multiplication.'
            answer: "5 x 5 x 5"
            solution_sketch: '$5^3$ means $3$ factors of $5$: $5 \times 5 \times 5$.'
          - problem: 'Write $4 \times 4 \times 4$ using an exponent.'
            answer: "4^3"
            solution_sketch: 'Three factors of $4$ is $4^3$.'
          - problem: 'Write $7^2$ as a repeated multiplication.'
            answer: "7 x 7"
            solution_sketch: '$7^2$ means $2$ factors of $7$: $7 \times 7$.'
        constraints: "base 2-10, exponent 2-5"
      - id: kp2
        name: Evaluating powers
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $2^5$.'
            answer: "32"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$2, 4, 8, 16, 32$.'
          - problem: 'Find the value of $3^4$.'
            answer: "81"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$3^4 = 3 \times 3 \times 3 \times 3 = 81$.'
          - problem: '$10^3 = \square$. Find $\square$.'
            answer: "1000"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$10^3 = 10 \times 10 \times 10 = 1000$.'
          - problem: 'Evaluate $6^3$.'
            answer: "216"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$6^3 = 6 \times 6 \times 6 = 216$.'
        constraints: "value at most 1000"
      - id: kp3
        name: Squares, cubes, and comparisons
        key_prerequisites: [perfect-squares]
        exemplars:
          - problem: 'Compute $4^3$.'
            answer: "64"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$4^3 = 4 \times 4 \times 4 = 64$.'
          - problem: 'Which is larger, $2^6$ or $6^2$?'
            answer: "2^6"
            solution_sketch: '$2^6 = 64$ and $6^2 = 36$.'
          - problem: 'Evaluate $1^9$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$1^9 = 1$ since any power of $1$ equals $1$.'
          - problem: 'Between $2^7$ and $7^2$, which is larger?'
            answer: "2^7"
            solution_sketch: '$2^7=128$ and $7^2=49$.'
        constraints: "compare or evaluate; values at most 200"
    diagnostic_exemplar:
      problem: 'Which is larger, $3^4$ or $4^3$?'
      answer: '3^4'
      solution_sketch: '$3^4 = 81$ and $4^3 = 64$.'
    anki_seeds:
      - front: "In the power 5^3, 5 is the base and 3 is the {{c1::exponent}}."
        back: "exponent"
        type: cloze
      - front: "For any number a, a^1 equals..."
        back: "a itself"
        type: basic

  - id: expressions-with-parentheses
    name: Expressions with Parentheses
    core: true
    difficulty: 0.22
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: multi-digit-addition-subtraction
        weight: 0.6
        key: true
      - id: multiplication-tables
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Evaluate inside the parentheses first
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $(3 + 4) \times 5$.'
            answer: "35"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parentheses first: $3 + 4 = 7$; then $7 \times 5 = 35$.'
          - problem: 'Compute $2 \times (9 - 3)$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parentheses first: $9 - 3 = 6$; then $2 \times 6 = 12$.'
          - problem: '$(6 + 2) \times 3 = \square$. Find $\square$.'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parentheses first: $6 + 2 = 8$; then $8 \times 3 = 24$.'
          - problem: 'Evaluate $4 \times (7 - 2)$.'
            answer: "20"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Parentheses first: $7 - 2 = 5$; then $4 \times 5 = 20$.'
        constraints: "one set of parentheses, single-digit operands"
      - id: kp2
        name: Parentheses change the value
        key_prerequisites: [multi-digit-addition-subtraction]
        exemplars:
          - problem: 'Compute $10 - (4 - 2)$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$10 - (4 - 2) = 10 - 2 = 8$.'
          - problem: 'Compute $(10 - 4) - 2$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Grouping matters: $10 - (4 - 2) = 8$ but $(10 - 4) - 2 = 4$.'
          - problem: '$12 - (5 - 3) = \square$. Find $\square$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$12 - (5 - 3) = 12 - 2 = 10$.'
          - problem: 'Evaluate $(12 - 5) - 3$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$(12 - 5) - 3 = 7 - 3 = 4$.'
        constraints: "same numbers grouped differently"
      - id: kp3
        name: Translating words into grouped expressions
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Evaluate: multiply the sum of $7$ and $5$ by $3$.'
            answer: "36"
            solution_sketch: '$(7 + 5) \times 3 = 12 \times 3 = 36$.'
          - problem: 'Evaluate: twice the difference of $9$ and $4$.'
            answer: "10"
            solution_sketch: '$2 \times (9 - 4) = 2 \times 5 = 10$.'
          - problem: 'Evaluate: multiply the difference of $12$ and $5$ by $4$.'
            answer: "28"
            solution_sketch: '$(12 - 5) \times 4 = 28$.'
          - problem: 'Evaluate: half the sum of $8$ and $6$.'
            answer: "7"
            solution_sketch: '$(8 + 6) \div 2 = 7$.'
        constraints: "verbal description of one grouped operation"
    diagnostic_exemplar:
      problem: 'Evaluate: multiply the sum of $4$ and $5$ by $3$.'
      answer: "27"
      solution_sketch: 'The sum inside comes first: $(4 + 5) \times 3 = 9 \times 3 = 27$.'
    anki_seeds:
      - front: "In any numerical expression, the part evaluated first is..."
        back: "whatever is inside parentheses (innermost first)"
        type: basic

  - id: order-of-operations
    name: Order of Operations
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: expressions-with-parentheses
        weight: 0.8
        key: true
      - id: whole-number-exponents
        weight: 0.7
        key: true
      - id: division-facts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Multiply and divide before add and subtract
        key_prerequisites: [division-facts]
        exemplars:
          - problem: 'Compute $3 + 4 \times 5$.'
            answer: "23"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply first: $4 \times 5 = 20$, then $3 + 20 = 23$.'
          - problem: 'Compute $9-8\div4$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide first: $8\div4=2$, then $9-2=7$.'
          - problem: 'Evaluate $6 + 3 \times 7$.'
            answer: "27"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply first: $3 \times 7 = 21$, then $6 + 21 = 27$.'
          - problem: 'Compute $9 - 2 \times 3$.'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply first: $2 \times 3 = 6$, then $9 - 6 = 3$.'
        constraints: "single-digit operands, no parentheses"
      - id: kp2
        name: Exponents in the order of operations
        key_prerequisites: [whole-number-exponents]
        exemplars:
          - problem: 'Compute $2 + 3^2 \times 4$.'
            answer: "38"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$3^2 = 9$; $9 \times 4 = 36$; $2 + 36 = 38$.'
          - problem: 'Compute $5 \times 2^3 - 7$.'
            answer: "33"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$2^3 = 8$; $5 \times 8 = 40$; $40 - 7 = 33$.'
          - problem: 'Compute $4^2 + 3 \times 5$.'
            answer: "31"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$4^2 = 16$; $3 \times 5 = 15$; $16 + 15 = 31$.'
          - problem: 'Evaluate $6 \times 3^2 - 10$.'
            answer: "44"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$3^2 = 9$; $6 \times 9 = 54$; $54 - 10 = 44$.'
        constraints: "one exponent, small bases"
      - id: kp3
        name: Full expressions with grouping
        key_prerequisites: [expressions-with-parentheses]
        exemplars:
          - problem: 'Compute $48 \div 6 + 2 \times 5$.'
            answer: "18"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$48 \div 6 = 8$ and $2 \times 5 = 10$, then $8 + 10 = 18$.'
          - problem: 'Compute $(5 + 3) \times 2 - 4^2$.'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$8 \times 2 = 16$; $4^2 = 16$; $16 - 16 = 0$.'
          - problem: 'Compute $36 \div (9 - 3)^2$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$(9 - 3)^2 = 36$; $36 \div 36 = 1$.'
          - problem: 'Evaluate $(6 + 4) \times 2 - 3^2$.'
            answer: "11"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$(6 + 4) \times 2 = 20$; $3^2 = 9$; $20 - 9 = 11$.'
        constraints: "3-4 operations mixing parentheses, exponents, +, -, x, /"
    diagnostic_exemplar:
      problem: 'Compute $(4 + 2) \times 3 - 2^3$.'
      answer: "10"
      solution_sketch: 'Parentheses, then the power: $6 \times 3 - 8 = 18 - 8 = 10$.'
    anki_seeds:
      - front: "State the order of operations (PEMDAS)."
        back: "Parentheses, Exponents, Multiplication/Division (left to right), Addition/Subtraction (left to right)"
        type: basic

