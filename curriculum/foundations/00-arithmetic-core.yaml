unit: arithmetic-core
course: foundations
module: "Arithmetic"
topics:
  # --------------------------------------------------------------------- #
  # Mastery-floor roots (kept minimal at 2 KPs each; no prerequisites).
  # --------------------------------------------------------------------- #
  - id: single-digit-addition
    name: Single-Digit Addition
    core: true
    difficulty: 0.05
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites: []          # mastery-floor root
    knowledge_points:
      - id: kp1
        name: Sums within ten
        exemplars:
          - problem: 'Compute $3 + 4$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $6 + 2$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $5 + 4$.'
            answer: "9"
            answer_contract: {"kind":"exact"}
        constraints: "both addends 0-9, sum <= 10"
      - id: kp2
        name: Sums within twenty (bridging ten)
        exemplars:
          - problem: 'Compute $8 + 7$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Make ten: $8 + 2 = 10$, then + $5 = 15$.'
          - problem: 'Compute $9 + 6$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $7 + 5$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
        constraints: "both addends 0-9, sum 11-18"
    diagnostic_exemplar:
      problem: 'Compute $8 + 5$.'
      answer: "13"
      solution_sketch: 'Make ten: $8 + 2 = 10$, with $3$ of the $5$ left over, so $10 + 3 = 13$.'
    anki_seeds:
      - front: "Make-ten strategy: to add 8 + 5, first take 2 from the 5 to make 8 into..."
        back: "10, leaving 3 more: 10 + 3 = 13"
        type: basic

  - id: subtraction-facts
    name: Subtraction Facts
    core: true
    difficulty: 0.07
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites:
      - id: single-digit-addition
        weight: 1.0
        key: true
    knowledge_points:
      - id: kp1
        name: Differences within ten
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'Compute $9 - 4$.'
            answer: "5"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $7 - 3$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $10 - 6$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
        constraints: "minuend 0-10, nonnegative difference"
      - id: kp2
        name: Differences from the teens (bridging ten)
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'Compute $15 - 8$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Back through ten: $15 - 5 = 10$, then $- 3$ more gives $7$.'
          - problem: 'Compute $13 - 6$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $14 - 6$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
        constraints: "minuend 11-18, subtrahend 2-9"
    diagnostic_exemplar:
      problem: 'Compute $13 - 7$.'
      answer: "6"
      solution_sketch: 'Bridge ten: $13 - 3 = 10$, then $10 - 4 = 6$.'
    anki_seeds:
      - front: "Every addition fact gives two subtraction facts: from 8 + 5 = 13 we get..."
        back: "13 - 5 = 8 and 13 - 8 = 5"
        type: basic

  - id: multiplication-tables
    name: Multiplication Tables
    core: true
    difficulty: 0.1
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites: []          # mastery-floor root
    knowledge_points:
      - id: kp1
        name: Facts through 10 x 10
        exemplars:
          - problem: 'Compute $6 \times 7$.'
            answer: "42"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $8 \times 4$.'
            answer: "32"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $9 \times 6$.'
            answer: "54"
            answer_contract: {"kind":"exact"}
        constraints: "both factors 0-10"
      - id: kp2
        name: Facts with 11 and 12
        exemplars:
          - problem: 'Compute $12 \times 7$.'
            answer: "84"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $11 \times 8$.'
            answer: "88"
            answer_contract: {"kind":"exact"}
        constraints: "one factor 11 or 12, the other 2-12"
    diagnostic_exemplar:
      problem: 'Compute $12 \times 6$.'
      answer: "72"
      solution_sketch: 'Split the $12$: $10 \times 6 + 2 \times 6 = 60 + 12 = 72$.'
    anki_seeds:
      - front: "Nines trick: for 9 x n, the two digits of the answer always sum to..."
        back: "9 (e.g. 9 x 6 = 54, and 5 + 4 = 9)"
        type: basic

  - id: division-facts
    name: Division Facts
    core: true
    difficulty: 0.12
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites:
      - id: multiplication-tables
        weight: 1.0
        key: true
    knowledge_points:
      - id: kp1
        name: Quotients from the tables
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $42 \div 6$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $63 \div 9$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $32 \div 8$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
        constraints: "dividend is a product of two factors 2-10; divides evenly"
      - id: kp2
        name: Missing-factor form
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Solve: $6 \times \square = 48$.'
            answer: "8"
            solution_sketch: 'Division undoes multiplication: $48 \div 6 = 8$.'
          - problem: 'Compute $56 \div 7$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
          - problem: 'Solve: $\square \times 9 = 54$.'
            answer: "6"
        constraints: "facts through 10 x 10, stated as division or missing factor"
    diagnostic_exemplar:
      problem: 'Solve: $8 \times \square = 56$.'
      answer: '7'
      solution_sketch: 'The missing factor is $56 \div 8 = 7$.'
    anki_seeds:
      - front: "The division 42 / 6 asks the multiplication question..."
        back: "6 times what equals 42? (answer: 7)"
        type: basic

  - id: perfect-squares
    name: Perfect Squares
    core: true
    difficulty: 0.15
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites:
      - id: multiplication-tables
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: Squares through twelve squared
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $7^2$.'
            answer: "49"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $9^2$.'
            answer: "81"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $12^2$.'
            answer: "144"
            answer_contract: {"kind":"exact"}
        constraints: "base 1-12"
      - id: kp2
        name: Recognizing perfect squares
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Is $64$ a perfect square? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$8 \times 8 = 64$.'
          - problem: 'What number squared gives $121$?'
            answer: "11"
          - problem: 'Is $50$ a perfect square? (yes/no)'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
        constraints: "numbers up to 150"
    diagnostic_exemplar:
      problem: 'What whole number squared gives $144$?'
      answer: '12'
      solution_sketch: '$12^2 = 144$.'
    anki_seeds:
      - front: "13 squared ="
        back: "169"
        type: basic
      - front: "A perfect square is a number that equals..."
        back: "a whole number times itself (e.g. 36 = 6 x 6)"
        type: basic

  - id: place-value
    name: Place Value
    core: true
    difficulty: 0.1
    drill: false
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites: []          # mastery-floor root
    knowledge_points:
      - id: kp1
        name: Value of a digit by position
        exemplars:
          - problem: 'What is the value of the $7$ in $74$?'
            answer: "70"
          - problem: 'Which digit is in the hundreds place of $3852$?'
            answer: "8"
        constraints: "numbers up to 4 digits"
      - id: kp2
        name: Expanded form and larger numbers
        exemplars:
          - problem: 'What is the value of the $5$ in $5{,}280$?'
            answer: "5000"
          - problem: 'Write $4{,}506$ in expanded form.'
            answer: "4000 + 500 + 6"
            solution_sketch: '$4$ thousands + $5$ hundreds + $0$ tens + $6$ ones.'
        constraints: "numbers up to 5 digits, may include internal zeros"
    diagnostic_exemplar:
      problem: 'What is the value of the $4$ in $23{,}406$?'
      answer: '400'
      solution_sketch: 'The $4$ sits in the hundreds place.'
    anki_seeds:
      - front: "In 4,321 the digit 4 sits in the {{c1::thousands}} place."
        back: "thousands"
        type: cloze

  - id: comparing-ordering-whole-numbers
    name: Comparing and Ordering Whole Numbers
    core: true
    difficulty: 0.1
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: place-value
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: Compare two numbers
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Which is larger, $4{,}562$ or $4{,}652$?'
            answer: "4652"
            solution_sketch: 'Same thousands digit; compare hundreds: $6 > 5$.'
          - problem: 'Which is smaller, $389$ or $401$?'
            answer: "389"
        constraints: "numbers up to 5 digits, same or different digit counts"
      - id: kp2
        name: Order a list of numbers
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Order from least to greatest: $315$, $351$, $153$.'
            answer: "153, 315, 351"
            solution_sketch: 'Comparing hundreds then tens: $153 < 315 < 351$.'
          - problem: 'Which is greatest: $2{,}087$, $2{,}870$, or $2{,}078$?'
            answer: "2870"
            solution_sketch: 'All three share the thousands digit $2$; comparing hundreds digits ($0$, $8$, $0$), $2{,}870$ has the largest and is greatest.'
          - problem: 'Order from least to greatest: $5{,}316$, $5{,}361$, $5{,}136$.'
            answer: "5136, 5316, 5361"
            solution_sketch: 'Comparing place by place: $5{,}136 < 5{,}316 < 5{,}361$.'
          - problem: 'Order from least to greatest: $712$, $89$, $1{,}205$, $698$.'
            answer: "89, 698, 712, 1205"
            solution_sketch: 'Comparing place by place: $89 < 698 < 712 < 1{,}205$.'
        constraints: "3-4 numbers, up to 4 digits"
    diagnostic_exemplar:
      problem: 'Order from least to greatest: $4{,}071$, $4{,}710$, $4{,}017$.'
      answer: '4017, 4071, 4710'
      solution_sketch: 'All three have four digits, so compare place by place from the left.'
    anki_seeds:
      - front: "To compare two whole numbers with the same number of digits, compare digits..."
        back: "from left to right; the first place where they differ decides"
        type: basic
      - front: "A whole number with more digits than another is always..."
        back: "larger (e.g. 1,000 > 999)"
        type: basic

  - id: rounding-whole-numbers
    name: Rounding Whole Numbers
    core: true
    difficulty: 0.12
    drill: false
    answer_kind: numeric
    expected_time_secs: 35
    prerequisites:
      - id: place-value
        weight: 0.8
        key: true
      - id: comparing-ordering-whole-numbers
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Round to the nearest ten or hundred
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Round $47$ to the nearest ten.'
            answer: "50"
          - problem: 'Round $83$ to the nearest ten.'
            answer: "80"
          - problem: 'Round $342$ to the nearest hundred.'
            answer: "300"
            solution_sketch: 'The tens digit is $4 (< 5)$, so round down to $300$.'
        constraints: "2-3 digit numbers"
      - id: kp2
        name: Round to larger places, including boundary cases
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Round $2{,}681$ to the nearest thousand.'
            answer: "3000"
          - problem: 'Round $7{,}450$ to the nearest hundred.'
            answer: "7500"
            solution_sketch: 'The tens digit is exactly $5$, so round up: $7{,}500$.'
          - problem: 'Round $4{,}500$ to the nearest thousand.'
            answer: "5000"
        constraints: "up to 4 digits; include boundary (5) cases"
    diagnostic_exemplar:
      problem: 'Round $6{,}350$ to the nearest hundred.'
      answer: "6400"
      solution_sketch: 'The tens digit is $5$, so the hundreds digit rounds up: $6{,}400$.'
    anki_seeds:
      - front: "When rounding, look at the digit to the right of the target place: if it is 5 or more you..."
        back: "round up; if it is 4 or less, round down (keep the digit)"
        type: basic

  # --------------------------------------------------------------------- #
  # Multi-digit computation
  # --------------------------------------------------------------------- #
  - id: addition-with-carrying
    name: Addition with Carrying
    core: true
    difficulty: 0.12
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: single-digit-addition
        weight: 1.0
        key: true
      - id: place-value
        weight: 0.6
    knowledge_points:
      - id: kp1
        name: Two-digit addition with a carry
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'Compute $47 + 38$.'
            answer: "85"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$7 + 8 = 15$, write $5$ carry $1$; $4 + 3 + 1 = 8$.'
          - problem: 'Compute $56 + 27$.'
            answer: "83"
            answer_contract: {"kind":"exact"}
        constraints: "2-digit addends, exactly one carry"
      - id: kp2
        name: Three-digit addition with multiple carries
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Compute $256 + 178$.'
            answer: "434"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ones: $6+8=14$ (carry); tens: $5+7+1=13$ (carry); hundreds: $2+1+1=4$.'
          - problem: 'Compute $385 + 247$.'
            answer: "632"
            answer_contract: {"kind":"exact"}
        constraints: "3-digit addends, at least two carries"
      - id: kp3
        name: Several addends
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'Compute $25 + 37 + 18$.'
            answer: "80"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $123 + 45 + 206$.'
            answer: "374"
            answer_contract: {"kind":"exact"}
        constraints: "three addends, up to 3 digits each"
    diagnostic_exemplar:
      problem: 'Compute $256 + 187 + 45$.'
      answer: '488'
      solution_sketch: 'Units $6 + 7 + 5 = 18$ (carry 1); tens $5 + 8 + 4 + 1 = 18$ (carry 1); hundreds $2 + 1 + 1 = 4$.'
    anki_seeds:
      - front: "In column addition, when a column's sum reaches 10 or more you write the ones digit and..."
        back: "carry the tens digit to the next column left"
        type: basic

  - id: subtraction-with-borrowing
    name: Subtraction with Borrowing
    core: true
    difficulty: 0.13
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: subtraction-facts
        weight: 1.0
        key: true
      - id: place-value
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Two-digit subtraction with a borrow
        key_prerequisites: [subtraction-facts]
        exemplars:
          - problem: 'Compute $82 - 47$.'
            answer: "35"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Borrow: $12 - 7 = 5$; then $7 - 4 = 3$.'
          - problem: 'Compute $61 - 28$.'
            answer: "33"
            answer_contract: {"kind":"exact"}
        constraints: "2-digit numbers, minuend >= subtrahend, one borrow"
      - id: kp2
        name: Three-digit subtraction
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Compute $435 - 187$.'
            answer: "248"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $612 - 345$.'
            answer: "267"
            answer_contract: {"kind":"exact"}
        constraints: "3-digit numbers, at least one borrow, no zeros in the minuend"
      - id: kp3
        name: Checking by addition
        key_prerequisites: [subtraction-facts]
        exemplars:
          - problem: 'Compute $74 - 29$, then verify by addition.'
            answer: "45"
            solution_sketch: '$74 - 29 = 45$; check: $29 + 45 = 74$.'
          - problem: 'Compute $725 - 468$.'
            answer: "257"
            answer_contract: {"kind":"exact"}
        constraints: "2-3 digit numbers; encourage the addition check"
    diagnostic_exemplar:
      problem: 'Compute $623 - 457$.'
      answer: '166'
      solution_sketch: 'Borrow in both columns; check by addition: $166 + 457 = 623$.'
    anki_seeds:
      - front: "In column subtraction, when the top digit is smaller than the bottom digit you must..."
        back: "borrow (regroup) one unit from the next place to the left"
        type: basic

  - id: multi-digit-addition-subtraction
    name: Multi-Digit Addition and Subtraction
    core: true
    difficulty: 0.18
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: addition-with-carrying
        weight: 0.9
        key: true
      - id: subtraction-with-borrowing
        weight: 0.9
        key: true
      - id: place-value
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Four-digit addition
        key_prerequisites: [addition-with-carrying]
        exemplars:
          - problem: 'Compute $1{,}867 + 3{,}589$.'
            answer: "5456"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $4{,}675 + 2{,}848$.'
            answer: "7523"
            answer_contract: {"kind":"exact"}
        constraints: "4-digit addends, multiple carries"
      - id: kp2
        name: Subtracting across zeros
        key_prerequisites: [subtraction-with-borrowing]
        exemplars:
          - problem: 'Compute $503 - 268$.'
            answer: "235"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Borrow across the zero: $503 - 268 = 235$ (check $268 + 235 = 503$).'
          - problem: 'Compute $700 - 356$.'
            answer: "344"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $4{,}003 - 1{,}567$.'
            answer: "2436"
            answer_contract: {"kind":"exact"}
        constraints: "minuend contains zeros requiring a chain borrow"
      - id: kp3
        name: Combined multi-step computations
        key_prerequisites: [addition-with-carrying]
        exemplars:
          - problem: 'Compute $350 + 275 - 125$.'
            answer: "500"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $812 - (347 + 165)$.'
            answer: "300"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$347 + 165 = 512$; $812 - 512 = 300$.'
        constraints: "two operations, numbers up to 4 digits"
    diagnostic_exemplar:
      problem: 'Compute $4{,}000 - (1{,}268 + 947)$.'
      answer: '1785'
      solution_sketch: '$1{,}268 + 947 = 2{,}215$; then $4{,}000 - 2{,}215 = 1{,}785$, borrowing across the zeros.'
    anki_seeds:
      - front: "To check a subtraction a - b = c, verify that..."
        back: "b + c = a"
        type: basic

  - id: addition-subtraction-word-problems
    name: Addition and Subtraction Word Problems
    core: false                # enrichment / applications leaf topic
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: multi-digit-addition-subtraction
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: One-step problems
        key_prerequisites: [multi-digit-addition-subtraction]
        exemplars:
          - problem: 'A library has $1{,}240$ books and buys $385$ more. How many books does it have now?'
            answer: "1625"
            solution_sketch: '$1{,}240 + 385 = 1{,}625$.'
          - problem: 'A stadium holds $4{,}500$ people and $3{,}862$ attend. How many seats are empty?'
            answer: "638"
            solution_sketch: '$4{,}500 - 3{,}862 = 638$.'
          - problem: 'A warehouse stores $3{,}450$ boxes and ships $1{,}275$. How many boxes remain?'
            answer: "2175"
            solution_sketch: '$3{,}450 - 1{,}275 = 2{,}175$.'
          - problem: 'A concert hall seats $2{,}800$ people; $1{,}950$ tickets are sold. How many seats are still available?'
            answer: "850"
            solution_sketch: '$2{,}800 - 1{,}950 = 850$.'
        constraints: "one operation; numbers up to 4 digits"
      - id: kp2
        name: Two-step problems
        key_prerequisites: [multi-digit-addition-subtraction]
        exemplars:
          - problem: 'Maya had €250, spent €78, then earned €45. How much does she have now?'
            answer: "217"
            solution_sketch: '$250 - 78 = 172$; $172 + 45 = 217$.'
          - problem: 'A school has $364$ students. $88$ are in year $5$ and $95$ are in year $6$. How many are in other years?'
            answer: "181"
            solution_sketch: '$88 + 95 = 183$; $364 - 183 = 181$.'
          - problem: 'Ben had $180$ marbles, lost $45$, then won $60$ more. How many does he have now?'
            answer: "195"
            solution_sketch: '$180 - 45 = 135$; $135 + 60 = 195$.'
          - problem: 'A shop has $340$ shirts. It sells $128$ on Monday and receives a delivery of $75$. How many shirts does it have now?'
            answer: "287"
            solution_sketch: '$340 - 128 = 212$; $212 + 75 = 287$.'
        constraints: "two operations; numbers up to 3 digits"
      - id: kp3
        name: Comparison problems
        key_prerequisites: [multi-digit-addition-subtraction]
        exemplars:
          - problem: 'Sam has $128$ stamps, which is $43$ more than Ana has. How many stamps does Ana have?'
            answer: "85"
            solution_sketch: '"$43$ more than Ana" means Ana has $128 - 43 = 85$.'
          - problem: 'Mount A is $3{,}776$ m tall and Mount B is $2{,}917$ m tall. How much taller is Mount A?'
            answer: "859"
            solution_sketch: '$3{,}776 - 2{,}917 = 859$.'
          - problem: 'Nora has $246$ stickers, which is $59$ fewer than Elena has. How many stickers does Elena have?'
            answer: "305"
            solution_sketch: '$59$ fewer than Elena means Elena has $246 + 59 = 305$.'
          - problem: 'River A is $1{,}885$ km long and River B is $2{,}340$ km long. How much shorter is River A?'
            answer: "455"
            solution_sketch: '$2{,}340 - 1{,}885 = 455$.'
        constraints: "difference/comparison language; up to 4 digits"
    diagnostic_exemplar:
      problem: 'Tomas has $215$ stamps, which is $58$ more than Rita has. How many stamps do they have together?'
      answer: "372"
      solution_sketch: 'Rita has $215 - 58 = 157$; together $215 + 157 = 372$.'
    anki_seeds:
      - front: "In a word problem, the phrase 'how many more' signals which operation?"
        back: "subtraction (finding a difference)"
        type: basic

  - id: multiplying-by-powers-of-ten
    name: Multiplying by Powers of Ten
    core: true
    difficulty: 0.15
    drill: false
    answer_kind: numeric
    expected_time_secs: 40
    prerequisites:
      - id: multiplication-tables
        weight: 0.8
        key: true
      - id: place-value
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Multiply by 10, 100, and 1000
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Compute $47 \times 10$.'
            answer: "470"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying by 10 appends one zero to 47: $47 \times 10 = 470$.'
          - problem: 'Compute $36 \times 100$.'
            answer: "3600"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying by 100 appends two zeros to 36: $36 \times 100 = 3600$.'
          - problem: 'Compute $8 \times 1000$.'
            answer: "8000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying by 1000 appends three zeros to 8: $8 \times 1000 = 8000$.'
          - problem: 'Compute $12 \times 1000$.'
            answer: "12000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying by 1000 appends three zeros to 12: $12 \times 1000 = 12000$.'
        constraints: "1-2 digit number times 10, 100, or 1000"
      - id: kp2
        name: Multiply multiples of ten
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $40 \times 70$.'
            answer: "2800"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$4 \times 7 = 28$, then append the two zeros.'
          - problem: 'Compute $240 \times 30$.'
            answer: "7200"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Strip one trailing zero from each factor: $24 \times 3 = 72$; append two zeros: $7200$.'
          - problem: 'Compute $600 \times 50$.'
            answer: "30000"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$6 \times 5 = 30$, then append three zeros: $30{,}000$.'
          - problem: 'Compute $90 \times 40$.'
            answer: "3600"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$9 \times 4 = 36$, then append the two zeros: $3600$.'
        constraints: "both factors end in zeros; underlying fact from the tables"
    diagnostic_exemplar:
      problem: 'Compute $60 \times 80$.'
      answer: "4800"
      solution_sketch: '$6 \times 8 = 48$, then restore the two zeros: $4{,}800$.'
    anki_seeds:
      - front: "To multiply by a multiple of ten (e.g. 240 x 30), multiply the nonzero parts then..."
        back: "append the total number of trailing zeros (24 x 3 = 72 -> 7200)"
        type: basic

