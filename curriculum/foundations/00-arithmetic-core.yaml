      - id: kp2
        name: Three-digit by two-digit
        key_prerequisites: [multiplying-by-powers-of-ten]
        exemplars:
          - problem: 'Compute $412 \times 35$.'
            answer: '14420'
            answer_contract: {"kind":"exact"}
