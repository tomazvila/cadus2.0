  - id: division-with-remainders
    name: Division with Remainders
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: division-facts
        weight: 0.9
        key: true
      - id: subtraction-facts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Quotient and remainder
        key_prerequisites: [division-facts]
        exemplars:
          - problem: 'What are the quotient and remainder when $47$ is divided by $5$?'
            answer: '9 R2'
            answer_contract: {"kind":"quotient_remainder","divisor":5}
            solution_sketch: 'The greatest multiple of $5$ that fits in $47$ is $5 \times 9 = 45$. The remainder is $47 - 45 = 2$, which is less than $5$.'
          - problem: 'When $26$ is divided by $4$, what are the quotient and remainder?'
            answer: '6 R2'
            answer_contract: {"kind":"quotient_remainder","divisor":4}
            solution_sketch: 'The greatest multiple of $4$ that fits in $26$ is $4 \times 6 = 24$. The remainder is $26 - 24 = 2$, which is less than $4$.'
          - problem: 'Sam divides $59$ by $6$ and writes $8$ R$11$. What are the correct quotient and remainder?'
            answer: '9 R5'
            answer_contract: {"kind":"quotient_remainder","divisor":6}
            solution_sketch: 'Sam took too few groups, so the remainder $11$ is larger than $6$. One more group fits: $6 \times 9 = 54$ and $59 - 54 = 5$.'
          - problem: 'A baker packs $75$ cookies into boxes of $8$. How many full boxes does the baker fill, and how many cookies are left over?'
            answer: '9 R3'
            answer_contract: {"kind":"quotient_remainder","divisor":8}
            solution_sketch: 'Full boxes are full groups of $8$ cookies. The greatest multiple of $8$ that fits in $75$ is $8 \times 9 = 72$. The remainder is $75 - 72 = 3$, which is less than $8$.'
          - problem: 'What is the remainder when $71$ is divided by $9$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The greatest multiple of $9$ that fits in $71$ is $9 \times 7 = 63$. The remainder is $71 - 63 = 8$.'
          - problem: 'A class of $29$ pupils is split into teams of $4$. How many pupils are left without a full team?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Seven teams use $4 \times 7 = 28$ pupils. The pupils left without a team number $29 - 28 = 1$.'
          - problem: 'What are the quotient and remainder when $53$ is divided by $6$?'
            answer: '8 R5'
            answer_contract: {"kind":"quotient_remainder","divisor":6}
            solution_sketch: 'The greatest multiple of $6$ that fits in $53$ is $6 \times 8 = 48$. The remainder is $53 - 48 = 5$, which is less than $6$.'
          - problem: 'A rope $100$ cm long is cut into pieces of $7$ cm. How many whole pieces are there, and how many centimeters of rope are left over?'
            answer: '14 R2'
            answer_contract: {"kind":"quotient_remainder","divisor":7}
            solution_sketch: 'Whole pieces are full groups of $7$ cm. The greatest multiple of $7$ that fits in $100$ is $7 \times 14 = 98$. The remainder is $100 - 98 = 2$, which is less than $7$.'
        constraints: '2-digit dividend, 1-digit divisor, nonzero remainder; plain and in context'
      - id: kp2
        name: Checking with divisor x quotient + remainder
        key_prerequisites: [division-facts]
        exemplars:
          - problem: 'Compute $38 \div 7$ and verify your answer by multiplying.'
            answer: '5 R3'
            answer_contract: {"kind":"quotient_remainder","divisor":7}
            solution_sketch: 'The greatest multiple of $7$ that fits in $38$ is $7 \times 5 = 35$, so the remainder is $38 - 35 = 3$. Check: $7 \times 5 + 3 = 38$.'
          - problem: 'Priya divides $50$ by $6$ and gets $7$ R$8$. Check her answer by multiplying and adding, and give the correct quotient and remainder.'
            answer: '8 R2'
            answer_contract: {"kind":"quotient_remainder","divisor":6}
            solution_sketch: 'Her numbers satisfy $6 \times 7 + 8 = 50$, but the remainder $8$ is not smaller than $6$, so the division is not finished. The correct result is $6 \times 8 = 48$ and $50 - 48 = 2$.'
          - problem: 'When a number is divided by $8$, the quotient is $7$ and the remainder is $5$. What is the number?'
            answer: '61'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Reverse the division: the number is the divisor times the quotient plus the remainder. So the number is $8 \times 7 + 5 = 61$.'
          - problem: 'What are the quotient and remainder when $44$ is divided by $9$?'
            answer: '4 R8'
            answer_contract: {"kind":"quotient_remainder","divisor":9}
            solution_sketch: 'The greatest multiple of $9$ that fits in $44$ is $9 \times 4 = 36$. The remainder is $44 - 36 = 8$, which is less than $9$.'
          - problem: 'What is the largest remainder possible when a number is divided by $8$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The remainder must be smaller than the divisor $8$. The largest whole number below $8$ is $7$, so the largest remainder is $7$.'
          - problem: 'A teacher hands out $6$ pencils to each of $9$ pupils and has $4$ pencils left. How many pencils did the teacher have to start with?'
            answer: '58'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pupils received $6 \times 9 = 54$ pencils. Adding the $4$ pencils left gives $54 + 4 = 58$.'
          - problem: 'A florist has $61$ roses and ties them into bunches of $8$. How many full bunches does the florist make, and how many roses are left over?'
            answer: '7 R5'
            answer_contract: {"kind":"quotient_remainder","divisor":8}
            solution_sketch: 'Full bunches are full groups of $8$ roses. The greatest multiple of $8$ that fits in $61$ is $8 \times 7 = 56$. The remainder is $61 - 56 = 5$, which is less than $8$.'
          - problem: 'Compute $79 \div 9$ and verify your answer.'
            answer: '8 R7'
            answer_contract: {"kind":"quotient_remainder","divisor":9}
            solution_sketch: 'The greatest multiple of $9$ that fits in $79$ is $9 \times 8 = 72$. The remainder is $79 - 72 = 7$, which is less than $9$.'
        constraints: 'remainder strictly smaller than the divisor; checking by divisor x quotient + remainder'
      - id: kp3
        name: Remainders in context
        key_prerequisites: [subtraction-facts]
        try_first:
          problem: 'There are $25$ children and each boat carries $6$ children. How many boats are needed so that every child rides?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: '$25 \div 6 = 4$ R$1$: four boats leave one child on the shore, so a fifth boat is needed. When everyone must be carried, a remainder needs one more group.'
        exemplars:
          - problem: '$23$ apples are packed in bags of $4$. How many full bags are packed?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide: $23 \div 4 = 5$ R$3$. Only full bags count, so the $3$ extra apples do not make a bag: $5$ bags.'
          - problem: '$34$ students ride in cars that hold $4$ each. How many cars are needed?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide: $34 \div 4 = 8$ R$2$. The $2$ leftover students still need a ride, so one more car is needed: $9$ cars.'
          - problem: '$52$ pencils are packed in boxes of $7$. How many full boxes are packed?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide: $52 \div 7 = 7$ R$3$ because $7 \times 7 = 49$. Only full boxes count, so there are $7$ boxes.'
          - problem: 'A rope $100$ cm long is cut into as many pieces of $15$ cm as possible. How long is the piece left over?'
            answer: '10'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Divide: $100 \div 15 = 6$ R$10$ because $15 \times 6 = 90$. The piece left over is $100 - 90 = 10$ cm long.'
          - problem: '$45$ people ride in vans that hold $6$ each. How many vans are needed?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide: $45 \div 6 = 7$ R$3$ because $6 \times 7 = 42$. The $3$ people left over still need a van, so $8$ vans are needed.'
          - problem: 'Priya has $47$ dollars. A ticket costs $6$ dollars. How many tickets can she buy?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide: $47 \div 6 = 7$ R$5$ because $6 \times 7 = 42$. The remaining $5$ dollars buy no full ticket, so she buys $7$ tickets.'
          - problem: 'A cook packs $6$ eggs in each box, fills $7$ boxes and has $3$ eggs left over. How many eggs did the cook have?'
            answer: '45'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The full boxes hold $6 \times 7 = 42$ eggs. Adding the $3$ eggs left over gives $42 + 3 = 45$ eggs.'
          - problem: 'A hall has benches that each seat $8$ people. How many benches are needed for $70$ people?'
            answer: '9'
