        exemplars:
          - problem: 'Find the LCM of $2$, $3$, and $4$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\text{LCM}(2, 3, 4) = 12$.'
          - problem: 'What is the least common multiple of $3$, $4$, and $6$?'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\text{LCM}(3, 4, 6) = 12$.'
          - problem: '$2$, $5$, and $6$ share a least common multiple. Find it.'
            answer: "30"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\text{LCM}(2,5,6) = 30$.'
          - problem: 'Determine the LCM of $4$, $6$, and $8$.'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\text{LCM}(4,6,8) = 24$.'
        constraints: "three numbers up to 10"
    diagnostic_exemplar:
      problem: 'Find the LCM of $4$, $6$, and $9$.'
      answer: '36'
      solution_sketch: 'LCM$(4, 6) = 12$, then LCM$(12, 9) = 36$.'
    anki_seeds:
      - front: "If two numbers share no common factor besides 1, their LCM equals..."
        back: "their product"
        type: basic
      - front: "If a divides b, then LCM(a, b) equals..."
        back: "b"
        type: basic

  - id: gcf-lcm
    name: Greatest Common Factor and Least Common Multiple
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: greatest-common-factor
        weight: 0.8
        key: true
      - id: least-common-multiple
        weight: 0.8
        key: true
      - id: prime-factorization
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: GCF via prime factorization
        key_prerequisites: [prime-factorization]
        exemplars:
          - problem: 'Find the GCF of $45$ and $60$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$45 = 3^2 \times 5$, $60 = 2^2 \times 3 \times 5$; common part $3 \times 5 = 15$.'
          - problem: 'What is the greatest common factor of $72$ and $120$?'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$72 = 2^3 \times 3^2$, $120 = 2^3 \times 3 \times 5$; $2^3 \times 3 = 24$.'
          - problem: '$90$ and $105$ share a greatest common factor. Find it.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$90 = 2 \times 3 \times 3 \times 5$, $105 = 3 \times 5 \times 7$; common part gives $15$.'
          - problem: 'Determine the GCF of $126$ and $84$.'
            answer: "42"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$126=2\times3^2\times7$ and $84=2^2\times3\times7$. The shared prime factors give $2\times3\times7=42$.'
        constraints: "two numbers 40-150 where listing factors is slow"
      - id: kp2
        name: LCM via prime factorization
        key_prerequisites: [prime-factorization]
        exemplars:
          - problem: 'Find the LCM of $8$ and $12$.'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$8 = 2^3$, $12 = 2^2 \times 3$; $\text{LCM} = 2^3 \times 3 = 24$.'
          - problem: 'What is the least common multiple of $9$ and $15$?'
            answer: "45"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\text{LCM}(9, 15) = 45$.'
          - problem: '$12$ and $18$ share a least common multiple. Find it.'
            answer: "36"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\text{LCM}(12, 18) = 36$.'
          - problem: 'Determine the LCM of $20$ and $30$.'
            answer: "60"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$20 = 2 \times 2 \times 5$, $30 = 2 \times 3 \times 5$; $\text{LCM} = 60$.'
        constraints: "two numbers up to 60; highest power of each prime"
      - id: kp3
        name: GCF and LCM in applications
        key_prerequisites: [greatest-common-factor]
        exemplars:
          - problem: 'One bus leaves every $12$ minutes and another every $18$ minutes. They leave together at 9:00. In how many minutes do they next leave together?'
            answer: "36"
            solution_sketch: '$\text{LCM}(12, 18) = 36$.'
          - problem: 'What is the side length of the largest square tile that exactly covers a $24$ by $36$ floor?'
            answer: "12"
            solution_sketch: '$\text{GCF}(24, 36) = 12$.'
          - problem: 'One machine cycles every $8$ minutes and another every $10$ minutes. They start together. In how many minutes do they start together again?'
            answer: "40"
            solution_sketch: '$\text{LCM}(8, 10) = 40$.'
          - problem: 'What is the side length of the largest square tile that exactly covers an $18$ by $30$ floor?'
            answer: "6"
            solution_sketch: '$\text{GCF}(18, 30) = 6$.'
        constraints: "recognize whether the situation needs the GCF or the LCM"
    diagnostic_exemplar:
      problem: 'A gardener has $84$ tulips and $126$ daffodils and makes identical bunches with no flowers left over. What is the greatest number of bunches?'
      answer: '42'
      solution_sketch: '$84 = 2^2 \times 3 \times 7$ and $126 = 2 \times 3^2 \times 7$, so the GCF is $2 \times 3 \times 7 = 42$.'
    anki_seeds:
      - front: "From prime factorizations, the GCF is found by multiplying..."
        back: "the primes common to both numbers, each to its lowest power"
        type: basic
      - front: "From prime factorizations, the LCM is found by multiplying..."
        back: "every prime that appears in either number, each to its highest power"
        type: basic
      - front: "For any two positive whole numbers a and b, GCF(a,b) x LCM(a,b) equals..."
        back: "a x b"
        type: basic

  - id: rounding-estimation
    name: Rounding and Estimation
    core: false                # estimation leaf; heads the terminal estimation branch
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 50
    prerequisites:
      - id: rounding-whole-numbers
        weight: 0.9
        key: true
      - id: multi-digit-addition-subtraction
        weight: 0.4
      - id: multiplying-by-one-digit
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Estimating sums and differences
        key_prerequisites: [rounding-whole-numbers]
        exemplars:
          - problem: 'Estimate $68 + 21$ by rounding each number to the nearest ten.'
            answer: "90"
            solution_sketch: '$70 + 20 = 90$.'
          - problem: 'Estimate $412 - 189$ by rounding each number to the nearest hundred.'
            answer: "200"
            solution_sketch: 'Round $412$ to $400$ and $189$ to $200$, then subtract: $400 - 200$ gives an estimate of $200$.'
          - problem: 'Round $537$ and $148$ each to the nearest ten, then add the rounded values.'
            answer: "690"
            solution_sketch: '$540 + 150 = 690$.'
          - problem: 'Estimate $623 - 274$ by rounding each number to the nearest ten.'
            answer: "350"
            solution_sketch: '$620 - 270 = 350$.'
        constraints: "2-3 digit operands; answer is the rounded estimate"
      - id: kp2
        name: Estimating products and quotients
        key_prerequisites: [multiplying-by-one-digit]
        exemplars:
          - problem: 'Estimate $49 \times 31$ by rounding each factor to the nearest ten.'
            answer: "1500"
            solution_sketch: '$50 \times 30 = 1500$.'
          - problem: 'Estimate $358 \div 6$ using the compatible numbers $360$ and $6$.'
            answer: "60"
            solution_sketch: '$360 \div 6 = 60$.'
          - problem: 'Round $27$ and $42$ each to the nearest ten, then multiply the rounded values.'
            answer: "1200"
            solution_sketch: '$30 \times 40 = 1{,}200$.'
          - problem: 'Use the compatible numbers $280$ and $7$ to estimate $284 \div 7$.'
            answer: "40"
            solution_sketch: '$280 \div 7 = 40$.'
        constraints: "round to compatible numbers; answer is the estimate"
      - id: kp3
        name: Judging reasonableness
        key_prerequisites: [multi-digit-addition-subtraction]
        exemplars:
          - problem: 'Without computing exactly, is $297 + 304$ closer to $600$ or to $700$?'
            answer: "600"
            solution_sketch: '$297 \approx 300$ and $304 \approx 300$; the exact sum is $601$.'
          - problem: "Ellie estimates $42 \\times 19$ as $42 \\times 20 = 840$. Compare the exact product with $840$. Give the verdict and the difference."
            answer: "verdict = smaller; difference = 42"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["larger"], ["smaller"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "difference"}]}
            solution_sketch: "Step 1 (estimate): the estimate is $42 \\times 20 = 840$. Step 2 (multiplication): the exact product is $42 \\times 19 = 798$. Step 3 (comparison): $798$ is less than $840$, so the verdict is smaller. Step 4 (subtraction): the difference is $840 - 798 = 42$. The wrong option larger is wrong because rounding $19$ up makes the estimate too big. So the answer is verdict = smaller; difference = 42."
          - problem: 'Without finding the exact sum, is $198 + 305$ closer to $500$ or to $600$?'
            answer: "500"
            solution_sketch: '$198 \approx 200$ and $305 \approx 300$; the exact sum is $503$.'
          - problem: "Maya estimates $58 \\times 21$ as $60 \\times 20 = 1200$. Compare the exact product with $1200$. Give the verdict and the difference."
            answer: "verdict = larger; difference = 18"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["larger"], ["smaller"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "difference"}]}
            solution_sketch: "Step 1 (estimate): the estimate is $60 \\times 20 = 1200$. Step 2 (multiplication): the exact product is $58 \\times 21 = 1218$. Step 3 (comparison): $1218$ is greater than $1200$, so the verdict is larger. Step 4 (subtraction): the difference is $1218 - 1200 = 18$. The wrong option smaller is wrong because rounding $58$ up and $21$ down makes the estimate too low. So the answer is verdict = larger; difference = 18."
        constraints: "answer chooses between options or over/under"
    diagnostic_exemplar:
      problem: 'Estimate $62 \times 38$ by rounding each factor to the nearest ten.'
      answer: "2400"
      solution_sketch: 'Round to $60$ and $40$: $60 \times 40 = 2{,}400$.'
    anki_seeds:
      - front: "If you round both factors UP before multiplying, your estimate is guaranteed to be..."
        back: "an overestimate of the true product"
        type: basic
