        name: Round to the nearest ten or hundred
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Round $47$ to the nearest ten.'
            answer: "50"
            solution_sketch: 'The ones digit is $7 (\geq 5)$, so round up to $50$.'
          - problem: 'What is $83$ rounded to the nearest ten?'
            answer: "80"
            solution_sketch: 'The ones digit is $3 (< 5)$, so round down to $80$.'
          - problem: 'Round $342$ to the nearest hundred.'
            answer: "300"
            solution_sketch: 'The tens digit is $4 (< 5)$, so round down to $300$.'
          - problem: 'What is $638$ rounded to the nearest hundred?'
            answer: "600"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The digit to the right of the hundreds place is the tens digit $3$, which is less than $5$. So $638$ rounds down to $600$.'
          - problem: 'Write a whole number that rounds to $350$ when rounded to the nearest ten.'
            answer: "352"
            answer_contract: {"kind":"property","check":"integer_in_range","args":{"min":345,"max":354}}
            solution_sketch: 'A whole number rounds to $350$ at the nearest ten when it is at least $345$ and less than $355$. So $352$ works, and so does any whole number from $345$ to $354$.'
        constraints: "2-3 digit numbers"
      - id: kp2
        name: Round to larger places, including boundary cases
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Round $2681$ to the nearest thousand.'
            answer: "3000"
            solution_sketch: 'The hundreds digit is $6 (\geq 5)$, so round up to $3000$.'
          - problem: 'Round $7450$ to the nearest hundred.'
            answer: "7500"
            solution_sketch: 'The tens digit is exactly $5$, so round up: $7500$.'
          - problem: 'What is $4500$ rounded to the nearest thousand?'
            answer: "5000"
            solution_sketch: 'The hundreds digit is $5 (\geq 5)$, so round up to $5000$.'
          - problem: 'To the nearest thousand, what is $9500$?'
            answer: "10000"
            solution_sketch: 'The digit to the right of the thousands place is $5$, so round up: $10\,000$.'
          - problem: 'Write a whole number that rounds to $6000$ at the nearest thousand and to $5600$ at the nearest hundred.'
            answer: "5612"
            answer_contract: {"kind":"property","check":"integer_in_range","args":{"min":5550,"max":5649}}
            solution_sketch: 'Rounding to $5600$ at the nearest hundred needs a number from $5550$ to $5649$. Every such number is at least $5500$, so it also rounds to $6000$; for example $5612$.'
        constraints: "up to 4 digits; include boundary (5) cases"
    diagnostic_exemplar:
      problem: 'Round $6350$ to the nearest hundred.'
      answer: "6400"
      solution_sketch: 'The tens digit is $5$, so the hundreds digit rounds up: $6400$.'
    anki_seeds:
      - front: "When rounding, look at the digit to the right of the target place: if it is 5 or more you..."
        back: "round up; if it is 4 or less, round down (keep the digit)"
        type: basic

