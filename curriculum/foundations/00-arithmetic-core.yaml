          - problem: 'What is the value of the $7$ in $74$?'
            answer: "70"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $7$ sits in the tens place. So its value is $7 \times 10 = 70$.'
          - problem: 'Which digit is in the hundreds place of $3852$?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count the places from the right: ones $2$, tens $5$, hundreds $8$, thousands $3$. So the hundreds digit is $8$.'
          - problem: 'What is the value of the $7$ in $7249$?'
            answer: "7000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $7$ sits in the thousands place. So its value is $7 \times 1000 = 7000$.'
          - problem: 'A bag holds $3502$ beads. The digit $5$ stands for how many beads?'
            answer: "500"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $5$ sits in the hundreds place. So it stands for $5 \times 100 = 500$ beads.'
          - problem: 'A cashier has $4$ hundred-dollar bills, $3$ ten-dollar bills and $8$ one-dollar bills. How many dollars is that in all?'
            answer: "438"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The hundreds are $4 \times 100 = 400$ dollars, the tens are $3 \times 10 = 30$ dollars and the ones are $8$ dollars. The total is $400 + 30 + 8 = 438$ dollars.'
          - problem: 'Sam says that the $6$ in $4168$ has the value $6$. What is its correct value?'
            answer: "60"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $6$ sits in the tens place, not the ones place. So its value is $6 \times 10 = 60$.'
          - problem: 'In the number $5063$, which digit is in the tens place?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count the places from the right: ones $3$, tens $6$, hundreds $0$, thousands $5$. So the tens digit is $6$.'
        constraints: "numbers up to 4 digits"
      - id: kp2
        name: Expanded form and larger numbers
        try_first:
          problem: 'What number is $9000+70+2$?'
          answer_contract: {"kind":"exact"}
          answer: '9072'
          reveal: 'The sum has no hundreds, so the hundreds place holds a $0$ and the number is $9072$. Without that zero, $972$ would be a different number.'
        exemplars:
          - problem: 'A number is written in expanded form as $70000+800+6$. What is the number?'
            answer: "70806"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parts are $7$ ten-thousands, $8$ hundreds and $6$ ones. The thousands and tens places have no part, so each holds $0$, and the number is $70806$.'
          - problem: 'What is the value of the $5$ in $52\,801$?'
            answer: "50000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $5$ sits in the ten-thousands place. So its value is $5 \times 10000 = 50000$.'
          - problem: 'In $63\,041$, what value does the digit $3$ represent?'
            answer: "3000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $3$ sits in the thousands place. So its value is $3 \times 1000 = 3000$.'
          - problem: 'A stadium holds $41\,620$ people. The digit $4$ stands for how many people?'
            answer: "40000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $4$ sits in the ten-thousands place. So it stands for $4 \times 10000 = 40000$ people.'
          - problem: 'A warehouse has $2$ crates of $10\,000$ bolts, $3$ crates of $100$ bolts and $5$ single bolts. How many bolts is that in all?'
            answer: "20305"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The big crates hold $2 \times 10000 = 20000$ bolts and the small crates hold $3 \times 100 = 300$ bolts. With the $5$ single bolts the total is $20000 + 300 + 5 = 20305$ bolts.'
          - problem: 'Mia writes the number $60000+400+9$ as $6449$. What is the correct number?'
            answer: "60409"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Mia wrote the digits side by side and left out the zeros. The thousands and tens places have no part, so each holds $0$, and the number is $60409$.'
          - problem: 'The number $30\,208$ is written as $30000+\square+8$. What is the missing term?'
            answer: "200"
            answer_contract: {"kind":"exact"}
