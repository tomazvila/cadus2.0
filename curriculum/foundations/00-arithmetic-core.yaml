  - id: comparing-ordering-whole-numbers
    name: Comparing and Ordering Whole Numbers
    core: true
    difficulty: 0.1
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: place-value
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: Compare two numbers
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Which is larger, $4562$ or $4652$?'
            answer: "4652"
            solution_sketch: 'Same thousands digit; compare hundreds: $6 > 5$.'
          - problem: 'Which is smaller, $389$ or $401$?'
            answer: "389"
            solution_sketch: 'Same digit count (three); compare hundreds: $3 < 4$, so $389 < 401$.'
          - problem: 'Between $6284$ and $6248$, which number is larger?'
            answer: "6284"
            solution_sketch: 'Digits match up to position 3; there $8 > 4$ decides it.'
          - problem: 'Which is larger, $512$ or $4999$?'
            answer: "4999"
            solution_sketch: '$4999$ has more digits than $512$, so it is larger.'
        constraints: "numbers up to 5 digits, same or different digit counts"
      - id: kp2
        name: Order a list of numbers
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Order from least to greatest: $315$, $351$, $153$.'
            answer: "153, 315, 351"
            solution_sketch: 'Comparing hundreds then tens: $153 < 315 < 351$.'
          - problem: 'Which is greatest: $2087$, $2870$, or $2078$?'
            answer: "2870"
            solution_sketch: 'All three share the thousands digit $2$; comparing hundreds digits ($0$, $8$, $0$), $2870$ has the largest and is greatest.'
          - problem: 'Order from least to greatest: $5316$, $5361$, $5136$.'
            answer: "5136, 5316, 5361"
            solution_sketch: 'Comparing place by place: $5136 < 5316 < 5361$.'
          - problem: 'Order from least to greatest: $712$, $89$, $1205$, $698$.'
            answer: "89, 698, 712, 1205"
            solution_sketch: 'Comparing place by place: $89 < 698 < 712 < 1205$.'
        constraints: "3-4 numbers, up to 4 digits"
    diagnostic_exemplar:
      problem: 'Order from least to greatest: $4071$, $4710$, $4017$.'
      answer: '4017, 4071, 4710'
      solution_sketch: 'All three have four digits, so compare place by place from the left.'
    anki_seeds:
      - front: "To compare two whole numbers with the same number of digits, compare digits..."
        back: "from left to right; the first place where they differ decides"
        type: basic
      - front: "A whole number with more digits than another is always..."
        back: "larger (e.g. 1,000 > 999)"
        type: basic

  - id: rounding-whole-numbers
    name: Rounding Whole Numbers
    core: true
    difficulty: 0.12
    drill: false
    answer_kind: numeric
    expected_time_secs: 35
    prerequisites:
      - id: place-value
        weight: 0.8
