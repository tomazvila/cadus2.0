    core: true
    difficulty: 0.3
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: expressions-with-parentheses
        weight: 0.8
        key: true
      - id: whole-number-exponents
        weight: 0.7
        key: true
      - id: division-facts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Multiply and divide before add and subtract
        key_prerequisites: [division-facts]
        exemplars:
          - problem: 'Compute $3 + 4 \times 5$.'
            answer: "23"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply first: $4 \times 5 = 20$, then $3 + 20 = 23$.'
          - problem: 'Compute $20 - 12 \div 4$.'
            answer: "17"
            answer_contract: {"kind":"exact"}
        constraints: "single-digit operands, no parentheses"
      - id: kp2
        name: Exponents in the order of operations
        key_prerequisites: [whole-number-exponents]
        exemplars:
          - problem: 'Compute $2 + 3^2 \times 4$.'
            answer: "38"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$3^2 = 9$; $9 \times 4 = 36$; $2 + 36 = 38$.'
          - problem: 'Compute $5 \times 2^3 - 7$.'
            answer: "33"
            answer_contract: {"kind":"exact"}
        constraints: "one exponent, small bases"
      - id: kp3
        name: Full expressions with grouping
        key_prerequisites: [expressions-with-parentheses]
        exemplars:
          - problem: 'Compute $48 \div 6 + 2 \times 5$.'
            answer: "18"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$48 \div 6 = 8$ and $2 \times 5 = 10$, then $8 + 10 = 18$.'
          - problem: 'Compute $(5 + 3) \times 2 - 4^2$.'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$8 \times 2 = 16$; $4^2 = 16$; $16 - 16 = 0$.'
          - problem: 'Compute $36 \div (9 - 3)^2$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
        constraints: "3-4 operations mixing parentheses, exponents, +, -, x, /"
    diagnostic_exemplar:
      problem: 'Compute $(4 + 2) \times 3 - 2^3$.'
      answer: "10"
      solution_sketch: 'Parentheses, then the power: $6 \times 3 - 8 = 18 - 8 = 10$.'
    anki_seeds:
      - front: "State the order of operations (PEMDAS)."
        back: "Parentheses, Exponents, Multiplication/Division (left to right), Addition/Subtraction (left to right)"
        type: basic

  # --------------------------------------------------------------------- #
  # Number theory
  # --------------------------------------------------------------------- #
  - id: factors-and-multiples
    name: Factors and Multiples
    core: true
    difficulty: 0.15
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: multiplication-tables
        weight: 0.8
        key: true
      - id: division-facts
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Listing factors
        key_prerequisites: [division-facts]
        exemplars:
          - problem: 'List all the factors of $12$.'
            answer: "1, 2, 3, 4, 6, 12"
            solution_sketch: 'Factor pairs: $1 \times 12$, $2 \times 6$, $3 \times 4$.'
          - problem: 'List all the factors of $18$.'
            answer: "1, 2, 3, 6, 9, 18"
        constraints: "numbers up to 50"
      - id: kp2
        name: Listing multiples
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'List the first four multiples of $6$.'
            answer: "6, 12, 18, 24"
          - problem: 'List the first three multiples of $9$.'
            answer: "9, 18, 27"
        constraints: "base 2-12, first 3-5 multiples"
      - id: kp3
        name: Factor or multiple?
        key_prerequisites: [division-facts]
        exemplars:
          - problem: 'Is $7$ a factor of $84$? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$84 = 7 \times 12$.'
          - problem: 'Is $51$ a multiple of $3$? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$3 \times 17 = 51$.'
        constraints: "numbers up to 100"
    diagnostic_exemplar:
      problem: 'List all the factors of $20$ that are also multiples of $4$.'
      answer: '4, 20'
      solution_sketch: 'Factors of $20$: $1, 2, 4, 5, 10, 20$; of these only $4$ and $20$ are multiples of $4$.'
    anki_seeds:
      - front: "6 is a factor of 42; equivalently, 42 is a ... of 6."
        back: "multiple"
        type: basic

  - id: divisibility-rules
    name: Divisibility Rules
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: expression
    expected_time_secs: 35
    prerequisites:
      - id: factors-and-multiples
        weight: 0.6
        key: true
      - id: division-facts
        weight: 0.4
      - id: long-division-one-digit
        weight: 0.0            # conceptual-only: divisibility rules AVOID doing the division
    knowledge_points:
      - id: kp1
        name: Rules for 2, 5, and 10
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'Is $470$ divisible by $5$? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'It ends in $0$, so it is divisible by $5$ (and by $10$).'
          - problem: 'Is $384$ divisible by $2$? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
        constraints: "3-digit numbers"
      - id: kp2
        name: Rules for 3 and 9 (digit sums)
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'Is $471$ divisible by $3$? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$4 + 7 + 1 = 12$, which is divisible by $3$.'
          - problem: 'Is $522$ divisible by $9$? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$5 + 2 + 2 = 9$, which is divisible by $9$.'
        constraints: "3-digit numbers"
      - id: kp3
        name: Rules for 4 and 6
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'Is $316$ divisible by $4$? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The last two digits, $16$, form a multiple of $4$.'
          - problem: 'Is $234$ divisible by $6$? (yes/no)'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'It is even AND $2 + 3 + 4 = 9$ is divisible by $3$, so divisible by $6$.'
        constraints: "3-digit numbers"
    diagnostic_exemplar:
      problem: 'Is $438$ divisible by $6$? (yes/no)'
      answer_contract: {kind: label, options: [[yes], [no]]}
      answer: "yes"
      solution_sketch: 'Divisible by $6$ means divisible by both $2$ and $3$: $438$ is even and $4 + 3 + 8 = 15$ is a multiple of $3$.'
    anki_seeds:
      - front: "A number is divisible by 3 if..."
        back: "the sum of its digits is divisible by 3"
        type: basic
      - front: "A number is divisible by 9 if..."
        back: "the sum of its digits is divisible by 9"
        type: basic
      - front: "A number is divisible by 4 if..."
        back: "the number formed by its last two digits is divisible by 4"
        type: basic

  - id: prime-composite-numbers
    name: Prime and Composite Numbers
    core: true
    difficulty: 0.18
    drill: false
    answer_kind: expression
    expected_time_secs: 40
    prerequisites:
      - id: factors-and-multiples
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: Classifying numbers as prime or composite
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'Is $17$ prime or composite?'
            answer: "prime"
            answer_contract: {"kind":"label","options":[["prime"],["composite"]]}
          - problem: 'Is $21$ prime or composite?'
            answer: "composite"
            answer_contract: {"kind":"label","options":[["prime"],["composite"]]}
            solution_sketch: '$21 = 3 \times 7$, so it has factors other than $1$ and itself.'
        constraints: "numbers 2-50"
      - id: kp2
        name: Knowing the small primes
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'List all the primes between $10$ and $20$.'
            answer: "11, 13, 17, 19"
          - problem: 'What is the smallest prime greater than $30$?'
            answer: "31"
        constraints: "primes below 50"
      - id: kp3
        name: Edge cases
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'Is $1$ prime? (yes/no)'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$1$ is neither prime nor composite.'
          - problem: 'What is the only even prime number?'
            answer: "2"
            solution_sketch: 'Every other even number is divisible by $2$ itself, so it is composite; $2$ alone is prime.'
          - problem: 'Is $0$ prime, composite, or neither?'
            answer: "neither"
            answer_contract: {"kind":"label","options":[["prime"],["composite"],["neither"]]}
            solution_sketch: '$0$ has no defined factorization into primes, so it is neither.'
          - problem: 'Is $2$ prime or composite?'
            answer: "prime"
            answer_contract: {"kind":"label","options":[["prime"],["composite"]]}
            solution_sketch: '$2$ has no factors besides $1$ and itself.'
        constraints: "the numbers 0, 1, 2 and even numbers"
    diagnostic_exemplar:
      problem: 'List all the primes less than $10$.'
      answer: '2, 3, 5, 7'
      solution_sketch: '$1$ is not prime; $2$ is the only even prime; $4$, $6$, $8$ and $9$ are composite.'
    anki_seeds:
      - front: "A prime number is..."
        back: "a whole number greater than 1 whose only factors are 1 and itself"
        type: basic
      - front: "Is 1 prime, composite, or neither?"
        back: "neither"
        type: basic
      - front: "The only even prime number is..."
        back: "2"
        type: basic

  - id: prime-factorization
    name: Prime Factorization
    core: true
    difficulty: 0.3
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: divisibility-rules
        weight: 0.6
        key: true
      - id: prime-composite-numbers
        weight: 0.7
        key: true
      - id: long-division-one-digit
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Factoring small numbers
        key_prerequisites: [prime-composite-numbers]
        exemplars:
          - problem: 'Write the prime factorization of $12$.'
            answer: "2 x 2 x 3"
            solution_sketch: '$12 = 4 \times 3 = 2 \times 2 \times 3$, i.e. $2^2 \times 3$.'
          - problem: 'Write the prime factorization of $18$.'
            answer: "2 x 3 x 3"
        constraints: "numbers 4-30; give the product of primes"
      - id: kp2
        name: Factor trees for larger numbers
        key_prerequisites: [divisibility-rules]
        exemplars:
          - problem: 'Write the prime factorization of $60$.'
            answer: "2 x 2 x 3 x 5"
          - problem: 'Write the prime factorization of $84$.'
            answer: "2 x 2 x 3 x 7"
            solution_sketch: '$84 = 4 \times 21 = 2 \times 2 \times 3 \times 7$.'
        constraints: "numbers 30-100"
      - id: kp3
        name: Repeated prime factors
        key_prerequisites: [divisibility-rules]
        exemplars:
          - problem: 'Write the prime factorization of $72$.'
            answer: "2 x 2 x 2 x 3 x 3"
            solution_sketch: '$72 = 8 \times 9 = 2^3 \times 3^2$.'
          - problem: 'Write the prime factorization of $100$.'
            answer: "2 x 2 x 5 x 5"
        constraints: "numbers with repeated factors, up to 150"
    diagnostic_exemplar:
      problem: 'Write the prime factorization of $90$.'
      answer: '2 x 3 x 3 x 5'
      solution_sketch: '$90 = 9 \times 10 = 3 \times 3 \times 2 \times 5$.'
    anki_seeds:
      - front: "The Fundamental Theorem of Arithmetic: every whole number greater than 1 has..."
        back: "exactly one prime factorization (up to the order of the factors)"
        type: basic

  - id: greatest-common-factor
    name: Greatest Common Factor
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: factors-and-multiples
        weight: 0.9
        key: true
      - id: division-facts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: GCF by listing factors
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'Find the GCF of $12$ and $18$.'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Factors of $12$: $1,2,3,4,6,12$; of $18$: $1,2,3,6,9,18$; largest common is $6$.'
          - problem: 'Find the GCF of $8$ and $20$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
        constraints: "two numbers up to 30"
      - id: kp2
        name: GCF of larger pairs
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'Find the GCF of $24$ and $36$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
          - problem: 'Find the GCF of $30$ and $45$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
        constraints: "two numbers up to 60"
      - id: kp3
        name: Relatively prime pairs and factor pairs
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'Find the GCF of $9$ and $16$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'They share no common factor besides $1$: relatively prime.'
          - problem: 'Find the GCF of $7$ and $35$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
        constraints: "include GCF 1 and one-number-divides-the-other cases"
    diagnostic_exemplar:
      problem: 'Find the GCF of $42$ and $56$.'
      answer: '14'
      solution_sketch: '$42 = 2 \times 3 \times 7$ and $56 = 2 \times 2 \times 2 \times 7$; the common part is $2 \times 7 = 14$.'
    anki_seeds:
      - front: "Two numbers whose GCF is 1 are called..."
        back: "relatively prime (coprime)"
        type: basic

  - id: least-common-multiple
    name: Least Common Multiple
    core: true
    difficulty: 0.25
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: factors-and-multiples
        weight: 0.9
        key: true
      - id: multiplication-tables
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: LCM by listing multiples
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'Find the LCM of $4$ and $6$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiples of $4$: $4, 8, 12, \dots$; of $6$: $6, 12, \dots$; first common is $12$.'
          - problem: 'Find the LCM of $3$ and $5$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
        constraints: "two numbers up to 12"
      - id: kp2
        name: Special cases
        key_prerequisites: [factors-and-multiples]
        exemplars:
          - problem: 'Find the LCM of $6$ and $18$.'
            answer: "18"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$18$ is already a multiple of $6$.'
          - problem: 'Find the LCM of $5$ and $7$.'
            answer: "35"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'No common factors, so the LCM is the product $5 \times 7$.'
        constraints: "one number divides the other, or the pair is relatively prime"
      - id: kp3
        name: LCM of three numbers
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Find the LCM of $2$, $3$, and $4$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
          - problem: 'Find the LCM of $3$, $4$, and $6$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
        constraints: "three numbers up to 10"
    diagnostic_exemplar:
      problem: 'Find the LCM of $4$, $6$, and $9$.'
      answer: '36'
      solution_sketch: 'LCM$(4, 6) = 12$, then LCM$(12, 9) = 36$.'
    anki_seeds:
      - front: "If two numbers share no common factor besides 1, their LCM equals..."
        back: "their product"
        type: basic
      - front: "If a divides b, then LCM(a, b) equals..."
        back: "b"
        type: basic

  - id: gcf-lcm
    name: Greatest Common Factor and Least Common Multiple
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 90
    prerequisites:
      - id: greatest-common-factor
        weight: 0.8
        key: true
      - id: least-common-multiple
        weight: 0.8
        key: true
      - id: prime-factorization
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: GCF via prime factorization
        key_prerequisites: [prime-factorization]
        exemplars:
          - problem: 'Find the GCF of $45$ and $60$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$45 = 3^2 \times 5$, $60 = 2^2 \times 3 \times 5$; common part $3 \times 5 = 15$.'
          - problem: 'Find the GCF of $72$ and $120$.'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$72 = 2^3 \times 3^2$, $120 = 2^3 \times 3 \times 5$; $2^3 \times 3 = 24$.'
        constraints: "two numbers 40-150 where listing factors is slow"
      - id: kp2
        name: LCM via prime factorization
        key_prerequisites: [prime-factorization]
        exemplars:
          - problem: 'Find the LCM of $8$ and $12$.'
            answer: "24"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$8 = 2^3$, $12 = 2^2 \times 3$; $\text{LCM} = 2^3 \times 3 = 24$.'
          - problem: 'Find the LCM of $9$ and $15$.'
            answer: "45"
            answer_contract: {"kind":"exact"}
          - problem: 'Find the LCM of $12$ and $18$.'
            answer: "36"
            answer_contract: {"kind":"exact"}
        constraints: "two numbers up to 60; highest power of each prime"
      - id: kp3
        name: GCF and LCM in applications
        key_prerequisites: [greatest-common-factor]
        exemplars:
          - problem: 'One bus leaves every $12$ minutes and another every $18$ minutes. They leave together at 9:00. In how many minutes do they next leave together?'
            answer: "36"
            solution_sketch: '$\text{LCM}(12, 18) = 36$.'
          - problem: 'What is the side length of the largest square tile that exactly covers a $24$ by $36$ floor?'
            answer: "12"
            solution_sketch: '$\text{GCF}(24, 36) = 12$.'
          - problem: 'One machine cycles every $8$ minutes and another every $10$ minutes. They start together. In how many minutes do they start together again?'
            answer: "40"
            solution_sketch: '$\text{LCM}(8, 10) = 40$.'
          - problem: 'What is the side length of the largest square tile that exactly covers an $18$ by $30$ floor?'
            answer: "6"
            solution_sketch: '$\text{GCF}(18, 30) = 6$.'
        constraints: "recognize whether the situation needs the GCF or the LCM"
    diagnostic_exemplar:
      problem: 'A gardener has $84$ tulips and $126$ daffodils and makes identical bunches with no flowers left over. What is the greatest number of bunches?'
      answer: '42'
      solution_sketch: '$84 = 2^2 \times 3 \times 7$ and $126 = 2 \times 3^2 \times 7$, so the GCF is $2 \times 3 \times 7 = 42$.'
    anki_seeds:
      - front: "From prime factorizations, the GCF is found by multiplying..."
        back: "the primes common to both numbers, each to its lowest power"
        type: basic
      - front: "From prime factorizations, the LCM is found by multiplying..."
        back: "every prime that appears in either number, each to its highest power"
        type: basic
      - front: "For any two positive whole numbers a and b, GCF(a,b) x LCM(a,b) equals..."
        back: "a x b"
        type: basic

  - id: rounding-estimation
    name: Rounding and Estimation
    core: false                # estimation leaf; heads the terminal estimation branch
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 50
    prerequisites:
      - id: rounding-whole-numbers
        weight: 0.9
        key: true
      - id: multi-digit-addition-subtraction
        weight: 0.4
      - id: multiplying-by-one-digit
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Estimating sums and differences
        key_prerequisites: [rounding-whole-numbers]
        exemplars:
          - problem: 'Estimate $68 + 21$ by rounding each number to the nearest ten.'
            answer: "90"
            solution_sketch: '$70 + 20 = 90$.'
          - problem: 'Estimate $412 - 189$ by rounding each number to the nearest hundred.'
            answer: "200"
        constraints: "2-3 digit operands; answer is the rounded estimate"
      - id: kp2
        name: Estimating products and quotients
        key_prerequisites: [multiplying-by-one-digit]
        exemplars:
          - problem: 'Estimate $49 \times 31$ by rounding each factor to the nearest ten.'
            answer: "1500"
            solution_sketch: '$50 \times 30 = 1500$.'
          - problem: 'Estimate $358 \div 6$ using the compatible numbers $360$ and $6$.'
            answer: "60"
        constraints: "round to compatible numbers; answer is the estimate"
      - id: kp3
        name: Judging reasonableness
        key_prerequisites: [multi-digit-addition-subtraction]
        exemplars:
          - problem: 'Without computing exactly, is $297 + 304$ closer to $600$ or to $700$?'
            answer: "600"
            solution_sketch: '$297 \approx 300$ and $304 \approx 300$; the exact sum is $601$.'
          - problem: 'Ellie estimates $42 \times 19$ as $42 \times 20 = 840$. Is the exact product larger or smaller than $840$?'
            answer: "smaller"
            solution_sketch: 'She rounded a factor up, so $840$ is an overestimate ($42 \times 19 = 798$).'
        constraints: "answer chooses between options or over/under"
    diagnostic_exemplar:
      problem: 'Estimate $62 \times 38$ by rounding each factor to the nearest ten.'
      answer: "2400"
      solution_sketch: 'Round to $60$ and $40$: $60 \times 40 = 2{,}400$.'
    anki_seeds:
      - front: "If you round both factors UP before multiplying, your estimate is guaranteed to be..."
        back: "an overestimate of the true product"
        type: basic
