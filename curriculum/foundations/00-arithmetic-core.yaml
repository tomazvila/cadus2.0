            answer: "12"
            answer_contract: {"kind":"exact"}
        constraints: "one set of parentheses, single-digit operands"
      - id: kp2
        name: Parentheses change the value
        key_prerequisites: [multi-digit-addition-subtraction]
        exemplars:
          - problem: 'Compute $10 - (4 - 2)$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $(10 - 4) - 2$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Grouping matters: $10 - (4 - 2) = 8$ but $(10 - 4) - 2 = 4$.'
        constraints: "same numbers grouped differently"
      - id: kp3
        name: Translating words into grouped expressions
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Evaluate: multiply the sum of $7$ and $5$ by $3$.'
            answer: "36"
            solution_sketch: '$(7 + 5) \times 3 = 12 \times 3 = 36$.'
          - problem: 'Evaluate: twice the difference of $9$ and $4$.'
            answer: "10"
            solution_sketch: '$2 \times (9 - 4) = 2 \times 5 = 10$.'
          - problem: 'Evaluate: multiply the difference of $12$ and $5$ by $4$.'
            answer: "28"
            solution_sketch: '$(12 - 5) \times 4 = 28$.'
          - problem: 'Evaluate: half the sum of $8$ and $6$.'
            answer: "7"
            solution_sketch: '$(8 + 6) \div 2 = 7$.'
        constraints: "verbal description of one grouped operation"
    diagnostic_exemplar:
      problem: 'Evaluate: multiply the sum of $4$ and $5$ by $3$.'
      answer: "27"
      solution_sketch: 'The sum inside comes first: $(4 + 5) \times 3 = 9 \times 3 = 27$.'
    anki_seeds:
      - front: "In any numerical expression, the part evaluated first is..."
        back: "whatever is inside parentheses (innermost first)"
        type: basic

  - id: order-of-operations
