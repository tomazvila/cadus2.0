          - problem: 'Compute $23 \times 45$.'
            answer: '1035'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split $45$ into $40$ and $5$. Then $23 \times 40 = 920$ and $23 \times 5 = 115$, and $920 + 115 = 1035$.'
          - problem: 'A parking garage has $68$ levels with $24$ spaces on each level. How many spaces does the garage have in total?'
            answer: '1632'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each of the $68$ levels has $24$ spaces, so multiply. Split $24$ into $20$ and $4$. Then $68 \times 20 = 1360$ and $68 \times 4 = 272$, and $1360 + 272 = 1632$.'
          - problem: 'Sam works out $47 \times 23$ as $47 \times 20 + 3 = 943$. What is the correct value of $47 \times 23$?'
            answer: '1081'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam multiplied only the tens part and added the ones digit $3$ without multiplying it. The ones part is $47 \times 3 = 141$, and $47 \times 20 = 940$, so $940 + 141 = 1081$.'
          - problem: 'Evaluate $82 \times 19$.'
            answer: '1558'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split $19$ into $10$ and $9$. Then $82 \times 10 = 820$ and $82 \times 9 = 738$, and $820 + 738 = 1558$.'
          - problem: 'A cinema hall has $38$ rows with $45$ seats in each row. How many seats does the hall have?'
            answer: '1710'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every row has the same number of seats, so multiply. Split $38$ into $30$ and $8$. Then $45 \times 30 = 1350$ and $45 \times 8 = 360$, and $1350 + 360 = 1710$.'
          - problem: 'What is $57 \times 36$?'
            answer: '2052'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split $36$ into $30$ and $6$. Then $57 \times 30 = 1710$ and $57 \times 6 = 342$, and $1710 + 342 = 2052$.'
          - problem: 'Each of $27$ shelves holds $36$ books. How many books do the shelves hold?'
            answer: '972'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each shelf holds the same number of books, so multiply. Split $27$ into $20$ and $7$. Then $36 \times 20 = 720$ and $36 \times 7 = 252$, and $720 + 252 = 972$.'
          - problem: 'A school buys $24$ theatre tickets at $35$ dollars each. How much does the school pay?'
            answer: '840'
            answer_contract: {"kind":"unit","quantity":"dollar","unit":"dollar","allow_omitted":true}
            solution_sketch: 'Every ticket costs the same, so multiply. Split $35$ into $30$ and $5$. Then $24 \times 30 = 720$ and $24 \times 5 = 120$, and $720 + 120 = 840$ dollars.'
          - problem: 'A path is laid with $52$ slabs end to end. Each slab is $48$ cm long. How long is the path?'
            answer: '2496'
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
