        exemplars:
          - problem: 'Compute $56 \times 34$ using partial products.'
            answer: '1904'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split both numbers into tens and ones: $50 \times 30 = 1500$, $50 \times 4 = 200$, $6 \times 30 = 180$ and $6 \times 4 = 24$. The sum is $1500 + 200 + 180 + 24 = 1904$.'
          - problem: 'Compute $41 \times 29$ and check that the answer is close to $40 \times 30$.'
            answer: '1189'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The estimate is $40 \times 30 = 1200$. The exact product is $41 \times 29 = 1189$, which is close to $1200$.'
          - problem: 'Break $37 \times 52$ into partial products to find the total.'
            answer: '1924'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split $52$ into $50$ and $2$: $37 \times 50 = 1850$ and $37 \times 2 = 74$. Add the partial products: $1850 + 74 = 1924$.'
          - problem: 'Mia finds that $73 \times 46 = 33\,580$. Use the estimate $70 \times 50$ to see whether this can be right. What is the correct product?'
            answer: '3358'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The estimate is $70 \times 50 = 3500$, so $33580$ is about ten times too large. The exact product is $73 \times 40 = 2920$ plus $73 \times 6 = 438$, which is $2920 + 438 = 3358$.'
          - problem: 'A stadium has $38$ sections with $62$ seats in each section. Estimate the number of seats by rounding to $40$ and $60$, then find the exact number.'
            answer: '2356'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The estimate is $40 \times 60 = 2400$. For the exact number, $38 \times 60 = 2280$ and $38 \times 2 = 76$, so $2280 + 76 = 2356$, which is close to the estimate.'
          - problem: 'A baker sells $27$ loaves a day. Estimate the number of loaves sold in $83$ days by rounding, then find the exact number.'
            answer: '2241'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The estimate is $30 \times 80 = 2400$. For the exact number, $27 \times 80 = 2160$ and $27 \times 3 = 81$, so $2160 + 81 = 2241$, close to the estimate.'
          - problem: 'Which of $2000$, $2500$ and $3000$ is closest to $48 \times 52$?'
            answer: '2500'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Round the factors: $48$ is close to $50$ and $52$ is close to $50$. Then $50 \times 50 = 2500$, so $2500$ is the closest of the three.'
          - problem: 'Compute $63 \times 48$. First estimate it as $60 \times 50$ to know the size of the answer.'
            answer: '3024'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The estimate is $60 \times 50 = 3000$. The exact product is $63 \times 40 = 2520$ plus $63 \times 8 = 504$, so $2520 + 504 = 3024$, close to the estimate.'
        constraints: '2-digit x 2-digit, with partial products or an estimate as the check'
    diagnostic_exemplar:
