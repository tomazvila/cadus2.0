  - id: division-with-remainders
    name: Division with Remainders
    core: true
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: division-facts
        weight: 0.9
        key: true
      - id: subtraction-facts
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Quotient and remainder
        key_prerequisites: [division-facts]
        exemplars:
          - problem: 'Compute $47 \div 5$. Give quotient and remainder.'
            answer: "9 R2"
            answer_contract: {kind: quotient_remainder, divisor: 5}
            solution_sketch: '$5 \times 9 = 45$, remainder $47 - 45 = 2$.'
          - problem: 'Divide $26$ by $4$ and state the quotient and remainder.'
            answer: "6 R2"
            answer_contract: {kind: quotient_remainder, divisor: 4}
            solution_sketch: '$4 \times 6 = 24$, remainder $26 - 24 = 2$.'
          - problem: 'Compute $53 \div 6$. Give quotient and remainder.'
            answer: "8 R5"
            answer_contract: {"kind":"quotient_remainder","divisor":6}
            solution_sketch: '$6 \times 8 = 48$, remainder $53 - 48 = 5$.'
          - problem: 'Compute $71 \div 9$. Give quotient and remainder.'
            answer: "7 R8"
            answer_contract: {"kind":"quotient_remainder","divisor":9}
            solution_sketch: '$9 \times 7 = 63$, remainder $71 - 63 = 8$.'
        constraints: "2-digit dividend, 1-digit divisor, nonzero remainder; answer as 'q Rr'"
      - id: kp2
        name: Checking with divisor x quotient + remainder
        key_prerequisites: [division-facts]
        exemplars:
          - problem: 'Compute $38 \div 7$ and verify your answer.'
            answer: "5 R3"
            answer_contract: {kind: quotient_remainder, divisor: 7}
            solution_sketch: '$7 \times 5 = 35$ and $35 + 3 = 38$.'
          - problem: 'Compute $50 \div 6$. Give quotient and remainder.'
            answer: "8 R2"
            answer_contract: {kind: quotient_remainder, divisor: 6}
            solution_sketch: '$6 \times 8 = 48$, remainder $50 - 48 = 2$.'
          - problem: 'Compute $44 \div 9$. Give quotient and remainder.'
            answer: "4 R8"
            answer_contract: {"kind":"quotient_remainder","divisor":9}
            solution_sketch: '$9 \times 4 = 36$, remainder $44 - 36 = 8$.'
          - problem: 'Compute $61 \div 8$. Give quotient and remainder.'
            answer: "7 R5"
            answer_contract: {"kind":"quotient_remainder","divisor":8}
            solution_sketch: '$8 \times 7 = 56$, remainder $61 - 56 = 5$.'
        constraints: "remainder strictly smaller than the divisor"
      - id: kp3
        name: Remainders in context
        key_prerequisites: [subtraction-facts]
        exemplars:
          - problem: '$23$ apples are packed in bags of $4$. How many full bags are packed?'
            answer: "5"
            solution_sketch: '$23 \div 4 = 5$ R$3$; only full bags count, so $5$.'
          - problem: '$31$ students ride in cars that hold $4$ each. How many cars are needed?'
            answer: "8"
            solution_sketch: '$31 \div 4 = 7$ R$3$; the $3$ leftover students still need a car, so $8$.'
          - problem: '$50$ pencils are packed in boxes of $6$. How many full boxes are packed?'
            answer: "8"
            solution_sketch: '$50 \div 6 = 8$ R$2$; only full groups count, so $8$.'
          - problem: '$45$ people ride in vans that hold $6$ each. How many vans are needed?'
            answer: "8"
            solution_sketch: '$6 \times 7 = 42$ leaves $3$ over, so round the quotient up to $8$.'
        constraints: "context decides whether to drop or round up the remainder"
    diagnostic_exemplar:
      problem: 'Egg boxes hold $6$ eggs each. How many boxes are needed to hold $40$ eggs?'
      answer: "7"
      solution_sketch: '$40 \div 6 = 6$ remainder $4$; the leftover eggs still need a box, so round up to $7$.'
    anki_seeds:
      - front: "To check a division a / b = q remainder r, verify that..."
        back: "b x q + r = a"
        type: basic
      - front: "In a valid division with remainder, the remainder must always be..."
        back: "smaller than the divisor"
        type: basic

