unit: arithmetic-core
course: foundations
module: "Arithmetic"
topics:
  # --------------------------------------------------------------------- #
  # Mastery-floor roots (kept minimal at 2 KPs each; no prerequisites).
  # --------------------------------------------------------------------- #
  - id: single-digit-addition
    name: Single-Digit Addition
    core: true
    difficulty: 0.05
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites: []          # mastery-floor root
    knowledge_points:
      - id: kp1
        name: Sums within ten
        exemplars:
          - problem: 'Compute $3 + 4$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$4 + 3 = 7$.'
          - problem: 'A box has $6$ red pens and $2$ blue pens. How many pens in total?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$6 + 2 = 8$.'
          - problem: '$5 + 4 = \square$. Find $\square$.'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$5 + 4 = 9$.'
          - problem: 'Evaluate $2 + 8$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Make ten: $8 + 2 = 10$.'
        constraints: "both addends 0-9, sum <= 10"
      - id: kp2
        name: Sums within twenty (bridging ten)
        exemplars:
          - problem: 'Compute $8 + 7$.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Make ten: $8 + 2 = 10$, then + $5 = 15$.'
          - problem: 'Liam has $9$ toy cars and gets $6$ more. How many cars does he have now?'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Make ten: $9 + 1 = 10$, then $+ 5$ more gives $15$.'
          - problem: '$7 + 5 = \square$. Find $\square$.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Make ten: $7 + 3 = 10$, then $+ 2$ more gives $12$.'
          - problem: 'Evaluate $9 + 9$.'
            answer: "18"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Make ten: $9 + 1 = 10$, then $+ 8$ more gives $18$.'
        constraints: "both addends 0-9, sum 11-18"
    diagnostic_exemplar:
      problem: 'Compute $8 + 5$.'
      answer: "13"
      solution_sketch: 'Make ten: $8 + 2 = 10$, with $3$ of the $5$ left over, so $10 + 3 = 13$.'
    anki_seeds:
      - front: "Make-ten strategy: to add 8 + 5, first take 2 from the 5 to make 8 into..."
        back: "10, leaving 3 more: 10 + 3 = 13"
        type: basic

  - id: subtraction-facts
    name: Subtraction Facts
    core: true
    difficulty: 0.07
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites:
      - id: single-digit-addition
        weight: 1.0
        key: true
    knowledge_points:
      - id: kp1
        name: Differences within ten
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'Compute $9 - 4$.'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count back from $9$: $9, 8, 7, 6, 5$.'
          - problem: 'A basket has $7$ apples. If $3$ are eaten, how many are left?'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count back from $7$: $7, 6, 5, 4$.'
          - problem: '$10 - 6 = \square$. Find $\square$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count back from $10$: $10, 9, 8, 7, 6, 5, 4$.'
          - problem: 'Evaluate $8 - 8$.'
            answer: "0"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Count back from $8$ by $8$: $8 - 8 = 0$.'
        constraints: "minuend 0-10, nonnegative difference"
      - id: kp2
        name: Differences from the teens (bridging ten)
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'Compute $15 - 8$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Back through ten: $15 - 5 = 10$, then $- 3$ more gives $7$.'
          - problem: 'A parking lot has $13$ cars. If $6$ drive away, how many remain?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Back through ten: $13 - 3 = 10$, then $- 3$ more gives $7$.'
          - problem: '$14 - 6 = \square$. Find $\square$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Back through ten: $14 - 4 = 10$, then $- 2$ more gives $8$.'
          - problem: 'Evaluate $17 - 9$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Back through ten: $17 - 7 = 10$, then $- 2$ more gives $8$.'
        constraints: "minuend 11-18, subtrahend 2-9"
    diagnostic_exemplar:
      problem: 'Compute $13 - 7$.'
      answer: "6"
      solution_sketch: 'Bridge ten: $13 - 3 = 10$, then $10 - 4 = 6$.'
    anki_seeds:
      - front: "Every addition fact gives two subtraction facts: from 8 + 5 = 13 we get..."
        back: "13 - 5 = 8 and 13 - 8 = 5"
        type: basic

  - id: multiplication-tables
    name: Multiplication Tables
    core: true
    difficulty: 0.1
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites: []          # mastery-floor root
    knowledge_points:
      - id: kp1
        name: Facts through 10 x 10
        exemplars:
          - problem: 'Compute $6 \times 7$.'
            answer: "42"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$6 \times 7 = 6 \times 5 + 6 \times 2 = 30 + 12 = 42$.'
          - problem: 'A classroom has $8$ rows of $4$ desks. How many desks in total?'
            answer: "32"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$8 \times 4 = 8 \times 2 \times 2 = 16 \times 2 = 32$.'
          - problem: '$9 \times 6 = \square$. Find $\square$.'
            answer: "54"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$9 \times 6 = 10 \times 6 - 6 = 60 - 6 = 54$.'
          - problem: 'Evaluate $10 \times 10$.'
            answer: "100"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying by $10$ appends one zero to $10$: $10 \times 10 = 100$.'
        constraints: "both factors 0-10"
      - id: kp2
        name: Facts with 11 and 12
        exemplars:
          - problem: 'Compute $12 \times 7$.'
            answer: "84"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$7 \times 10 = 70$, $7 \times 2 = 14$; $70 + 14 = 84$.'
          - problem: 'A theater has $11$ rows with $8$ seats in each row. How many seats in total?'
            answer: "88"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$8 \times 10 = 80$, $8 \times 1 = 8$; $80 + 8 = 88$.'
          - problem: '$12 \times 12 = \square$. Find $\square$.'
            answer: "144"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$12 \times 10 = 120$, $12 \times 2 = 24$; $120 + 24 = 144$.'
          - problem: 'Evaluate $11 \times 2$.'
            answer: "22"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$2 \times 10 = 20$, $2 \times 1 = 2$; $20 + 2 = 22$.'
        constraints: "one factor 11 or 12, the other 2-12"
    diagnostic_exemplar:
      problem: 'Compute $12 \times 6$.'
      answer: "72"
      solution_sketch: 'Split the $12$: $10 \times 6 + 2 \times 6 = 60 + 12 = 72$.'
    anki_seeds:
      - front: "Nines trick: for 9 x n, the two digits of the answer always sum to..."
        back: "9 (e.g. 9 x 6 = 54, and 5 + 4 = 9)"
        type: basic

  - id: division-facts
    name: Division Facts
    core: true
    difficulty: 0.12
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites:
      - id: multiplication-tables
        weight: 1.0
        key: true
    knowledge_points:
      - id: kp1
        name: Quotients from the tables
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $42 \div 6$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Undo multiplication: $6 \times 7 = 42$.'
          - problem: '$63$ cookies are shared equally among $9$ friends. How many cookies does each friend get?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Undo multiplication: $9 \times 7 = 63$.'
          - problem: '$32 \div 8 = \square$. Find $\square$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Undo multiplication: $8 \times 4 = 32$.'
          - problem: 'Evaluate $100 \div 10$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Undo multiplication: $10 \times 10 = 100$.'
        constraints: "dividend is a product of two factors 2-10; divides evenly"
      - id: kp2
        name: Missing-factor form
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Solve: $6 \times \square = 48$.'
            answer: "8"
            solution_sketch: 'Division undoes multiplication: $48 \div 6 = 8$.'
          - problem: 'Compute $56 \div 7$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Undo multiplication: $7 \times 8 = 56$.'
          - problem: 'Solve: $\square \times 9 = 54$.'
            answer: "6"
            solution_sketch: 'The missing factor is $54 \div 9 = 6$.'
          - problem: 'Find the missing factor: $\square \times 8 = 64$.'
            answer: "8"
            solution_sketch: 'Undo the multiplication: $8 \times 8 = 64$, so the missing factor is $8$.'
        constraints: "facts through 10 x 10, stated as division or missing factor"
    diagnostic_exemplar:
      problem: 'Solve: $8 \times \square = 56$.'
      answer: '7'
      solution_sketch: 'The missing factor is $56 \div 8 = 7$.'
    anki_seeds:
      - front: "The division 42 / 6 asks the multiplication question..."
        back: "6 times what equals 42? (answer: 7)"
        type: basic

  - id: perfect-squares
    name: Perfect Squares
    core: true
    difficulty: 0.15
    drill: true
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites:
      - id: multiplication-tables
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: Squares through twelve squared
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $7^2$.'
            answer: "49"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$7^2 = 7 \times 7 = 49$.'
          - problem: 'A square garden has sides of length $9$. What is its area?'
            answer: "81"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$9^2 = 9 \times 9 = 81$.'
          - problem: '$12^2 = \square$. Find $\square$.'
            answer: "144"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$12^2 = 12 \times 12 = 144$.'
          - problem: 'Evaluate $1^2$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying $1$ by itself leaves it unchanged, so $1^2 = 1$.'
        constraints: "base 1-12"
      - id: kp2
        name: Recognizing perfect squares
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: "Find the whole number whose square is 64."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use the square fact from the multiplication table: 8^2 = 64. Step 2: Check the neighboring squares 7^2 = 49 and 9^2 = 81, so the root is unique. The whole number whose square is 64 is 8."
          - problem: 'What number squared gives $121$?'
            answer: "11"
            solution_sketch: '$11^2 = 121$.'
          - problem: "Exactly one perfect square lies between 45 and 55. Find it."
            answer: "49"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Square the whole numbers near the range: 6^2 = 36, which is below 45. Step 2: The next square 7^2 = 49 lies between 45 and 55, and 8^2 = 64 is past 55, so it is the only one. The perfect square between 45 and 55 is 49."
          - problem: "Find the smallest perfect square greater than 90."
            answer: "100"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Square the whole numbers near 90: 9^2 = 81, which is still smaller than 90. Step 2: The next square is 10^2 = 100, which is greater than 90, and no square lies between 81 and 100. The smallest perfect square greater than 90 is 100."
        constraints: "numbers up to 150"
    diagnostic_exemplar:
      problem: 'What whole number squared gives $144$?'
      answer: '12'
      solution_sketch: '$12^2 = 144$.'
    anki_seeds:
      - front: "13 squared ="
        back: "169"
        type: basic
      - front: "A perfect square is a number that equals..."
        back: "a whole number times itself (e.g. 36 = 6 x 6)"
        type: basic

  - id: place-value
    name: Place Value
    core: true
    difficulty: 0.1
    drill: false
    answer_kind: numeric
    expected_time_secs: 30
    prerequisites: []          # mastery-floor root
    knowledge_points:
      - id: kp1
        name: Value of a digit by position
        exemplars:
          - problem: 'What is the value of the $7$ in $74$?'
            answer: "70"
            solution_sketch: 'The $7$ sits in the tens place, so its value is $7 \times 10 = 70$.'
          - problem: 'Which digit is in the hundreds place of $3852$?'
            answer: "8"
            solution_sketch: 'Reading left to right, $3852$ has digits thousands=$3$, hundreds=$8$, tens=$5$, ones=$2$; the hundreds digit is $8$.'
          - problem: 'In the number $196$, what value does the digit $9$ represent?'
            answer: "90"
            solution_sketch: 'The $9$ sits in the tens place, so its value is $9 \times 10 = 90$.'
          - problem: 'What is the value of the $7$ in $7{,}249$?'
            answer: "7000"
            solution_sketch: 'The $7$ sits in the thousands place, so its value is $7 \times 1000 = 7000$.'
        constraints: "numbers up to 4 digits"
      - id: kp2
        name: Expanded form and larger numbers
        exemplars:
          - problem: 'What is the value of the $5$ in $5{,}280$?'
            answer: "5000"
            solution_sketch: 'The $5$ sits in the thousands place, so its value is $5 \times 1000 = 5000$.'
          - problem: 'Write $4{,}506$ in expanded form.'
            answer: "4000 + 500 + 6"
            solution_sketch: '$4$ thousands + $5$ hundreds + $0$ tens + $6$ ones.'
          - problem: 'In the number $63{,}041$, what value does the digit $3$ represent?'
            answer: "3000"
            solution_sketch: 'The $3$ sits in the thousands place, so its value is $3 \times 1000 = 3000$.'
          - problem: 'Express $30{,}208$ in expanded form.'
            answer: "30000 + 200 + 8"
            solution_sketch: 'Add the value of each nonzero digit: $30000 + 200 + 8 = 30208$.'
        constraints: "numbers up to 5 digits, may include internal zeros"
    diagnostic_exemplar:
      problem: 'What is the value of the $4$ in $23{,}406$?'
      answer: '400'
      solution_sketch: 'The $4$ sits in the hundreds place.'
    anki_seeds:
      - front: "In 4,321 the digit 4 sits in the {{c1::thousands}} place."
        back: "thousands"
        type: cloze

  - id: comparing-ordering-whole-numbers
    name: Comparing and Ordering Whole Numbers
    core: true
    difficulty: 0.1
    drill: false
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: place-value
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: Compare two numbers
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Which is larger, $4{,}562$ or $4{,}652$?'
            answer: "4652"
            solution_sketch: 'Same thousands digit; compare hundreds: $6 > 5$.'
          - problem: 'Which is smaller, $389$ or $401$?'
            answer: "389"
            solution_sketch: 'Same digit count (three); compare hundreds: $3 < 4$, so $389 < 401$.'
          - problem: 'Between $6{,}284$ and $6{,}248$, which number is larger?'
            answer: "6284"
            solution_sketch: 'Digits match up to position 3; there $8 > 4$ decides it.'
          - problem: 'Which is larger, $512$ or $4{,}999$?'
            answer: "4999"
            solution_sketch: '$4{,}999$ has more digits than $512$, so it is larger.'
        constraints: "numbers up to 5 digits, same or different digit counts"
      - id: kp2
        name: Order a list of numbers
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Order from least to greatest: $315$, $351$, $153$.'
            answer: "153, 315, 351"
            solution_sketch: 'Comparing hundreds then tens: $153 < 315 < 351$.'
          - problem: 'Which is greatest: $2{,}087$, $2{,}870$, or $2{,}078$?'
            answer: "2870"
            solution_sketch: 'All three share the thousands digit $2$; comparing hundreds digits ($0$, $8$, $0$), $2{,}870$ has the largest and is greatest.'
          - problem: 'Order from least to greatest: $5{,}316$, $5{,}361$, $5{,}136$.'
            answer: "5136, 5316, 5361"
            solution_sketch: 'Comparing place by place: $5{,}136 < 5{,}316 < 5{,}361$.'
          - problem: 'Order from least to greatest: $712$, $89$, $1{,}205$, $698$.'
            answer: "89, 698, 712, 1205"
            solution_sketch: 'Comparing place by place: $89 < 698 < 712 < 1{,}205$.'
        constraints: "3-4 numbers, up to 4 digits"
    diagnostic_exemplar:
      problem: 'Order from least to greatest: $4{,}071$, $4{,}710$, $4{,}017$.'
      answer: '4017, 4071, 4710'
      solution_sketch: 'All three have four digits, so compare place by place from the left.'
    anki_seeds:
      - front: "To compare two whole numbers with the same number of digits, compare digits..."
        back: "from left to right; the first place where they differ decides"
        type: basic
      - front: "A whole number with more digits than another is always..."
        back: "larger (e.g. 1,000 > 999)"
        type: basic

  - id: rounding-whole-numbers
    name: Rounding Whole Numbers
    core: true
    difficulty: 0.12
    drill: false
    answer_kind: numeric
    expected_time_secs: 35
    prerequisites:
      - id: place-value
        weight: 0.8
        key: true
      - id: comparing-ordering-whole-numbers
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Round to the nearest ten or hundred
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Round $47$ to the nearest ten.'
            answer: "50"
            solution_sketch: 'The ones digit is $7 (\geq 5)$, so round up to $50$.'
          - problem: 'What is $83$ rounded to the nearest ten?'
            answer: "80"
            solution_sketch: 'The ones digit is $3 (< 5)$, so round down to $80$.'
          - problem: 'Round $342$ to the nearest hundred.'
            answer: "300"
            solution_sketch: 'The tens digit is $4 (< 5)$, so round down to $300$.'
          - problem: 'What is $267$ rounded to the nearest hundred?'
            answer: "300"
            solution_sketch: 'The digit to the right of the hundreds place is $6$, so round up: $300$.'
        constraints: "2-3 digit numbers"
      - id: kp2
        name: Round to larger places, including boundary cases
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Round $2{,}681$ to the nearest thousand.'
            answer: "3000"
            solution_sketch: 'The hundreds digit is $6 (\geq 5)$, so round up to $3{,}000$.'
          - problem: 'Round $7{,}450$ to the nearest hundred.'
            answer: "7500"
            solution_sketch: 'The tens digit is exactly $5$, so round up: $7{,}500$.'
          - problem: 'What is $4{,}500$ rounded to the nearest thousand?'
            answer: "5000"
            solution_sketch: 'The hundreds digit is $5 (\geq 5)$, so round up to $5{,}000$.'
          - problem: 'To the nearest thousand, what is $9{,}500$?'
            answer: "10000"
            solution_sketch: 'The digit to the right of the thousands place is $5$, so round up: $10{,}000$.'
        constraints: "up to 4 digits; include boundary (5) cases"
    diagnostic_exemplar:
      problem: 'Round $6{,}350$ to the nearest hundred.'
      answer: "6400"
      solution_sketch: 'The tens digit is $5$, so the hundreds digit rounds up: $6{,}400$.'
    anki_seeds:
      - front: "When rounding, look at the digit to the right of the target place: if it is 5 or more you..."
        back: "round up; if it is 4 or less, round down (keep the digit)"
        type: basic

  # --------------------------------------------------------------------- #
  # Multi-digit computation
  # --------------------------------------------------------------------- #
  - id: addition-with-carrying
    name: Addition with Carrying
    core: true
    difficulty: 0.12
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: single-digit-addition
        weight: 1.0
        key: true
      - id: place-value
        weight: 0.6
    knowledge_points:
      - id: kp1
        name: Two-digit addition with a carry
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'Compute $47 + 38$.'
            answer: "85"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$7 + 8 = 15$, write $5$ carry $1$; $4 + 3 + 1 = 8$.'
          - problem: 'A charity collects $56$ cans on Monday and $27$ cans on Tuesday. How many cans in total?'
            answer: "83"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'ones $6+7=13$ (carry); tens $5+2+1=8$; total $83$.'
          - problem: '$29 + 43 = \square$. Find $\square$.'
            answer: "72"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'ones $9+3=12$ (carry); tens $2+4+1=7$; total $72$.'
          - problem: 'Evaluate $38 + 54$.'
            answer: "92"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'ones $8+4=12$ (carry); tens $3+5+1=9$; total $92$.'
        constraints: "2-digit addends, exactly one carry"
      - id: kp2
        name: Three-digit addition with multiple carries
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Compute $256 + 178$.'
            answer: "434"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ones: $6+8=14$ (carry); tens: $5+7+1=13$ (carry); hundreds: $2+1+1=4$.'
          - problem: 'A concert sold $385$ tickets on Friday and $247$ tickets on Saturday. How many tickets in total?'
            answer: "632"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'ones $5+7=12$ (carry); tens $8+4+1=13$ (carry); hundreds $3+2+1=6$; total $632$.'
          - problem: '$469 + 357 = \square$. Find $\square$.'
            answer: "826"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'ones $9+7=16$ (carry); tens $6+5+1=12$ (carry); hundreds $4+3+1=8$; total $826$.'
          - problem: 'Evaluate $578 + 296$.'
            answer: "874"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'ones $8+6=14$ (carry); tens $7+9+1=17$ (carry); hundreds $5+2+1=8$; total $874$.'
        constraints: "3-digit addends, at least two carries"
      - id: kp3
        name: Several addends
        key_prerequisites: [single-digit-addition]
        exemplars:
          - problem: 'Compute $25 + 37 + 18$.'
            answer: "80"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$25 + 37 = 62$; $62 + 18 = 80$.'
          - problem: 'A hiker walks $123$, $45$, and $206$ meters on three separate legs of a trail. What is the total distance?'
            answer: "374"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$123 + 45 = 168$; $168 + 206 = 374$.'
          - problem: '$46 + 72 + 139 = \square$. Find $\square$.'
            answer: "257"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$46 + 72 = 118$; $118 + 139 = 257$.'
          - problem: 'Evaluate $208 + 356 + 94$.'
            answer: "658"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$208 + 356 = 564$; $564 + 94 = 658$.'
        constraints: "three addends, up to 3 digits each"
    diagnostic_exemplar:
      problem: 'Compute $256 + 187 + 45$.'
      answer: '488'
      solution_sketch: 'Units $6 + 7 + 5 = 18$ (carry 1); tens $5 + 8 + 4 + 1 = 18$ (carry 1); hundreds $2 + 1 + 1 = 4$.'
    anki_seeds:
