          - problem: 'A factory makes $214$ items per hour. How many items does it make in $36$ hours?'
            answer: '7704'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The factory makes the same number each hour, so multiply. Split $36$ into $30$ and $6$. Then $214 \times 30 = 6420$ and $214 \times 6 = 1284$, and $6420 + 1284 = 7704$.'
          - problem: 'What is $342 \times 27$?'
            answer: '9234'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split $27$ into $20$ and $7$. Then $342 \times 20 = 6840$ and $342 \times 7 = 2394$, and $6840 + 2394 = 9234$.'
          - problem: 'Sam writes $256 \times 14 = 1024 + 256 = 1280$. What is the correct value of $256 \times 14$?'
            answer: '3584'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam forgot that the $1$ in $14$ stands for ten. The tens part is $256 \times 10 = 2560$, not $256$. With $256 \times 4 = 1024$ the product is $2560 + 1024 = 3584$.'
          - problem: 'A truck carries $125$ crates. Each crate has a mass of $24$ kg. What is the total mass of the crates?'
            answer: '3000'
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'The crates have equal mass, so multiply. Here $125 \times 20 = 2500$ and $125 \times 4 = 500$, and $2500 + 500 = 3000$ kg.'
          - problem: 'Evaluate $463 \times 18$.'
            answer: '8334'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split $18$ into $10$ and $8$. Then $463 \times 10 = 4630$ and $463 \times 8 = 3704$, and $4630 + 3704 = 8334$.'
          - problem: 'A museum gives $15$ leaflets to each tour group. It hosts $248$ groups in May and $126$ groups in June. How many more leaflets does it need in May than in June?'
            answer: '1830'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each group gets the same number of leaflets, so first find how many more groups come in May: $248 - 126 = 122$. Then multiply by $15$: $122 \times 15 = 1830$, because $122 \times 10 = 1220$ and $122 \times 5 = 610$.'
          - problem: 'A farm packs $12$ eggs in each carton and fills $325$ cartons in a week. How many eggs does it pack in that week?'
            answer: '3900'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every carton holds the same number of eggs, so multiply. Split $12$ into $10$ and $2$. Then $325 \times 10 = 3250$ and $325 \times 2 = 650$, and $3250 + 650 = 3900$.'
