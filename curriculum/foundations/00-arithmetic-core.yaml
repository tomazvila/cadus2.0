            solution_sketch: 'The ones digit $4$ is less than $9$, so borrow a ten: $14 - 9 = 5$, and $6 - 2 = 4$. The difference is $45$. Check: $29 + 45 = 74$.'
          - problem: 'Compute $832 - 459$.'
            answer: "373"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ones: borrow a ten, so $12 - 9 = 3$. The tens: $2 - 5$ is not possible, so borrow a hundred and $12 - 5 = 7$. The hundreds: $7 - 4 = 3$. Check: $459 + 373 = 832$.'
          - problem: 'Kim says that $83 - 56 = 29$. Add to check her answer. Is Kim right?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes","yes, kim is right","kim is right","she is right","yes, she is right","yes, it is"],["no","no, kim is wrong","kim is wrong","she is wrong","kim is not right","she is not right","no, she is not","no, it is not"]]}
            solution_sketch: 'Add the difference to the subtrahend: $56 + 29 = 85$. This is not $83$, so Kim is not right; the correct difference is $27$ because $56 + 27 = 83$.'
          - problem: 'A tank holds $604$ litres of water. After a leak, $378$ litres are lost. How much water is left in the tank?'
            answer: "226"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'The ones: borrow a ten, so $14 - 8 = 6$. The tens digit is $0$, so borrow from the hundreds first, which leaves $9$ tens and $9 - 7 = 2$. The hundreds: $5 - 3 = 2$. So $226$ litres are left. Check: $378 + 226 = 604$.'
          - problem: 'A shop had $91$ tins on a shelf. After a sale, $47$ tins were left. How many tins were sold?'
            answer: "44"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tins sold are the tins at the start minus the tins left, so $91 - 47 = 44$. Check: $47 + 44 = 91$.'
          - problem: 'Dev finds that $502 - 267 = 235$. Add to check his answer. Is Dev right?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes","yes, dev is right","dev is right","he is right","yes, he is right","yes, it is"],["no","no, dev is wrong","dev is wrong","he is wrong","dev is not right","he is not right","no, he is not","no, it is not"]]}
            solution_sketch: 'Add the difference to the subtrahend: $267 + 235 = 502$. This equals the first number, so Dev is right.'
          - problem: 'Compute $725 - 468$.'
            answer: "257"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The ones: borrow a ten, so $15 - 8 = 7$. The tens: $1 - 6$ is not possible, so borrow a hundred and $11 - 6 = 5$. The hundreds: $6 - 4 = 2$. Check: $468 + 257 = 725$.'
        constraints: "2-3 digit numbers; encourage the addition check"
    diagnostic_exemplar:
      problem: 'Compute $623 - 457$.'
      answer: '166'
      solution_sketch: 'Borrow in both columns; check by addition: $166 + 457 = 623$.'
    anki_seeds:
      - front: "In column subtraction, when the top digit is smaller than the bottom digit you must..."
        back: "borrow (regroup) one unit from the next place to the left"
        type: basic

  - id: multi-digit-addition-subtraction
    name: Multi-Digit Addition and Subtraction
    core: true
    difficulty: 0.18
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: addition-with-carrying
        weight: 0.9
        key: true
      - id: subtraction-with-borrowing
        weight: 0.9
        key: true
      - id: place-value
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Four-digit addition
        key_prerequisites: [addition-with-carrying]
        exemplars:
          - problem: 'Compute $1867 + 3589$.'
            answer: "5456"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In the ones column $7+9=16$, so write $6$ and carry $1$. Next $6+8+1=15$, then $8+5+1=14$, then $1+3+1=5$, which gives $5456$.'
          - problem: 'A festival had $4675$ visitors on day one and $2848$ on day two. How many visitors came in total?'
            answer: "7523"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The total is the sum of the two days. In columns $5+8=13$, $7+4+1=12$, $6+8+1=15$ and $4+2+1=7$, so $4675+2848=7523$ visitors came.'
          - problem: 'A road trip has two parts. The first part is $2986$ km and the second part is $1757$ km. How long is the whole trip?'
            answer: "4743"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The whole trip is the sum of its two parts. Adding in columns gives $2986+1757=4743$ km.'
          - problem: 'Evaluate $3458 + 2967$.'
            answer: "6425"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In columns $8+7=15$, $5+6+1=12$, $4+9+1=14$ and $3+2+1=6$. So the sum is $6425$.'
          - problem: 'Nina adds $5678 + 4546$ and gets $9124$. What is the correct sum?'
            answer: "10224"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Nina lost the carry from the hundreds column. In columns $8+6=14$, $7+4+1=12$, $6+5+1=12$ and $5+4+1=10$, so the sum is $10224$.'
          - problem: 'A bus company carried $6428$ passengers in May and $5973$ in June. How many passengers did it carry in the two months?'
            answer: "12401"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the two monthly totals. Adding in columns gives $6428+5973=12401$ passengers.'
          - problem: 'Three towns have $4286$, $3579$ and $2845$ inhabitants. How many people live in the three towns together?'
            answer: "10710"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First add two towns: $4286+3579=7865$. Then add the third town: $7865+2845=10710$ people.'
        constraints: "4-digit addends, multiple carries"
      - id: kp2
        name: Subtracting across zeros
        key_prerequisites: [subtraction-with-borrowing]
        exemplars:
          - problem: 'Compute $503 - 268$.'
            answer: "235"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The tens digit is $0$, so borrow from the hundreds place and pass a ten to the ones. This gives $503 - 268 = 235$. Check: $268 + 235 = 503$.'
          - problem: 'A tank holds $700$ liters. If $356$ liters drain out, how many liters remain?'
            answer: "344"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Draining takes liters away, so subtract: $700 - 356 = 344$ liters. Check: $356 + 344 = 700$.'
          - problem: 'Compute $4003 - 1567$.'
            answer: "2436"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two zeros sit in the middle, so the borrow chain starts at the thousands place. This gives $4003 - 1567 = 2436$. Check: $1567 + 2436 = 4003$.'
          - problem: 'Sam writes $800 - 347 = 553$. What is the correct value?'
            answer: "453"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam forgot the borrow from the hundreds place. The correct value is $800 - 347 = 453$. Check: $347 + 453 = 800$.'
          - problem: 'A class needs €5,000 for a trip and has raised €2,368. How many euros does it still need?'
            answer: "2632"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The amount still needed is the goal minus the amount raised. So $5000 - 2368 = 2632$ euros.'
          - problem: 'A cyclist plans a $3000$ m ride and has ridden $1475$ m. How much of the ride is left?'
            answer: "1525"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The distance left is the plan minus the distance ridden. So $3000 - 1475 = 1525$ m are left.'
          - problem: 'What is $9000 - 4786$?'
            answer: "4214"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three zeros sit after the nine, so the borrow chain runs through all of them. This gives $9000 - 4786 = 4214$.'
        constraints: "minuend contains zeros requiring a chain borrow"
      - id: kp3
        name: Combined multi-step computations
        key_prerequisites: [addition-with-carrying]
        exemplars:
          - problem: 'Compute $350 + 275 - 125$.'
            answer: "500"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Work from left to right. First $350 + 275 = 625$, then $625 - 125 = 500$.'
          - problem: 'Compute $812 - (347 + 165)$.'
            answer: "300"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parentheses come first, so $347 + 165 = 512$. Then $812 - 512 = 300$.'
          - problem: 'Compute $960 - 275 + 140$.'
            answer: "825"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Work from left to right. First $960 - 275 = 685$, then $685 + 140 = 825$.'
          - problem: 'Start with $1250$ and subtract the combined total of $480$ and $275$. What remains?'
            answer: "495"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Find the combined total first: $480 + 275 = 755$. Then $1250 - 755 = 495$ remains.'
          - problem: 'A cinema has $1200$ seats. A group of $345$ people and a group of $278$ people arrive. How many seats are still free?'
            answer: "577"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both groups take seats, so add them first: $345 + 278 = 623$. Then $1200 - 623 = 577$ seats are free.'
          - problem: 'A bank account holds €2,450. A salary of €1,800 comes in. Then rent of €950 and bills of €375 go out. How many euros are in the account at the end?'
            answer: "2925"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Money in is added and money out is subtracted. So $2450 + 1800 = 4250$, then $4250 - 950 = 3300$, then $3300 - 375 = 2925$ euros.'
          - problem: 'Lena computes $812 - 347 + 165$ as $812 - 512 = 300$. What is the correct value?'
            answer: "630"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Without parentheses the order is left to right. So $812 - 347 = 465$, then $465 + 165 = 630$.'
        constraints: "two operations, numbers up to 4 digits"
    diagnostic_exemplar:
      problem: 'Compute $4000 - (1268 + 947)$.'
      answer: '1785'
      solution_sketch: '$1268 + 947 = 2215$; then $4000 - 2215 = 1785$, borrowing across the zeros.'
    anki_seeds:
      - front: "To check a subtraction a - b = c, verify that..."
        back: "b + c = a"
        type: basic

  - id: addition-subtraction-word-problems
    name: Addition and Subtraction Word Problems
    core: false                # enrichment / applications leaf topic
    difficulty: 0.2
    drill: false
    answer_kind: numeric
    expected_time_secs: 75
    prerequisites:
      - id: multi-digit-addition-subtraction
        weight: 0.9
        key: true
    knowledge_points:
      - id: kp1
        name: One-step problems
        key_prerequisites: [multi-digit-addition-subtraction]
        exemplars:
          - problem: 'A library has $1240$ books and buys $385$ more. How many books does it have now?'
            answer: "1625"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Buying books adds to the stock. So $1240 + 385 = 1625$ books.'
          - problem: 'A stadium holds $4500$ people and $3862$ attend. How many seats are empty?'
            answer: "638"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Empty seats are the whole minus the seats in use. So $4500 - 3862 = 638$ seats are empty.'
          - problem: 'A train carried $2418$ passengers in the morning and $3675$ in the afternoon. How many passengers did it carry that day?'
            answer: "6093"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The day total is the sum of the two parts. So $2418 + 3675 = 6093$ passengers.'
          - problem: 'A tank held $6400$ liters of water. Then $2875$ liters were pumped out. How many liters are left?'
            answer: "3525"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Pumping out takes water away, so subtract. $6400 - 2875 = 3525$ liters are left.'
          - problem: 'A warehouse stores $3450$ boxes and ships $1275$. How many boxes remain?'
            answer: "2175"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Shipped boxes leave the warehouse, so subtract. $3450 - 1275 = 2175$ boxes remain.'
          - problem: 'Omar has $2340$ points and earns $875$ more. He writes $2340 - 875 = 1465$. What is the correct total?'
            answer: "3215"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Earning points adds to the score, so Omar should add. The correct total is $2340 + 875 = 3215$ points.'
          - problem: 'A concert hall seats $2800$ people and $1950$ tickets are sold. How many seats are still available?'
            answer: "850"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Seats available are the whole minus the seats sold. So $2800 - 1950 = 850$ seats.'
        constraints: "one operation; numbers up to 4 digits"
      - id: kp2
        name: Two-step problems
        key_prerequisites: [multi-digit-addition-subtraction]
        exemplars:
          - problem: 'Maya had €250, spent €78 and then earned €45. How many euros does she have now?'
            answer: "217"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'Spending lowers the amount and earning raises it. So $250 - 78 = 172$, then $172 + 45 = 217$ euros.'
          - problem: 'A school has $364$ students. $88$ are in year $5$ and $95$ are in year $6$. How many are in other years?'
            answer: "181"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the two known years first: $88 + 95 = 183$. Then subtract them from the whole: $364 - 183 = 181$.'
          - problem: 'A bus has $54$ passengers. At the first stop $18$ get off and $27$ get on. At the second stop $31$ get off. How many passengers are on the bus now?'
            answer: "32"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Update the count stop by stop. $54 - 18 = 36$, then $36 + 27 = 63$, then $63 - 31 = 32$ passengers.'
          - problem: 'A hiker walks $12\,400$ m in the morning and $8750$ m in the afternoon. The trail is $25\,000$ m long. How far is left to walk?'
            answer: "3850"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Add the two walks first: $12400 + 8750 = 21150$. Then $25000 - 21150 = 3850$ m are left.'
          - problem: 'Ben had $180$ marbles, lost $45$ and then won $60$ more. How many marbles does he have now?'
            answer: "195"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Losing lowers the count and winning raises it. So $180 - 45 = 135$, then $135 + 60 = 195$ marbles.'
          - problem: 'A shop has $340$ shirts. It sells $128$ on Monday and receives a delivery of $75$. How many shirts does it have now?'
            answer: "287"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Selling lowers the stock and a delivery raises it. So $340 - 128 = 212$, then $212 + 75 = 287$ shirts.'
          - problem: 'A theatre has $620$ tickets. It sells $245$ on Monday and $198$ on Tuesday. How many tickets are still unsold?'
            answer: "177"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the two sales first: $245 + 198 = 443$. Then $620 - 443 = 177$ tickets are unsold.'
        constraints: "two operations; numbers up to 3 digits"
      - id: kp3
        name: Comparison problems
        key_prerequisites: [multi-digit-addition-subtraction]
        exemplars:
          - problem: 'Sam has $128$ stamps, which is $43$ more than Ana has. How many stamps does Ana have?'
            answer: "85"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam has more than Ana, so Ana has less. Ana has $128 - 43 = 85$ stamps.'
          - problem: 'Mount A is $3776$ m tall and Mount B is $2917$ m tall. How much taller is Mount A?'
            answer: "859"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The difference in height is the larger height minus the smaller. So $3776 - 2917 = 859$ m.'
          - problem: 'Nora has $246$ stickers, which is $59$ fewer than Elena has. How many stickers does Elena have?'
            answer: "305"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Nora has fewer, so Elena has more. Elena has $246 + 59 = 305$ stickers.'
          - problem: 'River A is $1885$ km long and River B is $2340$ km long. How much shorter is River A?'
            answer: "455"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'The difference is the larger length minus the smaller. So $2340 - 1885 = 455$ km.'
          - problem: 'A red scarf costs €46 and is €15 cheaper than a blue scarf. A hat costs €22 more than the blue scarf. How many euros does the hat cost?'
            answer: "83"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'The red scarf is cheaper, so the blue scarf costs $46 + 15 = 61$ euros. The hat costs $61 + 22 = 83$ euros.'
          - problem: 'A school collected $3420$ kg of paper last year. This year it collected $785$ kg more than last year. How much paper did it collect in the two years together?'
            answer: "7625"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'This year it collected $3420 + 785 = 4205$ kg. The two years together give $3420 + 4205 = 7625$ kg.'
          - problem: 'A bridge pylon is $212$ m high. A tower is $64$ m lower than the pylon. Pia writes $212 + 64 = 276$ m for the tower. How high is the tower?'
            answer: "148"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The tower is lower than the pylon, so its height is smaller. The tower is $212 - 64 = 148$ m high.'
        constraints: "difference/comparison language; up to 4 digits"
    diagnostic_exemplar:
      problem: 'Tomas has $215$ stamps, which is $58$ more than Rita has. How many stamps do they have together?'
      answer: "372"
      solution_sketch: 'Rita has $215 - 58 = 157$; together $215 + 157 = 372$.'
    anki_seeds:
      - front: "In a word problem, the phrase 'how many more' signals which operation?"
        back: "subtraction (finding a difference)"
        type: basic

  - id: multiplying-by-powers-of-ten
    name: Multiplying by Powers of Ten
    core: true
    difficulty: 0.15
    drill: false
    answer_kind: numeric
    expected_time_secs: 40
    prerequisites:
      - id: multiplication-tables
        weight: 0.8
        key: true
      - id: place-value
        weight: 0.7
        key: true
    knowledge_points:
      - id: kp1
        name: Multiply by 10, 100, and 1000
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Compute $47 \times 10$.'
            answer: "470"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying by 10 moves every digit one place left. The empty ones place gets a zero, so $47 \times 10 = 470$.'
          - problem: 'A store orders $36$ boxes of $100$ pens each. How many pens does it order in total?'
            answer: "3600"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each box has $100$ pens, so multiply. Multiplying by 100 appends two zeros, so $36 \times 100 = 3600$ pens.'
          - problem: 'What is $1000 \times 63$?'
            answer: "63000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying by 1000 appends three zeros to 63. So $1000 \times 63 = 63000$.'
          - problem: 'Pens are sold in packs of $100$. A store has $3600$ pens. How many full packs can it make?'
            answer: "36"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The question asks how many groups of $100$ fit into $3600$, so divide. Removing two zeros gives $3600 \div 100 = 36$ packs.'
          - problem: 'A ribbon is $85$ m long. How many centimeters long is it?'
            answer: "8500"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'One meter is $100$ cm, so multiply by $100$. This gives $85 \times 100 = 8500$ cm.'
          - problem: 'Kai writes $53 \times 100 = 530$. What is the correct value?'
            answer: "5300"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Kai appended one zero, but 100 has two zeros. So $53 \times 100 = 5300$.'
          - problem: 'A warehouse ships $1000$ crates a week. Each crate holds $24$ bottles. How many bottles does it ship in a week?'
            answer: "24000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each crate holds $24$ bottles, so multiply. Appending three zeros gives $24 \times 1000 = 24000$ bottles.'
        constraints: "1-2 digit number times 10, 100, or 1000"
      - id: kp2
        name: Multiply multiples of ten
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $40 \times 70$.'
            answer: "2800"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $4 \times 7 = 28$. Each factor has one zero, so append two zeros to get $2800$.'
          - problem: 'A farm has $240$ crates with $30$ eggs in each. How many eggs does it have in total?'
            answer: "7200"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the crates by the eggs in each. First $24 \times 3 = 72$, then append the two zeros: $7200$ eggs.'
          - problem: 'What is $600 \times 50$?'
            answer: "30000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $6 \times 5 = 30$. The factors have three zeros together, so $600 \times 50 = 30000$.'
          - problem: 'A farm packs $7200$ eggs into crates of $30$ eggs each. How many crates does it fill?'
            answer: "240"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The question asks how many groups of $30$ fit into $7200$, so divide. Since $24 \times 30 = 720$, we get $7200 \div 30 = 240$ crates.'
          - problem: 'A cinema has $80$ rows with $60$ seats in each row. How many seats does it have?'
            answer: "4800"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the rows by the seats in each row. First $8 \times 6 = 48$, then append two zeros: $4800$ seats.'
          - problem: 'Zoe computes $300 \times 20$ as $600$. What is the correct product?'
            answer: "6000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Zoe dropped one zero. First $3 \times 2 = 6$, and the factors have three zeros together, so $300 \times 20 = 6000$.'
          - problem: 'A lorry carries $500$ crates and each crate has a mass of $40$ kg. What is the total mass of the crates?'
            answer: "20000"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'Multiply the number of crates by the mass of one. First $5 \times 4 = 20$, then append three zeros: $20000$ kg.'
          - problem: 'What is $90 \times 400$?'
            answer: "36000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $9 \times 4 = 36$. The factors have three zeros together, so $90 \times 400 = 36000$.'
        constraints: "both factors end in zeros; underlying fact from the tables"
    diagnostic_exemplar:
      problem: 'Compute $60 \times 80$.'
      answer: "4800"
      solution_sketch: '$6 \times 8 = 48$, then restore the two zeros: $4800$.'
    anki_seeds:
      - front: "To multiply by a multiple of ten (e.g. 240 x 30), multiply the nonzero parts then..."
        back: "append the total number of trailing zeros (24 x 3 = 72 -> 7200)"
        type: basic

  - id: multiplying-by-one-digit
