            answer: "3^4"
            solution_sketch: 'Four factors of $3$ is $3^4$.'
          - problem: 'Write $5^3$ as a repeated multiplication.'
            answer: "5 x 5 x 5"
            solution_sketch: '$5^3$ means $3$ factors of $5$: $5 \times 5 \times 5$.'
          - problem: 'Write $4 \times 4 \times 4$ using an exponent.'
            answer: "4^3"
            solution_sketch: 'Three factors of $4$ is $4^3$.'
          - problem: 'Write $7^2$ as a repeated multiplication.'
            answer: "7 x 7"
            solution_sketch: '$7^2$ means $2$ factors of $7$: $7 \times 7$.'
        constraints: "base 2-10, exponent 2-5"
      - id: kp2
        name: Evaluating powers
        key_prerequisites: [multiplication-tables]
        exemplars:
          - problem: 'Compute $2^5$.'
            answer: "32"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$2, 4, 8, 16, 32$.'
          - problem: 'Compute $3^4$.'
            answer: "81"
            answer_contract: {"kind":"exact"}
          - problem: 'Compute $10^3$.'
            answer: "1000"
            answer_contract: {"kind":"exact"}
        constraints: "value at most 1000"
      - id: kp3
        name: Squares, cubes, and comparisons
        key_prerequisites: [perfect-squares]
        exemplars:
          - problem: 'Compute $4^3$.'
            answer: "64"
            answer_contract: {"kind":"exact"}
          - problem: 'Which is larger, $2^6$ or $6^2$?'
            answer: "2^6"
            solution_sketch: '$2^6 = 64$ and $6^2 = 36$.'
          - problem: 'Compute $1^9$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
        constraints: "compare or evaluate; values at most 200"
    diagnostic_exemplar:
      problem: 'Which is larger, $3^4$ or $4^3$?'
      answer: '3^4'
      solution_sketch: '$3^4 = 81$ and $4^3 = 64$.'
    anki_seeds:
      - front: "In the power 5^3, 5 is the base and 3 is the {{c1::exponent}}."
        back: "exponent"
        type: cloze
      - front: "For any number a, a^1 equals..."
        back: "a itself"
        type: basic

