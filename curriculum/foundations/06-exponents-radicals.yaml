nd $s$.", "answer": "11"}, {"problem": "A square garden has area $121$ square metres. Find its side length in metres.", "answer": "11", "answer_contract": {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}}, {"problem": "Find $\\sqrt{121}$.", "answer": "11"}]}, {"id": "root-144", "role": "practice_fresh", "variants": [{"problem": "A nonnegative length $s$ has $s^2=144$. Find $s$.", "answer": "12"}]}]}
