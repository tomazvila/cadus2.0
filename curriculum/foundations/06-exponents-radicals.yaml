    core: true
    difficulty: 0.50
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: square-roots
        weight: 0.7
        key: true
      - id: prime-factorization
        weight: 0.6
        key: true
      - id: multiplication-tables
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Factor out a perfect square"
        key_prerequisites: [prime-factorization]
        exemplars:
          - problem: 'Simplify $\sqrt{12}$.'
            answer: "2*sqrt(3)"
            solution_sketch: '$12 = 4 \cdot 3$; $\sqrt{4} = 2$.'
          - problem: 'What is $\sqrt{50}$ in simplest radical form?'
            answer: "5*sqrt(2)"
            solution_sketch: '$50 = 25 \cdot 2$.'
          - problem: 'Reduce $\sqrt{27}$ to simplest radical form.'
            answer: "3*sqrt(3)"
            solution_sketch: '$27 = 9 \cdot 3$; $\sqrt{9} = 3$.'
          - problem: 'Write $\sqrt{20}$ in simplest radical form.'
            answer: "2*sqrt(5)"
            solution_sketch: '$20 = 4 \cdot 5$; $\sqrt{4} = 2$.'
        constraints: "pull out the largest perfect-square factor"
      - id: kp2
        name: "Larger radicands and coefficients"
        key_prerequisites: [square-roots]
        exemplars:
          - problem: 'Simplify $\sqrt{72}$.'
            answer: "6*sqrt(2)"
            solution_sketch: '$72 = 36 \cdot 2$.'
          - problem: 'Simplify $3\sqrt{8}$.'
            answer: "6*sqrt(2)"
            solution_sketch: '$3 \cdot 2\sqrt{2} = 6\sqrt{2}$.'
          - problem: 'What is $\sqrt{98}$ in simplest radical form?'
            answer: "7*sqrt(2)"
            solution_sketch: '$98 = 49 \cdot 2$; $\sqrt{49} = 7$.'
          - problem: 'Reduce $2\sqrt{45}$ to simplest radical form.'
            answer: "6*sqrt(5)"
            solution_sketch: '$\sqrt{45} = 3\sqrt{5}$; $2 \cdot 3\sqrt{5} = 6\sqrt{5}$.'
        constraints: "multiply any outside coefficient after simplifying"
      - id: kp3
        name: "Prime factorization for large radicands"
        key_prerequisites: [prime-factorization]
        exemplars:
          - problem: 'Simplify $\sqrt{180}$.'
            answer: "6*sqrt(5)"
            solution_sketch: '$180 = 2^2 \cdot 3^2 \cdot 5$; $2 \cdot 3 = 6$ comes out.'
          - problem: 'What is $\sqrt{126}$ in simplest radical form?'
            answer: "3*sqrt(14)"
            solution_sketch: '$126 = 2 \cdot 3^2 \cdot 7$; $3$ comes out.'
          - problem: 'Reduce $\sqrt{200}$ to simplest radical form.'
            answer: "10*sqrt(2)"
            solution_sketch: '$200 = 2^3 \cdot 5^2$; $10$ comes out, $2$ stays inside.'
          - problem: 'Write $\sqrt{150}$ in simplest radical form.'
            answer: "5*sqrt(6)"
            solution_sketch: '$150 = 2 \cdot 3 \cdot 5^2$; $5$ comes out.'
        constraints: "radicands 100-300; pair up prime factors"
    diagnostic_exemplar:
      problem: 'Simplify $\sqrt{162}$.'
      answer: '9*sqrt(2)'
      solution_sketch: '$162 = 81 \times 2$.'
    anki_seeds:
      - front: "To simplify a radical, factor out the largest ___ factor: sqrt(a^2 * b) = ?"
        back: "perfect-square factor; a*sqrt(b)"
        type: basic

  - id: simplifying-radicals-variables
    name: "Simplifying Radicals with Variables"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: simplifying-radicals
        weight: 0.8
