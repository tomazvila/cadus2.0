            solution_sketch: '$\sqrt{36} = 6$.'
          - problem: 'Simplify $2\sqrt{5} \cdot 3\sqrt{2}$.'
            answer: "6*sqrt(10)"
            solution_sketch: '$2 \cdot 3 = 6$; $\sqrt{5 \cdot 2} = \sqrt{10}$.'
          - problem: 'What is $\sqrt{2} \cdot \sqrt{8}$?'
            answer: "4"
            solution_sketch: '$\sqrt{16} = 4$.'
          - problem: 'Simplify $3\sqrt{2} \cdot 2\sqrt{8}$.'
