            answer: "9/a^4"
            solution_sketch: '$3^2 a^{-4} = \frac{9}{a^4}$.'
        constraints: "multiply exponents, keep track of the sign"
      - id: kp3
        name: "Full expressions with coefficients and two variables"
        key_prerequisites: [negative-zero-exponents, power-rule-exponents]
        exemplars:
          - problem: 'Simplify $\frac{6x^{-2}y}{3xy^{-3}}$ and write with positive exponents.'
            answer: "2y^4 / x^3"
            solution_sketch: '$\frac{6}{3} = 2$; $x^{-2-1} = x^{-3}$; $y^{1-(-3)} = y^4$.'
          - problem: 'Simplify $(3x^2)^{-1}$ and write with positive exponents.'
            answer: "1/(3x^2)"
            solution_sketch: 'A negative exponent on the whole product moves it to the denominator: $\frac{1}{3x^2}$.'
          - problem: 'Simplify $\frac{10a^{-1}y^3}{5a^2y^{-2}}$ and write with positive exponents.'
            answer: "2y^5 / a^3"
            solution_sketch: '$\frac{10}{5} = 2$; $a^{-1-2} = a^{-3}$; $y^{3-(-2)} = y^5$.'
          - problem: 'What is $(2x^3)^{-1}$ written with positive exponents?'
            answer: "1/(2x^3)"
            solution_sketch: 'A negative exponent on the whole product moves it to the denominator.'
        constraints: "coefficients reduce; each variable handled separately"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{8x^{-1}y^2}{4x^2y^{-1}}$ and write with positive exponents.'
      answer: '2y^3 / x^3'
      solution_sketch: '$\frac{8}{4} = 2$; $x^{-1-2} = x^{-3}$; $y^{2-(-1)} = y^3$.'
    anki_seeds:
      - front: "A factor x^-m in a denominator moves to the numerator as ..."
        back: "x^m"
        type: basic

  - id: scientific-notation-conversion
    name: "Converting To and From Scientific Notation"
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: place-value
        weight: 0.5
        key: true
      - id: decimal-operations
        weight: 0.5
        key: true
      - id: negative-zero-exponents
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Convert large numbers to and from scientific notation"
        key_prerequisites: [place-value]
        try_first:
          problem: 'Multiplying $6.7$ by $10$ gives $67$, and by $100$ gives $670$. If $6{,}700{,}000 = 6.7 \times 10^n$, what is $n$?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'Each factor of $10$ moves the decimal point one place right, and $6.7$ needs six such moves to become $6{,}700{,}000$. So $6{,}700{,}000 = 6.7 \times 10^6$, which is how scientific notation writes a large number.'
        step_check:
          step: 'Compensate with $10^6$'
          question: 'Why is $6.7$ multiplied by $10^6$?'
          options:
            - 'Counting the five zeros after $67$ gives the exponent, so it should be $10^5$'
            - 'Moving the point left divided by $10^6$, so $\times10^6$ restores it'
            - 'The exponent counts every digit of $6{,}700{,}000$, so it should be $10^7$'
            - 'The $10^6$ is added to $6.7$ to bring back the six places that moved'
          answer: 'Moving the point left divided by $10^6$, so $\times10^6$ restores it'
          why: '$6{,}700{,}000 \div 10^6 = 6.7$, so $6.7 \times 10^6$ is the same number; counting the five zeros would give $6.7 \times 10^5 = 670{,}000$, ten times too small.'
        exemplars:
          - problem: 'Write $45000$ in scientific notation.'
            answer: "4.5*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $4$ places left to get the coefficient $4.5$. Then $45000 = 4.5 \times 10^4$.'
          - problem: 'Write $3.2 \times 10^3$ as an ordinary number.'
            answer: "3200"
            answer_contract: {"kind":"required_form","form":"integer"}
            solution_sketch: 'Multiplying by $10^3$ moves the decimal point $3$ places right. So $3.2 \times 10^3 = 3200$.'
          - problem: 'The Sun is about $150{,}000{,}000$ km from Earth. Write this number of kilometres in scientific notation.'
            answer: "1.5*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $8$ places left to get the coefficient $1.5$. So the distance is $1.5 \times 10^8$ km.'
          - problem: 'The population of the world is about $8.1 \times 10^9$ people. Write this population as an ordinary number.'
            answer: "8100000000"
            answer_contract: {"kind":"required_form","form":"integer"}
            solution_sketch: 'Multiplying by $10^9$ moves the decimal point $9$ places right. So $8.1 \times 10^9 = 8100000000$ people.'
          - problem: 'Write $307000$ in scientific notation.'
            answer: "3.07*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $5$ places left; the zero between $3$ and $7$ stays. So $307000 = 3.07 \times 10^5$.'
          - problem: 'Write $5.06 \times 10^5$ as an ordinary number.'
            answer: "506000"
            answer_contract: {"kind":"required_form","form":"integer"}
            solution_sketch: 'Multiplying by $10^5$ moves the decimal point $5$ places right. So $5.06 \times 10^5 = 506000$.'
          - problem: 'A large stadium has about $90000$ seats. Write this number of seats in scientific notation.'
            answer: "9*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $4$ places left to get the coefficient $9$. So $90000 = 9 \times 10^4$ seats.'
        constraints: "coefficient a satisfies 1 <= a < 10"
      - id: kp2
        name: "Small numbers with negative exponents"
        key_prerequisites: [negative-zero-exponents]
        step_check:
          step: 'The exponent is $-5$'
          question: 'Why is the exponent $-5$ and not $5$?'
          options:
            - 'A negative exponent marks a number below zero, so $-5$ is used'
            - 'The exponent counts the zeros after the decimal point of $0.000058$'
            - 'The point moved right, and moves to the right always give a positive exponent'
            - 'The point moved five places right, so $10^{-5}$ undoes the $10^5$'
          answer: 'The point moved five places right, so $10^{-5}$ undoes the $10^5$'
          why: '$5.8 \times 10^{-5} = 5.8 \div 10^5 = 0.000058$; counting only the four zeros after the point would give $5.8 \times 10^{-4} = 0.00058$, ten times too large.'
        exemplars:
          - problem: 'Write $0.00072$ in scientific notation.'
            answer: "7.2*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $4$ places right to get the coefficient $7.2$. The number is below $1$, so $0.00072 = 7.2 \times 10^{-4}$.'
          - problem: 'Write $6 \times 10^{-3}$ as an ordinary number.'
            answer: "0.006"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Multiplying by $10^{-3}$ moves the decimal point $3$ places left. So $6 \times 10^{-3} = 0.006$.'
          - problem: 'A human hair is about $0.00008$ m thick. Write this thickness in metres in scientific notation.'
            answer: "8*10^-5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $5$ places right to get the coefficient $8$. So the hair is $8 \times 10^{-5}$ m thick.'
          - problem: 'A grain of pollen has a mass of about $2.5 \times 10^{-8}$ g. Write this mass in grams as an ordinary number.'
            answer: "0.000000025"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Multiplying by $10^{-8}$ moves the decimal point $8$ places left. So $2.5 \times 10^{-8} = 0.000000025$ g.'
          - problem: 'Write $0.000305$ in scientific notation.'
            answer: "3.05*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $4$ places right to get the coefficient $3.05$. So $0.000305 = 3.05 \times 10^{-4}$.'
          - problem: 'Write $4.1 \times 10^{-6}$ as an ordinary number.'
            answer: "0.0000041"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Multiplying by $10^{-6}$ moves the decimal point $6$ places left. So $4.1 \times 10^{-6} = 0.0000041$.'
          - problem: 'Express $0.0004$ in scientific notation.'
            answer: "4*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $4$ places right to get the coefficient $4$. So $0.0004 = 4 \times 10^{-4}$.'
        constraints: "negative exponent for numbers less than 1"
      - id: kp3
        name: "Valid form and comparing magnitudes"
        key_prerequisites: [place-value, negative-zero-exponents]
        step_check:
          step: 'The exponent $-2$ is greater than $-3$.'
          question: 'Why does comparing the exponents decide which number is larger?'
          options:
            - 'Both coefficients lie from $1$ up to $10$, so a higher power of $10$ always wins'
            - 'The larger coefficient, $4$ against $3.9$, always gives the larger number'
            - 'An exponent closer to zero always gives a smaller number, here $-2$ against $-3$'
            - 'The exponent with the larger absolute value always gives the larger number'
          answer: 'Both coefficients lie from $1$ up to $10$, so a higher power of $10$ always wins'
          why: '$3.9 \times 10^{-2} = 0.039$ and $4 \times 10^{-3} = 0.004$; a normalized coefficient is less than $10$, so one extra power of $10$ always wins.'
        exemplars:
          - problem: 'Rewrite $12 \times 10^3$ in scientific notation.'
            answer: "1.2*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The coefficient $12$ is too large, and $12 = 1.2 \times 10$. So $12 \times 10^3 = 1.2 \times 10^4$.'
          - problem: 'Which is larger: $3 \times 10^5$ or $9 \times 10^4$?'
            answer: "3*10^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both are normalized, so compare exponents first. Since $10^5 > 10^4$, the larger number is $3 \times 10^5$.'
          - problem: 'Rewrite $0.52 \times 10^{-3}$ in scientific notation.'
            answer: "5.2*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The coefficient $0.52$ is too small, and $0.52 = 5.2 \times 10^{-1}$. So $0.52 \times 10^{-3} = 5.2 \times 10^{-4}$.'
          - problem: 'A virus is about $1.2 \times 10^{-7}$ m long and a bacterium is about $2 \times 10^{-6}$ m long. Which is longer, the virus or the bacterium?'
            answer: "the bacterium"
            answer_contract: {"kind":"label","options":[["the bacterium","bacterium","the bacteria","bacteria"],["the virus","virus"]]}
            solution_sketch: 'Both lengths are normalized, so compare exponents. Since $-6 > -7$, the bacterium at $2 \times 10^{-6}$ m is longer.'
          - problem: 'Mount Everest is about $8.8 \times 10^3$ m high, and the Mariana Trench is about $1.1 \times 10^4$ m deep. Which is greater, the height of Everest or the depth of the trench?'
            answer: "the depth"
            answer_contract: {"kind":"label","options":[["the depth","depth","the depth of the trench","the trench","the Mariana Trench"],["the height","height","the height of Everest","Everest","Mount Everest"]]}
            solution_sketch: 'The exponent $4$ is greater than $3$. So the depth of $1.1 \times 10^4$ m is greater than the height of $8.8 \times 10^3$ m.'
          - problem: 'Which is smaller: $4.5 \times 10^{-3}$ or $8 \times 10^{-4}$?'
            answer: "8*10^-4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compare exponents first: $-4 < -3$. So the smaller number is $8 \times 10^{-4}$, even though its coefficient is larger.'
          - problem: 'Express $45 \times 10^2$ in scientific notation.'
            answer: "4.5*10^3"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Write $45 = 4.5 \times 10$ and add one to the exponent. So $45 \times 10^2 = 4.5 \times 10^3$.'
          - problem: 'Kai rewrites $0.6 \times 10^5$ as $6 \times 10^6$. What is the correct scientific notation for $0.6 \times 10^5$?'
            answer: "6*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Making the coefficient ten times larger, $0.6 \to 6$, needs one less power of ten. So $0.6 \times 10^5 = 6 \times 10^4$.'
        constraints: "renormalize the coefficient into [1, 10); compare exponents before coefficients"
    diagnostic_exemplar:
      problem: 'Rewrite $340 \times 10^{-6}$ in proper scientific notation.'
      answer: '3.4 x 10^-4'
      solution_sketch: '$340 = 3.4 \times 10^2$, so the value is $3.4 \times 10^{2-6} = 3.4 \times 10^{-4}$.'
    anki_seeds:
      - front: "Scientific notation has the form a x 10^n with what restriction on a?"
        back: "1 <= a < 10 (positive n for large numbers, negative n for small numbers)"
        type: basic

  - id: scientific-notation
    name: "Scientific Notation"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: scientific-notation-conversion
        weight: 0.8
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.5
        key: true
      - id: decimal-operations
        weight: 0.4
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Multiply in scientific notation"
        key_prerequisites: [exponent-product-quotient-rules]
        step_check:
          step: 'Add the exponents: $10^{6 + (-3)} = 10^3$.'
          question: 'Why are the exponents $6$ and $-3$ added?'
          options:
            - 'Exponents are multiplied whenever the coefficients are multiplied'
            - 'The smaller exponent is always taken away from the larger one'
            - 'Adding $6$ and $-3$ is allowed only because $-3$ is a negative number'
            - 'The powers of $10$ are multiplied, so their exponents add'
          answer: 'The powers of $10$ are multiplied, so their exponents add'
          why: '$10^6 \cdot 10^{-3}$ is six factors of $10$ times three divisions by $10$, which leaves $10^3$; multiplying the exponents would give $10^{-18}$.'
        exemplars:
          - problem: 'Compute $(2 \times 10^3)(3 \times 10^4)$.'
            answer: "6*10^7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the coefficients: $2 \cdot 3 = 6$. Add the exponents: $10^{3+4} = 10^7$, so the product is $6 \times 10^7$.'
          - problem: 'What is $(3 \times 10^{-2})(2 \times 10^5)$?'
            answer: "6*10^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the coefficients: $3 \cdot 2 = 6$. Add the exponents: $10^{-2+5} = 10^3$, so the product is $6 \times 10^3$.'
          - problem: 'Light travels about $3 \times 10^5$ km each second. How far does light travel in $2 \times 10^3$ seconds?'
            answer: "6*10^8"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Distance is speed times time: $(3 \times 10^5)(2 \times 10^3)$. That is $6 \times 10^{5+3} = 6 \times 10^8$ km.'
          - problem: 'One hard drive stores $4 \times 10^{12}$ bytes. How many bytes can $2 \times 10^3$ such drives store?'
            answer: "8*10^15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the capacity of one drive by the number of drives. That gives $(4 \cdot 2) \times 10^{12+3} = 8 \times 10^{15}$ bytes.'
          - problem: 'Find the product $(3 \times 10^{-4})(3 \times 10^6)$.'
            answer: "9*10^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the coefficients: $3 \cdot 3 = 9$. Add the exponents: $10^{-4+6} = 10^2$, so the product is $9 \times 10^2$.'
          - problem: 'A sheet of paper is $1.2 \times 10^{-4}$ m thick. How tall is a stack of $5 \times 10^2$ sheets?'
            answer: "6*10^-2"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height is the thickness times the number of sheets. That is $(1.2 \cdot 5) \times 10^{-4+2} = 6 \times 10^{-2}$ m.'
          - problem: 'Compute $(4 \times 10^2)(2 \times 10^3)$.'
            answer: "8*10^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the coefficients: $4 \cdot 2 = 8$. Add the exponents: $10^{2+3} = 10^5$, so the product is $8 \times 10^5$.'
        constraints: "multiply coefficients, add exponents"
      - id: kp2
        name: "Divide in scientific notation"
        key_prerequisites: [exponent-product-quotient-rules]
        step_check:
          step: 'Subtract the exponents: $10^{6-3} = 10^3$.'
          question: 'Why is the exponent $3$ subtracted from $6$?'
          options:
            - 'Exponents are divided when the numbers are, like the coefficients'
            - 'The smaller exponent is always taken from the larger so it stays positive'
            - 'Dividing by $10^3$ removes three of the six factors of $10$ from the top'
            - 'Dividing by $10^3$ moves the three factors of $10$ to the top, giving $10^9$'
          answer: 'Dividing by $10^3$ removes three of the six factors of $10$ from the top'
          why: '$\frac{10^6}{10^3}$ cancels three factors of $10$ from top and bottom, leaving $10^{6-3} = 10^3$; dividing the exponents would give $10^2$.'
        exemplars:
          - problem: 'Compute $\frac{8 \times 10^5}{2 \times 10^2}$.'
            answer: "4*10^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $\frac{8}{2} = 4$. Subtract the exponents: $10^{5-2} = 10^3$, so the quotient is $4 \times 10^3$.'
          - problem: 'What is $\frac{9 \times 10^3}{3 \times 10^5}$?'
            answer: "3*10^-2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $\frac{9}{3} = 3$. Subtract the exponents: $10^{3-5} = 10^{-2}$, so the quotient is $3 \times 10^{-2}$.'
          - problem: 'The mass of Earth is about $6 \times 10^{24}$ kg, and the mass of the Moon is about $7.5 \times 10^{22}$ kg. How many times the mass of the Moon is the mass of Earth?'
            answer: "80"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the two masses: $\frac{6 \times 10^{24}}{7.5 \times 10^{22}} = 0.8 \times 10^{2}$. That is $80$, so Earth has about $80$ times the mass of the Moon.'
          - problem: 'Light travels about $3 \times 10^5$ km each second, and the Sun is about $1.5 \times 10^8$ km from Earth. How many seconds does sunlight take to reach Earth?'
            answer: "500"
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'Time is distance divided by speed: $\frac{1.5 \times 10^8}{3 \times 10^5} = 0.5 \times 10^3$. That is $500$ seconds.'
          - problem: 'A country of $5 \times 10^7$ people uses $2 \times 10^{10}$ litres of water each day. On average, how many litres does one person use each day?'
            answer: "400"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Share the total among the people: $\frac{2 \times 10^{10}}{5 \times 10^7} = 0.4 \times 10^3$. That is $400$ litres per person.'
          - problem: 'Find the quotient $\frac{9 \times 10^7}{3 \times 10^4}$.'
            answer: "3*10^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $\frac{9}{3} = 3$. Subtract the exponents: $10^{7-4} = 10^3$, so the quotient is $3 \times 10^3$.'
          - problem: 'A red blood cell is about $8 \times 10^{-6}$ m wide. How many red blood cells placed side by side would span $4 \times 10^{-2}$ m?'
            answer: "5000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the length by the width of one cell: $\frac{4 \times 10^{-2}}{8 \times 10^{-6}} = 0.5 \times 10^4$. That is $5000$ cells.'
          - problem: 'Nia computes $\frac{6 \times 10^8}{2 \times 10^2}$ as $3 \times 10^4$. What is the correct quotient?'
            answer: "3*10^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing subtracts the exponents, so $10^{8-2} = 10^6$ and $\frac{6}{2} = 3$. The quotient is $3 \times 10^6$.'
        constraints: "divide coefficients, subtract exponents"
      - id: kp3
        name: "Renormalize the result"
        key_prerequisites: [scientific-notation-conversion]
        step_check:
          step: 'The coefficient $63$ is too large; write it as $6.3\times10$.'
          question: 'Why does writing $63$ as $6.3\times10$ raise the exponent from $7$ to $8$?'
          options:
            - 'Moving the decimal point left lowers the exponent by one, from $7$ to $6$'
            - 'The extra $10$ joins $10^7$ to make $10^8$, so the value is unchanged'
            - 'The exponent must equal the number of digits in $63$, which is two'
            - 'The exponent goes up by $1$ because $6.3$ has one digit after the point'
          answer: 'The extra $10$ joins $10^7$ to make $10^8$, so the value is unchanged'
          why: '$63 \times 10^7 = 6.3 \times 10 \times 10^7 = 6.3 \times 10^8$; making the coefficient ten times smaller must make the power of ten ten times larger.'
        exemplars:
          - problem: 'Write $(4 \times 10^3)(5 \times 10^4)$ in scientific notation.'
            answer: "2*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The product is $20 \times 10^7$. Since $20 = 2 \times 10$, it equals $2 \times 10^8$.'
          - problem: 'Write $\frac{2 \times 10^2}{8 \times 10^5}$ in scientific notation.'
            answer: "2.5*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The quotient is $0.25 \times 10^{-3}$. Since $0.25 = 2.5 \times 10^{-1}$, it equals $2.5 \times 10^{-4}$.'
          - problem: 'A beach holds about $8 \times 10^6$ grains of sand in each cubic metre and contains $5 \times 10^4$ cubic metres of sand. About how many grains of sand are on the beach? Write the result in scientific notation.'
            answer: "4*10^11"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Multiply grains per cubic metre by cubic metres: $(8 \cdot 5) \times 10^{6+4} = 40 \times 10^{10}$. Renormalized, that is $4 \times 10^{11}$ grains.'
          - problem: 'The Milky Way contains about $2 \times 10^{11}$ stars, and a star cluster contains about $8 \times 10^2$ stars. How many times as many stars does the Milky Way contain? Write the result in scientific notation.'
            answer: "2.5*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Divide the two star counts: $\frac{2 \times 10^{11}}{8 \times 10^2} = 0.25 \times 10^9$. Renormalized, that is $2.5 \times 10^8$ times as many.'
          - problem: 'Ali writes $(5 \times 10^4)(6 \times 10^3)$ as $30 \times 10^7$ and then as $3 \times 10^6$. What is the correct scientific notation for the product?'
            answer: "3*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The product $30 \times 10^7$ is right. Since $30 = 3 \times 10$, the exponent goes up by one: $3 \times 10^8$.'
          - problem: 'Write $(6 \times 10^3)(4 \times 10^4)$ in scientific notation.'
            answer: "2.4*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The product is $24 \times 10^7$. Since $24 = 2.4 \times 10$, it equals $2.4 \times 10^8$.'
          - problem: 'Write $\frac{3 \times 10^2}{6 \times 10^5}$ in scientific notation.'
            answer: "5*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The quotient is $0.5 \times 10^{-3}$. Since $0.5 = 5 \times 10^{-1}$, it equals $5 \times 10^{-4}$.'
          - problem: 'A water molecule has a mass of about $3 \times 10^{-23}$ g. About how many water molecules are in a droplet of mass $1.5 \times 10^{-3}$ g? Write the result in scientific notation.'
            answer: "5*10^19"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Divide the droplet mass by the mass of one molecule: $\frac{1.5 \times 10^{-3}}{3 \times 10^{-23}} = 0.5 \times 10^{20}$. Renormalized, that is $5 \times 10^{19}$ molecules.'
        constraints: "coefficient must land back in [1, 10)"
    diagnostic_exemplar:
      problem: 'Write $(4 \times 10^2)(5 \times 10^5)$ in scientific notation.'
      answer: '2 x 10^8'
      solution_sketch: '$4 \times 5 = 20$ and $10^{2+5} = 10^7$; renormalize: $20 \times 10^7 = 2 \times 10^8$.'
    anki_seeds:
      - front: "Multiplying in scientific notation: coefficients are ___ and powers of 10 are ___"
