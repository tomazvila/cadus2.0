            answer: "7*sqrt(5)/5"
            solution_sketch: 'Multiply by $\frac{\sqrt{5}}{\sqrt{5}}$: $\frac{7\sqrt{5}}{5}$.'
        constraints: "multiply top and bottom by the radical"
      - id: kp2
        name: "Simplify before or after rationalizing"
        key_prerequisites: [dividing-radicals]
        exemplars:
          - problem: 'Rationalize and simplify $\frac{6}{\sqrt{12}}$.'
            answer: "sqrt(3)"
            solution_sketch: '$\frac{6}{2\sqrt{3}} = \frac{3}{\sqrt{3}} = \sqrt{3}$.'
          - problem: 'What is $\frac{4}{\sqrt{8}}$ rationalized and simplified?'
            answer: "sqrt(2)"
            solution_sketch: '$\frac{4}{2\sqrt{2}} = \frac{2}{\sqrt{2}} = \sqrt{2}$.'
          - problem: 'Rationalize and simplify $\frac{8}{\sqrt{20}}$.'
            answer: "4*sqrt(5)/5"
            solution_sketch: '$\frac{8}{2\sqrt{5}} = \frac{4}{\sqrt{5}} = \frac{4\sqrt{5}}{5}$.'
          - problem: 'Simplify the rationalized form of $\frac{9}{\sqrt{27}}$.'
            answer: "sqrt(3)"
            solution_sketch: '$\frac{9}{3\sqrt{3}} = \frac{3}{\sqrt{3}} = \sqrt{3}$.'
        constraints: "reduce the radical first to keep numbers small"
      - id: kp3
        name: "Conjugate denominators"
        key_prerequisites: [radical-operations]
        exemplars:
          - problem: 'Rationalize $\frac{2}{1 + \sqrt{3}}$.'
            answer: "sqrt(3) - 1"
            solution_sketch: 'Multiply by $\frac{1 - \sqrt{3}}{1 - \sqrt{3}}$: $\frac{2(1 - \sqrt{3})}{1 - 3} = \sqrt{3} - 1$.'
          - problem: 'Rationalize $\frac{1}{\sqrt{5} - 2}$.'
            answer: "sqrt(5) + 2"
            solution_sketch: '$\frac{\sqrt{5} + 2}{5 - 4} = \sqrt{5} + 2$.'
          - problem: 'Rationalize $\frac{3}{2 + \sqrt{5}}$.'
            answer: "-6 + 3*sqrt(5)"
            solution_sketch: 'Multiply by $\frac{2-\sqrt5}{2-\sqrt5}$: $\frac{3(2-\sqrt5)}{4-5} = -6 + 3\sqrt5$.'
          - problem: 'What is $\frac{1}{\sqrt{10} - 3}$ rationalized?'
            answer: "sqrt(10) + 3"
            solution_sketch: '$\frac{\sqrt{10}+3}{10-9} = \sqrt{10} + 3$.'
        constraints: "multiply by the conjugate; denominator becomes an integer"
    diagnostic_exemplar:
      problem: 'Rationalize $\frac{2}{\sqrt{3} + 1}$.'
      answer: 'sqrt(3) - 1'
      solution_sketch: 'Multiply by $\frac{\sqrt{3} - 1}{\sqrt{3} - 1}$: $\frac{2(\sqrt{3} - 1)}{2} = \sqrt{3} - 1$.'
    anki_seeds:
      - front: "To rationalize 1/sqrt(a), multiply by ..."
        back: "sqrt(a)/sqrt(a), giving sqrt(a)/a"
        type: basic
      - front: "To rationalize a denominator of the form a + sqrt(b), multiply by ..."
        back: "the conjugate a - sqrt(b)"
        type: basic

  - id: radical-exponent-conversion
