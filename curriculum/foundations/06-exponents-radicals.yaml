        visuals: [{"kind":"geometry","figure":{"shape":"polygon","vertices":[{"x":"0","y":"0","label":"A"},{"x":"8","y":"0","label":"B"},{"x":"8","y":"6","label":"C"}],"right_angles":[1]},"caption":"Reference example: A reference right triangle has legs 8 and 6 and hypotenuse 10; 8 squared plus 6 squared equals 10 squared."}]
