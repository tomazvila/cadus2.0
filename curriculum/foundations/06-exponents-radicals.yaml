  - id: square-roots
    name: "Square Roots"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: perfect-square-roots
        weight: 0.8
        key: true
      - id: multiplication-tables
        weight: 0.4
      - id: fraction-basics
        weight: 0.3
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Roots inside arithmetic expressions"
        key_prerequisites: [perfect-square-roots]
        step_check:
          step: 'Add the results: $5 + 4 = 9$.'
          question: 'Why may the two roots be found separately before adding?'
          options:
            - 'Roots split over addition, so this equals $\sqrt{41}$'
            - 'Each root is a single number, worked out before the addition'
            - 'Roots are always found last, after every addition is done'
            - 'Each root must be squared again before the sum, giving $25+16=41$'
          answer: 'Each root is a single number, worked out before the addition'
          why: 'Like a power, a root is evaluated before addition, so the sum is $5 + 4 = 9$; $\sqrt{41}$ is about $6.4$, a different number.'
        exemplars:
          - problem: 'Compute $\sqrt{36} + \sqrt{64}$.'
            answer: "14"
            solution_sketch: '$6 + 8 = 14$.'
          - problem: 'Compute $2\sqrt{81}$.'
            answer: "18"
            solution_sketch: '$2 \cdot 9 = 18$.'
          - problem: "Compute $\\sqrt{64}-\\sqrt{9}$."
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: "$8^2=64$ and $3^2=9$. Subtract the principal roots: $8-3=5$."
          - problem: "A square has area $9$ square metres. Find its perimeter in metres."
            answer: "12"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: "The side is $\\sqrt9=3$ metres; four equal sides give $4\\cdot3=12$ metres."
        constraints: "perfect-square radicands only"
      - id: kp2
        name: "Roots of fractions"
        key_prerequisites: [fraction-basics, perfect-square-roots]
        step_check:
          step: 'Split the root as $\sqrt{121}/\sqrt{225}$'
          question: 'Why may $\sqrt{121/225}$ be split into $\sqrt{121}/\sqrt{225}$?'
          options:
            - '$(11/15)^2 = 121/225$, so a root splits over division'
            - 'Any operation may be done to top and bottom separately'
            - 'Roots split over every operation, including addition'
            - 'Division is allowed because the denominator $225$ is a perfect square'
          answer: '$(11/15)^2 = 121/225$, so a root splits over division'
          why: 'Squaring a fraction squares its top and bottom, so the root undoes that on each part; sums behave differently, since $\sqrt{9+16} = 5$ while $3 + 4 = 7$.'
        exemplars:
          - problem: 'Compute $\sqrt{\frac{9}{16}}$.'
            answer: "3/4"
            solution_sketch: '$\frac{\sqrt{9}}{\sqrt{16}} = \frac{3}{4}$.'
          - problem: 'What is $\sqrt{\frac{49}{100}}$?'
            answer: "7/10"
            solution_sketch: '$\frac{\sqrt{49}}{\sqrt{100}} = \frac{7}{10}$.'
          - problem: 'Find $\sqrt{\frac{25}{36}}$.'
            answer: "5/6"
            solution_sketch: '$\frac{\sqrt{25}}{\sqrt{36}} = \frac{5}{6}$.'
          - problem: 'Evaluate $\sqrt{\frac{4}{9}}$.'
            answer: "2/3"
            solution_sketch: '$\frac{\sqrt{4}}{\sqrt{9}} = \frac{2}{3}$.'
          - problem: 'Compute $\sqrt{\frac{121}{144}}$.'
            answer: "11/12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take the root of the numerator and of the denominator: $\sqrt{121} = 11$ and $\sqrt{144} = 12$. So the root is $\frac{11}{12}$.'
          - problem: 'Simplify $\sqrt{\frac{18}{50}}$.'
            answer: "3/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Neither $18$ nor $50$ is a perfect square, so reduce first: $\frac{18}{50} = \frac{9}{25}$. Then $\sqrt{\frac{9}{25}} = \frac{3}{5}$.'
          - problem: 'A square tile has area $\frac{16}{81}$ square metre. Find its side length in metres.'
            answer: "4/9"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The side length is the square root of the area: $\sqrt{\frac{16}{81}} = \frac{\sqrt{16}}{\sqrt{81}}$. That gives a side of $\frac{4}{9}$ metre.'
        constraints: "root of a fraction = root of top over root of bottom"
      - id: kp3
        name: "Products of roots"
        key_prerequisites: [perfect-square-roots]
        step_check:
          step: 'Multiply: $15\cdot8=120$.'
          question: 'Why is $120$ also the value of $\sqrt{225 \cdot 64}$?'
          options:
            - 'Roots split over every operation, so this always works'
            - 'Multiplying first and rooting last gives a larger result'
            - 'Squaring $120$ gives $225+64$, because squares add up'
            - '$(15 \cdot 8)^2 = 15^2 \cdot 8^2 = 225 \cdot 64$'
          answer: '$(15 \cdot 8)^2 = 15^2 \cdot 8^2 = 225 \cdot 64$'
          why: 'Squaring a product squares each factor, so $120^2 = 225 \cdot 64$ and the product of the roots is the root of the product.'
        exemplars:
          - problem: 'Compute $\sqrt{100} \cdot \sqrt{4}$.'
            answer: "20"
            solution_sketch: '$10 \cdot 2 = 20$.'
          - problem: 'Compute $\sqrt{4 \cdot 9}$.'
            answer: "6"
            solution_sketch: '$\sqrt{36} = 6$, or $2 \cdot 3$.'
          - problem: "A rectangle has side lengths $\\sqrt9$ and $\\sqrt{16}$. Find its area."
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: "Area is the product of the sides: $\\sqrt9\\sqrt{16}=3\\cdot4=12$."
          - problem: 'Compute $\sqrt{2} \cdot \sqrt{8}$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Neither root is a whole number, but the product rule combines them: $\sqrt{2} \cdot \sqrt{8} = \sqrt{16}$. So the product is $4$.'
        constraints: "products of perfect squares"
    diagnostic_exemplar:
      problem: 'Compute $\sqrt{\frac{16}{25}} \cdot \sqrt{100}$.'
      answer: '8'
      solution_sketch: '$\frac{4}{5} \times 10 = 8$.'
    anki_seeds:
      - front: "The square root of a (a >= 0) is defined as ..."
        back: "the nonnegative number whose square is a (the inverse of squaring)"
        type: basic

