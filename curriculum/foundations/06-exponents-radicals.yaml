unit: exponents-radicals
course: foundations
module: "Exponents & Radicals"
topics:
  - id: exponent-product-rule
    name: "The Product Rule for Exponents"
    core: true
    difficulty: 0.30
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: integer-exponents-intro
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Multiply powers of the same base"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $x^3 \cdot x^4$.'
            answer: "x^7"
            solution_sketch: 'Add exponents: $3 + 4 = 7$.'
          - problem: 'Simplify $a^5 \cdot a^2$.'
            answer: "a^7"
        constraints: "same base; positive integer exponents; add exponents"
      - id: kp2
        name: "Numeric bases left in exponent form"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Write $2^3 \cdot 2^4$ as a single power of $2$.'
            answer: "2^7"
          - problem: 'Write $5^2 \cdot 5^3$ as a single power of $5$.'
            answer: "5^5"
        constraints: "answer stays as a single power, not evaluated"
      - id: kp3
        name: "Three or more factors, including bare bases"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $x \cdot x^3 \cdot x^2$.'
            answer: "x^6"
            solution_sketch: 'A bare $x$ is $x^1$; $1 + 3 + 2 = 6$.'
          - problem: 'Simplify $y^2 \cdot y \cdot y^4$.'
            answer: "y^7"
        constraints: "treat a bare base as exponent 1"
    diagnostic_exemplar:
      problem: 'Simplify $x \cdot x^3 \cdot x^5$.'
      answer: 'x^9'
      solution_sketch: 'A bare base counts as exponent $1$: $1 + 3 + 5 = 9$.'
    anki_seeds:
      - front: "Product rule: a^m * a^n = ?"
        back: "a^(m+n)"
        type: basic

  - id: exponent-quotient-rule
    name: "The Quotient Rule for Exponents"
    core: true
    difficulty: 0.32
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: integer-exponents-intro
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: exponent-product-rule
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Divide powers of the same base"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $\frac{x^8}{x^3}$.'
            answer: "x^5"
            solution_sketch: 'Subtract exponents: $8 - 3 = 5$.'
          - problem: 'Simplify $\frac{y^6}{y^2}$.'
            answer: "y^4"
        constraints: "same base; larger exponent on top; subtract exponents"
      - id: kp2
        name: "Numeric bases left in exponent form"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Write $\frac{3^5}{3^2}$ as a single power of $3$.'
            answer: "3^3"
          - problem: 'Write $\frac{7^6}{7^5}$ as a single power of $7$.'
            answer: "7^1"
        constraints: "answer stays as a single power, not evaluated"
      - id: kp3
        name: "Quotients that leave exponent 1, and bare bases"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $\frac{y^5}{y^4}$.'
            answer: "y"
            solution_sketch: '$y^{5-4} = y^1 = y$.'
          - problem: 'Simplify $\frac{x^6}{x}$.'
            answer: "x^5"
            solution_sketch: 'A bare $x$ is $x^1$; $6 - 1 = 5$.'
        constraints: "treat a bare base as exponent 1; keep results with positive exponents"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{x^7}{x}$.'
      answer: 'x^6'
      solution_sketch: 'The bare $x$ counts as exponent $1$: $7 - 1 = 6$.'
    anki_seeds:
      - front: "Quotient rule: a^m / a^n = ?"
        back: "a^(m-n)"
        type: basic

  - id: exponent-product-quotient-rules
    name: "Product and Quotient Rules for Exponents"
    core: true
    difficulty: 0.35
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: exponent-product-rule
        weight: 0.8
        key: true
      - id: exponent-quotient-rule
        weight: 0.8
        key: true
      - id: integer-multiplication-division
        weight: 0.5
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Product and quotient rules together"
        key_prerequisites: [exponent-product-rule, exponent-quotient-rule]
        exemplars:
          - problem: 'Simplify $\frac{x^5 \cdot x^2}{x^3}$.'
            answer: "x^4"
            solution_sketch: '$5 + 2 - 3 = 4$.'
          - problem: 'Simplify $\frac{a^4 \cdot a^4}{a^6}$.'
            answer: "a^2"
        constraints: "one product and one quotient step per problem"
      - id: kp2
        name: "Coefficients with product/quotient rules"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Simplify $(3x^2)(4x^5)$.'
            answer: "12x^7"
            solution_sketch: '$3 \cdot 4 = 12$; add exponents $2 + 5 = 7$.'
          - problem: 'Simplify $\frac{15a^7}{5a^4}$.'
            answer: "3a^3"
            solution_sketch: '$\frac{15}{5} = 3$; subtract exponents $7 - 4 = 3$.'
        constraints: "multiply/divide coefficients; apply exponent rule to variables"
      - id: kp3
        name: "Two variables at once"
        key_prerequisites: [exponent-product-rule, exponent-quotient-rule]
        exemplars:
          - problem: 'Simplify $(x^2 y^3)(x^4 y)$.'
            answer: "x^6 y^4"
            solution_sketch: 'Handle each base separately: $x^{2+4}$, $y^{3+1}$.'
          - problem: 'Simplify $\frac{a^5 b^3}{a^2 b}$.'
            answer: "a^3 b^2"
        constraints: "apply the rules base by base"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{(2x^3y)(6xy^2)}{4x^2y}$.'
      answer: '3x^2 y^2'
      solution_sketch: '$\frac{12x^4y^3}{4x^2y} = 3x^2y^2$.'
    anki_seeds:
      - front: "Simplifying (3x^2)(4x^5): the coefficients are ___ and the exponents are ___"
        back: "multiplied (3*4 = 12); added (2 + 5 = 7)"
        type: basic

  - id: power-of-a-power-rule
    name: "Power of a Power"
    core: true
    difficulty: 0.36
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.5
        key: true
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Multiply the exponents"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Simplify $(x^3)^4$.'
            answer: "x^12"
            solution_sketch: 'Multiply exponents: $3 \cdot 4 = 12$.'
          - problem: 'Simplify $(a^5)^2$.'
            answer: "a^10"
        constraints: "single variable base; multiply the exponents"
      - id: kp2
        name: "Numeric bases left in exponent form"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Write $(2^2)^3$ as a single power of $2$.'
            answer: "2^6"
            solution_sketch: '$2 \cdot 3 = 6$.'
          - problem: 'Write $(10^3)^2$ as a single power of $10$.'
            answer: "10^6"
        constraints: "answer stays as a single power, not evaluated"
      - id: kp3
        name: "Combine with product and quotient rules"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $(x^2)^3 \cdot x^4$.'
            answer: "x^10"
            solution_sketch: '$x^6 \cdot x^4 = x^{10}$.'
          - problem: 'Simplify $\frac{(y^3)^3}{y^4}$.'
            answer: "y^5"
            solution_sketch: '$y^9 / y^4 = y^5$.'
        constraints: "power of a power first, then product/quotient rule"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{(x^4)^2}{x^3}$.'
      answer: 'x^5'
      solution_sketch: '$(x^4)^2 = x^8$, then $8 - 3 = 5$.'
    anki_seeds:
      - front: "Power of a power: (a^m)^n = ?"
        back: "a^(m*n)"
        type: basic

  - id: power-rule-exponents
    name: "Power Rules for Exponents"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: power-of-a-power-rule
        weight: 0.7
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Power of a product"
        key_prerequisites: [power-of-a-power-rule]
        exemplars:
          - problem: 'Simplify $(2x)^3$.'
            answer: "8x^3"
            solution_sketch: '$2^3 = 8$; $x^3$.'
          - problem: 'Simplify $(3a^2)^2$.'
            answer: "9a^4"
            solution_sketch: '$3^2 = 9$; $(a^2)^2 = a^4$.'
        constraints: "raise each factor to the power"
      - id: kp2
        name: "Power of a quotient"
        key_prerequisites: [power-of-a-power-rule]
        exemplars:
          - problem: 'Simplify $(x^2 / y)^3$.'
            answer: "x^6 / y^3"
          - problem: 'Simplify $(2 / x^3)^2$.'
            answer: "4 / x^6"
            solution_sketch: '$2^2 = 4$; $(x^3)^2 = x^6$.'
        constraints: "raise numerator and denominator to the power"
      - id: kp3
        name: "Combinations of power rules"
        key_prerequisites: [exponent-product-quotient-rules, power-of-a-power-rule]
        exemplars:
          - problem: 'Simplify $(2x^3)^2 \cdot x$.'
            answer: "4x^7"
            solution_sketch: '$(2x^3)^2 = 4x^6$; times $x = 4x^7$.'
          - problem: 'Simplify $(3x^2)^2 (2x)$.'
            answer: "18x^5"
            solution_sketch: '$9x^4 \cdot 2x = 18x^5$.'
        constraints: "power rules first, then product rule; small coefficients"
    diagnostic_exemplar:
      problem: 'Simplify $(2x^2)^3 \cdot x^2$.'
      answer: '8x^8'
      solution_sketch: '$(2x^2)^3 = 8x^6$, then $8x^6 \cdot x^2 = 8x^8$.'
    anki_seeds:
      - front: "Power of a product: (a*b)^n = ?"
        back: "a^n * b^n"
        type: basic
      - front: "Power of a quotient: (a/b)^n = ?"
        back: "a^n / b^n"
        type: basic

  - id: zero-exponent-rule
    name: "The Zero Exponent"
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-exponents-intro
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Evaluate a nonzero base to the zero power"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Simplify $5^0$.'
            answer: "1"
          - problem: 'Simplify $(-4)^0$.'
            answer: "1"
        constraints: "any nonzero base to the 0 power is 1"
      - id: kp2
        name: "Zero exponents inside expressions"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $(3x)^0$ for $x \ne 0$.'
            answer: "1"
          - problem: 'Simplify $3x^0$ for $x \ne 0$.'
            answer: "3"
            solution_sketch: 'Only $x$ carries the exponent: $3 \cdot 1 = 3$.'
        constraints: "contrast (ax)^0 with a*x^0"
      - id: kp3
        name: "Why it works: the quotient rule"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Use the quotient rule to write $\frac{x^5}{x^5}$ as a single power of $x$. What is that power worth for $x \ne 0$?'
            answer: "1"
            solution_sketch: '$x^{5-5} = x^0$; but any nonzero number divided by itself is $1$, so $x^0 = 1$.'
          - problem: 'Compute $2^0 + 3^0$.'
            answer: "2"
        constraints: "connect a^0 = 1 to a^n / a^n"
    diagnostic_exemplar:
      problem: 'Evaluate $5x^0 + (3x)^0$ for $x \ne 0$.'
      answer: '6'
      solution_sketch: '$5x^0 = 5$ but $(3x)^0 = 1$, so $5 + 1 = 6$.'
    anki_seeds:
      - front: "Any nonzero base to the zero power equals ..."
        back: "1"
        type: basic

  - id: negative-zero-exponents
    name: "Negative and Zero Exponents"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: zero-exponent-rule
        weight: 0.6
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: power-rule-exponents
        weight: 0.3
      - id: dividing-fractions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Negative exponent as a reciprocal"
        key_prerequisites: [dividing-fractions]
        exemplars:
          - problem: 'Write $2^{-3}$ as a fraction.'
            answer: "1/8"
            solution_sketch: '$\frac{1}{2^3} = \frac{1}{8}$.'
          - problem: 'Rewrite $x^{-2}$ with a positive exponent.'
            answer: "1/x^2"
        constraints: "a^-n = 1/a^n"
      - id: kp2
        name: "Negative exponents in denominators"
        key_prerequisites: [dividing-fractions]
        exemplars:
          - problem: 'Rewrite $\frac{1}{x^{-3}}$ with a positive exponent.'
            answer: "x^3"
            solution_sketch: 'Dividing by $\frac{1}{x^3}$ multiplies by $x^3$.'
          - problem: 'Write $\left(\frac{2}{3}\right)^{-1}$ as a fraction.'
            answer: "3/2"
        constraints: "a^-n in a denominator moves up as a^n; (a/b)^-1 = b/a"
      - id: kp3
        name: "Combine with exponent rules"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $x^3 \cdot x^{-5}$ and write with a positive exponent.'
            answer: "1/x^2"
            solution_sketch: '$x^{3-5} = x^{-2} = \frac{1}{x^2}$.'
          - problem: 'Simplify $3x^{-2} \cdot x^5$.'
            answer: "3x^3"
            solution_sketch: '$3 \cdot x^{-2+5} = 3x^3$.'
        constraints: "combine exponents first, then rewrite negatives as reciprocals"
    diagnostic_exemplar:
      problem: 'Simplify $x^2 \cdot x^{-5}$ and write with a positive exponent.'
      answer: "1/x^3"
      solution_sketch: '$x^{2-5} = x^{-3} = \frac{1}{x^3}$.'
    anki_seeds:
      - front: "Negative exponent rule: a^-n = ?"
        back: "1/a^n (the reciprocal)"
        type: basic
      - front: "1 / a^-n = ?"
        back: "a^n"
        type: basic

  - id: simplifying-negative-exponent-expressions
    name: "Simplifying Expressions with Negative Exponents"
    core: false                # multi-rule drill; the exponent rules stay core
    difficulty: 0.50
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: negative-zero-exponents
        weight: 0.8
        key: true
      - id: power-rule-exponents
        weight: 0.5
        key: true
      - id: dividing-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Quotients with negative exponents"
        key_prerequisites: [negative-zero-exponents]
        exemplars:
          - problem: 'Simplify $\frac{x^2}{x^{-3}}$ and write with a positive exponent.'
            answer: "x^5"
            solution_sketch: '$x^{2-(-3)} = x^5$.'
          - problem: 'Simplify $\frac{y^{-4}}{y^{-1}}$ and write with a positive exponent.'
            answer: "1/y^3"
            solution_sketch: '$y^{-4-(-1)} = y^{-3} = \frac{1}{y^3}$.'
        constraints: "subtract exponents carefully with signs; final answer uses positive exponents"
      - id: kp2
        name: "Powers of terms with negative exponents"
        key_prerequisites: [power-rule-exponents, negative-zero-exponents]
        exemplars:
          - problem: 'Simplify $(x^{-2})^3$ and write with a positive exponent.'
            answer: "1/x^6"
            solution_sketch: '$x^{-6} = \frac{1}{x^6}$.'
          - problem: 'Simplify $(2x^{-1})^2$ and write with positive exponents.'
            answer: "4/x^2"
            solution_sketch: '$2^2 x^{-2} = \frac{4}{x^2}$.'
        constraints: "multiply exponents, keep track of the sign"
      - id: kp3
        name: "Full expressions with coefficients and two variables"
        key_prerequisites: [negative-zero-exponents, power-rule-exponents]
        exemplars:
          - problem: 'Simplify $\frac{6x^{-2}y}{3xy^{-3}}$ and write with positive exponents.'
            answer: "2y^4 / x^3"
            solution_sketch: '$\frac{6}{3} = 2$; $x^{-2-1} = x^{-3}$; $y^{1-(-3)} = y^4$.'
          - problem: 'Simplify $(3x^2)^{-1}$ and write with positive exponents.'
            answer: "1/(3x^2)"
        constraints: "coefficients reduce; each variable handled separately"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{8x^{-1}y^2}{4x^2y^{-1}}$ and write with positive exponents.'
      answer: '2y^3 / x^3'
      solution_sketch: '$\frac{8}{4} = 2$; $x^{-1-2} = x^{-3}$; $y^{2-(-1)} = y^3$.'
    anki_seeds:
      - front: "A factor x^-m in a denominator moves to the numerator as ..."
        back: "x^m"
        type: basic

  - id: scientific-notation-conversion
    name: "Converting To and From Scientific Notation"
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: place-value
        weight: 0.5
        key: true
      - id: decimal-operations
        weight: 0.5
        key: true
      - id: negative-zero-exponents
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Convert large numbers to and from scientific notation"
        key_prerequisites: [place-value]
        exemplars:
          - problem: 'Write $45000$ in scientific notation.'
            answer: "4.5 x 10^4"
          - problem: 'Write $3.2 \times 10^3$ as a standard number.'
            answer: "3200"
        constraints: "coefficient a satisfies 1 <= a < 10"
      - id: kp2
        name: "Small numbers with negative exponents"
        key_prerequisites: [negative-zero-exponents]
        exemplars:
          - problem: 'Write $0.00072$ in scientific notation.'
            answer: "7.2 x 10^-4"
          - problem: 'Write $6 \times 10^{-3}$ as a decimal.'
            answer: "0.006"
        constraints: "negative exponent for numbers less than 1"
      - id: kp3
        name: "Valid form and comparing magnitudes"
        key_prerequisites: [place-value, negative-zero-exponents]
        exemplars:
          - problem: 'Rewrite $12 \times 10^3$ in proper scientific notation.'
            answer: "1.2 x 10^4"
            solution_sketch: '$12 = 1.2 \times 10$; add one to the exponent.'
          - problem: 'Which is larger: $3 \times 10^5$ or $9 \times 10^4$?'
            answer: "3 x 10^5"
            solution_sketch: 'Compare exponents first: $10^5 > 10^4$.'
        constraints: "renormalize the coefficient into [1, 10); compare exponents before coefficients"
    diagnostic_exemplar:
      problem: 'Rewrite $340 \times 10^{-6}$ in proper scientific notation.'
      answer: '3.4 x 10^-4'
      solution_sketch: '$340 = 3.4 \times 10^2$, so the value is $3.4 \times 10^{2-6} = 3.4 \times 10^{-4}$.'
    anki_seeds:
      - front: "Scientific notation has the form a x 10^n with what restriction on a?"
        back: "1 <= a < 10 (positive n for large numbers, negative n for small numbers)"
        type: basic

  - id: scientific-notation
    name: "Scientific Notation"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: scientific-notation-conversion
        weight: 0.8
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.5
        key: true
      - id: decimal-operations
        weight: 0.4
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Multiply in scientific notation"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Compute $(2 \times 10^3)(3 \times 10^4)$.'
            answer: "6 x 10^7"
            solution_sketch: '$2 \cdot 3 = 6$; $10^{3+4} = 10^7$.'
          - problem: 'Compute $(3 \times 10^{-2})(2 \times 10^5)$.'
            answer: "6 x 10^3"
            solution_sketch: '$3 \cdot 2 = 6$; $10^{-2+5} = 10^3$.'
        constraints: "multiply coefficients, add exponents"
      - id: kp2
        name: "Divide in scientific notation"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Compute $\frac{8 \times 10^5}{2 \times 10^2}$.'
            answer: "4 x 10^3"
            solution_sketch: '$\frac{8}{2} = 4$; $10^{5-2} = 10^3$.'
          - problem: 'Compute $\frac{9 \times 10^3}{3 \times 10^5}$.'
            answer: "3 x 10^-2"
            solution_sketch: '$\frac{9}{3} = 3$; $10^{3-5} = 10^{-2}$.'
        constraints: "divide coefficients, subtract exponents"
      - id: kp3
        name: "Renormalize the result"
        key_prerequisites: [scientific-notation-conversion]
        exemplars:
          - problem: 'Compute $(4 \times 10^3)(5 \times 10^4)$ in proper scientific notation.'
            answer: "2 x 10^8"
            solution_sketch: '$20 \times 10^7 = 2 \times 10^8$.'
          - problem: 'Compute $\frac{2 \times 10^2}{8 \times 10^5}$ in proper scientific notation.'
            answer: "2.5 x 10^-4"
            solution_sketch: '$0.25 \times 10^{-3} = 2.5 \times 10^{-4}$.'
        constraints: "coefficient must land back in [1, 10)"
    diagnostic_exemplar:
      problem: 'Compute $(4 \times 10^2)(5 \times 10^5)$ in proper scientific notation.'
      answer: '2 x 10^8'
      solution_sketch: '$4 \times 5 = 20$ and $10^{2+5} = 10^7$; renormalize: $20 \times 10^7 = 2 \times 10^8$.'
    anki_seeds:
      - front: "Multiplying in scientific notation: coefficients are ___ and powers of 10 are ___"
        back: "multiplied; added (renormalize if the coefficient leaves [1, 10))"
        type: basic

  - id: scientific-notation-addition-subtraction
    name: "Adding and Subtracting in Scientific Notation"
    core: false                # format-specific arithmetic drill; the notation stays core
    difficulty: 0.48
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: scientific-notation
        weight: 0.7
        key: true
      - id: decimal-operations
        weight: 0.5
        key: true
      - id: place-value
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Same power of 10"
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: 'Compute $3.2 \times 10^4 + 4.5 \times 10^4$.'
            answer: "7.7 x 10^4"
            solution_sketch: 'Same power: add coefficients $3.2 + 4.5$.'
          - problem: 'Compute $8 \times 10^3 - 2 \times 10^3$.'
            answer: "6 x 10^3"
        constraints: "matching exponents; add or subtract coefficients only"
      - id: kp2
        name: "Different powers: match exponents first"
        key_prerequisites: [scientific-notation]
        exemplars:
          - problem: 'Compute $5 \times 10^4 + 3 \times 10^3$ in scientific notation.'
            answer: "5.3 x 10^4"
            solution_sketch: '$3 \times 10^3 = 0.3 \times 10^4$; $5 + 0.3 = 5.3$.'
          - problem: 'Compute $6.2 \times 10^5 - 4 \times 10^4$ in scientific notation.'
            answer: "5.8 x 10^5"
            solution_sketch: '$4 \times 10^4 = 0.4 \times 10^5$; $6.2 - 0.4 = 5.8$.'
        constraints: "rewrite the smaller-exponent term to match the larger exponent"
      - id: kp3
        name: "Renormalize after adding"
        key_prerequisites: [scientific-notation, decimal-operations]
        exemplars:
          - problem: 'Compute $9 \times 10^3 + 8 \times 10^3$ in proper scientific notation.'
            answer: "1.7 x 10^4"
            solution_sketch: '$17 \times 10^3 = 1.7 \times 10^4$.'
          - problem: 'Compute $1.05 \times 10^6 - 9.5 \times 10^5$ in proper scientific notation.'
            answer: "1 x 10^5"
            solution_sketch: '$10.5 \times 10^5 - 9.5 \times 10^5 = 1.0 \times 10^5$.'
        constraints: "coefficient must land back in [1, 10)"
    diagnostic_exemplar:
      problem: 'Compute $9.5 \times 10^4 + 8 \times 10^3$ in proper scientific notation.'
      answer: '1.03 x 10^5'
      solution_sketch: '$95{,}000 + 8{,}000 = 103{,}000 = 1.03 \times 10^5$.'
    anki_seeds:
      - front: "Before adding numbers in scientific notation you must ..."
        back: "rewrite them with the same power of 10"
        type: basic

