            answer: "5*sqrt(2)"
            solution_sketch: '$2\sqrt{2} + 4\sqrt{2} - \sqrt{2} = 5\sqrt{2}$.'
          - problem: 'What is $3\sqrt{20} - \sqrt{45}$?'
            answer: "3*sqrt(5)"
