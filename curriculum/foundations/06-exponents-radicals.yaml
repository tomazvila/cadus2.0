          - problem: "Squares built on the three sides of a triangle have areas $64$, $225$, and $289$. Is the triangle right?"
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: "The largest side has square area $289$. Since $64+225=289$, the converse proves a right angle."
          - problem: "A builder measures two sides of a triangular brace as $7$ and $24$ cm and the opposite side as $25$ cm. Are the first two sides perpendicular?"
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: "$7^2+24^2=49+576=625=25^2$. The angle opposite the longest side is right."
          - problem: "The triple $(3,4,5)$ is scaled by $8$. Does the scaled triangle remain right?"
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
