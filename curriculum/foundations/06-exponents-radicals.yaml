          - problem: 'Expand and simplify $\sqrt{3}(\sqrt{12} - \sqrt{2})$.'
            answer: "6 - sqrt(6)"
            solution_sketch: '$\sqrt{36} - \sqrt{6} = 6 - \sqrt{6}$.'
          - problem: 'Expand and simplify $\sqrt{5}(3\sqrt{5} + 2)$.'
            answer: "15 + 2*sqrt(5)"
            solution_sketch: '$3 \cdot 5 + 2\sqrt{5}$.'
