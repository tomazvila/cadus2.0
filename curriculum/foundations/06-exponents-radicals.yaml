            answer: "no solution"
            answer_contract: {"kind":"label","options":[["no solution"],["x = 4"],["x = -2"]]}
            solution_sketch: 'A square root is never negative, so no $x$ makes $\sqrt{x} = -2$ true.'
          - problem: 'Solve $\sqrt{3x + 1} = 4$ and check.'
            answer: "x = 5"
            answer_contract: {kind: exact}
            solution_sketch: '$3x + 1 = 16$; check: $\sqrt{16} = 4$.'
          - problem: 'What is the solution to $\sqrt{x} = -5$?'
            answer: "no solution"
            answer_contract: {"kind":"label","options":[["no solution"],["x = 25"],["x = -5"]]}
            solution_sketch: 'A square root is never negative, so no $x$ makes $\sqrt{x} = -5$ true.'
          - problem: 'Find $x$ so that $\sqrt{2x + 1} = 3$, then check your answer.'
            answer: "x = 4"
            answer_contract: {kind: exact}
            solution_sketch: '$2x + 1 = 9$; $x = 4$; check: $\sqrt{9} = 3$.'
        constraints: "always substitute back; sqrt(...) = negative has no solution"
    diagnostic_exemplar:
      problem: 'Solve $3\sqrt{x} + 2 = 14$.'
      answer: 'x = 16'
      solution_sketch: '$3\sqrt{x} = 12$; $\sqrt{x} = 4$; $x = 16$.'
    anki_seeds:
      - front: "sqrt(x) = k has a solution only when ..."
        back: "k >= 0 (then x = k^2); always check for extraneous roots after squaring"
        type: basic
