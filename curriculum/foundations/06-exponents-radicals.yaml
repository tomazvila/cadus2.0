  - id: square-roots
    name: "Square Roots"
    core: true
    difficulty: 0.35
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: perfect-square-roots
        weight: 0.8
        key: true
      - id: multiplication-tables
        weight: 0.4
      - id: fraction-basics
        weight: 0.3
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Roots inside arithmetic expressions"
        key_prerequisites: [perfect-square-roots]
        exemplars:
          - problem: 'Compute $\sqrt{36} + \sqrt{64}$.'
            answer: "14"
            solution_sketch: '$6 + 8 = 14$.'
          - problem: 'Compute $2\sqrt{81}$.'
            answer: "18"
            solution_sketch: '$2 \cdot 9 = 18$.'
          - problem: "Compute $\\sqrt{64}-\\sqrt{9}$."
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: "$8^2=64$ and $3^2=9$. Subtract the principal roots: $8-3=5$."
          - problem: "A square has area $9$ square metres. Find its perimeter in metres."
            answer: "12"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: "The side is $\\sqrt9=3$ metres; four equal sides give $4\\cdot3=12$ metres."
        constraints: "perfect-square radicands only"
      - id: kp2
        name: "Roots of fractions"
        key_prerequisites: [fraction-basics, perfect-square-roots]
        exemplars:
          - problem: 'Compute $\sqrt{\frac{9}{16}}$.'
            answer: "3/4"
            solution_sketch: '$\frac{\sqrt{9}}{\sqrt{16}} = \frac{3}{4}$.'
          - problem: 'What is $\sqrt{\frac{49}{100}}$?'
            answer: "7/10"
            solution_sketch: '$\frac{\sqrt{49}}{\sqrt{100}} = \frac{7}{10}$.'
          - problem: 'Find $\sqrt{\frac{25}{36}}$.'
            answer: "5/6"
            solution_sketch: '$\frac{\sqrt{25}}{\sqrt{36}} = \frac{5}{6}$.'
          - problem: 'Evaluate $\sqrt{\frac{4}{9}}$.'
            answer: "2/3"
            solution_sketch: '$\frac{\sqrt{4}}{\sqrt{9}} = \frac{2}{3}$.'
          - problem: 'Compute $\sqrt{\frac{121}{144}}$.'
            answer: "11/12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take the root of the numerator and of the denominator: $\sqrt{121} = 11$ and $\sqrt{144} = 12$. So the root is $\frac{11}{12}$.'
          - problem: 'Simplify $\sqrt{\frac{18}{50}}$.'
            answer: "3/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Neither $18$ nor $50$ is a perfect square, so reduce first: $\frac{18}{50} = \frac{9}{25}$. Then $\sqrt{\frac{9}{25}} = \frac{3}{5}$.'
          - problem: 'A square tile has area $\frac{16}{81}$ square metre. Find its side length in metres.'
            answer: "4/9"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The side length is the square root of the area: $\sqrt{\frac{16}{81}} = \frac{\sqrt{16}}{\sqrt{81}}$. That gives a side of $\frac{4}{9}$ metre.'
        constraints: "root of a fraction = root of top over root of bottom"
      - id: kp3
        name: "Products of roots"
        key_prerequisites: [perfect-square-roots]
        exemplars:
          - problem: 'Compute $\sqrt{100} \cdot \sqrt{4}$.'
            answer: "20"
            solution_sketch: '$10 \cdot 2 = 20$.'
          - problem: 'Compute $\sqrt{4 \cdot 9}$.'
            answer: "6"
            solution_sketch: '$\sqrt{36} = 6$, or $2 \cdot 3$.'
          - problem: "A rectangle has side lengths $\\sqrt9$ and $\\sqrt{16}$. Find its area."
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: "Area is the product of the sides: $\\sqrt9\\sqrt{16}=3\\cdot4=12$."
          - problem: 'Compute $\sqrt{2} \cdot \sqrt{8}$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Neither root is a whole number, but the product rule combines them: $\sqrt{2} \cdot \sqrt{8} = \sqrt{16}$. So the product is $4$.'
        constraints: "products of perfect squares"
    diagnostic_exemplar:
      problem: 'Compute $\sqrt{\frac{16}{25}} \cdot \sqrt{100}$.'
      answer: '8'
      solution_sketch: '$\frac{4}{5} \times 10 = 8$.'
    anki_seeds:
      - front: "The square root of a (a >= 0) is defined as ..."
        back: "the nonnegative number whose square is a (the inverse of squaring)"
        type: basic

  - id: estimating-square-roots
    name: "Estimating Square Roots"
    core: false                # estimation leaf topic
    difficulty: 0.38
    drill: false
    answer_kind: numeric
    expected_time_secs: 60
    prerequisites:
      - id: square-roots
        weight: 0.7
        key: true
      - id: rounding-estimation
        weight: 0.4
      - id: number-line-integers
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Bracket a root between consecutive integers"
        key_prerequisites: [square-roots]
        try_first:
          problem: 'A square of area $16$ cm² has side $4$ cm and a square of area $25$ cm² has side $5$ cm. Is the side of a square of area $20$ cm² longer than $4$ cm and shorter than $5$ cm?'
          answer_contract: {"kind":"label","options":[["yes","yes it is","it is","longer and shorter"],["no","no it is not","it is not"]]}
          answer: 'yes'
          reveal: 'A larger area means a longer side, so an area between $16$ and $25$ gives a side between $4$ and $5$. This is how a square root is trapped between two consecutive integers.'
        exemplars:
          - problem: 'Between which two consecutive integers does $\sqrt{20}$ lie?'
            answer: "4, 5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Find the perfect squares on either side of $20$: $16 < 20 < 25$. Taking square roots gives $4 < \sqrt{20} < 5$.'
          - problem: 'A square garden has an area of $55$ square metres. Between which two whole numbers of metres does its side length lie?'
            answer: "7, 8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side length is $\sqrt{55}$ metres. Since $49 < 55 < 64$, the side is between $7$ m and $8$ m.'
          - problem: '$\sqrt{40}$ lies between which two consecutive integers?'
            answer: "6, 7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Find the perfect squares on either side of $40$: $36 < 40 < 49$. Taking square roots gives $6 < \sqrt{40} < 7$.'
          - problem: 'A square screen has an area of $150$ square centimetres. Between which two whole numbers of centimetres does its side length lie?'
            answer: "12, 13"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side length is $\sqrt{150}$ centimetres. Since $144 < 150 < 169$, the side is between $12$ cm and $13$ cm.'
          - problem: 'Between which two consecutive integers does $\sqrt{110}$ lie?'
            answer: "10, 11"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Find the perfect squares on either side of $110$: $100 < 110 < 121$. Taking square roots gives $10 < \sqrt{110} < 11$.'
          - problem: 'A square sheet of card has an area of $120$ square centimetres. How many whole centimetres of length fit along one side of the sheet?'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The sheet has side $\sqrt{120}$ cm, and $100 < 120 < 121$ puts that between $10$ and $11$. Ten whole centimetres fit along that side but eleven do not, so the answer is $10$.'
          - problem: 'Sam says $\sqrt{30}$ lies between $15$ and $16$ because $30 \div 2 = 15$. Between which two consecutive integers does it lie?'
            answer: "5, 6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam halved the radicand, but a root needs the squares on either side. Since $25 < 30 < 36$, the root is between $5$ and $6$.'
          - problem: 'Between which two consecutive integers does $\sqrt{175}$ lie?'
            answer: "13, 14"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Find the perfect squares on either side of $175$: $169 < 175 < 196$. Taking square roots gives $13 < \sqrt{175} < 14$.'
        constraints: "non-perfect-square radicands under 200"
      - id: kp2
        name: "Round a root to the nearest integer"
        key_prerequisites: [square-roots, rounding-estimation]
        exemplars:
          - problem: 'Estimate $\sqrt{50}$ to the nearest integer.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The neighbouring squares are $49$ and $64$, and $50$ is much closer to $49$. So $\sqrt{50}$ rounds to $7$.'
          - problem: 'What is $\sqrt{8}$ rounded to the nearest integer?'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The neighbouring squares are $4$ and $9$, and $8$ is closer to $9$. So $\sqrt{8}$ rounds to $3$.'
          - problem: 'A square plot has an area of $135$ square metres. To the nearest metre, how long is one side?'
            answer: "12"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The side is $\sqrt{135}$ m. The neighbouring squares are $121$ and $144$, and $135$ is closer to $144$, so the side is about $12$ m.'
          - problem: 'Round $\sqrt{40}$ to the nearest integer.'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The neighbouring squares are $36$ and $49$, and $40$ is closer to $36$. So $\sqrt{40}$ rounds to $6$.'
          - problem: 'A square lens cap has an area of $28$ square centimetres. To the nearest centimetre, how wide is it?'
            answer: "5"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The width is $\sqrt{28}$ cm. The neighbouring squares are $25$ and $36$, and $28$ is closer to $25$, so the cap is about $5$ cm wide.'
          - problem: 'What is the nearest integer to $\sqrt{157}$?'
            answer: "13"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The neighbouring squares are $144$ and $169$. Since $157 - 144 = 13$ and $169 - 157 = 12$, the radicand is closer to $169$, so $\sqrt{157}$ rounds to $13$.'
          - problem: 'A square room has an area of $70$ square metres and is tiled with tiles that are $1$ m wide. To the nearest whole number, how many tiles fit along one wall?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The wall is $\sqrt{70}$ m long. The neighbouring squares are $64$ and $81$, and $70$ is closer to $64$, so about $8$ tiles fit along one wall.'
          - problem: 'Sam says $\sqrt{39}$ rounds to $7$ because $7^2 = 49$ is the next square after $39$. What is the correct nearest integer?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam ignored the square below. The neighbouring squares are $36$ and $49$, and $39 - 36 = 3$ is much less than $49 - 39 = 10$, so $\sqrt{39}$ rounds to $6$.'
        constraints: "compare distances to the two nearest perfect squares"
      - id: kp3
        name: "Order values involving roots"
        key_prerequisites: [square-roots, number-line-integers]
        exemplars:
          - problem: 'Order from least to greatest: $5$, $\sqrt{30}$, $6$.'
            answer: "5, sqrt(30), 6"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'Square the three numbers: $25$, $30$ and $36$. Since $25 < 30 < 36$, the order is $5 < \sqrt{30} < 6$.'
          - problem: 'Which is larger, $\sqrt{60}$ or $8$?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square both numbers: $60$ and $8^2 = 64$. Since $64 > 60$, the number $8$ is larger.'
          - problem: 'A square tile has an area of $60$ square centimetres. Is its side longer or shorter than $8$ cm?'
            answer: "shorter"
            answer_contract: {"kind":"label","options":[["shorter","it is shorter","shorter than 8 cm","less"],["longer","it is longer","longer than 8 cm","more"]]}
            solution_sketch: 'The side is $\sqrt{60}$ cm and a side of $8$ cm gives an area of $64$ square centimetres. Since $60 < 64$, the side is shorter than $8$ cm.'
          - problem: 'Arrange $6$, $\sqrt{40}$ and $7$ from least to greatest.'
            answer: "6, sqrt(40), 7"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'Square the three numbers: $36$, $40$ and $49$. Since $36 < 40 < 49$, the order is $6 < \sqrt{40} < 7$.'
          - problem: 'Which is larger, $\sqrt{50}$ or $7.1$?'
            answer: "7.1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square both numbers: $50$ and $7.1^2 = 50.41$. Since $50.41 > 50$, the number $7.1$ is larger.'
          - problem: 'A square has an area of $200$ square centimetres. Is its side longer or shorter than $14$ cm?'
            answer: "longer"
            answer_contract: {"kind":"label","options":[["shorter","it is shorter","shorter than 14 cm","less"],["longer","it is longer","longer than 14 cm","more"]]}
            solution_sketch: 'The side is $\sqrt{200}$ cm and a side of $14$ cm gives an area of $196$ square centimetres. Since $200 > 196$, the side is longer than $14$ cm.'
          - problem: 'Sam says $\sqrt{50}$ is larger than $8$ because $50$ is larger than $8$. Which is larger, $\sqrt{50}$ or $8$?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam compared $50$ with $8$ instead of with $8^2$. Since $8^2 = 64$ is greater than $50$, the number $8$ is larger.'
          - problem: 'Order $\sqrt{18}$, $4$, $\sqrt{10}$ and $3$ from least to greatest.'
            answer: "3, sqrt(10), 4, sqrt(18)"
            answer_contract: {"kind":"list","member":{"kind":"exact"},"ordered":true}
            solution_sketch: 'Square the four numbers: $18$, $16$, $10$ and $9$. Since $9 < 10 < 16 < 18$, the order is $3 < \sqrt{10} < 4 < \sqrt{18}$.'
        constraints: "compare by squaring"
    diagnostic_exemplar:
      problem: 'Estimate $\sqrt{75}$ to the nearest integer.'
      answer: '9'
      solution_sketch: '$64 < 75 < 81$, and $75$ is closer to $81$ than to $64$.'
    anki_seeds:
      - front: "To locate sqrt(n) between consecutive integers, bracket n by ..."
        back: "the nearest perfect squares below and above n"
        type: basic

