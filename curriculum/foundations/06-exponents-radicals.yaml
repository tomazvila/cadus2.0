            answer: "x^(1/2)"
            solution_sketch: 'The root index becomes the denominator of the exponent: $x^{1/2}$.'
          - problem: 'In radical form $x^{1/3}$ is the $n$th root of $x$. What is $n$?'
            answer: "3"
            solution_sketch: 'The denominator of the fractional exponent is the root index.'
          - problem: 'Write $\sqrt[4]{x}$ as a power of $x$.'
            answer: "x^(1/4)"
            solution_sketch: 'The root index $4$ becomes the exponent denominator.'
          - problem: 'The exponent $x^{1/5}$ names the $n$th root of $x$. Find $n$.'
            answer: "5"
            solution_sketch: 'The denominator of the fractional exponent is the root index.'
        constraints: "a^(1/n) is the nth root of a"
      - id: kp2
        name: "General m/n form"
        key_prerequisites: [cube-roots]
        exemplars:
          - problem: 'Write $\sqrt[3]{x^2}$ as a power of $x$.'
            answer: "x^(2/3)"
            solution_sketch: 'Power $2$, root index $3$: $x^{2/3}$.'
          - problem: 'In radical form $x^{3/4} = \sqrt[4]{x^m}$. What is $m$?'
            answer: "3"
            solution_sketch: 'The numerator of the fractional exponent is the power inside the radical.'
          - problem: 'What single power of $x$ equals $\sqrt[5]{x^3}$?'
            answer: "x^(3/5)"
            solution_sketch: 'Power $3$, root index $5$: $x^{3/5}$.'
          - problem: 'The exponent form $x^{2/5} = \sqrt[5]{x^m}$ names what value of $m$?'
            answer: "2"
            solution_sketch: 'The numerator of the fractional exponent is the power inside the radical.'
        constraints: "numerator is the power, denominator is the root index"
      - id: kp3
        name: "Evaluate unit fractional exponents"
        key_prerequisites: [square-roots, cube-roots]
        exemplars:
          - problem: 'Compute $25^{1/2}$.'
            answer: "5"
            solution_sketch: '$\sqrt{25} = 5$.'
          - problem: 'What is $8^{1/3}$?'
            answer: "2"
            solution_sketch: '$\sqrt[3]{8} = 2$.'
          - problem: 'Find $16^{1/2}$.'
            answer: "4"
            solution_sketch: '$\sqrt{16} = 4$.'
          - problem: 'Evaluate $27^{1/3}$.'
            answer: "3"
            solution_sketch: '$\sqrt[3]{27} = 3$.'
