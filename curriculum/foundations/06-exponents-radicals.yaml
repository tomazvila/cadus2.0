            answer: "sqrt(3) - 1"
            solution_sketch: 'Multiply by $\frac{1 - \sqrt{3}}{1 - \sqrt{3}}$: $\frac{2(1 - \sqrt{3})}{1 - 3} = \sqrt{3} - 1$.'
          - problem: 'Rationalize $\frac{1}{\sqrt{5} - 2}$.'
            answer: "sqrt(5) + 2"
            solution_sketch: '$\frac{\sqrt{5} + 2}{5 - 4} = \sqrt{5} + 2$.'
        constraints: "multiply by the conjugate; denominator becomes an integer"
    diagnostic_exemplar:
      problem: 'Rationalize $\frac{2}{\sqrt{3} + 1}$.'
      answer: 'sqrt(3) - 1'
      solution_sketch: 'Multiply by $\frac{\sqrt{3} - 1}{\sqrt{3} - 1}$: $\frac{2(\sqrt{3} - 1)}{2} = \sqrt{3} - 1$.'
    anki_seeds:
      - front: "To rationalize 1/sqrt(a), multiply by ..."
        back: "sqrt(a)/sqrt(a), giving sqrt(a)/a"
        type: basic
      - front: "To rationalize a denominator of the form a + sqrt(b), multiply by ..."
        back: "the conjugate a - sqrt(b)"
        type: basic

  - id: radical-exponent-conversion
    name: "Converting Between Radical and Exponent Form"
    core: true
    difficulty: 0.48
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: square-roots
        weight: 0.6
        key: true
      - id: cube-roots
        weight: 0.5
        key: true
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Unit fractions: a^(1/n) is an nth root"
        key_prerequisites: [square-roots, cube-roots]
        exemplars:
          - problem: 'Write $\sqrt{x}$ as a power of $x$.'
            answer: "x^(1/2)"
          - problem: 'In radical form $x^{1/3}$ is the $n$th root of $x$. What is $n$?'
            answer: "3"
            solution_sketch: 'The denominator of the fractional exponent is the root index.'
        constraints: "a^(1/n) is the nth root of a"
      - id: kp2
        name: "General m/n form"
        key_prerequisites: [cube-roots]
        exemplars:
          - problem: 'Write $\sqrt[3]{x^2}$ as a power of $x$.'
            answer: "x^(2/3)"
          - problem: 'In radical form $x^{3/4} = \sqrt[4]{x^m}$. What is $m$?'
            answer: "3"
            solution_sketch: 'The numerator of the fractional exponent is the power inside the radical.'
        constraints: "numerator is the power, denominator is the root index"
      - id: kp3
        name: "Evaluate unit fractional exponents"
        key_prerequisites: [square-roots, cube-roots]
        exemplars:
          - problem: 'Compute $25^{1/2}$.'
            answer: "5"
            solution_sketch: '$\sqrt{25} = 5$.'
          - problem: 'Compute $8^{1/3}$.'
            answer: "2"
            solution_sketch: '$\sqrt[3]{8} = 2$.'
        constraints: "perfect powers; positive base"
    diagnostic_exemplar:
      problem: 'Write $\sqrt{x^3}$ as a power of $x$.'
      answer: "x^(3/2)"
      solution_sketch: 'Power $3$, root index $2$.'
    anki_seeds:
      - front: "a^(1/n) = ?"
        back: "the nth root of a"
        type: basic

  - id: rational-exponents
    name: "Rational Exponents"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: radical-exponent-conversion
        weight: 0.8
        key: true
      - id: negative-zero-exponents
        weight: 0.5
        key: true
      - id: power-rule-exponents
        weight: 0.5
      - id: simplifying-radicals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Evaluate a^(m/n)"
        key_prerequisites: [radical-exponent-conversion]
        exemplars:
          - problem: 'Compute $8^{2/3}$.'
            answer: "4"
            solution_sketch: '$(8^{1/3})^2 = 2^2 = 4$.'
          - problem: 'Compute $16^{3/4}$.'
            answer: "8"
            solution_sketch: '$(16^{1/4})^3 = 2^3 = 8$.'
        constraints: "take the root first, then the power; perfect powers only"
      - id: kp2
        name: "Negative rational exponents"
        key_prerequisites: [negative-zero-exponents, radical-exponent-conversion]
        exemplars:
          - problem: 'Compute $4^{-1/2}$.'
            answer: "1/2"
            solution_sketch: '$\frac{1}{\sqrt{4}} = \frac{1}{2}$.'
          - problem: 'Compute $27^{-2/3}$.'
            answer: "1/9"
            solution_sketch: '$\frac{1}{(27^{1/3})^2} = \frac{1}{9}$.'
        constraints: "negative exponent -> reciprocal, then evaluate"
      - id: kp3
        name: "Exponent laws with rational exponents"
        key_prerequisites: [power-rule-exponents, radical-exponent-conversion]
        exemplars:
          - problem: 'Simplify $x^{1/2} \cdot x^{1/3}$.'
            answer: "x^(5/6)"
            solution_sketch: '$\frac{1}{2} + \frac{1}{3} = \frac{5}{6}$.'
          - problem: 'Simplify $(x^{2/3})^3$.'
            answer: "x^2"
            solution_sketch: '$\frac{2}{3} \cdot 3 = 2$.'
        constraints: "same product/quotient/power rules, fractional arithmetic"
    diagnostic_exemplar:
      problem: 'Compute $27^{2/3} \cdot 27^{-1/3}$.'
      answer: '3'
      solution_sketch: 'Add the exponents: $27^{1/3} = 3$.'
    anki_seeds:
      - front: "Meaning of a^(m/n):"
        back: "the nth root of a, raised to the m power: (a^(1/n))^m"
        type: basic

  - id: pythagorean-theorem
    name: "The Pythagorean Theorem"
    core: true                 # promoted: prerequisite of geometry/linear-algebra/calculus core topics
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: square-roots
        weight: 0.6
        key: true
      - id: simplifying-radicals
        weight: 0.4
      - id: evaluating-expressions
        weight: 0.3
        key: true
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Find the hypotenuse"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'A right triangle has legs $3$ and $4$. Find the hypotenuse.'
            answer: "5"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{9 + 16} = \sqrt{25} = 5$.'
          - problem: 'A right triangle has legs $6$ and $8$. Find the hypotenuse.'
            answer: "10"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{36 + 64} = \sqrt{100} = 10$.'
        constraints: "c = sqrt(a^2 + b^2); perfect-square results"
      - id: kp2
        name: "Find a missing leg"
        key_prerequisites: [square-roots]
        exemplars:
          - problem: 'A right triangle has hypotenuse $13$ and one leg $5$. Find the other leg.'
            answer: "12"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{169 - 25} = \sqrt{144} = 12$.'
          - problem: 'A right triangle has hypotenuse $10$ and one leg $6$. Find the other leg.'
            answer: "8"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{100 - 36} = \sqrt{64} = 8$.'
        constraints: "leg = sqrt(c^2 - a^2)"
      - id: kp3
        name: "Non-perfect-square answers"
        key_prerequisites: [simplifying-radicals]
        exemplars:
          - problem: 'A right triangle has legs $2$ and $3$. Find the hypotenuse.'
            answer: "sqrt(13)"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{4 + 9} = \sqrt{13}$.'
          - problem: 'A right triangle has legs $4$ and $4$. Find the hypotenuse.'
            answer: "4*sqrt(2)"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{16 + 16} = \sqrt{32} = 4\sqrt{2}$.'
        constraints: "leave the answer as a simplified radical"
    diagnostic_exemplar:
      problem: 'A right triangle has hypotenuse $7$ and one leg $5$. Find the other leg.'
      answer: '2*sqrt(6)'
      solution_sketch: '$\sqrt{7^2 - 5^2} = \sqrt{24} = 2\sqrt{6}$.'
    anki_seeds:
      - front: "Pythagorean theorem for a right triangle with legs a, b and hypotenuse c:"
        back: "a^2 + b^2 = c^2"
        type: basic

  - id: pythagorean-converse
    name: "The Converse of the Pythagorean Theorem"
    core: false                # converse / classification leaf; the theorem stays core
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: pythagorean-theorem
        weight: 0.8
        key: true
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Verify a right triangle"
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'Is a triangle with sides $5$, $12$, $13$ a right triangle?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$25 + 144 = 169 = 13^2$.'
          - problem: 'Is a triangle with sides $8$, $15$, $17$ a right triangle?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$64 + 225 = 289 = 17^2$.'
        constraints: "test a^2 + b^2 against c^2 with c the longest side"
      - id: kp2
        name: "Recognize non-right triangles"
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'Is a triangle with sides $4$, $5$, $6$ a right triangle?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$16 + 25 = 41 \ne 36$.'
          - problem: 'Is a triangle with sides $2$, $3$, $4$ a right triangle?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$4 + 9 = 13 \ne 16$.'
        constraints: "always compare against the square of the longest side"
      - id: kp3
        name: "Pythagorean triples and acute/obtuse classification"
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'Scale the triple $(3, 4, 5)$ by $3$. Is the resulting triangle right?'
            answer: "yes: (9, 12, 15)"
            solution_sketch: '$81 + 144 = 225 = 15^2$; multiples of triples stay right.'
          - problem: 'A triangle has sides $4$, $5$, $6$. Is it acute, right, or obtuse?'
            answer: "acute"
            solution_sketch: '$16 + 25 = 41 > 36$, so the largest angle is less than $90°$.'
        constraints: "a^2 + b^2 > c^2 means acute, < c^2 means obtuse"
    diagnostic_exemplar:
      problem: 'A triangle has sides $5$, $6$, $8$. Is it acute, right, or obtuse?'
      answer: 'obtuse'
      solution_sketch: '$5^2 + 6^2 = 61 < 64 = 8^2$, so the triangle is obtuse.'
    anki_seeds:
      - front: "Converse of the Pythagorean theorem: if a^2 + b^2 = c^2 (c the longest side), then ..."
        back: "the triangle is a right triangle"
        type: basic
      - front: "For sides a <= b <= c: a^2 + b^2 < c^2 means the triangle is ..."
        back: "obtuse (and acute if a^2 + b^2 > c^2)"
        type: basic

