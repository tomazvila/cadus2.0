            answer: "4"
            solution_sketch: '$\sqrt{16} = 4$.'
          - problem: 'Find $\frac{\sqrt{72}}{\sqrt{2}}$.'
            answer: "6"
            solution_sketch: '$\sqrt{72/2} = \sqrt{36} = 6$.'
          - problem: 'Evaluate $\frac{\sqrt{45}}{\sqrt{5}}$.'
            answer: "3"
            solution_sketch: '$\sqrt{45/5} = \sqrt{9} = 3$.'
        constraints: "quotient of radicands is a perfect square"
      - id: kp2
        name: "Roots of fractions with simplification"
        key_prerequisites: [dividing-fractions, simplifying-radicals]
        exemplars:
          - problem: 'Simplify $\sqrt{\frac{18}{49}}$.'
            answer: "3*sqrt(2)/7"
            solution_sketch: '$\frac{\sqrt{18}}{\sqrt{49}} = \frac{3\sqrt{2}}{7}$.'
          - problem: 'What is $\sqrt{\frac{75}{16}}$?'
            answer: "5*sqrt(3)/4"
            solution_sketch: '$\frac{\sqrt{75}}{4} = \frac{5\sqrt{3}}{4}$.'
          - problem: 'Find $\sqrt{\frac{50}{81}}$.'
            answer: "5*sqrt(2)/9"
            solution_sketch: '$\frac{\sqrt{50}}{\sqrt{81}} = \frac{5\sqrt{2}}{9}$.'
          - problem: 'Evaluate $\sqrt{\frac{48}{25}}$.'
            answer: "4*sqrt(3)/5"
            solution_sketch: '$\frac{\sqrt{48}}{5} = \frac{4\sqrt{3}}{5}$.'
        constraints: "perfect-square denominators; numerator may need simplifying"
      - id: kp3
        name: "Quotients with coefficients"
        key_prerequisites: [simplifying-radicals, dividing-fractions]
        exemplars:
          - problem: 'Simplify $\frac{6\sqrt{20}}{3\sqrt{5}}$.'
            answer: "4"
            solution_sketch: '$\frac{6}{3}\sqrt{\frac{20}{5}} = 2\sqrt{4} = 4$.'
          - problem: 'What is $\frac{10\sqrt{27}}{5\sqrt{3}}$?'
            answer: "6"
            solution_sketch: '$2\sqrt{9} = 6$.'
          - problem: 'Find $\frac{8\sqrt{18}}{4\sqrt{2}}$.'
            answer: "6"
            solution_sketch: '$\frac{8}{4}\sqrt{\frac{18}{2}} = 2\sqrt{9} = 6$.'
          - problem: 'Evaluate $\frac{12\sqrt{50}}{6\sqrt{2}}$.'
            answer: "10"
            solution_sketch: '$\frac{12}{6}\sqrt{\frac{50}{2}} = 2\sqrt{25} = 10$.'
        constraints: "divide coefficients and radicands separately"
    diagnostic_exemplar:
      problem: 'Simplify $\sqrt{\frac{50}{9}}$.'
