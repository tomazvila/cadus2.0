            solution_sketch: '$8^0 = 1$ since $8 \ne 0$.'
          - problem: 'What does $(-11)^0$ equal?'
            answer: "1"
            solution_sketch: '$(-11)^0 = 1$ since the base is nonzero.'
        constraints: "any nonzero base to the 0 power is 1"
      - id: kp2
        name: "Zero exponents inside expressions"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $(3x)^0$ for $x \ne 0$.'
            answer: "1"
            solution_sketch: 'The whole base $3x$ is nonzero and raised to the $0$ power: $1$.'
          - problem: 'Simplify $3x^0$ for $x \ne 0$.'
            answer: "3"
            solution_sketch: 'Only $x$ carries the exponent: $3 \cdot 1 = 3$.'
          - problem: 'What is $(5x)^0$ for $x \ne 0$?'
            answer: "1"
            solution_sketch: 'The whole base $5x$ is nonzero and raised to the $0$ power: $1$.'
          - problem: 'What is $7x^0$ for $x \ne 0$?'
            answer: "7"
            solution_sketch: 'Only $x$ carries the exponent: $7 \cdot 1 = 7$.'
        constraints: "contrast (ax)^0 with a*x^0"
      - id: kp3
        name: "Why it works: the quotient rule"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Use the quotient rule to write $\frac{x^5}{x^5}$ as a single power of $x$. What is that power worth for $x \ne 0$?'
            answer: "1"
            solution_sketch: '$x^{5-5} = x^0$; but any nonzero number divided by itself is $1$, so $x^0 = 1$.'
          - problem: 'Compute $2^0 + 3^0$.'
            answer: "2"
            solution_sketch: '$2^0 = 1$ and $3^0 = 1$; $1 + 1 = 2$.'
          - problem: 'Use the quotient rule to write $\frac{y^3}{y^3}$ as a single power of $y$. What is that power worth for $y \ne 0$?'
            answer: "1"
            solution_sketch: '$y^{3-3} = y^0$; and $y^3/y^3 = 1$, so $y^0 = 1$.'
          - problem: 'What is $4^0 + 5^0$?'
            answer: "2"
            solution_sketch: '$4^0 = 1$ and $5^0 = 1$; $1 + 1 = 2$.'
        constraints: "connect a^0 = 1 to a^n / a^n"
    diagnostic_exemplar:
      problem: 'Evaluate $5x^0 + (3x)^0$ for $x \ne 0$.'
      answer: '6'
      solution_sketch: '$5x^0 = 5$ but $(3x)^0 = 1$, so $5 + 1 = 6$.'
    anki_seeds:
      - front: "Any nonzero base to the zero power equals ..."
        back: "1"
        type: basic

