            answer: "verdict = obtuse; S = 65"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["acute"], ["obtuse"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "S"}]}
            solution_sketch: "Step 1: square the two shorter sides and add them, 4^2 + 7^2 = 16 + 49 = 65. Step 2: square the longest side, 9^2 = 81. Step 3: compare the two values; 65 is less than 81, so by the converse of the Pythagorean theorem the largest angle is obtuse. Choosing acute is the error of reading the comparison 65 < 81 backwards. Final answer: verdict = obtuse; S = 65."
          - problem: "A triangle has sides 6, 7, and 8. Give the correct type of its largest angle and the square of its longest side."
            answer: "verdict = acute; c2 = 64"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["acute"], ["obtuse"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c2"}]}
            solution_sketch: "Step 1: add the squares of the two shorter sides of the triangle with sides 6, 7, and 8, which gives 6^2 + 7^2 = 36 + 49 = 85. Step 2: square the longest side, which gives 8^2 = 64. Step 3: compare the two values, and since 85 is greater than 64, the converse of the Pythagorean theorem says the largest angle is acute. Choosing obtuse is the error of using the inequality in the wrong direction. Final answer: verdict = acute; c2 = 64."
          - problem: "Scale the triple (5, 12, 13) by 2 to get the side lengths of a triangle. Find the square of the longest side of that triangle."
            answer: "676"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: multiply every member of the triple by 2, which gives the sides 10, 24, and 26. Step 2: a scaled Pythagorean triple is still a right triangle, so the longest side is the scaled 13, namely 26. Step 3: square the longest side, 26^2 = 676. The square of the longest side is 676."
          - problem: "Scale the triple (7, 24, 25) by 3 to get the side lengths of a triangle. Find the square of the longest side minus the sum of the squares of the two shorter sides."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: multiply every member of the triple by 3, which gives the sides 21, 72, and 75. Step 2: add the squares of the two shorter sides, 21^2 + 72^2 = 441 + 5184 = 5625. Step 3: square the longest side, 75^2 = 5625. Step 4: subtract the two results, 5625 - 5625 = 0, which is exactly the right-triangle relation. The value of the difference is 0."
        constraints: "a^2 + b^2 > c^2 means acute, < c^2 means obtuse"
    diagnostic_exemplar:
      problem: 'A triangle has sides $5$, $6$, $8$. Is it acute, right, or obtuse?'
      answer_contract: {kind: label, options: [[acute], [right], [obtuse]]}
      answer: 'obtuse'
      solution_sketch: '$5^2 + 6^2 = 61 < 64 = 8^2$, so the triangle is obtuse.'
    anki_seeds:
      - front: "Converse of the Pythagorean theorem: if a^2 + b^2 = c^2 (c the longest side), then ..."
        back: "the triangle is a right triangle"
        type: basic
      - front: "For sides a <= b <= c: a^2 + b^2 < c^2 means the triangle is ..."
        back: "obtuse (and acute if a^2 + b^2 > c^2)"
        type: basic

  - id: radical-equations-basic
    name: "Radical Equations"
    core: false                # terminal solve genre; the radical rules stay core
    difficulty: 0.62
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: square-roots
        weight: 0.6
        key: true
      - id: two-step-equations
        weight: 0.5
        key: true
      - id: simplifying-radicals
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Square both sides of sqrt(x) = k"
        key_prerequisites: [square-roots]
        exemplars:
          - problem: 'Solve $\sqrt{x} = 5$.'
            answer: "x = 25"
            answer_contract: {kind: exact}
            solution_sketch: 'Square both sides.'
          - problem: 'What value of $x$ satisfies $\sqrt{x} = 3$?'
            answer: "x = 9"
            answer_contract: {kind: exact}
            solution_sketch: 'Square both sides: $x = 9$.'
          - problem: 'Find $x$ if $\sqrt{x} = 6$.'
            answer: "x = 36"
            answer_contract: {kind: exact}
            solution_sketch: 'Square both sides: $x = 36$.'
          - problem: 'Determine $x$ so that $\sqrt{x} = 7$.'
            answer: "x = 49"
            answer_contract: {kind: exact}
            solution_sketch: 'Square both sides: $x = 49$.'
        constraints: "radical already isolated; nonnegative right side"
      - id: kp2
        name: "Isolate the radical first"
        key_prerequisites: [two-step-equations, square-roots]
        exemplars:
          - problem: 'Solve $\sqrt{x + 3} = 4$.'
            answer: "x = 13"
            answer_contract: {kind: exact}
            solution_sketch: '$x + 3 = 16$.'
          - problem: 'Solve $2\sqrt{x} - 1 = 5$.'
            answer: "x = 9"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{x} = 3$; $x = 9$.'
          - problem: 'Solve $\sqrt{x - 2} = 5$.'
            answer: "x = 27"
            answer_contract: {kind: exact}
            solution_sketch: '$x - 2 = 25$, so $x = 27$.'
          - problem: 'Find $x$ so that $3\sqrt{x} - 2 = 7$, then check your answer.'
            answer: "x = 9"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{x} = 3$; $x = 9$.'
        constraints: "one radical; linear inside; isolate before squaring"
      - id: kp3
        name: "Check solutions and spot no-solution cases"
        key_prerequisites: [square-roots, two-step-equations]
        exemplars:
          - problem: 'Solve $\sqrt{3x + 1} = 4$ and check.'
            answer: "x = 5"
            answer_contract: {kind: exact}
            solution_sketch: '$3x + 1 = 16$; check: $\sqrt{16} = 4$.'
          - problem: 'Find $x$ so that $\sqrt{2x + 1} = 3$, then check your answer.'
            answer: "x = 4"
            answer_contract: {kind: exact}
            solution_sketch: '$2x + 1 = 9$; $x = 4$; check: $\sqrt{9} = 3$.'
          - problem: "Solve $\\sqrt{x + 7} = -2$. Square both sides to get a candidate, then substitute the candidate back into the original equation. State whether to accept or reject the candidate, and give the candidate $x$."
            answer: "verdict = reject; x = -3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["accept"], ["reject"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "x"}]}
            solution_sketch: "Step 1 (isolate): the radical is already alone, $\\sqrt{x + 7} = -2$. Step 2 (square both sides): the candidate satisfies $x + 7 = 4$, so $x = -3$. Step 3 (substitute back, as the check rule requires): $\\sqrt{-3 + 7} = \\sqrt{4} = 2$, which is not $-2$, because a square root is never negative. The candidate fails the check, so the answer is verdict = reject; x = -3."
          - problem: "Solve $2\\sqrt{x} + 7 = 3$, then substitute your candidate back into the equation to check it. What is the solution?"
            answer: "no solution"
            answer_contract: {"kind": "label", "options": [["no solution"], ["x = 4"], ["x = 16"], ["x = -2"]]}
            solution_sketch: "Step 1 (two-step equation): subtract 7 to get $2\\sqrt{x} = -4$, then divide by 2 to get $\\sqrt{x} = -2$. Step 2 (square both sides): the candidate is $x = 4$. Step 3 (substitute back, as the check rule requires): $2\\sqrt{4} + 7 = 11$, not $3$; a square root is never negative, so the candidate fails. Wrong options: x = 4 squares without checking, x = 16 squares $-4$ directly and forgets to divide by 2, x = -2 copies the right side of the isolated equation. The answer is no solution."
        constraints: "always substitute back; sqrt(...) = negative has no solution"
    diagnostic_exemplar:
      problem: 'Solve $3\sqrt{x} + 2 = 14$.'
      answer: 'x = 16'
      solution_sketch: '$3\sqrt{x} = 12$; $\sqrt{x} = 4$; $x = 16$.'
    anki_seeds:
      - front: "sqrt(x) = k has a solution only when ..."
        back: "k >= 0 (then x = k^2); always check for extraneous roots after squaring"
        type: basic
