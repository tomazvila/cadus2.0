      problem: 'Simplify $\frac{8x^{-1}y^2}{4x^2y^{-1}}$ and write with positive exponents.'
      answer: '2y^3 / x^3'
      solution_sketch: '$\frac{8}{4} = 2$; $x^{-1-2} = x^{-3}$; $y^{2-(-1)} = y^3$.'
