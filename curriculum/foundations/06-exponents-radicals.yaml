        finite_objective_domain: {"schema_version": 1, "review_ref": "sha256:c33d3b80825332dd657355002c9898f30406534dccc846181d7ccc19dc84a966", "cases": [{"id": "fact-1", "role": "practice_fresh", "variants": [{"problem": "Evaluate the real cube root $\\sqrt[3]{1}$.", "answer": "1**(1/3)"}]}, {"id": "fact-8", "role": "practice_fresh", "variants": [{"problem": "Evaluate the real cube root $\\sqrt[3]{8}$.", "answer": "8**(1/3)"}]}, {"id": "fact-27", "role": "practice_fresh", "variants": [{"problem": "Evaluate the real cube root $\\sqrt[3]{27}$.", "answer": "27**(1/3)"}, {"problem": "Compute $\\sqrt[3]{27}$.", "answer": "3"}]}, {"id": "fact-64", "role": "practice_fresh", "variants": [{"problem": "Evaluate the real cube root $\\sqrt[3]{64}$.", "answer": "64**(1/3)"}, {"problem": "What is $\\sqrt[3]{64}$?", "answer": "4"}]}, {"id": "fact-125", "role": "practice_fresh", "variants": [{"problem": "Evaluate the real cube root $\\sqrt[3]{125}$.", "answer": "125**(1/3)"}, {"problem": "Find $\\sqrt[3]{125}$.", "answer": "5"}]}, {"id": "fact-216", "role": "practice_fresh", "variants": [{"problem": "Evaluate the real cube root $\\sqrt[3]{216}$.", "answer": "216**(1/3)"}]}, {"id": "fact-343", "role": "practice_fresh", "variants": [{"problem": "Evaluate the real cube root $\\sqrt[3]{343}$.", "answer": "343**(1/3)"}]}, {"id": "fact-729", "role": "practice_fresh", "variants": [{"problem": "Evaluate the real cube root $\\sqrt[3]{729}$.", "answer": "729**(1/3)"}]}, {"id": "fact-1000", "role": "practice_fresh", "variants": [{"problem": "Evaluate the real cube root $\\sqrt[3]{1000}$.", "answer": "1000**(1/3)"}, {"problem": "Evaluate $\\sqrt[3]{1000}$.", "answer": "10"}]}, {"id": "fact-512", "role": "teach_only", "variants": [{"problem": "Compute $\\sqrt[3]{512}$.", "answer": "8"}]}]}
        name: "Cube roots of perfect cubes"
        key_prerequisites: [integer-exponents-intro]
        try_first:
          problem: 'A large cube is built from $27$ small unit cubes. How many unit cubes long is each edge of the large cube?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: '$3\cdot3\cdot3=27$, so each edge is $3$ cubes long. That edge length is the cube root of the volume: $\sqrt[3]{27}=3$.'
        exemplars:
          - problem: 'Compute $\sqrt[3]{27}$.'
            answer: "3"
            solution_sketch: 'Look for the number whose cube is $27$. Since $3 \cdot 3 \cdot 3 = 27$, the cube root is $3$.'
          - problem: 'What is $\sqrt[3]{64}$?'
            answer: "4"
            solution_sketch: 'Look for the number whose cube is $64$. Since $4 \cdot 4 \cdot 4 = 64$, the cube root is $4$.'
          - problem: 'Find $\sqrt[3]{125}$.'
            answer: "5"
            solution_sketch: 'Look for the number whose cube is $125$. Since $5 \cdot 5 \cdot 5 = 125$, the cube root is $5$.'
          - problem: 'Evaluate $\sqrt[3]{1000}$.'
            answer: "10"
            solution_sketch: 'Look for the number whose cube is $1000$. Since $10 \cdot 10 \cdot 10 = 1000$, the cube root is $10$.'
          - problem: 'Evaluate the real cube root $\sqrt[3]{216}$.'
            answer: "216**(1/3)"
            solution_sketch: 'Test $6$: $6 \cdot 6 \cdot 6 = 36 \cdot 6 = 216$. So the real cube root of $216$ is $6$, the value of $216^{1/3}$.'
          - problem: 'Evaluate the real cube root $\sqrt[3]{729}$.'
            answer: "729**(1/3)"
            solution_sketch: 'Test $9$: $9 \cdot 9 \cdot 9 = 81 \cdot 9 = 729$. So the real cube root of $729$ is $9$, the value of $729^{1/3}$.'
        constraints: "perfect cubes up to 1000"
      - id: kp2
        name: "Cube roots of negative numbers"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Compute $\sqrt[3]{-8}$.'
            answer: "-2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $2^3 = 8$, try $-2$. Indeed $(-2)(-2)(-2) = -8$, so the cube root is $-2$.'
          - problem: 'Find the real number $t$ such that $t^3=-125$.'
            answer: "-5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $5^3 = 125$ and the cube is negative, try $-5$. Indeed $(-5)(-5)(-5) = -125$, so $t = -5$.'
          - problem: 'Evaluate $\sqrt[3]{-64}$.'
            answer: "-4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $4^3 = 64$, the cube root of $-64$ is $-4$. Check: $(-4)(-4)(-4) = 16 \cdot (-4) = -64$.'
          - problem: 'Jana says the real cube root of $-27$ is $3$. What is the real cube root of $-27$?'
            answer: "-3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Jana''s root has the wrong sign, because $3^3 = 27$. Since $(-3)^3 = -27$, the real cube root is $-3$.'
          - problem: 'The product of three equal numbers is $-343$. What is the number?'
            answer: "-7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number is $\sqrt[3]{-343}$. Since $7^3 = 343$ and three negative factors give a negative product, the number is $-7$.'
          - problem: 'Evaluate $\sqrt[3]{-1000} + \sqrt[3]{8}$.'
            answer: "-8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Evaluate each root first: $\sqrt[3]{-1000} = -10$ and $\sqrt[3]{8} = 2$. Their sum is $-10 + 2 = -8$.'
          - problem: 'Solve $x^3 + 216 = 0$.'
            answer: "-6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $216$ to get $x^3 = -216$. Since $(-6)^3 = -216$, the real solution is $x = -6$.'
        constraints: "negative perfect-cube radicands"
      - id: kp3
        name: "Fourth and fifth roots"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Compute $\sqrt[4]{16}$.'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Look for the nonnegative number used four times as a factor to make $16$. Since $2 \cdot 2 \cdot 2 \cdot 2 = 16$, the fourth root is $2$.'
          - problem: 'A colony of cells grows by the same whole-number factor every hour. After $4$ hours there are $625$ times as many cells as at the start. By what factor does the colony grow each hour?'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four equal growth factors multiply to $625$, so the factor is $\sqrt[4]{625}$. Since $5^4 = 625$, the colony grows by a factor of $5$ each hour.'
          - problem: 'Evaluate $\sqrt[5]{-243}$.'
            answer: "-3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $3^5 = 243$ and an odd number of negative factors is negative, try $-3$. Indeed $(-3)^5 = -243$, so the fifth root is $-3$.'
          - problem: 'Find $\sqrt[4]{81}$.'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Look for the nonnegative number used four times as a factor to make $81$. Since $3 \cdot 3 \cdot 3 \cdot 3 = 81$, the fourth root is $3$.'
          - problem: 'The number of views of a video is multiplied by the same whole number every week. After $5$ weeks it is $243$ times the starting number. By what number is it multiplied each week?'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Five equal weekly factors multiply to $243$, so the factor is $\sqrt[5]{243}$. Since $3^5 = 243$, the views are multiplied by $3$ each week.'
          - problem: 'What is $\sqrt[5]{32}$?'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Look for the number used five times as a factor to make $32$. Since $2^5 = 32$, the fifth root is $2$.'
          - problem: 'Sam says $\sqrt[4]{1296} = 324$ because $1296 \div 4 = 324$. What is $\sqrt[4]{1296}$?'
            answer: "6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A fourth root is the number used four times as a factor, not a quarter of the number. Since $6^2 = 36$ and $36^2 = 1296$, the fourth root is $6$.'
          - problem: 'Does $\sqrt[4]{-16}$ have a real value?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["no","no real value","it has no real value","not real","no, it is not real"],["yes","yes, it is real","it has a real value","real"]]}
            solution_sketch: 'Any real number raised to the fourth power is zero or positive. So no real number has a fourth power of $-16$, and $\sqrt[4]{-16}$ is not real.'
          - problem: 'Evaluate $\sqrt[5]{100000}$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Look for the number used five times as a factor to make $100000$. Since $10^5 = 100000$, the fifth root is $10$.'
        constraints: "small perfect powers only"
    diagnostic_exemplar:
      problem: 'Compute $\sqrt[5]{-32}$.'
      answer: '-2'
      solution_sketch: '$(-2)^5 = -32$.'
    anki_seeds:
      - front: "The cube root of a negative number is ..."
        back: "negative (odd-index roots preserve the sign)"
        type: basic
      - front: "4^3 = ?"
        back: "64"
        type: basic

  - id: simplifying-radicals
    name: "Simplifying Radicals"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: square-roots
        weight: 0.7
        key: true
      - id: prime-factorization
        weight: 0.6
        key: true
      - id: multiplication-tables
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Factor out a perfect square"
        key_prerequisites: [prime-factorization]
        try_first:
          problem: 'Without a calculator, find $\sqrt{9 \cdot 49}$.'
          answer_contract: {"kind":"exact"}
          answer: '21'
          reveal: '$\sqrt{9\cdot49}=\sqrt9\cdot\sqrt{49}=3\cdot7=21$. The root of a product is the product of the roots, which is what lets a square factor come out of any radical.'
        exemplars:
          - problem: 'Simplify $\sqrt{12}$.'
            answer: "2*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The largest square factor of $12$ is $4$, so $12 = 4 \cdot 3$. Then $\sqrt{12} = \sqrt{4}\sqrt{3} = 2\sqrt{3}$.'
          - problem: 'A square has an area of $50$ square units. Find the length of its side in simplest radical form.'
            answer: "5*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The side is the square root of the area, $\sqrt{50}$. Since $50 = 25 \cdot 2$, the side is $\sqrt{25}\sqrt{2} = 5\sqrt{2}$ units.'
          - problem: 'Write $\sqrt{27}$ in simplest radical form.'
            answer: "3*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The largest square factor of $27$ is $9$, so $27 = 9 \cdot 3$. Then $\sqrt{27} = 3\sqrt{3}$.'
          - problem: 'Maya writes $\sqrt{20} = 4\sqrt{5}$. What is the correct simplified form of $\sqrt{20}$?'
            answer: "2*sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Maya took out the $4$ itself instead of its square root. Since $20 = 4 \cdot 5$ and $\sqrt{4} = 2$, the correct form is $2\sqrt{5}$.'
          - problem: 'A square floor plan covers $28$ square units. How long is each side, in simplest radical form?'
            answer: "2*sqrt(7)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Each side is $\sqrt{28}$ units long. Since $28 = 4 \cdot 7$, the side is $\sqrt{4}\sqrt{7} = 2\sqrt{7}$ units.'
          - problem: 'Simplify $\sqrt{75}$.'
            answer: "5*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The largest square factor of $75$ is $25$, so $75 = 25 \cdot 3$. Then $\sqrt{75} = 5\sqrt{3}$.'
          - problem: 'Write $\sqrt{44}$ in simplest radical form.'
            answer: "2*sqrt(11)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The largest square factor of $44$ is $4$, so $44 = 4 \cdot 11$. Then $\sqrt{44} = 2\sqrt{11}$.'
        constraints: "pull out the largest perfect-square factor"
      - id: kp2
        name: "Larger radicands and coefficients"
        key_prerequisites: [square-roots]
        exemplars:
          - problem: 'Simplify $\sqrt{72}$.'
            answer: "6*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The largest square factor of $72$ is $36$, so $72 = 36 \cdot 2$. Then $\sqrt{72} = 6\sqrt{2}$.'
          - problem: 'A square mural is made of four equal square panels in a $2$ by $2$ grid. Each panel has an area of $12$ square units. Find the side length of the whole mural in simplest radical form.'
            answer: "4*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'One panel has side $\sqrt{12} = 2\sqrt{3}$ units. The mural is two panels wide, so its side is $2 \cdot 2\sqrt{3} = 4\sqrt{3}$ units.'
          - problem: 'Write $\sqrt{98}$ in simplest radical form.'
            answer: "7*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The largest square factor of $98$ is $49$, so $98 = 49 \cdot 2$. Then $\sqrt{98} = 7\sqrt{2}$.'
          - problem: 'Write $2\sqrt{45}$ in simplest radical form.'
            answer: "6*sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'First $\sqrt{45} = \sqrt{9}\sqrt{5} = 3\sqrt{5}$. Multiplying by the outside $2$ gives $2 \cdot 3\sqrt{5} = 6\sqrt{5}$.'
          - problem: 'A square courtyard has an area of $96$ square units. Find the exact length of one side in simplest radical form.'
            answer: "4*sqrt(6)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The side is $\sqrt{96}$ units. Since $96 = 16 \cdot 6$, the side is $\sqrt{16}\sqrt{6} = 4\sqrt{6}$ units.'
          - problem: 'Ines simplifies $4\sqrt{18}$ as $4 \cdot 9\sqrt{2} = 36\sqrt{2}$. What is the correct simplified form of $4\sqrt{18}$?'
            answer: "12*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Ines took out $9$ instead of its square root $3$. Since $\sqrt{18} = 3\sqrt{2}$, the result is $4 \cdot 3\sqrt{2} = 12\sqrt{2}$.'
          - problem: 'Simplify $3\sqrt{8}$.'
            answer: "6*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'First $\sqrt{8} = \sqrt{4}\sqrt{2} = 2\sqrt{2}$. Multiplying by the outside $3$ gives $3 \cdot 2\sqrt{2} = 6\sqrt{2}$.'
        constraints: "multiply any outside coefficient after simplifying"
      - id: kp3
        name: "Prime factorization for large radicands"
        key_prerequisites: [prime-factorization]
        exemplars:
          - problem: 'Simplify $\sqrt{180}$.'
            answer: "6*sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Prime-factorize: $180 = 2^2 \cdot 3^2 \cdot 5$. The pairs give $2 \cdot 3 = 6$ outside and the $5$ stays inside, so $\sqrt{180} = 6\sqrt{5}$.'
          - problem: 'A square plot of land has an area of $288$ square units. Find the length of one side in simplest radical form.'
            answer: "12*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The side is $\sqrt{288}$. Since $288 = 2^5 \cdot 3^2 = 2^4 \cdot 3^2 \cdot 2$, the pairs give $4 \cdot 3 = 12$ outside, so the side is $12\sqrt{2}$.'
          - problem: 'Use prime factorization to simplify $\sqrt{126}$.'
            answer: "3*sqrt(14)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Prime-factorize: $126 = 2 \cdot 3^2 \cdot 7$. Only the $3$s pair up, so $3$ comes out and $2 \cdot 7 = 14$ stays inside: $3\sqrt{14}$.'
          - problem: 'Write $\sqrt{200}$ in simplest radical form.'
            answer: "10*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Prime-factorize: $200 = 2^3 \cdot 5^2 = 2^2 \cdot 5^2 \cdot 2$. The pairs give $2 \cdot 5 = 10$ outside, so $\sqrt{200} = 10\sqrt{2}$.'
          - problem: 'The area of a square window is $245$ square units. How long is each edge, in simplest radical form?'
            answer: "7*sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Each edge is $\sqrt{245}$. Since $245 = 5 \cdot 7^2$, the pair of $7$s gives $7$ outside and the edge is $7\sqrt{5}$.'
          - problem: 'Tom writes $192 = 4 \cdot 48$ and concludes that $\sqrt{192} = 2\sqrt{48}$. Simplify $\sqrt{192}$ completely.'
            answer: "8*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Tom stopped too early, because $48$ still has the square factor $16$. Since $192 = 2^6 \cdot 3$, three pairs of $2$s give $8$ outside: $8\sqrt{3}$.'
          - problem: 'Write $\sqrt{150}$ in simplest radical form.'
            answer: "5*sqrt(6)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Prime-factorize: $150 = 2 \cdot 3 \cdot 5^2$. The pair of $5$s gives $5$ outside and $2 \cdot 3 = 6$ stays inside: $5\sqrt{6}$.'
        constraints: "radicands 100-300; pair up prime factors"
    diagnostic_exemplar:
      problem: 'Simplify $\sqrt{162}$.'
      answer: '9*sqrt(2)'
      solution_sketch: '$162 = 81 \times 2$.'
    anki_seeds:
      - front: "To simplify a radical, factor out the largest ___ factor: sqrt(a^2 * b) = ?"
        back: "perfect-square factor; a*sqrt(b)"
        type: basic

  - id: simplifying-radicals-variables
    name: "Simplifying Radicals with Variables"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: simplifying-radicals
        weight: 0.8
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.4
        key: true
      - id: power-rule-exponents
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Even powers come out whole"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $\sqrt{x^4}$ for $x \ge 0$.'
            answer: "x^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $x^4 = (x^2)^2$. For $x \ge 0$ the square root is $x^2$.'
          - problem: 'A square has an area of $x^6$ square units, where $x > 0$. Find the length of its side.'
            answer: "x^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side is the square root of the area. Since $(x^3)^2 = x^6$, the side is $\sqrt{x^6} = x^3$ units.'
          - problem: 'Simplify $\sqrt{x^{10}}$ for $x \ge 0$.'
            answer: "x^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $x^{10} = (x^5)^2$. For $x \ge 0$ the square root is $x^5$.'
          - problem: 'Simplify $\sqrt{16y^8}$, where $y \ge 0$.'
            answer: "4*y^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take each factor separately: $\sqrt{16} = 4$ and $\sqrt{y^8} = y^4$. So $\sqrt{16y^8} = 4y^4$.'
          - problem: 'A square floor tile has an area of $25a^4$ square units, where $a > 0$. How long is one side of the tile?'
            answer: "5*a^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side is $\sqrt{25a^4}$. Since $\sqrt{25} = 5$ and $\sqrt{a^4} = a^2$, the side is $5a^2$ units.'
          - problem: 'Ravi says $\sqrt{x^{36}} = x^6$ because $\sqrt{36} = 6$. What is $\sqrt{x^{36}}$ for $x \ge 0$?'
            answer: "x^18"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The square root halves the exponent, it does not take the root of the exponent. Since $(x^{18})^2 = x^{36}$, the answer is $x^{18}$.'
          - problem: 'Simplify $\sqrt{a^2b^6}$ for $a \ge 0$ and $b \ge 0$.'
            answer: "a*b^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take each factor separately: $\sqrt{a^2} = a$ and $\sqrt{b^6} = b^3$. So the result is $ab^3$.'
        constraints: "even exponents; assume variables nonnegative"
      - id: kp2
        name: "Odd powers leave one factor inside"
        key_prerequisites: [exponent-product-quotient-rules, simplifying-radicals]
        exemplars:
          - problem: 'Simplify $\sqrt{x^5}$ for $x \ge 0$.'
            answer: "x^2*sqrt(x)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split off the largest even power: $x^5 = x^4 \cdot x$. Since $\sqrt{x^4} = x^2$, the result is $x^2\sqrt{x}$.'
          - problem: 'A square has an area of $x^3$ square units, where $x > 0$. Find the length of its side in simplest radical form.'
            answer: "x*sqrt(x)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side is $\sqrt{x^3}$. Since $x^3 = x^2 \cdot x$ and $\sqrt{x^2} = x$, the side is $x\sqrt{x}$ units.'
          - problem: 'Simplify $\sqrt{y^9}$, where $y \ge 0$.'
            answer: "y^4*sqrt(y)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split off the largest even power: $y^9 = y^8 \cdot y$. Since $\sqrt{y^8} = y^4$, the result is $y^4\sqrt{y}$.'
          - problem: 'Noor writes $\sqrt{x^{11}} = x^5$. What is the correct simplification of $\sqrt{x^{11}}$ for $x \ge 0$?'
            answer: "x^5*sqrt(x)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Noor dropped the leftover factor. Since $x^{11} = x^{10} \cdot x$ and $\sqrt{x^{10}} = x^5$, the correct result is $x^5\sqrt{x}$.'
          - problem: 'Simplify $\sqrt{4x^9}$ for $x \ge 0$.'
            answer: "2*x^4*sqrt(x)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $4x^9 = 4 \cdot x^8 \cdot x$. The square factors give $\sqrt{4} = 2$ and $\sqrt{x^8} = x^4$, so the result is $2x^4\sqrt{x}$.'
          - problem: 'A square photo has an area of $a^{15}$ square units, where $a > 0$. How long is each side, in simplest radical form?'
            answer: "a^7*sqrt(a)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each side is $\sqrt{a^{15}}$. Since $a^{15} = a^{14} \cdot a$ and $\sqrt{a^{14}} = a^7$, the side is $a^7\sqrt{a}$ units.'
          - problem: 'Simplify $\sqrt{x^7}$ for $x \ge 0$.'
            answer: "x^3*sqrt(x)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split off the largest even power: $x^7 = x^6 \cdot x$. Since $\sqrt{x^6} = x^3$, the result is $x^3\sqrt{x}$.'
          - problem: 'Simplify $\sqrt{x^3y^5}$ for $x \ge 0$ and $y \ge 0$.'
            answer: "x*y^2*sqrt(x*y)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split each power: $x^3 = x^2 \cdot x$ and $y^5 = y^4 \cdot y$. The even powers give $xy^2$ outside and $xy$ stays inside: $xy^2\sqrt{xy}$.'
        constraints: "split off the largest even power"
      - id: kp3
        name: "Coefficients and variables together"
        key_prerequisites: [simplifying-radicals]
        exemplars:
          - problem: 'Simplify $\sqrt{50x^2}$ for $x \ge 0$.'
            answer: "5*x*sqrt(2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $50x^2 = 25 \cdot 2 \cdot x^2$. The square factors give $5$ and $x$, so the result is $5x\sqrt{2}$.'
          - problem: 'Simplify $\sqrt{72x^3}$ for $x \ge 0$.'
            answer: "6*x*sqrt(2*x)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $72x^3 = 36 \cdot 2 \cdot x^2 \cdot x$. The square factors give $6x$ outside and $2x$ stays inside: $6x\sqrt{2x}$.'
          - problem: 'A square tabletop has an area of $12x^4$ square units, where $x > 0$. Find the length of one side in simplest radical form.'
            answer: "2*x^2*sqrt(3)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side is $\sqrt{12x^4}$. Since $12x^4 = 4 \cdot 3 \cdot x^4$, the side is $2x^2\sqrt{3}$ units.'
          - problem: 'Simplify $\sqrt{45x^5}$, where $x \ge 0$.'
            answer: "3*x^2*sqrt(5*x)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $45x^5 = 9 \cdot 5 \cdot x^4 \cdot x$. The square factors give $3x^2$ outside and $5x$ stays inside: $3x^2\sqrt{5x}$.'
          - problem: 'Kai simplifies $\sqrt{20x^7}$ for $x \ge 0$ and gets $2x^3\sqrt{5}$. What is the correct simplification?'
            answer: "2*x^3*sqrt(5*x)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Kai lost the leftover $x$. Since $20x^7 = 4 \cdot 5 \cdot x^6 \cdot x$, the result is $2x^3\sqrt{5x}$.'
          - problem: 'A square courtyard has an area of $32a^2b^4$ square units, where $a > 0$ and $b > 0$. How long is each side, in simplest radical form?'
            answer: "4*a*b^2*sqrt(2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each side is $\sqrt{32a^2b^4}$. Since $32 = 16 \cdot 2$, the square factors give $4ab^2$ and the side is $4ab^2\sqrt{2}$ units.'
          - problem: 'Simplify $\sqrt{27x^2}$, where $x \ge 0$.'
            answer: "3*x*sqrt(3)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $27x^2 = 9 \cdot 3 \cdot x^2$. The square factors give $3$ and $x$, so the result is $3x\sqrt{3}$.'
        constraints: "simplify the number and each variable separately"
    diagnostic_exemplar:
      problem: 'Simplify $\sqrt{18x^3}$ ($x \ge 0$).'
      answer: '3x*sqrt(2x)'
      solution_sketch: '$\sqrt{9 \cdot 2 \cdot x^2 \cdot x} = 3x\sqrt{2x}$.'
    anki_seeds:
      - front: "For x >= 0, sqrt(x^(2k)) = ?"
        back: "x^k"
        type: basic

  - id: adding-subtracting-radicals
    name: "Adding and Subtracting Radicals"
    core: true
    difficulty: 0.50
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: simplifying-radicals
        weight: 0.7
        key: true
      - id: combining-like-terms
        weight: 0.5
        key: true
      - id: square-roots
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Add and subtract like radicals"
        key_prerequisites: [combining-like-terms]
        exemplars:
          - problem: 'Simplify $3\sqrt{2} + 5\sqrt{2}$.'
            answer: "8*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Both terms have the radical $\sqrt{2}$, so add the coefficients. Since $3 + 5 = 8$, the result is $8\sqrt{2}$.'
          - problem: 'A rectangle has length $5\sqrt{3}$ and width $2\sqrt{3}$. Find its perimeter.'
            answer: "14*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The perimeter is $2(5\sqrt{3} + 2\sqrt{3}) = 2 \cdot 7\sqrt{3}$. That is $14\sqrt{3}$.'
          - problem: 'Simplify $7\sqrt{5} - 2\sqrt{5}$.'
            answer: "5*sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Both terms have the radical $\sqrt{5}$, so subtract the coefficients. Since $7 - 2 = 5$, the result is $5\sqrt{5}$.'
          - problem: 'Simplify $4\sqrt{6} - 9\sqrt{6}$.'
            answer: "-5*sqrt(6)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Both terms have the radical $\sqrt{6}$, so subtract the coefficients. Since $4 - 9 = -5$, the result is $-5\sqrt{6}$.'
          - problem: 'A board is $8\sqrt{2}$ units long. A piece $3\sqrt{2}$ units long is cut off. How long is the remaining piece?'
            answer: "5*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The remaining length is $8\sqrt{2} - 3\sqrt{2}$. Since $8 - 3 = 5$, the piece is $5\sqrt{2}$ units long.'
          - problem: 'Ben writes $2\sqrt{3} + 4\sqrt{3} = 6\sqrt{6}$. What is the correct sum?'
            answer: "6*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Ben also added the radicands, but the radical $\sqrt{3}$ stays the same like a variable. The sum is $(2 + 4)\sqrt{3} = 6\sqrt{3}$.'
          - problem: 'A triangle has sides of length $2\sqrt{5}$, $3\sqrt{5}$ and $4\sqrt{5}$. Find its perimeter.'
            answer: "9*sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Add the three sides, which all have the radical $\sqrt{5}$. Since $2 + 3 + 4 = 9$, the perimeter is $9\sqrt{5}$.'
        constraints: "only like radicals (same radicand) combine"
      - id: kp2
        name: "Simplify first, then combine"
        key_prerequisites: [simplifying-radicals]
        exemplars:
          - problem: 'Simplify $\sqrt{8} + \sqrt{18}$.'
            answer: "5*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Simplify each radical: $\sqrt{8} = 2\sqrt{2}$ and $\sqrt{18} = 3\sqrt{2}$. Then $2\sqrt{2} + 3\sqrt{2} = 5\sqrt{2}$.'
          - problem: 'Two squares with areas $12$ and $48$ square units stand side by side on a line. How long is the combined bottom edge?'
            answer: "6*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The sides are $\sqrt{12} = 2\sqrt{3}$ and $\sqrt{48} = 4\sqrt{3}$. Together they give $2\sqrt{3} + 4\sqrt{3} = 6\sqrt{3}$.'
          - problem: 'Simplify $\sqrt{27} - \sqrt{12}$.'
            answer: "sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Simplify each radical: $\sqrt{27} = 3\sqrt{3}$ and $\sqrt{12} = 2\sqrt{3}$. Then $3\sqrt{3} - 2\sqrt{3} = \sqrt{3}$.'
          - problem: 'One square has an area of $75$ square units and another has an area of $27$ square units. How much longer is a side of the larger square?'
            answer: "2*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The sides are $\sqrt{75} = 5\sqrt{3}$ and $\sqrt{27} = 3\sqrt{3}$. The difference is $5\sqrt{3} - 3\sqrt{3} = 2\sqrt{3}$.'
          - problem: 'Lena writes $\sqrt{20} + \sqrt{45} = \sqrt{65}$. What is the correct simplified sum?'
            answer: "5*sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Radicands do not add, so simplify each radical: $\sqrt{20} = 2\sqrt{5}$ and $\sqrt{45} = 3\sqrt{5}$. The sum is $5\sqrt{5}$.'
          - problem: 'What is $\sqrt{50} - \sqrt{8}$?'
            answer: "3*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Simplify each radical: $\sqrt{50} = 5\sqrt{2}$ and $\sqrt{8} = 2\sqrt{2}$. Then $5\sqrt{2} - 2\sqrt{2} = 3\sqrt{2}$.'
          - problem: 'Simplify $\sqrt{63} - \sqrt{28}$.'
            answer: "sqrt(7)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Simplify each radical: $\sqrt{63} = 3\sqrt{7}$ and $\sqrt{28} = 2\sqrt{7}$. Then $3\sqrt{7} - 2\sqrt{7} = \sqrt{7}$.'
        constraints: "reduce each radical before combining"
      - id: kp3
        name: "Three terms and coefficients"
        key_prerequisites: [simplifying-radicals, combining-like-terms]
        exemplars:
          - problem: 'Simplify $\sqrt{12} + \sqrt{27} - \sqrt{3}$.'
            answer: "4*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Simplify each radical: $2\sqrt{3} + 3\sqrt{3} - \sqrt{3}$. The coefficients give $2 + 3 - 1 = 4$, so the result is $4\sqrt{3}$.'
          - problem: 'A triangle has sides of length $\sqrt{8}$, $\sqrt{18}$ and $\sqrt{32}$. Find its perimeter.'
            answer: "9*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Simplify each side: $2\sqrt{2}$, $3\sqrt{2}$ and $4\sqrt{2}$. The perimeter is $(2 + 3 + 4)\sqrt{2} = 9\sqrt{2}$.'
          - problem: 'Simplify $2\sqrt{45} - \sqrt{20}$.'
            answer: "4*sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Simplify each radical: $2\sqrt{45} = 2 \cdot 3\sqrt{5} = 6\sqrt{5}$ and $\sqrt{20} = 2\sqrt{5}$. Then $6\sqrt{5} - 2\sqrt{5} = 4\sqrt{5}$.'
          - problem: 'A fence goes around a rectangular garden that is $\sqrt{50}$ long and $\sqrt{18}$ wide. How long is the fence?'
            answer: "16*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'The sides simplify to $5\sqrt{2}$ and $3\sqrt{2}$. The perimeter is $2(5\sqrt{2} + 3\sqrt{2}) = 2 \cdot 8\sqrt{2} = 16\sqrt{2}$.'
          - problem: 'What is $3\sqrt{20} - \sqrt{45}$?'
            answer: "3*sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Simplify each radical: $3\sqrt{20} = 3 \cdot 2\sqrt{5} = 6\sqrt{5}$ and $\sqrt{45} = 3\sqrt{5}$. Then $6\sqrt{5} - 3\sqrt{5} = 3\sqrt{5}$.'
          - problem: 'Simplify $5\sqrt{12} - 2\sqrt{75} + \sqrt{27}$.'
            answer: "3*sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Simplify each term: $5\sqrt{12} = 10\sqrt{3}$, $2\sqrt{75} = 10\sqrt{3}$ and $\sqrt{27} = 3\sqrt{3}$. The coefficients give $10 - 10 + 3 = 3$, so the result is $3\sqrt{3}$.'
          - problem: 'Ola simplifies $\sqrt{8} + \sqrt{32} - \sqrt{2}$ and gets $\sqrt{38}$. What is the correct result?'
            answer: "5*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Radicands cannot be added and subtracted directly. Simplifying gives $2\sqrt{2} + 4\sqrt{2} - \sqrt{2} = 5\sqrt{2}$.'
        constraints: "at most three terms; all reduce to one common radicand"
    diagnostic_exemplar:
      problem: 'Simplify $\sqrt{50} + \sqrt{18} - \sqrt{2}$.'
      answer: '7*sqrt(2)'
      solution_sketch: '$5\sqrt{2} + 3\sqrt{2} - \sqrt{2} = 7\sqrt{2}$.'
    anki_seeds:
      - front: "You may add or subtract two radicals only when ..."
        back: "they are like radicals (identical radicands): a*sqrt(c) + b*sqrt(c) = (a+b)*sqrt(c)"
        type: basic

  - id: radical-operations
    name: "Operations with Radicals"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 100
    prerequisites:
      - id: adding-subtracting-radicals
        weight: 0.7
        key: true
      - id: simplifying-radicals
        weight: 0.6
        key: true
      - id: distributive-property
        weight: 0.4
      - id: multiplying-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Multiply radicals"
        key_prerequisites: [simplifying-radicals]
        exemplars:
          - problem: 'Simplify $\sqrt{3} \cdot \sqrt{12}$.'
            answer: "6"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Multiply under one root: $\sqrt{3 \cdot 12} = \sqrt{36}$. Since $6^2 = 36$, the product is $6$.'
          - problem: 'Simplify $4\sqrt{3} \cdot 2\sqrt{5}$.'
            answer: "8*sqrt(15)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Multiply the coefficients: $4 \cdot 2 = 8$. Multiply the radicands: $\sqrt{3 \cdot 5} = \sqrt{15}$, and $15$ has no square factor, so the product is $8\sqrt{15}$.'
          - problem: 'A rectangle measures $3\sqrt{2}$ cm by $\sqrt{6}$ cm. Find its area.'
            answer: "6*sqrt(3)"
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'Area is length times width: $3\sqrt{2} \cdot \sqrt{6} = 3\sqrt{12}$. Since $\sqrt{12} = 2\sqrt{3}$, the area is $6\sqrt{3}$ square centimetres.'
          - problem: 'Simplify $3\sqrt{2} \cdot 2\sqrt{8}$.'
            answer: "24"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Multiply the coefficients: $3 \cdot 2 = 6$. Multiply the radicands: $\sqrt{2 \cdot 8} = \sqrt{16} = 4$, so the product is $6 \cdot 4 = 24$.'
          - problem: 'A square has sides of length $2\sqrt{7}$ m. Find its area.'
            answer: "28"
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area is the side squared: $(2\sqrt{7})^2 = 2^2 \cdot 7$. That is $4 \cdot 7 = 28$ square metres.'
          - problem: 'Mia simplifies $2\sqrt{3} \cdot 5\sqrt{3}$ and gets $10\sqrt{3}$. What is the correct value?'
            answer: "30"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Mia multiplied the coefficients but kept $\sqrt{3}$ instead of multiplying the roots. The coefficients give $2 \cdot 5 = 10$ and $\sqrt{3} \cdot \sqrt{3} = 3$, so the value is $10 \cdot 3 = 30$.'
          - problem: 'Simplify $\sqrt{6} \cdot \sqrt{10}$.'
            answer: "2*sqrt(15)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Multiply under one root: $\sqrt{60}$. Since $60 = 4 \cdot 15$, the product simplifies to $2\sqrt{15}$.'
          - problem: 'A right triangle has legs of length $\sqrt{8}$ cm and $\sqrt{18}$ cm. Find its area.'
            answer: "6"
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'The area is half the product of the legs: $\frac{1}{2}\sqrt{8 \cdot 18} = \frac{1}{2}\sqrt{144}$. That is $\frac{1}{2} \cdot 12 = 6$ square centimetres.'
          - problem: 'What is $\sqrt{2} \cdot \sqrt{8}$?'
            answer: "4"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Multiply under one root: $\sqrt{2 \cdot 8} = \sqrt{16}$. Since $4^2 = 16$, the product is $4$.'
        constraints: "sqrt(a)*sqrt(b) = sqrt(ab); multiply coefficients separately"
      - id: kp2
        name: "Distribute a radical over a sum"
        key_prerequisites: [distributive-property, simplifying-radicals]
        exemplars:
          - problem: 'Expand and simplify $\sqrt{2}(\sqrt{6} + \sqrt{3})$.'
            answer: "2*sqrt(3) + sqrt(6)"
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            solution_sketch: 'Distribute: $\sqrt{2}\cdot\sqrt{6} + \sqrt{2}\cdot\sqrt{3} = \sqrt{12} + \sqrt{6}$. Since $\sqrt{12} = 2\sqrt{3}$, the result is $2\sqrt{3} + \sqrt{6}$.'
          - problem: 'Expand and simplify $\sqrt{3}(2\sqrt{3} - 5)$.'
            answer: "6 - 5*sqrt(3)"
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            solution_sketch: 'Distribute: $\sqrt{3}\cdot 2\sqrt{3} = 2 \cdot 3 = 6$ and $\sqrt{3}\cdot 5 = 5\sqrt{3}$. The result is $6 - 5\sqrt{3}$.'
          - problem: 'A rectangular garden is $\sqrt{5}$ m wide and $(3\sqrt{5} - 1)$ m long. Find its area.'
            answer: "15 - sqrt(5)"
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'Area is width times length: $\sqrt{5}(3\sqrt{5} - 1) = 3 \cdot 5 - \sqrt{5}$. The area is $15 - \sqrt{5}$ square metres.'
          - problem: 'Multiply out $\sqrt{3}(\sqrt{12} - \sqrt{2})$ and simplify.'
            answer: "6 - sqrt(6)"
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            solution_sketch: 'Distribute: $\sqrt{3 \cdot 12} - \sqrt{3 \cdot 2} = \sqrt{36} - \sqrt{6}$. Since $\sqrt{36} = 6$, the result is $6 - \sqrt{6}$.'
          - problem: 'A rectangle is $\sqrt{6}$ cm wide and $(\sqrt{6} + \sqrt{2})$ cm long. Find its area.'
            answer: "6 + 2*sqrt(3)"
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'Area is width times length: $\sqrt{6}\cdot\sqrt{6} + \sqrt{6}\cdot\sqrt{2} = 6 + \sqrt{12}$. Since $\sqrt{12} = 2\sqrt{3}$, the area is $6 + 2\sqrt{3}$ square centimetres.'
          - problem: 'Leo writes $\sqrt{2}(\sqrt{8} + 3) = 4 + 3$. What is the correct value of $\sqrt{2}(\sqrt{8} + 3)$?'
            answer: "4 + 3*sqrt(2)"
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            solution_sketch: 'Leo did not multiply the $3$ by $\sqrt{2}$. The products are $\sqrt{2}\cdot\sqrt{8} = \sqrt{16} = 4$ and $\sqrt{2}\cdot 3 = 3\sqrt{2}$, so the value is $4 + 3\sqrt{2}$.'
          - problem: 'Expand and simplify $\sqrt{5}(3\sqrt{5} + 2)$.'
            answer: "15 + 2*sqrt(5)"
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            solution_sketch: 'Distribute: $\sqrt{5}\cdot 3\sqrt{5} = 3 \cdot 5 = 15$ and $\sqrt{5}\cdot 2 = 2\sqrt{5}$. The result is $15 + 2\sqrt{5}$.'
          - problem: 'Multiply out $2\sqrt{3}(\sqrt{6} - \sqrt{3})$ and simplify.'
            answer: "6*sqrt(2) - 6"
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            solution_sketch: 'Distribute: $2\sqrt{18} - 2\cdot 3$. Since $\sqrt{18} = 3\sqrt{2}$, the result is $6\sqrt{2} - 6$.'
        constraints: "distribute, then simplify each product"
      - id: kp3
        name: "Binomial products and conjugates"
        key_prerequisites: [adding-subtracting-radicals, distributive-property]
        exemplars:
          - problem: 'Expand and simplify $(1 + \sqrt{2})(3 - \sqrt{2})$.'
            answer: "1 + 2*sqrt(2)"
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            solution_sketch: 'Multiply each term by each term: $3 - \sqrt{2} + 3\sqrt{2} - 2$. Combine like terms to get $1 + 2\sqrt{2}$.'
          - problem: 'Expand and simplify $(2 + \sqrt{5})(1 - \sqrt{5})$.'
            answer: "-3 - sqrt(5)"
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            solution_sketch: 'Multiply each term by each term: $2 - 2\sqrt{5} + \sqrt{5} - 5$. Combine like terms to get $-3 - \sqrt{5}$.'
          - problem: 'A square has sides of length $(2 + \sqrt{3})$ cm. Find its area.'
            answer: "7 + 4*sqrt(3)"
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'The area is $(2 + \sqrt{3})^2 = 4 + 2\sqrt{3} + 2\sqrt{3} + 3$. Combining like terms gives $7 + 4\sqrt{3}$ square centimetres.'
          - problem: 'Simplify $(2 + \sqrt{3})(2 - \sqrt{3})$.'
            answer: "1"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'This is a conjugate pair, so the radical terms cancel. The product is $2^2 - 3 = 4 - 3 = 1$.'
          - problem: 'A rectangle measures $(\sqrt{5} + 1)$ m by $(\sqrt{5} - 1)$ m. Find its area.'
            answer: "4"
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The sides form a conjugate pair, so the radical terms cancel. The area is $5 - 1 = 4$ square metres.'
          - problem: 'Ana writes $(3 + \sqrt{2})^2 = 9 + 2 = 11$. What is the correct value of $(3 + \sqrt{2})^2$?'
            answer: "11 + 6*sqrt(2)"
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            solution_sketch: 'Ana left out the two middle terms. Expanding gives $9 + 3\sqrt{2} + 3\sqrt{2} + 2 = 11 + 6\sqrt{2}$.'
          - problem: 'What is $(3 + \sqrt{2})(3 - \sqrt{2})$?'
            answer: "7"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'This is a conjugate pair, so the middle terms cancel. The product is $9 - 2 = 7$.'
          - problem: 'Expand and simplify $(\sqrt{3} + \sqrt{2})(\sqrt{3} + 2\sqrt{2})$.'
            answer: "7 + 3*sqrt(6)"
            answer_contract: {"kind":"required_form","form":"simplest_radical_sum"}
            solution_sketch: 'Multiply each term by each term: $3 + 2\sqrt{6} + \sqrt{6} + 2 \cdot 2$. Combine like terms to get $7 + 3\sqrt{6}$.'
        constraints: "FOIL-style products; conjugate pairs give integers"
    diagnostic_exemplar:
      problem: 'Expand and simplify $(2 + \sqrt{3})(1 + \sqrt{3})$.'
      answer: '5 + 3*sqrt(3)'
      solution_sketch: '$2 + 2\sqrt{3} + \sqrt{3} + 3 = 5 + 3\sqrt{3}$.'
    anki_seeds:
      - front: "Product rule for radicals: sqrt(a) * sqrt(b) = ?"
        back: "sqrt(a*b)"
        type: basic
      - front: "(a + sqrt(b))(a - sqrt(b)) = ?"
        back: "a^2 - b"
        type: basic

  - id: dividing-radicals
    name: "Dividing Radicals"
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: simplifying-radicals
        weight: 0.7
        key: true
      - id: dividing-fractions
        weight: 0.4
        key: true
      - id: square-roots
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Quotient rule for radicals"
        key_prerequisites: [square-roots]
        exemplars:
          - problem: 'Simplify $\frac{\sqrt{50}}{\sqrt{2}}$.'
            answer: "5"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Divide under one root: $\sqrt{50/2} = \sqrt{25}$. Since $5^2 = 25$, the quotient is $5$.'
          - problem: 'A rectangle has area $\sqrt{72}$ cm$^2$ and width $\sqrt{2}$ cm. Find its length.'
            answer: "6"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The length is the area divided by the width: $\frac{\sqrt{72}}{\sqrt{2}} = \sqrt{36}$. So the length is $6$ cm.'
          - problem: 'What is $\frac{\sqrt{48}}{\sqrt{3}}$?'
            answer: "4"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Divide under one root: $\sqrt{48/3} = \sqrt{16}$. Since $4^2 = 16$, the quotient is $4$.'
          - problem: 'One rope is $\sqrt{98}$ m long and another is $\sqrt{2}$ m long. How many times longer is the first rope than the second?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the two lengths: $\frac{\sqrt{98}}{\sqrt{2}} = \sqrt{49}$. Since $\sqrt{49} = 7$, the first rope is $7$ times as long.'
          - problem: 'Evaluate $\frac{\sqrt{45}}{\sqrt{5}}$.'
            answer: "3"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Divide under one root: $\sqrt{45/5} = \sqrt{9}$. Since $3^2 = 9$, the quotient is $3$.'
          - problem: 'Kai writes $\frac{\sqrt{600}}{\sqrt{6}} = \sqrt{594}$. What is the correct value of $\frac{\sqrt{600}}{\sqrt{6}}$?'
            answer: "10"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Kai subtracted the radicands instead of dividing them. The quotient is $\sqrt{600/6} = \sqrt{100} = 10$.'
          - problem: 'Simplify $\frac{\sqrt{30}}{\sqrt{6}}$.'
            answer: "sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Divide under one root: $\sqrt{30/6}$. The radicand is $5$, which has no square factor, so the quotient is $\sqrt{5}$.'
        constraints: "quotient of radicands is a perfect square"
      - id: kp2
        name: "Roots of fractions with simplification"
        key_prerequisites: [dividing-fractions, simplifying-radicals]
        exemplars:
          - problem: 'Simplify $\sqrt{\frac{18}{49}}$.'
            answer: "3*sqrt(2)/7"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Split the root: $\frac{\sqrt{18}}{\sqrt{49}}$. Since $\sqrt{18} = 3\sqrt{2}$ and $\sqrt{49} = 7$, the result is $\frac{3\sqrt{2}}{7}$.'
          - problem: 'A square tile has area $\frac{75}{16}$ cm$^2$. How long is each side?'
            answer: "5*sqrt(3)/4"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'The side is the square root of the area: $\frac{\sqrt{75}}{\sqrt{16}}$. Since $\sqrt{75} = 5\sqrt{3}$ and $\sqrt{16} = 4$, each side is $\frac{5\sqrt{3}}{4}$ cm.'
          - problem: 'Simplify $\sqrt{\frac{50}{81}}$.'
            answer: "5*sqrt(2)/9"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Split the root: $\frac{\sqrt{50}}{\sqrt{81}}$. Since $\sqrt{50} = 5\sqrt{2}$ and $\sqrt{81} = 9$, the result is $\frac{5\sqrt{2}}{9}$.'
          - problem: 'What is $\sqrt{\frac{48}{25}}$?'
            answer: "4*sqrt(3)/5"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Split the root: $\frac{\sqrt{48}}{\sqrt{25}}$. Since $\sqrt{48} = 4\sqrt{3}$ and $\sqrt{25} = 5$, the result is $\frac{4\sqrt{3}}{5}$.'
          - problem: 'A square garden has area $\frac{98}{9}$ m$^2$. Find the length of one side.'
            answer: "7*sqrt(2)/3"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'The side is the square root of the area: $\frac{\sqrt{98}}{\sqrt{9}}$. Since $\sqrt{98} = 7\sqrt{2}$ and $\sqrt{9} = 3$, the side is $\frac{7\sqrt{2}}{3}$ m.'
          - problem: 'Evaluate $\sqrt{\frac{20}{36}}$.'
            answer: "sqrt(5)/3"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Split the root: $\frac{\sqrt{20}}{\sqrt{36}} = \frac{2\sqrt{5}}{6}$. Reduce the common factor $2$ to get $\frac{\sqrt{5}}{3}$.'
          - problem: 'Zoe simplifies $\sqrt{\frac{27}{4}}$ to $\frac{3\sqrt{3}}{4}$. What is the correct value of $\sqrt{\frac{27}{4}}$?'
            answer: "3*sqrt(3)/2"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Zoe took the root of the numerator but not of the denominator. Since $\sqrt{27} = 3\sqrt{3}$ and $\sqrt{4} = 2$, the value is $\frac{3\sqrt{3}}{2}$.'
        constraints: "perfect-square denominators; numerator may need simplifying"
      - id: kp3
        name: "Quotients with coefficients"
        key_prerequisites: [simplifying-radicals, dividing-fractions]
        exemplars:
          - problem: 'Simplify $\frac{6\sqrt{20}}{3\sqrt{5}}$.'
            answer: "4"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Divide the coefficients: $6/3 = 2$. Divide the radicands: $\sqrt{20/5} = \sqrt{4} = 2$, so the quotient is $2 \cdot 2 = 4$.'
          - problem: 'A path $8\sqrt{18}$ m long is marked into sections that are each $2\sqrt{2}$ m long. How many sections are there?'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of sections is the total length divided by one section: $\frac{8\sqrt{18}}{2\sqrt{2}} = 4\sqrt{9}$. That is $4 \cdot 3 = 12$ sections.'
          - problem: 'What is $\frac{10\sqrt{27}}{5\sqrt{3}}$?'
            answer: "6"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Divide the coefficients: $10/5 = 2$. Divide the radicands: $\sqrt{27/3} = \sqrt{9} = 3$, so the quotient is $2 \cdot 3 = 6$.'
          - problem: 'A rectangle has area $12\sqrt{30}$ cm$^2$ and one side of length $4\sqrt{6}$ cm. Find the length of the other side.'
            answer: "3*sqrt(5)"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'The other side is the area divided by the known side: $\frac{12\sqrt{30}}{4\sqrt{6}}$. Divide coefficients and radicands: $3\sqrt{5}$ cm.'
          - problem: 'Evaluate $\frac{12\sqrt{50}}{6\sqrt{2}}$.'
            answer: "10"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Divide the coefficients: $12/6 = 2$. Divide the radicands: $\sqrt{50/2} = \sqrt{25} = 5$, so the quotient is $2 \cdot 5 = 10$.'
          - problem: 'Simplify $\frac{15\sqrt{42}}{5\sqrt{6}}$.'
            answer: "3*sqrt(7)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Divide the coefficients: $15/5 = 3$. Divide the radicands: $\sqrt{42/6} = \sqrt{7}$, so the quotient is $3\sqrt{7}$.'
          - problem: 'Raj simplifies $\frac{8\sqrt{18}}{4\sqrt{2}}$ and gets $2\sqrt{16}$. What is the correct value?'
            answer: "6"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Raj subtracted the radicands instead of dividing them. The quotient is $\frac{8}{4}\sqrt{\frac{18}{2}} = 2\sqrt{9} = 2 \cdot 3 = 6$.'
          - problem: 'Tower A is $20\sqrt{3}$ m tall and tower B is $5\sqrt{12}$ m tall. How many times taller is tower A than tower B?'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the heights: $\frac{20\sqrt{3}}{5\sqrt{12}} = 4\sqrt{\frac{3}{12}} = 4 \cdot \frac{1}{2}$. Tower A is $2$ times as tall as tower B.'
        constraints: "divide coefficients and radicands separately"
    diagnostic_exemplar:
      problem: 'Simplify $\sqrt{\frac{50}{9}}$.'
      answer: '5*sqrt(2)/3'
      solution_sketch: '$\frac{\sqrt{50}}{\sqrt{9}} = \frac{5\sqrt{2}}{3}$.'
    anki_seeds:
      - front: "Quotient rule for radicals: sqrt(a) / sqrt(b) = ?"
        back: "sqrt(a/b)"
        type: basic

  - id: rationalizing-denominators
    name: "Rationalizing Denominators"
    core: true
    difficulty: 0.58
    drill: false
    answer_kind: expression
    expected_time_secs: 100
    prerequisites:
      - id: dividing-radicals
        weight: 0.7
        key: true
      - id: radical-operations
        weight: 0.5
        key: true
      - id: equivalent-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Single-radical denominators"
        key_prerequisites: [dividing-radicals]
        try_first:
          problem: 'Compute $\sqrt{7} \cdot \sqrt{7}$.'
          answer_contract: {"kind":"exact"}
          answer: '7'
          reveal: 'A square root times itself is a whole number: $\sqrt7\cdot\sqrt7=7$. Multiplying the top and bottom of $\frac{a}{\sqrt7}$ by $\sqrt7$ therefore turns the denominator into $7$ without changing the value.'
        exemplars:
          - problem: 'Rationalize the denominator of $\frac{1}{\sqrt{2}}$.'
            answer: "sqrt(2)/2"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Multiply the top and bottom by $\sqrt{2}$. The denominator becomes $\sqrt{2}\cdot\sqrt{2} = 2$, so the result is $\frac{\sqrt{2}}{2}$.'
          - problem: 'Rationalize the denominator of $\frac{5}{\sqrt{3}}$.'
            answer: "5*sqrt(3)/3"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Multiply the top and bottom by $\sqrt{3}$. The denominator becomes $3$, so the result is $\frac{5\sqrt{3}}{3}$.'
          - problem: 'A rectangle has area $6$ m$^2$ and width $\sqrt{3}$ m. Find its length.'
            answer: "2*sqrt(3)"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'The length is the area divided by the width: $\frac{6}{\sqrt{3}}$. Multiplying top and bottom by $\sqrt{3}$ gives $\frac{6\sqrt{3}}{3} = 2\sqrt{3}$ m.'
          - problem: 'Write $\frac{7}{\sqrt{5}}$ with a rational denominator.'
            answer: "7*sqrt(5)/5"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Multiply the top and bottom by $\sqrt{5}$. The denominator becomes $5$, so the result is $\frac{7\sqrt{5}}{5}$.'
          - problem: 'The diagonal of a square is $\sqrt{2}$ times as long as its side. A square has a diagonal of $8$ cm. How long is each side?'
            answer: "4*sqrt(2)"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'The side is the diagonal divided by $\sqrt{2}$: $\frac{8}{\sqrt{2}}$. Multiplying top and bottom by $\sqrt{2}$ gives $\frac{8\sqrt{2}}{2} = 4\sqrt{2}$ cm.'
          - problem: 'Write $\frac{3}{\sqrt{6}}$ with a rational denominator.'
            answer: "sqrt(6)/2"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Multiply the top and bottom by $\sqrt{6}$ to get $\frac{3\sqrt{6}}{6}$. Reduce the common factor $3$ to get $\frac{\sqrt{6}}{2}$.'
          - problem: 'Eli rationalizes $\frac{4}{\sqrt{7}}$ and writes $\frac{4\sqrt{7}}{49}$. What is the correct result?'
            answer: "4*sqrt(7)/7"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Eli squared $7$ instead of multiplying $\sqrt{7}$ by $\sqrt{7}$. Since $\sqrt{7}\cdot\sqrt{7} = 7$, the result is $\frac{4\sqrt{7}}{7}$.'
        constraints: "multiply top and bottom by the radical"
      - id: kp2
        name: "Simplify before or after rationalizing"
        key_prerequisites: [dividing-radicals]
        exemplars:
          - problem: 'Rationalize and simplify $\frac{6}{\sqrt{12}}$.'
            answer: "sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Reduce the radical: $\sqrt{12} = 2\sqrt{3}$, so $\frac{6}{2\sqrt{3}} = \frac{3}{\sqrt{3}}$. Multiplying top and bottom by $\sqrt{3}$ gives $\frac{3\sqrt{3}}{3} = \sqrt{3}$.'
          - problem: 'Rationalize and simplify $\frac{8}{\sqrt{20}}$.'
            answer: "4*sqrt(5)/5"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Reduce the radical: $\sqrt{20} = 2\sqrt{5}$, so $\frac{8}{2\sqrt{5}} = \frac{4}{\sqrt{5}}$. Multiplying top and bottom by $\sqrt{5}$ gives $\frac{4\sqrt{5}}{5}$.'
          - problem: 'A rectangle has area $12$ cm$^2$ and width $\sqrt{8}$ cm. Find its length.'
            answer: "3*sqrt(2)"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'The length is the area divided by the width: $\frac{12}{\sqrt{8}} = \frac{12}{2\sqrt{2}} = \frac{6}{\sqrt{2}}$. Multiplying top and bottom by $\sqrt{2}$ gives $3\sqrt{2}$ cm.'
          - problem: 'Simplify $\frac{10}{\sqrt{50}}$.'
            answer: "sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Reduce the radical: $\sqrt{50} = 5\sqrt{2}$, so $\frac{10}{5\sqrt{2}} = \frac{2}{\sqrt{2}}$. Multiplying top and bottom by $\sqrt{2}$ gives $\frac{2\sqrt{2}}{2} = \sqrt{2}$.'
          - problem: 'A rectangular plot has area $15$ m$^2$ and length $\sqrt{45}$ m. Find its width.'
            answer: "sqrt(5)"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'The width is the area divided by the length: $\frac{15}{\sqrt{45}} = \frac{15}{3\sqrt{5}} = \frac{5}{\sqrt{5}}$. Multiplying top and bottom by $\sqrt{5}$ gives $\sqrt{5}$ m.'
          - problem: 'Nora simplifies $\frac{9}{\sqrt{27}}$ and writes $\frac{1}{3}$. What is the correct value of $\frac{9}{\sqrt{27}}$?'
            answer: "sqrt(3)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Nora divided $9$ by $27$ as if the root were not there. Since $\sqrt{27} = 3\sqrt{3}$, the value is $\frac{9}{3\sqrt{3}} = \frac{3}{\sqrt{3}} = \sqrt{3}$.'
          - problem: 'Simplify $\frac{4}{\sqrt{24}}$.'
            answer: "sqrt(6)/3"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Reduce the radical: $\sqrt{24} = 2\sqrt{6}$, so $\frac{4}{2\sqrt{6}} = \frac{2}{\sqrt{6}}$. Multiplying top and bottom by $\sqrt{6}$ gives $\frac{2\sqrt{6}}{6} = \frac{\sqrt{6}}{3}$.'
        constraints: "reduce the radical first to keep numbers small"
      - id: kp3
        name: "Conjugate denominators"
        key_prerequisites: [radical-operations]
        exemplars:
          - problem: 'Rationalize the denominator of $\frac{2}{1 + \sqrt{3}}$.'
            answer: "sqrt(3) - 1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by the conjugate $1 - \sqrt{3}$. The denominator is $1 - 3 = -2$, so the result is $\frac{2(1 - \sqrt{3})}{-2} = \sqrt{3} - 1$.'
          - problem: 'Rationalize the denominator of $\frac{1}{\sqrt{5} - 2}$.'
            answer: "sqrt(5) + 2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by the conjugate $\sqrt{5} + 2$. The denominator is $5 - 4 = 1$, so the result is $\sqrt{5} + 2$.'
          - problem: 'A rectangle has area $4$ m$^2$ and width $(\sqrt{3} + 1)$ m. Find its length, written without a radical in the denominator.'
            answer: "2*sqrt(3) - 2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The length is $\frac{4}{\sqrt{3} + 1}$. Multiply top and bottom by $\sqrt{3} - 1$: the denominator is $3 - 1 = 2$, so the length is $2(\sqrt{3} - 1) = 2\sqrt{3} - 2$ m.'
          - problem: 'Write $\frac{3}{2 + \sqrt{5}}$ without a radical in the denominator.'
            answer: "-6 + 3*sqrt(5)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by the conjugate $2 - \sqrt{5}$. The denominator is $4 - 5 = -1$, so the result is $-3(2 - \sqrt{5}) = -6 + 3\sqrt{5}$.'
          - problem: 'A rectangle measures $2$ cm by $(\sqrt{5} - 1)$ cm. Find the ratio of the longer side to the shorter side, written without a radical in the denominator.'
            answer: "(1 + sqrt(5))/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $\sqrt{5} - 1 \approx 1.24$, the longer side is $2$ cm and the ratio is $\frac{2}{\sqrt{5} - 1}$. Multiplying by $\sqrt{5} + 1$ gives $\frac{2(\sqrt{5} + 1)}{4} = \frac{1 + \sqrt{5}}{2}$.'
          - problem: 'Simplify $\frac{1}{\sqrt{10} - 3}$ by rationalizing the denominator.'
            answer: "sqrt(10) + 3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by the conjugate $\sqrt{10} + 3$. The denominator is $10 - 9 = 1$, so the result is $\sqrt{10} + 3$.'
          - problem: 'Ivy rationalizes $\frac{4}{3 - \sqrt{5}}$ and gets $\frac{4(3 + \sqrt{5})}{9 + 5}$. What is the correct result?'
            answer: "3 + sqrt(5)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ivy added in the denominator, but the conjugate product is $9 - 5 = 4$. So the result is $\frac{4(3 + \sqrt{5})}{4} = 3 + \sqrt{5}$.'
          - problem: 'Write $\frac{6}{\sqrt{7} + \sqrt{5}}$ with a rational denominator.'
            answer: "3*sqrt(7) - 3*sqrt(5)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply top and bottom by the conjugate $\sqrt{7} - \sqrt{5}$. The denominator is $7 - 5 = 2$, so the result is $3(\sqrt{7} - \sqrt{5}) = 3\sqrt{7} - 3\sqrt{5}$.'
        constraints: "multiply by the conjugate; denominator becomes an integer"
    diagnostic_exemplar:
      problem: 'Rationalize $\frac{2}{\sqrt{3} + 1}$.'
      answer: 'sqrt(3) - 1'
      solution_sketch: 'Multiply by $\frac{\sqrt{3} - 1}{\sqrt{3} - 1}$: $\frac{2(\sqrt{3} - 1)}{2} = \sqrt{3} - 1$.'
    anki_seeds:
      - front: "To rationalize 1/sqrt(a), multiply by ..."
        back: "sqrt(a)/sqrt(a), giving sqrt(a)/a"
        type: basic
      - front: "To rationalize a denominator of the form a + sqrt(b), multiply by ..."
        back: "the conjugate a - sqrt(b)"
        type: basic

  - id: radical-exponent-conversion
    name: "Converting Between Radical and Exponent Form"
    core: true
    difficulty: 0.48
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: square-roots
        weight: 0.6
        key: true
      - id: cube-roots
        weight: 0.5
        key: true
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Unit fractions: a^(1/n) is an nth root"
        key_prerequisites: [square-roots, cube-roots]
        try_first:
          problem: 'Find $k$ if $x^{1/2} \cdot x^{1/2} = x^k$.'
          answer_contract: {"kind":"exact"}
          answer: '1'
          reveal: 'Adding exponents gives $x^{1/2}\cdot x^{1/2}=x^1=x$. The positive number that multiplied by itself gives $x$ is $\sqrt{x}$, so $x^{1/2}=\sqrt{x}$.'
        exemplars:
          - problem: 'Write $\sqrt[4]{x}$ as a power of $x$ for $x > 0$.'
            answer: "x^(1/4)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'A root with index $4$ is the power with exponent $1/4$. So $\sqrt[4]{x} = x^{1/4}$.'
          - problem: 'Write $x^{1/3}$ in radical form.'
            answer: "root(3, x)"
            answer_contract: {"kind":"required_form","form":"radical"}
            solution_sketch: 'The denominator $3$ of the unit fractional exponent is the root index. So $x^{1/3}$ is the cube root of $x$, written $\sqrt[3]{x}$.'
          - problem: 'A square has area $A$. Write its side length as a power of $A$.'
            answer: "A^(1/2)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'The side of a square is the square root of its area, $\sqrt{A}$. A square root is the power $1/2$, so the side length is $A^{1/2}$.'
          - problem: 'A cube has volume $V$. Write its edge length as a power of $V$.'
            answer: "V^(1/3)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'The edge of a cube is the cube root of its volume, $\sqrt[3]{V}$. A cube root is the power $1/3$, so the edge length is $V^{1/3}$.'
          - problem: 'Write $y^{1/5}$ in radical form for $y > 0$.'
            answer: "root(5, y)"
            answer_contract: {"kind":"required_form","form":"radical"}
            solution_sketch: 'The denominator $5$ of the unit fractional exponent is the root index. So $y^{1/5}$ is the fifth root of $y$, written $\sqrt[5]{y}$.'
          - problem: 'Write $\sqrt[6]{t}$ as a power of $t$ for $t > 0$.'
            answer: "t^(1/6)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'A root with index $6$ is the power with exponent $1/6$. So $\sqrt[6]{t} = t^{1/6}$.'
          - problem: 'Write $5^{1/2}$ in radical form.'
            answer: "sqrt(5)"
            answer_contract: {"kind":"required_form","form":"radical"}
            solution_sketch: 'An exponent of $1/2$ means a root with index $2$, the square root. So $5^{1/2} = \sqrt{5}$, and the index $2$ is not written.'
        constraints: "a^(1/n) is the nth root of a"
      - id: kp2
        name: "General m/n form"
        key_prerequisites: [cube-roots]
        exemplars:
          - problem: 'Write $\sqrt[5]{x^3}$ as a power of $x$ for $x > 0$.'
            answer: "x^(3/5)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'The power inside the root is $3$ and the root index is $5$. The power goes over the index, so $\sqrt[5]{x^3} = x^{3/5}$.'
          - problem: 'Write $x^{3/4}$ in radical form for $x > 0$.'
            answer: "root(4, x^3)"
            answer_contract: {"kind":"required_form","form":"radical"}
            solution_sketch: 'The numerator $3$ is the power inside the root and the denominator $4$ is the root index. So $x^{3/4} = \sqrt[4]{x^3}$.'
          - problem: 'A cube has volume $V$. Write the area of one face as a power of $V$.'
            answer: "V^(2/3)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'The edge is $V^{1/3}$ and a face has area equal to the edge squared. So the face area is $(V^{1/3})^2 = V^{2/3}$.'
          - problem: 'A square has area $A$. A cube has edges as long as the sides of the square. Write the volume of the cube as a power of $A$.'
            answer: "A^(3/2)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'The side of the square is $A^{1/2}$, and the volume of the cube is that length cubed. So the volume is $(A^{1/2})^3 = A^{3/2}$.'
          - problem: 'Write $x^{2/5}$ in radical form for $x > 0$.'
            answer: "root(5, x^2)"
            answer_contract: {"kind":"required_form","form":"radical"}
            solution_sketch: 'The numerator $2$ is the power inside the root and the denominator $5$ is the root index. So $x^{2/5}$ is the fifth root of $x^2$, written $\sqrt[5]{x^2}$.'
          - problem: 'Write $\sqrt{x^5}$ as a power of $x$ for $x > 0$.'
            answer: "x^(5/2)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'The power inside the root is $5$ and a square root has index $2$. The power goes over the index, so $\sqrt{x^5} = x^{5/2}$.'
          - problem: 'Jon writes $\sqrt[4]{x^3} = x^{4/3}$. Write $\sqrt[4]{x^3}$ correctly as a power of $x$ for $x > 0$.'
            answer: "x^(3/4)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'Jon put the index over the power. The power $3$ goes in the numerator and the index $4$ in the denominator, so $\sqrt[4]{x^3} = x^{3/4}$.'
        constraints: "numerator is the power, denominator is the root index"
      - id: kp3
        name: "Evaluate unit fractional exponents"
        key_prerequisites: [square-roots, cube-roots]
        exemplars:
          - problem: 'Evaluate $25^{1/2}$.'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent $1/2$ means the square root. Since $5^2 = 25$, the value is $5$.'
          - problem: 'Evaluate $8^{1/3}$.'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent $1/3$ means the cube root. Since $2^3 = 8$, the value is $2$.'
          - problem: 'The edge length of a cube with volume $V$ is $V^{1/3}$. Find the edge length of a cube with volume $512$ cm$^3$.'
            answer: "8"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The edge length is $512^{1/3}$, the cube root of $512$. Since $8^3 = 512$, each edge is $8$ cm.'
          - problem: 'The side of a square with area $A$ is $A^{1/2}$. Find the side length of a square field with area $3600$ m$^2$.'
            answer: "60"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The side length is $3600^{1/2}$, the square root of $3600$. Since $60^2 = 3600$, each side is $60$ m.'
          - problem: 'What is $81^{1/4}$?'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent $1/4$ means the fourth root. Since $3^4 = 81$, the value is $3$.'
          - problem: 'Find $1000^{1/3}$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent $1/3$ means the cube root. Since $10^3 = 1000$, the value is $10$.'
          - problem: 'Pia says $64^{1/2} = 32$ because half of $64$ is $32$. What is the correct value of $64^{1/2}$?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The exponent $1/2$ means the square root, not half of the number. Since $8^2 = 64$, the value is $8$.'
          - problem: 'Evaluate $\left(\frac{16}{81}\right)^{1/4}$.'
            answer: "2/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take the fourth root of the numerator and of the denominator. Since $2^4 = 16$ and $3^4 = 81$, the value is $\frac{2}{3}$.'
        constraints: "perfect powers; positive base"
    diagnostic_exemplar:
      problem: 'Write $\sqrt{x^3}$ as a power of $x$.'
      answer: "x^(3/2)"
      solution_sketch: 'Power $3$, root index $2$.'
    anki_seeds:
      - front: "a^(1/n) = ?"
        back: "the nth root of a"
        type: basic

  - id: rational-exponents
    name: "Rational Exponents"
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: radical-exponent-conversion
        weight: 0.8
        key: true
      - id: negative-zero-exponents
        weight: 0.5
        key: true
      - id: power-rule-exponents
        weight: 0.5
      - id: simplifying-radicals
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Evaluate a^(m/n)"
        key_prerequisites: [radical-exponent-conversion]
        exemplars:
          - problem: 'Evaluate $8^{2/3}$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take the cube root first: $8^{1/3} = 2$. Then square it: $2^2 = 4$.'
          - problem: 'What is $9^{3/2}$?'
            answer: "27"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take the square root first: $9^{1/2} = 3$. Then cube it: $3^3 = 27$.'
          - problem: 'A bacteria population multiplies by $4$ every hour. By what factor does it grow in $1.5$ hours?'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In $1.5 = 3/2$ hours the growth factor is $4^{3/2}$. The square root of $4$ is $2$, and $2^3 = 8$.'
          - problem: 'The value of an investment multiplies by $27$ every $3$ years. By what factor does it grow in $2$ years?'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each year the value multiplies by $27^{1/3} = 3$, so over $2$ years the factor is $27^{2/3}$. That is $3^2 = 9$.'
          - problem: 'Evaluate $125^{2/3}$.'
            answer: "25"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take the cube root first: $125^{1/3} = 5$. Then square it: $5^2 = 25$.'
          - problem: 'Ben computes $25^{3/2}$ as $\frac{3}{2} \cdot 25 = 37.5$. What is the correct value of $25^{3/2}$?'
            answer: "125"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ben multiplied by the exponent instead of taking a root and a power. The square root of $25$ is $5$, and $5^3 = 125$.'
          - problem: 'The area of one face of a cube with volume $V$ is $V^{2/3}$. Find the area of one face of a cube with volume $1000$ cm$^3$.'
            answer: "100"
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'The face area is $1000^{2/3}$. The cube root of $1000$ is $10$, and $10^2 = 100$ square centimetres.'
          - problem: 'Evaluate $\left(\frac{4}{9}\right)^{3/2}$.'
            answer: "8/27"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take the square root first: $\left(\frac{4}{9}\right)^{1/2} = \frac{2}{3}$. Then cube it: $\frac{2^3}{3^3} = \frac{8}{27}$.'
        constraints: "take the root first, then the power; perfect powers only"
      - id: kp2
        name: "Negative rational exponents"
        key_prerequisites: [negative-zero-exponents, radical-exponent-conversion]
        exemplars:
          - problem: 'Evaluate $4^{-1/2}$.'
            answer: "1/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent gives a reciprocal: $4^{-1/2} = \frac{1}{4^{1/2}}$. Since $4^{1/2} = 2$, the value is $\frac{1}{2}$.'
          - problem: 'Evaluate $27^{-2/3}$.'
            answer: "1/9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent gives a reciprocal: $\frac{1}{27^{2/3}}$. The cube root of $27$ is $3$ and $3^2 = 9$, so the value is $\frac{1}{9}$.'
          - problem: 'A colony of cells multiplies by $9$ every hour. What fraction of its present size was it $30$ minutes ago?'
            answer: "1/3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Going back half an hour multiplies the size by $9^{-1/2}$. Since $9^{1/2} = 3$, the colony was $\frac{1}{3}$ of its present size.'
          - problem: 'The amount of a radioactive substance is multiplied by $\frac{1}{64}$ every $3$ days. By what factor is it multiplied over $2$ days?'
            answer: "1/16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Over $2$ days the factor is $\left(\frac{1}{64}\right)^{2/3} = 64^{-2/3}$. The cube root of $64$ is $4$ and $4^2 = 16$, so the factor is $\frac{1}{16}$.'
          - problem: 'What is $8^{-2/3}$?'
            answer: "1/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent gives a reciprocal: $\frac{1}{8^{2/3}}$. The cube root of $8$ is $2$ and $2^2 = 4$, so the value is $\frac{1}{4}$.'
          - problem: 'Tom writes $25^{-1/2} = -5$. What is the correct value of $25^{-1/2}$?'
            answer: "1/5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent gives a reciprocal, not a negative number. Since $25^{1/2} = 5$, the value is $\frac{1}{5}$.'
          - problem: 'Find $\left(\frac{1}{32}\right)^{-2/5}$.'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The negative exponent flips the fraction: $\left(\frac{1}{32}\right)^{-2/5} = 32^{2/5}$. The fifth root of $32$ is $2$ and $2^2 = 4$.'
        constraints: "negative exponent -> reciprocal, then evaluate"
      - id: kp3
        name: "Exponent laws with rational exponents"
        key_prerequisites: [power-rule-exponents, radical-exponent-conversion]
        exemplars:
          - problem: 'Simplify $x^{1/2} \cdot x^{1/3}$ for $x > 0$.'
            answer: "x^(5/6)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'Multiplying powers of the same base adds the exponents. With a common denominator, $\frac{1}{2} + \frac{1}{3} = \frac{3}{6} + \frac{2}{6} = \frac{5}{6}$, so the product is $x^{5/6}$.'
          - problem: 'Simplify $(x^{2/3})^3$ for $x > 0$.'
            answer: "x^2"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'A power of a power multiplies the exponents. Since $\frac{2}{3} \cdot 3 = 2$, the result is $x^2$.'
          - problem: 'A square has side length $x^{3/4}$ cm. Write its area, in cm$^2$, as a single power of $x$.'
            answer: "x^(3/2)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'The area is the side squared: $(x^{3/4})^2$. Multiplying the exponents gives $\frac{3}{4} \cdot 2 = \frac{3}{2}$, so the area is $x^{3/2}$ square centimetres.'
          - problem: 'A rectangle has area $x^{5/6}$ m$^2$ and width $x^{1/2}$ m. Write its length, in metres, as a single power of $x$.'
            answer: "x^(1/3)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'The length is the area divided by the width, so subtract the exponents. That gives $\frac{5}{6} - \frac{3}{6} = \frac{2}{6} = \frac{1}{3}$, so the length is $x^{1/3}$ metres.'
          - problem: 'Simplify $\frac{x^{3/2}}{x^{1/3}}$ for $x > 0$.'
            answer: "x^(7/6)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'Dividing powers of the same base subtracts the exponents. With a common denominator, $\frac{9}{6} - \frac{2}{6} = \frac{7}{6}$, so the quotient is $x^{7/6}$.'
          - problem: 'Lena simplifies $x^{1/4} \cdot x^{1/2}$ to $x^{1/8}$. Simplify $x^{1/4} \cdot x^{1/2}$ correctly for $x > 0$.'
            answer: "x^(3/4)"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'Lena multiplied the exponents, but a product of powers adds them. So the exponent is $\frac{1}{4} + \frac{2}{4} = \frac{3}{4}$ and the product is $x^{3/4}$.'
          - problem: 'A cube has edge length $x^{2/3}$ cm. Write its volume, in cm$^3$, as a single power of $x$.'
            answer: "x^2"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'The volume is the edge cubed: $(x^{2/3})^3$. Multiplying the exponents gives $\frac{2}{3} \cdot 3 = 2$, so the volume is $x^2$ cubic centimetres.'
          - problem: 'Simplify $(x^{3/4})^4$ for $x > 0$.'
            answer: "x^3"
            answer_contract: {"kind":"required_form","form":"rational_exponent"}
            solution_sketch: 'A power of a power multiplies the exponents. Since $\frac{3}{4} \cdot 4 = 3$, the result is $x^3$.'
        constraints: "same product/quotient/power rules, fractional arithmetic"
    diagnostic_exemplar:
      problem: 'Compute $27^{2/3} \cdot 27^{-1/3}$.'
      answer: '3'
      solution_sketch: 'Add the exponents: $27^{1/3} = 3$.'
    anki_seeds:
      - front: "Meaning of a^(m/n):"
        back: "the nth root of a, raised to the m power: (a^(1/n))^m"
        type: basic

  - id: pythagorean-theorem
    name: "The Pythagorean Theorem"
    core: true                 # promoted: prerequisite of geometry/linear-algebra/calculus core topics
    difficulty: 0.50
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: square-roots
        weight: 0.6
        key: true
      - id: simplifying-radicals
        weight: 0.4
      - id: evaluating-expressions
        weight: 0.3
        key: true
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Find the hypotenuse"
        key_prerequisites: [evaluating-expressions]
        try_first:
          problem: 'A right triangle has legs $6$ and $8$. Squares are drawn outward on the two legs, with areas $36$ and $64$. What is the area of the square drawn on the hypotenuse?'
          answer_contract: {"kind":"exact"}
          answer: '100'
          reveal: 'The square on the hypotenuse has area $36+64=100$, so the hypotenuse is $\sqrt{100}=10$. In every right triangle the two leg squares add up to the hypotenuse square.'
        exemplars:
          - problem: 'A right triangle has legs $3$ and $4$. Find the hypotenuse.'
            answer: "5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the squares of the legs: $9 + 16 = 25$. The hypotenuse is $\sqrt{25} = 5$.'
          - problem: 'A ladder stands on level ground with its foot $6$ m from a wall and its top $8$ m up the wall. How long is the ladder?'
            answer: "10"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The wall, the ground and the ladder form a right triangle with the ladder as hypotenuse. So the ladder is $\sqrt{36 + 64} = \sqrt{100} = 10$ m long.'
          - problem: 'A right triangle''s legs measure $5$ cm and $12$ cm. How long is its hypotenuse?'
            answer: "13"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Add the squares of the legs: $25 + 144 = 169$. The hypotenuse is $\sqrt{169} = 13$ cm.'
          - problem: 'A rectangular phone screen is $9$ cm wide and $12$ cm tall. How long is its diagonal?'
            answer: "15"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The diagonal is the hypotenuse of a right triangle with legs $9$ and $12$. It is $\sqrt{81 + 144} = \sqrt{225} = 15$ cm.'
          - problem: 'Two cyclists leave the same crossroads. One rides $8$ km north and the other rides $15$ km east. How far apart are they?'
            answer: "17"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'North and east meet at a right angle, so the distance is a hypotenuse. It is $\sqrt{64 + 225} = \sqrt{289} = 17$ km.'
          - problem: 'A carpenter checks a corner of a frame. She marks $30$ cm along one side and $40$ cm along the other, and the distance between the marks is $51$ cm. Is the corner a right angle?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["no","no, it is not","it is not a right angle","not a right angle","not square"],["yes","yes, it is","it is a right angle","a right angle","square"]]}
            solution_sketch: 'If the corner were a right angle, the distance would be $\sqrt{900 + 1600} = \sqrt{2500} = 50$ cm. The measured $51$ cm is longer, so the corner is not a right angle.'
          - problem: 'Find the hypotenuse of a right triangle whose legs are $7$ and $24$.'
            answer: "25"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the squares of the legs: $49 + 576 = 625$. The hypotenuse is $\sqrt{625} = 25$.'
        constraints: "c = sqrt(a^2 + b^2); perfect-square results"
      - id: kp2
        name: "Find a missing leg"
        key_prerequisites: [square-roots]
        exemplars:
          - problem: 'A right triangle has hypotenuse $13$ and one leg $5$. Find the other leg.'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract the leg square from the hypotenuse square: $169 - 25 = 144$. The other leg is $\sqrt{144} = 12$.'
          - problem: 'A $10$ m ladder leans against a wall with its foot $6$ m from the wall. How high up the wall does it reach?'
            answer: "8"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The ladder is the hypotenuse and the height is a leg. The height is $\sqrt{100 - 36} = \sqrt{64} = 8$ m.'
          - problem: 'The hypotenuse of a right triangle is $17$ cm and one leg is $8$ cm. How long is the other leg?'
            answer: "15"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'Subtract the leg square from the hypotenuse square: $289 - 64 = 225$. The other leg is $\sqrt{225} = 15$ cm.'
          - problem: 'A wheelchair ramp is $2.6$ m long and covers a horizontal distance of $2.4$ m. How high does the ramp rise?'
            answer: "1"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The ramp is the hypotenuse and the rise is a leg. The rise is $\sqrt{6.76 - 5.76} = \sqrt{1} = 1$ m.'
          - problem: 'A kite on a $25$ m string is directly above a point on the ground $7$ m from where the string is held at ground level. How high is the kite?'
            answer: "24"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The string is the hypotenuse and the height is a leg. The height is $\sqrt{625 - 49} = \sqrt{576} = 24$ m.'
          - problem: 'Ella finds the missing leg of a right triangle with hypotenuse $15$ and one leg $9$ by computing $\sqrt{15^2 + 9^2}$. What is the correct length of the missing leg?'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ella added the squares, but $15$ is the hypotenuse, so the leg square is a difference. The leg is $\sqrt{225 - 81} = \sqrt{144} = 12$.'
          - problem: 'A rectangle is $9$ cm wide and its diagonal is $41$ cm long. How long is the rectangle?'
            answer: "40"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'The diagonal is the hypotenuse and the length is a leg. The length is $\sqrt{1681 - 81} = \sqrt{1600} = 40$ cm.'
        constraints: "leg = sqrt(c^2 - a^2)"
      - id: kp3
        name: "Non-perfect-square answers"
        key_prerequisites: [simplifying-radicals]
        exemplars:
          - problem: 'A right triangle has legs $2$ and $3$. Find the exact length of the hypotenuse.'
            answer: "sqrt(13)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Add the squares of the legs: $4 + 9 = 13$. Since $13$ has no square factor, the hypotenuse is $\sqrt{13}$.'
          - problem: 'A $6$ m ladder leans against a wall with its foot $2$ m from the wall. Find the exact height it reaches up the wall.'
            answer: "4*sqrt(2)"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'The ladder is the hypotenuse, so the height is $\sqrt{36 - 4} = \sqrt{32}$. Since $32 = 16 \cdot 2$, the height is $4\sqrt{2}$ m.'
          - problem: 'The legs of a right triangle are $4$ and $8$. Find the hypotenuse in simplest radical form.'
            answer: "4*sqrt(5)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Add the squares of the legs: $16 + 64 = 80$. Since $80 = 16 \cdot 5$, the hypotenuse is $\sqrt{80} = 4\sqrt{5}$.'
          - problem: 'A square tile has sides of $5$ cm. Find the exact length of its diagonal.'
            answer: "5*sqrt(2)"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'The diagonal is the hypotenuse of a right triangle with two legs of $5$ cm. It is $\sqrt{25 + 25} = \sqrt{50} = 5\sqrt{2}$ cm.'
          - problem: 'A right triangle has hypotenuse $9$ and one leg $3$. Find the other leg in simplest radical form.'
            answer: "6*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Subtract the leg square from the hypotenuse square: $81 - 9 = 72$. Since $72 = 36 \cdot 2$, the other leg is $6\sqrt{2}$.'
          - problem: 'A straight path crosses a rectangular park that is $50$ m long and $20$ m wide from one corner to the opposite corner. Find the exact length of the path.'
            answer: "10*sqrt(29)"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true,"form":"simplest_radical"}
            solution_sketch: 'The path is the hypotenuse of a right triangle with legs $50$ and $20$. Its length is $\sqrt{2500 + 400} = \sqrt{2900} = 10\sqrt{29}$ m.'
          - problem: 'An isosceles right triangle has a hypotenuse of length $6$. Find the length of each leg in simplest radical form.'
            answer: "3*sqrt(2)"
            answer_contract: {"kind":"required_simplest_radical"}
            solution_sketch: 'Both legs equal $a$, so $a^2 + a^2 = 36$ and $a^2 = 18$. Then $a = \sqrt{18} = 3\sqrt{2}$.'
        constraints: "leave the answer as a simplified radical"
    diagnostic_exemplar:
      problem: 'A right triangle has hypotenuse $7$ and one leg $5$. Find the other leg.'
      answer: '2*sqrt(6)'
      solution_sketch: '$\sqrt{7^2 - 5^2} = \sqrt{24} = 2\sqrt{6}$.'
    anki_seeds:
      - front: "Pythagorean theorem for a right triangle with legs a, b and hypotenuse c:"
        back: "a^2 + b^2 = c^2"
        type: basic

  - id: pythagorean-converse
    name: "The Converse of the Pythagorean Theorem"
    core: false                # converse / classification leaf; the theorem stays core
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 100
    prerequisites:
      - id: pythagorean-theorem
        weight: 0.8
        key: true
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Verify a right triangle"
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'Is a triangle with sides $20$, $21$ and $29$ right-angled?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes","yes it is","it is","right-angled","it is right-angled","right angled","a right triangle","it is a right triangle"],["no","no it is not","it is not","not right-angled","it is not right-angled","not right angled","not a right triangle","it is not a right triangle"]]}
            solution_sketch: 'The longest side is $29$. Since $20^2 + 21^2 = 400 + 441 = 841 = 29^2$, the converse of the Pythagorean theorem says the triangle has a right angle.'
          - problem: 'Which of these sets of side lengths forms a right-angled triangle: $(6, 8, 11)$, $(9, 12, 15)$ or $(7, 9, 12)$?'
            answer: "9, 12, 15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Test each set with its longest side alone. Only $9^2 + 12^2 = 81 + 144 = 225 = 15^2$ holds, while $6^2 + 8^2 = 100$ differs from $121$ and $7^2 + 9^2 = 130$ differs from $144$.'
          - problem: 'A carpenter marks $60$ cm along one edge of a frame and $80$ cm along the other edge, measured from the corner. How far apart must the two marks be for the corner to be exactly square?'
            answer: "100"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'By the converse of the Pythagorean theorem, the corner is a right angle when the square of the distance equals $60^2 + 80^2 = 3600 + 6400 = 10000$. So the marks must be $\sqrt{10000} = 100$ cm apart.'
          - problem: 'A triangular garden bed has sides $7$ m, $24$ m and $26$ m. Is the corner between the two shorter sides a right angle?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes","yes it is","it is","a right angle","it is a right angle","right angle"],["no","no it is not","it is not","not a right angle","it is not a right angle"]]}
            solution_sketch: 'The longest side is $26$. Since $7^2 + 24^2 = 49 + 576 = 625$ but $26^2 = 676$, the two values differ and the corner is not a right angle.'
          - problem: 'Squares are drawn on the three sides of a triangle, with areas $144$, $25$ and $169$ square centimetres. What is the size of the largest angle of the triangle?'
            answer: "90"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            solution_sketch: 'The areas of the squares on the sides are the squares of the side lengths. Since $144 + 25 = 169$, the triangle is right-angled and its largest angle is $90$ degrees.'
          - problem: 'A joiner has strips of length $15$ cm, $20$ cm, $24$ cm and $25$ cm. Which three strips form a triangle with a right angle?'
            answer: "15, 20, 25"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Try the longest strip, $25$ cm, with $15$ cm and $20$ cm: $15^2 + 20^2 = 225 + 400 = 625 = 25^2$. The strips $15$, $20$ and $24$ do not work, because $225 + 400 = 625$ differs from $24^2 = 576$.'
          - problem: 'A triangle has sides $28$, $45$ and $53$. What is the size of its largest angle?'
            answer: "90"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            solution_sketch: 'The longest side is $53$. Since $28^2 + 45^2 = 784 + 2025 = 2809 = 53^2$, the triangle is right-angled and its largest angle is $90$ degrees.'
        constraints: "test a^2 + b^2 against c^2 with c the longest side"
      - id: kp2
        name: "Recognize non-right triangles"
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'Is a triangle with sides $11$, $60$ and $62$ right-angled?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes","yes it is","it is","right-angled","it is right-angled","right angled","a right triangle","it is a right triangle"],["no","no it is not","it is not","not right-angled","it is not right-angled","not right angled","not a right triangle","it is not a right triangle"]]}
            solution_sketch: 'The longest side is $62$. Since $11^2 + 60^2 = 121 + 3600 = 3721$ but $62^2 = 3844$, the values differ and the triangle is not right-angled.'
          - problem: 'Which of these sets of side lengths does not form a right-angled triangle: $(5, 12, 13)$, $(8, 15, 17)$ or $(9, 12, 16)$?'
            answer: "9, 12, 16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Test each set with its longest side alone. Both $5^2 + 12^2 = 169 = 13^2$ and $8^2 + 15^2 = 289 = 17^2$ hold, but $9^2 + 12^2 = 225$ differs from $16^2 = 256$.'
          - problem: 'A shelf bracket is a triangle with sides $15$ cm, $20$ cm and $26$ cm. By how many centimetres must the longest side be shortened for the corner between the two shorter sides to be a right angle?'
            answer: "1"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'For a right angle the longest side must be $\sqrt{15^2 + 20^2} = \sqrt{625} = 25$ cm. The bracket has $26$ cm, so the longest side must be shortened by $1$ cm.'
          - problem: 'A brace is a triangle with sides $12$ in, $16$ in and $20$ in. Is the angle opposite the longest side a right angle?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes","yes it is","it is","a right angle","it is a right angle","right angle"],["no","no it is not","it is not","not a right angle","it is not a right angle"]]}
            solution_sketch: 'The longest side is $20$. Since $12^2 + 16^2 = 144 + 256 = 400 = 20^2$, the two values are equal and the angle is a right angle.'
          - problem: 'A tiler marks $36$ cm along one wall and $48$ cm along the other wall, measured from the corner. The distance between the marks is $62$ cm. By how many centimetres is that distance too long for a right-angled corner?'
            answer: "2"
            answer_contract: {"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}
            solution_sketch: 'For a right angle the distance must be $\sqrt{36^2 + 48^2} = \sqrt{3600} = 60$ cm. The marks are $62$ cm apart, so the distance is too long by $2$ cm.'
          - problem: 'Sam tests whether a triangle with sides $5$, $12$ and $13$ is right-angled. He computes $5^2 + 13^2 = 194$, compares it with $12^2 = 144$ and says no. What is the size of the largest angle of the triangle?'
            answer: "90"
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            solution_sketch: 'Sam put a shorter side alone in the comparison. The longest side is $13$, and $5^2 + 12^2 = 25 + 144 = 169 = 13^2$, so the largest angle is $90$ degrees.'
          - problem: 'Exactly one of these sets of side lengths forms a right-angled triangle: $(10, 24, 25)$, $(10, 24, 26)$ or $(10, 24, 27)$. Which one?'
            answer: "10, 24, 26"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In each set the two shorter sides give $10^2 + 24^2 = 100 + 576 = 676$. Only $26^2 = 676$ matches, so the right-angled triangle is the one with sides $10$, $24$ and $26$.'
        constraints: "always compare against the square of the longest side"
      - id: kp3
        name: "Pythagorean triples and acute/obtuse classification"
        key_prerequisites: [pythagorean-theorem]
        try_first:
          problem: 'A triangle has sides $4$, $5$ and $6$. Is $4^2 + 5^2$ greater than $6^2$?'
          answer_contract: {"kind":"label","options":[["yes","yes it is","it is","greater"],["no","no it is not","it is not","less","smaller"]]}
          answer: 'yes'
          reveal: 'Here $4^2 + 5^2 = 41$ is greater than $6^2 = 36$, and the largest angle of this triangle is less than $90^\circ$. When the sum of the shorter squares beats the longest square, the triangle is acute.'
        exemplars:
          - problem: 'Is the largest angle of a triangle with sides $4$, $7$ and $9$ acute, right or obtuse?'
            answer: "obtuse"
            answer_contract: {"kind":"label","options":[["acute","acute angle","it is acute","less than 90 degrees"],["right","right angle","it is right","90 degrees"],["obtuse","obtuse angle","it is obtuse","more than 90 degrees"]]}
            solution_sketch: 'Compare $4^2 + 7^2 = 16 + 49 = 65$ with $9^2 = 81$. Since $65 < 81$, the largest angle is obtuse.'
          - problem: 'The three sides of a triangular sail measure $7$ m, $8$ m and $10$ m. Is the largest angle of the sail acute, right or obtuse?'
            answer: "acute"
            answer_contract: {"kind":"label","options":[["acute","acute angle","it is acute","less than 90 degrees"],["right","right angle","it is right","90 degrees"],["obtuse","obtuse angle","it is obtuse","more than 90 degrees"]]}
            solution_sketch: 'Compare $7^2 + 8^2 = 49 + 64 = 113$ with $10^2 = 100$. Since $113 > 100$, the largest angle is acute.'
          - problem: 'The $7$, $24$, $25$ triangle has a right angle. Every side is made $3$ times as long. How many times as large does the sum of the squares of the two shorter sides become?'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each side is multiplied by $3$, so each square is multiplied by $3^2 = 9$. The sum of the two squares is therefore $9$ times as large, and the enlarged triangle is still right-angled.'
          - problem: 'Which of these triangles has an obtuse angle: $(7, 8, 9)$, $(7, 8, 11)$ or $(7, 8, 10)$?'
            answer: "7, 8, 11"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The two shorter sides give $7^2 + 8^2 = 113$. This is greater than $9^2 = 81$ and $10^2 = 100$ but less than $11^2 = 121$, so only $(7, 8, 11)$ has an obtuse angle.'
          - problem: 'A ramp frame is a copy of a $3$-$4$-$5$ triangle in which the shortest side is $1.5$ m long. How long is the longest side?'
            answer: "2.5"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The shortest side went from $3$ to $1.5$, so every side is multiplied by $\frac{1.5}{3} = 0.5$. The longest side is $5 \cdot 0.5 = 2.5$ m.'
          - problem: 'A triangular plot has sides $30$ m, $40$ m and $55$ m. By how many metres must the longest side be shortened for the corner between the two shorter sides to be a right angle?'
            answer: "5"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The plot has a scaled $3$-$4$-$5$ triangle in its shorter sides, so a right angle needs a longest side of $\sqrt{30^2 + 40^2} = \sqrt{2500} = 50$ m. The longest side is $55$ m, so it must be shortened by $5$ m.'
          - problem: 'Two sides of a triangle are $5$ and $12$ and the third side is the longest. Give a whole number for the third side that makes the largest angle obtuse.'
            answer: "14"
            answer_contract: {"kind":"property","check":"integer_in_range","args":{"min":14,"max":16}}
            solution_sketch: 'The largest angle is obtuse when the third side $c$ satisfies $c^2 > 5^2 + 12^2 = 169$, so $c > 13$. The triangle inequality needs $c < 5 + 12 = 17$, so $14$, $15$ and $16$ all work.'
        constraints: "a^2 + b^2 > c^2 means acute, < c^2 means obtuse"
    diagnostic_exemplar:
      problem: 'A triangle has sides $5$, $6$, $8$. Is it acute, right, or obtuse?'
      answer_contract: {kind: label, options: [[acute], [right], [obtuse]]}
      answer: 'obtuse'
      solution_sketch: '$5^2 + 6^2 = 61 < 64 = 8^2$, so the triangle is obtuse.'
    anki_seeds:
      - front: "Converse of the Pythagorean theorem: if a^2 + b^2 = c^2 (c the longest side), then ..."
        back: "the triangle is a right triangle"
        type: basic
      - front: "For sides a <= b <= c: a^2 + b^2 < c^2 means the triangle is ..."
        back: "obtuse (and acute if a^2 + b^2 > c^2)"
        type: basic

  - id: radical-equations-basic
    name: "Radical Equations"
    core: false                # terminal solve genre; the radical rules stay core
    difficulty: 0.62
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: square-roots
        weight: 0.6
        key: true
      - id: two-step-equations
        weight: 0.5
        key: true
      - id: simplifying-radicals
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Square both sides of sqrt(x) = k"
        key_prerequisites: [square-roots]
        exemplars:
          - problem: 'Solve $\sqrt{x}=5$.'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radical stands alone, so square both sides to get $x=5^2=25$. The check $\sqrt{25}=5$ confirms the solution.'
          - problem: 'A square has area $A$ square centimetres, and its side length is $\sqrt{A}$ centimetres. The side length is $12$ cm. What is the area of the square?'
            answer: '144 cm^2'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            solution_sketch: 'The side length gives $\sqrt{A}=12$. Squaring both sides gives $A=12^2=144$, so the area is $144$ square centimetres.'
          - problem: 'The square root of a number is $8$. What is the number?'
            answer: '64'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the unknown number as $x$, so $\sqrt{x}=8$. Squaring both sides of this equation gives $x=8^2=64$.'
          - problem: 'Solve $\sqrt{x}=\tfrac{2}{3}$.'
            answer: '4/9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Squaring both sides gives $x=\left(\tfrac{2}{3}\right)^2=\tfrac{4}{9}$. The check $\sqrt{4/9}=2/3$ confirms that this value of $x$ works.'
          - problem: 'Sam solves $\sqrt{x}=9$ and writes $x=3$. What is the correct solution?'
            answer: '81'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam took the square root of $9$, but the equation needs the opposite step. Squaring both sides gives $x=9^2=81$, and $\sqrt{81}=9$.'
          - problem: 'A square mat has a side length of $0.9$ m. What is the area of the mat?'
            answer: '0.81 m^2'
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The side length is the square root of the area, so $\sqrt{A}=0.9$. Squaring both sides gives $A=0.9^2=0.81$, so the area is $0.81$ square metres.'
          - problem: 'Solve $\sqrt{x}=11$.'
            answer: '121'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radical stands alone, so square both sides to get $x=11^2=121$. The check $\sqrt{121}=11$ confirms the solution.'
        constraints: "radical already isolated; nonnegative right side"
      - id: kp2
        name: "Isolate the radical first"
        key_prerequisites: [two-step-equations, square-roots]
        exemplars:
          - problem: 'Solve $2\sqrt{x}+3=13$.'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $3$ and divide by $2$ to isolate the radical: $\sqrt{x}=5$. Squaring gives $x=25$, and the check $2\cdot5+3=13$ holds.'
          - problem: 'Solve $\sqrt{x-2}=5$.'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radical is alone, so square both sides: $x-2=25$. Then $x=27$, and $\sqrt{27-2}=\sqrt{25}=5$.'
          - problem: 'Solve $\dfrac{\sqrt{x}}{3}=2$.'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply both sides by $3$ to isolate the radical: $\sqrt{x}=6$. Squaring gives $x=36$, and $\sqrt{36}/3=2$.'
          - problem: 'Sam solves $\sqrt{x}+5=9$ and writes $x+25=81$, so $x=56$. What is the correct solution?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam squared each term of the left side separately, but $(\sqrt{x}+5)^2$ is not $x+25$. Subtract $5$ first to get $\sqrt{x}=4$, so $x=16$.'
          - problem: 'A stone dropped from a height of $h$ metres takes $t=\sqrt{\tfrac{h}{5}}$ seconds to reach the ground. A stone takes $3$ seconds to fall. From what height was it dropped?'
            answer: '45 m'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The fall time gives $\sqrt{\tfrac{h}{5}}=3$. Squaring both sides gives $\tfrac{h}{5}=9$, so $h=45$ metres.'
          - problem: 'A number is increased by $7$, and the square root of the result is $6$. What is the number?'
            answer: '29'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the unknown number as $x$, so $\sqrt{x+7}=6$. Squaring both sides gives $x+7=36$, so $x=29$.'
          - problem: 'Five times the square root of a number, decreased by $3$, equals $12$. What is the number?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the number as $x$, so $5\sqrt{x}-3=12$. Then $5\sqrt{x}=15$ and $\sqrt{x}=3$, so $x=9$.'
          - problem: 'A model gives the speed $v$ of a skidding car, in metres per second, as $v=\sqrt{25d}$, where $d$ is the length of the skid in metres. A car skids at $15$ metres per second. How long is the skid?'
            answer: '9 m'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The speed gives the equation $\sqrt{25d}=15$. Squaring both sides gives $25d=225$, so the skid is $d=9$ metres long.'
        constraints: "one radical; linear inside; isolate before squaring"
      - id: kp3
        name: "Check solutions and spot no-solution cases"
        key_prerequisites: [square-roots, two-step-equations]
        try_first:
          problem: 'Is there a real number whose square root is $-4$?'
          answer_contract: {"kind":"label","options":[["no","there is none","no real number","no there is not"],["yes","there is","yes there is"]]}
          answer: 'no'
          reveal: 'No real number has a square root of $-4$, because a square root is never negative. So an equation such as $\sqrt{x}=-4$ has no solution, even though squaring both sides would give the candidate $x=16$.'
        exemplars:
          - problem: 'Solve $\sqrt{3x+1}=4$.'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radical stands alone, so square both sides to get $3x+1=16$, and then $x=5$. The check $\sqrt{3\cdot5+1}=\sqrt{16}=4$ holds.'
          - problem: 'Solve $\sqrt{x+7}=-2$.'
            answer: 'no solution'
            answer_contract: {"kind":"label","options":[["no solution", "none", "no real solution", "no solutions", "there is no solution", "no real solutions", "no real number"],["x = -3","-3","x=-3"]]}
            solution_sketch: 'Squaring gives the candidate $x=-3$. But $\sqrt{-3+7}=\sqrt{4}=2$, not $-2$, because a square root is never negative, so the equation has no solution.'
          - problem: 'A square has a side length of $\sqrt{2x+1}$ cm and an area of $49$ cm$^2$. Find $x$.'
            answer: '24'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $49$, so the side length is $7$ and $\sqrt{2x+1}=7$. Squaring gives $2x+1=49$, so $x=24$.'
          - problem: 'Sam solves $2\sqrt{x}+7=3$ and gets $x=4$. Is Sam''s answer correct?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is correct","correct","yes it is","yes, it is correct"],["no","it is not correct","not correct","incorrect","no it is not","no, it is not correct","it is wrong","wrong"]]}
            solution_sketch: 'Substitute $x=4$: $2\sqrt{4}+7=11$, which is not $3$. In fact $2\sqrt{x}=-4$ would need $\sqrt{x}=-2$, which is impossible, so the answer is not correct.'
          - problem: 'Solve $\sqrt{5-x}=3$.'
            answer: '-4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The radical stands alone, so square both sides to get $5-x=9$, and then $x=-4$. The check $\sqrt{5-(-4)}=\sqrt{9}=3$ holds.'
          - problem: 'Solve $3-\sqrt{x}=1$.'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $3$ and multiply by $-1$ to isolate the radical: $\sqrt{x}=2$. Squaring gives $x=4$, and $3-\sqrt{4}=1$.'
          - problem: 'The square root of the sum of a number and $9$ is $5$. What is the number?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write the unknown number as $x$, so $\sqrt{x+9}=5$. Squaring both sides gives $x+9=25$, so $x=16$.'
          - problem: 'Solve $\sqrt{x-1}+3=3$.'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract $3$ to isolate the radical: $\sqrt{x-1}=0$. Squaring gives $x-1=0$, so $x=1$, and zero is a valid value of a square root.'
        constraints: "always substitute back; sqrt(...) = negative has no solution"
    diagnostic_exemplar:
      problem: 'Solve $3\sqrt{x} + 2 = 14$.'
      answer: 'x = 16'
      solution_sketch: '$3\sqrt{x} = 12$; $\sqrt{x} = 4$; $x = 16$.'
    anki_seeds:
      - front: "sqrt(x) = k has a solution only when ..."
        back: "k >= 0 (then x = k^2); always check for extraneous roots after squaring"
        type: basic
