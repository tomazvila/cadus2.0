          - problem: 'What is $\sqrt{x^7}$ ($x \ge 0$) in simplest form?'
            answer: "x^3*sqrt(x)"
            solution_sketch: '$x^7 = x^6 \cdot x$; $\sqrt{x^6} = x^3$.'
          - problem: 'Reduce $\sqrt{x^9}$ ($x \ge 0$) to simplest form.'
            answer: "x^4*sqrt(x)"
            solution_sketch: '$x^9 = x^8 \cdot x$; $\sqrt{x^8} = x^4$.'
          - problem: 'Simplify $\sqrt{x^3}$ ($x \ge 0$).'
            answer: "x*sqrt(x)"
            solution_sketch: '$x^3 = x^2 \cdot x$; $\sqrt{x^2} = x$.'
        constraints: "split off the largest even power"
      - id: kp3
        name: "Coefficients and variables together"
        key_prerequisites: [simplifying-radicals]
        exemplars:
          - problem: 'Simplify $\sqrt{50x^2}$ ($x \ge 0$).'
            answer: "5x*sqrt(2)"
            solution_sketch: '$\sqrt{25 \cdot 2 \cdot x^2} = 5x\sqrt{2}$.'
          - problem: 'Simplify $\sqrt{72x^3}$ ($x \ge 0$).'
            answer: "6x*sqrt(2x)"
            solution_sketch: '$72x^3 = 36 \cdot 2 \cdot x^2 \cdot x$; $6x$ comes out.'
          - problem: 'What is $\sqrt{27x^2}$ ($x \ge 0$) in simplest form?'
            answer: "3x*sqrt(3)"
            solution_sketch: '$\sqrt{9 \cdot 3 \cdot x^2} = 3x\sqrt{3}$.'
          - problem: 'Simplify $\sqrt{45x^5}$ ($x \ge 0$).'
            answer: "3x^2*sqrt(5x)"
            solution_sketch: '$45x^5 = 9 \cdot 5 \cdot x^4 \cdot x$; $3x^2$ comes out.'
        constraints: "simplify the number and each variable separately"
