            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["right"], ["nonright"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "The side lengths are 7, 8, and 10, so the longest side is 10. Step 1: Square the longest side: 10^2 = 100. Step 2: Square the other two sides and add: 7^2 + 8^2 = 49 + 64 = 113. Step 3: Apply the converse of the Pythagorean theorem: since 100 is not equal to 113, the triangle has no 90-degree angle. The option right is wrong because 100 would need to equal 113. The difference is 100 - 113 = -13. So the key is verdict = nonright; diff = -13."
          - problem: "A frame has side lengths 6, 9, and 11 cm. State whether the frame has a 90-degree corner, and compute the square of the longest side minus the sum of the squares of the other two sides."
            answer: "verdict = nonright; diff = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["right"], ["nonright"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "The side lengths are 6, 9, and 11 cm, so the longest side is 11. Step 1: Square the longest side: 11^2 = 121. Step 2: Square the other two sides and add: 6^2 + 9^2 = 36 + 81 = 117. Step 3: Apply the converse of the Pythagorean theorem: since 121 is not equal to 117, the frame has no 90-degree corner. The option right is wrong because 121 would need to equal 117. The difference is 121 - 117 = 4. So the key is verdict = nonright; diff = 4."
          - problem: "A garden plot has side lengths 8, 10, and 13 m. State whether the plot has a 90-degree angle, and compute the square of the longest side minus the sum of the squares of the other two sides."
            answer: "verdict = nonright; diff = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["right"], ["nonright"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "The side lengths are 8, 10, and 13 m, so the longest side is 13. Step 1: Square the longest side: 13^2 = 169. Step 2: Square the other two sides and add: 8^2 + 10^2 = 64 + 100 = 164. Step 3: Apply the converse of the Pythagorean theorem: since 169 is not equal to 164, the plot has no 90-degree angle. The option right is wrong because 169 would need to equal 164. The difference is 169 - 164 = 5. So the key is verdict = nonright; diff = 5."
          - problem: "A brace has side lengths 9, 12, and 15 in. State whether the brace has a 90-degree angle, and compute the square of the longest side minus the sum of the squares of the other two sides."
            answer: "verdict = right; diff = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["right"], ["nonright"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "diff"}]}
            solution_sketch: "The side lengths are 9, 12, and 15 in, so the longest side is 15. Step 1: Square the longest side: 15^2 = 225. Step 2: Square the other two sides and add: 9^2 + 12^2 = 81 + 144 = 225. Step 3: Apply the converse of the Pythagorean theorem: since 225 equals 225, the brace has a 90-degree angle. The option nonright is wrong because the equality does hold. The difference is 225 - 225 = 0. So the key is verdict = right; diff = 0."
        constraints: "always compare against the square of the longest side"
      - id: kp3
        name: "Pythagorean triples and acute/obtuse classification"
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: "A triangle has sides 4, 7, and 9. Give the correct type of its largest angle and the sum of the squares of its two shorter sides."
            answer: "verdict = obtuse; S = 65"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["acute"], ["obtuse"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "S"}]}
            solution_sketch: "Step 1: square the two shorter sides and add them, 4^2 + 7^2 = 16 + 49 = 65. Step 2: square the longest side, 9^2 = 81. Step 3: compare the two values; 65 is less than 81, so by the converse of the Pythagorean theorem the largest angle is obtuse. Choosing acute is the error of reading the comparison 65 < 81 backwards. Final answer: verdict = obtuse; S = 65."
          - problem: "A triangle has sides 6, 7, and 8. Give the correct type of its largest angle and the square of its longest side."
            answer: "verdict = acute; c2 = 64"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["acute"], ["obtuse"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "c2"}]}
            solution_sketch: "Step 1: add the squares of the two shorter sides of the triangle with sides 6, 7, and 8, which gives 6^2 + 7^2 = 36 + 49 = 85. Step 2: square the longest side, which gives 8^2 = 64. Step 3: compare the two values, and since 85 is greater than 64, the converse of the Pythagorean theorem says the largest angle is acute. Choosing obtuse is the error of using the inequality in the wrong direction. Final answer: verdict = acute; c2 = 64."
          - problem: "Scale the triple (5, 12, 13) by 2 to get the side lengths of a triangle. Find the square of the longest side of that triangle."
            answer: "676"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: multiply every member of the triple by 2, which gives the sides 10, 24, and 26. Step 2: a scaled Pythagorean triple is still a right triangle, so the longest side is the scaled 13, namely 26. Step 3: square the longest side, 26^2 = 676. The square of the longest side is 676."
          - problem: "Scale the triple (7, 24, 25) by 3 to get the side lengths of a triangle. Find the square of the longest side minus the sum of the squares of the two shorter sides."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: multiply every member of the triple by 3, which gives the sides 21, 72, and 75. Step 2: add the squares of the two shorter sides, 21^2 + 72^2 = 441 + 5184 = 5625. Step 3: square the longest side, 75^2 = 5625. Step 4: subtract the two results, 5625 - 5625 = 0, which is exactly the right-triangle relation. The value of the difference is 0."
        constraints: "a^2 + b^2 > c^2 means acute, < c^2 means obtuse"
