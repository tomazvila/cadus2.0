        constraints: "test a^2 + b^2 against c^2 with c the longest side"
      - id: kp2
        visuals: [{"kind":"geometry","figure":{"shape":"polygon","vertices":[{"x":"0","y":"0","label":"A"},{"x":"4","y":"0","label":"B"},{"x":"1","y":"2","label":"C"}],"right_angles":[]},"caption":"Reference example: This reference triangle has squared side lengths 16, 13 and 5. No two sum to the third, so it is not right-angled."}]
        name: "Recognize non-right triangles"
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'Is a triangle with sides $4$, $5$, $6$ a right triangle?'
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: '$16 + 25 = 41 \ne 36$.'
          - problem: "Squares on a triangle have areas $4$, $9$, and $16$. Is there a right angle?"
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: "The longest side has square $16$, while $4+9=13$. The unequal totals rule out a right angle."
          - problem: "A frame has side lengths $5$, $6$, and $9$ cm. A builder claims the $5$ cm and $6$ cm sides are perpendicular. Is the claim correct?"
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: "Perpendicular sides would require $9^2=5^2+6^2$. But $81\\ne61$, so the claim fails."
          - problem: "A student tests sides $3$, $4$, $6$ using $3^2+6^2=4^2$. Is this the correct Pythagorean test?"
            answer: "no"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: "The longest side is $6$, so the required comparison is $3^2+4^2=25$ against $6^2=36$."
        constraints: "always compare against the square of the longest side"
      - id: kp3
        name: "Pythagorean triples and acute/obtuse classification"
        key_prerequisites: [pythagorean-theorem]
        exemplars:
          - problem: 'Scale the triple $(3, 4, 5)$ by $3$. Is the resulting triangle right?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The scaled sides are $(9, 12, 15)$: $81 + 144 = 225 = 15^2$; multiples of triples stay right.'
          - problem: 'A triangle has sides $4$, $5$, $6$. Is it acute, right, or obtuse?'
            answer: "acute"
            answer_contract: {"kind":"label","options":[["acute"],["right"],["obtuse"]]}
            solution_sketch: '$16 + 25 = 41 > 36$, so the largest angle is less than $90°$.'
          - problem: 'After scaling the triple $(3, 4, 5)$ by $4$, is the triangle right?'
            answer: "yes"
            answer_contract: {"kind":"label","options":[["yes"],["no"]]}
            solution_sketch: 'The scaled sides are $(12, 16, 20)$: $144 + 256 = 400 = 20^2$; multiples of triples stay right.'
          - problem: 'A triangle has sides $3$, $4$, $6$. Is it acute, right, or obtuse?'
            answer: "obtuse"
            answer_contract: {"kind":"label","options":[["acute"],["right"],["obtuse"]]}
            solution_sketch: '$9 + 16 = 25 < 36$, so the largest angle exceeds $90°$.'
        constraints: "a^2 + b^2 > c^2 means acute, < c^2 means obtuse"
    diagnostic_exemplar:
      problem: 'A triangle has sides $5$, $6$, $8$. Is it acute, right, or obtuse?'
      answer_contract: {kind: label, options: [[acute], [right], [obtuse]]}
      answer: 'obtuse'
      solution_sketch: '$5^2 + 6^2 = 61 < 64 = 8^2$, so the triangle is obtuse.'
    anki_seeds:
      - front: "Converse of the Pythagorean theorem: if a^2 + b^2 = c^2 (c the longest side), then ..."
        back: "the triangle is a right triangle"
        type: basic
      - front: "For sides a <= b <= c: a^2 + b^2 < c^2 means the triangle is ..."
        back: "obtuse (and acute if a^2 + b^2 > c^2)"
        type: basic

  - id: radical-equations-basic
    name: "Radical Equations"
    core: false                # terminal solve genre; the radical rules stay core
    difficulty: 0.62
    drill: false
    answer_kind: multi-step
    expected_time_secs: 120
    prerequisites:
      - id: square-roots
        weight: 0.6
        key: true
      - id: two-step-equations
        weight: 0.5
        key: true
      - id: simplifying-radicals
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Square both sides of sqrt(x) = k"
