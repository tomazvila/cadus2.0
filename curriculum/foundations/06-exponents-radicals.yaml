unit: exponents-radicals
course: foundations
module: "Exponents & Radicals"
topics:
  - id: exponent-product-rule
    name: "The Product Rule for Exponents"
    core: true
    difficulty: 0.30
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: integer-exponents-intro
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Multiply powers of the same base"
        key_prerequisites: [integer-addition-subtraction]
        try_first:
          problem: 'Written out as single factors, $x^2 \cdot x^3$ is a product of how many factors of $x$?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: '$x^2 \cdot x^3 = (x \cdot x)(x \cdot x \cdot x)$, five factors of $x$, so it equals $x^5$. Multiplying powers of the same base adds the exponents.'
        exemplars:
          - problem: 'Simplify $x^3 \cdot x^4$.'
            answer: "x^7"
            solution_sketch: 'Add exponents: $3 + 4 = 7$.'
          - problem: 'Simplify $a^5 \cdot a^2$.'
            answer: "a^7"
            solution_sketch: '$5 + 2 = 7$.'
          - problem: 'Simplify $b^2 \cdot b^6$.'
            answer: "b^8"
            solution_sketch: '$2 + 6 = 8$.'
          - problem: 'Simplify $p^5 \cdot p^4$.'
            answer: "p^9"
            solution_sketch: '$5 + 4 = 9$.'
        constraints: "same base; positive integer exponents; add exponents"
      - id: kp2
        name: "Numeric bases left in exponent form"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Write $2^3 \cdot 2^4$ as a single power of $2$.'
            answer: "2^7"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: '$3 + 4 = 7$.'
          - problem: 'What single power of $5$ equals $5^2 \cdot 5^3$?'
            answer: "5^5"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: '$2 + 3 = 5$.'
          - problem: 'Simplify $3^4 \cdot 3^2$ and write the result as $3$ raised to one exponent.'
            answer: "3^6"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: '$4 + 2 = 6$.'
          - problem: 'A square array contains $7^3$ rows and $7^3$ columns. Express its number of entries as a single power of $7$.'
            answer: "7^6"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: '$3 + 3 = 6$.'
        constraints: "answer stays as a single power, not evaluated"
      - id: kp3
        name: "Three or more factors, including bare bases"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $x \cdot x^3 \cdot x^2$.'
            answer: "x^6"
            solution_sketch: 'A bare $x$ is $x^1$; $1 + 3 + 2 = 6$.'
          - problem: 'Simplify $y^2 \cdot y \cdot y^4$.'
            answer: "y^7"
            solution_sketch: '$2 + 1 + 4 = 7$.'
          - problem: 'Simplify $a^3 \cdot a \cdot a^2$.'
            answer: "a^6"
            solution_sketch: 'A bare $a$ is $a^1$; $3 + 1 + 2 = 6$.'
          - problem: 'Simplify $m \cdot m^4 \cdot m^3$.'
            answer: "m^8"
            solution_sketch: 'A bare $m$ is $m^1$; $1 + 4 + 3 = 8$.'
        constraints: "treat a bare base as exponent 1"
    diagnostic_exemplar:
      problem: 'Simplify $x \cdot x^3 \cdot x^5$.'
      answer: 'x^9'
      solution_sketch: 'A bare base counts as exponent $1$: $1 + 3 + 5 = 9$.'
    anki_seeds:
      - front: "Product rule: a^m * a^n = ?"
        back: "a^(m+n)"
        type: basic

  - id: exponent-quotient-rule
    name: "The Quotient Rule for Exponents"
    core: true
    difficulty: 0.32
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: integer-exponents-intro
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: exponent-product-rule
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Divide powers of the same base"
        key_prerequisites: [integer-addition-subtraction]
        try_first:
          problem: 'Written out as single factors, $\frac{x^6}{x^2}$ is $\frac{x \cdot x \cdot x \cdot x \cdot x \cdot x}{x \cdot x}$. After cancelling, how many factors of $x$ are left on top?'
          answer_contract: {"kind":"exact"}
          answer: '4'
          reveal: 'Each $x$ below cancels one $x$ above, so $6-2=4$ factors remain and $\frac{x^6}{x^2}=x^4$. Dividing powers of the same base subtracts the exponents.'
        exemplars:
          - problem: 'Simplify $\frac{x^8}{x^3}$.'
            answer: "x^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bases match, so subtract the exponents. Since $8 - 3 = 5$, the quotient is $x^5$.'
          - problem: 'Simplify $\frac{y^6}{y^2}$.'
            answer: "y^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two factors of $y$ below cancel two above. So $6 - 2 = 4$ factors remain, giving $y^4$.'
          - problem: 'A rectangle has an area of $x^{11}$ square units and a width of $x^4$ units. What is its length?'
            answer: "x^7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width, so compute $x^{11}/x^4$. Subtracting exponents gives $11 - 4 = 7$, so the length is $x^7$ units.'
          - problem: 'Simplify $\frac{a^9}{a^4}$.'
            answer: "a^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The bases match, so subtract the exponents. Since $9 - 4 = 5$, the quotient is $a^5$.'
          - problem: 'A tank holds $m^{12}$ litres of water. The water is poured into buckets that each hold $m^3$ litres. How many buckets can be filled?'
            answer: "m^9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of buckets is the total divided by one bucket, $m^{12}/m^3$. Subtracting exponents gives $12 - 3 = 9$, so $m^9$ buckets are filled.'
          - problem: 'Simplify $\frac{b^7}{b^3}$.'
            answer: "b^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Three factors of $b$ below cancel three above. So $7 - 3 = 4$ factors remain, giving $b^4$.'
          - problem: 'Lena simplifies $\frac{x^{12}}{x^4}$ and writes $x^3$. What is the correct simplification?'
            answer: "x^8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Lena divided the exponents, but a quotient of powers subtracts them. Since $12 - 4 = 8$, the correct result is $x^8$.'
        constraints: "same base; larger exponent on top; subtract exponents"
      - id: kp2
        name: "Numeric bases left in exponent form"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Write $\frac{3^5}{3^2}$ as a single power of $3$.'
            answer: "3^3"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The base stays $3$ and the exponents subtract. Since $5 - 2 = 3$, the quotient is $3^3$.'
          - problem: 'Write $\frac{7^9}{7^5}$ as a single power of $7$.'
            answer: "7^4"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The base stays $7$ and the exponents subtract. Since $9 - 5 = 4$, the quotient is $7^4$.'
          - problem: 'A hard drive holds $2^{40}$ bytes. A video file takes up $2^{28}$ bytes. How many such files fit on the drive?'
            answer: "2^12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of files is the capacity divided by one file, $2^{40}/2^{28}$. Since $40 - 28 = 12$, exactly $2^{12} = 4096$ files fit.'
          - problem: 'What single power of $10$ equals $10^9 \div 10^4$?'
            answer: "10^5"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The base stays $10$ and the exponents subtract. Since $9 - 4 = 5$, the quotient is $10^5$.'
          - problem: 'A city has about $10^6$ inhabitants and a village has about $10^3$. About how many times larger is the population of the city?'
            answer: "10^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'How many times larger means divide: $10^6/10^3$. Since $6 - 3 = 3$, the city is about $10^3 = 1000$ times larger.'
          - problem: 'A collection of $2^9$ stamps is split into packs of $2^6$ stamps. How many packs are there?'
            answer: "2^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of packs is $2^9$ divided by $2^6$. Since $9 - 6 = 3$, there are $2^3 = 8$ packs.'
          - problem: 'Omar writes $\frac{6^8}{6^2}$ as $1^6$. Write the quotient correctly as a single power of $6$.'
            answer: "6^6"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'Omar divided the bases, but the base stays $6$. The exponents subtract, $8 - 2 = 6$, so the quotient is $6^6$.'
        constraints: "answer stays as a single power, not evaluated"
      - id: kp3
        name: "Quotients that leave exponent 1, and bare bases"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $\frac{y^5}{y^4}$.'
            answer: "y"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract the exponents: $5 - 4 = 1$. A first power is just the base, so the result is $y$.'
          - problem: 'Simplify $\frac{x^6}{x}$.'
            answer: "x^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A bare $x$ is $x^1$. Subtract the exponents, $6 - 1 = 5$, to get $x^5$.'
          - problem: 'A rectangle has an area of $p^7$ square units and a length of $p^6$ units. What is its width?'
            answer: "p"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Width is area divided by length, $p^7/p^6$. Since $7 - 6 = 1$, the width is $p^1 = p$ units.'
          - problem: 'Simplify $\frac{b^9}{b}$.'
            answer: "b^8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A bare $b$ is $b^1$. Subtract the exponents, $9 - 1 = 8$, to get $b^8$.'
          - problem: 'A jar of $k^{13}$ sweets is shared equally among $k$ children. How many sweets does each child get?'
            answer: "k^12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sharing equally means dividing: $k^{13}/k$. The bare $k$ is $k^1$, and $13 - 1 = 12$, so each child gets $k^{12}$ sweets.'
          - problem: 'Mia simplifies $\frac{a^8}{a^7}$ and writes $1$. What is the correct simplification?'
            answer: "a"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtracting the exponents gives $8 - 7 = 1$, so one factor of $a$ remains. The result is $a^1 = a$, and only $a^0$ would equal $1$.'
          - problem: 'Simplify $\frac{m^{10}}{m}$.'
            answer: "m^9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A bare $m$ is $m^1$. Subtract the exponents, $10 - 1 = 9$, to get $m^9$.'
        constraints: "treat a bare base as exponent 1; keep results with positive exponents"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{x^7}{x}$.'
      answer: 'x^6'
      solution_sketch: 'The bare $x$ counts as exponent $1$: $7 - 1 = 6$.'
    anki_seeds:
      - front: "Quotient rule: a^m / a^n = ?"
        back: "a^(m-n)"
        type: basic

  - id: exponent-product-quotient-rules
    name: "Product and Quotient Rules for Exponents"
    core: true
    difficulty: 0.35
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: exponent-product-rule
        weight: 0.8
        key: true
      - id: exponent-quotient-rule
        weight: 0.8
        key: true
      - id: integer-multiplication-division
        weight: 0.5
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Product and quotient rules together"
        key_prerequisites: [exponent-product-rule, exponent-quotient-rule]
        exemplars:
          - problem: 'Simplify $\frac{x^5 \cdot x^2}{x^3}$.'
            answer: "x^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator is $x^{5+2} = x^7$. Dividing by $x^3$ gives $7 - 3 = 4$, so the result is $x^4$.'
          - problem: 'Simplify $\frac{a^4 \cdot a^4}{a^6}$.'
            answer: "a^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator is $a^{4+4} = a^8$. Dividing by $a^6$ gives $8 - 6 = 2$, so the result is $a^2$.'
          - problem: 'A box has a base of area $x^5$ square units and a height of $x^3$ units. Its contents are poured into cups that each hold $x^6$ cubic units. How many cups are filled?'
            answer: "x^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is base area times height, $x^5 \cdot x^3 = x^8$. Dividing by one cup gives $x^{8-6} = x^2$ cups.'
          - problem: 'Simplify $\frac{b^6 \cdot b^3}{b^5}$.'
            answer: "b^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The numerator is $b^{6+3} = b^9$. Dividing by $b^5$ gives $9 - 5 = 4$, so the result is $b^4$.'
          - problem: 'A rectangle measures $y^7$ units by $y^3$ units. It is cut into $y^4$ identical tiles. What is the area of each tile?'
            answer: "y^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rectangle has area $y^7 \cdot y^3 = y^{10}$. Shared among $y^4$ tiles, each tile has area $y^{10-4} = y^6$ square units.'
          - problem: 'Simplify $\frac{m^8 \cdot m}{m^5}$.'
            answer: "m^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A bare $m$ is $m^1$, so the numerator is $m^{8+1} = m^9$. Dividing by $m^5$ gives $9 - 5 = 4$, so the result is $m^4$.'
          - problem: 'Simplify $\frac{n^{11}}{n^2 \cdot n^3}$.'
            answer: "n^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator is $n^{2+3} = n^5$. Dividing gives $11 - 5 = 6$, so the result is $n^6$.'
          - problem: 'Theo simplifies $\frac{x^4 \cdot x^6}{x^2}$ and writes $x^{12}$. What is the correct simplification?'
            answer: "x^8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Theo multiplied the exponents $4$ and $6$ and then divided by $2$. The product adds them, $4 + 6 = 10$, and the quotient subtracts, $10 - 2 = 8$, giving $x^8$.'
        constraints: "one product and one quotient step per problem"
      - id: kp2
        name: "Coefficients with product/quotient rules"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Simplify $(3x^2)(4x^5)$.'
            answer: "12x^7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the coefficients: $3 \cdot 4 = 12$. Add the exponents: $2 + 5 = 7$, so the product is $12x^7$.'
          - problem: 'Simplify $\frac{15a^7}{5a^4}$.'
            answer: "3a^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $\frac{15}{5} = 3$. Subtract the exponents: $7 - 4 = 3$, so the quotient is $3a^3$.'
          - problem: 'A rectangle is $6x^4$ units long and $3x^2$ units wide. What is its area?'
            answer: "18x^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Area is length times width, so multiply. The coefficients give $6 \cdot 3 = 18$ and the exponents give $4 + 2 = 6$, so the area is $18x^6$ square units.'
          - problem: 'Simplify $\frac{24a^8}{6a^3}$.'
            answer: "4a^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $\frac{24}{6} = 4$. Subtract the exponents: $8 - 3 = 5$, so the quotient is $4a^5$.'
          - problem: 'A rectangle has an area of $20x^9$ square units and a width of $4x^3$ units. What is its length?'
            answer: "5x^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width. The coefficients give $20 \div 4 = 5$ and the exponents give $9 - 3 = 6$, so the length is $5x^6$ units.'
          - problem: 'Simplify $(2x^3)(5x^4)$.'
            answer: "10x^7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the coefficients: $2 \cdot 5 = 10$. Add the exponents: $3 + 4 = 7$, so the product is $10x^7$.'
          - problem: 'A warehouse packs $36y^{10}$ cans equally into $9y^4$ crates. How many cans are in each crate?'
            answer: "4y^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Packing equally means dividing. The coefficients give $36 \div 9 = 4$ and the exponents give $10 - 4 = 6$, so each crate holds $4y^6$ cans.'
          - problem: 'Simplify $\frac{(6a^5)(2a^3)}{4a^2}$.'
            answer: "3a^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The coefficient is $(6 \cdot 2)/4 = 3$. The exponent is $5 + 3 - 2 = 6$, so the result is $3a^6$.'
          - problem: 'Priya writes $\frac{12x^8}{3x^2} = 9x^4$. What is the correct simplification?'
            answer: "4x^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Priya subtracted the coefficients and divided the exponents. The coefficients divide, $12 \div 3 = 4$, and the exponents subtract, $8 - 2 = 6$, giving $4x^6$.'
        constraints: "multiply/divide coefficients; apply exponent rule to variables"
      - id: kp3
        name: "Two variables at once"
        key_prerequisites: [exponent-product-rule, exponent-quotient-rule]
        exemplars:
          - problem: 'Simplify $(x^2 y^3)(x^4 y)$.'
            answer: "x^6 y^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Handle each base separately. For $x$, $2 + 4 = 6$; for $y$, $3 + 1 = 4$, so the product is $x^6y^4$.'
          - problem: 'Simplify $\frac{a^5 b^3}{a^2 b}$.'
            answer: "a^3 b^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Handle each base separately. For $a$, $5 - 2 = 3$; for $b$, $3 - 1 = 2$, so the quotient is $a^3b^2$.'
          - problem: 'A rectangle has an area of $x^7 y^5$ square units and a width of $x^3 y^2$ units. What is its length?'
            answer: "x^4 y^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Length is area divided by width. For $x$, $7 - 3 = 4$; for $y$, $5 - 2 = 3$, so the length is $x^4y^3$ units.'
          - problem: 'Simplify $(x^3 y^2)(x^2 y^4)$.'
            answer: "x^5 y^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Handle each base separately. For $x$, $3 + 2 = 5$; for $y$, $2 + 4 = 6$, so the product is $x^5y^6$.'
          - problem: 'A box measures $a^2 b$ by $a b^3$ by $a^4 b^2$ units. What is its volume?'
            answer: "a^7 b^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Volume is the product of the three dimensions. For $a$, $2 + 1 + 4 = 7$; for $b$, $1 + 3 + 2 = 6$, so the volume is $a^7b^6$ cubic units.'
          - problem: 'Simplify $\frac{a^6 b^5}{a^3 b^2}$.'
            answer: "a^3 b^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Handle each base separately. For $a$, $6 - 3 = 3$; for $b$, $5 - 2 = 3$, so the quotient is $a^3b^3$.'
          - problem: 'Simplify $\frac{(x^4 y^2)(x^3 y^5)}{x^2 y^3}$.'
            answer: "x^5 y^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Handle each base separately. For $x$, $4 + 3 - 2 = 5$; for $y$, $2 + 5 - 3 = 4$, so the result is $x^5y^4$.'
          - problem: 'Jonas simplifies $\frac{p^6 q^4}{p^2 q}$ and writes $p^3 q^4$. What is the correct simplification?'
            answer: "p^4 q^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Jonas divided the exponents of $p$ and ignored the bare $q$. Subtracting gives $6 - 2 = 4$ for $p$ and $4 - 1 = 3$ for $q$, so the result is $p^4q^3$.'
        constraints: "apply the rules base by base"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{(2x^3y)(6xy^2)}{4x^2y}$.'
      answer: '3x^2 y^2'
      solution_sketch: '$\frac{12x^4y^3}{4x^2y} = 3x^2y^2$.'
    anki_seeds:
      - front: "Simplifying (3x^2)(4x^5): the coefficients are ___ and the exponents are ___"
        back: "multiplied (3*4 = 12); added (2 + 5 = 7)"
        type: basic

  - id: power-of-a-power-rule
    name: "Power of a Power"
    core: true
    difficulty: 0.36
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.5
        key: true
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Multiply the exponents"
        key_prerequisites: [integer-multiplication-division]
        try_first:
          problem: 'Written as a product, $(x^3)^2$ is $x^3 \cdot x^3$. How many factors of $x$ does it contain?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: '$(x^3)^2 = x^3 \cdot x^3$ is two groups of three factors, $6$ factors of $x$, so it is $x^6$. Raising a power to a power multiplies the exponents: $3 \cdot 2 = 6$.'
        exemplars:
          - problem: 'Simplify $(x^3)^4$.'
            answer: "x^12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Four copies of $x^3$ hold four groups of three factors. Multiply the exponents: $3 \cdot 4 = 12$, giving $x^{12}$.'
          - problem: 'Simplify $(a^5)^2$.'
            answer: "a^10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Two copies of $a^5$ hold two groups of five factors. Multiply the exponents: $5 \cdot 2 = 10$, giving $a^{10}$.'
          - problem: 'A square has sides of length $x^4$ units. What is its area?'
            answer: "x^8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area of a square is the side squared, $(x^4)^2$. Multiply the exponents: $4 \cdot 2 = 8$, so the area is $x^8$ square units.'
          - problem: 'Simplify $(b^2)^6$.'
            answer: "b^12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Six copies of $b^2$ hold six groups of two factors. Multiply the exponents: $2 \cdot 6 = 12$, giving $b^{12}$.'
          - problem: 'A cube has edges of length $k^3$ units. What is its volume?'
            answer: "k^9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume of a cube is the edge cubed, $(k^3)^3$. Multiply the exponents: $3 \cdot 3 = 9$, so the volume is $k^9$ cubic units.'
          - problem: 'Simplify $(m^3)^5$.'
            answer: "m^15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Five copies of $m^3$ hold five groups of three factors. Multiply the exponents: $3 \cdot 5 = 15$, giving $m^{15}$.'
          - problem: 'A square has an area of $y^{10}$ square units. What is its side length?'
            answer: "y^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side $s$ satisfies $s^2 = y^{10}$. Since $(y^5)^2 = y^{5 \cdot 2} = y^{10}$, the side length is $y^5$ units.'
          - problem: 'Ella writes $(n^4)^3 = n^7$. What is the correct simplification?'
            answer: "n^12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ella added the exponents. Three copies of $n^4$ contain $4 \cdot 3 = 12$ factors, so the result is $n^{12}$.'
        constraints: "single variable base; multiply the exponents"
      - id: kp2
        name: "Numeric bases left in exponent form"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Write $(2^2)^3$ as a single power of $2$.'
            answer: "2^6"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The base stays $2$ and the exponents multiply. Since $2 \cdot 3 = 6$, the result is $2^6$.'
          - problem: 'What single power of $10$ equals $(10^3)^2$?'
            answer: "10^6"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The base stays $10$ and the exponents multiply. Since $3 \cdot 2 = 6$, the result is $10^6$.'
          - problem: 'Write $(3^2)^4$ as a single power of $3$.'
            answer: "3^8"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The base stays $3$ and the exponents multiply. Since $2 \cdot 4 = 8$, the result is $3^8$.'
          - problem: 'A cube has edges of length $5^3$ units. Write its volume as a single power of $5$.'
            answer: "5^9"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The volume is the edge cubed, $(5^3)^3$. Multiply the exponents: $3 \cdot 3 = 9$, so the volume is $5^9$ cubic units.'
          - problem: 'A square field has an area of $3^8$ square metres. How long is each side?'
            answer: "3^4"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The side squared equals the area, and $(3^4)^2 = 3^8$. So each side is $3^4 = 81$ metres long.'
          - problem: 'What single power of $6$ equals $(6^5)^3$?'
            answer: "6^15"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'The base stays $6$ and the exponents multiply. Since $5 \cdot 3 = 15$, the result is $6^{15}$.'
          - problem: 'A data centre has $(2^{10})^4$ bytes of storage. Write this number as a single power of $2$.'
            answer: "2^40"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'Four copies of $2^{10}$ are multiplied together. Multiply the exponents: $10 \cdot 4 = 40$, giving $2^{40}$ bytes.'
          - problem: 'Kai writes $(9^2)^5 = 9^7$. Write $(9^2)^5$ correctly as a single power of $9$.'
            answer: "9^10"
            answer_contract: {"kind":"required_single_power"}
            solution_sketch: 'Kai added the exponents. Five copies of $9^2$ contain $2 \cdot 5 = 10$ factors of $9$, so the result is $9^{10}$.'
        constraints: "answer stays as a single power, not evaluated"
      - id: kp3
        name: "Combine with product and quotient rules"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $(x^2)^3 \cdot x^4$.'
            answer: "x^10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(x^2)^3 = x^6$. Then $x^6 \cdot x^4 = x^{6+4} = x^{10}$.'
          - problem: 'Simplify $\frac{(y^3)^3}{y^4}$.'
            answer: "y^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(y^3)^3 = y^9$. Then $y^9 / y^4 = y^{9-4} = y^5$.'
          - problem: 'Simplify $(a^2)^4 \cdot a^3$.'
            answer: "a^11"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(a^2)^4 = a^8$. Then $a^8 \cdot a^3 = a^{8+3} = a^{11}$.'
          - problem: 'A cube has edges of length $x^3$ units. It is filled with small blocks, each with a volume of $x^4$ cubic units. How many blocks fill the cube?'
            answer: "x^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cube has volume $(x^3)^3 = x^9$. Dividing by one block gives $x^{9-4} = x^5$ blocks.'
          - problem: 'Simplify $\frac{(b^4)^2}{b^5}$.'
            answer: "b^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(b^4)^2 = b^8$. Then $b^8 / b^5 = b^{8-5} = b^3$.'
          - problem: 'A floor is covered by $m^4$ square tiles, each with sides of length $m^3$ units. What is the area of the floor?'
            answer: "m^10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each tile has area $(m^3)^2 = m^6$. The floor is $m^4$ tiles, so its area is $m^6 \cdot m^4 = m^{10}$ square units.'
          - problem: 'Simplify $\frac{(p^2)^5 \cdot p^3}{(p^3)^2}$.'
            answer: "p^7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The powers give $p^{10} \cdot p^3 = p^{13}$ on top and $p^6$ below. Then $13 - 6 = 7$, so the result is $p^7$.'
          - problem: 'Noah writes $(x^3)^2 \cdot x^4 = x^9$. What is the correct simplification?'
            answer: "x^10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Noah added all three numbers. The power of a power multiplies, $(x^3)^2 = x^6$, and then $x^6 \cdot x^4 = x^{10}$.'
        constraints: "power of a power first, then product/quotient rule"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{(x^4)^2}{x^3}$.'
      answer: 'x^5'
      solution_sketch: '$(x^4)^2 = x^8$, then $8 - 3 = 5$.'
    anki_seeds:
      - front: "Power of a power: (a^m)^n = ?"
        back: "a^(m*n)"
        type: basic

  - id: power-rule-exponents
    name: "Power Rules for Exponents"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: power-of-a-power-rule
        weight: 0.7
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Power of a product"
        key_prerequisites: [power-of-a-power-rule]
        try_first:
          problem: 'Multiply out $(3x)(3x)$. What is the coefficient of $x^2$?'
          answer_contract: {"kind":"exact"}
          answer: '9'
          reveal: '$(3x)(3x) = 3 \cdot 3 \cdot x \cdot x = 9x^2$, so the $3$ is squared too. A power of a product raises every factor to that power: $(3x)^2 = 9x^2$.'
        exemplars:
          - problem: 'Simplify $(2x)^3$.'
            answer: "8x^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Cube each factor. Since $2^3 = 8$ and $x$ cubed is $x^3$, the result is $8x^3$.'
          - problem: 'Simplify $(3a^2)^2$.'
            answer: "9a^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square each factor. Since $3^2 = 9$ and $(a^2)^2 = a^4$, the result is $9a^4$.'
          - problem: 'A square has sides of length $5x^3$ units. What is its area?'
            answer: "25x^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is the side squared, $(5x^3)^2$. Since $5^2 = 25$ and $(x^3)^2 = x^6$, the area is $25x^6$ square units.'
          - problem: 'Simplify $(2x^2)^3$.'
            answer: "8x^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Cube each factor. Since $2^3 = 8$ and $(x^2)^3 = x^6$, the result is $8x^6$.'
          - problem: 'A cube has edges of length $4y^2$ units. What is its volume?'
            answer: "64y^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is the edge cubed, $(4y^2)^3$. Since $4^3 = 64$ and $(y^2)^3 = y^6$, the volume is $64y^6$ cubic units.'
          - problem: 'Simplify $(4a)^2$.'
            answer: "16a^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square each factor. Since $4^2 = 16$ and $a$ squared is $a^2$, the result is $16a^2$.'
          - problem: 'A square has an area of $36x^{10}$ square units. What is its side length?'
            answer: "6x^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The side squared must equal the area. Since $(6x^5)^2 = 36x^{10}$, the side length is $6x^5$ units.'
          - problem: 'Zoe writes $(3x^4)^2 = 3x^8$. What is the correct simplification?'
            answer: "9x^8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Zoe forgot to square the coefficient. Since $3^2 = 9$ and $(x^4)^2 = x^8$, the result is $9x^8$.'
        constraints: "raise each factor to the power"
      - id: kp2
        name: "Power of a quotient"
        key_prerequisites: [power-of-a-power-rule]
        exemplars:
          - problem: 'Simplify $(x^2 / y)^3$.'
            answer: "x^6 / y^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Cube the numerator and the denominator. The numerator is $x^{2 \cdot 3} = x^6$ and the denominator is $y^3$, giving $x^6/y^3$.'
          - problem: 'Simplify $(2 / x^3)^2$.'
            answer: "4 / x^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square the numerator and the denominator. Since $2^2 = 4$ and $(x^3)^2 = x^6$, the result is $4/x^6$.'
          - problem: 'A square has sides of length $\frac{x^3}{2}$ units. What is its area?'
            answer: "x^6 / 4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is the side squared, so square the top and the bottom. Since $(x^3)^2 = x^6$ and $2^2 = 4$, the area is $x^6/4$ square units.'
          - problem: 'Simplify $(a / b^2)^3$.'
            answer: "a^3 / b^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Cube the numerator and the denominator. The numerator is $a^3$ and the denominator is $b^{2 \cdot 3} = b^6$, giving $a^3/b^6$.'
          - problem: 'A cube has edges of length $\frac{a^2}{3}$ units. What is its volume?'
            answer: "a^6 / 27"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is the edge cubed, so cube the top and the bottom. Since $(a^2)^3 = a^6$ and $3^3 = 27$, the volume is $a^6/27$ cubic units.'
          - problem: 'Simplify $(3 / x^2)^2$.'
            answer: "9 / x^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square the numerator and the denominator. Since $3^2 = 9$ and $(x^2)^2 = x^4$, the result is $9/x^4$.'
          - problem: 'Simplify $\left(\frac{2x^3}{y^4}\right)^3$.'
            answer: "8x^9 / y^12"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Cube every factor on top and below. The numerator is $2^3x^{3 \cdot 3} = 8x^9$ and the denominator is $y^{4 \cdot 3} = y^{12}$.'
          - problem: 'Leo writes $\left(\frac{x^4}{5}\right)^2 = \frac{x^8}{5}$. What is the correct simplification?'
            answer: "x^8 / 25"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Leo forgot to square the denominator. Since $(x^4)^2 = x^8$ and $5^2 = 25$, the result is $x^8/25$.'
        constraints: "raise numerator and denominator to the power"
      - id: kp3
        name: "Combinations of power rules"
        key_prerequisites: [exponent-product-quotient-rules, power-of-a-power-rule]
        exemplars:
          - problem: 'Simplify $(2x^3)^2 \cdot x$.'
            answer: "4x^7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(2x^3)^2 = 4x^6$. Then multiplying by $x$ adds one to the exponent, giving $4x^7$.'
          - problem: 'Simplify $(3x^2)^2 (2x)$.'
            answer: "18x^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(3x^2)^2 = 9x^4$. Then $9x^4 \cdot 2x = 18x^5$.'
          - problem: 'A box has a square base with sides of length $3x^2$ units and a height of $5x^3$ units. What is its volume?'
            answer: "45x^7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base area is $(3x^2)^2 = 9x^4$. Multiplying by the height gives $9x^4 \cdot 5x^3 = 45x^7$ cubic units.'
          - problem: 'Simplify $(3x)^2(2x^2)$.'
            answer: "18x^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(3x)^2 = 9x^2$. Then $9x^2 \cdot 2x^2 = 18x^4$.'
          - problem: 'Simplify $(2a^3)^3 \cdot 3a$.'
            answer: "24a^10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(2a^3)^3 = 8a^9$. Then $8a^9 \cdot 3a = 24a^{10}$.'
          - problem: 'A cube has edges of length $4x^3$ units. It is cut into $8x^5$ identical small blocks. What is the volume of each block?'
            answer: "8x^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The cube has volume $(4x^3)^3 = 64x^9$. Dividing by the number of blocks gives $64 \div 8 = 8$ and $9 - 5 = 4$, so each block is $8x^4$ cubic units.'
          - problem: 'Simplify $\frac{(3x^4)^2}{x^5}$.'
            answer: "9x^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(3x^4)^2 = 9x^8$. Then dividing by $x^5$ gives $9x^{8-5} = 9x^3$.'
          - problem: 'Ravi writes $(5x^2)^2 \cdot 2x^3 = 10x^7$. What is the correct simplification?'
            answer: "50x^7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Ravi did not square the $5$. In fact $(5x^2)^2 = 25x^4$, and $25x^4 \cdot 2x^3 = 50x^7$.'
          - problem: 'Simplify $(2x^2)^2 \cdot x^3$.'
            answer: "4x^7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $(2x^2)^2 = 4x^4$. Then $4x^4 \cdot x^3 = 4x^7$.'
        constraints: "power rules first, then product rule; small coefficients"
    diagnostic_exemplar:
      problem: 'Simplify $(2x^2)^3 \cdot x^2$.'
      answer: '8x^8'
      solution_sketch: '$(2x^2)^3 = 8x^6$, then $8x^6 \cdot x^2 = 8x^8$.'
    anki_seeds:
      - front: "Power of a product: (a*b)^n = ?"
        back: "a^n * b^n"
        type: basic
      - front: "Power of a quotient: (a/b)^n = ?"
        back: "a^n / b^n"
        type: basic

  - id: zero-exponent-rule
    name: "The Zero Exponent"
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-exponents-intro
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Evaluate a nonzero base to the zero power"
        key_prerequisites: [integer-exponents-intro]
        try_first:
          problem: 'In the pattern $3^3 = 27$, $3^2 = 9$, $3^1 = 3$, each line divides the previous value by $3$. Continuing the pattern, what is $3^0$?'
          answer_contract: {"kind":"exact"}
          answer: '1'
          reveal: 'Dividing $3$ by $3$ once more gives $3^0 = 1$. Lowering an exponent by one divides by the base, so every nonzero base to the power $0$ is $1$.'
        exemplars:
          - problem: 'Simplify $5^0$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base $5$ is nonzero. Any nonzero base raised to the power $0$ equals $1$, so $5^0 = 1$.'
          - problem: 'Simplify $(-4)^0$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The parentheses make $-4$ the base, and it is nonzero. So $(-4)^0 = 1$; the sign of the base does not matter.'
          - problem: 'Evaluate $-3^0$.'
            answer: "-1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Without parentheses the exponent applies only to $3$. So $-3^0 = -(3^0) = -1$, while $(-3)^0$ would be $1$.'
          - problem: 'Each fold of a sheet of paper doubles the number of layers, so after $n$ folds there are $2^n$ layers. How many layers does the sheet have before any fold, when $n = 0$?'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Before folding, $n = 0$ and the sheet has $2^0$ layers. Since $2^0 = 1$, the unfolded sheet is a single layer.'
          - problem: 'Evaluate $9^0 + 9^1$.'
            answer: "10"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zero power gives $9^0 = 1$ and the first power gives $9^1 = 9$. So the sum is $1 + 9 = 10$.'
          - problem: 'Evaluate $2^0 + 2^1 + 2^2$.'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The powers are $2^0 = 1$, $2^1 = 2$ and $2^2 = 4$. Their sum is $1 + 2 + 4 = 7$.'
          - problem: 'A bacteria culture triples every hour, so after $t$ hours it is $3^t$ times its starting size. By what factor has it grown at $t = 0$?'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'At $t = 0$ the growth factor is $3^0$. Since $3^0 = 1$, the culture is still exactly its starting size.'
          - problem: 'What does $(-11)^0$ equal?'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The base $-11$ is inside parentheses and is nonzero. Therefore $(-11)^0 = 1$.'
        constraints: "any nonzero base to the 0 power is 1"
      - id: kp2
        name: "Zero exponents inside expressions"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $(3x)^0$ for $x \ne 0$.'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The whole product $3x$ is the base, and it is nonzero. A nonzero base to the power $0$ is $1$.'
          - problem: 'Simplify $3x^0$ for $x \ne 0$.'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only $x$ carries the exponent $0$, so $x^0 = 1$. The coefficient stays: $3 \cdot 1 = 3$.'
          - problem: 'A culture has $N = 400 \cdot 2^t$ bacteria $t$ hours after it is started. How many bacteria are there at the start?'
            answer: "400"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The start is $t = 0$, so $N = 400 \cdot 2^0$. Since $2^0 = 1$, there are $400$ bacteria.'
          - problem: 'Evaluate $8a^0 + (2a)^0$ for $a \ne 0$.'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'In $8a^0$ only $a$ is powered, giving $8 \cdot 1 = 8$. The grouped $(2a)^0$ is $1$, so the sum is $8 + 1 = 9$.'
          - problem: 'Lena simplifies $7x^0$ to $1$ for $x \ne 0$. What is the correct value of $7x^0$?'
            answer: "7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The zero exponent applies only to $x$, so $x^0 = 1$. The coefficient remains: $7 \cdot 1 = 7$.'
          - problem: 'A car is worth $V = 18000 \cdot 0.85^t$ euros $t$ years after it is bought. How much was it worth when it was bought?'
            answer: "18000"
            answer_contract: {"kind":"unit","quantity":"euro","unit":"euro","allow_omitted":true}
            solution_sketch: 'At purchase $t = 0$, so $V = 18000 \cdot 0.85^0$. Since $0.85^0 = 1$, the car was worth $18000$ euros.'
          - problem: 'What is $(5x)^0$ for $x \ne 0$?'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The whole base $5x$ is nonzero and raised to the power $0$. So $(5x)^0 = 1$.'
          - problem: 'Simplify $6x^0y^2$ for $x \ne 0$.'
            answer: "6y^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Only $x$ has the exponent $0$, so $x^0 = 1$. The rest is unchanged: $6 \cdot 1 \cdot y^2 = 6y^2$.'
        constraints: "contrast (ax)^0 with a*x^0"
      - id: kp3
        name: "Why it works: the quotient rule"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Use the quotient rule to write $\frac{x^5}{x^5}$ as a single power of $x$. What is that power worth for $x \ne 0$?'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The quotient rule gives $x^{5-5} = x^0$. Any nonzero number divided by itself is $1$, so $x^0 = 1$.'
          - problem: 'Simplify $\frac{12x^3}{4x^3}$ for $x \ne 0$.'
            answer: "3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $12 \div 4 = 3$. The powers give $x^{3-3} = x^0 = 1$, so the result is $3$.'
          - problem: 'A warehouse holds $10^4$ boxes, and each truck carries $10^4$ boxes. How many trucks are needed to move all the boxes?'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of trucks is $\frac{10^4}{10^4} = 10^{4-4} = 10^0$. Since $10^0 = 1$, one truck is enough.'
          - problem: 'A baker shares $4 \cdot 6^2$ cookies equally among $6^2$ friends. How many cookies does each friend get?'
            answer: "4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each friend gets $\frac{4 \cdot 6^2}{6^2} = 4 \cdot 6^0$ cookies. Since $6^0 = 1$, each friend gets $4$ cookies.'
          - problem: 'Compute $2^0 + 3^0$.'
            answer: "2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each nonzero base to the power $0$ is $1$. So $2^0 + 3^0 = 1 + 1 = 2$.'
          - problem: 'Sam writes $\frac{y^3}{y^3} = y^0 = 0$ for $y \ne 0$. What is the correct value of $\frac{y^3}{y^3}$?'
            answer: "1"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A nonzero number divided by itself is $1$, so $\frac{y^3}{y^3} = 1$. The quotient rule gives $y^{3-3} = y^0$, which therefore equals $1$, not $0$.'
          - problem: 'Simplify $\frac{15a^2b^4}{5a^2b}$ for $a, b \ne 0$.'
            answer: "3b^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $15 \div 5 = 3$. Then $a^{2-2} = a^0 = 1$ and $b^{4-1} = b^3$, so the result is $3b^3$.'
        constraints: "connect a^0 = 1 to a^n / a^n"
    diagnostic_exemplar:
      problem: 'Evaluate $5x^0 + (3x)^0$ for $x \ne 0$.'
      answer: '6'
      solution_sketch: '$5x^0 = 5$ but $(3x)^0 = 1$, so $5 + 1 = 6$.'
    anki_seeds:
      - front: "Any nonzero base to the zero power equals ..."
        back: "1"
        type: basic

  - id: negative-zero-exponents
    name: "Negative and Zero Exponents"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: zero-exponent-rule
        weight: 0.6
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: power-rule-exponents
        weight: 0.3
      - id: dividing-fractions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Negative exponent as a reciprocal"
        key_prerequisites: [dividing-fractions]
        try_first:
          problem: 'In the pattern $2^2 = 4$, $2^1 = 2$, $2^0 = 1$, each line divides the previous value by $2$. Continuing the pattern, what is $2^{-2}$?'
          answer_contract: {"kind":"exact"}
          answer: '1/4'
          reveal: 'Two more divisions by $2$ give $2^{-1} = \frac{1}{2}$ and $2^{-2} = \frac{1}{4}$. A negative exponent gives the reciprocal of the positive power: $2^{-2} = \frac{1}{2^2}$.'
        exemplars:
          - problem: 'Evaluate $2^{-3}$.'
            answer: "1/8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent gives the reciprocal: $2^{-3} = \frac{1}{2^3}$. Since $2^3 = 8$, the value is $\frac{1}{8}$.'
          - problem: 'Evaluate $5^{-2}$.'
            answer: "1/25"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Take the reciprocal of the positive power: $5^{-2} = \frac{1}{5^2}$. Since $5^2 = 25$, the value is $\frac{1}{25}$.'
          - problem: 'A sheet of paper is cut in half, one half is cut in half again, and so on. After $n$ cuts the smallest piece is $2^{-n}$ of the sheet. What fraction of the sheet is the smallest piece after $4$ cuts?'
            answer: "1/16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'After $4$ cuts the piece is $2^{-4}$ of the sheet. That is $\frac{1}{2^4} = \frac{1}{16}$ of the sheet.'
          - problem: 'Evaluate $(-3)^{-3}$.'
            answer: "-1/27"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reciprocal rule gives $(-3)^{-3} = \frac{1}{(-3)^3}$. Since $(-3)^3 = -27$, the value is $-\frac{1}{27}$.'
          - problem: 'A radioactive sample has $80 \cdot 2^{-t}$ grams left after $t$ days. How many grams are left after $3$ days?'
            answer: "10"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"g","allow_omitted":true}
            solution_sketch: 'After $3$ days the mass is $80 \cdot 2^{-3} = \frac{80}{2^3}$ grams. Since $2^3 = 8$, that is $80 \div 8 = 10$ grams.'
          - problem: 'A camera shutter stays open for $2^{-8}$ of a second. How many such exposures would fit into one second?'
            answer: "256"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'One exposure lasts $2^{-8} = \frac{1}{2^8} = \frac{1}{256}$ of a second. Dividing one second by $\frac{1}{256}$ gives $256$ exposures.'
          - problem: 'Evaluate $10^{-4}$.'
            answer: "1/10000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent gives the reciprocal: $10^{-4} = \frac{1}{10^4}$. Since $10^4 = 10000$, the value is $\frac{1}{10000}$.'
          - problem: 'Jo writes $4^{-2} = -16$. What is the correct value of $4^{-2}$?'
            answer: "1/16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent means a reciprocal, not a negative number. So $4^{-2} = \frac{1}{4^2} = \frac{1}{16}$.'
        constraints: "a^-n = 1/a^n"
      - id: kp2
        name: "Negative exponents in denominators"
        key_prerequisites: [dividing-fractions]
        exemplars:
          - problem: 'Evaluate $\frac{1}{2^{-3}}$.'
            answer: "8"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator is $2^{-3} = \frac{1}{8}$. Dividing $1$ by $\frac{1}{8}$ multiplies by $8$, so the value is $8$.'
          - problem: 'Evaluate $\left(\frac{2}{3}\right)^{-1}$.'
            answer: "3/2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An exponent of $-1$ gives the reciprocal. The reciprocal of $\frac{2}{3}$ is $\frac{3}{2}$.'
          - problem: 'A grain of sand has a mass of about $10^{-5}$ kg. About how many grains of sand make up $1$ kg?'
            answer: "100000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of grains is $\frac{1}{10^{-5}} = 10^5$. That is $100000$ grains.'
          - problem: 'Evaluate $\frac{5}{x^{-2}}$ for $x = 3$.'
            answer: "45"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing by $x^{-2}$ multiplies by $x^2$, so $\frac{5}{x^{-2}} = 5x^2$. With $x = 3$ this is $5 \cdot 9 = 45$.'
          - problem: 'A wheel turns $3^{-2}$ of a full turn each second. How many seconds does one full turn take?'
            answer: "9"
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'One full turn takes $1 \div 3^{-2} = \frac{1}{3^{-2}} = 3^2$ seconds. That is $9$ seconds.'
          - problem: 'Evaluate $\left(\frac{2}{5}\right)^{-2}$.'
            answer: "25/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent flips the fraction: $\left(\frac{2}{5}\right)^{-2} = \left(\frac{5}{2}\right)^2$. Squaring gives $\frac{25}{4}$.'
          - problem: 'Omar says $\frac{1}{4^{-2}} = \frac{1}{16}$. What is the correct value of $\frac{1}{4^{-2}}$?'
            answer: "16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The denominator is $4^{-2} = \frac{1}{16}$. Dividing $1$ by $\frac{1}{16}$ gives $16$.'
        constraints: "a^-n in a denominator moves up as a^n; (a/b)^-1 = b/a"
      - id: kp3
        name: "Combine with exponent rules"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $x^3 \cdot x^{-5}$.'
            answer: "1/x^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the exponents: $3 + (-5) = -2$, so the product is $x^{-2}$. As a reciprocal this is $\frac{1}{x^2}$.'
          - problem: 'Simplify $3x^{-2} \cdot x^5$.'
            answer: "3x^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the exponents of $x$: $-2 + 5 = 3$. The coefficient stays, so the result is $3x^3$.'
          - problem: 'Simplify $\frac{x^2}{x^6}$.'
            answer: "1/x^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract the exponents: $2 - 6 = -4$, so the quotient is $x^{-4}$. As a reciprocal this is $\frac{1}{x^4}$.'
          - problem: 'A baker has $2^3$ kg of flour and splits it equally into $2^5$ bags. How many kilograms of flour go into each bag?'
            answer: "1/4"
            answer_contract: {"kind":"unit","quantity":"mass","unit":"kg","allow_omitted":true}
            solution_sketch: 'Each bag holds $\frac{2^3}{2^5} = 2^{3-5} = 2^{-2}$ kg. That is $\frac{1}{2^2} = \frac{1}{4}$ kg.'
          - problem: 'A square tile has sides of length $2^{-3}$ m. What is the area of the tile?'
            answer: "1/64"
            answer_contract: {"kind":"unit","quantity":"area","unit":"m^2","allow_omitted":true}
            solution_sketch: 'The area is $2^{-3} \cdot 2^{-3} = 2^{-6}$ square metres. That is $\frac{1}{2^6} = \frac{1}{64}$ square metres.'
          - problem: 'Evaluate $4^3 \cdot 4^{-5}$.'
            answer: "1/16"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the exponents: $3 + (-5) = -2$, so the product is $4^{-2}$. That equals $\frac{1}{4^2} = \frac{1}{16}$.'
          - problem: 'Rae simplifies $x^4 \cdot x^{-7}$ to $x^{-28}$. What is the correct simplification?'
            answer: "1/x^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiplying powers adds the exponents: $4 + (-7) = -3$. So the product is $x^{-3} = \frac{1}{x^3}$.'
          - problem: 'Simplify $2x^{-3} \cdot x^7$.'
            answer: "2x^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Add the exponents of $x$: $-3 + 7 = 4$. The coefficient stays, so the result is $2x^4$.'
        constraints: "combine exponents first, then rewrite negatives as reciprocals"
    diagnostic_exemplar:
      problem: 'Simplify $x^2 \cdot x^{-5}$.'
      answer: "1/x^3"
      solution_sketch: '$x^{2-5} = x^{-3} = \frac{1}{x^3}$.'
    anki_seeds:
      - front: "Negative exponent rule: a^-n = ?"
        back: "1/a^n (the reciprocal)"
        type: basic
      - front: "1 / a^-n = ?"
        back: "a^n"
        type: basic

  - id: simplifying-negative-exponent-expressions
    name: "Simplifying Expressions with Negative Exponents"
    core: false                # multi-rule drill; the exponent rules stay core
    difficulty: 0.50
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: negative-zero-exponents
        weight: 0.8
        key: true
      - id: power-rule-exponents
        weight: 0.5
        key: true
      - id: dividing-fractions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Quotients with negative exponents"
        key_prerequisites: [negative-zero-exponents]
        exemplars:
          - problem: 'Simplify $\frac{x^2}{x^{-3}}$.'
            answer: "x^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide powers of the same base by subtracting the exponents. Since $2 - (-3) = 5$, the quotient is $x^5$.'
          - problem: 'Simplify $\frac{y^{-4}}{y^{-1}}$.'
            answer: "1/y^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract the exponents: $-4 - (-1) = -3$. A negative exponent means a reciprocal, so the result is $y^{-3} = \frac{1}{y^3}$.'
          - problem: 'A red blood cell is about $10^{-5}$ m across and a virus is about $10^{-7}$ m across. How many times as wide as the virus is the cell?'
            answer: "100"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of times is the width of the cell divided by the width of the virus, $\frac{10^{-5}}{10^{-7}}$. Subtracting the exponents gives $-5 - (-7) = 2$, so the cell is $10^2 = 100$ times as wide.'
          - problem: 'Simplify $\frac{a^3}{a^{-2}}$.'
            answer: "a^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide powers of the same base by subtracting the exponents. Since $3 - (-2) = 5$, the quotient is $a^5$.'
          - problem: 'A sheet of paper is $10^{-4}$ m thick. A stack of sheets is $10^{-1}$ m tall. How many sheets are in the stack?'
            answer: "1000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of sheets is the height of the stack divided by the thickness of one sheet, $\frac{10^{-1}}{10^{-4}}$. Subtracting the exponents gives $-1 - (-4) = 3$, so the stack has $10^3 = 1000$ sheets.'
          - problem: 'Simplify $\frac{b^{-5}}{b^{-2}}$.'
            answer: "1/b^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract the exponents: $-5 - (-2) = -3$. A negative exponent means a reciprocal, so the result is $b^{-3} = \frac{1}{b^3}$.'
          - problem: 'Sam simplifies $\frac{m^{-3}}{m^{2}}$ and writes $m^{-1}$. What is the correct result?'
            answer: "1/m^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam did not subtract the exponents correctly. The exponent is $-3 - 2 = -5$, so the quotient is $m^{-5} = \frac{1}{m^5}$.'
          - problem: 'A pixel on a screen is $10^{-5}$ m wide. A row holds $10^{3}$ pixels. How wide is the row?'
            answer: "0.01"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The width of the row is the width of one pixel times the number of pixels, $10^{-5} \cdot 10^{3}$. Adding the exponents gives $10^{-2}$, so the row is $0.01$ m wide.'
          - problem: 'Simplify $\frac{z^{-6}}{z^{-9}}$.'
            answer: "z^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Subtract the exponents: $-6 - (-9) = 3$. So the quotient is $z^3$.'
        constraints: "subtract exponents carefully with signs; final answer uses positive exponents"
      - id: kp2
        name: "Powers of terms with negative exponents"
        key_prerequisites: [power-rule-exponents, negative-zero-exponents]
        exemplars:
          - problem: 'Simplify $(x^{-2})^3$.'
            answer: "1/x^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Raise a power to a power by multiplying the exponents: $(-2) \cdot 3 = -6$. So the result is $x^{-6} = \frac{1}{x^6}$.'
          - problem: 'Simplify $(2x^{-1})^2$.'
            answer: "4/x^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The outer power applies to both the $2$ and the $x^{-1}$. So the result is $2^2 \cdot x^{-2} = \frac{4}{x^2}$.'
          - problem: 'The pull of a magnet at distance $d$ is $20d^{-2}$ units. How many times as strong is the pull at distance $d$ as the pull at distance $3d$?'
            answer: "9"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pull at distance $3d$ is $20(3d)^{-2} = 20 \cdot 3^{-2} \cdot d^{-2} = \frac{20d^{-2}}{9}$. So the pull at distance $d$ is $9$ times as strong.'
          - problem: 'Simplify $(y^{-3})^2$.'
            answer: "1/y^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Raise a power to a power by multiplying the exponents: $(-3) \cdot 2 = -6$. So the result is $y^{-6} = \frac{1}{y^6}$.'
          - problem: 'Simplify $(3a^{-2})^2$.'
            answer: "9/a^4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The outer power applies to both the $3$ and the $a^{-2}$. So the result is $3^2 \cdot a^{-4} = \frac{9}{a^4}$.'
          - problem: 'A square has side $5t^{-1}$ cm. What is its area in square centimetres?'
            answer: "25/t^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is the side times itself, so it is $(5t^{-1})^2$. The outer power applies to the $5$ and to $t^{-1}$, giving $25t^{-2} = \frac{25}{t^2}$.'
          - problem: 'Sam simplifies $(4x^{-3})^2$ and writes $4x^{-6}$. What is the correct result?'
            answer: "16/x^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam applied the outer power to $x^{-3}$ only. It applies to the $4$ as well, so the result is $4^2 x^{-6} = 16x^{-6} = \frac{16}{x^6}$.'
          - problem: 'A cube has edge length $2x^{-2}$ cm. What is its volume in cubic centimetres?'
            answer: "8/x^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The volume is the edge length cubed, $(2x^{-2})^3$. Cubing the $2$ and multiplying the exponents gives $8x^{-6} = \frac{8}{x^6}$.'
          - problem: 'Simplify $(2y^{-3})^{-2}$.'
            answer: "y^6/4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The outer power applies to the $2$ and to $y^{-3}$. So the result is $2^{-2} y^{6} = \frac{1}{4} y^6 = \frac{y^6}{4}$.'
        constraints: "multiply exponents, keep track of the sign"
      - id: kp3
        name: "Full expressions with coefficients and two variables"
        key_prerequisites: [negative-zero-exponents, power-rule-exponents]
        exemplars:
          - problem: 'Simplify $\frac{6x^{-2}y}{3xy^{-3}}$.'
            answer: "2y^4/x^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $\frac{6}{3} = 2$. For $x$ the exponent is $-2 - 1 = -3$ and for $y$ it is $1 - (-3) = 4$, so the result is $\frac{2y^4}{x^3}$.'
          - problem: 'Simplify $(3x^2)^{-1}$.'
            answer: "1/(3x^2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent on a whole product applies to every factor, including the $3$. So the result is $\frac{1}{3x^2}$.'
          - problem: 'A rectangular field is $4x^{-2}$ km wide and $5x^{3}y^{-1}$ km long. What is its area in square kilometres?'
            answer: "20x/y"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is the width times the length. Multiply the coefficients, $4 \cdot 5 = 20$, add the exponents of $x$, $-2 + 3 = 1$, and keep $y^{-1}$, so the area is $20xy^{-1} = \frac{20x}{y}$.'
          - problem: 'Simplify $\frac{10a^{-1}y^3}{5a^2y^{-2}}$.'
            answer: "2y^5/a^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $\frac{10}{5} = 2$. For $a$ the exponent is $-1 - 2 = -3$ and for $y$ it is $3 - (-2) = 5$, so the result is $\frac{2y^5}{a^3}$.'
          - problem: 'Simplify $\left(\frac{2x}{y^{2}}\right)^{-3}$.'
            answer: "y^6/(8x^3)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A negative exponent flips the fraction, so the expression equals $\left(\frac{y^2}{2x}\right)^3$. Cubing the numerator and the denominator gives $\frac{y^6}{8x^3}$.'
          - problem: 'A field has an area of $18x^{-1}y^{3}$ square metres and a barn has a floor area of $6x^{2}y^{-1}$ square metres. How many times as large as the barn floor is the field?'
            answer: "3y^4/x^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the area of the field by the floor area of the barn. Then $\frac{18}{6} = 3$, the exponent of $x$ is $-1 - 2 = -3$ and the exponent of $y$ is $3 - (-1) = 4$, so the ratio is $\frac{3y^4}{x^3}$.'
          - problem: 'Sam simplifies $\frac{9x^{-2}}{3x^{-5}}$ and writes $\frac{3}{x^{7}}$. What is the correct result?'
            answer: "3x^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Sam added the exponents instead of subtracting them. The correct exponent is $-2 - (-5) = 3$, so the result is $\frac{9}{3} x^3 = 3x^3$.'
          - problem: 'Simplify $\frac{(3a^{-1}b)^2}{6b^{-3}}$.'
            answer: "3b^5/(2a^2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Square the numerator first: $(3a^{-1}b)^2 = 9a^{-2}b^2$. Dividing by $6b^{-3}$ gives $\frac{9}{6} = \frac{3}{2}$, $a^{-2}$ and $b^{2-(-3)} = b^5$, so the result is $\frac{3b^5}{2a^2}$.'
        constraints: "coefficients reduce; each variable handled separately"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{8x^{-1}y^2}{4x^2y^{-1}}$.'
      answer: '2y^3 / x^3'
      solution_sketch: '$\frac{8}{4} = 2$; $x^{-1-2} = x^{-3}$; $y^{2-(-1)} = y^3$.'
    anki_seeds:
      - front: "A factor x^-m in a denominator moves to the numerator as ..."
        back: "x^m"
        type: basic

  - id: scientific-notation-conversion
    name: "Converting To and From Scientific Notation"
    core: true
    difficulty: 0.38
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: place-value
        weight: 0.5
        key: true
      - id: decimal-operations
        weight: 0.5
        key: true
      - id: negative-zero-exponents
        weight: 0.5
        key: true
    knowledge_points:
      - id: kp1
        name: "Convert large numbers to and from scientific notation"
        key_prerequisites: [place-value]
        try_first:
          problem: 'Multiplying $6.7$ by $10$ gives $67$, and by $100$ gives $670$. If $6\,700\,000 = 6.7 \times 10^n$, what is $n$?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'Each factor of $10$ moves the decimal point one place right, and $6.7$ needs six such moves to become $6\,700\,000$. So $6\,700\,000 = 6.7 \times 10^6$, which is how scientific notation writes a large number.'
        exemplars:
          - problem: 'Write $45000$ in scientific notation.'
            answer: "4.5*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $4$ places left to get the coefficient $4.5$. Then $45000 = 4.5 \times 10^4$.'
          - problem: 'Write $3.2 \times 10^3$ as an ordinary number.'
            answer: "3200"
            answer_contract: {"kind":"required_form","form":"integer"}
            solution_sketch: 'Multiplying by $10^3$ moves the decimal point $3$ places right. So $3.2 \times 10^3 = 3200$.'
          - problem: 'The Sun is about $150\,000\,000$ km from Earth. Write this number of kilometres in scientific notation.'
            answer: "1.5*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $8$ places left to get the coefficient $1.5$. So the distance is $1.5 \times 10^8$ km.'
          - problem: 'The population of the world is about $8.1 \times 10^9$ people. Write this population as an ordinary number.'
            answer: "8100000000"
            answer_contract: {"kind":"required_form","form":"integer"}
            solution_sketch: 'Multiplying by $10^9$ moves the decimal point $9$ places right. So $8.1 \times 10^9 = 8100000000$ people.'
          - problem: 'Write $307000$ in scientific notation.'
            answer: "3.07*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $5$ places left; the zero between $3$ and $7$ stays. So $307000 = 3.07 \times 10^5$.'
          - problem: 'Write $5.06 \times 10^5$ as an ordinary number.'
            answer: "506000"
            answer_contract: {"kind":"required_form","form":"integer"}
            solution_sketch: 'Multiplying by $10^5$ moves the decimal point $5$ places right. So $5.06 \times 10^5 = 506000$.'
          - problem: 'A large stadium has about $90000$ seats. Write this number of seats in scientific notation.'
            answer: "9*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $4$ places left to get the coefficient $9$. So $90000 = 9 \times 10^4$ seats.'
        constraints: "coefficient a satisfies 1 <= a < 10"
      - id: kp2
        name: "Small numbers with negative exponents"
        key_prerequisites: [negative-zero-exponents]
        exemplars:
          - problem: 'Write $0.00072$ in scientific notation.'
            answer: "7.2*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $4$ places right to get the coefficient $7.2$. The number is below $1$, so $0.00072 = 7.2 \times 10^{-4}$.'
          - problem: 'Write $6 \times 10^{-3}$ as an ordinary number.'
            answer: "0.006"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Multiplying by $10^{-3}$ moves the decimal point $3$ places left. So $6 \times 10^{-3} = 0.006$.'
          - problem: 'A human hair is about $0.00008$ m thick. Write this thickness in metres in scientific notation.'
            answer: "8*10^-5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $5$ places right to get the coefficient $8$. So the hair is $8 \times 10^{-5}$ m thick.'
          - problem: 'A grain of pollen has a mass of about $2.5 \times 10^{-8}$ g. Write this mass in grams as an ordinary number.'
            answer: "0.000000025"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Multiplying by $10^{-8}$ moves the decimal point $8$ places left. So $2.5 \times 10^{-8} = 0.000000025$ g.'
          - problem: 'Write $0.000305$ in scientific notation.'
            answer: "3.05*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $4$ places right to get the coefficient $3.05$. So $0.000305 = 3.05 \times 10^{-4}$.'
          - problem: 'Write $4.1 \times 10^{-6}$ as an ordinary number.'
            answer: "0.0000041"
            answer_contract: {"kind":"required_form","form":"decimal"}
            solution_sketch: 'Multiplying by $10^{-6}$ moves the decimal point $6$ places left. So $4.1 \times 10^{-6} = 0.0000041$.'
          - problem: 'Express $0.0004$ in scientific notation.'
            answer: "4*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Move the decimal point $4$ places right to get the coefficient $4$. So $0.0004 = 4 \times 10^{-4}$.'
        constraints: "negative exponent for numbers less than 1"
      - id: kp3
        name: "Valid form and comparing magnitudes"
        key_prerequisites: [place-value, negative-zero-exponents]
        exemplars:
          - problem: 'Rewrite $12 \times 10^3$ in scientific notation.'
            answer: "1.2*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The coefficient $12$ is too large, and $12 = 1.2 \times 10$. So $12 \times 10^3 = 1.2 \times 10^4$.'
          - problem: 'Which is larger: $3 \times 10^5$ or $9 \times 10^4$?'
            answer: "3*10^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both are normalized, so compare exponents first. Since $10^5 > 10^4$, the larger number is $3 \times 10^5$.'
          - problem: 'Rewrite $0.52 \times 10^{-3}$ in scientific notation.'
            answer: "5.2*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The coefficient $0.52$ is too small, and $0.52 = 5.2 \times 10^{-1}$. So $0.52 \times 10^{-3} = 5.2 \times 10^{-4}$.'
          - problem: 'A virus is about $1.2 \times 10^{-7}$ m long and a bacterium is about $2 \times 10^{-6}$ m long. Which is longer, the virus or the bacterium?'
            answer: "the bacterium"
            answer_contract: {"kind":"label","options":[["the bacterium","bacterium","the bacteria","bacteria"],["the virus","virus"]]}
            solution_sketch: 'Both lengths are normalized, so compare exponents. Since $-6 > -7$, the bacterium at $2 \times 10^{-6}$ m is longer.'
          - problem: 'Mount Everest is about $8.8 \times 10^3$ m high, and the Mariana Trench is about $1.1 \times 10^4$ m deep. Which is greater, the height of Everest or the depth of the trench?'
            answer: "the depth"
            answer_contract: {"kind":"label","options":[["the depth","depth","the depth of the trench","the trench","the Mariana Trench"],["the height","height","the height of Everest","Everest","Mount Everest"]]}
            solution_sketch: 'The exponent $4$ is greater than $3$. So the depth of $1.1 \times 10^4$ m is greater than the height of $8.8 \times 10^3$ m.'
          - problem: 'Which is smaller: $4.5 \times 10^{-3}$ or $8 \times 10^{-4}$?'
            answer: "8*10^-4"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compare exponents first: $-4 < -3$. So the smaller number is $8 \times 10^{-4}$, even though its coefficient is larger.'
          - problem: 'Express $45 \times 10^2$ in scientific notation.'
            answer: "4.5*10^3"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Write $45 = 4.5 \times 10$ and add one to the exponent. So $45 \times 10^2 = 4.5 \times 10^3$.'
          - problem: 'Kai rewrites $0.6 \times 10^5$ as $6 \times 10^6$. What is the correct scientific notation for $0.6 \times 10^5$?'
            answer: "6*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Making the coefficient ten times larger, $0.6 \to 6$, needs one less power of ten. So $0.6 \times 10^5 = 6 \times 10^4$.'
        constraints: "renormalize the coefficient into [1, 10); compare exponents before coefficients"
    diagnostic_exemplar:
      problem: 'Rewrite $340 \times 10^{-6}$ in proper scientific notation.'
      answer: '3.4 x 10^-4'
      solution_sketch: '$340 = 3.4 \times 10^2$, so the value is $3.4 \times 10^{2-6} = 3.4 \times 10^{-4}$.'
    anki_seeds:
      - front: "Scientific notation has the form a x 10^n with what restriction on a?"
        back: "1 <= a < 10 (positive n for large numbers, negative n for small numbers)"
        type: basic

  - id: scientific-notation
    name: "Scientific Notation"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 80
    prerequisites:
      - id: scientific-notation-conversion
        weight: 0.8
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.5
        key: true
      - id: decimal-operations
        weight: 0.4
      - id: integer-multiplication-division
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Multiply in scientific notation"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Compute $(2 \times 10^3)(3 \times 10^4)$.'
            answer: "6*10^7"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the coefficients: $2 \cdot 3 = 6$. Add the exponents: $10^{3+4} = 10^7$, so the product is $6 \times 10^7$.'
          - problem: 'What is $(3 \times 10^{-2})(2 \times 10^5)$?'
            answer: "6*10^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the coefficients: $3 \cdot 2 = 6$. Add the exponents: $10^{-2+5} = 10^3$, so the product is $6 \times 10^3$.'
          - problem: 'Light travels about $3 \times 10^5$ km each second. How far does light travel in $2 \times 10^3$ seconds?'
            answer: "6*10^8"
            answer_contract: {"kind":"unit","quantity":"length","unit":"km","allow_omitted":true}
            solution_sketch: 'Distance is speed times time: $(3 \times 10^5)(2 \times 10^3)$. That is $6 \times 10^{5+3} = 6 \times 10^8$ km.'
          - problem: 'One hard drive stores $4 \times 10^{12}$ bytes. How many bytes can $2 \times 10^3$ such drives store?'
            answer: "8*10^15"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the capacity of one drive by the number of drives. That gives $(4 \cdot 2) \times 10^{12+3} = 8 \times 10^{15}$ bytes.'
          - problem: 'Find the product $(3 \times 10^{-4})(3 \times 10^6)$.'
            answer: "9*10^2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the coefficients: $3 \cdot 3 = 9$. Add the exponents: $10^{-4+6} = 10^2$, so the product is $9 \times 10^2$.'
          - problem: 'A sheet of paper is $1.2 \times 10^{-4}$ m thick. How tall is a stack of $5 \times 10^2$ sheets?'
            answer: "6*10^-2"
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The height is the thickness times the number of sheets. That is $(1.2 \cdot 5) \times 10^{-4+2} = 6 \times 10^{-2}$ m.'
          - problem: 'Compute $(4 \times 10^2)(2 \times 10^3)$.'
            answer: "8*10^5"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the coefficients: $4 \cdot 2 = 8$. Add the exponents: $10^{2+3} = 10^5$, so the product is $8 \times 10^5$.'
        constraints: "multiply coefficients, add exponents"
      - id: kp2
        name: "Divide in scientific notation"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Compute $\frac{8 \times 10^5}{2 \times 10^2}$.'
            answer: "4*10^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $\frac{8}{2} = 4$. Subtract the exponents: $10^{5-2} = 10^3$, so the quotient is $4 \times 10^3$.'
          - problem: 'What is $\frac{9 \times 10^3}{3 \times 10^5}$?'
            answer: "3*10^-2"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $\frac{9}{3} = 3$. Subtract the exponents: $10^{3-5} = 10^{-2}$, so the quotient is $3 \times 10^{-2}$.'
          - problem: 'The mass of Earth is about $6 \times 10^{24}$ kg, and the mass of the Moon is about $7.5 \times 10^{22}$ kg. How many times the mass of the Moon is the mass of Earth?'
            answer: "80"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the two masses: $\frac{6 \times 10^{24}}{7.5 \times 10^{22}} = 0.8 \times 10^{2}$. That is $80$, so Earth has about $80$ times the mass of the Moon.'
          - problem: 'Light travels about $3 \times 10^5$ km each second, and the Sun is about $1.5 \times 10^8$ km from Earth. How many seconds does sunlight take to reach Earth?'
            answer: "500"
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'Time is distance divided by speed: $\frac{1.5 \times 10^8}{3 \times 10^5} = 0.5 \times 10^3$. That is $500$ seconds.'
          - problem: 'A country of $5 \times 10^7$ people uses $2 \times 10^{10}$ litres of water each day. On average, how many litres does one person use each day?'
            answer: "400"
            answer_contract: {"kind":"unit","quantity":"volume","unit":"litre","allow_omitted":true}
            solution_sketch: 'Share the total among the people: $\frac{2 \times 10^{10}}{5 \times 10^7} = 0.4 \times 10^3$. That is $400$ litres per person.'
          - problem: 'Find the quotient $\frac{9 \times 10^7}{3 \times 10^4}$.'
            answer: "3*10^3"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the coefficients: $\frac{9}{3} = 3$. Subtract the exponents: $10^{7-4} = 10^3$, so the quotient is $3 \times 10^3$.'
          - problem: 'A red blood cell is about $8 \times 10^{-6}$ m wide. How many red blood cells placed side by side would span $4 \times 10^{-2}$ m?'
            answer: "5000"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Divide the length by the width of one cell: $\frac{4 \times 10^{-2}}{8 \times 10^{-6}} = 0.5 \times 10^4$. That is $5000$ cells.'
          - problem: 'Nia computes $\frac{6 \times 10^8}{2 \times 10^2}$ as $3 \times 10^4$. What is the correct quotient?'
            answer: "3*10^6"
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Dividing subtracts the exponents, so $10^{8-2} = 10^6$ and $\frac{6}{2} = 3$. The quotient is $3 \times 10^6$.'
        constraints: "divide coefficients, subtract exponents"
      - id: kp3
        name: "Renormalize the result"
        key_prerequisites: [scientific-notation-conversion]
        exemplars:
          - problem: 'Write $(4 \times 10^3)(5 \times 10^4)$ in scientific notation.'
            answer: "2*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The product is $20 \times 10^7$. Since $20 = 2 \times 10$, it equals $2 \times 10^8$.'
          - problem: 'Write $\frac{2 \times 10^2}{8 \times 10^5}$ in scientific notation.'
            answer: "2.5*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The quotient is $0.25 \times 10^{-3}$. Since $0.25 = 2.5 \times 10^{-1}$, it equals $2.5 \times 10^{-4}$.'
          - problem: 'A beach holds about $8 \times 10^6$ grains of sand in each cubic metre and contains $5 \times 10^4$ cubic metres of sand. About how many grains of sand are on the beach? Write the result in scientific notation.'
            answer: "4*10^11"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Multiply grains per cubic metre by cubic metres: $(8 \cdot 5) \times 10^{6+4} = 40 \times 10^{10}$. Renormalized, that is $4 \times 10^{11}$ grains.'
          - problem: 'The Milky Way contains about $2 \times 10^{11}$ stars, and a star cluster contains about $8 \times 10^2$ stars. How many times as many stars does the Milky Way contain? Write the result in scientific notation.'
            answer: "2.5*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Divide the two star counts: $\frac{2 \times 10^{11}}{8 \times 10^2} = 0.25 \times 10^9$. Renormalized, that is $2.5 \times 10^8$ times as many.'
          - problem: 'Ali writes $(5 \times 10^4)(6 \times 10^3)$ as $30 \times 10^7$ and then as $3 \times 10^6$. What is the correct scientific notation for the product?'
            answer: "3*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The product $30 \times 10^7$ is right. Since $30 = 3 \times 10$, the exponent goes up by one: $3 \times 10^8$.'
          - problem: 'Write $(6 \times 10^3)(4 \times 10^4)$ in scientific notation.'
            answer: "2.4*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The product is $24 \times 10^7$. Since $24 = 2.4 \times 10$, it equals $2.4 \times 10^8$.'
          - problem: 'Write $\frac{3 \times 10^2}{6 \times 10^5}$ in scientific notation.'
            answer: "5*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The quotient is $0.5 \times 10^{-3}$. Since $0.5 = 5 \times 10^{-1}$, it equals $5 \times 10^{-4}$.'
          - problem: 'A water molecule has a mass of about $3 \times 10^{-23}$ g. About how many water molecules are in a droplet of mass $1.5 \times 10^{-3}$ g? Write the result in scientific notation.'
            answer: "5*10^19"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Divide the droplet mass by the mass of one molecule: $\frac{1.5 \times 10^{-3}}{3 \times 10^{-23}} = 0.5 \times 10^{20}$. Renormalized, that is $5 \times 10^{19}$ molecules.'
        constraints: "coefficient must land back in [1, 10)"
    diagnostic_exemplar:
      problem: 'Write $(4 \times 10^2)(5 \times 10^5)$ in scientific notation.'
      answer: '2 x 10^8'
      solution_sketch: '$4 \times 5 = 20$ and $10^{2+5} = 10^7$; renormalize: $20 \times 10^7 = 2 \times 10^8$.'
    anki_seeds:
      - front: "Multiplying in scientific notation: coefficients are ___ and powers of 10 are ___"
        back: "multiplied; added (renormalize if the coefficient leaves [1, 10))"
        type: basic

  - id: scientific-notation-addition-subtraction
    name: "Adding and Subtracting in Scientific Notation"
    core: false                # format-specific arithmetic drill; the notation stays core
    difficulty: 0.48
    drill: false
    answer_kind: expression
    expected_time_secs: 90
    prerequisites:
      - id: scientific-notation
        weight: 0.7
        key: true
      - id: decimal-operations
        weight: 0.5
        key: true
      - id: place-value
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Same power of 10"
        key_prerequisites: [decimal-operations]
        exemplars:
          - problem: 'What is $3.2 \times 10^4 + 4.5 \times 10^4$ in scientific notation?'
            answer: "7.7*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Both terms count units of $10^4$, so add the coefficients: $3.2 + 4.5 = 7.7$. The sum is $7.7 \times 10^4$.'
          - problem: 'A town has $3.4 \times 10^5$ residents north of the river and $2.1 \times 10^5$ residents south of it. How many residents does the town have in all, in scientific notation?'
            answer: "5.5*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The total is the sum of the two groups, and both count units of $10^5$. So $3.4 + 2.1 = 5.5$ and the town has $5.5 \times 10^5$ residents.'
          - problem: 'What is $8 \times 10^3 - 2 \times 10^3$ in scientific notation?'
            answer: "6*10^3"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Both terms count units of $10^3$, so subtract the coefficients: $8 - 2 = 6$. The difference is $6 \times 10^3$.'
          - problem: 'A library holds $9.6 \times 10^5$ books and $3.5 \times 10^5$ of them are on loan. How many books are on the shelves, in scientific notation?'
            answer: "6.1*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The books on the shelves are the total minus the books on loan, and both count units of $10^5$. So $9.6 - 3.5 = 6.1$ and the shelves hold $6.1 \times 10^5$ books.'
          - problem: 'Subtract $5 \times 10^4$ from $9 \times 10^4$. What is the result in scientific notation?'
            answer: "4*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Both terms count units of $10^4$, so subtract the coefficients: $9 - 5 = 4$. The result is $4 \times 10^4$.'
          - problem: 'Planet A has a mass of $8.7 \times 10^{24}$ kg and planet B has a mass of $3.1 \times 10^{24}$ kg. How many kilograms more massive is planet A, in scientific notation?'
            answer: "5.6*10^24"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The difference in mass is $8.7 \times 10^{24} - 3.1 \times 10^{24}$. Both terms count units of $10^{24}$, so $8.7 - 3.1 = 5.6$ and the difference is $5.6 \times 10^{24}$ kg.'
          - problem: 'Two ships carry $2.6 \times 10^6$ kg and $4.9 \times 10^6$ kg of grain. What is their total load, in scientific notation?'
            answer: "7.5*10^6"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The total load is the sum of the two loads, and both count units of $10^6$. So $2.6 + 4.9 = 7.5$ and the load is $7.5 \times 10^6$ kg.'
          - problem: 'What is $7.25 \times 10^{-3} - 2.5 \times 10^{-3}$ in scientific notation?'
            answer: "4.75*10^-3"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Both terms count units of $10^{-3}$, so subtract the coefficients: $7.25 - 2.5 = 4.75$. The difference is $4.75 \times 10^{-3}$.'
        constraints: "matching exponents; add or subtract coefficients only"
      - id: kp2
        name: "Different powers: match exponents first"
        key_prerequisites: [scientific-notation]
        try_first:
          problem: 'Written in full, $2 \times 10^5 + 7 \times 10^4$ is $200000 + 70000$. What is the sum?'
          answer_contract: {"kind":"exact"}
          answer: '270000'
          reveal: 'The sum $270000$ is $2.7 \times 10^5$. The term $7 \times 10^4$ had to be rewritten as $0.7 \times 10^5$ before its coefficient could be added to $2$.'
        exemplars:
          - problem: 'What is $5 \times 10^4 + 3 \times 10^3$ in scientific notation?'
            answer: "5.3*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Rewrite $3 \times 10^3$ as $0.3 \times 10^4$ so both terms use the same power. Then $5 + 0.3 = 5.3$ and the sum is $5.3 \times 10^4$.'
          - problem: 'What is $6.2 \times 10^5 - 4 \times 10^4$ in scientific notation?'
            answer: "5.8*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Rewrite $4 \times 10^4$ as $0.4 \times 10^5$ so both terms use the same power. Then $6.2 - 0.4 = 5.8$ and the difference is $5.8 \times 10^5$.'
          - problem: 'A city has $4 \times 10^5$ cars and $6 \times 10^4$ buses. How many vehicles is that in all, in scientific notation?'
            answer: "4.6*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The total is the sum of the cars and the buses. Rewrite $6 \times 10^4$ as $0.6 \times 10^5$, then $4 + 0.6 = 4.6$ and the city has $4.6 \times 10^5$ vehicles.'
          - problem: 'Subtract $5 \times 10^5$ from $7.5 \times 10^6$. What is the result in scientific notation?'
            answer: "7*10^6"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Rewrite $5 \times 10^5$ as $0.5 \times 10^6$ so both terms use the same power. Then $7.5 - 0.5 = 7$ and the result is $7 \times 10^6$.'
          - problem: 'One trail is $2.4 \times 10^3$ m long and another trail is $1.8 \times 10^4$ m long. How many metres longer is the second trail, in scientific notation?'
            answer: "1.56*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The difference in length is $1.8 \times 10^4 - 2.4 \times 10^3$. Rewrite $2.4 \times 10^3$ as $0.24 \times 10^4$, then $1.8 - 0.24 = 1.56$ and the second trail is $1.56 \times 10^4$ m longer.'
          - problem: 'A bag holds $7 \times 10^2$ g of flour and a sack holds $2.5 \times 10^3$ g. How many grams of flour do the bag and the sack hold together, in scientific notation?'
            answer: "3.2*10^3"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Rewrite $7 \times 10^2$ as $0.7 \times 10^3$ so both amounts use the same power. Then $0.7 + 2.5 = 3.2$ and together they hold $3.2 \times 10^3$ g.'
          - problem: 'Sam adds $3 \times 10^5 + 4 \times 10^4$ and writes $7 \times 10^9$. What is the correct sum in scientific notation?'
            answer: "3.4*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Sam added the coefficients and the exponents, but only terms with the same power of ten combine that way. Rewrite $4 \times 10^4$ as $0.4 \times 10^5$, so the sum is $3.4 \times 10^5$.'
          - problem: 'What is $2.5 \times 10^{-3} + 4 \times 10^{-4}$ in scientific notation?'
            answer: "2.9*10^-3"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Rewrite $4 \times 10^{-4}$ as $0.4 \times 10^{-3}$ so both terms use the same power. Then $2.5 + 0.4 = 2.9$ and the sum is $2.9 \times 10^{-3}$.'
        constraints: "rewrite the smaller-exponent term to match the larger exponent"
      - id: kp3
        name: "Renormalize after adding"
        key_prerequisites: [scientific-notation, decimal-operations]
        exemplars:
          - problem: 'What is $9 \times 10^3 + 8 \times 10^3$ in scientific notation?'
            answer: "1.7*10^4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Add the coefficients: $9 + 8 = 17$, so the sum is $17 \times 10^3$. Move the decimal point one place left and raise the exponent by one to get $1.7 \times 10^4$.'
          - problem: 'What is $1.05 \times 10^6 - 9.5 \times 10^5$ in scientific notation?'
            answer: "1*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Rewrite $1.05 \times 10^6$ as $10.5 \times 10^5$ so both terms use the same power. Then $10.5 - 9.5 = 1$ and the difference is $1 \times 10^5$.'
          - problem: 'A stadium sells $7 \times 10^4$ tickets in week one and $6 \times 10^4$ tickets in week two. How many tickets is that in all, in scientific notation?'
            answer: "1.3*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The total is the sum of the two weeks, and $7 + 6 = 13$ gives $13 \times 10^4$. Moving the decimal point one place left and raising the exponent gives $1.3 \times 10^5$ tickets.'
          - problem: 'Subtract $8 \times 10^4$ from $2 \times 10^5$. What is the result in scientific notation?'
            answer: "1.2*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Rewrite $2 \times 10^5$ as $20 \times 10^4$, so $20 - 8 = 12$ and the difference is $12 \times 10^4$. Moving the decimal point one place left and raising the exponent gives $1.2 \times 10^5$.'
          - problem: 'A reservoir holds $5 \times 10^6$ litres. After a dry spell it holds $4.5 \times 10^6$ litres. How many litres were lost, in scientific notation?'
            answer: "5*10^5"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The water lost is $5 \times 10^6 - 4.5 \times 10^6$, so $5 - 4.5 = 0.5$ and the difference is $0.5 \times 10^6$. Moving the decimal point one place right and lowering the exponent gives $5 \times 10^5$ litres.'
          - problem: 'A farm collects $8.4 \times 10^5$ eggs in spring and $7.9 \times 10^5$ eggs in summer. How many eggs is that in all, in scientific notation?'
            answer: "1.63*10^6"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'The total is the sum of the two seasons, and $8.4 + 7.9 = 16.3$ gives $16.3 \times 10^5$. Moving the decimal point one place left and raising the exponent gives $1.63 \times 10^6$ eggs.'
          - problem: 'Sam adds $6.5 \times 10^7 + 5 \times 10^7$ and writes $11.5 \times 10^7$. What is the sum in scientific notation?'
            answer: "1.15*10^8"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Sam added correctly, but the coefficient $11.5$ is not below $10$. Moving the decimal point one place left and raising the exponent from $7$ to $8$ gives $1.15 \times 10^8$.'
          - problem: 'What is $3.7 \times 10^{-2} + 8.6 \times 10^{-2}$ in scientific notation?'
            answer: "1.23*10^-1"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Add the coefficients: $3.7 + 8.6 = 12.3$, so the sum is $12.3 \times 10^{-2}$. Moving the decimal point one place left raises the exponent to $-1$, giving $1.23 \times 10^{-1}$.'
          - problem: 'What is $1 \times 10^{-3} - 4 \times 10^{-4}$ in scientific notation?'
            answer: "6*10^-4"
            answer_contract: {"kind":"required_normalized_scientific_notation"}
            solution_sketch: 'Rewrite $1 \times 10^{-3}$ as $10 \times 10^{-4}$, so $10 - 4 = 6$. The difference is $6 \times 10^{-4}$.'
        constraints: "coefficient must land back in [1, 10)"
    diagnostic_exemplar:
      problem: 'Compute $9.5 \times 10^4 + 8 \times 10^3$ in proper scientific notation.'
      answer: '1.03 x 10^5'
      solution_sketch: '$95\,000 + 8000 = 103\,000 = 1.03 \times 10^5$.'
    anki_seeds:
      - front: "Before adding numbers in scientific notation you must ..."
        back: "rewrite them with the same power of 10"
        type: basic

