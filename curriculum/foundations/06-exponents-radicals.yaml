        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Find the hypotenuse"
        key_prerequisites: [evaluating-expressions]
        exemplars:
          - problem: 'A right triangle has legs $3$ and $4$. Find the hypotenuse.'
            answer: "5"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{9 + 16} = \sqrt{25} = 5$.'
          - problem: 'The legs of a right triangle are $6$ and $8$. What is the hypotenuse?'
            answer: "10"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{36 + 64} = \sqrt{100} = 10$.'
          - problem: 'A right triangle''s legs measure $5$ and $12$. Find its hypotenuse.'
            answer: "13"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\sqrt{25 + 144} = \sqrt{169} = 13$.'
          - problem: 'Given legs $9$ and $12$ on a right triangle, what is the hypotenuse?'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\sqrt{81 + 144} = \sqrt{225} = 15$.'
        constraints: "c = sqrt(a^2 + b^2); perfect-square results"
      - id: kp2
        name: "Find a missing leg"
        key_prerequisites: [square-roots]
        exemplars:
          - problem: 'A right triangle has hypotenuse $13$ and one leg $5$. Find the other leg.'
            answer: "12"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{169 - 25} = \sqrt{144} = 12$.'
          - problem: 'The hypotenuse of a right triangle is $10$ and one leg is $6$. What is the other leg?'
            answer: "8"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{100 - 36} = \sqrt{64} = 8$.'
          - problem: 'A right triangle''s hypotenuse measures $17$ with one leg $8$. Find the other leg.'
            answer: "15"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\sqrt{289 - 64} = \sqrt{225} = 15$.'
          - problem: 'Given hypotenuse $15$ and one leg $9$ on a right triangle, what is the other leg?'
            answer: "12"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\sqrt{225 - 81} = \sqrt{144} = 12$.'
        constraints: "leg = sqrt(c^2 - a^2)"
      - id: kp3
        name: "Non-perfect-square answers"
        key_prerequisites: [simplifying-radicals]
        exemplars:
          - problem: 'A right triangle has legs $2$ and $3$. Find the hypotenuse.'
            answer: "sqrt(13)"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{4 + 9} = \sqrt{13}$.'
          - problem: 'The legs of a right triangle are $4$ and $4$. What is the hypotenuse?'
            answer: "4*sqrt(2)"
            answer_contract: {kind: exact}
            solution_sketch: '$\sqrt{16 + 16} = \sqrt{32} = 4\sqrt{2}$.'
          - problem: 'A right triangle''s legs measure $1$ and $2$. Find its hypotenuse.'
            answer: "sqrt(5)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\sqrt{1 + 4} = \sqrt{5}$.'
          - problem: 'Given legs $5$ and $5$ on a right triangle, what is the hypotenuse?'
            answer: "5*sqrt(2)"
            answer_contract: {"kind":"exact"}
            solution_sketch: '$\sqrt{25 + 25} = \sqrt{50} = 5\sqrt{2}$.'
        constraints: "leave the answer as a simplified radical"
    diagnostic_exemplar:
      problem: 'A right triangle has hypotenuse $7$ and one leg $5$. Find the other leg.'
      answer: '2*sqrt(6)'
      solution_sketch: '$\sqrt{7^2 - 5^2} = \sqrt{24} = 2\sqrt{6}$.'
    anki_seeds:
      - front: "Pythagorean theorem for a right triangle with legs a, b and hypotenuse c:"
        back: "a^2 + b^2 = c^2"
        type: basic

