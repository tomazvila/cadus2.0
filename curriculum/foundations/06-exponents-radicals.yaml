unit: exponents-radicals
course: foundations
module: "Exponents & Radicals"
topics:
  - id: exponent-product-rule
    name: "The Product Rule for Exponents"
    core: true
    difficulty: 0.30
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: integer-exponents-intro
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Multiply powers of the same base"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $x^3 \cdot x^4$.'
            answer: "x^7"
            solution_sketch: 'Add exponents: $3 + 4 = 7$.'
          - problem: 'Simplify $a^5 \cdot a^2$.'
            answer: "a^7"
            solution_sketch: '$5 + 2 = 7$.'
          - problem: 'Simplify $b^2 \cdot b^6$.'
            answer: "b^8"
            solution_sketch: '$2 + 6 = 8$.'
          - problem: 'Simplify $p^5 \cdot p^4$.'
            answer: "p^9"
            solution_sketch: '$5 + 4 = 9$.'
        constraints: "same base; positive integer exponents; add exponents"
      - id: kp2
        name: "Numeric bases left in exponent form"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Write $2^3 \cdot 2^4$ as a single power of $2$.'
            answer: "2^7"
            solution_sketch: '$3 + 4 = 7$.'
          - problem: 'What single power of $5$ equals $5^2 \cdot 5^3$?'
            answer: "5^5"
            solution_sketch: '$2 + 3 = 5$.'
          - problem: 'Simplify $3^4 \cdot 3^2$ and write the result as $3$ raised to one exponent.'
            answer: "3^6"
            solution_sketch: '$4 + 2 = 6$.'
          - problem: '$7^3 \cdot 7^3$ equals $7$ raised to what power?'
            answer: "7^6"
            solution_sketch: '$3 + 3 = 6$.'
        constraints: "answer stays as a single power, not evaluated"
      - id: kp3
        name: "Three or more factors, including bare bases"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $x \cdot x^3 \cdot x^2$.'
            answer: "x^6"
            solution_sketch: 'A bare $x$ is $x^1$; $1 + 3 + 2 = 6$.'
          - problem: 'Simplify $y^2 \cdot y \cdot y^4$.'
            answer: "y^7"
            solution_sketch: '$2 + 1 + 4 = 7$.'
          - problem: 'Simplify $a^3 \cdot a \cdot a^2$.'
            answer: "a^6"
            solution_sketch: 'A bare $a$ is $a^1$; $3 + 1 + 2 = 6$.'
          - problem: 'Simplify $m \cdot m^4 \cdot m^3$.'
            answer: "m^8"
            solution_sketch: 'A bare $m$ is $m^1$; $1 + 4 + 3 = 8$.'
        constraints: "treat a bare base as exponent 1"
    diagnostic_exemplar:
      problem: 'Simplify $x \cdot x^3 \cdot x^5$.'
      answer: 'x^9'
      solution_sketch: 'A bare base counts as exponent $1$: $1 + 3 + 5 = 9$.'
    anki_seeds:
      - front: "Product rule: a^m * a^n = ?"
        back: "a^(m+n)"
        type: basic

  - id: exponent-quotient-rule
    name: "The Quotient Rule for Exponents"
    core: true
    difficulty: 0.32
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: integer-exponents-intro
        weight: 0.7
        key: true
      - id: integer-addition-subtraction
        weight: 0.5
        key: true
      - id: exponent-product-rule
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Divide powers of the same base"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $\frac{x^8}{x^3}$.'
            answer: "x^5"
            solution_sketch: 'Subtract exponents: $8 - 3 = 5$.'
          - problem: 'Simplify $\frac{y^6}{y^2}$.'
            answer: "y^4"
            solution_sketch: '$6 - 2 = 4$.'
          - problem: 'Simplify $\frac{a^9}{a^4}$.'
            answer: "a^5"
            solution_sketch: '$9 - 4 = 5$.'
          - problem: 'Simplify $\frac{b^7}{b^3}$.'
            answer: "b^4"
            solution_sketch: '$7 - 3 = 4$.'
        constraints: "same base; larger exponent on top; subtract exponents"
      - id: kp2
        name: "Numeric bases left in exponent form"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Write $\frac{3^5}{3^2}$ as a single power of $3$.'
            answer: "3^3"
            solution_sketch: '$5 - 2 = 3$.'
          - problem: 'What single power of $7$ equals $\frac{7^6}{7^5}$?'
            answer: "7^1"
            solution_sketch: '$6 - 5 = 1$.'
          - problem: 'Simplify $\frac{5^7}{5^3}$ and write the result as $5$ raised to one exponent.'
            answer: "5^4"
            solution_sketch: '$7 - 3 = 4$.'
          - problem: '$\frac{2^9}{2^6}$ equals $2$ raised to what power?'
            answer: "2^3"
            solution_sketch: '$9 - 6 = 3$.'
        constraints: "answer stays as a single power, not evaluated"
      - id: kp3
        name: "Quotients that leave exponent 1, and bare bases"
        key_prerequisites: [integer-addition-subtraction]
        exemplars:
          - problem: 'Simplify $\frac{y^5}{y^4}$.'
            answer: "y"
            solution_sketch: '$y^{5-4} = y^1 = y$.'
          - problem: 'Simplify $\frac{x^6}{x}$.'
            answer: "x^5"
            solution_sketch: 'A bare $x$ is $x^1$; $6 - 1 = 5$.'
          - problem: 'Simplify $\frac{a^8}{a^7}$.'
            answer: "a"
            solution_sketch: '$a^{8-7} = a^1 = a$.'
          - problem: 'Simplify $\frac{b^9}{b}$.'
            answer: "b^8"
            solution_sketch: 'A bare $b$ is $b^1$; $9 - 1 = 8$.'
        constraints: "treat a bare base as exponent 1; keep results with positive exponents"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{x^7}{x}$.'
      answer: 'x^6'
      solution_sketch: 'The bare $x$ counts as exponent $1$: $7 - 1 = 6$.'
    anki_seeds:
      - front: "Quotient rule: a^m / a^n = ?"
        back: "a^(m-n)"
        type: basic

  - id: exponent-product-quotient-rules
    name: "Product and Quotient Rules for Exponents"
    core: true
    difficulty: 0.35
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: exponent-product-rule
        weight: 0.8
        key: true
      - id: exponent-quotient-rule
        weight: 0.8
        key: true
      - id: integer-multiplication-division
        weight: 0.5
      - id: evaluating-expressions
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: "Product and quotient rules together"
        key_prerequisites: [exponent-product-rule, exponent-quotient-rule]
        exemplars:
          - problem: 'Simplify $\frac{x^5 \cdot x^2}{x^3}$.'
            answer: "x^4"
            solution_sketch: '$5 + 2 - 3 = 4$.'
          - problem: 'Simplify $\frac{a^4 \cdot a^4}{a^6}$.'
            answer: "a^2"
            solution_sketch: '$4 + 4 - 6 = 2$.'
          - problem: 'Simplify $\frac{b^6 \cdot b^3}{b^5}$.'
            answer: "b^4"
            solution_sketch: '$6 + 3 - 5 = 4$.'
          - problem: 'Simplify $\frac{m^8 \cdot m}{m^5}$.'
            answer: "m^4"
            solution_sketch: 'A bare $m$ is $m^1$; $8 + 1 - 5 = 4$.'
        constraints: "one product and one quotient step per problem"
      - id: kp2
        name: "Coefficients with product/quotient rules"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Simplify $(3x^2)(4x^5)$.'
            answer: "12x^7"
            solution_sketch: '$3 \cdot 4 = 12$; add exponents $2 + 5 = 7$.'
          - problem: 'Simplify $\frac{15a^7}{5a^4}$.'
            answer: "3a^3"
            solution_sketch: '$\frac{15}{5} = 3$; subtract exponents $7 - 4 = 3$.'
          - problem: 'What is $(2x^3)(5x^4)$ in simplest form?'
            answer: "10x^7"
            solution_sketch: '$2 \cdot 5 = 10$; add exponents $3 + 4 = 7$.'
          - problem: 'Reduce $\frac{24a^8}{6a^3}$ to a single term.'
            answer: "4a^5"
            solution_sketch: '$\frac{24}{6} = 4$; subtract exponents $8 - 3 = 5$.'
        constraints: "multiply/divide coefficients; apply exponent rule to variables"
      - id: kp3
        name: "Two variables at once"
        key_prerequisites: [exponent-product-rule, exponent-quotient-rule]
        exemplars:
          - problem: 'Simplify $(x^2 y^3)(x^4 y)$.'
            answer: "x^6 y^4"
            solution_sketch: 'Handle each base separately: $x^{2+4}$, $y^{3+1}$.'
          - problem: 'Simplify $\frac{a^5 b^3}{a^2 b}$.'
            answer: "a^3 b^2"
            solution_sketch: 'Handle each base separately: $a^{5-2}$, $b^{3-1}$.'
          - problem: 'Simplify $(x^3 y^2)(x^2 y^4)$.'
            answer: "x^5 y^6"
            solution_sketch: 'Handle each base separately: $x^{3+2}$, $y^{2+4}$.'
          - problem: 'Simplify $\frac{a^6 b^5}{a^3 b^2}$.'
            answer: "a^3 b^3"
            solution_sketch: 'Handle each base separately: $a^{6-3}$, $b^{5-2}$.'
        constraints: "apply the rules base by base"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{(2x^3y)(6xy^2)}{4x^2y}$.'
      answer: '3x^2 y^2'
      solution_sketch: '$\frac{12x^4y^3}{4x^2y} = 3x^2y^2$.'
    anki_seeds:
      - front: "Simplifying (3x^2)(4x^5): the coefficients are ___ and the exponents are ___"
        back: "multiplied (3*4 = 12); added (2 + 5 = 7)"
        type: basic

  - id: power-of-a-power-rule
    name: "Power of a Power"
    core: true
    difficulty: 0.36
    drill: true
    answer_kind: expression
    expected_time_secs: 45
    prerequisites:
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.5
        key: true
      - id: integer-exponents-intro
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: "Multiply the exponents"
        key_prerequisites: [integer-multiplication-division]
        exemplars:
          - problem: 'Simplify $(x^3)^4$.'
            answer: "x^12"
            solution_sketch: 'Multiply exponents: $3 \cdot 4 = 12$.'
          - problem: 'Simplify $(a^5)^2$.'
            answer: "a^10"
            solution_sketch: '$5 \cdot 2 = 10$.'
          - problem: 'Simplify $(b^2)^6$.'
            answer: "b^12"
            solution_sketch: '$2 \cdot 6 = 12$.'
          - problem: 'Simplify $(m^3)^5$.'
            answer: "m^15"
            solution_sketch: '$3 \cdot 5 = 15$.'
        constraints: "single variable base; multiply the exponents"
      - id: kp2
        name: "Numeric bases left in exponent form"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Write $(2^2)^3$ as a single power of $2$.'
            answer: "2^6"
            solution_sketch: '$2 \cdot 3 = 6$.'
          - problem: 'What single power of $10$ equals $(10^3)^2$?'
            answer: "10^6"
            solution_sketch: '$3 \cdot 2 = 6$.'
          - problem: 'Simplify $(3^2)^4$ and write the result as $3$ raised to one exponent.'
            answer: "3^8"
            solution_sketch: '$2 \cdot 4 = 8$.'
          - problem: '$(5^3)^3$ equals $5$ raised to what power?'
            answer: "5^9"
            solution_sketch: '$3 \cdot 3 = 9$.'
        constraints: "answer stays as a single power, not evaluated"
      - id: kp3
        name: "Combine with product and quotient rules"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $(x^2)^3 \cdot x^4$.'
            answer: "x^10"
            solution_sketch: '$x^6 \cdot x^4 = x^{10}$.'
          - problem: 'Simplify $\frac{(y^3)^3}{y^4}$.'
            answer: "y^5"
            solution_sketch: '$y^9 / y^4 = y^5$.'
          - problem: 'Simplify $(a^2)^4 \cdot a^3$.'
            answer: "a^11"
            solution_sketch: '$a^8 \cdot a^3 = a^{11}$.'
          - problem: 'Simplify $\frac{(b^4)^2}{b^5}$.'
            answer: "b^3"
            solution_sketch: '$b^8 / b^5 = b^3$.'
        constraints: "power of a power first, then product/quotient rule"
    diagnostic_exemplar:
      problem: 'Simplify $\frac{(x^4)^2}{x^3}$.'
      answer: 'x^5'
      solution_sketch: '$(x^4)^2 = x^8$, then $8 - 3 = 5$.'
    anki_seeds:
      - front: "Power of a power: (a^m)^n = ?"
        back: "a^(m*n)"
        type: basic

  - id: power-rule-exponents
    name: "Power Rules for Exponents"
    core: true
    difficulty: 0.40
    drill: false
    answer_kind: expression
    expected_time_secs: 55
    prerequisites:
      - id: power-of-a-power-rule
        weight: 0.7
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-multiplication-division
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Power of a product"
        key_prerequisites: [power-of-a-power-rule]
        exemplars:
          - problem: 'Simplify $(2x)^3$.'
            answer: "8x^3"
            solution_sketch: '$2^3 = 8$; $x^3$.'
          - problem: 'Simplify $(3a^2)^2$.'
            answer: "9a^4"
            solution_sketch: '$3^2 = 9$; $(a^2)^2 = a^4$.'
          - problem: 'Simplify $(2x^2)^3$.'
            answer: "8x^6"
            solution_sketch: '$2^3 = 8$; $(x^2)^3 = x^6$.'
          - problem: 'Simplify $(4a)^2$.'
            answer: "16a^2"
            solution_sketch: '$4^2 = 16$; $a^2$.'
        constraints: "raise each factor to the power"
      - id: kp2
        name: "Power of a quotient"
        key_prerequisites: [power-of-a-power-rule]
        exemplars:
          - problem: 'Simplify $(x^2 / y)^3$.'
            answer: "x^6 / y^3"
            solution_sketch: 'Raise numerator and denominator to the power: $x^{2 \cdot 3}/y^3$.'
          - problem: 'Simplify $(2 / x^3)^2$.'
            answer: "4 / x^6"
            solution_sketch: '$2^2 = 4$; $(x^3)^2 = x^6$.'
          - problem: 'Simplify $(a / b^2)^3$.'
            answer: "a^3 / b^6"
            solution_sketch: 'Raise numerator and denominator to the power: $a^3/b^{2 \cdot 3}$.'
          - problem: 'What is $(3 / x^2)^2$ in simplest form?'
            answer: "9 / x^4"
            solution_sketch: '$3^2 = 9$; $(x^2)^2 = x^4$.'
        constraints: "raise numerator and denominator to the power"
      - id: kp3
        name: "Combinations of power rules"
        key_prerequisites: [exponent-product-quotient-rules, power-of-a-power-rule]
        exemplars:
          - problem: 'Simplify $(2x^3)^2 \cdot x$.'
            answer: "4x^7"
            solution_sketch: '$(2x^3)^2 = 4x^6$; times $x = 4x^7$.'
          - problem: 'Simplify $(3x^2)^2 (2x)$.'
            answer: "18x^5"
            solution_sketch: '$9x^4 \cdot 2x = 18x^5$.'
          - problem: 'Simplify $(2x^2)^2 \cdot x^3$.'
            answer: "4x^7"
            solution_sketch: '$(2x^2)^2 = 4x^4$; times $x^3 = 4x^7$.'
          - problem: 'Simplify $(3x)^2(2x^2)$.'
            answer: "18x^4"
            solution_sketch: '$(3x)^2 = 9x^2$; $9x^2 \cdot 2x^2 = 18x^4$.'
        constraints: "power rules first, then product rule; small coefficients"
    diagnostic_exemplar:
      problem: 'Simplify $(2x^2)^3 \cdot x^2$.'
      answer: '8x^8'
      solution_sketch: '$(2x^2)^3 = 8x^6$, then $8x^6 \cdot x^2 = 8x^8$.'
    anki_seeds:
      - front: "Power of a product: (a*b)^n = ?"
        back: "a^n * b^n"
        type: basic
      - front: "Power of a quotient: (a/b)^n = ?"
        back: "a^n / b^n"
        type: basic

  - id: zero-exponent-rule
    name: "The Zero Exponent"
    core: true
    difficulty: 0.36
    drill: false
    answer_kind: numeric
    expected_time_secs: 45
    prerequisites:
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: integer-exponents-intro
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Evaluate a nonzero base to the zero power"
        key_prerequisites: [integer-exponents-intro]
        exemplars:
          - problem: 'Simplify $5^0$.'
            answer: "1"
            solution_sketch: '$5^0 = 1$ for any nonzero base.'
          - problem: 'Simplify $(-4)^0$.'
            answer: "1"
            solution_sketch: '$(-4)^0 = 1$; the base is nonzero, so its sign does not matter here.'
          - problem: 'What does $8^0$ equal?'
            answer: "1"
            solution_sketch: '$8^0 = 1$ since $8 \ne 0$.'
          - problem: 'What does $(-11)^0$ equal?'
            answer: "1"
            solution_sketch: '$(-11)^0 = 1$ since the base is nonzero.'
        constraints: "any nonzero base to the 0 power is 1"
      - id: kp2
        name: "Zero exponents inside expressions"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $(3x)^0$ for $x \ne 0$.'
            answer: "1"
            solution_sketch: 'The whole base $3x$ is nonzero and raised to the $0$ power: $1$.'
          - problem: 'Simplify $3x^0$ for $x \ne 0$.'
            answer: "3"
            solution_sketch: 'Only $x$ carries the exponent: $3 \cdot 1 = 3$.'
          - problem: 'What is $(5x)^0$ for $x \ne 0$?'
            answer: "1"
            solution_sketch: 'The whole base $5x$ is nonzero and raised to the $0$ power: $1$.'
          - problem: 'What is $7x^0$ for $x \ne 0$?'
            answer: "7"
            solution_sketch: 'Only $x$ carries the exponent: $7 \cdot 1 = 7$.'
        constraints: "contrast (ax)^0 with a*x^0"
      - id: kp3
        name: "Why it works: the quotient rule"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Use the quotient rule to write $\frac{x^5}{x^5}$ as a single power of $x$. What is that power worth for $x \ne 0$?'
            answer: "1"
            solution_sketch: '$x^{5-5} = x^0$; but any nonzero number divided by itself is $1$, so $x^0 = 1$.'
          - problem: 'Compute $2^0 + 3^0$.'
            answer: "2"
            solution_sketch: '$2^0 = 1$ and $3^0 = 1$; $1 + 1 = 2$.'
          - problem: 'Use the quotient rule to write $\frac{y^3}{y^3}$ as a single power of $y$. What is that power worth for $y \ne 0$?'
            answer: "1"
            solution_sketch: '$y^{3-3} = y^0$; and $y^3/y^3 = 1$, so $y^0 = 1$.'
          - problem: 'What is $4^0 + 5^0$?'
            answer: "2"
            solution_sketch: '$4^0 = 1$ and $5^0 = 1$; $1 + 1 = 2$.'
        constraints: "connect a^0 = 1 to a^n / a^n"
    diagnostic_exemplar:
      problem: 'Evaluate $5x^0 + (3x)^0$ for $x \ne 0$.'
      answer: '6'
      solution_sketch: '$5x^0 = 5$ but $(3x)^0 = 1$, so $5 + 1 = 6$.'
    anki_seeds:
      - front: "Any nonzero base to the zero power equals ..."
        back: "1"
        type: basic

  - id: negative-zero-exponents
    name: "Negative and Zero Exponents"
    core: true
    difficulty: 0.42
    drill: false
    answer_kind: expression
    expected_time_secs: 60
    prerequisites:
      - id: zero-exponent-rule
        weight: 0.6
        key: true
      - id: exponent-product-quotient-rules
        weight: 0.6
        key: true
      - id: power-rule-exponents
        weight: 0.3
      - id: dividing-fractions
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: "Negative exponent as a reciprocal"
        key_prerequisites: [dividing-fractions]
        exemplars:
          - problem: 'Write $2^{-3}$ as a fraction.'
            answer: "1/8"
            solution_sketch: '$\frac{1}{2^3} = \frac{1}{8}$.'
          - problem: 'Rewrite $x^{-2}$ with a positive exponent.'
            answer: "1/x^2"
            solution_sketch: '$x^{-2} = \frac{1}{x^2}$.'
          - problem: 'Express $3^{-2}$ as a fraction.'
            answer: "1/9"
            solution_sketch: '$\frac{1}{3^2} = \frac{1}{9}$.'
          - problem: 'Rewrite $y^{-4}$ with a positive exponent.'
            answer: "1/y^4"
            solution_sketch: '$y^{-4} = \frac{1}{y^4}$.'
        constraints: "a^-n = 1/a^n"
      - id: kp2
        name: "Negative exponents in denominators"
        key_prerequisites: [dividing-fractions]
        exemplars:
          - problem: 'Rewrite $\frac{1}{x^{-3}}$ with a positive exponent.'
            answer: "x^3"
            solution_sketch: 'Dividing by $\frac{1}{x^3}$ multiplies by $x^3$.'
          - problem: 'Write $\left(\frac{2}{3}\right)^{-1}$ as a fraction.'
            answer: "3/2"
            solution_sketch: '$(a/b)^{-1} = b/a$, so $(2/3)^{-1} = 3/2$.'
          - problem: 'Rewrite $\frac{1}{y^{-4}}$ with a positive exponent.'
            answer: "y^4"
            solution_sketch: 'Dividing by $\frac{1}{y^4}$ multiplies by $y^4$.'
          - problem: 'Express $\left(\frac{3}{5}\right)^{-1}$ as a fraction.'
            answer: "5/3"
            solution_sketch: '$(a/b)^{-1} = b/a$: $\frac{5}{3}$.'
        constraints: "a^-n in a denominator moves up as a^n; (a/b)^-1 = b/a"
      - id: kp3
        name: "Combine with exponent rules"
        key_prerequisites: [exponent-product-quotient-rules]
        exemplars:
          - problem: 'Simplify $x^3 \cdot x^{-5}$ and write with a positive exponent.'
            answer: "1/x^2"
            solution_sketch: '$x^{3-5} = x^{-2} = \frac{1}{x^2}$.'
          - problem: 'Simplify $3x^{-2} \cdot x^5$.'
            answer: "3x^3"
            solution_sketch: '$3 \cdot x^{-2+5} = 3x^3$.'
          - problem: 'Simplify $y^4 \cdot y^{-6}$ and write with a positive exponent.'
            answer: "1/y^2"
            solution_sketch: '$y^{4-6} = y^{-2} = \frac{1}{y^2}$.'
          - problem: 'What is $2x^{-3} \cdot x^7$ in simplest form?'
            answer: "2x^4"
            solution_sketch: '$2 \cdot x^{-3+7} = 2x^4$.'
        constraints: "combine exponents first, then rewrite negatives as reciprocals"
    diagnostic_exemplar:
      problem: 'Simplify $x^2 \cdot x^{-5}$ and write with a positive exponent.'
      answer: "1/x^3"
      solution_sketch: '$x^{2-5} = x^{-3} = \frac{1}{x^3}$.'
    anki_seeds:
      - front: "Negative exponent rule: a^-n = ?"
        back: "1/a^n (the reciprocal)"
        type: basic
      - front: "1 / a^-n = ?"
