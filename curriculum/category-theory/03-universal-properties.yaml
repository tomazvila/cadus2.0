    knowledge_points:
      - id: kp1
        name: A universal property is an initial or terminal object
        key_prerequisites: [initial-terminal-objects, free-groups-presentations]
        constraints: "Name the auxiliary category (objects and morphisms) explicitly before locating the universal object; instances limited to terminal objects and the free group $F(S)$."
        exemplars:
          - problem: "The auxiliary category is a poset viewed as a category: its objects are the positive divisors of 30, namely 1, 2, 3, 5, 6, 10, 15, 30, and there is exactly one morphism from m to n precisely when m divides n. Find the terminal object of this auxiliary category."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The auxiliary category is the divisibility poset: objects are the divisors of 30 and morphisms are divisibility relations. Rule for terminal: an object T is terminal when every object has exactly one morphism into T, so T must be divisible by every divisor. The greatest divisor is 30, and each of 1, 2, 3, 5, 6, 10, 15 divides it. The terminal object is 30."
          - problem: "Build the auxiliary category for the free group on S = {a, b}: an object is a pair (G, f) where G is a group and f is a function from S to the underlying set of G, and a morphism from (G, f) to (H, g) is a group homomorphism h with h(f(s)) = g(s) for every s in S. The free group F(S) is the initial object of this auxiliary category. How many homomorphisms are there from F(S) to Z/2Z?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The auxiliary category has objects (G, f) with f a function from S = {a, b} to the underlying set of G, and homomorphisms compatible with these functions. Rule of initiality: F(S) initial means that homomorphisms from F(S) to a group G correspond exactly to functions from S to the underlying set of G, uniquely. Count the functions from a two-element set to the two-element group Z/2Z: 2 choices for a and 2 choices for b give 2 times 2. Each function gives exactly one homomorphism, so the answer is 4."
          - problem: "Work in the auxiliary category whose objects are pairs (G, f) with G a group and f a function from S = {x} to the underlying set of G, and whose morphisms from (G, f) to (H, g) are the homomorphisms h with h(f(x)) = g(x). The initial object is the free group F({x}) on the generator x. Let h be the unique morphism from (F({x}), eta) to the object where G is the group of integers under addition and f(x) = 4. Find h(x^3)."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The auxiliary category has objects (G, f) with f a function from the one-element set {x} to the underlying set of G, and the free group F({x}) is its initial object. Rule of the universal property: each choice of an image for the generator x gives exactly one homomorphism h to the integers. The chosen image is h(x) = 4, and additivity gives h(x^3) = h(x) + h(x) + h(x) = 4 + 4 + 4. The answer is 12."
          - problem: "Take the coslice auxiliary category built over the one-element set S = {p}: an object is a pair (X, f) where f is a function from S to a set X, and a morphism from (X, f) to (Y, g) is a function k from X to Y with k(f(p)) = g(p). Find the number of elements of the target set of the terminal object."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The auxiliary category is the coslice over S = {p}: objects are functions f from S to a set X, and morphisms are functions preserving the distinguished point. Rule for terminal: the terminal object receives exactly one morphism from every object. For the target (S, id), the only function from any X to the one-element set S is the constant one, and it preserves the point, so this morphism exists and is unique. The terminal object is the identity function on S, whose target set has one element. The answer is 1."
          - problem: "A student argues that if c is an initial object of a category, then c is also a terminal object. Step 1: c initial means that each object x has exactly one morphism from c to x. Step 2: c terminal would mean that each object x has exactly one morphism from x to c. Step 3: reverse the unique morphism from c to x to obtain a morphism from x to c. Step 4: the reversed morphism is the only morphism from x to c, so c is terminal. Which step is the first step that is not correct?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 states the definition of an initial object correctly: the unique morphism goes out of c. Step 2 states the definition of a terminal object correctly: the unique morphism comes into c. Step 3 is the first wrong step: a category does not allow reversing a morphism; in the poset of the numbers 1, 2, 3 with the order m to n when m is less than n, the arrow from 1 to 3 gives no arrow back. Step 4 would follow from Step 3, but it rests on the wrong reversal. The answer is Step 3."
          - problem: "Take the slice auxiliary category of sets over S = {1, 2, 3}: an object is a pair (A, f) where f is a function from a set A to S, and a morphism from (A, f) to (B, g) is a function k from A to B with g(k(a)) = f(a) for every a in A. Find the number of elements of the domain of the terminal object."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The auxiliary category is the slice over S = {1, 2, 3}: objects are functions f from a set A to S, and morphisms are functions k with f equal to the composite of g after k. Rule for terminal: try the object (S, id); a morphism k from (A, f) to (S, id) must satisfy the composite of id after k equal to f, so k = f, which exists and is unique. The terminal object is (S, id), whose domain S has 3 elements. The answer is 3."
          - problem: "Write the full proof: in the auxiliary category whose objects are pairs (G, f) of a group G and a function f from S to the underlying set of G, and whose morphisms from (G, f) to (H, g) are the homomorphisms h with h(f(s)) = g(s) for every s in S, the free group F(S) with its insertion eta is an initial object, and any two initial objects are related by a unique isomorphism; conclude that F(S) is unique up to a unique isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, name the auxiliary category: its objects are the pairs (G, f) with f a function from S to the underlying set of G; its morphisms from (G, f) to (H, g) are the homomorphisms h from G to H with h(f(s)) = g(s) for every s in S. Step 2, locate the universal object: for each object (G, f), the universal property of the free group gives a unique homomorphism h from F(S) to G with h(eta(s)) = f(s), which is exactly a unique morphism from (F(S), eta) to (G, f); hence (F(S), eta) is initial in the auxiliary category. Step 3, uniqueness of initial objects: if (A, a) and (B, b) are both initial, there are unique morphisms u from A to B and v from B to A; the composite v after u is a morphism from A to A, and initiality of A forces v after u to be the identity on A; likewise u after v is the identity on B; so u is an isomorphism, and it is unique because u was the unique morphism from A to B. Conclusion: the free group F(S) is unique up to a unique isomorphism."
      - id: kp2
        name: The existence-and-uniqueness template
        key_prerequisites: [commutative-diagrams]
        constraints: "Separate the EXISTS and UNIQUE clauses explicitly and say which clause each proof step uses; concrete instances use only the terminal object."
        exemplars:
          - problem: "A universal property of an object U is one statement about maps X -> U, built from two clauses. Select the statement that correctly gives the general form of such a property."
            answer: "for every X a morphism exists, unique among those making the diagram commute"
            answer_contract: {"kind": "label", "options": [["for every X a morphism exists, unique among those making the diagram commute"], ["for every X a morphism exists, and every morphism makes the diagram commute"], ["for some X a morphism exists, unique among those making the diagram commute"], ["for every X at most one morphism exists, and none make the diagram commute"]]}
            solution_sketch: "The template: the existence clause says a morphism X -> U exists, and the uniqueness clause says it is the only one making the defining diagram commute. The option 'and every morphism makes the diagram commute' deletes the uniqueness clause. The option 'for some X' weakens the existence clause to a single object. The option 'at most one morphism exists, and none make the diagram commute' keeps at-most-one but breaks the existence clause. The answer is for every X a morphism exists, unique among those making the diagram commute."
          - problem: "In the category Set, take the one-point set 1 = {7} as the terminal object. Let f and g be any two functions from {1, 2, 3} to 1. Using the uniqueness clause of the universal property of 1, give the value of g(2)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the value g(2) of a function {1, 2, 3} -> {7}. Step 1 (existence clause): a morphism {1, 2, 3} -> 1 exists, namely the constant function to 7. Step 2 (uniqueness clause): the defining diagram for the terminal object is empty, so any two morphisms into 1 coincide, hence g is that constant function. Step 3 (evaluate): g(2) = 7. The answer is 7."
          - problem: "View the poset with elements 2, 3, 5 and 30, ordered by divisibility, as a category: a morphism from d to m is the fact that d divides m. The element 30 is the greatest element, hence the terminal object of this category. How many morphisms are there from 5 to the terminal object?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the hom-set from 5 to 30 in the poset category of divisors of 30. Step 1 (existence clause): 5 divides 30, so there is at least one morphism 5 -> 30. Step 2 (uniqueness clause): in a poset each hom-set has at most one element, so there is at most one such morphism. Step 3 (combine the clauses): exactly one morphism. The answer is 1."
          - problem: "Claim: in any category, if 1 is a terminal object, then any two morphisms f, g: X -> 1 are equal. Step 1: the universal property of 1 has two clauses: for every object X there exists a morphism X -> 1, and this morphism is unique among all morphisms from X to 1. Step 2: f is a morphism from X to 1. Step 3: g is a morphism from X to 1. Step 4: by the existence clause, f = g. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly separates the two clauses of the universal property of the terminal object, so it is valid. Step 2 is valid: f is given as a morphism X -> 1. Step 3 is valid: g is given as a morphism X -> 1. Step 4 cites the wrong clause: the existence clause only produces some morphism, while the uniqueness clause is what forces two morphisms into 1 to coincide. The answer is Step 4."
          - problem: "Claim: in the category Set, with the one-point set 1 = {0}, there is exactly one function from 1 to the set {0, 1}. Step 1: in Set, the one-point set is a terminal object. Step 2: its universal property gives, for every set X, a unique function X -> 1. Step 3: take X = 1; the universal property then gives exactly one function from 1 to {0, 1}. Step 4: therefore the claim holds. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: a one-point set is terminal in Set. Step 2 is valid: it states both clauses in the correct direction, with maps going into 1. Step 3 is not valid: taking X = 1 the property gives a unique function 1 -> 1, not a function from 1 to {0, 1}; in fact there are two functions from {0} to {0, 1}. Step 4 would follow from a corrected Step 3, so it is not the first failure. The answer is Step 3."
          - problem: "In the category Set, take the one-point set 1 = {3} as the terminal object. Let f be the function from {1, 2} to 1 with f(1) = 3 and f(2) = 3, and let g be any function from {1, 2} to 1. Using the uniqueness clause of the universal property of 1, give the value of g(1) + g(2)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the sum g(1) + g(2) for a function g into the one-point set {3}. Step 1 (uniqueness clause): any two morphisms into the terminal object coincide, so g = f. Step 2 (evaluate): g(1) = f(1) = 3 and g(2) = f(2) = 3. Step 3 (add): 3 + 3 = 6. The answer is 6."
          - problem: "Write the full proof: in any category with a terminal object 1, any two morphisms f, g: X -> 1 are equal, and name at each step which clause of the universal property is used. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "State the universal property with separated clauses: for every object X there exists a morphism X -> 1, and it is unique among all morphisms X -> 1, because the defining diagram of the terminal object is empty. Step 1 (existence clause): there is a morphism from X to 1. Step 2: f and g are morphisms from X to 1, so both are candidates for that unique map. Step 3 (uniqueness clause): only one morphism X -> 1 exists, so f and g each equal it. Conclusion: f = g, which is the prototype of every uniqueness argument driven by a universal property."
      - id: kp3
        name: Universal properties as represented functors
        key_prerequisites: [initial-terminal-objects]
        constraints: "Exhibit the bijection $\\mathrm{Hom}(X,U)\\cong S(X)$ with the candidate-structure functor $S$ named; instances limited to terminal objects and binary products."
        exemplars:
          - problem: "View the divisibility poset on {1, 2, 3, 5, 6, 10, 15, 30} as a category: a single arrow from x to y exactly when x divides y. Let S be the one-point candidate-structure functor, S(x) = {t} for every object x. The terminal object is the element u for which Hom(x, u) is a singleton for every x, matching S(x). Give u."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The terminal object u must satisfy a bijection Hom(x, u) = S(x) for every x, and since S(x) is a one-point set, each Hom(x, u) must be a singleton. In a poset category Hom(x, u) is a singleton exactly when x divides u. So u must be divisible by every element: by 1, 2, 3, 5, 6, 10 and 15. The only such element is 30, and there is exactly one arrow from each x to 30. The answer is 30."
          - problem: "Make a category from the divisibility order on {1, 2, 3, 4, 6, 12}: one arrow from x to y exactly when y is a multiple of x. Let S be the candidate-pair functor S(x) = Hom(x, 4) x Hom(x, 6), which has one element exactly when x divides both 4 and 6. The product of 4 and 6 is the element u with a bijection Hom(x, u) = S(x) for every x. Give u."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The functor is S(x) = Hom(x, 4) x Hom(x, 6); a pair of arrows exists exactly when x divides both 4 and 6. The elements dividing both 4 and 6 are 1 and 2, so S(x) is a singleton exactly for x in {1, 2}. The representing element u must have exactly 1 and 2 below it, and since 1 divides 2, u = 2, the greatest lower bound of 4 and 6. The answer is 2."
          - problem: "Work in the category of sets. Let A = {1, 2} and B = {3, 4, 5}, and let S be the candidate-pair functor S(X) = Hom(X, A) x Hom(X, B). Take X to be the one-point set {p}. Give the number of elements of S(X)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The functor is S(X) = Hom(X, A) x Hom(X, B) with A = {1, 2} and B = {3, 4, 5}. A map from the one-point set X = {p} to A is a choice of an element of A, so Hom(X, A) has 2 elements; the same reasoning gives 3 elements in Hom(X, B). The product rule for sizes gives 2 times 3 = 6. The answer is 6."
          - problem: "Work in the category of sets with A = B = {0, 1}. Let P = {0, 1} carry two structure maps pi1 and pi2, both the identity. A student claims that P is a product of A and B. Test the claim with X = {0, 1}, f the identity on X, and g the swap sending 0 to 1 and 1 to 0. Give the number of maps u from X to P with pi1 after u = f and pi2 after u = g."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both structure maps on P are the identity, so the two required equations read u(x) = f(x) = x and u(x) = g(x) = 1 - x for every x in X. At x = 0 these demand u(0) = 0 and u(0) = 1 at the same time, which is impossible. So no map u exists, the existence clause of the universal property fails, and P is not a product of A and B. The answer is 0."
          - problem: "Here is an attempted argument that in the category of sets the product of A and B fails to represent the candidate-pair functor S(X) = Hom(X, A) x Hom(X, B). Step 1: send each map u from X to A x B to the pair (pi1 after u, pi2 after u). Step 2: suppose two maps u and v are sent to the same pair. Step 3: equality after both structure maps does not force u = v. Step 4: so the assignment is not injective and cannot be a bijection. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid definition of the assignment from Hom(X, A x B) to S(X). Step 2 is a legitimate supposition about two maps. Step 3 is the first invalid step: the two structure maps of a product are jointly monic, so equality after both does force u = v, by the uniqueness clause of the universal property. Step 4 rests on the false Step 3, so it is not the first failure. The answer is Step 3."
          - problem: "Let A x B be a product in the category of sets with structure maps pi1 and pi2. Step 1: take u and v from X to A x B. Step 2: suppose pi1 after u = pi1 after v and pi2 after u = pi2 after v. Step 3: conclude u = v. Which hypothesis does Step 3 use?"
            answer: "uniqueness of the comparison map"
            answer_contract: {"kind": "label", "options": [["uniqueness of the comparison map"], ["surjectivity of pi1 onto A"], ["naturality of the bijection in X"], ["existence of an arrow into A x B"]]}
            solution_sketch: "Both u and v are comparison maps for the same candidate pair (pi1 after u, pi2 after u). The option 'surjectivity of pi1 onto A' fails: product structure maps need not be surjective, and surjectivity gives no equality of maps. The option 'naturality of the bijection in X' concerns behavior under precomposition, not equality of two maps. The option 'existence of an arrow into A x B' produces some map, not the equality u = v. By the uniqueness clause of the universal property there is only one comparison map per pair, so u = v. The answer is uniqueness of the comparison map."
          - problem: "Write the full proof: in the category of sets, the product A x B with its structure maps pi1 and pi2 represents the candidate-pair functor S(X) = Hom(X, A) x Hom(X, B) via the bijection sending u to the pair (pi1 after u, pi2 after u), natural in X. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (definition): for each map u from X to A x B, set Phi of u = (pi1 after u, pi2 after u), an element of S(X) = Hom(X, A) x Hom(X, B). Step 2 (injectivity): if Phi of u = Phi of v, then u and v are both comparison maps for the same pair (f, g), and the uniqueness clause of the universal property gives a single such map, so u = v. Step 3 (surjectivity): given (f, g) in S(X), the existence clause of the universal property of the product yields a map u from X to A x B with pi1 after u = f and pi2 after u = g, so Phi of u = (f, g). Step 4 (naturality): for any map h from Y to X, Phi of (u after h) = (f after h, g after h), which is the pair (Phi of u) acted on by h componentwise, so Phi commutes with precomposition; this is exactly naturality in X. Conclusion: Phi is a bijection Hom(X, A x B) = S(X), natural in X, so the product A x B represents the candidate-pair functor S."
    diagnostic_exemplar:
      problem: "State the universal property of the product $A\\times B$ and use it to prove that $u\\mapsto(\\pi_1\\circ u,\\,\\pi_2\\circ u)$ is a bijection $\\mathrm{Hom}(X,A\\times B)\\cong\\mathrm{Hom}(X,A)\\times\\mathrm{Hom}(X,B)$."
      answer: "The universal property: for every pair $f\\colon X\\to A$, $g\\colon X\\to B$ there EXISTS a morphism $u\\colon X\\to A\\times B$ with $\\pi_1 u=f$, $\\pi_2 u=g$, and it is UNIQUE. Surjectivity of the map $u\\mapsto(\\pi_1 u,\\pi_2 u)$ is exactly the existence clause: every pair $(f,g)$ arises. Injectivity is exactly the uniqueness clause: two maps with the same components mediate the same pair, hence are equal. So the map is a bijection — $A\\times B$ represents $X\\mapsto\\mathrm{Hom}(X,A)\\times\\mathrm{Hom}(X,B)$."
      solution_sketch: "Split the universal property into its two clauses and match them to the two halves of being a bijection: existence of the mediating $u$ is surjectivity, uniqueness of $u$ is injectivity. Beyond that dictionary there is nothing to compute."
    anki_seeds:
      - front: "A universal property characterizes an object as..."
        back: "the initial (or terminal) object of an auxiliary category of candidate structures."
        type: basic
      - front: "A universal property has two clauses: {{c1::existence}} of a comparison morphism and {{c2::uniqueness}} among the diagram-commuting morphisms."
        back: "existence; uniqueness"
        type: cloze

  - id: products-coproducts
    name: Products and Coproducts
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: universal-properties
        weight: 0.5
        key: true
      - id: duality-opposite-categories
        weight: 0.4
        key: true
      - id: initial-terminal-objects
        weight: 0.2
      - id: commutative-diagrams
        weight: 0.2
      - id: direct-products
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The product universal property in Set
        key_prerequisites: [universal-properties]
        constraints: "Verify the universal property in $\\mathbf{Set}$ elementwise, or identify products in a poset category as meets; the pairing map must be shown unique."
        exemplars:
          - problem: "Work in the category of sets. Let A = {1, 2} and B = {3, 4}; their product is the set of ordered pairs A x B with the projection maps pi1 and pi2 that read off the two entries. Let X = {5, 7} and define f from X to A and g from X to B by f(5) = 1, f(7) = 2, g(5) = 4, g(7) = 3. The pairing map <f, g> from X to A x B is the unique map with pi1 <f, g> = f and pi2 <f, g> = g. Give <f, g>(7) as (x, y)."
            answer: "(2, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: the product is the set of ordered pairs A x B, where pi1 reads off the first entry and pi2 reads off the second. Pairing rule: the unique map satisfying both component equations is <f, g>(x) = (f(x), g(x)). Evaluate at the element 7: the first entry is f(7) = 2 and the second entry is g(7) = 3. The answer is (2, 3)."
          - problem: "Regard the divisibility poset on the set {1, 2, 3, 6, 9, 18} as a category: there is a morphism from x to y exactly when x divides y. In this category a product of two objects is an object p with a morphism from p to each of them, such that every object with morphisms to both also has a morphism to p. Give the product of the objects 6 and 9."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full setup: a morphism from x to y means x divides y, so a product of 6 and 9 is an element p that divides both and that every common divisor of the two also divides; that is the meet, the greatest common divisor. Common divisors of 6 and 9 inside the poset: 1 and 3. Every one of them divides 3, and 3 is the greatest, so the product is the meet 3. The answer is 3."
          - problem: "In the category of sets, let A = {0, 1} and B = {2, 3}. A student proposes the candidate product P = A x B x {0, 1}, with pi1 and pi2 the projections onto the first two coordinates. Let X = {9} with the maps f from X to A and g from X to B given by f(9) = 1 and g(9) = 2. State how many maps h from X to P satisfy pi1 h = f and pi2 h = g."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full setup: a map h from the one-point set X is determined by the single element h(9), which is a triple in A x B x {0, 1}. First-coordinate rule: pi1 h = f forces the first entry to be f(9) = 1. Second-coordinate rule: pi2 h = g forces the second entry to be g(9) = 2. The third entry can be either element of {0, 1}, giving 2 choices, so the candidate fails the uniqueness clause. The answer is 2."
          - problem: "In the category of sets, let A = {0, 1} and B = {5, 6}. A candidate product is the set P = {(0,5), (0,6), (1,5)} with pi1 and pi2 the coordinate projections onto A and B. Take the one-point set X = {7} with the maps f from X to A and g from X to B given by f(7) = 1 and g(7) = 6. Determine whether P with these projections is a product of A and B, and give the number of maps h from X to P with pi1 h = f and pi2 h = g."
            answer: "verdict = no; maps = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "maps"}]}
            solution_sketch: "Full test: a product must admit, for every set X and every pair of maps f and g, exactly one map h with pi1 h = f and pi2 h = g. Elementwise check: the two equations force h(7) = (1, 6), but the pair (1, 6) is not an element of P. So no map h exists for this X, existence fails, and P is not a product. The answer is verdict = no; maps = 0."
          - problem: "A student checks that in the category of sets the set of pairs A x B with its coordinate projections is a product. Step 1: given maps f from X to A and g from X to B, define h from X to A x B by h(x) = (f(x), g(x)). Step 2: then pi1 sends h(x) to f(x) for every element x, so pi1 h = f. Step 3: likewise pi2 sends h(x) to g(x) for every element x, so pi2 h = g. Step 4: if a map k from X to A x B also has pi1 k = f, then k = h, because a map into a product is determined by its first component alone. Select the first step that is not valid."
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid definition of the pairing map by elements. Step 2 correctly checks the first component equation, and Step 3 correctly checks the second. Step 4 is the first invalid step: equal first components alone do not force k = h, because the second components may differ; with both component equations one gets k(x) = (f(x), g(x)) = h(x) for every element x. The answer is Step 4."
          - problem: "A proof shows that in a poset category the product of two elements a and b is their meet. Step 1: a product object p must have morphisms to a and to b, so p is at most a and p is at most b. Step 2: for any element x that is at most a and at most b, the universal property yields a mediating arrow from x to p. Step 3: reading that arrow as an order statement forces x below p, so p is the greatest lower bound of a and b. Step 4: the mediating arrow is unique because a poset category has at most one morphism between any two objects, so the universal property is satisfied. Which hypothesis about poset categories does Step 3 use?"
            answer: "a morphism from x to p exists exactly when x is at most p"
            answer_contract: {"kind": "label", "options": [["a morphism from x to p exists exactly when x is at most p"], ["any two elements of the poset have a least upper bound"], ["every element of the poset is at most itself"], ["the order relation of the poset is a total order"]]}
            solution_sketch: "Step 3 turns the mediating arrow into the order claim that x lies below p. The hypothesis it uses is that a morphism from x to p exists exactly when x is at most p. The least upper bound option confuses the meet with the join. The reflexivity option is true but does not give the claim of Step 3. The total order option is false, since a divisibility poset with incomparable elements is not total. The answer is a morphism from x to p exists exactly when x is at most p."
          - problem: "Write the full proof: for sets A and B, the cartesian product A x B equipped with the coordinate projections satisfies the universal property of the product, and its pairing map is unique. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Statement: for sets A and B, the object A x B with pi1(u, v) = u and pi2(u, v) = v is a product. Existence step: given a set X with maps f from X to A and g from X to B, define the pairing h from X to A x B by sending each element x to the pair (f(x), g(x)). Component step: pi1(h(x)) = f(x) and pi2(h(x)) = g(x) for every element x, so pi1 h = f and pi2 h = g. Uniqueness step: if a map k from X to A x B also satisfies pi1 k = f and pi2 k = g, write k(x) = (u, v); the equations give u = f(x) and v = g(x), so k(x) = h(x) for every element x, hence k = h. Conclusion: A x B with the coordinate projections satisfies the universal property of the product, and the pairing map is unique."
      - id: kp2
        name: The coproduct by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Obtain the coproduct by dualizing the product; concrete verifications in $\\mathbf{Set}$ (disjoint union) or $\\mathbf{Ab}$ (direct sum), with the copairing shown to be the unique mediating homomorphism."
        exemplars:
          - problem: "State the universal property of the coproduct $A+B$ and identify it in $\\mathbf{Set}$."
            answer: "Injections $\\iota_1,\\iota_2$ with unique copairing $[f,g]$; in Set the disjoint union."
            solution_sketch: "The coproduct is the dual of the product: $A+B$ with $\\iota_1\\colon A\\to A+B$, $\\iota_2\\colon B\\to A+B$ such that any $f\\colon A\\to X$, $g\\colon B\\to X$ factor through a unique $[f,g]\\colon A+B\\to X$ with $[f,g]\\iota_1=f$, $[f,g]\\iota_2=g$. In $\\mathbf{Set}$ this is the disjoint union $A\\sqcup B$ with the inclusions and case-split map."
          - problem: "Verify that the direct sum $A\\oplus B$ is the coproduct in $\\mathbf{Ab}$, exhibiting the copairing."
            answer: "Inclusions $\\iota_1(a)=(a,0)$, $\\iota_2(b)=(0,b)$; the copairing $[f,g](a,b)=f(a)+g(b)$ is the unique homomorphism."
            solution_sketch: "Take $A\\oplus B$ with $\\iota_1(a)=(a,0)$ and $\\iota_2(b)=(0,b)$. Given homomorphisms $f\\colon A\\to X$, $g\\colon B\\to X$, define $[f,g]\\colon A\\oplus B\\to X$ by $[f,g](a,b)=f(a)+g(b)$; it is a homomorphism with $[f,g]\\iota_1=f$ and $[f,g]\\iota_2=g$. Any homomorphism $h$ with those equations satisfies $h(a,b)=h(a,0)+h(0,b)=f(a)+g(b)$, so $[f,g]$ is unique. Hence $A\\oplus B$ is the coproduct — here it coincides with the product, a biproduct, unlike the disjoint union in $\\mathbf{Set}$."
      - id: kp3
        name: Uniqueness; coproducts need not be disjoint unions
        key_prerequisites: [universal-properties]
        constraints: "Uniqueness proofs follow the cross-map pattern with both mediating maps named; the category-dependence of coproducts is illustrated only by $\\mathbf{Grp}$ (free product) versus $\\mathbf{Ab}$ (direct sum)."
        exemplars:
          - problem: "Prove any two products of $A,B$ are uniquely isomorphic, and state the coproduct in $\\mathbf{Grp}$ versus $\\mathbf{Ab}$."
            answer: "Universal property forces a unique iso; free product in $\\mathbf{Grp}$, direct sum in $\\mathbf{Ab}$."
            solution_sketch: "If $P,P'$ are products, each universal property gives unique $u\\colon P\\to P'$, $v\\colon P'\\to P$ commuting with projections. Then $vu$ and $1_P$ both commute with $P$'s projections, so uniqueness gives $vu=1_P$; likewise $uv=1_{P'}$: a unique isomorphism. Products in $\\mathbf{Grp}$/$\\mathbf{Ab}$ are direct products, but the coproduct is the free product $G*H$ in $\\mathbf{Grp}$ and the direct sum $G\\oplus H$ in $\\mathbf{Ab}$ — coproducts are category-dependent."
          - problem: "Prove any two coproducts of $A,B$ are uniquely isomorphic, and contrast $\\mathbf{Grp}$'s coproduct with the direct product."
            answer: "Duality gives a unique iso commuting with the injections; $\\mathbb Z*\\mathbb Z$ is free on two generators, not $\\mathbb Z\\times\\mathbb Z$."
            solution_sketch: "If $Q,Q'$ are coproducts of $A,B$, each universal property gives unique $u\\colon Q\\to Q'$ and $v\\colon Q'\\to Q$ commuting with the injections. Then $vu$ and $1_Q$ both commute with $Q$'s injections, so uniqueness forces $vu=1_Q$; likewise $uv=1_{Q'}$: a unique compatible isomorphism. Concretely in $\\mathbf{Grp}$ the coproduct is the free product $\\mathbb Z*\\mathbb Z$, the nonabelian free group on two generators, wholly different from the direct product $\\mathbb Z\\times\\mathbb Z$ — coproducts are not disjoint-union-like in general."
    diagnostic_exemplar:
      problem: "Prove that any two products of $A$ and $B$ are isomorphic by a unique isomorphism compatible with the projections."
      answer: "Let $(P,\\pi_1,\\pi_2)$ and $(P',\\pi_1',\\pi_2')$ both be products. The universal property of $P'$ applied to the cone $(\\pi_1,\\pi_2)$ gives a unique $u\\colon P\\to P'$ with $\\pi_i'u=\\pi_i$; that of $P$ gives a unique $v\\colon P'\\to P$ with $\\pi_iv=\\pi_i'$. Then $\\pi_i(vu)=\\pi_i'u=\\pi_i$, so $vu$ and $1_P$ both mediate the cone $(\\pi_1,\\pi_2)$ into $P$; uniqueness forces $vu=1_P$, and symmetrically $uv=1_{P'}$. Hence $u$ is an isomorphism, unique among maps commuting with the projections."
      solution_sketch: "Mediate each product through the other to get $u$ and $v$, then notice that $v\\circ u$ and the identity both mediate the same cone into $P$; the uniqueness clause collapses them. This is the standard argument that universal objects are unique up to a unique isomorphism."
    anki_seeds:
      - front: "Universal property of a product?"
        back: "$\\pi_1,\\pi_2$ with: every pair $f\\colon X\\to A$, $g\\colon X\\to B$ factors as a unique $\\langle f,g\\rangle\\colon X\\to A\\times B$."
        type: basic
      - front: "Coproduct is the {{c1::dual}} of the product; in $\\mathbf{Set}$ it is the {{c2::disjoint union}}."
        back: "dual; disjoint union"
        type: cloze

  - id: equalizers-coequalizers
    name: Equalizers and Coequalizers
    core: true
