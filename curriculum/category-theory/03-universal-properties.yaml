          - problem: "Write the full proof: in any category with a terminal object 1, any two morphisms f, g: X -> 1 are equal, and name at each step which clause of the universal property is used. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "State the universal property with separated clauses: for every object X there exists a morphism X -> 1, and it is unique among all morphisms X -> 1, because the defining diagram of the terminal object is empty. Step 1 (existence clause): there is a morphism from X to 1. Step 2: f and g are morphisms from X to 1, so both are candidates for that unique map. Step 3 (uniqueness clause): only one morphism X -> 1 exists, so f and g each equal it. Conclusion: f = g, which is the prototype of every uniqueness argument driven by a universal property."
      - id: kp3
        name: Universal properties as represented functors
        key_prerequisites: [initial-terminal-objects]
        constraints: "Require the learner to use universal properties as represented functors. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar. Closed items may diagnose general proofs; require the named universal-property argument, not numerical outputs after its decisive construction is supplied."
        exemplars:
          - problem: "Audit the categorical arguments independently. Argument A: Let S:C^op->Set and u in S(U). Assume that for every X and x in S(X), there is exactly one f:X->U with S(f)(u)=x. Step 1: define alpha_X(f)=S(f)(u); the hypothesis makes alpha_X a bijection. Step 2: for h:Y->X, functoriality gives alpha_Y(fh)=S(h)(alpha_X(f)). Step 3: alpha is a natural isomorphism Hom(-,U)->S, so U represents S. Argument B: For a presheaf S and object U, Step 1: suppose S(X) and Hom(X,U) have the same cardinality for each X. Step 2: any chosen component bijections automatically commute with all restriction maps. Step 3: hence U represents S. For each, give the first numbered assertion that fails to follow from the assumptions and previous justified assertions. Use 0 when every assertion follows; return the numbers in argument order."
            answer: "0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The unique-element lifting hypothesis yields bijections, and contravariant functoriality supplies their naturality. Equal cardinalities do not impose naturality; a regular action and a trivial action can have equally large values without a natural bijection. The first unsupported assertions are 0, 2."
