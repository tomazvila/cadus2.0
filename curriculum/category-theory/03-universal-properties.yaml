        exemplars:
          - problem: "Perform the lifting step in the proof that fully faithful functors reflect limits. F:C->D is fully faithful. For a C-cone with apex X and candidate limit L, the induced hom-map Hom_C(X,L)->Hom_D(FX,FL) sends source arrows numbered0,...,2 to target arrows with value list[2, 0, 1]. The unique target cone mediator is arrow1. Construct the source mediator, then identify the hypotheses that (a) lift it and (b) reflect the commuting equations and its uniqueness. Code fullness as1 and faithfulness as2. Give the source-arrow number and the two hypothesis codes."
            answer: "2, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness lifts the unique target cone map. Faithfulness reflects its leg equations and any equality of two candidate lifts, establishing the source universal property. The resulting answer is 2, 1, 2."
          - problem: "Let P be the poset on {n, k, a, b} with relations n <= k, k <= a, k <= b, closed under transitivity, and let Q be the chain 0 <= 1 <= 2. The monotone map F with F(n) = 1, F(k) = 1, F(a) = 1, F(b) = 2 is faithful, since each hom-set of P has at most one morphism, but it is not full, since a and b are not comparable while 1 <= 2. The image of the cone (n; n <= a, n <= b) is a meet cone in Q. Give your verdict on reflection for F and the meet of a and b in P."
            answer: "verdict = fails; meet = k"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reflects"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "meet"}]}
            solution_sketch: "Setup: the image of the cone (n; n <= a, n <= b) is the cone (1; identity, the arrow 1 to 2), which is the meet of 1 and 2 in the chain Q, hence a limit cone. Failure: in P the cone (k; k <= a, k <= b) has no cone map to the cone on n, because such a map would be a morphism k to n, that is k <= n, which is false. So the image cone is a limit cone while the original is not, and the verdict is not reflects. Meet computation: the common lower bounds of a and b in P are n and k, with n <= k, so the greatest is k. The answer is verdict = fails; meet = k."
          - problem: "Recover the source mediator from the target universal property. F:C->D is fully faithful. For a C-cone with apex X and candidate limit L, the induced hom-map Hom_C(X,L)->Hom_D(FX,FL) sends source arrows numbered0,...,3 to target arrows with value list[1, 3, 0, 2]. The unique target cone mediator is arrow3. Construct the source mediator, then identify the hypotheses that (a) lift it and (b) reflect the commuting equations and its uniqueness. Code fullness as1 and faithfulness as2. Give the source-arrow number and the two hypothesis codes."
