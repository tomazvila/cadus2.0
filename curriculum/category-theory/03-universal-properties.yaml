          - problem: "Write the full proof: in Set, the quotient of the coproduct A + B by the smallest equivalence relation with f(c) ~ g(c) for every c in C, with the maps q1(a) = [a] and q2(b) = [b], is the pushout of f: C -> A and g: C -> B, and this realizes the pushout as a coproduct followed by a coequalizer. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (coproduct): form the disjoint union A + B with its two injections. Step 2 (coequalizer): let ~ be the smallest equivalence relation identifying f(c) with g(c) for each c in C, and set Q = (A + B)/~ with q1(a) = [a] and q2(b) = [b]. Step 3 (commutativity): for each c, q1 f(c) = [f(c)] = [g(c)] = q2 g(c), so q1 f = q2 g. Step 4 (universal property): if u: A -> X and v: B -> X satisfy u f = v g, define w([t]) = u(t) for t in A and w([t]) = v(t) for t in B; when a class meets both summands through some c, the condition u f(c) = v g(c) makes the two values agree, so w is well defined and is the unique map with w q1 = u and w q2 = v. Step 5 (duality): Q is the coequalizer of the two maps C -> A + B taken after the coproduct, the dual of the pullback as a product followed by an equalizer, so Q is the pushout."
    diagnostic_exemplar:
      problem: "Prove that monomorphisms are stable under pullback: if $g\\colon B\\to C$ is mono and $(P,p_1,p_2)$ is the pullback of $f\\colon A\\to C$ along $g$, then $p_1\\colon P\\to A$ is mono."
      answer: "Take $u,v\\colon X\\to P$ with $p_1u=p_1v$. Then $g(p_2u)=f(p_1u)=f(p_1v)=g(p_2v)$ using the pullback square, and $g$ mono gives $p_2u=p_2v$. So $u$ and $v$ mediate the same cone $(p_1u,p_2u)$ over the cospan; the pullback's uniqueness clause forces $u=v$. Hence $p_1$ is a monomorphism."
      solution_sketch: "Push $p_1u=p_1v$ across the square to get $g\\circ p_2u=g\\circ p_2v$, cancel the mono $g$ so the second components agree too, then apply the pullback uniqueness clause to the single cone that both $u$ and $v$ mediate."
