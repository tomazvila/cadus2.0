            answer: "3, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness lifts the unique target cone map. Faithfulness reflects its leg equations and any equality of two candidate lifts, establishing the source universal property. The resulting answer is 3, 1, 2."
          - problem: "Construct the mediator required to reflect the target limit cone. F:C->D is fully faithful. For a C-cone with apex X and candidate limit L, the induced hom-map Hom_C(X,L)->Hom_D(FX,FL) sends source arrows numbered0,...,1 to target arrows with value list[1, 0]. The unique target cone mediator is arrow1. Construct the source mediator, then identify the hypotheses that (a) lift it and (b) reflect the commuting equations and its uniqueness. Code fullness as1 and faithfulness as2. Give the source-arrow number and the two hypothesis codes."
            answer: "0, 1, 2"
