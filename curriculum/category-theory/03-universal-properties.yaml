          - problem: "Detect the missing universal cone that obstructs completeness. Regard [1, 2, 3] as a divisibility category. For every subset of objects, including the empty subset, construct its limit if it exists. Enumerate subsets by bit masks using the displayed object order. Give the resulting apex for each subset, with -1 for a failed universal property."
            answer: "-1,1,2,1,3,1,1,1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Test the universal arrow condition against every cone or cocone apex. Including the empty subset checks the terminal or initial object required by the definition. The resulting answer is -1, 1, 2, 1, 3, 1, 1, 1."
          - problem: "Consider the finite poset P whose elements are 2, 3, 4 and 12, ordered by divisibility, and note that 1 is not an element of P. In the poset category a limit over a subset is its infimum, so P would give a complete lattice only if every subset had an infimum inside P. How many of the two-element subsets of P have no infimum in P?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full list of two-element subsets of P is 2 with 3, 2 with 4, 2 with 12, 3 with 4, 3 with 12, and 4 with 12. Rule: in a poset category the limit over a subset is its infimum, which must be a greatest common divisor lying inside P. The pairs 2 with 4, 2 with 12, 3 with 12 and 4 with 12 have infima 2, 2, 3 and 4. The pairs 2 with 3 and 3 with 4 have no common divisor inside P, since 1 is missing, so they have no infimum and P is not a complete lattice. The answer is 2."
          - problem: "Claim: a finite poset in which every pair of elements has an infimum is a complete lattice, so its poset category is complete. Step 1: in a poset category, limits are infima, so completeness means every subset has an infimum. Step 2: for a nonempty subset, take its elements one at a time and combine them with the pairwise infima; the final value is the infimum of the subset. Step 3: the empty subset has the least element of the poset as its infimum, and this least element exists because the poset is finite. Step 4: every subset has an infimum, so the poset is a complete lattice and its category is complete. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: limits in a poset category are infima of object sets. Step 2 is valid: pairwise infima combined one at a time over a finite nonempty subset give the infimum of the whole subset. Step 3 is the first invalid step: the infimum of the empty subset is the greatest element of the poset, not the least, and a finite poset with pairwise infima, such as 1, 2, 3 ordered by divisibility, need not have a greatest element, so the empty limit can fail. Step 4 inherits the error, since it rests on the faulty Step 3. The answer is Step 3."
          - problem: "View the nonnegative integers under their usual order as a category. Which listed diagram has no limit: 1: the empty diagram; 2: the one-object diagram selecting 0; 3: the discrete diagram selecting 1 and 2; 4: the single arrow 1->2? Give its number, using the categorical limit condition."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A limit of the empty diagram would be a terminal object, but every nonnegative integer has a strictly larger one. The other diagrams have limits 0, 1, and 1 respectively, so the answer is 1."
          - problem: "Write the full proof: a poset, viewed as a category, has all small limits exactly when it is a complete lattice. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (diagrams carry no arrow data): a diagram D from a small category into a poset category P sends arrows to arrows, but P has at most one arrow between any two objects, so D is determined by its object set S. Step 2 (limits are infima): a cone over D with vertex c is an element of P below every object of S, that is a lower bound of S, and the universal property of the limit says c is the greatest lower bound; so a limit of D exists exactly when inf S exists, and then the limit is inf S. Step 3 (only if direction): if P is complete, every small diagram has a limit, so every subset S has an infimum in P, including the empty set, whose infimum is the greatest element of P; hence P is a complete lattice. Step 4 (if direction): if P is a complete lattice, every subset S has an infimum, so every small diagram D has a limit, namely the infimum of its object set; hence P is complete. Conclusion: a poset category is complete exactly when the poset is a complete lattice."
