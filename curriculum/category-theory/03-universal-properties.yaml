            solution_sketch: "Step 1 (the concrete diagram): take $X=Y=\\{ * \\}$ in $\\mathbf{Set}$; the product $X\\times Y$ is the singleton $\\{(*,*)\\}$ with the two projections to $X$ and $Y$, a limit cone over the discrete two-object diagram. Step 2 (apply the functor): $F(X\\times Y)$ is the free group on one generator, which is $\\mathbb{Z}$, with the induced homomorphisms to $FX=\\mathbb{Z}$ and $FY=\\mathbb{Z}$. Step 3 (the product of the images): the product of $FX$ and $FY$ in $\\mathbf{Grp}$ is $\\mathbb{Z}\\times\\mathbb{Z}$ with componentwise addition. Step 4 (non-isomorphism): $\\mathbb{Z}$ is cyclic but $\\mathbb{Z}\\times\\mathbb{Z}$ is not; if an element $(a,b)$ generated $\\mathbb{Z}\\times\\mathbb{Z}$, then $(1,0)=n(a,b)$ for some integer $n$, so $na=1$ and $nb=0$, which forces $n=\\pm 1$, $a=\\pm 1$ and $b=0$, and then every multiple of $(a,b)$ has second coordinate 0, so $(0,1)$ is never reached. Step 5 (conclusion): since $\\mathbb{Z}$ is not isomorphic to $\\mathbb{Z}\\times\\mathbb{Z}$, the cone $F(X\\times Y)$ with its projections is not a product cone, so $F$ does not preserve binary products."
      - id: kp3
        name: Fully faithful functors reflect limits
