    knowledge_points:
      - id: kp1
        name: The explicit construction of limits in Set
        key_prerequisites: [limits-as-cones]
        constraints: "The compatible-families formula, proved universal or evaluated on diagrams of finite sets with at most 4 elements per set."
        exemplars:
          - problem: "In Set, let D be the cospan A -> C <- B, where A = {0, 1}, B = {2, 3} and C = {5}, with the only possible maps. Let (X, mu) be the cone over D with X = {7, 8}, mu_A(7) = 1, mu_A(8) = 0, mu_B(7) = 3, mu_B(8) = 2. The universal property of the limit gives a unique map u: X -> lim D whose composite with each leg equals the matching leg of the cone. Give u(8) as (a, b), listing the A-coordinate first."
            answer: "(0, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The limit L is the set of compatible families: triples (a, c, b) with a in A, c in C, b in B whose images in C agree; compatibility is automatic here because C has a single element. Rule of the universal property: the mediating map sends each x to the family of its leg values, so u(8) has A-coordinate mu_A(8) = 0 and B-coordinate mu_B(8) = 2. The answer is (0, 2)."
          - problem: "In Set, let D be the cospan A -> C <- B where A = {0, 1, 2}, B = {0, 1} and C = {4}, with the only possible maps. Use the compatible-families formula to compute the limit of D. How many elements does the limit have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A compatible family is a choice of a in A, c in C and b in B whose images in C agree. Rule: since C has a single element, every pair (a, b) is compatible and the middle coordinate c is forced, so the limit is the full product of A and B. Its size is 3 times 2 = 6. The answer is 6."
          - problem: "In Set, let D be the parallel pair of maps f, g: A -> B with A = {0, 1, 2, 3} and B = {0, 1}, where f sends 0 and 1 to 0 and sends 2 and 3 to 1, while g sends 0 to 0, sends 1 to 1, sends 2 to 1 and sends 3 to 0. Use the compatible-families formula to compute the limit of D. Give the elements of the limit in increasing order."
            answer: "0, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "For a parallel pair, the limit is the set of elements a in A with f(a) = g(a), with the inclusion leg. Check each element by the compatibility rule: f(0) = 0 = g(0); f(1) = 0 but g(1) = 1; f(2) = 1 = g(2); f(3) = 1 but g(3) = 0. The compatible elements are 0 and 2. The answer is 0, 2."
          - problem: "In Set, let D be the cospan A -> C <- B with A = {0, 1, 2, 3}, C = {0, 1} and B = {0, 1, 2}. The map from A to C sends 0, 1 and 2 to 0 and sends 3 to 1; the map from B to C sends 0 to 0 and sends 1 and 2 to 1. Use the compatible-families formula to compute the limit of D. Find the number of elements in the limit."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit is the set of compatible pairs (a, b) with f(a) = g(b), with the two projection legs. Count by the compatibility rule, fixing b: b = 0 has g(b) = 0, and three elements a of A map to 0; b = 1 and b = 2 have g(b) = 1, and only a = 3 maps to 1. The total count is 3 + 1 + 1. The answer is 5."
          - problem: "Claim: for every cone (X, mu) over a diagram D from a small index category to Set, the map u: X -> lim D defined by u(x) = (mu_j(x))_j is the unique cone morphism. Step 1: each value mu_j(x) lies in D(j), so the family (mu_j(x))_j lies in the product of all the sets D(j). Step 2: the cone condition gives D(f)(mu_j(x)) = mu_j'(x) for every arrow f from j to j', so the family is compatible and u(x) lies in lim D. Step 3: the projection legs satisfy lambda_j(u(x)) = mu_j(x) for every j, so each leg composed with u equals the matching cone leg. Step 4: if a map v from X to lim D satisfies lambda_j v = mu_j for at least one object j, then v equals u. Step 5: therefore u is unique and lim D is the universal cone. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 correctly states membership in the product. Step 2 applies the cone condition correctly to get compatibility. Step 3 holds because the j-th coordinate of u(x) is exactly mu_j(x). Step 4 is invalid: agreement of one single coordinate does not force v = u; uniqueness needs the equations for every object j, since only then is every coordinate of v(x) fixed. Step 5 is a valid conclusion once Step 4 is corrected. The answer is Step 4."
          - problem: "A student proves that the pullback of maps f: A -> C and g: B -> C in Set is the limit of the cospan A -> C <- B. Step 1: a cone from a set X is a pair of maps m1: X -> A and m2: X -> B with f m1 = g m2. Step 2: let P be the set of pairs (a, b) in A x B with f(a) = g(b), with legs p1(a, b) = a and p2(a, b) = b. Step 3: define u: X -> P by u(x) = (m1(x), m2(x)). Step 4: the line is missing. Step 5: hence u is the unique cone morphism from X to P, so P is the limit. Select the line for Step 4 that makes the proof valid."
            answer: "u(x) lies in P, and p1 u = m1 and p2 u = m2, so u is unique"
            answer_contract: {"kind": "label", "options": [["u(x) lies in P, and p1 u = m1 and p2 u = m2, so u is unique"], ["u(x) = (m2(x), m1(x)), so the legs of P are swapped"], ["p1 u = m1 for at least one x, which is enough here"], ["the cone condition forces m1 = m2, so u(x) = m1(x)"]]}
            solution_sketch: "The full object is P, the set of pairs (a, b) with f(a) = g(b). Rule of the cone condition: f m1 = g m2 shows that u(x) = (m1(x), m2(x)) satisfies the membership condition of P, and then p1 u = m1 and p2 u = m2, which fix both coordinates of u(x) and give uniqueness. The option with swapped coordinates assigns the legs to the wrong components. The option about one single x confuses one pointwise check with the universal property. The option claiming m1 = m2 asserts an equality that the cone condition never gives. The answer is u(x) lies in P, and p1 u = m1 and p2 u = m2, so u is unique."
          - problem: "Write the full proof: in Set, the set of compatible families of a small diagram D, with the projection legs, is the limit of D. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the cone): let L be the set of all families (x_j) with x_j in D(j) for every object j and D(f)(x_j) = x_j' for every arrow f from j to j', and let lambda_j send (x_j) to x_j; the compatibility condition is exactly the cone condition, so (L, lambda) is a cone over D. Step 2 (the mediating map): given any cone (X, mu), define u: X -> L by u(x) = (mu_j(x))_j; the cone condition for (X, mu) says D(f)(mu_j(x)) = mu_j'(x), so u(x) is compatible and lies in L, and lambda_j u = mu_j for every j. Step 3 (uniqueness): if v: X -> L also satisfies lambda_j v = mu_j for every j, then the j-th coordinate of v(x) equals mu_j(x) for every j, so v(x) = u(x) for all x, hence v = u. Conclusion: every cone admits exactly one mediating map, so (L, lambda) is the universal cone and L is the limit of D in Set."
      - id: kp2
        name: Uniqueness of limits
        key_prerequisites: [universal-properties]
        constraints: "Elementless arguments from the universal property: uniqueness up to unique cone isomorphism, and joint monicity of the legs; every mediating map must be justified."
        exemplars:
          - problem: "In Set, let A = {0, 1} and B = {2, 3}. Besides the usual product cone (A x B, pi_A, pi_B), the cone with apex M, the set of pairs (b, a) with b in B and a in A, legs mu_A(b, a) = a to A and mu_B(b, a) = b to B, is also a limit of the discrete diagram with objects A and B. The universal property of A x B gives a unique cone map u: M -> A x B with pi_A o u = mu_A and pi_B o u = mu_B. Give u(3, 1) as (a, b)."
            answer: "(1, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: u is the cone map satisfying pi_A o u = mu_A and pi_B o u = mu_B, justified because M with its legs is a cone over the same diagram. Step 1 (leg conditions): for a pair (b, a) in M, the two conditions force pi_A(u(b, a)) = a and pi_B(u(b, a)) = b. Step 2 (joint monicity of the legs): so u(b, a) = (a, b) in A x B for every pair, and no other function satisfies both legs. With b = 3 and a = 1, u(3, 1) = (1, 3). The answer is (1, 3)."
          - problem: "In Set, the legs pi_A and pi_B of the product L = A x B of A = {0, 1} and B = {5, 7} are jointly monic. Let X = {p, q}, and let f: X -> A send p to 0 and q to 1, while g: X -> B sends p to 7 and q to 5. How many functions h: X -> L satisfy pi_A o h = f and pi_B o h = g?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the cone (X, f, g) over the discrete diagram with objects A and B. Step 1 (universal property of the product): the limit cone (L, pi_A, pi_B) receives a unique cone map h from (X, f, g), the mediating map, with pi_A o h = f and pi_B o h = g. Step 2 (joint monicity): the leg conditions force h(p) = (0, 7) and h(q) = (1, 5), so every function satisfying both legs agrees on all of X and only one exists. The answer is 1."
          - problem: "The positive divisors of 30 form a category: the objects are the divisors and there is one arrow d to n exactly when d divides n. In this category a product of two objects is their greatest common divisor, and isomorphic objects are equal. Uniqueness of limits then says any two products of the same pair are the same object. What is the product of 6 and 10?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the category of divisors of 30, ordered by divisibility. Step 1 (product as meet): a product of a and b here is their greatest lower bound, the greatest common divisor. Step 2 (compute): the common divisors of 6 and 10 are 1 and 2, and the greatest is 2. Step 3 (uniqueness of limits): any other product is isomorphic to this one, and in this category an isomorphism forces equality. The answer is 2."
          - problem: "In Set, let A = {0, 1} and B = {4, 5}, and let L = A x B carry the projections pi_A and pi_B. Let X = {r, s, t}, with f: X -> A given by f(r) = 0, f(s) = 1, f(t) = 1, and g: X -> B given by g(r) = 5, g(s) = 4, g(t) = 5. Since (X, f, g) is a cone over the discrete diagram with objects A and B, the universal property of L gives a unique mediating cone map h: X -> L with pi_A o h = f and pi_B o h = g. Give h(t) as (a, b)."
            answer: "(1, 5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: the cone (X, f, g) and the mediating map h to the product cone. Step 1 (universal property): because (X, f, g) is a cone, the limit gives exactly one cone map h with pi_A o h = f and pi_B o h = g. Step 2 (leg conditions): f(t) = 1 and g(t) = 5 force the first leg of h(t) to be 1 and the second leg to be 5. The answer is (1, 5)."
          - problem: "Claim: any two limit cones over the same diagram are joined by a unique cone isomorphism. Step 1: let (L, lambda) and (M, mu) be two limit cones over the diagram D. Step 2: since (M, mu) is a cone over D, the universal property of L gives a cone map u: M -> L, and u is the only function from M to L. Step 3: since (L, lambda) is a cone over D, the universal property of M gives a cone map v: L -> M. Step 4: the composites v o u and id_L are both cone maps from (L, lambda) to itself, so v o u = id_L, and likewise u o v = id_M. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it only names the two limit cones over D. Step 3 is valid: (L, lambda) is a cone over D, so the universal property of the limit (M, mu) applies and yields v. Step 4 is valid: v o u and id_L are cone maps from (L, lambda) to itself with the same legs, and the mediating map to a limit is unique among cone maps, so each composite is the identity. Step 2 is the first invalid step: the universal property makes u unique among cone maps from M to L, not among all functions from M to L. The answer is Step 2."
          - problem: "A cone (L, lambda) over a diagram D is a limit. Step 1: suppose u, v: X -> L satisfy lambda_j o u = lambda_j o v for every leg j. Step 2: the family mu_j = lambda_j o u is again a cone with apex X over D. Step 3: both u and v are cone maps from the cone (X, mu) to the cone (L, lambda), since lambda_j o u = mu_j = lambda_j o v. Step 4: therefore u = v. Which fact justifies Step 4?"
            answer: "uniqueness of the mediating map"
            answer_contract: {"kind": "label", "options": [["uniqueness of the mediating map"], ["duality with the opposite category"], ["the definition of a cocone"], ["existence of a terminal object"]]}
            solution_sketch: "Step 4 uses the fact that the mediating map to a limit is unique: u and v are cone maps from (X, mu) to (L, lambda) with the same legs, so they are the same map. The option 'duality with the opposite category' is wrong: duality yields the dual statement about colimits, not this equality. The option 'the definition of a cocone' is wrong: a cocone has legs out of its apex and belongs to colimits, not to this argument. The option 'existence of a terminal object' is wrong: existence of some object proves no equality; what is needed is that the limit is final among cones. The answer is uniqueness of the mediating map."
          - problem: "Write the full proof: any two limit cones over the same diagram D are joined by a unique isomorphism of cones. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: let (L, lambda) and (M, mu) be limit cones over D; each is, in particular, a cone over D. Step 2 (mediating maps, justified by the universal property): since (L, lambda) is a limit, the cone (M, mu) has a unique cone map u: M -> L with lambda_j o u = mu_j for every j; since (M, mu) is a limit, the cone (L, lambda) has a unique cone map v: L -> M with mu_j o v = lambda_j. Step 3: the composite v o u is a cone map from (L, lambda) to itself with legs lambda_j o v o u = lambda_j, and id_L is another such cone map; the mediating map to a limit is unique among cone maps, so v o u = id_L. Step 4: the same argument with the roles swapped gives u o v = id_M, so u and v are inverse cone maps, that is, an isomorphism of cones. Step 5 (uniqueness of the isomorphism): if w: M -> L is any cone isomorphism, its legs force w to be the mediating map for the cone (M, mu), so w = u. Therefore the two limits are joined by exactly one isomorphism of cones."
      - id: kp3
        name: Colimits by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Everything obtained by dualizing the limit story; the $\\mathbf{Set}$ colimit formula is the quotient of the disjoint union by the generated equivalence relation."
        exemplars:
          - problem: "Dual to the product of sets, which is the limit over a discrete shape, the colimit over a discrete shape is the coproduct: the disjoint union of the values, with the generated equivalence relation trivial because the shape has no arrows. A diagram in Set sends the two objects of a discrete shape to A = {p, q, r} and B = {s, t, u, v, w}. How many elements does the colimit have?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Duality: over a discrete shape the colimit is the coproduct, the dual of the product. Set colimit formula: form the disjoint union of the values; with no arrows there are no generating pairs, so the relation identifies nothing. Count: the disjoint union has 3 + 5 = 8 elements. The answer is 8."
          - problem: "A diagram in Set has two objects j and k with Dj = {1, 2, 3} and Dk = {1, 2, 3}, and a parallel pair of arrows f, g from j to k acting as Df(1)=1, Df(2)=2, Df(3)=3 and Dg(1)=1, Dg(2)=3, Dg(3)=2. The colimit is the quotient of the disjoint union of the two sets by the equivalence relation generated by x ~ Df(x) and x ~ Dg(x) for each x in Dj. How many equivalence classes does the colimit have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set colimit formula: quotient the disjoint union, 6 tagged elements, by the relation generated by x ~ Df(x) and x ~ Dg(x). Generating pairs: Df gives trivial pairs, while Dg pairs 2 with 3 and 3 with 2. Transitive closure: the classes are {1 from j, 1 from k} and {2, 3 from both sets}. The answer is 2."
          - problem: "In Set, a span diagram has A = {a1, a2} on one side, C = {c1, c2, c3} on the other, and B = {b} in the middle; the left leg maps b to a1 and the right leg maps b to c1. The pushout, the colimit of the span, is the quotient of the disjoint union of A and C by the equivalence relation generated by the paired images of each element of B. How many elements does the pushout have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set colimit formula for a span: quotient the disjoint union of A and C by the relation generated by the two images of each element of B. Generating pairs: the element b pairs a1 with c1, and no other pairs arise. Count: the disjoint union has 2 + 3 = 5 elements and one pair merges two of them, leaving 4. The answer is 4."
          - problem: "In Set, a span diagram has A = {a1, a2}, B = {b1, b2} and C = {c}; the left leg sends b1 to a1 and b2 to a2, while the right leg sends both b1 and b2 to c. The pushout is the quotient of the disjoint union of A and C by the equivalence relation generated by these pairings. How many elements does the pushout have?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set colimit formula: the generated relation is closed under symmetry and transitivity, not just the listed pairs. Generating pairs: b1 gives a1 ~ c and b2 gives a2 ~ c. Transitive closure: a1 ~ c ~ a2, so all five elements of the disjoint union lie in a single class. The answer is 1."
          - problem: "Claim: a colimit of a diagram D in a category C, when viewed in the opposite category C^op, is a limit of D there. Step 1: reverse every arrow of C to obtain C^op. Step 2: a cocone over D in C is exactly a cone over D in C^op. Step 3: a cocone that is initial in C corresponds to a cone that is initial in C^op. Step 4: a terminal cone is a limit, so the colimit of D in C is a limit of D in C^op. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: C^op has the same objects with every arrow reversed. Step 2 is valid: reversing arrows turns cocone legs into cone legs. Step 3 is not valid: duality swaps initial with terminal, so an initial cocone in C gives a terminal cone in C^op. Step 4 states the correct closing rule, that a terminal cone is a limit, and it completes the proof once Step 3 is fixed. The answer is Step 3."
          - problem: "View the divisibility poset on the set {1, 2, 3, 4, 6, 12} as a category: there is exactly one arrow from a to b when a divides b. By duality, a limit in a poset is a greatest lower bound and a colimit is a least upper bound. Take the diagram that selects the objects 4 and 6 with no nonidentity arrows between them. Compute the colimit, and give the answer as the number that labels the colimit object."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Duality in a poset: arrows are order relations, so colimits are joins, least upper bounds, dual to limits as meets. The diagram on 4 and 6 is discrete, so its colimit is the least upper bound of 4 and 6. Join: the only element of the poset divisible by both 4 and 6 is 12. The answer is 12."
          - problem: "Write the full proof: in Set, the quotient of the disjoint union of the values of a small diagram by the equivalence relation generated by x ~ Df(x), with legs sending each element to its equivalence class, satisfies the universal property of a colimit. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: form the disjoint union of the sets Dj and quotient it by the smallest equivalence relation ~ satisfying x ~ Df(x) for every element x in Dj and every arrow f from j to j'; call the quotient set U. Legs: define each leg from Dj to U by sending x to its class; the generating relations give exactly the cocone condition. Universal property: take any cocone with apex X and legs, and define a map u from U to X by sending the class of x to the value of the leg at x. Cocone condition: equivalent elements are forced to have equal leg values by chains of generating pairs, so u is independent of the representative. Uniqueness: the condition that u composed with each leg equals that leg determines u on every class, so at most one such u exists. Conclusion: U with the class legs is an initial cocone, hence a colimit, and this is exactly the dual of the limit story with all arrows reversed."
    diagnostic_exemplar:
      problem: "Prove that the legs $(\\lambda_j)$ of a limit cone $(L,\\lambda)$ over $D$ are jointly monic: if $u,v\\colon X\\to L$ satisfy $\\lambda_j u=\\lambda_j v$ for every $j$, then $u=v$."
      answer: "Set $\\mu_j=\\lambda_ju=\\lambda_jv$. The family $(\\mu_j)$ is a cone with apex $X$: for $f\\colon j\\to j'$, $Df\\circ\\mu_j=Df\\circ\\lambda_j\\circ u=\\lambda_{j'}\\circ u=\\mu_{j'}$, inheriting the cone condition from $\\lambda$. The limit's universal property supplies a UNIQUE morphism $X\\to L$ whose legs are $(\\mu_j)$; both $u$ and $v$ are such morphisms, so $u=v$."
      solution_sketch: "Show the common family $(\\lambda_j u)$ is itself a cone over $D$, inheriting the condition from $\\lambda$; then $u$ and $v$ are two mediating maps for one cone, and the uniqueness half of the limit property finishes it."
    anki_seeds:
      - front: "Formula for $\\lim D$ in $\\mathbf{Set}$?"
        back: "the set of compatible families $(x_j)$ with $Df(x_j)=x_{j'}$ for every $f\\colon j\\to j'$."
        type: basic
      - front: "Formula for $\\mathrm{colim}\\,D$ in $\\mathbf{Set}$?"
        back: "$\\big(\\coprod_j Dj\\big)/\\!\\sim$, where $x\\sim Df(x)$ for $x\\in Dj$, $f\\colon j\\to j'$."
        type: basic
      - front: "A colimit in $\\mathcal C$ is a limit in..."
        back: "$\\mathcal C^{op}$ (colimits are dual to limits)."
        type: basic

  - id: exponential-objects
    name: Exponential Objects
    core: true  # ancestor of core adjunction-examples/monad-examples (PEDAGOGY §1 invariant)
