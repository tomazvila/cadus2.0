          - problem: "A diagram D has objects D0,D1,D2 and generating arrows a:D2->D1, b:D1->D0. In the parallel-arrow case ignore the isolated unused object, so the shape has just the two incident objects. A cone with apex X has a leg li to each object Di in the shape. Identify its limit construction as pullback, equalizer or source (the source object of a chain), and recover the cone equations forced by a then b. Equation bank: 1: a after l2 = l0; 2: a after l2 = l1; 3: a after l0 = l1; 4: b after l2 = l1; 5: b after l1 = l2; 6: a after l1 = l0; 7: b after l0 = l2; 8: a after l0 = l2; 9: b after l0 = l1; 10: b after l2 = l0; 11: b after l1 = l0; 12: a after l1 = l2. Give shape and the two equation numbers in order."
            answer: "shape = source; equations = 2, 11"
            answer_contract: {"kind": "multipart", "parts": [{"name": "shape", "contract": {"kind": "label", "options": [["pullback"], ["equalizer"], ["source"]]}}, {"name": "equations", "contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}}]}
            solution_sketch: "A cone leg into the source of each diagram arrow must compose to the leg into its target. Recovering those equations distinguishes cospan, parallel-pair and chain shapes before any limit object is computed. The answer is shape = source; equations = 2, 11."
          - problem: "Write the full proof: given two parallel functions f,g:A->B in Set, construct a limiting cone for the diagram consisting of A, B, f and g. Derive its commuting condition from the shape, describe its apex and legs, and prove the required existence and uniqueness of mediating maps."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "A cone with apex X has legs u:X->A and v:X->B. The two generating arrows force f after u=v and g after u=v, so precisely the condition f after u=g after u remains, with v determined. Let E be the subset of A consisting of elements a with f(a)=g(a), and let e:E->A be the inclusion. The other leg is f after e, which equals g after e. For any cone, u(x) lies in E for every x, giving a function h:X->E with e after h=u. Its other required triangle commutes because v=f after u. Since e is an inclusion, h is the only such function. This proves the limiting property and identifies the limit as the equalizer of f and g."
      - id: kp3
        name: The universal property of a limit cone
        key_prerequisites: [cones-and-cocones]
        constraints: "Require the learner to use the universal property of a limit cone. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "In Set, let D be the discrete diagram with two objects, sent to the set A with elements 1 and 2 and the set B with elements 3 and 4. The limit cone of D is the product cone, with apex A × B and with legs p and q, the two projections. Let X be a one-element set with element 5, and form the cone over D with legs r from X to A with r(5) = 2 and s from X to B with s(5) = 3. The unique mediating map u from X to A × B must commute with every leg: p composed with u gives r and q composed with u gives s. Give the value u(5) as (a, b), an ordered pair."
            answer: "(2, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Write the full cone first: apex X with element 5, legs r(5) = 2 and s(5) = 3. Commuting rule: u must commute with every leg, so p composed with u equals r and q composed with u equals s. Existence: u(5) = (2, 3) satisfies both equations. Uniqueness: the two equations force both components of u(5), so u is unique. The answer is (2, 3)."
          - problem: "In Set, let D be the discrete diagram with two objects, sent to the set A with elements 5 and 6 and the set B with elements 7 and 8. Let X be a one-element set with element 9. Write Cone(X, D) for the set of cones over D with apex X, and let Theta send each map u from X to the product A × B to the cone whose legs are the two projections composed with u. Give the number of maps in Hom(X, A × B) and the number of cones in Cone(X, D)."
            answer: "maps = 4; cones = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "maps"}, {"contract": {"kind": "exact"}, "name": "cones"}]}
            solution_sketch: "Full object: Theta sends a map u from X to A × B to the cone whose legs are the two projections composed with u. Product rule: A × B has 2 times 2 = 4 elements, and a map from the one-element set X picks one element, so Hom(X, A × B) has 4 maps. Cone rule: a cone with apex X is a pair of legs, one map from X to A and one from X to B, giving 2 times 2 = 4 cones. Theta is a bijection because the two counts agree. The answer is maps = 4; cones = 4."
          - problem: "View the positive divisors of 72 as a category, ordered by divisibility: there is one map from x to y when x divides y. Let D send the two-object discrete shape to the objects 18 and 12. Construct the cones and their comparison arrows, and determine which cone receives a unique morphism from every cone. Find the apex of the limit cone of D."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full setup: a cone over D with apex X requires X to divide 18 and X to divide 12, so the cone apices are the common divisors 1, 2, 3 and 6. Existence of a mediating map for every cone says each common divisor divides the limit apex; uniqueness is automatic in a poset because there is at most one map between two objects. So the apex is the greatest common divisor, and gcd(18, 12) = 6. The answer is 6."
          - problem: "In Set, let D be the discrete diagram with a single object, sent to the set A with elements 2, 3 and 4. Consider the cone with apex A × A whose single leg is the first projection. Take the cone with apex A itself whose leg is the identity function; a mediating map u from A to A × A must commute with the leg, that is, the first projection applied to u(a) must equal a for every element a of A. How many such maps u are there?"
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full condition: the first projection composed with u must equal the identity on A, so u(a) = (a, b) with b free in A. Multiplication principle: each of the 3 elements of A has 3 free choices for b, giving 3 times 3 times 3 = 27 maps. Existence holds, but uniqueness fails since 27 is greater than 1, so the cone with apex A × A is not a limit cone. The answer is 27."
          - problem: "Claim: in Set, let D be the discrete diagram with a single object, sent to the set A with elements 0 and 1. The cone with apex A × A and single leg the first projection is a limit cone. Step 1: a cone over D with apex X is a function from X to A. Step 2: for such a cone with leg mu, define u from X to A × A by u(x) = (mu(x), mu(x)). Step 3: the first projection applied to u(x) gives mu(x), so u commutes with the leg. Step 4: since a mediating map exists for every cone over D, the cone satisfies the universal property, so it is a limit cone. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: a cone over a one-object discrete diagram with apex X is exactly one function from X to A. Step 2 is valid: pairing mu(x) with itself defines a function. Step 3 is valid: the first projection sends (mu(x), mu(x)) to mu(x), so u commutes with the leg. Step 4 is not valid: the universal property requires the mediating map to be unique, stated separately from existence; with the identity cone on A, u(a) = (a, a) and u(a) = (a, 0) both commute with the leg, so uniqueness fails. The answer is Step 4."
          - problem: "Let D be the discrete diagram in Set with two objects, sent to sets A and B. The product cone over D has apex A × B and legs p and q, the two projections. To prove that this cone is a limit, start from an arbitrary cone over D with apex X and legs r from X to A and s from X to B. The proof defines the mediating map u from X to A × B in one line, and that line is missing. Select the line that defines u and makes it commute with both legs p and q."
            answer: "u(x) = (r(x), s(x))"
            answer_contract: {"kind": "label", "options": [["u(x) = (r(x), s(x))"], ["u(x) = (s(x), r(x))"], ["u(x) = (r(x), r(x))"], ["u(x) = (s(x), s(x))"]]}
            solution_sketch: "The mediating map must commute with every leg: p composed with u equals r and q composed with u equals s. So the first component of u(x) is r(x) and the second is s(x). The option u(x) = (s(x), r(x)) swaps the two legs and fails both commuting equations. The option u(x) = (r(x), r(x)) uses the first leg twice and fails the second equation. The option u(x) = (s(x), s(x)) fails the first equation. The answer is u(x) = (r(x), s(x))."
          - problem: "Write the full proof: a cone over a diagram D is a limit cone if and only if it is a terminal object in the category of cones over D, stating existence and uniqueness of the mediating map separately and checking that it commutes with every leg. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, define the category of cones: an object is a cone (X, mu) over D, and a morphism from (X, mu) to (Y, nu) is a map u from X to Y in C with nu composed with u equal to mu for every object of the shape category, so a morphism of cones is exactly a map commuting with every leg. Step 2, existence: to say (L, lambda) is terminal means every cone (X, mu) admits some morphism to it; unpacking the definition, there exists a map u from X to L with lambda composed with u equal to mu for every object of the shape, which is the existence half of the universal property, and it commutes with every leg. Step 3, uniqueness: terminal also says this morphism is unique, which is the uniqueness half of the universal property, stated separately. Step 4, conclusion: the universal property holds exactly when (L, lambda) is terminal in the category of cones over D."
    diagnostic_exemplar:
      problem: "Write $\\mathrm{Cone}(X,D)$ for the set of cones over $D$ with apex $X$. Prove that a cone $(L,\\lambda)$ is a limit of $D$ iff for every object $X$ the map $\\Theta_X\\colon\\mathrm{Hom}(X,L)\\to\\mathrm{Cone}(X,D)$, $u\\mapsto(\\lambda_j\\circ u)_j$, is a bijection."
      answer: "$\\Theta_X$ is well defined: $(\\lambda_ju)_j$ is a cone since $Df\\circ\\lambda_j\\circ u=\\lambda_{j'}\\circ u$ follows from the cone condition on $\\lambda$. Surjectivity of $\\Theta_X$ for all $X$ says every cone $(X,\\mu)$ equals $(\\lambda_ju)_j$ for some $u$ — the EXISTENCE of a mediating map commuting with every leg. Injectivity says two maps inducing the same cone coincide — its UNIQUENESS. Together these are precisely the universal property of a limit cone, and conversely a limit cone makes every $\\Theta_X$ a bijection."
      solution_sketch: "Check first that $\\Theta_X$ really lands in cones, then match clause to clause: surjectivity for every $X$ is the existence of a mediating map, injectivity is its uniqueness. That dictionary runs in both directions, which is what makes the statement an iff."
    anki_seeds:
      - front: "A limit of $D$ is..."
        back: "a universal (terminal) cone over $D$: every cone factors uniquely through it."
        type: basic
      - front: "The limit over a discrete shape is a {{c1::product}}; over a parallel pair, an {{c2::equalizer}}; over a cospan, a {{c3::pullback}}."
        back: "product; equalizer; pullback"
        type: cloze
      - front: "The limit over the empty shape is..."
        back: "a terminal object."
        type: basic

  - id: initial-terminal-as-limits
    name: Initial and Terminal Objects as (Co)Limits
    core: false                # re-characterisation result; feeds only complete-categories
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: limits-as-cones
        weight: 0.5
