        try_first:
          problem: 'How many functions are there from a set with $3$ elements to a one-point set?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'Every element must go to the single point, so there is exactly $1$ function. A limit of the empty diagram must receive exactly one morphism from every object, which is the same demand.'
        constraints: "Require the learner to use the empty diagram. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: 'Take the poset with objects $1,2,3,4$ and the relations $1\le 2\le 4$ and $1\le 3\le 4$, with $2$ and $3$ incomparable, as a category with one morphism $x\to y$ exactly when $x\le y$. Which object is a limit of the empty diagram?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone over the empty diagram has no legs, so the cones are just the objects, and a morphism of cones is any morphism. The limit is the object that receives exactly one morphism from every object. The object $4$ satisfies $x\le 4$ for every $x$, and none of $1$, $2$, $3$ does, so the limit is $4$.'
          - problem: 'The possible committees of a club with members $1$, $2$ and $3$ are the subsets of $\{1,2,3\}$, ordered by inclusion and regarded as a category with one morphism $S\to T$ exactly when $S\subseteq T$. Which committee is the limit of the empty diagram?'
            answer: '1, 2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of the empty diagram is the object that receives exactly one morphism from every object. A morphism $S\to T$ exists exactly when $S\subseteq T$, so the limit must contain every other committee. That committee is $\{1,2,3\}$, the one with all of the members $1$, $2$ and $3$.'
          - problem: 'Take the poset $0\le 1\le 2$ as a category with one morphism $x\to y$ exactly when $x\le y$. Which object is a colimit of the empty diagram?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cocone under the empty diagram is just an object, and the colimit is the object that sends exactly one morphism to every object. The object $0$ satisfies $0\le x$ for every $x$, while $1$ and $2$ do not satisfy this for $x=0$. So the colimit of the empty diagram is $0$.'
          - problem: 'Sam says that the limit of the empty diagram in $\mathbf{Set}$ is the empty set, because the empty diagram contains nothing. How many elements does the limit have?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A limit of the empty diagram must receive exactly one function from every set. The empty set receives no function at all from a nonempty set, so Sam''s choice fails. A one-point set receives exactly one function from every set, so the limit has $1$ element.'
          - problem: 'Take the poset $0\le 1\le 2$ as a category with one morphism $x\to y$ exactly when $x\le y$. Is the object $2$ a limit of the empty diagram?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["no", "it is not", "it is not a limit", "not a limit", "it's not a limit", "it isn't a limit"], ["yes", "it is", "it is a limit", "a limit", "it's a limit"]]}
            solution_sketch: 'A limit of the empty diagram must receive exactly one morphism from every object. The object $2$ satisfies $x\le 2$ for $x=0$, $1$ and $2$, so it receives exactly one morphism from each of them. So $2$ is a limit of the empty diagram, whereas $0$ is not, because there is no morphism $1\to 0$.'
          - problem: 'Five nested boxes have sizes $1$ to $5$, and box $m$ fits into box $n$ exactly when $m\le n$. This makes the sizes a category with one morphism $m\to n$ exactly when $m\le n$. Which size is the limit of the empty diagram?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of the empty diagram receives exactly one morphism from every object. Every box fits into the box of size $5$, and no smaller box has this property. So the limit is the size $5$.'
          - problem: 'Take the divisors $1,2,3,4,6,12$ of $12$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. Which object is the limit of the empty diagram?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of the empty diagram receives exactly one morphism from every object, so it must be divisible by every divisor in the list. The number $12$ is divisible by $1,2,3,4,6$ and itself, and no smaller number in the list is divisible by both $4$ and $3$. So the limit is $12$.'
          - problem: 'Let $D$ be the empty diagram in a category $\mathcal C$, and let $X$ be an object of $\mathcal C$. How many cones over $D$ have the apex $X$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone over the empty diagram has one leg for each object of the empty shape, and there are none. So the cone with apex $X$ is the empty family of legs, and it satisfies every condition. There is exactly $1$ such cone.'
          - problem: 'Write the full proof that, in any category, a limit of the empty diagram is exactly a terminal object.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (the data of a cone): the empty shape has no objects and no morphisms, so a cone over the empty diagram with apex $X$ consists of zero legs and satisfies zero commuting conditions; a cone carries no data beyond its apex $X$. Step 2 (morphisms of cones): a morphism of cones from $X$ to $Y$ is a morphism $f\colon X\to Y$ in $\mathcal C$ with no leg conditions to check, so the category of cones over the empty diagram is $\mathcal C$ itself. Step 3 (limit to terminal): the limit of the empty diagram is a terminal object of the category of cones, hence a terminal object of $\mathcal C$. Step 4 (converse): if $T$ is terminal in $\mathcal C$, then $T$ as a bare apex admits exactly one morphism of cones from every cone, so $T$ is a limit of the empty diagram. Conclusion: the limits of the empty diagram are exactly the terminal objects of $\mathcal C$.'
      - id: kp2
        name: Why finite completeness needs a terminal object
        key_prerequisites: [equalizers-coequalizers]
        constraints: "Require the learner to use why finite completeness needs a terminal object. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: 'Take the whole numbers from $1$ to $10$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. How many terminal objects does this category have?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A terminal object is a number that receives an arrow from every number from $1$ to $10$, so it is divisible by all of them. The smallest such number is $2520$, which is outside the range, so there is none and the count is $0$.'
          - problem: 'Take the numbers $2,3,4,6,12$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. For how many pairs of distinct objects does the pair have no product?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A product of $m$ and $n$ is a common divisor in the list that every other common divisor in the list divides. The pairs $2,3$ and $3,4$ have no common divisor in the list, because $1$ is missing, so they have no product. Every other pair has a greatest common divisor in the list. So $2$ pairs have no product.'
          - problem: 'Let $D$ be the category with two objects $A$ and $B$, the two identity arrows, and two further arrows $f,g\colon A\to B$, with no other arrows. How many objects $E$ admit an arrow $e\colon E\to A$ with $f\circ e=g\circ e$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only arrow into $A$ is the identity $1_A$, and no arrow goes from $B$ to $A$. So the only candidate is $E=A$ with $e=1_A$. But $f\circ 1_A=f$ and $g\circ 1_A=g$, and $f\ne g$. So $0$ objects admit such an arrow, and $f,g$ have no equalizer.'
          - problem: 'A machine park has machines with cycles of $2$, $3$, $4$, $6$ and $12$ hours. Take these cycle lengths as a category with one morphism $m\to n$ exactly when $m$ divides $n$. Which cycle length is a terminal object?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A terminal object receives exactly one morphism from every object, so it must be divisible by every cycle length in the list. The number $12$ is divisible by $2$, $3$, $4$, $6$ and itself, and no smaller number in the list is divisible by both $4$ and $3$. So the terminal object is $12$.'
          - problem: 'Take the numbers $2,3,4,6$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. Does this category have a terminal object?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it does not", "it has no terminal object", "there is none", "it does not have a terminal object", "no terminal object"], ["yes", "it does", "it has a terminal object", "there is one", "it does have a terminal object"]]}
            solution_sketch: 'A terminal object would be a number in the list divisible by $2$, $3$ and $4$. The least number divisible by all three is $12$, which is not in the list. So no object receives a morphism from every object, and the category has no terminal object.'
          - problem: 'Two classes have $8$ and $12$ students. Take the divisors of $24$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. The product of $8$ and $12$ is the largest group size into which both classes split evenly. What is the product of $8$ and $12$ in this category?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A product of $8$ and $12$ is a common divisor of them that every other common divisor divides. The common divisors of $8$ and $12$ are $1$, $2$ and $4$, and all of them divide $4$. So the product is $4$, the greatest common divisor.'
          - problem: 'Sam says that the poset $(\mathbb N,\le)$ is finitely complete, because $\min(m,n)$ is a product of $m$ and $n$ and the equalizers are trivial. Sam proposes $t=7$ as a terminal object. What is the smallest natural number $x$ that has no morphism $x\to 7$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There is a morphism $x\to 7$ exactly when $x\le 7$. So the smallest number with no morphism to $7$ is $8$. The same argument works for every proposed $t$, since $t+1$ has no morphism to $t$, so $(\mathbb N,\le)$ has no terminal object.'
          - problem: 'Write the full proof that the poset $(\mathbb N,\le)$ has all binary products and all equalizers but is not finitely complete.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Binary products are greatest lower bounds, and $\min(m,n)$ always exists: it is a common lower bound, and every common lower bound $q$ satisfies $q\le\min(m,n)$. A parallel pair of arrows in a poset category is one arrow written twice, because a hom-set has at most one element, so its equalizer exists and is the identity on the source. A terminal object would be an element $t$ with $x\le t$ for every $x$, that is, a greatest element. No such element exists, because $t+1\not\le t$. So the empty diagram has no limit, and the poset is not finitely complete.'
    diagnostic_exemplar:
