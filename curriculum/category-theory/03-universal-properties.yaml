    knowledge_points:
      - id: kp1
        name: Equalizers, concretely in Set
        key_prerequisites: [universal-properties]
        constraints: "State the fork condition and the universal factorization; concrete descriptions in $\\mathbf{Set}$ (equal-locus subset) or $\\mathbf{Ab}$ (kernel of the difference)."
        exemplars:
          - problem: "In the category Set, take A = {1, 2, 3, 4, 5} and B = {p, q, r}. Define parallel maps f, g : A -> B by f(1) = p, f(2) = q, f(3) = r, f(4) = p, f(5) = q and g(1) = p, g(2) = p, g(3) = r, g(4) = p, g(5) = r. The equalizer of f and g is the equal-locus E = {a in A : f(a) = g(a)} with the inclusion e : E -> A, which satisfies the fork condition. Give the elements of E in increasing order."
            answer: "1, 3, 4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Rule: in Set the equalizer of two maps is the equal-locus, the set of elements where the two maps agree. Compare the two tables value by value: at 1 both give p, at 2 the values are q against p, at 3 both give r, at 4 both give p, at 5 the values are q against r. Keep exactly the elements where the values agree. The answer is 1, 3, 4."
          - problem: "In the category Ab of abelian groups, take the cyclic group Z/12 and the homomorphisms f, g : Z/12 -> Z/12 given by f(x) = 8x mod 12 and g(x) = 2x mod 12. The equalizer of f and g is the subgroup E = {x : f(x) = g(x)}, which is the kernel of the difference map f - g. How many elements does E have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: in Ab the equalizer of f and g is the kernel of the difference map f - g. Here f - g sends x to 8x - 2x = 6x mod 12, so E consists of the residues with 6x = 0 mod 12, that is the even residues 0, 2, 4, 6, 8, 10. Count the elements of this kernel: there are six of them. The answer is 6."
          - problem: "In the category Set, take A = {1, 2, 3, 4} and B = {c, d}. Define f, g : A -> B by f(1) = c, f(2) = d, f(3) = c, f(4) = d and g(1) = c, g(2) = d, g(3) = d, g(4) = d. Let E = {5, 6, 7} with e : E -> A given by e(5) = 1, e(6) = 2, e(7) = 4; this e satisfies the fork condition f(e(w)) = g(e(w)) for all w in E. Let X = {r, s} and m : X -> A with m(r) = 4, m(s) = 1, which satisfies f(m(t)) = g(m(t)) for all t in X. By the universal factorization there is a unique u : X -> E with m = e(u). Give the values u(r) and u(s) in that order."
            answer: "7, 5"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Rule: the universal factorization says m = e u for a unique u : X -> E. The hypothesis f(m(t)) = g(m(t)) puts every value of m in the equal-locus {1, 2, 4} of f and g. Match the values of m with the values of e: m(r) = 4 = e(7), so u(r) = 7, and m(s) = 1 = e(5), so u(s) = 5. The answer is 7, 5."
          - problem: "In the category Set, take A = {2, 4, 6, 8} and B = {y, z}. Define f, g : A -> B by f(2) = y, f(4) = z, f(6) = y, f(8) = z and g(2) = y, g(4) = y, g(6) = z, g(8) = z. Let E = {2, 4, 6} and e : E -> A be given by e(2) = 2, e(4) = 4, e(6) = 8. Determine whether e satisfies the fork condition f(e(w)) = g(e(w)) for every w in E, and give the number of elements w of E at which the two composites differ."
            answer: "verdict = fails; count = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Rule: the fork condition demands f(e(w)) = g(e(w)) for every w in E. Compute both composites: at 2 both give y, at 4 the composites give z and y, at 6 both give z. The condition breaks at exactly one element, w = 4, so e does not equalize f and g. The answer is verdict = fails; count = 1."
          - problem: "A student argues in Set: the set E = {a in A : f(a) = g(a)} with inclusion e is the equalizer of f, g : A -> B. Step 1: each a in E satisfies f(a) = g(a), so f(e(a)) = g(e(a)) and e equalizes f and g. Step 2: let m : X -> A be any map with f(m(x)) = g(m(x)) for all x in X. Step 3: then m(x) lies in E for every x in X. Step 4: define u : X -> E by u(x) = g(m(x)); then m = e(u), so e is the equalizer. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is the fork condition, true because E is by definition the set where f and g agree. Step 2 is valid: it only states the hypothesis of the universal property. Step 3 is valid: f(m(x)) = g(m(x)) says exactly that m(x) lies in E. Step 4 is the error: g(m(x)) is a value in B, not in E; the factor map must be defined by u(x) = m(x). The answer is Step 4."
          - problem: "A student verifies the universal factorization for the equalizer E = {a in A : f(a) = g(a)} with inclusion e in Set. Step 1: e equalizes f and g. Step 2: let m : X -> A be a map with f after m = g after m. Step 3: define a map u : X -> E by a certain rule; this line is smudged. Step 4: since e is injective, this u is the unique map with m = e(u). Select the line for Step 3 that makes the proof correct."
            answer: "$u(x) = m(x)$"
            answer_contract: {"kind": "label", "options": [["$u(x) = m(x)$"], ["$u(x) = f(m(x))$"], ["$u(x) = x$"], ["$u(x) = e(x)$"]]}
            solution_sketch: "Rule: the universal factorization needs a map u : X -> E with m = e u, and since e is the inclusion, u must return the same values as m; those values lie in E because f after m = g after m. The option $u(x) = m(x)$ is correct: e(u(x)) = m(x) for every x, so m = e(u). The option $u(x) = f(m(x))$ fails: f(m(x)) is a value in B, not an element of E. The option $u(x) = x$ fails: x lies in X, which need not meet E. The option $u(x) = e(x)$ fails: x is not in the domain of e, since e is defined on E. The answer is $u(x) = m(x)$."
          - problem: "Write the full proof: in Set, for maps f, g : A -> B, the inclusion e of the set E = {a in A : f(a) = g(a)} satisfies the fork condition and the universal property of the equalizer of f and g. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, fork condition: if a is in E then f(a) = g(a) by definition of E, and since e is the inclusion, f(e(a)) = g(e(a)) for all a in E, that is f after e = g after e. Step 2, existence: let m : X -> A be any map with f after m = g after m. Then f(m(x)) = g(m(x)) for every x in X, so m(x) is in E; define u : X -> E by u(x) = m(x). Because e is the inclusion, e(u(x)) = m(x), hence m = e after u. Step 3, uniqueness: if u' also satisfies m = e after u', then e(u(x)) = e(u'(x)) for all x, and e is injective, so u = u'. Conclusion: e satisfies the fork condition, and every map m that equalizes f and g factors uniquely through e, which is exactly the universal property of the equalizer."
      - id: kp2
        name: Equalizers are monomorphisms
        key_prerequisites: [commutative-diagrams]
        constraints: "Abstract proofs from the universal property alone; each use of the existence or uniqueness clause must be flagged, and no elements may be used."
        exemplars:
          - problem: "In the category of sets, let A = {1,2,3,4,5} and B = {0,1}. The map f sends 1 and 2 to 0 and sends 3, 4, 5 to 1; the map g sends every element to 0. Let e be the inclusion of the equalizer set E into A, and let X = {7,8}. How many pairs of distinct maps u, v from X to E make the composite e after u equal the composite e after v?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (equalizer in sets): f and g agree exactly on 1 and 2, so E = {1,2} and e is the inclusion. Step 2 (inclusions are injective): if e after u equals e after v, then u and v agree at 7 and at 8, so u = v. Step 3 (count): no pair of distinct maps satisfies the condition, which is the concrete face of the theorem that an equalizer is monic. The answer is 0."
          - problem: "In the category of sets, let f and g be the same map from A = {1,2,3,4} to B = {0,1}, sending 1 and 2 to 0 and 3 and 4 to 1. Let e from E to A be an equalizer of f and g that is also surjective. How many elements does E have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (equalizers are monic): in sets an equalizer is an injective map, here the inclusion of the set where f and g agree, which is all of A. Step 2 (monic plus surjective): a map that is both injective and surjective is a bijection, so E and A have the same number of elements; this is the concrete form of the theorem that an equalizer which is epic must be an isomorphism. The answer is 4."
          - problem: "In the category of sets, let A = {1,2,3,4} and B = {0,1,2}. The map f sends x to the remainder of x on division by 3; the map g sends every element to 1. Let E be the equalizer set with inclusion e, and let X = {5,6}. The map m from X to A sends 5 to 1 and 6 to 4, and f after m equals g after m. How many maps u from X to E make the composite e after u equal m?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (equalizer set): f(x) = 1 exactly for x = 1 and x = 4, so E = {1,4}. Step 2 (existence clause): since f after m equals g after m, the universal property of the equalizer gives a factorization u with e after u equal to m, namely u(5) = 1 and u(6) = 4. Step 3 (uniqueness clause): e changes nothing, so u is forced at both points and no second map works. The answer is 1."
          - problem: "In the category of sets, let A = {1,2,3,4,5,6} and B = {0,1}. The map f sends 1, 2, 3 to 0 and 4, 5, 6 to 1; the map g sends every element to 0. With X = {9,10}, how many maps m from X to A make the composite f after m equal the composite g after m?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (equalizing condition): f after m agrees with g after m exactly when both values of m lie in the set where f is 0, namely {1,2,3}. Step 2 (count the maps): each of the two points 9 and 10 has 3 allowed images, giving 3 times 3, which is 9 maps; each of these is exactly the kind of map that the existence clause of the equalizer factors through e. The answer is 9."
          - problem: "Claim: every equalizer e from E to A of the pair f, g from A to B is monic. Step 1: suppose two maps s, t from X to E satisfy e after s equal to e after t, and write m for this common composite. Step 2: then f after m equal to f after e after s equal to g after e after s equal to g after m, because e equalizes f and g. Step 3: since f after m equals g after m, the uniqueness clause of the universal property directly gives m equal to e. Step 4: it follows that s equals t, so e is monic. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid setup for left-cancellation. Step 2 is a valid use of the equalizing identity that f after e equals g after e, with no elements involved. Step 3 is not valid: the uniqueness clause applies only to factorizations through e, that is to maps from X to E, while m is a map from X to A of a different type; the proof must first invoke the existence clause to obtain factorizations and only then apply uniqueness to s and t. Step 4 would follow from that corrected argument. The answer is Step 3."
          - problem: "The abstract proof that an equalizer e from E to A of f, g from A to B is monic runs as follows. Suppose maps s, t from X to E have e after s equal to e after t; write m for the common composite from X to A. A short computation gives f after m equal to g after m. The existence clause of the universal property then gives a map w from X to E with e after w equal to m. One more line is needed before the uniqueness clause can be applied to conclude s equals t. Select the missing line."
            answer: "both s and t factor m through e"
            answer_contract: {"kind": "label", "options": [["both s and t factor m through e"], ["e factors m through f and g"], ["m factors e through s"], ["w, s and t are all the same map"]]}
            solution_sketch: "Full context: e equalizes f and g, m is the common composite with e after s equal to e after t equal to m, and w is one factorization of m through e. Step (role of uniqueness): the uniqueness clause compares two factorizations of the same map through e, so the line before it must record that s and t are themselves such factorizations. The option saying e factors m through f and g misidentifies which map is being factored and through what; the option saying m factors e through s reverses the direction of the arrows; the option saying w, s and t are all the same map states a conclusion that only uniqueness can grant, not the observation that precedes it. The answer is both s and t factor m through e."
          - problem: "Write the full proof: every equalizer e from E to A of a pair f, g from A to B is a monomorphism, using only the universal property. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: e equalizes f and g, so f after e equals g after e. Step 1: suppose maps s, t from X to E have e after s equal to e after t; write m for this common composite from X to A. Step 2 (equalizing identity): f after m equals f after e after s equals g after e after s equals g after m, using only that e equalizes the pair. Step 3 (existence clause, first flagged use): since f after m equals g after m, the universal property provides a map w from X to E with e after w equal to m. Step 4 (uniqueness clause, second flagged use): the composites e after s and e after t both equal m, so s and t are two factorizations of m through e, and uniqueness forces s equal to t. Step 5 (conclusion): e cancels on the left, so e is a monomorphism. No elements were used at any point, and each appeal to existence or to uniqueness is flagged at the step where it happens."
      - id: kp3
        name: Coequalizers by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Dualize the equalizer; concrete descriptions in $\\mathbf{Set}$ (quotient by the generated equivalence relation) or $\\mathbf{Ab}$ (cokernel of the difference)."
        exemplars:
          - problem: "In $\\mathbf{Set}$, let $A = \\{1,2,3\\}$ and $B = \\{1,2,3,4,5\\}$. Define $f,g\\colon A\\to B$ by $f(1)=1$, $f(2)=3$, $f(3)=5$ and $g(1)=2$, $g(2)=4$, $g(3)=5$. Let $Q$ be the coequalizer set, the quotient of $B$ by the smallest equivalence relation that identifies $f(a)$ with $g(a)$ for every $a$. How many elements does $Q$ have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Form the generated relation: the pairs $f(1)=1$ with $g(1)=2$ and $f(2)=3$ with $g(2)=4$ must be identified, while $f(3)=g(3)=5$ is trivial. By the concrete description of coequalizers in Set, quotient $B = \\{1,2,3,4,5\\}$ by the smallest equivalence relation containing these pairs. The classes are $\\{1,2\\}$, $\\{3,4\\}$ and $\\{5\\}$. The answer is 3."
          - problem: "In $\\mathbf{Ab}$, let $f,g\\colon \\mathbb{Z}\\to\\mathbb{Z}$ be given by $f(x)=3x$ and $g(x)=5x$. The coequalizer is the quotient of $\\mathbb{Z}$ by the subgroup generated by all $f(x)-g(x)$. How many elements does this quotient group have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the difference map: $(f-g)(x) = 3x - 5x = -2x$. Its image is the subgroup $2\\mathbb{Z}$ of $\\mathbb{Z}$. By the cokernel rule for coequalizers in Ab, the coequalizer is the quotient $\\mathbb{Z}/2\\mathbb{Z}$. A quotient of $\\mathbb{Z}$ by $2\\mathbb{Z}$ has 2 elements. The answer is 2."
          - problem: "In the category $\\mathbf{Ab}$, let $f$ and $g$ be the homomorphisms $\\mathbb{Z}\\to\\mathbb{Z}$ defined by $f(x)=2x$ and $g(x)=6x$. Their coequalizer is a cyclic group $\\mathbb{Z}/k\\mathbb{Z}$ for a whole number $k$. Give $k$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Difference map: $f(x) - g(x) = 2x - 6x = -4x$, so its image is the subgroup $4\\mathbb{Z}$. By the cokernel description of coequalizers in Ab, the coequalizer is $\\mathbb{Z}/4\\mathbb{Z}$, hence $k = 4$. As a check, $qf = qg$ holds because every $f(x)-g(x)$ lies in $4\\mathbb{Z}$. The answer is 4."
          - problem: "In $\\mathbf{Ab}$, a student computes the coequalizer of $f,g\\colon \\mathbb{Z}\\to\\mathbb{Z}$ with $f(x)=6x$ and $g(x)=x$ as $\\mathbb{Z}/6\\mathbb{Z}$, arguing that the quotient kills the image of $f$. Give the correct number of elements of the coequalizer."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The coequalizer in Ab quotients by the image of the difference, not by the image of $f$. Difference map: $f(x) - g(x) = 6x - x = 5x$, so its image is $5\\mathbb{Z}$. The quotient is $\\mathbb{Z}/5\\mathbb{Z}$, which has 5 elements. The student's error was to use $\\mathrm{im}(f) = 6\\mathbb{Z}$ instead of $\\mathrm{im}(f-g)$. The answer is 5."
          - problem: "An equalizer in $\\mathbf{Set}$ is built inside the domain $A$: it is the inclusion of the part of $A$ where $f$ and $g$ take equal values. Apply duality. Select the option that describes the coequalizer of $f,g\\colon A\\to B$ in $\\mathbf{Set}$."
            answer: "the quotient of B by the smallest equivalence relation with f(a) ~ g(a)"
            answer_contract: {"kind": "label", "options": [["the quotient of B by the smallest equivalence relation with f(a) ~ g(a)"], ["the quotient of A by the smallest equivalence relation with f(a) ~ g(a)"], ["the subset of B formed by the elements on which f and g agree"], ["the subset of A formed by the elements on which f and g agree"]]}
            solution_sketch: "Duality reverses every arrow and swaps domain with codomain, and it turns subobjects into quotients. The equalizer is a subobject of $A$, so its dual is a quotient of $B$. The option 'the quotient of A ...' keeps a quotient but wrongly stays in the domain. The option 'the subset of B ...' wrongly keeps a subobject and moves to the codomain. The option 'the subset of A ...' is the original statement, not its dual at all. The answer is the quotient of B by the smallest equivalence relation with f(a) ~ g(a)."
          - problem: "Claim: for $f,g\\colon \\{1,2\\}\\to\\{w,x,y\\}$ with $f(1)=w$, $f(2)=x$, $g(1)=x$, $g(2)=y$, the coequalizer set has exactly two classes. Step 1: the relation must identify $f(1)=w$ with $g(1)=x$. Step 2: the relation must identify $f(2)=x$ with $g(2)=y$. Step 3: since $w\\sim x$ and $x\\sim y$, transitivity forces $w\\sim y$. Step 4: therefore the classes are $\\{w,x\\}$ and $\\{y\\}$. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly lists the required identification from the input $1$. Step 2 correctly lists the required identification from the input $2$. Step 3 correctly applies transitivity of an equivalence relation to $w$, $x$ and $y$. Step 4 is not valid: since $x\\sim y$ from Step 2, the element $y$ lies in the class of $w$ and $x$, so the quotient has the single class $\\{w,x,y\\}$, not two classes. The answer is Step 4."
          - problem: "Write the full proof: in $\\mathbf{Set}$, the canonical map $q\\colon B\\to B/\\sim$, where $\\sim$ is the smallest equivalence relation on $B$ with $f(a)\\sim g(a)$ for all $a\\in A$, is the coequalizer of $f,g\\colon A\\to B$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let $\\sim$ be the smallest equivalence relation on $B$ containing every pair $(f(a),g(a))$, let $Q = B/\\sim$, and let $q\\colon B\\to Q$ send each element to its class. Step 1 ($qf = qg$): for each $a \\in A$ we have $f(a) \\sim g(a)$ by construction, so $q(f(a)) = q(g(a))$. Step 2 (universality): let $n\\colon B\\to C$ satisfy $nf = ng$; define $w\\colon Q\\to C$ by $w([b]) = n(b)$. This is well defined, because $R = \\{(b,b') : n(b) = n(b')\\}$ is an equivalence relation on $B$ containing every pair $(f(a),g(a))$ since $nf = ng$, and $\\sim$ is the smallest such relation, so $b \\sim b'$ implies $n(b) = n(b')$. Step 3 (uniqueness): $q$ is surjective since every class $[b]$ equals $q(b)$, so any $w'$ with $w'q = n$ satisfies $w'([b]) = w'q(b) = n(b) = w([b])$, hence $w' = w$. Conclusion: $q\\colon B\\to B/\\sim$ satisfies $qf = qg$ and every $n$ with $nf = ng$ factors uniquely as $n = wq$, so it is the coequalizer. $\\square$"
    diagnostic_exemplar:
      problem: "Prove that every equalizer $e\\colon E\\to A$ of $f,g\\colon A\\to B$ is a monomorphism."
      answer: "Suppose $eu=ev$ for $u,v\\colon X\\to E$, and set $m=eu=ev$. Then $fm=(fe)u=(ge)u=gm$, so $m$ equalizes $f,g$ and therefore factors through $e$ via a UNIQUE map $X\\to E$. Both $u$ and $v$ are such factorizations ($eu=m=ev$), so uniqueness gives $u=v$. Hence $e$ is left-cancellable, i.e. a monomorphism."
      solution_sketch: "From $e\\circ u=e\\circ v$, show the common composite equalizes $f$ and $g$, so it factors through $e$ by a unique map — and $u$, $v$ are both such factorizations. Left-cancellation comes from the uniqueness clause, not from any element chase."
    anki_seeds:
      - front: "Equalizer of $f,g\\colon A\\to B$?"
        back: "the universal $e\\colon E\\to A$ with $fe=ge$; in $\\mathbf{Set}$, $E=\\{a: f(a)=g(a)\\}$."
        type: basic
      - front: "Every equalizer $e\\colon E\\to A$ is what kind of morphism?"
        back: "a monomorphism."
        type: basic
      - front: "Coequalizers are always {{c1::epimorphisms}} (dual to equalizers being monos)."
        back: "epimorphisms"
        type: cloze

  - id: pullbacks-pushouts
    name: Pullbacks and Pushouts
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: products-coproducts
        weight: 0.5
        key: true
      - id: equalizers-coequalizers
        weight: 0.4
        key: true
      - id: universal-properties
