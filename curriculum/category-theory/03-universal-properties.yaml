        constraints: "Require the learner to use colimits by duality. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Construct a discrete-diagram colimit and the universal cocone map. In Set, construct the pushout of C->A and C->B with |A|=2,|B|=2, zero-based elements, and maps f=[],g=[]. A cocone to Z has leg values p=[3, 8] on A and q=[5, 2] on B. Label the pushout classes by increasing least tagged index, where A-elements have indices0..1 and B-elements have indices2..3. Give the quotient map on all tagged indices, followed by the induced map from the pushout to Z. Derive the identifications and the factorization from the cocone equations."
            answer: "0, 1, 2, 3, 3, 8, 5, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two cocone equations force identification of each paired image. The given legs are constant on the generated classes, so they descend to a unique map out of the pushout. The resulting answer is 0, 1, 2, 3, 3, 8, 5, 2."
          - problem: "Construct the colimit of this span from its cocone equations. In Set, construct the pushout of C->A and C->B with |A|=3,|B|=2, zero-based elements, and maps f=[0, 1],g=[0, 0]. A cocone to Z has leg values p=[1, 1, 4] on A and q=[1, 7] on B. Label the pushout classes by increasing least tagged index, where A-elements have indices0..2 and B-elements have indices3..4. Give the quotient map on all tagged indices, followed by the induced map from the pushout to Z. Derive the identifications and the factorization from the cocone equations."
