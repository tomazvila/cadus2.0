        constraints: "Require the learner to use definitions. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Apply the completeness definition to every diagram image, including empty. Regard [1, 2, 4] as a divisibility category. For every subset of objects, including the empty subset, construct its limit if it exists. Enumerate subsets by bit masks using the displayed object order. Give the resulting apex for each subset, with -1 for a failed universal property."
            answer: "4,1,2,1,4,1,2,1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Test the universal arrow condition against every cone or cocone apex. Including the empty subset checks the terminal or initial object required by the definition. The resulting answer is 4, 1, 2, 1, 4, 1, 2, 1."
          - problem: "Test cocompleteness by constructing all universal cocones. Regard [1, 2, 3, 6] as a divisibility category. For every subset of objects, including the empty subset, construct its colimit if it exists. Enumerate subsets by bit masks using the displayed object order. Give the resulting apex for each subset, with -1 for a failed universal property."
            answer: "1,1,2,2,3,3,6,6,6,6,6,6,6,6,6,6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
