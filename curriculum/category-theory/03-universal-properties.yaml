            answer: "u = 1, 1, 1, 1; v = 1, 1, 1, 1; E = {1, 2, 3, 4}"
            answer_contract: {"kind": "multipart", "parts": [{"name": "u", "contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}}, {"name": "v", "contract": {"kind": "list", "ordered": true, "member": {"kind": "exact"}}}, {"name": "E", "contract": {"kind": "set"}}]}
            solution_sketch: "The product has projections to A and B. Compose them with f and g to obtain the parallel maps; the equalizer includes exactly the pairs on which those maps agree. These restricted projections satisfy the pullback universal property. The answer is u = 1, 1, 1, 1; v = 1, 1, 1, 1; E = {1, 2, 3, 4}."
          - problem: "Write the full proof: a category with all binary products and all equalizers has all pullbacks. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (cospan): let f: A -> C and g: B -> C be given. Step 2 (product): form the product A x B with projections p1: A x B -> A and p2: A x B -> B. Step 3 (the two maps): define h = f p1 and k = g p2, two maps A x B -> C. Step 4 (equalizer): let e: E -> A x B be the equalizer of h and k, and set q1 = p1 e and q2 = p2 e. Step 5 (cone): since h e = k e, we get f q1 = g q2, so (E, q1, q2) is a cone over the cospan. Step 6 (mediating map): for any cone (X, x1, x2) with f x1 = g x2, the product gives a unique x: X -> A x B with p1 x = x1 and p2 x = x2; then h x = f x1 = g x2 = k x, so the equalizer gives a unique u: X -> E with e u = x, hence q1 u = x1 and q2 u = x2. Step 7 (uniqueness): u is unique because e is monic and x is unique, so (E, q1, q2) satisfies the universal property of the pullback. Conclusion: binary products and equalizers give all pullbacks."
