          - problem: "Construct the equalizer arrow and its mediating map. Parallel Set maps f,g on A={0,...,3} have value lists [0, 1, 0, 1] and [0, 0, 0, 1]. A test cone m:X->A has values [3, 0]. Construct an equalizer e:E->A from its universal property, using E={0,...,k-1} and listing e increasingly. Then construct the unique factor u:X->E with e u=m. Give the value list of e followed by the value list of u."
            answer: "0, 2, 3, 2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The equalizing equation determines the possible elements of E. The test cone factors through exactly one label for each of its values, proving the existence and uniqueness clauses. The resulting answer is 0, 2, 3, 2, 0."
          - problem: "Use the equalizing equation to build the universal factor, with zero-based finite sets. Parallel Set maps f,g on A={0,...,5} have value lists [0, 2, 4, 0, 2, 4] and [0, 0, 0, 0, 0, 0]. A test cone m:X->A has values [3, 0, 3]. Construct an equalizer e:E->A from its universal property, using E={0,...,k-1} and listing e increasingly. Then construct the unique factor u:X->E with e u=m. Give the value list of e followed by the value list of u."
            answer: "0, 3, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The equalizing equation determines the possible elements of E. The test cone factors through exactly one label for each of its values, proving the existence and uniqueness clauses. The resulting answer is 0, 3, 1, 0, 1."
          - problem: "In the category Set, take A = {1, 2, 3, 4} and B = {c, d}. Define f, g : A -> B by f(1) = c, f(2) = d, f(3) = c, f(4) = d and g(1) = c, g(2) = d, g(3) = d, g(4) = d. Let E = {5, 6, 7} with e : E -> A given by e(5) = 1, e(6) = 2, e(7) = 4; this e satisfies the fork condition f(e(w)) = g(e(w)) for all w in E. Let X = {r, s} and m : X -> A with m(r) = 4, m(s) = 1, which satisfies f(m(t)) = g(m(t)) for all t in X. By the universal factorization there is a unique u : X -> E with m = e(u). Give the values u(r) and u(s) in that order."
            answer: "7, 5"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Rule: the universal factorization says m = e u for a unique u : X -> E. The hypothesis f(m(t)) = g(m(t)) puts every value of m in the equal-locus {1, 2, 4} of f and g. Match the values of m with the values of e: m(r) = 4 = e(7), so u(r) = 7, and m(s) = 1 = e(5), so u(s) = 5. The answer is 7, 5."
          - problem: "In Set take A={2,4,6,8}, B={y,z}, and maps f,g:A->B with value lists [y,z,y,z] and [y,y,z,z] in increasing A-order. Construct their equalizer with apex a literal subset E of A and its inclusion. A map h:{0,1,2}->A has list [8,2,8]. Construct the unique factorization of h through the equalizer. Give the elements of E increasingly, followed by the factorization values encoded as zero-based positions in that list of E. Derive both the equalizer and its universal factorization."
            answer: "2, 8, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The equalizer contains exactly the inputs on which the parallel arrows agree. The inclusion then forces a factorization of h to choose its already specified values inside E, and injectivity of the inclusion proves uniqueness. The resulting answer is 2, 8, 1, 0, 1."
          - problem: "A student argues in Set: the set E = {a in A : f(a) = g(a)} with inclusion e is the equalizer of f, g : A -> B. Step 1: each a in E satisfies f(a) = g(a), so f(e(a)) = g(e(a)) and e equalizes f and g. Step 2: let m : X -> A be any map with f(m(x)) = g(m(x)) for all x in X. Step 3: then m(x) lies in E for every x in X. Step 4: define u : X -> E by u(x) = g(m(x)); then m = e(u), so e is the equalizer. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is the fork condition, true because E is by definition the set where f and g agree. Step 2 is valid: it only states the hypothesis of the universal property. Step 3 is valid: f(m(x)) = g(m(x)) says exactly that m(x) lies in E. Step 4 is the error: g(m(x)) is a value in B, not in E; the factor map must be defined by u(x) = m(x). The answer is Step 4."
          - problem: "A student verifies the universal factorization for the equalizer E = {a in A : f(a) = g(a)} with inclusion e in Set. Step 1: e equalizes f and g. Step 2: let m : X -> A be a map with f after m = g after m. Step 3: define a map u : X -> E by a certain rule; this line is smudged. Step 4: since e is injective, this u is the unique map with m = e(u). Select the line for Step 3 that makes the proof correct."
            answer: "$u(x) = m(x)$"
            answer_contract: {"kind": "label", "options": [["$u(x) = m(x)$"], ["$u(x) = f(m(x))$"], ["$u(x) = x$"], ["$u(x) = e(x)$"]]}
            solution_sketch: "Rule: the universal factorization needs a map u : X -> E with m = e u, and since e is the inclusion, u must return the same values as m; those values lie in E because f after m = g after m. The option $u(x) = m(x)$ is correct: e(u(x)) = m(x) for every x, so m = e(u). The option $u(x) = f(m(x))$ fails: f(m(x)) is a value in B, not an element of E. The option $u(x) = x$ fails: x lies in X, which need not meet E. The option $u(x) = e(x)$ fails: x is not in the domain of e, since e is defined on E. The answer is $u(x) = m(x)$."
          - problem: "Write the full proof: in Set, for maps f, g : A -> B, the inclusion e of the set E = {a in A : f(a) = g(a)} satisfies the fork condition and the universal property of the equalizer of f and g. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, fork condition: if a is in E then f(a) = g(a) by definition of E, and since e is the inclusion, f(e(a)) = g(e(a)) for all a in E, that is f after e = g after e. Step 2, existence: let m : X -> A be any map with f after m = g after m. Then f(m(x)) = g(m(x)) for every x in X, so m(x) is in E; define u : X -> E by u(x) = m(x). Because e is the inclusion, e(u(x)) = m(x), hence m = e after u. Step 3, uniqueness: if u' also satisfies m = e after u', then e(u(x)) = e(u'(x)) for all x, and e is injective, so u = u'. Conclusion: e satisfies the fork condition, and every map m that equalizes f and g factors uniquely through e, which is exactly the universal property of the equalizer."
