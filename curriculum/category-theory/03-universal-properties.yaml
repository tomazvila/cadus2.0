            solution_sketch: "The two cocone equations force identification of each paired image. The given legs are constant on the generated classes, so they descend to a unique map out of the pushout. The resulting answer is 0, 0, 1, 0, 2, 1, 4, 7."
          - problem: "Build the colimit structure maps and factor a cocone through them. In Set, construct the pushout of C->A and C->B with |A|=2,|B|=3, zero-based elements, and maps f=[0],g=[1]. A cocone to Z has leg values p=[3, 6] on A and q=[8, 3, 9] on B. Label the pushout classes by increasing least tagged index, where A-elements have indices0..1 and B-elements have indices2..4. Give the quotient map on all tagged indices, followed by the induced map from the pushout to Z. Derive the identifications and the factorization from the cocone equations."
