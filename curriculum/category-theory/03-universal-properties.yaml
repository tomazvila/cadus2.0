    knowledge_points:
      - id: kp1
        name: Equalizers, concretely in Set
        key_prerequisites: [universal-properties]
        constraints: "Require the learner to use equalizers, concretely in set. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        try_first:
          problem: 'The functions $f(x)=x^2$ and $g(x)=4$ are defined on $\{-3,-2,-1,0,1,2,3\}$. For how many numbers $x$ in this set is $f(x)=g(x)$?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The two functions agree at $x=-2$ and $x=2$ only. An equalizer keeps exactly the elements on which two maps agree, and every map that makes the two maps equal must land among them.'
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1,\dots,12\}$ and define $f,g\colon A\to\{0,1,2,3\}$ by $f(n)=n\bmod 3$ and $g(n)=n\bmod 4$. Find the equalizer of $f$ and $g$, as a subset of $A$.'
            answer: "0, 1, 2, 12"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equalizer is the set of $n$ with $f(n)=g(n)$, with the inclusion into $A$. Checking each $n$, the remainders agree for $n=0,1,2$ and $n=12$, and for no other $n$ in $A$. So the equalizer is $\{0,1,2,12\}$.'
          - problem: 'In $\mathbf{Set}$ let $A=\{1,2,3,4\}$ and $B=\{c,d\}$, with $f(1)=c$, $f(2)=d$, $f(3)=c$, $f(4)=d$ and $g(1)=c$, $g(2)=d$, $g(3)=d$, $g(4)=d$. The map $e\colon\{5,6,7\}\to A$ with $e(5)=1$, $e(6)=2$, $e(7)=4$ is an equalizer of $f$ and $g$. Let $X=\{r,s\}$ and $m\colon X\to A$ with $m(r)=4$ and $m(s)=1$. There is a unique $u\colon X\to\{5,6,7\}$ with $eu=m$. What are $u(r)$ and $u(s)$?'
            answer: "7, 5"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'The factor $u$ must satisfy $e(u(x))=m(x)$. Since $m(r)=4=e(7)$, we get $u(r)=7$, and since $m(s)=1=e(5)$, we get $u(s)=5$. The values $4$ and $1$ lie where $f$ and $g$ agree, so such a factor exists.'
          - problem: 'Let $f,g\colon\mathbb{R}\to\mathbb{R}$ be $f(x)=x^2$ and $g(x)=x+6$. Find the equalizer of $f$ and $g$ in $\mathbf{Set}$, as a subset of $\mathbb{R}$.'
            answer: "-2, 3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equalizer is the set of $x$ with $x^2=x+6$. This gives $x^2-x-6=(x-3)(x+2)=0$, so the equalizer is $\{-2,3\}$.'
          - problem: 'In $\mathbf{Ab}$ let $f,g\colon\mathbb{Z}/12\mathbb{Z}\to\mathbb{Z}/12\mathbb{Z}$ be $f(x)=5x$ and $g(x)=2x$. The equalizer is the subgroup of elements on which $f$ and $g$ agree. How many elements does it have?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The maps agree when $5x\equiv 2x$, that is when $3x\equiv 0\pmod{12}$. This holds for $x=0,4,8$, so the equalizer has $3$ elements.'
          - problem: 'Sam finds the equalizer of $f(x)=x^2$ and $g(x)=3x-2$ in $\mathbf{Set}$, as functions $\mathbb{R}\to\mathbb{R}$, and writes $\{1\}$. What is the equalizer?'
            answer: "1, 2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equalizer is the set of $x$ with $x^2=3x-2$, so $x^2-3x+2=(x-1)(x-2)=0$. Sam found the root $1$ but missed the root $2$, so the equalizer is $\{1,2\}$.'
          - problem: 'In $\mathbf{Set}$ let $f=(0,1,1)$ and $g=(0,1,0)$ be functions from $A=\{0,1,2\}$ to $\{0,1\}$, listing the values at $0,1,2$. Is the subset $\{0,2\}$ with its inclusion an equalizer of $f$ and $g$?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'The equalizer is the set of $a$ with $f(a)=g(a)$. Here $f(0)=g(0)$ and $f(1)=g(1)$, but $f(2)=1\ne 0=g(2)$, so the equalizer is $\{0,1\}$ and not $\{0,2\}$.'
          - problem: 'Two dials show the step number $n$ as its remainder modulo $5$ and modulo $7$. For the steps $n=0,1,\dots,40$, at how many steps do the two dials show the same value?'
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The dials agree when $n\bmod 5=n\bmod 7$, which is the equalizer of the two remainder maps on $\{0,\dots,40\}$. They agree for $n=0,1,2,3,4$ and for $n=35,36,37,38,39$, which is $10$ steps.'
          - problem: 'Write the full proof that in $\mathbf{Set}$, for maps $f,g\colon A\to B$, the inclusion $e$ of the set $E=\{a\in A:f(a)=g(a)\}$ satisfies the fork condition and the universal property of the equalizer of $f$ and $g$.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1, fork condition: if $a\in E$ then $f(a)=g(a)$ by definition of $E$, and since $e$ is the inclusion, $f(e(a))=g(e(a))$ for all $a\in E$, that is $fe=ge$. Step 2, existence: let $m\colon X\to A$ be any map with $fm=gm$. Then $f(m(x))=g(m(x))$ for every $x$, so $m(x)\in E$; define $u\colon X\to E$ by $u(x)=m(x)$. Because $e$ is the inclusion, $e(u(x))=m(x)$, hence $m=eu$. Step 3, uniqueness: if $u''$ also satisfies $m=eu''$, then $e(u(x))=e(u''(x))$ for all $x$, and $e$ is injective, so $u=u''$. Conclusion: $e$ satisfies the fork condition, and every $m$ with $fm=gm$ factors uniquely through $e$.'
      - id: kp2
        name: Equalizers are monomorphisms
        key_prerequisites: [commutative-diagrams]
        constraints: "Require the learner to use equalizers are monomorphisms. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar. Closed items may diagnose general proofs; require the named universal-property argument, not numerical outputs after its decisive construction is supplied."
        exemplars:
          - problem: 'In $\mathbf{Set}$ the equalizer of two maps $f,g\colon\{1,2,\dots,6\}\to B$ is the inclusion $e\colon E\to\{1,2,\dots,6\}$ of $E=\{1,6\}$. How many ordered pairs of maps $s,t\colon\{x,y\}\to E$ satisfy $es=et$?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An equalizer is a monomorphism, so $es=et$ forces $s=t$. The pairs are therefore the pairs $(s,s)$, and there are $2^2=4$ maps $s$ from $\{x,y\}$ to the two-element set $E$, giving $4$ pairs.'
          - problem: 'Is every equalizer, in any category, a monomorphism?'
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'If $es=et$, the common composite equalizes $f$ and $g$, so it factors through $e$ in exactly one way. Both $s$ and $t$ are such factorizations, so $s=t$. Hence every equalizer is a monomorphism.'
          - problem: 'Sam says that $e\colon\{1,2,3\}\to\{p,q\}$ with $e(1)=p$, $e(2)=q$ and $e(3)=q$ is the equalizer of some pair of maps out of $\{p,q\}$. Which two elements of $\{1,2,3\}$ show that Sam is wrong?'
            answer: "2, 3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An equalizer is a monomorphism, so in $\mathbf{Set}$ it is injective. Here $e(2)=e(3)=q$ with $2\ne 3$, so $e$ is not injective. Hence $e$ is not the equalizer of any pair of maps.'
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1,\dots,8\}$, and let $f(n)=n\bmod 3$ and $g(n)=n\bmod 2$, both as functions to $\{0,1,2\}$. How many maps $m\colon\{x,y,z\}\to A$ satisfy $fm=gm$?'
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A map $m$ satisfies $fm=gm$ exactly when all three of its values lie in the equalizer. The equalizer is $\{0,1,6,7\}$, with $4$ elements, so there are $4^3=64$ such maps.'
          - problem: 'Two functions $f,g\colon A\to B$ in $\mathbf{Set}$ have an equalizer with some number of elements. There are $125$ maps $m\colon\{x,y,z\}\to A$ with $fm=gm$. How many elements does the equalizer have?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The maps $m$ with $fm=gm$ are the maps from $\{x,y,z\}$ into the equalizer, so their number is $k^3$ when the equalizer has $k$ elements. Since $k^3=125$, we get $k=5$.'
          - problem: 'In $\mathbf{Set}$ let $f=(0,0,1,1)$ and $g=(0,0,0,0)$ be functions from $\{1,2,3,4\}$ to $\{0,1\}$, listing the values at $1,2,3,4$. Is the map $k\colon\{x,y,z\}\to\{1,2,3,4\}$ with $k(x)=1$, $k(y)=2$, $k(z)=4$ an equalizer of $f$ and $g$?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'An equalizer of $f$ and $g$ must satisfy $fk=gk$, so every value of $k$ must lie where $f$ and $g$ agree. Here $f(4)=1\ne 0=g(4)$, yet $k(z)=4$, so $fk\ne gk$ and $k$ is not an equalizer.'
          - problem: 'Write the full proof that every equalizer $e\colon E\to A$ of a pair $f,g\colon A\to B$ is a monomorphism, using only the universal property.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Setup: $e$ equalizes $f$ and $g$, so $fe=ge$. Step 1: suppose $s,t\colon X\to E$ satisfy $es=et$, and write $m$ for this common composite $X\to A$. Step 2 (equalizing identity): $fm=fes=ges=gm$, using only that $e$ equalizes the pair. Step 3 (existence clause): since $fm=gm$, the universal property provides a map $w\colon X\to E$ with $ew=m$. Step 4 (uniqueness clause): the composites $es$ and $et$ both equal $m$, so $s$ and $t$ are two factorizations of $m$ through $e$, and uniqueness forces $s=t$. Step 5 (conclusion): $e$ cancels on the left, so $e$ is a monomorphism. No elements were used at any point.'
      - id: kp3
        name: Coequalizers by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Require the learner to use coequalizers by duality. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $f,g\colon\{0,1\}\to\{0,1,2,3\}$ be given by $f(0)=0$, $f(1)=1$, $g(0)=1$ and $g(1)=2$. How many elements does the coequalizer of $f$ and $g$ have?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coequalizer is the quotient of $\{0,1,2,3\}$ by the smallest equivalence relation with $f(a)\sim g(a)$. Here $0\sim 1$ and $1\sim 2$, so $0,1,2$ fall in one class and $3$ stays alone. The quotient has $2$ elements.'
          - problem: 'In $\mathbf{Ab}$ let $f,g\colon\mathbb{Z}\to\mathbb{Z}$ be $f(x)=2x$ and $g(x)=6x$. The coequalizer of $f$ and $g$ is $\mathbb{Z}/n\mathbb{Z}$ for some $n$. Find $n$.'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coequalizer in $\mathbf{Ab}$ is $\mathbb{Z}/\mathrm{im}(f-g)$. The difference is $(f-g)(x)=2x-6x=-4x$, whose image is $4\mathbb{Z}$. So the coequalizer is $\mathbb{Z}/4\mathbb{Z}$, and $n=4$.'
          - problem: 'Sam computes the coequalizer of $f,g\colon\mathbb{Z}\to\mathbb{Z}$ with $f(x)=7x$ and $g(x)=x$ in $\mathbf{Ab}$ as $\mathbb{Z}/7\mathbb{Z}$, because the quotient kills the image of $f$. How many elements does the coequalizer have?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coequalizer in $\mathbf{Ab}$ is the quotient by the image of the difference $f-g$, not by the image of $f$. Here $(f-g)(x)=6x$, so the quotient is $\mathbb{Z}/6\mathbb{Z}$ with $6$ elements.'
          - problem: 'The equalizer of $f,g\colon A\to B$ in $\mathbf{Set}$ is the subset of $A$ where $f$ and $g$ agree. What is the coequalizer of $f$ and $g$: a subset of $A$, a subset of $B$, a quotient of $A$ or a quotient of $B$?'
            answer: "quotient of B by f(a) ~ g(a)"
            answer_contract: {"kind": "label", "options": [["quotient of B by f(a) ~ g(a)", "the quotient of B", "quotient of B", "a quotient of B", "B modulo f(a) ~ g(a)", "the quotient of B by the smallest equivalence relation with f(a) ~ g(a)"], ["quotient of A by f(a) ~ g(a)", "the quotient of A", "quotient of A", "a quotient of A", "A modulo f(a) ~ g(a)"], ["subset of B where f and g agree", "the subset of B", "subset of B", "a subset of B"], ["subset of A where f and g agree", "the subset of A", "subset of A", "a subset of A"]]}
            solution_sketch: 'Duality reverses every arrow, swaps the domain with the codomain, and turns subobjects into quotients. The equalizer is a subobject of $A$, so its dual is a quotient of $B$. The quotient of $A$ stays in the domain, and the two subset options keep a subobject, so they are not duals.'
          - problem: 'In $\mathbf{Set}$ let $B=\{0,1,2,3,4,5\}$ and $f,g\colon\{0,1,2\}\to B$ with $f=(0,2,4)$ and $g=(1,3,5)$, listing the values at $0,1,2$. How many functions $n\colon B\to\{x,y\}$ satisfy $nf=ng$?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $nf=ng$ says $n(0)=n(1)$, $n(2)=n(3)$ and $n(4)=n(5)$, so $n$ is constant on the three classes of the coequalizer. Each class has $2$ choices of value, giving $2^3=8$ functions.'
          - problem: 'The coequalizer of $f,g\colon A\to B$ in $\mathbf{Set}$ has some number of elements. There are $243$ functions $n\colon B\to\{0,1,2\}$ with $nf=ng$. How many elements does the coequalizer have?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Functions $n$ with $nf=ng$ correspond to functions out of the coequalizer, so their number is $3^k$ when it has $k$ elements. Since $3^k=243=3^5$, we get $k=5$.'
          - problem: 'A path has $8$ stations $1,2,\dots,8$ in a line. To make a ring, let $f,g\colon\{*\}\to\{1,\dots,8\}$ with $f(*)=1$ and $g(*)=8$, and take the coequalizer, which identifies the two end stations. How many stations does the ring have?'
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coequalizer identifies $f(*)=1$ with $g(*)=8$ and nothing else. So the $8$ stations become $8-1=7$ classes, and the ring has $7$ stations.'
          - problem: 'Write the full proof that in $\mathbf{Set}$ the canonical map $q\colon B\to B/\!\sim$, where $\sim$ is the smallest equivalence relation on $B$ with $f(a)\sim g(a)$ for all $a\in A$, is the coequalizer of $f,g\colon A\to B$.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Setup: let $\sim$ be the smallest equivalence relation on $B$ containing every pair $(f(a),g(a))$, let $Q=B/\!\sim$, and let $q$ send each element to its class. Step 1 ($qf=qg$): for each $a\in A$ we have $f(a)\sim g(a)$, so $q(f(a))=q(g(a))$. Step 2 (universality): let $n\colon B\to C$ satisfy $nf=ng$ and define $w([b])=n(b)$. This is well defined, because $R=\{(b,b''):n(b)=n(b'')\}$ is an equivalence relation containing every pair $(f(a),g(a))$, and $\sim$ is the smallest such relation, so $b\sim b''$ implies $n(b)=n(b'')$. Step 3 (uniqueness): $q$ is surjective, so any $w''$ with $w''q=n$ satisfies $w''([b])=n(b)=w([b])$, hence $w''=w$. Conclusion: $q$ is the coequalizer.'
    diagnostic_exemplar:
      problem: "Prove that every equalizer $e\\colon E\\to A$ of $f,g\\colon A\\to B$ is a monomorphism."
      answer: "Suppose $eu=ev$ for $u,v\\colon X\\to E$, and set $m=eu=ev$. Then $fm=(fe)u=(ge)u=gm$, so $m$ equalizes $f,g$ and therefore factors through $e$ via a UNIQUE map $X\\to E$. Both $u$ and $v$ are such factorizations ($eu=m=ev$), so uniqueness gives $u=v$. Hence $e$ is left-cancellable, i.e. a monomorphism."
      solution_sketch: "From $e\\circ u=e\\circ v$, show the common composite equalizes $f$ and $g$, so it factors through $e$ by a unique map — and $u$, $v$ are both such factorizations. Left-cancellation comes from the uniqueness clause, not from any element chase."
    anki_seeds:
      - front: "Equalizer of $f,g\\colon A\\to B$?"
        back: "the universal $e\\colon E\\to A$ with $fe=ge$; in $\\mathbf{Set}$, $E=\\{a: f(a)=g(a)\\}$."
        type: basic
      - front: "Every equalizer $e\\colon E\\to A$ is what kind of morphism?"
        back: "a monomorphism."
        type: basic
      - front: "Coequalizers are always {{c1::epimorphisms}} (dual to equalizers being monos)."
        back: "epimorphisms"
        type: cloze

  - id: pullbacks-pushouts
    name: Pullbacks and Pushouts
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: products-coproducts
        weight: 0.5
        key: true
      - id: equalizers-coequalizers
        weight: 0.4
        key: true
      - id: universal-properties
        weight: 0.3
      - id: commutative-diagrams
        weight: 0.2
      - id: duality-opposite-categories
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Pullbacks as fibered products in Set
        key_prerequisites: [universal-properties]
        constraints: "Require the learner to use pullbacks as fibered products in set. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        try_first:
          problem: 'A box holds red cards numbered $1,2,3,4$ and a second box holds blue cards numbered $2,4,6$. How many pairs of a red card and a blue card carry the same number?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'Only the pairs $(2,2)$ and $(4,4)$ match. Pairs whose two entries have the same image in a third set are the elements of a pullback, here over the set of numbers.'
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $A=\{1,2,3,4\}$, $B=\{1,2,3,4,5\}$ and $C=\{0,1,2\}$, with $f(a)=(a-1)\bmod 3$ and $g(b)=b\bmod 3$. How many elements does the pullback of $f$ and $g$ have?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pullback is the set of pairs $(a,b)$ with $f(a)=g(b)$. Here $f$ takes the values $0,1,2,0$ on $1,2,3,4$ and $g$ takes the values $1,2,0,1,2$ on $1,\dots,5$. Matching equal values gives $2$ pairs for the value $0$, $2$ for $1$ and $2$ for $2$, so $6$ pairs in all.'
          - problem: 'Let $A=\{1,2,4,5,8,9\}$ and $B=\{2,4,6,8,10\}$ be subsets of $C=\{1,2,\dots,10\}$, with their inclusions into $C$. The pullback of the two inclusions is isomorphic to a subset of $C$. Which elements does it contain?'
            answer: "2, 4, 8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For two inclusions the condition $f(a)=g(b)$ reads $a=b$, so the pullback is the intersection $A\cap B$. The elements common to $A$ and $B$ are $2$, $4$ and $8$.'
          - problem: 'Let $f\colon\{0,1,\dots,7\}\to\{0,1,2\}$ be $f(a)=a\bmod 3$, and let $B=\{1\}$ be a subset of $\{0,1,2\}$ with its inclusion. How many elements does the pullback of $f$ along the inclusion have?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Pulling back an inclusion along $f$ gives the preimage of $B$ under $f$. The numbers $a$ from $0$ to $7$ with $a\bmod 3=1$ are $1,4,7$, so the pullback has $3$ elements.'
          - problem: 'The objects of a category are the divisors of $30$, with exactly one morphism from $x$ to $y$ when $x$ divides $y$. What is the pullback of the morphisms $6\to 30$ and $10\to 30$?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In a poset the pullback of two morphisms into a common object is their greatest lower bound. The common divisors of $6$ and $10$ are $1$ and $2$, and the greatest is $2$. So the pullback is $2$, the greatest common divisor.'
          - problem: 'Sam says that the pullback of $f\colon A\to C$ and $g\colon B\to C$ has $|A||B|/|C|$ elements. Here $A=\{1,2,3,4\}$, $B=\{5,6,7\}$ and $C=\{0,1\}$, with $f=(0,0,0,1)$ and $g=(1,0,1)$, listing the values in order. Sam gets $4\cdot 3/2=6$. How many elements does the pullback have?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pullback has one pair for each $a$ and $b$ with $f(a)=g(b)$. The value $0$ occurs $3$ times for $f$ and once for $g$, giving $3$ pairs, and the value $1$ occurs once for $f$ and twice for $g$, giving $2$ pairs. The total is $3+2=5$, and Sam''s formula only holds when the fibers are equal in size.'
          - problem: 'Let $f\colon A\to C$ and $g\colon B\to C$ in $\mathbf{Set}$ with $A=\{5,6,7,8\}$, $B=\{5,6,7\}$ and $C=\{0,1\}$, where $f(5)=0$, $f(6)=1$, $f(7)=0$, $f(8)=1$ and $g(5)=1$, $g(6)=0$, $g(7)=0$. Let $X=\{0,1\}$ with $x_1\colon X\to A$ given by $x_1(0)=7$, $x_1(1)=6$ and $x_2\colon X\to B$ given by $x_2(0)=6$, $x_2(1)=5$, so that $fx_1=gx_2$. The universal property gives a unique $u\colon X\to A\times_C B$. What is $u(0)$?'
            answer: "(7, 6)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The two projection equations force $u(x)=(x_1(x),x_2(x))$. For $x=0$ this is $(7,6)$, and it lies in the pullback because $f(7)=0=g(6)$.'
          - problem: 'A school has three classes. Class $X$ has $20$ students and $2$ teachers, class $Y$ has $25$ students and $3$ teachers, and class $Z$ has $30$ students and $1$ teacher. How many pairs of a student and a teacher are there in which both belong to the same class?'
            answer: "145"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pairs are the pullback of the map sending a student to a class and the map sending a teacher to a class. Each class contributes students times teachers, so the count is $20\cdot 2+25\cdot 3+30\cdot 1=40+75+30=145$.'
          - problem: 'A class has $5$ teachers. The pairs of a student and a teacher that both belong to this class number $40$. How many students are in the class?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pairs in one class number students times teachers. So $5\cdot s=40$, and the number of students is $s=40/5=8$.'
          - problem: 'Write the full proof that in $\mathbf{Set}$ the pullback of the inclusion of a subset $B$ into $C$ along any function $f\colon A\to C$ is the preimage of $B$ under $f$.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (set up): let $g\colon B\to C$ be the inclusion and form the fibered product $P=\{(a,b)\in A\times B:f(a)=g(b)\}$ with the coordinate projections. Step 2 (simplify): since $g(b)=b$, a pair $(a,b)$ lies in $P$ exactly when $f(a)=b$ with $b\in B$, so the projection sending $(a,b)$ to $a$ identifies $P$ with the set of all $a\in A$ with $f(a)\in B$, which is the preimage of $B$ under $f$. Step 3 (commuting clause): the projection to $A$ followed by $f$ equals the projection to $B$ followed by $g$ on every pair. Step 4 (universal clause): any $X$ with maps $x_1$ to $A$ and $x_2$ to $B$ satisfying $fx_1=gx_2$ has $x_2=fx_1$ with values in $B$, so $u=x_1$ is the unique factorization through the preimage.'
      - id: kp2
        name: Building pullbacks from products and equalizers
        key_prerequisites: [products-coproducts]
        constraints: "Construct a pullback using a product and the equalizer of the two induced maps, or use its universal property to prove stability of monomorphisms under pullback. Closed items may construct the categorical object or diagnose assertions whose validity the learner must determine; the unmarked item asks for a full proof. Candidate claims must not be endorsed or explained by the stem."
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1,2\}$, $B=\{0,1\}$ and $C=\{0,1,2\}$, with $f=(0,1,1)$ and $g=(1,2)$, listing the values at $0,1,2$ and at $0,1$. The pullback of $f$ and $g$ is the equalizer of $f\pi_1$ and $g\pi_2$ inside the product $A\times B$. How many elements does it have?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equalizer keeps the pairs $(a,b)$ with $f(a)=g(b)$. The value of $g$ is $1$ at $b=0$ and $2$ at $b=1$, and $f(a)=1$ for $a=1,2$, so the pairs are $(1,0)$ and $(2,0)$. The pullback has $2$ elements.'
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1\}$, $B=\{0,1,2\}$ and $C=\{0,1,2\}$, with $f=(2,0)$ and $g=(0,2,2)$, listing the values at $0,1$ and at $0,1,2$. The pullback, built as the equalizer inside $A\times B$, has exactly one pair with first coordinate $1$. What is it?'
            answer: "(1, 0)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'For $a=1$ we have $f(1)=0$, and $g(b)=0$ only for $b=0$. So the only pair with first coordinate $1$ is $(1,0)$.'
          - problem: 'In a category with binary products and equalizers, the pullback of $f\colon A\to C$ and $g\colon B\to C$ is built from the product $A\times B$ with projections $\pi_1,\pi_2$. Which pair of morphisms $A\times B\to C$ is equalized?'
            answer: "f∘π1 and g∘π2"
            answer_contract: {"kind": "label", "options": [["f∘π1 and g∘π2", "fπ1 and gπ2", "f pi1 and g pi2", "f p1 and g p2", "f∘pi1 and g∘pi2", "fπ1, gπ2"], ["f∘π2 and g∘π1", "fπ2 and gπ1", "f pi2 and g pi1", "f p2 and g p1", "f∘pi2 and g∘pi1", "fπ2, gπ1"], ["π1 and π2", "pi1 and pi2", "p1 and p2", "π1, π2"], ["f and g", "f, g"]]}
            solution_sketch: 'A map $A\times B\to C$ is built from the projections followed by $f$ or by $g$. The two maps are $f\pi_1$ and $g\pi_2$, because $\pi_1$ lands in $A$, where $f$ is defined, and $\pi_2$ lands in $B$, where $g$ is defined. The equalizer keeps the pairs on which they agree.'
          - problem: 'Sam takes the pullback of $f\colon A\to C$ and $g\colon B\to C$ to be the equalizer of $f$ and $g$ themselves. Here $A=B=\{0,1,2\}$, $C=\{0,1\}$, $f=(0,0,1)$ and $g=(0,1,1)$, listing the values at $0,1,2$. Sam finds the equalizer $\{0,2\}$ with $2$ elements. How many elements does the pullback have?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pullback is the set of pairs $(a,b)$ with $f(a)=g(b)$. The value $0$ gives $2$ choices of $a$ and $1$ choice of $b$, so $2$ pairs, and the value $1$ gives $1$ choice of $a$ and $2$ choices of $b$, so $2$ pairs. The pullback has $4$ elements, since the pairs do not require $a=b$.'
          - problem: 'Three students attend classes: students $1$ and $2$ are in class $x$ and student $3$ is in class $y$. Two teachers teach: teacher $1$ teaches class $x$ and teacher $2$ teaches class $y$. The product of the students and the teachers has $6$ pairs. How many pairs of a student and a teacher in the product have both people in the same class?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pairs that share a class form the equalizer of the two class maps on the product. Students $1$ and $2$ pair with teacher $1$, and student $3$ pairs with teacher $2$, giving $2+1=3$ pairs.'
          - problem: 'In $\mathbf{Set}$ let $C=\{*\}$ be a one-element set and let $f\colon A\to C$ and $g\colon B\to C$ be the only possible maps, where $A$ has $4$ elements and $B$ has $5$ elements. How many elements does the pullback of $f$ and $g$ have?'
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $f\pi_1$ and $g\pi_2$ are both the map to the one-element set $C$, so they agree on every pair and the equalizer is the whole product. The pullback therefore has $4\cdot 5=20$ elements.'
          - problem: 'In $\mathbf{Set}$ let $g\colon B\to C$ be injective, and let $P$ be the pullback of $f\colon A\to C$ along $g$, with projection $p_1\colon P\to A$. Is $p_1$ injective?'
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'If $p_1(a,b)=p_1(a,b'')$ then $g(b)=f(a)=g(b'')$, and $g$ is injective, so $b=b''$. Hence the two pairs are equal and $p_1$ is injective. Monomorphisms are stable under pullback.'
          - problem: 'Write the full proof that a category with all binary products and all equalizers has all pullbacks.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (cospan): let $f\colon A\to C$ and $g\colon B\to C$ be given. Step 2 (product): form the product $A\times B$ with projections $p_1,p_2$. Step 3 (the two maps): define $h=fp_1$ and $k=gp_2$, two maps $A\times B\to C$. Step 4 (equalizer): let $e\colon E\to A\times B$ be the equalizer of $h$ and $k$, and set $q_1=p_1e$ and $q_2=p_2e$. Step 5 (cone): since $he=ke$, we get $fq_1=gq_2$, so $(E,q_1,q_2)$ is a cone over the cospan. Step 6 (mediating map): for any cone $(X,x_1,x_2)$ the product gives a unique $x\colon X\to A\times B$ with $p_1x=x_1$ and $p_2x=x_2$; then $hx=fx_1=gx_2=kx$, so the equalizer gives a unique $u\colon X\to E$ with $eu=x$. Step 7 (uniqueness): $u$ is unique because $e$ is monic and $x$ is unique. Conclusion: $(E,q_1,q_2)$ is the pullback.'
      - id: kp3
        name: Pushouts by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Require the learner to use pushouts by duality. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $C=\{1,2,3\}$, $A=\{a,b,c,d\}$ and $B=\{p,q,r\}$, with $f\colon C\to A$ given by $f(1)=a$, $f(2)=b$, $f(3)=b$ and $g\colon C\to B$ given by $g(1)=p$, $g(2)=q$, $g(3)=r$. How many elements does the pushout of $f$ and $g$ have?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pushout is the quotient of $A\sqcup B$ by the equivalence relation generated by $f(c)\sim g(c)$. This gives $a\sim p$, $b\sim q$ and $b\sim r$, so the classes are $\{a,p\}$, $\{b,q,r\}$, $\{c\}$ and $\{d\}$. There are $4$ classes.'
          - problem: 'Ribbon $R$ has $5$ marked points $R_1,\dots,R_5$ and ribbon $S$ has $4$ marked points $S_1,\dots,S_4$. Four spots of glue join $R_1$ to $S_1$, $R_2$ to $S_1$, $R_1$ to $S_2$ and $R_2$ to $S_2$. How many distinct points does the glued figure have?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The glued figure is the pushout of the two ribbons over the four glue spots. The ribbons have $5+4=9$ marked points in all. The four spots join $R_1$, $R_2$, $S_1$ and $S_2$ into one point, and joining four points into one removes $3$ points, not $4$. So the figure has $9-3=6$ points.'
          - problem: 'Let $C$ be a subset of both $A$ and $B$ with $A\cap B=C$, and take the two inclusions $C\to A$ and $C\to B$. The pushout of the inclusions has $20$ elements. The set $A$ has $12$ elements and $B$ has $11$. How many elements does $C$ have?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pushout glues $A$ and $B$ along $C$, so it has $|A|+|B|-|C|$ elements. Then $12+11-|C|=20$, and $|C|=23-20=3$.'
          - problem: 'In $\mathbf{Set}$ let $C=\{c,d\}$, $A=\{0,1\}$ and $B=\{2,3\}$, with $f(c)=0$, $f(d)=1$ and $g(c)=g(d)=2$. The set $P=\{u,v,w\}$ with $i_A(0)=i_A(1)=u$, $i_B(2)=u$ and $i_B(3)=v$ makes the square commute. Is $P$ with these maps a pushout of $f$ and $g$?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'The pushout identifies $0\sim 2$ and $1\sim 2$, so its classes are $\{0,1,2\}$ and $\{3\}$, which gives only $2$ elements. The set $P$ has $3$ elements, and $w$ is hit by neither map. A map from $P$ to a two-element set may send $w$ anywhere, so the factorization is not unique.'
          - problem: 'Sam says that the pushout of two injective maps $f\colon C\to A$ and $g\colon C\to B$ is just $A\sqcup B$, with no identifications. Here $|A|=4$, $|B|=3$ and $|C|=2$. How many elements does the pushout have?'
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each element $c$ of $C$ identifies $f(c)$ with $g(c)$, and these identifications involve different elements since $f$ and $g$ are injective. So $2$ pairs merge in $A\sqcup B$, which has $4+3=7$ elements, giving $7-2=5$.'
          - problem: 'In $\mathbf{Set}$ let $C=\{1,2\}$, $A=\{a,b,c\}$ and $B=\{p,q\}$, with $f(1)=f(2)=a$, $g(1)=p$ and $g(2)=q$. How many pairs $(h_1,h_2)$ of functions $h_1\colon A\to\{0,1\}$ and $h_2\colon B\to\{0,1\}$ satisfy $h_1f=h_2g$?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition says $h_1(a)=h_2(p)$ and $h_1(a)=h_2(q)$, so $a$, $p$ and $q$ must take the same value. The elements $b$ and $c$ are free, so there are $3$ independent choices of one value from $2$ options, giving $2^3=8$ pairs. This equals the number of maps from the $3$-element pushout to $\{0,1\}$.'
          - problem: 'The objects of a category are the divisors of $30$, with exactly one morphism from $x$ to $y$ when $x$ divides $y$. What is the pushout of the morphisms $2\to 6$ and $2\to 10$?'
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In a poset the pushout of two morphisms out of a common object is their least upper bound. The common multiples of $6$ and $10$ among the divisors of $30$ are only $30$. So the pushout is $30$, the least common multiple.'
          - problem: 'Write the full proof that in $\mathbf{Set}$ the quotient of the coproduct $A+B$ by the smallest equivalence relation with $f(c)\sim g(c)$ for every $c\in C$, with the maps $q_1(a)=[a]$ and $q_2(b)=[b]$, is the pushout of $f\colon C\to A$ and $g\colon C\to B$.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (coproduct): form the disjoint union $A+B$ with its two injections. Step 2 (coequalizer): let $\sim$ be the smallest equivalence relation identifying $f(c)$ with $g(c)$ for each $c\in C$, and set $Q=(A+B)/\!\sim$ with $q_1(a)=[a]$ and $q_2(b)=[b]$. Step 3 (commutativity): for each $c$, $q_1f(c)=[f(c)]=[g(c)]=q_2g(c)$, so $q_1f=q_2g$. Step 4 (universal property): if $u\colon A\to X$ and $v\colon B\to X$ satisfy $uf=vg$, define $w([t])=u(t)$ for $t\in A$ and $w([t])=v(t)$ for $t\in B$; when a class meets both summands through some $c$, the condition $uf(c)=vg(c)$ makes the two values agree, so $w$ is well defined and is the unique map with $wq_1=u$ and $wq_2=v$. Step 5 (duality): $Q$ is the coequalizer of the two maps $C\to A+B$, the dual of the pullback as a product followed by an equalizer, so $Q$ is the pushout.'
    diagnostic_exemplar:
      problem: "Prove that monomorphisms are stable under pullback: if $g\\colon B\\to C$ is mono and $(P,p_1,p_2)$ is the pullback of $f\\colon A\\to C$ along $g$, then $p_1\\colon P\\to A$ is mono."
      answer: "Take $u,v\\colon X\\to P$ with $p_1u=p_1v$. Then $g(p_2u)=f(p_1u)=f(p_1v)=g(p_2v)$ using the pullback square, and $g$ mono gives $p_2u=p_2v$. So $u$ and $v$ mediate the same cone $(p_1u,p_2u)$ over the cospan; the pullback's uniqueness clause forces $u=v$. Hence $p_1$ is a monomorphism."
      solution_sketch: "Push $p_1u=p_1v$ across the square to get $g\\circ p_2u=g\\circ p_2v$, cancel the mono $g$ so the second components agree too, then apply the pullback uniqueness clause to the single cone that both $u$ and $v$ mediate."
    anki_seeds:
      - front: "Pullback of $f\\colon A\\to C$, $g\\colon B\\to C$ in $\\mathbf{Set}$?"
        back: "$A\\times_C B=\\{(a,b): f(a)=g(b)\\}$; universal square with $fp_1=gp_2$."
        type: basic
      - front: "Pullbacks come from {{c1::products and equalizers}}; pushouts from coproducts and coequalizers."
        back: "products and equalizers"
        type: cloze

  - id: cones-and-cocones
    name: Diagrams, Cones, and Cocones
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: natural-transformations
        weight: 0.5
        key: true
      - id: functors
        weight: 0.3
      - id: products-coproducts
        weight: 0.2
      - id: commutative-diagrams
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: A cone is a natural transformation from a constant functor
        key_prerequisites: [natural-transformations]
        try_first:
          problem: 'Let $f\colon A\to B$ be a function with $A=\{1,2,3\}$, $B=\{0,1\}$, $f(1)=0$, $f(2)=0$ and $f(3)=1$. A cone over the one-arrow diagram $A\xrightarrow{f}B$ with a one-point apex has a leg to $A$ and a leg to $B$. How many such cones are there?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'The leg to $B$ is forced to be $f$ composed with the leg to $A$, so only the leg to $A$ is free, and it has $3$ choices. This is the idea of a cone: the legs must agree with the arrows of the diagram.'
        constraints: "Require the learner to use a cone is a natural transformation from a constant functor. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: 'Let $D$ be the cospan $A\xrightarrow{h}C\xleftarrow{k}B$ in $\mathbf{Set}$ with $A=\{1,2\}$, $B=\{3,4,5\}$, $C=\{0,1\}$, $h(1)=0$, $h(2)=1$, and $k(3)=0$, $k(4)=1$, $k(5)=1$. How many cones over $D$ have a one-point set as their apex?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone with a one-point apex is a choice of $a\in A$ and $b\in B$ with $h(a)=k(b)$, because the leg to $C$ is then forced. For $a=1$ we need $k(b)=0$, which gives $b=3$. For $a=2$ we need $k(b)=1$, which gives $b=4$ or $b=5$. That makes $1+2=3$ cones.'
          - problem: 'Let $D$ be the parallel pair $f,g\colon A\to B$ in $\mathbf{Set}$ with $A=\{1,2,3\}$, $B=\{0,1\}$, $f(1)=1$, $f(2)=0$, $f(3)=1$, and $g(1)=0$, $g(2)=0$, $g(3)=1$. How many cones over $D$ have a one-point set as their apex?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone with a one-point apex has a leg $\lambda_0$ to $A$, which is an element $a$, and the leg to $B$ is forced to be $f(a)=g(a)$. So $a$ must satisfy $f(a)=g(a)$. This fails at $a=1$, where $f(1)=1$ and $g(1)=0$, and it holds at $a=2$ and $a=3$. That makes $2$ cones.'
          - problem: 'A school has four students and three rooms. Students $1$, $2$ and $3$ belong to the chess club and student $4$ belongs to the music club. Room $5$ is booked by the chess club and rooms $6$ and $7$ are booked by the music club. Let $D$ be the cospan $\mathrm{Students}\to\mathrm{Clubs}\leftarrow\mathrm{Rooms}$ in $\mathbf{Set}$ given by these assignments. How many cones over $D$ have a one-point set as their apex?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone with a one-point apex picks a student and a room whose clubs agree, since both legs must reach the same club. The chess club gives $3\cdot 1=3$ choices and the music club gives $1\cdot 2=2$ choices. Together there are $3+2=5$ cones.'
          - problem: 'Let $D$ be the span $B\xleftarrow{f}A\xrightarrow{h}C$ in $\mathbf{Set}$ with $A=\{1,2,3,4\}$, $B=\{5,6\}$, $C=\{0,1,2,3\}$, $f(1)=5$, $f(2)=6$, $f(3)=5$, $f(4)=6$, and $h(1)=0$, $h(2)=2$, $h(3)=1$, $h(4)=3$. A cone over $D$ with a one-point apex $X$ has a leg $\lambda_A\colon X\to A$ that sends the point of $X$ to $3$. What value does its leg $\lambda_C\colon X\to C$ take at that point?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality at the arrow $A\to C$ of the span gives $h\circ\lambda_A=\lambda_C$. So $\lambda_C$ sends the point of $X$ to $h(\lambda_A(\text{point}))=h(3)$. The table of $h$ gives $h(3)=1$.'
          - problem: 'Let $D$ be the parallel pair $f,g\colon A\to B$ in $\mathbf{Set}$ with $A=\{4,5\}$, $B=\{4,5,6\}$, $f(4)=4$, $f(5)=6$, and $g(4)=5$, $g(5)=6$. How many cocones under $D$ have the apex $X=\{0,1\}$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cocone has a leg $h\colon B\to X$, and the leg from $A$ is then forced to be $h\circ f=h\circ g$. So the condition is $h(f(a))=h(g(a))$ for each $a\in A$, which reads $h(4)=h(5)$ and $h(6)=h(6)$. The value $h(4)=h(5)$ has $2$ choices and $h(6)$ has $2$ choices. That gives $2\cdot 2=4$ cocones.'
          - problem: 'Three employees each use two of five rooms. Employee $1$ uses rooms $1$ and $2$, employee $2$ uses rooms $3$ and $4$, and employee $3$ uses room $5$ at both of the desks. Let $f(e)$ and $g(e)$ be the two rooms of employee $e$, so that $f,g\colon E\to R$ is a parallel pair in $\mathbf{Set}$. How many cocones under this pair have the apex $\{\text{red},\text{blue}\}$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cocone has a leg $h\colon R\to\{\text{red},\text{blue}\}$ with $h(f(e))=h(g(e))$ for every employee $e$. So rooms $1$ and $2$ share a color, rooms $3$ and $4$ share a color, and room $5$ is free. That leaves $3$ independent choices of one of $2$ colors, so there are $2^3=8$ cocones.'
          - problem: 'Let $D$ be the cospan $A\xrightarrow{h}C\xleftarrow{k}B$ in $\mathbf{Set}$ with $A=\{1,2\}$, $B=\{3,4,5\}$, $C=\{0,1\}$, $h(1)=0$, $h(2)=1$, and $k(3)=0$, $k(4)=1$, $k(5)=1$. How many cones over $D$ have the two-element apex $X=\{0,1\}$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone with apex $X$ is a pair of legs $\lambda_A\colon X\to A$ and $\lambda_B\colon X\to B$ with $h\circ\lambda_A=k\circ\lambda_B$. This condition holds separately at each of the $2$ points of $X$, and at each point there are $3$ compatible pairs $(a,b)$. So there are $3\cdot 3=9$ cones.'
          - problem: 'Sam writes the naturality condition for the arrow $h\colon A\to C$ of a span as $\lambda_C\circ h=\lambda_A$. Here $A=\{1,2\}$, $C=\{0,1\}$, $h(1)=0$ and $h(2)=1$, and a cone over the span with a one-point apex $X$ has a leg $\lambda_A$ that sends the point of $X$ to $1$. With the correct naturality condition, what value does $\lambda_C$ take at the point of $X$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam''s equation does not type-check, because $\lambda_C$ has domain $X$ while $h$ has codomain $C$. The correct condition is $h\circ\lambda_A=\lambda_C$. So $\lambda_C$ sends the point of $X$ to $h(1)=0$.'
          - problem: 'Write the full proof that a cone over a diagram $D\colon\mathcal J\to\mathcal C$ with apex $X$ is exactly a natural transformation $\Delta_X\Rightarrow D$, and that for a cospan shape this unpacks to the leg equation $h\circ\lambda_A=k\circ\lambda_B$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1: define the constant functor $\Delta_X\colon\mathcal J\to\mathcal C$ by $\Delta_X(j)=X$ for every object $j$ and $\Delta_X(u)=1_X$ for every arrow $u$. Step 2: a natural transformation $\lambda\colon\Delta_X\Rightarrow D$ has one component $\lambda_j\colon X\to Dj$ per object $j$ of $\mathcal J$; these components are the legs of the cone. Step 3: naturality at an arrow $u\colon j\to j''$ reads $D(u)\circ\lambda_j=\lambda_{j''}$, which is exactly the leg equation of a cone; hence a cone over $D$ with apex $X$ is the same thing as a transformation $\Delta_X\Rightarrow D$. Step 4: for the cospan $h\colon A\to C$, $k\colon B\to C$ the legs are $\lambda_A$, $\lambda_B$, $\lambda_C$ and the equations read $h\circ\lambda_A=\lambda_C$ and $k\circ\lambda_B=\lambda_C$. Step 5: eliminating $\lambda_C$ gives $h\circ\lambda_A=k\circ\lambda_B$, and conversely such a pair determines $\lambda_C$ uniquely, so a cone over the cospan is exactly such a pair of legs.'
      - id: kp2
        name: The category of cones
        key_prerequisites: [products-coproducts]
        constraints: "Give the leg-commuting condition for cone/cocone morphisms and name which extremal object (terminal/initial) yields the (co)limit."
        exemplars:
          - problem: 'Take the whole numbers from $1$ to $18$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. Let $D$ be the discrete diagram with the two objects $12$ and $8$. A cone over $D$ with apex $x$ is a morphism $x\to 12$ together with a morphism $x\to 8$, and a morphism of cones is a morphism between the apexes that commutes with the legs. The limit of $D$ is the terminal object of the category of cones. What is its apex?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone with apex $x$ exists exactly when $x$ divides both $12$ and $8$, so the apexes are $1$, $2$ and $4$. A morphism of cones from $x$ to $y$ exists exactly when $x$ divides $y$. The terminal cone receives a morphism from every cone, so its apex is divisible by $1$, $2$ and $4$; that apex is $4$, the greatest common divisor of $12$ and $8$.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the discrete diagram with the two objects $B_1=\{p,q\}$ and $B_2=\{r,s\}$. The cone $(X,\lambda)$ has apex $X=\{u,v\}$ and legs $\lambda_1(u)=p$, $\lambda_1(v)=q$, $\lambda_2(u)=r$, $\lambda_2(v)=s$. The cone $(Y,\mu)$ has apex $Y=\{w,z,t\}$ and legs $\mu_1(w)=p$, $\mu_1(z)=q$, $\mu_1(t)=p$, $\mu_2(w)=r$, $\mu_2(z)=s$, $\mu_2(t)=r$. A morphism of cones $(X,\lambda)\to(Y,\mu)$ is a function $h\colon X\to Y$ with $\mu_1\circ h=\lambda_1$ and $\mu_2\circ h=\lambda_2$. How many morphisms of cones are there from $(X,\lambda)$ to $(Y,\mu)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leg condition must hold at every point of $X$. For $x=u$ we need $\mu_1(h(u))=p$ and $\mu_2(h(u))=r$, which holds for $h(u)=w$ and for $h(u)=t$, so there are $2$ choices. For $x=v$ we need $\mu_1(h(v))=q$ and $\mu_2(h(v))=s$, which holds only for $h(v)=z$. So there are $2\cdot 1=2$ morphisms.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the discrete diagram with the two objects $B_1=\{a\}$ and $B_2=\{b\}$. The cocone $(X,\gamma)$ has nadir $X=\{x_1,x_2,x_3\}$ and legs $\gamma_1(a)=x_1$ and $\gamma_2(b)=x_2$. The cocone $(Y,\delta)$ has nadir $Y=\{y_1,y_2,y_3\}$ and legs $\delta_1(a)=y_1$ and $\delta_2(b)=y_1$. A morphism of cocones $(X,\gamma)\to(Y,\delta)$ is a function $h\colon X\to Y$ with $h\circ\gamma_1=\delta_1$ and $h\circ\gamma_2=\delta_2$. How many morphisms of cocones are there from $(X,\gamma)$ to $(Y,\delta)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first leg condition says $h(x_1)=\delta_1(a)=y_1$, so there is $1$ choice. The second says $h(x_2)=\delta_2(b)=y_1$, so there is $1$ choice. The point $x_3$ lies on no leg, so $h(x_3)$ is any of the $3$ points of $Y$. That gives $1\cdot 1\cdot 3=3$ morphisms.'
          - problem: 'Take the whole numbers from $1$ to $40$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. Sam says that the limit of the discrete diagram on $18$ and $30$ is the initial object of its category of cones, so he takes the cone with a morphism to every other cone, whose apex is $1$. What is the apex of the actual limit, the terminal cone?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cones over the diagram have the apexes $1$, $2$, $3$ and $6$, the common divisors of $18$ and $30$. A morphism of cones from $x$ to $y$ exists exactly when $x$ divides $y$. Sam''s apex $1$ sends a morphism out of itself to every cone, so it is initial. The limit is terminal, so it receives a morphism from every cone, and that apex is $6$.'
          - problem: 'Two lamps blink every $6$ seconds and every $10$ seconds. Take the whole numbers from $1$ to $60$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. A cocone under the discrete diagram on $6$ and $10$ has a nadir $x$ that both $6$ and $10$ divide, and the colimit is the initial cocone. Find the nadir of the colimit. The two lamps blink together for the first time at that second.'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cocone has a nadir $x$ that is a multiple of both $6$ and $10$, so the nadirs in the range are $30$ and $60$. A morphism of cocones from $x$ to $y$ exists exactly when $x$ divides $y$. The initial cocone sends a morphism to every other cocone, and $30$ divides $60$. So the nadir of the colimit is $30$, the least common multiple of $6$ and $10$.'
          - problem: 'Take the whole numbers from $1$ to $20$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. Does the discrete diagram on $6$ and $10$ have a colimit in this category?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it does not", "it has no colimit", "there is no colimit", "none", "it does not have a colimit", "no colimit exists", "it doesn't"], ["yes", "it does", "it has a colimit", "there is a colimit", "it does have a colimit"]]}
            solution_sketch: 'A cocone under the diagram needs a nadir $x$ with $6\mid x$ and $10\mid x$. The smallest such number is $30$, which lies outside the range from $1$ to $20$. So the category has no cocone under the diagram at all, and therefore it has no initial cocone and no colimit.'
          - problem: 'A square tile of side $x$ centimeters covers a $36$ cm by $48$ cm floor without cutting when $x$ divides both $36$ and $48$. Take the whole numbers from $1$ to $60$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. Find the apex of the limit of the discrete diagram on $36$ and $48$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone over the diagram has an apex $x$ that divides both $36$ and $48$, so the apexes are the common divisors $1$, $2$, $3$, $4$, $6$ and $12$. The terminal cone receives a morphism from each of them, so its apex is divisible by all of them. That apex is $12$, the greatest common divisor of $36$ and $48$.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the discrete diagram with the two objects $B_1=\{p,q\}$ and $B_2=\{r,s\}$. The cone $(Z,\nu)$ has apex $Z=\{1,2,3,4,5\}$ with legs $\nu_1=(p,p,q,q,p)$ and $\nu_2=(r,s,r,s,r)$, listed as the values at $1,2,3,4,5$. Let $(P,\pi)$ be the cone whose apex is a one-point set with $\pi_1=p$ and $\pi_2=r$. How many morphisms of cones are there from $(P,\pi)$ to $(Z,\nu)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism of cones from the one-point cone sends the point to some $z\in Z$ with $\nu_1(z)=p$ and $\nu_2(z)=r$. The elements with $\nu_1(z)=p$ are $1$, $2$ and $5$. Of these, $\nu_2(z)=r$ holds for $1$ and $5$. So there are $2$ morphisms, and $(Z,\nu)$ is not terminal.'
          - problem: 'Write the full proof that, for a diagram $D$ in a category $\mathcal C$, the cones over $D$ and their morphisms form a category $\mathrm{Cone}(D)$, and that a terminal object of $\mathrm{Cone}(D)$ is a limit of $D$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Definition: a morphism of cones from $(X,\lambda)$ to $(Y,\mu)$ is a morphism $h\colon X\to Y$ in $\mathcal C$ with $\mu_j\circ h=\lambda_j$ for every object $j$ of $\mathcal J$; this is the leg-commuting condition. Step 1, identities: for a cone $(X,\lambda)$ the identity $1_X$ satisfies $\lambda_j\circ 1_X=\lambda_j$, so it is a morphism of cones from $(X,\lambda)$ to itself. Step 2, composition: if $h$ goes from $(X,\lambda)$ to $(Y,\mu)$ and $k$ goes from $(Y,\mu)$ to $(Z,\nu)$ and both commute with the legs, then $\nu_j\circ k\circ h=\mu_j\circ h=\lambda_j$, so $k\circ h$ is a morphism of cones. Step 3, laws: identities and composites are those of $\mathcal C$, so associativity and the identity laws are inherited and $\mathrm{Cone}(D)$ is a category. Step 4, limit: let $(L,\lambda)$ be terminal in $\mathrm{Cone}(D)$; then every cone $(X,\gamma)$ admits exactly one morphism of cones $h\colon X\to L$ with $\lambda_j\circ h=\gamma_j$, which is exactly the universal property of the limit cone. Hence a terminal object of $\mathrm{Cone}(D)$ is a limit of $D$.'
    diagnostic_exemplar:
      problem: "For the parallel-pair diagram $D=(f,g\\colon A\\to B)$, show that a cone over $D$ with apex $X$ amounts to a single morphism $\\lambda_0\\colon X\\to A$ satisfying $f\\lambda_0=g\\lambda_0$."
      answer: "A cone is a natural transformation $\\Delta_X\\Rightarrow D$ with legs $\\lambda_0\\colon X\\to A$ and $\\lambda_1\\colon X\\to B$. Naturality at the two parallel arrows forces $f\\circ\\lambda_0=\\lambda_1$ and $g\\circ\\lambda_0=\\lambda_1$. So $\\lambda_1$ is determined by $\\lambda_0$, and the two conditions collapse to $f\\lambda_0=g\\lambda_0$: the cone data is exactly a fork $\\lambda_0$ over the pair."
      solution_sketch: "Write out the naturality condition at each of the two parallel arrows: each one forces $\\lambda_1$ to equal one of $f\\lambda_0$, $g\\lambda_0$. So $\\lambda_1$ is redundant and the two conditions fuse into the single fork equation."
    anki_seeds:
      - front: "A cone over a diagram $D$ with apex $X$ is..."
        back: "a natural transformation $\\Delta_X\\Rightarrow D$: legs $\\lambda_j\\colon X\\to Dj$ with $Df\\circ\\lambda_j=\\lambda_{j'}$."
        type: basic
      - front: "A morphism of cones $(X,\\lambda)\\to(Y,\\mu)$ is..."
        back: "a map $h\\colon X\\to Y$ with $\\mu_j\\circ h=\\lambda_j$ for all $j$."
        type: basic

