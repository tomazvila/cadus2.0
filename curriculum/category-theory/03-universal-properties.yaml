        constraints: "Require the learner to use exponentials via currying in set. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Construct an exponential transpose from its evaluation equation. In Set, g:X x A->B has rows [[0, 1], [1, 0]], where rows index X and columns index A, all starting at0; B={0,...,1}. Let r:Xprime->X have values [0, 1] and s:B->C have values [0, 1]. Construct the transpose of s g (r x id_A) from the evaluation equation, and establish its agreement with applying r and the induced map s^A to the transpose of g. Take C={0,...,1}. Enumerate C^A lexicographically from0. Give the function index assigned to each Xprime element."
            answer: "1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The evaluation equation determines each function value and hence the unique transpose. Checking the same evaluation after pre- and postcomposition proves naturality of the curry correspondence. The resulting answer is 1, 2."
          - problem: "Build the unique arrow into the exponential without a cardinality shortcut. In Set, g:X x A->B has rows [[2, 0], [1, 2]], where rows index X and columns index A, all starting at0; B={0,...,2}. Let r:Xprime->X have values [0, 1] and s:B->C have values [0, 1, 2]. Construct the transpose of s g (r x id_A) from the evaluation equation, and establish its agreement with applying r and the induced map s^A to the transpose of g. Take C={0,...,2}. Enumerate C^A lexicographically from0. Give the function index assigned to each Xprime element."
            answer: "6, 5"
