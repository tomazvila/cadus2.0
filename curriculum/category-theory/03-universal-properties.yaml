unit: universal-properties
course: category-theory
module: "Universal Properties & (Co)Limits"
topics:
  - id: universal-properties
    name: Universal Properties
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: initial-terminal-objects
        weight: 0.5
        key: true
      - id: commutative-diagrams
        weight: 0.4
        key: true
      - id: slice-categories
        weight: 0.2
      - id: duality-opposite-categories
        weight: 0.0
      # Phase C reconciliation: kp1's second exemplar exhibits the free group $F(S)$
      # as the initial object of $(S \downarrow U)$ — the universal property taught by
      # free-groups-presentations kp2 ("generators map freely"). First CT consumer;
      # puts the free group in the closure of everything downstream of this topic.
      - id: free-groups-presentations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: A universal property is an initial or terminal object
        key_prerequisites: [initial-terminal-objects, free-groups-presentations]
        constraints: "Name the auxiliary category (objects and morphisms) explicitly before locating the universal object; instances limited to terminal objects and the free group $F(S)$."
        exemplars:
          - problem: "Explain the slogan 'a universal property = an initial or terminal object of an auxiliary category', using the terminal object as the base case."
            answer: "The universal object is initial/terminal among candidate structures, hence unique up to unique iso."
            solution_sketch: "To define an object by a universal property, form an auxiliary category whose objects are all candidate structures and whose morphisms are the structure-preserving comparison maps; the universal object is the initial (or dually terminal) object there. Because initial/terminal objects are unique up to a unique isomorphism, any object defined by a universal property is determined up to unique isomorphism. The plain terminal object of $\\mathcal C$ is the degenerate case where the auxiliary category is $\\mathcal C$ itself."
          - problem: "Illustrate the slogan with the free group $F(S)$: exhibit it as the initial object of an auxiliary category."
            answer: "$F(S)$ is initial among pairs $(G,f\\colon S\\to U(G))$; the unique comparison map is the induced homomorphism $\\bar f$."
            solution_sketch: "Form the category whose objects are pairs $(G,f\\colon S\\to U(G))$ of a group with a set-map from $S$ to its underlying set, and whose morphisms $(G,f)\\to(H,g)$ are homomorphisms $h$ with $U(h)\\circ f=g$. The free group $(F(S),\\eta)$ is the INITIAL object: for every $(G,f)$ there EXISTS a unique homomorphism $\\bar f\\colon F(S)\\to G$ with $U(\\bar f)\\circ\\eta=f$. Initiality (unique map out) is dual to the terminal base case (unique map in), and forces $F(S)$ to be unique up to unique isomorphism."
      - id: kp2
        name: The existence-and-uniqueness template
        key_prerequisites: [commutative-diagrams]
        constraints: "Separate the EXISTS and UNIQUE clauses explicitly and say which clause each proof step uses; concrete instances use only the terminal object."
        exemplars:
          - problem: "A universal property of an object U is one statement about maps X -> U, built from two clauses. Select the statement that correctly gives the general form of such a property."
            answer: "for every X a morphism exists, unique among those making the diagram commute"
            answer_contract: {"kind": "label", "options": [["for every X a morphism exists, unique among those making the diagram commute"], ["for every X a morphism exists, and every morphism makes the diagram commute"], ["for some X a morphism exists, unique among those making the diagram commute"], ["for every X at most one morphism exists, and none make the diagram commute"]]}
            solution_sketch: "The template: the existence clause says a morphism X -> U exists, and the uniqueness clause says it is the only one making the defining diagram commute. The option 'and every morphism makes the diagram commute' deletes the uniqueness clause. The option 'for some X' weakens the existence clause to a single object. The option 'at most one morphism exists, and none make the diagram commute' keeps at-most-one but breaks the existence clause. The answer is for every X a morphism exists, unique among those making the diagram commute."
          - problem: "In the category Set, take the one-point set 1 = {7} as the terminal object. Let f and g be any two functions from {1, 2, 3} to 1. Using the uniqueness clause of the universal property of 1, give the value of g(2)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the value g(2) of a function {1, 2, 3} -> {7}. Step 1 (existence clause): a morphism {1, 2, 3} -> 1 exists, namely the constant function to 7. Step 2 (uniqueness clause): the defining diagram for the terminal object is empty, so any two morphisms into 1 coincide, hence g is that constant function. Step 3 (evaluate): g(2) = 7. The answer is 7."
          - problem: "View the poset with elements 2, 3, 5 and 30, ordered by divisibility, as a category: a morphism from d to m is the fact that d divides m. The element 30 is the greatest element, hence the terminal object of this category. How many morphisms are there from 5 to the terminal object?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the hom-set from 5 to 30 in the poset category of divisors of 30. Step 1 (existence clause): 5 divides 30, so there is at least one morphism 5 -> 30. Step 2 (uniqueness clause): in a poset each hom-set has at most one element, so there is at most one such morphism. Step 3 (combine the clauses): exactly one morphism. The answer is 1."
          - problem: "Claim: in any category, if 1 is a terminal object, then any two morphisms f, g: X -> 1 are equal. Step 1: the universal property of 1 has two clauses: for every object X there exists a morphism X -> 1, and this morphism is unique among all morphisms from X to 1. Step 2: f is a morphism from X to 1. Step 3: g is a morphism from X to 1. Step 4: by the existence clause, f = g. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly separates the two clauses of the universal property of the terminal object, so it is valid. Step 2 is valid: f is given as a morphism X -> 1. Step 3 is valid: g is given as a morphism X -> 1. Step 4 cites the wrong clause: the existence clause only produces some morphism, while the uniqueness clause is what forces two morphisms into 1 to coincide. The answer is Step 4."
          - problem: "Claim: in the category Set, with the one-point set 1 = {0}, there is exactly one function from 1 to the set {0, 1}. Step 1: in Set, the one-point set is a terminal object. Step 2: its universal property gives, for every set X, a unique function X -> 1. Step 3: take X = 1; the universal property then gives exactly one function from 1 to {0, 1}. Step 4: therefore the claim holds. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: a one-point set is terminal in Set. Step 2 is valid: it states both clauses in the correct direction, with maps going into 1. Step 3 is not valid: taking X = 1 the property gives a unique function 1 -> 1, not a function from 1 to {0, 1}; in fact there are two functions from {0} to {0, 1}. Step 4 would follow from a corrected Step 3, so it is not the first failure. The answer is Step 3."
          - problem: "In the category Set, take the one-point set 1 = {3} as the terminal object. Let f be the function from {1, 2} to 1 with f(1) = 3 and f(2) = 3, and let g be any function from {1, 2} to 1. Using the uniqueness clause of the universal property of 1, give the value of g(1) + g(2)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the sum g(1) + g(2) for a function g into the one-point set {3}. Step 1 (uniqueness clause): any two morphisms into the terminal object coincide, so g = f. Step 2 (evaluate): g(1) = f(1) = 3 and g(2) = f(2) = 3. Step 3 (add): 3 + 3 = 6. The answer is 6."
          - problem: "Write the full proof: in any category with a terminal object 1, any two morphisms f, g: X -> 1 are equal, and name at each step which clause of the universal property is used. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "State the universal property with separated clauses: for every object X there exists a morphism X -> 1, and it is unique among all morphisms X -> 1, because the defining diagram of the terminal object is empty. Step 1 (existence clause): there is a morphism from X to 1. Step 2: f and g are morphisms from X to 1, so both are candidates for that unique map. Step 3 (uniqueness clause): only one morphism X -> 1 exists, so f and g each equal it. Conclusion: f = g, which is the prototype of every uniqueness argument driven by a universal property."
      - id: kp3
        name: Universal properties as represented functors
        key_prerequisites: [initial-terminal-objects]
        constraints: "Exhibit the bijection $\\mathrm{Hom}(X,U)\\cong S(X)$ with the candidate-structure functor $S$ named; instances limited to terminal objects and binary products."
        exemplars:
          - problem: "View the divisibility poset on {1, 2, 3, 5, 6, 10, 15, 30} as a category: a single arrow from x to y exactly when x divides y. Let S be the one-point candidate-structure functor, S(x) = {t} for every object x. The terminal object is the element u for which Hom(x, u) is a singleton for every x, matching S(x). Give u."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The terminal object u must satisfy a bijection Hom(x, u) = S(x) for every x, and since S(x) is a one-point set, each Hom(x, u) must be a singleton. In a poset category Hom(x, u) is a singleton exactly when x divides u. So u must be divisible by every element: by 1, 2, 3, 5, 6, 10 and 15. The only such element is 30, and there is exactly one arrow from each x to 30. The answer is 30."
          - problem: "Make a category from the divisibility order on {1, 2, 3, 4, 6, 12}: one arrow from x to y exactly when y is a multiple of x. Let S be the candidate-pair functor S(x) = Hom(x, 4) x Hom(x, 6), which has one element exactly when x divides both 4 and 6. The product of 4 and 6 is the element u with a bijection Hom(x, u) = S(x) for every x. Give u."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The functor is S(x) = Hom(x, 4) x Hom(x, 6); a pair of arrows exists exactly when x divides both 4 and 6. The elements dividing both 4 and 6 are 1 and 2, so S(x) is a singleton exactly for x in {1, 2}. The representing element u must have exactly 1 and 2 below it, and since 1 divides 2, u = 2, the greatest lower bound of 4 and 6. The answer is 2."
          - problem: "Work in the category of sets. Let A = {1, 2} and B = {3, 4, 5}, and let S be the candidate-pair functor S(X) = Hom(X, A) x Hom(X, B). Take X to be the one-point set {p}. Give the number of elements of S(X)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The functor is S(X) = Hom(X, A) x Hom(X, B) with A = {1, 2} and B = {3, 4, 5}. A map from the one-point set X = {p} to A is a choice of an element of A, so Hom(X, A) has 2 elements; the same reasoning gives 3 elements in Hom(X, B). The product rule for sizes gives 2 times 3 = 6. The answer is 6."
          - problem: "Work in the category of sets with A = B = {0, 1}. Let P = {0, 1} carry two structure maps pi1 and pi2, both the identity. A student claims that P is a product of A and B. Test the claim with X = {0, 1}, f the identity on X, and g the swap sending 0 to 1 and 1 to 0. Give the number of maps u from X to P with pi1 after u = f and pi2 after u = g."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both structure maps on P are the identity, so the two required equations read u(x) = f(x) = x and u(x) = g(x) = 1 - x for every x in X. At x = 0 these demand u(0) = 0 and u(0) = 1 at the same time, which is impossible. So no map u exists, the existence clause of the universal property fails, and P is not a product of A and B. The answer is 0."
          - problem: "Here is an attempted argument that in the category of sets the product of A and B fails to represent the candidate-pair functor S(X) = Hom(X, A) x Hom(X, B). Step 1: send each map u from X to A x B to the pair (pi1 after u, pi2 after u). Step 2: suppose two maps u and v are sent to the same pair. Step 3: equality after both structure maps does not force u = v. Step 4: so the assignment is not injective and cannot be a bijection. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid definition of the assignment from Hom(X, A x B) to S(X). Step 2 is a legitimate supposition about two maps. Step 3 is the first invalid step: the two structure maps of a product are jointly monic, so equality after both does force u = v, by the uniqueness clause of the universal property. Step 4 rests on the false Step 3, so it is not the first failure. The answer is Step 3."
          - problem: "Let A x B be a product in the category of sets with structure maps pi1 and pi2. Step 1: take u and v from X to A x B. Step 2: suppose pi1 after u = pi1 after v and pi2 after u = pi2 after v. Step 3: conclude u = v. Which hypothesis does Step 3 use?"
            answer: "uniqueness of the comparison map"
            answer_contract: {"kind": "label", "options": [["uniqueness of the comparison map"], ["surjectivity of pi1 onto A"], ["naturality of the bijection in X"], ["existence of an arrow into A x B"]]}
            solution_sketch: "Both u and v are comparison maps for the same candidate pair (pi1 after u, pi2 after u). The option 'surjectivity of pi1 onto A' fails: product structure maps need not be surjective, and surjectivity gives no equality of maps. The option 'naturality of the bijection in X' concerns behavior under precomposition, not equality of two maps. The option 'existence of an arrow into A x B' produces some map, not the equality u = v. By the uniqueness clause of the universal property there is only one comparison map per pair, so u = v. The answer is uniqueness of the comparison map."
          - problem: "Write the full proof: in the category of sets, the product A x B with its structure maps pi1 and pi2 represents the candidate-pair functor S(X) = Hom(X, A) x Hom(X, B) via the bijection sending u to the pair (pi1 after u, pi2 after u), natural in X. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (definition): for each map u from X to A x B, set Phi of u = (pi1 after u, pi2 after u), an element of S(X) = Hom(X, A) x Hom(X, B). Step 2 (injectivity): if Phi of u = Phi of v, then u and v are both comparison maps for the same pair (f, g), and the uniqueness clause of the universal property gives a single such map, so u = v. Step 3 (surjectivity): given (f, g) in S(X), the existence clause of the universal property of the product yields a map u from X to A x B with pi1 after u = f and pi2 after u = g, so Phi of u = (f, g). Step 4 (naturality): for any map h from Y to X, Phi of (u after h) = (f after h, g after h), which is the pair (Phi of u) acted on by h componentwise, so Phi commutes with precomposition; this is exactly naturality in X. Conclusion: Phi is a bijection Hom(X, A x B) = S(X), natural in X, so the product A x B represents the candidate-pair functor S."
    diagnostic_exemplar:
      problem: "State the universal property of the product $A\\times B$ and use it to prove that $u\\mapsto(\\pi_1\\circ u,\\,\\pi_2\\circ u)$ is a bijection $\\mathrm{Hom}(X,A\\times B)\\cong\\mathrm{Hom}(X,A)\\times\\mathrm{Hom}(X,B)$."
      answer: "The universal property: for every pair $f\\colon X\\to A$, $g\\colon X\\to B$ there EXISTS a morphism $u\\colon X\\to A\\times B$ with $\\pi_1 u=f$, $\\pi_2 u=g$, and it is UNIQUE. Surjectivity of the map $u\\mapsto(\\pi_1 u,\\pi_2 u)$ is exactly the existence clause: every pair $(f,g)$ arises. Injectivity is exactly the uniqueness clause: two maps with the same components mediate the same pair, hence are equal. So the map is a bijection — $A\\times B$ represents $X\\mapsto\\mathrm{Hom}(X,A)\\times\\mathrm{Hom}(X,B)$."
      solution_sketch: "Split the universal property into its two clauses and match them to the two halves of being a bijection: existence of the mediating $u$ is surjectivity, uniqueness of $u$ is injectivity. Beyond that dictionary there is nothing to compute."
    anki_seeds:
      - front: "A universal property characterizes an object as..."
        back: "the initial (or terminal) object of an auxiliary category of candidate structures."
        type: basic
      - front: "A universal property has two clauses: {{c1::existence}} of a comparison morphism and {{c2::uniqueness}} among the diagram-commuting morphisms."
        back: "existence; uniqueness"
        type: cloze

  - id: products-coproducts
    name: Products and Coproducts
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: universal-properties
        weight: 0.5
        key: true
      - id: duality-opposite-categories
        weight: 0.4
        key: true
      - id: initial-terminal-objects
        weight: 0.2
      - id: commutative-diagrams
        weight: 0.2
      - id: direct-products
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The product universal property in Set
        key_prerequisites: [universal-properties]
        constraints: "Verify the universal property in $\\mathbf{Set}$ elementwise, or identify products in a poset category as meets; the pairing map must be shown unique."
        exemplars:
          - problem: "Work in the category of sets. Let A = {1, 2} and B = {3, 4}; their product is the set of ordered pairs A x B with the projection maps pi1 and pi2 that read off the two entries. Let X = {5, 7} and define f from X to A and g from X to B by f(5) = 1, f(7) = 2, g(5) = 4, g(7) = 3. The pairing map <f, g> from X to A x B is the unique map with pi1 <f, g> = f and pi2 <f, g> = g. Give <f, g>(7) as (x, y)."
            answer: "(2, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: the product is the set of ordered pairs A x B, where pi1 reads off the first entry and pi2 reads off the second. Pairing rule: the unique map satisfying both component equations is <f, g>(x) = (f(x), g(x)). Evaluate at the element 7: the first entry is f(7) = 2 and the second entry is g(7) = 3. The answer is (2, 3)."
          - problem: "Regard the divisibility poset on the set {1, 2, 3, 6, 9, 18} as a category: there is a morphism from x to y exactly when x divides y. In this category a product of two objects is an object p with a morphism from p to each of them, such that every object with morphisms to both also has a morphism to p. Give the product of the objects 6 and 9."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full setup: a morphism from x to y means x divides y, so a product of 6 and 9 is an element p that divides both and that every common divisor of the two also divides; that is the meet, the greatest common divisor. Common divisors of 6 and 9 inside the poset: 1 and 3. Every one of them divides 3, and 3 is the greatest, so the product is the meet 3. The answer is 3."
          - problem: "In the category of sets, let A = {0, 1} and B = {2, 3}. A student proposes the candidate product P = A x B x {0, 1}, with pi1 and pi2 the projections onto the first two coordinates. Let X = {9} with the maps f from X to A and g from X to B given by f(9) = 1 and g(9) = 2. State how many maps h from X to P satisfy pi1 h = f and pi2 h = g."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full setup: a map h from the one-point set X is determined by the single element h(9), which is a triple in A x B x {0, 1}. First-coordinate rule: pi1 h = f forces the first entry to be f(9) = 1. Second-coordinate rule: pi2 h = g forces the second entry to be g(9) = 2. The third entry can be either element of {0, 1}, giving 2 choices, so the candidate fails the uniqueness clause. The answer is 2."
          - problem: "In the category of sets, let A = {0, 1} and B = {5, 6}. A candidate product is the set P = {(0,5), (0,6), (1,5)} with pi1 and pi2 the coordinate projections onto A and B. Take the one-point set X = {7} with the maps f from X to A and g from X to B given by f(7) = 1 and g(7) = 6. Determine whether P with these projections is a product of A and B, and give the number of maps h from X to P with pi1 h = f and pi2 h = g."
            answer: "verdict = no; maps = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "maps"}]}
            solution_sketch: "Full test: a product must admit, for every set X and every pair of maps f and g, exactly one map h with pi1 h = f and pi2 h = g. Elementwise check: the two equations force h(7) = (1, 6), but the pair (1, 6) is not an element of P. So no map h exists for this X, existence fails, and P is not a product. The answer is verdict = no; maps = 0."
          - problem: "A student checks that in the category of sets the set of pairs A x B with its coordinate projections is a product. Step 1: given maps f from X to A and g from X to B, define h from X to A x B by h(x) = (f(x), g(x)). Step 2: then pi1 sends h(x) to f(x) for every element x, so pi1 h = f. Step 3: likewise pi2 sends h(x) to g(x) for every element x, so pi2 h = g. Step 4: if a map k from X to A x B also has pi1 k = f, then k = h, because a map into a product is determined by its first component alone. Select the first step that is not valid."
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid definition of the pairing map by elements. Step 2 correctly checks the first component equation, and Step 3 correctly checks the second. Step 4 is the first invalid step: equal first components alone do not force k = h, because the second components may differ; with both component equations one gets k(x) = (f(x), g(x)) = h(x) for every element x. The answer is Step 4."
          - problem: "A proof shows that in a poset category the product of two elements a and b is their meet. Step 1: a product object p must have morphisms to a and to b, so p is at most a and p is at most b. Step 2: for any element x that is at most a and at most b, the universal property yields a mediating arrow from x to p. Step 3: reading that arrow as an order statement forces x below p, so p is the greatest lower bound of a and b. Step 4: the mediating arrow is unique because a poset category has at most one morphism between any two objects, so the universal property is satisfied. Which hypothesis about poset categories does Step 3 use?"
            answer: "a morphism from x to p exists exactly when x is at most p"
            answer_contract: {"kind": "label", "options": [["a morphism from x to p exists exactly when x is at most p"], ["any two elements of the poset have a least upper bound"], ["every element of the poset is at most itself"], ["the order relation of the poset is a total order"]]}
            solution_sketch: "Step 3 turns the mediating arrow into the order claim that x lies below p. The hypothesis it uses is that a morphism from x to p exists exactly when x is at most p. The least upper bound option confuses the meet with the join. The reflexivity option is true but does not give the claim of Step 3. The total order option is false, since a divisibility poset with incomparable elements is not total. The answer is a morphism from x to p exists exactly when x is at most p."
          - problem: "Write the full proof: for sets A and B, the cartesian product A x B equipped with the coordinate projections satisfies the universal property of the product, and its pairing map is unique. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Statement: for sets A and B, the object A x B with pi1(u, v) = u and pi2(u, v) = v is a product. Existence step: given a set X with maps f from X to A and g from X to B, define the pairing h from X to A x B by sending each element x to the pair (f(x), g(x)). Component step: pi1(h(x)) = f(x) and pi2(h(x)) = g(x) for every element x, so pi1 h = f and pi2 h = g. Uniqueness step: if a map k from X to A x B also satisfies pi1 k = f and pi2 k = g, write k(x) = (u, v); the equations give u = f(x) and v = g(x), so k(x) = h(x) for every element x, hence k = h. Conclusion: A x B with the coordinate projections satisfies the universal property of the product, and the pairing map is unique."
      - id: kp2
        name: The coproduct by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Obtain the coproduct by dualizing the product; concrete verifications in $\\mathbf{Set}$ (disjoint union) or $\\mathbf{Ab}$ (direct sum), with the copairing shown to be the unique mediating homomorphism."
        exemplars:
          - problem: "State the universal property of the coproduct $A+B$ and identify it in $\\mathbf{Set}$."
            answer: "Injections $\\iota_1,\\iota_2$ with unique copairing $[f,g]$; in Set the disjoint union."
            solution_sketch: "The coproduct is the dual of the product: $A+B$ with $\\iota_1\\colon A\\to A+B$, $\\iota_2\\colon B\\to A+B$ such that any $f\\colon A\\to X$, $g\\colon B\\to X$ factor through a unique $[f,g]\\colon A+B\\to X$ with $[f,g]\\iota_1=f$, $[f,g]\\iota_2=g$. In $\\mathbf{Set}$ this is the disjoint union $A\\sqcup B$ with the inclusions and case-split map."
          - problem: "Verify that the direct sum $A\\oplus B$ is the coproduct in $\\mathbf{Ab}$, exhibiting the copairing."
            answer: "Inclusions $\\iota_1(a)=(a,0)$, $\\iota_2(b)=(0,b)$; the copairing $[f,g](a,b)=f(a)+g(b)$ is the unique homomorphism."
            solution_sketch: "Take $A\\oplus B$ with $\\iota_1(a)=(a,0)$ and $\\iota_2(b)=(0,b)$. Given homomorphisms $f\\colon A\\to X$, $g\\colon B\\to X$, define $[f,g]\\colon A\\oplus B\\to X$ by $[f,g](a,b)=f(a)+g(b)$; it is a homomorphism with $[f,g]\\iota_1=f$ and $[f,g]\\iota_2=g$. Any homomorphism $h$ with those equations satisfies $h(a,b)=h(a,0)+h(0,b)=f(a)+g(b)$, so $[f,g]$ is unique. Hence $A\\oplus B$ is the coproduct — here it coincides with the product, a biproduct, unlike the disjoint union in $\\mathbf{Set}$."
      - id: kp3
        name: Uniqueness; coproducts need not be disjoint unions
        key_prerequisites: [universal-properties]
        constraints: "Uniqueness proofs follow the cross-map pattern with both mediating maps named; the category-dependence of coproducts is illustrated only by $\\mathbf{Grp}$ (free product) versus $\\mathbf{Ab}$ (direct sum)."
        exemplars:
          - problem: "Prove any two products of $A,B$ are uniquely isomorphic, and state the coproduct in $\\mathbf{Grp}$ versus $\\mathbf{Ab}$."
            answer: "Universal property forces a unique iso; free product in $\\mathbf{Grp}$, direct sum in $\\mathbf{Ab}$."
            solution_sketch: "If $P,P'$ are products, each universal property gives unique $u\\colon P\\to P'$, $v\\colon P'\\to P$ commuting with projections. Then $vu$ and $1_P$ both commute with $P$'s projections, so uniqueness gives $vu=1_P$; likewise $uv=1_{P'}$: a unique isomorphism. Products in $\\mathbf{Grp}$/$\\mathbf{Ab}$ are direct products, but the coproduct is the free product $G*H$ in $\\mathbf{Grp}$ and the direct sum $G\\oplus H$ in $\\mathbf{Ab}$ — coproducts are category-dependent."
          - problem: "Prove any two coproducts of $A,B$ are uniquely isomorphic, and contrast $\\mathbf{Grp}$'s coproduct with the direct product."
            answer: "Duality gives a unique iso commuting with the injections; $\\mathbb Z*\\mathbb Z$ is free on two generators, not $\\mathbb Z\\times\\mathbb Z$."
            solution_sketch: "If $Q,Q'$ are coproducts of $A,B$, each universal property gives unique $u\\colon Q\\to Q'$ and $v\\colon Q'\\to Q$ commuting with the injections. Then $vu$ and $1_Q$ both commute with $Q$'s injections, so uniqueness forces $vu=1_Q$; likewise $uv=1_{Q'}$: a unique compatible isomorphism. Concretely in $\\mathbf{Grp}$ the coproduct is the free product $\\mathbb Z*\\mathbb Z$, the nonabelian free group on two generators, wholly different from the direct product $\\mathbb Z\\times\\mathbb Z$ — coproducts are not disjoint-union-like in general."
    diagnostic_exemplar:
      problem: "Prove that any two products of $A$ and $B$ are isomorphic by a unique isomorphism compatible with the projections."
      answer: "Let $(P,\\pi_1,\\pi_2)$ and $(P',\\pi_1',\\pi_2')$ both be products. The universal property of $P'$ applied to the cone $(\\pi_1,\\pi_2)$ gives a unique $u\\colon P\\to P'$ with $\\pi_i'u=\\pi_i$; that of $P$ gives a unique $v\\colon P'\\to P$ with $\\pi_iv=\\pi_i'$. Then $\\pi_i(vu)=\\pi_i'u=\\pi_i$, so $vu$ and $1_P$ both mediate the cone $(\\pi_1,\\pi_2)$ into $P$; uniqueness forces $vu=1_P$, and symmetrically $uv=1_{P'}$. Hence $u$ is an isomorphism, unique among maps commuting with the projections."
      solution_sketch: "Mediate each product through the other to get $u$ and $v$, then notice that $v\\circ u$ and the identity both mediate the same cone into $P$; the uniqueness clause collapses them. This is the standard argument that universal objects are unique up to a unique isomorphism."
    anki_seeds:
      - front: "Universal property of a product?"
        back: "$\\pi_1,\\pi_2$ with: every pair $f\\colon X\\to A$, $g\\colon X\\to B$ factors as a unique $\\langle f,g\\rangle\\colon X\\to A\\times B$."
        type: basic
      - front: "Coproduct is the {{c1::dual}} of the product; in $\\mathbf{Set}$ it is the {{c2::disjoint union}}."
        back: "dual; disjoint union"
        type: cloze

  - id: equalizers-coequalizers
    name: Equalizers and Coequalizers
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: universal-properties
        weight: 0.5
        key: true
      - id: commutative-diagrams
        weight: 0.3
        key: true
      - id: mono-epi-iso
        weight: 0.3
      - id: duality-opposite-categories
        weight: 0.2
      - id: first-isomorphism-theorem
        weight: 0.2
      - id: relation-closures
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Equalizers, concretely in Set
        key_prerequisites: [universal-properties]
        constraints: "State the fork condition and the universal factorization; concrete descriptions in $\\mathbf{Set}$ (equal-locus subset) or $\\mathbf{Ab}$ (kernel of the difference)."
        exemplars:
          - problem: "Define the equalizer of $f,g\\colon A\\to B$ and describe it in $\\mathbf{Set}$."
            answer: "$e\\colon E\\to A$ with $fe=ge$, universal; in Set $E=\\{a: f(a)=g(a)\\}$."
            solution_sketch: "An equalizer of $f,g$ is $e\\colon E\\to A$ with $fe=ge$ that is universal: any $m\\colon X\\to A$ with $fm=gm$ factors as $m=eu$ for a unique $u\\colon X\\to E$. In $\\mathbf{Set}$, $E=\\{a\\in A: f(a)=g(a)\\}$ with $e$ the inclusion; a map $m$ landing in the equal-locus factors uniquely through $E$."
          - problem: "In $\\mathbf{Ab}$, identify the equalizer of homomorphisms $f,g\\colon A\\to B$ and relate it to a kernel."
            answer: "$E=\\{a: f(a)=g(a)\\}=\\ker(f-g)$, with the inclusion $e\\colon E\\hookrightarrow A$."
            solution_sketch: "In $\\mathbf{Ab}$ the equalizer of $f,g$ is the subgroup $E=\\{a\\in A: f(a)=g(a)\\}$ with inclusion $e$; the condition $fe=ge$ and the universal factorization are checked as in $\\mathbf{Set}$, and $E$ is a subgroup because $f,g$ are homomorphisms. Since $f(a)=g(a)\\iff(f-g)(a)=0$, we get $E=\\ker(f-g)$. Thus equalizers in $\\mathbf{Ab}$ are exactly kernels of differences, the additive analogue of the Set description."
      - id: kp2
        name: Equalizers are monomorphisms
        key_prerequisites: [commutative-diagrams]
        constraints: "Abstract proofs from the universal property alone; each use of the existence or uniqueness clause must be flagged, and no elements may be used."
        exemplars:
          - problem: "In the category of sets, let A = {1,2,3,4,5} and B = {0,1}. The map f sends 1 and 2 to 0 and sends 3, 4, 5 to 1; the map g sends every element to 0. Let e be the inclusion of the equalizer set E into A, and let X = {7,8}. How many pairs of distinct maps u, v from X to E make the composite e after u equal the composite e after v?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (equalizer in sets): f and g agree exactly on 1 and 2, so E = {1,2} and e is the inclusion. Step 2 (inclusions are injective): if e after u equals e after v, then u and v agree at 7 and at 8, so u = v. Step 3 (count): no pair of distinct maps satisfies the condition, which is the concrete face of the theorem that an equalizer is monic. The answer is 0."
          - problem: "In the category of sets, let f and g be the same map from A = {1,2,3,4} to B = {0,1}, sending 1 and 2 to 0 and 3 and 4 to 1. Let e from E to A be an equalizer of f and g that is also surjective. How many elements does E have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (equalizers are monic): in sets an equalizer is an injective map, here the inclusion of the set where f and g agree, which is all of A. Step 2 (monic plus surjective): a map that is both injective and surjective is a bijection, so E and A have the same number of elements; this is the concrete form of the theorem that an equalizer which is epic must be an isomorphism. The answer is 4."
          - problem: "In the category of sets, let A = {1,2,3,4} and B = {0,1,2}. The map f sends x to the remainder of x on division by 3; the map g sends every element to 1. Let E be the equalizer set with inclusion e, and let X = {5,6}. The map m from X to A sends 5 to 1 and 6 to 4, and f after m equals g after m. How many maps u from X to E make the composite e after u equal m?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (equalizer set): f(x) = 1 exactly for x = 1 and x = 4, so E = {1,4}. Step 2 (existence clause): since f after m equals g after m, the universal property of the equalizer gives a factorization u with e after u equal to m, namely u(5) = 1 and u(6) = 4. Step 3 (uniqueness clause): e changes nothing, so u is forced at both points and no second map works. The answer is 1."
          - problem: "In the category of sets, let A = {1,2,3,4,5,6} and B = {0,1}. The map f sends 1, 2, 3 to 0 and 4, 5, 6 to 1; the map g sends every element to 0. With X = {9,10}, how many maps m from X to A make the composite f after m equal the composite g after m?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (equalizing condition): f after m agrees with g after m exactly when both values of m lie in the set where f is 0, namely {1,2,3}. Step 2 (count the maps): each of the two points 9 and 10 has 3 allowed images, giving 3 times 3, which is 9 maps; each of these is exactly the kind of map that the existence clause of the equalizer factors through e. The answer is 9."
          - problem: "Claim: every equalizer e from E to A of the pair f, g from A to B is monic. Step 1: suppose two maps s, t from X to E satisfy e after s equal to e after t, and write m for this common composite. Step 2: then f after m equal to f after e after s equal to g after e after s equal to g after m, because e equalizes f and g. Step 3: since f after m equals g after m, the uniqueness clause of the universal property directly gives m equal to e. Step 4: it follows that s equals t, so e is monic. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid setup for left-cancellation. Step 2 is a valid use of the equalizing identity that f after e equals g after e, with no elements involved. Step 3 is not valid: the uniqueness clause applies only to factorizations through e, that is to maps from X to E, while m is a map from X to A of a different type; the proof must first invoke the existence clause to obtain factorizations and only then apply uniqueness to s and t. Step 4 would follow from that corrected argument. The answer is Step 3."
          - problem: "The abstract proof that an equalizer e from E to A of f, g from A to B is monic runs as follows. Suppose maps s, t from X to E have e after s equal to e after t; write m for the common composite from X to A. A short computation gives f after m equal to g after m. The existence clause of the universal property then gives a map w from X to E with e after w equal to m. One more line is needed before the uniqueness clause can be applied to conclude s equals t. Select the missing line."
            answer: "both s and t factor m through e"
            answer_contract: {"kind": "label", "options": [["both s and t factor m through e"], ["e factors m through f and g"], ["m factors e through s"], ["w, s and t are all the same map"]]}
            solution_sketch: "Full context: e equalizes f and g, m is the common composite with e after s equal to e after t equal to m, and w is one factorization of m through e. Step (role of uniqueness): the uniqueness clause compares two factorizations of the same map through e, so the line before it must record that s and t are themselves such factorizations. The option saying e factors m through f and g misidentifies which map is being factored and through what; the option saying m factors e through s reverses the direction of the arrows; the option saying w, s and t are all the same map states a conclusion that only uniqueness can grant, not the observation that precedes it. The answer is both s and t factor m through e."
          - problem: "Write the full proof: every equalizer e from E to A of a pair f, g from A to B is a monomorphism, using only the universal property. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: e equalizes f and g, so f after e equals g after e. Step 1: suppose maps s, t from X to E have e after s equal to e after t; write m for this common composite from X to A. Step 2 (equalizing identity): f after m equals f after e after s equals g after e after s equals g after m, using only that e equalizes the pair. Step 3 (existence clause, first flagged use): since f after m equals g after m, the universal property provides a map w from X to E with e after w equal to m. Step 4 (uniqueness clause, second flagged use): the composites e after s and e after t both equal m, so s and t are two factorizations of m through e, and uniqueness forces s equal to t. Step 5 (conclusion): e cancels on the left, so e is a monomorphism. No elements were used at any point, and each appeal to existence or to uniqueness is flagged at the step where it happens."
      - id: kp3
        name: Coequalizers by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Dualize the equalizer; concrete descriptions in $\\mathbf{Set}$ (quotient by the generated equivalence relation) or $\\mathbf{Ab}$ (cokernel of the difference)."
        exemplars:
          - problem: "In $\\mathbf{Set}$, let $A = \\{1,2,3\\}$ and $B = \\{1,2,3,4,5\\}$. Define $f,g\\colon A\\to B$ by $f(1)=1$, $f(2)=3$, $f(3)=5$ and $g(1)=2$, $g(2)=4$, $g(3)=5$. Let $Q$ be the coequalizer set, the quotient of $B$ by the smallest equivalence relation that identifies $f(a)$ with $g(a)$ for every $a$. How many elements does $Q$ have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Form the generated relation: the pairs $f(1)=1$ with $g(1)=2$ and $f(2)=3$ with $g(2)=4$ must be identified, while $f(3)=g(3)=5$ is trivial. By the concrete description of coequalizers in Set, quotient $B = \\{1,2,3,4,5\\}$ by the smallest equivalence relation containing these pairs. The classes are $\\{1,2\\}$, $\\{3,4\\}$ and $\\{5\\}$. The answer is 3."
          - problem: "In $\\mathbf{Ab}$, let $f,g\\colon \\mathbb{Z}\\to\\mathbb{Z}$ be given by $f(x)=3x$ and $g(x)=5x$. The coequalizer is the quotient of $\\mathbb{Z}$ by the subgroup generated by all $f(x)-g(x)$. How many elements does this quotient group have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the difference map: $(f-g)(x) = 3x - 5x = -2x$. Its image is the subgroup $2\\mathbb{Z}$ of $\\mathbb{Z}$. By the cokernel rule for coequalizers in Ab, the coequalizer is the quotient $\\mathbb{Z}/2\\mathbb{Z}$. A quotient of $\\mathbb{Z}$ by $2\\mathbb{Z}$ has 2 elements. The answer is 2."
          - problem: "In the category $\\mathbf{Ab}$, let $f$ and $g$ be the homomorphisms $\\mathbb{Z}\\to\\mathbb{Z}$ defined by $f(x)=2x$ and $g(x)=6x$. Their coequalizer is a cyclic group $\\mathbb{Z}/k\\mathbb{Z}$ for a whole number $k$. Give $k$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Difference map: $f(x) - g(x) = 2x - 6x = -4x$, so its image is the subgroup $4\\mathbb{Z}$. By the cokernel description of coequalizers in Ab, the coequalizer is $\\mathbb{Z}/4\\mathbb{Z}$, hence $k = 4$. As a check, $qf = qg$ holds because every $f(x)-g(x)$ lies in $4\\mathbb{Z}$. The answer is 4."
          - problem: "In $\\mathbf{Ab}$, a student computes the coequalizer of $f,g\\colon \\mathbb{Z}\\to\\mathbb{Z}$ with $f(x)=6x$ and $g(x)=x$ as $\\mathbb{Z}/6\\mathbb{Z}$, arguing that the quotient kills the image of $f$. Give the correct number of elements of the coequalizer."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The coequalizer in Ab quotients by the image of the difference, not by the image of $f$. Difference map: $f(x) - g(x) = 6x - x = 5x$, so its image is $5\\mathbb{Z}$. The quotient is $\\mathbb{Z}/5\\mathbb{Z}$, which has 5 elements. The student's error was to use $\\mathrm{im}(f) = 6\\mathbb{Z}$ instead of $\\mathrm{im}(f-g)$. The answer is 5."
          - problem: "An equalizer in $\\mathbf{Set}$ is built inside the domain $A$: it is the inclusion of the part of $A$ where $f$ and $g$ take equal values. Apply duality. Select the option that describes the coequalizer of $f,g\\colon A\\to B$ in $\\mathbf{Set}$."
            answer: "the quotient of B by the smallest equivalence relation with f(a) ~ g(a)"
            answer_contract: {"kind": "label", "options": [["the quotient of B by the smallest equivalence relation with f(a) ~ g(a)"], ["the quotient of A by the smallest equivalence relation with f(a) ~ g(a)"], ["the subset of B formed by the elements on which f and g agree"], ["the subset of A formed by the elements on which f and g agree"]]}
            solution_sketch: "Duality reverses every arrow and swaps domain with codomain, and it turns subobjects into quotients. The equalizer is a subobject of $A$, so its dual is a quotient of $B$. The option 'the quotient of A ...' keeps a quotient but wrongly stays in the domain. The option 'the subset of B ...' wrongly keeps a subobject and moves to the codomain. The option 'the subset of A ...' is the original statement, not its dual at all. The answer is the quotient of B by the smallest equivalence relation with f(a) ~ g(a)."
          - problem: "Claim: for $f,g\\colon \\{1,2\\}\\to\\{w,x,y\\}$ with $f(1)=w$, $f(2)=x$, $g(1)=x$, $g(2)=y$, the coequalizer set has exactly two classes. Step 1: the relation must identify $f(1)=w$ with $g(1)=x$. Step 2: the relation must identify $f(2)=x$ with $g(2)=y$. Step 3: since $w\\sim x$ and $x\\sim y$, transitivity forces $w\\sim y$. Step 4: therefore the classes are $\\{w,x\\}$ and $\\{y\\}$. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly lists the required identification from the input $1$. Step 2 correctly lists the required identification from the input $2$. Step 3 correctly applies transitivity of an equivalence relation to $w$, $x$ and $y$. Step 4 is not valid: since $x\\sim y$ from Step 2, the element $y$ lies in the class of $w$ and $x$, so the quotient has the single class $\\{w,x,y\\}$, not two classes. The answer is Step 4."
          - problem: "Write the full proof: in $\\mathbf{Set}$, the canonical map $q\\colon B\\to B/\\sim$, where $\\sim$ is the smallest equivalence relation on $B$ with $f(a)\\sim g(a)$ for all $a\\in A$, is the coequalizer of $f,g\\colon A\\to B$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let $\\sim$ be the smallest equivalence relation on $B$ containing every pair $(f(a),g(a))$, let $Q = B/\\sim$, and let $q\\colon B\\to Q$ send each element to its class. Step 1 ($qf = qg$): for each $a \\in A$ we have $f(a) \\sim g(a)$ by construction, so $q(f(a)) = q(g(a))$. Step 2 (universality): let $n\\colon B\\to C$ satisfy $nf = ng$; define $w\\colon Q\\to C$ by $w([b]) = n(b)$. This is well defined, because $R = \\{(b,b') : n(b) = n(b')\\}$ is an equivalence relation on $B$ containing every pair $(f(a),g(a))$ since $nf = ng$, and $\\sim$ is the smallest such relation, so $b \\sim b'$ implies $n(b) = n(b')$. Step 3 (uniqueness): $q$ is surjective since every class $[b]$ equals $q(b)$, so any $w'$ with $w'q = n$ satisfies $w'([b]) = w'q(b) = n(b) = w([b])$, hence $w' = w$. Conclusion: $q\\colon B\\to B/\\sim$ satisfies $qf = qg$ and every $n$ with $nf = ng$ factors uniquely as $n = wq$, so it is the coequalizer. $\\square$"
    diagnostic_exemplar:
      problem: "Prove that every equalizer $e\\colon E\\to A$ of $f,g\\colon A\\to B$ is a monomorphism."
      answer: "Suppose $eu=ev$ for $u,v\\colon X\\to E$, and set $m=eu=ev$. Then $fm=(fe)u=(ge)u=gm$, so $m$ equalizes $f,g$ and therefore factors through $e$ via a UNIQUE map $X\\to E$. Both $u$ and $v$ are such factorizations ($eu=m=ev$), so uniqueness gives $u=v$. Hence $e$ is left-cancellable, i.e. a monomorphism."
      solution_sketch: "From $e\\circ u=e\\circ v$, show the common composite equalizes $f$ and $g$, so it factors through $e$ by a unique map — and $u$, $v$ are both such factorizations. Left-cancellation comes from the uniqueness clause, not from any element chase."
    anki_seeds:
      - front: "Equalizer of $f,g\\colon A\\to B$?"
        back: "the universal $e\\colon E\\to A$ with $fe=ge$; in $\\mathbf{Set}$, $E=\\{a: f(a)=g(a)\\}$."
        type: basic
      - front: "Every equalizer $e\\colon E\\to A$ is what kind of morphism?"
        back: "a monomorphism."
        type: basic
      - front: "Coequalizers are always {{c1::epimorphisms}} (dual to equalizers being monos)."
        back: "epimorphisms"
        type: cloze

  - id: pullbacks-pushouts
    name: Pullbacks and Pushouts
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: products-coproducts
        weight: 0.5
        key: true
      - id: equalizers-coequalizers
        weight: 0.4
        key: true
      - id: universal-properties
        weight: 0.3
      - id: commutative-diagrams
        weight: 0.2
      - id: duality-opposite-categories
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Pullbacks as fibered products in Set
        key_prerequisites: [universal-properties]
        constraints: "State the commuting-square and universal clauses; $\\mathbf{Set}$ descriptions as fibered products, with subset inclusions specializing to intersections/preimages."
        exemplars:
          - problem: "Define the pullback of $f\\colon A\\to C$, $g\\colon B\\to C$ and describe it in $\\mathbf{Set}$."
            answer: "$P=A\\times_C B$ with $p_1,p_2$, $fp_1=gp_2$, universal; in Set $\\{(a,b): f(a)=g(b)\\}$."
            solution_sketch: "The pullback is $P$ with $p_1\\colon P\\to A$, $p_2\\colon P\\to B$ satisfying $fp_1=gp_2$ and universal: any $X$ with $x_1\\colon X\\to A$, $x_2\\colon X\\to B$, $fx_1=gx_2$ factors through a unique $u\\colon X\\to P$ with $p_i u=x_i$. In $\\mathbf{Set}$, $P=\\{(a,b)\\in A\\times B: f(a)=g(b)\\}$ with the coordinate projections."
          - problem: "Describe the pullback in $\\mathbf{Set}$ of two subset inclusions $A\\hookrightarrow C\\hookleftarrow B$."
            answer: "The intersection $A\\cap B$, with its inclusions into $A$ and $B$."
            solution_sketch: "For inclusions $f\\colon A\\hookrightarrow C$, $g\\colon B\\hookrightarrow C$ the fibered product is $\\{(a,b)\\in A\\times B: f(a)=g(b)\\}$; since $f,g$ are inclusions the condition is $a=b$, holding only for elements of $A\\cap B$, and $(x,x)\\mapsto x$ identifies this set with $A\\cap B\\subseteq C$. The projections are the inclusions $A\\cap B\\hookrightarrow A$ and $A\\cap B\\hookrightarrow B$, so pulling back two subobjects computes their intersection. More generally, pulling $g\\colon B\\hookrightarrow C$ back along any $f\\colon A\\to C$ gives the preimage $f^{-1}(B)$."
      - id: kp2
        name: Building pullbacks from products and equalizers
        key_prerequisites: [products-coproducts]
        constraints: "Either the product-plus-equalizer construction (identify the two maps being equalized) or elementless stability proofs (mono stable under pullback) using only the universal property."
        exemplars:
          - problem: "Construct the pullback of $f,g$ from the product $A\\times B$ and an equalizer."
            answer: "Equalize $f\\pi_1,\\,g\\pi_2\\colon A\\times B\\to C$."
            solution_sketch: "Form $A\\times B$ with projections $\\pi_1,\\pi_2$, then take the equalizer $e\\colon P\\to A\\times B$ of $f\\pi_1$ and $g\\pi_2$. Setting $p_i=\\pi_i e$ gives $fp_1=gp_2$, and a cone $(x_1,x_2)$ over the cospan is exactly a map into $A\\times B$ equalizing $f\\pi_1,g\\pi_2$, so it factors uniquely through $P$. Thus products $+$ equalizers $\\Rightarrow$ all pullbacks."
          - problem: "Prove that in any category the pullback of a monomorphism is a monomorphism."
            answer: "If $g$ is mono, its pullback $p_1\\colon P\\to A$ along $f$ is mono."
            solution_sketch: "Let $P=A\\times_C B$ with projections $p_1,p_2$, and suppose $g\\colon B\\to C$ is mono. Take $u,v\\colon X\\to P$ with $p_1 u=p_1 v$. Then $g p_2 u=f p_1 u=f p_1 v=g p_2 v$, and $g$ mono gives $p_2 u=p_2 v$. So $u,v$ agree after both projections; each is the mediating map for the cone $(p_1 u,p_2 u)$ over the cospan, which is unique, so $u=v$. Hence $p_1$ is mono, i.e. monos are stable under pullback."
      - id: kp3
        name: Pushouts by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Dualize the pullback; concrete descriptions in $\\mathbf{Set}$ (gluing along $C$) or $\\mathbf{Ab}$ (quotient of the direct sum), realized as coproduct followed by coequalizer."
        exemplars:
          - problem: "In Set, the pushout of f: C -> A and g: C -> B is built from the coproduct, the disjoint union of A and B, by gluing: the quotient identifies f(c) with g(c) for each element c of C. Take A = {1,2,3}, B = {4,5,6}, C = {x,y}, with f(x) = 1, f(y) = 2, g(x) = 4, g(y) = 5. How many elements does the pushout have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Coproduct in Set: the disjoint union of {1,2,3} and {4,5,6} has 6 elements. Gluing rule of the pushout: the quotient identifies f(c) with g(c), so 1 is glued to 4 and 2 is glued to 5. Each of the two identifications merges two classes into one, so the count drops by 2. The pushout therefore has 6 - 2 = 4 elements. The answer is 4."
          - problem: "In Ab, the pushout of f: C -> A and g: C -> B is realized as a coproduct followed by a coequalizer: take the direct sum of A and B and quotient by the subgroup generated by all elements (f(c), -g(c)). Take C = Z/4, A = Z/8, B = Z/4 with f(1) = 2 and g(1) = 1. Give the number of elements of the pushout."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Coproduct in Ab: the direct sum of Z/8 and Z/4 has 8 times 4 = 32 elements. Coequalizer rule: the pushout is the quotient by the subgroup generated by (f(1), -g(1)) = (2, -1). Order computation: 2 has order 4 in Z/8 and -1 has order 4 in Z/4, so the generator has order 4 and the subgroup has 4 elements. Quotient size: 32 divided by 4 = 8. The answer is 8."
          - problem: "In the poset of positive divisors of 36, ordered by divisibility, a map from 2 to 4 means that 2 divides 4. By duality, the pullback of two objects is their greatest lower bound, so the pushout of two objects over a third is their least upper bound. Take the pushout of 4 and 6 over 2, since 2 divides both. Which divisor of 36 is the pushout?"
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Poset rule: in a poset category the pushout of A and B over C is the least upper bound of A and B, dual to the pullback as the greatest lower bound. Upper bounds: among divisors of 36, the common multiples of 4 and 6 are 12 and 36. Least upper bound: 12, since 12 divides 36. The answer is 12."
          - problem: "The subsets of {1,2,3,4} ordered by inclusion form a category. By duality, the pullback of two subsets is the greatest lower bound, the intersection, and the pushout is the least upper bound for inclusion. Take the pushout of {1,2} and {2,3} over {2}. How many elements does the pushout contain?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Poset rule: in the lattice of subsets the pushout is the join, the least upper bound for inclusion, dual to the meet given by the pullback. Join computation: the least subset containing both {1,2} and {2,3} is their union {1,2,3}. Count: the pushout {1,2,3} has 3 elements. The answer is 3."
          - problem: "Claim: in Set, the pushout of the two constant maps f: {c,d} -> {1} and g: {c,d} -> {4} is empty. Step 1: the coproduct of {1} and {4} has 2 elements. Step 2: the quotient identifies 1 with 4 once for c and once for d. Step 3: the two identifications merge two distinct pairs, so each removes one element from the count. Step 4: hence the quotient has 2 - 2 = 0 elements. Step 5: since this quotient realizes the pushout, the pushout is empty. Select the first step that is not valid."
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: the coproduct in Set of two singletons is a 2-element disjoint union. Step 2 is valid: the gluing relation identifies f(c) with g(c) for each element of the domain. Step 3 is not valid: both identifications glue the same pair, 1 to 4, so only one class is formed and the count drops by 1, not by 2. Step 4 inherits that error, and the quotient actually has 1 element. Step 5 states the correct coproduct-plus-coequalizer realization but a false size. The first invalid step is Step 3."
          - problem: "In Ab, form the pushout of f: C -> A and g: C -> B by first taking the direct sum of A and B and then coequalizing c -> (f(c), 0) against c -> (0, g(c)); the result is the quotient by the subgroup generated by the elements (f(c), -g(c)). Work with C = Z/3, A = Z/6, B = Z/3, f(1) = 4 and g(1) = 2. Determine the number of elements of the pushout."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Coproduct in Ab: the direct sum of Z/6 and Z/3 has 6 times 3 = 18 elements. Coequalizer rule: quotient by the subgroup generated by (f(1), -g(1)) = (4, -2). Order computation: 4 has order 3 in Z/6 and -2 has order 3 in Z/3, so the generator has order 3 and the subgroup has 3 elements. Quotient size: 18 divided by 3 = 6. The answer is 6."
          - problem: "Write the full proof: in Set, the quotient of the coproduct A + B by the smallest equivalence relation with f(c) ~ g(c) for every c in C, with the maps q1(a) = [a] and q2(b) = [b], is the pushout of f: C -> A and g: C -> B, and this realizes the pushout as a coproduct followed by a coequalizer. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (coproduct): form the disjoint union A + B with its two injections. Step 2 (coequalizer): let ~ be the smallest equivalence relation identifying f(c) with g(c) for each c in C, and set Q = (A + B)/~ with q1(a) = [a] and q2(b) = [b]. Step 3 (commutativity): for each c, q1 f(c) = [f(c)] = [g(c)] = q2 g(c), so q1 f = q2 g. Step 4 (universal property): if u: A -> X and v: B -> X satisfy u f = v g, define w([t]) = u(t) for t in A and w([t]) = v(t) for t in B; when a class meets both summands through some c, the condition u f(c) = v g(c) makes the two values agree, so w is well defined and is the unique map with w q1 = u and w q2 = v. Step 5 (duality): Q is the coequalizer of the two maps C -> A + B taken after the coproduct, the dual of the pullback as a product followed by an equalizer, so Q is the pushout."
    diagnostic_exemplar:
      problem: "Prove that monomorphisms are stable under pullback: if $g\\colon B\\to C$ is mono and $(P,p_1,p_2)$ is the pullback of $f\\colon A\\to C$ along $g$, then $p_1\\colon P\\to A$ is mono."
      answer: "Take $u,v\\colon X\\to P$ with $p_1u=p_1v$. Then $g(p_2u)=f(p_1u)=f(p_1v)=g(p_2v)$ using the pullback square, and $g$ mono gives $p_2u=p_2v$. So $u$ and $v$ mediate the same cone $(p_1u,p_2u)$ over the cospan; the pullback's uniqueness clause forces $u=v$. Hence $p_1$ is a monomorphism."
      solution_sketch: "Push $p_1u=p_1v$ across the square to get $g\\circ p_2u=g\\circ p_2v$, cancel the mono $g$ so the second components agree too, then apply the pullback uniqueness clause to the single cone that both $u$ and $v$ mediate."
    anki_seeds:
      - front: "Pullback of $f\\colon A\\to C$, $g\\colon B\\to C$ in $\\mathbf{Set}$?"
        back: "$A\\times_C B=\\{(a,b): f(a)=g(b)\\}$; universal square with $fp_1=gp_2$."
        type: basic
      - front: "Pullbacks come from {{c1::products and equalizers}}; pushouts from coproducts and coequalizers."
        back: "products and equalizers"
        type: cloze

  - id: cones-and-cocones
    name: Diagrams, Cones, and Cocones
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: natural-transformations
        weight: 0.5
        key: true
      - id: functors
        weight: 0.3
      - id: products-coproducts
        weight: 0.2
      - id: commutative-diagrams
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: A cone is a natural transformation from a constant functor
        key_prerequisites: [natural-transformations]
        constraints: "Define cones as transformations $\\Delta_X\\Rightarrow D$ and unpack the leg equations; concrete shapes limited to parallel pairs, spans, and cospans."
        exemplars:
          - problem: "Let $\\mathcal J$ be the cospan shape: objects $1, 2, 3$ and exactly two non-identity arrows, $1 \\to 3$ and $2 \\to 3$. Let $D\\colon\\mathcal J\\to\\mathbf{Set}$ be any diagram. A cone over $D$ with apex $X$ is a natural transformation $\\Delta_X\\Rightarrow D$; its legs are the components of this transformation and its leg equations are its naturality conditions (the ones at identity arrows are automatic). How many legs and how many leg equations does a cone over $D$ have? Give legs and equations."
            answer: "legs = 3; equations = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "legs"}, {"contract": {"kind": "exact"}, "name": "equations"}]}
            solution_sketch: "Write the cone in full: $\\lambda\\colon\\Delta_X\\Rightarrow D$ with components $\\lambda_1\\colon X\\to D1$, $\\lambda_2\\colon X\\to D2$ and $\\lambda_3\\colon X\\to D3$. Rule of components: a natural transformation has one component per object of $\\mathcal J$, and $\\mathcal J$ has three objects, so there are 3 legs. Rule of naturality: each non-identity arrow $u\\colon j\\to j'$ of $\\mathcal J$ gives one equation $D(u)\\circ\\lambda_j=\\lambda_{j'}$, and $\\mathcal J$ has two such arrows, so there are 2 leg equations. The answer is legs = 3; equations = 2."
          - problem: "Work in $\\mathbf{Set}$. Let $D$ be the parallel-pair diagram carried by the maps $f, g\\colon A\\to B$ with $A=\\{1,2,3\\}$, $B=\\{0,1\\}$, $f(1)=1$, $f(2)=0$, $f(3)=1$ and $g(1)=0$, $g(2)=0$, $g(3)=1$. A cone over $D$ with apex $X$ is a natural transformation $\\Delta_X\\Rightarrow D$. How many cones over $D$ are there with apex a one-point set $X$?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the cone in full: $\\lambda\\colon\\Delta_X\\Rightarrow D$ with legs $\\lambda_0\\colon X\\to A$ and $\\lambda_1\\colon X\\to B$. Naturality rule at each of the two arrows $f, g\\colon A\\to B$ gives $f\\circ\\lambda_0=\\lambda_1$ and $g\\circ\\lambda_0=\\lambda_1$. Hence $\\lambda_1$ is determined by $\\lambda_0$, and the whole condition is $f\\circ\\lambda_0=g\\circ\\lambda_0$; with a one-point $X$, the leg $\\lambda_0$ is an element $a$ of $A$. Test each element: $a=1$ gives $f(1)=1$ against $g(1)=0$, fails; $a=2$ gives $0=0$, works; $a=3$ gives $1=1$, works. The answer is 2."
          - problem: "Work in $\\mathbf{Set}$. Let $D$ be the span diagram carried by a map $A\\to B$ (its values play no role here) and the map $h\\colon A\\to C$ with $A=\\{1,2,3,4\\}$, $C=\\{0,1,2,3\\}$ and $h(1)=0$, $h(2)=2$, $h(3)=1$, $h(4)=3$. A cone over $D$ with apex the one-point set $X$ is a natural transformation $\\Delta_X\\Rightarrow D$ with legs $\\lambda_A\\colon X\\to A$, $\\lambda_B\\colon X\\to B$ and $\\lambda_C\\colon X\\to C$. The leg $\\lambda_A$ sends the point of $X$ to $3$. Give the value of $\\lambda_C$ at the point of $X$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the cone in full: $\\lambda\\colon\\Delta_X\\Rightarrow D$ with legs $\\lambda_A\\colon X\\to A$, $\\lambda_B\\colon X\\to B$ and $\\lambda_C\\colon X\\to C$. Naturality rule at the arrow of the span shape sent by $D$ to $h\\colon A\\to C$: $D(A\\to C)\\circ\\lambda_A=\\lambda_C$, that is $h\\circ\\lambda_A=\\lambda_C$. Apply it at the point of $X$: $\\lambda_C$ sends that point to $h(\\lambda_A(\\text{point}))=h(3)$. Look up the table of $h$: $h(3)=1$. The answer is 1."
          - problem: "Work in $\\mathbf{Set}$. Let $D$ be the cospan diagram carried by the maps $h\\colon A\\to C$ and $k\\colon B\\to C$ with $A=\\{1,2\\}$, $B=\\{3,4,5\\}$, $C=\\{0,1\\}$, $h(1)=0$, $h(2)=1$, $k(3)=0$, $k(4)=1$ and $k(5)=1$. Recall that a cone over $D$ with apex $X$ is a natural transformation $\\Delta_X\\Rightarrow D$. How many cones over this cospan have a one-point apex $X$?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the cone in full: $\\lambda\\colon\\Delta_X\\Rightarrow D$ with legs $\\lambda_A\\colon X\\to A$, $\\lambda_B\\colon X\\to B$ and $\\lambda_C\\colon X\\to C$. Naturality rule at the two cospan arrows: $h\\circ\\lambda_A=\\lambda_C$ and $k\\circ\\lambda_B=\\lambda_C$. With a one-point apex, $\\lambda_A$ and $\\lambda_B$ pick elements $a\\in A$ and $b\\in B$, and both equations force $\\lambda_C(\\text{point})=h(a)=k(b)$. Count the pairs with $h(a)=k(b)$: $a=1$ needs $k(b)=0$, so $b=3$; $a=2$ needs $k(b)=1$, so $b=4$ or $b=5$. That is $1+2=3$ pairs, each giving exactly one cone. The answer is 3."
          - problem: "Work in $\\mathbf{Set}$. Let $D$ be the parallel-pair diagram carried by the maps $f, g\\colon A\\to B$ with $A=\\{4,5\\}$, $B=\\{4,5,6\\}$, $f(4)=4$, $f(5)=6$, $g(4)=5$ and $g(5)=6$. A cocone under $D$ with apex $X$ is a natural transformation $D\\Rightarrow\\Delta_X$. How many cocones under $D$ are there with apex $X=\\{0,1\\}$?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the cocone in full: $\\mu\\colon D\\Rightarrow\\Delta_X$ with legs $\\mu_A\\colon A\\to X$ and $\\mu_B\\colon B\\to X$. Naturality rule, now read in the direction $D\\Rightarrow\\Delta_X$, forces $\\mu_A=\\mu_B\\circ f$ and $\\mu_A=\\mu_B\\circ g$. Write $h=\\mu_B\\colon B\\to X$; the conditions read $h(f(a))=h(g(a))$ for each $a\\in A$: $h(4)=h(5)$ and $h(6)=h(6)$. So $h(4)=h(5)$ has 2 choices, $h(6)$ has 2 choices, and $\\mu_A$ is then determined by $h\\circ f$. That gives $2\\times 2=4$ cocones. The answer is 4."
          - problem: "Claim: a cone over the cospan $h\\colon A\\to C$, $k\\colon B\\to C$ with apex $X$ is determined by two legs $\\lambda_A\\colon X\\to A$ and $\\lambda_B\\colon X\\to B$ with $h\\circ\\lambda_A=k\\circ\\lambda_B$. Step 1: a cone over this cospan with apex $X$ is a natural transformation $\\Delta_X\\Rightarrow D$. Step 2: its components are $\\lambda_A\\colon X\\to A$, $\\lambda_B\\colon X\\to B$ and $\\lambda_C\\colon X\\to C$. Step 3: naturality at the arrow $h\\colon A\\to C$ reads $\\lambda_C\\circ h=\\lambda_A$. Step 4: naturality at $k$ gives $k\\circ\\lambda_B=\\lambda_C$, so the pair with $h\\circ\\lambda_A=k\\circ\\lambda_B$ determines the cone. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is the definition of a cone over $D$ with apex $X$ as a transformation $\\Delta_X\\Rightarrow D$. Step 2 is valid: components are indexed by the three objects of the cospan shape, giving the legs $\\lambda_A$, $\\lambda_B$, $\\lambda_C$. Step 3 is invalid: for a transformation $\\Delta_X\\Rightarrow D$, naturality at $h\\colon A\\to C$ reads $D(h)\\circ\\lambda_A=\\lambda_C$, that is $h\\circ\\lambda_A=\\lambda_C$; the claimed $\\lambda_C\\circ h$ is not even composable, since $\\lambda_C$ has domain $X$ while $h$ has codomain $C$. Step 4 is a valid consequence once Step 3 is corrected, because eliminating $\\lambda_C$ gives $h\\circ\\lambda_A=k\\circ\\lambda_B$. The answer is Step 3."
          - problem: "Write the full proof: a cone over a diagram $D\\colon\\mathcal J\\to\\mathcal C$ with apex $X$ is exactly a natural transformation $\\Delta_X\\Rightarrow D$, and for the cospan shape this unpacks to the leg equation $h\\circ\\lambda_A=k\\circ\\lambda_B$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: define the constant functor $\\Delta_X\\colon\\mathcal J\\to\\mathcal C$ by $\\Delta_X(j)=X$ for every object $j$ and $\\Delta_X(u)=1_X$ for every arrow $u$. Step 2: a natural transformation $\\lambda\\colon\\Delta_X\\Rightarrow D$ has one component $\\lambda_j\\colon X\\to Dj$ per object $j$ of $\\mathcal J$; these components are the legs of the cone. Step 3: naturality at an arrow $u\\colon j\\to j'$ reads $D(u)\\circ\\lambda_j=\\lambda_{j'}$, which is exactly the leg equation of a cone; hence a cone over $D$ with apex $X$ is the same thing as a transformation $\\Delta_X\\Rightarrow D$. Step 4: for the cospan $h\\colon A\\to C$, $k\\colon B\\to C$ the legs are $\\lambda_A$, $\\lambda_B$, $\\lambda_C$ and the equations read $h\\circ\\lambda_A=\\lambda_C$ and $k\\circ\\lambda_B=\\lambda_C$. Step 5: eliminating $\\lambda_C$ gives $h\\circ\\lambda_A=k\\circ\\lambda_B$, and conversely such a pair determines $\\lambda_C$ uniquely, so a cone over the cospan is exactly such a pair of legs."
      - id: kp2
        name: The category of cones
        key_prerequisites: [products-coproducts]
        constraints: "Give the leg-commuting condition for cone/cocone morphisms and name which extremal object (terminal/initial) yields the (co)limit."
        exemplars:
          - problem: "Work in Set with the discrete diagram D whose two objects are B1 = {p, q} and B2 = {r, s}. Cone (X, lambda) has apex X = {u, v} with legs lambda1(u) = p, lambda1(v) = q, lambda2(u) = r, lambda2(v) = s. Cone (Y, mu) has apex Y = {w, z, t} with legs mu1(w) = p, mu1(z) = q, mu1(t) = p, mu2(w) = r, mu2(z) = s, mu2(t) = r. A morphism of cones from (X, lambda) to (Y, mu) is a map h from X to Y with mu1(h(x)) = lambda1(x) and mu2(h(x)) = lambda2(x) for every x in X. How many such maps h are there?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The leg-commuting condition says mu1(h(x)) = lambda1(x) and mu2(h(x)) = lambda2(x) for every x in X. For x = u: mu1(h(u)) = p forces h(u) in {w, t}, and mu2(h(u)) = r also allows w or t, so 2 choices. For x = v: mu1(h(v)) = q forces h(v) = z, and mu2(z) = s matches lambda2(v) = s, so 1 choice. Multiply the independent choices: 2 times 1 = 2. The answer is 2."
          - problem: "Work in Set. Let D be the discrete diagram with objects B1 = {a} and B2 = {b}. Cocone (X, gamma) has nadir X = {x1, x2, x3} with legs gamma1(a) = x1 and gamma2(b) = x2. Cocone (Y, delta) has nadir Y = {y1, y2, y3} with legs delta1(a) = y1 and delta2(b) = y1. A morphism of cocones from (X, gamma) to (Y, delta) is a map h from X to Y with h(gamma1(a)) = delta1(a) and h(gamma2(b)) = delta2(b). How many such maps h are there?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The leg-commuting condition for cocones is h after gamma_j equals delta_j for each leg j. Leg 1 gives h(x1) = delta1(a) = y1, so 1 choice. Leg 2 gives h(x2) = delta2(b) = y1, so 1 choice. The point x3 lies on no leg, so h(x3) may be any of the 3 points of Y. Multiply the independent choices: 1 times 1 times 3 = 3. The answer is 3."
          - problem: "Work in Set. Take the discrete diagram D with three objects B1 = {0, 1}, B2 = {0, 1}, B3 = {0, 1}. Cone (X, lambda) has apex X = {u, v} with legs lambda1(u) = 1, lambda1(v) = 0, lambda2(u) = 0, lambda2(v) = 0, lambda3(u) = 1, lambda3(v) = 1. Cone (Y, mu) has apex Y = {w} with legs mu1(w) = 1, mu2(w) = 0, mu3(w) = 1. Let h be the only map from X to Y, sending both u and v to w. A morphism of cones must satisfy mu_j(h(x)) = lambda_j(x) for every leg j and every x in X. Give the answer as verdict = yes or no, and fails = the number of legs j for which the condition fails."
            answer: "verdict = no; fails = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fails"}]}
            solution_sketch: "The leg-commuting condition for a morphism of cones from (X, lambda) to (Y, mu) is mu_j(h(x)) = lambda_j(x) for j = 1, 2, 3. Since Y has the single point w, each mu_j(h(x)) is constant. Leg 1: mu1(h(x)) is constant 1, but lambda1(v) = 0, so leg 1 fails. Leg 2: constant 0 matches lambda2 everywhere, so leg 2 holds. Leg 3: constant 1 matches lambda3 everywhere, so leg 3 holds. So h is not a morphism of cones and exactly one leg fails. The answer is verdict = no; fails = 1."
          - problem: "Take the category whose objects are the integers from 1 to 18, with one morphism from m to n exactly when m divides n. Consider the discrete diagram whose two objects are 12 and 8. A cone over this diagram with apex x is a pair of legs, one from x to 12 and one from x to 8, and a morphism of cones is a leg-commuting map. The limit of the diagram is the terminal cone in the category of cones. Find the apex of the terminal cone."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A leg from x to 12 or to 8 means x divides 12 and x divides 8, so the cones are exactly the common divisors: 1, 2, 4. A morphism of cones from x to y is a leg-commuting map, which here means x divides y. The terminal cone receives a unique such map from every other cone, so it is the greatest common divisor. The greatest common divisor of 12 and 8 is 4, the limit of the diagram. The answer is 4."
          - problem: "Take the category whose objects are the integers from 1 to 30, with a single morphism from m to n exactly when m divides n. Consider the discrete diagram whose two objects are 6 and 10. A cocone under this diagram with nadir x is a pair of legs, one from 6 to x and one from 10 to x, and a morphism of cocones is a leg-commuting map. The colimit of the diagram is the initial cocone in the category of cocones. Find the nadir of the initial cocone."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A leg from 6 to x or from 10 to x means 6 divides x and 10 divides x, so the cocones are the common multiples in the range: only 30. A morphism of cocones from x to y is a leg-commuting map, which here means the nadir x divides the nadir y. The initial cocone sends a unique such map to every other cocone, so it is the least common multiple. The least common multiple of 6 and 10 is 30, the colimit of the diagram. The answer is 30."
          - problem: "A student argues about a diagram D in a category C. Claim: the limit of D is the initial object of the category of cones over D. Step 1: a cone over D with apex X is a family of legs from X to the objects of D, commuting with the arrows of D. Step 2: a morphism of cones from (X, lambda) to (Y, mu) is a map h from X to Y with mu_j(h(x)) = lambda_j(x) for every leg j. Step 3: a limit of D is a cone L such that for every cone (X, lambda) there is exactly one morphism of cones from L to (X, lambda). Step 4: an object that sends exactly one morphism to every object is an initial object. Step 5: therefore the limit of D is the initial object of the category of cones. Which step is the first one that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 states the definition of a cone, which is valid. Step 2 states the leg-commuting condition for cone morphisms, which is valid. Step 3 reverses the direction: a limit L must receive exactly one morphism of cones from every cone (X, lambda) to L, not send one out; the property written describes an initial object, so Step 3 is false. Step 4 correctly defines an initial object. Step 5 follows from Steps 3 and 4, but its conclusion is false because Step 3 fails. The first step that is not valid is Step 3."
          - problem: "Write the full proof: let D be a diagram in a category C. Define a morphism of cones over D, prove that the cones over D and their morphisms form a category Cone(D), and prove that a terminal object of Cone(D) is a limit of D. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Definition: a morphism of cones from (X, lambda) to (Y, mu) is a morphism h from X to Y in C with mu_j(h(x)) = lambda_j(x) for every object j of D; this is the leg-commuting condition. Step 1, identities: for a cone (X, lambda), the identity id_X satisfies lambda_j(id_X(x)) = lambda_j(x) for all j, so id_X is a morphism of cones from (X, lambda) to itself. Step 2, composition: if h goes from (X, lambda) to (Y, mu) and k goes from (Y, mu) to (Z, nu) and both are cone morphisms, then nu_j(k(h(x))) = mu_j(h(x)) = lambda_j(x) for all j, so k after h is a morphism of cones from (X, lambda) to (Z, nu). Step 3, laws: identities and composites are those of C, so associativity and identity laws are inherited, and Cone(D) is a category. Step 4, limit: let (L, lambda) be a terminal object of Cone(D); then every cone (X, gamma) admits exactly one morphism of cones h from (X, gamma) to (L, lambda), which is exactly the universal property of the limit cone. Hence a terminal object of Cone(D) is a limit of D."
    diagnostic_exemplar:
      problem: "For the parallel-pair diagram $D=(f,g\\colon A\\to B)$, show that a cone over $D$ with apex $X$ amounts to a single morphism $\\lambda_0\\colon X\\to A$ satisfying $f\\lambda_0=g\\lambda_0$."
      answer: "A cone is a natural transformation $\\Delta_X\\Rightarrow D$ with legs $\\lambda_0\\colon X\\to A$ and $\\lambda_1\\colon X\\to B$. Naturality at the two parallel arrows forces $f\\circ\\lambda_0=\\lambda_1$ and $g\\circ\\lambda_0=\\lambda_1$. So $\\lambda_1$ is determined by $\\lambda_0$, and the two conditions collapse to $f\\lambda_0=g\\lambda_0$: the cone data is exactly a fork $\\lambda_0$ over the pair."
      solution_sketch: "Write out the naturality condition at each of the two parallel arrows: each one forces $\\lambda_1$ to equal one of $f\\lambda_0$, $g\\lambda_0$. So $\\lambda_1$ is redundant and the two conditions fuse into the single fork equation."
    anki_seeds:
      - front: "A cone over a diagram $D$ with apex $X$ is..."
        back: "a natural transformation $\\Delta_X\\Rightarrow D$: legs $\\lambda_j\\colon X\\to Dj$ with $Df\\circ\\lambda_j=\\lambda_{j'}$."
        type: basic
      - front: "A morphism of cones $(X,\\lambda)\\to(Y,\\mu)$ is..."
        back: "a map $h\\colon X\\to Y$ with $\\mu_j\\circ h=\\lambda_j$ for all $j$."
        type: basic

  - id: limits-as-cones
    name: Limits as Universal Cones
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: cones-and-cocones
        weight: 0.6
        key: true
      - id: universal-properties
        weight: 0.4
        key: true
      - id: products-coproducts
        weight: 0.3
      - id: initial-terminal-objects
        weight: 0.2
      - id: discrete-indiscrete-categories
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Computing a limit cone in Set
        key_prerequisites: [universal-properties]
        constraints: "Finite sets of size at most 5; list the elements of the limit and state each leg explicitly."
        exemplars:
          - problem: "Let $A=\\{1,2,3\\}$, $B=\\{a,b\\}$, $f(1)=a$, $f(2)=a$, $f(3)=b$ and $g(1)=a$, $g(2)=b$, $g(3)=b$. Compute the limit of the parallel-pair diagram $f,g\\colon A\\to B$ in $\\mathbf{Set}$."
            answer: "$L=\\{1,3\\}$ with $\\lambda_0$ the inclusion into $A$ (and $\\lambda_1$ the induced map to $B$)."
            solution_sketch: "The limit is the equalizer $\\{x\\in A: f(x)=g(x)\\}$. Check each element: $f(1)=a=g(1)$, so $1$ is in; $f(2)=a$ but $g(2)=b$, so $2$ is out; $f(3)=b=g(3)$, so $3$ is in. Hence $L=\\{1,3\\}$ with $\\lambda_0\\colon L\\hookrightarrow A$, and $\\lambda_1=f\\lambda_0=g\\lambda_0$ sends $1\\mapsto a$, $3\\mapsto b$."
          - problem: "With $f\\colon\\{1,2,3\\}\\to\\{a,b\\}$ as above and $g'\\colon\\{x,y\\}\\to\\{a,b\\}$ given by $g'(x)=a$, $g'(y)=b$, compute the limit of the cospan $f,g'$ in $\\mathbf{Set}$."
            answer: "$L=\\{(1,x),(2,x),(3,y)\\}$, with the two coordinate projections as legs."
            solution_sketch: "The limit over a cospan is the pullback $\\{(u,v): f(u)=g'(v)\\}$. Test all six pairs: $f(1)=a=g'(x)$ so $(1,x)$ qualifies; $f(2)=a=g'(x)$ so $(2,x)$ qualifies; $f(3)=b=g'(y)$ so $(3,y)$ qualifies; $(1,y),(2,y)$ fail since $a\\neq b$, and $(3,x)$ fails since $b\\neq a$. So $L$ has three elements, with legs $\\lambda_1(u,v)=u$ and $\\lambda_2(u,v)=v$."
      - id: kp2
        name: Recovering the special cases from the shape
        key_prerequisites: [products-coproducts]
        constraints: "Name the shape category, then read off the legs and the commuting conditions it forces."
        exemplars:
          - problem: "Say which shape $\\mathcal{J}$ makes the limit of $D$ a product, an equalizer, a pullback, and a terminal object."
            answer: "Discrete two-object shape $\\Rightarrow$ product; parallel pair $\\Rightarrow$ equalizer; cospan $\\Rightarrow$ pullback; empty shape $\\Rightarrow$ terminal object."
            solution_sketch: "For $\\mathcal{J}$ discrete on two objects a cone is just a pair of maps $X\\to D0$, $X\\to D1$ with no commuting condition, so the universal cone is the product with its projections. For $\\mathcal{J}=(\\bullet\\rightrightarrows\\bullet)$ a cone reduces to one map $\\lambda_0$ with $f\\lambda_0=g\\lambda_0$, so the universal cone is the equalizer. For $\\mathcal{J}=(\\bullet\\to\\bullet\\leftarrow\\bullet)$ a cone is a pair $x_1,x_2$ with $fx_1=gx_2$, so the universal cone is the pullback. For $\\mathcal{J}=\\varnothing$ a cone carries no data, so the universal cone is a terminal object."
          - problem: "For the parallel-pair shape, check in detail that a universal cone over $D=(f,g\\colon A\\to B)$ is exactly an equalizer of $f$ and $g$."
            answer: "The $B$-leg is determined, so the data is $\\lambda_0\\colon L\\to A$ with $f\\lambda_0=g\\lambda_0$, universal — the equalizer."
            solution_sketch: "A cone with apex $X$ has legs $\\mu_0\\colon X\\to A$ and $\\mu_1\\colon X\\to B$ with $f\\mu_0=\\mu_1$ and $g\\mu_0=\\mu_1$; so $\\mu_1$ is redundant and the data reduces to $\\mu_0$ with $f\\mu_0=g\\mu_0$. A universal such cone is an object $L$ with $\\lambda_0\\colon L\\to A$, $f\\lambda_0=g\\lambda_0$, through which every such $\\mu_0$ factors uniquely. That is precisely the definition of the equalizer of $f$ and $g$."
      - id: kp3
        name: The universal property of a limit cone
        key_prerequisites: [cones-and-cocones]
        constraints: "State existence and uniqueness of the mediating map separately, and require it to commute with every leg."
        exemplars:
          - problem: "Define a limit of $D\\colon\\mathcal{J}\\to\\mathcal{C}$ as a universal cone, and restate the definition using the category of cones."
            answer: "A cone $(L,\\lambda)$ such that every cone $(X,\\mu)$ has a unique $u\\colon X\\to L$ with $\\lambda_j\\circ u=\\mu_j$ for all $j$; equivalently a terminal object of $\\mathrm{Cone}(D)$."
            solution_sketch: "A limit of $D$ is a cone $(L,\\lambda)$ with the universal property: for every cone $(X,\\mu)$ over $D$ there EXISTS a morphism $u\\colon X\\to L$ with $\\lambda_j\\circ u=\\mu_j$ for every object $j$ of $\\mathcal{J}$, and $u$ is the UNIQUE such morphism. Since a morphism of cones $(X,\\mu)\\to(L,\\lambda)$ is precisely a map $u$ satisfying those equations, the condition says exactly that $(L,\\lambda)$ is a terminal object of the category $\\mathrm{Cone}(D)$."
          - problem: "Write $\\mathrm{Cone}(X,D)$ for the set of cones over $D$ with apex $X$. Prove that a cone $(L,\\lambda)$ is a limit iff for every $X$ the map $\\Theta_X\\colon\\mathrm{Hom}(X,L)\\to\\mathrm{Cone}(X,D)$, $u\\mapsto(\\lambda_j\\circ u)_j$, is a bijection."
            answer: "Surjectivity of $\\Theta_X$ is existence of the mediating map, injectivity is its uniqueness."
            solution_sketch: "$\\Theta_X$ is well defined: for $u\\colon X\\to L$ the family $(\\lambda_j u)_j$ is a cone, since $Df\\circ\\lambda_j\\circ u=\\lambda_{j'}\\circ u$ follows from the cone condition on $\\lambda$. Surjectivity of $\\Theta_X$ says every cone $(X,\\mu)$ is $(\\lambda_j u)_j$ for some $u$, i.e. a mediating map EXISTS and commutes with every leg. Injectivity says two maps inducing the same cone are equal, i.e. the mediating map is UNIQUE. So all $\\Theta_X$ bijective is precisely the universal property, and conversely. The bijection is automatically natural in $X$ (both sides act by precomposition), which says $L$ represents the functor $X\\mapsto\\mathrm{Cone}(X,D)$."
    diagnostic_exemplar:
      problem: "Write $\\mathrm{Cone}(X,D)$ for the set of cones over $D$ with apex $X$. Prove that a cone $(L,\\lambda)$ is a limit of $D$ iff for every object $X$ the map $\\Theta_X\\colon\\mathrm{Hom}(X,L)\\to\\mathrm{Cone}(X,D)$, $u\\mapsto(\\lambda_j\\circ u)_j$, is a bijection."
      answer: "$\\Theta_X$ is well defined: $(\\lambda_ju)_j$ is a cone since $Df\\circ\\lambda_j\\circ u=\\lambda_{j'}\\circ u$ follows from the cone condition on $\\lambda$. Surjectivity of $\\Theta_X$ for all $X$ says every cone $(X,\\mu)$ equals $(\\lambda_ju)_j$ for some $u$ — the EXISTENCE of a mediating map commuting with every leg. Injectivity says two maps inducing the same cone coincide — its UNIQUENESS. Together these are precisely the universal property of a limit cone, and conversely a limit cone makes every $\\Theta_X$ a bijection."
      solution_sketch: "Check first that $\\Theta_X$ really lands in cones, then match clause to clause: surjectivity for every $X$ is the existence of a mediating map, injectivity is its uniqueness. That dictionary runs in both directions, which is what makes the statement an iff."
    anki_seeds:
      - front: "A limit of $D$ is..."
        back: "a universal (terminal) cone over $D$: every cone factors uniquely through it."
        type: basic
      - front: "The limit over a discrete shape is a {{c1::product}}; over a parallel pair, an {{c2::equalizer}}; over a cospan, a {{c3::pullback}}."
        back: "product; equalizer; pullback"
        type: cloze
      - front: "The limit over the empty shape is..."
        back: "a terminal object."
        type: basic

  - id: initial-terminal-as-limits
    name: Initial and Terminal Objects as (Co)Limits
    core: false                # re-characterisation result; feeds only complete-categories
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: limits-as-cones
        weight: 0.5
        key: true
      - id: initial-terminal-objects
        weight: 0.4
        key: true
      - id: cones-and-cocones
        weight: 0.3
      - id: duality-opposite-categories
        weight: 0.2
      - id: equalizers-coequalizers
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The empty diagram
        key_prerequisites: [limits-as-cones]
        constraints: "Say explicitly what data a cone over the empty diagram carries (none) before concluding."
        exemplars:
          - problem: "A category is built from a poset with four elements a, b, c, d and relations a <= b, a <= c, b <= d, c <= d: there is exactly one morphism from x to y when x <= y. A cone over the empty diagram carries no legs and no conditions, so a cone is just an apex object. Which element is the limit of the empty diagram?"
            answer: "d"
            answer_contract: {"kind": "label", "options": [["d"], ["b"], ["c"], ["a"]]}
            solution_sketch: "Step 1 (cone over the empty diagram): a cone carries no legs and no conditions, so a cone is just an apex object. Step 2 (universal property): the limit is the terminal object among cones, so the terminal element of the poset. Step 3 (terminal test): d receives exactly one morphism from a, from b, from c and from itself. Option b fails because c and d have no morphism to b; option c fails because b and d have no morphism to c; option a is the initial element, which is the colimit, not the limit. The answer is d."
          - problem: "A cocone under the empty diagram carries no legs and no conditions, so cocones are just objects. By duality the colimit of the empty diagram is the initial object, and in Set the initial object is the empty set. How many functions are there from the set {p, q} to this colimit object?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (cocone over the empty diagram): a cocone carries no legs and no conditions, so the category of cocones is Set itself. Step 2 (duality): the colimit is the initial object of this category, which in Set is the empty set. Step 3 (count functions): a function from {p, q} to the empty set must send p somewhere, and there is nowhere to send it, so no such function exists. The answer is 0."
          - problem: "View the poset of all subsets of {1, 2, 3}, ordered by inclusion, as a category: there is exactly one morphism from S to T when S is contained in T. A cone over the empty diagram carries no data beyond its apex, so the cones are just the subsets. How many elements does the limit of the empty diagram have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (cone over the empty diagram): a cone carries no legs and no conditions, so a cone is just a subset. Step 2 (universal property): the limit is the terminal object, the subset that every subset maps into. Step 3 (greatest element): under inclusion this is the full set {1, 2, 3}. Step 4 (count): this set has three elements. The answer is 3."
          - problem: "View the chain 1 < 2 < 3 < 4 as a category: there is exactly one morphism from i to j when i <= j. A cone over the empty diagram carries no legs, so the limit is the terminal object of this category. How many morphisms have the limit object as their target?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (cone over the empty diagram): a cone carries no data beyond its apex, so the limit is the terminal object. Step 2 (terminal in a chain): the top element 4 is terminal, since i <= 4 for every element i. Step 3 (count morphisms): the morphisms with target 4 are (1,4), (2,4), (3,4) and (4,4), four in all. The answer is 4."
          - problem: "Claim: the limit of the empty diagram in Set is the empty set. Step 1: a cone over the empty diagram with apex X consists of no legs and satisfies no conditions, so every set is a cone. Step 2: a morphism of cones from X to Y is any function from X to Y, since no legs need to commute. Step 3: the limit is the cone that receives exactly one morphism of cones from every other cone. Step 4: the empty set receives exactly one function from every set, so it is the limit. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: a cone over the empty diagram indeed carries no legs and no conditions. Step 2 is valid: with no legs, any function is a morphism of cones. Step 3 is valid: it is exactly the universal property of the limit. Step 4 is not valid: the empty set receives no function at all from a nonempty set, so it fails the universal property; the set receiving exactly one function from every set is a one-element set. The first invalid step is Step 4."
          - problem: "In Set, let X be the two-element set {a, b}. A cone over the empty diagram with apex X carries no legs, so a morphism from this cone to the limit cone is just a function from X to the limit object. How many morphisms of cones are there from the cone with apex X to the limit cone?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (cone over the empty diagram): the cone with apex X carries no legs and no conditions. Step 2 (universal property): the limit cone receives exactly one morphism of cones from every cone. Step 3 (check in Set): the limit object is a one-element set, and the functions from {a, b} to a one-element set number exactly one. The answer is 1."
          - problem: "Write the full proof: in any category, a limit of the empty diagram is exactly a terminal object. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the data of a cone): the empty shape has no objects and no morphisms, so a cone over the empty diagram with apex X consists of zero legs and satisfies zero commuting conditions; explicitly, a cone carries no data beyond its apex X. Step 2 (morphisms of cones): a morphism of cones from X to Y is a morphism f from X to Y in C with no leg conditions to check, so the category of cones over the empty diagram is C itself. Step 3 (limit to terminal): the limit of the empty diagram is a terminal object of the category of cones, hence a terminal object of C. Step 4 (converse): if T is terminal in C, then T as a bare apex admits exactly one morphism of cones from every cone, so T is a limit of the empty diagram. Conclusion: the limits of the empty diagram are exactly the terminal objects of C."
      - id: kp2
        name: Why finite completeness needs a terminal object
        key_prerequisites: [equalizers-coequalizers]
        constraints: "Any counterexample must be checked on all three requirements: binary products, equalizers, terminal object."
        exemplars:
          - problem: "State the criterion for finite completeness in terms of terminal object, binary products, and equalizers, and say where the terminal object comes from."
            answer: "$\\mathcal{C}$ has all finite limits iff it has a terminal object, all binary products, and all equalizers; the terminal object is the limit of the empty diagram."
            solution_sketch: "A finite diagram has a limit as soon as one can form the product of its objects and equalize the maps forced by its arrows; the general products-and-equalizers construction then produces the limit. The empty diagram is the one case the product-and-equalizer step cannot supply, and its limit is exactly a terminal object. So the three conditions are needed, and conversely they suffice — with $\\mathcal{J}$ finite, the products involved are finite."
          - problem: "Show that the poset $(\\mathbb{N},\\le)$, viewed as a category, has all binary products and all equalizers but is not finitely complete."
            answer: "Binary products are minima and equalizers are identities, but there is no greatest element, so there is no terminal object."
            solution_sketch: "In a poset category there is at most one arrow between objects. The product of $m,n$ is their greatest lower bound $\\min(m,n)$, which always exists in $(\\mathbb{N},\\le)$. Any parallel pair of arrows is a single arrow repeated, so every equalizer exists and is an identity. But a terminal object would be a greatest natural number, and $\\mathbb{N}$ has none. Since the empty diagram has no limit, $(\\mathbb{N},\\le)$ is not finitely complete — binary products and equalizers alone are not enough."
    diagnostic_exemplar:
      problem: "Show that the poset $(\\mathbb{N},\\le)$, viewed as a category, has all binary products and all equalizers, yet is not finitely complete."
      answer: "Binary products are greatest lower bounds, and $\\min(m,n)$ always exists. Any parallel pair of arrows in a poset category is a single arrow repeated (hom-sets have at most one element), so its equalizer exists trivially (the identity on the source). But the limit of the EMPTY diagram is a terminal object, i.e. a greatest element of $(\\mathbb{N},\\le)$, which does not exist. So one finite diagram has no limit and the category is not finitely complete."
      solution_sketch: "Binary products are meets, and $\\min(m,n)$ always exists; equalizers are trivial because a thin category has at most one arrow per hom-set. The failure is the empty diagram, whose limit is a terminal object — a greatest natural number, which does not exist."
    anki_seeds:
      - front: "The limit of the empty diagram is..."
        back: "a terminal object (dually, the colimit of the empty diagram is an initial object)."
        type: basic
      - front: "In $\\mathbf{Set}$, the limit of the empty diagram is {{c1::a one-element set}}, not the empty set."
        back: "a one-element set"
        type: cloze
      - front: "Finite completeness requires which three things?"
        back: "a terminal object, all binary products, and all equalizers."
        type: basic

  - id: limits-colimits
    name: Limits and Colimits
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: limits-as-cones
        weight: 0.5
        key: true
      - id: cones-and-cocones
        weight: 0.4
        key: true
      - id: universal-properties
        weight: 0.4
        key: true
      - id: products-coproducts
        weight: 0.3
      - id: pullbacks-pushouts
        weight: 0.3
      - id: initial-terminal-objects
        weight: 0.2
      - id: duality-opposite-categories
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The explicit construction of limits in Set
        key_prerequisites: [limits-as-cones]
        constraints: "The compatible-families formula, proved universal or evaluated on diagrams of finite sets with at most 4 elements per set."
        exemplars:
          - problem: "In Set, let D be the cospan A -> C <- B, where A = {0, 1}, B = {2, 3} and C = {5}, with the only possible maps. Let (X, mu) be the cone over D with X = {7, 8}, mu_A(7) = 1, mu_A(8) = 0, mu_B(7) = 3, mu_B(8) = 2. The universal property of the limit gives a unique map u: X -> lim D whose composite with each leg equals the matching leg of the cone. Give u(8) as (a, b), listing the A-coordinate first."
            answer: "(0, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The limit L is the set of compatible families: triples (a, c, b) with a in A, c in C, b in B whose images in C agree; compatibility is automatic here because C has a single element. Rule of the universal property: the mediating map sends each x to the family of its leg values, so u(8) has A-coordinate mu_A(8) = 0 and B-coordinate mu_B(8) = 2. The answer is (0, 2)."
          - problem: "In Set, let D be the cospan A -> C <- B where A = {0, 1, 2}, B = {0, 1} and C = {4}, with the only possible maps. Use the compatible-families formula to compute the limit of D. How many elements does the limit have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A compatible family is a choice of a in A, c in C and b in B whose images in C agree. Rule: since C has a single element, every pair (a, b) is compatible and the middle coordinate c is forced, so the limit is the full product of A and B. Its size is 3 times 2 = 6. The answer is 6."
          - problem: "In Set, let D be the parallel pair of maps f, g: A -> B with A = {0, 1, 2, 3} and B = {0, 1}, where f sends 0 and 1 to 0 and sends 2 and 3 to 1, while g sends 0 to 0, sends 1 to 1, sends 2 to 1 and sends 3 to 0. Use the compatible-families formula to compute the limit of D. Give the elements of the limit in increasing order."
            answer: "0, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "For a parallel pair, the limit is the set of elements a in A with f(a) = g(a), with the inclusion leg. Check each element by the compatibility rule: f(0) = 0 = g(0); f(1) = 0 but g(1) = 1; f(2) = 1 = g(2); f(3) = 1 but g(3) = 0. The compatible elements are 0 and 2. The answer is 0, 2."
          - problem: "In Set, let D be the cospan A -> C <- B with A = {0, 1, 2, 3}, C = {0, 1} and B = {0, 1, 2}. The map from A to C sends 0, 1 and 2 to 0 and sends 3 to 1; the map from B to C sends 0 to 0 and sends 1 and 2 to 1. Use the compatible-families formula to compute the limit of D. Find the number of elements in the limit."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit is the set of compatible pairs (a, b) with f(a) = g(b), with the two projection legs. Count by the compatibility rule, fixing b: b = 0 has g(b) = 0, and three elements a of A map to 0; b = 1 and b = 2 have g(b) = 1, and only a = 3 maps to 1. The total count is 3 + 1 + 1. The answer is 5."
          - problem: "Claim: for every cone (X, mu) over a diagram D from a small index category to Set, the map u: X -> lim D defined by u(x) = (mu_j(x))_j is the unique cone morphism. Step 1: each value mu_j(x) lies in D(j), so the family (mu_j(x))_j lies in the product of all the sets D(j). Step 2: the cone condition gives D(f)(mu_j(x)) = mu_j'(x) for every arrow f from j to j', so the family is compatible and u(x) lies in lim D. Step 3: the projection legs satisfy lambda_j(u(x)) = mu_j(x) for every j, so each leg composed with u equals the matching cone leg. Step 4: if a map v from X to lim D satisfies lambda_j v = mu_j for at least one object j, then v equals u. Step 5: therefore u is unique and lim D is the universal cone. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 correctly states membership in the product. Step 2 applies the cone condition correctly to get compatibility. Step 3 holds because the j-th coordinate of u(x) is exactly mu_j(x). Step 4 is invalid: agreement of one single coordinate does not force v = u; uniqueness needs the equations for every object j, since only then is every coordinate of v(x) fixed. Step 5 is a valid conclusion once Step 4 is corrected. The answer is Step 4."
          - problem: "A student proves that the pullback of maps f: A -> C and g: B -> C in Set is the limit of the cospan A -> C <- B. Step 1: a cone from a set X is a pair of maps m1: X -> A and m2: X -> B with f m1 = g m2. Step 2: let P be the set of pairs (a, b) in A x B with f(a) = g(b), with legs p1(a, b) = a and p2(a, b) = b. Step 3: define u: X -> P by u(x) = (m1(x), m2(x)). Step 4: the line is missing. Step 5: hence u is the unique cone morphism from X to P, so P is the limit. Select the line for Step 4 that makes the proof valid."
            answer: "u(x) lies in P, and p1 u = m1 and p2 u = m2, so u is unique"
            answer_contract: {"kind": "label", "options": [["u(x) lies in P, and p1 u = m1 and p2 u = m2, so u is unique"], ["u(x) = (m2(x), m1(x)), so the legs of P are swapped"], ["p1 u = m1 for at least one x, which is enough here"], ["the cone condition forces m1 = m2, so u(x) = m1(x)"]]}
            solution_sketch: "The full object is P, the set of pairs (a, b) with f(a) = g(b). Rule of the cone condition: f m1 = g m2 shows that u(x) = (m1(x), m2(x)) satisfies the membership condition of P, and then p1 u = m1 and p2 u = m2, which fix both coordinates of u(x) and give uniqueness. The option with swapped coordinates assigns the legs to the wrong components. The option about one single x confuses one pointwise check with the universal property. The option claiming m1 = m2 asserts an equality that the cone condition never gives. The answer is u(x) lies in P, and p1 u = m1 and p2 u = m2, so u is unique."
          - problem: "Write the full proof: in Set, the set of compatible families of a small diagram D, with the projection legs, is the limit of D. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the cone): let L be the set of all families (x_j) with x_j in D(j) for every object j and D(f)(x_j) = x_j' for every arrow f from j to j', and let lambda_j send (x_j) to x_j; the compatibility condition is exactly the cone condition, so (L, lambda) is a cone over D. Step 2 (the mediating map): given any cone (X, mu), define u: X -> L by u(x) = (mu_j(x))_j; the cone condition for (X, mu) says D(f)(mu_j(x)) = mu_j'(x), so u(x) is compatible and lies in L, and lambda_j u = mu_j for every j. Step 3 (uniqueness): if v: X -> L also satisfies lambda_j v = mu_j for every j, then the j-th coordinate of v(x) equals mu_j(x) for every j, so v(x) = u(x) for all x, hence v = u. Conclusion: every cone admits exactly one mediating map, so (L, lambda) is the universal cone and L is the limit of D in Set."
      - id: kp2
        name: Uniqueness of limits
        key_prerequisites: [universal-properties]
        constraints: "Elementless arguments from the universal property: uniqueness up to unique cone isomorphism, and joint monicity of the legs; every mediating map must be justified."
        exemplars:
          - problem: "Prove a limit of $D$, if it exists, is unique up to a unique isomorphism of cones."
            answer: "It is a terminal object of $\\mathrm{Cone}(D)$."
            solution_sketch: "By definition a limit is a terminal object in the category $\\mathrm{Cone}(D)$. Terminal objects are unique up to a unique isomorphism, and here that isomorphism is a cone morphism, hence commutes with all legs $\\lambda_j$. Therefore limits are unique up to unique compatible isomorphism."
          - problem: "Prove the legs $(\\lambda_j)$ of a limit cone $(L,\\lambda)$ over $D$ are jointly monic: if $\\lambda_j u=\\lambda_j v$ for all $j$, then $u=v$."
            answer: "Both $u,v$ are the unique mediating map for the same cone $(\\lambda_j u)_j$, so $u=v$."
            solution_sketch: "Let $u,v\\colon X\\to L$ satisfy $\\lambda_j u=\\lambda_j v=:\\mu_j$ for every $j$. The family $(\\mu_j)$ is a cone with apex $X$, inheriting naturality from $\\lambda$, so the limit's universal property provides a UNIQUE cone map $X\\to L$ with legs $\\mu_j$. Both $u$ and $v$ are such maps, hence $u=v$. This joint monicity of the legs is exactly the uniqueness clause of the limit and drives the proof that limits are unique up to unique isomorphism."
      - id: kp3
        name: Colimits by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Everything obtained by dualizing the limit story; the $\\mathbf{Set}$ colimit formula is the quotient of the disjoint union by the generated equivalence relation."
        exemplars:
          - problem: "Define a colimit of $D$ and identify colimits over discrete, parallel-pair, and span shapes."
            answer: "An initial cocone; coproduct, coequalizer, pushout respectively."
            solution_sketch: "A colimit of $D$ is an initial cocone $(C,\\gamma\\colon D\\Rightarrow\\Delta_C)$: every cocone factors through a unique map $C\\to X$. Dually to limits, the colimit over a discrete shape is the coproduct, over the parallel pair the coequalizer, over a span $\\bullet\\leftarrow\\bullet\\to\\bullet$ the pushout, and over the empty diagram the initial object. A colimit in $\\mathcal C$ is a limit in $\\mathcal C^{op}$."
          - problem: "In $\\mathbf{Set}$, give the explicit formula for the colimit of a small diagram $D\\colon\\mathcal J\\to\\mathbf{Set}$."
            answer: "$\\mathrm{colim}\\,D=\\big(\\coprod_j Dj\\big)/\\!\\sim$, where $x\\sim Df(x)$ for $x\\in Dj$, $f\\colon j\\to j'$."
            solution_sketch: "Dually to the limit formula, the colimit in $\\mathbf{Set}$ is a quotient of the disjoint union: $\\mathrm{colim}\\,D=\\big(\\coprod_j Dj\\big)/\\!\\sim$, with $\\sim$ the smallest equivalence relation satisfying $x\\sim Df(x)$ for every $x\\in Dj$, $f\\colon j\\to j'$. The leg $\\gamma_j\\colon Dj\\to\\mathrm{colim}\\,D$ sends $x$ to its class, giving the initial (universal) cocone. Specializing $\\mathcal J$ recovers coproducts, coequalizers, and pushouts in $\\mathbf{Set}$."
    diagnostic_exemplar:
      problem: "Prove that the legs $(\\lambda_j)$ of a limit cone $(L,\\lambda)$ over $D$ are jointly monic: if $u,v\\colon X\\to L$ satisfy $\\lambda_j u=\\lambda_j v$ for every $j$, then $u=v$."
      answer: "Set $\\mu_j=\\lambda_ju=\\lambda_jv$. The family $(\\mu_j)$ is a cone with apex $X$: for $f\\colon j\\to j'$, $Df\\circ\\mu_j=Df\\circ\\lambda_j\\circ u=\\lambda_{j'}\\circ u=\\mu_{j'}$, inheriting the cone condition from $\\lambda$. The limit's universal property supplies a UNIQUE morphism $X\\to L$ whose legs are $(\\mu_j)$; both $u$ and $v$ are such morphisms, so $u=v$."
      solution_sketch: "Show the common family $(\\lambda_j u)$ is itself a cone over $D$, inheriting the condition from $\\lambda$; then $u$ and $v$ are two mediating maps for one cone, and the uniqueness half of the limit property finishes it."
    anki_seeds:
      - front: "Formula for $\\lim D$ in $\\mathbf{Set}$?"
        back: "the set of compatible families $(x_j)$ with $Df(x_j)=x_{j'}$ for every $f\\colon j\\to j'$."
        type: basic
      - front: "Formula for $\\mathrm{colim}\\,D$ in $\\mathbf{Set}$?"
        back: "$\\big(\\coprod_j Dj\\big)/\\!\\sim$, where $x\\sim Df(x)$ for $x\\in Dj$, $f\\colon j\\to j'$."
        type: basic
      - front: "A colimit in $\\mathcal C$ is a limit in..."
        back: "$\\mathcal C^{op}$ (colimits are dual to limits)."
        type: basic

  - id: exponential-objects
    name: Exponential Objects
    core: true  # ancestor of core adjunction-examples/monad-examples (PEDAGOGY §1 invariant)
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: products-coproducts
        weight: 0.4
        key: true
      - id: universal-properties
        weight: 0.4
        key: true
      - id: hom-functors
        weight: 0.3
      - id: commutative-diagrams
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Exponentials via currying in Set
        key_prerequisites: [universal-properties]
        constraints: "State the evaluation-plus-unique-curry universal property; identifications only in $\\mathbf{Set}$ (function sets) or posets with finite meets (Heyting implication)."
        exemplars:
          - problem: "Define the exponential object $B^A$ by its universal property and identify it in $\\mathbf{Set}$."
            answer: "$B^A$ with $\\mathrm{ev}\\colon B^A\\times A\\to B$ universal; in Set the set of functions $A\\to B$."
            solution_sketch: "An exponential $B^A$ carries $\\mathrm{ev}\\colon B^A\\times A\\to B$ such that for every $g\\colon X\\times A\\to B$ there is a unique $\\hat g\\colon X\\to B^A$ (its curry) with $\\mathrm{ev}\\circ(\\hat g\\times 1_A)=g$. In $\\mathbf{Set}$, $B^A=\\{$functions $A\\to B\\}$, $\\mathrm{ev}(f,a)=f(a)$, and $\\hat g(x)=(a\\mapsto g(x,a))$ is the unique such map."
          - problem: "In a poset (as a category) with finite meets, identify the exponential object $b^a$."
            answer: "The relative pseudocomplement $a\\Rightarrow b=\\bigvee\\{x : x\\wedge a\\le b\\}$, when it exists (Heyting implication)."
            solution_sketch: "In a poset, the product $x\\times a$ is the meet $x\\wedge a$, so the currying bijection $\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$ becomes the equivalence $x\\wedge a\\le b\\iff x\\le b^a$ (hom-sets have at most one element). Thus $b^a$ is the largest element whose meet with $a$ lies below $b$, i.e. the relative pseudocomplement $a\\Rightarrow b=\\bigvee\\{x:x\\wedge a\\le b\\}$, and evaluation is the counit $(a\\Rightarrow b)\\wedge a\\le b$. A poset with finite meets, a top and all such exponentials is cartesian closed; it is a Heyting algebra only if it is moreover a bounded lattice, since a Heyting algebra is by definition a bounded lattice with implication. Cartesian closure supplies neither joins nor a bottom: $(\\mathbb Z\\cup\\{+\\infty\\},\\le)$ has all meets, the top $+\\infty$, and exponentials ($b^a=+\\infty$ when $a\\le b$ and $b^a=b$ otherwise), yet it has no least element."
      - id: kp2
        name: The curry/uncurry bijection is natural
        key_prerequisites: [hom-functors]
        constraints: "Derive the bijection and its naturality from the universal property alone; every identification of two maps must go through the uniqueness of currying."
        exemplars:
          - problem: "Deduce the natural bijection $\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$ from the universal property of $B^A$."
            answer: "Currying $g\\mapsto\\hat g$ and uncurrying are mutually inverse, natural in $X$."
            solution_sketch: "The universal property gives, for each $g\\colon X\\times A\\to B$, a unique curry $\\hat g\\colon X\\to B^A$; conversely each $h\\colon X\\to B^A$ uncurries to $\\mathrm{ev}\\circ(h\\times 1_A)$, and these operations are mutually inverse. Hence $\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$; naturality in $X$ holds because precomposing $g$ by $k\\times 1_A$ corresponds to precomposing $\\hat g$ by $k$. This is precisely the adjunction $(-\\times A)\\dashv(-)^A$."
          - problem: "Prove that currying is also natural in the target: for $k\\colon B\\to B'$ and $g\\colon X\\times A\\to B$, show $\\widehat{k\\circ g}=k^A\\circ\\hat g$, where $k^A\\colon B^A\\to B'^A$ is the unique map with $\\mathrm{ev}\\circ(k^A\\times 1_A)=k\\circ\\mathrm{ev}$."
            answer: "$k^A\\circ\\hat g$ satisfies the defining equation of the curry of $k\\circ g$, so uniqueness identifies the two."
            solution_sketch: "First, $k^A$ is well defined: it is the curry of $k\\circ\\mathrm{ev}\\colon B^A\\times A\\to B'$, so $\\mathrm{ev}\\circ(k^A\\times 1_A)=k\\circ\\mathrm{ev}$. Now uncurry $k^A\\circ\\hat g$, using $(u\\circ v)\\times 1_A=(u\\times 1_A)\\circ(v\\times 1_A)$: $\\mathrm{ev}\\circ((k^A\\circ\\hat g)\\times 1_A)=\\mathrm{ev}\\circ(k^A\\times 1_A)\\circ(\\hat g\\times 1_A)=k\\circ\\mathrm{ev}\\circ(\\hat g\\times 1_A)=k\\circ g$. So $k^A\\circ\\hat g$ is a curry of $k\\circ g$, and the universal property says there is exactly one, whence $\\widehat{k\\circ g}=k^A\\circ\\hat g$. Together with naturality in $X$ this makes $\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$ natural in both variables, and it is what makes $(-)^A$ a functor."
    diagnostic_exemplar:
      problem: "From the universal property of the exponential $B^A$ (evaluation $\\mathrm{ev}\\colon B^A\\times A\\to B$ with unique currying), deduce the bijection $\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$."
      answer: "Currying sends $g\\colon X\\times A\\to B$ to the unique $\\hat g\\colon X\\to B^A$ with $\\mathrm{ev}\\circ(\\hat g\\times 1_A)=g$; uncurrying sends $h\\colon X\\to B^A$ to $\\mathrm{ev}\\circ(h\\times 1_A)$. Uncurrying after currying returns $g$ by the defining equation. Currying after uncurrying returns $h$: $h$ satisfies the defining equation of the curry of $\\mathrm{ev}\\circ(h\\times 1_A)$, and the universal property says there is exactly one such map. So the two operations are mutually inverse, giving the bijection."
      solution_sketch: "Define currying and uncurrying from the universal property and check the two round trips. One direction is just the defining equation of $\\mathrm{ev}$; the other needs the uniqueness clause, which says no other map satisfies that equation."
    anki_seeds:
      - front: "Universal property of the exponential $B^A$?"
        back: "$\\mathrm{ev}\\colon B^A\\times A\\to B$ with: every $g\\colon X\\times A\\to B$ has a unique curry $\\hat g\\colon X\\to B^A$, $\\mathrm{ev}\\circ(\\hat g\\times 1_A)=g$."
        type: basic
      - front: "Exponentials give the natural bijection..."
        back: "$\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$ (currying), i.e. $(-\\times A)\\dashv(-)^A$."
        type: basic

  - id: preservation-reflection-of-limits
    name: Preserving and Reflecting Limits
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: limits-colimits
        weight: 0.5
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: limits-as-cones
        weight: 0.3
      - id: functor-composition-identity
        weight: 0.2
      - id: functors
        weight: 0.2
      # Phase C reconciliation: kp2 proves the free-group functor $F$ fails to preserve
      # binary products, computing $F(\{*\}) = \mathbb{Z}$ and refuting
      # $\mathbb{Z} \cong \mathbb{Z}\times\mathbb{Z}$ — free-groups-presentations kp1.
      - id: free-groups-presentations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The definitions
        key_prerequisites: [limits-colimits]
        constraints: "Distinguish carefully between a hypothesis on $D$ and a hypothesis on $FD$; never assume limits exist."
        exemplars:
          - problem: "Define what it means for a functor $F\\colon\\mathcal{C}\\to\\mathcal{D}$ to preserve, and to reflect, limits of a diagram $D\\colon\\mathcal{J}\\to\\mathcal{C}$."
            answer: "Preserves: $F$ carries every limit cone over $D$ to a limit cone over $FD$. Reflects: if $(L,\\lambda)$ is a cone over $D$ whose image $(FL,F\\lambda)$ is a limit cone over $FD$, then $(L,\\lambda)$ is already a limit cone."
            solution_sketch: "A functor $F$ sends a cone $(L,\\lambda)$ over $D$ to the cone $(FL,F\\lambda)$ over $FD$, since applying $F$ to the leg equations $Df\\circ\\lambda_j=\\lambda_{j'}$ gives $FDf\\circ F\\lambda_j=F\\lambda_{j'}$. $F$ preserves limits of $D$ if it turns limit cones into limit cones. $F$ reflects limits of $D$ if the converse implication holds for cones over $D$: whenever the image cone is universal, the original was. The two conditions are independent — neither implies the other."
          - problem: "Suppose $F$ preserves limits and both $\\lim D$ and $\\lim FD$ exist. What does preservation say about the canonical comparison morphism $F(\\lim D)\\to\\lim(FD)$?"
            answer: "It is an isomorphism."
            solution_sketch: "The image cone $(F\\lim D,F\\lambda)$ is a cone over $FD$, so the universal property of $\\lim FD$ gives a canonical comparison $c\\colon F(\\lim D)\\to\\lim(FD)$ commuting with the legs. If $F$ preserves the limit, then $(F\\lim D,F\\lambda)$ is itself a limit cone over $FD$; two limit cones over the same diagram are uniquely isomorphic by a cone map, and that map is exactly $c$. So preservation is precisely the statement that the canonical comparison is an isomorphism."
      - id: kp2
        name: Examples and non-examples
        key_prerequisites: [functors, free-groups-presentations]
        constraints: "A failure of preservation must be shown with a concrete diagram and a proof that the two objects are non-isomorphic."
        exemplars:
          - problem: "Show the forgetful functor $U\\colon\\mathbf{Grp}\\to\\mathbf{Set}$ preserves binary products and equalizers."
            answer: "$U(G\\times H)=UG\\times UH$ and the equalizer subgroup has the equalizer of the underlying maps as its underlying set."
            solution_sketch: "The product in $\\mathbf{Grp}$ is the direct product $G\\times H$ with componentwise operation and the coordinate projections; its underlying set with the underlying projections is exactly the cartesian product cone in $\\mathbf{Set}$, which is a limit cone. The equalizer of $f,g\\colon G\\to H$ in $\\mathbf{Grp}$ is the subgroup $E=\\{x\\in G: f(x)=g(x)\\}$ with the inclusion; its underlying set is $\\{x\\in UG: Uf(x)=Ug(x)\\}$ with the inclusion, which is the equalizer cone in $\\mathbf{Set}$. So $U$ carries these limit cones to limit cones."
          - problem: "Show the free-group functor $F\\colon\\mathbf{Set}\\to\\mathbf{Grp}$ does not preserve binary products."
            answer: "With $X=Y=\\{*\\}$: $F(X\\times Y)=\\mathbb{Z}$ but $FX\\times FY=\\mathbb{Z}\\times\\mathbb{Z}$, and $\\mathbb{Z}\\not\\cong\\mathbb{Z}\\times\\mathbb{Z}$."
            solution_sketch: "The free group on a one-element set is $\\mathbb{Z}$. Take $X=Y=\\{*\\}$; then $X\\times Y$ is again a one-element set, so $F(X\\times Y)\\cong\\mathbb{Z}$, while $FX\\times FY\\cong\\mathbb{Z}\\times\\mathbb{Z}$. These are not isomorphic: $\\mathbb{Z}$ is cyclic, but if $(a,b)$ generated $\\mathbb{Z}\\times\\mathbb{Z}$ then $(1,0)=n(a,b)$ forces $na=1$ and $nb=0$, so $a=n=\\pm1$ and $b=0$; then every multiple of $(a,0)$ has second coordinate $0$ and $(0,1)$ is not reached. So the comparison map cannot be an isomorphism and $F$ does not preserve binary products — consistent with $F$ being a left adjoint, which preserves colimits rather than limits."
      - id: kp3
        name: Fully faithful functors reflect limits
        key_prerequisites: [full-faithful-functors]
        constraints: "Use fullness to lift a mediating morphism and faithfulness to prove the equations and uniqueness."
        exemplars:
          - problem: "Prove that a fully faithful functor $F$ reflects limits."
            answer: "Lift the mediating map through fullness; faithfulness gives the leg equations and uniqueness."
            solution_sketch: "Let $(L,\\lambda)$ be a cone over $D$ with $(FL,F\\lambda)$ a limit cone over $FD$, and let $(X,\\mu)$ be any cone over $D$. Then $(FX,F\\mu)$ is a cone over $FD$, so there is a unique $u\\colon FX\\to FL$ with $F\\lambda_j\\circ u=F\\mu_j$ for all $j$. By fullness $u=Fv$ for some $v\\colon X\\to L$, and then $F(\\lambda_j\\circ v)=F\\mu_j$, so faithfulness gives $\\lambda_j\\circ v=\\mu_j$: $v$ is a cone map. If $v'$ is another, then $Fv'$ satisfies the same equations as $u$, so $Fv'=u=Fv$ and faithfulness gives $v'=v$. Hence $(L,\\lambda)$ is a limit cone."
          - problem: "Show that $U\\colon\\mathbf{Top}\\to\\mathbf{Set}$ does not reflect limits."
            answer: "Give $\\mathbb{R}\\times\\mathbb{R}$ the discrete topology with the two projections: the underlying cone of sets is a limit, but the cone in $\\mathbf{Top}$ is not."
            solution_sketch: "Let $P$ be the set $\\mathbb{R}\\times\\mathbb{R}$ with the discrete topology and let $p_1,p_2$ be the coordinate projections, which are continuous because $P$ is discrete. Applying $U$ gives the cartesian product cone in $\\mathbf{Set}$, a limit cone. But $(P,p_1,p_2)$ is not a product in $\\mathbf{Top}$: take $Z=\\mathbb{R}^2$ with the Euclidean topology and the continuous maps $\\pi_1,\\pi_2$; a mediating map $Z\\to P$ would have to be the identity function, which is not continuous from the Euclidean to the discrete topology. So no mediating map exists, the cone is not universal, and $U$ fails to reflect limits."
    diagnostic_exemplar:
      problem: "Prove that a fully faithful functor $F\\colon\\mathcal{C}\\to\\mathcal{D}$ reflects limits."
      answer: "Let $(L,\\lambda)$ be a cone over $D$ whose image $(FL,F\\lambda)$ is a limit cone over $FD$, and let $(X,\\mu)$ be any cone over $D$. Then $(FX,F\\mu)$ is a cone over $FD$, so there is a unique $u\\colon FX\\to FL$ with $F\\lambda_j\\circ u=F\\mu_j$ for all $j$. By fullness $u=Fv$ for some $v\\colon X\\to L$; then $F(\\lambda_j\\circ v)=F\\mu_j$ and faithfulness gives $\\lambda_j\\circ v=\\mu_j$, so $v$ is a cone morphism. If $v'$ is another, $Fv'$ satisfies the equations characterizing $u$, so $Fv'=u=Fv$ and faithfulness gives $v'=v$. Hence $(L,\\lambda)$ is a limit cone."
      solution_sketch: "Transport an arbitrary cone over $D$ down into $\\mathcal D$ and mediate there, then lift the mediating map back with fullness and verify its leg equations with faithfulness. Uniqueness downstairs comes from uniqueness upstairs plus faithfulness once more."
    anki_seeds:
      - front: "A functor preserves limits when..."
        back: "it sends limit cones to limit cones (the canonical comparison is an isomorphism)."
        type: basic
      - front: "A functor reflects limits when..."
        back: "a cone whose image is a limit cone must already have been a limit cone."
        type: basic
      - front: "Fully faithful functors {{c1::reflect}} limits."
        back: "reflect"
        type: cloze

  - id: complete-categories
    name: Complete and Cocomplete Categories
    core: false                # terminal classification of categories by limit existence
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: limits-colimits
        weight: 0.5
        key: true
      - id: equalizers-coequalizers
        weight: 0.4
        key: true
      - id: initial-terminal-as-limits
        weight: 0.3
      - id: products-coproducts
        weight: 0.3
      - id: pullbacks-pushouts
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Definitions
        key_prerequisites: [limits-colimits]
        constraints: "Definitions plus the poset case: completeness of a poset category is equated with being a complete lattice via limits-as-infima."
        exemplars:
          - problem: "Define a complete category and a cocomplete category."
            answer: "Complete: has all small limits; cocomplete: has all small colimits."
            solution_sketch: "A category $\\mathcal C$ is complete if every diagram $D\\colon\\mathcal J\\to\\mathcal C$ with $\\mathcal J$ small has a limit in $\\mathcal C$, and cocomplete if every small diagram has a colimit. For example $\\mathbf{Set}$, $\\mathbf{Grp}$, and $\\mathbf{Top}$ are both complete and cocomplete."
          - problem: "Show that a poset $P$, viewed as a category, is complete iff it is a complete lattice."
            answer: "Limits in $P$ are infima; all small limits exist iff every subset has an infimum, i.e. $P$ is a complete lattice."
            solution_sketch: "In a poset category a diagram $D\\colon\\mathcal J\\to P$ is just a subset $S=\\{Dj\\}$ (arrows carry no extra data), and a limit of $D$ is its greatest lower bound $\\bigwedge S$. Hence $P$ is complete iff every small subset has an infimum, which is exactly the definition of a complete lattice. Such $P$ also has all suprema via $\\bigvee S=\\bigwedge\\{u : u\\ge S\\}$, so it is automatically cocomplete: for posets, complete $\\iff$ complete lattice $\\iff$ cocomplete."
      - id: kp2
        name: Completeness from products and equalizers
        key_prerequisites: [equalizers-coequalizers]
        constraints: "The two-products-and-an-equalizer construction, with the two parallel maps written out componentwise; applications limited to $\\mathbf{Grp}$ or $\\mathbf{Set}$."
        exemplars:
          - problem: "Prove that a category with all small products and all equalizers is complete."
            answer: "Realize each limit as an equalizer of two maps between products."
            solution_sketch: "For $D\\colon\\mathcal J\\to\\mathcal C$ ($\\mathcal J$ small), form $\\prod_{j}Dj$ and $\\prod_{(f\\colon j\\to j')}Dj'$. Two maps $\\prod_j Dj\\rightrightarrows\\prod_f Dj'$ are given by $u=(\\,\\pi_{j'})_f$ and $v=(\\,Df\\circ\\pi_j)_f$. Their equalizer $L$ consists exactly of the tuples $(x_j)$ with $Df(x_j)=x_{j'}$ for all $f$, i.e. the cones over $D$; so $L$ with projections is the limit. Hence small products + equalizers $\\Rightarrow$ complete (dually, coproducts + coequalizers $\\Rightarrow$ cocomplete)."
          - problem: "Use the products-and-equalizers criterion to prove $\\mathbf{Grp}$ is complete."
            answer: "$\\mathbf{Grp}$ has all small products (direct products) and all equalizers (equalizer subgroups), hence all small limits."
            solution_sketch: "The direct product $\\prod_i G_i$ with componentwise operations is the product in $\\mathbf{Grp}$, so all small products exist. The equalizer of $f,g\\colon G\\to H$ is the subgroup $\\{x\\in G: f(x)=g(x)\\}$ with inclusion, so all equalizers exist. By the theorem 'small products $+$ equalizers $\\Rightarrow$ complete', every small diagram of groups has a limit — concretely the subgroup of $\\prod_j G_j$ of compatible families. Hence $\\mathbf{Grp}$ is complete."
      - id: kp3
        name: Finite completeness from a terminal object and pullbacks
        key_prerequisites: [pullbacks-pushouts]
        constraints: "Reduce each finite (co)limit to the given primitives, exhibiting binary (co)products and (co)equalizers as specific pullbacks/pushouts; the dual statement is obtained by working in $\\mathcal C^{op}$."
        exemplars:
          - problem: "Show a category with a terminal object and all pullbacks has all finite limits."
            answer: "Terminal = empty limit; binary products and equalizers are pullbacks."
            solution_sketch: "The terminal object is the empty limit. Binary products are pullbacks over the terminal object: $A\\times B=A\\times_1 B$. Equalizers of $f,g\\colon A\\to B$ are obtained as the pullback of $(1_A,f),(1_A,g)\\colon A\\to A\\times B$ (equivalently, of the diagonal $B\\to B\\times B$ along $(f,g)$). With finite products and equalizers present, the product-and-equalizer construction yields all finite limits. So terminal + pullbacks $\\Rightarrow$ finitely complete."
          - problem: "Show, dually, that a category with an initial object and all pushouts has all finite colimits."
            answer: "Initial = empty colimit; binary coproducts and coequalizers are pushouts."
            solution_sketch: "Dualize the terminal-plus-pullbacks argument (work in $\\mathcal C^{op}$). The initial object is the empty colimit. Binary coproducts are pushouts over the initial object: $A+B=A+_0 B$. The coequalizer of $f,g\\colon A\\to B$ is the pushout of the codiagonal $\\nabla_A=[1_A,1_A]\\colon A+A\\to A$ along $[f,g]\\colon A+A\\to B$, dual to realizing an equalizer as a pullback of the diagonal. With finite coproducts and coequalizers present, the coproduct-and-coequalizer construction yields all finite colimits. Hence initial object $+$ pushouts $\\Rightarrow$ finitely cocomplete."
    diagnostic_exemplar:
      problem: "Prove the dual of the products-and-equalizers criterion: a category $\\mathcal C$ with all small coproducts and all coequalizers is cocomplete. Construct the colimit of an arbitrary small diagram $D\\colon\\mathcal J\\to\\mathcal C$ as a coequalizer of two maps between coproducts, and verify its universal property."
      answer: "Form $\\coprod_j Dj$ (over the objects of $\\mathcal J$) and $\\coprod_{f\\colon j\\to j'}Dj$ (over the morphisms), and let $u,v\\colon\\coprod_f Dj\\rightrightarrows\\coprod_j Dj$ be the maps whose components on the summand indexed by $f\\colon j\\to j'$ are $\\iota_j$ and $\\iota_{j'}\\circ Df$ respectively. Let $q\\colon\\coprod_j Dj\\to Q$ be their coequalizer and set $\\gamma_j=q\\circ\\iota_j$. Then $q u=q v$ says precisely $\\gamma_j=\\gamma_{j'}\\circ Df$ for every $f\\colon j\\to j'$, so $(Q,\\gamma)$ is a cocone under $D$. Given any cocone $(X,\\delta)$, the coproduct's universal property gives $[\\delta_j]\\colon\\coprod_j Dj\\to X$, and the cocone condition $\\delta_j=\\delta_{j'}\\circ Df$ says exactly $[\\delta_j]u=[\\delta_j]v$; the coequalizer's universal property therefore factors $[\\delta_j]$ through $q$ by a unique $w\\colon Q\\to X$, and $w\\gamma_j=w q\\iota_j=[\\delta_j]\\iota_j=\\delta_j$. Any other cocone map $w'$ satisfies $w'q\\iota_j=\\delta_j$ for all $j$, hence $w'q=[\\delta_j]$, hence $w'=w$ by uniqueness of the factorisation. So $(Q,\\gamma)$ is $\\mathrm{colim}\\,D$, and every small colimit exists: $\\mathcal C$ is cocomplete."
      solution_sketch: "Build the colimit as a coequalizer of two maps $\\coprod_{f}Dj\\rightrightarrows\\coprod_j Dj$ — one component $\\iota_j$, the other $\\iota_{j'}\\circ Df$ — chosen so that the equation $qu=qv$ says exactly that the legs form a cocone. Any cocone $(X,\\delta)$ then yields $[\\delta_j]$ by the coproduct property and factors uniquely through $q$ by the coequalizer property."
    anki_seeds:
      - front: "A category is complete when..."
