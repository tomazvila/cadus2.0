    knowledge_points:
      - id: kp1
        name: The explicit construction of limits in Set
        key_prerequisites: [limits-as-cones]
        constraints: "Evaluate the compatible-families formula on diagrams of finite sets with at most 4 elements per set: the graded answers are the computed limit object or the verdict compatible/incompatible for a given family."
        exemplars:
          - problem: 'In $\mathbf{Set}$, let $D$ be the cospan $A\to C\leftarrow B$ with $A=\{0,1,2\}$, $B=\{0,1\}$ and $C=\{4\}$, where both maps are the only possible ones. How many elements does the limit of $D$ have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A compatible family is a choice of $a\in A$, $c\in C$ and $b\in B$ whose images in $C$ agree. Since $C$ has a single element, every pair $(a,b)$ is compatible and the coordinate $c$ is forced. So the limit is the full product of $A$ and $B$, which has $3\cdot 2=6$ elements.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the parallel pair $f,g\colon A\to B$ with $A=\{0,1,2,3\}$ and $B=\{0,1\}$, where $f$ sends $0$ and $1$ to $0$ and sends $2$ and $3$ to $1$, while $g$ sends $0$ to $0$, $1$ to $1$, $2$ to $1$ and $3$ to $0$. Use the compatible-families formula to find the limit of $D$, taking its apex to be a subset of $A$.'
            answer: '0, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a parallel pair, a compatible family is an element $a\in A$ with $f(a)=g(a)$. Check each element: $f(0)=0=g(0)$; $f(1)=0$ but $g(1)=1$; $f(2)=1=g(2)$; $f(3)=1$ but $g(3)=0$. The compatible elements are $0$ and $2$, so the limit is $\{0,2\}$.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the cospan $A\xrightarrow{f}C\xleftarrow{g}B$ with $A=\{0,1,2,3\}$, $C=\{0,1\}$ and $B=\{0,1,2\}$. The map $f$ sends $0$, $1$ and $2$ to $0$ and sends $3$ to $1$. The map $g$ sends $0$ to $0$ and sends $1$ and $2$ to $1$. How many elements does the limit of $D$ have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit is the set of compatible pairs $(a,b)$ with $f(a)=g(b)$. Fix $b$ and count. For $b=0$ we have $g(b)=0$, and $3$ elements of $A$ map to $0$. For $b=1$ and $b=2$ we have $g(b)=1$, and only $a=3$ maps to $1$. The total is $3+1+1=5$.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the cospan $A\xrightarrow{f}C\xleftarrow{g}B$ with $A=\{1,2,3\}$, $B=\{7,8\}$ and $C=\{0,1\}$, where $f(1)=0$, $f(2)=1$, $f(3)=1$, and $g(7)=0$, $g(8)=1$. Is the triple $(a,b,c)=(3,7,1)$ a compatible family of $D$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is a compatible family", "compatible"], ["no", "it is not", "it is not a compatible family", "not compatible", "incompatible", "it isn't compatible", "it is not compatible"]]}
            solution_sketch: 'A triple $(a,b,c)$ is compatible when $f(a)=c$ and $g(b)=c$. Here $f(3)=1=c$, so the first condition holds. But $g(7)=0$ and $c=1$, so the second condition fails. The triple is not compatible.'
          - problem: 'A delivery company has four customers, numbered $1$ to $4$, and five drivers, numbered $5$ to $9$. Customers $1$, $2$ and $3$ live in district $a$ and customer $4$ lives in district $b$. Drivers $5$ and $6$ serve district $a$, driver $7$ serves district $b$, and drivers $8$ and $9$ serve district $c$. Let $f$ send each customer to a district and $g$ send each driver to a district. How many elements does the limit of the cospan $\mathrm{Customers}\xrightarrow{f}\mathrm{Districts}\xleftarrow{g}\mathrm{Drivers}$ in $\mathbf{Set}$ have?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit is the set of compatible pairs (customer, driver) in the same district. District $a$ gives $3\cdot 2=6$ pairs, district $b$ gives $1\cdot 1=1$ pair and district $c$ gives $0\cdot 2=0$ pairs. The limit has $6+1+0=7$ elements.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the cospan $A\to C\leftarrow B$ with $A=\{0,1\}$, $B=\{2,3\}$ and $C=\{5\}$. Take the elements of $\lim D$ to be the compatible pairs $(a,b)$. The cone $(X,\mu)$ has $X=\{7,8\}$, with $\mu_A(7)=1$, $\mu_A(8)=0$, $\mu_B(7)=3$ and $\mu_B(8)=2$. The unique map $u\colon X\to\lim D$ satisfies $\lambda_A\circ u=\mu_A$ and $\lambda_B\circ u=\mu_B$, where $\lambda_A$ and $\lambda_B$ are the projections. What is $u(8)$?'
            answer: '(0, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Every pair $(a,b)$ is compatible, because $C$ has a single element. The map $u$ sends each point to the pair of its leg values. So $u(8)$ has $A$-coordinate $\mu_A(8)=0$ and $B$-coordinate $\mu_B(8)=2$, and $u(8)=(0,2)$.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the cospan $A\xrightarrow{f}C\xleftarrow{g}B$ with $A=\{0,1,2,3\}$, $B=\{4,5,6\}$ and $C=\{0,1\}$, where $f(0)=0$, $f(1)=1$, $f(2)=0$, $f(3)=1$, and $g(4)=0$, $g(5)=1$, $g(6)=1$. Is the triple $(a,b,c)=(3,5,1)$ a compatible family of $D$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is a compatible family", "compatible"], ["no", "it is not", "it is not a compatible family", "not compatible", "incompatible", "it isn't compatible", "it is not compatible"]]}
            solution_sketch: 'A triple $(a,b,c)$ is compatible when $f(a)=c$ and $g(b)=c$. Here $f(3)=1=c$, and $g(5)=1=c$ as well. Both conditions hold, so the triple is compatible.'
          - problem: 'Two thermometers rate each of six days, numbered $1$ to $6$, as cold or warm. The first rates days $1$, $4$ and $5$ as cold and days $2$, $3$ and $6$ as warm. The second rates days $1$, $2$ and $5$ as cold and days $3$, $4$ and $6$ as warm. Let $f$ and $g$ be the two rating maps from the days to $\{\text{cold},\text{warm}\}$. Taking the limit of the parallel pair $f,g$ in $\mathbf{Set}$ to be a subset of the days, which days does it contain?'
            answer: '1, 3, 5, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of a parallel pair is the set of days on which the two maps agree. Days $1$ and $5$ are cold for both thermometers, and days $3$ and $6$ are warm for both. Day $2$ is warm for the first thermometer and cold for the second, and day $4$ is cold for the first and warm for the second. So the limit is $\{1,3,5,6\}$.'
          - problem: 'Sam says that the limit of the cospan $A\xrightarrow{f}C\xleftarrow{g}B$ in $\mathbf{Set}$ with $A=\{0,1,2\}$, $B=\{0,1,2,3\}$ and $C=\{0,1\}$ is $A\times B$, so it has $12$ elements. The map $f$ sends every element of $A$ to $0$, and the map $g$ sends $0$, $1$ and $2$ to $0$ and sends $3$ to $1$. What is the number of elements of the limit?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam forgot the compatibility condition $f(a)=g(b)$. Since $f(a)=0$ for every $a$, a pair $(a,b)$ is compatible exactly when $g(b)=0$, which holds for $b=0$, $b=1$ and $b=2$. That gives $3\cdot 3=9$ pairs, and the pairs with $b=3$ are excluded.'
          - problem: 'Write the full proof that, in $\mathbf{Set}$, the set of compatible families of a small diagram $D$, with the projection legs, is the limit of $D$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (the cone): let $L$ be the set of all families $(x_j)$ with $x_j\in D(j)$ for every object $j$ and $D(f)(x_j)=x_{j''}$ for every arrow $f\colon j\to j''$, and let $\lambda_j$ send $(x_j)$ to $x_j$; the compatibility condition is exactly the cone condition, so $(L,\lambda)$ is a cone over $D$. Step 2 (the mediating map): given any cone $(X,\mu)$, define $u\colon X\to L$ by $u(x)=(\mu_j(x))_j$; the cone condition for $(X,\mu)$ says $D(f)(\mu_j(x))=\mu_{j''}(x)$, so $u(x)$ is compatible and lies in $L$, and $\lambda_j\circ u=\mu_j$ for every $j$. Step 3 (uniqueness): if $v\colon X\to L$ also satisfies $\lambda_j\circ v=\mu_j$ for every $j$, then the $j$-th coordinate of $v(x)$ equals $\mu_j(x)$ for every $j$, so $v(x)=u(x)$ for all $x$, hence $v=u$. Conclusion: every cone admits exactly one mediating map, so $(L,\lambda)$ is the universal cone and $L$ is the limit of $D$ in $\mathbf{Set}$.'
      - id: kp2
        name: Uniqueness of limits
        key_prerequisites: [universal-properties]
        constraints: "Require the learner to use uniqueness of limits. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar. Closed items may diagnose general proofs; require the named universal-property argument, not numerical outputs after its decisive construction is supplied."
        exemplars:
          - problem: 'In $\mathbf{Set}$, both $P=A\times B$ with $A=\{1,2\}$, $B=\{3,4,5\}$ and the projections $p$, $q$, and $Q=\{1,2,3,4,5,6\}$ with the legs $\rho_A=(1,2,1,2,1,2)$ and $\rho_B=(3,3,4,4,5,5)$, listed as the values at $1,\dots,6$, are limits of the discrete diagram on $A$ and $B$. There is exactly one isomorphism of cones $h\colon P\to Q$, that is, a bijection with $\rho_A\circ h=p$ and $\rho_B\circ h=q$. What is $h(2,4)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The conditions $\rho_A(h(2,4))=2$ and $\rho_B(h(2,4))=4$ must hold. The element $r\in Q$ with $\rho_A(r)=2$ and $\rho_B(r)=4$ is $r=4$, since $\rho_A(4)=2$ and $\rho_B(4)=4$. Because the legs of $Q$ determine each element, no other choice works, so $h(2,4)=4$.'
          - problem: 'In $\mathbf{Set}$, let $A=B=\{0,1\}$. The cone $P$ has apex $\{0,1\}\times\{0,1\}$ with legs $p(a,b)=a$ and $q(a,b)=b$. The cone $Q$ has the same apex $\{0,1\}\times\{0,1\}$ with legs $\rho_A(x,y)=y$ and $\rho_B(x,y)=x$. Both are limits of the discrete diagram on $A$ and $B$. Sam says the identity map $P\to Q$ is an isomorphism of cones, because it is a bijection. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "Sam is wrong", "he is wrong", "not right", "it is not"], ["yes", "Sam is right", "he is right", "right", "it is"]]}
            solution_sketch: 'A morphism of cones must satisfy $\rho_A\circ h=p$. For the identity and the element $(0,1)$ we get $\rho_A(0,1)=1$, but $p(0,1)=0$. So the identity does not commute with the legs, and Sam is wrong; the isomorphism of cones is the swap $(a,b)\mapsto(b,a)$.'
          - problem: 'In $\mathbf{Set}$, let $L=A\times B$ with $A=\{1,2,3\}$, $B=\{4,5\}$ and the projections $p\colon L\to A$ and $q\colon L\to B$. Let $X=\{0,1\}$. How many ordered pairs $(u,v)$ of functions $X\to L$ satisfy $p\circ u=p\circ v$ and $q\circ u=q\circ v$?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The legs of a limit cone are jointly monic, so $p\circ u=p\circ v$ and $q\circ u=q\circ v$ force $u=v$. Conversely every pair with $u=v$ satisfies both equations. So we count the functions $u\colon X\to L$. Since $L$ has $6$ elements, there are $6^2=36$ functions, and $36$ pairs.'
          - problem: 'A shop''s first database lists every outfit as a pair (shirt, trousers), with shirts red or blue and trousers black, grey or green. Its second database lists the six outfits as rows $1$ to $6$, with shirts red, blue, red, blue, red, blue and trousers black, black, grey, grey, green, green, in the order of the rows. Both are limits of the discrete diagram of the shirts and the trousers in $\mathbf{Set}$. The unique isomorphism of cones sends each pair to the row with the same shirt and trousers. Which row does it send (blue, green) to?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The isomorphism of cones must keep both legs, so it sends a pair to the row with the same shirt and the same trousers. The blue shirts are in rows $2$, $4$ and $6$, and the green trousers are in rows $5$ and $6$. Only row $6$ has both, so (blue, green) goes to row $6$.'
          - problem: 'A jacket comes in $3$ sizes and in some number of colors. Two spreadsheets each list the size-and-color combinations, and each is a limit cone of the discrete diagram of the sizes and the colors in $\mathbf{Set}$. The second spreadsheet has $15$ rows. How many colors does the jacket come in?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two limit cones of one diagram are joined by an isomorphism of cones, so their apexes have the same number of elements. The apex of a limit of the discrete diagram on the sizes and the colors is their product, with $3\cdot c$ elements for $c$ colors. So $3\cdot c=15$, and dividing gives $c=15/3=5$ colors.'
          - problem: 'In $\mathbf{Set}$, let $A=\{0,1\}$ and $B=\{0,1,2\}$. The cone $P$ has apex $A\times B$ with legs $p(a,b)=a$ and $q(a,b)=b$. The cone $Q$ has apex $B\times A$ with legs $\rho_A(b,a)=a$ and $\rho_B(b,a)=b$. How many isomorphisms of cones $P\to Q$ are there?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An isomorphism of cones is a bijection $h$ with $\rho_A\circ h=p$ and $\rho_B\circ h=q$. These equations force $h(a,b)=(b,a)$ at every pair. So there is exactly $1$ isomorphism of cones, although there are $720$ bijections $A\times B\to B\times A$.'
          - problem: 'Write the full proof that any two limit cones over the same diagram $D$ are joined by a unique isomorphism of cones.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1: let $(L,\lambda)$ and $(M,\mu)$ be limit cones over $D$; each is, in particular, a cone over $D$. Step 2 (mediating maps, justified by the universal property): since $(L,\lambda)$ is a limit, the cone $(M,\mu)$ has a unique cone map $u\colon M\to L$ with $\lambda_j\circ u=\mu_j$ for every $j$; since $(M,\mu)$ is a limit, the cone $(L,\lambda)$ has a unique cone map $v\colon L\to M$ with $\mu_j\circ v=\lambda_j$. Step 3: the composite $v\circ u$ is a cone map from $(M,\mu)$ to itself with legs $\mu_j\circ v\circ u=\mu_j$, and $1_M$ is another such cone map; the mediating map to a limit is unique among cone maps, so $v\circ u=1_M$. Step 4: the same argument with the roles swapped gives $u\circ v=1_L$, so $u$ and $v$ are inverse cone maps, that is, an isomorphism of cones. Step 5 (uniqueness of the isomorphism): if $w\colon M\to L$ is any cone isomorphism, its legs force $w$ to be the mediating map for the cone $(M,\mu)$, so $w=u$. Therefore the two limits are joined by exactly one isomorphism of cones.'
      - id: kp3
        name: Colimits by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Require the learner to use colimits by duality. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: 'In $\mathbf{Set}$, let $D$ be the span $B\xleftarrow{f}A\xrightarrow{g}C$ with $A=\{1,2\}$, $B=\{p,q,r\}$, $C=\{x,y,z\}$, $f(1)=p$, $f(2)=q$, $g(1)=x$ and $g(2)=x$. How many elements does the colimit of $D$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The colimit is the disjoint union $B\sqcup C$, which has $6$ elements, modulo the relations $f(a)\sim g(a)$. The element $1$ gives $p\sim x$ and the element $2$ gives $q\sim x$. So $p$, $q$ and $x$ form one class, while $r$, $y$ and $z$ stay alone. That makes $1+3=4$ classes.'
          - problem: 'How many elements does the colimit of the discrete diagram of three sets with $2$, $3$ and $4$ elements have in $\mathbf{Set}$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The colimit of a discrete diagram is the disjoint union, because there are no arrows and so no relations to impose. The union of the three sets has $2+3+4=9$ elements.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the parallel pair $f,g\colon A\to B$ with $A=\{1,2\}$, $B=\{1,2,3,4,5\}$, $f(1)=1$, $f(2)=3$, $g(1)=2$ and $g(2)=4$. How many elements does the colimit of $D$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The colimit is the quotient of $B$ by the relations $f(a)\sim g(a)$. The element $1$ of $A$ gives $1\sim 2$ and the element $2$ gives $3\sim 4$. So the classes are $\{1,2\}$, $\{3,4\}$ and $\{5\}$, and the colimit has $3$ elements.'
          - problem: 'Two bus lines leave a stop every $12$ minutes and every $18$ minutes. Take the whole numbers from $1$ to $100$ as a category with one morphism $m\to n$ exactly when $m$ divides $n$. The colimit of the discrete diagram on $12$ and $18$ is the initial cocone. Find its nadir. The two buses leave together for the first time at that minute.'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cocone under the diagram has a nadir that both $12$ and $18$ divide, so the nadirs are the multiples of $36$ up to $100$, namely $36$ and $72$. The initial cocone has a morphism to every other cocone, and $36$ divides $72$. So the nadir of the colimit is $36$, the least common multiple of $12$ and $18$.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the span $B\xleftarrow{f}A\xrightarrow{g}C$ with $A=\{1,2\}$, $B=\{p,q,r\}$, $C=\{s,t\}$, $f(1)=p$, $f(2)=q$, $g(1)=s$ and $g(2)=s$. In the colimit of $D$, are $p$ and $q$ the same element?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they are", "they are the same", "same", "the same element", "they are the same element"], ["no", "they are not", "they are different", "different", "they are not the same"]]}
            solution_sketch: 'The colimit identifies $f(a)$ with $g(a)$ for each $a\in A$. The element $1$ gives $p\sim s$ and the element $2$ gives $q\sim s$. By symmetry and transitivity $p\sim s\sim q$, so $p$ and $q$ lie in the same class.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the span $B\xleftarrow{f}A\xrightarrow{g}C$ with $A=\{1,2\}$, $B=\{p,q\}$, $C=\{s,t\}$, $f(1)=p$, $f(2)=q$, $g(1)=s$ and $g(2)=t$. A cocone under $D$ with apex $Z$ has legs $h_B\colon B\to Z$ and $h_C\colon C\to Z$ with $h_B\circ f=h_C\circ g$. Suppose $h_B(p)=7$ and $h_C(t)=8$. What is $h_B(q)$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cocone condition at the element $2$ of $A$ says $h_B(f(2))=h_C(g(2))$, that is $h_B(q)=h_C(t)$. Since $h_C(t)=8$, we get $h_B(q)=8$. The value $h_B(p)=7$ is not needed here; it is fixed by $h_C(s)$ through the element $1$.'
          - problem: 'Sam says that the colimit of a span $B\leftarrow A\to C$ in $\mathbf{Set}$ is the disjoint union $B\sqcup C$. Here $|B|=5$, $|C|=4$ and $|A|=3$, and both maps out of $A$ are injective with no element of $B$ or $C$ hit twice. How many elements does the colimit really have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam forgot the relations $f(a)\sim g(a)$. The disjoint union has $5+4=9$ elements. Each of the $3$ elements of $A$ glues one element of $B$ to one element of $C$, and the maps are injective, so each gluing removes one element. The colimit has $9-3=6$ elements.'
          - problem: 'Address book $B$ lists the contacts Ann, Bo, Cy and Di, and address book $C$ lists Bo, Di, Eli, Fay and Gus. Let $A$ be the set of contacts that appear in both books, with its two inclusions into $B$ and $C$. How many elements does the colimit of the span $B\leftarrow A\to C$ in $\mathbf{Set}$ have?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $A$ consists of the contacts in both books, which are Bo and Di, so $|A|=2$. The colimit is the disjoint union $B\sqcup C$ with each element of $A$ in $B$ glued to the same contact in $C$. The disjoint union has $4+5=9$ elements, and the $2$ gluings remove $2$ of them, which leaves $9-2=7$ elements.'
          - problem: 'A colimit in a category $\mathcal C$ is a limit in $\mathcal C^{op}$. How many elements does a terminal object of $\mathbf{Set}^{op}$ have?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A terminal object of $\mathbf{Set}^{op}$ is an initial object of $\mathbf{Set}$, which is the colimit of the empty diagram. In $\mathbf{Set}$ that is the empty set, which sends exactly one function to every set. So the terminal object of $\mathbf{Set}^{op}$ has $0$ elements.'
          - problem: 'Write the full proof that, in $\mathbf{Set}$, the quotient of the disjoint union of the values of a small diagram $D$ by the equivalence relation generated by $x\sim Df(x)$, with legs sending each element to its equivalence class, is a colimit of $D$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Setup: form the disjoint union of the sets $Dj$ and quotient it by the smallest equivalence relation $\sim$ satisfying $x\sim Df(x)$ for every element $x$ in $Dj$ and every arrow $f\colon j\to j''$; call the quotient set $U$. Legs: define each leg from $Dj$ to $U$ by sending $x$ to its class; the generating relations give exactly the cocone condition. Universal property: take any cocone with apex $X$ and legs $\gamma_j$, and define a map $u\colon U\to X$ by sending the class of $x$ to the value of the leg at $x$. Cocone condition: equivalent elements are forced to have equal leg values by chains of generating pairs, so $u$ is independent of the representative. Uniqueness: the condition that $u$ composed with each leg equals that leg determines $u$ on every class, so at most one such $u$ exists. Conclusion: $U$ with the class legs is an initial cocone, hence a colimit, and this is exactly the dual of the limit story with all arrows reversed.'
    diagnostic_exemplar:
      problem: "Prove that the legs $(\\lambda_j)$ of a limit cone $(L,\\lambda)$ over $D$ are jointly monic: if $u,v\\colon X\\to L$ satisfy $\\lambda_j u=\\lambda_j v$ for every $j$, then $u=v$."
      answer: "Set $\\mu_j=\\lambda_ju=\\lambda_jv$. The family $(\\mu_j)$ is a cone with apex $X$: for $f\\colon j\\to j'$, $Df\\circ\\mu_j=Df\\circ\\lambda_j\\circ u=\\lambda_{j'}\\circ u=\\mu_{j'}$, inheriting the cone condition from $\\lambda$. The limit's universal property supplies a UNIQUE morphism $X\\to L$ whose legs are $(\\mu_j)$; both $u$ and $v$ are such morphisms, so $u=v$."
      solution_sketch: "Show the common family $(\\lambda_j u)$ is itself a cone over $D$, inheriting the condition from $\\lambda$; then $u$ and $v$ are two mediating maps for one cone, and the uniqueness half of the limit property finishes it."
    anki_seeds:
      - front: "Formula for $\\lim D$ in $\\mathbf{Set}$?"
        back: "the set of compatible families $(x_j)$ with $Df(x_j)=x_{j'}$ for every $f\\colon j\\to j'$."
        type: basic
      - front: "Formula for $\\mathrm{colim}\\,D$ in $\\mathbf{Set}$?"
        back: "$\\big(\\coprod_j Dj\\big)/\\!\\sim$, where $x\\sim Df(x)$ for $x\\in Dj$, $f\\colon j\\to j'$."
        type: basic
      - front: "A colimit in $\\mathcal C$ is a limit in..."
        back: "$\\mathcal C^{op}$ (colimits are dual to limits)."
        type: basic

  - id: exponential-objects
    name: Exponential Objects
    core: true  # ancestor of core adjunction-examples/monad-examples (PEDAGOGY §1 invariant)
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: products-coproducts
        weight: 0.4
        key: true
      - id: universal-properties
        weight: 0.4
        key: true
      - id: hom-functors
        weight: 0.3
      - id: commutative-diagrams
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Exponentials via currying in Set
        key_prerequisites: [universal-properties]
        try_first:
          problem: 'Let $A$ have $2$ elements and $B$ have $3$ elements. How many functions $A \to B$ are there?'
          answer_contract: {"kind": "exact"}
          answer: '9'
          reveal: 'Each of the $2$ inputs goes to any of the $3$ outputs independently, so there are $3 \cdot 3 = 9$ functions. The set of all these functions is the exponential $B^A$ in $\mathbf{Set}$.'
        exemplars:
          - problem: 'Let $X=\{u,v\}$, $A=\{0,1\}$, $B=\{p,q\}$, and let $g\colon X\times A\to B$ be given by $g(u,0)=p$, $g(u,1)=q$, $g(v,0)=q$, $g(v,1)=q$. In $\mathbf{Set}$ the curry $\hat g\colon X\to B^A$ sends each $x$ to a function $A\to B$. What is $\hat g(v)(0)$?'
            answer: 'q'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the definition of the curry, $\hat g(x)$ is the function $a\mapsto g(x,a)$. So $\hat g(v)(0)=g(v,0)=q$.'
          - problem: 'Work in $\mathbf{Set}$. Let $X=\{1,2,3\}$, $A=\{u,v\}$, $B=\{0,1\}$, and let $g\colon X\times A\to B$ be given by $g(1,u)=0$, $g(1,v)=1$, $g(2,u)=1$, $g(2,v)=0$, $g(3,u)=0$, $g(3,v)=1$. Let $\hat g\colon X\to B^A$ be the curry of $g$. How many different functions $A\to B$ does $\hat g$ take as values?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curry sends $x$ to the function $a\mapsto g(x,a)$. So $\hat g(1)$ sends $u$ to $0$ and $v$ to $1$, $\hat g(2)$ sends $u$ to $1$ and $v$ to $0$, and $\hat g(3)$ sends $u$ to $0$ and $v$ to $1$. The functions $\hat g(1)$ and $\hat g(3)$ are the same, so $\hat g$ takes exactly $2$ different values.'
          - problem: 'A control panel has $3$ switches, and each switch is set to one of $5$ positions. A setting of the panel is a function from the set $A$ of switches to the set $B$ of positions, so the settings are the elements of $B^A$ in $\mathbf{Set}$. How many settings are there?'
            answer: '125'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $\mathbf{Set}$ the exponential $B^A$ is the set of all functions $A\to B$. Each of the $3$ switches independently takes one of $5$ positions, so there are $5\cdot5\cdot5=5^3=125$ settings. The count $3^5=243$ would swap the roles of $A$ and $B$.'
          - problem: 'A combination lock has $2$ dials, and each dial can be set to any of $n$ positions. A setting is a function from the set of dials to the set of positions, and the lock has $49$ possible settings in all. What is $n$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The settings are the elements of $B^A$ with $|A|=2$ and $|B|=n$, so there are $n^2$ of them. From $n^2=49$ we get $n=7$, since the number of positions is positive.'
          - problem: 'Let $X=\{1,2\}$, $A=\{0,1\}$, $B=\{0,1,2\}$. A map $h\colon X\to B^A$ is given by $h(1)=(0\mapsto 2,\ 1\mapsto 0)$ and $h(2)=(0\mapsto 1,\ 1\mapsto 1)$. Let $g=\mathrm{ev}\circ(h\times 1_A)\colon X\times A\to B$ be the uncurrying of $h$. Find $g(1,1)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The uncurrying is $g(x,a)=\mathrm{ev}(h(x),a)=h(x)(a)$. Hence $g(1,1)=h(1)(1)$, and $h(1)$ sends $1$ to $0$. So $g(1,1)=0$.'
          - problem: 'Sam says that for $g(u,0)=p$ and $g(u,1)=q$ there are two different functions $f\colon\{0,1\}\to\{p,q\}$ with $\mathrm{ev}(f,0)=p$ and $\mathrm{ev}(f,1)=q$, so the curry of $g$ at $u$ is not unique. How many such functions $f$ are there?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A function $f$ with $\mathrm{ev}(f,0)=f(0)=p$ and $f(1)=q$ has both of its values fixed. So there is exactly $1$ such function, and the curry of $g$ at $u$ is unique.'
          - problem: 'A cafe charges $g(x,a)=4x+3a$ euros for $x$ coffees and $a$ cakes. The curry $\hat g$ sends $x$ to the price function of the number of cakes, when $x$ coffees are bought. Find $\hat g(2)(5)$.'
            answer: '23'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The curry is $\hat g(x)=(a\mapsto 4x+3a)$. So $\hat g(2)$ is the price function $a\mapsto 8+3a$, and $\hat g(2)(5)=8+15=23$ euros.'
          - problem: 'Let $X=\{1,2\}$, $A=\{0,1\}$, $B=\{0,1,2\}$. Currying matches the maps $X\times A\to B$ one-to-one with the maps $X\to B^A$. How many maps $X\to B^A$ are there?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $B^A$ has $3^2=9$ elements, and a map from the $2$-element set $X$ to it chooses one of $9$ values for each of $2$ points, so there are $9^2=81$ maps. This agrees with the $3^4=81$ maps $X\times A\to B$, as the bijection says.'
          - problem: 'Write the full proof that in $\mathbf{Set}$ the set $B^A$ of all functions $A \to B$, with evaluation $\mathrm{ev}(f, a) = f(a)$, satisfies the universal property of the exponential: every $g\colon X \times A \to B$ has a unique $\hat g\colon X \to B^A$ with $\mathrm{ev} \circ (\hat g \times 1_A) = g$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Define $\hat g(x)$ to be the function $a\mapsto g(x,a)$; this is a well-defined function $A\to B$ for each $x$. Then $\mathrm{ev}(\hat g(x),a)=g(x,a)$ for every pair $(x,a)$, so $\mathrm{ev}\circ(\hat g\times 1_A)=g$. For uniqueness, let $h$ be any map with $\mathrm{ev}\circ(h\times 1_A)=g$; then $h(x)(a)=g(x,a)=\hat g(x)(a)$ for all $a$, so $h(x)=\hat g(x)$ for every $x$ and $h=\hat g$. Hence $B^A$ with $\mathrm{ev}$ is the exponential of $B$ by $A$ in $\mathbf{Set}$.'
        constraints: 'Currying in Set with explicit finite data: the curry of a given map read at a pair, the number of distinct functions it picks out, the size of $B^A$ from the sizes of $A$ and $B$ (in both directions), the uncurrying of a given map, the count of maps into $B^A$ against the count of maps out of $X\times A$, a priced-menu context, and an error-analysis item on uniqueness. The one full-proof item states the universal property and asks for the proof.'
      - id: kp2
        name: The curry/uncurry bijection is natural
        key_prerequisites: [hom-functors]
        exemplars:
          - problem: 'Let $A=B=X=\mathbb Z$ and let $g\colon X\times A\to B$ be $g(x,a)=x^2+a$. Let $k\colon\mathbb Z\to\mathbb Z$ be $k(n)=n+2$. Find $\widehat{g\circ(k\times 1_A)}(1)(3)$, the value at $3$ of the function that the curry of $g\circ(k\times 1_A)$ assigns to $1$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By naturality in $X$, the curry of $g\circ(k\times 1_A)$ is $\hat g\circ k$. So the value is $\hat g(k(1))(3)=\hat g(3)(3)=g(3,3)=9+3=12$. A direct computation gives the same: $(g\circ(k\times 1_A))(1,3)=g(3,3)=12$.'
          - problem: 'Let $X=A=B=B''=\mathbb Z$, let $g\colon X\times A\to B$ be $g(x,a)=x+a$ and let $m\colon B\to B''$ be $m(b)=2b$. The map $m^A\colon B^A\to B''^A$ sends a function $f$ to $m\circ f$. Find $\big(m^A(\hat g(3))\big)(4)$.'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function $\hat g(3)$ is $a\mapsto 3+a$, so $m^A(\hat g(3))$ is $a\mapsto 2(3+a)$. At $a=4$ this is $2\cdot 7=14$, which is also $m(g(3,4))$, as naturality in the target says.'
          - problem: 'A cafe charges $g(x,a)=50x+25a$ cents for $x$ muffins and $a$ rolls. The curry $\hat g$ sends $x$ to the price function of the number of rolls. Converting cents to euros is the map $m(b)=b/100$, and $m^A$ turns a price function in cents into one in euros by $m^A(f)=m\circ f$. Find $m^A(\hat g(4))(2)$.'
            answer: '5/2'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The function $\hat g(4)$ is $a\mapsto 200+25a$ cents, so $m^A(\hat g(4))$ is $a\mapsto (200+25a)/100$ euros. At $a=2$ the value is $250/100=5/2$, that is $2.5$ euros. This equals $m(g(4,2))$, as naturality in the target says.'
          - problem: 'A machine makes $g(x,a)=3x+a$ parts in batch number $x$ at setting $a$. The batches are renumbered by $k(n)=2n$, so new batch $n$ is old batch $2n$. The curry of $g\circ(k\times 1_A)$ gives, for each new batch, the function of the setting. How many parts does new batch $5$ make at setting $4$?'
            answer: '34'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'New batch $5$ is old batch $k(5)=10$. So it makes $g(10,4)=3\cdot10+4=34$ parts at setting $4$. This is $\hat g(k(5))(4)$, as naturality in $X$ says.'
          - problem: 'Let $A=\{0\}$, $B=\mathbb Z$, $X=X''=\{1,2\}$ and $g(x,0)=10x$. Let $k\colon X''\to X$ swap $1$ and $2$. Sam computes $\widehat{g\circ(k\times 1_A)}(1)(0)$ as $\hat g(1)(0)=10$. What is the correct value?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curry of $g\circ(k\times 1_A)$ is $\hat g\circ k$, so the value at $1$ is $\hat g(k(1))(0)=\hat g(2)(0)=g(2,0)=20$. Sam forgot to apply $k$ before applying $\hat g$.'
          - problem: 'Let $X=X''=\{1,2,3\}$, $A=\{0\}$, $B=\mathbb Z$ and $g(x,0)=x^2$. Let $k\colon X''\to X$ be given by $k(1)=2$, $k(2)=3$, $k(3)=1$. Is the curry of $g\circ(k\times 1_A)$ equal to the curry $\hat g$ of $g$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, they are equal", "they are equal", "equal"], ["no", "no, they are not equal", "they are not equal", "not equal"]]}
            solution_sketch: 'The curry of $g\circ(k\times 1_A)$ is $\hat g\circ k$, and at $1$ its value is $\hat g(k(1))(0)=g(2,0)=4$. But $\hat g(1)(0)=g(1,0)=1$. The two curries differ at $1$, so they are not equal.'
          - problem: 'Let $X$ have $3$ elements, $A$ have $2$ elements and $B$ have $2$ elements. How many maps $X\to B^A$ are there?'
            answer: '64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $B^A$ has $2^2=4$ elements, and a map from $X$ to it chooses one of $4$ values for each of $3$ points. So there are $4^3=64$ maps, which matches the $2^6=64$ maps $X\times A\to B$.'
          - problem: 'Write the full proof that in a category with exponentials, for every map $k\colon B\to B''$ and every map $g\colon X\times A\to B$, the curry of the composite $k\circ g$ equals $k^A\circ\hat g$, where $\hat g$ is the curry of $g$ and $k^A\colon B^A\to B''^A$ is the unique map with $\mathrm{ev}\circ(k^A\times 1_A)=k\circ\mathrm{ev}$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The map $k^A$ exists because $k\circ\mathrm{ev}\colon B^A\times A\to B''$ has a curry, and by definition that curry satisfies $\mathrm{ev}\circ(k^A\times 1_A)=k\circ\mathrm{ev}$. Uncurry the composite $k^A\circ\hat g$: since $(u\circ v)\times 1_A=(u\times 1_A)\circ(v\times 1_A)$, we get $\mathrm{ev}\circ((k^A\circ\hat g)\times 1_A)=\mathrm{ev}\circ(k^A\times 1_A)\circ(\hat g\times 1_A)$. By the defining equation of $k^A$ this equals $k\circ\mathrm{ev}\circ(\hat g\times 1_A)$, and by the defining equation of $\hat g$ it equals $k\circ g$. So $k^A\circ\hat g$ satisfies the defining equation of the curry of $k\circ g$, and uniqueness of the curry gives that the curry of $k\circ g$ is $k^A\circ\hat g$.'
        constraints: 'Naturality of currying is tested with explicit maps on sets of numbers: the curry of a precomposite read at a pair (naturality in $X$), the induced map $m^A$ on functions (naturality in the target), two priced contexts, an error-analysis item that forgets to apply $k$, a verdict on equality of two curries with the deciding values, and a count matching the bijection. The one full-proof item is naturality in the target.'
    diagnostic_exemplar:
      problem: "From the universal property of the exponential $B^A$ (evaluation $\\mathrm{ev}\\colon B^A\\times A\\to B$ with unique currying), deduce the bijection $\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$."
      answer: "Currying sends $g\\colon X\\times A\\to B$ to the unique $\\hat g\\colon X\\to B^A$ with $\\mathrm{ev}\\circ(\\hat g\\times 1_A)=g$; uncurrying sends $h\\colon X\\to B^A$ to $\\mathrm{ev}\\circ(h\\times 1_A)$. Uncurrying after currying returns $g$ by the defining equation. Currying after uncurrying returns $h$: $h$ satisfies the defining equation of the curry of $\\mathrm{ev}\\circ(h\\times 1_A)$, and the universal property says there is exactly one such map. So the two operations are mutually inverse, giving the bijection."
      solution_sketch: "Define currying and uncurrying from the universal property and check the two round trips. One direction is just the defining equation of $\\mathrm{ev}$; the other needs the uniqueness clause, which says no other map satisfies that equation."
    anki_seeds:
      - front: "Universal property of the exponential $B^A$?"
        back: "$\\mathrm{ev}\\colon B^A\\times A\\to B$ with: every $g\\colon X\\times A\\to B$ has a unique curry $\\hat g\\colon X\\to B^A$, $\\mathrm{ev}\\circ(\\hat g\\times 1_A)=g$."
        type: basic
      - front: "Exponentials give the natural bijection..."
        back: "$\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$ (currying), i.e. $(-\\times A)\\dashv(-)^A$."
        type: basic

  - id: preservation-reflection-of-limits
    name: Preserving and Reflecting Limits
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: limits-colimits
        weight: 0.5
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: limits-as-cones
        weight: 0.3
      - id: functor-composition-identity
        weight: 0.2
      - id: functors
        weight: 0.2
      # Phase C reconciliation: kp2 proves the free-group functor $F$ fails to preserve
      # binary products, computing $F(\{*\}) = \mathbb{Z}$ and refuting
      # $\mathbb{Z} \cong \mathbb{Z}\times\mathbb{Z}$ — free-groups-presentations kp1.
      - id: free-groups-presentations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The definitions
        key_prerequisites: [limits-colimits]
        try_first:
          problem: 'Let $F\colon(\mathbb N,\le)\to(\mathbb N,\le)$ be the functor $F(n)=n+1$. In $(\mathbb N,\le)$ the limit of a diagram with two objects is their minimum. The limit of the diagram with objects $4$ and $9$ is $4$. What is the limit of the diagram with objects $F(4)$ and $F(9)$?'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'The image diagram has objects $5$ and $10$, whose minimum is $5=F(4)$. So $F$ carried the limit cone to a limit cone, which is what it means for $F$ to preserve this limit.'
        exemplars:
          - problem: 'Regard $P=\{1,2,3,6\}$ as a category with one arrow $a\to b$ when $a$ divides $b$, and $Q=\{0,1,2\}$ as a category with one arrow $x\to y$ when $x\le y$. Let $F\colon P\to Q$ be the functor with $F(1)=0$, $F(2)=1$, $F(3)=1$, $F(6)=2$. In both categories the limit of a diagram of two objects is the greatest common lower bound of the two. Does $F$ preserve the limit of the diagram with objects $2$ and $3$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it preserves it", "it preserves it", "preserves", "it does preserve"], ["no", "no, it does not", "it does not preserve it", "does not preserve", "it does not", "it doesn't"]]}
            solution_sketch: 'The limit of the diagram with objects $2$ and $3$ in $P$ is $1$, and $F(1)=0$. The image diagram has objects $F(2)=1$ and $F(3)=1$, whose limit in $Q$ is $1$. Since $0\ne1$, the image of the limit cone is not a limit cone, so $F$ does not preserve this limit.'
          - problem: 'Let $P=\{1,2,3,6\}$ with an arrow $a\to b$ when $a$ divides $b$, and $Q=\{0,1,2,3\}$ with an arrow $x\to y$ when $x\le y$. Let $F\colon P\to Q$ be the functor with $F(1)=0$, $F(2)=1$, $F(3)=2$, $F(6)=3$. What is the limit in $Q$ of the diagram with the two objects $F(2)$ and $F(3)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image diagram has objects $1$ and $2$ in the chain $Q$. A limit of two objects in a chain is the smaller one, so the limit is $1$. It is not $F(1)=0$, the image of the limit of $2$ and $3$ in $P$, so $F$ does not preserve this limit.'
          - problem: 'Two clubs have members $A=\{\text{Ann},\text{Bo},\text{Cy}\}$ and $B=\{\text{Bo},\text{Cy},\text{Di}\}$. Regard the sets of students, ordered by inclusion, as a category, where the limit of two sets is their intersection. The functor $F$ sends a set to its number of members, in the category $(\mathbb N,\le)$ where the limit of two numbers is the smaller one. What is the limit in $(\mathbb N,\le)$ of the diagram with objects $F(A)$ and $F(B)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $F(A)=3$ and $F(B)=3$, and the limit of $3$ and $3$ in $(\mathbb N,\le)$ is $3$. The intersection $A\cap B$ has $2$ members, so $F(A\cap B)=2\ne3$. The size functor does not preserve this limit.'
          - problem: 'A packer puts items into boxes of $2$, and the functor $F(n)=\lfloor n/2\rfloor$ gives the number of full boxes for $n$ items, from $(\mathbb N,\le)$ to itself. The limit of the diagram with objects $7$ and $10$ is $7$, and its cones have an apex $c$ with $c\le7$. For how many whole numbers $c\ge0$ is the image of the cone with apex $c$ a limit cone over the diagram with objects $F(7)$ and $F(10)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image diagram has objects $F(7)=3$ and $F(10)=5$, with limit $3$. The image of the cone with apex $c$ is a limit cone exactly when $F(c)=3$, which for $c\le7$ means $c=6$ or $c=7$. So there are $2$ such numbers, and the cone with apex $6$ shows that $F$ preserves but does not reflect this limit.'
          - problem: 'Let $P=\{1,2,3,6\}$ with an arrow $a\to b$ when $a$ divides $b$, and let $T$ be the category with one object and only its identity arrow. Let $F\colon P\to T$ be the only functor. Let $D$ be the diagram with objects $2$ and $6$, and note that its cones in $P$ have apex $1$ or $2$. Sam says that $F$ reflects limits of $D$, because $F$ sends every cone over $D$ to a limit cone of $T$. Which apex gives the limit cone of $D$ in $P$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone over $D$ has an apex that divides both $2$ and $6$, so the apex is $1$ or $2$. The limit is the greatest such apex, which is $2$. The cone with apex $1$ has a limit image in $T$ but is not a limit cone, so Sam is wrong.'
          - problem: 'The forgetful functor $U\colon\mathbf{Grp}\to\mathbf{Set}$ preserves binary products. How many elements does $U(\mathbb Z_4\times\mathbb Z_6)$ have, where $\mathbb Z_4\times\mathbb Z_6$ is the product of the two groups?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Preservation says that $U$ of the product group is the product of the sets $U(\mathbb Z_4)$ and $U(\mathbb Z_6)$. That set has $4\cdot6=24$ elements, so $U(\mathbb Z_4\times\mathbb Z_6)$ has $24$ elements.'
          - problem: 'Let $F\colon(\mathbb N,\le)\to(\mathbb N,\le)$ be the functor $F(n)=2n$, and let $D$ be the diagram with objects $5$ and $8$. In $(\mathbb N,\le)$ the limit of a diagram of two objects is the smaller one, and a cone over $D$ has an apex $c$ with $c\le5$. Does $F$ reflect the limit of $D$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it reflects it", "it reflects it", "reflects", "it does reflect"], ["no", "no, it does not", "it does not reflect it", "does not reflect", "it does not", "it doesn't"]]}
            solution_sketch: 'The limit of $D$ is $5$. The image diagram has objects $10$ and $16$ with limit $10$, and the image of the cone with apex $c$ is a limit cone exactly when $2c=10$, so when $c=5$. So every cone over $D$ whose image is a limit cone is the limit cone with apex $5$, and $F$ reflects this limit.'
          - problem: 'Write the full proof that neither preservation nor reflection of limits of a diagram $D$ asserts that $D$ has a limit: express each as a statement about every cone $\lambda$ over $D$, where $P(\lambda)$ means that $\lambda$ is a limit cone and $Q(\lambda)$ means that $F(\lambda)$ is a limit cone, and describe the cone that refutes each statement.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Preservation says that for every cone $\lambda$ over $D$, $P(\lambda)$ implies $Q(\lambda)$. Reflection says that for every cone $\lambda$ over $D$, $Q(\lambda)$ implies $P(\lambda)$. Each is an implication about cones, so it is true when no cone satisfies its hypothesis, and neither statement asserts that a limit cone exists. A universally quantified implication fails exactly when some cone satisfies the hypothesis and not the conclusion. So preservation fails for a limit cone whose image is not a limit cone, and reflection fails for a cone whose image is a limit cone but which is not a limit cone itself.'
        constraints: 'Preservation and reflection are told apart on explicit finite categories (divisibility posets, chains, subsets under inclusion): the image of a limit compared with the limit of the image diagram, the cones whose image is a limit cone, and a functor that preserves but does not reflect. Contexts: club members counted by a size functor, items packed in boxes. Existence of a limit is never inferred from either condition. The one full-proof item concerns what each definition does and does not assert.'
      - id: kp2
        name: Examples and non-examples
        key_prerequisites: [functors, free-groups-presentations]
        exemplars:
          - problem: 'Let $F\colon\mathbf{Set}\to\mathbf{Mon}$ be the free monoid functor and let $X=Y=\{*\}$. Then $F(X\times Y)$ is the free monoid on one element, which is $(\mathbb N,+)$, and $FX\times FY$ is $\mathbb N\times\mathbb N$ with componentwise addition. What is the least number of elements that generate $\mathbb N\times\mathbb N$ as a monoid?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pairs $(1,0)$ and $(0,1)$ are not sums of two nonzero pairs, so every generating set contains both. They generate every pair $(m,n)=m(1,0)+n(0,1)$, so the least number is $2$. The monoid $\mathbb N$ needs only $1$ generator, so $F(X\times Y)\not\cong FX\times FY$ and $F$ does not preserve this product.'
          - problem: 'A game stores each piece as a pair of a board square from a set $X$ and one of $3$ colours, so the functor $F$ sends a set $X$ to $X\times\{0,1,2\}$ in $\mathbf{Set}$. For $X=Y=\{1,2\}$, how many times as many elements as $F(X\times Y)$ does the product $FX\times FY$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $X\times Y$ has $4$ elements, so $F(X\times Y)$ has $4\cdot3=12$ elements. The sets $FX$ and $FY$ each have $2\cdot3=6$ elements, so $FX\times FY$ has $36$. The ratio is $36\div12=3$, so $F$ does not preserve the product.'
          - problem: 'A robot moves on a grid, and its moves form the monoid $(\mathbb N\times\mathbb N,+)$, where $(m,n)$ means $m$ steps east and $n$ steps north. The image of the free monoid on one element is the set of moves $k\cdot(1,1)$, the repeated diagonal step. Among the $16$ moves $(m,n)$ with $0\le m,n\le3$, how many cannot be made with diagonal steps alone?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A move can be made with diagonal steps alone exactly when $m=n$. There are $4$ such moves among the $16$, namely $(0,0),(1,1),(2,2),(3,3)$. So $16-4=12$ moves cannot be made.'
          - problem: 'Let $P=\{1,2,3,6\}$ with an arrow $a\to b$ when $a$ divides $b$. Let $F\colon P\to P$ be the functor with $F(1)=1$, $F(2)=2$, $F(3)=2$, $F(6)=6$. What is the limit in $P$ of the diagram with the two objects $F(2)$ and $F(3)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image diagram has objects $2$ and $2$, and its limit in $P$ is their greatest common divisor, $2$. But the limit of the diagram with objects $2$ and $3$ is $1$ and $F(1)=1\ne2$, so $F$ does not preserve this limit.'
          - problem: 'The subsets of $\{a,b\}$, ordered by inclusion, form a category $C$, and $D$ is the category $0\to1$. The functor $F\colon C\to D$ sends the empty set to $0$ and every nonempty subset to $1$. The product of $\{a\}$ and $\{b\}$ in $C$ is their intersection. What is the product in $D$ of $F(\{a\})$ and $F(\{b\})$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $F(\{a\})=1$ and $F(\{b\})=1$, and the product of $1$ and $1$ in the chain $0\to1$ is $1$. The product in $C$ is the empty set, with $F(\emptyset)=0\ne1$. So $F$ does not preserve this product.'
          - problem: 'Let $P=\{1,2,3,6\}$ with an arrow $a\to b$ when $a$ divides $b$, and let $F\colon P\to P$ be the functor with $F(1)=1$, $F(2)=3$, $F(3)=2$, $F(6)=6$. Does $F$ preserve the limit of the diagram with objects $2$ and $6$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it preserves it", "it preserves it", "preserves", "it does preserve"], ["no", "no, it does not", "it does not preserve it", "does not preserve", "it does not", "it doesn't"]]}
            solution_sketch: 'The limit of the diagram with objects $2$ and $6$ is $2$, and $F(2)=3$. The image diagram has objects $F(2)=3$ and $F(6)=6$, whose limit is $3$. Since $F(2)=3$, the image of the limit cone is a limit cone, so $F$ preserves this limit.'
          - problem: 'Let $F\colon\mathbf{Set}\to\mathbf{Grp}$ be the free group functor and $X=Y=\{*\}$, so that $F(X\times Y)\to FX\times FY$ is the map $\mathbb Z\to\mathbb Z\times\mathbb Z$ with $n\mapsto(n,n)$. How many pairs $(m,n)$ with $-2\le m,n\le2$ lie in its image?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The image of $n\mapsto(n,n)$ consists of the pairs with $m=n$. Among the pairs with $-2\le m,n\le2$ these are $(-2,-2),(-1,-1),(0,0),(1,1),(2,2)$, so there are $5$ of them. The map is not onto, so it is not an isomorphism.'
          - problem: 'Write the full proof that the free group functor $F\colon\mathbf{Set}\to\mathbf{Grp}$ does not preserve binary products, using the sets $X=Y=\{*\}$ and a proof that $F(X\times Y)$ and $FX\times FY$ are not isomorphic.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Take $X=Y=\{*\}$ in $\mathbf{Set}$, so $X\times Y=\{(*,*)\}$ with its two projections is a product cone. Applying $F$ gives the free group on one generator, which is $\mathbb Z$, while the product of $FX=\mathbb Z$ and $FY=\mathbb Z$ in $\mathbf{Grp}$ is $\mathbb Z\times\mathbb Z$. The group $\mathbb Z$ is cyclic, but $\mathbb Z\times\mathbb Z$ is not: if $(a,b)$ generated it, then $(1,0)=n(a,b)$ gives $na=1$ and $nb=0$, so $n=\pm1$, $b=0$, and every multiple of $(a,b)$ has second coordinate $0$, so $(0,1)$ is never reached. Hence $F(X\times Y)\not\cong FX\times FY$, the image cone is not a product cone, and $F$ does not preserve binary products.'
        constraints: 'Non-examples and examples of product preservation are computed on concrete data: the free monoid on a one-element set against $\mathbb N\times\mathbb N$ (least number of generators, elements outside the image of the comparison map), a functor on sets that multiplies the size of a product, divisibility posets where the image of a limit is or is not the limit of the image, and a two-element-chain functor on subsets. The one full-proof item is the free group functor on binary products.'
      - id: kp3
        name: Fully faithful functors reflect limits
        key_prerequisites: [full-faithful-functors]
        exemplars:
          - problem: 'Let $F\colon\mathcal C\to\mathcal D$ be a fully faithful functor and let $X$ and $L$ be objects of $\mathcal C$. The set $\mathrm{Hom}_{\mathcal D}(FX,FL)$ has $4$ arrows, and $u$ is one of them. How many arrows $v\colon X\to L$ in $\mathcal C$ satisfy $Fv=u$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Fullness says that $F$ maps $\mathrm{Hom}_{\mathcal C}(X,L)$ onto $\mathrm{Hom}_{\mathcal D}(FX,FL)$, so at least one $v$ has $Fv=u$. Faithfulness says that $F$ is injective on this hom-set, so at most one does. So there is exactly $1$ such arrow, and $\mathrm{Hom}_{\mathcal C}(X,L)$ has $4$ arrows.'
          - problem: 'Let $P=\{1,2,3,6\}$ with an arrow $a\to b$ when $a$ divides $b$, and $Q=\{0,1,2,3\}$ with an arrow $x\to y$ when $x\le y$. Let $F\colon P\to Q$ be the functor with $F(1)=0$, $F(2)=1$, $F(3)=2$, $F(6)=3$. Such a functor is full when $F(a)\le F(b)$ implies that $a$ divides $b$. For which pair $(a,b)$ in $P$ is $F(a)\le F(b)$ although $a$ does not divide $b$?'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'We need $F(a)\le F(b)$ with $a\nmid b$. The only pair is $(2,3)$, since $F(2)=1\le F(3)=2$ but $2$ does not divide $3$. In every other pair $F(a)\le F(b)$ already means $a$ divides $b$. So $F$ is faithful but not full.'
          - problem: 'Four tasks are numbered $1$ to $4$. Task $1$ must finish before tasks $2$, $3$ and $4$, and task $2$ must finish before task $4$; no other order is required. A scheduler puts task $i$ in time slot $i$, which gives a functor from the tasks to the slots $1\le2\le3\le4$. For how many ordered pairs of different tasks $(x,y)$ is slot $x$ at most slot $y$ although $x$ is not required to finish before $y$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Slot $x$ is at most slot $y$ exactly when $x<y$. The pairs with $x<y$ that are not required are $(2,3)$ and $(3,4)$, since task $3$ has no order with tasks $2$ and $4$. The pairs with $x<y$ that are required are $(1,2),(1,3),(1,4),(2,4)$. So there are $2$ pairs, and the scheduler functor is not full.'
          - problem: 'Turning a dial with $3$ positions by $n$ steps is an arrow of the one-object category $B(\mathbb Z_3,+)$, and turning a dial with $6$ positions by $m$ steps is an arrow of $B(\mathbb Z_6,+)$. The functor $F$ sends the turn $n$ to the turn $2n$. How many turns of the $6$-position dial are not the image of any turn of the $3$-position dial?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The images of the turns $0,1,2$ are $0,2,4$ in $\mathbb Z_6$. The turns $1,3,5$ are not images, so there are $3$ of them. The functor is faithful but not full, since only $3$ of the $6$ arrows are hit.'
          - problem: 'Let $P=\{n,k,a,b\}$ be the poset with $n\le k$, $k\le a$ and $k\le b$, and so $n\le a$ and $n\le b$, where $a$ and $b$ are not comparable. As a category, the limit of the diagram with objects $a$ and $b$ is their greatest common lower bound. What is it?'
            answer: 'k'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The common lower bounds of $a$ and $b$ are $n$ and $k$. Since $n\le k$, the greatest of them is $k$, so the limit is $k$.'
          - problem: 'Let $P=\{n,k,a,b\}$ be the poset with $n\le k$, $k\le a$, $k\le b$ (so $n\le a$ and $n\le b$) and let $Q=\{0,1,2\}$ be the chain $0\le1\le2$. The functor $F\colon P\to Q$ has $F(n)=1$, $F(k)=1$, $F(a)=1$, $F(b)=2$. The cone with apex $n$ over the diagram with objects $a$ and $b$ is sent by $F$ to a limit cone in $Q$. Which element of $P$ is the apex of the limit cone over the diagram with objects $a$ and $b$ in $P$?'
            answer: 'k'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of $a$ and $b$ in $P$ is the greatest common lower bound of $a$ and $b$. The common lower bounds are $k$ and $n$, and $k$ is the greatest, so the apex is $k$. The cone with apex $n$ is not the limit cone, although its image is one.'
          - problem: 'Let $P=\{1,2,3,6\}$ and $R=\{1,2,3,4,6,12\}$, each with an arrow $a\to b$ when $a$ divides $b$, and let $F\colon P\to R$ be the inclusion. Is $F$ fully faithful?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is fully faithful", "it is fully faithful", "fully faithful"], ["no", "no, it is not fully faithful", "it is not fully faithful", "not fully faithful"]]}
            solution_sketch: 'Between two objects of $P$ there is an arrow in $P$ exactly when the first divides the second, and the same holds in $R$. So $F$ is a bijection on each hom-set, which is full and faithful.'
          - problem: 'Write the full proof that a fully faithful functor $F\colon\mathcal C\to\mathcal D$ reflects limits.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $(L,\lambda)$ be a cone over a diagram $D$ in $\mathcal C$ whose image $(FL,F\lambda)$ is a limit cone, and let $(X,\mu)$ be any cone over $D$. The image $(FX,F\mu)$ is a cone over $FD$, so there is a unique $u\colon FX\to FL$ with $F\lambda_j\circ u=F\mu_j$ for every $j$. By fullness $u=Fv$ for some $v\colon X\to L$. Then $F(\lambda_j\circ v)=F\mu_j$, and faithfulness gives $\lambda_j\circ v=\mu_j$, so $v$ is a cone map. If $v''$ is another cone map, then $Fv''$ satisfies the equations that determine $u$, so $Fv''=u=Fv$ and faithfulness gives $v''=v$. So every cone has exactly one cone map to $(L,\lambda)$, and $(L,\lambda)$ is a limit cone.'
        constraints: 'Full faithfulness and reflection of limits are tested on explicit posets and one-object categories: the number of preimages of a mediator, the pair that breaks fullness of an order-preserving map, a scheduling context counting pairs that break fullness, a dial context counting arrows missing from the image, the meet in a poset where a faithful but not full functor fails to reflect, and verdicts on reflection and on fullness. The one full-proof item is that a fully faithful functor reflects limits.'
    diagnostic_exemplar:
      problem: "Prove that a fully faithful functor $F\\colon\\mathcal{C}\\to\\mathcal{D}$ reflects limits."
      answer: "Let $(L,\\lambda)$ be a cone over $D$ whose image $(FL,F\\lambda)$ is a limit cone over $FD$, and let $(X,\\mu)$ be any cone over $D$. Then $(FX,F\\mu)$ is a cone over $FD$, so there is a unique $u\\colon FX\\to FL$ with $F\\lambda_j\\circ u=F\\mu_j$ for all $j$. By fullness $u=Fv$ for some $v\\colon X\\to L$; then $F(\\lambda_j\\circ v)=F\\mu_j$ and faithfulness gives $\\lambda_j\\circ v=\\mu_j$, so $v$ is a cone morphism. If $v'$ is another, $Fv'$ satisfies the equations characterizing $u$, so $Fv'=u=Fv$ and faithfulness gives $v'=v$. Hence $(L,\\lambda)$ is a limit cone."
      solution_sketch: "Transport an arbitrary cone over $D$ down into $\\mathcal D$ and mediate there, then lift the mediating map back with fullness and verify its leg equations with faithfulness. Uniqueness downstairs comes from uniqueness upstairs plus faithfulness once more."
    anki_seeds:
      - front: "A functor preserves limits when..."
        back: "it sends limit cones to limit cones (the canonical comparison is an isomorphism)."
        type: basic
      - front: "A functor reflects limits when..."
        back: "a cone whose image is a limit cone must already have been a limit cone."
        type: basic
      - front: "Fully faithful functors {{c1::reflect}} limits."
        back: "reflect"
        type: cloze

  - id: complete-categories
    name: Complete and Cocomplete Categories
    core: false                # terminal classification of categories by limit existence
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: limits-colimits
        weight: 0.5
        key: true
      - id: equalizers-coequalizers
        weight: 0.4
        key: true
      - id: initial-terminal-as-limits
        weight: 0.3
      - id: products-coproducts
        weight: 0.3
      - id: pullbacks-pushouts
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Definitions
        key_prerequisites: [limits-colimits]
        exemplars:
          - problem: 'Regard the divisors $\{1,2,3,4,6,12\}$ of $12$ as a category with one arrow $a\to b$ when $a$ divides $b$. What is the limit of the empty diagram in this category?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone over the empty diagram is just an object, and the limit is the object that every object maps to by exactly one arrow, that is the terminal object. Every divisor of $12$ divides $12$, so the terminal object is $12$.'
          - problem: 'In the category of the divisors $\{1,2,3,4,6,12\}$ of $12$, with one arrow $a\to b$ when $a$ divides $b$, what is the limit of the diagram with the two objects $4$ and $6$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone over the diagram is an object that divides both $4$ and $6$, so it is $1$ or $2$. The limit is the greatest such object, which is $2$, the greatest common divisor of $4$ and $6$.'
          - problem: 'Let $P=\{a,b,c\}$ be the poset with $a\le c$ and $b\le c$, where $a$ and $b$ are not comparable. Regard it as a category, so that a diagram is a subset of $P$ and its limit is its greatest lower bound. Of the $8$ subsets of $P$, how many have a limit?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The empty subset has the greatest element $c$ as its limit, and the subsets $\{a\}$, $\{b\}$, $\{c\}$, $\{a,c\}$ and $\{b,c\}$ have limits $a$, $b$, $c$, $a$ and $b$. The subsets $\{a,b\}$ and $\{a,b,c\}$ have no lower bound at all, so they have no limit. So $6$ of the $8$ subsets have a limit.'
          - problem: 'Let $P$ be the poset with elements $2$, $3$, $4$, $12$, ordered by divisibility, so that $1$ is not an element of $P$. In the category of $P$, the limit of a diagram of two objects is their greatest common lower bound in $P$. For how many pairs of different objects of $P$ does the diagram have no limit?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pairs are $\{2,3\}$, $\{2,4\}$, $\{2,12\}$, $\{3,4\}$, $\{3,12\}$, $\{4,12\}$. The pairs $\{2,4\}$, $\{2,12\}$, $\{3,12\}$, $\{4,12\}$ have limits $2$, $2$, $3$, $4$. The pairs $\{2,3\}$ and $\{3,4\}$ have no common divisor inside $P$, since $1$ is missing, so exactly $2$ pairs have no limit.'
          - problem: 'View the natural numbers $0,1,2,\dots$ with their usual order as a category, with one arrow $m\to n$ when $m\le n$. Does the empty diagram have a limit?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it has a limit", "it has a limit", "has a limit"], ["no", "no, it has no limit", "it has no limit", "has no limit", "it does not have a limit", "does not have a limit"]]}
            solution_sketch: 'A limit of the empty diagram is a terminal object, an object $t$ with an arrow $n\to t$ for every $n$. That would be a number $t\ge n$ for every $n$, and no such number exists. So the empty diagram has no limit, and the category is not complete.'
          - problem: 'A rope of $40$ cm and a rope of $56$ cm are cut into equal pieces with no waste, as long as possible. In the category of positive whole numbers with an arrow $a\to b$ when $a$ divides $b$, a piece length is an object that divides both $40$ and $56$. What is the limit of the diagram with objects $40$ and $56$, that is, the greatest piece length?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone over the diagram is a piece length that divides both $40$ and $56$, and the limit is the greatest such length. That is $\gcd(40,56)=8$. So the longest equal pieces are $8$ cm long.'
          - problem: 'Three lights flash every $4$, $6$ and $10$ seconds, starting together. In the category of positive whole numbers with an arrow $a\to b$ when $a$ divides $b$, a time at which a light flashes again is an object that every period divides. What is the colimit of the diagram with objects $4$, $6$ and $10$, that is, the first time in seconds at which all three flash together again?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cocone is a number divisible by $4$, $6$ and $10$, and the colimit is the least such number, the least common multiple. We have $\mathrm{lcm}(4,6,10)=60$, so the lights flash together again after $60$ seconds.'
          - problem: 'Regard $\{1,2,3\}$ as a category with one arrow $a\to b$ when $a$ divides $b$. How many subsets of $\{1,2,3\}$, as diagrams, have no limit?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every nonempty subset has a greatest common divisor inside $\{1,2,3\}$, since the pairs $\{1,2\}$, $\{1,3\}$, $\{2,3\}$ and the whole set all have $1$. The empty subset would need a terminal object, a number divisible by $1$, $2$ and $3$, and there is none in $\{1,2,3\}$. So exactly $1$ subset has no limit, and the category is not complete.'
          - problem: 'Regard the divisors $\{1,2,3,4,6,12\}$ of $12$ as a category with one arrow $a\to b$ when $a$ divides $b$. Is this category complete?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is complete", "it is complete", "complete"], ["no", "no, it is not complete", "it is not complete", "not complete"]]}
            solution_sketch: 'A diagram in this category is a set of divisors, and its limit is the greatest lower bound of that set. Every nonempty set of divisors of $12$ has a greatest common divisor, which divides $12$ and so lies in the category, and the empty set has the terminal object $12$ as its limit. So every diagram has a limit, and the category is complete.'
          - problem: 'Write the full proof that a poset, viewed as a category, has all small limits exactly when it is a complete lattice.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'A diagram from a small category into a poset category $P$ is determined by the set $S$ of objects it hits, since $P$ has at most one arrow between two objects. A cone over the diagram with apex $c$ is an element below every member of $S$, so a lower bound of $S$, and the limit is the greatest lower bound, so a limit exists exactly when $\inf S$ exists. If $P$ has all small limits, every subset has an infimum, including the empty set, whose infimum is the greatest element, so $P$ is a complete lattice. Conversely, if $P$ is a complete lattice, every subset has an infimum, so every small diagram has a limit.'
        constraints: 'Completeness of poset categories is decided on explicit posets: the limit of the empty diagram as the greatest element, the limit of two objects as a greatest common divisor, subsets with or without an infimum, a verdict on the empty diagram in $(\mathbb N,\le)$, and divisibility contexts (cutting ropes, flashing lights) that need a greatest common divisor or a least common multiple. The one full-proof item is the characterization of complete posets.'
      - id: kp2
        name: Completeness from products and equalizers
        key_prerequisites: [equalizers-coequalizers]
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $D$ be the diagram $X_1\xrightarrow{f}X_3\xleftarrow{g}X_2$ with $X_1=\{0,1,2,3\}$, $X_2=\{a,b,c\}$, $X_3=\{p,q,r\}$, $f(0)=p$, $f(1)=q$, $f(2)=p$, $f(3)=r$, $g(a)=p$, $g(b)=q$, $g(c)=q$. The limit of $D$ is the equalizer of two maps $X_1\times X_2\times X_3\rightrightarrows X_3\times X_3$. How many elements does the limit of $D$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A tuple $(x_1,x_2,x_3)$ lies in the equalizer exactly when $x_3=f(x_1)$ and $x_3=g(x_2)$, so exactly when $f(x_1)=g(x_2)$ and $x_3$ is that common value. The pairs are $(0,a)$, $(2,a)$, $(1,b)$, $(1,c)$, and no pair involves $3$ since $r$ is not a value of $g$. So the limit has $4$ elements.'
          - problem: 'Two clocks show the hour $t$, for $t=0,1,\dots,23$. The first clock shows $t \bmod 12$ and the second shows $t \bmod 5$. A time is called a match when the two clocks show the same number. The set of matches is the equalizer of the two maps from $\{0,\dots,23\}$ to $\mathbb Z$. How many matches are there?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two clocks agree for $t=0,1,2,3,4$, where both show $t$. For $t=5,\dots,11$ the first clock shows $t$ and the second shows $t-5$ or less, so they differ. For $t\ge12$ the first shows $t-12$ and the second shows $t \bmod 5$, and these differ for $t=12,\dots,23$. So there are $5$ matches.'
          - problem: 'A pizza shop offers $2$ sizes, $3$ crusts and $4$ toppings. A pizza is one choice of each. In $\mathbf{Set}$, the set of pizzas is the limit of the diagram of the three sets with no arrows, which is their product, and no equalizer is needed. How many pizzas are there?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With no arrows, the second product is the empty product, a one-element set, so the equalizer imposes no condition. The limit is the product of the three sets, with $2\cdot3\cdot4=24$ elements. So there are $24$ pizzas.'
          - problem: 'In $\mathbf{Set}$ let $X=\{0,1,\dots,9\}$ and $f\colon X\to X$ be $f(x)=x^3 \bmod 10$. The diagram with one object $X$ and one arrow $f$ has as limit the equalizer of $1_X$ and $f$. How many elements does this limit have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit is the set of $x$ with $f(x)=x$. Checking $x^3\bmod 10$ for $x=0,\dots,9$ gives the values $0,1,8,7,4,5,6,3,2,9$, which equal $x$ for $x=0,1,4,5,6,9$. So the limit has $6$ elements.'
          - problem: 'In $\mathbf{Set}$ let $D$ be the diagram $X_1\xrightarrow{f}X_3\xleftarrow{g}X_2$ with $X_1=\{0,1,2\}$, $X_2=\{0,1\}$, $X_3=\{0,1\}$, $f(x)=x \bmod 2$ and $g(y)=y$. Sam builds the limit as the equalizer of two maps $X_1\times X_2\times X_3\rightrightarrows X_3\times X_3$ and takes both to be $(\pi_3,\pi_3)$, so every triple is in the equalizer, giving $12$ elements. How many elements does the limit of $D$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam''s two maps are equal, so they do not use the arrows $f$ and $g$. The correct second map is $(f\circ\pi_1,g\circ\pi_2)$, and a triple lies in the equalizer when $x_3=f(x_1)=g(x_2)$. The pairs $(x_1,x_2)$ with $f(x_1)=g(x_2)$ are $(0,0)$, $(1,1)$, $(2,0)$, so the limit has $3$ elements.'
          - problem: 'The poset category $(\mathbb N,\le)$ has a product for any two objects, their minimum, and an equalizer for any two parallel arrows. Is it complete?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is complete", "it is complete", "complete"], ["no", "no, it is not complete", "it is not complete", "not complete"]]}
            solution_sketch: 'A parallel pair in a poset category is a single arrow, whose equalizer is the identity, and every nonempty set of natural numbers has a minimum. But the empty product is a terminal object, a number at least as large as every natural number, and there is none. So the category does not have all small products, and it is not complete.'
          - problem: 'The subsets of $\{1,2,3\}$, ordered by inclusion, form a category with one arrow $S\to T$ when $S\subseteq T$, and the product of subsets is their intersection. Is this category complete?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is complete", "it is complete", "complete"], ["no", "no, it is not complete", "it is not complete", "not complete"]]}
            solution_sketch: 'Every family of subsets has an intersection inside $\{1,2,3\}$, and the empty family has the whole set $\{1,2,3\}$ as its product, the terminal object. Parallel arrows in a poset category are equal, so their equalizer is the identity. So the category has all small products and all equalizers, and it is complete.'
          - problem: 'Write the full proof that a category with all small products and all equalizers is complete, that is, every diagram from a small category into it has a limit.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $D$ be a diagram from a small category $J$ into the category. Form the product $P$ of the objects $D(j)$ over the objects $j$ of $J$, and the product $Q$ of the objects $D(\mathrm{cod}\,f)$ over the arrows $f$ of $J$; both exist since $J$ is small. Define $u,v\colon P\to Q$ with $f$-components $\pi_{\mathrm{cod} f}$ and $D(f)\circ\pi_{\mathrm{dom} f}$, and let $e$ be their equalizer. The equation $ue=ve$ says $D(f)\circ\pi_{\mathrm{dom} f}e=\pi_{\mathrm{cod} f}e$ for every $f$, so the maps $\pi_je$ form a cone over $D$. Given any cone $q_j$ with vertex $X$, the product gives a unique $t\colon X\to P$ with $\pi_jt=q_j$, the cone condition says $ut=vt$, and so $t$ factors uniquely through $e$. Hence the cone $\pi_je$ is a limit of $D$.'
        constraints: 'The limit as an equalizer of two maps between products is computed in Set with explicit finite data: the equalizer of a cospan, of a loop, of a pair of residue maps in a clock context, and of a discrete diagram in a menu context, with an error-analysis item in which both maps are taken to be the same, and a verdict on a poset that has binary products and equalizers but is not complete. The one full-proof item is the construction for a general small diagram.'
      - id: kp3
        name: Finite completeness from a terminal object and pullbacks
        key_prerequisites: [pullbacks-pushouts]
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $A=\{1,2,3\}$ and $B=\{x,y\}$, and let $1$ be a one-element set. The pullback of the unique maps $A\to1\leftarrow B$ is a product of $A$ and $B$. How many elements does it have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pullback is the set of pairs $(a,b)$ with $!_A(a)=!_B(b)$ in $1$, and this holds for every pair because $1$ has one element. So the pullback is $A\times B$ with $3\cdot2=6$ elements.'
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1,2,3,4,5\}$, $B=\{0,1,2\}$, $f(x)=x \bmod 3$ and $g(x)=\lfloor x/2\rfloor$. The pullback of $(1_A,f)\colon A\to A\times B$ and $(1_A,g)\colon A\to A\times B$ is an equalizer of $f$ and $g$. How many elements does it have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pullback is the set of pairs $(x,y)$ with $(x,f(x))=(y,g(y))$, which forces $y=x$ and $f(x)=g(x)$. We have $x \bmod 3=\lfloor x/2\rfloor$ for $x=0$ (both $0$) and $x=5$ (both $2$), and for no other $x$. So the pullback has $2$ elements.'
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1,\dots,6\}$, $B=\{0,1,2\}$, $f(x)=x \bmod 3$ and $g(x)=0$. Sam says that the pullback of $f$ and $g$ themselves, with its first projection to $A$, is the equalizer of $f$ and $g$. How many elements does the equalizer of $f$ and $g$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equalizer is the set of $x$ with $f(x)=g(x)$, that is $x \bmod 3=0$, which gives $x=0,3,6$, so it has $3$ elements. Sam''s pullback is the set of pairs $(x,y)$ with $f(x)=g(y)$, which has $3\cdot7=21$ elements because $y$ is free. So Sam''s set is too large.'
          - problem: 'In the category of finite sets and all functions, is there a product of infinitely many two-element sets?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, there is a product", "there is a product", "it exists"], ["no", "no, there is none", "there is no product", "it does not exist", "there is none", "none"]]}
            solution_sketch: 'A product $P$ of infinitely many two-element sets would have $\mathrm{Hom}(Y,P)$ in bijection with the product of the sets $\mathrm{Hom}(Y,\{0,1\})$. For $Y=\{*\}$ the right side has infinitely many elements, but $\mathrm{Hom}(\{*\},P)$ is finite when $P$ is finite. So no finite set is such a product.'
          - problem: 'A cafe offers $2$ drinks, $3$ snacks and $5$ desserts, and a combo is one item of each kind. The set of combos is the product of the three sets, built by pulling back over the one-element set twice. How many combos are there?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first pullback gives the product of two of the sets, and the second pullback over the one-element set gives the product with the third set. So there are $2\cdot3\cdot5=30$ combos.'
          - problem: 'Two shops charge $f(n)=3n+1$ euros and $g(n)=n+9$ euros for $n$ items, for $n=0,1,\dots,9$. The equalizer of $f$ and $g$, built as a pullback of $(1,f)$ and $(1,g)$, is the set of $n$ where the prices agree. Which $n$ is in it?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The prices agree when $3n+1=n+9$, so $2n=8$ and $n=4$. This is the only solution, and $n=4$ lies in $\{0,\dots,9\}$.'
          - problem: 'The category of finite sets has a terminal object and all pullbacks. Does it have all finite limits?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it does", "it has all finite limits", "it does"], ["no", "no, it does not", "it lacks some finite limits", "it does not"]]}
            solution_sketch: 'A terminal object and pullbacks give binary products and equalizers, and these give every finite limit. The product of two finite sets is finite and so is a subset of a finite set. So the category of finite sets has all finite limits.'
          - problem: 'Write the full proof that a category with a terminal object and all pullbacks has all finite limits, by building binary products and equalizers as pullbacks.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The limit of the empty diagram is the terminal object. For objects $A$ and $B$, the pullback of $A\to1\leftarrow B$ is a binary product, since a cone over $A$ and $B$ is a cone over that cospan. For parallel arrows $f,g\colon A\to B$, form the product $A\times B$ and the maps $(1_A,f),(1_A,g)\colon A\to A\times B$; the pullback of these two maps has an arrow $e\colon E\to A$. The condition $(1_A,f)e=(1_A,g)e$ gives $e=e$ and $fe=ge$, and any $h$ with $fh=gh$ satisfies $(1_A,f)h=(1_A,g)h$, so $h$ factors uniquely through $e$, and $e$ is the equalizer. Every finite limit is built from finite products and an equalizer, so all finite limits exist.'
        constraints: 'Products and equalizers are built from a terminal object and pullbacks in Set with explicit finite data: the pullback over the terminal object, the pullback of $(1_A,f)$ and $(1_A,g)$ as an equalizer, an error-analysis item that pulls back $f$ and $g$ directly, a three-set combination context, a prices context, and verdicts on infinite products in the category of finite sets and on finite limits there. The one full-proof item is that a terminal object and pullbacks give all finite limits.'
    diagnostic_exemplar:
      problem: "Prove the dual of the products-and-equalizers criterion: a category $\\mathcal C$ with all small coproducts and all coequalizers is cocomplete. Construct the colimit of an arbitrary small diagram $D\\colon\\mathcal J\\to\\mathcal C$ as a coequalizer of two maps between coproducts, and verify its universal property."
      answer: "Form $\\coprod_j Dj$ (over the objects of $\\mathcal J$) and $\\coprod_{f\\colon j\\to j'}Dj$ (over the morphisms), and let $u,v\\colon\\coprod_f Dj\\rightrightarrows\\coprod_j Dj$ be the maps whose components on the summand indexed by $f\\colon j\\to j'$ are $\\iota_j$ and $\\iota_{j'}\\circ Df$ respectively. Let $q\\colon\\coprod_j Dj\\to Q$ be their coequalizer and set $\\gamma_j=q\\circ\\iota_j$. Then $q u=q v$ says precisely $\\gamma_j=\\gamma_{j'}\\circ Df$ for every $f\\colon j\\to j'$, so $(Q,\\gamma)$ is a cocone under $D$. Given any cocone $(X,\\delta)$, the coproduct's universal property gives $[\\delta_j]\\colon\\coprod_j Dj\\to X$, and the cocone condition $\\delta_j=\\delta_{j'}\\circ Df$ says exactly $[\\delta_j]u=[\\delta_j]v$; the coequalizer's universal property therefore factors $[\\delta_j]$ through $q$ by a unique $w\\colon Q\\to X$, and $w\\gamma_j=w q\\iota_j=[\\delta_j]\\iota_j=\\delta_j$. Any other cocone map $w'$ satisfies $w'q\\iota_j=\\delta_j$ for all $j$, hence $w'q=[\\delta_j]$, hence $w'=w$ by uniqueness of the factorisation. So $(Q,\\gamma)$ is $\\mathrm{colim}\\,D$, and every small colimit exists: $\\mathcal C$ is cocomplete."
      solution_sketch: "Build the colimit as a coequalizer of two maps $\\coprod_{f}Dj\\rightrightarrows\\coprod_j Dj$ — one component $\\iota_j$, the other $\\iota_{j'}\\circ Df$ — chosen so that the equation $qu=qv$ says exactly that the legs form a cocone. Any cocone $(X,\\delta)$ then yields $[\\delta_j]$ by the coproduct property and factors uniquely through $q$ by the coequalizer property."
