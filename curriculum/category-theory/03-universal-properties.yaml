    knowledge_points:
      - id: kp1
        name: Exponentials via currying in Set
        key_prerequisites: [universal-properties]
        constraints: "State the evaluation-plus-unique-curry universal property; identifications only in $\\mathbf{Set}$ (function sets) or posets with finite meets (Heyting implication)."
        exemplars:
          - problem: "In Set, the exponential $B^A$ is the set of all functions from $A$ to $B$. Take a set $A$ with 3 elements and a set $B$ with 2 elements. Find the number of elements of $B^A$."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In Set the exponential $B^A$ is identified with the set of all functions from $A$ to $B$; this is the identification step of the universal property. A function assigns to each of the 3 elements of $A$ one of the 2 elements of $B$, and by the multiplication principle for independent choices the count is $2^3$. So $B^A$ has 8 elements."
          - problem: "In the poset of divisors of 12, ordered by divisibility, meets are greatest common divisors. This poset has all finite meets, so the exponential $b^a$ exists: it is the greatest divisor $x$ with $\\gcd(x, a)$ dividing $b$. Compute $b^a$ for $a = 4$ and $b = 6$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a poset with finite meets the exponential $b^a$ is the greatest element $x$ whose meet with $a$ lies below $b$; here the meet is $\\gcd(x, a)$ and the order is divisibility. Test each divisor of 12: for 1, 2, 3 and 6 the gcds with 4 are 1, 2, 1 and 2, all dividing 6, while for 4 and 12 the gcd is 4, which does not divide 6. The greatest passing divisor is 6. The answer is 6."
          - problem: "Work in Set. Let $X = \\{1,2,3\\}$, $A = \\{u,v\\}$, $B = \\{0,1\\}$, and let $g: X \\times A \\to B$ be given by $g(1,u)=0$, $g(1,v)=1$, $g(2,u)=1$, $g(2,v)=0$, $g(3,u)=0$, $g(3,v)=1$. Let $\\hat g: X \\to B^A$ be the curry of $g$. Find the number of distinct functions in the image of $\\hat g$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the curry universal property, $\\hat g(x)$ is the function $A \\to B$ with $\\hat g(x)(a) = g(x,a)$ for all $a$ in $A$. Compute the three functions: $\\hat g(1)$ sends $u$ to 0 and $v$ to 1, $\\hat g(2)$ sends $u$ to 1 and $v$ to 0, and $\\hat g(3)$ sends $u$ to 0 and $v$ to 1. Thus $\\hat g(1)$ and $\\hat g(3)$ are the same function, so the image holds exactly 2 functions. The answer is 2."
          - problem: "In a finite chain viewed as a poset category, the meet of two elements is the smaller one, so the exponential $b^a$ is the largest element $x$ with $\\min(x, a) \\le b$. Take the chain $0 < 2 < 5 < 9$. Compute $b^a$ for $a = 2$ and $b = 5$."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a chain the meet is the minimum, so by the definition of the exponential in a poset with finite meets, $b^a$ is the largest $x$ with $\\min(x, a) \\le b$. Since $a = 2$ already lies below $b = 5$, the condition $\\min(x, 2) \\le 5$ holds for every element $x$ of the chain, in particular for the top element 9. The largest such $x$ is the top element. The answer is 9."
          - problem: "A student argues about the size of an exponential in Set. Step 1: in Set, $B^A$ is the set of all functions from $A$ to $B$. Step 2: a function $A \\to B$ picks, for each element of $A$, one element of $B$. Step 3: with $|A| = 4$ and $|B| = 3$ there are $4 \\cdot 3 = 12$ such functions. Step 4: hence $|B^A| = 12$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly identifies the exponential in Set as the function set. Step 2 correctly describes a function as one choice of an element of $B$ for each element of $A$. Step 3 is not valid: the choices are independent, so the multiplication principle gives $|B|^{|A|} = 3^4 = 81$ functions, not the product 12. Step 4 only repeats the count from Step 3 and adds no new error. The first invalid step is Step 3."
          - problem: "Claim: in Set, a map $g: X \\times A \\to B$ has at most one curry. Step 1: suppose $h, k: X \\to B^A$ both satisfy $\\mathrm{ev} \\circ (h \\times 1_A) = g$ and $\\mathrm{ev} \\circ (k \\times 1_A) = g$. Step 2: fix $x$ in $X$; then for every $a$ in $A$, $\\mathrm{ev}(h(x), a) = g(x,a) = \\mathrm{ev}(k(x), a)$. Step 3: therefore $h(x) = k(x)$ for every $x$ in $X$, and so $h = k$. Which hypothesis does Step 3 use?"
            answer: "evaluation sends each pair (f, a) to f(a)"
            answer_contract: {"kind": "label", "options": [["evaluation sends each pair (f, a) to f(a)"], ["g is injective on the product X times A"], ["the set A has exactly one element"], ["X is a subset of the set of functions A to B"]]}
            solution_sketch: "Step 3 needs that evaluation separates functions: if two functions from $A$ to $B$ give equal values at every $a$, then they are the same function, which is exactly the defining property of evaluation in Set. The option about $g$ being injective names an assumption that is neither given nor used anywhere in the argument. The option about $A$ having exactly one element is false in general; the argument works for any set $A$. The option about $X$ being a subset of the function set is irrelevant, since $X$ can be an arbitrary set. The answer is evaluation sends each pair (f, a) to f(a)."
          - problem: "Write the full proof: in Set, the set $B^A$ of all functions $A \\to B$, with evaluation $\\mathrm{ev}(f, a) = f(a)$, satisfies the universal property: every $g: X \\times A \\to B$ has a unique curry $\\hat g: X \\to B^A$ with $\\mathrm{ev} \\circ (\\hat g \\times 1_A) = g$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (construction): given $g: X \\times A \\to B$, define $\\hat g: X \\to B^A$ by $\\hat g(x) = (a \\mapsto g(x, a))$; for each $x$ this is a well-defined function from $A$ to $B$. Step 2 (curry property): for any pair $(x, a)$ in $X \\times A$ we have $\\mathrm{ev}(\\hat g(x), a) = \\hat g(x)(a) = g(x, a)$, hence $\\mathrm{ev} \\circ (\\hat g \\times 1_A) = g$. Step 3 (uniqueness): let $h: X \\to B^A$ be any map with $\\mathrm{ev} \\circ (h \\times 1_A) = g$; then for all $x$ and $a$, $\\mathrm{ev}(h(x), a) = g(x, a) = \\mathrm{ev}(\\hat g(x), a)$, and since evaluation reads off the value of a function at $a$, the functions $h(x)$ and $\\hat g(x)$ agree at every $a$ in $A$, so $h(x) = \\hat g(x)$ for every $x$, hence $h = \\hat g$. Conclusion: $B^A$ together with $\\mathrm{ev}$ satisfies the evaluation-plus-unique-curry universal property, so it is the exponential of $B$ by $A$ in Set."
      - id: kp2
        name: The curry/uncurry bijection is natural
        key_prerequisites: [hom-functors]
        constraints: "Derive the bijection and its naturality from the universal property alone; every identification of two maps must go through the uniqueness of currying."
        exemplars:
          - problem: "Work in the category of sets. Let A = {a1, a2} have two elements, let X = {u, v}, and let B = {1, 2, 3}. Define g: X x A -> B by g(u, a1) = 2, g(u, a2) = 3, g(v, a1) = 3, g(v, a2) = 2. An element of B^A is a map from A to B; identify such a map with the pair (t1, t2) of its values at a1 and a2. The curry of g is the unique map gh: X -> B^A with ev o (gh x 1A) = g, where ev(h, a) = h(a). Give the values of gh at u and at v, each as (t1, t2)."
            answer: "atu = (2, 3); atv = (3, 2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "atu"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "atv"}]}
            solution_sketch: "Curry definition: gh is the unique map with ev o (gh x 1A) = g, by the universal property of the exponential B^A. Evaluate at u: gh(u) is the map A -> B with gh(u)(a1) = g(u, a1) = 2 and gh(u)(a2) = g(u, a2) = 3, so gh(u) is the pair (2, 3). Evaluate at v: gh(v)(a1) = g(v, a1) = 3 and gh(v)(a2) = g(v, a2) = 2, so gh(v) is the pair (3, 2). The answer is atu = (2, 3); atv = (3, 2)."
          - problem: "Work in the category of sets. Let A = {p} be a one-element set, X = {m, n}, B = {0, 1, 2, 3}, and B' = {0, 1}. Define g: X x A -> B by g(m, p) = 3 and g(n, p) = 1. Let k: B -> B' be given by k(0) = 0, k(1) = 1, k(2) = 0, k(3) = 1. Identify an element of B'^A (a map from A to B') with the number it sends p to. Naturality in the target says the curry of the composite k o g equals k^A composed with the curry of g. Give the two values, in this identification, of the curry of the composite k o g at m and n."
            answer: "1, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Composite: (k o g)(m, p) = k(g(m, p)) = k(3) = 1 and (k o g)(n, p) = k(1) = 1, by substituting the values of g into k. Curry: by the universal property of B'^A, the curry is the unique map q: X -> B'^A with ev o (q x 1A) = k o g. Evaluate: q(m)(p) = (k o g)(m, p) = 1 and q(n)(p) = (k o g)(n, p) = 1, so q(m) = 1 and q(n) = 1. The answer is 1, 1."
          - problem: "Work in the category of sets. Let A = {w} be a one-element set, X = {r, t}, X' = {s}, and B = {0, 1}. Let k: X' -> X send s to t, and define g: X x A -> B by g(r, w) = 1 and g(t, w) = 0. Identify an element of B^A (a map from A to B) with the number it sends w to. Let gh: X -> B^A be the curry of g. Naturality in X says the curry of the map obtained from g by precomposing with k x 1A is gh o k. Give the value of this curry at s, in this identification."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Precompose: the composite of g with k x 1A sends (s, w) to g(k(s), w) = g(t, w) = 0. Curry: by the universal property of B^A, the curry is the unique map q: X' -> B^A with ev o (q x 1A) equal to this composite. Evaluate: q(s)(w) = 0, so q(s) is 0 in the identification, and q = gh o k by naturality in X. The answer is 0."
          - problem: "In a poset, seen as a category, the product of two elements is their meet (greatest lower bound), and the exponential b^a is the element characterized by: x <= b^a exactly when the meet of x and a is <= b. This is the poset case of the bijection Hom(X x A, B) = Hom(X, B^A), since both sides mean that the meet of X and A lies below B. Take the poset with elements 0, 1, 2, 3, ordered by 0 < 1 < 3 and 0 < 2 < 3, with 1 and 2 incomparable. Give the element 2^1."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Characterization: x <= 2^1 exactly when the meet of x and 1 is <= 2. Test x = 3: the meet of 3 and 1 is 1, and 1 <= 2 is false because 1 and 2 are incomparable, so 3 <= 2^1 fails. Test x = 2: the meet of 2 and 1 is 0, and 0 <= 2, so 2 <= 2^1 holds and 2 is the largest such element. The answer is 2."
          - problem: "Work in the category of sets. Let A = {c} be a one-element set, X = {d, e, f}, and B = {0, 1, 2}. Let h: X -> B^A be the map whose value at d, e, f sends c to 2, 1, 0 respectively; identify each element of B^A (a map from A to B) with the number it sends c to. Let g: X x A -> B be the uncurry of h, that is ev o (h x 1A), where ev(p, a) = p(a). Currying g gives a new map X -> B^A. Give its value at e, in this identification."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Uncurry: by the defining equation, g(x, c) = ev(h(x), c) = h(x)(c). Values: g(d, c) = 2, g(e, c) = 1, g(f, c) = 0. Curry again: by the universal property, the curry is the unique map q: X -> B^A with ev o (q x 1A) = g; then q(e)(c) = g(e, c) = 1, so q(e) is 1. Since uncurrying followed by currying is the identity, q equals h. The answer is 1."
          - problem: "Let k: X' -> X be a map in a category with exponentials, and let g: X x A -> B have curry gh: X -> B^A, so ev o (gh x 1A) = g. To prove naturality in X, we show that the curry of the map obtained from g by precomposing with k x 1A is gh o k. Step 1: (gh o k) x 1A = (gh x 1A) o (k x 1A). Step 2: ev o ((gh o k) x 1A) = (ev o (gh x 1A)) o (k x 1A). Step 3: (ev o (gh x 1A)) o (k x 1A) = ???. Select the missing line of Step 3."
            answer: "g o (k x 1A)"
            answer_contract: {"kind": "label", "options": [["g o (k x 1A)"], ["(g o k) x 1A"], ["ev o (k x 1A)"], ["g o (1A x k)"]]}
            solution_sketch: "Step 1 is valid: (u o v) x 1A = (u x 1A) o (v x 1A) for any composable u, v. Step 2 is valid: composition is associative. Step 3 replaces ev o (gh x 1A) by g, using the defining equation of the curry. The option (g o k) x 1A is wrong: g o k does not type-check, since k lands in X while g needs a pair in X x A. The option ev o (k x 1A) is wrong: ev expects a pair with an element of B^A, but k x 1A lands in X x A. The option g o (1A x k) is wrong: it precomposes on the A factor, but k acts on the X factor. The answer is g o (k x 1A)."
          - problem: "Write the full proof: in a category with exponentials, for every map k: B -> B' and every map g: X x A -> B, the curry of the composite k o g equals k^A o gh, where gh is the curry of g and k^A is the unique map with ev o (k^A x 1A) = k o ev. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: ev: B^A x A -> B is evaluation, and the curry of a map f: Y x A -> Z is the unique map f-hat: Y -> Z^A with ev o (f-hat x 1A) = f; uniqueness comes from the universal property of the exponential. Step 1: k^A exists and is well defined, because k o ev: B^A x A -> B' is a map of the right shape, so it has a curry, and by definition that curry satisfies ev o (k^A x 1A) = k o ev. Step 2: uncurry k^A o gh and expand with the rule (u o v) x 1A = (u x 1A) o (v x 1A): ev o ((k^A o gh) x 1A) = ev o (k^A x 1A) o (gh x 1A). Step 3: substitute Step 1 and the defining equation of gh: this composite equals (k o ev) o (gh x 1A) = k o (ev o (gh x 1A)) = k o g. Step 4: so k^A o gh satisfies the defining equation of the curry of k o g; since the universal property grants exactly one such map, the curry of k o g is k^A o gh. Conclusion: currying is natural in the target, and together with naturality in X this makes the bijection Hom(X x A, B) = Hom(X, B^A) natural in both variables."
    diagnostic_exemplar:
      problem: "From the universal property of the exponential $B^A$ (evaluation $\\mathrm{ev}\\colon B^A\\times A\\to B$ with unique currying), deduce the bijection $\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$."
      answer: "Currying sends $g\\colon X\\times A\\to B$ to the unique $\\hat g\\colon X\\to B^A$ with $\\mathrm{ev}\\circ(\\hat g\\times 1_A)=g$; uncurrying sends $h\\colon X\\to B^A$ to $\\mathrm{ev}\\circ(h\\times 1_A)$. Uncurrying after currying returns $g$ by the defining equation. Currying after uncurrying returns $h$: $h$ satisfies the defining equation of the curry of $\\mathrm{ev}\\circ(h\\times 1_A)$, and the universal property says there is exactly one such map. So the two operations are mutually inverse, giving the bijection."
      solution_sketch: "Define currying and uncurrying from the universal property and check the two round trips. One direction is just the defining equation of $\\mathrm{ev}$; the other needs the uniqueness clause, which says no other map satisfies that equation."
    anki_seeds:
      - front: "Universal property of the exponential $B^A$?"
        back: "$\\mathrm{ev}\\colon B^A\\times A\\to B$ with: every $g\\colon X\\times A\\to B$ has a unique curry $\\hat g\\colon X\\to B^A$, $\\mathrm{ev}\\circ(\\hat g\\times 1_A)=g$."
        type: basic
      - front: "Exponentials give the natural bijection..."
        back: "$\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$ (currying), i.e. $(-\\times A)\\dashv(-)^A$."
        type: basic

  - id: preservation-reflection-of-limits
    name: Preserving and Reflecting Limits
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: limits-colimits
        weight: 0.5
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: limits-as-cones
        weight: 0.3
      - id: functor-composition-identity
        weight: 0.2
      - id: functors
        weight: 0.2
      # Phase C reconciliation: kp2 proves the free-group functor $F$ fails to preserve
      # binary products, computing $F(\{*\}) = \mathbb{Z}$ and refuting
      # $\mathbb{Z} \cong \mathbb{Z}\times\mathbb{Z}$ — free-groups-presentations kp1.
      - id: free-groups-presentations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The definitions
        key_prerequisites: [limits-colimits]
        constraints: "Distinguish carefully between a hypothesis on $D$ and a hypothesis on $FD$; never assume limits exist."
        exemplars:
          - problem: "Define what it means for a functor $F\\colon\\mathcal{C}\\to\\mathcal{D}$ to preserve, and to reflect, limits of a diagram $D\\colon\\mathcal{J}\\to\\mathcal{C}$."
            answer: "Preserves: $F$ carries every limit cone over $D$ to a limit cone over $FD$. Reflects: if $(L,\\lambda)$ is a cone over $D$ whose image $(FL,F\\lambda)$ is a limit cone over $FD$, then $(L,\\lambda)$ is already a limit cone."
            solution_sketch: "A functor $F$ sends a cone $(L,\\lambda)$ over $D$ to the cone $(FL,F\\lambda)$ over $FD$, since applying $F$ to the leg equations $Df\\circ\\lambda_j=\\lambda_{j'}$ gives $FDf\\circ F\\lambda_j=F\\lambda_{j'}$. $F$ preserves limits of $D$ if it turns limit cones into limit cones. $F$ reflects limits of $D$ if the converse implication holds for cones over $D$: whenever the image cone is universal, the original was. The two conditions are independent — neither implies the other."
          - problem: "Suppose $F$ preserves limits and both $\\lim D$ and $\\lim FD$ exist. What does preservation say about the canonical comparison morphism $F(\\lim D)\\to\\lim(FD)$?"
            answer: "It is an isomorphism."
            solution_sketch: "The image cone $(F\\lim D,F\\lambda)$ is a cone over $FD$, so the universal property of $\\lim FD$ gives a canonical comparison $c\\colon F(\\lim D)\\to\\lim(FD)$ commuting with the legs. If $F$ preserves the limit, then $(F\\lim D,F\\lambda)$ is itself a limit cone over $FD$; two limit cones over the same diagram are uniquely isomorphic by a cone map, and that map is exactly $c$. So preservation is precisely the statement that the canonical comparison is an isomorphism."
      - id: kp2
        name: Examples and non-examples
        key_prerequisites: [functors, free-groups-presentations]
        constraints: "A failure of preservation must be shown with a concrete diagram and a proof that the two objects are non-isomorphic."
        exemplars:
          - problem: "Show the forgetful functor $U\\colon\\mathbf{Grp}\\to\\mathbf{Set}$ preserves binary products and equalizers."
            answer: "$U(G\\times H)=UG\\times UH$ and the equalizer subgroup has the equalizer of the underlying maps as its underlying set."
            solution_sketch: "The product in $\\mathbf{Grp}$ is the direct product $G\\times H$ with componentwise operation and the coordinate projections; its underlying set with the underlying projections is exactly the cartesian product cone in $\\mathbf{Set}$, which is a limit cone. The equalizer of $f,g\\colon G\\to H$ in $\\mathbf{Grp}$ is the subgroup $E=\\{x\\in G: f(x)=g(x)\\}$ with the inclusion; its underlying set is $\\{x\\in UG: Uf(x)=Ug(x)\\}$ with the inclusion, which is the equalizer cone in $\\mathbf{Set}$. So $U$ carries these limit cones to limit cones."
          - problem: "Show the free-group functor $F\\colon\\mathbf{Set}\\to\\mathbf{Grp}$ does not preserve binary products."
            answer: "With $X=Y=\\{*\\}$: $F(X\\times Y)=\\mathbb{Z}$ but $FX\\times FY=\\mathbb{Z}\\times\\mathbb{Z}$, and $\\mathbb{Z}\\not\\cong\\mathbb{Z}\\times\\mathbb{Z}$."
            solution_sketch: "The free group on a one-element set is $\\mathbb{Z}$. Take $X=Y=\\{*\\}$; then $X\\times Y$ is again a one-element set, so $F(X\\times Y)\\cong\\mathbb{Z}$, while $FX\\times FY\\cong\\mathbb{Z}\\times\\mathbb{Z}$. These are not isomorphic: $\\mathbb{Z}$ is cyclic, but if $(a,b)$ generated $\\mathbb{Z}\\times\\mathbb{Z}$ then $(1,0)=n(a,b)$ forces $na=1$ and $nb=0$, so $a=n=\\pm1$ and $b=0$; then every multiple of $(a,0)$ has second coordinate $0$ and $(0,1)$ is not reached. So the comparison map cannot be an isomorphism and $F$ does not preserve binary products — consistent with $F$ being a left adjoint, which preserves colimits rather than limits."
      - id: kp3
        name: Fully faithful functors reflect limits
        key_prerequisites: [full-faithful-functors]
        constraints: "Use fullness to lift a mediating morphism and faithfulness to prove the equations and uniqueness."
        exemplars:
          - problem: "Let P be the divisibility poset on {1, 2, 3, 6, 10, 15, 30} and Q the divisibility poset on {1, 2, 3, 5, 6, 10, 15, 30}. The inclusion F from P to Q is fully faithful, because no relation between elements of P changes in Q, so F reflects limits; a meet of two elements is the limit of the corresponding two-object diagram. Determine the meet of 6 and 10 in P."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Setup: the inclusion F is an order embedding, hence full and faithful on these poset categories, so it reflects limits. Step 1 (compute in the larger poset): the meet of 6 and 10 in Q is their greatest common divisor, which is 2, and 2 = F(2) lies in the image of F. Step 2 (reflect): the cone on 2 with the divisibility legs is a limit cone in Q of the form F(L), so reflection makes the cone on 2 a limit cone in P. Check in P: the common lower bounds of 6 and 10 are 1 and 2, and the greatest is 2. The answer is 2."
          - problem: "Let P be the poset on {n, k, a, b} with relations n <= k, k <= a, k <= b, closed under transitivity, and let Q be the chain 0 <= 1 <= 2. The monotone map F with F(n) = 1, F(k) = 1, F(a) = 1, F(b) = 2 is faithful, since each hom-set of P has at most one morphism, but it is not full, since a and b are not comparable while 1 <= 2. The image of the cone (n; n <= a, n <= b) is a meet cone in Q. Give your verdict on reflection for F and the meet of a and b in P."
            answer: "verdict = fails; meet = k"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["reflects"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "meet"}]}
            solution_sketch: "Setup: the image of the cone (n; n <= a, n <= b) is the cone (1; identity, the arrow 1 to 2), which is the meet of 1 and 2 in the chain Q, hence a limit cone. Failure: in P the cone (k; k <= a, k <= b) has no cone map to the cone on n, because such a map would be a morphism k to n, that is k <= n, which is false. So the image cone is a limit cone while the original is not, and the verdict is not reflects. Meet computation: the common lower bounds of a and b in P are n and k, with n <= k, so the greatest is k. The answer is verdict = fails; meet = k."
          - problem: "Let S = {1, 2, 3, 4, 5}. In FinSet, the category of finite sets, take the maps f and g from S to S, where f sends 1 to 2, 2 to 3, 3 to 4, 4 to 5, 5 to 1, and g sends 1 to 2, 2 to 3, 3 to 5, 4 to 5, 5 to 1. The inclusion F of FinSet into Set is fully faithful, and the equalizer of F(f) and F(g) in Set is the set E of elements x with f(x) = g(x), with its inclusion map. By reflection this cone is an equalizer in FinSet. How many elements does E have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: E = {x in S : f(x) = g(x)}, with the inclusion of E into S as the equalizer cone. Compute pointwise: f(1) = 2 = g(1), f(2) = 3 = g(2), f(3) = 4 while g(3) = 5, f(4) = 5 = g(4), f(5) = 1 = g(5). Reflection rule: F is fully faithful and the equalizer cone in Set has the finite apex E, so the same cone is an equalizer in FinSet. Count the set: E = {1, 2, 4, 5}. The answer is 4."
          - problem: "Let A = {0, 1, 2, 3}, B = {0, 1, 2, 3, 4} and C = {0, 1, 2}. Let f from A to C send 0, 1, 2, 3 to 0, 1, 2, 0 respectively, and let g from B to C send 0, 1, 2, 3, 4 to 1, 1, 2, 0, 2 respectively. The inclusion F of FinSet into Set is fully faithful, and the pullback of F(f) and F(g) in Set is the set of pairs (a, b) with f(a) = g(b), with its two projections. By reflection this cone is a pullback in FinSet. How many elements does this pullback have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the pullback is the set of pairs (a, b) with f(a) = g(b), with the projection maps to A and B. Count by the value of f: f(0) = 0 forces b = 3, one pair; f(1) = 1 allows b in {0, 1}, two pairs; f(2) = 2 allows b in {2, 4}, two pairs; f(3) = 0 forces b = 3, one pair. Reflection rule: F is fully faithful and the pullback cone in Set has a finite apex, so the same cone is a pullback cone in FinSet. Total: 1 + 2 + 2 + 1. The answer is 6."
          - problem: "The category C has objects Y, L, A, B and non-identity morphisms pa from L to A, pb from L to B, qa from Y to A, qb from Y to B, and no other morphisms between distinct objects. The functor F sends every object and morphism of C to its primed copy in the category D. The category D contains these primed copies and one extra morphism u from Y' to L', with the composite of u and the primed pa equal to the primed qa and the composite of u and the primed pb equal to the primed qb. The cone (L', primed pa, primed pb) is a product of A' and B' in D, while F is faithful but not full. How many cone maps from the cone (Y, qa, qb) to the cone (L, pa, pb) does C have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Setup: a cone map from (Y, qa, qb) to (L, pa, pb) is a morphism v from Y to L with the composite pa after v equal to qa and the composite pb after v equal to qb. Count: the hom-set from Y to L in C is empty, because C has no morphisms between Y and L at all. So the cone (Y, qa, qb) has no mediating morphism in C, while in D the extra morphism u mediates for the image cone, which is a product; hence the faithful, non-full functor F does not send limit cones back to limit cones. The answer is 0."
          - problem: "Claim: a fully faithful functor F from C to D preserves limits. Step 1: let (L, lam) be a limit cone over a diagram in C and let (M, mu) be any cone over the image diagram in D. Step 2: by fullness there is an object X in C with F(X) equal to M. Step 3: since M = F(X), fullness lifts each leg mu to a morphism from X, and these lifted legs form a cone over the diagram in C. Step 4: the limit L gives a unique mediating morphism from the lifted cone to (L, lam), F of it mediates for (M, mu), and faithfulness gives uniqueness. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it sets up a limit cone in C and an arbitrary cone over the image diagram in D. Step 2 is the first invalid step: fullness says that every morphism in D between two objects already in the image of F comes from a morphism in C, but it says nothing about objects; the apex M need not be F(X) for any X, for example when F is the inclusion of a full subcategory. Step 3 would follow from fullness if Step 2 were true, so it is not the first failure. Step 4 uses the universal property and faithfulness correctly. The answer is Step 2."
          - problem: "Write the full proof: a fully faithful functor F from C to D reflects limits. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let (L, lambda) be a cone over a diagram in C whose image (F of L, F of lambda) is a limit cone over the image diagram in D; the goal is to show (L, lambda) is a limit cone. Step 1 (mediate in D): for any cone (X, mu) over the diagram in C, its image is a cone over the image diagram, so the universal property gives a unique morphism u from F of X to F of L with each composite F of lambda_j after u equal to F of mu_j. Step 2 (lift by fullness): u = F of v for some morphism v from X to L. Step 3 (equations by faithfulness): F of the composite lambda_j after v equals F of mu_j for every j, and since F is faithful, lambda_j after v equals mu_j, so v is a cone map. Step 4 (uniqueness by faithfulness): if v' is another cone map, then F of v' satisfies the same equations as u, so F of v' = u = F of v by uniqueness of u, and faithfulness gives v' = v. Conclusion: every cone has exactly one cone map to (L, lambda), so (L, lambda) is a limit cone and F reflects limits."
    diagnostic_exemplar:
      problem: "Prove that a fully faithful functor $F\\colon\\mathcal{C}\\to\\mathcal{D}$ reflects limits."
      answer: "Let $(L,\\lambda)$ be a cone over $D$ whose image $(FL,F\\lambda)$ is a limit cone over $FD$, and let $(X,\\mu)$ be any cone over $D$. Then $(FX,F\\mu)$ is a cone over $FD$, so there is a unique $u\\colon FX\\to FL$ with $F\\lambda_j\\circ u=F\\mu_j$ for all $j$. By fullness $u=Fv$ for some $v\\colon X\\to L$; then $F(\\lambda_j\\circ v)=F\\mu_j$ and faithfulness gives $\\lambda_j\\circ v=\\mu_j$, so $v$ is a cone morphism. If $v'$ is another, $Fv'$ satisfies the equations characterizing $u$, so $Fv'=u=Fv$ and faithfulness gives $v'=v$. Hence $(L,\\lambda)$ is a limit cone."
      solution_sketch: "Transport an arbitrary cone over $D$ down into $\\mathcal D$ and mediate there, then lift the mediating map back with fullness and verify its leg equations with faithfulness. Uniqueness downstairs comes from uniqueness upstairs plus faithfulness once more."
    anki_seeds:
      - front: "A functor preserves limits when..."
        back: "it sends limit cones to limit cones (the canonical comparison is an isomorphism)."
        type: basic
      - front: "A functor reflects limits when..."
        back: "a cone whose image is a limit cone must already have been a limit cone."
        type: basic
      - front: "Fully faithful functors {{c1::reflect}} limits."
        back: "reflect"
        type: cloze

  - id: complete-categories
    name: Complete and Cocomplete Categories
    core: false                # terminal classification of categories by limit existence
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: limits-colimits
        weight: 0.5
        key: true
      - id: equalizers-coequalizers
        weight: 0.4
        key: true
      - id: initial-terminal-as-limits
        weight: 0.3
      - id: products-coproducts
        weight: 0.3
      - id: pullbacks-pushouts
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Definitions
        key_prerequisites: [limits-colimits]
        constraints: "Definitions plus the poset case: completeness of a poset category is equated with being a complete lattice via limits-as-infima."
        exemplars:
          - problem: "Recall that a category is complete when every diagram from a small category into it has a limit. Work in the poset category whose objects are the positive divisors of 12, ordered by divisibility. Take the diagram whose objects are 4 and 6 and whose only arrows are identities. Give the limit of this diagram as a single number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object set is the divisors of 12, namely 1, 2, 3, 4, 6, 12. Rule: in a poset category the limit of a diagram is the infimum, the greatest lower bound, of its object set. The lower bounds of 4 and 6 are their common divisors inside the set, which are 1 and 2. The greatest of these is 2, and since 2 divides both 4 and 6 it carries the limit cone. The answer is 2."
          - problem: "A category is cocomplete when every small diagram into it has a colimit, and in a poset category colimits are suprema. Work in the poset category whose objects are the positive divisors of 30, ordered by divisibility. Take the diagram whose objects are 6 and 10 and whose only arrows are identities. Give the colimit of this diagram as a single number."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object set is the divisors of 30, namely 1, 2, 3, 5, 6, 10, 15, 30. Rule: in a poset category the colimit of a diagram is the supremum, the least upper bound, of its object set. The upper bounds of 6 and 10 are their common multiples inside the set, and 30 is the only one. The least upper bound is therefore 30, the top of this divisor lattice. The answer is 30."
          - problem: "A limit of the empty diagram is a terminal object of the category, and completeness requires this limit too. Work in the poset category whose objects are the positive divisors of 36, ordered by divisibility. Give the limit of the empty diagram as a single number."
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object set is the divisors of 36, namely 1, 2, 3, 4, 6, 9, 12, 18, 36. Rule: a limit of the empty diagram is a terminal object, and in a poset category ordered by divisibility the terminal object is the greatest element, the one that every object divides. Every divisor of 36 divides 36, and no element of the set lies above 36. So 36 is the terminal object and the limit of the empty diagram. The answer is 36."
          - problem: "Consider the finite poset P whose elements are 2, 3, 4 and 12, ordered by divisibility, and note that 1 is not an element of P. In the poset category a limit over a subset is its infimum, so P would give a complete lattice only if every subset had an infimum inside P. How many of the two-element subsets of P have no infimum in P?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full list of two-element subsets of P is 2 with 3, 2 with 4, 2 with 12, 3 with 4, 3 with 12, and 4 with 12. Rule: in a poset category the limit over a subset is its infimum, which must be a greatest common divisor lying inside P. The pairs 2 with 4, 2 with 12, 3 with 12 and 4 with 12 have infima 2, 2, 3 and 4. The pairs 2 with 3 and 3 with 4 have no common divisor inside P, since 1 is missing, so they have no infimum and P is not a complete lattice. The answer is 2."
          - problem: "Claim: a finite poset in which every pair of elements has an infimum is a complete lattice, so its poset category is complete. Step 1: in a poset category, limits are infima, so completeness means every subset has an infimum. Step 2: for a nonempty subset, take its elements one at a time and combine them with the pairwise infima; the final value is the infimum of the subset. Step 3: the empty subset has the least element of the poset as its infimum, and this least element exists because the poset is finite. Step 4: every subset has an infimum, so the poset is a complete lattice and its category is complete. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: limits in a poset category are infima of object sets. Step 2 is valid: pairwise infima combined one at a time over a finite nonempty subset give the infimum of the whole subset. Step 3 is the first invalid step: the infimum of the empty subset is the greatest element of the poset, not the least, and a finite poset with pairwise infima, such as 1, 2, 3 ordered by divisibility, need not have a greatest element, so the empty limit can fail. Step 4 inherits the error, since it rests on the faulty Step 3. The answer is Step 3."
          - problem: "In the proof that a poset, viewed as a category, is complete exactly when it is a complete lattice, a student must justify one missing line about the limit cone. Let S be a subset of the poset and let m be the infimum of S, so that m is the proposed limit of the diagram whose object set is S. Select the line that must hold for every element s of S."
            answer: "m <= s"
            answer_contract: {"kind": "label", "options": [["m <= s"], ["s <= m"], ["m < s"], ["m = s"]]}
            solution_sketch: "A cone over the diagram with object set S and vertex m assigns to each element s of S an arrow from m to s, and in a poset category that arrow means m is below s. Rule: the limit cone condition is that m is a lower bound, that is m <= s for every element s of S, and the universal property then makes m the greatest lower bound, the infimum. The option s <= m makes m an upper bound, which is the colimit side. The option m < s is too strong and fails when m itself lies in S. The option m = s can hold only for a one-element subset. The answer is m <= s."
          - problem: "Write the full proof: a poset, viewed as a category, has all small limits exactly when it is a complete lattice. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (diagrams carry no arrow data): a diagram D from a small category into a poset category P sends arrows to arrows, but P has at most one arrow between any two objects, so D is determined by its object set S. Step 2 (limits are infima): a cone over D with vertex c is an element of P below every object of S, that is a lower bound of S, and the universal property of the limit says c is the greatest lower bound; so a limit of D exists exactly when inf S exists, and then the limit is inf S. Step 3 (only if direction): if P is complete, every small diagram has a limit, so every subset S has an infimum in P, including the empty set, whose infimum is the greatest element of P; hence P is a complete lattice. Step 4 (if direction): if P is a complete lattice, every subset S has an infimum, so every small diagram D has a limit, namely the infimum of its object set; hence P is complete. Conclusion: a poset category is complete exactly when the poset is a complete lattice."
      - id: kp2
        name: Completeness from products and equalizers
        key_prerequisites: [equalizers-coequalizers]
        constraints: "The two-products-and-an-equalizer construction, with the two parallel maps written out componentwise; applications limited to $\\mathbf{Grp}$ or $\\mathbf{Set}$."
        exemplars:
          - problem: "Prove that a category with all small products and all equalizers is complete."
            answer: "Realize each limit as an equalizer of two maps between products."
            solution_sketch: "For $D\\colon\\mathcal J\\to\\mathcal C$ ($\\mathcal J$ small), form $\\prod_{j}Dj$ and $\\prod_{(f\\colon j\\to j')}Dj'$. Two maps $\\prod_j Dj\\rightrightarrows\\prod_f Dj'$ are given by $u=(\\,\\pi_{j'})_f$ and $v=(\\,Df\\circ\\pi_j)_f$. Their equalizer $L$ consists exactly of the tuples $(x_j)$ with $Df(x_j)=x_{j'}$ for all $f$, i.e. the cones over $D$; so $L$ with projections is the limit. Hence small products + equalizers $\\Rightarrow$ complete (dually, coproducts + coequalizers $\\Rightarrow$ cocomplete)."
          - problem: "Use the products-and-equalizers criterion to prove $\\mathbf{Grp}$ is complete."
            answer: "$\\mathbf{Grp}$ has all small products (direct products) and all equalizers (equalizer subgroups), hence all small limits."
            solution_sketch: "The direct product $\\prod_i G_i$ with componentwise operations is the product in $\\mathbf{Grp}$, so all small products exist. The equalizer of $f,g\\colon G\\to H$ is the subgroup $\\{x\\in G: f(x)=g(x)\\}$ with inclusion, so all equalizers exist. By the theorem 'small products $+$ equalizers $\\Rightarrow$ complete', every small diagram of groups has a limit — concretely the subgroup of $\\prod_j G_j$ of compatible families. Hence $\\mathbf{Grp}$ is complete."
      - id: kp3
        name: Finite completeness from a terminal object and pullbacks
        key_prerequisites: [pullbacks-pushouts]
        constraints: "Reduce each finite (co)limit to the given primitives, exhibiting binary (co)products and (co)equalizers as specific pullbacks/pushouts; the dual statement is obtained by working in $\\mathcal C^{op}$."
        exemplars:
          - problem: "Show a category with a terminal object and all pullbacks has all finite limits."
            answer: "Terminal = empty limit; binary products and equalizers are pullbacks."
            solution_sketch: "The terminal object is the empty limit. Binary products are pullbacks over the terminal object: $A\\times B=A\\times_1 B$. Equalizers of $f,g\\colon A\\to B$ are obtained as the pullback of $(1_A,f),(1_A,g)\\colon A\\to A\\times B$ (equivalently, of the diagonal $B\\to B\\times B$ along $(f,g)$). With finite products and equalizers present, the product-and-equalizer construction yields all finite limits. So terminal + pullbacks $\\Rightarrow$ finitely complete."
          - problem: "Show, dually, that a category with an initial object and all pushouts has all finite colimits."
            answer: "Initial = empty colimit; binary coproducts and coequalizers are pushouts."
            solution_sketch: "Dualize the terminal-plus-pullbacks argument (work in $\\mathcal C^{op}$). The initial object is the empty colimit. Binary coproducts are pushouts over the initial object: $A+B=A+_0 B$. The coequalizer of $f,g\\colon A\\to B$ is the pushout of the codiagonal $\\nabla_A=[1_A,1_A]\\colon A+A\\to A$ along $[f,g]\\colon A+A\\to B$, dual to realizing an equalizer as a pullback of the diagonal. With finite coproducts and coequalizers present, the coproduct-and-coequalizer construction yields all finite colimits. Hence initial object $+$ pushouts $\\Rightarrow$ finitely cocomplete."
    diagnostic_exemplar:
      problem: "Prove the dual of the products-and-equalizers criterion: a category $\\mathcal C$ with all small coproducts and all coequalizers is cocomplete. Construct the colimit of an arbitrary small diagram $D\\colon\\mathcal J\\to\\mathcal C$ as a coequalizer of two maps between coproducts, and verify its universal property."
      answer: "Form $\\coprod_j Dj$ (over the objects of $\\mathcal J$) and $\\coprod_{f\\colon j\\to j'}Dj$ (over the morphisms), and let $u,v\\colon\\coprod_f Dj\\rightrightarrows\\coprod_j Dj$ be the maps whose components on the summand indexed by $f\\colon j\\to j'$ are $\\iota_j$ and $\\iota_{j'}\\circ Df$ respectively. Let $q\\colon\\coprod_j Dj\\to Q$ be their coequalizer and set $\\gamma_j=q\\circ\\iota_j$. Then $q u=q v$ says precisely $\\gamma_j=\\gamma_{j'}\\circ Df$ for every $f\\colon j\\to j'$, so $(Q,\\gamma)$ is a cocone under $D$. Given any cocone $(X,\\delta)$, the coproduct's universal property gives $[\\delta_j]\\colon\\coprod_j Dj\\to X$, and the cocone condition $\\delta_j=\\delta_{j'}\\circ Df$ says exactly $[\\delta_j]u=[\\delta_j]v$; the coequalizer's universal property therefore factors $[\\delta_j]$ through $q$ by a unique $w\\colon Q\\to X$, and $w\\gamma_j=w q\\iota_j=[\\delta_j]\\iota_j=\\delta_j$. Any other cocone map $w'$ satisfies $w'q\\iota_j=\\delta_j$ for all $j$, hence $w'q=[\\delta_j]$, hence $w'=w$ by uniqueness of the factorisation. So $(Q,\\gamma)$ is $\\mathrm{colim}\\,D$, and every small colimit exists: $\\mathcal C$ is cocomplete."
      solution_sketch: "Build the colimit as a coequalizer of two maps $\\coprod_{f}Dj\\rightrightarrows\\coprod_j Dj$ — one component $\\iota_j$, the other $\\iota_{j'}\\circ Df$ — chosen so that the equation $qu=qv$ says exactly that the legs form a cocone. Any cocone $(X,\\delta)$ then yields $[\\delta_j]$ by the coproduct property and factors uniquely through $q$ by the coequalizer property."
    anki_seeds:
      - front: "A category is complete when..."
        back: "it has all small limits."
        type: basic
      - front: "A category is cocomplete when..."
        back: "it has all small colimits."
        type: basic
      - front: "A category is complete iff it has all small {{c1::products}} and all {{c2::equalizers}}."
        back: "products; equalizers"
        type: cloze
