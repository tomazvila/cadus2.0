            answer: "(0, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The limit L is the set of compatible families: triples (a, c, b) with a in A, c in C, b in B whose images in C agree; compatibility is automatic here because C has a single element. Rule of the universal property: the mediating map sends each x to the family of its leg values, so u(8) has A-coordinate mu_A(8) = 0 and B-coordinate mu_B(8) = 2. The answer is (0, 2)."
          - problem: "In Set, let D be the cospan A -> C <- B where A = {0, 1, 2}, B = {0, 1} and C = {4}, with the only possible maps. Use the compatible-families formula to compute the limit of D. How many elements does the limit have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A compatible family is a choice of a in A, c in C and b in B whose images in C agree. Rule: since C has a single element, every pair (a, b) is compatible and the middle coordinate c is forced, so the limit is the full product of A and B. Its size is 3 times 2 = 6. The answer is 6."
          - problem: "In Set, let D be the parallel pair of maps f, g: A -> B with A = {0, 1, 2, 3} and B = {0, 1}, where f sends 0 and 1 to 0 and sends 2 and 3 to 1, while g sends 0 to 0, sends 1 to 1, sends 2 to 1 and sends 3 to 0. Use the compatible-families formula to compute the limit of D. Give the elements of the limit in increasing order."
            answer: "0, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "For a parallel pair, the limit is the set of elements a in A with f(a) = g(a), with the inclusion leg. Check each element by the compatibility rule: f(0) = 0 = g(0); f(1) = 0 but g(1) = 1; f(2) = 1 = g(2); f(3) = 1 but g(3) = 0. The compatible elements are 0 and 2. The answer is 0, 2."
          - problem: "In Set, let D be the cospan A -> C <- B with A = {0, 1, 2, 3}, C = {0, 1} and B = {0, 1, 2}. The map from A to C sends 0, 1 and 2 to 0 and sends 3 to 1; the map from B to C sends 0 to 0 and sends 1 and 2 to 1. Use the compatible-families formula to compute the limit of D. Find the number of elements in the limit."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit is the set of compatible pairs (a, b) with f(a) = g(b), with the two projection legs. Count by the compatibility rule, fixing b: b = 0 has g(b) = 0, and three elements a of A map to 0; b = 1 and b = 2 have g(b) = 1, and only a = 3 maps to 1. The total count is 3 + 1 + 1. The answer is 5."
          - problem: "Claim: for every cone (X, mu) over a diagram D from a small index category to Set, the map u: X -> lim D defined by u(x) = (mu_j(x))_j is the unique cone morphism. Step 1: each value mu_j(x) lies in D(j), so the family (mu_j(x))_j lies in the product of all the sets D(j). Step 2: the cone condition gives D(f)(mu_j(x)) = mu_j'(x) for every arrow f from j to j', so the family is compatible and u(x) lies in lim D. Step 3: the projection legs satisfy lambda_j(u(x)) = mu_j(x) for every j, so each leg composed with u equals the matching cone leg. Step 4: if a map v from X to lim D satisfies lambda_j v = mu_j for at least one object j, then v equals u. Step 5: therefore u is unique and lim D is the universal cone. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 correctly states membership in the product. Step 2 applies the cone condition correctly to get compatibility. Step 3 holds because the j-th coordinate of u(x) is exactly mu_j(x). Step 4 is invalid: agreement of one single coordinate does not force v = u; uniqueness needs the equations for every object j, since only then is every coordinate of v(x) fixed. Step 5 is a valid conclusion once Step 4 is corrected. The answer is Step 4."
          - problem: "A student proves that the pullback of maps f: A -> C and g: B -> C in Set is the limit of the cospan A -> C <- B. Step 1: a cone from a set X is a pair of maps m1: X -> A and m2: X -> B with f m1 = g m2. Step 2: let P be the set of pairs (a, b) in A x B with f(a) = g(b), with legs p1(a, b) = a and p2(a, b) = b. Step 3: define u: X -> P by u(x) = (m1(x), m2(x)). Step 4: the line is missing. Step 5: hence u is the unique cone morphism from X to P, so P is the limit. Select the line for Step 4 that makes the proof valid."
            answer: "u(x) lies in P, and p1 u = m1 and p2 u = m2, so u is unique"
            answer_contract: {"kind": "label", "options": [["u(x) lies in P, and p1 u = m1 and p2 u = m2, so u is unique"], ["u(x) = (m2(x), m1(x)), so the legs of P are swapped"], ["p1 u = m1 for at least one x, which is enough here"], ["the cone condition forces m1 = m2, so u(x) = m1(x)"]]}
            solution_sketch: "The full object is P, the set of pairs (a, b) with f(a) = g(b). Rule of the cone condition: f m1 = g m2 shows that u(x) = (m1(x), m2(x)) satisfies the membership condition of P, and then p1 u = m1 and p2 u = m2, which fix both coordinates of u(x) and give uniqueness. The option with swapped coordinates assigns the legs to the wrong components. The option about one single x confuses one pointwise check with the universal property. The option claiming m1 = m2 asserts an equality that the cone condition never gives. The answer is u(x) lies in P, and p1 u = m1 and p2 u = m2, so u is unique."
          - problem: "Write the full proof: in Set, the set of compatible families of a small diagram D, with the projection legs, is the limit of D. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the cone): let L be the set of all families (x_j) with x_j in D(j) for every object j and D(f)(x_j) = x_j' for every arrow f from j to j', and let lambda_j send (x_j) to x_j; the compatibility condition is exactly the cone condition, so (L, lambda) is a cone over D. Step 2 (the mediating map): given any cone (X, mu), define u: X -> L by u(x) = (mu_j(x))_j; the cone condition for (X, mu) says D(f)(mu_j(x)) = mu_j'(x), so u(x) is compatible and lies in L, and lambda_j u = mu_j for every j. Step 3 (uniqueness): if v: X -> L also satisfies lambda_j v = mu_j for every j, then the j-th coordinate of v(x) equals mu_j(x) for every j, so v(x) = u(x) for all x, hence v = u. Conclusion: every cone admits exactly one mediating map, so (L, lambda) is the universal cone and L is the limit of D in Set."
