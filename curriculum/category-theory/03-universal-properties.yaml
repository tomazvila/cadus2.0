          - problem: "Obtain the coproduct comparison-map condition by dualizing the product universal property. In Set, A and B are each {0,1}. Compare Q={0,1}, with both proposed injections the identity, and T={0,1,2,3}, with injection lists [0,1] and [2,3]. For f:A->{0,1} with list [0,1] and g:B->{0,1} with list [1,0], construct all comparison maps from Q and T. Give the number from Q, then the value list of the unique one from T, then 1 if T with these injections satisfies the coproduct property for arbitrary target sets and legs, or 0 otherwise. The needed equations are not supplied."
