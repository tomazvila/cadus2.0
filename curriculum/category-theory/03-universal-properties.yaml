        constraints: "Require the learner to use computing a limit cone in set. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: 'In $\mathbf{Set}$, let $D$ be the parallel pair $f,g\colon A\to B$ with $A=\{1,2,3,4\}$, $B=\{5,6\}$, $f(1)=5$, $f(2)=6$, $f(3)=5$, $f(4)=6$, and $g(1)=5$, $g(2)=5$, $g(3)=5$, $g(4)=6$. Find the limit of $D$, taking its apex to be a subset of $A$.'
            answer: '1, 3, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of a parallel pair is the set of elements of $A$ on which $f$ and $g$ agree, with the inclusion into $A$ as one leg. Test each element: $f(1)=5=g(1)$, $f(2)=6$ but $g(2)=5$, $f(3)=5=g(3)$ and $f(4)=6=g(4)$. So the limit is $\{1,3,4\}$.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the cospan $A\xrightarrow{f}B\xleftarrow{g}C$ with $A=\{1,2,3,4\}$, $C=\{5,6\}$, $B=\{7,8\}$, $f(1)=7$, $f(2)=8$, $f(3)=7$, $f(4)=8$, and $g(5)=8$, $g(6)=7$. How many elements does the limit of $D$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of a cospan consists of the pairs $(u,v)$ with $u\in A$, $v\in C$ and $f(u)=g(v)$. For $v=5$ we have $g(5)=8$, and $f(u)=8$ for $u=2$ and $u=4$, which gives $2$ pairs. For $v=6$ we have $g(6)=7$, and $f(u)=7$ for $u=1$ and $u=3$, which gives $2$ more pairs. The limit has $2+2=4$ elements.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the cospan $A\xrightarrow{f}B\xleftarrow{g}C$ with $A=\{1,2,3\}$, $C=\{4\}$, $B=\{5,6\}$, $f(1)=5$, $f(2)=6$, $f(3)=5$, and $g(4)=6$. Take the elements of the limit of $D$ to be pairs $(u,v)$ with $u\in A$ and $v\in C$. The limit has exactly one element. What is it?'
            answer: '(2, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A pair $(u,v)$ belongs to the limit when $f(u)=g(v)$. Since $C=\{4\}$ and $g(4)=6$, we need $f(u)=6$. Only $u=2$ has $f(2)=6$, because $f(1)=5$ and $f(3)=5$. So the only element is $(2,4)$.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the diagram of three parallel maps $f,g,h\colon A\to B$ with $A=\{1,2,3,4,5\}$, $B=\{7,8\}$, $f(1)=7$, $f(2)=7$, $f(3)=8$, $f(4)=8$, $f(5)=7$, $g(1)=7$, $g(2)=8$, $g(3)=8$, $g(4)=8$, $g(5)=8$, and $h(1)=7$, $h(2)=8$, $h(3)=7$, $h(4)=8$, $h(5)=8$. Find the limit of $D$, taking its apex to be a subset of $A$.'
            answer: '1, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With several parallel maps, the limit is the set of elements of $A$ on which all the maps agree. Element $1$ gives the values $7$, $7$, $7$, so it is in. Element $2$ gives $7$, $8$, $8$, element $3$ gives $8$, $8$, $7$ and element $5$ gives $7$, $8$, $8$, so they are out. Element $4$ gives $8$, $8$, $8$, so it is in. The limit is $\{1,4\}$.'
          - problem: 'Four leaders and five followers at a dance come from three schools $a$, $b$ and $c$. Leaders $1$ and $2$ come from school $a$, leader $3$ from school $b$ and leader $4$ from school $c$. Follower $5$ comes from school $a$, followers $6$, $7$ and $8$ from school $b$ and follower $9$ from school $c$. Let $f$ send each leader to a school and $g$ send each follower to a school. How many elements does the limit of the cospan $\mathrm{Leaders}\xrightarrow{f}\mathrm{Schools}\xleftarrow{g}\mathrm{Followers}$ in $\mathbf{Set}$ have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of the cospan is the set of pairs (leader, follower) with the same school. School $a$ gives $2\cdot 1=2$ pairs, school $b$ gives $1\cdot 3=3$ pairs and school $c$ gives $1\cdot 1=1$ pair. The limit has $2+3+1=6$ elements.'
          - problem: 'Three clerks each mark six applications, numbered $1$ to $6$, as accepted or rejected. Clerk $f$ accepts applications $1$, $4$ and $5$. Clerk $g$ accepts applications $1$, $5$ and $6$. Clerk $h$ accepts applications $1$, $3$ and $5$. Each clerk rejects all other applications. The three markings are maps $f,g,h$ from the applications to $\{\text{accepted},\text{rejected}\}$. How many elements does the limit of this parallel triple in $\mathbf{Set}$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of parallel maps is the set of applications on which all three maps agree. Applications $1$ and $5$ are accepted by all three clerks, and application $2$ is rejected by all three. Application $3$ is accepted only by $h$, application $4$ only by $f$ and application $6$ only by $g$, so they are out. The limit is $\{1,2,5\}$, which has $3$ elements.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the diagram $A\xrightarrow{f}B$ together with two parallel maps $g,h\colon B\to C$, where $A=\{0,1,2,3\}$, $B=\{0,1,2\}$, $C=\{0,1\}$, $f(0)=0$, $f(1)=1$, $f(2)=2$, $f(3)=1$, $g(0)=0$, $g(1)=0$, $g(2)=1$, and $h(0)=0$, $h(1)=1$, $h(2)=1$. Find the limit of $D$, taking its apex to be a subset of $A$.'
            answer: '0, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone has legs $\lambda_A$, $\lambda_B=f\circ\lambda_A$ and $\lambda_C=g\circ\lambda_B=h\circ\lambda_B$. So the condition on $\lambda_A$ is $g(f(a))=h(f(a))$. Test each $a$: $a=0$ gives $g(0)=0=h(0)$, $a=1$ gives $g(1)=0$ but $h(1)=1$, $a=2$ gives $g(2)=1=h(2)$, and $a=3$ gives $f(3)=1$ and again $g(1)\ne h(1)$. The limit is $\{0,2\}$.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the cospan $A\xrightarrow{f}B\xleftarrow{g}C$ with $B=\{p,q\}$. The map $f$ sends $3$ elements of $A$ to $p$ and $5$ elements of $A$ to $q$. The map $g$ sends $k$ elements of $C$ to $p$ and $2$ elements of $C$ to $q$. The limit of $D$ has $19$ elements. Find $k$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit has one element for each pair $(u,v)$ with $f(u)=g(v)$. Pairs over $p$ number $3k$ and pairs over $q$ number $5\cdot 2=10$, so $3k+10=19$. Then $3k=9$ and $k=9/3=3$.'
          - problem: 'Write the full proof that, for two functions $f,g\colon A\to B$ in $\mathbf{Set}$, the set $L=\{x\in A: f(x)=g(x)\}$ with the inclusion leg $L\to A$ and the induced leg $L\to B$ is a limit of the parallel pair $f,g$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (cone): by the definition of $L$, $f(i(x))=g(i(x))$ for every $x\in L$, where $i$ is the inclusion, so taking the leg to $B$ to be $f$ restricted to $L$ gives a cone over the parallel pair. Step 2 (cone map): let $(X,\alpha,\beta)$ be any cone, so $f\circ\alpha=\beta$ and $g\circ\alpha=\beta$; hence $f(\alpha(x))=g(\alpha(x))$ for every $x\in X$, which means $\alpha(x)$ lies in $L$. Step 3 (factorization): define $u\colon X\to L$ by $u(x)=\alpha(x)$; then $i\circ u=\alpha$, and the leg to $B$ composed with $u$ equals $f\circ\alpha=\beta$, so $u$ is a cone map. Step 4 (uniqueness): if $u''$ also satisfies $i\circ u''=\alpha$, then $u''=u$ because $i$ is injective, so the factorization is unique. Step 5 (conclusion): every cone over the parallel pair factors uniquely through $(L,i,f|_L)$, which is exactly the universal property, so $L$ with these legs is a limit.'
      - id: kp2
        name: Recovering the special cases from the shape
        key_prerequisites: [products-coproducts]
        constraints: "Recover products, equalizers, pullbacks and chain limits from the shape of a diagram and its cone equations. Concrete calculations and proofs of the shape identification are in scope. Closed items may construct the categorical object or diagnose assertions whose validity the learner must determine; the unmarked item asks for a full proof. Candidate claims must not be endorsed or explained by the stem."
        exemplars:
          - problem: 'Let $D$ be a diagram with three objects $0$, $1$, $2$ and exactly two non-identity arrows, $a\colon 0\to 1$ and $b\colon 2\to 1$. Which familiar construction is the limit of $D$?'
            answer: 'pullback'
            answer_contract: {"kind": "label", "options": [["pullback", "a pullback", "the pullback", "fiber product"], ["equalizer", "an equalizer", "the equalizer"], ["product", "a product", "the product", "binary product"], ["terminal object", "a terminal object", "terminal"]]}
            solution_sketch: 'A cone over $D$ has legs $\lambda_0$, $\lambda_1$, $\lambda_2$ with $a\circ\lambda_0=\lambda_1$ and $b\circ\lambda_2=\lambda_1$. Eliminating $\lambda_1$ leaves the single condition $a\circ\lambda_0=b\circ\lambda_2$ on a pair of legs. A universal pair of legs with that condition is a pullback.'
          - problem: 'A restaurant offers $3$ starters, $4$ mains and $2$ desserts. How many elements does the limit of the discrete diagram of these three sets in $\mathbf{Set}$ have?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of a discrete diagram is the product of the sets, with the projections as legs. Its elements are the triples (starter, main, dessert), that is, the complete meals. There are $3\cdot 4\cdot 2=24$ of them.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the span $D_1\xleftarrow{a}D_0\xrightarrow{b}D_2$ with $D_0=\{1,2,3,4\}$, $D_1=\{5,6\}$, $D_2=\{7,8,9\}$, $a(1)=5$, $a(2)=6$, $a(3)=5$, $a(4)=6$, and $b(1)=7$, $b(2)=8$, $b(3)=9$, $b(4)=7$. How many elements does the limit of $D$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone has legs $\lambda_0$, $\lambda_1=a\circ\lambda_0$ and $\lambda_2=b\circ\lambda_0$, so the cone is determined by its leg $\lambda_0$ alone. The universal cone is therefore $D_0$ with the legs $\mathrm{id}$, $a$ and $b$. The limit has as many elements as $D_0$, which is $4$.'
          - problem: 'How many elements does the limit of the empty diagram in $\mathbf{Set}$ have?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone over the empty diagram has no legs and no conditions, so every set $X$ is a cone and every function is a morphism of cones. The limit must receive exactly one function from every set. Only a one-point set does that, so the limit has $1$ element.'
          - problem: 'Let $D$ be a diagram with two objects $0$ and $1$ and exactly two non-identity arrows, $a,b\colon 0\to 1$. Which familiar construction is the limit of $D$?'
            answer: 'equalizer'
            answer_contract: {"kind": "label", "options": [["pullback", "a pullback", "the pullback", "fiber product"], ["equalizer", "an equalizer", "the equalizer"], ["product", "a product", "the product", "binary product"], ["terminal object", "a terminal object", "terminal"]]}
            solution_sketch: 'A cone over $D$ has legs $\lambda_0$ and $\lambda_1$ with $a\circ\lambda_0=\lambda_1$ and $b\circ\lambda_0=\lambda_1$. So $\lambda_1$ is determined by $\lambda_0$, and the single remaining condition is $a\circ\lambda_0=b\circ\lambda_0$. A universal leg with that condition is an equalizer.'
          - problem: 'Eight households answered the same survey in January and again in February, choosing one of the options $x$, $y$, $z$. In January, households $1$, $4$ and $7$ chose $x$, households $2$, $5$ and $8$ chose $y$, and households $3$ and $6$ chose $z$. In February, households $1$, $6$ and $7$ chose $x$, households $4$, $5$ and $8$ chose $y$, and households $2$ and $3$ chose $z$. Let $f$ and $g$ be the two answer maps from the households to $\{x,y,z\}$. How many elements does the limit of the parallel pair $f,g$ in $\mathbf{Set}$ have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of a parallel pair is the set of households on which $f$ and $g$ agree. Households $1$, $3$, $5$, $7$ and $8$ gave the same answer both times. Households $2$, $4$ and $6$ changed their answer. The limit has $5$ elements.'
          - problem: 'Sam says that the limit of a span $D_1\leftarrow D_0\to D_2$ in $\mathbf{Set}$ is a product, so it has $|D_1|\cdot|D_2|$ elements. For a span with $|D_0|=5$, $|D_1|=2$ and $|D_2|=4$ Sam gets $8$. How many elements does the limit really have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam''s product formula is the limit of the discrete diagram on $D_1$ and $D_2$, not of a span. For a span, every cone is determined by its leg $\lambda_0$ into $D_0$, since the other two legs are $a\circ\lambda_0$ and $b\circ\lambda_0$. So the limit is $D_0$ itself and it has $5$ elements.'
          - problem: 'Write the full proof that, for two parallel functions $f,g\colon A\to B$ in $\mathbf{Set}$, a limiting cone of the diagram consisting of $A$, $B$, $f$ and $g$ has the equalizer $\{a\in A: f(a)=g(a)\}$ as its apex.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'A cone with apex $X$ has legs $u\colon X\to A$ and $v\colon X\to B$. The two generating arrows force $f\circ u=v$ and $g\circ u=v$, so precisely the condition $f\circ u=g\circ u$ remains, with $v$ determined. Let $E$ be the subset of $A$ consisting of the elements $a$ with $f(a)=g(a)$, and let $e\colon E\to A$ be the inclusion. The other leg is $f\circ e$, which equals $g\circ e$. For any cone, $u(x)$ lies in $E$ for every $x$, giving a function $h\colon X\to E$ with $e\circ h=u$. Its other required triangle commutes because $v=f\circ u$. Since $e$ is an inclusion, $h$ is the only such function. This proves the limiting property and identifies the limit as the equalizer of $f$ and $g$.'
      - id: kp3
        name: The universal property of a limit cone
        key_prerequisites: [cones-and-cocones]
        try_first:
          problem: 'In $\mathbf{Set}$, how many different cones over the discrete diagram on $A=\{0,1\}$ and $B=\{0,1,2\}$ have a one-point apex?'
          answer_contract: {"kind": "exact"}
          answer: '6'
          reveal: 'A cone is a pair of legs, one point of $A$ and one point of $B$, so there are $2\cdot 3=6$. The product $A\times B$ has the same $6$ elements, and the universal property says that cones with apex $X$ correspond one-to-one to maps $X\to A\times B$.'
        constraints: "Require the learner to use the universal property of a limit cone. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: 'In $\mathbf{Set}$, the limit of the discrete diagram on $A=\{1,2\}$ and $B=\{3,4\}$ is the product $A\times B$ with projections $p$ and $q$. A cone over the diagram with apex $X=\{5\}$ has legs $r\colon X\to A$ and $s\colon X\to B$ with $r(5)=2$ and $s(5)=3$. The mediating map $u\colon X\to A\times B$ satisfies $p\circ u=r$ and $q\circ u=s$. What is $u(5)$?'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The mediating map must commute with every leg, so $p(u(5))=r(5)=2$ and $q(u(5))=s(5)=3$. These two equations fix both coordinates of $u(5)$, which shows existence and uniqueness at once. So $u(5)=(2,3)$.'
          - problem: 'The positive divisors of $72$ form a category with one morphism $x\to y$ exactly when $x$ divides $y$. Find the apex of the limit cone of the discrete diagram on $18$ and $12$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone over the diagram has an apex $x$ dividing both $18$ and $12$, so the apexes are $1$, $2$, $3$ and $6$. The limit cone receives a mediating morphism from each of these, so every one divides its apex; uniqueness is automatic because a poset has at most one morphism between two objects. So the apex is $6$, the greatest common divisor of $18$ and $12$.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the diagram with a single object, sent to $A=\{2,3,4\}$. Consider the cone $(A\times A,\pi_1)$ with the first projection as its only leg, and the cone $(A,\mathrm{id}_A)$. How many maps $u\colon A\to A\times A$ satisfy $\pi_1\circ u=\mathrm{id}_A$?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $\pi_1\circ u=\mathrm{id}_A$ says that $u(a)=(a,b)$ for some $b\in A$ that may depend on $a$. Each of the $3$ elements of $A$ has $3$ free choices of $b$, so there are $3\cdot 3\cdot 3=27$ maps. Existence holds, but uniqueness fails.'
          - problem: 'A restaurant offers $3$ starters and $5$ mains, and two guests each choose one starter and one main. Let $D$ be the discrete diagram of the set of starters and the set of mains in $\mathbf{Set}$, and let $X$ be the two-element set of guests. How many cones over $D$ have the apex $X$?'
            answer: '225'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A cone with apex $X$ is a pair of legs, one function from $X$ to the starters and one from $X$ to the mains. There are $3^2=9$ functions to the starters and $5^2=25$ functions to the mains. So there are $9\cdot 25=225$ cones, the same as the number of maps from $X$ to the $15$-element product.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the discrete diagram on $A=\{1,2\}$ and $B=\{3,4\}$. Let $P=\{(1,3),(1,4),(2,3)\}$ with the two coordinate projections as legs. There are four cones over $D$ with a one-point apex, one for each pair of a point of $A$ and a point of $B$. For how many of them is there a mediating map into $P$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A one-point cone with legs $a\in A$ and $b\in B$ has a mediating map into $P$ exactly when the pair $(a,b)$ lies in $P$, since the map must send the point to $(a,b)$. Of the four pairs, $(1,3)$, $(1,4)$ and $(2,3)$ lie in $P$. Only $(2,4)$ does not. So $3$ of the cones have a mediating map, and $P$ is not a limit.'
          - problem: 'In $\mathbf{Set}$, let $D$ be the diagram with a single object, sent to $A=\{0,1\}$. Is the cone $(A\times A,\pi_1)$, with the first projection as its only leg, a limit of $D$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it is not", "it is not a limit", "not a limit", "it's not a limit", "it isn't a limit"], ["yes", "it is", "it is a limit", "a limit", "it's a limit"]]}
            solution_sketch: 'A limit must receive exactly one mediating map from every cone. For the cone $(A,\mathrm{id}_A)$ the maps $a\mapsto(a,0)$ and $a\mapsto(a,1)$ both satisfy $\pi_1\circ u=\mathrm{id}_A$. So uniqueness fails and the cone is not a limit.'
          - problem: 'A shop sells shirts in some number of sizes and in $5$ colors. The set of all size-and-color combinations is the limit of the discrete diagram of the sizes and the colors in $\mathbf{Set}$, and it has $35$ elements. How many sizes does the shop offer?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The limit of a discrete diagram is the product of the sets, so the number of combinations is the number of sizes times $5$. We solve $s\cdot 5=35$ and divide to get $s=35/5=7$ sizes.'
          - problem: 'Write the full proof that a cone over a diagram $D$ is a limit cone if and only if it is a terminal object in the category of cones over $D$, stating the existence and the uniqueness of the mediating map separately and checking that it commutes with every leg.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1, define the category of cones: an object is a cone $(X,\mu)$ over $D$, and a morphism from $(X,\mu)$ to $(Y,\nu)$ is a map $u\colon X\to Y$ in $\mathcal C$ with $\nu_j\circ u=\mu_j$ for every object $j$ of the shape category, so a morphism of cones is exactly a map commuting with every leg. Step 2, existence: to say $(L,\lambda)$ is terminal means every cone $(X,\mu)$ admits some morphism to it; unpacking the definition, there exists a map $u\colon X\to L$ with $\lambda_j\circ u=\mu_j$ for every $j$, which is the existence half of the universal property. Step 3, uniqueness: terminal also says this morphism is unique, which is the uniqueness half of the universal property, stated separately. Step 4, conclusion: the universal property holds exactly when $(L,\lambda)$ is terminal in the category of cones over $D$.'
    diagnostic_exemplar:
      problem: "Write $\\mathrm{Cone}(X,D)$ for the set of cones over $D$ with apex $X$. Prove that a cone $(L,\\lambda)$ is a limit of $D$ iff for every object $X$ the map $\\Theta_X\\colon\\mathrm{Hom}(X,L)\\to\\mathrm{Cone}(X,D)$, $u\\mapsto(\\lambda_j\\circ u)_j$, is a bijection."
      answer: "$\\Theta_X$ is well defined: $(\\lambda_ju)_j$ is a cone since $Df\\circ\\lambda_j\\circ u=\\lambda_{j'}\\circ u$ follows from the cone condition on $\\lambda$. Surjectivity of $\\Theta_X$ for all $X$ says every cone $(X,\\mu)$ equals $(\\lambda_ju)_j$ for some $u$ — the EXISTENCE of a mediating map commuting with every leg. Injectivity says two maps inducing the same cone coincide — its UNIQUENESS. Together these are precisely the universal property of a limit cone, and conversely a limit cone makes every $\\Theta_X$ a bijection."
      solution_sketch: "Check first that $\\Theta_X$ really lands in cones, then match clause to clause: surjectivity for every $X$ is the existence of a mediating map, injectivity is its uniqueness. That dictionary runs in both directions, which is what makes the statement an iff."
    anki_seeds:
      - front: "A limit of $D$ is..."
        back: "a universal (terminal) cone over $D$: every cone factors uniquely through it."
        type: basic
      - front: "The limit over a discrete shape is a {{c1::product}}; over a parallel pair, an {{c2::equalizer}}; over a cospan, a {{c3::pullback}}."
        back: "product; equalizer; pullback"
        type: cloze
      - front: "The limit over the empty shape is..."
        back: "a terminal object."
        type: basic

