    knowledge_points:
      - id: kp1
        name: A universal property is an initial or terminal object
        key_prerequisites: [initial-terminal-objects, free-groups-presentations]
        constraints: "Require the learner to use a universal property is an initial or terminal object. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        try_first:
          problem: 'In the category on $\{1,2,3,4,6,12\}$ with one morphism from $m$ to $n$ exactly when $m$ divides $n$, how many morphisms end at the object $12$? Count the identity morphism of $12$.'
          answer_contract: {"kind": "exact"}
          answer: '6'
          reveal: 'Each of the six objects has exactly one morphism into $12$, so $12$ is terminal. A universal property is a statement of this kind: exactly one comparison morphism from every candidate.'
        exemplars:
          - problem: 'Take the positive divisors of $30$, namely $1,2,3,5,6,10,15,30$, as the objects of a category with exactly one morphism from $m$ to $n$ when $m$ divides $n$. Which object is terminal?'
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A terminal object receives exactly one morphism from every object. Here that means every divisor of $30$ divides the object, so it must be $30$ itself. Each of $1,2,3,5,6,10,15$ divides $30$, so $30$ is terminal.'
          - problem: 'The free group $F$ on $\{a,b\}$ has this property: for every group $G$ and every pair of elements $x,y\in G$ there is exactly one homomorphism $F\to G$ sending $a$ to $x$ and $b$ to $y$. How many homomorphisms are there from $F$ to $\mathbb{Z}/3\mathbb{Z}$?'
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each homomorphism is fixed by the images of $a$ and $b$, and each choice of images gives exactly one homomorphism. There are $3$ choices for the image of $a$ and $3$ for the image of $b$, so there are $3\cdot 3=9$ homomorphisms.'
          - problem: 'The objects of a category are the numbers $2,3,4,6,12$, with exactly one morphism from $m$ to $n$ when $m$ divides $n$ and no other morphisms. Does this category have an initial object?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it has one", "there is one"], ["no", "it does not", "none", "no initial object", "there is none"]]}
            solution_sketch: 'An initial object has exactly one morphism to every object, so it must divide every number in the list. The numbers $2$ and $3$ have no common divisor in the list, and neither divides the other. So no object is initial.'
          - problem: 'Sam says that the empty set is a terminal object of $\mathbf{Set}$, because there is exactly one function from $\emptyset$ to every set. How many functions are there from $\{0,1\}$ to $\emptyset$?'
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A function from $\{0,1\}$ to $\emptyset$ would have to send $0$ to an element of $\emptyset$, and there is none, so there are $0$ such functions. A terminal object needs exactly one function from every set into it, so $\emptyset$ is not terminal. Sam described an initial object.'
          - problem: 'The objects of a category are the functions $f\colon A\to S$ into the set $S=\{1,2,3,4\}$. A morphism from $f\colon A\to S$ to $g\colon B\to S$ is a function $k\colon A\to B$ with $g\circ k=f$. The terminal object is a function $T\to S$. How many elements does $T$ have?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity function $\mathrm{id}\colon S\to S$ is terminal: for each $f\colon A\to S$ the only $k$ with $\mathrm{id}\circ k=f$ is $k=f$. So $T=S$, which has $4$ elements.'
          - problem: 'In the category of pointed sets, an object is a set with a chosen element, and a morphism is a function that sends the chosen element to the chosen element. How many elements does a terminal object have?'
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take a pointed set with chosen point $0$ and one other element. A pointed map into $T$ must send $0$ to the chosen point of $T$, and the other element may go anywhere in $T$, so there are as many maps as $T$ has elements. Exactly one map means that $T$ has $1$ element.'
          - problem: 'The free monoid on $\{a,b\}$ is the set of words in $a$ and $b$, and every function from $\{a,b\}$ to a monoid extends in exactly one way to a monoid homomorphism. Let $h$ be the homomorphism from this monoid to $(\mathbb{N},+)$ with $h(a)=2$ and $h(b)=3$. What is $h(abba)$?'
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism to $(\mathbb{N},+)$ sends a word to the sum of the images of its letters. For $abba$ this sum is $2+3+3+2=10$, so $h(abba)=10$.'
          - problem: 'Write the full proof that, in the category whose objects are pairs $(G,f)$ of a group $G$ and a function $f\colon S\to G$, and whose morphisms from $(G,f)$ to $(H,g)$ are the homomorphisms $h$ with $h(f(s))=g(s)$ for all $s\in S$, the free group $F(S)$ with its insertion $\eta$ is an initial object, and that any two initial objects are related by a unique isomorphism.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1, name the category: its objects are the pairs $(G,f)$, and its morphisms are the homomorphisms $h$ with $h(f(s))=g(s)$. Step 2, locate the universal object: for each $(G,f)$ the universal property of the free group gives a unique homomorphism $h\colon F(S)\to G$ with $h(\eta(s))=f(s)$, which is exactly a unique morphism $(F(S),\eta)\to(G,f)$, so $(F(S),\eta)$ is initial. Step 3, uniqueness of initial objects: if $(A,a)$ and $(B,b)$ are both initial, there are unique morphisms $u\colon A\to B$ and $v\colon B\to A$. The composite $vu$ is a morphism $A\to A$, and initiality of $A$ forces $vu=\mathrm{id}_A$; likewise $uv=\mathrm{id}_B$. So $u$ is an isomorphism, and it is unique because it was the only morphism $A\to B$. Conclusion: $F(S)$ is unique up to a unique isomorphism.'
      - id: kp2
        name: The existence-and-uniqueness template
        key_prerequisites: [commutative-diagrams]
        constraints: "Require the learner to use the existence-and-uniqueness template. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar. Closed items may diagnose general proofs; require the named universal-property argument, not numerical outputs after its decisive construction is supplied."
        exemplars:
          - problem: 'In $\mathbf{Set}$ the one-element set $\{*\}$ is terminal: from every set $X$ there is exactly one function $X\to\{*\}$. How many functions are there from $\{a,b,c\}$ to the two-element set $\{0,1\}$?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the $3$ elements goes to one of $2$ elements independently, so there are $2^3=8$ functions. Because there are $8$ and not $1$, the set $\{0,1\}$ fails the uniqueness clause of the terminal property.'
          - problem: 'In $\mathbf{Set}$ let $A=\{a,b\}$, $B=\{c,d\}$ and $P=A\times B\times\{0,1\}$, with $p_1(x,y,z)=x$ and $p_2(x,y,z)=y$. Let $X=\{u,v\}$, $f(u)=a$, $f(v)=b$, $g(u)=c$ and $g(v)=c$. How many functions $h\colon X\to P$ satisfy $p_1h=f$ and $p_2h=g$?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The two equations fix the first two coordinates of $h(u)$ and of $h(v)$. The third coordinate is free, with $2$ choices for each of the two elements, so there are $2\cdot 2=4$ functions. More than one function means that $P$ does not have the universal property of the product of $A$ and $B$.'
          - problem: 'Is the empty set an initial object of $\mathbf{Set}$?'
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'An initial object has exactly one morphism to every object. For every set $X$ there is exactly one function from $\emptyset$ to $X$, the empty function. So the empty set is initial.'
          - problem: 'Sam says that $m\colon\{0,1,2\}\to\{0,1\}$ with $m(0)=0$, $m(1)=1$ and $m(2)=1$ has the universal property that every function $h\colon\{*\}\to\{0,1\}$ factors uniquely through $m$, because a factor exists for each $h$. For $h(*)=1$, how many functions $u\colon\{*\}\to\{0,1,2\}$ satisfy $m\circ u=h$?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function $u$ must send $*$ to an element that $m$ sends to $1$. Both $1$ and $2$ qualify, so there are $2$ factors. A factor exists, but it is not unique, so Sam checked only the existence clause.'
          - problem: 'The objects of a category are the divisors of $12$, with exactly one morphism from $m$ to $n$ when $m$ divides $n$. How many morphisms are there from the terminal object to the initial object?'
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The terminal object is $12$ and the initial object is $1$. There is a morphism from $12$ to $1$ only if $12$ divides $1$, which is false, so there are $0$ morphisms.'
          - problem: 'Is the one-element set $\{*\}$ an initial object of $\mathbf{Set}$?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'An initial object has exactly one function to every set. From $\{*\}$ to $\{0,1\}$ there are two functions, so $\{*\}$ is not initial. It is terminal instead.'
          - problem: 'Write the full proof that in any category with a terminal object $1$, any two morphisms $f,g\colon X\to 1$ are equal, naming at each step which clause of the universal property is used.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'State the universal property with separated clauses: for every object $X$ there exists a morphism $X\to 1$, and it is unique among all morphisms $X\to 1$, because the defining diagram of the terminal object is empty. Step 1 (existence clause): there is a morphism from $X$ to $1$. Step 2: $f$ and $g$ are morphisms from $X$ to $1$, so both are candidates for that unique map. Step 3 (uniqueness clause): only one morphism $X\to 1$ exists, so $f$ and $g$ each equal it. Conclusion: $f=g$, the prototype of every uniqueness argument driven by a universal property.'
      - id: kp3
        name: Universal properties as represented functors
        key_prerequisites: [initial-terminal-objects]
        constraints: "Require the learner to use universal properties as represented functors. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar. Closed items may diagnose general proofs; require the named universal-property argument, not numerical outputs after its decisive construction is supplied."
        exemplars:
          - problem: 'In $\mathbf{Set}$ the product $A\times B$, with $A=\{0,1\}$ and $B=\{2,3,4\}$, represents the functor $S(X)=\mathrm{Hom}(X,A)\times\mathrm{Hom}(X,B)$: maps $X\to A\times B$ correspond to pairs of maps. For $X=\{x,y\}$, how many elements does $S(X)$ have?'
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $2^2=4$ maps from $X$ to $A$ and $3^2=9$ maps from $X$ to $B$, so $S(X)$ has $4\cdot 9=36$ elements. This agrees with the $6^2=36$ maps from $X$ to $A\times B$, which has $6$ elements.'
          - problem: 'With $A=\{0,1\}$, $B=\{2,3,4\}$ and $X=\{u,v\}$, let $f(u)=0$, $f(v)=1$, $g(u)=4$ and $g(v)=2$. The map $h\colon X\to A\times B$ that corresponds to the pair $(f,g)$ under $h\mapsto(\pi_1h,\pi_2h)$ sends $v$ to which element of $A\times B$?'
            answer: "(1, 2)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The map $h$ has $\pi_1h=f$ and $\pi_2h=g$, so $h(x)=(f(x),g(x))$. For $x=v$ this gives $(f(v),g(v))=(1,2)$.'
          - problem: 'The contravariant power set functor $P$ sends a set $X$ to the set of its subsets. It is represented by $\{0,1\}$: a function $\chi\colon X\to\{0,1\}$ corresponds to the subset $\{x:\chi(x)=1\}$. For $X=\{1,2,3,4\}$ and $\chi(1)=1$, $\chi(2)=0$, $\chi(3)=1$, $\chi(4)=0$, which subset corresponds to $\chi$?'
            answer: "1, 3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The subset that corresponds to $\chi$ contains exactly the elements on which $\chi$ takes the value $1$. These are $1$ and $3$, so the subset is $\{1,3\}$. The other elements $2$ and $4$ take the value $0$ and are left out.'
          - problem: 'A shop describes each item in a basket $X$ by one of $3$ colors and one of $5$ sizes. This gives the functor $S(X)=\mathrm{Hom}(X,\text{Colors})\times\mathrm{Hom}(X,\text{Sizes})$, and a set $U$ with $\mathrm{Hom}(X,U)\cong S(X)$ for all $X$ represents it. How many elements does $U$ have?'
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take $X$ to be a one-element set. Then $\mathrm{Hom}(X,U)$ has as many elements as $U$, and $S(X)$ has $3\cdot 5=15$ elements. So $U$ has $15$ elements, one for each color and size pair.'
          - problem: 'A set $U$ represents $S(X)=\mathrm{Hom}(X,\text{Colors})\times\mathrm{Hom}(X,\text{Sizes})$, where there are $4$ colors. The set $U$ has $24$ elements. How many sizes are there?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $U$ has as many elements as $S$ has at a one-element set, which is the number of colors times the number of sizes. So $4\cdot(\text{sizes})=24$, and the number of sizes is $24/4=6$.'
          - problem: 'Sam says that $S(X)=\mathrm{Hom}(X,\{0,1\})\sqcup\mathrm{Hom}(X,\{0,1\})$ (two disjoint copies) is represented by a four-element set $U$, because $S$ has $4$ elements at a one-point set and so does $\mathrm{Hom}(\text{point},U)$. For a two-element set $X$ there are $16$ maps from $X$ to $U$. How many elements does $S(X)$ have?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $2^2=4$ maps from $X$ to $\{0,1\}$, so the two copies together give $4+4=8$ elements. Since $8\ne 16$, no natural bijection with $\mathrm{Hom}(X,U)$ exists, and matching sizes at one object is not enough.'
          - problem: 'Under the bijection $\mathrm{Hom}(X,A\times B)\to\mathrm{Hom}(X,A)\times\mathrm{Hom}(X,B)$ given by $u\mapsto(\pi_1u,\pi_2u)$, which pair corresponds to the identity map of $A\times B$ (the case $X=A\times B$)?'
            answer: "(π1, π2)"
            answer_contract: {"kind": "label", "options": [["(π1, π2)", "(π1,π2)", "(pi1, pi2)", "(pi1,pi2)", "pi1, pi2", "pi1,pi2", "π1, π2", "π1,π2"], ["(π2, π1)", "(pi2, pi1)", "pi2, pi1", "π2, π1", "(p2, p1)"], ["(id_A, id_B)", "(id A, id B)", "id_A, id_B", "(idA, idB)"], ["(π1, id)", "(pi1, id)", "pi1, id", "π1, id"]]}
            solution_sketch: 'Put $u=\mathrm{id}_{A\times B}$ in the formula $u\mapsto(\pi_1u,\pi_2u)$. Then $\pi_1u=\pi_1$ and $\pi_2u=\pi_2$, so the identity corresponds to the pair $(\pi_1,\pi_2)$ of projections. This pair is the universal element of the functor.'
          - problem: 'Write the full proof that in the category of sets the product $A\times B$ with projections $\pi_1,\pi_2$ represents the functor $S(X)=\mathrm{Hom}(X,A)\times\mathrm{Hom}(X,B)$ via the bijection $u\mapsto(\pi_1u,\pi_2u)$, natural in $X$.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (definition): for each map $u\colon X\to A\times B$ set $\Phi_X(u)=(\pi_1u,\pi_2u)$, an element of $S(X)$. Step 2 (injectivity): if $\Phi_X(u)=\Phi_X(v)$, then $u$ and $v$ are both comparison maps for the same pair $(f,g)$, and the uniqueness clause gives $u=v$. Step 3 (surjectivity): given $(f,g)\in S(X)$, the existence clause yields $u\colon X\to A\times B$ with $\pi_1u=f$ and $\pi_2u=g$, so $\Phi_X(u)=(f,g)$. Step 4 (naturality): for $h\colon Y\to X$ we have $\Phi_Y(uh)=(\pi_1uh,\pi_2uh)$, which is the pair $\Phi_X(u)$ precomposed with $h$ in each component. Conclusion: $\Phi$ is a natural bijection, so $A\times B$ represents $S$.'
    diagnostic_exemplar:
      problem: "State the universal property of the product $A\\times B$ and use it to prove that $u\\mapsto(\\pi_1\\circ u,\\,\\pi_2\\circ u)$ is a bijection $\\mathrm{Hom}(X,A\\times B)\\cong\\mathrm{Hom}(X,A)\\times\\mathrm{Hom}(X,B)$."
      answer: "The universal property: for every pair $f\\colon X\\to A$, $g\\colon X\\to B$ there EXISTS a morphism $u\\colon X\\to A\\times B$ with $\\pi_1 u=f$, $\\pi_2 u=g$, and it is UNIQUE. Surjectivity of the map $u\\mapsto(\\pi_1 u,\\pi_2 u)$ is exactly the existence clause: every pair $(f,g)$ arises. Injectivity is exactly the uniqueness clause: two maps with the same components mediate the same pair, hence are equal. So the map is a bijection — $A\\times B$ represents $X\\mapsto\\mathrm{Hom}(X,A)\\times\\mathrm{Hom}(X,B)$."
      solution_sketch: "Split the universal property into its two clauses and match them to the two halves of being a bijection: existence of the mediating $u$ is surjectivity, uniqueness of $u$ is injectivity. Beyond that dictionary there is nothing to compute."
    anki_seeds:
      - front: "A universal property characterizes an object as..."
        back: "the initial (or terminal) object of an auxiliary category of candidate structures."
        type: basic
      - front: "A universal property has two clauses: {{c1::existence}} of a comparison morphism and {{c2::uniqueness}} among the diagram-commuting morphisms."
        back: "existence; uniqueness"
        type: cloze

  - id: products-coproducts
    name: Products and Coproducts
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: universal-properties
        weight: 0.5
        key: true
      - id: duality-opposite-categories
        weight: 0.4
        key: true
      - id: initial-terminal-objects
        weight: 0.2
      - id: commutative-diagrams
        weight: 0.2
      - id: direct-products
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The product universal property in Set
        key_prerequisites: [universal-properties]
        constraints: "Require the learner to use the product universal property in set. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: 'Work in $\mathbf{Set}$. Let $A=\{1,2\}$ and $B=\{3,4\}$, with the product $A\times B$ and its projections $\pi_1,\pi_2$. Let $X=\{5,7\}$ and define $f\colon X\to A$ and $g\colon X\to B$ by $f(5)=1$, $f(7)=2$, $g(5)=4$, $g(7)=3$. The unique map $\langle f,g\rangle\colon X\to A\times B$ has $\pi_1\langle f,g\rangle=f$ and $\pi_2\langle f,g\rangle=g$. What is $\langle f,g\rangle(7)$?'
            answer: "(2, 3)"
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The pairing rule is $\langle f,g\rangle(x)=(f(x),g(x))$, the only map with both component equations. At the element $7$ the first entry is $f(7)=2$ and the second entry is $g(7)=3$. So $\langle f,g\rangle(7)=(2,3)$.'
          - problem: 'Three guests at a table each order one starter from $\{\text{soup},\text{salad}\}$ and one main from $\{\text{fish},\text{pasta},\text{steak}\}$. Choosing the starters and choosing the mains are separate choices. How many different sets of orders are there for the table?'
            answer: "216"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The starters can be chosen in $2^3=8$ ways and the mains in $3^3=27$ ways, and the two choices are independent. So there are $8\cdot 27=216$ sets of orders. This is also the number of maps from the three guests to the six (starter, main) pairs, since $6^3=216$.'
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1\}$ and $B=\{5,6\}$. Is the set $P=\{(0,5),(0,6),(1,5)\}$ with the two coordinate projections a product of $A$ and $B$?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'A product must give, for the one-point set $X=\{7\}$ with $f(7)=1$ and $g(7)=6$, a map $h$ with $\pi_1h=f$ and $\pi_2h=g$. This forces $h(7)=(1,6)$, which is not in $P$. So no such map exists and $P$ is not a product.'
          - problem: 'The objects of a category are the divisors of $36$, with exactly one morphism from $m$ to $n$ when $m$ divides $n$. What is the product of the objects $12$ and $18$?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A product of $12$ and $18$ is an object that divides both and through which every other such object factors. The common divisors of $12$ and $18$ are $1,2,3,6$, and every one of them divides $6$. So the product is $6$, the greatest common divisor.'
          - problem: 'Sam says that a map $h\colon X\to A\times B$ is determined by $\pi_1h$ alone. In $\mathbf{Set}$ let $A=\{0,1\}$, $B=\{5,6,7\}$ and $X=\{w\}$. How many maps $h\colon X\to A\times B$ satisfy $\pi_1h=f$, where $f(w)=1$?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $\pi_1h=f$ fixes the first coordinate of $h(w)$ as $1$ but leaves the second coordinate free. There are $3$ choices in $B$, so there are $3$ maps. Both $\pi_1h$ and $\pi_2h$ are needed to fix $h$.'
          - problem: 'Two guests each order one starter and one main from a menu. Together they can place $144$ different sets of orders, and the menu has $3$ mains. How many starters are on the menu?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each guest picks one of $3s$ (starter, main) pairs when there are $s$ starters, so the number of sets of orders is $(3s)^2=144$. Then $3s=12$, and $s=12/3=4$ starters.'
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1\}$ and $B=\{2,3\}$, and let $P=A\times B\times\{0,1\}$ with the first two coordinate projections $p_1,p_2$. The one-point set $X$ has maps $f(*)=1$ and $g(*)=2$. How many maps $h\colon X\to P$ satisfy $p_1h=f$ and $p_2h=g$?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equations fix the first two coordinates of $h(*)$ as $1$ and $2$, and the third coordinate is free, so there are $2$ maps. Since the mediating map is not unique, $P$ is not a product of $A$ and $B$.'
          - problem: 'In $\mathbf{Set}$ let $A=B=\{0,1\}$ and $P=\{1,2,3,4\}$, with maps $p\colon P\to A$ and $q\colon P\to B$ given by $p=(0,0,1,1)$ and $q=(0,1,0,1)$, listing the values at $1,2,3,4$. Is $P$ with $p$ and $q$ a product of $A$ and $B$?'
            answer: "yes"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'The map sending $t$ to $(p(t),q(t))$ takes $1,2,3,4$ to $(0,0)$, $(0,1)$, $(1,0)$ and $(1,1)$. These are the four elements of $A\times B$, each hit once. So every pair of maps $f,g$ into $A$ and $B$ has exactly one mediating map into $P$, and $P$ is a product.'
          - problem: 'Write the full proof that for sets $A$ and $B$ the cartesian product $A\times B$ with the coordinate projections satisfies the universal property of the product, including the uniqueness of the pairing map.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Statement: for sets $A$ and $B$, the object $A\times B$ with $\pi_1(u,v)=u$ and $\pi_2(u,v)=v$ is a product. Existence step: given a set $X$ with maps $f\colon X\to A$ and $g\colon X\to B$, define $h\colon X\to A\times B$ by $h(x)=(f(x),g(x))$. Component step: $\pi_1(h(x))=f(x)$ and $\pi_2(h(x))=g(x)$ for every $x$, so $\pi_1h=f$ and $\pi_2h=g$. Uniqueness step: if $k$ also satisfies $\pi_1k=f$ and $\pi_2k=g$, write $k(x)=(u,v)$; the equations give $u=f(x)$ and $v=g(x)$, so $k(x)=h(x)$ for every $x$, hence $k=h$. Conclusion: $A\times B$ satisfies the universal property of the product.'
      - id: kp2
        name: The coproduct by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Require the learner to use the coproduct by duality. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: 'In $\mathbf{Set}$ the coproduct of $A=\{1,2,3\}$ and $B=\{2,3\}$ is the disjoint union $A\sqcup B$, with $5$ elements written $(n,A)$ and $(n,B)$. Let $f\colon A\to\mathbb{Z}$ be $f(n)=n^2$ and $g\colon B\to\mathbb{Z}$ be $g(n)=-n$. The unique map $[f,g]\colon A\sqcup B\to\mathbb{Z}$ satisfies $[f,g]\iota_1=f$ and $[f,g]\iota_2=g$. What is $[f,g](2,B)$?'
            answer: "-2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The element $(2,B)$ is the image of $2\in B$ under $\iota_2$. So $[f,g](2,B)=[f,g]\iota_2(2)=g(2)=-2$. It differs from $[f,g](2,A)=f(2)=4$, because the two copies of $2$ are kept apart.'
          - problem: 'A school timetable has $3$ morning classes and $4$ afternoon classes. Each class is assigned one of $2$ rooms. How many different assignments of rooms are there?'
            answer: "128"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The classes form a disjoint union of $3$ and $4$ classes, so there are $2^{3+4}=2^7=128$ assignments. Equivalently the morning rooms can be chosen in $2^3=8$ ways and the afternoon rooms in $2^4=16$ ways, and $8\cdot 16=128$.'
          - problem: 'The copairing $[f,g]\colon A+B\to X$ of $f\colon A\to X$ and $g\colon B\to X$ is the unique map with $[f,g]\iota_1=f$. Which equation is the second requirement?'
            answer: "[f,g]∘ι2 = g"
            answer_contract: {"kind": "label", "options": [["[f,g]∘ι2 = g", "[f,g]∘ι2=g", "[f,g]ι2 = g", "[f,g]ι2=g", "[f,g]∘i2 = g", "[f,g]∘i2=g", "[f,g]i2 = g", "[f,g]i2=g"], ["[f,g]∘ι2 = f", "[f,g] after i2 = f", "[f,g]i2 = f", "[f,g]∘i2 = f", "[f,g] iota2 = f"], ["[f,g]∘ι1 = g", "[f,g] after i1 = g", "[f,g]i1 = g", "[f,g]∘i1 = g", "[f,g] iota1 = g"], ["ι2∘[f,g] = g", "i2 after [f,g] = g", "i2[f,g] = g", "i2∘[f,g] = g", "iota2 after [f,g] = g"]]}
            solution_sketch: 'The coproduct reverses the arrows of the product, so the copairing is defined by one equation for each injection. The injection $\iota_2$ comes from $B$, so the equation is $[f,g]\iota_2=g$. The option with $f$ gives the wrong map, the option with $\iota_1$ gives the wrong injection, and the last option has the order of composition reversed.'
          - problem: 'In $\mathbf{Ab}$ the coproduct of $\mathbb{Z}$ and $\mathbb{Z}$ is $\mathbb{Z}\oplus\mathbb{Z}$ with $\iota_1(a)=(a,0)$ and $\iota_2(b)=(0,b)$. Let $f(n)=3n$ and $g(n)=-2n$ be homomorphisms $\mathbb{Z}\to\mathbb{Z}$. The unique homomorphism $\varphi\colon\mathbb{Z}\oplus\mathbb{Z}\to\mathbb{Z}$ with $\varphi\iota_1=f$ and $\varphi\iota_2=g$ sends $(4,5)$ to which integer?'
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism out of the direct sum is forced by its values on the two injected copies. Write $(4,5)=\iota_1(4)+\iota_2(5)$. Then $\varphi(4,5)=\varphi\iota_1(4)+\varphi\iota_2(5)=f(4)+g(5)=12-10=2$.'
          - problem: 'Sam says that, because the coproduct is dual to the product, the coproduct of a $3$-element set and a $4$-element set in $\mathbf{Set}$ has $3\cdot4=12$ elements. How many elements does it have?'
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The coproduct in $\mathbf{Set}$ is the disjoint union, which keeps the elements of the two sets side by side. So it has $3+4=7$ elements. The product has $3\cdot4=12$ elements, and Sam mixed up the two constructions.'
          - problem: 'The objects of a category are the divisors of $60$, with exactly one morphism from $m$ to $n$ when $m$ divides $n$. What is the coproduct of the objects $4$ and $10$?'
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A coproduct of $4$ and $10$ is an object that both divide and that divides every other such object. The common multiples of $4$ and $10$ among the divisors of $60$ are $20$ and $60$, and $20$ divides $60$. So the coproduct is $20$, the least common multiple.'
          - problem: 'In $\mathbf{Set}$ let $A=B=\{0,1\}$ and $P=\{0,1,2,3\}$, with injections $i_A(0)=0$, $i_A(1)=2$, $i_B(0)=2$ and $i_B(1)=3$. Is $P$ with these injections a coproduct of $A$ and $B$?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'The injections overlap at the element $2$ of $P$, since $i_A(1)=i_B(0)=2$. Take $f(1)=0$ and $g(0)=1$ into $X=\{0,1\}$: a map $h$ would need $h(2)=0$ and $h(2)=1$, which is impossible. So no copairing exists and $P$ is not a coproduct.'
          - problem: 'Write the full proof that in the category of sets the disjoint union of $A$ and $B$ with its inclusions is the coproduct of $A$ and $B$, obtained by dualizing the product.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Dualize the product: it has projections $p_1,p_2$ such that for all $f\colon X\to A$ and $g\colon X\to B$ there is a unique map to the product with $p_1$ after it equal to $f$ and $p_2$ after it equal to $g$. Step 1, reversal: the coproduct is an object with injections $i_1\colon A\to Q$ and $i_2\colon B\to Q$ such that for all $f\colon A\to X$ and $g\colon B\to X$ there is a unique $[f,g]$ with $[f,g]i_1=f$ and $[f,g]i_2=g$. Step 2, candidate: take the disjoint union with the inclusion maps. Step 3, existence: the two copies are disjoint, so setting $[f,g]$ equal to $f$ on the copy of $A$ and to $g$ on the copy of $B$ is well defined, and it satisfies both equations. Step 4, uniqueness: if $h$ satisfies both equations, each element lies in exactly one copy, and $h$ agrees with $[f,g]$ there. Conclusion: the disjoint union is the coproduct in sets.'
      - id: kp3
        name: Uniqueness; coproducts need not be disjoint unions
        key_prerequisites: [universal-properties]
        constraints: "Require the learner to use uniqueness; coproducts need not be disjoint unions. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar. Closed items may diagnose general proofs; require the named universal-property argument, not numerical outputs after its decisive construction is supplied."
        exemplars:
          - problem: 'In $\mathbf{Ab}$ the coproduct of $\mathbb{Z}/2\mathbb{Z}$ and $\mathbb{Z}/3\mathbb{Z}$ is their direct sum. How many elements does it have?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The direct sum $\mathbb{Z}/2\mathbb{Z}\oplus\mathbb{Z}/3\mathbb{Z}$ consists of the pairs of an element of each group. It has $2\cdot 3=6$ elements, and it is isomorphic to $\mathbb{Z}/6\mathbb{Z}$.'
          - problem: 'Is the coproduct of $\mathbb{Z}/2\mathbb{Z}$ and $\mathbb{Z}/3\mathbb{Z}$ in the category $\mathbf{Grp}$ a finite group?'
            answer: "no"
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it does", "yes it is", "true"], ["no", "it is not", "it does not", "not", "false"]]}
            solution_sketch: 'In $\mathbf{Grp}$ the coproduct is the free product $\mathbb{Z}/2\mathbb{Z}*\mathbb{Z}/3\mathbb{Z}$, because maps out of it need not respect the commuting condition of $\mathbf{Ab}$. The product $ab$ of generators of orders $2$ and $3$ has infinite order, so the free product is infinite.'
          - problem: 'A set $Q$ with maps $i_1\colon A\to Q$ and $i_2\colon B\to Q$ is a coproduct of $A$ and $B$ in $\mathbf{Set}$. The set $A$ has $3$ elements and $B$ has $5$ elements. How many elements does $Q$ have?'
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Any two coproducts are related by a unique isomorphism, and the disjoint union is one coproduct. So $Q$ has as many elements as the disjoint union, $3+5=8$.'
          - problem: 'The objects of a category are the subsets of $\{1,2,3,4\}$, with exactly one morphism from $S$ to $T$ when $S\subseteq T$. How many elements does the coproduct of $\{1,2\}$ and $\{2,3,4\}$ have?'
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A coproduct of two subsets is the smallest subset that contains both. Here that is the union $\{1,2\}\cup\{2,3,4\}=\{1,2,3,4\}$, which has $4$ elements.'
          - problem: 'Sam says that in the divisors of $36$, with exactly one morphism from $m$ to $n$ when $m$ divides $n$, the coproduct of $4$ and $9$ is their greatest common divisor, $1$. What is the coproduct of $4$ and $9$?'
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A coproduct receives morphisms from both objects, so it is a common multiple, and it is the least one. Among the divisors of $36$ the only common multiple of $4$ and $9$ is $36$. Sam used the greatest common divisor, which gives the product and not the coproduct.'
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1\}$ and $B=\{0,1,2\}$. The set $P''=\{1,2,3,4,5,6\}$ has maps $p\colon P''\to A$ and $q\colon P''\to B$ with $p=(0,0,0,1,1,1)$ and $q=(0,1,2,0,1,2)$ on the elements $1,\dots,6$, and $(P'',p,q)$ is a product of $A$ and $B$. The unique isomorphism $u\colon A\times B\to P''$ satisfies $pu=\pi_1$ and $qu=\pi_2$. What is $u(1,2)$?'
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equations give $p(u(1,2))=1$ and $q(u(1,2))=2$. The only element of $P''$ with $p=1$ and $q=2$ is $6$, so $u(1,2)=6$.'
          - problem: 'In $\mathbf{Ab}$, maps out of the coproduct $\mathbb{Z}/2\mathbb{Z}\oplus\mathbb{Z}/3\mathbb{Z}$ correspond to pairs of maps out of $\mathbb{Z}/2\mathbb{Z}$ and out of $\mathbb{Z}/3\mathbb{Z}$. How many group homomorphisms are there from $\mathbb{Z}/2\mathbb{Z}\oplus\mathbb{Z}/3\mathbb{Z}$ to $\mathbb{Z}/9\mathbb{Z}$?'
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism out of $\mathbb{Z}/2\mathbb{Z}$ sends $1$ to an element $x$ of $\mathbb{Z}/9\mathbb{Z}$ with $2x=0$, which forces $x=0$, so there is $1$ such homomorphism. A homomorphism out of $\mathbb{Z}/3\mathbb{Z}$ sends $1$ to an $x$ with $3x=0$, so there are $3$ choices. Together there are $1\cdot 3=3$ homomorphisms.'
          - problem: 'Write the full proof that any two coproducts of $A$ and $B$ are isomorphic by a unique isomorphism compatible with the injections.'
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: 'Setup: let $Q$ be a coproduct of $A$ and $B$ with injections $i_1,i_2$, and let $Q''$ be another with injections $j_1,j_2$. Mediating map $u$: the universal property of $Q$ applied to $j_1,j_2$ gives a unique $u\colon Q\to Q''$ with $ui_1=j_1$ and $ui_2=j_2$. Mediating map $v$: the universal property of $Q''$ applied to $i_1,i_2$ gives a unique $v\colon Q''\to Q$ with $vj_1=i_1$ and $vj_2=i_2$. Cross-map: $vu$ satisfies $(vu)i_1=vj_1=i_1$ and $(vu)i_2=i_2$, and $1_Q$ satisfies the same two equations, so the uniqueness clause of $Q$ forces $vu=1_Q$. The same argument with $Q$ and $Q''$ swapped gives $uv=1_{Q''}$. Conclusion: $u$ is an isomorphism compatible with the injections, and it is the only map obeying the two equations.'
    diagnostic_exemplar:
      problem: "Prove that any two products of $A$ and $B$ are isomorphic by a unique isomorphism compatible with the projections."
      answer: "Let $(P,\\pi_1,\\pi_2)$ and $(P',\\pi_1',\\pi_2')$ both be products. The universal property of $P'$ applied to the cone $(\\pi_1,\\pi_2)$ gives a unique $u\\colon P\\to P'$ with $\\pi_i'u=\\pi_i$; that of $P$ gives a unique $v\\colon P'\\to P$ with $\\pi_iv=\\pi_i'$. Then $\\pi_i(vu)=\\pi_i'u=\\pi_i$, so $vu$ and $1_P$ both mediate the cone $(\\pi_1,\\pi_2)$ into $P$; uniqueness forces $vu=1_P$, and symmetrically $uv=1_{P'}$. Hence $u$ is an isomorphism, unique among maps commuting with the projections."
      solution_sketch: "Mediate each product through the other to get $u$ and $v$, then notice that $v\\circ u$ and the identity both mediate the same cone into $P$; the uniqueness clause collapses them. This is the standard argument that universal objects are unique up to a unique isomorphism."
    anki_seeds:
      - front: "Universal property of a product?"
        back: "$\\pi_1,\\pi_2$ with: every pair $f\\colon X\\to A$, $g\\colon X\\to B$ factors as a unique $\\langle f,g\\rangle\\colon X\\to A\\times B$."
        type: basic
      - front: "Coproduct is the {{c1::dual}} of the product; in $\\mathbf{Set}$ it is the {{c2::disjoint union}}."
        back: "dual; disjoint union"
        type: cloze

