      - id: kp3
        name: Coequalizers by duality
        key_prerequisites: [duality-opposite-categories]
        constraints: "Require the learner to use coequalizers by duality. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Construct the coequalizer and the descended universal map. In Set take f,g:{0,1}->{0,1,2,3} with values [0, 1],[1, 2], and h:{0,1,2,3}->Z with values [5, 5, 5, 9]. Label coequalizer classes in increasing order of their least element. Give the quotient value list followed by the unique factor of h through it."
            answer: "0, 0, 0, 1, 5, 9"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Coequalizing requires f and g images to agree after the quotient. The generated equivalence classes are exactly those identifications, and h descends uniquely because it is constant on them. The resulting answer is 0, 0, 0, 1, 5, 9."
          - problem: "Dualize the equalizer property to construct the quotient arrow and factor. In Set take f,g:{0,1}->{0,1,2,3} with values [0, 2],[1, 3], and h:{0,1,2,3}->Z with values [7, 7, 4, 4]. Label coequalizer classes in increasing order of their least element. Give the quotient value list followed by the unique factor of h through it."
            answer: "0, 0, 1, 1, 7, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Coequalizing requires f and g images to agree after the quotient. The generated equivalence classes are exactly those identifications, and h descends uniquely because it is constant on them. The resulting answer is 0, 0, 1, 1, 7, 4."
          - problem: "In the category $\\mathbf{Ab}$, let $f$ and $g$ be the homomorphisms $\\mathbb{Z}\\to\\mathbb{Z}$ defined by $f(x)=2x$ and $g(x)=6x$. Their coequalizer is a cyclic group $\\mathbb{Z}/k\\mathbb{Z}$ for a whole number $k$. Give $k$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Difference map: $f(x) - g(x) = 2x - 6x = -4x$, so its image is the subgroup $4\\mathbb{Z}$. By the cokernel description of coequalizers in Ab, the coequalizer is $\\mathbb{Z}/4\\mathbb{Z}$, hence $k = 4$. As a check, $qf = qg$ holds because every $f(x)-g(x)$ lies in $4\\mathbb{Z}$. The answer is 4."
          - problem: "In $\\mathbf{Ab}$, a student computes the coequalizer of $f,g\\colon \\mathbb{Z}\\to\\mathbb{Z}$ with $f(x)=6x$ and $g(x)=x$ as $\\mathbb{Z}/6\\mathbb{Z}$, arguing that the quotient kills the image of $f$. Give the correct number of elements of the coequalizer."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The coequalizer in Ab quotients by the image of the difference, not by the image of $f$. Difference map: $f(x) - g(x) = 6x - x = 5x$, so its image is $5\\mathbb{Z}$. The quotient is $\\mathbb{Z}/5\\mathbb{Z}$, which has 5 elements. The student's error was to use $\\mathrm{im}(f) = 6\\mathbb{Z}$ instead of $\\mathrm{im}(f-g)$. The answer is 5."
          - problem: "An equalizer in $\\mathbf{Set}$ is built inside the domain $A$: it is the inclusion of the part of $A$ where $f$ and $g$ take equal values. Apply duality. Select the option that describes the coequalizer of $f,g\\colon A\\to B$ in $\\mathbf{Set}$."
            answer: "the quotient of B by the smallest equivalence relation with f(a) ~ g(a)"
            answer_contract: {"kind": "label", "options": [["the quotient of B by the smallest equivalence relation with f(a) ~ g(a)"], ["the quotient of A by the smallest equivalence relation with f(a) ~ g(a)"], ["the subset of B formed by the elements on which f and g agree"], ["the subset of A formed by the elements on which f and g agree"]]}
            solution_sketch: "Duality reverses every arrow and swaps domain with codomain, and it turns subobjects into quotients. The equalizer is a subobject of $A$, so its dual is a quotient of $B$. The option 'the quotient of A ...' keeps a quotient but wrongly stays in the domain. The option 'the subset of B ...' wrongly keeps a subobject and moves to the codomain. The option 'the subset of A ...' is the original statement, not its dual at all. The answer is the quotient of B by the smallest equivalence relation with f(a) ~ g(a)."
          - problem: "In Set, f,g:{0,1}->{0,1,2} have value lists f=[0,1], g=[1,2]. Four proposed coequalizer maps out of {0,1,2} are: 1: q=[0,0,1] into {0,1}; 2: q=[0,0,0] into {0}; 3: q=[0,0,0] into {0,1}; 4: q=[0,1,2] into {0,1,2}. Which map has the coequalizer universal property? Give its number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The universal quotient must impose all required identifications and admit a unique factor for every equalizing map. Only candidate 2 does so; candidate 3 adds an unconstrained target element and fails uniqueness."
          - problem: "Write the full proof: in $\\mathbf{Set}$, the canonical map $q\\colon B\\to B/\\sim$, where $\\sim$ is the smallest equivalence relation on $B$ with $f(a)\\sim g(a)$ for all $a\\in A$, is the coequalizer of $f,g\\colon A\\to B$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let $\\sim$ be the smallest equivalence relation on $B$ containing every pair $(f(a),g(a))$, let $Q = B/\\sim$, and let $q\\colon B\\to Q$ send each element to its class. Step 1 ($qf = qg$): for each $a \\in A$ we have $f(a) \\sim g(a)$ by construction, so $q(f(a)) = q(g(a))$. Step 2 (universality): let $n\\colon B\\to C$ satisfy $nf = ng$; define $w\\colon Q\\to C$ by $w([b]) = n(b)$. This is well defined, because $R = \\{(b,b') : n(b) = n(b')\\}$ is an equivalence relation on $B$ containing every pair $(f(a),g(a))$ since $nf = ng$, and $\\sim$ is the smallest such relation, so $b \\sim b'$ implies $n(b) = n(b')$. Step 3 (uniqueness): $q$ is surjective since every class $[b]$ equals $q(b)$, so any $w'$ with $w'q = n$ satisfies $w'([b]) = w'q(b) = n(b) = w([b])$, hence $w' = w$. Conclusion: $q\\colon B\\to B/\\sim$ satisfies $qf = qg$ and every $n$ with $nf = ng$ factors uniquely as $n = wq$, so it is the coequalizer. $\\square$"
    diagnostic_exemplar:
      problem: "Prove that every equalizer $e\\colon E\\to A$ of $f,g\\colon A\\to B$ is a monomorphism."
      answer: "Suppose $eu=ev$ for $u,v\\colon X\\to E$, and set $m=eu=ev$. Then $fm=(fe)u=(ge)u=gm$, so $m$ equalizes $f,g$ and therefore factors through $e$ via a UNIQUE map $X\\to E$. Both $u$ and $v$ are such factorizations ($eu=m=ev$), so uniqueness gives $u=v$. Hence $e$ is left-cancellable, i.e. a monomorphism."
      solution_sketch: "From $e\\circ u=e\\circ v$, show the common composite equalizes $f$ and $g$, so it factors through $e$ by a unique map — and $u$, $v$ are both such factorizations. Left-cancellation comes from the uniqueness clause, not from any element chase."
    anki_seeds:
      - front: "Equalizer of $f,g\\colon A\\to B$?"
        back: "the universal $e\\colon E\\to A$ with $fe=ge$; in $\\mathbf{Set}$, $E=\\{a: f(a)=g(a)\\}$."
        type: basic
      - front: "Every equalizer $e\\colon E\\to A$ is what kind of morphism?"
        back: "a monomorphism."
        type: basic
      - front: "Coequalizers are always {{c1::epimorphisms}} (dual to equalizers being monos)."
        back: "epimorphisms"
        type: cloze

