          - problem: "Write the full proof from the definitions: let F:C->E be a functor and D:J->C a diagram. For a cone lambda over D, let P(lambda) mean that lambda is limiting and Q(lambda) mean that F(lambda) is limiting. Express preservation and reflection of limits of D using quantified implications in P and Q. Negate each statement and prove exactly what a cone must witness to refute it. Explain whether either definition alone asserts that a limit exists."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Preservation says that for every cone lambda over D, P(lambda) implies Q(lambda): a source limit must remain a limit after applying F. Reflection reverses the implication, requiring Q(lambda) to imply P(lambda) for every such cone. A universally quantified implication fails precisely when one witness satisfies its hypothesis and fails its conclusion. Thus failure of preservation requires a cone that is limiting in C but whose image is not limiting in E. Failure of reflection requires a cone whose image is limiting while the original cone is not. Both definitions are implications about cones, so neither definition by itself asserts existence of a limiting cone. This derives each failure witness directly from its own definition."
