            solution_sketch: "The evaluation equation determines each function value and hence the unique transpose. Checking the same evaluation after pre- and postcomposition proves naturality of the curry correspondence. The resulting answer is 6, 5."
          - problem: "Work in Set. Let $X = \\{1,2,3\\}$, $A = \\{u,v\\}$, $B = \\{0,1\\}$, and let $g: X \\times A \\to B$ be given by $g(1,u)=0$, $g(1,v)=1$, $g(2,u)=1$, $g(2,v)=0$, $g(3,u)=0$, $g(3,v)=1$. Let $\\hat g: X \\to B^A$ be the curry of $g$. Find the number of distinct functions in the image of $\\hat g$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the curry universal property, $\\hat g(x)$ is the function $A \\to B$ with $\\hat g(x)(a) = g(x,a)$ for all $a$ in $A$. Compute the three functions: $\\hat g(1)$ sends $u$ to 0 and $v$ to 1, $\\hat g(2)$ sends $u$ to 1 and $v$ to 0, and $\\hat g(3)$ sends $u$ to 0 and $v$ to 1. Thus $\\hat g(1)$ and $\\hat g(3)$ are the same function, so the image holds exactly 2 functions. The answer is 2."
          - problem: "Recover the functions selected by currying and verify uniqueness. In Set, g:X x A->B has rows [[0, 1, 1], [1, 0, 0]], where rows index X and columns index A, all starting at0; B={0,...,1}. Let r:Xprime->X have values [0, 1] and s:B->C have values [0, 1]. Construct the transpose of s g (r x id_A) from the evaluation equation, and establish its agreement with applying r and the induced map s^A to the transpose of g. Take C={0,...,1}. Enumerate C^A lexicographically from0. Give the function index assigned to each Xprime element."
            answer: "3, 4"
