    knowledge_points:
      - id: kp1
        name: The empty diagram
        key_prerequisites: [limits-as-cones]
        constraints: "Require the learner to use the empty diagram. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "View the poset a<b<d and a<c<d, with b and c incomparable, as a category. Construct a limit cone for the empty diagram. Encode a,b,c,d by 0,1,2,3. Give the apex code followed by the target codes of the unique cone maps from apices a,b,c,d, in that order."
            answer: "3, 3, 3, 3, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "An empty-diagram cone map has no leg equations, so the universal receiving cone must receive one arrow from every object. In this poset only d does; its code and every required target code are 3."
          - problem: "Construct the colimit of the empty Set diagram from its universal cocone property. For candidate apices of sizes0,1,2, test uniqueness of maps from each candidate to target sets of sizes0,1,2. Give the nine hom-set sizes row by row, and identify the candidate whose row consists entirely of1."
            answer: "1, 1, 1, 0, 1, 2, 0, 1, 4, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "An empty cocone carries only its apex. Its universal property demands one arrow from that apex to every object; the hom-set test selects the empty set. The resulting answer is 1, 1, 1, 0, 1, 2, 0, 1, 4, 0."
          - problem: "Let C be the poset of subsets of {1,2,3}, with inclusion arrows. Encode a subset by the sum of weights 1,2,4 of its elements. Construct a limit cone for the empty diagram in C. Give its apex code followed by the target codes of the unique cone maps from source subsets with codes 0,1,2,3,4,5,6,7, in that order."
            answer: "7, 7, 7, 7, 7, 7, 7, 7, 7"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The universal cone for the empty diagram must admit exactly one arrow from every subset, with no further leg equations. Inclusion forces its apex to be the full set, whose code and all requested target codes are 7."
          - problem: "In the chain0<1<2, construct the limit cone of the empty diagram by its cone-morphism property. Give the apex followed by the source,target pairs of the unique cone maps from apices0,1,2."
            answer: "2, 0, 2, 1, 2, 2, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "There are no leg constraints, so cone maps are ordinary arrows. The limit must receive a unique arrow from every apex, fixing the terminal object and the mediators. The resulting answer is 2, 0, 2, 1, 2, 2, 2."
          - problem: "Claim: the limit of the empty diagram in Set is the empty set. Step 1: a cone over the empty diagram with apex X consists of no legs and satisfies no conditions, so every set is a cone. Step 2: a morphism of cones from X to Y is any function from X to Y, since no legs need to commute. Step 3: the limit is the cone that receives exactly one morphism of cones from every other cone. Step 4: the empty set receives exactly one function from every set, so it is the limit. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: a cone over the empty diagram indeed carries no legs and no conditions. Step 2 is valid: with no legs, any function is a morphism of cones. Step 3 is valid: it is exactly the universal property of the limit. Step 4 is not valid: the empty set receives no function at all from a nonempty set, so it fails the universal property; the set receiving exactly one function from every set is a one-element set. The first invalid step is Step 4."
          - problem: "For an arbitrary category C and object L, decide which proposed conditions characterize L as the apex of a limit cone for the empty diagram in every category. (a) For every X there is exactly one arrow X->L. (b) For every X there is exactly one arrow L->X. (c) L has exactly one endomorphism. Derive the cone and cone-morphism data for the empty diagram to audit the three claims. Give 1 for an equivalent condition and 0 otherwise, in the displayed order."
            answer: "1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "With no diagram objects or legs, cone morphisms are precisely arrows between their apices; the limit universal property is therefore condition (a). The chain 0<1 has an initial object and singleton endomorphism sets at both objects, but only 1 is terminal, so (b) and (c) fail: 1, 0, 0."
          - problem: "Write the full proof: in any category, a limit of the empty diagram is exactly a terminal object. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the data of a cone): the empty shape has no objects and no morphisms, so a cone over the empty diagram with apex X consists of zero legs and satisfies zero commuting conditions; explicitly, a cone carries no data beyond its apex X. Step 2 (morphisms of cones): a morphism of cones from X to Y is a morphism f from X to Y in C with no leg conditions to check, so the category of cones over the empty diagram is C itself. Step 3 (limit to terminal): the limit of the empty diagram is a terminal object of the category of cones, hence a terminal object of C. Step 4 (converse): if T is terminal in C, then T as a bare apex admits exactly one morphism of cones from every cone, so T is a limit of the empty diagram. Conclusion: the limits of the empty diagram are exactly the terminal objects of C."
      - id: kp2
        name: Why finite completeness needs a terminal object
        key_prerequisites: [equalizers-coequalizers]
        constraints: "Require the learner to use why finite completeness needs a terminal object. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Include the empty product when testing finite completeness. Regard [1, 2] as a divisibility category. For every subset of objects, including the empty subset, construct its limit if it exists. Enumerate subsets by bit masks using the displayed object order. Give the resulting apex for each subset, with -1 for a failed universal property."
            answer: "2,1,2,1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Test the universal arrow condition against every cone or cocone apex. Including the empty subset checks the terminal or initial object required by the definition. The resulting answer is 2, 1, 2, 1."
          - problem: "Diagnose why binary products alone do not ensure finite completeness. Regard [1, 2, 3] as a divisibility category. For every subset of objects, including the empty subset, construct its limit if it exists. Enumerate subsets by bit masks using the displayed object order. Give the resulting apex for each subset, with -1 for a failed universal property."
            answer: "-1,1,2,1,3,1,1,1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Test the universal arrow condition against every cone or cocone apex. Including the empty subset checks the terminal or initial object required by the definition. The resulting answer is -1, 1, 2, 1, 3, 1, 1, 1."
          - problem: "Take the numbers 1 up to 10, with one arrow from m to n exactly when m divides n. A category with all finite limits must in particular have binary products, equalizers, and a terminal object. Check this category against all three requirements and give the number of requirements that hold."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First requirement: binary products are greatest common divisors, and every pair of numbers from 1 to 10 has one inside the set, so binary products hold. Second requirement: a poset has at most one arrow between two objects, so every parallel pair is one arrow twice and its equalizer is an identity, so equalizers hold. Third requirement: a terminal object would be a number of the category divisible by every number from 1 to 10, and no number up to 10 is, so the terminal object fails. The answer is 2."
          - problem: "Check all finite cone shapes in this finite poset through their apex bounds. Regard [1, 2, 4] as a divisibility category. For every subset of objects, including the empty subset, construct its limit if it exists. Enumerate subsets by bit masks using the displayed object order. Give the resulting apex for each subset, with -1 for a failed universal property."
            answer: "4,1,2,1,4,1,2,1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Test the universal arrow condition against every cone or cocone apex. Including the empty subset checks the terminal or initial object required by the definition. The resulting answer is 4, 1, 2, 1, 4, 1, 2, 1."
          - problem: "Construct the nullary as well as nonempty products needed for finite completeness. Regard [1, 2, 3, 6] as a divisibility category. For every subset of objects, including the empty subset, construct its limit if it exists. Enumerate subsets by bit masks using the displayed object order. Give the resulting apex for each subset, with -1 for a failed universal property."
            answer: "6,1,2,1,3,1,1,1,6,1,2,1,3,1,1,1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Test the universal arrow condition against every cone or cocone apex. Including the empty subset checks the terminal or initial object required by the definition. The resulting answer is 6, 1, 2, 1, 3, 1, 1, 1, 6, 1, 2, 1, 3, 1, 1, 1."
          - problem: "Let D be the category with two objects A and B, the identity arrows, and two further arrows f and g, both from A to B, with no other arrows and no compositions beyond those with identities. Check D against all three requirements for finite completeness: binary products, equalizers, and a terminal object. Determine whether D has all finite limits, and give the number of the three requirements that hold."
            answer: "verdict = no; count = 0"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["no"], ["yes"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Binary products: the only arrow into A is the identity, so a product of A and B would have to sit at A with second projection f or g; a competing cone using the other arrow then has no factorization, so the product of A and B does not exist. Equalizers: an equalizer of f and g needs an arrow into A on which f and g agree, the only arrow into A is the identity, and f differs from g, so it fails. Terminal object: a terminal object needs exactly one arrow from each object, but there are two arrows from A to B and none from B to A, so neither object is terminal. No requirement holds, so D does not have all finite limits. The answer is verdict = no; count = 0."
          - problem: "Write the full proof: an object of a category is a limit of the empty diagram if and only if it is a terminal object. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (shape of a cone): a cone over the empty diagram with apex X is a family of arrows from X indexed by the objects of the diagram; the index set is empty, so the empty family is the unique such cone and every object X carries exactly one cone. Step 2 (universal property): a limit is a cone at T such that each cone at X has a unique arrow u from X to T making the induced triangles commute; with an empty diagram there are no triangles, so the only condition is the existence and uniqueness of u. Step 3 (identification): exactly one arrow from each object X to T is the definition of a terminal object, so a limit of the empty diagram is a terminal object. Step 4 (converse): if T is terminal, the empty family at T satisfies the universal property, because the unique arrow from X to T is the required factorization. Conclusion: the limits of the empty diagram are exactly the terminal objects."
    diagnostic_exemplar:
      problem: "Show that the poset $(\\mathbb{N},\\le)$, viewed as a category, has all binary products and all equalizers, yet is not finitely complete."
      answer: "Binary products are greatest lower bounds, and $\\min(m,n)$ always exists. Any parallel pair of arrows in a poset category is a single arrow repeated (hom-sets have at most one element), so its equalizer exists trivially (the identity on the source). But the limit of the EMPTY diagram is a terminal object, i.e. a greatest element of $(\\mathbb{N},\\le)$, which does not exist. So one finite diagram has no limit and the category is not finitely complete."
      solution_sketch: "Binary products are meets, and $\\min(m,n)$ always exists; equalizers are trivial because a thin category has at most one arrow per hom-set. The failure is the empty diagram, whose limit is a terminal object — a greatest natural number, which does not exist."
    anki_seeds:
      - front: "The limit of the empty diagram is..."
        back: "a terminal object (dually, the colimit of the empty diagram is an initial object)."
        type: basic
      - front: "In $\\mathbf{Set}$, the limit of the empty diagram is {{c1::a one-element set}}, not the empty set."
        back: "a one-element set"
        type: cloze
      - front: "Finite completeness requires which three things?"
        back: "a terminal object, all binary products, and all equalizers."
        type: basic

