            solution_sketch: "The full object first: the coproduct in sets is the disjoint union with inclusions i1 and i2, and [f, g] is the unique mediating map, dual to the product with its projections. Reversing the arrows in the equation for p2 gives [f,g] after i2 = g as the second defining equation. The option [f,g] after i2 = f uses the wrong target map. The option [f,g] after i1 = g uses the wrong injection. The option i2 after [f,g] = g reverses the order of composition. The answer is [f,g] after i2 = g."
          - problem: "Write the full proof: in the category of sets, the disjoint union of A and B with the inclusion injections is the coproduct of A and B, obtained by dualizing the product of A and B. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Dualize the product: the product of A and B has projections p1 and p2 such that for all maps f from X to A and g from X to B there is a unique map to the product with p1 after it equal to f and p2 after it equal to g. Step 1, reversal: the coproduct is an object with injections i1 from A and i2 from B such that for all f from A to X and g from B to X there is a unique [f, g] with [f, g] after i1 equal to f and [f, g] after i2 equal to g. Step 2, candidate: take the disjoint union with the inclusion maps. Step 3, existence: the two copies are disjoint, so setting [f, g] equal to f on the copy of A and equal to g on the copy of B is well defined, and it satisfies both equations. Step 4, uniqueness: if h satisfies both equations, then each element lies in exactly one copy, so h agrees with [f, g] there. Step 5, conclusion: the disjoint union with the inclusions satisfies the dual universal property, hence it is the coproduct in sets."
