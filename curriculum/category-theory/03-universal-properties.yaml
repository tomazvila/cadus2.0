        type: basic
      - front: "Pullbacks come from {{c1::products and equalizers}}; pushouts from coproducts and coequalizers."
        back: "products and equalizers"
        type: cloze

  - id: cones-and-cocones
    name: Diagrams, Cones, and Cocones
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: natural-transformations
        weight: 0.5
        key: true
      - id: functors
        weight: 0.3
      - id: products-coproducts
        weight: 0.2
      - id: commutative-diagrams
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: A cone is a natural transformation from a constant functor
        key_prerequisites: [natural-transformations]
        constraints: "Require the learner to use a cone is a natural transformation from a constant functor. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Let D be the cospan of Set maps f:A->C,g:B->C with value lists f=[1,0],g=[0,1,0]. A cone with apex X={0,1} has leg to A with values[0,1] and leg to B with values[1,2]. Construct the remaining leg using the naturality equations for a transformation Delta_X=>D, and check both arrows. Give its value list."
            answer: "1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The constant-functor arrows are identities. Naturality therefore forces the C-leg to equal both composites with the specified A- and B-legs. The resulting answer is 1, 0."
          - problem: "Work in $\\mathbf{Set}$. Let $D$ be the parallel-pair diagram carried by the maps $f, g\\colon A\\to B$ with $A=\\{1,2,3\\}$, $B=\\{0,1\\}$, $f(1)=1$, $f(2)=0$, $f(3)=1$ and $g(1)=0$, $g(2)=0$, $g(3)=1$. A cone over $D$ with apex $X$ is a natural transformation $\\Delta_X\\Rightarrow D$. How many cones over $D$ are there with apex a one-point set $X$?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the cone in full: $\\lambda\\colon\\Delta_X\\Rightarrow D$ with legs $\\lambda_0\\colon X\\to A$ and $\\lambda_1\\colon X\\to B$. Naturality rule at each of the two arrows $f, g\\colon A\\to B$ gives $f\\circ\\lambda_0=\\lambda_1$ and $g\\circ\\lambda_0=\\lambda_1$. Hence $\\lambda_1$ is determined by $\\lambda_0$, and the whole condition is $f\\circ\\lambda_0=g\\circ\\lambda_0$; with a one-point $X$, the leg $\\lambda_0$ is an element $a$ of $A$. Test each element: $a=1$ gives $f(1)=1$ against $g(1)=0$, fails; $a=2$ gives $0=0$, works; $a=3$ gives $1=1$, works. The answer is 2."
          - problem: "Work in $\\mathbf{Set}$. Let $D$ be the span diagram carried by a map $A\\to B$ (its values play no role here) and the map $h\\colon A\\to C$ with $A=\\{1,2,3,4\\}$, $C=\\{0,1,2,3\\}$ and $h(1)=0$, $h(2)=2$, $h(3)=1$, $h(4)=3$. A cone over $D$ with apex the one-point set $X$ is a natural transformation $\\Delta_X\\Rightarrow D$ with legs $\\lambda_A\\colon X\\to A$, $\\lambda_B\\colon X\\to B$ and $\\lambda_C\\colon X\\to C$. The leg $\\lambda_A$ sends the point of $X$ to $3$. Give the value of $\\lambda_C$ at the point of $X$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the cone in full: $\\lambda\\colon\\Delta_X\\Rightarrow D$ with legs $\\lambda_A\\colon X\\to A$, $\\lambda_B\\colon X\\to B$ and $\\lambda_C\\colon X\\to C$. Naturality rule at the arrow of the span shape sent by $D$ to $h\\colon A\\to C$: $D(A\\to C)\\circ\\lambda_A=\\lambda_C$, that is $h\\circ\\lambda_A=\\lambda_C$. Apply it at the point of $X$: $\\lambda_C$ sends that point to $h(\\lambda_A(\\text{point}))=h(3)$. Look up the table of $h$: $h(3)=1$. The answer is 1."
          - problem: "Work in $\\mathbf{Set}$. Let $D$ be the cospan diagram carried by the maps $h\\colon A\\to C$ and $k\\colon B\\to C$ with $A=\\{1,2\\}$, $B=\\{3,4,5\\}$, $C=\\{0,1\\}$, $h(1)=0$, $h(2)=1$, $k(3)=0$, $k(4)=1$ and $k(5)=1$. Recall that a cone over $D$ with apex $X$ is a natural transformation $\\Delta_X\\Rightarrow D$. How many cones over this cospan have a one-point apex $X$?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the cone in full: $\\lambda\\colon\\Delta_X\\Rightarrow D$ with legs $\\lambda_A\\colon X\\to A$, $\\lambda_B\\colon X\\to B$ and $\\lambda_C\\colon X\\to C$. Naturality rule at the two cospan arrows: $h\\circ\\lambda_A=\\lambda_C$ and $k\\circ\\lambda_B=\\lambda_C$. With a one-point apex, $\\lambda_A$ and $\\lambda_B$ pick elements $a\\in A$ and $b\\in B$, and both equations force $\\lambda_C(\\text{point})=h(a)=k(b)$. Count the pairs with $h(a)=k(b)$: $a=1$ needs $k(b)=0$, so $b=3$; $a=2$ needs $k(b)=1$, so $b=4$ or $b=5$. That is $1+2=3$ pairs, each giving exactly one cone. The answer is 3."
          - problem: "Work in $\\mathbf{Set}$. Let $D$ be the parallel-pair diagram carried by the maps $f, g\\colon A\\to B$ with $A=\\{4,5\\}$, $B=\\{4,5,6\\}$, $f(4)=4$, $f(5)=6$, $g(4)=5$ and $g(5)=6$. A cocone under $D$ with apex $X$ is a natural transformation $D\\Rightarrow\\Delta_X$. How many cocones under $D$ are there with apex $X=\\{0,1\\}$?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the cocone in full: $\\mu\\colon D\\Rightarrow\\Delta_X$ with legs $\\mu_A\\colon A\\to X$ and $\\mu_B\\colon B\\to X$. Naturality rule, now read in the direction $D\\Rightarrow\\Delta_X$, forces $\\mu_A=\\mu_B\\circ f$ and $\\mu_A=\\mu_B\\circ g$. Write $h=\\mu_B\\colon B\\to X$; the conditions read $h(f(a))=h(g(a))$ for each $a\\in A$: $h(4)=h(5)$ and $h(6)=h(6)$. So $h(4)=h(5)$ has 2 choices, $h(6)$ has 2 choices, and $\\mu_A$ is then determined by $h\\circ f$. That gives $2\\times 2=4$ cocones. The answer is 4."
          - problem: "Claim: a cone over the cospan $h\\colon A\\to C$, $k\\colon B\\to C$ with apex $X$ is determined by two legs $\\lambda_A\\colon X\\to A$ and $\\lambda_B\\colon X\\to B$ with $h\\circ\\lambda_A=k\\circ\\lambda_B$. Step 1: a cone over this cospan with apex $X$ is a natural transformation $\\Delta_X\\Rightarrow D$. Step 2: its components are $\\lambda_A\\colon X\\to A$, $\\lambda_B\\colon X\\to B$ and $\\lambda_C\\colon X\\to C$. Step 3: naturality at the arrow $h\\colon A\\to C$ reads $\\lambda_C\\circ h=\\lambda_A$. Step 4: naturality at $k$ gives $k\\circ\\lambda_B=\\lambda_C$, so the pair with $h\\circ\\lambda_A=k\\circ\\lambda_B$ determines the cone. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is the definition of a cone over $D$ with apex $X$ as a transformation $\\Delta_X\\Rightarrow D$. Step 2 is valid: components are indexed by the three objects of the cospan shape, giving the legs $\\lambda_A$, $\\lambda_B$, $\\lambda_C$. Step 3 is invalid: for a transformation $\\Delta_X\\Rightarrow D$, naturality at $h\\colon A\\to C$ reads $D(h)\\circ\\lambda_A=\\lambda_C$, that is $h\\circ\\lambda_A=\\lambda_C$; the claimed $\\lambda_C\\circ h$ is not even composable, since $\\lambda_C$ has domain $X$ while $h$ has codomain $C$. Step 4 is a valid consequence once Step 3 is corrected, because eliminating $\\lambda_C$ gives $h\\circ\\lambda_A=k\\circ\\lambda_B$. The answer is Step 3."
          - problem: "Write the full proof: a cone over a diagram $D\\colon\\mathcal J\\to\\mathcal C$ with apex $X$ is exactly a natural transformation $\\Delta_X\\Rightarrow D$, and for the cospan shape this unpacks to the leg equation $h\\circ\\lambda_A=k\\circ\\lambda_B$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: define the constant functor $\\Delta_X\\colon\\mathcal J\\to\\mathcal C$ by $\\Delta_X(j)=X$ for every object $j$ and $\\Delta_X(u)=1_X$ for every arrow $u$. Step 2: a natural transformation $\\lambda\\colon\\Delta_X\\Rightarrow D$ has one component $\\lambda_j\\colon X\\to Dj$ per object $j$ of $\\mathcal J$; these components are the legs of the cone. Step 3: naturality at an arrow $u\\colon j\\to j'$ reads $D(u)\\circ\\lambda_j=\\lambda_{j'}$, which is exactly the leg equation of a cone; hence a cone over $D$ with apex $X$ is the same thing as a transformation $\\Delta_X\\Rightarrow D$. Step 4: for the cospan $h\\colon A\\to C$, $k\\colon B\\to C$ the legs are $\\lambda_A$, $\\lambda_B$, $\\lambda_C$ and the equations read $h\\circ\\lambda_A=\\lambda_C$ and $k\\circ\\lambda_B=\\lambda_C$. Step 5: eliminating $\\lambda_C$ gives $h\\circ\\lambda_A=k\\circ\\lambda_B$, and conversely such a pair determines $\\lambda_C$ uniquely, so a cone over the cospan is exactly such a pair of legs."
      - id: kp2
        name: The category of cones
        key_prerequisites: [products-coproducts]
        constraints: "Give the leg-commuting condition for cone/cocone morphisms and name which extremal object (terminal/initial) yields the (co)limit."
        exemplars:
          - problem: "Work in Set with the discrete diagram D whose two objects are B1 = {p, q} and B2 = {r, s}. Cone (X, lambda) has apex X = {u, v} with legs lambda1(u) = p, lambda1(v) = q, lambda2(u) = r, lambda2(v) = s. Cone (Y, mu) has apex Y = {w, z, t} with legs mu1(w) = p, mu1(z) = q, mu1(t) = p, mu2(w) = r, mu2(z) = s, mu2(t) = r. A morphism of cones from (X, lambda) to (Y, mu) is a map h from X to Y with mu1(h(x)) = lambda1(x) and mu2(h(x)) = lambda2(x) for every x in X. How many such maps h are there?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The leg-commuting condition says mu1(h(x)) = lambda1(x) and mu2(h(x)) = lambda2(x) for every x in X. For x = u: mu1(h(u)) = p forces h(u) in {w, t}, and mu2(h(u)) = r also allows w or t, so 2 choices. For x = v: mu1(h(v)) = q forces h(v) = z, and mu2(z) = s matches lambda2(v) = s, so 1 choice. Multiply the independent choices: 2 times 1 = 2. The answer is 2."
          - problem: "Work in Set. Let D be the discrete diagram with objects B1 = {a} and B2 = {b}. Cocone (X, gamma) has nadir X = {x1, x2, x3} with legs gamma1(a) = x1 and gamma2(b) = x2. Cocone (Y, delta) has nadir Y = {y1, y2, y3} with legs delta1(a) = y1 and delta2(b) = y1. A morphism of cocones from (X, gamma) to (Y, delta) is a map h from X to Y with h(gamma1(a)) = delta1(a) and h(gamma2(b)) = delta2(b). How many such maps h are there?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The leg-commuting condition for cocones is h after gamma_j equals delta_j for each leg j. Leg 1 gives h(x1) = delta1(a) = y1, so 1 choice. Leg 2 gives h(x2) = delta2(b) = y1, so 1 choice. The point x3 lies on no leg, so h(x3) may be any of the 3 points of Y. Multiply the independent choices: 1 times 1 times 3 = 3. The answer is 3."
          - problem: "In Set consider the discrete diagram with two objects, both {0,1}. Cone X has apex {0,1,2} and leg lists [1,0,1] and [0,1,1]. Cone Y has apex {0,1,2,3} and leg lists [0,1,0,1] and [0,0,1,1]. Construct the unique morphism X->Y in the category of cones, deriving its defining equations. Give the apex-map values in X-order. Append 1 if Y is terminal in this category of cones for arbitrary source cones, or 0 otherwise. Check terminality beyond the one displayed source."
            answer: "1, 2, 3, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A cone morphism must make both leg triangles commute, which forces its values. The pairs of Y-leg values cover all binary pairs exactly once, so the same construction supplies a unique apex map from every cone. Thus Y is terminal in the cone category. The resulting answer is 1, 2, 3, 1."
          - problem: "Take the category whose objects are the integers from 1 to 18, with one morphism from m to n exactly when m divides n. Consider the discrete diagram whose two objects are 12 and 8. A cone over this diagram with apex x is a pair of legs, one from x to 12 and one from x to 8, and a morphism of cones is a leg-commuting map. The limit of the diagram is the terminal cone in the category of cones. Find the apex of the terminal cone."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A leg from x to 12 or to 8 means x divides 12 and x divides 8, so the cones are exactly the common divisors: 1, 2, 4. A morphism of cones from x to y is a leg-commuting map, which here means x divides y. The terminal cone receives a unique such map from every other cone, so it is the greatest common divisor. The greatest common divisor of 12 and 8 is 4, the limit of the diagram. The answer is 4."
          - problem: "Take the category whose objects are the integers from 1 to 30, with a single morphism from m to n exactly when m divides n. Consider the discrete diagram whose two objects are 6 and 10. A cocone under this diagram with nadir x is a pair of legs, one from 6 to x and one from 10 to x, and a morphism of cocones is a leg-commuting map. The colimit of the diagram is the initial cocone in the category of cocones. Find the nadir of the initial cocone."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A leg from 6 to x or from 10 to x means 6 divides x and 10 divides x, so the cocones are the common multiples in the range: only 30. A morphism of cocones from x to y is a leg-commuting map, which here means the nadir x divides the nadir y. The initial cocone sends a unique such map to every other cocone, so it is the least common multiple. The least common multiple of 6 and 10 is 30, the colimit of the diagram. The answer is 30."
          - problem: "A student argues about a diagram D in a category C. Claim: the limit of D is the initial object of the category of cones over D. Step 1: a cone over D with apex X is a family of legs from X to the objects of D, commuting with the arrows of D. Step 2: a morphism of cones from (X, lambda) to (Y, mu) is a map h from X to Y with mu_j(h(x)) = lambda_j(x) for every leg j. Step 3: a limit of D is a cone L such that for every cone (X, lambda) there is exactly one morphism of cones from L to (X, lambda). Step 4: an object that sends exactly one morphism to every object is an initial object. Step 5: therefore the limit of D is the initial object of the category of cones. Which step is the first one that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 states the definition of a cone, which is valid. Step 2 states the leg-commuting condition for cone morphisms, which is valid. Step 3 reverses the direction: a limit L must receive exactly one morphism of cones from every cone (X, lambda) to L, not send one out; the property written describes an initial object, so Step 3 is false. Step 4 correctly defines an initial object. Step 5 follows from Steps 3 and 4, but its conclusion is false because Step 3 fails. The first step that is not valid is Step 3."
          - problem: "Write the full proof: let D be a diagram in a category C. Define a morphism of cones over D, prove that the cones over D and their morphisms form a category Cone(D), and prove that a terminal object of Cone(D) is a limit of D. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Definition: a morphism of cones from (X, lambda) to (Y, mu) is a morphism h from X to Y in C with mu_j(h(x)) = lambda_j(x) for every object j of D; this is the leg-commuting condition. Step 1, identities: for a cone (X, lambda), the identity id_X satisfies lambda_j(id_X(x)) = lambda_j(x) for all j, so id_X is a morphism of cones from (X, lambda) to itself. Step 2, composition: if h goes from (X, lambda) to (Y, mu) and k goes from (Y, mu) to (Z, nu) and both are cone morphisms, then nu_j(k(h(x))) = mu_j(h(x)) = lambda_j(x) for all j, so k after h is a morphism of cones from (X, lambda) to (Z, nu). Step 3, laws: identities and composites are those of C, so associativity and identity laws are inherited, and Cone(D) is a category. Step 4, limit: let (L, lambda) be a terminal object of Cone(D); then every cone (X, gamma) admits exactly one morphism of cones h from (X, gamma) to (L, lambda), which is exactly the universal property of the limit cone. Hence a terminal object of Cone(D) is a limit of D."
    diagnostic_exemplar:
      problem: "For the parallel-pair diagram $D=(f,g\\colon A\\to B)$, show that a cone over $D$ with apex $X$ amounts to a single morphism $\\lambda_0\\colon X\\to A$ satisfying $f\\lambda_0=g\\lambda_0$."
      answer: "A cone is a natural transformation $\\Delta_X\\Rightarrow D$ with legs $\\lambda_0\\colon X\\to A$ and $\\lambda_1\\colon X\\to B$. Naturality at the two parallel arrows forces $f\\circ\\lambda_0=\\lambda_1$ and $g\\circ\\lambda_0=\\lambda_1$. So $\\lambda_1$ is determined by $\\lambda_0$, and the two conditions collapse to $f\\lambda_0=g\\lambda_0$: the cone data is exactly a fork $\\lambda_0$ over the pair."
      solution_sketch: "Write out the naturality condition at each of the two parallel arrows: each one forces $\\lambda_1$ to equal one of $f\\lambda_0$, $g\\lambda_0$. So $\\lambda_1$ is redundant and the two conditions fuse into the single fork equation."
