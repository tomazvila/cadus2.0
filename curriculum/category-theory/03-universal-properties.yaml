          - problem: "Repeated span images must be handled by the universal equations. In Set, construct the pushout of C->A and C->B with |A|=3,|B|=2, zero-based elements, and maps f=[0, 0],g=[0, 1]. A cocone to Z has leg values p=[1, 4, 8] on A and q=[1, 1] on B. Label the pushout classes by increasing least tagged index, where A-elements have indices0..2 and B-elements have indices3..4. Give the quotient map on all tagged indices, followed by the induced map from the pushout to Z. Derive the identifications and the factorization from the cocone equations."
