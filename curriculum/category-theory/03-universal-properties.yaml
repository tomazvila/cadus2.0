      - id: kp1
        name: Computing a limit cone in Set
        key_prerequisites: [universal-properties]
        constraints: "Require the learner to use computing a limit cone in set. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Let A be the set with elements 1, 2, 3, 4 and B the set with elements 5, 6. Take the two maps f and g from A to B given by f(1)=5, f(2)=6, f(3)=5, f(4)=6 and g(1)=5, g(2)=5, g(3)=5, g(4)=6. Construct the limit cone of this parallel-pair diagram, representing its apex L as a subset of A, and derive both legs from the cone equations. Give the elements of L in increasing order and the image of the induced leg to B in increasing order."
            answer: "L = 1,3,4; legB = 5,6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "list", "member": {"kind": "exact"}, "ordered": true}, "name": "L"}, {"contract": {"kind": "list", "member": {"kind": "exact"}, "ordered": true}, "name": "legB"}]}
            solution_sketch: "The limit of two parallel maps is the equalizer L, the set of elements x of A with f(x) = g(x), with legs the inclusion into A and the induced map to B. Test each element: f(1) = 5 = g(1), so 1 is in; f(2) = 6 while g(2) = 5, so 2 is out; f(3) = 5 = g(3), so 3 is in; f(4) = 6 = g(4), so 4 is in. The induced leg to B sends 1 and 3 to 5 and 4 to 6, so its image is 5, 6. The answer is L = 1,3,4; legB = 5,6."
          - problem: "Let A be the set with elements 1, 2, 3, let C be the set with the single element 4, and let B be the set with elements 5, 6. The map f from A to B sends 1 to 5, 2 to 6 and 3 to 5, and the map g from C to B sends 4 to 6. Construct the limit cone of the cospan formed by f and g, deriving the conditions on its apex elements from the cone equations. Give the element of the limit as (u, v)."
            answer: "(2,4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The limit of a cospan is the pullback, the full object being the set of pairs (u, v) with u in A, v in C and f(u) = g(v), with legs the two projections. Check every pair: (1,4) fails since f(1) = 5 but g(4) = 6; (2,4) works since f(2) = 6 = g(4); (3,4) fails since f(3) = 5 but g(4) = 6. The legs send this pair to 2 in A and to 4 in C. The answer is (2,4)."
          - problem: "Let A be the set with elements 1, 2, 3, 4, 5 and B the set with elements 7, 8. Take three maps f, g, h from A to B: f(1)=7, f(2)=7, f(3)=8, f(4)=8, f(5)=7; g(1)=7, g(2)=8, g(3)=8, g(4)=8, g(5)=8; h(1)=7, h(2)=8, h(3)=7, h(4)=8, h(5)=8. Construct a limiting cone for the three parallel arrows, representing its apex L as a subset of A; derive the apex condition and both legs. Give the elements of L in increasing order."
            answer: "1,4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "For a diagram with several parallel maps, the limit is the set L of elements of A on which all the maps agree, with legs the inclusion into A and the induced map to B. Check each element: 1 gives 7, 7, 7, so 1 is in; 2 gives 7, 8, 8, out; 3 gives 8, 8, 7, out; 4 gives 8, 8, 8, in; 5 gives 7, 8, 8, out. The leg to B sends 1 to 7 and 4 to 8. The answer is 1,4."
          - problem: "Construct a limit cone in Set for the cospan A->C<-B, where A={0,1,2}, B=C={0,1}, f:A->C has values [0,1,1], and g:B->C has values [1,0]. Represent the apex as pairs (a,b), with the two coordinate projections as legs. List its elements lexicographically, flattened into an ordered list of coordinates."
            answer: "0, 1, 1, 0, 2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The cone equations restrict which coordinate pairs can appear in the apex. Taking every compatible pair gives the universal cone, with flattened list 0, 1, 1, 0, 2, 0."
          - problem: "Let A be the set with elements 1, 2, 3, 4 and C be the set with elements 5, 6, and let B be the set with elements 7, 8. The map f from A to B sends 1 to 7, 2 to 8, 3 to 7 and 4 to 8, and the map g from C to B sends 5 to 8 and 6 to 7. Construct the limit cone of this cospan, deriving the compatible apex elements from the cone equations and explaining the unique mediating map. Find the number of elements of this limit."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The limit of a cospan is the pullback, the full object being the set of pairs (u, v) with u in A, v in C and f(u) = g(v), with legs the two projections to A and to C. For v = 5 the value g(5) = 8, and the elements u of A with f(u) = 8 are 2 and 4, giving the pairs (2,5) and (4,5). For v = 6 the value g(6) = 7, and the elements u with f(u) = 7 are 1 and 3, giving the pairs (1,6) and (3,6). The pullback has the four pairs (1,6), (2,5), (3,6) and (4,5). The answer is 4."
          - problem: "In Set consider the diagram A->B with two parallel arrows B->C. Here A={0,1,2,3}, B={0,1,2}, C={0,1}; f:A->B has values [0,1,2,1], and g,h:B->C have values [0,0,1] and [0,1,1]. Construct its limit cone with apex represented as a subset L of A. Give the elements of L in increasing order, then the corresponding values of the leg to B, then those of the leg to C, all flattened into one ordered list."
            answer: "0, 2, 0, 2, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The cone equations first force the B-coordinate from the A-coordinate and then require both parallel routes to C to agree. The compatible A-elements and their induced legs give 0, 2, 0, 2, 0, 1."
          - problem: "Write the full proof: for maps f, g from a set A to a set B, the set L of elements x of A with f(x) = g(x), with the inclusion leg from L to A and the induced leg from L to B, is a limit of the diagram with the parallel pair f, g in Set. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (cone): by the definition of L, f(i(x)) = g(i(x)) for every x in L, where i is the inclusion, so taking the leg to B to be f restricted to L gives a cone over the parallel pair. Step 2 (cone map): let (X, alpha, beta) be any cone, so f composed with alpha equals beta and g composed with alpha equals beta; hence f(alpha(x)) = g(alpha(x)) for every x in X, which means alpha(x) lies in L. Step 3 (factorization): define u from X to L by u(x) = alpha(x); then i composed with u equals alpha, and the leg to B composed with u equals f composed with alpha, which is beta, so u is a cone map. Step 4 (uniqueness): if u prime also satisfies i composed with u prime equals alpha, then u prime = u because i is injective, so the factorization is unique. Step 5 (conclusion): every cone over the parallel pair factors uniquely through (L, i, f restricted to L), which is exactly the universal property, so L with these legs is a limit."
