            solution_sketch: "Duality requires a map out of the proposed apex whose composites with both injections are the given legs. The shared-copy candidate requires incompatible values, while separate tagged copies determine a unique map. The same piecewise construction works for every target and every pair of legs. The resulting answer is 0, 0, 1, 1, 0, 1."
          - problem: "In Ab, construct the universal arrow from Z direct-sum Z to Z whose restrictions to the two injections are f(n)=3n and g(n)=-2n. Give its matrix entries in the standard bases, then the matrix entries of the composites with the first and second injections."
            answer: "3, -2, 3, -2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A homomorphism out of the coproduct is forced by its values on the injected generators. The two injection equations determine its row matrix uniquely. The resulting answer is 3, -2, 3, -2."
          - problem: "Claim: in the category of sets the coproduct of A and B is the disjoint union with inclusions i1 and i2. Step 1: every element of the disjoint union lies either in the copy of A or in the copy of B. Step 2: define [f, g] to be f on the copy of A and g on the copy of B. Step 3: any map that agrees with f and g on the two copies agrees with [f, g] everywhere. Step 4: therefore [f, g] is unique, and the disjoint union with i1 and i2 is the product of A and B. Which step is the first step that is not valid?"
