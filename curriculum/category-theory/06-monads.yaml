            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Pullback forces points of S to map to 0 and all remaining points to another Omega-point. A singleton Omega misses proper subobjects, two points give a unique choice, and a third point destroys uniqueness. These obstructions are already detected on a singleton X and the same construction works for arbitrary sets. The result is 0, 1, 1, 1, 1, 0."
