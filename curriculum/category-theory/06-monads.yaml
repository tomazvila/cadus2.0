          - problem: "For the maybe monad, an algebra map fixes a chosen basepoint. Test proposed free algebras on generator set A={a,b}. Each candidate below gives carrier size N (points 0,...,N-1), basepoint 0, and the images j(a),j(b): [(2, [0, 1]), (3, [2, 1]), (2, [1, 1])]. For each candidate determine whether every map A->U(B) extends to an algebra map to every pointed set B, and whether that extension is unique when it exists. Give existence,uniqueness bits in candidate order. Derive the free-forgetful bijection from these clauses."
