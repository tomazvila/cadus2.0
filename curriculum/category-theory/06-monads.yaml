    knowledge_points:
      - id: kp1
        name: The data and the types of the whiskered transformations
        key_prerequisites: [whiskering]
        constraints: "Give the type of each whiskered transformation and its component at an object before writing any law."
        exemplars:
          - problem: "A monad on a category C is the data of an endofunctor T : C -> C, a unit eta : Id_C => T, and a multiplication mu : T^2 => T, where T^2 means T after T. Whiskering mu on the left by T produces a natural transformation T mu from T^a to T^b. Give the exponents a and b."
            answer: "a = 3; b = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "The full object is the whiskered transformation T mu : T after T^2 => T after T. Step 1 (whiskering rule): whiskering on the left composes T on the left, so the source functor is T after T^2 = T^3. Step 2 (functor composition): the target functor is T after T = T^2. Hence T mu : T^3 => T^2. The answer is a = 3; b = 2."
          - problem: "On the category of sets, let T be the writer monad for integer addition: T(X) = X × Z, the set of pairs (x, m) with x in X and m an integer; T(f)(x, m) = (f(x), m); unit eta_A(x) = (x, 0); multiplication mu_A((x, m), n) = (x, m + n). Fix a set A that contains 7. The left whiskering of the unit by T is a transformation (T eta)_A : T(A) -> T(T(A)). Compute the value of (T eta)_A at the element (7, 5) of T(A), and give the answer as (x, m, n), coding the element ((x, m), n) of T(T(A))."
            answer: "(7,0,5)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is (T eta)_A = T(eta_A) : T(A) -> T(T(A)). Step 1 (whiskering rule): left whiskering applies the functor T to the component, so (T eta)_A = T(eta_A). Step 2 (action of T on maps): T(eta_A)(x, m) = (eta_A(x), m). Step 3 (unit component): eta_A(7) = (7, 0). So T(eta_A)(7, 5) = ((7, 0), 5). The answer is (7,0,5)."
          - problem: "Let T be the writer monad for integer addition on sets: T(X) = X × Z with T(f)(x, m) = (f(x), m); the unit is eta_A(x) = (x, 0) and the multiplication is mu_A((x, m), n) = (x, m + n). Choose a set A with 4 among its elements. Right whiskering the unit by T gives a transformation (eta T)_A : T(A) -> T(T(A)). Evaluate (eta T)_A at the element (4, 6) of T(A), and give the answer as (x, m, n) for the resulting element ((x, m), n) of T(T(A))."
            answer: "(4,6,0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is (eta T)_A = eta_{T(A)} : T(A) -> T(T(A)). Step 1 (whiskering rule): right whiskering re-indexes the unit at the object T(A). Step 2 (unit component): the unit at the set T(A) sends an element y of T(A) to the pair (y, 0). Step 3 (substitute): eta_{T(A)}(4, 6) = ((4, 6), 0). The answer is (4,6,0)."
          - problem: "For the writer monad for integer addition on sets, T(X) = X × Z, T(f)(x, m) = (f(x), m), eta_A(x) = (x, 0), and mu_B((x, m), n) = (x, m + n) for every set B. Let A be a set containing 5. The right whiskering of the multiplication by T is a transformation (mu T)_A : T^3(A) -> T^2(A). Determine the value of (mu T)_A at the element (((5, 2), 3), 4) of T^3(A), and give the answer as (x, m, n) standing for the element ((x, m), n) of T^2(A)."
            answer: "(5,2,7)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is (mu T)_A = mu_{T(A)} : T^3(A) -> T^2(A). Step 1 (whiskering rule): right whiskering re-indexes, so the component is the multiplication at the object T(A). Step 2 (multiplication component): mu_{T(A)} sends ((y, n), k) to (y, n + k), where y is an element of T(A). Step 3 (substitute): with y = (5, 2), n = 3 and k = 4, the value is ((5, 2), 7). The answer is (5,2,7)."
          - problem: "Let T be the list monad on the category of sets: T(X) is the set of finite lists of elements of X, the unit has component eta_A(x) = [x], and mu_B joins a list of lists into one list by concatenation for every set B. The functor T sends a map f to the entrywise map [l1, l2] -> [f(l1), f(l2)]. At the set A = {u, v, w}, let L = [[[u], [v]], [[w]]], an element of T^3(A). The whiskered transformations (T mu)_A and (mu T)_A both go from T^3(A) to T^2(A) and send L to a list of lists. How many inner lists does each result contain? Give leftcount for (T mu)_A and rightcount for (mu T)_A."
            answer: "leftcount = 2; rightcount = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "leftcount"}, {"contract": {"kind": "exact"}, "name": "rightcount"}]}
            solution_sketch: "The full objects are (T mu)_A = T(mu_A) and (mu T)_A = mu_{T(A)}, both from T^3(A) to T^2(A). Step 1 (left whiskering): T(mu_A) applies mu_A to each entry of L, giving [mu_A([[u], [v]]), mu_A([[w]])] = [[u, v], [w]], a list with 2 inner lists. Step 2 (right whiskering): mu_{T(A)} concatenates the outer level, giving [[u], [v]] followed by [[w]], the list [[u], [v], [w]] with 3 inner lists. The answer is leftcount = 2; rightcount = 3."
          - problem: "A monad (T, eta, mu) on a category has multiplication mu : T^2 => T. A student writes the following. Step 1: whiskering mu on the left by T gives T mu : T^3 => T^2. Step 2: whiskering mu on the right by T gives mu T : T^3 => T^2. Step 3: at an object A, the component of T mu is (T mu)_A = T(mu_A). Step 4: at A, the component of mu T is also T(mu_A), because the two transformations have the same type. Which step is the first one that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: composing on the left with T turns mu : T^2 => T into T after T^2 => T after T, that is T^3 => T^2. Step 2 is valid: composing on the right with T gives T^2 after T => T after T, that is T^3 => T^2. Step 3 is valid: left whiskering applies the functor, so (T mu)_A = T(mu_A). Step 4 is not valid: right whiskering re-indexes the component at the object T(A), so (mu T)_A = mu_{T(A)}, which differs from T(mu_A) in general; equal types do not force equal components. The answer is Step 4."
          - problem: "Write the full proof: if (T, eta, mu) is a monad on a category C, then T mu and mu T are natural transformations from T^3 to T^2, T eta and eta T are natural transformations from T to T^2, and at every object A the components are (T mu)_A = T(mu_A), (mu T)_A = mu_{T(A)}, (T eta)_A = T(eta_A), and (eta T)_A = eta_{T(A)}. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (data): a monad is an endofunctor T : C -> C with natural transformations eta : Id_C => T and mu : T^2 => T, where T^2 = T after T and T^3 = T after T after T. Step 2 (left whiskering of mu): by the whiskering rule, T mu : T after T^2 => T after T, that is T mu : T^3 => T^2, with component (T mu)_A = T(mu_A) : T^3(A) -> T^2(A). Step 3 (right whiskering of mu): mu T : T^2 after T => T after T, that is mu T : T^3 => T^2, with component (mu T)_A = mu_{T(A)}. Step 4 (whiskering the unit): T eta : T after Id_C => T after T, that is T eta : T => T^2, with (T eta)_A = T(eta_A); likewise eta T : Id_C after T => T after T, that is eta T : T => T^2, with (eta T)_A = eta_{T(A)}. Step 5 (naturality): whiskering a natural transformation by a functor on either side is again natural, so all four whiskered transformations are natural with the stated types and components, which completes the proof."
      - id: kp2
        name: The three laws
        key_prerequisites: [natural-transformations]
        constraints: "State each law as an equation between transformations with matching source and target functors."
        exemplars:
          - problem: "Define a monad $(T,\\eta,\\mu)$ on a category $\\mathcal C$ and state its three laws, with the type of each equation."
            answer: "Endofunctor $T$ with $\\eta\\colon 1\\Rightarrow T$, $\\mu\\colon T^2\\Rightarrow T$ and $\\mu\\circ T\\mu=\\mu\\circ\\mu T$ ($T^3\\Rightarrow T$), $\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T$ ($T\\Rightarrow T$)."
            solution_sketch: "A monad is an endofunctor $T\\colon\\mathcal C\\to\\mathcal C$ with natural transformations $\\eta\\colon 1_{\\mathcal C}\\Rightarrow T$ (unit) and $\\mu\\colon T\\circ T\\Rightarrow T$ (multiplication) satisfying: associativity $\\mu\\circ T\\mu=\\mu\\circ\\mu T\\colon T^3\\Rightarrow T$, and the unit laws $\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T\\colon T\\Rightarrow T$. These are the commuting associativity square and the two unit triangles; each side of each equation is a vertical composite of whiskerings."
          - problem: "Write the associativity and unit laws componentwise at an object $A$."
            answer: "$\\mu_A\\circ T(\\mu_A)=\\mu_A\\circ\\mu_{TA}\\colon T^3A\\to TA$, and $\\mu_A\\circ T(\\eta_A)=1_{TA}=\\mu_A\\circ\\eta_{TA}$."
            solution_sketch: "Evaluate each whiskering at $A$. Associativity $\\mu\\circ T\\mu=\\mu\\circ\\mu T$ becomes $\\mu_A\\circ(T\\mu)_A=\\mu_A\\circ(\\mu T)_A$, i.e. $\\mu_A\\circ T(\\mu_A)=\\mu_A\\circ\\mu_{TA}$, both maps $T^3A\\to TA$. The unit laws become $\\mu_A\\circ T(\\eta_A)=1_{TA}$ and $\\mu_A\\circ\\eta_{TA}=1_{TA}$, both maps $TA\\to TA$. Checking a proposed monad amounts to verifying these three equations at every object."
      - id: kp3
        name: First verifications
        key_prerequisites: [poset-monoid-categories]
        constraints: "In the poset case use that hom-sets have at most one element, so the laws are automatic."
        exemplars:
          - problem: "Show that the identity endofunctor $T=1_{\\mathcal C}$ with $\\eta=1$ and $\\mu=1$ satisfies the monad laws."
            answer: "All three laws reduce to $1\\circ 1=1$."
            solution_sketch: "Here $T=1_{\\mathcal C}$, so $T^2=1_{\\mathcal C}$ and $\\eta=\\mu=1_{1_{\\mathcal C}}$. Associativity: $\\mu\\circ T\\mu=1\\circ 1=1=1\\circ 1=\\mu\\circ\\mu T$. Unit laws: $\\mu\\circ T\\eta=1\\circ 1=1_T$ and $\\mu\\circ\\eta T=1\\circ 1=1_T$. All laws hold trivially, so $(1_{\\mathcal C},1,1)$ is the identity monad."
          - problem: "Let $P$ be a poset viewed as a category. Prove that a monad on $P$ is exactly a closure operator (monotone, inflationary, idempotent)."
            answer: "$T$ monotone, $\\eta$ says $x\\le Tx$, $\\mu$ says $TTx\\le Tx$; the laws are automatic and force $TTx=Tx$."
            solution_sketch: "An endofunctor of a poset category is a monotone map $T$. A transformation $\\eta\\colon 1\\Rightarrow T$ is a choice of arrow $x\\to Tx$ for each $x$, i.e. the statement $x\\le Tx$ (inflationary), and $\\mu\\colon T^2\\Rightarrow T$ is $TTx\\le Tx$. All three monad laws are equations between arrows in a thin category, so they hold automatically. Finally, applying the monotone $T$ to $x\\le Tx$ gives $Tx\\le TTx$, and with $TTx\\le Tx$ antisymmetry gives $TTx=Tx$: $T$ is idempotent. Conversely, a closure operator supplies exactly this data, so monads on $P$ are precisely closure operators."
    diagnostic_exemplar:
      problem: "Regard $(\\mathcal P(S),\\subseteq)$ as a poset category and fix a subset $K\\subseteq S$. Define $T(X)=X\\cup K$. Show that $T$ carries the structure of a monad $(T,\\eta,\\mu)$: give the component of $\\eta$ and of $\\mu$ at $X$, give the component of the whiskered transformation $\\mu T$ at $X$ with its type, and check the three monad laws."
      answer: "$T$ is monotone ($X\\subseteq Y$ gives $X\\cup K\\subseteq Y\\cup K$), so it is an endofunctor of the poset category. Unit: $X\\subseteq X\\cup K$, so there is an arrow $\\eta_X\\colon X\\to TX$, and it is the unique one. Since $T^2X=(X\\cup K)\\cup K=X\\cup K=TX$, the arrow $\\mu_X\\colon T^2X\\to TX$ is the identity arrow of $X\\cup K$. Whiskering: $(\\mu T)_X=\\mu_{TX}\\colon T^3X\\to T^2X$, the unique arrow $T(X\\cup K)=X\\cup K\\to X\\cup K$, i.e. again the identity arrow (whereas $(T\\mu)_X=T(\\mu_X)$ is the same arrow here only because $T$ is idempotent on these objects). Laws: $\\mu\\circ T\\mu=\\mu\\circ\\mu T$ ($T^3\\Rightarrow T$) and $\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T$ ($T\\Rightarrow T$) are equations between parallel arrows of a poset category, whose hom-sets have at most one element, so all three hold automatically. Hence $(T,\\eta,\\mu)$ is a monad — precisely the closure operator $X\\mapsto X\\cup K$ (monotone, inflationary, idempotent)."
      solution_sketch: "Note first that $T^2X=TX$ here, so $\\mu_X$ and every whiskering of it are identity arrows on $X\\cup K$. Then the real point: in a thin category all three monad laws are equations between parallel arrows and hold automatically — this monad is precisely the closure operator $X\\mapsto X\\cup K$."
    anki_seeds:
      - front: "A monad is an endofunctor $T$ with two natural transformations: a unit {{c1::$\\eta\\colon 1\\Rightarrow T$}} and a multiplication {{c2::$\\mu\\colon T^2\\Rightarrow T$}}."
        back: "$\\eta\\colon 1\\Rightarrow T$; $\\mu\\colon T^2\\Rightarrow T$"
        type: cloze
      - front: "State the associativity law of a monad $(T,\\eta,\\mu)$."
        back: "$\\mu\\circ T\\mu=\\mu\\circ\\mu T$."
        type: basic
      - front: "State the unit laws of a monad $(T,\\eta,\\mu)$."
        back: "$\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T$."
        type: basic

  - id: monads
    name: Monads
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: monad-definition-laws
        weight: 0.6
        key: true
      - id: natural-transformations
        weight: 0.4
        key: true
      - id: functors
        weight: 0.3
        key: true
      - id: monoids
        weight: 0.3
      - id: functor-categories
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: A monad is a monoid in endofunctors
        key_prerequisites: [monoids]
        constraints: "The monoid analogy only, in the monoidal category $([\\mathcal C,\\mathcal C],\\circ,1_{\\mathcal C})$: match $\\mu$ with the product and $\\eta$ with the unit, and note that composition of endofunctors is strictly associative and unital, so no associator or unitor cells appear."
        exemplars:
          - problem: "A monoid has an underlying object M, a product map m: M x M -> M, and a unit element e: 1 -> M. A monad on a category C is an endofunctor T together with two natural transformations. In the analogy that a monad is a monoid in the category of endofunctors, which one plays the role of the product map m? Select it."
            answer: "mu"
            answer_contract: {"kind": "label", "options": [["mu"], ["eta"], ["T"], ["Id"]]}
            solution_sketch: "Step 1 (monoid object): in the endofunctor category, whose tensor is composition, a monoid object is an endofunctor together with a multiplication and a unit transformation. Step 2 (match the product): the product map m of the monoid corresponds to the multiplication of the monad, written mu, a transformation from the composite T∘T to T. Step 3 (wrong options): eta plays the unit element e, not the product; T is the underlying object, the analogue of M itself; Id is the unit object of the tensor, not a map of the monoid. The answer is mu."
          - problem: "The category of endofunctors of C is monoidal: the tensor of two endofunctors is their composite, and the unit object is the identity functor. For this tensor, the associator and unitor cells that a general monoidal category requires turn out to be trivial, so the monad laws contain no extra cells. The reason is one property of composition as a tensor operation. Which property? Select it."
            answer: "strict"
            answer_contract: {"kind": "label", "options": [["strict"], ["symmetric"], ["braided"], ["cartesian"]]}
            solution_sketch: "Step 1 (the tensor): the tensor is composition of endofunctors, and for any three endofunctors the composites (F∘G)∘H and F∘(G∘H) are equal on the nose, as are 1∘F and F. Step 2 (consequence): this strictness means the associator and unitor cells of the general monoid-object diagrams are identities, so they drop out and leave exactly the plain monad laws. Step 3 (wrong options): symmetric fails because composition is not order-independent; braided fails because there is no braiding for composition; cartesian fails because the tensor is composition, not a categorical product. The answer is strict."
          - problem: "Fix the monoid M = {1, 3, 5, 7} with multiplication modulo 8, whose unit is 1. From M build the monad with T(X) = M x X whose multiplication is the product of M acting on the first entry: the component sends (a, (b, x)) to (ab mod 8, x). Compute the first entry of the image of (5, (7, x))."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: T(X) = M x X with M = {1, 3, 5, 7} under multiplication modulo 8, and the component of the multiplication sends (a, (b, x)) to (ab mod 8, x). Step 1 (monoid product): 5 times 7 is 35. Step 2 (reduce mod 8): 35 = 32 + 3, so 35 mod 8 = 3 and the image is (3, x). The answer is 3."
          - problem: "Let M be the monoid of the integers {0, 1, 2, 3, 4} under addition modulo 5, and let T(X) = M x X with the component of the multiplication sending (a, (b, x)) to (a + b mod 5, x). The monad associativity law compares two whiskered composites on the element (2, (3, (4, x))) of T(T(T(X))). Compute the first entry of the value of the composite mu o Tmu on this element as left, and the first entry of the value of the composite mu o muT on this element as right."
            answer: "left = 4; right = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "left"}, {"contract": {"kind": "exact"}, "name": "right"}]}
            solution_sketch: "Full object: both whiskered composites go from T(T(T(X))) to T(X), and on the element (2, (3, (4, x))) they realize the two bracketings of the triple sum. Step 1 (left composite): Tmu acts inside first, T(mu)(2, (3, (4, x))) = (2, (3 + 4 mod 5, x)) = (2, (2, x)), and then mu(2, (2, x)) = (2 + 2 mod 5, x) = (4, x). Step 2 (right composite): muT acts outside first, mu_TX(2, (3, (4, x))) = (2 + 3 mod 5, (4, x)) = (0, (4, x)), and then mu_X(0, (4, x)) = (0 + 4 mod 5, x) = (4, x). Step 3 (monoid associativity): the first entries agree because addition mod 5 is associative, which is the monoid associativity behind the monad associativity law. The answer is left = 4; right = 4."
          - problem: "In a monoid, a product of four elements can be fully bracketed using the binary product in a certain number of ways, such as ((ab)c)d and a(b(cd)). Under the analogy, each full bracketing corresponds to one transformation from the four-fold composite T∘T∘T∘T down to T built from the monad multiplication by whiskering. How many full bracketings of four elements are there?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the transformations from T∘T∘T∘T to T built from the multiplication and whiskering correspond to the binary trees with four leaves, that is, to the full bracketings of a product a b c d. Step 1 (list): ((ab)c)d, (a(bc))d, (ab)(cd), a((bc)d), a(b(cd)) are the distinct full bracketings. Step 2 (count): the number of full bracketings of n factors is the Catalan number C(n-1), and C(3) = 5. The answer is 5."
          - problem: "Claim: the monad laws must mention coherence cells, because the tensor on the endofunctor category is not strict. Step 1: the objects of the endofunctor category are the endofunctors of C, and the tensor is composition of functors. Step 2: the unit object of this tensor is the identity functor on C. Step 3: a monoid object is an endofunctor T with a multiplication from T∘T to T and a unit from the identity functor to T. Step 4: the composites (T∘T)∘T and T∘(T∘T) are different functors, so an associator cell must be added to the data. Step 5: hence the laws of a monad include coherence with that cell, unlike a plain monoid. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: composition is indeed the tensor of the endofunctor category. Step 2 is valid: the identity functor is the unit object. Step 3 is valid: a monoid object consists of an endofunctor with multiplication and unit transformations. Step 4 is the first invalid step: composition of functors is associative on the nose, so (T∘T)∘T and T∘(T∘T) are the same functor and no associator cell exists. Step 5 is not valid either, but it only inherits the error of Step 4. The answer is Step 4."
          - problem: "Write the full proof: a monad (T, mu, eta) on a category C is exactly a monoid object in the monoidal category ([C, C], ∘, 1_C), and no associator or unitor cells appear because composition of endofunctors is strict. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (monoidal structure): the endofunctor category [C, C] has the endofunctors of C as objects and the natural transformations as morphisms; the tensor of F and G is their composite F∘G, and the unit object is the identity functor 1_C. Step 2 (strictness): composition of functors is associative and unital on the nose, so (F∘G)∘H = F∘(G∘H) and 1_C∘F = F = F∘1_C hold exactly; the associator and unitor cells of a general monoidal category are identities here, so no such cells appear in any law. Step 3 (monoid object): a monoid object in this category is an endofunctor T with a multiplication mu: T∘T ⇒ T and a unit eta: 1_C ⇒ T. Step 4 (associativity law): the monoid associativity diagram, with the strict tensor, says the two whiskered composites mu∘Tmu and mu∘muT from T∘T∘T ⇒ T are equal, which is exactly the monad associativity law. Step 5 (unit laws): the monoid unit diagrams say mu∘etaT = 1_T = mu∘Teta, since the unitors are identities; these are exactly the monad unit laws. Step 6 (conclusion): the data and the laws coincide, so a monad on C is precisely a monoid in ([C, C], ∘, 1_C)."
      - id: kp2
        name: Checking the laws on the power-set monad
        key_prerequisites: [natural-transformations]
        constraints: "The power-set monad on $\\mathbf{Set}$ with $\\eta_A(a)=\\{a\\}$ and $\\mu_A(\\mathcal S)=\\bigcup\\mathcal S$; verify one law at a time by evaluating both legs on a general element of $PA$, $P^2A$ or $P^3A$ and comparing the resulting unions."
        exemplars:
          - problem: "In the power-set monad on sets, take $A = \\{1, 2, 3, 4, 5, 6\\}$ and the subset $S = \\{1, 4, 6\\}$ of $A$. Recall that $\\eta_{PA}(S) = \\{S\\}$ and that $\\mu_A$ takes the union of a family of subsets of $A$. Give the number of elements of $A$ in the set $\\mu_A(\\eta_{PA}(S))$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $\\eta_{PA}(S) = \\{\\{1, 4, 6\\}\\}$, a one-member family in $P^2(A)$. Rule of the step: $\\mu_A$ takes the union of the family, so $\\mu_A(\\eta_{PA}(S)) = \\bigcup \\{\\{1, 4, 6\\}\\} = \\{1, 4, 6\\} = S$. The result equals $S$ itself, which is the unit law $\\mu \\circ \\eta P = 1_P$ checked on this element. The answer is 3."
          - problem: "In the power-set monad, take $A = \\{1, 2, 3, 4, 5, 6\\}$ and the element $\\mathcal{U} = \\{\\{\\{1, 2\\}, \\{3, 4\\}\\}, \\{\\{2, 4\\}\\}\\}$ of $P^3(A)$. One leg of the associativity law applies $P\\mu$ first: it replaces each member family of $\\mathcal{U}$ by the union of its members. Give the number of members of the family $(P\\mu)_A(\\mathcal{U})$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $\\mathcal{U}$ has the member families $\\mathcal{S}_1 = \\{\\{1, 2\\}, \\{3, 4\\}\\}$ and $\\mathcal{S}_2 = \\{\\{2, 4\\}\\}$. Rule of the step: $(P\\mu)_A$ maps each member to its union, giving $\\{\\{1, 2, 3, 4\\}, \\{2, 4\\}\\}$, a family with 2 members. Check of the law: the other leg gives $(\\mu P)_A(\\mathcal{U}) = \\bigcup \\mathcal{U} = \\{\\{1, 2\\}, \\{3, 4\\}, \\{2, 4\\}\\}$, and $\\mu_A$ sends both families to $\\{1, 2, 3, 4\\}$, so the associativity law holds. The answer is 2."
          - problem: "In the power-set monad, take $A = \\{1, 2, \\dots, 20\\}$ and let $S$ be the set of multiples of 3 in $A$. The map $(P\\eta)_A$ sends a subset to its family of singletons $\\{\\{a\\} : a \\in S\\}$, and $\\mu_A$ takes the union of a family. Give the number of elements of $A$ in the set $\\mu_A((P\\eta)_A(S))$."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $S = \\{3, 6, 9, 12, 15, 18\\}$, so $(P\\eta)_A(S) = \\{\\{3\\}, \\{6\\}, \\{9\\}, \\{12\\}, \\{15\\}, \\{18\\}\\}$ in $P^2(A)$. Rule of the step: $\\mu_A$ unions the family, and the union of these singletons is $S$ itself. Hence $\\mu_A((P\\eta)_A(S)) = S$ for this element, which verifies the unit law $\\mu \\circ P\\eta = 1_P$ one element at a time. The answer is 6."
          - problem: "Let $f: \\{1, \\dots, 8\\} \\to \\{1, \\dots, 5\\}$ be given by $f(1) = f(2) = 3$, $f(3) = 1$, $f(4) = f(5) = 2$, $f(6) = f(7) = 5$ and $f(8) = 4$. In the power-set monad, the law that $\\mu$ is natural reads $\\mu_B(P^2 f(\\mathcal{S})) = P f(\\mu_A(\\mathcal{S}))$ for every family $\\mathcal{S}$ in $P^2(A)$. Take $\\mathcal{S} = \\{\\{1, 2, 3\\}, \\{4, 7\\}\\}$. Give the number of elements in the set $\\mu_B(P^2 f(\\mathcal{S}))$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $\\mathcal{S} = \\{\\{1, 2, 3\\}, \\{4, 7\\}\\}$ in $P^2(A)$. Rule of the first step: $P f$ sends a subset to its set of images, so $P f(\\{1, 2, 3\\}) = \\{3, 1\\}$ and $P f(\\{4, 7\\}) = \\{2, 5\\}$, giving $P^2 f(\\mathcal{S}) = \\{\\{1, 3\\}, \\{2, 5\\}\\}$. Rule of the second step: $\\mu_B$ unions this family to $\\{1, 2, 3, 5\\}$. The other leg gives $P f(\\mu_A(\\mathcal{S})) = P f(\\{1, 2, 3, 4, 7\\}) = \\{1, 2, 3, 5\\}$, so $\\mu$ is natural here. The answer is 4."
          - problem: "A student checks the associativity law of the power-set monad on the element $\\mathcal{U} = \\{\\{\\{1, 2\\}, \\{2, 3\\}\\}\\}$ of $P^3(A)$. Step 1: $\\mathcal{U}$ has the single member $\\mathcal{S} = \\{\\{1, 2\\}, \\{2, 3\\}\\}$. Step 2: $(P\\mu)_A(\\mathcal{U})$ equals the union $\\bigcup \\mathcal{U} = \\{\\{1, 2\\}, \\{2, 3\\}\\}$. Step 3: $\\mu_A(\\{\\{1, 2\\}, \\{2, 3\\}\\}) = \\{1, 2, 3\\}$. Step 4: the other leg also gives $\\{1, 2, 3\\}$, so $\\mu \\circ P\\mu = \\mu \\circ \\mu P$. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The object is $\\mathcal{U} = \\{\\{\\{1, 2\\}, \\{2, 3\\}\\}\\}$ with the single member family $\\mathcal{S}$. Step 1 only records this and is valid. Step 2 is not valid: $P\\mu$ acts as $\\mu$ on each member, so $(P\\mu)_A(\\mathcal{U}) = \\{\\{1, 2, 3\\}\\}$, a one-member family; the union $\\bigcup \\mathcal{U}$ is instead the first move of the other leg $\\mu \\circ \\mu P$. Step 3 is a correct union computation, and Step 4 correctly reports the value of the other leg. The answer is Step 2."
          - problem: "In the elementwise verification of the associativity law $\\mu \\circ P\\mu = \\mu \\circ \\mu P$ for the power-set monad, take a general element $U$ of $P^3(A)$, a set whose members are families of subsets of $A$. One line of the argument, the description of $(P\\mu)_A(U)$, is missing. Select the line that correctly gives $(P\\mu)_A(U)$."
            answer: "the family whose members are the unions of the members of U"
            answer_contract: {"kind": "label", "options": [["the family whose members are the unions of the members of U"], ["the union of all subsets of A lying in any member of U"], ["the family of singletons of the members of U"], ["the family whose members are the intersections of the members of U"]]}
            solution_sketch: "The full object is a general $U = \\{\\mathcal{S}_1, \\mathcal{S}_2, \\dots\\}$ where each $\\mathcal{S}_i$ is a family of subsets of $A$. Rule of the step: $P\\mu$ applies $\\mu$, the union of a family, to each member, so $(P\\mu)_A(U) = \\{\\bigcup \\mathcal{S}_1, \\bigcup \\mathcal{S}_2, \\dots\\}$, the family whose members are the unions of the members of $U$. The option with the union of all subsets of $A$ skips ahead to the final value of the whole law. The option with singletons uses $\\eta$ in place of $\\mu$. The option with intersections replaces union by intersection. The answer is the family whose members are the unions of the members of U."
          - problem: "Write the full proof: the power-set monad $P$ on Set, with $\\eta_A(a) = \\{a\\}$ and $\\mu_A(\\mathcal{S}) = \\bigcup \\mathcal{S}$, satisfies the unit law $\\mu \\circ \\eta P = 1_P$, the unit law $\\mu \\circ P\\eta = 1_P$ and the associativity law $\\mu \\circ P\\mu = \\mu \\circ \\mu P$, by evaluating both legs on a general element of $PA$, $P^2(A)$ or $P^3(A)$ and comparing the resulting unions. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Unit law 1: take a general $S$ in $PA$. Step: $\\eta_{PA}(S) = \\{S\\}$ and $\\mu_A(\\{S\\}) = \\bigcup \\{S\\} = S$, so $\\mu \\circ \\eta P = 1_P$. Unit law 2: take a general $S$ in $PA$. Step: $(P\\eta)_A(S) = \\{\\{a\\} : a \\in S\\}$ and $\\mu_A$ unions these singletons back to $S$, so $\\mu \\circ P\\eta = 1_P$. Associativity: take a general $\\mathcal{U}$ in $P^3(A)$. Step: the leg $\\mu \\circ P\\mu$ replaces each member family $\\mathcal{S}$ of $\\mathcal{U}$ by $\\bigcup \\mathcal{S}$ and then unions, giving the set of all $a$ with $a \\in S \\in \\mathcal{S} \\in \\mathcal{U}$ for some $S$ and $\\mathcal{S}$. The leg $\\mu \\circ \\mu P$ first unions the members of $\\mathcal{U}$ and then unions again, giving the same set of elements of $A$. Both legs agree, so the associativity law holds. Conclusion: all three laws hold, so $(P, \\eta, \\mu)$ is a monad."
      - id: kp3
        name: Comonads by duality
        key_prerequisites: [functor-categories]
        constraints: "Obtain every comonad law by reversing the arrows of a monad law; check types with whiskering."
        exemplars:
          - problem: "Define a comonad $(W,\\varepsilon,\\delta)$ on $\\mathcal{D}$ by dualizing the monad axioms, and state its three laws."
            answer: "$\\varepsilon\\colon W\\Rightarrow 1$, $\\delta\\colon W\\Rightarrow W^2$, with $W\\delta\\circ\\delta=\\delta W\\circ\\delta$ and $\\varepsilon W\\circ\\delta=1_W=W\\varepsilon\\circ\\delta$."
            solution_sketch: "A comonad on $\\mathcal{D}$ is exactly a monad on $\\mathcal{D}^{op}$, so reverse every arrow. The unit $\\eta\\colon 1\\Rightarrow T$ becomes a counit $\\varepsilon\\colon W\\Rightarrow 1_{\\mathcal{D}}$ and the multiplication $\\mu\\colon T^2\\Rightarrow T$ becomes a comultiplication $\\delta\\colon W\\Rightarrow W^2$. Coassociativity is $W\\delta\\circ\\delta=\\delta W\\circ\\delta\\colon W\\Rightarrow W^3$ and the counit laws are $\\varepsilon W\\circ\\delta=1_W=W\\varepsilon\\circ\\delta$. Types check: $\\delta\\colon W\\Rightarrow W^2$, $W\\delta,\\delta W\\colon W^2\\Rightarrow W^3$, and $\\varepsilon W,W\\varepsilon\\colon W^2\\Rightarrow W$."
          - problem: "Given an adjunction $F\\dashv G$ with unit $\\eta$ and counit $\\varepsilon$, show that $W=FG$ with counit $\\varepsilon$ and comultiplication $\\delta=F\\eta G$ satisfies the two counit laws."
            answer: "Both counit laws are the two triangle identities: $\\varepsilon_{FGD}\\circ F\\eta_{GD}=1$ and $FG\\varepsilon_D\\circ F\\eta_{GD}=1$."
            solution_sketch: "Types first: $\\eta\\colon 1_{\\mathcal{C}}\\Rightarrow GF$, so $F\\eta G\\colon FG\\Rightarrow FGFG=W^2$, and $\\varepsilon\\colon FG\\Rightarrow 1_{\\mathcal{D}}$ is the counit. At an object $D$: $(\\varepsilon W\\circ\\delta)_D=\\varepsilon_{FGD}\\circ F(\\eta_{GD})$, which is the first triangle identity $\\varepsilon F\\circ F\\eta=1_F$ evaluated at the object $GD$, hence equals $1_{FGD}$. And $(W\\varepsilon\\circ\\delta)_D=FG(\\varepsilon_D)\\circ F(\\eta_{GD})=F\\big(G(\\varepsilon_D)\\circ\\eta_{GD}\\big)=F(1_{GD})=1_{FGD}$, using the second triangle identity $G\\varepsilon\\circ\\eta G=1_G$. So both counit laws hold; coassociativity follows dually from naturality of $\\eta$, making $(FG,\\varepsilon,F\\eta G)$ the comonad dual to the monad $(GF,\\eta,G\\varepsilon F)$."
    diagnostic_exemplar:
      problem: "Fix a set $A$ and define $W\\colon\\mathbf{Set}\\to\\mathbf{Set}$ by $WX=A\\times X$, $Wf=1_A\\times f$, with $\\varepsilon_X(a,x)=x$ and $\\delta_X(a,x)=(a,(a,x))$. Prove that $(W,\\varepsilon,\\delta)$ is a comonad: give the type of each whiskered transformation and check coassociativity and both counit laws elementwise."
      answer: "Types: $\\varepsilon\\colon W\\Rightarrow 1_{\\mathbf{Set}}$ and $\\delta\\colon W\\Rightarrow W^2$; whiskering gives $W\\varepsilon,\\varepsilon W\\colon W^2\\Rightarrow W$ and $W\\delta,\\delta W\\colon W^2\\Rightarrow W^3$, so the counit laws $\\varepsilon W\\circ\\delta=1_W=W\\varepsilon\\circ\\delta$ and the coassociativity law $W\\delta\\circ\\delta=\\delta W\\circ\\delta$ are equations $W\\Rightarrow W$ and $W\\Rightarrow W^3$ — the monad axioms with every arrow reversed. Both $\\varepsilon$ and $\\delta$ are natural (they only copy or discard the $A$-coordinate and commute with $1_A\\times f$). Counit laws: $(\\varepsilon W)_X=\\varepsilon_{WX}$ sends $(a,(a',x))\\mapsto(a',x)$, so on $\\delta_X(a,x)=(a,(a,x))$ it returns $(a,x)$; $(W\\varepsilon)_X=W(\\varepsilon_X)$ sends $(a,(a',x))\\mapsto(a,x)$, so on $(a,(a,x))$ it also returns $(a,x)$. Both composites are $1_{WX}$. Coassociativity: $(W\\delta)_X\\big(\\delta_X(a,x)\\big)=W(\\delta_X)(a,(a,x))=(a,\\delta_X(a,x))=(a,(a,(a,x)))$, while $(\\delta W)_X\\big(\\delta_X(a,x)\\big)=\\delta_{WX}(a,(a,x))=(a,(a,(a,x)))$. The two agree, so $(W,\\varepsilon,\\delta)$ is a comonad."
      solution_sketch: "Reverse every arrow of the monad axioms to fix the types, then chase the pair $(a,x)$ through each composite. $\\delta$ duplicates the $A$-slot and each counit law discards one of the two copies, which is why both return $(a,x)$; coassociativity is the observation that both routes build the same triply nested pair."
    anki_seeds:
      - front: "A monad is a monoid in the category of {{c1::endofunctors}} (under composition)."
        back: "endofunctors"
        type: cloze
      - front: "In the power-set monad, what are $\\eta$ and $\\mu$?"
        back: "$\\eta_A(a)=\\{a\\}$ and $\\mu_A(\\mathcal{S})=\\bigcup\\mathcal{S}$."
        type: basic
      - front: "A comonad $(W,\\varepsilon,\\delta)$ is a monad on which category?"
        back: "$\\mathcal{D}^{op}$ — reverse all arrows: $\\varepsilon\\colon W\\Rightarrow 1$ and $\\delta\\colon W\\Rightarrow W^2$."
        type: basic

  - id: monad-examples
    name: Examples of Monads
    core: false                # examples leaf topic
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: monads
        weight: 0.6
        key: true
      - id: functor-examples
        weight: 0.3
        key: true
      - id: products-coproducts
        weight: 0.2
      - id: exponential-objects
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: The maybe monad
        key_prerequisites: [monads]
        constraints: "The maybe monad $TA=A\\sqcup\\{*\\}$ on $\\mathbf{Set}$; concrete Kleisli composites use explicit finite sets of at most 3 elements, and every answer must say what the composite does on the $*$ branch."
        exemplars:
          - problem: "Describe the 'maybe' monad $TA=A+1$ on $\\mathbf{Set}$: give $\\eta$ and $\\mu$ and why the laws hold."
            answer: "$TA=A\\sqcup\\{*\\}$; $\\eta$ = inclusion; $\\mu$ collapses the two $*$ layers; laws hold since collapsing 'nothing' is unambiguous."
            solution_sketch: "$TA=A\\sqcup\\{*\\}$ (a value or 'nothing'). $\\eta_A\\colon A\\hookrightarrow A\\sqcup\\{*\\}$. $\\mu_A\\colon (A\\sqcup\\{*\\})\\sqcup\\{*\\}\\to A\\sqcup\\{*\\}$ sends $a\\mapsto a$ and both $*$'s to $*$. Unit laws: inserting then collapsing a 'nothing' layer is the identity. Associativity: collapsing three nested layers yields the same result either way. So $(T,\\eta,\\mu)$ is a monad."
          - problem: "In the maybe monad, compute the Kleisli composite $g\\circ_T f$ where $f\\colon\\{1,2\\}\\to\\{a,b\\}+1$ has $f(1)=a$, $f(2)=*$ and $g\\colon\\{a,b\\}\\to\\{x\\}+1$ has $g(a)=*$, $g(b)=x$."
            answer: "$(g\\circ_T f)(1)=*$ and $(g\\circ_T f)(2)=*$."
            solution_sketch: "$g\\circ_T f=\\mu\\circ Tg\\circ f$ with $T=(-)+1$. On $1$: $f(1)=a$, then $Tg(a)=g(a)=*$, then $\\mu(*)=*$. On $2$: $f(2)=*$, then $Tg$ sends this outer 'nothing' to $*$, and $\\mu(*)=*$. Both inputs map to $*$: a 'nothing' anywhere propagates, so Kleisli composition here is composition of partial functions and this composite is nowhere defined."
      - id: kp2
        name: The list monad
        key_prerequisites: [functor-examples]
        constraints: "The list monad $TA=A^*$ with $\\eta_A(a)=[a]$ and $\\mu_A=$ flatten; concrete instances use alphabets of at most 3 letters and words of length at most 3, and answers are written as explicit bracketed lists (the empty list as $[\\,]$)."
        exemplars:
          - problem: "For the list monad $TA=A^*$ with $\\eta_A(a)=[a]$ and $\\mu_A=$ flatten, verify the right unit law $\\mu\\circ T\\eta=1$."
            answer: "$\\mu_A([[a_1],\\dots,[a_n]])=[a_1,\\dots,a_n]=w$."
            solution_sketch: "$T\\eta_A$ maps $w=[a_1,\\dots,a_n]$ to the list of singletons $[[a_1],\\dots,[a_n]]$, and $\\mu_A$ concatenates it back to $[a_1,\\dots,a_n]=w$; so $\\mu\\circ T\\eta=1$. The left unit law $\\mu\\circ\\eta T=1$ and associativity of $\\mu$ are the unit and associativity of list concatenation."
          - problem: "In the list monad, compute the Kleisli composite $g\\circ_T f$ where $f\\colon\\{1\\}\\to\\{a,b\\}^*$ has $f(1)=[a,b]$ and $g\\colon\\{a,b\\}\\to\\{x,y\\}^*$ has $g(a)=[x,y]$, $g(b)=[\\,]$."
            answer: "$(g\\circ_T f)(1)=[x,y]$."
            solution_sketch: "$g\\circ_T f=\\mu\\circ Tg\\circ f$. Start with $f(1)=[a,b]$. Then $Tg$ applies $g$ entrywise, giving $[g(a),g(b)]=[[x,y],[\\,]]$. Finally $\\mu$ flattens by concatenation: $[x,y]\\ast[\\,]=[x,y]$. The empty list from $g(b)$ contributes nothing, matching nondeterministic (relational) composition of the possibilities."
      - id: kp3
        name: The writer monad over a monoid
        key_prerequisites: [monads]
        constraints: "The writer monad $TA=M\\times A$ over an explicitly named monoid, with $(\\mathbb N,+,0)$ as the concrete case; answers are pairs $(m,a)$, and each monad law must be traced back to the corresponding monoid law."
        exemplars:
          - problem: "Work in the writer monad $TA = M \\times A$ over the monoid $(\\mathbb N, +, 0)$, so $\\eta_A(a) = (0, a)$ and $\\mu_A(m, (m', a)) = (m + m', a)$. This $\\mu_A$ flattens a pair of logs into one. Compute $\\mu_A(4, (0, 7))$. Give the answer as (m, a)."
            answer: "(4, 7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full element of $T^2A$ is $(4, (0, 7))$. Apply the rule $\\mu_A(m,(m',a)) = (m+m', a)$: the result is $(4 + 0, 7)$. By the identity law of the monoid $(\\mathbb N, +, 0)$, $4 + 0 = 4$, so the unit law of the monad holds at this element. The answer is (4, 7)."
          - problem: "Work in the writer monad over the monoid $(\\mathbb N, +, 0)$, where a Kleisli arrow sends an input to a pair (log, output) and the Kleisli composite is $g \\circ_T f = \\mu \\circ T g \\circ f$. Let $f(1) = (3, 2)$ and $g(2) = (5, 7)$. Compute $(g \\circ_T f)(1)$. Give the answer as (m, a)."
            answer: "(8, 7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Use the definition of the composite: $g \\circ_T f = \\mu \\circ T g \\circ f$. First apply $f$: $f(1) = (3, 2)$. Then apply $T g$: $T g(3, 2) = (3, g(2)) = (3, (5, 7))$. Then flatten with $\\mu$: $\\mu(3, (5, 7)) = (3 + 5, 7)$, and addition is the monoid operation. The answer is (8, 7)."
          - problem: "Work in the writer monad over the monoid $(\\mathbb N, +, 0)$ with Kleisli composite $g \\circ_T f = \\mu \\circ T g \\circ f$. Let $f(1) = (2, 2)$, $g(2) = (3, 4)$ and $h(4) = (5, 6)$ be Kleisli arrows on finite sets. Compute $\\bigl(h \\circ_T (g \\circ_T f)\\bigr)(1)$. Give the answer as (m, a)."
            answer: "(10, 6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Compose the inner pair first, using $g \\circ_T f = \\mu \\circ T g \\circ f$: $f(1) = (2, 2)$, then $T g(2, 2) = (2, (3, 4))$, then $\\mu(2, (3, 4)) = (5, 4)$. Now compose with $h$: $T h(5, 4) = (5, (5, 6))$, and $\\mu(5, (5, 6)) = (5 + 5, 6)$. The logs add because the monoid operation is addition. The answer is (10, 6)."
          - problem: "A student keeps $\\eta_A(a) = (0, a)$ but replaces the multiplication of the writer monad over $(\\mathbb N, +, 0)$ by $\\mu'_A(m, (m', a)) = (m', a)$, which drops the first log. The unit law $\\mu' \\circ T\\eta = \\mathrm{id}$ then fails. Find the smallest $m$ in $\\mathbb N$ for which $\\mu'(T\\eta(m, a))$ is not equal to $(m, a)$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the full expression: $T\\eta(m, a) = (m, (0, a))$. The student's rule drops the first component, so $\\mu'(T\\eta(m, a)) = (0, a)$. This equals $(m, a)$ exactly when $m = 0$, because $0$ is the identity of $(\\mathbb N, +, 0)$ and no other $m$ is. The first failure is therefore at the next value. The answer is 1."
          - problem: "Over the monoid $(\\mathbb N, +, 0)$, a student claims that taking $\\eta_A(a) = (1, a)$ still yields the writer monad with $\\mu_A(m, (m', a)) = (m + m', a)$, and argues: Step 1: check the unit law $\\mu_A \\circ T\\eta_A = \\mathrm{id}$. Step 2: $T\\eta_A(m, a) = (m, (1, a))$. Step 3: $\\mu_A(m, (1, a)) = (m, a)$. Step 4: hence the unit law holds. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it names the correct unit law to check. Step 2 is valid: $T\\eta_A(m,a) = (m, \\eta_A(a)) = (m, (1,a))$ by the definition of the functor on arrows. Step 3 is not valid: the rule for $\\mu_A$ gives $(m + 1, a)$, not $(m, a)$, since $m + 1 = m$ has no solution in $(\\mathbb N, +, 0)$; the identity element is $0$, not $1$. Step 4 only draws the conclusion from Step 3, so the error starts earlier. The first invalid step is Step 3."
          - problem: "The writer monad can be built over any explicitly named monoid. Take the multiplicative monoid $(\\mathbb N, \\cdot, 1)$, so $\\eta_A(a) = (1, a)$ and $\\mu_A(m, (m', a)) = (m \\cdot m', a)$. Compute $\\mu_A(4, (6, 2))$. Give the answer as (m, a)."
            answer: "(24, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full element of $T^2A$ is $(4, (6, 2))$. The monoid operation here is multiplication, so $\\mu_A$ multiplies the two logs: the first component is $4 \\cdot 6$. By the identity law of $(\\mathbb N, \\cdot, 1)$, the unit of this writer monad logs $1$, and the two logs combine to $24$. The answer is (24, 2)."
          - problem: "Write the full proof: let $(M, \\cdot, e)$ be a monoid; show that the writer functor $TA = M \\times A$ with $\\eta_A(a) = (e, a)$ and $\\mu_A(m, (m', a)) = (m \\cdot m', a)$ is a monad, tracing each monad law back to the corresponding monoid law. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (functor): $Tf(m, a) = (m, f(a))$ preserves identities and composition, so $T$ is a functor. Step 2 (left unit): $\\mu_A(\\eta_{TA}(m, a)) = \\mu_A(e, (m, a)) = (e \\cdot m, a) = (m, a)$ by the left identity law of the monoid. Step 3 (right unit): $\\mu_A(T\\eta_A(m, a)) = \\mu_A(m, (e, a)) = (m \\cdot e, a) = (m, a)$ by the right identity law of the monoid. Step 4 (associativity): both $\\mu \\circ T\\mu$ and $\\mu \\circ \\mu T$ send $(m, (m', (m'', a)))$ to $((m \\cdot m') \\cdot m'', a)$ and $(m \\cdot (m' \\cdot m''), a)$, which are equal by associativity in $M$. Step 5 (conclusion): all three monad laws hold, each reduced to the matching monoid law, so $(T, \\eta, \\mu)$ is a monad."
    diagnostic_exemplar:
      problem: "Work in the writer monad $TA=M\\times A$ over the monoid $M=(\\mathbb N,+,0)$, with $\\eta_A(a)=(0,a)$ and $\\mu_A(m,(m',a))=(m+m',a)$. Let $f(u)=(2,v)$, $g(v)=(3,w)$ and $h(w)=(4,z)$ be Kleisli arrows. Compute $h\\circ_T(g\\circ_T f)$ and $(h\\circ_T g)\\circ_T f$ at $u$, and say whether they agree."
      answer: "Kleisli composition is $g\\circ_T f=\\mu\\circ Tg\\circ f$. First route: $f(u)=(2,v)$, $Tg(2,v)=(2,(3,w))$, $\\mu=(2+3,w)=(5,w)$, so $(g\\circ_T f)(u)=(5,w)$; then $Th(5,w)=(5,(4,z))$ and $\\mu=(5+4,z)=(9,z)$, so $\\big(h\\circ_T(g\\circ_T f)\\big)(u)=(9,z)$. Second route: $Th(g(v))=Th(3,w)=(3,(4,z))$ and $\\mu=(7,z)$, so $(h\\circ_T g)(v)=(7,z)$; then $T(h\\circ_T g)(f(u))=T(h\\circ_T g)(2,v)=(2,(7,z))$ and $\\mu=(2+7,z)=(9,z)$. Both give $(9,z)$ — they agree, as the associativity of Kleisli composition (inherited from the monad associativity law, here from associativity of $+$) requires."
      solution_sketch: "Apply $g\\circ_T f=\\mu\\circ Tg\\circ f$ literally: $T$ leaves the accumulated $\\mathbb N$-tag alone and $\\mu$ adds the two tags. Both bracketings therefore accumulate $2+3+4$, and associativity of $+$ in the monoid is exactly what makes them agree."
    anki_seeds:
      - front: "The maybe monad on $\\mathbf{Set}$: underlying functor $TA$?"
        back: "$A+1$ (a value, or 'nothing')."
        type: basic
      - front: "The list monad on $\\mathbf{Set}$: underlying functor $TA$?"
        back: "$A^*$ (finite lists over $A$)."
        type: basic
      - front: "The writer monad over a monoid $M$: underlying functor $TA$?"
        back: "$M\\times A$ (a value paired with an accumulated $M$-output)."
        type: basic
      - front: "The list monad's multiplication is {{c1::flatten (concatenation)}}."
        back: "flatten (concatenation)"
        type: cloze

