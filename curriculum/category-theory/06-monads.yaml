      - id: kp1
        name: The maybe monad
        key_prerequisites: [monads]
        constraints: "Construct maybe Kleisli composites and recover or test multiplication using both unit laws and associativity. Every relevant branch, including inner and outer stars, must be accounted for."
        step_check:
          step: 'where $Tg$ applies $g$ and leaves any $*$ fixed'
          question: 'Why does $Tg$ leave the extra point $*$ fixed?'
          options:
            - 'Because $g(*)$ is defined to be the first element of $\{x,y\}$'
            - 'Because $\mu$ would otherwise have no extra point left to collapse afterwards'
            - 'Because $T$ applies $g$ to ordinary elements and carries $*$ to itself'
            - 'Because every Kleisli arrow must send $*$ to an ordinary element'
          answer: 'Because $T$ applies $g$ to ordinary elements and carries $*$ to itself'
          why: '$g$ is only defined on the ordinary elements of $A$, so the functor $T$ must send the extra point to the extra point; that is how "no value" propagates through a chain.'
        try_first:
          problem: 'A lookup $f$ gives the age of person $1$ as the number $30$, and gives no value for person $2$. A second lookup $g$ turns the age $30$ into the discount $3$. In the maybe monad, what is $(g\circ_T f)(1)$?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'The composite runs $f$ first and then $g$, so person $1$ gets the discount $3$. If $f$ had given no value, the composite would give no value as well.'
        exemplars:
          - problem: 'Let $T$ be the maybe monad on $\mathbf{Set}$, $T(X)=X\cup\{\ast\}$, where $\ast$ stands for no value. Let $f\colon\{1,2\}\to T(\{5,6\})$ be given by $f(1)=5$, $f(2)=6$, and let $g\colon\{5,6\}\to T(\{7\})$ be given by $g(5)=7$, $g(6)=\ast$. What is $(g\circ_T f)(1)$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite is $\mu\circ Tg\circ f$. At $1$ we have $f(1)=5$, then $Tg(5)=g(5)=7$, and $\mu$ fixes ordinary elements, so the value is $7$.'
          - problem: 'A form lookup gives the office room of each employee, or no room ($\ast$): $f(2)=6$, $f(3)=\ast$, $f(4)=7$, $f(5)=\ast$. A second lookup gives the phone extension of a room, or no extension: $g(6)=5$ and $g(7)=\ast$. In the maybe monad, the composite $g\circ_T f$ gives the extension of an employee, or $\ast$. For how many of the employees $2,3,4,5$ is the composite equal to $\ast$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At employee $2$ we get $g(6)=5$, a real extension. At $3$ and $5$ the first lookup already gives $\ast$, and $Tg$ fixes $\ast$, so the composite is $\ast$. At $4$ we get $g(7)=\ast$. So $\ast$ occurs for employees $3$, $4$ and $5$, which is $3$ employees.'
          - problem: 'Let $T(A)=A\cup\{\ast\}$ be the maybe monad with unit the inclusion $\eta_A$, and let $A=\{1,2\}$. The set $T(T(A))$ has the elements $1$ and $2$ and two extra points, one adjoined by each copy of $T$. The two unit laws determine $\mu_A\colon T(T(A))\to T(A)$. How many elements of $T(T(A))$ must $\mu_A$ send to the extra point of $T(A)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The law $\mu\circ T\eta=1_T$ sends the extra point adjoined by the outer $T$ to the extra point of $T(A)$. The law $\mu\circ\eta T=1_T$ does the same for the extra point of the inner $T$. So both extra points go to $\ast$, which is $2$ elements.'
          - problem: 'Sam defines $\nu\colon T(T(A))\to T(A)$ for the maybe monad on $A=\{1,2\}$ by $\nu(a)=a$ for $a\in A$, $\nu(\ast_{\mathrm{in}})=\ast$ for the extra point of the inner $T$, and $\nu(\ast_{\mathrm{out}})=1$ for the extra point adjoined by the outer $T$. The map $T(\eta_A)$ sends the extra point $\ast$ of $T(A)$ to $\ast_{\mathrm{out}}$. What is $\nu\big(T(\eta_A)(\ast)\big)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We get $T(\eta_A)(\ast)=\ast_{\mathrm{out}}$, and $\nu(\ast_{\mathrm{out}})=1$. The unit law $\nu\circ T\eta=1_T$ would require the value $\ast$ at $\ast$, so it fails: the outer extra point must go to $\ast$, not to the ordinary point $1$.'
          - problem: 'For the maybe monad on $A=\{1\}$, the set $T^3(A)$ consists of the element $1$ and three extra points, one adjoined by each copy of $T$. How many elements of $T^3(A)$ does $\mu_A\circ T(\mu_A)$ send to the extra point of $T(A)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $T(\mu_A)$ followed by $\mu_A$ fixes the ordinary element $1$. Each of the three extra points is collapsed onto the single extra point $\ast$ of $T(A)$, however deeply it is nested. So $3$ elements go to $\ast$, and the other leg $\mu_A\circ\mu_{T(A)}$ does the same.'
          - problem: 'A pipeline of three lookups in the maybe monad: $f\colon\{1,2,3\}\to T(\{2,3\})$ with $f(1)=2$, $f(2)=3$, $f(3)=\ast$; $g\colon\{2,3\}\to T(\{4\})$ with $g(2)=4$, $g(3)=\ast$; and $h\colon\{4\}\to T(\{9\})$ with $h(4)=9$. What is $\big((h\circ_T g)\circ_T f\big)(1)$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $1$ the lookup $f$ gives $2$, then $g(2)=4$, then $h(4)=9$, and no step gives $\ast$. So the composite is $9$, and the other bracketing $h\circ_T(g\circ_T f)$ gives the same value.'
          - problem: 'Write the full proof that the maybe monad $(T,\eta,\mu)$ on $\mathbf{Set}$ with $TA=A\sqcup\{\ast\}$, $\eta_A$ the inclusion of $A$, and $\mu_A$ collapsing the two extra points to one, satisfies both unit laws and the associativity law. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The functor $T=(-)\sqcup\{\ast\}$ sends $g$ to $Tg$, which acts as $g$ on the $A$-part and fixes the extra point, so it preserves identities and composition. The unit $\eta_A$ is the inclusion. For $a\in A$ we have $\mu_A(\eta_{TA}(a))=a$. For any $x\in TA$ the map $T\eta_A$ places $x$ in the inner layer, and $\mu_A$ fixes $A$-elements and collapses the extra point onto $\ast$, so $\mu_A(T\eta_A(x))=x$, also for the extra point. For associativity the set $TTA$ carries two extra layers. Both $\mu_A\circ\mu_{TA}$ and $\mu_A\circ T\mu_A$ send every element of $A$ to itself and every extra point, however nested, to the single extra point of $TA$. So both unit laws and associativity hold.'
      - id: kp2
        name: The list monad
        key_prerequisites: [functor-examples]
        constraints: "Construct list Kleisli substitution and compare the actual law routes, including empty words and a defective multiplication. Grade complete lists or intermediate structures instead of isolated flattening counts."
        step_check:
          step: 'apply $Tg$ entrywise'
          question: 'Why is $Tg$ applied to each entry of the list instead of to the list as a whole?'
          options:
            - 'Because $T$ sends a function to the map that applies it to every entry'
            - 'Because $g$ is a function on single letters, so a whole list is not an input'
            - 'Because applying $g$ to the whole list would reverse the list'
            - 'Because the flattening map $\mu$ cannot act on lists of length one'
          answer: 'Because $T$ sends a function to the map that applies it to every entry'
          why: 'By the definition of the list functor, $Tg$ applies $g$ to every entry; the result is a list of lists, which $\mu$ then flattens into one list.'
        exemplars:
          - problem: 'In the list monad on $\mathbf{Set}$, $\eta_A(a)=[a]$ and $\mu_A$ concatenates a list of lists. Let $f(1)=[4,5]$, $g(4)=[7,8]$ and $g(5)=[9]$. What is the list $(g\circ_T f)(1)$?'
            answer: '[7, 8, 9]'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'The composite is $\mu\circ Tg\circ f$. First $f(1)=[4,5]$. Then $Tg$ gives $[g(4),g(5)]=[[7,8],[9]]$, and $\mu$ concatenates this into $[7,8,9]$.'
          - problem: 'In the list monad let $f(1)=[1,2,3]$, $g(1)=[\,]$ (the empty list), $g(2)=[4,4]$ and $g(3)=[5]$. What is $(g\circ_T f)(1)$?'
            answer: '[4, 4, 5]'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'First $f(1)=[1,2,3]$. Then $Tg$ gives $[[\,],[4,4],[5]]$, and concatenation drops the empty list. The result is $[4,4,5]$.'
          - problem: 'A machine $f$ turns a part numbered $n$ into the two parts $[n,n+10]$, and a second machine $g$ turns a part numbered $n$ into the two parts $[n,2n]$. A factory runs $f$ first and then runs $g$ on every part produced, keeping all parts in order. In the list monad, what list of parts results from the single part $3$?'
            answer: '[3, 6, 13, 26]'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'First $f(3)=[3,13]$. Then $g$ is applied to each part, giving $[[3,6],[13,26]]$. Concatenating gives $[3,6,13,26]$. Running $g$ first would give a different list.'
          - problem: 'In the list monad let $L=[[[1,2],[\,]],[[2]]]$ in $T^3(\mathbb N)$. What is $\mu\big(T\mu(L)\big)$?'
            answer: '[1, 2, 2]'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'The map $T\mu$ concatenates inside each entry of $L$, giving $[[1,2],[2]]$. Then $\mu$ concatenates these two lists into $[1,2,2]$.'
          - problem: 'In the list monad let $L=[[[1,2],[3]],[[4],[5,6]]]$ in $T^3(\mathbb N)$. What is $(T\mu)_{\mathbb N}(L)$?'
            answer: '[[1, 2, 3], [4, 5, 6]]'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $T\mu$ applies $\mu$ to each entry of $L$. The entry $[[1,2],[3]]$ becomes $[1,2,3]$ and the entry $[[4],[5,6]]$ becomes $[4,5,6]$. The result is $[[1,2,3],[4,5,6]]$.'
          - problem: 'Sam proposes a multiplication $\nu$ for the list monad that concatenates all inner lists except the first, so $\nu([[1],[2,3],[4]])=[2,3,4]$. What is $\nu\big(T\eta([1,2,3])\big)$?'
            answer: '[2, 3]'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'The map $T\eta$ wraps every entry, so $T\eta([1,2,3])=[[1],[2],[3]]$. Then $\nu$ drops the first inner list and concatenates $[2]$ and $[3]$, giving $[2,3]$. This is not $[1,2,3]$, so the unit law fails for $\nu$.'
          - problem: 'A box holds the parts $[2,3]$, and each part numbered $k$ is replaced by a list of $k$ screws. In the list monad the composite of these two steps gives one list of screws for the box. How many screws are in that list?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first step gives the list of parts $[2,3]$. The second step gives a list of $2$ screws for part $2$ and a list of $3$ screws for part $3$. Concatenation joins them, so the list has $2+3=5$ screws, not $2\cdot 3$.'
          - problem: 'Write the full proof that for the list monad, where $TA=A^*$ is the set of words over $A$, $\eta_A(a)=[a]$, and $\mu_A$ concatenates a list of words, the unit laws $\mu\circ T\eta=1$ and $\mu\circ\eta T=1$ and the associativity law $\mu\circ T\mu=\mu\circ\mu T$ all hold. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'An element of $TTA$ is a list of words, $\mu_A$ concatenates those words in order, and $T$ applies a function entrywise. For the first unit law, a word $w=[a_1,\dots,a_n]$ gives $T\eta_A(w)=[[a_1],\dots,[a_n]]$, and concatenating the singletons returns $w$. For the second unit law, $\eta_{TA}(w)=[w]$ and $\mu_A([w])=w$. For associativity, let $L$ be a list of lists of words. The leg $\mu_A(T\mu_A(L))$ flattens each inner block first and then concatenates, while $\mu_A(\mu_{TA}(L))$ concatenates block by block first. Both read out every letter in the same left-to-right order because concatenation of words is associative, so all three laws hold.'
      - id: kp3
        name: The writer monad over a monoid
        key_prerequisites: [monads]
        constraints: "Derive writer laws as monoid equations, recover missing unit data, and construct Kleisli composites from log-first pairs. Verify both whiskering orders and diagnose defective operations."
        step_check:
          step: 'using the identity law $m+0=m$'
          question: 'Why does the right unit law reduce to the identity law $m+0=m$?'
          options:
            - 'Because $\mu$ always adds the first log to the value $a$'
            - 'Because $\eta T$ puts the unit $0$ in the first log slot, before the pair $m$'
            - 'Because $0$ is the only log that the monad is allowed to store'
            - 'Because $T\eta$ puts the unit $0$ in the second log slot, next to $m$'
          answer: 'Because $T\eta$ puts the unit $0$ in the second log slot, next to $m$'
          why: '$T\eta(m,a)=(m,(0,a))$, so $\mu$ computes $m+0$; the other unit law places $0$ first and reduces to $0+m=m$.'
        exemplars:
          - problem: 'The writer monad over $(\mathbb N,+,0)$ has $T(A)=\mathbb N\times A$, written (log, value), with $\eta_A(a)=(0,a)$ and $\mu_A(m,(n,a))=(m+n,a)$. Let $f(1)=(3,2)$ and $g(2)=(5,7)$ be Kleisli arrows. What is $(g\circ_T f)(1)$?'
            answer: '(8, 7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The composite is $\mu\circ Tg\circ f$. First $f(1)=(3,2)$. Then $Tg(3,2)=(3,g(2))=(3,(5,7))$, and $\mu$ gives $(3+5,7)=(8,7)$.'
          - problem: 'Let $T(A)=\mathbb Z\times A$ with $\mu(m,(n,a))=(mn,a)$, using integer multiplication of logs, and $\eta(a)=(e,a)$. For which integer $e$ do both unit laws hold?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The unit laws give $\mu(e,(m,a))=(em,a)$ and $\mu(m,(e,a))=(me,a)$. Both equal $(m,a)$ for every $m$ only if $e\cdot m=m$, so $e=1$, the identity of integer multiplication.'
          - problem: 'In the writer monad over $(\mathbb N,+,0)$ let $f(1)=(2,5)$, $g(5)=(3,6)$ and $h(6)=(4,7)$ be Kleisli arrows. What is $\big(h\circ_T(g\circ_T f)\big)(1)$?'
            answer: '(9, 7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'First $(g\circ_T f)(1)=(2+3,6)=(5,6)$. Then $h$ is applied to the value $6$, giving $h(6)=(4,7)$, and the logs add: $(5+4,7)=(9,7)$.'
          - problem: 'A step $f$ takes $30$ seconds on the input $1$ and returns $4$, so $f(1)=(30,4)$ in the writer monad over $(\mathbb N,+,0)$, whose log is the running time in seconds. A step $g$ has $g(4)=(45,9)$. What is $(g\circ_T f)(1)$?'
            answer: '(75, 9)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The two steps run one after the other, so their times add: $30+45=75$ seconds. The result is the value returned by $g$, which is $9$. So $(g\circ_T f)(1)=(75,9)$.'
          - problem: 'Each step of a procedure succeeds with some probability, and the writer monad over $((0,1],\cdot,1)$ multiplies the probabilities of steps that run in sequence. A step $f$ has $f(1)=(0.5,4)$ and a step $g$ has $g(4)=(0.4,9)$. What is $(g\circ_T f)(1)$?'
            answer: '(0.2, 9)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The probabilities of the two steps multiply: $0.5\cdot 0.4=0.2$. The value is the one returned by $g$, which is $9$. So $(g\circ_T f)(1)=(0.2,9)$.'
          - problem: 'A job runs a step $f$ and then a step $g$ in the writer monad over $(\mathbb N,+,0)$, whose log is the running time in seconds. The job took $75$ seconds in all, and the step $g$ took $45$ seconds. How long did the step $f$ take?'
            answer: '30'
            answer_contract: {"kind": "unit", "quantity": "time", "unit": "s", "allow_omitted": true}
            solution_sketch: 'The total time is the sum of the times of the two steps, so $75=t_f+45$. Hence $t_f=75-45=30$ seconds.'
          - problem: 'Sam proposes the multiplication $\nu(m,(n,a))=(m+n+1,a)$ for $T(A)=\mathbb N\times A$, with $\eta(a)=(0,a)$. What is the log of $\nu\big(T\eta(4,a)\big)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $T\eta(4,a)=(4,(0,a))$. Then $\nu$ gives the log $4+0+1=5$. The unit law would need the log $4$, so the unit law fails for $\nu$.'
          - problem: 'Logs in $\mathbb Z$ are combined by subtraction, $\mu(m,(n,a))=(m-n,a)$, with $T(A)=\mathbb Z\times A$ and $\eta(a)=(0,a)$. Apply $\mu_A\circ T(\mu_A)$ and $\mu_A\circ\mu_{TA}$ to the element $(1,(2,(3,a)))$ of $T^3(A)$. What is the absolute value of the difference of the two resulting logs?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $\mu_A\circ T(\mu_A)$ combines the inner logs first: $(1,(2,(3,a)))\mapsto(1,(-1,a))\mapsto(2,a)$. The composite $\mu_A\circ\mu_{TA}$ combines the outer logs first: $(1,(2,(3,a)))\mapsto(-1,(3,a))\mapsto(-4,a)$. The logs $2$ and $-4$ differ by $6$, so associativity fails.'
          - problem: 'Write the full proof that, for a monoid $(M,\cdot,e)$, the writer functor $TA=M\times A$ with $\eta_A(a)=(e,a)$ and $\mu_A(m,(m_2,a))=(m\cdot m_2,a)$ is a monad, tracing each monad law back to the corresponding monoid law. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The functor sends $f$ to $Tf(m,a)=(m,f(a))$, which preserves identities and composition. For the left unit law, $\mu_A(\eta_{TA}(m,a))=\mu_A(e,(m,a))=(e\cdot m,a)=(m,a)$ by the left identity law of the monoid. For the right unit law, $\mu_A(T\eta_A(m,a))=\mu_A(m,(e,a))=(m\cdot e,a)=(m,a)$ by the right identity law. For associativity both legs send $(m,(m_2,(m_3,a)))$ to $((m\cdot m_2)\cdot m_3,a)$ and $(m\cdot(m_2\cdot m_3),a)$, which are equal by associativity in $M$. Each monad law reduces to the matching monoid law, so $(T,\eta,\mu)$ is a monad.'
    diagnostic_exemplar:
      problem: "Work in the writer monad $TA=M\\times A$ over the monoid $M=(\\mathbb N,+,0)$, with $\\eta_A(a)=(0,a)$ and $\\mu_A(m,(m',a))=(m+m',a)$. Let $f(u)=(2,v)$, $g(v)=(3,w)$ and $h(w)=(4,z)$ be Kleisli arrows. Compute $h\\circ_T(g\\circ_T f)$ and $(h\\circ_T g)\\circ_T f$ at $u$, and say whether they agree."
      answer: "Kleisli composition is $g\\circ_T f=\\mu\\circ Tg\\circ f$. First route: $f(u)=(2,v)$, $Tg(2,v)=(2,(3,w))$, $\\mu=(2+3,w)=(5,w)$, so $(g\\circ_T f)(u)=(5,w)$; then $Th(5,w)=(5,(4,z))$ and $\\mu=(5+4,z)=(9,z)$, so $\\big(h\\circ_T(g\\circ_T f)\\big)(u)=(9,z)$. Second route: $Th(g(v))=Th(3,w)=(3,(4,z))$ and $\\mu=(7,z)$, so $(h\\circ_T g)(v)=(7,z)$; then $T(h\\circ_T g)(f(u))=T(h\\circ_T g)(2,v)=(2,(7,z))$ and $\\mu=(2+7,z)=(9,z)$. Both give $(9,z)$ — they agree, as the associativity of Kleisli composition (inherited from the monad associativity law, here from associativity of $+$) requires."
      solution_sketch: "Apply $g\\circ_T f=\\mu\\circ Tg\\circ f$ literally: $T$ leaves the accumulated $\\mathbb N$-tag alone and $\\mu$ adds the two tags. Both bracketings therefore accumulate $2+3+4$, and associativity of $+$ in the monoid is exactly what makes them agree."
    anki_seeds:
      - front: "The maybe monad on $\\mathbf{Set}$: underlying functor $TA$?"
        back: "$A+1$ (a value, or 'nothing')."
        type: basic
      - front: "The list monad on $\\mathbf{Set}$: underlying functor $TA$?"
        back: "$A^*$ (finite lists over $A$)."
        type: basic
      - front: "The writer monad over a monoid $M$: underlying functor $TA$?"
        back: "$M\\times A$ (a value paired with an accumulated $M$-output)."
        type: basic
      - front: "The list monad's multiplication is {{c1::flatten (concatenation)}}."
        back: "flatten (concatenation)"
        type: cloze

  - id: kleisli-categories
    name: Kleisli Categories
    core: false
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: monads
        weight: 0.6
        key: true
      - id: functor-categories
        weight: 0.2
      - id: category-definition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The Kleisli construction
        key_prerequisites: [monads]
        constraints: "Recover Kleisli hom-sets, unit identities and composites from the monad. In the powerset case construct the relation correspondence and its composition; do not give the hom-condition or composition formula before asking only for a count."
        step_check:
          step: 'set $g\circ_T f=\mu_C\circ Tg\circ f\colon A\to TC$'
          question: 'Why does the Kleisli composite need the multiplication $\mu_C$?'
          options:
            - 'Because $\mu_C$ is the identity arrow of the whole Kleisli category'
            - 'Because $Tg\circ f$ lands in $T(TC)$, and $\mu_C$ flattens it to $TC$'
            - 'Because $g$ has to be applied to $A$ before $f$ can be used'
            - 'Because composing two arrows in $\mathcal C$ always needs a unit arrow first'
          answer: 'Because $Tg\circ f$ lands in $T(TC)$, and $\mu_C$ flattens it to $TC$'
          why: '$f\colon A\to TB$ and $Tg\colon TB\to T(TC)$ compose to an arrow into $T(TC)$, so $\mu_C\colon T(TC)\to TC$ is needed to obtain an arrow $A\to TC$.'
        try_first:
          problem: 'Let $T$ be the maybe monad on $\mathbf{Set}$, $T(B)=B\cup\{\ast\}$. How many morphisms from $A=\{1,2,3\}$ to $B=\{u\}$ does its Kleisli category have?'
          answer_contract: {"kind": "exact"}
          answer: '8'
          reveal: 'A Kleisli morphism from $A$ to $B$ is an ordinary function from $A$ to $T(B)$. Here $T(B)$ has $2$ elements and $A$ has $3$, so there are $2^3=8$ such functions.'
        exemplars:
          - problem: 'Let $T$ be the maybe monad on $\mathbf{Set}$, $T(B)=B\cup\{\ast\}$. How many morphisms from $A=\{1\}$ to $B=\{u,v\}$ does its Kleisli category have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Kleisli morphism from $A$ to $B$ is a function from $A$ to $T(B)=\{u,v,\ast\}$. This set has $3$ elements and $A$ has one element, so there are $3$ functions.'
          - problem: 'Direct flights from airports $1$ and $2$ go to airports $4$ and $5$: $f(1)=\{4,5\}$, $f(2)=\{4\}$. Flights from $4$ and $5$ go to $7$ and $8$: $g(4)=\{7\}$ and $g(5)=\{7,8\}$. In the power-set monad the Kleisli composite $g\circ_T f$ lists the airports reachable by one flight of $f$ followed by one flight of $g$. Which airports are reachable from airport $1$?'
            answer: '7, 8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From airport $1$ the flights of $f$ reach $4$ and $5$. Then $g(4)=\{7\}$ and $g(5)=\{7,8\}$, and the composite takes the union. The reachable airports are $7$ and $8$.'
          - problem: 'A Kleisli morphism of the power-set monad is a relation. Let $f(1)=\{4,5\}$, $f(2)=\{4,6\}$, $g(4)=\{7\}$, $g(5)=\{7,8\}$ and $g(6)=\{9\}$. How many pairs $(a,c)$ are related by the composite $g\circ_T f$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite sends $1$ to $g(4)\cup g(5)=\{7,8\}$ and $2$ to $g(4)\cup g(6)=\{7,9\}$. The related pairs are $(1,7)$, $(1,8)$, $(2,7)$ and $(2,9)$, which is $4$ pairs.'
          - problem: 'A phone directory gives the extension of employee $1$ and employee $2$ as $f(1)=3$ and $f(2)=4$, and a second directory gives the room of extension $3$ as $g(3)=5$ but has no entry for extension $4$, so $g(4)=\ast$. In the maybe monad, for which employee $x$ in $\{1,2\}$ is $(g\circ_T f)(x)=\ast$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For employee $1$ we get $f(1)=3$ and $g(3)=5$, a real value. For employee $2$ we get $f(2)=4$ and $g(4)=\ast$. So the composite is $\ast$ at employee $2$.'
          - problem: 'In the list monad the Kleisli identity at $A$ is the unit $\eta_A$. Let $f(1)=[4,5]$ and $f(2)=[6]$. What is $(f\circ_T\eta_A)(1)$?'
            answer: '[4, 5]'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'First $\eta_A(1)=[1]$. Then $Tf([1])=[f(1)]=[[4,5]]$ and $\mu$ concatenates this to $[4,5]$. So composing with the identity returns $f(1)=[4,5]$.'
          - problem: 'The subsets of $\{1,2,3\}$ ordered by inclusion form a poset category, and $T(X)=X\cup\{1\}$ is a monad on it. In its Kleisli category, for how many subsets $B$ is there a morphism from $A=\{2,3\}$ to $B$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Kleisli morphism from $A$ to $B$ is a morphism $A\to T(B)$, which exists when $A\subseteq B\cup\{1\}$. For $A=\{2,3\}$ this means $2,3\in B$, so $B$ is $\{2,3\}$ or $\{1,2,3\}$, which is $2$ subsets.'
          - problem: 'For the power-set monad let $f(1)=\{3,4\}$, $g(3)=\{5,6,7\}$ and $g(4)=\{8,9,10\}$. How many outputs does the relation $g\circ_T f$ relate to $1$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $f(1)=\{3,4\}$. Then $Pg$ gives $\{g(3),g(4)\}=\{\{5,6,7\},\{8,9,10\}\}$ and $\mu$ takes the union $\{5,6,7,8,9,10\}$. This set has $6$ elements.'
          - problem: 'How many morphisms from $A=\{1,2\}$ to $B=\{1,2\}$ are there in the Kleisli category of the power-set monad?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A Kleisli morphism is a function from $A$ to $P(B)$, which is a relation from $A$ to $B$. The set $P(B)$ has $4$ elements and $A$ has $2$, so there are $4^2=16$ functions.'
          - problem: 'Write the full proof that for the power-set monad $P$ on $\mathbf{Set}$ a Kleisli morphism from $A$ to $B$ is exactly a relation from $A$ to $B$, the Kleisli identity on $A$ is the diagonal relation, and Kleisli composition is relational composition. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The objects of the Kleisli category are sets, and a morphism from $A$ to $B$ is a function $f\colon A\to P(B)$. Given $f$, define $a\,R\,b$ when $b\in f(a)$, and given a relation $R$ define $f(a)=\{b:a\,R\,b\}$. These two constructions are inverse, so Kleisli morphisms are exactly relations. The unit sends $a$ to $\{a\}$, which is the diagonal relation. For $f\colon A\to P(B)$ and $g\colon B\to P(C)$ the composite sends $a$ to the union of the sets $g(b)$ over $b\in f(a)$, that is the set of $c$ with some $b$ such that $a\,R\,b$ and $b\,S\,c$, which is relational composition. The bijection preserves identities and composition, so the Kleisli category is isomorphic to the category of relations.'
      - id: kp2
        name: The Kleisli laws come from the monad laws
        key_prerequisites: [monads]
        constraints: 'Prove Kleisli identity, composition and associativity laws by explicit definition substitution, functoriality, naturality and monad equations. Grade typed arrow paths through the exponent of $T$, concrete Kleisli computations in the list, power-set and writer monads, and audits of a derivation step by step.'
        step_check:
          step: 'Apply naturality of $\mu$ at $h$'
          question: 'Why is naturality of $\mu$ at $h$ the tool that turns $Th\circ\mu_C$ into an expression with $\mu_{TD}$?'
          options:
            - 'Because $\mu$ is the unit of the monad, so it can be removed from any composite'
            - 'Because naturality says that $\mu_C$ and $\mu_D$ are the same arrow'
            - 'Because naturality is the associativity law written for the arrow $h$'
            - 'Because a natural transformation commutes with $h$, so $h$ moves past $\mu$'
          answer: 'Because a natural transformation commutes with $h$, so $h$ moves past $\mu$'
          why: 'The naturality square of $\mu$ at $h\colon C\to TD$ says $Th\circ\mu_C=\mu_{TD}\circ T^2h$, which moves $h$ to the other side of the multiplication and brings in a second $\mu$.'
        exemplars:
          - problem: 'A search pipeline: query $1$ returns the documents $[2,3]$; each document returns its sections, $g(2)=[4]$ and $g(3)=[5,5]$; each section returns its paragraphs, $h(4)=[6,7]$ and $h(5)=[8]$. In the Kleisli category of the list monad, what is $\big((h\circ_T g)\circ_T f\big)(1)$, where $f(1)=[2,3]$?'
            answer: '[6, 7, 8, 8]'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'First $h\circ_T g$ sends $2$ to $[6,7]$ and $3$ to $[8,8]$. Then $(h\circ_T g)\circ_T f$ applies this to $f(1)=[2,3]$ and concatenates, giving $[6,7,8,8]$. The other bracketing gives $g\circ_T f(1)=[4,5,5]$ and then the same list $[6,7,8,8]$.'
          - problem: 'In the Kleisli category of the power-set monad the identity at $B$ is $\eta_B(b)=\{b\}$. For $f(1)=\{2,5\}$, what is $(\eta_B\circ_T f)(1)$?'
            answer: '2, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite is $\mu\circ T\eta_B\circ f$. First $f(1)=\{2,5\}$, then $T\eta_B$ gives $\{\{2\},\{5\}\}$, and $\mu$ takes the union $\{2,5\}$. So the composite returns $f(1)$.'
          - problem: 'A step $f$ with $f(1)=(4,7)$ runs for $4$ seconds and returns $7$. In the writer monad over $(\mathbb N,+,0)$ the Kleisli identity is $\eta_A(a)=(0,a)$. What is $(f\circ_T\eta_A)(1)$?'
            answer: '(4, 7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'First $\eta_A(1)=(0,1)$. Then $Tf(0,1)=(0,f(1))=(0,(4,7))$, and $\mu$ gives $(0+4,7)=(4,7)$. So composing with the identity changes nothing.'
          - problem: 'Let $f\colon A\to TB$, $g\colon B\to TC$ and $h\colon C\to TD$. The Kleisli composite $h\circ_T(g\circ_T f)$ equals $\mu_D\circ\mu_{TD}\circ T^2h\circ Tg\circ f$. The target of $T^2h$ is $T^nD$ for some $n$. What is $n$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $h\colon C\to TD$, applying $T$ twice gives $T^2h\colon T^2C\to T^2(TD)=T^3D$. So $n=3$, because $T^2$ is applied to the target $TD$ of $h$. The arrow $\mu_{TD}\colon T^3D\to T^2D$ then continues from this target.'
          - problem: 'Writing out $g\circ_T f=\mu_C\circ Tg\circ f$ uses one copy of $\mu$. After writing the Kleisli composite of a chain of five arrows $f_1,\dots,f_5$ as one expression in $\mu$, $T$ and the $f_i$, how many copies of $\mu$ does it contain?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each Kleisli composition of two arrows adds exactly one copy of $\mu$, and a chain of five arrows is joined by $4$ compositions. Associativity of the Kleisli composite means the bracketing does not change the count. So the expression contains $4$ copies of $\mu$.'
          - problem: 'In the Kleisli category of the list monad, let $f(1)=[3,2]$, $g(2)=[7,7]$ and $g(3)=[8]$. What is $(g\circ_T f)(1)$?'
            answer: '[8, 7, 7]'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'The composite is $\mu\circ Tg\circ f$. First $Tg$ turns $[3,2]$ into $[[8],[7,7]]$, and then $\mu$ concatenates this to $[8,7,7]$.'
          - problem: 'Write the full proof that, for a monad $(T,\eta,\mu)$ on a category $\mathcal C$ whose Kleisli composite is $g\circ_T f=\mu_C\circ Tg\circ f$, the operation $\circ_T$ is associative. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Take $f\colon A\to TB$, $g\colon B\to TC$ and $h\colon C\to TD$. By the definition of $\circ_T$ and functoriality of $T$, $(h\circ_T g)\circ_T f=\mu_D\circ T(\mu_D\circ Th\circ g)\circ f=\mu_D\circ T\mu_D\circ T^2h\circ Tg\circ f$. On the other side, $h\circ_T(g\circ_T f)=\mu_D\circ Th\circ\mu_C\circ Tg\circ f$. The monad associativity law $\mu\circ T\mu=\mu\circ\mu T$ gives $\mu_D\circ T\mu_D=\mu_D\circ\mu_{TD}$, so the left side becomes $\mu_D\circ\mu_{TD}\circ T^2h\circ Tg\circ f$. The naturality square of $\mu$ at $h$ gives $\mu_{TD}\circ T^2h=Th\circ\mu_C$, so this equals $\mu_D\circ Th\circ\mu_C\circ Tg\circ f$, the expression for the right side. Hence $\circ_T$ is associative.'
    diagnostic_exemplar:
      problem: "Let $T$ be a monad on $\\mathcal C$ and $\\mathcal C_T$ its Kleisli category, with $\\mathcal C_T(A,B)=\\mathcal C(A,TB)$, identities $\\eta_A$ and composition $g\\circ_T f=\\mu_C\\circ Tg\\circ f$. Prove that $\\eta$ is a two-sided identity for $\\circ_T$: for every $f\\colon A\\to TB$, $\\eta_B\\circ_T f=f$ and $f\\circ_T\\eta_A=f$. Name the monad law or naturality square used at each step."
      answer: "Right identity for $\\eta_B$: $\\eta_B\\circ_T f=\\mu_B\\circ T(\\eta_B)\\circ f=(\\mu\\circ T\\eta)_B\\circ f=1_{TB}\\circ f=f$, using the monad unit law $\\mu\\circ T\\eta=1_T$ at $B$. Left identity for $\\eta_A$: $f\\circ_T\\eta_A=\\mu_B\\circ Tf\\circ\\eta_A$. Naturality of $\\eta\\colon 1\\Rightarrow T$ at the morphism $f\\colon A\\to TB$ gives $Tf\\circ\\eta_A=\\eta_{TB}\\circ f$, so this equals $\\mu_B\\circ\\eta_{TB}\\circ f=(\\mu\\circ\\eta T)_B\\circ f=1_{TB}\\circ f=f$, using the other monad unit law $\\mu\\circ\\eta T=1_T$ at $B$. So $\\eta_A$ is a two-sided identity at $A$ in $\\mathcal C_T$."
      solution_sketch: "Two different laws do the two sides. $\\eta_B\\circ_T f$ unfolds straight to $(\\mu\\circ T\\eta)_B\\circ f$, one unit law. The other side, $f\\circ_T\\eta_A$, first needs naturality of $\\eta$ at $f$ to move $\\eta$ past $Tf$, and only then the second unit law $\\mu\\circ\\eta T=1_T$."
    anki_seeds:
      - front: "In the Kleisli category $\\mathcal C_T$, what is a morphism $A\\to B$?"
        back: "a $\\mathcal C$-morphism $A\\to TB$."
        type: basic
      - front: "What is the identity on $A$ in the Kleisli category $\\mathcal C_T$?"
        back: "the monad unit $\\eta_A\\colon A\\to TA$."
        type: basic
      - front: "Kleisli composition of $f\\colon A\\to TB$, $g\\colon B\\to TC$ is {{c1::$\\mu_C\\circ Tg\\circ f$}}."
        back: "$\\mu_C\\circ Tg\\circ f$"
        type: cloze

  - id: algebras-over-monads
