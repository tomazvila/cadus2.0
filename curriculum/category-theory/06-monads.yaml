    knowledge_points:
      - id: kp1
        name: Eilenberg-Moore algebras
        key_prerequisites: [monads]
        constraints: "State the two laws $a\\circ\\eta_A=1_A$ and $a\\circ\\mu_A=a\\circ Ta$ and the morphism condition $f\\circ a=b\\circ Tf$ before any identification; the concrete monad is the maybe monad on $\\mathbf{Set}$, whose algebras are read off as pointed sets."
        exemplars:
          - problem: "For the maybe monad on Set, TX is X with a fresh point adjoined, T acts by extending maps to fix the fresh point, the unit is inclusion, and multiplication identifies the inner and outer fresh points. Take A={1,3,9}. Starting from the two Eilenberg-Moore algebra laws, classify every map a:TA->A according to which laws it satisfies. Give the counts in this order: both laws; unit law only; associativity law only; neither law. Derive the associativity condition on all three types of element of TTA, rather than assuming the pointed-set identification."
            answer: "3, 0, 15, 63"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The unit law forces the restriction of a to A to be the identity. Writing that restriction as h and a(star)=p, associativity requires h squared=h and h(p)=p; these conditions come respectively from ordinary and inner fresh points, while the outer fresh point imposes no new condition. Enumerating idempotent restrictions and their fixed points gives the four disjoint classes. The result is 3, 0, 15, 63."
          - problem: "For the maybe monad on Set, T(A)=A+{*} with inclusion unit and flattening multiplication. On A={2,7}, an algebra a:TA->A has a(*)=2. Derive its values on ordinary elements from the algebra laws. Give a(2),a(7),a(*) in order."
            answer: "2, 7, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object is the structure map $a\\colon \\{2,7,\\ast\\} \\to \\{2,7\\}$ of the algebra with basepoint $2$. Step 1 (unit law): $a\\circ\\eta_A = 1_A$ forces $a(2) = 2$ and $a(7) = 7$, because $\\eta_A$ includes $A$ into $TA$. Step 2 (basepoint): the algebra is the pointed set with basepoint $a(\\ast)$, so $a(\\ast) = 2$. Reading the values in the requested order gives 2, 7, 2. The answer is 2, 7, 2."
          - problem: "For the maybe monad, TX=X+{star}, the unit is inclusion, multiplication merges the two fresh points, and T extends functions by fixing the fresh point. Let A={4,5}, B={6,9}, f(4)=9,f(5)=6. Reconstruct every pair of structure maps a:TA->A and b:TB->B for which both are Eilenberg-Moore algebras and f is an algebra morphism. Start by stating both algebra laws and the morphism equation, and check all kinds of points before identifying the resulting structures. Give the possible pairs (a(star),b(star)), sorted by their first coordinate, as one flattened list."
            answer: "4, 9, 5, 6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The unit law fixes all ordinary values, and associativity on ordinary, inner-fresh, and outer-fresh points permits each choice of fresh-point image. The morphism square on ordinary points is automatic; at the fresh point it relates the two reconstructed choices through f, giving exactly the listed pairs. The result is 4, 9, 5, 6."
          - problem: "Let T be the maybe monad: TX=X+{star}, with inclusion unit, multiplication merging the two fresh points, and functions extended to fix star. On B={3,7}, an unknown algebra structure b has b(star)=7. Let A={1,6,8} and f:A->B have values [3,7,3] in the displayed order. Reconstruct the entire maps a:TA->A and b:TB->B such that both algebra laws hold and f is an algebra morphism. Give the a-values at 1,6,8,star followed by the b-values at 3,7,star. Derive the laws and check both levels of fresh points; no algebra/pointed-set correspondence may be assumed."
            answer: "1, 6, 8, 6, 3, 7, 7"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The unit equations determine each ordinary value and associativity then allows precisely a choice of fresh-point image in each carrier. Applying the algebra-morphism equation at star forces f(a(star))=7, so its unique preimage fixes the remaining unknown; the ordinary-point equations also hold. The result is 1, 6, 8, 6, 3, 7, 7."
          - problem: "For the maybe monad TX=X+{star}, with inclusion unit and multiplication merging fresh points, take A={1,2,3} and B={5,6}. Derive the possible Eilenberg-Moore structure maps and their morphisms directly from the two algebra laws and the morphism equation. Count triples (a,b,f), where a:TA->A and b:TB->B are algebra structures and f:A->B is an algebra morphism. Give separately the number with f injective, the number with f surjective, and the number with f neither injective nor surjective. Both structures vary; their correspondence with pointed sets is not supplied."
            answer: "0, 18, 6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Unit and associativity show that each structure is determined by an arbitrary fresh-point image. The morphism equation requires f to take the chosen image in A to that in B. For each of the six pairs of choices there are four such functions, three surjective and one constant; a three-element carrier admits no injection into a two-element carrier. The result is 0, 18, 6."
          - problem: "For the maybe monad TX=X+{star}, with inclusion unit and multiplication merging fresh points, audit two proposed derivations of its algebras. Each uses a:TA->A, h=a restricted to A, and p=a(star). Derivation A: Step 1, the algebra unit law forces h=identity; Step 2, the associativity law on ordinary points says h squared=h; Step 3, at the inner fresh point it says h(p)=p; Step 4, at the outer fresh point it forces p to be the unique element of A. Derivation B: Steps 1–3 are identical; Step 4, the outer fresh point imposes the tautology p=p, so any choice of p gives an algebra. For each derivation give its first invalid step, or 0 if all steps are valid. Reconstruct mu_A and T(a) on the ordinary, inner-fresh and outer-fresh cases to justify the verdicts."
            answer: "4, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two associativity composites on ordinary points give h and h squared, and on the inner fresh point give p and h(p). On the outer fresh point they both give p, so the algebra laws require no uniqueness of the chosen point in the carrier; distinct choices produce distinct algebras. The result is 4, 0."
          - problem: "Write the full proof: for the maybe monad $T$ on $\\mathbf{Set}$ with $TX = X \\cup \\{\\ast\\}$, unit the inclusion and $\\mu_X$ the flattening map, the $T$-algebras $(A,a)$ — maps $a\\colon TA \\to A$ with $a\\circ\\eta_A = 1_A$ and $a\\circ\\mu_A = a\\circ Ta$ — are exactly the pointed sets $(A,p)$ with basepoint $p = a(\\ast)$, and a function $f$ is a morphism exactly when it preserves the basepoint. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "State the laws before any identification: the unit law $a\\circ\\eta_A = 1_A$, the associativity law $a\\circ\\mu_A = a\\circ Ta$, and the morphism condition $f\\circ a = b\\circ Tf$. Step 1 (unit law): $\\eta_A$ includes $A$ into $A \\cup \\{\\ast\\}$, so $a\\circ\\eta_A = 1_A$ forces $a(x) = x$ for every $x$ in $A$; the only remaining datum is the element $p = a(\\ast)$ of $A$. Step 2 (associativity law): check the three kinds of points of $T^2A = (A \\cup \\{\\ast\\}) \\cup \\{\\ast\\}$. On $x$ in $A$ both composites give $x$; on the inner point $\\ast$ the left side is $a(\\ast) = p$ and the right side is $a(a(\\ast)) = a(p) = p$; on the outer point both flatten it to $\\ast$ and give $p$ again. So every $p$ in $A$ gives an algebra with $a$ the identity on $A$ and $a(\\ast) = p$, and the two laws force exactly this shape. Step 3 (morphisms): the condition $f\\circ a = b\\circ Tf$ on elements of $A$ is automatic, and at the fresh point it reads $f(p) = q$, which is precisely basepoint preservation. Conclusion: the $T$-algebras are exactly the pointed sets and their morphisms are exactly the basepoint-preserving maps."
      - id: kp2
