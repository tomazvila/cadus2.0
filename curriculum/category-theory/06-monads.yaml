    knowledge_points:
      - id: kp1
        name: Eilenberg-Moore algebras
        key_prerequisites: [monads]
        constraints: "State the two laws $a\\circ\\eta_A=1_A$ and $a\\circ\\mu_A=a\\circ Ta$ and the morphism condition $f\\circ a=b\\circ Tf$ before any identification; the concrete monad is the maybe monad on $\\mathbf{Set}$, whose algebras are read off as pointed sets."
        exemplars:
          - problem: "For the maybe monad $T$ on $\\mathbf{Set}$ one has $TX = X \\cup \\{\\ast\\}$ with a fresh point $\\ast$, unit $\\eta_X$ the inclusion of $X$, and multiplication $\\mu_X$ the flattening map. A $T$-algebra is a map $a\\colon TA \\to A$ with $a\\circ\\eta_A = 1_A$ and $a\\circ\\mu_A = a\\circ Ta$, and a morphism of $T$-algebras satisfies $f\\circ a = b\\circ Tf$. Take $A = \\{1,3,9\\}$ and the map $a$ that keeps $3$ and $9$ fixed, sends $1$ to $9$ and sends $\\ast$ to $3$. State whether the unit law $a\\circ\\eta_A = 1_A$ is satisfied, and give a point of $A$ at which it breaks if it is not."
            answer: "law = fails; witness = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "law"}, {"contract": {"kind": "exact"}, "name": "witness"}]}
            solution_sketch: "The full object is the map $a\\colon TA \\to A$ with $a(1) = 9$, $a(3) = 3$, $a(9) = 9$ and $a(\\ast) = 3$. Step 1 (unit law): $\\eta_A$ includes $A$ into $TA$, so the unit law asks for $a(x) = x$ at every $x$ in $A$. Step 2 (check each point): $a(3) = 3$ and $a(9) = 9$ are fine, but $a(1) = 9 \\ne 1$, so the law breaks at the point $1$. The answer is law = fails; witness = 1."
          - problem: "For the maybe monad $T$ on $\\mathbf{Set}$, with $TX = X \\cup \\{\\ast\\}$ for a fresh point $\\ast$, unit the inclusion and $\\mu_X$ the flattening map, a $T$-algebra $a\\colon TA \\to A$ satisfies $a\\circ\\eta_A = 1_A$ and $a\\circ\\mu_A = a\\circ Ta$, and a morphism of $T$-algebras satisfies $f\\circ a = b\\circ Tf$; such an algebra is read off as the pointed set with basepoint $a(\\ast)$. Take $A = \\{2,7\\}$ and the algebra whose basepoint is $2$. Give the three values $a(2)$, $a(7)$ and $a(\\ast)$, in that order, as a list."
            answer: "2, 7, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object is the structure map $a\\colon \\{2,7,\\ast\\} \\to \\{2,7\\}$ of the algebra with basepoint $2$. Step 1 (unit law): $a\\circ\\eta_A = 1_A$ forces $a(2) = 2$ and $a(7) = 7$, because $\\eta_A$ includes $A$ into $TA$. Step 2 (basepoint): the algebra is the pointed set with basepoint $a(\\ast)$, so $a(\\ast) = 2$. Reading the values in the requested order gives 2, 7, 2. The answer is 2, 7, 2."
          - problem: "With the maybe monad $T$ on $\\mathbf{Set}$, where $TX = X \\cup \\{\\ast\\}$ for a fresh point $\\ast$, unit the inclusion and $\\mu_X$ the flattening map, a $T$-algebra $a\\colon TA \\to A$ satisfies $a\\circ\\eta_A = 1_A$ and $a\\circ\\mu_A = a\\circ Ta$, and a morphism of $T$-algebras satisfies $f\\circ a = b\\circ Tf$. Let $(A,a)$ have $A = \\{4,5\\}$ with $a$ the identity on $A$ and $a(\\ast) = 4$, and let $(B,b)$ have $B = \\{6,9\\}$ with $b$ the identity on $B$ and $b(\\ast) = 6$. Let $f\\colon A \\to B$ send $4$ to $9$ and $5$ to $6$. Decide whether $f$ is a morphism of $T$-algebras, and give the value $f(a(\\ast))$."
            answer: "verdict = no; fbase = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "fbase"}]}
            solution_sketch: "The full objects are $(A,a)$ with $A = \\{4,5\\}$, $a(4) = 4$, $a(5) = 5$, $a(\\ast) = 4$; $(B,b)$ with $B = \\{6,9\\}$, $b(6) = 6$, $b(9) = 9$, $b(\\ast) = 6$; and $f$ with $f(4) = 9$, $f(5) = 6$. Step 1 (morphism condition at the fresh point): since $Tf$ sends the fresh point to the fresh point, the condition $f\\circ a = b\\circ Tf$ at $\\ast$ reads $f(a(\\ast)) = b(\\ast)$. Step 2 (compute): $f(a(\\ast)) = f(4) = 9$, while $b(\\ast) = 6$, so the two sides differ and the condition is not met. The answer is verdict = no; fbase = 9."
          - problem: "With the maybe monad $T$ on $\\mathbf{Set}$, $TX = X \\cup \\{\\ast\\}$ for a fresh point $\\ast$, unit the inclusion, $\\mu_X$ the flattening map, a $T$-algebra $a\\colon TA \\to A$ satisfies $a\\circ\\eta_A = 1_A$ and $a\\circ\\mu_A = a\\circ Ta$, and a morphism of $T$-algebras satisfies $f\\circ a = b\\circ Tf$; an algebra on $A$ is read off as the pointed set with basepoint $a(\\ast)$. Let $(B,b)$ be the algebra with $B = \\{3,7\\}$, $b$ the identity on $B$ and $b(\\ast) = 7$, and let $f\\colon A \\to B$ with $A = \\{1,6,8\\}$ send $1$ to $3$, $6$ to $7$ and $8$ to $3$. Find the basepoint $a(\\ast)$ that makes $f$ a morphism of $T$-algebras."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full objects are $(B,b)$ with $B = \\{3,7\\}$, $b(3) = 3$, $b(7) = 7$, $b(\\ast) = 7$, and $f$ with $f(1) = 3$, $f(6) = 7$, $f(8) = 3$. Step 1 (unit law): $a\\circ\\eta_A = 1_A$ forces $a$ to be the identity on $A$, so the only free datum is the basepoint $a(\\ast)$. Step 2 (morphism condition at the fresh point): the condition $f\\circ a = b\\circ Tf$ at $\\ast$ reads $f(a(\\ast)) = b(\\ast) = 7$, and the only element of $A$ that $f$ sends to $7$ is $6$. Step 3 (existence): with $a(\\ast) = 6$ the associativity law holds automatically, so this choice gives a morphism. The answer is 6."
          - problem: "With the maybe monad $T$ on $\\mathbf{Set}$, where $TX = X \\cup \\{\\ast\\}$ for a fresh point $\\ast$, unit the inclusion and $\\mu_X$ the flattening map, a $T$-algebra $a\\colon TA \\to A$ satisfies $a\\circ\\eta_A = 1_A$ and $a\\circ\\mu_A = a\\circ Ta$, and a morphism of $T$-algebras satisfies $f\\circ a = b\\circ Tf$; each algebra on $A$ is read off as the pointed set with basepoint $a(\\ast)$. Let $(A,a)$ have $A = \\{1,2,3\\}$ with $a$ the identity on $A$ and $a(\\ast) = 3$, and let $(B,b)$ have $B = \\{5,6\\}$ with $b$ the identity on $B$ and $b(\\ast) = 6$. How many morphisms of $T$-algebras $f\\colon (A,a) \\to (B,b)$ are there?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full objects are $(A,a)$ with $A = \\{1,2,3\\}$, $a$ the identity on $A$, $a(\\ast) = 3$, and $(B,b)$ with $B = \\{5,6\\}$, $b$ the identity on $B$, $b(\\ast) = 6$. Step 1 (morphism condition on $A$): since $a$ and $b$ fix their sets, the condition at $x$ in $A$ reads $f(x) = f(x)$ and gives no restriction. Step 2 (morphism condition at the fresh point): it reads $f(a(\\ast)) = b(\\ast)$, that is $f(3) = 6$. Step 3 (count): the values $f(1)$ and $f(2)$ are free, each with two choices, giving $2 \\cdot 2 = 4$ morphisms. The answer is 4."
          - problem: "With the maybe monad $T$ on $\\mathbf{Set}$, $TX = X \\cup \\{\\ast\\}$ for a fresh point $\\ast$, unit the inclusion, $\\mu_X$ the flattening map, a $T$-algebra $a\\colon TA \\to A$ satisfies $a\\circ\\eta_A = 1_A$ and $a\\circ\\mu_A = a\\circ Ta$, and a morphism of $T$-algebras satisfies $f\\circ a = b\\circ Tf$. Let $(A,a)$ have $A = \\{4,7\\}$ with $a$ the identity on $A$ and $a(\\ast) = 4$, let $(B,b)$ have $B = \\{1,9\\}$ with $b$ the identity on $B$ and $b(\\ast) = 9$, and let $f\\colon A \\to B$ send both $4$ and $7$ to $1$. Compute the two values $(f\\circ a)(\\ast)$ and $(b\\circ Tf)(\\ast)$, and give them in the order left, right."
            answer: "left = 1; right = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "left"}, {"contract": {"kind": "exact"}, "name": "right"}]}
            solution_sketch: "The full objects are $(A,a)$ with $A = \\{4,7\\}$, $a$ the identity on $A$, $a(\\ast) = 4$; $(B,b)$ with $B = \\{1,9\\}$, $b$ the identity on $B$, $b(\\ast) = 9$; and $f$ with $f(4) = f(7) = 1$. Step 1 (left value): $(f\\circ a)(\\ast) = f(a(\\ast)) = f(4) = 1$. Step 2 (right value): $Tf$ sends the fresh point to the fresh point, so $(b\\circ Tf)(\\ast) = b(\\ast) = 9$. The two sides differ, so this $f$ is not a morphism of $T$-algebras. The answer is left = 1; right = 9."
          - problem: "Write the full proof: for the maybe monad $T$ on $\\mathbf{Set}$ with $TX = X \\cup \\{\\ast\\}$, unit the inclusion and $\\mu_X$ the flattening map, the $T$-algebras $(A,a)$ — maps $a\\colon TA \\to A$ with $a\\circ\\eta_A = 1_A$ and $a\\circ\\mu_A = a\\circ Ta$ — are exactly the pointed sets $(A,p)$ with basepoint $p = a(\\ast)$, and a function $f$ is a morphism exactly when it preserves the basepoint. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "State the laws before any identification: the unit law $a\\circ\\eta_A = 1_A$, the associativity law $a\\circ\\mu_A = a\\circ Ta$, and the morphism condition $f\\circ a = b\\circ Tf$. Step 1 (unit law): $\\eta_A$ includes $A$ into $A \\cup \\{\\ast\\}$, so $a\\circ\\eta_A = 1_A$ forces $a(x) = x$ for every $x$ in $A$; the only remaining datum is the element $p = a(\\ast)$ of $A$. Step 2 (associativity law): check the three kinds of points of $T^2A = (A \\cup \\{\\ast\\}) \\cup \\{\\ast\\}$. On $x$ in $A$ both composites give $x$; on the inner point $\\ast$ the left side is $a(\\ast) = p$ and the right side is $a(a(\\ast)) = a(p) = p$; on the outer point both flatten it to $\\ast$ and give $p$ again. So every $p$ in $A$ gives an algebra with $a$ the identity on $A$ and $a(\\ast) = p$, and the two laws force exactly this shape. Step 3 (morphisms): the condition $f\\circ a = b\\circ Tf$ on elements of $A$ is automatic, and at the fresh point it reads $f(p) = q$, which is precisely basepoint preservation. Conclusion: the $T$-algebras are exactly the pointed sets and their morphisms are exactly the basepoint-preserving maps."
      - id: kp2
        name: Algebras recover familiar structures
        key_prerequisites: [natural-transformations, free-groups-presentations]
        constraints: "Identifications only, for monads on $\\mathbf{Set}$ induced by free-forgetful adjunctions (list $\\Rightarrow$ monoids, free group $\\Rightarrow$ groups); say what the structure map does to a formal expression and name the equivalence $\\mathbf{Set}^T\\simeq\\ldots$."
        exemplars:
          - problem: "Let $T$ be the list monad on $\\mathbf{Set}$, so $TX$ is the set of words in the letters of $X$. The integers with addition form a $T$-algebra: the structure map $a$ sends a word to the sum of its letters. For $t = [[2,3],[4,5]]$ in $TT\\mathbb{Z}$, the algebra law gives $a(\\mu(t)) = a(Ta(t))$. Find that common value."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $t = [[2,3],[4,5]]$, a word of two words. Flatten by $\\mu$: $\\mu(t) = [2,3,4,5]$, so $a(\\mu(t)) = 2+3+4+5 = 14$. Apply $Ta$: $Ta(t) = [a([2,3]), a([4,5])] = [5,9]$, and $a([5,9]) = 5+9 = 14$ by the sum rule. The answer is 14."
          - problem: "Let $T$ be the monad on $\\mathbf{Set}$ induced by the free group adjunction: $TA$ is the set of reduced words in the letters of $A$ and their formal inverses. The nonzero rationals under multiplication form a $T$-algebra: the structure map $a$ takes a formal word, cancels adjacent inverse pairs, then multiplies what is left. Find the value of $a$ on the word $6, 2, 2^{-1}, 5$."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the formal word $6, 2, 2^{-1}, 5$. Reduce by cancelling the adjacent pair $2, 2^{-1}$, which is what the structure map does to a formal expression. The reduced word is $6, 5$, and evaluation multiplies: $6 \\cdot 5 = 30$. This is the identification $\\mathbf{Set}^T \\simeq \\mathbf{Grp}$: the algebras are exactly the groups. The answer is 30."
          - problem: "A monoid $(A, \\cdot, u)$ gives an algebra for the list monad: the structure map $a$ sends a word to the product of its letters, and $a([]) = u$. Take $A = \\{0,1,2\\}$ with $x \\cdot y = \\max(x,y)$ and unit $0$. Find $a([1,2,0,1])$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the word $[1,2,0,1]$ over the monoid $(\\{0,1,2\\}, \\max, 0)$. By the identification of list-monad algebras with monoids, $a$ of a word is the monoid product of its letters, here the maximum. Compute $\\max(1,2,0,1) = 2$. The answer is 2."
          - problem: "A student proposes an algebra for the list monad on $A = \\{0,1,2\\}$: the map $a$ sends a nonempty word to its first letter and sends the empty word to $0$. For $t = [[], [2]]$, the two sides $a(\\mu(t))$ and $a(Ta(t))$ of the law $a \\circ \\mu = a \\circ Ta$ do not agree. Find the value of $a(Ta(t))$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $t = [[], [2]]$, a word of two words. Apply $Ta$: it maps each inner word to its value, giving $Ta(t) = [a([]), a([2])] = [0, 2]$. Then $a([0,2])$ takes the first letter, which is $0$. The other side gives $a(\\mu(t)) = a([2]) = 2$, so the law fails and this is not a monoid structure, contradicting $\\mathbf{Set}^T \\simeq \\mathbf{Mon}$. The answer is 0."
          - problem: "Claim: the algebras for the list monad on $\\mathbf{Set}$ are exactly the groups, so $\\mathbf{Set}^T \\simeq \\mathbf{Grp}$. Step 1: an algebra is a set $A$ with a map $a: A^* \\to A$ satisfying $a([x]) = x$ and $a(\\mu(t)) = a(Ta(t))$. Step 2: define $x \\cdot y = a([x,y])$; the two laws make $\\cdot$ associative with unit $a([])$. Step 3: the law $a([x]) = x$ gives every element an inverse. Step 4: hence every algebra is a group. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly restates the definition of an algebra for the list monad. Step 2 is the standard derivation: associativity of $\\cdot$ is the law $a(\\mu(t)) = a(Ta(t))$ and the unit is $a([])$. Step 3 is not valid: the unit law $a([x]) = x$ only fixes one-letter words, and the list monad has no formal inverses; inverses come from the free-group monad, which is why that monad yields $\\mathbf{Grp}$. Step 4 would follow from Step 3, but Step 3 already fails. The first invalid step is Step 3."
          - problem: "Under the equivalence $\\mathbf{Set}^T \\simeq \\mathbf{Mon}$ for the list monad, a monoid $(A, \\cdot)$ gives a structure map $a$ that sends a word to the product of its letters. Take $A = \\{1,2,3,4\\}$ with multiplication modulo $5$. Find $a([4,4,3,2])$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the word $[4,4,3,2]$ over the monoid of nonzero residues modulo $5$. By the identification of list-monad algebras with monoids, $a$ of a word is the monoid product of its letters. Multiply step by step modulo $5$: $4 \\cdot 4 = 16 \\equiv 1$, then $1 \\cdot 3 = 3$, then $3 \\cdot 2 = 6 \\equiv 1$. The answer is 1."
          - problem: "Write the full proof: the algebras for the list monad on $\\mathbf{Set}$ are exactly the monoids, and $\\mathbf{Set}^T \\simeq \\mathbf{Mon}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (algebra to monoid): given a structure map $a: A^* \\to A$, define $x \\cdot y = a([x,y])$ and $u = a([])$; the structure map sends a word to the iterated product of its letters. Step 2 (unit): apply the law to $t = [[],[x]]$: $a(\\mu(t)) = a([x]) = x$, while $a(Ta(t)) = a([a([]), a([x])]) = a([u,x]) = u \\cdot x$, so $u \\cdot x = x$; symmetrically $t = [[x],[]]$ gives $x \\cdot u = x$. Step 3 (associativity): apply the law to $t = [[x,y],[z]]$ to get $a([x,y,z]) = (x \\cdot y) \\cdot z$, and to $t = [[x],[y,z]]$ to get $a([x,y,z]) = x \\cdot (y \\cdot z)$; hence $(x \\cdot y) \\cdot z = x \\cdot (y \\cdot z)$. So every algebra is a monoid. Step 4 (monoid to algebra): conversely, a monoid defines $a$ as the product of the letters with $a([]) = u$; the unit law is immediate, and the law $a \\circ \\mu = a \\circ Ta$ holds because both sides multiply the letters of the flattened word, only in different groupings, and monoid multiplication is associative and unital. Step 5 (morphisms): a map $f$ with $f(a(w)) = a(f(w))$ preserves products and units, so algebra maps are monoid homomorphisms. Conclusion: the algebras for the list monad are exactly the monoids and $\\mathbf{Set}^T \\simeq \\mathbf{Mon}$."
      - id: kp3
        name: The free-forgetful adjunction of the algebras
        key_prerequisites: [adjunctions]
        constraints: "The free algebra is $(TC,\\mu_C)$: match its two algebra laws to the two monad laws taken at $C$ by evaluating both sides at the given values, and identify the adjunction $F^T\\dashv U^T$ with its unit $\\eta$ as a label; never reprove the laws from scratch."
        exemplars:
          - problem: "Let T be the list monad on sets: T X is the set of finite lists with entries in X, eta_X sends an element x to the one-element list [x], and mu_X flattens a list of lists into one list. The free T-algebra on a set C is (TC, mu_C), the value of the left adjoint F^T in the adjunction whose right adjoint is U^T and whose unit is eta. Take C = {0, 1} and the element [[1,0],[0],[1,1]] of T(TC). Compute mu_C of this element, giving the resulting list."
            answer: "1, 0, 0, 1, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The free T-algebra on C is (TC, mu_C), the value at C of the left adjoint F^T of the adjunction with right adjoint U^T and unit eta. Its structure map mu_C is the flattening of a list of lists. Apply the structure map to [[1,0],[0],[1,1]]: concatenating the inner lists in order gives [1,0,0,1,1]. The answer is 1, 0, 0, 1, 1."
          - problem: "Let T be the writer monad for the group of integers modulo 3 on sets: T X is the set of pairs (x, m) with x in X and m in Z/3, eta_X(x) = (x, 0), and mu_X((x, m), n) = (x, m + n mod 3). The free T-algebra on a set C is (TC, mu_C), the value of the left adjoint F^T in the adjunction whose right adjoint is U^T and whose unit is eta, and its associativity identity is the monad associativity identity taken at C. Take C = {4} and the element (((4,1), 2), 2) of T(T(TC)). Compute mu_C after mu_TTC on this element, giving the answer as (x, m)."
            answer: "(4, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The composite mu_C after mu_TTC collapses the three layers of (((4,1), 2), 2) one at a time, and its agreement with the other composite is the monad associativity identity taken at C. First mu_TTC acts: ((4,1), 2 + 2 mod 3) = ((4,1), 1). Then mu_C acts: (4, 1 + 1 mod 3) = (4, 2). The answer is (4, 2)."
          - problem: "For the list monad T, with mu the flattening of a list of lists, the free T-algebra on a set C is (TC, mu_C), and its associativity identity mu_C after mu_TC = mu_C after T mu_C is the monad associativity identity taken at C, not a new fact to prove. Take C = {1, 2} and the element [[[1]],[[2,2]]] of T(T(TC)). Compute mu_C after T mu_C on this element, giving the resulting list."
            answer: "1, 2, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The map T mu_C applies mu_C to each entry of a list of lists of lists. The entries of [[[1]],[[2,2]]] are [[1]] and [[2,2]], and each flattens under mu_C: [[1]] gives [1] and [[2,2]] gives [2,2], so T mu_C yields [[1],[2,2]]. Then mu_C flattens once more, giving [1,2,2], and the other composite gives the same list by the monad associativity identity at C. The answer is 1, 2, 2."
          - problem: "For the list monad T, a T-algebra is a monoid, and the free T-algebra on a set C is the free monoid on C. By the adjunction whose left adjoint is F^T, whose right adjoint is U^T, and whose unit is eta, each T-algebra map from the free T-algebra on C to a T-algebra A corresponds to exactly one function from C to the underlying set of A. How many T-algebra maps are there from the free T-algebra on a set with two elements to the group of integers modulo 2, viewed as a monoid under addition?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the adjunction F^T with right adjoint U^T and unit eta, a T-algebra map out of the free T-algebra (TC, mu_C) is determined uniquely by its restriction to C, and every function from C to the underlying set of the target arises this way. So the number of maps equals the number of functions from a two-element set to the two-element group. That number is 2 times 2 = 4. The answer is 4."
          - problem: "A student checks that the free T-algebra (TC, mu_C) is a T-algebra, where eta is the unit and mu the multiplication of the monad T. Step 1: the structure map is mu_C, from TTC to TC. Step 2: the unit identity mu_C after eta_TC equals the identity on TC, and it holds because it is the monad unit identity taken at C. Step 3: the associativity identity mu_C after mu_TC equals mu_C after T mu_C, and it holds because it is the naturality of eta taken at C. Step 4: with both identities verified, (TC, mu_C) is a T-algebra. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: mu_C is indeed the structure map of the free algebra. Step 2 is valid: the unit identity is exactly the monad unit identity taken at C, with no new proof. Step 3 is not valid: the associativity identity is justified by the monad associativity identity taken at C, not by the naturality of eta. Step 4 only summarizes the earlier steps and inherits the faulty justification. The answer is Step 3."
          - problem: "The free T-algebra on an object C has structure map mu_C from TTC to TC. Its associativity identity, which governs collapsing three layers into one, is not proved from scratch: it is one of the monad identities of T taken at C. Which one?"
            answer: "mu after mu T = mu after T mu"
            answer_contract: {"kind": "label", "options": [["mu after mu T = mu after T mu"], ["mu after eta T = 1"], ["eta after T = T after eta"], ["mu after T = T after mu"]]}
            solution_sketch: "The associativity identity for the structure map mu_C is the monad associativity identity taken at C. The option mu after eta T = 1 is the monad unit identity, which justifies the other algebra identity. The option eta after T = T after eta is the naturality of eta, which is not the identity required here. The option mu after T = T after mu is the naturality of mu, which does not state the collapse of three layers. The answer is mu after mu T = mu after T mu."
          - problem: "Write the full proof: let T be a monad on a category with unit eta and multiplication mu. Prove that for each object C the pair (TC, mu_C) is a T-algebra, because its two identities are exactly the two monad identities taken at C, and prove that the assignments sending C to (TC, mu_C) and a T-algebra (A, a) to A form an adjunction of F^T with U^T that has unit eta. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (free algebra): define F^T on objects by F^T(C) = (TC, mu_C), with structure map mu_C from TTC to TC. Step 2 (unit identity): the algebra unit identity for this structure map reads mu_C after eta_TC = identity on TC, which is exactly the monad unit identity mu after eta T = 1 taken at C, so it needs no new proof. Step 3 (associativity identity): the identity mu_C after mu_TC = mu_C after T mu_C is exactly the monad associativity identity mu after mu T = mu after T mu taken at C. Hence (TC, mu_C) is a T-algebra. Step 4 (adjunction): define U^T by U^T(A, a) = A; for a function f from C to A, its transpose is a after T f, which is a T-algebra map from (TC, mu_C) to (A, a) precisely by the two identities of the algebra a. Step 5 (unit): the transpose of the identity of TC is eta_C, so eta is the unit of the adjunction of F^T with U^T, and applying U^T to F^T returns T with its original eta and mu, so this adjunction resolves the monad T."
    diagnostic_exemplar:
      problem: "Let $T$ be the list monad on $\\mathbf{Set}$ ($TX=X^*$, $\\eta_X(x)=[x]$, $\\mu_X=$ flatten). Verify that the free $T$-algebra on a set $C$, namely $(TC,\\mu_C)$, satisfies the two $T$-algebra laws, and identify the resulting structure on $C^*$ concretely."
      answer: "The algebra laws for $(A,a)=(TC,\\mu_C)$ read $a\\circ\\eta_A=1_A$, i.e. $\\mu_C\\circ\\eta_{TC}=1_{TC}$, and $a\\circ\\mu_A=a\\circ Ta$, i.e. $\\mu_C\\circ\\mu_{TC}=\\mu_C\\circ T(\\mu_C)$. These are exactly the monad unit law $\\mu\\circ\\eta T=1_T$ and the monad associativity law $\\mu\\circ\\mu T=\\mu\\circ T\\mu$, both taken at the object $C$ — so nothing new has to be proved. Concretely: $\\eta_{TC}$ wraps a word $w$ as the one-element list $[w]$ and flattening returns $w$; and a list of lists of lists flattens to the same word whether the outer or the inner grouping is collapsed first (both give the concatenation of all letters in order). Since algebras for the list monad are monoids, with the structure map evaluating a word of elements to their product, $(C^*,\\mu_C)$ is the free monoid on $C$: concatenation of words, with the empty word as unit."
      solution_sketch: "Prove nothing new: instantiate the two algebra laws at $(TC,\\mu_C)$ and watch them turn into the monad unit and associativity laws at $C$. Then read the structure off concretely — flattening is concatenation, so this is the free monoid on $C$."
    anki_seeds:
      - front: "A $T$-algebra is an object $A$ equipped with a structure map of what type?"
        back: "$a\\colon TA\\to A$."
        type: basic
      - front: "State the unit law for a $T$-algebra $(A,a)$."
        back: "$a\\circ\\eta_A=1_A$."
        type: basic
      - front: "State the associativity law for a $T$-algebra $(A,a)$."
        back: "$a\\circ\\mu_A=a\\circ Ta$."
        type: basic
      - front: "A morphism of $T$-algebras $(A,a)\\to(B,b)$ is a map $f\\colon A\\to B$ with..."
        back: "$f\\circ a=b\\circ Tf$."
        type: basic
      - front: "Algebras for the list monad on $\\mathbf{Set}$ are exactly {{c1::monoids}}."
        back: "monoids"
        type: cloze

  - id: adjunctions-give-monads
    name: Adjunctions and Monads
    core: false                # stated theorem feeding only Kleisli-vs-Eilenberg-Moore
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: adjunctions
        weight: 0.5
      - id: unit-counit
        weight: 0.4
      - id: triangle-identities
        weight: 0.4
        key: true
      - id: monads
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Every adjunction induces a monad
        key_prerequisites: [adjunctions]
        constraints: "Compute $T=GF$, $\\eta$, $\\mu=G\\varepsilon F$ from a given adjunction and check every law by evaluating it through naturality and the two triangle identities on the given values — the graded answers are the computed components and the holds/fails verdict per law; the concrete instances are free-forgetful adjunctions over $\\mathbf{Set}$ ($\\mathbf{Mon}$ giving the list monad, $\\mathbf{Grp}$ the free-group monad)."
        exemplars:
          - problem: "Let P be the chain 0 < 1 < 2 < 3 < 4 and Q the chain 0 < 1 < 2. Define F from P to Q by F(0) = 0, F(1) = 0, F(2) = 1, F(3) = 1, F(4) = 2, and G from Q to P by G(0) = 1, G(1) = 3, G(2) = 4. These monotone maps form an adjunction F left adjoint to G, so T = G composed with F is the induced monad on P, a closure operator. Compute T(2)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The adjunction with F left adjoint to G induces the monad T = G composed with F on P, acting by T(x) = G(F(x)). Read the value F(2) = 1 from the table of F. Then read the value G(1) = 3 from the table of G. The answer is T(2) = 3."
          - problem: "The free monoid functor F from Set to Mon sends a set A to the monoid of all finite words on A under concatenation, and the forgetful functor U returns the underlying set, with F left adjoint to U. This adjunction induces a monad on Set. Which monad is it?"
            answer: "list monad"
            answer_contract: {"kind": "label", "options": [["list monad"], ["free-group monad"], ["powerset monad"], ["maybe monad"]]}
            solution_sketch: "The induced monad is T = U F, and F builds the free monoid, so T(A) is the set of all finite words on A. The unit sends an element to its one-letter word and mu = U epsilon F flattens a word of words, which is exactly the list monad. The option free-group monad is the instance of the Grp adjunction, where letters also carry inverses. The option powerset monad would need T(A) to be the set of subsets of A, not words. The option maybe monad would need T(A) = A with one extra point. The answer is list monad."
          - problem: "For the adjunction between Set and Mon with the free monoid functor F and the forgetful functor U, the counit at a monoid M takes a word of elements of M and multiplies them in order inside M; the induced monad is built from this counit as mu = U epsilon F. At the monoid of integers with addition, compute the counit applied to the word (4, 7, -1)."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The counit of the free-forgetful adjunction evaluates a word of elements of M by multiplying its letters in M, and this counit is the building block of mu = U epsilon F. At the monoid of integers under addition, the monoid multiplication is the sum. Add the letters of the word in order: 4 + 7 + (-1) = 10. The answer is 10."
          - problem: "For the list monad, the monad induced by the adjunction between Set and Mon, the multiplication mu = U epsilon F at a set A flattens a word of words into a single word by concatenation. On the set A = {1, 2}, compute the word mu_A applied to the word of words [[2, 1], [1, 2]] and give it as an ordered list."
            answer: "2, 1, 1, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The induced monad has mu = U epsilon F, and at the set A its component is the counit at the free monoid on A, which multiplies a word of words inside the free monoid, that is, concatenates. Concatenate the inner words in order: the word [2, 1] followed by the word [1, 2] gives one single word. The answer is 2, 1, 1, 2."
          - problem: "For the adjunction between Set and Grp, the induced monad sends a set A to the free group on A, and its multiplication mu = U epsilon F flattens a word of words and then reduces the result, cancelling adjacent inverse pairs. On the set A = {a, b}, compute the number of letters in the reduced word mu_A applied to the word of words [[b, a], [a^{-1}, b]]."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The monad from the free-group adjunction has mu = U epsilon F, which flattens a word of words and then multiplies inside the free group, so the result is the reduced word. Flatten first: the word of words [[b, a], [a^{-1}, b]] gives the word b a a^{-1} b. Reduce with the group relations: the adjacent pair a a^{-1} cancels, leaving b b. The answer is 2."
          - problem: "Let F be left adjoint to G with unit eta and counit epsilon, and set T = GF with mu = G epsilon F. One unit law of the induced monad is mu composed after eta T equals 1_T. Its proof uses exactly one of the two triangle identities of the adjunction, applied to a whiskered composite. Which triangle identity does the proof use?"
            answer: "G epsilon after eta G"
            answer_contract: {"kind": "label", "options": [["G epsilon after eta G"], ["epsilon F after F eta"], ["F eta after epsilon F"], ["eta G after G epsilon"]]}
            solution_sketch: "Write both sides as whiskered composites: mu after eta T equals (G epsilon)F after (eta G)F, which is (G epsilon after eta G)F. The triangle identity G epsilon after eta G = 1_G then gives 1_G F = 1_T. The option epsilon F after F eta is the other triangle identity; it proves the other unit law mu after T eta = 1_T, not this one. The option F eta after epsilon F composes in the wrong order and is not an identity of the adjunction. The option eta G after G epsilon makes the same wrong-order error on the G side. The answer is G epsilon after eta G."
          - problem: "Write the full proof: let F be left adjoint to G with unit eta and counit epsilon, and set T = GF with mu = G epsilon F. Prove that (T, eta, mu) is a monad, deriving each law from naturality and the triangle identities and naming the identity used at each step. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (definition): set T = GF; the unit eta: 1 to GF is the unit of the adjunction, and mu = G epsilon F: GFGF to GF is natural because epsilon is, so all three data are well defined. Step 2 (first unit law): mu after T eta = G epsilon F after GF eta = G(epsilon F after F eta) = G(1_F) = 1_T, using the triangle identity epsilon F after F eta = 1_F. Step 3 (second unit law): mu after eta T = G epsilon F after eta GF; naturality of eta rewrites this as (G epsilon after eta G)F = 1_G F = 1_T, using the triangle identity G epsilon after eta G = 1_G. Step 4 (associativity): mu after T mu = mu after mu T because epsilon is natural; the naturality square of epsilon applied to the component of epsilon F identifies the two composites from GFGFGF to GF. Step 5 (conclusion): both unit laws and associativity hold, so every adjunction induces a monad."
      - id: kp2
        name: Every monad comes from an adjunction
        key_prerequisites: [monads]
        constraints: "The converse direction: name the Kleisli and Eilenberg-Moore resolutions, give the two functors of the chosen one explicitly on objects and morphisms, and verify $U_TF_T=T$ (or $U^TF^T=T$) rather than asserting it."
        exemplars:
          - problem: "Every monad on Set arises from an adjunction, and the Kleisli resolution is one such construction: its category C_T has the same objects as Set, and a morphism from A to B in C_T is a function from A to T(B). Take the powerset monad, where T(X) is the set of all subsets of X, the unit sends x to the set {x}, and the multiplication sends a set of subsets to its union. Let A be a set with 2 elements and B a set with 3 elements. How many morphisms are there from A to B in the Kleisli category C_T?"
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the hom set from A to B in the Kleisli category. Step 1 (definition of the Kleisli hom sets): a morphism from A to B is a function from A to T(B). Step 2 (the powerset monad on objects): T(B) is the set of all subsets of the 3-element set B, so it has 2^3 = 8 elements. Step 3 (counting functions): each of the 2 elements of A picks one of the 8 subsets, giving 8 * 8 = 64. The answer is 64."
          - problem: "In the Kleisli resolution of the powerset monad on Set, the functor F_T is the identity on objects and sends a function f from A to B to the function sending each a in A to the one-element set {f(a)}. The functor U_T sends an object B to T(B), the set of all subsets of B, and sends a morphism g from A to T(B) to the composite of the multiplication after T(g); here T(g) sends a subset S of A to the set of all values g(a). Let A = {1, 2, 3} and B = {4, 5}, with f(1) = 4, f(2) = 5, f(3) = 5. The subset {1, 3} of A lies in the domain of the composite U_T F_T(f). Give the elements of its image under U_T F_T(f) in increasing order."
            answer: "4,5"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object is the composite U_T F_T(f), a function from T(A) to T(B) built from the two functors of the Kleisli resolution. Step 1 (F_T on morphisms): F_T(f) sends each a in A to {f(a)}, so a = 1 gives {4} and a = 3 gives {5}. Step 2 (T on morphisms): T of this map sends the subset {1, 3} to the family {{4}, {5}}. Step 3 (multiplication as union): the union map merges that family into the subset {4, 5} of T(B). This is also T(f)({1, 3}), the direct image, which verifies U_T F_T(f) = T(f) on this subset. The answer is 4,5."
          - problem: "In the Kleisli resolution of the exception monad on Set, where T(X) is the set X with one extra point added, the functor F_T is the identity on objects, and U_T sends an object A to T(A). A student claims that the composite U_T F_T is the identity functor on the base category, so that U_T F_T(A) would always have the same number of elements as A. Let A = {7, 9}. Give the number of elements of the set U_T F_T(A)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the set U_T F_T(A). Step 1 (F_T on objects): F_T is the identity on objects, so F_T(A) = A, a set with 2 elements. Step 2 (U_T on objects): U_T sends an object X to T(X), and T adds one extra point, so U_T F_T(A) = T(A) has 2 + 1 = 3 elements. Step 3 (compare with the claim): 3 differs from 2, so the composite acts as T on objects, not as the identity, which is the first half of the verification that U_T F_T = T. The answer is 3."
          - problem: "For the list monad on Set, T(X) is the set of all finite words in the letters of X, the unit sends a letter x to the one-letter word x, and the multiplication flattens a word of words by concatenation. In the Eilenberg-Moore resolution, an algebra is a set M with a map a from T(M) to M such that a(unit(x)) = x for each letter x and a(T(a)(w)) = a(mult(w)) for each w in T(T(M)); for this monad such a structure is exactly a monoid structure on M, with a(word) the product of its letters. Take M = {0, 1, 2, 3, 4} with addition modulo 5. Compute a([2, 4, 3])."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the value a([2, 4, 3]) of the algebra structure map on the residues modulo 5. Step 1 (Eilenberg-Moore algebras of the list monad): an algebra is a monoid, and a(word) is the product of its letters; with addition modulo 5 as the operation, the product of 2, 4 and 3 is the sum 2 + 4 + 3 = 9. Step 2 (reduce modulo 5): 9 leaves remainder 4. The answer is 4."
          - problem: "For the exception monad on Set, T(X) is the set X with one extra point e added; the unit sends each x in X to itself inside T(X), and the multiplication sends both extra points of T(T(X)) to the extra point of T(X). An Eilenberg-Moore algebra is a set A with a map a from T(A) to A such that a(unit(x)) = x for all x in A and a(T(a)(w)) = a(mult(w)) for all w in T(T(A)). How many such maps a are there on the set A = {1, 2}?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the set of maps a from T(A) = {1, 2, e} to A that satisfy both algebra laws. Step 1 (unit law): a(unit(x)) = x forces a(1) = 1 and a(2) = 2, leaving only a(e) free. Step 2 (multiplication law): write a(e) = c and test the three points of T(T(A)); at unit(unit(x)) both sides give x, at unit(e) both sides give c, and at the outer point both sides give c, so the law holds for either choice of c. Step 3 (count): c can be 1 or c can be 2, giving 2 valid maps. The answer is 2."
          - problem: "A student verifies that the Eilenberg-Moore resolution of a monad with unit eta and multiplication mu on a category C induces T. The free algebra functor sends each object A to the algebra with underlying object T(A) and structure map the multiplication at A, and it sends a morphism f from A to B to T(f), which is a map of algebras. The forgetful functor sends each algebra to its underlying object and each map of algebras to its underlying morphism. In the verification that the composite functor agrees with T on morphisms, one line is missing: the line that computes where the composite sends f. Select the missing line."
            answer: "The composite sends f to T(f), so it agrees with T on morphisms"
            answer_contract: {"kind": "label", "options": [["The composite sends f to T(f), so it agrees with T on morphisms"], ["The composite sends f to f, so it is the identity on morphisms"], ["The composite sends f to the multiplication at B after T(f)"], ["The composite sends f to the unit at B after f, the Kleisli free map"]]}
            solution_sketch: "The full object is the composite functor on morphisms, built from the free algebra functor and the forgetful functor of the Eilenberg-Moore resolution. Step 1 (free algebra functor on morphisms): it sends f from A to B to T(f), an algebra map from the free algebra on A to the free algebra on B, since T(f) respects the structure maps by associativity of the multiplication. Step 2 (forgetful functor on morphisms): it sends an algebra map to its underlying morphism, so it sends T(f) to T(f) itself. Step 3 (composite): the composite sends f to T(f), so it agrees with T on morphisms. The option that sends f to f makes the error of taking the composite to be the identity functor. The option with the multiplication after T(f) is the error of importing the Kleisli action of the right adjoint, which acts on Kleisli maps, not on algebra maps. The option with the unit after f is the error of giving the morphism part of the Kleisli free functor instead. The answer is The composite sends f to T(f), so it agrees with T on morphisms."
          - problem: "Write the full proof: given a monad (T, unit, multiplication) on a category C, define the Kleisli category C_T whose objects are those of C and whose morphisms from A to B are the morphisms from A to T(B) in C, define the functors F_T (identity on objects, sending f to the composite of the unit at B after f) and U_T (sending A to T(A) and g to the composite of the multiplication at B after T(g)), show that F_T is left adjoint to U_T with unit the unit of T, and verify on objects and on morphisms that the composite U_T F_T is T. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the Kleisli category): the objects are those of C, and a morphism from A to B is a morphism from A to T(B) in C; the composite of g after f is the multiplication at B after T(g) after f, which is associative by the multiplication law of the monad, so C_T is a category. Step 2 (the functors): F_T is the identity on objects and sends f to the unit at B after f; U_T sends A to T(A) and g to the multiplication at B after T(g); both are functors by the unit and multiplication laws of the monad. Step 3 (the adjunction): the identity on underlying morphisms is a natural bijection from the morphisms F_T(A) to B in C_T to the morphisms A to T(A)'s target, that is to the morphisms A to U_T(B) in C, and its unit is the unit of T, so F_T is left adjoint to U_T. Step 4 (composite on objects): U_T F_T(A) = U_T(A) = T(A). Step 5 (composite on morphisms): U_T F_T(f) = multiplication at B after T(unit at B after f) = multiplication at B after T(unit at B) after T(f) = T(f), because the monad unit law gives multiplication after T(unit) = identity. Step 6 (conclusion): the composite agrees with T on objects and on morphisms, and the adjunction unit is the unit of T, so the monad induced by the Kleisli adjunction is T itself. This is the initial resolution of T; the Eilenberg-Moore resolution is the terminal one."
    diagnostic_exemplar:
      problem: "Let $F\\dashv G$ have unit $\\eta$ and counit $\\varepsilon$, and set $T=GF$ with $\\mu=G\\varepsilon F$. Prove the two unit laws $\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T$, naming the triangle identity used at each step, and identify the monad this construction produces for the free-forgetful adjunction $F\\dashv U$ between $\\mathbf{Set}$ and $\\mathbf{Grp}$."
      answer: "Components: $T_C=GFC$ and $\\mu_C=G(\\varepsilon_{FC})$. First law: $(\\mu\\circ T\\eta)_C=\\mu_C\\circ GF(\\eta_C)=G(\\varepsilon_{FC})\\circ G(F\\eta_C)=G\\big(\\varepsilon_{FC}\\circ F\\eta_C\\big)=G(1_{FC})=1_{GFC}$, using functoriality of $G$ and then the first triangle identity $\\varepsilon F\\circ F\\eta=1_F$. Second law: $(\\mu\\circ\\eta T)_C=\\mu_C\\circ\\eta_{GFC}=G(\\varepsilon_{FC})\\circ\\eta_{G(FC)}=(G\\varepsilon\\circ\\eta G)_{FC}=1_{G(FC)}$, which is the second triangle identity $G\\varepsilon\\circ\\eta G=1_G$ evaluated at the object $FC$. For $F\\dashv U$ between $\\mathbf{Set}$ and $\\mathbf{Grp}$ the induced monad is the free-group monad $T=UF$: $TX$ is the underlying set of the free group on $X$ (reduced words in the letters of $X$ and their formal inverses), $\\eta_X$ inserts a letter as a one-letter word, and $\\mu_X$ multiplies out a word of words."
      solution_sketch: "Push $G$ through each composite by functoriality until a triangle identity appears inside it: the first law reduces to $\\varepsilon F\\circ F\\eta=1_F$ under $G$, and the second is $G\\varepsilon\\circ\\eta G=1_G$ evaluated at the object $FC$. Then name the induced monad on $\\mathbf{Set}$."
    anki_seeds:
      - front: "The monad induced by an adjunction $F\\dashv G$?"
        back: "$T=GF$, unit $\\eta$, multiplication $\\mu=G\\varepsilon F$."
        type: basic
      - front: "Every monad arises from an adjunction — canonical ones are the {{c1::Kleisli}} and {{c2::Eilenberg-Moore}} resolutions."
        back: "Kleisli; Eilenberg-Moore"
        type: cloze

  - id: kleisli-vs-eilenberg-moore
    name: Kleisli versus Eilenberg-Moore
    core: false
    difficulty: 0.82
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: kleisli-categories
        weight: 0.5
        key: true
      - id: algebras-over-monads
        weight: 0.5
        key: true
      - id: adjunctions-give-monads
        weight: 0.4
        key: true
      - id: adjunctions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The comparison functor
        key_prerequisites: [kleisli-categories]
        constraints: "Each rewrite is executed by substituting a definition and applying a monad law or a naturality square at the current equation; the graded answer is the final computed equation or the holds/fails verdict."
        exemplars:
          - problem: "Let $T$ be the writer monad for addition of residues mod $4$: $T(X) = X \\times \\{0,1,2,3\\}$, with unit $\\eta_A(x) = (x, 0)$ and multiplication $\\mu_A((x, m), n) = (x, m + n \\bmod 4)$. Take $A = B = \\{p\\}$ and the Kleisli arrow $f\\colon A \\to T B$ with $f(p) = (p, 1)$. The comparison functor sends $f$ to its underlying map $K(f) = \\mu_B \\circ T f$ from $T A$ to $T B$. Evaluate $K(f)$ at the element $(p, 2)$ of $T A$ and give the second component of the result."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (functor $T$ on maps): $T f(p, 2) = (f(p), 2) = ((p, 1), 2)$, an element of $T(T B)$. Step 2 (multiplication $\\mu_B$): $\\mu_B((p, 1), 2) = (p, 1 + 2 \\bmod 4) = (p, 3)$. Step 3 (definition of the comparison functor): $K(f)(p, 2) = (p, 3)$, so the second component of the result is 3."
          - problem: "Work with the writer monad for addition of residues mod $5$: $T(X) = X \\times \\{0,1,2,3,4\\}$, unit $\\eta_A(x) = (x, 0)$, multiplication $\\mu_A((x, m), n) = (x, m + n \\bmod 5)$. Let $A = B = \\{p\\}$ and let $f\\colon A \\to T B$ be the Kleisli arrow with $f(p) = (p, 2)$. The comparison functor sends $f$ to $K(f) = \\mu_B \\circ T f$, a morphism of $T$-algebras from $(T A, \\mu_A)$ to $(T B, \\mu_B)$, and the morphism law requires $K(f) \\circ \\mu_A = \\mu_B \\circ T(K(f))$. Evaluate both sides of this law at the element $((p, 1), 1)$ of $T(T A)$ and give the second component of their common value."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of $K(f)$): $T f(p, m) = ((p, 2), m)$, so $K(f)(p, m) = (p, 2 + m \\bmod 5)$. Step 2 (left side of the law): $\\mu_A((p, 1), 1) = (p, 2)$, then $K(f)(p, 2) = (p, 4)$. Step 3 (right side of the law): $T(K(f))((p, 1), 1) = ((p, 3), 1)$, then $\\mu_B((p, 3), 1) = (p, 4)$. Step 4 (naturality square of $\\mu$ at $f$, then the associativity law at $B$): both sides give $(p, 4)$, so the second component of the common value is 4."
          - problem: "A closure operator on the three-element chain $0 < 1 < 2$ is given by $c(0) = 1$, $c(1) = 1$, $c(2) = 2$. It is a monad on the poset: the unit is the inequality $x \\le c(x)$ and the multiplication is given by the idempotence $c(c(x)) = c(x)$. The Eilenberg-Moore algebras of this monad are exactly the elements $a$ with $c(a) = a$, and the comparison functor sends an element $x$ to the algebra $K(x) = (c(x), \\mu_x)$. How many elements $x$ of the chain does $K$ send to the algebra on the element $1$?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (comparison functor on objects): $K(x) = (c(x), \\mu_x)$ has underlying element $c(x)$, an algebra because the idempotence $c(c(x)) = c(x)$ holds. Step 2 (closure operator table): $c(0) = 1$, $c(1) = 1$ and $c(2) = 2$. Step 3 (count): the elements with $c(x) = 1$ are $x = 0$ and $x = 1$, so $K$ sends exactly 2 elements of the chain to the algebra on 1."
          - problem: "Let $T$ be the maybe monad on sets: $T(X) = X \\cup \\{*\\}$, with unit $\\eta_A(x) = x$ for $x$ in $A$, and multiplication $\\mu_A$ the map that fixes each element of $T A$ and sends the added point of $T(T A)$ back to $*$. In the Kleisli category the identity arrow of $A$ is $\\eta_A$, and the comparison functor sends it to $K(\\eta_A) = \\mu_A \\circ T\\eta_A$. Take $A = \\{a, b\\}$. How many elements of $T A$ does the composite $\\mu_A \\circ T\\eta_A$ move?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (unit of the maybe monad): $\\eta_A$ fixes $a$ and $b$, so $T\\eta_A$ sends $a$ to $a$, $b$ to $b$, and the point $*$ of $T A$ to the added point of $T(T A)$. Step 2 (multiplication): $\\mu_A$ fixes each element of $T A$, namely $a$, $b$ and $*$, and sends the added point of $T(T A)$ back to $*$. Step 3 (unit law $\\mu \\circ T\\eta = 1$ of the monad): the composite fixes $a$, $b$ and $*$, so it moves 0 elements of $T A$."
          - problem: "A student verifies that the comparison functor $K$ preserves identities and writes four numbered steps. Step 1: the identity arrow on $A$ in the Kleisli category is the unit $\\eta_A$. Step 2: by the definition of the comparison functor, $K(\\eta_A) = \\mu_A \\circ T\\eta_A$. Step 3: the composite $\\mu_A \\circ T\\eta_A$ equals $1_{T A}$ by the monad associativity law at $A$. Step 4: therefore $K$ sends each Kleisli identity to the identity morphism of its image algebra. Which step is the first step that fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct: the identity on $A$ in the Kleisli category is the unit $\\eta_A$. Step 2 is correct: it is the definition of the comparison functor on arrows. Step 3 fails: the equality $\\mu_A \\circ T\\eta_A = 1_{T A}$ is the monad unit law $\\mu \\circ T\\eta = 1$ at $A$, not the associativity law $\\mu \\circ T\\mu = \\mu \\circ \\mu T$, so the cited law is the wrong one. Step 4 would follow once Step 3 cites the unit law, so it is not the first failure. The answer is Step 3."
          - problem: "Let $(T, \\eta, \\mu)$ be a monad on a category, and let $f\\colon A \\to T B$ and $g\\colon B \\to T C$ be Kleisli arrows. Their Kleisli composite is defined as $\\mu_C \\circ T g \\circ f$, and the comparison functor sends a Kleisli arrow $h$ to its underlying map $K(h) = \\mu_B \\circ T h$. A proof that $K$ preserves composition is missing one line: the expression for $K$ applied to the Kleisli composite of $f$ and then $g$. Select the expression for that line, writing composition with 'o', so that 'u o v' means $u$ composed with $v$."
            answer: "mu_C o T(mu_C o Tg o f)"
            answer_contract: {"kind": "label", "options": [["mu_C o T(mu_C o Tg o f)"], ["mu_C o Tg o Tf"], ["T(mu_C o Tg o f)"], ["mu_C o T(mu_C o g o f)"]]}
            solution_sketch: "Step 1 (Kleisli composition): the composite of $f$ and then $g$ is the map mu_C o Tg o f. Step 2 (definition of the comparison functor): $K$ applied to a Kleisli arrow $h$ is mu o T h, so the missing line is mu_C o T(mu_C o Tg o f). Step 3 (errors): 'mu_C o Tg o Tf' uses the ordinary composite in place of the Kleisli composite; 'T(mu_C o Tg o f)' drops the outer mu_C; 'mu_C o T(mu_C o g o f)' forgets the functor $T$ on $g$. The answer is mu_C o T(mu_C o Tg o f)."
          - problem: "Write the full proof: for a monad $(T, \\eta, \\mu)$ on a category $\\mathcal C$, the assignments $K(A) = (T A, \\mu_A)$ on objects and $K(f) = \\mu_B \\circ T f$ on Kleisli arrows $f\\colon A \\to T B$ define a functor from the Kleisli category $\\mathcal C_T$ to the Eilenberg-Moore category $\\mathcal C^T$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (algebra laws): $\\mu_A \\circ \\eta_{T A} = 1_{T A}$ is the monad unit law at $T A$, and $\\mu_A \\circ T\\mu_A = \\mu_A \\circ \\mu_{T A}$ is the monad associativity law at $A$, so $(T A, \\mu_A)$ is a $T$-algebra for every object $A$. Step 2 (naturality square of $\\mu$ at $f$): for a Kleisli arrow $f\\colon A \\to T B$ it gives $T f \\circ \\mu_A = \\mu_{T B} \\circ T^2 f$, hence $K(f) \\circ \\mu_A = \\mu_B \\circ \\mu_{T B} \\circ T^2 f$; also $\\mu_B \\circ T(K(f)) = \\mu_B \\circ T\\mu_B \\circ T^2 f$; the associativity law at $B$ makes the two sides equal, so $K(f)$ is a morphism of $T$-algebras. Step 3 (identities, unit law $\\mu \\circ T\\eta = 1$): the Kleisli identity on $A$ is $\\eta_A$, and $K(\\eta_A) = \\mu_A \\circ T\\eta_A = 1_{T A}$. Step 4 (composition): functoriality of $T$ gives $K(g \\circ_T f) = \\mu_C \\circ T\\mu_C \\circ T^2 g \\circ T f$, while the naturality square of $\\mu$ at $g$ turns $K(g) \\circ K(f)$ into $\\mu_C \\circ \\mu_{T C} \\circ T^2 g \\circ T f$; the associativity law at $C$ makes the two equal. Step 5 (conclusion): $K$ lands in the Eilenberg-Moore category and preserves identities and composition, so $K$ is a functor."
      - id: kp2
        name: Kleisli as the free algebras
        key_prerequisites: [algebras-over-monads]
        constraints: "Use the Eilenberg-Moore free-forgetful bijection; verify both round trips."
        exemplars:
          - problem: "Let $T$ be the monad on sets with $T(X) = X$ plus one extra point $*$, so an algebra for $T$ is a set with a chosen basepoint. Take the algebra $(B, b)$ with $B = \\{0, 1, 2\\}$ and basepoint $0$, and the free algebra $(TA, \\mu_A)$ on $A = \\{5, 6\\}$. Let $f: A \\to B$ with $f(5) = 1$ and $f(6) = 2$. Under the free-forgetful bijection, $f$ corresponds to the algebra morphism $\\varphi = b \\circ Tf$ from $(TA, \\mu_A)$ to $(B, b)$. Give the value $\\varphi(*)$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free algebra on $A$ has underlying set $\\{5, 6, *\\}$, and the full morphism is $\\varphi = b \\circ Tf$, with $\\varphi(5) = 1$ and $\\varphi(6) = 2$ on the elements of $A$. Apply $T$ to $f$: the map $Tf$ sends $5$ to $1$, $6$ to $2$, and $*$ to $*$. The structure map $b$ fixes each element of $B$ and sends the extra point to the basepoint, so $\\varphi(*) = b(*) = 0$. Composing back with $\\eta_A$ returns $f$, which is round trip one. The answer is 0."
          - problem: "Let $T$ be the monad on sets with $T(X) = X$ plus one extra point. The comparison functor $K$ from the Kleisli category to the Eilenberg-Moore category sends a set $A$ to the free algebra $(TA, \\mu_A)$. Take $A = \\{1, 2\\}$ and $B = \\{0, 1, 2, 3\\}$. How many morphisms of $T$-algebras are there from the free algebra on $A$ to the free algebra on $B$?"
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the free-forgetful bijection with the free algebra $(TB, \\mu_B)$ in the second slot, morphisms of algebras from $(TA, \\mu_A)$ to $(TB, \\mu_B)$ correspond to functions from $A$ to $TB$. The set $TB$ has $5$ elements: the four elements of $B$ and the extra point. Each of the $2$ elements of $A$ has $5$ choices, so the count is $5 \\times 5 = 25$; this hom-bijection is exactly what makes $K$ fully faithful. The answer is 25."
          - problem: "Let $T$ be the closure operator on the poset of subsets of $\\{1, 2, 3\\}$ given by $cl(S) = S$ if $S$ is empty and $cl(S) = S \\cup \\{1\\}$ otherwise; this is a monad, and its algebras are the closed sets. The comparison functor $K$ sends each subset $A$ to the free algebra with underlying closed set $cl(A)$. How many distinct free algebras does $K$ hit as $A$ runs over all eight subsets?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute $cl(A)$ for each subset of $\\{1, 2, 3\\}$. The empty set maps to itself, and $\\{1\\}$ maps to $\\{1\\}$. The subsets $\\{2\\}$ and $\\{1, 2\\}$ both give $\\{1, 2\\}$, while $\\{3\\}$ and $\\{1, 3\\}$ both give $\\{1, 3\\}$. The subsets $\\{2, 3\\}$ and $\\{1, 2, 3\\}$ both give $\\{1, 2, 3\\}$. The distinct free algebras have underlying sets the empty set, $\\{1\\}$, $\\{1, 2\\}$, $\\{1, 3\\}$ and $\\{1, 2, 3\\}$, which is the essential image of $K$. The answer is 5."
          - problem: "Claim: for every monad $T$, each algebra morphism $\\varphi$ from the free algebra $(TA, \\mu_A)$ to an algebra $(B, b)$ returns to itself under the round trip through the free-forgetful bijection. Step 1: $\\varphi$ is an algebra morphism, so $\\varphi \\circ \\mu_A = b \\circ T\\varphi$. Step 2: the bijection sends $\\varphi$ to the function $f = \\varphi \\circ \\eta_A$. Step 3: then $b \\circ Tf = b \\circ T\\varphi \\circ T\\eta_A = \\varphi \\circ \\mu_A \\circ T\\eta_A$ by Step 1. Step 4: by the unit law of the monad, $T\\eta_A = \\eta_A$, so $b \\circ Tf = \\varphi \\circ \\mu_A \\circ \\eta_A = \\varphi$. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is the definition of a morphism of $T$-algebras. Step 2 is valid: it is the restriction map of the free-forgetful bijection. Step 3 is valid: it uses functoriality of $T$ and then substitutes Step 1. Step 4 is not valid: the monad unit law says $\\mu_A \\circ T\\eta_A = id$, not $T\\eta_A = \\eta_A$, and those two maps even have different domains, $TA$ versus $A$. With the correct unit law the composite is $\\varphi \\circ \\mu_A \\circ T\\eta_A = \\varphi$ directly. The answer is Step 4."
          - problem: "Let $(B, b)$ be an algebra for a monad $T$ with multiplication $\\mu$. In the verification that $\\Psi(f) = b \\circ Tf$ is a morphism of algebras, one step rewrites the composite $b \\circ \\mu_B \\circ T^2f$ as $b \\circ Tb \\circ T^2f$. Which fact does this step use?"
            answer: "the associativity axiom"
            answer_contract: {"kind": "label", "options": [["the associativity axiom"], ["the unit axiom"], ["naturality of eta"], ["naturality of mu"]]}
            solution_sketch: "The full step reads $b \\circ \\mu_B \\circ T^2f = b \\circ Tb \\circ T^2f$, and it follows by composing the associativity axiom $b \\circ \\mu_B = b \\circ Tb$ of the algebra $(B, b)$ with $T^2f$ on the right. The option 'the unit axiom' is about $b \\circ \\eta_B$ and never mentions $\\mu_B$. The option 'naturality of eta' moves $\\eta$ past a map, and no $\\eta$ occurs in this composite. The option 'naturality of mu' would rewrite $\\mu_B \\circ T^2f$ as $Tf \\circ \\mu_A$, not $\\mu_B$ as $Tb$. The answer is the associativity axiom."
          - problem: "Let $T$ be the monad on sets with $T(X) = X$ plus one extra point, so an algebra for $T$ is a set with a chosen basepoint. Take the free algebra $(TA, \\mu_A)$ on $A = \\{1, 2, 3\\}$ and the algebra $(B, b)$ with $B = \\{0, 1\\}$ and basepoint $0$. How many morphisms of $T$-algebras are there from the free algebra to $(B, b)$?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free-forgetful bijection identifies morphisms of algebras from $(TA, \\mu_A)$ to $(B, b)$ with functions from $A$ to $B$, by restricting a morphism along $\\eta_A$. The inverse sends a function $f$ to $b \\circ Tf$, which forces the value at the extra point to be the basepoint and leaves $f$ free on $A$. Each of the $3$ elements of $A$ can be sent to either of the $2$ elements of $B$, giving $2 \\times 2 \\times 2 = 8$. The answer is 8."
          - problem: "Write the full proof: the comparison functor from the Kleisli category of a monad to its Eilenberg-Moore category is fully faithful, and its essential image consists of the free algebras. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let $T$ be a monad on $\\mathcal C$ with unit $\\eta$ and multiplication $\\mu$; the comparison functor $K$ sends $A$ to the free algebra $(TA, \\mu_A)$ and a Kleisli arrow $f: A \\to TB$ to $\\mu_B \\circ Tf$. Step 1 (the bijection): for an algebra $(B, b)$, send an algebra morphism $\\varphi: (TA, \\mu_A) \\to (B, b)$ to $\\varphi \\circ \\eta_A: A \\to B$, and send a map $f: A \\to B$ back to $\\Psi(f) = b \\circ Tf$. Step 2 ($\\Psi(f)$ is an algebra morphism): $\\Psi(f) \\circ \\mu_A = b \\circ Tf \\circ \\mu_A = b \\circ \\mu_B \\circ T^2f = b \\circ Tb \\circ T^2f = b \\circ T(b \\circ Tf)$, using naturality of $\\mu$ and then the associativity law $b \\circ \\mu_B = b \\circ Tb$ of the algebra. Step 3 (round trip one): $\\Psi(f) \\circ \\eta_A = b \\circ Tf \\circ \\eta_A = b \\circ \\eta_B \\circ f = f$, by naturality of $\\eta$ and the unit law $b \\circ \\eta_B = id_B$. Step 4 (round trip two): for an algebra morphism $\\varphi$, we get $b \\circ T(\\varphi \\circ \\eta_A) = b \\circ T\\varphi \\circ T\\eta_A = \\varphi \\circ \\mu_A \\circ T\\eta_A = \\varphi$, using the morphism law from Step 1 and the monad unit law $\\mu_A \\circ T\\eta_A = id_{TA}$. So the two maps are mutually inverse and $\\mathrm{Hom}$-sets correspond bijectively. Step 5 (full faithfulness): with $(B, b) = (TB, \\mu_B)$ the bijection reads morphisms from $KA$ to $KB$ correspond to maps $A \\to TB$, which are exactly the Kleisli arrows, and the inverse sends $f$ to $\\mu_B \\circ Tf = K(f)$; hence $K$ is fully faithful. Step 6 (image): on objects $K$ hits precisely the free algebras $(TA, \\mu_A)$, so the essential image of $K$ is the full subcategory of free algebras, and the Kleisli category is equivalent to it."
      - id: kp3
        name: The extreme resolutions of a monad
        key_prerequisites: [adjunctions-give-monads]
        constraints: "A resolution is an adjunction inducing $T$; comparison functors must commute with both the left and the right adjoint."
        exemplars:
          - problem: "A monad on a poset is a monotone map c with x <= c(x) and c(c(x)) <= c(x). Take the poset with elements 0, a, b, 1 and order relations 0 < a < 1 and 0 < b < 1, and the map c with c(0) = 0, c(a) = 1, c(b) = 1, c(1) = 1. An Eilenberg-Moore algebra is an element y with c(y) = y. The comparison functor K from the Kleisli category sends an object x to the free algebra on x. Give the underlying element of K(a)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Recall the comparison functor: K(A) = (T A, mu A), and on a poset monad the free algebra on x has underlying element c(x). Compute the free algebra on a: c(a) = 1. Check the algebra law: c(1) = 1, so the result is a genuine algebra. The answer is 1."
          - problem: "A resolution of a monad T is an adjunction F -| G that induces T, and a morphism of resolutions is a functor that commutes with the left adjoint and with the right adjoint. Fix any resolution of T. How many morphisms of resolutions are there from the Kleisli resolution of T to this fixed resolution?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A morphism of resolutions is a functor L with L F_T = F and G L = U_T. Objects: L(A) = L(F_T A) = F(A) is forced by the left-adjoint condition. Morphisms: a Kleisli map f from A to T B is sent to the unique morphism from F(A) to F(B) whose adjunct under the adjunction bijection is U_T(f); the bijection makes this choice unique. Hence exactly one morphism of resolutions exists. The answer is 1."
          - problem: "A monad on a poset is a monotone map c with x <= c(x) and c(c(x)) <= c(x). On the chain 0 < 1 < 2 < 3 take c(0) = 0, c(1) = 2, c(2) = 2, c(3) = 3. An Eilenberg-Moore algebra of this monad is an element y with c(y) = y. How many Eilenberg-Moore algebras does this monad have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The algebra law for a monad on a poset says c(y) = y. Check each element of the chain: c(0) = 0, c(1) = 2, c(2) = 2, c(3) = 3. The fixed elements are 0, 2 and 3, and these are exactly the objects of the Eilenberg-Moore category, which is the terminal resolution. The answer is 3."
          - problem: "Work in the poset with elements 0, p, q, r, 1, order relations 0 < p < 1, 0 < q < 1 and 0 < r < 1, and the monad c with c(0) = 0, c(p) = 1, c(q) = 1, c(r) = 1, c(1) = 1. The comparison functor K from the Kleisli category to the Eilenberg-Moore category sends each object x to the free algebra on x, whose underlying element is c(x). How many distinct Eilenberg-Moore algebras lie in the image of K?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The comparison functor K sends a Kleisli object x to the free algebra on x, whose underlying element is c(x). Compute the values on all five objects: c(0) = 0, c(p) = 1, c(q) = 1, c(r) = 1, c(1) = 1. The distinct algebras reached are 0 and 1, so K collapses the Kleisli category onto two free algebras. The answer is 2."
          - problem: "For the powerset monad, the comparison functor K sends a set A to the free algebra on A, whose underlying set T A is the powerset of A. Let S be the set with elements 1, 2, 3, and let A be the subset of S with elements 1 and 3. Give the number of elements of the underlying set of K(A)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of the comparison functor, K(A) = (T A, mu A) with T A the powerset of A. The set A has 2 elements, so its powerset has 2 times 2, that is 4, subsets: the empty set, the two singletons and the whole set A. The monad multiplication is union, which does not change the count of elements. The answer is 4."
          - problem: "Claim: for any resolution F -| G of a monad T, there is at most one morphism of resolutions from the Kleisli adjunction to it. Step 1: a morphism of resolutions is a functor L with L F_T = F and G L = U_T. Step 2: each object A of the Kleisli category equals F_T A, so L(A) = F(A) is forced. Step 3: a Kleisli morphism f from A to B is a map from A to U_T B, and L(f) is forced because the right adjoint G is faithful. Step 4: L is forced on objects and on morphisms, so at most one morphism of resolutions exists. Which step is the first invalid step?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is exactly the definition of a morphism of resolutions, commuting with both adjoints. Step 2 is valid: every object of the Kleisli category is F_T A, so the left-adjoint condition forces L on objects. Step 3 is the first invalid step: a resolution's right adjoint G is not assumed faithful, so G(L(f)) = U_T(f) does not by itself determine L(f); the true reason is that L(f) is the unique morphism whose adjunct under the adjunction bijection is U_T(f). Step 4 is a valid conclusion once morphisms are genuinely forced. The answer is Step 3."
          - problem: "Write the full proof: for a monad T on a category C, the Kleisli adjunction is the initial resolution of T and the Eilenberg-Moore adjunction is the terminal resolution of T, and the unique morphism from the initial to the terminal resolution is the comparison functor K. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, definitions: a resolution of T is an adjunction F -| G with G F = T whose unit and counit induce the unit and multiplication of T; a morphism of resolutions is a functor commuting with the left and the right adjoint. Step 2, Kleisli is initial: given a resolution F -| G on E, set L(A) = F(A), and for a Kleisli map f from A to T B set L(f) to be the adjunct of mu B after T(f) under the adjunction; the triangle identities give L F_T = F and G L = U_T, and the adjunct bijection makes L the unique functor with these two properties. Step 3, Eilenberg-Moore is terminal: for the same resolution, send an object X of E to the T-algebra whose underlying object is G X and whose structure map is G applied to the counit at X; the adjunction identities verify the algebra law, and this construction is the unique functor R with R F = F^T and U^T R = G. Step 4, the comparison: the unique morphism from the initial to the terminal resolution is K, because K(A) = (T A, mu A) on objects and K(f) = mu B after T(f) on Kleisli maps, and K commutes with both adjoints by the monad unit law and the definition of U^T. Conclusion: the Kleisli resolution is initial, the Eilenberg-Moore resolution is terminal, and K is the unique morphism of resolutions between them."
    diagnostic_exemplar:
      problem: "Let $T$ be a monad on $\\mathcal C$ and $K\\colon\\mathcal C_T\\to\\mathcal C^T$ the comparison functor, $K(A)=(TA,\\mu_A)$ and $K(f)=\\mu_B\\circ Tf$ for $f\\colon A\\to TB$. Prove that $K$ is fully faithful by exhibiting a two-sided inverse to the hom-set map $f\\mapsto K(f)$, and identify the essential image of $K$."
      answer: "Define $\\Lambda(\\varphi)=\\varphi\\circ\\eta_A$ for an algebra morphism $\\varphi\\colon(TA,\\mu_A)\\to(TB,\\mu_B)$; note $\\Lambda(\\varphi)\\colon A\\to TB$ is a morphism $A\\to B$ of $\\mathcal C_T$. Faithfulness: $\\Lambda(K(f))=\\mu_B\\circ Tf\\circ\\eta_A=\\mu_B\\circ\\eta_{TB}\\circ f=1_{TB}\\circ f=f$, using naturality of $\\eta$ at $f\\colon A\\to TB$ and then the monad unit law $\\mu\\circ\\eta T=1_T$. Fullness: $K(\\Lambda(\\varphi))=\\mu_B\\circ T(\\varphi\\circ\\eta_A)=\\mu_B\\circ T\\varphi\\circ T\\eta_A=\\varphi\\circ\\mu_A\\circ T\\eta_A=\\varphi\\circ 1_{TA}=\\varphi$, using that $\\varphi$ is an algebra morphism ($\\varphi\\circ\\mu_A=\\mu_B\\circ T\\varphi$) and then the other unit law $\\mu\\circ T\\eta=1_T$. So $f\\mapsto K(f)$ is a bijection $\\mathcal C_T(A,B)=\\mathrm{Hom}_{\\mathcal C}(A,TB)\\cong\\mathrm{Hom}_{\\mathcal C^T}\\big((TA,\\mu_A),(TB,\\mu_B)\\big)$ and $K$ is fully faithful. Its essential image is the full subcategory of $\\mathcal C^T$ spanned by the free algebras $(TA,\\mu_A)$ — the Kleisli category is the category of free $T$-algebras."
      solution_sketch: "The only candidate inverse to $f\\mapsto K(f)$ is $\\varphi\\mapsto\\varphi\\circ\\eta_A$. One round trip uses naturality of $\\eta$ and then $\\mu\\circ\\eta T=1_T$; the other uses the algebra-morphism square for $\\varphi$ and then $\\mu\\circ T\\eta=1_T$. Those two round trips are precisely faithfulness and fullness."
    anki_seeds:
      - front: "The comparison functor $\\mathcal{C}_T\\to\\mathcal{C}^T$ sends $A\\mapsto$? and $f\\colon A\\to TB\\mapsto$?"
        back: "$A\\mapsto(TA,\\mu_A)$; $f\\mapsto\\mu_B\\circ Tf$."
        type: basic
      - front: "The Kleisli category is equivalent to which part of the Eilenberg-Moore category?"
        back: "the full subcategory of free algebras $(TA,\\mu_A)$."
        type: basic
      - front: "Among resolutions of a monad $T$, Kleisli is the {{c1::initial}} one and Eilenberg-Moore the {{c2::terminal}} one."
        back: "initial; terminal"
        type: cloze

