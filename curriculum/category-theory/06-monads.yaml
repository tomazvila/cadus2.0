    knowledge_points:
      - id: kp1
        name: The maybe monad
        key_prerequisites: [monads]
        constraints: "The maybe monad $TA=A\\sqcup\\{*\\}$ on $\\mathbf{Set}$; concrete Kleisli composites use explicit finite sets of at most 3 elements, and every answer must say what the composite does on the $*$ branch."
        exemplars:
          - problem: "In the maybe monad, let $f\\colon\\{1,2\\}\\to\\{5,6\\}\\sqcup\\{*\\}$ be given by $f(1)=5$, $f(2)=6$, and let $g\\colon\\{5,6\\}\\to\\{7\\}\\sqcup\\{*\\}$ be given by $g(5)=7$, $g(6)=*$. Recall $g\\circ_T f=\\mu\\circ Tg\\circ f$, and write $9$ for the point $*$ of the composite's codomain. Give the values of $g\\circ_T f$ at $1$ and at $2$ as one = and two =, in that order."
            answer: "one = 7; two = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "one"}, {"contract": {"kind": "exact"}, "name": "two"}]}
            solution_sketch: "Kleisli composition in the maybe monad is $g\\circ_T f=\\mu\\circ Tg\\circ f$ with $T=(-)\\sqcup\\{*\\}$. Full composite first: at $1$, $f(1)=5\\in\\{5,6\\}$, then $Tg(5)=g(5)=7$, and $\\mu(7)=7$. At $2$, $f(2)=6$, then $Tg(6)=g(6)=*$, and $\\mu(*)=*$, so the branch of $f$ that lands in $B$ hits the star of $g$. The composite is one = 7; two = 9."
          - problem: "In the maybe monad, let $f\\colon\\{2,3,4\\}\\to\\{6,7\\}\\sqcup\\{*\\}$ be given by $f(2)=6$, $f(3)=*$, $f(4)=7$, and let $g\\colon\\{6,7\\}\\to\\{5,8\\}\\sqcup\\{*\\}$ be given by $g(6)=5$, $g(7)=*$. Write $10$ for the point $*$ of the composite's codomain, so the answer also records the star branch. Give the values of $g\\circ_T f$ at $2$, $3$ and $4$ as one =, two = and three =, in that order."
            answer: "one = 5; two = 10; three = 10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "one"}, {"contract": {"kind": "exact"}, "name": "two"}, {"contract": {"kind": "exact"}, "name": "three"}]}
            solution_sketch: "Use $g\\circ_T f=\\mu\\circ Tg\\circ f$. Full composite first: at $2$, $f(2)=6$ and $Tg(6)=g(6)=5$, so the value is $5$. At $3$, $f(3)=*$; $Tg$ fixes this star and $\\mu(*)=*$, so the star input of $f$ propagates to $10$. At $4$, $f(4)=7$ and $Tg(7)=g(7)=*$, so $\\mu(*)=*$, giving $10$. The composite is one = 5; two = 10; three = 10."
          - problem: "In the maybe monad, the left unit law says $\\mu_A\\circ T\\eta_A=\\mathrm{id}_{TA}$. Take $A=\\{1,2\\}$ and write $9$ for the point $*$. The map $T\\eta_A\\colon TA\\to TTA$ sends each element of $TA$ to the matching element of the inner layer, and $\\mu_A$ collapses the two star layers into one. Compute $(\\mu_A\\circ T\\eta_A)(2)$ and $(\\mu_A\\circ T\\eta_A)(*)$. Give the two values as at2 = and atstar =, writing 9 for *."
            answer: "at2 = 2; atstar = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "at2"}, {"contract": {"kind": "exact"}, "name": "atstar"}]}
            solution_sketch: "Left unit law check on $TA=\\{1,2,*\\}$. The map $T\\eta_A$ sends $2$ to the element $2$ of the inner layer of $TTA$, and $\\mu_A$ fixes elements of $A$, so $(\\mu_A\\circ T\\eta_A)(2)=2$. The point $*$ of $TA$ is sent by $T\\eta_A$ to the inner star, and $\\mu_A$ collapses the inner star onto the outer star, giving the star of $TA$, that is $9$. The values are at2 = 2; atstar = 9."
          - problem: "In the maybe monad, the right unit law says $\\mu_A\\circ\\eta_{TA}=\\mathrm{id}_{TA}$. Take $A=\\{3,5\\}$ and write $9$ for the point $*$. The unit $\\eta_{TA}\\colon TA\\to TTA$ places each element of $TA$, including the inner star, into the outer layer, and $\\mu_A$ collapses the two star layers into one. Determine $(\\mu_A\\circ\\eta_{TA})(*)$ and give it, writing 9 for *."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Right unit law check at the star point of $TA=\\{3,5,*\\}$. The map $\\eta_{TA}$ sends the star of $TA$ into the outer layer of $TTA$, so it becomes the inner star of the pair of stars. Then $\\mu_A$ collapses the two star layers onto one star of $TA$. The value is 9."
          - problem: "Claim: if $g\\colon B\\to TC$ never takes the value $*$, then for every Kleisli arrow $f\\colon A\\to TB$ the composite $g\\circ_T f\\colon A\\to TC$ never takes the value $*$. Step 1: take $a$ with $f(a)=b\\in B$; then the composite at $a$ is $g(b)$, which is not $*$. Step 2: take $a$ with $f(a)=*$. Step 3: $Tg$ sends this $*$ to $*$, and $\\mu$ sends $*$ to $*$. Step 4: so the composite at $a$ equals $g(*)$, which is not $*$ since $g$ never takes $*$. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: on the branch where $f$ returns $b$ in $B$, the composite applies $g$, and by hypothesis $g(b)$ is not $*$. Step 2 is a valid case distinction, splitting on the two possible shapes of $f(a)$. Step 3 is valid: $Tg$ fixes the star and $\\mu(*)=*$, so the star branch of $f$ yields $*$ in the composite. Step 4 is the first invalid step: $g$ is an ordinary Kleisli arrow defined only on $B$, so $g(*)$ is meaningless; the composite at $a$ is $*$ itself, which contradicts the claim. The answer is Step 4."
          - problem: "In the computation of the Kleisli composite $g\\circ_T f$ for $f\\colon\\{1,2\\}\\to\\{4,5\\}\\sqcup\\{*\\}$ with $f(1)=4$, $f(2)=*$ and $g\\colon\\{4,5\\}\\to\\{6\\}\\sqcup\\{*\\}$ with $g(4)=6$, $g(5)=*$, the line that gives the value of the composite at $2$ is missing. Select the line that is true and that gives the value at 2."
            answer: "The value at 2 is * since Tg(*) = * and mu(*) = *"
            answer_contract: {"kind": "label", "options": [["The value at 2 is * since Tg(*) = * and mu(*) = *"], ["The value at 2 is g(*) = *"], ["The value at 2 is 6 since every input passes through g"], ["The value at 2 is 6 since mu collapses the star onto 6"]]}
            solution_sketch: "At $2$, $f(2)=*$; the functor $Tg$ fixes this star, and the multiplication $\\mu$ sends it to the star of the codomain, so the composite at $2$ is $*$. The option giving $g(*)$ is the error of applying $g$ outside its domain $\\{4,5\\}$. The option giving $6$ for every input is the error of ignoring star propagation. The option attributing $6$ to $\\mu$ is the error of forgetting that $\\mu$ collapses stars to $*$, not to elements. The answer is: The value at 2 is * since Tg(*) = * and mu(*) = *."
          - problem: "Write the full proof: the maybe monad $(T,\\eta,\\mu)$ on Set with $TA=A\\sqcup\\{*\\}$, $\\eta_A$ the inclusion of $A$, and $\\mu_A$ collapsing the two star layers, satisfies both unit laws and the associativity law. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (functor): $T=(-)\\sqcup\\{*\\}$ is a functor; $Tg$ acts as $g$ on the $A$-part and fixes the star, and it preserves identities and composition since the star is fixed throughout. Step 2 (unit): $\\eta_A\\colon A\\to A\\sqcup\\{*\\}$ is the inclusion. Right unit law: for $a\\in A$, $\\eta_{TA}(a)$ places $a$ in the outer layer and $\\mu_A$ fixes $A$-elements, so $\\mu_A\\eta_{TA}(a)=a$. Left unit law: for any $x\\in TA$, $T\\eta_A(x)$ places $x$ in the inner layer; $\\mu_A$ fixes $A$-elements and collapses the inner star onto the outer star, so $\\mu_A T\\eta_A(x)=x$ for every $x$, including the star branch. Step 3 (associativity): $TTA$ carries two star layers; both $\\mu_A\\mu_{TA}$ and $\\mu_{TA}T\\mu_A$ send every $A$-element to itself and every star, however nested, to the single star of $TA$, so the two composites agree. Step 4 (conclusion): $(T,\\eta,\\mu)$ satisfies both unit laws and associativity, hence is a monad. See the solution."
      - id: kp2
        name: The list monad
        key_prerequisites: [functor-examples]
        constraints: "The list monad $TA=A^*$ with $\\eta_A(a)=[a]$ and $\\mu_A=$ flatten; concrete instances use alphabets of at most 3 letters and words of length at most 3, and answers are written as explicit bracketed lists (the empty list as $[\\,]$)."
        exemplars:
          - problem: "For the list monad take $TA = A^*$ with $\\eta_A(a) = [a]$ and $\\mu_A$ = flatten. To check the right unit law $\\mu \\circ T\\eta = 1$, take the word $w = [b, c, a]$ over the alphabet $A = \\{a, b, c\\}$. The map $T\\eta_A$ applies $\\eta$ entrywise and $\\mu_A$ concatenates. Encode each letter by its position: $a$ is 1, $b$ is 2, $c$ is 3. Compute $\\mu_A(T\\eta_A(w))$ and give it as the list of codes of its letters, separated by commas."
            answer: "2, 3, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object is $\\mu_A(T\\eta_A([b, c, a]))$. Rule for $T\\eta_A$: apply the unit entrywise, so each letter becomes a singleton, giving $[[b], [c], [a]]$. Rule for $\\mu_A$: concatenate the inner lists from left to right, giving $[b, c, a]$. The list monad method, entrywise application of the unit followed by flattening by concatenation, is used in these two steps. Encoding $b, c, a$ by position gives the codes 2, 3, 1. The answer is 2, 3, 1."
          - problem: "In the list monad the Kleisli composite is $g \\circ_T f = \\mu \\circ Tg \\circ f$. Let $f\\colon \\{1\\} \\to \\{b, c\\}^*$ have $f(1) = [c, b]$, and let $g\\colon \\{b, c\\} \\to \\{x, y\\}^*$ have $g(c) = [y]$ and $g(b) = [x, y]$. Encode each output letter by its position: $x$ is 1 and $y$ is 2. Compute $(g \\circ_T f)(1)$ and give it as the list of codes of its letters, separated by commas."
            answer: "2, 1, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object is $\\mu_A(Tg(f(1)))$, since $g \\circ_T f = \\mu \\circ Tg \\circ f$. Step 1: apply $f$, giving $f(1) = [c, b]$. Step 2: apply $Tg$ entrywise, giving $[g(c), g(b)] = [[y], [x, y]]$. Step 3: flatten with $\\mu$ by concatenation: $[y]$ followed by $[x, y]$ gives $[y, x, y]$. The list monad method, entrywise application of $g$ followed by flattening by concatenation, is used in Steps 2 and 3. Encoding $y, x, y$ with $x = 1$ and $y = 2$ gives the codes 2, 1, 2. The answer is 2, 1, 2."
          - problem: "Work in the list monad over the alphabet $A = \\{m, n\\}$. In the proof of the associativity law one flattens elements of $TTA$, which are lists of words. Take the element $L = [[m, n], [\\,], [n]]$ of $TTA$: a two-letter word, the empty word, and a one-letter word. Encode $m$ as 1 and $n$ as 2. Compute $\\mu_A(L)$ and give it as the list of codes of its letters, separated by commas."
            answer: "1, 2, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object is $\\mu_A([[m, n], [\\,], [n]])$. Rule for $\\mu_A$: concatenate the inner lists from left to right. The empty list is the identity for concatenation, so it contributes nothing, and $[m, n]$ followed by $[n]$ gives $[m, n, n]$. The list monad method, flattening a list of words by concatenation, is used in this step. Encoding $m = 1$ and $n = 2$ gives the codes 1, 2, 2. The answer is 1, 2, 2."
          - problem: "In the list monad let $f\\colon \\{1\\} \\to \\{r, s\\}^*$ have $f(1) = [r, s, r]$, and let $g\\colon \\{r, s\\} \\to \\{m, n\\}^*$ have $g(r) = [n]$ and $g(s) = [m, m]$. The Kleisli composite is $g \\circ_T f = \\mu \\circ Tg \\circ f$. Give the number of inner lists of $Tg(f(1))$ and the number of letters of $(g \\circ_T f)(1)$."
            answer: "inner = 3; letters = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "inner"}, {"contract": {"kind": "exact"}, "name": "letters"}]}
            solution_sketch: "The full object is $\\mu_A(Tg(f(1)))$, since $g \\circ_T f = \\mu \\circ Tg \\circ f$. Step 1: apply $f$, giving $f(1) = [r, s, r]$. Step 2: apply $Tg$ entrywise, giving $[g(r), g(s), g(r)] = [[n], [m, m], [n]]$, which has three inner lists, so inner = 3. Step 3: flatten with $\\mu$ by concatenating $[n]$, $[m, m]$ and $[n]$ in order, giving $[n, m, m, n]$, a word of four letters, so letters = 4. The list monad method, entrywise application of $g$ followed by flattening by concatenation, is used in Steps 2 and 3. The answer is inner = 3; letters = 4."
          - problem: "In the list monad let $f\\colon \\{1\\} \\to \\{a, b\\}^*$ have $f(1) = [b, a, b]$, and let $g\\colon \\{a, b\\} \\to \\{p, q\\}^*$ have $g(b) = [p, q]$ and $g(a) = [\\,]$. The Kleisli composite is $g \\circ_T f = \\mu \\circ Tg \\circ f$, and the empty word tests how flattening treats it. How many letters does the list $(g \\circ_T f)(1)$ contain?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full value is $\\mu_A(Tg(f(1)))$, since $g \\circ_T f = \\mu \\circ Tg \\circ f$. Step 1: apply $f$, giving $f(1) = [b, a, b]$. Step 2: apply $Tg$ entrywise, giving $[g(b), g(a), g(b)] = [[p, q], [\\,], [p, q]]$. Step 3: flatten with $\\mu$ by concatenation; the empty list is the identity for concatenation and contributes nothing, so the result is $[p, q, p, q]$. The list monad method, entrywise application of $g$ followed by flattening by concatenation, is used in Steps 2 and 3. The word $[p, q, p, q]$ has four letters. The answer is 4."
          - problem: "In the list monad let $f\\colon \\{1\\} \\to \\{b, c\\}^*$ have $f(1) = [c, b]$, and let $g\\colon \\{b, c\\} \\to \\{x, y\\}^*$ have $g(c) = [x]$ and $g(b) = [y]$. The Kleisli composite is $g \\circ_T f = \\mu \\circ Tg \\circ f$, and in computing it at $1$ the middle line, the one that applies $g$ to every entry of $f(1)$, is missing. Select the missing line."
            answer: "$Tg(f(1)) = [[x], [y]]$"
            answer_contract: {"kind": "label", "options": [["$Tg(f(1)) = [[x], [y]]$"], ["$Tg(f(1)) = [x, y]$"], ["$Tg(f(1)) = [[y], [x]]$"], ["$Tg(f(1)) = [c, b]$"]]}
            solution_sketch: "The full object is the middle stage $Tg(f(1))$ of the composite $g \\circ_T f = \\mu \\circ Tg \\circ f$. The list monad method enters here: $T$ applies $g$ entrywise to the word $f(1) = [c, b]$, giving $[g(c), g(b)] = [[x], [y]]$. The option $Tg(f(1)) = [x, y]$ is the error of flattening with $\\mu$ before the entrywise map has been applied; the option $Tg(f(1)) = [[y], [x]]$ swaps the assigned values $g(c)$ and $g(b)$; the option $Tg(f(1)) = [c, b]$ forgets to apply $g$ at all. The answer is $Tg(f(1)) = [[x], [y]]$."
          - problem: "Write the full proof: for the list monad, where $TA = A^*$ is the set of words over $A$, $\\eta_A(a) = [a]$, and $\\mu_A$ concatenates a list of words, the unit laws $\\mu \\circ T\\eta = 1$ and $\\mu \\circ \\eta T = 1$ and the associativity law $\\mu \\circ T\\mu = \\mu \\circ \\mu T$ all hold. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: an element of $TTA$ is a list of words, $\\mu_A$ concatenates those words in order, and $T$ applies any function entrywise. Step 1, right unit: for a word $w = [a_1, \\dots, a_n]$, entrywise application gives $T\\eta_A(w) = [[a_1], \\dots, [a_n]]$, and concatenating the singletons returns $w$; hence $\\mu \\circ T\\eta = 1_{TA}$. Step 2, left unit: the component wraps the whole word, $\\eta_{TA}(w) = [w]$, and $\\mu_A([w]) = w$; hence $\\mu \\circ \\eta T = 1_{TA}$. Step 3, associativity: for $L$ a list of lists of words, $\\mu_A(T\\mu_A(L))$ first flattens each inner block and then concatenates, while $\\mu_A(\\mu_{TA}(L))$ first concatenates block by block and then concatenates the results; both read out every innermost letter in the same left-to-right order because concatenation of words is associative, so $\\mu \\circ T\\mu = \\mu \\circ \\mu T$. Conclusion: both unit laws and associativity hold, so $(T, \\eta, \\mu)$ is a monad."
      - id: kp3
        name: The writer monad over a monoid
        key_prerequisites: [monads]
        constraints: "The writer monad $TA=M\\times A$ over an explicitly named monoid, with $(\\mathbb N,+,0)$ as the concrete case; answers are computed pairs $(m,a)$, and each monad-law check ends in the corresponding monoid law evaluated on the computed values."
        exemplars:
          - problem: "Work in the writer monad $TA = M \\times A$ over the monoid $(\\mathbb N, +, 0)$, so $\\eta_A(a) = (0, a)$ and $\\mu_A(m, (m', a)) = (m + m', a)$. This $\\mu_A$ flattens a pair of logs into one. Compute $\\mu_A(4, (0, 7))$. Give the answer as (m, a)."
            answer: "(4, 7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full element of $T^2A$ is $(4, (0, 7))$. Apply the rule $\\mu_A(m,(m',a)) = (m+m', a)$: the result is $(4 + 0, 7)$. By the identity law of the monoid $(\\mathbb N, +, 0)$, $4 + 0 = 4$, so the unit law of the monad holds at this element. The answer is (4, 7)."
          - problem: "Work in the writer monad over the monoid $(\\mathbb N, +, 0)$, where a Kleisli arrow sends an input to a pair (log, output) and the Kleisli composite is $g \\circ_T f = \\mu \\circ T g \\circ f$. Let $f(1) = (3, 2)$ and $g(2) = (5, 7)$. Compute $(g \\circ_T f)(1)$. Give the answer as (m, a)."
            answer: "(8, 7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Use the definition of the composite: $g \\circ_T f = \\mu \\circ T g \\circ f$. First apply $f$: $f(1) = (3, 2)$. Then apply $T g$: $T g(3, 2) = (3, g(2)) = (3, (5, 7))$. Then flatten with $\\mu$: $\\mu(3, (5, 7)) = (3 + 5, 7)$, and addition is the monoid operation. The answer is (8, 7)."
          - problem: "Work in the writer monad over the monoid $(\\mathbb N, +, 0)$ with Kleisli composite $g \\circ_T f = \\mu \\circ T g \\circ f$. Let $f(1) = (2, 2)$, $g(2) = (3, 4)$ and $h(4) = (5, 6)$ be Kleisli arrows on finite sets. Compute $\\bigl(h \\circ_T (g \\circ_T f)\\bigr)(1)$. Give the answer as (m, a)."
            answer: "(10, 6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Compose the inner pair first, using $g \\circ_T f = \\mu \\circ T g \\circ f$: $f(1) = (2, 2)$, then $T g(2, 2) = (2, (3, 4))$, then $\\mu(2, (3, 4)) = (5, 4)$. Now compose with $h$: $T h(5, 4) = (5, (5, 6))$, and $\\mu(5, (5, 6)) = (5 + 5, 6)$. The logs add because the monoid operation is addition. The answer is (10, 6)."
          - problem: "A student keeps $\\eta_A(a) = (0, a)$ but replaces the multiplication of the writer monad over $(\\mathbb N, +, 0)$ by $\\mu'_A(m, (m', a)) = (m', a)$, which drops the first log. The unit law $\\mu' \\circ T\\eta = \\mathrm{id}$ then fails. Find the smallest $m$ in $\\mathbb N$ for which $\\mu'(T\\eta(m, a))$ is not equal to $(m, a)$."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the full expression: $T\\eta(m, a) = (m, (0, a))$. The student's rule drops the first component, so $\\mu'(T\\eta(m, a)) = (0, a)$. This equals $(m, a)$ exactly when $m = 0$, because $0$ is the identity of $(\\mathbb N, +, 0)$ and no other $m$ is. The first failure is therefore at the next value. The answer is 1."
          - problem: "Over the monoid $(\\mathbb N, +, 0)$, a student claims that taking $\\eta_A(a) = (1, a)$ still yields the writer monad with $\\mu_A(m, (m', a)) = (m + m', a)$, and argues: Step 1: check the unit law $\\mu_A \\circ T\\eta_A = \\mathrm{id}$. Step 2: $T\\eta_A(m, a) = (m, (1, a))$. Step 3: $\\mu_A(m, (1, a)) = (m, a)$. Step 4: hence the unit law holds. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it names the correct unit law to check. Step 2 is valid: $T\\eta_A(m,a) = (m, \\eta_A(a)) = (m, (1,a))$ by the definition of the functor on arrows. Step 3 is not valid: the rule for $\\mu_A$ gives $(m + 1, a)$, not $(m, a)$, since $m + 1 = m$ has no solution in $(\\mathbb N, +, 0)$; the identity element is $0$, not $1$. Step 4 only draws the conclusion from Step 3, so the error starts earlier. The first invalid step is Step 3."
          - problem: "The writer monad can be built over any explicitly named monoid. Take the multiplicative monoid $(\\mathbb N, \\cdot, 1)$, so $\\eta_A(a) = (1, a)$ and $\\mu_A(m, (m', a)) = (m \\cdot m', a)$. Compute $\\mu_A(4, (6, 2))$. Give the answer as (m, a)."
            answer: "(24, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full element of $T^2A$ is $(4, (6, 2))$. The monoid operation here is multiplication, so $\\mu_A$ multiplies the two logs: the first component is $4 \\cdot 6$. By the identity law of $(\\mathbb N, \\cdot, 1)$, the unit of this writer monad logs $1$, and the two logs combine to $24$. The answer is (24, 2)."
          - problem: "Write the full proof: let $(M, \\cdot, e)$ be a monoid; show that the writer functor $TA = M \\times A$ with $\\eta_A(a) = (e, a)$ and $\\mu_A(m, (m', a)) = (m \\cdot m', a)$ is a monad, tracing each monad law back to the corresponding monoid law. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (functor): $Tf(m, a) = (m, f(a))$ preserves identities and composition, so $T$ is a functor. Step 2 (left unit): $\\mu_A(\\eta_{TA}(m, a)) = \\mu_A(e, (m, a)) = (e \\cdot m, a) = (m, a)$ by the left identity law of the monoid. Step 3 (right unit): $\\mu_A(T\\eta_A(m, a)) = \\mu_A(m, (e, a)) = (m \\cdot e, a) = (m, a)$ by the right identity law of the monoid. Step 4 (associativity): both $\\mu \\circ T\\mu$ and $\\mu \\circ \\mu T$ send $(m, (m', (m'', a)))$ to $((m \\cdot m') \\cdot m'', a)$ and $(m \\cdot (m' \\cdot m''), a)$, which are equal by associativity in $M$. Step 5 (conclusion): all three monad laws hold, each reduced to the matching monoid law, so $(T, \\eta, \\mu)$ is a monad."
    diagnostic_exemplar:
      problem: "Work in the writer monad $TA=M\\times A$ over the monoid $M=(\\mathbb N,+,0)$, with $\\eta_A(a)=(0,a)$ and $\\mu_A(m,(m',a))=(m+m',a)$. Let $f(u)=(2,v)$, $g(v)=(3,w)$ and $h(w)=(4,z)$ be Kleisli arrows. Compute $h\\circ_T(g\\circ_T f)$ and $(h\\circ_T g)\\circ_T f$ at $u$, and say whether they agree."
      answer: "Kleisli composition is $g\\circ_T f=\\mu\\circ Tg\\circ f$. First route: $f(u)=(2,v)$, $Tg(2,v)=(2,(3,w))$, $\\mu=(2+3,w)=(5,w)$, so $(g\\circ_T f)(u)=(5,w)$; then $Th(5,w)=(5,(4,z))$ and $\\mu=(5+4,z)=(9,z)$, so $\\big(h\\circ_T(g\\circ_T f)\\big)(u)=(9,z)$. Second route: $Th(g(v))=Th(3,w)=(3,(4,z))$ and $\\mu=(7,z)$, so $(h\\circ_T g)(v)=(7,z)$; then $T(h\\circ_T g)(f(u))=T(h\\circ_T g)(2,v)=(2,(7,z))$ and $\\mu=(2+7,z)=(9,z)$. Both give $(9,z)$ — they agree, as the associativity of Kleisli composition (inherited from the monad associativity law, here from associativity of $+$) requires."
      solution_sketch: "Apply $g\\circ_T f=\\mu\\circ Tg\\circ f$ literally: $T$ leaves the accumulated $\\mathbb N$-tag alone and $\\mu$ adds the two tags. Both bracketings therefore accumulate $2+3+4$, and associativity of $+$ in the monoid is exactly what makes them agree."
    anki_seeds:
      - front: "The maybe monad on $\\mathbf{Set}$: underlying functor $TA$?"
        back: "$A+1$ (a value, or 'nothing')."
        type: basic
      - front: "The list monad on $\\mathbf{Set}$: underlying functor $TA$?"
        back: "$A^*$ (finite lists over $A$)."
        type: basic
      - front: "The writer monad over a monoid $M$: underlying functor $TA$?"
        back: "$M\\times A$ (a value paired with an accumulated $M$-output)."
        type: basic
      - front: "The list monad's multiplication is {{c1::flatten (concatenation)}}."
        back: "flatten (concatenation)"
        type: cloze

  - id: kleisli-categories
    name: Kleisli Categories
    core: false
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: monads
        weight: 0.6
        key: true
      - id: functor-categories
        weight: 0.2
      - id: category-definition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The Kleisli construction
        key_prerequisites: [monads]
        constraints: "Give the objects, the hom-sets $\\mathcal C_T(A,B)=\\mathcal C(A,TB)$, the identity $\\eta_A$ and the composite $g\\circ_T f=\\mu_C\\circ Tg\\circ f$ before anything else; the only concrete identification is $\\mathbf{Set}_P\\simeq\\mathbf{Rel}$ for the power-set monad."
        exemplars:
          - problem: "Let T be the maybe monad on Set: T(X) is X with one extra point z added, the unit sends a to a, and the multiplication flattens T(T(X)) back to T(X). In the Kleisli category the hom-set from A to B is the set of functions from A to T(B). Take A = {1} and B = {u, v}. How many morphisms are there from A to B in this Kleisli category?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Hom-set rule: the Kleisli hom from A to B is the hom C(A, T(B)) of the base category, so a morphism from A to B is a function from A to the set T(B). Full target: T(B) = {u, v, z}, which has 3 elements. Count functions: the domain A = {1} has one element, so each element of T(B) gives exactly one function. The answer is 3."
          - problem: "For the power-set monad P on Set, the Kleisli category is identified with Rel: a Kleisli map from A to B is the same thing as a relation from A to B, and Kleisli composition is relational composition. Let A = {1,2}, B = {4,5}, C = {7,8}. Let R = {(1,4), (1,5), (2,4)} and S = {(4,7), (5,8)}. How many elements of C are related to 1 by the composite relation S after R?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identification rule: under Set_P corresponds to Rel, a Kleisli map A to B realizes the relation of its pairs, and Kleisli composition becomes relational composition. Middle elements: the pairs of R with first entry 1 are (1,4) and (1,5). Apply S: 4 relates to 7 and 5 relates to 8, so the composite relates 1 to 7 and to 8. Count the elements of C reached: 2. The answer is 2."
          - problem: "Let T be the maybe monad on Set: T(X) is X with one extra point 9 added, and the multiplication $\\mu$ flattens T(T(X)) back to T(X). Take A = {1,2}, B = {3,4}, C = {5,6}. Let f: A -> T(B) send 1 to 3 and 2 to 4, and let g: B -> T(C) send 3 to 5 and 4 to 9. The Kleisli composite is $g \\circ_T f = \\mu \\circ Tg \\circ f$. Write c1 for the value of the composite at 1 and c2 for its value at 2. Give c1 and c2."
            answer: "c1 = 5; c2 = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c1"}, {"contract": {"kind": "exact"}, "name": "c2"}]}
            solution_sketch: "Full composite: $g \\circ_T f = \\mu \\circ Tg \\circ f$, so evaluate f first, then g, then flatten with $\\mu$. At 1: f(1) = 3, then g(3) = 5, an element of T(C), and $\\mu$ fixes every element of T(C), so the value is 5. At 2: f(2) = 4, then g(4) = 9, the extra point of T(C), and $\\mu$ returns it, so the value is 9. The answer is c1 = 5; c2 = 9."
          - problem: "For the power-set monad P on Set, the Kleisli composite of f: A -> P(B) and g: B -> P(C) is $\\mu \\circ Pg \\circ f$, where $\\mu$ sends a set of subsets of C to their union. Take A = {1,2}, B = {3,4}, C = {5,6,7,8,9,10}, with f(1) = {3,4}, f(2) = {4}, g(3) = {5,6,7} and g(4) = {8,9,10}. How many elements are in $(g \\circ_T f)(1)$?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full composite: $g \\circ_T f = \\mu \\circ Pg \\circ f$, with $\\mu$ the union of a set of subsets. Step f: f(1) = {3,4}. Step Pg: Pg applied to {3,4} gives the set of subsets {g(3), g(4)} = {{5,6,7}, {8,9,10}}. Step $\\mu$: the union is {5,6,7,8,9,10}. Count the elements: 6. The answer is 6."
          - problem: "Claim: in the Kleisli category of the power-set monad on Set, the identity morphism on A = {1, 2} sends 1 to {1} and 2 to {2}. Step 1: a Kleisli morphism from A to A is a function from A to the set of all subsets of A. Step 2: the unit of the monad sends each element a to the singleton set {a}. Step 3: the function sending 1 to {1} and 2 to {2} takes values in the set of all subsets of A, so it is a Kleisli morphism from A to A. Step 4: therefore, by the Kleisli construction alone, this function is the identity morphism on A. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it restates the hom-set rule of the Kleisli construction, a morphism from A to A is a function from A to the power set of A. Step 2 is valid: the unit of the power-set monad sends each element to its singleton. Step 3 is valid: both values {1} and {2} are subsets of A, so the type condition holds. Step 4 is the first invalid step: landing in the right hom-set does not identify the identity; the identity is the unit itself, and one must verify the unit law, not assert it from the construction alone. The answer is Step 4."
          - problem: "On the poset of all subsets of {1,2,3} ordered by inclusion, let t(X) be X with the element 1 added. This t is a monad: it is monotone, X is contained in t(X), and t(t(X)) = t(X). In its Kleisli category a morphism from A to B exists exactly when A is contained in t(B), and there is at most one such morphism. Take A = {2}. How many subsets B of {1,2,3} admit a morphism from A to B?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Hom-set rule: in the Kleisli category of the monad t, a morphism from A to B is an element of the hom C(A, t(B)), which in a poset is the assertion A contained in t(B). Compute t: t(B) is B with 1 added. Condition: {2} is contained in t(B) exactly when 2 belongs to B. Count the subsets of {1,2,3} that contain 2: {2}, {1,2}, {2,3}, {1,2,3}. The answer is 4."
          - problem: "Write the full proof: for the power-set monad P on Set, a Kleisli morphism from A to B is exactly a relation from A to B, the Kleisli identity on A is the diagonal relation, and Kleisli composition is relational composition. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects and hom-sets): by the Kleisli construction, the objects are sets and a morphism from A to B is a function f: A -> P(B). Step 2 (relations): given f, define a R b iff b is in f(a); given a relation R, define f(a) as the set of b with a R b. These two constructions are mutually inverse, so Kleisli maps are exactly relations. Step 3 (identity): the unit sends a to {a}, which is the diagonal relation, the identity relation on A. Step 4 (composition): for f: A -> P(B) and g: B -> P(C), the composite is the composite of Pg and f with the multiplication, and it sends a to the union of the sets g(b) over all b in f(a), that is the set of c for which some b satisfies a R b and b S c, which is exactly relational composition. Step 5 (conclusion): the bijection of Step 2 preserves identities and composition on both sides, so it is an isomorphism of categories between the Kleisli category and Rel."
      - id: kp2
        name: The Kleisli laws come from the monad laws
        key_prerequisites: [monads]
        constraints: "Equational chases from the definition of $\\circ_T$: each rewrite is executed by substituting the definition of $\\circ_T$ and applying a monad law or a naturality square of $\\eta$ or $\\mu$ at the current expression, and the graded answer is the final computed equation; no elements may be used."
        exemplars:
          - problem: "Work with the maybe monad on sets: M X is the set X with one extra point 0 adjoined, the unit eta_X includes X into M X, M k sends 0 to 0 and every other element x to k(x), and the multiplication mu_X fixes each element of M X and sends the extra outer point to 0. Take A = {1, 2, 3} and B = {4, 5}, and let f: A to M B be given by f(1) = 4, f(2) = 5, f(3) = 0. Recall that the Kleisli composite g o_T f is mu_C o M g o f. Give the values of f o_T eta_A at 1, 2 and 3, in that order, as a list."
            answer: "4, 5, 0"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Full object first: f o_T eta_A = mu_B o M f o eta_A by the definition of the Kleisli composite. Evaluate at 1: eta_A(1) = 1, then M f(1) = f(1) = 4, and mu_B fixes 4. At 2 the same chase gives M f(2) = 5 and mu_B fixes 5. At 3: M f(3) = f(3) = 0 and mu_B fixes that 0 as well. The values agree with f, which is the right identity law of the Kleisli category holding on this instance. The values are 4, 5, 0."
          - problem: "Use the maybe monad on finite sets: M X is X plus one extra point 0, the unit eta_X is the inclusion, M k maps 0 to 0 and every x to k(x), and mu_X fixes the elements of M X while sending the outer extra point to 0. Let g: {1, 2, 3} to {4, 5} be g(1) = 4, g(2) = 5, g(3) = 4, and let h: {4, 5} to {6, 7} be h(4) = 7, h(5) = 6. The functor J into the Kleisli category sends a map k to eta o k, and the Kleisli rule is g o_T f = mu_C o M g o f. Give the values of J(h) o_T J(g) at 1, 2 and 3, in that order, as a list."
            answer: "7, 6, 7"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Full object: J(h) o_T J(g) = mu_C o M(eta_C o h) o eta_B o g, expanding each factor J(k) = eta o k and then applying the definition of the Kleisli composite. At 1: g(1) = 4, eta_B(4) = 4, then M(eta_C o h)(4) = eta_C(h(4)) = 7, and mu_C fixes 7. At 2: g(2) = 5, and the same chase gives eta_C(6) = 6, which mu_C fixes. At 3: g(3) = 4 gives 7 again. The result equals J(h o g), the statement that J preserves composition, made concrete. The values are 7, 6, 7."
          - problem: "Inside the maybe monad, M X is the set X with a fresh point 0 adjoined, eta_X is the inclusion, M k carries 0 to 0 and every x to k(x), and mu_X keeps each element of M X while mapping the outer point to 0. Define f: {1, 2} to M{4, 5} by f(1) = 4, f(2) = 0, then g: {4, 5} to M{6, 7} by g(4) = 6, g(5) = 7, and h: {6, 7} to M{8, 9} by h(6) = 9, h(7) = 0. The Kleisli rule is g o_T f = mu_C o M g o f. Give the values of (h o_T g) o_T f at 1 and 2, in that order, as a list."
            answer: "9, 0"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Full object: (h o_T g) o_T f = mu o M(h o_T g) o f by the definition of the Kleisli composite. First compute the inner composite h o_T g = mu o M h o g: at 4 it gives h(g(4)) = h(6) = 9, which mu fixes; at 5 it gives h(7) = 0, which mu fixes. Now at 1: f(1) = 4, then M(h o_T g)(4) = 9, and mu fixes 9. At 2: f(2) = 0, M(h o_T g) sends 0 to the outer point, and mu maps the outer point back to 0. The other grouping h o_T (g o_T f) yields the same two values, the associativity of o_T on this instance. The values are 9, 0."
          - problem: "In the Kleisli category of a monad T on a category C, take f: A to T B. A chase proves the identity law f o_T eta_A = f. Line 1 reads f o_T eta_A = mu_B o T f o eta_A. Line 2 applies the naturality square of eta at f and nothing else. In the options, p q abbreviates the composite p o q. Select the option that is Line 2."
            answer: "mu_B eta_TB f"
            answer_contract: {"kind": "label", "options": [["mu_B eta_TB f"], ["mu_B f eta_TB"], ["eta_TB mu_B f"], ["f mu_B eta_TB"]]}
            solution_sketch: "The full chase starts from f o_T eta_A = mu_B o T f o eta_A. The naturality square of eta at f: A to T B states T f o eta_A = eta_{T B} o f, so substituting gives Line 2 as mu_B o eta_{T B} o f. The option mu_B f eta_TB composes in the wrong order, reading the square backwards. The option eta_TB mu_B f puts the flattening map before the unit, where it cannot apply. The option f mu_B eta_TB lists the factors in reverse order entirely. The answer is mu_B eta_TB f."
          - problem: "In the Kleisli category of a monad T, a chase establishes the identity eta_B o_T f = f for f: A to T B. Its final line replaces mu_B o T eta_B with the identity on T B. Which monad identity is the hypothesis that licenses this replacement?"
            answer: "right unit law"
            answer_contract: {"kind": "label", "options": [["left unit law"], ["right unit law"], ["associativity law"], ["naturality of mu"]]}
            solution_sketch: "The composite mu_B o T eta_B is the component at B of mu o T eta, and the replacement mu_B o T eta_B = 1 is exactly that law at B. The option left unit law is wrong: it states mu o eta T = 1, whose component is mu_B o eta_{T B}, a different composite that appears in the other identity chase. The option associativity law is wrong: it is the equation mu o T mu = mu o mu T between two double-flattening maps, not an identity map. The option naturality of mu is wrong: the square of mu compares flattening maps along a map and produces no equation with the identity on T B. The answer is right unit law."
          - problem: "The maybe monad on finite sets works as follows. For a set X, the set M X holds the elements of X and a new point 0; the unit eta_X sends each element of X to itself inside M X; for a map k, M k takes 0 to 0 and each element x to k(x); and the flattening map mu_X fixes the inner copy of M X inside M M X and maps the added outer point to 0. Choose A = {2, 5, 8} and B = {3, 7}, and let f: A to M B be the map with f(2) = 3, f(5) = 7 and f(8) = 0. In the Kleisli category, the composite of f: A to M B followed by g: B to M C is mu_C o M g o f. Give the values of eta_B o_T f at 2, 5 and 8, in that order, as a list."
            answer: "3, 7, 0"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Full object first: eta_B o_T f = mu_B o M eta_B o f by the definition of the Kleisli composite. At 2: f(2) = 3, so M eta_B(3) = eta_B(3) = 3, a point of the inner copy of M B, and mu_B fixes it. At 5: f(5) = 7, M eta_B(7) = 7, and mu_B fixes 7 as well. At 8: f(8) = 0, M eta_B takes 0 to the added outer point of M M B, and mu_B maps that outer point back to 0. Each step used the definition of the composite, the action of M on a map, and the action of the flattening map; the outcome matches f, the left identity law of the Kleisli category checked on these data, and the equational chase behind it ends with the monad law mu o M eta = 1. The values are 3, 7, 0."
          - problem: "Write the full proof: for a monad (T, eta, mu) on a category C whose Kleisli composite is g o_T f = mu_C o T g o f, the operation o_T is associative. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Take f: A to T B, g: B to T C and h: C to T D. Step 1, definition of o_T: (h o_T g) o_T f = mu_D o T(h o_T g) o f. Step 2, definition of o_T on the inner pair plus functoriality of T: h o_T g = mu_D o T h o g, so (h o_T g) o_T f = mu_D o T mu_D o T T h o T g o f. Step 3, definition of o_T on the other grouping: h o_T (g o_T f) = mu_D o T h o mu_C o T g o f. Step 4, monad associativity law mu o T mu = mu o mu T: mu_D o T mu_D = mu_D o mu_{T D}, so the left side becomes mu_D o mu_{T D} o T T h o T g o f. Step 5, naturality square of mu at h: mu_{T D} o T T h = T h o mu_C. Substituting gives mu_D o T h o mu_C o T g o f, exactly the expression of Step 3. Hence (h o_T g) o_T f = h o_T (g o_T f), so o_T is associative. Every step cited the definition of o_T, the functoriality of T, the monad associativity law, or the naturality square of mu by name, and no elements were used."
    diagnostic_exemplar:
      problem: "Let $T$ be a monad on $\\mathcal C$ and $\\mathcal C_T$ its Kleisli category, with $\\mathcal C_T(A,B)=\\mathcal C(A,TB)$, identities $\\eta_A$ and composition $g\\circ_T f=\\mu_C\\circ Tg\\circ f$. Prove that $\\eta$ is a two-sided identity for $\\circ_T$: for every $f\\colon A\\to TB$, $\\eta_B\\circ_T f=f$ and $f\\circ_T\\eta_A=f$. Name the monad law or naturality square used at each step."
      answer: "Right identity for $\\eta_B$: $\\eta_B\\circ_T f=\\mu_B\\circ T(\\eta_B)\\circ f=(\\mu\\circ T\\eta)_B\\circ f=1_{TB}\\circ f=f$, using the monad unit law $\\mu\\circ T\\eta=1_T$ at $B$. Left identity for $\\eta_A$: $f\\circ_T\\eta_A=\\mu_B\\circ Tf\\circ\\eta_A$. Naturality of $\\eta\\colon 1\\Rightarrow T$ at the morphism $f\\colon A\\to TB$ gives $Tf\\circ\\eta_A=\\eta_{TB}\\circ f$, so this equals $\\mu_B\\circ\\eta_{TB}\\circ f=(\\mu\\circ\\eta T)_B\\circ f=1_{TB}\\circ f=f$, using the other monad unit law $\\mu\\circ\\eta T=1_T$ at $B$. So $\\eta_A$ is a two-sided identity at $A$ in $\\mathcal C_T$."
      solution_sketch: "Two different laws do the two sides. $\\eta_B\\circ_T f$ unfolds straight to $(\\mu\\circ T\\eta)_B\\circ f$, one unit law. The other side, $f\\circ_T\\eta_A$, first needs naturality of $\\eta$ at $f$ to move $\\eta$ past $Tf$, and only then the second unit law $\\mu\\circ\\eta T=1_T$."
    anki_seeds:
      - front: "In the Kleisli category $\\mathcal C_T$, what is a morphism $A\\to B$?"
        back: "a $\\mathcal C$-morphism $A\\to TB$."
        type: basic
      - front: "What is the identity on $A$ in the Kleisli category $\\mathcal C_T$?"
        back: "the monad unit $\\eta_A\\colon A\\to TA$."
        type: basic
      - front: "Kleisli composition of $f\\colon A\\to TB$, $g\\colon B\\to TC$ is {{c1::$\\mu_C\\circ Tg\\circ f$}}."
        back: "$\\mu_C\\circ Tg\\circ f$"
        type: cloze

