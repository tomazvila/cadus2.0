        weight: 0.2
    knowledge_points:
      - id: kp1
        name: A monad is a monoid in endofunctors
        key_prerequisites: [monoids]
        constraints: "Translate the complete monoid-object data and laws into the strict monoidal category of endofunctors, with composition as tensor and the identity functor as tensor unit. Closed items may construct the categorical object or diagnose assertions whose validity the learner must determine; the unmarked item asks for a full proof. Candidate claims must not be endorsed or explained by the stem."
        step_check:
          step: 'Composition is strictly associative and strictly unital, so no associator or unitor cells appear'
          question: 'Why do no associator or unitor cells appear in the laws of a monoid in the endofunctor category?'
          options:
            - 'Natural transformations between endofunctors always commute with composition'
            - 'Functor composition is strict, so those cells are identity arrows'
            - 'The multiplication $\mu$ already absorbs the associator into its definition'
            - 'Every monoid in a monoidal category satisfies its laws without any cells'
          answer: 'Functor composition is strict, so those cells are identity arrows'
          why: '$(F\circ G)\circ H$ and $F\circ(G\circ H)$ are the same functor, and $1\circ F=F=F\circ 1$, so the associator and unitors are identity cells that can be left out.'
        try_first:
          problem: 'A monoid in $(\mathbf{Set},\times,\{*\})$ is a set $M$ with a product $m\colon M\times M\to M$. If $M$ has $5$ elements, how many elements does the source $M\times M$ of $m$ have?'
          answer_contract: {"kind": "exact"}
          answer: '25'
          reveal: 'The source of the product is the tensor square $M\times M$, which has $5\cdot 5=25$ elements. In the endofunctor category the tensor is composition, so the source of the multiplication of a monoid $T$ is $T\circ T$.'
        exemplars:
          - problem: 'In the monoidal category $([\mathbf{Set},\mathbf{Set}],\circ,1_{\mathbf{Set}})$ the multiplication of a monoid object $T$ is a natural transformation $\mu\colon T\circ T\Rightarrow T$. For the power-set functor $P$ and a set $X$ with $2$ elements, how many elements does the source set $(P\circ P)(X)$ of $\mu_X$ have?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $P(X)$ has $2^2=4$ elements. The source is $P(P(X))$, the set of subsets of a $4$-element set, which has $2^4=16$ elements.'
          - problem: 'In the endofunctor category the tensor product of two functors is their composite. Let $F(X)=X\times\{0,1\}$ and $G(X)=X\cup\{*\}$. For a set $X$ with $3$ elements, how many elements does $(G\circ F)(X)$ have?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $F(X)$ has $3\cdot 2=6$ elements. Then $G$ adds one extra point, so $(G\circ F)(X)=G(F(X))$ has $6+1=7$ elements. The composite $F\circ G$ would give $(3+1)\cdot 2=8$, so the order of the tensor matters.'
          - problem: 'A computation returns a value together with a log entry from $\mathbb Z_3=\{0,1,2\}$, so its results live in the writer functor $T(X)=X\times\mathbb Z_3$. If $X$ has $4$ elements, how many elements does $(T\circ T)(X)$, the source of the multiplication, have?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $T(X)$ has $4\cdot 3=12$ elements. Applying $T$ again gives $12\cdot 3=36$ elements, so $(T\circ T)(X)$ has $36$ elements.'
          - problem: 'A program reads a switch that is either on or off, so its results live in the reader functor $R(X)=X^E$ with $E=\{\text{on},\text{off}\}$, the set of functions $E\to X$. If $X$ has $3$ elements, how many elements does $(R\circ R)(X)$ have?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A function from a $2$-element set to $X$ is a pair of values, so $R(X)$ has $3^2=9$ elements. Applying $R$ again gives $9^2=81$ elements for $(R\circ R)(X)$.'
          - problem: 'A monoid in $(\mathbf{Set},\times,\{*\})$ is a set $M$ with a product $m\colon M\times M\to M$ and a unit $e\colon\{*\}\to M$. For $M=\mathbb Z_6$ with addition mod $6$, what is $m(4,5)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The product is addition mod $6$, so $m(4,5)=(4+5)\bmod 6=9\bmod 6=3$. A monad plays the same role one level up, with composition of functors as the product.'
          - problem: 'Is $(F\circ G)\circ H=F\circ(G\circ H)$ for all endofunctors $F$, $G$, $H$ of a category $\mathcal C$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they are equal", "equal", "always", "it holds", "the same functor"], ["no", "they are not equal", "not equal", "never", "it fails", "different functors"]]}
            solution_sketch: 'Both sides send an object $X$ to $F(G(H(X)))$ and an arrow $f$ to $F(G(H(f)))$, so they are the same functor. This is why the monoidal category of endofunctors is strict and a monoid in it needs no associator. The answer is yes.'
          - problem: 'In the strict monoidal category of endofunctors $([\mathcal C,\mathcal C],\circ,1_{\mathcal C})$ a monoid object $T$ has a multiplication $T\circ T\Rightarrow T$. Does its unit go from $1_{\mathcal C}$ to $T$, or from $T$ to $1_{\mathcal C}$?'
            answer: 'from 1 to T'
            answer_contract: {"kind": "label", "options": [["from 1 to T", "1 to t", "id to t", "identity to t", "from the identity functor to t", "identity functor to t", "from id to t", "1_c to t"], ["from T to 1", "t to 1", "t to id", "t to identity", "from t to the identity functor", "t to identity functor", "from t to id", "t to 1_c"]]}
            solution_sketch: 'The unit of a monoid object goes from the tensor unit to the object. The tensor unit of the endofunctor category is $1_{\mathcal C}$, so the unit is $\eta\colon 1_{\mathcal C}\Rightarrow T$. It does not go from $T$ to $1_{\mathcal C}$.'
          - problem: 'Write the full proof that a monad $(T,\mu,\eta)$ on a category $\mathcal C$ is exactly a monoid object in the monoidal category $([\mathcal C,\mathcal C],\circ,1_{\mathcal C})$, and that no associator or unitor cells appear because composition of endofunctors is strict. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The category $[\mathcal C,\mathcal C]$ has the endofunctors of $\mathcal C$ as objects and the natural transformations as morphisms. The tensor of $F$ and $G$ is the composite $F\circ G$ and the unit object is $1_{\mathcal C}$. Composition of functors is associative and unital on the nose, so the associator and unitor cells are identities and appear in no law. A monoid object is an endofunctor $T$ with a multiplication $\mu\colon T\circ T\Rightarrow T$ and a unit $\eta\colon 1_{\mathcal C}\Rightarrow T$. The monoid associativity diagram says $\mu\circ T\mu=\mu\circ\mu T$ as maps $T^3\Rightarrow T$, which is the monad associativity law. The monoid unit diagrams say $\mu\circ\eta T=1_T=\mu\circ T\eta$, which are the monad unit laws. The data and the laws coincide, so a monad on $\mathcal C$ is precisely a monoid in $([\mathcal C,\mathcal C],\circ,1_{\mathcal C})$.'
      - id: kp2
        name: Checking the laws on the power-set monad
        key_prerequisites: [natural-transformations]
        constraints: "Verify powerset naturality and monad laws by constructing and comparing both routes. Include a defective multiplication and general membership descriptions of the two associativity intermediates."
        step_check:
          step: 'take an arbitrary $S\in PA$'
          question: 'Why is it enough to take an arbitrary $S\in PA$ instead of one particular subset?'
          options:
            - 'Any single subset behaves like all the others, by naturality'
            - 'The empty subset is the only case in which the law could ever fail'
            - 'The law is an equation, so it must hold at every element of $PA$'
            - 'Checking one subset proves the law once that subset has two elements'
          answer: 'The law is an equation, so it must hold at every element of $PA$'
          why: '$\mu\circ P\eta=1_P$ says that two maps agree on every $S\in PA$; an arbitrary $S$ stands for all of them, while one chosen subset would test only one case.'
        exemplars:
          - problem: 'In the power-set monad on $\mathbf{Set}$ the multiplication $\mu_X$ sends a set of subsets to its union. For $\mathcal U=\{\{1,2\},\{2,3\},\{3,4\}\}$, what is $\mu_X(\mathcal U)$?'
            answer: '1, 2, 3, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The union of $\{1,2\}$, $\{2,3\}$ and $\{3,4\}$ contains every element that lies in at least one of them. This is the set $\{1,2,3,4\}$.'
          - problem: 'In the power-set monad $\eta_X(x)=\{x\}$ and $\mu_X$ is union. For $S=\{2,5,7\}$, compute $\mu_X\big(P(\eta_X)(S)\big)$.'
            answer: '2, 5, 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $P(\eta_X)$ replaces each element by its singleton, so $P(\eta_X)(S)=\{\{2\},\{5\},\{7\}\}$. The union of these singletons is $\{2,5,7\}=S$, as the unit law $\mu\circ P\eta=1_P$ requires.'
          - problem: 'In the power-set monad let $\mathcal U=\{\{\{1,2\},\{3\}\},\{\{3\},\{5,6\}\}\}$ in $P^3(X)$. Compute $\mu_X\big(P(\mu_X)(\mathcal U)\big)$.'
            answer: '1, 2, 3, 5, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $P(\mu_X)$ takes the union inside each member of $\mathcal U$, giving $\{\{1,2,3\},\{3,5,6\}\}$. The union of these two sets is $\{1,2,3,5,6\}$.'
          - problem: 'In the power-set monad let $\mathcal U=\{\{\{1\},\{2,3\}\},\{\{4\}\},\{\{2,4\},\{6\}\}\}$ in $P^3(X)$. Compute $\mu_X\big(\mu_{P(X)}(\mathcal U)\big)$.'
            answer: '1, 2, 3, 4, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $\mu_{P(X)}$ takes the union of the members of $\mathcal U$ as families, giving $\{\{1\},\{2,3\},\{4\},\{2,4\},\{6\}\}$. Then $\mu_X$ takes the union of these subsets, which is $\{1,2,3,4,6\}$.'
          - problem: 'In the power-set monad let $\mathcal U=\{\{\{1,2\},\{3\}\},\{\{1,3\},\{2\}\},\{\{4\}\}\}$ in $P^3(X)$. How many members does $P(\mu_X)(\mathcal U)$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $P(\mu_X)$ takes the union inside each member of $\mathcal U$, giving $\{1,2,3\}$, $\{1,2,3\}$ and $\{4\}$. A set lists a member once, so $P(\mu_X)(\mathcal U)=\{\{1,2,3\},\{4\}\}$ has $2$ members. The other route $\mu_{P(X)}(\mathcal U)$ has $5$ members, yet both routes give the same final union.'
          - problem: 'Let $f\colon\{1,2,3,4\}\to\{0,1\}$ be given by $f(1)=0$, $f(2)=1$, $f(3)=0$, $f(4)=1$, and let $\mathcal F=\{\{1,2\},\{2,3\},\{4\}\}$. In the power-set monad, compute $\mu_{\{0,1\}}\big(P(Pf)(\mathcal F)\big)$.'
            answer: '0, 1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $P(Pf)$ applies $f$ to every element of every member, giving $\{\{0,1\},\{1,0\},\{1\}\}=\{\{0,1\},\{1\}\}$. Taking the union gives $\{0,1\}$. The other route, $Pf(\mu(\mathcal F))=Pf(\{1,2,3,4\})$, also gives $\{0,1\}$, as naturality of $\mu$ requires.'
          - problem: 'Sam proposes to replace the multiplication of the power-set monad on the set $\{1,2\}$ by $\nu(\mathcal F)=\bigcup\mathcal F$ when $\mathcal F$ has exactly one member and $\nu(\mathcal F)=\varnothing$ otherwise. For which subset $S$ of $\{1,2\}$ does $\nu\big(P(\eta)(S)\big)$ differ from $S$?'
            answer: '1, 2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $S=\varnothing$ the family $P(\eta)(S)$ is empty, so $\nu$ gives $\varnothing=S$. For $S=\{1\}$ and $S=\{2\}$ the family has one member, so $\nu$ gives $S$ again. For $S=\{1,2\}$ the family $\{\{1\},\{2\}\}$ has two members, so $\nu$ gives $\varnothing$, and the unit law fails at $S=\{1,2\}$.'
          - problem: 'A board is made of committees, and each committee is a set of members: $\{\text{Ann},\text{Bo}\}$, $\{\text{Bo},\text{Cy}\}$ and $\{\text{Di}\}$. The multiplication of the power-set monad sends the board to the set of people who sit on at least one committee. How many people is that?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The union of the three committees is $\{\text{Ann},\text{Bo},\text{Cy},\text{Di}\}$. Bo sits on two committees but counts once, so there are $4$ people.'
          - problem: 'Write the full proof that the power-set monad $P$ on $\mathbf{Set}$, with $\eta_A(a)=\{a\}$ and $\mu_A(\mathcal S)=\bigcup\mathcal S$, satisfies the unit law $\mu\circ\eta P=1_P$, the unit law $\mu\circ P\eta=1_P$ and the associativity law $\mu\circ P\mu=\mu\circ\mu P$, by evaluating both legs on a general element of $PA$, $P^2(A)$ or $P^3(A)$ and comparing the resulting unions. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'For the first unit law take $S$ in $PA$. Then $\eta_{PA}(S)=\{S\}$ and $\mu_A(\{S\})=\bigcup\{S\}=S$. For the second unit law, $(P\eta)_A(S)=\{\{a\}:a\in S\}$ and $\mu_A$ unions these singletons back to $S$. For associativity take $\mathcal U$ in $P^3(A)$. The leg $\mu\circ P\mu$ replaces each member family $\mathcal S$ of $\mathcal U$ by $\bigcup\mathcal S$ and then unions, giving the set of all $a$ with $a\in S\in\mathcal S\in\mathcal U$ for some $S$ and $\mathcal S$. The leg $\mu\circ\mu P$ unions the members of $\mathcal U$ first and then unions again, giving the same set of elements of $A$. All three laws hold, so $(P,\eta,\mu)$ is a monad.'
      - id: kp3
        name: Comonads by duality
        key_prerequisites: [functor-categories]
        constraints: "Derive comonad data and laws by reversing monad arrows and checking the types of whiskered transformations. Closed items may construct the categorical object or diagnose assertions whose validity the learner must determine; the unmarked item asks for a full proof. Candidate claims must not be endorsed or explained by the stem."
        step_check:
          step: 'so $W\delta,\delta W\colon W^2\Rightarrow W^3$'
          question: 'Why do $W\delta$ and $\delta W$ both go from $W^2$ to $W^3$?'
          options:
            - 'Whiskering by $W$ replaces the source $W$ by $W^2$ and keeps the target'
            - 'Because $\delta$ is applied twice, which doubles both $W$ and $W^2$'
            - 'Because a comonad always has the same source for every whiskered arrow'
            - 'Whiskering $\delta$ by $W$ adds one copy of $W$ to source and target'
          answer: 'Whiskering $\delta$ by $W$ adds one copy of $W$ to source and target'
          why: 'Composing $W$ on either side of $\delta\colon W\Rightarrow W^2$ turns the source $W$ into $W^2$ and the target $W^2$ into $W^3$, whichever side $W$ is placed on.'
        exemplars:
          - problem: 'A program carries a value together with a fixed setting from a set $E$, so it works in the comonad $W(X)=X\times E$ with counit $\varepsilon_X(x,e)=x$ and comultiplication $\delta_X(x,e)=((x,e),e)$. What is $\delta_X(4,7)$?'
            answer: '((4, 7), 7)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The comultiplication duplicates the setting and nests the pair. So $\delta_X(4,7)=((4,7),7)$.'
          - problem: 'For the comonad $W(X)=X\times E$ with $W(f)=f\times 1_E$, $\varepsilon_X(x,e)=x$ and $\delta_X(x,e)=((x,e),e)$, compute $(W\varepsilon)_X\big(\delta_X(3,8)\big)$.'
            answer: '(3, 8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'First $\delta_X(3,8)=((3,8),8)$. The component $(W\varepsilon)_X=W(\varepsilon_X)=\varepsilon_X\times 1_E$ sends $((3,8),8)$ to $(\varepsilon_X(3,8),8)=(3,8)$. This is the original element, as a counit law requires.'
          - problem: 'A program carries a value together with a fixed setting, so it uses the comonad $W(X)=X\times E$ with $\varepsilon_X(x,e)=x$ and $\delta_X(x,e)=((x,e),e)$. Compute $(\varepsilon W)_X\big(\delta_X(6,1)\big)$.'
            answer: '(6, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'First $\delta_X(6,1)=((6,1),1)$. The component $(\varepsilon W)_X=\varepsilon_{WX}$ discards the outer setting and keeps the inner pair, so the value is $(6,1)$, the original element.'
          - problem: 'The comultiplication $\delta$ of a comonad $(W,\varepsilon,\delta)$ is a natural transformation from $W$ to $W^2$. The whiskered transformation $\delta W$ goes from $W^a$ to $W^b$. Find $a$ and $b$.'
            answer: 'a = 2; b = 3'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'Composing $W$ on the right of $\delta\colon W\Rightarrow W^2$ turns the source $W$ into $W\circ W=W^2$ and the target $W^2$ into $W^2\circ W=W^3$. So $a=2$ and $b=3$.'
          - problem: 'For the comonad $W(X)=X\times E$ with $W(f)=f\times 1_E$ and $\delta_X(x,e)=((x,e),e)$, compute $(W\delta)_X\big(\delta_X(4,7)\big)$.'
            answer: '(((4, 7), 7), 7)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $\delta_X(4,7)=((4,7),7)$. Then $(W\delta)_X=W(\delta_X)$ applies $\delta_X$ to the first slot and keeps the setting, giving $(\delta_X(4,7),7)=(((4,7),7),7)$.'
          - problem: 'Take $E=\mathbb Z$ and $W(X)=X\times E$ with $\varepsilon_X(x,e)=x$. Sam changes the comultiplication to $\gamma_X(x,e)=((x,e),e+1)$ and checks the counit law $W\varepsilon\circ\gamma=1_W$ at $(5,2)$. What is $(W\varepsilon)_X\big(\gamma_X(5,2)\big)$?'
            answer: '(5, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'First $\gamma_X(5,2)=((5,2),3)$. Then $(W\varepsilon)_X$ applies $\varepsilon_X$ to the first slot, giving $(\varepsilon_X(5,2),3)=(5,3)$. This is not $(5,2)$, so the counit law fails for $\gamma$.'
          - problem: 'A comonad $(W,\varepsilon,\delta)$ on a category $\mathcal D$ is a monad on the opposite category $\mathcal D^{op}$. Does its counit $\varepsilon$ run from $1_{\mathcal D}$ to $W$, as the unit of a monad does?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it does not", "it runs from W to 1", "from W to 1", "W to 1"], ["yes", "it does", "it runs from 1 to W", "from 1 to W", "1 to W"]]}
            solution_sketch: 'The unit of a monad on $\mathcal D^{op}$ is an arrow $1\Rightarrow W$ in $\mathcal D^{op}$. Read back in $\mathcal D$ every arrow reverses, so it is the counit $\varepsilon\colon W\Rightarrow 1_{\mathcal D}$. The answer is no.'
          - problem: 'Write the full proof that a comonad $(W,\varepsilon,\delta)$ on a category $\mathcal D$ is exactly a monad on the opposite category of $\mathcal D$, and that each comonad law is the corresponding monad law with every arrow reversed. Give the types of $\varepsilon$ and $\delta$, check the whiskered types in all three laws, and derive each comonad law from its monad counterpart. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'A monad on $\mathcal D^{op}$ is a functor $W$ with a unit $1\Rightarrow W$ and a multiplication $W^2\Rightarrow W$. Read back in $\mathcal D$ every arrow reverses, so the data become $\varepsilon\colon W\Rightarrow 1$ and $\delta\colon W\Rightarrow W^2$, which is a comonad on $\mathcal D$. The whiskered transformations $\delta W$ and $W\delta$ run from $W^2$ to $W^3$, and $\varepsilon W$ and $W\varepsilon$ run from $W^2$ to $W$, so both sides of each law have the same type. The monad associativity law reversed gives $W\delta\circ\delta=\delta W\circ\delta$. The monad unit laws reversed give $\varepsilon W\circ\delta=1_W=W\varepsilon\circ\delta$. Reversing arrows again turns a comonad on $\mathcal D$ back into a monad on $\mathcal D^{op}$, and the two constructions are inverse to each other.'
    diagnostic_exemplar:
      problem: "Fix a set $A$ and define $W\\colon\\mathbf{Set}\\to\\mathbf{Set}$ by $WX=A\\times X$, $Wf=1_A\\times f$, with $\\varepsilon_X(a,x)=x$ and $\\delta_X(a,x)=(a,(a,x))$. Prove that $(W,\\varepsilon,\\delta)$ is a comonad: give the type of each whiskered transformation and check coassociativity and both counit laws elementwise."
      answer: "Types: $\\varepsilon\\colon W\\Rightarrow 1_{\\mathbf{Set}}$ and $\\delta\\colon W\\Rightarrow W^2$; whiskering gives $W\\varepsilon,\\varepsilon W\\colon W^2\\Rightarrow W$ and $W\\delta,\\delta W\\colon W^2\\Rightarrow W^3$, so the counit laws $\\varepsilon W\\circ\\delta=1_W=W\\varepsilon\\circ\\delta$ and the coassociativity law $W\\delta\\circ\\delta=\\delta W\\circ\\delta$ are equations $W\\Rightarrow W$ and $W\\Rightarrow W^3$ — the monad axioms with every arrow reversed. Both $\\varepsilon$ and $\\delta$ are natural (they only copy or discard the $A$-coordinate and commute with $1_A\\times f$). Counit laws: $(\\varepsilon W)_X=\\varepsilon_{WX}$ sends $(a,(a',x))\\mapsto(a',x)$, so on $\\delta_X(a,x)=(a,(a,x))$ it returns $(a,x)$; $(W\\varepsilon)_X=W(\\varepsilon_X)$ sends $(a,(a',x))\\mapsto(a,x)$, so on $(a,(a,x))$ it also returns $(a,x)$. Both composites are $1_{WX}$. Coassociativity: $(W\\delta)_X\\big(\\delta_X(a,x)\\big)=W(\\delta_X)(a,(a,x))=(a,\\delta_X(a,x))=(a,(a,(a,x)))$, while $(\\delta W)_X\\big(\\delta_X(a,x)\\big)=\\delta_{WX}(a,(a,x))=(a,(a,(a,x)))$. The two agree, so $(W,\\varepsilon,\\delta)$ is a comonad."
      solution_sketch: "Reverse every arrow of the monad axioms to fix the types, then chase the pair $(a,x)$ through each composite. $\\delta$ duplicates the $A$-slot and each counit law discards one of the two copies, which is why both return $(a,x)$; coassociativity is the observation that both routes build the same triply nested pair."
    anki_seeds:
      - front: "A monad is a monoid in the category of {{c1::endofunctors}} (under composition)."
        back: "endofunctors"
        type: cloze
      - front: "In the power-set monad, what are $\\eta$ and $\\mu$?"
        back: "$\\eta_A(a)=\\{a\\}$ and $\\mu_A(\\mathcal{S})=\\bigcup\\mathcal{S}$."
        type: basic
      - front: "A comonad $(W,\\varepsilon,\\delta)$ is a monad on which category?"
        back: "$\\mathcal{D}^{op}$ — reverse all arrows: $\\varepsilon\\colon W\\Rightarrow 1$ and $\\delta\\colon W\\Rightarrow W^2$."
        type: basic

