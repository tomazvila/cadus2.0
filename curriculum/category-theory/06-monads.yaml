    knowledge_points:
      - id: kp1
        name: The data and the types of the whiskered transformations
        key_prerequisites: [whiskering]
        constraints: "Give the type of each whiskered transformation and its component at an object before writing any law."
        exemplars:
          - problem: "A monad on a category C is the data of an endofunctor T : C -> C, a unit eta : Id_C => T, and a multiplication mu : T^2 => T, where T^2 means T after T. Whiskering mu on the left by T produces a natural transformation T mu from T^a to T^b. Give the exponents a and b."
            answer: "a = 3; b = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "The full object is the whiskered transformation T mu : T after T^2 => T after T. Step 1 (whiskering rule): whiskering on the left composes T on the left, so the source functor is T after T^2 = T^3. Step 2 (functor composition): the target functor is T after T = T^2. Hence T mu : T^3 => T^2. The answer is a = 3; b = 2."
          - problem: "On the category of sets, let T be the writer monad for integer addition: T(X) = X × Z, the set of pairs (x, m) with x in X and m an integer; T(f)(x, m) = (f(x), m); unit eta_A(x) = (x, 0); multiplication mu_A((x, m), n) = (x, m + n). Fix a set A that contains 7. The left whiskering of the unit by T is a transformation (T eta)_A : T(A) -> T(T(A)). Compute the value of (T eta)_A at the element (7, 5) of T(A), and give the answer as (x, m, n), coding the element ((x, m), n) of T(T(A))."
            answer: "(7,0,5)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is (T eta)_A = T(eta_A) : T(A) -> T(T(A)). Step 1 (whiskering rule): left whiskering applies the functor T to the component, so (T eta)_A = T(eta_A). Step 2 (action of T on maps): T(eta_A)(x, m) = (eta_A(x), m). Step 3 (unit component): eta_A(7) = (7, 0). So T(eta_A)(7, 5) = ((7, 0), 5). The answer is (7,0,5)."
          - problem: "Let T be the writer monad for integer addition on sets: T(X) = X × Z with T(f)(x, m) = (f(x), m); the unit is eta_A(x) = (x, 0) and the multiplication is mu_A((x, m), n) = (x, m + n). Choose a set A with 4 among its elements. Right whiskering the unit by T gives a transformation (eta T)_A : T(A) -> T(T(A)). Evaluate (eta T)_A at the element (4, 6) of T(A), and give the answer as (x, m, n) for the resulting element ((x, m), n) of T(T(A))."
            answer: "(4,6,0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is (eta T)_A = eta_{T(A)} : T(A) -> T(T(A)). Step 1 (whiskering rule): right whiskering re-indexes the unit at the object T(A). Step 2 (unit component): the unit at the set T(A) sends an element y of T(A) to the pair (y, 0). Step 3 (substitute): eta_{T(A)}(4, 6) = ((4, 6), 0). The answer is (4,6,0)."
          - problem: "For the writer monad for integer addition on sets, T(X) = X × Z, T(f)(x, m) = (f(x), m), eta_A(x) = (x, 0), and mu_B((x, m), n) = (x, m + n) for every set B. Let A be a set containing 5. The right whiskering of the multiplication by T is a transformation (mu T)_A : T^3(A) -> T^2(A). Determine the value of (mu T)_A at the element (((5, 2), 3), 4) of T^3(A), and give the answer as (x, m, n) standing for the element ((x, m), n) of T^2(A)."
            answer: "(5,2,7)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is (mu T)_A = mu_{T(A)} : T^3(A) -> T^2(A). Step 1 (whiskering rule): right whiskering re-indexes, so the component is the multiplication at the object T(A). Step 2 (multiplication component): mu_{T(A)} sends ((y, n), k) to (y, n + k), where y is an element of T(A). Step 3 (substitute): with y = (5, 2), n = 3 and k = 4, the value is ((5, 2), 7). The answer is (5,2,7)."
          - problem: "Let T be the list monad on the category of sets: T(X) is the set of finite lists of elements of X, the unit has component eta_A(x) = [x], and mu_B joins a list of lists into one list by concatenation for every set B. The functor T sends a map f to the entrywise map [l1, l2] -> [f(l1), f(l2)]. At the set A = {u, v, w}, let L = [[[u], [v]], [[w]]], an element of T^3(A). The whiskered transformations (T mu)_A and (mu T)_A both go from T^3(A) to T^2(A) and send L to a list of lists. How many inner lists does each result contain? Give leftcount for (T mu)_A and rightcount for (mu T)_A."
            answer: "leftcount = 2; rightcount = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "leftcount"}, {"contract": {"kind": "exact"}, "name": "rightcount"}]}
            solution_sketch: "The full objects are (T mu)_A = T(mu_A) and (mu T)_A = mu_{T(A)}, both from T^3(A) to T^2(A). Step 1 (left whiskering): T(mu_A) applies mu_A to each entry of L, giving [mu_A([[u], [v]]), mu_A([[w]])] = [[u, v], [w]], a list with 2 inner lists. Step 2 (right whiskering): mu_{T(A)} concatenates the outer level, giving [[u], [v]] followed by [[w]], the list [[u], [v], [w]] with 3 inner lists. The answer is leftcount = 2; rightcount = 3."
          - problem: "A monad (T, eta, mu) on a category has multiplication mu : T^2 => T. A student writes the following. Step 1: whiskering mu on the left by T gives T mu : T^3 => T^2. Step 2: whiskering mu on the right by T gives mu T : T^3 => T^2. Step 3: at an object A, the component of T mu is (T mu)_A = T(mu_A). Step 4: at A, the component of mu T is also T(mu_A), because the two transformations have the same type. Which step is the first one that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: composing on the left with T turns mu : T^2 => T into T after T^2 => T after T, that is T^3 => T^2. Step 2 is valid: composing on the right with T gives T^2 after T => T after T, that is T^3 => T^2. Step 3 is valid: left whiskering applies the functor, so (T mu)_A = T(mu_A). Step 4 is not valid: right whiskering re-indexes the component at the object T(A), so (mu T)_A = mu_{T(A)}, which differs from T(mu_A) in general; equal types do not force equal components. The answer is Step 4."
          - problem: "Write the full proof: if (T, eta, mu) is a monad on a category C, then T mu and mu T are natural transformations from T^3 to T^2, T eta and eta T are natural transformations from T to T^2, and at every object A the components are (T mu)_A = T(mu_A), (mu T)_A = mu_{T(A)}, (T eta)_A = T(eta_A), and (eta T)_A = eta_{T(A)}. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (data): a monad is an endofunctor T : C -> C with natural transformations eta : Id_C => T and mu : T^2 => T, where T^2 = T after T and T^3 = T after T after T. Step 2 (left whiskering of mu): by the whiskering rule, T mu : T after T^2 => T after T, that is T mu : T^3 => T^2, with component (T mu)_A = T(mu_A) : T^3(A) -> T^2(A). Step 3 (right whiskering of mu): mu T : T^2 after T => T after T, that is mu T : T^3 => T^2, with component (mu T)_A = mu_{T(A)}. Step 4 (whiskering the unit): T eta : T after Id_C => T after T, that is T eta : T => T^2, with (T eta)_A = T(eta_A); likewise eta T : Id_C after T => T after T, that is eta T : T => T^2, with (eta T)_A = eta_{T(A)}. Step 5 (naturality): whiskering a natural transformation by a functor on either side is again natural, so all four whiskered transformations are natural with the stated types and components, which completes the proof."
      - id: kp2
        name: The three laws
        key_prerequisites: [natural-transformations]
        constraints: "State each law as an equation between transformations with matching source and target functors."
        exemplars:
          - problem: "A monad is an endofunctor T with transformations eta from the identity functor to T and mu from the composite of T with itself to T. In the associativity law mu · Tmu = mu · muT, each side is a single natural transformation, and both sides share one source functor and one target functor. How many copies of T appear in that common source functor?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the associativity law mu · Tmu = mu · muT, an equation between transformations. Whiskering rule: Tmu goes from the triple composite of T with itself to the composite of T with itself, and muT likewise goes from the triple composite to the composite of T with itself. Vertical composite rule: each side is mu after one of these whiskerings, so each side goes from the triple composite of T with itself to T, and the two sides match. The common source functor is the triple composite, made of three copies of T. The answer is 3."
          - problem: "Let T send a set A to the set of all finite lists with entries from A, and let T of a map apply it to every entry of a list. For each A, eta_A(a) is the one-entry list and mu_A joins the entries of a list of lists into one list. Take A = {1, 2} and w = [[[1]], [[2], [1, 2]]], an element of the triple composite of T. One side of the associativity law at w is the composite mu_A(T(mu_A)(w)). Find this list, giving its entries in order."
            answer: "1, 2, 1, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object is the composite mu_A(T(mu_A)(w)) at w = [[[1]], [[2], [1, 2]]], the left side of the associativity law at w. Functor rule: T(mu_A) applies mu_A to each entry of the outer list, so T(mu_A)(w) = [[1], [2, 1, 2]]. Multiplication rule: mu_A joins the entries of that list of lists, giving [1, 2, 1, 2]. The answer is 1, 2, 1, 2."
          - problem: "Build a writer endofunctor from the monoid of integers under addition: for a set A, T(A) is the set of pairs (a, m) with a in A and m an integer, and T of a map acts as that map on the first entry of a pair. Here eta_A(a) = (a, 0) and mu_A(((a, m), n)) = (a, m + n). Take A = {5} and the point (5, 3) of T(A). One side of the left unit law at this point is the composite mu_A(T(eta_A)(5, 3)). Compute this value. Give the answer as (a, m)."
            answer: "(5, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full object is the composite mu_A(T(eta_A)(5, 3)), one side of the left unit law at the point (5, 3). Functor rule: T(eta_A) acts as eta_A on the first entry, so T(eta_A)(5, 3) = ((5, 0), 3). Multiplication rule: mu_A(((5, 0), 3)) = (5, 0 + 3) = (5, 3). The answer is (5, 3)."
          - problem: "Build a writer endofunctor from the monoid of positive integers under multiplication: for a set A, T(A) is the set of pairs (a, m) with a in A and m a positive integer, and T of a map acts as that map on the first entry of a pair. Here eta_A(a) = (a, 1) and mu_A(((a, m), n)) = (a, mn). Let w = (((3, 2), 5), 7), a point of the triple composite of T. One side of the associativity law at w is the composite mu_A(T(mu_A)(w)). Compute this value. Give the answer as (a, k)."
            answer: "(3, 70)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full object is the composite mu_A(T(mu_A)(w)) at w = (((3, 2), 5), 7), one side of the associativity law at w. Multiplication rule: mu_A(((3, 2), 5)) = (3, 10). Functor rule: T(mu_A)(w) = (mu_A(((3, 2), 5)), 7) = ((3, 10), 7). Multiplication rule again: mu_A(((3, 10), 7)) = (3, 70). The answer is (3, 70)."
          - problem: "Claim: for the writer endofunctor built from the monoid of integers under addition, the left unit law holds at every point of T(A). Step 1: the law says that mu_A(T(eta_A)(a, m)) = (a, m) for every pair (a, m) in T(A). Step 2: T(eta_A) sends (a, m) to (eta_A(a), m). Step 3: with eta_A(a) = (a, 1), this is ((a, 1), m). Step 4: mu_A(((a, 1), m)) = (a, 1 + m), so the composite returns the pair (a, m) as Step 1 requires. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly states the componentwise left unit law, so it is not the error. Step 2 correctly applies the functor rule to a pair, so it is not the error. Step 3 is the first invalid step: the unit of the monoid of integers under addition is 0, so eta_A(a) = (a, 0), not (a, 1); choosing Step 2 or Step 4 would name a correct line as invalid. Step 4 is valid once Step 3 is fixed, since mu_A(((a, 0), m)) = (a, 0 + m) = (a, m), exactly what Step 1 requires. The answer is Step 3."
          - problem: "In the right unit law mu · eta T = 1_T, both sides are natural transformations with the same source functor and the same target functor. Here eta goes from the identity functor to T, and mu goes from the composite of T with itself to T. How many copies of T appear in the common source functor of both sides of this law?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the right unit law mu · eta T = 1_T, an equation between transformations. Whiskering rule: eta T applies eta after T, so it goes from the identity after T, which is just T, to the composite of T with itself. Vertical composite rule: mu after eta T therefore goes from T to T, the same source and target as the identity transformation 1_T, so the equation is well formed. The common source functor is T itself, a single copy of T. The answer is 1."
          - problem: "Write the full proof: the three monad laws, the associativity law mu · Tmu = mu · muT and the unit laws mu · T eta = 1_T and mu · eta T = 1_T, are equations between transformations with matching source and target functors. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (whiskering): since mu goes from the composite of T with itself to T, the whiskered Tmu goes from the triple composite of T with itself to the composite of T with itself, and muT likewise goes from the triple composite to the composite of T with itself. Step 2 (vertical composite): each side of the associativity law is mu after one of these whiskerings, so each side goes from the triple composite of T with itself to T; the sources match and the targets match, so that equation is well formed. Step 3 (whiskering): since eta goes from the identity functor to T, the whiskered T eta goes from T after the identity to T after T, and eta T goes from the identity after T to T after T; both simplify to transformations from T to the composite of T with itself. Step 4 (vertical composite): composing each of these with mu gives a transformation from T to T, the same source and target as the identity 1_T, so both unit laws are well formed. Conclusion: all three laws are equations between transformations with the same source functor and the same target functor."
      - id: kp3
        name: First verifications
        key_prerequisites: [poset-monoid-categories]
        constraints: "In the poset case use that hom-sets have at most one element, so the laws are automatic."
        exemplars:
          - problem: "Take the identity monad on a category C: the endofunctor T is the identity functor on C, and both eta and mu are the identity transformation on T. Check the associativity law and the two unit laws for this data and count the failures. How many of the three monad laws fail to hold?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: with T the identity functor on C, the composite T T is the identity functor again, and eta and mu are the identity transformation on it. Whiskering rule: whiskering an identity transformation gives an identity, so T mu, mu T, T eta and eta T are each the identity. Associativity law: mu after T mu is the identity after the identity, which is the identity, and so is mu after mu T, so the law holds. Unit laws: mu after T eta is the identity, which is the identity transformation on T, and likewise mu after eta T, so both hold. All three laws hold, so the number of failures is 0."
          - problem: "Regard the nonnegative integers with their usual order as a poset category: an arrow from a to b exists exactly when a is at most b. Let T(n) be the least multiple of 4 that is at least n. This T is a closure operator on this poset, so the monad laws hold automatically since each hom-set has at most one element. Give T(T(6))."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: T(n) is the least multiple of 4 that is at least n, on the poset of nonnegative integers. Closure step: 6 is at most 8, so T(6) = 8. Idempotence step: 8 is already a multiple of 4, so T(8) = 8 and T(T(6)) = 8. Law check: the multiplication arrow from T(T(6)) = 8 to T(6) = 8 exists, and since each hom-set has at most one element the three monad laws hold automatically. The answer is 8."
          - problem: "Regard the power set of S = {2, 3, 4, 6, 12} ordered by inclusion as a poset category, so an arrow from A to B exists exactly when A is contained in B and each hom-set has at most one element. Define T(X) to be the set of all elements of S that are divisible by some element of X. This T is a closure operator on this poset. Take X = {2}. Give the number of elements of T(T(X))."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: T(X) is the set of elements of S divisible by some element of X, on the power set of S ordered by inclusion. Closure step: T({2}) = {2, 4, 6, 12}, the elements divisible by 2. Idempotence step: each of 2, 4, 6, 12 is divisible by 2, so T({2, 4, 6, 12}) = {2, 4, 6, 12}, which has 4 elements. Since T(T(X)) equals T(X), the multiplication arrow exists and is unique, and the three laws are automatic in this thin category. The answer is 4."
          - problem: "Regard the integers with their usual order as a poset category, so an arrow from a to b exists exactly when a is at most b and each hom-set has at most one element. Define T(n) = n + 2. This T is not a closure operator on this poset. Give T(T(1))."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: T(n) = n + 2 on the poset of integers, so T(T(n)) = n + 4. First application: T(1) = 3. Second application: T(3) = 5, so T(T(1)) = 5. The multiplication arrow would need 5 at most 3, which fails, so the data is not a monad. The answer is 5."
          - problem: "A student claims the following about the poset of nonnegative integers with their usual order, where an arrow from a to b exists exactly when a is at most b. Claim: T(n) = 2n with the arrow from n to 2n as unit component and the arrow from 4n to 2n as multiplication component forms a monad. Step 1: the unit arrows exist because n is at most 2n for every nonnegative n. Step 2: the multiplication arrows exist because 4n is at most 2n. Step 3: the three monad laws hold automatically, since a poset has at most one arrow between any two objects. Step 4: therefore the data forms a monad. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Full claim: T(n) = 2n with the arrow from n to 2n as unit and the arrow from 4n to 2n as multiplication, on the poset of nonnegative integers. Step 1 is valid: for every nonnegative n, n is at most 2n, so the unit arrow exists. Step 2 is the first invalid step: it claims 4n is at most 2n, which fails at n = 1, where 4 is not at most 2. Step 3 is sound reasoning once the data exists, because a poset has at most one arrow between two objects, so any law diagram commutes automatically. Step 4 only summarizes the earlier steps, so it is not the first failure. The answer is Step 2."
          - problem: "A proof that a closure operator T on a poset P gives a monad runs as follows. Step 1: T is order-preserving, so it is an endofunctor of P. Step 2: the arrow from x to T(x) exists since x is at most T(x) for every x. Step 3: applying T to this inequality gives T(x) at most T(T(x)). Step 4: the arrow from T(T(x)) to T(x) exists, and T(T(x)) = T(x), because the opposite inequalities T(x) at most T(T(x)) and T(T(x)) at most T(x) force equality. Step 5: the three monad laws hold since each hom-set of P has at most one element. Which hypothesis does Step 4 use?"
            answer: "antisymmetry"
            answer_contract: {"kind": "label", "options": [["antisymmetry"], ["monotonicity"], ["thinness"], ["inflationary"]]}
            solution_sketch: "Full proof: on a poset P, a closure operator T gives a monad with unit x to T(x) and multiplication T(T(x)) to T(x). Step 4 forces the equality T(T(x)) = T(x) from two opposite inequalities, and the hypothesis that makes two opposite inequalities force equality in a poset is antisymmetry. The option monotonicity is wrong: it is the hypothesis of Step 3, where applying T to an inequality gives T(x) at most T(T(x)), not of Step 4. The option thinness is wrong: it is the hypothesis of Step 5, where each hom-set having at most one element makes the three laws automatic. The option inflationary is wrong: it is the hypothesis of Step 2, the property x at most T(x) that gives the unit arrow. The answer is antisymmetry."
          - problem: "Write the full proof: the identity endofunctor T = 1 on a category C, with eta and mu both the identity transformation on T, satisfies all three monad laws. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (types): with T the identity functor on C, the composite T T is the identity functor again, and eta and mu are the identity transformation on it. Step 2 (whiskering rule): whiskering an identity transformation gives an identity, so T mu, mu T, T eta and eta T are each the identity transformation. Step 3 (associativity law): mu after T mu is the identity after the identity, which is the identity; the same holds for mu after mu T, so the two sides agree. Step 4 (unit laws): mu after T eta is the identity, which is the identity transformation on T; likewise mu after eta T is the identity transformation on T. Conclusion: each of the three laws reduces to the identity after the identity, so the identity endofunctor with identity eta and mu is a monad."
    diagnostic_exemplar:
      problem: "Regard $(\\mathcal P(S),\\subseteq)$ as a poset category and fix a subset $K\\subseteq S$. Define $T(X)=X\\cup K$. Show that $T$ carries the structure of a monad $(T,\\eta,\\mu)$: give the component of $\\eta$ and of $\\mu$ at $X$, give the component of the whiskered transformation $\\mu T$ at $X$ with its type, and check the three monad laws."
      answer: "$T$ is monotone ($X\\subseteq Y$ gives $X\\cup K\\subseteq Y\\cup K$), so it is an endofunctor of the poset category. Unit: $X\\subseteq X\\cup K$, so there is an arrow $\\eta_X\\colon X\\to TX$, and it is the unique one. Since $T^2X=(X\\cup K)\\cup K=X\\cup K=TX$, the arrow $\\mu_X\\colon T^2X\\to TX$ is the identity arrow of $X\\cup K$. Whiskering: $(\\mu T)_X=\\mu_{TX}\\colon T^3X\\to T^2X$, the unique arrow $T(X\\cup K)=X\\cup K\\to X\\cup K$, i.e. again the identity arrow (whereas $(T\\mu)_X=T(\\mu_X)$ is the same arrow here only because $T$ is idempotent on these objects). Laws: $\\mu\\circ T\\mu=\\mu\\circ\\mu T$ ($T^3\\Rightarrow T$) and $\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T$ ($T\\Rightarrow T$) are equations between parallel arrows of a poset category, whose hom-sets have at most one element, so all three hold automatically. Hence $(T,\\eta,\\mu)$ is a monad — precisely the closure operator $X\\mapsto X\\cup K$ (monotone, inflationary, idempotent)."
      solution_sketch: "Note first that $T^2X=TX$ here, so $\\mu_X$ and every whiskering of it are identity arrows on $X\\cup K$. Then the real point: in a thin category all three monad laws are equations between parallel arrows and hold automatically — this monad is precisely the closure operator $X\\mapsto X\\cup K$."
    anki_seeds:
      - front: "A monad is an endofunctor $T$ with two natural transformations: a unit {{c1::$\\eta\\colon 1\\Rightarrow T$}} and a multiplication {{c2::$\\mu\\colon T^2\\Rightarrow T$}}."
        back: "$\\eta\\colon 1\\Rightarrow T$; $\\mu\\colon T^2\\Rightarrow T$"
        type: cloze
      - front: "State the associativity law of a monad $(T,\\eta,\\mu)$."
        back: "$\\mu\\circ T\\mu=\\mu\\circ\\mu T$."
        type: basic
      - front: "State the unit laws of a monad $(T,\\eta,\\mu)$."
        back: "$\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T$."
        type: basic

