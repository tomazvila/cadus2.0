        key: true
      - id: functor-categories
        weight: 0.2
      - id: category-definition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The Kleisli construction
        key_prerequisites: [monads]
        constraints: "Give the objects, the hom-sets $\\mathcal C_T(A,B)=\\mathcal C(A,TB)$, the identity $\\eta_A$ and the composite $g\\circ_T f=\\mu_C\\circ Tg\\circ f$ before anything else; the only concrete identification is $\\mathbf{Set}_P\\simeq\\mathbf{Rel}$ for the power-set monad."
        exemplars:
          - problem: "Given a monad $T$ on $\\mathcal C$, define the Kleisli category $\\mathcal C_T$ and its composition."
            answer: "Same objects; $\\mathcal C_T(A,B)=\\mathcal C(A,TB)$; identity $\\eta_A$; $g\\circ_T f=\\mu_C\\circ Tg\\circ f$."
            solution_sketch: "$\\mathcal C_T$ has the same objects as $\\mathcal C$; a Kleisli morphism $A\\to B$ is a $\\mathcal C$-map $f\\colon A\\to TB$. The identity on $A$ is $\\eta_A\\colon A\\to TA$. The Kleisli composite of $f\\colon A\\to TB$ and $g\\colon B\\to TC$ is $g\\circ_T f=\\mu_C\\circ Tg\\circ f\\colon A\\to TC$ (apply $g$, then multiply)."
          - problem: "Identify the Kleisli category of the power-set monad $P$ on $\\mathbf{Set}$."
            answer: "$\\mathbf{Set}_P\\simeq\\mathbf{Rel}$: objects are sets, morphisms are relations, composition is relational."
            solution_sketch: "A Kleisli map $A\\to B$ for $P$ is a function $A\\to PB$, equivalently a relation $R\\subseteq A\\times B$ via $a\\mapsto\\{b:aRb\\}$. The identity $\\eta_A(a)=\\{a\\}$ is the diagonal relation. Kleisli composition $\\mu_C\\circ Pg\\circ f$ sends $a\\mapsto\\bigcup_{b\\in f(a)}g(b)$, which is exactly relational composition $\\{(a,c):\\exists b,\\,aRb\\wedge bSc\\}$. Hence $\\mathbf{Set}_P\\simeq\\mathbf{Rel}$."
      - id: kp2
        name: The Kleisli laws come from the monad laws
        key_prerequisites: [monads]
        constraints: "Purely equational chases from the definition of $\\circ_T$: every step must cite a monad law or a naturality square of $\\eta$ or $\\mu$ by name, and no elements may be used."
        exemplars:
          - problem: "Show the unit and associativity laws of $\\mathcal C_T$ follow from the monad laws."
            answer: "Unit laws use $\\mu\\circ\\eta T=1=\\mu\\circ T\\eta$ and naturality of $\\eta$; associativity uses monad associativity and naturality of $\\mu$."
            solution_sketch: "Right unit of $\\mathcal C_T$ (composing with the identity first), $f\\circ_T\\eta_A=\\mu_B\\circ Tf\\circ\\eta_A=\\mu_B\\circ\\eta_{TB}\\circ f=f$, using naturality of $\\eta$ and then the monad's left unit law $\\mu\\circ\\eta T=1$. Left unit of $\\mathcal C_T$ (composing with the identity last), $\\eta_B\\circ_T f=\\mu_B\\circ T\\eta_B\\circ f=f$, from the monad's right unit law $\\mu\\circ T\\eta=1$. (The two namings cross over: the Kleisli side is named for where the identity sits in $\\circ_T$, the monad side for whether $\\eta$ is whiskered on the left or the right of $T$.) Associativity of $\\circ_T$ expands, after using naturality of $\\mu$, to $\\mu\\circ T\\mu=\\mu\\circ\\mu T$, the monad associativity law. So $\\mathcal C_T$ is a category."
          - problem: "Show that $J\\colon\\mathcal C\\to\\mathcal C_T$, $A\\mapsto A$, $f\\mapsto\\eta_B\\circ f$, is a functor into the Kleisli category."
            answer: "It preserves identities and composition, using $\\mu\\circ T\\eta=1$ and naturality of $\\eta$."
            solution_sketch: "$J(1_A)=\\eta_A$ is the Kleisli identity. For $f\\colon A\\to B$, $h\\colon B\\to C$, the Kleisli composite is $J(h)\\circ_T J(f)=\\mu_C\\circ T(\\eta_C\\circ h)\\circ\\eta_B\\circ f=\\mu_C\\circ T\\eta_C\\circ Th\\circ\\eta_B\\circ f$. Now $\\mu_C\\circ T\\eta_C=1$ (right unit law) and $Th\\circ\\eta_B=\\eta_C\\circ h$ (naturality of $\\eta$), giving $\\eta_C\\circ h\\circ f=J(h\\circ f)$. So $J$ is a functor."
    diagnostic_exemplar:
      problem: "Let $T$ be a monad on $\\mathcal C$ and $\\mathcal C_T$ its Kleisli category, with $\\mathcal C_T(A,B)=\\mathcal C(A,TB)$, identities $\\eta_A$ and composition $g\\circ_T f=\\mu_C\\circ Tg\\circ f$. Prove that $\\eta$ is a two-sided identity for $\\circ_T$: for every $f\\colon A\\to TB$, $\\eta_B\\circ_T f=f$ and $f\\circ_T\\eta_A=f$. Name the monad law or naturality square used at each step."
      answer: "Right identity for $\\eta_B$: $\\eta_B\\circ_T f=\\mu_B\\circ T(\\eta_B)\\circ f=(\\mu\\circ T\\eta)_B\\circ f=1_{TB}\\circ f=f$, using the monad unit law $\\mu\\circ T\\eta=1_T$ at $B$. Left identity for $\\eta_A$: $f\\circ_T\\eta_A=\\mu_B\\circ Tf\\circ\\eta_A$. Naturality of $\\eta\\colon 1\\Rightarrow T$ at the morphism $f\\colon A\\to TB$ gives $Tf\\circ\\eta_A=\\eta_{TB}\\circ f$, so this equals $\\mu_B\\circ\\eta_{TB}\\circ f=(\\mu\\circ\\eta T)_B\\circ f=1_{TB}\\circ f=f$, using the other monad unit law $\\mu\\circ\\eta T=1_T$ at $B$. So $\\eta_A$ is a two-sided identity at $A$ in $\\mathcal C_T$."
      solution_sketch: "Two different laws do the two sides. $\\eta_B\\circ_T f$ unfolds straight to $(\\mu\\circ T\\eta)_B\\circ f$, one unit law. The other side, $f\\circ_T\\eta_A$, first needs naturality of $\\eta$ at $f$ to move $\\eta$ past $Tf$, and only then the second unit law $\\mu\\circ\\eta T=1_T$."
    anki_seeds:
      - front: "In the Kleisli category $\\mathcal C_T$, what is a morphism $A\\to B$?"
        back: "a $\\mathcal C$-morphism $A\\to TB$."
        type: basic
      - front: "What is the identity on $A$ in the Kleisli category $\\mathcal C_T$?"
        back: "the monad unit $\\eta_A\\colon A\\to TA$."
        type: basic
      - front: "Kleisli composition of $f\\colon A\\to TB$, $g\\colon B\\to TC$ is {{c1::$\\mu_C\\circ Tg\\circ f$}}."
        back: "$\\mu_C\\circ Tg\\circ f$"
        type: cloze

  - id: algebras-over-monads
    name: Algebras over a Monad
    core: false                # terminal; feeds only Kleisli-vs-Eilenberg-Moore
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: monads
        weight: 0.6
        key: true
      - id: natural-transformations
        weight: 0.3
      - id: adjunctions
        weight: 0.3
        key: true
      - id: initial-terminal-objects
        weight: 0.0
      # Phase C reconciliation: kp2 identifies the algebras of the free-group monad
      # $T = UF$ — the argument works with $TA$ as reduced words in $A$ and evaluation
      # respecting concatenation-then-reduction (free-groups-presentations kp1's model).
      - id: free-groups-presentations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Eilenberg-Moore algebras
        key_prerequisites: [monads]
        constraints: "State the two laws $a\\circ\\eta_A=1_A$ and $a\\circ\\mu_A=a\\circ Ta$ and the morphism condition $f\\circ a=b\\circ Tf$ before any identification; the concrete monad is the maybe monad on $\\mathbf{Set}$, whose algebras are read off as pointed sets."
        exemplars:
          - problem: "Define a $T$-algebra for a monad $T$, its two laws, and morphisms of $T$-algebras."
            answer: "$(A,a\\colon TA\\to A)$ with $a\\circ\\eta_A=1_A$, $a\\circ\\mu_A=a\\circ Ta$; a morphism $f$ satisfies $f\\circ a=b\\circ Tf$."
            solution_sketch: "A $T$-algebra is an object $A$ with a structure map $a\\colon TA\\to A$ satisfying the unit law $a\\circ\\eta_A=1_A$ and the associativity law $a\\circ\\mu_A=a\\circ Ta\\colon T^2A\\to A$. A morphism $(A,a)\\to(B,b)$ is $f\\colon A\\to B$ with $f\\circ a=b\\circ Tf$. These form the Eilenberg-Moore category $\\mathcal C^T$."
          - problem: "Show that algebras for the maybe monad $TA=A+1$ on $\\mathbf{Set}$ are pointed sets."
            answer: "An algebra $a\\colon A+1\\to A$ amounts to a choice of basepoint $a(*)\\in A$; the unit law forces $a|_A=1_A$."
            solution_sketch: "A structure map $a\\colon A+1\\to A$ splits into its action on $A$ and on the added point $*$. The unit law $a\\circ\\eta_A=1_A$ (with $\\eta_A$ the inclusion $A\\hookrightarrow A+1$) forces $a|_A=1_A$, so the only free datum is $p:=a(*)\\in A$, a basepoint. The associativity law $a\\circ\\mu_A=a\\circ Ta$ then holds automatically (both send each 'nothing' layer to $p$). Algebra morphisms preserve $p$, so $\\mathbf{Set}^T\\simeq\\mathbf{Set}_*$, the category of pointed sets."
      - id: kp2
        name: Algebras recover familiar structures
        key_prerequisites: [natural-transformations, free-groups-presentations]
        constraints: "Identifications only, for monads on $\\mathbf{Set}$ induced by free-forgetful adjunctions (list $\\Rightarrow$ monoids, free group $\\Rightarrow$ groups); say what the structure map does to a formal expression and name the equivalence $\\mathbf{Set}^T\\simeq\\ldots$."
        exemplars:
          - problem: "Identify the algebras for the list monad on $\\mathbf{Set}$."
            answer: "Monoids: the structure map evaluates a word to a product."
            solution_sketch: "An algebra $a\\colon A^*\\to A$ assigns a value to each word. The unit law $a([x])=x$ and associativity $a\\circ\\mu=a\\circ Ta$ (evaluate a flattened list of lists in either order) say exactly that $a$ is a unital, associative multiplication. So $T$-algebras for the list monad are monoids and their morphisms are monoid homomorphisms: $\\mathbf{Set}^T\\simeq\\mathbf{Mon}$."
          - problem: "Identify the algebras for the free-group monad $T=UF$ on $\\mathbf{Set}$ (from $F\\dashv U$, $\\mathbf{Set}\\rightleftarrows\\mathbf{Grp}$)."
            answer: "Groups: $\\mathbf{Set}^T\\simeq\\mathbf{Grp}$."
            solution_sketch: "Here $TA$ is the underlying set of the free group on $A$, so a structure map $a\\colon TA\\to A$ evaluates each reduced word in $A$ and its formal inverses to an element of $A$. The unit law makes generators evaluate to themselves, and associativity makes evaluation respect concatenation and reduction, so $a$ equips $A$ with an associative unital multiplication with inverses — a group. The free-forgetful adjunction is monadic (Beck), giving $\\mathbf{Set}^T\\simeq\\mathbf{Grp}$ with algebra maps = group homomorphisms."
      - id: kp3
        name: The free-forgetful adjunction of the algebras
        key_prerequisites: [adjunctions]
        constraints: "The free algebra is $(TC,\\mu_C)$: its two algebra laws must be identified with the two monad laws taken at $C$, never reproved from scratch, and the adjunction $F^T\\dashv U^T$ named together with its unit $\\eta$."
        exemplars:
          - problem: "Let T be the list monad on sets: T X is the set of finite lists with entries in X, eta_X sends an element x to the one-element list [x], and mu_X flattens a list of lists into one list. The free T-algebra on a set C is (TC, mu_C), the value of the left adjoint F^T in the adjunction whose right adjoint is U^T and whose unit is eta. Take C = {0, 1} and the element [[1,0],[0],[1,1]] of T(TC). Compute mu_C of this element, giving the resulting list."
            answer: "1, 0, 0, 1, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The free T-algebra on C is (TC, mu_C), the value at C of the left adjoint F^T of the adjunction with right adjoint U^T and unit eta. Its structure map mu_C is the flattening of a list of lists. Apply the structure map to [[1,0],[0],[1,1]]: concatenating the inner lists in order gives [1,0,0,1,1]. The answer is 1, 0, 0, 1, 1."
          - problem: "Let T be the writer monad for the group of integers modulo 3 on sets: T X is the set of pairs (x, m) with x in X and m in Z/3, eta_X(x) = (x, 0), and mu_X((x, m), n) = (x, m + n mod 3). The free T-algebra on a set C is (TC, mu_C), the value of the left adjoint F^T in the adjunction whose right adjoint is U^T and whose unit is eta, and its associativity identity is the monad associativity identity taken at C. Take C = {4} and the element (((4,1), 2), 2) of T(T(TC)). Compute mu_C after mu_TTC on this element, giving the answer as (x, m)."
            answer: "(4, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The composite mu_C after mu_TTC collapses the three layers of (((4,1), 2), 2) one at a time, and its agreement with the other composite is the monad associativity identity taken at C. First mu_TTC acts: ((4,1), 2 + 2 mod 3) = ((4,1), 1). Then mu_C acts: (4, 1 + 1 mod 3) = (4, 2). The answer is (4, 2)."
          - problem: "For the list monad T, with mu the flattening of a list of lists, the free T-algebra on a set C is (TC, mu_C), and its associativity identity mu_C after mu_TC = mu_C after T mu_C is the monad associativity identity taken at C, not a new fact to prove. Take C = {1, 2} and the element [[[1]],[[2,2]]] of T(T(TC)). Compute mu_C after T mu_C on this element, giving the resulting list."
            answer: "1, 2, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The map T mu_C applies mu_C to each entry of a list of lists of lists. The entries of [[[1]],[[2,2]]] are [[1]] and [[2,2]], and each flattens under mu_C: [[1]] gives [1] and [[2,2]] gives [2,2], so T mu_C yields [[1],[2,2]]. Then mu_C flattens once more, giving [1,2,2], and the other composite gives the same list by the monad associativity identity at C. The answer is 1, 2, 2."
          - problem: "For the list monad T, a T-algebra is a monoid, and the free T-algebra on a set C is the free monoid on C. By the adjunction whose left adjoint is F^T, whose right adjoint is U^T, and whose unit is eta, each T-algebra map from the free T-algebra on C to a T-algebra A corresponds to exactly one function from C to the underlying set of A. How many T-algebra maps are there from the free T-algebra on a set with two elements to the group of integers modulo 2, viewed as a monoid under addition?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the adjunction F^T with right adjoint U^T and unit eta, a T-algebra map out of the free T-algebra (TC, mu_C) is determined uniquely by its restriction to C, and every function from C to the underlying set of the target arises this way. So the number of maps equals the number of functions from a two-element set to the two-element group. That number is 2 times 2 = 4. The answer is 4."
          - problem: "A student checks that the free T-algebra (TC, mu_C) is a T-algebra, where eta is the unit and mu the multiplication of the monad T. Step 1: the structure map is mu_C, from TTC to TC. Step 2: the unit identity mu_C after eta_TC equals the identity on TC, and it holds because it is the monad unit identity taken at C. Step 3: the associativity identity mu_C after mu_TC equals mu_C after T mu_C, and it holds because it is the naturality of eta taken at C. Step 4: with both identities verified, (TC, mu_C) is a T-algebra. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: mu_C is indeed the structure map of the free algebra. Step 2 is valid: the unit identity is exactly the monad unit identity taken at C, with no new proof. Step 3 is not valid: the associativity identity is justified by the monad associativity identity taken at C, not by the naturality of eta. Step 4 only summarizes the earlier steps and inherits the faulty justification. The answer is Step 3."
          - problem: "The free T-algebra on an object C has structure map mu_C from TTC to TC. Its associativity identity, which governs collapsing three layers into one, is not proved from scratch: it is one of the monad identities of T taken at C. Which one?"
            answer: "mu after mu T = mu after T mu"
            answer_contract: {"kind": "label", "options": [["mu after mu T = mu after T mu"], ["mu after eta T = 1"], ["eta after T = T after eta"], ["mu after T = T after mu"]]}
            solution_sketch: "The associativity identity for the structure map mu_C is the monad associativity identity taken at C. The option mu after eta T = 1 is the monad unit identity, which justifies the other algebra identity. The option eta after T = T after eta is the naturality of eta, which is not the identity required here. The option mu after T = T after mu is the naturality of mu, which does not state the collapse of three layers. The answer is mu after mu T = mu after T mu."
          - problem: "Write the full proof: let T be a monad on a category with unit eta and multiplication mu. Prove that for each object C the pair (TC, mu_C) is a T-algebra, because its two identities are exactly the two monad identities taken at C, and prove that the assignments sending C to (TC, mu_C) and a T-algebra (A, a) to A form an adjunction of F^T with U^T that has unit eta. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (free algebra): define F^T on objects by F^T(C) = (TC, mu_C), with structure map mu_C from TTC to TC. Step 2 (unit identity): the algebra unit identity for this structure map reads mu_C after eta_TC = identity on TC, which is exactly the monad unit identity mu after eta T = 1 taken at C, so it needs no new proof. Step 3 (associativity identity): the identity mu_C after mu_TC = mu_C after T mu_C is exactly the monad associativity identity mu after mu T = mu after T mu taken at C. Hence (TC, mu_C) is a T-algebra. Step 4 (adjunction): define U^T by U^T(A, a) = A; for a function f from C to A, its transpose is a after T f, which is a T-algebra map from (TC, mu_C) to (A, a) precisely by the two identities of the algebra a. Step 5 (unit): the transpose of the identity of TC is eta_C, so eta is the unit of the adjunction of F^T with U^T, and applying U^T to F^T returns T with its original eta and mu, so this adjunction resolves the monad T."
    diagnostic_exemplar:
      problem: "Let $T$ be the list monad on $\\mathbf{Set}$ ($TX=X^*$, $\\eta_X(x)=[x]$, $\\mu_X=$ flatten). Verify that the free $T$-algebra on a set $C$, namely $(TC,\\mu_C)$, satisfies the two $T$-algebra laws, and identify the resulting structure on $C^*$ concretely."
      answer: "The algebra laws for $(A,a)=(TC,\\mu_C)$ read $a\\circ\\eta_A=1_A$, i.e. $\\mu_C\\circ\\eta_{TC}=1_{TC}$, and $a\\circ\\mu_A=a\\circ Ta$, i.e. $\\mu_C\\circ\\mu_{TC}=\\mu_C\\circ T(\\mu_C)$. These are exactly the monad unit law $\\mu\\circ\\eta T=1_T$ and the monad associativity law $\\mu\\circ\\mu T=\\mu\\circ T\\mu$, both taken at the object $C$ — so nothing new has to be proved. Concretely: $\\eta_{TC}$ wraps a word $w$ as the one-element list $[w]$ and flattening returns $w$; and a list of lists of lists flattens to the same word whether the outer or the inner grouping is collapsed first (both give the concatenation of all letters in order). Since algebras for the list monad are monoids, with the structure map evaluating a word of elements to their product, $(C^*,\\mu_C)$ is the free monoid on $C$: concatenation of words, with the empty word as unit."
      solution_sketch: "Prove nothing new: instantiate the two algebra laws at $(TC,\\mu_C)$ and watch them turn into the monad unit and associativity laws at $C$. Then read the structure off concretely — flattening is concatenation, so this is the free monoid on $C$."
    anki_seeds:
      - front: "A $T$-algebra is an object $A$ equipped with a structure map of what type?"
        back: "$a\\colon TA\\to A$."
        type: basic
      - front: "State the unit law for a $T$-algebra $(A,a)$."
        back: "$a\\circ\\eta_A=1_A$."
        type: basic
      - front: "State the associativity law for a $T$-algebra $(A,a)$."
        back: "$a\\circ\\mu_A=a\\circ Ta$."
        type: basic
      - front: "A morphism of $T$-algebras $(A,a)\\to(B,b)$ is a map $f\\colon A\\to B$ with..."
        back: "$f\\circ a=b\\circ Tf$."
        type: basic
      - front: "Algebras for the list monad on $\\mathbf{Set}$ are exactly {{c1::monoids}}."
        back: "monoids"
        type: cloze

  - id: adjunctions-give-monads
    name: Adjunctions and Monads
    core: false                # stated theorem feeding only Kleisli-vs-Eilenberg-Moore
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: adjunctions
        weight: 0.5
      - id: unit-counit
        weight: 0.4
      - id: triangle-identities
        weight: 0.4
        key: true
      - id: monads
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Every adjunction induces a monad
        key_prerequisites: [adjunctions]
        constraints: "Build $T=GF$, $\\eta$, $\\mu=G\\varepsilon F$ from a given adjunction and derive every law from naturality plus the two triangle identities, naming which one is used; the concrete instances are free-forgetful adjunctions over $\\mathbf{Set}$ ($\\mathbf{Mon}$ giving the list monad, $\\mathbf{Grp}$ the free-group monad)."
        exemplars:
          - problem: "Let P be the chain 0 < 1 < 2 < 3 < 4 and Q the chain 0 < 1 < 2. Define F from P to Q by F(0) = 0, F(1) = 0, F(2) = 1, F(3) = 1, F(4) = 2, and G from Q to P by G(0) = 1, G(1) = 3, G(2) = 4. These monotone maps form an adjunction F left adjoint to G, so T = G composed with F is the induced monad on P, a closure operator. Compute T(2)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The adjunction with F left adjoint to G induces the monad T = G composed with F on P, acting by T(x) = G(F(x)). Read the value F(2) = 1 from the table of F. Then read the value G(1) = 3 from the table of G. The answer is T(2) = 3."
          - problem: "The free monoid functor F from Set to Mon sends a set A to the monoid of all finite words on A under concatenation, and the forgetful functor U returns the underlying set, with F left adjoint to U. This adjunction induces a monad on Set. Which monad is it?"
            answer: "list monad"
            answer_contract: {"kind": "label", "options": [["list monad"], ["free-group monad"], ["powerset monad"], ["maybe monad"]]}
            solution_sketch: "The induced monad is T = U F, and F builds the free monoid, so T(A) is the set of all finite words on A. The unit sends an element to its one-letter word and mu = U epsilon F flattens a word of words, which is exactly the list monad. The option free-group monad is the instance of the Grp adjunction, where letters also carry inverses. The option powerset monad would need T(A) to be the set of subsets of A, not words. The option maybe monad would need T(A) = A with one extra point. The answer is list monad."
          - problem: "For the adjunction between Set and Mon with the free monoid functor F and the forgetful functor U, the counit at a monoid M takes a word of elements of M and multiplies them in order inside M; the induced monad is built from this counit as mu = U epsilon F. At the monoid of integers with addition, compute the counit applied to the word (4, 7, -1)."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The counit of the free-forgetful adjunction evaluates a word of elements of M by multiplying its letters in M, and this counit is the building block of mu = U epsilon F. At the monoid of integers under addition, the monoid multiplication is the sum. Add the letters of the word in order: 4 + 7 + (-1) = 10. The answer is 10."
          - problem: "For the list monad, the monad induced by the adjunction between Set and Mon, the multiplication mu = U epsilon F at a set A flattens a word of words into a single word by concatenation. On the set A = {1, 2}, compute the word mu_A applied to the word of words [[2, 1], [1, 2]] and give it as an ordered list."
            answer: "2, 1, 1, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The induced monad has mu = U epsilon F, and at the set A its component is the counit at the free monoid on A, which multiplies a word of words inside the free monoid, that is, concatenates. Concatenate the inner words in order: the word [2, 1] followed by the word [1, 2] gives one single word. The answer is 2, 1, 1, 2."
          - problem: "For the adjunction between Set and Grp, the induced monad sends a set A to the free group on A, and its multiplication mu = U epsilon F flattens a word of words and then reduces the result, cancelling adjacent inverse pairs. On the set A = {a, b}, compute the number of letters in the reduced word mu_A applied to the word of words [[b, a], [a^{-1}, b]]."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The monad from the free-group adjunction has mu = U epsilon F, which flattens a word of words and then multiplies inside the free group, so the result is the reduced word. Flatten first: the word of words [[b, a], [a^{-1}, b]] gives the word b a a^{-1} b. Reduce with the group relations: the adjacent pair a a^{-1} cancels, leaving b b. The answer is 2."
          - problem: "Let F be left adjoint to G with unit eta and counit epsilon, and set T = GF with mu = G epsilon F. One unit law of the induced monad is mu composed after eta T equals 1_T. Its proof uses exactly one of the two triangle identities of the adjunction, applied to a whiskered composite. Which triangle identity does the proof use?"
            answer: "G epsilon after eta G"
            answer_contract: {"kind": "label", "options": [["G epsilon after eta G"], ["epsilon F after F eta"], ["F eta after epsilon F"], ["eta G after G epsilon"]]}
            solution_sketch: "Write both sides as whiskered composites: mu after eta T equals (G epsilon)F after (eta G)F, which is (G epsilon after eta G)F. The triangle identity G epsilon after eta G = 1_G then gives 1_G F = 1_T. The option epsilon F after F eta is the other triangle identity; it proves the other unit law mu after T eta = 1_T, not this one. The option F eta after epsilon F composes in the wrong order and is not an identity of the adjunction. The option eta G after G epsilon makes the same wrong-order error on the G side. The answer is G epsilon after eta G."
          - problem: "Write the full proof: let F be left adjoint to G with unit eta and counit epsilon, and set T = GF with mu = G epsilon F. Prove that (T, eta, mu) is a monad, deriving each law from naturality and the triangle identities and naming the identity used at each step. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (definition): set T = GF; the unit eta: 1 to GF is the unit of the adjunction, and mu = G epsilon F: GFGF to GF is natural because epsilon is, so all three data are well defined. Step 2 (first unit law): mu after T eta = G epsilon F after GF eta = G(epsilon F after F eta) = G(1_F) = 1_T, using the triangle identity epsilon F after F eta = 1_F. Step 3 (second unit law): mu after eta T = G epsilon F after eta GF; naturality of eta rewrites this as (G epsilon after eta G)F = 1_G F = 1_T, using the triangle identity G epsilon after eta G = 1_G. Step 4 (associativity): mu after T mu = mu after mu T because epsilon is natural; the naturality square of epsilon applied to the component of epsilon F identifies the two composites from GFGFGF to GF. Step 5 (conclusion): both unit laws and associativity hold, so every adjunction induces a monad."
      - id: kp2
        name: Every monad comes from an adjunction
        key_prerequisites: [monads]
        constraints: "The converse direction: name the Kleisli and Eilenberg-Moore resolutions, give the two functors of the chosen one explicitly on objects and morphisms, and verify $U_TF_T=T$ (or $U^TF^T=T$) rather than asserting it."
        exemplars:
          - problem: "State that every monad arises from an adjunction and name the two canonical resolutions."
            answer: "Yes — the Kleisli adjunction and the Eilenberg-Moore adjunction both induce $T$."
            solution_sketch: "Every monad $T$ is induced by an adjunction. The Kleisli adjunction $F_T\\dashv U_T$ between $\\mathcal C$ and $\\mathcal C_T$ is the initial such resolution, and the Eilenberg-Moore adjunction $F^T\\dashv U^T$ between $\\mathcal C$ and $\\mathcal C^T$ the terminal one; both satisfy $U F=T$ with the given $\\eta$ and $\\mu$. So the induced-monad construction is surjective, and these are the extreme resolutions of $T$."
          - problem: "Describe the Kleisli adjunction $F_T\\dashv U_T$ resolving a monad $T$ on $\\mathcal C$, and check $U_TF_T=T$."
            answer: "$F_T$ is identity on objects with $f\\mapsto\\eta_B\\circ f$; $U_T$ sends $A\\mapsto TA$, $g\\mapsto\\mu_B\\circ Tg$; and $U_TF_T=T$."
            solution_sketch: "$F_T\\colon\\mathcal C\\to\\mathcal C_T$ is the identity on objects and sends $f\\colon A\\to B$ to $\\eta_B\\circ f$. Its right adjoint $U_T\\colon\\mathcal C_T\\to\\mathcal C$ sends $A\\mapsto TA$ and a Kleisli map $g\\colon A\\to TB$ to $\\mu_B\\circ Tg\\colon TA\\to TB$. The natural bijection $\\mathcal C_T(F_TA,B)=\\mathcal C(A,TB)=\\mathcal C(A,U_TB)$ is the adjunction, with unit $\\eta$. Then $U_TF_TA=TA$ and $U_TF_T(f)=\\mu_B\\circ T(\\eta_B\\circ f)=Tf$ (using $\\mu\\circ T\\eta=1$), so $U_TF_T=T$; this is the initial resolution."
    diagnostic_exemplar:
      problem: "Let $F\\dashv G$ have unit $\\eta$ and counit $\\varepsilon$, and set $T=GF$ with $\\mu=G\\varepsilon F$. Prove the two unit laws $\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T$, naming the triangle identity used at each step, and identify the monad this construction produces for the free-forgetful adjunction $F\\dashv U$ between $\\mathbf{Set}$ and $\\mathbf{Grp}$."
      answer: "Components: $T_C=GFC$ and $\\mu_C=G(\\varepsilon_{FC})$. First law: $(\\mu\\circ T\\eta)_C=\\mu_C\\circ GF(\\eta_C)=G(\\varepsilon_{FC})\\circ G(F\\eta_C)=G\\big(\\varepsilon_{FC}\\circ F\\eta_C\\big)=G(1_{FC})=1_{GFC}$, using functoriality of $G$ and then the first triangle identity $\\varepsilon F\\circ F\\eta=1_F$. Second law: $(\\mu\\circ\\eta T)_C=\\mu_C\\circ\\eta_{GFC}=G(\\varepsilon_{FC})\\circ\\eta_{G(FC)}=(G\\varepsilon\\circ\\eta G)_{FC}=1_{G(FC)}$, which is the second triangle identity $G\\varepsilon\\circ\\eta G=1_G$ evaluated at the object $FC$. For $F\\dashv U$ between $\\mathbf{Set}$ and $\\mathbf{Grp}$ the induced monad is the free-group monad $T=UF$: $TX$ is the underlying set of the free group on $X$ (reduced words in the letters of $X$ and their formal inverses), $\\eta_X$ inserts a letter as a one-letter word, and $\\mu_X$ multiplies out a word of words."
      solution_sketch: "Push $G$ through each composite by functoriality until a triangle identity appears inside it: the first law reduces to $\\varepsilon F\\circ F\\eta=1_F$ under $G$, and the second is $G\\varepsilon\\circ\\eta G=1_G$ evaluated at the object $FC$. Then name the induced monad on $\\mathbf{Set}$."
    anki_seeds:
      - front: "The monad induced by an adjunction $F\\dashv G$?"
        back: "$T=GF$, unit $\\eta$, multiplication $\\mu=G\\varepsilon F$."
        type: basic
      - front: "Every monad arises from an adjunction — canonical ones are the {{c1::Kleisli}} and {{c2::Eilenberg-Moore}} resolutions."
        back: "Kleisli; Eilenberg-Moore"
        type: cloze

  - id: kleisli-vs-eilenberg-moore
    name: Kleisli versus Eilenberg-Moore
    core: false
    difficulty: 0.82
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: kleisli-categories
        weight: 0.5
        key: true
      - id: algebras-over-monads
        weight: 0.5
        key: true
      - id: adjunctions-give-monads
        weight: 0.4
        key: true
      - id: adjunctions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The comparison functor
        key_prerequisites: [kleisli-categories]
        constraints: "Every step must cite a monad law or a naturality square by name."
        exemplars:
          - problem: "Define the comparison functor $K\\colon\\mathcal{C}_T\\to\\mathcal{C}^T$ and verify it lands in $T$-algebras and preserves identities and composition."
            answer: "$K(A)=(TA,\\mu_A)$ and $K(f)=\\mu_B\\circ Tf$ for $f\\colon A\\to TB$; functoriality uses the unit law and associativity."
            solution_sketch: "$(TA,\\mu_A)$ is a $T$-algebra: its unit law $\\mu_A\\circ\\eta_{TA}=1_{TA}$ and associativity $\\mu_A\\circ\\mu_{TA}=\\mu_A\\circ T\\mu_A$ are the monad laws at $A$. Identities: $K(\\eta_A)=\\mu_A\\circ T\\eta_A=1_{TA}$ by the unit law. Composition: for $f\\colon A\\to TB$ and $g\\colon B\\to TC$, $K(g\\circ_T f)=\\mu_C\\circ T(\\mu_C\\circ Tg\\circ f)=\\mu_C\\circ T\\mu_C\\circ T^2g\\circ Tf$, while $K(g)\\circ K(f)=\\mu_C\\circ Tg\\circ\\mu_B\\circ Tf=\\mu_C\\circ\\mu_{TC}\\circ T^2g\\circ Tf$ using naturality of $\\mu$ at $g$. The two agree by monad associativity $\\mu\\circ T\\mu=\\mu\\circ\\mu T$."
          - problem: "Verify that $K(f)=\\mu_B\\circ Tf$ is a morphism of $T$-algebras $(TA,\\mu_A)\\to(TB,\\mu_B)$."
            answer: "$K(f)\\circ\\mu_A=\\mu_B\\circ T(K(f))$, by naturality of $\\mu$ and monad associativity."
            solution_sketch: "An algebra morphism must satisfy $K(f)\\circ\\mu_A=\\mu_B\\circ T(K(f))$. Left side: $\\mu_B\\circ Tf\\circ\\mu_A=\\mu_B\\circ\\mu_{TB}\\circ T^2f$, using naturality of $\\mu$ at $f\\colon A\\to TB$, which gives $Tf\\circ\\mu_A=\\mu_{TB}\\circ T^2f$. Right side: $\\mu_B\\circ T(\\mu_B\\circ Tf)=\\mu_B\\circ T\\mu_B\\circ T^2f$. Since $\\mu_B\\circ\\mu_{TB}=\\mu_B\\circ T\\mu_B$ by monad associativity, the two sides agree."
      - id: kp2
        name: Kleisli as the free algebras
        key_prerequisites: [algebras-over-monads]
        constraints: "Use the Eilenberg-Moore free-forgetful bijection; verify both round trips."
        exemplars:
          - problem: "Let $T$ be the monad on sets with $T(X) = X$ plus one extra point $*$, so an algebra for $T$ is a set with a chosen basepoint. Take the algebra $(B, b)$ with $B = \\{0, 1, 2\\}$ and basepoint $0$, and the free algebra $(TA, \\mu_A)$ on $A = \\{5, 6\\}$. Let $f: A \\to B$ with $f(5) = 1$ and $f(6) = 2$. Under the free-forgetful bijection, $f$ corresponds to the algebra morphism $\\varphi = b \\circ Tf$ from $(TA, \\mu_A)$ to $(B, b)$. Give the value $\\varphi(*)$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free algebra on $A$ has underlying set $\\{5, 6, *\\}$, and the full morphism is $\\varphi = b \\circ Tf$, with $\\varphi(5) = 1$ and $\\varphi(6) = 2$ on the elements of $A$. Apply $T$ to $f$: the map $Tf$ sends $5$ to $1$, $6$ to $2$, and $*$ to $*$. The structure map $b$ fixes each element of $B$ and sends the extra point to the basepoint, so $\\varphi(*) = b(*) = 0$. Composing back with $\\eta_A$ returns $f$, which is round trip one. The answer is 0."
          - problem: "Let $T$ be the monad on sets with $T(X) = X$ plus one extra point. The comparison functor $K$ from the Kleisli category to the Eilenberg-Moore category sends a set $A$ to the free algebra $(TA, \\mu_A)$. Take $A = \\{1, 2\\}$ and $B = \\{0, 1, 2, 3\\}$. How many morphisms of $T$-algebras are there from the free algebra on $A$ to the free algebra on $B$?"
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the free-forgetful bijection with the free algebra $(TB, \\mu_B)$ in the second slot, morphisms of algebras from $(TA, \\mu_A)$ to $(TB, \\mu_B)$ correspond to functions from $A$ to $TB$. The set $TB$ has $5$ elements: the four elements of $B$ and the extra point. Each of the $2$ elements of $A$ has $5$ choices, so the count is $5 \\times 5 = 25$; this hom-bijection is exactly what makes $K$ fully faithful. The answer is 25."
          - problem: "Let $T$ be the closure operator on the poset of subsets of $\\{1, 2, 3\\}$ given by $cl(S) = S$ if $S$ is empty and $cl(S) = S \\cup \\{1\\}$ otherwise; this is a monad, and its algebras are the closed sets. The comparison functor $K$ sends each subset $A$ to the free algebra with underlying closed set $cl(A)$. How many distinct free algebras does $K$ hit as $A$ runs over all eight subsets?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute $cl(A)$ for each subset of $\\{1, 2, 3\\}$. The empty set maps to itself, and $\\{1\\}$ maps to $\\{1\\}$. The subsets $\\{2\\}$ and $\\{1, 2\\}$ both give $\\{1, 2\\}$, while $\\{3\\}$ and $\\{1, 3\\}$ both give $\\{1, 3\\}$. The subsets $\\{2, 3\\}$ and $\\{1, 2, 3\\}$ both give $\\{1, 2, 3\\}$. The distinct free algebras have underlying sets the empty set, $\\{1\\}$, $\\{1, 2\\}$, $\\{1, 3\\}$ and $\\{1, 2, 3\\}$, which is the essential image of $K$. The answer is 5."
          - problem: "Claim: for every monad $T$, each algebra morphism $\\varphi$ from the free algebra $(TA, \\mu_A)$ to an algebra $(B, b)$ returns to itself under the round trip through the free-forgetful bijection. Step 1: $\\varphi$ is an algebra morphism, so $\\varphi \\circ \\mu_A = b \\circ T\\varphi$. Step 2: the bijection sends $\\varphi$ to the function $f = \\varphi \\circ \\eta_A$. Step 3: then $b \\circ Tf = b \\circ T\\varphi \\circ T\\eta_A = \\varphi \\circ \\mu_A \\circ T\\eta_A$ by Step 1. Step 4: by the unit law of the monad, $T\\eta_A = \\eta_A$, so $b \\circ Tf = \\varphi \\circ \\mu_A \\circ \\eta_A = \\varphi$. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is the definition of a morphism of $T$-algebras. Step 2 is valid: it is the restriction map of the free-forgetful bijection. Step 3 is valid: it uses functoriality of $T$ and then substitutes Step 1. Step 4 is not valid: the monad unit law says $\\mu_A \\circ T\\eta_A = id$, not $T\\eta_A = \\eta_A$, and those two maps even have different domains, $TA$ versus $A$. With the correct unit law the composite is $\\varphi \\circ \\mu_A \\circ T\\eta_A = \\varphi$ directly. The answer is Step 4."
          - problem: "Let $(B, b)$ be an algebra for a monad $T$ with multiplication $\\mu$. In the verification that $\\Psi(f) = b \\circ Tf$ is a morphism of algebras, one step rewrites the composite $b \\circ \\mu_B \\circ T^2f$ as $b \\circ Tb \\circ T^2f$. Which fact does this step use?"
            answer: "the associativity axiom"
            answer_contract: {"kind": "label", "options": [["the associativity axiom"], ["the unit axiom"], ["naturality of eta"], ["naturality of mu"]]}
            solution_sketch: "The full step reads $b \\circ \\mu_B \\circ T^2f = b \\circ Tb \\circ T^2f$, and it follows by composing the associativity axiom $b \\circ \\mu_B = b \\circ Tb$ of the algebra $(B, b)$ with $T^2f$ on the right. The option 'the unit axiom' is about $b \\circ \\eta_B$ and never mentions $\\mu_B$. The option 'naturality of eta' moves $\\eta$ past a map, and no $\\eta$ occurs in this composite. The option 'naturality of mu' would rewrite $\\mu_B \\circ T^2f$ as $Tf \\circ \\mu_A$, not $\\mu_B$ as $Tb$. The answer is the associativity axiom."
          - problem: "Let $T$ be the monad on sets with $T(X) = X$ plus one extra point, so an algebra for $T$ is a set with a chosen basepoint. Take the free algebra $(TA, \\mu_A)$ on $A = \\{1, 2, 3\\}$ and the algebra $(B, b)$ with $B = \\{0, 1\\}$ and basepoint $0$. How many morphisms of $T$-algebras are there from the free algebra to $(B, b)$?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free-forgetful bijection identifies morphisms of algebras from $(TA, \\mu_A)$ to $(B, b)$ with functions from $A$ to $B$, by restricting a morphism along $\\eta_A$. The inverse sends a function $f$ to $b \\circ Tf$, which forces the value at the extra point to be the basepoint and leaves $f$ free on $A$. Each of the $3$ elements of $A$ can be sent to either of the $2$ elements of $B$, giving $2 \\times 2 \\times 2 = 8$. The answer is 8."
          - problem: "Write the full proof: the comparison functor from the Kleisli category of a monad to its Eilenberg-Moore category is fully faithful, and its essential image consists of the free algebras. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let $T$ be a monad on $\\mathcal C$ with unit $\\eta$ and multiplication $\\mu$; the comparison functor $K$ sends $A$ to the free algebra $(TA, \\mu_A)$ and a Kleisli arrow $f: A \\to TB$ to $\\mu_B \\circ Tf$. Step 1 (the bijection): for an algebra $(B, b)$, send an algebra morphism $\\varphi: (TA, \\mu_A) \\to (B, b)$ to $\\varphi \\circ \\eta_A: A \\to B$, and send a map $f: A \\to B$ back to $\\Psi(f) = b \\circ Tf$. Step 2 ($\\Psi(f)$ is an algebra morphism): $\\Psi(f) \\circ \\mu_A = b \\circ Tf \\circ \\mu_A = b \\circ \\mu_B \\circ T^2f = b \\circ Tb \\circ T^2f = b \\circ T(b \\circ Tf)$, using naturality of $\\mu$ and then the associativity law $b \\circ \\mu_B = b \\circ Tb$ of the algebra. Step 3 (round trip one): $\\Psi(f) \\circ \\eta_A = b \\circ Tf \\circ \\eta_A = b \\circ \\eta_B \\circ f = f$, by naturality of $\\eta$ and the unit law $b \\circ \\eta_B = id_B$. Step 4 (round trip two): for an algebra morphism $\\varphi$, we get $b \\circ T(\\varphi \\circ \\eta_A) = b \\circ T\\varphi \\circ T\\eta_A = \\varphi \\circ \\mu_A \\circ T\\eta_A = \\varphi$, using the morphism law from Step 1 and the monad unit law $\\mu_A \\circ T\\eta_A = id_{TA}$. So the two maps are mutually inverse and $\\mathrm{Hom}$-sets correspond bijectively. Step 5 (full faithfulness): with $(B, b) = (TB, \\mu_B)$ the bijection reads morphisms from $KA$ to $KB$ correspond to maps $A \\to TB$, which are exactly the Kleisli arrows, and the inverse sends $f$ to $\\mu_B \\circ Tf = K(f)$; hence $K$ is fully faithful. Step 6 (image): on objects $K$ hits precisely the free algebras $(TA, \\mu_A)$, so the essential image of $K$ is the full subcategory of free algebras, and the Kleisli category is equivalent to it."
      - id: kp3
        name: The extreme resolutions of a monad
        key_prerequisites: [adjunctions-give-monads]
        constraints: "A resolution is an adjunction inducing $T$; comparison functors must commute with both the left and the right adjoint."
        exemplars:
          - problem: "A monad on a poset is a monotone map c with x <= c(x) and c(c(x)) <= c(x). Take the poset with elements 0, a, b, 1 and order relations 0 < a < 1 and 0 < b < 1, and the map c with c(0) = 0, c(a) = 1, c(b) = 1, c(1) = 1. An Eilenberg-Moore algebra is an element y with c(y) = y. The comparison functor K from the Kleisli category sends an object x to the free algebra on x. Give the underlying element of K(a)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Recall the comparison functor: K(A) = (T A, mu A), and on a poset monad the free algebra on x has underlying element c(x). Compute the free algebra on a: c(a) = 1. Check the algebra law: c(1) = 1, so the result is a genuine algebra. The answer is 1."
          - problem: "A resolution of a monad T is an adjunction F -| G that induces T, and a morphism of resolutions is a functor that commutes with the left adjoint and with the right adjoint. Fix any resolution of T. How many morphisms of resolutions are there from the Kleisli resolution of T to this fixed resolution?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A morphism of resolutions is a functor L with L F_T = F and G L = U_T. Objects: L(A) = L(F_T A) = F(A) is forced by the left-adjoint condition. Morphisms: a Kleisli map f from A to T B is sent to the unique morphism from F(A) to F(B) whose adjunct under the adjunction bijection is U_T(f); the bijection makes this choice unique. Hence exactly one morphism of resolutions exists. The answer is 1."
          - problem: "A monad on a poset is a monotone map c with x <= c(x) and c(c(x)) <= c(x). On the chain 0 < 1 < 2 < 3 take c(0) = 0, c(1) = 2, c(2) = 2, c(3) = 3. An Eilenberg-Moore algebra of this monad is an element y with c(y) = y. How many Eilenberg-Moore algebras does this monad have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The algebra law for a monad on a poset says c(y) = y. Check each element of the chain: c(0) = 0, c(1) = 2, c(2) = 2, c(3) = 3. The fixed elements are 0, 2 and 3, and these are exactly the objects of the Eilenberg-Moore category, which is the terminal resolution. The answer is 3."
          - problem: "Work in the poset with elements 0, p, q, r, 1, order relations 0 < p < 1, 0 < q < 1 and 0 < r < 1, and the monad c with c(0) = 0, c(p) = 1, c(q) = 1, c(r) = 1, c(1) = 1. The comparison functor K from the Kleisli category to the Eilenberg-Moore category sends each object x to the free algebra on x, whose underlying element is c(x). How many distinct Eilenberg-Moore algebras lie in the image of K?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The comparison functor K sends a Kleisli object x to the free algebra on x, whose underlying element is c(x). Compute the values on all five objects: c(0) = 0, c(p) = 1, c(q) = 1, c(r) = 1, c(1) = 1. The distinct algebras reached are 0 and 1, so K collapses the Kleisli category onto two free algebras. The answer is 2."
          - problem: "For the powerset monad, the comparison functor K sends a set A to the free algebra on A, whose underlying set T A is the powerset of A. Let S be the set with elements 1, 2, 3, and let A be the subset of S with elements 1 and 3. Give the number of elements of the underlying set of K(A)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of the comparison functor, K(A) = (T A, mu A) with T A the powerset of A. The set A has 2 elements, so its powerset has 2 times 2, that is 4, subsets: the empty set, the two singletons and the whole set A. The monad multiplication is union, which does not change the count of elements. The answer is 4."
          - problem: "Claim: for any resolution F -| G of a monad T, there is at most one morphism of resolutions from the Kleisli adjunction to it. Step 1: a morphism of resolutions is a functor L with L F_T = F and G L = U_T. Step 2: each object A of the Kleisli category equals F_T A, so L(A) = F(A) is forced. Step 3: a Kleisli morphism f from A to B is a map from A to U_T B, and L(f) is forced because the right adjoint G is faithful. Step 4: L is forced on objects and on morphisms, so at most one morphism of resolutions exists. Which step is the first invalid step?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is exactly the definition of a morphism of resolutions, commuting with both adjoints. Step 2 is valid: every object of the Kleisli category is F_T A, so the left-adjoint condition forces L on objects. Step 3 is the first invalid step: a resolution's right adjoint G is not assumed faithful, so G(L(f)) = U_T(f) does not by itself determine L(f); the true reason is that L(f) is the unique morphism whose adjunct under the adjunction bijection is U_T(f). Step 4 is a valid conclusion once morphisms are genuinely forced. The answer is Step 3."
          - problem: "Write the full proof: for a monad T on a category C, the Kleisli adjunction is the initial resolution of T and the Eilenberg-Moore adjunction is the terminal resolution of T, and the unique morphism from the initial to the terminal resolution is the comparison functor K. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, definitions: a resolution of T is an adjunction F -| G with G F = T whose unit and counit induce the unit and multiplication of T; a morphism of resolutions is a functor commuting with the left and the right adjoint. Step 2, Kleisli is initial: given a resolution F -| G on E, set L(A) = F(A), and for a Kleisli map f from A to T B set L(f) to be the adjunct of mu B after T(f) under the adjunction; the triangle identities give L F_T = F and G L = U_T, and the adjunct bijection makes L the unique functor with these two properties. Step 3, Eilenberg-Moore is terminal: for the same resolution, send an object X of E to the T-algebra whose underlying object is G X and whose structure map is G applied to the counit at X; the adjunction identities verify the algebra law, and this construction is the unique functor R with R F = F^T and U^T R = G. Step 4, the comparison: the unique morphism from the initial to the terminal resolution is K, because K(A) = (T A, mu A) on objects and K(f) = mu B after T(f) on Kleisli maps, and K commutes with both adjoints by the monad unit law and the definition of U^T. Conclusion: the Kleisli resolution is initial, the Eilenberg-Moore resolution is terminal, and K is the unique morphism of resolutions between them."
    diagnostic_exemplar:
      problem: "Let $T$ be a monad on $\\mathcal C$ and $K\\colon\\mathcal C_T\\to\\mathcal C^T$ the comparison functor, $K(A)=(TA,\\mu_A)$ and $K(f)=\\mu_B\\circ Tf$ for $f\\colon A\\to TB$. Prove that $K$ is fully faithful by exhibiting a two-sided inverse to the hom-set map $f\\mapsto K(f)$, and identify the essential image of $K$."
      answer: "Define $\\Lambda(\\varphi)=\\varphi\\circ\\eta_A$ for an algebra morphism $\\varphi\\colon(TA,\\mu_A)\\to(TB,\\mu_B)$; note $\\Lambda(\\varphi)\\colon A\\to TB$ is a morphism $A\\to B$ of $\\mathcal C_T$. Faithfulness: $\\Lambda(K(f))=\\mu_B\\circ Tf\\circ\\eta_A=\\mu_B\\circ\\eta_{TB}\\circ f=1_{TB}\\circ f=f$, using naturality of $\\eta$ at $f\\colon A\\to TB$ and then the monad unit law $\\mu\\circ\\eta T=1_T$. Fullness: $K(\\Lambda(\\varphi))=\\mu_B\\circ T(\\varphi\\circ\\eta_A)=\\mu_B\\circ T\\varphi\\circ T\\eta_A=\\varphi\\circ\\mu_A\\circ T\\eta_A=\\varphi\\circ 1_{TA}=\\varphi$, using that $\\varphi$ is an algebra morphism ($\\varphi\\circ\\mu_A=\\mu_B\\circ T\\varphi$) and then the other unit law $\\mu\\circ T\\eta=1_T$. So $f\\mapsto K(f)$ is a bijection $\\mathcal C_T(A,B)=\\mathrm{Hom}_{\\mathcal C}(A,TB)\\cong\\mathrm{Hom}_{\\mathcal C^T}\\big((TA,\\mu_A),(TB,\\mu_B)\\big)$ and $K$ is fully faithful. Its essential image is the full subcategory of $\\mathcal C^T$ spanned by the free algebras $(TA,\\mu_A)$ — the Kleisli category is the category of free $T$-algebras."
      solution_sketch: "The only candidate inverse to $f\\mapsto K(f)$ is $\\varphi\\mapsto\\varphi\\circ\\eta_A$. One round trip uses naturality of $\\eta$ and then $\\mu\\circ\\eta T=1_T$; the other uses the algebra-morphism square for $\\varphi$ and then $\\mu\\circ T\\eta=1_T$. Those two round trips are precisely faithfulness and fullness."
    anki_seeds:
      - front: "The comparison functor $\\mathcal{C}_T\\to\\mathcal{C}^T$ sends $A\\mapsto$? and $f\\colon A\\to TB\\mapsto$?"
        back: "$A\\mapsto(TA,\\mu_A)$; $f\\mapsto\\mu_B\\circ Tf$."
        type: basic
      - front: "The Kleisli category is equivalent to which part of the Eilenberg-Moore category?"
        back: "the full subcategory of free algebras $(TA,\\mu_A)$."
        type: basic
      - front: "Among resolutions of a monad $T$, Kleisli is the {{c1::initial}} one and Eilenberg-Moore the {{c2::terminal}} one."
        back: "initial; terminal"
        type: cloze

  - id: cartesian-closed-categories
    name: Cartesian Closed Categories
    core: false
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: exponential-objects
        weight: 0.5
        key: true
      - id: products-coproducts
        weight: 0.4
        key: true
      - id: initial-terminal-objects
        weight: 0.2
      - id: adjunctions
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Definition
        key_prerequisites: [exponential-objects]
        constraints: "State all three ingredients (terminal object, binary products, exponentials) and give the exponential either as the right adjoint of $-\\times A$ or by evaluation plus unique currying; the uniqueness of $\\lambda f$ must be part of the statement."
        exemplars:
          - problem: "A student must list everything that a cartesian closed category is required to have. Select the complete and correct list."
            answer: "Terminal object, binary products, exponentials"
            answer_contract: {"kind": "label", "options": [["Terminal object, binary products, exponentials"], ["Initial object, binary coproducts, exponentials"], ["Terminal object, binary coproducts, exponentials"], ["Terminal object, binary products, equalizers"]]}
            solution_sketch: "A cartesian closed category must have a terminal object, all binary products, and an exponential B^A for every pair of objects (definition of a cartesian closed category). The option 'Initial object, binary coproducts, exponentials' uses the dual notions, which describe a cocartesian structure. The option 'Terminal object, binary coproducts, exponentials' replaces the products by coproducts. The option 'Terminal object, binary products, equalizers' lists finite limits and forgets the exponentials entirely. The answer is Terminal object, binary products, exponentials."
          - problem: "A textbook states the universal property of an exponential object in a category that has binary products. Select the correct statement."
            answer: "Each f: X x A -> B has a unique g: X -> B^A with ev o (g x 1_A) = f"
            answer_contract: {"kind": "label", "options": [["Each f: X x A -> B has a unique g: X -> B^A with ev o (g x 1_A) = f"], ["Each f: X x A -> B has at least one g: X -> B^A with ev o (g x 1_A) = f"], ["Each f: X x A -> B has a unique g: B^A -> X with ev o (1_A x g) = f"], ["Each f: X x A -> B has a unique g: A -> B^X with ev o (1_X x g) = f"]]}
            solution_sketch: "The universal property needs an evaluation map ev from B^A x A to B and, for each morphism f from X x A to B, a unique transpose (currying) from X to B^A that recovers f. The option with 'at least one g' drops the uniqueness of the transpose, which the definition requires. The option with 'g: B^A -> X' points the transpose in the wrong direction. The option with 'g: A -> B^X' curries the wrong factor, exponentiating X instead of A. The answer is Each f: X x A -> B has a unique g: X -> B^A with ev o (g x 1_A) = f."
          - problem: "In the category of finite sets, the exponential B^A is the set of all functions from A to B; this is the motivating example of an exponential object. Let A be a set of 3 elements and B a set of 2 elements. How many elements does the exponential B^A have?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (exponential of sets): B^A is the function set from A to B. Step 2 (counting rule): each of the 3 elements of A independently chooses one of the 2 elements of B. Step 3 (product of choices): the count is 2 x 2 x 2 = 8. The answer is 8."
          - problem: "By the definition of a cartesian closed category, the exponential construction is a right adjoint, so for all objects X, A, B there is a bijection between the morphisms from X x A to B and the morphisms from X to B^A. Work in the category of finite sets, where X has 2 elements, A has 3 elements and B has 4 elements. How many morphisms are there from X to B^A?"
            answer: "4096"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (exponential of sets): B^A is the set of functions from A to B, which has 4 x 4 x 4 = 64 elements. Step 2 (morphism count): a morphism from X to B^A is a function from a 2-element set into a 64-element set, so there are 64 x 64 = 4096. Step 3 (adjunction check): the bijection matches these with the morphisms from X x A to B, which number 4^6 = 4096. The answer is 4096."
          - problem: "Regard the collection of all subsets of {1, 2, 3, 4, 5} as a category whose morphisms are inclusions. The whole set is the terminal object, the product of two subsets is their intersection, and the exponential Y^X is the largest subset Z whose intersection with X is contained in Y. Take X = {1, 2, 3} and Y = {3, 4}. How many elements does the exponential Y^X have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (universal property in a poset): Y^X is the largest subset Z with the intersection of Z and X contained in Y. Step 2 (test each element): 1 and 2 cannot lie in Z, since they are in X but not in Y; 3 is allowed, since it lies in Y; 4 and 5 are outside X and always allowed. Step 3 (largest subset): the largest Z is {3, 4, 5}. The answer is 3."
          - problem: "In a cartesian closed category, the adjunction between the product functor and the exponential gives a bijection between the morphisms from the terminal object 1 to B^A, called the global elements of B^A, and the morphisms from A to B. Work in the category of finite sets, where A has 2 elements and B has 5 elements. How many global elements does the exponential B^A have?"
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (right adjoint bijection): in a cartesian closed category there is a bijection between the morphisms from X x A to B and the morphisms from X to B^A. Step 2 (take X = 1): with the terminal object 1, the morphisms 1 -> B^A are the global elements, and they correspond to the morphisms from A to B. Step 3 (count in finite sets): B^A is the set of functions from a 2-element set to a 5-element set, so it has 5 x 5 = 25 elements. The answer is 25."
          - problem: "Write the full proof: a category with a terminal object and all binary products is cartesian closed exactly when, for each object A, the functor taking X to X x A has a right adjoint, and then each exponential B^A carries an evaluation map whose transpose exists and is unique. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (definition): a cartesian closed category has a terminal object 1, all binary products, and for each object A a right adjoint to the functor sending X to X x A. Step 2 (adjunction): this right adjoint assigns to each object B an object B^A together with a bijection between the morphisms from X x A to B and the morphisms from X to B^A, natural in X and B. Step 3 (evaluation): take X = B^A and the identity on B^A; its inverse image under the bijection is a morphism ev from B^A x A to B, the evaluation map. Step 4 (currying): for any morphism f from X x A to B, let g from X to B^A be its image under the bijection; naturality in X gives ev composed with (g x 1_A) = f. Step 5 (uniqueness): the bijection is injective, so this g is the unique transpose of f. Step 6 (converse): if evaluation maps with unique transposes exist for all A and B, then currying is a bijection, so B^A is the value at B of a right adjoint to the functor X x A; together with 1 and the binary products, the category is cartesian closed."
      - id: kp2
        name: Set is cartesian closed
        key_prerequisites: [products-coproducts]
        constraints: "$\\mathbf{Set}$ is the positive case (exponential $=$ function set, currying $=$ the adjunction); a negative verdict must be settled by a left-adjoint preservation failure in an additive category such as $\\mathbf{Vect}_k$ or $\\mathbf{Ab}$, exhibiting $0\\times V\\cong V$ with $V$ nonzero."
        exemplars:
          - problem: "In the category Set, the exponential B^A is the set of all functions from A to B. Take a set A with 2 elements and a set B with 7 elements. Find the number of elements of the exponential B^A."
            answer: "49"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Exponential rule in Set: the exponential B^A is the full function set, so its size is the size of B raised to the size of A. Compute the power: 7^2 = 49. The answer is 49."
          - problem: "In the category Vect_k of vector spaces over a field k, the zero space is the initial object and finite products are direct sums. In any cartesian closed category, the functor sending V to V × A must preserve the initial object, because it has a right adjoint. Take the space V = k^6. Give the dimension of the product 0 × V."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Product rule in Vect_k: the product 0 × V is the direct sum 0 ⊕ V, which is isomorphic to V = k^6, so its dimension is 6. Preservation test: a cartesian closed category would force 0 × V to be isomorphic to the initial object 0, of dimension 0; since 6 is not 0, the functor has no right adjoint and Vect_k is not cartesian closed. The answer is 6."
          - problem: "Currying in Set gives a bijection between the functions from X × A to B and the functions from X to B^A, where B^A is the set of all functions from A to B. Let X have 2 elements, A have 3 elements, and B have 2 elements. Find the number of functions from X to B^A."
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Size of the exponential: B^A is the function set from A to B, so it has 2^3 = 8 elements. Hom-set count: the functions from X to B^A number 8^2 = 64. Currying check: the functions from X × A to B number 2^6 = 64 as well, matching the bijection Hom(X × A, B) with Hom(X, B^A). The answer is 64."
          - problem: "Let X = {p, q}, A = {1, 2}, and B = {0, 1}. Define a function f from X × A to B by f(p, a) = 0 for every a in A, and f(q, a) = 1 for every a in A. Currying sends f to its transpose g, a function from X to the exponential B^A. Give the value g(q)(2)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Currying rule: the transpose g of f is defined by g(x)(a) = f(x, a) for every x in X and every a in A. Evaluate at x = q and a = 2: g(q)(2) = f(q, 2), and f(q, 2) = 1 by the definition of f. The answer is 1."
          - problem: "A student argues that Ab, the category of abelian groups, is cartesian closed. Step 1: Ab has a terminal object, namely the trivial group 0. Step 2: Ab has all finite products, given by the direct sum A ⊕ B. Step 3: a category with a terminal object and all finite products is cartesian closed. Step 4: therefore Ab is cartesian closed. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: every abelian group has exactly one homomorphism to the trivial group, so 0 is terminal in Ab. Step 2 is valid: direct sums are biproducts, so they give all finite products. Step 3 is not valid: cartesian closure further requires exponentials, a right adjoint to the functor G × A; in Ab the product 0 ⊕ Z is isomorphic to Z with Z nonzero, so this functor does not preserve the initial object and no right adjoint exists. Step 4 only follows from Step 3, so it is not the first invalid step. The answer is Step 3."
          - problem: "In the proof that Set is cartesian closed, the currying bijection sends each function f from the product X × A to B to a function g from X to the exponential B^A, the set of all functions from A to B. Select the line that correctly defines g."
            answer: "g(x)(a) = f(x,a)"
            answer_contract: {"kind": "label", "options": [["g(x)(a) = f(x,a)"], ["g(a)(x) = f(x,a)"], ["g(x)(a) = f(a,x)"], ["g(x) = f(x,a)"]]}
            solution_sketch: "Currying rule: g(x) must be a function from A to B, and evaluating it at a must return the value of f at the pair (x, a), so the full line is g(x)(a) = f(x,a). The option g(a)(x) = f(x,a) swaps the roles of the two variables and is ill typed. The option g(x)(a) = f(a,x) puts the arguments in the wrong order for the product X × A. The option g(x) = f(x,a) leaves a unbound and g(x) would be an element of B, not a function from A to B. The answer is g(x)(a) = f(x,a)."
          - problem: "Write the full proof: the category Set is cartesian closed, with exponential B^A the set of all functions from A to B and currying as the adjunction. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (terminal object): a singleton set 1 is terminal, because every set admits exactly one function to it. Step 2 (products): cartesian products of sets, with their projection maps, give all finite products. Step 3 (exponential): for sets A and B, define B^A as the set of all functions from A to B, with the evaluation map ev from B^A × A to B sending a pair (h, a) to h(a). Step 4 (currying): given f from X × A to B, define its transpose g from X to B^A by g(x)(a) = f(x, a); conversely, given h from X to B^A, set the value at (x, a) to h(x)(a). These two constructions are mutually inverse, so Hom(X × A, B) is in bijection with Hom(X, B^A), naturally in X. Step 5 (adjunction): this natural bijection shows that the functor − × A is left adjoint to the exponential functor (−)^A. Step 6 (conclusion): Set has a terminal object, all finite products, and all exponentials, so Set is cartesian closed."
      - id: kp3
        name: The Curry-Howard-Lambek correspondence
        key_prerequisites: [adjunctions]
        constraints: "Statements of the correspondence at the level of CCCs, the simply typed lambda calculus and intuitionistic propositional logic; every type-theoretic item must be paired with its categorical counterpart ($A\\to B$ with $B^A$, a closed term with a global element $1\\to B^A$, the $\\beta$-rule with $\\mathrm{ev}\\circ(\\lambda f\\times 1_A)=f$)."
        exemplars:
          - problem: "State the Curry-Howard-Lambek correspondence at the level of CCCs."
            answer: "CCCs are the categorical models of the simply typed lambda calculus and of intuitionistic propositional logic."
            solution_sketch: "In a CCC, objects are types, morphisms are terms up to $\\beta\\eta$-equality, products are pairing, and the exponential $B^A$ is the function type with $\\mathrm{ev}$ = application and currying = $\\lambda$-abstraction. This makes the internal language of a CCC the simply typed lambda calculus; via Curry-Howard it also models intuitionistic propositional logic (types = propositions, terms = proofs). CCCs are exactly the models."
          - problem: "Under Curry-Howard-Lambek, what do the type $A\\to B$, a closed term of it, and the $\\beta$-rule correspond to categorically?"
            answer: "$A\\to B$ is $B^A$; a closed term is a global element $1\\to B^A$; the $\\beta$-rule is the law $\\mathrm{ev}\\circ(\\lambda f\\times 1_A)=f$."
            solution_sketch: "The function type $A\\to B$ is the exponential $B^A$; an open term $x\\colon A\\vdash t\\colon B$ is a morphism $A\\to B$, and a closed term $\\vdash t\\colon A\\to B$ is a global element $1\\to B^A$. Application is $\\mathrm{ev}\\colon B^A\\times A\\to B$ and $\\lambda$-abstraction is currying. The computation rule $(\\lambda x.t)\\,u=t[u/x]$ is exactly $\\mathrm{ev}\\circ(\\lambda f\\times 1_A)=f$, while the $\\eta$-rule is uniqueness of the transpose. So typing/provability becomes existence of morphisms."
    diagnostic_exemplar:
      problem: "In a cartesian closed category with terminal object $1$, prove that the global elements $1\\to B^A$ correspond bijectively to the morphisms $A\\to B$, and explain what this correspondence says under the Curry-Howard-Lambek reading."
      answer: "The universal property of $B^A$ says every $g\\colon X\\times A\\to B$ equals $\\mathrm{ev}\\circ(\\lambda g\\times 1_A)$ for a unique $\\lambda g\\colon X\\to B^A$; that is, currying is a bijection $\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$. Take $X=1$: $\\mathrm{Hom}(1,B^A)\\cong\\mathrm{Hom}(1\\times A,B)$. The projection $\\pi_A\\colon 1\\times A\\to A$ is an isomorphism, with inverse $\\langle{!}_A,1_A\\rangle$ where ${!}_A\\colon A\\to 1$ is the unique such map: $\\pi_A\\circ\\langle{!}_A,1_A\\rangle=1_A$ by the product's equations, and $\\langle{!}_A,1_A\\rangle\\circ\\pi_A=1_{1\\times A}$ because both sides are maps into $1\\times A$ whose two components agree (the $1$-component by terminality, the $A$-component by $\\pi_A$). Composing, $\\mathrm{Hom}(1,B^A)\\cong\\mathrm{Hom}(1\\times A,B)\\cong\\mathrm{Hom}(A,B)$, explicitly $t\\mapsto\\mathrm{ev}\\circ(t\\times 1_A)\\circ\\langle{!}_A,1_A\\rangle$. Under Curry-Howard-Lambek, $B^A$ is the type $A\\to B$, a global element $1\\to B^A$ is a closed term of that type, and the bijection is application followed by $\\beta$-conversion, $\\mathrm{ev}\\circ(\\lambda f\\times 1_A)=f$: a closed function term is the same thing as the morphism it computes. In $\\mathbf{Set}$ this is the familiar identification of elements of the function set $B^A$ with functions $A\\to B$."
      solution_sketch: "Set $X=1$ in the currying bijection, then remove the $1$ using the isomorphism $1\\times A\\cong A$, which you verify from the product equations and terminality. Reading the composite bijection back says that a closed term of function type is the same thing as the morphism it computes."
    anki_seeds:
      - front: "A cartesian closed category has a {{c1::terminal object}}, {{c2::binary products}}, and {{c3::exponentials}} ($-\\times A\\dashv(-)^A$)."
        back: "terminal object; binary products; exponentials"
        type: cloze
      - front: "CCCs model the {{c1::simply typed lambda calculus}} (Curry-Howard-Lambek)."
        back: "simply typed lambda calculus"
        type: cloze

  - id: presheaves-intro
    name: A First Look at Presheaves
    core: false
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: yoneda-embedding
        weight: 0.4
        key: true
      - id: functor-categories
        weight: 0.4
        key: true
      - id: covariant-contravariant-functors
        weight: 0.2
      - id: limits-colimits
        weight: 0.2
      - id: category-of-elements
        weight: 0.0             # R-58: kp2's density statement is indexed by ∫P — the learner must read the (presheaf-convention) ∫F taught there, but no exemplar computes in it
    knowledge_points:
      - id: kp1
        name: The presheaf category and representables
        key_prerequisites: [functor-categories]
        constraints: "Presheaves are functors $\\mathcal C^{op}\\to\\mathbf{Set}$ with natural transformations as morphisms; representables are $\\mathrm{Hom}(-,A)$, and any full-faithfulness claim must be derived by instantiating the Yoneda lemma at a second representable, not asserted."
        exemplars:
          - problem: "Work in the presheaf category [C^op, Set], where C is the category built from the poset with elements a, b, c and order relations a <= c and b <= c, with no other strict relations. In this category there is exactly one arrow x -> y when x <= y, and none otherwise. The representable presheaf at a is y_a = Hom(-, a), which sends an object x to the set of arrows x -> a. Give the number of elements of y_a at a, at b, and at c, in this order."
            answer: "1, 0, 0"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The representable presheaf at a is y_a = Hom(-, a), which sends each object x to the set of arrows x -> a, by the definition of a representable. At a: a <= a holds, so the identity arrow a -> a is the unique element, giving 1 element. At b: b <= a is false, so there is no arrow b -> a, giving 0 elements. At c: c <= a is false, so the set is again empty, 0 elements. The answer is 1, 0, 0."
          - problem: "Let C be the category built from the poset with elements a, b, c whose only strict order relations are a < c and b < c, so an arrow x -> y exists exactly when x <= y. Let y_a = Hom(-, a) and y_c = Hom(-, c) be the representable presheaves. Instantiating the Yoneda lemma at the second representable, how many natural transformations are there from y_c to y_a?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma: Nat(y_c, P) is in bijection with P(c) for every presheaf P. Instantiate at the second representable, P = y_a: Nat(y_c, y_a) is in bijection with y_a(c) = Hom(c, a). In this poset c <= a fails, so there is no arrow c -> a and Hom(c, a) is empty. Hence Nat(y_c, y_a) is empty, and it matches the hom-set Hom(c, a), which is the full-faithfulness statement for the Yoneda embedding. The answer is 0."
          - problem: "A small category C has two objects X and Y and exactly one arrow f : X -> Y besides the identities. A presheaf P on C is given by P(X) = {1, 2, 3}, P(Y) = {u, v}, and the map P(f) : P(Y) -> P(X) sending u to 1 and v to 2. Let y_X = Hom(-, X) be the representable at X. How many natural transformations are there from y_X to P?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma: for any presheaf P and object A, the map sending a natural transformation beta : y_A -> P to beta_A(id_A) is a bijection from Nat(y_A, P) to P(A). Here A = X, and P(X) = {1, 2, 3} has 3 elements. Each of the 3 elements gives exactly one natural transformation from y_X to P, and there are no others. The answer is 3."
          - problem: "Let C be the category built from the chain 1 <= 2 <= 3, so there is one arrow m -> n whenever m <= n. A presheaf P on C is a contravariant functor to Set, given on objects by P(1) = {z}, P(2) = {w, s}, P(3) = {u, v}. The arrow 2 -> 3 of C induces one map between two of these sets. State which map P produces for this arrow, and give the number of elements of its domain."
            answer: "map = P3toP2; domain = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["P3toP2"], ["P2toP3"]]}, "name": "map"}, {"contract": {"kind": "exact"}, "name": "domain"}]}
            solution_sketch: "A presheaf is a functor from C^op to Set, so it reverses the direction of every arrow: this is the contravariance rule for presheaves. The arrow 2 -> 3 in C is an arrow 3 -> 2 in C^op, so P produces the map P(3) -> P(2), not the map P(2) -> P(3), which the covariant direction would give. The domain is P(3) = {u, v}, a set with 2 elements. The answer is map = P3toP2; domain = 2."
          - problem: "Claim: on the category with two objects X, Y and one arrow f : X -> Y besides identities, the following data defines a presheaf P : C^op -> Set. Step 1: set P(X) = {1} and P(Y) = {u, v}. Step 2: for the arrow f : X -> Y, define P(f) : P(X) -> P(Y) to be the map sending 1 to u. Step 3: check that P(id_X) and P(id_Y) are identity maps, as functoriality requires. Step 4: conclude that P is a presheaf. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 only names the sets P(X) and P(Y), which is a legal start. Step 2 is the first invalid step: a presheaf acts on C^op, so the arrow f : X -> Y must induce a map P(f) : P(Y) -> P(X), and the claimed direction P(X) -> P(Y) is covariant, the wrong variance. Step 3 is a true requirement that any functor must satisfy. Step 4 is only the conclusion and fails solely because of the error in Step 2. The answer is Step 2."
          - problem: "On a category C with objects X, Y and exactly one nonidentity arrow f : X -> Y, define a presheaf P by P(X) = {1, 2}, P(Y) = {u, v, w}, with P(f) : P(Y) -> P(X) mapping u to 1, v to 1, and w to 2. Let y_Y = Hom(-, Y) and let alpha : y_Y -> P be the natural transformation whose component at Y sends id_Y to w. Find the value of alpha_X at f."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Naturality for alpha at the arrow f : X -> Y gives the commuting square P(f) o alpha_Y = alpha_X o y_Y(f), where o is composition; this is the naturality condition for transformations of presheaves. The representable acts by precomposition, so y_Y(f) sends id_Y to f. Therefore alpha_X(f) = alpha_X(y_Y(f)(id_Y)) = P(f)(alpha_Y(id_Y)) = P(f)(w). The restriction map P(f) sends w to 2. The answer is 2."
          - problem: "Write the full proof: for a small category C, the Yoneda embedding y : C -> [C^op, Set], which sends an object A to the representable Hom(-, A), is fully faithful; derive this by instantiating the Yoneda lemma at a second representable Hom(-, B). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (Yoneda lemma): for every presheav P : C^op -> Set and every object A, the function alpha -> alpha_A(id_A) is a bijection from Nat(Hom(-, A), P) to P(A). Step 2 (instantiate at a second representable): take P = Hom(-, B); the bijection becomes Nat(yA, yB) -> Hom(-, B)(A) = Hom(A, B). Step 3 (trace the map): an arrow g : A -> B corresponds to the natural transformation whose component at C sends h : C -> A to g o h, by postcomposition. Step 4 (conclusion): the composite Hom(A, B) -> Nat(yA, yB) -> Hom(A, B) is the identity on hom-sets, so y is full and faithful, and C sits inside the presheaf category as the full subcategory of representables."
      - id: kp2
        name: Completeness and density
        key_prerequisites: [limits-colimits]
        constraints: "Limits and colimits in $\\widehat{\\mathcal C}$ are computed pointwise, inherited from $\\mathbf{Set}$: give the value of the constructed presheaf at an object $C$ explicitly; the density theorem is quoted as a statement only, with no proof."
        exemplars:
          - problem: "Explain why (co)limits in $\\widehat{\\mathcal C}$ are computed pointwise, and state that every presheaf is a colimit of representables."
            answer: "$\\mathbf{Set}$ is (co)complete so $\\widehat{\\mathcal C}$ is too, objectwise; the density theorem writes each presheaf as a colimit of representables."
            solution_sketch: "Because $\\mathbf{Set}$ is complete and cocomplete, the functor category $[\\mathcal C^{op},\\mathbf{Set}]$ is too, with limits and colimits computed objectwise: $(\\mathrm{colim}_i P_i)(C)=\\mathrm{colim}_i(P_i(C))$. Moreover the density (co-Yoneda) theorem canonically writes each presheaf $P$ as a colimit of representables indexed by its category of elements $\\int P$. Thus $\\widehat{\\mathcal C}$ is the free cocompletion of $\\mathcal C$."
          - problem: "Describe the terminal object and binary products of $\\widehat{\\mathcal C}=[\\mathcal C^{op},\\mathbf{Set}]$."
            answer: "Terminal is the constant presheaf $1\\colon C\\mapsto\\{*\\}$; products are pointwise, $(P\\times Q)(C)=P(C)\\times Q(C)$."
            solution_sketch: "Since limits in a functor category valued in $\\mathbf{Set}$ are computed objectwise, the terminal presheaf is $1\\colon C\\mapsto\\{*\\}$, and the product of $P,Q$ is $(P\\times Q)(C)=P(C)\\times Q(C)$ with pointwise projections, acting on arrows componentwise. Universality is checked objectwise: a cone into $P\\times Q$ is a pair of cones into $P$ and $Q$. This is a special case of the general pointwise computation of (co)limits in $\\widehat{\\mathcal C}$."
    diagnostic_exemplar:
      problem: "Let $\\mathcal C$ be a small category. Prove that the presheaf category $\\widehat{\\mathcal C}=[\\mathcal C^{op},\\mathbf{Set}]$ has binary products, computed pointwise by $(P\\times Q)(C)=P(C)\\times Q(C)$, by verifying the universal property; then use the Yoneda lemma to compute $\\mathrm{Nat}(\\mathbf yA,P\\times Q)$ for a representable $\\mathbf yA=\\mathrm{Hom}(-,A)$."
      answer: "Define $(P\\times Q)(C)=PC\\times QC$ and, for $f\\colon C'\\to C$ in $\\mathcal C$, $(P\\times Q)(f)=Pf\\times Qf$; functoriality (contravariant) is componentwise, so $P\\times Q$ is a presheaf, and the componentwise projections $\\pi^P_C,\\pi^Q_C$ are natural because $Pf\\times Qf$ acts coordinatewise. Universal property: given natural transformations $\\alpha\\colon R\\Rightarrow P$ and $\\beta\\colon R\\Rightarrow Q$, set $\\gamma_C=\\langle\\alpha_C,\\beta_C\\rangle\\colon RC\\to PC\\times QC$. This is natural: each coordinate of $\\gamma_{C'}\\circ Rf$ and of $(Pf\\times Qf)\\circ\\gamma_C$ is the naturality square of $\\alpha$ or of $\\beta$. It satisfies $\\pi^P\\cdot\\gamma=\\alpha$ and $\\pi^Q\\cdot\\gamma=\\beta$, and it is the only such transformation because at each $C$ the pair $(\\alpha_C,\\beta_C)$ determines $\\gamma_C$ uniquely by the universal property of the product of sets. So $P\\times Q$ with its projections is the product in $\\widehat{\\mathcal C}$: limits in a presheaf category are computed pointwise, inherited from $\\mathbf{Set}$. Finally the Yoneda lemma gives $\\mathrm{Nat}(\\mathbf yA,P\\times Q)\\cong(P\\times Q)(A)=PA\\times QA$."
      solution_sketch: "Define everything pointwise and check that each condition is the corresponding condition in $\\mathbf{Set}$ at every object: naturality of the pairing is the naturality squares of $\\alpha$ and $\\beta$ coordinatewise, and uniqueness is uniqueness of pairs. The final count is Yoneda applied verbatim, since $\\mathrm{Nat}(\\mathbf yA,-)$ is evaluation at $A$."
    anki_seeds:
      - front: "The presheaf category $\\widehat{\\mathcal C}$ is..."
        back: "$[\\mathcal C^{op},\\mathbf{Set}]$: functors $\\mathcal C^{op}\\to\\mathbf{Set}$ and natural transformations."
        type: basic
      - front: "Every presheaf is canonically a {{c1::colimit of representables}} (density / co-Yoneda)."
        back: "colimit of representables"
        type: cloze

  - id: toposes-glimpse
    name: A Glimpse of Toposes
    core: false
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: cartesian-closed-categories
        weight: 0.5
        key: true
      - id: presheaves-intro
        weight: 0.4
        key: true
      - id: initial-terminal-objects
        weight: 0.2
      - id: limits-colimits
        weight: 0.2
      - id: epi-mono-factorizations
        weight: 0.3             # R-59: subobjects as iso-classes of monos (its kp3) carry the classifier axiom — kp1 ex2 works with Sub(X) directly; kp2 uses Sub(B)≅P(B) in Set and G-sets
    knowledge_points:
      - id: kp1
        name: The definition of an elementary topos
        key_prerequisites: [cartesian-closed-categories]
        constraints: "Name all three axioms (finite limits, cartesian closure, a subobject classifier) and give $\\mathrm{true}\\colon 1\\to\\Omega$ with its classifying-pullback property; the representability reading must name $\\mathrm{Sub}$ as the functor represented and $\\mathrm{true}$ as the universal element."
        exemplars:
          - problem: "State the defining properties of an elementary topos, including the subobject classifier."
            answer: "Finitely complete, cartesian closed, with a subobject classifier $\\Omega$ ($\\mathrm{true}\\colon 1\\to\\Omega$ classifying monos by pullback)."
            solution_sketch: "An elementary topos is a category that (i) has all finite limits, (ii) is cartesian closed, and (iii) has a subobject classifier: an object $\\Omega$ with $\\mathrm{true}\\colon 1\\to\\Omega$ such that every monomorphism $S\\hookrightarrow X$ is the pullback of $\\mathrm{true}$ along a unique characteristic map $\\chi_S\\colon X\\to\\Omega$. Thus subobjects of $X$ correspond to maps $X\\to\\Omega$."
          - problem: "Express the subobject classifier axiom as representability of the subobject functor $\\mathrm{Sub}$."
            answer: "$\\Omega$ represents $\\mathrm{Sub}$: a natural isomorphism $\\mathrm{Sub}(X)\\cong\\mathrm{Hom}(X,\\Omega)$ with universal element $\\mathrm{true}\\colon 1\\to\\Omega$."
            solution_sketch: "The functor $\\mathrm{Sub}\\colon\\mathcal E^{op}\\to\\mathbf{Set}$ sends $X$ to its set of subobjects (monos into $X$ up to iso), with pullback as reindexing. A subobject classifier is a representing object $\\Omega$ with universal element $\\mathrm{true}\\colon 1\\to\\Omega$, i.e. a natural bijection $\\mathrm{Sub}(X)\\cong\\mathrm{Hom}(X,\\Omega)$ sending $S\\hookrightarrow X$ to its characteristic map $\\chi_S$, with $S$ recovered as the pullback of $\\mathrm{true}$ along $\\chi_S$. So a topos is a finitely complete, cartesian closed category in which $\\mathrm{Sub}$ is representable."
      - id: kp2
        name: Set and presheaf toposes
        key_prerequisites: [presheaves-intro]
        constraints: "Concrete toposes only: $\\mathbf{Set}$ (with $\\Omega=\\{\\top,\\bot\\}$) and presheaf categories, including $\\mathbf{Set}^{BG}$ for a group $G$; describe $\\Omega$ and the characteristic map explicitly, and note that the $G$-action on $\\Omega$ is trivial."
        exemplars:
          - problem: "In Set the subobject classifier is Omega = {top, bot} with true: 1 -> Omega sending the unique point to top. Take X = {p, q, r, s} and the subset S = {p, r, s}. Let chi_S : X -> Omega be the unique map whose pullback of true is S. How many elements of X does chi_S send to top?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Pullback condition: chi_S(x) = top exactly for the elements of S, because S must be the pullback of true along chi_S. The subset S = {p, r, s} has three elements, so chi_S sends p, r and s to top and q to bot. The answer is 3."
          - problem: "Let G = Z/2 act on X = {1, 2, 3} with the nontrivial element swapping 1 and 2 and fixing 3. In the topos Set^BG the subobjects of a G-set are exactly its G-invariant subsets. How many subobjects does X have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Orbit rule: a subset is G-invariant exactly when it is a union of orbits of the action. The orbits are {1, 2} and {3}, so the invariant subsets are the empty set, {3}, {1, 2} and all of X. The answer is 4."
          - problem: "Let C be the poset with elements a, b, c and order relations a <= c and b <= c, with a and b incomparable. In the presheaf topos on C, the value Omega(c) of the subobject classifier is the set of sieves on c, that is, the downward closed sets of elements below c. How many sieves on c are there?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Sieve rule: a sieve on c is a set of elements below c that contains with each element all smaller ones. The elements below c are a, b and c itself. The downward closed sets are: the empty set, {a}, {b}, {a, b} and {a, b, c}, since a set containing c must contain both a and b. The answer is 5."
          - problem: "In the topos Set^BG take G = Z/3 acting on X = {1, 2, 3, 4} by sending 1 to 2, 2 to 3, 3 to 1, and fixing 4. Let S = {4}, a G-invariant subset, and let chi_S : X -> Omega be its characteristic map into Omega = {0, 1} with the trivial G-action. Give the answer as (chi_S(2), chi_S(4))."
            answer: "(0, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Indicator rule: chi_S sends an element of S to 1 and every other element to 0. Here S = {4}, so chi_S(1) = chi_S(2) = chi_S(3) = 0 and chi_S(4) = 1. The map is equivariant because S is invariant and the action on Omega is trivial. The answer is (0, 1)."
          - problem: "Claim: for every group G, the topos Set^BG has subobject classifier Omega = {0, 1} with a G-action. Step 1: subobjects of a G-set X are exactly its G-invariant subsets. Step 2: to make every indicator map chi_S equivariant, G must act on Omega in the same nontrivial way it acts on X. Step 3: so for G = Z/2 the nontrivial element swaps 0 and 1 in Omega. Step 4: with true: 1 -> Omega picking 1, each invariant subset S is the pullback of true along chi_S. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: subobjects of a G-set are its G-invariant subsets. Step 2 is the first invalid step: equivariance of every indicator forces the action on Omega to be trivial, because the indicator of the empty subset is constantly 0 and the indicator of all of X is constantly 1. Step 3 is false for the same reason, since the action on Omega is trivial rather than a swap. Step 4 is correct once the action on Omega is taken trivial. The answer is Step 2."
          - problem: "Let C be the poset with elements a, b and one order relation a <= b. Let P be the presheaf with P(b) = {u, v}, P(a) = {w1, w2}, and restriction map P(b) -> P(a) sending u to w1 and v to w2. A subobject of P in the presheaf topos is a subfunctor: a choice of subsets at b and at a such that the restriction of the subset at b lands inside the subset at a. How many subfunctors does P have?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Subfunctor rule: choose Q(b) inside {u, v} and Q(a) inside {w1, w2} with the restriction of Q(b) inside Q(a). If Q(b) is empty, Q(a) is any of the 4 subsets: 4 choices. If Q(b) = {u}, then w1 must lie in Q(a): 2 choices; {v} likewise gives 2; {u, v} forces both w1 and w2: 1 choice. Total 4 + 2 + 2 + 1 = 9. The answer is 9."
          - problem: "Write the full proof: for a group G, the category Set^BG of left G-sets has subobject classifier Omega = {0, 1} carrying the trivial G-action, with true: 1 -> Omega sending the unique point to 1, and the characteristic map of a G-invariant subset S of a G-set X is its indicator. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (subobjects): a monomorphism of G-sets is an injective equivariant map, and its image is a G-invariant subset, so subobjects of a G-set X are exactly its G-invariant subsets S. Step 2 (the classifier): give Omega = {0, 1} the trivial G-action and let true: 1 -> Omega send the unique point to 1; both are equivariant because both actions are trivial. Step 3 (existence): for an invariant S let chi_S be its indicator; if x lies in S then gx lies in S, so chi_S(gx) = chi_S(x) = g chi_S(x), hence chi_S is equivariant and S is the pullback of true along chi_S. Step 4 (uniqueness): any map making the square a pullback must send exactly the elements of S to 1, so it equals chi_S. Conclusion: Omega = {0, 1} with trivial G-action classifies subobjects in Set^BG, so Set^BG is a topos."
    diagnostic_exemplar:
      problem: "In $\\mathbf{Set}$, verify that $\\Omega=\\{\\top,\\bot\\}$ with $\\mathrm{true}\\colon 1\\to\\Omega$, $*\\mapsto\\top$, is a subobject classifier: show that for every mono $m\\colon S\\hookrightarrow X$ there is exactly one $\\chi\\colon X\\to\\Omega$ making the square over $\\mathrm{true}$ a pullback. Then say what this makes of the functor $\\mathrm{Sub}$."
      answer: "Monos in $\\mathbf{Set}$ are the injections. Given $m\\colon S\\hookrightarrow X$ define $\\chi(x)=\\top$ if $x\\in m[S]$ and $\\chi(x)=\\bot$ otherwise. The square with sides $m$, $\\chi$, ${!}_S\\colon S\\to 1$ and $\\mathrm{true}$ commutes, since $\\chi(m(s))=\\top$ for all $s$. Pullback: suppose $g\\colon Y\\to X$ satisfies $\\chi\\circ g=\\mathrm{true}\\circ{!}_Y$, i.e. $g(y)\\in m[S]$ for every $y$. Because $m$ is injective each $g(y)$ has exactly one preimage, so $u(y):=m^{-1}(g(y))$ is a well-defined function $Y\\to S$ with $m\\circ u=g$, and it is the only such function (again by injectivity of $m$). So the square has the universal property of a pullback. Uniqueness of $\\chi$: if $\\chi'$ also makes the square a pullback, then pulling $\\mathrm{true}$ back along $\\chi'$ gives the inclusion of $\\chi'^{-1}(\\top)$, which must agree with $m$ as a subobject, forcing $\\chi'^{-1}(\\top)=m[S]$ and hence $\\chi'=\\chi$. Consequently $\\mathrm{Sub}(X)\\cong\\mathrm{Hom}(X,\\Omega)$, naturally in $X$ (pullback of a subobject along $f$ corresponds to pre-composition of $\\chi$ with $f$): $\\Omega$ represents the subobject functor $\\mathrm{Sub}$, with universal element $\\mathrm{true}$. Together with finite completeness and cartesian closure of $\\mathbf{Set}$, this makes $\\mathbf{Set}$ an elementary topos."
      solution_sketch: "Take $\\chi$ to be the indicator of the image of $m$. Injectivity of $m$ is what makes the preimage map $u(y)=m^{-1}(g(y))$ well defined and unique, which is the pullback property; uniqueness of $\\chi$ follows because pulling $\\mathrm{true}$ back along any classifying map recovers the same subset. The upshot is $\\mathrm{Sub}\\cong\\mathrm{Hom}(-,\\Omega)$."
    anki_seeds:
      - front: "An elementary topos is a category that is {{c1::finitely complete}}, {{c2::cartesian closed}}, and has a {{c3::subobject classifier $\\Omega$}}."
        back: "finitely complete; cartesian closed; subobject classifier $\\Omega$"
        type: cloze
      - front: "The subobject classifier of $\\mathbf{Set}$ is {{c1::$\\Omega=\\{\\top,\\bot\\}$}}."
        back: "$\\Omega=\\{\\top,\\bot\\}$"
        type: cloze
