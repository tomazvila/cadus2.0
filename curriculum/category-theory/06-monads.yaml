            solution_sketch: "The terminal object is 2 and products are minima; equalizers of parallel arrows are identities. The exponential a implies b is 2 when a<=b and b otherwise. A truth arrow forces Omega=2, but its pullbacks are identity subobjects, so proper subobjects cannot be classified. The result is 1, 1, 0, 2."
          - problem: "For a subobject classifier true:1->Omega in a topos, reconstruct the represented functor and its universal element. Bank: 1=Sub(-); 2=Hom(1,-); 3=the mono true:1->Omega; 4=1_Omega:Omega->Omega. Give the functor number and universal-element number."
            answer: "1, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Characteristic maps represent the contravariant subobject functor. Pulling back the universal subobject true recovers the represented subobject at every object. The result is 1, 3."
          - problem: "In Set a subobject classifier uses true:1->{0,1} selecting 1. A candidate representation of Sub sends S subset X to the indicator of its complement. Determine which representing conditions hold: each component is bijective; the family is natural under pullback; pulling back true along the assigned map recovers S; identity evaluation recovers true as the universal element. Give those four bits. Derive the characteristic-map pullback test rather than assuming an indicator convention."
            answer: "1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Complementing characteristic functions remains a natural bijection, but changes the universal subobject from true to false. The specified classifier consists of both Omega and its true map, so its classifying pullback and universal-element conditions must also be checked. The result is 1, 1, 0, 0."
          - problem: "A proposed elementary topos is the category of nonempty finite sets. A proof checks a terminal object and finite products, then claims the three topos axioms hold. Test separately: finite limits; cartesian closure; a subobject classifier. For the classifier, use that the singleton has exactly one subobject and a two-point set has three. Give the three validity bits, deriving the categorical obstructions rather than merely naming a missing empty set."
            answer: "0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Distinct constants obstruct finite equalizers. Nonempty function sets still provide exponentials. A classifier would have one point from Sub(1), contradicting the three subobjects of a two-point set, so both the finite-limit and classifier axioms fail. The result is 0, 1, 0."
          - problem: "Let C have finite limits and be cartesian closed. Suppose a candidate true:1->Omega has the property that every mono is a pullback of true along at least one map. Audit the proposed proof that this candidate supplies the remaining elementary-topos axiom. Step 1: pullback of true gives a natural function Hom_C(X,Omega)->Sub(X) for each X. Step 2: the assumed existence of classifying maps makes each function surjective. Step 3: this surjectivity makes the family a natural bijection, so Omega represents Sub with true as universal element. Step 4: the candidate is a subobject classifier and completes the elementary-topos structure. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Representation of Sub requires uniqueness as well as existence of each classifying map. In Set, choosing three truth values with one designated true value supplies all subobjects but gives two characteristic maps for the empty subobject of a singleton, refuting the proposed bijection. This is the first unsupported step."
          - problem: "Write the full proof: an elementary topos is a category with all finite limits, cartesian closure, and a subobject classifier, that is, an object Omega together with a map true: 1 -> Omega such that every monomorphism S -> X is the pullback of true along a unique characteristic map X -> Omega; equivalently, Omega represents the functor Sub with true as its universal element. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Definition, step by step. Step 1 (finite limits): the category has a terminal object 1, binary products, and equalizers; together these give all finite limits. Step 2 (cartesian closure): each object X gives a product functor, and it has a right adjoint sending Y to the exponential, so maps Z times Y into X correspond naturally to maps Z into the exponential. Step 3 (subobject classifier): there is an object Omega and a map true: 1 -> Omega such that for every monomorphism m: S -> X there is exactly one map chi: X -> Omega, the characteristic map, for which the square with m and true is a pullback. Step 4 (representability): the assignment X to Sub(X), with pullback as reindexing, is a functor Sub on the opposite category, and Step 3 says exactly that Omega represents Sub, with true: 1 -> Omega as the universal element, via the natural bijection Sub(X) matching Hom(X, Omega) that sends each subobject to its characteristic map and recovers it as the pullback of true. Hence a topos is a finitely complete, cartesian closed category in which the functor Sub is representable."
      - id: kp2
        name: Set and presheaf toposes
        key_prerequisites: [presheaves-intro]
        constraints: "Construct Set and G-set characteristic maps and presheaf sieve classifiers from their universal and equivariance conditions. Recover restrictions and true fibers; invariant subsets and sieves must be derived, not supplied as a counting formula."
        exemplars:
          - problem: "In Set, construct the characteristic map of S={p,r,s} inside X={p,q,r,s} from the classifying pullback. Encode bottom=0,top=1 and give its values on p,q,r,s."
            answer: "1, 0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The pullback of true must contain exactly the points of S, forcing this unique characteristic map. The result is 1, 0, 1, 1."
          - problem: "In the topos of Z/2-sets, test two proposed classifier actions on Omega={0,1}: trivial and swapping. In each case let true select 1. For X={a,b,c} with a,b swapped and c fixed, determine whether true is equivariant and whether every invariant subobject has an equivariant characteristic map whose true pullback is that subobject. Give the two bits for each action. Reconstruct the characteristic maps from the classifying property."
            answer: "1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The classifying pullback fixes each characteristic function, and its equivariance then tests the proposed Omega action. The true map itself must also be equivariant; only the trivial action satisfies both parts of the classifier construction. The result is 1, 1, 0, 0."
          - problem: "C has a<c and b<c with a,b incomparable. Construct Omega(c), the sieve classifier component, using closure under precomposition. Encode incoming arrows a->c,b->c,1_c by bits 1,2,4. Give the set of admissible sieve codes."
            answer: "{0, 1, 2, 3, 7}"
            answer_contract: {"kind": "set"}
            solution_sketch: "A sieve contains every precomposition of each of its arrows. Including 1_c therefore forces both incoming nonidentity arrows; the closure condition determines the component. The result is {0, 1, 2, 3, 7}."
          - problem: "In the topos Set^BG take G = Z/3 acting on X = {1, 2, 3, 4} by sending 1 to 2, 2 to 3, 3 to 1, and fixing 4. Let S = {4}, a G-invariant subset, and let chi_S : X -> Omega be its characteristic map into Omega = {0, 1} with the trivial G-action. Give the answer as (chi_S(2), chi_S(4))."
            answer: "(0, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Indicator rule: chi_S sends an element of S to 1 and every other element to 0. Here S = {4}, so chi_S(1) = chi_S(2) = chi_S(3) = 0 and chi_S(4) = 1. The map is equivariant because S is invariant and the action on Omega is trivial. The answer is (0, 1)."
          - problem: "For G=Z/2, Step 1: invariant subsets require equivariant characteristic maps. Step 2: the classifier Omega={0,1} must have the generator swapping 0 and 1. Step 3: choose true:1->Omega to select 1. Step 4: these data form a subobject classifier in G-sets. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The true map from the trivial one-point G-set must be equivariant. A swapping action has no fixed true point, so it cannot supply this classifier. This is the first unsupported step."
          - problem: "C has a->b. P(b)={u,v},P(a)={w1,w2},restriction u->w1,v->w2. A subpresheaf S has S(b)={u},S(a)={w1,w2}. Construct its sieve-valued characteristic map at b on u and v. Encode the empty sieve by 0, {a->b} by 1, and {a->b,1_b} by 3. Give the two codes."
            answer: "3, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The characteristic sieve contains an arrow into b exactly when restricting the selected element along it lands in S. This includes 1_b precisely for elements already in S(b). The result is 3, 1."
          - problem: "Write the full proof: for a group G, the category Set^BG of left G-sets has subobject classifier Omega = {0, 1} carrying the trivial G-action, with true: 1 -> Omega sending the unique point to 1, and the characteristic map of a G-invariant subset S of a G-set X is its indicator. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (subobjects): a monomorphism of G-sets is an injective equivariant map, and its image is a G-invariant subset, so subobjects of a G-set X are exactly its G-invariant subsets S. Step 2 (the classifier): give Omega = {0, 1} the trivial G-action and let true: 1 -> Omega send the unique point to 1; both are equivariant because both actions are trivial. Step 3 (existence): for an invariant S let chi_S be its indicator; if x lies in S then gx lies in S, so chi_S(gx) = chi_S(x) = g chi_S(x), hence chi_S is equivariant and S is the pullback of true along chi_S. Step 4 (uniqueness): any map making the square a pullback must send exactly the elements of S to 1, so it equals chi_S. Conclusion: Omega = {0, 1} with trivial G-action classifies subobjects in Set^BG, so Set^BG is a topos."
    diagnostic_exemplar:
      problem: "In $\\mathbf{Set}$, verify that $\\Omega=\\{\\top,\\bot\\}$ with $\\mathrm{true}\\colon 1\\to\\Omega$, $*\\mapsto\\top$, is a subobject classifier: show that for every mono $m\\colon S\\hookrightarrow X$ there is exactly one $\\chi\\colon X\\to\\Omega$ making the square over $\\mathrm{true}$ a pullback. Then say what this makes of the functor $\\mathrm{Sub}$."
      answer: "Monos in $\\mathbf{Set}$ are the injections. Given $m\\colon S\\hookrightarrow X$ define $\\chi(x)=\\top$ if $x\\in m[S]$ and $\\chi(x)=\\bot$ otherwise. The square with sides $m$, $\\chi$, ${!}_S\\colon S\\to 1$ and $\\mathrm{true}$ commutes, since $\\chi(m(s))=\\top$ for all $s$. Pullback: suppose $g\\colon Y\\to X$ satisfies $\\chi\\circ g=\\mathrm{true}\\circ{!}_Y$, i.e. $g(y)\\in m[S]$ for every $y$. Because $m$ is injective each $g(y)$ has exactly one preimage, so $u(y):=m^{-1}(g(y))$ is a well-defined function $Y\\to S$ with $m\\circ u=g$, and it is the only such function (again by injectivity of $m$). So the square has the universal property of a pullback. Uniqueness of $\\chi$: if $\\chi'$ also makes the square a pullback, then pulling $\\mathrm{true}$ back along $\\chi'$ gives the inclusion of $\\chi'^{-1}(\\top)$, which must agree with $m$ as a subobject, forcing $\\chi'^{-1}(\\top)=m[S]$ and hence $\\chi'=\\chi$. Consequently $\\mathrm{Sub}(X)\\cong\\mathrm{Hom}(X,\\Omega)$, naturally in $X$ (pullback of a subobject along $f$ corresponds to pre-composition of $\\chi$ with $f$): $\\Omega$ represents the subobject functor $\\mathrm{Sub}$, with universal element $\\mathrm{true}$. Together with finite completeness and cartesian closure of $\\mathbf{Set}$, this makes $\\mathbf{Set}$ an elementary topos."
      solution_sketch: "Take $\\chi$ to be the indicator of the image of $m$. Injectivity of $m$ is what makes the preimage map $u(y)=m^{-1}(g(y))$ well defined and unique, which is the pullback property; uniqueness of $\\chi$ follows because pulling $\\mathrm{true}$ back along any classifying map recovers the same subset. The upshot is $\\mathrm{Sub}\\cong\\mathrm{Hom}(-,\\Omega)$."
