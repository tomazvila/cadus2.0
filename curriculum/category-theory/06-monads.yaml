          - problem: "For the list monad on {0,1}, propose the structure map a(nonempty word) is its first entry, and a(empty)=0. Recover the nullary and binary operations from this map, then test the algebra unit and multiplication axioms (including empty inner words). Give the recovered unit, four binary-table entries in row-major order, the two algebra-law validity bits, and 1 if the induced structure is a group,0 otherwise."
            answer: "0, 0, 0, 1, 1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The list-algebra laws must first hold before its recovered binary operation can be identified as a monoid. The empty-word value supplies the unit; evaluating two-letter words supplies multiplication, and the algebra equation controls arbitrary bracketings and empty blocks. The result is 0, 0, 0, 1, 1, 1, 0, 0."
          - problem: "A candidate list-algebra on {0,1,2} sends a nonempty word to its first letter and the empty word to 0. Test the algebra equation at t=[[],[2]]. Construct both sides and give a(mu(t)),a(Ta(t)) in order."
            answer: "2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The algebra equation compares evaluating a flattened word with evaluating the list of its subword values. Their mismatch refutes the candidate. The result is 2, 0."
          - problem: "Step 1: a list-monad algebra yields x*y=a([x,y]) and e=a([]). Step 2: its two algebra laws imply associativity and a two-sided unit. Step 3: those laws force every element to have an inverse. Step 4: list-monad algebras are groups. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The two-element max monoid yields a valid list-algebra and its nonidentity element has no inverse. The recovered structure is a monoid. This is the first unsupported step."
          - problem: "Suppose a is an algebra for the list monad with a([])=1 and a([x,y])=xy modulo 5 on {1,2,3,4}. Recover a([4,4,3,2]) using the algebra law with two blocks [4,4] and [3,2]. Give the two block values followed by the full value."
            answer: "1, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The algebra associativity equation identifies evaluation of the word with evaluation of the two block values. This reconstructs longer evaluations from the induced binary product. The result is 1, 1, 1."
          - problem: "Write the full proof: the algebras for the list monad on $\\mathbf{Set}$ are exactly the monoids, and $\\mathbf{Set}^T \\simeq \\mathbf{Mon}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (algebra to monoid): given a structure map $a: A^* \\to A$, define $x \\cdot y = a([x,y])$ and $u = a([])$; the structure map sends a word to the iterated product of its letters. Step 2 (unit): apply the law to $t = [[],[x]]$: $a(\\mu(t)) = a([x]) = x$, while $a(Ta(t)) = a([a([]), a([x])]) = a([u,x]) = u \\cdot x$, so $u \\cdot x = x$; symmetrically $t = [[x],[]]$ gives $x \\cdot u = x$. Step 3 (associativity): apply the law to $t = [[x,y],[z]]$ to get $a([x,y,z]) = (x \\cdot y) \\cdot z$, and to $t = [[x],[y,z]]$ to get $a([x,y,z]) = x \\cdot (y \\cdot z)$; hence $(x \\cdot y) \\cdot z = x \\cdot (y \\cdot z)$. So every algebra is a monoid. Step 4 (monoid to algebra): conversely, a monoid defines $a$ as the product of the letters with $a([]) = u$; the unit law is immediate, and the law $a \\circ \\mu = a \\circ Ta$ holds because both sides multiply the letters of the flattened word, only in different groupings, and monoid multiplication is associative and unital. Step 5 (morphisms): a map $f$ with $f(a(w)) = a(f(w))$ preserves products and units, so algebra maps are monoid homomorphisms. Conclusion: the algebras for the list monad are exactly the monoids and $\\mathbf{Set}^T \\simeq \\mathbf{Mon}$."
