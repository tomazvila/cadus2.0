            answer: "4, 2, 5"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A monoid object has multiplication from its tensor square to itself and a unit from the tensor unit. In the endofunctor category these are natural transformations, and strict composition requires no extra associator or unitor. The answer is 4, 2, 5."
          - problem: "Write the full proof: a monad (T, mu, eta) on a category C is exactly a monoid object in the monoidal category ([C, C], ∘, 1_C), and no associator or unitor cells appear because composition of endofunctors is strict. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (monoidal structure): the endofunctor category [C, C] has the endofunctors of C as objects and the natural transformations as morphisms; the tensor of F and G is their composite F∘G, and the unit object is the identity functor 1_C. Step 2 (strictness): composition of functors is associative and unital on the nose, so (F∘G)∘H = F∘(G∘H) and 1_C∘F = F = F∘1_C hold exactly; the associator and unitor cells of a general monoidal category are identities here, so no such cells appear in any law. Step 3 (monoid object): a monoid object in this category is an endofunctor T with a multiplication mu: T∘T ⇒ T and a unit eta: 1_C ⇒ T. Step 4 (associativity law): the monoid associativity diagram, with the strict tensor, says the two whiskered composites mu∘Tmu and mu∘muT from T∘T∘T ⇒ T are equal, which is exactly the monad associativity law. Step 5 (unit laws): the monoid unit diagrams say mu∘etaT = 1_T = mu∘Teta, since the unitors are identities; these are exactly the monad unit laws. Step 6 (conclusion): the data and the laws coincide, so a monad on C is precisely a monoid in ([C, C], ∘, 1_C)."
