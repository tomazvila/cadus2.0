        name: The maybe monad
        key_prerequisites: [monads]
        constraints: "Construct maybe Kleisli composites and recover or test multiplication using both unit laws and associativity. Every relevant branch, including inner and outer stars, must be accounted for."
        exemplars:
          - problem: "For the maybe monad T(X)=X+{*}, f:{1,2}->T({5,6}) has values [5,6], and g:{5,6}->T({7}) has values [7,*]. Derive their Kleisli composite from the monad structure. Give one and two, its values at 1 and 2, using 9 for *."
            answer: "one = 7; two = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "one"}, {"contract": {"kind": "exact"}, "name": "two"}]}
            solution_sketch: "Kleisli composition in the maybe monad is $g\\circ_T f=\\mu\\circ Tg\\circ f$ with $T=(-)\\sqcup\\{*\\}$. Full composite first: at $1$, $f(1)=5\\in\\{5,6\\}$, then $Tg(5)=g(5)=7$, and $\\mu(7)=7$. At $2$, $f(2)=6$, then $Tg(6)=g(6)=*$, and $\\mu(*)=*$, so the branch of $f$ that lands in $B$ hits the star of $g$. The composite is one = 7; two = 9."
          - problem: "For the maybe monad, f:{2,3,4}->T({6,7}) has values [6,*,7], and g:{6,7}->T({5,8}) has values [5,*]. Construct the composite, including propagation of the star branch. Give one,two,three for inputs 2,3,4, using 10 for *."
            answer: "one = 5; two = 10; three = 10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "one"}, {"contract": {"kind": "exact"}, "name": "two"}, {"contract": {"kind": "exact"}, "name": "three"}]}
            solution_sketch: "Use $g\\circ_T f=\\mu\\circ Tg\\circ f$. Full composite first: at $2$, $f(2)=6$ and $Tg(6)=g(6)=5$, so the value is $5$. At $3$, $f(3)=*$; $Tg$ fixes this star and $\\mu(*)=*$, so the star input of $f$ propagates to $10$. At $4$, $f(4)=7$ and $Tg(7)=g(7)=*$, so $\\mu(*)=*$, giving $10$. The composite is one = 5; two = 10; three = 10."
          - problem: "For T(A)=A+{*} with inclusion eta, recover multiplication mu:TTA->TA from both unit laws at A={1,2}. Encode TTA by 1,2,3=inner star,4=outer star, and TA by 1,2,9=star. Give the value list of mu."
            answer: "1, 2, 9, 9"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two units place the star in different layers. Requiring both composites to be identities forces both layers to collapse to the same star. The result is 1, 2, 9, 9."
          - problem: "On T(A)=A+{*} for A={1}, inclusion eta is fixed. A candidate multiplication sends ordinary 1 to 1, inner star to 1, outer star to *. Derive both unit-law composites at the star. Use 9 for star and give first mu after T eta, then mu after eta T."
            answer: "9, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two whiskered units distinguish inner and outer stars. Their outputs expose which unit equation this candidate violates. The result is 9, 1."
          - problem: "For T(A)=A+{*} with the usual inclusion unit, a candidate multiplication maps ordinary points identically and the inner star to star, but the outer star to a fixed ordinary point a0. Derive both unit composites at an ordinary a and at star. Using 0=a,1=star,2=a0, give the outputs of mu after T eta on a,star, then mu after eta T on a,star, and the two unit-law validity bits. Assume a and a0 are distinct."
            answer: "0, 2, 0, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two whiskered units put star in different layers. Reconstructing those maps exposes the outer-star defect; one unit law fails while the other holds. The result is 0, 2, 0, 1, 0, 1."
          - problem: "For the maybe monad on A={1}, T^3A has one ordinary point and stars born at the three layers. Encode the point by 1 and every final star by 9. Verify associativity by constructing both legs; give their values on the inner, middle and outer stars, first mu after T mu then mu after mu T."
            answer: "9, 9, 9, 9, 9, 9"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Constructing both whiskered routes distinguishes all three failure layers. Each route sends each failure layer to the sole final star. The result is 9, 9, 9, 9, 9, 9."
          - problem: "Write the full proof: the maybe monad $(T,\\eta,\\mu)$ on Set with $TA=A\\sqcup\\{*\\}$, $\\eta_A$ the inclusion of $A$, and $\\mu_A$ collapsing the two star layers, satisfies both unit laws and the associativity law. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (functor): $T=(-)\\sqcup\\{*\\}$ is a functor; $Tg$ acts as $g$ on the $A$-part and fixes the star, and it preserves identities and composition since the star is fixed throughout. Step 2 (unit): $\\eta_A\\colon A\\to A\\sqcup\\{*\\}$ is the inclusion. Right unit law: for $a\\in A$, $\\eta_{TA}(a)$ places $a$ in the outer layer and $\\mu_A$ fixes $A$-elements, so $\\mu_A\\eta_{TA}(a)=a$. Left unit law: for any $x\\in TA$, $T\\eta_A(x)$ places $x$ in the inner layer; $\\mu_A$ fixes $A$-elements and collapses the inner star onto the outer star, so $\\mu_A T\\eta_A(x)=x$ for every $x$, including the star branch. Step 3 (associativity): $TTA$ carries two star layers; both $\\mu_A\\mu_{TA}$ and $\\mu_{TA}T\\mu_A$ send every $A$-element to itself and every star, however nested, to the single star of $TA$, so the two composites agree. Step 4 (conclusion): $(T,\\eta,\\mu)$ satisfies both unit laws and associativity, hence is a monad. See the solution."
      - id: kp2
        name: The list monad
        key_prerequisites: [functor-examples]
        constraints: "Construct list Kleisli substitution and compare the actual law routes, including empty words and a defective multiplication. Grade complete lists or intermediate structures instead of isolated flattening counts."
        exemplars:
          - problem: "For list T, singleton eta and concatenation mu, derive both unit-law composites on w=[2,3,1]. Give the two intermediate outer lengths, first T eta then eta T, followed by the final output list common to both routes."
            answer: "3, 1, 2, 3, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two units form a list of singletons and a singleton list of the word. Concatenation returns the original word along both paths. The result is 3, 1, 2, 3, 1."
          - problem: "For the list monad, f:{1}->{b,c}* has f(1)=[c,b], and g sends c to [y],b to [x,y]. Derive the Kleisli composite from the list monad structure. Encode x=1,y=2 and give its output list at 1."
            answer: "2, 1, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object is $\\mu_A(Tg(f(1)))$, since $g \\circ_T f = \\mu \\circ Tg \\circ f$. Step 1: apply $f$, giving $f(1) = [c, b]$. Step 2: apply $Tg$ entrywise, giving $[g(c), g(b)] = [[y], [x, y]]$. Step 3: flatten with $\\mu$ by concatenation: $[y]$ followed by $[x, y]$ gives $[y, x, y]$. The list monad method, entrywise application of $g$ followed by flattening by concatenation, is used in Steps 2 and 3. Encoding $y, x, y$ with $x = 1$ and $y = 2$ gives the codes 2, 1, 2. The answer is 2, 1, 2."
          - problem: "For list T with concatenation mu, verify associativity on L=[[[1,2],[]],[[2]]]. Give the outer lengths of T mu(L),mu T(L), followed by the final common output list."
            answer: "2, 3, 1, 2, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Flattening within outer entries differs from flattening the outer list. Flatten once more and compare the full ordered outputs, including the empty word. The result is 2, 3, 1, 2, 2."
          - problem: "For list T, f(1)=[r,s,r], g(r)=[n],g(s)=[m,m]. Construct the intermediate T(g)(f(1)) and the Kleisli output. Encode m=1,n=2. Give the lengths of the three intermediate words, followed by the final output list."
            answer: "1, 2, 1, 2, 1, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Functor action substitutes an output word for each input letter. Monad multiplication concatenates those words in their original order. The result is 1, 2, 1, 2, 1, 1, 2."
          - problem: "A list-monad candidate retains singleton eta but replaces concatenation by concatenation in reverse outer order. Derive the two unit composites on [1,2]. Give their complete output lists, first mu after T eta then mu after eta T."
            answer: "2, 1, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The family of singletons reverses the word under this candidate, while a singleton family does not. Thus the two unit requirements expose the defect. The result is 2, 1, 1, 2."
          - problem: "For list T, reconstruct the whiskered maps T mu and mu T on L=[[[1],[2]],[[3]]]. Encode a list of lists by the lengths of its successive members. Give the encoding for T mu(L), followed by the encoding for mu T(L)."
            answer: "2, 1, 1, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Left whiskering acts on each outer entry; right whiskering applies multiplication at the object TA. Their shapes differ before the final multiplication. The result is 2, 1, 1, 1, 1."
          - problem: "Write the full proof: for the list monad, where $TA = A^*$ is the set of words over $A$, $\\eta_A(a) = [a]$, and $\\mu_A$ concatenates a list of words, the unit laws $\\mu \\circ T\\eta = 1$ and $\\mu \\circ \\eta T = 1$ and the associativity law $\\mu \\circ T\\mu = \\mu \\circ \\mu T$ all hold. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: an element of $TTA$ is a list of words, $\\mu_A$ concatenates those words in order, and $T$ applies any function entrywise. Step 1, right unit: for a word $w = [a_1, \\dots, a_n]$, entrywise application gives $T\\eta_A(w) = [[a_1], \\dots, [a_n]]$, and concatenating the singletons returns $w$; hence $\\mu \\circ T\\eta = 1_{TA}$. Step 2, left unit: the component wraps the whole word, $\\eta_{TA}(w) = [w]$, and $\\mu_A([w]) = w$; hence $\\mu \\circ \\eta T = 1_{TA}$. Step 3, associativity: for $L$ a list of lists of words, $\\mu_A(T\\mu_A(L))$ first flattens each inner block and then concatenates, while $\\mu_A(\\mu_{TA}(L))$ first concatenates block by block and then concatenates the results; both read out every innermost letter in the same left-to-right order because concatenation of words is associative, so $\\mu \\circ T\\mu = \\mu \\circ \\mu T$. Conclusion: both unit laws and associativity hold, so $(T, \\eta, \\mu)$ is a monad."
      - id: kp3
        name: The writer monad over a monoid
        key_prerequisites: [monads]
        constraints: "Derive writer laws as monoid equations, recover missing unit data, and construct Kleisli composites from log-first pairs. Verify both whiskering orders and diagnose defective operations."
        exemplars:
          - problem: "For the writer functor T(A)=N x A with additive logs, eta(a)=(e,a),mu(m,(n,a))=(m+n,a). Reconstruct both unit equations to find e. Then give the outputs of their log coordinates on input (4,a), first mu after T eta then mu after eta T. Return e,left,right."
            answer: "0, 4, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two units insert the monoid identity in opposite log positions. Both equations force e=0 and preserve the log. The result is 0, 4, 4."
          - problem: "The writer monad is built from (N,+,0), with log-first pairs. Kleisli arrows have f(1)=(3,2),g(2)=(5,7). Construct their composite from the writer structure and give its value at 1 as (log,output)."
            answer: "(8, 7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Use the definition of the composite: $g \\circ_T f = \\mu \\circ T g \\circ f$. First apply $f$: $f(1) = (3, 2)$. Then apply $T g$: $T g(3, 2) = (3, g(2)) = (3, (5, 7))$. Then flatten with $\\mu$: $\\mu(3, (5, 7)) = (3 + 5, 7)$, and addition is the monoid operation. The answer is (8, 7)."
          - problem: "For the writer monad of a monoid M, with log-first pairs, derive the associativity law on (m,(n,(p,a))). Match the log expressions of mu after T mu and mu after mu T to bank 1=(m*n)*p; 2=m*(n*p); 3=(n*m)*p. Give their numbers in that order."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two whiskered composites reproduce the two parenthesizations of monoid multiplication. The monoid associativity axiom equates them. The result is 2, 1."
          - problem: "For T(A)=N x A, keep eta(a)=(0,a) but propose muprime(m,(n,a))=(n,a). Derive the unit composite muprime after T eta. Find the smallest nonnegative log m for which it differs from the input (m,a)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the full expression: $T\\eta(m, a) = (m, (0, a))$. The student's rule drops the first component, so $\\mu'(T\\eta(m, a)) = (0, a)$. This equals $(m, a)$ exactly when $m = 0$, because $0$ is the identity of $(\\mathbb N, +, 0)$ and no other $m$ is. The first failure is therefore at the next value. The answer is 1."
          - problem: "A writer candidate uses integer logs, addition for multiplication, and eta with constant log 1. Its pair convention is log-first. Derive both whiskered unit composites and the associativity composites. Test unit inputs with logs 0,2 and a triple with logs 1,2,3. Give the four unit-output logs (T eta route first for each input), then the two associative outputs, then validity bits for the two unit laws and associativity."
            answer: "1, 1, 3, 3, 6, 6, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Derive the two placements of the unit log from left and right whiskering. Their failure does not imply associativity fails: the two triple-log composites still agree by associativity of addition. The result is 1, 1, 3, 3, 6, 6, 0, 0, 1."
          - problem: "For T(A)=N x A with log-first pairs, keep mu(m,(n,a))=(m*n,a) using integer multiplication and let eta(a)=(e,a). Recover e from both unit laws. Give e, then the two unit-composite logs at input (6,a)."
            answer: "1, 6, 6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The writer unit must be the identity for the chosen monoid multiplication. Both law routes therefore insert 1 and retain the original log. The result is 1, 6, 6."
          - problem: "Write the full proof: let $(M, \\cdot, e)$ be a monoid; show that the writer functor $TA = M \\times A$ with $\\eta_A(a) = (e, a)$ and $\\mu_A(m, (m', a)) = (m \\cdot m', a)$ is a monad, tracing each monad law back to the corresponding monoid law. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (functor): $Tf(m, a) = (m, f(a))$ preserves identities and composition, so $T$ is a functor. Step 2 (left unit): $\\mu_A(\\eta_{TA}(m, a)) = \\mu_A(e, (m, a)) = (e \\cdot m, a) = (m, a)$ by the left identity law of the monoid. Step 3 (right unit): $\\mu_A(T\\eta_A(m, a)) = \\mu_A(m, (e, a)) = (m \\cdot e, a) = (m, a)$ by the right identity law of the monoid. Step 4 (associativity): both $\\mu \\circ T\\mu$ and $\\mu \\circ \\mu T$ send $(m, (m', (m'', a)))$ to $((m \\cdot m') \\cdot m'', a)$ and $(m \\cdot (m' \\cdot m''), a)$, which are equal by associativity in $M$. Step 5 (conclusion): all three monad laws hold, each reduced to the matching monoid law, so $(T, \\eta, \\mu)$ is a monad."
    diagnostic_exemplar:
      problem: "Work in the writer monad $TA=M\\times A$ over the monoid $M=(\\mathbb N,+,0)$, with $\\eta_A(a)=(0,a)$ and $\\mu_A(m,(m',a))=(m+m',a)$. Let $f(u)=(2,v)$, $g(v)=(3,w)$ and $h(w)=(4,z)$ be Kleisli arrows. Compute $h\\circ_T(g\\circ_T f)$ and $(h\\circ_T g)\\circ_T f$ at $u$, and say whether they agree."
      answer: "Kleisli composition is $g\\circ_T f=\\mu\\circ Tg\\circ f$. First route: $f(u)=(2,v)$, $Tg(2,v)=(2,(3,w))$, $\\mu=(2+3,w)=(5,w)$, so $(g\\circ_T f)(u)=(5,w)$; then $Th(5,w)=(5,(4,z))$ and $\\mu=(5+4,z)=(9,z)$, so $\\big(h\\circ_T(g\\circ_T f)\\big)(u)=(9,z)$. Second route: $Th(g(v))=Th(3,w)=(3,(4,z))$ and $\\mu=(7,z)$, so $(h\\circ_T g)(v)=(7,z)$; then $T(h\\circ_T g)(f(u))=T(h\\circ_T g)(2,v)=(2,(7,z))$ and $\\mu=(2+7,z)=(9,z)$. Both give $(9,z)$ — they agree, as the associativity of Kleisli composition (inherited from the monad associativity law, here from associativity of $+$) requires."
      solution_sketch: "Apply $g\\circ_T f=\\mu\\circ Tg\\circ f$ literally: $T$ leaves the accumulated $\\mathbb N$-tag alone and $\\mu$ adds the two tags. Both bracketings therefore accumulate $2+3+4$, and associativity of $+$ in the monoid is exactly what makes them agree."
    anki_seeds:
      - front: "The maybe monad on $\\mathbf{Set}$: underlying functor $TA$?"
