        back: "$A^*$ (finite lists over $A$)."
        type: basic
      - front: "The writer monad over a monoid $M$: underlying functor $TA$?"
        back: "$M\\times A$ (a value paired with an accumulated $M$-output)."
        type: basic
      - front: "The list monad's multiplication is {{c1::flatten (concatenation)}}."
        back: "flatten (concatenation)"
        type: cloze

  - id: kleisli-categories
    name: Kleisli Categories
    core: false
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: monads
        weight: 0.6
        key: true
      - id: functor-categories
        weight: 0.2
      - id: category-definition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The Kleisli construction
        key_prerequisites: [monads]
        constraints: "Recover Kleisli hom-sets, unit identities and composites from the monad. In the powerset case construct the relation correspondence and its composition; do not give the hom-condition or composition formula before asking only for a count."
        exemplars:
          - problem: "Let T be the maybe monad on Set. Construct the hom-set from A={1} to B={u,v} in its Kleisli category and determine its cardinality. The Kleisli hom-set formula is not supplied."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Hom-set rule: the Kleisli hom from A to B is the hom C(A, T(B)) of the base category, so a morphism from A to B is a function from A to the set T(B). Full target: T(B) = {u, v, z}, which has 3 elements. Count functions: the domain A = {1} has one element, so each element of T(B) gives exactly one function. The answer is 3."
          - problem: "For the powerset monad, construct the identification of Kleisli maps with relations. Let f(1)={4,5},f(2)={4},g(4)={7},g(5)={8}. Compute the composite as a relation. Encode pairs (1,7),(1,8),(2,7),(2,8) by 1,2,3,4 and give the set of pair codes."
            answer: "{1, 2, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "A powerset-valued map specifies membership in a relation. Kleisli multiplication supplies the existential intermediate witness in relational composition. The result is {1, 2, 3}."
          - problem: "For the maybe monad with extra point 9, f:{1,2}->T({3,4}) has values [3,4], and g:{3,4}->T({5,6}) has values [5,9]. Construct the Kleisli composite from the category definition. Give c1,c2, its values at 1,2."
            answer: "c1 = 5; c2 = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "c1"}, {"contract": {"kind": "exact"}, "name": "c2"}]}
            solution_sketch: "Full composite: $g \\circ_T f = \\mu \\circ Tg \\circ f$, so evaluate f first, then g, then flatten with $\\mu$. At 1: f(1) = 3, then g(3) = 5, an element of T(C), and $\\mu$ fixes every element of T(C), so the value is 5. At 2: f(2) = 4, then g(4) = 9, the extra point of T(C), and $\\mu$ returns it, so the value is 9. The answer is c1 = 5; c2 = 9."
          - problem: "For the powerset monad, f(1)={3,4},f(2)={4},g(3)={5,6,7},g(4)={8,9,10}. Construct their Kleisli composite from the monad structure. Give the number of outputs related to 1 under the associated relation."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full composite: $g \\circ_T f = \\mu \\circ Pg \\circ f$, with $\\mu$ the union of a set of subsets. Step f: f(1) = {3,4}. Step Pg: Pg applied to {3,4} gives the set of subsets {g(3), g(4)} = {{5,6,7}, {8,9,10}}. Step $\\mu$: the union is {5,6,7,8,9,10}. Count the elements: 6. The answer is 6."
          - problem: "For the powerset endofunctor on A={0,1}, use singleton insertion and union multiplication to construct Kleisli composition. Determine the identity by testing both identity laws against every powerset-valued map A->P(A). Encode subsets by 0=empty,1={0},2={1},3=A. Give the two values of the unique identity, then the number of endomorphisms satisfying only the left identity law and only the right identity law."
            answer: "1, 2, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Derive the Kleisli composition by applying powerset to the second arrow and then union. Both identity equations force the singleton map; being an arbitrary endomorphism is insufficient. The result is 1, 2, 1, 1."
          - problem: "On the inclusion-ordered subsets of {1,2,3}, T(X)=X union {1} defines a monad. Construct the hom-condition in its Kleisli category. For A={2}, determine how many subsets B admit a Kleisli arrow A->B."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Hom-set rule: in the Kleisli category of the monad t, a morphism from A to B is an element of the hom C(A, t(B)), which in a poset is the assertion A contained in t(B). Compute t: t(B) is B with 1 added. Condition: {2} is contained in t(B) exactly when 2 belongs to B. Count the subsets of {1,2,3} that contain 2: {2}, {1,2}, {2,3}, {1,2,3}. The answer is 4."
          - problem: "Write the full proof: for the power-set monad P on Set, a Kleisli morphism from A to B is exactly a relation from A to B, the Kleisli identity on A is the diagonal relation, and Kleisli composition is relational composition. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects and hom-sets): by the Kleisli construction, the objects are sets and a morphism from A to B is a function f: A -> P(B). Step 2 (relations): given f, define a R b iff b is in f(a); given a relation R, define f(a) as the set of b with a R b. These two constructions are mutually inverse, so Kleisli maps are exactly relations. Step 3 (identity): the unit sends a to {a}, which is the diagonal relation, the identity relation on A. Step 4 (composition): for f: A -> P(B) and g: B -> P(C), the composite is the composite of Pg and f with the multiplication, and it sends a to the union of the sets g(b) over all b in f(a), that is the set of c for which some b satisfies a R b and b S c, which is exactly relational composition. Step 5 (conclusion): the bijection of Step 2 preserves identities and composition on both sides, so it is an isomorphism of categories between the Kleisli category and Rel."
      - id: kp2
        name: The Kleisli laws come from the monad laws
        key_prerequisites: [monads]
        constraints: "Prove Kleisli identity, composition and associativity laws by explicit definition substitution, functoriality, naturality and monad equations. Grade typed expressions or arrow paths, with no concrete element computations."
        exemplars:
          - problem: "For an arbitrary monad and f:A->TB, expand f o_T eta_A and apply eta naturality at f exactly once. Select the resulting unreduced arrow from the parallel-expression bank: 1=mu_B after T(eta_B) after f; 2=mu_B after eta_TB after f; 3=f; 4=mu_B after eta_TB after mu_B after eta_TB after f. Then select the unit equation that cancels its adjacent transformation pair: 1=mu_B after eta_TB=1_TB; 2=mu_B after T(eta_B)=1_TB. Give the expression number and law number. Each bank expression has domain A and codomain TB."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Expanding the Kleisli definition leaves eta_A next to T(f). Its naturality moves f across eta and produces eta_TB; the corresponding whiskered unit equation, rather than typing, determines the final cancellation. The result is 2, 1."
          - problem: "For an arbitrary monad and Kleisli arrows f:A->TB, g:B->TC, h:C->TD, audit this proof of associativity. Step 1: h o_T (g o_T f)=mu_D after T(h) after mu_C after T(g) after f. Step 2: naturality of mu at h rewrites this as mu_D after mu_TD after TT(h) after T(g) after f. Step 3: the monad associativity law rewrites it as mu_D after T(mu_D) after TT(h) after T(g) after f. Step 4: functoriality of T identifies this with (h o_T g) o_T f. Which step is the first whose assertion or stated reason fails?"
            answer: "All valid"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The middle interchange is naturality of multiplication at h, whose codomain is TD. Monad associativity changes the two multiplication components; functoriality then repackages the result as the other Kleisli bracketing. All four steps are justified."
          - problem: "For an arbitrary monad and f:A->TB, audit the right-identity derivation f o_T eta_A=f. Step 1: expansion gives mu_B after T(f) after eta_A. Step 2: naturality of eta at f gives mu_B after eta_TB after f. Step 3: the adjacent pair is deleted by the monad equation mu_B after T(eta_B)=1_TB. Step 4: the remaining arrow is f. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Naturality of eta at a Kleisli arrow inserts eta at TB. The required cancellation is mu_B after eta_TB=1_TB; the other unit equation has T(eta_B), so it does not justify this rewrite. This is the first unsupported step."
          - problem: "In the associativity proof for f:A->TB,g:B->TC,h:C->TD, start with the expansion of h o_T (g o_T f). First apply mu naturality at h, then the monad associativity equation. Select the two successive unreduced expressions from this bank of parallel arrows A->TD: 1=mu_D after T(mu_D) after TT(h) after T(g) after f; 2=mu_D after T(h) after mu_C after T(g) after f; 3=mu_D after mu_TD after TT(h) after T(g) after f; 4=mu_D after T(mu_D) after T(mu_TD) after TTT(h) after TT(g) after T(f) after eta_A. Give the two expression numbers in order."
            answer: "3, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality of mu exchanges T(h) with the preceding multiplication and produces mu_TD. Monad associativity then replaces mu_D after mu_TD by mu_D after T(mu_D), supplying the essential associativity chase. The result is 3, 1."
          - problem: "In eta_B composed in Kleisli with f:A->TB, derive the adjacent transformation pair removed after expansion. Bank: 1=eta_TB; 2=T(eta_B); 3=mu_B; 4=mu_TB. Give the two numbers in traversal order and the exponent of T in their common source-target after composition."
            answer: "2, 3, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The definition of Kleisli composition applies T to eta_B. Its composition with mu_B is the identity on TB by one monad unit equation. The result is 2, 3, 1."
          - problem: "For an algebraic proof of the right Kleisli identity, write eta_B composed in Kleisli with f:A->TB using bank 1=f; 2=mu_B; 3=T(eta_B); 4=eta_TB. Give the expanded path in traversal order, followed by the surviving arrow number after the unit equation."
            answer: "1, 3, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Substitute the Kleisli definition and remove mu_B after T(eta_B) using its monad unit equation. The remaining morphism is f. The result is 1, 3, 2, 1."
          - problem: "Write the full proof: for a monad (T, eta, mu) on a category C whose Kleisli composite is g o_T f = mu_C o T g o f, the operation o_T is associative. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Take f: A to T B, g: B to T C and h: C to T D. Step 1, definition of o_T: (h o_T g) o_T f = mu_D o T(h o_T g) o f. Step 2, definition of o_T on the inner pair plus functoriality of T: h o_T g = mu_D o T h o g, so (h o_T g) o_T f = mu_D o T mu_D o T T h o T g o f. Step 3, definition of o_T on the other grouping: h o_T (g o_T f) = mu_D o T h o mu_C o T g o f. Step 4, monad associativity law mu o T mu = mu o mu T: mu_D o T mu_D = mu_D o mu_{T D}, so the left side becomes mu_D o mu_{T D} o T T h o T g o f. Step 5, naturality square of mu at h: mu_{T D} o T T h = T h o mu_C. Substituting gives mu_D o T h o mu_C o T g o f, exactly the expression of Step 3. Hence (h o_T g) o_T f = h o_T (g o_T f), so o_T is associative. Every step cited the definition of o_T, the functoriality of T, the monad associativity law, or the naturality square of mu by name, and no elements were used."
    diagnostic_exemplar:
      problem: "Let $T$ be a monad on $\\mathcal C$ and $\\mathcal C_T$ its Kleisli category, with $\\mathcal C_T(A,B)=\\mathcal C(A,TB)$, identities $\\eta_A$ and composition $g\\circ_T f=\\mu_C\\circ Tg\\circ f$. Prove that $\\eta$ is a two-sided identity for $\\circ_T$: for every $f\\colon A\\to TB$, $\\eta_B\\circ_T f=f$ and $f\\circ_T\\eta_A=f$. Name the monad law or naturality square used at each step."
      answer: "Right identity for $\\eta_B$: $\\eta_B\\circ_T f=\\mu_B\\circ T(\\eta_B)\\circ f=(\\mu\\circ T\\eta)_B\\circ f=1_{TB}\\circ f=f$, using the monad unit law $\\mu\\circ T\\eta=1_T$ at $B$. Left identity for $\\eta_A$: $f\\circ_T\\eta_A=\\mu_B\\circ Tf\\circ\\eta_A$. Naturality of $\\eta\\colon 1\\Rightarrow T$ at the morphism $f\\colon A\\to TB$ gives $Tf\\circ\\eta_A=\\eta_{TB}\\circ f$, so this equals $\\mu_B\\circ\\eta_{TB}\\circ f=(\\mu\\circ\\eta T)_B\\circ f=1_{TB}\\circ f=f$, using the other monad unit law $\\mu\\circ\\eta T=1_T$ at $B$. So $\\eta_A$ is a two-sided identity at $A$ in $\\mathcal C_T$."
      solution_sketch: "Two different laws do the two sides. $\\eta_B\\circ_T f$ unfolds straight to $(\\mu\\circ T\\eta)_B\\circ f$, one unit law. The other side, $f\\circ_T\\eta_A$, first needs naturality of $\\eta$ at $f$ to move $\\eta$ past $Tf$, and only then the second unit law $\\mu\\circ\\eta T=1_T$."
    anki_seeds:
      - front: "In the Kleisli category $\\mathcal C_T$, what is a morphism $A\\to B$?"
        back: "a $\\mathcal C$-morphism $A\\to TB$."
        type: basic
      - front: "What is the identity on $A$ in the Kleisli category $\\mathcal C_T$?"
        back: "the monad unit $\\eta_A\\colon A\\to TA$."
        type: basic
      - front: "Kleisli composition of $f\\colon A\\to TB$, $g\\colon B\\to TC$ is {{c1::$\\mu_C\\circ Tg\\circ f$}}."
        back: "$\\mu_C\\circ Tg\\circ f$"
        type: cloze

