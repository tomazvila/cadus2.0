            solution_sketch: "Functorial action maps each family to its union, while multiplication at P(A) takes the union of the families themselves. The result is 1, 2."
          - problem: "Write the full proof: the power-set monad $P$ on Set, with $\\eta_A(a) = \\{a\\}$ and $\\mu_A(\\mathcal{S}) = \\bigcup \\mathcal{S}$, satisfies the unit law $\\mu \\circ \\eta P = 1_P$, the unit law $\\mu \\circ P\\eta = 1_P$ and the associativity law $\\mu \\circ P\\mu = \\mu \\circ \\mu P$, by evaluating both legs on a general element of $PA$, $P^2(A)$ or $P^3(A)$ and comparing the resulting unions. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Unit law 1: take a general $S$ in $PA$. Step: $\\eta_{PA}(S) = \\{S\\}$ and $\\mu_A(\\{S\\}) = \\bigcup \\{S\\} = S$, so $\\mu \\circ \\eta P = 1_P$. Unit law 2: take a general $S$ in $PA$. Step: $(P\\eta)_A(S) = \\{\\{a\\} : a \\in S\\}$ and $\\mu_A$ unions these singletons back to $S$, so $\\mu \\circ P\\eta = 1_P$. Associativity: take a general $\\mathcal{U}$ in $P^3(A)$. Step: the leg $\\mu \\circ P\\mu$ replaces each member family $\\mathcal{S}$ of $\\mathcal{U}$ by $\\bigcup \\mathcal{S}$ and then unions, giving the set of all $a$ with $a \\in S \\in \\mathcal{S} \\in \\mathcal{U}$ for some $S$ and $\\mathcal{S}$. The leg $\\mu \\circ \\mu P$ first unions the members of $\\mathcal{U}$ and then unions again, giving the same set of elements of $A$. Both legs agree, so the associativity law holds. Conclusion: all three laws hold, so $(P, \\eta, \\mu)$ is a monad."
