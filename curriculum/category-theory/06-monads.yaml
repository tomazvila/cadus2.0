    knowledge_points:
      - id: kp1
        name: Eilenberg-Moore algebras
        key_prerequisites: [monads]
        try_first:
          problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{0,1\}$. How many maps $a\colon TA\to A$ satisfy the unit law $a\circ\eta_A=1_A$?'
          answer_contract: {"kind":"exact"}
          answer: '2'
          reveal: 'The unit law fixes $a(0)=0$ and $a(1)=1$, so only the value $a(*)$ is free, and it has 2 choices. An algebra of the maybe monad is therefore a set with one chosen point.'
        step_check:
          step: 'The unit $\eta_A\colon A\to A+1$ is the inclusion'
          question: 'Why does the unit law force $a(i)=i$ for every $i$ in $A$?'
          options:
            - 'Because $a$ is a bijection from $TA$ onto $A$, so it must fix every single point of $A$'
            - 'Because $\eta_A$ is the inclusion, $a\circ\eta_A$ is $a$ on $A$ and must be $1_A$'
            - 'Because $\mu_A$ merges the two added points, so each point of $A$ goes to itself'
            - 'Because the added point $*$ goes to $a(*)=2$, so all the other points must stay fixed'
          answer: 'Because $\eta_A$ is the inclusion, $a\circ\eta_A$ is $a$ on $A$ and must be $1_A$'
          why: 'Since $\eta_A$ is the inclusion of $A$ into $TA$, the composite $a\circ\eta_A$ is the restriction of $a$ to $A$. The unit law says this restriction is the identity.'
        constraints: "State the two laws $a\\circ\\eta_A=1_A$ and $a\\circ\\mu_A=a\\circ Ta$ and the morphism condition $f\\circ a=b\\circ Tf$ before any identification; the concrete monad is the maybe monad on $\\mathbf{Set}$, whose algebras are read off as pointed sets."
        exemplars:
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{1,3,9\}$. How many maps $a\colon TA\to A$ make $(A,a)$ a $T$-algebra?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The unit law $a\circ\eta_A=1_A$ forces $a(x)=x$ for $x=1,3,9$. Only the value $a(*)$ is free, and the associativity law holds for every choice of it. So there are 3 algebras, one for each possible value of $a(*)$.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{1,2,3\}$ and define $a\colon TA\to A$ by $a(1)=2$, $a(2)=2$, $a(3)=3$ and $a(*)=1$. Is $(A,a)$ a $T$-algebra?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","it is an algebra","yes it is","it is a T-algebra","yes it is a T-algebra"],["no","it is not","it is not an algebra","no it is not","not an algebra","it is not a T-algebra","not a T-algebra","no it is not a T-algebra"]]}
            solution_sketch: 'The unit law needs $a(1)=1$, but here $a(1)=2$. So $a\circ\eta_A\neq 1_A$ and the unit law fails, which settles the question.'
          - problem: 'A form field holds one of the sizes XS, S, M, L, or it is empty. A clean-up rule replaces the content of every field by a size and leaves every filled field unchanged. Such a rule is a $T$-algebra for the maybe monad with $A=\{\mathrm{XS},\mathrm{S},\mathrm{M},\mathrm{L}\}$. How many clean-up rules are there?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A filled field keeps its size, so the only choice is the size that replaces an empty field. There are 4 sizes, so there are 4 rules.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{1,2,3\}$. How many maps $a\colon TA\to A$ satisfy the associativity law $a\circ\mu_A=a\circ Ta$, whether or not they satisfy the unit law?'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Write $h$ for the restriction of $a$ to $A$ and $p=a(*)$. The law says $h(h(x))=h(x)$ for every $x$ in $A$, and $h(p)=p$. Counting the idempotent maps $h$ on three points together with the fixed points that $p$ may take gives $3+12+3=18$ maps.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{4,5\}$, $B=\{6,9\}$ and $f\colon A\to B$ with $f(4)=9$ and $f(5)=6$. For how many pairs $(a,b)$ of $T$-algebra structures $a\colon TA\to A$ and $b\colon TB\to B$ is $f$ a morphism of $T$-algebras $(A,a)\to(B,b)$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each algebra is fixed by the value at $*$, so $a(*)\in\{4,5\}$ and $b(*)\in\{6,9\}$. The morphism law at $*$ reads $f(a(*))=b(*)$, which fixes $b(*)$ once $a(*)$ is chosen. So there are 2 pairs, with $(a(*),b(*))$ equal to $(4,9)$ or $(5,6)$.'
          - problem: 'Shirt sizes S, M, L form a pointed set with default size M, and colours R, G, B form a pointed set with default colour G. These are $T$-algebras for the maybe monad. A rule from sizes to colours must send the default size to the default colour. How many such rules are there?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A rule is a morphism of $T$-algebras, so it must send the basepoint M to the basepoint G. The other two sizes, S and L, can each go to any of the 3 colours, which gives $3\times 3=9$ rules.'
          - problem: 'Let $A=\{1,2,3\}$ with $a(*)=2$ and $B=\{5,7\}$ with $b(*)=7$ be $T$-algebras for the maybe monad. Sam defines $f\colon A\to B$ by $f(1)=5$, $f(2)=5$, $f(3)=7$ and says that $f$ is a morphism of $T$-algebras. If $f(1)$ and $f(3)$ stay as Sam wrote them, what value must $f(2)$ have?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The morphism law $f\circ a=b\circ Tf$ at the extra point reads $f(a(*))=b(*)$. Here $a(*)=2$ and $b(*)=7$, so $f(2)$ must be 7. Sam chose $f(2)=5$, which breaks the law.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{1,3,9\}$. How many maps $a\colon TA\to A$ satisfy the associativity law $a\circ\mu_A=a\circ Ta$ but not the unit law $a\circ\eta_A=1_A$?'
            answer: '15'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are 18 maps that satisfy the associativity law, and the 3 maps that also satisfy the unit law are the algebras. So the maps with the associativity law only number $18-3=15$.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{1,3,9\}$. How many maps $a\colon TA\to A$ satisfy the unit law $a\circ\eta_A=1_A$ but not the associativity law?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The unit law fixes $a(1)=1$, $a(3)=3$ and $a(9)=9$ and leaves $a(*)$ free, which gives 3 maps. The associativity law holds for all 3 of them, so none satisfies the unit law without the associativity law, and the count is 0.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{1,3,9\}$. How many maps $a\colon TA\to A$ satisfy neither the unit law nor the associativity law?'
            answer: '63'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are $3^4=81$ maps from the 4 points of $TA$ to $A$. Exactly 18 satisfy the associativity law and 3 of those satisfy the unit law too, and no map has the unit law alone. So $81-18=63$ maps satisfy neither law.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{1,2,3\}$ and $B=\{5,6\}$. How many triples $(a,b,f)$ are there, where $a$ and $b$ are $T$-algebra structures on $A$ and $B$ and $f\colon A\to B$ is a surjective morphism of $T$-algebras $(A,a)\to(B,b)$?'
            answer: '18'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'There are 3 choices for $a(*)$ and 2 for $b(*)$, and the morphism law forces $f(a(*))=b(*)$. The other two points of $A$ go anywhere, which gives 4 functions $f$ for each pair. Exactly 3 of the 4 are surjective, because only the constant function misses a value, so there are $3\times2\times3=18$ triples.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{1,2,3\}$ and $B=\{5,6\}$. How many triples $(a,b,f)$ are there, where $a$ and $b$ are $T$-algebra structures on $A$ and $B$ and $f\colon A\to B$ is a morphism of $T$-algebras that is neither injective nor surjective?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'No function from 3 points to 2 points is injective. A morphism is not surjective only when it is the constant function with the value $b(*)$. That gives one $f$ for each of the $3\times2=6$ pairs $(a,b)$, so there are 6 triples.'
          - problem: 'Write the full proof that for the maybe monad $T$ on $\mathbf{Set}$ the $T$-algebras are exactly the pointed sets $(A,p)$ with $p=a(*)$, and that a function $f$ is a morphism of $T$-algebras exactly when it preserves the basepoint. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'State the laws first: $a\circ\eta_A=1_A$, $a\circ\mu_A=a\circ Ta$ and, for morphisms, $f\circ a=b\circ Tf$. Unit law: $\eta_A$ includes $A$ into $A\cup\{*\}$, so $a(x)=x$ for every $x$ in $A$, and the only datum left is $p=a(*)$. Associativity law: on the three kinds of points of $T^2A$ both composites give $x$ on $x$ in $A$, $p$ on the inner $*$ (since $a(a(*))=a(p)=p$) and $p$ on the outer $*$. So every $p$ in $A$ gives an algebra. Morphisms: the condition is automatic on $A$ and reads $f(p)=q$ at $*$, which is basepoint preservation.'
      - id: kp2
        name: Algebras recover familiar structures
        key_prerequisites: [natural-transformations, free-groups-presentations]
        step_check:
          step: 'generators evaluate to themselves'
          question: 'Why does the unit law make every generator evaluate to itself?'
          options:
            - 'Because $a$ is a group homomorphism, so it sends each generator to itself'
            - 'Because $\mu_A$ concatenates words, so a one-letter word is returned unchanged'
            - 'Because $\eta_A$ sends $x$ to $[x]$, and $a\circ\eta_A=\mathrm{id}_A$'
            - 'Because $A$ is a subset of $TA$, so every element of $A$ is a fixed point of $a$'
          answer: 'Because $\eta_A$ sends $x$ to $[x]$, and $a\circ\eta_A=\mathrm{id}_A$'
          why: 'The unit $\eta_A$ turns the generator $x$ into the one-letter word $[x]$, and $a\circ\eta_A=\mathrm{id}_A$ then says $a([x])=x$.'
        constraints: "Recover monoids from list-algebra laws and groups from free-group-algebra laws. Derive empty, binary, inverse and longer-word operations; test both sides of the algebra equation for a defective structure."
        exemplars:
          - problem: 'For the list monad $T$ on $\mathbf{Set}$, $TX=X^*$ is the set of finite lists, $\eta_X(x)=[x]$, and $\mu_X$ concatenates a list of lists. A $T$-algebra on the integers has $a([\,])=0$ and $a([x,y])=x+y$. What is $a([2,3,4])$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Apply the algebra law to the list of blocks $[[2,3],[4]]$. Then $a([2,3,4])=a([a([2,3]),a([4])])=a([5,4])=9$, so the value is the sum 9.'
          - problem: 'For the list monad $T$ on $\mathbf{Set}$, $TX=X^*$ is the set of finite lists, $\eta_X(x)=[x]$, and $\mu_X$ concatenates a list of lists. Let $A=\{0,1\}$ with $a([\,])=0$, and let $a(w)$ be the first entry of $w$ for every nonempty list $w$. Is $(A,a)$ a $T$-algebra?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","it is","it is an algebra","yes it is","it is a T-algebra","yes it is a T-algebra"],["no","it is not","it is not an algebra","no it is not","not an algebra","it is not a T-algebra","not a T-algebra","no it is not a T-algebra"]]}
            solution_sketch: 'Take the list of lists $t=[[\,],[1]]$. Flattening gives $a(\mu(t))=a([1])=1$, but $a(Ta(t))=a([a([\,]),a([1])])=a([0,1])=0$. The two sides differ, so the algebra law fails.'
          - problem: 'For the list monad $T$ on $\mathbf{Set}$, $TX=X^*$ is the set of finite lists, $\eta_X(x)=[x]$, and $\mu_X$ concatenates a list of lists. The rules $a([\,])=1$ and $a([x,y])=xy \bmod 5$ define a $T$-algebra on $A=\{1,2,3,4\}$. What is $a([4,4,3,2])$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Split the list into the blocks $[4,4]$ and $[3,2]$. Their values are $16 \bmod 5=1$ and $6 \bmod 5=1$, and the algebra law gives $a([4,4,3,2])=a([1,1])=1$.'
          - problem: 'A clock hand moves forward by each number in a list $w$ of hours, so it ends at the hour $a(w)=(\text{sum of the entries}) \bmod 12$, with $a([\,])=0$. This is an algebra for the list monad on $\{0,\dots,11\}$. The moves $[5,9]$ and $[4,7,10]$ are made one after the other, starting from hour 0. At which hour does the hand end?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Join the two lists into $[5,9,4,7,10]$. The algebra law lets us evaluate the blocks first: $a([5,9])=14 \bmod 12=2$ and $a([4,7,10])=21 \bmod 12=9$. Then $a([2,9])=11$, so the hand ends at hour 11.'
          - problem: 'For the list monad $T$ on $\mathbf{Set}$, $TX=X^*$ is the set of finite lists, $\eta_X(x)=[x]$, and $\mu_X$ concatenates a list of lists. Let $A=\{0,1\}$ and let $a(w)$ be the number of entries of $w$ equal to $1$, taken mod 2. This is a $T$-algebra, and it gives a monoid with product $x\cdot y=a([x,y])$. What is $1\cdot 1$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The list $[1,1]$ has two entries equal to 1, and two mod 2 is 0. So $1\cdot 1=a([1,1])=0$.'
          - problem: 'The algebras of the list monad on $\mathbf{Set}$ are the monoids: the identity is $a([\,])$ and the product is $x\cdot y=a([x,y])$. How many list-monad algebra structures are there on the set $A=\{0,1\}$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Choose the identity element, which can be 0 or 1. The other element $x$ then satisfies either $x\cdot x=e$ or $x\cdot x=x$, and the rest of the table is forced by the identity. That gives $2\times 2=4$ structures.'
          - problem: 'A combination lock has a dial with the 10 positions $0,\dots,9$. A list $w$ of turns ends at the position $a(w)=(\text{sum of the entries}) \bmod 10$, so $a$ is a list-monad algebra with $a([\,])=0$. Which single turn $x$ undoes a turn of 3, that is, satisfies $a([3,x])=a([\,])$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition is $3+x\equiv 0 \pmod{10}$. The solution is $x=7$, because $a([3,7])=10 \bmod 10=0=a([\,])$. So 7 is the inverse of 3 in this algebra.'
          - problem: 'Sam says that every algebra for the list monad is a group. What is the smallest number of elements of a set that carries a list-monad algebra which is not a group?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A one-element set has only the trivial monoid, and it is a group. On $A=\{0,1\}$ take $a(w)=\max$ of the entries with $a([\,])=0$. This is a monoid in which 1 has no inverse, so the smallest size is 2.'
          - problem: 'Write the full proof that the algebras for the list monad on $\mathbf{Set}$ are exactly the monoids, and that $\mathbf{Set}^T\simeq\mathbf{Mon}$. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Algebra to monoid: from $a\colon A^*\to A$ define $x\cdot y=a([x,y])$ and $u=a([\,])$. Unit: the law at $t=[[\,],[x]]$ gives $a([x])=u\cdot x$, so $u\cdot x=x$, and symmetrically $x\cdot u=x$. Associativity: the law at $t=[[x,y],[z]]$ and at $t=[[x],[y,z]]$ gives $(x\cdot y)\cdot z=a([x,y,z])=x\cdot(y\cdot z)$. Monoid to algebra: let $a$ multiply the letters of a word; both sides of the law multiply the same letters with different groupings. Morphisms: $f(a(w))=a(Tf(w))$ says that $f$ preserves products and the unit.'
      - id: kp3
        name: The free-forgetful adjunction of the algebras
        key_prerequisites: [adjunctions]
        step_check:
          step: 'is the monad unit law'
          question: 'Why does the unit law of the free algebra $(X^*,\mu_X)$ need no new proof?'
          options:
            - 'It is the monad unit law $\mu\circ\eta T=1_T$ taken at the object $X$'
            - 'It follows from naturality of $\eta$, which holds for every functor $T$'
            - 'It holds because every set $X^*$ is a free monoid under concatenation'
            - 'It is the monad associativity law $\mu\circ\mu T=\mu\circ T\mu$ taken at $X$'
          answer: 'It is the monad unit law $\mu\circ\eta T=1_T$ taken at the object $X$'
          why: 'The algebra law $\mu_X\circ\eta_{X^*}=1_{X^*}$ is the component at $X$ of the monad unit law $\mu\circ\eta T=1_T$, so the monad axioms already prove it.'
        constraints: "Construct free algebra (TC,mu_C), match its laws to the monad laws, and recover the free-forgetful transpose maps. Do not supply the free object or hom-set bijection before asking only for an evaluation."
        exemplars:
          - problem: 'For the list monad $T$ on $\mathbf{Set}$, $TX=X^*$ is the set of finite lists, $\eta_X(x)=[x]$, and $\mu_X$ concatenates a list of lists. Let $(TC,\mu_C)$ be the free $T$-algebra on $C=\{x,y\}$, which is the set of all finite words in $x,y$ with concatenation. Let $\mathbb Z/2$ carry the $T$-algebra structure $a(w)=(\text{sum of the entries}) \bmod 2$. How many morphisms of $T$-algebras are there from $(TC,\mu_C)$ to $\mathbb Z/2$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the free-forgetful adjunction a morphism out of the free algebra is fixed by its restriction along $\eta_C$, which can be any function from $C$ to the underlying set of $\mathbb Z/2$. Each of the 2 letters has 2 possible values, so there are $2\times 2=4$ morphisms.'
          - problem: 'For the list monad $T$ on $\mathbf{Set}$, $TX=X^*$ is the set of finite lists, $\eta_X(x)=[x]$, and $\mu_X$ concatenates a list of lists. In the free algebra $(TC,\mu_C)$ on $C=\{x,y\}$ the structure map is $\mu_C$. How many entries has the word $\mu_C([[x,y],[\,],[y]])$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The structure map $\mu_C$ concatenates the inner lists. The inner lists have 2, 0 and 1 entries, so the word has $2+0+1=3$ entries.'
          - problem: 'For the list monad $T$ on $\mathbf{Set}$, $TX=X^*$ is the set of finite lists, $\eta_X(x)=[x]$, and $\mu_X$ concatenates a list of lists. Let $(\mathbb Z,a)$ be the $T$-algebra with $a(w)=$ the sum of the entries of $w$. Let $f\colon\{x,y\}\to\mathbb Z$ with $f(x)=2$ and $f(y)=-5$. The transpose of $f$ is the morphism of algebras $f^\#=a\circ Tf$ from the free algebra on $\{x,y\}$ to $(\mathbb Z,a)$. What is $f^\#([x,y,y,x])$?'
            answer: '-6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The map $Tf$ replaces each letter by its value, so $Tf([x,y,y,x])=[2,-5,-5,2]$. Applying $a$ adds the entries, so $f^\#([x,y,y,x])=2-5-5+2=-6$.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{x,y\}$ and let $(B,b)$ be the pointed set $B=\{0,1,2\}$ with $b(*)=0$. Let $f(x)=2$ and $f(y)=1$. The transpose $f^\#=b\circ Tf$ is a morphism from the free algebra $A+\{*\}$ to $(B,b)$. What is $f^\#(*)$?'
            answer: '0'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The map $Tf$ fixes $*$, and then $b$ sends $*$ to the basepoint. So $f^\#(*)=b(*)=0$, as every morphism of algebras sends basepoint to basepoint.'
          - problem: 'Which law of the monad $T$, taken at the object $C$, is the equation $\mu_C\circ\mu_{TC}=\mu_C\circ T\mu_C$ that the free algebra $(TC,\mu_C)$ must satisfy?'
            answer: 'the associativity law'
            answer_contract: {"kind":"label","options":[["the unit law","unit law","unit","the monad unit law","monad unit law"],["the associativity law","associativity law","associativity","the monad associativity law","monad associativity","associative law"]]}
            solution_sketch: 'The algebra law $\mu_C\circ\mu_{TC}=\mu_C\circ T\mu_C$ is exactly the monad associativity law $\mu\circ\mu T=\mu\circ T\mu$ at the object $C$. Naturality of $\eta$ does not involve $\mu$ at all, so Sam is wrong.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{x,y\}$ and let $B=\{0,1,2,3\}$ be a pointed set with basepoint 0. How many morphisms of $T$-algebras are there from the free algebra $A+\{*\}$ to $B$?'
            answer: '16'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the free-forgetful adjunction a morphism out of the free algebra is fixed by its restriction to $A$, which is any function $A\to B$. Each of the 2 elements of $A$ has 4 choices, so there are $4^2=16$ morphisms.'
          - problem: 'A warehouse scanner records the items scanned as a list from the set $C=\{\text{box},\text{tube},\text{bag}\}$. The total weight of a list is the sum of the item weights modulo 5, which is a $T$-algebra structure on $\mathbb Z/5$ for the list monad. How many morphisms of $T$-algebras are there from the free algebra on $C$, the set of all scanned lists, to $\mathbb Z/5$?'
            answer: '125'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A morphism out of the free algebra is fixed by the weights it gives to the 3 kinds of item, and any weights in $\mathbb Z/5$ are allowed. Each kind has 5 choices, so there are $5^3=125$ morphisms.'
          - problem: 'A survey question is answered yes or no, or it is skipped. The possible entries form the free algebra $A+\{*\}$ for the maybe monad with $A=\{\text{yes},\text{no}\}$ and $*$ meaning skipped. A scoring is the pointed set $\{0,1,2\}$ in which a skipped entry scores 0. How many morphisms of $T$-algebras are there from the entries to the scoring?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A morphism must send $*$ to the score 0, and it is free on the two answers. Yes and no can each score 0, 1 or 2, so there are $3\times 3=9$ morphisms.'
          - problem: 'Write the full proof that for every monad $(T,\eta,\mu)$ on a category $\mathcal C$ and every object $C$ the pair $(TC,\mu_C)$ is a $T$-algebra, and that $F^T\dashv U^T$ is an adjunction with unit $\eta$. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Free algebra: the unit law $\mu_C\circ\eta_{TC}=1_{TC}$ is the monad unit law $\mu\circ\eta T=1_T$ at $C$, and $\mu_C\circ\mu_{TC}=\mu_C\circ T\mu_C$ is the monad associativity law at $C$. Adjunction: for a function $f\colon C\to A$ into an algebra $(A,a)$ the transpose is $a\circ Tf$, and it is a morphism of algebras by the two laws of $a$. Restricting a morphism $h$ along $\eta_C$ gives the inverse, and the two round trips use naturality of $\eta$ with $a\circ\eta_A=1_A$, and $\mu_C\circ T\eta_C=1_{TC}$. The transpose of $1_{TC}$ is $\eta_C$, so $\eta$ is the unit.'
    diagnostic_exemplar:
      problem: "Let $T$ be the list monad on $\\mathbf{Set}$ ($TX=X^*$, $\\eta_X(x)=[x]$, $\\mu_X=$ flatten). Verify that the free $T$-algebra on a set $C$, namely $(TC,\\mu_C)$, satisfies the two $T$-algebra laws, and identify the resulting structure on $C^*$ concretely."
      answer: "The algebra laws for $(A,a)=(TC,\\mu_C)$ read $a\\circ\\eta_A=1_A$, i.e. $\\mu_C\\circ\\eta_{TC}=1_{TC}$, and $a\\circ\\mu_A=a\\circ Ta$, i.e. $\\mu_C\\circ\\mu_{TC}=\\mu_C\\circ T(\\mu_C)$. These are exactly the monad unit law $\\mu\\circ\\eta T=1_T$ and the monad associativity law $\\mu\\circ\\mu T=\\mu\\circ T\\mu$, both taken at the object $C$ — so nothing new has to be proved. Concretely: $\\eta_{TC}$ wraps a word $w$ as the one-element list $[w]$ and flattening returns $w$; and a list of lists of lists flattens to the same word whether the outer or the inner grouping is collapsed first (both give the concatenation of all letters in order). Since algebras for the list monad are monoids, with the structure map evaluating a word of elements to their product, $(C^*,\\mu_C)$ is the free monoid on $C$: concatenation of words, with the empty word as unit."
      solution_sketch: "Prove nothing new: instantiate the two algebra laws at $(TC,\\mu_C)$ and watch them turn into the monad unit and associativity laws at $C$. Then read the structure off concretely — flattening is concatenation, so this is the free monoid on $C$."
    anki_seeds:
      - front: "A $T$-algebra is an object $A$ equipped with a structure map of what type?"
        back: "$a\\colon TA\\to A$."
        type: basic
      - front: "State the unit law for a $T$-algebra $(A,a)$."
        back: "$a\\circ\\eta_A=1_A$."
        type: basic
      - front: "State the associativity law for a $T$-algebra $(A,a)$."
        back: "$a\\circ\\mu_A=a\\circ Ta$."
        type: basic
      - front: "A morphism of $T$-algebras $(A,a)\\to(B,b)$ is a map $f\\colon A\\to B$ with..."
        back: "$f\\circ a=b\\circ Tf$."
        type: basic
      - front: "Algebras for the list monad on $\\mathbf{Set}$ are exactly {{c1::monoids}}."
        back: "monoids"
        type: cloze

  - id: adjunctions-give-monads
    name: Adjunctions and Monads
    core: false                # stated theorem feeding only Kleisli-vs-Eilenberg-Moore
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: adjunctions
        weight: 0.5
      - id: unit-counit
        weight: 0.4
      - id: triangle-identities
        weight: 0.4
        key: true
      - id: monads
        weight: 0.4
        key: true
    knowledge_points:
      - id: kp1
        name: Every adjunction induces a monad
        key_prerequisites: [adjunctions]
        try_first:
          problem: 'In a poset regarded as a category there is exactly one arrow $x\to y$ when $x\le y$. $F\dashv G$ means that $F(p)\le q$ exactly when $p\le G(q)$, and then $T=GF$ is the induced monad. Let $P=\{0,1,2,3\}$, $Q=\{0,1\}$, $F(p)=\lfloor p/2\rfloor$ and $G(q)=2q+1$. What is $G(F(2))$?'
          answer_contract: {"kind":"exact"}
          answer: '3'
          reveal: 'Here $F(2)=1$ and $G(1)=3$, so $GF(2)=3$. The composite $GF$ of the two adjoint functors is the monad that the adjunction induces.'
        step_check:
          step: 'This uses the first triangle identity $\varepsilon F\circ F\eta=1_F$'
          question: 'Why does the left unit law $\mu\circ T\eta=1_T$ lead to the triangle identity $\varepsilon F\circ F\eta=1_F$?'
          options:
            - 'Because $\mu=U\varepsilon F$ is a counit, so it cancels the unit $\eta$ directly'
            - 'Because $\eta$ is natural, so the composite $\mu\circ T\eta$ equals the identity at once'
            - 'Because $T\eta=UF\eta$, so $U$ factors out and leaves $\varepsilon F\circ F\eta$ in it'
            - 'Because the free group functor $F$ preserves composition, so it sends $\eta$ to $1_F$'
          answer: 'Because $T\eta=UF\eta$, so $U$ factors out and leaves $\varepsilon F\circ F\eta$ in it'
          why: 'Writing $\mu\circ T\eta=U\varepsilon F\circ UF\eta=U(\varepsilon F\circ F\eta)$ shows that the triangle identity $\varepsilon F\circ F\eta=1_F$ is what turns the composite into $1_T$.'
        constraints: "Construct GF, eta and G eps F from adjunction data; identify the counit object correctly and derive laws from naturality and triangles. Concrete values must require recovery of the induced structure."
        exemplars:
          - problem: 'In a poset regarded as a category there is exactly one arrow $x\to y$ when $x\le y$. $F\dashv G$ means that $F(p)\le q$ exactly when $p\le G(q)$, and then $T=GF$ is the induced monad. Let $P=\{0<1<2<3<4\}$ and $Q=\{0<1<2\}$. The functor $F\colon P\to Q$ has the values $F(0),\dots,F(4)=0,0,1,1,2$, and its right adjoint $G\colon Q\to P$ has the values $G(0),G(1),G(2)=1,3,4$. What is $T(2)$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The induced monad is $T=GF$, so $T(2)=G(F(2))$. Since $F(2)=1$ and $G(1)=3$, we get $T(2)=3$.'
          - problem: 'In a poset regarded as a category there is exactly one arrow $x\to y$ when $x\le y$. $F\dashv G$ means that $F(p)\le q$ exactly when $p\le G(q)$, and then $T=GF$ is the induced monad. Let $P=\{0,1,\dots,6\}$ and $Q=\{0,1,2\}$ with their usual orders, $F(p)=\lfloor p/3\rfloor$, and $G$ given by $G(0),G(1),G(2)=2,5,6$. For how many $p$ in $P$ is $T(p)$ strictly larger than $p$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Compute $T(p)=G(F(p))$ for $p=0,\dots,6$. It gives $2,2,2,5,5,5,6$. This is larger than $p$ for $p=0,1,3,4$ and equal to $p$ for $p=2,5,6$, so the count is 4.'
          - problem: 'For the free-monoid and forgetful adjunction $F\dashv U$ between $\mathbf{Set}$ and $\mathbf{Mon}$, the monad $T=UF$ has $\mu_A=U\varepsilon_{FA}$, which multiplies a word of words inside the free monoid $FA$. For $A=\{1,2\}$, what is $\mu_A([[2,1],[1,2]])$?'
            answer: '2, 1, 1, 2'
            answer_contract: {"kind":"list","ordered":true,"member":{"kind":"exact"}}
            solution_sketch: 'The counit at the free monoid $FA$ multiplies the inner words in order, that is, it concatenates them. The word $[2,1]$ followed by the word $[1,2]$ is the single word $[2,1,1,2]$.'
          - problem: 'For the free-group and forgetful adjunction $F\dashv U$ between $\mathbf{Set}$ and $\mathbf{Grp}$, the monad $T=UF$ has $\mu_A=U\varepsilon_{FA}$, which multiplies a word of words inside the free group on $A$. For $A=\{a,b\}$, how many letters has the reduced word $\mu_A([[b,a],[a^{-1},b]])$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Multiply the inner words: the word $b\,a$ followed by $a^{-1}\,b$ is $b\,a\,a^{-1}\,b$. The adjacent pair $a\,a^{-1}$ cancels and leaves $b\,b$, a reduced word with 2 letters.'
          - problem: 'Let $F\dashv G$ have unit $\eta$ and counit $\varepsilon$, and let $T=GF$ and $\mu=G\varepsilon F$. The unit law $\mu\circ\eta T=1_T$ is proved with one of the two triangle identities, $G\varepsilon\circ\eta G=1_G$ or $\varepsilon F\circ F\eta=1_F$. Which one is it?'
            answer: 'the identity for G'
            answer_contract: {"kind":"label","options":[["the identity for G","G","1_G","the G identity","G epsilon after eta G","G epsilon composed with eta G"],["the identity for F","F","1_F","the F identity","epsilon F after F eta","epsilon F composed with F eta"]]}
            solution_sketch: 'Write $\mu\circ\eta T=(G\varepsilon F)\circ(\eta GF)=(G\varepsilon\circ\eta G)F$. The triangle identity $G\varepsilon\circ\eta G=1_G$ turns this into $1_GF=1_T$. The other identity, $\varepsilon F\circ F\eta=1_F$, proves the other unit law $\mu\circ T\eta=1_T$.'
          - problem: 'Eggs are packed in cartons of 3. For $n$ eggs, $F(n)=\lfloor n/3\rfloor$ is the number of full cartons. Its right adjoint on the integers is $G(m)=3m+2$, the largest number of eggs that fill at most $m$ cartons. Find $T(10)$ for the induced monad $T=GF$.'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $F(10)=\lfloor 10/3\rfloor=3$ full cartons. Then $T(10)=G(3)=3\cdot 3+2=11$, the largest number of eggs that still make only 3 full cartons.'
          - problem: 'A school books minibuses with 4 seats. For $n$ students, $F(n)=\lceil n/4\rceil$ is the number of minibuses needed. Its right adjoint is $G(m)=4m$, the number of seats in $m$ minibuses, because $\lceil n/4\rceil\le m$ exactly when $n\le 4m$. Find $T(17)$ for the induced monad $T=GF$.'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $F(17)=\lceil 17/4\rceil=5$ minibuses are needed. Then $T(17)=G(5)=4\cdot 5=20$ seats are booked for 17 students.'
          - problem: 'Write the full proof that if $F$ is left adjoint to $G$ with unit $\eta$ and counit $\varepsilon$, then $(GF,\eta,G\varepsilon F)$ is a monad, deriving each law from naturality and the triangle identities. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Set $T=GF$ and $\mu=G\varepsilon F$; this is natural because $\varepsilon$ is. First unit law: $\mu\circ T\eta=G\varepsilon F\circ GF\eta=G(\varepsilon F\circ F\eta)=G(1_F)=1_T$, using the triangle identity $\varepsilon F\circ F\eta=1_F$. Second unit law: $\mu\circ\eta T=(G\varepsilon\circ\eta G)F=1_GF=1_T$, using the triangle identity $G\varepsilon\circ\eta G=1_G$. Associativity: $\mu\circ T\mu=\mu\circ\mu T$ follows from naturality of $\varepsilon$ applied to the component $\varepsilon_{FX}$, which identifies the two composites $GFGFGF\to GF$.'
      - id: kp2
        name: Every monad comes from an adjunction
        key_prerequisites: [monads]
        step_check:
          step: 'so $U_T(g)(a,n)=(b,m+n)$ where $g(a)=(b,m)$'
          question: 'Why does $U_T(g)(a,n)$ add $n$ to the log $m$ of $g(a)$, instead of multiplying them?'
          options:
            - 'Because $\eta_B$ adds the log 0, so every later step must use addition as well'
            - 'Because $\mu_B$ is the monad multiplication, and here it adds the logs'
            - 'Because $\mathbb N$ has no multiplication that is compatible with the unit $(a,0)$'
            - 'Because $g(a)$ already contains $n$, so the two logs are combined by addition'
          answer: 'Because $\mu_B$ is the monad multiplication, and here it adds the logs'
          why: '$U_T(g)=\mu_B\circ Tg$, and $\mu_B((b,m),n)=(b,m+n)$ by the definition of the monad, so the two logs add.'
        constraints: "Construct both resolution functors on objects and morphisms and verify their composite equals T. In Kleisli use a unit-law rewrite; in Eilenberg-Moore recover the free carrier, structure and arrow."
        exemplars:
          - problem: 'Let $T$ be the monad on $\mathbf{Set}$ with $TA=A\times\mathbb N$, $\eta_A(a)=(a,0)$ and $\mu_A((a,m),n)=(a,m+n)$. The arrows $A\to B$ of the Kleisli category are the functions $A\to TB$, with $F_T(f)=\eta_B\circ f$ and $U_T(g)=\mu_B\circ Tg$. Let $g\colon\{p\}\to T\{p\}$ be the Kleisli arrow with $g(p)=(p,3)$. $U_T(g)$ sends $(p,4)$ to a pair $(p,k)$. What is $k$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $U_T(g)(p,4)=\mu_B(Tg(p,4))=\mu_B((g(p),4))=\mu_B(((p,3),4))$. The multiplication adds the two logs, so the result is $(p,3+4)=(p,7)$ and $k=7$.'
          - problem: 'Let $T$ be the monad on $\mathbf{Set}$ with $TA=A\times\mathbb N$, $\eta_A(a)=(a,0)$ and $\mu_A((a,m),n)=(a,m+n)$. The arrows $A\to B$ of the Kleisli category are the functions $A\to TB$, with $F_T(f)=\eta_B\circ f$ and $U_T(g)=\mu_B\circ Tg$. Let $f\colon\{1,2\}\to\{1,2\}$ swap the two elements. Sam says that $U_TF_T(f)(1,5)=(1,5)$, because $F_T$ and $U_T$ cancel each other. What is the correct value of $U_TF_T(f)(1,5)$?'
            answer: '(2, 5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Compute $U_TF_T(f)(1,5)=\mu_B(T(\eta_B\circ f)(1,5))=\mu_B(((f(1),0),5))=(f(1),0+5)=(2,5)$. The functor $U_TF_T$ is $T$, not the identity, so it applies $f$ and keeps the log 5.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. The free algebra $F^T(A)=(TA,\mu_A)$ has the structure map $\mu_A\colon T^2A\to TA$. For $A=\{1,2\}$ the set $T^2A$ has four points: $1$, $2$, the inner extra point and the outer extra point. How many points of $T^2A$ does $\mu_A$ send to the extra point of $TA$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The map $\mu_A$ sends $1$ to $1$ and $2$ to $2$. It sends both extra points to the extra point $*$ of $TA$. So 2 points go to $*$.'
          - problem: 'For the maybe monad $T$ on $\mathbf{Set}$, $TX=X+\{*\}$ is $X$ with one extra point $*$, the unit $\eta_X$ is the inclusion, $\mu_X$ sends both extra points of $T^2X$ to $*$, and $Tf$ fixes $*$. Let $A=\{1,2,3,4\}$, $B=\{5,6\}$ and let $g\colon A\to TB$ be the Kleisli arrow with $g(1)=5$, $g(2)=*$, $g(3)=*$, $g(4)=6$. The functor $U_T$ sends $g$ to $\mu_B\circ Tg\colon TA\to TB$. How many of the five points of $TA$ does $U_T(g)$ send to the extra point of $TB$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The map $U_T(g)$ acts as $g$ on $A$ and fixes the extra point. So it sends $2$, $3$ and $*$ to the extra point of $TB$, and it sends $1$ and $4$ to $5$ and $6$. The count is 3.'
          - problem: 'Every monad $T$ has a Kleisli resolution and an Eilenberg-Moore resolution, and both are adjunctions that induce $T$. Which of the two is the terminal resolution of $T$?'
            answer: 'Eilenberg-Moore'
            answer_contract: {"kind":"label","options":[["Kleisli","the Kleisli resolution","Kleisli resolution"],["Eilenberg-Moore","the Eilenberg-Moore resolution","Eilenberg-Moore resolution","algebras","the category of algebras"]]}
            solution_sketch: 'Every resolution of $T$ receives a unique comparison functor from the Kleisli one, and sends a unique comparison functor to the Eilenberg-Moore one. So Kleisli is initial and Eilenberg-Moore is terminal.'
          - problem: 'A clinic keeps a record that assigns to each of 3 customers one of 2 plans, or no plan. This is an arrow from a 3-element set $A$ to a 2-element set $B$ in the Kleisli category of the maybe monad, that is, a function $A\to B+\{*\}$. How many different records are there?'
            answer: '27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A Kleisli arrow is a function from $A$ to $TB=B+\{*\}$, and $TB$ has $2+1=3$ elements. Each of the 3 customers has 3 choices, so there are $3^3=27$ records.'
          - problem: 'A calculation step takes each of 2 inputs to one of 3 results and records a cost from $0,1,2,3$. This is an arrow from a 2-element set to a 3-element set in the Kleisli category of the writer monad $TB=B\times\{0,1,2,3\}$. How many different steps are there?'
            answer: '144'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A Kleisli arrow is a function from the 2 inputs to $TB$, which has $3\times 4=12$ elements. Each input has 12 choices, so there are $12^2=144$ steps.'
          - problem: 'Let $T$ be the monad on $\mathbf{Set}$ with $TA=A\times\mathbb N$, $\eta_A(a)=(a,0)$ and $\mu_A((a,m),n)=(a,m+n)$. The arrows $A\to B$ of the Kleisli category are the functions $A\to TB$, with $F_T(f)=\eta_B\circ f$ and $U_T(g)=\mu_B\circ Tg$. In a pipeline, stage $f$ is the Kleisli arrow $f(p)=(p,2)$, which adds a cost of 2, and stage $g$ is $g(p)=(p,3)$, which adds a cost of 3. $g\circ_T f$ is the Kleisli composite $\mu\circ Tg\circ f$. What is the total cost, that is, the second component of $(g\circ_T f)(p)$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'We have $(g\circ_T f)(p)=\mu(Tg(p,2))=\mu(((p,3),2))=(p,3+2)$. The multiplication adds the two costs, so the total cost is 5.'
          - problem: 'Write the full proof that the Kleisli adjunction $F_T\dashv U_T$ of a monad $(T,\eta,\mu)$ induces $T$, that is, $U_TF_T=T$ on objects and on morphisms, with unit $\eta$. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'The Kleisli category $\mathcal C_T$ has the objects of $\mathcal C$ and the arrows $A\to TB$, with composite $\mu_C\circ Tg\circ f$, which is associative by the multiplication law. Define $F_T(A)=A$, $F_T(f)=\eta_B\circ f$, $U_T(A)=TA$ and $U_T(g)=\mu_B\circ Tg$; both are functors by the monad laws. The identity on arrows $A\to TB$ is the bijection $\mathcal C_T(F_TA,B)\cong\mathcal C(A,U_TB)$, with unit $\eta$. On objects $U_TF_T(A)=TA$. On morphisms $U_TF_T(f)=\mu_B\circ T\eta_B\circ Tf=Tf$ by the unit law $\mu\circ T\eta=1$.'
    diagnostic_exemplar:
      problem: "Let $F\\dashv G$ have unit $\\eta$ and counit $\\varepsilon$, and set $T=GF$ with $\\mu=G\\varepsilon F$. Prove the two unit laws $\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T$, naming the triangle identity used at each step, and identify the monad this construction produces for the free-forgetful adjunction $F\\dashv U$ between $\\mathbf{Set}$ and $\\mathbf{Grp}$."
      answer: "Components: $T_C=GFC$ and $\\mu_C=G(\\varepsilon_{FC})$. First law: $(\\mu\\circ T\\eta)_C=\\mu_C\\circ GF(\\eta_C)=G(\\varepsilon_{FC})\\circ G(F\\eta_C)=G\\big(\\varepsilon_{FC}\\circ F\\eta_C\\big)=G(1_{FC})=1_{GFC}$, using functoriality of $G$ and then the first triangle identity $\\varepsilon F\\circ F\\eta=1_F$. Second law: $(\\mu\\circ\\eta T)_C=\\mu_C\\circ\\eta_{GFC}=G(\\varepsilon_{FC})\\circ\\eta_{G(FC)}=(G\\varepsilon\\circ\\eta G)_{FC}=1_{G(FC)}$, which is the second triangle identity $G\\varepsilon\\circ\\eta G=1_G$ evaluated at the object $FC$. For $F\\dashv U$ between $\\mathbf{Set}$ and $\\mathbf{Grp}$ the induced monad is the free-group monad $T=UF$: $TX$ is the underlying set of the free group on $X$ (reduced words in the letters of $X$ and their formal inverses), $\\eta_X$ inserts a letter as a one-letter word, and $\\mu_X$ multiplies out a word of words."
      solution_sketch: "Push $G$ through each composite by functoriality until a triangle identity appears inside it: the first law reduces to $\\varepsilon F\\circ F\\eta=1_F$ under $G$, and the second is $G\\varepsilon\\circ\\eta G=1_G$ evaluated at the object $FC$. Then name the induced monad on $\\mathbf{Set}$."
    anki_seeds:
      - front: "The monad induced by an adjunction $F\\dashv G$?"
        back: "$T=GF$, unit $\\eta$, multiplication $\\mu=G\\varepsilon F$."
        type: basic
      - front: "Every monad arises from an adjunction — canonical ones are the {{c1::Kleisli}} and {{c2::Eilenberg-Moore}} resolutions."
        back: "Kleisli; Eilenberg-Moore"
        type: cloze

  - id: kleisli-vs-eilenberg-moore
    name: Kleisli versus Eilenberg-Moore
    core: false
    difficulty: 0.82
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: kleisli-categories
        weight: 0.5
        key: true
