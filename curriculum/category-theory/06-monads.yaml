    knowledge_points:
      - id: kp1
        name: The data and the types of the whiskered transformations
        key_prerequisites: [whiskering]
        constraints: "Give the type of each whiskered transformation and its component at an object before writing any law."
        exemplars:
          - problem: "A monad on a category C is the data of an endofunctor T : C -> C, a unit eta : Id_C => T, and a multiplication mu : T^2 => T, where T^2 means T after T. Whiskering mu on the left by T produces a natural transformation T mu from T^a to T^b. Give the exponents a and b."
            answer: "a = 3; b = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "The full object is the whiskered transformation T mu : T after T^2 => T after T. Step 1 (whiskering rule): whiskering on the left composes T on the left, so the source functor is T after T^2 = T^3. Step 2 (functor composition): the target functor is T after T = T^2. Hence T mu : T^3 => T^2. The answer is a = 3; b = 2."
          - problem: "On the category of sets, let T be the writer monad for integer addition: T(X) = X × Z, the set of pairs (x, m) with x in X and m an integer; T(f)(x, m) = (f(x), m); unit eta_A(x) = (x, 0); multiplication mu_A((x, m), n) = (x, m + n). Fix a set A that contains 7. The left whiskering of the unit by T is a transformation (T eta)_A : T(A) -> T(T(A)). Compute the value of (T eta)_A at the element (7, 5) of T(A), and give the answer as (x, m, n), coding the element ((x, m), n) of T(T(A))."
            answer: "(7,0,5)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is (T eta)_A = T(eta_A) : T(A) -> T(T(A)). Step 1 (whiskering rule): left whiskering applies the functor T to the component, so (T eta)_A = T(eta_A). Step 2 (action of T on maps): T(eta_A)(x, m) = (eta_A(x), m). Step 3 (unit component): eta_A(7) = (7, 0). So T(eta_A)(7, 5) = ((7, 0), 5). The answer is (7,0,5)."
          - problem: "Let T be the writer monad for integer addition on sets: T(X) = X × Z with T(f)(x, m) = (f(x), m); the unit is eta_A(x) = (x, 0) and the multiplication is mu_A((x, m), n) = (x, m + n). Choose a set A with 4 among its elements. Right whiskering the unit by T gives a transformation (eta T)_A : T(A) -> T(T(A)). Evaluate (eta T)_A at the element (4, 6) of T(A), and give the answer as (x, m, n) for the resulting element ((x, m), n) of T(T(A))."
            answer: "(4,6,0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is (eta T)_A = eta_{T(A)} : T(A) -> T(T(A)). Step 1 (whiskering rule): right whiskering re-indexes the unit at the object T(A). Step 2 (unit component): the unit at the set T(A) sends an element y of T(A) to the pair (y, 0). Step 3 (substitute): eta_{T(A)}(4, 6) = ((4, 6), 0). The answer is (4,6,0)."
          - problem: "For the writer monad for integer addition on sets, T(X) = X × Z, T(f)(x, m) = (f(x), m), eta_A(x) = (x, 0), and mu_B((x, m), n) = (x, m + n) for every set B. Let A be a set containing 5. The right whiskering of the multiplication by T is a transformation (mu T)_A : T^3(A) -> T^2(A). Determine the value of (mu T)_A at the element (((5, 2), 3), 4) of T^3(A), and give the answer as (x, m, n) standing for the element ((x, m), n) of T^2(A)."
            answer: "(5,2,7)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "The full object is (mu T)_A = mu_{T(A)} : T^3(A) -> T^2(A). Step 1 (whiskering rule): right whiskering re-indexes, so the component is the multiplication at the object T(A). Step 2 (multiplication component): mu_{T(A)} sends ((y, n), k) to (y, n + k), where y is an element of T(A). Step 3 (substitute): with y = (5, 2), n = 3 and k = 4, the value is ((5, 2), 7). The answer is (5,2,7)."
          - problem: "Let T be the list monad on the category of sets: T(X) is the set of finite lists of elements of X, the unit has component eta_A(x) = [x], and mu_B joins a list of lists into one list by concatenation for every set B. The functor T sends a map f to the entrywise map [l1, l2] -> [f(l1), f(l2)]. At the set A = {u, v, w}, let L = [[[u], [v]], [[w]]], an element of T^3(A). The whiskered transformations (T mu)_A and (mu T)_A both go from T^3(A) to T^2(A) and send L to a list of lists. How many inner lists does each result contain? Give leftcount for (T mu)_A and rightcount for (mu T)_A."
            answer: "leftcount = 2; rightcount = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "leftcount"}, {"contract": {"kind": "exact"}, "name": "rightcount"}]}
            solution_sketch: "The full objects are (T mu)_A = T(mu_A) and (mu T)_A = mu_{T(A)}, both from T^3(A) to T^2(A). Step 1 (left whiskering): T(mu_A) applies mu_A to each entry of L, giving [mu_A([[u], [v]]), mu_A([[w]])] = [[u, v], [w]], a list with 2 inner lists. Step 2 (right whiskering): mu_{T(A)} concatenates the outer level, giving [[u], [v]] followed by [[w]], the list [[u], [v], [w]] with 3 inner lists. The answer is leftcount = 2; rightcount = 3."
          - problem: "For multiplication mu:T^2=>T, Step 1: T mu and mu T both have type T^3=>T^2. Step 2: (T mu)_A=T(mu_A). Step 3: (mu T)_A=mu_TA. Step 4: these two components are equal merely because their types agree. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "For the list monad the two maps on a triple-nested list have different intermediate values. Only postcomposing by mu makes the associativity legs agree. This is the first unsupported step."
          - problem: "Write the full proof: if (T, eta, mu) is a monad on a category C, then T mu and mu T are natural transformations from T^3 to T^2, T eta and eta T are natural transformations from T to T^2, and at every object A the components are (T mu)_A = T(mu_A), (mu T)_A = mu_{T(A)}, (T eta)_A = T(eta_A), and (eta T)_A = eta_{T(A)}. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (data): a monad is an endofunctor T : C -> C with natural transformations eta : Id_C => T and mu : T^2 => T, where T^2 = T after T and T^3 = T after T after T. Step 2 (left whiskering of mu): by the whiskering rule, T mu : T after T^2 => T after T, that is T mu : T^3 => T^2, with component (T mu)_A = T(mu_A) : T^3(A) -> T^2(A). Step 3 (right whiskering of mu): mu T : T^2 after T => T after T, that is mu T : T^3 => T^2, with component (mu T)_A = mu_{T(A)}. Step 4 (whiskering the unit): T eta : T after Id_C => T after T, that is T eta : T => T^2, with (T eta)_A = T(eta_A); likewise eta T : Id_C after T => T after T, that is eta T : T => T^2, with (eta T)_A = eta_{T(A)}. Step 5 (naturality): whiskering a natural transformation by a functor on either side is again natural, so all four whiskered transformations are natural with the stated types and components, which completes the proof."
      - id: kp2
        name: The three laws
        key_prerequisites: [natural-transformations]
        constraints: "Construct all three typed monad-law paths, and verify equality of both legs or recover missing lawful data. A single supplied leg followed by evaluation does not suffice."
        exemplars:
          - problem: "On Set let T(X)=X times Z and let T act on the first coordinate. Candidate unit and multiplication are eta_X(x)=(x,2) and mu_X((x,m),n)=(x,a*m+b*n+c), where a,b,c are integers. Determine all coefficients for which both monad unit laws hold for every X and every integer log. Then derive the two associativity composites on an arbitrary triple of logs and decide whether their equality follows for those coefficients. Give a,b,c and the associativity-validity bit. The whiskered composites are not supplied."
            answer: "1, 1, -2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two unit whiskerings force opposite coefficient equations, together giving a=b=1 and c=-2. The resulting log operation is m+n-2, and both associativity composites are m+n+p-4 for arbitrary integer logs. The result is 1, 1, -2, 1."
          - problem: "T is the list functor, eta is singleton insertion, and mu is concatenation. Verify the associativity law on w=[[[1]],[[2],[1,2]]]. Derive both whiskered first steps. Give the two intermediate outer-list lengths, first after T mu then after mu T, followed by 1 if the final lists agree and 0 otherwise."
            answer: "2, 3, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Left whiskering flattens within each outer entry; right whiskering flattens the outer layer. A final multiplication equalizes the results. The result is 2, 3, 1."
          - problem: "For T(A)=A x Z, T acts on the first coordinate, eta(a)=(a,e), and mu((a,m),n)=(a,m+n). Reconstruct both unit laws and determine the integer e that satisfies them for every log. Give e."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The two whiskered insertions place e in different log positions. Each composite must retain the original log, forcing the additive identity. The result is 0."
          - problem: "A writer candidate has T(A)=A x Z, eta(a)=(a,0), and mu((a,m),n)=(a,m-n). Derive both associativity legs on (((a,m),n),p). Give left minus right for the final log, taking left=mu after T mu and right=mu after mu T."
            answer: "-2*p"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Left whiskering multiplies the inner two logs and right whiskering the outer two. The nonzero difference disproves associativity for this candidate. Hence the required expression is -2*p."
          - problem: "A writer candidate uses integer logs, addition for multiplication, and eta with constant log 1. Its pair convention is value-first. Derive both whiskered unit composites and the associativity composites. Test unit inputs with logs 0,2 and a triple with logs 1,2,3. Give the four unit-output logs (T eta route first for each input), then the two associative outputs, then validity bits for the two unit laws and associativity."
            answer: "1, 1, 3, 3, 6, 6, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Derive the two placements of the unit log from left and right whiskering. Their failure does not imply associativity fails: the two triple-log composites still agree by associativity of addition. The result is 1, 1, 3, 3, 6, 6, 0, 0, 1."
          - problem: "Let T(X)=X times {0,1}, with T acting on the first coordinate and eta_X(x)=(x,0). Two candidate multiplications are L((x,m),n)=(x,m) and R((x,m),n)=(x,n). For each candidate derive both whiskered unit maps and both associativity composites from the functor action. Give the validity bits for mu after T eta=1_T, mu after eta T=1_T, and associativity, first for L and then for R. Each law is required at every element of every set."
            answer: "0, 1, 1, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The functor action inserts the unit inside the value component, while the unit at TX inserts it outside. Left projection preserves only the outer-unit equation, right projection only the inner-unit equation, and both operations are associative; the unchanged X-coordinate makes the calculation valid for every set. The result is 0, 1, 1, 1, 0, 1."
          - problem: "Write the full proof that the finite-list endofunctor on Set, with singleton insertion as unit and concatenation as multiplication, satisfies both monad unit laws and the associativity law. Derive the four whiskered maps T eta, eta T, T mu, and mu T, and prove the required equalities for arbitrary finite nested lists, including empty outer lists and empty entries. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (data and naturality): T sends a set X to finite lists of its elements and applies a function entrywise. Entrywise application preserves identities and composition. Define eta_X(x)=[x] and let mu_X concatenate a finite list of lists. Entrywise application commutes with singleton insertion and concatenation, so eta and mu are natural. Step 2 (T eta unit law): for w=[x_1,...,x_n], T(eta_X)(w)=[[x_1],...,[x_n]]. Concatenating gives w, proving mu_X after T(eta_X)=1_TX. When n=0 both lists are empty. Step 3 (eta T unit law): eta_TX(w)=[w]; concatenating this singleton list gives w, including when w is empty. Thus mu_X after eta_TX=1_TX. Step 4 (associativity): write an arbitrary element of TTTX as W=[W_1,...,W_r], with W_i=[w_i1,...,w_i,s_i] and each w_ij a finite list of X-elements. T(mu_X) first concatenates each W_i separately, retaining r outer entries; mu_X then concatenates those r results. By contrast, mu_TX first produces the list of all w_ij in lexicographic (i,j) order, and mu_X then concatenates those lists. Both results contain exactly the elements of w_ij, in increasing i, then increasing j, then their original internal order. Empty outer or middle lists and empty w_ij contribute no elements on either route. Hence mu_X after T(mu_X)=mu_X after mu_TX for every X, completing all three monad laws."
      - id: kp3
        name: First verifications
        key_prerequisites: [poset-monoid-categories]
        constraints: "Verify the data and laws of a monad in initial examples, including finite posets or closure operators. In a poset, check the existence of the unit and multiplication arrows before using thinness to prove the law equations. Closed items may construct the categorical object or diagnose assertions whose validity the learner must determine; the unmarked item asks for a full proof. Candidate claims must not be endorsed or explained by the stem."
        exemplars:
          - problem: "On the poset category 0<1<2, an endofunctor candidate T has value list [0, 1, 2]. Step 1: T acts on arrows and is a functor. Step 2: components of a unit Id=>T exist. Step 3: components of a multiplication TT=>T exist. Step 4: these components are natural and satisfy both unit laws and associativity, so the data define a monad. Audit the numbered assertions: does each follow from the stated data and previous justified assertions? Supply any algebra or logical deductions needed to check them. Give verdict = valid or invalid; step = the first assertion that does not follow, or 0 if they all follow."
            answer: "verdict = valid; step = 0"
            answer_contract: {"kind": "multipart", "parts": [{"name": "verdict", "contract": {"kind": "label", "options": [["valid"], ["invalid"]]}}, {"name": "step", "contract": {"kind": "exact"}}]}
            solution_sketch: "In a poset, functoriality requires monotonicity, the unit needs x<=T(x), and multiplication needs T(T(x))<=T(x). Only after these arrows exist does thinness force the naturality and monad-law diagrams to commute. The first unjustified step is 0; 0 means that all steps are justified."
