          - problem: "For the list monad on {0,1}, propose the structure map a(word) is the parity of its number of entries equal to 1, including a(empty)=0. Recover the nullary and binary operations from this map, then test the algebra unit and multiplication axioms (including empty inner words). Give the recovered unit, four binary-table entries in row-major order, the two algebra-law validity bits, and 1 if the induced structure is a group,0 otherwise."
