          - problem: "For the powerset monad, let U be a family of families of subsets of A. Match each first leg to its membership condition on a subset S of A. Tasks: (a) S in P mu(U); (b) S in mu P(U). Bank: 1=there exists V in U with S=union(V); 2=there exists V in U with S in V; 3=S is in every V in U. Give the two numbers."
