    knowledge_points:
      - id: kp1
        name: The data and the types of the whiskered transformations
        key_prerequisites: [whiskering]
        constraints: "Give the type of each whiskered transformation and its component at an object before writing any law."
        step_check:
          step: 'left whiskering applies $S$ to the component'
          question: 'Why is $(S\mu)_X$ equal to $S(\mu_X)$ and not to $\mu_{SX}$?'
          options:
            - 'Whiskering by $S$ on the left means $S$ is applied to the arrow $\mu_X$'
            - 'Whiskering on the left moves the object from $X$ to $SX$ before $\mu$ acts'
            - 'The two arrows are always equal, so either name may be used for it'
            - 'Every component $\mu_X$ of a monad is an identity arrow, so $S$ does nothing'
          answer: 'Whiskering by $S$ on the left means $S$ is applied to the arrow $\mu_X$'
          why: 'In $S\mu$ the functor $S$ is composed after $\mu$, so it acts on each arrow $\mu_X$; the component $\mu_{SX}$ comes from $\mu S$, where $S$ is composed before $\mu$.'
        try_first:
          problem: 'The unit $\eta$ of a monad $(T,\eta,\mu)$ goes from $1_{\mathcal C}$ to $T$. Whiskering it on the left by $T$ gives $T\eta$. How many copies of $T$ does the target functor of $T\eta$ contain?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The target of $T\eta$ is $T\circ T=T^2$, because $T$ is composed after the target $T$ of $\eta$. Whiskering does not change $\eta$; it only composes the functor $T$ onto its source and target.'
        exemplars:
          - problem: 'Let $(T,\eta,\mu)$ be a monad on a category $\mathcal C$. The whiskered transformation $T\mu$ is a natural transformation from $T^a$ to $T^b$. Find $a$ and $b$.'
            answer: 'a = 3; b = 2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: 'Since $\mu\colon T^2\Rightarrow T$, whiskering on the left by $T$ composes $T$ after both functors. The source becomes $T\circ T^2=T^3$ and the target becomes $T\circ T=T^2$, so $a = 3$ and $b = 2$.'
          - problem: 'A program returns a value together with a count of the warnings it has printed, so it works in the writer monad on $\mathbf{Set}$ with $T(X)=X\times\mathbb Z$, $T(f)(x,m)=(f(x),m)$, unit $\eta_A(x)=(x,0)$ and multiplication $\mu_A((x,m),n)=(x,m+n)$. For a set $A$ containing $7$, what is $(T\eta)_A(7,5)$, an element of $T(T(A))$?'
            answer: '((7, 0), 5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Left whiskering applies $T$ to the component, so $(T\eta)_A=T(\eta_A)$. Then $T(\eta_A)(7,5)=(\eta_A(7),5)=((7,0),5)$, because $T$ leaves the count $5$ alone and the unit pairs $7$ with $0$.'
          - problem: 'A second program records how many seconds it has run, so it uses the same monad: $T(X)=X\times\mathbb Z$ with $T(f)(x,m)=(f(x),m)$ and $\eta_A(x)=(x,0)$. For a set $A$ containing $4$, compute $(\eta T)_A(4,6)$.'
            answer: '((4, 6), 0)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Right whiskering re-indexes the component, so $(\eta T)_A=\eta_{T(A)}$. The unit at the set $T(A)$ pairs the whole element $(4,6)$ with $0$, so the value is $((4,6),0)$.'
          - problem: 'Let $T$ be the list monad on $\mathbf{Set}$: $T(X)$ is the set of finite lists over $X$, $\eta_A(x)=[x]$, $\mu_A$ concatenates a list of lists, and $T(f)$ applies $f$ to every entry. For $L=[[[5],[6,7]],[[8]]]$ in $T^3(A)$, what is $(\mu T)_A(L)$?'
            answer: '[[5], [6, 7], [8]]'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Right whiskering gives $(\mu T)_A=\mu_{T(A)}$, which concatenates the outer two levels of $L$. The lists $[[5],[6,7]]$ and $[[8]]$ join into $[[5],[6,7],[8]]$.'
          - problem: 'Sam claims that $T\mu$ and $\mu T$ are the same natural transformation, because both go from $T^3$ to $T^2$. Take the list monad and $L=[[[1],[2]],[[3]]]$. Is $(T\mu)_A(L)$ the same list as $(\mu T)_A(L)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "it is not", "not the same", "different", "they differ", "sam is wrong", "not equal", "they are not the same"], ["yes", "it is", "the same", "equal", "sam is right"]]}
            solution_sketch: 'Here $(T\mu)_A(L)=T(\mu_A)(L)=[[1,2],[3]]$, because $T\mu$ concatenates inside each entry. But $(\mu T)_A(L)=\mu_{T(A)}(L)=[[1],[2],[3]]$. The two lists differ, so having equal types does not make two transformations equal and the answer is no.'
          - problem: 'In the list monad (with $T(f)$ applying $f$ to every entry and $\mu_A$ concatenating), what is $(T\mu)_A(L)$ for $L=[[[4],[5,6]],[[7,8],[9]]]$?'
            answer: '[[4, 5, 6], [7, 8, 9]]'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Left whiskering gives $(T\mu)_A=T(\mu_A)$, which applies $\mu_A$ to each entry of $L$. The entries $[[4],[5,6]]$ and $[[7,8],[9]]$ become $[4,5,6]$ and $[7,8,9]$, so the result is $[[4,5,6],[7,8,9]]$.'
          - problem: 'Write the full proof that if $(T,\eta,\mu)$ is a monad on a category $\mathcal C$, then $T\mu$ and $\mu T$ are natural transformations from $T^3$ to $T^2$, $T\eta$ and $\eta T$ are natural transformations from $T$ to $T^2$, and at every object $A$ the components are $(T\mu)_A=T(\mu_A)$, $(\mu T)_A=\mu_{T(A)}$, $(T\eta)_A=T(\eta_A)$ and $(\eta T)_A=\eta_{T(A)}$. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'A monad is an endofunctor $T$ with natural transformations $\eta\colon 1_{\mathcal C}\Rightarrow T$ and $\mu\colon T^2\Rightarrow T$, where $T^3=T\circ T\circ T$. Whiskering $\mu$ on the left by $T$ gives $T\mu\colon T\circ T^2\Rightarrow T\circ T$, that is $T^3\Rightarrow T^2$, with component $(T\mu)_A=T(\mu_A)$. Whiskering on the right gives $\mu T\colon T^2\circ T\Rightarrow T\circ T$, again $T^3\Rightarrow T^2$, with component $(\mu T)_A=\mu_{T(A)}$. In the same way $T\eta\colon T\Rightarrow T^2$ has component $T(\eta_A)$ and $\eta T\colon T\Rightarrow T^2$ has component $\eta_{T(A)}$. Whiskering a natural transformation by a functor on either side is again natural, so all four transformations are natural with the stated types and components.'
      - id: kp2
        name: The three laws
        key_prerequisites: [natural-transformations]
        constraints: "Construct all three typed monad-law paths, and verify equality of both legs or recover missing lawful data. A single supplied leg followed by evaluation does not suffice."
        step_check:
          step: 'whiskering $m$ by $M$ gives $Mm\colon M^3\Rightarrow M^2$'
          question: 'Why does $Mm$ have source $M^3$ and target $M^2$?'
          options:
            - 'Because $m$ is applied twice, once for each copy of $M$ in the source functor'
            - 'Because $M$ is composed on the left of the source $M^2$ and the target $M$'
            - 'Because whiskering by $M$ removes one copy of $M$ from each functor'
            - 'Because $M$ is composed on both sides of $m$ at once, adding two copies'
          answer: 'Because $M$ is composed on the left of the source $M^2$ and the target $M$'
          why: 'Since $m\colon M^2\Rightarrow M$, composing $M$ on the left turns the source into $M\circ M^2=M^3$ and the target into $M\circ M=M^2$.'
        exemplars:
          - problem: 'The list monad on $\mathbf{Set}$ has $T(X)$ the set of finite lists over $X$, unit $\eta_X(x)=[x]$, and multiplication $\mu_X$ given by concatenation. For $w=[[[1]],[[2],[1,2]]]$ in $T^3(\mathbb N)$, what is $\mu_{\mathbb N}\big((T\mu)_{\mathbb N}(w)\big)$?'
            answer: '[1, 2, 1, 2]'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'The map $T\mu$ concatenates inside each entry of $w$, giving $[[1],[2,1,2]]$. Then $\mu$ concatenates these two lists into $[1,2,1,2]$, which is also what the other leg $\mu\circ\mu T$ gives.'
          - problem: 'A program returns its result together with a tally of the warnings it printed, so it works in $T(X)=X\times\mathbb Z$ with $T(f)(x,m)=(f(x),m)$ and multiplication $\mu((x,m),n)=(x,m+n)$. Starting a computation must not change the tally. For which integer $e$ does the unit $\eta(x)=(x,e)$ satisfy the unit law $\mu\circ T\eta=1_T$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Compute $\mu(T\eta(x,m))=\mu((x,e),m)=(x,e+m)$. For this to equal $(x,m)$ for every $m$ we need $e+m=m$, so $e=0$. The other unit law, $\mu\circ\eta T=1_T$, gives the same condition.'
          - problem: 'On $\mathbf{Set}$ let $T(X)=X\times\mathbb Z$ with $T(f)(x,m)=(f(x),m)$, unit $\eta(x)=(x,2)$, and multiplication $\mu((x,m),n)=(x,am+bn+c)$ for integers $a$, $b$, $c$. Find $a$, $b$ and $c$ so that both unit laws hold.'
            answer: 'a = 1; b = 1; c = -2'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}, {"contract": {"kind": "exact"}, "name": "c"}]}
            solution_sketch: 'The law $\mu\circ T\eta=1_T$ gives $\mu((x,2),m)=(x,2a+bm+c)=(x,m)$, so $b=1$ and $2a+c=0$. The law $\mu\circ\eta T=1_T$ gives $\mu((x,m),2)=(x,am+2b+c)=(x,m)$, so $a=1$ and $2b+c=0$. Hence $a=1$, $b=1$ and $c=-2$.'
          - problem: 'Sam proposes the multiplication $\mu((x,m),n)=(x,m-n)$ for $T(X)=X\times\mathbb Z$, with $T(f)(x,m)=(f(x),m)$. He tests associativity at $w=(((u,5),3),2)$ in $T^3(X)$. Let $l$ be the count in the second slot of $\mu(T\mu(w))$ and $r$ the count in the second slot of $\mu(\mu_{T(X)}(w))$. Find $l$ and $r$.'
            answer: 'l = 0; r = 4'
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "l"}, {"contract": {"kind": "exact"}, "name": "r"}]}
            solution_sketch: 'First $T\mu(w)=((u,5-3),2)=((u,2),2)$, and $\mu$ gives $(u,2-2)=(u,0)$, so the first count is $0$. Next $\mu_{T(X)}(w)=((u,5),3-2)=((u,5),1)$, and $\mu$ gives $(u,5-1)=(u,4)$, so the second count is $4$. The counts $0$ and $4$ differ, so this multiplication is not associative.'
          - problem: 'Let $T$ be the list functor with unit $\eta(x)=[x]$. A candidate multiplication $\nu$ joins a list of lists by concatenating in reverse order, so $\nu([[1,2],[3]])=[3,1,2]$. What is $\nu\big(T\eta([1,2,3])\big)$?'
            answer: '[3, 2, 1]'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'The map $T\eta$ wraps every entry in a list, so $T\eta([1,2,3])=[[1],[2],[3]]$. Reversed concatenation gives $\nu([[1],[2],[3]])=[3,2,1]$, which is not $[1,2,3]$. So the unit law $\nu\circ T\eta=1_T$ fails.'
          - problem: 'Let $T(X)=X\times\{0,1\}$ with $T(f)(x,m)=(f(x),m)$ and $\eta(x)=(x,0)$. A candidate multiplication $L$ keeps the inner entry, $L((x,m),n)=(x,m)$. What is $L\big(T\eta(3,1)\big)$?'
            answer: '(3, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The map $T\eta$ gives $T\eta(3,1)=((3,0),1)$, and $L$ keeps the inner pair, so $L((3,0),1)=(3,0)$. The unit law $L\circ T\eta=1_T$ would need $(3,1)$, so this law fails for $L$.'
          - problem: 'Let $T(X)=X\times\mathbb N$ with $T(f)(x,m)=(f(x),m)$, unit $\eta(x)=(x,0)$ and multiplication $\mu((x,m),n)=(x,\max(m,n))$. Do the three monad laws hold?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "they are", "true", "holds", "all hold", "they hold", "the laws hold"], ["no", "it is not", "they are not", "false", "fails", "not all hold", "they do not hold", "the laws do not hold"]]}
            solution_sketch: 'The unit laws reduce to $\max(0,m)=m=\max(m,0)$ for every $m$ in $\mathbb N$. Associativity reduces to $\max(\max(m,n),p)=\max(m,\max(n,p))$. All three equations are true, so the answer is yes; this is the writer monad over the monoid $(\mathbb N,\max,0)$.'
          - problem: 'Write the full proof that the finite-list endofunctor on $\mathbf{Set}$, with singleton insertion as unit and concatenation as multiplication, satisfies both monad unit laws and the associativity law. Derive the four whiskered maps $T\eta$, $\eta T$, $T\mu$ and $\mu T$, and prove the required equalities for arbitrary finite nested lists, including empty outer lists and empty entries. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The functor $T$ sends $X$ to finite lists over $X$ and applies a function entrywise, which preserves identities and composition. Entrywise application commutes with singleton insertion and concatenation, so $\eta$ and $\mu$ are natural. For $w=[x_1,\dots,x_n]$ we have $T(\eta_X)(w)=[[x_1],\dots,[x_n]]$, and concatenating gives $w$, also when $w$ is empty. Also $\eta_{TX}(w)=[w]$, and concatenating this one-entry list gives $w$. For associativity write an element of $T^3X$ as $[W_1,\dots,W_r]$ with each $W_i$ a list of words. The leg $\mu\circ T\mu$ concatenates each $W_i$ first and then the results, while $\mu\circ\mu T$ concatenates the outer level first. Both read out the same letters in the same order, and empty lists contribute no letters, so all three laws hold.'
      - id: kp3
        name: First verifications
        key_prerequisites: [poset-monoid-categories]
        constraints: "Verify the data and laws of a monad in initial examples, including finite posets or closure operators. In a poset, check the existence of the unit and multiplication arrows before using thinness to prove the law equations. Closed items may construct the categorical object or diagnose assertions whose validity the learner must determine; the unmarked item asks for a full proof. Candidate claims must not be endorsed or explained by the stem."
        step_check:
          step: 'Both sides are maps $T^3X\to TX$, so compare them on the four kinds of element of $T^3X$'
          question: 'Why are there exactly four kinds of element of $T^3X$ to compare?'
          options:
            - 'Four is the number of monad laws, with one kind of element for each law'
            - 'Because $T^3X$ is built from three copies of $X$ and one single bottom'
            - 'Each application of $T$ adds one bottom, besides the elements of $X$'
            - 'Because a set $X$ can contribute only four different elements to $T^3X$'
          answer: 'Each application of $T$ adds one bottom, besides the elements of $X$'
          why: '$T^3X$ is $X$ with three new points adjoined, one by each $T$, so an element is either some $x\in X$ or one of the three bottoms.'
        exemplars:
          - problem: 'Regard the poset $\{0<1<2\}$ as a category, with exactly one morphism $a\to b$ when $a\le b$. Let $T$ send the objects $0,1,2$ to $1,1,2$. Is $T$ a monad on this category?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "they are", "true", "holds", "all hold", "it is a monad", "a monad"], ["no", "it is not", "they are not", "false", "fails", "not all hold", "not a monad", "it is not a monad"]]}
            solution_sketch: 'The assignment is monotone, so $T$ is a functor. Unit morphisms $x\to T(x)$ exist because $0\le 1$, $1\le 1$ and $2\le 2$. Multiplication morphisms $T(T(x))\to T(x)$ exist because $T(T(x))=T(x)$ for each $x$. A poset has at most one morphism between two objects, so the three laws hold automatically and the answer is yes.'
          - problem: 'On the same poset category $\{0<1<2\}$, let $T$ send the objects $0,1,2$ to $1,2,2$. Is $T$ a monad?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "they are", "true", "holds", "all hold", "it is a monad", "a monad"], ["no", "it is not", "they are not", "false", "fails", "not all hold", "not a monad", "it is not a monad"]]}
            solution_sketch: 'The assignment is monotone and every unit morphism $x\to T(x)$ exists. But $T(T(0))=T(1)=2$ and $T(0)=1$, and there is no morphism $2\to 1$. So the multiplication $\mu_0\colon T(T(0))\to T(0)$ does not exist and the answer is no.'
          - problem: 'On the poset category $\{0<1<2\}$ let $T$ send the objects $0,1,2$ to $0,0,2$. At which object $x$ is there no unit morphism $x\to T(x)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A unit morphism $x\to T(x)$ exists exactly when $x\le T(x)$. This holds for $x=0$ and $x=2$, but $T(1)=0$ and $1\le 0$ is false. So the object is $1$.'
          - problem: 'The subsets of $\{1,2,3\}$ ordered by inclusion form a poset category, and $T(X)=X\cup\{1\}$ is a monad on it. For how many subsets $X$ is $T(X)=X$, so that the unit $\eta_X\colon X\to T(X)$ is an identity morphism?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $T(X)=X$ exactly when $1\in X$. The subsets of $\{1,2,3\}$ containing $1$ are $\{1\}$, $\{1,2\}$, $\{1,3\}$ and $\{1,2,3\}$, so there are $4$ of them.'
          - problem: 'Prices in whole dollars form a poset under $\le$, with one morphism $m\to n$ when $m\le n$. A shop rounds every price up to the next multiple of $5$, so $T(n)=5\lceil n/5\rceil$, and $T$ is a monad on this poset. What is $T(T(12))$, the source of the multiplication morphism $\mu_{12}\colon T(T(12))\to T(12)$?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Rounding $12$ up to a multiple of $5$ gives $T(12)=15$. Since $15$ is already a multiple of $5$, $T(15)=15$, so $T(T(12))=15$. The multiplication $\mu_{12}$ is the identity morphism on $15$.'
          - problem: 'In the same poset of prices, a shop instead rounds each price to the nearest multiple of $10$, with halves rounding up, so $T(n)=10\lfloor (n+5)/10\rfloor$. A unit morphism $n\to T(n)$ exists only when $n\le T(n)$. For how many prices $n$ from $1$ to $30$ is there no unit morphism?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A price fails when it rounds down. For $n=1,\dots,4$ we get $T(n)=0$, for $n=11,\dots,14$ we get $T(n)=10$, and for $n=21,\dots,24$ we get $T(n)=20$, each below $n$. Every other price from $1$ to $30$ rounds up or stays, so there are $4+4+4=12$ prices without a unit morphism.'
          - problem: 'On the poset category $\{0<1<2\}$, for which object $c$ is the constant functor $T(x)=c$ a monad?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A unit morphism $x\to c$ must exist for every object $x$, in particular for $x=2$, so $2\le c$ and $c=2$. For $c=2$ every multiplication morphism is the identity on $2$ and the laws hold because the category is a poset.'
          - problem: 'Write the full proof that the identity endofunctor $1_{\mathcal C}$ on a category $\mathcal C$, with $\eta$ and $\mu$ both the identity transformation, satisfies all three monad laws. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'With $T=1_{\mathcal C}$ the composite $T\circ T$ is again the identity functor, and $\eta$ and $\mu$ are the identity transformation on it. Whiskering an identity transformation gives an identity, so $T\mu$, $\mu T$, $T\eta$ and $\eta T$ are all identity transformations. The associativity law reads identity after identity on both sides, so the two sides agree. Each unit law also reads identity after identity and equals the identity transformation on $T$. So all three laws hold.'
    diagnostic_exemplar:
      problem: "Regard $(\\mathcal P(S),\\subseteq)$ as a poset category and fix a subset $K\\subseteq S$. Define $T(X)=X\\cup K$. Show that $T$ carries the structure of a monad $(T,\\eta,\\mu)$: give the component of $\\eta$ and of $\\mu$ at $X$, give the component of the whiskered transformation $\\mu T$ at $X$ with its type, and check the three monad laws."
      answer: "$T$ is monotone ($X\\subseteq Y$ gives $X\\cup K\\subseteq Y\\cup K$), so it is an endofunctor of the poset category. Unit: $X\\subseteq X\\cup K$, so there is an arrow $\\eta_X\\colon X\\to TX$, and it is the unique one. Since $T^2X=(X\\cup K)\\cup K=X\\cup K=TX$, the arrow $\\mu_X\\colon T^2X\\to TX$ is the identity arrow of $X\\cup K$. Whiskering: $(\\mu T)_X=\\mu_{TX}\\colon T^3X\\to T^2X$, the unique arrow $T(X\\cup K)=X\\cup K\\to X\\cup K$, i.e. again the identity arrow (whereas $(T\\mu)_X=T(\\mu_X)$ is the same arrow here only because $T$ is idempotent on these objects). Laws: $\\mu\\circ T\\mu=\\mu\\circ\\mu T$ ($T^3\\Rightarrow T$) and $\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T$ ($T\\Rightarrow T$) are equations between parallel arrows of a poset category, whose hom-sets have at most one element, so all three hold automatically. Hence $(T,\\eta,\\mu)$ is a monad — precisely the closure operator $X\\mapsto X\\cup K$ (monotone, inflationary, idempotent)."
      solution_sketch: "Note first that $T^2X=TX$ here, so $\\mu_X$ and every whiskering of it are identity arrows on $X\\cup K$. Then the real point: in a thin category all three monad laws are equations between parallel arrows and hold automatically — this monad is precisely the closure operator $X\\mapsto X\\cup K$."
    anki_seeds:
      - front: "A monad is an endofunctor $T$ with two natural transformations: a unit {{c1::$\\eta\\colon 1\\Rightarrow T$}} and a multiplication {{c2::$\\mu\\colon T^2\\Rightarrow T$}}."
        back: "$\\eta\\colon 1\\Rightarrow T$; $\\mu\\colon T^2\\Rightarrow T$"
        type: cloze
      - front: "State the associativity law of a monad $(T,\\eta,\\mu)$."
        back: "$\\mu\\circ T\\mu=\\mu\\circ\\mu T$."
        type: basic
      - front: "State the unit laws of a monad $(T,\\eta,\\mu)$."
        back: "$\\mu\\circ T\\eta=1_T=\\mu\\circ\\eta T$."
        type: basic

  - id: monads
    name: Monads
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: monad-definition-laws
        weight: 0.6
        key: true
      - id: natural-transformations
        weight: 0.4
        key: true
      - id: functors
        weight: 0.3
        key: true
