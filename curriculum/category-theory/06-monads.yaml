    knowledge_points:
      - id: kp1
        name: Definition
        key_prerequisites: [exponential-objects]
        constraints: "Construct terminal objects, products and exponentials through their universal properties. Exponential tasks must reconstruct evaluation, unique transposes, or the right-adjoint condition rather than receive the needed formula."
        exemplars:
          - problem: "C is the chain 0<1<2 as a category. Construct the three ingredients of a cartesian closed structure: its terminal object, product of 1 and 2, and exponential 0^1. Derive the exponential by its adjoint hom-set condition. Give the three object numbers."
            answer: "2, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Terminal objects and products are recovered by their universal arrows. The exponential represents maps from a product with 1 into 0. The result is 2, 1, 0."
          - problem: "For a proposed exponential E of B by A with evaluation ev:E x A->B, reconstruct the factorization demanded for f:X x A->B. Bank: 1=g x 1_A:X x A->E x A; 2=ev:E x A->B; 3=1_A x g:A x X->A x E; 4=g:X->E. Give the factorization path and the number of g maps permitted for each f."
            answer: "1, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The exponential requires exactly one transpose g whose product with the identity evaluates to f. Both existence and uniqueness are part of the structure. The result is 1, 2, 1."
          - problem: "In Set let A=[0, 1],B=[0, 1]. Candidate objects E carry evaluation E x A->B; each table below gives one row per E-point, in A-order. Candidate 1: [[0, 0], [0, 1], [1, 0], [1, 1]]; Candidate 2: [[0, 0], [0, 1], [1, 0]]; Candidate 3: [[0, 0], [0, 1], [1, 0], [1, 1], [1, 1]]. Test the exponential universal property for every set X: every f:X x A->B must admit exactly one transpose X->E. For each candidate give two bits, existence for all f then uniqueness whenever a transpose exists. List the pairs in candidate order."
            answer: "1, 1, 0, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Testing singleton X detects missing and duplicate A-rows. For general X, a transpose independently chooses the unique row for each point, so row completeness and uniqueness are exactly the two universal-property clauses. The result is 1, 1, 0, 1, 1, 0."
          - problem: "In Set let A=[0],B=[0, 1, 2]. Candidate objects E carry evaluation E x A->B; each table below gives one row per E-point, in A-order. Candidate 1: [[0], [2]]; Candidate 2: [[0], [1], [2]]; Candidate 3: [[0], [0], [1], [2]]. Test the exponential universal property for every set X: every f:X x A->B must admit exactly one transpose X->E. For each candidate give two bits, existence for all f then uniqueness whenever a transpose exists. List the pairs in candidate order."
            answer: "0, 1, 1, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Testing singleton X detects missing and duplicate A-rows. For general X, a transpose independently chooses the unique row for each point, so row completeness and uniqueness are exactly the two universal-property clauses. The result is 0, 1, 1, 1, 1, 0."
          - problem: "Regard subsets of {1,2,3,4,5} as a category by inclusion. Construct the exponential Y^X using its right-adjoint universal property, for X={1,2,3},Y={3,4}. Give the number of elements in the resulting subset; neither its formula nor the adjoint condition is supplied."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (universal property in a poset): Y^X is the largest subset Z with the intersection of Z and X contained in Y. Step 2 (test each element): 1 and 2 cannot lie in Z, since they are in X but not in Y; 3 is allowed, since it lies in Y; 4 and 5 are outside X and always allowed. Step 3 (largest subset): the largest Z is {3, 4, 5}. The answer is 3."
          - problem: "In a cartesian closed category, derive the relationship between global elements of B^A and arrows A->B by the exponential universal property. Then in Set with |A|=2,|B|=5, determine how many such global elements there are."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (right adjoint bijection): in a cartesian closed category there is a bijection between the morphisms from X x A to B and the morphisms from X to B^A. Step 2 (take X = 1): with the terminal object 1, the morphisms 1 -> B^A are the global elements, and they correspond to the morphisms from A to B. Step 3 (count in finite sets): B^A is the set of functions from a 2-element set to a 5-element set, so it has 5 x 5 = 25 elements. The answer is 25."
          - problem: "Write the full proof: a category with a terminal object and all binary products is cartesian closed exactly when, for each object A, the functor taking X to X x A has a right adjoint, and then each exponential B^A carries an evaluation map whose transpose exists and is unique. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (definition): a cartesian closed category has a terminal object 1, all binary products, and for each object A a right adjoint to the functor sending X to X x A. Step 2 (adjunction): this right adjoint assigns to each object B an object B^A together with a bijection between the morphisms from X x A to B and the morphisms from X to B^A, natural in X and B. Step 3 (evaluation): take X = B^A and the identity on B^A; its inverse image under the bijection is a morphism ev from B^A x A to B, the evaluation map. Step 4 (currying): for any morphism f from X x A to B, let g from X to B^A be its image under the bijection; naturality in X gives ev composed with (g x 1_A) = f. Step 5 (uniqueness): the bijection is injective, so this g is the unique transpose of f. Step 6 (converse): if evaluation maps with unique transposes exist for all A and B, then currying is a bijection, so B^A is the value at B of a right adjoint to the functor X x A; together with 1 and the binary products, the category is cartesian closed."
      - id: kp2
        name: Set is cartesian closed
        key_prerequisites: [products-coproducts]
        constraints: "Build Set exponentials through evaluation and unique currying. Refute cartesian closure in additive categories by deriving a specific failure of initial-object preservation for - x A."
        exemplars:
          - problem: "In Set let A=[0, 1],B=[0, 1]. Candidate objects E carry evaluation E x A->B; each table below gives one row per E-point, in A-order. Candidate 1: [[0, 0], [1, 1]]; Candidate 2: [[1, 0], [0, 1], [0, 0], [1, 1]]; Candidate 3: [[0, 0], [0, 0]]. Test the exponential universal property for every set X: every f:X x A->B must admit exactly one transpose X->E. For each candidate give two bits, existence for all f then uniqueness whenever a transpose exists. List the pairs in candidate order."
            answer: "0, 1, 1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Testing singleton X detects missing and duplicate A-rows. For general X, a transpose independently chooses the unique row for each point, so row completeness and uniqueness are exactly the two universal-property clauses. The result is 0, 1, 1, 1, 0, 0."
          - problem: "For arbitrary sets A,B, let E be the set of all functions A->B. Audit this proposed construction of the exponential. Step 1: define ev:E times A->B by ev(u,a)=u(a). Step 2: for every f:X times A->B define g:X->E by assigning to x the function a->f(x,a); then ev after (g times 1_A)=f. Step 3: if h:X->E has the same evaluation composite, equality at every a and function extensionality imply h(x)=g(x) for every x, hence h=g. Step 4: precomposing f by k times 1_A changes g to g after k, so the correspondence is natural in X and establishes the product-exponential adjunction. This includes empty A,B,X. Which step is the first whose assertion or stated reason fails?"
            answer: "All valid"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Evaluation determines each value of a transpose, and function extensionality gives uniqueness. The same pointwise construction commutes with every change of X; empty sets introduce no additional choices or exceptions. All four steps are justified."
          - problem: "In Set let A=[0],B=[0, 1]. Candidate objects E carry evaluation E x A->B; each table below gives one row per E-point, in A-order. Candidate 1: [[0], [1]]; Candidate 2: [[1], [1]]; Candidate 3: [[0], [1], [0]]. Test the exponential universal property for every set X: every f:X x A->B must admit exactly one transpose X->E. For each candidate give two bits, existence for all f then uniqueness whenever a transpose exists. List the pairs in candidate order."
            answer: "1, 1, 0, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Testing singleton X detects missing and duplicate A-rows. For general X, a transpose independently chooses the unique row for each point, so row completeness and uniqueness are exactly the two universal-property clauses. The result is 1, 1, 0, 0, 1, 0."
          - problem: "Let X = {p, q}, A = {1, 2}, and B = {0, 1}. Define a function f from X × A to B by f(p, a) = 0 for every a in A, and f(q, a) = 1 for every a in A. Currying sends f to its transpose g, a function from X to the exponential B^A. Give the value g(q)(2)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Currying rule: the transpose g of f is defined by g(x)(a) = f(x, a) for every x in X and every a in A. Evaluate at x = q and a = 2: g(q)(2) = f(q, 2), and f(q, 2) = 1 by the definition of f. The answer is 1."
          - problem: "A claim says Ab is cartesian closed. Step 1: its trivial group is terminal. Step 2: finite products exist. Step 3: these two properties ensure every - x A has a right adjoint. Step 4: Ab is cartesian closed. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "For A=Z/2, the functor - x A sends the initial trivial group to a nontrivial group. It cannot be a left adjoint, so no right adjoint supplies this exponential. This is the first unsupported step."
          - problem: "For the Set currying proof, reconstruct both triangle maps. Bank: 1=x->(a->(x,a)); 2=(g,a)->g(a); 3=x->(a->x); 4=(x,a)->a. Give the unit and counit formula numbers in that order."
            answer: "1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The unit is the transpose of the product identity; the counit is the inverse transpose of the exponential identity. These formulas give the two inverse currying operations. The result is 1, 2."
          - problem: "Write the full proof: the category Set is cartesian closed, with exponential B^A the set of all functions from A to B and currying as the adjunction. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (terminal object): a singleton set 1 is terminal, because every set admits exactly one function to it. Step 2 (products): cartesian products of sets, with their projection maps, give all finite products. Step 3 (exponential): for sets A and B, define B^A as the set of all functions from A to B, with the evaluation map ev from B^A × A to B sending a pair (h, a) to h(a). Step 4 (currying): given f from X × A to B, define its transpose g from X to B^A by g(x)(a) = f(x, a); conversely, given h from X to B^A, set the value at (x, a) to h(x)(a). These two constructions are mutually inverse, so Hom(X × A, B) is in bijection with Hom(X, B^A), naturally in X. Step 5 (adjunction): this natural bijection shows that the functor − × A is left adjoint to the exponential functor (−)^A. Step 6 (conclusion): Set has a terminal object, all finite products, and all exponentials, so Set is cartesian closed."
      - id: kp3
        name: The Curry-Howard-Lambek correspondence
        key_prerequisites: [adjunctions]
        constraints: "Translate contexts, function types, closed terms, abstraction and application to their CCC counterparts. Grade the categorical types and beta/eta equations; derive implication in poset models through the exponential universal property."
        exemplars:
          - problem: "Under the Curry-Howard-Lambek correspondence, each notion of the simply typed lambda calculus is paired with its counterpart in a cartesian closed category. Check the following four pairings. First, the function type A -> B pairs with the exponential object B^A. Second, a closed term of type A -> B pairs with a global element 1 -> B^A. Third, the beta-rule of application pairs with the law ev o (cur(f) x 1_A) = f. Fourth, the product type A x B pairs with the coproduct A + B. How many of these four pairings are correct?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Recall the full dictionary: types are objects, terms are morphisms, product types are products, function types are exponentials, and application is the evaluation map ev with cur(f) the transpose (statement of the Curry-Howard-Lambek correspondence). Check each pairing against it. The first pairing is correct: the function type A -> B is the exponential B^A. The second is correct: a closed term is a global element 1 -> B^A. The third is correct: beta is the law ev o (cur(f) x 1_A) = f. The fourth is wrong: a product type pairs with the categorical product A x B, while the coproduct interprets the disjunction. The answer is 3."
          - problem: "Translate the Curry-Howard-Lambek notions (a) function type A->B, (b) a closed term of that type, (c) application. Bank: 1=object B^A; 2=arrow 1->B^A; 3=ev:B^A x A->B; 4=object A+B; 5=arrow B->A. Give the three numbers."
            answer: "1, 2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Function abstraction is represented by exponentials, closed terms have terminal context, and evaluation interprets application. The result is 1, 2, 3."
          - problem: "A typed lambda term has free variables x:A,y:B and result C. Curry only y. Match the original categorical arrow and its curried arrow to bank 1=A x B->C; 2=A->C^B; 3=B->C^A; 4=1->C^(A x B). Give the two numbers."
            answer: "1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A context is interpreted as a product. Abstracting y moves its B-factor into the exponential codomain and retains the free A-variable. The result is 1, 2."
          - problem: "Use Curry-Howard-Lambek to interpret the formula (P implies Q) and the term application rule in the chain category 0<1<2. Let P=2,Q=1. Recover the object interpreting implication and test modus ponens categorically: for each context R=0,1,2, decide whether an arrow R->(P implies Q) exists, and whether an arrow R x P->Q exists. Give the implication object followed by the three pairs of arrow-existence bits. No exponential or implication formula is supplied."
            answer: "1, 1, 1, 1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Translate implication to an exponential and conjunction/context extension to product. The adjoint universal property equates implication introduction with application; the two arrow conditions express that proof rule at every context. The result is 1, 1, 1, 1, 1, 0, 0."
          - problem: "Translate beta reduction for a term f:Gamma x A->B after abstracting its A-variable. Bank: 1=lambda f:Gamma->B^A; 2=lambda f x 1_A:Gamma x A->B^A x A; 3=ev:B^A x A->B; 4=f:Gamma x A->B. Give the two-arrow application path, followed by the arrow to which beta equates it."
            answer: "2, 3, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Categorical beta is the evaluation factorization of the transpose. It interprets applying an abstraction and recovering the original term. The result is 2, 3, 4."
          - problem: "Step 1: interpret A->B as exponential B^A. Step 2: interpret a term with context A and result B as A->B. Step 3: interpret a closed function term directly as an arrow with source A, with no change of context. Step 4: application is interpreted by evaluation. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "A closed function term has terminal context and hence type 1->B^A. Its corresponding uncurried A->B arrow is obtained through the exponential adjunction. This is the first unsupported step."
          - problem: "Write the full proof: in a cartesian closed category with a terminal object 1, currying gives a bijection between the morphisms A -> B and the global elements 1 -> B^A whose inverse is application, ev o (g x 1_A), the beta-rule being the inverse law ev o (cur(f) x 1_A) = f and the eta-rule the uniqueness of the transpose; under the Curry-Howard-Lambek correspondence this says that a closed term of type A -> B is the same data as a term with one free variable of type A. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (universal property of the exponential): for every object C, currying is a bijection from morphisms C x A -> B to morphisms C -> B^A, sending f to its lambda abstraction cur(f); the inverse sends h to ev o (h x 1_A), and the law ev o (cur(f) x 1_A) = f is part of the property. Step 2 (take C = 1): the terminal object gives an isomorphism between 1 x A and A, so composing with it identifies morphisms 1 x A -> B with morphisms A -> B. Step 3 (compose the bijections): a global element g: 1 -> B^A matches the morphism A -> B obtained as ev o (g x 1_A), and a morphism f: A -> B, read along the isomorphism, matches its transpose cur(f): 1 -> B^A. Step 4 (cancellation laws): Step 1 with C = 1 gives ev o (cur(f) x 1_A) = f, the beta-rule, and uniqueness of the transpose gives cur(ev o (h x 1_A)) = h, the eta-rule; therefore the two constructions of Step 3 are inverse. Step 5 (Curry-Howard-Lambek reading): a closed term of type A -> B is a global element 1 -> B^A, and a term with one free variable of type A is a morphism A -> B, so the bijection says that closed terms of the function type are exactly the unary terms, with beta computing application and eta expressing uniqueness of the abstraction. Conclusion: currying at the terminal object is the bijection, evaluation is its inverse, and beta and eta are the two cancellation laws."
    diagnostic_exemplar:
      problem: "In a cartesian closed category with terminal object $1$, prove that the global elements $1\\to B^A$ correspond bijectively to the morphisms $A\\to B$, and explain what this correspondence says under the Curry-Howard-Lambek reading."
      answer: "The universal property of $B^A$ says every $g\\colon X\\times A\\to B$ equals $\\mathrm{ev}\\circ(\\lambda g\\times 1_A)$ for a unique $\\lambda g\\colon X\\to B^A$; that is, currying is a bijection $\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$. Take $X=1$: $\\mathrm{Hom}(1,B^A)\\cong\\mathrm{Hom}(1\\times A,B)$. The projection $\\pi_A\\colon 1\\times A\\to A$ is an isomorphism, with inverse $\\langle{!}_A,1_A\\rangle$ where ${!}_A\\colon A\\to 1$ is the unique such map: $\\pi_A\\circ\\langle{!}_A,1_A\\rangle=1_A$ by the product's equations, and $\\langle{!}_A,1_A\\rangle\\circ\\pi_A=1_{1\\times A}$ because both sides are maps into $1\\times A$ whose two components agree (the $1$-component by terminality, the $A$-component by $\\pi_A$). Composing, $\\mathrm{Hom}(1,B^A)\\cong\\mathrm{Hom}(1\\times A,B)\\cong\\mathrm{Hom}(A,B)$, explicitly $t\\mapsto\\mathrm{ev}\\circ(t\\times 1_A)\\circ\\langle{!}_A,1_A\\rangle$. Under Curry-Howard-Lambek, $B^A$ is the type $A\\to B$, a global element $1\\to B^A$ is a closed term of that type, and the bijection is application followed by $\\beta$-conversion, $\\mathrm{ev}\\circ(\\lambda f\\times 1_A)=f$: a closed function term is the same thing as the morphism it computes. In $\\mathbf{Set}$ this is the familiar identification of elements of the function set $B^A$ with functions $A\\to B$."
      solution_sketch: "Set $X=1$ in the currying bijection, then remove the $1$ using the isomorphism $1\\times A\\cong A$, which you verify from the product equations and terminality. Reading the composite bijection back says that a closed term of function type is the same thing as the morphism it computes."
    anki_seeds:
      - front: "A cartesian closed category has a {{c1::terminal object}}, {{c2::binary products}}, and {{c3::exponentials}} ($-\\times A\\dashv(-)^A$)."
        back: "terminal object; binary products; exponentials"
        type: cloze
      - front: "CCCs model the {{c1::simply typed lambda calculus}} (Curry-Howard-Lambek)."
        back: "simply typed lambda calculus"
        type: cloze

  - id: presheaves-intro
    name: A First Look at Presheaves
    core: false
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: yoneda-embedding
        weight: 0.4
        key: true
      - id: functor-categories
        weight: 0.4
        key: true
      - id: covariant-contravariant-functors
        weight: 0.2
      - id: limits-colimits
        weight: 0.2
      - id: category-of-elements
        weight: 0.0             # R-58: kp2's density statement is indexed by ∫P — the learner must read the (presheaf-convention) ∫F taught there, but no exemplar computes in it
    knowledge_points:
      - id: kp1
        name: The presheaf category and representables
        key_prerequisites: [functor-categories]
        constraints: "Presheaves are functors $\\mathcal C^{op}\\to\\mathbf{Set}$ with natural transformations as morphisms; representables are $\\mathrm{Hom}(-,A)$, and any full-faithfulness claim is decided by instantiating the Yoneda lemma at a second representable and evaluating the resulting bijection — never asserted."
        exemplars:
          - problem: "C has a<c and b<c, with a,b incomparable. Construct the representable presheaf y(c), including its restriction maps. Order objects a,b,c as 0,1,2. Give its component cardinalities, followed by the cardinalities of the domains of restrictions along a->c and b->c."
            answer: "1, 1, 1, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Representable components are incoming-arrow sets, and restrictions precompose with the given category arrows. This constructs the entire small presheaf data. The result is 1, 1, 1, 1, 1."
          - problem: "Let C be the category built from the poset with elements a, b, c whose only strict order relations are a < c and b < c, so an arrow x -> y exists exactly when x <= y. Let y_a = Hom(-, a) and y_c = Hom(-, c) be the representable presheaves. Instantiating the Yoneda lemma at the second representable, how many natural transformations are there from y_c to y_a?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma: Nat(y_c, P) is in bijection with P(c) for every presheaf P. Instantiate at the second representable, P = y_a: Nat(y_c, y_a) is in bijection with y_a(c) = Hom(c, a). In this poset c <= a fails, so there is no arrow c -> a and Hom(c, a) is empty. Hence Nat(y_c, y_a) is empty, and it matches the hom-set Hom(c, a), which is the full-faithfulness statement for the Yoneda embedding. The answer is 0."
          - problem: "A small category C has two objects X and Y and exactly one arrow f : X -> Y besides the identities. A presheaf P on C is given by P(X) = {1, 2, 3}, P(Y) = {u, v}, and the map P(f) : P(Y) -> P(X) sending u to 1 and v to 2. Let y_X = Hom(-, X) be the representable at X. How many natural transformations are there from y_X to P?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma: for any presheaf P and object A, the map sending a natural transformation beta : y_A -> P to beta_A(id_A) is a bijection from Nat(y_A, P) to P(A). Here A = X, and P(X) = {1, 2, 3} has 3 elements. Each of the 3 elements gives exactly one natural transformation from y_X to P, and there are no others. The answer is 3."
          - problem: "Let C be the category built from the chain 1 <= 2 <= 3, so there is one arrow m -> n whenever m <= n. A presheaf P on C is a contravariant functor to Set, given on objects by P(1) = {z}, P(2) = {w, s}, P(3) = {u, v}. The arrow 2 -> 3 of C induces one map between two of these sets. State which map P produces for this arrow, and give the number of elements of its domain."
            answer: "map = P3toP2; domain = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["P3toP2"], ["P2toP3"]]}, "name": "map"}, {"contract": {"kind": "exact"}, "name": "domain"}]}
            solution_sketch: "A presheaf is a functor from C^op to Set, so it reverses the direction of every arrow: this is the contravariance rule for presheaves. The arrow 2 -> 3 in C is an arrow 3 -> 2 in C^op, so P produces the map P(3) -> P(2), not the map P(2) -> P(3), which the covariant direction would give. The domain is P(3) = {u, v}, a set with 2 elements. The answer is map = P3toP2; domain = 2."
          - problem: "Claim: on the category with two objects X, Y and one arrow f : X -> Y besides identities, the following data defines a presheaf P : C^op -> Set. Step 1: set P(X) = {1} and P(Y) = {u, v}. Step 2: for the arrow f : X -> Y, define P(f) : P(X) -> P(Y) to be the map sending 1 to u. Step 3: check that P(id_X) and P(id_Y) are identity maps, as functoriality requires. Step 4: conclude that P is a presheaf. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 only names the sets P(X) and P(Y), which is a legal start. Step 2 is the first invalid step: a presheaf acts on C^op, so the arrow f : X -> Y must induce a map P(f) : P(Y) -> P(X), and the claimed direction P(X) -> P(Y) is covariant, the wrong variance. Step 3 is a true requirement that any functor must satisfy. Step 4 is only the conclusion and fails solely because of the error in Step 2. The answer is Step 2."
          - problem: "On a category C with objects X, Y and exactly one nonidentity arrow f : X -> Y, define a presheaf P by P(X) = {1, 2}, P(Y) = {u, v, w}, with P(f) : P(Y) -> P(X) mapping u to 1, v to 1, and w to 2. Let y_Y = Hom(-, Y) and let alpha : y_Y -> P be the natural transformation whose component at Y sends id_Y to w. Find the value of alpha_X at f."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Naturality for alpha at the arrow f : X -> Y gives the commuting square P(f) o alpha_Y = alpha_X o y_Y(f), where o is composition; this is the naturality condition for transformations of presheaves. The representable acts by precomposition, so y_Y(f) sends id_Y to f. Therefore alpha_X(f) = alpha_X(y_Y(f)(id_Y)) = P(f)(alpha_Y(id_Y)) = P(f)(w). The restriction map P(f) sends w to 2. The answer is 2."
          - problem: "Write the full proof: for a small category C, the Yoneda embedding y : C -> [C^op, Set], which sends an object A to the representable Hom(-, A), is fully faithful; derive this by instantiating the Yoneda lemma at a second representable Hom(-, B). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (Yoneda lemma): for every presheav P : C^op -> Set and every object A, the function alpha -> alpha_A(id_A) is a bijection from Nat(Hom(-, A), P) to P(A). Step 2 (instantiate at a second representable): take P = Hom(-, B); the bijection becomes Nat(yA, yB) -> Hom(-, B)(A) = Hom(A, B). Step 3 (trace the map): an arrow g : A -> B corresponds to the natural transformation whose component at C sends h : C -> A to g o h, by postcomposition. Step 4 (conclusion): the composite Hom(A, B) -> Nat(yA, yB) -> Hom(A, B) is the identity on hom-sets, so y is full and faithful, and C sits inside the presheaf category as the full subcategory of representables."
      - id: kp2
        name: Completeness and density
        key_prerequisites: [limits-colimits]
        constraints: "Construct both object values and restriction maps of pointwise presheaf limits/colimits. Use Yoneda to identify density cocone components; do not state pointwise formulas before requesting only cardinality arithmetic."
        exemplars:
          - problem: "C has arrow a->b. Presheaves P,Q have P(b)={0,1},P(a)={0,1},restriction [1,0], and Q(b)={2},Q(a)={2,3},restriction [3]. Construct their coproduct presheaf. Encode tagged P-elements by 10+x and Q-elements by 20+x. Give its restriction values on b-elements 10,11,22."
            answer: "11, 10, 23"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Pointwise coproducts use disjoint tags; functoriality forces each restriction to act within its summand. The tagged injections are natural and satisfy the coproduct property. The result is 11, 10, 23."
          - problem: "C has arrow a->b. Presheaves P,Q have P(b)={0,1},P(a)={0,1},restriction [1,0], and Q(b)={0,1},Q(a)={0,1},restriction [0,0]. Construct the product presheaf restriction. Number pairs at each object lexicographically from 0 and give its value list."
            answer: "2, 2, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two projection naturality squares force the product restriction to act componentwise. Its pointwise product universal property then yields the presheaf product. The result is 2, 2, 0, 0."
          - problem: "C has a->b. Presheaf P has P(b)={1,2,3,4},P(a)={5,6},restriction [5,5,6,6]. Q(b)={7,8},Q(a)={9},with constant restriction. Natural alpha,beta:P=>Q have b-components [7,7,8,8] and [7,8,8,7], and equal a-components. Construct their equalizer presheaf. Give the b-elements retained in increasing order followed by their restricted a-values."
            answer: "1, 3, 5, 6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Equalize the components pointwise and restrict the original presheaf map. Naturality of alpha and beta ensures the restricted image lies in the a-equalizer. The result is 1, 3, 5, 6."
          - problem: "C is the chain a<b. Presheaves P,Q have P(b)={1,2,3},P(a)={4},Q(b)={5,6,7,8},Q(a)={9},with constant restrictions. Construct their product presheaf and derive its Yoneda identity-value parameter set at b. Determine the number of natural transformations y(b)->P x Q."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the product is computed pointwise, so the full value at b is (P x Q)(b) = P(b) x Q(b), the set of ordered pairs. Rule: by the Yoneda lemma, the set of natural transformations from yb to P x Q is in bijection with (P x Q)(b). Count: P(b) has 3 elements and Q(b) has 4 elements, so the product has 3 x 4 = 12 elements. The answer is 12."
          - problem: "C has a->b. P has P(b)={u,v},P(a)={w}, with both restrictions landing at w. Construct the category-of-elements diagram of representables used by density, then its colimit at a. Number the two a-points contributed by y(b) at (b,u),(b,v) as 1,2 and the a-point contributed by y(a) at (a,w) as 3. Give all forced identifications as the least representative of each point 1,2,3, then the number of resulting colimit points. Derive the diagram arrows and the gluing from the element-category condition."
            answer: "1, 1, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The element arrows from (a,w) to both b-elements induce maps from y(a) into the two y(b) copies. At a their colimit identifies both copies with the common a-point, recovering P(a); this gluing is the density construction itself. The result is 1, 1, 1, 1."
          - problem: "For C=(a->b), let P,Q have all component sets {0,1}, but P restricts by swapping and Q by identity. Step 1: the product has component set {0,1} x {0,1}. Step 2: its restriction is the identity on pairs. Step 3: both projections are natural. Step 4: this is the product presheaf. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Pointwise product objects must be equipped with componentwise restriction maps. An identity restriction fails the first projection naturality square. This is the first unsupported step."
          - problem: "Write the full proof: for every small category C, the presheaf category [C^op, Set] has all small limits, and a limit of a diagram D of presheaves is computed pointwise, its value at an object C being the limit in Set of the sets D_i(C). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (construction): for each object C of the base category define L(C) as the limit in Set of the sets D_i(C) with the maps induced by the diagram; this set exists because Set is complete. Step 2 (presheaf): for an arrow f from C' to C, the maps D_i(f) commute with the limit projections, so they induce a map L(f) from L(C) to L(C'), and identities and composites are inherited from the functors D_i, so L is a presheaf. Step 3 (cone): the limit projections from L to each D_i are natural in C, so they form a cone over the diagram. Step 4 (universal property): given any cone from a presheaf M to the D_i, each component factors uniquely through the limit L(C) in Set, and naturality of the cone makes the resulting map from M to L natural in C. Step 5 (conclusion): the cone from L is universal, so L is a limit of the diagram in the presheaf category; hence all small limits exist and are computed pointwise."
    diagnostic_exemplar:
      problem: "Let $\\mathcal C$ be a small category. Prove that the presheaf category $\\widehat{\\mathcal C}=[\\mathcal C^{op},\\mathbf{Set}]$ has binary products, computed pointwise by $(P\\times Q)(C)=P(C)\\times Q(C)$, by verifying the universal property; then use the Yoneda lemma to compute $\\mathrm{Nat}(\\mathbf yA,P\\times Q)$ for a representable $\\mathbf yA=\\mathrm{Hom}(-,A)$."
      answer: "Define $(P\\times Q)(C)=PC\\times QC$ and, for $f\\colon C'\\to C$ in $\\mathcal C$, $(P\\times Q)(f)=Pf\\times Qf$; functoriality (contravariant) is componentwise, so $P\\times Q$ is a presheaf, and the componentwise projections $\\pi^P_C,\\pi^Q_C$ are natural because $Pf\\times Qf$ acts coordinatewise. Universal property: given natural transformations $\\alpha\\colon R\\Rightarrow P$ and $\\beta\\colon R\\Rightarrow Q$, set $\\gamma_C=\\langle\\alpha_C,\\beta_C\\rangle\\colon RC\\to PC\\times QC$. This is natural: each coordinate of $\\gamma_{C'}\\circ Rf$ and of $(Pf\\times Qf)\\circ\\gamma_C$ is the naturality square of $\\alpha$ or of $\\beta$. It satisfies $\\pi^P\\cdot\\gamma=\\alpha$ and $\\pi^Q\\cdot\\gamma=\\beta$, and it is the only such transformation because at each $C$ the pair $(\\alpha_C,\\beta_C)$ determines $\\gamma_C$ uniquely by the universal property of the product of sets. So $P\\times Q$ with its projections is the product in $\\widehat{\\mathcal C}$: limits in a presheaf category are computed pointwise, inherited from $\\mathbf{Set}$. Finally the Yoneda lemma gives $\\mathrm{Nat}(\\mathbf yA,P\\times Q)\\cong(P\\times Q)(A)=PA\\times QA$."
      solution_sketch: "Define everything pointwise and check that each condition is the corresponding condition in $\\mathbf{Set}$ at every object: naturality of the pairing is the naturality squares of $\\alpha$ and $\\beta$ coordinatewise, and uniqueness is uniqueness of pairs. The final count is Yoneda applied verbatim, since $\\mathrm{Nat}(\\mathbf yA,-)$ is evaluation at $A$."
    anki_seeds:
      - front: "The presheaf category $\\widehat{\\mathcal C}$ is..."
        back: "$[\\mathcal C^{op},\\mathbf{Set}]$: functors $\\mathcal C^{op}\\to\\mathbf{Set}$ and natural transformations."
        type: basic
      - front: "Every presheaf is canonically a {{c1::colimit of representables}} (density / co-Yoneda)."
        back: "colimit of representables"
        type: cloze

  - id: toposes-glimpse
