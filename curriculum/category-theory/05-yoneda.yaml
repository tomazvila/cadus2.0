    knowledge_points:
      - id: kp1
        name: Definition of representability
        key_prerequisites: [hom-functors]
        constraints: "Construct the representing object and natural isomorphism for Id_Set, and distinguish representable variance by composition. A component-count obstruction must test the representation itself."
        try_first:
          problem: 'How many functions are there from a set $R$ with $3$ elements to the set $\{0,1\}$?'
          answer_contract: {"kind": "exact"}
          answer: '8'
          reveal: 'Each of the 3 elements of $R$ picks one of 2 images, so $\mathrm{Hom}(R,X)$ has $|X|^{|R|}$ elements. A functor is represented by $R$ when this count matches the size of its value at every $X$, and the match is natural.'
        step_check:
          step: 'A function $f\colon\{*\}\to X$ is determined entirely by the image of $*$'
          question: 'Why does the fact that $f\colon\{*\}\to X$ is determined by the image of $*$ show that $\alpha_X$ is a bijection?'
          options:
            - 'The set $\{*\}$ has one element, so $\mathrm{Hom}(\{*\},X)$ has one element whatever $X$ is'
            - 'Each $f$ picks one element of $X$, and each element of $X$ is picked by exactly one $f$'
            - 'The rule $f\mapsto f(*)$ respects composition, and that alone makes it a bijection'
            - 'Naturality in $X$ already forces every component $\alpha_X$ to be injective and surjective'
          answer: 'Each $f$ picks one element of $X$, and each element of $X$ is picked by exactly one $f$'
          why: 'The functions $\{*\}\to X$ correspond one to one with the elements of $X$, by $f\leftrightarrow f(*)$.'
        exemplars:
          - problem: 'The identity functor $\mathrm{Id}\colon\mathbf{Set}\to\mathbf{Set}$ is representable: there is a set $R$ and a natural isomorphism $\mathrm{Hom}(R,-)\cong\mathrm{Id}$. How many elements does $R$ have?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural isomorphism gives a bijection between $\mathrm{Hom}(R,X)$ and $X$ for every set $X$. A function out of $R$ chooses an image for each of the $r$ elements of $R$, so $\mathrm{Hom}(R,X)$ has $|X|^r$ elements. For $X=\{0,1\}$ we need $2^r=2$, which gives $r=1$. So $R$ has 1 element.'
          - problem: 'The functor $F\colon\mathbf{Set}\to\mathbf{Set}$ given by $F(X)=X\times X$, with $F(g)(x,y)=(g(x),g(y))$, is representable: $F\cong\mathrm{Hom}(R,-)$ for some set $R$. How many elements does $R$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural isomorphism gives a bijection between $\mathrm{Hom}(R,X)$ and $X\times X$ for every set $X$. The left side has $|X|^{r}$ elements and the right side has $|X|^{2}$ elements. Taking $X=\{0,1\}$ gives $2^r=4$, so $r=2$. The set $R$ has 2 elements.'
          - problem: 'Let $A=\{a,b,c\}$ and let $R=\mathrm{Hom}(A,-)\colon\mathbf{Set}\to\mathbf{Set}$. Let $g\colon\{0,1\}\to\{0,1,2\}$ be the function with $g(0)=2$ and $g(1)=0$, and let $h\colon A\to\{0,1\}$ be the function with $h(a)=0$, $h(b)=1$ and $h(c)=1$. The function $R(g)$ sends $h$ to an element of $\mathrm{Hom}(A,\{0,1,2\})$. What is the value of that element at $b$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The functor $\mathrm{Hom}(A,-)$ acts on a function $g\colon X\to Y$ by composing with $g$ after each map out of $A$, so $R(g)(h)=g\circ h$. Then $(g\circ h)(b)=g(h(b))=g(1)=0$. So the value at $b$ is 0.'
          - problem: 'Let $P=\mathrm{Hom}(-,\{0,1\})\colon\mathbf{Set}^{op}\to\mathbf{Set}$. Let $k\colon\{1,2,3\}\to\{1,2\}$ be given by $k(1)=2$, $k(2)=2$ and $k(3)=1$. The function $P(k)$ sends $t\colon\{1,2\}\to\{0,1\}$, with $t(1)=1$ and $t(2)=0$, to an element of $\mathrm{Hom}(\{1,2,3\},\{0,1\})$. What is the value of that element at $3$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The functor $\mathrm{Hom}(-,\{0,1\})$ reverses arrows, so $P(k)$ takes a map $t$ out of $\{1,2\}$ to the map $t\circ k$ out of $\{1,2,3\}$. Then $(t\circ k)(3)=t(k(3))=t(1)=1$. So the value at $3$ is 1.'
          - problem: 'Sam claims that the identity functor $\mathrm{Id}$ on $\mathbf{Set}$ is represented by the two-point set $\{u,v\}$. He tests the claim by comparing the number of elements of $\mathrm{Hom}(\{u,v\},X)$ with the number of elements of $X$. What is the smallest number of elements of a set $X$ for which these two counts differ?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A function from $\{u,v\}$ to $X$ chooses an image for $u$ and an image for $v$, so $\mathrm{Hom}(\{u,v\},X)$ has $|X|^2$ elements. For $|X|=0$ the counts are 0 and 0, and for $|X|=1$ they are 1 and 1, so they agree. For $|X|=2$ the counts are 4 and 2, so they differ. The smallest size is 2.'
          - problem: 'Let $\mathcal C$ be the chain $1\le 2\le 3$ viewed as a category, with one morphism $a\to b$ when $a\le b$ and no morphism otherwise. The functor $\mathrm{Hom}(2,-)\colon\mathcal C\to\mathbf{Set}$ sends each object $X$ to the set of morphisms $2\to X$. For which objects $X$ is this set nonempty?'
            answer: '2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism $2\to X$ exists exactly when $2\le X$. That holds for $X=2$ and $X=3$ but not for $X=1$. So the set is nonempty for the objects 2 and 3, and it is empty for 1.'
          - problem: 'Is the identity functor $\mathrm{Id}\colon\mathbf{Set}\to\mathbf{Set}$ represented by the empty set $\varnothing$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "true", "it is represented", "represented", "yes it is represented"], ["no", "no it is not", "it is not", "not", "not represented", "it is not represented", "the empty set does not represent it"]]}
            solution_sketch: 'There is exactly one function from $\varnothing$ to any set $X$, so $\mathrm{Hom}(\varnothing,X)$ has 1 element for every $X$. For $X=\varnothing$ the identity functor gives the empty set, which has 0 elements, and no bijection exists between a set with 1 element and a set with 0 elements. So the empty set does not represent the identity functor.'
          - problem: 'Write the full proof that the identity functor $\mathrm{Id}\colon\mathbf{Set}\to\mathbf{Set}$ is representable, covariantly, by the one-point set $\{s\}$, with a natural isomorphism $a\colon\mathrm{Hom}(\{s\},-)\Rightarrow\mathrm{Id}$.'
            answer: 'Id is represented by a one-point set'
            answer_contract: {"kind": "none"}
            solution_sketch: 'For each set $X$ define $a_X\colon\mathrm{Hom}(\{s\},X)\to X$ by $a_X(f)=f(s)$. A function out of $\{s\}$ is fixed by the image of $s$, so $a_X$ is injective, and each $x$ in $X$ is the image of the function sending $s$ to $x$, so $a_X$ is surjective. For $g\colon X\to Y$ and $f\colon\{s\}\to X$ we have $a_Y(g\circ f)=g(f(s))=g(a_X(f))$, so the naturality square commutes. Hence $a$ is a natural isomorphism and $\mathrm{Id}\cong\mathrm{Hom}(\{s\},-)$.'
      - id: kp2
        name: Recognizing representable functors
        key_prerequisites: [natural-isomorphisms, free-groups-presentations]
        constraints: "Recognize when a free object on one generator represents a forgetful functor from Mon, Grp or Ab. Establish unique extension of generator images and naturality in the target; distinguish additional relations that obstruct freeness. Closed items may construct the categorical object or diagnose assertions whose validity the learner must determine; the unmarked item asks for a full proof. Candidate claims must not be endorsed or explained by the stem."
        step_check:
          step: 'Given any $a\in UA$, define $\varphi\colon\mathbb Z\to A$ by $\varphi(n)=n\,a$'
          question: 'Why is $\varphi(n)=n\,a$ a homomorphism from $\mathbb Z$ to $A$?'
          options:
            - 'Every function from $\mathbb Z$ to $A$ is a homomorphism as long as it is defined on all of $\mathbb Z$'
            - 'The element $a$ was chosen to be the identity of $A$, so $\varphi$ sends sums to sums'
            - 'In an abelian group $(m+n)a=ma+na$, so $\varphi$ sends the sum $m+n$ to the sum of the images'
            - 'The group $A$ is finite, so the multiples $n\,a$ repeat and the map is automatically additive'
          answer: 'In an abelian group $(m+n)a=ma+na$, so $\varphi$ sends the sum $m+n$ to the sum of the images'
          why: 'The rule $(m+n)a=ma+na$ says that $\varphi(m+n)=\varphi(m)+\varphi(n)$, which is the homomorphism condition.'
        exemplars:
          - problem: 'The forgetful functor $U\colon\mathbf{Ab}\to\mathbf{Set}$ is represented by $\mathbb{Z}$: sending a homomorphism $\varphi\colon\mathbb{Z}\to A$ to $\varphi(1)$ is a bijection $\mathrm{Hom}(\mathbb{Z},A)\cong UA$ for every abelian group $A$. Under this bijection the element $3$ of $A=\mathbb{Z}/10$ corresponds to a homomorphism $\varphi\colon\mathbb{Z}\to\mathbb{Z}/10$. What is $\varphi(4)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism out of $\mathbb{Z}$ is determined by the image of $1$, and $\varphi(n)=n\cdot\varphi(1)$. The element 3 corresponds to the homomorphism with $\varphi(1)=3$. Then $\varphi(4)=4\cdot 3=12$, which is 2 in $\mathbb{Z}/10$.'
          - problem: 'The forgetful functor $U\colon\mathbf{Mon}\to\mathbf{Set}$ is represented by the monoid $(\mathbb{N},+)$ through $\varphi\mapsto\varphi(1)$. Let $M=\{0,1,\dots,9\}$ with multiplication mod $10$. The element $3$ of $M$ corresponds to a monoid homomorphism $\varphi\colon(\mathbb{N},+)\to M$. What is $\varphi(4)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A monoid homomorphism out of $(\mathbb{N},+)$ sends a sum to a product, so $\varphi(n)=\varphi(1)^n$. With $\varphi(1)=3$ we get $\varphi(4)=3^4=81$. In $M$ this is 1, because $81\equiv 1\pmod{10}$.'
          - problem: 'How many group homomorphisms are there from $\mathbb{Z}$ to the symmetric group $S_3$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The forgetful functor $\mathbf{Grp}\to\mathbf{Set}$ is represented by $\mathbb{Z}$, so $\mathrm{Hom}(\mathbb{Z},S_3)$ is in bijection with the underlying set of $S_3$. A homomorphism is fixed by the image of $1$, which may be any permutation. The group $S_3$ has $3!=6$ elements, so there are 6 homomorphisms.'
          - problem: 'The functor $F\colon\mathbf{Ab}\to\mathbf{Set}$ sends an abelian group $A$ to $A\times A$. It is represented by $\mathbb{Z}\oplus\mathbb{Z}$, so $\mathrm{Hom}(\mathbb{Z}\oplus\mathbb{Z},A)\cong A\times A$. How many group homomorphisms are there from $\mathbb{Z}\oplus\mathbb{Z}$ to $\mathbb{Z}/4$?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism from $\mathbb{Z}\oplus\mathbb{Z}$ is fixed by the images of the two generators $(1,0)$ and $(0,1)$, and these images may be any two elements of the target. Hence $\mathrm{Hom}(\mathbb{Z}\oplus\mathbb{Z},\mathbb{Z}/4)\cong\mathbb{Z}/4\times\mathbb{Z}/4$. That set has $4\cdot 4=16$ elements.'
          - problem: 'Sam proposes that the forgetful functor $U\colon\mathbf{Grp}\to\mathbf{Set}$ is represented by the cyclic group $\mathbb{Z}/3$, through $\varphi\mapsto\varphi(1)$. To test this, he counts the group homomorphisms $\mathbb{Z}/3\to\mathbb{Z}/2$. How many are there?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism $\varphi\colon\mathbb{Z}/3\to\mathbb{Z}/2$ needs $3\varphi(1)=0$ in $\mathbb{Z}/2$, which forces $\varphi(1)=0$. So there is 1 homomorphism, the zero map, while $\mathbb{Z}/2$ has 2 elements. The map $\varphi\mapsto\varphi(1)$ is not onto, so $\mathbb{Z}/3$ does not represent $U$.'
          - problem: 'The forgetful functor $V\colon\mathbf{Vect}_{\mathbb{F}_2}\to\mathbf{Set}$ from vector spaces over the field $\mathbb{F}_2=\{0,1\}$ is represented by the one-dimensional space $\mathbb{F}_2$. How many linear maps are there from $\mathbb{F}_2$ to $\mathbb{F}_2^3$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A linear map out of $\mathbb{F}_2$ is determined by the image of $1$, and that image may be any vector of the target. So the linear maps correspond to the vectors of $\mathbb{F}_2^3$. This space has $2^3=8$ vectors, so there are 8 linear maps.'
          - problem: 'To test whether the abelian group $\mathbb{Z}\times\mathbb{Z}$ could represent the forgetful functor $U\colon\mathbf{Grp}\to\mathbf{Set}$, count the group homomorphisms $\mathbb{Z}\times\mathbb{Z}\to S_3$. How many are there?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism $\mathbb{Z}\times\mathbb{Z}\to S_3$ is fixed by the images $a$ and $b$ of the two generators, and these two images must commute. The identity commutes with all 6 elements, each of the 3 transpositions commutes with 2 elements, and each of the 2 three-cycles commutes with 3 elements. So there are $6+3\cdot 2+2\cdot 3=18$ pairs, hence 18 homomorphisms. This is more than the 6 elements of $S_3$, so $\mathbb{Z}\times\mathbb{Z}$ does not represent $U$.'
          - problem: 'Let $F\colon\mathbf{Mon}\to\mathbf{Set}$ send a monoid $M$ to $UM\times UM$, the set of ordered pairs of its elements, and a homomorphism $h$ to $(m,m'')\mapsto(h(m),h(m''))$. Is $F$ represented by the free monoid $\{a,b\}^*$ on two letters?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "true", "it is represented", "represented"], ["no", "no it is not", "it is not", "not", "false", "not represented", "it is not represented"]]}
            solution_sketch: 'A monoid homomorphism out of $\{a,b\}^*$ is fixed by the images of the two letters, and any two images are allowed. So $\mathrm{Hom}(\{a,b\}^*,M)\cong UM\times UM$ through $h\mapsto(h(a),h(b))$, and this bijection is natural in $M$ by postcomposition. Hence $F$ is represented by $\{a,b\}^*$.'
          - problem: 'Write the full proof that the forgetful functor $U\colon\mathbf{Mon}\to\mathbf{Set}$ is representable, with representing object the free monoid $(\mathbb{N},+)$ on one generator.'
            answer: 'U is represented by the monoid N'
            answer_contract: {"kind": "none"}
            solution_sketch: 'For each monoid $M$ define $\varphi_M\colon\mathrm{Hom}(\mathbb{N},M)\to U(M)$ by $\varphi_M(f)=f(1)$. If $f(1)=g(1)$ then $f(n)=f(1)^n=g(1)^n=g(n)$ for all $n$, so $\varphi_M$ is injective. For $m\in M$ the map $f_m(n)=m^n$ is a monoid homomorphism with $f_m(1)=m$, so $\varphi_M$ is surjective. For a homomorphism $h\colon M\to P$ we have $\varphi_P(h\circ f)=h(f(1))=U(h)(\varphi_M(f))$, so $\varphi$ is natural and $U\cong\mathrm{Hom}(\mathbb{N},-)$.'
      - id: kp3
        name: Uniqueness of the representing object
        key_prerequisites: [universal-properties]
        constraints: "Recover comparison maps from identity components and derive their action by naturality. Prove inverse equations by evaluating the inverse natural transformations; use whole component tests to reject false uniqueness arguments."
        step_check:
          step: 'naturality of $\theta$ at $h$ applied to $1_C$'
          question: 'Why do we apply naturality of $\theta$ to the identity $1_C$?'
          options:
            - 'Because $h=h\circ 1_C$, so each $\theta_X(h)$ comes from the single value $\theta_C(1_C)$'
            - 'Because $1_C$ is the only morphism out of $C$ on which the transformation $\theta$ is defined at all'
            - 'Because $\theta_C$ is an isomorphism only when the transformation is evaluated at an identity'
            - 'Because identities commute with every morphism, which makes the naturality square commute'
          answer: 'Because $h=h\circ 1_C$, so each $\theta_X(h)$ comes from the single value $\theta_C(1_C)$'
          why: 'Since $h=h\circ 1_C$, naturality turns $\theta_X(h)$ into $h\circ\theta_C(1_C)$, so one value fixes the whole transformation.'
        exemplars:
          - problem: 'Let $\theta\colon\mathrm{Hom}(A,-)\Rightarrow\mathrm{Hom}(B,-)$ be a natural isomorphism of functors on $\mathbf{Set}$, where $A=\{1,2\}$ and $B=\{3,4\}$. The inverse $\theta^{-1}$ sends $1_B$ at the object $B$ to the function $f\colon A\to B$ with $f(1)=4$ and $f(2)=3$. The component $\theta_A$ sends $1_A$ to a function $g\colon B\to A$. What is $g(3)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Chasing the identities shows that $f$ and $g$ are inverse to each other, with $f\circ g=1_B$ and $g\circ f=1_A$. So $g$ undoes $f$. Since $f(2)=3$, we get $g(3)=2$.'
          - problem: 'In $\mathbf{Set}$ the functors $\mathrm{Hom}(A,-)$ and $\mathrm{Hom}(B,-)$ are naturally isomorphic, and $A$ has $3$ elements. How many elements does $B$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Representing objects are unique up to isomorphism, so a natural isomorphism $\mathrm{Hom}(A,-)\cong\mathrm{Hom}(B,-)$ gives an isomorphism $A\cong B$. In $\mathbf{Set}$ an isomorphism is a bijection, so $B$ has the same number of elements as $A$. Hence $B$ has 3 elements.'
          - problem: 'Let $A=\{1,2,3\}$ and $B=\{a,b,c\}$. How many natural isomorphisms are there from $\mathrm{Hom}(A,-)$ to $\mathrm{Hom}(B,-)$ in $\mathbf{Set}$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Natural transformations $\mathrm{Hom}(A,-)\Rightarrow\mathrm{Hom}(B,-)$ correspond to functions $g\colon B\to A$ through $\theta\mapsto\theta_A(1_A)$. The transformation is an isomorphism exactly when $g$ is an isomorphism, that is, a bijection. There are $3!=6$ bijections from $B$ to $A$, so there are 6 natural isomorphisms.'
          - problem: 'Let $\mathcal C$ be the chain $1\le 2\le 3$ viewed as a category. Are the functors $\mathrm{Hom}(2,-)$ and $\mathrm{Hom}(3,-)$ from $\mathcal C$ to $\mathbf{Set}$ naturally isomorphic?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "true"], ["no", "no it is not", "it is not", "not", "false"]]}
            solution_sketch: 'A natural isomorphism $\mathrm{Hom}(2,-)\cong\mathrm{Hom}(3,-)$ would make the objects 2 and 3 isomorphic. In a chain the only isomorphisms are identities, so this is impossible. Directly, $\mathrm{Hom}(2,2)$ has one element while $\mathrm{Hom}(3,2)$ is empty, so no bijection exists at the object 2.'
          - problem: 'Let $\mathbb{Z}/5$ be viewed as a category with one object $*$, whose morphisms are the elements of $\mathbb{Z}/5$ and whose composition is addition. Let $\theta\colon\mathrm{Hom}(*,-)\Rightarrow\mathrm{Hom}(*,-)$ be a natural isomorphism with $\theta_*(0)=2$. What is $\theta_*(4)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality applied to the identity $0$ gives $\theta_*(h)=h\circ\theta_*(0)$ for every morphism $h$. Composition is addition, so $\theta_*(h)=h+2$. Then $\theta_*(4)=4+2=6$, which is 1 in $\mathbb{Z}/5$.'
          - problem: 'Ana studies a natural isomorphism $\theta\colon\mathrm{Hom}(A,-)\Rightarrow\mathrm{Hom}(B,-)$ in $\mathbf{Set}$ with $A=\{1,2\}$ and $B=\{3,4\}$. She sets $g=\theta_A(1_A)\colon B\to A$ with $g(3)=2$ and $g(4)=1$, and $f=\theta^{-1}_B(1_B)\colon A\to B$ with $f(1)=4$ and $f(2)=3$. Ana says that naturality gives $\theta_B(f)=g\circ f$. What is the correct value of $\theta_B(f)(3)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality of $\theta$ at $f$, applied to $1_A$, gives $\theta_B(f)=f\circ g$, not $g\circ f$, because $g\circ f$ is a function $A\to A$ and cannot lie in $\mathrm{Hom}(B,B)$. Then $\theta_B(f)(3)=f(g(3))=f(2)=3$. This agrees with $\theta_B(f)=\theta_B(\theta^{-1}_B(1_B))=1_B$.'
          - problem: 'Let $\mathcal C$ be the category with two objects $A$ and $B$ in which $\mathrm{Hom}(A,A)$ and $\mathrm{Hom}(B,B)$ are the whole numbers $0,1,2,\dots$, while $\mathrm{Hom}(A,B)$ and $\mathrm{Hom}(B,A)$ are the numbers $1,2,3,\dots$. Composition is addition, and the identities are the morphisms $0$. For every object $X$ the sets $\mathrm{Hom}(A,X)$ and $\mathrm{Hom}(B,X)$ are both infinite and countable, so bijections between them exist. How many natural isomorphisms are there from $\mathrm{Hom}(A,-)$ to $\mathrm{Hom}(B,-)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural isomorphism $\mathrm{Hom}(A,-)\cong\mathrm{Hom}(B,-)$ would make $A$ and $B$ isomorphic objects. Suppose $g\colon B\to A$ and $f\colon A\to B$ had $g\circ f=0$. Both $f$ and $g$ have cost at least 1, so $g\circ f$ has cost at least 2, which is not the identity cost 0. So $A$ and $B$ are not isomorphic, and there are 0 natural isomorphisms, although bijections exist at every object separately.'
          - problem: 'Write the full proof that if $\mathrm{Hom}(A,-)$ is naturally isomorphic to $\mathrm{Hom}(B,-)$, then $A$ is isomorphic to $B$.'
            answer: 'Representing objects are unique'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $\theta\colon\mathrm{Hom}(A,-)\Rightarrow\mathrm{Hom}(B,-)$ be a natural isomorphism and put $g=\theta_A(1_A)\colon B\to A$ and $f=\theta^{-1}_B(1_B)\colon A\to B$. For $h\colon A\to X$, naturality of $\theta$ at $h$ applied to $1_A$ gives $\theta_X(h)=h\circ g$, and in the same way $\theta^{-1}_X(k)=k\circ f$ for $k\colon B\to X$. Taking $X=B$ and $h=f$ gives $f\circ g=\theta_B(f)=1_B$. Taking $X=A$ and $k=g$ gives $g\circ f=\theta^{-1}_A(g)=1_A$. So $f$ and $g$ are inverse isomorphisms and $A\cong B$.'
    diagnostic_exemplar:
      problem: "Prove that the forgetful functor $U\\colon\\mathbf{Ab}\\to\\mathbf{Set}$ is representable, naming the representing object and the natural isomorphism, and prove that any two representing objects for $U$ are isomorphic."
      answer: "Representability: $\\mathbb Z$ is the free abelian group on one generator, so a homomorphism $\\varphi\\colon\\mathbb Z\\to A$ is determined by $\\varphi(1)$, which may be any element of $A$. Hence $\\theta_A\\colon\\mathrm{Hom}_{\\mathbf{Ab}}(\\mathbb Z,A)\\to UA$, $\\varphi\\mapsto\\varphi(1)$, is a bijection, and it is natural in $A$: for $f\\colon A\\to B$, $\\theta_B(f\\circ\\varphi)=f(\\varphi(1))=Uf(\\theta_A(\\varphi))$. So $U\\cong\\mathrm{Hom}_{\\mathbf{Ab}}(\\mathbb Z,-)$ with representing object $\\mathbb Z$. Uniqueness: suppose $\\mathrm{Hom}(A,-)\\cong U\\cong\\mathrm{Hom}(B,-)$, so there is a natural isomorphism $\\psi\\colon\\mathrm{Hom}(A,-)\\Rightarrow\\mathrm{Hom}(B,-)$. Put $g=\\psi_A(1_A)\\colon B\\to A$ and $f=\\psi_B^{-1}(1_B)\\colon A\\to B$. Naturality of $\\psi$ at $h\\colon A\\to X$ applied to $1_A$ gives $\\psi_X(h)=h\\circ g$, and likewise $\\psi^{-1}_X(k)=k\\circ f$. Taking $X=B$, $h=f$: $f\\circ g=\\psi_B(f)=\\psi_B(\\psi_B^{-1}(1_B))=1_B$; taking $X=A$, $k=g$: $g\\circ f=\\psi^{-1}_A(g)=\\psi^{-1}_A(\\psi_A(1_A))=1_A$. So $A\\cong B$: the representing object is unique up to isomorphism."
      solution_sketch: "For representability use that $\\mathbb Z$ is free on one generator, so $\\varphi\\mapsto\\varphi(1)$ is a bijection and naturality says evaluation at $1$ commutes with post-composition. For uniqueness, feed the identities through the natural isomorphism: $\\psi_A(1_A)$ and $\\psi_B^{-1}(1_B)$ are the mutually inverse maps."
    anki_seeds:
      - front: "A representable functor is..."
        back: "a functor naturally isomorphic to some hom-functor $\\mathrm{Hom}(A,-)$ (covariant) or $\\mathrm{Hom}(-,A)$ (contravariant)."
        type: basic
      - front: "Representing objects are unique up to {{c1::isomorphism}}."
        back: "isomorphism"
        type: cloze

