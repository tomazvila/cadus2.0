          - problem: "Write the full proof: the pair $((\\mathbb{N}, +, 0), 1)$ is a universal element of the forgetful functor $U\\colon \\mathbf{Mon} \\to \\mathbf{Set}$, and therefore $U$ is representable. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "State the pair and the clause first: the pair is $A = (\\mathbb{N}, +, 0)$ with $u = 1$ in $UA$, and the clause says that for every monoid $M$ and every $m$ in $UM$ there is a unique homomorphism $h\\colon A \\to M$ with $Uh(u) = m$. Step 1 (existence): given $m$, define $h(n)$ as the $n$-fold sum of $m$ with itself; then $h(0) = 0$ and $h(n + n') = h(n) + h(n')$ by the monoid law, so $h$ is a homomorphism with $h(1) = m$. Step 2 (uniqueness): if $g$ is a homomorphism with $g(1) = m$, then $g(n)$ equals the $n$-fold sum of $g(1)$, which is $h(n)$, so $g = h$. Step 3 (representation): the assignment $h \\mapsto h(1)$ is a bijection natural in $M$, giving $\\mathrm{Hom}(A, -) \\cong U$, so $U$ is representable."
      - id: kp2
        name: Universal properties are universal elements
        key_prerequisites: [universal-properties]
        constraints: "Recover the representing object and universal tuple of projections/injections for the candidate-structure functor. Match its variance and exists-unique equation to the product or coproduct universal property."
        exemplars:
          - problem: "In Set let A={1,2},B={3,4} and F(X)=Hom(X,A) x Hom(X,B). Recover a universal element of this contravariant functor and its representing object. For X={7}, f(7)=2,g(7)=4, construct the unique mediator and give h(7) as (a,b)."
            answer: "(2, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (name the functor and its action): F(X) = Hom(X,A) x Hom(X,B) reverses arrows, so for h: X -> A x B the map F(h): F(A x B) -> F(X) sends the pair of projections to (p1 after h, p2 after h). Step 2 (match the exists-unique clause): the element (f, g) of F(X) is matched by a unique h with p1 after h = f and p2 after h = g, so h sends each point to the pair of its images. Step 3 (evaluate): h(7) = (f(7), g(7)) = (2, 4). The answer is (2, 4)."
          - problem: "In Set let A={5},B={6,7} and F(X)=Hom(A,X) x Hom(B,X). Recover a universal element and its object. For X={0,8}, f(5)=0,g(6)=8,g(7)=0, construct its unique mediator h and give h of the image of 6 under the B-injection."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (name the functor and its action): F(X) = Hom(A,X) x Hom(B,X) is covariant, so for h: A + B -> X the map F(h): F(A + B) -> F(X) sends the pair of injections to (h after i1, h after i2). Step 2 (match the exists-unique clause): the element (f, g) of F(X) is matched by a unique h with h after i1 = f and h after i2 = g. Step 3 (evaluate): h(i2(6)) = g(6) = 8. The answer is 8."
          - problem: "In the divisibility category on positive divisors of 42, F(X)=Hom(X,6) x Hom(X,14) is contravariant. Construct the object d of a universal element of F by enforcing the exists-unique clause. Give d."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (name the functor): F(X) = Hom(X,6) x Hom(X,14) is nonempty exactly for the common divisors of 6 and 14, which are 1 and 2. Step 2 (locate the universal element): the pair of projections lies in F(d), so d divides both 6 and 14; the exists-unique clause says every common divisor X has an arrow to d, that is, every common divisor divides d. Step 3 (conclude): among 1 and 2, the one divisible by both is 2, the greatest common divisor. The answer is 2."
          - problem: "In the divisibility category on positive divisors of 36, F(X)=Hom(4,X) x Hom(6,X) is covariant. Construct the object c of a universal element of F by enforcing the exists-unique clause. Give c."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (name the functor): F(X) = Hom(4,X) x Hom(6,X) is nonempty exactly for the common multiples of 4 and 6 among the divisors of 36, which are 12 and 36. Step 2 (locate the universal element): the pair of injections lies in F(c), so 4 and 6 both divide c; the exists-unique clause says c has an arrow to every common multiple, that is, c divides every common multiple. Step 3 (conclude): among 12 and 36, the one that divides both is 12, the least common multiple. The answer is 12."
          - problem: "For F(X)=Hom(X,A) x Hom(X,B), Step 1: F is contravariant. Step 2: the product has candidate universal element (p1,p2) at A x B. Step 3: for h:X->A x B, F(h)(p1,p2)=(h after p1,h after p2). Step 4: this is the pair of maps X->A,X->B. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Contravariance acts by precomposition: the pair is (p1 after h,p2 after h). The claimed compositions are ill-typed. This is the first unsupported step."
          - problem: "For covariant F(X)=Hom(A,X) x Hom(B,X), reconstruct the universal-element equation for h:A+B->X and coproduct injections i1,i2. Bank: 1=h after i1; 2=i1 after h; 3=i2 after h; 4=h after i2. Give the two component numbers of F(h)(i1,i2)."
            answer: "1, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Covariance applies h by postcomposition to both injection components. This is exactly the coproduct factorization equation. The result is 1, 4."
          - problem: "Write the full proof: in the category of sets, the pair of projections of A x B is a universal element of the functor F(X) = Hom(X,A) x Hom(X,B). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the functor): for each set X let F(X) = Hom(X,A) x Hom(X,B), the set of pairs of maps with domain X; for a map k: X -> Y let F(k): F(Y) -> F(X) send a pair (f, g) to (f after k, g after k). Precomposition respects composition in the reversed order, so F is a functor on the category of sets with arrows reversed. Step 2 (the element): the projections p1: A x B -> A and p2: A x B -> B form the pair (p1, p2), an element of F(A x B). Step 3 (existence): take any set X and any element (f, g) of F(X), so f: X -> A and g: X -> B; define h: X -> A x B by h(x) = (f(x), g(x)). Then p1 after h = f and p2 after h = g, so F(h)(p1, p2) = (p1 after h, p2 after h) = (f, g). Step 4 (uniqueness): if h': X -> A x B also satisfies F(h')(p1, p2) = (f, g), then p1 after h' = f and p2 after h' = g, so for each x in X we get h'(x) = (f(x), g(x)) = h(x), whence h' = h. Step 5 (conclusion): the pair (p1, p2) in F(A x B) meets the exists-unique condition for every X, so it is a universal element of F, and F is represented by A x B. The answer is See the solution."
    diagnostic_exemplar:
      problem: "Let $F\\colon\\mathbf{Mon}\\to\\mathbf{Set}$ send a monoid $M$ to the set $UM\\times UM$ of ordered pairs of its elements, and a homomorphism $h$ to $(m,m')\\mapsto(h(m),h(m'))$. Exhibit a universal element of $F$ and verify the universal-element condition in full."
      answer: "Take $A=\\{a,b\\}^*$, the free monoid on two letters, and $u=(a,b)\\in FA$. Given any monoid $M$ and any $(m,m')\\in FM=UM\\times UM$, freeness says there is exactly one homomorphism $h\\colon\\{a,b\\}^*\\to M$ with $h(a)=m$ and $h(b)=m'$ (existence: extend letterwise and multiply out, $h(x_1\\cdots x_n)=h(x_1)\\cdots h(x_n)$, $h(\\varepsilon)=e$; uniqueness: a homomorphism is determined on words by its values on letters). For that $h$, $(Fh)(u)=(h(a),h(b))=(m,m')$, and any $h'$ with $(Fh')(u)=(m,m')$ has $h'(a)=m$, $h'(b)=m'$, hence $h'=h$. So every element of $FM$ is $(Fh)(u)$ for a unique $h\\colon A\\to M$: $(\\{a,b\\}^*,(a,b))$ is a universal element, and equivalently $F\\cong\\mathrm{Hom}_{\\mathbf{Mon}}(\\{a,b\\}^*,-)$."
      solution_sketch: "Guess the free object: $F$ asks for two elements, so take the free monoid on two letters with $u=(a,b)$. The universal-element condition is then the freeness property itself — exactly one homomorphism sends the two letters to any prescribed pair — so verify existence and uniqueness of that extension."
    anki_seeds:
      - front: "A universal element of $F\\colon\\mathcal C\\to\\mathbf{Set}$ is..."
        back: "$(A,u)$, $u\\in FA$, such that every $x\\in FX$ equals $Fh(u)$ for a unique $h\\colon A\\to X$."
        type: basic
      - front: "Recognition trigger: a universal property is a {{c1::universal element}} of an associated $\\mathbf{Set}$-valued functor."
        back: "universal element"
        type: cloze

  - id: yoneda-statement-mechanics
    name: The Yoneda Lemma — Statement and Computations
    core: true
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: representable-functors
        weight: 0.5
        key: true
      - id: universal-elements
        weight: 0.4
        key: true
      - id: hom-functors
        weight: 0.3
      - id: functor-categories
        weight: 0.3
      - id: natural-transformations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The statement in both variances
        key_prerequisites: [representable-functors]
        constraints: "Recover Yoneda components in both variances from identity evaluation and naturality. Never supply the reconstruction formula before asking to use it; keep all arrow directions explicit."
        exemplars:
          - problem: "Let C be the poset category with two objects 0 and 1 and one non-identity arrow f: 0 -> 1. Let F: C -> Set be the covariant functor with F(0) = {1, 2}, F(1) = {3, 4} and F(f) sending 1 to 3 and 2 to 4. Take A = 0 and u = 1 in F(0). The Yoneda lemma attaches to u the natural transformation alpha from Hom(0, -) to F with alpha_0(1_0) = u. Compute alpha_1(f)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule used: the covariant Yoneda lemma, whose inverse map sends u in F(A) to the natural transformation with component alpha_X(h) = (F h)(u) for each arrow h: A -> X. Full setup: A = 0, X = 1, h = f, u = 1, and F(f) sends 1 to 3 and 2 to 4. Apply the inverse map: alpha_1(f) = (F f)(1) = 3. The answer is 3."
          - problem: "Let C be the poset category with two objects 0 and 1 and one non-identity arrow f: 0 -> 1. Let G: C^op -> Set be the presheaf with G(1) = {1, 2, 3}, G(0) = {4, 5} and G(f) sending 1 to 4, 2 to 5 and 3 to 4. Take A = 1 and u = 2 in G(1). The contravariant Yoneda lemma attaches to u the natural transformation beta from Hom(-, 1) to G with beta_1(1_1) = u. Compute beta_0(f)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule used: the contravariant Yoneda lemma, whose inverse map sends u in G(A) to the component beta_X(h) = (G h)(u); here h: X -> A and G h: G(A) -> G(X) runs backwards. Full setup: A = 1, X = 0, h = f, u = 2, and G(f) sends 2 to 5. Apply the inverse map: beta_0(f) = (G f)(2) = 5. The answer is 5."
          - problem: "Let C be the category with objects A, B, C and exactly two non-identity arrows f: A -> B and g: A -> C. Let F: C -> Set be the covariant functor with F(A) = {1, 2}, F(B) = {2, 3, 6}, F(C) = {4, 5, 7}, with F(f) sending 1 to 6 and 2 to 3, and with F(g) sending 1 to 4 and 2 to 5. Take u = 1 in F(A). The Yoneda lemma attaches to u the natural transformation alpha from Hom(A, -) to F. Give the values valb = alpha_B(f) and valc = alpha_C(g)."
            answer: "valb = 6; valc = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "valb"}, {"contract": {"kind": "exact"}, "name": "valc"}]}
            solution_sketch: "Rule used: the covariant Yoneda lemma: the transformation attached to u has component alpha_X(h) = (F h)(u) for every arrow h out of A. Full setup: u = 1, F(f) sends 1 to 6, and F(g) sends 1 to 4. Apply the rule to f: alpha_B(f) = (F f)(1) = 6. Apply the rule to g: alpha_C(g) = (F g)(1) = 4. The answer is valb = 6; valc = 4."
          - problem: "Let C be the poset category with two objects 0 and 1 and one non-identity arrow f: 0 -> 1. Let F: C -> Set be the covariant functor with F(0) = {6, 7, 8}, F(1) = {9, 10, 11} and F(f) sending 6 to 10, 7 to 9 and 8 to 11. Let alpha be a natural transformation from Hom(0, -) to F with alpha_1(f) = 9. The Yoneda map sends alpha to the element alpha_0(1_0) of F(0). Give the element alpha_0(1_0)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule used: the covariant Yoneda lemma, which makes the map sending alpha to alpha_0(1_0) a bijection, so one component fixes the whole transformation. Naturality along f gives the identity alpha_1(f) = (F f)(alpha_0(1_0)), so (F f)(u) = 9 where u = alpha_0(1_0). The map F(f) sends 6 to 10, 7 to 9 and 8 to 11, so the only preimage of 9 is 7. The answer is 7."
          - problem: "For presheaf G:C opposite->Set, u in G(A) corresponds by Yoneda to alpha:Hom(-,A)=>G. For h:X->A, construct alpha_X(h). Operation bank: 1=G(h):G(A)->G(X); 2=G(h):G(X)->G(A); 3=G(1_X):G(X)->G(X). Give the operation number and the number of the input from input bank 1=u in G(A),2=h in Hom(X,A)."
            answer: "1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Contravariance reverses the given arrow, sending the universal identity value u in G(A) into G(X). The result is 1, 1."
          - problem: "Claim: for every covariant functor F: C -> Set and every object A, the map sending a natural transformation alpha from Hom(A, -) to F to the element alpha_A(1_A) of F(A) is a bijection. Step 1: the value alpha_A(1_A) lies in F(A), so the map is well defined. Step 2: for an arrow h: A -> X, naturality of alpha along h gives alpha_X(1_X) = (F h)(alpha_A(1_A)). Step 3: hence the component of alpha at each object is determined by the value alpha_A(1_A), so the map is injective. Step 4: conversely, each element u of F(A) is the image of the transformation whose component at X sends h to (F h)(u), so the map is also surjective. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it only records that alpha_A(1_A) lies in F(A). Step 2 is the first invalid step: naturality along h, evaluated at 1_A, gives alpha_X(h) = (F h)(alpha_A(1_A)) because Hom(A, h) sends 1_A to h; the identity 1_X never enters the naturality square. Step 3 is valid once Step 2 is corrected, since the corrected identity determines every component from the single value alpha_A(1_A). Step 4 is valid: the assignment sending h to (F h)(u) is exactly the inverse map, which gives surjectivity. The answer is Step 2."
          - problem: "Write the full proof: for every covariant functor F from a category C to Set and every object A of C, the map sending a natural transformation alpha from Hom(A, -) to F to the element alpha_A(1_A) is a bijection from the set Nat(Hom(A, -), F) of natural transformations onto F(A), with inverse sending each u in F(A) to the transformation whose component at X sends h to (F h)(u), and the bijection is natural in A and in F. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (well defined): a natural transformation alpha has a component alpha_A: Hom(A, A) -> F(A), so alpha_A(1_A) is an element of F(A). Step 2 (naturality): for an arrow h: A -> X, the naturality square of alpha along h reads (F h) after alpha_A = alpha_X after Hom(A, h); evaluating at 1_A and using Hom(A, h)(1_A) = h gives alpha_X(h) = (F h)(alpha_A(1_A)). Step 3 (injective): this identity determines every component from the single value alpha_A(1_A), so two transformations with the same value are equal. Step 4 (inverse): given u in F(A), define beta with component beta_X(h) = (F h)(u) for each h in Hom(A, X). Step 5 (naturality of beta): for k: X -> Y, beta_Y(k after h) = (F k)((F h)(u)) = (F k)(beta_X(h)) by functoriality of F, so beta is natural. Step 6 (conclusion): beta_A(1_A) = (F 1_A)(u) = u, and the two constructions are mutually inverse, so the map alpha to alpha_A(1_A) is a bijection, natural in A and in F."
      - id: kp2
        name: Counting natural transformations out of a representable
        key_prerequisites: [hom-functors]
        constraints: "Count natural transformations by deriving the identity-evaluation parameter set and reconstruction, with no parameter set supplied in the stem. Distinguish covariant and contravariant representable directions."
        exemplars:
          - problem: "In Set take A={1,2,3,4},B={1,2}. Determine the number of natural transformations Hom(A,-)=>Hom(B,-). Derive which hom-set is identified by evaluating at an identity; the direction of that hom-set is part of the reasoning."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma rule: Nat(Hom(A,-), F) is in bijection with F(A), via alpha maps to alpha_A(1_A). Here the full set being counted is F(A) = Hom({1,2}, {1,2,3,4}), the functions from {1,2} to {1,2,3,4}. Counting rule: each of the 2 inputs independently picks one of 4 outputs, so there are 4^2 = 16 functions. The answer is 16."
          - problem: "Let P:Set->Set be covariant powerset, acting by direct image, and A={1,2}. Determine the number of natural transformations Hom(A,-)=>P using identity evaluation and reconstruction of every component."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma rule: Nat(Hom(A,-), P) is in bijection with P(A). The full set being counted is P(A), the collection of all subsets of {1,2}, namely the empty set, {1}, {2}, and {1,2}. Counting rule: a 2-element set has 2^2 = 4 subsets. The answer is 4."
          - problem: "Let F(X)=X x {0,1}, acting by F(h)(x,i)=(h(x),i). For A={0,1,2}, enumerate the identity values that classify natural transformations Hom(A,-)=>F. Encode (a,i) by 2a+i and give the set of all codes."
            answer: "{0, 1, 2, 3, 4, 5}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Identity evaluation lands in F(A); naturality forces its transported value at every arrow and thus distinguishes all these transformations. The result is {0, 1, 2, 3, 4, 5}."
          - problem: "C is the chain 1<2<3 as a category. Determine the number of natural transformations Hom(2,-)=>Hom(3,-). Derive the relevant identity-evaluation hom-set before counting its arrows."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma rule: Nat(Hom(2,-), Hom(3,-)) is in bijection with Hom(3,2), the value of F = Hom(3,-) at the object 2. The full set Hom(3,2) is the set of arrows from 3 to 2 in the chain 1 <= 2 <= 3; such an arrow exists only when 3 <= 2, which is false, so this set is empty. Counting rule: an empty set has 0 elements, so there are no such transformations. The answer is 0."
          - problem: "For A={a,b,c} and B={a,b}, determine both Nat(Hom(A,-),Hom(B,-)) and Nat(Hom(-,A),Hom(-,B)) in Set. Give their cardinalities in that order, deriving the appropriate variance in each case."
            answer: "9, 8"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The first identity evaluation produces B->A, while the second produces A->B. Each arrow reconstructs one natural transformation. The result is 9, 8."
          - problem: "Let F:Set->Set send X to X x X and act on both coordinates. For A={1,2,3}, determine the number of natural transformations Hom(A,-)=>F. Derive the parameter set from identity evaluation and explain why each parameter extends uniquely."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma rule: Nat(Hom(A,-), F) is in bijection with F(A), via alpha maps to alpha_A(1_A). The full set being counted is F(A), the set of pairs (x, y) with both entries in {1,2,3}. Counting rule: 3 choices for x and independently 3 choices for y give 3 times 3 = 9 pairs. The answer is 9."
          - problem: "Write the full proof: in the category of sets, for every set A and every functor F from sets to sets, the map sending a natural transformation alpha from Hom(A,-) to F to the element alpha_A(1_A) is a bijection onto F(A). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (key identity): for any set X and any map h from A to X, h equals Hom(A,h) applied to 1_A, so naturality of alpha at h gives alpha_X(h) = F(h)(alpha_A(1_A)). Step 2 (injectivity): if alpha_A(1_A) = beta_A(1_A) = u, then alpha_X(h) = F(h)(u) = beta_X(h) for every h, so alpha = beta. Step 3 (surjectivity): given u in F(A), define alpha_X(h) = F(h)(u); naturality at f from X to Y holds because F(f)(alpha_X(h)) = F(f)(F(h)(u)) = F(f h)(u) = alpha_Y(f h). Step 4 (conclusion): the two constructions are inverse, so alpha maps to alpha_A(1_A) is a bijection from Nat(Hom(A,-), F) to F(A)."
      - id: kp3
        name: The one-object case — monoid and group actions
        key_prerequisites: [functor-categories]
        constraints: "Identify presheaves on a one-object category with right actions through precomposition. Recover equivariant maps from their identity value and distinguish regular-action transport from fixed-point conditions."
        exemplars:
          - problem: "Regard Z/4 as a one-object category, with composition addition. Construct its representable presheaf and hence the right-action maps for arrows 1 and 2. Give their value lists on 0,1,2,3, first for arrow 1 then arrow 2."
            answer: "1, 2, 3, 0, 2, 3, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The presheaf action is precomposition in the one-object category. Constructing these restrictions identifies its regular right action. The result is 1, 2, 3, 0, 2, 3, 0, 1."
          - problem: "Regard the group $\\mathbb{Z}/2 = \\{e, t\\}$ as a one-object category; presheaves on it are exactly the right $\\mathbb{Z}/2$-sets. Let $X = \\{1,2,3,4,5\\}$ be the right $\\mathbb{Z}/2$-set in which $t$ swaps $1$ and $2$ and fixes $3$, $4$, $5$. The representable presheaf is $\\mathbb{Z}/2$ with its regular right action. How many equivariant maps are there from the regular right $\\mathbb{Z}/2$-set to $X$?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify the context: presheaves on the one-object category of $\\mathbb{Z}/2$ are right $\\mathbb{Z}/2$-sets, and the representable presheaf is the regular right action. Apply the Yoneda lemma: equivariant maps from the regular right $\\mathbb{Z}/2$-set to $X$ correspond bijectively to elements of $X$, via $\\alpha \\mapsto \\alpha(e)$, with $\\alpha(m) = \\alpha(e) \\cdot m$. Each of the five elements of $X$ defines such a map, and every map arises this way. The count is 5."
          - problem: "Regard the additive group $\\mathbb{Z}/7$ as a one-object category; presheaves on it are the right $\\mathbb{Z}/7$-sets, and the representable presheaf is the regular right action of $\\mathbb{Z}/7$ on itself. Let $\\alpha$ be an equivariant map from the regular right $\\mathbb{Z}/7$-set to itself, with $\\alpha(5) = 2$. The Yoneda lemma says that $\\alpha$ is completely determined by $\\alpha(0)$. Determine $\\alpha(0)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Yoneda lemma identifies $\\alpha$ with $\\alpha(0)$: every equivariant map from the regular right $\\mathbb{Z}/7$-set to itself satisfies $\\alpha(m) = \\alpha(0) + m$. Use the given value: $\\alpha(5) = \\alpha(0) + 5 = 2$, so $\\alpha(0) = 2 - 5 = -3$, which is $4$ in $\\mathbb{Z}/7$. The value is 4."
          - problem: "Regard the additive group $\\mathbb{Z}/6$ as a one-object category; presheaves on it are the right $\\mathbb{Z}/6$-sets. The representable presheaf is $\\mathbb{Z}/6$ with its regular right action, and equivariant maps from this presheaf to itself are its natural endotransformations. How many such equivariant maps are there?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the Yoneda lemma with $X$ the representable presheaf itself: natural transformations $\\mathrm{Hom}(-,*) \\to \\mathrm{Hom}(-,*)$ correspond bijectively to elements of $\\mathrm{Hom}(*,*) = \\mathbb{Z}/6$, via $\\alpha \\mapsto \\alpha(0)$. Each element $k$ gives the equivariant translation $\\alpha(m) = k + m$, and these six maps are all of them. There are 6."
          - problem: "For Z/3 acting on X={1,2,3} by the cycle t:1->2->3->1, Step 1: the representable is the regular right action. Step 2: an equivariant map is determined by its value at 0. Step 3: that value must be fixed by t, since 0 acted on by t is 0. Step 4: therefore no equivariant map exists. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The identity arrow moves under the regular action: 0 acted on by t is t. Equivariance transports the chosen value without requiring it to be fixed. This is the first unsupported step."
          - problem: "Regard the two-element monoid $M = \\{e, z\\}$, with identity $e$ and absorbing element $z$ (so $z \\cdot z = z$), as a one-object category; presheaves on it are the right $M$-sets. Let $X = \\{1, 2\\}$ be the right $M$-set with $x \\cdot e = x$ and $x \\cdot z = 2$ for every $x$ in $X$. How many equivariant maps are there from the regular right $M$-set to $X$?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify the context: presheaves on the one-object category of $M$ are right $M$-sets, and the Yoneda lemma bijects equivariant maps from the regular right $M$-set to $X$ with the elements of $X$, since $\\alpha$ is determined by $\\alpha(e)$ through $\\alpha(m) = \\alpha(e) \\cdot m$. Check each element: $\\alpha(e) = 1$ gives $\\alpha(z) = 1 \\cdot z = 2$, and $\\alpha(e) = 2$ gives $\\alpha(z) = 2 \\cdot z = 2$; both satisfy $\\alpha(h \\cdot m) = \\alpha(h) \\cdot m$. So there are 2."
          - problem: "Write the full proof: for a monoid $M$, presheaves on the one-object category $BM$ are exactly the right $M$-sets, and the Yoneda lemma gives a bijection between the equivariant maps from the regular right $M$-set to a right $M$-set $X$ and the elements of $X$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (presheaves as actions): a presheaf $X\\colon BM^{op} \\to \\mathbf{Set}$ is the set $X(*)$ together with a function $X(m)\\colon X(*) \\to X(*)$ for each $m \\in M$, with $X(mn) = X(n) \\circ X(m)$ and $X(e) = \\mathrm{id}$. Writing $x \\cdot m = X(m)(x)$, these laws say $x \\cdot (mn) = (x \\cdot m) \\cdot n$ and $x \\cdot e = x$, exactly a right action. Step 2 (representable): the presheaf $\\mathrm{Hom}(-,*)$ has underlying set $\\mathrm{Hom}(*,*) = M$, and $m$ acts by precomposition $h \\mapsto h m$, the right regular action. Step 3 (naturality as equivariance): a natural transformation $\\alpha\\colon \\mathrm{Hom}(-,*) \\to X$ is a function $\\alpha_*\\colon M \\to X(*)$ with $\\alpha_* \\circ \\mathrm{Hom}(m,-) = X(m) \\circ \\alpha_*$, that is $\\alpha(h \\cdot m) = \\alpha(h) \\cdot m$: an equivariant map. Step 4 (bijection): define $\\Phi(\\alpha) = \\alpha(e)$. For $x \\in X(*)$ set $\\alpha_x(m) = x \\cdot m$; the action laws give $\\alpha_x(h \\cdot m) = x \\cdot (hm) = (x \\cdot h) \\cdot m = \\alpha_x(h) \\cdot m$, so $\\alpha_x$ is equivariant. These constructions are inverse: $\\alpha_{\\Phi(\\alpha)}(m) = \\alpha(e) \\cdot m = \\alpha(e m) = \\alpha(m)$ by equivariance, and $\\Phi(\\alpha_x) = \\alpha_x(e) = x \\cdot e = x$. Hence $\\alpha \\mapsto \\alpha(e)$ is a bijection between equivariant maps from the regular right $M$-set to $X$ and the elements of $X$."
    diagnostic_exemplar:
      problem: "Let $M=\\mathbb Z/4$ (written additively) be viewed as a one-object category, so that presheaves on it are right $M$-sets. Let $X=\\{p,q\\}$ carry the right action in which the generator $1$ swaps $p$ and $q$. Use the Yoneda lemma to describe the natural transformations from the representable presheaf (the regular right $M$-set $M$) to $X$, and say exactly how many there are."
      answer: "The action is well defined: sending $1$ to the transposition of $\\{p,q\\}$ extends to a homomorphism $\\mathbb Z/4\\to\\mathrm{Sym}(X)$ because the transposition has order $2$, which divides $4$. Writing $*$ for the unique object, the representable presheaf is $\\mathrm{Hom}(-,*)=M$ with right multiplication, and the contravariant Yoneda lemma gives $\\mathrm{Nat}(\\mathrm{Hom}(-,*),X)\\cong X(*)=X$ via $\\alpha\\mapsto\\alpha(e)$, where $e=0$ is the identity. Concretely the transformation attached to $x\\in X$ is $\\alpha^x(m)=x\\cdot m$, which is equivariant since $(x\\cdot m)\\cdot m'=x\\cdot(mm')$, and $\\alpha^x(e)=x$ recovers $x$. So the equivariant maps $M\\to X$ correspond bijectively to the elements of $X$, and there are exactly $2$ of them (namely $m\\mapsto p\\cdot m$ and $m\\mapsto q\\cdot m$)."
      solution_sketch: "First check the action is well defined: a transposition has order $2$, which divides $4$. Then apply Yoneda at the unique object, $\\mathrm{Nat}(\\mathrm{Hom}(-,*),X)\\cong X$ by $\\alpha\\mapsto\\alpha(e)$, so the equivariant maps are $m\\mapsto x\\cdot m$, one for each element $x$."
    anki_seeds:
      - front: "The Yoneda lemma states..."
        back: "$\\mathrm{Nat}(\\mathrm{Hom}(A,-),F)\\cong FA$ naturally, via $\\alpha\\mapsto\\alpha_A(1_A)$."
        type: basic
      - front: "Inverse of the Yoneda map sends $u\\in FA$ to..."
        back: "the natural transformation $h\\mapsto (Fh)(u)$."
        type: basic
      - front: "How many natural transformations $\\mathrm{Hom}(A,-)\\Rightarrow F$ are there?"
        back: "exactly $|FA|$ — they are in bijection with the elements of $FA$."
        type: basic

  - id: yoneda-lemma
    name: The Yoneda Lemma
    core: true
    difficulty: 0.85
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: yoneda-statement-mechanics
        weight: 0.6
        key: true
      - id: representable-functors
        weight: 0.4
        key: true
      - id: natural-transformations
        weight: 0.4
        key: true
      - id: functor-categories
        weight: 0.3
      - id: universal-elements
        weight: 0.3
      - id: hom-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Proof of the bijection
        key_prerequisites: [natural-transformations]
        constraints: "Verify both directions of the Yoneda bijection by identity evaluation and the naturality square applied to an identity. Construct missing components or proof paths instead of evaluating an explicitly supplied reconstruction formula."
        exemplars:
          - problem: "C has objects 1,2 and arrow s:1->2. A covariant F has F(1)={0,1,2},F(2)={0,...,6},F(s)(x)=2x+1. Construct the transformation Hom(1,-)=>F from identity value u=2. Derive its naturality square at s and give the element of F(2) obtained by its two routes on 1_1."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (left side): F s o Theta(u)_1 at 1_1 is F(s)((F 1_1)(u)), which is F(s)(u) = F(s)(2) = 5, using the identity law F(1_1) = 1_{F(1)}. Step 2 (right side): Hom(1,s)(1_1) = s o 1_1 = s, so Theta(u)_2 at that arrow is (F s)(u) = 5 by the definition Theta(u)_X(h) = (F h)(u). Step 3 (composition law of F): the two sides agree because F(s o 1_1) = F(s) o F(1_1), which is exactly the naturality of Theta(u). The answer is 5."
          - problem: "C has objects 1,2 and arrow s:1->2. F(1)={0,1,2,3},F(2)={0,...,9},F(s)(x)=3x. A natural alpha:Hom(1,-)=>F has alpha_1(1_1)=1. Prove the reconstruction round trip at the arrow s using alpha naturality and give the forced value at s."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (the Psi map): Psi(alpha) = alpha_1(1_1) = 1. Step 2 (the Theta map on the round trip): Theta(Psi(alpha))_2(s) = (F s)(alpha_1(1_1)) = (F s)(1) = 3. Step 3 (citation): this value equals alpha_2(s) because naturality of alpha at s applied to 1_1 gives alpha_2(s) = (F s)(alpha_1(1_1)), which is the round trip Theta Psi = id. The answer is 3."
          - problem: "On C=(a->b), G(a)={0,1,2},G(b)={0,1}, with G(t)(x)=x mod 2. A candidate alpha:Hom(a,-)=>G assigns alpha_a(1_a)=2. Enumerate its possible values alpha_b(t) consistent with naturality, then verify reconstruction has no other choice. Give the set of values."
            answer: "{0}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Naturality on t applied to the identity forces the remaining component. The identity law makes evaluation of the reconstructed transformation recover u. The result is {0}."
          - problem: "C has one object and arrows Z/4 under addition. Let F(r)(x)=x+r mod 4. A natural alpha:Hom(*,-)=>F satisfies alpha(1)=3. Recover its identity value and then every component value; give alpha(0),alpha(1),alpha(2),alpha(3)."
            answer: "2, 3, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality reconstructs every value from alpha(0); solving the given component recovers that identity value, which also checks the round trip. The result is 2, 3, 0, 1."
          - problem: "C is the category a->b. A covariant F has F(a)={0,1,2},F(b)={0,1}, and F(a->b)=[0, 0, 1]. A natural alpha:Hom(a,-)=>F has components encoded by the pair (alpha_a(1_a),alpha_b(a->b)). Derive all possible pairs from naturality, then compare evaluation at the identity with evaluation at the nonidentity arrow. Give the fiber sizes over 0,1,2 for identity evaluation, then over 0,1 for nonidentity evaluation."
            answer: "1, 1, 1, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality at the arrow applied to the identity forces the second component from the first. Hence every identity value gives exactly one transformation, proving both inverse directions in this category; nonidentity evaluation can lose that information. The result is 1, 1, 1, 2, 1."
          - problem: "C is the category a->b. A covariant F has F(a)={0,1,2},F(b)={0,1}, and F(a->b)=[1, 0, 1]. A natural alpha:Hom(a,-)=>F has components encoded by the pair (alpha_a(1_a),alpha_b(a->b)). Derive all possible pairs from naturality, then compare evaluation at the identity with evaluation at the nonidentity arrow. Give the fiber sizes over 0,1,2 for identity evaluation, then over 0,1 for nonidentity evaluation."
            answer: "1, 1, 1, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality at the arrow applied to the identity forces the second component from the first. Hence every identity value gives exactly one transformation, proving both inverse directions in this category; nonidentity evaluation can lose that information. The result is 1, 1, 1, 1, 2."
          - problem: "Write the full proof: for a functor F from C to Set and an object A of C, the maps Psi(alpha) = alpha_A(1_A) and Theta(u)_X(h) = (F h)(u) are mutually inverse and Theta(u) is natural, so the transformations from Hom(A,-) to F are in bijection with the elements of F(A). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (Theta is natural): fix u in F(A) and define Theta(u)_X(h) = (F h)(u); the types match since F h goes from F(A) to F(X). For an arrow k: X -> Y, naturality at k asks F k o Theta(u)_X = Theta(u)_Y o Hom(A,k); evaluated at h in Hom(A,X), the left side is F k((F h)(u)) = F(k o h)(u) by the composition law of F, and the right side is Theta(u)_Y(k o h) = F(k o h)(u), so they agree and Theta(u) is natural. Step 2 (Psi o Theta): Psi(Theta(u)) = Theta(u)_A(1_A) = (F 1_A)(u) = 1_{F(A)}(u) = u, citing the identity law F(1_A) = 1_{F(A)}. Step 3 (Theta o Psi): let alpha be any transformation; for h: A -> X, naturality of alpha at h applied to 1_A gives alpha_X(h) = alpha_X(Hom(A,h)(1_A)) = (F h)(alpha_A(1_A)) = Theta(Psi(alpha))_X(h). Step 4 (conclusion): both round trips are the identity, so Psi and Theta are mutually inverse and Nat(Hom(A,-), F) is in bijection with F(A)."
      - id: kp2
        name: Naturality of the Yoneda isomorphism
        key_prerequisites: [functor-categories]
        constraints: "Construct the induced maps in both naturality squares of the Yoneda bijection, keeping variance explicit. Grade their typed paths or reconstructed expressions, not only an evaluation after the routes are supplied."
        exemplars:
          - problem: "For covariant F,Fprime:C->Set and phi:F=>Fprime, construct the two sides of the Yoneda naturality square at A. Map bank: 1=postcompose alpha by phi; 2=precompose alpha by phi; 3=phi_A:F(A)->Fprime(A); 4=phi_X at an unrelated object X. Give the map on natural transformations, then the map on identity values."
            answer: "1, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality in the functor variable uses postcomposition of transformations and the component at the representing object. The result is 1, 3."
          - problem: "Let g:A->B and F:C->Set be covariant. Recover the arrow between representables that induces Nat(Hom(A,-),F)->Nat(Hom(B,-),F). Bank: 1=Hom(A,-)->Hom(B,-); 2=Hom(B,-)->Hom(A,-). Also select the map on Yoneda values: 1=F(g):F(A)->F(B); 2=F(g):F(B)->F(A). Give both numbers."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The hom-functor map reverses g, and precomposing a natural transformation reverses it again. Yoneda therefore acts covariantly in A. The result is 2, 1."
          - problem: "Let alpha:Hom(A,-)=>F, sigma:F=>H, and f:A->B. Write Psi_A(alpha)=alpha_A(1_A). To establish joint naturality of Yoneda, audit four proposed justifications, using 1 for sufficient and 0 for insufficient: (i) sigma_B(alpha_B(f))=H(f)(sigma_A(alpha_A(1_A))) follows from naturality of sigma alone, without using naturality of alpha; (ii) the same equation follows from naturality of alpha and sigma; (iii) Psi_A(sigma after alpha)=sigma_A(Psi_A(alpha)) follows from componentwise composition; (iv) sigma_B(F(f)(u))=H(f)(sigma_A(u)) for arbitrary u in F(A) follows from naturality of alpha alone, without naturality of sigma. Give the four bits. Derive the two induced maps and their routes before judging which laws justify them."
            answer: "0, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Object transport precomposes a transformation with Hom(f,-), giving alpha_B(f) at the identity. Naturality of alpha turns this into F(f)(alpha_A(1_A)); naturality of sigma supplies the remaining square. Functor-variable naturality alone is componentwise composition. The result is 0, 1, 1, 0."
          - problem: "For g:A->B and alpha:Hom(A,-)=>F, reconstruct the identity value at B after transporting alpha to a transformation out of Hom(B,-). Bank of arguments to alpha_B: 1=1_A; 2=g; 3=1_B. Also choose its forced expression: 1=F(g)(alpha_A(1_A)); 2=F(g)(alpha_B(1_B)); 3=alpha_A(F(g)). Give the two bank numbers."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Precomposition carries 1_B to g. Naturality of alpha at g then identifies the transported identity value with F(g) applied to its original identity value. The result is 2, 1."
          - problem: "Step 1: phi:F=>Fprime induces alpha->phi after alpha. Step 2: Psi(alpha)=alpha_A(1_A). Step 3: phi_A(alpha_A(1_A))=alpha_A(phi_A(1_A)). Step 4: this proves Yoneda naturality in F. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "phi_A accepts an element of F(A), while 1_A is an element of Hom(A,A). The right side is ill-typed; use componentwise composition instead. This is the first unsupported step."
          - problem: "C is the one-object category S3, with composition of permutations. F is its regular left action. A natural alpha:Hom(*,-)=>F has identity value u=(1,0,2). Transport alpha in the representing-object variable along f=(0,2,1), then g=(1,0,2), using the induced maps of representables. Give the transported identity value as a permutation list, then the value from the reversed transport order. Derive the transport formula from naturality; it is not supplied."
            answer: "2, 1, 0, 0, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The representable map induced by a representing arrow acts by precomposition; precomposing alpha with that natural transformation yields its transported parameter. Noncommutativity makes the order of the two naturality transports essential. The result is 2, 1, 0, 0, 2, 1."
          - problem: "Write the full proof: the Yoneda bijection Ψ : Nat(Hom(A, −), F) → FA with Ψ(α) = α_A(1_A) is natural in F and in A. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Set Ψ_F(α) = α_A(1_A). Naturality in F: for φ : F ⇒ F', the square has the two induced maps α ↦ φ ∘ α on Nat(Hom(A, −), −) and φ_A on evaluation at A. Evaluate both routes on α. Route one: φ_A(Ψ_F(α)) = φ_A(α_A(1_A)). Route two: Ψ_F'(φ ∘ α) = (φ ∘ α)_A(1_A) = φ_A(α_A(1_A)). The two agree, so the square commutes and the bijection is natural in F. Naturality in A: for f : A → B, the square has the two induced maps α ↦ α ∘ f* with (f*)_X(g) = g ∘ f, and Ff on values. Route one: Ψ_B(α ∘ f*) = (α ∘ f*)_B(1_B) = α_B(1_B ∘ f) = α_B(f). Route two: Ff(Ψ_A(α)) = Ff(α_A(1_A)) = α_B(f ∘ 1_A) = α_B(f), using naturality of α at f. The two agree, so the bijection is natural in A as well, which completes the proof."
      - id: kp3
        name: The contravariant form and its computational corollary
        key_prerequisites: [functor-categories]
        constraints: "Apply the contravariant form at a second presheaf: name the presheaf $G$ being substituted, read off the resulting hom-set, and when $G$ is a representable $\\mathrm{Hom}(-,A)$ say whether the bijection is an isomorphism of monoids."
        exemplars:
          - problem: "Let C be the category with objects a and b, the identity on each object, and morphisms f, g, h, k from a to b, with no other morphisms; there is no morphism from b to a. Apply the contravariant Yoneda lemma with the object a and with the representable presheaf G = Hom(-, b) substituted in the second slot, and read off the resulting hom-set. How many natural transformations are there from Hom(-, a) to Hom(-, b)?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, the lemma: the contravariant Yoneda lemma gives a bijection between Nat(Hom(-, x), G) and G(x) for every presheaf G and every object x. Step 2, substitution: take x = a and the representable presheaf G = Hom(-, b), so the set to read off is G(a) = Hom(-, b)(a) = Hom(a, b). Step 3, count: the morphisms from a to b are exactly f, g, h and k, so Hom(a, b) has 4 elements, and the bijection preserves the number of elements. The answer is 4."
          - problem: "C is the one-object category Z/3 under addition. For the contravariant representable y(*), transformations alpha,beta have identity values 1 and 2. Reconstruct their components and give the identity value of beta after alpha, followed by its full value list on arrows 0,1,2."
            answer: "0, 0, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Identity evaluation identifies a natural endomorphism with its inducing arrow. Composition of the reconstructed transformations agrees with monoid composition. The result is 0, 0, 1, 2."
          - problem: "Let C be the category of the poset with objects 1, 2, 3 ordered by 1 <= 2 <= 3. Define a presheaf G on C as follows: G(3) has the elements a, b, c, d; G(2) has the elements p, q, r, s, t; G(1) has the elements u, v; and every restriction map of G sends each element to the first element of its target set. Apply the contravariant Yoneda lemma to the representable presheaf Hom(-, 2) and this presheaf G. How many natural transformations are there from Hom(-, 2) to G?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The contravariant Yoneda lemma gives a bijection Nat(Hom(-, A), G) with G(A). Substitute A = 2 and the presheaf G from the table: the object to read off is G(2), the set with elements p, q, r, s, t. Count with the read-off rule of the lemma: G(2) has 5 elements, and a bijection preserves the number of elements. The answer is 5."
          - problem: "Let C be the category of the poset with objects x, y, z ordered by x <= y <= z. Substitute the representable presheaf Hom(-, x) for G in the contravariant Yoneda lemma, with z as the object A, and read off the resulting hom-set. How many natural transformations are there from Hom(-, z) to Hom(-, x)?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The contravariant Yoneda lemma gives a bijection Nat(Hom(-, A), G) with G(A). Substitute A = z and the representable presheaf G = Hom(-, x): the object to read off is G(z) = Hom(-, x)(z) = Hom(z, x). Apply the poset rule for hom-sets: a morphism from z to x exists only when z <= x, and the order is x <= y <= z, so Hom(z, x) is empty. The answer is 0."
          - problem: "Let C be the category of the poset with objects u and v and the single order relation u <= v. Let G be the presheaf on C with G(v) having the elements 2, 6, 10 and G(u) having the elements 5, 9; the restriction map from G(v) to G(u) along u <= v sends 2 to 5, 6 to 5, and 10 to 9. Let alpha be the natural transformation from Hom(-, v) to G that the contravariant Yoneda lemma matches with the element 10 of G(v). Give the value of the component of alpha at u, evaluated at the unique morphism from u to v."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the contravariant Yoneda lemma, alpha is the natural transformation with alpha_v(1_v) = 10. Rule of the inverse map: for every morphism w from an object X to v, the component satisfies alpha_X(w) = G(w)(10), which is the naturality square of alpha at w. Apply the rule with X = u and w the unique morphism from u to v: G(w) is the restriction map of the presheaf, and it sends 10 to 9. The answer is 9."
          - problem: "C has objects a,b, identities, and one arrow a->b. Derive the contravariant Yoneda classification for each ordered pair (A,B)=(a,a),(a,b),(b,a),(b,b), where the transformations are Hom(-,A)=>Hom(-,B). Give their four cardinalities. The identity-evaluation Hom direction is not supplied."
            answer: "1, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Evaluate a transformation at the identity of A and derive an arrow A->B. Naturality then forces every component by postcomposition; this recovers the direction and all four cases instead of presupposing the decisive Hom set. The result is 1, 1, 0, 1."
          - problem: "Write the full proof: for every presheaf G on a category C and every object A of C, the map sending a natural transformation alpha from Hom(-, A) to G to the element alpha_A(1_A) of G(A) is a bijection that is natural in G; and when G is the representable presheaf Hom(-, A), this bijection is an isomorphism of monoids from Nat(Hom(-, A), Hom(-, A)) onto the endomorphism monoid of A. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, the map: for a natural transformation alpha from Hom(-, A) to G, the component alpha_A sends morphisms from A to A into G(A), so alpha_A(1_A) is an element of G(A). Step 2, the inverse: for an element x of G(A), define alpha_X(w) = G(w)(x) for every object X and every morphism w from X to A. Step 3, naturality: for morphisms t from X' to X and w from X to A, both G(t)(alpha_X(w)) and alpha_X'(w after t) equal G(w after t)(x), because G reverses composition; hence the naturality square of alpha commutes. Step 4, first round trip: starting from alpha with x = alpha_A(1_A), the constructed transformation sends w to G(w)(alpha_A(1_A)), and the naturality square of alpha at w gives G(w)(alpha_A(1_A)) = alpha_X(w), so alpha is recovered. Step 5, second round trip: starting from x, the value at A on 1_A is G(1_A)(x) = x, so the map is a bijection. Step 6, naturality in G: for a morphism of presheaves t from G to H, vertical composition gives t_A(alpha_A(1_A)) = (t after alpha)_A(1_A), which is the naturality condition in G. Step 7, the monoid case: with G = Hom(-, A) the values land in the endomorphism monoid of A; vertical composition gives (beta after alpha)_A(1_A) = beta_A(alpha_A(1_A)), the composite in that monoid, and the identity transformation maps to 1_A, so the bijection is an isomorphism of monoids. This completes the proof."
    diagnostic_exemplar:
      problem: "Prove the contravariant Yoneda lemma: for a presheaf $G\\colon\\mathcal C^{op}\\to\\mathbf{Set}$ and an object $A$, the assignment $\\Psi(\\alpha)=\\alpha_A(1_A)$ is a bijection $\\mathrm{Nat}(\\mathrm{Hom}(-,A),G)\\to GA$. Exhibit the inverse, verify both round trips, and check that the bijection is natural in $G$."
      answer: "Inverse: for $u\\in GA$ define $\\Theta(u)_X\\colon\\mathrm{Hom}(X,A)\\to GX$ by $\\Theta(u)_X(h)=(Gh)(u)$. This is natural: for $k\\colon W\\to X$ the presheaf $\\mathrm{Hom}(-,A)$ acts by pre-composition, and $\\Theta(u)_W(h\\circ k)=G(h\\circ k)(u)=\\big(Gk\\circ Gh\\big)(u)=Gk\\big(\\Theta(u)_X(h)\\big)$, using the contravariant composition law $G(h\\circ k)=Gk\\circ Gh$. Round trip 1: $\\Psi(\\Theta(u))=\\Theta(u)_A(1_A)=G(1_A)(u)=u$, since $G(1_A)=1_{GA}$. Round trip 2: for $\\alpha$ natural and $h\\colon X\\to A$, naturality of $\\alpha$ at $h$ reads $\\alpha_X\\circ(-\\circ h)=Gh\\circ\\alpha_A$; evaluating both sides at $1_A$ gives $\\alpha_X(h)=Gh(\\alpha_A(1_A))=\\Theta(\\Psi(\\alpha))_X(h)$, so $\\Theta\\Psi=\\mathrm{id}$. Hence $\\Psi$ is a bijection with inverse $\\Theta$. Naturality in $G$: for $\\varphi\\colon G\\Rightarrow G'$ the square compares $\\alpha\\mapsto\\varphi\\cdot\\alpha\\mapsto(\\varphi\\cdot\\alpha)_A(1_A)=\\varphi_A(\\alpha_A(1_A))$ with $\\alpha\\mapsto\\alpha_A(1_A)\\mapsto\\varphi_A(\\alpha_A(1_A))$; the two routes agree, so the square commutes."
      solution_sketch: "Both directions are a chase of the identity. $\\Psi$ evaluates at $1_A$, and naturality of $\\alpha$ at $h$ applied to $1_A$ forces $\\alpha_X(h)=Gh(\\alpha_A(1_A))$ — which is what the inverse $\\Theta(u)_X(h)=(Gh)(u)$ must be. The other round trip is $G(1_A)=1_{GA}$, and naturality in $G$ is a one-line comparison of the two routes."
    anki_seeds:
      - front: "Key step in the proof of the Yoneda lemma?"
        back: "apply naturality of $\\alpha$ at $h$ to $1_A$: $\\alpha_X(h)=(Fh)(\\alpha_A(1_A))$."
        type: basic
      - front: "$\\mathrm{Nat}(\\mathrm{Hom}(-,A),\\mathrm{Hom}(-,B))\\cong$ {{c1::$\\mathrm{Hom}(A,B)$}}."
        back: "$\\mathrm{Hom}(A,B)$"
        type: cloze
      - front: "The Yoneda isomorphism is natural in which variables?"
        back: "both — in the functor $F$ and in the object $A$."
        type: basic

  - id: yoneda-embedding
    name: The Yoneda Embedding
    core: true
    difficulty: 0.82
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: yoneda-lemma
        weight: 0.5
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: functor-categories
        weight: 0.2
      - id: covariant-contravariant-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The embedding as a functor
        key_prerequisites: [yoneda-lemma]
        constraints: "Construct both the representable presheaf action and the embedding action on arrows. Derive variance and check identity/composition laws explicitly; do not replace these constructions by hom-set cardinalities."
        exemplars:
          - problem: "Construct the presheaf y(A) for A={0,1}. For X={p,q}, number its elements by lists [0,0],[0,1],[1,0],[1,1]. A map u:{*}->X picks q. Give the restriction map y(A)(u) on these four elements as a value list in A."
            answer: "0, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The representable presheaf acts contravariantly by precomposition. Restrict each generalized point along u. The result is 0, 1, 0, 1."
          - problem: "For the covariant-hom embedding A->Hom(A,-), let f:{a,b}->{c,d,e} send a to e,b to c. At X={0,1}, g:{c,d,e}->X has values [1,0,0]. Recover the component action induced by f and give the resulting map values at a,b."
            answer: "0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The covariant-hom embedding is contravariant in the representing object. Its component precomposes g with f. The result is 0, 1."
          - problem: "C is the one-object category of Z/6 under addition. Construct the action of the presheaf Yoneda embedding on the arrow 4 from its definition on representable objects. Give the value of its component on arrow 5."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In the one-object category the embedding sends m to the post-composition map h maps to m after h, which here is m + h modulo 6. Substitute m = 4 and h = 5: the composite is 4 + 5 = 9. Reduce modulo 6: 9 - 6 = 3. The answer is 3."
          - problem: "In Set let f:A->B have A={1,2},B={3,4,5}, f=[3,5]. For the covariant-hom embedding, derive the natural transformation induced by f. At X={6,7,8}, g:B->X has values [8,6,7]. Give the resulting function on A as (value at 1,value at 2)."
            answer: "(8, 7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The covariant-hom embedding sends f to pre-composition, so its component at X maps g to the function g after f on A. First evaluate the inner function: f(1) = 3 and f(2) = 5. Then apply g by its table: g(3) = 8 and g(5) = 7. The answer is (8, 7)."
          - problem: "For y(A)=Hom(-,A), Step 1: y(f)_X sends h:X->A to f after h. Step 2: y(g after f)_X(h)=(g after f) after h. Step 3: associativity changes this to f after (g after h). Step 4: this proves the composition law. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Associativity changes parentheses while preserving arrow order: g after (f after h). The proposed order is ill-typed in general. This is the first unsupported step."
          - problem: "Let C be the one-object category whose arrows are finite words in distinct letters a,b, with identity the empty word and composition v after u defined as concatenation vu. Starting from y(A)=Hom_C(-,A), reconstruct its action on arrows of C^op. Consider two proposed actions of the Yoneda embedding on an arrow f: L(f) sends a generalized point h to fh, whereas R(f) sends it to hf. For each proposal decide whether its components are natural with respect to the reconstructed presheaf action, whether it preserves the identity, and whether it preserves composition. Each property must hold for all words. Give the three bits for L followed by the three bits for R, using 1 for valid. Establish valid equations on arbitrary words and use noncommuting words to refute invalid equations."
            answer: "1, 1, 1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Precomposition makes the presheaf restriction h map to hu. Left multiplication commutes with this right action and respects gf; right multiplication reverses the required multiplication order and fails naturality when the restriction word and f do not commute. The result is 1, 1, 1, 0, 1, 0."
          - problem: "Write the full proof: define the Yoneda embedding y from C to the presheaf category [C^op, Set] on objects and on morphisms, state which composition it uses, and prove that y is a functor. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Definition on objects: y(A) = Hom(-, A), the representable presheaf; its component at X is the set Hom(X, A). Definition on morphisms: for f from A to B, y(f) is post-composition by f, the natural transformation with component Hom(X, A) to Hom(X, B) sending h to the composite f after h. Naturality: for u from X' to X, the composite (f after h) after u equals f after (h after u) by associativity, so the naturality square commutes. Identity law: y(1_A) sends h to the composite 1_A after h, which is h, so y(1_A) = 1. Composition law: y(g) after y(f) sends h to g after (f after h), which equals (g after f) after h by associativity, so y(g) after y(f) = y(g after f). Conclusion: y preserves identities and composites, so y is a functor from C to [C^op, Set]."
