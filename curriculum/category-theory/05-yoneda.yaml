unit: yoneda
course: category-theory
module: "Yoneda & Representables"
topics:
  - id: representable-functors
    name: Representable Functors
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: hom-functors
        weight: 0.5
        key: true
      - id: natural-isomorphisms
        weight: 0.4
        key: true
      - id: covariant-contravariant-functors
        weight: 0.2
      - id: universal-properties
        weight: 0.3
      # Phase C reconciliation: kp2's whole skill is the freeness argument — the learner
      # proves $U\colon\mathbf{Grp}\to\mathbf{Set}$ representable by $\mathbb{Z} = F(\{a\})$
      # because homs out of a free group are determined by the generator's image
      # (free-groups-presentations kp1/kp2, quoted almost verbatim).
      - id: free-groups-presentations
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Definition of representability
        key_prerequisites: [hom-functors]
        constraints: "Definitions and one-line illustrations only; always name both the representing object and the natural isomorphism $\\mathrm{Hom}(A,-)\\cong F$, and say which variance is in play; the only concrete instance is the identity functor on $\\mathbf{Set}$, represented by a one-point set."
        exemplars:
          - problem: "Define a representable functor $\\mathcal C\\to\\mathbf{Set}$ and a representation of it."
            answer: "$F$ with a natural iso $\\mathrm{Hom}(A,-)\\cong F$ for some $A$; the pair (object, iso) is a representation."
            solution_sketch: "$F\\colon\\mathcal C\\to\\mathbf{Set}$ is representable if there is an object $A$ and a natural isomorphism $\\alpha\\colon\\mathrm{Hom}(A,-)\\xRightarrow{\\cong}F$. The pair $(A,\\alpha)$ is a representation and $A$ the representing object. Contravariantly, $F\\colon\\mathcal C^{op}\\to\\mathbf{Set}$ is representable if $F\\cong\\mathrm{Hom}(-,A)$."
          - problem: "Illustrate the definition by exhibiting a representation of the identity functor $\\mathrm{Id}\\colon\\mathbf{Set}\\to\\mathbf{Set}$."
            answer: "$\\mathrm{Id}\\cong\\mathrm{Hom}(\\{*\\},-)$; the representing object is the one-point set $\\{*\\}$."
            solution_sketch: "A function $\\{*\\}\\to X$ is determined by the image of $*$, an arbitrary element of $X$, so $\\mathrm{Hom}_{\\mathbf{Set}}(\\{*\\},X)\\cong X$ via $f\\mapsto f(*)$. This is natural in $X$: for $g\\colon X\\to Y$, post-composition $g\\circ(-)$ corresponds to applying $g$. Hence $\\mathrm{Id}\\cong\\mathrm{Hom}(\\{*\\},-)$, a representation with representing object $\\{*\\}$ and universal element $*\\in\\mathrm{Id}(\\{*\\})$."
      - id: kp2
        name: Recognizing representable functors
        key_prerequisites: [natural-isomorphisms, free-groups-presentations]
        constraints: "Forgetful functors out of $\\mathbf{Mon}$, $\\mathbf{Grp}$ or $\\mathbf{Ab}$, whose representing object is the free object on one generator ($\\mathbb N$, $\\mathbb Z$); the argument must be that a homomorphism out of the free object is determined by, and free on, the image of that generator, with naturality in the target noted."
        exemplars:
          - problem: "Show the forgetful functor $U\\colon\\mathbf{Mon}\\to\\mathbf{Set}$ is representable and name the representing object."
            answer: "$U\\cong\\mathrm{Hom}_{\\mathbf{Mon}}(\\mathbb N,-)$; the representing object is $\\mathbb N$, the free monoid on one generator."
            solution_sketch: "A homomorphism $\\mathbb N\\to M$ (with $\\mathbb N=(\\{0,1,2,\\dots\\},+)$, free on one generator) is determined by the image of $1$, an arbitrary element of $M$. So $\\mathrm{Hom}_{\\mathbf{Mon}}(\\mathbb N,M)\\cong UM$ naturally in $M$, giving $U\\cong\\mathrm{Hom}(\\mathbb N,-)$: $U$ is representable, represented by $\\mathbb N$."
          - problem: "Show the forgetful functor $U\\colon\\mathbf{Grp}\\to\\mathbf{Set}$ is representable and name the representing object."
            answer: "$U\\cong\\mathrm{Hom}_{\\mathbf{Grp}}(\\mathbb Z,-)$; the representing object is $\\mathbb Z$, the free group on one generator."
            solution_sketch: "A group homomorphism $\\mathbb Z\\to G$ is determined by the image of the generator $1$, which may be any element of $G$ since $\\mathbb Z$ is free on one generator. Thus $\\mathrm{Hom}_{\\mathbf{Grp}}(\\mathbb Z,G)\\cong UG$ via $\\varphi\\mapsto\\varphi(1)$, naturally in $G$. Hence $U\\cong\\mathrm{Hom}(\\mathbb Z,-)$, so $U$ is representable, represented by $\\mathbb Z$."
      - id: kp3
        name: Uniqueness of the representing object
        key_prerequisites: [universal-properties]
        constraints: "Abstract identity-chasing proofs from a natural isomorphism of representables: set the comparison maps as $\\theta_A(1_A)$ and $\\theta^{-1}_B(1_B)$, obtain each formula $\\theta_X(h)=h\\circ g$ by naturality, then evaluate at the two identities; no elements of any concrete category."
        exemplars:
          - problem: "Work in the category of finite sets with A = {1, 2} and B = {3, 4}, and let theta: Hom(A, -) -> Hom(B, -) be a natural isomorphism. The proof sets f = theta^{-1}_B(1_B): A -> B and g = theta_A(1_A): B -> A and shows that the two comparison maps are mutually inverse. Suppose f(1) = 4 and f(2) = 3. Compute g(3)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: f: A -> B with f(1) = 4, f(2) = 3, and the identities f o g = 1_B and g o f = 1_A that the proof obtains by evaluating the naturality formula at the two identities. Rule of the proof: the naturality formula theta_X(h) = h o g, chased at 1_B and 1_A, makes f and g mutually inverse. Hence g is the inverse function of f, sending 3 to 2 and 4 to 1. The answer is 2."
          - problem: "Work in the category of finite sets with A = B = {1, 2, 3}, and let theta: Hom(-, A) -> Hom(-, B) be a natural isomorphism of contravariant representables. The proof sets f = theta_A(1_A): A -> B and g = theta^{-1}_B(1_B): B -> A and shows that the two comparison maps are mutually inverse. Suppose f(1) = 2, f(2) = 3, and f(3) = 1. Compute g(1)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: f: A -> B with f(1) = 2, f(2) = 3, f(3) = 1, and the identities f o g = 1_B and g o f = 1_A. Rule of the contravariant proof: the naturality formula theta_X(k) = f o k, chased at the two identities, makes the comparison maps mutually inverse. Hence g is the inverse function of f, and since f(3) = 1, the inverse sends 1 back to 3. The answer is 3."
          - problem: "Let theta: Hom(A, -) -> Hom(B, -) be natural, and let g = theta_A(1_A): B -> A be the comparison map. Naturality at an arrow h: A -> X lets you compute theta_X(h) as the composite of h after g. Take A = B = {1, 2} and X = {1, 2, 3}, with g(1) = 2, g(2) = 1, h(1) = 1, and h(2) = 3. Compute the value of theta_X(h) at the element 2."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: g: B -> A with g(1) = 2, g(2) = 1, and h: A -> X with h(1) = 1, h(2) = 3. Rule: naturality of theta at h, applied to 1_A, gives theta_X(h) = h o g. Compose in that order: the element 2 of B goes first to g(2) = 1, then to h(1) = 1. The answer is 1."
          - problem: "Consider the category with two objects 0 and 1 whose only arrow besides the two identities is a: 0 -> 1. A student compares the arrow sets Hom(0, 1) and Hom(1, 1), finds exactly one arrow in each, and concludes that 0 and 1 are isomorphic. How many arrows are there from 1 to 0?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the category with arrows 1_0, 1_1, and a: 0 -> 1. Rule: an isomorphism between two objects needs arrows in both directions whose composites are the identities, so Hom(1, 0) must be nonempty. None of the three arrows goes from 1 to 0, so Hom(1, 0) is empty, no isomorphism exists, and comparing hom-sets at one single object cannot replace the naturality hypothesis of the theorem. The answer is 0."
          - problem: "Claim: if theta: Hom(A, -) -> Hom(B, -) is a natural isomorphism, then A is isomorphic to B. Step 1: set g = theta_A(1_A), an arrow from B to A. Step 2: set f = theta^{-1}_B(1_B), an arrow from A to B. Step 3: since theta is a bijection, theta_B(f) = 1_B, and therefore f o g = 1_B. Step 4: the symmetric argument with theta^{-1} gives g o f = 1_A, so A is isomorphic to B. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly names the comparison map g = theta_A(1_A). Step 2 correctly names the inverse comparison map f = theta^{-1}_B(1_B). Step 3 is the first invalid step: bijectivity alone only gives theta_B(f) = 1_B, while the identity f o g = 1_B requires the naturality formula theta_X(h) = h o g evaluated at X = B with h = f. Step 4 would be valid once Step 3 is repaired by that formula. The answer is Step 3."
          - problem: "In the proof that a natural isomorphism theta: Hom(A, -) -> Hom(B, -) forces A to be isomorphic to B, set g = theta_A(1_A): B -> A and f = theta^{-1}_B(1_B): A -> B. Naturality of theta at an arrow h: A -> X, applied to the identity 1_A, produces the key formula of the proof; here o denotes composition. Select the line that it produces."
            answer: "theta_X(h) = h o g"
            answer_contract: {"kind": "label", "options": [["theta_X(h) = h o g"], ["theta_X(h) = g o h"], ["theta_X(h) = h o f"], ["theta_X(h) = f o h"]]}
            solution_sketch: "Naturality of theta at h: A -> X says theta_X(h o 1_A) = h o theta_A(1_A); since h o 1_A = h and theta_A(1_A) = g, this is the key formula. The line theta_X(h) = g o h composes in the wrong order, which does not even type-check since g lands in A. The line theta_X(h) = h o f uses f, the map belonging to the inverse transformation, not the comparison map g. The line theta_X(h) = f o h makes both errors at once. The answer is theta_X(h) = h o g."
          - problem: "Write the full proof: if Hom(A, -) is naturally isomorphic to Hom(B, -), then A is isomorphic to B. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let theta: Hom(A, -) -> Hom(B, -) be a natural isomorphism. Step 1, comparison maps: set g = theta_A(1_A): B -> A and f = theta^{-1}_B(1_B): A -> B. Step 2, naturality formula: for any arrow h: A -> X, naturality of theta at h applied to 1_A gives theta_X(h) = theta_X(h o 1_A) = h o theta_A(1_A) = h o g; the same argument for theta^{-1} gives theta^{-1}_X(k) = k o f for any k: B -> X. Step 3, evaluate at the two identities: with X = B and h = f, the formula gives theta_B(f) = f o g, while f = theta^{-1}_B(1_B) gives theta_B(f) = 1_B, so f o g = 1_B; with X = A and k = g, the inverse formula gives theta^{-1}_A(g) = g o f, while g = theta_A(1_A) gives theta^{-1}_A(g) = 1_A, so g o f = 1_A. Conclusion: f and g are mutually inverse isomorphisms, so A is isomorphic to B, and a representing object is unique up to isomorphism."
    diagnostic_exemplar:
      problem: "Prove that the forgetful functor $U\\colon\\mathbf{Ab}\\to\\mathbf{Set}$ is representable, naming the representing object and the natural isomorphism, and prove that any two representing objects for $U$ are isomorphic."
      answer: "Representability: $\\mathbb Z$ is the free abelian group on one generator, so a homomorphism $\\varphi\\colon\\mathbb Z\\to A$ is determined by $\\varphi(1)$, which may be any element of $A$. Hence $\\theta_A\\colon\\mathrm{Hom}_{\\mathbf{Ab}}(\\mathbb Z,A)\\to UA$, $\\varphi\\mapsto\\varphi(1)$, is a bijection, and it is natural in $A$: for $f\\colon A\\to B$, $\\theta_B(f\\circ\\varphi)=f(\\varphi(1))=Uf(\\theta_A(\\varphi))$. So $U\\cong\\mathrm{Hom}_{\\mathbf{Ab}}(\\mathbb Z,-)$ with representing object $\\mathbb Z$. Uniqueness: suppose $\\mathrm{Hom}(A,-)\\cong U\\cong\\mathrm{Hom}(B,-)$, so there is a natural isomorphism $\\psi\\colon\\mathrm{Hom}(A,-)\\Rightarrow\\mathrm{Hom}(B,-)$. Put $g=\\psi_A(1_A)\\colon B\\to A$ and $f=\\psi_B^{-1}(1_B)\\colon A\\to B$. Naturality of $\\psi$ at $h\\colon A\\to X$ applied to $1_A$ gives $\\psi_X(h)=h\\circ g$, and likewise $\\psi^{-1}_X(k)=k\\circ f$. Taking $X=B$, $h=f$: $f\\circ g=\\psi_B(f)=\\psi_B(\\psi_B^{-1}(1_B))=1_B$; taking $X=A$, $k=g$: $g\\circ f=\\psi^{-1}_A(g)=\\psi^{-1}_A(\\psi_A(1_A))=1_A$. So $A\\cong B$: the representing object is unique up to isomorphism."
      solution_sketch: "For representability use that $\\mathbb Z$ is free on one generator, so $\\varphi\\mapsto\\varphi(1)$ is a bijection and naturality says evaluation at $1$ commutes with post-composition. For uniqueness, feed the identities through the natural isomorphism: $\\psi_A(1_A)$ and $\\psi_B^{-1}(1_B)$ are the mutually inverse maps."
    anki_seeds:
      - front: "A representable functor is..."
        back: "a functor naturally isomorphic to some hom-functor $\\mathrm{Hom}(A,-)$ (covariant) or $\\mathrm{Hom}(-,A)$ (contravariant)."
        type: basic
      - front: "Representing objects are unique up to {{c1::isomorphism}}."
        back: "isomorphism"
        type: cloze

  - id: universal-elements
    name: Universal Elements
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: representable-functors
        weight: 0.5
        key: true
      - id: universal-properties
        weight: 0.4
        key: true
      - id: natural-transformations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Universal elements and representations
        key_prerequisites: [representable-functors]
        constraints: "State the pair $(A,u)$ with $u\\in FA$ and its exists-unique clause before anything else; concrete instances are forgetful functors (or small products of them) out of $\\mathbf{Vect}_k$, $\\mathbf{Mon}$ or $\\mathbf{Grp}$, whose universal element is a generator of a free object on at most two generators."
        exemplars:
          - problem: "Define a universal element of $F\\colon\\mathcal C\\to\\mathbf{Set}$ and relate it to a representation."
            answer: "$(A,u)$ with $u\\in FA$ so that every $x\\in FX$ equals $Fh(u)$ for a unique $h\\colon A\\to X$; equivalent to $F\\cong\\mathrm{Hom}(A,-)$."
            solution_sketch: "A universal element of $F$ is an object $A$ and $u\\in FA$ such that for every $X$ and $x\\in FX$ there is a unique $h\\colon A\\to X$ with $(Fh)(u)=x$. Given a representation $\\alpha\\colon\\mathrm{Hom}(A,-)\\cong F$, the element $u=\\alpha_A(1_A)$ is universal; conversely a universal element defines a representation by $h\\mapsto (Fh)(u)$. So 'representable' equals 'has a universal element'."
          - problem: "Identify the universal element of the forgetful functor $U\\colon\\mathbf{Vect}_k\\to\\mathbf{Set}$."
            answer: "$(k,1)$: the scalar $1\\in Uk$ is universal, giving $U\\cong\\mathrm{Hom}_{\\mathbf{Vect}_k}(k,-)$."
            solution_sketch: "Take $A=k$, the ground field as a one-dimensional space, and $u=1\\in Uk$. For any vector space $V$ and any $v\\in UV$ there is a unique linear map $h\\colon k\\to V$ with $Uh(1)=h(1)=v$, namely $h(\\lambda)=\\lambda v$. Thus $(k,1)$ is a universal element, so $U$ is representable with $U\\cong\\mathrm{Hom}_{\\mathbf{Vect}_k}(k,-)$."
      - id: kp2
        name: Universal properties are universal elements
        key_prerequisites: [universal-properties]
        constraints: "Products and coproducts only: name the functor $F$ of candidate structures, then give the universal element as the tuple of projections or of injections, and match the exists-unique clause against the (co)product's universal property."
        exemplars:
          - problem: "In the category of sets, fix two sets A and B: A has the elements 1 and 2, and B has the elements 3 and 4. Let F(X) = Hom(X,A) x Hom(X,B), the set of pairs of maps with domain X. The pair of projections (p1, p2) of the product A x B is the universal element of F. Take X to be the set with the single element 7, and let f: X -> A and g: X -> B be given by f(7) = 2 and g(7) = 4. The exists-unique clause gives exactly one map h: X -> A x B with F(h)(p1, p2) = (f, g). Find h(7) as (a, b)."
            answer: "(2, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (name the functor and its action): F(X) = Hom(X,A) x Hom(X,B) reverses arrows, so for h: X -> A x B the map F(h): F(A x B) -> F(X) sends the pair of projections to (p1 after h, p2 after h). Step 2 (match the exists-unique clause): the element (f, g) of F(X) is matched by a unique h with p1 after h = f and p2 after h = g, so h sends each point to the pair of its images. Step 3 (evaluate): h(7) = (f(7), g(7)) = (2, 4). The answer is (2, 4)."
          - problem: "In the category of sets, fix two sets A and B: A has the single element 5, and B has the elements 6 and 7. Let F(X) = Hom(A,X) x Hom(B,X), the set of pairs of maps with target X. The coproduct A + B is the disjoint union of A and B, with injections i1: A -> A + B and i2: B -> A + B, and the pair (i1, i2) is the universal element of F. Take X to be the set with elements 0 and 8, and let f: A -> X and g: B -> X be given by f(5) = 0, g(6) = 8 and g(7) = 0. The exists-unique clause gives exactly one map h: A + B -> X with F(h)(i1, i2) = (f, g). Find h(i2(6))."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (name the functor and its action): F(X) = Hom(A,X) x Hom(B,X) is covariant, so for h: A + B -> X the map F(h): F(A + B) -> F(X) sends the pair of injections to (h after i1, h after i2). Step 2 (match the exists-unique clause): the element (f, g) of F(X) is matched by a unique h with h after i1 = f and h after i2 = g. Step 3 (evaluate): h(i2(6)) = g(6) = 8. The answer is 8."
          - problem: "View the divisors of 42 as a category: there is exactly one arrow from d to e when d divides e, and no arrow otherwise. Let F(X) = Hom(X,6) x Hom(X,14), so an element of F(X) is a pair of arrows and F(X) is nonempty exactly when X divides both 6 and 14. The universal element of F is the pair of projections lying in F(d), where the projections are the arrows from d to 6 and from d to 14. The exists-unique clause forces every X with nonempty F(X) to have exactly one arrow to d. Find d."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (name the functor): F(X) = Hom(X,6) x Hom(X,14) is nonempty exactly for the common divisors of 6 and 14, which are 1 and 2. Step 2 (locate the universal element): the pair of projections lies in F(d), so d divides both 6 and 14; the exists-unique clause says every common divisor X has an arrow to d, that is, every common divisor divides d. Step 3 (conclude): among 1 and 2, the one divisible by both is 2, the greatest common divisor. The answer is 2."
          - problem: "View the divisors of 36 as a category: there is exactly one arrow from d to e when d divides e, and no arrow otherwise. Let F(X) = Hom(4,X) x Hom(6,X), so an element of F(X) is a pair of arrows and F(X) is nonempty exactly when X is a multiple of both 4 and 6. The universal element of F is the pair of injections lying in F(c), where the injections are the arrows from 4 to c and from 6 to c. The exists-unique clause forces every X with nonempty F(X) to have exactly one arrow from c. Find c."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (name the functor): F(X) = Hom(4,X) x Hom(6,X) is nonempty exactly for the common multiples of 4 and 6 among the divisors of 36, which are 12 and 36. Step 2 (locate the universal element): the pair of injections lies in F(c), so 4 and 6 both divide c; the exists-unique clause says c has an arrow to every common multiple, that is, c divides every common multiple. Step 3 (conclude): among 12 and 36, the one that divides both is 12, the least common multiple. The answer is 12."
          - problem: "A student verifies that the pair of projections (p1, p2) of A x B is a universal element of F(X) = Hom(X,A) x Hom(X,B) in the category of sets. Step 1: a map k: X -> Y acts from F(Y) to F(X) by F(k)(f, g) = (f after k, g after k). Step 2: for a pair (f, g) in F(X), define h: X -> A x B by h(x) = (f(x), g(x)). Step 3: then F(h)(p1, p2) = (h after p1, h after p2). Step 4: direct computation gives p1 after h = f and p2 after h = g. Step 5: hence F(h)(p1, p2) = (f, g) and h is unique with this property, so (p1, p2) is universal. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: F reverses arrows, and F(k) precomposes each map with k, which is exactly the pair (f after k, g after k); choosing Step 1 mistakes this correct contravariant action for an error. Step 2 is valid: it defines the pairing map h. Step 3 is the first invalid step: F(h) must send the pair (p1, p2) to (p1 after h, p2 after h), since F acts by precomposition, but the written pair (h after p1, h after p2) reverses the composition order and is not well typed. Step 4 is a valid direct computation. Step 5 is a valid conclusion once Step 3 is repaired. The answer is Step 3."
          - problem: "In the category of sets, let F(X) = Hom(A,X) x Hom(B,X). The coproduct A + B has injections i1: A -> A + B and i2: B -> A + B, and the pair (i1, i2) is the universal element of F. To match the exists-unique clause for a pair (f, g) in F(X), with f: A -> X and g: B -> X, the check applies the functor to a map h: A + B -> X and to the universal element. The line F(h)(i1, i2) = ? is missing. Select the true line."
            answer: "h after i1, h after i2"
            answer_contract: {"kind": "label", "options": [["h after i1, h after i2"], ["i1 after h, i2 after h"], ["h after f, h after g"], ["f after i1, g after i2"]]}
            solution_sketch: "Step 1 (functor action): F(X) = Hom(A,X) x Hom(B,X) is covariant, so the map h: A + B -> X acts by postcomposition, sending the pair (i1, i2) to (h after i1, h after i2). Step 2 (test each option): the option 'i1 after h, i2 after h' is the error of reversing the composition order, which is the action of a contravariant functor. The option 'h after f, h after g' is the error of postcomposing with the arbitrary pair instead of with the injections, and it is not well typed. The option 'f after i1, g after i2' is the error of composing the given pair with the injections in a direction that is not well typed. The answer is h after i1, h after i2."
          - problem: "Write the full proof: in the category of sets, the pair of projections of A x B is a universal element of the functor F(X) = Hom(X,A) x Hom(X,B). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the functor): for each set X let F(X) = Hom(X,A) x Hom(X,B), the set of pairs of maps with domain X; for a map k: X -> Y let F(k): F(Y) -> F(X) send a pair (f, g) to (f after k, g after k). Precomposition respects composition in the reversed order, so F is a functor on the category of sets with arrows reversed. Step 2 (the element): the projections p1: A x B -> A and p2: A x B -> B form the pair (p1, p2), an element of F(A x B). Step 3 (existence): take any set X and any element (f, g) of F(X), so f: X -> A and g: X -> B; define h: X -> A x B by h(x) = (f(x), g(x)). Then p1 after h = f and p2 after h = g, so F(h)(p1, p2) = (p1 after h, p2 after h) = (f, g). Step 4 (uniqueness): if h': X -> A x B also satisfies F(h')(p1, p2) = (f, g), then p1 after h' = f and p2 after h' = g, so for each x in X we get h'(x) = (f(x), g(x)) = h(x), whence h' = h. Step 5 (conclusion): the pair (p1, p2) in F(A x B) meets the exists-unique condition for every X, so it is a universal element of F, and F is represented by A x B. The answer is See the solution."
    diagnostic_exemplar:
      problem: "Let $F\\colon\\mathbf{Mon}\\to\\mathbf{Set}$ send a monoid $M$ to the set $UM\\times UM$ of ordered pairs of its elements, and a homomorphism $h$ to $(m,m')\\mapsto(h(m),h(m'))$. Exhibit a universal element of $F$ and verify the universal-element condition in full."
      answer: "Take $A=\\{a,b\\}^*$, the free monoid on two letters, and $u=(a,b)\\in FA$. Given any monoid $M$ and any $(m,m')\\in FM=UM\\times UM$, freeness says there is exactly one homomorphism $h\\colon\\{a,b\\}^*\\to M$ with $h(a)=m$ and $h(b)=m'$ (existence: extend letterwise and multiply out, $h(x_1\\cdots x_n)=h(x_1)\\cdots h(x_n)$, $h(\\varepsilon)=e$; uniqueness: a homomorphism is determined on words by its values on letters). For that $h$, $(Fh)(u)=(h(a),h(b))=(m,m')$, and any $h'$ with $(Fh')(u)=(m,m')$ has $h'(a)=m$, $h'(b)=m'$, hence $h'=h$. So every element of $FM$ is $(Fh)(u)$ for a unique $h\\colon A\\to M$: $(\\{a,b\\}^*,(a,b))$ is a universal element, and equivalently $F\\cong\\mathrm{Hom}_{\\mathbf{Mon}}(\\{a,b\\}^*,-)$."
      solution_sketch: "Guess the free object: $F$ asks for two elements, so take the free monoid on two letters with $u=(a,b)$. The universal-element condition is then the freeness property itself — exactly one homomorphism sends the two letters to any prescribed pair — so verify existence and uniqueness of that extension."
    anki_seeds:
      - front: "A universal element of $F\\colon\\mathcal C\\to\\mathbf{Set}$ is..."
        back: "$(A,u)$, $u\\in FA$, such that every $x\\in FX$ equals $Fh(u)$ for a unique $h\\colon A\\to X$."
        type: basic
      - front: "Recognition trigger: a universal property is a {{c1::universal element}} of an associated $\\mathbf{Set}$-valued functor."
        back: "universal element"
        type: cloze

  - id: yoneda-statement-mechanics
    name: The Yoneda Lemma — Statement and Computations
    core: true
    difficulty: 0.8
    drill: false
