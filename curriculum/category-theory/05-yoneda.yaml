      - id: kp1
        name: Universal elements and representations
        key_prerequisites: [representable-functors]
        constraints: "Test and construct universal elements through existence and uniqueness of arrows transporting the distinguished element. Use free algebra generators or bases; defective generators must fail a specific clause."
        exemplars:
          - problem: "For covariant F:C->Set, a candidate universal element is u in F(A). Construct the arrow type and equation that must have exactly one solution for every x in F(X). Arrow bank: 1=h:A->X; 2=h:X->A. Equation bank: 1=F(h)(x)=u; 2=F(h)(u)=x. Give the two numbers."
            answer: "1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The covariant functor transports the distinguished element forward along a map from A to X. Existence and uniqueness of that map are the universal condition. The result is 1, 2."
          - problem: "For U:Vect_R->Set, test candidate universal elements (1) (R,2), (2) (R,0), (3) (R^2,(1,0)). For each candidate require a unique linear map to every V taking the distinguished vector to any chosen v. Give the set of candidate numbers satisfying this condition."
            answer: "{1}"
            answer_contract: {"kind": "set"}
