    knowledge_points:
      - id: kp1
        name: Universal elements and representations
        key_prerequisites: [representable-functors]
        constraints: "Test and construct universal elements through existence and uniqueness of arrows transporting the distinguished element. Use free algebra generators or bases; defective generators must fail a specific clause."
        try_first:
          problem: 'How many monoid homomorphisms $h\colon(\mathbb{N},+)\to(\mathbb{Z}/5,+)$ satisfy $h(1)=3$?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'Such a homomorphism must send $n$ to $3n$, and this formula does work. Exactly one homomorphism exists for each chosen value of $h(1)$, which is the universal element condition for $(\mathbb{N},1)$.'
        step_check:
          step: 'This is a monoid homomorphism since $h(n+k)=m^{n+k}=m^{n}\cdot m^{k}=h(n)\cdot h(k)$'
          question: 'Why does the equation $h(n+k)=h(n)\cdot h(k)$ show that $h$ preserves the operation?'
          options:
            - 'It shows that $h$ is injective, which is what a monoid homomorphism has to be'
            - 'It shows that $h(1)=m$, which is the condition that makes the element universal'
            - 'It holds for every function between sets, so it needs no property of $M$'
            - 'It sends the sum $n+k$ to the product of the images, as a homomorphism must'
          answer: 'It sends the sum $n+k$ to the product of the images, as a homomorphism must'
          why: 'A homomorphism sends the operation of $\mathbb N$ to the operation of $M$, and $h(n+k)=h(n)\cdot h(k)$ says exactly that.'
        exemplars:
          - problem: 'The additive monoid $\mathbb{N}$ with the element $1$ is a universal element of the forgetful functor $U\colon\mathbf{Mon}\to\mathbf{Set}$. Let $M$ be the monoid $\mathbb{Z}/6$ under addition. By universality there is exactly one monoid homomorphism $h\colon\mathbb{N}\to M$ with $h(1)=4$. What is $h(5)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A monoid homomorphism out of $(\mathbb{N},+)$ is fixed by $h(1)$, and $h(n)$ is the sum of $n$ copies of $h(1)$. So $h(5)=5\cdot 4=20$. In $\mathbb{Z}/6$ the number 20 equals 2.'
          - problem: 'Consider the forgetful functor $U\colon\mathbf{Vect}_{\mathbb{R}}\to\mathbf{Set}$, the one-dimensional space $\mathbb{R}$ and its element $2$. Is $(\mathbb{R},2)$ a universal element of $U$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "true"], ["no", "no it is not", "it is not", "not", "false"]]}
            solution_sketch: 'A universal element needs, for every vector space $V$ and every $v$ in $V$, exactly one linear map $h\colon\mathbb{R}\to V$ with $h(2)=v$. Such a map must send $x$ to $\tfrac{x}{2}v$, and this formula is linear. So the map exists and is unique, and $(\mathbb{R},2)$ is universal.'
          - problem: 'The pair $(\mathbb{R},0)$ is tested as a universal element of $U\colon\mathbf{Vect}_{\mathbb{R}}\to\mathbf{Set}$. For the target $\mathbb{R}^2$ and the vector $v=(1,1)$, how many linear maps $h\colon\mathbb{R}\to\mathbb{R}^2$ satisfy $h(0)=v$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every linear map sends $0$ to $0$, so $h(0)=(1,1)$ cannot hold. There are 0 such maps. The existence clause of universality fails for $v=(1,1)$, so $(\mathbb{R},0)$ is not a universal element.'
          - problem: 'Let $\mathbb{F}_2=\{0,1\}$ be the field with two elements and let $U\colon\mathbf{Vect}_{\mathbb{F}_2}\to\mathbf{Set}$ be the forgetful functor. The pair $(\mathbb{F}_2^3,(1,0,0))$ is tested as a universal element. How many linear maps $h\colon\mathbb{F}_2^3\to\mathbb{F}_2$ satisfy $h(1,0,0)=1$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A linear map $\mathbb{F}_2^3\to\mathbb{F}_2$ is fixed by the values $h(1,0,0)$, $h(0,1,0)$ and $h(0,0,1)$. The first value is 1, and each of the other two is 0 or 1 freely. So there are $2\cdot 2=4$ such maps. Uniqueness fails, so the pair is not universal.'
          - problem: 'Let $F\colon\mathbf{Grp}\to\mathbf{Set}$ send a group $G$ to $G\times G$. The free group $F_2$ on two generators $a$ and $b$, with the element $(a,b)$ of $F(F_2)$, is a universal element of $F$. How many group homomorphisms $h\colon F_2\to\mathbb{Z}/5$ satisfy $(h(a),h(b))=(2,3)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Universality says that every pair in $F(\mathbb{Z}/5)$ is hit by exactly one homomorphism. A homomorphism out of a free group is fixed by the images of the generators, and any images are allowed. So there is exactly 1 homomorphism with $h(a)=2$ and $h(b)=3$.'
          - problem: 'The pair $(\mathbb{N},2)$ is tested as a universal element of the forgetful functor $U\colon\mathbf{Mon}\to\mathbf{Set}$, where $\mathbb{N}$ is the additive monoid. For the monoid $M=\mathbb{Z}/10$ under addition and the element $6$, how many monoid homomorphisms $h\colon\mathbb{N}\to M$ satisfy $h(2)=6$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A monoid homomorphism $h\colon\mathbb{N}\to M$ is fixed by $a=h(1)$, with $h(2)=2a$. We need $2a=6$ in $\mathbb{Z}/10$, and the solutions are $a=3$ and $a=8$. So there are 2 homomorphisms, uniqueness fails, and $(\mathbb{N},2)$ is not universal.'
          - problem: 'Is the pair $(\mathbb{R}^2,(1,0))$ a universal element of the forgetful functor $U\colon\mathbf{Vect}_{\mathbb{R}}\to\mathbf{Set}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes it is", "it is", "true", "it is universal", "universal"], ["no", "no it is not", "it is not", "not", "false", "not universal", "it is not universal"]]}
            solution_sketch: 'Take the target $V=\mathbb{R}$ and the vector $v=1$. A linear map $h\colon\mathbb{R}^2\to\mathbb{R}$ with $h(1,0)=1$ is $h(x,y)=x+cy$ for any number $c$, so there are infinitely many such maps. Uniqueness fails, so the pair is not a universal element.'
          - problem: 'Write the full proof that the pair $((\mathbb{N},+,0),1)$ is a universal element of the forgetful functor $U\colon\mathbf{Mon}\to\mathbf{Set}$, and that therefore $U$ is representable.'
            answer: '(N, 1) is a universal element of U'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $M$ be a monoid and $m\in UM$. Define $h(n)$ as the $n$-fold sum of $m$ with itself, so $h(0)=0$ and $h(n+n'')=h(n)+h(n'')$; then $h$ is a homomorphism with $h(1)=m$, which proves existence. If $g$ is a homomorphism with $g(1)=m$, then $g(n)$ is the $n$-fold sum of $g(1)$, so $g=h$, which proves uniqueness. Hence the assignment $h\mapsto h(1)$ is a bijection $\mathrm{Hom}(\mathbb{N},M)\cong UM$, natural in $M$, and $U\cong\mathrm{Hom}(\mathbb{N},-)$.'
      - id: kp2
        name: Universal properties are universal elements
        key_prerequisites: [universal-properties]
        constraints: "Recover the representing object and universal tuple of projections/injections for the candidate-structure functor. Match its variance and exists-unique equation to the product or coproduct universal property."
        step_check:
          step: 'so the requirement is $\pi_i h=f_i$ for $i=1,2,3$'
          question: 'Why does $F(h)(\pi_1,\pi_2,\pi_3)=(f_1,f_2,f_3)$ become $\pi_i h=f_i$ for each $i$?'
          options:
            - 'Because the projections $\pi_i$ are inverse to $h$, so $\pi_i h$ cancels to the identity'
            - 'Because $F(h)$ composes every component with $h$, and triples are equal componentwise'
            - 'Because $F$ is covariant, so $h$ acts after each $\pi_i$ and the maps $f_i$ stay unchanged'
            - 'Because $h$ must be a bijection, and a bijection is determined by its three components'
          answer: 'Because $F(h)$ composes every component with $h$, and triples are equal componentwise'
          why: 'The action of $F(h)$ is $(\pi_1 h,\pi_2 h,\pi_3 h)$, and an equality of triples is an equality in each coordinate.'
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $A=\{1,2\}$ and $B=\{3,4\}$, and let $F(X)=\mathrm{Hom}(X,A)\times\mathrm{Hom}(X,B)$. The functor $F$ has a universal element $u$ at an object $P$. Take $X=\{7\}$ with $f\colon X\to A$, $f(7)=2$, and $g\colon X\to B$, $g(7)=4$. Then $(f,g)$ is an element of $F(X)$, so there is a unique $h\colon X\to P$ with $F(h)(u)=(f,g)$. What is $h(7)$?'
            answer: '(2, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The functor sends $X$ to pairs of maps out of $X$, so the universal element is the pair of projections of $P=A\times B$. The condition $F(h)(u)=(f,g)$ says $p_1\circ h=f$ and $p_2\circ h=g$. So $h(7)=(f(7),g(7))=(2,4)$.'
          - problem: 'In $\mathbf{Set}$ let $A=\{5\}$ and $B=\{6,7\}$, and let $F(X)=\mathrm{Hom}(A,X)\times\mathrm{Hom}(B,X)$. The functor $F$ has a universal element $u=(i_A,i_B)$ at an object $C$. Take $X=\{0,8\}$ with $f\colon A\to X$, $f(5)=0$, and $g\colon B\to X$, $g(6)=8$, $g(7)=0$. There is a unique $h\colon C\to X$ with $F(h)(u)=(f,g)$. What is $h(i_B(6))$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The functor sends $X$ to pairs of maps into $X$, so $C$ is the disjoint union $A+B$ with the injections $i_A$ and $i_B$. The condition $F(h)(u)=(f,g)$ says $h\circ i_A=f$ and $h\circ i_B=g$. Hence $h(i_B(6))=g(6)=8$.'
          - problem: 'Let $\mathcal D$ be the positive divisors of $42$, namely $1,2,3,6,7,14,21,42$, viewed as a category with one morphism $a\to b$ when $a$ divides $b$. The functor $F(X)=\mathrm{Hom}(X,6)\times\mathrm{Hom}(X,14)$ from $\mathcal D^{op}$ to $\mathbf{Set}$ is represented by an object $d$. Which divisor of $42$ is $d$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element of $F(X)$ exists exactly when $X$ divides both 6 and 14, so $d$ must divide both. Universality says that every common divisor $X$ has a morphism to $d$, that is, $X$ divides $d$. The common divisors of 6 and 14 are 1 and 2, and 2 is the one divisible by both, so $d=2$.'
          - problem: 'Let $\mathcal D$ be the positive divisors of $36$, namely $1,2,3,4,6,9,12,18,36$, viewed as a category with one morphism $a\to b$ when $a$ divides $b$. The functor $F(X)=\mathrm{Hom}(4,X)\times\mathrm{Hom}(6,X)$ from $\mathcal D$ to $\mathbf{Set}$ is represented by an object $c$. Which divisor of $36$ is $c$?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An element of $F(X)$ exists exactly when 4 and 6 both divide $X$, so the candidates are the common multiples 12 and 36. Universality says that $c$ has a morphism to every such $X$, that is, $c$ divides every common multiple. Of 12 and 36, the number 12 divides both, so $c=12$.'
          - problem: 'In $\mathbf{Set}$ let $A$ have $3$ elements and $B$ have $5$ elements, and let $F(X)=\mathrm{Hom}(X,A)\times\mathrm{Hom}(X,B)$. The functor $F$ is represented by a set $P$. How many elements does $P$ have?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The functor takes $X$ to pairs of maps out of $X$, so it is represented by the product $A\times B$ with its two projections. The product has one element for each pair $(a,b)$. So $P$ has $3\cdot 5=15$ elements.'
          - problem: 'Sam says that the functor $F(X)=\mathrm{Hom}(A,X)\times\mathrm{Hom}(B,X)$ on $\mathbf{Set}$, with $A=\{1,2\}$ and $B=\{3,4,5\}$, is represented by the product $A\times B$, so by a set with $6$ elements. How many elements does the representing set have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $F(X)$ is a pair of maps into $X$, so the universal element consists of two injections, and the representing set is the disjoint union $A+B$. The disjoint union has $2+3=5$ elements, not $2\cdot 3=6$. So the representing set has 5 elements.'
          - problem: 'Write the full proof that in the category of sets the pair of projections of $A\times B$ is a universal element of the functor $F(X)=\mathrm{Hom}(X,A)\times\mathrm{Hom}(X,B)$.'
            answer: 'Projections are a universal element'
            answer_contract: {"kind": "none"}
            solution_sketch: 'For $k\colon X\to Y$ let $F(k)$ send $(f,g)$ to $(f\circ k,g\circ k)$, so $F$ reverses arrows. The projections $p_1,p_2$ form an element $(p_1,p_2)$ of $F(A\times B)$. Given $(f,g)$ in $F(X)$, define $h(x)=(f(x),g(x))$; then $p_1\circ h=f$ and $p_2\circ h=g$, so $F(h)(p_1,p_2)=(f,g)$, which proves existence. If $h''$ also satisfies $p_1\circ h''=f$ and $p_2\circ h''=g$, then $h''(x)=(f(x),g(x))=h(x)$ for each $x$, which proves uniqueness. Hence $(p_1,p_2)$ is a universal element and $F$ is represented by $A\times B$.'
    diagnostic_exemplar:
      problem: "Let $F\\colon\\mathbf{Mon}\\to\\mathbf{Set}$ send a monoid $M$ to the set $UM\\times UM$ of ordered pairs of its elements, and a homomorphism $h$ to $(m,m')\\mapsto(h(m),h(m'))$. Exhibit a universal element of $F$ and verify the universal-element condition in full."
      answer: "Take $A=\\{a,b\\}^*$, the free monoid on two letters, and $u=(a,b)\\in FA$. Given any monoid $M$ and any $(m,m')\\in FM=UM\\times UM$, freeness says there is exactly one homomorphism $h\\colon\\{a,b\\}^*\\to M$ with $h(a)=m$ and $h(b)=m'$ (existence: extend letterwise and multiply out, $h(x_1\\cdots x_n)=h(x_1)\\cdots h(x_n)$, $h(\\varepsilon)=e$; uniqueness: a homomorphism is determined on words by its values on letters). For that $h$, $(Fh)(u)=(h(a),h(b))=(m,m')$, and any $h'$ with $(Fh')(u)=(m,m')$ has $h'(a)=m$, $h'(b)=m'$, hence $h'=h$. So every element of $FM$ is $(Fh)(u)$ for a unique $h\\colon A\\to M$: $(\\{a,b\\}^*,(a,b))$ is a universal element, and equivalently $F\\cong\\mathrm{Hom}_{\\mathbf{Mon}}(\\{a,b\\}^*,-)$."
      solution_sketch: "Guess the free object: $F$ asks for two elements, so take the free monoid on two letters with $u=(a,b)$. The universal-element condition is then the freeness property itself — exactly one homomorphism sends the two letters to any prescribed pair — so verify existence and uniqueness of that extension."
    anki_seeds:
      - front: "A universal element of $F\\colon\\mathcal C\\to\\mathbf{Set}$ is..."
        back: "$(A,u)$, $u\\in FA$, such that every $x\\in FX$ equals $Fh(u)$ for a unique $h\\colon A\\to X$."
        type: basic
      - front: "Recognition trigger: a universal property is a {{c1::universal element}} of an associated $\\mathbf{Set}$-valued functor."
        back: "universal element"
        type: cloze

  - id: yoneda-statement-mechanics
    name: The Yoneda Lemma — Statement and Computations
    core: true
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: representable-functors
        weight: 0.5
        key: true
      - id: universal-elements
        weight: 0.4
        key: true
      - id: hom-functors
        weight: 0.3
      - id: functor-categories
        weight: 0.3
      - id: natural-transformations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The statement in both variances
        key_prerequisites: [representable-functors]
        constraints: "Recover Yoneda components in both variances from identity evaluation and naturality. Never supply the reconstruction formula before asking to use it; keep all arrow directions explicit."
        step_check:
          step: 'Here $Fh=\mathrm{Hom}(B,h)$ sends $u\colon B\to A$ to $h\circ u\colon B\to X$'
          question: 'Why does $Fh$ send $u\colon B\to A$ to $h\circ u$ and not to $u\circ h$?'
          options:
            - 'Because composition of morphisms is commutative, so either order gives the same morphism'
            - 'Because $u$ has to be applied last, as the outermost map in a composite of two maps'
            - 'Because only $h\circ u$ is defined when $u\colon B\to A$ and $h\colon A\to X$'
            - 'Because the source of $h$ is $B$, so $h$ can only be applied to morphisms that start at $B$'
          answer: 'Because only $h\circ u$ is defined when $u\colon B\to A$ and $h\colon A\to X$'
          why: 'The functor $\mathrm{Hom}(B,-)$ acts by post-composition, and $h\circ u$ is the only composite with $u\colon B\to A$ and $h\colon A\to X$.'
        exemplars:
          - problem: 'Let $\mathcal C$ be the category with two objects $0$ and $1$, their identities and one other morphism $f\colon 0\to 1$. Let $F\colon\mathcal C\to\mathbf{Set}$ be the functor with $F(0)=\{1,2\}$, $F(1)=\{3,4\}$, and $F(f)$ sending $1$ to $3$ and $2$ to $4$. The Yoneda lemma matches the element $u=1$ of $F(0)$ with a natural transformation $\alpha\colon\mathrm{Hom}(0,-)\Rightarrow F$. What is $\alpha_1(f)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The natural transformation matched with $u$ has $\alpha_0(1_0)=u$. Naturality along $f$ applied to $1_0$ gives $\alpha_1(f)=F(f)(u)$. Since $F(f)$ sends 1 to 3, we get $\alpha_1(f)=3$.'
          - problem: 'Let $\mathcal C$ be the category with two objects $0$ and $1$, their identities and one other morphism $f\colon 0\to 1$. Let $G\colon\mathcal C^{op}\to\mathbf{Set}$ be the presheaf with $G(1)=\{1,2,3\}$, $G(0)=\{4,5\}$, and $G(f)\colon G(1)\to G(0)$ sending $1$ to $4$, $2$ to $5$ and $3$ to $4$. The Yoneda lemma matches the element $u=2$ of $G(1)$ with a natural transformation $\beta\colon\mathrm{Hom}(-,1)\Rightarrow G$. What is $\beta_0(f)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transformation matched with $u$ has $\beta_1(1_1)=u$. Naturality along $f$ gives $\beta_0(f)=G(f)(u)$, where $G(f)$ runs from $G(1)$ to $G(0)$. Since $G(f)$ sends 2 to 5, we get $\beta_0(f)=5$.'
          - problem: 'Let $\mathcal C$ be the category with objects $P$, $Q$, $R$, their identities and two other morphisms $p\colon P\to Q$ and $r\colon P\to R$. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(P)=\{1,2,3\}$, $F(Q)=\{1,2\}$, $F(R)=\{7,8\}$, with $F(p)$ sending $1,2,3$ to $2,1,1$ and $F(r)$ sending $1,2,3$ to $8,7,7$. The element $u=3$ of $F(P)$ corresponds to a natural transformation $\alpha\colon\mathrm{Hom}(P,-)\Rightarrow F$. What is $\alpha_R(r)$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality along $r$ applied to the identity of $P$ gives $\alpha_R(r)=F(r)(u)$. The map $F(r)$ sends 3 to 7. So $\alpha_R(r)=7$.'
          - problem: 'Let $\mathcal C$ be the category with two objects $0$ and $1$, their identities and one other morphism $f\colon 0\to 1$. Let $F\colon\mathcal C\to\mathbf{Set}$ be the functor with $F(0)=\{6,7,8\}$, $F(1)=\{9,10,11\}$, and $F(f)$ sending $6$ to $10$, $7$ to $9$ and $8$ to $11$. Let $\alpha\colon\mathrm{Hom}(0,-)\Rightarrow F$ be a natural transformation with $\alpha_1(f)=11$. What is $\alpha_0(1_0)$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality along $f$ gives $\alpha_1(f)=F(f)(\alpha_0(1_0))$. So $F(f)(\alpha_0(1_0))=11$. Only 8 is sent to 11 by $F(f)$, so $\alpha_0(1_0)=8$.'
          - problem: 'Let $A=\{1,2\}$ and $B=\{3\}$ be sets. Natural transformations $\alpha\colon\mathrm{Hom}(A,-)\Rightarrow\mathrm{Hom}(B,-)$ correspond to functions $u\colon B\to A$. Let $\alpha$ correspond to the function $u$ with $u(3)=1$, and let $h\colon A\to\{8,9\}$ be given by $h(1)=9$ and $h(2)=8$. Then $\alpha_{\{8,9\}}(h)$ is a function $B\to\{8,9\}$. What is its value at $3$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transformation matched with $u$ has $\alpha_X(h)=F(h)(u)$ for $F=\mathrm{Hom}(B,-)$, and $F(h)$ composes with $h$. So $\alpha_X(h)=h\circ u$. Then $(h\circ u)(3)=h(u(3))=h(1)=9$.'
          - problem: 'Sam computes natural transformations out of $\mathrm{Hom}(A,-)$. Let $\mathcal C$ have objects $A$, $B$, their identities and one other morphism $f\colon A\to B$, and let $F\colon\mathcal C\to\mathbf{Set}$ have $F(A)=\{1,2\}$, $F(B)=\{2,3,6\}$, with $F(f)$ sending $1$ to $6$ and $2$ to $3$. For the transformation $\alpha\colon\mathrm{Hom}(A,-)\Rightarrow F$ matched with $u=1$, Sam says $\alpha_B(f)=1$ because $\alpha$ keeps the element $u$ fixed. What is the correct value of $\alpha_B(f)$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $\alpha_B(f)$ lies in $F(B)$, and the element 1 is not even in $F(B)$. Naturality along $f$ at $1_A$ gives $\alpha_B(f)=F(f)(u)$. Since $F(f)$ sends 1 to 6, the correct value is 6.'
          - problem: 'Let $\mathcal C$ be the category with two objects $0$ and $1$, their identities and one other morphism $f\colon 0\to 1$. Let $G\colon\mathcal C^{op}\to\mathbf{Set}$ be the presheaf with $G(1)=\{1,2,3\}$, $G(0)=\{4,5\}$, and $G(f)$ sending $1$ to $4$, $2$ to $5$ and $3$ to $4$. How many natural transformations $\beta\colon\mathrm{Hom}(-,1)\Rightarrow G$ satisfy $\beta_0(f)=4$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Natural transformations $\beta$ correspond to elements $u$ of $G(1)$, with $\beta_0(f)=G(f)(u)$. The map $G(f)$ sends both 1 and 3 to 4. So exactly 2 natural transformations have $\beta_0(f)=4$.'
          - problem: 'Write the full proof that for every functor $F\colon\mathcal C\to\mathbf{Set}$ and every object $A$ of $\mathcal C$, the map sending a natural transformation $\alpha\colon\mathrm{Hom}(A,-)\Rightarrow F$ to $\alpha_A(1_A)$ is a bijection from $\mathrm{Nat}(\mathrm{Hom}(A,-),F)$ onto $F(A)$, with inverse sending $u\in F(A)$ to the transformation whose component at $X$ sends $h$ to $(Fh)(u)$.'
            answer: 'Yoneda bijection for covariant functors'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The value $\alpha_A(1_A)$ lies in $F(A)$. For $h\colon A\to X$, the naturality square of $\alpha$ along $h$ evaluated at $1_A$ gives $\alpha_X(h)=(Fh)(\alpha_A(1_A))$, so $\alpha$ is determined by $\alpha_A(1_A)$ and the map is injective. Conversely, for $u\in F(A)$ define $\beta_X(h)=(Fh)(u)$; for $k\colon X\to Y$ we get $\beta_Y(k\circ h)=F(k)(F(h)(u))=F(k)(\beta_X(h))$, so $\beta$ is natural. Finally $\beta_A(1_A)=F(1_A)(u)=u$, so the two constructions are inverse and the map is a bijection.'
      - id: kp2
        name: Counting natural transformations out of a representable
        key_prerequisites: [hom-functors]
        constraints: "Count natural transformations by deriving the identity-evaluation parameter set and reconstruction, with no parameter set supplied in the stem. Distinguish covariant and contravariant representable directions."
        step_check:
          step: 'here $FA=\mathrm{Hom}(\{1,2,3,4\},\{1,2,3\})$'
          question: 'Why is the set counted $\mathrm{Hom}(\{1,2,3,4\},\{1,2,3\})$ and not $\mathrm{Hom}(\{1,2,3\},\{1,2,3,4\})$?'
          options:
            - 'The lemma counts $FA$ with $F=\mathrm{Hom}(\{1,2,3,4\},-)$ and $A=\{1,2,3\}$, so the maps end in $A$'
            - 'A natural transformation out of $\mathrm{Hom}(A,-)$ always goes against the direction of the maps in $F$'
            - 'The number of functions is the same in both directions, so the choice is only a convention'
            - 'The set $A$ is always the source of the functions in $FA$, whatever the functor $F$ is'
          answer: 'The lemma counts $FA$ with $F=\mathrm{Hom}(\{1,2,3,4\},-)$ and $A=\{1,2,3\}$, so the maps end in $A$'
          why: 'With $F=\mathrm{Hom}(B,-)$ we get $FA=\mathrm{Hom}(B,A)$, so the functions go from the set $B$ into the set $A$.'
        exemplars:
          - problem: 'In $\mathbf{Set}$, how many natural transformations are there from $\mathrm{Hom}(\{1,2,3,4\},-)$ to $\mathrm{Hom}(\{1,2\},-)$?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the Yoneda lemma, natural transformations $\mathrm{Hom}(A,-)\Rightarrow F$ correspond to elements of $F(A)$. Here $F=\mathrm{Hom}(\{1,2\},-)$ and $A=\{1,2,3,4\}$, so we count the functions $\{1,2\}\to\{1,2,3,4\}$. Each of the 2 inputs has 4 choices, so there are $4^2=16$.'
          - problem: 'Let $P\colon\mathbf{Set}\to\mathbf{Set}$ be the covariant powerset functor, which sends a function to its direct image. How many natural transformations are there from $\mathrm{Hom}(\{1,2\},-)$ to $P$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the Yoneda lemma the natural transformations correspond to the elements of $P(\{1,2\})$. These are the subsets of $\{1,2\}$, namely the empty set, $\{1\}$, $\{2\}$ and $\{1,2\}$. So there are $2^2=4$ natural transformations.'
          - problem: 'Let $F\colon\mathbf{Set}\to\mathbf{Set}$ be the functor $F(X)=X\times\{0,1\}$ with $F(h)(x,i)=(h(x),i)$. How many natural transformations are there from $\mathrm{Hom}(\{0,1,2\},-)$ to $F$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The natural transformations correspond to the elements of $F(\{0,1,2\})=\{0,1,2\}\times\{0,1\}$. This set has $3\cdot 2=6$ elements. So there are 6 natural transformations.'
          - problem: 'Let $\mathcal C$ be the chain $1\le 2\le 3$ viewed as a category. How many natural transformations are there from $\mathrm{Hom}(2,-)$ to $\mathrm{Hom}(3,-)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the Yoneda lemma the natural transformations correspond to the elements of $\mathrm{Hom}(3,2)$. A morphism $3\to 2$ exists only when $3\le 2$, which is false, so this set is empty. So there are 0 natural transformations.'
          - problem: 'In $\mathbf{Set}$ let $F(X)=X\times X$, with $F(h)(x,y)=(h(x),h(y))$. There are exactly $49$ natural transformations from $\mathrm{Hom}(A,-)$ to $F$. How many elements does $A$ have?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The natural transformations correspond to the elements of $F(A)=A\times A$. If $A$ has $n$ elements, then $A\times A$ has $n^2$ elements. Solving $n^2=49$ gives $n=7$, so $A$ has 7 elements.'
          - problem: 'Let $A=\{a,b,c\}$ and $B=\{a,b\}$. How many natural transformations are there from $\mathrm{Hom}(-,A)$ to $\mathrm{Hom}(-,B)$, as functors from $\mathbf{Set}^{op}$ to $\mathbf{Set}$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For presheaves the Yoneda lemma gives $\mathrm{Nat}(\mathrm{Hom}(-,A),G)\cong G(A)$. With $G=\mathrm{Hom}(-,B)$ this is $\mathrm{Hom}(A,B)$, the functions from $A$ to $B$. Each of the 3 elements of $A$ has 2 choices, so there are $2^3=8$.'
          - problem: 'Sam counts the natural transformations from $\mathrm{Hom}(A,-)$ to $\mathrm{Hom}(B,-)$ in $\mathbf{Set}$, where $A$ has $2$ elements and $B$ has $5$ elements. He says they correspond to the functions $A\to B$, so there are $5^2=25$. What is the correct number?'
            answer: '32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The Yoneda lemma matches the natural transformations $\mathrm{Hom}(A,-)\Rightarrow F$ with the elements of $F(A)$. For $F=\mathrm{Hom}(B,-)$ this is $\mathrm{Hom}(B,A)$, the functions from $B$ to $A$, not from $A$ to $B$. Each of the 5 elements of $B$ has 2 choices, so there are $2^5=32$.'
          - problem: 'Write the full proof that in the category of sets, for every set $A$ and every functor $F\colon\mathbf{Set}\to\mathbf{Set}$, the map sending a natural transformation $\alpha\colon\mathrm{Hom}(A,-)\Rightarrow F$ to $\alpha_A(1_A)$ is a bijection onto $F(A)$.'
            answer: 'Nat(Hom(A,-),F) corresponds to F(A)'
            answer_contract: {"kind": "none"}
            solution_sketch: 'For a set $X$ and a map $h\colon A\to X$ we have $h=\mathrm{Hom}(A,h)(1_A)$, so naturality of $\alpha$ at $h$ gives $\alpha_X(h)=F(h)(\alpha_A(1_A))$. If $\alpha_A(1_A)=\beta_A(1_A)=u$, then $\alpha_X(h)=F(h)(u)=\beta_X(h)$ for all $h$, so $\alpha=\beta$ and the map is injective. Given $u\in F(A)$, define $\alpha_X(h)=F(h)(u)$; for $f\colon X\to Y$ we get $F(f)(\alpha_X(h))=F(f\circ h)(u)=\alpha_Y(f\circ h)$, so $\alpha$ is natural and the map is surjective.'
      - id: kp3
        name: The one-object case — monoid and group actions
        key_prerequisites: [functor-categories]
        constraints: "Identify presheaves on a one-object category with right actions through precomposition. Recover equivariant maps from their identity value and distinguish regular-action transport from fixed-point conditions."
        step_check:
          step: 'Thus $\alpha$ is determined by $\alpha(0)$, and $\alpha(m)=\alpha(0)\cdot m$'
          question: 'Why is $\alpha(m)=\alpha(0)\cdot m$ for every $m$?'
          options:
            - 'Because $\alpha$ is a group homomorphism from $M$ to $X$, so it preserves sums'
            - 'Because every element of $X$ is fixed by every $m$, so the action does nothing at all'
            - 'Because $\alpha(0)$ is defined to be the identity element of the set $X$ in advance'
            - 'Because $m=0\cdot m$ in the regular action and $\alpha$ is equivariant'
          answer: 'Because $m=0\cdot m$ in the regular action and $\alpha$ is equivariant'
          why: 'In the regular action $m=0\cdot m$, and an equivariant map satisfies $\alpha(0\cdot m)=\alpha(0)\cdot m$.'
        exemplars:
          - problem: 'The group $\mathbb{Z}/2=\{e,t\}$ is regarded as a category with one object, with composition given by the group operation. Presheaves on it are the right $\mathbb{Z}/2$-sets, and the representable presheaf is $\mathbb{Z}/2$ acting on itself from the right. Let $X=\{1,2,3,4,5\}$ be the right $\mathbb{Z}/2$-set in which $t$ swaps $1$ and $2$ and fixes $3$, $4$ and $5$. How many equivariant maps are there from the representable presheaf to $X$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The Yoneda lemma matches the equivariant maps from the regular right $\mathbb{Z}/2$-set to $X$ with the elements of $X$, by $\alpha\mapsto\alpha(e)$, and $\alpha(m)=\alpha(e)\cdot m$. Each of the elements of $X$ defines such a map, and every map arises this way. $X$ has 5 elements, so there are 5 maps.'
          - problem: 'The additive group $\mathbb{Z}/7$ is regarded as a category with one object; presheaves on it are the right $\mathbb{Z}/7$-sets, and the representable presheaf is $\mathbb{Z}/7$ acting on itself by addition. Let $\alpha$ be an equivariant map from the representable presheaf to itself with $\alpha(5)=2$. What is $\alpha(0)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every equivariant map from the regular right $\mathbb{Z}/7$-set to itself satisfies $\alpha(m)=\alpha(0)+m$. Using the given value, $\alpha(5)=\alpha(0)+5=2$, so $\alpha(0)=2-5=-3$. In $\mathbb{Z}/7$ this is 4.'
          - problem: 'The additive group $\mathbb{Z}/6$ is regarded as a category with one object; presheaves on it are the right $\mathbb{Z}/6$-sets. How many equivariant maps are there from the representable presheaf $\mathbb{Z}/6$, with its regular right action, to itself?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The Yoneda lemma matches the equivariant maps from the representable presheaf to itself with the endomorphisms of the object, which are the elements of $\mathbb{Z}/6$. Each element $k$ gives the translation $\alpha(m)=k+m$, and these are all of them. There are 6 equivariant maps.'
          - problem: 'The monoid $M=\{e,z\}$, with identity $e$ and $z\cdot z=z$, is regarded as a category with one object; presheaves on it are the right $M$-sets. Let $X=\{1,2\}$ be the right $M$-set with $x\cdot e=x$ and $x\cdot z=2$ for every $x$ in $X$. How many equivariant maps are there from the regular right $M$-set to $X$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The Yoneda lemma matches equivariant maps with the elements of $X$, because $\alpha$ is determined by $\alpha(e)$ through $\alpha(m)=\alpha(e)\cdot m$. Both choices work: $\alpha(e)=1$ gives $\alpha(z)=1\cdot z=2$, and $\alpha(e)=2$ gives $\alpha(z)=2\cdot z=2$. So there are 2 equivariant maps.'
          - problem: 'The group $\mathbb{Z}/4$ is regarded as a category with one object, and it acts from the right on $X=\{1,2,3,4\}$: the element $m$ moves each number forward by $m$ steps around the cycle $1\to2\to3\to4\to1$. Let $\alpha$ be an equivariant map from the regular right $\mathbb{Z}/4$-set to $X$ with $\alpha(0)=2$. What is $\alpha(3)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Equivariance gives $\alpha(3)=\alpha(0)\cdot 3$, which is the number 2 moved forward by 3 steps around the cycle. The steps go $2\to3\to4\to1$. So $\alpha(3)=1$.'
          - problem: 'Sam says that no equivariant map exists from the regular right $\mathbb{Z}/3$-set to $X=\{1,2,3\}$, where $m$ moves each element forward by $m$ steps around the cycle $1\to2\to3\to1$, because the image of $0$ would have to be fixed by the action. How many equivariant maps are there?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Equivariance requires $\alpha(m)=\alpha(0)\cdot m$, and the image of 0 does not have to be fixed by anything. Every choice of $\alpha(0)$ in $X$ gives an equivariant map. So there are 3 equivariant maps, one for each element of $X$.'
          - problem: 'Write the full proof that for a monoid $M$ the presheaves on the one-object category $BM$ are exactly the right $M$-sets, and that equivariant maps from the regular right $M$-set to a right $M$-set $X$ correspond bijectively to the elements of $X$.'
            answer: 'Equivariant maps correspond to elements'
            answer_contract: {"kind": "none"}
            solution_sketch: 'A presheaf $X$ on $BM$ is a set $X(*)$ with maps $X(m)$ satisfying $X(mn)=X(n)\circ X(m)$ and $X(e)=\mathrm{id}$. Writing $x\cdot m=X(m)(x)$ turns these laws into $x\cdot(mn)=(x\cdot m)\cdot n$ and $x\cdot e=x$, which is a right action. The representable presheaf has underlying set $M$ with $m$ acting by $h\mapsto hm$, and naturality of $\alpha$ reads $\alpha(h\cdot m)=\alpha(h)\cdot m$, which is equivariance. Define $\Phi(\alpha)=\alpha(e)$ and send $x$ to $\alpha_x(m)=x\cdot m$. Then $\alpha_{\Phi(\alpha)}(m)=\alpha(e)\cdot m=\alpha(m)$ and $\Phi(\alpha_x)=x\cdot e=x$, so $\Phi$ is a bijection.'
    diagnostic_exemplar:
      problem: "Let $M=\\mathbb Z/4$ (written additively) be viewed as a one-object category, so that presheaves on it are right $M$-sets. Let $X=\\{p,q\\}$ carry the right action in which the generator $1$ swaps $p$ and $q$. Use the Yoneda lemma to describe the natural transformations from the representable presheaf (the regular right $M$-set $M$) to $X$, and say exactly how many there are."
      answer: "The action is well defined: sending $1$ to the transposition of $\\{p,q\\}$ extends to a homomorphism $\\mathbb Z/4\\to\\mathrm{Sym}(X)$ because the transposition has order $2$, which divides $4$. Writing $*$ for the unique object, the representable presheaf is $\\mathrm{Hom}(-,*)=M$ with right multiplication, and the contravariant Yoneda lemma gives $\\mathrm{Nat}(\\mathrm{Hom}(-,*),X)\\cong X(*)=X$ via $\\alpha\\mapsto\\alpha(e)$, where $e=0$ is the identity. Concretely the transformation attached to $x\\in X$ is $\\alpha^x(m)=x\\cdot m$, which is equivariant since $(x\\cdot m)\\cdot m'=x\\cdot(mm')$, and $\\alpha^x(e)=x$ recovers $x$. So the equivariant maps $M\\to X$ correspond bijectively to the elements of $X$, and there are exactly $2$ of them (namely $m\\mapsto p\\cdot m$ and $m\\mapsto q\\cdot m$)."
      solution_sketch: "First check the action is well defined: a transposition has order $2$, which divides $4$. Then apply Yoneda at the unique object, $\\mathrm{Nat}(\\mathrm{Hom}(-,*),X)\\cong X$ by $\\alpha\\mapsto\\alpha(e)$, so the equivariant maps are $m\\mapsto x\\cdot m$, one for each element $x$."
    anki_seeds:
      - front: "The Yoneda lemma states..."
        back: "$\\mathrm{Nat}(\\mathrm{Hom}(A,-),F)\\cong FA$ naturally, via $\\alpha\\mapsto\\alpha_A(1_A)$."
        type: basic
      - front: "Inverse of the Yoneda map sends $u\\in FA$ to..."
        back: "the natural transformation $h\\mapsto (Fh)(u)$."
        type: basic
      - front: "How many natural transformations $\\mathrm{Hom}(A,-)\\Rightarrow F$ are there?"
        back: "exactly $|FA|$ — they are in bijection with the elements of $FA$."
        type: basic

