  - id: consequences-of-yoneda
    name: Consequences of Yoneda
    core: false
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: yoneda-embedding
        weight: 0.4
        key: true
      - id: yoneda-lemma
        weight: 0.4
        key: true
      - id: representable-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: 'Uniqueness of adjoints'
        key_prerequisites: [yoneda-lemma]
        constraints: 'Two constructions of one free object are compared through the unit-compatible isomorphism (free monoids on words, free abelian groups, posets with an adjoint pair such as pallets per trip and eggs per box). Items compute the comparison map or an adjoint value; the proof item asks for uniqueness and naturality.'
        step_check:
          step: 'is induced by a unique morphism $\varphi_X\colon FX\to F''X$'
          question: 'Why is the natural isomorphism of representables induced by a morphism $\varphi_X$?'
          options:
            - 'Every natural isomorphism of functors is induced by a morphism of the source category'
            - 'Both free groups have the same elements, so $\varphi_X$ is the identity map'
            - 'Fullness: a natural transformation between representables comes from a morphism'
            - 'Both bijections fix the generators, so $\varphi_X$ must be an identity morphism'
          answer: 'Fullness: a natural transformation between representables comes from a morphism'
          why: 'Fullness of the embedding turns the natural isomorphism of representables into one morphism, and faithfulness makes that morphism unique.'
        exemplars:
          - problem: 'Let $F$ and $F''$ both be left adjoint to the forgetful functor $\mathbf{Mon}\to\mathbf{Set}$. For $X=\{a,b\}$ the monoid $FX$ is the set of words in the letters $p,q$ with insertion $a\mapsto p$, $b\mapsto q$. The monoid $F''X$ is the set of words in the letters $r,s$ with insertion $a\mapsto s$, $b\mapsto r$. Let $\varphi\colon FX\to F''X$ be the unique isomorphism compatible with the insertions. Which of the words srr, rss, rrs and ssr is $\varphi(pqq)$?'
            answer: 'srr'
            answer_contract: {"kind": "label", "options": [["srr", "s r r", "s·r·r", "the word srr", "φ(pqq) = srr", "φ(pqq)=srr"], ["rss", "r s s", "the word rss"], ["rrs", "r r s", "the word rrs"], ["ssr", "s s r", "the word ssr"]]}
            solution_sketch: 'Compatibility with the insertions forces $\varphi(p)=s$ and $\varphi(q)=r$. A homomorphism of word monoids preserves concatenation, so $\varphi(pqq)=\varphi(p)\varphi(q)\varphi(q)$, which is the word srr.'
          - problem: 'Let $W$ be the monoid of words over $\{a,b\}$ and let $L$ be the monoid of finite lists of elements of $\{a,b\}$ under concatenation. Both are free monoids on $\{a,b\}$, with insertions sending each of $a$ and $b$ to the one-letter word or one-element list. How many monoid isomorphisms $W\to L$ are compatible with the two insertions?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism out of a free monoid is determined by the images of the generators, and compatibility fixes them. So there is exactly one compatible homomorphism, and it is an isomorphism, which gives the answer $1$.'
          - problem: 'Let $F$ and $F''$ both be left adjoint to the forgetful functor $\mathbf{Ab}\to\mathbf{Set}$, with $FX=F''X=\mathbb Z^2$ for $X=\{a,b\}$. The insertion of $F$ sends $a\mapsto(1,0)$ and $b\mapsto(0,1)$. The insertion of $F''$ sends $a\mapsto(0,1)$ and $b\mapsto(1,0)$. Let $\varphi\colon FX\to F''X$ be the unique isomorphism compatible with the insertions. What is $\varphi(3,5)$?'
            answer: '(5, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Compatibility forces $\varphi(1,0)=(0,1)$ and $\varphi(0,1)=(1,0)$. A homomorphism of abelian groups is linear, so $\varphi(3,5)=3(0,1)+5(1,0)=(5,3)$.'
          - problem: 'The free abelian group on $X=\{a,b\}$ is $\mathbb Z^2$. Use the adjunction between $\mathbf{Ab}$ and $\mathbf{Set}$ to find how many group homomorphisms $\mathbb Z^2\to\mathbb Z/6$ there are.'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The adjunction gives a bijection between homomorphisms $\mathbb Z^2\to\mathbb Z/6$ and functions $\{a,b\}\to\mathbb Z/6$. There are $6$ choices for each of the $2$ elements, so $6\cdot 6=36$ homomorphisms.'
          - problem: 'A truck carries $2$ pallets per trip, so $n$ trips carry $G(n)=2n$ pallets. The number of trips $F(x)$ needed for $x$ pallets is characterised by the rule that $F(x)\le n$ exactly when $x\le G(n)$, for every whole number $n$. This rule determines $F$ uniquely. What is $F(7)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rule says $F(7)\le n$ exactly when $7\le 2n$, so $F(7)$ is the least whole number $n$ with $2n\ge 7$. Since $2\cdot 3=6$ is too small and $2\cdot 4=8$ is enough, $F(7)=4$.'
          - problem: 'Let $F$ and $F''$ both be left adjoint to the forgetful functor $\mathbf{Ab}\to\mathbf{Set}$, with $FX=F''X=\mathbb Z^2$ for $X=\{a,b\}$. The insertion of $F$ sends $a\mapsto(1,0)$ and $b\mapsto(0,1)$, while the insertion of $F''$ sends $a\mapsto(0,1)$ and $b\mapsto(1,0)$. Sam notes that both the identity map and the swap $(x,y)\mapsto(y,x)$ are isomorphisms $\mathbb Z^2\to\mathbb Z^2$, and concludes that the comparison of $FX$ with $F''X$ is not unique. Which of these is compatible with the insertions: the identity map, the swap, both of them, or neither?'
            answer: 'swap'
            answer_contract: {"kind": "label", "options": [["swap", "the swap", "the swap map", "swap map", "(x,y)->(y,x)", "the second map"], ["identity", "the identity", "the identity map", "the first map"], ["both", "both of them"], ["neither", "none of them"]]}
            solution_sketch: 'The identity sends the insertion of $F$ at $a$ to $(1,0)$, but the insertion of $F''$ at $a$ is $(0,1)$. The swap sends $(1,0)$ to $(0,1)$ and $(0,1)$ to $(1,0)$, so only the swap is compatible, and the comparison is unique.'
          - problem: 'Eggs are packed in boxes of $12$, so $n$ boxes hold $G(n)=12n$ eggs. The number of boxes $F(x)$ needed for $x$ eggs is characterised by the rule that $F(x)\le n$ exactly when $x\le G(n)$, for every whole number $n$. What is $F(30)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rule says $F(30)\le n$ exactly when $30\le 12n$, so $F(30)$ is the least whole number $n$ with $12n\ge 30$. Since $12\cdot 2=24$ is too small and $12\cdot 3=36$ is enough, $F(30)=3$.'
          - problem: 'Write the full proof that if the functors $F$ and $F''$ are both left adjoint to the same functor $G$, then for every object $X$ there is a unique isomorphism $F(X)\to F''(X)$ compatible with the two insertions, and these isomorphisms are natural in $X$.'
            answer: 'adjoints are unique up to natural isomorphism'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (chain the hom-set bijections): for every object X and every object D, the adjunction of F gives a bijection from Hom(F(X), D) to Hom(X, G(D)), natural in D, and the adjunction of F'' gives a bijection from Hom(X, G(D)) to Hom(F''(X), D), natural in D. Step 2 (isomorphic representables): composing them yields a natural isomorphism between the representable functors Hom(F(X), -) and Hom(F''(X), -) on the target category. Step 3 (full faithfulness of the Yoneda embedding): the Yoneda embedding of the target category is fully faithful, so every natural transformation between representables, in particular this isomorphism and its inverse, is induced by a unique morphism; hence there is a unique isomorphism from F(X) to F''(X) inducing it. Step 4 (compatibility with the insertions): transposing that isomorphism across the adjunction of F gives the composite of the insertion of F with its image under G, and the chain evaluated at F''(X) identifies this composite with the insertion of F''; conversely, any morphism from F(X) to F''(X) whose transpose is the insertion of F'' induces the same natural isomorphism, so the compatible isomorphism is unique. Step 5 (naturality in the argument): the bijections are natural in X as well, so the isomorphisms assemble into a natural isomorphism from F to F''. This proves that left adjoints are unique up to a unique natural isomorphism compatible with the insertions, natural in the argument, which is the precise content of canonically.'
      - id: kp2
        name: 'Cayley''s theorem as a shadow of Yoneda'
        key_prerequisites: [yoneda-embedding]
        constraints: 'The regular representation of small monoids and groups (Z/n, a two-element monoid with an absorbing element, groups of given order) is computed from left multiplication; items evaluate L_m, find orders and cycles, and test injectivity by evaluation at the unit. The proof item asks for the injective homomorphism M to End(M).'
        step_check:
          step: 'evaluating at $0$ gives $g=\lambda_g(0)=\lambda_h(0)=h$'
          question: 'Why does the value of $\lambda_g$ at $0$ recover the element $g$?'
          options:
            - 'We have $\lambda_g(0)=g+0=g$, because $0$ is the unit for addition'
            - 'We have $\lambda_g(0)=0$ for every $g$, so all the maps $\lambda_g$ agree there'
            - 'The point $0$ is the only point at which each map $\lambda_g$ is defined'
            - 'Evaluation at $0$ is a homomorphism, which forces the whole map to be injective'
          answer: 'We have $\lambda_g(0)=g+0=g$, because $0$ is the unit for addition'
          why: 'Left addition by $g$ sends the unit $0$ to $g+0=g$, so two maps $\lambda_g$ and $\lambda_h$ that agree at $0$ come from the same element.'
        exemplars:
          - problem: 'Regard $\mathbb Z/5$ under addition as a one-object category. The Yoneda embedding sends the morphism $2$ to the permutation $L_2\colon x\mapsto 2+x$ of $\mathbb Z/5$. What is $L_2(4)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The permutation $L_2$ adds $2$ to its argument modulo $5$. So $L_2(4)=2+4=6$, and $6$ leaves remainder $1$ modulo $5$.'
          - problem: 'In $\mathbb Z/4$ under addition, $L_2$ is the permutation $x\mapsto 2+x$ of $\{0,1,2,3\}$. What is the order of $L_2$ in the group $\mathrm{Sym}(\mathbb Z/4)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The permutation $L_2$ sends $0$ to $2$, $1$ to $3$, $2$ to $0$ and $3$ to $1$. Doing it twice adds $4\equiv 0$, so $L_2\circ L_2$ is the identity while $L_2$ is not, and the order is $2$.'
          - problem: 'Let $M=\{e,z\}$ be the monoid with identity $e$ and $zz=ez=ze=z$. For $m\in M$ let $L_m\colon M\to M$ be the function $x\mapsto mx$. For which element $m$ is $L_m$ a permutation of $M$?'
            answer: 'e'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function $L_e$ is the identity map, which is a permutation. The function $L_z$ sends both $e$ and $z$ to $z$, so it is not injective, and only $m=e$ works.'
          - problem: 'Let $M=\{e,z\}$ be the monoid with identity $e$ and $zz=ez=ze=z$, and let $L_m(x)=mx$. Sam says that the map $m\mapsto L_m$ is not injective, because $L_e(z)=z=L_z(z)$. Is the map $m\mapsto L_m$ injective?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "injective", "it is"], ["no", "it is not injective", "not injective", "it is not"]]}
            solution_sketch: 'The functions $L_e$ and $L_z$ agree at $z$, but injectivity only needs them to differ at some point. At the unit they differ, since $L_e(e)=e$ and $L_z(e)=z$, so the map is injective.'
          - problem: 'A clock hand starts at $0$ on a $12$-hour clock. The permutation $L_4\colon x\mapsto 4+x$ of $\mathbb Z/12$ moves the hand ahead by $4$ hours. After how many moves does the hand first show $0$ again?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'After $n$ moves the hand shows $4n$ modulo $12$. This first equals $0$ when $4n$ is a multiple of $12$, which happens first at $n=3$.'
          - problem: 'Let $G$ be a group with $6$ elements. Cayley''s theorem embeds $G$ into the symmetric group $\mathrm{Sym}(G)$ by $g\mapsto L_g$. How many permutations of $G$ have the form $L_g$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $g\mapsto L_g$ is injective, so different elements give different permutations. Hence exactly $6$ permutations have the form $L_g$, one for each element of $G$.'
          - problem: 'The seven days of a week are the morphisms $0,1,\dots,6$ of a one-object category, where composition adds days modulo $7$. The Yoneda embedding sends $3$ to $L_3$ and $5$ to $L_5$. The composite $L_3\circ L_5$ equals $L_k$ for which morphism $k$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The embedding is a functor, so $L_3\circ L_5=L_{3+5}$. Since $3+5=8$ leaves remainder $1$ modulo $7$, we get $k=1$.'
          - problem: 'Write the full proof that for a monoid $M$ with unit $e$ the map $m\mapsto L_m$, where $L_m(x)=mx$, is an injective monoid homomorphism $M\to\mathrm{End}(M)$.'
            answer: 'm maps to L_m is an injective homomorphism'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1: regard M as a category with one object, whose morphisms are the elements of M and whose composition is the monoid product. Step 2: by the Yoneda embedding, which is fully faithful, the map from M to the endomorphisms of the single representable presheaf is injective; concretely it sends m to post-composition, which is L_m with L_m(x) = mx, a member of End(M). Step 3: homomorphism: for every x, L_{mn}(x) = (mn)x = m(nx) = L_m(L_n(x)), so L_{mn} = L_m after L_n, and L_e(x) = ex = x, so L_e is the identity function. Step 4: injectivity by evaluation at the unit: if L_m = L_n, then L_m(e) = me = m and L_n(e) = ne = n give m = n. Conclusion: m maps to L_m is an injective monoid homomorphism M to End(M), which is Cayley''s theorem for monoids as the one-object case of Yoneda.'
    diagnostic_exemplar:
      problem: "Let $G\\colon\\mathcal D\\to\\mathcal C$ have two left adjoints, $F\\dashv G$ and $F'\\dashv G$. Use the Yoneda embedding to prove that $F\\cong F'$ by a natural isomorphism, saying exactly which property of the embedding you use."
      answer: "For every object $C$ of $\\mathcal C$ chain the two adjunction bijections: $\\mathrm{Hom}_{\\mathcal D}(FC,D)\\cong\\mathrm{Hom}_{\\mathcal C}(C,GD)\\cong\\mathrm{Hom}_{\\mathcal D}(F'C,D)$, and each is natural in $D$, so the composite is a natural isomorphism of covariant representables $\\mathrm{Hom}(FC,-)\\cong\\mathrm{Hom}(F'C,-)$. The covariant Yoneda embedding $A\\mapsto\\mathrm{Hom}(A,-)$ is fully faithful (Yoneda lemma applied at a second representable), and a fully faithful functor reflects isomorphisms; therefore $FC\\cong F'C$, by the unique isomorphism $\\theta_C$ corresponding to the identity under the chained bijections. Both adjunction bijections are also natural in $C$, so for $c\\colon C\\to C'$ the square $\\theta_{C'}\\circ Fc=F'c\\circ\\theta_C$ commutes; the $\\theta_C$ are therefore the components of a natural isomorphism $F\\cong F'$. Left adjoints of $G$ are unique up to natural isomorphism."
      solution_sketch: "Chain the two adjunction bijections to get a natural isomorphism of covariant representables $\\mathrm{Hom}(FC,-)\\cong\\mathrm{Hom}(F'C,-)$; the property used is that the Yoneda embedding is fully faithful and hence reflects isomorphisms. Naturality of the same bijections in $C$ makes the resulting isomorphisms the components of one natural isomorphism."
