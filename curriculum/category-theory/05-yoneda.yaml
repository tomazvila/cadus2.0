    knowledge_points:
      - id: kp1
        name: The statement in both variances
        key_prerequisites: [representable-functors]
        constraints: "Always state the bijection map $\\alpha\\mapsto\\alpha_A(1_A)$ and its inverse; keep track of which functor is covariant."
        exemplars:
          - problem: "Let C be the poset category with two objects 0 and 1 and one non-identity arrow f: 0 -> 1. Let F: C -> Set be the covariant functor with F(0) = {1, 2}, F(1) = {3, 4} and F(f) sending 1 to 3 and 2 to 4. Take A = 0 and u = 1 in F(0). The Yoneda lemma attaches to u the natural transformation alpha from Hom(0, -) to F with alpha_0(1_0) = u. Compute alpha_1(f)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule used: the covariant Yoneda lemma, whose inverse map sends u in F(A) to the natural transformation with component alpha_X(h) = (F h)(u) for each arrow h: A -> X. Full setup: A = 0, X = 1, h = f, u = 1, and F(f) sends 1 to 3 and 2 to 4. Apply the inverse map: alpha_1(f) = (F f)(1) = 3. The answer is 3."
          - problem: "Let C be the poset category with two objects 0 and 1 and one non-identity arrow f: 0 -> 1. Let G: C^op -> Set be the presheaf with G(1) = {1, 2, 3}, G(0) = {4, 5} and G(f) sending 1 to 4, 2 to 5 and 3 to 4. Take A = 1 and u = 2 in G(1). The contravariant Yoneda lemma attaches to u the natural transformation beta from Hom(-, 1) to G with beta_1(1_1) = u. Compute beta_0(f)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule used: the contravariant Yoneda lemma, whose inverse map sends u in G(A) to the component beta_X(h) = (G h)(u); here h: X -> A and G h: G(A) -> G(X) runs backwards. Full setup: A = 1, X = 0, h = f, u = 2, and G(f) sends 2 to 5. Apply the inverse map: beta_0(f) = (G f)(2) = 5. The answer is 5."
          - problem: "Let C be the category with objects A, B, C and exactly two non-identity arrows f: A -> B and g: A -> C. Let F: C -> Set be the covariant functor with F(A) = {1, 2}, F(B) = {2, 3, 6}, F(C) = {4, 5, 7}, with F(f) sending 1 to 6 and 2 to 3, and with F(g) sending 1 to 4 and 2 to 5. Take u = 1 in F(A). The Yoneda lemma attaches to u the natural transformation alpha from Hom(A, -) to F. Give the values valb = alpha_B(f) and valc = alpha_C(g)."
            answer: "valb = 6; valc = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "valb"}, {"contract": {"kind": "exact"}, "name": "valc"}]}
            solution_sketch: "Rule used: the covariant Yoneda lemma: the transformation attached to u has component alpha_X(h) = (F h)(u) for every arrow h out of A. Full setup: u = 1, F(f) sends 1 to 6, and F(g) sends 1 to 4. Apply the rule to f: alpha_B(f) = (F f)(1) = 6. Apply the rule to g: alpha_C(g) = (F g)(1) = 4. The answer is valb = 6; valc = 4."
          - problem: "Let C be the poset category with two objects 0 and 1 and one non-identity arrow f: 0 -> 1. Let F: C -> Set be the covariant functor with F(0) = {6, 7, 8}, F(1) = {9, 10, 11} and F(f) sending 6 to 10, 7 to 9 and 8 to 11. Let alpha be a natural transformation from Hom(0, -) to F with alpha_1(f) = 9. The Yoneda map sends alpha to the element alpha_0(1_0) of F(0). Give the element alpha_0(1_0)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule used: the covariant Yoneda lemma, which makes the map sending alpha to alpha_0(1_0) a bijection, so one component fixes the whole transformation. Naturality along f gives the identity alpha_1(f) = (F f)(alpha_0(1_0)), so (F f)(u) = 9 where u = alpha_0(1_0). The map F(f) sends 6 to 10, 7 to 9 and 8 to 11, so the only preimage of 9 is 7. The answer is 7."
          - problem: "Let C be a category, let G: C^op -> Set be a presheaf, let A be an object of C, and let u be an element of G(A). The contravariant Yoneda lemma attaches to u a natural transformation from Hom(-, A) to G. For an arrow h: X -> A of C, the component of this transformation at X sends h to an element of G(X). Which expression is that element?"
            answer: "(G h)(u)"
            answer_contract: {"kind": "label", "options": [["(G h)(u)"], ["(G u)(h)"], ["(u G)(h)"], ["G(u)(h)"]]}
            solution_sketch: "Rule used: the contravariant Yoneda lemma: u in G(A) is sent to the transformation whose component at X maps h to (G h)(u), where G h: G(A) -> G(X) because G reverses arrows. Type check: h: X -> A, so (G h)(u) lands in G(X), exactly the codomain of the component. The option (G u)(h) swaps the roles of element and arrow. The option (u G)(h) writes the action in a meaningless order. The option G(u)(h) applies the presheaf to an element, which is undefined. The answer is (G h)(u)."
          - problem: "Claim: for every covariant functor F: C -> Set and every object A, the map sending a natural transformation alpha from Hom(A, -) to F to the element alpha_A(1_A) of F(A) is a bijection. Step 1: the value alpha_A(1_A) lies in F(A), so the map is well defined. Step 2: for an arrow h: A -> X, naturality of alpha along h gives alpha_X(1_X) = (F h)(alpha_A(1_A)). Step 3: hence the component of alpha at each object is determined by the value alpha_A(1_A), so the map is injective. Step 4: conversely, each element u of F(A) is the image of the transformation whose component at X sends h to (F h)(u), so the map is also surjective. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it only records that alpha_A(1_A) lies in F(A). Step 2 is the first invalid step: naturality along h, evaluated at 1_A, gives alpha_X(h) = (F h)(alpha_A(1_A)) because Hom(A, h) sends 1_A to h; the identity 1_X never enters the naturality square. Step 3 is valid once Step 2 is corrected, since the corrected identity determines every component from the single value alpha_A(1_A). Step 4 is valid: the assignment sending h to (F h)(u) is exactly the inverse map, which gives surjectivity. The answer is Step 2."
          - problem: "Write the full proof: for every covariant functor F from a category C to Set and every object A of C, the map sending a natural transformation alpha from Hom(A, -) to F to the element alpha_A(1_A) is a bijection from the set Nat(Hom(A, -), F) of natural transformations onto F(A), with inverse sending each u in F(A) to the transformation whose component at X sends h to (F h)(u), and the bijection is natural in A and in F. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (well defined): a natural transformation alpha has a component alpha_A: Hom(A, A) -> F(A), so alpha_A(1_A) is an element of F(A). Step 2 (naturality): for an arrow h: A -> X, the naturality square of alpha along h reads (F h) after alpha_A = alpha_X after Hom(A, h); evaluating at 1_A and using Hom(A, h)(1_A) = h gives alpha_X(h) = (F h)(alpha_A(1_A)). Step 3 (injective): this identity determines every component from the single value alpha_A(1_A), so two transformations with the same value are equal. Step 4 (inverse): given u in F(A), define beta with component beta_X(h) = (F h)(u) for each h in Hom(A, X). Step 5 (naturality of beta): for k: X -> Y, beta_Y(k after h) = (F k)((F h)(u)) = (F k)(beta_X(h)) by functoriality of F, so beta is natural. Step 6 (conclusion): beta_A(1_A) = (F 1_A)(u) = u, and the two constructions are mutually inverse, so the map alpha to alpha_A(1_A) is a bijection, natural in A and in F."
      - id: kp2
        name: Counting natural transformations out of a representable
        key_prerequisites: [hom-functors]
        constraints: "Either instantiate the lemma at a second representable and read off the resulting hom-set, or count with finite sets of size at most 4; in a counting problem name the set $FA$ being counted and give its cardinality as an explicit number."
        exemplars:
          - problem: "In the category of sets, take A = {1,2,3,4} and F = Hom(B, -) with B = {1,2}. The Yoneda lemma counts the set F(A) = Hom(B, A), the set of functions from {1,2} to {1,2,3,4}. Find the number of natural transformations from Hom(A,-) to F."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma rule: Nat(Hom(A,-), F) is in bijection with F(A), via alpha maps to alpha_A(1_A). Here the full set being counted is F(A) = Hom({1,2}, {1,2,3,4}), the functions from {1,2} to {1,2,3,4}. Counting rule: each of the 2 inputs independently picks one of 4 outputs, so there are 4^2 = 16 functions. The answer is 16."
          - problem: "In the category of sets, take A = {1,2} and let P be the covariant power-set functor, so the Yoneda lemma counts the set P(A), the set of all subsets of {1,2}. Find the number of natural transformations from Hom(A,-) to P."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma rule: Nat(Hom(A,-), P) is in bijection with P(A). The full set being counted is P(A), the collection of all subsets of {1,2}, namely the empty set, {1}, {2}, and {1,2}. Counting rule: a 2-element set has 2^2 = 4 subsets. The answer is 4."
          - problem: "Let A = {1,2}. Let F be the functor on sets where F(X) is the set of pairs (x, i) with x in X and i in {0,1}, and F(h) sends (x, i) to (h(x), i). A natural transformation from Hom(A,-) to F is fixed by u = alpha_A(1_A), and here u = (2,1). Take the map h from A to {5,6,7} with h(1) = 5 and h(2) = 7. Compute the value F(h)(u), and give the answer as (x, i)."
            answer: "(7,1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Yoneda lemma rule: the transformation alpha is fixed by u = alpha_A(1_A), and its component at X sends h to F(h)(u). Compute F(h) on u = (2,1): by definition F(h) sends (x, i) to (h(x), i), so F(h)(u) = (h(2), 1). With h(2) = 7, the full value is the pair (7,1). The answer is (7,1)."
          - problem: "Let C be the category from the chain 1 <= 2 <= 3: an arrow from x to y exists exactly when x <= y, and hom-sets are empty otherwise. Take the representable Hom(2, -) and F = Hom(3, -), so the Yoneda lemma counts the set F(2) = Hom(3,2), the set of arrows from 3 to 2. Find the number of natural transformations from Hom(2,-) to F."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma rule: Nat(Hom(2,-), Hom(3,-)) is in bijection with Hom(3,2), the value of F = Hom(3,-) at the object 2. The full set Hom(3,2) is the set of arrows from 3 to 2 in the chain 1 <= 2 <= 3; such an arrow exists only when 3 <= 2, which is false, so this set is empty. Counting rule: an empty set has 0 elements, so there are no such transformations. The answer is 0."
          - problem: "In the category of sets, take A = {a,b,c} and F = Hom({a,b}, -). A student counts the natural transformations from Hom(A,-) to F. Step 1: by the Yoneda lemma they are in bijection with F(A). Step 2: F(A) = Hom({a,b}, {a,b,c}), the set of functions from {a,b} to {a,b,c}. Step 3: there are 2^3 = 8 such functions. Step 4: so there are 8 natural transformations. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly applies the Yoneda lemma, Nat(Hom(A,-), F) is in bijection with F(A). Step 2 correctly identifies F(A) as the set of functions from {a,b} to {a,b,c}. Step 3 counts in the wrong direction: a function from a 2-element set to a 3-element set makes 2 choices with 3 options each, giving 3^2 = 9, not 2^3 = 8. Step 4 only repeats the count inherited from Step 3, so it is wrong but not first. The answer is Step 3."
          - problem: "Let F be the functor on sets where F(X) is the set of pairs (x, y) with both entries in X, and F(h) sends (x, y) to (h(x), h(y)). Take A = {1,2,3}, so the Yoneda lemma counts the set F(A), the set of pairs with both entries in {1,2,3}. Find the number of natural transformations from Hom(A,-) to F."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Yoneda lemma rule: Nat(Hom(A,-), F) is in bijection with F(A), via alpha maps to alpha_A(1_A). The full set being counted is F(A), the set of pairs (x, y) with both entries in {1,2,3}. Counting rule: 3 choices for x and independently 3 choices for y give 3 times 3 = 9 pairs. The answer is 9."
          - problem: "Write the full proof: in the category of sets, for every set A and every functor F from sets to sets, the map sending a natural transformation alpha from Hom(A,-) to F to the element alpha_A(1_A) is a bijection onto F(A). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (key identity): for any set X and any map h from A to X, h equals Hom(A,h) applied to 1_A, so naturality of alpha at h gives alpha_X(h) = F(h)(alpha_A(1_A)). Step 2 (injectivity): if alpha_A(1_A) = beta_A(1_A) = u, then alpha_X(h) = F(h)(u) = beta_X(h) for every h, so alpha = beta. Step 3 (surjectivity): given u in F(A), define alpha_X(h) = F(h)(u); naturality at f from X to Y holds because F(f)(alpha_X(h)) = F(f)(F(h)(u)) = F(f h)(u) = alpha_Y(f h). Step 4 (conclusion): the two constructions are inverse, so alpha maps to alpha_A(1_A) is a bijection from Nat(Hom(A,-), F) to F(A)."
      - id: kp3
        name: The one-object case — monoid and group actions
        key_prerequisites: [functor-categories]
        constraints: "Identify the presheaf category as right actions before applying the lemma."
        exemplars:
          - problem: "Regard the additive monoid $\\mathbb{Z}/4$ as a one-object category $B$; a presheaf on $B$ is exactly a set with a right action of $\\mathbb{Z}/4$. The representable presheaf $\\mathrm{Hom}(-,*)$ is the regular right action on the set of morphisms $\\mathbb{Z}/4$, where a morphism $m$ acts by precomposition: $h \\cdot m = h + m$. Compute the element $1 \\cdot 2$ of the representable presheaf."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify the presheaf: on the one-object category, a presheaf $X$ gives the set $X(*)$ and each morphism $m$ acts by a function $X(m)$; for the representable presheaf the set is $\\mathrm{Hom}(*,*) = \\mathbb{Z}/4$ and $m$ acts by precomposition, $h \\cdot m = h + m$. Compute the action: $1 \\cdot 2 = 1 + 2 = 3$ in $\\mathbb{Z}/4$. The value is 3."
          - problem: "Regard the group $\\mathbb{Z}/2 = \\{e, t\\}$ as a one-object category; presheaves on it are exactly the right $\\mathbb{Z}/2$-sets. Let $X = \\{1,2,3,4,5\\}$ be the right $\\mathbb{Z}/2$-set in which $t$ swaps $1$ and $2$ and fixes $3$, $4$, $5$. The representable presheaf is $\\mathbb{Z}/2$ with its regular right action. How many equivariant maps are there from the regular right $\\mathbb{Z}/2$-set to $X$?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify the context: presheaves on the one-object category of $\\mathbb{Z}/2$ are right $\\mathbb{Z}/2$-sets, and the representable presheaf is the regular right action. Apply the Yoneda lemma: equivariant maps from the regular right $\\mathbb{Z}/2$-set to $X$ correspond bijectively to elements of $X$, via $\\alpha \\mapsto \\alpha(e)$, with $\\alpha(m) = \\alpha(e) \\cdot m$. Each of the five elements of $X$ defines such a map, and every map arises this way. The count is 5."
          - problem: "Regard the additive group $\\mathbb{Z}/7$ as a one-object category; presheaves on it are the right $\\mathbb{Z}/7$-sets, and the representable presheaf is the regular right action of $\\mathbb{Z}/7$ on itself. Let $\\alpha$ be an equivariant map from the regular right $\\mathbb{Z}/7$-set to itself, with $\\alpha(5) = 2$. The Yoneda lemma says that $\\alpha$ is completely determined by $\\alpha(0)$. Determine $\\alpha(0)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Yoneda lemma identifies $\\alpha$ with $\\alpha(0)$: every equivariant map from the regular right $\\mathbb{Z}/7$-set to itself satisfies $\\alpha(m) = \\alpha(0) + m$. Use the given value: $\\alpha(5) = \\alpha(0) + 5 = 2$, so $\\alpha(0) = 2 - 5 = -3$, which is $4$ in $\\mathbb{Z}/7$. The value is 4."
          - problem: "Regard the additive group $\\mathbb{Z}/6$ as a one-object category; presheaves on it are the right $\\mathbb{Z}/6$-sets. The representable presheaf is $\\mathbb{Z}/6$ with its regular right action, and equivariant maps from this presheaf to itself are its natural endotransformations. How many such equivariant maps are there?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Apply the Yoneda lemma with $X$ the representable presheaf itself: natural transformations $\\mathrm{Hom}(-,*) \\to \\mathrm{Hom}(-,*)$ correspond bijectively to elements of $\\mathrm{Hom}(*,*) = \\mathbb{Z}/6$, via $\\alpha \\mapsto \\alpha(0)$. Each element $k$ gives the equivariant translation $\\alpha(m) = k + m$, and these six maps are all of them. There are 6."
          - problem: "Claim: for the right $\\mathbb{Z}/3$-set $X = \\{1,2,3\\}$, in which the generator $t$ acts as the cycle $1 \\to 2 \\to 3 \\to 1$, there are no equivariant maps from the regular right $\\mathbb{Z}/3$-set to $X$. Step 1: presheaves on the one-object category of $\\mathbb{Z}/3$ are right $\\mathbb{Z}/3$-sets, and the representable presheaf is $\\mathbb{Z}/3$ with its regular right action. Step 2: by the Yoneda lemma, equivariant maps from the regular action to $X$ correspond to elements of $X$, via $\\alpha \\mapsto \\alpha(0)$. Step 3: an element $x$ can be $\\alpha(0)$ only if $x$ is fixed by $t$, since $\\alpha(0) = \\alpha(0 \\cdot t) = \\alpha(0) \\cdot t$. Step 4: no element of $X$ is fixed by $t$, so there are no equivariant maps. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly identifies presheaves on the one-object category as right actions and the representable presheaf as the regular action. Step 2 correctly states the Yoneda bijection with elements of $X$. Step 3 is not valid: equivariance gives $\\alpha(0) \\cdot t = \\alpha(0 + t)$, and since $0 \\cdot t = t \\neq 0$, it does not force $\\alpha(0)$ to be a fixed point; in fact every element works, with $\\alpha(m) = \\alpha(0) + m$. Step 4 only inherits the error of Step 3. The answer is Step 3."
          - problem: "Regard the two-element monoid $M = \\{e, z\\}$, with identity $e$ and absorbing element $z$ (so $z \\cdot z = z$), as a one-object category; presheaves on it are the right $M$-sets. Let $X = \\{1, 2\\}$ be the right $M$-set with $x \\cdot e = x$ and $x \\cdot z = 2$ for every $x$ in $X$. How many equivariant maps are there from the regular right $M$-set to $X$?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Identify the context: presheaves on the one-object category of $M$ are right $M$-sets, and the Yoneda lemma bijects equivariant maps from the regular right $M$-set to $X$ with the elements of $X$, since $\\alpha$ is determined by $\\alpha(e)$ through $\\alpha(m) = \\alpha(e) \\cdot m$. Check each element: $\\alpha(e) = 1$ gives $\\alpha(z) = 1 \\cdot z = 2$, and $\\alpha(e) = 2$ gives $\\alpha(z) = 2 \\cdot z = 2$; both satisfy $\\alpha(h \\cdot m) = \\alpha(h) \\cdot m$. So there are 2."
          - problem: "Write the full proof: for a monoid $M$, presheaves on the one-object category $BM$ are exactly the right $M$-sets, and the Yoneda lemma gives a bijection between the equivariant maps from the regular right $M$-set to a right $M$-set $X$ and the elements of $X$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (presheaves as actions): a presheaf $X\\colon BM^{op} \\to \\mathbf{Set}$ is the set $X(*)$ together with a function $X(m)\\colon X(*) \\to X(*)$ for each $m \\in M$, with $X(mn) = X(n) \\circ X(m)$ and $X(e) = \\mathrm{id}$. Writing $x \\cdot m = X(m)(x)$, these laws say $x \\cdot (mn) = (x \\cdot m) \\cdot n$ and $x \\cdot e = x$, exactly a right action. Step 2 (representable): the presheaf $\\mathrm{Hom}(-,*)$ has underlying set $\\mathrm{Hom}(*,*) = M$, and $m$ acts by precomposition $h \\mapsto h m$, the right regular action. Step 3 (naturality as equivariance): a natural transformation $\\alpha\\colon \\mathrm{Hom}(-,*) \\to X$ is a function $\\alpha_*\\colon M \\to X(*)$ with $\\alpha_* \\circ \\mathrm{Hom}(m,-) = X(m) \\circ \\alpha_*$, that is $\\alpha(h \\cdot m) = \\alpha(h) \\cdot m$: an equivariant map. Step 4 (bijection): define $\\Phi(\\alpha) = \\alpha(e)$. For $x \\in X(*)$ set $\\alpha_x(m) = x \\cdot m$; the action laws give $\\alpha_x(h \\cdot m) = x \\cdot (hm) = (x \\cdot h) \\cdot m = \\alpha_x(h) \\cdot m$, so $\\alpha_x$ is equivariant. These constructions are inverse: $\\alpha_{\\Phi(\\alpha)}(m) = \\alpha(e) \\cdot m = \\alpha(e m) = \\alpha(m)$ by equivariance, and $\\Phi(\\alpha_x) = \\alpha_x(e) = x \\cdot e = x$. Hence $\\alpha \\mapsto \\alpha(e)$ is a bijection between equivariant maps from the regular right $M$-set to $X$ and the elements of $X$."
    diagnostic_exemplar:
      problem: "Let $M=\\mathbb Z/4$ (written additively) be viewed as a one-object category, so that presheaves on it are right $M$-sets. Let $X=\\{p,q\\}$ carry the right action in which the generator $1$ swaps $p$ and $q$. Use the Yoneda lemma to describe the natural transformations from the representable presheaf (the regular right $M$-set $M$) to $X$, and say exactly how many there are."
      answer: "The action is well defined: sending $1$ to the transposition of $\\{p,q\\}$ extends to a homomorphism $\\mathbb Z/4\\to\\mathrm{Sym}(X)$ because the transposition has order $2$, which divides $4$. Writing $*$ for the unique object, the representable presheaf is $\\mathrm{Hom}(-,*)=M$ with right multiplication, and the contravariant Yoneda lemma gives $\\mathrm{Nat}(\\mathrm{Hom}(-,*),X)\\cong X(*)=X$ via $\\alpha\\mapsto\\alpha(e)$, where $e=0$ is the identity. Concretely the transformation attached to $x\\in X$ is $\\alpha^x(m)=x\\cdot m$, which is equivariant since $(x\\cdot m)\\cdot m'=x\\cdot(mm')$, and $\\alpha^x(e)=x$ recovers $x$. So the equivariant maps $M\\to X$ correspond bijectively to the elements of $X$, and there are exactly $2$ of them (namely $m\\mapsto p\\cdot m$ and $m\\mapsto q\\cdot m$)."
      solution_sketch: "First check the action is well defined: a transposition has order $2$, which divides $4$. Then apply Yoneda at the unique object, $\\mathrm{Nat}(\\mathrm{Hom}(-,*),X)\\cong X$ by $\\alpha\\mapsto\\alpha(e)$, so the equivariant maps are $m\\mapsto x\\cdot m$, one for each element $x$."
    anki_seeds:
      - front: "The Yoneda lemma states..."
        back: "$\\mathrm{Nat}(\\mathrm{Hom}(A,-),F)\\cong FA$ naturally, via $\\alpha\\mapsto\\alpha_A(1_A)$."
        type: basic
      - front: "Inverse of the Yoneda map sends $u\\in FA$ to..."
        back: "the natural transformation $h\\mapsto (Fh)(u)$."
        type: basic
      - front: "How many natural transformations $\\mathrm{Hom}(A,-)\\Rightarrow F$ are there?"
        back: "exactly $|FA|$ — they are in bijection with the elements of $FA$."
        type: basic

  - id: yoneda-lemma
    name: The Yoneda Lemma
    core: true
    difficulty: 0.85
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: yoneda-statement-mechanics
        weight: 0.6
        key: true
      - id: representable-functors
        weight: 0.4
        key: true
      - id: natural-transformations
        weight: 0.4
        key: true
      - id: functor-categories
        weight: 0.3
      - id: universal-elements
        weight: 0.3
      - id: hom-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Proof of the bijection
        key_prerequisites: [natural-transformations]
        constraints: "Write both maps explicitly, $\\Theta(u)_X(h)=(Fh)(u)$ and $\\Psi(\\alpha)=\\alpha_A(1_A)$; naturality of $\\Theta(u)$ must cite the composition law of $F$, and each round trip must cite either $F(1_A)=1_{FA}$ or naturality of $\\alpha$ — one citation per step, no elements of $\\mathcal C$."
        exemplars:
          - problem: "Prove that $\\Theta(u)$, defined by $\\Theta(u)_X(h)=(Fh)(u)$ for $u\\in FA$, really is a natural transformation $\\mathrm{Hom}(A,-)\\Rightarrow F$."
            answer: "Naturality at $k\\colon X\\to Y$ is the composition law $F(k\\circ h)=Fk\\circ Fh$."
            solution_sketch: "Fix $u\\in FA$ and set $\\Theta(u)_X\\colon\\mathrm{Hom}(A,X)\\to FX$, $h\\mapsto(Fh)(u)$; the type is right since $Fh\\colon FA\\to FX$. For $k\\colon X\\to Y$, naturality asks $Fk\\circ\\Theta(u)_X=\\Theta(u)_Y\\circ\\mathrm{Hom}(A,k)$. On $h\\in\\mathrm{Hom}(A,X)$ the left side gives $Fk\\big((Fh)(u)\\big)=F(k\\circ h)(u)$ by functoriality, and the right side gives $\\Theta(u)_Y(k\\circ h)=F(k\\circ h)(u)$. They agree, so $\\Theta(u)$ is natural."
          - problem: "Prove the two maps $\\Psi(\\alpha)=\\alpha_A(1_A)$ and $\\Theta(u)_X(h)=(Fh)(u)$ are mutually inverse."
            answer: "$\\Psi\\Theta=\\mathrm{id}$ by $F(1_A)=1$; $\\Theta\\Psi=\\mathrm{id}$ by naturality of $\\alpha$."
            solution_sketch: "First, $\\Theta(u)$ is natural by functoriality of $F$. Then $\\Psi(\\Theta(u))=\\Theta(u)_A(1_A)=(F1_A)(u)=u$, so $\\Psi\\Theta=\\mathrm{id}$. Conversely, for any $\\alpha$ and $h\\colon A\\to X$, naturality of $\\alpha$ at $h$ applied to $1_A$ gives $\\alpha_X(h)=\\alpha_X(h\\circ 1_A)=(Fh)(\\alpha_A(1_A))=\\Theta(\\Psi(\\alpha))_X(h)$, so $\\Theta\\Psi=\\mathrm{id}$. Hence the correspondence is a bijection."
      - id: kp2
        name: Naturality of the Yoneda isomorphism
        key_prerequisites: [functor-categories]
        constraints: "Name the two induced maps forming the square, then evaluate both routes on a transformation $\\alpha$."
        exemplars:
          - problem: "Let C be the poset with objects p and q and one non-identity arrow f : p → q, viewed as a category. Define functors to Set by F(p) = {1,2,3}, F(q) = {4,5,6}, with F(f) sending 1 to 4, 2 to 5, 3 to 6, and F'(p) = {10,20,30}, F'(q) = {40,50,60}, with F'(f) sending 10 to 40, 20 to 50, 30 to 60. Let φ : F ⇒ F' be the natural transformation with φ_p sending 1 to 10, 2 to 20, 3 to 30. Let α : Hom(p, −) ⇒ F be the natural transformation with α_p(1_p) = 3. The naturality square in F has one route that applies φ_p after Ψ, and one route that applies Ψ after post-composition with φ. Find the common value that both routes assign to α."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The square in F has the two induced maps: post-composition α ↦ φ ∘ α on Nat(Hom(p, −), −), and the component φ_p on evaluation at p. Route one evaluates Ψ first by the Yoneda assignment: Ψ_F(α) = α_p(1_p) = 3, then applies φ_p to get φ_p(3) = 30. Route two post-composes first: Ψ_F'(φ ∘ α) = (φ ∘ α)_p(1_p) = φ_p(α_p(1_p)) = 30. Both routes agree, so the common value is 30."
          - problem: "Let C be the poset with objects u and v and one non-identity arrow g : u → v, viewed as a category. Let F : C → Set have F(u) = {2,4,6}, F(v) = {3,5,7}, with F(g) sending 2 to 3, 4 to 5, 6 to 7. Let β : Hom(u, −) ⇒ F be the natural transformation with β_u(1_u) = 4. For the arrow g, the naturality square in A has one route that precomposes with g* and then applies Ψ at v, and one route that applies F(g) after Ψ at u. Find the common value that both routes assign to β."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The square in A, for the arrow g : u → v, has the two induced maps: precomposition β ↦ β ∘ g* with (g*)_X(k) = k ∘ g, and F(g) on values. Route one: (β ∘ g*)_v(1_v) = β_v(1_v ∘ g) = β_v(g). Route two: F(g)(Ψ_u(β)) = F(g)(β_u(1_u)) = F(g)(4). Naturality of β at g gives β_v(g) = F(g)(β_u(1_u)), so both routes give the same number. The common value is 5."
          - problem: "Let C be the category with one object x and only the identity arrow 1_x, so a functor from C to Set is just a set. Take F(x) = {1,2} and F'(x) = {10,20}, and let φ : F ⇒ F' have φ_x sending 1 to 10 and 2 to 20. The naturality square in F has one route that applies φ_x after Ψ, and one route that applies Ψ after post-composition with φ. For a natural transformation α : Hom(x, −) ⇒ F, both routes send α to 20. Find Ψ(α) = α_x(1_x)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The square in F has the two induced maps: post-composition α ↦ φ ∘ α and the component φ_x. Route one: φ_x(Ψ(α)) = φ_x(α_x(1_x)). Route two: Ψ(φ ∘ α) = (φ ∘ α)_x(1_x) = φ_x(α_x(1_x)). Both routes equal φ_x(α_x(1_x)), and this common value is given as 20. Since φ_x sends 1 to 10 and 2 to 20, and only the input 2 lands on 20, injectivity of φ_x gives α_x(1_x) = 2. The answer is 2."
          - problem: "Let C be the poset with objects a and b and one non-identity arrow h : a → b, viewed as a category. Let F : C → Set have F(a) = {7,8,9}, F(b) = {70,80,90}, with F(h) sending 7 to 70, 8 to 80, 9 to 90. Let β : Hom(a, −) ⇒ F be a natural transformation for which both routes of the naturality square in A, taken at the arrow h, send β to 90. Route one precomposes with h* and then applies Ψ; route two applies F(h) after Ψ. Find β_a(1_a)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The square in A for the arrow h : a → b has the two induced maps: precomposition with h*, whose component at b sends 1_b to 1_b ∘ h = h, and F(h) on values. Route one sends β to (β ∘ h*)_b(1_b) = β_b(h). Route two sends β to F(h)(β_a(1_a)). The two routes agree, so F(h)(β_a(1_a)) = 90. Since F(h) sends 7 to 70, 8 to 80, 9 to 90, and no other input lands on 90, β_a(1_a) = 9. The answer is 9."
          - problem: "Claim: the Yoneda bijection Ψ : Nat(Hom(A, −), F) → FA with Ψ(α) = α_A(1_A) is natural in F. Step 1: a natural transformation φ : F ⇒ F' induces the map α ↦ φ ∘ α from Nat(Hom(A, −), F) to Nat(Hom(A, −), F') and the component φ_A : FA → F'A. Step 2: route one evaluates Ψ first, giving Ψ_F(α) = α_A(1_A). Step 3: naturality of φ gives φ_A(α_A(1_A)) = α_A(φ_A(1_A)). Step 4: since (φ ∘ α)_A = φ_A ∘ α_A, route two gives Ψ_F'(φ ∘ α) = φ_A(α_A(1_A)), which equals route one. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it correctly names the two induced maps of the square, post-composition with φ and the component φ_A. Step 2 is valid: it is the definition of the Yoneda assignment Ψ. Step 4 is valid: it uses (φ ∘ α)_A = φ_A ∘ α_A, which holds by definition of vertical composition. Step 3 is not valid: naturality of φ says φ_B(F(k)(x)) = F'(k)(φ_A(x)) for each k : A → B and x in FA, and the term φ_A(1_A) is meaningless because 1_A is a morphism, not an element of FA. The first invalid step is Step 3."
          - problem: "Let C be the poset with objects r ≤ s ≤ t and arrows f : r → s, g : s → t, g ∘ f : r → t, viewed as a category. Let F : C → Set have F(r) = {1,2}, F(s) = {3,4}, F(t) = {5,6}, with F(f) sending 1 to 3 and 2 to 4, and F(g) sending 3 to 5 and 4 to 6. Let α : Hom(r, −) ⇒ F be the natural transformation with α_r(1_r) = 2. Evaluate α_t(g ∘ f), using naturality of α at the arrow g ∘ f."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By functoriality of F, F(g ∘ f) = F(g) ∘ F(f), so F(g ∘ f) sends 2 to F(g)(F(f)(2)) = F(g)(4) = 6. Naturality of α at the arrow g ∘ f gives F(g ∘ f)(α_r(1_r)) = α_t((g ∘ f) ∘ 1_r) = α_t(g ∘ f). Substitute α_r(1_r) = 2 to get α_t(g ∘ f) = F(g ∘ f)(2) = 6. The answer is 6."
          - problem: "Write the full proof: the Yoneda bijection Ψ : Nat(Hom(A, −), F) → FA with Ψ(α) = α_A(1_A) is natural in F and in A. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Set Ψ_F(α) = α_A(1_A). Naturality in F: for φ : F ⇒ F', the square has the two induced maps α ↦ φ ∘ α on Nat(Hom(A, −), −) and φ_A on evaluation at A. Evaluate both routes on α. Route one: φ_A(Ψ_F(α)) = φ_A(α_A(1_A)). Route two: Ψ_F'(φ ∘ α) = (φ ∘ α)_A(1_A) = φ_A(α_A(1_A)). The two agree, so the square commutes and the bijection is natural in F. Naturality in A: for f : A → B, the square has the two induced maps α ↦ α ∘ f* with (f*)_X(g) = g ∘ f, and Ff on values. Route one: Ψ_B(α ∘ f*) = (α ∘ f*)_B(1_B) = α_B(1_B ∘ f) = α_B(f). Route two: Ff(Ψ_A(α)) = Ff(α_A(1_A)) = α_B(f ∘ 1_A) = α_B(f), using naturality of α at f. The two agree, so the bijection is natural in A as well, which completes the proof."
      - id: kp3
        name: The contravariant form and its computational corollary
        key_prerequisites: [functor-categories]
        constraints: "Apply the contravariant form at a second presheaf: name the presheaf $G$ being substituted, read off the resulting hom-set, and when $G$ is a representable $\\mathrm{Hom}(-,A)$ say whether the bijection is an isomorphism of monoids."
        exemplars:
          - problem: "State the contravariant Yoneda lemma and compute $\\mathrm{Nat}(\\mathrm{Hom}(-,A),\\mathrm{Hom}(-,B))$."
            answer: "$\\mathrm{Nat}(\\mathrm{Hom}(-,A),G)\\cong GA$; with $G=\\mathrm{Hom}(-,B)$ this is $\\mathrm{Hom}(A,B)$."
            solution_sketch: "For presheaves $G\\colon\\mathcal C^{op}\\to\\mathbf{Set}$, $\\mathrm{Nat}(\\mathrm{Hom}(-,A),G)\\cong GA$ naturally. Taking $G=\\mathrm{Hom}(-,B)$ yields $\\mathrm{Nat}(\\mathrm{Hom}(-,A),\\mathrm{Hom}(-,B))\\cong\\mathrm{Hom}(A,B)$: natural transformations between representables are exactly morphisms of the representing objects — the computational core of the Yoneda embedding."
          - problem: "Use the contravariant Yoneda lemma to compute the monoid of natural endomorphisms of the presheaf $\\mathrm{Hom}(-,A)$."
            answer: "$\\mathrm{Nat}(\\mathrm{Hom}(-,A),\\mathrm{Hom}(-,A))\\cong\\mathrm{End}(A)$, an isomorphism of monoids."
            solution_sketch: "Taking $G=\\mathrm{Hom}(-,A)$ in $\\mathrm{Nat}(\\mathrm{Hom}(-,A),G)\\cong GA$ gives $\\mathrm{Nat}(\\mathrm{Hom}(-,A),\\mathrm{Hom}(-,A))\\cong\\mathrm{Hom}(A,A)=\\mathrm{End}(A)$, with $\\alpha\\mapsto\\alpha_A(1_A)$ and inverse $f\\mapsto f_*=f\\circ(-)$. Since $(g\\circ f)_*=g_*\\circ f_*$ and $(1_A)_*=1$, the bijection respects composition and units, so it is an isomorphism of monoids."
    diagnostic_exemplar:
      problem: "Prove the contravariant Yoneda lemma: for a presheaf $G\\colon\\mathcal C^{op}\\to\\mathbf{Set}$ and an object $A$, the assignment $\\Psi(\\alpha)=\\alpha_A(1_A)$ is a bijection $\\mathrm{Nat}(\\mathrm{Hom}(-,A),G)\\to GA$. Exhibit the inverse, verify both round trips, and check that the bijection is natural in $G$."
      answer: "Inverse: for $u\\in GA$ define $\\Theta(u)_X\\colon\\mathrm{Hom}(X,A)\\to GX$ by $\\Theta(u)_X(h)=(Gh)(u)$. This is natural: for $k\\colon W\\to X$ the presheaf $\\mathrm{Hom}(-,A)$ acts by pre-composition, and $\\Theta(u)_W(h\\circ k)=G(h\\circ k)(u)=\\big(Gk\\circ Gh\\big)(u)=Gk\\big(\\Theta(u)_X(h)\\big)$, using the contravariant composition law $G(h\\circ k)=Gk\\circ Gh$. Round trip 1: $\\Psi(\\Theta(u))=\\Theta(u)_A(1_A)=G(1_A)(u)=u$, since $G(1_A)=1_{GA}$. Round trip 2: for $\\alpha$ natural and $h\\colon X\\to A$, naturality of $\\alpha$ at $h$ reads $\\alpha_X\\circ(-\\circ h)=Gh\\circ\\alpha_A$; evaluating both sides at $1_A$ gives $\\alpha_X(h)=Gh(\\alpha_A(1_A))=\\Theta(\\Psi(\\alpha))_X(h)$, so $\\Theta\\Psi=\\mathrm{id}$. Hence $\\Psi$ is a bijection with inverse $\\Theta$. Naturality in $G$: for $\\varphi\\colon G\\Rightarrow G'$ the square compares $\\alpha\\mapsto\\varphi\\cdot\\alpha\\mapsto(\\varphi\\cdot\\alpha)_A(1_A)=\\varphi_A(\\alpha_A(1_A))$ with $\\alpha\\mapsto\\alpha_A(1_A)\\mapsto\\varphi_A(\\alpha_A(1_A))$; the two routes agree, so the square commutes."
      solution_sketch: "Both directions are a chase of the identity. $\\Psi$ evaluates at $1_A$, and naturality of $\\alpha$ at $h$ applied to $1_A$ forces $\\alpha_X(h)=Gh(\\alpha_A(1_A))$ — which is what the inverse $\\Theta(u)_X(h)=(Gh)(u)$ must be. The other round trip is $G(1_A)=1_{GA}$, and naturality in $G$ is a one-line comparison of the two routes."
    anki_seeds:
      - front: "Key step in the proof of the Yoneda lemma?"
        back: "apply naturality of $\\alpha$ at $h$ to $1_A$: $\\alpha_X(h)=(Fh)(\\alpha_A(1_A))$."
        type: basic
      - front: "$\\mathrm{Nat}(\\mathrm{Hom}(-,A),\\mathrm{Hom}(-,B))\\cong$ {{c1::$\\mathrm{Hom}(A,B)$}}."
        back: "$\\mathrm{Hom}(A,B)$"
        type: cloze
      - front: "The Yoneda isomorphism is natural in which variables?"
        back: "both — in the functor $F$ and in the object $A$."
        type: basic

  - id: yoneda-embedding
    name: The Yoneda Embedding
    core: true
    difficulty: 0.82
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: yoneda-lemma
        weight: 0.5
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: functor-categories
        weight: 0.2
      - id: covariant-contravariant-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The embedding as a functor
        key_prerequisites: [yoneda-lemma]
        constraints: "Define $\\mathbf y$ on objects and on morphisms and say which composition it uses (post-composition for the presheaf version, pre-composition for the covariant-hom version, which is contravariant on $\\mathcal C$); functoriality is a one-line check of each law."
        exemplars:
          - problem: "Define the Yoneda embedding $\\mathbf{y}\\colon\\mathcal C\\to[\\mathcal C^{op},\\mathbf{Set}]$ and confirm it is a functor."
            answer: "$\\mathbf{y}(A)=\\mathrm{Hom}(-,A)$, $\\mathbf{y}(f)=f\\circ(-)$ (post-composition)."
            solution_sketch: "The Yoneda embedding sends $A$ to the representable presheaf $\\mathrm{Hom}(-,A)$ and $f\\colon A\\to B$ to the natural transformation $f_*=f\\circ(-)\\colon\\mathrm{Hom}(-,A)\\Rightarrow\\mathrm{Hom}(-,B)$. Functoriality holds because $(g f)_*=g_*\\circ f_*$ and $(1_A)_*=1$; each $f_*$ is natural since post- and pre-composition commute by associativity."
          - problem: "Describe the covariant-hom embedding $A\\mapsto\\mathrm{Hom}(A,-)$ into $[\\mathcal C,\\mathbf{Set}]$ and confirm it is functorial (contravariant on $\\mathcal C$)."
            answer: "$f\\colon A\\to B$ maps to $f^*=(-)\\circ f\\colon\\mathrm{Hom}(B,-)\\Rightarrow\\mathrm{Hom}(A,-)$ (pre-composition)."
            solution_sketch: "Send each object $A$ to $\\mathrm{Hom}(A,-)$ and each $f\\colon A\\to B$ to $f^*=(-)\\circ f$, the natural transformation with component $\\mathrm{Hom}(B,X)\\to\\mathrm{Hom}(A,X)$, $g\\mapsto g\\circ f$. Each $f^*$ is natural since pre- and post-composition commute. Because $(g\\circ f)^*=f^*\\circ g^*$ and $(1_A)^*=1$, the assignment is a contravariant functor $\\mathcal C\\to[\\mathcal C,\\mathbf{Set}]$, i.e. a functor $\\mathcal C^{op}\\to[\\mathcal C,\\mathbf{Set}]$."
      - id: kp2
        name: Full faithfulness
        key_prerequisites: [full-faithful-functors]
        constraints: "Two routes only: quote the contravariant Yoneda lemma at a second representable, or argue directly by evaluating at identities ($f_*(1_A)=f$ for faithfulness, $\\theta=\\big(\\theta_A(1_A)\\big)_*$ for fullness); name which of full and faithful each step establishes."
        exemplars:
          - problem: "Let C be the category with two objects A and B, their identity morphisms, and exactly two parallel morphisms f and g from A to B. Let y be the Yoneda embedding, so y(A) is the functor Hom(-, A) and y(B) is Hom(-, B). The contravariant Yoneda lemma at the representable y(B) gives a bijection between the natural transformations from y(A) to y(B) and the hom set Hom(A, B). How many natural transformations from y(A) to y(B) are there?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the natural transformations from y(A) = Hom(-, A) to y(B) = Hom(-, B). Rule: the contravariant Yoneda lemma quoted at the second representable y(B) gives a bijection with y(B)(A) = Hom(A, B), and this bijection is the fullness half of full faithfulness. Count the object: Hom(A, B) = {f, g} has 2 elements. The answer is 2."
          - problem: "In the category with objects A and B, their identity morphisms, and an isomorphism f from A to B with inverse g, the Yoneda embedding sends f to the natural transformation y(f) whose component at an object X maps each morphism h from X to A to f after h. To establish that y is faithful, a student evaluates the component at A on the identity morphism 1_A. Which morphism does this evaluation give?"
            answer: "f"
            answer_contract: {"kind": "label", "options": [["f"], ["g"], ["1_A"], ["1_B"]]}
            solution_sketch: "Full object: y(f) is the natural transformation with components y(f)_X(h) = f after h. Rule: the faithfulness route evaluates the component at A on the identity, giving y(f)_A(1_A) = f after 1_A = f, which recovers f and establishes the faithful half. Option g confuses f with its inverse; option 1_A forgets to compose with f; option 1_B evaluates at the wrong object B. The answer is f."
          - problem: "Regard the poset with elements 1, 2, 3, 4 ordered by 1 <= 2 <= 3 and 1 <= 4 as a category: there is one morphism from x to y exactly when x <= y. The Yoneda embedding sends an element a to its downset y(a), the set of elements z with z <= a. Since the embedding is faithful, the downset determines the element. Which element a satisfies y(a) = {1, 2, 3}?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full objects: list all downsets, y(1) = {1}, y(2) = {1, 2}, y(3) = {1, 2, 3}, y(4) = {1, 4}. Rule: by the Yoneda lemma route the embedding is faithful, so equal downsets must come from the same element. Match the given downset {1, 2, 3} with y(3). The answer is 3."
          - problem: "View the cyclic group with elements 0, 1, 2, 3 under addition modulo 4 as a one-object category: one object, and morphisms 0, 1, 2, 3 composed by addition modulo 4. The Yoneda embedding sends a morphism k to the natural transformation y(k) whose single component maps each morphism h to k + h modulo 4. Give the value of the component of y(3) on the morphism 2."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: y(3) is the natural transformation whose single component maps each h to 3 + h modulo 4. Rule: apply the component formula of the identity-evaluation route; the same evaluation at the identity morphism 0 recovers k, which establishes faithfulness. Compute 3 + 2 = 5, and 5 = 1 modulo 4. The answer is 1."
          - problem: "A student argues that the Yoneda embedding y is full, writing: Step 1: let theta be a natural transformation from y(A) to y(B). Step 2: to show fullness, find a morphism f from A to B with y(f) = theta. Step 3: set f = theta_B(1_B), a morphism from A to B. Step 4: naturality gives theta = y(f), so y is full. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly fixes the data of an arbitrary natural transformation theta. Step 2 correctly states the fullness goal. Step 3 is the first invalid step: theta_B(1_B) lies in Hom(B, B), an endomorphism of B, not a morphism from A to B; the identity-evaluation route must use theta_A(1_A) instead. Step 4 would follow only after that correction. The answer is Step 3."
          - problem: "Regard the poset with elements 1, 2, 3, 4 ordered by 1 <= 2 <= 3 and 1 <= 4 as a category: one morphism from x to y exactly when x <= y. The contravariant Yoneda lemma at the representable y(2) gives a bijection between the natural transformations from y(3) to y(2) and the hom set of morphisms from 3 to 2. How many natural transformations from y(3) to y(2) are there?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the hom set of morphisms from 3 to 2 in the poset category. Rule: the contravariant Yoneda lemma quoted at the representable y(2) makes the natural transformations from y(3) to y(2) bijective with that hom set, which is the fullness half. Since 3 <= 2 is false, the hom set is empty. The answer is 0."
          - problem: "Write the full proof: the Yoneda embedding from C to the functor category from C-opposite to Set is fully faithful. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Route: argue directly by evaluating at identities, naming which half each step establishes. Step 1, faithful: if y(f) = y(g) for morphisms f and g from A to B, evaluate the component at A on 1_A to get f = y(f)_A(1_A) = y(g)_A(1_A) = g, so the map on each hom set is injective. Step 2, full: given a natural transformation theta from y(A) to y(B), set f = theta_A(1_A), which lies in Hom(A, B). Step 3, naturality: for any morphism h from X to A, naturality of theta at h applied to 1_A gives theta_X(h) = theta_X(1_A after h) = f after h = y(f)_X(h). Step 4, conclusion: theta = y(f), so the map on hom sets is also surjective, and the Yoneda embedding is fully faithful."
      - id: kp3
        name: Objects are determined by their points
        key_prerequisites: [full-faithful-functors]
        constraints: "Consequences of full faithfulness — reflection of isomorphisms, objects determined by their points; every step must cite full faithfulness or the naturality of $\\mathbf y(f)$, and a hypothesis quantified over all objects $X$ must be instantiated at a specific $X$ (typically $X=A$ or $X=B$)."
        exemplars:
          - problem: "Let P be the poset with a < b and a < c, where b and c are incomparable, viewed as a category. A student claims that b and c are isomorphic in P. To test the claim with points, compare the presheaves y(b) and y(c) at the specific object b. Give the number of elements of the set y(c) at b, that is, of Hom(b, c)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the set y(c)(b) = Hom(b, c). Rule: a poset is a category whose hom set Hom(x, y) has one element when x <= y and is empty otherwise. Instantiate at the specific object b: since b and c are incomparable, Hom(b, c) is empty, while Hom(b, b) has one element. So there is no bijection between Hom(b, b) and Hom(b, c), the presheaves y(b) and y(c) are not isomorphic, and since y is fully faithful it reflects isomorphisms, so b and c are not isomorphic. The answer is 0."
          - problem: "In the category Set, let f : A -> B with A = {3, 4, 5}, B = {0, 1, 2} and f(x) = x - 3. The theorem of this section says that f is an isomorphism if and only if f_* : Hom(X, A) -> Hom(X, B) is a bijection for every set X. Instantiate that statement at a one-point set X, where a map h : X -> A picks out the point 5 of A and f_* sends h to the composite f o h. Give the point of B picked out by f_*(h)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the generalized element f_*(h), a point of B. Instantiate the hypothesis at the specific object X, a one-point set. Rule: a map from a one-point set into A is a generalized element, a point of A, and the component f_* sends it to its image under f, by the naturality of y(f). Compute: the point 5 of A maps to f(5) = 5 - 3 = 2, so f_*(h) picks out the point 2 of B. Here f is a bijection, so f_* is a bijection at this X, exactly as the theorem predicts for an isomorphism. The answer is 2."
          - problem: "Let C be the category with one object * whose morphisms are the powers of an arrow p, composed by adding exponents, with the relation p^4 = id. The Yoneda embedding y is fully faithful. Give the number of natural transformations from y(*) to y(*)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the set of all natural transformations from y(*) to y(*). Rule (fullness of y): each such natural transformation equals y(u) for some morphism u of C. Rule (faithfulness of y): distinct morphisms u give distinct y(u), so the correspondence between natural transformations and morphisms is one-for-one. Count the morphisms: the powers p^0, p^1, p^2, p^3 are pairwise distinct and p^4 = id, so C has exactly 4 morphisms. The answer is 4."
          - problem: "In Set, let f : A -> B be the inclusion of A = {1, 2} into B = {1, 2, 3}. A student claims that for every set X the map f_* : Hom(X, A) -> Hom(X, B) is a bijection. Instantiate this claim at the specific set X = A. Give the number of functions from X = A to B, that is, the size of Hom(A, B)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the set Hom(A, B) of all functions from A to B. Instantiate the claim at the specific object X = A. Rule: in Set, Hom(X, B) is the set of all functions from X to B, of size |B| to the power |X|. Compute: |B| to the power |A| is 3^2 = 9, while Hom(A, A) has 2^2 = 4 functions. Since 4 and 9 differ, f_* at X = A is not a bijection, the claim fails at this X, and since y is fully faithful and reflects isomorphisms, f is not an isomorphism. The answer is 9."
          - problem: "Claim: if for every object X the map f_* : Hom(X, A) -> Hom(X, B) is a bijection, then f : A -> B is an isomorphism. Step 1: the maps f_* are the components of the natural transformation y(f) from y(A) to y(B), by the naturality of y(f). Step 2: since every component f_* is a bijection, y(f) is an isomorphism of presheaves. Step 3: since y is full, f is an isomorphism. Step 4: therefore isomorphisms are detected on generalized elements. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: the components of y(f) are exactly the maps f_* by the naturality of y(f). Step 2 is valid: a natural transformation between Set-valued functors is an isomorphism exactly when each component is a bijection. Step 3 is the first step that is not valid: it cites only fullness, but the conclusion needs that y is fully faithful, since fullness supplies g with y(g) equal to the inverse and faithfulness then gives g o f = id and f o g = id; a fully faithful functor reflects isomorphisms. Step 4 would follow once Step 3 is repaired with the full faithfulness of y. The answer is Step 3."
          - problem: "Claim: an object is determined by its presheaf of points. Step 1: assume that the presheaves y(A) and y(B) are isomorphic. Step 2: pick a natural isomorphism from y(A) to y(B). Step 3: conclude that A is isomorphic to B. Which fact justifies Step 3?"
            answer: "Fully faithful functors reflect isomorphisms"
            answer_contract: {"kind": "label", "options": [["Fully faithful functors reflect isomorphisms"], ["Fully faithful functors preserve isomorphisms"], ["The Yoneda embedding is injective on objects"], ["Every functor between categories reflects isomorphisms"]]}
            solution_sketch: "Step 3 needs the direction from an isomorphism of presheaves back to an isomorphism in C, which is exactly the statement that a fully faithful functor reflects isomorphisms: fullness supplies morphisms f and g with y(f) equal to the chosen isomorphism and y(g) equal to its inverse, and faithfulness applied to y(g o f) = y(id_A) and y(f o g) = y(id_B) gives g o f = id_A and f o g = id_B. The option 'Fully faithful functors preserve isomorphisms' is the wrong direction: preservation goes from A isomorphic to y(A) isomorphic and holds for any functor. The option 'The Yoneda embedding is injective on objects' claims a statement about equality of objects that is false in general and stronger than the conclusion, which is only up to isomorphism. The option 'Every functor between categories reflects isomorphisms' is false, since for example a constant functor does not reflect isomorphisms. The answer is Fully faithful functors reflect isomorphisms."
          - problem: "Write the full proof: for objects A and B of a category C, A is isomorphic to B if and only if the presheaves y(A) and y(B) are isomorphic in the presheaf category. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: suppose first that A is isomorphic to B, say via f : A -> B with inverse. Any functor preserves isomorphisms, so y(f) is an isomorphism from y(A) to y(B), and its component at each X is f_* by the naturality of y(f). This gives the forward direction. Step 2: conversely, suppose y(A) and y(B) are isomorphic, and fix one natural isomorphism between them. Step 3: since y is full, there are morphisms f : A -> B and g : B -> A with y(f) equal to the chosen isomorphism and y(g) equal to its inverse. Step 4: by naturality, y(g o f) = y(g) o y(f) equals the identity natural transformation y(id_A); since y is faithful, this forces g o f = id_A, and the same argument with the roles of A and B swapped gives f o g = id_B. Step 5: f is an isomorphism with inverse g, so A is isomorphic to B. Conclusion: the Yoneda embedding is fully faithful and therefore reflects isomorphisms, so an object is determined up to isomorphism by its presheaf of points."
    diagnostic_exemplar:
      problem: "Let $f\\colon A\\to B$ be a homomorphism of groups such that for every group $X$ the map $f_*\\colon\\mathrm{Hom}_{\\mathbf{Grp}}(X,A)\\to\\mathrm{Hom}_{\\mathbf{Grp}}(X,B)$, $h\\mapsto f\\circ h$, is a bijection. Prove that $f$ is an isomorphism, and identify the natural transformation whose components the maps $f_*$ are."
      answer: "The maps $f_*$ are exactly the components of $\\mathbf y(f)=f\\circ(-)\\colon\\mathrm{Hom}(-,A)\\Rightarrow\\mathrm{Hom}(-,B)$, the image of $f$ under the Yoneda embedding $\\mathbf y\\colon\\mathbf{Grp}\\to[\\mathbf{Grp}^{op},\\mathbf{Set}]$; the hypothesis says every component is a bijection, i.e. $\\mathbf y(f)$ is a natural isomorphism. Since $\\mathbf y$ is fully faithful and fully faithful functors reflect isomorphisms, $f$ is an isomorphism. Directly: take $X=B$; surjectivity of $f_*\\colon\\mathrm{Hom}(B,A)\\to\\mathrm{Hom}(B,B)$ gives $g\\colon B\\to A$ with $f\\circ g=1_B$. Then, in $\\mathrm{Hom}(A,B)$, $f\\circ(g\\circ f)=(f\\circ g)\\circ f=f=f\\circ 1_A$, and injectivity of $f_*\\colon\\mathrm{Hom}(A,A)\\to\\mathrm{Hom}(A,B)$ gives $g\\circ f=1_A$. So $g$ is a two-sided inverse and $f$ is an isomorphism."
      solution_sketch: "Recognise the family $f_*$ as the components of $\\mathbf y(f)$, so the hypothesis says $\\mathbf y(f)$ is a natural isomorphism; $\\mathbf y$ is fully faithful and therefore reflects isomorphisms. Concretely the same conclusion comes from taking $X=B$ to produce the inverse and $X=A$ to force the other identity."
    anki_seeds:
      - front: "The Yoneda embedding $\\mathbf{y}\\colon\\mathcal C\\to[\\mathcal C^{op},\\mathbf{Set}]$ sends $A\\mapsto$? and $f\\mapsto$?"
        back: "$A\\mapsto\\mathrm{Hom}(-,A)$; $f\\mapsto f_*$ (post-composition)."
        type: basic
      - front: "What key property does the Yoneda embedding have?"
        back: "it is fully faithful."
        type: basic
      - front: "A fully faithful embedding lets you conclude $A\\cong B$ from {{c1::$\\mathrm{Hom}(-,A)\\cong\\mathrm{Hom}(-,B)$}}."
        back: "$\\mathrm{Hom}(-,A)\\cong\\mathrm{Hom}(-,B)$"
        type: cloze

  - id: category-of-elements
    name: The Category of Elements
    core: false
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: representable-functors
        weight: 0.4
        key: true
      - id: universal-elements
        weight: 0.4
        key: true
      - id: comma-categories
        weight: 0.3
      - id: functor-categories
        weight: 0.2
      - id: slice-categories
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Definition
        key_prerequisites: [representable-functors]
        constraints: "Give objects as pairs $(C,x)$ with $x\\in FC$ and state the morphism condition in the direction matching the variance ($Ff(x)=x'$ for a covariant $F$, $(Ff)(y)=x$ for a presheaf), then name the projection functor to $\\mathcal C$."
        exemplars:
          - problem: "A category C has two objects A and B and exactly one non-identity arrow f from A to B. A covariant functor F from C to Set has F(A) = {1, 2} and F(B) = {5, 6}, and Ff sends 1 to 5 and 2 to 6. How many morphisms are there in the category of elements of F from (A, 2) to (B, 6)?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of the category of elements for a covariant F, a morphism from (A, 2) to (B, 6) is a map from A to B whose action Ff sends 2 to 6. The only non-identity arrow from A to B is f, and Ff sends 2 to 6, so the condition Ff(x) = x' holds. Hence exactly one arrow qualifies, and the answer is 1."
          - problem: "A category C has two objects A and B and one non-identity arrow f from A to B. A presheaf F on C has F(A) = {1, 2} and F(B) = {7, 8}, and Ff from F(B) to F(A) sends 7 to 1 and 8 to 2. How many morphisms are there in the category of elements of F from (A, 1) to (B, 8)?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For a presheaf, a morphism (C, x) to (D, y) is a map f from C to D with Ff(y) = x, because Ff runs from F(D) to F(C), the direction opposite to the covariant case. The only candidate is the arrow f from A to B, and Ff sends 8 to 2, not to 1. The condition Ff(8) = 1 fails, so no arrow qualifies and the answer is 0."
          - problem: "Let C be the poset with two elements a < b, viewed as a category. A covariant functor F from C to Set has F(a) = {1, 2, 3} and F(b) = {7}. How many objects does the category of elements of F have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the definition of the category of elements for a covariant functor, the objects are the pairs (C, x) with x an element of F(C). Over a, the elements 1, 2 and 3 give the pairs (a, 1), (a, 2) and (a, 3). Over b, the element 7 gives the pair (b, 7). The total is 3 + 1 = 4, so the answer is 4."
          - problem: "A category C has objects A and B and one non-identity arrow f from A to B. A presheaf F on C has F(A) = {1, 2} and F(B) = {3, 4, 5}, with Ff from F(B) to F(A) sending 3 to 1, 4 to 1 and 5 to 2. How many elements y of F(B) give a morphism (A, 1) -> (B, y) in the category of elements of F?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For a presheaf, a morphism (A, 1) -> (B, y) is the arrow f from A to B with Ff(y) = 1, since Ff runs from F(B) to F(A). Check each element of F(B): Ff sends 3 to 1 and 4 to 1, so y = 3 and y = 4 qualify. Ff sends 5 to 2, so y = 5 does not qualify. The count is 2, so the answer is 2."
          - problem: "A category C has two objects A and B with exactly two parallel arrows f and g from A to B and no other non-identity arrows. A covariant functor F from C to Set has F(A) = {1, 2} and F(B) = {6}, and both Ff and Fg send every element of F(A) to 6. Give the answer as verdict = yes or no, telling whether f is a morphism (A, 2) -> (B, 6) in the category of elements of F, and count = the number of morphisms from (A, 2) to (B, 6)."
            answer: "verdict = yes; count = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "By the definition for a covariant functor, a morphism (A, 2) -> (B, 6) is an arrow from A to B whose action sends 2 to 6. The arrow f qualifies, since Ff sends 2 to 6, so the verdict is yes. The arrow g also qualifies, since Fg sends 2 to 6, and f and g are the only arrows from A to B. Thus there are 2 morphisms in total, and the answer is verdict = yes; count = 2."
          - problem: "Let F be a covariant functor from a category C to Set. A student writes: Step 1: an object of the category of elements is a pair (C, x) with x an element of FC. Step 2: a morphism (C, x) -> (D, y) is a map f from C to D with Ff(y) = x. Step 3: the identity morphism on (C, x) is id_C, because F(id_C)(x) = x. Step 4: the composite of two morphisms is the composite of the underlying maps in C. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly states the objects as pairs (C, x) with x in FC. Step 3 is valid, since F(id_C)(x) = x holds for a covariant F, so id_C is indeed the identity morphism. Step 4 is valid, since identities and composition are inherited from C. Step 2 is the error: for a covariant F the condition must be Ff(x) = y, and the student reversed the variance, writing the presheaf condition instead. The answer is Step 2."
          - problem: "Write the full proof: for a covariant functor F from a category C to Set, the pairs (C, x) with x in FC, with morphisms (C, x) -> (D, y) given by maps f from C to D satisfying Ff(x) = y, form a category, and the projection sending (C, x) to C and each f to itself is a functor to C. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (identities): for each object (C, x), the map id_C satisfies F(id_C)(x) = x because F preserves identities, so id_C is a morphism (C, x) -> (C, x), and it acts as an identity since it does so in C. Step 2 (composition): if f gives a morphism (C, x) -> (D, y) and g gives a morphism (D, y) -> (E, z), then F(g after f)(x) = Fg(Ff(x)) = Fg(y) = z, because F preserves composition, so g after f gives a morphism (C, x) -> (E, z); associativity and unit laws are inherited from C, so the pairs form a category. Step 3 (projection): define the projection functor on objects by (C, x) -> C and on morphisms by f -> f; it preserves identities and composition because it leaves the underlying objects and maps of C unchanged. Hence the projection is a functor from the category of elements to C, which completes the proof."
      - id: kp2
        name: Representability via an initial element
        key_prerequisites: [universal-elements]
        constraints: "Match the initial object (covariant $F$) or terminal object (presheaf $F$) of $\\int F$ against the exists-unique clause of a universal element; a negative verdict must exhibit a specific object of $\\int F$ admitting no morphism from (or to) the candidate, using finite sets in $\\mathbf{Set}$."
        exemplars:
          - problem: "Let C be the poset 0 < 1, viewed as a category with a single arrow from 0 to 1 besides the identities. Let F be the covariant functor from C to Set with F(0) = {1}, F(1) = {2}, where the arrow from 0 to 1 acts by sending 1 to 2. The category of elements of F has the pairs (X, x) with x in F(X) as objects. Give the initial object of the category of elements as (object, element)."
            answer: "(0, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "List the objects of the category of elements: (0, 1) and (1, 2). Morphism rule: a morphism from (0, 1) to (1, 2) is an arrow k with (F k)(1) = 2, and the single arrow from 0 to 1 qualifies, so there is exactly one such morphism. Initial-object test: (0, 1) has the unique identity morphism to itself and exactly one morphism to (1, 2), so the exists-unique clause holds for every object. The answer is (0, 1)."
          - problem: "Let C be the poset 0 < 1 as a category, and let F be the presheaf on C with F(0) = {3}, F(1) = {4}, where the arrow from 0 to 1 acts by the function from F(1) to F(0) sending 4 to 3. In the category of elements of a presheaf, a morphism from (C, x) to (D, y) is an arrow f from C to D with (F f)(y) = x. Give the terminal object of the category of elements as (object, element)."
            answer: "(1, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "List the objects of the category of elements: (0, 3) and (1, 4). Morphism rule: a morphism from (0, 3) to (1, 4) is an arrow f from 0 to 1 with (F f)(4) = 3; the single arrow qualifies, so this morphism exists and is unique. Terminal-object test: (1, 4) receives exactly one morphism from each object, namely the identity from itself and the poset arrow from (0, 3). The answer is (1, 4)."
          - problem: "Let C be the poset 0 < 1 as a category, and let F be the covariant functor from C to Set with F(0) = {1}, F(1) = {2, 3}, where the arrow from 0 to 1 acts by sending 1 to 2. The pair (0, 1) is the only object of the category of elements lying over 0, so it is the only possible initial object. Determine whether F admits a representation, and give as (object, element) one object of the category of elements that admits no morphism from (0, 1)."
            answer: "verdict = nonrepresentable; witness = (1, 3)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["representable"], ["nonrepresentable"]]}, "name": "verdict"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "witness"}]}
            solution_sketch: "List the objects of the category of elements: (0, 1), (1, 2), (1, 3). Morphism rule: a morphism from (0, 1) to (1, x) needs an arrow k with (F k)(1) = x; the only arrow sends 1 to 2, so (1, 2) receives one morphism and (1, 3) receives none. Verdict by the initial-object criterion: the exists clause fails at (1, 3), so (0, 1) is not initial, the category of elements has no initial object, and F admits no representation. The answer is verdict = nonrepresentable; witness = (1, 3)."
          - problem: "Let F be the presheaf on the poset 0 < 1 with F(1) = {2, 3, 4}, F(0) = {5}, where the arrow from 0 to 1 acts by the function from F(1) to F(0) sending every element to 5. The pair (1, 2) is a candidate terminal object of the category of elements. How many objects of the category of elements admit no morphism to (1, 2)?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "List the objects of the category of elements: (0, 5), (1, 2), (1, 3), (1, 4). Terminal-object test: a morphism from (C, x) to (1, 2) is an arrow f from C to 1 with (F f)(2) = x. From (0, 5) the arrow from 0 to 1 works, since it sends 2 to 5; from (1, 2) the identity works; from (1, 3) and (1, 4) nothing works, since the only arrow from 1 to 1 is the identity, which sends 2 to 2. Count: 2 objects admit no morphism to the candidate, so the exists clause fails and (1, 2) is not terminal. The answer is 2."
          - problem: "Claim: a certain covariant functor F from the poset 0 < 1 to Set is representable, where F(0) = {7}, F(1) = {8, 9}, and the arrow from 0 to 1 acts by sending 7 to 8. Step 1: the only object of the category of elements over 0 is (0, 7), so the only candidate initial object is (0, 7). Step 2: the identity on 0 gives the unique morphism from (0, 7) to itself. Step 3: the arrow from 0 to 1 sends 7 to 8, so it gives a morphism from (0, 7) to every object over 1. Step 4: every object receives a unique morphism from (0, 7), so (0, 7) is initial and F is representable. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: (0, 7) is indeed the only object over 0. Step 2 is valid: the identity gives the unique morphism from (0, 7) to itself. Step 3 is the first invalid step: the arrow sends 7 to 8, so it yields a morphism to (1, 8), but none to (1, 9), and (1, 9) is an object over 1; the word 'every' is false. Step 4 inherits the error: the exists clause fails at (1, 9), so (0, 7) is not initial. The answer is Step 3."
          - problem: "Let B be the category with two objects a and b, the identity arrows, and exactly three further arrows f, g, h, each from a to b. Let F be the covariant functor from B to Set with F(a) = {1}, F(b) = {2, 3}, where each of f, g, h acts by sending 1 to 2. A student checks the exists clause for the candidate initial object (a, 1) and then examines the uniqueness clause for the object (b, 2). How many morphisms of the category of elements go from (a, 1) to (b, 2)?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "List the objects of the category of elements: (a, 1), (b, 2), (b, 3). Morphism rule: a morphism from (a, 1) to (b, 2) is any arrow k from a to b with (F k)(1) = 2; each of f, g, h qualifies, and they are three distinct arrows. Uniqueness clause: an initial object would need exactly one morphism to (b, 2), but there are 3, so (a, 1) is not initial and the category of elements has no initial object, so F admits no representation. The answer is 3."
          - problem: "Write the full proof: a covariant functor F from a small category C to Set is representable if and only if its category of elements has an initial object, and the initial objects are exactly the universal elements of F. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: an object of the category of elements is a pair (X, x) with x in F(X); a morphism from (X, x) to (Y, y) is an arrow h from X to Y with (F h)(x) = y. Step 1 (initial gives universal): let (A, u) be initial. For each element x of F(X), initiality gives a unique arrow h from A to X with (F h)(u) = x. Define a transformation from Hom(A, -) to F by sending h to (F h)(u); the unique-existence clause makes each component a bijection, and naturality in X holds because for any k from X to Y we get (F k)((F h)(u)) = (F(k h))(u). So F is isomorphic to Hom(A, -), and (A, u) is a universal element, hence a representation. Step 2 (universal gives initial): suppose F is isomorphic to Hom(A, -) by a natural isomorphism, and let u be the image of the identity on A. For each x in F(X), the inverse bijection and naturality give exactly one h from A to X with (F h)(u) = x, so there is exactly one morphism from (A, u) to (X, x) in the category of elements; hence (A, u) is initial. Conclusion: the initial objects are exactly the universal elements, so F is representable if and only if its category of elements has an initial object."
    diagnostic_exemplar:
      problem: "Let $P\\colon\\mathbf{Set}\\to\\mathbf{Set}$ be the covariant power-set functor ($P(S)=\\mathcal P(S)$, $P(f)(T)=f[T]$). Write down the objects and morphisms of its category of elements $\\int P$, and use the initial-object criterion to decide whether $P$ is representable. Justify your verdict."
      answer: "Objects of $\\int P$ are pairs $(S,T)$ with $S$ a set and $T\\subseteq S$; a morphism $(S,T)\\to(S',T')$ is a function $f\\colon S\\to S'$ with $P(f)(T)=f[T]=T'$; the projection $\\int P\\to\\mathbf{Set}$ forgets $T$. Criterion: $P$ is representable iff $\\int P$ has an initial object (an initial object is exactly a universal element). Suppose $(S_0,T_0)$ were initial. There must be a morphism $(S_0,T_0)\\to(\\varnothing,\\varnothing)$, i.e. a function $S_0\\to\\varnothing$, which forces $S_0=\\varnothing$ and hence $T_0=\\varnothing$. But then consider the object $(\\{*\\},\\{*\\})$: the only function $\\varnothing\\to\\{*\\}$ is the empty function, and its image is $\\varnothing\\neq\\{*\\}$, so there is no morphism $(S_0,T_0)\\to(\\{*\\},\\{*\\})$ at all. Hence $\\int P$ has no initial object and $P$ is not representable."
      solution_sketch: "Describe $\\int P$ as a set together with a distinguished subset, then apply the criterion that $P$ is representable iff $\\int P$ has an initial object. Testing a candidate against the object $(\\varnothing,\\varnothing)$ pins it down to $(\\varnothing,\\varnothing)$, and from there nothing maps to $(\\{*\\},\\{*\\})$ because the empty function has empty image."
    anki_seeds:
      - front: "Objects of the category of elements $\\int F$ (for $F\\colon\\mathcal C\\to\\mathbf{Set}$)?"
        back: "pairs $(C,x)$ with $x\\in FC$."
        type: basic
      - front: "A morphism $(C,x)\\to(C',x')$ in $\\int F$ (for $F\\colon\\mathcal C\\to\\mathbf{Set}$) is..."
        back: "a map $f\\colon C\\to C'$ with $Ff(x)=x'$."
        type: basic
      - front: "$F$ is representable iff $\\int F$ has an {{c1::initial object}} (the universal element)."
        back: "initial object"
        type: cloze

  - id: consequences-of-yoneda
    name: Consequences of Yoneda
    core: false
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: yoneda-embedding
        weight: 0.4
        key: true
      - id: yoneda-lemma
        weight: 0.4
        key: true
      - id: representable-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Uniqueness of adjoints
        key_prerequisites: [yoneda-lemma]
        constraints: "Chain hom-set bijections into a natural isomorphism of representables, then invoke full faithfulness of the Yoneda embedding; instances limited to free-forgetful adjunctions over $\\mathbf{Set}$, and 'canonically' must be cashed out as 'by a unique isomorphism compatible with the units, natural in the argument'."
        exemplars:
          - problem: "Apply the Yoneda uniqueness of left adjoints to $U\\colon\\mathbf{Mon}\\to\\mathbf{Set}$: deduce that any two constructions of 'the free monoid on $X$' are canonically isomorphic, and say what 'canonically' buys you."
            answer: "Any two left adjoints $F,F'$ of $U$ satisfy $FX\\cong F'X$ by a unique isomorphism compatible with the units, natural in $X$."
            solution_sketch: "Suppose $F$ and $F'$ are both left adjoint to $U$ — for instance words over $X$ and finite lists over $X$. For every monoid $M$ we get $\\mathrm{Hom}_{\\mathbf{Mon}}(FX,M)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UM)\\cong\\mathrm{Hom}_{\\mathbf{Mon}}(F'X,M)$, natural in $M$, so the two representable functors $\\mathrm{Hom}(FX,-)$ and $\\mathrm{Hom}(F'X,-)$ agree. The Yoneda embedding is fully faithful, so this natural isomorphism comes from a unique isomorphism $FX\\cong F'X$, and naturality in $X$ makes the family a natural isomorphism $F\\cong F'$. 'Canonically' means the comparison is the unique map matching the two insertions of generators, so no choice of basis, ordering, or normal form enters — the free monoid is well defined by its universal property alone."
          - problem: "Dually, use Yoneda to prove that right adjoints of $F$ are unique up to natural isomorphism."
            answer: "$\\mathrm{Hom}(-,GD)\\cong\\mathrm{Hom}(-,G'D)$ naturally; the contravariant Yoneda embedding gives $GD\\cong G'D$ naturally."
            solution_sketch: "If $F\\dashv G$ and $F\\dashv G'$, then for all $C,D$: $\\mathrm{Hom}(C,GD)\\cong\\mathrm{Hom}(FC,D)\\cong\\mathrm{Hom}(C,G'D)$, natural in $C$. So $\\mathrm{Hom}(-,GD)\\cong\\mathrm{Hom}(-,G'D)$ as presheaves; since the contravariant Yoneda embedding is fully faithful, $GD\\cong G'D$ by a unique isomorphism, natural in $D$. Hence $G\\cong G'$."
      - id: kp2
        name: Cayley's theorem as a shadow of Yoneda
        key_prerequisites: [yoneda-embedding]
        constraints: "The one-object Yoneda embedding for a monoid or a group: give the map $m\\mapsto(x\\mapsto mx)$ explicitly, deduce injectivity by evaluating at the unit, and name the target ($\\mathrm{End}(M)$ for a monoid, $\\mathrm{Sym}(G)$ for a group)."
        exemplars:
          - problem: "Let M be the two-element monoid with elements 1 and 0, where 1 is the unit and 0 times any element gives 0. The one-object Yoneda embedding sends m to the function L_m with L_m(x) = mx, a member of End(M). Give the list of values L_0(1), L_0(0), in that order."
            answer: "0, 0"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The embedding sends m to the function L_m with L_m(x) = mx on M, so the full object is L_0, the function x maps to 0x. Apply the monoid rule that 0 times any element gives 0: L_0(1) = 0 and L_0(0) = 0. The list of values is 0, 0."
          - problem: "Let G be the cyclic group with elements 0, 1, 2, 3, 4 under addition mod 5. The one-object Yoneda embedding sends g to the permutation L_g with L_g(x) = x + g, a member of Sym(G). Give the list of values L_2(0), L_2(1), L_2(2), L_2(3), L_2(4), in that order."
            answer: "2, 3, 4, 0, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The embedding sends g to the permutation L_g with L_g(x) = x + g, so the full object is L_2, the shift of the whole group by 2. Apply addition mod 5 to each input: L_2(0) = 2, L_2(1) = 3, L_2(2) = 4, L_2(3) = 0, L_2(4) = 1. The list of values is 2, 3, 4, 0, 1."
          - problem: "In the cyclic group with elements 0, 1, 2, 3 under addition mod 4, the embedding sends g to L_g with L_g(x) = x + g, a permutation in Sym(G). Applying L_2 a total of k times sends x to x + 2k. Give the smallest positive k for which L_2 applied k times is the identity permutation."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "L_2 sends x to x + 2 mod 4, and applied k times it sends x to x + 2k mod 4. The shift fixes every element exactly when 4 divides 2k, and the smallest positive such k is 2, which is the order of the element 2. The answer is 2."
          - problem: "In the cyclic group with elements 0, 1, 2, 3, 4, 5 under addition mod 6, the embedding sends g to L_g with L_g(x) = x + g in Sym(G). The composite L_3(L_4(x)) equals L_g(x) for exactly one element g of the group. Give g."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compose the two shifts: L_3(L_4(x)) = (x + 4) + 3 = x + 7. Reduce mod 6: x + 7 = x + 1, so the composite is L_1. This is the homomorphism rule, the composite of L_a after L_b is L_{a+b}, which the embedding inherits from composition. The answer is 1."
          - problem: "Claim: for a group G with identity e, the map sending g to L_g with L_g(x) = gx into Sym(G) is one-to-one. Step 1: assume L_g = L_h. Step 2: evaluate at e. Step 3: this gives L_g(e) = ge = g and L_h(e) = h, so g = h. Step 4: therefore the map is onto Sym(G). Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: assuming the two images are equal is the correct setup for one-to-one. Step 2 is valid: evaluating at the unit e is exactly the Yoneda argument. Step 3 is valid: L_g(e) = ge = g and L_h(e) = h, so g = h follows. Step 4 is not valid: g = h shows the map is one-to-one, not that it is onto, and for a group with three elements Sym(G) has six members but only three maps L_g. The answer is Step 4."
          - problem: "A monoid M has unit e. The Yoneda map sends each m to L_m, where L_m(x) = mx lies in End(M). To see it is one-to-one, suppose L_m and L_n are equal as functions. A line is missing before the conclusion that the elements agree. Select the missing line."
            answer: "Evaluate at e: L_m(e) = me = m and L_n(e) = ne = n, so m = n"
            answer_contract: {"kind": "label", "options": [["Evaluate at e: L_m(e) = me = m and L_n(e) = ne = n, so m = n"], ["Count how many members M has and compare sizes"], ["Check L_m maps M onto M without fail"], ["Compose L_m with L_n and test if e comes out"]]}
            solution_sketch: "The Yoneda argument evaluates at the unit: L_m(e) = me = m and L_n(e) = ne = n, so if the two functions are equal, evaluation at e forces m = n. The option 'Count how many members M has and compare sizes' errs: sizes cannot decide whether two functions agree at every input. The option 'Check L_m maps M onto M without fail' errs: onto is not the issue, and left multiplication by a non-unit is not onto. The option 'Compose L_m with L_n and test if e comes out' errs: the composite is L_{nm} and tests nothing about equality of L_m and L_n. The answer is Evaluate at e: L_m(e) = me = m and L_n(e) = ne = n, so m = n."
          - problem: "Write the full proof: for a monoid M with unit e, the map sending m to L_m with L_m(x) = mx is an injective monoid homomorphism from M to End(M), and it is the one-object Yoneda embedding. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: regard M as a category with one object, whose morphisms are the elements of M and whose composition is the monoid product. Step 2: by the Yoneda embedding, which is fully faithful, the map from M to the endomorphisms of the single representable presheaf is injective; concretely it sends m to post-composition, which is L_m with L_m(x) = mx, a member of End(M). Step 3: homomorphism: for every x, L_{mn}(x) = (mn)x = m(nx) = L_m(L_n(x)), so L_{mn} = L_m after L_n, and L_e(x) = ex = x, so L_e is the identity function. Step 4: injectivity by evaluation at the unit: if L_m = L_n, then L_m(e) = me = m and L_n(e) = ne = n give m = n. Conclusion: m maps to L_m is an injective monoid homomorphism M to End(M), which is Cayley's theorem for monoids as the one-object case of Yoneda."
    diagnostic_exemplar:
      problem: "Let $G\\colon\\mathcal D\\to\\mathcal C$ have two left adjoints, $F\\dashv G$ and $F'\\dashv G$. Use the Yoneda embedding to prove that $F\\cong F'$ by a natural isomorphism, saying exactly which property of the embedding you use."
      answer: "For every object $C$ of $\\mathcal C$ chain the two adjunction bijections: $\\mathrm{Hom}_{\\mathcal D}(FC,D)\\cong\\mathrm{Hom}_{\\mathcal C}(C,GD)\\cong\\mathrm{Hom}_{\\mathcal D}(F'C,D)$, and each is natural in $D$, so the composite is a natural isomorphism of covariant representables $\\mathrm{Hom}(FC,-)\\cong\\mathrm{Hom}(F'C,-)$. The covariant Yoneda embedding $A\\mapsto\\mathrm{Hom}(A,-)$ is fully faithful (Yoneda lemma applied at a second representable), and a fully faithful functor reflects isomorphisms; therefore $FC\\cong F'C$, by the unique isomorphism $\\theta_C$ corresponding to the identity under the chained bijections. Both adjunction bijections are also natural in $C$, so for $c\\colon C\\to C'$ the square $\\theta_{C'}\\circ Fc=F'c\\circ\\theta_C$ commutes; the $\\theta_C$ are therefore the components of a natural isomorphism $F\\cong F'$. Left adjoints of $G$ are unique up to natural isomorphism."
      solution_sketch: "Chain the two adjunction bijections to get a natural isomorphism of covariant representables $\\mathrm{Hom}(FC,-)\\cong\\mathrm{Hom}(F'C,-)$; the property used is that the Yoneda embedding is fully faithful and hence reflects isomorphisms. Naturality of the same bijections in $C$ makes the resulting isomorphisms the components of one natural isomorphism."
    anki_seeds:
      - front: "Yoneda corollary: adjoints are unique up to..."
        back: "natural isomorphism (their representables agree, so Yoneda identifies them)."
        type: basic
      - front: "Cayley's theorem is a special case of {{c1::the Yoneda embedding}} being fully faithful."
        back: "the Yoneda embedding"
        type: cloze
