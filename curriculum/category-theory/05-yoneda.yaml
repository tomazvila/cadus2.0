    knowledge_points:
      - id: kp1
        name: Definition of representability
        key_prerequisites: [hom-functors]
        constraints: "Construct the representing object and natural isomorphism for Id_Set, and distinguish representable variance by composition. A component-count obstruction must test the representation itself."
        exemplars:
          - problem: "A finite set R is proposed to represent the identity functor on Set covariantly. Use the requirement that Hom(R,X)->X be a bijection for every finite set X to determine |R|. Give its value; the representation is not supplied."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The representing condition tests all components; already a two-point target forces exactly one point in R. Evaluation at that point supplies the natural bijection. The result is 1."
          - problem: "Construct the natural representation of Id_Set by R={s}. At X={3,5,7}, enumerate Hom(R,X) as h1(s)=3,h2(s)=5,h3(s)=7. Recover the component of the representation compatible with every function from R to X. Give its values on h1,h2,h3."
            answer: "3, 5, 7"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Evaluate the universal point at each arrow from R. This reconstructs the component rather than assuming an evaluation rule. The result is 3, 5, 7."
          - problem: "Match the representable functors associated with an object A to their arrow actions along f:X->Y. Tasks: (a) Hom(A,-), (b) Hom(-,A). Bank: 1=postcompose Hom(A,X)->Hom(A,Y); 2=precompose Hom(Y,A)->Hom(X,A); 3=postcompose Hom(X,A)->Hom(Y,A). Give the two bank numbers."
            answer: "1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Composition determines variance: Hom(A,-) postcomposes and Hom(-,A) precomposes. The result is 1, 2."
          - problem: "A student claims that the identity functor on Set, a covariant case, is represented by the two-point set {u, v}, through a natural isomorphism b: Hom({u, v}, -) => Id whose component at a set X is a bijection from Hom({u, v}, X) to X. Give the smallest number of elements of a set X for which that component cannot be a bijection."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the component b_X from Hom({u, v}, X) to X. Rule of counting functions: a function from {u, v} to X chooses an image of u and an image of v, so the hom-set has as many elements as the size of X, squared. For the empty set and for a singleton the two sizes agree, so a bijection can exist, but for a set with 2 elements the hom-set has 4 elements against 2, so no bijection is possible. The smallest number of elements is 2; the answer is 2."
          - problem: "A proposal says empty represents Id_Set. Step 1: Hom(empty,X) is a singleton for every X. Step 2: that singleton is bijective to X for every X. Step 3: the bijections can form a representation. Step 4: empty is a representing object. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The component at X=empty would map a singleton bijectively to an empty set, which is impossible. This is the first unsupported step."
          - problem: "Construct the inverse component X->Hom({s},X) in the covariant representation of Id_Set. For X={2,4}, function bank 1=h(s)=4; 2=h(s)=2. Give the function numbers assigned to 2 and 4."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The inverse representation assigns to each x the unique function from the singleton selecting x. The result is 2, 1."
          - problem: "Write the full proof: the identity functor Id: Set → Set is representable, covariantly, represented by the one-point set {s} with a natural isomorphism a: Hom({s}, -) => Id. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the component): for each set X define a_X from Hom({s}, X) to X by sending a function f to f(s). Step 2 (bijection): a function from {s} to X is determined by the image of s, so a_X is injective; and for each element x of X the function that sends s to x maps to x, so a_X is surjective. Step 3 (naturality): for any g from X to Y and any f from {s} to X, the component at Y applied to g ∘ h equals g(f(s)), which equals g applied to a_X(f), so the naturality square with Hom({s}, g) and g commutes. Step 4 (conclusion): a is a natural isomorphism from Hom({s}, -) to Id, so the pair ({s}, a) is a representation and the identity functor on Set is representable, covariantly."
      - id: kp2
        name: Recognizing representable functors
        key_prerequisites: [natural-isomorphisms, free-groups-presentations]
        constraints: "Recognize when a free object on one generator represents a forgetful functor from Mon, Grp or Ab. Establish unique extension of generator images and naturality in the target; distinguish additional relations that obstruct freeness. Closed items may construct the categorical object or diagnose assertions whose validity the learner must determine; the unmarked item asks for a full proof. Candidate claims must not be endorsed or explained by the stem."
        exemplars:
          - problem: "For the forgetful functor U:Mon->Set, let R be N under addition. A proposed representation uses h->h(1). Step 1: a homomorphism R->A is determined by h(1). Step 2: for every object A of Mon, each element a in U(A) is the image h(1) of a homomorphism R->A. Step 3: this gives bijections Hom(R,A)->U(A), natural in A by postcomposition. Step 4: R represents U. Audit the numbered assertions: does each follow from the stated data and previous justified assertions? Supply any algebra or logical deductions needed to check them. Give verdict = valid or invalid; step = the first assertion that does not follow, or 0 if they all follow."
            answer: "verdict = valid; step = 0"
            answer_contract: {"kind": "multipart", "parts": [{"name": "verdict", "contract": {"kind": "label", "options": [["valid"], ["invalid"]]}}, {"name": "step", "contract": {"kind": "exact"}}]}
            solution_sketch: "The free object on one generator permits every target element as a generator image and forces a unique extension. Postcomposition commutes with evaluation at the generator, proving naturality. The first unjustified step is 0; 0 means that all steps are justified."
          - problem: "For the forgetful functor U:Mon->Set, let R be the cyclic group Z/2Z, regarded as an object of Mon. A proposed representation uses h->h(1). Step 1: a homomorphism R->A is determined by h(1). Step 2: for every object A of Mon, each element a in U(A) is the image h(1) of a homomorphism R->A. Step 3: this gives bijections Hom(R,A)->U(A), natural in A by postcomposition. Step 4: R represents U. Audit the numbered assertions: does each follow from the stated data and previous justified assertions? Supply any algebra or logical deductions needed to check them. Give verdict = valid or invalid; step = the first assertion that does not follow, or 0 if they all follow."
            answer: "verdict = invalid; step = 2"
            answer_contract: {"kind": "multipart", "parts": [{"name": "verdict", "contract": {"kind": "label", "options": [["valid"], ["invalid"]]}}, {"name": "step", "contract": {"kind": "exact"}}]}
            solution_sketch: "A map out of the cyclic object must preserve its defining relation. In the target cyclic group of order 3, the generator 1 does not satisfy 2 times 1=0, so evaluation is not surjective. Determination by the generator alone does not prove representability. The first unjustified step is 2; 0 means that all steps are justified."
