          - problem: "Write the full proof: the forgetful functor $U\\colon\\mathbf{Mon}\\to\\mathbf{Set}$ is representable, with representing object the free monoid $\\mathbb{N}$ on one generator. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the map): for each monoid $M$ define $\\varphi_M\\colon\\mathrm{Hom}_{\\mathbf{Mon}}(\\mathbb{N},M)\\to U(M)$ by $\\varphi_M(f)=f(1)$, the image of the generator. Step 2 (determined by the generator): if $f(1)=g(1)$, then $f(0)=e=g(0)$ and $f(n)=f(1)^n=g(1)^n=g(n)$ for every $n\\ge 0$, so $f=g$ and $\\varphi_M$ is injective. Step 3 (free on the image): for any $m\\in M$ set $f_m(n)=m^n$; then $f_m(0)=e$ and $f_m(k+l)=m^{k+l}=m^k m^l=f_m(k)f_m(l)$, so $f_m$ is a monoid homomorphism with $\\varphi_M(f_m)=m$, and $\\varphi_M$ is surjective. Step 4 (naturality in the target): for every monoid homomorphism $h\\colon M\\to P$, $\\varphi_P(h\\circ f)=(h\\circ f)(1)=h(f(1))=U(h)(\\varphi_M(f))$, so the square commutes and $\\varphi$ is natural. Step 5 (conclusion): $\\varphi$ is a natural isomorphism $U\\cong\\mathrm{Hom}_{\\mathbf{Mon}}(\\mathbb{N},-)$, so $U$ is representable, represented by $\\mathbb{N}$, the free monoid on one generator."
      - id: kp3
        name: Uniqueness of the representing object
        key_prerequisites: [universal-properties]
        constraints: "Recover comparison maps from identity components and derive their action by naturality. Prove inverse equations by evaluating the inverse natural transformations; use whole component tests to reject false uniqueness arguments."
        exemplars:
          - problem: "Let theta:Hom(A,-)=>Hom(B,-) be a natural isomorphism for A={1,2},B={3,4}. Its inverse at B sends 1_B to f with f(1)=4,f(2)=3. Recover g=theta_A(1_A) by the identity-chasing uniqueness proof. Give g(3)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: f: A -> B with f(1) = 4, f(2) = 3, and the identities f o g = 1_B and g o f = 1_A that the proof obtains by evaluating the naturality formula at the two identities. Rule of the proof: the naturality formula theta_X(h) = h o g, chased at 1_B and 1_A, makes f and g mutually inverse. Hence g is the inverse function of f, sending 3 to 2 and 4 to 1. The answer is 2."
          - problem: "Let theta:Hom(-,A)=>Hom(-,B) be a natural isomorphism with A=B={1,2,3}. The identity value theta_A(1_A) is f=[2,3,1]. Recover theta inverse_B(1_B) from naturality and the two inverse component equations. Give its value at 1."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: f: A -> B with f(1) = 2, f(2) = 3, f(3) = 1, and the identities f o g = 1_B and g o f = 1_A. Rule of the contravariant proof: the naturality formula theta_X(k) = f o k, chased at the two identities, makes the comparison maps mutually inverse. Hence g is the inverse function of f, and since f(3) = 1, the inverse sends 1 back to 3. The answer is 3."
          - problem: "Let theta:Hom(A,-)=>Hom(B,-) be natural. Take A=B={1,2},X={1,2,3}. The identity value theta_A(1_A) has list [2,1], and h:A->X has list [1,3]. Derive theta_X(h) using naturality at h. Give its value at 2."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: g: B -> A with g(1) = 2, g(2) = 1, and h: A -> X with h(1) = 1, h(2) = 3. Rule: naturality of theta at h, applied to 1_A, gives theta_X(h) = h o g. Compose in that order: the element 2 of B goes first to g(2) = 1, then to h(1) = 1. The answer is 1."
          - problem: "A proof of uniqueness of representing objects assumes only objectwise bijections Hom(A,X)~Hom(B,X). Test this assumption in the category with two objects A,B: endomorphisms are nonnegative integer costs (identity 0), cross-object arrows are positive integer costs, and composition adds costs. Every Hom set is countably infinite. Give (a) whether the objectwise bijections exist; (b) whether A,B are isomorphic; (c) whether these bijections can form a natural isomorphism. Use three bits."
            answer: "1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Objectwise cardinalities do not supply a natural representation. Identity-chasing would make the comparison arrows inverse, but any two cross arrows have positive composite cost, so no natural isomorphism exists. The result is 1, 0, 0."
          - problem: "For theta:Hom(A,-)=>Hom(B,-) a natural isomorphism, Step 1: g=theta_A(1_A) has type B->A. Step 2: f=theta inverse_B(1_B) has type A->B. Step 3: naturality gives theta_B(f)=g after f. Step 4: use inverse components to conclude g after f=1_B. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Naturality gives theta_B(f)=f after g, an endomorphism of B. The order is essential in recovering inverse comparisons. This is the first unsupported step."
          - problem: "In the one-object category Z/5, theta:Hom(*,-)=>Hom(*,-) is a natural isomorphism whose identity component sends 0 to 2. Recover its complete component and the complete component of its inverse by the identity-naturality proof of uniqueness of representers. Give the two value lists in order. No composition formula for theta is supplied."
            answer: "2, 3, 4, 0, 1, 3, 4, 0, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality with each arrow acting on the identity forces every component value. The inverse transformation is then recovered and its two composites evaluated at identities to obtain inverse representing arrows. The result is 2, 3, 4, 0, 1, 3, 4, 0, 1, 2."
          - problem: "Write the full proof: if Hom(A, -) is naturally isomorphic to Hom(B, -), then A is isomorphic to B. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let theta: Hom(A, -) -> Hom(B, -) be a natural isomorphism. Step 1, comparison maps: set g = theta_A(1_A): B -> A and f = theta^{-1}_B(1_B): A -> B. Step 2, naturality formula: for any arrow h: A -> X, naturality of theta at h applied to 1_A gives theta_X(h) = theta_X(h o 1_A) = h o theta_A(1_A) = h o g; the same argument for theta^{-1} gives theta^{-1}_X(k) = k o f for any k: B -> X. Step 3, evaluate at the two identities: with X = B and h = f, the formula gives theta_B(f) = f o g, while f = theta^{-1}_B(1_B) gives theta_B(f) = 1_B, so f o g = 1_B; with X = A and k = g, the inverse formula gives theta^{-1}_A(g) = g o f, while g = theta_A(1_A) gives theta^{-1}_A(g) = 1_A, so g o f = 1_A. Conclusion: f and g are mutually inverse isomorphisms, so A is isomorphic to B, and a representing object is unique up to isomorphism."
    diagnostic_exemplar:
      problem: "Prove that the forgetful functor $U\\colon\\mathbf{Ab}\\to\\mathbf{Set}$ is representable, naming the representing object and the natural isomorphism, and prove that any two representing objects for $U$ are isomorphic."
      answer: "Representability: $\\mathbb Z$ is the free abelian group on one generator, so a homomorphism $\\varphi\\colon\\mathbb Z\\to A$ is determined by $\\varphi(1)$, which may be any element of $A$. Hence $\\theta_A\\colon\\mathrm{Hom}_{\\mathbf{Ab}}(\\mathbb Z,A)\\to UA$, $\\varphi\\mapsto\\varphi(1)$, is a bijection, and it is natural in $A$: for $f\\colon A\\to B$, $\\theta_B(f\\circ\\varphi)=f(\\varphi(1))=Uf(\\theta_A(\\varphi))$. So $U\\cong\\mathrm{Hom}_{\\mathbf{Ab}}(\\mathbb Z,-)$ with representing object $\\mathbb Z$. Uniqueness: suppose $\\mathrm{Hom}(A,-)\\cong U\\cong\\mathrm{Hom}(B,-)$, so there is a natural isomorphism $\\psi\\colon\\mathrm{Hom}(A,-)\\Rightarrow\\mathrm{Hom}(B,-)$. Put $g=\\psi_A(1_A)\\colon B\\to A$ and $f=\\psi_B^{-1}(1_B)\\colon A\\to B$. Naturality of $\\psi$ at $h\\colon A\\to X$ applied to $1_A$ gives $\\psi_X(h)=h\\circ g$, and likewise $\\psi^{-1}_X(k)=k\\circ f$. Taking $X=B$, $h=f$: $f\\circ g=\\psi_B(f)=\\psi_B(\\psi_B^{-1}(1_B))=1_B$; taking $X=A$, $k=g$: $g\\circ f=\\psi^{-1}_A(g)=\\psi^{-1}_A(\\psi_A(1_A))=1_A$. So $A\\cong B$: the representing object is unique up to isomorphism."
      solution_sketch: "For representability use that $\\mathbb Z$ is free on one generator, so $\\varphi\\mapsto\\varphi(1)$ is a bijection and naturality says evaluation at $1$ commutes with post-composition. For uniqueness, feed the identities through the natural isomorphism: $\\psi_A(1_A)$ and $\\psi_B^{-1}(1_B)$ are the mutually inverse maps."
    anki_seeds:
      - front: "A representable functor is..."
        back: "a functor naturally isomorphic to some hom-functor $\\mathrm{Hom}(A,-)$ (covariant) or $\\mathrm{Hom}(-,A)$ (contravariant)."
        type: basic
      - front: "Representing objects are unique up to {{c1::isomorphism}}."
        back: "isomorphism"
        type: cloze

