    knowledge_points:
      - id: kp1
        name: Proof of the bijection
        key_prerequisites: [natural-transformations]
        constraints: "Verify both directions of the Yoneda bijection by identity evaluation and the naturality square applied to an identity. Construct missing components or proof paths instead of evaluating an explicitly supplied reconstruction formula."
        step_check:
          step: 'Apply that equation to $1_A$'
          question: 'Why do we apply the naturality equation to the identity $1_A$?'
          options:
            - 'Because $1_A$ is the only element of $\mathrm{Hom}(A,A)$ on which $\alpha_A$ is defined'
            - 'Because $h=h\circ 1_A$, so the equation turns $\alpha_X(h)$ into $(Fh)(\alpha_A(1_A))$'
            - 'Because $F(1_A)=1_{FA}$, which makes the two sides of the equation equal'
            - 'Because the identity commutes with $h$, so the naturality square can be skipped'
          answer: 'Because $h=h\circ 1_A$, so the equation turns $\alpha_X(h)$ into $(Fh)(\alpha_A(1_A))$'
          why: 'Since $h=h\circ 1_A$, the naturality equation at $1_A$ gives $\alpha_X(h)=(Fh)(\alpha_A(1_A))$.'
        exemplars:
          - problem: 'Let $\mathcal C$ have objects $1$ and $2$, their identities and one other morphism $s\colon 1\to 2$. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(1)=\{0,1,2\}$, $F(2)=\{0,1,\dots,6\}$ and $F(s)(x)=2x+1$. The element $u=2$ of $F(1)$ corresponds to a natural transformation $\Theta\colon\mathrm{Hom}(1,-)\Rightarrow F$. What is $\Theta_2(s)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transformation matched with $u$ satisfies $\Theta_1(1_1)=u$. Naturality along $s$ at $1_1$ gives $\Theta_2(s)=F(s)(u)$. So $\Theta_2(s)=2\cdot 2+1=5$.'
          - problem: 'Let $\mathcal C$ have objects $1$ and $2$, their identities and one other morphism $s\colon 1\to 2$. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(1)=\{0,1,2,3\}$, $F(2)=\{0,1,\dots,9\}$ and $F(s)(x)=3x$. A natural transformation $\alpha\colon\mathrm{Hom}(1,-)\Rightarrow F$ has $\alpha_1(1_1)=1$. What is $\alpha_2(s)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality of $\alpha$ along $s$, applied to $1_1$, gives $\alpha_2(s)=F(s)(\alpha_1(1_1))$. So $\alpha_2(s)=F(s)(1)=3\cdot 1=3$.'
          - problem: 'Let $\mathcal M$ be the category with one object $*$ whose morphisms are the elements of $\mathbb{Z}/4$, with composition given by addition. Let $F\colon\mathcal M\to\mathbf{Set}$ send $*$ to $\mathbb{Z}/4$ and a morphism $r$ to the function $x\mapsto x+r$. A natural transformation $\alpha\colon\mathrm{Hom}(*,-)\Rightarrow F$ has $\alpha_*(1)=3$. What is $\alpha_*(3)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality gives $\alpha_*(r)=F(r)(\alpha_*(0))=\alpha_*(0)+r$ for every morphism $r$. From $\alpha_*(1)=3$ we get $\alpha_*(0)=2$. Then $\alpha_*(3)=2+3=5$, which is 1 in $\mathbb{Z}/4$.'
          - problem: 'Let $\mathcal C$ be the category with objects $a$, $b$, their identities and one other morphism $t\colon a\to b$. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(a)=\{0,1,2\}$, $F(b)=\{0,1\}$ and $F(t)$ sending $0$ to $0$, $1$ to $0$ and $2$ to $1$. How many natural transformations $\alpha\colon\mathrm{Hom}(a,-)\Rightarrow F$ satisfy $\alpha_b(t)=0$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each natural transformation is fixed by $u=\alpha_a(1_a)$ in $F(a)$, and then $\alpha_b(t)=F(t)(u)$. The map $F(t)$ sends 0 and 1 to 0, and it sends 2 to 1. So $u=0$ or $u=1$, which gives 2 natural transformations.'
          - problem: 'Let $\mathcal C$ be the category with objects $a$, $b$, their identities and one other morphism $t\colon a\to b$. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(a)=\{0,1\}$, $F(b)=\{0,1,2\}$ and $F(t)$ sending $0$ to $2$ and $1$ to $0$. Two natural transformations $\alpha,\beta\colon\mathrm{Hom}(a,-)\Rightarrow F$ have $\alpha_b(t)=\beta_b(t)$. Must $\alpha=\beta$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes they are equal", "they must be equal", "equal", "yes they must be equal", "they are equal"], ["no", "not necessarily", "they need not be equal", "they can differ", "no they can differ", "no not necessarily", "alpha need not equal beta"]]}
            solution_sketch: 'Each natural transformation is fixed by $u=\alpha_a(1_a)$, and $\alpha_b(t)=F(t)(u)$. The map $F(t)$ is injective, since it sends 0 and 1 to the different values 2 and 0. So equal values at $t$ force equal $u$, and hence $\alpha=\beta$.'
          - problem: 'Let $\mathcal C$ be the category with objects $1,2,3$, morphisms $s\colon 1\to 2$ and $t\colon 2\to 3$, their composite $t\circ s\colon 1\to 3$ and the identities. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(1)=\{0,1,2,3\}$, $F(2)=\{0,1,\dots,6\}$ and $F(3)=\{0,1,\dots,9\}$, with $F(s)(x)=2x$ and $F(t)(y)=y+3$. The element $u=2$ of $F(1)$ corresponds to a natural transformation $\Theta\colon\mathrm{Hom}(1,-)\Rightarrow F$. What is $\Theta_3(t\circ s)$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By naturality and functoriality, $\Theta_3(t\circ s)=F(t\circ s)(u)=F(t)(F(s)(u))$. Here $F(s)(2)=4$ and $F(t)(4)=7$. So $\Theta_3(t\circ s)=7$.'
          - problem: 'Write the full proof that for a functor $F\colon\mathcal C\to\mathbf{Set}$ and an object $A$, the maps $\Psi(\alpha)=\alpha_A(1_A)$ and $\Theta(u)_X(h)=(Fh)(u)$ are mutually inverse and $\Theta(u)$ is natural, so that the natural transformations from $\mathrm{Hom}(A,-)$ to $F$ are in bijection with the elements of $F(A)$.'
            answer: 'Psi and Theta are inverse bijections'
            answer_contract: {"kind": "none"}
            solution_sketch: 'For $u\in F(A)$ and $k\colon X\to Y$, we have $F(k)(\Theta(u)_X(h))=F(k\circ h)(u)=\Theta(u)_Y(k\circ h)$ by the composition law of $F$, so $\Theta(u)$ is natural. Then $\Psi(\Theta(u))=(F1_A)(u)=u$ by the identity law $F(1_A)=1_{FA}$. For a natural $\alpha$ and $h\colon A\to X$, naturality at $h$ applied to $1_A$ gives $\alpha_X(h)=(Fh)(\alpha_A(1_A))=\Theta(\Psi(\alpha))_X(h)$. Both round trips are identities, so $\Psi$ and $\Theta$ are inverse bijections.'
      - id: kp2
        name: Naturality of the Yoneda isomorphism
        key_prerequisites: [functor-categories]
        constraints: "Construct the induced maps in both naturality squares of the Yoneda bijection, keeping variance explicit. Grade their typed paths or reconstructed expressions, not only an evaluation after the routes are supplied."
        step_check:
          step: 'The composite $\phi\circ\alpha$ has components $(\phi\circ\alpha)_X=\phi_X\circ\alpha_X$'
          question: 'Why does $(\phi\circ\alpha)_A(1_A)$ equal $\phi_A(\alpha_A(1_A))$?'
          options:
            - 'Because $\phi_A$ is applied to the identity $1_A$ first and $\alpha_A$ is applied afterwards'
            - 'Because $\phi$ is natural, so it commutes with every transformation out of $\mathrm{Hom}(A,-)$'
            - 'Because composites of natural transformations are formed one component at a time'
            - 'Because $\Psi_{F''}$ is defined as evaluation at $1_A$, which forces this equality by definition'
          answer: 'Because composites of natural transformations are formed one component at a time'
          why: 'A composite of natural transformations is formed one component at a time, so its $A$-component is $\phi_A\circ\alpha_A$.'
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1\}$ and let $s\colon A\to A$ swap $0$ and $1$. Let $F=\mathrm{Hom}(A,-)$, let $F''=\mathrm{Hom}(A,-)\times\mathrm{Hom}(A,-)$, and let $\phi\colon F\Rightarrow F''$ be given by $\phi_X(h)=(h,h)$. Let $\alpha\colon\mathrm{Hom}(A,-)\Rightarrow F$ be the natural transformation with $\alpha_X(h)=s\circ h$. The composite $\phi\circ\alpha$ is a natural transformation $\mathrm{Hom}(A,-)\Rightarrow F''$, so $(\phi\circ\alpha)_A(1_A)$ is a pair of functions $A\to A$. What is the value at $0$ of the first function in this pair?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The components of a composite are composed, so $(\phi\circ\alpha)_A(1_A)=\phi_A(\alpha_A(1_A))$. Here $\alpha_A(1_A)=s\circ 1_A=s$, so the pair is $\phi_A(s)=(s,s)$. The first function is $s$, and $s(0)=1$.'
          - problem: 'In $\mathbf{Set}$ let $A=\{1,2\}$, $B=\{1,2,3\}$, and let $g\colon A\to B$ be given by $g(1)=3$ and $g(2)=1$. Let $F(X)=X\times X$ with $F(h)(x,y)=(h(x),h(y))$, and let $\alpha\colon\mathrm{Hom}(A,-)\Rightarrow F$ be the natural transformation with $\alpha_A(1_A)=(1,2)$. Precomposing $\alpha$ with the natural transformation $\mathrm{Hom}(B,-)\Rightarrow\mathrm{Hom}(A,-)$ induced by $g$ gives a transformation $\mathrm{Hom}(B,-)\Rightarrow F$. Which element of $F(B)$ corresponds to it by the Yoneda lemma?'
            answer: '(3, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The induced transformation $\mathrm{Hom}(B,-)\Rightarrow\mathrm{Hom}(A,-)$ sends $k$ to $k\circ g$, so the Yoneda element of the composite is $\alpha_B(1_B\circ g)=\alpha_B(g)$. By naturality $\alpha_B(g)=F(g)(\alpha_A(1_A))=F(g)(1,2)$. This equals $(g(1),g(2))=(3,1)$.'
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1,2\}$ and let $p\colon A\to A$ be given by $p(0)=1$, $p(1)=2$ and $p(2)=0$. Let $\alpha\colon\mathrm{Hom}(A,-)\Rightarrow\mathrm{Hom}(A,-)$ be the transformation $\alpha_X(h)=h\circ p$, and let $\sigma\colon\mathrm{Hom}(A,-)\Rightarrow\mathrm{Id}$ be given by $\sigma_X(h)=h(2)$. The composite $\sigma\circ\alpha\colon\mathrm{Hom}(A,-)\Rightarrow\mathrm{Id}$ corresponds by the Yoneda lemma to an element of $A$. Which element?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The Yoneda element of the composite is $(\sigma\circ\alpha)_A(1_A)=\sigma_A(\alpha_A(1_A))$. Here $\alpha_A(1_A)=1_A\circ p=p$, so the element is $\sigma_A(p)=p(2)=0$.'
          - problem: 'In $\mathbf{Set}$ let $A=\{1,2\}$, $B=\{1,2,3\}$, $C=\{1,2\}$, and let $g\colon A\to B$ and $k\colon B\to C$ be given by $g(1)=3$, $g(2)=1$, $k(1)=2$, $k(2)=1$, $k(3)=2$. Let $F(X)=X\times X$ with $F(h)(x,y)=(h(x),h(y))$, and let $\alpha\colon\mathrm{Hom}(A,-)\Rightarrow F$ have $\alpha_A(1_A)=(1,2)$. What is $\alpha_C(k\circ g)$?'
            answer: '(2, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'By naturality $\alpha_C(k\circ g)=F(k\circ g)(\alpha_A(1_A))=F(k\circ g)(1,2)$. This equals $(k(g(1)),k(g(2)))$. Since $g(1)=3$ and $g(2)=1$, we get $(k(3),k(1))=(2,2)$.'
          - problem: 'Let $g\colon A\to B$ be a morphism and let $\alpha\colon\mathrm{Hom}(A,-)\Rightarrow F$ be a natural transformation, where $F\colon\mathcal C\to\mathbf{Set}$. Which of the following is defined and equals $\alpha_B(g)$: (i) $(Fg)(\alpha_A(1_A))$, or (ii) $(Fg)(\alpha_B(1_B))$?'
            answer: '(i)'
            answer_contract: {"kind": "label", "options": [["(i)", "i", "the first", "first", "option (i)", "(i) is correct", "expression (i)"], ["(ii)", "ii", "the second", "second", "option (ii)", "(ii) is correct", "expression (ii)"]]}
            solution_sketch: 'Naturality along $g$ at $1_A$ gives $\alpha_B(g)=(Fg)(\alpha_A(1_A))$, and $Fg$ maps $F(A)$ to $F(B)$. The expression in (ii) is not defined, because $1_B$ is not a morphism out of $A$, so $\alpha_B(1_B)$ has no meaning. Hence (i) is the correct one.'
          - problem: 'In $\mathbf{Set}$ let $A=\{1,2\}$, $B=\{1,2,3\}$ and $g\colon A\to B$ with $g(1)=3$ and $g(2)=1$. Let $C=\{c\}$ and $F=\mathrm{Hom}(C,-)$. Let $\alpha\colon\mathrm{Hom}(A,-)\Rightarrow F$ correspond to the function $u\colon C\to A$ with $u(c)=1$. Then $\alpha_B(g)$ is a function $C\to B$. What is its value at $c$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By naturality $\alpha_B(g)=F(g)(u)$, and $F=\mathrm{Hom}(C,-)$ acts by composing with $g$, so $\alpha_B(g)=g\circ u$. Then $(g\circ u)(c)=g(u(c))=g(1)=3$.'
          - problem: 'Write the full proof that the Yoneda bijection $\Psi\colon\mathrm{Nat}(\mathrm{Hom}(A,-),F)\to FA$, given by $\Psi(\alpha)=\alpha_A(1_A)$, is natural in $F$ and in $A$.'
            answer: 'Yoneda bijection is natural in F and A'
            answer_contract: {"kind": "none"}
            solution_sketch: 'For $\phi\colon F\Rightarrow F''$, the two routes around the square send $\alpha$ to $\phi_A(\alpha_A(1_A))$ and to $(\phi\circ\alpha)_A(1_A)=\phi_A(\alpha_A(1_A))$, so they agree and $\Psi$ is natural in $F$. For $f\colon A\to B$, precomposing $\alpha$ with the transformation induced by $f$ and evaluating at $1_B$ gives $\alpha_B(1_B\circ f)=\alpha_B(f)$. The other route gives $F(f)(\alpha_A(1_A))=\alpha_B(f\circ 1_A)=\alpha_B(f)$ by naturality of $\alpha$ at $f$. Both squares commute, so $\Psi$ is natural in $F$ and in $A$.'
      - id: kp3
        name: The contravariant form and its computational corollary
        key_prerequisites: [functor-categories]
        constraints: "Apply the contravariant form at a second presheaf: name the presheaf $G$ being substituted, read off the resulting hom-set, and when $G$ is a representable $\\mathrm{Hom}(-,A)$ say whether the bijection is an isomorphism of monoids."
        step_check:
          step: 'Check the monoid structure: $(g\circ f)_*=g_*\circ f_*$ and $(1_X)_*=1$'
          question: 'Why do these two equations show that the bijection is an isomorphism of monoids?'
          options:
            - 'They say composites go to composites and identity to identity, as a monoid map must'
            - 'They say each $f_*$ is a bijection, and a bijection between two monoids is an isomorphism'
            - 'They say the monoid $\mathrm{End}(X)$ is commutative, which an isomorphism of monoids needs'
            - 'They say the map $f\mapsto f_*$ is natural in $X$, and naturality makes it a monoid map'
          answer: 'They say composites go to composites and identity to identity, as a monoid map must'
          why: 'A monoid isomorphism is a bijection that preserves products and units, and the two equations state exactly that.'
        exemplars:
          - problem: 'Let $\mathcal C$ be the category with two objects $a$ and $b$, their identity morphisms, and four morphisms $f,g,h,k\colon a\to b$; there is no morphism $b\to a$ and there are no other morphisms. How many natural transformations are there from $\mathrm{Hom}(-,a)$ to $\mathrm{Hom}(-,b)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the contravariant Yoneda lemma, $\mathrm{Nat}(\mathrm{Hom}(-,a),G)$ is in bijection with $G(a)$. For $G=\mathrm{Hom}(-,b)$ this is $\mathrm{Hom}(a,b)=\{f,g,h,k\}$. So there are 4 natural transformations.'
          - problem: 'Let $\mathcal M$ be the category with one object $*$ whose morphisms are the elements of $\mathbb{Z}/5$, with composition given by addition. Natural transformations $\alpha,\beta\colon\mathrm{Hom}(-,*)\Rightarrow\mathrm{Hom}(-,*)$ correspond to the elements $3$ and $4$ of $\mathbb{Z}/5$ under the Yoneda bijection. Which element of $\mathbb{Z}/5$ corresponds to the composite $\beta\circ\alpha$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The Yoneda bijection is an isomorphism of monoids from $\mathrm{Nat}(\mathrm{Hom}(-,*),\mathrm{Hom}(-,*))$ to $\mathrm{End}(*)=\mathbb{Z}/5$. So composition of transformations corresponds to composition of morphisms, which is addition. Hence $\beta\circ\alpha$ corresponds to $4+3=7$, which is 2 in $\mathbb{Z}/5$.'
          - problem: 'Let $\mathcal C$ be the poset with objects $1,2,3$ ordered by $1\le 2\le 3$, viewed as a category. Let $G$ be the presheaf on $\mathcal C$ with $G(3)=\{a,b,c,d\}$, $G(2)=\{p,q,r,s,t\}$ and $G(1)=\{u,v\}$, in which every restriction map sends each element to the first element of its target set. How many natural transformations are there from $\mathrm{Hom}(-,2)$ to $G$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The contravariant Yoneda lemma gives a bijection between $\mathrm{Nat}(\mathrm{Hom}(-,2),G)$ and $G(2)$. The set $G(2)=\{p,q,r,s,t\}$ has 5 elements. So there are 5 natural transformations.'
          - problem: 'Let $\mathcal C$ be the poset with objects $x,y,z$ ordered by $x\le y\le z$, viewed as a category. How many natural transformations are there from $\mathrm{Hom}(-,z)$ to $\mathrm{Hom}(-,x)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the contravariant Yoneda lemma the natural transformations correspond to the elements of $\mathrm{Hom}(z,x)$. A morphism $z\to x$ exists only when $z\le x$, and the order is $x\le y\le z$, so this set is empty. So there are 0 natural transformations.'
          - problem: 'Let $\mathcal C$ be the poset with objects $u$ and $v$ and the single relation $u\le v$, viewed as a category. Let $G$ be the presheaf with $G(v)=\{2,6,10\}$ and $G(u)=\{5,9\}$, where the restriction $G(v)\to G(u)$ sends $2$ to $5$, $6$ to $5$ and $10$ to $9$. Let $\alpha\colon\mathrm{Hom}(-,v)\Rightarrow G$ be the natural transformation matched by the Yoneda lemma with the element $10$ of $G(v)$. What is the value of $\alpha_u$ at the unique morphism $u\to v$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transformation matched with 10 has $\alpha_v(1_v)=10$. For a morphism $w\colon X\to v$ naturality gives $\alpha_X(w)=G(w)(10)$. With $X=u$, the map $G(w)$ is the restriction and it sends 10 to 9, so the value is 9.'
          - problem: 'In $\mathbf{Set}$ let $A$ be a set with $3$ elements. How many natural transformations are there from $\mathrm{Hom}(-,A)$ to itself?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the contravariant Yoneda lemma, $\mathrm{Nat}(\mathrm{Hom}(-,A),\mathrm{Hom}(-,A))\cong\mathrm{Hom}(A,A)$, the functions from $A$ to $A$. Each of the 3 elements has 3 possible images, so there are $3^3=27$ natural transformations.'
          - problem: 'Let $\mathcal C$ be the poset with objects $1,2,3$ ordered by $1\le 2\le 3$, viewed as a category. Sam says there is no natural transformation from $\mathrm{Hom}(-,1)$ to $\mathrm{Hom}(-,3)$, because he thinks transformations only go from larger objects to smaller ones. How many natural transformations are there?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the contravariant Yoneda lemma the natural transformations correspond to the elements of $\mathrm{Hom}(1,3)$. Since $1\le 3$, there is exactly one morphism $1\to 3$. So there is 1 natural transformation, and Sam is wrong.'
          - problem: 'Write the full proof that for every presheaf $G$ on a category $\mathcal C$ and every object $A$, the map sending a natural transformation $\alpha\colon\mathrm{Hom}(-,A)\Rightarrow G$ to $\alpha_A(1_A)$ is a bijection that is natural in $G$, and that for $G=\mathrm{Hom}(-,A)$ it is an isomorphism of monoids onto the endomorphism monoid of $A$.'
            answer: 'Contravariant Yoneda and its monoid case'
            answer_contract: {"kind": "none"}
            solution_sketch: 'For $x\in G(A)$ define $\alpha_X(w)=G(w)(x)$ for $w\colon X\to A$. For $t\colon X''\to X$, both $G(t)(\alpha_X(w))$ and $\alpha_{X''}(w\circ t)$ equal $G(w\circ t)(x)$, so $\alpha$ is natural. Starting from $\alpha$ with $x=\alpha_A(1_A)$, naturality at $w$ gives $G(w)(\alpha_A(1_A))=\alpha_X(w)$, so $\alpha$ is recovered. Starting from $x$, the value at $1_A$ is $G(1_A)(x)=x$. For a map $t\colon G\Rightarrow H$ we have $t_A(\alpha_A(1_A))=(t\circ\alpha)_A(1_A)$, which is naturality in $G$. For $G=\mathrm{Hom}(-,A)$, vertical composition gives $(\beta\circ\alpha)_A(1_A)=\beta_A(\alpha_A(1_A))$ and the identity maps to $1_A$, so the bijection is an isomorphism of monoids.'
    diagnostic_exemplar:
      problem: "Prove the contravariant Yoneda lemma: for a presheaf $G\\colon\\mathcal C^{op}\\to\\mathbf{Set}$ and an object $A$, the assignment $\\Psi(\\alpha)=\\alpha_A(1_A)$ is a bijection $\\mathrm{Nat}(\\mathrm{Hom}(-,A),G)\\to GA$. Exhibit the inverse, verify both round trips, and check that the bijection is natural in $G$."
      answer: "Inverse: for $u\\in GA$ define $\\Theta(u)_X\\colon\\mathrm{Hom}(X,A)\\to GX$ by $\\Theta(u)_X(h)=(Gh)(u)$. This is natural: for $k\\colon W\\to X$ the presheaf $\\mathrm{Hom}(-,A)$ acts by pre-composition, and $\\Theta(u)_W(h\\circ k)=G(h\\circ k)(u)=\\big(Gk\\circ Gh\\big)(u)=Gk\\big(\\Theta(u)_X(h)\\big)$, using the contravariant composition law $G(h\\circ k)=Gk\\circ Gh$. Round trip 1: $\\Psi(\\Theta(u))=\\Theta(u)_A(1_A)=G(1_A)(u)=u$, since $G(1_A)=1_{GA}$. Round trip 2: for $\\alpha$ natural and $h\\colon X\\to A$, naturality of $\\alpha$ at $h$ reads $\\alpha_X\\circ(-\\circ h)=Gh\\circ\\alpha_A$; evaluating both sides at $1_A$ gives $\\alpha_X(h)=Gh(\\alpha_A(1_A))=\\Theta(\\Psi(\\alpha))_X(h)$, so $\\Theta\\Psi=\\mathrm{id}$. Hence $\\Psi$ is a bijection with inverse $\\Theta$. Naturality in $G$: for $\\varphi\\colon G\\Rightarrow G'$ the square compares $\\alpha\\mapsto\\varphi\\cdot\\alpha\\mapsto(\\varphi\\cdot\\alpha)_A(1_A)=\\varphi_A(\\alpha_A(1_A))$ with $\\alpha\\mapsto\\alpha_A(1_A)\\mapsto\\varphi_A(\\alpha_A(1_A))$; the two routes agree, so the square commutes."
      solution_sketch: "Both directions are a chase of the identity. $\\Psi$ evaluates at $1_A$, and naturality of $\\alpha$ at $h$ applied to $1_A$ forces $\\alpha_X(h)=Gh(\\alpha_A(1_A))$ — which is what the inverse $\\Theta(u)_X(h)=(Gh)(u)$ must be. The other round trip is $G(1_A)=1_{GA}$, and naturality in $G$ is a one-line comparison of the two routes."
    anki_seeds:
      - front: "Key step in the proof of the Yoneda lemma?"
        back: "apply naturality of $\\alpha$ at $h$ to $1_A$: $\\alpha_X(h)=(Fh)(\\alpha_A(1_A))$."
        type: basic
      - front: "$\\mathrm{Nat}(\\mathrm{Hom}(-,A),\\mathrm{Hom}(-,B))\\cong$ {{c1::$\\mathrm{Hom}(A,B)$}}."
        back: "$\\mathrm{Hom}(A,B)$"
        type: cloze
      - front: "The Yoneda isomorphism is natural in which variables?"
        back: "both — in the functor $F$ and in the object $A$."
        type: basic

  - id: yoneda-embedding
    name: The Yoneda Embedding
    core: true
    difficulty: 0.82
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: yoneda-lemma
        weight: 0.5
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: functor-categories
        weight: 0.2
      - id: covariant-contravariant-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: 'The embedding as a functor'
        key_prerequisites: [yoneda-lemma]
        constraints: 'Concrete small categories (a three-morphism category, one-object categories of Z/n and of words, finite sets) in which the action of the Yoneda embedding on one morphism is computed from post-composition; the covariant-hom variant is tested through the direction of precomposition. The proof item asks for functoriality.'
        try_first:
          problem: 'Let $\mathcal C$ have objects $A$ and $B$ and exactly the morphisms $1_A$, $1_B$ and $f\colon A\to B$. The presheaf $\mathrm{Hom}(-,B)$ sends the object $A$ to the set $\mathrm{Hom}(A,B)$. How many elements does this set have?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'The only morphism from $A$ to $B$ is $f$, so $\mathrm{Hom}(A,B)=\{f\}$. The Yoneda embedding turns each object into the family of these hom-sets, one for every test object $X$.'
        step_check:
          step: '$\mathbf y(f)=f_*=f\circ(-)\colon\mathrm{Hom}(-,A)\Rightarrow\mathrm{Hom}(-,B)$, i.e. post-composition'
          question: 'Why does $\mathbf y(f)$ send a morphism $h\colon X\to A$ to $f\circ h$ and not to $h\circ f$?'
          options:
            - 'The composites $f\circ h$ and $h\circ f$ are always equal, so the order is a mere convention'
            - 'In general only $f\circ h$ is defined, since $h$ ends at $A$ where $f$ starts'
            - 'The presheaf $\mathrm{Hom}(-,A)$ is contravariant, so all of its maps must run backwards'
            - 'Putting $f$ on the left keeps the number of morphisms in each hom-set the same'
          answer: 'In general only $f\circ h$ is defined, since $h$ ends at $A$ where $f$ starts'
          why: 'The morphism $h\colon X\to A$ ends where $f\colon A\to B$ starts, so $f\circ h\colon X\to B$ is the composite that exists in general.'
        exemplars:
          - problem: 'Let $\mathcal C$ be the category with objects $A$ and $B$ and exactly three morphisms: $1_A$, $1_B$ and $f\colon A\to B$. The Yoneda embedding sends $f$ to the natural transformation $\mathbf y(f)\colon\mathrm{Hom}(-,A)\Rightarrow\mathrm{Hom}(-,B)$. Its component at $A$ sends the morphism $1_A$ to which morphism?'
            answer: 'f'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The embedding sends $f$ to post-composition, so the component at $A$ sends $h\in\mathrm{Hom}(A,A)$ to $f\circ h$. For $h=1_A$ this is $f\circ 1_A=f$, which is the only morphism from $A$ to $B$.'
          - problem: 'The monoid $\mathbb Z/6$ under addition is a category with one object $*$, whose morphisms are $0,1,\dots,5$ and where composition is addition modulo $6$. The Yoneda embedding sends the morphism $4$ to post-composition with $4$. What does the component of $\mathbf y(4)$ at $*$ send the morphism $5$ to?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Post-composition with $4$ sends $h$ to $4\circ h$, which in this category is $4+h$ modulo $6$. For $h=5$ we get $4+5=9$, and $9$ leaves remainder $3$ modulo $6$, so the image is $3$.'
          - problem: 'Let $A=\{0,1\}$ and $X=\{p,q\}$ in $\mathbf{Set}$. The presheaf $\mathbf y(A)=\mathrm{Hom}(-,A)$ has four elements at $X$, the functions $h\colon X\to A$, written $[h(p),h(q)]$: they are $[0,0]$, $[0,1]$, $[1,0]$ and $[1,1]$. Let $u\colon\{*\}\to X$ be the function with $u(*)=q$. The map $\mathbf y(A)(u)\colon\mathrm{Hom}(X,A)\to\mathrm{Hom}(\{*\},A)$ sends $h$ to $h\circ u$. For how many of the four functions $h$ is $h\circ u$ the function $*\mapsto 1$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $h\circ u$ is the function $*\mapsto h(q)$, so only the value of $h$ at $q$ matters. That value is $1$ exactly for $[0,1]$ and $[1,1]$, so the answer is $2$.'
          - problem: 'The covariant embedding $A\mapsto\mathrm{Hom}(A,-)$ sends $f\colon A\to B$ to precomposition $\mathrm{Hom}(B,X)\to\mathrm{Hom}(A,X)$, $g\mapsto g\circ f$. In $\mathbf{Set}$ let $f\colon\{a,b\}\to\{c,d,e\}$ be given by $f(a)=e$ and $f(b)=c$. Let $g\colon\{c,d,e\}\to\{0,1\}$ be given by $g(c)=1$, $g(d)=0$ and $g(e)=0$. What is $(g\circ f)(b)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Precomposition replaces $g$ by $g\circ f$, so $f$ is applied first. Since $f(b)=c$ and $g(c)=1$, we get $(g\circ f)(b)=1$.'
          - problem: 'The twelve hours of a clock are the morphisms $0,1,\dots,11$ of a one-object category, where composing two morphisms adds them modulo $12$. The Yoneda embedding sends the morphism $5$ to the map that adds $5$ hours and the morphism $7$ to the map that adds $7$ hours. Which morphism $k$ satisfies $\mathbf y(7)\circ\mathbf y(5)=\mathbf y(k)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\mathbf y$ is a functor, $\mathbf y(7)\circ\mathbf y(5)=\mathbf y(7+5)$. Now $7+5=12$, which is $0$ modulo $12$, so $k=0$.'
          - problem: 'Let $\mathcal W$ be the category with one object whose morphisms are the finite words in the letters $a$ and $b$. The empty word is the identity, and the composite $v\circ u$ is the concatenation $vu$. The Yoneda embedding sends the word $w$ to post-composition with $w$. Which of the words abba, baab, abab and baba does the component of $\mathbf y(ab)$ at the single object send the word $ba$ to?'
            answer: 'abba'
            answer_contract: {"kind": "label", "options": [["abba", "a b b a", "ab·ba", "ab ba", "the word abba", "ab∘ba = abba"], ["baab", "b a a b", "ba·ab", "ba ab", "the word baab"], ["abab", "a b a b", "ab·ab", "ab ab", "the word abab"], ["baba", "b a b a", "ba·ba", "ba ba", "the word baba"]]}
            solution_sketch: 'Post-composition with $ab$ sends a word $h$ to $ab\circ h$, which is the concatenation of $ab$ and $h$. For $h=ba$ this gives $ab$ followed by $ba$, which is the word abba.'
          - problem: 'Sam says that the covariant embedding $A\mapsto\mathrm{Hom}(A,-)$ sends $f\colon A\to B$ to a map $\mathrm{Hom}(A,X)\to\mathrm{Hom}(B,X)$ given by $h\mapsto h\circ f$. Does this formula define a map between those two sets?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is defined", "it does"], ["no", "it is not defined", "not defined", "it does not", "no such map"]]}
            solution_sketch: 'An element $h\in\mathrm{Hom}(A,X)$ starts at $A$, but $f$ ends at $B$, so the composite $h\circ f$ is not defined in general. The correct map goes from $\mathrm{Hom}(B,X)$ to $\mathrm{Hom}(A,X)$, which shows that this embedding reverses the direction of $f$.'
          - problem: 'A ferris wheel has $10$ cabins, and turning it by $k$ cabins is the morphism $k$ of a one-object category with morphisms $0,1,\dots,9$ and composition adding modulo $10$. The Yoneda embedding sends the morphism $k$ to the map that turns the wheel by $k$ cabins. For which morphism $k$ is $\mathbf y(k)\circ\mathbf y(6)=\mathbf y(3)$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $\mathbf y$ is a functor, $\mathbf y(k)\circ\mathbf y(6)=\mathbf y(k+6)$, and $\mathbf y$ is injective on morphisms because it is faithful. So we need $k+6\equiv 3$ modulo $10$, which gives $k\equiv -3\equiv 7$.'
          - problem: 'Write the full proof that the Yoneda embedding preserves identities and composition: for $f\colon A\to B$ and $g\colon B\to C$ we have $\mathbf y(g\circ f)=\mathbf y(g)\circ\mathbf y(f)$ and $\mathbf y(1_A)=1_{\mathbf y(A)}$.'
            answer: 'y preserves identities and composition'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Definition on objects: y(A) = Hom(-, A), the representable presheaf; its component at X is the set Hom(X, A). Definition on morphisms: for f from A to B, y(f) is post-composition by f, the natural transformation with component Hom(X, A) to Hom(X, B) sending h to the composite f after h. Naturality: for u from X'' to X, the composite (f after h) after u equals f after (h after u) by associativity, so the naturality square commutes. Identity law: y(1_A) sends h to the composite 1_A after h, which is h, so y(1_A) = 1. Composition law: y(g) after y(f) sends h to g after (f after h), which equals (g after f) after h by associativity, so y(g) after y(f) = y(g after f). Conclusion: y preserves identities and composites, so y is a functor from C to [C^op, Set].'
      - id: kp2
        name: 'Full faithfulness'
        key_prerequisites: [full-faithful-functors]
        constraints: 'Natural transformations between representables are recovered from the identity component and counted in small categories (Z/n as a one-object category, parallel morphisms, a divisibility poset). Verdict items name the morphism that exists or is missing; the proof item asks for full faithfulness.'
        step_check:
          step: 'set $u=\theta_C(1_C)\in\mathrm{Hom}(C,D)$'
          question: 'Why is the single value $\theta_C(1_C)$ enough to determine every component of $\theta$?'
          options:
            - 'The identity $1_C$ is the only morphism out of $C$, so no other values exist'
            - 'Every natural transformation sends $1_C$ to $1_D$, so $\theta$ is a trivial map'
            - 'Naturality writes $h$ as $1_C\circ h$, so $\theta_X(h)=\theta_C(1_C)\circ h$'
            - 'The identity is the smallest morphism, so $\theta$ is fixed by its smallest value there'
          answer: 'Naturality writes $h$ as $1_C\circ h$, so $\theta_X(h)=\theta_C(1_C)\circ h$'
          why: 'Every $h\colon X\to C$ equals $1_C\circ h$, so naturality gives $\theta_X(h)=\theta_C(1_C)\circ h=u\circ h$.'
        exemplars:
          - problem: 'The monoid $\mathbb Z/5$ under addition is a category with one object $*$, whose morphisms are $0,1,2,3,4$ and where composition is addition modulo $5$. A natural transformation $\theta\colon\mathrm{Hom}(-,*)\Rightarrow\mathrm{Hom}(-,*)$ has $\theta_*(0)=2$, where $0$ is the identity morphism. What is $\theta_*(3)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By naturality $\theta_*(h)=\theta_*(0\circ h)=\theta_*(0)\circ h$, so $\theta_*(h)=2+h$ modulo $5$. For $h=3$ this gives $2+3=5$, which is $0$ modulo $5$.'
          - problem: 'On a $12$-hour clock the hours $0,1,\dots,11$ are the morphisms of a one-object category, where composing two hours adds them modulo $12$. A natural transformation $\theta\colon\mathrm{Hom}(-,*)\Rightarrow\mathrm{Hom}(-,*)$ has $\theta_*(8)=1$. What is $\theta_*(0)$, its value at the identity?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By naturality $\theta_*(h)=u+h$ modulo $12$, where $u=\theta_*(0)$. Then $u+8\equiv 1$, so $u\equiv 1-8=-7\equiv 5$ modulo $12$.'
          - problem: 'Let $\mathcal C$ be the one-object category of $\mathbb Z/6$ under addition. How many natural transformations are there from $\mathrm{Hom}(-,*)$ to itself?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural transformation is determined by its single value $\theta_*(0)$, and each of the $6$ morphisms is allowed as that value. So there are $6$ natural transformations, one for each morphism of $\mathcal C$.'
          - problem: 'Let $\mathcal C$ have objects $A$ and $B$ and, besides the identities, exactly two parallel morphisms $f,g\colon A\to B$. How many natural transformations are there from $\mathrm{Hom}(-,A)$ to $\mathrm{Hom}(-,B)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the Yoneda lemma the natural transformations $\mathrm{Hom}(-,A)\Rightarrow\mathrm{Hom}(-,B)$ correspond to the morphisms $A\to B$. There are $2$ of these, namely $f$ and $g$, so there are $2$ natural transformations.'
          - problem: 'Sam works in the one-object category of $\mathbb Z/4$ under addition. A natural transformation $\theta$ of $\mathrm{Hom}(-,*)$ has $\theta_*(0)=3$, and Sam computes $\theta_*(2)=2\cdot3=6\equiv 2$. What is the correct value of $\theta_*(2)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality gives $\theta_*(h)=\theta_*(0)\circ h$, and composition in this category is addition. So $\theta_*(2)=3+2=5\equiv 1$ modulo $4$, which is a sum and not a product.'
          - problem: 'Let $\mathcal C$ be the poset of divisors of $6$, namely $\{1,2,3,6\}$, with one morphism $a\to b$ exactly when $a$ divides $b$. Is there a natural transformation from $\mathrm{Hom}(-,2)$ to $\mathrm{Hom}(-,3)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it is", "that is right"], ["no", "it does not", "it is not", "that is wrong"]]}
            solution_sketch: 'The natural transformations $\mathrm{Hom}(-,2)\Rightarrow\mathrm{Hom}(-,3)$ correspond to the morphisms $2\to 3$. The number $2$ does not divide $3$, so there is no such morphism and the answer is no.'
          - problem: 'A carousel has $8$ horses, and turning it by $k$ places is the morphism $k$ of a one-object category with morphisms $0,1,\dots,7$ and composition adding modulo $8$. A natural transformation $\theta\colon\mathrm{Hom}(-,*)\Rightarrow\mathrm{Hom}(-,*)$ has $\theta_*(0)=3$. What is $\theta_*(6)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By naturality $\theta_*(h)=3+h$ modulo $8$. For $h=6$ we get $3+6=9$, and $9$ leaves remainder $1$ modulo $8$, so $\theta_*(6)=1$.'
          - problem: 'Let $D$ be the poset of divisors of $12$, namely $\{1,2,3,4,6,12\}$, with one morphism $a\to b$ exactly when $a$ divides $b$. Is there a natural transformation from $\mathrm{Hom}(-,3)$ to $\mathrm{Hom}(-,12)$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it is", "that is right"], ["no", "it does not", "it is not", "that is wrong"]]}
            solution_sketch: 'The natural transformations $\mathrm{Hom}(-,3)\Rightarrow\mathrm{Hom}(-,12)$ correspond to the morphisms $3\to 12$. The number $3$ divides $12$, so there is exactly one such morphism and the answer is yes.'
          - problem: 'Write the full proof that the Yoneda embedding $\mathbf y\colon\mathcal C\to[\mathcal C^{op},\mathbf{Set}]$ is fully faithful.'
            answer: 'y is fully faithful'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Route: argue directly by evaluating at identities, naming which half each step establishes. Step 1, faithful: if y(f) = y(g) for morphisms f and g from A to B, evaluate the component at A on 1_A to get f = y(f)_A(1_A) = y(g)_A(1_A) = g, so the map on each hom set is injective. Step 2, full: given a natural transformation theta from y(A) to y(B), set f = theta_A(1_A), which lies in Hom(A, B). Step 3, naturality: for any morphism h from X to A, naturality of theta at h applied to 1_A gives theta_X(h) = theta_X(1_A after h) = f after h = y(f)_X(h). Step 4, conclusion: theta = y(f), so the map on hom sets is also surjective, and the Yoneda embedding is fully faithful.'
      - id: kp3
        name: 'Objects are determined by their points'
        key_prerequisites: [full-faithful-functors]
        constraints: 'Objects are compared through their presheaves of points: sizes of hom-sets in a divisibility poset or a small poset, inverses of natural isomorphisms in Z/n, the sets Hom(X,A) in Set. Verdicts name the test object that separates two presheaves; the proof item asks for the iff statement.'
        step_check:
          step: 'there is a map $h\colon C\to D$ with $\mathbf{y}(h)=\alpha$'
          question: 'Why does a morphism $h\colon C\to D$ with $\mathbf y(h)=\alpha$ exist?'
          options:
            - 'The embedding is faithful, so different morphisms give different natural transformations'
            - 'Every natural transformation of presheaves is $\mathbf y$ of some morphism of $\mathcal C$'
            - 'The map $\alpha$ is an isomorphism, so it is $\mathbf y$ of an identity morphism'
            - 'Fullness: every natural transformation between representables comes from a morphism'
          answer: 'Fullness: every natural transformation between representables comes from a morphism'
          why: 'Fullness of $\mathbf y$ says that every natural transformation $\mathrm{Hom}(-,C)\Rightarrow\mathrm{Hom}(-,D)$ equals $\mathbf y(h)$ for some $h\colon C\to D$.'
        exemplars:
          - problem: 'Let $P$ be the poset of divisors of $6$, namely $\{1,2,3,6\}$, with one morphism $a\to b$ exactly when $a$ divides $b$. For which objects $X$ do the sets $\mathrm{Hom}(X,2)$ and $\mathrm{Hom}(X,3)$ have different numbers of elements?'
            answer: '2, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $\mathrm{Hom}(X,b)$ has one element when $X$ divides $b$ and none otherwise. For $X=2$ the sizes are $1$ and $0$, and for $X=3$ they are $0$ and $1$, while $X=1$ and $X=6$ give equal sizes. So the objects are $2$ and $3$, and the presheaves of $2$ and $3$ differ.'
          - problem: 'In $\mathbf{Set}$ let $f\colon\{0,1,2\}\to\{0,1,2\}$ be given by $f(0)=1$, $f(1)=2$ and $f(2)=0$. For every set $X$ the map $h\mapsto f\circ h$ from $\mathrm{Hom}(X,\{0,1,2\})$ to itself is a bijection. How many functions $g$ satisfy both $f\circ g=\mathrm{id}$ and $g\circ f=\mathrm{id}$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function $f$ is a bijection, so it has an inverse. An inverse of a function is unique, so there is exactly $1$ function $g$ with both properties.'
          - problem: 'In a category the morphism $f\colon A\to B$ induces a bijection $\mathrm{Hom}(X,A)\to\mathrm{Hom}(X,B)$, $h\mapsto f\circ h$, for every object $X$. Taking $X=B$ gives $g\colon B\to A$ with $f\circ g=1_B$. To show that $g\circ f=1_A$, compare $f\circ(g\circ f)$ with $f\circ 1_A$. What is $f\circ(g\circ f)$ equal to?'
            answer: 'f'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By associativity $f\circ(g\circ f)=(f\circ g)\circ f=1_B\circ f=f$. Also $f\circ 1_A=f$, so $g\circ f$ and $1_A$ have the same image under the injective map $h\mapsto f\circ h$, and therefore they are equal.'
          - problem: 'Seven beads sit on a ring, and rotating the ring by $k$ places is the morphism $k$ of a one-object category with morphisms $0,1,\dots,6$ and composition adding modulo $7$. A natural isomorphism $\theta\colon\mathrm{Hom}(-,*)\Rightarrow\mathrm{Hom}(-,*)$ has $\theta_*(0)=3$. What is $\theta^{-1}_*(0)$, the value of its inverse at the identity?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transformation $\theta$ is $\mathbf y(3)$, so its inverse is $\mathbf y(k)$ where $3+k\equiv 0$ modulo $7$. Hence $k=4$, which is the value $\theta^{-1}_*(0)$.'
          - problem: 'In $\mathbf{Set}$ the sets $P$ and $Q$ have isomorphic presheaves, $\mathrm{Hom}(-,P)\cong\mathrm{Hom}(-,Q)$. The set $P$ has $5$ elements. How many elements does $Q$ have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because the Yoneda embedding reflects isomorphisms, isomorphic presheaves mean $P\cong Q$ in $\mathbf{Set}$, so $P$ and $Q$ are in bijection. Hence $Q$ has the same number of elements as $P$, namely $5$.'
          - problem: 'Let $P=\{a,b,c\}$ be the poset with $a\le b$ and $a\le c$ and no other relations between different elements, viewed as a category. Are the presheaves $\mathrm{Hom}(-,b)$ and $\mathrm{Hom}(-,c)$ isomorphic?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "it is", "that is right"], ["no", "it does not", "it is not", "that is wrong"]]}
            solution_sketch: 'At $X=b$ the set $\mathrm{Hom}(b,b)$ has one element, but $\mathrm{Hom}(b,c)$ is empty because $b$ and $c$ are not comparable. The component at $b$ cannot be a bijection, so the presheaves are not isomorphic and the answer is no.'
          - problem: 'Two students each choose one snack from a finite set $A$ of snacks, and there are $49$ possible ways to choose, namely the elements of $\mathrm{Hom}(\{1,2\},A)$ in $\mathbf{Set}$. The finite set $B$ has an isomorphic presheaf, $\mathrm{Hom}(-,A)\cong\mathrm{Hom}(-,B)$. How many elements does $B$ have?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A function from a $2$-element set to $A$ is a pair of snacks, so $\mathrm{Hom}(\{1,2\},A)$ has $|A|^2=49$ elements and $|A|=7$. Isomorphic presheaves mean $A\cong B$ in $\mathbf{Set}$, so $B$ has $7$ elements as well.'
          - problem: 'Let $f\colon A\to B$ be a morphism such that $\mathbf y(f)$ is a natural isomorphism. Its inverse is $\mathbf y(g)$ for some morphism $g\colon B\to A$. Which property of $\mathbf y$ guarantees that the inverse of $\mathbf y(f)$ comes from a morphism of $\mathcal C$: fullness or faithfulness?'
            answer: 'full'
            answer_contract: {"kind": "label", "options": [["full", "fullness", "y is full", "it is full", "fullness of y"], ["faithful", "faithfulness", "y is faithful", "it is faithful", "faithfulness of y"]]}
            solution_sketch: 'A natural transformation comes from a morphism only if $\mathbf y$ is full, and the inverse of $\mathbf y(f)$ needs exactly that. Faithfulness only says that different morphisms give different transformations, so it cannot produce $g$.'
          - problem: 'Write the full proof that for objects $C$ and $D$ of a category $\mathcal C$ we have $C\cong D$ if and only if $\mathrm{Hom}(-,C)\cong\mathrm{Hom}(-,D)$ as presheaves.'
            answer: 'C is isomorphic to D iff their presheaves are'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1: suppose first that A is isomorphic to B, say via f : A -> B with inverse. Any functor preserves isomorphisms, so y(f) is an isomorphism from y(A) to y(B), and its component at each X is f_* by the naturality of y(f). This gives the forward direction. Step 2: conversely, suppose y(A) and y(B) are isomorphic, and fix one natural isomorphism between them. Step 3: since y is full, there are morphisms f : A -> B and g : B -> A with y(f) equal to the chosen isomorphism and y(g) equal to its inverse. Step 4: by naturality, y(g o f) = y(g) o y(f) equals the identity natural transformation y(id_A); since y is faithful, this forces g o f = id_A, and the same argument with the roles of A and B swapped gives f o g = id_B. Step 5: f is an isomorphism with inverse g, so A is isomorphic to B. Conclusion: the Yoneda embedding is fully faithful and therefore reflects isomorphisms, so an object is determined up to isomorphism by its presheaf of points.'
    diagnostic_exemplar:
      problem: "Let $f\\colon A\\to B$ be a homomorphism of groups such that for every group $X$ the map $f_*\\colon\\mathrm{Hom}_{\\mathbf{Grp}}(X,A)\\to\\mathrm{Hom}_{\\mathbf{Grp}}(X,B)$, $h\\mapsto f\\circ h$, is a bijection. Prove that $f$ is an isomorphism, and identify the natural transformation whose components the maps $f_*$ are."
      answer: "The maps $f_*$ are exactly the components of $\\mathbf y(f)=f\\circ(-)\\colon\\mathrm{Hom}(-,A)\\Rightarrow\\mathrm{Hom}(-,B)$, the image of $f$ under the Yoneda embedding $\\mathbf y\\colon\\mathbf{Grp}\\to[\\mathbf{Grp}^{op},\\mathbf{Set}]$; the hypothesis says every component is a bijection, i.e. $\\mathbf y(f)$ is a natural isomorphism. Since $\\mathbf y$ is fully faithful and fully faithful functors reflect isomorphisms, $f$ is an isomorphism. Directly: take $X=B$; surjectivity of $f_*\\colon\\mathrm{Hom}(B,A)\\to\\mathrm{Hom}(B,B)$ gives $g\\colon B\\to A$ with $f\\circ g=1_B$. Then, in $\\mathrm{Hom}(A,B)$, $f\\circ(g\\circ f)=(f\\circ g)\\circ f=f=f\\circ 1_A$, and injectivity of $f_*\\colon\\mathrm{Hom}(A,A)\\to\\mathrm{Hom}(A,B)$ gives $g\\circ f=1_A$. So $g$ is a two-sided inverse and $f$ is an isomorphism."
      solution_sketch: "Recognise the family $f_*$ as the components of $\\mathbf y(f)$, so the hypothesis says $\\mathbf y(f)$ is a natural isomorphism; $\\mathbf y$ is fully faithful and therefore reflects isomorphisms. Concretely the same conclusion comes from taking $X=B$ to produce the inverse and $X=A$ to force the other identity."
    anki_seeds:
      - front: "The Yoneda embedding $\\mathbf{y}\\colon\\mathcal C\\to[\\mathcal C^{op},\\mathbf{Set}]$ sends $A\\mapsto$? and $f\\mapsto$?"
        back: "$A\\mapsto\\mathrm{Hom}(-,A)$; $f\\mapsto f_*$ (post-composition)."
        type: basic
      - front: "What key property does the Yoneda embedding have?"
        back: "it is fully faithful."
        type: basic
      - front: "A fully faithful embedding lets you conclude $A\\cong B$ from {{c1::$\\mathrm{Hom}(-,A)\\cong\\mathrm{Hom}(-,B)$}}."
        back: "$\\mathrm{Hom}(-,A)\\cong\\mathrm{Hom}(-,B)$"
        type: cloze

  - id: category-of-elements
    name: The Category of Elements
    core: false
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: representable-functors
        weight: 0.4
        key: true
      - id: universal-elements
        weight: 0.4
        key: true
      - id: comma-categories
        weight: 0.3
      - id: functor-categories
        weight: 0.2
      - id: slice-categories
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: 'Definition'
        key_prerequisites: [representable-functors]
        constraints: 'Small categories given by their morphisms, with functors or presheaves into Set given by their values; items count objects and morphisms of the category of elements and fix the direction of the morphism condition for both variances. The proof item asks that the category of elements is a category with a projection functor.'
        try_first:
          problem: 'Let $\mathcal C$ have objects $A$ and $B$ and one non-identity morphism $f\colon A\to B$. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(A)=\{1,2,3\}$ and $F(B)=\{4,5\}$. How many objects does the category of elements $\int F$ have?'
          answer_contract: {"kind": "exact"}
          answer: '5'
          reveal: 'An object of $\int F$ is a pair $(C,x)$ with $x$ an element of $F(C)$, so every element of every set gives one object. Here that is $3+2=5$ objects.'
        step_check:
          step: 'Compute $Ff(0)=*$, so $f$ gives a morphism $(A,0)\to(B,*)$'
          question: 'Why does $f$ give a morphism $(A,0)\to(B,*)$?'
          options:
            - 'Any morphism $A\to B$ links every element of $FA$ to every element of $FB$ in $\int F$'
            - 'The condition $Ff(*)=0$ holds, so $f$ carries the element $*$ back to $0$'
            - 'The arrow $f$ lies in $\mathcal C$, so it is a morphism whatever $F$ does'
            - 'Since $Ff(0)=*$, the arrow $f$ carries the element $0$ to the element $*$'
          answer: 'Since $Ff(0)=*$, the arrow $f$ carries the element $0$ to the element $*$'
          why: 'A morphism $(A,0)\to(B,*)$ is an arrow $g\colon A\to B$ with $(Fg)(0)=*$, and $f$ meets this condition because $Ff(0)=*$.'
        exemplars:
          - problem: 'Let $\mathcal C$ have two objects $A$ and $B$ and exactly one non-identity morphism $f\colon A\to B$. Let $F\colon\mathcal C\to\mathbf{Set}$ be the functor with $F(A)=\{1,2\}$ and $F(B)=\{5,6\}$, where $Ff$ sends $1$ to $5$ and $2$ to $6$. How many morphisms does the category of elements $\int F$ have from $(A,2)$ to $(B,6)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism $(A,2)\to(B,6)$ is a morphism $h\colon A\to B$ of $\mathcal C$ with $(Fh)(2)=6$. The only candidate is $f$, and $Ff(2)=6$ holds, so there is exactly $1$ such morphism.'
          - problem: 'Let $\mathcal C$ have two objects $A$ and $B$ and exactly one non-identity morphism $f\colon A\to B$. Let $F\colon\mathcal C^{op}\to\mathbf{Set}$ be the presheaf with $F(A)=\{1,2\}$ and $F(B)=\{7,8\}$, where $Ff\colon F(B)\to F(A)$ sends $7$ to $1$ and $8$ to $2$. How many morphisms does $\int F$ have from $(A,1)$ to $(B,8)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a presheaf, a morphism $(A,1)\to(B,8)$ is a morphism $h\colon A\to B$ with $(Fh)(8)=1$. The only candidate is $f$, but $Ff(8)=2$, so no morphism exists and the count is $0$.'
          - problem: 'Let $\mathcal C$ be the poset $a<b$ viewed as a category, with one non-identity morphism $a\to b$. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(a)=\{1,2,3\}$ and $F(b)=\{7,8\}$, where the morphism $a\to b$ acts by $1\mapsto 7$, $2\mapsto 7$ and $3\mapsto 8$. How many morphisms does $\int F$ have in total, counting the identities?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The category $\int F$ has one object for each element, so $3+2=5$ objects and $5$ identity morphisms. Each element $x$ of $F(a)$ gives one morphism from $(a,x)$ to $(b,Fx)$, which adds $3$ more, so the total is $5+3=8$.'
          - problem: 'Let $\mathcal C$ have objects $A$ and $B$ and one non-identity morphism $f\colon A\to B$. Let $F\colon\mathcal C^{op}\to\mathbf{Set}$ be the presheaf with $F(A)=\{1,2\}$ and $F(B)=\{3,4,5\}$, where $Ff\colon F(B)\to F(A)$ sends $3$ to $1$, $4$ to $1$ and $5$ to $2$. For how many elements $y$ of $F(B)$ is there a morphism $(A,1)\to(B,y)$ in $\int F$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism $(A,1)\to(B,y)$ is a morphism $h\colon A\to B$ with $(Fh)(y)=1$, so $f$ works exactly when $Ff(y)=1$. This holds for $y=3$ and $y=4$ but not for $y=5$, so the count is $2$.'
          - problem: 'Let $\mathcal C$ have two objects $A$ and $B$ and, besides the identities, exactly two different morphisms $f,g\colon A\to B$. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(A)=\{1,2\}$ and $F(B)=\{6\}$, where both $Ff$ and $Fg$ send every element to $6$. How many morphisms does $\int F$ have from $(A,2)$ to $(B,6)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both $f$ and $g$ satisfy the condition $(Fh)(2)=6$, and they are different morphisms of $\mathcal C$. So $\int F$ has $2$ morphisms from $(A,2)$ to $(B,6)$.'
          - problem: 'A project has two stages, $0$ before the review and $1$ after it, with one morphism $0\to 1$ besides the identities. Let $F$ assign to stage $0$ the set of documents $\{\mathrm{memo}\}$ and to stage $1$ the set $\{\mathrm{memo},\mathrm{report}\}$, where the morphism acts as the inclusion. How many morphisms does $\int F$ have in total?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The objects of $\int F$ are $(0,\mathrm{memo})$, $(1,\mathrm{memo})$ and $(1,\mathrm{report})$, which carry $3$ identities. The morphism $0\to 1$ links $(0,\mathrm{memo})$ to $(1,\mathrm{memo})$ only, so the total is $3+1=4$.'
          - problem: 'A lamp is off ($0$) or on ($1$), and pressing the switch $k$ times changes the state $x$ to $x+k$ modulo $2$. Let $\mathcal C$ be the one-object category with morphisms $0,1,2,3$ and composition adding modulo $4$, and let $F(*)=\{0,1\}$ with the morphism $k$ acting as just described. How many morphisms does $\int F$ have from $(*,0)$ to $(*,0)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism $(*,0)\to(*,0)$ is a morphism $k$ with $0+k\equiv 0$ modulo $2$. This holds for $k=0$ and $k=2$, so there are $2$ such morphisms.'
          - problem: 'Let $\mathcal C$ have objects $A$ and $B$ and one non-identity morphism $f\colon A\to B$. Let $F$ be the presheaf with $F(A)=\{1,2\}$ and $F(B)=\{3,4\}$, where $Ff\colon F(B)\to F(A)$ sends $3$ to $1$ and $4$ to $2$. Sam says that no morphism $(A,1)\to(B,y)$ exists in $\int F$ for any $y$, because $Ff$ is not defined at $1$. For which $y$ is there such a morphism?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism $(A,1)\to(B,y)$ is a morphism $h\colon A\to B$ with $(Fh)(y)=1$, so $Ff$ is applied to $y$ and not to $1$. Since $Ff(3)=1$, the element $y=3$ works, while $y=4$ gives $2$.'
          - problem: 'Write the full proof that for a functor $F\colon\mathcal C\to\mathbf{Set}$ the category of elements $\int F$ is a category and that the projection $(C,x)\mapsto C$ is a functor $\int F\to\mathcal C$.'
            answer: 'int F is a category and pi is a functor'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (identities): for each object (C, x), the map id_C satisfies F(id_C)(x) = x because F preserves identities, so id_C is a morphism (C, x) -> (C, x), and it acts as an identity since it does so in C. Step 2 (composition): if f gives a morphism (C, x) -> (D, y) and g gives a morphism (D, y) -> (E, z), then F(g after f)(x) = Fg(Ff(x)) = Fg(y) = z, because F preserves composition, so g after f gives a morphism (C, x) -> (E, z); associativity and unit laws are inherited from C, so the pairs form a category. Step 3 (projection): define the projection functor on objects by (C, x) -> C and on morphisms by f -> f; it preserves identities and composition because it leaves the underlying objects and maps of C unchanged. Hence the projection is a functor from the category of elements to C, which completes the proof.'
      - id: kp2
        name: 'Representability via an initial element'
        key_prerequisites: [universal-elements]
        constraints: 'Initial or terminal objects of the category of elements of small functors and presheaves (the poset 0<1, a three-arrow category, F(X)=X x X and X x X x X on Set). Items name the candidate or the object that breaks it; the verdict is a representability label. The proof item asks for the iff statement.'
        step_check:
          step: 'so $k(0)=a$ and $k(1)=b$'
          question: 'Why is there only one morphism from $(2,u)$ to $(X,(a,b))$?'
          options:
            - 'The set $2$ has two elements, so at most two functions $2\to X$ exist'
            - 'A morphism must satisfy $(Fk)(u)=(a,b)$, which fixes $k(0)$ and $k(1)$'
            - 'Every object of $\int F$ has exactly one morphism to every other object'
            - 'The sets $X$ and $2$ have equal size, so every function $k$ is a bijection'
          answer: 'A morphism must satisfy $(Fk)(u)=(a,b)$, which fixes $k(0)$ and $k(1)$'
          why: 'The condition $(Fk)(0,1)=(k0,k1)=(a,b)$ leaves no freedom, so the only possible $k$ is the function $h$ with $h(0)=a$ and $h(1)=b$.'
        exemplars:
          - problem: 'Let $\mathcal C$ be the poset $0<1$ viewed as a category, with one morphism $0\to 1$ besides the identities. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(0)=\{1\}$ and $F(1)=\{2\}$, where the morphism $0\to 1$ acts by $1\mapsto 2$. Which object of $\int F$ is initial?'
            answer: '(0, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The objects of $\int F$ are $(0,1)$ and $(1,2)$. There is a morphism $(0,1)\to(1,2)$ because the morphism $0\to 1$ sends $1$ to $2$, and there is none back, so $(0,1)$ is the initial object.'
          - problem: 'Let $\mathcal C$ be the poset $0<1$ and let $F\colon\mathcal C^{op}\to\mathbf{Set}$ be the presheaf with $F(0)=\{3\}$ and $F(1)=\{4\}$, where $Ff\colon F(1)\to F(0)$ sends $4$ to $3$ for the morphism $f\colon 0\to 1$. In $\int F$ a morphism $(C,x)\to(D,y)$ is a morphism $h\colon C\to D$ with $(Fh)(y)=x$. Which object of $\int F$ is terminal?'
            answer: '(1, 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Since $Ff(4)=3$, the morphism $f$ gives a morphism $(0,3)\to(1,4)$, and there is no morphism back. So every object has exactly one morphism into $(1,4)$, and the terminal object is $(1,4)$.'
          - problem: 'Let $\mathcal C$ be the poset $0<1$ and let $F\colon\mathcal C\to\mathbf{Set}$ have $F(0)=\{1,2\}$ and $F(1)=\{3\}$, where the morphism $0\to 1$ sends both $1$ and $2$ to $3$. Is $F$ representable?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is representable", "representable"], ["no", "it is not", "not representable", "nonrepresentable", "it is not representable"]]}
            solution_sketch: 'If $F$ were representable, $\int F$ would have an initial object. The objects over $0$ are $(0,1)$ and $(0,2)$ with no morphism between them, and $(1,3)$ has no morphism to either, so there is no initial object and $F$ is not representable.'
          - problem: 'Let $F$ be the presheaf on the poset $0<1$ with $F(1)=\{2,3,4\}$ and $F(0)=\{5\}$, where the morphism $0\to 1$ acts by sending every element of $F(1)$ to $5$. The object $(1,2)$ is a candidate for the terminal object of $\int F$. For how many objects $(C,x)$ of $\int F$ is there no morphism $(C,x)\to(1,2)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The objects are $(0,5)$, $(1,2)$, $(1,3)$ and $(1,4)$. The objects $(0,5)$ and $(1,2)$ have a morphism to $(1,2)$, but $(1,3)$ and $(1,4)$ have none, so the count is $2$.'
          - problem: 'Mia wants to choose an ordered pair of items from any set $X$, so she studies $F(X)=X\times X$ on $\mathbf{Set}$, with $F(h)=h\times h$. The object $(\{0,1\},(0,1))$ of $\int F$ is initial. Let $X=\{p,q,r\}$ and consider the object $(X,(r,q))$. The unique morphism from $(\{0,1\},(0,1))$ to it is a function $h\colon\{0,1\}\to X$. What is $h(1)$?'
            answer: 'q'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism must satisfy $(h(0),h(1))=(Fh)(0,1)=(r,q)$, because the image of the element must equal the target element. So $h(0)=r$ and $h(1)=q$.'
          - problem: 'Mia now chooses ordered triples of items, so she studies $F(X)=X\times X\times X$ on $\mathbf{Set}$. The functor $F$ is represented by a finite set $S$, which means $F(X)\cong\mathrm{Hom}(S,X)$. How many elements does $S$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A finite set $X$ gives $\mathrm{Hom}(S,X)$ with $|X|^{|S|}$ elements, while $F(X)$ has $|X|^3$ elements. Comparing the exponents gives $|S|=3$.'
          - problem: 'Let $\mathcal C$ be the poset $0<1$ and let $F\colon\mathcal C\to\mathbf{Set}$ have $F(0)=\{1\}$ and $F(1)=\{2,3\}$, where the morphism $0\to 1$ sends $1$ to $2$. Sam says $F$ is represented by $(0,1)$ because $(0,1)$ is the only object over $0$. Which object of $\int F$ receives no morphism from $(0,1)$?'
            answer: '(1, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A morphism from $(0,1)$ to $(1,y)$ needs the morphism $0\to 1$ to send $1$ to $y$. It sends $1$ to $2$ only, so $(1,3)$ receives no morphism, and $(0,1)$ is not initial.'
          - problem: 'Let $\mathcal B$ be the category with objects $a$ and $b$, the identities, and exactly three further morphisms $f,g,h\colon a\to b$. Let $F\colon\mathcal B\to\mathbf{Set}$ have $F(a)=\{1\}$ and $F(b)=\{2,3\}$, where each of $f$, $g$, $h$ sends $1$ to $2$. How many morphisms does $\int F$ have from $(a,1)$ to $(b,2)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of $f$, $g$ and $h$ satisfies the condition that $1$ is sent to $2$, so there are $3$ morphisms from $(a,1)$ to $(b,2)$. The morphism to an object is therefore not unique, and $(a,1)$ is not initial.'
          - problem: 'Let $\mathcal C$ be the one-object category of $\mathbb Z/3$ under addition, with morphisms $0,1,2$ and composition adding modulo $3$. Let $F\colon\mathcal C\to\mathbf{Set}$ have $F(*)=\{0,1,2\}$, where the morphism $k$ acts by $x\mapsto x+k$ modulo $3$. Is $F$ representable?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "it is representable", "representable"], ["no", "it is not", "not representable", "nonrepresentable", "it is not representable"]]}
            solution_sketch: 'The objects of $\int F$ are $(*,0)$, $(*,1)$ and $(*,2)$. A morphism $(*,0)\to(*,y)$ is a morphism $k$ with $0+k\equiv y$ modulo $3$, and exactly one $k$ does this for each $y$. So $(*,0)$ is initial and $F$ is representable.'
          - problem: 'Write the full proof that a functor $F\colon\mathcal C\to\mathbf{Set}$ on a small category is representable if and only if its category of elements has an initial object, and that the initial objects are exactly the universal elements of $F$.'
            answer: 'F is representable iff int F has an initial object'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Setup: an object of the category of elements is a pair (X, x) with x in F(X); a morphism from (X, x) to (Y, y) is an arrow h from X to Y with (F h)(x) = y. Step 1 (initial gives universal): let (A, u) be initial. For each element x of F(X), initiality gives a unique arrow h from A to X with (F h)(u) = x. Define a transformation from Hom(A, -) to F by sending h to (F h)(u); the unique-existence clause makes each component a bijection, and naturality in X holds because for any k from X to Y we get (F k)((F h)(u)) = (F(k h))(u). So F is isomorphic to Hom(A, -), and (A, u) is a universal element, hence a representation. Step 2 (universal gives initial): suppose F is isomorphic to Hom(A, -) by a natural isomorphism, and let u be the image of the identity on A. For each x in F(X), the inverse bijection and naturality give exactly one h from A to X with (F h)(u) = x, so there is exactly one morphism from (A, u) to (X, x) in the category of elements; hence (A, u) is initial. Conclusion: the initial objects are exactly the universal elements, so F is representable if and only if its category of elements has an initial object.'
    diagnostic_exemplar:
      problem: "Let $P\\colon\\mathbf{Set}\\to\\mathbf{Set}$ be the covariant power-set functor ($P(S)=\\mathcal P(S)$, $P(f)(T)=f[T]$). Write down the objects and morphisms of its category of elements $\\int P$, and use the initial-object criterion to decide whether $P$ is representable. Justify your verdict."
      answer: "Objects of $\\int P$ are pairs $(S,T)$ with $S$ a set and $T\\subseteq S$; a morphism $(S,T)\\to(S',T')$ is a function $f\\colon S\\to S'$ with $P(f)(T)=f[T]=T'$; the projection $\\int P\\to\\mathbf{Set}$ forgets $T$. Criterion: $P$ is representable iff $\\int P$ has an initial object (an initial object is exactly a universal element). Suppose $(S_0,T_0)$ were initial. There must be a morphism $(S_0,T_0)\\to(\\varnothing,\\varnothing)$, i.e. a function $S_0\\to\\varnothing$, which forces $S_0=\\varnothing$ and hence $T_0=\\varnothing$. But then consider the object $(\\{*\\},\\{*\\})$: the only function $\\varnothing\\to\\{*\\}$ is the empty function, and its image is $\\varnothing\\neq\\{*\\}$, so there is no morphism $(S_0,T_0)\\to(\\{*\\},\\{*\\})$ at all. Hence $\\int P$ has no initial object and $P$ is not representable."
      solution_sketch: "Describe $\\int P$ as a set together with a distinguished subset, then apply the criterion that $P$ is representable iff $\\int P$ has an initial object. Testing a candidate against the object $(\\varnothing,\\varnothing)$ pins it down to $(\\varnothing,\\varnothing)$, and from there nothing maps to $(\\{*\\},\\{*\\})$ because the empty function has empty image."
