unit: adjunctions
course: category-theory
module: "Adjunctions"
topics:
  - id: hom-set-adjunction-definition
    name: The Hom-Set Definition of an Adjunction
    core: true
    difficulty: 0.74
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: hom-functors
        weight: 0.6
        key: true
      - id: natural-isomorphisms
        weight: 0.4
        key: true
      - id: universal-properties
        weight: 0.3
      - id: functors
        weight: 0.2
      - id: product-categories
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Computing transposes
        key_prerequisites: [universal-properties]
        constraints: "Give the transpose in the standard $\\mathrm{Hom}(FC,D)\\cong\\mathrm{Hom}(C,GD)$ direction; either evaluate it on a stated element of a small explicit alphabet or monoid, or read it off from the relevant universal property."
        exemplars:
          - problem: "For $(-)^*\\dashv U$ with $M=(\\mathbb{N},+,0)$, let $f\\colon\\{x,y\\}\\to U M$ be $f(x)=2$, $f(y)=3$. Compute the adjunct homomorphism $\\bar f\\colon\\{x,y\\}^*\\to M$ on the words $xyx$ and $\\varepsilon$."
            answer: "$\\bar f(xyx)=7$ and $\\bar f(\\varepsilon)=0$."
            solution_sketch: "The inverse transpose sends $f$ to the unique homomorphism extending it on letters: $\\bar f(z_1\\cdots z_n)=f(z_1)+\\cdots+f(z_n)$, with the empty word going to the unit. So $\\bar f(xyx)=f(x)+f(y)+f(x)=2+3+2=7$ and $\\bar f(\\varepsilon)=0$. Transposing back restricts $\\bar f$ to one-letter words, recovering $f(x)=2$ and $f(y)=3$."
          - problem: "For the adjunction $\\Delta\\dashv\\times$ between $\\mathcal{C}$ and $\\mathcal{C}\\times\\mathcal{C}$, compute the transpose of a morphism $(f,g)\\colon\\Delta X\\to(A,B)$."
            answer: "$\\Phi(f,g)=\\langle f,g\\rangle\\colon X\\to A\\times B$."
            solution_sketch: "A morphism $\\Delta X=(X,X)\\to(A,B)$ in $\\mathcal{C}\\times\\mathcal{C}$ is a pair $(f\\colon X\\to A,\\ g\\colon X\\to B)$. The product's universal property says such a pair corresponds to a unique morphism $\\langle f,g\\rangle\\colon X\\to A\\times B$ with $\\pi_1\\langle f,g\\rangle=f$ and $\\pi_2\\langle f,g\\rangle=g$. This correspondence is the hom-set bijection $\\mathrm{Hom}(\\Delta X,(A,B))\\cong\\mathrm{Hom}(X,A\\times B)$, so $\\Phi(f,g)=\\langle f,g\\rangle$ and $\\Phi^{-1}(u)=(\\pi_1 u,\\pi_2 u)$."
      - id: kp2
        name: Recognizing an adjunction from a familiar bijection
        key_prerequisites: [natural-isomorphisms]
        constraints: "Identify which functor is left and which is right, and state the bijection in the standard $\\mathrm{Hom}(FC,D)\\cong\\mathrm{Hom}(C,GD)$ form."
        exemplars:
          - problem: "Let U be the forgetful functor from preorders to sets, and let D send a set to its discrete preorder, in which x <= y only when x = y. Take S to be a set with the three elements a, b, c, and take P to be the preorder with the two elements p and q, with p <= q. The familiar bijection for this pair of functors matches the monotone maps from D(S) to P with the functions from S to U(P). How many monotone maps are there from D(S) to P?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the hom-set of monotone maps from the discrete preorder D(S) on a, b, c to the two-element chain p <= q. Step 1 (matching rule): the familiar bijection Hom(D(S), P) = Hom(S, U(P)), read in the standard form Hom(FC, D) = Hom(C, GD) with source object S and target object P, places F = D on the first variable and G = U on the second, so D is the left adjoint and U is the right adjoint. Step 2 (discrete rule): the only relation in D(S) is x <= x, which every function preserves, so the monotone maps from D(S) to P are exactly all functions from the set S to the two-element set U(P). Step 3 (counting rule): the number of functions from a three-element set to a two-element set is 2^3 = 8. The answer is 8."
          - problem: "Let i be the inclusion of the poset of integers into the poset of reals, and let f send each real x to the greatest integer that is <= x. For every integer n and real x the familiar biconditional n <= x if and only if n <= f(x) holds. In a poset each hom-set has at most one element, so this biconditional is itself a hom-set bijection in the standard form Hom(FC, D) = Hom(C, GD). Determine which of the two functors i and f is the left adjoint, and give the largest integer n for which i(n) <= 6.2."
            answer: "adjoint = i; value = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["i"], ["f"]]}, "name": "adjoint"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Full object: the biconditional n <= x if and only if n <= f(x), with i the inclusion of the integers into the reals and f the greatest-integer function. Step 1 (poset rule): each hom-set in a poset has at most one element, so the biconditional is the hom-set bijection Hom(i(n), x) = Hom(n, f(x)). Step 2 (matching rule): reading this against the standard form Hom(FC, D) = Hom(C, GD), the functor applied to the first variable is the left adjoint, so F = i and G = f, that is, i is the left adjoint and f is the right adjoint. Step 3 (adjoint value rule): the largest integer n with i(n) <= 6.2 is the value of the right adjoint at 6.2, the greatest integer <= 6.2, which is 6. The answer is adjoint = i; value = 6."
          - problem: "Let U be the forgetful functor from preorders to sets, and let I send a set to its indiscrete preorder, in which x <= y holds for every pair of elements. Take P to be the preorder with the two elements p and q, with p <= q, and take S to be a set with the three elements a, b, c. The familiar bijection for this pair of functors matches the monotone maps from P to I(S) with the functions from U(P) to S. How many monotone maps are there from P to I(S)?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the hom-set of monotone maps from the two-element chain p <= q into the indiscrete preorder I(S) on a, b, c. Step 1 (matching rule): the familiar bijection Hom(P, I(S)) = Hom(U(P), S), read in the standard form with source object P and target object S, places F = U on the first variable and G = I on the second, so U is the left adjoint and I is the right adjoint. Step 2 (indiscrete rule): in I(S) the relation x <= y holds for every pair, so every function from U(P) to S is monotone, and the monotone maps from P to I(S) are exactly all functions from the two-element set U(P) to the three-element set S. Step 3 (counting rule): the number of functions from a two-element set to a three-element set is 3^2 = 9. The answer is 9."
          - problem: "Let i be the inclusion of the poset of integers into the poset of reals. A student claims that the function r, which sends each real number to the nearest integer and rounds halves upward, is a right adjoint to i. The claim requires the biconditional n <= x if and only if n <= r(x) for every integer n and real x, because in a poset a hom-set bijection is exactly such a biconditional. Test the claim at x = 2.5 and find the smallest integer n for which the two sides of the biconditional disagree."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the biconditional n <= x if and only if n <= r(x) tested at x = 2.5, with r the nearest-integer function that rounds halves upward. Step 1 (poset rule): in a poset each hom-set has at most one element, so the claimed adjunction Hom(i(n), x) = Hom(n, r(x)) is exactly this biconditional. Step 2 (evaluation rule): r(2.5) = 3, because halves round upward. Step 3 (comparison rule): for n = 3 the left side 3 <= 2.5 is false while the right side 3 <= 3 is true, and every integer below 3 makes both sides true. The answer is 3."
          - problem: "Claim: the truncation function t, which deletes the decimal part of a real number, is a right adjoint to the inclusion i of the poset of integers into the poset of reals. Step 1: In a poset each hom-set has at most one element, so the needed bijection Hom(i(n), x) = Hom(n, t(x)) is the biconditional n <= x if and only if n <= t(x). Step 2: At the real x = -1.5, truncation gives t(-1.5) = -1. Step 3: For every integer n, n <= -1.5 holds exactly when n <= -1 holds. Step 4: The biconditional holds for every real x, so t is a right adjoint to i. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Full object: the four-step argument that truncation t is a right adjoint to the inclusion i. Step 1 is valid: in a poset each hom-set has at most one element, so an adjunction bijection there is exactly a biconditional. Step 2 is valid: deleting the decimal part of -1.5 gives -1. Step 3 is the first step that is not valid: for the integer n = -1, the left side -1 <= -1.5 is false while the right side -1 <= -1 is true, so the claimed equivalence fails already at this integer. Step 4 is not the first failure: it only extends the false claim of Step 3 to every real, so it inherits the error of Step 3. The answer is Step 3."
          - problem: "Let c send each real x to the least integer that is >= x, and let i be the inclusion of the poset of integers into the poset of reals. The familiar biconditional c(x) <= n if and only if x <= n holds for every real x and integer n. In a poset each hom-set has at most one element, so this biconditional is itself a hom-set bijection, and it exhibits an adjunction in the standard form Hom(FC, D) = Hom(C, GD) with x in the role of C and n in the role of D. The line that states the bijection in this standard form is missing. Select the missing line."
            answer: "Hom(c(x), n) = Hom(x, i(n))"
            answer_contract: {"kind": "label", "options": [["Hom(c(x), n) = Hom(x, i(n))"], ["Hom(i(n), x) = Hom(n, c(x))"], ["Hom(c(x), n) = Hom(i(n), x)"], ["Hom(x, c(n)) = Hom(n, i(x))"]]}
            solution_sketch: "Full object: the biconditional c(x) <= n if and only if x <= n, with c the least-integer function and i the inclusion of the integers into the reals. Step 1 (poset rule): each hom-set has at most one element, so the biconditional is a hom-set bijection. Step 2 (matching rule): the standard form Hom(FC, D) = Hom(C, GD) with C = x and D = n applies the left adjoint to x and the right adjoint to n, so F = c and G = i, giving Hom(c(x), n) = Hom(x, i(n)). The option Hom(i(n), x) = Hom(n, c(x)) is the floor pattern: it puts the inclusion on the first variable and asserts n <= x if and only if n <= c(x), which fails for x = 2.3 and n = 3. The option Hom(c(x), n) = Hom(i(n), x) applies the inclusion to the wrong variable and asserts c(x) <= n if and only if n <= x, which fails for x = 2.3 and n = 3. The option Hom(x, c(n)) = Hom(n, i(x)) applies each functor to the wrong variable and asserts x <= n if and only if n <= x, which fails for x = 2.3 and n = 2. The answer is Hom(c(x), n) = Hom(x, i(n))."
          - problem: "Write the full proof: the functor that sends a set to its discrete preorder is left adjoint to the forgetful functor from preorders to sets, with the bijection written in the standard Hom(FC, D) = Hom(C, GD) form. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (set up the objects): let S be a set, let P be a preorder, let D(S) be the discrete preorder on S, and let U be the forgetful functor; the claim is the adjunction D -| U. Step 2 (the bijection): a monotone map from D(S) to P is a function on underlying sets that preserves the order, and since the only relation in D(S) is x <= x, every function from S to U(P) preserves it; so the underlying-function assignment is a bijection Hom(D(S), P) = Hom(S, U(P)). Step 3 (standard form): matching this bijection against Hom(FC, D) = Hom(C, GD) with source object S and target object P places F = D on the first variable and G = U on the second, so D is the left adjoint and U is the right adjoint. Step 4 (naturality): for a function g from S to T, precomposing with g on one side corresponds to precomposing with g on the other, and for a monotone map h from P to Q, postcomposing with h corresponds to postcomposing with h, because the same underlying function results in both cases; hence the bijection is natural in both variables. Conclusion: D -| U, with the natural bijection Hom(D(S), P) = Hom(S, U(P)) stated in the standard form."
      - id: kp3
        name: The data and the two naturality conditions
        key_prerequisites: [hom-functors]
        constraints: "Always give the direction of the bijection and check naturality in each variable separately."
        exemplars:
          - problem: "Let C' = {u, v} and C = {a, b} be sets, and let c: C' to C be the function with c(u) = b and c(v) = a. Let h: C* to (N, +, 0) be the monoid homomorphism determined by h(a) = 4 and h(b) = 7, where C* is the free monoid on C. In the free-monoid adjunction, the bijection from Hom(C*, D) to Hom(C, U D) sends a homomorphism to its restriction to one-letter words, and naturality in the C variable asserts that the image of h composed with c* equals the image of h composed with c. Evaluate both sides at the letter u. Find the common value."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full objects: c(u) = b, c(v) = a, and h sends the letter a to 4 and the letter b to 7. Left side: the image of h composed with c* at u equals h(c*(u)) = h(b) = 7, because c* acts letterwise. Right side: the image of h composed with c at u equals h(c(u)) = h(b) = 7, because the bijection restricts h to one-letter words. Both sides agree, which verifies naturality in the C variable, and the common value is 7."
          - problem: "Take the free-monoid adjunction between sets and monoids. Let C = {a}, let h: C* to (N, +, 0) be the monoid homomorphism with h(a) = 5, and let d: (N, +, 0) to (N, +, 0) be the monoid homomorphism d(n) = 3n. The bijection from Hom(C*, D) to Hom(C, U D) sends a homomorphism to its restriction to one-letter words, and naturality in the D variable asserts that the image of d composed with h equals U d composed with the image of h. Evaluate both sides at the letter a. Find the common value."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full objects: h(a) = 5 and d(n) = 3n, with the bijection restricting a homomorphism to one-letter words. Left side: the image of d composed with h at the letter a equals (d composed with h)(a) = d(5) = 15. Right side: U d composed with the image of h at a equals d(h(a)) = d(5) = 15. Both sides agree, which verifies naturality in the D variable, and the common value is 15."
          - problem: "Let P = {0, 1, 2, 3, 4, 5} and Q = {0, 1, 2, ..., 15} carry the usual order, and let F: P to Q be the order-preserving map F(c) = 3c. In a poset every hom-set has at most one element, and F has a right adjoint G: Q to P via bijections from Hom_Q(F(c), d) to Hom_P(c, G(d)) that send the unique map to the unique map; so G(d) is the largest c with F(c) at most d. Find G(7)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The bijection from Hom_Q(F(c), d) to Hom_P(c, G(d)) is nonempty on the left exactly when 3c is at most d. By the hom-set definition, G(d) is therefore the largest c with 3c at most 7. Check: 3 times 2 gives 6, which is at most 7, and 3 times 3 gives 9, which exceeds 7. So the largest such c is 2, and the answer is 2."
          - problem: "Let P = {1, 2, 3, 4} carry the usual order and let F: P to P be the order-preserving map F(c) = min(c, 2). Every hom-set in P has at most one element, and F has a right adjoint G: P to P given by the bijections from Hom(F(c), d) to Hom(c, G(d)); thus G(d) is the largest c with F(c) at most d. Find G(3)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the hom-set bijection from Hom(F(c), d) to Hom(c, G(d)), the value G(3) is the largest c with min(c, 2) at most 3. For c = 1 the value min(1, 2) = 1 is at most 3, and likewise for c = 2, 3, 4 the value is 2, at most 3. So every c qualifies, and the largest one is the top element 4. The answer is 4."
          - problem: "Claim: a family of bijections from Hom_D(F C, D) to Hom_C(C, G D) is natural in the variable C. Step 1: take a map c: C' to C in C and a map h: F C to D in D. Step 2: the composite h after F c is a map from F C' to D, so it lies in Hom_D(F C', D). Step 3: naturality in C asserts the equality of the C,D-component of h after F c with the C,D-component of h composed with c. Step 4: since c and h were arbitrary, the family is natural in C. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is the correct setup for checking naturality in one variable. Step 2 is valid: h after F c is indeed a map out of F C', so it belongs to Hom_D(F C', D). Step 3 is not valid: h after F c lives in Hom_D(F C', D), so the left side must use the C-prime,D-component, which is a different component of the family; as written, the C,D-component is applied to a map it does not accept. Step 4 is valid once Step 3 is corrected. The answer is Step 3."
          - problem: "Let F: (Z, at most) to (Q, at most) be the inclusion of the integers into the rationals with their usual orders. The map F has a right adjoint G, the floor map, and the adjunction gives a bijection from Hom_Q(F(c), d) to Hom_Z(c, G(d)) for each integer c and rational d; each hom-set is empty or a singleton, which makes naturality automatic in each variable separately. For c = 1 and d = 2.5, decide whether the hom-set Hom_Q(F(c), d) is nonempty, and find G(d)."
            answer: "verdict = nonempty; g = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["nonempty"], ["empty"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "g"}]}
            solution_sketch: "The hom-set Hom_Q(F(1), 2.5) is nonempty because 1 is at most 2.5 in Q. The bijection from Hom_Q(F(c), d) to Hom_Z(c, G(d)) then forces Hom_Z(1, G(2.5)) to be nonempty as well, and by the hom-set definition G(d) is the largest integer m with m at most d, so G(2.5) = 2. Naturality in c and in d holds automatically because every hom-set has at most one element. The answer is verdict = nonempty; g = 2."
          - problem: "Write the full proof: the order-preserving map F: (N, at most) to (N, at most) with F(c) = 2c has the right adjoint G(d) = floor(d/2), with bijections from Hom(2c, d) to Hom(c, G(d)) that are natural in c and in d separately. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Data: both categories are the poset (N, at most) viewed as a category, F(c) = 2c is order-preserving, and G(d) = floor(d/2). Step 1 (the bijection and its direction): 2c is at most d exactly when c is at most floor(d/2), so the hom-set Hom(2c, d) is nonempty exactly when Hom(c, G(d)) is; each has at most one element, so sending the unique map to the unique map is a bijection from Hom(2c, d) to Hom(c, G(d)). Step 2 (naturality in c, checked alone): for c' at most c and a map h from 2c to d, the two sides of the naturality equation both lie in the hom-set Hom(c', G(d)), which has at most one element, so they are equal. Step 3 (naturality in d, checked alone): for d at most d' and h from 2c to d, both sides of the naturality equation lie in Hom(c, G(d')), again a set with at most one element, so they are equal. Conclusion: the functors F and G together with these bijections satisfy the hom-set definition of the adjunction F left adjoint to G, with naturality verified in each variable separately."
    diagnostic_exemplar:
      problem: "Let $i\\colon(\\mathbb{Z},\\le)\\to(\\mathbb{R},\\le)$ be the inclusion of posets. Prove that $i\\dashv\\lfloor-\\rfloor$, stating the bijection in the standard $\\mathrm{Hom}(FC,D)\\cong\\mathrm{Hom}(C,GD)$ form and saying why naturality is automatic."
      answer: "For $n\\in\\mathbb{Z}$ and $x\\in\\mathbb{R}$: $i(n)\\le x\\iff n\\le\\lfloor x\\rfloor$, because $\\lfloor x\\rfloor$ is the greatest integer $\\le x$ (if $n\\le x$ then $n\\le\\lfloor x\\rfloor$; conversely $n\\le\\lfloor x\\rfloor\\le x$). In poset categories hom-sets have at most one element, so this biconditional IS the hom-set bijection $\\mathrm{Hom}_{\\mathbb R}(i(n),x)\\cong\\mathrm{Hom}_{\\mathbb Z}(n,\\lfloor x\\rfloor)$, matching the standard form with $F=i$ (left adjoint) and $G=\\lfloor-\\rfloor$ (right adjoint); naturality is automatic since parallel maps of thin categories are equal."
      solution_sketch: "Prove the biconditional $n\\le x\\iff n\\le\\lfloor x\\rfloor$ from the defining property of the floor as the greatest integer below $x$. In a thin category a biconditional is the hom-set bijection, and naturality is vacuous because parallel arrows in a poset are equal."
    anki_seeds:
      - front: "An adjunction $F\\dashv G$ is..."
        back: "a natural isomorphism $\\mathrm{Hom}_{\\mathcal D}(FC,D)\\cong\\mathrm{Hom}_{\\mathcal C}(C,GD)$ in $C,D$; $F$ is the left adjoint, $G$ the right."
        type: basic
      - front: "In $F\\dashv G$, which side of the bijection does the left adjoint act on?"
        back: "the source: $\\mathrm{Hom}(FC,D)$ — the left adjoint is applied to the left-hand object."
        type: basic
      - front: "Naturality of $\\Phi$ in both variables, in one equation?"
        back: "$\\Phi(d\\circ h\\circ Fc)=Gd\\circ\\Phi(h)\\circ c$."
        type: basic

  - id: adjunctions
    name: Adjunctions
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: hom-set-adjunction-definition
        weight: 0.6
        key: true
      - id: hom-functors
        weight: 0.4
        key: true
      - id: natural-isomorphisms
        weight: 0.4
        key: true
      - id: functors
        weight: 0.2
      - id: universal-properties
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Transposes and the unit
        key_prerequisites: [natural-isomorphisms]
        constraints: "Work from the bijection $\\Phi$ alone; the unit must be produced as $\\Phi(1_{FC})$ and every naturality step must say which variable it uses."
        exemplars:
          - problem: "Given $F\\dashv G$, define the transpose of a morphism and compute the transpose of $1_{FC}$."
            answer: "$h\\colon FC\\to D$ transposes to $\\Phi(h)\\colon C\\to GD$; $\\Phi(1_{FC})=\\eta_C\\colon C\\to GFC$, the unit."
            solution_sketch: "Each $h\\colon FC\\to D$ has transpose $\\Phi_{C,D}(h)\\colon C\\to GD$, and each $k\\colon C\\to GD$ an adjunct $\\Phi^{-1}(k)\\colon FC\\to D$, mutually inverse. Taking $h=1_{FC}$ gives $\\eta_C:=\\Phi_{C,FC}(1_{FC})\\colon C\\to GFC$; naturality of $\\Phi$ makes $\\eta\\colon 1_{\\mathcal C}\\Rightarrow GF$ a natural transformation, the unit."
          - problem: "Prove the unit $\\eta_C=\\Phi(1_{FC})$ is natural: for $c\\colon C\\to C'$, $GFc\\circ\\eta_C=\\eta_{C'}\\circ c$."
            answer: "Both sides equal $\\Phi_{C,FC'}(Fc)$, by naturality of $\\Phi$ in each variable."
            solution_sketch: "Naturality of $\\Phi$ in the first variable gives $\\eta_{C'}\\circ c=\\Phi_{C',FC'}(1_{FC'})\\circ c=\\Phi_{C,FC'}(1_{FC'}\\circ Fc)=\\Phi_{C,FC'}(Fc)$. Naturality in the second variable, with $d=Fc\\colon FC\\to FC'$, gives $GFc\\circ\\eta_C=GFc\\circ\\Phi_{C,FC}(1_{FC})=\\Phi_{C,FC'}(Fc\\circ 1_{FC})=\\Phi_{C,FC'}(Fc)$. The two agree, so $\\eta\\colon 1_{\\mathcal C}\\Rightarrow GF$ is a natural transformation."
      - id: kp2
        name: The universal-arrow formulation
        key_prerequisites: [universal-properties]
        constraints: "State the factorization (existence + uniqueness) explicitly and identify how it recovers the hom-set bijection; the counit version is obtained by dualizing."
        exemplars:
          - problem: "View the chain $P = \\{1,2,3,4\\}$ and the chain $Q = \\{1,2,3,4,5,6\\}$ as categories: an arrow from $c$ to $d$ is the relation $c \\le d$. Let $G: Q \\to P$ be the monotone map with $G(1)=1$, $G(2)=1$, $G(3)=2$, $G(4)=3$, $G(5)=3$, $G(6)=4$. Its left adjoint $F$ comes with the universal arrow $\\eta_3 : 3 \\to G(F(3))$: every arrow $k : 3 \\to G(d)$ factors as $k = G(h) \\circ \\eta_3$ for a unique $h : F(3) \\to d$, so an arrow $3 \\to G(d)$ exists exactly when an arrow $F(3) \\to d$ exists. Find $F(3)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the chain-categories with $G(1)=1$, $G(2)=1$, $G(3)=2$, $G(4)=3$, $G(5)=3$, $G(6)=4$ and the universal arrow $\\eta_3 : 3 \\to G(F(3))$. Rule of the universal property: every arrow $3 \\to G(d)$ factors uniquely through $\\eta_3$, so arrows $3 \\to G(d)$ and arrows $F(3) \\to d$ exist for the same objects $d$, which makes $F(3)$ the least $d$ admitting an arrow $3 \\to G(d)$. Scan by the rule of order: $G(1)=1$, $G(2)=1$ and $G(3)=2$ are too small, while $G(4)=3$ works. The answer is 4."
          - problem: "Turn the chains $P = \\{1,2,3,4,5\\}$ and $Q = \\{1,2,3,4\\}$ into categories by reading each inequality $c \\le d$ as an arrow $c \\to d$. Let $F: P \\to Q$ be the monotone map with $F(1)=1$, $F(2)=2$, $F(3)=2$, $F(4)=3$, $F(5)=3$. Dualizing the unit formulation, the right adjoint $G$ comes with the couniversal arrow $\\varepsilon_2 : F(G(2)) \\to 2$: every arrow $h : F(c) \\to 2$ factors as $h = \\varepsilon_2 \\circ F(k)$ for a unique $k : c \\to G(2)$, so an arrow $F(c) \\to 2$ exists exactly when an arrow $c \\to G(2)$ exists. Find $G(2)$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the chain-categories with $F(1)=1$, $F(2)=2$, $F(3)=2$, $F(4)=3$, $F(5)=3$ and the couniversal arrow $\\varepsilon_2 : F(G(2)) \\to 2$. Rule of dualizing: the counit version reverses the universal factorization, so the objects $c$ with an arrow $F(c) \\to 2$ are exactly the objects $c \\le G(2)$, making $G(2)$ the greatest $c$ with $F(c) \\le 2$. Scan by the rule of order: $F(1)=1$, $F(2)=2$, $F(3)=2$ pass, while $F(4)=3$ fails. The answer is 3."
          - problem: "Make categories out of the chains $P = \\{1,2,3\\}$ and $Q = \\{1,2,3,4,5,6,7\\}$, with one arrow $c \\to d$ whenever $c \\le d$. Let $G: Q \\to P$ be the monotone map with $G(1)=1$, $G(2)=1$, $G(3)=2$, $G(4)=2$, $G(5)=2$, $G(6)=3$, $G(7)=3$. The universal arrow $\\eta_2 : 2 \\to G(F(2))$ gives, for each object $d$ of $Q$, a bijection between the arrows $2 \\to G(d)$ and the arrows $F(2) \\to d$. How many arrows $h : F(2) \\to d$ are there in total, taken over all seven objects $d$ of $Q$?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the chain-categories with $G(1)=1$, $G(2)=1$, $G(3)=2$, $G(4)=2$, $G(5)=2$, $G(6)=3$, $G(7)=3$, the universal arrow $\\eta_2 : 2 \\to G(F(2))$, and the hom-set bijection between arrows $2 \\to G(d)$ and arrows $F(2) \\to d$. Step 1 (rule of the universal property): $F(2)$ is the least $d$ with $2 \\le G(d)$; since $G(3)=2$, we get $F(2)=3$. Step 2 (rule of order together with the bijection): arrows $F(2) \\to d$ exist for the objects $d \\ge 3$, namely $3,4,5,6,7$, and the bijection confirms the same count on the side of the arrows $2 \\to G(d)$. The answer is 5."
          - problem: "Let $C$ be the graph with one vertex and two loops $x$ and $y$, and let $F(C)$ be the free category on $C$: one object, arrows the words in $x$ and $y$, composition by concatenation, with unit $\\eta_C$ sending each loop to its one-letter word. Let $D$ be the one-object category whose arrows are $0,1,2,3$, composed by addition modulo $4$, and let $G$ be the underlying-graph functor. The universal property of $\\eta_C$ states that the arrow $k : C \\to G(D)$ with $k(x)=1$ and $k(y)=3$ factors as $k = G(h) \\circ \\eta_C$ for a unique functor $h : F(C) \\to D$. Compute $h(xyyx)$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the free category $F(C)$ of words in $x$ and $y$ under concatenation, the one-object category with arrows $0,1,2,3$ composed by addition modulo $4$, and the values $k(x)=1$, $k(y)=3$. Rule of the universal property: the unique functor $h$ with $k = G(h) \\circ \\eta_C$ sends a one-letter word to the label of that letter, and a concatenation to the composition, that is, to the sum of the labels modulo $4$. Compute by the rule of modular addition: $1+3+3+1 = 8$, which is divisible by $4$. The answer is 0."
          - problem: "Claim: if $F$ is left adjoint to $G$ with unit $\\eta$, then every arrow $k : C \\to G(D)$ factors as $k = G(h) \\circ \\eta_C$ for a unique arrow $h : F(C) \\to D$. Argument: Step 1: the adjunction gives a bijection $\\phi$ from arrows $F(C) \\to D$ to arrows $C \\to G(D)$. Step 2: since $k$ is an arrow $C \\to G(D)$, define $h := \\phi(k)$. Step 3: then $\\phi(h) = k$, so $G(h) \\circ \\eta_C = k$. Step 4: the arrow $h$ is unique because $\\phi$ is a bijection. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Full object: the claim that every arrow $k : C \\to G(D)$ factors uniquely through the unit, argued via the bijection $\\phi$. Step 1 is valid: it is exactly the hom-set bijection of the adjunction. Step 2 is the first invalid step: $\\phi$ takes arrows $F(C) \\to D$ as input, while $k$ is an arrow $C \\to G(D)$, so $\\phi(k)$ is undefined; the correct definition is $h = \\phi^{-1}(k)$. Step 3 is not the first failure: it only carries the broken definition forward, and with the corrected $h$ it becomes the true naturality computation. Step 4 is valid: uniqueness follows because a bijection is injective. The answer is Step 2."
          - problem: "Uniqueness of the factorization in the universal-arrow formulation. Step 1: let $k : C \\to G(D)$ be any arrow. Step 2: suppose the arrows $h, h' : F(C) \\to D$ satisfy $k = G(h) \\circ \\eta_C$ and $k = G(h') \\circ \\eta_C$. Step 3: the adjunction bijection $\\phi$ from arrows $F(C) \\to D$ to arrows $C \\to G(D)$ satisfies $\\phi(h) = G(h) \\circ \\eta_C$, hence $\\phi(h) = k = \\phi(h')$. Step 4: therefore $h = h'$. Which hypothesis does Step 4 use?"
            answer: "injectivity of phi"
            answer_contract: {"kind": "label", "options": [["injectivity of phi"], ["naturality of phi in D"], ["surjectivity of phi"], ["functoriality of G"]]}
            solution_sketch: "Full object: the uniqueness half of the universal factorization, with two arrows $h$ and $h'$ from $F(C)$ to $D$ satisfying $G(h) \\circ \\eta_C = k = G(h') \\circ \\eta_C$. Rule of the hom-set bijection: Step 3 turns both factorizations into $\\phi(h) = k = \\phi(h')$. Step 4 then concludes $h = h'$ from equal outputs of $\\phi$, which is injectivity of $\\phi$. The option 'naturality of phi in D' is the tool used inside Step 3 to obtain $\\phi(h) = G(h) \\circ \\eta_C$, not in Step 4. The option 'surjectivity of phi' gives existence of a factorization for every $k$, never uniqueness. The option 'functoriality of G' preserves composition but cannot compare $h$ with $h'$. The answer is injectivity of phi."
          - problem: "Write the full proof: let $F : \\mathcal{C} \\to \\mathcal{D}$ and $G : \\mathcal{D} \\to \\mathcal{C}$ be functors with $F$ left adjoint to $G$ and unit $\\eta$. Prove that for every object $C$ of $\\mathcal{C}$ the arrow $\\eta_C : C \\to G(F(C))$ is universal from $C$ to $G$: every arrow $k : C \\to G(D)$ factors as $k = G(h) \\circ \\eta_C$ for a unique arrow $h : F(C) \\to D$, and show that the assignment sending $k$ to $h$ recovers the hom-set bijection; then obtain the counit version by dualizing. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full statement: $F \\dashv G$ gives a bijection $\\phi$ from arrows $F(C) \\to D$ to arrows $C \\to G(D)$, natural in $C$ and $D$, with unit $\\eta_C = \\phi(\\mathrm{id}_{F(C)})$. Step 1 (existence): given $k : C \\to G(D)$, set $h = \\phi^{-1}(k)$; naturality of $\\phi$ in $D$ applied to $h$ yields $\\phi(h) = G(h) \\circ \\phi(\\mathrm{id}_{F(C)}) = G(h) \\circ \\eta_C$, hence $k = G(h) \\circ \\eta_C$. Step 2 (uniqueness): if also $k = G(h') \\circ \\eta_C$, the same naturality gives $\\phi(h') = k = \\phi(h)$, and injectivity of $\\phi$ forces $h' = h$. Step 3 (recovering the bijection): the map sending $k$ to $h$ is exactly $\\phi^{-1}$, so the unique factorization is the hom-set bijection expressed through the unit. Step 4 (dualizing): reversing every arrow swaps $F$ with $G$ and $\\eta$ with the counit $\\varepsilon$, giving the couniversal form: every $h : F(C) \\to D$ factors as $h = \\varepsilon_D \\circ F(k)$ for a unique $k : C \\to G(D)$. This completes the proof; see the solution for the comparison."
      - id: kp3
        name: Uniqueness and composition of adjoints
        key_prerequisites: [hom-set-adjunction-definition]
        constraints: "Chain hom-set bijections and track naturality in the free variable at every step."
        exemplars:
          - problem: "Prove that left adjoints are unique up to natural isomorphism: if $F\\dashv G$ and $F'\\dashv G$ then $F\\cong F'$."
            answer: "$\\mathrm{Hom}(FC,-)\\cong\\mathrm{Hom}(C,G-)\\cong\\mathrm{Hom}(F'C,-)$, so $FC\\cong F'C$ by Yoneda, naturally in $C$."
            solution_sketch: "For each $C$ the two adjunctions give natural isomorphisms $\\mathrm{Hom}_{\\mathcal D}(FC,-)\\cong\\mathrm{Hom}_{\\mathcal C}(C,G-)\\cong\\mathrm{Hom}_{\\mathcal D}(F'C,-)$ of functors $\\mathcal D\\to\\mathbf{Set}$. By the Yoneda lemma (the Yoneda embedding is fully faithful) this forces $FC\\cong F'C$, and the isomorphism is natural in $C$ since all the bijections are. Hence $F\\cong F'$; dually right adjoints are unique up to isomorphism."
          - problem: "Prove that adjunctions compose: if $F\\dashv G$ between $\\mathcal C$ and $\\mathcal D$, and $F'\\dashv G'$ between $\\mathcal D$ and $\\mathcal E$, then $F'F\\dashv GG'$."
            answer: "Chain the two bijections: $\\mathrm{Hom}_{\\mathcal E}(F'FC,E)\\cong\\mathrm{Hom}_{\\mathcal D}(FC,G'E)\\cong\\mathrm{Hom}_{\\mathcal C}(C,GG'E)$."
            solution_sketch: "Apply the second adjunction with the object $FC$ of $\\mathcal D$: $\\mathrm{Hom}_{\\mathcal E}(F'(FC),E)\\cong\\mathrm{Hom}_{\\mathcal D}(FC,G'E)$, natural in $FC$ and $E$. Then apply the first adjunction with the object $G'E$ of $\\mathcal D$: $\\mathrm{Hom}_{\\mathcal D}(FC,G'E)\\cong\\mathrm{Hom}_{\\mathcal C}(C,G(G'E))$, natural in $C$ and $G'E$. Composing two natural bijections gives a bijection $\\mathrm{Hom}_{\\mathcal E}((F'F)C,E)\\cong\\mathrm{Hom}_{\\mathcal C}(C,(GG')E)$ natural in $C$ and $E$, since each step is natural and $F$, $G'$ are functors. Hence $F'F\\dashv GG'$: adjunctions compose, left adjoints with left adjoints and right with right."
    diagnostic_exemplar:
      problem: "Let $F\\dashv G$ be an adjunction with counit $\\varepsilon$. Prove that $G$ is faithful if and only if every component $\\varepsilon_D$ is an epimorphism."
      answer: "Write $\\Phi\\colon\\mathrm{Hom}_{\\mathcal D}(FC,D')\\cong\\mathrm{Hom}_{\\mathcal C}(C,GD')$ for the adjunction bijection, so $\\Phi^{-1}(k)=\\varepsilon_{D'}\\circ Fk$. Fix $h\\colon D\\to D'$ and apply this at $C=GD$, $k=Gh$: $\\Phi^{-1}(Gh)=\\varepsilon_{D'}\\circ FG(h)=h\\circ\\varepsilon_D$, the last step being naturality of $\\varepsilon\\colon FG\\Rightarrow 1_{\\mathcal D}$ at $h$. Since $\\Phi^{-1}\\colon\\mathrm{Hom}_{\\mathcal C}(GD,GD')\\to\\mathrm{Hom}_{\\mathcal D}(FGD,D')$ is a bijection, for $h,h'\\colon D\\to D'$ we get $Gh=Gh'\\iff h\\circ\\varepsilon_D=h'\\circ\\varepsilon_D$. If $G$ is faithful, then $h\\circ\\varepsilon_D=h'\\circ\\varepsilon_D$ gives $Gh=Gh'$ and hence $h=h'$, so $\\varepsilon_D$ is right-cancellable, i.e. an epimorphism, for every $D$. Conversely if every $\\varepsilon_D$ is epi and $Gh=Gh'$, then $h\\circ\\varepsilon_D=h'\\circ\\varepsilon_D$ and cancelling $\\varepsilon_D$ gives $h=h'$, so $G$ is faithful."
      solution_sketch: "Compute $\\Phi^{-1}(Gh)$ two ways: the formula $\\varepsilon\\circ F(-)$ together with naturality of $\\varepsilon$ at $h$ turns it into $h\\circ\\varepsilon_D$. Since $\\Phi^{-1}$ is a bijection, $Gh=Gk$ is equivalent to $h\\circ\\varepsilon_D=k\\circ\\varepsilon_D$, and that equivalence is exactly the statement that $G$ is faithful iff $\\varepsilon_D$ is right-cancellable."
    anki_seeds:
      - front: "The unit of $F\\dashv G$ is the transpose of {{c1::$1_{FC}$}}, giving $\\eta_C\\colon C\\to GFC$."
        back: "$1_{FC}$"
        type: cloze
      - front: "$F$ is left adjoint to $G$ iff each $\\eta_C$ is what kind of arrow?"
        back: "a universal arrow from $C$ to $G$: every $k\\colon C\\to GD$ is $Gh\\circ\\eta_C$ for a unique $h$."
        type: basic
      - front: "If $F\\dashv G$ and $F'\\dashv G'$ are composable, what is the composite adjunction?"
        back: "$F'F\\dashv GG'$."
        type: basic

  - id: adjunction-examples
    name: Examples of Adjunctions
    core: true
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: adjunctions
        weight: 0.6
        key: true
      - id: products-coproducts
        weight: 0.3
        key: true
      - id: exponential-objects
        weight: 0.3
      - id: hom-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Product, diagonal, coproduct adjoints
        key_prerequisites: [products-coproducts]
        constraints: "Derive each adjunction by matching a (co)product universal property against the standard hom-set form; unit/counit computations must come out as transposes of identities."
        exemplars:
          - problem: "A map Delta X to (A, B) in the category of sets is a pair of functions (f from X to A, g from X to B), and the product universal property matches such pairs with single functions from X to A x B, which is the hom-set form of Delta being left adjoint to the product. Take X with 3 elements, A with 2 elements, and B with 4 elements. How many functions from X to A x B are there?"
            answer: "512"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full bijection first: Hom(Delta X, (A, B)) is Hom(X, A) times Hom(X, B), which equals Hom(X, A x B) by the product universal property, so the two sides have the same size. Count the left side as pairs: functions X to A give 2^3 = 8 and functions X to B give 4^3 = 64, so there are 8 x 64 pairs. Count the right side directly: A x B has 8 elements, so functions X to A x B give 8^3. Both counts give 512, and the answer is 512."
          - problem: "In the category of sets, the unit of the adjunction Delta -| product at a set X is the transpose of the identity map on the pair (X, X), that is, the function eta_X from X to X x X obtained from the pair of identity functions. Take X = {1, 2}. Give eta_X(2) as (a, b)."
            answer: "(2, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Start from the full object: the identity map on Delta X = (X, X) is the pair (1_X, 1_X) of identity functions. Apply the bijection Hom(Delta X, (X, X)) to Hom(X, X x X): the transpose of the pair (1_X, 1_X) is the product map <1_X, 1_X>, the diagonal function x to (x, x), since the unit is always a transpose of an identity. Evaluate at 2: eta_X(2) = (2, 2). The answer is (2, 2)."
          - problem: "Under the adjunction Delta -| product, a function h from X to A x B corresponds to a pair of functions (f from X to A, g from X to B) by the inverse of the hom-set bijection. Let X = {0, 1}, A = {0, 1, 2}, B = {0, 1}, and let h(0) = (2, 1) and h(1) = (0, 0). Give the pair (f(0), g(0)) as (a, b)."
            answer: "(2, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "State the full inverse map first: the bijection from Hom(X, A x B) to Hom(Delta X, (A, B)) sends h to the pair (pi_A composed with h, pi_B composed with h), where pi_A and pi_B are the product projections. So f = pi_A composed with h and g = pi_B composed with h. Evaluate at 0: h(0) = (2, 1), so f(0) = 2 and g(0) = 1. The answer is (2, 1)."
          - problem: "View the divisibility order on the set {1, 2, 3, 4, 6, 12} as a category: a product of two elements is their greatest common divisor, and the diagonal functor is left adjoint to this product functor, since x divides a and b exactly when x divides their meet. Find the value of the right adjoint to the diagonal at the pair (4, 6)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a poset seen as a category, the adjunction Delta -| meet reads x <= a meet b if and only if x <= a and x <= b, which is exactly the universal property of the meet, so the right adjoint to the diagonal at a pair is that pair's meet. Here the meet of 4 and 6 in the divisibility order is their greatest common divisor. The common divisors of 4 and 6 are 1 and 2, and the greater under divisibility is 2. The answer is 2."
          - problem: "Claim: the coproduct functor is right adjoint to the diagonal. Step 1: this would require natural bijections between Hom(Delta X, (A, B)) and Hom(X, A + B). Step 2: a map Delta X to (A, B) is a pair of maps (f from X to A, g from X to B). Step 3: a pair of maps (f from X to A, g from X to B) is the same data as a single map X to A + B. Step 4: hence the coproduct is right adjoint to the diagonal. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly states the hom-set requirement for the claimed adjunction Delta -| (+). Step 2 correctly unfolds a map out of Delta X as a pair. Step 3 is not valid: by the product universal property a pair of maps X to A and X to B is a single map X to A x B, while the coproduct universal property says a pair of maps A to X and B to X is a single map A + B to X, the opposite direction, so a pair X to A, X to B is not a map X to A + B. Step 4 merely draws the conclusion of the false Step 3. The answer is Step 3."
          - problem: "The coproduct is left adjoint to the diagonal: a function from A + B to X is the same data as a pair of functions (f from A to X, g from B to X), which matches Hom(A + B, X) against Hom((A, B), Delta X). Take A with 2 elements, B with 3 elements, and X with 2 elements. How many functions from A + B to X are there?"
            answer: "32"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full bijection first: Hom(A + B, X) equals Hom((A, B), Delta X), the set of pairs (A to X, B to X), by the coproduct universal property, so both sides have the same size. Count the pairs: functions A to X give 2^2 = 4 and functions B to X give 2^3 = 8. The total number of pairs is 4 x 8 = 32, so there are also 32 functions A + B to X. The answer is 32."
          - problem: "Write the full proof: the diagonal functor Delta from C to C x C has a right adjoint given by the product and a left adjoint given by the coproduct, by matching each (co)product universal property against the standard hom-set form of an adjunction. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: recall the hom-set form, an adjunction F -| G requires natural bijections Hom(F X, Y) and Hom(X, G Y). Step 2: for the right adjoint, a map Delta X to (A, B) in C x C is by definition a pair (f : X to A, g : X to B), and the product universal property says such pairs correspond uniquely to maps X to A x B, naturally in X, A and B; hence Delta -| (x). Step 3: the unit eta_X is the transpose of the identity 1_(X,X), the diagonal <1_X, 1_X> : X to X x X, and the counit epsilon_(A,B) is the transpose of 1_(A x B), the pair of projections (pi_A, pi_B). Step 4: dually, a map (A, B) to Delta X is a pair (A to X, B to X), and the coproduct universal property turns it into one map A + B to X, naturally; hence (+) -| Delta. Step 5: since each unit and counit component is a transpose of an identity, the triangle identities hold, and together (+) -| Delta -| (x)."
      - id: kp2
        name: The currying adjunction
        key_prerequisites: [products-coproducts]
        constraints: "The adjunction is $(-\\times A)\\dashv(-)^A$ with $A$ fixed; isomorphism-of-objects conclusions must pass through a natural bijection of hom-sets and cite Yoneda/representability."
        exemplars:
          - problem: "Exhibit the adjunction $(-\\times A)\\dashv(-)^A$ and name its unit and counit."
            answer: "$\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$; unit is $\\lambda$-abstraction, counit is evaluation."
            solution_sketch: "Fix $A$. Currying gives a bijection $\\mathrm{Hom}(X\\times A,B)\\cong\\mathrm{Hom}(X,B^A)$ natural in $X$ and $B$, so $(-\\times A)\\dashv(-)^A$. The counit is $\\mathrm{ev}\\colon B^A\\times A\\to B$, and the unit is the map $X\\to(X\\times A)^A$ sending $x\\mapsto(a\\mapsto(x,a))$."
          - problem: "Use the currying adjunction to prove the exponential law $C^{A\\times B}\\cong(C^B)^A$ in a cartesian closed category."
            answer: "Iterate $(-\\times A)\\dashv(-)^A$ with associativity of $\\times$, then apply Yoneda."
            solution_sketch: "For all $X$: $\\mathrm{Hom}(X,C^{A\\times B})\\cong\\mathrm{Hom}(X\\times(A\\times B),C)\\cong\\mathrm{Hom}((X\\times A)\\times B,C)\\cong\\mathrm{Hom}(X\\times A,C^B)\\cong\\mathrm{Hom}(X,(C^B)^A)$, naturally in $X$, using currying twice and associativity of the product. By the Yoneda lemma the representing objects agree: $C^{A\\times B}\\cong(C^B)^A$."
      - id: kp3
        name: A free-forgetful example
        key_prerequisites: [adjunctions]
        constraints: "Free monoids or free groups only; the bijection argument must show both that restriction to generators is well defined and that extension from generators is unique."
        exemplars:
          - problem: "Show the free-monoid functor is left adjoint to the forgetful $U\\colon\\mathbf{Mon}\\to\\mathbf{Set}$."
            answer: "$\\mathrm{Hom}_{\\mathbf{Mon}}(X^*,M)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UM)$: a homomorphism out of $X^*$ is fixed by where letters go."
            solution_sketch: "A monoid homomorphism $X^*\\to M$ is determined by its values on single letters (a function $X\\to UM$), and any function $f\\colon X\\to UM$ extends uniquely by $x_1\\cdots x_n\\mapsto f(x_1)\\cdots f(x_n)$. This bijection is natural, so $(-)^*\\dashv U$; the unit $\\eta_X\\colon X\\to U(X^*)$ is the insertion of letters."
          - problem: "Show the free-group functor $F$ is left adjoint to the forgetful $U\\colon\\mathbf{Grp}\\to\\mathbf{Set}$."
            answer: "$\\mathrm{Hom}_{\\mathbf{Grp}}(FX,G)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UG)$: a homomorphism out of $FX$ is fixed by where the generators go."
            solution_sketch: "$FX$ is the group of reduced words in $X\\sqcup X^{-1}$. A homomorphism $FX\\to G$ is determined by the images of the generators $x\\in X$ (arbitrary elements of $UG$), and any function $f\\colon X\\to UG$ extends uniquely to a homomorphism sending each word to the corresponding product. This bijection is natural in $X$ and $G$, so $F\\dashv U$; the unit $\\eta_X\\colon X\\to U(FX)$ inserts the generators."
    diagnostic_exemplar:
      problem: "Using the currying adjunction $(-\\times A)\\dashv(-)^A$ and associativity of the product, prove the exponential law $C^{A\\times B}\\cong(C^B)^A$ in a cartesian closed category."
      answer: "For every $X$: $\\mathrm{Hom}(X,C^{A\\times B})\\cong\\mathrm{Hom}(X\\times(A\\times B),C)\\cong\\mathrm{Hom}((X\\times A)\\times B,C)\\cong\\mathrm{Hom}(X\\times A,C^B)\\cong\\mathrm{Hom}(X,(C^B)^A)$ — uncurry, reassociate, curry twice — each step natural in $X$. Two objects representing the same functor are isomorphic (Yoneda), so $C^{A\\times B}\\cong(C^B)^A$."
      solution_sketch: "Do not construct a map between the two objects directly. Chain hom-set bijections at an arbitrary $X$ — uncurry, reassociate the product, curry twice — checking each step is natural in $X$; Yoneda then upgrades the isomorphism of representables to an isomorphism of the objects themselves."
    anki_seeds:
      - front: "The chain of adjoints around the diagonal functor?"
        back: "$(+)\\dashv\\Delta\\dashv(\\times)$: coproduct is left adjoint, product is right adjoint to $\\Delta$."
        type: basic
      - front: "Currying is the adjunction {{c1::$(-\\times A)\\dashv(-)^A$}} with counit evaluation."
        back: "$(-\\times A)\\dashv(-)^A$"
        type: cloze

  - id: unit-counit
    name: Unit and Counit
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: adjunctions
        weight: 0.6
        key: true
      - id: natural-transformations
        weight: 0.3
        key: true
      - id: adjunction-examples
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Defining unit and counit
        key_prerequisites: [adjunctions]
        constraints: "Define $\\eta,\\varepsilon$ as transposes of identities; concrete computations only for the free-monoid adjunction, evaluated on explicit letters/words."
        exemplars:
          - problem: "Define the unit $\\eta$ and counit $\\varepsilon$ of $F\\dashv G$ from the hom-set bijection $\\Phi$."
            answer: "$\\eta_C=\\Phi(1_{FC})\\colon C\\to GFC$; $\\varepsilon_D=\\Phi^{-1}(1_{GD})\\colon FGD\\to D$."
            solution_sketch: "With $\\Phi\\colon\\mathrm{Hom}(FC,D)\\cong\\mathrm{Hom}(C,GD)$, set $\\eta_C=\\Phi_{C,FC}(1_{FC})\\colon C\\to GFC$ and $\\varepsilon_D=\\Phi^{-1}_{GD,D}(1_{GD})\\colon FGD\\to D$. Naturality of $\\Phi$ makes $\\eta\\colon 1_{\\mathcal C}\\Rightarrow GF$ and $\\varepsilon\\colon FG\\Rightarrow 1_{\\mathcal D}$ natural transformations."
          - problem: "Compute the unit and counit of the free-monoid adjunction $(-)^*\\dashv U$, $U\\colon\\mathbf{Mon}\\to\\mathbf{Set}$."
            answer: "Unit $\\eta_X\\colon X\\to U(X^*)$ inserts a letter as a length-one word; counit $\\varepsilon_M\\colon (UM)^*\\to M$ multiplies a word out."
            solution_sketch: "The unit $\\eta_X=\\Phi(1_{X^*})\\colon X\\to U(X^*)$ sends a letter $x$ to the one-letter word $x$. The counit $\\varepsilon_M=\\Phi^{-1}(1_{UM})\\colon (UM)^*\\to M$ sends a word $m_1\\cdots m_n$ of elements of $M$ to the product $m_1\\cdots m_n$ (and the empty word to the unit $e$). It is the homomorphism evaluating formal words in $M$, exhibiting $M$ as a quotient of the free monoid on its own elements."
      - id: kp2
        name: Recovering the bijection from unit and counit
        key_prerequisites: [natural-transformations]
        constraints: "Derive $\\Phi(h)=Gh\\circ\\eta$ and $\\Phi^{-1}(k)=\\varepsilon\\circ Fk$ from naturality, citing the variable used; mutual-inverse checks cite one naturality square and one triangle identity per direction."
        exemplars:
          - problem: "Express the transpose $\\Phi(h)$ and its inverse $\\Phi^{-1}(k)$ in terms of $\\eta$ and $\\varepsilon$."
            answer: "$\\Phi(h)=Gh\\circ\\eta_C$ and $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$."
            solution_sketch: "Naturality of $\\Phi$ in the second variable applied to $h\\colon FC\\to D$ gives $\\Phi(h)=\\Phi(h\\circ 1_{FC})=Gh\\circ\\Phi(1_{FC})=Gh\\circ\\eta_C$. Dually, naturality in the first variable gives $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$. So $\\eta$ and $\\varepsilon$ encode the entire adjunction bijection."
          - problem: "Verify that $\\Phi(h)=Gh\\circ\\eta_C$ and $\\Psi(k)=\\varepsilon_D\\circ Fk$ are mutually inverse, using naturality and the triangle identities."
            answer: "$\\Psi(\\Phi(h))=h$ via naturality of $\\varepsilon$ and $\\varepsilon F\\circ F\\eta=1_F$; dually $\\Phi(\\Psi(k))=k$."
            solution_sketch: "$\\Psi(\\Phi(h))=\\varepsilon_D\\circ F(Gh\\circ\\eta_C)=\\varepsilon_D\\circ FGh\\circ F\\eta_C=h\\circ\\varepsilon_{FC}\\circ F\\eta_C=h$, using naturality of $\\varepsilon$ ($\\varepsilon_D\\circ FGh=h\\circ\\varepsilon_{FC}$) and the triangle identity $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$. Dually $\\Phi(\\Psi(k))=G\\varepsilon_D\\circ GFk\\circ\\eta_C=G\\varepsilon_D\\circ\\eta_{GD}\\circ k=k$, using naturality of $\\eta$ ($GFk\\circ\\eta_C=\\eta_{GD}\\circ k$) and $G\\varepsilon_D\\circ\\eta_{GD}=1_{GD}$. Hence $\\Phi,\\Psi$ are mutually inverse."
    diagnostic_exemplar:
      problem: "For an adjunction $F\\dashv G$ with hom-set bijection $\\Phi$, unit $\\eta_C=\\Phi(1_{FC})$ and counit $\\varepsilon_D=\\Phi^{-1}(1_{GD})$, derive the formulas $\\Phi(h)=Gh\\circ\\eta_C$ and $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$ from the naturality of $\\Phi$."
      answer: "Naturality of $\\Phi$ in the second variable, applied to $h\\colon FC\\to D$, gives $\\Phi(h)=\\Phi(h\\circ 1_{FC})=Gh\\circ\\Phi(1_{FC})=Gh\\circ\\eta_C$. Dually, naturality of $\\Phi^{-1}$ in the first variable, applied to $k\\colon C\\to GD$, gives $\\Phi^{-1}(k)=\\Phi^{-1}(1_{GD}\\circ k)=\\Phi^{-1}(1_{GD})\\circ Fk=\\varepsilon_D\\circ Fk$. So the unit and counit encode the whole bijection."
      solution_sketch: "Feed an identity into naturality of $\\Phi$: write $h=h\\circ 1_{FC}$ and move $h$ out through the naturality square, leaving $Gh\\circ\\Phi(1_{FC})$. The dual move on $\\Phi^{-1}$, writing $k=1_{GD}\\circ k$, gives the counit formula."
    anki_seeds:
      - front: "Unit of $F\\dashv G$ (type and transpose)?"
        back: "$\\eta\\colon 1\\Rightarrow GF$, with $\\eta_C=\\Phi(1_{FC})$."
        type: basic
      - front: "Counit of $F\\dashv G$ (type and transpose)?"
        back: "$\\varepsilon\\colon FG\\Rightarrow 1$, with $\\varepsilon_D=\\Phi^{-1}(1_{GD})$."
        type: basic
      - front: "Adjunction transpose of $h\\colon FC\\to D$ in terms of $\\eta$?"
        back: "$\\Phi(h)=Gh\\circ\\eta_C$."
        type: basic
      - front: "Adjunction inverse-transpose of $k\\colon C\\to GD$ in terms of $\\varepsilon$?"
        back: "$\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$."
        type: basic

  - id: triangle-identities
    name: The Triangle Identities
    core: true
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: unit-counit
        weight: 0.6
        key: true
      - id: natural-transformations
        weight: 0.3
        key: true
      - id: vertical-horizontal-composition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Statement of the zig-zag identities
        key_prerequisites: [unit-counit]
        constraints: "State both identities with whiskering made explicit; concrete verifications only for the free-monoid adjunction, chased on a general element."
        exemplars:
          - problem: "State the two triangle identities for the unit $\\eta$ and counit $\\varepsilon$ of $F\\dashv G$."
            answer: "$\\varepsilon F\\circ F\\eta=1_F$ and $G\\varepsilon\\circ\\eta G=1_G$."
            solution_sketch: "The triangle (zig-zag) identities are $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$ for all $C$ (i.e. $\\varepsilon F\\circ F\\eta=1_F$) and $G\\varepsilon_D\\circ\\eta_{GD}=1_{GD}$ for all $D$ (i.e. $G\\varepsilon\\circ\\eta G=1_G$). They say $F\\xRightarrow{F\\eta}FGF\\xRightarrow{\\varepsilon F}F$ and $G\\xRightarrow{\\eta G}GFG\\xRightarrow{G\\varepsilon}G$ are identities."
          - problem: "Verify the triangle identity $G\\varepsilon\\circ\\eta G=1_G$ for the free-monoid adjunction $(-)^*\\dashv U$ (so $G=U$)."
            answer: "At a monoid $M$: insert each element as a one-letter word, then multiply out, recovering the element."
            solution_sketch: "Here $\\eta_X\\colon X\\to U(X^*)$ inserts letters and $\\varepsilon_M\\colon (UM)^*\\to M$ multiplies words out. The identity $U\\varepsilon\\circ\\eta U=1_U$ at $M$ is $U\\varepsilon_M\\circ\\eta_{UM}\\colon UM\\to UM$: $\\eta_{UM}$ sends $m$ to the one-letter word $(m)$, and $U\\varepsilon_M$ sends $(m)$ to its product $m$. The composite is $m\\mapsto(m)\\mapsto m=1_{UM}$, confirming the identity."
      - id: kp2
        name: Deriving a triangle identity from the transposes
        key_prerequisites: [unit-counit]
        constraints: "Each derivation applies $\\Phi$ or $\\Phi^{-1}$ to a defining equation of $\\eta$ or $\\varepsilon$ exactly once, then evaluates the transpose formula; no diagram chase."
        exemplars:
          - problem: "Prove $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$ using $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$ and $\\eta_C=\\Phi(1_{FC})$."
            answer: "Apply $\\Phi^{-1}$ to $\\eta_C$."
            solution_sketch: "Since $\\eta_C=\\Phi(1_{FC})$, applying $\\Phi^{-1}$ gives $1_{FC}=\\Phi^{-1}(\\eta_C)$. With $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$ for $k=\\eta_C\\colon C\\to GFC$ and $D=FC$, this is $1_{FC}=\\varepsilon_{FC}\\circ F\\eta_C$ — the first triangle identity. The second follows dually from $\\varepsilon_D=\\Phi^{-1}(1_{GD})$."
          - problem: "Prove the second triangle identity $G\\varepsilon_D\\circ\\eta_{GD}=1_{GD}$ using $\\Phi(h)=Gh\\circ\\eta_C$ and $\\varepsilon_D=\\Phi^{-1}(1_{GD})$."
            answer: "Apply $\\Phi$ to $\\varepsilon_D$."
            solution_sketch: "Since $\\varepsilon_D=\\Phi^{-1}(1_{GD})$, applying $\\Phi$ gives $1_{GD}=\\Phi(\\varepsilon_D)$. With $\\Phi(h)=Gh\\circ\\eta_C$ for $h=\\varepsilon_D\\colon FGD\\to D$ and $C=GD$, this reads $1_{GD}=G\\varepsilon_D\\circ\\eta_{GD}$ — the second triangle identity. It is the exact dual of deriving $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$ by applying $\\Phi^{-1}$ to $\\eta_C$."
      - id: kp3
        name: Triangle identities as an equivalent definition
        key_prerequisites: [natural-transformations]
        constraints: "Equivalence arguments compare $(F,G,\\eta,\\varepsilon)$ data with the hom-set definition; the 2-categorical reading may use only 1-cells, 2-cells, whiskering, and the two equations."
        exemplars:
          - problem: "State why $(F,G,\\eta,\\varepsilon)$ satisfying the triangle identities is the same data as an adjunction."
            answer: "$\\Phi(h)=Gh\\circ\\eta$ and $\\Psi(k)=\\varepsilon\\circ Fk$ are mutually inverse exactly when the triangles hold."
            solution_sketch: "Given natural $\\eta\\colon 1\\Rightarrow GF$, $\\varepsilon\\colon FG\\Rightarrow 1$, define $\\Phi(h)=Gh\\circ\\eta_C$ and $\\Psi(k)=\\varepsilon_D\\circ Fk$. Computing $\\Psi\\Phi$ and $\\Phi\\Psi$ and simplifying with naturality shows they are mutually inverse precisely when $\\varepsilon F\\circ F\\eta=1_F$ and $G\\varepsilon\\circ\\eta G=1_G$. So the unit-counit-with-triangles data is equivalent to the hom-set adjunction."
          - problem: "Explain how the triangle-identity definition lets 'adjunction' be defined internally in any $2$-category."
            answer: "It uses only $1$-cells, $2$-cells, whiskering, and the triangle equations — no hom-sets or elements."
            solution_sketch: "The unit-counit definition mentions only the objects $\\mathcal C,\\mathcal D$, the functors $F,G$, the natural transformations $\\eta\\colon 1\\Rightarrow GF$ and $\\varepsilon\\colon FG\\Rightarrow 1$, their whiskerings, and the equations $\\varepsilon F\\circ F\\eta=1_F$, $G\\varepsilon\\circ\\eta G=1_G$ — all expressible with $1$-cells, $2$-cells and horizontal/vertical composition. Hence in any $2$-category an adjunction $f\\dashv g$ is $\\eta\\colon 1\\Rightarrow gf$, $\\varepsilon\\colon fg\\Rightarrow 1$ satisfying $\\varepsilon f\\circ f\\eta=1_f$ and $g\\varepsilon\\circ\\eta g=1_g$. In $\\mathbf{Cat}$ this recovers ordinary adjunctions."
    diagnostic_exemplar:
      problem: "Using $\\eta_C=\\Phi(1_{FC})$ and $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$, prove the first triangle identity $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$."
      answer: "Apply $\\Phi^{-1}$ to both sides of $\\eta_C=\\Phi(1_{FC})$: $\\Phi^{-1}(\\eta_C)=1_{FC}$. Now evaluate $\\Phi^{-1}$ on $k=\\eta_C\\colon C\\to GFC$ (so $D=FC$) with the formula: $\\Phi^{-1}(\\eta_C)=\\varepsilon_{FC}\\circ F\\eta_C$. Equating the two expressions gives $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$, which holding for all $C$ is $\\varepsilon F\\circ F\\eta=1_F$."
      solution_sketch: "Apply $\\Phi^{-1}$ to the definition $\\eta_C=\\Phi(1_{FC})$ to get $\\Phi^{-1}(\\eta_C)=1_{FC}$, then evaluate that same $\\Phi^{-1}(\\eta_C)$ using the formula $\\varepsilon\\circ F(-)$. Equating the two readings of one value is the identity."
    anki_seeds:
      - front: "First triangle (zig-zag) identity, involving $F\\eta$?"
        back: "$\\varepsilon F\\circ F\\eta=1_F$."
        type: basic
      - front: "Second triangle (zig-zag) identity, involving $\\eta G$?"
        back: "$G\\varepsilon\\circ\\eta G=1_G$."
        type: basic
      - front: "An adjunction can be defined as functors $F,G$ plus $\\eta,\\varepsilon$ satisfying the {{c1::triangle identities}}."
        back: "triangle identities"
        type: cloze

  - id: free-forgetful-adjunctions
    name: Free-Forgetful Adjunctions
    core: false                # examples leaf topic
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: functor-examples
        weight: 0.4
        key: true
      - id: adjunction-examples
        weight: 0.3
      - id: monoids
        weight: 0.2
      - id: basis-dimension
        weight: 0.2
      - id: linear-transformations
        weight: 0.2
      - id: groups-intro
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: The general pattern
        key_prerequisites: [adjunctions]
        constraints: "Stay at the level of the general pattern: name the free functor, the forgetful functor and the direction of the adjunction, then describe the unit as the universal insertion of generators $\\eta_X\\colon X\\to U(FX)$ or the counit as the evaluation $\\varepsilon_A\\colon F(UA)\\to A$ of formal expressions; no concrete algebra is computed."
        exemplars:
          - problem: "State the general free-forgetful adjunction pattern and describe its unit."
            answer: "Free $\\dashv$ Forgetful; unit $\\eta_X\\colon X\\to U(FX)$ inserts generators and is universal."
            solution_sketch: "For an algebraic category $\\mathcal A$ with forgetful $U\\colon\\mathcal A\\to\\mathbf{Set}$, the free functor $F$ satisfies $\\mathrm{Hom}_{\\mathcal A}(FX,A)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UA)$, so $F\\dashv U$. The unit $\\eta_X\\colon X\\to U(FX)$ inserts generators and is universal: every function $X\\to UA$ extends uniquely to a homomorphism $FX\\to A$."
          - problem: "Describe the counit of a free-forgetful adjunction $F\\dashv U$ and say what it expresses."
            answer: "$\\varepsilon_A\\colon F(UA)\\to A$ evaluates formal expressions, exhibiting $A$ as a quotient of the free algebra on its own elements."
            solution_sketch: "The counit $\\varepsilon_A=\\Phi^{-1}(1_{UA})\\colon F(UA)\\to A$ is the unique homomorphism extending the identity $UA\\to UA$: it sends each formal generator $[a]$ (for $a\\in UA$) to $a$ and thereby evaluates formal expressions in $A$. It is surjective, so $A$ is a quotient of the free algebra $F(UA)$ on its underlying set — the canonical presentation by generators. The triangle identity $U\\varepsilon\\circ\\eta U=1_U$ says evaluating an inserted generator returns it."
      - id: kp2
        name: Free vector spaces
        key_prerequisites: [functor-examples]
        constraints: "Free vector spaces $k^{(X)}$ on a set $X$ only; describe the free functor by its basis and every linear map out of it by its values on basis elements; a counit description must give the formula $\\sum_v\\lambda_v e_v\\mapsto\\sum_v\\lambda_v v$ and say what presentation of $V$ it exhibits."
        exemplars:
          - problem: "The free functor for the forgetful functor $U\\colon\\mathbf{Vect}_k\\to\\mathbf{Set}$ sends a set $X$ to the free vector space $k^{(X)}$, the space with basis $\\{e_x : x \\in X\\}$. Let $X = \\{a, b, c, d, e, f\\}$. What is the dimension of $k^{(X)}$?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free functor sends a set $X$ to $k^{(X)}$, the vector space with basis $\\{e_x : x \\in X\\}$, by the definition of a free vector space. A basis of that form has one vector $e_x$ per element of $X$, so $\\dim k^{(X)} = |X|$ by the definition of dimension. With $|X| = 6$, the answer is 6."
          - problem: "For the free-forgetful adjunction between $\\mathbf{Vect}_k$ and $\\mathbf{Set}$, the counit at a vector space $V$ is the linear map $\\varepsilon_V\\colon k^{(UV)}\\to V$ sending each basis vector $e_v$ to $v$ and extending linearly. Take $V = \\mathbb{R}^2$ and the element $4e_{(1,0)} - 3e_{(0,1)}$ of $k^{(UV)}$. Compute $\\varepsilon_V$ of this element. Give the answer as (x, y)."
            answer: "(4, -3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The counit is the linear map $\\varepsilon_V\\colon k^{(UV)}\\to V$ given by the formula $\\sum_v \\lambda_v e_v \\mapsto \\sum_v \\lambda_v v$. Apply it to the full element $4e_{(1,0)} - 3e_{(0,1)}$: linearity gives $4\\,(1,0) - 3\\,(0,1)$. Compute the combination: $4\\,(1,0) - 3\\,(0,1) = (4, -3)$. The answer is (4, -3)."
          - problem: "Let $X = \\{a, b\\}$, so the free vector space $k^{(X)}$ has basis $e_a, e_b$. A linear map $T\\colon k^{(X)}\\to\\mathbb{R}^2$ is determined by its values on the basis, and here $T(e_a) = (1, 2)$ and $T(e_b) = (0, -3)$. Compute $T(2e_a + 3e_b)$. Give the answer as (x, y)."
            answer: "(2, -5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "A linear map out of a free vector space is determined by its values on the basis, which is the universal property of $k^{(X)}$. Use linearity on the full element $2e_a + 3e_b$: $T(2e_a + 3e_b) = 2T(e_a) + 3T(e_b) = 2(1,2) + 3(0,-3)$. Compute: $(2, 4) + (0, -9) = (2, -5)$. The answer is (2, -5)."
          - problem: "Let $V$ be the vector space over the field with two elements whose four vectors are $0$, $u$, $v$ and $u+v$. Let $X = \\{1, 2, 3\\}$. The adjunction Free $\\dashv$ $U$ gives a bijection between linear maps $k^{(X)}\\to V$ and functions $X \\to U(V)$. How many linear maps from $k^{(X)}$ to $V$ are there?"
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The adjunction Free $\\dashv$ $U$ gives the bijection $\\mathrm{Hom}_{\\mathbf{Vect}}(k^{(X)}, V) \\cong \\mathrm{Hom}_{\\mathbf{Set}}(X, U(V))$: each function on the basis extends uniquely to a linear map, since $k^{(X)}$ is free. So the number of linear maps equals the number of functions from the 3-element set $X$ to the 4-element set $U(V)$. Count functions: $4^3 = 64$. The answer is 64."
          - problem: "Let $V = \\mathbb{R}^2$ and let $v = (1, 1)$ and $w = (2, 2)$ be elements of $V$. The counit $\\varepsilon_V\\colon k^{(UV)}\\to V$ sends $\\sum_v \\lambda_v e_v$ to $\\sum_v \\lambda_v v$, so its kernel is the space of linear relations among elements of $V$. Find integers $a$ and $b$, with $a$ positive and as small as possible, such that $a\\,v + b\\,w = 0$, so that $a e_v + b e_w$ lies in the kernel. Give the answer as (a, b)."
            answer: "(2, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By the counit formula $\\sum_v \\lambda_v e_v \\mapsto \\sum_v \\lambda_v v$, the kernel of $\\varepsilon_V$ records the linear relations among elements of $V$, and $V \\cong k^{(UV)}/\\ker\\varepsilon_V$, so the counit presents $V$ by generators (its elements) and relations. Write the relation: $a\\,v + b\\,w = a(1,1) + b(2,2) = (a+2b,\\ a+2b)$. Solve $(a + 2b, a + 2b) = (0,0)$ with $a$ positive and minimal: $b = -1$ and $a = 2$. The answer is (2, -1)."
          - problem: "Claim: for every vector space $V$, the counit $\\varepsilon_V\\colon k^{(UV)}\\to V$ is an isomorphism. Step 1: $\\varepsilon_V$ sends each basis vector $e_v$ to $v$. Step 2: every vector of $V$ is a linear combination of elements of $V$. Step 3: hence $\\varepsilon_V$ is surjective. Step 4: a surjective linear map between vector spaces is injective, so $\\varepsilon_V$ is an isomorphism. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly states the counit formula $\\sum_v \\lambda_v e_v \\mapsto \\sum_v \\lambda_v v$. Step 2 is true: every vector $v$ equals $1 \\cdot v$. Step 3 follows from Step 2, since each vector of $V$ is the image of a combination of basis vectors. Step 4 is the first invalid step: a surjective linear map need not be injective; for instance $\\varepsilon_{\\mathbb{R}^2}$ kills $e_v + e_w - e_{v+w}$, so $\\varepsilon_V$ only presents $V \\cong k^{(UV)}/\\ker\\varepsilon_V$. The answer is Step 4."
          - problem: "Write the full proof: the free functor $X \\mapsto k^{(X)}$ is left adjoint to the forgetful functor $U\\colon\\mathbf{Vect}_k\\to\\mathbf{Set}$, via a bijection $\\mathrm{Hom}_{\\mathbf{Vect}}(k^{(X)}, V) \\cong \\mathrm{Hom}_{\\mathbf{Set}}(X, U(V))$ natural in $X$ and $V$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Define the free functor on objects: $\\mathrm{Free}(X) = k^{(X)}$, the vector space of finitely supported functions $X \\to k$, with basis $\\{e_x : x \\in X\\}$, where $e_x$ is the function that is $1$ at $x$ and $0$ elsewhere; on a function $f\\colon X \\to Y$ it is the linear map with $e_x \\mapsto e_{f(x)}$. Step 1 (the bijection): given a function $g\\colon X \\to U(V)$, define $g^{\\#}\\colon k^{(X)}\\to V$ by linear extension, $g^{\\#}\\big(\\sum_x \\lambda_x e_x\\big) = \\sum_x \\lambda_x g(x)$; this is the unique linear map with $g^{\\#}(e_x) = g(x)$, because a linear map out of a free space is determined by its values on the basis. Step 2 (the inverse): given a linear map $T\\colon k^{(X)}\\to V$, send it to the function $x \\mapsto T(e_x)$ in $\\mathbf{Set}$; the two constructions undo each other, so $\\mathrm{Hom}_{\\mathbf{Vect}}(k^{(X)}, V) \\cong \\mathrm{Hom}_{\\mathbf{Set}}(X, U(V))$. Step 3 (naturality): both constructions commute with precomposition in $X$ and postcomposition in $V$, since composition acts identically on both sides. Step 4 (conclusion): by the definition of adjunction via a natural hom-set bijection, Free $\\dashv$ $U$, with unit $\\eta_X\\colon X \\to U(k^{(X)})$ sending $x$ to the basis vector $e_x$."
      - id: kp3
        name: A forgetful functor with adjoints on both sides
        key_prerequisites: [adjunctions]
        constraints: "Forgetful functors carrying adjoints on both sides, limited to $U\\colon\\mathbf{Top}\\to\\mathbf{Set}$ and $\\mathrm{Ob}\\colon\\mathbf{Cat}\\to\\mathbf{Set}$; the discrete construction must be identified as the LEFT adjoint and the indiscrete one as the RIGHT adjoint, each justified by saying which maps are automatically legal."
        exemplars:
          - problem: "Let U be the forgetful functor from topological spaces to sets. The discrete construction sends a set X to the space disc(X) in which every subset of X is open. Take a set X with 3 elements and a space Y whose underlying set U(Y) has 4 elements. Every function from X to U(Y) is a legal continuous map from disc(X) to Y, because each preimage of an open set is a subset of X and is therefore open. How many continuous maps from disc(X) to Y are there?"
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the hom-set bijection for the left adjoint says continuous maps disc(X) to Y correspond exactly to functions X to U(Y), because maps out of a discrete space are automatically continuous. Count functions from the 3-element set X to the 4-element set U(Y): each of the 3 elements of X has 4 choices of image. Total: 4 * 4 * 4 = 64. The answer is 64."
          - problem: "The object-set functor Ob sends a small category to its set of objects. The discrete construction disc(S) builds the category whose objects are the elements of S and whose only arrows are the identity arrows. Let S be a set with 2 elements and let C be a category with 5 objects. A functor from disc(S) to C is exactly a function from S to the object set of C, since identity arrows must go to identity arrows and nothing else needs to be preserved. How many functors from disc(S) to C are there?"
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the hom-set bijection for the left adjoint says functors disc(S) to C correspond exactly to functions S to Ob(C), because a functor out of a discrete category only has to name images of objects. Count functions from the 2-element set S to the 5-element set Ob(C): each of the 2 objects of S has 5 choices of image. Total: 5 * 5 = 25. The answer is 25."
          - problem: "Let U be the forgetful functor from topological spaces to sets. The indiscrete construction sends a set Y to the space indisc(Y) whose only open sets are the empty set and Y itself. Take a space X whose underlying set U(X) has 3 elements and a set Y with 5 elements. Every function from U(X) to Y is a legal continuous map from X to indisc(Y), because the preimage of an open set of indisc(Y) is empty or all of X, both open in X. How many continuous maps from X to indisc(Y) are there?"
            answer: "125"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the hom-set bijection for the right adjoint says continuous maps X to indisc(Y) correspond exactly to functions U(X) to Y, because maps into an indiscrete space are automatically continuous. Count functions from the 3-element set U(X) to the 5-element set Y: each of the 3 elements has 5 choices of image. Total: 5 * 5 * 5 = 125. The answer is 125."
          - problem: "The object-set functor Ob sends a small category to its set of objects. The indiscrete construction indisc(S) builds the category on the set S with exactly one arrow from s to t for each ordered pair of objects s and t in S. Let C be a category with 2 objects and let S be a set with 6 elements. Any function from the object set of C to S extends to a functor from C to indisc(S), because images of arrows and composites are forced to be the unique arrows. How many functors from C to indisc(S) arise this way?"
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the hom-set bijection for the right adjoint says functors C to indisc(S) correspond exactly to functions Ob(C) to S, because maps into an indiscrete category are automatically legal functors once objects are named. Count functions from the 2-element set Ob(C) to the 6-element set S: each of the 2 objects has 6 choices of image. Total: 6 * 6 = 36. The answer is 36."
          - problem: "The indiscrete construction on a set X produces the topological space whose only open sets are the empty set and X itself, no matter how many elements X has. This is the construction that makes every map into the space automatically continuous. For a set X with 6 elements, how many open sets does the indiscrete space on X have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the indiscrete topology declares open exactly the empty set and the whole underlying set, independent of the size of X. List the open sets: the empty set, and X itself. Total: 2 open sets. The answer is 2."
          - problem: "A student argues that the indiscrete construction is the left adjoint of the forgetful functor U from topological spaces to sets. Step 1: give the indiscrete space on X the topology whose only open sets are the empty set and X. Step 2: a continuous map from that indiscrete space to any space Y is then any function from X to U(Y). Step 3: continuous maps from the indiscrete space on X to Y therefore correspond to functions from X to U(Y). Step 4: this bijection proves that the indiscrete construction is the left adjoint of U. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly defines the indiscrete topology. Step 2 is the first invalid step: automatic continuity holds for maps into an indiscrete space, not for maps out of one, since the preimage of an open set of Y under a map out of the indiscrete space need not be empty or all of X. Step 3 merely translates the false claim of Step 2 into a bijection, so it inherits the error and is not the first failure. Step 4 correctly reads an adjunction out of the stated bijection. The first step that is not valid is Step 2."
          - problem: "Write the full proof: the forgetful functor U from topological spaces to sets has a left adjoint, the discrete construction, and a right adjoint, the indiscrete construction, with each adjunction justified by the maps that are automatically continuous. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (left adjoint construction): give disc(X) the topology in which every subset of X is open. Step 2 (automatic legality): any function f from disc(X) to a space Y is continuous, because the preimage of any open set of Y is a subset of X and is therefore open. Step 3 (bijection): continuous maps disc(X) to Y correspond exactly to functions X to U(Y), which is the hom-set bijection showing the discrete construction is left adjoint to U. Step 4 (right adjoint construction): give indisc(Y) the topology whose only open sets are the empty set and Y. Step 5 (automatic legality): any function g from a space X to indisc(Y) is continuous, because the preimage of an open set of indisc(Y) is empty or all of X, both open in X. Step 6 (bijection): continuous maps X to indisc(Y) correspond exactly to functions U(X) to Y, the hom-set bijection showing U is left adjoint to the indiscrete construction. Conclusion: U carries a left adjoint, the discrete construction, and a right adjoint, the indiscrete construction."
    diagnostic_exemplar:
      problem: "Show that the forgetful functor $U\\colon\\mathbf{Top}\\to\\mathbf{Set}$ has both a left adjoint and a right adjoint, exhibiting the two hom-set bijections."
      answer: "Left adjoint: the discrete-space functor. Every function from a discrete space is continuous (all subsets are open in the source), so $\\mathrm{Hom}_{\\mathbf{Top}}(X_{\\mathrm{disc}},Y)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UY)$, natural in both variables: $\\mathrm{disc}\\dashv U$. Right adjoint: the indiscrete-space functor. Every function into an indiscrete space is continuous (only $\\varnothing$ and the whole set are open in the target), so $\\mathrm{Hom}_{\\mathbf{Top}}(X,Y_{\\mathrm{ind}})\\cong\\mathrm{Hom}_{\\mathbf{Set}}(UX,Y)$: $U\\dashv\\mathrm{ind}$."
      solution_sketch: "Ask on which side continuity comes for free. Every map out of a discrete space is continuous, giving $\\mathrm{disc}\\dashv U$; every map into an indiscrete space is continuous, giving $U\\dashv\\mathrm{ind}$. Each observation is itself the hom-set bijection."
    anki_seeds:
      - front: "Free-forgetful adjunction pattern?"
        back: "Free $\\dashv$ Forgetful: $\\mathrm{Hom}_{\\mathcal A}(FX,A)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UA)$; unit inserts generators."
        type: basic
      - front: "The free vector space on a set $X$ is {{c1::$k^{(X)}$, with basis $X$}}."
        back: "$k^{(X)}$, with basis $X$"
        type: cloze

  - id: galois-connections
    name: Galois Connections
    core: false
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: partial-orders
        weight: 0.4
        key: true
      - id: unit-counit
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: A Galois connection is an adjunction of posets
        key_prerequisites: [partial-orders]
        constraints: "Monotone Galois connections between posets, always stated as the biconditional $f(p)\\le q\\iff p\\le g(q)$ with the left adjoint named; instances limited to abstract posets and the image/preimage pair on powersets ordered by inclusion. Naturality never has to be checked, since hom-sets of a poset category have at most one element."
        exemplars:
          - problem: "Define a monotone Galois connection between posets and show it is exactly an adjunction of the poset categories."
            answer: "Monotone $f\\colon P\\to Q$, $g\\colon Q\\to P$ with $f(p)\\le q\\iff p\\le g(q)$; this is $f\\dashv g$."
            solution_sketch: "A monotone Galois connection is order-preserving maps $f\\colon P\\to Q$, $g\\colon Q\\to P$ with $f(p)\\le q\\iff p\\le g(q)$ for all $p,q$. Viewing $P,Q$ as thin categories (one arrow $x\\to y$ iff $x\\le y$), the biconditional is precisely the hom-set bijection $\\mathrm{Hom}(fp,q)\\cong\\mathrm{Hom}(p,gq)$, i.e. $f\\dashv g$; naturality is automatic since each hom-set has at most one element."
          - problem: "For a function $h\\colon X\\to Y$, show that on powersets ordered by inclusion the image map is left adjoint to the preimage: $\\exists_h\\dashv h^{-1}$."
            answer: "$\\exists_h(S)\\subseteq T\\iff S\\subseteq h^{-1}(T)$, a monotone Galois connection (with a further right adjoint $\\forall_h$)."
            solution_sketch: "Let $\\exists_h(S)=\\{h(s):s\\in S\\}$ and $h^{-1}(T)=\\{x:h(x)\\in T\\}$, both monotone for inclusion. Then $\\exists_h(S)\\subseteq T\\iff(\\forall s\\in S)\\,h(s)\\in T\\iff S\\subseteq h^{-1}(T)$, which is exactly the Galois connection $\\exists_h\\dashv h^{-1}$ between $(\\mathcal P X,\\subseteq)$ and $(\\mathcal P Y,\\subseteq)$. Preimage also has a right adjoint $\\forall_h(S)=\\{y:h^{-1}(\\{y\\})\\subseteq S\\}$, giving the chain $\\exists_h\\dashv h^{-1}\\dashv\\forall_h$."
      - id: kp2
        name: Closure operators from the round trip
        key_prerequisites: [adjunctions]
        constraints: "Argue only from the unit $p\\le gf(p)$ and the counit $fg(q)\\le q$ plus monotonicity; every equality of elements must be obtained by antisymmetry, and 'closure operator' means monotone, inflationary and idempotent, verified in that order."
        exemplars:
          - problem: "Identify the unit and counit of $f\\dashv g$ in the poset case, and show $g\\circ f$ is a closure operator."
            answer: "Unit $p\\le g f(p)$, counit $f g(q)\\le q$; $gf$ is monotone, inflationary, idempotent."
            solution_sketch: "In a poset the unit is the inequality $p\\le gf(p)$ and the counit is $fg(q)\\le q$. Let $c=gf$: monotone (composite of monotone maps); inflationary by the unit $p\\le c(p)$; idempotent because $c(p)\\le c(c(p))$ (unit) and $c(c(p))\\le c(p)$ (apply the monotone $g$ to the counit $fg(fp)\\le fp$, giving $gfg fp\\le gfp$). Hence $c$ is a closure operator; dually $fg$ is an interior operator."
          - problem: "Show that $f\\dashv g$ between posets restricts to inverse order-isomorphisms between the closed elements $\\mathrm{im}(g)$ and the open elements $\\mathrm{im}(f)$."
            answer: "$f,g$ restrict to mutually inverse monotone bijections $\\mathrm{im}(g)\\cong\\mathrm{im}(f)$, the Galois correspondence."
            solution_sketch: "The poset triangle identities give $fgf=f$ and $gfg=g$ (from $p\\le gf(p)$, $fg(q)\\le q$ and antisymmetry). The closed elements are $P_c=\\{p:gf(p)=p\\}=\\mathrm{im}(g)$ and the open elements $Q_k=\\{q:fg(q)=q\\}=\\mathrm{im}(f)$. For $p\\in P_c$, $fg(f(p))=f(p)$ so $f(p)\\in Q_k$, and $g(f(p))=p$; symmetrically $g$ maps $Q_k$ into $P_c$ with $f(g(q))=q$. Hence $f,g$ are mutually inverse order-isomorphisms $P_c\\cong Q_k$."
    diagnostic_exemplar:
      problem: "Let $f\\dashv g$ be a monotone Galois connection between posets ($f(p)\\le q\\iff p\\le g(q)$). Prove that $c=g\\circ f$ is a closure operator: monotone, inflationary, and idempotent."
      answer: "Monotone: composite of monotone maps. Inflationary: from $f(p)\\le f(p)$ the biconditional gives $p\\le gf(p)=c(p)$ (the unit). Idempotent: $c(p)\\le c(c(p))$ by the unit; for the reverse, the counit $fg(q)\\le q$ at $q=f(p)$ gives $fgf(p)\\le f(p)$, and applying the monotone $g$ yields $c(c(p))=gfgf(p)\\le gf(p)=c(p)$. By antisymmetry $c(c(p))=c(p)$."
      solution_sketch: "Monotonicity is inherited from the two maps. Inflationary is the unit, obtained by feeding $f(p)\\le f(p)$ into the biconditional; for idempotence use the counit $fg(q)\\le q$ at $q=f(p)$, apply the monotone $g$, and close with antisymmetry."
    anki_seeds:
      - front: "A Galois connection is an adjunction between..."
        back: "posets (thin categories): monotone $f,g$ with $f(p)\\le q\\iff p\\le g(q)$."
        type: basic
      - front: "For a Galois connection $f\\dashv g$, the composite $g\\circ f$ is a {{c1::closure operator}}."
        back: "closure operator"
        type: cloze

  - id: reflective-subcategories
    name: Reflective Subcategories
    core: false                # terminal adjunction application
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: unit-counit
        weight: 0.4
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: triangle-identities
        weight: 0.3
      - id: subcategories
        weight: 0.2
      - id: first-isomorphism-theorem
        weight: 0.2
      # Phase C reconciliation: kp3 proves Ab reflective in Grp with reflector
      # $G \mapsto G/[G,G]$ — "$f$ kills commutators" and the unique factorisation
      # through the quotient are commutator-subgroup kp3 (the UMP of abelianization).
      - id: commutator-subgroup
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Definition and the universal property of the reflection
        key_prerequisites: [adjunctions]
        constraints: "The subcategory must be full; state which functor is the left adjoint."
        exemplars:
          - problem: "Define a reflective subcategory and write the universal property satisfied by the unit."
            answer: "A full subcategory whose inclusion $i\\colon\\mathcal{D}\\to\\mathcal{C}$ has a left adjoint $L$; $\\eta_C\\colon C\\to iLC$ is universal from $C$ to $i$."
            solution_sketch: "A full subcategory $\\mathcal{D}\\subseteq\\mathcal{C}$ is reflective if the inclusion $i$ has a left adjoint $L\\colon\\mathcal{C}\\to\\mathcal{D}$, called the reflector, so $\\mathrm{Hom}_{\\mathcal{D}}(LC,D)\\cong\\mathrm{Hom}_{\\mathcal{C}}(C,iD)$ naturally. Equivalently, the unit $\\eta_C\\colon C\\to iLC$ is a universal arrow from $C$ to $i$: every morphism $f\\colon C\\to iD$ with $D$ in $\\mathcal{D}$ factors as $f=i(g)\\circ\\eta_C$ for a unique $g\\colon LC\\to D$. So $LC$ is the best approximation of $C$ from inside $\\mathcal{D}$."
          - problem: "Show that if $C$ already lies in $\\mathcal{D}$ then the reflection map $\\eta_C$ is an isomorphism, given that $\\varepsilon$ is a natural isomorphism."
            answer: "For $C=iD$, the second triangle identity $i\\varepsilon_D\\circ\\eta_{iD}=1_{iD}$ plus invertibility of $\\varepsilon_D$ makes $\\eta_{iD}$ invertible."
            solution_sketch: "Take $C=iD$ with $D$ in $\\mathcal{D}$. For the adjunction $L\\dashv i$ the second triangle identity $G\\varepsilon\\circ\\eta G=1_G$ (here $G=i$) gives $i(\\varepsilon_D)\\circ\\eta_{iD}=1_{iD}$. If $\\varepsilon_D$ is an isomorphism then so is $i(\\varepsilon_D)$ (functors preserve isomorphisms), and composing the displayed identity with $i(\\varepsilon_D)^{-1}$ on the left yields $\\eta_{iD}=i(\\varepsilon_D)^{-1}$, an isomorphism. So objects already in $\\mathcal{D}$ are their own reflections: reflecting is idempotent on the nose up to isomorphism."
      - id: kp2
        name: The counit of a reflection is an isomorphism
        key_prerequisites: [triangle-identities]
        constraints: "Use fullness to produce the comparison map, faithfulness for one equation, and naturality plus the first triangle identity for the other."
        exemplars:
          - problem: "Let $L\\dashv i$ with $i\\colon\\mathcal{D}\\to\\mathcal{C}$ fully faithful. Prove the counit $\\varepsilon\\colon Li\\Rightarrow 1_{\\mathcal{D}}$ is a natural isomorphism."
            answer: "Take $k\\colon D\\to LiD$ with $i(k)=\\eta_{iD}$; then $\\varepsilon_D\\circ k=1_D$ and $k\\circ\\varepsilon_D=1_{LiD}$."
            solution_sketch: "Since $i$ is full and faithful, the morphism $\\eta_{iD}\\colon iD\\to iLiD$ is $i(k)$ for a unique $k\\colon D\\to LiD$. The second triangle identity $G\\varepsilon\\circ\\eta G=1_G$ for $L\\dashv i$ (so $G=i$) reads $i(\\varepsilon_D)\\circ\\eta_{iD}=1_{iD}$, i.e. $i(\\varepsilon_D\\circ k)=i(1_D)$, so faithfulness gives $\\varepsilon_D\\circ k=1_D$. For the other composite, naturality of $\\varepsilon$ at $k\\colon D\\to LiD$ gives $k\\circ\\varepsilon_D=\\varepsilon_{LiD}\\circ Li(k)$. But $Li(k)=L(\\eta_{iD})$, and the first triangle identity $\\varepsilon F\\circ F\\eta=1_F$ (so $F=L$) at the object $iD$ says $\\varepsilon_{L(iD)}\\circ L(\\eta_{iD})=1_{L iD}$. Hence $k\\circ\\varepsilon_D=1_{LiD}$, so $\\varepsilon_D$ is an isomorphism with inverse $k$; naturality is inherited from $\\varepsilon$."
          - problem: "Deduce that a reflective subcategory $\\mathcal{D}\\subseteq\\mathcal{C}$ consists, up to isomorphism, exactly of the objects $C$ for which $\\eta_C$ is an isomorphism."
            answer: "If $\\eta_C$ is iso then $C\\cong iLC$ lies in $\\mathcal{D}$; conversely $\\eta_{iD}$ is an isomorphism for every $D$ in $\\mathcal{D}$."
            solution_sketch: "If $\\eta_C\\colon C\\to iLC$ is an isomorphism, then $C$ is isomorphic to an object of the form $iLC$, hence lies in $\\mathcal{D}$ up to isomorphism (and genuinely so if $\\mathcal{D}$ is closed under isomorphism). Conversely, for $C=iD$ we showed $\\eta_{iD}=i(\\varepsilon_D)^{-1}$ is an isomorphism, using that $\\varepsilon$ is a natural isomorphism. So the reflective subcategory is characterized inside $\\mathcal{C}$ by the condition '$\\eta_C$ is invertible' — the local objects of the reflection."
      - id: kp3
        name: Examples and the induced idempotent monad
        key_prerequisites: [full-faithful-functors, commutator-subgroup]
        constraints: "Check fullness of the subcategory and the universal property of the reflector in each example."
        exemplars:
          - problem: "Show that $\\mathbf{Ab}$ is a reflective subcategory of $\\mathbf{Grp}$ and identify the reflector."
            answer: "$\\mathbf{Ab}\\subseteq\\mathbf{Grp}$ is full, and abelianization $G\\mapsto G/[G,G]$ is left adjoint to the inclusion."
            solution_sketch: "$\\mathbf{Ab}$ contains all abelian groups and every group homomorphism between them, so it is a full subcategory. For an abelian target $A$, any homomorphism $f\\colon G\\to A$ kills commutators, since $f(xyx^{-1}y^{-1})=f(x)f(y)f(x)^{-1}f(y)^{-1}=e$; hence $f$ factors uniquely through the quotient $G^{\\mathrm{ab}}=G/[G,G]$. This gives a natural bijection $\\mathrm{Hom}_{\\mathbf{Ab}}(G^{\\mathrm{ab}},A)\\cong\\mathrm{Hom}_{\\mathbf{Grp}}(G,A)$, so abelianization is left adjoint to the inclusion; the unit is the quotient map $\\eta_G\\colon G\\to G^{\\mathrm{ab}}$ and the counit at an abelian $A$ is the isomorphism $A^{\\mathrm{ab}}=A/\\{e\\}\\cong A$."
          - problem: "Show that posets form a reflective subcategory of preorders, and describe the idempotent monad a reflection induces."
            answer: "Reflector $P\\mapsto P/\\!\\sim$ with $x\\sim y$ iff $x\\le y\\le x$; the induced monad $T=iL$ has invertible multiplication, so $T^2\\cong T$."
            solution_sketch: "Posets form a full subcategory of preorders (all monotone maps are kept). Given a preorder $P$, put $x\\sim y$ iff $x\\le y$ and $y\\le x$; this is an equivalence relation and $[x]\\le[y]$ iff $x\\le y$ is well defined and antisymmetric, so $P/\\!\\sim$ is a poset. If $Q$ is a poset and $f\\colon P\\to Q$ is monotone, then $x\\sim y$ gives $f(x)\\le f(y)\\le f(x)$, hence $f(x)=f(y)$; so $f$ factors uniquely through $P/\\!\\sim$, proving the adjunction. In general a reflection induces the monad $T=iL$ with unit $\\eta$ and multiplication $\\mu=i\\varepsilon L$; since $\\varepsilon$ is a natural isomorphism, $\\mu$ is an isomorphism and $T^2\\cong T$ — the monad is idempotent."
    diagnostic_exemplar:
      problem: "Show that $\\mathbf{Ab}$ is a reflective subcategory of $\\mathbf{Grp}$, identifying the reflector and its unit."
      answer: "$\\mathbf{Ab}$ is full in $\\mathbf{Grp}$: every homomorphism between abelian groups is kept. The reflector is abelianization $G\\mapsto G^{\\mathrm{ab}}=G/[G,G]$: for abelian $A$, any homomorphism $f\\colon G\\to A$ kills commutators ($f(xyx^{-1}y^{-1})=f(x)f(y)f(x)^{-1}f(y)^{-1}=e$ since $A$ is abelian), so $f$ factors uniquely through the quotient map $\\eta_G\\colon G\\to G^{\\mathrm{ab}}$. This gives a natural bijection $\\mathrm{Hom}_{\\mathbf{Ab}}(G^{\\mathrm{ab}},A)\\cong\\mathrm{Hom}_{\\mathbf{Grp}}(G,A)$, i.e. abelianization is left adjoint to the inclusion, with unit $\\eta_G$."
      solution_sketch: "The reflector must kill exactly what obstructs a map into an abelian group, namely the commutators. Show any $f\\colon G\\to A$ with $A$ abelian vanishes on commutators, hence factors uniquely through $G/[G,G]$; that unique factorization is the adjunction bijection, with the quotient map as unit."
    anki_seeds:
      - front: "A reflective subcategory is..."
        back: "a full subcategory whose inclusion has a left adjoint (the reflector)."
        type: basic
      - front: "For an adjunction $L\\dashv i$ with $i$ fully faithful, the counit $\\varepsilon$ is..."
        back: "a natural isomorphism."
        type: basic
      - front: "The reflector of $\\mathbf{Ab}\\subseteq\\mathbf{Grp}$ is {{c1::abelianization $G\\mapsto G/[G,G]$}}."
        back: "abelianization $G\\mapsto G/[G,G]$"
        type: cloze

  - id: adjoints-preserve-limits
    name: Adjoints Preserve (Co)Limits
    core: false                # stated theorem (RAPL); terminal
    difficulty: 0.82
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: limits-colimits
        weight: 0.5
        key: true
      - id: preservation-reflection-of-limits
        weight: 0.4
        key: true
      - id: unit-counit
        weight: 0.2
      - id: hom-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Hom-functors preserve limits
        key_prerequisites: [limits-colimits]
        constraints: "Hom-functors only: $\\mathrm{Hom}(A,-)$ covariant and $\\mathrm{Hom}(-,A)$ contravariant. State RAPL before applying it, and treat the contravariant case as the covariant one on $\\mathcal C^{op}$; concrete instances limited to binary (co)products, written as a hom-set isomorphism."
        exemplars:
          - problem: "State RAPL and explain why each $\\mathrm{Hom}(A,-)$ preserves limits."
            answer: "Right adjoints preserve limits; $\\mathrm{Hom}(A,-)$ sends a limit cone to a limit cone of sets."
            solution_sketch: "RAPL: a right adjoint preserves all limits that exist (dually a left adjoint preserves colimits). In particular $\\mathrm{Hom}(A,-)\\colon\\mathcal C\\to\\mathbf{Set}$ preserves limits: a cone with apex $L$ over $D$ is a limit iff $\\mathrm{Hom}(A,L)\\cong\\lim_j\\mathrm{Hom}(A,Dj)$ naturally in $A$, i.e. maps into $L$ correspond to compatible families of maps into the $Dj$."
          - problem: "Show the contravariant hom-functor $\\mathrm{Hom}(-,A)$ sends colimits to limits, e.g. $\\mathrm{Hom}(X+Y,A)\\cong\\mathrm{Hom}(X,A)\\times\\mathrm{Hom}(Y,A)$."
            answer: "$\\mathrm{Hom}(-,A)\\colon\\mathcal C^{op}\\to\\mathbf{Set}$ is a covariant hom-functor on $\\mathcal C^{op}$, so it preserves limits, i.e. carries colimits of $\\mathcal C$ to limits."
            solution_sketch: "Regard $\\mathrm{Hom}(-,A)$ as the covariant hom-functor $\\mathrm{Hom}_{\\mathcal C^{op}}(A,-)$ on $\\mathcal C^{op}$, which preserves limits. A colimit in $\\mathcal C$ is a limit in $\\mathcal C^{op}$, so $\\mathrm{Hom}(\\mathrm{colim}_j D_j,A)\\cong\\lim_j\\mathrm{Hom}(D_j,A)$. For a coproduct this is $\\mathrm{Hom}(X+Y,A)\\cong\\mathrm{Hom}(X,A)\\times\\mathrm{Hom}(Y,A)$ (a map out of $X+Y$ is a pair of maps), and for a coequalizer it is an equalizer of hom-sets."
      - id: kp2
        name: The proof via the adjunction isomorphism
        key_prerequisites: [adjunctions]
        constraints: "The proof must run through the adjunction bijection $\\mathrm{Hom}(FC,-)\\cong\\mathrm{Hom}(C,G-)$ and then Yoneda, never through elements; applications limited to forgetful functors out of $\\mathbf{Grp}$, and any failure of colimit preservation must name the colimit involved."
        exemplars:
          - problem: "Prove that a right adjoint $G$ preserves limits, using $\\mathrm{Hom}(FC,-)\\cong\\mathrm{Hom}(C,G-)$."
            answer: "Chain the hom-iso with limit-preservation of $\\mathrm{Hom}(FC,-)$, then apply Yoneda."
            solution_sketch: "Let $D\\colon\\mathcal J\\to\\mathcal D$ have limit $\\lim D$ and $F\\dashv G$. For each $C$: $\\mathrm{Hom}(C,G\\lim D)\\cong\\mathrm{Hom}(FC,\\lim D)\\cong\\lim_j\\mathrm{Hom}(FC,Dj)\\cong\\lim_j\\mathrm{Hom}(C,GDj)\\cong\\mathrm{Hom}(C,\\lim_j GDj)$, naturally in $C$ (adjunction iso; $\\mathrm{Hom}(FC,-)$ preserves the limit of sets; adjunction iso; limits commute with $\\mathrm{Hom}(C,-)$). By Yoneda the represented objects are isomorphic: $G(\\lim D)\\cong\\lim(GD)$, via the canonical comparison. So $G$ preserves limits."
          - problem: "Deduce that the forgetful functor $U\\colon\\mathbf{Grp}\\to\\mathbf{Set}$ preserves all limits, and note why it need not preserve coproducts."
            answer: "$U$ is a right adjoint ($F\\dashv U$), so RAPL gives limit preservation; coproducts (free products) are colimits, which right adjoints need not preserve."
            solution_sketch: "The free-group functor is left adjoint to $U$, so $U$ is a right adjoint and by RAPL preserves every limit: the underlying set of a product $\\prod_i G_i$ is $\\prod_i UG_i$, of an equalizer is the equalizer of underlying maps, and of the terminal group is a singleton. Colimits are exempt: the underlying set of the coproduct (free product) $G*H$ is not $UG\\sqcup UH$, consistent with $U$ being a right, not left, adjoint."
      - id: kp3
        name: Left adjoints preserve colimits
        key_prerequisites: [limits-colimits]
        constraints: "Obtain the dual statement by applying RAPL in the opposite categories rather than reproving it; instantiations limited to the free-monoid and free-vector-space functors, always naming the preserved colimit (initial object or binary coproduct)."
        exemplars:
          - problem: "The free monoid functor M from Set to Mon sends a set S to the monoid of all words in the letters of S, and it is left adjoint to the forgetful functor, so it preserves binary coproducts. Let X be a set of 2 letters and Y a set of 3 letters; a binary coproduct of sets is a disjoint union. How many letters generate the coproduct of the monoids M(X) and M(Y) in Mon?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a left adjoint preserves colimits, in particular binary coproducts. The coproduct of the monoids M(X) and M(Y) in Mon is therefore M of the disjoint union of X and Y, a free monoid on 2 + 3 letters. The answer is 5."
          - problem: "The free vector space functor V from Set to Vect sends a set S to the vector space with basis S, and it is left adjoint to the forgetful functor, so it preserves binary coproducts. Let X be a set with 4 elements and Y a set with 5 elements; finite coproducts in Vect are direct sums. Compute the dimension of the coproduct of V(X) and V(Y) in Vect."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a left adjoint preserves colimits, in particular binary coproducts. The coproduct of V(X) and V(Y) in Vect is therefore V of the disjoint union of X and Y, a free space on 4 + 5 basis vectors, and finite coproducts in Vect are direct sums. The answer is 9."
          - problem: "The free monoid functor M from Set to Mon is left adjoint to the forgetful functor, so it preserves initial objects. The empty set is the initial object of Set, so the monoid M of the empty set is the initial object of Mon. How many elements does this monoid have?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a left adjoint preserves colimits, and the initial object is the colimit of the empty diagram. So the free monoid on the empty set is initial in Mon. The free monoid on no letters contains only the empty word. The answer is 1."
