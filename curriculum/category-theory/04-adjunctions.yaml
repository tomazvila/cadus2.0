unit: adjunctions
course: category-theory
module: "Adjunctions"
topics:
  - id: hom-set-adjunction-definition
    name: The Hom-Set Definition of an Adjunction
    core: true
    difficulty: 0.74
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: hom-functors
        weight: 0.6
        key: true
      - id: natural-isomorphisms
        weight: 0.4
        key: true
      - id: universal-properties
        weight: 0.3
      - id: functors
        weight: 0.2
      - id: product-categories
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Computing transposes
        key_prerequisites: [universal-properties]
        constraints: "Construct transposes from the adjunction or universal property. Do not state a transpose formula before asking for its value; include restriction, extension, and recovery of an unknown adjoint."
        exemplars:
          - problem: "Let F:Set->Mon be the free-monoid functor and U the underlying-set functor. For M=(N,+,0), a function f:{a,b}->UM has f(a)=4,f(b)=5. Construct its inverse transpose under F left adjoint to U; give its values on aa and ab."
            answer: "aa = 8; ab = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "aa"}, {"contract": {"kind": "exact"}, "name": "ab"}]}
            solution_sketch: "The full object is the transpose bar f: {a,b}* -> M, the unique monoid homomorphism extending f on the letters. Rule of the extension: bar f of a word is the sum of the values of its letters. Apply to aa: bar f(aa) = f(a) + f(a) = 4 + 4 = 8. Apply to ab: bar f(ab) = f(a) + f(b) = 4 + 5 = 9. The answer is aa = 8; ab = 9."
          - problem: "For the diagonal functor Delta:Set->Set x Set, let R be its right adjoint. A map Delta({1,2})->(A,B) is specified by f(1)=0,f(2)=3,g(1)=5,g(2)=7. Construct its transpose from the product universal property. Give its value at 2 as (x,y)."
            answer: "(3,7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full object is the transpose of (f, g), a function from X to the product A x B. Rule of the adjunction: by the universal property of the product, the pair (f, g) corresponds to the unique map whose first component is f and whose second component is g. Evaluate at 2: the value is (f(2), g(2)) = (3, 7). The answer is (3,7)."
          - problem: "Regard the integers as a poset category. F(n)=3n has a right adjoint G. Construct the transpose of the arrow F(4)->15 from the adjunction condition. Give the target object of this transpose."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For posets, the adjunction law is F(c) <= d exactly when c <= G(d), so the transpose of a witness of F(4) <= 15 is a witness of 4 <= G(15). Rule of the adjoint: compute G(15) = floor(15/3) = 5. The answer is 5."
          - problem: "Let F:Set->Mon be free monoid and U forgetful. A homomorphism h:F({a,b})->(N,+,0) satisfies h(aa)=16,h(ba)=26. Recover its transpose {a,b}->U(N,+,0). Give a and b, its two values."
            answer: "a = 8; b = 18"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "b"}]}
            solution_sketch: "The full object is the transpose of h, namely the function from the alphabet to N given by restricting h to one-letter words. Rule of the homomorphism: h(aa) = h(a) + h(a) = 16, so h(a) = 8. Then h(ba) = h(b) + h(a) = 26, so h(b) = 18. The answer is a = 8; b = 18."
          - problem: "For F:Set->Mon free and U forgetful, a function j:{a,b}->U(N,+,0) sends a to 4 and b to 1. Step 1: its inverse transpose extends j. Step 2: its value on ab is 5. Step 3: its value on the empty word is 1. Step 4: its value on aab is 9. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The free extension preserves concatenation and the additive identity. The empty word must map to 0. This is the first unsupported step."
          - problem: "Let F:Set->Mon be free monoid and U forgetful. M is the positive integers under multiplication. A function f:{p,q}->UM sends p to 2,q to 5. Construct its inverse transpose and give its values on ppq and qp."
            answer: "ppq = 20; qp = 10"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "ppq"}, {"contract": {"kind": "exact"}, "name": "qp"}]}
            solution_sketch: "The full object is the transpose bar f: {p,q}* -> M, the unique monoid homomorphism extending f on the letters. Rule of the extension for a multiplicative monoid: bar f of a word is the product of the values of its letters. Apply to ppq: bar f(ppq) = 2 x 2 x 5 = 20. Apply to qp: bar f(qp) = 5 x 2 = 10. The answer is ppq = 20; qp = 10."
          - problem: "Write the full proof: for the alphabet C = {a, b} and the monoid M = (N, +, 0) of natural numbers under addition, the map Hom(C*, M) -> Hom(C, U M) that restricts a homomorphism to the letters and the map Hom(C, U M) -> Hom(C*, M) that extends a function to the unique homomorphism are inverse bijections. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (restriction is well defined): a homomorphism h: C* -> M has values h(a) and h(b) in M, so restricting it to the one-letter words gives a function C -> U M. Step 2 (extension exists): given f: C -> U M, define the extension on a word as the sum of the values of its letters, sending the empty word to 0; since the decomposition of a word into letters is unique, this is a well-defined homomorphism extending f. Step 3 (the maps are inverse): restricting the extension of f returns f by construction, and every homomorphism h equals the extension of its own restriction, because two homomorphisms from the free monoid that agree on the generators a and b agree on every word. Conclusion: the two maps are inverse bijections Hom(C*, M) -> Hom(C, U M), which is the transpose correspondence Hom(FC, D) = Hom(C, GD) of the adjunction between the free monoid functor and the forgetful functor."
      - id: kp2
        name: Recognizing an adjunction from a familiar bijection
        key_prerequisites: [natural-isomorphisms]
        constraints: "Recover the adjunction direction and the two hom-sets from the raw constructions. Test the correspondence or construct the missing adjoint; do not supply the correspondence and then ask only for a count."
        exemplars:
          - problem: "U:Preord->Set forgets the order. D sends a set to its discrete preorder; I sends it to the indiscrete preorder. For each construction D and I, determine its position relative to U in an adjunction. Encode left adjoint by 0 and right adjoint by 1. Give D,I in that order."
            answer: "0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Match the maps that are automatically monotone to Hom(FX,P)=Hom(X,UP) or Hom(UP,X)=Hom(P,GX). The result is 0, 1."
          - problem: "Let i be the inclusion of the poset of integers into the poset of reals, and let f send each real x to the greatest integer that is <= x. For every integer n and real x the familiar biconditional n <= x if and only if n <= f(x) holds. In a poset each hom-set has at most one element, so this biconditional is itself a hom-set bijection in the standard form Hom(FC, D) = Hom(C, GD). Determine which of the two functors i and f is the left adjoint, and give the largest integer n for which i(n) <= 6.2."
            answer: "adjoint = i; value = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["i"], ["f"]]}, "name": "adjoint"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Full object: the biconditional n <= x if and only if n <= f(x), with i the inclusion of the integers into the reals and f the greatest-integer function. Step 1 (poset rule): each hom-set in a poset has at most one element, so the biconditional is the hom-set bijection Hom(i(n), x) = Hom(n, f(x)). Step 2 (matching rule): reading this against the standard form Hom(FC, D) = Hom(C, GD), the functor applied to the first variable is the left adjoint, so F = i and G = f, that is, i is the left adjoint and f is the right adjoint. Step 3 (adjoint value rule): the largest integer n with i(n) <= 6.2 is the value of the right adjoint at 6.2, the greatest integer <= 6.2, which is 6. The answer is adjoint = i; value = 6."
          - problem: "U:Preord->Set forgets the order, D makes a set discrete, and I makes it indiscrete. A proof proposes the four adjunctions D left adjoint to U, U left adjoint to I, I left adjoint to U, and U left adjoint to D. Test each required hom-set correspondence, including arbitrary target/source preorders. Give the validity bits in that order."
            answer: "1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Identify which functor lies outside each Hom expression. Discrete sources impose no monotonicity condition, and indiscrete targets impose none; the reverse claims fail on a two-point chain. The result is 1, 1, 0, 0."
          - problem: "Let i be the inclusion of the poset of integers into the poset of reals. A student claims that the function r, which sends each real number to the nearest integer and rounds halves upward, is a right adjoint to i. The claim requires the biconditional n <= x if and only if n <= r(x) for every integer n and real x, because in a poset a hom-set bijection is exactly such a biconditional. Test the claim at x = 2.5 and find the smallest integer n for which the two sides of the biconditional disagree."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the biconditional n <= x if and only if n <= r(x) tested at x = 2.5, with r the nearest-integer function that rounds halves upward. Step 1 (poset rule): in a poset each hom-set has at most one element, so the claimed adjunction Hom(i(n), x) = Hom(n, r(x)) is exactly this biconditional. Step 2 (evaluation rule): r(2.5) = 3, because halves round upward. Step 3 (comparison rule): for n = 3 the left side 3 <= 2.5 is false while the right side 3 <= 3 is true, and every integer below 3 makes both sides true. The answer is 3."
          - problem: "In the poset adjunction with inclusion i:Z->R, a proposed right adjoint is truncation toward zero. At x=-3/2, give all integers n in {-2,-1,0,1} for which the required hom-set bijection fails. Derive its two hom-sets before testing them."
            answer: "{-1}"
            answer_contract: {"kind": "set"}
            solution_sketch: "For i left adjoint to r, the two hom-sets are nonempty exactly when n<=x and n<=r(x). The result is {-1}."
          - problem: "For the inclusion i:Z->R, construct both adjoints at x=7/3 from their hom-set conditions. Give L(x),R(x), where L is left adjoint to i and R is right adjoint to i."
            answer: "3, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two adjunctions impose opposite principal-cut conditions, giving ceiling for the left adjoint and floor for the right adjoint. The result is 3, 2."
          - problem: "Write the full proof: the functor that sends a set to its discrete preorder is left adjoint to the forgetful functor from preorders to sets, with the bijection written in the standard Hom(FC, D) = Hom(C, GD) form. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (set up the objects): let S be a set, let P be a preorder, let D(S) be the discrete preorder on S, and let U be the forgetful functor; the claim is the adjunction D -| U. Step 2 (the bijection): a monotone map from D(S) to P is a function on underlying sets that preserves the order, and since the only relation in D(S) is x <= x, every function from S to U(P) preserves it; so the underlying-function assignment is a bijection Hom(D(S), P) = Hom(S, U(P)). Step 3 (standard form): matching this bijection against Hom(FC, D) = Hom(C, GD) with source object S and target object P places F = D on the first variable and G = U on the second, so D is the left adjoint and U is the right adjoint. Step 4 (naturality): for a function g from S to T, precomposing with g on one side corresponds to precomposing with g on the other, and for a monotone map h from P to Q, postcomposing with h corresponds to postcomposing with h, because the same underlying function results in both cases; hence the bijection is natural in both variables. Conclusion: D -| U, with the natural bijection Hom(D(S), P) = Hom(S, U(P)) stated in the standard form."
      - id: kp3
        name: The data and the two naturality conditions
        key_prerequisites: [hom-functors]
        constraints: "Construct and test the two naturality squares of the hom-set bijection, with all changed object indices. Include pointwise bijections that fail naturality."
        exemplars:
          - problem: "Let Phi:Hom(FC,D)->Hom(C,GD) be an adjunction bijection. Arrows c:Cprime->C, h:FC->D, d:D->Dprime are given. Recover Phi of h after F(c). Use the arrow bank 1=c, 2=Phi(h), 3=G(d), 4=eta_Cprime, 5=d; give the component arrow numbers in traversal order."
            answer: "1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality in the first variable precomposes by c; naturality in the second postcomposes by G(d). The indices must change with the source and target. The result is 1, 2."
          - problem: "Let Phi:Hom(FC,D)->Hom(C,GD) be an adjunction bijection. Arrows c:Cprime->C, h:FC->D, d:D->Dprime are given. Recover Phi of d after h. Use the arrow bank 1=c, 2=Phi(h), 3=G(d), 4=eta_Cprime, 5=d; give the component arrow numbers in traversal order."
            answer: "2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality in the first variable precomposes by c; naturality in the second postcomposes by G(d). The indices must change with the source and target. The result is 2, 3."
          - problem: "Let Phi:Hom(FC,D)->Hom(C,GD) be an adjunction bijection. Arrows c:Cprime->C, h:FC->D, d:D->Dprime are given. Recover Phi of d after h after F(c). Use the arrow bank 1=c, 2=Phi(h), 3=G(d), 4=eta_Cprime, 5=d; give the component arrow numbers in traversal order."
            answer: "1, 2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality in the first variable precomposes by c; naturality in the second postcomposes by G(d). The indices must change with the source and target. The result is 1, 2, 3."
          - problem: "For F=G=Id_Set, define pointwise hom-set bijections Phi_X,Y(h)=p_Y after h, where p_{0,1} swaps 0 and 1 and p_{*} is identity. A student claims naturality in the target follows from bijectivity. Derive the required naturality equation and test the arrow d:{*}->{0,1},d(*)=0, at h=1_{*}. Give Phi at the composite, the transported value of Phi(h), and 1 if the claim survives or 0 otherwise."
            answer: "1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A pointwise bijection supplies neither naturality square automatically. Transpose the identity or compose in the required variable, then compare the two routes; their different values refute the general claim. The result is 1, 0, 0."
          - problem: "Let Phi_C,D:Hom(FC,D)->Hom(C,GD). Step 1: for c:Cprime->C and h:FC->D, h after F(c) has domain FCprime. Step 2: Phi_Cprime,D(h after F(c)) has domain Cprime. Step 3: Phi_C,D(h after F(c)) is also defined. Step 4: it equals Phi_C,D(h) after c. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The first-variable index of Phi must match the source of the input arrow; use Cprime for h after F(c). This is the first unsupported step."
          - problem: "For F=G=Id_Set, define pointwise hom-set bijections Phi_X,Y(h)=h after s_X, where s_{0,1} swaps 0 and 1 and s_{*} is identity. A proof claims this already supplies an adjunction and a natural unit. Derive the unit by identity transposition and test it on c:{*}->{0,1},c(*)=0. Give the unit value at 0, the values of its two naturality routes (unit then c, c then unit), and 1 if the claim is justified or 0 otherwise."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A pointwise bijection supplies neither naturality square automatically. Transpose the identity or compose in the required variable, then compare the two routes; their different values refute the general claim. The result is 1, 0, 1, 0."
          - problem: "Write the full proof: the order-preserving map F: (N, at most) to (N, at most) with F(c) = 2c has the right adjoint G(d) = floor(d/2), with bijections from Hom(2c, d) to Hom(c, G(d)) that are natural in c and in d separately. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Data: both categories are the poset (N, at most) viewed as a category, F(c) = 2c is order-preserving, and G(d) = floor(d/2). Step 1 (the bijection and its direction): 2c is at most d exactly when c is at most floor(d/2), so the hom-set Hom(2c, d) is nonempty exactly when Hom(c, G(d)) is; each has at most one element, so sending the unique map to the unique map is a bijection from Hom(2c, d) to Hom(c, G(d)). Step 2 (naturality in c, checked alone): for c' at most c and a map h from 2c to d, the two sides of the naturality equation both lie in the hom-set Hom(c', G(d)), which has at most one element, so they are equal. Step 3 (naturality in d, checked alone): for d at most d' and h from 2c to d, both sides of the naturality equation lie in Hom(c, G(d')), again a set with at most one element, so they are equal. Conclusion: the functors F and G together with these bijections satisfy the hom-set definition of the adjunction F left adjoint to G, with naturality verified in each variable separately."
    diagnostic_exemplar:
      problem: "Let $i\\colon(\\mathbb{Z},\\le)\\to(\\mathbb{R},\\le)$ be the inclusion of posets. Prove that $i\\dashv\\lfloor-\\rfloor$, stating the bijection in the standard $\\mathrm{Hom}(FC,D)\\cong\\mathrm{Hom}(C,GD)$ form and saying why naturality is automatic."
      answer: "For $n\\in\\mathbb{Z}$ and $x\\in\\mathbb{R}$: $i(n)\\le x\\iff n\\le\\lfloor x\\rfloor$, because $\\lfloor x\\rfloor$ is the greatest integer $\\le x$ (if $n\\le x$ then $n\\le\\lfloor x\\rfloor$; conversely $n\\le\\lfloor x\\rfloor\\le x$). In poset categories hom-sets have at most one element, so this biconditional IS the hom-set bijection $\\mathrm{Hom}_{\\mathbb R}(i(n),x)\\cong\\mathrm{Hom}_{\\mathbb Z}(n,\\lfloor x\\rfloor)$, matching the standard form with $F=i$ (left adjoint) and $G=\\lfloor-\\rfloor$ (right adjoint); naturality is automatic since parallel maps of thin categories are equal."
      solution_sketch: "Prove the biconditional $n\\le x\\iff n\\le\\lfloor x\\rfloor$ from the defining property of the floor as the greatest integer below $x$. In a thin category a biconditional is the hom-set bijection, and naturality is vacuous because parallel arrows in a poset are equal."
    anki_seeds:
      - front: "An adjunction $F\\dashv G$ is..."
        back: "a natural isomorphism $\\mathrm{Hom}_{\\mathcal D}(FC,D)\\cong\\mathrm{Hom}_{\\mathcal C}(C,GD)$ in $C,D$; $F$ is the left adjoint, $G$ the right."
        type: basic
      - front: "In $F\\dashv G$, which side of the bijection does the left adjoint act on?"
        back: "the source: $\\mathrm{Hom}(FC,D)$ — the left adjoint is applied to the left-hand object."
        type: basic
      - front: "Naturality of $\\Phi$ in both variables, in one equation?"
        back: "$\\Phi(d\\circ h\\circ Fc)=Gd\\circ\\Phi(h)\\circ c$."
        type: basic

  - id: adjunctions
    name: Adjunctions
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: hom-set-adjunction-definition
        weight: 0.6
        key: true
      - id: hom-functors
        weight: 0.4
        key: true
      - id: natural-isomorphisms
        weight: 0.4
        key: true
      - id: functors
        weight: 0.2
      - id: universal-properties
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Transposes and the unit
        key_prerequisites: [natural-isomorphisms]
        constraints: "Recover the unit by transposing an identity. Derive its naturality using each variable of Phi separately; raw concrete data must leave the unit or adjoint reconstruction to the learner."
        exemplars:
          - problem: "Let F:Set->Set x Set be the diagonal functor and G its right adjoint. A morphism h:F({1,2,3})->({0,1},{5,6}) has component value lists [0,1,1] and [6,5,6]. Construct its transpose from the product universal property and give its value at 2 as (a,b)."
            answer: "(1, 5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The transpose of a morphism $h: F(X) \\to (A, B)$ is the function $\\Phi(h): X \\to G(A, B) = A \\times B$; by the stated bijection it maps each $x$ to the pair $(f(x), g(x))$. The full transpose is given by $\\Phi(h)(1) = (0, 6)$, $\\Phi(h)(2) = (1, 5)$ and $\\Phi(h)(3) = (1, 6)$. Evaluate at the input 2: $f(2) = 1$ and $g(2) = 5$. The answer is (1, 5)."
          - problem: "Let F:Set->Set x Set be the diagonal functor and G its right adjoint, with hom-set bijection Phi. Recover eta_W from Phi applied to an identity arrow. For d:{4,5,6}->{40,60,90} with values [60,40,90], give (GF(d) after eta_W)(4) as (a,b). No component formula for eta is supplied."
            answer: "(60, 60)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Produce the unit from the bijection: $\\eta_W = \\Phi(1_{F(W)}) = \\Phi(1_W, 1_W)$ is the diagonal $w \\mapsto (w, w)$, because $\\Phi$ evaluates both components at $w$. For the left composite, naturality of $\\Phi$ in its second variable with the morphism $F(d)$ gives $GF(d) \\circ \\eta_W = \\Phi(F(d) \\circ 1_{F(W)}) = \\Phi(F(d))$, the function $w \\mapsto (d(w), d(w))$. For the right composite, naturality of $\\Phi$ in its first variable with the morphism $d$ gives $\\eta_{W'} \\circ d = \\Phi(1_{F(W')} \\circ F(d)) = \\Phi(F(d))$, the same function. At the input 4 both composites give $(d(4), d(4)) = (60, 60)$. The answer is (60, 60)."
          - problem: "In the chain 0<1<2<3<4<5<6, F has values [0,1,1,2,2,3,3] and admits a right adjoint G. Recover G from the hom-set condition, then construct the unit at 3 as an identity transpose. Give its target object."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Produce the unit from the bijection: $\\eta_a = \\Phi(1_{F(a)})$ is the transpose of the identity arrow at $F(a)$. At $a = 3$ we have $F(3) = 2$, so the identity arrow at $F(3)$ is the arrow $2 \\to 2$, that is the case $F(3) \\le b$ with $b = 2$. Apply the bijection: the transpose of the arrow $F(3) \\to 2$ is the arrow $3 \\to G(2) = 4$. So the unit arrow at 3 is $3 \\to 4$. The answer is 4."
          - problem: "Let f:{1,2,3,4,5}->{0,1,2} have values [0,1,1,2,1]. Between inclusion-ordered powersets, F sends a subset to its direct image. Construct its right adjoint G and the unit at S={2,3} by transposing the identity of F(S). How many elements has the target set of that unit?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Produce the unit from the bijection: $\\eta_S = \\Phi(1_{F(S)})$ is the transpose of the identity inclusion $f(S) \\subseteq f(S)$. Apply the bijection in the case $T = F(S)$: the transpose is the inclusion $S \\subseteq G(F(S))$, so the target set of the unit arrow is $G(F(S)) = f^{-1}(f(S))$. Compute the full object: $f(\\{2,3\\}) = \\{1\\}$, and the preimage of $\\{1\\}$ under $f$ is $\\{2,3,5\\}$. The target set of the unit arrow at $S$ is $\\{2,3,5\\}$, which has 3 elements. The answer is 3."
          - problem: "For F=G=Id_Set, define pointwise hom-set bijections Phi_X,Y(h)=h after s_X, where s_{0,1} swaps 0 and 1 and s_{*} is identity. A proof claims this already supplies an adjunction and a natural unit. Derive the unit by identity transposition and test it on c:{*}->{0,1},c(*)=0. Give the unit value at 0, the values of its two naturality routes (unit then c, c then unit), and 1 if the claim is justified or 0 otherwise."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A pointwise bijection supplies neither naturality square automatically. Transpose the identity or compose in the required variable, then compare the two routes; their different values refute the general claim. The result is 1, 0, 1, 0."
          - problem: "For Phi_C,D:Hom(FC,D)->Hom(C,GD), consider eta_C=Phi_C,FC(1_FC). Identify which variable of Phi proves each equality: (a) GF(c) after eta_C=Phi_C,FCprime(F(c)); (b) eta_Cprime after c=Phi_C,FCprime(F(c)). Encode first variable as 1, second as 2, and give (a),(b)."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Postcomposition changes the codomain argument of Phi; precomposition changes its source argument. The result is 2, 1."
          - problem: "Write the full proof: for an adjunction with left adjoint $F$ and right adjoint $G$, whose bijection $\\Phi_{C,D}$ maps arrows $FC \\to D$ to arrows $C \\to GD$, the arrow $\\eta_C = \\Phi(1_{FC})$ is natural in $C$, that is, $GF(c) \\circ \\eta_C = \\eta_{C'} \\circ c$ for every morphism $c: C \\to C'$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: for objects $C$ and $D$, the bijection $\\Phi_{C,D}$ from arrows $FC \\to D$ to arrows $C \\to GD$ is natural in $C$ and in $D$. Step 1 (define the unit): set $\\eta_C := \\Phi_{C,FC}(1_{FC})$, an arrow $C \\to GFC$. Step 2 (left composite): naturality of $\\Phi$ in the second variable $D$, used with the morphism $F(c): FC \\to FC'$, gives $GF(c) \\circ \\Phi_{C,FC}(1_{FC}) = \\Phi_{C,FC'}(F(c) \\circ 1_{FC}) = \\Phi_{C,FC'}(F(c))$, hence $GF(c) \\circ \\eta_C = \\Phi_{C,FC'}(F(c))$. Step 3 (right composite): naturality of $\\Phi$ in the first variable $C$, used with the morphism $c: C \\to C'$, gives $\\Phi_{C,FC'}(1_{FC'} \\circ F(c)) = \\Phi_{C',FC'}(1_{FC'}) \\circ c = \\eta_{C'} \\circ c$; since $1_{FC'} \\circ F(c) = F(c)$, this says $\\eta_{C'} \\circ c = \\Phi_{C,FC'}(F(c))$. Step 4 (conclusion): both composites equal $\\Phi_{C,FC'}(F(c))$, so $GF(c) \\circ \\eta_C = \\eta_{C'} \\circ c$ for every $c: C \\to C'$, which is exactly the naturality of the unit."
