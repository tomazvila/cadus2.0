            solution_sketch: "Statement: for fixed A, currying gives a bijection Hom(X×A, B) ≅ Hom(X, B^A), natural in X and in B, so (-×A) ⊣ (-)^A. Step 1 (the map): send f: X×A → B to g: X → B^A with g(x)(a) = f(x,a); this is currying, and it is well defined because the exponential B^A classifies functions from A to B. Step 2 (the inverse): send g: X → B^A to the function (x,a) ↦ g(x)(a); composing the two constructions in either order gives the identity, so the map is a bijection for each X and B. Step 3 (naturality in X): for h: X' → X, currying f∘(h×id) gives x' ↦ (a ↦ f(h(x'),a)), which is g∘h, so the bijection commutes with precomposition. Step 4 (naturality in B): for k: B → B', currying k∘f gives x ↦ (a ↦ k(g(x)(a))), which is postcomposition by k on B^A, so the bijection commutes with postcomposition. Step 5 (conclusion): a bijection Hom(F X, B) ≅ Hom(X, G B) natural in both arguments is exactly the definition of an adjunction, with F = (-×A) and G = (-)^A. Therefore (-×A) is left adjoint to (-)^A, with unit x ↦ (a ↦ (x,a)) and counit the evaluation map."
