        weight: 0.2
      # Phase C reconciliation: kp3 proves Ab reflective in Grp with reflector
      # $G \mapsto G/[G,G]$ — "$f$ kills commutators" and the unique factorisation
      # through the quotient are commutator-subgroup kp3 (the UMP of abelianization).
      - id: commutator-subgroup
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Definition and the universal property of the reflection
        key_prerequisites: [adjunctions]
        constraints: "Construct or test a reflector through the hom-set universal property for a full subcategory. Do not supply the least-target formula before asking for its result. Include failure of reflection and noninvertible units."
        exemplars:
          - problem: "C is the chain 1<2<3<4, and D is its full subcategory on 1,2,4. Construct a left adjoint L to the inclusion by the reflection universal property. Give L(3)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The reflector L, left adjoint to the inclusion of the full subcategory D, sends x to the least object of D that receives an arrow from x. The objects of D are 1, 2 and 4; from 3 there is an arrow to 4 but none to 1 or 2, since 1 and 2 lie below 3 in the chain. So L(3) is 4."
          - problem: "A group G has presentation <r,s | r^4=1,s^2=r^2,srs^-1=r^-1>. Construct its reflection into abelian groups as a quotient of the free abelian group on r,s. Give the invariant factors of the universal quotient, omitting trivial factors of order 1, followed by 1 if the quotient map has unique factorization for every homomorphism G->A with A abelian, or 0 otherwise. Derive the abelian relations from the original presentation."
            answer: "2, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Any map to an abelian group factors through the free abelian group on the generators and kills exactly the subgroup generated by the relator exponent sums. Taking that quotient constructs the universal factorization, with uniqueness inherited from the generators. The result is 2, 2, 1."
          - problem: "A group G has presentation <r,s | r^3=1,s^2=1,srs=r^-1>. Construct its reflection into abelian groups as a quotient of the free abelian group on r,s. Give the invariant factors of the universal quotient, omitting trivial factors of order 1, followed by 1 if the quotient map has unique factorization for every homomorphism G->A with A abelian, or 0 otherwise. Derive the abelian relations from the original presentation."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Any map to an abelian group factors through the free abelian group on the generators and kills exactly the subgroup generated by the relator exponent sums. Taking that quotient constructs the universal factorization, with uniqueness inherited from the generators. The result is 2, 1."
          - problem: "C is the divisibility category of positive divisors of 12, and D is its full subcategory on 1,2,6,12. Construct the reflector L:C->D from its universal property and give L(4)."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The reflector L, left adjoint to the inclusion of the full subcategory D, sends x to the least object of D that x divides. The objects of D are 1, 2, 6 and 12. The object 4 divides 12 and divides none of 1, 2 and 6, so the least such object of D is 12. The answer is 12."
          - problem: "For the reflection of groups into abelian groups, let G=S3. Step 1: the unit q:G->LG permits unique factorization of maps to abelian groups. Step 2: in LG the images of r and s from r^3=s^2=1,srs=r^-1 commute. Step 3: q is injective. Step 4: q is an isomorphism. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Abelianization kills r, a nonidentity three-cycle. Universality of the quotient does not make the unit injective. This is the first unsupported step."
          - problem: "C is the diamond poset with 0<a<1 and 0<b<1, with a and b incomparable. Test whether each full subcategory admits a reflector: (A) {a,b,1}, (B) {0,a,1}, (C) {1}. Give 1 or 0 for A,B,C, respectively."
            answer: "0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "For each object x, a reflection is an object r of the subcategory that represents maps from x into every subcategory object. At 0, two incomparable minimal targets obstruct this in A. The result is 0, 1, 1."
          - problem: "Write the full proof: let D be a full subcategory of a poset C such that every object of C has a least upper bound in D, and let the reflector send each object x to that least upper bound; state which functor is the left adjoint and prove that the unit satisfies the universal property. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the adjunction): let i be the inclusion of D in C, and define the reflector L from C to D by sending each object x to the least object of D above x; L is the left adjoint. Step 2 (the unit): the unit at x is the unique arrow from x to L(x), which exists because x is at most its least upper bound. Step 3 (the universal property): an arrow from x to an object d of D is the statement that x is at most d; since L(x) is the least such object, arrows from x to d coincide with arrows from L(x) to d, so every arrow f from x to i(d) equals i(g) after the unit for a unique g from L(x) to d, unique because a poset has at most one arrow between two objects. Step 4 (conclusion): the bijection is natural since every hom set has at most one element, so L is left adjoint to i, D is reflective, and the unit is universal from each x to i."
      - id: kp2
        name: The counit of a reflection is an isomorphism
        key_prerequisites: [triangle-identities]
        constraints: "Prove counit invertibility using fullness for the lift, faithfulness for one inverse equation, and counit naturality plus the F-triangle for the other. Grade actual comparison arrows or proof steps."
        exemplars:
          - problem: "L:C->D is left adjoint to fully faithful i:D->C. Recover the arrow k:d->Lid used to invert eps_d. In C the arrows i(h1),i(h2),i(h3):id->iLid act on the set {0,1} with value lists [0,0],[0,1],[1,1], while eta_id has values [0,1]. Which h-number must be k?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fullness lifts eta_id to a D-arrow and faithfulness makes that lift unique. The result is 2."
          - problem: "For L left adjoint to fully faithful i, fullness gives k:d->Lid with i(k)=eta_id. Derive eps_d after k=1_d. Match the two successive principles to the bank: 1=faithfulness of i; 2=G-triangle for G=i; 3=fullness alone; 4=F-triangle for F=L. Give their numbers in proof order, starting with an equation in C and ending in D."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The G-triangle gives the equality after applying i; faithfulness reflects that equality back to D. The result is 2, 1."
          - problem: "D has objects 0,1; 0 is a zero object, End(0)={id0}, End(1)={id1,z}, and each cross Hom set has one zero arrow. Composition with a zero arrow is zero. F:1->D selects 0 and i:D->1 is the terminal functor. The Hom sets establish F left adjoint to i. A proof of counit invertibility proposes dropping one of full faithfulness. Determine whether i is full, whether it is faithful, and whether the counit is an isomorphism at both objects. Give those four bits, in that order."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness supplies an arrow lifting the unit, while faithfulness reflects the inverse equality. This explicit adjunction tests which missing hypothesis prevents the counit from being invertible; its component at 1 has no two-sided inverse. The result is 1, 0, 1, 0."
          - problem: "D is the chain 0<1. F:1->D selects 0 and i:D->1 is the terminal functor. The Hom sets establish F left adjoint to i. A proof of counit invertibility proposes dropping one of full faithfulness. Determine whether i is full, whether it is faithful, and whether the counit is an isomorphism at both objects. Give those four bits, in that order."
            answer: "0, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness supplies an arrow lifting the unit, while faithfulness reflects the inverse equality. This explicit adjunction tests which missing hypothesis prevents the counit from being invertible; its component at 1 has no two-sided inverse. The result is 0, 1, 1, 0."
          - problem: "Let L left adjoint to fully faithful i. Step 1: fullness lifts eta_id to k:d->Lid. Step 2: the G-triangle gives i(eps_d) after i(k)=1_id. Step 3: faithfulness gives k after eps_d=1_d. Step 4: therefore eps_d is invertible. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Faithfulness yields eps_d after k=1_d. The displayed reverse composite is an endomorphism of Lid, so Step 3 is ill-typed. This is the first unsupported step."
          - problem: "In the proof that eps_d is invertible for L left adjoint to fully faithful i, k is the lift of eta_id. After naturality one gets k after eps_d=eps_Lid after Li(k). Match Li(k) and the principle reducing this expression to 1_Lid: expression bank 1=L(eta_id),2=i(eta_d),3=eta_Lid; principle bank 1=G-triangle at d,2=F-triangle at id,3=faithfulness alone. Give the two numbers."
            answer: "1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Apply L to the lifting equation; the resulting composite is precisely the F-triangle at the C-object id. The result is 1, 2."
          - problem: "Write the full proof: if L is left adjoint to a fully faithful functor i: D -> C, then the counit eps: Li -> 1_D is a natural isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (fullness produces the comparison map): for each object A of D, the unit component eta_iA: iA -> iLiA lies in the image of i on hom-sets, so fullness gives a morphism k_A: A -> LiA with i(k_A) = eta_iA, unique by faithfulness. Step 2 (faithfulness gives one equation): the second triangle identity gives i(eps_A) o eta_iA = 1_iA, hence i(eps_A o k_A) = i(1_A), and faithfulness yields eps_A o k_A = 1_A. Step 3 (naturality of the counit): applying naturality of eps to the morphism k_A: A -> LiA gives k_A o eps_A = eps_LiA o Li(k_A). Step 4 (first triangle identity gives the other equation): from i(k_A) = eta_iA we get Li(k_A) = L(eta_iA), and the first triangle identity at the object iA reads eps_LiA o L(eta_iA) = 1_LiA, so Step 3 gives k_A o eps_A = 1_LiA. Step 5 (conclusion): the two equations eps_A o k_A = 1_A and k_A o eps_A = 1_LiA show each component eps_A is an isomorphism with inverse k_A; eps is natural by assumption, so eps: Li -> 1_D is a natural isomorphism."
      - id: kp3
        name: Examples and the induced idempotent monad
        key_prerequisites: [full-faithful-functors, commutator-subgroup]
        constraints: "Construct the reflection and its universal factorization in abelianization or preorder antisymmetrization. Recover the induced monad component and explain idempotence through the reflected objects."
        exemplars:
          - problem: "D4=<r,s | r^4=1,s^2=1,srs=r^-1> is the symmetry group of a square. Construct its reflection into the full subcategory of abelian groups using the universal property. Give the order of the reflected group."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fullness check: a homomorphism between abelian groups is exactly a morphism of the subcategory, so nothing is missing. Universal property: a homomorphism from $D_4$ into an abelian group kills every commutator, so it factors uniquely through the quotient by the commutator subgroup. Commutator computation: the commutator subgroup of $D_4$ consists of the identity and the 180-degree rotation, so it has order 2, and the quotient has order $8/2 = 4$. The answer is 4."
          - problem: "A preorder on {0,1,2,3} is generated by 0<=1,1<=0,1<=2,2<=1, with reflexivity and transitivity. Construct its reflection into posets. Encode each class by its least member and give the class code of 0,1,2,3 in order."
            answer: "0, 0, 0, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Every monotone map to a poset identifies mutually reachable elements by antisymmetry. Quotienting by precisely that relation gives the universal factorization. The result is 0, 0, 0, 3."
          - problem: "For S3=<r,s | r^3=1,s^2=1,srs=r^-1>, construct the unit of reflection into abelian groups from the universal property. Give the order of its kernel."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Unit rule: the component $\\eta_G$ is the canonical projection onto the abelianization, so its kernel is exactly the commutator subgroup $[G,G]$. Commutator computation: for $S_3$, the commutator subgroup is the alternating group $A_3$, formed by the identity and the two 3-cycles. Its order is 3, and no larger subgroup lies in the kernel. The answer is 3."
          - problem: "C is the chain 0<1<2<3, D its full subcategory on 1,3. Recover the reflector L and let T=iL. Construct the multiplication component T(T(0))->T(0) of the induced monad. Give its source and target object numbers."
            answer: "1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The reflection supplies a unit-counit adjunction and multiplication i eps L. Each reflected object is already fixed, so this component is invertible. The result is 1, 1."
          - problem: "For a group map f:G->A with A abelian and q:G->G/[G,G], Step 1: f kills every commutator. Step 2: [G,G] lies in ker(f). Step 3: the quotient property gives h:A->G/[G,G] with f=q after h. Step 4: this is the reflection factorization. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The factorization requires h:G/[G,G]->A and f=h after q. The claimed arrows in Step 3 cannot compose. This is the first unsupported step."
          - problem: "In the reflection Preord->Pos, let q:P->LP be the unit for the preorder generated by 0<=1,1<=0,1<=2. A monotone f:P->{0<1} has values [0,0,1]. Classes of LP are numbered by their least member. Construct the unique factor through q, giving its values at classes 0 and 2."
            answer: "0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Antisymmetry in the target forces equal images on each equivalence class; this makes the factor well-defined and unique. The result is 0, 1."
          - problem: "Write the full proof: posets form a reflective subcategory of preorders, and the reflection induces an idempotent monad. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, fullness: a monotone map between posets is exactly a morphism of preorders, so the posets form a full subcategory. Step 2, the reflector: for a preorder $P$, declare $x$ equivalent to $y$ when $x \\le y$ and $y \\le x$; the classes form a poset $P/\\sim$ with $[x] \\le [y]$ iff $x \\le y$, which is well defined and antisymmetric. Step 3, universal property: a monotone $f$ from $P$ to a poset $Q$ sends equivalent elements to equal values, since $f(x) \\le f(y) \\le f(x)$ and antisymmetry force equality, so $f$ equals $h$ after the quotient map $q$ for a unique monotone $h$, naturally in $Q$. Step 4, adjunction: the natural bijection makes the class construction a left adjoint to the inclusion, with unit $q$. Step 5, idempotent monad: the induced monad $T$ is the class construction followed by inclusion, and its multiplication is the counit under inclusion; the counit at each poset is an isomorphism because a poset is its own reflection, so the multiplication is invertible, $T^2 \\cong T$, and the monad is idempotent."
    diagnostic_exemplar:
      problem: "Show that $\\mathbf{Ab}$ is a reflective subcategory of $\\mathbf{Grp}$, identifying the reflector and its unit."
      answer: "$\\mathbf{Ab}$ is full in $\\mathbf{Grp}$: every homomorphism between abelian groups is kept. The reflector is abelianization $G\\mapsto G^{\\mathrm{ab}}=G/[G,G]$: for abelian $A$, any homomorphism $f\\colon G\\to A$ kills commutators ($f(xyx^{-1}y^{-1})=f(x)f(y)f(x)^{-1}f(y)^{-1}=e$ since $A$ is abelian), so $f$ factors uniquely through the quotient map $\\eta_G\\colon G\\to G^{\\mathrm{ab}}$. This gives a natural bijection $\\mathrm{Hom}_{\\mathbf{Ab}}(G^{\\mathrm{ab}},A)\\cong\\mathrm{Hom}_{\\mathbf{Grp}}(G,A)$, i.e. abelianization is left adjoint to the inclusion, with unit $\\eta_G$."
      solution_sketch: "The reflector must kill exactly what obstructs a map into an abelian group, namely the commutators. Show any $f\\colon G\\to A$ with $A$ abelian vanishes on commutators, hence factors uniquely through $G/[G,G]$; that unique factorization is the adjunction bijection, with the quotient map as unit."
    anki_seeds:
      - front: "A reflective subcategory is..."
        back: "a full subcategory whose inclusion has a left adjoint (the reflector)."
        type: basic
      - front: "For an adjunction $L\\dashv i$ with $i$ fully faithful, the counit $\\varepsilon$ is..."
        back: "a natural isomorphism."
        type: basic
      - front: "The reflector of $\\mathbf{Ab}\\subseteq\\mathbf{Grp}$ is {{c1::abelianization $G\\mapsto G/[G,G]$}}."
        back: "abelianization $G\\mapsto G/[G,G]$"
