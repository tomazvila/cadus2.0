    knowledge_points:
      - id: kp1
        name: The general pattern
        key_prerequisites: [adjunctions]
        constraints: "Stay at the level of the general pattern: name the free functor, the forgetful functor and the direction of the adjunction, then describe the unit as the universal insertion of generators $\\eta_X\\colon X\\to U(FX)$ or the counit as the evaluation $\\varepsilon_A\\colon F(UA)\\to A$ of formal expressions; no concrete algebra is computed."
        exemplars:
          - problem: "In the adjunction between sets and a category of algebras, the free functor F is left adjoint to the forgetful functor U; here X stands for a set and A for an algebra. Which sentence describes the unit?"
            answer: "It inserts each x in X as a generator in the underlying set of F(X)."
            answer_contract: {"kind": "label", "options": [["It inserts each x in X as a generator in the underlying set of F(X)."], ["It evaluates at A the formal expressions built from the members of A."], ["It pairs a function X to U(A) with the matching homomorphism F(X) to A."], ["It maps each formal expression over the members of A to a value back in X."]]}
            solution_sketch: "Full object: the unit is the family of maps eta_X from a set X to the underlying set of the free algebra, U(F(X)). Rule of the pattern: eta_X is the transpose of the identity homomorphism on F(X), so it inserts each x as a generator. The option that 'evaluates at A the formal expressions built from the members of A' describes the counit instead. The option that 'pairs a function X to U(A) with the matching homomorphism' describes the bijection of the adjunction itself, not the unit. The option that 'maps each formal expression over the members of A to a value back in X' has the wrong direction and the wrong target; no part of the pattern lands in X. The answer is: It inserts each x in X as a generator in the underlying set of F(X)."
          - problem: "For monoids, the free functor F is left adjoint to the forgetful functor U; here A stands for a monoid and X for a set. Which sentence describes the counit of this adjunction?"
            answer: "It takes each formal expression on the members of A and gives its value in A."
            answer_contract: {"kind": "label", "options": [["It takes each formal expression on the members of A and gives its value in A."], ["It inserts each x of a set X as a generator inside the underlying set of F(X)."], ["It is the identity on F(X), the transpose of the inserted generators."], ["It sends each member of A to the matching formal expression in F(U(A))."]]}
            solution_sketch: "Full object: the counit is the family of homomorphisms eps_A from the free algebra F(U(A)) on the underlying set of A back to A. Rule of the pattern: eps_A is the transpose of the identity function on the underlying set of A, so it evaluates each formal expression built on the members of A. The option that 'inserts each x of a set X as a generator inside the underlying set of F(X)' describes the unit. The option that is 'the identity on F(X)' names the transpose of the unit, not the counit. The option that 'sends each member of A to the matching formal expression in F(U(A))' runs the wrong way; that map is the unit at the underlying set of A. The answer is: It takes each formal expression on the members of A and gives its value in A."
          - problem: "The free monoid functor F and the forgetful functor U form an adjunction between sets and monoids. Take a set X with 3 elements and a monoid A with exactly 4 elements. Using the hom-set bijection of this adjunction, how many monoid homomorphisms are there from F(X) to A?"
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the hom-set bijection of the adjunction, which matches monoid homomorphisms from F(X) to A with functions from X to the underlying set of A. Rule of the adjunction: count the homomorphisms by counting the functions. Each of the 3 elements of X independently chooses one of the 4 elements of A, so the number of functions is 4*4*4. That product is 64. The answer is 64."
          - problem: "The free group functor F and the forgetful functor U form an adjunction between sets and groups. Take a set X with 2 elements and a group G with exactly 5 elements. Using the hom-set bijection of this adjunction, how many group homomorphisms are there from the free group on X to G?"
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the hom-set bijection of the adjunction, which matches group homomorphisms from the free group on X to G with functions from X to the underlying set of G. Rule of the adjunction: count the homomorphisms by counting the functions. Each of the 2 elements of X independently picks one of the 5 elements of G, so the number of functions is 5*5. That product is 25. The answer is 25."
          - problem: "Let X be the set {p, q, r} and let A be a group whose underlying set is {5, 7, 8}, with any group structure. Let g be the function from X to the underlying set of A with g(p) = 7, g(q) = 5, g(r) = 7. The free group functor F is left adjoint to the forgetful functor U, and the transpose of g is the homomorphism from F(X) to A given by the composite of F(g) with the evaluation at A. How many inserted generators of X does this transpose send to the member 7?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the transpose of g is the homomorphism g-hat from F(X) to A, the composite of F(g) with the evaluation at A. Rule of the universal property: the transpose is the unique homomorphism whose composite with the insertion of generators agrees with g. Apply it to each generator: the inserted generator of p goes to 7, the one of q goes to 5, and the one of r goes to 7. The inserted generators landing on the member 7 are those of p and r. The answer is 2."
          - problem: "A student argues that the unit of the free-forgetful adjunction on monoids is itself a monoid homomorphism. Step 1: F sends a set X to the free monoid on X, and U sends a monoid to its underlying set. Step 2: the bijection between homomorphisms from F(X) to A and functions from X to U(A) makes F the left adjoint. Step 3: the unit of an adjunction L left adjoint to R is a family of maps eta_X from X to R(L(X)). Step 4: here R(L(X)) is U(F(X)), which sits inside a monoid, so eta_X is a monoid homomorphism from X to F(X). Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it names the two functors and their directions, from sets to monoids and back. Step 2 is valid: the bijection between homomorphisms from F(X) to A and functions from X to U(A) places F on the left, so F is the left adjoint. Step 3 is valid: for L left adjoint to R, the unit has components from X to R(L(X)). Step 4 is not valid: U(F(X)) is the underlying set of the free monoid, not a monoid, and X carries no operation; the unit is a function of sets, the insertion of generators, never a homomorphism. The first invalid step is Step 4."
          - problem: "Write the full proof: Let F be the free functor and U the forgetful functor from a category of algebras to the category of sets. Prove that F is left adjoint to U, and describe the unit and the counit of this adjunction. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects): F(X) is the algebra of formal expressions on the generator set X, and U(A) is the underlying set of an algebra A. Step 2 (extension): every function f from X to U(A) extends uniquely to the homomorphism f-hat from F(X) to A that evaluates a formal expression by reading f on the generators. Step 3 (bijection): the assignment f to f-hat and restriction back to the generators are inverse to each other, and both sides are natural in X and in A, so homomorphisms from F(X) to A are in bijection with functions from X to U(A); by definition this says F is left adjoint to U. Step 4 (unit): the component eta_X from X to U(F(X)) sends x to its one-generator expression; it is the universal insertion of generators, because a function f out of X is exactly the restriction of its extension f-hat. Step 5 (counit): the component eps_A from F(U(A)) to A is the evaluation of formal expressions; it is the unique homomorphism extending the identity function on U(A), and it is surjective, so A is a quotient of the free algebra on its own members. Step 6 (triangles): evaluating an inserted generator returns that generator, and a formal expression on the generators of F(X) evaluates to itself; these are the triangle identities. Conclusion: F is left adjoint to U, the unit is the insertion of generators, and the counit is the evaluation."
      - id: kp2
        name: Free vector spaces
        key_prerequisites: [functor-examples]
        constraints: "Free vector spaces $k^{(X)}$ on a set $X$ only; describe the free functor by its basis and every linear map out of it by its values on basis elements; a counit description must give the formula $\\sum_v\\lambda_v e_v\\mapsto\\sum_v\\lambda_v v$ and say what presentation of $V$ it exhibits."
        exemplars:
          - problem: "The free functor for the forgetful functor $U\\colon\\mathbf{Vect}_k\\to\\mathbf{Set}$ sends a set $X$ to the free vector space $k^{(X)}$, the space with basis $\\{e_x : x \\in X\\}$. Let $X = \\{a, b, c, d, e, f\\}$. What is the dimension of $k^{(X)}$?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free functor sends a set $X$ to $k^{(X)}$, the vector space with basis $\\{e_x : x \\in X\\}$, by the definition of a free vector space. A basis of that form has one vector $e_x$ per element of $X$, so $\\dim k^{(X)} = |X|$ by the definition of dimension. With $|X| = 6$, the answer is 6."
          - problem: "For the free-forgetful adjunction between $\\mathbf{Vect}_k$ and $\\mathbf{Set}$, the counit at a vector space $V$ is the linear map $\\varepsilon_V\\colon k^{(UV)}\\to V$ sending each basis vector $e_v$ to $v$ and extending linearly. Take $V = \\mathbb{R}^2$ and the element $4e_{(1,0)} - 3e_{(0,1)}$ of $k^{(UV)}$. Compute $\\varepsilon_V$ of this element. Give the answer as (x, y)."
            answer: "(4, -3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The counit is the linear map $\\varepsilon_V\\colon k^{(UV)}\\to V$ given by the formula $\\sum_v \\lambda_v e_v \\mapsto \\sum_v \\lambda_v v$. Apply it to the full element $4e_{(1,0)} - 3e_{(0,1)}$: linearity gives $4\\,(1,0) - 3\\,(0,1)$. Compute the combination: $4\\,(1,0) - 3\\,(0,1) = (4, -3)$. The answer is (4, -3)."
          - problem: "Let $X = \\{a, b\\}$, so the free vector space $k^{(X)}$ has basis $e_a, e_b$. A linear map $T\\colon k^{(X)}\\to\\mathbb{R}^2$ is determined by its values on the basis, and here $T(e_a) = (1, 2)$ and $T(e_b) = (0, -3)$. Compute $T(2e_a + 3e_b)$. Give the answer as (x, y)."
            answer: "(2, -5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "A linear map out of a free vector space is determined by its values on the basis, which is the universal property of $k^{(X)}$. Use linearity on the full element $2e_a + 3e_b$: $T(2e_a + 3e_b) = 2T(e_a) + 3T(e_b) = 2(1,2) + 3(0,-3)$. Compute: $(2, 4) + (0, -9) = (2, -5)$. The answer is (2, -5)."
          - problem: "Let $V$ be the vector space over the field with two elements whose four vectors are $0$, $u$, $v$ and $u+v$. Let $X = \\{1, 2, 3\\}$. The adjunction Free $\\dashv$ $U$ gives a bijection between linear maps $k^{(X)}\\to V$ and functions $X \\to U(V)$. How many linear maps from $k^{(X)}$ to $V$ are there?"
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The adjunction Free $\\dashv$ $U$ gives the bijection $\\mathrm{Hom}_{\\mathbf{Vect}}(k^{(X)}, V) \\cong \\mathrm{Hom}_{\\mathbf{Set}}(X, U(V))$: each function on the basis extends uniquely to a linear map, since $k^{(X)}$ is free. So the number of linear maps equals the number of functions from the 3-element set $X$ to the 4-element set $U(V)$. Count functions: $4^3 = 64$. The answer is 64."
          - problem: "Let $V = \\mathbb{R}^2$ and let $v = (1, 1)$ and $w = (2, 2)$ be elements of $V$. The counit $\\varepsilon_V\\colon k^{(UV)}\\to V$ sends $\\sum_v \\lambda_v e_v$ to $\\sum_v \\lambda_v v$, so its kernel is the space of linear relations among elements of $V$. Find integers $a$ and $b$, with $a$ positive and as small as possible, such that $a\\,v + b\\,w = 0$, so that $a e_v + b e_w$ lies in the kernel. Give the answer as (a, b)."
            answer: "(2, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By the counit formula $\\sum_v \\lambda_v e_v \\mapsto \\sum_v \\lambda_v v$, the kernel of $\\varepsilon_V$ records the linear relations among elements of $V$, and $V \\cong k^{(UV)}/\\ker\\varepsilon_V$, so the counit presents $V$ by generators (its elements) and relations. Write the relation: $a\\,v + b\\,w = a(1,1) + b(2,2) = (a+2b,\\ a+2b)$. Solve $(a + 2b, a + 2b) = (0,0)$ with $a$ positive and minimal: $b = -1$ and $a = 2$. The answer is (2, -1)."
          - problem: "Claim: for every vector space $V$, the counit $\\varepsilon_V\\colon k^{(UV)}\\to V$ is an isomorphism. Step 1: $\\varepsilon_V$ sends each basis vector $e_v$ to $v$. Step 2: every vector of $V$ is a linear combination of elements of $V$. Step 3: hence $\\varepsilon_V$ is surjective. Step 4: a surjective linear map between vector spaces is injective, so $\\varepsilon_V$ is an isomorphism. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly states the counit formula $\\sum_v \\lambda_v e_v \\mapsto \\sum_v \\lambda_v v$. Step 2 is true: every vector $v$ equals $1 \\cdot v$. Step 3 follows from Step 2, since each vector of $V$ is the image of a combination of basis vectors. Step 4 is the first invalid step: a surjective linear map need not be injective; for instance $\\varepsilon_{\\mathbb{R}^2}$ kills $e_v + e_w - e_{v+w}$, so $\\varepsilon_V$ only presents $V \\cong k^{(UV)}/\\ker\\varepsilon_V$. The answer is Step 4."
          - problem: "Write the full proof: the free functor $X \\mapsto k^{(X)}$ is left adjoint to the forgetful functor $U\\colon\\mathbf{Vect}_k\\to\\mathbf{Set}$, via a bijection $\\mathrm{Hom}_{\\mathbf{Vect}}(k^{(X)}, V) \\cong \\mathrm{Hom}_{\\mathbf{Set}}(X, U(V))$ natural in $X$ and $V$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Define the free functor on objects: $\\mathrm{Free}(X) = k^{(X)}$, the vector space of finitely supported functions $X \\to k$, with basis $\\{e_x : x \\in X\\}$, where $e_x$ is the function that is $1$ at $x$ and $0$ elsewhere; on a function $f\\colon X \\to Y$ it is the linear map with $e_x \\mapsto e_{f(x)}$. Step 1 (the bijection): given a function $g\\colon X \\to U(V)$, define $g^{\\#}\\colon k^{(X)}\\to V$ by linear extension, $g^{\\#}\\big(\\sum_x \\lambda_x e_x\\big) = \\sum_x \\lambda_x g(x)$; this is the unique linear map with $g^{\\#}(e_x) = g(x)$, because a linear map out of a free space is determined by its values on the basis. Step 2 (the inverse): given a linear map $T\\colon k^{(X)}\\to V$, send it to the function $x \\mapsto T(e_x)$ in $\\mathbf{Set}$; the two constructions undo each other, so $\\mathrm{Hom}_{\\mathbf{Vect}}(k^{(X)}, V) \\cong \\mathrm{Hom}_{\\mathbf{Set}}(X, U(V))$. Step 3 (naturality): both constructions commute with precomposition in $X$ and postcomposition in $V$, since composition acts identically on both sides. Step 4 (conclusion): by the definition of adjunction via a natural hom-set bijection, Free $\\dashv$ $U$, with unit $\\eta_X\\colon X \\to U(k^{(X)})$ sending $x$ to the basis vector $e_x$."
      - id: kp3
        name: A forgetful functor with adjoints on both sides
        key_prerequisites: [adjunctions]
        constraints: "Forgetful functors carrying adjoints on both sides, limited to $U\\colon\\mathbf{Top}\\to\\mathbf{Set}$ and $\\mathrm{Ob}\\colon\\mathbf{Cat}\\to\\mathbf{Set}$; the discrete construction must be identified as the LEFT adjoint and the indiscrete one as the RIGHT adjoint, each justified by saying which maps are automatically legal."
        exemplars:
          - problem: "Let U be the forgetful functor from topological spaces to sets. The discrete construction sends a set X to the space disc(X) in which every subset of X is open. Take a set X with 3 elements and a space Y whose underlying set U(Y) has 4 elements. Every function from X to U(Y) is a legal continuous map from disc(X) to Y, because each preimage of an open set is a subset of X and is therefore open. How many continuous maps from disc(X) to Y are there?"
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the hom-set bijection for the left adjoint says continuous maps disc(X) to Y correspond exactly to functions X to U(Y), because maps out of a discrete space are automatically continuous. Count functions from the 3-element set X to the 4-element set U(Y): each of the 3 elements of X has 4 choices of image. Total: 4 * 4 * 4 = 64. The answer is 64."
          - problem: "The object-set functor Ob sends a small category to its set of objects. The discrete construction disc(S) builds the category whose objects are the elements of S and whose only arrows are the identity arrows. Let S be a set with 2 elements and let C be a category with 5 objects. A functor from disc(S) to C is exactly a function from S to the object set of C, since identity arrows must go to identity arrows and nothing else needs to be preserved. How many functors from disc(S) to C are there?"
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the hom-set bijection for the left adjoint says functors disc(S) to C correspond exactly to functions S to Ob(C), because a functor out of a discrete category only has to name images of objects. Count functions from the 2-element set S to the 5-element set Ob(C): each of the 2 objects of S has 5 choices of image. Total: 5 * 5 = 25. The answer is 25."
          - problem: "Let U be the forgetful functor from topological spaces to sets. The indiscrete construction sends a set Y to the space indisc(Y) whose only open sets are the empty set and Y itself. Take a space X whose underlying set U(X) has 3 elements and a set Y with 5 elements. Every function from U(X) to Y is a legal continuous map from X to indisc(Y), because the preimage of an open set of indisc(Y) is empty or all of X, both open in X. How many continuous maps from X to indisc(Y) are there?"
            answer: "125"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the hom-set bijection for the right adjoint says continuous maps X to indisc(Y) correspond exactly to functions U(X) to Y, because maps into an indiscrete space are automatically continuous. Count functions from the 3-element set U(X) to the 5-element set Y: each of the 3 elements has 5 choices of image. Total: 5 * 5 * 5 = 125. The answer is 125."
          - problem: "The object-set functor Ob sends a small category to its set of objects. The indiscrete construction indisc(S) builds the category on the set S with exactly one arrow from s to t for each ordered pair of objects s and t in S. Let C be a category with 2 objects and let S be a set with 6 elements. Any function from the object set of C to S extends to a functor from C to indisc(S), because images of arrows and composites are forced to be the unique arrows. How many functors from C to indisc(S) arise this way?"
            answer: "36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the hom-set bijection for the right adjoint says functors C to indisc(S) correspond exactly to functions Ob(C) to S, because maps into an indiscrete category are automatically legal functors once objects are named. Count functions from the 2-element set Ob(C) to the 6-element set S: each of the 2 objects has 6 choices of image. Total: 6 * 6 = 36. The answer is 36."
          - problem: "The indiscrete construction on a set X produces the topological space whose only open sets are the empty set and X itself, no matter how many elements X has. This is the construction that makes every map into the space automatically continuous. For a set X with 6 elements, how many open sets does the indiscrete space on X have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the indiscrete topology declares open exactly the empty set and the whole underlying set, independent of the size of X. List the open sets: the empty set, and X itself. Total: 2 open sets. The answer is 2."
          - problem: "A student argues that the indiscrete construction is the left adjoint of the forgetful functor U from topological spaces to sets. Step 1: give the indiscrete space on X the topology whose only open sets are the empty set and X. Step 2: a continuous map from that indiscrete space to any space Y is then any function from X to U(Y). Step 3: continuous maps from the indiscrete space on X to Y therefore correspond to functions from X to U(Y). Step 4: this bijection proves that the indiscrete construction is the left adjoint of U. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly defines the indiscrete topology. Step 2 is the first invalid step: automatic continuity holds for maps into an indiscrete space, not for maps out of one, since the preimage of an open set of Y under a map out of the indiscrete space need not be empty or all of X. Step 3 merely translates the false claim of Step 2 into a bijection, so it inherits the error and is not the first failure. Step 4 correctly reads an adjunction out of the stated bijection. The first step that is not valid is Step 2."
          - problem: "Write the full proof: the forgetful functor U from topological spaces to sets has a left adjoint, the discrete construction, and a right adjoint, the indiscrete construction, with each adjunction justified by the maps that are automatically continuous. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (left adjoint construction): give disc(X) the topology in which every subset of X is open. Step 2 (automatic legality): any function f from disc(X) to a space Y is continuous, because the preimage of any open set of Y is a subset of X and is therefore open. Step 3 (bijection): continuous maps disc(X) to Y correspond exactly to functions X to U(Y), which is the hom-set bijection showing the discrete construction is left adjoint to U. Step 4 (right adjoint construction): give indisc(Y) the topology whose only open sets are the empty set and Y. Step 5 (automatic legality): any function g from a space X to indisc(Y) is continuous, because the preimage of an open set of indisc(Y) is empty or all of X, both open in X. Step 6 (bijection): continuous maps X to indisc(Y) correspond exactly to functions U(X) to Y, the hom-set bijection showing U is left adjoint to the indiscrete construction. Conclusion: U carries a left adjoint, the discrete construction, and a right adjoint, the indiscrete construction."
    diagnostic_exemplar:
      problem: "Show that the forgetful functor $U\\colon\\mathbf{Top}\\to\\mathbf{Set}$ has both a left adjoint and a right adjoint, exhibiting the two hom-set bijections."
      answer: "Left adjoint: the discrete-space functor. Every function from a discrete space is continuous (all subsets are open in the source), so $\\mathrm{Hom}_{\\mathbf{Top}}(X_{\\mathrm{disc}},Y)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UY)$, natural in both variables: $\\mathrm{disc}\\dashv U$. Right adjoint: the indiscrete-space functor. Every function into an indiscrete space is continuous (only $\\varnothing$ and the whole set are open in the target), so $\\mathrm{Hom}_{\\mathbf{Top}}(X,Y_{\\mathrm{ind}})\\cong\\mathrm{Hom}_{\\mathbf{Set}}(UX,Y)$: $U\\dashv\\mathrm{ind}$."
      solution_sketch: "Ask on which side continuity comes for free. Every map out of a discrete space is continuous, giving $\\mathrm{disc}\\dashv U$; every map into an indiscrete space is continuous, giving $U\\dashv\\mathrm{ind}$. Each observation is itself the hom-set bijection."
    anki_seeds:
      - front: "Free-forgetful adjunction pattern?"
        back: "Free $\\dashv$ Forgetful: $\\mathrm{Hom}_{\\mathcal A}(FX,A)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UA)$; unit inserts generators."
        type: basic
      - front: "The free vector space on a set $X$ is {{c1::$k^{(X)}$, with basis $X$}}."
        back: "$k^{(X)}$, with basis $X$"
        type: cloze

  - id: galois-connections
    name: Galois Connections
    core: false
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: partial-orders
        weight: 0.4
        key: true
      - id: unit-counit
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: A Galois connection is an adjunction of posets
        key_prerequisites: [partial-orders]
        constraints: "Monotone Galois connections between posets, always stated as the biconditional $f(p)\\le q\\iff p\\le g(q)$ with the left adjoint named; instances limited to abstract posets and the image/preimage pair on powersets ordered by inclusion. Naturality never has to be checked, since hom-sets of a poset category have at most one element."
        exemplars:
          - problem: "Let h be the function from X = {1, 2, 3, 4, 5} to Y = {1, 2, 3} given by h(1) = 1, h(2) = 1, h(3) = 2, h(4) = 3, h(5) = 3. On the powersets of X and Y ordered by inclusion, the image map is left adjoint to the preimage map. Give the image set of S = {1, 2, 4}."
            answer: "{1, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The image map takes a subset of X to the set of all values h(x) with x in that subset; it is the left adjoint of the Galois connection. Evaluate h at each element of S by substitution: h(1) = 1, h(2) = 1, and h(4) = 3. Collect the values and drop repeats, which gives the set {1, 3}. The answer is {1, 3}."
          - problem: "Let k be the function from X = {1, 2, 3, 4, 5, 6} to Y = {1, 2} given by k(1) = 1, k(2) = 1, k(3) = 1, k(4) = 1, k(5) = 2, k(6) = 2. On the powersets of X and Y ordered by inclusion, the preimage map is right adjoint to the image map. Give the preimage set of T = {1}."
            answer: "{1, 2, 3, 4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The preimage map takes a subset T of Y to the set of all x in X with k(x) in T; it is the right adjoint of the Galois connection. Check every element of X against T: k(1) through k(4) equal 1, which lies in T, while k(5) = k(6) = 2 does not. The preimage set is {1, 2, 3, 4}, and the answer is {1, 2, 3, 4}."
          - problem: "Let P = Q be the chain of all integers with the usual order, and let the left adjoint f from P to Q be f(p) = p - 2, which is monotone. Its right adjoint g is the map with f(p) <= q if and only if p <= g(q) for all p and q. Give g(q) as a function of q."
            answer: "q + 2"
            answer_contract: {"kind": "function", "vars": ["q"]}
            solution_sketch: "The Galois connection is defined by the biconditional p - 2 <= q if and only if p <= g(q). Add 2 to both sides of the left inequality, using the order rule of the chain: p - 2 <= q exactly when p <= q + 2. So the right adjoint is g(q) = q + 2, and the answer is q + 2."
          - problem: "Let P be the chain of nonnegative integers with the usual order, and let the left adjoint f from P to P be f(p) = p^2, which is monotone. Its right adjoint g satisfies p^2 <= q if and only if p <= g(q). Give the value g(10)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The biconditional says that g(10) is the largest integer p with p^2 <= 10. Test candidates in the chain: 3^2 = 9 <= 10, while 4^2 = 16 > 10. Hence the largest p with p^2 <= 10 is 3, and the answer is 3."
          - problem: "Let P be the poset of the numbers 1, 2, 3, 6 ordered by divisibility, and let the left adjoint f from P to P be f(p) = gcd(p, 2), which is monotone. Its right adjoint g satisfies: gcd(p, 2) divides q if and only if p divides g(q). Give g(1) and g(2)."
            answer: "g1 = 3; g2 = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "g1"}, {"contract": {"kind": "exact"}, "name": "g2"}]}
            solution_sketch: "The biconditional says that g(q) is the largest element p of the poset with gcd(p, 2) dividing q. For q = 1, gcd(p, 2) must be 1, so p is 1 or 3, and the largest is 3. For q = 2, both possible values 1 and 2 divide 2, so every element p works and the largest is 6. The answer is g1 = 3; g2 = 6."
          - problem: "Claim: for every function h from a set X to a set Y, the preimage map is left adjoint to the image map between the powersets of X and Y ordered by inclusion. Step 1: the image map and the preimage map are both monotone for inclusion. Step 2: to prove the claim we must show, for every subset S of X and T of Y, that the preimage of T is contained in S if and only if T is contained in the image of S. Step 3: assume the preimage of T is contained in S, and take an element y of T; then y equals h(x) for some element x of X. Step 4: that x lies in the preimage of T, hence in S, so y lies in the image of S, which proves the claim. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: the image map and the preimage map both preserve inclusion. Step 2 is valid: it states exactly the biconditional required for the preimage map to be the left adjoint. Step 3 is not valid: an element of T need not be of the form h(x), since h need not be surjective, for example a constant function with T the whole codomain. Step 4 builds on the invalid Step 3, so it never comes into play. The answer is Step 3."
          - problem: "Write the full proof: for a function h from a set X to a set Y, the image map is left adjoint to the preimage map between the powersets of X and Y ordered by inclusion. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: define the maps. The image map sends a subset S of X to the set of all h(s) with s in S, and the preimage map sends a subset T of Y to the set of all x in X with h(x) in T. Both are monotone for inclusion, because a larger set has a larger image and a larger preimage. Step 2: one direction. Assume the image of S is contained in T, and take s in S. Then h(s) is in the image of S, hence in T, so s is in the preimage of T. Thus S is contained in the preimage of T. Step 3: the converse. Assume S is contained in the preimage of T, and take y in the image of S. Then y = h(s) for some s in S, and s lies in the preimage of T, so h(s) = y lies in T. Thus the image of S is contained in T. Step 4: conclusion. The two directions give the biconditional, which is exactly the hom-set bijection of an adjunction between the poset categories; each hom-set has at most one element, so naturality is automatic. Therefore the image map is left adjoint to the preimage map."
      - id: kp2
        name: Closure operators from the round trip
        key_prerequisites: [adjunctions]
        constraints: "Argue only from the unit $p\\le gf(p)$ and the counit $fg(q)\\le q$ plus monotonicity; every equality of elements must be obtained by antisymmetry, and 'closure operator' means monotone, inflationary and idempotent, verified in that order."
        exemplars:
          - problem: "Let P be the chain 0 < 1 < 2 < 3 < 4 < 5 and let Q be the chain 0 < 1 < 2. The map f from P to Q is given by f(0)=0, f(1)=0, f(2)=1, f(3)=1, f(4)=2, f(5)=2, and the map g from Q to P by g(0)=1, g(1)=3, g(2)=5; f is left adjoint to g, so the unit p <= gf(p) and the counit fg(q) <= q hold. Let c = gf be the round trip on P. Compute c(4)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the round trip c = gf, computed as c(p) = g(f(p)) from the two tables. Step 1 applies the map f: from its table, f(4) = 2. Step 2 applies the map g: from its table, g(2) = 5. Step 3 checks the unit: 4 <= 5, so the round trip lifts 4 upward to a closed element. The answer is 5."
          - problem: "Let P be the chain 0 < 1 < 2 < 3 < 4 < 5 < 6 < 7 and let Q be the chain 0 < 1 < 2 < 3. The map f from P to Q sends p to half of p rounded down, and the map g from Q to P sends q to 2q+1; f is left adjoint to g, and the round trip on P is c = gf. The closed elements of P are the p with c(p) = p, namely 1, 3, 5 and 7, and every element of Q is open, meaning fg(q) = q. The restrictions of f and g are mutually inverse bijections between the closed and the open elements. Give the element of Q that corresponds to the closed element 7."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the correspondence between closed and open elements: it sends a closed p to f(p), and an open q back by g. Step 1 checks that 7 is closed: half of 7 rounded down is 3, so f(7) = 3, and g(3) = 7, hence c(7) = 7. Step 2 computes the partner: f(7) = 3, and 3 is open because fg(3) = f(g(3)) = f(7) = 3. Step 3 checks the inverse direction: g(3) = 7 returns the closed element. The answer is 3."
          - problem: "Let P be the set of all subsets of {1,2,3}, ordered by inclusion. Define f(S) as the intersection of S with {2,3}, and g(T) as the union of T with {1}; these maps form a Galois connection with f left adjoint to g, and c = gf is the round trip on P. A subset S is closed when c(S) = S. How many closed subsets does P have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the round trip c(S) = g(f(S)): first intersect S with {2,3}, then take the union with {1}. Step 1 uses the unit: S is contained in c(S), and c(S) always contains 1, so every closed subset must contain 1. Step 2 checks the converse: if S already contains 1, then the round trip changes nothing, so c(S) = S. Step 3 counts the subsets of {1,2,3} containing 1: {1}, {1,2}, {1,3} and {1,2,3}. The answer is 4."
          - problem: "Let P be the set of divisors of 12 and Q the set of divisors of 4, both ordered by divisibility. The map f from P to Q sends p to the greatest common divisor of p and 4, and the map g from Q to P sends q to 3q; f is left adjoint to g, so the unit says that the round trip c(p) = gf(p) is always a multiple of p. Compute c(c(2))."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the round trip c(p) = g(f(p)) = 3 times the greatest common divisor of p and 4, on the divisors of 12. Step 1 takes the first trip: f(2) = 2, then c(2) = g(2) = 6, and the unit holds since 2 divides 6. Step 2 takes the second trip: f(6) = 2, then c(6) = g(2) = 6. Step 3 compares: c(c(2)) = 6 agrees with c(2), the antisymmetry step of the idempotence proof, since 6 divides 6 in both directions. The answer is 6."
          - problem: "Claim: if f is left adjoint to g in a Galois connection between posets, the round trip c = gf is idempotent. Step 1: by the unit, p <= c(p) holds for every p. Step 2: c is a composite of monotone maps, hence monotone, so c(p) <= c(c(p)). Step 3: the counit at the element f(p) of the other poset reads fg(f(p)) <= f(p). Step 4: apply the monotone map f to Step 3; this yields c(c(p)) <= c(p). Step 5: antisymmetry applied to Step 2 and Step 4 gives c(c(p)) = c(p). Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "The claim is the idempotence part of the closure operator proof, and each step must follow from the unit, the counit and monotonicity alone. Step 1 is valid: it is exactly the unit p <= gf(p). Step 2 is valid: a composite of monotone maps is monotone, so applying c preserves the inequality. Step 3 is valid: it is the counit fg(q) <= q taken at q = f(p). Step 5 is valid: antisymmetry turns the two opposite inequalities into the equality c(c(p)) = c(p). Step 4 is the first invalid step: applying f to Step 3 lands in the wrong poset and does not produce c(c(p)) <= c(p); the correct move is to apply the monotone map g, which gives gf(gf(p)) <= gf(p). The answer is Step 4."
          - problem: "A student proves that the round trip c = gf of a Galois connection, with f left adjoint to g, is idempotent. Line 1: by the unit, p <= c(p), and since c is monotone also c(p) <= c(c(p)). Line 2: missing. Line 3: antisymmetry applied to Lines 1 and 2 gives c(c(p)) = c(p). Line 2 must be the inequality obtained from the counit by monotonicity of g. Give the inequality of Line 2."
            answer: "g(f(g(f(p)))) <= g(f(p))"
            answer_contract: {"kind": "label", "options": [["g(f(g(f(p)))) <= g(f(p))"], ["f(g(f(p))) <= f(p)"], ["g(f(g(f(p)))) >= g(f(p))"], ["g(f(p)) <= p"]]}
            solution_sketch: "The full object is the missing half of the idempotence proof: the inequality c(c(p)) <= c(p), written with f and g in place of c. Step 1 starts from the counit at the element f(p) of the other poset: f(g(f(p))) <= f(p). Step 2 applies the monotone map g to both sides, which gives g(f(g(f(p)))) <= g(f(p)), exactly Line 2. Step 3 finishes by antisymmetry with Line 1. The wrong option f(g(f(p))) <= f(p) is the counit itself, not the result of applying g, and it lives in the wrong poset; the option with >= just repeats Line 1 in the wrong direction; the option g(f(p)) <= p reverses the unit and claims the round trip lowers p. The answer is g(f(g(f(p)))) <= g(f(p))."
          - problem: "Write the full proof: let f be left adjoint to g in a Galois connection between posets, with unit p <= gf(p) and counit fg(q) <= q, and prove that the round trip c = gf is a closure operator, that is, c is monotone, inflationary and idempotent. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full object: c = gf is the round trip on P, and a closure operator is monotone, inflationary and idempotent; we verify the three properties in that order, using only the unit, the counit and monotonicity. Step 1 (monotone): f and g are monotone, and a composite of monotone maps is monotone, so c is monotone. Step 2 (inflationary): the unit of the connection at p reads p <= gf(p) = c(p), so c is inflationary. Step 3 (idempotent): the unit at the element c(p) gives c(p) <= c(c(p)); for the reverse inequality, the counit at the element f(p) of the other poset reads fg(f(p)) <= f(p), and applying the monotone map g to both sides yields gf(gf(p)) <= gf(p), that is, c(c(p)) <= c(p); the equality c(c(p)) = c(p) is then obtained by antisymmetry from the two inequalities. Conclusion: c is monotone, inflationary and idempotent, so c is a closure operator; dually, fg is an interior operator."
    diagnostic_exemplar:
      problem: "Let $f\\dashv g$ be a monotone Galois connection between posets ($f(p)\\le q\\iff p\\le g(q)$). Prove that $c=g\\circ f$ is a closure operator: monotone, inflationary, and idempotent."
      answer: "Monotone: composite of monotone maps. Inflationary: from $f(p)\\le f(p)$ the biconditional gives $p\\le gf(p)=c(p)$ (the unit). Idempotent: $c(p)\\le c(c(p))$ by the unit; for the reverse, the counit $fg(q)\\le q$ at $q=f(p)$ gives $fgf(p)\\le f(p)$, and applying the monotone $g$ yields $c(c(p))=gfgf(p)\\le gf(p)=c(p)$. By antisymmetry $c(c(p))=c(p)$."
      solution_sketch: "Monotonicity is inherited from the two maps. Inflationary is the unit, obtained by feeding $f(p)\\le f(p)$ into the biconditional; for idempotence use the counit $fg(q)\\le q$ at $q=f(p)$, apply the monotone $g$, and close with antisymmetry."
    anki_seeds:
      - front: "A Galois connection is an adjunction between..."
        back: "posets (thin categories): monotone $f,g$ with $f(p)\\le q\\iff p\\le g(q)$."
        type: basic
      - front: "For a Galois connection $f\\dashv g$, the composite $g\\circ f$ is a {{c1::closure operator}}."
        back: "closure operator"
        type: cloze

  - id: reflective-subcategories
    name: Reflective Subcategories
    core: false                # terminal adjunction application
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: unit-counit
        weight: 0.4
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: triangle-identities
        weight: 0.3
      - id: subcategories
        weight: 0.2
      - id: first-isomorphism-theorem
        weight: 0.2
      # Phase C reconciliation: kp3 proves Ab reflective in Grp with reflector
      # $G \mapsto G/[G,G]$ — "$f$ kills commutators" and the unique factorisation
      # through the quotient are commutator-subgroup kp3 (the UMP of abelianization).
      - id: commutator-subgroup
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Definition and the universal property of the reflection
        key_prerequisites: [adjunctions]
        constraints: "The subcategory must be full; state which functor is the left adjoint."
        exemplars:
          - problem: "Let C be the poset with objects 1, 2, 3, 4 and one arrow from x to d exactly when x is at most d, viewed as a category. Let D be the full subcategory on the objects 1, 2 and 4. The reflector L is left adjoint to the inclusion of D and sends each object x to the least object d of D for which there is an arrow from x to d. Give L(3)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The reflector L, left adjoint to the inclusion of the full subcategory D, sends x to the least object of D that receives an arrow from x. The objects of D are 1, 2 and 4; from 3 there is an arrow to 4 but none to 1 or 2, since 1 and 2 lie below 3 in the chain. So L(3) is 4."
          - problem: "The category of abelian groups is a full subcategory of the category of groups, and the abelianization functor, left adjoint to the inclusion, is the reflector. The universal property of the reflection gives a bijection between homomorphisms from a group G to an abelian group A and homomorphisms from the abelianization of G to A. Determine how many group homomorphisms there are from the quaternion group of order 8 to the cyclic group of order 2."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The universal property of the reflection gives a bijection from homomorphisms out of the abelianization to homomorphisms from the group to an abelian group. The commutator subgroup of the quaternion group has order 2, so the abelianization has order 4 and is a product of two cyclic groups of order 2. A homomorphism from that product to the cyclic group of order 2 chooses, independently for each factor, the trivial map or the nontrivial map. That gives 2 times 2 choices, so there are 4 homomorphisms."
          - problem: "In the reflection of Ab in Grp, the abelianization functor is left adjoint to the inclusion of the full subcategory, so homomorphisms from a group G to an abelian group A correspond exactly to homomorphisms from the abelianization of G to A. Determine how many group homomorphisms there are from S3 to Z/2."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The universal property of the reflection gives a bijection between homomorphisms from S3 to Z/2 and homomorphisms from the abelianization of S3 to Z/2. The abelianization of S3 is Z/2, since its commutator subgroup is the alternating group of order 3. Homomorphisms from Z/2 to Z/2 are the trivial map and the identity map, so there are 2. The answer is 2."
          - problem: "Let C be the poset of positive divisors of 12, with one arrow from x to d exactly when x divides d, viewed as a category. Let D be the full subcategory on the objects 1, 2, 6 and 12. The reflector L is left adjoint to the inclusion of D and sends each object x to the least object d of D that x divides. Give L(4)."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The reflector L, left adjoint to the inclusion of the full subcategory D, sends x to the least object of D that x divides. The objects of D are 1, 2, 6 and 12. The object 4 divides 12 and divides none of 1, 2 and 6, so the least such object of D is 12. The answer is 12."
          - problem: "Claim: for every group G, the unit of the reflection of Ab in Grp at G is an isomorphism. Step 1: Ab is a full subcategory of Grp and the abelianization functor is left adjoint to the inclusion. Step 2: by the universal property, every homomorphism from G to an abelian group A factors through the unit at G. Step 3: apply this to A the abelianization of G and to the identity homomorphism from G to A; the unit at G then has an inverse. Step 4: hence the unit at G is an isomorphism and every group is abelian. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly states the adjunction: abelianization is the left adjoint to the inclusion of the full subcategory Ab. Step 2 is the universal property of the unit, correctly stated. Step 3 is the first invalid step: the identity homomorphism from G to its abelianization exists only when G is already abelian, so the universal property cannot be applied this way and no inverse is produced. Step 4 merely draws the consequence of Step 3. The answer is Step 3."
          - problem: "Let C be the chain of four objects 1 < 2 < 3 < 4, and let D be the full subcategory on the objects 1, 2 and 4, with the reflector L left adjoint to the inclusion and sending each object to the least object of D that receives an arrow from it. The unit at an object x is the unique arrow from x to L(x). Determine for how many objects x of C the reflector fixes x, so that the unit at x is an identity arrow."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The reflector L, left adjoint to the inclusion of the full subcategory, sends each object to the least object of D above it in the chain. Computing all values: L sends 1 to 1, 2 to 2, 3 to 4 and 4 to 4. The fixed objects are 1, 2 and 4, and at each of these the unit is the identity arrow. The answer is 3."
          - problem: "Write the full proof: let D be a full subcategory of a poset C such that every object of C has a least upper bound in D, and let the reflector send each object x to that least upper bound; state which functor is the left adjoint and prove that the unit satisfies the universal property. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the adjunction): let i be the inclusion of D in C, and define the reflector L from C to D by sending each object x to the least object of D above x; L is the left adjoint. Step 2 (the unit): the unit at x is the unique arrow from x to L(x), which exists because x is at most its least upper bound. Step 3 (the universal property): an arrow from x to an object d of D is the statement that x is at most d; since L(x) is the least such object, arrows from x to d coincide with arrows from L(x) to d, so every arrow f from x to i(d) equals i(g) after the unit for a unique g from L(x) to d, unique because a poset has at most one arrow between two objects. Step 4 (conclusion): the bijection is natural since every hom set has at most one element, so L is left adjoint to i, D is reflective, and the unit is universal from each x to i."
      - id: kp2
        name: The counit of a reflection is an isomorphism
        key_prerequisites: [triangle-identities]
        constraints: "Use fullness to produce the comparison map, faithfulness for one equation, and naturality plus the first triangle identity for the other."
        exemplars:
          - problem: "Let $L\\dashv i$ with $i\\colon\\mathcal{D}\\to\\mathcal{C}$ fully faithful. Prove the counit $\\varepsilon\\colon Li\\Rightarrow 1_{\\mathcal{D}}$ is a natural isomorphism."
            answer: "Take $k\\colon D\\to LiD$ with $i(k)=\\eta_{iD}$; then $\\varepsilon_D\\circ k=1_D$ and $k\\circ\\varepsilon_D=1_{LiD}$."
            solution_sketch: "Since $i$ is full and faithful, the morphism $\\eta_{iD}\\colon iD\\to iLiD$ is $i(k)$ for a unique $k\\colon D\\to LiD$. The second triangle identity $G\\varepsilon\\circ\\eta G=1_G$ for $L\\dashv i$ (so $G=i$) reads $i(\\varepsilon_D)\\circ\\eta_{iD}=1_{iD}$, i.e. $i(\\varepsilon_D\\circ k)=i(1_D)$, so faithfulness gives $\\varepsilon_D\\circ k=1_D$. For the other composite, naturality of $\\varepsilon$ at $k\\colon D\\to LiD$ gives $k\\circ\\varepsilon_D=\\varepsilon_{LiD}\\circ Li(k)$. But $Li(k)=L(\\eta_{iD})$, and the first triangle identity $\\varepsilon F\\circ F\\eta=1_F$ (so $F=L$) at the object $iD$ says $\\varepsilon_{L(iD)}\\circ L(\\eta_{iD})=1_{L iD}$. Hence $k\\circ\\varepsilon_D=1_{LiD}$, so $\\varepsilon_D$ is an isomorphism with inverse $k$; naturality is inherited from $\\varepsilon$."
          - problem: "Deduce that a reflective subcategory $\\mathcal{D}\\subseteq\\mathcal{C}$ consists, up to isomorphism, exactly of the objects $C$ for which $\\eta_C$ is an isomorphism."
            answer: "If $\\eta_C$ is iso then $C\\cong iLC$ lies in $\\mathcal{D}$; conversely $\\eta_{iD}$ is an isomorphism for every $D$ in $\\mathcal{D}$."
            solution_sketch: "If $\\eta_C\\colon C\\to iLC$ is an isomorphism, then $C$ is isomorphic to an object of the form $iLC$, hence lies in $\\mathcal{D}$ up to isomorphism (and genuinely so if $\\mathcal{D}$ is closed under isomorphism). Conversely, for $C=iD$ we showed $\\eta_{iD}=i(\\varepsilon_D)^{-1}$ is an isomorphism, using that $\\varepsilon$ is a natural isomorphism. So the reflective subcategory is characterized inside $\\mathcal{C}$ by the condition '$\\eta_C$ is invertible' — the local objects of the reflection."
      - id: kp3
        name: Examples and the induced idempotent monad
        key_prerequisites: [full-faithful-functors, commutator-subgroup]
        constraints: "Check fullness of the subcategory and the universal property of the reflector in each example."
        exemplars:
          - problem: "The abelian groups form a full subcategory of the category of groups: every homomorphism between abelian groups is a morphism there. The reflector sends a group $G$ to the abelianization $G/[G,G]$, and the universal property says every homomorphism from $G$ into an abelian group factors uniquely through the quotient map. Compute the order of the abelianization of $D_4$, the dihedral group of the symmetries of a square, which has 8 elements."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fullness check: a homomorphism between abelian groups is exactly a morphism of the subcategory, so nothing is missing. Universal property: a homomorphism from $D_4$ into an abelian group kills every commutator, so it factors uniquely through the quotient by the commutator subgroup. Commutator computation: the commutator subgroup of $D_4$ consists of the identity and the 180-degree rotation, so it has order 2, and the quotient has order $8/2 = 4$. The answer is 4."
          - problem: "Posets form a full subcategory of the category of preorders, since every monotone map between posets is a morphism of preorders. The reflector identifies mutually reachable elements, and every monotone map into a poset factors uniquely through the classes, which is the universal property. A preorder has elements $a, b, c, d$ with the relations $a \\le b$, $b \\le a$, $b \\le c$, $c \\le b$, plus reflexivity and transitivity. How many elements does the reflected poset have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fullness check: monotone maps between posets are exactly the preorder morphisms, so the subcategory is full. Reflector rule: two elements are identified when each is below the other. Class computation: the four listed relations force $a \\sim b \\sim c$, and transitivity adds $a \\le c$ with $c \\le a$, so $a, b, c$ form one class while $d$ stays alone. The quotient has 2 elements, which are incomparable. The answer is 2."
          - problem: "For the reflection of abelian groups inside groups, the unit at a group $G$ is the quotient map onto the abelianization $G/[G,G]$, and by the universal property every homomorphism from $G$ into an abelian group factors uniquely through this map. Give the order of the kernel of the unit at the symmetric group $S_3$ on three letters."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Unit rule: the component $\\eta_G$ is the canonical projection onto the abelianization, so its kernel is exactly the commutator subgroup $[G,G]$. Commutator computation: for $S_3$, the commutator subgroup is the alternating group $A_3$, formed by the identity and the two 3-cycles. Its order is 3, and no larger subgroup lies in the kernel. The answer is 3."
          - problem: "A reflection induces a monad $T$ on the big category: first apply the reflector, then include the result back. The counit of a reflection is a natural isomorphism, so the monad is idempotent, and $T$ sends an object already in the subcategory to an isomorphic copy of itself. Take the reflection of groups onto abelian groups, and let $A$ be the direct product of a cyclic group of order 4 and a cyclic group of order 5. Compute the order of $T(A)$."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Monad rule: $T$ applied to a group is its abelianization, viewed again as a group. Idempotence: the counit at an object of the subcategory is an isomorphism, so the universal property gives that $T$ fixes such an object up to isomorphism. Application: a direct product of abelian groups is abelian, so $A$ already lies in the subcategory and $T(A)$ is isomorphic to $A$, whose order is $4 \\cdot 5$. The answer is 20."
          - problem: "Claim: every homomorphism from a group $G$ into an abelian group $A$ factors uniquely through the quotient $q$ from $G$ onto its abelianization. Step 1: the image of a commutator $xyx^{-1}y^{-1}$ is the identity of $A$, because $A$ is abelian. Step 2: hence the commutator subgroup of $G$ lies in the kernel of the homomorphism. Step 3: hence the homomorphism equals $q$ composed after a map $h$ from $A$ into the abelianization, for a unique $h$. Step 4: this gives the unique factorization required by the universal property. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: in an abelian target the images commute, so a commutator maps to the identity. Step 2 is valid: the kernel contains every commutator, hence the subgroup they generate. Step 3 is not valid: the factorization map $h$ must run from the abelianization into $A$, with the original homomorphism equal to $h$ after $q$; the stated direction from $A$ into the abelianization cannot reconstruct the homomorphism. Step 4 merely repeats the broken factorization of Step 3. The answer is Step 3."
          - problem: "For the reflection of preorders onto posets, the universal property says every monotone map into a poset factors uniquely through the quotient of mutually reachable elements. In the proof, take a preorder $P$ with elements $x$ and $y$ such that $x \\le y$ and $y \\le x$, and take a monotone map $f$ from $P$ to a poset $Q$. Select the line that the proof derives about the two image values under this map."
            answer: "f(x) = f(y)"
            answer_contract: {"kind": "label", "options": [["f(x) = f(y)"], ["f(x) < f(y)"], ["f(x) > f(y)"], ["x = y in P"]]}
            solution_sketch: "Monotonicity gives both inequalities $f(x) \\le f(y)$ and $f(y) \\le f(x)$ in the poset $Q$. Antisymmetry rule: a poset forces the two values to coincide, and that equality is exactly what lets the map descend to the classes, giving the unique factorization. The option $f(x) < f(y)$ wrongly claims a strict order where equality is forced; $f(x) > f(y)$ is the same error in the other direction; $x = y in P$ confuses equivalence in the preorder with equality of elements. The answer is f(x) = f(y)."
          - problem: "Write the full proof: posets form a reflective subcategory of preorders, and the reflection induces an idempotent monad. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, fullness: a monotone map between posets is exactly a morphism of preorders, so the posets form a full subcategory. Step 2, the reflector: for a preorder $P$, declare $x$ equivalent to $y$ when $x \\le y$ and $y \\le x$; the classes form a poset $P/\\sim$ with $[x] \\le [y]$ iff $x \\le y$, which is well defined and antisymmetric. Step 3, universal property: a monotone $f$ from $P$ to a poset $Q$ sends equivalent elements to equal values, since $f(x) \\le f(y) \\le f(x)$ and antisymmetry force equality, so $f$ equals $h$ after the quotient map $q$ for a unique monotone $h$, naturally in $Q$. Step 4, adjunction: the natural bijection makes the class construction a left adjoint to the inclusion, with unit $q$. Step 5, idempotent monad: the induced monad $T$ is the class construction followed by inclusion, and its multiplication is the counit under inclusion; the counit at each poset is an isomorphism because a poset is its own reflection, so the multiplication is invertible, $T^2 \\cong T$, and the monad is idempotent."
    diagnostic_exemplar:
      problem: "Show that $\\mathbf{Ab}$ is a reflective subcategory of $\\mathbf{Grp}$, identifying the reflector and its unit."
      answer: "$\\mathbf{Ab}$ is full in $\\mathbf{Grp}$: every homomorphism between abelian groups is kept. The reflector is abelianization $G\\mapsto G^{\\mathrm{ab}}=G/[G,G]$: for abelian $A$, any homomorphism $f\\colon G\\to A$ kills commutators ($f(xyx^{-1}y^{-1})=f(x)f(y)f(x)^{-1}f(y)^{-1}=e$ since $A$ is abelian), so $f$ factors uniquely through the quotient map $\\eta_G\\colon G\\to G^{\\mathrm{ab}}$. This gives a natural bijection $\\mathrm{Hom}_{\\mathbf{Ab}}(G^{\\mathrm{ab}},A)\\cong\\mathrm{Hom}_{\\mathbf{Grp}}(G,A)$, i.e. abelianization is left adjoint to the inclusion, with unit $\\eta_G$."
      solution_sketch: "The reflector must kill exactly what obstructs a map into an abelian group, namely the commutators. Show any $f\\colon G\\to A$ with $A$ abelian vanishes on commutators, hence factors uniquely through $G/[G,G]$; that unique factorization is the adjunction bijection, with the quotient map as unit."
    anki_seeds:
      - front: "A reflective subcategory is..."
        back: "a full subcategory whose inclusion has a left adjoint (the reflector)."
        type: basic
      - front: "For an adjunction $L\\dashv i$ with $i$ fully faithful, the counit $\\varepsilon$ is..."
        back: "a natural isomorphism."
        type: basic
      - front: "The reflector of $\\mathbf{Ab}\\subseteq\\mathbf{Grp}$ is {{c1::abelianization $G\\mapsto G/[G,G]$}}."
        back: "abelianization $G\\mapsto G/[G,G]$"
        type: cloze

  - id: adjoints-preserve-limits
    name: Adjoints Preserve (Co)Limits
    core: false                # stated theorem (RAPL); terminal
    difficulty: 0.82
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: limits-colimits
        weight: 0.5
        key: true
      - id: preservation-reflection-of-limits
        weight: 0.4
        key: true
      - id: unit-counit
        weight: 0.2
      - id: hom-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Hom-functors preserve limits
        key_prerequisites: [limits-colimits]
        constraints: "Hom-functors only: $\\mathrm{Hom}(A,-)$ covariant and $\\mathrm{Hom}(-,A)$ contravariant. State RAPL before applying it, and treat the contravariant case as the covariant one on $\\mathcal C^{op}$; concrete instances limited to binary (co)products, written as a hom-set isomorphism."
        exemplars:
          - problem: "RAPL is the slogan that this topic states once and then applies to hom-functors: it records what the two functors of an adjunction do to universal constructions. Select the statement of RAPL."
            answer: "Right adjoints preserve limits; left adjoints preserve colimits"
            answer_contract: {"kind": "label", "options": [["Right adjoints preserve limits; left adjoints preserve colimits"], ["Right adjoints preserve colimits; left adjoints preserve limits"], ["Both kinds of adjoint preserve both limits and colimits"], ["Adjoints preserve limits only in complete categories"]]}
            solution_sketch: "RAPL states that a right adjoint preserves every limit that exists in its domain, and dually a left adjoint preserves every colimit. The option that swaps the two words assigns each universal construction to the wrong adjoint. The option claiming both adjoints preserve both is too strong: a left adjoint need not preserve limits. The option about complete categories adds a false hypothesis, since RAPL holds for each limit that exists with no completeness required. The answer is Right adjoints preserve limits; left adjoints preserve colimits."
          - problem: "Work in the category of sets. Let $X$ be a set with 3 elements, $Y$ a set with 2 elements, and $A$ a set with 4 elements. The contravariant hom-functor $\\mathrm{Hom}(-,A)$ carries the coproduct $X + Y$ (the disjoint union) to a product of hom-sets, because a map from $X + Y$ to $A$ is a pair of maps. How many maps are there from $X + Y$ to $A$?"
            answer: "1024"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Hom-set isomorphism for a binary coproduct, with the contravariant hom-functor treated as the covariant one on the opposite category: $\\mathrm{Hom}(X + Y, A)$ is isomorphic to $\\mathrm{Hom}(X,A) \\times \\mathrm{Hom}(Y,A)$, since a map out of a disjoint union is a pair of maps. Count the maps: $\\mathrm{Hom}(X,A)$ has $4^3 = 64$ elements and $\\mathrm{Hom}(Y,A)$ has $4^2 = 16$ elements. Multiply along the product of sets: 64 times 16 equals 1024. The answer is 1024."
          - problem: "Work in the category of sets. Let $A$ be a set with 4 elements, $X$ a set with 2 elements, and $Y$ a set with 3 elements. The covariant hom-functor $\\mathrm{Hom}(A,-)$ preserves the binary product: a map from $A$ to $X \\times Y$ is the same as a pair of maps, one from $A$ to $X$ and one from $A$ to $Y$. How many maps are there from $A$ to $X \\times Y$?"
            answer: "1296"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Hom-set isomorphism for a binary product, the covariant hom-functor preserving limits: $\\mathrm{Hom}(A, X \\times Y)$ is isomorphic to $\\mathrm{Hom}(A,X) \\times \\mathrm{Hom}(A,Y)$, since a map into a product is a pair of maps. Count the maps: $\\mathrm{Hom}(A,X)$ has $2^4 = 16$ elements and $\\mathrm{Hom}(A,Y)$ has $3^4 = 81$ elements. Multiply along the product of sets: 16 times 81 equals 1296. The answer is 1296."
          - problem: "Work in the category of sets. The set $A$ has 2 elements and the set $X$ has 3 elements, while $Y$ is a finite set of unknown size. There are exactly 225 maps from $A$ to the product $X \\times Y$. Using the isomorphism $\\mathrm{Hom}(A, X \\times Y) \\cong \\mathrm{Hom}(A,X) \\times \\mathrm{Hom}(A,Y)$, determine the number of elements of $Y$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the hom-set isomorphism for binary products, the number of maps from $A$ to $X \\times Y$ equals the number of maps from $A$ to $X$ times the number of maps from $A$ to $Y$. The first factor is $3^2 = 9$. Write $n$ for the size of $Y$: the second factor is $n^2$, so 9 times $n^2$ equals 225, hence $n^2 = 25$ and $n = 5$. The answer is 5."
          - problem: "Claim: in a category $\\mathcal C$ with binary coproducts, the contravariant hom-functor sends the coproduct $X + Y$ to a product of sets. Step 1: a coproduct $X + Y$ in $\\mathcal C$ is a product $X \\times Y$ in $\\mathcal C^{op}$. Step 2: $\\mathrm{Hom}(-,A)$ on $\\mathcal C$ is the covariant hom-functor $\\mathrm{Hom}(A,-)$ on $\\mathcal C^{op}$. Step 3: by RAPL the covariant hom-functor preserves products, so $\\mathrm{Hom}(A, X \\times Y) \\cong \\mathrm{Hom}(A,X) \\times \\mathrm{Hom}(A,Y)$ holds in $\\mathcal C^{op}$. Step 4: translating back to $\\mathcal C$, $\\mathrm{Hom}(X + Y, A) \\cong \\mathrm{Hom}(X,A) + \\mathrm{Hom}(Y,A)$ in sets. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: a coproduct in a category is exactly a product in the opposite category. Step 2 is valid: by definition the contravariant hom-functor on $\\mathcal C$ is the covariant hom-functor on $\\mathcal C^{op}$. Step 3 is valid: RAPL says right adjoints preserve limits, and the covariant hom-functor preserves products. Step 4 is the first invalid step: a map out of a coproduct is a pair of maps, so translating back gives the product of sets $\\mathrm{Hom}(X,A) \\times \\mathrm{Hom}(Y,A)$, not a coproduct of sets. The answer is Step 4."
          - problem: "Let $\\mathcal C$ be a category with binary coproducts, and let $X$, $Y$, $A$ be objects of $\\mathcal C$. On $\\mathcal C^{op}$ the contravariant hom-functor $\\mathrm{Hom}(-,A)$ is the covariant one, which preserves products, so the coproduct $X + Y$ of $\\mathcal C$ is sent to a product of hom-sets. Select the right-hand side of the hom-set isomorphism for $\\mathrm{Hom}(X + Y, A)$."
            answer: "Hom(X,A) x Hom(Y,A)"
            answer_contract: {"kind": "label", "options": [["Hom(X,A) x Hom(Y,A)"], ["Hom(X,A) + Hom(Y,A)"], ["Hom(A,X) x Hom(A,Y)"], ["Hom(X,A) x Hom(A,Y)"]]}
            solution_sketch: "A map from the coproduct $X + Y$ to $A$ is uniquely a pair of maps, one from $X$ to $A$ and one from $Y$ to $A$, which is the contravariant hom-functor carrying a binary coproduct to a binary product of sets. The option Hom(X,A) + Hom(Y,A) wrongly writes the coproduct of sets instead of the product. The option Hom(A,X) x Hom(A,Y) uses the covariant hom-functor on the wrong side of each object. The option Hom(X,A) x Hom(A,Y) keeps a second factor pointing the wrong way. The answer is Hom(X,A) x Hom(Y,A)."
          - problem: "Write the full proof: the covariant hom-functor $\\mathrm{Hom}(A,-)$ preserves every limit that exists (state RAPL first), and the contravariant hom-functor $\\mathrm{Hom}(-,A)$ carries colimits to limits, by treating it as the covariant hom-functor on $\\mathcal C^{op}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (RAPL, stated first): a right adjoint preserves every limit that exists in its domain, and dually a left adjoint preserves every colimit. Step 2 (covariant hom-functor): a cone over a diagram $D$ with apex $A$ is exactly a compatible family of maps $A \\to Dj$, and the limit cone $L$ is universal, so maps $A \\to L$ correspond bijectively to such families; this natural bijection is the isomorphism $\\mathrm{Hom}(A, \\lim D) \\cong \\lim \\mathrm{Hom}(A, D)$, so $\\mathrm{Hom}(A,-)$ preserves limits. Equivalently, when the copowers of $A$ exist, $\\mathrm{Hom}(A,-)$ is a right adjoint and RAPL gives the same conclusion. Step 3 (contravariant case): $\\mathrm{Hom}(-,A)$ on $\\mathcal C$ is the covariant hom-functor $\\mathrm{Hom}(A,-)$ on $\\mathcal C^{op}$, which preserves limits by Step 2; since a colimit in $\\mathcal C$ is a limit in $\\mathcal C^{op}$, $\\mathrm{Hom}(\\mathrm{colim} D, A) \\cong \\lim \\mathrm{Hom}(D, A)$, so colimits are carried to limits. Step 4 (binary instances): $\\mathrm{Hom}(A, X \\times Y) \\cong \\mathrm{Hom}(A,X) \\times \\mathrm{Hom}(A,Y)$ and $\\mathrm{Hom}(X + Y, A) \\cong \\mathrm{Hom}(X,A) \\times \\mathrm{Hom}(Y,A)$."
      - id: kp2
        name: The proof via the adjunction isomorphism
        key_prerequisites: [adjunctions]
        constraints: "The proof must run through the adjunction bijection $\\mathrm{Hom}(FC,-)\\cong\\mathrm{Hom}(C,G-)$ and then Yoneda, never through elements; applications limited to forgetful functors out of $\\mathbf{Grp}$, and any failure of colimit preservation must name the colimit involved."
        exemplars:
          - problem: "View the chains P: 1 < 2 < 3 and Q: 1 < 2 < 3 as categories, where a morphism from x to y exists exactly when x is at most y. Define F from P to Q by F(1) = 1, F(2) = 1, F(3) = 2, and G from Q to P by G(1) = 2, G(2) = 3, G(3) = 3. Then F is left adjoint to G, so the adjunction bijection says: a morphism from F(x) to y exists exactly when a morphism from x to G(y) exists. How many of the nine pairs (x, y) give a nonempty set of morphisms from F(x) to y?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The adjunction bijection matches, one to one, the pairs with a morphism from F(x) to y and the pairs with a morphism from x to G(y). Count on the G side using the order: for y = 1, G(1) = 2, so x = 1 and x = 2 work, giving 2 pairs; for y = 2, G(2) = 3, so all three values of x work; for y = 3, G(3) = 3, so all three values of x work again. The bijection keeps the totals equal, so the count is 2 + 3 + 3. The answer is 8."
          - problem: "The forgetful functor U from Grp to Set has the free-group functor as a left adjoint, so U is a right adjoint, and the proof through the adjunction bijection shows that U preserves every limit. A group G has 4 elements and a group H has 6 elements. How many elements does the underlying set of the product of G and H have?"
            answer: "24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Products are limits, and U, being a right adjoint, preserves this product by the adjunction-bijection argument. So the underlying set of the product group is the product of the underlying sets of G and H. The size of a product of finite sets multiplies the two sizes. Compute 4 times 6. The answer is 24."
          - problem: "Let f be the identity map on the group Z/4 of residues modulo 4, and let g be the map g(x) = -x on the same group; both are homomorphisms. The forgetful functor U from Grp to Set is a right adjoint, so it preserves equalizers, which are limits. How many elements does the underlying set of the equalizer of f and g have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Equalizers are limits, and U, being a right adjoint, preserves them: the underlying set of the equalizer group equals the equalizer of the two underlying set maps. Solve x = -x modulo 4, that is 2x = 0 modulo 4, on the set of residues. Only x = 0 and x = 2 satisfy it. The answer is 2."
          - problem: "The coproduct in Grp of a group G with 2 elements and a group H with 3 elements is their free product G * H, whose underlying set is infinite. The forgetful functor U from Grp to Set is a right adjoint: the proof through the adjunction bijection yields preservation of limits, and colimits are not covered. Determine whether U sends this coproduct to a coproduct in Set, and give the number of elements of the disjoint union of the underlying sets of G and H."
            answer: "verdict = fails; count = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["fails"], ["succeeds"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Right adjoints preserve limits, and the adjunction-bijection proof gives nothing for colimits, so U need not send this coproduct, the free product, to a coproduct of sets. The underlying set of the free product G * H is infinite, since it holds all reduced words, while the disjoint union of the underlying sets has 2 + 3 = 5 elements, which is far too small. So the verdict is fails and the count is 5. The answer is verdict = fails; count = 5."
          - problem: "Claim: the forgetful functor U from Grp to Set sends coproducts to coproducts. Step 1: the free-group functor is left adjoint to U. Step 2: hence U is a right adjoint. Step 3: a right adjoint preserves all limits, by the adjunction bijection and Yoneda, and by duality a right adjoint also preserves all colimits. Step 4: coproducts, such as the free product of two groups, are colimits. Step 5: therefore the underlying set of a free product G * H is the disjoint union of the underlying sets of G and H. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: the free-group functor is left adjoint to the forgetful functor. Step 2 is valid: U is the right adjoint of that pair. Step 3 is not valid: duality reverses the roles, so the dual statement is about the left adjoint, and nothing in the proof makes a right adjoint preserve colimits; indeed the free product of two nontrivial groups has an infinite underlying set. Step 4 is valid: a coproduct is a colimit. Step 5 is a valid deduction from Steps 3 and 4, so the first failure comes earlier. The answer is Step 3."
          - problem: "In the proof that a right adjoint G preserves limits, fix an object C and a diagram D, write lim D for a limit of D, and let F be left adjoint to G. The chain of bijections has five links: Hom(C, G lim D), then Hom(FC, lim D), then the limit over j of Hom(FC, Dj), then the missing link, then Hom(C, the limit over j of GDj). Select the line that fills the missing link."
            answer: "the limit over j of Hom(C, GDj)"
            answer_contract: {"kind": "label", "options": [["the limit over j of Hom(C, GDj)"], ["the limit over j of Hom(GDj, C)"], ["the limit over j of Hom(FC, GDj)"], ["Hom(FC, the limit over j of GDj)"]]}
            solution_sketch: "The full chain is Hom(C, G lim D) to Hom(FC, lim D) to the limit over j of Hom(FC, Dj) to the limit over j of Hom(C, GDj) to Hom(C, the limit over j of GDj). The first link is the adjunction bijection, the second holds because maps from a fixed object preserve limits, the missing link applies the adjunction bijection at each object Dj, and the last holds because limits of sets commute with maps from a fixed object. The option with Hom(GDj, C) reverses the direction of the maps. The option with Hom(FC, GDj) applies G on the wrong side of the bijection. The option Hom(FC, the limit over j of GDj) skips the levelwise use of the adjunction. The answer is the limit over j of Hom(C, GDj)."
          - problem: "Write the full proof: if F is left adjoint to G, then G carries every limit that exists to a limit, by running the argument through the adjunction bijection Hom(FC, -) = Hom(C, G -) and the Yoneda lemma. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Let D be a diagram in the category where G is defined, with limit lim D and its limit cone. Step 2: For each object C, the adjunction bijection identifies the set of maps from C to G of lim D with the set of maps from FC to lim D. Step 3: The set-valued functor of maps from the fixed object FC preserves limits, so maps from FC to lim D correspond to the limit over j of the sets of maps from FC to Dj. Step 4: Apply the adjunction bijection at each object Dj: the limit over j of maps from FC to Dj corresponds to the limit over j of maps from C to G of Dj. Step 5: Limits of sets commute with maps from a fixed object C, so this corresponds to the set of maps from C to the limit over j of G of Dj. Step 6: The composite bijection is natural in C, so the Yoneda lemma makes the canonical comparison map from G of lim D to the limit over j of G of Dj an isomorphism. Conclusion: G preserves every limit that exists."
      - id: kp3
        name: Left adjoints preserve colimits
        key_prerequisites: [limits-colimits]
        constraints: "Obtain the dual statement by applying RAPL in the opposite categories rather than reproving it; instantiations limited to the free-monoid and free-vector-space functors, always naming the preserved colimit (initial object or binary coproduct)."
        exemplars:
          - problem: "The free monoid functor M from Set to Mon sends a set S to the monoid of all words in the letters of S, and it is left adjoint to the forgetful functor, so it preserves binary coproducts. Let X be a set of 2 letters and Y a set of 3 letters; a binary coproduct of sets is a disjoint union. How many letters generate the coproduct of the monoids M(X) and M(Y) in Mon?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a left adjoint preserves colimits, in particular binary coproducts. The coproduct of the monoids M(X) and M(Y) in Mon is therefore M of the disjoint union of X and Y, a free monoid on 2 + 3 letters. The answer is 5."
          - problem: "The free vector space functor V from Set to Vect sends a set S to the vector space with basis S, and it is left adjoint to the forgetful functor, so it preserves binary coproducts. Let X be a set with 4 elements and Y a set with 5 elements; finite coproducts in Vect are direct sums. Compute the dimension of the coproduct of V(X) and V(Y) in Vect."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a left adjoint preserves colimits, in particular binary coproducts. The coproduct of V(X) and V(Y) in Vect is therefore V of the disjoint union of X and Y, a free space on 4 + 5 basis vectors, and finite coproducts in Vect are direct sums. The answer is 9."
          - problem: "The free monoid functor M from Set to Mon is left adjoint to the forgetful functor, so it preserves initial objects. The empty set is the initial object of Set, so the monoid M of the empty set is the initial object of Mon. How many elements does this monoid have?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a left adjoint preserves colimits, and the initial object is the colimit of the empty diagram. So the free monoid on the empty set is initial in Mon. The free monoid on no letters contains only the empty word. The answer is 1."
          - problem: "The free vector space functor V from Set to Vect is left adjoint to the forgetful functor, so it preserves initial objects. The empty set is the initial object of Set, so the space V of the empty set is the initial object of Vect. Compute the dimension of this space."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: a left adjoint preserves colimits, and the initial object is the colimit of the empty diagram. So the free space on the empty set is initial in Vect, which is the zero space. The zero space has an empty basis. The answer is 0."
          - problem: "Claim: a left adjoint F from a category C to a category D preserves binary coproducts, and this follows from RAPL, the theorem that a right adjoint preserves limits. Step 1: pass to the opposite categories; the same functor F, read from C opposite to D opposite, is a right adjoint. Step 2: a coproduct of two objects in C is a product of those objects in C opposite. Step 3: by RAPL, this right adjoint preserves that product. Step 4: therefore F preserves products in C, so F sends a product of two objects in C to a product in D. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: if F is left adjoint to G, then after passing to opposite categories F is right adjoint to G. Step 2 is valid: coproduct cocones in C are exactly product cones in C opposite. Step 3 is valid by RAPL, since the functor of Step 1 is a right adjoint. Step 4 is not valid: a limit in C opposite is a colimit in C, so the correct conclusion is that F preserves coproducts in C, not products; Step 4 reads the opposite category as if it were the original one. The answer is Step 4."
          - problem: "Let M be the free monoid functor from Set to Mon; it is left adjoint to the forgetful functor, so it preserves binary coproducts. In the lines below, the plus sign denotes the coproduct in whichever category is meant, and the letter x denotes the product. A short proof ends with one missing line. Select the line that correctly states the preserved binary coproduct."
            answer: "M(X+Y) = M(X)+M(Y)"
            answer_contract: {"kind": "label", "options": [["M(X+Y) = M(X)+M(Y)"], ["M(X x Y) = M(X) x M(Y)"], ["M(X x Y) = M(X)+M(Y)"], ["M(X+Y) = X+Y"]]}
            solution_sketch: "Rule: a left adjoint preserves binary coproducts. The coproduct of two sets is their disjoint union, so the free monoid functor sends it to the coproduct in Mon of the two free monoids, giving M(X+Y) = M(X)+M(Y). The option M(X x Y) = M(X) x M(Y) is the error of replacing colimits by limits, which RAPL guarantees only for right adjoints. The option M(X x Y) = M(X)+M(Y) mismatches a product on the left with a coproduct on the right. The option M(X+Y) = X+Y forgets to apply the functor and treats it as the identity. The answer is M(X+Y) = M(X)+M(Y)."
          - problem: "Write the full proof: every left adjoint preserves colimits, obtained by applying RAPL in the opposite categories rather than by reproving the theorem, and conclude that the free monoid functor preserves binary coproducts. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: let F be a left adjoint to G, with F from C to D. After passing to opposite categories, F read from C opposite to D opposite is a right adjoint, since the adjunction reverses. Step 2: a colimit of a diagram in C is a limit of the corresponding diagram in C opposite, and a colimiting cocone in C is a limiting cone in C opposite. Step 3: by RAPL, the right adjoint of Step 1 preserves this limiting cone in C opposite. Step 4: translating back along Step 2, F carries colimiting cocones in C to colimiting cocones in D, so F preserves every colimit that exists in C. Step 5: the free monoid functor M from Set to Mon is left adjoint to the forgetful functor, so by the preserved colimit just proved it preserves binary coproducts; the coproduct of two sets is their disjoint union, and M of a disjoint union is the coproduct in Mon of the two free monoids. This completes the proof; compare your write-up with the solution."
    diagnostic_exemplar:
      problem: "Prove RAPL: a right adjoint $G\\colon\\mathcal D\\to\\mathcal C$ (with $F\\dashv G$) preserves every limit that exists in $\\mathcal D$."
      answer: "Let $\\lim D$ exist for $D\\colon\\mathcal J\\to\\mathcal D$. For every $C$: $\\mathrm{Hom}(C,G\\lim D)\\cong\\mathrm{Hom}(FC,\\lim D)\\cong\\lim_j\\mathrm{Hom}(FC,Dj)\\cong\\lim_j\\mathrm{Hom}(C,GDj)$ — adjunction, then hom-functors preserve limits, then adjunction again — each step natural in $C$. The last set is exactly the set of cones from $C$ over $GD$, so $G(\\lim D)$ equipped with the legs $G\\lambda_j$ has the universal property of $\\lim(GD)$: maps into it correspond bijectively to cones. Hence the canonical comparison $G(\\lim D)\\to\\lim(GD)$ is an isomorphism and $G$ preserves the limit."
      solution_sketch: "Never touch the cones directly. Chain natural bijections $\\mathrm{Hom}(C,G\\lim D)\\cong\\mathrm{Hom}(FC,\\lim D)\\cong\\lim_j\\mathrm{Hom}(FC,Dj)\\cong\\lim_j\\mathrm{Hom}(C,GDj)$ — adjunction, hom preserves limits, adjunction again — and read the last set as the cones from $C$ over $GD$."
    anki_seeds:
      - front: "What does RAPL state about adjoints?"
        back: "Right Adjoints Preserve Limits."
        type: basic
      - front: "What does LAPC state about adjoints?"
        back: "Left Adjoints Preserve Colimits."
        type: basic
      - front: "Key step in proving $G$ preserves limits?"
        back: "Use $\\mathrm{Hom}(C,G-)\\cong\\mathrm{Hom}(FC,-)$, that hom-functors preserve limits, then Yoneda."
        type: basic
