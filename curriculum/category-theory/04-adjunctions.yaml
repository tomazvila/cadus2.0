            solution_sketch: "Case A: The poset adjunction requires f(p)<=q exactly when p<=g(q), for every pair. Thus each lower set cut out by f(p)<=q must be the principal lower set of g(q). Check all pairs to recover the right adjoint uniquely. The answer is 0, 1, 2. Case B: The poset adjunction requires f(p)<=q exactly when p<=g(q), for every pair. Thus each lower set cut out by f(p)<=q must be the principal lower set of g(q). Check all pairs to recover the right adjoint uniquely. The answer is 0, 0, 2. Case C: The poset adjunction requires f(p)<=q exactly when p<=g(q), for every pair. Thus each lower set cut out by f(p)<=q must be the principal lower set of g(q). Check all pairs to recover the right adjoint uniquely. The answer is 2, 2, 2. The combined answer is A = 0, 1, 2; B = 0, 0, 2; C = 2, 2, 2."
          - problem: "Write the full proof: for a function h from a set X to a set Y, the image map is left adjoint to the preimage map between the powersets of X and Y ordered by inclusion. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: define the maps. The image map sends a subset S of X to the set of all h(s) with s in S, and the preimage map sends a subset T of Y to the set of all x in X with h(x) in T. Both are monotone for inclusion, because a larger set has a larger image and a larger preimage. Step 2: one direction. Assume the image of S is contained in T, and take s in S. Then h(s) is in the image of S, hence in T, so s is in the preimage of T. Thus S is contained in the preimage of T. Step 3: the converse. Assume S is contained in the preimage of T, and take y in the image of S. Then y = h(s) for some s in S, and s lies in the preimage of T, so h(s) = y lies in T. Thus the image of S is contained in T. Step 4: conclusion. The two directions give the biconditional, which is exactly the hom-set bijection of an adjunction between the poset categories; each hom-set has at most one element, so naturality is automatic. Therefore the image map is left adjoint to the preimage map."
      - id: kp2
        name: Closure operators from the round trip
        key_prerequisites: [adjunctions]
        constraints: "Recover and verify the round-trip closure: monotone, inflationary, idempotent. Derive idempotence from unit/counit inequalities plus antisymmetry; construct closures or fixed objects from raw adjunction data."
        exemplars:
          - problem: "On P=0<1<2<3<4<5 and Q=0<1<2, f has values [0,0,1,1,2,2]. Recover a right adjoint g, then the entire closure operator gf. Give its values at 0,1,2,3,4,5."
            answer: "1, 1, 3, 3, 5, 5"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The adjunction determines each g(y) by its principal lower set. The unit and counit then prove that gf is a closure operator. The result is 1, 1, 3, 3, 5, 5."
          - problem: "A Galois connection f:P->Q, g:Q->P has f(p)=floor(p/2) on P=0<...<7, Q=0<1<2<3. Recover g from the hom-set condition and give the set of fixed points of the induced closure on P."
            answer: "{1, 3, 5, 7}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Reconstruct the right adjoint before taking the round trip. Closed objects are exactly those fixed by that closure. The result is {1, 3, 5, 7}."
          - problem: "On inclusion-ordered subsets of {1,2,3}, define f(S)=S intersect {2,3}. Recover its right adjoint g and the closure gf. Number subsets by binary membership, 1 for element 1,2 for element 2,4 for element 3. Give the set of codes of closed subsets."
            answer: "{1, 3, 5, 7}"
            answer_contract: {"kind": "set"}
            solution_sketch: "The right adjoint must make the adjunction inclusion equivalent for every subset. Its round trip adjoins precisely the invisible first element. The result is {1, 3, 5, 7}."
          - problem: "On P=0<1<2<3, determine all possible value lists of closure operators c for which c(0)=1 and c(3)=3. Require monotonicity, inflationarity and idempotence. List the valid values of c(2), in increasing order."
            answer: "2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A closure arising from a Galois round trip must satisfy all three conditions; idempotence forces image objects to be fixed. The result is 2, 3."
          - problem: "For f:P->Q left adjoint to g:Q->P, write c=gf. Step 1: the unit gives p<=c(p). Step 2: monotonicity gives c(p)<=c(c(p)). Step 3: the counit at f(p) gives f(g(f(p)))<=f(p). Step 4: applying f to Step 3 gives c(c(p))<=c(p). Which step is the first whose assertion or stated reason fails?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 3 is an inequality in Q, so apply g:Q->P. Together with Step 2 and antisymmetry this proves idempotence. This is the first unsupported step."
          - problem: "In the closure proof for f left adjoint to g, derive c(c(p))<=c(p) from the counit at f(p). Select the operation to apply and the resulting left side. Operation bank: 1=f; 2=g. Expression bank: 1=f(g(f(p))); 2=g(f(p)); 3=g(f(g(f(p)))). Give the operation number and expression number."
            answer: "2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The counit inequality is in Q. Apply monotonicity of g to obtain the reverse inequality needed for antisymmetry. The result is 2, 3."
          - problem: "Write the full proof: let f be left adjoint to g in a Galois connection between posets, with unit p <= gf(p) and counit fg(q) <= q, and prove that the round trip c = gf is a closure operator, that is, c is monotone, inflationary and idempotent. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full object: c = gf is the round trip on P, and a closure operator is monotone, inflationary and idempotent; we verify the three properties in that order, using only the unit, the counit and monotonicity. Step 1 (monotone): f and g are monotone, and a composite of monotone maps is monotone, so c is monotone. Step 2 (inflationary): the unit of the connection at p reads p <= gf(p) = c(p), so c is inflationary. Step 3 (idempotent): the unit at the element c(p) gives c(p) <= c(c(p)); for the reverse inequality, the counit at the element f(p) of the other poset reads fg(f(p)) <= f(p), and applying the monotone map g to both sides yields gf(gf(p)) <= gf(p), that is, c(c(p)) <= c(p); the equality c(c(p)) = c(p) is then obtained by antisymmetry from the two inequalities. Conclusion: c is monotone, inflationary and idempotent, so c is a closure operator; dually, fg is an interior operator."
    diagnostic_exemplar:
      problem: "Let $f\\dashv g$ be a monotone Galois connection between posets ($f(p)\\le q\\iff p\\le g(q)$). Prove that $c=g\\circ f$ is a closure operator: monotone, inflationary, and idempotent."
      answer: "Monotone: composite of monotone maps. Inflationary: from $f(p)\\le f(p)$ the biconditional gives $p\\le gf(p)=c(p)$ (the unit). Idempotent: $c(p)\\le c(c(p))$ by the unit; for the reverse, the counit $fg(q)\\le q$ at $q=f(p)$ gives $fgf(p)\\le f(p)$, and applying the monotone $g$ yields $c(c(p))=gfgf(p)\\le gf(p)=c(p)$. By antisymmetry $c(c(p))=c(p)$."
      solution_sketch: "Monotonicity is inherited from the two maps. Inflationary is the unit, obtained by feeding $f(p)\\le f(p)$ into the biconditional; for idempotence use the counit $fg(q)\\le q$ at $q=f(p)$, apply the monotone $g$, and close with antisymmetry."
    anki_seeds:
      - front: "A Galois connection is an adjunction between..."
        back: "posets (thin categories): monotone $f,g$ with $f(p)\\le q\\iff p\\le g(q)$."
        type: basic
      - front: "For a Galois connection $f\\dashv g$, the composite $g\\circ f$ is a {{c1::closure operator}}."
        back: "closure operator"
        type: cloze

  - id: reflective-subcategories
    name: Reflective Subcategories
    core: false                # terminal adjunction application
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
