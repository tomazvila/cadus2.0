      - id: kp1
        name: Defining unit and counit
        key_prerequisites: [adjunctions]
        constraints: "Define $\\eta,\\varepsilon$ as transposes of identities; concrete computations only for the free-monoid adjunction, evaluated on explicit letters/words."
        exemplars:
          - problem: "In the free-monoid adjunction $F \\dashv U$ with $F(X) = X^*$, the unit is the transpose of the identity: $\\eta_X = \\Phi_{X, X^*}(1_{X^*}) : X \\to U(X^*)$. Concretely, $\\Phi$ sends a homomorphism $h : X^* \\to M$ to the function $h \\circ i_X$, where $i_X : X \\to U(X^*)$ inserts each letter as its one-letter word. Take the alphabet $X = \\{c, d, e\\}$. How many letters does the word $\\eta_X(d)$ contain?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the unit is the transpose of the identity, $\\eta_X = \\Phi_{X, X^*}(1_{X^*}) : X \\to U(X^*)$. Step 1: by the stated form of $\\Phi$, $\\Phi(h) = h \\circ i_X$, so $\\eta_X = 1_{X^*} \\circ i_X = i_X$. Step 2: the insertion $i_X$ sends the letter $d$ to the one-letter word $(d)$, which is exactly $\\eta_X(d)$. That word has 1 letter; the answer is 1."
          - problem: "In the free-monoid adjunction $F \\dashv U$, the counit of a monoid $M$ is the transpose of the identity: $\\varepsilon_M = \\Phi^{-1}_{UM, M}(1_{UM}) : (UM)^* \\to M$, the unique monoid homomorphism with $\\varepsilon_M((m)) = m$ for every one-letter word $(m)$. Take $M = (\\mathbb{Z}, +)$, the integers under addition, so a word over $M$ is a finite list of integers. Give the value of $\\varepsilon_M$ on the word $(2, -5, 7)$."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the counit is the transpose of the identity, $\\varepsilon_M = \\Phi^{-1}_{UM, M}(1_{UM}) : (UM)^* \\to M$, the unique monoid homomorphism with $\\varepsilon_M((m)) = m$. Step 1: a homomorphism out of a free monoid is fixed by its values on one-letter words and preserves the operation, so it evaluates a word letter by letter in the target monoid. Step 2: $\\varepsilon_M((2, -5, 7)) = 2 + (-5) + 7 = 4$. The answer is 4."
          - problem: "In the free-monoid adjunction $F \\dashv U$, the counit $\\varepsilon_M : (UM)^* \\to M$ is the unique monoid homomorphism that sends each one-letter word $(m)$ to the element $m$ of $M$. Take $M$ to be the natural numbers under addition. Compute $\\varepsilon_M$ on the empty word."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: $\\varepsilon_M$ is the transpose of the identity $1_{UM}$, the unique monoid homomorphism $(UM)^* \\to M$ with $\\varepsilon_M((m)) = m$ on one-letter words. Step 1: a monoid homomorphism carries the identity element of the source to the identity element of the target, and the empty word is the identity of the free monoid $(UM)^*$. Step 2: the identity element of the natural numbers under addition is the number 0. The answer is 0."
          - problem: "Let $X = \\{a, b\\}$ and $M = (\\mathbb{Z}, +)$ in the free-monoid adjunction. A function $f : X \\to U(M)$ with $f(a) = 3$ and $f(b) = -2$ has the transpose $f^\\sharp = \\Phi^{-1}(f) : X^* \\to M$, the unique monoid homomorphism with $f^\\sharp((x)) = f(x)$ on every one-letter word. Give the value of $f^\\sharp$ on the word $(b, a, b)$."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the transpose $f^\\sharp = \\Phi^{-1}(f)$ is the unique monoid homomorphism $X^* \\to M$ with $f^\\sharp((x)) = f(x)$; equivalently $f^\\sharp = \\varepsilon_M \\circ F(f)$. Step 1: a homomorphism out of a free monoid evaluates a word letter by letter in the operation of $M$. Step 2: $f^\\sharp((b, a, b)) = f(b) + f(a) + f(b) = -2 + 3 - 2 = -1$. The answer is -1."
          - problem: "Let $M = (\\mathbb{Z}, +)$ and let $t : M \\to N$ be the monoid homomorphism with $t(m) = 2m$ into the monoid $N = (\\mathbb{Z}, +)$. Naturality of the counit states $t \\circ \\varepsilon_M = \\varepsilon_N \\circ (Ut)^*$, where $(Ut)^*$ applies $t$ to every letter of a word over $M$. Compute $\\varepsilon_N((Ut)^*((1, 2, 3)))$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: naturality of the counit gives $t \\circ \\varepsilon_M = \\varepsilon_N \\circ (Ut)^*$ for every monoid homomorphism $t$. Step 1: apply $t$ to each letter of the word $(1, 2, 3)$, giving the word $(2, 4, 6)$ over $N$. Step 2: the counit of $N$ sums the letters of a word, so $\\varepsilon_N((2, 4, 6)) = 2 + 4 + 6 = 12$; this also matches $t(\\varepsilon_M((1, 2, 3))) = t(6)$. The answer is 12."
          - problem: "Claim: for every alphabet $X$, the unit $\\eta_X : X \\to U(X^*)$ of the free-monoid adjunction is surjective. Step 1: $\\eta_X(x) = (x)$, the one-letter word of the letter $x$, for every $x$ in $X$. Step 2: $\\eta_X$ is a function from the set $X$ to the set of all words over $X$. Step 3: every word over $X$ is a one-letter word. Step 4: hence every word over $X$ is $\\eta_X(x)$ for some letter $x$, and $\\eta_X$ is surjective. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: the unit is the transpose of the identity, so it inserts each letter as its one-letter word. Step 2 is valid: it only records the source set and target set of $\\eta_X$. Step 3 is the first invalid step: words may be empty or have several letters; for $X = \\{a\\}$ the word $(a, a)$ is not a one-letter word. Step 4 inherits the error of Step 3, since the word $(a, a)$ is not the value of $\\eta_X$ at any letter, so surjectivity fails. The answer is Step 3."
          - problem: "Write the full proof: in the free-monoid adjunction $F \\dashv U$ with $F(X) = X^*$ and hom-set correspondence $\\Phi$, the unit $\\eta_X = \\Phi_{X, X^*}(1_{X^*})$ sends every letter $x$ to the one-letter word $(x)$, the counit $\\varepsilon_M = \\Phi^{-1}_{UM, M}(1_{UM})$ sends every word $m_1 \\cdots m_k$ of elements of $M$ to the product $m_1 \\cdots m_k$ and the empty word to the identity element, and $\\eta$ and $\\varepsilon$ are natural transformations. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (form of the correspondence): for a homomorphism $h : X^* \\to M$, the map $\\Phi_{X, M}(h) : X \\to U(M)$ is $h \\circ i_X$, where $i_X$ inserts a letter as a one-letter word; conversely $\\Phi^{-1}(f)$ is the unique monoid homomorphism $X^* \\to M$ extending $f$. Step 2 (unit): $\\eta_X = \\Phi_{X, X^*}(1_{X^*}) = 1_{X^*} \\circ i_X = i_X$, so $\\eta_X(x) = (x)$ for every letter. Step 3 (counit): $\\varepsilon_M = \\Phi^{-1}(1_{UM})$ is the unique homomorphism $(UM)^* \\to M$ with $\\varepsilon_M((m)) = m$; since it preserves the operation, $\\varepsilon_M(m_1 \\cdots m_k) = m_1 \\cdots m_k$, and it maps the empty word to the identity element of $M$. Step 4 (naturality of $\\eta$): for a function $g : X \\to Y$, both $U(g^*) \\circ \\eta_X$ and $\\eta_Y \\circ g$ send a letter $x$ to the one-letter word $(g(x))$, which is the concrete form of the naturality of $\\Phi$ in both variables. Step 5 (naturality of $\\varepsilon$): for a monoid homomorphism $t : M \\to N$, both $t \\circ \\varepsilon_M$ and $\\varepsilon_N \\circ (Ut)^*$ send the word $m_1 \\cdots m_k$ to $t(m_1) \\cdots t(m_k)$, because $t$ preserves products. Conclusion: $\\eta : 1 \\Rightarrow UF$ and $\\varepsilon : FU \\Rightarrow 1$ are natural transformations, namely the unit and counit of $F \\dashv U$."
      - id: kp2
        name: Recovering the bijection from unit and counit
        key_prerequisites: [natural-transformations]
        constraints: "Derive $\\Phi(h)=Gh\\circ\\eta$ and $\\Phi^{-1}(k)=\\varepsilon\\circ Fk$ from naturality, citing the variable used; mutual-inverse checks cite one naturality square and one triangle identity per direction."
        exemplars:
          - problem: "Express the transpose $\\Phi(h)$ and its inverse $\\Phi^{-1}(k)$ in terms of $\\eta$ and $\\varepsilon$."
            answer: "$\\Phi(h)=Gh\\circ\\eta_C$ and $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$."
            solution_sketch: "Naturality of $\\Phi$ in the second variable applied to $h\\colon FC\\to D$ gives $\\Phi(h)=\\Phi(h\\circ 1_{FC})=Gh\\circ\\Phi(1_{FC})=Gh\\circ\\eta_C$. Dually, naturality in the first variable gives $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$. So $\\eta$ and $\\varepsilon$ encode the entire adjunction bijection."
          - problem: "Verify that $\\Phi(h)=Gh\\circ\\eta_C$ and $\\Psi(k)=\\varepsilon_D\\circ Fk$ are mutually inverse, using naturality and the triangle identities."
            answer: "$\\Psi(\\Phi(h))=h$ via naturality of $\\varepsilon$ and $\\varepsilon F\\circ F\\eta=1_F$; dually $\\Phi(\\Psi(k))=k$."
            solution_sketch: "$\\Psi(\\Phi(h))=\\varepsilon_D\\circ F(Gh\\circ\\eta_C)=\\varepsilon_D\\circ FGh\\circ F\\eta_C=h\\circ\\varepsilon_{FC}\\circ F\\eta_C=h$, using naturality of $\\varepsilon$ ($\\varepsilon_D\\circ FGh=h\\circ\\varepsilon_{FC}$) and the triangle identity $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$. Dually $\\Phi(\\Psi(k))=G\\varepsilon_D\\circ GFk\\circ\\eta_C=G\\varepsilon_D\\circ\\eta_{GD}\\circ k=k$, using naturality of $\\eta$ ($GFk\\circ\\eta_C=\\eta_{GD}\\circ k$) and $G\\varepsilon_D\\circ\\eta_{GD}=1_{GD}$. Hence $\\Phi,\\Psi$ are mutually inverse."
    diagnostic_exemplar:
      problem: "For an adjunction $F\\dashv G$ with hom-set bijection $\\Phi$, unit $\\eta_C=\\Phi(1_{FC})$ and counit $\\varepsilon_D=\\Phi^{-1}(1_{GD})$, derive the formulas $\\Phi(h)=Gh\\circ\\eta_C$ and $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$ from the naturality of $\\Phi$."
      answer: "Naturality of $\\Phi$ in the second variable, applied to $h\\colon FC\\to D$, gives $\\Phi(h)=\\Phi(h\\circ 1_{FC})=Gh\\circ\\Phi(1_{FC})=Gh\\circ\\eta_C$. Dually, naturality of $\\Phi^{-1}$ in the first variable, applied to $k\\colon C\\to GD$, gives $\\Phi^{-1}(k)=\\Phi^{-1}(1_{GD}\\circ k)=\\Phi^{-1}(1_{GD})\\circ Fk=\\varepsilon_D\\circ Fk$. So the unit and counit encode the whole bijection."
      solution_sketch: "Feed an identity into naturality of $\\Phi$: write $h=h\\circ 1_{FC}$ and move $h$ out through the naturality square, leaving $Gh\\circ\\Phi(1_{FC})$. The dual move on $\\Phi^{-1}$, writing $k=1_{GD}\\circ k$, gives the counit formula."
    anki_seeds:
      - front: "Unit of $F\\dashv G$ (type and transpose)?"
        back: "$\\eta\\colon 1\\Rightarrow GF$, with $\\eta_C=\\Phi(1_{FC})$."
        type: basic
      - front: "Counit of $F\\dashv G$ (type and transpose)?"
        back: "$\\varepsilon\\colon FG\\Rightarrow 1$, with $\\varepsilon_D=\\Phi^{-1}(1_{GD})$."
        type: basic
      - front: "Adjunction transpose of $h\\colon FC\\to D$ in terms of $\\eta$?"
        back: "$\\Phi(h)=Gh\\circ\\eta_C$."
        type: basic
      - front: "Adjunction inverse-transpose of $k\\colon C\\to GD$ in terms of $\\varepsilon$?"
        back: "$\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$."
        type: basic

  - id: triangle-identities
    name: The Triangle Identities
    core: true
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: unit-counit
        weight: 0.6
        key: true
      - id: natural-transformations
        weight: 0.3
        key: true
      - id: vertical-horizontal-composition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Statement of the zig-zag identities
        key_prerequisites: [unit-counit]
        constraints: "State both identities with whiskering made explicit; concrete verifications only for the free-monoid adjunction, chased on a general element."
        exemplars:
          - problem: "State the two triangle identities for the unit $\\eta$ and counit $\\varepsilon$ of $F\\dashv G$."
            answer: "$\\varepsilon F\\circ F\\eta=1_F$ and $G\\varepsilon\\circ\\eta G=1_G$."
            solution_sketch: "The triangle (zig-zag) identities are $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$ for all $C$ (i.e. $\\varepsilon F\\circ F\\eta=1_F$) and $G\\varepsilon_D\\circ\\eta_{GD}=1_{GD}$ for all $D$ (i.e. $G\\varepsilon\\circ\\eta G=1_G$). They say $F\\xRightarrow{F\\eta}FGF\\xRightarrow{\\varepsilon F}F$ and $G\\xRightarrow{\\eta G}GFG\\xRightarrow{G\\varepsilon}G$ are identities."
          - problem: "Verify the triangle identity $G\\varepsilon\\circ\\eta G=1_G$ for the free-monoid adjunction $(-)^*\\dashv U$ (so $G=U$)."
            answer: "At a monoid $M$: insert each element as a one-letter word, then multiply out, recovering the element."
            solution_sketch: "Here $\\eta_X\\colon X\\to U(X^*)$ inserts letters and $\\varepsilon_M\\colon (UM)^*\\to M$ multiplies words out. The identity $U\\varepsilon\\circ\\eta U=1_U$ at $M$ is $U\\varepsilon_M\\circ\\eta_{UM}\\colon UM\\to UM$: $\\eta_{UM}$ sends $m$ to the one-letter word $(m)$, and $U\\varepsilon_M$ sends $(m)$ to its product $m$. The composite is $m\\mapsto(m)\\mapsto m=1_{UM}$, confirming the identity."
      - id: kp2
        name: Deriving a triangle identity from the transposes
        key_prerequisites: [unit-counit]
        constraints: "Each derivation applies $\\Phi$ or $\\Phi^{-1}$ to a defining equation of $\\eta$ or $\\varepsilon$ exactly once, then evaluates the transpose formula; no diagram chase."
        exemplars:
          - problem: "Let S = {0, 1}. For each set X let F(X) = X x S, and for each set Y let G(Y) be the set of all functions from S to Y. The transpose Phi sends a function h from F(X) to Y to the function from X to G(Y) given by Phi(h)(x)(s) = h(x, s), and its inverse sends k back by the rule Phi inverse of k at (x, s) = k(x)(s). The unit is defined by u_X = Phi of the identity function on F(X). Applying Phi inverse to this defining equation is the step that derives the first triangle identity. Take X = {4, 9} and compute Phi inverse of u_X at the point (9, 1); the result is an ordered pair. Find the sum of its two components."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the left side of the first triangle identity in element form, Phi inverse of u_X at a point of F(X). Step 1 (transpose formula): Phi inverse of k at (x, s) equals k(x)(s), so Phi inverse of u_X at (9, 1) equals u_X(9)(1). Step 2 (defining equation of the unit): u_X = Phi of the identity on F(X), so u_X(9) is the function sending s to the pair (9, s). Step 3 (evaluate): u_X(9)(1) = (9, 1), and the components 9 and 1 sum to 10. The answer is 10."
          - problem: "Let S = {0, 1}. For each set X let F(X) = X x S, and for each set Y let G(Y) be the set of all functions from S to Y. The unit u_X(x) is the function sending s to (x, s), and the counit e_Y sends (g, s) to g(s). The derivation of the second triangle identity applies Phi to the defining equation of the counit and then evaluates the formula Phi(h) = G h after u_X at h = e_D and X = G(D). Take D = {3, 5} and let f be the function from S to D with f(0) = 3 and f(1) = 5. Find the value of the composite G e_D after u at G(D), applied to f and then to 1."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the left side of the second triangle identity, G e_D after u at G(D), applied to the function f. Step 1 (defining equation of the counit): e_D = Phi inverse of 1 at G(D), so applying Phi gives Phi(e_D) = 1 at G(D). Step 2 (transpose formula): Phi(h) = G h after u_X, so Phi(e_D)(f) = G e_D applied to u at G(D) applied to f. Step 3 (evaluate): u at G(D) sends f to the function s maps to (f, s), and G e_D sends that to the function s maps to e_D(f, s) = f(s). At s = 1 this is f(1) = 5. The answer is 5."
          - problem: "Let F send a set X to the free monoid of all finite lists with entries from X, with concatenation as the monoid product, and let G send a monoid to its underlying set. The unit u_X(x) is the one-entry list (x), and it satisfies u_X = Phi of the identity function on F(X). The counit e_D takes a list of entries of a monoid D and returns their product in D, and for the free monoid the product of lists is concatenation. Take X = {1, 3} and let w be the word (3, 1). Compute the composite e at F(X) after F u_X at w, which is the left side of the first triangle identity. Find the sum of the entries of the resulting word."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the left side of the first triangle identity for the free monoid, e at F(X) after F u_X, at the word w = (3, 1). Step 1 (apply F to the unit): F u_X maps each entry x to the one-entry list (x), so F u_X(w) = ((3), (1)). Step 2 (evaluate the counit): e at F(X) takes the product in the free monoid, which is concatenation, so e at F(X) of ((3), (1)) is the word (3, 1). Step 3 (finish): the entries 3 and 1 sum to 4. The answer is 4."
          - problem: "Claim: the second triangle identity G e_D after u at G(D) = 1 at G(D) follows from the transposes. Step 1: the counit satisfies e_D = Phi inverse of 1 at G(D). Step 2: apply Phi inverse to both sides to get Phi inverse of e_D = 1 at G(D). Step 3: evaluate the left side with the formula Phi inverse of k = e_D after Fk, using k = e_D. Step 4: conclude the second triangle identity. Which step is the first one that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it states the defining equation of the counit, e_D = Phi inverse of 1 at G(D). Step 2 is the first invalid step: Phi inverse was applied, but since e_D is already Phi inverse of 1 at G(D), the derivation must apply Phi to both sides to recover Phi(e_D) = 1 at G(D). Step 3 merely states the general formula for Phi inverse, which is correct in itself, so it is not the first error. Step 4 is the intended conclusion and would follow once Step 2 is repaired. The answer is Step 2."
          - problem: "Let F send a set X to the free monoid of all finite lists with entries from X, and let G send a monoid to its underlying set. The unit u_X(x) is the one-entry list (x), and the counit e_D returns the product of the entries of a list, taken in the monoid D. Let D be the monoid of whole numbers under addition with identity 0, so the product of a list is the sum of its entries. The second triangle identity is derived by applying Phi to the defining equation of the counit, e_D = Phi inverse of 1 at G(D), and then evaluating Phi(h) = G h after u_X at h = e_D and X = G(D). Find the value of the composite G e_D after u at G(D) at the element 9."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the left side of the second triangle identity, G e_D after u at G(D), at the element 9. Step 1 (defining equation of the counit): e_D = Phi inverse of 1 at G(D), so applying Phi gives Phi(e_D) = 1 at G(D). Step 2 (transpose formula): Phi(h) = G h after u_X with h = e_D and X = G(D), so Phi(e_D) is the composite G e_D after u at G(D). Step 3 (evaluate): u at G(D) sends 9 to the one-entry list (9), and G e_D sends that list to the sum of its entries, which is 9. The answer is 9."
          - problem: "Claim: the first triangle identity e at FC after F u_C = 1 at FC follows from the transposes. Step 1: the unit satisfies u_C = Phi of 1 at FC. Step 2: apply Phi inverse to both sides to get Phi inverse of u_C = 1 at FC. Step 3: evaluate the left side with the formula Phi inverse of k = e_D after Fk, using k = u_C and D = C. Step 4: conclude the first triangle identity. Which step contains the first error?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it states the defining equation of the unit, u_C = Phi of 1 at FC. Step 2 is valid: applying Phi inverse to both sides gives Phi inverse of u_C = 1 at FC, because Phi inverse undoes Phi. Step 3 is the first invalid step: in the formula Phi inverse of k = e_D after Fk, the object D must match the target of k, and u_C targets G(FC), so D must be FC, not C; with D = FC the formula yields e at FC after F u_C. Step 4 is the intended conclusion and follows once Step 3 is repaired. The answer is Step 3."
          - problem: "Write the full proof: using e_D = Phi inverse of 1 at G(D) and the formula Phi(h) = G h after u_C, derive the second triangle identity G e_D after u at G(D) = 1 at G(D). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (defining equation of the counit): the hypothesis gives e_D = Phi inverse of 1 at G(D), where 1 at G(D) is the identity arrow on G(D). Step 2 (apply the transpose once): applying Phi to both sides of that equation yields Phi(e_D) = 1 at G(D), since Phi undoes Phi inverse. Step 3 (evaluate the transpose formula): the transpose sends h from F(C) to D to G h after u_C; here h = e_D has domain F(G(D)), so C = G(D), and Phi(e_D) = G e_D after u at G(D). Step 4 (conclude): combining the two lines gives G e_D after u at G(D) = 1 at G(D), the second triangle identity. No diagram is chased: one application of Phi and one evaluation of the transpose formula suffice."
      - id: kp3
        name: Triangle identities as an equivalent definition
        key_prerequisites: [natural-transformations]
        constraints: "Equivalence arguments compare $(F,G,\\eta,\\varepsilon)$ data with the hom-set definition; the 2-categorical reading may use only 1-cells, 2-cells, whiskering, and the two equations."
        exemplars:
          - problem: "State why $(F,G,\\eta,\\varepsilon)$ satisfying the triangle identities is the same data as an adjunction."
            answer: "$\\Phi(h)=Gh\\circ\\eta$ and $\\Psi(k)=\\varepsilon\\circ Fk$ are mutually inverse exactly when the triangles hold."
            solution_sketch: "Given natural $\\eta\\colon 1\\Rightarrow GF$, $\\varepsilon\\colon FG\\Rightarrow 1$, define $\\Phi(h)=Gh\\circ\\eta_C$ and $\\Psi(k)=\\varepsilon_D\\circ Fk$. Computing $\\Psi\\Phi$ and $\\Phi\\Psi$ and simplifying with naturality shows they are mutually inverse precisely when $\\varepsilon F\\circ F\\eta=1_F$ and $G\\varepsilon\\circ\\eta G=1_G$. So the unit-counit-with-triangles data is equivalent to the hom-set adjunction."
          - problem: "Explain how the triangle-identity definition lets 'adjunction' be defined internally in any $2$-category."
            answer: "It uses only $1$-cells, $2$-cells, whiskering, and the triangle equations — no hom-sets or elements."
            solution_sketch: "The unit-counit definition mentions only the objects $\\mathcal C,\\mathcal D$, the functors $F,G$, the natural transformations $\\eta\\colon 1\\Rightarrow GF$ and $\\varepsilon\\colon FG\\Rightarrow 1$, their whiskerings, and the equations $\\varepsilon F\\circ F\\eta=1_F$, $G\\varepsilon\\circ\\eta G=1_G$ — all expressible with $1$-cells, $2$-cells and horizontal/vertical composition. Hence in any $2$-category an adjunction $f\\dashv g$ is $\\eta\\colon 1\\Rightarrow gf$, $\\varepsilon\\colon fg\\Rightarrow 1$ satisfying $\\varepsilon f\\circ f\\eta=1_f$ and $g\\varepsilon\\circ\\eta g=1_g$. In $\\mathbf{Cat}$ this recovers ordinary adjunctions."
    diagnostic_exemplar:
      problem: "Using $\\eta_C=\\Phi(1_{FC})$ and $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$, prove the first triangle identity $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$."
      answer: "Apply $\\Phi^{-1}$ to both sides of $\\eta_C=\\Phi(1_{FC})$: $\\Phi^{-1}(\\eta_C)=1_{FC}$. Now evaluate $\\Phi^{-1}$ on $k=\\eta_C\\colon C\\to GFC$ (so $D=FC$) with the formula: $\\Phi^{-1}(\\eta_C)=\\varepsilon_{FC}\\circ F\\eta_C$. Equating the two expressions gives $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$, which holding for all $C$ is $\\varepsilon F\\circ F\\eta=1_F$."
      solution_sketch: "Apply $\\Phi^{-1}$ to the definition $\\eta_C=\\Phi(1_{FC})$ to get $\\Phi^{-1}(\\eta_C)=1_{FC}$, then evaluate that same $\\Phi^{-1}(\\eta_C)$ using the formula $\\varepsilon\\circ F(-)$. Equating the two readings of one value is the identity."
    anki_seeds:
      - front: "First triangle (zig-zag) identity, involving $F\\eta$?"
        back: "$\\varepsilon F\\circ F\\eta=1_F$."
        type: basic
      - front: "Second triangle (zig-zag) identity, involving $\\eta G$?"
        back: "$G\\varepsilon\\circ\\eta G=1_G$."
        type: basic
      - front: "An adjunction can be defined as functors $F,G$ plus $\\eta,\\varepsilon$ satisfying the {{c1::triangle identities}}."
        back: "triangle identities"
        type: cloze

