    knowledge_points:
      - id: kp1
        name: Hom-functors preserve limits
        key_prerequisites: [limits-colimits]
        constraints: "Construct the comparison bijection and inverse for representable preservation of products, including the opposite-category coproduct form. Abstract finite hom-set counts must require the unsupplied universal-property bijection."
        exemplars:
          - problem: "C has products, and p:X x Y->X,q:X x Y->Y are the projections. Construct the natural comparison Hom(A,X x Y)->Hom(A,X) x Hom(A,Y) on h:A->X x Y. Bank: 1=p after h; 2=h after p; 3=q after h; 4=h after q. Give the two components in X,Y order."
            answer: "1, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Postcomposition with each product projection constructs the comparison. The universal property gives its inverse by pairing. The result is 1, 3."
          - problem: "To prove that Hom(-,A) carries a coproduct X+Y to a product of sets, pass to C opposite and apply the covariant representable argument there. Choose (a) the representable in C opposite, (b) the limit object there corresponding to X+Y, and (c) the resulting target in Set. Expression bank: 1=Hom_Cop(A,-); 2=Hom_Cop(-,A); 3=product of X,Y in Cop; 4=coproduct of X,Y in Cop; 5=Hom_C(X,A) x Hom_C(Y,A); 6=Hom_C(X,A)+Hom_C(Y,A). Give the requested expression numbers in order."
            answer: "1, 3, 5"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Opposing the source swaps Hom arguments and turns the coproduct into a product. The target remains Set, so representable preservation produces a product of sets. The result is 1, 3, 5."
          - problem: "In C, P is a product of X,Y,Z and the finite hom-sets Hom(A,X),Hom(A,Y),Hom(A,Z) have sizes r,s,t. Recover the comparison bijection and give |Hom(A,P)| as an expression in r,s,t."
            answer: "r*s*t"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Postcomposition with the three projections is a bijection onto the product of hom-sets; the inverse is the unique cone mediator. Hence the required expression is r*s*t."
          - problem: "C has product P of X,Y. Maps f:A->X and g:A->Y correspond to a unique h:A->P under the representable comparison. In Set take A={0,1},X={0,1},Y={0,1,2}, f=[1,0],g=[2,1]. P is numbered lexicographically from 0. Construct the inverse comparison and give the P-point numbers h(0),h(1)."
            answer: "5, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The inverse comparison constructs a map into the product with the specified two projection composites. The result is 5, 1."
          - problem: "Step 1: a coproduct X+Y in C is a product in C opposite. Step 2: Hom_C(-,A) is the covariant representable Hom_Cop(A,-). Step 3: applying its product comparison gives a product of hom-sets in Set. Step 4: translating back turns this Set product into a Set coproduct. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Opposing the source category reverses its arrows; the target category remains Set. The comparison target remains a product. This is the first unsupported step."
          - problem: "For a coproduct X+Y in C with injections i,j, reconstruct Hom(X+Y,A)->Hom(X,A) x Hom(Y,A). Bank: 1=h after i; 2=i after h; 3=j after h; 4=h after j, where h:X+Y->A. Give the two component numbers in X,Y order."
            answer: "1, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The contravariant representable acts by precomposition with the coproduct injections. Its inverse is copairing. The result is 1, 4."
          - problem: "Write the full proof: the covariant hom-functor $\\mathrm{Hom}(A,-)$ preserves every limit that exists (state RAPL first), and the contravariant hom-functor $\\mathrm{Hom}(-,A)$ carries colimits to limits, by treating it as the covariant hom-functor on $\\mathcal C^{op}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (RAPL, stated first): a right adjoint preserves every limit that exists in its domain, and dually a left adjoint preserves every colimit. Step 2 (covariant hom-functor): a cone over a diagram $D$ with apex $A$ is exactly a compatible family of maps $A \\to Dj$, and the limit cone $L$ is universal, so maps $A \\to L$ correspond bijectively to such families; this natural bijection is the isomorphism $\\mathrm{Hom}(A, \\lim D) \\cong \\lim \\mathrm{Hom}(A, D)$, so $\\mathrm{Hom}(A,-)$ preserves limits. Equivalently, when the copowers of $A$ exist, $\\mathrm{Hom}(A,-)$ is a right adjoint and RAPL gives the same conclusion. Step 3 (contravariant case): $\\mathrm{Hom}(-,A)$ on $\\mathcal C$ is the covariant hom-functor $\\mathrm{Hom}(A,-)$ on $\\mathcal C^{op}$, which preserves limits by Step 2; since a colimit in $\\mathcal C$ is a limit in $\\mathcal C^{op}$, $\\mathrm{Hom}(\\mathrm{colim} D, A) \\cong \\lim \\mathrm{Hom}(D, A)$, so colimits are carried to limits. Step 4 (binary instances): $\\mathrm{Hom}(A, X \\times Y) \\cong \\mathrm{Hom}(A,X) \\times \\mathrm{Hom}(A,Y)$ and $\\mathrm{Hom}(X + Y, A) \\cong \\mathrm{Hom}(X,A) \\times \\mathrm{Hom}(Y,A)$."
      - id: kp2
        name: The proof via the adjunction isomorphism
        key_prerequisites: [adjunctions]
        constraints: "Reconstruct the natural hom-set chain proving right-adjoint preservation, ending with Yoneda. Test preservation through universal properties; use the forgetful functor from groups for concrete instances and name any failed colimit."
        exemplars:
          - problem: "F:C->D is left adjoint to G. To prove that G preserves a product of A,B in D, reconstruct the hom-set chain starting at Hom_C(X,G(A x B)). Bank: 1=Hom_D(FX,A) x Hom_D(FX,B); 2=Hom_C(X,GA) x Hom_C(X,GB); 3=Hom_D(FX,A x B); 4=Hom_C(X,GA x GB). Give the bank numbers in proof order."
            answer: "3, 1, 2, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Apply the adjunction, preservation by Hom(FX,-), the adjunction in each factor, then the product universal property in C. Naturality in X enables Yoneda. The result is 3, 1, 2, 4."
          - problem: "Let U:Grp->Set have free-group left adjoint F. Groups A,B are given and Hom_Grp(FX,A),Hom_Grp(FX,B) have finite sizes m,n. Derive through the adjunction the size of Hom_Set(X,U(A x B)), as an expression in m,n."
            answer: "m*n"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The adjunction moves X to FX, the group product gives a product of hom-sets, and the adjunction transports both factors back. Hence the required expression is m*n."
          - problem: "Let F be free group and U:Grp->Set its right adjoint. Let e:E->A equalize p,q:A->B in Grp. Audit this proof that U(e) is their equalizer in Set. Step 1: Hom_Grp(FX,E) is the equalizer of postcomposition by p,q on Hom_Grp(FX,A). Step 2: naturality in the target of the adjunction bijection transports those two maps to postcomposition by U(p),U(q) on Hom_Set(X,UA). Step 3: the adjunction at E therefore identifies Hom_Set(X,UE) naturally in X with that equalizer of sets. Step 4: the resulting natural Hom bijection, with its transported cone, proves by Yoneda that U(e) has the equalizer universal property. Which step is the first whose assertion or stated reason fails?"
            answer: "All valid"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The equalizer of the two postcomposition functions is transported using naturality of the adjunction, not merely componentwise bijectivity. Naturality in the test object and compatibility with the equalizer inclusion let Yoneda recover the original cone. All four steps are justified."
          - problem: "Let F be free group and U:Grp->Set its right adjoint. A pullback P=A times_C B has maps p:A->C and q:B->C. Audit a proposed Hom proof of preservation. Step 1: the adjunction gives Hom_Set(X,UP) naturally isomorphic to Hom_Grp(FX,P). Step 2: the pullback property identifies this with the full product Hom_Grp(FX,A) times Hom_Grp(FX,B). Step 3: applying the two adjunction bijections gives the full product Hom_Set(X,UA) times Hom_Set(X,UB). Step 4: Yoneda proves UP is the pullback UA times_UC UB. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The pullback Hom set consists of pairs satisfying p after a=q after b. Adjoint transposition preserves that compatibility equation by naturality; omitting it changes the represented object to a product. This is the first unsupported step."
          - problem: "For F left adjoint to U:Grp->Set, Step 1: Hom(X,U lim D) is naturally Hom(FX,lim D). Step 2: this is the limit of Hom(FX,Dj). Step 3: by the adjunction this is the limit of Hom(X,U Dj). Step 4: the same argument with no reversal also proves U preserves colimits. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Representable Hom(FX,-) preserves limits. The initial-object counterexample prevents replacing every limit by colimit in this argument. This is the first unsupported step."
          - problem: "In the proof that G preserves a limit of D:J->E when F left adjoint to G, reconstruct the third hom-test expression after Hom_C(X,G lim D) and Hom_E(FX,lim D), then its pointwise adjoint image. Bank: 1=lim_j Hom_E(FX,Dj); 2=lim_j Hom_C(X,GDj); 3=colim_j Hom_E(FX,Dj); 4=lim_j Hom_C(GDj,X). Give the two numbers."
            answer: "1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Representable preservation gives a limit of hom-sets, and the adjunction acts pointwise while retaining the diagram variance. The result is 1, 2."
          - problem: "Write the full proof: if F is left adjoint to G, then G carries every limit that exists to a limit, by running the argument through the adjunction bijection Hom(FC, -) = Hom(C, G -) and the Yoneda lemma. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Let D be a diagram in the category where G is defined, with limit lim D and its limit cone. Step 2: For each object C, the adjunction bijection identifies the set of maps from C to G of lim D with the set of maps from FC to lim D. Step 3: The set-valued functor of maps from the fixed object FC preserves limits, so maps from FC to lim D correspond to the limit over j of the sets of maps from FC to Dj. Step 4: Apply the adjunction bijection at each object Dj: the limit over j of maps from FC to Dj corresponds to the limit over j of maps from C to G of Dj. Step 5: Limits of sets commute with maps from a fixed object C, so this corresponds to the set of maps from C to the limit over j of G of Dj. Step 6: The composite bijection is natural in C, so the Yoneda lemma makes the canonical comparison map from G of lim D to the limit over j of G of Dj an isomorphism. Conclusion: G preserves every limit that exists."
      - id: kp3
