    knowledge_points:
      - id: kp1
        name: 'Product, diagonal, coproduct adjoints'
        key_prerequisites: [products-coproducts]
        constraints: 'Derive coproduct left adjoint to diagonal and diagonal left adjoint to product from universal properties. Construct their units, evaluate transposes, and test false orientations using hom-sets, in Set, in divisibility posets and in word problems.'
        exemplars:
          - problem: 'In the divisibility category on $\{1,2,3,4,6,12\}$ there is one arrow $x\to y$ when $x$ divides $y$. The diagonal functor $\Delta$ sends $x$ to $(x,x)$ and has a right adjoint $R$. What is $R(4,6)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The adjunction says $x\to R(4,6)$ exists exactly when $x\to4$ and $x\to6$ exist, that is, when $x$ divides both $4$ and $6$. So $R(4,6)$ is the greatest common divisor in the divisibility order. The common divisors are $1$ and $2$, and the greater one is $2$.'
          - problem: 'For the diagonal functor $\Delta\colon\mathbf{Set}\to\mathbf{Set}\times\mathbf{Set}$ and its right adjoint $R$, the product, the unit at $X$ is an arrow $X\to R\Delta X$. For $X=\{1,2\}$, what does $\eta_X$ send $2$ to?'
            answer: '(2, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The unit is the transpose of the identity of $\Delta X=(X,X)$, which is the pair $(1_X,1_X)$. By the product universal property this pair corresponds to the diagonal function $x\mapsto(x,x)$. So $\eta_X(2)=(2,2)$.'
          - problem: 'In $\mathbf{Set}$, the coproduct (disjoint union) $S\colon\mathbf{Set}\times\mathbf{Set}\to\mathbf{Set}$ and the diagonal functor $\Delta$ are adjoint in one direction. Is the coproduct the left adjoint or the right adjoint of $\Delta$?'
            answer: 'left'
            answer_contract: {"kind": "label", "options": [["left", "left adjoint", "the left adjoint", "it is the left adjoint"], ["right", "right adjoint", "the right adjoint", "it is the right adjoint"]]}
            solution_sketch: 'A map $S(A,B)\to X$ out of the disjoint union is the same as a pair of maps $A\to X$ and $B\to X$, and this pair is a morphism $(A,B)\to\Delta X$. So $\mathrm{Hom}(S(A,B),X)\cong\mathrm{Hom}((A,B),\Delta X)$, and the coproduct stands on the left.'
          - problem: 'In $\mathbf{Set}$ let $A=\{1,2,3\}$ and $B=\{2,3\}$. The functions $f\colon A\to\mathbb{Z}$ with $f(n)=n^2$ and $g\colon B\to\mathbb{Z}$ with $g(n)=n+10$ form a morphism $(A,B)\to\Delta\mathbb{Z}$ in $\mathbf{Set}\times\mathbf{Set}$. Its transpose under the coproduct adjunction is a function $A+B\to\mathbb{Z}$ on the disjoint union. What does it send the element $3$ of $B$ to?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose is the copairing $[f,g]$, which applies $f$ to elements that come from $A$ and $g$ to elements that come from $B$. The element $3$ of $B$ is different from the element $3$ of $A$. So the value is $g(3)=3+10=13$.'
          - problem: 'The right adjoint $R$ of the diagonal $\Delta\colon\mathbf{Set}\to\mathbf{Set}\times\mathbf{Set}$ sends a pair $(A,B)$ of sets with $4$ and $5$ elements to a set $R(A,B)$. How many elements does $R(A,B)$ have?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The right adjoint of $\Delta$ is the product, because a pair of maps $X\to A$ and $X\to B$ is one map $X\to A\times B$. The product $A\times B$ has $4\cdot5=20$ elements, while the disjoint union is the left adjoint.'
          - problem: 'Two lights blink together at second $0$. One blinks every $10$ seconds and the other every $15$ seconds. In the divisibility category on the positive integers, the diagonal $\Delta$ has a left adjoint $L$, and the time of the next common blink is $L(10,15)$. After how many seconds do the lights next blink together?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The adjunction says $L(10,15)\to y$ exists exactly when $10$ and $15$ both divide $y$. So $L(10,15)$ is the least common multiple. The multiples of $10$ are $10,20,30$ and the multiples of $15$ are $15,30$, so the lights blink together after $30$ seconds.'
          - problem: 'A $12$ m ribbon and an $18$ m ribbon are cut into equal pieces of the greatest possible length, with no ribbon left over. In the divisibility category on the positive integers, this length is $R(12,18)$ for the right adjoint $R$ of the diagonal. How long is each piece?'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The adjunction says $x\to R(12,18)$ exists exactly when $x$ divides both $12$ and $18$. So $R(12,18)$ is the greatest common divisor. The common divisors of $12$ and $18$ are $1$, $2$, $3$ and $6$, so each piece is $6$ m long.'
          - problem: 'In the divisibility category on the positive integers there is one arrow $x\to y$ when $x$ divides $y$. The diagonal functor $\Delta$ sends $x$ to $(x,x)$, and the greatest common divisor sends a pair $(a,b)$ to $\gcd(a,b)$. Is $\gcd$ the left adjoint or the right adjoint of $\Delta$?'
            answer: 'right'
            answer_contract: {"kind": "label", "options": [["left", "left adjoint", "the left adjoint", "it is the left adjoint"], ["right", "right adjoint", "the right adjoint", "it is the right adjoint"]]}
            solution_sketch: 'A number $x$ divides both $a$ and $b$ exactly when it divides $\gcd(a,b)$. So an arrow $\Delta x\to(a,b)$ exists exactly when an arrow $x\to\gcd(a,b)$ exists. The functor $\gcd$ stands on the right of $\Delta$, so it is the right adjoint.'
          - problem: 'Write the full proof that the diagonal functor $\Delta$ from $\mathcal{C}$ to $\mathcal{C}\times\mathcal{C}$ has a right adjoint given by the product and a left adjoint given by the coproduct, by matching each (co)product universal property against the standard hom-set form of an adjunction. Then compare with the solution.'
            answer: 'Delta: coproduct left, product right'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1: recall the hom-set form, an adjunction F -| G requires natural bijections Hom(F X, Y) and Hom(X, G Y). Step 2: for the right adjoint, a map Delta X to (A, B) in C x C is by definition a pair (f : X to A, g : X to B), and the product universal property says such pairs correspond uniquely to maps X to A x B, naturally in X, A and B; hence Delta -| (x). Step 3: the unit eta_X is the transpose of the identity 1_(X,X), the diagonal <1_X, 1_X> : X to X x X, and the counit epsilon_(A,B) is the transpose of 1_(A x B), the pair of projections (pi_A, pi_B). Step 4: dually, a map (A, B) to Delta X is a pair (A to X, B to X), and the coproduct universal property turns it into one map A + B to X, naturally; hence (+) -| Delta. Step 5: since each unit and counit component is a transpose of an identity, the triangle identities hold, and together (+) -| Delta -| (x).'
      - id: kp2
        name: 'The currying adjunction'
        key_prerequisites: [products-coproducts]
        constraints: 'Construct the currying bijection, its unit and counit, the exponential universal property and the exponential-law counts through the adjunction. Do not supply the needed evaluation formula before asking for a value; word problems must ask the learner to choose which set is the base and which the exponent.'
        try_first:
          problem: 'How many functions are there from a $2$-element set to a $3$-element set?'
          answer_contract: {"kind": "exact"}
          answer: '9'
          reveal: 'Each of the $2$ inputs can go to any of the $3$ outputs, so there are $3^2=9$ functions. The set of all functions from $A$ to $B$ is the exponential object $B^A$, and it has $|B|^{|A|}$ elements.'
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $X=\{1,2\}$, $A=\{0,1\}$ and $B=\{0,1,2\}$, and let $f\colon X\times A\to B$ send $(x,y)$ to the remainder of $2x+y$ on division by $3$. Let $g\colon X\to B^A$ be the transpose of $f$ under $(-\times A)\dashv(-)^A$. What is $g(2)(1)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose of $f$ is the curried function $g(x)(y)=f(x,y)$. So $g(2)(1)=f(2,1)$. Since $2\cdot2+1=5$ and the remainder of $5$ on division by $3$ is $2$, the value is $2$.'
          - problem: 'For $(-\times A)\dashv(-)^A$ in $\mathbf{Set}$ with $A=\{0,1,2\}$ and $B=\{5,6,7\}$, let $\varepsilon_B\colon B^A\times A\to B$ be the counit. The function $h\colon A\to B$ has $h(0)=7$, $h(1)=5$ and $h(2)=6$. What is $\varepsilon_B(h,1)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counit is the transpose of the identity of $B^A$, and it is the evaluation map $\varepsilon_B(h,a)=h(a)$. So $\varepsilon_B(h,1)=h(1)=5$.'
          - problem: 'For $(-\times A)\dashv(-)^A$ in $\mathbf{Set}$ with $X=\{3,4\}$ and $A=\{0,1\}$, the unit is a function $\eta_X\colon X\to(X\times A)^A$. What is the element $\eta_X(3)(1)$ of $X\times A$?'
            answer: '(3, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The unit is the transpose of the identity of $X\times A$, so $\eta_X(x)$ is the function $a\mapsto(x,a)$. Hence $\eta_X(3)(1)=(3,1)$.'
          - problem: 'In $\mathbf{Set}$ let $A=B=\{0,1\}$. A set $E$ with four points carries an evaluation $E\times A\to B$. For each point $e$ the row is the pair $(\mathrm{ev}(e,0),\mathrm{ev}(e,1))$, and the four rows are $(1,1)$, $(0,1)$, $(0,0)$ and $(1,0)$. Is $E$ with this evaluation an exponential object $B^A$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is an exponential object", "an exponential object"], ["no", "it is not", "false", "it is not an exponential object", "not an exponential object"]]}
            solution_sketch: 'An exponential object needs every function $X\times A\to B$ to have exactly one transpose into $E$. The four rows are the four different functions $A\to B$, each appearing once. So existence and uniqueness both hold, and $E$ is an exponential object.'
          - problem: 'A teacher hands out prizes to $5$ students, and each student gets exactly one of $3$ different prizes, where one prize can go to several students. How many different ways are there to hand out the prizes?'
            answer: '243'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A way of handing out prizes is a function from the set of $5$ students to the set of $3$ prizes. There are $3$ choices for each of the $5$ students, so there are $3^5=243$ ways.'
          - problem: 'In $\mathbf{Set}$ the currying adjunction gives $C^{A\times B}\cong(C^B)^A$. If $A$ has $2$ elements, $B$ has $3$ elements and $C$ has $2$ elements, how many elements does $C^{A\times B}$ have?'
            answer: '64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $A\times B$ has $2\cdot3=6$ elements. A function $A\times B\to C$ chooses one of $2$ values for each of the $6$ elements, so there are $2^6=64$ functions.'
          - problem: 'Take the same sets $A=B=\{0,1\}$ and a five-point set $E''$ with evaluation rows $(0,0)$, $(0,1)$, $(1,0)$, $(1,1)$ and $(1,0)$. Is $E''$ with this evaluation an exponential object $B^A$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is an exponential object", "an exponential object"], ["no", "it is not", "false", "it is not an exponential object", "not an exponential object"]]}
            solution_sketch: 'The third and the fifth points of $E''$ have the same row $(1,0)$. A function from a one-point set to $B^A$ that picks the row $(1,0)$ then has two different transposes into $E''$, so uniqueness fails.'
          - problem: 'How many functions are there from a $3$-element set to a $2$-element set?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A function from a $3$-element set to a $2$-element set chooses one of $2$ values for each of the $3$ inputs. So there are $2^3=8$ functions, and $3^2=9$ counts the functions in the other direction.'
          - problem: 'A light panel has $4$ switches, and each switch is either on or off. How many different settings of the panel are there?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A setting is a function from the set of $4$ switches to the set $\{\text{on},\text{off}\}$ with $2$ elements. There are $2$ choices for each switch, so there are $2^4=16$ settings.'
          - problem: 'Write the full proof that, for a fixed object $A$ in a cartesian closed category, the currying construction gives a bijection $\mathrm{Hom}(X\times A,B)\cong\mathrm{Hom}(X,B^A)$ that is natural in $X$ and in $B$, and therefore $(-\times A)$ is left adjoint to $(-)^A$. Then compare with the solution.'
            answer: 'Currying makes (-xA) left adjoint'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Statement: for fixed A, currying gives a bijection Hom(X×A, B) ≅ Hom(X, B^A), natural in X and in B, so (-×A) ⊣ (-)^A. Step 1 (the map): send f: X×A → B to g: X → B^A with g(x)(a) = f(x,a); this is currying, and it is well defined because the exponential B^A classifies functions from A to B. Step 2 (the inverse): send g: X → B^A to the function (x,a) ↦ g(x)(a); composing the two constructions in either order gives the identity, so the map is a bijection for each X and B. Step 3 (naturality in X): for h: X'' → X, currying f∘(h×id) gives x'' ↦ (a ↦ f(h(x''),a)), which is g∘h, so the bijection commutes with precomposition. Step 4 (naturality in B): for k: B → B'', currying k∘f gives x ↦ (a ↦ k(g(x)(a))), which is postcomposition by k on B^A, so the bijection commutes with postcomposition. Step 5 (conclusion): a bijection Hom(F X, B) ≅ Hom(X, G B) natural in both arguments is exactly the definition of an adjunction, with F = (-×A) and G = (-)^A. Therefore (-×A) is left adjoint to (-)^A, with unit x ↦ (a ↦ (x,a)) and counit the evaluation map.'
      - id: kp3
        name: 'A free-forgetful example'
        key_prerequisites: [adjunctions]
        constraints: 'Establish the free-monoid/forgetful correspondence: restriction determines a generator map, and each generator map has a unique homomorphic extension. Items count homomorphisms, find the generator images that give a prescribed value on a word, and use word problems with circular tracks; candidate claims must not be endorsed or explained by the stem.'
        exemplars:
          - problem: 'The free monoid $X^*$ on a set $X$ consists of the words in the elements of $X$. How many monoid homomorphisms $\{a,b\}^*\to(\mathbb{Z}/3,+)$ are there?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The free-monoid adjunction gives a bijection between homomorphisms $\{a,b\}^*\to\mathbb{Z}/3$ and functions $\{a,b\}\to\mathbb{Z}/3$. Each of the $2$ letters has $3$ possible images, so there are $3^2=9$ homomorphisms.'
          - problem: 'Let $\{x\}^*$ be the free monoid on one letter, with words $\varepsilon,x,xx,\dots$. For which elements $a$ of $\mathbb{Z}/4$ is there a monoid homomorphism $h\colon\{x\}^*\to(\mathbb{Z}/4,+)$ with $h(x)=a$ and $h(xx)=2$?'
            answer: '1, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism is fixed by $h(x)=a$, and then $h(xx)=a+a=2a$. We need $2a\equiv2$ modulo $4$, which holds for $a=1$ and $a=3$. Each of these two values extends in exactly one way.'
          - problem: 'Let $\{x\}^*$ be the free monoid on one letter. For which elements $a$ of $\mathbb{Z}/6$ is there a monoid homomorphism $h\colon\{x\}^*\to(\mathbb{Z}/6,+)$ with $h(x)=a$ and $h(xxx)=0$?'
            answer: '0, 2, 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism with $h(x)=a$ has $h(xxx)=3a$. We need $3a\equiv0$ modulo $6$, which holds when $a$ is even. So the possible values are $0$, $2$ and $4$.'
          - problem: 'Let $\{x\}^*$ be the free monoid on one letter. Which element $a$ of $\mathbb{Z}/7$ gives a monoid homomorphism $h\colon\{x\}^*\to(\mathbb{Z}/7,+)$ with $h(x)=a$ and $h(xxx)=2$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism with $h(x)=a$ has $h(xxx)=3a$. We need $3a\equiv2$ modulo $7$. Since $3\cdot3=9\equiv2$, the element is $a=3$, and no other element works, because $3$ is invertible modulo $7$.'
          - problem: 'A robot walks on a circular track with $12$ positions. The instruction $x$ moves it $a$ positions forward, and a program is a word in $x$. After the program $xxxx$ the robot is back where it started. Which values $a\in\{0,1,\dots,11\}$ are possible?'
            answer: '0, 3, 6, 9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A program is a homomorphism from the free monoid $\{x\}^*$ to $(\mathbb{Z}/12,+)$ with $h(x)=a$. Four moves give $4a$, and we need $4a\equiv0$ modulo $12$. This holds exactly when $3$ divides $a$, so $a=0,3,6,9$.'
          - problem: 'How many homomorphisms $h\colon\{a,b\}^*\to(\mathbb{N},+,0)$ have $h(aab)=9$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism is fixed by the pair $(h(a),h(b))$, and $h(aab)=2h(a)+h(b)=9$. The solutions in the natural numbers are $(0,9)$, $(1,7)$, $(2,5)$, $(3,3)$ and $(4,1)$. So there are $5$ homomorphisms, not only $h(a)=h(b)=3$.'
          - problem: 'A conveyor belt passes $9$ stations in a loop. One pass of the instruction $x$ advances a parcel by $a$ stations, and after three passes the parcel is back at its starting station. Which values $a\in\{0,1,\dots,8\}$ are possible?'
            answer: '0, 3, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A program of passes is a homomorphism from $\{x\}^*$ to $(\mathbb{Z}/9,+)$ with $h(x)=a$. Three passes give $3a$, and we need $3a\equiv0$ modulo $9$. This holds exactly when $3$ divides $a$, so $a=0,3,6$.'
          - problem: 'Write the full proof that the free-monoid functor is left adjoint to the forgetful functor from monoids to sets, showing both that restriction to the generators is well defined and that extension from the generators is unique. Then compare with the solution.'
            answer: 'Free monoid is left adjoint to U'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Full statement: for a set $X$, let $X^*$ be the free monoid of words on $X$; for a monoid $M$, let $U(M)$ be its underlying set. Step 1, the map: send a homomorphism $h\colon X^* \to M$ to its restriction $\bar{h}\colon X \to U(M)$, $\bar{h}(x) = h(x)$. Step 2, restriction is well defined: $h$ is a function on the whole set $X^*$, so restricting it to the subset of one-letter words gives an honest function $X \to U(M)$; no choice is involved. Step 3, extension: given $g\colon X \to U(M)$, define $\hat{g}(x_1 \cdots x_n) = g(x_1) \cdots g(x_n)$ and send the empty word to the identity of $M$; a word factors into letters in exactly one way, so $\hat{g}$ is one well-defined homomorphism. Step 4, uniqueness: any homomorphism $h$ with $h|_X = g$ must satisfy $h(x_1 \cdots x_n) = h(x_1) \cdots h(x_n) = g(x_1) \cdots g(x_n)$ and $h(\epsilon) = 1$, hence $h = \hat{g}$; so restriction and extension are inverse bijections. Step 5, conclusion: the bijection $\mathrm{Hom}_{\mathbf{Mon}}(X^*, M) \cong \mathrm{Hom}_{\mathbf{Set}}(X, U(M))$ is natural in $X$ and $M$, with unit the insertion of letters, so the free monoid functor is left adjoint to the forgetful functor.'
    diagnostic_exemplar:
      problem: "Using the currying adjunction $(-\\times A)\\dashv(-)^A$ and associativity of the product, prove the exponential law $C^{A\\times B}\\cong(C^B)^A$ in a cartesian closed category."
      answer: "For every $X$: $\\mathrm{Hom}(X,C^{A\\times B})\\cong\\mathrm{Hom}(X\\times(A\\times B),C)\\cong\\mathrm{Hom}((X\\times A)\\times B,C)\\cong\\mathrm{Hom}(X\\times A,C^B)\\cong\\mathrm{Hom}(X,(C^B)^A)$ — uncurry, reassociate, curry twice — each step natural in $X$. Two objects representing the same functor are isomorphic (Yoneda), so $C^{A\\times B}\\cong(C^B)^A$."
      solution_sketch: "Do not construct a map between the two objects directly. Chain hom-set bijections at an arbitrary $X$ — uncurry, reassociate the product, curry twice — checking each step is natural in $X$; Yoneda then upgrades the isomorphism of representables to an isomorphism of the objects themselves."
    anki_seeds:
      - front: "The chain of adjoints around the diagonal functor?"
        back: "$(+)\\dashv\\Delta\\dashv(\\times)$: coproduct is left adjoint, product is right adjoint to $\\Delta$."
        type: basic
      - front: "Currying is the adjunction {{c1::$(-\\times A)\\dashv(-)^A$}} with counit evaluation."
        back: "$(-\\times A)\\dashv(-)^A$"
        type: cloze

  - id: unit-counit
    name: Unit and Counit
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: adjunctions
        weight: 0.6
        key: true
      - id: natural-transformations
        weight: 0.3
        key: true
      - id: adjunction-examples
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: 'Defining unit and counit'
        key_prerequisites: [adjunctions]
        constraints: 'Recover the unit and the counit as identity transposes in the free-monoid adjunction, leaving their component formulas to the learner. Evaluate them on words, on the empty word and on words of words, in algebra and in word problems.'
        exemplars:
          - problem: 'For the free-monoid adjunction $F\dashv U$ with $F(X)=X^*$, the unit $\eta_X\colon X\to UFX$ is the transpose of $1_{FX}$. For $X=\{c,d,e\}$, what is the length of the word $\eta_X(d)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The unit is the transpose of the identity of $X^*$, and it restricts that identity to the letters. So $\eta_X$ sends a letter to the one-letter word consisting of that letter. The word $\eta_X(d)$ has length $1$.'
          - problem: 'For the free-monoid adjunction, the counit $\varepsilon_M\colon(UM)^*\to M$ is the transpose of $1_{UM}$. For $M=(\mathbb{Z},+)$, what is $\varepsilon_M$ of the word $(2,-5,7)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counit is the homomorphism with $\varepsilon_M((m))=m$ on one-letter words. A homomorphism turns a word into the product of its letters, which in $(\mathbb{Z},+)$ is the sum. So the value is $2+(-5)+7=4$.'
          - problem: 'For the free-monoid adjunction, let $M=(\mathbb{Z},\times,1)$ be the integers under multiplication. What is $\varepsilon_M$ of the word $(3,-2,5)$?'
            answer: '-30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counit evaluates a word by multiplying its letters in $M$. In $(\mathbb{Z},\times,1)$ the product is $3\cdot(-2)\cdot5=-30$.'
          - problem: 'For the free-monoid adjunction, a function $f\colon\{a,b\}\to U(\mathbb{Z},+)$ has $f(a)=3$ and $f(b)=-2$. What does its inverse transpose, the homomorphism $\{a,b\}^*\to(\mathbb{Z},+)$, send the word $bab$ to?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse transpose is the homomorphism that agrees with $f$ on the letters, and it adds the values of the letters. So the value on $bab$ is $f(b)+f(a)+f(b)=-2+3-2=-1$.'
          - problem: 'A clock has $12$ hours, and the monoid $M=(\mathbb{Z}/12,+)$ describes turning the hour hand. A word in the elements of $M$ lists successive turns, and the counit $\varepsilon_M$ of the free-monoid adjunction evaluates a word as one turn. What is $\varepsilon_M(5,9,8)$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counit adds the turns in $M=\mathbb{Z}/12$. The sum is $5+9+8=22$. Since $22=12+10$, the remainder is $10$.'
          - problem: 'For the free-monoid adjunction, the counit at the free monoid $FX=\{a,b\}^*$ is a homomorphism $\varepsilon_{FX}\colon(UFX)^*\to FX$. How many letters does $\varepsilon_{FX}$ of the word of words $\big((b,a),(\,),(a,b,b)\big)$ have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counit multiplies the word out in the monoid $FX$, and the product in $FX$ is concatenation. Concatenating $ba$, the empty word and $abb$ gives $baabb$, which has $5$ letters.'
          - problem: 'For the free-monoid adjunction, let $M=(\mathbb{Z},\times,1)$. What is $\varepsilon_M$ of the empty word?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A monoid homomorphism sends the identity element to the identity element. The empty word is the identity of $(UM)^*$, and the identity of $(\mathbb{Z},\times,1)$ is $1$. So $\varepsilon_M$ of the empty word is $1$.'
          - problem: 'Let $M=(\mathbb{Z},+)$. The counit $\varepsilon_M$ is a homomorphism from words in $M$ to $M$. What is the value of $\varepsilon_M(4,4)$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The counit is a homomorphism, so it turns the word $(4,4)$ into the product of its letters. In $(\mathbb{Z},+)$ this product is the sum $4+4=8$, not the first letter $4$.'
          - problem: 'A bank account is modeled by $M=(\mathbb{Z},+)$, in euros. A word in the elements of $M$ lists the deposits and withdrawals of a week, for example $(200,-80,50)$, and the counit $\varepsilon_M$ of the free-monoid adjunction evaluates a word as the total change. What is $\varepsilon_M(200,-80,50)$?'
            answer: '170'
            answer_contract: {"kind": "unit", "quantity": "euro", "unit": "euro", "allow_omitted": true}
            solution_sketch: 'The counit adds the amounts in $(\mathbb{Z},+)$. The total is $200+(-80)+50=170$ euros.'
          - problem: 'Write the full proof that, in the free-monoid adjunction $F\dashv U$ with $F(X)=X^*$ and hom-set correspondence $\Phi$, the unit $\eta_X=\Phi_{X,X^*}(1_{X^*})$ sends every letter $x$ to the one-letter word $(x)$, the counit $\varepsilon_M=\Phi^{-1}_{UM,M}(1_{UM})$ sends every word $m_1\cdots m_k$ of elements of $M$ to the product $m_1\cdots m_k$ and the empty word to the identity element, and $\eta$ and $\varepsilon$ are natural transformations. Then compare with the solution.'
            answer: 'Unit inserts letters; counit multiplies'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (form of the correspondence): for a homomorphism $h : X^* \to M$, the map $\Phi_{X, M}(h) : X \to U(M)$ is $h \circ i_X$, where $i_X$ inserts a letter as a one-letter word; conversely $\Phi^{-1}(f)$ is the unique monoid homomorphism $X^* \to M$ extending $f$. Step 2 (unit): $\eta_X = \Phi_{X, X^*}(1_{X^*}) = 1_{X^*} \circ i_X = i_X$, so $\eta_X(x) = (x)$ for every letter. Step 3 (counit): $\varepsilon_M = \Phi^{-1}(1_{UM})$ is the unique homomorphism $(UM)^* \to M$ with $\varepsilon_M((m)) = m$; since it preserves the operation, $\varepsilon_M(m_1 \cdots m_k) = m_1 \cdots m_k$, and it maps the empty word to the identity element of $M$. Step 4 (naturality of $\eta$): for a function $g : X \to Y$, both $U(g^*) \circ \eta_X$ and $\eta_Y \circ g$ send a letter $x$ to the one-letter word $(g(x))$, which is the concrete form of the naturality of $\Phi$ in both variables. Step 5 (naturality of $\varepsilon$): for a monoid homomorphism $t : M \to N$, both $t \circ \varepsilon_M$ and $\varepsilon_N \circ (Ut)^*$ send the word $m_1 \cdots m_k$ to $t(m_1) \cdots t(m_k)$, because $t$ preserves products. Conclusion: $\eta : 1 \Rightarrow UF$ and $\varepsilon : FU \Rightarrow 1$ are natural transformations, namely the unit and counit of $F \dashv U$.'
      - id: kp2
        name: 'Recovering the bijection from unit and counit'
        key_prerequisites: [natural-transformations]
        constraints: 'Reconstruct the two hom-set maps from unit and counit. Evaluate transposes and inverse transposes from the unit and the counit, in Set, in free-monoid and poset adjunctions and in word problems; test candidate unit-counit data by their composite; do not announce inversehood before asking.'
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $F(C)=C\times\{0,1\}$ and $G(D)=D^{\{0,1\}}$, with the unit $\eta_C(c)$ the function $j\mapsto(c,j)$. Let $h\colon C\times\{0,1\}\to D$ with $C=\{0,1\}$ have $h(0,0)=5$, $h(0,1)=6$, $h(1,0)=7$ and $h(1,1)=8$, and let $\Phi(h)\colon C\to D^{\{0,1\}}$ be its transpose. What is $\Phi(h)(1)(1)$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose is $\Phi(h)=Gh\circ\eta_C$. It sends $c$ to the function $j\mapsto h(\eta_C(c)(j))=h(c,j)$. So $\Phi(h)(1)(1)=h(1,1)=8$.'
          - problem: 'In $\mathbf{Set}$ let $F(C)=C\times\{0,1\}$ and $G(D)=D^{\{0,1\}}$, with the counit $\varepsilon_D(g,j)=g(j)$. Let $k\colon\{0,1\}\to D^{\{0,1\}}$ be the function for which $k(0)$ takes the values $5,8$ at $0,1$ and $k(1)$ takes the values $2,7$ at $0,1$. What does the inverse transpose $\Phi^{-1}(k)\colon\{0,1\}\times\{0,1\}\to D$ send $(1,0)$ to?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse transpose is $\Phi^{-1}(k)=\varepsilon_D\circ Fk$. It sends $(c,j)$ to $\varepsilon_D(k(c),j)=k(c)(j)$. So the value at $(1,0)$ is $k(1)(0)=2$.'
          - problem: 'On the poset $(\mathbb{Z},\le)$ let $F(c)=2c$ and $G(d)=\lfloor d/2\rfloor$, so that $F\dashv G$. The counit at $d$ is an arrow $FG(d)\to d$. What is $FG(11)$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $G(11)=\lfloor11/2\rfloor=5$. So $FG(11)=2\cdot5=10$, and the counit is the arrow $10\le11$.'
          - problem: 'Let $F\dashv U$ be the free-monoid adjunction and let $k\colon\{a,b\}\to U(\mathbb{Z},+)$ have $k(a)=5$ and $k(b)=-3$. What does the inverse transpose $\Phi^{-1}(k)\colon\{a,b\}^*\to(\mathbb{Z},+)$ send the word $baab$ to?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse transpose is $\varepsilon\circ F(k)$. It first replaces each letter by its value, and then adds the values in $(\mathbb{Z},+)$. So the value on $baab$ is $-3+5+5-3=4$.'
          - problem: 'In the proof that $\Phi(h)=Gh\circ\eta_C$ for an arrow $h\colon FC\to D$ one writes $\Phi(h)=\Phi(h\circ1_{FC})=Gh\circ\Phi(1_{FC})$. Does this step use the naturality of $\Phi$ in the first variable or in the second variable?'
            answer: 'second'
            answer_contract: {"kind": "label", "options": [["second", "the second variable", "second variable", "natural in the second variable", "it uses the second variable", "D"], ["first", "the first variable", "first variable", "natural in the first variable", "it uses the first variable", "C"]]}
            solution_sketch: 'The arrow $h$ is composed after $1_{FC}$, so it changes the target $D$ of the hom-set $\mathrm{Hom}(FC,D)$. The target is the second variable of $\Phi$. So the step uses naturality in the second variable.'
          - problem: 'Let $\mathcal C$ be the monoid $(\mathbb{Z}/5,+)$ regarded as a category with one object, and let $F=G=\mathrm{Id}$. The natural transformations $\eta\colon\mathrm{Id}\Rightarrow GF$ and $\varepsilon\colon FG\Rightarrow\mathrm{Id}$ have the elements $2$ and $3$ as their only components. Do $\eta$ and $\varepsilon$ satisfy the triangle identities, so that they are the unit and counit of an adjunction $F\dashv G$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "they do", "they are"], ["no", "it is not", "false", "they do not", "they are not"]]}
            solution_sketch: 'For $F=G=\mathrm{Id}$ both triangle identities say that the composite $\varepsilon\circ\eta$ is the identity arrow. The identity arrow of this one-object category is the element $0$. Since $2+3=5\equiv0$ modulo $5$, both triangles hold.'
          - problem: 'Let $\mathcal C$ be the monoid $(\mathbb{Z}/7,+)$ regarded as a category with one object, let $F=G=\mathrm{Id}$, and let $\eta$ and $\varepsilon$ have the elements $3$ and $2$ as their only components. The triangle identities need the composite $\varepsilon\circ\eta$ to be the identity element $0$. What is $\varepsilon\circ\eta$, as an element of $\mathbb{Z}/7$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite of the arrows $3$ and $2$ is their sum in $\mathbb{Z}/7$. Since $3+2=5$ and $5\ne0$, the triangle identities fail, so these data are not a unit and counit.'
          - problem: 'A bus seats $12$ people. Let $G(n)=12n$ be the number of seats in $n$ buses, and let $F(p)$ be the least number of buses that carry $p$ people, so that $F(p)\le n$ exactly when $p\le G(n)$ and $F\dashv G$ on $(\mathbb{N},\le)$. The unit at $p$ is an arrow $p\to GF(p)$. What is $GF(50)$?'
            answer: '60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number $F(50)$ is the least $n$ with $50\le12n$. Since $12\cdot4=48<50$ and $12\cdot5=60\ge50$, we get $F(50)=5$ buses. So $GF(50)=12\cdot5=60$ seats, and the unit is the arrow $50\le60$.'
          - problem: 'A teacher seats students in full groups of $5$. Let $F(n)=\lfloor n/5\rfloor$ be the number of full groups that $n$ students make and $G(m)=5m+4$, so that $F(n)\le m$ exactly when $n\le G(m)$ and $F\dashv G$ on $(\mathbb{N},\le)$. The unit at $n$ is an arrow $n\to GF(n)$. What is $GF(23)$?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $F(23)=\lfloor23/5\rfloor=4$ full groups. So $GF(23)=5\cdot4+4=24$, and the unit is the arrow $23\le24$.'
          - problem: 'Write the full proof that, given an adjunction $F\dashv G$ with hom-set bijection $\Phi$ natural in both variables, unit $\eta_C=\Phi(1_{FC})$ and counit $\varepsilon_D=\Phi^{-1}(1_{GD})$, the formulas $\Phi(h)=Gh\circ\eta_C$ and $\Phi^{-1}(k)=\varepsilon_D\circ Fk$ follow from naturality, and the two maps they define are mutually inverse. Then compare with the solution.'
            answer: 'Phi and Psi are mutually inverse'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (naturality of $\Phi$, second variable): apply naturality in $D$ to the map $h: FC \to D$ acting on $1_{FC}$: $\Phi(h) = \Phi(h \circ 1_{FC}) = Gh \circ \Phi(1_{FC}) = Gh \circ \eta_C$. Step 2 (naturality of $\Psi = \Phi^{-1}$, first variable): dually, naturality in $C$ applied to $k: C \to GD$ acting on $1_{GD}$ gives $\Psi(k) = \Psi(1_{GD} \circ k) = \Psi(1_{GD}) \circ Fk = \varepsilon_D \circ Fk$. Step 3 (first direction): $\Psi(\Phi(h)) = \varepsilon_D \circ FGh \circ F\eta_C = h \circ \varepsilon_{FC} \circ F\eta_C = h \circ 1_{FC} = h$, using the naturality square $\varepsilon_D \circ FGh = h \circ \varepsilon_{FC}$ and the triangle identity $\varepsilon_{FC} \circ F\eta_C = 1_{FC}$. Step 4 (second direction): $\Phi(\Psi(k)) = G\varepsilon_D \circ GFk \circ \eta_C = G\varepsilon_D \circ \eta_{GD} \circ k = 1_{GD} \circ k = k$, using the naturality square $GFk \circ \eta_C = \eta_{GD} \circ k$ and the triangle identity $G\varepsilon_D \circ \eta_{GD} = 1_{GD}$. Step 5 (conclusion): $\Phi$ and $\Psi$ are mutually inverse, so the unit and counit determine the whole adjunction bijection.'
    diagnostic_exemplar:
      problem: "For an adjunction $F\\dashv G$ with hom-set bijection $\\Phi$, unit $\\eta_C=\\Phi(1_{FC})$ and counit $\\varepsilon_D=\\Phi^{-1}(1_{GD})$, derive the formulas $\\Phi(h)=Gh\\circ\\eta_C$ and $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$ from the naturality of $\\Phi$."
      answer: "Naturality of $\\Phi$ in the second variable, applied to $h\\colon FC\\to D$, gives $\\Phi(h)=\\Phi(h\\circ 1_{FC})=Gh\\circ\\Phi(1_{FC})=Gh\\circ\\eta_C$. Dually, naturality of $\\Phi^{-1}$ in the first variable, applied to $k\\colon C\\to GD$, gives $\\Phi^{-1}(k)=\\Phi^{-1}(1_{GD}\\circ k)=\\Phi^{-1}(1_{GD})\\circ Fk=\\varepsilon_D\\circ Fk$. So the unit and counit encode the whole bijection."
      solution_sketch: "Feed an identity into naturality of $\\Phi$: write $h=h\\circ 1_{FC}$ and move $h$ out through the naturality square, leaving $Gh\\circ\\Phi(1_{FC})$. The dual move on $\\Phi^{-1}$, writing $k=1_{GD}\\circ k$, gives the counit formula."
    anki_seeds:
      - front: "Unit of $F\\dashv G$ (type and transpose)?"
        back: "$\\eta\\colon 1\\Rightarrow GF$, with $\\eta_C=\\Phi(1_{FC})$."
        type: basic
      - front: "Counit of $F\\dashv G$ (type and transpose)?"
        back: "$\\varepsilon\\colon FG\\Rightarrow 1$, with $\\varepsilon_D=\\Phi^{-1}(1_{GD})$."
        type: basic
      - front: "Adjunction transpose of $h\\colon FC\\to D$ in terms of $\\eta$?"
        back: "$\\Phi(h)=Gh\\circ\\eta_C$."
        type: basic
      - front: "Adjunction inverse-transpose of $k\\colon C\\to GD$ in terms of $\\varepsilon$?"
        back: "$\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$."
        type: basic

  - id: triangle-identities
    name: The Triangle Identities
    core: true
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: unit-counit
        weight: 0.6
        key: true
      - id: natural-transformations
        weight: 0.3
        key: true
      - id: vertical-horizontal-composition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Statement of the zig-zag identities
        key_prerequisites: [unit-counit]
        constraints: 'Triangle paths are evaluated on concrete elements of Set, the free monoid and string models; a modified unit or counit is tested for the element on which a triangle fails. One full-proof exemplar is kept.'
        exemplars:
          - problem: 'In $\mathbf{Set}$ fix $A=\{0,1\}$. The functor $F(X)=X\times A$ is left adjoint to $G(Y)=Y^A$, the functions $A\to Y$, with unit $\eta_X(x)=(a\mapsto(x,a))$ and counit $\varepsilon_Y(f,a)=f(a)$. For $X=\mathbb{N}$, the map $F\eta_X$ sends $(x,a)$ to $(\eta_X(x),a)$. Which pair is $(\varepsilon_{FX}\circ F\eta_X)(3,1)$?'
            answer: '(3, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'First $F\eta_X(3,1)=(\eta_X(3),1)$, where $\eta_X(3)$ is the function $a\mapsto(3,a)$. Then $\varepsilon_{FX}$ evaluates this function at $1$ and gives $(3,1)$. So the composite fixes the pair $(3,1)$, as the first triangle identity requires.'
          - problem: 'Take the same adjunction and $Y=\mathbb{N}$. Let $f\in G(Y)=\mathbb{N}^A$ be the function with $f(0)=5$ and $f(1)=8$. The map $\eta_{GY}$ sends $f$ to the function $a\mapsto(f,a)$, and $G\varepsilon_Y$ sends a function $k$ to $\varepsilon_Y\circ k$. What is the value at $1$ of the function $(G\varepsilon_Y\circ\eta_{GY})(f)$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Applying $\eta_{GY}$ gives the function $a\mapsto(f,a)$. Applying $G\varepsilon_Y$ composes it with $\varepsilon_Y$, which gives $a\mapsto\varepsilon_Y(f,a)=f(a)$, so the result is $f$ itself. Its value at $1$ is $f(1)=8$.'
          - problem: 'A printer takes a list of strings and joins them into one string; this is the counit of the free-monoid adjunction. A faulty clerk wraps every letter of a message as a string of two copies of that letter, puts these strings in a list, and sends the list to the printer. The message has $7$ letters. How many letters does the printed string have?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each of the $7$ letters becomes one string of two letters. Joining the $7$ strings gives $7\cdot2=14$ letters, so the printed string is longer than the message and the triangle identity fails.'
          - problem: 'The same faulty clerk wraps each letter of a message as a string of $m$ copies of that letter, and the printer then joins the strings. A message has $k$ letters. How many letters does the printed string have?'
            answer: 'm*k'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each of the $k$ letters becomes a string of $m$ letters. Joining the $k$ strings gives $k\cdot m=mk$ letters, so the printed string equals the message only when $m=1$.'
          - problem: 'In the free-monoid adjunction on an alphabet with at least two letters, the counit on a word of words is replaced by the concatenation of the inner words in reverse order, and the unit is kept. What is the smallest length $k$ of a word $w$ for which the composite $\varepsilon\circ F\eta$ does not return $w$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The map $F\eta_X$ sends $w=x_1\cdots x_k$ to the word of one-letter words $(x_1)\cdots(x_k)$, and the reversed counit returns $x_k\cdots x_1$. For $k=1$ this equals $w$, but for $k=2$ the word $ab$ becomes $ba\ne ab$. So the smallest length is $2$.'
          - problem: 'In the free-monoid adjunction the unit is replaced by $\eta^{\prime}(x)=xx$, the word of two copies of $x$, and the counit that multiplies a word of words out is kept. Let $M=(\mathbb{N},+,0)$. The second triangle composite $U\varepsilon_M\circ\eta^{\prime}_{UM}$ sends the element $3$ of $UM$ to which number?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The unit $\eta^{\prime}_{UM}$ sends $3$ to the word $[3,3]$ of two generators of $F(UM)$. The counit $\varepsilon_M$ evaluates this word in $M$, which means adding, so $U\varepsilon_M$ gives $3+3=6$. Since $6\ne3$, the second triangle identity fails.'
          - problem: 'In the free-monoid adjunction replace the unit by $\eta^{\prime}(x)=xx$ and keep the counit that multiplies a word of words out. Multiplying out the doubled letters undoes the doubling. Does the first triangle identity still hold?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it holds", "it still holds", "yes it holds"], ["no", "it fails", "it does not hold", "no it fails"]]}
            solution_sketch: 'On the one-letter word $a$ the composite sends $a$ to the word $(aa)$ and then to $aa$. Since $aa\ne a$, the identity fails.'
          - problem: 'Write the full proof that both triangle identities hold for the free-monoid adjunction, with the whiskering written explicitly and each identity checked on a general element.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1 (first identity, whiskering explicit): eps F o F eta = 1_F must be shown. Step 2: at a set X, take a general word w = x1 x2 ... xk in the free monoid on X. Step 3: F eta_X sends w to the word of one-letter words, and the counit at the free monoid on X concatenates it back to x1 x2 ... xk = w, so each component of eps F o F eta is the identity. Step 4 (second identity, whiskering explicit): G eps o eta G = 1_G must be shown. Step 5: at a monoid M, take a general element m of the underlying set; the unit turns m into the one-entry word (m), and U eps_M multiplies it out to m, so each component of G eps o eta G is the identity. This proves both zig-zag identities for the free-monoid adjunction.'
      - id: kp2
        name: Deriving a triangle identity from the transposes
        key_prerequisites: [unit-counit]
        constraints: 'Transposes Phi and its inverse are evaluated in the curried adjunction on Set; the learner finds the object at which a transpose formula is applied or the first failing step of a derivation. One full-proof exemplar is kept.'
        exemplars:
          - problem: 'In $\mathbf{Set}$ fix $A=\{0,1\}$ and use the adjunction $-\times A\dashv(-)^A$, whose transpose sends $h\colon X\times A\to Y$ to $\Phi(h)(x)=(a\mapsto h(x,a))$. The unit is $\eta_X=\Phi(1_{FX})$, where $1_{FX}$ is the identity on $X\times A$. For $X=\mathbb{N}$, which pair is $\eta_X(7)(0)$?'
            answer: '(7, 0)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Transposing the identity on $X\times A$ gives $\eta_X(x)=(a\mapsto 1(x,a))=(a\mapsto(x,a))$. At $x=7$ and $a=0$ the value is the pair $(7,0)$.'
          - problem: 'A cafe charges $h(x,a)=3x+2a$ cents for $x$ cups of coffee with $a\in\{0,1\}$ extra shots. In the adjunction $-\times A\dashv(-)^A$ with $A=\{0,1\}$, the transpose $\Phi(h)$ sends $x$ to the function $a\mapsto h(x,a)$. What is $\Phi(h)(4)(1)$?'
            answer: '14'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The transpose $\Phi(h)$ turns the price rule into a function of $x$ whose values are functions of $a$. So $\Phi(h)(4)(1)=h(4,1)=3\cdot4+2\cdot1=14$.'
          - problem: 'A cafe keeps a table $k$ that sends the number $x$ of cups to the function $k(x)\colon a\mapsto 10x+a$ on $A=\{0,1\}$. In the same adjunction the inverse transpose is $\Phi^{-1}(k)(x,a)=k(x)(a)$. What is $\Phi^{-1}(k)(4,1)$?'
            answer: '41'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The inverse transpose applies the function $k(4)$ to the argument $1$. Since $k(4)$ is the function $a\mapsto 40+a$, the value is $40+1=41$.'
          - problem: 'In the same adjunction the counit is $\varepsilon_Y=\Phi^{-1}(1_{GY})$ with $\Phi^{-1}(k)(x,a)=k(x)(a)$. Let $Y=\mathbb{N}$ and let $f\in Y^A$ satisfy $f(0)=2$ and $f(1)=9$. What is $\varepsilon_Y(f,1)$?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'For $k=1_{GY}$ the formula reads $\varepsilon_Y(f,a)=1(f)(a)=f(a)$. So the counit evaluates a function at an argument, and at $a=1$ this is $f(1)=9$.'
          - problem: 'The work below derives the first triangle identity. Step 1: $\eta_C=\Phi(1_{FC})$. Step 2: apply $\Phi^{-1}$ to get $\Phi^{-1}(\eta_C)=1_{FC}$. Step 3: in $\Phi^{-1}(k)=\varepsilon_D\circ Fk$ take $k=\eta_C$ and $D=C$. Step 4: conclude $\varepsilon_{FC}\circ F\eta_C=1_{FC}$. Which step is the first that fails, and why?'
            answer: 'Step 3: eta_C has type C to GFC, so in the formula the object D must be FC, not C.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'The unit $\eta_C$ has type $C\to GFC$, so in the formula $\Phi^{-1}(k)=\varepsilon_D\circ Fk$ the object $D$ must be $FC$, not $C$. Steps 1 and 2 are valid, so Step 3 is the first that fails.'
          - problem: 'Let $k\colon C\to GD$ be a map and let $\Phi^{-1}(k)=\varepsilon_D\circ Fk$. For $k=\eta_C$, the unit at $C$, which object is $D$?'
            answer: 'FC'
            answer_contract: {"kind":"label","options":[["FC","F(C)","F C","D = FC","D = F(C)","D is FC","the object FC","F of C"],["C","the object C"],["GC","G(C)","G C"],["GFC","G(F(C))","GF(C)","G F C"]]}
            solution_sketch: 'The unit $\eta_C$ has type $C\to GFC$. Comparing this with the type $C\to GD$ of the map $k$ gives $D=FC$, so the counit used is $\varepsilon_{FC}$.'
          - problem: 'In $\mathbf{Set}$ fix $A=\{0,1\}$ and use the adjunction $-\times A\dashv(-)^A$, with unit $\eta_X(x)=(a\mapsto(x,a))$ and counit $\varepsilon_Y(f,a)=f(a)$. Let $X=\mathbb{N}$, so that $F\eta_X$ sends $(x,a)$ to $(\eta_X(x),a)$. What is $\varepsilon_{FX}(F\eta_X(5,1))$?'
            answer: '(5, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'First $F\eta_X(5,1)=(\eta_X(5),1)$, where $\eta_X(5)$ is the function $a\mapsto(5,a)$. Then $\varepsilon_{FX}$ evaluates this function at $1$, which gives $(5,1)$. So the composite is the identity, as the first triangle identity says.'
          - problem: 'Write the full proof that $G\varepsilon_D\circ\eta_{GD}=1_{GD}$ for every object $D$, starting from the definition $\varepsilon_D=\Phi^{-1}(1_{GD})$ and the formula $\Phi(h)=Gh\circ\eta_C$.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1 (defining equation of the counit): the hypothesis gives $\varepsilon_D=\Phi^{-1}(1_{GD})$, where $1_{GD}$ is the identity arrow on $GD$. Step 2 (apply the transpose once): applying $\Phi$ to both sides yields $\Phi(\varepsilon_D)=1_{GD}$, since $\Phi$ undoes $\Phi^{-1}$. Step 3 (evaluate the transpose formula): the transpose sends $h\colon FC\to D$ to $Gh\circ\eta_C$; here $h=\varepsilon_D$ has domain $FGD$, so $C=GD$ and $\Phi(\varepsilon_D)=G\varepsilon_D\circ\eta_{GD}$. Step 4 (conclude): combining the two lines gives $G\varepsilon_D\circ\eta_{GD}=1_{GD}$, the second triangle identity. One application of $\Phi$ and one evaluation of the transpose formula suffice.'
      - id: kp3
        name: Triangle identities as an equivalent definition
        key_prerequisites: [natural-transformations]
        constraints: 'Unit-counit data on one-object categories of cyclic groups and dials are tested against the triangle identities and the transposes built from them; the learner finds the missing counit, counts the valid pairs or evaluates a round trip. All exemplars are closed; the KP stays non-proof.'
        try_first:
          problem: 'A dial has $8$ positions, numbered $0$ to $7$. A turn by $3$ positions forward is followed by a turn by $b$ positions forward, and the dial is back at its start. What is $b$?'
          answer_contract: {"kind":"exact"}
          answer: '5'
          reveal: 'The two turns must add up to a multiple of $8$, so $3+b=8$ and $b=5$. For $\mathrm{Id}\dashv\mathrm{Id}$ on such a dial the unit and counit must satisfy exactly this condition.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the one-object category of $(\mathbb{Z}/5,+)$, where composition of arrows is addition, and let $F=G=\mathrm{Id}$. The unit is the arrow $\eta=2$ and the counit is the arrow $\varepsilon=b$. For which $b\in\{0,1,2,3,4\}$ do $\eta$ and $\varepsilon$ satisfy both triangle identities?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'With $F=G=\mathrm{Id}$ both triangle identities say that the composite $\varepsilon\circ\eta$ is the identity arrow $0$. So $2+b\equiv0\pmod 5$, which gives $b=3$.'
          - problem: 'On the one-object category of $(\mathbb{Z},+)$ let $F=G=\mathrm{Id}$, with unit $\eta=7$. Which counit $\varepsilon$ makes $\eta$ and $\varepsilon$ satisfy the triangle identities?'
            answer: '-7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Both triangle identities require the composite $\varepsilon\circ\eta$ to be the identity arrow $0$. So $7+\varepsilon=0$, which gives $\varepsilon=-7$.'
          - problem: 'On the one-object category of $(\mathbb{Z}/7,+)$ let $F=G=\mathrm{Id}$, with $\eta=2$ and $\varepsilon=4$. Do $\eta$ and $\varepsilon$ form the unit and counit of an adjunction?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, they do","they do","it is an adjunction"],["no","no, they do not","they do not","it is not an adjunction"]]}
            solution_sketch: 'Both triangle identities require $\eta+\varepsilon\equiv0\pmod 7$. Here $2+4=6\not\equiv0$, so the identities fail and the data do not form an adjunction.'
          - problem: 'On the one-object category of $(\mathbb{Z}/5,+)$ let $F=G=\mathrm{Id}$, with $\eta=2$ and $\varepsilon=1$. Define $\Phi(h)=Gh\circ\eta$ and $\Psi(k)=\varepsilon\circ Fk$ on arrows. What is $\Psi(\Phi(3))$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\Phi(3)=3+2=5\equiv0$, and then $\Psi(0)=1+0=1$ in $\mathbb{Z}/5$. If the triangle identities held, $\Psi\Phi$ would return $3$, so the result $1$ shows that they fail.'
          - problem: 'A dial has $12$ positions. A unit turns the dial $5$ positions forward and a counit turns it $b$ positions forward. They satisfy the triangle identities exactly when one turn followed by the other leaves the dial where it started. What is $b$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The two turns must add up to a multiple of $12$. Solving $5+b=12$ with $0\le b<12$ gives $b=7$.'
          - problem: 'On the one-object category of $(\mathbb{Z}/6,+)$ let $F=G=\mathrm{Id}$. How many pairs $(\eta,\varepsilon)$ of arrows are the unit and counit of an adjunction?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each choice of $\eta\in\mathbb{Z}/6$ has exactly one partner $\varepsilon=-\eta$ with $\varepsilon\circ\eta=0$. There are $6$ choices of $\eta$, so there are $6$ pairs.'
          - problem: 'In a 2-category the 1-cells $F\colon\mathcal{C}\to\mathcal{D}$ and $G\colon\mathcal{D}\to\mathcal{C}$ have 2-cells $\eta\colon1_{\mathcal{C}}\Rightarrow GF$ and $\varepsilon\colon FG\Rightarrow1_{\mathcal{D}}$. The first triangle identity says that a composite of two whiskered 2-cells is the identity 2-cell on $F$. Is that composite $\varepsilon F\circ F\eta$ or $F\varepsilon\circ\eta F$?'
            answer: 'εF∘Fη'
            answer_contract: {"kind":"label","options":[["εF∘Fη","εF ∘ Fη","εF after Fη","eps F o F eta","epsilon F o F eta","the first","Fη then εF","F eta then eps F"],["Fε∘ηF","Fε ∘ ηF","Fε after ηF","F eps o eta F","F epsilon o eta F","the second","ηF then Fε","eta F then F eps"]]}
            solution_sketch: 'The 2-cell $F\eta$ goes from $F$ to $FGF$, and $\varepsilon F$ goes from $FGF$ back to $F$. So $\varepsilon F\circ F\eta$ is a 2-cell from $F$ to $F$, as the identity requires. The other composite is not defined, because $\eta F$ does not have the right source.'
          - problem: 'On the one-object category of $(\mathbb{Z},+)$ let $F=G=\mathrm{Id}$, with unit $\eta=-4$. Define $\Phi(h)=Gh\circ\eta$ and $\Psi(k)=\varepsilon\circ Fk$ on arrows. The maps $\Phi$ and $\Psi$ are inverse to each other exactly when $\eta$ and $\varepsilon$ satisfy the triangle identities. If they do, what is $\Psi(9)$?'
            answer: '13'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The triangle identities force $\varepsilon+\eta=0$, so $\varepsilon=4$. Then $\Psi(9)=\varepsilon+9=13$. As a check, $\Phi(13)=13+\eta=9$, so $\Phi$ returns the arrow $9$.'
    diagnostic_exemplar:
      problem: "Using $\\eta_C=\\Phi(1_{FC})$ and $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$, prove the first triangle identity $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$."
      answer: "Apply $\\Phi^{-1}$ to both sides of $\\eta_C=\\Phi(1_{FC})$: $\\Phi^{-1}(\\eta_C)=1_{FC}$. Now evaluate $\\Phi^{-1}$ on $k=\\eta_C\\colon C\\to GFC$ (so $D=FC$) with the formula: $\\Phi^{-1}(\\eta_C)=\\varepsilon_{FC}\\circ F\\eta_C$. Equating the two expressions gives $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$, which holding for all $C$ is $\\varepsilon F\\circ F\\eta=1_F$."
      solution_sketch: "Apply $\\Phi^{-1}$ to the definition $\\eta_C=\\Phi(1_{FC})$ to get $\\Phi^{-1}(\\eta_C)=1_{FC}$, then evaluate that same $\\Phi^{-1}(\\eta_C)$ using the formula $\\varepsilon\\circ F(-)$. Equating the two readings of one value is the identity."
    anki_seeds:
      - front: "First triangle (zig-zag) identity, involving $F\\eta$?"
        back: "$\\varepsilon F\\circ F\\eta=1_F$."
        type: basic
      - front: "Second triangle (zig-zag) identity, involving $\\eta G$?"
        back: "$G\\varepsilon\\circ\\eta G=1_G$."
        type: basic
      - front: "An adjunction can be defined as functors $F,G$ plus $\\eta,\\varepsilon$ satisfying the {{c1::triangle identities}}."
        back: "triangle identities"
        type: cloze

  - id: free-forgetful-adjunctions
    name: Free-Forgetful Adjunctions
    core: false                # examples leaf topic
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: functor-examples
        weight: 0.4
        key: true
      - id: adjunction-examples
        weight: 0.3
      - id: monoids
        weight: 0.2
      - id: basis-dimension
        weight: 0.2
      - id: linear-transformations
        weight: 0.2
      - id: groups-intro
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: The general pattern
        key_prerequisites: [adjunctions]
        constraints: 'Counts of homomorphisms out of a free monoid or free group come from the unsupplied correspondence between homomorphisms and functions on generators, in abstract and in word-problem form; the counit is evaluated on a word. One full-proof exemplar is kept.'
        try_first:
          problem: 'How many functions are there from a set with $2$ elements to a set with $3$ elements?'
          answer_contract: {"kind":"exact"}
          answer: '9'
          reveal: 'There are $3\cdot3=9$ functions, since each of the $2$ elements has $3$ possible images. The adjunction shows that the same number counts the homomorphisms from the free group on $2$ generators to a group with $3$ elements.'
        exemplars:
          - problem: 'How many monoid homomorphisms are there from the free monoid on $\{a,b,c\}$ to a monoid with $4$ elements?'
            answer: '64'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A homomorphism out of a free monoid is determined by where it sends each generator, and any choice of images works. Each of the $3$ generators has $4$ possible images, so there are $4\cdot4\cdot4=64$ homomorphisms.'
          - problem: 'How many group homomorphisms are there from the free group on $\{x,y\}$ to a group $G$ with $5$ elements?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Group homomorphisms out of a free group correspond to functions from the generators to the underlying set of $G$. Each of the $2$ generators has $5$ possible images, so there are $5\cdot5=25$ homomorphisms.'
          - problem: 'A designer is told that there are exactly $343$ homomorphisms from the free group on her set $X$ of basic shapes to the symmetry group of a pattern, a group with $7$ elements. How many basic shapes does $X$ contain?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Homomorphisms from the free group on $X$ correspond to functions from $X$ to the $7$ elements of the group, so there are $7^{|X|}$ of them. Since $7^3=343$, the set $X$ has $3$ elements.'
          - problem: 'Programs are words in the instructions $s$ and $t$, and they form the free monoid on $\{s,t\}$. A machine interprets programs through a monoid homomorphism into its monoid of actions, which has $6$ elements. How many different interpretations of programs are there?'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An interpretation is fixed by the actions assigned to the two instructions $s$ and $t$, and every choice gives a homomorphism. Each instruction has $6$ possible actions, so there are $6\cdot6=36$ interpretations.'
          - problem: 'For a group $G$ the counit $\varepsilon_G\colon F(UG)\to G$ sends each generator $[g]$ to $g$. Let $G=\mathbb{Z}/6$ with addition. What is $\varepsilon_G$ of the word $[4][5][2][5]$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The counit evaluates the word in $G$, so the product of the generators becomes the sum $4+5+2+5=16$ in $\mathbb{Z}/6$. Since $16=2\cdot6+4$, the value is $4$.'
          - problem: 'Is the counit $\varepsilon_G\colon F(UG)\to G$ injective for every group $G$? It sends the different generators $[g]$ to different elements $g$.'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "injective", "yes it is"], ["no", "it is not injective", "not injective", "no it is not"]]}
            solution_sketch: 'The generator $[e]$ for the identity $e$ of $G$ is a nonidentity element of the free group, but $\varepsilon_G([e])=e$. So $\varepsilon_G$ has a nontrivial kernel and is not injective.'
          - problem: 'Write the full proof that the free functor $F$ from a category of algebras to $\mathbf{Set}$ is left adjoint to the forgetful functor $U$, and describe the unit and the counit of this adjunction.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1 (objects): F(X) is the algebra of formal expressions on the generator set X, and U(A) is the underlying set of an algebra A. Step 2 (extension): every function f from X to U(A) extends uniquely to the homomorphism f-hat from F(X) to A that evaluates a formal expression by reading f on the generators. Step 3 (bijection): the assignment f to f-hat and restriction back to the generators are inverse to each other, and both sides are natural in X and in A, so homomorphisms from F(X) to A are in bijection with functions from X to U(A); by definition this says F is left adjoint to U. Step 4 (unit): the component eta_X from X to U(F(X)) sends x to its one-generator expression; it is the universal insertion of generators, because a function f out of X is exactly the restriction of its extension f-hat. Step 5 (counit): the component eps_A from F(U(A)) to A is the evaluation of formal expressions; it is the unique homomorphism extending the identity function on U(A), and it is surjective, so A is a quotient of the free algebra on its own members. Step 6 (triangles): evaluating an inserted generator returns that generator, and a formal expression on the generators of F(X) evaluates to itself; these are the triangle identities. Conclusion: F is left adjoint to U, the unit is the insertion of generators, and the counit is the evaluation.'
      - id: kp2
        name: Free vector spaces
        key_prerequisites: [functor-examples]
        constraints: 'Free vector spaces are met through their dimension, linear maps fixed on a basis, the counit evaluated on a formal combination and its kernel, and one setting-up problem; no evaluation formula is supplied. One full-proof exemplar is kept.'
        exemplars:
          - problem: 'A recipe is recorded by the number of grams of each of $6$ ingredients it uses, so recipes form the free real vector space on the set of the $6$ ingredients. What is the dimension of this space?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The free vector space on a set has one basis vector for each element of the set. With $6$ ingredients, the basis has $6$ vectors, so the dimension is $6$.'
          - problem: 'Let $F\colon\mathbf{Set}\to\mathbf{Vect}_\mathbb{R}$ be left adjoint to the forgetful functor. A function $j\colon\{a,b\}\to\mathbb{R}^2$ sends $a$ to $(1,2)$ and $b$ to $(0,-3)$. Let $T\colon F(\{a,b\})\to\mathbb{R}^2$ be the unique linear map with $T(e_a)=j(a)$ and $T(e_b)=j(b)$. What is $T(2e_a+3e_b)$?'
            answer: '(2, -5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'A linear map is determined by its values on the basis, so by linearity $T(2e_a+3e_b)=2T(e_a)+3T(e_b)=2(1,2)+3(0,-3)$. This equals $(2,4)+(0,-9)=(2,-5)$.'
          - problem: 'The counit of $F\dashv U$ at a real vector space $V$ is the linear map $\varepsilon_V\colon F(UV)\to V$ with $\varepsilon_V(e_v)=v$. For $V=\mathbb{R}^2$, what is $\varepsilon_V\big(2e_{(1,1)}+3e_{(0,2)}\big)$?'
            answer: '(2, 8)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The counit is linear and sends each basis vector $e_v$ to $v$, so it sends $2e_{(1,1)}+3e_{(0,2)}$ to $2(1,1)+3(0,2)$. This equals $(2,2)+(0,6)=(2,8)$.'
          - problem: 'Over the field $\mathbb{F}_2$ with two elements, let $V$ be a vector space with $4$ vectors and let $X=\{1,2,3\}$. How many linear maps are there from the free vector space on $X$ to $V$?'
            answer: '64'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Linear maps from the free vector space on $X$ to $V$ correspond to functions from $X$ to the underlying set of $V$. Each of the $3$ elements of $X$ has $4$ possible images, so there are $4^3=64$ linear maps.'
          - problem: 'Let $v=(1,1)$ and $w=(2,2)$ in $\mathbb{R}^2$. The counit $\varepsilon_V\colon F(UV)\to V$ sends $e_v$ to $v$ and $e_w$ to $w$. Find integers $a,b$ with $a$ positive and as small as possible such that $a\,e_v+b\,e_w$ lies in the kernel of $\varepsilon_V$.'
            answer: '(2, -1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The element $a\,e_v+b\,e_w$ maps to $a(1,1)+b(2,2)=(a+2b,a+2b)$, which is zero exactly when $a+2b=0$. The value $a=1$ gives no integer $b$, and $a=2$ gives $b=-1$, so the pair is $(2,-1)$.'
          - problem: 'A drink is made from $x$ units of syrup and $y$ units of juice. One unit of syrup has the taste vector $(2,1)$ and one unit of juice has $(4,3)$, as (sweetness, acidity), and the taste of a mixture is linear in the amounts. Which amounts $(x,y)$ give the taste $(8,5)$?'
            answer: '(2, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The taste is $x(2,1)+y(4,3)=(2x+4y,x+3y)$, and we need $(8,5)$. From $x+3y=5$ we get $x=5-3y$, and then $2(5-3y)+4y=8$ gives $y=1$ and $x=2$.'
          - problem: 'Is the counit $\varepsilon_V\colon F(UV)\to V$ of the free vector space adjunction an isomorphism for every $V$? Every vector $v$ has the preimage $e_v$.'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is an isomorphism", "isomorphism", "yes it is"], ["no", "it is not an isomorphism", "not an isomorphism", "no it is not"]]}
            solution_sketch: 'The basis vector $e_0$ indexed by the zero vector is a nonzero vector of $F(UV)$, and $\varepsilon_V(e_0)=0$. So $\varepsilon_V$ has a nonzero kernel, and surjective does not mean injective. The counit is not an isomorphism for every $V$.'
          - problem: 'Write the full proof that the free vector space functor $X\mapsto k^{(X)}$ is left adjoint to the forgetful functor $U\colon\mathbf{Vect}_k\to\mathbf{Set}$, via a bijection $\mathrm{Hom}_{\mathbf{Vect}}(k^{(X)},V)\cong\mathrm{Hom}_{\mathbf{Set}}(X,U(V))$ natural in $X$ and $V$.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Define the free functor on objects: $\mathrm{Free}(X) = k^{(X)}$, the vector space of finitely supported functions $X \to k$, with basis $\{e_x : x \in X\}$, where $e_x$ is the function that is $1$ at $x$ and $0$ elsewhere; on a function $f\colon X \to Y$ it is the linear map with $e_x \mapsto e_{f(x)}$. Step 1 (the bijection): given a function $g\colon X \to U(V)$, define $g^{\#}\colon k^{(X)}\to V$ by linear extension, $g^{\#}\big(\sum_x \lambda_x e_x\big) = \sum_x \lambda_x g(x)$; this is the unique linear map with $g^{\#}(e_x) = g(x)$, because a linear map out of a free space is determined by its values on the basis. Step 2 (the inverse): given a linear map $T\colon k^{(X)}\to V$, send it to the function $x \mapsto T(e_x)$ in $\mathbf{Set}$; the two constructions undo each other, so $\mathrm{Hom}_{\mathbf{Vect}}(k^{(X)}, V) \cong \mathrm{Hom}_{\mathbf{Set}}(X, U(V))$. Step 3 (naturality): both constructions commute with precomposition in $X$ and postcomposition in $V$, since composition acts identically on both sides. Step 4 (conclusion): by the definition of adjunction via a natural hom-set bijection, Free $\dashv$ $U$, with unit $\eta_X\colon X \to U(k^{(X)})$ sending $x$ to the basis vector $e_x$.'
      - id: kp3
        name: A forgetful functor with adjoints on both sides
        key_prerequisites: [adjunctions]
        constraints: 'Left and right adjoints of forgetful functors are recovered from which maps are automatic: continuous maps out of a discrete space and into an indiscrete space, and functors out of a discrete category. Items ask for counts, a verdict or the side of the adjoint. One full-proof exemplar is kept.'
        exemplars:
          - problem: 'The forgetful functor $U\colon\mathbf{Top}\to\mathbf{Set}$ has a left adjoint $L$, so that every function $X\to UY$ gives a continuous map $LX\to Y$ for every space $Y$. For a set $X$ with $3$ elements, how many open sets does the space $LX$ have?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'To make every function $X\to UY$ continuous, including those into the Sierpinski space, every subset of $X$ must be open. So $LX$ is discrete, and it has $2^3=8$ open sets.'
          - problem: 'Give $\{0,1\}$ the indiscrete topology as the source and the discrete topology as the target. How many of the $4$ functions $\{0,1\}\to\{0,1\}$ are continuous?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A continuous map into a discrete space needs open preimages of $\{0\}$ and $\{1\}$, and in an indiscrete space only the empty set and the whole space are open. So only the $2$ constant functions are continuous, and the indiscrete topology does not give a left adjoint to $U$.'
          - problem: 'Let $X=\{0,1,2\}$ carry the topology with open sets $\varnothing$, $\{0\}$, $\{0,1\}$ and $X$. How many continuous maps are there from $X$ to the indiscrete space $\{p,q\}$?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Every function into an indiscrete space is continuous, because the preimage of an open set is either empty or all of $X$. There are $2^3=8$ functions from $X$ to $\{p,q\}$, so there are $8$ continuous maps.'
          - problem: 'A company has $4$ departments with no reporting relations between them, which is a discrete category. A staffing is a functor from this category to a category with $6$ job types as objects. How many staffings are there?'
            answer: '1296'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A functor out of a discrete category is fixed by the images of the objects, since there are no other arrows to preserve. Each of the $4$ departments gets one of $6$ job types, so there are $6^4=1296$ staffings.'
          - problem: 'A school has $k$ classes with no relations between them, which is a discrete category. A timetable is a functor from this category to a category of $5$ time slots as objects, and there are $125$ timetables. What is $k$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A functor out of a discrete category is a function on objects, so there are $5^k$ timetables. Since $5^3=125$, the number of classes is $k=3$.'
          - problem: 'The functor $\mathrm{Ob}$ also has a right adjoint $R$: every function $\mathrm{Ob}(\mathcal{C})\to S$ extends uniquely to a functor $\mathcal{C}\to R(S)$, for every category $\mathcal{C}$. For a set $S$ with $3$ elements, how many arrows does the category $R(S)$ have?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A functor into $R(S)$ is fixed by its function on objects, so every arrow of $\mathcal{C}$ must have exactly one possible image. This holds when $R(S)$ has exactly one arrow between each ordered pair of objects. There are $3\cdot3=9$ ordered pairs, so $R(S)$ has $9$ arrows.'
          - problem: 'The functor $\mathrm{Ob}\colon\mathbf{Cat}\to\mathbf{Set}$ sends a small category to its set of objects. It has a left adjoint $L$: every function $S\to\mathrm{Ob}(\mathcal{C})$ extends uniquely to a functor $L(S)\to\mathcal{C}$, for every category $\mathcal{C}$. For a set $S$ with $3$ elements, how many arrows does the category $L(S)$ have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A functor out of $L(S)$ is fixed by its values on objects, so $L(S)$ has no arrows besides the identities, since any other arrow would allow several extensions. So $L(S)$ is the discrete category, with one identity arrow for each of the $3$ elements, which gives $3$ arrows.'
          - problem: 'The functors $D,I\colon\mathbf{Set}\to\mathbf{Top}$ give a set the discrete and the indiscrete topology. Which of them is left adjoint to $U\colon\mathbf{Top}\to\mathbf{Set}$?'
            answer: 'discrete'
            answer_contract: {"kind":"label","options":[["discrete","the discrete one","D","discrete topology","the discrete topology","the functor D","D is left adjoint","the discrete functor"],["indiscrete","the indiscrete one","I","indiscrete topology","the indiscrete topology"]]}
            solution_sketch: 'Every function out of a discrete space is continuous, so maps $DX\to Y$ correspond to functions $X\to UY$. This is the hom-set bijection for $D\dashv U$, while the indiscrete functor is the right adjoint of $U$.'
          - problem: 'Write the full proof that the forgetful functor $U$ from topological spaces to sets has a left adjoint, the discrete construction, and a right adjoint, the indiscrete construction, with each adjunction justified by the maps that are automatically continuous.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1 (left adjoint construction): give disc(X) the topology in which every subset of X is open. Step 2 (automatic legality): any function f from disc(X) to a space Y is continuous, because the preimage of any open set of Y is a subset of X and is therefore open. Step 3 (bijection): continuous maps disc(X) to Y correspond exactly to functions X to U(Y), which is the hom-set bijection showing the discrete construction is left adjoint to U. Step 4 (right adjoint construction): give indisc(Y) the topology whose only open sets are the empty set and Y. Step 5 (automatic legality): any function g from a space X to indisc(Y) is continuous, because the preimage of an open set of indisc(Y) is empty or all of X, both open in X. Step 6 (bijection): continuous maps X to indisc(Y) correspond exactly to functions U(X) to Y, the hom-set bijection showing U is left adjoint to the indiscrete construction. Conclusion: U carries a left adjoint, the discrete construction, and a right adjoint, the indiscrete construction.'
    diagnostic_exemplar:
      problem: "Show that the forgetful functor $U\\colon\\mathbf{Top}\\to\\mathbf{Set}$ has both a left adjoint and a right adjoint, exhibiting the two hom-set bijections."
      answer: "Left adjoint: the discrete-space functor. Every function from a discrete space is continuous (all subsets are open in the source), so $\\mathrm{Hom}_{\\mathbf{Top}}(X_{\\mathrm{disc}},Y)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UY)$, natural in both variables: $\\mathrm{disc}\\dashv U$. Right adjoint: the indiscrete-space functor. Every function into an indiscrete space is continuous (only $\\varnothing$ and the whole set are open in the target), so $\\mathrm{Hom}_{\\mathbf{Top}}(X,Y_{\\mathrm{ind}})\\cong\\mathrm{Hom}_{\\mathbf{Set}}(UX,Y)$: $U\\dashv\\mathrm{ind}$."
      solution_sketch: "Ask on which side continuity comes for free. Every map out of a discrete space is continuous, giving $\\mathrm{disc}\\dashv U$; every map into an indiscrete space is continuous, giving $U\\dashv\\mathrm{ind}$. Each observation is itself the hom-set bijection."
    anki_seeds:
      - front: "Free-forgetful adjunction pattern?"
        back: "Free $\\dashv$ Forgetful: $\\mathrm{Hom}_{\\mathcal A}(FX,A)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UA)$; unit inserts generators."
        type: basic
      - front: "The free vector space on a set $X$ is {{c1::$k^{(X)}$, with basis $X$}}."
        back: "$k^{(X)}$, with basis $X$"
        type: cloze

  - id: galois-connections
    name: Galois Connections
    core: false
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: partial-orders
        weight: 0.4
        key: true
      - id: unit-counit
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: A Galois connection is an adjunction of posets
        key_prerequisites: [partial-orders]
        constraints: 'Right adjoints of monotone maps between small chains, subset posets and number chains are computed from the biconditional; word problems give a floor and a ceiling pair. Two verdicts name their deciding pair. One full-proof exemplar is kept.'
        try_first:
          problem: 'What is the largest whole number $n$ with $3n\le20$?'
          answer_contract: {"kind":"exact"}
          answer: '6'
          reveal: 'The largest such $n$ is $6$, because $3\cdot6=18\le20$ but $3\cdot7=21>20$. This is the value of the right adjoint of $n\mapsto3n$ at $20$, the greatest $n$ with $3n\le20$.'
        exemplars:
          - problem: 'On $(\mathbb{N},\le)$ the monotone map $f(n)=3n$ has a right adjoint $g$, with $3n\le m$ if and only if $n\le g(m)$ for all $n,m$. What is $g(10)$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The condition $n\le g(m)$ must hold exactly for the $n$ with $3n\le m$, so $g(m)$ is the greatest such $n$. For $m=10$ we need $3n\le10$, and the greatest such $n$ is $3$.'
          - problem: 'Let $P=Q=\{0,1,2\}$ be chains with $0<1<2$, and let $f\colon P\to Q$ be the monotone map with $f(0)=0$, $f(1)=0$ and $f(2)=1$. It has a right adjoint $g$. What is $g(0)$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The value $g(q)$ is the greatest $p$ with $f(p)\le q$. For $q=0$ we have $f(0)=0\le0$ and $f(1)=0\le0$, but $f(2)=1\not\le0$, so $g(0)=1$.'
          - problem: 'Let $P=Q=\{0,1,2\}$ be chains with $0<1<2$, and let $f\colon P\to Q$ be the monotone map with $f(0)=0$, $f(1)=0$ and $f(2)=2$. It has a right adjoint $g$. What are $g(0)$, $g(1)$ and $g(2)$?'
            answer: '1, 1, 2'
            answer_contract: {"kind":"list","ordered":true,"member":{"kind":"exact"}}
            solution_sketch: 'The value $g(q)$ is the greatest $p$ with $f(p)\le q$. For $q=0$ and $q=1$ only $p=0$ and $p=1$ qualify, since $f(2)=2$, so $g(0)=g(1)=1$. For $q=2$ every $p$ qualifies, so $g(2)=2$.'
          - problem: 'The function $h\colon\{1,2,3,4\}\to\{a,b\}$ sends $1$ and $2$ to $a$ and sends $3$ and $4$ to $b$. On subsets, the image map is left adjoint to the preimage map. How many subsets $S$ of $\{1,2,3,4\}$ satisfy $h(S)\subseteq\{a\}$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'By the adjunction, $h(S)\subseteq\{a\}$ holds exactly when $S\subseteq h^{-1}(\{a\})=\{1,2\}$. A set with $2$ elements has $4$ subsets, so there are $4$ such sets $S$.'
          - problem: 'A minibus seats $5$ people. For a group of $m$ people, let $g(m)$ be the number of minibuses that the group fills completely. For how many group sizes $m$ is $g(m)=6$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The group fills $n$ minibuses completely exactly when $5n\le m$, so $g(m)$ is the greatest such $n$. Then $g(m)=6$ means $5\cdot6=30\le m$ and $5\cdot7=35>m$. This gives the $5$ sizes $30,31,32,33,34$.'
          - problem: 'Each minibus seats $4$ people. A group is seated in the fewest possible minibuses, and this takes exactly $7$ minibuses. What is the largest possible size of the group?'
            answer: '28'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The fewest minibuses that seat $m$ people is the least $n$ with $m\le4n$. This equals $7$ exactly when $4\cdot6=24<m\le4\cdot7=28$, so the largest possible group has $28$ people.'
          - problem: 'Let $P=Q=\{0,1,2\}$ be chains with $0<1<2$, with $f(0)=0$, $f(1)=1$, $f(2)=1$ and $g(0)=0$, $g(1)=2$, $g(2)=2$. Is $f(p)\le q$ equivalent to $p\le g(q)$ for all $p,q$, so that $f$ and $g$ form a Galois connection?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","yes, it is","it is","it is a Galois connection"],["no","no, it is not","it is not","not a Galois connection"]]}
            solution_sketch: 'For $q=0$ the $p$ with $f(p)\le0$ are $\{0\}$, which is $p\le g(0)=0$. For $q=1$ and $q=2$ every $p$ has $f(p)\le q$, which is $p\le g(q)=2$, so the equivalence holds for all pairs.'
          - problem: 'Let $f\colon\{0,1,2\}\to\{0,1,2\}$ be the monotone map between chains with $f(0)=1$, $f(1)=1$ and $f(2)=2$. Does $f$ have a right adjoint?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["yes","yes, it does","it does","it has one"],["no","no, it does not","it does not","it has none"]]}
            solution_sketch: 'A right adjoint would need $g(0)$ to be the greatest $p$ with $f(p)\le0$. Every $p$ has $f(p)\ge1$, so no $p$ qualifies, no value $g(0)$ exists, and there is no right adjoint.'
          - problem: 'Write the full proof that for a function $h$ from a set $X$ to a set $Y$ the image map is left adjoint to the preimage map between the powersets of $X$ and $Y$ ordered by inclusion.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1: define the maps. The image map sends a subset S of X to the set of all h(s) with s in S, and the preimage map sends a subset T of Y to the set of all x in X with h(x) in T. Both are monotone for inclusion, because a larger set has a larger image and a larger preimage. Step 2: one direction. Assume the image of S is contained in T, and take s in S. Then h(s) is in the image of S, hence in T, so s is in the preimage of T. Thus S is contained in the preimage of T. Step 3: the converse. Assume S is contained in the preimage of T, and take y in the image of S. Then y = h(s) for some s in S, and s lies in the preimage of T, so h(s) = y lies in T. Thus the image of S is contained in T. Step 4: conclusion. The two directions give the biconditional, which is exactly the hom-set bijection of an adjunction between the poset categories; each hom-set has at most one element, so naturality is automatic. Therefore the image map is left adjoint to the preimage map.'
      - id: kp2
        name: Closure operators from the round trip
        key_prerequisites: [adjunctions]
        constraints: 'The round trip gf of a poset adjunction is evaluated on chains, rounding problems and subset posets, and its fixed points are counted; closure operators on a chain are counted. The proof step that needs the monotone map g is asked as a choice. One full-proof exemplar is kept.'
        exemplars:
          - problem: 'Let $P=\{0,1,2,3,4,5\}$ and $Q=\{0,1,2\}$ be chains, and let $f\colon P\to Q$ be the monotone map with values $0,0,1,1,2,2$ at $0,1,2,3,4,5$. It has a right adjoint $g$. What is $c(4)$ for the round trip $c=g\circ f$?'
            answer: '5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right adjoint is $g(q)=\max\{p:f(p)\le q\}$, so $g(0)=1$, $g(1)=3$ and $g(2)=5$. Then $f(4)=2$ and $c(4)=g(2)=5$.'
          - problem: 'Let $P=\{0,1,\dots,7\}$ and $Q=\{0,1,2,3\}$ be chains and let $f(p)=\lfloor p/2\rfloor$, which has a right adjoint $g$. How many elements of $P$ are fixed by the round trip $c=g\circ f$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $g(q)=\max\{p:\lfloor p/2\rfloor\le q\}=2q+1$, so $c(p)=2\lfloor p/2\rfloor+1$. This equals $p$ exactly for the odd numbers $1,3,5,7$, so there are $4$ fixed elements.'
          - problem: 'A shop rounds every bill up to a whole multiple of $5$ euros. Write $f(x)=\lceil x/5\rceil$ for the number of $5$-euro notes needed for a bill of $x$ euros and $g(n)=5n$ for the value of $n$ notes, so that $f(x)\le n$ exactly when $x\le g(n)$. What does a bill of $23$ euros become after the round trip $g\circ f$?'
            answer: '25'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The number of notes is $f(23)=\lceil23/5\rceil=5$. Then $g(5)=5\cdot5=25$, so the bill of $23$ euros is rounded up to $25$ euros.'
          - problem: 'In the same shop the bills are the whole numbers of euros from $1$ to $50$. For how many bills does the rounding $c=g\circ f$ leave the bill unchanged?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A bill is unchanged exactly when it is already a multiple of $5$. The multiples of $5$ from $1$ to $50$ are $5,10,\dots,50$, and there are $50/5=10$ of them.'
          - problem: 'Let $P$ be the set of subsets of $\{1,2,3,4\}$ ordered by inclusion, and let $f(S)=S\cap\{4\}$ be a monotone map to the subsets of $\{4\}$. It has a right adjoint $g$. How many subsets $S$ are fixed by the round trip $c=g\circ f$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The right adjoint is $g(T)=T\cup\{1,2,3\}$, because $S\cap\{4\}\subseteq T$ exactly when $S\subseteq T\cup\{1,2,3\}$. So $c(S)=(S\cap\{4\})\cup\{1,2,3\}$, and the fixed sets are $\{1,2,3\}$ and $\{1,2,3,4\}$, which is $2$ sets.'
          - problem: 'How many closure operators $c$ on the chain $0<1<2<3$ satisfy $c(0)=1$ and $c(3)=3$? A closure operator is monotone, inflationary and idempotent.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Monotonicity gives $c(1)\ge c(0)=1$ and idempotence gives $c(1)=c(c(0))=c(0)=1$. Then $c(2)$ must be $2$ or $3$ because $c$ is inflationary, and both choices are monotone and idempotent, so there are $2$ closure operators.'
          - problem: 'For $f\dashv g$ and $c=g\circ f$, one proves $c(c(p))\le c(p)$ from the counit inequality $fg(f(p))\le f(p)$ in $Q$. Which monotone map is applied to this inequality?'
            answer: 'g'
            answer_contract: {"kind":"label","options":[["g","apply g","the map g","the right adjoint","apply the map g","g is applied","the map g is applied"],["f","apply f","the map f","the left adjoint"]]}
            solution_sketch: 'The counit inequality lives in $Q$, and we need an inequality in $P$. Applying $g\colon Q\to P$ gives $gfgf(p)\le gf(p)$, which is $c(c(p))\le c(p)$.'
          - problem: 'Write the full proof that for a Galois connection $f\dashv g$ between posets, with unit $p\le gf(p)$ and counit $fg(q)\le q$, the round trip $c=gf$ is a closure operator, that is, monotone, inflationary and idempotent.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Full object: c = gf is the round trip on P, and a closure operator is monotone, inflationary and idempotent; we verify the three properties in that order, using only the unit, the counit and monotonicity. Step 1 (monotone): f and g are monotone, and a composite of monotone maps is monotone, so c is monotone. Step 2 (inflationary): the unit of the connection at p reads p <= gf(p) = c(p), so c is inflationary. Step 3 (idempotent): the unit at the element c(p) gives c(p) <= c(c(p)); for the reverse inequality, the counit at the element f(p) of the other poset reads fg(f(p)) <= f(p), and applying the monotone map g to both sides yields gf(gf(p)) <= gf(p), that is, c(c(p)) <= c(p); the equality c(c(p)) = c(p) is then obtained by antisymmetry from the two inequalities. Conclusion: c is monotone, inflationary and idempotent, so c is a closure operator; dually, fg is an interior operator.'
    diagnostic_exemplar:
      problem: "Let $f\\dashv g$ be a monotone Galois connection between posets ($f(p)\\le q\\iff p\\le g(q)$). Prove that $c=g\\circ f$ is a closure operator: monotone, inflationary, and idempotent."
      answer: "Monotone: composite of monotone maps. Inflationary: from $f(p)\\le f(p)$ the biconditional gives $p\\le gf(p)=c(p)$ (the unit). Idempotent: $c(p)\\le c(c(p))$ by the unit; for the reverse, the counit $fg(q)\\le q$ at $q=f(p)$ gives $fgf(p)\\le f(p)$, and applying the monotone $g$ yields $c(c(p))=gfgf(p)\\le gf(p)=c(p)$. By antisymmetry $c(c(p))=c(p)$."
      solution_sketch: "Monotonicity is inherited from the two maps. Inflationary is the unit, obtained by feeding $f(p)\\le f(p)$ into the biconditional; for idempotence use the counit $fg(q)\\le q$ at $q=f(p)$, apply the monotone $g$, and close with antisymmetry."
    anki_seeds:
      - front: "A Galois connection is an adjunction between..."
        back: "posets (thin categories): monotone $f,g$ with $f(p)\\le q\\iff p\\le g(q)$."
        type: basic
      - front: "For a Galois connection $f\\dashv g$, the composite $g\\circ f$ is a {{c1::closure operator}}."
        back: "closure operator"
        type: cloze

  - id: reflective-subcategories
    name: Reflective Subcategories
    core: false                # terminal adjunction application
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 270
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: unit-counit
        weight: 0.4
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: triangle-identities
        weight: 0.3
      - id: subcategories
        weight: 0.2
      - id: first-isomorphism-theorem
        weight: 0.2
      # Phase C reconciliation: kp3 proves Ab reflective in Grp with reflector
      # $G \mapsto G/[G,G]$ — "$f$ kills commutators" and the unique factorisation
      # through the quotient are commutator-subgroup kp3 (the UMP of abelianization).
      - id: commutator-subgroup
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Definition and the universal property of the reflection
        key_prerequisites: [adjunctions]
        constraints: 'Reflectors of full subcategories of chains, divisibility posets and groups are computed from the universal property; word problems round up to a multiple, and a verdict names the object with no least target. One full-proof exemplar is kept.'
        try_first:
          problem: 'What is the smallest multiple of $5$ that is at least $12$?'
          answer_contract: {"kind":"exact"}
          answer: '15'
          reveal: 'It is $15$, the nearest multiple of $5$ above $12$. A reflection assigns to each object the best approximation from inside the subcategory, here the least multiple of $5$ that lies above it.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the chain $1<2<3<4$, with one arrow $x\to y$ when $x\le y$, and let $\mathcal{D}$ be its full subcategory on the objects $1,2,4$. The inclusion $\mathcal{D}\to\mathcal{C}$ has a left adjoint $L$. What is $L(3)$?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reflector $L$ sends $x$ to the least object of $\mathcal{D}$ that has an arrow from $x$. The objects of $\mathcal{D}$ above $3$ are just $4$, because $1$ and $2$ lie below $3$. So $L(3)=4$.'
          - problem: 'Let $\mathcal{C}$ be the poset of positive divisors of $12$, with an arrow $x\to y$ when $x$ divides $y$, and let $\mathcal{D}$ be its full subcategory on $1,2,6,12$. The inclusion $\mathcal{D}\to\mathcal{C}$ has a left adjoint $L$. What is $L(4)$?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reflector sends $x$ to the least object of $\mathcal{D}$ that $x$ divides. The object $4$ divides $12$ and divides none of $1$, $2$ and $6$, so $L(4)=12$.'
          - problem: 'A shop rounds every price up to the next multiple of $10$ cents. Prices form the chain of whole numbers with one arrow $x\to y$ when $x\le y$, and the multiples of $10$ form a full subcategory $\mathcal{D}$ whose inclusion has a left adjoint $L$. What is $L(137)$?'
            answer: '140'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reflector sends a price to the least multiple of $10$ that is at least that price. Since $130<137\le140$, we get $L(137)=140$.'
          - problem: 'A supplier ships boxes only in whole pallets of $12$ boxes. Orders form the chain of whole numbers with one arrow $x\to y$ when $x\le y$, and the multiples of $12$ form a full subcategory whose inclusion has a left adjoint $L$. How many boxes are shipped for an order of $85$ boxes, that is, what is $L(85)$?'
            answer: '96'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reflector sends an order to the least multiple of $12$ that is at least the order. Since $7\cdot12=84<85$ and $8\cdot12=96\ge85$, we get $L(85)=96$.'
          - problem: 'The quaternion group $Q_8$ has the presentation $\langle r,s\mid r^4=1,\ s^2=r^2,\ srs^{-1}=r^{-1}\rangle$. Its reflection into abelian groups is a quotient of the free abelian group on $r,s$. What are the invariant factors of the reflection of $Q_8$?'
            answer: '2, 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Written additively, the relations are $4r=0$, $2s=2r$ and $2r=0$, the last from $srs^{-1}=r^{-1}$. So $2r=0$ and $2s=0$, and the reflection is $\mathbb{Z}/2\times\mathbb{Z}/2$, whose invariant factors are $2$ and $2$.'
          - problem: 'Let $G=\mathbb{Z}/4\times S_3$, where $S_3=\langle r,s\mid r^3=1,\ s^2=1,\ srs=r^{-1}\rangle$. What are the invariant factors of the reflection of $G$ into abelian groups?'
            answer: '2, 4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reflection of a product is the product of the reflections, so it is $\mathbb{Z}/4\times S_3^{\mathrm{ab}}$. Written additively, $S_3$ has the relations $3r=0$, $2s=0$ and $2r=0$, so $r=3r-2r=0$ and $S_3^{\mathrm{ab}}=\mathbb{Z}/2$. The reflection is $\mathbb{Z}/2\times\mathbb{Z}/4$, with invariant factors $2$ and $4$.'
          - problem: 'The dihedral group $D_5$ has the presentation $\langle r,s\mid r^5=1,\ s^2=1,\ srs=r^{-1}\rangle$. How many elements does its reflection into abelian groups have?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Written additively, the relations are $5r=0$, $2s=0$ and $2r=0$, the last from $srs=r^{-1}$. Then $r=5r-2\cdot2r=0$, so only $s$ survives, and the quotient $\mathbb{Z}/2$ has $2$ elements.'
          - problem: 'Let $\mathcal{C}$ be the poset with $0<a<1$ and $0<b<1$, where $a$ and $b$ are incomparable, and let $\mathcal{D}$ be the full subcategory on $\{a,b,1\}$. Does the inclusion of $\mathcal{D}$ into $\mathcal{C}$ have a left adjoint?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","no, it does not","it does not","it has none"],["yes","yes, it does","it does","it has one"]]}
            solution_sketch: 'A left adjoint would send $0$ to a least object of $\mathcal{D}$ above $0$. The objects $a$ and $b$ are both above $0$ and neither lies below the other, so no least object exists and there is no left adjoint.'
          - problem: 'Let $\mathcal{C}$ be the poset with $0<a<1$ and $0<b<1$, where $a$ and $b$ are incomparable, and let $\mathcal{D}$ be the full subcategory on $\{0,a,1\}$. The inclusion of $\mathcal{D}$ into $\mathcal{C}$ has a left adjoint $L$. What is $L(b)$?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reflector sends $b$ to the least object of $\mathcal{D}$ that lies above $b$. The only object of $\mathcal{D}$ above $b$ is $1$, because $0$ and $a$ do not lie above $b$, so $L(b)=1$.'
          - problem: 'Write the full proof that if every object $x$ of a poset $C$ has a least element of the full subcategory $D$ above it, then sending $x$ to that element is a left adjoint to the inclusion $D\to C$, and the unit satisfies the universal property.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1 (the adjunction): let i be the inclusion of D in C, and define the reflector L from C to D by sending each object x to the least object of D above x; L is the left adjoint. Step 2 (the unit): the unit at x is the unique arrow from x to L(x), which exists because x is at most its least upper bound. Step 3 (the universal property): an arrow from x to an object d of D is the statement that x is at most d; since L(x) is the least such object, arrows from x to d coincide with arrows from L(x) to d, so every arrow f from x to i(d) equals i(g) after the unit for a unique g from L(x) to d, unique because a poset has at most one arrow between two objects. Step 4 (conclusion): the bijection is natural since every hom set has at most one element, so L is left adjoint to i, D is reflective, and the unit is universal from each x to i.'
      - id: kp2
        name: The counit of a reflection is an isomorphism
        key_prerequisites: [triangle-identities]
        constraints: 'The counit of a reflection is tested through its kernel on abelian groups, rounding problems, counting of arrows through a fully faithful functor, and an example where fullness fails; one item asks which hypothesis cancels the functor. One full-proof exemplar is kept.'
        exemplars:
          - problem: 'Let $L\colon\mathbf{Grp}\to\mathbf{Ab}$ be abelianization, left adjoint to the inclusion $i\colon\mathbf{Ab}\to\mathbf{Grp}$, which is fully faithful. For the abelian group $A=\mathbb{Z}/6$, how many elements does the kernel of the counit $\varepsilon_A\colon L(iA)\to A$ have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The counit of a reflection is an isomorphism at every object of the subcategory, and here $A$ is abelian. So $\varepsilon_A$ is injective and its kernel has just $1$ element, the identity.'
          - problem: 'A shop rounds prices up to the next multiple of $10$ cents; rounding is the reflector $L$ for the multiples of $10$ inside the chain of whole numbers. A price is rounded, and then the rounded price is rounded again. If the first rounding gives $130$, what does the second rounding give?'
            answer: '130'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The rounded price $130$ is an object of the subcategory, where the counit of the reflection is an isomorphism. So rounding it again changes nothing, and the second rounding gives $130$.'
          - problem: 'Let $\mathcal{D}$ be the chain $0<1$, let $F\colon\mathbf{1}\to\mathcal{D}$ select $0$, and let $i\colon\mathcal{D}\to\mathbf{1}$ be the functor to the one-object category $\mathbf{1}$. Then $F$ is left adjoint to $i$, and $i$ is faithful but not full. Is the counit $\varepsilon_1\colon F(i(1))\to1$, which is the arrow $0\to1$ of $\mathcal{D}$, an isomorphism?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","no, it is not","it is not","not an isomorphism"],["yes","yes, it is","it is","an isomorphism"]]}
            solution_sketch: 'The arrow $0\to1$ has no inverse in the chain, since there is no arrow $1\to0$. So the counit at $1$ is not an isomorphism, which shows that fullness of $i$ cannot be dropped.'
          - problem: 'The category $\mathcal{D}$ has two objects $0$ and $1$. The object $0$ is a zero object, so $\mathrm{End}(0)=\{\mathrm{id}_0\}$, and there is exactly one arrow from $0$ to $1$ and one from $1$ to $0$. The endomorphisms of $1$ are $\mathrm{id}_1$ and the composite $z$ of the two zero arrows, with $z\ne\mathrm{id}_1$. The functor $F\colon\mathbf{1}\to\mathcal{D}$ selects $0$, and $i\colon\mathcal{D}\to\mathbf{1}$ is the functor to the one-object category. Then $F$ is left adjoint to $i$. For how many of the two objects $d$ of $\mathcal{D}$ is the counit $\varepsilon_d\colon F(i(d))\to d$ an isomorphism?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $F(i(d))=0$ for both objects, so $\varepsilon_d$ is the unique arrow $0\to d$. For $d=0$ it is $\mathrm{id}_0$, an isomorphism. For $d=1$ it is the zero arrow $0\to1$, and its only candidate inverse is the zero arrow $1\to0$, whose composite on $1$ is $z\ne\mathrm{id}_1$. So the counit is an isomorphism at exactly $1$ object.'
          - problem: 'Let $L\dashv i$ with $i\colon\mathcal{D}\to\mathcal{C}$ fully faithful. For an object $d$ of $\mathcal{D}$ there are exactly $7$ morphisms $i(d)\to iLi(d)$ in $\mathcal{C}$. How many morphisms $d\to Li(d)$ are there in $\mathcal{D}$?'
            answer: '7'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A fully faithful functor is a bijection on each hom-set. So the morphisms $d\to Li(d)$ in $\mathcal{D}$ correspond one to one to the morphisms $i(d)\to iLi(d)$ in $\mathcal{C}$, which gives $7$.'
          - problem: 'A shop rounds prices up to the next multiple of $10$ cents. The prices are the whole numbers $1,2,\dots,100$. For how many of these prices does rounding leave the price unchanged?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Rounding leaves a price unchanged exactly when it is already a multiple of $10$, that is, an object of the subcategory. The multiples of $10$ in $1,\dots,100$ are $10,20,\dots,100$, so there are $100/10=10$ such prices.'
          - problem: 'You know that $i(\varepsilon_d\circ k)=i(1_d)$ and want to conclude $\varepsilon_d\circ k=1_d$. Which property of $i$ lets you cancel $i$ from this equation?'
            answer: 'faithfulness'
            answer_contract: {"kind":"label","options":[["faithfulness","faithful","i is faithful","i faithful"],["fullness","full","i is full","i full"]]}
            solution_sketch: 'Cancelling $i$ from an equation $i(u)=i(v)$ needs $i$ to be injective on hom-sets, which is faithfulness. Fullness is used earlier, to find the morphism $k$ with $i(k)$ equal to the unit.'
          - problem: 'Write the full proof that if $L$ is left adjoint to a fully faithful functor $i\colon D\to C$, then the counit $\varepsilon\colon Li\Rightarrow1_D$ is a natural isomorphism.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1 (fullness produces the comparison map): for each object A of D, the unit component eta_iA: iA -> iLiA lies in the image of i on hom-sets, so fullness gives a morphism k_A: A -> LiA with i(k_A) = eta_iA, unique by faithfulness. Step 2 (faithfulness gives one equation): the second triangle identity gives i(eps_A) o eta_iA = 1_iA, hence i(eps_A o k_A) = i(1_A), and faithfulness yields eps_A o k_A = 1_A. Step 3 (naturality of the counit): applying naturality of eps to the morphism k_A: A -> LiA gives k_A o eps_A = eps_LiA o Li(k_A). Step 4 (first triangle identity gives the other equation): from i(k_A) = eta_iA we get Li(k_A) = L(eta_iA), and the first triangle identity at the object iA reads eps_LiA o L(eta_iA) = 1_LiA, so Step 3 gives k_A o eps_A = 1_LiA. Step 5 (conclusion): the two equations eps_A o k_A = 1_A and k_A o eps_A = 1_LiA show each component eps_A is an isomorphism with inverse k_A; eps is natural by assumption, so eps: Li -> 1_D is a natural isomorphism.'
      - id: kp3
        name: Examples and the induced idempotent monad
        key_prerequisites: [full-faithful-functors, commutator-subgroup]
        constraints: 'Reflections into abelian groups and posets are computed through the order of the reflected group, the kernel of the unit and the number of classes; rounding problems carry the induced idempotent monad T=iL; one item gives a universal factorization and one a verdict on the unit. One full-proof exemplar is kept.'
        exemplars:
          - problem: 'The dihedral group $D_4$ of the square has the presentation $\langle r,s\mid r^4=1,\ s^2=1,\ srs=r^{-1}\rangle$. The abelian groups form a full subcategory of $\mathbf{Grp}$ with a reflector. How many elements does the reflection of $D_4$ have?'
            answer: '4'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Written additively, the relations are $4r=0$, $2s=0$ and $2r=0$, the last from $srs=r^{-1}$. The quotient is $\mathbb{Z}/2\times\mathbb{Z}/2$, which has $4$ elements; equivalently $8/2=4$, since the commutator subgroup has $2$ elements.'
          - problem: 'For $S_3=\langle r,s\mid r^3=1,\ s^2=1,\ srs=r^{-1}\rangle$, the unit of the reflection into abelian groups is a homomorphism $\eta\colon S_3\to L(S_3)$. How many elements does its kernel have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The unit is the quotient map onto $S_3/[S_3,S_3]$, so its kernel is the commutator subgroup. For $S_3$ this is the subgroup generated by $r$, which has $3$ elements, so the quotient has $6/3=2$ elements.'
          - problem: 'A preorder on $\{0,1,2,3\}$ is generated by $0\le1$, $1\le0$, $1\le2$ and $2\le1$, together with reflexivity and transitivity. Posets form a full subcategory of preorders with a reflector. How many elements does the reflection of this preorder have?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The reflection identifies elements that lie below each other. Here $0$, $1$ and $2$ are all equivalent, and $3$ is related to nothing else, so there are $2$ classes.'
          - problem: 'A supplier ships boxes only in whole pallets of $12$ boxes. Rounding an order up to a whole number of pallets is the monad $T=iL$ on the chain of whole numbers. If an order of $30$ boxes is rounded twice, how many boxes does the result contain?'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The first rounding gives $T(30)=36$, since $2\cdot12=24<30\le36=3\cdot12$. Then $T(36)=36$, because $36$ is already a multiple of $12$, which is why the monad is idempotent.'
          - problem: 'Orders of $1,2,\dots,100$ boxes are rounded up to whole pallets of $12$ boxes. How many different shipment sizes occur?'
            answer: '9'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The shipment for an order $x$ is $12\lceil x/12\rceil$. The largest order $100$ needs $\lceil100/12\rceil=9$ pallets, so the sizes $12,24,\dots,108$ occur, which is $9$ different values.'
          - problem: 'Let $P$ be the preorder on $\{0,1,2\}$ generated by $0\le1$, $1\le0$ and $1\le2$. Let $q\colon P\to LP$ be the unit of the reflection into posets, where the two classes of $LP$ are named by their least members, $0$ and $2$. The monotone map $f\colon P\to\{0<1\}$ has values $f(0)=0$, $f(1)=0$ and $f(2)=1$. The unique $h$ with $f=h\circ q$ has which values $(h(0),h(2))$?'
            answer: '(0, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The classes of $LP$ are $\{0,1\}$ and $\{2\}$, named $0$ and $2$. Since $h\circ q=f$, we get $h(0)=f(0)=0$ and $h(2)=f(2)=1$, so the pair is $(0,1)$.'
          - problem: 'Let $q\colon P\to LP$ be the unit of the reflection of preorders into posets. Take the preorder on $\{0,1\}$ with $0\le1$ and $1\le0$. Is $q$ injective?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is injective", "injective", "yes it is"], ["no", "it is not injective", "not injective", "no it is not"]]}
            solution_sketch: 'In this preorder $0$ and $1$ are equivalent, so the reflection has just $1$ element and $q$ sends both $0$ and $1$ to it. So $q$ is not injective.'
          - problem: 'Write the full proof that posets form a reflective subcategory of preorders and that the reflection induces an idempotent monad.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1, fullness: a monotone map between posets is exactly a morphism of preorders, so the posets form a full subcategory. Step 2, the reflector: for a preorder $P$, declare $x$ equivalent to $y$ when $x \le y$ and $y \le x$; the classes form a poset $P/\sim$ with $[x] \le [y]$ iff $x \le y$, which is well defined and antisymmetric. Step 3, universal property: a monotone $f$ from $P$ to a poset $Q$ sends equivalent elements to equal values, since $f(x) \le f(y) \le f(x)$ and antisymmetry force equality, so $f$ equals $h$ after the quotient map $q$ for a unique monotone $h$, naturally in $Q$. Step 4, adjunction: the natural bijection makes the class construction a left adjoint to the inclusion, with unit $q$. Step 5, idempotent monad: the induced monad $T$ is the class construction followed by inclusion, and its multiplication is the counit under inclusion; the counit at each poset is an isomorphism because a poset is its own reflection, so the multiplication is invertible, $T^2 \cong T$, and the monad is idempotent.'
    diagnostic_exemplar:
      problem: "Show that $\\mathbf{Ab}$ is a reflective subcategory of $\\mathbf{Grp}$, identifying the reflector and its unit."
      answer: "$\\mathbf{Ab}$ is full in $\\mathbf{Grp}$: every homomorphism between abelian groups is kept. The reflector is abelianization $G\\mapsto G^{\\mathrm{ab}}=G/[G,G]$: for abelian $A$, any homomorphism $f\\colon G\\to A$ kills commutators ($f(xyx^{-1}y^{-1})=f(x)f(y)f(x)^{-1}f(y)^{-1}=e$ since $A$ is abelian), so $f$ factors uniquely through the quotient map $\\eta_G\\colon G\\to G^{\\mathrm{ab}}$. This gives a natural bijection $\\mathrm{Hom}_{\\mathbf{Ab}}(G^{\\mathrm{ab}},A)\\cong\\mathrm{Hom}_{\\mathbf{Grp}}(G,A)$, i.e. abelianization is left adjoint to the inclusion, with unit $\\eta_G$."
      solution_sketch: "The reflector must kill exactly what obstructs a map into an abelian group, namely the commutators. Show any $f\\colon G\\to A$ with $A$ abelian vanishes on commutators, hence factors uniquely through $G/[G,G]$; that unique factorization is the adjunction bijection, with the quotient map as unit."
    anki_seeds:
      - front: "A reflective subcategory is..."
        back: "a full subcategory whose inclusion has a left adjoint (the reflector)."
        type: basic
      - front: "For an adjunction $L\\dashv i$ with $i$ fully faithful, the counit $\\varepsilon$ is..."
        back: "a natural isomorphism."
        type: basic
      - front: "The reflector of $\\mathbf{Ab}\\subseteq\\mathbf{Grp}$ is {{c1::abelianization $G\\mapsto G/[G,G]$}}."
        back: "abelianization $G\\mapsto G/[G,G]$"
        type: cloze

  - id: adjoints-preserve-limits
    name: Adjoints Preserve (Co)Limits
    core: false                # stated theorem (RAPL); terminal
    difficulty: 0.82
    drill: false
    answer_kind: proof
    expected_time_secs: 300
    prerequisites:
      - id: adjunctions
        weight: 0.5
        key: true
      - id: limits-colimits
        weight: 0.5
        key: true
      - id: preservation-reflection-of-limits
        weight: 0.4
        key: true
      - id: unit-counit
        weight: 0.2
      - id: hom-functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Hom-functors preserve limits
        key_prerequisites: [limits-colimits]
        constraints: 'Hom-sets out of a product or a coproduct are counted in small Set and category settings, in word problems that need multiplication and division; one item gives the unique map into a product; one asks whether the coproduct becomes a product or a coproduct of hom-sets. One full-proof exemplar is kept.'
        try_first:
          problem: 'How many functions are there from a $3$-element set $A$ to the product $X\times Y$, where $X$ has $2$ elements and $Y$ has $4$ elements?'
          answer_contract: {"kind":"exact"}
          answer: '512'
          reveal: 'There are $8^3=512$ functions, which is also $2^3\cdot4^3=8\cdot64$, the number of pairs of a function $A\to X$ and a function $A\to Y$. A map into a product is the same thing as a pair of maps into the factors.'
        exemplars:
          - problem: 'In a category $\mathcal{C}$ with products, let $P=X\times Y\times Z$. There are $2$ morphisms $A\to X$, $3$ morphisms $A\to Y$ and $5$ morphisms $A\to Z$. How many morphisms $A\to P$ are there?'
            answer: '30'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A morphism into a product is the same as a triple of morphisms into the factors, by the universal property. So there are $2\cdot3\cdot5=30$ morphisms $A\to P$.'
          - problem: 'In a category $\mathcal{C}$ with products, $P$ is a product of $X$, $Y$ and $Z$. The sets $\mathrm{Hom}(A,X)$, $\mathrm{Hom}(A,Y)$ and $\mathrm{Hom}(A,Z)$ are finite and have $r$, $s$ and $t$ elements. How many morphisms $A\to P$ are there?'
            answer: 'r*s*t'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A morphism into a product is the same as a triple of morphisms into the factors, by the universal property. So the number of morphisms $A\to P$ is the product $r\cdot s\cdot t=rst$.'
          - problem: 'Let $A=\{0,1\}$, $X=\{0,1\}$ and $Y=\{0,1,2\}$ in $\mathbf{Set}$. How many functions $A\to X\times Y$ are there?'
            answer: '36'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The product $X\times Y$ has $2\cdot3=6$ elements, and each of the $2$ elements of $A$ has $6$ possible images. So there are $6^2=36$ functions, which equals $2^2\cdot3^2=4\cdot9$, the pairs of functions into the factors.'
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1\}$, and let $f\colon A\to X$ and $g\colon A\to Y$ be the functions $f(0)=1$, $f(1)=0$, $g(0)=2$ and $g(1)=1$. The unique function $h\colon A\to X\times Y$ has the projections $f$ and $g$. What is $h(0)$?'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The projections of $h$ must be $f$ and $g$, so $h(a)=(f(a),g(a))$ for each $a$. At $a=0$ this gives $h(0)=(1,2)$.'
          - problem: 'Let $X=\{a,b\}$, $Y=\{c,d,e\}$ and $A=\{0,1\}$ in $\mathbf{Set}$. How many functions are there from the disjoint union $X+Y$ to $A$?'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A function out of a coproduct is a pair of functions out of the summands. There are $2^2=4$ functions $X\to A$ and $2^3=8$ functions $Y\to A$, so there are $4\cdot8=32$ functions $X+Y\to A$.'
          - problem: 'Each of $3$ guests at a dinner chooses one of $4$ main dishes and one of $5$ side dishes. How many different ways are there to choose a main and a side for all $3$ guests?'
            answer: '8000'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each guest chooses a pair from $4\cdot5=20$ pairs, so there are $20^3=8000$ ways. Equivalently, there are $4^3=64$ ways to choose the mains and $5^3=125$ ways to choose the sides, and $64\cdot125=8000$.'
          - problem: 'At a dinner for $3$ guests there are $8000$ ways to choose a main and a side for every guest, and $64$ ways to choose only the mains. How many ways are there to choose only the sides?'
            answer: '125'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A choice for every guest of a main and a side is the same as a choice of mains together with a choice of sides. So $8000=64\cdot s$ for the number $s$ of ways to choose sides, and $s=8000/64=125$.'
          - problem: 'The contravariant functor $\mathrm{Hom}(-,A)$ sends the coproduct $X+Y$ in $\mathcal{C}$ to which construction on hom-sets?'
            answer: 'product'
            answer_contract: {"kind":"label","options":[["product","a product","the product","a product of sets","cartesian product","products","the cartesian product","a product of the hom-sets"],["coproduct","a coproduct","the coproduct","a disjoint union","a sum"]]}
            solution_sketch: 'Passing to the opposite category turns the coproduct into a product, and the covariant hom-functor preserves products. So $\mathrm{Hom}(X+Y,A)\cong\mathrm{Hom}(X,A)\times\mathrm{Hom}(Y,A)$, a product of sets.'
          - problem: 'Write the full proof that the covariant hom-functor $\mathrm{Hom}(A,-)$ preserves every limit that exists, and that the contravariant hom-functor $\mathrm{Hom}(-,A)$ carries colimits to limits, by treating it as the covariant hom-functor on $\mathcal C^{op}$.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1 (RAPL, stated first): a right adjoint preserves every limit that exists in its domain, and dually a left adjoint preserves every colimit. Step 2 (covariant hom-functor): a cone over a diagram $D$ with apex $A$ is exactly a compatible family of maps $A \to Dj$, and the limit cone $L$ is universal, so maps $A \to L$ correspond bijectively to such families; this natural bijection is the isomorphism $\mathrm{Hom}(A, \lim D) \cong \lim \mathrm{Hom}(A, D)$, so $\mathrm{Hom}(A,-)$ preserves limits. Equivalently, when the copowers of $A$ exist, $\mathrm{Hom}(A,-)$ is a right adjoint and RAPL gives the same conclusion. Step 3 (contravariant case): $\mathrm{Hom}(-,A)$ on $\mathcal C$ is the covariant hom-functor $\mathrm{Hom}(A,-)$ on $\mathcal C^{op}$, which preserves limits by Step 2; since a colimit in $\mathcal C$ is a limit in $\mathcal C^{op}$, $\mathrm{Hom}(\mathrm{colim} D, A) \cong \lim \mathrm{Hom}(D, A)$, so colimits are carried to limits. Step 4 (binary instances): $\mathrm{Hom}(A, X \times Y) \cong \mathrm{Hom}(A,X) \times \mathrm{Hom}(A,Y)$ and $\mathrm{Hom}(X + Y, A) \cong \mathrm{Hom}(X,A) \times \mathrm{Hom}(Y,A)$.'
      - id: kp2
        name: The proof via the adjunction isomorphism
        key_prerequisites: [adjunctions]
        constraints: 'Preservation by the forgetful functor from Grp is tested on products, equalizers and pullbacks of small groups, in word problems with multiplication and division, and the failure of coproducts is a verdict. One full-proof exemplar is kept.'
        exemplars:
          - problem: 'The forgetful functor $U\colon\mathbf{Grp}\to\mathbf{Set}$ is a right adjoint, so it preserves products. Let $A$ have $6$ elements and $B$ have $7$ elements. How many elements does the underlying set $U(A\times B)$ have?'
            answer: '42'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Because $U$ preserves products, $U(A\times B)$ is the product $UA\times UB$ of the underlying sets. It has $6\cdot7=42$ elements.'
          - problem: 'Let $F$ be the free-group functor, left adjoint to $U\colon\mathbf{Grp}\to\mathbf{Set}$, and let $A$ and $B$ be groups. For a set $X$ the sets $\mathrm{Hom}_{\mathbf{Grp}}(FX,A)$ and $\mathrm{Hom}_{\mathbf{Grp}}(FX,B)$ have $m$ and $n$ elements. How many functions $X\to U(A\times B)$ are there?'
            answer: 'm*n'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The adjunction gives $\mathrm{Hom}_{\mathbf{Set}}(X,U(A\times B))\cong\mathrm{Hom}_{\mathbf{Grp}}(FX,A\times B)$. A homomorphism into a product is a pair of homomorphisms into the factors, so there are $m\cdot n=mn$ functions.'
          - problem: 'Let $p,q\colon\mathbb{Z}/6\to\mathbb{Z}/6$ be the homomorphisms $p(x)=x$ and $q(x)=4x$. The forgetful functor $U\colon\mathbf{Grp}\to\mathbf{Set}$ preserves equalizers. How many elements does the equalizer of $p$ and $q$ in $\mathbf{Grp}$ have?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Since $U$ preserves equalizers, the equalizer in $\mathbf{Grp}$ has the same underlying set as the equalizer in $\mathbf{Set}$, namely $\{x:x=4x\}$. The condition $3x\equiv0\pmod 6$ gives $x\in\{0,2,4\}$, so there are $3$ elements.'
          - problem: 'Let $A=B=\mathbb{Z}/6$ and $C=\mathbb{Z}/3$, with $p\colon A\to C$ and $q\colon B\to C$ both given by reduction modulo $3$. The forgetful functor $U\colon\mathbf{Grp}\to\mathbf{Set}$ preserves pullbacks. How many elements does the pullback $A\times_CB$ have in $\mathbf{Grp}$?'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The pullback has the underlying set $\{(a,b):p(a)=q(b)\}$, the pairs with $a\equiv b\pmod 3$. Each of the $6$ values of $a$ pairs with $2$ values of $b$, so there are $6\cdot2=12$ elements.'
          - problem: 'A tournament has $3$ teams, and every team is given one of $5$ colors and one of $2$ mascots. How many different ways are there to assign a color and a mascot to all $3$ teams?'
            answer: '1000'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Each team gets a pair from $5\cdot2=10$ pairs, so there are $10^3=1000$ ways. Equivalently, there are $5^3=125$ ways to assign the colors and $2^3=8$ ways to assign the mascots, and $125\cdot8=1000$.'
          - problem: 'For the same $3$ teams there are $1000$ ways to assign a color and a mascot to every team, and $125$ ways to assign the colors alone. How many ways are there to assign the mascots alone?'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'An assignment of colors and mascots is the same as an assignment of colors together with an assignment of mascots. So $1000=125\cdot m$ for the number $m$ of ways to assign mascots, and $m=1000/125=8$.'
          - problem: 'The free product $\mathbb{Z}/2*\mathbb{Z}/2$ is the coproduct of $\mathbb{Z}/2$ and $\mathbb{Z}/2$ in $\mathbf{Grp}$, and it has infinitely many elements. The coproduct in $\mathbf{Set}$ of their underlying sets has $4$ elements. Does $U\colon\mathbf{Grp}\to\mathbf{Set}$ preserve this coproduct?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","no, it does not","it does not","it is not preserved"],["yes","yes, it does","it does","it is preserved"]]}
            solution_sketch: 'The coproduct of the underlying sets is a set with $4$ elements. The underlying set of $\mathbb{Z}/2*\mathbb{Z}/2$ is infinite, so the comparison map is not a bijection and $U$ does not preserve the coproduct.'
          - problem: 'The work below proves that $U\colon\mathbf{Grp}\to\mathbf{Set}$ preserves the pullback $P=A\times_CB$ of $p\colon A\to C$ and $q\colon B\to C$, where $F\dashv U$. Step 1: $\mathrm{Hom}_{\mathbf{Set}}(X,UP)\cong\mathrm{Hom}_{\mathbf{Grp}}(FX,P)$ by the adjunction. Step 2: $\mathrm{Hom}_{\mathbf{Grp}}(FX,P)$ is the product $\mathrm{Hom}_{\mathbf{Grp}}(FX,A)\times\mathrm{Hom}_{\mathbf{Grp}}(FX,B)$. Step 3: by the adjunction again, this is $\mathrm{Hom}_{\mathbf{Set}}(X,UA)\times\mathrm{Hom}_{\mathbf{Set}}(X,UB)$. Step 4: by Yoneda, $UP$ is the pullback of $UA$ and $UB$ over $UC$. Which step is the first that fails, and why?'
            answer: 'Step 2: a homomorphism from FX to P is a pair (u, v) with pu = qv, so the hom-set is a pullback of hom-sets, not a full product.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'A homomorphism $FX\to P$ is a pair of homomorphisms $(u,v)$ with $p\circ u=q\circ v$. So the hom-set is a pullback of hom-sets over $\mathrm{Hom}_{\mathbf{Grp}}(FX,C)$, not the full product. Step 1 is the adjunction and is valid, so Step 2 is the first step that fails.'
          - problem: 'Write the full proof that if $F$ is left adjoint to $G$, then $G$ carries every limit that exists to a limit, by running the argument through the adjunction bijection and the Yoneda lemma.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1: Let D be a diagram in the category where G is defined, with limit lim D and its limit cone. Step 2: For each object C, the adjunction bijection identifies the set of maps from C to G of lim D with the set of maps from FC to lim D. Step 3: The set-valued functor of maps from the fixed object FC preserves limits, so maps from FC to lim D correspond to the limit over j of the sets of maps from FC to Dj. Step 4: Apply the adjunction bijection at each object Dj: the limit over j of maps from FC to Dj corresponds to the limit over j of maps from C to G of Dj. Step 5: Limits of sets commute with maps from a fixed object C, so this corresponds to the set of maps from C to the limit over j of G of Dj. Step 6: The composite bijection is natural in C, so the Yoneda lemma makes the canonical comparison map from G of lim D to the limit over j of G of Dj an isomorphism. Conclusion: G preserves every limit that exists.'
      - id: kp3
        name: Left adjoints preserve colimits
        key_prerequisites: [limits-colimits]
        constraints: 'Left adjoints are met as free functors: coproducts of free vector spaces and discrete spaces are counted, the free monoid on the empty set is the initial object, a word problem uses addition and subtraction of dimensions, a verdict names a right adjoint that fails, and one item tests a false claim about products. One full-proof exemplar is kept.'
        exemplars:
          - problem: 'The free vector space functor $F\colon\mathbf{Set}\to\mathbf{Vect}_\mathbb{R}$ is a left adjoint. Let $X$ have $4$ elements and $Y$ have $7$ elements. What is the dimension of $F(X+Y)$, where $X+Y$ is the disjoint union?'
            answer: '11'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A left adjoint preserves coproducts, so $F(X+Y)$ is the coproduct $F(X)\oplus F(Y)$ in $\mathbf{Vect}_\mathbb{R}$. Dimensions add, so the dimension is $4+7=11$.'
          - problem: 'The free monoid functor $\mathbf{Set}\to\mathbf{Mon}$ is a left adjoint. How many elements does the free monoid on the empty set have?'
            answer: '1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A left adjoint preserves the initial object, and the empty set is initial in $\mathbf{Set}$. So the free monoid on the empty set is initial in $\mathbf{Mon}$, which is the trivial monoid with $1$ element.'
          - problem: 'Recipes are recorded as amounts of ingredients, so the recipes that use ingredients from a pantry list $X$ and a fridge list $Y$ form the free vector space on the disjoint union $X+Y$. This space has dimension $15$, and the pantry list has $9$ items. How many items does the fridge list have?'
            answer: '6'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The free vector space on $X+Y$ is the direct sum of the free spaces on $X$ and on $Y$, so the dimensions add. Then $9+|Y|=15$, which gives $|Y|=6$.'
          - problem: 'A word-count tool represents a document as a vector of word counts. One vocabulary has $12$ words and another has $8$ words, with no word in both. What is the dimension of the space of word-count vectors for the combined vocabulary?'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The space for the combined vocabulary is the free vector space on the disjoint union of the two vocabularies, which is the direct sum of the two spaces. So the dimension is $12+8=20$.'
          - problem: 'The discrete topology functor $\mathbf{Set}\to\mathbf{Top}$ is a left adjoint. Let $X$ have $2$ elements and $Y$ have $3$ elements. How many open sets does the topological coproduct, the disjoint union, of the discrete spaces on $X$ and $Y$ have?'
            answer: '32'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The open sets of a coproduct are the pairs of an open set of each summand. The discrete space on $X$ has $2^2=4$ open sets and the one on $Y$ has $2^3=8$, so there are $4\cdot8=32$ open sets.'
          - problem: 'The forgetful functor $U\colon\mathbf{Mon}\to\mathbf{Set}$ is a right adjoint. The initial object of $\mathbf{Mon}$ is the trivial monoid with $1$ element, and the initial object of $\mathbf{Set}$ is the empty set. Does $U$ preserve the initial object?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","no, it does not","it does not","it is not preserved"],["yes","yes, it does","it does","it is preserved"]]}
            solution_sketch: 'A functor that preserves the initial object sends it to an initial object. Here $U$ sends the trivial monoid with $1$ element to a $1$-element set, which is not the empty set, so $U$ does not preserve the initial object.'
          - problem: 'The free vector space functor $F\colon\mathbf{Set}\to\mathbf{Vect}_\mathbb{R}$ is a left adjoint. Let $X$ and $Y$ be one-point sets, so $F(X\times Y)$ has dimension $1$. What is the dimension of the product $F(X)\times F(Y)$ in $\mathbf{Vect}_\mathbb{R}$?'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The spaces $F(X)$ and $F(Y)$ each have dimension $1$, and the product of two vector spaces has the sum of the two dimensions. So $F(X)\times F(Y)$ has dimension $1+1=2$, which differs from $1$. Left adjoints preserve colimits, not products.'
          - problem: 'Write the full proof that every left adjoint preserves colimits, by applying the theorem that right adjoints preserve limits in the opposite categories, and conclude that the free monoid functor preserves binary coproducts.'
            answer: 'See the solution.'
            answer_contract: {"kind":"none"}
            solution_sketch: 'Step 1: let F be a left adjoint to G, with F from C to D. After passing to opposite categories, F read from C opposite to D opposite is a right adjoint, since the adjunction reverses. Step 2: a colimit of a diagram in C is a limit of the corresponding diagram in C opposite, and a colimiting cocone in C is a limiting cone in C opposite. Step 3: by RAPL, the right adjoint of Step 1 preserves this limiting cone in C opposite. Step 4: translating back along Step 2, F carries colimiting cocones in C to colimiting cocones in D, so F preserves every colimit that exists in C. Step 5: the free monoid functor M from Set to Mon is left adjoint to the forgetful functor, so by the preserved colimit just proved it preserves binary coproducts; the coproduct of two sets is their disjoint union, and M of a disjoint union is the coproduct in Mon of the two free monoids. This completes the proof; compare your write-up with the solution.'
    diagnostic_exemplar:
      problem: "Prove RAPL: a right adjoint $G\\colon\\mathcal D\\to\\mathcal C$ (with $F\\dashv G$) preserves every limit that exists in $\\mathcal D$."
      answer: "Let $\\lim D$ exist for $D\\colon\\mathcal J\\to\\mathcal D$. For every $C$: $\\mathrm{Hom}(C,G\\lim D)\\cong\\mathrm{Hom}(FC,\\lim D)\\cong\\lim_j\\mathrm{Hom}(FC,Dj)\\cong\\lim_j\\mathrm{Hom}(C,GDj)$ — adjunction, then hom-functors preserve limits, then adjunction again — each step natural in $C$. The last set is exactly the set of cones from $C$ over $GD$, so $G(\\lim D)$ equipped with the legs $G\\lambda_j$ has the universal property of $\\lim(GD)$: maps into it correspond bijectively to cones. Hence the canonical comparison $G(\\lim D)\\to\\lim(GD)$ is an isomorphism and $G$ preserves the limit."
      solution_sketch: "Never touch the cones directly. Chain natural bijections $\\mathrm{Hom}(C,G\\lim D)\\cong\\mathrm{Hom}(FC,\\lim D)\\cong\\lim_j\\mathrm{Hom}(FC,Dj)\\cong\\lim_j\\mathrm{Hom}(C,GDj)$ — adjunction, hom preserves limits, adjunction again — and read the last set as the cones from $C$ over $GD$."
