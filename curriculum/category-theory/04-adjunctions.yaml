      - id: kp1
        name: 'Transposes and the unit'
        key_prerequisites: [natural-isomorphisms]
        constraints: 'Recover the unit and counit by transposing an identity. Derive their naturality using each variable of Phi separately; raw concrete data must leave the unit, the counit or the adjoint to the learner, in algebra and in word problems.'
        exemplars:
          - problem: 'Let $\Delta\colon\mathbf{Set}\to\mathbf{Set}\times\mathbf{Set}$ be the diagonal functor, with right adjoint the product. The morphism $h\colon\Delta\{1,2,3\}\to(\{0,1\},\{5,6\})$ is the pair of functions $f,g$ with $f(1)=0$, $f(2)=1$, $f(3)=1$ and $g(1)=6$, $g(2)=5$, $g(3)=6$. What does the transpose of $h$ send $2$ to?'
            answer: '(1, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The transpose of $h=(f,g)$ is the function $\{1,2,3\}\to\{0,1\}\times\{5,6\}$ whose components are $f$ and $g$. So it sends $2$ to $(f(2),g(2))=(1,5)$.'
          - problem: 'Let $F=\Delta\colon\mathbf{Set}\to\mathbf{Set}\times\mathbf{Set}$ be the diagonal functor, let $G$ be its right adjoint, and let $\eta$ be the unit. Let $d\colon\{4,5,6\}\to\{40,60,90\}$ be the function with $d(4)=60$, $d(5)=40$ and $d(6)=90$, and let $W=\{4,5,6\}$. What is $(GF(d)\circ\eta_W)(4)$?'
            answer: '(60, 60)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The unit $\eta_W$ is the transpose of the identity of $FW=(W,W)$, which is the diagonal $w\mapsto(w,w)$. The map $GF(d)=d\times d$ then sends $(4,4)$ to $(d(4),d(4))$. So the value is $(60,60)$.'
          - problem: 'Let $0<1<\dots<6$ be a chain regarded as a category, and let $F$ be the order-preserving map with $F(0),F(1),\dots,F(6)=0,1,1,2,2,3,3$. It has a right adjoint $G$. The unit at $3$ is an arrow $3\to GF(3)$. What is $GF(3)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The adjunction says $F(a)\le b$ exactly when $a\le G(b)$. Here $F(3)=2$, so $GF(3)$ is the largest $a$ with $F(a)\le2$. Since $F(4)=2$ and $F(5)=3$, we get $GF(3)=4$.'
          - problem: 'Five students are numbered $1,\dots,5$, and student $n$ chooses the club $f(n)$, where $f(1),\dots,f(5)=0,1,1,2,1$. For a set $S$ of students, $F(S)$ is the set of clubs chosen by the students in $S$, and $F$ has a right adjoint $G$ between the posets of subsets ordered by inclusion. The unit at $S=\{2,3\}$ is the inclusion $S\subseteq GF(S)$. Which students belong to $GF(S)$?'
            answer: '2, 3, 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $F(S)=\{1\}$, the single club chosen by students $2$ and $3$. The right adjoint $G$ is the preimage, so $GF(S)=f^{-1}(\{1\})$ contains every student who chose club $1$. These are students $2$, $3$ and $5$.'
          - problem: 'Eggs are packed in cartons of $2$, so $c$ cartons hold $F(c)=2c$ eggs. The functor $F\colon(\mathbb{Z},\le)\to(\mathbb{Z},\le)$ has a right adjoint $G$, where $G(d)$ is the number of full cartons that $d$ eggs fill. The counit at $d$ is an arrow $FG(d)\to d$. What is $FG(7)$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A total of $7$ eggs fills $G(7)=3$ full cartons. So $FG(7)=2\cdot3=6$, the number of eggs in the full cartons, and the counit is the arrow $6\le7$.'
          - problem: 'Let $F\colon\mathbf{Grp}\to\mathbf{Ab}$ send a group to its abelianization $G/[G,G]$, and let $U\colon\mathbf{Ab}\to\mathbf{Grp}$ be the inclusion, so $F\dashv U$. The unit at a group $G$ is the quotient map $G\to UFG$. How many elements does $UFG$ have when $G=D_4$, the dihedral group of order $8$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The target of the unit is the abelianization $D_4/[D_4,D_4]$. The commutator subgroup of $D_4$ is its center, which has $2$ elements. So the abelianization has $8/2=4$ elements.'
          - problem: 'What is the value of $\eta_W(8)$, where $\eta$ is the unit of the diagonal adjunction $\Delta\dashv\times$ at $W=\{7,8\}$?'
            answer: '(8, 8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The unit is the transpose of the identity of $\Delta W=(W,W)$, so both of its components are the identity of $W$. It is the diagonal $w\mapsto(w,w)$, and $\eta_W(8)=(8,8)$.'
          - problem: 'Write the full proof that, for an adjunction with left adjoint $F$ and right adjoint $G$, whose bijection $\Phi_{C,D}$ maps arrows $FC\to D$ to arrows $C\to GD$, the arrow $\eta_C=\Phi(1_{FC})$ is natural in $C$, that is, $GF(c)\circ\eta_C=\eta_{C''}\circ c$ for every morphism $c\colon C\to C''$. Then compare with the solution.'
            answer: 'The unit is natural in C'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Setup: for objects $C$ and $D$, the bijection $\Phi_{C,D}$ from arrows $FC \to D$ to arrows $C \to GD$ is natural in $C$ and in $D$. Step 1 (define the unit): set $\eta_C := \Phi_{C,FC}(1_{FC})$, an arrow $C \to GFC$. Step 2 (left composite): naturality of $\Phi$ in the second variable $D$, used with the morphism $F(c): FC \to FC''$, gives $GF(c) \circ \Phi_{C,FC}(1_{FC}) = \Phi_{C,FC''}(F(c) \circ 1_{FC}) = \Phi_{C,FC''}(F(c))$, hence $GF(c) \circ \eta_C = \Phi_{C,FC''}(F(c))$. Step 3 (right composite): naturality of $\Phi$ in the first variable $C$, used with the morphism $c: C \to C''$, gives $\Phi_{C,FC''}(1_{FC''} \circ F(c)) = \Phi_{C'',FC''}(1_{FC''}) \circ c = \eta_{C''} \circ c$; since $1_{FC''} \circ F(c) = F(c)$, this says $\eta_{C''} \circ c = \Phi_{C,FC''}(F(c))$. Step 4 (conclusion): both composites equal $\Phi_{C,FC''}(F(c))$, so $GF(c) \circ \eta_C = \eta_{C''} \circ c$ for every $c: C \to C''$, which is exactly the naturality of the unit.'
      - id: kp2
        name: 'The universal-arrow formulation'
        key_prerequisites: [universal-properties]
        constraints: 'Construct the universal arrow associated with an adjunction, including existence and uniqueness of the mediating morphism, in chains, in word problems and in the free-monoid adjunction. Items may ask for the object of the arrow or whether it exists; candidate claims are never endorsed by the stem.'
        try_first:
          problem: 'A bus seats $12$ people. What is the smallest number of buses that can carry $30$ people?'
          answer_contract: {"kind": "exact"}
          answer: '3'
          reveal: 'Two buses seat only $24$ people, so $3$ buses are needed. This least number is the universal choice: every number of buses that carries $30$ people is at least $3$, which is the idea of a universal arrow.'
        exemplars:
          - problem: 'Let $\mathcal C$ be the chain $0<1<2$ and $\mathcal D$ the chain $0<1<2<3$, regarded as categories, and let $G\colon\mathcal D\to\mathcal C$ be the order-preserving map with $G(0),G(1),G(2),G(3)=0,0,1,2$. A universal arrow from $1$ to $G$ is an arrow $1\to G(d)$ through which every arrow $1\to G(e)$ factors. Which object $d$ of $\mathcal D$ does it end at?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An arrow $1\to G(d)$ exists exactly when $1\le G(d)$. This holds for $d=2$ and $d=3$, and the universal arrow ends at the least such $d$, because every other arrow factors through it. So $d=2$.'
          - problem: 'A bus seats $12$ people, and $G(n)=12n$ is the number of seats in $n$ buses, an order-preserving map $(\mathbb{N},\le)\to(\mathbb{N},\le)$. A universal arrow from $50$ to $G$ is an arrow $50\to G(d)$ through which every arrow $50\to G(e)$ factors. What is $d$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An arrow $50\to G(d)$ exists exactly when $50\le12d$. The universal arrow ends at the least such $d$. Since $12\cdot4=48<50$ and $12\cdot5=60\ge50$, we get $d=5$.'
          - problem: 'Let $F\dashv U$ be the free-monoid adjunction, and let $\eta_C\colon C\to UFC$ be the universal arrow at $C=\{a,b\}$. The function $k\colon\{a,b\}\to U(\mathbb{Z},+,0)$ has $k(a)=2$ and $k(b)=-3$, and it factors as $k=U(h)\circ\eta_C$ for a unique homomorphism $h\colon\{a,b\}^*\to(\mathbb{Z},+,0)$. What is $h(abb)$?'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The unit $\eta_C$ inserts each letter as a one-letter word, so $h(a)=k(a)=2$ and $h(b)=k(b)=-3$. A homomorphism adds the values of the letters, so $h(abb)=2+(-3)+(-3)=-4$.'
          - problem: 'Let $\mathcal C$ be the chain $0<1<2$ and $\mathcal D$ the chain $0<1<2<3$, regarded as categories, and let $G\colon\mathcal D\to\mathcal C$ be the order-preserving map with $G(0),G(1),G(2),G(3)=0,0,1,1$. Is there a universal arrow from $2$ to $G$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "there is", "there is one", "it exists"], ["no", "there is not", "there is none", "no universal arrow", "it does not exist"]]}
            solution_sketch: 'A universal arrow from $2$ to $G$ is an arrow $2\to G(d)$ for some $d$, so it needs $2\le G(d)$. The values $G(0),\dots,G(3)=0,0,1,1$ never reach $2$, so no arrow from $2$ to any $G(d)$ exists.'
          - problem: 'A crate holds $24$ bottles, and $G(n)=24n$ is the number of bottles in $n$ crates. A universal arrow from $130$ bottles to $G$ is an arrow $130\to G(d)$ through which every arrow $130\to G(e)$ factors. What is $d$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An arrow $130\to G(d)$ exists exactly when $130\le24d$, and the universal arrow ends at the least such $d$. Since $24\cdot5=120<130$ and $24\cdot6=144\ge130$, we get $d=6$.'
          - problem: 'Let $\mathcal C$ be the chain $0<1<2$ and $\mathcal D$ the chain $0<1<2<3$, regarded as categories, and let $G\colon\mathcal D\to\mathcal C$ be the order-preserving map with $G(0),G(1),G(2),G(3)=0,1,2,2$. The universal arrow from $1$ to $G$ ends at an object $d$ with $1\le G(d)$. What is $d$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The universal arrow ends at the least $d$ with $1\le G(d)$, not at the largest one, because every other arrow must factor through it. Since $G(0)=0<1$ and $G(1)=1$, the correct object is $d=1$.'
          - problem: 'Let $\mathcal C$ be the chain $0<1<2$ and $\mathcal D$ the chain $0<1<2<3$, regarded as categories, and let $G\colon\mathcal D\to\mathcal C$ be the order-preserving map with $G(0),G(1),G(2),G(3)=0,0,0,2$. A universal arrow from $2$ to $G$ is an arrow $2\to G(d)$ through which every arrow $2\to G(e)$ factors. Which object $d$ does it end at?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An arrow $2\to G(d)$ exists exactly when $2\le G(d)$. Only $G(3)=2$ meets this, since $G(0),G(1),G(2)=0$. So the universal arrow ends at $d=3$.'
          - problem: 'A square floor of $n$ by $n$ tiles has $G(n)=n^2$ tiles in all, an order-preserving map $(\mathbb{N},\le)\to(\mathbb{N},\le)$. A universal arrow from $40$ tiles to $G$ is an arrow $40\to G(d)$ through which every arrow $40\to G(e)$ factors. What is $d$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An arrow $40\to G(d)$ exists exactly when $40\le d^2$, and the universal arrow ends at the least such $d$. Since $6^2=36<40$ and $7^2=49\ge40$, we get $d=7$.'
          - problem: 'Let $\mathcal C$ be the chain $0<1<2$ and $\mathcal D$ the chain $0<1<2<3$, regarded as categories, and let $G\colon\mathcal D\to\mathcal C$ be the order-preserving map with $G(0),G(1),G(2),G(3)=0,1,1,2$. Is there a universal arrow from $2$ to $G$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "there is", "there is one", "it exists"], ["no", "there is not", "there is none", "no universal arrow", "it does not exist"]]}
            solution_sketch: 'A universal arrow from $2$ to $G$ needs an arrow $2\to G(d)$, that is $2\le G(d)$. The value $G(3)=2$ meets this, and no smaller $d$ does, so the arrows exist and the least one, $d=3$, gives the universal arrow.'
          - problem: 'Write the full proof that, if $F\colon\mathcal{C}\to\mathcal{D}$ is left adjoint to $G\colon\mathcal{D}\to\mathcal{C}$ with unit $\eta$, then for every object $C$ of $\mathcal{C}$ the arrow $\eta_C\colon C\to G(F(C))$ is universal from $C$ to $G$: every arrow $k\colon C\to G(D)$ factors as $k=G(h)\circ\eta_C$ for a unique arrow $h\colon F(C)\to D$. Show also that the assignment sending $k$ to $h$ recovers the hom-set bijection, and obtain the counit version by dualizing. Then compare with the solution.'
            answer: 'The unit is a universal arrow'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Full statement: $F \dashv G$ gives a bijection $\phi$ from arrows $F(C) \to D$ to arrows $C \to G(D)$, natural in $C$ and $D$, with unit $\eta_C = \phi(\mathrm{id}_{F(C)})$. Step 1 (existence): given $k : C \to G(D)$, set $h = \phi^{-1}(k)$; naturality of $\phi$ in $D$ applied to $h$ yields $\phi(h) = G(h) \circ \phi(\mathrm{id}_{F(C)}) = G(h) \circ \eta_C$, hence $k = G(h) \circ \eta_C$. Step 2 (uniqueness): if also $k = G(h'') \circ \eta_C$, the same naturality gives $\phi(h'') = k = \phi(h)$, and injectivity of $\phi$ forces $h'' = h$. Step 3 (recovering the bijection): the map sending $k$ to $h$ is exactly $\phi^{-1}$, so the unique factorization is the hom-set bijection expressed through the unit. Step 4 (dualizing): reversing every arrow swaps $F$ with $G$ and $\eta$ with the counit $\varepsilon$, giving the couniversal form: every $h : F(C) \to D$ factors as $h = \varepsilon_D \circ F(k)$ for a unique $k : C \to G(D)$. This completes the proof; see the solution for the comparison.'
      - id: kp3
        name: 'Uniqueness and composition of adjoints'
        key_prerequisites: [hom-set-adjunction-definition]
        constraints: 'Construct the composite and the comparison hom-set correspondences for composed or repeated adjoints, deriving the order from their variances. Uniqueness follows by Yoneda applied to the composite natural correspondence, not by evaluating one adjoint object; in posets, items evaluate the unique adjoint or the composite adjoint at an object.'
        exemplars:
          - problem: 'Eggs are packed $3$ to a box and boxes are packed $2$ to a crate. On the poset $(\mathbb{Z},\le)$ the functors $F(c)=2c$ (boxes in $c$ crates) and $H(b)=3b$ (eggs in $b$ boxes) have right adjoints $G$ and $K$, and the composite $HF$ has the right adjoint $GK$. How many full crates can be made from $20$ eggs?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The right adjoint of $HF$ is $GK$, and $HF(c)=6c$ is the number of eggs in $c$ crates. So $GK(20)$ is the largest $c$ with $6c\le20$. Since $6\cdot3=18\le20$ and $6\cdot4=24>20$, the answer is $3$.'
          - problem: 'The functor $F(c)=2c$ on $(\mathbb{Z},\le)$ has a right adjoint $G$. A right adjoint is unique up to isomorphism, and isomorphic objects of a poset are equal, so $G(d)$ is determined by $F$. What is $G(11)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The adjunction $F\dashv G$ says that $2c\le d$ exactly when $c\le G(d)$. So $G(11)$ is the largest $c$ with $2c\le11$. Since $2\cdot5=10\le11$ and $2\cdot6=12>11$, we get $G(11)=5$.'
          - problem: 'On $(\mathbb{Z},\le)$ the functor $G(d)=\lfloor d/3\rfloor$ has a left adjoint $F''$, and a left adjoint is unique up to isomorphism. What is $F''(5)$?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The adjunction says $F''(c)\le d$ exactly when $c\le\lfloor d/3\rfloor$, which holds exactly when $3c\le d$. By uniqueness in a poset, $F''(c)=3c$. So $F''(5)=15$.'
          - problem: 'Eggs are packed $5$ to a tray, trays $3$ to a box and boxes $2$ to a crate. On $(\mathbb{Z},\le)$ let $F(c)=2c$ (boxes in $c$ crates), $H(b)=3b$ (trays in $b$ boxes) and $J(t)=5t$ (eggs in $t$ trays). Each has a right adjoint, and so does the composite $JHF$. How many full crates can be made from $130$ eggs?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite is $JHF(c)=30c$, the number of eggs in $c$ crates, and the number of full crates is its right adjoint at $130$. This is the largest $c$ with $30c\le130$. Since $30\cdot4=120\le130$ and $30\cdot5=150>130$, the answer is $4$.'
          - problem: 'In $\mathbf{Set}$ we have $(-\times A)\dashv(-)^A$ and $(-\times B)\dashv(-)^B$. The composite $(-\times A)\times B$ has the right adjoint $E\mapsto(E^B)^A$. If $E$ has $2$ elements, $A$ has $2$ elements and $B$ has $3$ elements, how many elements does $(E^B)^A$ have?'
            answer: '64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $E^B$ has $2^3=8$ elements. The set $(E^B)^A$ is the set of functions from $A$ to a set of $8$ elements, so it has $8^2=64$ elements.'
          - problem: 'Let $F(c)=c+4$ and $H(d)=2d$ on $(\mathbb{Z},\le)$, with right adjoints $G$ and $K$. The right adjoint of $HF$ is $GK$. What is its value at $21$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The right adjoint of a composite $HF$ is $GK$, which applies $K$ first and then $G$. Here $K(21)=\lfloor21/2\rfloor=10$ and $G(10)=10-4=6$. So $GK(21)=6$, while the order $K(G(21))$ gives $\lfloor17/2\rfloor=8$.'
          - problem: 'Write the full proof that, if $F$ is left adjoint to $G$ between categories $\mathcal{C}$ and $\mathcal{D}$, and $H$ is left adjoint to $K$ between categories $\mathcal{D}$ and $\mathcal{E}$, then $HF$ is left adjoint to $GK$, and the hom-set bijection is natural in the objects of $\mathcal{C}$ and of $\mathcal{E}$. Then compare with the solution.'
            answer: 'HF is left adjoint to GK'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (instantiate the second adjunction): fix objects X of C and e of E; applying the adjunction between H and K at the object F(X) of D gives a bijection from the arrows H(F(X)) to e in E to the arrows F(X) to K(e) in D, natural in the free variable e and in the object F(X). Step 2 (instantiate the first adjunction): applying the adjunction between F and G at the object K(e) of D gives a bijection from the arrows F(X) to K(e) to the arrows X to G(K(e)) in C, natural in X and in K(e). Step 3 (chain the bijections): composing the two bijections gives a bijection from the arrows H(F(X)) to e to the arrows X to G(K(e)). Step 4 (track naturality): the composite is natural in X because each factor is natural in its first free variable and F is a functor, and natural in e because each factor is natural in its second free variable and K is a functor. Step 5 (conclude): a family of bijections from the arrows HF(X) to e to the arrows X to GK(e), natural in both variables, is exactly the hom-set definition of an adjunction, so HF is left adjoint to GK.'
    diagnostic_exemplar:
      problem: "Let $F\\dashv G$ be an adjunction with counit $\\varepsilon$. Prove that $G$ is faithful if and only if every component $\\varepsilon_D$ is an epimorphism."
      answer: "Write $\\Phi\\colon\\mathrm{Hom}_{\\mathcal D}(FC,D')\\cong\\mathrm{Hom}_{\\mathcal C}(C,GD')$ for the adjunction bijection, so $\\Phi^{-1}(k)=\\varepsilon_{D'}\\circ Fk$. Fix $h\\colon D\\to D'$ and apply this at $C=GD$, $k=Gh$: $\\Phi^{-1}(Gh)=\\varepsilon_{D'}\\circ FG(h)=h\\circ\\varepsilon_D$, the last step being naturality of $\\varepsilon\\colon FG\\Rightarrow 1_{\\mathcal D}$ at $h$. Since $\\Phi^{-1}\\colon\\mathrm{Hom}_{\\mathcal C}(GD,GD')\\to\\mathrm{Hom}_{\\mathcal D}(FGD,D')$ is a bijection, for $h,h'\\colon D\\to D'$ we get $Gh=Gh'\\iff h\\circ\\varepsilon_D=h'\\circ\\varepsilon_D$. If $G$ is faithful, then $h\\circ\\varepsilon_D=h'\\circ\\varepsilon_D$ gives $Gh=Gh'$ and hence $h=h'$, so $\\varepsilon_D$ is right-cancellable, i.e. an epimorphism, for every $D$. Conversely if every $\\varepsilon_D$ is epi and $Gh=Gh'$, then $h\\circ\\varepsilon_D=h'\\circ\\varepsilon_D$ and cancelling $\\varepsilon_D$ gives $h=h'$, so $G$ is faithful."
      solution_sketch: "Compute $\\Phi^{-1}(Gh)$ two ways: the formula $\\varepsilon\\circ F(-)$ together with naturality of $\\varepsilon$ at $h$ turns it into $h\\circ\\varepsilon_D$. Since $\\Phi^{-1}$ is a bijection, $Gh=Gk$ is equivalent to $h\\circ\\varepsilon_D=k\\circ\\varepsilon_D$, and that equivalence is exactly the statement that $G$ is faithful iff $\\varepsilon_D$ is right-cancellable."
    anki_seeds:
      - front: "The unit of $F\\dashv G$ is the transpose of {{c1::$1_{FC}$}}, giving $\\eta_C\\colon C\\to GFC$."
        back: "$1_{FC}$"
        type: cloze
      - front: "$F$ is left adjoint to $G$ iff each $\\eta_C$ is what kind of arrow?"
        back: "a universal arrow from $C$ to $G$: every $k\\colon C\\to GD$ is $Gh\\circ\\eta_C$ for a unique $h$."
        type: basic
      - front: "If $F\\dashv G$ and $F'\\dashv G'$ are composable, what is the composite adjunction?"
        back: "$F'F\\dashv GG'$."
        type: basic

  - id: adjunction-examples
    name: Examples of Adjunctions
    core: true
    difficulty: 0.75
    drill: false
