    knowledge_points:
      - id: kp1
        name: 'Computing transposes'
        key_prerequisites: [universal-properties]
        constraints: 'Construct transposes from the adjunction or universal property. Do not state a transpose formula before asking for its value; include restriction, extension, and recovery of an unknown adjoint, in algebra and in word problems.'
        try_first:
          problem: 'A function $f\colon\{a\}\to(\mathbb{N},+,0)$ has $f(a)=3$. A monoid homomorphism $h$ from the free monoid on $\{a\}$ to $(\mathbb{N},+,0)$ agrees with $f$ on the letter $a$. What is $h(aaaa)$?'
          answer_contract: {"kind": "exact"}
          answer: '12'
          reveal: 'The word $aaaa$ is the product of four letters $a$, so $h(aaaa)=3+3+3+3=12$. A homomorphism out of a free monoid is fixed by its values on the letters, and this is the transpose idea of the lesson.'
        exemplars:
          - problem: 'Let $F\colon\mathbf{Set}\to\mathbf{Mon}$ send a set to the free monoid on it, and let $U\colon\mathbf{Mon}\to\mathbf{Set}$ be the underlying-set functor, so $F\dashv U$. Let $f\colon\{a,b\}\to U(\mathbb{N},+,0)$ be the function with $f(a)=4$ and $f(b)=5$, and let $\bar f\colon\{a,b\}^*\to(\mathbb{N},+,0)$ be its transpose. What is $\bar f(aab)$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose of $f$ is the unique monoid homomorphism that agrees with $f$ on the letters. A homomorphism into $(\mathbb{N},+,0)$ turns a word into the sum of the values of its letters. So $\bar f(aab)=f(a)+f(a)+f(b)=4+4+5=13$.'
          - problem: 'Let $\Delta\colon\mathbf{Set}\to\mathbf{Set}\times\mathbf{Set}$ be the diagonal functor $X\mapsto(X,X)$, whose right adjoint is the product $(A,B)\mapsto A\times B$. A morphism $\Delta\{1,2\}\to(A,B)$ is a pair of functions $(f,g)$ with $f(1)=0$, $f(2)=3$, $g(1)=5$ and $g(2)=7$. What does its transpose $\{1,2\}\to A\times B$ send $2$ to?'
            answer: '(3, 7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'By the universal property of the product, the pair $(f,g)$ corresponds to the unique function $\{1,2\}\to A\times B$ whose two components are $f$ and $g$. So its value at $2$ is the pair $(f(2),g(2))=(3,7)$.'
          - problem: 'Regard the poset $(\mathbb{Z},\le)$ as a category, with one arrow $x\to y$ when $x\le y$. The functor $F(c)=3c$ has a right adjoint $G$. The arrow $F(4)\to17$, that is $12\le17$, has a transpose $4\to G(17)$. What is $G(17)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In a poset the adjunction says $3c\le d$ exactly when $c\le G(d)$. So $G(17)$ is the largest integer $c$ with $3c\le17$. Since $3\cdot5=15\le17$ and $3\cdot6=18>17$, we get $G(17)=5$.'
          - problem: 'A robot program is a word in the letters $a$ and $b$. The program $aa$ moves the robot $16$ m and the program $ba$ moves it $26$ m, and the distance of a program is the sum of the distances of its letters. This distance is a monoid homomorphism $h\colon\{a,b\}^*\to(\mathbb{N},+,0)$, the transpose of the function that records the distance of each single letter. How far does the program $b$ move the robot?'
            answer: '18'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Since $h(aa)=h(a)+h(a)=16$, the letter $a$ moves the robot $8$ m. Then $h(ba)=h(b)+h(a)=26$ gives $h(b)=26-8=18$ m.'
          - problem: 'Let $F\dashv U$ be the free-monoid adjunction, and let $M$ be the monoid of positive integers under multiplication. A homomorphism $h\colon\{p,q\}^*\to M$ satisfies $h(ppq)=18$ and $h(q)=2$. What is $h(p)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism turns a word into the product of the values of its letters, so $h(ppq)=h(p)\cdot h(p)\cdot h(q)=18$. With $h(q)=2$ this gives $h(p)^2=9$. Since $h(p)$ is a positive integer, $h(p)=3$.'
          - problem: 'Let $F\dashv U$ be the free-monoid adjunction. Extend the function $j\colon\{a,b\}\to U(\mathbb{N},+,0)$ with $j(a)=4$ and $j(b)=1$ to the homomorphism $\bar j\colon\{a,b\}^*\to(\mathbb{N},+,0)$. What is the value of $\bar j(\varepsilon)$ for the empty word $\varepsilon$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A monoid homomorphism sends the identity element to the identity element. The empty word is the identity of the free monoid, and the identity of $(\mathbb{N},+,0)$ is $0$, because the empty product in an additive monoid is the empty sum. So $\bar j(\varepsilon)=0$, not $1$.'
          - problem: 'Let $F\colon\mathbf{Set}\to\mathbf{Vect}_{\mathbb{Q}}$ send a set to the vector space with that set as a basis, and let $U$ be the underlying-set functor, so $F\dashv U$. The function $f\colon\{s,t\}\to U\mathbb{Q}$ has $f(s)=3$ and $f(t)=-2$. What is the value at $2s+5t$ of its transpose, the linear map $\bar f\colon F\{s,t\}\to\mathbb{Q}$?'
            answer: '-4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose of $f$ is the unique linear map that agrees with $f$ on the basis $\{s,t\}$. By linearity, $\bar f(2s+5t)=2f(s)+5f(t)=2\cdot3+5\cdot(-2)=6-10=-4$.'
          - problem: 'A warehouse packs rice into bags of $3$ kg, so $c$ bags weigh $F(c)=3c$ kg. For a load of $d$ kg, let $G(d)$ be the number of full bags that the load fills. Then $3c\le d$ exactly when $c\le G(d)$, so $G$ is the right adjoint of $F$ on the poset $(\mathbb{Z},\le)$. How many full bags does a load of $50$ kg fill?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose of the arrow $3c\le50$ is the arrow $c\le G(50)$, so $G(50)$ is the largest $c$ with $3c\le50$. This is the whole-number part of $50\div3$. Since $3\cdot16=48\le50$ and $3\cdot17=51>50$, the load fills $16$ bags.'
          - problem: 'Write the full proof that, for the alphabet $C=\{a,b\}$ and the monoid $M=(\mathbb{N},+,0)$, the map $\mathrm{Hom}(C^*,M)\to\mathrm{Hom}(C,UM)$ that restricts a homomorphism to the letters and the map $\mathrm{Hom}(C,UM)\to\mathrm{Hom}(C^*,M)$ that extends a function to the unique homomorphism are inverse bijections. Then compare with the solution.'
            answer: 'Restriction and extension are inverse'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (restriction is well defined): a homomorphism h: C* -> M has values h(a) and h(b) in M, so restricting it to the one-letter words gives a function C -> U M. Step 2 (extension exists): given f: C -> U M, define the extension on a word as the sum of the values of its letters, sending the empty word to 0; since the decomposition of a word into letters is unique, this is a well-defined homomorphism extending f. Step 3 (the maps are inverse): restricting the extension of f returns f by construction, and every homomorphism h equals the extension of its own restriction, because two homomorphisms from the free monoid that agree on the generators a and b agree on every word. Conclusion: the two maps are inverse bijections Hom(C*, M) -> Hom(C, U M), which is the transpose correspondence Hom(FC, D) = Hom(C, GD) of the adjunction between the free monoid functor and the forgetful functor.'
      - id: kp2
        name: 'Recognizing an adjunction from a familiar bijection'
        key_prerequisites: [natural-isomorphisms]
        constraints: 'Recover the adjunction direction and the two hom-sets from the raw constructions. Test the correspondence, construct the missing adjoint, or use the bijection to compute a value or the size of a hom-set; items may name the adjoint pair but never say which side each functor is on.'
        exemplars:
          - problem: 'Let $i\colon(\mathbb{Z},\le)\to(\mathbb{R},\le)$ be the inclusion of posets, each regarded as a category. For every integer $n$ and real number $x$ we have $n\le x$ if and only if $n\le\lfloor x\rfloor$. Since each hom-set in a poset has at most one element, this equivalence is a bijection $\mathrm{Hom}(i(n),x)\cong\mathrm{Hom}(n,\lfloor x\rfloor)$. Is $i$ the left adjoint or the right adjoint of the floor function?'
            answer: 'left'
            answer_contract: {"kind": "label", "options": [["left", "left adjoint", "the left adjoint", "i is the left adjoint"], ["right", "right adjoint", "the right adjoint", "i is the right adjoint"]]}
            solution_sketch: 'In a poset each hom-set has at most one element, so the equivalence $n\le x\iff n\le\lfloor x\rfloor$ is a bijection $\mathrm{Hom}(i(n),x)\cong\mathrm{Hom}(n,\lfloor x\rfloor)$. The functor applied to the first argument on the left of the bijection is the left adjoint, and here that is $i$. So $i$ is the left adjoint and the floor function is the right adjoint.'
          - problem: 'The inclusion $i\colon(\mathbb{Z},\le)\to(\mathbb{R},\le)$ also has a left adjoint $L\colon\mathbb{R}\to\mathbb{Z}$, so that $\mathrm{Hom}(L(x),n)\cong\mathrm{Hom}(x,i(n))$ for every real $x$ and integer $n$. What is $L(7/3)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bijection says $L(x)\le n$ exactly when $x\le n$. So $L(x)$ is the smallest integer that is at least $x$, which is the ceiling of $x$. Since $2<7/3\le3$, we get $L(7/3)=3$.'
          - problem: 'Let $F\colon\mathbf{Set}\to\mathbf{Vect}_{\mathbb{F}_2}$ send a set to the vector space over the field $\mathbb{F}_2=\{0,1\}$ with that set as a basis, and let $U$ be the underlying-set functor. These two functors are adjoint, with $F$ on the left. How many linear maps $F\{s,t\}\to\mathbb{F}_2^3$ are there?'
            answer: '64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bijection $\mathrm{Hom}(FS,V)\cong\mathrm{Hom}(S,UV)$ shows that a linear map is the same as a function from the basis $\{s,t\}$ to the underlying set of $\mathbb{F}_2^3$. This set has $2^3=8$ elements, so there are $8^2=64$ such functions and $64$ linear maps.'
          - problem: 'Let $t\colon\mathbb{R}\to\mathbb{Z}$ truncate toward zero (so $t(-3/2)=-1$) and let $i\colon\mathbb{Z}\to\mathbb{R}$ be the inclusion. If $t$ were a right adjoint of $i$, then $n\le x$ if and only if $n\le t(x)$ for every integer $n$ and real number $x$. At $x=-3/2$, for which integer $n$ do the two sides disagree?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x=-3/2$ we have $t(x)=-1$. For $n=-1$ the left side $-1\le-3/2$ is false, while the right side $-1\le-1$ is true, so the sides disagree. Every other integer makes both sides true or both false, so $n=-1$ is the only one, and $t$ is not a right adjoint.'
          - problem: 'Let $U\colon\mathbf{Preord}\to\mathbf{Set}$ forget the order. Let $D(S)$ be the set $S$ with only the relations $x\le x$, and let $I(S)$ be the set $S$ with $x\le y$ for all $x,y$. One of $D$, $I$ is a left adjoint of $U$ and the other is a right adjoint of $U$. Which one is the right adjoint?'
            answer: 'I'
            answer_contract: {"kind": "label", "options": [["I", "I(S)", "the indiscrete preorder", "indiscrete"], ["D", "D(S)", "the discrete preorder", "discrete"]]}
            solution_sketch: 'A monotone map $P\to I(S)$ has no condition to meet, because every pair is ordered in $I(S)$. So $\mathrm{Hom}(P,I(S))\cong\mathrm{Hom}(UP,S)$ is a bijection, and $I$ sits on the right of $U$. The other functor $D$ is the left adjoint, because $\mathrm{Hom}(D(S),P)\cong\mathrm{Hom}(S,UP)$.'
          - problem: 'Let $D(S)$ be the discrete preorder on $S$, with only the relations $x\le x$, and let $P$ be the chain $0<1$. If $U$ were a left adjoint of $D$, the monotone maps $P\to D(S)$ would correspond bijectively to the functions $UP\to S$. How many monotone maps $P\to D(\{a,b\})$ are there?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A monotone map $f\colon P\to D(\{a,b\})$ needs $f(0)\le f(1)$, and in a discrete preorder this forces $f(0)=f(1)$. So there are $2$ monotone maps, the two constant ones. There are $4$ functions $UP\to\{a,b\}$, so no bijection exists and $U$ is not left adjoint to $D$.'
          - problem: 'A shop sells pens only in boxes of $6$. Let $G(m)=6m$ be the number of pens in $m$ boxes, an order-preserving map $(\mathbb{N},\le)\to(\mathbb{N},\le)$. It has a left adjoint $L$, where $L(n)\le m$ exactly when $n\le G(m)$. How many boxes must a customer buy to get at least $40$ pens?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of boxes needed is $L(40)$, the smallest $m$ with $40\le6m$. Since $6\cdot6=36<40$ and $6\cdot7=42\ge40$, we get $L(40)=7$.'
          - problem: 'A keyboard has the three keys $a,b,c$. Typing a word gives a total cost in $\mathbb{Z}/5$, and the cost of a word is the sum of the costs of its letters. How many different cost systems, that is monoid homomorphisms $\{a,b,c\}^*\to(\mathbb{Z}/5,+)$, are there?'
            answer: '125'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The free-monoid adjunction gives a bijection between homomorphisms $\{a,b,c\}^*\to(\mathbb{Z}/5,+)$ and functions $\{a,b,c\}\to\mathbb{Z}/5$. Each of the $3$ keys gets one of $5$ costs, so there are $5^3=125$ cost systems.'
          - problem: 'Write the full proof that the functor that sends a set to its discrete preorder is left adjoint to the forgetful functor from preorders to sets, with the bijection written in the standard form $\mathrm{Hom}(FC,D)\cong\mathrm{Hom}(C,GD)$. Then compare with the solution.'
            answer: 'D is left adjoint to U'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (set up the objects): let S be a set, let P be a preorder, let D(S) be the discrete preorder on S, and let U be the forgetful functor; the claim is the adjunction D -| U. Step 2 (the bijection): a monotone map from D(S) to P is a function on underlying sets that preserves the order, and since the only relation in D(S) is x <= x, every function from S to U(P) preserves it; so the underlying-function assignment is a bijection Hom(D(S), P) = Hom(S, U(P)). Step 3 (standard form): matching this bijection against Hom(FC, D) = Hom(C, GD) with source object S and target object P places F = D on the first variable and G = U on the second, so D is the left adjoint and U is the right adjoint. Step 4 (naturality): for a function g from S to T, precomposing with g on one side corresponds to precomposing with g on the other, and for a monotone map h from P to Q, postcomposing with h corresponds to postcomposing with h, because the same underlying function results in both cases; hence the bijection is natural in both variables. Conclusion: D -| U, with the natural bijection Hom(D(S), P) = Hom(S, U(P)) stated in the standard form.'
      - id: kp3
        name: 'The data and the two naturality conditions'
        key_prerequisites: [hom-functors]
        constraints: 'Construct and test the two naturality squares of the hom-set bijection, with all changed object indices. Include pointwise bijections that fail naturality, and values computed on both sides of a square.'
        exemplars:
          - problem: 'A robot has the instructions $a$ and $b$, and its programs are words in them. A homomorphism $h\colon\{a,b\}^*\to(\mathbb{N},+,0)$ gives the cost of a program, with $h(a)=8$ and $h(b)=7$. A relabeling $c\colon\{x,y\}\to\{a,b\}$ sends both $x$ and $y$ to $a$. Let $\Phi$ be the transpose of the free-monoid adjunction. What is $\Phi(h\circ Fc)(y)$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose of $h\circ Fc$ is the restriction of $h\circ Fc$ to the letters. So $\Phi(h\circ Fc)(y)=h(c(y))=h(a)=8$. This is the first-variable square $\Phi(h\circ Fc)=\Phi(h)\circ c$ evaluated at $y$.'
          - problem: 'A robot has the instructions $a$ and $b$, and its programs are words in them. A homomorphism $h\colon\{a,b\}^*\to(\mathbb{N},+,0)$ gives the cost of a program, with $h(a)=8$ and $h(b)=7$. An odometer shows only the remainder modulo $5$ of the cost, which is the homomorphism $d\colon(\mathbb{N},+,0)\to(\mathbb{Z}/5,+)$ sending $n$ to its remainder. Let $\Phi$ be the transpose of the free-monoid adjunction. What is $\Phi(d\circ h)(b)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose of $d\circ h$ is its restriction to the letters, so $\Phi(d\circ h)(b)=d(h(b))=d(7)$. The remainder of $7$ on division by $5$ is $2$. This is the second-variable square $\Phi(d\circ h)=Ud\circ\Phi(h)$ evaluated at $b$.'
          - problem: 'Let $h\colon\{a,b\}^*\to(\mathbb{N},+,0)$ be the homomorphism with $h(a)=8$ and $h(b)=7$, let $d\colon(\mathbb{N},+,0)\to(\mathbb{Z}/5,+)$ send $n$ to its remainder modulo $5$, and let $c\colon\{x,y\}\to\{a,b\}$ be the function with $c(x)=b$ and $c(y)=a$. What is $\Phi(d\circ h\circ Fc)(y)$ for the transpose $\Phi$ of the free-monoid adjunction?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose is the restriction to the letters, so $\Phi(d\circ h\circ Fc)(y)=d(h(c(y)))=d(h(a))=d(8)$. The remainder of $8$ on division by $5$ is $3$. Both naturality squares are used, one for $c$ and one for $d$.'
          - problem: 'Let $F=G=\mathrm{Id}_{\mathbf{Set}}$, and for sets $X,Y$ define the bijection $\Phi_{X,Y}(h)=\sigma_Y\circ h$, where $\sigma_{\{0,1\}}$ swaps $0$ and $1$ and $\sigma_Y$ is the identity for every other set $Y$. Let $h=1_{\{*\}}$ and let $d\colon\{*\}\to\{0,1\}$ be the function with $d(*)=0$. What is $\Phi_{\{*\},\{0,1\}}(d\circ h)(*)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $d\circ h$ sends $*$ to $0$, and $\sigma_{\{0,1\}}$ swaps $0$ and $1$, so $\Phi_{\{*\},\{0,1\}}(d\circ h)(*)=1$. The other route is $d\circ\Phi_{\{*\},\{*\}}(h)$, which sends $*$ to $d(*)=0$. The two values $1$ and $0$ differ.'
          - problem: 'Let $F=G=\mathrm{Id}_{\mathbf{Set}}$, and for sets $X,Y$ define the bijection $\Phi_{X,Y}(h)=\sigma_Y\circ h$, where $\sigma_{\{0,1\}}$ swaps $0$ and $1$ and $\sigma_Y$ is the identity for every other set $Y$. Is the family $\Phi$ natural in the second variable $Y$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is natural", "natural"], ["no", "it is not", "false", "it is not natural", "not natural"]]}
            solution_sketch: 'Naturality in $Y$ needs $\Phi(d\circ h)=d\circ\Phi(h)$ for all $d$ and $h$. For $h=1_{\{*\}}$ and $d(*)=0$ the left side sends $*$ to $1$ and the right side sends $*$ to $0$. So each $\Phi_{X,Y}$ is a bijection, but the family is not natural.'
          - problem: 'Let $F=G=\mathrm{Id}_{\mathbf{Set}}$, and for sets $X,Y$ define the bijection $\Phi_{X,Y}(h)=\sigma_Y\circ h$, where $\sigma_{\{0,1\}}$ swaps $0$ and $1$ and $\sigma_Y$ is the identity for every other set $Y$. Is the family $\Phi$ natural in the first variable $X$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is natural", "natural"], ["no", "it is not", "false", "it is not natural", "not natural"]]}
            solution_sketch: 'Naturality in $X$ needs $\Phi(h\circ c)=\Phi(h)\circ c$ for every function $c$ and every $h$. Here $\Phi(h\circ c)=\sigma_Y\circ h\circ c=\Phi(h)\circ c$, because $\sigma_Y$ depends only on $Y$. So the family is natural in $X$, although it is not natural in $Y$.'
          - problem: 'Check naturality of the free-monoid transpose in the first variable. Let $c\colon\{x\}\to\{a,b\}$ be the function with $c(x)=b$, and let $h\colon\{a,b\}^*\to(\mathbb{N},+,0)$ be the homomorphism with $h(a)=2$ and $h(b)=9$. What is the value of $\Phi(h\circ Fc)(x)$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The transpose of $h\circ Fc$ is the restriction of $h\circ Fc$ to the letter $x$. Since $Fc$ sends the word $x$ to the word $c(x)=b$, we get $\Phi(h\circ Fc)(x)=h(b)=9$.'
          - problem: 'In $\mathbf{Set}$ let $F(C)=C\times\{0,1\}$ and $G(D)=D^{\{0,1\}}$, with the bijection $\Phi(h)(c)(j)=h(c,j)$. Let $h\colon\{0,1\}\times\{0,1\}\to\{5,6,7,8\}$ have $h(0,0)=5$, $h(0,1)=6$, $h(1,0)=7$ and $h(1,1)=8$. Let $c\colon\{u,v\}\to\{0,1\}$ have $c(u)=0$ and $c(v)=1$, and let $d\colon\{5,6,7,8\}\to\mathbb{Z}$ be $d(y)=2y-7$. What is $\Phi(d\circ h\circ Fc)(u)(1)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By definition $\Phi(d\circ h\circ Fc)(u)(1)=(d\circ h\circ Fc)(u,1)=d(h(c(u),1))=d(h(0,1))=d(6)$. Since $d(6)=2\cdot6-7=5$, the value is $5$.'
          - problem: 'Write the full proof that the order-preserving map $F\colon(\mathbb{N},\le)\to(\mathbb{N},\le)$ with $F(c)=2c$ has the right adjoint $G(d)=\lfloor d/2\rfloor$, with bijections $\mathrm{Hom}(2c,d)\to\mathrm{Hom}(c,G(d))$ that are natural in $c$ and in $d$ separately. Then compare with the solution.'
            answer: 'F(c)=2c has right adjoint floor(d/2)'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Data: both categories are the poset (N, at most) viewed as a category, F(c) = 2c is order-preserving, and G(d) = floor(d/2). Step 1 (the bijection and its direction): 2c is at most d exactly when c is at most floor(d/2), so the hom-set Hom(2c, d) is nonempty exactly when Hom(c, G(d)) is; each has at most one element, so sending the unique map to the unique map is a bijection from Hom(2c, d) to Hom(c, G(d)). Step 2 (naturality in c, checked alone): for c'' at most c and a map h from 2c to d, the two sides of the naturality equation both lie in the hom-set Hom(c'', G(d)), which has at most one element, so they are equal. Step 3 (naturality in d, checked alone): for d at most d'' and h from 2c to d, both sides of the naturality equation lie in Hom(c, G(d'')), again a set with at most one element, so they are equal. Conclusion: the functors F and G together with these bijections satisfy the hom-set definition of the adjunction F left adjoint to G, with naturality verified in each variable separately.'
    diagnostic_exemplar:
      problem: "Let $i\\colon(\\mathbb{Z},\\le)\\to(\\mathbb{R},\\le)$ be the inclusion of posets. Prove that $i\\dashv\\lfloor-\\rfloor$, stating the bijection in the standard $\\mathrm{Hom}(FC,D)\\cong\\mathrm{Hom}(C,GD)$ form and saying why naturality is automatic."
      answer: "For $n\\in\\mathbb{Z}$ and $x\\in\\mathbb{R}$: $i(n)\\le x\\iff n\\le\\lfloor x\\rfloor$, because $\\lfloor x\\rfloor$ is the greatest integer $\\le x$ (if $n\\le x$ then $n\\le\\lfloor x\\rfloor$; conversely $n\\le\\lfloor x\\rfloor\\le x$). In poset categories hom-sets have at most one element, so this biconditional IS the hom-set bijection $\\mathrm{Hom}_{\\mathbb R}(i(n),x)\\cong\\mathrm{Hom}_{\\mathbb Z}(n,\\lfloor x\\rfloor)$, matching the standard form with $F=i$ (left adjoint) and $G=\\lfloor-\\rfloor$ (right adjoint); naturality is automatic since parallel maps of thin categories are equal."
      solution_sketch: "Prove the biconditional $n\\le x\\iff n\\le\\lfloor x\\rfloor$ from the defining property of the floor as the greatest integer below $x$. In a thin category a biconditional is the hom-set bijection, and naturality is vacuous because parallel arrows in a poset are equal."
    anki_seeds:
      - front: "An adjunction $F\\dashv G$ is..."
        back: "a natural isomorphism $\\mathrm{Hom}_{\\mathcal D}(FC,D)\\cong\\mathrm{Hom}_{\\mathcal C}(C,GD)$ in $C,D$; $F$ is the left adjoint, $G$ the right."
        type: basic
      - front: "In $F\\dashv G$, which side of the bijection does the left adjoint act on?"
        back: "the source: $\\mathrm{Hom}(FC,D)$ — the left adjoint is applied to the left-hand object."
        type: basic
      - front: "Naturality of $\\Phi$ in both variables, in one equation?"
        back: "$\\Phi(d\\circ h\\circ Fc)=Gd\\circ\\Phi(h)\\circ c$."
        type: basic

