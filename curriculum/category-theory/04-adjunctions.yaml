  - id: unit-counit
    name: Unit and Counit
    core: true
    difficulty: 0.78
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: adjunctions
        weight: 0.6
        key: true
      - id: natural-transformations
        weight: 0.3
        key: true
      - id: adjunction-examples
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Defining unit and counit
        key_prerequisites: [adjunctions]
        constraints: "Recover unit and counit as identity transposes in the free-monoid adjunction, leaving their component formulas to the learner. Include typed identity matching and a defective candidate."
        exemplars:
          - problem: "F:Set->Mon sends X to its free monoid, and U is forgetful. Define the unit as the transpose of an identity arrow. For X={c,d,e}, reconstruct eta_X(d) and give its word length."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the unit is the transpose of the identity, $\\eta_X = \\Phi_{X, X^*}(1_{X^*}) : X \\to U(X^*)$. Step 1: by the stated form of $\\Phi$, $\\Phi(h) = h \\circ i_X$, so $\\eta_X = 1_{X^*} \\circ i_X = i_X$. Step 2: the insertion $i_X$ sends the letter $d$ to the one-letter word $(d)$, which is exactly $\\eta_X(d)$. That word has 1 letter; the answer is 1."
          - problem: "For the free-monoid/forgetful adjunction, reconstruct the counit at M=(Z,+) by inverse-transposing 1_UM. Give its value on the word (2,-5,7)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the counit is the transpose of the identity, $\\varepsilon_M = \\Phi^{-1}_{UM, M}(1_{UM}) : (UM)^* \\to M$, the unique monoid homomorphism with $\\varepsilon_M((m)) = m$. Step 1: a homomorphism out of a free monoid is fixed by its values on one-letter words and preserves the operation, so it evaluates a word letter by letter in the target monoid. Step 2: $\\varepsilon_M((2, -5, 7)) = 2 + (-5) + 7 = 4$. The answer is 4."
          - problem: "For the free-monoid/forgetful adjunction and M=(N,+,0), derive the counit from the transpose of 1_UM. Give its value on the empty word."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: $\\varepsilon_M$ is the transpose of the identity $1_{UM}$, the unique monoid homomorphism $(UM)^* \\to M$ with $\\varepsilon_M((m)) = m$ on one-letter words. Step 1: a monoid homomorphism carries the identity element of the source to the identity element of the target, and the empty word is the identity of the free monoid $(UM)^*$. Step 2: the identity element of the natural numbers under addition is the number 0. The answer is 0."
          - problem: "For F:Set->Mon free and U forgetful, a function f:{a,b}->U(Z,+) sends a to 3,b to -2. Recover the counit from an identity transpose and use it to construct the inverse transpose of f. Give its value on the word (b,a,b)."
            answer: "-1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the transpose $f^\\sharp = \\Phi^{-1}(f)$ is the unique monoid homomorphism $X^* \\to M$ with $f^\\sharp((x)) = f(x)$; equivalently $f^\\sharp = \\varepsilon_M \\circ F(f)$. Step 1: a homomorphism out of a free monoid evaluates a word letter by letter in the operation of $M$. Step 2: $f^\\sharp((b, a, b)) = f(b) + f(a) + f(b) = -2 + 3 - 2 = -1$. The answer is -1."
          - problem: "Let F:Set->Mon be free and U forgetful. Match the identity arrows whose transposes define (a) eta_X:X->UFX and (b) eps_M:FUM->M. Bank: 1=1_UM; 2=1_FX; 3=1_X; 4=1_FUM. Give the two numbers in order."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Use the source and target of the two hom-set bijections to identify which identity is transposed. The result is 2, 1."
          - problem: "For the free-monoid/forgetful adjunction, reconstruct the unit at X={a,b} and the counit at the free monoid FX by transposing the appropriate identity maps. Give eta_X(a) and the counit image of the word-of-words ((b,a),(),(a,b,b)). Encode each output word by its length followed by its letters, with a=1,b=2, and concatenate the two encodings. Derive both component maps from the identity transposes; neither component formula is supplied."
            answer: "1, 1, 5, 2, 1, 1, 2, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The unit is obtained by restricting the identity of the free monoid to its generators. The counit is the unique homomorphism extending the underlying identity of FX; its multiplication concatenates the input words. The result is 1, 1, 5, 2, 1, 1, 2, 2."
          - problem: "Write the full proof: in the free-monoid adjunction $F \\dashv U$ with $F(X) = X^*$ and hom-set correspondence $\\Phi$, the unit $\\eta_X = \\Phi_{X, X^*}(1_{X^*})$ sends every letter $x$ to the one-letter word $(x)$, the counit $\\varepsilon_M = \\Phi^{-1}_{UM, M}(1_{UM})$ sends every word $m_1 \\cdots m_k$ of elements of $M$ to the product $m_1 \\cdots m_k$ and the empty word to the identity element, and $\\eta$ and $\\varepsilon$ are natural transformations. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (form of the correspondence): for a homomorphism $h : X^* \\to M$, the map $\\Phi_{X, M}(h) : X \\to U(M)$ is $h \\circ i_X$, where $i_X$ inserts a letter as a one-letter word; conversely $\\Phi^{-1}(f)$ is the unique monoid homomorphism $X^* \\to M$ extending $f$. Step 2 (unit): $\\eta_X = \\Phi_{X, X^*}(1_{X^*}) = 1_{X^*} \\circ i_X = i_X$, so $\\eta_X(x) = (x)$ for every letter. Step 3 (counit): $\\varepsilon_M = \\Phi^{-1}(1_{UM})$ is the unique homomorphism $(UM)^* \\to M$ with $\\varepsilon_M((m)) = m$; since it preserves the operation, $\\varepsilon_M(m_1 \\cdots m_k) = m_1 \\cdots m_k$, and it maps the empty word to the identity element of $M$. Step 4 (naturality of $\\eta$): for a function $g : X \\to Y$, both $U(g^*) \\circ \\eta_X$ and $\\eta_Y \\circ g$ send a letter $x$ to the one-letter word $(g(x))$, which is the concrete form of the naturality of $\\Phi$ in both variables. Step 5 (naturality of $\\varepsilon$): for a monoid homomorphism $t : M \\to N$, both $t \\circ \\varepsilon_M$ and $\\varepsilon_N \\circ (Ut)^*$ send the word $m_1 \\cdots m_k$ to $t(m_1) \\cdots t(m_k)$, because $t$ preserves products. Conclusion: $\\eta : 1 \\Rightarrow UF$ and $\\varepsilon : FU \\Rightarrow 1$ are natural transformations, namely the unit and counit of $F \\dashv U$."
      - id: kp2
        name: Recovering the bijection from unit and counit
        key_prerequisites: [natural-transformations]
        constraints: "Reconstruct the two hom-set maps from unit and counit. Establish inversehood using an explicitly typed naturality step and the appropriate triangle; do not announce inversehood before a counting question."
        exemplars:
          - problem: "In the Set adjunction F(C)=C x {0,1}, G(D)=D^{0,1}, unit eta_C(c) is the function j->(c,j), and counit eps_D(g,j)=g(j). Recover the forward hom-set bijection from eta. If h has values h(0,0)=5,h(0,1)=6,h(1,0)=7,h(1,1)=8, give the function Phi(h)(1) as (value at 0,value at 1)."
            answer: "(7, 8)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Recover the bijection: naturality of $\\Phi$ in the second variable applied to $h: FC \\to D$ gives $\\Phi(h) = \\Phi(h \\circ 1_{FC}) = Gh \\circ \\Phi(1_{FC}) = Gh \\circ \\eta_C$. The full object is $\\Phi(h): C \\to D^2$. Compute $\\eta_1$: it is the map $j \\mapsto (1, j)$. Compose with $Gh$: $\\Phi(h)(1)$ is the map $j \\mapsto h(1, j)$. Read the table: $h(1,0) = 7$ and $h(1,1) = 8$. The answer is (7, 8)."
          - problem: "C is the one-object category of Z/5 under addition. Let F=G=Id. Natural transformations eta,eps are the arrows 2,3, respectively. Construct the candidate forward and inverse Hom maps from eta and eps. For each input in [1, 4], give first its forward image, then its inverse-map image, then its forward-then-inverse image; finish with 1 if these data define an adjunction, 0 otherwise. No transpose formula or triangle equation is supplied."
            answer: "3, 4, 1, 1, 2, 4, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Derive the Hom maps as composition with the unit and counit. Their two round trips translate by the triangular composite; inversehood for every arrow is equivalent to both triangle equations. The result is 3, 4, 1, 1, 2, 4, 1."
          - problem: "For F(X)=X x {0,1},G(Y)=Y^{0,1}, the counit is eps_Y(g,j)=g(j). Reconstruct the inverse hom-set map from the counit. A map k:{0,1}->D^{0,1} has k(0)=(5,8),k(1)=(2,7). Give its inverse transpose at (1,0)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Naturality of $\\Psi$ in the first variable gives the recovery formula $\\Psi(k) = \\varepsilon_D \\circ Fk$. The full object is $\\Psi(k): C \\times 2 \\to D$. Compute $Fk$ at $(1,0)$: it is the pair $(k(1), 0)$. Apply the counit: $\\varepsilon_D(k(1), 0) = k(1)(0)$. Read $k(1) = (2, 7)$: the value at 0 is 2. The answer is 2."
          - problem: "Let F left adjoint to G have unit eta and counit eps. Recover Phi(h) for h:FC->D and Psi(k) for k:C->GD by constructing typed composites. Bank: 1=eta_C:C->GFC; 2=G(h):GFC->GD; 3=F(k):FC->FGD; 4=eps_D:FGD->D. Give the paths for Phi(h), then Psi(k), in traversal order."
            answer: "1, 2, 3, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The unit inserts C into GFC; applying G to h reaches GD. The inverse uses F(k) followed by the counit. The result is 1, 2, 3, 4."
          - problem: "For Phi_C,D:Hom(FC,D)->Hom(C,GD), let h:FC->D. Step 1: h=h after 1_FC. Step 2: Phi(h)=G(h) after Phi(1_FC) by naturality in the first variable. Step 3: Phi(1_FC)=eta_C. Step 4: hence Phi(h)=G(h) after eta_C. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The displayed equation is the second-variable naturality square: its target object changes from FC to D. The first-variable justification is invalid. This is the first unsupported step."
          - problem: "C is the one-object category of Z/7 under addition. Let F=G=Id. Natural transformations eta,eps are the arrows 3,2, respectively. Construct the candidate forward and inverse Hom maps from eta and eps. For each input in [0, 5], give first its forward image, then its inverse-map image, then its forward-then-inverse image; finish with 1 if these data define an adjunction, 0 otherwise. No transpose formula or triangle equation is supplied."
            answer: "3, 2, 5, 1, 0, 3, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Derive the Hom maps as composition with the unit and counit. Their two round trips translate by the triangular composite; inversehood for every arrow is equivalent to both triangle equations. The result is 3, 2, 5, 1, 0, 3, 0."
          - problem: "Write the full proof: given an adjunction $F \\dashv G$ with hom-set bijection $\\Phi$ natural in both variables, unit $\\eta_C = \\Phi(1_{FC})$ and counit $\\varepsilon_D = \\Phi^{-1}(1_{GD})$, the formulas $\\Phi(h) = Gh \\circ \\eta_C$ and $\\Phi^{-1}(k) = \\varepsilon_D \\circ Fk$ follow from naturality, and the two maps they define are mutually inverse. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (naturality of $\\Phi$, second variable): apply naturality in $D$ to the map $h: FC \\to D$ acting on $1_{FC}$: $\\Phi(h) = \\Phi(h \\circ 1_{FC}) = Gh \\circ \\Phi(1_{FC}) = Gh \\circ \\eta_C$. Step 2 (naturality of $\\Psi = \\Phi^{-1}$, first variable): dually, naturality in $C$ applied to $k: C \\to GD$ acting on $1_{GD}$ gives $\\Psi(k) = \\Psi(1_{GD} \\circ k) = \\Psi(1_{GD}) \\circ Fk = \\varepsilon_D \\circ Fk$. Step 3 (first direction): $\\Psi(\\Phi(h)) = \\varepsilon_D \\circ FGh \\circ F\\eta_C = h \\circ \\varepsilon_{FC} \\circ F\\eta_C = h \\circ 1_{FC} = h$, using the naturality square $\\varepsilon_D \\circ FGh = h \\circ \\varepsilon_{FC}$ and the triangle identity $\\varepsilon_{FC} \\circ F\\eta_C = 1_{FC}$. Step 4 (second direction): $\\Phi(\\Psi(k)) = G\\varepsilon_D \\circ GFk \\circ \\eta_C = G\\varepsilon_D \\circ \\eta_{GD} \\circ k = 1_{GD} \\circ k = k$, using the naturality square $GFk \\circ \\eta_C = \\eta_{GD} \\circ k$ and the triangle identity $G\\varepsilon_D \\circ \\eta_{GD} = 1_{GD}$. Step 5 (conclusion): $\\Phi$ and $\\Psi$ are mutually inverse, so the unit and counit determine the whole adjunction bijection. Compare your written proof with this outline; the answer is See the solution."
    diagnostic_exemplar:
      problem: "For an adjunction $F\\dashv G$ with hom-set bijection $\\Phi$, unit $\\eta_C=\\Phi(1_{FC})$ and counit $\\varepsilon_D=\\Phi^{-1}(1_{GD})$, derive the formulas $\\Phi(h)=Gh\\circ\\eta_C$ and $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$ from the naturality of $\\Phi$."
      answer: "Naturality of $\\Phi$ in the second variable, applied to $h\\colon FC\\to D$, gives $\\Phi(h)=\\Phi(h\\circ 1_{FC})=Gh\\circ\\Phi(1_{FC})=Gh\\circ\\eta_C$. Dually, naturality of $\\Phi^{-1}$ in the first variable, applied to $k\\colon C\\to GD$, gives $\\Phi^{-1}(k)=\\Phi^{-1}(1_{GD}\\circ k)=\\Phi^{-1}(1_{GD})\\circ Fk=\\varepsilon_D\\circ Fk$. So the unit and counit encode the whole bijection."
      solution_sketch: "Feed an identity into naturality of $\\Phi$: write $h=h\\circ 1_{FC}$ and move $h$ out through the naturality square, leaving $Gh\\circ\\Phi(1_{FC})$. The dual move on $\\Phi^{-1}$, writing $k=1_{GD}\\circ k$, gives the counit formula."
    anki_seeds:
      - front: "Unit of $F\\dashv G$ (type and transpose)?"
        back: "$\\eta\\colon 1\\Rightarrow GF$, with $\\eta_C=\\Phi(1_{FC})$."
        type: basic
      - front: "Counit of $F\\dashv G$ (type and transpose)?"
        back: "$\\varepsilon\\colon FG\\Rightarrow 1$, with $\\varepsilon_D=\\Phi^{-1}(1_{GD})$."
        type: basic
      - front: "Adjunction transpose of $h\\colon FC\\to D$ in terms of $\\eta$?"
        back: "$\\Phi(h)=Gh\\circ\\eta_C$."
        type: basic
      - front: "Adjunction inverse-transpose of $k\\colon C\\to GD$ in terms of $\\varepsilon$?"
        back: "$\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$."
        type: basic

  - id: triangle-identities
    name: The Triangle Identities
    core: true
    difficulty: 0.8
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: unit-counit
        weight: 0.6
        key: true
      - id: natural-transformations
        weight: 0.3
        key: true
      - id: vertical-horizontal-composition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Statement of the zig-zag identities
        key_prerequisites: [unit-counit]
        constraints: "Construct both whiskered triangle paths and chase general elements from derived unit/counit components. For a modified component, derive a concrete failure of the relevant triangle."
        exemplars:
          - problem: "For F:C->D,G:D->C, unit eta:Id_C=>GF and counit eps:FG=>Id_D, construct both triangle paths. Bank: 1=F eta:F=>FGF; 2=eps F:FGF=>F; 3=eta G:G=>GFG; 4=G eps:GFG=>G; 5=G eta: ill-typed here. Give first the F-path, then the G-path, in traversal order."
            answer: "1, 2, 3, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Whisker eta and eps on the sides that produce endomorphism paths on F and G, respectively. The result is 1, 2, 3, 4."
          - problem: "For the free-monoid/forgetful adjunction, derive both triangle paths from their whiskered unit/counit components. Use the word w=[1, 2, 1]. One path starts with w in F(X); the other starts with w regarded as an element of U(F(X)). Before applying the respective counits, encode each word-of-words by the lengths of its inner words. Give the first intermediate encoding, then the second. The final triangle outputs are not requested."
            answer: "1, 1, 1, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "In the F-triangle, the free functor extends the unit letter by letter, producing a word of singleton words. In the U-triangle, the unit treats the entire monoid element w as one letter, producing a singleton word whose entry is w. The result is 1, 1, 1, 3."
          - problem: "For the free-monoid/forgetful adjunction, derive both triangle paths from their whiskered unit/counit components. Use the word w=[2, 1]. One path starts with w in F(X); the other starts with w regarded as an element of U(F(X)). Before applying the respective counits, encode each word-of-words by the lengths of its inner words. Give the first intermediate encoding, then the second. The final triangle outputs are not requested."
            answer: "1, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "In the F-triangle, the free functor extends the unit letter by letter, producing a word of singleton words. In the U-triangle, the unit treats the entire monoid element w as one letter, producing a singleton word whose entry is w. The result is 1, 1, 2."
          - problem: "For the free-monoid adjunction on an alphabet with distinct a,b, replace its counit on words of words by concatenation in reverse outer order. Keep the standard unit. Construct the resulting F-triangle composite. Find the least word length k at which the identity fails."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Take a general word w = x1 x2 ... xk in the free monoid on X. F eta_X sends w to the word of one-letter words, and the variant counit concatenates them in reverse order, giving xk ... x1. Compare with the identity map: for k = 1 reversal fixes every word, while for k = 2 the word ab goes to ba, which differs from ab. The smallest such k is 2."
          - problem: "For the free-monoid adjunction, replace eta_X(x) by xx and keep the standard counit. Derive the resulting F-triangle composite on a general word of length k. Give its output length as a formula in k."
            answer: "2k"
            answer_contract: {"kind": "function", "vars": ["k"]}
            solution_sketch: "Step 1 (chase rule for the modified unit): the modified unit sends each letter x to the two-letter word (x)(x), so the modified extension F eta sends the general word w = x1 x2 ... xk to a word of k two-letter words. Step 2 (counit concatenation rule): the counit at the free monoid on the alphabet multiplies a word of words out by concatenation, joining the k blocks of length 2 in their order. Step 3 (count): concatenating k blocks of length 2 gives a word of 2k letters, so the composite moves every nonempty word. The answer is 2k."
          - problem: "For free monoid F left adjoint to U, keep the usual counit but replace the unit by x->xx. Test both triangle identities without assuming either. For X={a}, test the F-triangle at the one-letter word a. For M=(N,+,0), test the U-triangle at 3. Give the first output word length, the second output number, then the validity bits for the two identities."
            answer: "2, 6, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Left whiskering extends the doubled-letter insertion and the counit concatenates; the other triangle inserts a monoid element twice and then evaluates it. Both composites differ from their tested identities. The result is 2, 6, 0, 0."
          - problem: "Write the full proof: for the free-monoid adjunction, both triangle identities hold, with whiskering written explicitly; verify each one by chasing a general element. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (first identity, whiskering explicit): eps F o F eta = 1_F must be shown. Step 2: at a set X, take a general word w = x1 x2 ... xk in the free monoid on X. Step 3: F eta_X sends w to the word of one-letter words, and the counit at the free monoid on X concatenates it back to x1 x2 ... xk = w, so each component of eps F o F eta is the identity. Step 4 (second identity, whiskering explicit): G eps o eta G = 1_G must be shown. Step 5: at a monoid M, take a general element m of the underlying set; the unit turns m into the one-entry word (m), and U eps_M multiplies it out to m, so each component of G eps o eta G is the identity. This proves both zig-zag identities for the free-monoid adjunction."
      - id: kp2
        name: Deriving a triangle identity from the transposes
        key_prerequisites: [unit-counit]
        constraints: "Derive each triangle by applying Phi or its inverse once to a defining identity-transpose equation. Grade the correct map, object substitutions, or whiskered composite, never a supplied composite value."
        exemplars:
          - problem: "Starting only with eta_C=Phi_C,FC(1_FC), derive a triangle by applying one inverse bijection. Match (a) the bijection to apply, (b) the resulting left-hand composite to the banks. Bijection bank: 1=Phi inverse at (C,FC); 2=Phi at (C,FC); 3=Phi inverse at (GC,C). Composite bank: 1=F eta_C after eps_FC; 2=eps_FC after F eta_C; 3=G eps_C after eta_GC. Give the two bank numbers."
            answer: "1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Apply the inverse bijection at exactly the same object pair; its counit formula produces the F-triangle. The result is 1, 2."
          - problem: "Starting with eps_D=Phi inverse_GD,D(1_GD), derive the G-triangle by applying one bijection. Bank: 1=Phi inverse_GD,D; 2=Phi_GD,D; 3=Phi_D,GD. Arrow bank: 1=eta_GD:GD->GFGD; 2=G eps_D:GFGD->GD; 3=F eta_D:FD->FGFD. Give the bijection number followed by the resulting two-arrow path in traversal order."
            answer: "2, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Apply Phi to cancel its inverse, then evaluate the forward-transpose formula at the counit. The result is 2, 1, 2."
          - problem: "Let H be self-adjoint, H left adjoint to H, with Hom bijection Phi, unit eta, and counit eps. Starting only from eta_C=Phi_C,HC(1_HC), derive the associated triangle by applying one inverse bijection and expanding the transpose formula once. All expressions in this bank are endomorphisms of HC: 1=(eps_HC after H(eta_C)) after (eps_HC after H(eta_C)); 2=eps_HC after H(eta_C); 3=H(eps_C) after eta_HC; 4=1_HC. Give the number of the unreduced expression obtained from the transpose formula, then the number obtained by cancelling Phi with its inverse. Do not simplify the unreduced expression using a triangle identity."
            answer: "2, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Apply the inverse of the bijection used in the defining equation, then substitute its general transpose formula. The other triangle is a parallel, equally well-typed composite, but it comes from the other identity-transpose definition. The result is 2, 4."
          - problem: "Step 1: eps_D=Phi inverse_GD,D(1_GD). Step 2: apply Phi inverse to eps_D to undo the displayed inverse. Step 3: use the inverse-transpose formula. Step 4: conclude the G-triangle. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Phi inverse accepts an arrow GD->GD here, while eps_D lies on the other side of the hom-set bijection. Apply Phi. This is the first unsupported step."
          - problem: "Let H be self-adjoint, H left adjoint to H, with Hom bijection Phi, unit eta, and counit eps. Starting only from eps_C=Phi inverse_HC,C(1_HC), derive the associated triangle by applying one forward bijection and expanding the transpose formula once. All expressions in this bank are endomorphisms of HC: 1=(eps_HC after H(eta_C)) after (eps_HC after H(eta_C)); 2=eps_HC after H(eta_C); 3=H(eps_C) after eta_HC; 4=1_HC. Give the number of the unreduced expression obtained from the transpose formula, then the number obtained by cancelling Phi with its inverse. Do not simplify the unreduced expression using a triangle identity."
            answer: "3, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Apply the inverse of the bijection used in the defining equation, then substitute its general transpose formula. The other triangle is a parallel, equally well-typed composite, but it comes from the other identity-transpose definition. The result is 3, 4."
          - problem: "Step 1: eta_C=Phi_C,FC(1_FC). Step 2: apply Phi inverse_C,FC to obtain Phi inverse(eta_C)=1_FC. Step 3: in eps_D after F(k), substitute k=eta_C and D=C. Step 4: conclude the F-triangle. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The target of eta_C is GFC, so D must be FC. This is the first unsupported step."
          - problem: "Write the full proof: using e_D = Phi inverse of 1 at G(D) and the formula Phi(h) = G h after u_C, derive the second triangle identity G e_D after u at G(D) = 1 at G(D). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (defining equation of the counit): the hypothesis gives e_D = Phi inverse of 1 at G(D), where 1 at G(D) is the identity arrow on G(D). Step 2 (apply the transpose once): applying Phi to both sides of that equation yields Phi(e_D) = 1 at G(D), since Phi undoes Phi inverse. Step 3 (evaluate the transpose formula): the transpose sends h from F(C) to D to G h after u_C; here h = e_D has domain F(G(D)), so C = G(D), and Phi(e_D) = G e_D after u at G(D). Step 4 (conclude): combining the two lines gives G e_D after u at G(D) = 1 at G(D), the second triangle identity. No diagram is chased: one application of Phi and one evaluation of the transpose formula suffice."
      - id: kp3
        name: Triangle identities as an equivalent definition
        key_prerequisites: [natural-transformations]
        constraints: "Compare natural unit-counit data with inverse hom-set maps. Construct typed triangles, test the equivalence on one-object categories, and express a triangle using 2-cell whiskering. All six exemplars are closed; retain this KP as non-proof."
        exemplars:
          - problem: "C is the one-object category of Z/5 under addition. Let F=G=Id. Natural transformations eta,eps are the arrows 1,4, respectively. Construct the candidate forward and inverse Hom maps from eta and eps. For each input in [0, 2], give first its forward image, then its inverse-map image, then its forward-then-inverse image; finish with 1 if these data define an adjunction, 0 otherwise. No transpose formula or triangle equation is supplied."
            answer: "1, 4, 0, 3, 1, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Derive the Hom maps as composition with the unit and counit. Their two round trips translate by the triangular composite; inversehood for every arrow is equivalent to both triangle equations. The result is 1, 4, 0, 3, 1, 2, 1."
          - problem: "C is the one-object category of Z/7 under addition. Let F=G=Id. Natural transformations eta,eps are the arrows 2,4, respectively. Construct the candidate forward and inverse Hom maps from eta and eps. For each input in [1, 3], give first its forward image, then its inverse-map image, then its forward-then-inverse image; finish with 1 if these data define an adjunction, 0 otherwise. No transpose formula or triangle equation is supplied."
            answer: "3, 5, 0, 5, 0, 2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Derive the Hom maps as composition with the unit and counit. Their two round trips translate by the triangular composite; inversehood for every arrow is equivalent to both triangle equations. The result is 3, 5, 0, 5, 0, 2, 0."
          - problem: "Consider the one-object category with arrows integers and composition addition. Let F=G=Id. A natural unit is the arrow a and a natural counit is b. Fix a=7. Find b so that this unit-counit data define an adjunction."
            answer: "-7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both triangle composites must be the identity arrow 0. This is also exactly the condition that the proposed translations on hom-sets be inverse. The result is -7."
          - problem: "On the one-object category of Z/5 under addition, take F=G=Id, eta=2,eps=1. Define the candidate hom-set maps from this data. Give the values of their round trip on arrows 0,1,2,3,4 in order, and thereby test the triangle-definition claim."
            answer: "3, 4, 0, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The proposed transpose maps are translation by the unit and counit. Their composite equals the relevant triangle followed by the input; this test detects its failure. The result is 3, 4, 0, 1, 2."
          - problem: "In a 2-category, 1-cells F:C->D and G:D->C have 2-cells eta:1_C=>GF and eps:FG=>1_D. Construct the F-triangle without hom-sets. Number the 2-cells 1=F eta, 2=eta F, 3=eps F, 4=F eps. Give the two numbers in vertical traversal order."
            answer: "1, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Whiskering forms the two composable 2-cells on F; their vertical composite must be its identity 2-cell. The result is 1, 3."
          - problem: "On the one-object category of integers under addition, let F=G=Id and eta=-4. Reconstruct the counit from the requirement that the candidate maps between hom-sets be mutually inverse. Give the counit arrow followed by the image of arrow 9 under the forward transpose."
            answer: "4, 5"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Inversehood for every arrow forces the triangle sum to vanish; the forward transpose then adds the unit. The result is 4, 5."
    diagnostic_exemplar:
      problem: "Using $\\eta_C=\\Phi(1_{FC})$ and $\\Phi^{-1}(k)=\\varepsilon_D\\circ Fk$, prove the first triangle identity $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$."
      answer: "Apply $\\Phi^{-1}$ to both sides of $\\eta_C=\\Phi(1_{FC})$: $\\Phi^{-1}(\\eta_C)=1_{FC}$. Now evaluate $\\Phi^{-1}$ on $k=\\eta_C\\colon C\\to GFC$ (so $D=FC$) with the formula: $\\Phi^{-1}(\\eta_C)=\\varepsilon_{FC}\\circ F\\eta_C$. Equating the two expressions gives $\\varepsilon_{FC}\\circ F\\eta_C=1_{FC}$, which holding for all $C$ is $\\varepsilon F\\circ F\\eta=1_F$."
      solution_sketch: "Apply $\\Phi^{-1}$ to the definition $\\eta_C=\\Phi(1_{FC})$ to get $\\Phi^{-1}(\\eta_C)=1_{FC}$, then evaluate that same $\\Phi^{-1}(\\eta_C)$ using the formula $\\varepsilon\\circ F(-)$. Equating the two readings of one value is the identity."
    anki_seeds:
      - front: "First triangle (zig-zag) identity, involving $F\\eta$?"
        back: "$\\varepsilon F\\circ F\\eta=1_F$."
        type: basic
      - front: "Second triangle (zig-zag) identity, involving $\\eta G$?"
        back: "$G\\varepsilon\\circ\\eta G=1_G$."
        type: basic
      - front: "An adjunction can be defined as functors $F,G$ plus $\\eta,\\varepsilon$ satisfying the {{c1::triangle identities}}."
        back: "triangle identities"
        type: cloze

