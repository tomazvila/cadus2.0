          - problem: "Write the full proof: the free monoid functor is left adjoint to the forgetful functor from monoids to sets, showing both that restriction to the generators is well defined and that extension from the generators is unique. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full statement: for a set $X$, let $X^*$ be the free monoid of words on $X$; for a monoid $M$, let $U(M)$ be its underlying set. Step 1, the map: send a homomorphism $h\\colon X^* \\to M$ to its restriction $\\bar{h}\\colon X \\to U(M)$, $\\bar{h}(x) = h(x)$. Step 2, restriction is well defined: $h$ is a function on the whole set $X^*$, so restricting it to the subset of one-letter words gives an honest function $X \\to U(M)$; no choice is involved. Step 3, extension: given $g\\colon X \\to U(M)$, define $\\hat{g}(x_1 \\cdots x_n) = g(x_1) \\cdots g(x_n)$ and send the empty word to the identity of $M$; a word factors into letters in exactly one way, so $\\hat{g}$ is one well-defined homomorphism. Step 4, uniqueness: any homomorphism $h$ with $h|_X = g$ must satisfy $h(x_1 \\cdots x_n) = h(x_1) \\cdots h(x_n) = g(x_1) \\cdots g(x_n)$ and $h(\\epsilon) = 1$, hence $h = \\hat{g}$; so restriction and extension are inverse bijections. Step 5, conclusion: the bijection $\\mathrm{Hom}_{\\mathbf{Mon}}(X^*, M) \\cong \\mathrm{Hom}_{\\mathbf{Set}}(X, U(M))$ is natural in $X$ and $M$, with unit the insertion of letters, so the free monoid functor is left adjoint to the forgetful functor."
    diagnostic_exemplar:
      problem: "Using the currying adjunction $(-\\times A)\\dashv(-)^A$ and associativity of the product, prove the exponential law $C^{A\\times B}\\cong(C^B)^A$ in a cartesian closed category."
      answer: "For every $X$: $\\mathrm{Hom}(X,C^{A\\times B})\\cong\\mathrm{Hom}(X\\times(A\\times B),C)\\cong\\mathrm{Hom}((X\\times A)\\times B,C)\\cong\\mathrm{Hom}(X\\times A,C^B)\\cong\\mathrm{Hom}(X,(C^B)^A)$ — uncurry, reassociate, curry twice — each step natural in $X$. Two objects representing the same functor are isomorphic (Yoneda), so $C^{A\\times B}\\cong(C^B)^A$."
      solution_sketch: "Do not construct a map between the two objects directly. Chain hom-set bijections at an arbitrary $X$ — uncurry, reassociate the product, curry twice — checking each step is natural in $X$; Yoneda then upgrades the isomorphism of representables to an isomorphism of the objects themselves."
