          - problem: "F:Set->Alg is free and U:Alg->Set is forgetful. Recover the unit by transposing 1_FX. Match its domain and codomain to bank 1=X; 2=FX; 3=UFX; 4=FUX. Give the domain and codomain numbers."
            answer: "1, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The forward hom-set correspondence changes an algebra map FX->A into a set map X->UA. The result is 1, 3."
          - problem: "F:Set->Alg is free and U forgetful. Recover the counit by inverse-transposing 1_UA. Match its domain and codomain to bank 1=UA; 2=A; 3=FUA; 4=UFA. Give the two numbers."
            answer: "3, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The inverse correspondence takes a set map X->UA to an algebra map FX->A, with X=UA. The result is 3, 2."
          - problem: "F:Set->Mon is the free functor and U forgets multiplication. A set X has three elements and a monoid A has four elements. Derive the natural hom-set correspondence from the universal extension property, then determine the number of homomorphisms FX->A."
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the hom-set bijection of the adjunction, which matches monoid homomorphisms from F(X) to A with functions from X to the underlying set of A. Rule of the adjunction: count the homomorphisms by counting the functions. Each of the 3 elements of X independently chooses one of the 4 elements of A, so the number of functions is 4*4*4. That product is 64. The answer is 64."
          - problem: "F:Set->Grp is free and U forgetful. A set X has two elements and a group G has five elements. Use existence and uniqueness of homomorphic extensions of generator maps to determine the number of group maps FX->G; no hom-set formula is supplied."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the hom-set bijection of the adjunction, which matches group homomorphisms from the free group on X to G with functions from X to the underlying set of G. Rule of the adjunction: count the homomorphisms by counting the functions. Each of the 2 elements of X independently picks one of the 5 elements of G, so the number of functions is 5*5. That product is 25. The answer is 25."
          - problem: "For a free-forgetful adjunction F left adjoint to U and a set map g:X->UA, reconstruct its unique algebraic extension using the counit. Bank: 1=F(g):FX->FUA; 2=eps_A:FUA->A; 3=eta_X:X->UFX; 4=U(eps_A):UFUA->UA. Give the two-arrow extension path."
            answer: "1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "First apply the free functor to the assignment of generators, then evaluate the resulting formal expressions in A. The result is 1, 2."
          - problem: "For F:Set->Mon and U:Mon->Set, Step 1: F takes sets to monoids. Step 2: the unit is a component of Id_Set=>UF. Step 3: eta_X has source X and target UFX. Step 4: it is a monoid homomorphism for every set X. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "A unit component lies in the source category of F, here Set. An arbitrary set X carries no specified monoid structure. This is the first unsupported step."
          - problem: "Write the full proof: Let F be the free functor and U the forgetful functor from a category of algebras to the category of sets. Prove that F is left adjoint to U, and describe the unit and the counit of this adjunction. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects): F(X) is the algebra of formal expressions on the generator set X, and U(A) is the underlying set of an algebra A. Step 2 (extension): every function f from X to U(A) extends uniquely to the homomorphism f-hat from F(X) to A that evaluates a formal expression by reading f on the generators. Step 3 (bijection): the assignment f to f-hat and restriction back to the generators are inverse to each other, and both sides are natural in X and in A, so homomorphisms from F(X) to A are in bijection with functions from X to U(A); by definition this says F is left adjoint to U. Step 4 (unit): the component eta_X from X to U(F(X)) sends x to its one-generator expression; it is the universal insertion of generators, because a function f out of X is exactly the restriction of its extension f-hat. Step 5 (counit): the component eps_A from F(U(A)) to A is the evaluation of formal expressions; it is the unique homomorphism extending the identity function on U(A), and it is surjective, so A is a quotient of the free algebra on its own members. Step 6 (triangles): evaluating an inserted generator returns that generator, and a formal expression on the generators of F(X) evaluates to itself; these are the triangle identities. Conclusion: F is left adjoint to U, the unit is the insertion of generators, and the counit is the evaluation."
      - id: kp2
        name: Free vector spaces
        key_prerequisites: [functor-examples]
        constraints: "Construct the free vector space or its transpose from generator data. Derive the counit from 1_UV and use it to identify the presentation kernel; do not supply the needed linear evaluation formula."
        exemplars:
          - problem: "The functor U:Vect_k->Set has a left adjoint F. Construct F(X) from the universal requirement that each function X->UV extend uniquely to a linear map. If X={a,b,c,d,e,f}, give the dimension of F(X)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free functor sends a set $X$ to $k^{(X)}$, the vector space with basis $\\{e_x : x \\in X\\}$, by the definition of a free vector space. A basis of that form has one vector $e_x$ per element of $X$, so $\\dim k^{(X)} = |X|$ by the definition of dimension. With $|X| = 6$, the answer is 6."
          - problem: "For F:Set->Vect_R free and U forgetful, recover the counit at V=R^2 as the inverse transpose of 1_UV. Give its value on 4e_(1,0)-3e_(0,1) as (x,y)."
            answer: "(4, -3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The counit is the linear map $\\varepsilon_V\\colon k^{(UV)}\\to V$ given by the formula $\\sum_v \\lambda_v e_v \\mapsto \\sum_v \\lambda_v v$. Apply it to the full element $4e_{(1,0)} - 3e_{(0,1)}$: linearity gives $4\\,(1,0) - 3\\,(0,1)$. Compute the combination: $4\\,(1,0) - 3\\,(0,1) = (4, -3)$. The answer is (4, -3)."
          - problem: "Let F:Set->Vect_R be left adjoint to U. A generator map j:{a,b}->U(R^2) sends a to (1,2),b to (0,-3). Construct its unique transpose T:F({a,b})->R^2. Give T(2e_a+3e_b) as (x,y)."
            answer: "(2, -5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "A linear map out of a free vector space is determined by its values on the basis, which is the universal property of $k^{(X)}$. Use linearity on the full element $2e_a + 3e_b$: $T(2e_a + 3e_b) = 2T(e_a) + 3T(e_b) = 2(1,2) + 3(0,-3)$. Compute: $(2, 4) + (0, -9) = (2, -5)$. The answer is (2, -5)."
          - problem: "Over the two-element field, V has vectors 0,u,v,u+v, and X={1,2,3}. Recover the hom-set correspondence for the free vector space on X and determine how many linear maps from that free space to V exist."
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The adjunction Free $\\dashv$ $U$ gives the bijection $\\mathrm{Hom}_{\\mathbf{Vect}}(k^{(X)}, V) \\cong \\mathrm{Hom}_{\\mathbf{Set}}(X, U(V))$: each function on the basis extends uniquely to a linear map, since $k^{(X)}$ is free. So the number of linear maps equals the number of functions from the 3-element set $X$ to the 4-element set $U(V)$. Count functions: $4^3 = 64$. The answer is 64."
          - problem: "For the free-vector-space adjunction over R, derive the counit at V=R^2 as an identity transpose. Let v=(1,1),w=(2,2). Find integers a,b with a positive and least possible such that a e_v+b e_w lies in its kernel. Give (a,b)."
            answer: "(2, -1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "By the counit formula $\\sum_v \\lambda_v e_v \\mapsto \\sum_v \\lambda_v v$, the kernel of $\\varepsilon_V$ records the linear relations among elements of $V$, and $V \\cong k^{(UV)}/\\ker\\varepsilon_V$, so the counit presents $V$ by generators (its elements) and relations. Write the relation: $a\\,v + b\\,w = a(1,1) + b(2,2) = (a+2b,\\ a+2b)$. Solve $(a + 2b, a + 2b) = (0,0)$ with $a$ positive and minimal: $b = -1$ and $a = 2$. The answer is (2, -1)."
          - problem: "For F:Set->Vect_R free, Step 1: the counit at V sends each formal basis element e_v to v. Step 2: every v has preimage e_v. Step 3: the counit is surjective. Step 4: it is injective, hence is an isomorphism. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The formal basis element indexed by the zero vector is a nonzero vector in FUV and maps to zero. Thus surjectivity cannot imply injectivity here. This is the first unsupported step."
          - problem: "Write the full proof: the free functor $X \\mapsto k^{(X)}$ is left adjoint to the forgetful functor $U\\colon\\mathbf{Vect}_k\\to\\mathbf{Set}$, via a bijection $\\mathrm{Hom}_{\\mathbf{Vect}}(k^{(X)}, V) \\cong \\mathrm{Hom}_{\\mathbf{Set}}(X, U(V))$ natural in $X$ and $V$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Define the free functor on objects: $\\mathrm{Free}(X) = k^{(X)}$, the vector space of finitely supported functions $X \\to k$, with basis $\\{e_x : x \\in X\\}$, where $e_x$ is the function that is $1$ at $x$ and $0$ elsewhere; on a function $f\\colon X \\to Y$ it is the linear map with $e_x \\mapsto e_{f(x)}$. Step 1 (the bijection): given a function $g\\colon X \\to U(V)$, define $g^{\\#}\\colon k^{(X)}\\to V$ by linear extension, $g^{\\#}\\big(\\sum_x \\lambda_x e_x\\big) = \\sum_x \\lambda_x g(x)$; this is the unique linear map with $g^{\\#}(e_x) = g(x)$, because a linear map out of a free space is determined by its values on the basis. Step 2 (the inverse): given a linear map $T\\colon k^{(X)}\\to V$, send it to the function $x \\mapsto T(e_x)$ in $\\mathbf{Set}$; the two constructions undo each other, so $\\mathrm{Hom}_{\\mathbf{Vect}}(k^{(X)}, V) \\cong \\mathrm{Hom}_{\\mathbf{Set}}(X, U(V))$. Step 3 (naturality): both constructions commute with precomposition in $X$ and postcomposition in $V$, since composition acts identically on both sides. Step 4 (conclusion): by the definition of adjunction via a natural hom-set bijection, Free $\\dashv$ $U$, with unit $\\eta_X\\colon X \\to U(k^{(X)})$ sending $x$ to the basis vector $e_x$."
      - id: kp3
        name: A forgetful functor with adjoints on both sides
        key_prerequisites: [adjunctions]
        constraints: "Recover the discrete and indiscrete constructions and their adjoint directions from automatic legality and unique extension of maps. Include Top/Set and Cat/Set; grade structure or canonical maps."
        exemplars:
          - problem: "For U:Top->Set, construct a left adjoint L on X={0,1} from the requirement that every function X->UY extend to a continuous map LX->Y. Subsets are encoded 0=empty,1={0},2={1},3=X. Give the set of codes that must be open in LX."
            answer: "{0, 1, 2, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Continuity of every map to the Sierpinski space forces every subset of X to be open. This recovers the discrete topology. The result is {0, 1, 2, 3}."
          - problem: "For Ob:Cat->Set, construct a left adjoint L on S={a,b}. Number possible arrows by endpoints: 1=a->a,2=a->b,3=b->a,4=b->b. Which arrow types must exist in L(S), with exactly one arrow for each listed type, so that arbitrary object assignments to every category extend uniquely to functors? Give the set of numbers."
            answer: "{1, 4}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Use arbitrary assignments into a discrete target to exclude nonidentity arrows; identities are forced by the category axioms. The result is {1, 4}."
          - problem: "For U:Top->Set, construct a right adjoint R on Y={0,1}. Its topology must make every function UX->Y continuous for every space X. Codes 0,1,2,3 represent empty,{0},{1},Y. Give the set of open-set codes permitted in RY."
            answer: "{0, 3}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Testing arbitrary maps from an indiscrete two-point source forces the codomain topology to be indiscrete. The result is {0, 3}."
          - problem: "For Ob:Cat->Set, construct a right adjoint R on {a,b}. Recover the number of arrows for each endpoint type a->a,a->b,b->a,b->b from unique extension of arbitrary object assignments. Give the four numbers."
            answer: "1, 1, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The walking-arrow category tests each endpoint pair. Existence and uniqueness force exactly one arrow, including the required identities. The result is 1, 1, 1, 1."
          - problem: "Let L and R be adjoints on the left and right of U:Top->Set. Determine the directions of the two canonical identity-underlying-set maps between L(X), X, R(UX), for a space X. Bank: 1=L(UX)->X; 2=X->L(UX); 3=R(UX)->X; 4=X->R(UX). Give the counit of L left adjoint to U, then the unit of U left adjoint to R."
            answer: "1, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The counit goes from the discrete version into X; the unit goes from X into the indiscrete version. Their continuity follows from the respective universal properties. The result is 1, 4."
          - problem: "A student proposes indiscrete:Set->Top as a left adjoint to U. Step 1: give {0,1} the indiscrete topology. Step 2: every function from this space to the discrete space {0,1} is continuous. Step 3: these functions give the required hom-set bijection. Step 4: this proves the adjunction. Which step is the first whose assertion or stated reason fails?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["All valid"], ["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The identity-underlying-set function to a discrete two-point target has a singleton preimage that is not open. This is the first unsupported step."
          - problem: "Write the full proof: the forgetful functor U from topological spaces to sets has a left adjoint, the discrete construction, and a right adjoint, the indiscrete construction, with each adjunction justified by the maps that are automatically continuous. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (left adjoint construction): give disc(X) the topology in which every subset of X is open. Step 2 (automatic legality): any function f from disc(X) to a space Y is continuous, because the preimage of any open set of Y is a subset of X and is therefore open. Step 3 (bijection): continuous maps disc(X) to Y correspond exactly to functions X to U(Y), which is the hom-set bijection showing the discrete construction is left adjoint to U. Step 4 (right adjoint construction): give indisc(Y) the topology whose only open sets are the empty set and Y. Step 5 (automatic legality): any function g from a space X to indisc(Y) is continuous, because the preimage of an open set of indisc(Y) is empty or all of X, both open in X. Step 6 (bijection): continuous maps X to indisc(Y) correspond exactly to functions U(X) to Y, the hom-set bijection showing U is left adjoint to the indiscrete construction. Conclusion: U carries a left adjoint, the discrete construction, and a right adjoint, the indiscrete construction."
    diagnostic_exemplar:
      problem: "Show that the forgetful functor $U\\colon\\mathbf{Top}\\to\\mathbf{Set}$ has both a left adjoint and a right adjoint, exhibiting the two hom-set bijections."
      answer: "Left adjoint: the discrete-space functor. Every function from a discrete space is continuous (all subsets are open in the source), so $\\mathrm{Hom}_{\\mathbf{Top}}(X_{\\mathrm{disc}},Y)\\cong\\mathrm{Hom}_{\\mathbf{Set}}(X,UY)$, natural in both variables: $\\mathrm{disc}\\dashv U$. Right adjoint: the indiscrete-space functor. Every function into an indiscrete space is continuous (only $\\varnothing$ and the whole set are open in the target), so $\\mathrm{Hom}_{\\mathbf{Top}}(X,Y_{\\mathrm{ind}})\\cong\\mathrm{Hom}_{\\mathbf{Set}}(UX,Y)$: $U\\dashv\\mathrm{ind}$."
      solution_sketch: "Ask on which side continuity comes for free. Every map out of a discrete space is continuous, giving $\\mathrm{disc}\\dashv U$; every map into an indiscrete space is continuous, giving $U\\dashv\\mathrm{ind}$. Each observation is itself the hom-set bijection."
    anki_seeds:
