          - problem: "Write the full proof: let $F : \\mathcal{C} \\to \\mathcal{D}$ and $G : \\mathcal{D} \\to \\mathcal{C}$ be functors with $F$ left adjoint to $G$ and unit $\\eta$. Prove that for every object $C$ of $\\mathcal{C}$ the arrow $\\eta_C : C \\to G(F(C))$ is universal from $C$ to $G$: every arrow $k : C \\to G(D)$ factors as $k = G(h) \\circ \\eta_C$ for a unique arrow $h : F(C) \\to D$, and show that the assignment sending $k$ to $h$ recovers the hom-set bijection; then obtain the counit version by dualizing. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full statement: $F \\dashv G$ gives a bijection $\\phi$ from arrows $F(C) \\to D$ to arrows $C \\to G(D)$, natural in $C$ and $D$, with unit $\\eta_C = \\phi(\\mathrm{id}_{F(C)})$. Step 1 (existence): given $k : C \\to G(D)$, set $h = \\phi^{-1}(k)$; naturality of $\\phi$ in $D$ applied to $h$ yields $\\phi(h) = G(h) \\circ \\phi(\\mathrm{id}_{F(C)}) = G(h) \\circ \\eta_C$, hence $k = G(h) \\circ \\eta_C$. Step 2 (uniqueness): if also $k = G(h') \\circ \\eta_C$, the same naturality gives $\\phi(h') = k = \\phi(h)$, and injectivity of $\\phi$ forces $h' = h$. Step 3 (recovering the bijection): the map sending $k$ to $h$ is exactly $\\phi^{-1}$, so the unique factorization is the hom-set bijection expressed through the unit. Step 4 (dualizing): reversing every arrow swaps $F$ with $G$ and $\\eta$ with the counit $\\varepsilon$, giving the couniversal form: every $h : F(C) \\to D$ factors as $h = \\varepsilon_D \\circ F(k)$ for a unique $k : C \\to G(D)$. This completes the proof; see the solution for the comparison."
