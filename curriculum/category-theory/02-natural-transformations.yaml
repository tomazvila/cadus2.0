unit: natural-transformations
course: category-theory
module: "Natural Transformations"
topics:
  - id: naturality-square
    name: The Naturality Square
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: functors
        weight: 0.5
        key: true
      - id: commutative-diagrams
        weight: 0.5
        key: true
      - id: functor-composition-identity
        weight: 0.2
      - id: diagram-chasing
        weight: 0.2
      - id: category-definition
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Components and their types
        key_prerequisites: [functors]
        constraints: "Require components and their types. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Let $\\mathcal{C}$ be the finite category with objects $A, B, C, D, E$ and non-identity morphisms $u\\colon A \\to B$, $v\\colon B \\to C$ and their composite from $A$ to $C$. Let $F, G\\colon \\mathcal{C} \\to \\mathcal{D}$ be parallel functors, and let $\\alpha\\colon F \\Rightarrow G$ be a natural transformation. How many components does $\\alpha$ have?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of the data): a natural transformation $\\alpha\\colon F \\Rightarrow G$ between parallel functors carries, for each object $X$ of $\\mathcal{C}$, one morphism $\\alpha_X\\colon F(X) \\to G(X)$ of $\\mathcal{D}$; the type of each component is fixed before any equation is written. Step 2 (indexing rule): the components are indexed by the objects of the domain category $\\mathcal{C}$, not by its morphisms and not by the objects of $\\mathcal{D}$. Step 3 (count): the objects of $\\mathcal{C}$ are $A, B, C, D, E$, which makes five. The answer is 5."
          - problem: "Let $\\mathcal{C}$ be the category with two objects $A, B$ and one non-identity morphism $u\\colon A \\to B$. Let $P$ be the chain $0 < 1 < 2$ viewed as a category; here a morphism exists from $x$ to $y$ exactly when $x \\le y$, and it is unique when it exists. Let $F, G\\colon \\mathcal{C} \\to P$ be the parallel functors given on objects by $F(A) = 0$, $F(B) = 2$, $G(A) = 1$, $G(B) = 2$. How many natural transformations $F \\Rightarrow G$ are there?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (type each component first): the component at $A$ must be a morphism $F(A) \\to G(A)$ in $P$, that is $0 \\to 1$; the component at $B$ must be $2 \\to 2$. Step 2 (hom rule of a poset): a morphism $x \\to y$ exists in $P$ exactly when $x \\le y$, and it is unique when it exists; since $0 \\le 1$ and $2 \\le 2$, both components exist and are forced. Step 3 (naturality in a thin category): for the only non-identity arrow $u\\colon A \\to B$, both legs of the naturality square are morphisms from $F(A)$ to $G(B)$, that is $0 \\to 2$, and a poset has at most one morphism between two objects, so the two legs agree. Hence exactly one natural transformation exists. The answer is 1."
          - problem: "Let $\\mathcal{C}$ be the category with objects $A, B, C$ and non-identity morphisms $u\\colon A \\to B$, $v\\colon B \\to C$ and their composite. Let $\\mathcal{D}$ be the chain $0 < 1 < 2 < 3 < 4$ viewed as a category. Let $F, G\\colon \\mathcal{C} \\to \\mathcal{D}$ be the parallel functors with $F(A) = 1$, $F(B) = 2$, $F(C) = 4$ and $G(A) = 1$, $G(B) = 3$, $G(C) = 4$ on objects. A natural transformation $\\alpha\\colon F \\Rightarrow G$ has one component at each object of $\\mathcal{C}$. Give the source and the target of the component $\\alpha_B$ as (source, target)."
            answer: "(2, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (typing rule for components): for parallel functors $F, G\\colon \\mathcal{C} \\to \\mathcal{D}$, the component of $\\alpha$ at an object $X$ is a morphism of $\\mathcal{D}$ whose source is $F(X)$ and whose target is $G(X)$. Step 2 (evaluate the functors at $B$): $F(B) = 2$ and $G(B) = 3$. Step 3 (read off the type): the component $\\alpha_B$ is the morphism from $2$ to $3$ in the chain $\\mathcal{D}$, so its source is $2$ and its target is $3$. The answer is (2, 3)."
          - problem: "Let $\\mathcal{C}$ be the chain $1 < 2 < 3 < 4$ viewed as a category, and let $P$ be the chain $0 < 1 < 2$ viewed as a category, in which a morphism from $x$ to $y$ exists precisely when $x \\le y$. Let $F, G\\colon \\mathcal{C} \\to P$ be the parallel functors that send $1, 2, 3, 4$ to $0, 2, 2, 2$ for $F$ and to $0, 1, 1, 2$ for $G$. A natural transformation $F \\Rightarrow G$ assigns to each object $i$ of $\\mathcal{C}$ one component, which is a morphism in $P$ between the images of $i$. Give the least object $i$ of $\\mathcal{C}$ at which this component cannot exist."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (type the component): the component at an object $i$ must be a morphism $F(i) \\to G(i)$ in the poset $P$. Step 2 (hom rule of a poset): such a morphism exists exactly when $F(i) \\le G(i)$ in the chain $0 < 1 < 2$. Step 3 (test the objects from the bottom up): at $i = 1$, $F(1) = 0 \\le G(1) = 0$, so the component exists; at $i = 2$, $F(2) = 2$ and $G(2) = 1$, and $2 \\le 1$ is false, so no component can exist there; object $3$ fails the same way and object $4$ succeeds. The least object with no component is $2$. The answer is 2."
          - problem: "Let F,G:C->D and H:D->E be functors, and alpha:F=>G a natural transformation. At X in C, reconstruct the types of alpha_X and H(alpha_X) from the definition of a component. Encode FX=1,GX=2,HFX=3,HGX=4. Give the source,target codes of alpha_X, then of H(alpha_X). Finally give 1 if alpha_X could instead be an arrow GX->FX without further assumptions, or 0 otherwise."
            answer: "1, 2, 3, 4, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A component of a transformation F to G runs from the value of F to the value of G at the same object. Applying H preserves that direction, and reversing it would require a separate transformation or inverse assumption. The resulting answer is 1, 2, 3, 4, 0."
          - problem: "Let $\\mathcal{C}$ be the category with two objects $A, B$ and one non-identity morphism $u\\colon A \\to B$. Let $F, G\\colon \\mathcal{C} \\to \\mathbf{Set}$ be parallel functors given on objects by $F(A) = \\{1, 2\\}$, $F(B) = \\{1, 2, 3, 4\\}$, $G(A) = \\{5, 6, 7\\}$, $G(B) = \\{5\\}$; on the arrow $u$, the function $F(u)$ sends $1$ and $2$ to themselves, and $G(u)$ sends $5$, $6$ and $7$ to $5$. For a natural transformation $\\alpha\\colon F \\Rightarrow G$, the component $\\alpha_B$ is a function. How many elements do the domain and the codomain of $\\alpha_B$ have? Give the answer as (domain, codomain)."
            answer: "(4, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (typing rule in $\\mathbf{Set}$): for parallel functors $F, G\\colon \\mathcal{C} \\to \\mathbf{Set}$, the component at an object $X$ is a function from the set $F(X)$, its source, to the set $G(X)$, its target. Step 2 (evaluate at $B$): $F(B) = \\{1, 2, 3, 4\\}$ has $4$ elements and $G(B) = \\{5\\}$ has $1$ element; the arrow data $F(u)$ and $G(u)$ plays no role in the type. Step 3 (conclusion): $\\alpha_B$ is a function with a domain of $4$ elements and a codomain of $1$ element. The answer is (4, 1)."
          - problem: "Write the full proof: let $F, G\\colon \\mathcal{C} \\to P$ be parallel functors from a category $\\mathcal{C}$ to a poset $P$ viewed as a category, and prove that there is exactly one natural transformation $F \\Rightarrow G$ when $F(A) \\le G(A)$ holds for every object $A$ of $\\mathcal{C}$, and none otherwise. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Proof. Step 1 (type every component first): for each object $A$ of $\\mathcal{C}$, a component must be a morphism $\\alpha_A\\colon F(A) \\to G(A)$ in $P$. Step 2 (hom sets of a poset): a poset viewed as a category has exactly one morphism from $x$ to $y$ when $x \\le y$, and none when $x \\le y$ fails. Step 3 (pointwise existence): hence a component at $A$ exists exactly when $F(A) \\le G(A)$, and when it exists it is unique, with no choice involved. Step 4 (count): if $F(A) \\le G(A)$ fails at even one object, no family of components exists and there is no natural transformation; if it holds at every object, the family of all components exists and is the only possible one. Step 5 (naturality is automatic): for any arrow $f\\colon A \\to B$ of $\\mathcal{C}$, functoriality gives $F(A) \\le F(B)$ and $G(A) \\le G(B)$, so transitivity yields $F(A) \\le G(B)$; both legs of the naturality square are morphisms from $F(A)$ to $G(B)$ in $P$, and a poset has at most one morphism between two given objects, so the two legs are equal. Step 6 (uniqueness): any two transformations $F \\Rightarrow G$ have the same forced component at every object, hence they are equal. Conclusion: there is exactly one natural transformation $F \\Rightarrow G$ when $F(A) \\le G(A)$ for every object $A$, and none otherwise. $\\square$"
      - id: kp2
        name: Writing and reading the square
        key_prerequisites: [commutative-diagrams]
        constraints: "Require writing and reading the square. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Let $t: F \\Rightarrow G$ be a natural transformation between functors $F, G: C \\to D$, and let $f: A \\to B$ be a morphism in $C$. The naturality square at $f$ has corners $F(A)$ top-left, $G(A)$ top-right, $F(B)$ bottom-left, $G(B)$ bottom-right. Its top edge is the component $t_A: F(A) \\to G(A)$, its left edge is $Ff$, and its right edge is $Gf$. State the morphism that runs along the bottom edge of this square."
            answer: "t_B"
            answer_contract: {"kind": "label", "options": [["t_B"], ["t_A"], ["Ff"], ["Gf"]]}
            solution_sketch: "Full object: the square has corners $F(A)$ top-left, $G(A)$ top-right, $F(B)$ bottom-left, $G(B)$ bottom-right. Step 1 (label the sides): the top edge is $t_A: F(A) \\to G(A)$, the left edge is $Ff: F(A) \\to F(B)$, and the right edge is $Gf: G(A) \\to G(B)$. Step 2 (read the bottom): the bottom edge runs from $F(B)$ to $G(B)$, which is exactly the component at $B$. The option $t_A$ names the top edge, $Ff$ names the left edge, and $Gf$ names the right edge, so each mislabels a side. The answer is t_B."
          - problem: "Let alpha:F=>G be a natural transformation and f:X->Y. Reconstruct its naturality square. Encode F(f)=1,G(f)=2,alpha_X=3,alpha_Y=4. Starting at FX and ending at GY, give the two edge codes in traversal order for the route that starts with a component of alpha, then the two codes for the other route. The edge positions and the naturality equation are not supplied; derive them from the transformation and f."
            answer: "3, 2, 1, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The X-component crosses from FX to GX, after which G(f) descends to GY. The other route first applies F(f) and then the Y-component; naturality asserts equality of these two routes. The resulting answer is 3, 2, 1, 4."
          - problem: "Let beta:P=>Q be natural and u:Y->X. Draw its naturality square with the image under P of the source of u at top-left, and both functor images of u pointing downward. Encode PX=1,PY=2,QX=3,QY=4,P(u)=5,Q(u)=6,beta_X=7,beta_Y=8. Give the four corner codes in top-left,top-right,bottom-left,bottom-right order. Then give the two arrow words in conventional composition order for the two equal routes, putting the route through QY first."
            answer: "2, 4, 1, 3, 6, 8, 7, 5"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Because u starts at Y, the top row contains PY and QY and the components are indexed accordingly. The route through QY is Q(u) after beta_Y, while the other is beta_X after P(u), which is the naturality equation for this arrow. The resulting answer is 2, 4, 1, 3, 6, 8, 7, 5."
          - problem: "For alpha:F=>G and f:X->Y, read the following proposed two-edge routes as categorical words, with the rightmost arrow applied first: (i) G(f) alpha_X; (ii) alpha_Y F(f); (iii) F(f) alpha_Y; (iv) alpha_X G(f). Treat FX,FY,GX,GY as four distinct objects. Give a bit for each word saying whether it is a well-typed path from FX to GY, then give the two indices of the paths whose equality is the naturality square. You must reconstruct the edge placements from their types."
            answer: "1, 1, 0, 0, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two transformation components form the horizontal edges and the two functor images form the vertical edges. Only the first two words traverse from FX to GY, so equating those routes writes the naturality square without an elementwise calculation. The resulting answer is 1, 1, 0, 0, 1, 2."
          - problem: "A student labels the naturality square for a transformation $t: F \\Rightarrow G$ at $f: A \\to B$. Step 1: place $F(A)$ top-left, $G(A)$ top-right, $F(B)$ bottom-left, $G(B)$ bottom-right. Step 2: the left edge is $Ff$ and the right edge is $Gf$. Step 3: the bottom edge is $t_A$, the arrow from $F(A)$ to $G(A)$. Step 4: the two paths from $F(A)$ to $G(B)$ agree, so naturality at $f$ reads $Gf \\circ t_A = t_B \\circ Ff$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: those are the standard corners of the naturality square. Step 2 is valid: $Ff$ goes down the left side from $F(A)$ to $F(B)$, and $Gf$ down the right side from $G(A)$ to $G(B)$. Step 3 is not valid: the bottom edge runs from $F(B)$ to $G(B)$, so it must be $t_B$; $t_A$ is the top edge, from $F(A)$ to $G(A)$. Step 4 states the correct equation, but it rests on the mislabeled Step 3. The answer is Step 3."
          - problem: "A naturality equation is beta_Y U(f)=V(f) beta_X for f:X->Y and beta:U=>V. Recover its square with U(X) at top-left and V(Y) at bottom-right, using the convention that functor images of f point downward and transformation components point rightward. Encode U(X)=1,U(Y)=2,V(X)=3,V(Y)=4,beta_X=5,U(f)=6,beta_Y=7,V(f)=8. Give its corners in top-left,top-right,bottom-left,bottom-right order, followed by its edges in top,right,bottom,left order. Read the positions from the typed composites in the equation."
            answer: "1, 3, 2, 4, 5, 8, 7, 6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The right-hand composite traverses the top and right edges, while the left-hand composite traverses the left and bottom edges. Their shared source and target and the intermediate objects determine every corner and edge of the square. The resulting answer is 1, 3, 2, 4, 5, 8, 7, 6."
          - problem: "Write the full proof: for functors $F, G: C \\to D$, a family $\\alpha = (\\alpha_A)$ with $\\alpha_A: F(A) \\to G(A)$ for each object $A$ of $C$, and a morphism $f: A \\to B$ in $C$, label the four sides of the naturality square with $\\alpha_A$, $Ff$, $Gf$, $\\alpha_B$ and show that $\\alpha$ is natural at $f$ exactly when the square commutes, that is, when $Gf \\circ \\alpha_A = \\alpha_B \\circ Ff$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (corners): place $F(A)$ top-left, $G(A)$ top-right, $F(B)$ bottom-left, $G(B)$ bottom-right, since $F$ and $G$ send the objects $A$ and $B$ to these four objects. Step 2 (label the sides, before writing any equation): the top edge is the component $\\alpha_A: F(A) \\to G(A)$; the left edge is $Ff: F(A) \\to F(B)$, the image of $f$ under $F$; the right edge is $Gf: G(A) \\to G(B)$; the bottom edge is $\\alpha_B: F(B) \\to G(B)$. Step 3 (paths): the two directed paths from $F(A)$ to $G(B)$ are the composite $Gf \\circ \\alpha_A$, going across then down, and the composite $\\alpha_B \\circ Ff$, going down then across. Step 4 (equation): the square commutes exactly when these two composites are equal, and that equality, $Gf \\circ \\alpha_A = \\alpha_B \\circ Ff$, is precisely the condition that $\\alpha$ is natural at $f$. Hence the labeled square states naturality at $f$."
      - id: kp3
        name: Checking a square elementwise in Set
        key_prerequisites: [diagram-chasing]
        constraints: "Require the learner to use checking a square elementwise in set. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Check the naturality square element by element to recover the missing map. The source category has one nonidentity arrow u:A->B. Functors F,G to Set have arrow value lists F(u)=[0, 1, 1], G(u)=[1, 2, 0]; their source and target sets are zero-based sets of the indicated sizes, with |F(B)|=2, |G(B)|=3. The component alpha_A has values [2, 0, 0]. Construct the unique alpha_B that makes alpha:F=>G natural. Give its full value list."
            answer: "0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Write the naturality square with the components at the correct objects; its commuting equation forces every value of the missing component. The resulting answer is 0, 1."
          - problem: "Use both elementwise routes, with no common-value claim assumed. The source category has one nonidentity arrow u:A->B. Functors F,G to Set have arrow value lists F(u)=[1, 0], G(u)=[2, 0]; their source and target sets are zero-based sets of the indicated sizes, with |F(B)|=2, |G(B)|=3. The component alpha_A has values [0, 1]. Construct the unique alpha_B that makes alpha:F=>G natural. Give its full value list."
            answer: "0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Write the naturality square with the components at the correct objects; its commuting equation forces every value of the missing component. The resulting answer is 0, 2."
          - problem: "Construct the only bottom component for which every elementwise square check succeeds. The source category has one nonidentity arrow u:A->B. Functors F,G to Set have arrow value lists F(u)=[2, 0, 1], G(u)=[0, 2, 1]; their source and target sets are zero-based sets of the indicated sizes, with |F(B)|=3, |G(B)|=3. The component alpha_A has values [1, 2, 0]. Construct the unique alpha_B that makes alpha:F=>G natural. Give its full value list."
            answer: "1, 0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Write the naturality square with the components at the correct objects; its commuting equation forces every value of the missing component. The resulting answer is 1, 0, 2."
          - problem: "For each set X choose a marked element c_X and let t_X(x) = (x, c_X); this family is a candidate natural transformation from the identity functor to the product functor P with P(g)(u, v) = (g(u), g(v)). Take X with elements 1, 2, 3 and marked element c_X = 2, and Y with elements 4, 5, 6 and marked element c_Y = 6; let f(1) = 4, f(2) = 5, f(3) = 5. Leg A is the composite P(f) after t_X, and leg B is the composite t_Y after f. Give the value of leg A and the value of leg B at the element 3, each as (a, b)."
            answer: "legA = (5, 5); legB = (5, 6)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "legA"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "legB"}]}
            solution_sketch: "The naturality square at f compares leg A, the composite P(f) after t_X, with leg B, the composite t_Y after f, where t_X(x) = (x, c_X) and t_Y(y) = (y, c_Y). Leg A on the element 3: t_X(3) = (3, 2) by the family definition, since c_X = 2, then P(f)(3, 2) = (f(3), f(2)) = (5, 5) by the functor action on maps. Leg B on the element 3: f(3) = 5, then t_Y(5) = (5, 6) by the family definition, since c_Y = 6. The legs differ in the second component because nothing forces f(c_X) = c_Y, so the family is not natural. The answer is legA = (5, 5); legB = (5, 6)."
          - problem: "Supply the correctly typed component rather than a projection with the wrong codomain. The source category has one nonidentity arrow u:A->B. Functors F,G to Set have arrow value lists F(u)=[0, 1], G(u)=[1, 0]; their source and target sets are zero-based sets of the indicated sizes, with |F(B)|=2, |G(B)|=2. The component alpha_A has values [1, 1]. Construct the unique alpha_B that makes alpha:F=>G natural. Give its full value list."
            answer: "0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Write the naturality square with the components at the correct objects; its commuting equation forces every value of the missing component. The resulting answer is 0, 0."
          - problem: "Recover the component and check the square at every input. The source category has one nonidentity arrow u:A->B. Functors F,G to Set have arrow value lists F(u)=[1, 0, 1], G(u)=[0, 1]; their source and target sets are zero-based sets of the indicated sizes, with |F(B)|=2, |G(B)|=2. The component alpha_A has values [0, 1, 0]. Construct the unique alpha_B that makes alpha:F=>G natural. Give its full value list."
            answer: "1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Write the naturality square with the components at the correct objects; its commuting equation forces every value of the missing component. The resulting answer is 1, 0."
          - problem: "Write the full proof: the family pr, given by pr_X(u, v) = v for every set X, is a natural transformation from the functor P with P(X) = X × X and P(g)(u, v) = (g(u), g(v)) to itself; check the naturality square elementwise on a general pair. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let P be the functor with P(X) = X × X and P(f) = f × f, so P(f)(u, v) = (f(u), f(v)) for a map f: X -> Y. Claim: pr_Y after P(f) = P(f) after pr_X for every map f. Elementwise check on a general pair (u, v) of X × X. Left leg: P(f)(u, v) = (f(u), f(v)) by the functor action on maps, then pr_Y(f(u), f(v)) = f(v) by the projection definition. Right leg: pr_X(u, v) = v by the projection definition, then f(v) by applying f. Conclusion: both legs send the general pair (u, v) to f(v), so the two composites are equal as functions, the square commutes for every f, and pr is a natural transformation from P to P."
    diagnostic_exemplar:
      problem: "Let $S\\colon\\mathbf{Set}\\to\\mathbf{Set}$ be the functor $X\\mapsto X\\sqcup X$, $f\\mapsto f\\sqcup f$, and let $\\iota_X\\colon X\\to X\\sqcup X$ be the left inclusion. Write the naturality square for $\\iota$ at $f\\colon X\\to Y$ and verify it elementwise."
      answer: "The square asks $(f\\sqcup f)\\circ\\iota_X=\\iota_Y\\circ f$. On $x\\in X$: the left leg puts $x$ in the left copy and applies $f$ there, giving the left-copy element $f(x)$; the right leg applies $f$ and then includes into the left copy, also giving left-copy $f(x)$. The two legs agree at every $x$, so the square commutes for every $f$ and $\\iota\\colon 1_{\\mathbf{Set}}\\Rightarrow S$ is natural."
      solution_sketch: "Write the square with legs $Sf=f\\sqcup f$ and $\\iota$, then chase a single $x\\in X$ both ways round; each route produces $f(x)$ in the left copy. That the copy-label matches is the entire content of naturality here."
    anki_seeds:
      - front: "The component of $\\alpha\\colon F\\Rightarrow G$ at an object $A$ has what type?"
        back: "$\\alpha_A\\colon FA\\to GA$ (a morphism of the target category)."
        type: basic
      - front: "The naturality square for $\\alpha$ at $f\\colon A\\to B$ commutes: {{c1::$Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$}}."
        back: "$Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$"
        type: cloze
      - front: "Why must $F$ and $G$ be parallel functors for $\\alpha\\colon F\\Rightarrow G$ to make sense?"
        back: "so each component $\\alpha_A\\colon FA\\to GA$ is typable and $Ff$, $Gf$ point the same way."
        type: basic

