          answer: '2'
          reveal: '$S(u)$ applies $u$ to each entry, so $S(u)(0,1)=(u(0),u(1))=(2,0)$ and the sum is $2$. Left whiskering works the same way: a functor applied to a component arrow acts on the elements through the arrow.'
        step_check:
