          - problem: 'Let $\mathcal{S}$ be the category whose objects are the four sets $\{a,b\}$, $\{1,2\}$, $\{x,y\}$ and $\{p,q\}$, and whose morphisms are all bijections between them. The category $\mathbf{B}(\mathbb{Z}/2)$ has one object and the two bijections of a two-element set. How many morphisms does $\mathcal{S}$ have in total?'
            answer: '32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $4$ choices of source and $4$ of target, and between any two two-element sets there are $2$ bijections. So $\mathcal{S}$ has $4\times4\times2=32$ morphisms, although it is equivalent to $\mathbf{B}(\mathbb{Z}/2)$ with only $2$.'
          - problem: 'Let $\mathbf{Mat}$ be the category with objects $0,1,2,\dots$ and with morphisms $m\to n$ the $n\times m$ matrices with entries in $\{0,1\}$, computing modulo $2$. An equivalence preserves the number of automorphisms of an object. How many isomorphisms are there from the object $2$ to itself in $\mathbf{Mat}$?'
