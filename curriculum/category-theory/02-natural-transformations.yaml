          - problem: "Construct the vertical composite on both objects and verify the categorical composition law. On the arrow category A->B, three Set functors have object set {0,...,1} and arrow maps F(u)=[1, 0],G(u)=[1, 0],H(u)=[1, 0]. Transformations alpha:F=>G and beta:G=>H have known A-components [0, 0] and [1, 0]. Construct both B-components from naturality, then construct (beta.alpha)_B and check its naturality square. Give the composite B-component value list."
            answer: "0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two naturality equations first determine alpha_B and beta_B. Pasting them proves that their composite satisfies the naturality equation for F and H. The resulting answer is 0, 0."
          - problem: "Claim: if α: F ⇒ G and β: G ⇒ H are natural transformations between functors from C to D, then the family with components (β·α)_A = α_A ∘ β_A is a natural transformation from F to H. Step 1: each component of a transformation F ⇒ H must be an arrow from FA to HA in D. Step 2: α_A goes from FA to GA, and β_A goes from GA to HA, so the middle functor G matches. Step 3: therefore α_A ∘ β_A is a defined arrow of D from FA to HA. Step 4: the naturality squares stack, so the family is natural. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Full object: the claim defines the composite with components α_A ∘ β_A and asserts it is natural. Step 1 is valid: a component of a transformation F ⇒ H must indeed go from FA to HA. Step 2 is valid: it restates the types of α_A and β_A, and the middle functor G matches on both sides. Step 3 is the first invalid step: β_A ends at HA while α_A starts at FA, so α_A ∘ β_A is not composable in D; the composable order is β_A ∘ α_A. Step 4 never becomes valid as written, because it builds on the broken Step 3; with the corrected order the squares do stack. The answer is Step 3."
          - problem: "Write the full proof: if α: F ⇒ G and β: G ⇒ H are natural transformations between functors from C to D, then the family with components (β·α)_A = β_A ∘ α_A is a natural transformation from F to H. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (types): α_A: FA → GA and β_A: GA → HA, and the middle functor G matches on both sides, so the composite β_A ∘ α_A: FA → HA is defined in D. Step 2 (naturality): for each arrow f: A → B in C, the naturality square for α at f gives Gf ∘ α_A = α_B ∘ Ff, and the square for β at f gives Hf ∘ β_A = β_B ∘ Gf. Step 3 (stack the squares): Hf ∘ (β_A ∘ α_A) = (β_B ∘ Gf) ∘ α_A = β_B ∘ (Gf ∘ α_A) = β_B ∘ (α_B ∘ Ff) = (β_B ∘ α_B) ∘ Ff, using only associativity and units in D. Step 4 (conclusion): the naturality square for β·α commutes at every arrow, verified componentwise in the target category D, so β·α: F ⇒ H is a natural transformation. This completes the proof."
