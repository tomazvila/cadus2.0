    knowledge_points:
      - id: kp1
        name: Whiskering on the left by a functor
        key_prerequisites: [naturality-proofs]
        constraints: "State the domain and codomain of the whiskered transformation before proving naturality."
        exemplars:
          - problem: "Let C be the category with objects A, B and one arrow f: A -> B besides identities. Define F, G: C -> Set by F(A) = F(B) = G(A) = G(B) = {0, 1}, with F(f) and G(f) both the swap 0 -> 1, 1 -> 0. Let alpha: F => G have alpha_A = alpha_B = the swap. Let L be the list functor on Set. The whiskering L alpha: LF => LG has component (L alpha)_A = L(alpha_A), and its domain functor is LF with codomain functor LG. Compute (L alpha)_A at the word [1, 1, 0]. Give the resulting word as a list of numbers."
            answer: "0, 0, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "State the typing first: the whiskered transformation L alpha goes from LF to LG. Rule of whiskering on the left: (L alpha)_A = L(alpha_A). The list functor acts entrywise, mapping each entry t of the word to alpha_A(t). The entries 1, 1, 0 map to 0, 0, 1. The answer is 0, 0, 1."
          - problem: "Let C be the category with one object A and no arrows besides the identity, so any family of functions gives a transformation. Let F, G, K: C -> Set with F(A) = {0, 1}, G(A) = {2, 3}, K(A) = {4, 5}. Let p: F => G have p_A: 0 -> 2, 1 -> 3, and q: G => K have q_A: 2 -> 5, 3 -> 4. Let H: Set -> Set be the functor H(X) = X x X with H(g)(u, v) = (g(u), g(v)). Compute (H(q.p))_A at the pair (0, 1) of H(F(A)). Give the answer as (a, b)."
            answer: "(5, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Compose the transformations first: (q.p)_A = q_A after p_A, which sends 0 to 5 and 1 to 4. Apply the functor H, whose rule acts on a pair coordinatewise: H(q_A after p_A) at (0, 1) gives (5, 4). Check by functoriality: (Hq)_A after (Hp)_A sends (0, 1) to (2, 3) and then to (5, 4), the same pair. The answer is (5, 4)."
          - problem: "Let C be the poset category of the chain 0 < 1 < 2 < 3. Let F: C -> C send x to x, let G: C -> C send every x to 3, and let H: C -> C send x to x + 1 for x < 3 and 3 to 3. There is a transformation alpha: F => G whose component alpha_x is the arrow x -> 3. The whiskering H alpha: HF => HG has component (H alpha)_1: HF(1) -> HG(1). Give the answer as (source, target)."
            answer: "(2, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "In a poset category every functor is a monotone map and arrows are inequalities. Rule of whiskering on the left: (H alpha)_1 = H(alpha_1), an arrow from HF(1) to HG(1). Compute the endpoints: HF(1) = H(F(1)) = H(1) = 2, and HG(1) = H(G(1)) = H(3) = 3. The answer is (2, 3)."
          - problem: "Let C be the category with objects A, B and one arrow f: A -> B besides identities. Let F, G: C -> Set with F(A) = {0}, F(B) = {1}, F(f): 0 -> 1, and G(A) = {5}, G(B) = {7}, G(f): 5 -> 7. Let alpha: F => G with alpha_A: 0 -> 5 and alpha_B: 1 -> 7. Let M: Set -> Set send each set X to X with one extra element * added, and each function g to the function that agrees with g on X and sends * to *. The whiskering M alpha: MF => MG has components (M alpha)_A = M(alpha_A). Evaluate both sides of the naturality equation for M alpha at f, on the element 0 of MF(A). Give the common value."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "State the typing: M alpha goes from MF to MG, with components M(alpha_A). Left side at 0: (M alpha)_A(0) = 5, then MG(f)(5) = 7. Right side at 0: MF(f)(0) = 1, then (M alpha)_B(1) = 7. The two sides agree because M applied to the naturality square of alpha still commutes, as M respects composition. The common value is 7."
          - problem: "Let alpha: F => G be a natural transformation between functors F, G: C -> D, and let H: D -> E be a functor. A student defines the whiskering and checks its naturality in four steps. Step 1: for each object A of C, set (H alpha)_A = H(alpha_A). Step 2: since alpha_A goes from FA to GA, the arrow H(alpha_A) goes from HFA to HGA. Step 3: therefore H alpha is a transformation from FH to GH. Step 4: naturality at f: A -> B requires HG(f) composed with (H alpha)_A to equal (H alpha)_B composed with HF(f). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is the definition of the component of the whiskering. Step 2 is valid: applying H to an arrow FA to GA gives an arrow HFA to HGA. Step 3 is not valid: the domain of H alpha is the composite HF, not FH, and the codomain is HG, not GH. Step 4 is valid: it states the naturality equation in the correct order. The first invalid step is Step 3."
          - problem: "Let p: F => G and q: G => K be transformations between functors from C to D, and let H: D -> E be a functor. A student proves H(q.p) = (Hq).(Hp) in three steps. Step 1: at each object A, (H(q.p))_A = H(q_A after p_A). Step 2: H(q_A after p_A) = H(q_A) after H(p_A). Step 3: this equals ((Hq).(Hp))_A for every object A, so the two transformations agree. Which hypothesis does Step 2 use?"
            answer: "H preserves composition"
            answer_contract: {"kind": "label", "options": [["H preserves composition"], ["H preserves identities"], ["H is full"], ["H is faithful"]]}
            solution_sketch: "Step 2 rewrites H applied to a composite of two arrows as the composite of the two images, which is exactly the hypothesis that H preserves composition. The option H preserves identities concerns H of an identity arrow, which proves H(1_F) = 1_HF instead, not this step. H is full and H is faithful say H is surjective or injective on arrows, facts the step never uses. The hypothesis used is H preserves composition."
          - problem: "Write the full proof: given a natural transformation alpha: F => G between functors F, G: C -> D and a functor H: D -> E, the whiskering H alpha: HF => HG with components (H alpha)_A = H(alpha_A) is a natural transformation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, domain and codomain: for each object A of C, the component alpha_A is an arrow FA to GA in D, so applying H gives an arrow HFA to HGA in E; hence the family H alpha goes from the composite functor HF to the composite functor HG, and this typing is stated before naturality. Step 2, naturality: take any arrow f: A -> B in C. Naturality of alpha gives alpha_B composed with F(f) equals G(f) composed with alpha_A. Apply the functor H to this equation; since H respects composition of arrows, HG(f) composed with H(alpha_A) equals H(alpha_B) composed with HF(f). Step 3, conclusion: this is exactly the naturality equation for the components (H alpha)_A, so H alpha: HF => HG is a natural transformation."
      - id: kp2
        name: Whiskering on the right by a functor
        key_prerequisites: [natural-transformations]
        constraints: "Right whiskering re-indexes components; never apply a functor to $\\alpha_A$ here."
        exemplars:
          - problem: "Let $\\mathcal{C}$ be the discrete category with objects $c_1, c_2$, and let $F, G\\colon\\mathcal{C}\\to\\mathbf{Set}$ with $F(c_1)=\\{0,1\\}\\times\\{0,1\\}$, $G(c_1)=\\{0,1\\}$, $F(c_2)=\\{5,6,7\\}\\times\\{5,6,7\\}$, $G(c_2)=\\{5,6,7\\}$. Let $\\alpha\\colon F\\Rightarrow G$ have components $\\alpha_{c_1}(x,y)=x$ and $\\alpha_{c_2}(x,y)=y$. Let $\\mathcal{B}$ be the discrete category with objects $b, b'$, and let $K\\colon\\mathcal{B}\\to\\mathcal{C}$ send $b\\mapsto c_1$ and $b'\\mapsto c_2$. Compute $(\\alpha K)_{b'}(6,5)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $(\\alpha K)_{b'}(6,5)$. Rule of right whiskering: $(\\alpha K)_{b'}=\\alpha_{K(b')}$, the component of $\\alpha$ re-indexed at $K(b')$, with no functor applied to it. Re-index: $K(b')=c_2$, so $(\\alpha K)_{b'}=\\alpha_{c_2}$, the map $(x,y)\\mapsto y$. Evaluate: $\\alpha_{c_2}(6,5)=5$. The answer is 5."
          - problem: "Let $\\mathcal{C}$ be the discrete category with objects $c_1, c_2$, and let $F, G, H\\colon\\mathcal{C}\\to\\mathbf{Set}$ each send both objects to the set $\\{0,1,2,3\\}$. Let $\\alpha\\colon F\\Rightarrow G$ have $\\alpha_{c_1}(x)=(x+1)\\bmod 4$ and $\\alpha_{c_2}(x)=(x+3)\\bmod 4$, and let $\\beta\\colon G\\Rightarrow H$ have $\\beta_{c_1}(x)=(2x)\\bmod 4$ and $\\beta_{c_2}(x)=(3x)\\bmod 4$. Let $\\mathcal{B}$ be the one-object category with object $\\bullet$, and let $K\\colon\\mathcal{B}\\to\\mathcal{C}$ send $\\bullet\\mapsto c_2$. Compute $((\\beta K)\\cdot(\\alpha K))_{\\bullet}(2)$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $((\\beta K)\\cdot(\\alpha K))_{\\bullet}(2)$. Rule of right whiskering: $(\\alpha K)_{\\bullet}=\\alpha_{K\\bullet}=\\alpha_{c_2}$ and $(\\beta K)_{\\bullet}=\\beta_{c_2}$; no functor is applied to a component. Rule of vertical composition: the composite component at $\\bullet$ is $\\beta_{c_2}\\circ\\alpha_{c_2}$. Evaluate: $\\alpha_{c_2}(2)=(2+3)\\bmod 4=1$, then $\\beta_{c_2}(1)=(3\\cdot 1)\\bmod 4=3$. The answer is 3."
          - problem: "Let $\\mathcal{B}$ be the category with objects $b, b'$ and one arrow $g\\colon b\\to b'$, and let $K\\colon\\mathcal{B}\\to\\mathbf{Set}$ with $K(b)=K(b')=\\{0,1,2\\}$ and $K(g)=h$ where $h(0)=1$, $h(1)=2$, $h(2)=0$. Let $F(X)=X\\times X$ and $G(X)=X\\times X$ be functors $\\mathbf{Set}\\to\\mathbf{Set}$, and let $\\alpha\\colon F\\Rightarrow G$ have the swap components $\\alpha_X(x,y)=(y,x)$. Give the value $((GK)(g)\\circ(\\alpha K)_b)(2,1)$ as (x, y)."
            answer: "(2,0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full object is $((GK)(g)\\circ(\\alpha K)_b)(2,1)$, the left side of the naturality square of $\\alpha K$ at $g$. Rule of right whiskering: $(\\alpha K)_b=\\alpha_{Kb}$, the swap $(x,y)\\mapsto(y,x)$ on $\\{0,1,2\\}\\times\\{0,1,2\\}$. Apply it: swap$(2,1)=(1,2)$. Rule of functor composition: $(GK)(g)=G(K(g))=G(h)=h\\times h$. Apply it: $(h(1),h(2))=(2,0)$. The answer is (2,0)."
          - problem: "Let $\\mathcal{B}$ be the category with objects $b, b'$ and one arrow $g\\colon b\\to b'$, and let $K\\colon\\mathcal{B}\\to\\mathbf{Set}$ with $K(b)=\\{0,1\\}$, $K(b')=\\{0,1,2\\}$ and $K(g)$ the inclusion $j$ with $j(0)=0$, $j(1)=1$. Let $F(X)=X$ and $G(X)=X\\times X$ be functors $\\mathbf{Set}\\to\\mathbf{Set}$, and let $\\alpha\\colon F\\Rightarrow G$ have the diagonal components $\\alpha_X(x)=(x,x)$. Give the value $((\\alpha K)_{b'}\\circ(FK)(g))(1)$ as (x, y)."
            answer: "(1,1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full object is $((\\alpha K)_{b'}\\circ(FK)(g))(1)$, the right side of the naturality square of $\\alpha K$ at $g$. Rule of functor composition: $(FK)(g)=F(K(g))=F(j)=j$. Apply it: $j(1)=1$. Rule of right whiskering: $(\\alpha K)_{b'}=\\alpha_{Kb'}$, the diagonal $x\\mapsto(x,x)$ on $\\{0,1,2\\}$. Apply it: diagonal$(1)=(1,1)$. The answer is (1,1)."
          - problem: "Let $\\mathcal{C}$ be the discrete category with objects $c_1, c_2, c_3$, and let $F, G\\colon\\mathcal{C}\\to\\mathbf{Set}$ each send every object to $\\{0,1,2,3,4\\}$. Let $\\alpha\\colon F\\Rightarrow G$ have components $\\alpha_{c_1}(x)=x$, $\\alpha_{c_2}(x)=(x+1)\\bmod 5$, $\\alpha_{c_3}(x)=(x+2)\\bmod 5$. Let $\\mathcal{B}$ be the discrete category with objects $1,2,3$, and let $K\\colon\\mathcal{B}\\to\\mathcal{C}$ send $1\\mapsto c_1$, $2\\mapsto c_1$, $3\\mapsto c_2$. A student claims $(\\alpha K)_n=\\alpha_{c_n}$ for each object $n$ of $\\mathcal{B}$. Determine the smallest $n$ for which the claimed component and the true whiskered component give different values at the input $0$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule of right whiskering: $(\\alpha K)_n=\\alpha_{K(n)}$, the component re-indexed by $K$; no functor is applied. Compute the re-indexing: $K(1)=c_1$, $K(2)=c_1$, $K(3)=c_2$. Compare at input $0$: for $n=1$ both the claim and the truth give $\\alpha_{c_1}(0)=0$, so the claim holds there; for $n=2$ the true component gives $\\alpha_{c_1}(0)=0$ while the claim gives $\\alpha_{c_2}(0)=1$, so it fails. The smallest such $n$ is 2, so the answer is 2."
          - problem: "Claim: for every arrow $g\\colon b\\to b'$ in $\\mathcal{B}$, the whiskered transformation $\\alpha K\\colon FK\\Rightarrow GK$ is natural at $g$. Step 1: the goal is the square $(GK)(g)\\circ(\\alpha K)_b=(\\alpha K)_{b'}\\circ(FK)(g)$. Step 2: by the definition of right whiskering, $(\\alpha K)_b=\\alpha_{Kb}$ and $(\\alpha K)_{b'}=\\alpha_{Kb'}$. Step 3: since $K$ is a functor, we may apply it to the component and write $(\\alpha K)_b=K(\\alpha_b)$. Step 4: substituting $K(\\alpha_b)$ into the goal, the square commutes by functoriality of $K$. Select the first step that is not valid."
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it states the naturality goal for $\\alpha K$ correctly. Step 2 is valid: right whiskering re-indexes components, $(\\alpha K)_b=\\alpha_{Kb}$, and applies no functor. Step 3 is the first invalid step: whiskering never applies a functor to a component, and $\\alpha_b$ is not even defined, since $b$ is an object of $\\mathcal{B}$ while $\\alpha$ has components at objects of $\\mathcal{C}$. Step 4 rests on the invalid Step 3, and functoriality of $K$ alone does not give naturality, but the first failure comes earlier. The answer is Step 3."
          - problem: "Write the full proof: for functors $F,G\\colon\\mathcal{C}\\to\\mathcal{D}$ and $K\\colon\\mathcal{B}\\to\\mathcal{C}$, define the right whiskering $\\alpha K$ of a natural transformation $\\alpha\\colon F\\Rightarrow G$ and prove that $\\alpha K\\colon FK\\Rightarrow GK$ is natural. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Definition step: for each object $b$ of $\\mathcal{B}$ set $(\\alpha K)_b=\\alpha_{Kb}\\colon (FK)(b)\\to(GK)(b)$; right whiskering only re-indexes the component and applies no functor. Naturality step: take any arrow $g\\colon b\\to b'$ in $\\mathcal{B}$. By the definition of composed functors, $(FK)(g)=F(Kg)$ and $(GK)(g)=G(Kg)$. Naturality of $\\alpha$ at the arrow $Kg\\colon Kb\\to Kb'$ of $\\mathcal{C}$ gives $G(Kg)\\circ\\alpha_{Kb}=\\alpha_{Kb'}\\circ F(Kg)$. Substitute the whiskered components: this equation reads $(GK)(g)\\circ(\\alpha K)_b=(\\alpha K)_{b'}\\circ(FK)(g)$, which is exactly the naturality square of $\\alpha K$ at $g$. Since the square commutes for every arrow $g$, $\\alpha K\\colon FK\\Rightarrow GK$ is a natural transformation."
      - id: kp3
        name: Compatibility of the two whiskerings
        key_prerequisites: [functor-composition-identity]
        constraints: "Evaluate both sides at an object and simplify; never reorder $H$ and the index."
        exemplars:
          - problem: "For $K\\colon\\mathcal{B}\\to\\mathcal{C}$, $\\alpha\\colon F\\Rightarrow G$ ($\\mathcal{C}\\to\\mathcal{D}$) and $H\\colon\\mathcal{D}\\to\\mathcal{E}$, prove $(H\\alpha)K=H(\\alpha K)$."
            answer: "Both have component $H(\\alpha_{KB})$ at $B$."
            solution_sketch: "Evaluate at an object $B$ of $\\mathcal{B}$. Left: $((H\\alpha)K)_B=(H\\alpha)_{KB}=H(\\alpha_{KB})$. Right: $(H(\\alpha K))_B=H((\\alpha K)_B)=H(\\alpha_{KB})$. The components agree for every $B$, so the two transformations $HFK\\Rightarrow HGK$ are equal, and the unambiguous notation $H\\alpha K$ is justified."
          - problem: "Let $L$ be the list functor and $\\eta\\colon 1_{\\mathbf{Set}}\\Rightarrow L$ the singleton transformation $a\\mapsto[a]$. Describe the components of $L\\eta$ and $\\eta L$ and show they differ."
            answer: "$(L\\eta)_X([a_1,\\dots,a_n])=[[a_1],\\dots,[a_n]]$ while $(\\eta L)_X(w)=[w]$; e.g. at $w=[a,b]$ they give $[[a],[b]]$ and $[[a,b]]$."
            solution_sketch: "Both are transformations $L\\Rightarrow L^2$. Left whiskering applies $L$ to the component: $(L\\eta)_X=L(\\eta_X)$ maps a list letterwise through $\\eta_X$, so $[a_1,\\dots,a_n]\\mapsto[[a_1],\\dots,[a_n]]$. Right whiskering re-indexes: $(\\eta L)_X=\\eta_{LX}$, which wraps the whole list, so $w\\mapsto[w]$. On $w=[a,b]$ they give $[[a],[b]]$ and $[[a,b]]$ respectively, which are different elements of $L^2X$. So $L\\eta\\neq\\eta L$ in general — the two whiskerings are genuinely different operations."
    diagnostic_exemplar:
      problem: "Let $L$ be the list functor and $\\eta\\colon 1_{\\mathbf{Set}}\\Rightarrow L$ the singleton transformation $a\\mapsto[a]$; both $L\\eta$ and $\\eta L$ are transformations $L\\Rightarrow L^2$. Compute $(L\\eta)_X(w)$ and $(\\eta L)_X(w)$ for the word $w=[a,b,c]$, and decide whether $L\\eta=\\eta L$."
      answer: "Left whiskering applies $L$ to the component, so $(L\\eta)_X=L(\\eta_X)$ maps letterwise: $(L\\eta)_X([a,b,c])=[[a],[b],[c]]$. Right whiskering re-indexes, so $(\\eta L)_X=\\eta_{LX}$ wraps the whole word: $(\\eta L)_X([a,b,c])=[[a,b,c]]$. These are different elements of $L^2X$, so $L\\eta\\ne\\eta L$."
      solution_sketch: "The two whiskerings differ in where the singleton is taken: $L\\eta$ applies $\\eta$ inside the list, letterwise, while $\\eta L$ applies $\\eta$ to the whole list. Compute both at $[a,b,c]$ and compare the resulting elements of $L^2X$."
    anki_seeds:
      - front: "Left whiskering: component of $H\\alpha$ at $A$?"
        back: "$(H\\alpha)_A=H(\\alpha_A)$ — apply the functor to the component."
        type: basic
      - front: "Right whiskering: component of $\\alpha K$ at $B$?"
        back: "$(\\alpha K)_B=\\alpha_{KB}$ — re-index the component."
        type: basic
      - front: "Does whiskering preserve vertical composition?"
        back: "Yes: $H(\\beta\\cdot\\alpha)=(H\\beta)\\cdot(H\\alpha)$ and $(\\beta\\cdot\\alpha)K=(\\beta K)\\cdot(\\alpha K)$."
        type: basic

  - id: vertical-horizontal-composition
    name: Vertical and Horizontal Composition
    core: true  # ancestor of core functor-categories/triangle-identities (PEDAGOGY §1 invariant)
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: whiskering
        weight: 0.5
        key: true
      - id: natural-transformations
        weight: 0.4
        key: true
      - id: naturality-proofs
        weight: 0.4
        key: true
      - id: functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Vertical composition
        key_prerequisites: [naturality-proofs]
        constraints: "Vertical composition requires the middle functor to match; verify componentwise in the target category."
        exemplars:
          - problem: "Let F, G, H be functors with F(X) = X, G(X) = X × X and H(X) = X. Let α: F ⇒ G be a natural transformation with components α_X(x) = (x, x), and let β: G ⇒ H be a natural transformation with components β_X(x, y) = 2x + y. The vertical composite β·α: F ⇒ H has components (β·α)_X = β_X ∘ α_X, and the middle functor G matches on both sides. Give (β·α)_X(x) as a function of x."
            answer: "3x"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: the component is (β·α)_X = β_X ∘ α_X. Step 1 (definition of vertical composition): apply α_X first, so x maps to (x, x). Step 2 (substitution into β_X): β_X(x, x) = 2x + x. Step 3 (componentwise check in the target category): 2x + x = 3x. The answer is 3x."
          - problem: "Let L be the list functor on the category of sets, and let ρ: L ⇒ L be list reversal, so ρ_X reverses any finite list of elements of a set X. The vertical composite ρ·ρ: L ⇒ L has component (ρ·ρ)_X = ρ_X ∘ ρ_X at each X. Give (ρ·ρ)_X([3, 1, 2]) as an ordered list."
            answer: "3, 1, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Full object: (ρ·ρ)_X = ρ_X ∘ ρ_X, reversal applied twice. Step 1 (definition of vertical composition, first factor applied first): ρ_X([3, 1, 2]) = [2, 1, 3]. Step 2 (apply the second factor): ρ_X([2, 1, 3]) = [3, 1, 2]. Step 3 (componentwise in the target category): the second reversal undoes the first, so (ρ·ρ)_X = 1_{LX} for every X, that is, ρ·ρ = 1_L. The answer is 3, 1, 2."
          - problem: "Let F, G, H be functors with F(X) = G(X) = H(X) = X. Let α: F ⇒ G and β: G ⇒ H be natural transformations with components α_X(x) = x + 1 and β_X(x) = 2x. Give (β·α)_X(x) as a function of x."
            answer: "2x+2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: (β·α)_X = β_X ∘ α_X. Step 1 (definition of vertical composition): the right-hand factor acts first, so α_X(x) = x + 1. Step 2 (substitution into β_X): β_X(x + 1) = 2(x + 1). Step 3 (componentwise arithmetic in the target category): 2(x + 1) = 2x + 2. The answer is 2x+2."
          - problem: "Let L be the list functor on the category of sets. Let ρ: L ⇒ L be list reversal, and let r: L ⇒ L move the first entry of a list to the end, so for example r_X([p, q, s]) = [q, s, p]. The vertical composite r·ρ: L ⇒ L has component (r·ρ)_X = r_X ∘ ρ_X at each set X. Give (r·ρ)_X([3, 1, 2]) as an ordered list."
            answer: "1, 3, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Full object: (r·ρ)_X = r_X ∘ ρ_X. Step 1 (definition of vertical composition, reversal first): ρ_X([3, 1, 2]) = [2, 1, 3]. Step 2 (apply the rotation): r_X moves the first entry 2 to the end, giving [1, 3, 2]. Step 3 (componentwise in the target category): both factors are natural, so the composite list is determined entry by entry. The answer is 1, 3, 2."
          - problem: "Let F, G, H, K be functors with F(X) = G(X) = H(X) = K(X) = X, and let α: F ⇒ G, β: G ⇒ H, γ: H ⇒ K be natural transformations with components α_X(x) = x + 1, β_X(x) = 2x and γ_X(x) = x - 3. Associativity of vertical composition says (γ·β)·α = γ·(β·α). Give ((γ·β)·α)_X(x) as a function of x."
            answer: "2x-1"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Full object: ((γ·β)·α)_X = (γ_X ∘ β_X) ∘ α_X. Step 1 (associativity, verified componentwise in the target category): regroup as γ_X ∘ (β_X ∘ α_X), which is the component of γ·(β·α), the same family. Step 2 (apply in order α, then β, then γ): x + 1, then 2(x + 1), then 2(x + 1) - 3. Step 3 (simplify): 2x + 2 - 3 = 2x - 1. The answer is 2x-1."
          - problem: "Claim: if α: F ⇒ G and β: G ⇒ H are natural transformations between functors from C to D, then the family with components (β·α)_A = α_A ∘ β_A is a natural transformation from F to H. Step 1: each component of a transformation F ⇒ H must be an arrow from FA to HA in D. Step 2: α_A goes from FA to GA, and β_A goes from GA to HA, so the middle functor G matches. Step 3: therefore α_A ∘ β_A is a defined arrow of D from FA to HA. Step 4: the naturality squares stack, so the family is natural. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Full object: the claim defines the composite with components α_A ∘ β_A and asserts it is natural. Step 1 is valid: a component of a transformation F ⇒ H must indeed go from FA to HA. Step 2 is valid: it restates the types of α_A and β_A, and the middle functor G matches on both sides. Step 3 is the first invalid step: β_A ends at HA while α_A starts at FA, so α_A ∘ β_A is not composable in D; the composable order is β_A ∘ α_A. Step 4 never becomes valid as written, because it builds on the broken Step 3; with the corrected order the squares do stack. The answer is Step 3."
          - problem: "Write the full proof: if α: F ⇒ G and β: G ⇒ H are natural transformations between functors from C to D, then the family with components (β·α)_A = β_A ∘ α_A is a natural transformation from F to H. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (types): α_A: FA → GA and β_A: GA → HA, and the middle functor G matches on both sides, so the composite β_A ∘ α_A: FA → HA is defined in D. Step 2 (naturality): for each arrow f: A → B in C, the naturality square for α at f gives Gf ∘ α_A = α_B ∘ Ff, and the square for β at f gives Hf ∘ β_A = β_B ∘ Gf. Step 3 (stack the squares): Hf ∘ (β_A ∘ α_A) = (β_B ∘ Gf) ∘ α_A = β_B ∘ (Gf ∘ α_A) = β_B ∘ (α_B ∘ Ff) = (β_B ∘ α_B) ∘ Ff, using only associativity and units in D. Step 4 (conclusion): the naturality square for β·α commutes at every arrow, verified componentwise in the target category D, so β·α: F ⇒ H is a natural transformation. This completes the proof."
      - id: kp2
        name: Horizontal composition
        key_prerequisites: [whiskering]
        constraints: "Always exhibit both formulas for the component and say which naturality square identifies them."
        exemplars:
          - problem: "For $\\alpha\\colon F\\Rightarrow F'$ ($\\mathcal{C}\\to\\mathcal{D}$) and $\\beta\\colon G\\Rightarrow G'$ ($\\mathcal{D}\\to\\mathcal{E}$), give the component of the horizontal composite $\\beta*\\alpha\\colon GF\\Rightarrow G'F'$ and show the two formulas agree."
            answer: "$(\\beta*\\alpha)_A=G'\\alpha_A\\circ\\beta_{FA}=\\beta_{F'A}\\circ G\\alpha_A$."
            solution_sketch: "The naturality square of $\\beta$ at the morphism $\\alpha_A\\colon FA\\to F'A$ reads $G'(\\alpha_A)\\circ\\beta_{FA}=\\beta_{F'A}\\circ G(\\alpha_A)$; call this common value $(\\beta*\\alpha)_A\\colon GFA\\to G'F'A$. It is natural in $A$, giving a transformation $GF\\Rightarrow G'F'$."
          - problem: "Express the horizontal composite $\\beta*\\alpha$ as a vertical composite of two whiskerings, in both of the available ways."
            answer: "$\\beta*\\alpha=(\\beta F')\\cdot(G\\alpha)=(G'\\alpha)\\cdot(\\beta F)$."
            solution_sketch: "Here $G\\alpha\\colon GF\\Rightarrow GF'$ and $\\beta F'\\colon GF'\\Rightarrow G'F'$ are composable vertically, with component at $A$ equal to $(\\beta F')_A\\circ(G\\alpha)_A=\\beta_{F'A}\\circ G(\\alpha_A)$ — the second formula for $(\\beta*\\alpha)_A$. Dually $\\beta F\\colon GF\\Rightarrow G'F$ and $G'\\alpha\\colon G'F\\Rightarrow G'F'$ compose to give $G'(\\alpha_A)\\circ\\beta_{FA}$ — the first formula. The two agree by naturality of $\\beta$ at $\\alpha_A$, so both descriptions define $\\beta*\\alpha$."
      - id: kp3
        name: The interchange law
        key_prerequisites: [naturality-proofs]
        constraints: "Reduce interchange to one naturality square; identify at which morphism it is applied."
        exemplars:
          - problem: "State the interchange (Godement) law relating vertical ($\\cdot$) and horizontal ($*$) composition."
            answer: "$(\\beta'\\cdot\\beta)*(\\alpha'\\cdot\\alpha)=(\\beta'*\\alpha')\\cdot(\\beta*\\alpha)$."
            solution_sketch: "For vertically composable $\\alpha\\colon F\\Rightarrow F'$, $\\alpha'\\colon F'\\Rightarrow F''$ and $\\beta\\colon G\\Rightarrow G'$, $\\beta'\\colon G'\\Rightarrow G''$, both sides are transformations $GF\\Rightarrow G''F''$ and the law asserts they coincide. It expresses that $\\mathbf{Cat}$ is a 2-category (objects = categories, 1-cells = functors, 2-cells = natural transformations), so a pasted rectangle of 2-cells may be composed in either order."
          - problem: "Prove the interchange law by expanding both sides at an object $A$ and identifying the one naturality square that is used."
            answer: "Both sides reduce to $\\beta'_{F''A}\\circ\\beta_{F''A}\\circ G(\\alpha'_A)\\circ G(\\alpha_A)$ once naturality of $\\beta$ at $\\alpha'_A$ is applied."
            solution_sketch: "Using $(\\beta*\\alpha)_A=\\beta_{F'A}\\circ G(\\alpha_A)$: the left side is $((\\beta'\\cdot\\beta)*(\\alpha'\\cdot\\alpha))_A=(\\beta'\\cdot\\beta)_{F''A}\\circ G(\\alpha'_A\\circ\\alpha_A)=\\beta'_{F''A}\\circ\\beta_{F''A}\\circ G(\\alpha'_A)\\circ G(\\alpha_A)$. The right side is $(\\beta'*\\alpha')_A\\circ(\\beta*\\alpha)_A=\\big(\\beta'_{F''A}\\circ G'(\\alpha'_A)\\big)\\circ\\big(\\beta_{F'A}\\circ G(\\alpha_A)\\big)$. The two agree precisely when $\\beta_{F''A}\\circ G(\\alpha'_A)=G'(\\alpha'_A)\\circ\\beta_{F'A}$, which is the naturality square of $\\beta\\colon G\\Rightarrow G'$ at the morphism $\\alpha'_A\\colon F'A\\to F''A$. Hence interchange holds."
    diagnostic_exemplar:
      problem: "For $\\alpha\\colon F\\Rightarrow F'$ ($\\mathcal{C}\\to\\mathcal{D}$) and $\\beta\\colon G\\Rightarrow G'$ ($\\mathcal{D}\\to\\mathcal{E}$), the horizontal composite $\\beta*\\alpha\\colon GF\\Rightarrow G'F'$ has component at $A$ given by either $G'(\\alpha_A)\\circ\\beta_{FA}$ or $\\beta_{F'A}\\circ G(\\alpha_A)$. Prove the two formulas agree."
      answer: "Apply the naturality of $\\beta\\colon G\\Rightarrow G'$ at the morphism $\\alpha_A\\colon FA\\to F'A$ of $\\mathcal{D}$: the naturality square reads $G'(\\alpha_A)\\circ\\beta_{FA}=\\beta_{F'A}\\circ G(\\alpha_A)$, which is exactly the claimed equality. Hence the two candidate components coincide and $\\beta*\\alpha$ is well defined."
      solution_sketch: "The two candidate formulas are the two legs of a single naturality square — that of $\\beta$ taken at the component $\\alpha_A$, regarded as a morphism of $\\mathcal D$. Identifying that square is the whole proof."
    anki_seeds:
      - front: "Vertical composite $\\beta\\cdot\\alpha$ of natural transformations — component at $A$?"
        back: "$(\\beta\\cdot\\alpha)_A=\\beta_A\\circ\\alpha_A$ (same functors stacked)."
        type: basic
      - front: "Horizontal composite $\\beta*\\alpha$ (of $\\alpha\\colon F\\Rightarrow F'$, $\\beta\\colon G\\Rightarrow G'$) — its type?"
        back: "$\\beta*\\alpha\\colon GF\\Rightarrow G'F'$ (across composable functors)."
        type: basic
      - front: "The interchange law states..."
        back: "$(\\beta'\\cdot\\beta)*(\\alpha'\\cdot\\alpha)=(\\beta'*\\alpha')\\cdot(\\beta*\\alpha)$."
        type: basic

  - id: functor-categories
    name: Functor Categories
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: natural-transformations
        weight: 0.5
        key: true
      - id: vertical-horizontal-composition
        weight: 0.4
        key: true
      - id: naturality-proofs
        weight: 0.3
      - id: category-definition
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: The category of functors and natural transformations
        key_prerequisites: [vertical-horizontal-composition]
        constraints: "Verify the category axioms componentwise in $\\mathcal D$; structural transfer results (e.g. groupoid target gives groupoid functor category) must construct the inverse transformation explicitly."
        exemplars:
          - problem: "Define the functor category $[\\mathcal C,\\mathcal D]$ and verify it is a category."
            answer: "Objects: functors $\\mathcal C\\to\\mathcal D$; morphisms: natural transformations; composition vertical; identity $(1_F)_A=1_{FA}$."
            solution_sketch: "Objects are functors $F\\colon\\mathcal C\\to\\mathcal D$; a morphism $F\\to G$ is a natural transformation $\\alpha\\colon F\\Rightarrow G$; composition is vertical composition $(\\beta\\alpha)_A=\\beta_A\\circ\\alpha_A$, which is natural; the identity on $F$ has components $1_{FA}$. Associativity and the unit laws hold componentwise because they hold in $\\mathcal D$, so $[\\mathcal C,\\mathcal D]$ is a category."
          - problem: "Prove that if $\\mathcal D$ is a groupoid then the functor category $[\\mathcal C,\\mathcal D]$ is also a groupoid."
            answer: "Every component is iso, so every natural transformation is invertible."
            solution_sketch: "Let $\\alpha\\colon F\\Rightarrow G$ be any morphism of $[\\mathcal C,\\mathcal D]$. Each component $\\alpha_A\\colon FA\\to GA$ is a morphism of the groupoid $\\mathcal D$, hence an isomorphism. Since every component is iso, the componentwise inverses $\\alpha_A^{-1}$ assemble into a natural transformation $G\\Rightarrow F$ that is a two-sided inverse of $\\alpha$ in $[\\mathcal C,\\mathcal D]$. Thus every morphism is invertible, i.e. $[\\mathcal C,\\mathcal D]$ is a groupoid."
      - id: kp2
        name: Isomorphisms in a functor category
        key_prerequisites: [natural-transformations]
        constraints: "Both directions of 'iso in $[\\mathcal C,\\mathcal D]$ = natural iso'; uniqueness of inverses argued abstractly, components read off by evaluating at an object."
        exemplars:
          - problem: "Let C be the arrow category: two objects 0 and 1, with one nonidentity arrow u: 0 -> 1. Functors F and G from C to Set act by F(0) = {1,2}, F(1) = {3,4,5}, G(0) = {6,7}, G(1) = {8,9,10}. The map F(u) sends 1 to 3 and 2 to 4; the map G(u) sends 6 to 8 and 7 to 9. A natural transformation alpha: F => G has components alpha_0 sending 1 to 6 and 2 to 7, and alpha_1 sending 3 to 8, 4 to 9 and 5 to 10. Both components are bijections, so alpha is an isomorphism in the functor category [C, Set]. Let beta be the inverse of alpha in this functor category. Evaluate the component of beta at the object 1 on the element 10 of G(1). Give the resulting element of F(1)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: alpha is natural because alpha_1 sends F(u)(1) = 3 to 8 = G(u)(6) and F(u)(2) = 4 to 9 = G(u)(7); both components are bijections, so alpha is an isomorphism in [C, Set] with a unique inverse beta. Rule: evaluate the equations beta o alpha = 1_F and alpha o beta = 1_G at the object 1; vertical composition is componentwise, so the component beta_1 is the inverse function of the component alpha_1. Since alpha_1 sends 5 to 10, the inverse function sends 10 back to 5. The answer is 5."
          - problem: "Take the category C with two objects 0 and 1 and two parallel nonidentity arrows f and g, both from 0 to 1. Functors F and G from C to Set act by F(0) = {10,20}, F(1) = {30,40,50}, G(0) = {11,21}, G(1) = {31,41,51}. The map F(f) sends 10 to 30 and 20 to 40; the map F(g) sends 10 to 30 and 20 to 50; the map G(f) sends 11 to 31 and 21 to 41; the map G(g) sends 11 to 31 and 21 to 51. The components of a natural transformation alpha: F => G are alpha_0 sending 10 to 11 and 20 to 21, and alpha_1 sending 30 to 31, 40 to 41 and 50 to 51. This alpha is an isomorphism in the functor category [C, Set]. Any two-sided inverse of alpha must send the element 41 of G(1) to one and the same element of F(1), since inverses in a category are unique. Give that element."
            answer: "40"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: alpha is a natural isomorphism, since both naturality squares commute, for example alpha_1(F(f)(10)) = 31 = G(f)(alpha_0(10)), and each component is a bijection. Rule: if beta is any two-sided inverse of alpha, evaluating beta o alpha = 1_F and alpha o beta = 1_G at the object 1 shows that beta_1 composed with alpha_1 is the identity in both orders, so beta_1 is the inverse function of alpha_1; uniqueness of inverses then forces every inverse to take the same value. The component alpha_1 sends 40 to 41, so its inverse function sends 41 to 40. The answer is 40."
          - problem: "Let C be the category with objects 0, 1, 2 and two nonidentity arrows s: 0 -> 1 and t: 0 -> 2. Functors F and G from C to Set act by F(0) = {3,4}, F(1) = {5,6,7,8}, F(2) = {9,10} and G(0) = {13,14}, G(1) = {15,16,17,18,19,20,21}, G(2) = {22,23}. The map F(s) sends 3 to 5 and 4 to 6; the map F(t) sends 3 to 9 and 4 to 10; the map G(s) sends 13 to 15 and 14 to 16; the map G(t) sends 13 to 22 and 14 to 23. The components of a natural transformation alpha: F => G are alpha_0 sending 3 to 13 and 4 to 14, alpha_1 sending 5 to 15, 6 to 16, 7 to 17 and 8 to 18, and alpha_2 sending 9 to 22 and 10 to 23. How many elements of G(1) lie outside the image of the component alpha_1?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: alpha is natural, since alpha_1(F(s)(3)) = 15 = G(s)(alpha_0(3)), the check for 4 under s and both checks under t also match, and alpha_2 matches as well. Rule: in a functor category an isomorphism must have every component a bijection, so the status of alpha is decided component by component. The image of alpha_1 is {15,16,17,18}, which has 4 elements, while G(1) has 7 elements, so 19, 20 and 21 are not hit and the component is not surjective. The answer is 3."
          - problem: "Let C be the category of the chain 0 <= 1 <= 2: objects 0, 1, 2, with one arrow i -> j exactly when i <= j. Functors F and G from C to Set act by F(0) = {5,6}, F(1) = {7,8,9}, F(2) = {10,11,12} and G(0) = {15,16}, G(1) = {17,18,19}, G(2) = {20,21,22,23}. On the arrow 0 -> 1 the map of F sends 5 to 7 and 6 to 8, and the map of G sends 15 to 17 and 16 to 18; on the arrow 1 -> 2 the map of F sends 7 to 10, 8 to 11 and 9 to 12, and the map of G sends 17 to 20, 18 to 21 and 19 to 22. The remaining arrows of C act as the forced identities and composites. The components of a natural transformation alpha: F => G are alpha_0 sending 5 to 15 and 6 to 16, alpha_1 sending 7 to 17, 8 to 18 and 9 to 19, and alpha_2 sending 10 to 20, 11 to 21 and 12 to 22. A student claims that alpha is an isomorphism in the functor category [C, Set]. Give the smallest object of C at which the component of alpha fails to be a bijection."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: alpha is natural because the two sides agree along the arrows 0 -> 1 and 1 -> 2, and the arrow 0 -> 2 is the forced composite. Rule: a natural transformation is an isomorphism in the functor category exactly when every one of its components is a bijection. The components alpha_0 and alpha_1 are bijections, matching two and three elements one to one, but the component alpha_2 hits only {20,21,22} while G(2) also contains 23, so it is not surjective. The smallest object with a failing component is 2, so the answer is 2."
          - problem: "Claim: if every component of a natural transformation alpha: F => G between functors from C to Set is a bijection, then alpha is an isomorphism in the functor category [C, Set]. Step 1: for each object a, the component alpha_a has an inverse function from G(a) to F(a). Step 2: define beta: G => F by taking, at each object a, the component of beta to be that inverse function. Step 3: any assignment of a bijection G(a) -> F(a) to every object a is automatically a natural transformation. Step 4: at each object a, the composite of beta_a after alpha_a is the identity on F(a), and the composite of alpha_a after beta_a is the identity on G(a). Step 5: hence beta o alpha = 1_F and alpha o beta = 1_G as natural transformations, so alpha is an isomorphism in [C, Set]. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: a bijection of sets has an inverse function. Step 2 is valid: it names the component of beta at each object. Step 3 is not valid: naturality is a condition that ties the components together along the arrows of C, and a family of bijections picked object by object need not satisfy it; the naturality of the componentwise inverse must instead be derived from the naturality of alpha by composing with the inverse functions on both sides. Step 4 is valid: these componentwise identities hold by construction. Step 5 is valid: two natural transformations are equal when all their components agree. The first invalid step is Step 3."
          - problem: "In a functor category [C, D], let alpha: F => G be an isomorphism, and let beta and beta' be two two-sided inverses of alpha, both going from G to F. Step 1: beta = beta o 1_G. Step 2: 1_G = alpha o beta'. Step 3: the line here is missing. Step 4: by associativity, beta = (beta o alpha) o beta' = 1_F o beta' = beta'. Step 5: therefore the two inverses agree, so the two-sided inverse of alpha is unique. Select the line that fills Step 3."
            answer: "beta = beta o (alpha o beta')"
            answer_contract: {"kind": "label", "options": [["beta = beta o (alpha o beta')"], ["beta = alpha o beta'"], ["beta = beta o (beta' o alpha)"], ["beta = beta' o beta"]]}
            solution_sketch: "Full object: beta and beta' are two-sided inverses of alpha, so beta o alpha = 1_F, alpha o beta = 1_G, beta' o alpha = 1_F and alpha o beta' = 1_G. Step 1 factors beta through the identity 1_G; Step 2 rewrites that identity as the composite alpha o beta'. Rule: the missing line substitutes Step 2 into Step 1, giving beta = beta o (alpha o beta'); Step 4 then regroups by associativity and uses beta o alpha = 1_F. The line beta = alpha o beta' drops the factor beta and confuses beta with an identity; the line beta = beta o (beta' o alpha) reverses the order inside the composite; the line beta = beta' o beta composes the two inverses, which is not defined. The answer is beta = beta o (alpha o beta')."
          - problem: "Write the full proof: a natural transformation alpha: F => G between functors from C to D is an isomorphism in the functor category [C, D] if and only if every component alpha_A is an isomorphism in D. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Statement: alpha is an isomorphism in [C, D] exactly when every component alpha_A is an isomorphism in D. Step 1, forward direction: let beta be a two-sided inverse of alpha in [C, D], so beta o alpha = 1_F and alpha o beta = 1_G. Step 2, evaluation: vertical composition is componentwise, so applying both equations at an object A gives beta_A o alpha_A equal to the identity on F(A) and alpha_A o beta_A equal to the identity on G(A); hence each alpha_A is an isomorphism and alpha is a natural isomorphism. Step 3, converse: suppose every alpha_A is an isomorphism, and define the component beta_A as the inverse of alpha_A at each object A. Step 4, naturality of beta: for an arrow f from A to B, naturality of alpha reads G(f) o alpha_A = alpha_B o F(f); composing on the left with the inverse of alpha_B and on the right with the inverse of alpha_A gives beta_B o G(f) = F(f) o beta_A, so beta is natural. Step 5, conclusion: beta o alpha = 1_F and alpha o beta = 1_G hold at every object, so alpha is an isomorphism in [C, D]; the inverse is unique because inverses in any category are unique, and evaluating at A shows that the component of the inverse is the inverse of the component."
      - id: kp3
        name: Diagram categories
        key_prerequisites: [category-definition]
        constraints: "Identify $[\\mathcal J,\\mathcal C]$ for small shapes: $\\mathbf 2$ (arrow category) and $\\mathbf B G$ ($G$-sets); unpack both the functors and the natural transformations concretely."
        exemplars:
          - problem: "Let 2 be the shape category with objects 0, 1 and one non-identity arrow a: 0 -> 1. A functor F: 2 -> Set assigns a set F0 to 0, a set F1 to 1, and a function from F0 to F1 to the arrow a. Suppose F0 has 2 elements and F1 has 3 elements. How many such functors F: 2 -> Set are there?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A functor from 2 to Set is exactly the data of two sets and one function between them, since the identity arrows must map to identity functions. Here F0 has 2 elements and F1 has 3 elements, so the only choice is the arrow function. Counting functions rule: each of the 2 elements of F0 has 3 possible images in F1, giving 3^2. The answer is 9."
          - problem: "Let B(Z/2) be the one-object category whose two morphisms e and s satisfy s after s = e. A functor F: B(Z/2) -> Set with underlying set {1, 2, 3, 4} must send e to the identity function and s to a function h with h after h equal to the identity. How many such functors are there?"
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A functor from B(Z/2) to Set sends the single object to a set and each morphism to a function, preserving composition and identities. Since s after s = e, the function h must be an involution of {1, 2, 3, 4}. Counting involutions: the identity gives 1, a single swapped pair with the other two elements fixed gives 6, and two disjoint swapped pairs gives 3. Total: 1 + 6 + 3 = 10. The answer is 10."
          - problem: "In the functor category [2, Set], let F assign F0 = {a, b}, F1 = {1, 2, 3}, with the arrow function sending a to 1 and b to 2. Let G assign G0 = {u, v}, G1 = {x, y}, with the arrow function sending both u and v to x. A natural transformation from F to G is a pair of functions making the square commute. How many natural transformations from F to G are there?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A natural transformation here is a pair α0: {a, b} -> {u, v} and α1: {1, 2, 3} -> {x, y} with α1 after F(a) equal to G(a) after α0. Component counting: α0 has 4 choices. Since G(a) sends both u and v to x, the square forces α1(1) = x and α1(2) = x, leaving α1(3) free with 2 choices. Product rule: 4 times 2. The answer is 8."
          - problem: "In the functor category [B(Z/2), Set], let X be the set {w, x, y, z} with s swapping w and x and swapping y and z, and let Y be {p, q} with s swapping p and q. A morphism from X to Y in this functor category is an equivariant map. How many equivariant maps from X to Y are there?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Unpacking the functor category: a morphism is a function φ from X to Y with φ(s t) = s φ(t) for every element t. Orbit rule: choosing φ(w) in {p, q} forces φ(x) = s φ(w), giving 2 choices for the orbit {w, x}. The same reasoning gives 2 independent choices for the orbit {y, z}. Product rule: 2 times 2. The answer is 4."
          - problem: "Claim: in the functor category [2, Set], every pair of functions α0: F0 -> G0 and α1: F1 -> G1 is a natural transformation from F to G. Step 1: a natural transformation assigns to each object of 2 a function from the F-image to the G-image. Step 2: the objects of 2 are 0 and 1, so the components are α0 and α1. Step 3: naturality requires α1 after F(a) to equal G(a) after α0 for the arrow a of 2. Step 4: this equation holds for every choice of α0 and α1, so every pair is a natural transformation. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it states the component assignment in the definition of a natural transformation. Step 2 is valid: the shape category 2 has exactly the two objects 0 and 1. Step 3 is valid: naturality at the single arrow a is exactly the commuting square condition. Step 4 is the first invalid step: the square condition is a genuine restriction and fails for a badly chosen pair, for instance when α0 picks an element that G(a) sends to x while α1 sends the corresponding image to y. The answer is Step 4."
          - problem: "In [B(Z/2), Set], let F send the single object to {1, 2} and s to the swap of the two elements, and let G send the object to {a, b, c} and s to the map swapping a and b while fixing c. Unpacking the definition, a natural transformation from F to G is a single equivariant function from {1, 2} to {a, b, c}. How many natural transformations from F to G are there?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A natural transformation between functors on a one-object category is one function φ: {1, 2} -> {a, b, c} satisfying φ(s t) = s φ(t). Case rule on φ(1): if φ(1) = a then φ(2) = b; if φ(1) = b then φ(2) = a; if φ(1) = c then φ(2) = c because c is fixed by the action of s. Each of the 3 choices for φ(1) gives exactly one valid function. The answer is 3."
          - problem: "Write the full proof: for the shape category 2 with objects 0, 1 and one non-identity arrow a: 0 -> 1, the functor category [2, Set] is the arrow category of Set, whose objects are the functions of Set and whose morphisms are the commuting squares. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (functors are functions): a functor F: 2 -> Set assigns a set F0 to the object 0, a set F1 to the object 1, and a function F(a): F0 -> F1 to the arrow a; the identity arrows must map to identity functions, so no further data is chosen, and every function f: X -> Y arises from exactly one such functor. Hence the objects of [2, Set] are exactly the functions of Set. Step 2 (natural transformations are squares): a natural transformation α: F => G assigns functions α0: F0 -> G0 and α1: F1 -> G1, and naturality at the arrow a says α1 after F(a) = G(a) after α0, which is exactly the statement that the square with top F(a), bottom G(a) and sides α0, α1 commutes. Step 3 (morphisms match): the morphisms of the arrow category of Set are precisely the commuting squares between two functions, so Step 2 shows the morphisms of [2, Set] and of the arrow category coincide, and composition as well as identities are defined componentwise in both categories, so they agree. Conclusion: [2, Set] is the arrow category of Set."
    diagnostic_exemplar:
      problem: "Let $\\mathbf BG$ be the one-object category of a group $G$, so that functors $\\mathbf BG\\to\\mathbf{Set}$ are $G$-sets. Describe the natural transformations between two such functors, and prove that a transformation $\\alpha\\colon F\\Rightarrow F'$ is an isomorphism of the functor category $[\\mathbf BG,\\mathbf{Set}]$ if and only if its single component is a bijection."
      answer: "A functor $F\\colon\\mathbf BG\\to\\mathbf{Set}$ is a set $X=F(*)$ together with the maps $g\\cdot x:=F(g)(x)$; the functor laws say $1\\cdot x=x$ and $(gh)\\cdot x=g\\cdot(h\\cdot x)$, i.e. a $G$-action. A natural transformation $\\alpha\\colon F\\Rightarrow F'$ has a single component $\\alpha_*\\colon X\\to X'$, and the naturality square at $g\\in G$ reads $\\alpha_*(g\\cdot x)=g\\cdot\\alpha_*(x)$: natural transformations are exactly the $G$-equivariant maps. ($\\Rightarrow$) If $\\alpha$ is invertible in $[\\mathbf BG,\\mathbf{Set}]$ there is $\\beta$ with $\\beta\\cdot\\alpha=1_F$ and $\\alpha\\cdot\\beta=1_{F'}$; vertical composition and identities are componentwise, so $\\beta_*$ is a two-sided inverse of $\\alpha_*$ and $\\alpha_*$ is a bijection. ($\\Leftarrow$) If $\\alpha_*$ is a bijection, put $y=\\alpha_*(x)$ in $\\alpha_*(g\\cdot x)=g\\cdot\\alpha_*(x)$ and apply $\\alpha_*^{-1}$: $\\alpha_*^{-1}(g\\cdot y)=g\\cdot\\alpha_*^{-1}(y)$, so $\\alpha_*^{-1}$ is equivariant and therefore a natural transformation $F'\\Rightarrow F$; componentwise it is a two-sided inverse of $\\alpha$. Hence the isomorphisms of $[\\mathbf BG,\\mathbf{Set}]$ are exactly the equivariant bijections."
      solution_sketch: "First translate: a functor $\\mathbf BG\\to\\mathbf{Set}$ is a $G$-set, and the single naturality square reads $\\alpha_*(g\\cdot x)=g\\cdot\\alpha_*(x)$, so transformations are exactly the equivariant maps. Then use that composition in a functor category is componentwise, and check that the set-theoretic inverse of an equivariant bijection is again equivariant."
