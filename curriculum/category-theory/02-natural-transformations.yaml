            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Expand both sides of interchange. The differing middle block is exactly the square of beta at alpha_prime_A; replacing it makes all remaining factors agree. The resulting answer is 4, 3."
          - problem: "Write the full proof: for natural transformations α: F ⇒ F', α': F' ⇒ F'' between functors C → D and β: G ⇒ G', β': G' ⇒ G'' between functors D → E, the interchange law (β'·β)*(α'·α) = (β'*α')·(β*α) holds; expand both sides at an object A and reduce the equality to one naturality square, naming the morphism at which it is applied. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (whisker formula): (β*α)_A = β_{F'A} ∘ G(α_A) and (β'*α')_A = β'_{F''A} ∘ G'(α'_A). Step 2 (expand the left side): ((β'·β)*(α'·α))_A = (β'·β)_{F''A} ∘ G(α'_A ∘ α_A) = β'_{F''A} ∘ β_{F''A} ∘ G(α'_A) ∘ G(α_A), using functoriality of G and the vertical composite formula. Step 3 (expand the right side): ((β'*α')·(β*α))_A = β'_{F''A} ∘ G'(α'_A) ∘ β_{F'A} ∘ G(α_A). Step 4 (the single naturality square): the middle factors differ only in the order of β_{F''A} ∘ G(α'_A) versus G'(α'_A) ∘ β_{F'A}; naturality of β : G ⇒ G', applied at the one morphism α'_A : F'A → F''A of D, gives β_{F''A} ∘ G(α'_A) = G'(α'_A) ∘ β_{F'A}. Step 5 (conclusion): substituting this square shows both sides equal β'_{F''A} ∘ G'(α'_A) ∘ β_{F'A} ∘ G(α_A) at every object A, so the two natural transformations GF ⇒ G''F'' are equal. This is the interchange law."
    diagnostic_exemplar:
      problem: "For $\\alpha\\colon F\\Rightarrow F'$ ($\\mathcal{C}\\to\\mathcal{D}$) and $\\beta\\colon G\\Rightarrow G'$ ($\\mathcal{D}\\to\\mathcal{E}$), the horizontal composite $\\beta*\\alpha\\colon GF\\Rightarrow G'F'$ has component at $A$ given by either $G'(\\alpha_A)\\circ\\beta_{FA}$ or $\\beta_{F'A}\\circ G(\\alpha_A)$. Prove the two formulas agree."
      answer: "Apply the naturality of $\\beta\\colon G\\Rightarrow G'$ at the morphism $\\alpha_A\\colon FA\\to F'A$ of $\\mathcal{D}$: the naturality square reads $G'(\\alpha_A)\\circ\\beta_{FA}=\\beta_{F'A}\\circ G(\\alpha_A)$, which is exactly the claimed equality. Hence the two candidate components coincide and $\\beta*\\alpha$ is well defined."
      solution_sketch: "The two candidate formulas are the two legs of a single naturality square — that of $\\beta$ taken at the component $\\alpha_A$, regarded as a morphism of $\\mathcal D$. Identifying that square is the whole proof."
    anki_seeds:
      - front: "Vertical composite $\\beta\\cdot\\alpha$ of natural transformations — component at $A$?"
        back: "$(\\beta\\cdot\\alpha)_A=\\beta_A\\circ\\alpha_A$ (same functors stacked)."
        type: basic
      - front: "Horizontal composite $\\beta*\\alpha$ (of $\\alpha\\colon F\\Rightarrow F'$, $\\beta\\colon G\\Rightarrow G'$) — its type?"
        back: "$\\beta*\\alpha\\colon GF\\Rightarrow G'F'$ (across composable functors)."
        type: basic
      - front: "The interchange law states..."
        back: "$(\\beta'\\cdot\\beta)*(\\alpha'\\cdot\\alpha)=(\\beta'*\\alpha')\\cdot(\\beta*\\alpha)$."
        type: basic

  - id: functor-categories
    name: Functor Categories
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: natural-transformations
        weight: 0.5
        key: true
      - id: vertical-horizontal-composition
        weight: 0.4
        key: true
      - id: naturality-proofs
        weight: 0.3
      - id: category-definition
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: The category of functors and natural transformations
        key_prerequisites: [vertical-horizontal-composition]
        constraints: "Require the learner to use the category of functors and natural transformations. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Let C be the discrete category with objects a, b, c, and let D be the category of the poset 0 <= 1, with objects 0 and 1 and one arrow from x to y exactly when x <= y. In the functor category [C, D] the objects are the functors from C to D and the morphisms are the natural transformations. How many morphisms does [C, D] have?"
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A morphism of [C, D] from F to G is a natural transformation, which assigns to each object x of C one arrow from F(x) to G(x) in D; since C is discrete, there is no arrow of C on which to test naturality, so every such assignment is a transformation. For one object x the pairs with an arrow from F(x) to G(x) are (0,0), (0,1) and (1,1), so 3 choices. By the multiplication principle over the three objects a, b, c the count is 3 times 3 times 3. The answer is 27."
          - problem: "Construct an inverse morphism in the functor category, checking the naturality condition that defines its arrows. On the arrow category A->B, functors F,G take all four object values to {0,...,1}. Their arrow values are F(u)=[1, 0], G(u)=[0, 1]. A natural transformation alpha has components alpha_A=[1, 0],alpha_B=[0, 1]. Construct the inverse transformation by solving both component inverse equations and verify its naturality square. Give beta_A followed by beta_B."
            answer: "1, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Invert each component and use the original commuting square to obtain the reversed square. The searched equations verify both naturality and the two transformation identities. The resulting answer is 1, 0, 0, 1."
          - problem: "Let C be the category with two objects A and B and one arrow f: A -> B besides the identities. Let F and G both be the constant functor from C to Set with value the set {0, 1}, so F(f) and G(f) are identity maps. The morphisms of the functor category [C, Set] from F to G are the natural transformations from F to G. How many such morphisms are there?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A morphism from F to G is a natural transformation given by two functions alpha_A and alpha_B, each from {0, 1} to itself. Naturality at the arrow f says alpha_B after F(f) equals G(f) after alpha_A, and since F(f) and G(f) are both identity maps, this forces alpha_B = alpha_A. So the transformation is one function from {0, 1} to itself, and each of 0 and 1 can be sent to either 0 or 1, giving 2 times 2 choices. The answer is 4."
          - problem: "Let C be the category with two objects A and B and one arrow g: A -> B besides the identities. Define functors F and G from C to Set by F(A) = F(B) = {0, 1, 2} with F(g) sending 0 to 1, 1 to 2 and 2 to 0, and G(A) = G(B) = {0, 1, 2, 3} with G(g) the identity map. Let alpha: F => G be a natural transformation with alpha_A(0) = 3, alpha_A(1) = 0 and alpha_A(2) = 1. Find alpha_B(2)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Naturality at the arrow g says alpha_B(F(g)(x)) = G(g)(alpha_A(x)) for every x in F(A). To obtain the argument 2 on the left side, take x = 1, because F(g) sends 1 to 2. Then the right side is G(g)(alpha_A(1)), and G(g) is the identity map, so alpha_B(2) = alpha_A(1) = 0. The answer is 0."
          - problem: "Claim: if D is a groupoid, then every natural transformation alpha: F -> G between functors F and G from C to D is an isomorphism in the functor category [C, D]. Step 1: since D is a groupoid, each component alpha_A is an isomorphism in D with inverse beta_A. Step 2: define the transformation beta: G -> F by taking beta_A as its component at each object A of C. Step 3: beta is a natural transformation, because each component beta_A is an invertible arrow of D. Step 4: for each arrow f: A -> B of C, naturality of alpha gives G(f) alpha_A = alpha_B F(f), and composing with beta_B on the left and beta_A on the right gives F(f) beta_A = beta_B G(f). Step 5: so beta alpha equals the identity on F and alpha beta equals the identity on G, hence alpha is invertible in [C, D]. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 correctly uses that D is a groupoid, so every component alpha_A is invertible in D with inverse beta_A. Step 2 correctly assembles these componentwise inverses into the explicit transformation beta: G -> F, as the constraint requires. Step 3 is not valid: invertibility of the individual components does not imply that the family beta is natural; naturality of beta must be derived from naturality of alpha, not from invertibility alone. Step 4 supplies that derivation, composing the naturality square of alpha with the inverses on the correct sides. Step 5 draws the right conclusion once Step 3 is repaired. The answer is Step 3."
          - problem: "In the functor category [C,Set], C is discrete on a,b and F(a)={0,1},F(b)={0,1,2}. Construct the identity morphism of F from the category unit law, giving its a-component and b-component value lists consecutively."
            answer: "0, 1, 0, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Functor-category composition is componentwise. The two unit laws force each component to be the unique identity map on the corresponding functor value. The resulting answer is 0, 1, 0, 1, 2."
          - problem: "Write the full proof: for categories C and D, the data of functors from C to D as objects, natural transformations as morphisms and vertical composition as composition forms a category [C, D]. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (morphisms): a morphism from F to G is a natural transformation alpha: F => G, and the vertical composite is defined componentwise by (beta alpha)_A = beta_A after alpha_A; it is natural because beta_B alpha_B F(f) = beta_B G(f) alpha_A = H(f) beta_A alpha_A for every arrow f: A -> B of C. Step 2 (identity): define 1_F by (1_F)_A = 1_{F(A)} for each object A of C; the naturality square commutes because both paths equal F(f). Step 3 (unit laws): (1_G alpha)_A = 1_{G(A)} alpha_A = alpha_A and (alpha 1_F)_A = alpha_A 1_{F(A)} = alpha_A, so both unit laws hold componentwise in D. Step 4 (associativity): ((gamma beta) alpha)_A = gamma_A (beta_A alpha_A) = (gamma_A beta_A) alpha_A by associativity of composition in D, so gamma(beta alpha) = (gamma beta) alpha. Conclusion: identity, unit laws and associativity are all verified componentwise because the corresponding statements hold in D, so [C, D] is a category."
      - id: kp2
        name: Isomorphisms in a functor category
        key_prerequisites: [natural-transformations]
        constraints: "Require isomorphisms in a functor category. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Let C be the walking-arrow category X->Y and F,G:C->Set have all four object values {0,1}. Their nonidentity arrow maps are F(f)=[0, 0], G(f)=[1, 1]. At X fix alpha_X=[1,0]. Construct every alpha_Y for which alpha is an isomorphism in [C,Set], then construct its inverse natural transformation. Give the lexicographically least concatenation alpha_Y,beta_X,beta_Y satisfying all naturality and both component-inverse equations. If there is more than one, this rule fixes the answer."
            answer: "1, 0, 1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality restricts which bijection can be the Y-component; pointwise invertibility alone would not impose that square. Inverting both components and checking the reverse square constructs a morphism of the functor category whose two composites are identity transformations. The resulting answer is 1, 0, 1, 0, 1, 0."
          - problem: "Let C be the walking-arrow category X->Y and F,G:C->Set have all four object values {0,1}. Their nonidentity arrow maps are F(f)=[1, 0], G(f)=[0, 1]. At X fix alpha_X=[1,0]. Construct every alpha_Y for which alpha is an isomorphism in [C,Set], then construct its inverse natural transformation. Give the lexicographically least concatenation alpha_Y,beta_X,beta_Y satisfying all naturality and both component-inverse equations. If there is more than one, this rule fixes the answer."
            answer: "0, 1, 1, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality restricts which bijection can be the Y-component; pointwise invertibility alone would not impose that square. Inverting both components and checking the reverse square constructs a morphism of the functor category whose two composites are identity transformations. The resulting answer is 0, 1, 1, 0, 0, 1."
          - problem: "In [C,D], suppose alpha:F=>G has isomorphism components. A proof proposes beta_X=alpha_X^{-1}. Which assertions still require proof before beta is a morphism inverse to alpha: its components have the right types; its naturality square; beta_X alpha_X=id_FX; alpha_X beta_X=id_GX? Give 1 for a claim not already supplied by the component-inverse definition, and0otherwise."
            answer: "0, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Component inverses already have the reversed types and both unit equations. The remaining obligation is naturality, derived by conjugating the square of alpha; only then is beta a morphism of the functor category. The resulting answer is 0, 1, 0, 0."
          - problem: "To show the pointwise inverse beta of alpha is a morphism in[C,D], derive its naturality square from Gf alpha_X=alpha_Y Ff. Precompose with beta_X and postcompose with beta_Y. Encode Ff=1,Gf=2,beta_X=3,beta_Y=4. Give the two sides of the resulting equation as four codes in conventional composition order, putting the side beginning beta_Y first. This must establish naturality without inverting Ff."
            answer: "4, 2, 1, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Conjugating by the two component inverses cancels the alpha components. The surviving equation proves that beta is a natural transformation and hence a morphism of the functor category. The resulting answer is 4, 2, 1, 3."
          - problem: "Claim: if every component of a natural transformation alpha: F => G between functors from C to Set is a bijection, then alpha is an isomorphism in the functor category [C, Set]. Step 1: for each object a, the component alpha_a has an inverse function from G(a) to F(a). Step 2: define beta: G => F by taking, at each object a, the component of beta to be that inverse function. Step 3: any assignment of a bijection G(a) -> F(a) to every object a is automatically a natural transformation. Step 4: at each object a, the composite of beta_a after alpha_a is the identity on F(a), and the composite of alpha_a after beta_a is the identity on G(a). Step 5: hence beta o alpha = 1_F and alpha o beta = 1_G as natural transformations, so alpha is an isomorphism in [C, Set]. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: a bijection of sets has an inverse function. Step 2 is valid: it names the component of beta at each object. Step 3 is not valid: naturality is a condition that ties the components together along the arrows of C, and a family of bijections picked object by object need not satisfy it; the naturality of the componentwise inverse must instead be derived from the naturality of alpha by composing with the inverse functions on both sides. Step 4 is valid: these componentwise identities hold by construction. Step 5 is valid: two natural transformations are equal when all their components agree. The first invalid step is Step 3."
          - problem: "For a family alpha_X:FX->GX between functors C->Set, decide which assertions hold for every C,F,G: (i) if the family is natural and every component bijective, it is an isomorphism in [C,Set]; (ii) component bijectivity alone makes it such an isomorphism; (iii) naturality alone makes it such an isomorphism; (iv) an isomorphism in [C,Set] has bijective components. Give four bits. Prove the valid implications and refute each invalid one with functors on the walking-arrow category; no characterization theorem is supplied."
            answer: "1, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A natural family of bijections has a natural inverse by conjugating its square by the component inverses; conversely evaluating a functor-category inverse gives inverse components. With both arrow maps identities, unequal bijective endpoint components fail naturality, while equal constant components are natural and fail invertibility. The resulting answer is 1, 0, 0, 1."
          - problem: "Write the full proof: a natural transformation alpha: F => G between functors from C to D is an isomorphism in the functor category [C, D] if and only if every component alpha_A is an isomorphism in D. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Statement: alpha is an isomorphism in [C, D] exactly when every component alpha_A is an isomorphism in D. Step 1, forward direction: let beta be a two-sided inverse of alpha in [C, D], so beta o alpha = 1_F and alpha o beta = 1_G. Step 2, evaluation: vertical composition is componentwise, so applying both equations at an object A gives beta_A o alpha_A equal to the identity on F(A) and alpha_A o beta_A equal to the identity on G(A); hence each alpha_A is an isomorphism and alpha is a natural isomorphism. Step 3, converse: suppose every alpha_A is an isomorphism, and define the component beta_A as the inverse of alpha_A at each object A. Step 4, naturality of beta: for an arrow f from A to B, naturality of alpha reads G(f) o alpha_A = alpha_B o F(f); composing on the left with the inverse of alpha_B and on the right with the inverse of alpha_A gives beta_B o G(f) = F(f) o beta_A, so beta is natural. Step 5, conclusion: beta o alpha = 1_F and alpha o beta = 1_G hold at every object, so alpha is an isomorphism in [C, D]; the inverse is unique because inverses in any category are unique, and evaluating at A shows that the component of the inverse is the inverse of the component."
      - id: kp3
        name: Diagram categories
        key_prerequisites: [category-definition]
        constraints: "Require the learner to use diagram categories. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Construct a morphism of the arrow diagram category by solving for its missing component. The source category has one nonidentity arrow u:A->B. Functors F,G to Set have arrow value lists F(u)=[1, 0], G(u)=[2, 0]; their source and target sets are zero-based sets of the indicated sizes, with |F(B)|=2, |G(B)|=3. The component alpha_A has values [1, 0]. Construct the unique alpha_B that makes alpha:F=>G natural. Give its full value list."
            answer: "2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Write the naturality square with the components at the correct objects; its commuting equation forces every value of the missing component. The resulting answer is 2, 0."
          - problem: "Construct an object action and an equivariant diagram-category morphism. A functor from B(Z/2) to Set sends the generator to [1, 0, 3, 2]; the target functor sends it to [1, 0]. Sets are zero-based. Construct the natural transformation h with specified values {0: 1, 2: 0}. Give its entire value list, deriving the condition from naturality at the generator."
            answer: "1, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A diagram-category morphism is a natural transformation. The generator square forces the remaining values on each orbit; its square relation then checks the whole group action. The resulting answer is 1, 0, 0, 1."
          - problem: "In the functor category [2, Set], let F assign F0 = {a, b}, F1 = {1, 2, 3}, with the arrow function sending a to 1 and b to 2. Let G assign G0 = {u, v}, G1 = {x, y}, with the arrow function sending both u and v to x. A natural transformation from F to G is a pair of functions making the square commute. How many natural transformations from F to G are there?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A natural transformation here is a pair α0: {a, b} -> {u, v} and α1: {1, 2, 3} -> {x, y} with α1 after F(a) equal to G(a) after α0. Component counting: α0 has 4 choices. Since G(a) sends both u and v to x, the square forces α1(1) = x and α1(2) = x, leaving α1(3) free with 2 choices. Product rule: 4 times 2. The answer is 8."
          - problem: "Recover a map of Z/2-action diagrams from orbit representatives. A functor from B(Z/2) to Set sends the generator to [1, 0, 3, 2]; the target functor sends it to [1, 0]. Sets are zero-based. Construct the natural transformation h with specified values {0: 0, 2: 1}. Give its entire value list, deriving the condition from naturality at the generator."
            answer: "0, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A diagram-category morphism is a natural transformation. The generator square forces the remaining values on each orbit; its square relation then checks the whole group action. The resulting answer is 0, 1, 1, 0."
          - problem: "Claim: in the functor category [2, Set], every pair of functions α0: F0 -> G0 and α1: F1 -> G1 is a natural transformation from F to G. Step 1: a natural transformation assigns to each object of 2 a function from the F-image to the G-image. Step 2: the objects of 2 are 0 and 1, so the components are α0 and α1. Step 3: naturality requires α1 after F(a) to equal G(a) after α0 for the arrow a of 2. Step 4: this equation holds for every choice of α0 and α1, so every pair is a natural transformation. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it states the component assignment in the definition of a natural transformation. Step 2 is valid: the shape category 2 has exactly the two objects 0 and 1. Step 3 is valid: naturality at the single arrow a is exactly the commuting square condition. Step 4 is the first invalid step: the square condition is a genuine restriction and fails for a badly chosen pair, for instance when α0 picks an element that G(a) sends to x while α1 sends the corresponding image to y. The answer is Step 4."
          - problem: "Construct a natural transformation in the group-action diagram category. A functor from B(Z/2) to Set sends the generator to [1, 0]; the target functor sends it to [1, 0, 2]. Sets are zero-based. Construct the natural transformation h with specified values {0: 2}. Give its entire value list, deriving the condition from naturality at the generator."
            answer: "2, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A diagram-category morphism is a natural transformation. The generator square forces the remaining values on each orbit; its square relation then checks the whole group action. The resulting answer is 2, 2."
          - problem: "Write the full proof: for the shape category 2 with objects 0, 1 and one non-identity arrow a: 0 -> 1, the functor category [2, Set] is the arrow category of Set, whose objects are the functions of Set and whose morphisms are the commuting squares. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (functors are functions): a functor F: 2 -> Set assigns a set F0 to the object 0, a set F1 to the object 1, and a function F(a): F0 -> F1 to the arrow a; the identity arrows must map to identity functions, so no further data is chosen, and every function f: X -> Y arises from exactly one such functor. Hence the objects of [2, Set] are exactly the functions of Set. Step 2 (natural transformations are squares): a natural transformation α: F => G assigns functions α0: F0 -> G0 and α1: F1 -> G1, and naturality at the arrow a says α1 after F(a) = G(a) after α0, which is exactly the statement that the square with top F(a), bottom G(a) and sides α0, α1 commutes. Step 3 (morphisms match): the morphisms of the arrow category of Set are precisely the commuting squares between two functions, so Step 2 shows the morphisms of [2, Set] and of the arrow category coincide, and composition as well as identities are defined componentwise in both categories, so they agree. Conclusion: [2, Set] is the arrow category of Set."
    diagnostic_exemplar:
      problem: "Let $\\mathbf BG$ be the one-object category of a group $G$, so that functors $\\mathbf BG\\to\\mathbf{Set}$ are $G$-sets. Describe the natural transformations between two such functors, and prove that a transformation $\\alpha\\colon F\\Rightarrow F'$ is an isomorphism of the functor category $[\\mathbf BG,\\mathbf{Set}]$ if and only if its single component is a bijection."
      answer: "A functor $F\\colon\\mathbf BG\\to\\mathbf{Set}$ is a set $X=F(*)$ together with the maps $g\\cdot x:=F(g)(x)$; the functor laws say $1\\cdot x=x$ and $(gh)\\cdot x=g\\cdot(h\\cdot x)$, i.e. a $G$-action. A natural transformation $\\alpha\\colon F\\Rightarrow F'$ has a single component $\\alpha_*\\colon X\\to X'$, and the naturality square at $g\\in G$ reads $\\alpha_*(g\\cdot x)=g\\cdot\\alpha_*(x)$: natural transformations are exactly the $G$-equivariant maps. ($\\Rightarrow$) If $\\alpha$ is invertible in $[\\mathbf BG,\\mathbf{Set}]$ there is $\\beta$ with $\\beta\\cdot\\alpha=1_F$ and $\\alpha\\cdot\\beta=1_{F'}$; vertical composition and identities are componentwise, so $\\beta_*$ is a two-sided inverse of $\\alpha_*$ and $\\alpha_*$ is a bijection. ($\\Leftarrow$) If $\\alpha_*$ is a bijection, put $y=\\alpha_*(x)$ in $\\alpha_*(g\\cdot x)=g\\cdot\\alpha_*(x)$ and apply $\\alpha_*^{-1}$: $\\alpha_*^{-1}(g\\cdot y)=g\\cdot\\alpha_*^{-1}(y)$, so $\\alpha_*^{-1}$ is equivariant and therefore a natural transformation $F'\\Rightarrow F$; componentwise it is a two-sided inverse of $\\alpha$. Hence the isomorphisms of $[\\mathbf BG,\\mathbf{Set}]$ are exactly the equivariant bijections."
      solution_sketch: "First translate: a functor $\\mathbf BG\\to\\mathbf{Set}$ is a $G$-set, and the single naturality square reads $\\alpha_*(g\\cdot x)=g\\cdot\\alpha_*(x)$, so transformations are exactly the equivariant maps. Then use that composition in a functor category is componentwise, and check that the set-theoretic inverse of an equivariant bijection is again equivariant."
    anki_seeds:
      - front: "The functor category $[\\mathcal C,\\mathcal D]$ has objects ___ and morphisms ___."
        back: "functors $\\mathcal C\\to\\mathcal D$; natural transformations."
        type: basic
      - front: "An isomorphism in a functor category is exactly a {{c1::natural isomorphism}}."
        back: "natural isomorphism"
        type: cloze

