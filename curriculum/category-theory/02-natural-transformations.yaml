          - problem: "Work in the general setting: $\\alpha\\colon F \\Rightarrow F'$ between functors $\\mathcal{C} \\to \\mathcal{D}$ and $\\beta\\colon G \\Rightarrow G'$ between functors $\\mathcal{D} \\to \\mathcal{E}$. Consider a three-step argument. Step 1: one formula for the horizontal composite sets $(\\beta*\\alpha)_A = G'(\\alpha_A)\\circ\\beta_{FA}$. Step 2: a second formula sets $(\\beta*\\alpha)_A = \\beta_{F'A}\\circ G(\\alpha_A)$. Step 3: the two composites are equal for every object $A$ of $\\mathcal{C}$, so $\\beta*\\alpha\\colon GF \\Rightarrow G'F'$ is well defined. Select the fact that makes Step 3 valid."
            answer: "naturality of beta at alpha_A"
            answer_contract: {"kind": "label", "options": [["naturality of beta at alpha_A"], ["naturality of alpha at maps of C"], ["functoriality of G' on maps of D"], ["naturality of beta at maps of E"]]}
            solution_sketch: "Step 3 asserts $G'(\\alpha_A)\\circ\\beta_{FA} = \\beta_{F'A}\\circ G(\\alpha_A)$, and this equation is exactly the naturality square of $\\beta$ at the morphism $\\alpha_A\\colon FA \\to F'A$ of $\\mathcal{D}$, since $\\beta\\colon G \\Rightarrow G'$. The wrong option 'naturality of alpha at maps of C' only shows that $\\alpha$ is a transformation, not the equality. The wrong option 'functoriality of G' on maps of D' governs how $G'$ composes maps, not the values of $\\beta$. The wrong option 'naturality of beta at maps of E' uses the wrong category, since $\\beta$ is natural on maps of $\\mathcal{D}$. The answer is naturality of beta at alpha_A."
          - problem: "Write the full proof: for $\\alpha\\colon F \\Rightarrow F'$ from $\\mathcal{C}$ to $\\mathcal{D}$ and $\\beta\\colon G \\Rightarrow G'$ from $\\mathcal{D}$ to $\\mathcal{E}$, the two formulas for the component of the horizontal composite $\\beta*\\alpha\\colon GF \\Rightarrow G'F'$ agree at every object, and the composite is a natural transformation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (fix an object): for each object $A$ of $\\mathcal{C}$, the component $\\alpha_A\\colon FA \\to F'A$ is a morphism of $\\mathcal{D}$. Step 2 (first formula): whisker $\\beta$ with $F$ to get $\\beta F\\colon GF \\Rightarrow G'F$ with component $\\beta_{FA}$, and whisker $\\alpha$ with $G'$ to get $G'\\alpha\\colon G'F \\Rightarrow G'F'$ with component $G'(\\alpha_A)$; the vertical composite $(G'\\alpha)\\cdot(\\beta F)$ has component $G'(\\alpha_A)\\circ\\beta_{FA}$. Step 3 (second formula): whisker $\\alpha$ with $G$ to get $G\\alpha\\colon GF \\Rightarrow GF'$ with component $G(\\alpha_A)$, and whisker $\\beta$ with $F'$ to get $\\beta F'\\colon GF' \\Rightarrow G'F'$ with component $\\beta_{F'A}$; the vertical composite $(\\beta F')\\cdot(G\\alpha)$ has component $\\beta_{F'A}\\circ G(\\alpha_A)$. Step 4 (the square that identifies them): the naturality square of $\\beta$ at the morphism $\\alpha_A$ of $\\mathcal{D}$ states exactly $G'(\\alpha_A)\\circ\\beta_{FA} = \\beta_{F'A}\\circ G(\\alpha_A)$, so the two formulas give one family. Step 5 (naturality): whiskerings of natural transformations are natural, and a vertical composite of natural transformations is natural, so this family is natural in $A$ and defines $\\beta*\\alpha\\colon GF \\Rightarrow G'F'$. Answer: the two formulas agree at every object $A$, and $\\beta*\\alpha$ is the natural transformation with that common component."
      - id: kp3
        name: The interchange law
        key_prerequisites: [naturality-proofs]
        constraints: "Require the learner to use the interchange law. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Use the one-object category 1: a functor from 1 to Set is a single set, and a natural transformation between two such functors is a single function. Let the functors F, F' and F'' from 1 to Set give the sets {0,1}, {2,3} and {6,7}; let α be the function with α(0) = 2 and α(1) = 3, and let α' be the function with α'(2) = 7 and α'(3) = 6. On Set, let G send each set X to X×X, let G' be the identity functor, and let G'' send each set X to X×X. Let β have components β_S(x,y) = x, and let β' have components β'_S(x) = (x,x). In the interchange law, the expressions (β'·β)*(α'·α) and (β'*α')·(β*α) are then two functions from {0,1}×{0,1} to {6,7}×{6,7}. Compute their common value on the input (0,1). Give the common value as (x, y)."
            answer: "(7,7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Both sides of the interchange law are functions from {0,1}×{0,1} to {6,7}×{6,7}; the full object is the pair of expressions (β'·β)*(α'·α) and (β'*α')·(β*α) evaluated at the input (0,1). Step 1 (whisker formula for the lower whisker): G(α)(0,1) = (2,3), and β at {2,3} takes the first entry, so (β*α)(0,1) = 2. Step 2 (whisker formula for the upper whisker): G'(α')(2) = 7, and β' at {6,7} sends 7 to (7,7), so the right side (β'*α')·(β*α) sends (0,1) to (7,7). Step 3 (vertical composition, then the whisker formula for the left side): (α'·α)(0) = 7 and (α'·α)(1) = 6, so G(α'·α)(0,1) = (7,6), and (β'·β) at {6,7} sends (u,v) to (u,u), so the left side sends (0,1) to (7,7). Step 4 (the one naturality square): the middle steps agree because β after G(α') equals G'(α') after β, the naturality square of β at the morphism α'; this single square makes the two sides equal. The answer is (7,7)."
          - problem: "The interchange law for α: F ⇒ F', α': F' ⇒ F'', β: G ⇒ G', β': G' ⇒ G'' states that (β'·β)*(α'·α) equals (β'*α')·(β*α). Expanding both expressions at an object A with the whisker formula for horizontal composites, the left side becomes β'_{F''A} ∘ β_{F''A} ∘ G(α'_A) ∘ G(α_A) and the right side becomes β'_{F''A} ∘ G'(α'_A) ∘ β_{F'A} ∘ G(α_A). The two composites agree once a single naturality square is applied. Which transformation has its naturality used, and at which morphism of D?"
            answer: "beta at alpha'(A)"
            answer_contract: {"kind": "label", "options": [["beta at alpha'(A)"], ["beta at alpha(A)"], ["beta' at alpha'(A)"], ["alpha' at alpha(A)"]]}
            solution_sketch: "Expand the left side: the vertical composite α'·α has component α'_A ∘ α_A, so whiskering gives (β'·β)_{F''A} ∘ G(α'_A ∘ α_A) = β'_{F''A} ∘ β_{F''A} ∘ G(α'_A) ∘ G(α_A). Expand the right side: each whisker is β_{F'A} ∘ G(α_A) and β'_{F''A} ∘ G'(α'_A). The middle factors β_{F''A} ∘ G(α'_A) and G'(α'_A) ∘ β_{F'A} are the two routes of the naturality square of β at the morphism α'_A of D, which goes from F'A to F''A; applying that one square makes the sides equal. The option 'beta at alpha(A)' picks the wrong morphism, a component of the first transformation; the option 'beta' at alpha'(A)' is unnecessary because the β' factors already align; the option 'alpha' at alpha(A)' is impossible, since α' is natural only at morphisms of C and α'_A lives in D. The answer is beta at alpha'(A)."
          - problem: "For alpha:F=>Fprime, alpha_prime:Fprime=>Fdoubleprime, beta:G=>Gprime and beta_prime:Gprime=>Gdoubleprime, derive the interchange proof by expanding horizontal and vertical compositions. The middle block in (beta_prime.beta)*(alpha_prime.alpha) must be exchanged for the corresponding block in (beta_prime*alpha_prime).(beta*alpha). Bank: 1: beta_{Fprime A} after G(alpha_A); 2: Gprime(alpha_A) after beta_{FA}; 3: beta_{Fdoubleprime A} after G(alpha_prime_A); 4: Gprime(alpha_prime_A) after beta_{Fprime A}. Give the bank numbers of the block before and after this substitution, in that order. The relevant morphism must be determined from the expanded expression."
            answer: "3, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Expand both sides of interchange. The differing middle block is exactly the square of beta at alpha_prime_A; replacing it makes all remaining factors agree. The resulting answer is 3, 4."
          - problem: "For alpha:F=>Fprime, alpha_prime:Fprime=>Fdoubleprime, beta:G=>Gprime and beta_prime:Gprime=>Gdoubleprime, derive the interchange proof by expanding horizontal and vertical compositions. The middle block in (beta_prime.beta)*(alpha_prime.alpha) must be exchanged for the corresponding block in (beta_prime*alpha_prime).(beta*alpha). Bank: 1: Gprime(alpha_prime_A) after beta_{Fprime A}; 2: beta_{Fdoubleprime A} after G(alpha_prime_A); 3: Gprime(alpha_A) after beta_{FA}; 4: beta_{Fprime A} after G(alpha_A). Give the bank numbers of the block before and after this substitution, in that order. The relevant morphism must be determined from the expanded expression."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Expand both sides of interchange. The differing middle block is exactly the square of beta at alpha_prime_A; replacing it makes all remaining factors agree. The resulting answer is 2, 1."
          - problem: "A student argues for the interchange law (β'·β)*(α'·α) = (β'*α')·(β*α), with α: F ⇒ F', α': F' ⇒ F'', β: G ⇒ G', β': G' ⇒ G''. Step 1: at an object A, the left side is (β'·β)_{F''A} ∘ G(α'_A ∘ α_A). Step 2: at A, the right side is β'_{F''A} ∘ G'(α'_A) ∘ β_{F'A} ∘ G(α_A). Step 3: by naturality of β at the morphism α_A, the factor β_{F'A} can be moved past G(α'_A), so the two sides agree. Step 4: since the components agree at every object, the two transformations are equal. Which step is the first one that is not valid?"
