          - problem: 'Let $F$ be the functor from $\mathbf{Mat}_{\mathbb{Q}}$ to the category of finite-dimensional vector spaces over $\mathbb{Q}$ that sends $n$ to $\mathbb{Q}^n$. A space is in the essential image of $F$ if it is isomorphic to some $\mathbb{Q}^n$. Among the four spaces $\mathbb{Q}^2$, the polynomials $a+bx$ with $a,b\in\mathbb{Q}$, the space $\mathbb{Q}^3$, and the $2\times1$ columns over $\mathbb{Q}$, how many are isomorphic to $F(2)=\mathbb{Q}^2$?'
