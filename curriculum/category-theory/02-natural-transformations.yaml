          - problem: 'Let $\mathcal{C}$ be the category with four objects and exactly one arrow from each object to each object, and let $\mathcal{D}$ be the category with one object and only its identity. Are $\mathcal{C}$ and $\mathcal{D}$ equivalent categories?'
