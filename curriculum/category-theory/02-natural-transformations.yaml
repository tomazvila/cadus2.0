        weight: 0.0
    knowledge_points:
      - id: kp1
        name: The category of functors and natural transformations
        key_prerequisites: [vertical-horizontal-composition]
        constraints: "Require the learner to use the category of functors and natural transformations. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        step_check:
          step: 'using naturality of $\alpha$'
          question: 'Why may $\alpha_B\circ Ff$ be replaced by $Gf\circ\alpha_A$ in this step?'
          options:
            - 'Every composite of two components with a functor image is equal to the other order'
            - 'The functors $F$ and $G$ are equal on arrows, so $Ff=Gf$ and the order is irrelevant'
            - 'Composition in $\mathbf{Set}$ is commutative, so any two composites are equal'
            - 'Naturality of $\alpha$ at the arrow $f$ says these two composites are equal'
          answer: 'Naturality of $\alpha$ at the arrow $f$ says these two composites are equal'
          why: 'The naturality square of $\alpha$ at $f$ is the equation $\alpha_B\circ Ff=Gf\circ\alpha_A$; this is how the componentwise composite of natural transformations is again natural.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the discrete category with objects $a,b,c$, and let $\mathcal{D}$ be the category of the poset $0\le1$, with objects $0$ and $1$ and one arrow from $x$ to $y$ exactly when $x\le y$. In the functor category $[\mathcal{C},\mathcal{D}]$ the objects are the functors from $\mathcal{C}$ to $\mathcal{D}$ and the morphisms are the natural transformations. How many morphisms does $[\mathcal{C},\mathcal{D}]$ have?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism from $F$ to $G$ assigns to each object $x$ of $\mathcal{C}$ an arrow $F(x)\to G(x)$ in $\mathcal{D}$. Since $\mathcal{C}$ is discrete there is no arrow of $\mathcal{C}$ on which to test naturality, so every such assignment is a transformation. $\mathcal{D}$ has $3$ arrows, so the count for three objects is $3\times3\times3=27$.'
          - problem: 'Let $\mathcal{C}$ be the category with two objects $A$ and $B$ and one arrow $f\colon A\to B$ besides the identities. Let $F$ and $G$ both be the functor from $\mathcal{C}$ to $\mathbf{Set}$ that sends both objects to the set $\{0,1\}$ and sends $f$ to the identity map. The morphisms of the functor category $[\mathcal{C},\mathbf{Set}]$ from $F$ to $G$ are the natural transformations from $F$ to $G$. How many are there?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural transformation is a pair of functions $\alpha_A,\alpha_B$ from $\{0,1\}$ to itself. Naturality at $f$ says $\alpha_B\circ F(f)=G(f)\circ\alpha_A$, and both $F(f)$ and $G(f)$ are identities, so $\alpha_B=\alpha_A$. The transformation is one function from $\{0,1\}$ to itself, so there are $2\times2=4$.'
          - problem: 'Let $\mathcal{C}$ be the category with two objects $A$ and $B$ and one arrow $g\colon A\to B$ besides the identities. Define functors $F,G\colon\mathcal{C}\to\mathbf{Set}$ by $F(A)=F(B)=\{0,1,2\}$ with $F(g)$ sending $0\mapsto1$, $1\mapsto2$, $2\mapsto0$, and $G(A)=G(B)=\{0,1,2,3\}$ with $G(g)$ the identity map. Let $\alpha\colon F\Rightarrow G$ be a natural transformation with $\alpha_A(0)=3$, $\alpha_A(1)=0$ and $\alpha_A(2)=1$. Find $\alpha_B(2)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality at $g$ says $\alpha_B(F(g)(x))=G(g)(\alpha_A(x))$ for every $x$. To get the argument $2$ on the left side, take $x=1$, because $F(g)$ sends $1$ to $2$. Since $G(g)$ is the identity, $\alpha_B(2)=\alpha_A(1)=0$.'
          - problem: 'Two lights each have brightness $0$ (off), $1$ (dim) or $2$ (bright). A change of settings may keep each light as it is or raise it. Let $\mathcal{C}$ be the discrete category on the two lights and $\mathcal{D}$ the poset $0\le1\le2$ as a category. A setting of both lights is a functor $\mathcal{C}\to\mathcal{D}$, and a change of settings is a natural transformation. How many morphisms does the functor category $[\mathcal{C},\mathcal{D}]$ have?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism assigns to each light an arrow of $\mathcal{D}$, a pair of brightness levels $x\le y$. The poset $0\le1\le2$ has $6$ such arrows. The two lights choose independently, so there are $6\times6=36$ morphisms.'
          - problem: 'A two-step plan gives each of two steps a level $0$, $1$ or $2$, and the level of step two is never below the level of step one. Such plans are the functors from the category $A\to B$ with one non-identity arrow to the poset category $0\le1\le2$, so they are the objects of a functor category. How many plans are there?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A plan is a pair of levels $(x,y)$ with $x\le y$ from $\{0,1,2\}$. For $x=0$ there are $3$ choices of $y$, for $x=1$ there are $2$, and for $x=2$ there is $1$. The total is $3+2+1=6$.'
          - problem: 'Sam proves that if $\mathcal{D}$ is a groupoid, then every natural transformation $\alpha\colon F\Rightarrow G$ between functors from $\mathcal{C}$ to $\mathcal{D}$ is an isomorphism in $[\mathcal{C},\mathcal{D}]$. Step 1: each component $\alpha_A$ is an isomorphism in $\mathcal{D}$ with inverse $\beta_A$. Step 2: define $\beta\colon G\Rightarrow F$ with components $\beta_A$. Step 3: $\beta$ is natural, because each component $\beta_A$ is an invertible arrow of $\mathcal{D}$. Step 4: for each arrow $f\colon A\to B$, naturality of $\alpha$ gives $G(f)\alpha_A=\alpha_BF(f)$, and composing with $\beta_B$ on the left and $\beta_A$ on the right gives $F(f)\beta_A=\beta_BG(f)$. Step 5: so $\beta\alpha=1_F$ and $\alpha\beta=1_G$. Which step is the first that is not valid, and why?'
            answer: 'Step 3: invertible components do not make beta natural, because naturality ties the components together along arrows; it follows from naturality of alpha.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Step 1 and Step 2 are correct: in a groupoid every component has an inverse, and these inverses form the family $\beta$. Step 3 is the first invalid step: invertible components do not make $\beta$ natural, because naturality ties the components together along arrows. Step 4 supplies the correct argument from the naturality of $\alpha$.'
          - problem: 'Let $\mathcal{C}$ be the discrete category with objects $a,b$. Let $F,G,H,K\colon\mathcal{C}\to\mathbf{Set}$ each send both objects to $\{0,1,2,3,4\}$. Natural transformations $\alpha\colon F\Rightarrow G$, $\beta\colon G\Rightarrow H$ and $\gamma\colon H\Rightarrow K$ have components $\alpha_a(x)=(x+1)\bmod5$, $\alpha_b(x)=2x\bmod5$, $\beta_a(x)=3x\bmod5$, $\beta_b(x)=(x+2)\bmod5$, $\gamma_a(x)=(x+4)\bmod5$, $\gamma_b(x)=3x\bmod5$. In $[\mathcal{C},\mathbf{Set}]$, find $\big((\gamma\cdot\beta)\cdot\alpha\big)_b(3)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Composition in the functor category is componentwise, so $((\gamma\cdot\beta)\cdot\alpha)_b=\gamma_b\circ\beta_b\circ\alpha_b$, whatever the bracketing. First $\alpha_b(3)=6\bmod5=1$. Then $\beta_b(1)=3$ and $\gamma_b(3)=9\bmod5=4$, so the value is $4$.'
          - problem: 'Write the full proof that, for categories $\mathcal{C}$ and $\mathcal{D}$, the functors from $\mathcal{C}$ to $\mathcal{D}$ as objects, the natural transformations as morphisms and vertical composition as composition form a category $[\mathcal{C},\mathcal{D}]$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (morphisms): a morphism from F to G is a natural transformation alpha: F => G, and the vertical composite is defined componentwise by (beta alpha)_A = beta_A after alpha_A; it is natural because beta_B alpha_B F(f) = beta_B G(f) alpha_A = H(f) beta_A alpha_A for every arrow f: A -> B of C. Step 2 (identity): define 1_F by (1_F)_A = 1_{F(A)} for each object A of C; the naturality square commutes because both paths equal F(f). Step 3 (unit laws): (1_G alpha)_A = 1_{G(A)} alpha_A = alpha_A and (alpha 1_F)_A = alpha_A 1_{F(A)} = alpha_A, so both unit laws hold componentwise in D. Step 4 (associativity): ((gamma beta) alpha)_A = gamma_A (beta_A alpha_A) = (gamma_A beta_A) alpha_A by associativity of composition in D, so gamma(beta alpha) = (gamma beta) alpha. Conclusion: identity, unit laws and associativity are all verified componentwise because the corresponding statements hold in D, so [C, D] is a category.'
      - id: kp2
        name: Isomorphisms in a functor category
        key_prerequisites: [natural-transformations]
        constraints: "Require isomorphisms in a functor category. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        step_check:
          step: 'Apply $\theta_B^{-1}$ on the left'
          question: 'Why do we compose the naturality square with $\theta_B^{-1}$ on the left and $\theta_A^{-1}$ on the right?'
          options:
            - 'This makes the square commute, because the original square does not commute at all'
            - 'This turns $Pf$ and $Qf$ into identity arrows, which are always natural'
            - 'This cancels $\theta_A$ and $\theta_B$ and leaves the square of the inverse'
            - 'The inverses are needed because every natural transformation is invertible'
          answer: 'This cancels $\theta_A$ and $\theta_B$ and leaves the square of the inverse'
          why: 'Multiplying $Qf\circ\theta_A=\theta_B\circ Pf$ by the two inverses gives $\theta_B^{-1}\circ Qf=Pf\circ\theta_A^{-1}$, which is naturality of the inverse family.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the category with objects $X,Y$ and one non-identity arrow $f\colon X\to Y$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ send both objects to $\{0,1\}$, with $F(f)$ the constant function $0$ and $G(f)$ the constant function $1$. Let $\alpha\colon F\Rightarrow G$ be a natural transformation with $\alpha_X(0)=1$ and $\alpha_X(1)=0$, and suppose $\alpha$ is an isomorphism in $[\mathcal{C},\mathbf{Set}]$. Find $\alpha_Y(1)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality at $f$ gives $\alpha_Y(F(f)(0))=G(f)(\alpha_X(0))$, so $\alpha_Y(0)=1$. An isomorphism has bijective components, so $\alpha_Y$ is a bijection of $\{0,1\}$ with $\alpha_Y(0)=1$. Hence $\alpha_Y(1)=0$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $X,Y$ and one non-identity arrow $f\colon X\to Y$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ send both objects to $\{0,1\}$, with $F(f)$ the swap $0\mapsto1,1\mapsto0$ and $G(f)$ the identity. Let $\alpha\colon F\Rightarrow G$ be a natural transformation with $\alpha_X$ the swap, and suppose $\alpha$ is an isomorphism in $[\mathcal{C},\mathbf{Set}]$. Find $(\alpha^{-1})_Y(1)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality at $f$ gives $\alpha_Y\circ F(f)=G(f)\circ\alpha_X$, that is, $\alpha_Y\circ\text{swap}=\text{swap}$. So $\alpha_Y$ is the identity of $\{0,1\}$. The inverse transformation has components $(\alpha_Y)^{-1}$, so $(\alpha^{-1})_Y(1)=1$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $X,Y$ and one non-identity arrow $f\colon X\to Y$. Let $F=G\colon\mathcal{C}\to\mathbf{Set}$ send both objects to $\{0,1,2\}$ and send $f$ to the identity map. How many natural isomorphisms from $F$ to $G$ are there in $[\mathcal{C},\mathbf{Set}]$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural transformation is a pair of functions $\alpha_X,\alpha_Y$ and naturality at $f$ forces $\alpha_Y=\alpha_X$ because $F(f)$ and $G(f)$ are identities. It is an isomorphism exactly when this common function is a bijection of $\{0,1,2\}$. There are $3!=6$ bijections.'
          - problem: 'Two clocks each have $3$ positions $0,1,2$. Each tick moves clock $P$ on by $1$ position and clock $Q$ on by $2$ positions, modulo $3$. A relabeling of the positions of $P$ as the positions of $Q$ is a natural isomorphism if it is a bijection that commutes with ticking, that is, relabeling and then ticking gives the same position as ticking and then relabeling. How many such relabelings are there?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The relabeling $h$ must satisfy $h(x+1)=h(x)+2$ modulo $3$. So $h(x)=2x+c$ with $h(0)=c$ free, which gives $3$ choices of $c$. Each of these is a bijection, so there are $3$ relabelings.'
          - problem: 'A toggle switch swaps lamps in pairs on a board of four lamps: it exchanges lamp $0$ with lamp $1$ and lamp $2$ with lamp $3$. A second board has four lamps where the toggle exchanges lamp $0$ with lamp $1$ and leaves lamps $2$ and $3$ as they are. A natural isomorphism from the first board to the second is a bijection of lamps that commutes with the toggle. How many are there?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A bijection that commutes with the toggle sends fixed lamps to fixed lamps. The second board has $2$ fixed lamps and the first board has none. So no bijection commutes with the toggle, and the count is $0$.'
          - problem: 'Sam proves that if every component of a natural transformation $\alpha\colon F\Rightarrow G$ between functors from $\mathcal{C}$ to $\mathbf{Set}$ is a bijection, then $\alpha$ is an isomorphism in $[\mathcal{C},\mathbf{Set}]$. Step 1: each $\alpha_a$ has an inverse function $G(a)\to F(a)$. Step 2: define $\beta\colon G\Rightarrow F$ by taking these inverse functions as components. Step 3: any assignment of a bijection $G(a)\to F(a)$ to every object $a$ is automatically a natural transformation. Step 4: componentwise, $\beta_a\circ\alpha_a$ and $\alpha_a\circ\beta_a$ are identities. Step 5: hence $\beta\circ\alpha=1_F$ and $\alpha\circ\beta=1_G$. Which step is the first that is not valid, and why?'
            answer: 'Step 3: a family of bijections chosen object by object need not be natural, because naturality must hold along every arrow of C.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Steps 1 and 2 are valid, since a bijection has an inverse function and these name the components of $\beta$. Step 3 is the first invalid step: naturality ties the components together along the arrows of $\mathcal{C}$, so a family of bijections chosen object by object need not satisfy it. The correct argument conjugates the square of $\alpha$ by the inverses.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $X,Y$ and one non-identity arrow $f\colon X\to Y$. Let $F=G\colon\mathcal{C}\to\mathbf{Set}$ send both objects to $\{0,1\}$ and send $f$ to the identity map. Let $\alpha$ be the family with $\alpha_X$ the identity of $\{0,1\}$ and $\alpha_Y$ the swap $0\mapsto1,1\mapsto0$. Is $\alpha$ an isomorphism in $[\mathcal{C},\mathbf{Set}]$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is an isomorphism", "it is", "yes it is"], ["no", "it is not an isomorphism", "it is not", "not an isomorphism", "not natural"]]}
            solution_sketch: 'Both components are bijections, but a morphism of $[\mathcal{C},\mathbf{Set}]$ must be natural. Naturality at $f$ would need $\alpha_Y(0)=\alpha_X(0)$ because $F(f)$ and $G(f)$ are identities, yet $\alpha_Y(0)=1$ and $\alpha_X(0)=0$. So $\alpha$ is not even a natural transformation, and the answer is no.'
          - problem: 'Write the full proof that a natural transformation $\alpha\colon F\Rightarrow G$ between functors from $\mathcal{C}$ to $\mathcal{D}$ is an isomorphism in the functor category $[\mathcal{C},\mathcal{D}]$ if and only if every component $\alpha_A$ is an isomorphism in $\mathcal{D}$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Statement: alpha is an isomorphism in [C, D] exactly when every component alpha_A is an isomorphism in D. Step 1, forward direction: let beta be a two-sided inverse of alpha in [C, D], so beta o alpha = 1_F and alpha o beta = 1_G. Step 2, evaluation: vertical composition is componentwise, so applying both equations at an object A gives beta_A o alpha_A equal to the identity on F(A) and alpha_A o beta_A equal to the identity on G(A); hence each alpha_A is an isomorphism and alpha is a natural isomorphism. Step 3, converse: suppose every alpha_A is an isomorphism, and define the component beta_A as the inverse of alpha_A at each object A. Step 4, naturality of beta: for an arrow f from A to B, naturality of alpha reads G(f) o alpha_A = alpha_B o F(f); composing on the left with the inverse of alpha_B and on the right with the inverse of alpha_A gives beta_B o G(f) = F(f) o beta_A, so beta is natural. Step 5, conclusion: beta o alpha = 1_F and alpha o beta = 1_G hold at every object, so alpha is an isomorphism in [C, D]; the inverse is unique because inverses in any category are unique, and evaluating at A shows that the component of the inverse is the inverse of the component.'
      - id: kp3
        name: Diagram categories
        key_prerequisites: [category-definition]
        constraints: "Require the learner to use diagram categories. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        try_first:
          problem: 'A group $\mathbb{Z}/2$ acts on the set $\{0,1\}$ by swapping $0$ and $1$. How many functions $h\colon\{0,1\}\to\{0,1\}$ commute with the swap, that is, satisfy $h(\text{swap}(x))=\text{swap}(h(x))$ for $x=0,1$?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The commuting functions are the identity and the swap itself, so there are $2$. A functor from the one-object category of $\mathbb{Z}/2$ to $\mathbf{Set}$ is such an action, and its natural transformations are exactly the functions that commute with the action.'
        step_check:
          step: 'for the morphism $g$ the square $Y(g)\circ\alpha_\ast=\alpha_\ast\circ X(g)$ must commute'
          question: 'Why does this square say that $\alpha_\ast(g\cdot x)=g\cdot\alpha_\ast(x)$?'
          options:
            - 'Here $X(g)$ and $Y(g)$ are the identity maps, so the square holds anyway'
            - 'At $x$, the two sides read $g\cdot\alpha_\ast(x)$ and $\alpha_\ast(g\cdot x)$'
            - 'The square needs the action of $g$ only on the target set $Y\ast$ of $\alpha_\ast$'
            - 'The function $\alpha_\ast$ must be a bijection, which makes both sides equal'
          answer: 'At $x$, the two sides read $g\cdot\alpha_\ast(x)$ and $\alpha_\ast(g\cdot x)$'
          why: 'Evaluating the square at $x$ gives $Y(g)(\alpha_\ast(x))=\alpha_\ast(X(g)(x))$, which is the equation $g\cdot\alpha_\ast(x)=\alpha_\ast(g\cdot x)$.'
        exemplars:
          - problem: 'Let $\mathbf{2}$ be the category with objects $0,1$ and one non-identity arrow $a\colon0\to1$. Let $F,G\colon\mathbf{2}\to\mathbf{Set}$ be the functors with $F(0)=\{m,n\}$, $F(1)=\{1,2,3\}$, where $F(a)$ sends $m\mapsto1$ and $n\mapsto2$, and $G(0)=\{u,v\}$, $G(1)=\{x,y\}$ where $G(a)$ sends both $u$ and $v$ to $x$. A natural transformation from $F$ to $G$ is a pair of functions making the square commute. How many natural transformations from $F$ to $G$ are there?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural transformation is a pair $\alpha_0\colon\{m,n\}\to\{u,v\}$ and $\alpha_1\colon\{1,2,3\}\to\{x,y\}$ with $\alpha_1\circ F(a)=G(a)\circ\alpha_0$. There are $4$ choices of $\alpha_0$. Since $G(a)$ sends both $u$ and $v$ to $x$, the square forces $\alpha_1(1)=\alpha_1(2)=x$, and $\alpha_1(3)$ is free with $2$ choices, so there are $4\times2=8$.'
          - problem: 'Let $\mathbf{2}$ be the category with objects $0,1$ and one non-identity arrow $a\colon0\to1$. Let $F,G\colon\mathbf{2}\to\mathbf{Set}$ have $F(0)=\{0,1\}$ and $F(1)=\{0,1\}$ with $F(a)\colon0\mapsto1,1\mapsto0$, and $G(0)=\{0,1\}$, $G(1)=\{0,1,2\}$ with $G(a)\colon0\mapsto2,1\mapsto0$. Let $\alpha\colon F\Rightarrow G$ be a natural transformation with $\alpha_0(0)=1$ and $\alpha_0(1)=0$. Find $\alpha_1(0)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality at $a$ says $\alpha_1(F(a)(x))=G(a)(\alpha_0(x))$ for each $x$. Take $x=1$, since $F(a)(1)=0$. Then $\alpha_1(0)=G(a)(\alpha_0(1))=G(a)(0)=2$.'
          - problem: 'A toggle button swaps lamps in pairs on a board of four lamps: it exchanges lamps $0$ and $1$, and it exchanges lamps $2$ and $3$. A display has two panels $0,1$, and the toggle exchanges them. A map $h$ from the lamps to the panels commutes with toggling, so that toggling a lamp and then looking at its panel gives the same as looking first and then toggling the panel. The map sends lamp $0$ to panel $1$ and lamp $2$ to panel $0$. Which panel does it send lamp $3$ to?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Lamp $3$ is the toggle of lamp $2$, and $h$ commutes with toggling. So $h(3)$ is the toggle of $h(2)=0$, which is panel $1$. The answer is $1$.'
          - problem: 'A group $\mathbb{Z}/2$ acts on the set $\{0,1\}$ by swapping the two elements, and on the set $\{0,1,2\}$ by swapping $0$ and $1$ and fixing $2$. These are functors from the one-object category $\mathbf{B}(\mathbb{Z}/2)$ to $\mathbf{Set}$. How many natural transformations are there from the first functor to the second?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural transformation is a function $h$ with $h(\text{swap}(x))=\text{swap}(h(x))$. Choosing $h(0)=y$ forces $h(1)=\text{swap}(y)$, and the condition then holds for both elements. There are $3$ choices of $y$ in $\{0,1,2\}$, so there are $3$ natural transformations.'
          - problem: 'A sorting machine $S$ sends items $1$ and $2$ to bin $p$ and item $3$ to bin $q$. A labeling machine $T$ sends tag $u$ to $x$ and tag $v$ to $y$ (where $x,y,z$ are three labels). A compatible relabeling is a function $\alpha_0$ from the items $\{1,2,3\}$ to the tags $\{u,v\}$ together with a function $\alpha_1$ from the bins $\{p,q\}$ to the labels $\{x,y,z\}$ such that sorting then relabeling the bin agrees with relabeling the item and then applying $T$. These are the morphisms from $S$ to $T$ in the functor category $[\mathbf{2},\mathbf{Set}]$. How many compatible relabelings are there?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The square needs $\alpha_1(p)=T(\alpha_0(1))=T(\alpha_0(2))$. Since $T$ is injective, $\alpha_0(1)=\alpha_0(2)$, which gives $2$ choices, and $\alpha_0(3)$ has $2$ choices. Then $\alpha_1(p)$ and $\alpha_1(q)$ are determined, so there are $2\times2=4$.'
          - problem: 'Sam claims that in the functor category $[\mathbf{2},\mathbf{Set}]$ every pair of functions $\alpha_0\colon F(0)\to G(0)$ and $\alpha_1\colon F(1)\to G(1)$ is a natural transformation $F\Rightarrow G$. Step 1: a natural transformation assigns to each object of $\mathbf{2}$ a function from the $F$-image to the $G$-image. Step 2: the objects of $\mathbf{2}$ are $0$ and $1$, so the components are $\alpha_0$ and $\alpha_1$. Step 3: naturality requires $\alpha_1\circ F(a)=G(a)\circ\alpha_0$ for the arrow $a$. Step 4: this equation holds for every choice of $\alpha_0$ and $\alpha_1$, so every pair is a natural transformation. Which step is the first that is not valid, and why?'
            answer: 'Step 4: the equation alpha_1 after F(a) equals G(a) after alpha_0 is a real restriction, and it fails for some pairs of functions.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Steps 1, 2 and 3 are valid: they state the components and the naturality square at the single arrow $a$. Step 4 is the first invalid step, because the square condition is a real restriction. For example it fails when $\alpha_0$ and $\alpha_1$ send an element and its image under $F(a)$ to places that $G(a)$ does not connect.'
          - problem: 'Let $\mathbf{2}$ be the category with objects $0,1$ and one non-identity arrow $a\colon0\to1$. Let $F,G\colon\mathbf{2}\to\mathbf{Set}$ have $F(0)=G(0)=\{0,1\}$ and $F(1)=G(1)=\{0,1,2\}$, with $F(a)=G(a)$ the function $0\mapsto0,1\mapsto2$. Let $\alpha_0$ be the swap of $\{0,1\}$ and let $\alpha_1$ be the identity of $\{0,1,2\}$. For how many elements $x$ of $F(0)$ do the two routes of the naturality square at $a$ give the same element of $G(1)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $x=0$ the route through $F(a)$ and $\alpha_1$ gives $0$, and the route through $\alpha_0$ and $G(a)$ gives $G(a)(1)=2$. At $x=1$ the first route gives $2$ and the second gives $G(a)(0)=0$. The routes differ at both elements, so the number is $0$ and the pair is not a natural transformation.'
          - problem: 'Write the full proof that, for the shape category $\mathbf{2}$ with objects $0,1$ and one non-identity arrow $a\colon0\to1$, the functor category $[\mathbf{2},\mathbf{Set}]$ is the arrow category of $\mathbf{Set}$, whose objects are the functions of $\mathbf{Set}$ and whose morphisms are the commuting squares.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (functors are functions): a functor F: 2 -> Set assigns a set F0 to the object 0, a set F1 to the object 1, and a function F(a): F0 -> F1 to the arrow a; the identity arrows must map to identity functions, so no further data is chosen, and every function f: X -> Y arises from exactly one such functor. Hence the objects of [2, Set] are exactly the functions of Set. Step 2 (natural transformations are squares): a natural transformation α: F => G assigns functions α0: F0 -> G0 and α1: F1 -> G1, and naturality at the arrow a says α1 after F(a) = G(a) after α0, which is exactly the statement that the square with top F(a), bottom G(a) and sides α0, α1 commutes. Step 3 (morphisms match): the morphisms of the arrow category of Set are precisely the commuting squares between two functions, so Step 2 shows the morphisms of [2, Set] and of the arrow category coincide, and composition as well as identities are defined componentwise in both categories, so they agree. Conclusion: [2, Set] is the arrow category of Set.'
    diagnostic_exemplar:
      problem: "Let $\\mathbf BG$ be the one-object category of a group $G$, so that functors $\\mathbf BG\\to\\mathbf{Set}$ are $G$-sets. Describe the natural transformations between two such functors, and prove that a transformation $\\alpha\\colon F\\Rightarrow F'$ is an isomorphism of the functor category $[\\mathbf BG,\\mathbf{Set}]$ if and only if its single component is a bijection."
      answer: "A functor $F\\colon\\mathbf BG\\to\\mathbf{Set}$ is a set $X=F(*)$ together with the maps $g\\cdot x:=F(g)(x)$; the functor laws say $1\\cdot x=x$ and $(gh)\\cdot x=g\\cdot(h\\cdot x)$, i.e. a $G$-action. A natural transformation $\\alpha\\colon F\\Rightarrow F'$ has a single component $\\alpha_*\\colon X\\to X'$, and the naturality square at $g\\in G$ reads $\\alpha_*(g\\cdot x)=g\\cdot\\alpha_*(x)$: natural transformations are exactly the $G$-equivariant maps. ($\\Rightarrow$) If $\\alpha$ is invertible in $[\\mathbf BG,\\mathbf{Set}]$ there is $\\beta$ with $\\beta\\cdot\\alpha=1_F$ and $\\alpha\\cdot\\beta=1_{F'}$; vertical composition and identities are componentwise, so $\\beta_*$ is a two-sided inverse of $\\alpha_*$ and $\\alpha_*$ is a bijection. ($\\Leftarrow$) If $\\alpha_*$ is a bijection, put $y=\\alpha_*(x)$ in $\\alpha_*(g\\cdot x)=g\\cdot\\alpha_*(x)$ and apply $\\alpha_*^{-1}$: $\\alpha_*^{-1}(g\\cdot y)=g\\cdot\\alpha_*^{-1}(y)$, so $\\alpha_*^{-1}$ is equivariant and therefore a natural transformation $F'\\Rightarrow F$; componentwise it is a two-sided inverse of $\\alpha$. Hence the isomorphisms of $[\\mathbf BG,\\mathbf{Set}]$ are exactly the equivariant bijections."
      solution_sketch: "First translate: a functor $\\mathbf BG\\to\\mathbf{Set}$ is a $G$-set, and the single naturality square reads $\\alpha_*(g\\cdot x)=g\\cdot\\alpha_*(x)$, so transformations are exactly the equivariant maps. Then use that composition in a functor category is componentwise, and check that the set-theoretic inverse of an equivariant bijection is again equivariant."
    anki_seeds:
      - front: "The functor category $[\\mathcal C,\\mathcal D]$ has objects ___ and morphisms ___."
        back: "functors $\\mathcal C\\to\\mathcal D$; natural transformations."
        type: basic
      - front: "An isomorphism in a functor category is exactly a {{c1::natural isomorphism}}."
        back: "natural isomorphism"
        type: cloze

  - id: equivalence-of-categories
    name: Equivalence of Categories
    core: false                # terminal; nothing in this curriculum builds on it
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: functor-categories
        weight: 0.4
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: natural-isomorphisms
        weight: 0.4
