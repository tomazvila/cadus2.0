        constraints: "Require the learner to use natural isomorphisms in practice. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        step_check:
          step: 'so every component $s_{A,B}$ is a bijection'
          question: 'Why is a bijective component $s_{A,B}$ not enough to conclude that $s$ is a natural isomorphism?'
          options:
            - 'A natural isomorphism needs every component to be an identity map of its set'
            - 'Bijections are not isomorphisms in the category $\mathbf{Set}$ in general'
            - 'The squares must also commute for every pair $(f,g)$ in $\mathbf{Set}$'
          answer: 'The squares must also commute for every pair $(f,g)$ in $\mathbf{Set}$'
          why: 'A natural isomorphism is a natural transformation whose components are isomorphisms, so both the bijections and the commuting squares are needed.'
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $f\colon A\to A^\prime$ with $A=\{0,1\}$, $A^\prime=\{5,7\}$, $f(0)=5$, $f(1)=7$, and $g\colon B\to B^\prime$ with $B=\{0,1,2\}$, $B^\prime=\{2,4\}$, $g(0)=2$, $g(1)=4$, $g(2)=4$. The swap maps $s_{A,B}(a,b)=(b,a)$ form a natural isomorphism, so the legs $s_{A^\prime,B^\prime}\circ(f\times g)$ and $(g\times f)\circ s_{A,B}$ agree. Which pair do both give on the element $(1,2)$?'
            answer: '(4, 7)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The leg $s_{A^\prime,B^\prime}\circ(f\times g)$ sends $(1,2)$ to $(f(1),g(2))=(7,4)$ and then swaps to $(4,7)$. The leg $(g\times f)\circ s_{A,B}$ sends $(1,2)$ to $(2,1)$ and then to $(g(2),f(1))=(4,7)$. Both legs give $(4,7)$.'
          - problem: 'In $\mathbf{Set}$ let $1=\{*\}$ and let $\theta_X\colon\mathrm{Hom}(1,X)\to X$ be given by $\theta_X(f)=f(*)$. Take $X=\{1,2,3,4\}$, $Y=\{1,2\}$ and $g\colon X\to Y$ with $g(1)=2$, $g(2)=1$, $g(3)=2$, $g(4)=1$, and let $f\colon 1\to X$ be the map with $f(*)=3$. The naturality square for $\theta$ at $g$ compares $g\circ\theta_X$ with $\theta_Y\circ\mathrm{Hom}(1,g)$. What element of $Y$ do both give on the input $f$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leg $g\circ\theta_X$ sends $f$ to $f(*)=3$ and then to $g(3)=2$. The leg $\theta_Y\circ\mathrm{Hom}(1,g)$ sends $f$ to $g\circ f$ and then to $(g\circ f)(*)=g(3)=2$. Both give $2$.'
          - problem: 'For each set $X$ let $\alpha_X\colon X\to X$ swap the two smallest elements of $X$ (when $X$ is a set of numbers with at least two elements) and fix every other element. Consider this as a family from the identity functor on $\mathbf{Set}$ to itself. Take $X=\{1,2,3\}$ and $g\colon X\to X$ with $g(1)=2$, $g(2)=3$, $g(3)=1$. What is the least $x$ in $X$ for which $g(\alpha_X(x))$ and $\alpha_X(g(x))$ differ?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $\alpha_X$ swaps $1$ and $2$ and fixes $3$. At $x=1$ we get $g(\alpha_X(1))=g(2)=3$ and $\alpha_X(g(1))=\alpha_X(2)=1$. These differ, so the least such $x$ is $1$, and the family is not natural.'
          - problem: 'List reversal $\rho_X\colon L(X)\to L(X)$ is a natural isomorphism from the list functor $L$ to itself. Let $L(f)$ apply $f$ to every entry of a list, with $f(1)=6$, $f(2)=4$, $f(3)=9$. The two legs of the naturality square at $f$ send the list $[1,2,3]$ to the same list. What is its first entry?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leg $L(f)\circ\rho_X$ reverses $[1,2,3]$ to $[3,2,1]$ and then applies $f$, giving $[9,4,6]$. The leg $\rho_Y\circ L(f)$ gives $[6,4,9]$ and then reverses it to $[9,4,6]$. The first entry is $9$.'
          - problem: 'Let $2=\{0,1\}$ and let $\theta_X\colon\mathrm{Hom}(2,X)\to X\times X$ be given by $\theta_X(h)=(h(0),h(1))$. Is $\theta$ a natural isomorphism from the functor $\mathrm{Hom}(2,-)$ to the functor $X\mapsto X\times X$ on $\mathbf{Set}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is natural", "it is a natural isomorphism", "natural"], ["no", "it is not natural", "it is not a natural isomorphism", "not natural"]]}
            solution_sketch: 'Each $\theta_X$ is a bijection, because a function on $\{0,1\}$ is determined by its two values and any pair of values occurs. For $g\colon X\to Y$ both legs send $h$ to $(g(h(0)),g(h(1)))$. So the squares commute and $\theta$ is a natural isomorphism.'
          - problem: 'Let $1=\{*\}$ and let $\theta_X\colon\mathrm{Hom}(1,X)\to X$ be $f\mapsto f(*)$. Sam says that $\theta_Y(g\circ f)=f(*)$ for $f\colon1\to X$ and $g\colon X\to Y$. Take $X=Y=\mathbb Z$, $g(x)=3x$ and $f(*)=2$. What is the correct value of $\theta_Y(g\circ f)$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $\theta_Y(g\circ f)=(g\circ f)(*)=g(f(*))=g(2)=6$. Sam''s value $f(*)=2$ leaves out the map $g$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ be functors with all four object sets equal to $\{0,1,2\}$. The map $F(u)$ sends $0\mapsto 2$, $1\mapsto 0$, $2\mapsto 1$ and $G(u)$ sends $0\mapsto 0$, $1\mapsto 1$, $2\mapsto 2$. Let $\alpha\colon F\Rightarrow G$ be the natural isomorphism with $\alpha_A$ given by $0\mapsto 2$, $1\mapsto 1$, $2\mapsto 0$ and $\alpha_B$ given by $0\mapsto 1$, $1\mapsto 0$, $2\mapsto 2$. What is $\beta_B(1)$ for the inverse $\beta=\alpha^{-1}$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse has components $\beta_X=\alpha_X^{-1}$, so $\beta_B(1)$ is the element $x$ with $\alpha_B(x)=1$. Since $\alpha_B(0)=1$, we get $\beta_B(1)=0$. As a check, $\alpha_B(\beta_B(1))=\alpha_B(0)=1$.'
          - problem: 'A league table stores each match as a pair (home score, away score), and a second table stores it as (away score, home score). Swapping a pair is a natural isomorphism. Home scores are converted to points with $f(0)=0$, $f(1)=1$, $f(2)=1$, $f(3)=3$, and away scores with $g(0)=0$, $g(1)=0$, $g(2)=2$, $g(3)=3$. Converting the match $(3,2)$ and then swapping gives the same pair as swapping and then converting. What is that pair?'
            answer: '(2, 3)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'Converting $(3,2)$ gives $(f(3),g(2))=(3,2)$, and swapping gives $(2,3)$. Swapping first gives $(2,3)$, and converting with the exchanged rules gives $(g(2),f(3))=(2,3)$. Both orders give $(2,3)$.'
          - problem: 'Write the full proof that the swap maps $s_{A,B}(a,b)=(b,a)$ form a natural isomorphism between the bifunctors $(A,B)\mapsto A\times B$ and $(A,B)\mapsto B\times A$ on $\mathbf{Set}$. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (components): for sets $A, B$ define $s_{A,B}: A \times B \to B \times A$ by $s_{A,B}(a,b) = (b,a)$. Step 2 (inverse component): $s_{B,A} \circ s_{A,B}(a,b) = s_{B,A}(b,a) = (a,b)$ and similarly $s_{A,B} \circ s_{B,A} = \mathrm{id}$, so each component is a bijection with inverse $s_{B,A}$. Step 3 (naturality, elementwise): for $f: A \to A''$ and $g: B \to B''$, evaluate the square on $(a,b)$. The lower side gives $(g \times f)(s_{A,B}(a,b)) = (g \times f)(b,a) = (g(b), f(a))$. The upper side gives $s_{A'',B''}((f \times g)(a,b)) = s_{A'',B''}(f(a), g(b)) = (g(b), f(a))$. The two results agree, so the square commutes. Step 4 (conclusion): every component is an isomorphism and the family is natural in $(A,B)$, so $s$ is a natural isomorphism.'
    diagnostic_exemplar:
      problem: "Let $\\alpha\\colon F\\Rightarrow G$ be a natural transformation in which every component $\\alpha_A$ is an isomorphism. Prove that the inverses $\\beta_A=\\alpha_A^{-1}$ form a natural transformation $\\beta\\colon G\\Rightarrow F$."
      answer: "For $f\\colon A\\to B$, start from naturality of $\\alpha$: $Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$. Pre-compose with $\\alpha_A^{-1}$ and post-compose with $\\alpha_B^{-1}$: $\\alpha_B^{-1}\\circ Gf=\\alpha_B^{-1}\\circ Gf\\circ\\alpha_A\\circ\\alpha_A^{-1}=\\alpha_B^{-1}\\circ\\alpha_B\\circ Ff\\circ\\alpha_A^{-1}=Ff\\circ\\alpha_A^{-1}$. That is $Ff\\circ\\beta_A=\\beta_B\\circ Gf$ — exactly naturality of $\\beta\\colon G\\Rightarrow F$."
      solution_sketch: "Conjugate the naturality square of $\\alpha$: pre-compose with $\\alpha_A^{-1}$ and post-compose with $\\alpha_B^{-1}$. The matched pairs cancel and what is left standing is precisely the naturality square for $\\beta$, with $F$ and $G$ exchanged."
    anki_seeds:
      - front: "A natural isomorphism is a natural transformation whose..."
        back: "every component is an isomorphism (equivalently, an iso in the functor category)."
        type: basic
      - front: "If $\\alpha$ is a natural iso, are the inverse components $\\alpha_A^{-1}$ natural?"
        back: "Yes — invert the naturality square."
        type: basic

