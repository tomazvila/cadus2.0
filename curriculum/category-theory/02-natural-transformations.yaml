unit: natural-transformations
course: category-theory
module: "Natural Transformations"
topics:
  - id: naturality-square
    name: The Naturality Square
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: functors
        weight: 0.5
        key: true
      - id: commutative-diagrams
        weight: 0.5
        key: true
      - id: functor-composition-identity
        weight: 0.2
      - id: diagram-chasing
        weight: 0.2
      - id: category-definition
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Components and their types
        key_prerequisites: [functors]
        constraints: "Both functors must be parallel ($\\mathcal{C}\\to\\mathcal{D}$, same variance); always type each component before writing an equation."
        exemplars:
          - problem: "Given parallel functors $F,G\\colon\\mathcal{C}\\to\\mathcal{D}$, state what data a natural transformation $\\alpha\\colon F\\Rightarrow G$ carries and the type of each component."
            answer: "One morphism $\\alpha_A\\colon FA\\to GA$ of $\\mathcal{D}$ for each object $A$ of $\\mathcal{C}$."
            solution_sketch: "The data is a family indexed by the objects of $\\mathcal{C}$: for each object $A$, a morphism $\\alpha_A\\colon FA\\to GA$ in $\\mathcal{D}$, called the component of $\\alpha$ at $A$. The source is the $F$-image and the target the $G$-image of the same object, which is why $F$ and $G$ must be parallel functors with the same domain, codomain, and variance. The naturality condition is then an extra requirement on this family, one equation per morphism of $\\mathcal{C}$."
          - problem: "Let $F,G\\colon\\mathcal{C}\\to P$ be parallel functors whose codomain is a poset $P$ viewed as a category. Type the components of a transformation $\\alpha\\colon F\\Rightarrow G$ and determine how many such $\\alpha$ there can be."
            answer: "Each component must be a morphism $FA\\to GA$ in $P$, which exists iff $FA\\le GA$ and is then unique; so there is exactly one $\\alpha$ if $FA\\le GA$ for all $A$, and none otherwise."
            solution_sketch: "The component at $A$ must be typed $\\alpha_A\\colon FA\\to GA$ in $P$. In a poset category $\\mathrm{Hom}(x,y)$ has one element if $x\\le y$ and is empty otherwise, so $\\alpha_A$ exists exactly when $FA\\le GA$, and when it exists there is no choice about it. Hence $\\mathrm{Nat}(F,G)$ has at most one element: it is a singleton when $FA\\le GA$ for every object $A$, and empty as soon as one object fails that. Naturality imposes nothing extra, since both legs of any square are morphisms $FA\\to GB$ in a thin category and are therefore equal. So functors into a poset are themselves ordered pointwise."
      - id: kp2
        name: Writing and reading the square
        key_prerequisites: [commutative-diagrams]
        constraints: "Label the four sides of the square with $\\alpha_A$, $Ff$, $Gf$, $\\alpha_B$ before writing the equation."
        exemplars:
          - problem: "Let $t: F \\Rightarrow G$ be a natural transformation between functors $F, G: C \\to D$, and let $f: A \\to B$ be a morphism in $C$. The naturality square at $f$ has corners $F(A)$ top-left, $G(A)$ top-right, $F(B)$ bottom-left, $G(B)$ bottom-right. Its top edge is the component $t_A: F(A) \\to G(A)$, its left edge is $Ff$, and its right edge is $Gf$. State the morphism that runs along the bottom edge of this square."
            answer: "t_B"
            answer_contract: {"kind": "label", "options": [["t_B"], ["t_A"], ["Ff"], ["Gf"]]}
            solution_sketch: "Full object: the square has corners $F(A)$ top-left, $G(A)$ top-right, $F(B)$ bottom-left, $G(B)$ bottom-right. Step 1 (label the sides): the top edge is $t_A: F(A) \\to G(A)$, the left edge is $Ff: F(A) \\to F(B)$, and the right edge is $Gf: G(A) \\to G(B)$. Step 2 (read the bottom): the bottom edge runs from $F(B)$ to $G(B)$, which is exactly the component at $B$. The option $t_A$ names the top edge, $Ff$ names the left edge, and $Gf$ names the right edge, so each mislabels a side. The answer is t_B."
          - problem: "Let $C$ be the poset $0 < 1 < 2$ viewed as a category: there is an arrow $(x, y)$ from $x$ to $y$ exactly when $x \\le y$, and $(z, w) \\circ (x, z) = (x, w)$. Monotone maps give functors $C \\to C$, with $F(x, y) = (F(x), F(y))$. Take $F(0) = 0$, $F(1) = 1$, $F(2) = 1$ and $G(0) = 1$, $G(1) = 1$, $G(2) = 2$, so a transformation $t: F \\Rightarrow G$ has components $t_0 = (0, 1)$, $t_1 = (1, 1)$, $t_2 = (1, 2)$. Let $f = (0, 1)$ and $g = (1, 2)$. Compute the across-then-down composite $G(g \\circ f) \\circ t_0$ of the naturality square at $g \\circ f$. Give the answer as (x, y)."
            answer: "(0, 2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: the naturality square at $g \\circ f$ has corners $F(0)$, $G(0)$, $F(2)$, $G(2)$ and sides $t_0$, $F(g \\circ f)$, $G(g \\circ f)$, $t_2$. Step 1 (functoriality): $G(g \\circ f) = Gg \\circ Gf = (G(1), G(2)) \\circ (G(0), G(1)) = (1, 2) \\circ (1, 1) = (1, 2)$. Step 2 (compose along the path): $(1, 2) \\circ t_0 = (1, 2) \\circ (0, 1) = (0, 2)$. The answer is (0, 2)."
          - problem: "View the poset $0 < 1 < 2$ as a category, so a functor from it to itself is a monotone map. Take $F(0) = 0$, $F(1) = 2$, $F(2) = 2$ and $G(0) = 1$, $G(1) = 1$, $G(2) = 2$. A component $t_x$ of a transformation from $F$ to $G$ must be an arrow from $F(x)$ to $G(x)$, and such an arrow exists only when $F(x) \\le G(x)$. Find the smallest $x$ among $0, 1, 2$ for which no component $t_x$ can exist."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the component $t_x$ is a side of the square, an arrow from $F(x)$ to $G(x)$, so it exists only when $F(x) \\le G(x)$. Step 1 (compare at 0): $F(0) = 0 \\le G(0) = 1$, so $t_0$ exists. Step 2 (compare at 1): $F(1) = 2 > G(1) = 1$, so there is no arrow from $2$ to $1$ and $t_1$ is impossible. Step 3 (compare at 2): $F(2) = 2 \\le G(2) = 2$, so $t_2$ exists. The smallest $x$ with no component is 1."
          - problem: "Let $C$ be the poset $0 < 1 < 2 < 3$ viewed as a category: the arrow $(x, y)$ goes from $x$ to $y$ when $x \\le y$, and $(z, w) \\circ (x, z) = (x, w)$. Monotone maps give functors $C \\to C$. Take $F(0) = 1$, $F(1) = 1$, $F(2) = 2$, $F(3) = 2$ and $G(0) = 2$, $G(1) = 2$, $G(2) = 3$, $G(3) = 3$, with components $t_0 = (1, 2)$, $t_1 = (1, 2)$, $t_2 = (2, 3)$, $t_3 = (2, 3)$, and take $f = (0, 2)$. The naturality square at $f$ has sides $t_0$, $Ff$, $Gf$, $t_2$, and its two paths from $F(0)$ to $G(2)$ are equal. Compute the common value of these two composite paths. Give the answer as (x, y)."
            answer: "(1, 3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: the square at $f = (0, 2)$ has corners $F(0) = 1$, $G(0) = 2$, $F(2) = 2$, $G(2) = 3$, with sides $t_0 = (1, 2)$ top, $Ff = (1, 2)$ left, $Gf = (2, 3)$ right, $t_2 = (2, 3)$ bottom. Step 1 (across then down): $Gf \\circ t_0 = (2, 3) \\circ (1, 2) = (1, 3)$. Step 2 (down then across): $t_2 \\circ Ff = (2, 3) \\circ (1, 2) = (1, 3)$. Both paths agree, so the common value is (1, 3)."
          - problem: "A student labels the naturality square for a transformation $t: F \\Rightarrow G$ at $f: A \\to B$. Step 1: place $F(A)$ top-left, $G(A)$ top-right, $F(B)$ bottom-left, $G(B)$ bottom-right. Step 2: the left edge is $Ff$ and the right edge is $Gf$. Step 3: the bottom edge is $t_A$, the arrow from $F(A)$ to $G(A)$. Step 4: the two paths from $F(A)$ to $G(B)$ agree, so naturality at $f$ reads $Gf \\circ t_A = t_B \\circ Ff$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: those are the standard corners of the naturality square. Step 2 is valid: $Ff$ goes down the left side from $F(A)$ to $F(B)$, and $Gf$ down the right side from $G(A)$ to $G(B)$. Step 3 is not valid: the bottom edge runs from $F(B)$ to $G(B)$, so it must be $t_B$; $t_A$ is the top edge, from $F(A)$ to $G(A)$. Step 4 states the correct equation, but it rests on the mislabeled Step 3. The answer is Step 3."
          - problem: "Let $C$ be the category with a single object whose morphisms are $0, 1, 2, 3$, composed by addition modulo $4$, with identity $0$. A functor $C \\to C$ that sends $1$ to $m$ sends each morphism $x$ to $m x$ modulo $4$. Let $F$ send $1$ to $2$, and let $G$ send $1$ to $0$. A natural transformation from $F$ to $G$ is a single morphism $u$, its only component. The naturality square at the morphism $x$ reads $G(x) + u = u + F(x)$ modulo $4$. How many of the four morphisms $u$ make this equation hold for every $x$?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: $F$ sends each morphism $x$ to $2x$ modulo $4$, and $G$ sends each $x$ to $0$; the naturality square at $x$ compares the two morphisms $G(x) + u$ and $u + F(x)$ from the single object to itself. Step 1 (write the square): the equation is $0 + u = u + 2x$ modulo $4$. Step 2 (test $x = 1$): this demands $u = u + 2$ modulo $4$, that is, $2 = 0$ modulo $4$, which is false. Step 3 (conclude): the square fails at $x = 1$ for every choice of $u$, so no morphism works. The answer is 0."
          - problem: "Write the full proof: for functors $F, G: C \\to D$, a family $\\alpha = (\\alpha_A)$ with $\\alpha_A: F(A) \\to G(A)$ for each object $A$ of $C$, and a morphism $f: A \\to B$ in $C$, label the four sides of the naturality square with $\\alpha_A$, $Ff$, $Gf$, $\\alpha_B$ and show that $\\alpha$ is natural at $f$ exactly when the square commutes, that is, when $Gf \\circ \\alpha_A = \\alpha_B \\circ Ff$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (corners): place $F(A)$ top-left, $G(A)$ top-right, $F(B)$ bottom-left, $G(B)$ bottom-right, since $F$ and $G$ send the objects $A$ and $B$ to these four objects. Step 2 (label the sides, before writing any equation): the top edge is the component $\\alpha_A: F(A) \\to G(A)$; the left edge is $Ff: F(A) \\to F(B)$, the image of $f$ under $F$; the right edge is $Gf: G(A) \\to G(B)$; the bottom edge is $\\alpha_B: F(B) \\to G(B)$. Step 3 (paths): the two directed paths from $F(A)$ to $G(B)$ are the composite $Gf \\circ \\alpha_A$, going across then down, and the composite $\\alpha_B \\circ Ff$, going down then across. Step 4 (equation): the square commutes exactly when these two composites are equal, and that equality, $Gf \\circ \\alpha_A = \\alpha_B \\circ Ff$, is precisely the condition that $\\alpha$ is natural at $f$. Hence the labeled square states naturality at $f$."
      - id: kp3
        name: Checking a square elementwise in Set
        key_prerequisites: [diagram-chasing]
        constraints: "Compute both legs on a general element and compare; do not appeal to a picture."
        exemplars:
          - problem: "Let $\\Delta_X\\colon X\\to X\\times X$ be $x\\mapsto(x,x)$. Verify $\\Delta$ is a natural transformation from $1_{\\mathbf{Set}}$ to the functor $X\\mapsto X\\times X$, $f\\mapsto f\\times f$."
            answer: "Both legs send $x\\mapsto(f(x),f(x))$."
            solution_sketch: "For $f\\colon X\\to Y$ the square asks $(f\\times f)\\circ\\Delta_X=\\Delta_Y\\circ f$. On an element $x\\in X$: the left leg gives $(f\\times f)(x,x)=(f(x),f(x))$; the right leg gives $\\Delta_Y(f(x))=(f(x),f(x))$. They agree for every $x$, so the two functions are equal and the square commutes for every $f$: $\\Delta$ is natural."
          - problem: "Let $L$ be the list functor ($LX=X^*$, $Lf=f^*$ applied letterwise) and let $\\Delta_{\\mathbb N}$ be the constant functor at $\\mathbb N$ (every morphism goes to $1_{\\mathbb N}$). Verify that length, $\\ell_X(x_1\\cdots x_n)=n$, is natural $L\\Rightarrow\\Delta_{\\mathbb N}$."
            answer: "Both legs send a word of length $n$ to $n$, because mapping letterwise does not change length."
            solution_sketch: "The square at $f\\colon X\\to Y$ asks $\\Delta_{\\mathbb N}(f)\\circ\\ell_X=\\ell_Y\\circ L(f)$. On a word $w=x_1\\cdots x_n$: the left leg gives $1_{\\mathbb N}(\\ell_X(w))=n$; the right leg gives $\\ell_Y(f(x_1)\\cdots f(x_n))=n$, since $f^*$ replaces each letter by one letter. They agree for every $w$, so the square commutes for every $f$ and $\\ell$ is natural. A transformation into a constant functor is exactly a family of maps that is invariant under the functor's action — here, 'length does not care what the letters are'."
    diagnostic_exemplar:
      problem: "Let $S\\colon\\mathbf{Set}\\to\\mathbf{Set}$ be the functor $X\\mapsto X\\sqcup X$, $f\\mapsto f\\sqcup f$, and let $\\iota_X\\colon X\\to X\\sqcup X$ be the left inclusion. Write the naturality square for $\\iota$ at $f\\colon X\\to Y$ and verify it elementwise."
      answer: "The square asks $(f\\sqcup f)\\circ\\iota_X=\\iota_Y\\circ f$. On $x\\in X$: the left leg puts $x$ in the left copy and applies $f$ there, giving the left-copy element $f(x)$; the right leg applies $f$ and then includes into the left copy, also giving left-copy $f(x)$. The two legs agree at every $x$, so the square commutes for every $f$ and $\\iota\\colon 1_{\\mathbf{Set}}\\Rightarrow S$ is natural."
      solution_sketch: "Write the square with legs $Sf=f\\sqcup f$ and $\\iota$, then chase a single $x\\in X$ both ways round; each route produces $f(x)$ in the left copy. That the copy-label matches is the entire content of naturality here."
    anki_seeds:
      - front: "The component of $\\alpha\\colon F\\Rightarrow G$ at an object $A$ has what type?"
        back: "$\\alpha_A\\colon FA\\to GA$ (a morphism of the target category)."
        type: basic
      - front: "The naturality square for $\\alpha$ at $f\\colon A\\to B$ commutes: {{c1::$Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$}}."
        back: "$Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$"
        type: cloze
      - front: "Why must $F$ and $G$ be parallel functors for $\\alpha\\colon F\\Rightarrow G$ to make sense?"
        back: "so each component $\\alpha_A\\colon FA\\to GA$ is typable and $Ff$, $Gf$ point the same way."
        type: basic

  - id: natural-transformations
    name: Natural Transformations
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: naturality-square
        weight: 0.6
        key: true
      - id: functors
        weight: 0.4
        key: true
      - id: commutative-diagrams
        weight: 0.3
      - id: hom-functors
        weight: 0.3
        key: true
      - id: discrete-indiscrete-categories
        weight: 0.2
      - id: category-definition
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: First examples in Set
        key_prerequisites: [naturality-square]
        constraints: "Concrete transformations on $\\mathbf{Set}$ endofunctors (power set, lists, products); verify the square elementwise on a general element, never by picture."
        exemplars:
          - problem: "Let P be the covariant power-set functor on Set: for a map f: A -> B, the map P(f) sends a subset S of A to its image f(S). The singleton map eta_A(a) = {a} is a candidate component of a transformation from the identity functor to P. Take A = {1, 2}, B = {5, 7}, f(1) = 7, f(2) = 5, and the element a = 1. The two legs of the square at this element are P(f)(eta_A(1)) and eta_B(f(1)), and they agree. Give their common value."
            answer: "{7}"
            answer_contract: {"kind": "set"}
            solution_sketch: "Full square: the two legs are P(f) after eta_A and eta_B after f, checked at the element 1 of A. Step 1 (singleton map): eta_A(1) = {1}. Step 2 (image rule for P): P(f)({1}) = {f(1)} = {7}. Step 3 (other leg): eta_B(f(1)) = eta_B(7) = {7}. Both legs produce the same subset, so the common value is {7}."
          - problem: "Let L be the list functor on Set: for f: X -> Y, the map L(f) applies f to each letter of a word. Word reversal rho_X is a candidate component of a transformation from L to itself. Take X = {x, y}, Y = {0, 1}, the map f(x) = 0 and f(y) = 1, and the word w = xxy. The legs L(f)(rho_X(w)) and rho_Y(L(f)(w)) agree. Give their common value as a list."
            answer: "1, 0, 0"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Full word: w = xxy with f(x) = 0 and f(y) = 1. Step 1 (reversal): rho_X(w) = yxx. Step 2 (letterwise map): L(f)(yxx) = 100. Step 3 (other leg): L(f)(xxy) = 001, and rho_Y(001) = 100. The two legs produce the same word, so the common value is 1, 0, 0."
          - problem: "Let F be the product functor F(A) = A x A, with F(f) acting componentwise on pairs. The diagonal d_A(a) = (a, a) is a candidate component of a transformation from the identity functor to F. Take A = {1, 2, 3}, B = {0, 1}, the map f(1) = 0, f(2) = 1, f(3) = 1, and the element a = 2. The legs F(f)(d_A(2)) and d_B(f(2)) agree. Give their common value as (x, y)."
            answer: "(1,1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full pair: d_A(2) = (2, 2) in A x A. Step 1 (diagonal map): d_A(2) = (2, 2). Step 2 (componentwise map): F(f)(2, 2) = (f(2), f(2)) = (1, 1). Step 3 (other leg): d_B(f(2)) = d_B(1) = (1, 1). The legs agree, so the common value is (1,1)."
          - problem: "Let L be the list functor on Set and K the constant functor that sends every set to the set of whole numbers and every map to the identity on that set. The length map len_X(w), the number of letters of w, is a candidate component of a transformation from L to K. Take f: {p, q} -> {0, 1} with f(p) = 1 and f(q) = 0, and the word w = pqpqp. The legs K(f)(len_X(w)) and len_Y(L(f)(w)) agree. Give their common value."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full word: w = pqpqp with f(p) = 1 and f(q) = 0. Step 1 (length map): len_X(w) = 5. Step 2 (constant functor): K(f) is the identity on the numbers, so K(f)(5) = 5. Step 3 (other leg): L(f)(w) = 10101, and len_Y(10101) = 5. The two legs give the same number, so the common value is 5."
          - problem: "A student claims that c_A(a) = A, the whole underlying set, gives a transformation from the identity functor to the covariant power-set functor P whose square commutes for every map. Test the claim on A = {4}, B = {4, 9} and the map f: A -> B with f(4) = 9. Give the value of each leg at the element 4: first P(f)(c_A(4)), then c_B(f(4))."
            answer: "leg1 = {9}; leg2 = {4, 9}"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "set"}, "name": "leg1"}, {"contract": {"kind": "set"}, "name": "leg2"}]}
            solution_sketch: "Full claim: c_A(a) = A for every element a. Step 1 (component): c_A(4) = {4}, the whole set A. Step 2 (image rule): P(f)({4}) = {f(4)} = {9}. Step 3 (other leg): c_B(f(4)) = c_B(9) = {4, 9}, the whole set B. The two legs differ, so the student's claim fails; the answer is leg1 = {9}; leg2 = {4, 9}."
          - problem: "Claim: the singleton map eta_A(a) = {a} satisfies the naturality square for every f: A -> B, as a transformation from the identity functor to the power-set functor P. Step 1: take a general element a of A. Step 2: the top leg gives eta_B(f(a)) = {f(a)}. Step 3: the bottom leg gives P(f)(eta_A(a)) = P(f)({a}) = {a}. Step 4: the two legs give the same subset of B, so the square commutes. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: an elementwise check begins with a general element. Step 2 is valid: eta_B(f(a)) = {f(a)} applies the singleton map after f. Step 4 would be valid if Step 3 were, since equal legs close the square. Step 3 is the first invalid step: it claims P(f)({a}) = {a}, but the image rule gives {f(a)}; the element inside the subset was never moved by f. The answer is Step 3."
          - problem: "Write the full proof: list reversal rho_X is a natural transformation from the list functor L on Set to itself. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (components): for each set X, define rho_X: L(X) -> L(X) by reversing the order of the letters of a word; the empty word stays empty. Step 2 (set up the square): fix any map f: X -> Y and a general word w = x1 x2 ... xn in L(X). Step 3 (top leg): reversal first gives rho_X(w) = xn ... x2 x1, then the letterwise map gives L(f)(rho_X(w)) = f(xn) ... f(x2) f(x1). Step 4 (bottom leg): mapping first gives L(f)(w) = f(x1) f(x2) ... f(xn), then reversal gives rho_Y(L(f)(w)) = f(xn) ... f(x2) f(x1). Step 5 (conclusion): the two legs agree on every word, checked elementwise, so L(f) composed with rho_X equals rho_Y composed with L(f); the naturality square commutes for every f, and rho is a natural transformation from L to itself."
      - id: kp2
        name: Natural transformations between hom-functors
        key_prerequisites: [hom-functors]
        constraints: "Use associativity of composition as the only ingredient; state which variable is fixed."
        exemplars:
          - problem: "Fix a function f from A to B, with A = {1,2,3} and B = {4,5}, given by f(1) = 4, f(2) = 4, f(3) = 5. Let g be the variable function from B to X, with X = {6,7,8}, given by g(4) = 6 and g(5) = 8. The component of the pre-composition transformation at X sends g to the composite g(f(-)). Evaluate the composite g(f(3))."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The fixed variable is f from A to B, and g is the variable element of Hom(B,X). The component (f*)_X is defined by pre-composition: it sends g to the composite of g after f. Evaluate the full composite first: f(3) = 5 by the table for f, then g(5) = 8 by the table for g. The value of g(f(3)) is 8."
          - problem: "Fix a function f from A to B, with A = {1,2} and B = {3,4,5}, given by f(1) = 3 and f(2) = 5. Let h be the variable function from W to A, with W = {0,6}, given by h(0) = 2 and h(6) = 1. The component of the post-composition transformation at W sends h to the composite f(h(-)). Evaluate the composite f(h(6))."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The fixed variable is f from A to B, and h is the variable element of Hom(W,A). The component (f*)_W of the post-composition transformation sends h to the composite of f after h. Evaluate the full composite first: h(6) = 1 by the table for h, then f(1) = 3 by the table for f. The value of f(h(6)) is 3."
          - problem: "Fix a function f from A to B, with A = {9} and B = {2,4}, given by f(9) = 4. Let g be the function from B to X, with X = {1,3,5}, given by g(2) = 3 and g(4) = 5, and let k be the function from X to Y, with Y = {0,7}, given by k(1) = 0, k(3) = 7, k(5) = 0. In the naturality square for the pre-composition transformation at k, both paths send g to one function from A to Y. Evaluate the value that both paths give at 9."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The fixed variable is f from A to B, while g and k are the data of the square at k. The naturality square compares the composite k after (g after f) with the composite (k after g) after f, applied to the point 9. Left path: f(9) = 4, then g(4) = 5, then k(5) = 0. Right path: the composite k after g sends 4 to k(5) = 0, and applied to f(9) = 4 it gives 0; the two paths agree because composition is associative. The value that both paths give is 0."
          - problem: "A one-object category has as morphisms the integers, and the composite of two morphisms is their sum; this composition is associative. Fix the morphism f = 3, and let g = 7 be the variable morphism. The component of the pre-composition transformation at the single object sends g to the composite of g with f. Compute the image of g."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The fixed variable is the morphism f = 3, and g is the variable morphism of the one-object category. The component of the pre-composition transformation sends g to the composite of g with f, and by the definition of composition in this category that composite is the sum g + f. Compute the sum: 7 + 3 = 10. The image of g is 10."
          - problem: "Fix a morphism f from A to B. Claim: the components (f*)_X from Hom(B,X) to Hom(A,X), sending g to the composite g after f, form a natural transformation from Hom(B,-) to Hom(A,-). Step 1: the square at k from X to Y must satisfy the equation Hom(A,k) after (f*)_X = (f*)_Y after Hom(B,k). Step 2: for g in Hom(B,X), the left side sends g to k after (g after f). Step 3: the right side sends g to g after (k after f). Step 4: by associativity the two composites agree, so the square commutes and f* is natural. Select the first step that is not valid."
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly states the naturality equation required at k, so it is valid. Step 2 correctly applies the definitions: Hom(A,k) after (f*)_X sends g to k after (g after f), so it is valid. Step 3 is the first invalid step: the right side applies (f*)_Y to Hom(B,k) of g, which gives (k after g) after f, not g after (k after f); the expression k after f is not even composable, since k starts at X while f lands in B. Step 4 would be a valid conclusion once Step 3 is corrected, since associativity is the only ingredient needed. The answer is Step 3."
          - problem: "A small category has the five objects A, B, C, D and E. Fix a morphism f from A to B. The pre-composition transformation f* from Hom(B,-) to Hom(A,-) assigns one component (f*)_X to each object X of the category. How many components does f* have?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The fixed variable is the morphism f from A to B. A natural transformation between the functors Hom(B,-) and Hom(A,-) assigns one component to every object of the category, because both functors are indexed by the objects. The objects are A, B, C, D and E, so count them: the total is 5. The number of components is 5."
          - problem: "Write the full proof: fix a morphism f from A to B in a category C; prove that the post-composition components (f*)_X from Hom(X,A) to Hom(X,B), sending h to the composite f after h, form a natural transformation from Hom(-,A) to Hom(-,B). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "The fixed variable is f from A to B; h is the variable element of Hom(X,A). Step 1 (components): for each object X define (f*)_X from Hom(X,A) to Hom(X,B) by sending h to the composite f after h. Step 2 (the square): for a morphism u from W to X, naturality requires (f*)_W after Hom(u,A) = Hom(u,B) after (f*)_X, where both functors act on u by pre-composition. Step 3 (evaluate both sides): on h in Hom(X,A) the left side gives f after (h after u) and the right side gives (f after h) after u. Step 4 (associativity): associativity of composition, the only ingredient, gives f after (h after u) = (f after h) after u, so the square commutes for every u. Conclusion: f* is a natural transformation of presheaves from Hom(-,A) to Hom(-,B)."
      - id: kp3
        name: Identities and degenerate cases
        key_prerequisites: [discrete-indiscrete-categories]
        constraints: "Say precisely which naturality squares have to be checked, and why they hold."
        exemplars:
          - problem: "Let C be the category with objects A and B and, besides the identity arrows, a single arrow f from A to B. Let F be a functor from C to Set with F(A) = {1, 2, 3}, F(B) = {1, 2, 3}, and F(f)(1) = 2, F(f)(2) = 3, F(f)(3) = 3. For the identity transformation of F, whose component at each object is the identity map, the two legs of the naturality square at f are the same function. Find the common value of the two legs at the element 2."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The arrows of C are the two identity arrows and f, so the squares to check are the two identity squares and the square at f; the identity squares hold by the functor laws and the unit laws. The square at f asks whether the identity on F(B) after F(f) equals F(f) after the identity on F(A). By the unit laws both legs equal F(f). At the element 2, F(f) gives 3, so the common value is 3."
          - problem: "Let D be a discrete category with six objects, and let F and G be two functors from D to Set. A natural transformation from F to G assigns one component to each object, and naturality is verified by one square per arrow of D. How many naturality squares have to be checked?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a discrete category the only arrows are the identity arrows, one per object, so the squares to check are the six squares at those arrows. The square at the identity arrow of an object A asks whether the image of that arrow under G, followed by the component at A, equals the component at A followed by the image of that arrow under F. By the functor laws both images are identity maps, and by the unit laws both legs equal the component at A, so naturality is automatic. The number of squares is 6."
          - problem: "Let M be the category with a single object whose arrows are the elements of a cyclic group of order four, with composition given by addition modulo four. Let F be the functor from M to Set that sends the object to the set {0, 1, 2, 3} and sends the arrow k to the map that adds k modulo four. For the identity transformation of F, both legs of the naturality square at the arrow 3 are the same map. Find the common value of the two legs at the element 2."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The category has a single object, so every naturality square sits at that object, one square per arrow; here there is one square per group element. For the identity transformation, the square at the arrow 3 asks whether the action of 3 after the identity map equals the identity map after the action of 3. By the unit laws both legs are the map that adds 3 modulo four. At the element 2 this gives 5 modulo 4, so the common value is 1."
          - problem: "Let I be the indiscrete category with two objects X and Y: exactly one arrow between any two objects, where the arrow u from X to Y and the arrow v from Y to X are mutually inverse. Define functors F and G from I to Set: both send X to {1, 2} and Y to {a, b}. For F, the map on u sends 1 to a and 2 to b, and the map on v sends a to 1 and b to 2. For G, the map on u sends 1 to b and 2 to a, and the map on v sends b to 1 and a to 2. How many natural transformations are there from F to G?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A natural transformation here needs two components: a map from F(X) = {1, 2} to G(X) = {1, 2} and a map from F(Y) = {a, b} to G(Y) = {a, b}. The squares to check are the square at u and the square at v; the identity squares hold by the unit laws. The square at u says the G-map on u after the component at X equals the component at Y after the F-map on u. Composing on the right with the F-map on v, and using that the F-maps on u and v undo each other, the component at Y is forced to be the G-map on u after the component at X after the F-map on v. Each of the four maps at X determines exactly one map at Y this way, and the square at v then holds because the G-maps on u and v undo each other. So there are 4 natural transformations, and the answer is 4."
          - problem: "Claim: for every functor F from a category C to Set, the family whose component at each object A is the identity map on F(A) is a natural transformation from F to F. Step 1: for each arrow f from A to B, the square requires that F(f) after the component at A equals the component at B after F(f). Step 2: here F(f) is itself an identity map, so the left leg equals the component at A. Step 3: by the unit law, the right leg equals F(f). Step 4: so both legs are equal and the family is natural. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly states the required naturality square. Step 2 is the first invalid step: it asserts that F(f) is an identity map, but a functor only sends identity arrows to identities, not every arrow; the correct left leg is F(f) after the identity on F(A), which the unit law equates to F(f). Step 3 is valid: the unit law gives the right leg as F(f). Step 4 is invalid as written, because it declares the two unequal legs of Step 2 equal; with the corrected Step 2 both legs are F(f) and the conclusion then holds. The first step that is not valid is Step 2."
          - problem: "A student claims that for every functor F, the identity family is the only natural transformation from F to itself. Let C be the category with a single object and a single arrow, and let F be a functor from C to Set that sends the object to a finite set S. Give the smallest size of S for which the claim is false."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "With one object and only the identity arrow, a natural transformation from F to F is a single map from S to S. The only naturality square, at the identity arrow, holds by the functor laws and the unit laws, so every such map is natural. If S has one element, there is only the identity map and the claim holds. If S has two elements, there are four maps, so the identity family is not the only one. The smallest size is 2."
          - problem: "Write the full proof: if C is a discrete category, then a natural transformation between two functors F and G from C to any category D is exactly an arbitrary family of arrows, one from F(A) to G(A) for each object A of C, with no further condition. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (what must be checked): for every arrow f from A to B in C, the naturality square requiring that G(f) after the component at A equals the component at B after F(f) must commute. Step 2 (the arrows of C): C is discrete, so its only arrows are the identity arrows, one for each object. Step 3 (the square at an identity): by the functor laws, F sends the identity arrow of A to the identity on F(A) and G sends it to the identity on G(A); by the unit laws of D both legs of that square equal the component at A, so every square commutes for any choice of family. Step 4 (converse): a natural transformation is by definition a family of arrows from F(A) to G(A), one per object, so such families exist exactly as stated. Conclusion: natural transformations from F to G are precisely the arbitrary families of arrows from F(A) to G(A), one per object of C, with no further condition."
    diagnostic_exemplar:
      problem: "Fix $f\\colon A\\to B$ in $\\mathcal{C}$. Prove that pre-composition, with components $(f^*)_X\\colon\\mathrm{Hom}(B,X)\\to\\mathrm{Hom}(A,X)$, $g\\mapsto g\\circ f$, is a natural transformation $\\mathrm{Hom}(B,-)\\Rightarrow\\mathrm{Hom}(A,-)$."
      answer: "Both hom-functors act on $k\\colon X\\to Y$ by post-composition $k_*$. Naturality at $k$ asks $k_*\\circ(f^*)_X=(f^*)_Y\\circ k_*$. On $g\\in\\mathrm{Hom}(B,X)$: the left side gives $k\\circ(g\\circ f)$ and the right side $(k\\circ g)\\circ f$, equal by associativity. So every naturality square commutes and $f^*$ is natural."
      solution_sketch: "Both hom-functors act by post-composition, so chasing an element $g$ through the naturality square at $k$ compares $k\\circ(g\\circ f)$ with $(k\\circ g)\\circ f$ — associativity is the whole proof."
    anki_seeds:
      - front: "A natural transformation $\\alpha\\colon F\\Rightarrow G$ is..."
        back: "a family of components $\\alpha_A\\colon FA\\to GA$ such that $Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$ for every $f\\colon A\\to B$."
        type: basic
      - front: "For $f\\colon A\\to B$, what are the two natural transformations built from $f$ by composition?"
        back: "$f^*\\colon\\mathrm{Hom}(B,-)\\Rightarrow\\mathrm{Hom}(A,-)$ (pre-composition) and $f_*\\colon\\mathrm{Hom}(-,A)\\Rightarrow\\mathrm{Hom}(-,B)$ (post-composition)."
        type: basic
      - front: "The identity natural transformation $1_F$ has components {{c1::$1_{FA}$}}."
        back: "$1_{FA}$"
        type: cloze

  - id: naturality-proofs
    name: Proving Naturality
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: natural-transformations
        weight: 0.5
        key: true
      - id: functors
        weight: 0.6
      - id: diagram-chasing
        weight: 0.4
        key: true
      - id: commutative-diagrams
        weight: 0.3
      - id: direct-proof
        weight: 0.0
      - id: first-isomorphism-theorem
        weight: 0.0
      # Phase C reconciliation: kp1's constraints generate "quotient constructions such
      # as abelianization" and its third exemplar proves $\eta_G : G \to G/[G,G]$ natural,
      # leaning on descent of homomorphisms to the quotient — commutator-subgroup kp3.
      - id: commutator-subgroup
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Verifying a naturality square in algebra
        key_prerequisites: [natural-transformations, commutator-subgroup]
        constraints: "Algebraic instances built from monoid or group homomorphisms, including quotient constructions such as abelianization: name the two functors and their common source and target, then chase a single element around the square, citing which homomorphism law (or well-definedness on cosets) makes each leg agree."
        exemplars:
          - problem: "Let $U\\colon\\mathbf{Mon}\\to\\mathbf{Set}$ be the forgetful functor. Prove that the squaring maps $s_M\\colon UM\\to UM$, $x\\mapsto x^2$, form a natural transformation $s\\colon U\\Rightarrow U$."
            answer: "For every monoid homomorphism $f$, $Uf\\circ s_M=s_N\\circ Uf$, because $f(x^2)=f(x)^2$."
            solution_sketch: "Both $U$ and $U$ go $\\mathbf{Mon}\\to\\mathbf{Set}$, so a transformation between them is well typed, and each component $s_M$ is only required to be a function. Fix a homomorphism $f\\colon M\\to N$; $Uf$ is its underlying function. Chase $x\\in UM$ both ways: one leg gives $Uf(s_M(x))=f(x\\cdot x)$, the other gives $s_N(Uf(x))=f(x)\\cdot f(x)$. Since $f$ preserves the operation, $f(x\\cdot x)=f(x)f(x)$, so the legs agree at every $x$ and the square commutes; $s$ is natural. Note $s_M$ is generally *not* a homomorphism — naturality only asks the components to be morphisms of the target category, here $\\mathbf{Set}$. The same chase with $x\\mapsto x^n$ works for every $n\\ge 1$, since homomorphisms preserve powers."
          - problem: "Let $(-)^\\times\\colon\\mathbf{Mon}\\to\\mathbf{Set}$ send a monoid $M$ to its set of invertible elements $M^\\times$ and a homomorphism $f$ to its restriction $f^\\times$, and let $U\\colon\\mathbf{Mon}\\to\\mathbf{Set}$ be the forgetful functor. Check $(-)^\\times$ is well defined and prove the inclusions $\\iota_M\\colon M^\\times\\to UM$ form a natural transformation $(-)^\\times\\Rightarrow U$."
            answer: "$f(u^{-1})$ inverts $f(u)$, so $f^\\times$ is well defined; then $Uf\\circ\\iota_M=\\iota_N\\circ f^\\times$, both sending $u\\mapsto f(u)$."
            solution_sketch: "First, well-definedness: if $u\\in M^\\times$ has inverse $u^{-1}$ then $f(u)f(u^{-1})=f(uu^{-1})=f(e_M)=e_N$ and symmetrically, using that a monoid homomorphism preserves the operation and the identity; so $f(u)\\in N^\\times$ and $f^\\times(u):=f(u)$ makes sense. Identities and composites restrict to identities and composites, so $(-)^\\times$ is a functor. Now naturality at $f\\colon M\\to N$: chase $u\\in M^\\times$. One leg gives $Uf(\\iota_M(u))=f(u)$; the other gives $\\iota_N(f^\\times(u))=f(u)$. The legs agree, so the square commutes and $\\iota$ is natural — the units of a monoid sit inside it naturally, with no choice made anywhere."
          - problem: "Let $\\mathrm{ab}\\colon\\mathbf{Grp}\\to\\mathbf{Grp}$ send $G$ to its abelianization $G^{\\mathrm{ab}}=G/[G,G]$, where $[G,G]$ is the (normal) subgroup generated by all commutators $xyx^{-1}y^{-1}$. Prove the quotient maps $\\eta_G\\colon G\\to G^{\\mathrm{ab}}$ form a natural transformation $1_{\\mathbf{Grp}}\\Rightarrow\\mathrm{ab}$."
            answer: "For $f\\colon G\\to H$, $\\mathrm{ab}(f)\\circ\\eta_G=\\eta_H\\circ f$, both sending $g\\mapsto f(g)[H,H]$."
            solution_sketch: "A homomorphism $f\\colon G\\to H$ sends commutators to commutators, so it descends to $\\mathrm{ab}(f)=f^{\\mathrm{ab}}\\colon G^{\\mathrm{ab}}\\to H^{\\mathrm{ab}}$, $g[G,G]\\mapsto f(g)[H,H]$. Then $f^{\\mathrm{ab}}(\\eta_G(g))=f^{\\mathrm{ab}}(g[G,G])=f(g)[H,H]=\\eta_H(f(g))$. So $\\mathrm{ab}(f)\\circ\\eta_G=\\eta_H\\circ f$; the naturality square commutes and $\\eta$ is natural."
      - id: kp2
        name: Naturality is closed under composition
        key_prerequisites: [diagram-chasing]
        constraints: "Prove closure by pasting the two naturality squares, citing naturality of each factor once; concrete confirmations use the list functor."
        exemplars:
          - problem: "If $\\alpha\\colon F\\Rightarrow G$ and $\\beta\\colon G\\Rightarrow H$ are natural, prove the componentwise composite $(\\beta\\alpha)_A:=\\beta_A\\circ\\alpha_A$ is natural."
            answer: "Paste the two naturality squares."
            solution_sketch: "For $f\\colon A\\to B$: $Hf\\circ(\\beta_A\\circ\\alpha_A)=(Hf\\circ\\beta_A)\\circ\\alpha_A=(\\beta_B\\circ Gf)\\circ\\alpha_A=\\beta_B\\circ(Gf\\circ\\alpha_A)=\\beta_B\\circ(\\alpha_B\\circ Ff)=(\\beta_B\\circ\\alpha_B)\\circ Ff$, using naturality of $\\beta$, then of $\\alpha$, and associativity. So $\\beta\\alpha$ is natural."
          - problem: "In $\\mathbf{Set}$, let $L$ be the list functor, $\\eta\\colon 1_{\\mathbf{Set}}\\Rightarrow L$ the singleton transformation $a\\mapsto[a]$, and $\\rho\\colon L\\Rightarrow L$ list reversal. Confirm the closure result in this instance: check elementwise that the vertical composite $\\rho\\cdot\\eta$ is natural, and identify it."
            answer: "$\\rho\\cdot\\eta=\\eta$: reversing a one-letter list changes nothing, and its square is the square of $\\eta$."
            solution_sketch: "The composite has components $(\\rho\\cdot\\eta)_X=\\rho_X\\circ\\eta_X\\colon X\\to X^*$, $x\\mapsto\\rho_X([x])=[x]$, since a one-letter list is its own reversal. So $\\rho\\cdot\\eta=\\eta$. Checking its square at $f\\colon X\\to Y$ elementwise: the left leg gives $L(f)([x])=[f(x)]$ and the right leg gives $(\\rho\\cdot\\eta)_Y(f(x))=[f(x)]$, so it commutes. This agrees with the general result: $\\eta$ and $\\rho$ are natural, so their vertical composite must be, and here the pasted square collapses back to the square of $\\eta$."
      - id: kp3
        name: Recognizing when a family is NOT natural
        key_prerequisites: [natural-transformations]
        constraints: "Refute naturality either by a variance mismatch (the two functors are not parallel) or by testing squares at element-selecting maps $1\\to A$; the dual-space/double-dual contrast is the canonical instance."
        exemplars:
          - problem: "Explain the precise sense in which $V\\cong V^*$ is 'unnatural' while the double-dual map $V\\to V^{**}$ is natural."
            answer: "$(-)^*$ is contravariant, so $1\\Rightarrow(-)^*$ is not even well-typed; $(-)^{**}$ is covariant and $v\\mapsto\\mathrm{ev}_v$ is natural."
            solution_sketch: "A natural transformation runs between two functors of the same variance. The dual $(-)^*$ is contravariant, not parallel to the identity endofunctor, so no natural transformation $1\\Rightarrow(-)^*$ can be formed — that is the exact sense in which a basis-dependent $V\\cong V^*$ is unnatural. By contrast $(-)^{**}$ is covariant, and $\\eta_V(v)=\\mathrm{ev}_v$ (with $\\mathrm{ev}_v(\\phi)=\\phi(v)$) satisfies $f^{**}\\circ\\eta_V=\\eta_W\\circ f$ (both send $v\\mapsto(\\phi\\mapsto\\phi(f(v)))$), so $\\eta\\colon 1\\Rightarrow(-)^{**}$ is natural."
          - problem: "Prove that the identity is the only natural transformation $1_{\\mathbf{Set}}\\Rightarrow 1_{\\mathbf{Set}}$; conclude that a family with some $\\alpha_A\\ne 1_A$ cannot be natural."
            answer: "Testing against element-selecting maps $1\\to A$ forces $\\alpha_A=1_A$."
            solution_sketch: "Let $1=\\{*\\}$ and for $a\\in A$ write $\\lceil a\\rceil\\colon 1\\to A$ for the map $*\\mapsto a$. Naturality at $\\lceil a\\rceil$ gives $\\alpha_A\\circ\\lceil a\\rceil=\\lceil a\\rceil\\circ\\alpha_1$. But $\\alpha_1\\colon 1\\to 1$ is the identity, so the right side is $\\lceil a\\rceil$, whence $\\alpha_A(a)=a$. Thus $\\alpha_A=1_A$ for every $A$. Any family with $\\alpha_A\\ne 1_A$ therefore violates the naturality square at some $\\lceil a\\rceil$ and is not natural."
    diagnostic_exemplar:
      problem: "Let $U\\colon\\mathbf{Grp}\\to\\mathbf{Set}$ be the forgetful functor. Prove that the inversion maps $i_G\\colon UG\\to UG$, $x\\mapsto x^{-1}$, form a natural transformation $i\\colon U\\Rightarrow U$."
      answer: "Fix a homomorphism $f\\colon G\\to H$; the square asks $Uf\\circ i_G=i_H\\circ Uf$. Chase $x\\in UG$: one leg gives $f(x^{-1})$, the other $f(x)^{-1}$. A group homomorphism preserves inverses ($f(x)f(x^{-1})=f(xx^{-1})=f(e)=e$ and symmetrically), so $f(x^{-1})=f(x)^{-1}$; the legs agree at every $x$, the square commutes for every $f$, and $i$ is natural. (Each $i_G$ is only a function, not a homomorphism — naturality asks no more.)"
      solution_sketch: "Chase $x\\in UG$ around the square: one leg gives $f(x^{-1})$, the other $f(x)^{-1}$. The crux is that a homomorphism preserves inverses; note the components need only be functions, since the square lives in $\\mathbf{Set}$."
    anki_seeds:
      - front: "Standard way to prove a componentwise composite of natural transformations is natural?"
        back: "Paste (stack) the two naturality squares and use associativity."
        type: basic
      - front: "Why is there no natural isomorphism $1\\Rightarrow(-)^*$ on $\\mathbf{Vect}$?"
        back: "$(-)^*$ is contravariant, so $1\\Rightarrow(-)^*$ is not even well-typed."
        type: basic
      - front: "Why is the double-dual map $V\\to V^{**}$ natural?"
        back: "$(-)^{**}$ is covariant and $v\\mapsto\\mathrm{ev}_v$ satisfies the naturality square."
        type: basic

  - id: natural-isomorphisms
    name: Natural Isomorphisms
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: natural-transformations
        weight: 0.5
        key: true
      - id: isomorphism-vs-equality
        weight: 0.4
        key: true
      - id: naturality-proofs
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Componentwise iso implies natural inverse
        key_prerequisites: [natural-transformations]
        constraints: "Abstract proofs manipulating the naturality square with componentwise inverses; each pre-/post-composition step must be written out."
        exemplars:
          - problem: "Define a natural isomorphism, then prove that if each component $\\alpha_A$ is an isomorphism the inverses $\\alpha_A^{-1}$ form a natural transformation $G\\Rightarrow F$."
            answer: "$\\alpha$ with every $\\alpha_A$ iso; the componentwise inverses are natural."
            solution_sketch: "$\\alpha\\colon F\\Rightarrow G$ is a natural isomorphism if each $\\alpha_A$ is an isomorphism. Put $\\beta_A=\\alpha_A^{-1}$. From $Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$, precompose with $\\alpha_A^{-1}$ and postcompose with $\\alpha_B^{-1}$: $\\alpha_B^{-1}\\circ Gf=Ff\\circ\\alpha_A^{-1}$, i.e. $Ff\\circ\\beta_A=\\beta_B\\circ Gf$. That is naturality of $\\beta\\colon G\\Rightarrow F$."
          - problem: "Prove that the vertical composite of two natural isomorphisms is again a natural isomorphism, so that $\\cong$ is transitive on functors."
            answer: "Componentwise: a composite of isos is iso, and a composite of naturals is natural."
            solution_sketch: "Let $\\alpha\\colon F\\xRightarrow{\\cong}G$ and $\\beta\\colon G\\xRightarrow{\\cong}H$ be natural isomorphisms. The vertical composite has components $(\\beta\\alpha)_A=\\beta_A\\circ\\alpha_A$, which is natural as a composite of natural transformations. Each $\\beta_A\\circ\\alpha_A$ is a composite of isomorphisms in $\\mathcal D$, hence an isomorphism with inverse $\\alpha_A^{-1}\\circ\\beta_A^{-1}$. Every component is iso, so $\\beta\\alpha$ is a natural isomorphism, giving transitivity of $F\\cong G$."
      - id: kp2
        name: Natural isomorphisms in practice
        key_prerequisites: [naturality-proofs]
        constraints: "Concrete $\\mathbf{Set}$ instances (swap maps, $\\mathrm{Hom}(1,-)\\cong 1_{\\mathbf{Set}}$); exhibit the inverse component and verify one naturality square elementwise."
        exemplars:
          - problem: "Let $A = \\{1, 2\\}$, $B = \\{3, 4\\}$, $A' = \\{5, 6\\}$ and $B' = \\{7, 8\\}$. Let $f: A \\to A'$ send $1 \\mapsto 5$ and $2 \\mapsto 6$, and let $g: B \\to B'$ send $3 \\mapsto 7$ and $4 \\mapsto 8$. The swap naturality square states $(g \\times f) \\circ s_{A,B} = s_{A',B'} \\circ (f \\times g)$, and both sides send a pair $(a,b)$ in $A \\times B$ to one pair in $B' \\times A'$. Give the answer as (x, y) for the pair that both sides give on input $(2, 3)$."
            answer: "(7,6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Write the full square: $(g \\times f) \\circ s_{A,B} = s_{A',B'} \\circ (f \\times g)$, both mapping $A \\times B \\to B' \\times A'$. Left side: $s_{A,B}(2,3) = (3,2)$, then $(g \\times f)(3,2) = (g(3), f(2)) = (7,6)$. Right side: $(f \\times g)(2,3) = (f(2), g(3)) = (6,7)$, then $s_{A',B'}(6,7) = (7,6)$. Both sides agree, so the square commutes elementwise. The answer is (7,6)."
          - problem: "In $\\mathbf{Set}$ let $1 = \\{*\\}$. Take $X = \\{1, 2, 3, 4\\}$ and $Y = \\{1, 2\\}$, and let $g: X \\to Y$ send $1 \\mapsto 2$, $2 \\mapsto 1$, $3 \\mapsto 2$, $4 \\mapsto 1$. Let $f: 1 \\to X$ be the map with $f(*) = 3$. The naturality square for $\\theta: \\mathrm{Hom}(1, -) \\Rightarrow \\mathrm{Id}$ compares $g \\circ \\theta_X$ with $\\theta_Y \\circ \\mathrm{Hom}(1, g)$. Compute the element of $Y$ that both sides give on input $f$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full square: $\\theta_Y \\circ \\mathrm{Hom}(1, g) = g \\circ \\theta_X$, where $\\mathrm{Hom}(1, g)$ postcomposes with $g$. Top side: $\\theta_X(f) = f(*) = 3$, then $g(3) = 2$. Bottom side: $\\mathrm{Hom}(1, g)(f) = g \\circ f$, then $\\theta_Y(g \\circ f) = (g \\circ f)(*) = g(3) = 2$. Both sides give the same element, so the square commutes on $f$. The answer is 2."
          - problem: "The swap $s_{A,B}: A \\times B \\to B \\times A$, $(a,b) \\mapsto (b,a)$, is a bijection, and its inverse component is $s_{B,A}: B \\times A \\to A \\times B$. Take $A = \\{1, 2\\}$ and $B = \\{3, 4\\}$. Give the answer as (x, y) for the value $s_{B,A}(4, 2)$."
            answer: "(2,4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Write the inverse component in full: $s_{B,A}: B \\times A \\to A \\times B$ acts by $s_{B,A}(b,a) = (a,b)$. Apply it by the definition of the swap: $s_{B,A}(4,2) = (2,4)$. Check by composing: $s_{A,B}(2,4) = (4,2)$, so $s_{B,A}$ undoes $s_{A,B}$ and is the inverse. The answer is (2,4)."
          - problem: "A student proposes a natural transformation from the identity functor on $\\mathbf{Set}$ to itself whose component $\\alpha_X: X \\to X$ swaps the two smallest elements of $X$ and fixes every other element. Take $X = \\{1, 2, 3\\}$ and let $g: X \\to X$ send $1 \\mapsto 2$, $2 \\mapsto 3$, $3 \\mapsto 1$. Give the smallest $x$ in $X$ for which $g(\\alpha_X(x))$ and $\\alpha_X(g(x))$ differ."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the component on $X = \\{1,2,3\\}$: $\\alpha(1) = 2$, $\\alpha(2) = 1$, $\\alpha(3) = 3$. Test the naturality square at $x = 1$: the left side gives $g(\\alpha(1)) = g(2) = 3$, the right side gives $\\alpha(g(1)) = \\alpha(2) = 1$. The values $3$ and $1$ differ, and $1$ is the smallest element of $X$, so no smaller failure exists. The answer is 1."
          - problem: "Claim: the maps $\\theta_X: \\mathrm{Hom}(1, X) \\to X$, $f \\mapsto f(*)$, form a natural isomorphism $\\mathrm{Hom}(1, -) \\Rightarrow \\mathrm{Id}$ on $\\mathbf{Set}$. Step 1: $\\theta_X$ is injective, since a map $1 \\to X$ is determined by the image of $*$. Step 2: $\\theta_X$ is surjective, since $x \\in X$ is the image of the map $* \\mapsto x$, so each $\\theta_X$ is a bijection. Step 3: naturality means $\\theta_Y \\circ \\mathrm{Hom}(1, g) = g \\circ \\theta_X$ for every $g: X \\to Y$. Step 4: $\\theta_Y(\\mathrm{Hom}(1, g)(f)) = \\theta_Y(g \\circ f) = f(*)$, which equals $g(\\theta_X(f))$, so the square commutes. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: a map from $1$ is fixed by the image of $*$. Step 2 is valid: $x \\mapsto (* \\mapsto x)$ is an inverse, so each component is a bijection. Step 3 states the correct naturality equation. Step 4 is not valid: $\\theta_Y(g \\circ f) = (g \\circ f)(*) = g(f(*))$, not $f(*)$; the claimed evaluation drops $g$, and the equality that follows is unjustified as written. The answer is Step 4."
          - problem: "A proof that the swap maps are natural works elementwise on a pair $(a, b)$ in $A \\times B$, using maps $f: A \\to A'$ and $g: B \\to B'$. The two sides of the square, $s_{A',B'} \\circ (f \\times g)$ and $(g \\times f) \\circ s_{A,B}$, send $(a, b)$ to the same pair in $B' \\times A'$. Select the pair that both sides give."
            answer: "(g(b), f(a))"
            answer_contract: {"kind": "label", "options": [["(g(b), f(a))"], ["(f(a), g(b))"], ["(g(a), f(b))"], ["(f(b), g(a))"]]}
            solution_sketch: "Compute the lower side: $s_{A,B}(a,b) = (b,a)$, then $(g \\times f)(b,a) = (g(b), f(a))$. Compute the upper side: $(f \\times g)(a,b) = (f(a), g(b))$, then $s_{A',B'}(f(a), g(b)) = (g(b), f(a))$. The option $(f(a), g(b))$ is the pair before the final swap is applied. The option $(g(a), f(b))$ feeds $a$ to $g$ and $b$ to $f$, confusing the two maps. The option $(f(b), g(a))$ swaps both the arguments and the roles of the maps. The answer is (g(b), f(a))."
          - problem: "Write the full proof: the swap maps $s_{A,B}(a,b) = (b,a)$ form a natural isomorphism between the bifunctors $(A,B) \\mapsto A \\times B$ and $(A,B) \\mapsto B \\times A$ on $\\mathbf{Set}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (components): for sets $A, B$ define $s_{A,B}: A \\times B \\to B \\times A$ by $s_{A,B}(a,b) = (b,a)$. Step 2 (inverse component): $s_{B,A} \\circ s_{A,B}(a,b) = s_{B,A}(b,a) = (a,b)$ and similarly $s_{A,B} \\circ s_{B,A} = \\mathrm{id}$, so each component is a bijection with inverse $s_{B,A}$. Step 3 (naturality, elementwise): for $f: A \\to A'$ and $g: B \\to B'$, evaluate the square on $(a,b)$. The lower side gives $(g \\times f)(s_{A,B}(a,b)) = (g \\times f)(b,a) = (g(b), f(a))$. The upper side gives $s_{A',B'}((f \\times g)(a,b)) = s_{A',B'}(f(a), g(b)) = (g(b), f(a))$. The two results agree, so the square commutes. Step 4 (conclusion): every component is an isomorphism and the family is natural in $(A,B)$, so $s$ is a natural isomorphism."
    diagnostic_exemplar:
      problem: "Let $\\alpha\\colon F\\Rightarrow G$ be a natural transformation in which every component $\\alpha_A$ is an isomorphism. Prove that the inverses $\\beta_A=\\alpha_A^{-1}$ form a natural transformation $\\beta\\colon G\\Rightarrow F$."
      answer: "For $f\\colon A\\to B$, start from naturality of $\\alpha$: $Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$. Pre-compose with $\\alpha_A^{-1}$ and post-compose with $\\alpha_B^{-1}$: $\\alpha_B^{-1}\\circ Gf=\\alpha_B^{-1}\\circ Gf\\circ\\alpha_A\\circ\\alpha_A^{-1}=\\alpha_B^{-1}\\circ\\alpha_B\\circ Ff\\circ\\alpha_A^{-1}=Ff\\circ\\alpha_A^{-1}$. That is $Ff\\circ\\beta_A=\\beta_B\\circ Gf$ — exactly naturality of $\\beta\\colon G\\Rightarrow F$."
      solution_sketch: "Conjugate the naturality square of $\\alpha$: pre-compose with $\\alpha_A^{-1}$ and post-compose with $\\alpha_B^{-1}$. The matched pairs cancel and what is left standing is precisely the naturality square for $\\beta$, with $F$ and $G$ exchanged."
    anki_seeds:
      - front: "A natural isomorphism is a natural transformation whose..."
        back: "every component is an isomorphism (equivalently, an iso in the functor category)."
        type: basic
      - front: "If $\\alpha$ is a natural iso, are the inverse components $\\alpha_A^{-1}$ natural?"
        back: "Yes — invert the naturality square."
        type: basic

  - id: whiskering
    name: Whiskering Natural Transformations
    core: true  # ancestor of core vertical-horizontal-composition (PEDAGOGY §1 invariant)
    difficulty: 0.72
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: natural-transformations
        weight: 0.5
        key: true
