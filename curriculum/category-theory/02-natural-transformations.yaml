            - 'A functor sends a composite of two arrows to the composite of their images'
            - 'Every functor sends an arrow $f$ to $f$ itself, so the composite is unchanged'
            - 'The arrows $Qf$ and $\alpha_A$ commute, so $K$ may be split over them'
          answer: 'A functor sends a composite of two arrows to the composite of their images'
          why: 'Preserving composition is part of the definition of a functor; it is what turns the square for $\alpha$ into the square for $K\alpha$.'
        exemplars:
          - problem: 'Let $\alpha\colon F\Rightarrow G$ be a natural transformation between functors $\mathbf{Set}\to\mathbf{Set}$. For $X=\{1,2,3\}$ with $FX=GX=X$, the component $\alpha_X$ has $\alpha_X(1)=2$, $\alpha_X(2)=3$ and $\alpha_X(3)=1$. Let $H\colon\mathbf{Set}\to\mathbf{Set}$ be the functor with $H(Y)=Y\times Y$ and $H(u)=u\times u$. Find $(H\alpha)_X(2,3)$.'
            answer: '(3,1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Left whiskering applies the outside functor to the component, so $(H\alpha)_X=H(\alpha_X)=\alpha_X\times\alpha_X$. This map acts on each coordinate separately. Hence $(H\alpha)_X(2,3)=(\alpha_X(2),\alpha_X(3))=(3,1)$.'
          - problem: 'In a program, the list functor $L$ sends a set of values $Y$ to the set of finite lists of elements of $Y$, and sends a function $u$ to the function that applies $u$ to every entry of a list. Let $\alpha\colon F\Rightarrow G$ be a natural transformation of functors $\mathbf{Set}\to\mathbf{Set}$ whose component at $X$ is the function $\alpha_X\colon\{a,b,c\}\to\{0,1,2\}$ with $\alpha_X(a)=2$, $\alpha_X(b)=0$, $\alpha_X(c)=2$. Find $(L\alpha)_X([a,c,b,a])$.'
            answer: '2, 2, 0, 2'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'The component of the left whiskering by $L$ is $L(\alpha_X)$, which applies $\alpha_X$ to every entry of the list. The entries $a,c,b,a$ go to $2,2,0,2$. So $(L\alpha)_X([a,c,b,a])=[2,2,0,2]$.'
          - problem: 'Four photos $1,2,3,4$ carry tags: photos $1$ and $2$ are tagged red, photos $3$ and $4$ are tagged blue. Let $\alpha_X$ be the function from the set of photos to $\{\text{red},\text{blue}\}$ that gives each photo its tag. Let $P$ be the powerset functor, which sends a function $u$ to the function $P(u)$ that takes each subset $S$ to its image $u(S)$, and let $(P\alpha)_X$ be the component of the left whiskering of $\alpha$ by $P$. For how many sets $S$ of photos is $(P\alpha)_X(S)=\{\text{red},\text{blue}\}$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The component is $(P\alpha)_X=P(\alpha_X)$, so it sends a set of photos to the set of its tags. The image is $\{\text{red},\text{blue}\}$ exactly when $S$ has a red photo and a blue photo. There are $3$ nonempty choices from $\{1,2\}$ and $3$ from $\{3,4\}$, so $3\times3=9$ sets.'
          - problem: 'Let $F(Y)=Y\times\{0,1\}$ and $H(Y)=Y\times Y$ be functors $\mathbf{Set}\to\mathbf{Set}$, let $G$ be a functor and let $\alpha\colon F\Rightarrow G$ be a natural transformation. The left whiskering $H\alpha$ has a component at each set. For $X=\{a,b,c\}$, how many elements does the source set of $(H\alpha)_X$ have?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left whiskering $H\alpha$ runs from $HF$ to $HG$, so the source of $(H\alpha)_X$ is $HF(X)$. Here $F(X)$ has $3\cdot2=6$ elements and $H$ squares the number of elements. So $HF(X)$ has $6^2=36$ elements.'
          - problem: 'Let $\mathcal{C}$ have objects $A,B$ and one non-identity arrow $f\colon A\to B$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ with $F(A)=\{0\}$, $F(B)=\{1\}$, $F(f)(0)=1$ and $G(A)=\{5\}$, $G(B)=\{7\}$, $G(f)(5)=7$. Let $\alpha\colon F\Rightarrow G$ have $\alpha_A(0)=5$ and $\alpha_B(1)=7$. Let $M\colon\mathbf{Set}\to\mathbf{Set}$ send a set $Y$ to $Y$ with one extra element $*$ added, and send a function $u$ to the function that agrees with $u$ on $Y$ and fixes $*$. Evaluate both sides of the naturality equation of $M\alpha$ at $f$ on the element $0$ of $MF(A)$. What is their common value?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The component is $(M\alpha)_A=M(\alpha_A)$, so $(M\alpha)_A(0)=5$ and then $MG(f)(5)=7$. On the other side $MF(f)(0)=1$ and $(M\alpha)_B(1)=7$. Both sides give $7$, as they must, because $M$ preserves the naturality square of $\alpha$.'
          - problem: 'Let $Q$ be the contravariant powerset functor: it sends a function $u\colon Y\to Z$ to $Q(u)\colon Q(Z)\to Q(Y)$, $T\mapsto u^{-1}(T)$. Let $\alpha\colon F\Rightarrow G$ be a natural transformation whose component at $X$ is $\alpha_X\colon\{1,2,3\}\to\{a,b\}$ with $\alpha_X(1)=\alpha_X(2)=a$ and $\alpha_X(3)=b$. Sam forms $Q(\alpha_X)$ and says it is a function from $Q(FX)$ to $Q(GX)$. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "Sam is right", "he is right", "right"], ["no", "Sam is wrong", "he is wrong", "wrong", "not right"]]}
            solution_sketch: 'The functor $Q$ reverses arrows, so $Q(\alpha_X)$ runs from $Q(GX)$ to $Q(FX)$. It sends a subset of $\{a,b\}$ to its preimage, a subset of $\{1,2,3\}$. Sam has the direction backwards, so the answer is no.'
          - problem: 'Let $Q$ be the contravariant powerset functor: it sends a function $u\colon Y\to Z$ to $Q(u)\colon Q(Z)\to Q(Y)$, $T\mapsto u^{-1}(T)$. A natural transformation $\alpha\colon F\Rightarrow G$ has component $\alpha_X\colon\{1,2,3\}\to\{a,b\}$ at $X$ with $\alpha_X(1)=\alpha_X(2)=a$ and $\alpha_X(3)=b$. How many elements does $Q(\alpha_X)(\{a\})$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $Q(\alpha_X)$ sends $\{a\}$ to its preimage $\alpha_X^{-1}(\{a\})=\{1,2\}$. This set has $2$ elements. So the answer is $2$.'
          - problem: 'Write the full proof that, for a natural transformation $\alpha\colon F\Rightarrow G$ between functors $F,G\colon\mathcal{C}\to\mathcal{D}$ and a functor $H\colon\mathcal{D}\to\mathcal{E}$, the whiskering $H\alpha\colon HF\Rightarrow HG$ with components $(H\alpha)_A=H(\alpha_A)$ is a natural transformation.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1, domain and codomain: for each object A of C, the component alpha_A is an arrow FA to GA in D, so applying H gives an arrow HFA to HGA in E; hence the family H alpha goes from the composite functor HF to the composite functor HG, and this typing is stated before naturality. Step 2, naturality: take any arrow f: A -> B in C. Naturality of alpha gives alpha_B composed with F(f) equals G(f) composed with alpha_A. Apply the functor H to this equation; since H respects composition of arrows, HG(f) composed with H(alpha_A) equals H(alpha_B) composed with HF(f). Step 3, conclusion: this is exactly the naturality equation for the components (H alpha)_A, so H alpha: HF => HG is a natural transformation.'
      - id: kp2
        name: Whiskering on the right by a functor
        key_prerequisites: [natural-transformations]
        constraints: "Right whiskering re-indexes components; never apply a functor to $\\alpha_A$ here."
        step_check:
          step: 'Since $Lf\colon LX\to LX''$ is a morphism in $\mathcal{A}$'
          question: 'Why can naturality of $\eta$ be applied at the arrow $Lf$ in this step?'
          options:
            - '$L$ is a functor, so it makes $\eta$ natural at the arrow $f$ of the category $\mathcal{X}$'
            - 'The arrow $f$ lies in $\mathcal{X}$, where $\eta$ has a naturality square at each arrow'
            - '$Lf$ is an arrow of $\mathcal{A}$, where $\eta$ has a naturality square at every arrow'
            - 'Naturality of $\eta$ is only needed at identity arrows, and $Lf$ is an identity arrow'
          answer: '$Lf$ is an arrow of $\mathcal{A}$, where $\eta$ has a naturality square at every arrow'
          why: 'The transformation $\eta$ is natural for the arrows of its own source category $\mathcal{A}$; the functor $L$ delivers the arrow $Lf$ into that category.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the discrete category with objects $c_1,c_2$, and let $F,G\colon\mathcal{C}\to\mathbf{Set}$ with $F(c_1)=\{0,1\}\times\{0,1\}$, $G(c_1)=\{0,1\}$, $F(c_2)=\{5,6,7\}\times\{5,6,7\}$, $G(c_2)=\{5,6,7\}$. Let $\alpha\colon F\Rightarrow G$ have components $\alpha_{c_1}(x,y)=x$ and $\alpha_{c_2}(x,y)=y$. Let $\mathcal{B}$ be the discrete category with objects $b,b''$, and let $K\colon\mathcal{B}\to\mathcal{C}$ send $b\mapsto c_1$ and $b''\mapsto c_2$. Find $(\alpha K)_{b''}(6,5)$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Right whiskering only re-indexes: $(\alpha K)_{b''}=\alpha_{K(b'')}$, and no functor is applied to the component. Since $K(b'')=c_2$, the component is $\alpha_{c_2}(x,y)=y$. So $(\alpha K)_{b''}(6,5)=5$.'
          - problem: 'Let $\mathcal{C}$ be the discrete category with objects $c_1,c_2$, and let $F,G,H\colon\mathcal{C}\to\mathbf{Set}$ each send both objects to $\{0,1,2,3\}$. Let $\alpha\colon F\Rightarrow G$ have $\alpha_{c_1}(x)=(x+1)\bmod 4$ and $\alpha_{c_2}(x)=(x+3)\bmod 4$, and let $\beta\colon G\Rightarrow H$ have $\beta_{c_1}(x)=(2x)\bmod 4$ and $\beta_{c_2}(x)=(3x)\bmod 4$. Let $\mathcal{B}$ be the one-object category with object $\bullet$, and let $K\colon\mathcal{B}\to\mathcal{C}$ send $\bullet\mapsto c_2$. Find $((\beta K)\cdot(\alpha K))_{\bullet}(2)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Right whiskering re-indexes, so $(\alpha K)_\bullet=\alpha_{c_2}$ and $(\beta K)_\bullet=\beta_{c_2}$. Vertical composition is componentwise, so the composite is $\beta_{c_2}\circ\alpha_{c_2}$. Then $\alpha_{c_2}(2)=5\bmod4=1$ and $\beta_{c_2}(1)=3$, so the value is $3$.'
          - problem: 'Let $\mathcal{B}$ be the category with objects $b,b''$ and one non-identity arrow $g\colon b\to b''$. Let $K\colon\mathcal{B}\to\mathbf{Set}$ with $K(b)=K(b'')=\{0,1,2\}$ and $K(g)=h$, where $h(0)=1$, $h(1)=2$, $h(2)=0$. Let $F(Y)=G(Y)=Y\times Y$ be functors $\mathbf{Set}\to\mathbf{Set}$, and let $\alpha\colon F\Rightarrow G$ have the swap components $\alpha_Y(x,y)=(y,x)$. Find $\big((GK)(g)\circ(\alpha K)_b\big)(2,1)$.'
            answer: '(2,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'By right whiskering, $(\alpha K)_b=\alpha_{K(b)}$ is the swap on $\{0,1,2\}\times\{0,1,2\}$, so it sends $(2,1)$ to $(1,2)$. By composition of functors, $(GK)(g)=G(h)=h\times h$. So the value is $(h(1),h(2))=(2,0)$.'
          - problem: 'Let $\mathcal{B}$ be the category with objects $b,b''$ and one non-identity arrow $g\colon b\to b''$. Let $K\colon\mathcal{B}\to\mathbf{Set}$ with $K(b)=\{0,1\}$, $K(b'')=\{0,1,2\}$, and $K(g)$ the inclusion $j$ with $j(0)=0$, $j(1)=1$. Let $F(Y)=Y$ and $G(Y)=Y\times Y$ be functors $\mathbf{Set}\to\mathbf{Set}$, and let $\alpha\colon F\Rightarrow G$ have the diagonal components $\alpha_Y(x)=(x,x)$. Find $\big((\alpha K)_{b''}\circ(FK)(g)\big)(1)$.'
            answer: '(1,1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $(FK)(g)=F(K(g))=F(j)=j$, so $j(1)=1$. By right whiskering, $(\alpha K)_{b''}=\alpha_{K(b'')}$ is the diagonal $x\mapsto(x,x)$ on $\{0,1,2\}$. So the value is $(1,1)$.'
          - problem: 'Let $\mathcal{C}$ be the discrete category with objects $c_1,c_2,c_3$, and let $F,G\colon\mathcal{C}\to\mathbf{Set}$ each send every object to $\{0,1,2,3,4\}$. Let $\alpha\colon F\Rightarrow G$ have $\alpha_{c_1}(x)=x$, $\alpha_{c_2}(x)=(x+1)\bmod5$, $\alpha_{c_3}(x)=(x+2)\bmod5$. Let $\mathcal{B}$ be the discrete category with objects $1,2,3$, and let $K\colon\mathcal{B}\to\mathcal{C}$ send $1\mapsto c_1$, $2\mapsto c_1$, $3\mapsto c_2$. Find $(\alpha K)_1(0)+(\alpha K)_2(0)+(\alpha K)_3(0)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Right whiskering re-indexes, so $(\alpha K)_n=\alpha_{K(n)}$. Since $K$ sends $1,2,3$ to $c_1,c_1,c_2$, the three values at $0$ are $\alpha_{c_1}(0)=0$, $\alpha_{c_1}(0)=0$ and $\alpha_{c_2}(0)=1$. Their sum is $1$.'
          - problem: 'A device shows a number from $0$ to $4$ on each weekday. The shift $\alpha$ adds $0$ on Monday, $1$ on Tuesday and $3$ on Wednesday, all modulo $5$. A second device runs three sessions $1,2,3$ that use the settings of Wednesday, Tuesday and Wednesday respectively. This is the right whiskering $\alpha K$ along the map $K$ from sessions to weekdays. Session $2$ starts at $4$. What number does it show after the shift?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The whiskered component at session $2$ is the component of $\alpha$ at $K(2)$, which is Tuesday. Tuesday adds $1$, and $4+1=5\equiv0\pmod5$. So session $2$ shows $0$.'
          - problem: 'Two days of the week, Monday and Tuesday, carry the transformation $\alpha$ with $\alpha_{\text{Mon}}(x)=2x \bmod 10$ and $\alpha_{\text{Tue}}(x)=3x\bmod 10$ on the numbers $0,\dots,9$. Three sessions $s_1,s_2,s_3$ use the settings of Tuesday, Monday and Tuesday, so $K(s_1)=\text{Tue}$, $K(s_2)=\text{Mon}$, $K(s_3)=\text{Tue}$. Session $s_1$ displays $6$ after applying the whiskered component $(\alpha K)_{s_1}$. Which number did it start with?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The whiskered component at $s_1$ is $\alpha_{K(s_1)}=\alpha_{\text{Tue}}$, which multiplies by $3$ modulo $10$. We need $3x\equiv6\pmod{10}$. Since $3\cdot7\equiv1$, multiply by $7$ to get $x\equiv42\equiv2$, and check $3\cdot2=6$.'
          - problem: 'A proof that the right whiskering $\alpha K\colon FK\Rightarrow GK$ is natural has four steps. Step 1: the goal at $g\colon b\to b''$ is $(GK)(g)\circ(\alpha K)_b=(\alpha K)_{b''}\circ(FK)(g)$. Step 2: by definition, $(\alpha K)_b=\alpha_{Kb}$ and $(\alpha K)_{b''}=\alpha_{Kb''}$. Step 3: since $K$ is a functor, we may write $(\alpha K)_b=K(\alpha_b)$. Step 4: substituting, the square commutes by functoriality of $K$. Sam reads the proof. Which step is the first that is not valid, and why?'
            answer: 'Step 3: whiskering applies no functor to a component, and alpha_b is not defined because b is an object of B, not of C.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Step 1 states the goal correctly and Step 2 is the definition of right whiskering. Step 3 is the first invalid step: whiskering applies no functor to a component, and $\alpha_b$ is not even defined because $b$ is an object of $\mathcal{B}$, not of $\mathcal{C}$. The correct proof uses naturality of $\alpha$ at the arrow $Kg$.'
          - problem: 'Write the full proof that, for functors $F,G\colon\mathcal{C}\to\mathcal{D}$ and $K\colon\mathcal{B}\to\mathcal{C}$ and a natural transformation $\alpha\colon F\Rightarrow G$, the right whiskering $\alpha K$ with components $(\alpha K)_b=\alpha_{Kb}$ is a natural transformation $FK\Rightarrow GK$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Definition step: for each object $b$ of $\mathcal{B}$ set $(\alpha K)_b=\alpha_{Kb}\colon (FK)(b)\to(GK)(b)$; right whiskering only re-indexes the component and applies no functor. Naturality step: take any arrow $g\colon b\to b''$ in $\mathcal{B}$. By the definition of composed functors, $(FK)(g)=F(Kg)$ and $(GK)(g)=G(Kg)$. Naturality of $\alpha$ at the arrow $Kg\colon Kb\to Kb''$ of $\mathcal{C}$ gives $G(Kg)\circ\alpha_{Kb}=\alpha_{Kb''}\circ F(Kg)$. Substitute the whiskered components: this equation reads $(GK)(g)\circ(\alpha K)_b=(\alpha K)_{b''}\circ(FK)(g)$, which is exactly the naturality square of $\alpha K$ at $g$. Since the square commutes for every arrow $g$, $\alpha K\colon FK\Rightarrow GK$ is a natural transformation.'
      - id: kp3
        name: Compatibility of the two whiskerings
        key_prerequisites: [functor-composition-identity]
        constraints: "Derive the compatibility of left and right whiskering by evaluating at an object: apply the outer functor to the component at the substituted object. Closed items may construct the categorical object or diagnose assertions whose validity the learner must determine; the unmarked item asks for a full proof. Candidate claims must not be endorsed or explained by the stem."
        step_check:
          step: 'By definition of right whiskering'
          question: 'Why is the component of $(Q\beta)P$ at $A$ the component of $Q\beta$ at the object $PA$?'
          options:
            - 'Right whiskering applies $P$ to the component, so the result is $P(Q\beta_A)$ itself'
            - 'The functor $Q$ is applied last, so the index $A$ is left unchanged by $P$'
            - 'The object $PA$ is used only because $P$ is always the identity on objects'
            - 'Right whiskering by $P$ re-indexes: the component at $A$ is the one at $PA$'
          answer: 'Right whiskering by $P$ re-indexes: the component at $A$ is the one at $PA$'
          why: 'A transformation by a functor $P$ on the right only changes which object indexes the component; no functor is applied to the component itself.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the discrete category with objects $c_1,c_2$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ send both objects to $\{0,1,2\}$, and let $\alpha\colon F\Rightarrow G$ have $\alpha_{c_1}(x)=x$ and $\alpha_{c_2}(x)=(x+1)\bmod3$. Let $\mathcal{B}$ be the one-object category with object $\bullet$, let $K\colon\mathcal{B}\to\mathcal{C}$ send $\bullet\mapsto c_2$, and let $H\colon\mathbf{Set}\to\mathbf{Set}$ send $Y$ to $Y\times Y$ and $u$ to $u\times u$. Find $\big(H(\alpha K)\big)_\bullet(0,2)$.'
            answer: '(1,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Right whiskering gives $(\alpha K)_\bullet=\alpha_{K(\bullet)}=\alpha_{c_2}$. Left whiskering then applies $H$, so $(H(\alpha K))_\bullet=H(\alpha_{c_2})=\alpha_{c_2}\times\alpha_{c_2}$. Hence the value at $(0,2)$ is $(1,0)$, and $(H\alpha)K$ gives the same.'
          - problem: 'Let $L$ be the list functor on $\mathbf{Set}$ and let $\eta\colon 1\Rightarrow L$ be the singleton transformation, $\eta_Y(y)=[y]$. Both $L\eta$ and $\eta L$ are transformations $L\Rightarrow L^2$. How many entries does the list of lists $(L\eta)_X([a,b,c,d])$ have?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left whiskering is $(L\eta)_X=L(\eta_X)$, which applies $\eta_X$ to every entry of the list. So $[a,b,c,d]$ becomes $[[a],[b],[c],[d]]$. This list of lists has $4$ entries.'
          - problem: 'Let $L$ be the list functor on $\mathbf{Set}$ and let $\eta\colon 1\Rightarrow L$ be the singleton transformation, $\eta_Y(y)=[y]$. Both $L\eta$ and $\eta L$ are transformations $L\Rightarrow L^2$. How many entries does the list of lists $(\eta L)_X([a,b,c,d])$ have?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The right whiskering is $(\eta L)_X=\eta_{LX}$, which wraps the whole list as one entry. So $[a,b,c,d]$ becomes $[[a,b,c,d]]$. This list of lists has $1$ entry.'
          - problem: 'Let $L$ be the list functor and $\eta\colon 1\Rightarrow L$ the singleton transformation, $\eta_Y(y)=[y]$. Are the transformations $L\eta$ and $\eta L$ from $L$ to $L^2$ equal?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "they are equal", "equal", "yes they are equal"], ["no", "they are not equal", "not equal", "different", "they differ"]]}
            solution_sketch: 'At the word $[a,b]$ the component $(L\eta)_X$ gives $[[a],[b]]$, while $(\eta L)_X$ gives $[[a,b]]$. These are different elements, so the two transformations differ. The answer is no.'
          - problem: 'In a program, `safeHead` takes a list to `Just` its first entry, or to `Nothing` if the list is empty. This is a natural transformation $\alpha\colon L\Rightarrow M$ from the list functor $L$ to the functor $M$ with $M(Y)=Y+\{\text{Nothing}\}$. Let $w=[[3,4],[\,],[5]]$ be a list of lists of numbers. The left whiskering $L\alpha$ applies `safeHead` to every entry of $w$. How many entries of the result are `Nothing`?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The left whiskering $L\alpha$ has component $L(\alpha_X)$, which applies $\alpha_X$ to each entry. The three entries become `Just 3`, `Nothing`, `Just 5`. Exactly $1$ entry is `Nothing`.'
          - problem: 'In a program, `safeHead` takes a list to `Just` its first entry, or to `Nothing` if the list is empty. This is a natural transformation $\alpha\colon L\Rightarrow M$ from the list functor $L$ to the functor $M$ with $M(Y)=Y+\{\text{Nothing}\}$. Let $w=[[3,4],[\,],[5]]$ be a list of lists of numbers. The right whiskering $\alpha L$ applies `safeHead` to $w$ itself, as a list of lists. The result is `Just` $v$ for a list $v$ of numbers. What is the sum of the entries of $v$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The right whiskering has component $(\alpha L)_X=\alpha_{LX}$, which takes the first entry of $w$ as one whole item. That entry is $[3,4]$, so $v=[3,4]$. The sum is $3+4=7$.'
          - problem: 'Let $\alpha\colon F\Rightarrow G$ be a natural transformation with $F,G\colon\mathcal{C}\to\mathcal{D}$, let $K\colon\mathcal{B}\to\mathcal{C}$ and let $H\colon\mathcal{D}\to\mathcal{E}$ be functors. Are the transformations $(H\alpha)K$ and $H(\alpha K)$ always equal?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they are equal", "equal", "always equal", "yes they are equal"], ["no", "they are not equal", "not equal", "not always equal", "they differ"]]}
            solution_sketch: 'At an object $B$ both components equal $H(\alpha_{KB})$. For $(H\alpha)K$ re-index first and then apply $H$, and for $H(\alpha K)$ do the two steps in the other order, but each gives the same arrow. Equal components at every object mean equal transformations, so the answer is yes.'
          - problem: 'Write the full proof that, for $K\colon\mathcal{B}\to\mathcal{C}$, a natural transformation $\alpha\colon F\Rightarrow G$ with $F,G\colon\mathcal{C}\to\mathcal{D}$, and $H\colon\mathcal{D}\to\mathcal{E}$, the transformations $(H\alpha)K$ and $H(\alpha K)$ are equal.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let X be any object of B; both transformations go from H F K to H G K. Left side: by the rule for right whiskering, ((H alpha) K)_X = (H alpha)_(KX), and by the rule for left whiskering, (H alpha)_(KX) = H(alpha_(KX)). Right side: by the rule for left whiskering, (H (alpha K))_X = H((alpha K)_X), and by the rule for right whiskering, (alpha K)_X = alpha_(KX), so this is also H(alpha_(KX)). The two components agree at every object X, and two natural transformations with the same source and target are equal exactly when all components agree. Therefore (H alpha) K = H (alpha K), which justifies writing H alpha K without ambiguity.'
    diagnostic_exemplar:
      problem: "Let $L$ be the list functor and $\\eta\\colon 1_{\\mathbf{Set}}\\Rightarrow L$ the singleton transformation $a\\mapsto[a]$; both $L\\eta$ and $\\eta L$ are transformations $L\\Rightarrow L^2$. Compute $(L\\eta)_X(w)$ and $(\\eta L)_X(w)$ for the word $w=[a,b,c]$, and decide whether $L\\eta=\\eta L$."
      answer: "Left whiskering applies $L$ to the component, so $(L\\eta)_X=L(\\eta_X)$ maps letterwise: $(L\\eta)_X([a,b,c])=[[a],[b],[c]]$. Right whiskering re-indexes, so $(\\eta L)_X=\\eta_{LX}$ wraps the whole word: $(\\eta L)_X([a,b,c])=[[a,b,c]]$. These are different elements of $L^2X$, so $L\\eta\\ne\\eta L$."
      solution_sketch: "The two whiskerings differ in where the singleton is taken: $L\\eta$ applies $\\eta$ inside the list, letterwise, while $\\eta L$ applies $\\eta$ to the whole list. Compute both at $[a,b,c]$ and compare the resulting elements of $L^2X$."
    anki_seeds:
      - front: "Left whiskering: component of $H\\alpha$ at $A$?"
        back: "$(H\\alpha)_A=H(\\alpha_A)$ — apply the functor to the component."
        type: basic
      - front: "Right whiskering: component of $\\alpha K$ at $B$?"
        back: "$(\\alpha K)_B=\\alpha_{KB}$ — re-index the component."
        type: basic
      - front: "Does whiskering preserve vertical composition?"
        back: "Yes: $H(\\beta\\cdot\\alpha)=(H\\beta)\\cdot(H\\alpha)$ and $(\\beta\\cdot\\alpha)K=(\\beta K)\\cdot(\\alpha K)$."
        type: basic

