        try_first:
          problem: 'The functor $S$ sends a set $Y$ to $Y\times Y$ and a function $u$ to $u\times u$. A function $u\colon\{0,1\}\to\{0,1,2\}$ has $u(0)=2$ and $u(1)=0$. Find the sum of the two entries of $S(u)(0,1)$.'
