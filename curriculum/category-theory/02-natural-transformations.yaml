        name: Vertical composition
        key_prerequisites: [naturality-proofs]
        constraints: "Require the learner to use vertical composition. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        step_check:
          step: 'Composing the first with $\beta_Y$ on the left and the second with $\alpha_X$ on the right'
          question: 'Why is the first square composed with $\beta_Y$ and the second with $\alpha_X$?'
          options:
            - 'Each square must be made longer before it can describe a natural transformation of $F$'
            - 'Composition with $\beta_Y$ and $\alpha_X$ turns all the arrows of the squares into identities'
            - 'Both squares then contain $\beta_Y\circ Gf\circ\alpha_X$, so they chain together'
            - 'The squares have no common arrow, so one square is moved into the place of the other'
          answer: 'Both squares then contain $\beta_Y\circ Gf\circ\alpha_X$, so they chain together'
          why: 'The first square gives $\beta_Y\circ Gf\circ\alpha_X=\beta_Y\circ\alpha_Y\circ Ff$ and the second gives $Hf\circ\beta_X\circ\alpha_X=\beta_Y\circ Gf\circ\alpha_X$. The common middle term links them, so $Hf\circ\beta_X\circ\alpha_X=\beta_Y\circ\alpha_Y\circ Ff$.'
        exemplars:
          - problem: 'Let $\mathcal{A}$ be the category with objects $a,b$ and one non-identity arrow $u\colon a\to b$. Let $F,G,H\colon\mathcal{A}\to\mathbf{Set}$ send both objects to $\{0,1,2\}$, with $F(u)$, $G(u)$, $H(u)$ the functions $0\mapsto1,1\mapsto2,2\mapsto0$; $0\mapsto2,1\mapsto0,2\mapsto1$; and $0\mapsto1,1\mapsto0,2\mapsto2$ respectively. Let $\alpha\colon F\Rightarrow G$ and $\beta\colon G\Rightarrow H$ be natural transformations with $\alpha_a$ given by $0\mapsto0,1\mapsto2,2\mapsto1$ and $\beta_a$ given by $0\mapsto2,1\mapsto1,2\mapsto0$. Find $(\beta\cdot\alpha)_b(1)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality at $u$ gives $\alpha_b\circ F(u)=G(u)\circ\alpha_a$ and $\beta_b\circ G(u)=H(u)\circ\beta_a$, and $F(u)$ and $G(u)$ are bijections, so $\alpha_b$ and $\beta_b$ are determined. Since $F(u)(0)=1$, we get $\alpha_b(1)=G(u)(\alpha_a(0))=G(u)(0)=2$. Since $G(u)(0)=2$, we get $\beta_b(2)=H(u)(\beta_a(0))=H(u)(2)=2$. So $(\beta\cdot\alpha)_b(1)=\beta_b(\alpha_b(1))=2$.'
          - problem: 'In a program, `reverse` turns a list around and `dropFirst` removes the first entry of a list (the empty list stays empty). Both are natural transformations from the list functor $L$ to itself. Let $\alpha=$ `reverse` and $\beta=$ `dropFirst`. Find the list $(\beta\cdot\alpha)_X([1,2,3,4,5])$.'
            answer: '4, 3, 2, 1'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'The vertical composite is $(\beta\cdot\alpha)_X=\beta_X\circ\alpha_X$, so reverse first and then drop the first entry. Reversing gives $[5,4,3,2,1]$ and dropping the first entry gives $[4,3,2,1]$.'
          - problem: 'A tick counter has a group of ticks acting on three sets. Clock $X$ has $6$ positions $0,\dots,5$ and each tick moves it on by $1$ (modulo $6$). Clock $Y$ has $3$ positions and each tick moves it on by $1$ (modulo $3$). Clock $Z$ has $3$ positions and each tick moves it on by $2$ (modulo $3$). The map $\alpha\colon X\to Y$ reads the position modulo $3$, and $\beta\colon Y\to Z$ doubles the position modulo $3$. These maps commute with ticking, so they are natural transformations of the three functors from the one-object category of ticks to $\mathbf{Set}$. Find $(\beta\cdot\alpha)(5)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Vertical composition of natural transformations is composition of the components, here $\beta\circ\alpha$. First $\alpha(5)=5\bmod3=2$. Then $\beta(2)=2\cdot2\bmod3=1$, so $(\beta\cdot\alpha)(5)=1$.'
          - problem: 'Let $\mathrm{Id}$ be the identity functor on $\mathbf{Set}$ and $S(Y)=Y\times Y$ with $S(u)=u\times u$. Let $\alpha\colon\mathrm{Id}\Rightarrow S$ have $\alpha_Y(y)=(y,y)$ and let $\beta\colon S\Rightarrow\mathrm{Id}$ have $\beta_Y(y,z)=z$. Is the vertical composite $\beta\cdot\alpha$ the identity transformation of $\mathrm{Id}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is the identity", "it is", "identity"], ["no", "it is not the identity", "it is not", "not the identity", "not identity"]]}
            solution_sketch: 'The component of the composite is $\beta_Y(\alpha_Y(y))=\beta_Y(y,y)=y$ for every set $Y$ and every element $y$. So each component is the identity function of $Y$, and the composite is the identity transformation. The answer is yes.'
          - problem: 'For natural transformations $\alpha\colon F\Rightarrow G$ and $\beta\colon G\Rightarrow H$ Sam writes the vertical composite as $(\beta\cdot\alpha)_A=\alpha_A\circ\beta_A$. Suppose that the components are the functions $\alpha_A(x)=x+1$ and $\beta_A(x)=2x$ on $\mathbb Z$. What is the correct value of $(\beta\cdot\alpha)_A(3)$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The vertical composite applies $\alpha_A$ first and then $\beta_A$, so $(\beta\cdot\alpha)_A=\beta_A\circ\alpha_A$. Then $\alpha_A(3)=4$ and $\beta_A(4)=8$. Sam''s order gives $\alpha_A(\beta_A(3))=7$.'
          - problem: 'Let $\mathcal{A}$ be the category with objects $a,b$ and one non-identity arrow $u\colon a\to b$. Let $F,G,H\colon\mathcal{A}\to\mathbf{Set}$ with $F(a)=G(a)=H(a)=\{0,1,2\}$, $F(b)=\{0,1\}$ and $G(b)=H(b)=\{0,1,2\}$. The arrows go to $F(u)\colon 0\mapsto0,1\mapsto1,2\mapsto1$; $G(u)\colon 0\mapsto1,1\mapsto2,2\mapsto0$; $H(u)\colon 0\mapsto2,1\mapsto1,2\mapsto0$. Let $\alpha\colon F\Rightarrow G$ and $\beta\colon G\Rightarrow H$ be natural transformations with $\alpha_a\colon 0\mapsto0,1\mapsto2,2\mapsto2$ and $\beta_a\colon 0\mapsto2,1\mapsto1,2\mapsto1$. Find $(\beta\cdot\alpha)_b(0)$.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality at $u$ gives $\alpha_b(F(u)(x))=G(u)(\alpha_a(x))$, so $\alpha_b(0)=G(u)(\alpha_a(0))=G(u)(0)=1$. Likewise $\beta_b(G(u)(y))=H(u)(\beta_a(y))$, and taking $y=0$ gives $\beta_b(1)=H(u)(2)=0$. So $(\beta\cdot\alpha)_b(0)=\beta_b(1)=0$.'
          - problem: 'Write the full proof that, for natural transformations $\alpha\colon F\Rightarrow G$ and $\beta\colon G\Rightarrow H$ between functors from $\mathcal{C}$ to $\mathcal{D}$, the family with components $(\beta\cdot\alpha)_A=\beta_A\circ\alpha_A$ is a natural transformation from $F$ to $H$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (types): α_A: FA → GA and β_A: GA → HA, and the middle functor G matches on both sides, so the composite β_A ∘ α_A: FA → HA is defined in D. Step 2 (naturality): for each arrow f: A → B in C, the naturality square for α at f gives Gf ∘ α_A = α_B ∘ Ff, and the square for β at f gives Hf ∘ β_A = β_B ∘ Gf. Step 3 (stack the squares): Hf ∘ (β_A ∘ α_A) = (β_B ∘ Gf) ∘ α_A = β_B ∘ (Gf ∘ α_A) = β_B ∘ (α_B ∘ Ff) = (β_B ∘ α_B) ∘ Ff, using only associativity and units in D. Step 4 (conclusion): the naturality square for β·α commutes at every arrow, verified componentwise in the target category D, so β·α: F ⇒ H is a natural transformation. This completes the proof.'
      - id: kp2
        name: Horizontal composition
        key_prerequisites: [whiskering]
        constraints: "Require the learner to use horizontal composition. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        step_check:
          step: 'the naturality square of $\beta$ at the morphism $\alpha_A\colon SA\to TA$'
          question: 'Why can the naturality square of $\beta$ be taken at the arrow $\alpha_A$?'
          options:
            - '$\alpha_A$ is an arrow of $\mathcal{E}$, and $\beta$ is natural at such arrows'
            - '$\alpha_A$ is an arrow of $\mathcal{D}$, where $\beta$ is natural'
            - '$\beta$ is natural at every arrow of $\mathcal{C}$, and $\alpha_A$ is one'
            - '$\alpha$ is natural, so its components are arrows where $\beta$ is natural'
          answer: '$\alpha_A$ is an arrow of $\mathcal{D}$, where $\beta$ is natural'
          why: 'Naturality of $\beta\colon U\Rightarrow V$ is a square for each arrow of $\mathcal{D}$, and the component $\alpha_A$ is such an arrow.'
        exemplars:
          - problem: 'Let $S$ be the functor $\mathbf{Set}\to\mathbf{Set}$ with $S(Y)=Y\times Y$ and $S(u)=u\times u$, and let $\mathrm{Id}$ be the identity functor. Let $\alpha\colon\mathrm{Id}\Rightarrow S$ be the diagonal, $\alpha_Y(y)=(y,y)$, and let $\beta\colon S\Rightarrow\mathrm{Id}$ be the first projection, $\beta_Y(y,z)=y$. Find the component of the horizontal composite $\beta*\alpha\colon S\Rightarrow S$ at $X=\{3,5\}$ on the element $(3,5)$.'
            answer: '(3,3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The component is $(\beta*\alpha)_X=\alpha_X\circ\beta_{X}$ with the outer $\mathrm{Id}$ acting as itself, so first $\beta$ takes $(3,5)$ to $3$. Then $\alpha_X$ sends $3$ to $(3,3)$. The other formula $\beta_{SX}\circ S(\alpha_X)$ gives $(3,3)$ as well.'
          - problem: 'Let $S(Y)=Y\times Y$ with $S(u)=u\times u$. Let $\alpha\colon S\Rightarrow\mathrm{Id}$ be the first projection, $\alpha_Y(y,z)=y$, and let $\beta\colon S\Rightarrow S$ be the swap, $\beta_Y(y,z)=(z,y)$. The horizontal composite $\beta*\alpha$ goes from $S\circ S$ to $S\circ\mathrm{Id}=S$. Find its component at a set $X$ on the element $((1,2),(3,4))$ of $S(S(X))$.'
            answer: '(3,1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Use $(\beta*\alpha)_X=S(\alpha_X)\circ\beta_{S X}$. The swap $\beta_{SX}$ takes $((1,2),(3,4))$ to $((3,4),(1,2))$. Then $S(\alpha_X)$ takes the first entry of each pair, giving $(3,1)$.'
          - problem: 'A program stores records as a list of lists. It applies two steps: `safeHead` takes a list to `Just` its first entry, or to `Nothing` for an empty list, and `reverse` turns a list around. These are natural transformations $\alpha\colon L\Rightarrow M$ and $\beta\colon L\Rightarrow L$, where $M(Y)=Y+\{\text{Nothing}\}$. The horizontal composite $\beta*\alpha\colon L\circ L\Rightarrow L\circ M$ reverses the list of records and applies `safeHead` to every record. For the input $[[1,2],[\,],[3],[4]]$, in which position (counting from $1$) of the result list is `Nothing`?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Reversing the list of records gives $[[4],[3],[\,],[1,2]]$. Applying `safeHead` to each record gives `Just 4`, `Just 3`, `Nothing`, `Just 1`. So `Nothing` is in position $3$. Applying `safeHead` first and reversing afterwards gives the same list.'
          - problem: 'Let $S(Y)=Y\times Y$ with $S(u)=u\times u$. Let $\alpha\colon S\Rightarrow S$ be the swap, $\alpha_Y(y,z)=(z,y)$, and let $\beta\colon S\Rightarrow\mathrm{Id}$ be the first projection, $\beta_Y(y,z)=y$. The horizontal composite $\beta*\alpha$ goes from $S\circ S$ to $\mathrm{Id}\circ S=S$. Find its component at a set $X$ on the element $((1,2),(3,4))$.'
            answer: '(2,1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Use $(\beta*\alpha)_X=\alpha_X\circ\beta_{SX}$, because $\mathrm{Id}$ acts as itself. The projection $\beta_{SX}$ takes $((1,2),(3,4))$ to $(1,2)$, and the swap $\alpha_X$ takes $(1,2)$ to $(2,1)$. The other formula $\beta_{SX}\circ S(\alpha_X)$ also gives $(2,1)$.'
          - problem: 'Sam believes that the two routes $G''(\alpha_A)\circ\beta_{FA}$ and $\beta_{F''A}\circ G(\alpha_A)$ for the component of $\beta*\alpha$ can give different values. Test this with $S(Y)=Y\times Y$, $F=G=S$ and $F''=G''=\mathrm{Id}$, where $\alpha\colon S\Rightarrow\mathrm{Id}$ is the first projection and $\beta\colon S\Rightarrow\mathrm{Id}$ is the second projection. On the element $((1,2),(3,4))$ of $S(S(X))$, do the two routes give the same value?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "they agree", "the same", "same value", "yes they agree"], ["no", "they differ", "different", "not the same", "they are different"]]}
            solution_sketch: 'The first route is $\alpha_X(\beta_{SX}(w))$: the second projection takes $((1,2),(3,4))$ to $(3,4)$ and the first projection takes that to $3$. The second route is $\beta_X(S(\alpha_X)(w))=\beta_X((1,3))=3$. Both routes give $3$, as the naturality square of $\beta$ at $\alpha_X$ predicts, so the answer is yes.'
          - problem: 'Let $F(Y)=Y$ and $F''(Y)=Y\times Y\times Y$, and let $\alpha\colon F\Rightarrow F''$ be the diagonal. Let $G(Y)=Y\times Y$ and $G''(Y)=Y\times\{0,1\}$, and let $\beta\colon G\Rightarrow G''$ send $(y,z)$ to $(y,0)$. For $X=\{a,b,c\}$, how many elements does the target set of the component $(\beta*\alpha)_X$ have?'
            answer: '54'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The horizontal composite runs from $GF$ to $G''F''$, so the target of the component is $G''(F''(X))=F''(X)\times\{0,1\}$. Here $F''(X)=X^3$ has $27$ elements. So the target has $27\cdot2=54$ elements.'
          - problem: 'A scoreboard stores two matches, each match as a pair (home goals, away goals), so a board is an element of $S(S(X))$ with $S(Y)=Y\times Y$. The transformation $\beta$ swaps the two entries of a pair, and $\alpha$ takes the away goals out of a pair (the second projection $S\Rightarrow\mathrm{Id}$). The horizontal composite $\beta*\alpha$ swaps the order of the two matches and then keeps only the away goals of each. What does it return for the board $((2,5),(4,1))$?'
            answer: '(1,5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Use the route $S(\alpha_X)\circ\beta_{SX}$. Swapping the two matches gives $((4,1),(2,5))$. Taking the away goals of each match then gives $(1,5)$.'
          - problem: 'Let $\alpha\colon F\Rightarrow F''$ be a natural transformation of functors from $\mathcal{C}$ to $\mathcal{D}$ and $\beta\colon G\Rightarrow G''$ one of functors from $\mathcal{D}$ to $\mathcal{E}$. For an object $A$ of $\mathcal{C}$ the component of $\beta*\alpha$ is $G''(\alpha_A)\circ\beta_{FA}$ by one formula and $\beta_{F''A}\circ G(\alpha_A)$ by another. Which fact shows that the two formulas give the same arrow?'
            answer: 'naturality of β at α_A'
            answer_contract: {"kind": "label", "options": [["naturality of β at α_A", "β at α_A", "beta at alpha_A", "naturality of beta at alpha_A"], ["naturality of α at β_A", "α at β_A", "alpha at beta_A", "naturality of alpha at beta_A"], ["naturality of β at identities", "β at identities", "beta at identities", "naturality of beta at identities"], ["functoriality of G", "G is a functor", "functor G"]]}
            solution_sketch: 'The two formulas are the two legs of one square. It is the naturality square of $\beta$ at the arrow $\alpha_A\colon FA\to F''A$ of $\mathcal{D}$, and it states $G''(\alpha_A)\circ\beta_{FA}=\beta_{F''A}\circ G(\alpha_A)$. Naturality of $\alpha$ and functoriality of $G$ do not give this equation.'
          - problem: 'Write the full proof that, for $\alpha\colon F\Rightarrow F''$ from $\mathcal{C}$ to $\mathcal{D}$ and $\beta\colon G\Rightarrow G''$ from $\mathcal{D}$ to $\mathcal{E}$, the two formulas for the component of the horizontal composite $\beta*\alpha\colon GF\Rightarrow G''F''$ agree at every object, and the composite is a natural transformation.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (fix an object): for each object $A$ of $\mathcal{C}$, the component $\alpha_A\colon FA \to F''A$ is a morphism of $\mathcal{D}$. Step 2 (first formula): whisker $\beta$ with $F$ to get $\beta F\colon GF \Rightarrow G''F$ with component $\beta_{FA}$, and whisker $\alpha$ with $G''$ to get $G''\alpha\colon G''F \Rightarrow G''F''$ with component $G''(\alpha_A)$; the vertical composite $(G''\alpha)\cdot(\beta F)$ has component $G''(\alpha_A)\circ\beta_{FA}$. Step 3 (second formula): whisker $\alpha$ with $G$ to get $G\alpha\colon GF \Rightarrow GF''$ with component $G(\alpha_A)$, and whisker $\beta$ with $F''$ to get $\beta F''\colon GF'' \Rightarrow G''F''$ with component $\beta_{F''A}$; the vertical composite $(\beta F'')\cdot(G\alpha)$ has component $\beta_{F''A}\circ G(\alpha_A)$. Step 4 (the square that identifies them): the naturality square of $\beta$ at the morphism $\alpha_A$ of $\mathcal{D}$ states exactly $G''(\alpha_A)\circ\beta_{FA} = \beta_{F''A}\circ G(\alpha_A)$, so the two formulas give one family. Step 5 (naturality): whiskerings of natural transformations are natural, and a vertical composite of natural transformations is natural, so this family is natural in $A$ and defines $\beta*\alpha\colon GF \Rightarrow G''F''$. Answer: the two formulas agree at every object $A$, and $\beta*\alpha$ is the natural transformation with that common component.'
      - id: kp3
        name: The interchange law
        key_prerequisites: [naturality-proofs]
        constraints: "Require the learner to use the interchange law. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        step_check:
          step: 'This is exactly the naturality square of $\tau\colon T\Rightarrow T''$'
          question: 'Why is it the naturality of $\tau$, and not of $\tau''$, that equates the two expansions?'
          options:
            - 'The factors $\tau''_{S''''X}$ already agree, so the square of $\tau''$ would change nothing'
            - 'Naturality of $\tau''$ is always the square used in an interchange law'
            - 'The factor $\tau_{S''X}$ is the only factor that appears on both sides'
            - 'The factors that differ are $\tau_{S''''X}$ and $T''(\sigma''_X)$, both from $\tau$'
          answer: 'The factors that differ are $\tau_{S''''X}$ and $T''(\sigma''_X)$, both from $\tau$'
          why: 'Both expansions share the factors $\tau''_{S''''X}$ and $T(\sigma_X)$; only the middle pair differs, and exchanging it is the square of $\tau$ at $\sigma''_X$.'
        exemplars:
          - problem: 'Use the one-object category $\mathbf{1}$: a functor from $\mathbf{1}$ to $\mathbf{Set}$ is a set, and a natural transformation is a function. Let $F=F''=F''''$ be the set $\{0,1,2\}$, let $\alpha\colon F\to F''$ be the function $0\mapsto1,1\mapsto2,2\mapsto0$, and let $\alpha''\colon F''\to F''''$ be the function $0\mapsto0,1\mapsto2,2\mapsto1$. On $\mathbf{Set}$ let $G=G''=G''''=S$ with $S(Y)=Y\times Y$, let $\beta\colon G\Rightarrow G''$ be the identity transformation and let $\beta''\colon G''\Rightarrow G''''$ be the swap. Find the value of $(\beta''\cdot\beta)*(\alpha''\cdot\alpha)$ at the element $(1,2)$.'
            answer: '(0,1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'By the interchange law the two sides agree, so compute the left side. Here $\alpha''\cdot\alpha$ sends $1\mapsto2\mapsto1$ and $2\mapsto0\mapsto0$, and $\beta''\cdot\beta$ is the swap. So the value is the swap of $(1,0)$, which is $(0,1)$.'
          - problem: 'Use the one-object category $\mathbf{1}$, so that functors $\mathbf{1}\to\mathbf{Set}$ are sets and natural transformations are functions. Let $F$, $F''$, $F''''$ be the sets $\{0,1\}$, $\{2,3\}$, $\{6,7\}$, let $\alpha$ be the function with $\alpha(0)=2$, $\alpha(1)=3$ and $\alpha''$ the function with $\alpha''(2)=7$, $\alpha''(3)=6$. On $\mathbf{Set}$ let $G$ and $G''''$ send $Y$ to $Y\times Y$ and let $G''$ be the identity functor. Let $\beta_Y(y,z)=y$ be the first projection $G\Rightarrow G''$ and let $\beta''_Y(y)=(y,y)$ be the diagonal $G''\Rightarrow G''''$. Both sides of the interchange law $(\beta''\cdot\beta)*(\alpha''\cdot\alpha)=(\beta''*\alpha'')\cdot(\beta*\alpha)$ are functions from $\{0,1\}\times\{0,1\}$ to $\{6,7\}\times\{6,7\}$. What is their common value at $(0,1)$?'
            answer: '(7,7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Right side: $(\beta*\alpha)(0,1)=\alpha(0)=2$, then $(\beta''*\alpha'')(2)=(\alpha''(2),\alpha''(2))=(7,7)$. Left side: $(\alpha''\cdot\alpha)$ sends $0\mapsto7$ and $1\mapsto6$, so $G(\alpha''\cdot\alpha)(0,1)=(7,6)$, and $\beta''\cdot\beta$ sends $(u,v)$ to $(u,u)$, giving $(7,7)$. The two sides agree.'
          - problem: 'The interchange law $(\beta''\cdot\beta)*(\alpha''\cdot\alpha)=(\beta''*\alpha'')\cdot(\beta*\alpha)$ holds for $\alpha\colon F\Rightarrow F''$, $\alpha''\colon F''\Rightarrow F''''$, $\beta\colon G\Rightarrow G''$ and $\beta''\colon G''\Rightarrow G''''$. Expand both sides at an object $A$. The left side has the middle factors $\beta_{F''''A}\circ G(\alpha''_A)$ and the right side has the middle factors $G''(\alpha''_A)\circ\beta_{F''A}$, and the two sides agree after exchanging them. Which naturality square justifies the exchange?'
            answer: 'naturality of β at α''_A'
            answer_contract: {"kind": "label", "options": [["naturality of β at α'_A", "β at α'_A", "beta at alpha'_A", "naturality of beta at alpha'_A"], ["naturality of β at α_A", "β at α_A", "beta at alpha_A", "naturality of beta at alpha_A"], ["naturality of β' at α'_A", "β' at α'_A", "beta' at alpha'_A", "naturality of beta' at alpha'_A"], ["naturality of α' at α_A", "α' at α_A", "alpha' at alpha_A", "naturality of alpha' at alpha_A"]]}
            solution_sketch: 'The factors to exchange are $\beta_{F''''A}\circ G(\alpha''_A)$ and $G''(\alpha''_A)\circ\beta_{F''A}$. These are the two sides of the naturality square of $\beta\colon G\Rightarrow G''$ at the arrow $\alpha''_A\colon F''A\to F''''A$ of $\mathcal{D}$. The other options use the wrong transformation or the wrong arrow.'
          - problem: 'Sam argues for the interchange law $(\beta''\cdot\beta)*(\alpha''\cdot\alpha)=(\beta''*\alpha'')\cdot(\beta*\alpha)$ as follows. Step 1: at an object $A$, the left side is $(\beta''\cdot\beta)_{F''A}\circ G(\alpha''_A\circ\alpha_A)$. Step 2: at $A$, the right side is $\beta''_{F''A}\circ G''(\alpha''_A)\circ\beta_{F''A}\circ G(\alpha_A)$. Step 3: by naturality of $\beta$ at the arrow $\alpha_A$, the factor $\beta_{F''A}$ can be moved past $G(\alpha''_A)$, so the two sides agree. Step 4: since the components agree at every object, the two transformations are equal. Which step is the first that is not valid, and why?'
            answer: 'Step 3: naturality of beta at alpha_A does not exchange the factors in question; the square needed is the one at alpha-prime_A.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Step 1 whiskers the vertical composite, using that $G$ preserves composition, and Step 2 expands the right side by the whisker formula. Step 3 is the first invalid step: naturality of $\beta$ at $\alpha_A$ says $\beta_{F''A}\circ G(\alpha_A)=G''(\alpha_A)\circ\beta_{FA}$, which does not exchange the factors in question. The square needed is the one at $\alpha''_A$.'
          - problem: 'A warehouse relabels items twice. Stage one relabels item $x$ as $(x+1)\bmod5$ and stage two relabels the result $y$ as $2y\bmod5$. Items are shipped in pairs, and a packing machine either keeps a pair $(x,y)$ in order or swaps it to $(y,x)$. Pairs are first swapped, then the pair is relabeled by both stages, then it is swapped again. Using the interchange law with $G=G''=G''''$ the pairing functor and $\beta=\beta''$ the swap, find the final pair for the starting pair $(3,4)$.'
            answer: '(3,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Two swaps cancel, since $\beta''\cdot\beta$ is the identity, so the left side is just the relabeling of each entry by $\alpha''\cdot\alpha$. Item $3$ goes to $4$ and then $8\bmod5=3$. Item $4$ goes to $0$ and then $0$, so the pair is $(3,0)$.'
          - problem: 'Six records labeled $0,\dots,5$ are relabeled twice. Stage one sends record $x$ to $x\bmod3$ and stage two sends the result $y$ to $y\bmod2$. Records are handled in pairs. By the interchange law with the identity transformations $\beta=\beta''$ on the pairing functor, a pair $(x,y)$ ends with the label pair $(\alpha''\alpha(x),\alpha''\alpha(y))$. For how many starting pairs $(x,y)$ of records is the final label pair $(0,0)$?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A record ends with label $0$ when $x\bmod3$ is even. That happens for $x=0,2,3,5$, which is $4$ records. A pair needs both entries from these $4$ records, so there are $4\times4=16$ starting pairs.'
          - problem: 'Use the one-object category $\mathbf{1}$, so that functors $\mathbf{1}\to\mathbf{Set}$ are sets and natural transformations are functions. Let $F$, $F''$, $F''''$ be the set $\{0,1,2\}$, let $\alpha(x)=x+1 \bmod 3$ and $\alpha''(x)=2x \bmod 3$. On $\mathbf{Set}$ let $G$ and $G''''$ send $Y$ to $Y\times Y$ and let $G''$ be the identity functor. Let $\beta_Y(y,z)=z$ be the second projection $G\Rightarrow G''$ and let $\beta''_Y(y)=(y,y)$ be the diagonal $G''\Rightarrow G''''$. Find the value of $(\beta''\cdot\beta)*(\alpha''\cdot\alpha)$ at the element $(1,2)$ of $G(F)$.'
            answer: '(0,0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The map $\alpha''\cdot\alpha$ sends $1\mapsto2\mapsto1$ and $2\mapsto0\mapsto0$, so $G(\alpha''\cdot\alpha)(1,2)=(1,0)$. Then $\beta''\cdot\beta$ sends $(u,v)$ to $(v,v)$, which gives $(0,0)$. The right side of the interchange law gives the same pair.'
          - problem: 'Write the full proof that, for natural transformations $\alpha\colon F\Rightarrow F''$ and $\alpha''\colon F''\Rightarrow F''''$ between functors $\mathcal{C}\to\mathcal{D}$ and $\beta\colon G\Rightarrow G''$ and $\beta''\colon G''\Rightarrow G''''$ between functors $\mathcal{D}\to\mathcal{E}$, the interchange law $(\beta''\cdot\beta)*(\alpha''\cdot\alpha)=(\beta''*\alpha'')\cdot(\beta*\alpha)$ holds, by expanding both sides at an object $A$ and reducing the equality to one naturality square.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (whisker formula): (β*α)_A = β_{F''A} ∘ G(α_A) and (β''*α'')_A = β''_{F''''A} ∘ G''(α''_A). Step 2 (expand the left side): ((β''·β)*(α''·α))_A = (β''·β)_{F''''A} ∘ G(α''_A ∘ α_A) = β''_{F''''A} ∘ β_{F''''A} ∘ G(α''_A) ∘ G(α_A), using functoriality of G and the vertical composite formula. Step 3 (expand the right side): ((β''*α'')·(β*α))_A = β''_{F''''A} ∘ G''(α''_A) ∘ β_{F''A} ∘ G(α_A). Step 4 (the single naturality square): the middle factors differ only in the order of β_{F''''A} ∘ G(α''_A) versus G''(α''_A) ∘ β_{F''A}; naturality of β : G ⇒ G'', applied at the one morphism α''_A : F''A → F''''A of D, gives β_{F''''A} ∘ G(α''_A) = G''(α''_A) ∘ β_{F''A}. Step 5 (conclusion): substituting this square shows both sides equal β''_{F''''A} ∘ G''(α''_A) ∘ β_{F''A} ∘ G(α_A) at every object A, so the two natural transformations GF ⇒ G''''F'''' are equal. This is the interchange law.'
    diagnostic_exemplar:
      problem: "For $\\alpha\\colon F\\Rightarrow F'$ ($\\mathcal{C}\\to\\mathcal{D}$) and $\\beta\\colon G\\Rightarrow G'$ ($\\mathcal{D}\\to\\mathcal{E}$), the horizontal composite $\\beta*\\alpha\\colon GF\\Rightarrow G'F'$ has component at $A$ given by either $G'(\\alpha_A)\\circ\\beta_{FA}$ or $\\beta_{F'A}\\circ G(\\alpha_A)$. Prove the two formulas agree."
      answer: "Apply the naturality of $\\beta\\colon G\\Rightarrow G'$ at the morphism $\\alpha_A\\colon FA\\to F'A$ of $\\mathcal{D}$: the naturality square reads $G'(\\alpha_A)\\circ\\beta_{FA}=\\beta_{F'A}\\circ G(\\alpha_A)$, which is exactly the claimed equality. Hence the two candidate components coincide and $\\beta*\\alpha$ is well defined."
      solution_sketch: "The two candidate formulas are the two legs of a single naturality square — that of $\\beta$ taken at the component $\\alpha_A$, regarded as a morphism of $\\mathcal D$. Identifying that square is the whole proof."
    anki_seeds:
      - front: "Vertical composite $\\beta\\cdot\\alpha$ of natural transformations — component at $A$?"
        back: "$(\\beta\\cdot\\alpha)_A=\\beta_A\\circ\\alpha_A$ (same functors stacked)."
        type: basic
      - front: "Horizontal composite $\\beta*\\alpha$ (of $\\alpha\\colon F\\Rightarrow F'$, $\\beta\\colon G\\Rightarrow G'$) — its type?"
        back: "$\\beta*\\alpha\\colon GF\\Rightarrow G'F'$ (across composable functors)."
        type: basic
      - front: "The interchange law states..."
        back: "$(\\beta'\\cdot\\beta)*(\\alpha'\\cdot\\alpha)=(\\beta'*\\alpha')\\cdot(\\beta*\\alpha)$."
        type: basic

  - id: functor-categories
    name: Functor Categories
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: natural-transformations
        weight: 0.5
        key: true
      - id: vertical-horizontal-composition
        weight: 0.4
        key: true
      - id: naturality-proofs
        weight: 0.3
