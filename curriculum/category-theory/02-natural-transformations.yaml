      - id: kp1
        name: First examples in Set
        key_prerequisites: [naturality-square]
        constraints: "Require the learner to use first examples in set. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        step_check:
          step: 'Compute the left leg'
          question: 'Why is the left leg computed as $(f\times f)(a,a)$?'
          options:
            - 'Because $f\times f$ is the component $\delta_B$ of the transformation'
            - 'Because $G(f)$ applies $f$ to the first coordinate of a pair only'
            - 'Because $G(f)=f\times f$ acts on both coordinates of $(a,a)$'
          answer: 'Because $G(f)=f\times f$ acts on both coordinates of $(a,a)$'
          why: 'The left leg is $G(f)$ applied to $\delta_A(a)=(a,a)$, and $G(f)=f\times f$ sends $(a,a)$ to $(f(a),f(a))$.'
        exemplars:
          - problem: 'Let $\mathrm{Id}$ be the identity functor on $\mathbf{Set}$ and let $G(X)=X\times X$ with $G(f)=f\times f$. The maps $\delta_X(x)=(x,x)$ form a natural transformation $\delta\colon\mathrm{Id}\Rightarrow G$. Take $f\colon\{1,2,3\}\to\{4,5\}$ with $f(1)=4$, $f(2)=5$, $f(3)=4$. The two legs of the naturality square at $f$ send $3$ to the same pair. What is it?'
            answer: '(4, 4)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The leg $G(f)\circ\delta_X$ sends $3$ to $(3,3)$ and then to $(f(3),f(3))=(4,4)$. The leg $\delta_Y\circ f$ sends $3$ to $f(3)=4$ and then to $(4,4)$. Both legs give $(4,4)$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ be functors with $F(A)=\{0,1,2\}$, $F(B)=\{0,1\}$, $G(A)=\{0,1,2\}$, $G(B)=\{0,1,2\}$. The map $F(u)$ sends $0\mapsto 0$, $1\mapsto 1$, $2\mapsto 1$, and $G(u)$ sends $0\mapsto 1$, $1\mapsto 2$, $2\mapsto 0$. A natural transformation $\alpha\colon F\Rightarrow G$ has $\alpha_A$ given by $0\mapsto 2$, $1\mapsto 0$, $2\mapsto 0$. What is $\alpha_B(0)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality at $u$ says $\alpha_B(F(u)(x))=G(u)(\alpha_A(x))$. For $x=0$ we have $F(u)(0)=0$ and $\alpha_A(0)=2$, so $\alpha_B(0)=G(u)(2)=0$. The other values of $x$ give the consistent value $\alpha_B(1)=1$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ be functors with $F(A)=\{1,2,3\}$, $F(B)=\{1,2,3,4\}$, $G(A)=\{a,b\}$, $G(B)=\{p,q\}$. The map $F(u)$ sends each of $1,2,3$ to itself, and $G(u)$ sends $a\mapsto p$ and $b\mapsto q$. How many natural transformations $F\Rightarrow G$ are there?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Any function $\alpha_A\colon F(A)\to G(A)$ can be chosen, and there are $2^3=8$ of them. Naturality then forces $\alpha_B$ on the elements $1,2,3$, which are the images of $F(u)$, but leaves $\alpha_B(4)$ free with $2$ choices. So there are $8\cdot 2=16$ natural transformations.'
          - problem: 'A tagging program sends each element $a$ of a set $A$ to the whole set $A$, written $c_A(a)=A$, and recoding with a function $f$ sends a subset $S$ to its image $f(S)$. Test $c$ as a transformation from the identity functor to the power-set functor on $A=\{4\}$, $B=\{4,9\}$ and $f\colon A\to B$ with $f(4)=9$. How many elements does $f(c_A(4))$ have, and how many does $c_B(f(4))$ have?'
            answer: '(1, 2)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The leg $f(c_A(4))$ is the image of $A=\{4\}$, which is $\{9\}$ with $1$ element. The leg $c_B(f(4))=c_B(9)=B=\{4,9\}$ has $2$ elements. The legs differ, so the square does not commute and $c$ is not natural.'
          - problem: 'Sam claims that the singleton map $\eta_A(a)=\{a\}$ is natural as a transformation from the identity functor to the power-set functor $\mathcal{P}$, where $\mathcal{P}(f)$ sends a subset to its image. For $f\colon\{1,2\}\to\{3,4\}$ with $f(1)=4$ and $f(2)=3$, Sam computes the leg $\mathcal{P}(f)(\eta_A(1))$ as $\{1\}$. What is the one element of the correct set $\mathcal{P}(f)(\eta_A(1))$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $\eta_A(1)$ is $\{1\}$, and $\mathcal{P}(f)$ sends it to its image. The image is $\{f(1)\}=\{4\}$, so the element is $4$. Sam left out the application of $f$.'
          - problem: 'A program recodes every entry of a list with $g(x)=x-1$, and another program turns a nonempty list into the pair (first entry, first entry). On the list $[4,6,9]$, recoding first and then forming the pair gives the same pair as forming the pair first and then recoding both entries. What is that pair?'
            answer: '(3, 3)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'Recoding $[4,6,9]$ gives $[3,5,8]$, and the pair of its first entry is $(3,3)$. Forming the pair first gives $(4,4)$, and recoding both entries gives $(3,3)$. Both orders give $(3,3)$.'
          - problem: 'A shop sells the items $1,2,3$ at the prices $3,5,3$. The bundle program turns an item $x$ into the pair $(x,x)$, and the price program replaces each item in a pair by its price. Pricing the bundle of item $2$ gives the same pair as bundling the price of item $2$. What is that pair?'
            answer: '(5, 5)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The price of item $2$ is $5$, so bundling the price gives $(5,5)$. Bundling item $2$ gives $(2,2)$, and pricing both entries gives $(5,5)$. Both routes give $(5,5)$.'
          - problem: 'Write the full proof that list reversal $\rho_X$ is a natural transformation from the list functor $L$ on $\mathbf{Set}$ to itself. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (components): for each set X, define rho_X: L(X) -> L(X) by reversing the order of the letters of a word; the empty word stays empty. Step 2 (set up the square): fix any map f: X -> Y and a general word w = x1 x2 ... xn in L(X). Step 3 (top leg): reversal first gives rho_X(w) = xn ... x2 x1, then the letterwise map gives L(f)(rho_X(w)) = f(xn) ... f(x2) f(x1). Step 4 (bottom leg): mapping first gives L(f)(w) = f(x1) f(x2) ... f(xn), then reversal gives rho_Y(L(f)(w)) = f(xn) ... f(x2) f(x1). Step 5 (conclusion): the two legs agree on every word, checked elementwise, so L(f) composed with rho_X equals rho_Y composed with L(f); the naturality square commutes for every f, and rho is a natural transformation from L to itself.'
      - id: kp2
        name: Natural transformations between hom-functors
        key_prerequisites: [hom-functors]
        constraints: "Require the learner to use natural transformations between hom-functors. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        step_check:
          step: 'associativity is the only ingredient used'
          question: 'Why does the square for $f^*$ commute for every $t$, $g$ and $f$?'
          options:
            - 'Both sides are one composite bracketed in two ways, and associativity equates them'
            - 'Every function $t$ preserves the composite $g\circ f$, so $t$ passes through the bracket'
            - 'The map $f^*$ is a bijection, and bijections commute with every post-composition'
          answer: 'Both sides are one composite bracketed in two ways, and associativity equates them'
          why: 'The two sides are $t\circ(g\circ f)$ and $(t\circ g)\circ f$, which are equal by associativity of composition.'
        exemplars:
          - problem: 'In $\mathbf{Set}$ let $f\colon A\to B$ with $A=\{1,2\}$, $B=\{a,b,c\}$, $f(1)=b$, $f(2)=c$. Pre-composition with $f$ sends a function $g\colon B\to X$ to $g\circ f\colon A\to X$. Take $X=\{0,1\}$ and $g(a)=1$, $g(b)=0$, $g(c)=1$. What is the value of $g\circ f$ at $2$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $g\circ f$ sends $2$ first to $f(2)=c$ and then to $g(c)=1$. So $(g\circ f)(2)=1$.'
          - problem: 'Fix $f\colon A\to B$ with $A=\{9\}$, $B=\{2,4\}$ and $f(9)=4$. Let $g\colon B\to X$ with $X=\{1,3,5\}$ be given by $g(2)=3$, $g(4)=5$, and let $k\colon X\to Y$ with $Y=\{0,7\}$ be given by $k(1)=0$, $k(3)=7$, $k(5)=0$. In the naturality square of pre-composition with $f$ at $k$, both paths send $g$ to the same function $A\to Y$. What is its value at $9$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One path computes $k\circ(g\circ f)$ and the other computes $(k\circ g)\circ f$, and both agree. At $9$ we get $f(9)=4$, then $g(4)=5$, then $k(5)=0$, so the value is $0$.'
          - problem: 'In $\mathbf{Set}$ let $A=\{0,1\}$ and $B=\{0,1,2\}$, and let $\tau\colon\mathrm{Hom}(B,-)\Rightarrow\mathrm{Hom}(A,-)$ be a natural transformation with $\tau_B(\mathrm{id}_B)=f$, where $f(0)=2$ and $f(1)=0$. Let $g\colon B\to X$ with $X=\{0,1,2\}$ be given by $g(0)=1$, $g(1)=0$, $g(2)=2$. What is $\tau_X(g)(0)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality at $g$ gives $\tau_X(g)=\tau_X(g\circ\mathrm{id}_B)=g\circ\tau_B(\mathrm{id}_B)=g\circ f$. Then $(g\circ f)(0)=g(2)=2$. So $\tau_X(g)(0)=2$.'
          - problem: 'In $\mathbf{Set}$ let $A$ have $2$ elements and $B$ have $3$ elements. How many natural transformations $\mathrm{Hom}(B,-)\Rightarrow\mathrm{Hom}(A,-)$ are there?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural transformation $\tau$ is determined by the single function $\tau_B(\mathrm{id}_B)\colon A\to B$, because $\tau_X(g)=g\circ\tau_B(\mathrm{id}_B)$. Every function $A\to B$ occurs. There are $3^2=9$ functions from a $2$-element set to a $3$-element set, so there are $9$ natural transformations.'
          - problem: 'Sam checks that pre-composition with $f\colon A\to B$ is natural, as a transformation $\mathrm{Hom}(B,-)\Rightarrow\mathrm{Hom}(A,-)$. For $g\colon B\to X$ and $k\colon X\to Y$ the correct leg sends $g$ to $(k\circ g)\circ f$, but Sam writes it as $g\circ(k\circ f)$. Take $A=B=X=Y=\mathbb Z$, $f(x)=2x$, $g(x)=x^2$ and $k(x)=x+1$. What is the value of $(k\circ g)\circ f$ at $3$?'
            answer: '37'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The correct leg applies $f$, then $g$, then $k$. So $f(3)=6$, $g(6)=36$ and $k(36)=37$. Sam''s expression $g\circ(k\circ f)$ gives $49$, which is a different value.'
          - problem: 'Three hotel guests $1,2,3$ are booked into the hotels $H_1,H_2,H_1$. The hotel $H_1$ has $4$ stars and $H_2$ has $3$ stars. A price table gives $45$ for a $4$-star hotel and $30$ for a $3$-star hotel. Pre-composing the star rating with the booking, and then post-composing with the price table, gives one price for each guest. What price results for guest $1$?'
            answer: '45'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Guest $1$ is booked into $H_1$, whose star rating is $4$. The price table sends $4$ stars to $45$. Looking up the rating first or the price of the booking first gives the same result, so the price is $45$.'
          - problem: 'Three students $p,q,r$ belong to the clubs $0,1,1$ respectively, given by a function $h$. The club $0$ meets in room $20$ and the club $1$ meets in room $30$, given by a function $f$. Post-composition with $f$ sends $h$ to $f\circ h$. In which room is the student $q$ assigned by $f\circ h$?'
            answer: '30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The student $q$ belongs to club $1$, so $h(q)=1$. The club $1$ meets in room $30$, so $f(h(q))=30$. Hence $f\circ h$ assigns $q$ to room $30$.'
          - problem: 'Write the full proof that for a morphism $f\colon A\to B$ in a category $C$ the post-composition components $(f_*)_X\colon\mathrm{Hom}(X,A)\to\mathrm{Hom}(X,B)$, sending $h$ to the composite $f\circ h$, form a natural transformation $\mathrm{Hom}(-,A)\Rightarrow\mathrm{Hom}(-,B)$. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The fixed variable is f from A to B; h is the variable element of Hom(X,A). Step 1 (components): for each object X define (f*)_X from Hom(X,A) to Hom(X,B) by sending h to the composite f after h. Step 2 (the square): for a morphism u from W to X, naturality requires (f*)_W after Hom(u,A) = Hom(u,B) after (f*)_X, where both functors act on u by pre-composition. Step 3 (evaluate both sides): on h in Hom(X,A) the left side gives f after (h after u) and the right side gives (f after h) after u. Step 4 (associativity): associativity of composition, the only ingredient, gives f after (h after u) = (f after h) after u, so the square commutes for every u. Conclusion: f* is a natural transformation of presheaves from Hom(-,A) to Hom(-,B).'
      - id: kp3
        name: Identities and degenerate cases
        key_prerequisites: [discrete-indiscrete-categories]
        constraints: "Require the learner to use identities and degenerate cases. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        step_check:
          step: 'any two parallel morphisms $FA\to GB$ must be equal'
          question: 'Why must the two legs of each naturality square be equal here?'
          options:
            - 'They are both composites of the same two morphisms, so they must be equal'
            - 'They are parallel morphisms into a preorder, so there is at most one of them'
            - 'The functors preserve identities, and that makes every square in a preorder commute'
          answer: 'They are parallel morphisms into a preorder, so there is at most one of them'
          why: 'A preorder has at most one morphism between two objects, so two parallel morphisms $FA\to GB$ are the same morphism.'
        try_first:
          problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$, and let $D$ be the chain $0<1<2$, with a morphism from $x$ to $y$ exactly when $x\le y$. Let $F,G\colon\mathcal{C}\to D$ be the functors with $F(A)=0$, $F(B)=1$, $G(A)=1$, $G(B)=2$. How many natural transformations $F\Rightarrow G$ are there?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'Each component exists and is unique because $0\le 1$ and $1\le 2$. The naturality square needs no check, since a chain has at most one morphism between two objects, so every family of components is natural.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$, and let $F\colon\mathcal{C}\to\mathbf{Set}$ be the functor with $F(A)=\{0,1\}$, $F(B)=\{0,1,2\}$, where $F(u)$ sends $0\mapsto 2$ and $1\mapsto 0$. For the identity transformation of $F$, the two legs of the naturality square at $u$ send $1$ to the same element. Which element?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leg $F(u)\circ\mathrm{id}_{F(A)}$ sends $1$ to $F(u)(1)=0$. The leg $\mathrm{id}_{F(B)}\circ F(u)$ also sends $1$ to $F(u)(1)=0$. Both legs give $0$.'
          - problem: 'Let $M$ be the category with one object whose morphisms are the elements of the cyclic group of order four, with composition given by addition modulo four. Let $F\colon M\to\mathbf{Set}$ send the object to $\{0,1,2,3\}$ and the morphism $k$ to the map $x\mapsto x+k \bmod 4$. For the identity transformation of $F$, both legs of the naturality square at the morphism $3$ are the same map. What is the value of that map at $2$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The morphism $3$ acts by $x\mapsto x+3 \bmod 4$, and both legs equal this map because the components are identities. At $2$ the value is $2+3=5\equiv 1 \pmod 4$.'
          - problem: 'Let $\mathcal{D}$ be the discrete category with the two objects $A,B$ and only identity morphisms. Let $F,G\colon\mathcal{D}\to\mathbf{Set}$ be functors with $F(A)=\{1,2\}$, $F(B)=\{1\}$, $G(A)=\{a,b,c\}$, $G(B)=\{p,q\}$. How many natural transformations $F\Rightarrow G$ are there?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only morphisms are identities, so every naturality square commutes and a natural transformation is any pair of functions $\alpha_A\colon F(A)\to G(A)$ and $\alpha_B\colon F(B)\to G(B)$. There are $3^2=9$ choices for $\alpha_A$ and $2^1=2$ choices for $\alpha_B$. So there are $9\cdot 2=18$ natural transformations.'
          - problem: 'Let $I$ be the indiscrete category with two objects $X,Y$: exactly one morphism between any two objects, so the morphism $u\colon X\to Y$ and the morphism $v\colon Y\to X$ are inverse to each other. Define $F,G\colon I\to\mathbf{Set}$ with $F(X)=G(X)=\{1,2\}$ and $F(Y)=G(Y)=\{a,b\}$. For $F$, the map $F(u)$ sends $1\mapsto a$, $2\mapsto b$ and $F(v)$ sends $a\mapsto 1$, $b\mapsto 2$. For $G$, the map $G(u)$ sends $1\mapsto b$, $2\mapsto a$ and $G(v)$ sends $b\mapsto 1$, $a\mapsto 2$. How many natural transformations $F\Rightarrow G$ are there?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality at $u$ forces $\alpha_Y(F(u)(x))=G(u)(\alpha_X(x))$, so $\alpha_Y$ is determined by $\alpha_X$. The square at $v$ then holds automatically because $v$ is inverse to $u$ in both functors. The function $\alpha_X\colon\{1,2\}\to\{1,2\}$ is free, which gives $2^2=4$ natural transformations.'
          - problem: 'Sam argues that for every functor $F\colon C\to\mathbf{Set}$ the identity family is natural. Sam writes: Step 1: for each morphism $f\colon A\to B$ the square requires $F(f)\circ\mathrm{id}_{F(A)}=\mathrm{id}_{F(B)}\circ F(f)$. Step 2: here $F(f)$ is itself an identity map, so the left leg equals the identity at $A$. Step 3: by the unit law the right leg equals $F(f)$. Step 4: so both legs are equal and the family is natural. Which step is the first that is not valid, and why?'
            answer: 'Step 2: F(f) is not an identity map in general; by the unit law both legs equal F(f), and that is the correct argument.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Step 1 is the correct square. Step 2 is wrong because $F(f)$ is not an identity map in general. The family is still natural, since by the unit law both legs equal $F(f)$, so the error is only in the argument of Step 2.'
          - problem: 'Let $\mathcal{C}$ be the category with one object and only its identity morphism, and let $F\colon\mathcal{C}\to\mathbf{Set}$ send the object to a finite set $S$. What is the least number of elements of $S$ for which $F$ has a natural transformation to itself other than the identity?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With one object and only its identity, every function $S\to S$ is a natural transformation $F\Rightarrow F$. A set with $0$ or $1$ elements has only one function to itself, which is the identity. A set with $2$ elements has $4$ such functions, so the least size is $2$.'
          - problem: 'Two production lines pass a product through stage $A$ and then stage $B$, so each is a functor from the category $A\to B$ to the chain $0<1<2<3<4<5$, with a morphism from $x$ to $y$ exactly when $x\le y$. Line $F$ has quality level $1$ at $A$ and $3$ at $B$. Line $G$ has level $2$ at $A$ and $4$ at $B$. How many natural transformations $F\Rightarrow G$ are there?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A component at each stage is a morphism from the level of $F$ to the level of $G$, and it exists exactly when the first level is at most the second. Here $1\le 2$ and $3\le 4$, so both components exist and are unique. The chain has at most one morphism between two levels, so naturality is automatic and there is $1$ natural transformation.'
          - problem: 'Two production lines pass a product through stage $A$ and then stage $B$, so each is a functor from the category $A\to B$ to the chain $0<1<2<3<4<5$, with a morphism from $x$ to $y$ exactly when $x\le y$. Line $F$ has quality level $1$ at $A$ and $3$ at $B$. Line $G$ has level $2$ at $A$ and $2$ at $B$. How many natural transformations $F\Rightarrow G$ are there?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A component at stage $B$ would be a morphism from level $3$ to level $2$. This needs $3\le 2$, which is false, so no such morphism exists. Without a component at $B$ there is no natural transformation, so the count is $0$.'
          - problem: 'Write the full proof that if $C$ is a discrete category, then a natural transformation between two functors $F$ and $G$ from $C$ to any category $D$ is exactly an arbitrary family of arrows, one from $F(A)$ to $G(A)$ for each object $A$ of $C$, with no further condition. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (what must be checked): for every arrow f from A to B in C, the naturality square requiring that G(f) after the component at A equals the component at B after F(f) must commute. Step 2 (the arrows of C): C is discrete, so its only arrows are the identity arrows, one for each object. Step 3 (the square at an identity): by the functor laws, F sends the identity arrow of A to the identity on F(A) and G sends it to the identity on G(A); by the unit laws of D both legs of that square equal the component at A, so every square commutes for any choice of family. Step 4 (converse): a natural transformation is by definition a family of arrows from F(A) to G(A), one per object, so such families exist exactly as stated. Conclusion: natural transformations from F to G are precisely the arbitrary families of arrows from F(A) to G(A), one per object of C, with no further condition.'
    diagnostic_exemplar:
      problem: "Fix $f\\colon A\\to B$ in $\\mathcal{C}$. Prove that pre-composition, with components $(f^*)_X\\colon\\mathrm{Hom}(B,X)\\to\\mathrm{Hom}(A,X)$, $g\\mapsto g\\circ f$, is a natural transformation $\\mathrm{Hom}(B,-)\\Rightarrow\\mathrm{Hom}(A,-)$."
      answer: "Both hom-functors act on $k\\colon X\\to Y$ by post-composition $k_*$. Naturality at $k$ asks $k_*\\circ(f^*)_X=(f^*)_Y\\circ k_*$. On $g\\in\\mathrm{Hom}(B,X)$: the left side gives $k\\circ(g\\circ f)$ and the right side $(k\\circ g)\\circ f$, equal by associativity. So every naturality square commutes and $f^*$ is natural."
      solution_sketch: "Both hom-functors act by post-composition, so chasing an element $g$ through the naturality square at $k$ compares $k\\circ(g\\circ f)$ with $(k\\circ g)\\circ f$ — associativity is the whole proof."
    anki_seeds:
      - front: "A natural transformation $\\alpha\\colon F\\Rightarrow G$ is..."
        back: "a family of components $\\alpha_A\\colon FA\\to GA$ such that $Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$ for every $f\\colon A\\to B$."
