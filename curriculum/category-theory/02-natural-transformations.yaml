        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Definition via natural isomorphisms
        key_prerequisites: [natural-isomorphisms]
        constraints: "Require definition via natural isomorphisms. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        step_check:
          step: 'Whiskering $\eta''$ by $G$ and $F$'
          question: 'Why must $\eta''$ be whiskered by $G$ on the left and by $F$ on the right?'
          options:
            - 'The transformation $\eta''$ is defined on $\mathcal{A}$, so $G$ and $F$ are needed to move it'
            - 'The target $GF$ of $\eta$ must become $G(KH)F$, so $G$ and $F$ surround $\eta''$'
            - 'Whiskering $\eta''$ makes $GF$ equal to $GKHF$, so no isomorphism is needed'
            - 'The functors $G$ and $F$ reverse the direction of $\eta''$, giving $1_{\mathcal{A}}\Rightarrow GF$'
          answer: 'The target $GF$ of $\eta$ must become $G(KH)F$, so $G$ and $F$ surround $\eta''$'
          why: 'The transformation $\eta''\colon 1_{\mathcal{B}}\Rightarrow KH$ lives on $\mathcal{B}$, and $GF$ is $G1_{\mathcal{B}}F$, so wrapping $\eta''$ in $G$ and $F$ gives an isomorphism from $GF$ to $G(KH)F$.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the category with three objects $0,1,2$ and exactly one arrow from each object to each object (the identities included). Let $\mathcal{D}$ be the category with one object $*$ and only its identity arrow. Let $F\colon\mathcal{C}\to\mathcal{D}$ be the unique functor and let $G\colon\mathcal{D}\to\mathcal{C}$ be the functor sending $*$ to $1$. What is the object $GF(2)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The functor $F$ sends the object $2$ to $*$, and $G$ sends $*$ to $1$. So $GF(2)=1$. This is different from $2$, so $GF$ is not the identity functor, but there is an arrow $2\to1$ in $\mathcal{C}$, which is the component of the natural isomorphism.'
          - problem: 'Let $\mathcal{C}$ and $\mathcal{D}$ be the categories with exactly one arrow from each object to each object, on the objects $\{0,1,2\}$ and $\{0,1\}$ respectively. Functors $F\colon\mathcal{C}\to\mathcal{D}$ and $G\colon\mathcal{D}\to\mathcal{C}$ act on objects by $F(0)=0$, $F(1)=1$, $F(2)=1$ and $G(0)=2$, $G(1)=0$. There is a natural isomorphism $\eta\colon 1_{\mathcal{C}}\Rightarrow GF$. The component $\eta_0$ is an arrow from $0$ to which object?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The component $\eta_0$ is an arrow from $0$ to $GF(0)$. Here $F(0)=0$ and $G(0)=2$, so $GF(0)=2$. The arrow $0\to2$ exists and is unique, so the answer is $2$.'
          - problem: 'A lab keeps three two-element sets $\{H,T\}$, $\{0,1\}$ and $\{x,y\}$. Let $\mathcal{S}$ be the category whose objects are these three sets and whose morphisms are all bijections between them. How many morphisms does $\mathcal{S}$ have in total? (The one-object category $\mathbf{B}(\mathbb{Z}/2)$ with the two bijections of one set is equivalent to $\mathcal{S}$, though it has fewer morphisms.)'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $3$ choices of source, $3$ choices of target, and $2$ bijections between any two sets with two elements. So $\mathcal{S}$ has $3\times3\times2=18$ morphisms. The equivalent category $\mathbf{B}(\mathbb{Z}/2)$ has only $2$.'
          - problem: 'Let $\mathcal{C}$ be the category with four objects and exactly one arrow from each object to each object, and let $\mathcal{D}$ be the category with one object and only its identity. Let $F\colon\mathcal{C}\to\mathcal{D}$ be the unique functor and let $G\colon\mathcal{D}\to\mathcal{C}$ send the object of $\mathcal{D}$ to the object $2$ of $\mathcal{C}$. How many natural isomorphisms are there from $1_{\mathcal{C}}$ to $GF$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural transformation from $1_{\mathcal{C}}$ to $GF$ has a component $x\to2$ for each object $x$. Each hom-set has exactly $1$ arrow, so there is only $1$ choice for each component. All squares commute because parallel arrows are equal, and every arrow is invertible, so there is exactly $1$ natural isomorphism.'
          - problem: 'Let $\mathcal{C}$ be the category with three objects and exactly one arrow from each object to each object, and let $\mathcal{D}$ be the category with one object and only its identity. The unique functor $F\colon\mathcal{C}\to\mathcal{D}$ is an equivalence. Is $F$ an isomorphism of categories?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is an isomorphism", "it is", "yes it is"], ["no", "it is not an isomorphism", "it is not", "not an isomorphism", "no isomorphism"]]}
            solution_sketch: 'An isomorphism of categories needs a bijection on objects. $\mathcal{C}$ has $3$ objects and $\mathcal{D}$ has $1$, so $F$ is not bijective on objects. Hence there is no strict inverse, and the answer is no.'
          - problem: 'Sam claims that equivalence of categories is transitive and argues as follows. Step 1: the hypotheses give $F\colon\mathcal{C}\to\mathcal{D}$, $G\colon\mathcal{D}\to\mathcal{C}$ with a natural isomorphism $\eta\colon1_{\mathcal{C}}\Rightarrow GF$, and $F''\colon\mathcal{D}\to\mathcal{E}$, $G''\colon\mathcal{E}\to\mathcal{D}$ with $\eta''\colon1_{\mathcal{D}}\Rightarrow G''F''$. Step 2: use $F''F\colon\mathcal{C}\to\mathcal{E}$ and $GG''\colon\mathcal{E}\to\mathcal{C}$. Step 3: a natural isomorphism from $1_{\mathcal{C}}$ to $GG''F''F$ is obtained by composing $\eta$ with $\eta''$. Step 4: the same argument on the other side gives the second natural isomorphism. Which step is the first that is not valid, and why?'
            answer: 'Step 3: eta and eta-prime are transformations between endofunctors of different categories, so they cannot be composed directly; eta-prime needs whiskering.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Step 1 restates the hypotheses and Step 2 correctly composes functors. Step 3 is the first invalid step: $\eta$ and $\eta''$ are transformations between endofunctors of different categories, so they cannot be composed directly. The valid construction is the whiskered $G\eta''F\colon GF\Rightarrow GG''F''F$ composed after $\eta$.'
          - problem: 'Let $\mathcal{C}$ be the category with three objects and exactly one arrow from each object to each object, and let $\mathcal{D}$ be the same kind of category with two objects. A functor from $\mathcal{C}$ to $\mathcal{D}$ must send each object of $\mathcal{C}$ to an object of $\mathcal{D}$. How many functors from $\mathcal{C}$ to $\mathcal{D}$ are there?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor is determined by its action on objects, because between any two objects there is exactly one arrow. Any object map works, since composition and identities are preserved automatically. There are $2^3=8$ object maps, so there are $8$ functors.'
          - problem: 'A shelf holds five one-element sets $\{a\}$, $\{b\}$, $\{c\}$, $\{d\}$, $\{e\}$. Let $\mathcal{P}$ be the category whose objects are these five sets and whose morphisms are all functions between them. The category $\mathcal{P}$ is equivalent to the category $\mathbf{1}$ with one object and only its identity. How many morphisms does $\mathcal{P}$ have?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Between any two one-element sets there is exactly $1$ function. There are $5$ choices of source and $5$ of target, so $\mathcal{P}$ has $5\times5=25$ morphisms. The equivalent category $\mathbf{1}$ has only $1$.'
          - problem: 'Write the full proof that if $\mathcal{C}$ is equivalent to $\mathcal{D}$ and $\mathcal{D}$ is equivalent to $\mathcal{E}$, then $\mathcal{C}$ is equivalent to $\mathcal{E}$.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Data: an equivalence (F, G, eta, eps) from C to D, where eta is a natural isomorphism from the identity on C to GF and eps runs from FG to the identity on D, and an equivalence (F'', G'', eta'', eps'') from D to E, where eta'' runs from the identity on D to G''F'' and eps'' from F''G'' to the identity on E. Step 1, functors: take the composites F''F from C to E and GG'' from E to C; composites of functors are functors. Step 2, isomorphism at C: compose the identity natural isomorphism of G with eta'' and with the identity natural isomorphism of F to obtain the whiskered natural isomorphism G eta'' F from GF to GG''F''F; then compose eta with G eta'' F to get a natural isomorphism from the identity on C to GG''F''F. Step 3, isomorphism at E: compose the identity natural isomorphism of F'' with eps and with the identity natural isomorphism of G'' to obtain F'' eps G'', a natural isomorphism from F''FGG'' to F''G''; compose it with eps'' to get a natural isomorphism from F''FGG'' to the identity on E. Step 4, conclusion: the four pieces (F''F, GG'', the composite from Step 2, the composite from Step 3) satisfy the definition of an equivalence, so C is equivalent to E. Every step only composes natural isomorphisms, as the definition requires.'
      - id: kp2
        name: The fully faithful + essentially surjective test
        key_prerequisites: [full-faithful-functors]
        constraints: "Require the fully faithful + essentially surjective test. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        step_check:
          step: 'Since $\alpha_Y$ is an isomorphism'
          question: 'Why does $\alpha_Y$ being an isomorphism let us solve for $f$ in $HF(f)\circ\alpha_X=\alpha_Y\circ f$?'
          options:
            - 'Then $\alpha_Y$ commutes with $f$, so the two composites can be interchanged'
            - 'Then $HF(f)$ is also an isomorphism, so it can be cancelled from both sides'
            - 'Then $\alpha_X$ is the identity, and $f$ is therefore equal to $HF(f)$'
            - 'Then $\alpha_Y^{-1}$ exists, and composing with it on the left isolates $f$'
          answer: 'Then $\alpha_Y^{-1}$ exists, and composing with it on the left isolates $f$'
          why: 'Composing $HF(f)\circ\alpha_X=\alpha_Y\circ f$ with $\alpha_Y^{-1}$ on the left gives $f=\alpha_Y^{-1}\circ HF(f)\circ\alpha_X$, so $f$ is determined by $HF(f)$.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the poset $0<1<2$ and $\mathcal{D}$ the poset $0<1<2<3$, each viewed as a category with one arrow $x\to y$ exactly when $x\le y$. Let $F\colon\mathcal{C}\to\mathcal{D}$ be the inclusion. In a poset category two objects are isomorphic only if they are equal. How many objects of $\mathcal{D}$ are isomorphic to an object in the image of $F$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In a poset category an isomorphism $x\cong y$ means $x\le y$ and $y\le x$, so $x=y$. The image of $F$ contains the objects $0,1,2$. So exactly $3$ objects of $\mathcal{D}$ are isomorphic to an object in the image, and the object $3$ is not.'
          - problem: 'Let $\mathcal{C}$ be the poset $0<1<2$ and $\mathcal{D}$ the poset $0<1<2<3$, each viewed as a category with one arrow $x\to y$ exactly when $x\le y$. Let $F\colon\mathcal{C}\to\mathcal{D}$ be the inclusion. Is $F$ an equivalence of categories?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is an equivalence", "it is"], ["no", "it is not an equivalence", "it is not", "not an equivalence"]]}
            solution_sketch: 'The inclusion is fully faithful, since the order relations between objects of $\mathcal{C}$ are the same in $\mathcal{D}$. But the object $3$ of $\mathcal{D}$ is not isomorphic to any object of the image, so $F$ is not essentially surjective. Hence $F$ is not an equivalence.'
          - problem: 'A category $\mathcal{D}$ has objects $1,2,3,4$, the identity arrows, and exactly one further pair of arrows, an isomorphism $2\to3$ and its inverse $3\to2$. Let $\mathcal{E}$ be the full subcategory on the objects $1$ and $4$. How many objects of $\mathcal{D}$ are isomorphic to an object of $\mathcal{E}$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The object $1$ is isomorphic only to itself, and so is the object $4$. The objects $2$ and $3$ are isomorphic to each other, but neither is isomorphic to $1$ or $4$. So exactly $2$ objects of $\mathcal{D}$ are isomorphic to an object of $\mathcal{E}$.'
          - problem: 'A category $\mathcal{D}$ has objects $1,2,3,4$, the identity arrows, and exactly one further pair of arrows, an isomorphism $2\to3$ and its inverse $3\to2$. Let $\mathcal{E}$ be the full subcategory on the objects $1,2,4$. Is the inclusion $\mathcal{E}\to\mathcal{D}$ an equivalence of categories?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is an equivalence", "it is"], ["no", "it is not an equivalence", "it is not", "not an equivalence"]]}
            solution_sketch: 'The inclusion of a full subcategory is fully faithful. The object $3$ is isomorphic to the object $2$, which lies in $\mathcal{E}$, and $1,2,4$ are in $\mathcal{E}$ already, so every object of $\mathcal{D}$ is isomorphic to an object of $\mathcal{E}$. So the inclusion is also essentially surjective, and it is an equivalence.'
          - problem: 'Let $\mathbf{B}(\mathbb{Z}/3)$ be the category with one object $*$ and three arrows, the elements of $\mathbb{Z}/3$, and let $\mathbf{1}$ be the category with one object and only its identity. Let $F\colon\mathbf{B}(\mathbb{Z}/3)\to\mathbf{1}$ be the unique functor. Sam says $F$ is an equivalence because both categories have one object. How many arrows of $\mathbf{B}(\mathbb{Z}/3)$ does $F$ send to the identity arrow of $\mathbf{1}$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The category $\mathbf{1}$ has only one arrow, so $F$ sends every arrow to it. $\mathbf{B}(\mathbb{Z}/3)$ has $3$ arrows, so $F$ sends $3$ arrows to the identity. A faithful functor is injective on arrows between a given pair of objects, so $F$ is not faithful and is not an equivalence.'
          - problem: 'Let $\mathbf{Mat}$ be the category whose objects are the numbers $n=0,1,2,\dots$ and whose morphisms $m\to n$ are the $n\times m$ matrices with entries in $\{0,1\}$ (computing modulo $2$). The functor $F$ sends $n$ to the vector space $\mathbb{F}_2^n$ and a matrix to the linear map it defines, and $F$ is fully faithful. How many morphisms from the object $2$ to the object $3$ does $\mathbf{Mat}$ have?'
            answer: '64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism from $2$ to $3$ is a $3\times2$ matrix with entries in $\{0,1\}$. It has $6$ entries, each with $2$ choices. So there are $2^6=64$ morphisms, matching the $64$ linear maps $\mathbb{F}_2^2\to\mathbb{F}_2^3$.'
          - problem: 'Let $\mathcal{D}$ be the category whose objects are the four sets $\{a,b,c\}$, $\{1,2,3\}$, $\{x,y\}$ and $\{p\}$, with all functions as morphisms. Let $F$ be the inclusion of the full subcategory on the objects $\{a,b,c\}$, $\{x,y\}$ and $\{p\}$. How many objects of $\mathcal{D}$ are isomorphic to an object in the image of $F$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The three objects of the image are isomorphic to themselves. The set $\{1,2,3\}$ has $3$ elements, so it is isomorphic to $\{a,b,c\}$ by any bijection. So all $4$ objects of $\mathcal{D}$ are isomorphic to an object in the image, and $F$ is essentially surjective.'
          - problem: 'Write the full proof that if functors $F\colon\mathcal{C}\to\mathcal{D}$ and $G\colon\mathcal{D}\to\mathcal{C}$, with natural isomorphisms $\eta\colon1_{\mathcal{C}}\Rightarrow GF$ and $\varepsilon\colon FG\Rightarrow1_{\mathcal{D}}$, form an equivalence of categories, then $F$ is faithful and essentially surjective.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (essential surjectivity): fix an object D of D; the component of epsilon at D is an isomorphism from FG of D to D, so D is isomorphic to the image under F of the object G of D. Step 2 (naturality of eta): for a morphism f from A to B in C, naturality gives GF of f after eta at A equals eta at B after f. Step 3 (recovery of f): compose on the left with the inverse of eta at B and on the right with eta at A; both components are invertible because eta is a natural isomorphism, so f equals etaB inverse after GF of f after etaA. Step 4 (faithfulness): if F of f equals F of g, then applying G gives GF of f equals GF of g, and the recovery of Step 3 forces f to equal g. Conclusion: F is faithful and essentially surjective. For the converse, one chooses for every object of D an object of C together with an isomorphism to it, and full faithfulness carries the morphisms across, which makes the chosen isomorphisms natural.'
      - id: kp3
        name: An equivalence that is not an isomorphism
        key_prerequisites: [full-faithful-functors]
        constraints: "Distinguish equivalence from a strict isomorphism using hom-set bijections, quasi-inverses and object counts. Use finite indiscrete groupoids or the vector-space/matrix example. Closed items may construct the categorical object or diagnose assertions whose validity the learner must determine; the unmarked item asks for a full proof. Candidate claims must not be endorsed or explained by the stem."
        try_first:
          problem: 'A functor $F\colon\mathcal{C}\to\mathcal{D}$ is an isomorphism of categories, which means it has a two-sided inverse functor. The category $\mathcal{D}$ has exactly one object. How many objects does $\mathcal{C}$ have?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'An isomorphism of categories is a bijection on objects, so $\mathcal{C}$ has exactly $1$ object. An equivalence only needs every object of $\mathcal{D}$ to be isomorphic to an image, so it can start from a category with many objects.'
        step_check:
          step: 'Distinct matrices give distinct linear maps'
          question: 'Why do distinct matrices always give distinct linear maps?'
          options:
            - 'Matrices of different sizes always define linear maps with different domains'
            - 'A linear map is defined by its value on a single vector of the space'
            - 'The columns of the matrix are the images of the standard basis vectors'
            - 'A linear map ignores the entries of its matrix that lie below the diagonal'
          answer: 'The columns of the matrix are the images of the standard basis vectors'
