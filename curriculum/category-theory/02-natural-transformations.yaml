        back: "functors $\\mathcal C\\to\\mathcal D$; natural transformations."
        type: basic
      - front: "An isomorphism in a functor category is exactly a {{c1::natural isomorphism}}."
        back: "natural isomorphism"
        type: cloze

  - id: equivalence-of-categories
    name: Equivalence of Categories
    core: false                # terminal; nothing in this curriculum builds on it
    difficulty: 0.75
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: functor-categories
        weight: 0.4
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: natural-isomorphisms
        weight: 0.4
      - id: isomorphism-vs-equality
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Definition via natural isomorphisms
        key_prerequisites: [natural-isomorphisms]
        constraints: "State all four pieces $(F,G,\\eta,\\varepsilon)$ with the direction of each natural iso; symmetry/closure proofs may only invert or compose natural isomorphisms."
        exemplars:
          - problem: "Define an equivalence of categories $\\mathcal C\\simeq\\mathcal D$ and contrast it with an isomorphism of categories."
            answer: "Functors $F,G$ with $GF\\cong 1_{\\mathcal C}$ and $FG\\cong 1_{\\mathcal D}$ (natural isos), not equalities."
            solution_sketch: "An equivalence is a pair $F\\colon\\mathcal C\\to\\mathcal D$, $G\\colon\\mathcal D\\to\\mathcal C$ with natural isomorphisms $\\eta\\colon 1_{\\mathcal C}\\xRightarrow{\\cong}GF$ and $\\varepsilon\\colon FG\\xRightarrow{\\cong}1_{\\mathcal D}$. An isomorphism of categories would demand $GF=1_{\\mathcal C}$ and $FG=1_{\\mathcal D}$ on the nose; equivalence relaxes this to hold only up to natural isomorphism, which is the appropriate notion of sameness for categories."
          - problem: "Prove that equivalence of categories is symmetric: if $\\mathcal C\\simeq\\mathcal D$ then $\\mathcal D\\simeq\\mathcal C$."
            answer: "The quasi-inverse together with the inverse natural isos witnesses the reverse equivalence."
            solution_sketch: "An equivalence gives $F\\colon\\mathcal C\\to\\mathcal D$, $G\\colon\\mathcal D\\to\\mathcal C$ and natural isomorphisms $\\eta\\colon 1_{\\mathcal C}\\xRightarrow{\\cong}GF$, $\\varepsilon\\colon FG\\xRightarrow{\\cong}1_{\\mathcal D}$. To exhibit $\\mathcal D\\simeq\\mathcal C$ use the pair $(G,F)$: since inverses of natural isomorphisms are natural isomorphisms, $\\varepsilon^{-1}\\colon 1_{\\mathcal D}\\xRightarrow{\\cong}FG$ and $\\eta^{-1}\\colon GF\\xRightarrow{\\cong}1_{\\mathcal C}$ are the required natural isos. Hence $(G,F,\\varepsilon^{-1},\\eta^{-1})$ is an equivalence and $\\mathcal D\\simeq\\mathcal C$."
      - id: kp2
        name: The fully faithful + essentially surjective test
        key_prerequisites: [full-faithful-functors]
        constraints: "Only the easy direction is proved in full ($\\varepsilon_D$ gives essential surjectivity; $f=\\eta_B^{-1}\\circ GFf\\circ\\eta_A$ gives faithfulness); the converse is stated with its choice-based construction sketched."
        exemplars:
          - problem: "State the characterization of when a functor $F$ is part of an equivalence, and define its essential-surjectivity clause."
            answer: "$F$ is an equivalence iff it is fully faithful and essentially surjective (every $D\\cong FC$ for some $C$)."
            solution_sketch: "$F$ is essentially surjective if every object $D$ of $\\mathcal D$ is isomorphic to $FC$ for some object $C$. Theorem: $F$ extends to an equivalence iff $F$ is fully faithful and essentially surjective. Given these, choose for each $D$ an object $GD$ with iso $FGD\\cong D$; full faithfulness transports morphisms uniquely to make $G$ a functor and the chosen isos natural."
          - problem: "Prove the easy direction: if $(F,G,\\eta,\\varepsilon)$ is an equivalence then $F$ is faithful and essentially surjective."
            answer: "$\\varepsilon_D\\colon FGD\\cong D$ gives ess. surjectivity; naturality of $\\eta$ recovers $f$ from $GFf$."
            solution_sketch: "Essential surjectivity: for any object $D$, the component $\\varepsilon_D\\colon FGD\\xrightarrow{\\cong}D$ shows $D\\cong F(GD)$. Faithfulness: naturality of $\\eta\\colon 1_{\\mathcal C}\\xRightarrow{\\cong}GF$ gives $GF(f)\\circ\\eta_A=\\eta_B\\circ f$, so $f=\\eta_B^{-1}\\circ GF(f)\\circ\\eta_A$; hence $f$ is recovered from $GF(f)$. If $Ff=Fg$ then applying $G$ gives $GFf=GFg$, so $f=g$. Thus $F$ is faithful and essentially surjective."
      - id: kp3
        name: An equivalence that is not an isomorphism
        key_prerequisites: [full-faithful-functors]
        constraints: "Instances limited to $\\mathbf{FinVect}_k\\simeq\\mathbf{Mat}_k$ and the two-object indiscrete groupoid $\\simeq\\mathbf 1$; the non-isomorphism claim is always settled by counting objects."
        exemplars:
          - problem: "In the category Mat_k over the field with two elements, the objects are the natural numbers and a morphism from m to n is an n by m matrix with entries in the field. Full faithfulness of the functor to FinVect_k says such morphisms correspond exactly to linear maps from k^m to k^n. Find how many morphisms there are from 2 to 3."
            answer: "64"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the hom-set of morphisms from 2 to 3 in Mat_k: the set of all 3 by 2 matrices over the field with two elements. Entry count: such a matrix has 3 times 2, that is 6 entries. Product rule: each entry can take 2 values, so the number of matrices is 2^6. The answer is 64."
          - problem: "The indiscrete groupoid I has two objects 0 and 1, and for each ordered pair of objects it has exactly one morphism, which is an isomorphism. Find the total number of morphisms in I."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the set of all morphisms of I, the union of the hom-sets over all ordered pairs of objects. Ordered pairs: (0,0), (0,1), (1,0) and (1,1), so there are 2 times 2 = 4 pairs. Counting rule: each ordered pair contributes exactly one morphism, so the total is 4. The answer is 4."
          - problem: "The functor F from Mat_k to FinVect_k sends the object n to the vector space k^n. Essential surjectivity of F means every finite-dimensional vector space is isomorphic to F(n) for some object n. The space of polynomials in one variable of degree less than 3 is isomorphic to k^3. Find the object n of Mat_k with F(n) isomorphic to this space."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the functor F with F(n) = k^n for each object n of Mat_k. Dimension rule: the polynomial space of degree less than 3 has the basis 1, x, x^2, so it has dimension 3 and is isomorphic to k^3. Matching dimensions: F(n) = k^n is isomorphic to k^3 exactly when n = 3. The answer is 3."
          - problem: "Let F be the unique functor from the indiscrete groupoid I to the terminal category 1, and let G be the functor from 1 to I that selects the object 0, so the composite GF sends each object of I to 0. A natural transformation from the identity functor on I to GF assigns one component morphism to each object of I. Find how many components this natural transformation has."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the natural transformation from the identity functor on I to the composite functor GF. Component rule: a natural transformation assigns one component morphism to each object of its source category. Object count: the groupoid I has exactly the two objects 0 and 1. The answer is 2."
          - problem: "A student argues: Step 1: the functor F from Mat_k to FinVect_k with F(n) = k^n is fully faithful, since linear maps from k^m to k^n correspond exactly to n by m matrices. Step 2: F is essentially surjective, since every finite-dimensional vector space has a basis and is isomorphic to some k^n. Step 3: a fully faithful, essentially surjective functor is an equivalence of categories. Step 4: therefore F is an isomorphism of categories. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: linear maps from k^m to k^n correspond exactly to n by m matrices, so F is fully faithful. Step 2 is valid: every finite-dimensional space has a basis, so each is isomorphic to some k^n. Step 3 is valid: that is the characterization theorem for equivalences. Step 4 is invalid: an equivalence need not be bijective on objects, and by counting objects Mat_k and FinVect_k do not even have the same number of objects, so F is not an isomorphism of categories. The answer is Step 4."
          - problem: "The unique functor F from the indiscrete groupoid I to the terminal category 1 is fully faithful and essentially surjective. The groupoid I has the two objects 0 and 1, while the terminal category has a single object. Select the strongest true classification of F, and give the number of objects of I."
            answer: "verdict = equivalence; objects = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["isomorphism"], ["equivalence"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "objects"}]}
            solution_sketch: "The full object is the unique functor F from I to the terminal category 1. Object count: I has two objects and the terminal category has one, so F cannot be bijective on objects, which rules out the stronger classification; the option isomorphism is the error of ignoring the object counts. Characterization theorem: F is fully faithful and essentially surjective, hence it is an equivalence. The answer is verdict = equivalence; objects = 2."
          - problem: "Write the full proof: the indiscrete groupoid I with two objects 0 and 1 and exactly one morphism between each ordered pair of objects is equivalent to the terminal category 1 but not isomorphic to it. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (define the functors): let F send both objects of I to the unique object of 1 and every morphism to the identity, and let G pick the object 0 of I. Step 2 (one composite): FG is exactly the identity functor on 1. Step 3 (build eta): define eta from the identity functor on I to GF by eta_X = the unique morphism from X to 0; each component is an isomorphism because I is a groupoid with exactly one morphism in each hom-set. Step 4 (naturality): every naturality square commutes because I has exactly one morphism between any two objects, so no two parallel morphisms exist. Step 5 (conclusion): eta is a natural isomorphism, so I is equivalent to 1. Step 6 (not isomorphic): counting objects, I has two objects and 1 has one, so no functor between them is bijective on objects; hence they are not isomorphic categories, and the equivalence is strictly weaker than an isomorphism."
    diagnostic_exemplar:
      problem: "Let $(F,G,\\eta,\\varepsilon)$ be an equivalence of categories, with natural isomorphisms $\\eta\\colon 1_{\\mathcal C}\\xRightarrow{\\cong}GF$ and $\\varepsilon\\colon FG\\xRightarrow{\\cong}1_{\\mathcal D}$. Prove that $F$ is faithful and essentially surjective."
      answer: "Essential surjectivity: for any object $D$ of $\\mathcal D$, the component $\\varepsilon_D\\colon FGD\\xrightarrow{\\cong}D$ shows $D\\cong F(GD)$. Faithfulness: naturality of $\\eta$ at $f\\colon A\\to B$ gives $GF(f)\\circ\\eta_A=\\eta_B\\circ f$, so $f=\\eta_B^{-1}\\circ GF(f)\\circ\\eta_A$ — $f$ is recovered from $GF(f)$. If $Ff=Fg$ then $GFf=GFg$, hence $f=g$."
      solution_sketch: "Essential surjectivity is read straight off the components of $\\varepsilon$. For faithfulness, use naturality of $\\eta$ to solve for $f$ in terms of $GF(f)$, namely $f=\\eta_B^{-1}\\circ GF(f)\\circ\\eta_A$, so $Ff=Fg$ forces $f=g$."
