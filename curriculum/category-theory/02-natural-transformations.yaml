    knowledge_points:
      - id: kp1
        name: Componentwise iso implies natural inverse
        key_prerequisites: [natural-transformations]
        constraints: "Require componentwise iso implies natural inverse. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        step_check:
          step: 'cancel $\theta_X$ on the right'
          question: 'Why does composing with $\theta_X^{-1}$ on the right remove $\theta_X$ from $Gf\circ\theta_X$?'
          options:
            - 'Because $Gf$ and $\theta_X^{-1}$ are inverse maps, so their composite vanishes'
            - 'Since $\theta_X\circ\theta_X^{-1}=\mathrm{id}_{GX}$, $Gf$ is unchanged'
            - 'Because $\theta_X^{-1}$ is natural by definition, it moves past $Gf$ freely'
          answer: 'Since $\theta_X\circ\theta_X^{-1}=\mathrm{id}_{GX}$, $Gf$ is unchanged'
          why: 'Since $\theta_X$ is an isomorphism, $\theta_X\circ\theta_X^{-1}=\mathrm{id}_{GX}$, so $(Gf\circ\theta_X)\circ\theta_X^{-1}=Gf$; no inverse of $Gf$ is needed.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ be functors with all four object sets equal to $\{0,1,2\}$, and let $\alpha\colon F\Rightarrow G$ be a natural isomorphism with $\alpha_A$ given by $0\mapsto 1$, $1\mapsto 2$, $2\mapsto 0$ and $\alpha_B$ given by $0\mapsto 2$, $1\mapsto 0$, $2\mapsto 1$. The map $F(u)$ sends $0\mapsto 1$, $1\mapsto 2$, $2\mapsto 0$ and $G(u)$ sends $0\mapsto 2$, $1\mapsto 0$, $2\mapsto 1$. Let $\beta_X=\alpha_X^{-1}$. The two legs of the naturality square of $\beta$ at $u$ send $1\in G(A)$ to the same element of $F(B)$. Which element?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leg $F(u)\circ\beta_A$ sends $1$ to $\beta_A(1)=0$, because $\alpha_A(0)=1$, and then to $F(u)(0)=1$. The leg $\beta_B\circ G(u)$ sends $1$ to $G(u)(1)=0$ and then to $\beta_B(0)=1$, because $\alpha_B(1)=0$. Both legs give $1$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $F=G\colon\mathcal{C}\to\mathbf{Set}$ send $A$ and $B$ to $\{0,1\}$ and $u$ to the identity map. Let $\alpha_A$ be the identity of $\{0,1\}$ and $\alpha_B$ the swap $0\leftrightarrow 1$. Every component of $\alpha$ is a bijection. Is $\alpha$ a natural isomorphism?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is natural", "it is a natural isomorphism", "natural"], ["no", "it is not natural", "it is not a natural isomorphism", "not natural"]]}
            solution_sketch: 'A natural isomorphism must first be a natural transformation, so the naturality square at $u$ must commute. At the element $0$ one leg gives $0$ and the other gives $1$, so the square fails. Bijective components alone are not enough.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $F=G\colon\mathcal{C}\to\mathbf{Set}$ send $A$ and $B$ to $\{0,1,2\}$ and $u$ to the map $0\mapsto 1$, $1\mapsto 2$, $2\mapsto 0$. Let $\alpha_A$ be the identity of $\{0,1,2\}$ and $\alpha_B$ the map $0\mapsto 1$, $1\mapsto 0$, $2\mapsto 2$. What are the values of the two legs $G(u)\circ\alpha_A$ and $\alpha_B\circ F(u)$ of the naturality square at the element $0$?'
            answer: '(1, 0)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The leg $G(u)\circ\alpha_A$ sends $0$ to $\alpha_A(0)=0$ and then to $G(u)(0)=1$. The leg $\alpha_B\circ F(u)$ sends $0$ to $F(u)(0)=1$ and then to $\alpha_B(1)=0$. The legs give $1$ and $0$, which differ.'
          - problem: 'Let $\alpha\colon F\Rightarrow G$ be a natural isomorphism whose component $\alpha_B\colon\mathbb Q\to\mathbb Q$ is $x\mapsto2x$, and let $Gf\colon\mathbb Q\to\mathbb Q$ be $x\mapsto x+3$. Sam wants the composite that applies $Gf$ first and $\alpha_B^{-1}$ second, writes it as $Gf\circ\alpha_B^{-1}$ and gets $5$ at $x=4$. What is the correct value of $\alpha_B^{-1}\circ Gf$ at $4$?'
            answer: '7/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $\alpha_B^{-1}\circ Gf$ applies $Gf$ first, so $Gf(4)=7$. Then $\alpha_B^{-1}(7)=7/2$. Sam applied $\alpha_B^{-1}$ first, which gives $2+3=5$ and is the other composite.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ be functors with all four object sets equal to $\{0,1,2\}$, and let $\alpha\colon F\Rightarrow G$ be a natural isomorphism with $\alpha_A$ given by $0\mapsto 2$, $1\mapsto 0$, $2\mapsto 1$ and $\alpha_B$ given by $0\mapsto 1$, $1\mapsto 2$, $2\mapsto 0$. The map $F(u)$ sends $0\mapsto 2$, $1\mapsto 0$, $2\mapsto 1$. What is $G(u)(2)$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality gives $G(u)=\alpha_B\circ F(u)\circ\alpha_A^{-1}$. Here $\alpha_A^{-1}(2)=0$, then $F(u)(0)=2$, then $\alpha_B(2)=0$. So $G(u)(2)=0$.'
          - problem: 'A warehouse tags each item $x$ of a set $X$ with a flag $0$ or $1$, which gives the set $F(X)=X\times\{0,1\}$. A second system files each item on the left or the right shelf, which gives $G(X)=X\sqcup X$ with elements $L(x)$ and $R(x)$. The maps $\alpha_X(x,0)=L(x)$ and $\alpha_X(x,1)=R(x)$ form a natural isomorphism $F\Rightarrow G$. Let $\beta_X=\alpha_X^{-1}$ and let $f\colon X\to Y$ with $f(5)=9$. The two legs of the naturality square of $\beta$ at $f$ send $R(5)$ to the same element of $Y\times\{0,1\}$. Which element?'
            answer: '(9, 1)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'We have $\beta_X(R(5))=(5,1)$ and $F(f)(5,1)=(f(5),1)=(9,1)$. Also $G(f)(R(5))=R(f(5))=R(9)$ and $\beta_Y(R(9))=(9,1)$. Both legs give the pair $(9,1)$.'
          - problem: 'List reversal $\rho_X\colon L(X)\to L(X)$ is a natural isomorphism from the list functor $L$ to itself, and its inverse is $\rho_X$ itself. Let $L(f)$ apply $f(x)=x+5$ to every entry of a list. The two legs of the naturality square of the inverse at $f$ send the list $[1,2,3]$ to the same list. What is its first entry?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leg $L(f)\circ\rho_X$ reverses $[1,2,3]$ to $[3,2,1]$ and then adds $5$ to each entry, giving $[8,7,6]$. The leg $\rho_Y\circ L(f)$ gives $[6,7,8]$ and then reverses it to $[8,7,6]$. The first entry is $8$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ be functors with all four object sets equal to $\{0,1,2\}$. The map $F(u)$ sends every element to $0$, so it has no inverse. Let $\alpha\colon F\Rightarrow G$ be a natural isomorphism with $\alpha_A$ given by $0\mapsto 2$, $1\mapsto 0$, $2\mapsto 1$ and $\alpha_B$ given by $0\mapsto 1$, $1\mapsto 2$, $2\mapsto 0$, and let $\beta_X=\alpha_X^{-1}$. The two legs of the naturality square of $\beta$ at $u$ send $1\in G(A)$ to the same element of $F(B)$. Which element?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality of $\alpha$ gives $G(u)=\alpha_B\circ F(u)\circ\alpha_A^{-1}$, which sends every element to $\alpha_B(0)=1$, so $G(u)$ is constant with value $1$. The leg $\beta_B\circ G(u)$ sends $1$ to $G(u)(1)=1$ and then to $\beta_B(1)=0$, because $\alpha_B(0)=1$. The leg $F(u)\circ\beta_A$ sends $1$ to $\beta_A(1)=2$ and then to $F(u)(2)=0$. Both legs give $0$, although neither $F(u)$ nor $G(u)$ has an inverse, so the proof of inverse naturality needs no inverse of $F(u)$.'
          - problem: 'Write the full proof that if each component of a natural transformation from a functor $F$ to a functor $G$ is an isomorphism, then the componentwise inverses assemble into a natural transformation from $G$ back to $F$. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (naturality square of $\alpha$): for every arrow $f: A \to B$ in the source category, $Gf \circ \alpha_A = \alpha_B \circ Ff$. Step 2 (precompose): compose both sides on the right with $\alpha_A^{-1}$: $Gf \circ \alpha_A \circ \alpha_A^{-1} = \alpha_B \circ Ff \circ \alpha_A^{-1}$; the left side simplifies to $Gf$, so $Gf = \alpha_B \circ Ff \circ \alpha_A^{-1}$. Step 3 (postcompose): compose both sides on the left with $\alpha_B^{-1}$: $\alpha_B^{-1} \circ Gf = \alpha_B^{-1} \circ \alpha_B \circ Ff \circ \alpha_A^{-1} = Ff \circ \alpha_A^{-1}$. Step 4 (rewrite): with $\beta_A = \alpha_A^{-1}$ and $\beta_B = \alpha_B^{-1}$ this reads $\beta_B \circ Gf = Ff \circ \beta_A$, exactly the naturality square of a transformation $\beta: G \Rightarrow F$. Step 5 (conclusion): $\beta$ is natural, each $\beta_A$ is an isomorphism, and $\beta$ is the inverse of $\alpha$ in both orders, so $\alpha$ is a natural isomorphism.'
      - id: kp2
        name: Natural isomorphisms in practice
