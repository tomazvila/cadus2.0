    knowledge_points:
      - id: kp1
        name: Verifying a naturality square in algebra
        key_prerequisites: [natural-transformations, commutator-subgroup]
        constraints: "Require verifying a naturality square in algebra. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        step_check:
          step: 'because $f$ is a group homomorphism'
          question: 'Why do the two legs of the square agree at every $x$?'
          options:
            - 'Any function between the underlying sets sends inverses to inverses'
            - 'Inversion is its own inverse, so it commutes with every function'
            - 'A group homomorphism preserves inverses, so $f(x^{-1})=f(x)^{-1}$'
          answer: 'A group homomorphism preserves inverses, so $f(x^{-1})=f(x)^{-1}$'
          why: 'The legs are $f(x^{-1})$ and $f(x)^{-1}$, and a homomorphism satisfies $f(x^{-1})=f(x)^{-1}$; a bare function would not.'
        exemplars:
          - problem: 'Let $U\colon\mathbf{Mon}\to\mathbf{Set}$ be the forgetful functor on monoids, and for each monoid $M$ let $s_M\colon UM\to UM$ send $x$ to $x\cdot x$, the square of $x$. Take $M=N=\mathbb{Z}/5$ as an additive monoid, so the square of $x$ is $x+x \bmod 5$, and let $f\colon M\to N$ be the homomorphism $f(x)=2x \bmod 5$. Chase $x=2$ around the naturality square for $s$ at $f$. What common value do both legs give in $\mathbb{Z}/5$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leg $s_N\circ f$ sends $2$ to $f(2)=4$ and then to $4+4=8\equiv 3 \pmod 5$. The leg $f\circ s_M$ sends $2$ to $2+2=4$ and then to $f(4)=8\equiv 3 \pmod 5$. Both legs give $3$.'
          - problem: 'Let $U\colon\mathbf{Grp}\to\mathbf{Set}$ be the forgetful functor, and for each group $G$ let $s_G\colon UG\to UG$ send $x$ to $x^2$. The map $s_G$ is not a group homomorphism when $G$ is not abelian. Is $s$ a natural transformation $U\Rightarrow U$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is natural", "natural", "it is a natural transformation"], ["no", "it is not natural", "not natural", "it is not a natural transformation"]]}
            solution_sketch: 'A component of a transformation $U\Rightarrow U$ only has to be a function, since the target category is $\mathbf{Set}$. For a homomorphism $f$ we have $f(x^2)=f(x)^2$, so the naturality square commutes for every $f$. Hence $s$ is natural even though no component is a homomorphism in general.'
          - problem: 'Let $U\colon\mathbf{Grp}\to\mathbf{Set}$ be the forgetful functor, and for each group $G$ let $c_G\colon UG\to UG$ send $x$ to $x^3$. Take $G=H=\mathbb{Z}/7$ as an additive group, so $x^3$ means $x+x+x \bmod 7$, and let $f\colon G\to H$ be the homomorphism $f(x)=3x \bmod 7$. Chase $x=2$ around the naturality square for $c$ at $f$. What common value do both legs give in $\mathbb{Z}/7$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leg $c_H\circ f$ sends $2$ to $f(2)=6$ and then to $6+6+6=18\equiv 4 \pmod 7$. The leg $f\circ c_G$ sends $2$ to $2+2+2=6$ and then to $f(6)=18\equiv 4 \pmod 7$. Both legs give $4$.'
          - problem: 'For abelian groups, written additively, let $Q(G)=G/2G$ and let $q_G\colon G\to Q(G)$ be the quotient map. For a homomorphism $f\colon G\to H$ define $Q(f)$ by sending the class of $x$ to the class of $f(x)$. To see that this is well defined, suppose $x^\prime=x+2z$. Then $f(x^\prime)-f(x)=k\cdot f(z)$ for which integer $k$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $f$ is a homomorphism, $f(x^\prime)-f(x)=f(2z)=f(z)+f(z)=2f(z)$. Hence $k=2$, and $f(x^\prime)-f(x)$ lies in $2H$, so the class of $f(x)$ does not depend on the choice of $x$.'
          - problem: 'Let $\mathrm{ab}\colon\mathbf{Grp}\to\mathbf{Grp}$ send a group $G$ to $G/[G,G]$, and let $\eta_G\colon G\to G^{\mathrm{ab}}$ be the quotient map. Take $G=S_3$, $H=\mathbb{Z}/2$ (written additively, so $H^{\mathrm{ab}}=H$ and $\eta_H$ is the identity) and the sign homomorphism $f\colon S_3\to\mathbb{Z}/2$ with $f(\text{transposition})=1$. Chase the transposition $(1\,2)$ around the naturality square of $\eta$ at $f$. What common value do both legs give in $\mathbb{Z}/2$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One leg is $\eta_H\circ f$, which sends $(1\,2)$ to $f(1\,2)=1$ and then to $1$ because $\eta_H$ is the identity. The other leg is $\mathrm{ab}(f)\circ\eta_G$, which sends $(1\,2)$ to its class and then to the class of $f(1\,2)=1$. Both legs give $1$.'
          - problem: 'The hours of a clock are the elements of $\mathbb{Z}/12$, and a doubling machine sends an hour $x$ to $2x$. A coarser clock with four hours is $\mathbb{Z}/4$, and reduction $f(x)=x \bmod 4$ converts one clock to the other and is a homomorphism. For the hour $4$, doubling then converting gives the same value as converting then doubling on the coarse clock. What is that value?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Doubling $4$ on the twelve-hour clock gives $8$, and converting gives $8 \bmod 4=0$. Converting $4$ gives $0$, and doubling on the coarse clock gives $0$. Both orders give $0$.'
          - problem: 'Days of the week are numbered by $\mathbb{Z}/7$. Tripling a day number is the map $c(x)=3x \bmod 7$, and a rescheduling is the homomorphism $f(x)=5x \bmod 7$ from $\mathbb{Z}/7$ to $\mathbb{Z}/7$. Tripling then rescheduling gives the same day as rescheduling then tripling. Which day results from the day number $2$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Tripling $2$ gives $6$, and rescheduling gives $5\cdot 6=30\equiv 2 \pmod 7$. Rescheduling $2$ gives $10\equiv 3$, and tripling gives $9\equiv 2 \pmod 7$. Both orders give day $2$.'
          - problem: 'Let $V\colon\mathbf{Mon}\to\mathbf{Set}$ send a monoid to its set of units, with the inclusion $i_M\colon V(M)\to U(M)$. Let $f\colon(\mathbb{Z},\cdot)\to(\mathbb{Z}/7,\cdot)$ be reduction modulo $7$. The integer $x=-1$ is a unit of $(\mathbb{Z},\cdot)$ with inverse $y=-1$. What is the product $f(x)f(y)$ in $\mathbb{Z}/7$, showing that $f(x)$ is again a unit?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $f(-1)=6$ in $\mathbb{Z}/7$, so $f(x)f(y)=6\cdot 6=36\equiv 1 \pmod 7$. The product is the identity, so $f(x)$ is a unit with inverse $f(y)$. Hence $f$ restricts to a function $V(\mathbb{Z})\to V(\mathbb{Z}/7)$.'
          - problem: 'Write the full proof that for the abelianization functor $\mathrm{ab}$ from $\mathbf{Grp}$ to $\mathbf{Grp}$ the quotient maps $\eta_G\colon G\to G^{\mathrm{ab}}$ form a natural transformation from the identity functor on $\mathbf{Grp}$ to $\mathrm{ab}$. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (well-definedness): a homomorphism f from G to H sends the commutator xyx^{-1}y^{-1} to f(x)f(y)f(x)^{-1}f(y)^{-1}, a commutator of H, so f maps [G,G] into [H,H]; hence ab(f), defined by g[G,G] maps to f(g)[H,H], is well defined on cosets. Step 2 (functoriality): identities and composites of homomorphisms descend to the quotients in the same way, so ab is a functor from Grp to Grp, as is the identity. Step 3 (the chase): fix g in G; one leg gives ab(f)(eta_G(g)) = ab(f)(g[G,G]) = f(g)[H,H], and the other leg gives eta_H(f(g)) = f(g)[H,H], using the definition of the quotient map and of ab(f). Step 4 (conclusion): both legs of the naturality square send g to f(g)[H,H], so the square commutes at every f, and eta is a natural transformation from the identity functor to ab.'
      - id: kp2
        name: Naturality is closed under composition
        key_prerequisites: [diagram-chasing]
        constraints: "Require naturality is closed under composition. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        step_check:
          step: 'Its square says $Hf\circ\psi_A=\psi_B\circ Gf$'
          question: 'Why can $Hf\circ\psi_A$ be replaced by $\psi_B\circ Gf$ in this step?'
          options:
            - 'Functoriality of $H$ turns the factor $Hf$ into $Gf$ before the composition'
            - 'Naturality of $\psi$ at $f$ is the equation $Hf\circ\psi_A=\psi_B\circ Gf$'
            - 'Associativity lets the factors $\psi_A$ and $Gf$ trade places in the composite'
          answer: 'Naturality of $\psi$ at $f$ is the equation $Hf\circ\psi_A=\psi_B\circ Gf$'
          why: 'The naturality square of $\psi\colon G\Rightarrow H$ at $f$ states that going across then down equals going down then across, which is this equation.'
        exemplars:
          - problem: 'Let $\alpha\colon F\Rightarrow G$ and $\beta\colon G\Rightarrow H$ be natural transformations between functors $\mathcal{C}\to\mathcal{D}$, and let $f\colon A\to B$ be a morphism of $\mathcal{C}$. Using the naturality of $\beta$ at $f$ once, and nothing else, which composite is equal to $Hf\circ\beta_A\circ\alpha_A$?'
            answer: 'β_B∘Gf∘α_A'
            answer_contract: {"kind": "label", "options": [["β_B∘Gf∘α_A", "β_B Gf α_A", "beta_B Gf alpha_A", "βB∘Gf∘αA", "βB Gf αA", "β_B∘G(f)∘α_A", "$\\beta_B\\circ Gf\\circ\\alpha_A$", "beta_B∘Gf∘alpha_A"], ["β_A∘Hf∘α_A", "β_A Hf α_A"], ["β_B∘α_B∘Ff", "β_B α_B Ff"]]}
            solution_sketch: 'The naturality square of $\beta$ at $f$ states $Hf\circ\beta_A=\beta_B\circ Gf$. Replacing $Hf\circ\beta_A$ by $\beta_B\circ Gf$ turns the composite into $\beta_B\circ Gf\circ\alpha_A$. The composite $\beta_B\circ\alpha_B\circ Ff$ needs the naturality of $\alpha$ as well, so it takes a second step.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $\alpha\colon F\Rightarrow G$ and $\beta\colon G\Rightarrow H$ be natural transformations between functors $\mathcal{C}\to\mathbf{Set}$ with $F(A)=F(B)=H(A)=H(B)=\{1,2,3\}$. The map $F(u)$ sends $1\mapsto 2$, $2\mapsto 3$, $3\mapsto 1$, and $H(u)$ sends $1\mapsto 3$, $2\mapsto 1$, $3\mapsto 2$. The composite $\beta\alpha$ has $(\beta\alpha)_A$ given by $1\mapsto 3$, $2\mapsto 2$, $3\mapsto 1$. What is $(\beta\alpha)_B(3)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite is natural, so $(\beta\alpha)_B(F(u)(x))=H(u)((\beta\alpha)_A(x))$. Choose $x=2$, so that $F(u)(2)=3$ and $(\beta\alpha)_A(2)=2$. Then $(\beta\alpha)_B(3)=H(u)(2)=1$.'
          - problem: 'In a program, `single` turns a value $x$ into the list $[x]$ and `twice` turns a list $[x_1,\dots,x_n]$ into $[x_1,x_1,\dots,x_n,x_n]$. Both are natural, so their composite is natural. Let $f(x)=2x$ on $\{1,2,3\}$, applied to every entry of a list. Applying `single`, then `twice`, then $f$ gives the same list as applying $f$ first. For the value $3$, what is the sum of the entries of that list?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The route `single` then `twice` turns $3$ into $[3,3]$, and applying $f$ gives $[6,6]$. The route that applies $f$ first gives $6$, then $[6]$, then $[6,6]$. Both routes give $[6,6]$, whose entries sum to $12$.'
          - problem: 'Sam proves that the vertical composite $\beta\alpha$ of natural transformations $\alpha\colon F\Rightarrow G$ and $\beta\colon G\Rightarrow H$ is natural. Sam writes: Step 1: for $f\colon A\to B$ we must show $Hf\circ(\beta\alpha)_A=(\beta\alpha)_B\circ Ff$. Step 2: naturality of $\beta$ gives $Hf\circ\beta_A=\beta_B\circ Gf$. Step 3: naturality of $\alpha$ gives $Gf\circ\alpha_A=\alpha_B\circ Ff$. Step 4: combining, $Hf\circ\beta_A\circ\alpha_A=\beta_A\circ\alpha_B\circ Ff$, so the composite is natural. Which step is the first that is not valid, and why?'
            answer: 'Step 4: the combination must end in beta_B after alpha_B after Ff; beta_A after alpha_B is not defined, since alpha_B ends at G(B).'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Steps 1, 2 and 3 are valid. In Step 4 the combination gives $\beta_B\circ Gf\circ\alpha_A=\beta_B\circ\alpha_B\circ Ff$, so the leftmost factor must be $\beta_B$. The expression $\beta_A\circ\alpha_B$ is not even defined, since the target of $\alpha_B$ is $G(B)$, not $G(A)$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $\alpha\colon F\Rightarrow G$ and $\beta\colon G\Rightarrow H$ be natural transformations between functors $\mathcal{C}\to\mathbf{Set}$ with $F(A)=\{1,2,3\}$, $F(B)=\{1,2\}$, $H(A)=\{10,20,30\}$, $H(B)=\{10,20\}$. The map $F(u)$ sends $1\mapsto 1$, $2\mapsto 2$, $3\mapsto 2$, and $H(u)$ sends $10\mapsto 10$, $20\mapsto 20$, $30\mapsto 20$. The composite has $(\beta\alpha)_A$ given by $1\mapsto 10$, $2\mapsto 20$, $3\mapsto 30$. What is $(\beta\alpha)_B(2)$?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Naturality of the composite at $u$ gives $(\beta\alpha)_B(F(u)(x))=H(u)((\beta\alpha)_A(x))$. Take $x=2$, so that $F(u)(2)=2$ and $(\beta\alpha)_A(2)=20$. Then $(\beta\alpha)_B(2)=H(u)(20)=20$.'
          - problem: 'In a program, `twice` turns a list $[x_1,\dots,x_n]$ into $[x_1,x_1,\dots,x_n,x_n]$ and `reverse` reverses a list. Both are natural, so their composite is natural. Let $f(x)=x+10$ be applied to every entry of a list. Applying `twice` then `reverse` and then $f$ gives the same list as applying $f$ first. For the list $[1,2,3]$, what is the first entry of that list?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The route `twice` then `reverse` turns $[1,2,3]$ into $[3,3,2,2,1,1]$, and applying $f$ gives $[13,13,12,12,11,11]$. The route that applies $f$ first gives $[11,12,13]$, then $[11,11,12,12,13,13]$, then the reverse $[13,13,12,12,11,11]$. The first entry is $13$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $\alpha\colon F\Rightarrow G$ and $\beta\colon G\Rightarrow H$ be natural transformations between functors $\mathcal{C}\to\mathbf{Set}$ with $F(A)=\{1,2,3\}$, $F(B)=\{1,2\}$, $H(A)=\{4,5,6\}$ and $H(B)=\{4,5\}$. The map $F(u)$ sends $1\mapsto 1$, $2\mapsto 2$, $3\mapsto 1$, and $H(u)$ sends $4\mapsto 4$, $5\mapsto 5$, $6\mapsto 4$. The composite $\beta\alpha$ has $(\beta\alpha)_A$ given by $1\mapsto 5$, $2\mapsto 4$, $3\mapsto 5$. What is $(\beta\alpha)_B(1)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite is natural, so $(\beta\alpha)_B(F(u)(x))=H(u)((\beta\alpha)_A(x))$. Choose $x=1$, so that $F(u)(1)=1$ and $(\beta\alpha)_A(1)=5$. Then $(\beta\alpha)_B(1)=H(u)(5)=5$.'
          - problem: 'Write the full proof that if $\alpha\colon F\Rightarrow G$ and $\beta\colon G\Rightarrow H$ are natural transformations, then the vertical composite $\beta\circ\alpha$, with components $(\beta\circ\alpha)_A=\beta_A\circ\alpha_A$, is again a natural transformation. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Set (beta after alpha)_A = beta_A after alpha_A for each object A. Goal: for every arrow f: A -> B, show Hf after (beta after alpha)_A = (beta after alpha)_B after Ff. Step 1 (expand the left side): Hf after (beta_A after alpha_A). Step 2 (naturality of beta at f, cited once): Hf after beta_A = beta_B after Gf, so the chain becomes beta_B after Gf after alpha_A. Step 3 (naturality of alpha at f, cited once): Gf after alpha_A = alpha_B after Ff, so the chain becomes beta_B after alpha_B after Ff. Step 4 (regroup): beta_B after alpha_B after Ff = (beta after alpha)_B after Ff, which is the right side of the goal. The two naturality squares paste along their common side Gf into one rectangle whose top edge is the component at A and whose bottom edge is the component at B, so the composite is natural.'
      - id: kp3
        name: Recognizing when a family is NOT natural
        key_prerequisites: [natural-transformations]
        constraints: "Require the learner to use recognizing when a family is not natural. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        step_check:
          step: 'These element-selecting maps are enough to expose the failure'
          question: 'Why is it enough to test the square at maps $1\to A$ that select one element?'
          options:
            - 'One failing square at a single map already shows the family is not natural'
            - 'Natural transformations are determined by their values on one-point sets only'
            - 'Element-selecting maps are the only maps allowed between two sets'
          answer: 'One failing square at a single map already shows the family is not natural'
          why: 'Naturality requires every square to commute, so a single map at which the legs differ is a counterexample.'
        exemplars:
          - problem: 'A family of functions $\alpha_A\colon A\to A$ is the identity on every set except the set $\{0,1\}$, where it swaps $0$ and $1$. It is claimed to be a natural transformation from the identity functor on $\mathbf{Set}$ to itself. Let $1=\{*\}$. What is the least number of elements a set $A$ can have so that the naturality square at some map $1\to A$ fails?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For a map $\mathrm{sel}\colon 1\to A$ with $\mathrm{sel}(*)=a$ the square asks $\alpha_A(a)=a$, since $\alpha_1$ is the identity. This fails exactly when $\alpha_A$ moves an element. A set with $0$ or $1$ elements is never moved, and the set $\{0,1\}$ with $2$ elements is, so the least number is $2$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$, and let $F,G\colon\mathcal{C}\to\mathbf{Set}$ be functors with all four object sets equal to $\{0,1,2\}$. Both $F(u)$ and $G(u)$ send $0\mapsto 1$, $1\mapsto 2$, $2\mapsto 0$. A family has $\alpha_A$ given by $0\mapsto 0$, $1\mapsto 2$, $2\mapsto 1$ and $\alpha_B$ equal to the identity. Find the least $x$ in $F(A)$ at which the naturality square at $u$ fails.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The square asks $G(u)(\alpha_A(x))=\alpha_B(F(u)(x))$. At $x=0$ both sides equal $1$. At $x=1$ the left side is $G(u)(2)=0$ and the right side is $F(u)(1)=2$, so the least failing input is $1$.'
          - problem: 'For each nonempty set $A$ a family sends $a$ to $\alpha_A(a)=A\setminus\{a\}$, and it is claimed to be a natural transformation from the identity functor to the power-set functor $\mathcal{P}$. Let $1=\{*\}$ and test the square at $\mathrm{sel}\colon 1\to\{0,1,2,3\}$ with $\mathrm{sel}(*)=0$. How many elements does $\alpha_A(\mathrm{sel}(*))$ have, and how many does $\mathcal{P}(\mathrm{sel})(\alpha_1(*))$ have?'
            answer: '(3, 0)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The first leg is $\alpha_A(0)=A\setminus\{0\}=\{1,2,3\}$, which has $3$ elements. The second leg starts from $\alpha_1(*)=1\setminus\{*\}=\emptyset$, and the image of the empty set is empty, so it has $0$ elements. The legs differ, so the family is not natural.'
          - problem: 'Sam proposes that sending each vector $v$ of a real inner product space $V$ to the function taking $w$ to the inner product of $v$ and $w$ is a natural transformation from the identity functor to the dual functor. Sam argues: Step 1: the identity functor and the dual functor have the same source category and the same target category. Step 2: each component function is linear. Step 3: for every linear $f\colon V\to W$ the naturality square at $f$ must commute. Step 4: for $f(x,y)=(x+y,y)$ and $v=(0,1)$, both composites send $w$ to the same number, so the family is natural. Which step is the first that is not valid, and why?'
            answer: 'Step 1: the dual functor reverses the direction of maps, so it is contravariant, while the identity functor is covariant; their sources differ.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'The dual functor reverses the direction of maps, so it is contravariant, while the identity functor is covariant. They do not have the same source and target categories, so no transformation between them exists. The argument fails at Step 1, before any square is tested.'
          - problem: 'A program sorts a list of numbers into increasing order, and another program recodes every entry of a list with $f(1)=3$, $f(2)=1$, $f(3)=2$. On the list $[1,2,3]$, what is the first entry of the list obtained by sorting and then recoding, and what is the first entry of the list obtained by recoding and then sorting?'
            answer: '(3, 1)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'Sorting $[1,2,3]$ leaves it unchanged, and recoding gives $[3,1,2]$ with first entry $3$. Recoding first gives $[3,1,2]$, and sorting gives $[1,2,3]$ with first entry $1$. The two orders differ, so sorting is not natural.'
          - problem: 'A tool counts how many distinct entries a list has. A recoding $f$ sends $1\mapsto 7$, $2\mapsto 7$, $3\mapsto 8$ and is applied to every entry of a list. For the list $[1,2,3]$, by how much does the number of distinct entries before recoding exceed the number after recoding?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The list $[1,2,3]$ has $3$ distinct entries. The recoded list $[7,7,8]$ has $2$ distinct entries. The difference is $1$, so counting before and after recoding give different results and the count is not natural.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B$ and one non-identity morphism $u\colon A\to B$, and let $F,G\colon\mathcal{C}\to\mathbf{Set}$ be functors with all four object sets equal to $\{0,1,2\}$. The map $F(u)$ sends $0\mapsto 1$, $1\mapsto 2$, $2\mapsto 0$ and $G(u)$ sends $0\mapsto 2$, $1\mapsto 0$, $2\mapsto 1$. A family has $\alpha_A$ equal to the identity and $\alpha_B$ given by $0\mapsto 0$, $1\mapsto 2$, $2\mapsto 0$. Find the least $x$ in $F(A)$ at which the naturality square at $u$ fails.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The square asks $G(u)(\alpha_A(x))=\alpha_B(F(u)(x))$. At $x=0$ both sides equal $2$, and at $x=1$ both sides equal $0$. At $x=2$ the left side is $G(u)(2)=1$ and the right side is $\alpha_B(F(u)(2))=\alpha_B(0)=0$, so the least failing input is $2$.'
          - problem: 'Write the full proof that for every set $A$ with at least two elements, the map sending each element $a$ to the subset $A$ with $\{a\}$ removed does not form a natural transformation from the identity functor to the power-set functor on $\mathbf{Set}$. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Setup: let 1 = {*} be a one-point set, let A be any set with at least two elements, choose p and q in A with p different from q, and let sel: 1 -> A be the element-selecting map with sel(*) = p; write alpha_A(a) = A with {a} removed. Step 1, one leg of the square at sel: alpha_1(*) is the empty set, because removing the single point from 1 leaves nothing, and the image of the empty set under P(sel) is still the empty set. Step 2, the other leg: alpha_A(sel(*)) = alpha_A(p) = A with {p} removed, which contains q, so it is not empty. Step 3, compare: the empty set does not equal a set that contains q, so the naturality square at sel does not commute. Conclusion: for every set A with at least two elements the square fails at the element-selecting map, so the family is not a natural transformation from the identity functor to the powerset functor on Set.'
    diagnostic_exemplar:
      problem: "Let $U\\colon\\mathbf{Grp}\\to\\mathbf{Set}$ be the forgetful functor. Prove that the inversion maps $i_G\\colon UG\\to UG$, $x\\mapsto x^{-1}$, form a natural transformation $i\\colon U\\Rightarrow U$."
      answer: "Fix a homomorphism $f\\colon G\\to H$; the square asks $Uf\\circ i_G=i_H\\circ Uf$. Chase $x\\in UG$: one leg gives $f(x^{-1})$, the other $f(x)^{-1}$. A group homomorphism preserves inverses ($f(x)f(x^{-1})=f(xx^{-1})=f(e)=e$ and symmetrically), so $f(x^{-1})=f(x)^{-1}$; the legs agree at every $x$, the square commutes for every $f$, and $i$ is natural. (Each $i_G$ is only a function, not a homomorphism — naturality asks no more.)"
      solution_sketch: "Chase $x\\in UG$ around the square: one leg gives $f(x^{-1})$, the other $f(x)^{-1}$. The crux is that a homomorphism preserves inverses; note the components need only be functions, since the square lives in $\\mathbf{Set}$."
    anki_seeds:
      - front: "Standard way to prove a componentwise composite of natural transformations is natural?"
        back: "Paste (stack) the two naturality squares and use associativity."
        type: basic
      - front: "Why is there no natural isomorphism $1\\Rightarrow(-)^*$ on $\\mathbf{Vect}$?"
        back: "$(-)^*$ is contravariant, so $1\\Rightarrow(-)^*$ is not even well-typed."
        type: basic
      - front: "Why is the double-dual map $V\\to V^{**}$ natural?"
        back: "$(-)^{**}$ is covariant and $v\\mapsto\\mathrm{ev}_v$ satisfies the naturality square."
        type: basic

  - id: natural-isomorphisms
    name: Natural Isomorphisms
