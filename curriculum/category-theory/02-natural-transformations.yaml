      - id: kp1
        name: Whiskering on the left by a functor
        key_prerequisites: [naturality-proofs]
        constraints: "Require whiskering on the left by a functor. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Let alpha:F=>G have component alpha_A=[1,0] between two-element zero-based sets. Let P be the direct-image powerset functor. Construct the A-component of the left whiskering P alpha, deriving its domain and arrow action. Encode subsets by masks0,1,2,3 and give its complete value list."
            answer: "0, 2, 1, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Left whiskering applies the outside functor to each component arrow. Applying its subset action constructs the entire new component. The resulting answer is 0, 2, 1, 3."
          - problem: "Let alpha:F=>G be natural and H:D->E a functor. Prove naturality of H alpha at f:X->Y. Starting with H(Gf)H(alpha_X), combine the images, rewrite using alpha naturality, then split again. Encode Ff=1,Gf=2,alpha_X=3,alpha_Y=4. Give the two arrow codes inside H after the rewrite, followed by the two underlying arrow codes whose H-images form the final composite. Use conventional composition order."
            answer: "4, 1, 4, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Functoriality first combines the two H-images. Naturality replaces Gf alpha_X with alpha_Y Ff, and the composition law of H then separates the final two images. The resulting answer is 4, 1, 4, 1."
          - problem: "Given alpha:F=>G with component alpha_A=[2,0]:{0,1}->{0,1,2}, construct (H alpha)_A for the product-square functor H:Set->Set, H(X)=X x X. Derive the whiskered source and target and give its complete value list, ordering input pairs lexicographically and encoding output(u,v) by3u+v."
            answer: "8, 6, 2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The outside functor acts on the component arrow, yielding a map HFA->HGA. Its two coordinate maps are forced by the product projections. The resulting answer is 8, 6, 2, 0."
          - problem: "Let C be the category with objects A, B and one arrow f: A -> B besides identities. Let F, G: C -> Set with F(A) = {0}, F(B) = {1}, F(f): 0 -> 1, and G(A) = {5}, G(B) = {7}, G(f): 5 -> 7. Let alpha: F => G with alpha_A: 0 -> 5 and alpha_B: 1 -> 7. Let M: Set -> Set send each set X to X with one extra element * added, and each function g to the function that agrees with g on X and sends * to *. The whiskering M alpha: MF => MG has components (M alpha)_A = M(alpha_A). Evaluate both sides of the naturality equation for M alpha at f, on the element 0 of MF(A). Give the common value."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "State the typing: M alpha goes from MF to MG, with components M(alpha_A). Left side at 0: (M alpha)_A(0) = 5, then MG(f)(5) = 7. Right side at 0: MF(f)(0) = 1, then (M alpha)_B(1) = 7. The two sides agree because M applied to the naturality square of alpha still commutes, as M respects composition. The common value is 7."
          - problem: "Let alpha: F => G be a natural transformation between functors F, G: C -> D, and let H: D -> E be a functor. A student defines the whiskering and checks its naturality in four steps. Step 1: for each object A of C, set (H alpha)_A = H(alpha_A). Step 2: since alpha_A goes from FA to GA, the arrow H(alpha_A) goes from HFA to HGA. Step 3: therefore H alpha is a transformation from FH to GH. Step 4: naturality at f: A -> B requires HG(f) composed with (H alpha)_A to equal (H alpha)_B composed with HF(f). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it is the definition of the component of the whiskering. Step 2 is valid: applying H to an arrow FA to GA gives an arrow HFA to HGA. Step 3 is not valid: the domain of H alpha is the composite HF, not FH, and the codomain is HG, not GH. Step 4 is valid: it states the naturality equation in the correct order. The first invalid step is Step 3."
          - problem: "Let alpha:F=>G be natural between Set-valued functors, and let H:Set->Set be the functor that takes each set to its set of two-element ordered tuples. At object X, alpha_X has values [2,0] from {0,1} to {0,1,2}. Construct the component of the left whiskering H alpha from the definition, and give its values on inputs (0,0),(0,1),(1,0),(1,1), encoding output (u,v) by 3u+v. Then give the size of its domain and of its codomain; no whiskering-component formula is supplied."
            answer: "8, 6, 2, 0, 4, 9"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Left whiskering applies H to the component arrow and to its source and target. The tuple functor acts coordinatewise, giving a map from four source tuples to nine target tuples, with the computed encoded values. The resulting answer is 8, 6, 2, 0, 4, 9."
          - problem: "Write the full proof: given a natural transformation alpha: F => G between functors F, G: C -> D and a functor H: D -> E, the whiskering H alpha: HF => HG with components (H alpha)_A = H(alpha_A) is a natural transformation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1, domain and codomain: for each object A of C, the component alpha_A is an arrow FA to GA in D, so applying H gives an arrow HFA to HGA in E; hence the family H alpha goes from the composite functor HF to the composite functor HG, and this typing is stated before naturality. Step 2, naturality: take any arrow f: A -> B in C. Naturality of alpha gives alpha_B composed with F(f) equals G(f) composed with alpha_A. Apply the functor H to this equation; since H respects composition of arrows, HG(f) composed with H(alpha_A) equals H(alpha_B) composed with HF(f). Step 3, conclusion: this is exactly the naturality equation for the components (H alpha)_A, so H alpha: HF => HG is a natural transformation."
      - id: kp2
        name: Whiskering on the right by a functor
        key_prerequisites: [natural-transformations]
        constraints: "Right whiskering re-indexes components; never apply a functor to $\\alpha_A$ here."
        exemplars:
          - problem: "Let $\\mathcal{C}$ be the discrete category with objects $c_1, c_2$, and let $F, G\\colon\\mathcal{C}\\to\\mathbf{Set}$ with $F(c_1)=\\{0,1\\}\\times\\{0,1\\}$, $G(c_1)=\\{0,1\\}$, $F(c_2)=\\{5,6,7\\}\\times\\{5,6,7\\}$, $G(c_2)=\\{5,6,7\\}$. Let $\\alpha\\colon F\\Rightarrow G$ have components $\\alpha_{c_1}(x,y)=x$ and $\\alpha_{c_2}(x,y)=y$. Let $\\mathcal{B}$ be the discrete category with objects $b, b'$, and let $K\\colon\\mathcal{B}\\to\\mathcal{C}$ send $b\\mapsto c_1$ and $b'\\mapsto c_2$. Compute $(\\alpha K)_{b'}(6,5)$."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $(\\alpha K)_{b'}(6,5)$. Rule of right whiskering: $(\\alpha K)_{b'}=\\alpha_{K(b')}$, the component of $\\alpha$ re-indexed at $K(b')$, with no functor applied to it. Re-index: $K(b')=c_2$, so $(\\alpha K)_{b'}=\\alpha_{c_2}$, the map $(x,y)\\mapsto y$. Evaluate: $\\alpha_{c_2}(6,5)=5$. The answer is 5."
          - problem: "Let $\\mathcal{C}$ be the discrete category with objects $c_1, c_2$, and let $F, G, H\\colon\\mathcal{C}\\to\\mathbf{Set}$ each send both objects to the set $\\{0,1,2,3\\}$. Let $\\alpha\\colon F\\Rightarrow G$ have $\\alpha_{c_1}(x)=(x+1)\\bmod 4$ and $\\alpha_{c_2}(x)=(x+3)\\bmod 4$, and let $\\beta\\colon G\\Rightarrow H$ have $\\beta_{c_1}(x)=(2x)\\bmod 4$ and $\\beta_{c_2}(x)=(3x)\\bmod 4$. Let $\\mathcal{B}$ be the one-object category with object $\\bullet$, and let $K\\colon\\mathcal{B}\\to\\mathcal{C}$ send $\\bullet\\mapsto c_2$. Compute $((\\beta K)\\cdot(\\alpha K))_{\\bullet}(2)$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is $((\\beta K)\\cdot(\\alpha K))_{\\bullet}(2)$. Rule of right whiskering: $(\\alpha K)_{\\bullet}=\\alpha_{K\\bullet}=\\alpha_{c_2}$ and $(\\beta K)_{\\bullet}=\\beta_{c_2}$; no functor is applied to a component. Rule of vertical composition: the composite component at $\\bullet$ is $\\beta_{c_2}\\circ\\alpha_{c_2}$. Evaluate: $\\alpha_{c_2}(2)=(2+3)\\bmod 4=1$, then $\\beta_{c_2}(1)=(3\\cdot 1)\\bmod 4=3$. The answer is 3."
          - problem: "Let $\\mathcal{B}$ be the category with objects $b, b'$ and one arrow $g\\colon b\\to b'$, and let $K\\colon\\mathcal{B}\\to\\mathbf{Set}$ with $K(b)=K(b')=\\{0,1,2\\}$ and $K(g)=h$ where $h(0)=1$, $h(1)=2$, $h(2)=0$. Let $F(X)=X\\times X$ and $G(X)=X\\times X$ be functors $\\mathbf{Set}\\to\\mathbf{Set}$, and let $\\alpha\\colon F\\Rightarrow G$ have the swap components $\\alpha_X(x,y)=(y,x)$. Give the value $((GK)(g)\\circ(\\alpha K)_b)(2,1)$ as (x, y)."
            answer: "(2,0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full object is $((GK)(g)\\circ(\\alpha K)_b)(2,1)$, the left side of the naturality square of $\\alpha K$ at $g$. Rule of right whiskering: $(\\alpha K)_b=\\alpha_{Kb}$, the swap $(x,y)\\mapsto(y,x)$ on $\\{0,1,2\\}\\times\\{0,1,2\\}$. Apply it: swap$(2,1)=(1,2)$. Rule of functor composition: $(GK)(g)=G(K(g))=G(h)=h\\times h$. Apply it: $(h(1),h(2))=(2,0)$. The answer is (2,0)."
          - problem: "Let $\\mathcal{B}$ be the category with objects $b, b'$ and one arrow $g\\colon b\\to b'$, and let $K\\colon\\mathcal{B}\\to\\mathbf{Set}$ with $K(b)=\\{0,1\\}$, $K(b')=\\{0,1,2\\}$ and $K(g)$ the inclusion $j$ with $j(0)=0$, $j(1)=1$. Let $F(X)=X$ and $G(X)=X\\times X$ be functors $\\mathbf{Set}\\to\\mathbf{Set}$, and let $\\alpha\\colon F\\Rightarrow G$ have the diagonal components $\\alpha_X(x)=(x,x)$. Give the value $((\\alpha K)_{b'}\\circ(FK)(g))(1)$ as (x, y)."
            answer: "(1,1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The full object is $((\\alpha K)_{b'}\\circ(FK)(g))(1)$, the right side of the naturality square of $\\alpha K$ at $g$. Rule of functor composition: $(FK)(g)=F(K(g))=F(j)=j$. Apply it: $j(1)=1$. Rule of right whiskering: $(\\alpha K)_{b'}=\\alpha_{Kb'}$, the diagonal $x\\mapsto(x,x)$ on $\\{0,1,2\\}$. Apply it: diagonal$(1)=(1,1)$. The answer is (1,1)."
          - problem: "Let $\\mathcal{C}$ be the discrete category with objects $c_1, c_2, c_3$, and let $F, G\\colon\\mathcal{C}\\to\\mathbf{Set}$ each send every object to $\\{0,1,2,3,4\\}$. Let $\\alpha\\colon F\\Rightarrow G$ have components $\\alpha_{c_1}(x)=x$, $\\alpha_{c_2}(x)=(x+1)\\bmod 5$, $\\alpha_{c_3}(x)=(x+2)\\bmod 5$. Let $\\mathcal{B}$ be the discrete category with objects $1,2,3$, and let $K\\colon\\mathcal{B}\\to\\mathcal{C}$ send $1\\mapsto c_1$, $2\\mapsto c_1$, $3\\mapsto c_2$. A student claims $(\\alpha K)_n=\\alpha_{c_n}$ for each object $n$ of $\\mathcal{B}$. Determine the smallest $n$ for which the claimed component and the true whiskered component give different values at the input $0$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule of right whiskering: $(\\alpha K)_n=\\alpha_{K(n)}$, the component re-indexed by $K$; no functor is applied. Compute the re-indexing: $K(1)=c_1$, $K(2)=c_1$, $K(3)=c_2$. Compare at input $0$: for $n=1$ both the claim and the truth give $\\alpha_{c_1}(0)=0$, so the claim holds there; for $n=2$ the true component gives $\\alpha_{c_1}(0)=0$ while the claim gives $\\alpha_{c_2}(0)=1$, so it fails. The smallest such $n$ is 2, so the answer is 2."
          - problem: "Claim: for every arrow $g\\colon b\\to b'$ in $\\mathcal{B}$, the whiskered transformation $\\alpha K\\colon FK\\Rightarrow GK$ is natural at $g$. Step 1: the goal is the square $(GK)(g)\\circ(\\alpha K)_b=(\\alpha K)_{b'}\\circ(FK)(g)$. Step 2: by the definition of right whiskering, $(\\alpha K)_b=\\alpha_{Kb}$ and $(\\alpha K)_{b'}=\\alpha_{Kb'}$. Step 3: since $K$ is a functor, we may apply it to the component and write $(\\alpha K)_b=K(\\alpha_b)$. Step 4: substituting $K(\\alpha_b)$ into the goal, the square commutes by functoriality of $K$. Select the first step that is not valid."
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it states the naturality goal for $\\alpha K$ correctly. Step 2 is valid: right whiskering re-indexes components, $(\\alpha K)_b=\\alpha_{Kb}$, and applies no functor. Step 3 is the first invalid step: whiskering never applies a functor to a component, and $\\alpha_b$ is not even defined, since $b$ is an object of $\\mathcal{B}$ while $\\alpha$ has components at objects of $\\mathcal{C}$. Step 4 rests on the invalid Step 3, and functoriality of $K$ alone does not give naturality, but the first failure comes earlier. The answer is Step 3."
          - problem: "Write the full proof: for functors $F,G\\colon\\mathcal{C}\\to\\mathcal{D}$ and $K\\colon\\mathcal{B}\\to\\mathcal{C}$, define the right whiskering $\\alpha K$ of a natural transformation $\\alpha\\colon F\\Rightarrow G$ and prove that $\\alpha K\\colon FK\\Rightarrow GK$ is natural. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Definition step: for each object $b$ of $\\mathcal{B}$ set $(\\alpha K)_b=\\alpha_{Kb}\\colon (FK)(b)\\to(GK)(b)$; right whiskering only re-indexes the component and applies no functor. Naturality step: take any arrow $g\\colon b\\to b'$ in $\\mathcal{B}$. By the definition of composed functors, $(FK)(g)=F(Kg)$ and $(GK)(g)=G(Kg)$. Naturality of $\\alpha$ at the arrow $Kg\\colon Kb\\to Kb'$ of $\\mathcal{C}$ gives $G(Kg)\\circ\\alpha_{Kb}=\\alpha_{Kb'}\\circ F(Kg)$. Substitute the whiskered components: this equation reads $(GK)(g)\\circ(\\alpha K)_b=(\\alpha K)_{b'}\\circ(FK)(g)$, which is exactly the naturality square of $\\alpha K$ at $g$. Since the square commutes for every arrow $g$, $\\alpha K\\colon FK\\Rightarrow GK$ is a natural transformation."
