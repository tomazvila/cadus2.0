unit: natural-transformations
course: category-theory
module: "Natural Transformations"
topics:
  - id: naturality-square
    name: The Naturality Square
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: functors
        weight: 0.5
        key: true
      - id: commutative-diagrams
        weight: 0.5
        key: true
      - id: functor-composition-identity
        weight: 0.2
      - id: diagram-chasing
        weight: 0.2
      - id: category-definition
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Components and their types
        key_prerequisites: [functors]
        constraints: "Require components and their types. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        step_check:
          step: 'There are two objects, so there are two components'
          question: 'Why does $\alpha$ consist of exactly two functions in this example?'
          options:
            - 'One function is needed for each element of $F2$, and $F2$ has exactly two elements'
            - 'One function per object of $\mathcal{C}$, and $\mathcal{C}$ has two objects'
            - 'One function is needed for each functor, and there are two functors, $F$ and $G$'
          answer: 'One function per object of $\mathcal{C}$, and $\mathcal{C}$ has two objects'
          why: 'A natural transformation attaches one morphism $\alpha_X\colon FX\to GX$ to each object $X$ of the source category, so the objects of $\mathcal{C}$ are counted.'
        try_first:
          problem: 'A category $\mathcal{C}$ has four objects and twelve morphisms in all. A natural transformation between two functors from $\mathcal{C}$ to $\mathbf{Set}$ is built from how many functions?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'There is one function for each object of the source category, so the four objects give four functions. The twelve morphisms do not add components; they only impose conditions on how the components fit together.'
        exemplars:
          - problem: 'Let $\mathcal{C}$ be the category with objects $A$, $B$, $C$ and non-identity morphisms $u\colon A\to B$, $v\colon B\to C$ and their composite $vu\colon A\to C$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ be functors and let $\alpha\colon F\Rightarrow G$ be a natural transformation. How many components does $\alpha$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A natural transformation has one component for each object of the source category, not for each morphism. The category $\mathcal{C}$ has the objects $A$, $B$ and $C$, so $\alpha$ has $3$ components: $\alpha_A$, $\alpha_B$ and $\alpha_C$.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B,C,D,E$ and non-identity morphisms $u\colon A\to B$, $v\colon B\to C$ and their composite from $A$ to $C$. Let $F,G\colon\mathcal{C}\to\mathcal{D}$ be functors and $\alpha\colon F\Rightarrow G$ a natural transformation. How many components does $\alpha$ have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The components are indexed by the objects of $\mathcal{C}$, so the number of morphisms does not matter. The objects $D$ and $E$ carry no non-identity morphism but still each need a component, so $\alpha$ has $5$ components.'
          - problem: 'Let $\mathcal{C}$ be the category with two objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $P$ be the chain $0<1<2$ viewed as a category: there is a morphism from $x$ to $y$ exactly when $x\le y$, and it is unique. Let $F,G\colon\mathcal{C}\to P$ be the functors with $F(A)=0$, $F(B)=2$, $G(A)=1$, $G(B)=2$. How many natural transformations $F\Rightarrow G$ are there?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The component at $A$ is a morphism $0\to 1$ and the component at $B$ is a morphism $2\to 2$. Each exists and is unique in the poset $P$, and the naturality square at $u$ commutes because $P$ has at most one morphism from $0$ to $2$. So there is exactly $1$ natural transformation.'
          - problem: 'Let $\mathcal{C}$ be the category with objects $A,B,C$ and non-identity morphisms $u\colon A\to B$, $v\colon B\to C$ and their composite. Let $\mathcal{D}$ be the chain $0<1<2<3<4$ viewed as a category. Let $F,G\colon\mathcal{C}\to\mathcal{D}$ be the functors with $F(A)=1$, $F(B)=2$, $F(C)=4$ and $G(A)=1$, $G(B)=3$, $G(C)=4$. What are the source and the target of the component $\alpha_B$ of a natural transformation $\alpha\colon F\Rightarrow G$?'
            answer: '(2, 3)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The component at an object $X$ is a morphism of $\mathcal{D}$ from $F(X)$ to $G(X)$. At $B$ we have $F(B)=2$ and $G(B)=3$, so $\alpha_B$ is the morphism from $2$ to $3$, with source $2$ and target $3$.'
          - problem: 'Let $\mathcal{C}$ be the chain $1<2<3<4$ and $P$ the chain $0<1<2$, both viewed as categories with a morphism from $x$ to $y$ exactly when $x\le y$. Let $F,G\colon\mathcal{C}\to P$ send $1,2,3,4$ to $0,2,2,2$ for $F$ and to $0,1,1,2$ for $G$. Find the least object $i$ of $\mathcal{C}$ at which no component $F(i)\to G(i)$ exists, so that there is no natural transformation $F\Rightarrow G$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A component at $i$ is a morphism $F(i)\to G(i)$ in $P$, which exists exactly when $F(i)\le G(i)$. At $i=1$ we have $0\le 0$, so the component exists. At $i=2$ we have $2\le 1$, which is false, so the least object with no component is $2$.'
          - problem: 'Let $\mathcal{C}$ be the category with two objects $A,B$ and one non-identity morphism $u\colon A\to B$. Let $F,G\colon\mathcal{C}\to\mathbf{Set}$ be functors with $F(A)=\{1,2\}$, $F(B)=\{1,2,3,4\}$, $G(A)=\{5,6,7\}$, $G(B)=\{5\}$; the map $F(u)$ sends $1$ and $2$ to themselves, and $G(u)$ sends $5$, $6$, $7$ to $5$. The component $\alpha_B$ of a natural transformation $\alpha\colon F\Rightarrow G$ is a function. How many elements does its domain have, and how many does its codomain have?'
            answer: '(4, 1)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The component $\alpha_B$ is a function from $F(B)$ to $G(B)$. The set $F(B)=\{1,2,3,4\}$ has $4$ elements and $G(B)=\{5\}$ has $1$ element. The maps $F(u)$ and $G(u)$ play no part in the type of $\alpha_B$.'
          - problem: 'A database stores, for each finite set $X$ of customers, the set $F(X)$ of ordered pairs of customers and the set $G(X)$ of customers each marked either gold or silver. A natural transformation $\alpha\colon F\Rightarrow G$ has a component at the set $X$ of three customers. How many elements does the domain of $\alpha_X$ have, and how many does its codomain have?'
            answer: '(9, 6)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The component $\alpha_X$ is a function from $F(X)$ to $G(X)$. There are $3\cdot 3=9$ ordered pairs of customers, so the domain has $9$ elements. Each of the $3$ customers is marked gold or silver, so the codomain has $3\cdot 2=6$ elements.'
          - problem: 'Sam writes a program in which $F$ sends a type $T$ to the lists over $T$ and $G$ sends $T$ to the optional values over $T$ (a value of $T$ or nothing). Sam says that a component $\alpha_T$ of a natural transformation $\alpha\colon F\Rightarrow G$ may go from $G(T)$ to $F(T)$ if that is more convenient. Is Sam right? Explain.'
            answer: 'No: the component at T of a natural transformation F to G is a morphism from F(T) to G(T), here from lists to optional values.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'The component of $\alpha\colon F\Rightarrow G$ at $T$ is a morphism $F(T)\to G(T)$, from lists to optional values. A map from $G(T)$ to $F(T)$ would be a component of a transformation $G\Rightarrow F$ instead. So Sam is not right.'
          - problem: 'Write the full proof that for parallel functors $F,G\colon\mathcal{C}\to P$ into a poset $P$ viewed as a category, there is exactly one natural transformation $F\Rightarrow G$ when $F(A)\le G(A)$ holds for every object $A$ of $\mathcal{C}$, and none otherwise. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Proof. Step 1 (type every component first): for each object $A$ of $\mathcal{C}$, a component must be a morphism $\alpha_A\colon F(A) \to G(A)$ in $P$. Step 2 (hom sets of a poset): a poset viewed as a category has exactly one morphism from $x$ to $y$ when $x \le y$, and none when $x \le y$ fails. Step 3 (pointwise existence): hence a component at $A$ exists exactly when $F(A) \le G(A)$, and when it exists it is unique, with no choice involved. Step 4 (count): if $F(A) \le G(A)$ fails at even one object, no family of components exists and there is no natural transformation; if it holds at every object, the family of all components exists and is the only possible one. Step 5 (naturality is automatic): for any arrow $f\colon A \to B$ of $\mathcal{C}$, functoriality gives $F(A) \le F(B)$ and $G(A) \le G(B)$, so transitivity yields $F(A) \le G(B)$; both legs of the naturality square are morphisms from $F(A)$ to $G(B)$ in $P$, and a poset has at most one morphism between two given objects, so the two legs are equal. Step 6 (uniqueness): any two transformations $F \Rightarrow G$ have the same forced component at every object, hence they are equal. Conclusion: there is exactly one natural transformation $F \Rightarrow G$ when $F(A) \le G(A)$ for every object $A$, and none otherwise. $\square$'
      - id: kp2
        name: Writing and reading the square
        key_prerequisites: [commutative-diagrams]
        constraints: "Require writing and reading the square. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        step_check:
          step: 'across then down is $Gf\circ\alpha_A$'
          question: 'Why is the path that goes across then down written $Gf\circ\alpha_A$, with $\alpha_A$ on the right?'
          options:
            - 'A functor image is always written first, before any component of $\alpha$'
            - 'The component $\alpha_A$ is the larger map, so larger maps stand on the right'
            - 'Maps are written right to left, so the map applied first stands on the right'
          answer: 'Maps are written right to left, so the map applied first stands on the right'
          why: 'In $Gf\circ\alpha_A$ the map $\alpha_A$ is applied first, taking $FA$ to $GA$, and then $Gf$ takes $GA$ to $GB$.'
        exemplars:
          - problem: 'Let $t\colon F\Rightarrow G$ be a natural transformation between functors $F,G\colon C\to D$, and let $f\colon A\to B$ be a morphism in $C$. The naturality square at $f$ has the corners $F(A)$ top-left, $G(A)$ top-right, $F(B)$ bottom-left, $G(B)$ bottom-right. Its top edge is the component $t_A\colon F(A)\to G(A)$, its left edge is $Ff$ and its right edge is $Gf$. Which morphism runs along the bottom edge?'
            answer: 't_B'
            answer_contract: {"kind": "label", "options": [["t_B", "α_B", "alpha_B", "the component at B", "tB", "t_{B}", "$t_B$", "the component t_B"], ["t_A", "α_A", "alpha_A"], ["Ff", "F(f)"], ["Gf", "G(f)"]]}
            solution_sketch: 'The bottom edge runs from the corner $F(B)$ to the corner $G(B)$. A morphism from $F(B)$ to $G(B)$ is the component of $t$ at $B$, so the bottom edge is $t_B$. The names $t_A$, $Ff$ and $Gf$ belong to the top, left and right edges.'
          - problem: 'Let $F=\mathrm{Id}$ and let $G=\mathcal{P}$ be the power-set functor on $\mathbf{Set}$, with $\alpha_X(x)=\{x\}$. Take $f\colon A\to B$ with $A=\{1,2,3\}$ and $B=\{x,y\}$. The right edge of the naturality square at $f$ is the function $\mathcal{P}(f)\colon\mathcal{P}(A)\to\mathcal{P}(B)$. How many elements does its domain have, and how many does its codomain have?'
            answer: '(8, 4)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The right edge is $Gf=\mathcal{P}(f)$, a function from $\mathcal{P}(A)$ to $\mathcal{P}(B)$. A set with $3$ elements has $2^3=8$ subsets, so the domain has $8$ elements. A set with $2$ elements has $2^2=4$ subsets, so the codomain has $4$ elements.'
          - problem: 'In a program, $L(f)$ applies the function $f$ to every entry of a list, and $\rho_X$ reverses a list of entries from $X$. Take $f\colon\{1,2,3\}\to\{5,7\}$ with $f(1)=5$, $f(2)=7$, $f(3)=5$. The two legs of the naturality square of $\rho$ at $f$, namely $L(f)\circ\rho_X$ and $\rho_Y\circ L(f)$, send the list $[1,2,3]$ to the same list. What is its first entry?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leg $L(f)\circ\rho_X$ reverses to $[3,2,1]$ and then applies $f$, giving $[5,7,5]$. The leg $\rho_Y\circ L(f)$ applies $f$ to get $[5,7,5]$ and then reverses, which is the same list. Its first entry is $5$.'
          - problem: 'Let $\mathcal{C}$ be the chain $1<2<3$ and $\mathcal{D}$ the chain $0<1<2<3<4<5$, both viewed as categories with a morphism from $x$ to $y$ exactly when $x\le y$. Let $F,G\colon\mathcal{C}\to\mathcal{D}$ send $1,2,3$ to $0,2,4$ for $F$ and to $1,3,5$ for $G$, and let $\alpha\colon F\Rightarrow G$ be a natural transformation. In the naturality square of $\alpha$ at the morphism $1\to 3$, what are the source and the target of the bottom edge?'
            answer: '(4, 5)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'The corners of the square are $F(1)$, $G(1)$ on top and $F(3)$, $G(3)$ below. The bottom edge is the component $\alpha_3\colon F(3)\to G(3)$. Since $F(3)=4$ and $G(3)=5$, its source is $4$ and its target is $5$.'
          - problem: 'In a program, $L(X)$ is the set of lists over $X$ and the length of a list is a natural number. The length maps $\ell_X\colon L(X)\to\mathbb{N}$ form a natural transformation from $L$ to the constant functor $\mathbb{N}$, which sends every map to the identity of $\mathbb{N}$. Take $f\colon\{1,2,3\}\to\{7,8,9\}$ with $f(x)=x+6$. The two legs of the naturality square at $f$ send the list $[1,2,3,1]$ to the same number. What is it?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One leg applies $f$ to every entry, giving $[7,8,9,7]$, and then takes the length, which is $4$. The other leg takes the length of $[1,2,3,1]$, which is also $4$, and then applies the identity of $\mathbb{N}$. Both legs give $4$.'
          - problem: 'Sam writes the naturality equation of $\alpha\colon F\Rightarrow G$ at $f\colon A\to B$ as $Gf\circ\alpha_B=\alpha_A\circ Ff$. Does this equation make sense, that is, are both composites defined?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it makes sense", "they are defined"], ["no", "it does not make sense", "not defined", "they are not defined", "it is not defined"]]}
            solution_sketch: 'The composite $Gf\circ\alpha_B$ needs the target of $\alpha_B$, which is $G(B)$, to be the source of $Gf$, which is $G(A)$. These objects differ in general, so the left side is not defined. The correct equation is $Gf\circ\alpha_A=\alpha_B\circ Ff$.'
          - problem: 'Write the full proof that a family $\alpha=(\alpha_A)$ with $\alpha_A\colon F(A)\to G(A)$ for functors $F,G\colon C\to D$ is natural at a morphism $f\colon A\to B$ exactly when the square with the sides $\alpha_A$, $Ff$, $Gf$, $\alpha_B$ commutes, that is, when $Gf\circ\alpha_A=\alpha_B\circ Ff$. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1 (corners): place $F(A)$ top-left, $G(A)$ top-right, $F(B)$ bottom-left, $G(B)$ bottom-right, since $F$ and $G$ send the objects $A$ and $B$ to these four objects. Step 2 (label the sides, before writing any equation): the top edge is the component $\alpha_A: F(A) \to G(A)$; the left edge is $Ff: F(A) \to F(B)$, the image of $f$ under $F$; the right edge is $Gf: G(A) \to G(B)$; the bottom edge is $\alpha_B: F(B) \to G(B)$. Step 3 (paths): the two directed paths from $F(A)$ to $G(B)$ are the composite $Gf \circ \alpha_A$, going across then down, and the composite $\alpha_B \circ Ff$, going down then across. Step 4 (equation): the square commutes exactly when these two composites are equal, and that equality, $Gf \circ \alpha_A = \alpha_B \circ Ff$, is precisely the condition that $\alpha$ is natural at $f$. Hence the labeled square states naturality at $f$.'
      - id: kp3
        name: Checking a square elementwise in Set
        key_prerequisites: [diagram-chasing]
        constraints: "Require the learner to use checking a square elementwise in set. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        step_check:
          step: 'take a general element $(x,y)\in X\times X$'
          question: 'Why is the square checked on a general element rather than on one chosen pair?'
          options:
            - 'One pair shows agreement there only, but every pair must agree'
            - 'A chosen pair is not allowed because set elements have no names'
            - 'A general element makes each leg give a single number only'
          answer: 'One pair shows agreement there only, but every pair must agree'
          why: 'Two functions are equal only if they agree on every element of the source, so the legs must be compared on an arbitrary $(x,y)$.'
        exemplars:
          - problem: 'Let $P(X)=X\times X$ with $P(f)=f\times f$, and let $\pi_X\colon P(X)\to X$ be given by $\pi_X(x,y)=x$. Take $f\colon\{1,2,3\}\to\{5,7\}$ with $f(1)=5$, $f(2)=7$, $f(3)=5$. The two legs of the naturality square of $\pi$ at $f$, namely $f\circ\pi_X$ and $\pi_Y\circ P(f)$, send the pair $(2,3)$ to the same element of $\{5,7\}$. Which element?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The leg $f\circ\pi_X$ sends $(2,3)$ to $f(2)=7$. The leg $\pi_Y\circ P(f)$ sends $(2,3)$ to $(f(2),f(3))=(7,5)$ and then keeps the first coordinate, which is $7$. Both legs give $7$.'
          - problem: 'For each set $X$ choose an element $c_X$ and put $t_X(x)=(x,c_X)$, a candidate transformation from the identity functor to $P$, where $P(X)=X\times X$ and $P(g)=g\times g$. Take $X=\{1,2,3\}$ with $c_X=2$, $Y=\{4,5,6\}$ with $c_Y=6$, and $f\colon X\to Y$ with $f(1)=4$, $f(2)=5$, $f(3)=5$. What is $P(f)(t_X(3))$?'
            answer: '(5, 5)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'First $t_X(3)=(3,c_X)=(3,2)$. Then $P(f)(3,2)=(f(3),f(2))=(5,5)$. The other leg, $t_Y(f(3))=(5,6)$, differs in the second coordinate.'
          - problem: 'For each set $X$ choose an element $c_X$ and put $t_X(x)=(x,c_X)$, a candidate transformation from the identity functor to $P$, where $P(X)=X\times X$ and $P(g)=g\times g$. Take $X=\{1,2,3\}$ with $c_X=3$, $Y=\{4,5,6\}$ with $c_Y=5$, and $f\colon X\to Y$ with $f(1)=4$, $f(2)=5$, $f(3)=6$. Does the naturality square of $t$ at $f$ commute?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it commutes", "it does commute", "it is natural", "natural"], ["no", "it does not commute", "it fails", "it is not natural", "not natural"]]}
            solution_sketch: 'One leg gives $P(f)(t_X(1))=P(f)(1,3)=(4,6)$. The other leg gives $t_Y(f(1))=t_Y(4)=(4,5)$. The two results differ, so the square fails at $1$, it does not commute, and $t$ is not natural.'
          - problem: 'A list program has a function `head` that returns the first entry of a nonempty list, and a function that applies $f(x)=2x+3$ to every entry of a list. On the list $[3,1,2]$, applying `head` first and then $f$ gives the same number as applying $f$ to every entry first and then `head`. What is that number?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Taking `head` first gives $3$, and then $f(3)=2\cdot 3+3=9$. Applying $f$ first gives the list $[9,5,7]$, whose first entry is $9$. Both orders give $9$.'
          - problem: 'A league table stores each match as a pair (home score, away score). The function swap reverses a pair, and the function $g$ converts a score to points with $g(0)=0$, $g(1)=1$, $g(2)=1$, $g(3)=3$; converting a match converts both scores. Swapping then converting, or converting then swapping, gives the same pair for the match $(3,1)$. What is that pair?'
            answer: '(1, 3)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'Swapping $(3,1)$ gives $(1,3)$, and converting gives $(g(1),g(3))=(1,3)$. Converting $(3,1)$ first gives $(3,1)$, and swapping gives $(1,3)$. Both orders give the pair $(1,3)$.'
          - problem: 'Let $P(X)=X\times X$ with $P(f)=f\times f$ and let $\epsilon_X\colon P(X)\to P(X)$ be given by $\epsilon_X(x,y)=(y,y)$. Is $\epsilon$ a natural transformation from $P$ to $P$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is natural", "natural", "it is a natural transformation"], ["no", "it is not natural", "not natural"]]}
            solution_sketch: 'For $f\colon X\to Y$ and a general pair $(x,y)$ the leg $\epsilon_Y\circ P(f)$ gives $\epsilon_Y(f(x),f(y))=(f(y),f(y))$. The leg $P(f)\circ\epsilon_X$ gives $P(f)(y,y)=(f(y),f(y))$. The two legs agree for every pair, so $\epsilon$ is natural.'
          - problem: 'Let $P(X)=X\times X$ with $P(f)=f\times f$ and let $\epsilon_X(x,y)=(y,y)$. Take $f\colon\{1,2\}\to\{7,9\}$ with $f(1)=7$, $f(2)=9$. Both legs of the naturality square of $\epsilon$ at $f$ send the pair $(1,2)$ to the same pair. What is it?'
            answer: '(9, 9)'
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: 'One leg gives $\epsilon_Y(f(1),f(2))=\epsilon_Y(7,9)=(9,9)$. The other leg gives $P(f)(\epsilon_X(1,2))=P(f)(2,2)=(9,9)$. Both legs give $(9,9)$.'
          - problem: 'Write the full proof that the family $\mathrm{pr}$, given by $\mathrm{pr}_X(u,v)=v$, is a natural transformation from the functor $P$ with $P(X)=X\times X$ and $P(g)(u,v)=(g(u),g(v))$ to the identity functor on $\mathbf{Set}$, checking the naturality square elementwise on a general pair. Then compare with the solution.'
            answer: 'See the solution.'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Setup: for a map $f\colon X\to Y$ the naturality square requires $f\circ\mathrm{pr}_X=\mathrm{pr}_Y\circ P(f)$ as functions $X\times X\to Y$. Elementwise check on a general pair $(u,v)$ of $X\times X$. Left leg: $\mathrm{pr}_X(u,v)=v$ by the definition of the projection, then applying $f$ gives $f(v)$. Right leg: $P(f)(u,v)=(f(u),f(v))$ by the action of $P$ on maps, then $\mathrm{pr}_Y(f(u),f(v))=f(v)$. Conclusion: both legs send the general pair $(u,v)$ to $f(v)$, so the two composites are equal as functions, the square commutes for every $f$, and $\mathrm{pr}$ is a natural transformation from $P$ to the identity functor.'
    diagnostic_exemplar:
      problem: "Let $S\\colon\\mathbf{Set}\\to\\mathbf{Set}$ be the functor $X\\mapsto X\\sqcup X$, $f\\mapsto f\\sqcup f$, and let $\\iota_X\\colon X\\to X\\sqcup X$ be the left inclusion. Write the naturality square for $\\iota$ at $f\\colon X\\to Y$ and verify it elementwise."
      answer: "The square asks $(f\\sqcup f)\\circ\\iota_X=\\iota_Y\\circ f$. On $x\\in X$: the left leg puts $x$ in the left copy and applies $f$ there, giving the left-copy element $f(x)$; the right leg applies $f$ and then includes into the left copy, also giving left-copy $f(x)$. The two legs agree at every $x$, so the square commutes for every $f$ and $\\iota\\colon 1_{\\mathbf{Set}}\\Rightarrow S$ is natural."
      solution_sketch: "Write the square with legs $Sf=f\\sqcup f$ and $\\iota$, then chase a single $x\\in X$ both ways round; each route produces $f(x)$ in the left copy. That the copy-label matches is the entire content of naturality here."
    anki_seeds:
      - front: "The component of $\\alpha\\colon F\\Rightarrow G$ at an object $A$ has what type?"
        back: "$\\alpha_A\\colon FA\\to GA$ (a morphism of the target category)."
        type: basic
      - front: "The naturality square for $\\alpha$ at $f\\colon A\\to B$ commutes: {{c1::$Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$}}."
        back: "$Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$"
        type: cloze
      - front: "Why must $F$ and $G$ be parallel functors for $\\alpha\\colon F\\Rightarrow G$ to make sense?"
        back: "so each component $\\alpha_A\\colon FA\\to GA$ is typable and $Ff$, $Gf$ point the same way."
        type: basic

