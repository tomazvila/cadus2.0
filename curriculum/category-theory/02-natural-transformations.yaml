    knowledge_points:
      - id: kp1
        name: Componentwise iso implies natural inverse
        key_prerequisites: [natural-transformations]
        constraints: "Require componentwise iso implies natural inverse. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Let alpha:F=>G have inverse components beta_X,beta_Y,and f:X->Y. Derive naturality of beta from Gf alpha_X=alpha_Y Ff by composing with the appropriate inverse components. Encode Ff=1,Gf=2,beta_X=3,beta_Y=4. Give the two sides of the resulting equation as four codes in conventional composition order, putting the side beginning Ff first. No inverse of Ff or Gf is assumed."
            answer: "1, 3, 4, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Compose the original square with beta_X on the right and beta_Y on the left. The inverse equations cancel both alpha components and leave exactly the beta naturality equation. The resulting answer is 1, 3, 4, 2."
          - problem: "In the inverse-naturality proof, the arrow f:X->Y may have noninvertible images. Decide1/0 for these necessary steps: invert alpha_X; invert Ff; invert alpha_Y; invert Gf. The requirement is whether the general proof needs that inverse, not whether one may exist in a special example."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The inverse family is built from the alpha components and the original square is conjugated by their inverses. A constant functor arrow demonstrates that no inverse of Ff or Gf is required. The resulting answer is 1, 0, 1, 0."
          - problem: "Assume alpha natural and beta_X=alpha_X^{-1}. First express Gf using alpha_Y,Ff,beta_X by the original square. Then simplify after left-composing that expression with beta_Y. Encode Ff=1,Gf=2,beta_X=3,beta_Y=4,alpha_Y=5. Give the first three-arrow word followed by the simplified two-arrow word, in conventional composition order."
            answer: "5, 1, 3, 1, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The original square gives Gf=alpha_Y Ff beta_X. The inverse equation beta_Y alpha_Y=id then yields the two-arrow expression Ff beta_X. The resulting answer is 5, 1, 3, 1, 3."
          - problem: "Claim: if every component of a natural transformation $\\alpha: F \\Rightarrow G$ is an isomorphism, then the inverses form a natural transformation $G \\Rightarrow F$. Step 1: naturality of $\\alpha$ gives $Gf \\circ \\alpha_A = \\alpha_B \\circ Ff$ for every arrow $f: A \\to B$. Step 2: precompose both sides with $\\alpha_A^{-1}$, so $Gf = \\alpha_B \\circ Ff \\circ \\alpha_A^{-1}$. Step 3: postcompose both sides of the Step 2 equation with $\\alpha_B^{-1}$, so $Gf \\circ \\alpha_B^{-1} = Ff \\circ \\alpha_A^{-1}$. Step 4: rewrite this as naturality of $\\beta$ with $\\beta_A = \\alpha_A^{-1}$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 states the naturality square of $\\alpha$, which holds by hypothesis, so Step 1 is valid. Step 2 precomposes with $\\alpha_A^{-1}$ and cancels $\\alpha_A \\circ \\alpha_A^{-1}$ against the identity, a valid move since $\\alpha_A$ is an isomorphism, so Step 2 is valid. Step 3 is the first invalid step: postcomposing $Gf = \\alpha_B \\circ Ff \\circ \\alpha_A^{-1}$ with $\\alpha_B^{-1}$ gives $Gf \\circ \\alpha_B^{-1} = \\alpha_B \\circ Ff \\circ \\alpha_A^{-1} \\circ \\alpha_B^{-1}$, which does not simplify to $Ff \\circ \\alpha_A^{-1}$; the correct move composes on the left, giving $\\alpha_B^{-1} \\circ Gf = Ff \\circ \\alpha_A^{-1}$. Step 4 is only a rewrite of the earlier line, so it is not the first failure. The answer is Step 3."
          - problem: "A student assumes a family of isomorphisms is automatically natural and therefore its inverse family is natural. Test this on the walking arrow, F=G with both arrow maps id on{0,1}, alpha_X=id,alpha_Y=swap. Give 1/0 for alpha_X invertible, alpha_Y invertible, alpha natural, and its componentwise inverse family natural. This checks the indispensable hypothesis of the inverse theorem."
            answer: "1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Componentwise invertibility does not establish the original square. With identity arrow maps, naturality requires equal endpoint components; both this family and its inverse violate that requirement. The resulting answer is 1, 1, 0, 0."
          - problem: "Let alpha:F=>G be natural with inverse components beta_X. Derive the naturality equation of beta at f:X->Y without assuming F(f) invertible. Start with beta_Y G(f) alpha_X beta_X, use alpha naturality, and then cancel the adjacent component inverse pair. Encode beta_Y=1,G(f)=2,alpha_X=3,beta_X=4,alpha_Y=5,F(f)=6. Give the word immediately after the naturality substitution and the word after cancellation, concatenated. Explain why this proves the inverse family natural."
            answer: "1, 5, 6, 4, 6, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Since alpha_X beta_X is an identity, the starting word equals beta_Y G(f). Naturality rewrites its middle factors, and beta_Y alpha_Y cancels, leaving F(f) beta_X, the required inverse square. The resulting answer is 1, 5, 6, 4, 6, 4."
          - problem: "Write the full proof: if each component of a natural transformation from a functor $F$ to a functor $G$ is an isomorphism, then the componentwise inverses assemble into a natural transformation from $G$ back to $F$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (naturality square of $\\alpha$): for every arrow $f: A \\to B$ in the source category, $Gf \\circ \\alpha_A = \\alpha_B \\circ Ff$. Step 2 (precompose): compose both sides on the right with $\\alpha_A^{-1}$: $Gf \\circ \\alpha_A \\circ \\alpha_A^{-1} = \\alpha_B \\circ Ff \\circ \\alpha_A^{-1}$; the left side simplifies to $Gf$, so $Gf = \\alpha_B \\circ Ff \\circ \\alpha_A^{-1}$. Step 3 (postcompose): compose both sides on the left with $\\alpha_B^{-1}$: $\\alpha_B^{-1} \\circ Gf = \\alpha_B^{-1} \\circ \\alpha_B \\circ Ff \\circ \\alpha_A^{-1} = Ff \\circ \\alpha_A^{-1}$. Step 4 (rewrite): with $\\beta_A = \\alpha_A^{-1}$ and $\\beta_B = \\alpha_B^{-1}$ this reads $\\beta_B \\circ Gf = Ff \\circ \\beta_A$, exactly the naturality square of a transformation $\\beta: G \\Rightarrow F$. Step 5 (conclusion): $\\beta$ is natural, each $\\beta_A$ is an isomorphism, and $\\beta$ is the inverse of $\\alpha$ in both orders, so $\\alpha$ is a natural isomorphism."
      - id: kp2
        name: Natural isomorphisms in practice
        key_prerequisites: [naturality-proofs]
        constraints: "Require the learner to use natural isomorphisms in practice. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Build a concrete natural isomorphism and its natural inverse. On the arrow category A->B, functors F,G take all four object values to {0,...,1}. Their arrow values are F(u)=[1, 0], G(u)=[1, 0]. A natural transformation alpha has components alpha_A=[1, 0],alpha_B=[1, 0]. Construct the inverse transformation by solving both component inverse equations and verify its naturality square. Give beta_A followed by beta_B."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Invert each component and use the original commuting square to obtain the reversed square. The searched equations verify both naturality and the two transformation identities. The resulting answer is 1, 0, 1, 0."
          - problem: "In $\\mathbf{Set}$ let $1 = \\{*\\}$. Take $X = \\{1, 2, 3, 4\\}$ and $Y = \\{1, 2\\}$, and let $g: X \\to Y$ send $1 \\mapsto 2$, $2 \\mapsto 1$, $3 \\mapsto 2$, $4 \\mapsto 1$. Let $f: 1 \\to X$ be the map with $f(*) = 3$. The naturality square for $\\theta: \\mathrm{Hom}(1, -) \\Rightarrow \\mathrm{Id}$ compares $g \\circ \\theta_X$ with $\\theta_Y \\circ \\mathrm{Hom}(1, g)$. Compute the element of $Y$ that both sides give on input $f$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full square: $\\theta_Y \\circ \\mathrm{Hom}(1, g) = g \\circ \\theta_X$, where $\\mathrm{Hom}(1, g)$ postcomposes with $g$. Top side: $\\theta_X(f) = f(*) = 3$, then $g(3) = 2$. Bottom side: $\\mathrm{Hom}(1, g)(f) = g \\circ f$, then $\\theta_Y(g \\circ f) = (g \\circ f)(*) = g(3) = 2$. Both sides give the same element, so the square commutes on $f$. The answer is 2."
          - problem: "Use the commuting square to validate the practical inverse construction. On the arrow category A->B, functors F,G take all four object values to {0,...,2}. Their arrow values are F(u)=[2, 0, 1], G(u)=[0, 1, 2]. A natural transformation alpha has components alpha_A=[2, 1, 0],alpha_B=[1, 0, 2]. Construct the inverse transformation by solving both component inverse equations and verify its naturality square. Give beta_A followed by beta_B."
            answer: "2, 1, 0, 1, 0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Invert each component and use the original commuting square to obtain the reversed square. The searched equations verify both naturality and the two transformation identities. The resulting answer is 2, 1, 0, 1, 0, 2."
          - problem: "A student proposes a natural transformation from the identity functor on $\\mathbf{Set}$ to itself whose component $\\alpha_X: X \\to X$ swaps the two smallest elements of $X$ and fixes every other element. Take $X = \\{1, 2, 3\\}$ and let $g: X \\to X$ send $1 \\mapsto 2$, $2 \\mapsto 3$, $3 \\mapsto 1$. Give the smallest $x$ in $X$ for which $g(\\alpha_X(x))$ and $\\alpha_X(g(x))$ differ."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the component on $X = \\{1,2,3\\}$: $\\alpha(1) = 2$, $\\alpha(2) = 1$, $\\alpha(3) = 3$. Test the naturality square at $x = 1$: the left side gives $g(\\alpha(1)) = g(2) = 3$, the right side gives $\\alpha(g(1)) = \\alpha(2) = 1$. The values $3$ and $1$ differ, and $1$ is the smallest element of $X$, so no smaller failure exists. The answer is 1."
          - problem: "Claim: the maps $\\theta_X: \\mathrm{Hom}(1, X) \\to X$, $f \\mapsto f(*)$, form a natural isomorphism $\\mathrm{Hom}(1, -) \\Rightarrow \\mathrm{Id}$ on $\\mathbf{Set}$. Step 1: $\\theta_X$ is injective, since a map $1 \\to X$ is determined by the image of $*$. Step 2: $\\theta_X$ is surjective, since $x \\in X$ is the image of the map $* \\mapsto x$, so each $\\theta_X$ is a bijection. Step 3: naturality means $\\theta_Y \\circ \\mathrm{Hom}(1, g) = g \\circ \\theta_X$ for every $g: X \\to Y$. Step 4: $\\theta_Y(\\mathrm{Hom}(1, g)(f)) = \\theta_Y(g \\circ f) = f(*)$, which equals $g(\\theta_X(f))$, so the square commutes. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: a map from $1$ is fixed by the image of $*$. Step 2 is valid: $x \\mapsto (* \\mapsto x)$ is an inverse, so each component is a bijection. Step 3 states the correct naturality equation. Step 4 is not valid: $\\theta_Y(g \\circ f) = (g \\circ f)(*) = g(f(*))$, not $f(*)$; the claimed evaluation drops $g$, and the equality that follows is unjustified as written. The answer is Step 4."
          - problem: "A proof that the swap maps are natural works elementwise on a pair $(a, b)$ in $A \\times B$, using maps $f: A \\to A'$ and $g: B \\to B'$. The two sides of the square, $s_{A',B'} \\circ (f \\times g)$ and $(g \\times f) \\circ s_{A,B}$, send $(a, b)$ to the same pair in $B' \\times A'$. Select the pair that both sides give."
            answer: "(g(b), f(a))"
            answer_contract: {"kind": "label", "options": [["(g(b), f(a))"], ["(f(a), g(b))"], ["(g(a), f(b))"], ["(f(b), g(a))"]]}
            solution_sketch: "Compute the lower side: $s_{A,B}(a,b) = (b,a)$, then $(g \\times f)(b,a) = (g(b), f(a))$. Compute the upper side: $(f \\times g)(a,b) = (f(a), g(b))$, then $s_{A',B'}(f(a), g(b)) = (g(b), f(a))$. The option $(f(a), g(b))$ is the pair before the final swap is applied. The option $(g(a), f(b))$ feeds $a$ to $g$ and $b$ to $f$, confusing the two maps. The option $(f(b), g(a))$ swaps both the arguments and the roles of the maps. The answer is (g(b), f(a))."
          - problem: "Write the full proof: the swap maps $s_{A,B}(a,b) = (b,a)$ form a natural isomorphism between the bifunctors $(A,B) \\mapsto A \\times B$ and $(A,B) \\mapsto B \\times A$ on $\\mathbf{Set}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (components): for sets $A, B$ define $s_{A,B}: A \\times B \\to B \\times A$ by $s_{A,B}(a,b) = (b,a)$. Step 2 (inverse component): $s_{B,A} \\circ s_{A,B}(a,b) = s_{B,A}(b,a) = (a,b)$ and similarly $s_{A,B} \\circ s_{B,A} = \\mathrm{id}$, so each component is a bijection with inverse $s_{B,A}$. Step 3 (naturality, elementwise): for $f: A \\to A'$ and $g: B \\to B'$, evaluate the square on $(a,b)$. The lower side gives $(g \\times f)(s_{A,B}(a,b)) = (g \\times f)(b,a) = (g(b), f(a))$. The upper side gives $s_{A',B'}((f \\times g)(a,b)) = s_{A',B'}(f(a), g(b)) = (g(b), f(a))$. The two results agree, so the square commutes. Step 4 (conclusion): every component is an isomorphism and the family is natural in $(A,B)$, so $s$ is a natural isomorphism."
    diagnostic_exemplar:
      problem: "Let $\\alpha\\colon F\\Rightarrow G$ be a natural transformation in which every component $\\alpha_A$ is an isomorphism. Prove that the inverses $\\beta_A=\\alpha_A^{-1}$ form a natural transformation $\\beta\\colon G\\Rightarrow F$."
      answer: "For $f\\colon A\\to B$, start from naturality of $\\alpha$: $Gf\\circ\\alpha_A=\\alpha_B\\circ Ff$. Pre-compose with $\\alpha_A^{-1}$ and post-compose with $\\alpha_B^{-1}$: $\\alpha_B^{-1}\\circ Gf=\\alpha_B^{-1}\\circ Gf\\circ\\alpha_A\\circ\\alpha_A^{-1}=\\alpha_B^{-1}\\circ\\alpha_B\\circ Ff\\circ\\alpha_A^{-1}=Ff\\circ\\alpha_A^{-1}$. That is $Ff\\circ\\beta_A=\\beta_B\\circ Gf$ — exactly naturality of $\\beta\\colon G\\Rightarrow F$."
      solution_sketch: "Conjugate the naturality square of $\\alpha$: pre-compose with $\\alpha_A^{-1}$ and post-compose with $\\alpha_B^{-1}$. The matched pairs cancel and what is left standing is precisely the naturality square for $\\beta$, with $F$ and $G$ exchanged."
    anki_seeds:
      - front: "A natural isomorphism is a natural transformation whose..."
        back: "every component is an isomorphism (equivalently, an iso in the functor category)."
        type: basic
      - front: "If $\\alpha$ is a natural iso, are the inverse components $\\alpha_A^{-1}$ natural?"
        back: "Yes — invert the naturality square."
        type: basic

