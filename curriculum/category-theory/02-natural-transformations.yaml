            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor $G\colon\mathcal{D}\to\mathcal{C}$ is determined by the object it picks, so there are $4$ functors. For each of them the natural isomorphisms exist, because every hom-set of $\mathcal{C}$ has exactly one arrow and all arrows are invertible. So all $4$ functors are quasi-inverses.'
          - problem: 'Let $\mathcal{C}$ be the category with four objects and exactly one arrow from each object to each object, and let $\mathcal{D}$ be the category with one object and only its identity. Let $F\colon\mathcal{C}\to\mathcal{D}$ be the unique functor. A strict inverse of $F$ is a functor $G\colon\mathcal{D}\to\mathcal{C}$ with $GF=1_{\mathcal{C}}$ and $FG=1_{\mathcal{D}}$. How many strict inverses does $F$ have?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every functor $G$ picks one object $c$, and then $GF$ sends every object of $\mathcal{C}$ to $c$. Since $\mathcal{C}$ has $4$ objects, $GF$ is never the identity functor. So the number of strict inverses is $0$.'
          - problem: 'Let $\mathcal{C}$ be the category with four objects and exactly one arrow from each object to each object, and let $\mathcal{D}$ be the category with one object and only its identity. Are $\mathcal{C}$ and $\mathcal{D}$ isomorphic as categories?'
