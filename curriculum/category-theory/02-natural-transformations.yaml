      # Phase C reconciliation: kp1's constraints generate "quotient constructions such
      # as abelianization" and its third exemplar proves $\eta_G : G \to G/[G,G]$ natural,
      # leaning on descent of homomorphisms to the quotient — commutator-subgroup kp3.
      - id: commutator-subgroup
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Verifying a naturality square in algebra
        key_prerequisites: [natural-transformations, commutator-subgroup]
        constraints: "Require verifying a naturality square in algebra. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Let U from Mon to Set be the forgetful functor on monoids, and for each monoid M let s_M from UM to UM send x to x times x, the squaring component of a candidate transformation from U to U. Take M = N = the additive monoid Z/5, so x times x means x + x mod 5, and let f from M to N be the homomorphism f(x) = 2x mod 5. Chase x = 2 around the naturality square for s at f and give the common value that both legs produce in Z/5."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write both legs of the square. Chasing through s_M first gives s_M(2) = 2 + 2 = 4 mod 5, then f(4) = 8 mod 5 = 3. Chasing through f first gives f(2) = 4, then s_N(4) = 4 + 4 = 8 mod 5 = 3. The homomorphism law f(x + x) = f(x) + f(x) makes the two legs agree at every element, so both legs produce 3."
          - problem: "Let V:Mon->Set take a monoid to its units and U forget its multiplication. Construct the inclusion transformation i:V=>U. For a monoid homomorphism f:M->N and a unit x with inverse y, give 1/0 for the necessary proof claims: f(x)f(y)=1; f(y)f(x)=1; hence f restricts to a function V(M)->V(N); i_N V(f)=U(f)i_M. Do all four follow for arbitrary monoid homomorphisms, including noninjective ones?"
            answer: "1, 1, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Both homomorphism equations show that f(x) is a unit with inverse f(y), making the restriction well-defined. Both naturality routes then send each unit to f(x), without any injectivity assumption. The resulting answer is 1, 1, 1, 1."
          - problem: "For abelian groups, define Q(G)=G/2G and let q_G:G->Q(G)be the quotient. A proposed map Q(f)for a homomorphism f:G->H sends the class of x to the class of f(x). Supply the well-definedness step: if xprime=x+2z, write f(xprime)-f(x)as an integer multiple of f(z). Give the integer, then1 if q_H f=Q(f)q_G and0otherwise. This must establish the algebraic naturality construction for arbitrary f."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Additivity gives f(xprime)-f(x)=2f(z), so the image class is independent of the representative. Both routes of the quotient square send x to the class of f(x). The resulting answer is 2, 1."
          - problem: "Let U from Grp to Set be the forgetful functor on groups, and for each group G let c_G from UG to UG send x to x cubed, the cube component of a candidate transformation from U to U. Take G = H = the additive group Z/7, so x cubed means x + x + x mod 7, and let f from G to H be the homomorphism f(x) = 3x mod 7. Chase x = 2 around the naturality square for c at f and give the common value that both legs produce in Z/7."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Chase through c_G first: c_G(2) = 2 + 2 + 2 = 6 mod 7, then f(6) = 18 mod 7 = 4. Chase through f first: f(2) = 6, then c_H(6) = 6 + 6 + 6 = 18 mod 7 = 4. The homomorphism law f(x + x + x) = f(x) + f(x) + f(x) makes the legs agree, so both produce 4."
          - problem: "For groups let Q(G)=G/[G,G], with q_G the quotient map, and let U:Grp->Set forget the group structure. A proposed transformation q:U=>UQ uses these quotient maps. For an arbitrary homomorphism f:G->H, prove the candidate Q(f)([x])=[f(x)] is well defined and the q-square commutes. Encode f(x)=1,f(y)=2,f(x)^{-1}=3,f(y)^{-1}=4. Give the four-arrow word obtained by mapping the commutator xyx^{-1}y^{-1}; then append 1 if this proves preservation of the commutator subgroup, and 1 if both naturality routes send x to [f(x)], using 0 otherwise."
            answer: "1, 2, 3, 4, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A homomorphism sends each commutator to the commutator of the images, and hence sends the subgroup they generate into the target commutator subgroup. This makes the quotient map well defined; both routes around the naturality square take x to the class of f(x). The resulting answer is 1, 2, 3, 4, 1, 1."
          - problem: "For the quotient maps q:Z/6->Z/3 and r:Z/6->Z/3, let f be the homomorphism with f(1)=2. Construct the induced h on the quotients from the naturality square, and check that it is a homomorphism. Give h(0),h(1),h(2)."
            answer: "0, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Commutativity with the quotient maps forces the induced homomorphism. Checking fibers proves the definition is independent of representatives. The resulting answer is 0, 2, 1."
          - problem: "Write the full proof: for the abelianization functor ab from Grp to Grp, the quotient maps eta_G from G to G^ab form a natural transformation from the identity functor on Grp to ab. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (well-definedness): a homomorphism f from G to H sends the commutator xyx^{-1}y^{-1} to f(x)f(y)f(x)^{-1}f(y)^{-1}, a commutator of H, so f maps [G,G] into [H,H]; hence ab(f), defined by g[G,G] maps to f(g)[H,H], is well defined on cosets. Step 2 (functoriality): identities and composites of homomorphisms descend to the quotients in the same way, so ab is a functor from Grp to Grp, as is the identity. Step 3 (the chase): fix g in G; one leg gives ab(f)(eta_G(g)) = ab(f)(g[G,G]) = f(g)[H,H], and the other leg gives eta_H(f(g)) = f(g)[H,H], using the definition of the quotient map and of ab(f). Step 4 (conclusion): both legs of the naturality square send g to f(g)[H,H], so the square commutes at every f, and eta is a natural transformation from the identity functor to ab."
      - id: kp2
        name: Naturality is closed under composition
        key_prerequisites: [diagram-chasing]
        constraints: "Require naturality is closed under composition. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "For natural alpha:F=>G,beta:G=>H and f:X->Y, derive the composite square. Starting with Hf beta_X alpha_X, first apply only the beta square and then the alpha square. Encode Ff=1,Gf=2,Hf=3,alpha_X=4,alpha_Y=5,beta_X=6,beta_Y=7. Give the two resulting three-arrow words as one six-member list in conventional composition order."
            answer: "7, 2, 4, 7, 5, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality of beta replaces Hf beta_X with beta_Y Gf. Substituting the alpha square next gives beta_Y alpha_Y Ff, proving vertical closure. The resulting answer is 7, 2, 4, 7, 5, 1."
          - problem: "Let alpha:F=>G,beta:G=>H,gamma:H=>K be natural transformations and f:X->Y. Prove the composite gamma beta alpha natural by starting with Kf gamma_X beta_X alpha_X and applying the gamma square, then the beta square, then the alpha square. Encode Ff=1,Gf=2,Hf=3,Kf=4,alpha_X=5,alpha_Y=6,beta_X=7,beta_Y=8,gamma_X=9,gamma_Y=10. Give the three successive four-arrow words after these substitutions, concatenated in conventional composition order. The intermediate words as well as the final word are required."
            answer: "10, 3, 7, 5, 10, 8, 2, 5, 10, 8, 6, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The gamma square moves Kf past gamma_X, producing gamma_Y Hf beta_X alpha_X. The beta square then produces gamma_Y beta_Y Gf alpha_X. The alpha square gives gamma_Y beta_Y alpha_Y Ff, completing the composite naturality proof. The resulting answer is 10, 3, 7, 5, 10, 8, 2, 5, 10, 8, 6, 1."
          - problem: "In the proof that beta alpha is natural, identify the justification for each equality: Hf beta_X alpha_X=beta_Y Gf alpha_X; beta_Y Gf alpha_X=beta_Y alpha_Y Ff; (beta_Y alpha_Y)Ff=beta_Y(alpha_Y Ff). Code alpha naturality=1,beta naturality=2,associativity=3,functor identity law=4. Give the three codes. The proof must preserve the order of the two transformations."
            answer: "2, 1, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The first substitution uses the beta square and the second the alpha square. The final step changes only parentheses, so associativity completes the pasted naturality argument. The resulting answer is 2, 1, 3."
          - problem: "For alpha:F=>G,beta:G=>H natural and f:X->Y, derive the right sides of the two squares whose left sides are Gf alpha_X and Hf beta_X. Then derive the right side of the composite square whose left side is Hf beta_X alpha_X. Encode Ff=1,Gf=2,Hf=3,alpha_X=4,alpha_Y=5,beta_X=6,beta_Y=7. Give the right-side words, of lengths2,2,3,consecutively in conventional composition order."
            answer: "5, 1, 7, 2, 7, 5, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The first two equations are the naturality hypotheses. Their successive substitution yields the composite square while preserving the order beta after alpha. The resulting answer is 5, 1, 7, 2, 7, 5, 1."
          - problem: "Claim: if alpha: F => G and beta: G => H are natural transformations, then the vertical composite is natural. Step 1: for every arrow f: A -> B we must show Hf after (beta after alpha)_A = (beta after alpha)_B after Ff. Step 2: naturality of beta at f gives Hf after beta_A = beta_B after Gf. Step 3: naturality of alpha at f gives Gf after alpha_A = alpha_B after Ff. Step 4: combining, Hf after beta_A after alpha_A = beta_A after alpha_B after Ff, so the composite is natural. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 states the goal equation correctly. Step 2 correctly cites the naturality of beta at f. Step 3 correctly cites the naturality of alpha at f. Step 4 is the first invalid one: pasting the squares replaces beta_A by the component beta_B at the target object B, not by beta_A again. The answer is Step 4."
          - problem: "Suppose alpha:F=>G and beta:G=>H are natural. To prove beta alpha natural, begin with beta_Y alpha_Y F(f), and rewrite toward H(f) beta_X alpha_X. First apply the alpha square in reverse and then the beta square in reverse. Encode F(f)=1,G(f)=2,H(f)=3,alpha_X=4,alpha_Y=5,beta_X=6,beta_Y=7. Give the two successive three-arrow words, concatenated in conventional composition order. Derive the equations from both naturality hypotheses."
            answer: "7, 2, 4, 3, 6, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Reverse naturality of alpha moves F(f) across alpha_Y. Reverse naturality of beta then moves G(f) across beta_Y, proving the entire composite square rather than just one factor square. The resulting answer is 7, 2, 4, 3, 6, 4."
          - problem: "Write the full proof: if alpha: F => G and beta: G => H are natural transformations, then the vertical composite beta after alpha, with components (beta after alpha)_A = beta_A composed with alpha_A, is again a natural transformation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Set (beta after alpha)_A = beta_A after alpha_A for each object A. Goal: for every arrow f: A -> B, show Hf after (beta after alpha)_A = (beta after alpha)_B after Ff. Step 1 (expand the left side): Hf after (beta_A after alpha_A). Step 2 (naturality of beta at f, cited once): Hf after beta_A = beta_B after Gf, so the chain becomes beta_B after Gf after alpha_A. Step 3 (naturality of alpha at f, cited once): Gf after alpha_A = alpha_B after Ff, so the chain becomes beta_B after alpha_B after Ff. Step 4 (regroup): beta_B after alpha_B after Ff = (beta after alpha)_B after Ff, which is the right side of the goal. The two naturality squares paste along their common side Gf into one rectangle whose top edge is the component at A and whose bottom edge is the component at B, so the composite is natural."
      - id: kp3
        name: Recognizing when a family is NOT natural
        key_prerequisites: [natural-transformations]
        constraints: "Require the learner to use recognizing when a family is not natural. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "A student proposes the family that sends each vector v of a real inner product space V to the function taking w to the inner product of v and w, and asserts that the family is a natural transformation from the identity functor to the dual functor. Step 1: the identity functor and the dual functor have the same source category and the same target category. Step 2: each component function is linear. Step 3: for every linear function f from V to W, the naturality square at f must commute. Step 4: for f(x, y) = (x + y, y) and v = (0, 1), both composites send w to the same number, so the family is natural. Which step is the first step that is not valid?"
            answer: "Step 1"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 2 is valid: each component is a linear isomorphism from V onto its dual space. Step 3 is valid: commuting squares are exactly what naturality demands. Step 4 is not valid, since with w = (1, 0) the two composites give 1 and 0, but the failure begins earlier. Step 1 is the first invalid step: the dual functor is contravariant, sending a function f from V to W to a function from the dual of W to the dual of V, so the two functors are not parallel and no natural transformation between them is even well-typed. The answer is Step 1."
          - problem: "A student defines a family of maps alpha_A: A -> A for every set A: it is the identity on every set except the two-element set {0, 1}, where it swaps the two elements. The student claims this family is a natural transformation from the identity functor on Set to itself. Give the smallest size of a set A at which the naturality square fails for some element-selecting map from a one-point set to A."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the empty set and the one-point set the family is the identity, and every naturality square commutes, so sizes 0 and 1 cause no failure. Let 1 = {*} and let sel: 1 -> {0, 1} be the element-selecting map that picks 0. Naturality at sel would force alpha_A(sel(*)) = sel(alpha_1(*)) = 0, but the swap sends 0 to 1, so the square fails. The smallest such size is 2."
          - problem: "Construct an explicit witness that a component family fails naturality. On the arrow category A->B, F(u)=[1, 0],G(u)=[1, 0],alpha_A=[0, 1],alpha_B=[0, 0], with all object sets zero-based and of size2. Give the least input x where the square fails, followed by the output of the route through G(A) and the output of the route through F(B)."
            answer: "0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality is equality of whole functions. A single input with unequal route outputs is a complete counterexample to the proposed family. The resulting answer is 0, 1, 0."
          - problem: "For each nonempty set A, a student defines alpha_A: A -> P(A) by alpha_A(a) = A, and claims the family is a natural transformation from the identity functor to the powerset functor on Set. Test the square at the element-selecting map sel: 1 -> {0, 1, 2} with sel(*) = 0, where 1 = {*}. Give the number of elements that belong to alpha_A(sel(*)) but not to P(sel)(alpha_1(*))."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full square at sel reads P(sel) after alpha_1 = alpha_A after sel, both maps from 1 to P(A) with A = {0, 1, 2}. Left side: alpha_1(*) = 1 = {*}, and P(sel) takes the image, so P(sel)(alpha_1(*)) = {0}. Right side: alpha_A(0) = {0, 1, 2}. The elements on the right but not the left are 1 and 2, so the square fails and the family is not natural. The answer is 2."
          - problem: "Test a proposed equivariant component using the naturality square. On the arrow category A->B, F(u)=[1, 2, 0],G(u)=[1, 2, 0],alpha_A=[0, 2, 1],alpha_B=[0, 2, 1], with all object sets zero-based and of size3. Give the least input x where the square fails, followed by the output of the route through G(A) and the output of the route through F(B)."
            answer: "0, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality is equality of whole functions. A single input with unequal route outputs is a complete counterexample to the proposed family. The resulting answer is 0, 1, 2."
          - problem: "Locate the first failure of the naturality condition, rather than evaluating a supplied common composite. On the arrow category A->B, F(u)=[2, 0, 1],G(u)=[1, 2, 0],alpha_A=[1, 0, 2],alpha_B=[0, 1, 2], with all object sets zero-based and of size3. Give the least input x where the square fails, followed by the output of the route through G(A) and the output of the route through F(B)."
            answer: "1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Naturality is equality of whole functions. A single input with unequal route outputs is a complete counterexample to the proposed family. The resulting answer is 1, 1, 0."
          - problem: "Write the full proof: for every set A with at least two elements, the map that sends each element a to the subset A with {a} removed does not form a natural transformation from the identity functor to the powerset functor on Set. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup: let 1 = {*} be a one-point set, let A = {p, q}, and let sel: 1 -> A be the element-selecting map with sel(*) = p; write alpha_A(a) = A with {a} removed. Step 1, left side of the square at sel: alpha_1(*) is the empty set, because removing the single point from 1 leaves nothing, and the image of the empty set under P(sel) is still the empty set. Step 2, right side of the square: alpha_A(sel(*)) = alpha_A(p) = {q}, the set A with the singleton {p} removed. Step 3, compare: the empty set does not equal {q}, so the naturality square at the element-selecting map sel does not commute. Conclusion: the family fails the element-selecting test, so it is not a natural transformation from the identity functor to the powerset functor on Set."
    diagnostic_exemplar:
      problem: "Let $U\\colon\\mathbf{Grp}\\to\\mathbf{Set}$ be the forgetful functor. Prove that the inversion maps $i_G\\colon UG\\to UG$, $x\\mapsto x^{-1}$, form a natural transformation $i\\colon U\\Rightarrow U$."
      answer: "Fix a homomorphism $f\\colon G\\to H$; the square asks $Uf\\circ i_G=i_H\\circ Uf$. Chase $x\\in UG$: one leg gives $f(x^{-1})$, the other $f(x)^{-1}$. A group homomorphism preserves inverses ($f(x)f(x^{-1})=f(xx^{-1})=f(e)=e$ and symmetrically), so $f(x^{-1})=f(x)^{-1}$; the legs agree at every $x$, the square commutes for every $f$, and $i$ is natural. (Each $i_G$ is only a function, not a homomorphism — naturality asks no more.)"
      solution_sketch: "Chase $x\\in UG$ around the square: one leg gives $f(x^{-1})$, the other $f(x)^{-1}$. The crux is that a homomorphism preserves inverses; note the components need only be functions, since the square lives in $\\mathbf{Set}$."
    anki_seeds:
      - front: "Standard way to prove a componentwise composite of natural transformations is natural?"
        back: "Paste (stack) the two naturality squares and use associativity."
        type: basic
      - front: "Why is there no natural isomorphism $1\\Rightarrow(-)^*$ on $\\mathbf{Vect}$?"
        back: "$(-)^*$ is contravariant, so $1\\Rightarrow(-)^*$ is not even well-typed."
        type: basic
      - front: "Why is the double-dual map $V\\to V^{**}$ natural?"
        back: "$(-)^{**}$ is covariant and $v\\mapsto\\mathrm{ev}_v$ satisfies the naturality square."
        type: basic

