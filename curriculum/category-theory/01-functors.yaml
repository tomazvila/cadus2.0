            answer: "2, 3, 0, 1, 2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The projection equations determine both coordinates. The two partial actions commute, supplying the interchange law required for a bifunctor. The resulting answer is 2, 3, 0, 1, 2, 3."
          - problem: "Establish the interchange equation by constructing the map in each order. The underlying maps have value lists f=[1, 0],g=[2, 0, 1]. On all zero-based input pairs in lexicographic order, construct the map induced by (f,g) using its two projection equations. Encode an output pair (u,v) by 3u+v and give the full output list. Check that acting first in either variable gives this same list."
            answer: "5, 3, 4, 2, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The projection equations determine both coordinates. The two partial actions commute, supplying the interchange law required for a bifunctor. The resulting answer is 5, 3, 4, 2, 0, 1."
          - problem: "Determine the two-variable action by its projection equations. The underlying maps have value lists f=[0, 0],g=[1, 0]. On all zero-based input pairs in lexicographic order, construct the map induced by (f,g) using its two projection equations. Encode an output pair (u,v) by 2u+v and give the full output list. Check that acting first in either variable gives this same list."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The projection equations determine both coordinates. The two partial actions commute, supplying the interchange law required for a bifunctor. The resulting answer is 1, 0, 1, 0."
          - problem: "For the cartesian-product bifunctor Set x Set->Set, take f:{0,1}->{0,1,2} with values[2,0] and g:{0,1,2}->{0,1} with values[1,0,1]. Construct both partial-action composites: change the first variable then the second, and change the second then the first. Give the first composite on lexicographically ordered input pairs, encoding output(u,v)as2u+v; append1 if the second composite agrees everywhere or0otherwise."
            answer: "5, 4, 5, 1, 0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The first partial action changes only the first coordinate and the second only the second coordinate. Their equality establishes the mixed functoriality requirement in this example. The resulting answer is 5, 4, 5, 1, 0, 1, 1."
          - problem: "Write the full proof: if $F\\colon \\mathcal{C} \\times \\mathcal{D} \\to \\mathcal{E}$ is a functor and $f\\colon X \\to X'$, $g\\colon Y \\to Y'$ are morphisms, then $F(f, g) = F(f, 1_Y) \\circ F(1_X, g) = F(1_X, g) \\circ F(f, 1_Y)$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Line 1 (product category structure): composition and identities in $\\mathcal{C} \\times \\mathcal{D}$ are componentwise, so $(f, 1_Y) \\circ (1_X, g) = (f \\circ 1_X, 1_Y \\circ g) = (f, g)$ and likewise $(1_X, g) \\circ (f, 1_Y) = (1_X \\circ f, g \\circ 1_Y) = (f, g)$. Line 2 (functoriality): applying $F$ and using that a functor preserves composition and identities, $F(f, g) = F((f, 1_Y) \\circ (1_X, g)) = F(f, 1_Y) \\circ F(1_X, g)$, and the same computation with the other factorization gives $F(f, g) = F(1_X, g) \\circ F(f, 1_Y)$. Line 3 (conclusion): both composites equal $F(f, g)$, so the two partial actions of $F$ commute; this is the interchange law, and it shows that a functor out of a product is a bifunctor, functorial in each variable separately. Conversely, separate functoriality in each variable together with this interchange assembles a genuine functor on the product category, since every morphism $(f, g)$ factors as above."
    diagnostic_exemplar:
      problem: "Show that disjoint union $\\sqcup\\colon\\mathbf{Set}\\times\\mathbf{Set}\\to\\mathbf{Set}$, $(X,Y)\\mapsto X\\sqcup Y$ and $(f,g)\\mapsto f\\sqcup g$, is a functor on the product category, and verify the interchange identity $f\\sqcup g=(f\\sqcup 1_{Y'})\\circ(1_X\\sqcup g)=(1_{X'}\\sqcup g)\\circ(f\\sqcup 1_Y)$ for $f\\colon X\\to X'$ and $g\\colon Y\\to Y'$."
      answer: "Identities and composition in $\\mathbf{Set}\\times\\mathbf{Set}$ are componentwise. Identity law: $1_X\\sqcup 1_Y$ is the identity on each summand, so it equals $1_{X\\sqcup Y}$. Composition law: for $(f,g)\\colon(X,Y)\\to(X',Y')$ and $(f',g')\\colon(X',Y')\\to(X'',Y'')$, the map $(f'\\circ f)\\sqcup(g'\\circ g)$ applies $f'\\circ f$ on the left summand and $g'\\circ g$ on the right, which is exactly $(f'\\sqcup g')\\circ(f\\sqcup g)$. So $\\sqcup$ is a functor on the product category, i.e. a bifunctor. Interchange: in $\\mathbf{Set}\\times\\mathbf{Set}$ the componentwise factorisations $(f,g)=(f,1_{Y'})\\circ(1_X,g)=(1_{X'},g)\\circ(f,1_Y)$ hold, and applying the functor gives the stated identity. Elementwise, all three routes send a left-summand element $x$ to the left-summand element $f(x)$ and a right-summand element $y$ to the right-summand element $g(y)$."
      solution_sketch: "Composition and identities in a product category are componentwise, so both functor laws reduce to the fact that $\\sqcup$ acts on each summand separately. For interchange, factor $(f,g)$ in $\\mathbf{Set}\\times\\mathbf{Set}$ the two available ways and apply the functor; elementwise every route sends $x$ to $f(x)$ and $y$ to $g(y)$."
    anki_seeds:
      - front: "Composition in $\\mathcal C\\times\\mathcal D$?"
        back: "$(f',g')\\circ(f,g)=(f'\\circ f,\\ g'\\circ g)$, componentwise."
        type: basic
      - front: "A bifunctor is a functor whose domain is a {{c1::product category}}."
        back: "product category"
        type: cloze

