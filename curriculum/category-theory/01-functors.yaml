          - problem: 'Write the full proof that, for an object $C$ of a category and a functor $G\colon\mathcal{D}\to\mathcal{C}$, a pair $(D_0,f_0)$ with $f_0\colon C\to G(D_0)$ is a universal arrow from $C$ to $G$ exactly when it is an initial object of the comma category $(C\downarrow G)$.'
