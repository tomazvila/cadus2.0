          - problem: "Let C be the category with a single object $\\star$ and only the identity arrow, and let D be the category with objects p and q whose only non-identity arrows are two parallel arrows u and v, both from p to q. Let $G\\colon D \\to C$ be the unique functor, so $(\\star \\downarrow G)$ has the two objects $(p, f)$ and $(q, g)$. Give the number of morphisms from $(p, f)$ to $(q, g)$ in $(\\star \\downarrow G)$."
