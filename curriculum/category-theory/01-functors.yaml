          - problem: "Write the full proof: for an object C of a category and a functor $G\\colon D \\to C$, a pair $(D_0, f_0)$ with $f_0\\colon C \\to G(D_0)$ is a universal arrow from C to G exactly when it is an initial object of the comma category $(C \\downarrow G)$, with the existence clause of the universal arrow matching the existence of the mediating morphism and the uniqueness clause matching its uniqueness. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Setup. View C as the functor from $\\mathbf{1}$ to the category picking the object C; then an object of $(C \\downarrow G)$ is a pair $(D, f)$ with $f\\colon C \\to G(D)$, and a morphism from $(D, f)$ to $(D', f')$ is an arrow $d\\colon D \\to D'$ with $G(d) \\circ f = f'$. Step 1, existence clause. The pair $(D_0, f_0)$ is initial when for every object $(D, f)$ there exists a morphism from $(D_0, f_0)$ to $(D, f)$; by the description of morphisms this says exactly that there exists an arrow $d\\colon D_0 \\to D$ with $G(d) \\circ f_0 = f$, which is the existence clause of a universal arrow from C to G. Step 2, uniqueness clause. Initiality also demands that this morphism be unique; by the description of morphisms this says exactly that such an arrow $d$ is unique, which is the uniqueness clause. Step 3, conclusion. Hence $(D_0, f_0)$ is initial in $(C \\downarrow G)$ if and only if $f_0$ is a universal arrow from C to G; since initial objects are unique up to a unique isomorphism, universal arrows from C to G are unique up to a unique isomorphism as well."
    diagnostic_exemplar:
      problem: "In the comma category $(F\\downarrow G)$, a morphism $(A,B,h)\\to(A',B',h')$ is a pair $(a,b)$ with $Gb\\circ h=h'\\circ Fa$. Prove that the componentwise composite of two such morphisms is again a morphism of $(F\\downarrow G)$."
      answer: "Let $(a,b)\\colon(A,B,h)\\to(A',B',h')$ and $(a',b')\\colon(A',B',h')\\to(A'',B'',h'')$. Then $G(b'\\circ b)\\circ h=Gb'\\circ Gb\\circ h=Gb'\\circ h'\\circ Fa=h''\\circ Fa'\\circ Fa=h''\\circ F(a'\\circ a)$, using functoriality of $G$ and $F$ and the two given squares in turn. So $(a'\\circ a,\\,b'\\circ b)$ satisfies the comma square condition and is a morphism $(A,B,h)\\to(A'',B'',h'')$."
      solution_sketch: "The same paste-two-squares move as for the arrow category: expand $G(b'\\circ b)$ by functoriality of $G$, push it across the two comma squares in turn, and reassemble the right-hand side with functoriality of $F$."
