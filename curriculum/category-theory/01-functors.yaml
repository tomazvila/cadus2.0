            solution_sketch: "Fullness requires every target arrow to lift, and faithfulness requires distinct parallel source arrows to stay distinct. Test both on each listed hom-set map. The resulting answer is 0, 1, 1, 1."
          - problem: "Compare three functors whose hom-set maps exhibit different behavior. For each functor below, the listed map is its only hom-set map that is not an identity bijection or an empty-to-empty map. 1: hom-map values [0, 0, 0], target arrows 0,...,0; 2: hom-map values [0, 1, 2], target arrows 0,...,2; 3: hom-map values [0, 0, 1], target arrows 0,...,2. For each functor give two bits: full, faithful (1=yes, 0=no), in the displayed order."
            answer: "1, 0, 1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness requires every target arrow to lift, and faithfulness requires distinct parallel source arrows to stay distinct. Test both on each listed hom-set map. The resulting answer is 1, 0, 1, 1, 0, 0."
          - problem: "Separate fullness and faithfulness for these actual functors: (i) the unique functor B(Z/2)->1; (ii) the functor disc({0,1})->1 collapsing both objects; (iii) the inclusion of the chain category 0<1 into the indiscrete category on {0,1}. For each, give full then faithful as two bits. Construct the relevant hom-set maps, including empty hom-sets, to justify the six bits; no definitions or hom-map tables are supplied."
            answer: "1, 0, 0, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The group collapse is surjective on its one hom-set but identifies two arrows. For each of the other functors, all hom-maps are injective, but a missing reverse or cross-object source hom-set maps into a nonempty target hom-set, preventing fullness. The resulting answer is 1, 0, 0, 1, 0, 1."
          - problem: "Write the full proof: the forgetful functor U: Grp -> Set is faithful but not full. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let U send each group to its underlying set and each homomorphism to its underlying function. Faithful: for groups G and H, suppose U(phi) = U(psi) as functions. Then phi(g)=psi(g) for every g in G, so phi=psi as homomorphisms. Thus each hom-map of U is injective, which is the definition of faithful. Not full: take G=H=Z. The function f: Z -> Z with f(n)=n+1 is an ordinary set function, but it is not a group homomorphism because f(0)=1 and a homomorphism must send 0 to 0. Hence f lies in Hom_Set(UZ,UZ) but not in the image of U_{Z,Z}. Therefore U_{Z,Z} is not surjective, so U is not full. This proves U is faithful but not full."
      - id: kp3
        name: Fully faithful functors reflect isomorphisms
        key_prerequisites: [functors]
        constraints: "Require fully faithful functors reflect isomorphisms. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Let F be fully faithful and F(f):FA->FB invertible with inverse d. For each proof obligation, identify the needed local hom-map property: obtain h with Fh=d; infer hf=id_A from its F-image equation; infer fh=id_B from its F-image equation. Code Hom(B,A)=3,Hom(A,A)=4,Hom(B,B)=5,and surjectivity=1,injectivity=2. Give the three(hom-set,property)pairs as six integers in that order."
            answer: "3, 1, 4, 2, 5, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness on the reversed hom-set lifts the target inverse. The functor laws give the two image equations, and injectivity on each endomorphism hom-set reflects the identity equation. The resulting answer is 3, 1, 4, 2, 5, 2."
          - problem: "Test whether faithfulness alone reflects isomorphisms. Let C be the poset0<1, and D the indiscrete category on the same two objects. F includes every C-arrow in D. Give 1/0 for F faithful, F full, F(0->1)invertible, and0->1invertible in C. Relate the failure to the missing lift of the target inverse."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Each source hom-set embeds, so F is faithful. The target reverse arrow cannot be lifted, demonstrating the existence gap that fullness repairs. The resulting answer is 1, 0, 1, 0."
          - problem: "Suppose F is full and d=(Ff)^{-1}. Choose h with Fh=d. Decide which conclusions hold without assuming faithfulness: F(hf)=F(id_A); hf=id_A; F(fh)=F(id_B); fh=id_B. Give four1/0 bits. For false conclusions, use the one-object category with arrows1,e and e^2=e, mapped to the terminal category."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Functoriality proves both equalities after applying F. The full collapse functor identifies a nonidentity idempotent with the identity, so faithfulness is required to reflect either equality. The resulting answer is 1, 0, 1, 0."
          - problem: "Claim: a fully faithful functor F reflects isomorphisms. Step 1: Suppose Ff is an isomorphism with inverse g. Step 2: By faithfulness, there is h with g = Fh. Step 3: Then F(h f) = Fh Ff = g Ff = 1. Step 4: By faithfulness, h f = 1. Step 5: Similarly F(f h) = 1, so f h = 1 and f is an isomorphism. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 assumes Ff is an isomorphism with inverse g, which is the hypothesis and is valid. Step 2 says faithfulness gives h with g = Fh; that is invalid because fullness gives existence, while faithfulness gives uniqueness. Step 3 computes F(h f) = 1 correctly. Step 4 correctly uses faithfulness to cancel F. Step 5 is the symmetric argument. The answer is Step 2."
          - problem: "In the reflection proof, Step 1 supposes Ff is an isomorphism with inverse g. Step 2 uses the fact that every morphism FB to FA of D equals Fh for some h: B to A, giving g = Fh. Step 3 computes F(h f) = Fh Ff = g Ff = 1 = F(1_A). Step 4 concludes h f = 1_A. Which property of F does Step 4 use to reach its conclusion?"
            answer: "faithfulness"
            answer_contract: {"kind": "label", "options": [["fullness"], ["faithfulness"], ["functoriality"], ["injectivity on objects"], ["surjectivity on objects"]]}
            solution_sketch: "Step 4 cancels F from both sides of F(h f) = F(1_A), which is exactly the injectivity on hom-sets that faithfulness states. Wrong option fullness: it is the existence property used in Step 2 to obtain h, not the cancellation in Step 4. Wrong option functoriality: it gives the composition rule F(h f) = Fh Ff of Step 3, not the conclusion of Step 4. Wrong option injectivity: it names a property of a plain function, not the stated hypothesis of the functor. Wrong option surjectivity: also a plain-function property, and it gives existence, not cancellation. The answer is faithfulness."
          - problem: "To test why faithfulness matters for reflecting isomorphisms, let C be the one-object category {1,e} with e^2=e and e distinct from1, and let F:C->1 be the unique functor. Give four bits in order: F full, F faithful, F(e) invertible, e invertible. Derive the last answer by searching for a two-sided inverse in C."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness alone lifts an arrow, but a nonfaithful functor can identify a nonidentity idempotent with an identity. The source inverse equations reveal the obstruction. The resulting answer is 1, 0, 1, 0."
          - problem: "Write the full proof: if F from C to D is a fully faithful functor and f: A -> B is a morphism of C for which Ff is an isomorphism, then f is an isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Suppose F: C -> D is fully faithful and Ff: FA -> FB is an isomorphism with inverse g: FB -> FA. By fullness, since g is a morphism FB -> FA, there is h: B -> A with g = Fh. Consider F(h f) = Fh Ff = g Ff = 1_{FA}. Since F(1_A) = 1_{FA}, faithfulness gives h f = 1_A. Similarly, F(f h) = Ff Fh = Ff g = 1_{FB} = F(1_B), so faithfulness gives f h = 1_B. Therefore f is an isomorphism with inverse h."
    diagnostic_exemplar:
      problem: "Prove that a fully faithful functor $F$ reflects isomorphisms: if $Ff$ is an isomorphism, then $f$ is an isomorphism."
      answer: "Let $Ff\\colon FA\\to FB$ have inverse $g\\colon FB\\to FA$. By fullness $g=Fh$ for some $h\\colon B\\to A$. Then $F(h\\circ f)=Fh\\circ Ff=g\\circ Ff=1_{FA}=F(1_A)$, so faithfulness gives $h\\circ f=1_A$. Symmetrically $F(f\\circ h)=Ff\\circ Fh=1_{FB}=F(1_B)$ gives $f\\circ h=1_B$. Hence $h$ is a two-sided inverse and $f$ is an isomorphism."
      solution_sketch: "Fullness supplies the candidate and faithfulness proves it works: lift the inverse of $Ff$ to some $h\\colon B\\to A$, then descend the two identity equations from $\\mathcal D$ to $\\mathcal C$ by cancelling $F$."
    anki_seeds:
      - front: "A functor is faithful when each hom-set map $\\mathrm{Hom}(A,B)\\to\\mathrm{Hom}(FA,FB)$ is..."
        back: "injective."
        type: basic
      - front: "A functor is full when each hom-set map $\\mathrm{Hom}(A,B)\\to\\mathrm{Hom}(FA,FB)$ is..."
        back: "surjective."
        type: basic
      - front: "A fully faithful functor {{c1::reflects isomorphisms}} (if $Ff$ is iso then $f$ is iso)."
        back: "reflects isomorphisms"
        type: cloze

  - id: subcategories
    name: Subcategories
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: category-definition
        weight: 0.4
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Subcategories and full subcategories
        key_prerequisites: [category-definition]
        constraints: "Require subcategories and full subcategories. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Inside the one-object Set category on X={0,1}, start with the single arrow c_0=[0,0]. Construct the smallest subcategory containing it. List the additional arrow as its complete value list; justify why closure requires it and why no further arrows are needed."
            answer: "0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A subcategory contains the identity on each retained object and is closed under composition. The constant map and identity already form a composition-closed collection. The resulting answer is 0, 1."
          - problem: "In Set take the objects A={0},B={0,1}. A proposed full subcategory includes only identity arrows, the two maps A->B, and the unique map B->A. Construct every additional B->B arrow that fullness requires. Give the missing value lists concatenated in lexicographic order. Check whether composition closure already forces any of them."
            answer: "0, 0, 1, 0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness requires all four B-endomorphisms. The two constants are also composites through A, while the transposition is required by fullness even though those composites do not force it. The resulting answer is 0, 0, 1, 0, 1, 1."
          - problem: "Let P be the poset with elements a, b, c and order a < b < c, viewed as a category that has exactly one morphism x -> y whenever x <= y, besides the identities. A proposed subcategory D keeps all three objects and, besides the identities, only the morphisms a -> b and b -> c. The identities are present, so only closure under composition can fail. How many non-identity morphisms must be added to D so that it is closed under composition?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the identities of a, b, c are in D, so the identity condition holds explicitly. Step 2: the composite of a -> b with b -> c must exist in D; in the poset P this composite is the unique morphism a -> c. Step 3: a -> c is not among the chosen morphisms, and it is the only missing composite, so exactly one morphism must be added. D must gain 1 non-identity morphism to be closed under composition."
          - problem: "Take the category with one object whose morphisms are the integers, where composition adds and the identity is 0. A proposed subcategory keeps the object and only the morphisms 0, 1, and -1. The identity is present, but composition may leave the chosen set. Find the smallest positive integer m such that the m-fold composite of 1 with itself is not one of the chosen morphisms."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: since composition adds, the m-fold composite of the morphism 1 with itself corresponds to the integer m. Step 2: for m = 1 the composite is 1, which is chosen; for m = 2 the composite is 2, which is not among 0, 1, -1, so closure under composition fails there. Step 3: no smaller positive m fails, so this is the smallest counterexample to closure. The smallest such m is 2."
          - problem: "To construct the full subcategory on objects 0 and3, first recover the ambient composites. Decide the following arrow types between its retained objects. Objects are [0, 1, 2, 3]; initially specified arrows are [(0, 1), (1, 3), (0, 2), (2, 3)]. Add only what identities and composition force, keeping at most one arrow between each ordered pair. For the ordered pairs [(0, 3), (3, 0), (0, 0)], give 1 if the completed thin category has that arrow and 0 otherwise."
            answer: "1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Identity arrows impose reflexivity and composites impose transitive closure; uniqueness of parallel arrows supplies associativity. The resulting answer is 1, 0, 1."
          - problem: "Claim: for any subcategory D of a category C, the inclusion functor i: D -> C is faithful. A proof: Line 1: by definition of a subcategory, Hom_D(A, B) is a subset of Hom_C(A, B) for all objects A and B of D. Line 2: [missing]. Line 3: hence i is injective on each hom-set. Line 4: therefore i is faithful. Select the line that fills Line 2."
            answer: "i maps each morphism to itself, viewed as a morphism of C"
            answer_contract: {"kind": "label", "options": [["i maps each morphism to itself, viewed as a morphism of C"], ["i maps every morphism to an identity morphism"], ["i is full on every hom-set"], ["Hom_C(A, B) is a subset of Hom_D(A, B)"]]}
            solution_sketch: "Line 1 records the defining inclusion of hom-sets. The correct Line 2 says that i maps each morphism to itself viewed as a morphism of C, so i acts as the identity map on each hom-set, which is injective; this is what Line 3 uses. The option i maps every morphism to an identity morphism misdescribes the action of the inclusion. The option i is full on every hom-set confuses fullness with faithfulness. The option Hom_C(A, B) is a subset of Hom_D(A, B) reverses the defining inclusion and would suggest fullness instead. The answer is: i maps each morphism to itself, viewed as a morphism of C."
          - problem: "Write the full proof: finite sets, with all functions between them, form a full subcategory FinSet of Set. Verify identities, closure of composition, and equality of the hom-sets on the retained objects."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "The objects of FinSet are finite sets. For each finite set A, its identity function is a morphism of FinSet. If f:A->B and g:B->C are functions between finite sets, their composite is again a function between the finite sets A and C, so it remains a morphism. Associativity and both unit laws are inherited from Set. For finite A and B, every Set function A->B is included in FinSet by definition. Thus each hom-set agrees with the ambient Set hom-set, proving fullness."
      - id: kp2
        name: Full versus non-full examples
        key_prerequisites: [full-faithful-functors]
        constraints: "Require the learner to use full versus non-full examples. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Regard Ab as a subcategory of Grp: its objects are the abelian groups and its morphisms are all group homomorphisms between them. A group homomorphism from Z3 to Z6 sends 1 to an element a of Z6 with 3a = 0. Give homs, the number of group homomorphisms from Z3 to Z6, and verdict, whether Ab is a full subcategory of Grp."
            answer: "homs = 3; verdict = full"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "homs"}, {"contract": {"kind": "label", "options": [["full"], ["nonfull"]]}, "name": "verdict"}]}
            solution_sketch: "The full object is the hom-set Hom_Grp(Z3, Z6), and the claim to judge is fullness of Ab in Grp. Step 1 (count homomorphisms): 3a = 0 in Z6 forces a in {0, 2, 4}, so the hom-set has 3 elements. Step 2 (fullness definition): a subcategory is full when each of its hom-sets equals the hom-set of the ambient category. Step 3 (preservation argument): Ab carries every group homomorphism between abelian groups, since abelianness is a property of the objects only, so Hom_Ab(Z3, Z6) = Hom_Grp(Z3, Z6) = 3 and no morphism is omitted; the option nonfull is the error of mistaking a smaller object class for smaller hom-sets. The answer is homs = 3; verdict = full."
          - problem: "Regard Grp as a subcategory of Mon: a monoid homomorphism preserves the identity and satisfies f(x + y) = f(x) + f(y). Write Z2 = {0, 1} and Z4 = {0, 1, 2, 3} with addition. Give homs, the number of monoid homomorphisms from Z2 to Z4, and verdict, whether Grp is a full subcategory of Mon."
            answer: "homs = 2; verdict = full"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "homs"}, {"contract": {"kind": "label", "options": [["full"], ["nonfull"]]}, "name": "verdict"}]}
            solution_sketch: "The full object is the hom-set Hom_Mon(Z2, Z4), and the claim to judge is fullness of Grp in Mon. Step 1 (count monoid homomorphisms): f(1) = a must satisfy f(1 + 1) = a + a = f(0) = 0 in Z4, so a in {0, 2}: two homomorphisms. Step 2 (preservation argument, written multiplicatively): for any monoid homomorphism f between groups, f(g) f(g^-1) = f(g g^-1) = f(e) = e and likewise f(g^-1) f(g) = e, so f(g^-1) is the inverse of f(g) and f preserves inverses. Step 3 (fullness definition): hence every monoid homomorphism between groups is a group homomorphism, Hom_Mon(G, H) = Hom_Grp(G, H), consistent with the count 2 for Z2 to Z4; the option nonfull is the error of thinking inverses can be lost. The answer is homs = 2; verdict = full."
          - problem: "The subcategory Inj of Set keeps every set and only injections. For A={0,1},B={0,1,2}, construct the lexicographically least Set arrow A->B omitted by Inj. Give its value list and then1if the inclusion is full on this hom-set or0otherwise."
            answer: "0, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Comparing the ambient and restricted hom-sets produces a concrete missing arrow, witnessing the failure of fullness. The resulting answer is 0, 0, 0."
          - problem: "Let P be the chain0<1<2<3 and S its subcategory with all identities plus0->1 and2->3. Construct the lexicographically least ambient arrow between retained objects omitted by S. Give its source,target, followed by1if S is full or0otherwise."
            answer: "0, 2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness requires every ambient arrow between retained objects. A missing cross-block order arrow supplies the counterexample. The resulting answer is 0, 2, 0."
          - problem: "The core of Set retains only bijections. On the object X={0,1}, construct the lexicographically greatest Set endomorphism omitted by the core, and state whether the inclusion is faithful and full on this hom-set. Give the two function values followed by those two bits."
            answer: "1, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The inclusion retains arrows unchanged, so it is faithful. The omitted nonbijection prevents equality with the ambient hom-set and hence fullness. The resulting answer is 1, 1, 1, 0."
          - problem: "A student argues that Grp is not a full subcategory of Mon. Step 1: the objects of Grp are the groups and the objects of Mon are the monoids. Step 2: a monoid homomorphism between two groups preserves the identity and the product. Step 3: such a homomorphism need not preserve inverses, so it need not be a group homomorphism. Step 4: hence the hom-sets differ and Grp is not full. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is true: every group is a monoid, so the objects of Grp are also objects of Mon. Step 2 is true: the product and the identity of a group are exactly the monoid structure it carries. Step 3 is the first invalid step: a monoid homomorphism between groups preserves the product and the identity, and then the image of an inverse is the two-sided inverse of the image, so inverses are preserved automatically; the claim that they need not be is the error. Step 4 inherits the error of Step 3, since the hom-sets agree and Grp is full in Mon. The answer is Step 3."
          - problem: "Write the full proof: Grp is a full subcategory of Mon, and the subcategory of Set with all sets as objects and only the surjective functions as morphisms is not full. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (fullness of Grp in Mon): let G and H be groups and f a monoid homomorphism, so f preserves the identity and the multiplication. Step 2 (preservation argument): for each g in G, f(g) f(g^-1) = f(g g^-1) = f(e) = e, and likewise f(g^-1) f(g) = e, so f(g^-1) is the two-sided inverse of f(g) in H and f preserves inverses. Step 3 (conclusion of Step 2): f is a group homomorphism, so Hom_Mon(G, H) = Hom_Grp(G, H) for all groups G and H, which is exactly the definition of a full subcategory. Step 4 (the Set subcategory): the surjective-functions subcategory has all sets as objects; identities are surjective and composites of surjections are surjective, so it is a subcategory. Step 5 (omitted morphism): the inclusion from {1, 2} to {1, 2, 3} is a function that is not surjective, so it lies in the hom-set of Set but not in the hom-set of the subcategory. Step 6 (verdict): since the hom-sets differ, the subcategory is not full. Hence Grp is a full subcategory of Mon and the surjective-functions subcategory of Set is not full."
      - id: kp3
        name: A full subcategory is determined by its objects
        key_prerequisites: [full-faithful-functors]
        constraints: "Require a full subcategory is determined by its objects. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Let C be the diamond poset category with a<b<d and a<c<d. Construct the full subcategory on the object set{a,d}. Encode a=0,b=1,c=2,d=3 and encode an arrow x->y by4x+y. Give the increasing list of all arrow codes that this object set forces, including identities."
            answer: "0, 3, 15"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness retains every ambient arrow whose source and target are among the selected objects. The composite a->d is retained even though the intermediate objects are absent. The resulting answer is 0, 3, 15."
          - problem: "Fix the object set consisting only of X={0,1}. Construct the full subcategory of Set on this object by listing every required endomorphism as a value list in lexicographic order. Flatten these lists into a single ordered list of eight values."
            answer: "0, 0, 0, 1, 1, 0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Once the object is fixed, fullness determines its hom-set to be the entire ambient function set. These arrows include identities and all composites. The resulting answer is 0, 0, 0, 1, 1, 0, 1, 1."
          - problem: "Let D,E be subcategories of an arbitrary category C with exactly the same objects. Consider four hypothesis cases in this order: both D and E are full; only D is assumed full; only E is assumed full; neither is assumed full. In each case determine whether D is necessarily contained in E and whether E is necessarily contained in D, giving the eight truth bits in that order. Here not assumed full allows either possibility. Derive every guaranteed inclusion from the hom-sets; refute each unsupported inclusion using subcategories of Set with the same object set. No inclusion theorem or proof is supplied."
            answer: "1, 1, 0, 1, 1, 0, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Every arrow of either subcategory is an ambient arrow between their common objects, so fullness of the target subcategory proves inclusion into it. If both are full this proves equality. To refute an unsupported inclusion, use the full subcategory of Set on the single object {0,1} as the source and its identity-only subcategory as the target; reversing these choices refutes the other direction. The resulting answer is 1, 1, 0, 1, 1, 0, 0, 0."
          - problem: "Two full subcategories D,E of C have the same object set. Besides their hom-sets, their category structures must agree. Determine1/0 for each justification: their identities are inherited from C; their composition operations are inherited from C; equality of the number of objects alone would give the same result; the resulting equality is literal equality of subcategories, not only equivalence."
            answer: "1, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Both full subcategories inherit the same identity and composition data from C, so equality of their objects and hom-sets gives equality as categories. Equal object cardinalities do not identify the actual selected objects. The resulting answer is 1, 1, 0, 1."
          - problem: "Audit consequences of the theorem that a full subcategory is determined by its objects. Give1/0 for: two full subcategories with the same objects have identical hom-sets; two full subcategories with equally many objects must be equal; a full subcategory containing every object of C equals C; specifying a non-full subcategory is always sufficient by listing only its objects."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness fixes each hom-set as the corresponding ambient hom-set. This proves the same-object and all-object claims, while equally large object sets and arbitrary non-full arrow choices leave genuinely different subcategories. The resulting answer is 1, 0, 1, 0."
          - problem: "Let D and E be subcategories of a category C with Ob(D) = Ob(E), each satisfying one hypothesis H. Argument: Step 1: the objects of D and E agree. Step 2: for all objects X and Y of D, hom_D(X, Y) = hom_C(X, Y). Step 3: likewise hom_E(X, Y) = hom_C(X, Y). Step 4: hence D and E have the same objects and the same hom-sets, so D = E. Which hypothesis H does Step 2 use?"
            answer: "D is full"
            answer_contract: {"kind": "label", "options": [["D is full"], ["D is wide in C"], ["C has exactly one object"], ["D is a groupoid"]]}
            solution_sketch: "Step 2 claims hom_D(X, Y) equals hom_C(X, Y), and exactly this equality is supplied by the hypothesis that D is full, since a full subcategory copies each hom-set from C. The option wide in C is wrong: a wide subcategory contains all objects but may omit morphisms, so its hom-sets can be smaller than those of C. The option one object constrains C, not the hom-sets of D. The option groupoid restricts which morphisms D has but never forces equality with hom_C. The answer is D is full."
          - problem: "Write the full proof: two full subcategories of a category C with the same objects are equal, while a general subcategory is not determined by its objects, as two distinct subcategories of Set with the same objects show. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Direction one. Step 1 (objects): let D and E be full subcategories of C with the same objects. Step 2 (hom-sets): for objects X and Y common to D and E, fullness of D gives hom_D(X, Y) = hom_C(X, Y), and fullness of E gives hom_E(X, Y) = hom_C(X, Y). Step 3 (conclusion): hence hom_D(X, Y) = hom_E(X, Y) for all X, Y; together with the shared objects, identities and composition, this proves D = E. Direction two. Step 4 (two subcategories of Set): let F be Set itself and let B be the subcategory with all sets as objects and only the bijections as morphisms; identities are bijections and composites of bijections are bijections, so B is a subcategory. Step 5 (they differ): on X = {1, 2} the swap is a morphism of both, but the constant map is a morphism of F and not of B, so F and B are distinct subcategories with the same objects. Hence full subcategories are exactly the subcategories determined by their objects."
    diagnostic_exemplar:
      problem: "Is $\\mathbf{Grp}$ a full subcategory of $\\mathbf{Mon}$? Prove your answer."
      answer: "Yes. Every group is a monoid, and every monoid homomorphism $\\phi\\colon G\\to H$ between groups automatically preserves inverses: from $\\phi(g)\\phi(g^{-1})=\\phi(gg^{-1})=\\phi(e)=e$ and likewise $\\phi(g^{-1})\\phi(g)=e$, the element $\\phi(g^{-1})$ is a two-sided inverse of $\\phi(g)$, so $\\phi(g^{-1})=\\phi(g)^{-1}$ and $\\phi$ is a group homomorphism. Hence $\\mathrm{Hom}_{\\mathbf{Mon}}(G,H)=\\mathrm{Hom}_{\\mathbf{Grp}}(G,H)$ for all groups $G,H$: the subcategory is full."
      solution_sketch: "Fullness asks whether the two hom-sets coincide, so the real question is whether a monoid homomorphism between groups automatically preserves inverses. Show $\\phi(g^{-1})$ is a two-sided inverse of $\\phi(g)$ and invoke uniqueness of inverses."
    anki_seeds:
      - front: "Full subcategory definition?"
        back: "A subcategory containing all $\\mathcal C$-morphisms between its chosen objects; equivalently, determined by a class of objects."
        type: basic
      - front: "The inclusion of a subcategory is always {{c1::faithful}}."
        back: "faithful"
        type: cloze

