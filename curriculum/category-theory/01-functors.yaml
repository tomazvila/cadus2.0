          - problem: "Construct the two-variable hom-bifunctor action in Set for f:Aprime->A and g:B->Bprime, with Aprime={0,1}, A={0,1,2}, B=Bprime={0,1}, f=[2,0], g=[1,0]. Derive the image of each h:A->B using both variance directions. Enumerate Hom(A,B) and Hom(Aprime,Bprime) by lexicographic value lists starting from 0. Give the target index for every source h in order; no composition formula is supplied."
            answer: "3, 1, 3, 1, 2, 0, 2, 0"
