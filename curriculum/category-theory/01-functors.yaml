            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the family P^2(f)(S) with S = {{0,2},{2},{0,1}}. Step 1: by the definition of the iterate on morphisms, P^2(f)(S) = {f[U] : U in S}, the direct image of each member of S. Step 2: f[{0,2}] = {0,1}, f[{2}] = {0}, and f[{0,1}] = {1}. Step 3: the image family is {{0,1},{0},{1}}, which has 3 elements. The answer is 3."
          - problem: "Let T be the endofunctor of Set with T(A) = A x A on objects and T(f) = f x f on functions. A student claims that for A = {0,1} the iterates satisfy |T^n(A)| = 4^n for every n >= 1. Give the smallest n >= 1 for which the claim is false."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full claim is |T^n({0,1})| = 4^n. Step 1: the product functor squares the size at each step, so |T^n({0,1})| = 2^(2^n). Step 2: check small cases: for n = 1 both sides are 4; for n = 2 both sides are 16; for n = 3 the iterate has 2^8 = 256 elements but 4^3 = 64. Step 3: the claim first fails at exponent 3. The answer is 3."
          - problem: "Let T:Set->Set be the product-square functor T(X)=X x X; its arrow map is determined by the two product projections. Construct T^3(f) for f:{0,1}->{0,1} with f(0)=1,f(1)=0. Encode the eight binary coordinates of a nested T^3-object as a binary integer, leftmost coordinate most significant. Give the output codes on inputs 0,1,15,85. Derive the iterated arrow action, rather than assuming a formula for T^3."
            answer: "255, 254, 240, 170"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Each application of T applies the preceding arrow independently to two factors. Three iterations therefore apply f to each of eight coordinates, and the stated encoding reconstructs the output integer. The resulting answer is 255, 254, 240, 170."
          - problem: "Let T:Set->Set have T(X)=X x X, with its arrow map determined by the two projection equations. Construct the arrow map of T^2 on f=[1,0]:{0,1}->{0,1}. Encode ((a,b),(c,d)) by 8a+4b+2c+d. Give the images of inputs 0,1,6,10 under T^2(f)."
            answer: "15, 14, 9, 5"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Apply the product-induced arrow construction twice; the inner and outer projection equations force all four coordinates. The resulting answer is 15, 14, 9, 5."
          - problem: "Write the full proof: the endofunctors of a fixed category C form a monoid under composition, with unit the identity functor 1_C. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full proof. Step 1 (closure): let S and T be endofunctors of C; both are functors C to C, so the composite S o T is a functor C to C, again an endofunctor. Step 2 (unit): on each object A, (1_C o T)(A) = T(A), and on each morphism f, (1_C o T)(f) = T(f); hence 1_C o T = T, and the same argument gives T o 1_C = T, so 1_C is a two-sided unit. Step 3 (associativity): for endofunctors R, S, T and each object A, ((R o S) o T)(A) = R(S(T(A))) = (R o (S o T))(A), and the identical computation on morphisms uses associativity of composition in C, so (R o S) o T = R o (S o T). Step 4 (conclusion): a collection with an associative composition and a two-sided unit is a monoid, so the endofunctors of C form a monoid with unit 1_C, equivalently a one-object category; the powers T^0 = 1_C and T^(n+1) = T o T^n are then unambiguous, and T^m o T^n = T^(m+n). See the solution."
    diagnostic_exemplar:
      problem: "Given functors $F\\colon\\mathcal{B}\\to\\mathcal{C}$ and $G\\colon\\mathcal{C}\\to\\mathcal{D}$, define $GF$ by $(GF)A=G(FA)$ and $(GF)f=G(Ff)$, and prove that $GF$ satisfies both functor laws."
      answer: "Typing: for $f\\colon A\\to B$, $Ff\\colon FA\\to FB$, so $G(Ff)\\colon GFA\\to GFB$. Identities: $(GF)(1_A)=G(F1_A)=G(1_{FA})=1_{GFA}$, using the identity law of $F$ then of $G$. Composites: $(GF)(g\\circ f)=G(F(g\\circ f))=G(Fg\\circ Ff)=G(Fg)\\circ G(Ff)=(GF)g\\circ(GF)f$, using the composition law of $F$ then of $G$. Hence $GF$ is a functor."
      solution_sketch: "Check the typing of $G(Ff)$, then apply each law twice, inner functor first: $G(F1_A)=G(1_{FA})=1_{GFA}$, and $G(F(g\\circ f))$ splits by the law for $F$ and then by the law for $G$."
    anki_seeds:
      - front: "How is the composite functor $GF$ defined?"
        back: "$(GF)A=G(FA)$ on objects and $(GF)f=G(Ff)$ on morphisms."
        type: basic
      - front: "What are the objects and morphisms of $\\mathbf{Cat}$?"
        back: "small categories; functors between them."
        type: basic
      - front: "An isomorphism of categories requires $GF$ and $FG$ to be {{c1::equal to the identity functors}} (not merely naturally isomorphic)."
        back: "equal to the identity functors"
        type: cloze

  - id: functor-examples
    name: Examples of Functors
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: functors
        weight: 0.6
        key: true
      - id: examples-of-categories
        weight: 0.2
      - id: monoids
        weight: 0.2
      - id: groups-intro
        weight: 0.0
      - id: basis-dimension
        weight: 0.0
      - id: linear-transformations
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Forgetful functors
        key_prerequisites: [functors]
        constraints: "Require forgetful functors. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "For the forgetful functor U:Grp->Set, construct the underlying Set arrow of a group map f:Z/3->Z/6 with f(1)=2. Give the full list of U(f), then identify which values verify that U carries the group identity homomorphism on Z/3 to the Set identity by giving its full list."
            answer: "0, 2, 4, 0, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The morphism part of U retains the full underlying function. The identity homomorphism retains exactly the identity function, verifying the functor identity law. The resulting answer is 0, 2, 4, 0, 1, 2."
          - problem: "Let U: Top to Set be the forgetful functor. Let X = {0,1,2} with the discrete topology, Y = {0,1} with the indiscrete topology, and Z = {0,1,2} with the discrete topology. Let f: X to Y send 0,1,2 to 1,0,1, and let g: Y to Z send both points of Y to 2. Every such map is continuous. Compute the value U(g∘f)(2)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: U sends a continuous map to its underlying function, so U(g∘f) is the composite function g∘f. First compute f(2) = 1 from the definition of f. Then compute g(1) = 2, since g is constant with value 2. The answer is 2."
          - problem: "Let U: Mon to Set be the forgetful functor. Let M be the monoid of nonzero residues {1,2,3,4,5,6} under multiplication modulo 7. Let f: M to M be the map f(x) = x^2 (mod 7) and g: M to M the map g(x) = x^3 (mod 7); both are monoid homomorphisms. Compute the value U(g∘f)(2)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: U sends a monoid homomorphism to its underlying function, so U(g∘f) is the composite function g∘f. First compute f(2) = 2^2 = 4 modulo 7. Next compute g(4) = 4^3 = 64 = 63 + 1, which is 1 modulo 7. The answer is 1."
          - problem: "Let U:Grp->Set be the forgetful functor and C2 the additive group {0,1} modulo 2. Enumerate the four underlying self-functions by their binary value lists [0,0],[0,1],[1,0],[1,1]. For each, give 1 if it lies in the image of U:Hom_Grp(C2,C2)->Hom_Set(U(C2),U(C2)), and 0 otherwise. Identify exactly which algebraic data are forgotten and which restrictions still apply to arrows before they are forgotten."
            answer: "1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "U retains the elements and underlying functions while discarding the group-operation label on each object. Its arrow images still come from group homomorphisms, so the zero map and identity occur but the other two self-functions do not. The resulting answer is 1, 1, 0, 0."
          - problem: "To verify the composition law U(g∘f) = U(g)∘U(f) for the forgetful functor U: Top to Set, let f: X to Y and g: Y to Z be continuous maps and let x be a point of X. In the check, the line U(g∘f)(x) = ? is missing. Select the line that is true by the definition of U."
            answer: "g(f(x))"
            answer_contract: {"kind": "label", "options": [["g(f(x))"], ["f(g(x))"], ["g(x) + f(x)"], ["f(x) g(x)"]]}
            solution_sketch: "Rule: U sends a continuous map to its underlying function, and the composite g∘f applies f first, sending x to g(f(x)). The option f(g(x)) reverses the order of composition. The option g(x) + f(x) adds point values, which arbitrary spaces need not carry. The option f(x) g(x) multiplies values in the wrong order and misreads the composite as a product. The answer is g(f(x))."
          - problem: "Let U:Poset->Set forget order. P is the chain 0<1<2 and Q the chain 0<1. Candidate Set maps P->Q have value lists [0,1,0], [0,0,1], [1,0,1], [1,1,1]. Determine which can be U(h) for a Poset morphism h. Give their candidate numbers in increasing order."
            answer: "2, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The forgetful functor retains underlying functions of actual monotone maps; testing the structure condition determines which Set arrows lift. The resulting answer is 2, 4."
          - problem: "Write the full proof: the forgetful functor from Mon to Set is a functor. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Objects: send each monoid (M, *, e) to its underlying set M. Morphisms: send each monoid homomorphism h: M to N to the same function h, viewed as a function from U(M) to U(N). Identity law: the identity homomorphism 1_M is the identity function on M, so U(1_M) = 1_{U(M)}. Composition law: for homomorphisms f: L to M and g: M to N, the composite g∘f is a homomorphism, and its underlying map is the composite of the underlying maps, so U(g∘f) = U(g)∘U(f). Both laws reduce to the single fact that the underlying map of a composite is the composite of the underlying maps. Hence U preserves identities and composition, and U: Mon to Set is a functor."
      - id: kp2
        name: Free functors
        key_prerequisites: [monoids]
        constraints: "Require free functors. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Construct the morphism induced by the free monoid functor from f:{0,1}->{2,3}, f=[3,2], using the requirement that it extend f on generators and preserve the monoid operation. Give its output word on 0101 as a list of letters, followed by the length of its output on the empty word."
            answer: "3, 2, 3, 2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The free extension sends each generator to its prescribed image, preserves concatenation, and sends the empty word to the unit. The resulting answer is 3, 2, 3, 2, 0."
          - problem: "Let F be the free pointed-set functor, with the added basepoint encoded by -1. Construct the pointed map F(f) for f:{0,1,2}->{0,1}, f=[1,0,1], by requiring agreement with f on generators. Give the values on -1,0,1,2 in that order."
            answer: "-1, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Preservation of the freely added basepoint determines the extra value, and the generator equations determine every other value. The resulting answer is -1, 1, 0, 1."
          - problem: "Let F:Set->Vect_Q be the free-vector-space functor. Construct the matrix of F(f) for f:{0,1,2}->{0,1}, f=[1,0,1], using the universal extension of the generator map. Give the six entries row by row, using the increasing bases of source and target."
            answer: "0, 1, 0, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The universal extension sends each source basis vector to its specified target basis vector. These images are the columns of the unique linear map. The resulting answer is 0, 1, 0, 1, 0, 1."
          - problem: "For the free monoid functor, construct the two extensions associated with f:{0,1}->{0,1}, f=[1,0], and g:{0,1}->{2,3}, g=[3,2]. Use uniqueness of extension to establish F(gf)=F(g)F(f), and give both output words on 001 as consecutive lists of letters."
            answer: "2, 2, 3, 2, 2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Both monoid maps agree on each generator, so the universal property identifies them. Their word images follow from preservation of concatenation. The resulting answer is 2, 2, 3, 2, 2, 3."
          - problem: "For the free pointed-set functor F:Set->Set_*, encode each adjoined basepoint by -1. Let f:{0,1}->{0,1,2} have values [2,0] and g:{0,1,2}->{0,1} have values [1,0,0]. Construct F(gf) and F(g)F(f) from the universal extension of maps on the generators. Give both complete value lists on -1,0,1, consecutively. Your construction must account for the newly adjoined point as well as the original generators."
            answer: "-1, 0, 1, -1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The pointed extension is forced to send the adjoined point to the target basepoint and to agree with the original map on generators. These requirements determine both composites and prove they agree on the whole free pointed set. The resulting answer is -1, 0, 1, -1, 0, 1."
          - problem: "Let F:Set->Vect_Q be the free-vector-space functor. For f:{a,b,c}->{u,v} with f(a)=u,f(b)=v,f(c)=u and g:{u,v}->{r} the unique map, construct the linear extensions and compare F(gf) with F(g)F(f). Give the coefficients of u,v in F(f)(2a-3b+4c), followed by the coefficient of r obtained by each composite. The linear-extension rule must be derived from the free construction; no matrix is supplied."
            answer: "6, -3, 3, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The map on generators extends uniquely by linearity, so coefficients with the same image generator add. Applying this extension twice or extending the composite generator map gives the same coefficient of r. The resulting answer is 6, -3, 3, 3."
          - problem: "Write the full proof: Show the free monoid construction X -> X* (finite words under concatenation) extends to a functor Set -> Mon. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1. Object part: for a set X, let X* be the set of finite words with letters in X, together with the empty word; concatenation is associative and the empty word is its unit, so X* is a monoid. Step 2. Morphism part: for a function f: X -> Y define f^*: X* -> Y* by f^*(x1...xn) = f(x1)...f(xn) on nonempty words and f^*(empty word) = empty word. Step 3. Homomorphism check: for words u and v, the letters of uv are the letters of u followed by the letters of v, so f^*(uv) = f^*(u) f^*(v), and the empty word is fixed; hence f^* is a monoid homomorphism. Step 4. Identity law: for the identity function 1_X, the map (1_X)^* fixes every letter and the empty word, so (1_X)^* is the identity homomorphism on X*. Step 5. Composition law: for f: X -> Y and g: Y -> Z, both (g o f)^* and g^* o f^* send each letter x to g(f(x)) and fix the empty word, so they agree on every one-letter word and on the empty word; since both are homomorphisms and every word is a concatenation of single letters, they agree on all words, giving (g o f)^* = g^* o f^*. Step 6. Both functor laws hold on the generators (single letters and the empty word), and the homomorphism property propagates them to all words; therefore X -> X* with f -> f^* is a functor Set -> Mon."
      - id: kp3
        name: Constant and diagonal functors
        key_prerequisites: [functors]
        constraints: "Require constant and diagonal functors. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Construct the constant functor from the arrow category 0->1 to the one-object category B(Z/4) at its sole object. Give its values on id_0, id_1 and the nonidentity arrow, using the defining constant-functor requirement."
            answer: "0, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A constant functor uses the identity of the fixed object for every arrow. Here that identity is the additive unit. The resulting answer is 0, 0, 0."
          - problem: "Construct the diagonal functor on the chain category 0<1<2. Encode each product object by its coordinate pair. Give the source,target of the image of 0->2, flattened as four numbers, followed by the source,target of the image of id_1."
            answer: "0, 0, 2, 2, 1, 1, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Both projection functors composed with the diagonal must recover the original functor on objects and arrows; this forces the duplicated endpoints. The resulting answer is 0, 0, 2, 2, 1, 1, 1, 1."
          - problem: "Construct the diagonal functor Delta:C->C x C. For arbitrary composable f:X->Y,g:Y->Z, derive both components of Delta(g)Delta(f)from product-category composition and compare them with Delta(gf). Encode f=1,g=2. Give the two component words consecutively in conventional composition order. Append1if Delta(f)=(f,id_Y)would give the same functor for every C, or0otherwise."
            answer: "2, 1, 2, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The diagonal sends an arrow to itself in each coordinate. The two product-category components therefore both compose as gf; replacing the second component by id_Y is not even correctly typed for general f. The resulting answer is 2, 1, 2, 1, 0."
          - problem: "A proposed constant-object functor from B(Z/2) to B(Z/3) has the sole object fixed and sends every arrow to a single arrow c. Determine c by imposing the identity and composition laws, and give F(0),F(1)."
            answer: "0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Preservation of the source identity forces the constant arrow to be the target identity. Its idempotent composite then satisfies the composition law. The resulting answer is 0, 0."
          - problem: "Claim: the diagonal functor Delta: C -> C x C preserves composition, where C is the poset a < b < c. Step 1: Delta sends the arrow a <= b to the pair (a <= b, a <= b). Step 2: in C x C, the pair (b <= c, b <= c) composed with the pair (a <= b, a <= b) equals the pair (a <= c, a <= c). Step 3: Delta sends the arrow a <= c to the pair (a <= c, a <= b). Step 4: therefore Delta(b <= c) composed with Delta(a <= b) equals Delta(a <= c). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct by the definition of Delta on morphisms: every arrow is sent to its diagonal pair. Step 2 is correct: composition in C x C is coordinatewise, and in the poset the arrow b <= c composed after a <= b is a <= c, so both coordinates give a <= c. Step 3 is the first invalid step: the definition of Delta forces Delta(a <= c) = (a <= c, a <= c), so writing the second coordinate as a <= b is the error of copying the codomain of the first arrow into the second slot. Step 4 states the true composition law and becomes valid once Step 3 is corrected. The answer is Step 3."
          - problem: "To check that the constant functor Delta_1: C -> D preserves composition, one rewrites the value of Delta_1 on a composite of two morphisms of C as the identity of 1 composed with the identity of 1. Which property of Delta_1 justifies this rewrite? Select the fact."
            answer: "Delta_1 sends every morphism of C to the identity of the fixed object 1"
            answer_contract: {"kind": "label", "options": [["Delta_1 sends every morphism of C to the identity of the fixed object 1"], ["Delta_1 sends every morphism of C to the identity of its own target"], ["Delta_1 sends every object of C to the identity of the fixed object 1"], ["composition of any two morphisms of C is again an identity"]]}
            solution_sketch: "The definition of the constant functor on morphisms sends every morphism of C to the identity of the fixed object 1, so the value on any composite is id_1, which factors as id_1 composed with id_1. The option about the identity of its own target is the error of confusing Delta_1 with a target-respecting map; Delta_1 ignores the morphism completely. The option about every object going to the identity of 1 mixes up the action on objects, which gives the object 1 itself, with the action on morphisms. The option that a composite in C is an identity is a false property of C that the composition law never uses. The answer is: Delta_1 sends every morphism of C to the identity of the fixed object 1."
          - problem: "Write the full proof: the diagonal functor Delta: C -> C x C is a functor. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: define Delta on objects by Delta(C) = (C, C) for every object C of C. Step 2: define Delta on morphisms by Delta(f) = (f, f) for every morphism f from C to C-prime of C; the pair (f, f) is a morphism from (C, C) to (C-prime, C-prime) in the product category, since each coordinate is such a morphism. Step 3: identity law: Delta(1_C) = (1_C, 1_C), and the identity morphism of the object (C, C) in C x C is exactly the pair (1_C, 1_C), so Delta preserves identities. Step 4: composition law: for composable morphisms f from C to C-prime and g from C-prime to C-double-prime, Delta(g composed with f) = (g composed with f, g composed with f), while Delta(g) composed with Delta(f) = (g, g) composed with (f, f), which equals (g composed with f, g composed with f) by coordinatewise composition in the product category. The two sides agree. Step 5: both functor laws hold, so Delta: C -> C x C is a functor."
    diagnostic_exemplar:
      problem: "For a function $f\\colon X\\to Y$ define $f^*\\colon X^*\\to Y^*$ on the free monoids of finite words by $f^*(x_1\\cdots x_n)=f(x_1)\\cdots f(x_n)$ and $f^*(\\varepsilon)=\\varepsilon$. Show that $f^*$ is a monoid homomorphism and that $(-)^*$ is a functor $\\mathbf{Set}\\to\\mathbf{Mon}$."
      answer: "Homomorphism: $f^*$ sends the unit $\\varepsilon$ to $\\varepsilon$ and preserves concatenation, since applying $f$ letterwise to $uv$ gives $f^*(u)f^*(v)$. Functor laws: $1_X^*$ applies $1_X$ letterwise, so $1_X^*=1_{X^*}$; and $(g\\circ f)^*$ applies $g\\circ f$ letterwise, which is the same as applying $f$ letterwise then $g$ letterwise, so $(g\\circ f)^*=g^*\\circ f^*$. Hence $(-)^*$ is a functor."
      solution_sketch: "Everything reduces to the phrase: apply $f$ letterwise. That description makes $f^*$ fix $\\varepsilon$ and respect concatenation, and it makes applying $g\\circ f$ letterwise visibly the same as applying $f$ letterwise and then $g$ letterwise."
    anki_seeds:
      - front: "What does a forgetful functor do?"
        back: "drops structure, e.g. $\\mathbf{Grp}\\to\\mathbf{Set}$."
        type: basic
      - front: "What does a free functor do?"
        back: "builds the free structure on a set, e.g. $X\\mapsto X^*$ ($\\mathbf{Set}\\to\\mathbf{Mon}$)."
        type: basic
      - front: "The constant functor $\\Delta_D$ sends every morphism to..."
        back: "the identity $1_D$."
        type: basic

  - id: covariant-contravariant-functors
