          - problem: "Claim: the pair built on the element 1 is initial in $(\\star \\downarrow G)$, so it is a universal arrow from $\\star$ to G, where C is the category with a single object $\\star$ and only the identity arrow, D is the chain $0 \\le 1$ viewed as a poset category, and $G\\colon D \\to C$ is the unique functor. Step 1: the objects of $(\\star \\downarrow G)$ are the pairs built on 0 and on 1, one for each element, since the arrow from $\\star$ to $G$ of each element exists and is unique. Step 2: a morphism from the pair built on 1 to the pair built on 0 is an arrow d from 1 to 0 in D with $G(d)$ composed with the first arrow equal to the second. Step 3: there is no arrow from 1 to 0, but the arrow from 0 to 1 points the other way, so we may use it as the required morphism. Step 4: hence the pair built on 1 has a morphism to every object and is initial. Which step is the first step that is not valid?"
