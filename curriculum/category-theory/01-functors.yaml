            solution_sketch: "Setup. View C as the functor from $\\mathbf{1}$ to the category picking the object C; then an object of $(C \\downarrow G)$ is a pair $(D, f)$ with $f\\colon C \\to G(D)$, and a morphism from $(D, f)$ to $(D', f')$ is an arrow $d\\colon D \\to D'$ with $G(d) \\circ f = f'$. Step 1, existence clause. The pair $(D_0, f_0)$ is initial when for every object $(D, f)$ there exists a morphism from $(D_0, f_0)$ to $(D, f)$; by the description of morphisms this says exactly that there exists an arrow $d\\colon D_0 \\to D$ with $G(d) \\circ f_0 = f$, which is the existence clause of a universal arrow from C to G. Step 2, uniqueness clause. Initiality also demands that this morphism be unique; by the description of morphisms this says exactly that such an arrow $d$ is unique, which is the uniqueness clause. Step 3, conclusion. Hence $(D_0, f_0)$ is initial in $(C \\downarrow G)$ if and only if $f_0$ is a universal arrow from C to G; since initial objects are unique up to a unique isomorphism, universal arrows from C to G are unique up to a unique isomorphism as well."
