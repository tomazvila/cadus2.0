            solution_sketch: "Reversing the source order makes H preserve each arrow direction, and the unique composable chain has the required image composite. In the unreversed chain the image of 0->1 would point from 2 to 1, so a covariant functor with these objects cannot exist. The resulting answer is 0, 1, 1, 2, 0, 2, 1, 0."
          - problem: "Build the arrow action from the opposite category and verify its direction. Let H=Hom(-,C) on Set, with A={0,...,1}, B={0,...,2}, C={0,...,1}. Let f:A->B have values [2, 0]. Construct the induced map H(f) with its direction determined by typing. Enumerate Hom(B,C) and Hom(A,C) lexicographically from index 0. Give, for each function in Hom(B,C), the index of its image in Hom(A,C)."
            answer: "0, 2, 0, 2, 1, 3, 1, 3"
