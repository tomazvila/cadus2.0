    knowledge_points:
      - id: kp1
        name: The data and the typing discipline
        key_prerequisites: [category-definition]
        step_check:
          step: 'the codomain of $Ff$ is $\mathcal{P}(B)$ and the domain of $Fg$ is $\mathcal{P}(B)$'
          question: 'Why is the composite $Fg\circ Ff$ defined?'
          options:
            - '$Ff$ and $Fg$ are both functions between power sets, so any two of them can be composed'
            - '$Ff$ ends in the set where $Fg$ starts, because $f$ ends at $B$ and $g$ starts at $B$'
            - '$F$ preserves composition, so $Fg\circ Ff$ is defined for every pair of morphisms'
          answer: '$Ff$ ends in the set where $Fg$ starts, because $f$ ends at $B$ and $g$ starts at $B$'
          why: 'The typing rule gives $Ff\colon FA\to FB$ and $Fg\colon FB\to FC$, so the middle object $FB$ is shared and the composite exists.'
        constraints: 'Categories are given in text: posets as an order relation, small categories as a list of morphisms. Items ask for the typing of Ff, counts of possible maps, or whether a functor exists.'
        exemplars:
          - problem: 'Let $\mathbf{C}$ be the poset $0<1<2$ viewed as a category, with one morphism $a\to b$ when $a\le b$. Let $\mathbf{D}$ be the set $\{1,2,\dots,12\}$ ordered by divisibility, with one morphism $m\to n$ when $m$ divides $n$. A functor $F\colon\mathbf{C}\to\mathbf{D}$ has $F(0)=2$, $F(1)=4$ and $F(2)=12$. What are the domain and codomain of $F(f)$ for the morphism $f\colon 1\to 2$?'
            answer: '(4, 12)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The typing rule says that $F(f)$ runs from $F(1)$ to $F(2)$. Here $F(1)=4$ and $F(2)=12$, and $4$ divides $12$, so the morphism $4\to 12$ exists in $\mathbf{D}$. The domain is $4$ and the codomain is $12$.'
          - problem: 'Let $\mathbf{C}$ be the poset $0<1<2$ viewed as a category, and let $\mathbf{D}$ be the integers ordered by $\le$, with one morphism $m\to n$ when $m\le n$. A functor $F\colon\mathbf{C}\to\mathbf{D}$ has $F(0)=3$, $F(1)=6$ and $F(2)=12$. For $f\colon 0\to 1$ and $g\colon 1\to 2$, what are the domain and codomain of $F(g\circ f)$?'
            answer: '(3, 12)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The composite $g\circ f$ is a morphism $0\to 2$. By the typing rule, $F(g\circ f)$ runs from $F(0)=3$ to $F(2)=12$. This agrees with $Fg\circ Ff$, which runs $3\to 6\to 12$.'
          - problem: 'A university has two years, $Y_1$ and $Y_2$, and one morphism $Y_1\to Y_2$. A functor $F$ to $\mathbf{Set}$ assigns to each year its set of courses: $F(Y_1)$ has $4$ courses and $F(Y_2)$ has $3$ courses. The morphism $Y_1\to Y_2$ is sent to a function that assigns to each year-1 course a year-2 course. How many different functions could $F$ assign to this morphism?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The typing rule makes the image of $Y_1\to Y_2$ a function from $F(Y_1)$ to $F(Y_2)$. Each of the $4$ year-1 courses has $3$ possible images, so there are $3^4=81$ functions. Multiplying $4\cdot 3$ would count the wrong thing.'
          - problem: 'Is there a functor $F$ from the poset category $0<1<2$ to the poset category $(\mathbb{N},\le)$ with $F(0)=3$, $F(1)=2$ and $F(2)=5$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is a functor", "functor"], ["no", "it is not", "false", "not a functor", "not"]]}
            solution_sketch: 'The morphism $0\to 1$ would have to go to a morphism $F(0)\to F(1)$, that is $3\to 2$ in $(\mathbb{N},\le)$. There is no such morphism, because $3$ is not less than or equal to $2$. One missing morphism is enough: the answer is no, even though $2\le 5$.'
          - problem: 'A category has objects $A$, $B$, $C$ and morphisms $f\colon A\to B$, $g\colon B\to C$, $g\circ f\colon A\to C$, together with the identities. A functor $F$ to $\mathbf{Set}$ has $F(A)$ with $5$ elements, $F(B)$ with $2$ elements and $F(C)$ with $4$ elements. Sam says that $F(g\circ f)$ is a function from $F(B)$ to $F(C)$ and counts $4^2=16$ possible functions. How many functions are there with the correct domain and codomain?'
            answer: '1024'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $g\circ f$ runs from $A$ to $C$, so $F(g\circ f)$ runs from $F(A)$ to $F(C)$. Sam used $F(B)$ as the domain by mistake. A function from a set of $5$ elements to a set of $4$ elements has $4$ choices for each of $5$ inputs, so there are $4^5=1024$.'
          - problem: 'How many functors are there from the poset category $0<1$ to the poset category $0<1<2$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor sends $0$ and $1$ to objects $a=F(0)$ and $b=F(1)$, and it needs a morphism $a\to b$, so $a\le b$. The pairs with $a\le b$ are $(0,0)$, $(0,1)$, $(0,2)$, $(1,1)$, $(1,2)$ and $(2,2)$. So there are $6$ functors.'
          - problem: 'How many functors are there from the poset category $0<1<2$ to the poset category $0<1$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor is a choice of $F(0)\le F(1)\le F(2)$ in $\{0,1\}$, because each morphism needs a morphism between the images. The choices are $000$, $001$, $011$ and $111$. So there are $4$ functors.'
          - problem: 'Is there a functor $F$ from the poset category $0<1<2$ to the set $\{1,2,\dots,12\}$ ordered by divisibility, with one morphism $m\to n$ when $m$ divides $n$, such that $F(0)=2$, $F(1)=6$ and $F(2)=12$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "not"]]}
            solution_sketch: 'The morphisms $0\to 1$, $1\to 2$ and $0\to 2$ would go to $2\to 6$, $6\to 12$ and $2\to 12$. Each of these exists, because $2$ divides $6$, $6$ divides $12$ and $2$ divides $12$. So there is such a functor.'
          - problem: 'Write the full proof that, for a functor $F$ and morphisms $f\colon A\to B$ and $g\colon B\to C$, the morphisms $F(g\circ f)$ and $Fg\circ Ff$ both have domain $FA$ and codomain $FC$.'
            answer: 'F(g∘f) and Fg∘Ff have the same type'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Step 1: since $f\colon A\to B$, the typing rule gives $Ff\colon FA\to FB$. Step 2: since $g\colon B\to C$, it gives $Fg\colon FB\to FC$. Step 3: the codomain of $Ff$ is $FB$ and the domain of $Fg$ is $FB$, so $Fg\circ Ff$ is defined and runs from $FA$ to $FC$. Step 4: the composite $g\circ f$ is a morphism $A\to C$, so $F(g\circ f)$ runs from $FA$ to $FC$. Both morphisms have domain $FA$ and codomain $FC$, so the composition law compares two morphisms of the same type.'
      - id: kp2
        name: The two laws and how to verify them
        key_prerequisites: [composition-associativity-identity]
        try_first:
          problem: 'A functor $F$ from $B(\mathbb{Z}/9)$ to itself sends the morphism $4$ to the morphism $5$. Composition in $B(\mathbb{Z}/9)$ is addition modulo $9$. What does $F$ send the morphism $8$ to?'
          answer_contract: {"kind": "exact"}
          answer: '1'
          reveal: 'The morphism $8$ is $4$ followed by $4$, so the composition law gives $F(8)=F(4)+F(4)=5+5=10$, which is $1$ modulo $9$. The functor must turn composition in the source into composition in the target.'
        step_check:
          step: 'The two sides agree on every list (and both send $[\,]$ to $[\,]$), so $F(g\circ f)=Fg\circ Ff$'
          question: 'Why does agreement on every list show that $F(g\circ f)$ and $Fg\circ Ff$ are equal?'
          options:
            - 'Both sides are built from the same letters, so they are equal by definition of a functor'
            - 'A check on one typical list is enough, because every other list behaves in the same way'
            - 'Two functions with one domain and codomain are equal when they agree at every input'
          answer: 'Two functions with one domain and codomain are equal when they agree at every input'
          why: 'Both $F(g\circ f)$ and $Fg\circ Ff$ are functions from $A^{*}$ to $C^{*}$, and a function is determined by its values at all inputs.'
        constraints: 'Functors are given by explicit tables or rules on small finite sets or on one-object categories. Items compute images from the two laws, spot a law that fails, or give a verdict about a proposed rule. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'A category has objects $A$, $B$, $C$ and morphisms $f\colon A\to B$, $g\colon B\to C$ and $h\colon A\to C$, together with the identities, and $h=g\circ f$. A functor $F$ to $\mathbf{Set}$ has $F(A)=\{1,2\}$, $F(B)=\{3,4\}$, $F(C)=\{5,6\}$, with $F(f)$ sending $1$ to $3$ and $2$ to $4$, and $F(g)$ sending $3$ to $5$ and $4$ to $6$. What is $F(h)(1)$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because $h=g\circ f$, the composition law gives $F(h)=F(g)\circ F(f)$. So $F(h)(1)=F(g)(F(f)(1))$. Now $F(f)(1)=3$ and $F(g)(3)=5$, so $F(h)(1)=5$.'
          - problem: 'A category has objects $A$, $B$, $C$ and morphisms $f\colon A\to B$, $g\colon B\to C$, $g\circ f\colon A\to C$, together with the identities. A functor $F$ sends every object to the single object of $B(\mathbb{Z}/7)$, where composition is addition modulo $7$. It sends $f$ to $5$ and $g$ to $6$. What does $F$ send $g\circ f$ to?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composition law says $F(g\circ f)=F(g)\circ F(f)$. In $B(\mathbb{Z}/7)$ composition is addition modulo $7$, so the image is $6+5=11$. Since $11=7+4$, the image is $4$.'
          - problem: 'Let $\mathcal{P}$ be the image functor on $\mathbf{Set}$, which sends a function $f\colon X\to Y$ to the function $S\mapsto\{f(s):s\in S\}$ on subsets. Let $f\colon\{1,2,3\}\to\{a,b,c\}$ be given by $f(1)=a$, $f(2)=a$, $f(3)=b$, and let $g\colon\{a,b,c\}\to\{x,y\}$ be given by $g(a)=x$, $g(b)=y$, $g(c)=x$. Using the composition law, how many elements does the subset $\mathcal{P}(g\circ f)(\{1,2,3\})$ of $\{x,y\}$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the composition law, $\mathcal{P}(g\circ f)=\mathcal{P}(g)\circ\mathcal{P}(f)$. First $\mathcal{P}(f)(\{1,2,3\})=\{a,b\}$. Then $\mathcal{P}(g)(\{a,b\})=\{x,y\}$, which has $2$ elements.'
          - problem: 'On $\mathbf{Set}$, let $Q(X)=X\times X$ and $Q(f)(x,y)=(f(x),f(x))$ for a function $f\colon X\to Y$. For $X=\{0,1\}$ and the identity function $1_X$, what is $Q(1_X)(0,1)$?'
            answer: '(0, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The rule gives $Q(1_X)(0,1)=(1_X(0),1_X(0))=(0,0)$. The identity law would require $Q(1_X)(0,1)=(0,1)$. The two differ, so $Q$ breaks the identity law.'
          - problem: 'Let $F$ be the image functor on subsets, with $F(h)(S)=\{h(s):s\in S\}$. Take $f(x)=x+1$ and $g(x)=2x$ on the integers and $S=\{1,2\}$. Sam writes $F(g\circ f)=F(f)\circ F(g)$ and computes $F(f)(F(g)(S))=\{3,5\}$. What is the correct value of $F(g\circ f)(S)$?'
            answer: '4, 6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composition law has the order $F(g\circ f)=F(g)\circ F(f)$, with $f$ applied first. First $F(f)(S)=\{2,3\}$, then $F(g)$ doubles each element to give $\{4,6\}$. Directly, $(g\circ f)(1)=4$ and $(g\circ f)(2)=6$.'
          - problem: 'In a program $\mathrm{map}\ h\ xs$ applies $h$ to every entry of the list $xs$. This is the action on functions of the list functor. Let $f$ double a number and let $g$ add $3$. What is the third entry of $\mathrm{map}\ (g\circ f)\ [1,2,5]$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composition law says $\mathrm{map}\ (g\circ f)$ equals $\mathrm{map}\ g$ after $\mathrm{map}\ f$. The third entry is $5$, which $f$ doubles to $10$ and then $g$ turns into $13$. So the third entry is $13$.'
          - problem: 'A functor $F$ assigns to each unit conversion the factor by which it multiplies a number, so $F$ lands in the one-object category of positive numbers under multiplication. Let $f$ convert miles to kilometres, let $g$ convert kilometres to metres, so $g\circ f$ converts miles to metres. The conversion $g\circ f$ has $F(g\circ f)=1600$ and $F(f)=1.6$. What is $F(g)$?'
            answer: '1000'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composition law says $F(g\circ f)=F(g)\cdot F(f)$ in this category, so $1600=F(g)\cdot 1.6$. Dividing gives $F(g)=1600/1.6=1000$. This is the number of metres in a kilometre.'
          - problem: 'Define $G$ on $\mathbf{Set}$ by sending every set $X$ to $\{0,1\}$ and every function $f$ to the function that swaps $0$ and $1$. Is $G$ a functor $\mathbf{Set}\to\mathbf{Set}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is a functor", "functor"], ["no", "it is not", "false", "not a functor", "not"]]}
            solution_sketch: 'The identity law needs $G(1_X)$ to be the identity on $\{0,1\}$, but $G(1_X)$ swaps $0$ and $1$. So the identity law fails, and $G$ is not a functor. The composition law fails too, because $G(g\circ f)$ swaps while $G(g)\circ G(f)$ swaps twice.'
          - problem: 'Define $H$ on $\mathbf{Set}$ by sending every set $X$ to $\{0,1\}$ and every function $f$ to the identity function of $\{0,1\}$. Is $H$ a functor $\mathbf{Set}\to\mathbf{Set}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "not"]]}
            solution_sketch: 'The identity function $1_X$ goes to the identity of $\{0,1\}$, so the identity law holds. For composition, $H(g\circ f)$ is the identity of $\{0,1\}$, and so is $H(g)\circ H(f)$, which is the identity after the identity. So both laws hold and $H$ is a functor.'
          - problem: 'Write the full proof that the forgetful functor $U$ from $\mathbf{Mon}$ to $\mathbf{Set}$ satisfies both functor laws.'
            answer: 'U satisfies both functor laws'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The functor $U$ sends a monoid to its underlying set and a homomorphism to its underlying function. Identity law: the identity homomorphism $1_M$ is the identity function on $M$, so $U(1_M)=1_{UM}$. Composition law: for homomorphisms $f\colon A\to B$ and $g\colon B\to C$, the underlying function of $g\circ f$ sends $x$ to $g(f(x))$, which is $(Ug\circ Uf)(x)$. So $U(g\circ f)=Ug\circ Uf$, and both laws hold.'
      - id: kp3
        name: Recognizing assignments that are not functors
        key_prerequisites: [examples-of-categories, abelian-groups]
        step_check:
          step: 'Compare with the required identity: $\mathrm{id}_{F(A)}(1,2)=(1,2)$, and $(2,1)\neq(1,2)$ in $A\times A$'
          question: 'Why is one explicit pair enough to show that $F$ is not a functor?'
          options:
            - 'A law must hold for every morphism and element, so a single failure breaks the law'
            - 'A functor must send every pair to itself, so any swap of coordinates is forbidden'
            - 'The identity law is the only law of a functor, so one failed check settles the matter'
          answer: 'A law must hold for every morphism and element, so a single failure breaks the law'
          why: 'Each functor law is a statement about all morphisms, so one morphism where it fails is a complete counterexample.'
        constraints: 'Proposed assignments are given by explicit rules on small categories, one-object categories or groups. Items locate the failing step, compute the value a law forces, or classify which laws fail. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'Sam claims that the preimage assignment is a functor from $\mathbf{Set}$ to $\mathbf{Set}$. Step 1: send each set $A$ to its power set $\mathcal{P}(A)$. Step 2: send each function $f\colon A\to B$ to the preimage map, which takes a subset of $B$ to its preimage, a subset of $A$. Step 3: this gives a map from $\mathcal{P}(A)$ to $\mathcal{P}(B)$, as a functor requires. Step 4: identities and composites are preserved. Which step is the first that is not valid, and why?'
            answer: 'Step 3: the preimage map takes subsets of B to subsets of A, so it runs from P(B) to P(A), the opposite direction to the one a functor needs.'
            answer_contract: {"kind": "written"}
            solution_sketch: 'Step 1 and Step 2 describe the assignment correctly. In Step 3 the preimage map takes subsets of $B$ to subsets of $A$, so it runs from $\mathcal{P}(B)$ to $\mathcal{P}(A)$. This is the opposite direction to the one a functor needs, and Step 4 is not reached because the typing already fails.'
          - problem: 'The center assignment sends each group to its center and each homomorphism to the same map on centers. Let $\varphi\colon\mathbb{Z}/2\to S_3$ be the homomorphism that sends the element $1$ to the transposition $(1\,2)$. The center of $\mathbb{Z}/2$ is all of $\mathbb{Z}/2$, and the center of $S_3$ has only the identity. How many elements of the center of $\mathbb{Z}/2$ are sent outside the center of $S_3$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The element $0$ goes to the identity, which lies in every center. The element $1$ goes to $(1\,2)$, which is not the identity, so it is outside the center of $S_3$. So exactly $1$ element is sent outside, and the restriction of $\varphi$ is not a map between the centers.'
          - problem: 'On the one-object category $B(\mathbb{Z}/4)$, composition is addition modulo $4$. A rule sends each morphism $n$ to $n^2$ modulo $4$, so it sends $1$ to $1$. If the rule were a functor, what value would the composition law force for the image of the morphism $2$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The morphism $2$ is $1$ followed by $1$, so a functor needs $F(2)=F(1)+F(1)=1+1=2$. The rule gives $2^2=4$, which is $0$ modulo $4$. These differ, so the rule is not a functor.'
          - problem: 'On the one-object category $B(\mathbb{Z}/3)$, composition is addition modulo $3$. A rule sends each morphism $n$ to $n+1$ modulo $3$. Which of the two functor laws does the rule break?'
            answer: 'both laws'
            answer_contract: {"kind": "label", "options": [["both laws", "both", "identity and composition", "both laws fail", "both fail", "the identity law and the composition law"], ["neither law", "neither", "none"], ["identity law only", "identity only", "only the identity law"], ["composition law only", "composition only", "only the composition law"]]}
            solution_sketch: 'The identity morphism is $0$, and the rule sends it to $0+1=1$, so the identity law fails. For composition, $F(a+b)=a+b+1$ but $F(a)+F(b)=a+b+2$, which are different modulo $3$, so the composition law fails too. Both laws fail.'
          - problem: 'Three cards lie in positions $1$, $2$, $3$. The morphisms of a one-object category are the shuffles of the cards, and $t\circ s$ means do $s$ first and then $t$. Let $s$ move position $1$ to $2$, $2$ to $3$ and $3$ to $1$, and let $t$ swap positions $2$ and $3$. A rule $F$ sends each shuffle to its inverse shuffle. The shuffle $F(t\circ s)$ sends position $1$ to position $3$. To which position does $F(t)\circ F(s)$ send position $1$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shuffle $F(s)$ is the inverse of $s$, so it sends $1$ to $3$. The shuffle $F(t)$ is $t$ itself, so it sends $3$ to $2$. So $F(t)\circ F(s)$ sends $1$ to $2$, while $F(t\circ s)$ sends $1$ to $3$, and the composition law fails.'
          - problem: 'There are $27$ functions from $\mathbb{Z}/3$ to itself. How many of them are the morphism part of a functor $B(\mathbb{Z}/3)\to B(\mathbb{Z}/3)$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor must send $0$ to $0$, and its value on $1$ decides the rest, because $F(2)=F(1)+F(1)$. The value $F(1)=k$ is allowed when $3k$ is $0$ modulo $3$, which holds for $k=0,1,2$. So $3$ of the $27$ functions are functors.'
          - problem: 'A shop adds a flat handling fee of $2$ to every payment, so a payment of $n$ costs $n+2$. A customer pays $3$ and then $4$ in two payments, and another pays $7$ in one payment. How much more do the two payments cost in total than the one payment?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Two payments cost $(3+2)+(4+2)=11$. One payment costs $7+2=9$. The difference is $11-9=2$, which is the extra fee, so the rule $n\mapsto n+2$ does not preserve composition.'
          - problem: 'Write the full proof that the assignment sending each group to its center and each homomorphism to its restriction is not a functor from $\mathbf{Grp}$ to $\mathbf{Grp}$.'
            answer: 'The center is not a functor Grp -> Grp'
            answer_contract: {"kind": "none"}
            solution_sketch: 'A functor would send a homomorphism $\varphi\colon G\to H$ to the restriction of $\varphi$ to the center of $G$, with values in the center of $H$. This needs $\varphi$ to carry the center of $G$ into the center of $H$ for every $\varphi$. Take $G=\mathbb{Z}/2$, which is abelian, so its center is all of $G$, and $H=S_3$, whose center is trivial. Let $\varphi$ send $1$ to the transposition $(1\,2)$. Then $(1\,2)$ does not commute with $(1\,3)$, so it is not central in $S_3$, the restriction is not a map into the center of $S_3$, and the assignment is not a functor.'
    diagnostic_exemplar:
      problem: "Define $F\\colon\\mathbf{Set}\\to\\mathbf{Set}$ by $F(A)=A\\times\\{0,1\\}$ and $F(f)=f\\times 1_{\\{0,1\\}}$. Give the domain and codomain of $F(f)$ for $f\\colon A\\to B$, and verify both functor laws."
      answer: "$F(f)\\colon A\\times\\{0,1\\}\\to B\\times\\{0,1\\}$, $(a,i)\\mapsto(f(a),i)$. Identity law: $F(1_A)(a,i)=(a,i)$, so $F(1_A)=1_{FA}$. Composition law: $F(g\\circ f)(a,i)=(g(f(a)),i)=F(g)(f(a),i)=F(g)(F(f)(a,i))$, so $F(g\\circ f)=Fg\\circ Ff$. Both laws hold, so $F$ is a functor."
      solution_sketch: "Type $F(f)$ first — it must run $A\\times\\{0,1\\}\\to B\\times\\{0,1\\}$ — then check both laws elementwise on a pair $(a,i)$. The tag $i$ is carried untouched, so each law collapses to the corresponding fact about $f$ alone."
    anki_seeds:
      - front: "On morphisms, a functor $F$ sends each $f\\colon A\\to B$ to..."
        back: "a morphism $Ff\\colon FA\\to FB$."
        type: basic
      - front: "How does a functor act on an identity: $F(1_A)=$?"
        back: "$F(1_A)=1_{FA}$."
        type: basic
      - front: "How does a functor act on a composite: $F(g\\circ f)=$?"
        back: "$F(g\\circ f)=Fg\\circ Ff$."
        type: basic

