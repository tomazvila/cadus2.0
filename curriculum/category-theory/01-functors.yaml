          - problem: "In Set x Set, take arrows (f,g) and (h,k), with f=[1,0],g=[0,1,0],h=[2,0],k=[1,0] on zero-based sets. Construct their composite by requiring both projection functors to preserve composition. Give the full value list of the first component followed by that of the second."
            answer: "0, 2, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
