      - id: kp1
        name: Definitions via the action on hom-sets
        key_prerequisites: [functors]
        constraints: "Require definitions via the action on hom-sets. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Classify the functor by its action on parallel arrows. For each functor below, the listed map is its only hom-set map that is not an identity bijection or an empty-to-empty map. 1: hom-map values [0, 0, 1], target arrows 0,...,1. For each functor give two bits: full, faithful (1=yes, 0=no), in the displayed order."
            answer: "1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness requires every target arrow to lift, and faithfulness requires distinct parallel source arrows to stay distinct. Test both on each listed hom-set map. The resulting answer is 1, 0."
          - problem: "Compare fullness and faithfulness of two functors separately. For each functor below, the listed map is its only hom-set map that is not an identity bijection or an empty-to-empty map. 1: hom-map values [0, 0, 1, 2], target arrows 0,...,3; 2: hom-map values [0, 1, 2, 3], target arrows 0,...,3. For each functor give two bits: full, faithful (1=yes, 0=no), in the displayed order."
            answer: "0, 0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness requires every target arrow to lift, and faithfulness requires distinct parallel source arrows to stay distinct. Test both on each listed hom-set map. The resulting answer is 0, 0, 1, 1."
          - problem: "Determine which of the two hom-set conditions succeeds. For each functor below, the listed map is its only hom-set map that is not an identity bijection or an empty-to-empty map. 1: hom-map values [0, 2], target arrows 0,...,3. For each functor give two bits: full, faithful (1=yes, 0=no), in the displayed order."
            answer: "0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness requires every target arrow to lift, and faithfulness requires distinct parallel source arrows to stay distinct. Test both on each listed hom-set map. The resulting answer is 0, 1."
          - problem: "Check the hom-set definitions, including both collisions and missing lifts. For each functor below, the listed map is its only hom-set map that is not an identity bijection or an empty-to-empty map. 1: hom-map values [0, 0, 0, 1], target arrows 0,...,2; 2: hom-map values [0, 1], target arrows 0,...,1. For each functor give two bits: full, faithful (1=yes, 0=no), in the displayed order."
            answer: "0, 0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness requires every target arrow to lift, and faithfulness requires distinct parallel source arrows to stay distinct. Test both on each listed hom-set map. The resulting answer is 0, 0, 1, 1."
          - problem: "Claim: if F and G are full functors, then the composite GF is full. Argument. Step 1: Let k be a morphism from GFA to GFB in the target category. Step 2: Since G is full, there is a morphism h from FA to FB with Gh = k. Step 3: Since F is full, there is a morphism f from A to B with Gf = h. Step 4: Then (GF)f = G(Ff) = Gh = k. Step 5: Hence (GF)_{A,B} is surjective, so GF is full. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: k is a morphism from GFA to GFB, exactly the kind of morphism that surjectivity of (GF)_{A,B} must hit. Step 2 is valid: fullness of G gives h from FA to FB with Gh = k. Step 3 is the first invalid step: fullness of F gives f from A to B with Ff = h, not with Gf = h; the equation Gf = h confuses the two functors, since f lives in C where G is not defined. Step 4 would be valid once Step 3 is repaired, since G(Ff) = Gh = k. Step 5 is the correct conclusion after the repair. The answer is Step 3."
          - problem: "Let C,D,E each have two objects 0,1, only identity endomorphisms, and respectively two, three, three arrows 0->1; there are no arrows 1->0. Functors F:C->D and G:D->E fix objects. Label each parallel hom-set from 0, and let F have arrow values [1,2], G values [0,2,0]. Construct the hom-set map of GF. Give its two values, then the full,faithful bits for F, G, GF in that order. Derive these properties from all hom-set maps without a supplied characterization."
            answer: "2, 0, 0, 1, 0, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Fullness requires every target parallel arrow to occur, while faithfulness requires distinct source arrows to remain distinct. The remaining hom-set maps are bijections, so constructing and comparing the three displayed hom-maps decides all six properties. The resulting answer is 2, 0, 0, 1, 0, 0, 0, 1."
          - problem: "Write the full proof: if F and G are fully faithful functors, then the composite GF is fully faithful. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): let F go from C to D and G from D to E be fully faithful, and let A, B be objects of C. Step 2 (factorization of the composite hom-set map): (GF)_{A,B} from Hom_C(A,B) to Hom_E(GFA,GFB) factors as G_{FA,FB} after F_{A,B}, because (GF)f = G(Ff) for every morphism f from A to B. Step 3 (injectivity): if (GF)f = (GF)g, then G(Ff) = G(Fg); since G_{FA,FB} is injective, Ff = Fg, and since F_{A,B} is injective, f = g. Hence (GF)_{A,B} is injective. Step 4 (surjectivity): let k be a morphism from GFA to GFB. Since G is full, there is h from FA to FB with Gh = k; since F is full, there is f from A to B with Ff = h. Then (GF)f = G(Ff) = Gh = k, so (GF)_{A,B} is surjective. Step 5 (conclusion): each hom-set map (GF)_{A,B} is injective and surjective, hence bijective, so GF is fully faithful. The proof is complete."
