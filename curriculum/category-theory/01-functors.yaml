        key_prerequisites: [functors]
        step_check:
          step: 'where the second equality uses the identity law for $P$ and the third uses the identity law for $Q$'
          question: 'Why do both identity laws appear in the chain $(QP)(1_A)=Q(P1_A)=Q(1_{PA})=1_{Q(PA)}$?'
          options:
