          - problem: "Let C be the chain $r \\le s \\le t$ viewed as a poset category, and let $G\\colon \\mathbf{1} \\to C$ be the functor that picks the element s, where $\\mathbf{1}$ is the category with one object and one arrow. Give the number of objects of the comma category $(t \\downarrow G)$."
