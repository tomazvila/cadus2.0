            solution_sketch: 'An object of $(C\downarrow G)$ is a pair $(D,f)$ with $f\colon C\to G(D)$, and a morphism from $(D,f)$ to $(D'',f'')$ is an arrow $d\colon D\to D''$ with $G(d)\circ f=f''$. The pair $(D_0,f_0)$ is initial when for every object $(D,f)$ there is exactly one morphism from $(D_0,f_0)$ to $(D,f)$. By the description of morphisms, existence of that morphism says that there is an arrow $d\colon D_0\to D$ with $G(d)\circ f_0=f$, which is the existence clause of a universal arrow. Uniqueness of the morphism says that such an arrow $d$ is unique, which is the uniqueness clause. So $(D_0,f_0)$ is initial if and only if $f_0$ is a universal arrow from $C$ to $G$.'
