unit: functors
course: category-theory
module: "Functors"
topics:
  - id: functor-definition-laws
    name: Functors — Definition and Laws
    core: true
    difficulty: 0.57
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: category-definition
        weight: 0.6
        key: true
      - id: examples-of-categories
        weight: 0.4
        key: true
      - id: composition-associativity-identity
        weight: 0.3
      - id: commutative-diagrams
        weight: 0.2
      - id: homomorphisms-intro
        weight: 0.0
      # Phase C reconciliation: kp3's center non-functoriality argument reasons with
      # commutativity ($Z(\mathbb{Z}/2)=\mathbb{Z}/2$ because abelian; $Z(S_3)$ trivial
      # via a non-commuting pair) — the exact skills of abelian-groups kp1/kp2.
      - id: abelian-groups
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The data and the typing discipline
        key_prerequisites: [category-definition]
        constraints: "Always write the domain and codomain of $Ff$ before checking any law."
        exemplars:
          - problem: "A functor F: C -> D between poset categories has objects 0, 1, 2 in C with 0 < 1 < 2, and F(0) = 2, F(1) = 4, F(2) = 5. For the morphism f: 0 -> 1, give the domain and codomain of Ff as (x, y)."
            answer: "(2, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: identify the source and target of f: A = 0 and B = 1. Step 2: apply the object part, giving F0 = 2 and F1 = 4. Step 3: the morphism part must have type Ff: F0 -> F1, so the domain and codomain are 2 and 4. The answer is (2, 4)."
          - problem: "A functor F: C -> D between poset categories has objects 0, 1, 2 in C with 0 < 1 < 2, and F(0) = 3, F(1) = 6, F(2) = 7. For f: 0 -> 1 and g: 1 -> 2, give the domain and codomain of F(g∘f) as (x, y)."
            answer: "(3, 7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: the composite g∘f is a morphism 0 -> 2. Step 2: the object part gives F0 = 3 and F2 = 7. Step 3: the typing rule requires F(g∘f): F0 -> F2, and this also matches Fg∘Ff. The answer is (3, 7)."
          - problem: "A functor F: C -> Set assigns F(0) a set with 3 elements and F(1) a set with 7 elements. For the morphism f: 0 -> 1, give the number of elements in the domain of Ff."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the morphism f: 0 -> 1 has domain object 0. Step 2: the object part gives F0 a set with 3 elements. Step 3: the typing rule says Ff: F0 -> F1, so the domain of Ff is F0. The answer is 3."
          - problem: "An assignment F has F(0) = 1, F(1) = 2, and for f: 0 -> 1 it sets F(f) = 2 -> 1. Step 1: each object is assigned an object. Step 2: f: 0 -> 1 requires Ff: F0 -> F1. Step 3: F0 = 1 and F1 = 2, so F(f) = 2 -> 1 is allowed. Step 4: the object part is complete. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: the object part assigns objects. Step 2 is valid: the typing rule requires Ff: F0 -> F1. Step 3 is invalid because F0 = 1 and F1 = 2, so Ff must run 1 -> 2, not 2 -> 1; choosing Step 1 or Step 2 mistakes a valid line for a failure, and choosing Step 4 overlooks the earlier reversal. The answer is Step 3."
          - problem: "A functor F: C -> D between poset categories satisfies F(0) = 4, F(1) = 6, F(2) = 9. The morphisms f: 0 -> 1 and g: 1 -> 2 have composite g∘f: 0 -> 2. State the codomain object of F(g∘f)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the composite g∘f has domain 0 and codomain 2. Step 2: the typing rule forces F(g∘f): F0 -> F2, and the object part gives F0 = 4 and F2 = 9. Step 3: the codomain of F(g∘f) is the image of the codomain object 2. The answer is 9."
          - problem: "A proposed functor F on poset category C has F(0) = 1, F(1) = 3, F(2) = 4 and sends f: 0 -> 1 to 1 -> 3. Determine whether the typing of Ff is valid and give the codomain object of Ff."
            answer: "verdict = correct; cod = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["correct"], ["incorrect"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "cod"}]}
            solution_sketch: "Step 1: f: 0 -> 1 has F0 = 1 and F1 = 3. Step 2: the typing rule requires Ff: F0 -> F1, which is 1 -> 3. Step 3: the proposed F(f) = 1 -> 3 has that type, so the typing is correct. The answer is verdict = correct; cod = 3."
          - problem: "Write the full proof: For a functor F and morphisms f: A -> B, g: B -> C, the morphism F(g∘f) has domain FA and codomain FC, and F(g∘f) and Fg∘Ff have the same type. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (typing of f): f: A -> B, so the morphism part of F gives Ff: FA -> FB. Step 2 (typing of g): g: B -> C, so Fg: FB -> FC. Step 3 (composite): the codomain of Ff is FB and the domain of Fg is FB, so Fg∘Ff is defined and Fg∘Ff: FA -> FC. Step 4 (functor on composite): g∘f: A -> C, so F(g∘f): FA -> FC. Step 5 (comparison): F(g∘f) and Fg∘Ff both have domain FA and codomain FC, so they are the same type. The answer is F(g∘f): FA -> FC, matching Fg∘Ff: FA -> FC."
      - id: kp2
        name: The two laws and how to verify them
        key_prerequisites: [composition-associativity-identity]
        constraints: "Verify both laws separately; underlying-map arguments must say why the underlying map of a composite is the composite."
        exemplars:
          - problem: "Let U be the forgetful functor from Mon to Set. Take the monoid M = ({0,1,2}, + mod 3, 0), the homomorphism f: M -> M with f(x) = 2x mod 3, and the zero homomorphism g: M -> M with g(x) = 0. Use the composition law to compute U(g∘f)(1)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: U(g∘f) is the underlying function of the composite g∘f. Step 1 (composition law): U(g∘f) = U(g)∘U(f), because the underlying map of a composite homomorphism is the composite of the underlying maps. Step 2 (evaluate): f(1) = 2*1 mod 3 = 2, then g(2) = 0. Thus U(g∘f)(1) = 0. The answer is 0."
          - problem: "Let P be the direct-image power-set functor from Set to Set. Take f: {1,2} -> {3,4} with f(1)=3 and f(2)=4, and g: {3,4} -> {5,6} with g(3)=5 and g(4)=6. Compute the sum of the elements of P(g∘f)({1,2})."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: P(g∘f)({1,2}) = (g∘f)[{1,2}] = {g(f(1)), g(f(2))}. Step 1 (composition law): P(g∘f) = P(g)∘P(f), so apply f then g. Step 2: f(1)=3 and f(2)=4, so g(f(1))=g(3)=5 and g(f(2))=g(4)=6. The set is {5,6}, whose sum is 11. The answer is 11."
          - problem: "Let P be the direct-image power-set functor from Set to Set. On the set A = {1,2,3}, use the identity law to compute the largest element of P(1_A)({1,3})."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: P(1_A) is the identity function on the power set of A. Step 1 (identity law): P(1_A) = 1_{P(A)}, so P(1_A)(S) = S for every subset S. Step 2: with S = {1,3}, the image is {1,3}. Its largest element is 3. The answer is 3."
          - problem: "Let U be the forgetful functor from Mon to Set. Take the monoid M = ({0,1,2}, + mod 3, 0). Use the identity law to compute U(1_M)(2)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: U(1_M) is the underlying function of the identity homomorphism on M. Step 1 (identity law): U(1_M) = 1_{UM}, so it fixes every element of the underlying set. Step 2: the element 2 is fixed, so U(1_M)(2) = 2. The answer is 2."
          - problem: "Let C be the category with objects A, B, C and arrows f: A -> B, g: B -> C, h = g∘f: A -> C, plus identities. Let F: C -> Set have F(A)={1,2}, F(B)={3,4}, F(C)={5,6}, F(f)(1)=3, F(f)(2)=4, F(g)(3)=5, F(g)(4)=6. Use the composition law to compute F(h)(1)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: F(h) must equal F(g∘f). Step 1 (composition law): F(g∘f) = F(g)∘F(f), so F(h)(1) = F(g)(F(f)(1)). Step 2: F(f)(1)=3 and F(g)(3)=5. Thus F(h)(1)=5. The answer is 5."
          - problem: "Let C be the category with objects A, B, C and arrows f: A -> B, g: B -> C, h = g∘f: A -> C, plus identities. Let F: C -> Set have F(A)={1,2}, F(B)={3,4}, F(C)={5,6}, F(f)(1)=3, F(f)(2)=4, F(g)(3)=5, F(g)(4)=6. Use the identity law to compute F(1_A)(1)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: F(1_A) is the image of the identity arrow on A. Step 1 (identity law): F(1_A) = 1_{F(A)}, so it fixes every element of F(A). Step 2: the element 1 is in F(A), so F(1_A)(1)=1. The answer is 1."
          - problem: "Write the full proof: the forgetful functor U from Mon to Set satisfies both functor laws. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full object: U sends a monoid (M, ·, e) to its underlying set M and a monoid homomorphism to its underlying function. Identity law step: the underlying function of the identity homomorphism 1_M is the identity function on M, so U(1_M) = 1_{UM}; this verifies the identity law. Composition law step: for homomorphisms f: A -> B and g: B -> C, the underlying function of g∘f sends x to (g∘f)(x) = g(f(x)), which is exactly (Ug∘Uf)(x). Hence U(g∘f) = Ug∘Uf, because the underlying map of a composite homomorphism is the composite of the underlying maps. Both laws hold separately, so U is a functor."
      - id: kp3
        name: Recognizing assignments that are not functors
        key_prerequisites: [examples-of-categories, abelian-groups]
        constraints: "A non-example must be refuted by an explicit failure: wrong typing, or a concrete pair of morphisms."
        exemplars:
          - problem: "Is the preimage power-set assignment $A\\mapsto\\mathcal{P}(A)$, $f\\mapsto f^{-1}[-]$, a functor $\\mathbf{Set}\\to\\mathbf{Set}$? Justify."
            answer: "No — it fails the typing rule: for $f\\colon A\\to B$ the assigned map goes $\\mathcal{P}(B)\\to\\mathcal{P}(A)$, the wrong way."
            solution_sketch: "For $f\\colon A\\to B$, preimage gives $f^{-1}[-]\\colon\\mathcal{P}(B)\\to\\mathcal{P}(A)$, whereas a functor must supply a map $\\mathcal{P}(A)\\to\\mathcal{P}(B)$. So the assignment is not a functor $\\mathbf{Set}\\to\\mathbf{Set}$. It does satisfy the reversed composition rule $(g\\circ f)^{-1}[T]=f^{-1}[g^{-1}[T]]$, so it is a functor on the opposite category — a contravariant functor."
          - problem: "Show that $G\\mapsto Z(G)$ (the center) does not extend to a functor $\\mathbf{Grp}\\to\\mathbf{Grp}$ by restricting homomorphisms."
            answer: "No — a homomorphism need not carry the center into the center: $\\mathbb{Z}/2\\to S_3$, $1\\mapsto(1\\,2)$, has $Z(\\mathbb{Z}/2)=\\mathbb{Z}/2$ but $Z(S_3)=\\{e\\}$."
            solution_sketch: "For 'restrict $\\phi$ to the center' to define a morphism part we would need $\\phi[Z(G)]\\subseteq Z(H)$ for every homomorphism $\\phi\\colon G\\to H$. Take $G=\\mathbb{Z}/2$, which is abelian, so $Z(G)=G$, and $H=S_3$, whose center is trivial because $(1\\,2)$ and $(1\\,3)$ do not commute. The homomorphism $\\phi$ sending the generator to the transposition $(1\\,2)$ has $\\phi[Z(G)]=\\{e,(1\\,2)\\}\\not\\subseteq\\{e\\}=Z(H)$. So the morphism part is not even well defined, and the center is not functorial on $\\mathbf{Grp}$."
    diagnostic_exemplar:
      problem: "Define $F\\colon\\mathbf{Set}\\to\\mathbf{Set}$ by $F(A)=A\\times\\{0,1\\}$ and $F(f)=f\\times 1_{\\{0,1\\}}$. Give the domain and codomain of $F(f)$ for $f\\colon A\\to B$, and verify both functor laws."
      answer: "$F(f)\\colon A\\times\\{0,1\\}\\to B\\times\\{0,1\\}$, $(a,i)\\mapsto(f(a),i)$. Identity law: $F(1_A)(a,i)=(a,i)$, so $F(1_A)=1_{FA}$. Composition law: $F(g\\circ f)(a,i)=(g(f(a)),i)=F(g)(f(a),i)=F(g)(F(f)(a,i))$, so $F(g\\circ f)=Fg\\circ Ff$. Both laws hold, so $F$ is a functor."
      solution_sketch: "Type $F(f)$ first — it must run $A\\times\\{0,1\\}\\to B\\times\\{0,1\\}$ — then check both laws elementwise on a pair $(a,i)$. The tag $i$ is carried untouched, so each law collapses to the corresponding fact about $f$ alone."
    anki_seeds:
      - front: "On morphisms, a functor $F$ sends each $f\\colon A\\to B$ to..."
        back: "a morphism $Ff\\colon FA\\to FB$."
        type: basic
      - front: "How does a functor act on an identity: $F(1_A)=$?"
        back: "$F(1_A)=1_{FA}$."
        type: basic
      - front: "How does a functor act on a composite: $F(g\\circ f)=$?"
        back: "$F(g\\circ f)=Fg\\circ Ff$."
        type: basic

  - id: functors
    name: Functors
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: functor-definition-laws
        weight: 0.6
        key: true
      - id: category-definition
        weight: 0.4
        key: true
      - id: examples-of-categories
        weight: 0.3
      - id: poset-monoid-categories
        weight: 0.3
      - id: function-composition-inverse
        weight: 0.2
      - id: monoids
        weight: 0.2
      - id: homomorphisms-intro
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Functors between one-object categories
        key_prerequisites: [monoids]
        constraints: "Both directions of the dictionary: unpack the functor laws into homomorphism axioms and conversely; monoids or groups only, no concrete computations needed."
        exemplars:
          - problem: "Let B(M) and B(N) be the one-object categories of the additive groups of integers modulo 6 and modulo 8. A functor B(M) -> B(N) corresponds to a function f on morphisms with f(a + b) = f(a) + f(b) and f(0) = 0. Since Z/6 is generated by 1, such an f is determined by x = f(1), and x must satisfy 6x = 0 in Z/8. How many functors B(M) -> B(N) are there?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Dictionary rule: a functor between one-object categories is exactly a monoid homomorphism on morphisms. The group Z/6 is generated by 1, so the morphism map f is determined by x = f(1), and the condition 6x = 0 in Z/8 comes from 6 · 1 = 0 in Z/6. Solving 6x = 0 modulo 8 gives 3x = 0 modulo 4, so x = 0 or x = 4 in Z/8. Each value satisfies the homomorphism axioms, so there are two functors. The answer is 2."
          - problem: "Let B(M) and B(N) be the one-object categories of the additive groups of integers modulo 4 and modulo 12. Let F be the functor whose morphism map f satisfies f(1) = 3. The functor composition law unpacks to f(a + b) = f(a) + f(b) for all morphisms a and b. Compute f(3) in Z/12."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Functor law: the morphism map preserves composition, which unpacks to f(a + b) = f(a) + f(b) in the additive groups. Write 3 as 1 + 1 + 1 in Z/4. Then f(3) = f(1) + f(1) + f(1) = 3 + 3 + 3 = 9 in Z/12. The choice f(1) = 3 is legitimate because 4 · 3 = 12 = 0 in Z/12. The answer is 9."
          - problem: "The morphisms of a one-object category form a monoid under composition. In the additive group of integers modulo 12, the order of an element a is the smallest positive k with ka = 0 modulo 12. What is the order of the element 5?"
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Composition rule: the morphisms of a one-object category compose as the monoid operation, here addition modulo 12. The order of 5 is the smallest positive k with 5k = 0 modulo 12, which equals 12 divided by gcd(5, 12). Since gcd(5, 12) = 1, the order is 12. The answer is 12."
          - problem: "Let B(G) be the one-object category of the multiplicative group of the nonzero integers modulo 5. A functor B(G) -> B(G) is a group homomorphism f, and the homomorphism law f(xy) = f(x)f(y) determines the functor on every composite. Given f(2) = 3, compute f(4) modulo 5."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Homomorphism law: f(xy) = f(x)f(y) builds the functor value on every composite morphism; this is the converse direction of the dictionary. In the multiplicative group modulo 5 we have 4 = 2 · 2. So f(4) = f(2) f(2) = 3 · 3 = 9, which is 4 modulo 5. The datum f(2) = 3 is legitimate because 2 and 3 both have order 4 in the group. The answer is 4."
          - problem: "Claim: every function f from a monoid M to a monoid N with f(1) = 1 gives a functor B(M) -> B(N). Step 1: send the single object of B(M) to the single object of B(N). Step 2: on morphisms, apply the function f. Step 3: F preserves composition, because f(mn) = f(m)f(n) holds for every such function f. Step 4: F preserves identities, because f(1) = 1, so F is a functor. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: a one-object category has a single object, so its image is forced. Step 2 is valid: a functor gives a function on morphisms. Step 3 is invalid: preservation of composition is exactly the law f(mn) = f(m)f(n), and an arbitrary function with f(1) = 1 need not satisfy it, so it cannot be asserted for every such f; choosing Step 1, Step 2 or Step 4 is the error of overlooking this unproven claim. Step 4 is a correct identity argument, but it rests on the failed Step 3. The answer is Step 3."
          - problem: "Let B(M) and B(N) be the one-object categories of the additive group of integers modulo 3, and let f be the function with f(0) = 0, f(1) = 1 and f(2) = 0. The functor composition law unpacks to f(a + b) = f(a) + f(b) for all a and b. Does f give a functor B(M) -> B(N)? State the verdict and give the value of f(2) that the functor composition law requires."
            answer: "verdict = no; value = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Functor law: composition preservation unpacks to f(a + b) = f(a) + f(b) for all a and b in Z/3. Taking a = b = 1, the law requires f(2) = f(1) + f(1) = 1 + 1 = 2. The given function has f(2) = 0, so the composition law fails and f yields no functor. The verdict yes is the error of ignoring the mismatch between the required value 2 and the given value 0. The answer is verdict = no; value = 2."
          - problem: "Write the full proof: for groups G and H, a functor B(G) -> B(H) between the one-object categories is exactly a group homomorphism G -> H. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: the group G as a one-object category B(G) has a single object and one morphism for each element of G, with composition given by the product and the identity morphism given by the unit e. Step 2: a functor F: B(G) -> B(H) sends the single object of B(G) to the single object of B(H), so all of its data is the function f: G -> H on morphisms. Step 3: the functor identity law gives f(e) = e, and the functor composition law gives f(ab) = f(a)f(b) for all a and b in G; these are exactly the axioms of a group homomorphism. Step 4: conversely, a group homomorphism f: G -> H defines F on the object in the only possible way and on morphisms by f(a); the identity and composition laws hold by the homomorphism axioms, so F is a functor. Step 5: the two constructions undo each other, so functors B(G) -> B(H) are exactly group homomorphisms G -> H. See the solution."
      - id: kp2
        name: Functoriality of parametrized constructions
        key_prerequisites: [function-composition-inverse]
        constraints: "Endofunctors of $\\mathbf{Set}$ built from products with a fixed set or squaring; verification is elementwise, checking both laws on an arbitrary element."
        exemplars:
          - problem: "Let F be the endofunctor (-) x A with A = {0, 1}: on objects F(X) = X x A, and on a function f: X -> Y it acts by F(f)(x, a) = (f(x), a). In the elementwise check of the composition law for f: X -> Y and g: Y -> Z, evaluate both sides at the element (2, 1) of X x A, where f(2) = 5 and g(5) = 8. Give the first coordinate of F(g after f)(2, 1)."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (functor rule): F sends f to f paired with the identity on A, so F(g after f)(2, 1) = (g(f(2)), 1). Step 2 (composite rule): g(f(2)) = g(5) = 8, so the left side is (8, 1). Step 3 (elementwise comparison): (F(g) after F(f))(2, 1) = F(g)(5, 1) = (8, 1), the same pair, so the law holds at this element. The first coordinate is 8."
          - problem: "Let F be the squaring endofunctor: F(X) = X x X on objects and F(f)(x, y) = (f(x), f(y)) on a function f. In the elementwise check of the composition law, take f(1) = 4, f(2) = 3, g(3) = 7 and g(4) = 6, and evaluate the right side (F(g) after F(f)) at the element (1, 2) of X x X. Give the second coordinate of (F(g) after F(f))(1, 2)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (element rule): F(f)(1, 2) = (f(1), f(2)) = (4, 3). Step 2 (apply g): F(g)(4, 3) = (g(4), g(3)) = (6, 7). Step 3 (comparison): F(g after f)(1, 2) = (g(f(1)), g(f(2))) = (6, 7), the same pair, so the two sides agree at this element. The second coordinate is 7."
          - problem: "A student proposes an assignment F on Set: on objects F(X) = X x X, and on a function f it acts by F(f)(x, y) = (f(x), f(x)). Check both functor laws elementwise on an arbitrary element (x, y) of X x X. How many of the two functor laws does this F satisfy?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (identity law): F(1_X)(x, y) = (x, x), which differs from (x, y) whenever x and y differ, for example at (1, 2); the identity law fails. Step 2 (composition law): F(g after f)(x, y) = (g(f(x)), g(f(x))), and (F(g) after F(f))(x, y) = F(g)(f(x), f(x)) = (g(f(x)), g(f(x))); the two sides are equal, so composition is preserved. Step 3 (count): exactly one of the two laws holds. The answer is 1."
          - problem: "Let G be the endofunctor A x (-) with A = {0, 1}: on objects G(X) = A x X, and on a function f: X -> Y it acts by G(f)(a, x) = (a, f(x)). In the elementwise check of the composition law for f: X -> Y and g: Y -> Z, evaluate both sides at the element (1, 2) of A x X, where f(2) = 6 and g(6) = 9. Give the second coordinate of G(g after f)(1, 2)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (functor rule): G sends f to the identity on A paired with f, so G(g after f)(1, 2) = (1, g(f(2))). Step 2 (composite rule): g(f(2)) = g(6) = 9, so the left side is (1, 9). Step 3 (elementwise comparison): (G(g) after G(f))(1, 2) = G(g)(1, 6) = (1, 9), the same pair. The second coordinate is 9."
          - problem: "Claim: the squaring assignment F, with F(X) = X x X and F(f)(x, y) = (f(x), f(y)), is a functor. Proof attempt: Step 1: for the identity 1_X, F(1_X)(x, y) = (1_X(x), 1_X(y)) = (x, y), so F(1_X) is the identity on X x X. Step 2: let f: X -> Y and g: Y -> Z, and take an arbitrary element (x, y) of X x X. Step 3: F(g after f)(x, y) = (g(f(x)), f(y)). Step 4: (F(g) after F(f))(x, y) = (g(f(x)), g(f(y))), and the two sides agree, so composition holds. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the correct elementwise identity check. Step 2 only sets up the comparison and is valid. Step 3 is the first invalid step: the second coordinate must also be composed, giving F(g after f)(x, y) = (g(f(x)), g(f(y))), not (g(f(x)), f(y)). Step 4 computes the right side correctly, but it builds on the wrong Step 3. The answer is Step 3."
          - problem: "To verify the identity law for the endofunctor F = (-) x A elementwise, the proof must evaluate F(1_X) at an arbitrary element (x, a) of X x A, but the line F(1_X)(x, a) = ? is missing. Select the line that is true and completes the check."
            answer: "(1_X(x), a) = (x, a)"
            answer_contract: {"kind": "label", "options": [["(1_X(x), a) = (x, a)"], ["(1_X(a), x) = (a, x)"], ["(1_X(x), 1_X(a))"], ["(a, 1_X(x))"]]}
            solution_sketch: "The functor acts by F(f)(x, a) = (f(x), a), so at the identity the correct line is (1_X(x), a) = (x, a). The option (1_X(a), x) swaps the roles of x and a, treating a as an element of X. The option (1_X(x), 1_X(a)) wrongly applies 1_X to a, which need not lie in X. The option (a, 1_X(x)) writes the two coordinates in the wrong order. The answer is (1_X(x), a) = (x, a)."
          - problem: "Write the full proof: for each fixed set A, the assignment that sends an object X to X x A and a function f: X -> Y to f paired with the identity on A, acting by (x, a) maps to (f(x), a), is an endofunctor of Set, verifying both laws elementwise. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects): define F on objects by F(X) = X x A. Step 2 (morphisms): define F on f: X -> Y by F(f)(x, a) = (f(x), a) for every element (x, a) of X x A. Step 3 (identity law): for the identity 1_X, F(1_X)(x, a) = (1_X(x), a) = (x, a), which is exactly the value of the identity function on X x A at (x, a); hence F(1_X) is the identity on F(X) = X x A. Step 4 (composition law): for f: X -> Y and g: Y -> Z, compute F(g after f)(x, a) = (g(f(x)), a). On the other side, (F(g) after F(f))(x, a) = F(g)(F(f)(x, a)) = F(g)(f(x), a) = (g(f(x)), a). The two sides agree at every element (x, a), so F(g after f) = F(g) after F(f). Step 5 (conclusion): F preserves identities and composition, so it is an endofunctor of Set."
      - id: kp3
        name: Functors preserve isomorphisms and commuting diagrams
        key_prerequisites: [functor-definition-laws]
        constraints: "Every step must cite one of the two functor laws; never assume $F$ is injective on morphisms."
        exemplars:
          - problem: "Let C be the one-object category whose morphisms are 0, 1, 2, 3, with composition given by addition modulo 4, so the identity morphism is 0. A functor F from C to C satisfies F(1) = 3. Give the value of F(3)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both functor laws govern the computation. Step 1, composition law: F(3) = F(1 + 1 + 1) = F(1) after F(1) after F(1), and composition here is addition modulo 4. Step 2: F(2) = 3 + 3 = 6 = 2, and F(3) = F(2) after F(1) gives 2 + 3 = 5 = 1. Step 3, identity law: F(0) = F(id) = id = 0, which checks the functor is well defined. The value of F(3) is 1."
          - problem: "Let C be the category with objects 0, 1, 2; morphisms f: 0 -> 1, g: 1 -> 2, h: 0 -> 2 and the identities; the only defining equation is h = g after f. A functor F to sets has F(0) = {1, 2, 3}, F(1) = {4, 5}, F(2) = {6}, with F(f) sending 1 to 4, 2 to 5, 3 to 4, and F(g) sending 4 to 6 and 5 to 6. Give the value of F(h)(3)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, composition law: F(h) = F(g after f) = F(g) after F(f). Step 2: F(f) sends the element 3 to the element 4. Step 3: F(g) sends the element 4 to the element 6. So F(h)(3) = F(g)(F(f)(3)) = F(g)(4) = 6. The value of F(h)(3) is 6."
          - problem: "Let C be the category with two objects A and B, morphisms f: A -> B and g: B -> A besides the identities, and defining equations g after f = id_A and f after g = id_B. Let D be the one-object category whose morphisms are 0, 1, 2, 3, 4 under addition modulo 5, identity 0. A functor F sends both objects to the single object of D, with F(f) = 2 and F(g) = 3. Give the value of F(f) after F(g)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, composition law: F(f) after F(g) = F(f after g). Step 2: f after g = id_B by the defining equation of C, so F(f after g) = F(id_B). Step 3, identity law: F(id_B) is the identity morphism of D, which is 0. Indeed 2 + 3 = 5 = 0 modulo 5. The value of F(f) after F(g) is 0."
          - problem: "Let C be the category with objects A, B, C, D; morphisms f: A -> B, g: B -> D, h: A -> C, k: C -> D and the identities; the only defining equation is k after h = g after f, so the square commutes. Let the target be the one-object category with morphisms 0 to 6 under addition modulo 7, identity 0. A functor F has F(f) = 5, F(g) = 6 and F(h) = 2. Give the value of F(k)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, composition law: F(k after h) = F(k) after F(h), so F(k) + F(h) = F(g after f) = F(g) + F(f) modulo 7. Step 2: the right side is 6 + 5 = 11 = 4 modulo 7, and F(h) = 2. Step 3: solving F(k) + 2 = 4 gives F(k) = 2. The value of F(k) is 2."
          - problem: "Claim: every functor F sends a commuting triangle to a commuting triangle. Step 1: the triangle commutes, so h = g after f. Step 2: apply F to both sides, giving F(g after f) = F(h). Step 3: by the composition law, F(g) after F(f) = F(h), so the image triangle commutes. Step 4: this works only because F is injective on morphisms. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 restates the hypothesis of the claim, so Step 1 is valid. Step 2 applies F to an equation between morphisms, which is always possible, so Step 2 is valid. Step 3 follows from the composition law alone, so Step 3 is valid. Step 4 is the first invalid step: it invokes injectivity of F on morphisms, which is not one of the two functor laws and is not needed, since the image equation of Step 3 already shows commutativity. The first invalid step is Step 4."
          - problem: "A functor F carries an isomorphism f from A to B to an isomorphism. To prove that the inverse of F(f) is F applied to the inverse of f, the line ? = id_FA is missing from the proof. Select the line that the two functor laws give."
            answer: "F(f^-1) after F(f)"
            answer_contract: {"kind": "label", "options": [["F(f^-1) after F(f)"], ["F(f) after F(f^-1)"], ["F(f^-1) after F(f^-1)"], ["F(f) after F(f)"]]}
            solution_sketch: "Step 1, composition law: applying F to the equation g after f = id_A, where g is the inverse of f, gives F(g) after F(f) = F(id_A). Step 2, identity law: F(id_A) = id_FA, so the missing left side is F(f^-1) after F(f). The option F(f) after F(f^-1) is the other inverse equation and yields id_FB, the identity on the wrong object. The option F(f^-1) after F(f^-1) composes the image of the inverse with itself, which no functor law produces here. The option F(f) after F(f) composes the image of f with itself and is also not an equation of the proof. The missing line is F(f^-1) after F(f)."
          - problem: "Write the full proof: for every functor F, if f is an isomorphism in the source category then F(f) is an isomorphism with inverse F applied to the inverse of f, and F sends commuting diagrams to commuting diagrams. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: let f: A -> B be an isomorphism with inverse g, so g after f = id_A and f after g = id_B. Step 2, composition law and identity law: applying F to the first equation gives F(g) after F(f) = F(g after f) = F(id_A) = id_FA. Step 3, the same two laws on the second equation give F(f) after F(g) = F(f after g) = F(id_B) = id_FB. Step 4: the two displayed equations exhibit F(g) as a two-sided inverse of F(f), so F(f) is an isomorphism with inverse F(g); no injectivity of F on morphisms is assumed or needed, since both equations follow from the two functor laws. Step 5: a diagram commutes exactly when certain composites are equal; for each such equation h = g after f, the composition law gives F(h) = F(g after f) = F(g) after F(f), so the image equation holds and the image diagram commutes. Both claims are proved, using only the composition law and the identity law."
    diagnostic_exemplar:
      problem: "Prove that every functor $F$ carries isomorphisms to isomorphisms, and that $(Ff)^{-1}=F(f^{-1})$."
      answer: "Let $f\\colon A\\to B$ have inverse $f^{-1}$. Applying $F$ to $f^{-1}\\circ f=1_A$ and using both functor laws: $F(f^{-1})\\circ Ff=F(f^{-1}\\circ f)=F(1_A)=1_{FA}$. Symmetrically, applying $F$ to $f\\circ f^{-1}=1_B$ gives $Ff\\circ F(f^{-1})=1_{FB}$. So $F(f^{-1})$ is a two-sided inverse of $Ff$; hence $Ff$ is an isomorphism and, inverses being unique, $(Ff)^{-1}=F(f^{-1})$."
      solution_sketch: "Apply $F$ to the two equations defining $f^{-1}$ and push $F$ through each composite with the composition law; $F(1)=1$ turns both into identities, exhibiting $F(f^{-1})$ as a two-sided inverse of $Ff$. Uniqueness of inverses then gives the naming claim."
    anki_seeds:
      - front: "A functor between one-object categories $BM\\to BN$ is exactly a {{c1::monoid homomorphism}}."
        back: "monoid homomorphism"
        type: cloze
      - front: "If $f$ is an isomorphism and $F$ a functor, what is $(Ff)^{-1}$?"
        back: "$F(f^{-1})$; functors preserve isomorphisms."
        type: basic
      - front: "Does a functor send commuting diagrams to commuting diagrams?"
        back: "Yes — $F$ turns every composite into the composite of the images, so equations of composites are preserved."
        type: basic

  - id: functor-composition-identity
    name: Composing Functors and the Category Cat
    core: true
    difficulty: 0.62
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: functors
        weight: 0.6
        key: true
      - id: functor-definition-laws
        weight: 0.4
        key: true
      - id: category-definition
        weight: 0.3
      - id: composition-associativity-identity
        weight: 0.2
      - id: examples-of-categories
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Composites and identity functors
        key_prerequisites: [functors]
        constraints: "Check the object part, the morphism part, and both laws separately."
        exemplars:
          - problem: "Let P be the poset 0 < 1 < 2 viewed as a category. Functors F and G from P to P are given by F(0)=1, F(1)=2, F(2)=2 and G(0)=0, G(1)=1, G(2)=1. Find (G∘F)(0)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The object part of a composite is the composite of the object parts. First apply F: F(0)=1. Then apply G: G(1)=1. The value is 1."
          - problem: "Let P be the poset 0 < 1 < 2 viewed as a category, and let F: P -> P satisfy F(0)=1, F(1)=2, F(2)=2. Let I be the identity functor on P. Find (I∘F)(2)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity functor fixes every object and every morphism. So (I∘F)(2) = I(F(2)) = I(2) = 2. The answer is 2."
          - problem: "Let P be the poset 0 < 1 < 2 viewed as a category. Functors F and G from P to P are given by F(0)=1, F(1)=2, F(2)=2 and G(0)=0, G(1)=1, G(2)=1. Find the image of the morphism 0 -> 1 under G∘F. Give the answer as (x, y)."
            answer: "(1,1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The composite H = G∘F has object part H(0)=G(F(0))=G(1)=1 and H(1)=G(F(1))=G(2)=1. A functor maps the morphism 0≤1 to the morphism H(0)≤H(1), which is 1≤1. So the image is (1,1)."
          - problem: "Let P be the poset 0 < 1 < 2 viewed as a category, and let F: P -> P satisfy F(0)=1, F(1)=2, F(2)=2. Let I be the identity functor on P. Find (F∘I)(2) - (I∘F)(2)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity functor does nothing, so (F∘I)(2) = F(I(2)) = F(2) = 2, and (I∘F)(2) = I(F(2)) = I(2) = 2. The difference is 2 - 2 = 0. The answer is 0."
          - problem: "Define H: P -> P by H(0)=2, H(1)=0, H(2)=0, where P is the poset 0 < 1 < 2. Consider the proof that H is a functor. Step 1: H(0)=2, so the identity on 0 maps to the identity on 2. Step 2: The morphism 0 -> 1 maps to a morphism from H(0)=2 to H(1)=0. Step 3: The morphism 1 -> 2 maps to a morphism from H(1)=0 to H(2)=0. Step 4: Therefore H preserves identities and composites, so H is a functor. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid because the identity on 0 maps to the identity on 2. Step 2 is invalid: there is no morphism from 2 to 0 in P, since 2≤0 is false. Step 3 is valid because 0≤0 holds. Step 4 is wrong because Step 2 fails. The answer is Step 2."
          - problem: "Consider the proof that for any functor F: P -> P the composite I∘F equals F, where I is the identity functor. Step 1: Let x be an object of P. Step 2: (I∘F)(x) = I(F(x)). Step 3: Since I is the identity functor, I(F(x)) = x. Step 4: Therefore (I∘F)(x) = F(x), so I∘F = F. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a valid setup. Step 2 is the definition of composite. Step 3 is false because I(F(x))=F(x), not x. Step 4 would be correct if Step 3 were replaced. The answer is Step 3."
          - problem: "Write the full proof: for any functors F: B -> C and G: C -> D, the composite G∘F is a functor, and the identity functor is a two-sided identity for composition. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (types): For an object A of B, (G∘F)(A)=G(FA) is an object of D. For a morphism f: A -> B in B, Ff: FA -> FB, so G(Ff): GFA -> GFB, which is a morphism of D. Step 2 (identities): (G∘F)(1_A)=G(F(1_A))=G(1_{FA})=1_{GFA}=1_{(G∘F)A}. Step 3 (composites): For composable g and f, (G∘F)(g∘f)=G(F(g∘f))=G(Fg∘Ff)=G(Fg)∘G(Ff)=(G∘F)g∘(G∘F)f. Step 4 (identity functor): Define 1_C(A)=A and 1_C(f)=f. Then (1_D∘F)(A)=1_D(FA)=FA and (1_D∘F)(f)=Ff, so 1_D∘F=F. Likewise (F∘1_C)(A)=F(A) and (F∘1_C)(f)=Ff, so F∘1_C=F. Since functors are equal when their object and morphism parts agree, the identity laws hold."
      - id: kp2
        name: The category Cat and isomorphisms of categories
        key_prerequisites: [category-definition]
        constraints: "Verify associativity and unit laws for functor composition before naming the category."
        exemplars:
          - problem: "Show that small categories and functors form a category $\\mathbf{Cat}$."
            answer: "Composition of functors is associative with the identity functors as two-sided units, so the axioms hold."
            solution_sketch: "Objects: small categories. Morphisms $\\mathcal{C}\\to\\mathcal{D}$: functors, which compose to functors by the previous knowledge point. Associativity: $((HG)F)$ and $(H(GF))$ agree on objects, since both send $A\\mapsto H(G(FA))$, and on morphisms, since both send $f\\mapsto H(G(Ff))$; hence they are equal. Units: $1_{\\mathcal{D}}\\circ F=F=F\\circ 1_{\\mathcal{C}}$, shown above. All category axioms hold, so $\\mathbf{Cat}$ is a category."
          - problem: "Define an isomorphism of categories and explain why it is a strong requirement."
            answer: "Functors $F,G$ with $GF=1_{\\mathcal{C}}$ and $FG=1_{\\mathcal{D}}$ on the nose — equality of functors, not merely a natural isomorphism."
            solution_sketch: "An isomorphism in $\\mathbf{Cat}$ is a functor $F\\colon\\mathcal{C}\\to\\mathcal{D}$ with a two-sided inverse $G$, i.e. $GF=1_{\\mathcal{C}}$ and $FG=1_{\\mathcal{D}}$ as functors. This forces a bijection on objects and on each hom-set. It is a strong condition: for instance the categories of finite-dimensional vector spaces and of matrices behave the same way mathematically but have different object collections, so they are not isomorphic. The weaker and more useful notion, obtained by relaxing the two equalities to natural isomorphisms, is equivalence of categories."
      - id: kp3
        name: Endofunctors and their iterates
        key_prerequisites: [composition-associativity-identity]
        constraints: "Keep to endofunctors of a fixed category; write $T^n$ only for composites of $T$ with itself."
        exemplars:
          - problem: "Define an endofunctor and the powers $T^n$, and explain why the endofunctors of $\\mathcal{C}$ form a monoid under composition."
            answer: "$T\\colon\\mathcal{C}\\to\\mathcal{C}$; $T^0=1_{\\mathcal{C}}$, $T^{n+1}=T\\circ T^n$; composition is associative with unit $1_{\\mathcal{C}}$."
            solution_sketch: "An endofunctor is a functor from $\\mathcal{C}$ to itself. Any two endofunctors compose (both are $\\mathcal{C}\\to\\mathcal{C}$), and the composite is again an endofunctor. Composition of functors is associative and $1_{\\mathcal{C}}$ is a two-sided unit, so the endofunctors of $\\mathcal{C}$ form a monoid, equivalently a one-object category. Powers are defined by $T^0=1_{\\mathcal{C}}$ and $T^{n+1}=T\\circ T^n$; associativity makes $T^m\\circ T^n=T^{m+n}$ unambiguous. This monoid is the setting in which monads will later be defined."
          - problem: "For the power-set endofunctor $P$ on $\\mathbf{Set}$, describe $P^2$ on objects and on a morphism $f\\colon A\\to B$."
            answer: "$P^2A=\\mathcal{P}(\\mathcal{P}(A))$ and $P^2(f)(\\mathcal{S})=\\{f[S]:S\\in\\mathcal{S}\\}$."
            solution_sketch: "By definition $P^2=P\\circ P$, so on objects $P^2A=P(PA)=\\mathcal{P}(\\mathcal{P}(A))$, the set of families of subsets of $A$. On a morphism, $P^2(f)=P(P(f))$, and $P(f)$ is direct image, so for a family $\\mathcal{S}\\subseteq\\mathcal{P}(A)$ we get $P^2(f)(\\mathcal{S})=P(f)[\\mathcal{S}]=\\{f[S]:S\\in\\mathcal{S}\\}$. The functor laws for $P^2$ hold automatically, being the composite of a functor with itself."
    diagnostic_exemplar:
      problem: "Given functors $F\\colon\\mathcal{B}\\to\\mathcal{C}$ and $G\\colon\\mathcal{C}\\to\\mathcal{D}$, define $GF$ by $(GF)A=G(FA)$ and $(GF)f=G(Ff)$, and prove that $GF$ satisfies both functor laws."
      answer: "Typing: for $f\\colon A\\to B$, $Ff\\colon FA\\to FB$, so $G(Ff)\\colon GFA\\to GFB$. Identities: $(GF)(1_A)=G(F1_A)=G(1_{FA})=1_{GFA}$, using the identity law of $F$ then of $G$. Composites: $(GF)(g\\circ f)=G(F(g\\circ f))=G(Fg\\circ Ff)=G(Fg)\\circ G(Ff)=(GF)g\\circ(GF)f$, using the composition law of $F$ then of $G$. Hence $GF$ is a functor."
      solution_sketch: "Check the typing of $G(Ff)$, then apply each law twice, inner functor first: $G(F1_A)=G(1_{FA})=1_{GFA}$, and $G(F(g\\circ f))$ splits by the law for $F$ and then by the law for $G$."
    anki_seeds:
      - front: "How is the composite functor $GF$ defined?"
        back: "$(GF)A=G(FA)$ on objects and $(GF)f=G(Ff)$ on morphisms."
        type: basic
      - front: "What are the objects and morphisms of $\\mathbf{Cat}$?"
        back: "small categories; functors between them."
        type: basic
      - front: "An isomorphism of categories requires $GF$ and $FG$ to be {{c1::equal to the identity functors}} (not merely naturally isomorphic)."
        back: "equal to the identity functors"
        type: cloze

  - id: functor-examples
    name: Examples of Functors
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: functors
        weight: 0.6
        key: true
      - id: examples-of-categories
        weight: 0.2
      - id: monoids
        weight: 0.2
      - id: groups-intro
        weight: 0.0
      - id: basis-dimension
        weight: 0.0
      - id: linear-transformations
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Forgetful functors
        key_prerequisites: [functors]
        constraints: "Forgetful functors out of $\\mathbf{Grp}$, $\\mathbf{Mon}$, or $\\mathbf{Top}$; the verification must reduce both laws to 'the underlying map of a composite is the composite'."
        exemplars:
          - problem: "Let U: Grp to Set be the forgetful functor. Let f: Z/3 to Z/6 be the homomorphism with f(1) = 2, and let g: Z/6 to Z/6 be the homomorphism with g(x) = 5x (mod 6). The composition law of the functor says U(g∘f) = U(g)∘U(f). Compute the value U(g∘f)(1)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the forgetful functor sends a homomorphism to its underlying function, so U(g∘f) is the composite function g∘f. First compute f(1) = 2 from the definition of f. Next compute g(2) = 5 times 2 = 10, and 10 mod 6 = 4. The answer is 4."
          - problem: "Let U: Top to Set be the forgetful functor. Let X = {0,1,2} with the discrete topology, Y = {0,1} with the indiscrete topology, and Z = {0,1,2} with the discrete topology. Let f: X to Y send 0,1,2 to 1,0,1, and let g: Y to Z send both points of Y to 2. Every such map is continuous. Compute the value U(g∘f)(2)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: U sends a continuous map to its underlying function, so U(g∘f) is the composite function g∘f. First compute f(2) = 1 from the definition of f. Then compute g(1) = 2, since g is constant with value 2. The answer is 2."
          - problem: "Let U: Mon to Set be the forgetful functor. Let M be the monoid of nonzero residues {1,2,3,4,5,6} under multiplication modulo 7. Let f: M to M be the map f(x) = x^2 (mod 7) and g: M to M the map g(x) = x^3 (mod 7); both are monoid homomorphisms. Compute the value U(g∘f)(2)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: U sends a monoid homomorphism to its underlying function, so U(g∘f) is the composite function g∘f. First compute f(2) = 2^2 = 4 modulo 7. Next compute g(4) = 4^3 = 64 = 63 + 1, which is 1 modulo 7. The answer is 1."
          - problem: "A student checks the forgetful functor from Mon to Set. Step 1: a monoid is sent to the collection of its elements. Step 2: a monoid homomorphism is sent to the same function between those collections. Step 3: the unit element is sent to the unit element. Step 4: for homomorphisms h from L to M and k from M to N, the composite sends an element x to h(k(x)). Step 5: both functor laws hold, so the assignment is a functor. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Rule: the forgetful functor sends a monoid to its underlying collection and a homomorphism to the same function. Step 1 is correct, since the object part keeps the elements. Step 2 is correct, since the morphism part keeps the same function. Step 3 is correct, since a monoid homomorphism preserves the unit. Step 4 is false: the composite applies h first, so x is sent to k(h(x)), not to h(k(x)). Step 5 would follow only after that order is corrected. The answer is Step 4."
          - problem: "To verify the composition law U(g∘f) = U(g)∘U(f) for the forgetful functor U: Top to Set, let f: X to Y and g: Y to Z be continuous maps and let x be a point of X. In the check, the line U(g∘f)(x) = ? is missing. Select the line that is true by the definition of U."
            answer: "g(f(x))"
            answer_contract: {"kind": "label", "options": [["g(f(x))"], ["f(g(x))"], ["g(x) + f(x)"], ["f(x) g(x)"]]}
            solution_sketch: "Rule: U sends a continuous map to its underlying function, and the composite g∘f applies f first, sending x to g(f(x)). The option f(g(x)) reverses the order of composition. The option g(x) + f(x) adds point values, which arbitrary spaces need not carry. The option f(x) g(x) multiplies values in the wrong order and misreads the composite as a product. The answer is g(f(x))."
          - problem: "Let U: Mon to Set be the forgetful functor, and let M be the monoid of integers modulo 4 under addition. To verify the identity law U(1_M) = 1_{U(M)}, note that 1_M is the identity homomorphism of M. Compute the value U(1_M)(3). Give the answer as an integer."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule: the forgetful functor sends a homomorphism to its underlying function, and the identity homomorphism 1_M is the identity function on M. Therefore U(1_M) is the identity function on U(M). Evaluate the identity function at the element 3, which returns 3 unchanged. The answer is 3."
          - problem: "Write the full proof: the forgetful functor from Mon to Set is a functor. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Objects: send each monoid (M, *, e) to its underlying set M. Morphisms: send each monoid homomorphism h: M to N to the same function h, viewed as a function from U(M) to U(N). Identity law: the identity homomorphism 1_M is the identity function on M, so U(1_M) = 1_{U(M)}. Composition law: for homomorphisms f: L to M and g: M to N, the composite g∘f is a homomorphism, and its underlying map is the composite of the underlying maps, so U(g∘f) = U(g)∘U(f). Both laws reduce to the single fact that the underlying map of a composite is the composite of the underlying maps. Hence U preserves identities and composition, and U: Mon to Set is a functor."
      - id: kp2
        name: Free functors
        key_prerequisites: [monoids]
        constraints: "Free constructions on a set: words $X^*$, pointed sets $X_+$, or the free vector space $k^{(X)}$; show the morphism part preserves the structure, then check both functor laws on generators/letters."
        exemplars:
          - problem: "Let X = {1, 2} and Y = {3, 7}, with f(1) = 7 and f(2) = 3. In the free monoid functor, the morphism part f^* sends a word to the word of images of its letters, and fixes the empty word. Give the last letter of f^*(2121)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free monoid on X is the set of finite words with concatenation and the empty word as unit. The morphism part applies f letterwise: f^*(x1...xn) = f(x1)...f(xn). Apply f letterwise to 2121: f(2)=3, f(1)=7, f(2)=3, f(1)=7, so f^*(2121) = 3737. The last letter is 7."
          - problem: "Let X = {2, 3} and Y = {4, 9}, with f(2) = 9 and f(3) = 4. The free pointed set functor sends X to X+ = X union {*}, with basepoint *. Its morphism part f+ acts as f on X and fixes *. Give f+(3)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free pointed set on X is X+ = X union {*}, with basepoint *. For f: X -> Y, the morphism part is f+(x) = f(x) for x in X and f+(*) = *. Since 3 is an element of X, f+(3) = f(3) = 4. The value is 4."
          - problem: "Let X = {1, 2, 3} and Y = {4, 6}, with f(1) = 4, f(2) = 6, f(3) = 6. The free vector space functor sends X to k^(X) with basis X, and its morphism part is the linear map sending each basis vector x to f(x). Write v = 2*[1] + 5*[2] + 3*[3] in k^(X). Give the coefficient of the basis element 6 in F(f)(v)."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free vector space k^(X) has basis X, and F(f) is the linear map with F(f)(x) = f(x) on basis vectors. By linearity, F(f)(v) = 2*F(f)(1) + 5*F(f)(2) + 3*F(f)(3) = 2*[4] + 5*[6] + 3*[6] = 2*[4] + 8*[6]. The coefficient of the basis element 6 is 8."
          - problem: "Let X = {1, 2}, Y = {3, 4}, Z = {5, 6}, with f(1) = 3, f(2) = 4 and g(3) = 5, g(4) = 6. The composition law of the free monoid functor gives (g o f)* = g* o f*, so on a one-letter input the two sides agree with the composite function. Give the value of (g o f)(2)."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The free monoid functor sends a set X to the monoid of finite words over X and a function f to the letterwise monoid map f*. Its composition law gives (g o f)* = g* o f*, so on a one-letter input both sides act as the composite function. Evaluate in order: f(2) = 4, and then g(4) = 6. The value is 6."
          - problem: "Claim: for any function f: X -> Y, the map f+ on free pointed sets is a morphism of pointed sets. Step 1: the basepoint of X+ is the added element *. Step 2: f+ acts as f on X and fixes *. Step 3: f+ sends the basepoint of X+ to f(*), an element of Y. Step 4: therefore f+ sends the basepoint to the basepoint, so it is a morphism of pointed sets. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct: the basepoint of X+ is the newly adjoined point. Step 2 is the correct definition of the morphism part. Step 3 is the first invalid step: the point * is not an element of X, so f(*) is undefined, and in fact f+ sends the basepoint * to the basepoint * of Y+. Step 4 is wrong only because it relies on the false Step 3. The first invalid step is Step 3."
          - problem: "In the proof that the free vector space construction is functorial, the line computing the composite on a basis vector x is missing. Select the line that correctly computes F(g o f)(x)."
            answer: "F(g)(F(f)(x))"
            answer_contract: {"kind": "label", "options": [["F(g)(F(f)(x))"], ["F(f)(F(g)(x))"], ["F(g)(F(g)(x))"], ["F(f)(F(f)(x))"]]}
            solution_sketch: "Both F(g o f) and F(g) o F(f) are linear maps, so it suffices to compare them on the basis vector x. The option F(f)(F(g)(x)) reverses the order of composition. The option F(g)(F(g)(x)) applies g twice and drops f. The option F(f)(F(f)(x)) applies f twice and drops g. The correct line is F(g)(F(f)(x)) = g(f(x)), which agrees with (g o f)(x). The answer is F(g)(F(f)(x))."
          - problem: "Write the full proof: Show the free monoid construction X -> X* (finite words under concatenation) extends to a functor Set -> Mon. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1. Object part: for a set X, let X* be the set of finite words with letters in X, together with the empty word; concatenation is associative and the empty word is its unit, so X* is a monoid. Step 2. Morphism part: for a function f: X -> Y define f^*: X* -> Y* by f^*(x1...xn) = f(x1)...f(xn) on nonempty words and f^*(empty word) = empty word. Step 3. Homomorphism check: for words u and v, the letters of uv are the letters of u followed by the letters of v, so f^*(uv) = f^*(u) f^*(v), and the empty word is fixed; hence f^* is a monoid homomorphism. Step 4. Identity law: for the identity function 1_X, the map (1_X)^* fixes every letter and the empty word, so (1_X)^* is the identity homomorphism on X*. Step 5. Composition law: for f: X -> Y and g: Y -> Z, both (g o f)^* and g^* o f^* send each letter x to g(f(x)) and fix the empty word, so they agree on every one-letter word and on the empty word; since both are homomorphisms and every word is a concatenation of single letters, they agree on all words, giving (g o f)^* = g^* o f^*. Step 6. Both functor laws hold on the generators (single letters and the empty word), and the homomorphism property propagates them to all words; therefore X -> X* with f -> f^* is a functor Set -> Mon."
      - id: kp3
        name: Constant and diagonal functors
        key_prerequisites: [functors]
        constraints: "Only $\\Delta_D$ (constant at an object) and $\\Delta\\colon\\mathcal C\\to\\mathcal C\\times\\mathcal C$; verification is a one-line check of each law."
        exemplars:
          - problem: "Let D be the category with objects 0 and 1 and three morphisms: the two identities and one arrow from 0 to 1. The constant functor Delta_1: C -> D at the object 1 sends every object of C to 1 and every morphism of C to the identity of 1. The category C has 6 morphisms. Compute how many distinct morphisms of D occur as values of Delta_1 on morphisms of C."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of the constant functor on morphisms): Delta_1 sends every one of the 6 morphisms of C to the single morphism id_1 of D, so the full map on morphisms takes all 6 morphisms to the same value. Step 2 (count distinct values): a map whose 6 values are all the same morphism has exactly 1 distinct value, namely id_1. The answer is 1."
          - problem: "The diagonal functor Delta: C -> C x C sends each object x of C to the pair (x, x). The category C is the poset with objects a, b, c and order a < b < c, so C has 3 objects. Compute the number of distinct objects of C x C that occur as values of Delta on objects of C."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of the diagonal functor on objects): Delta sends the object a to the pair (a, a), the object b to (b, b), and the object c to (c, c). Step 2 (count distinct values): these three pairs are distinct objects of C x C, and every value of Delta on objects is one of them, so there are exactly 3 distinct values. The answer is 3."
          - problem: "The diagonal functor Delta: C -> C x C sends each morphism m of C to the pair (m, m). The category C is the poset with objects a, b, c and order a < b < c, so C has 6 morphisms: 3 identities and 3 order arrows. Compute the number of distinct morphisms of C x C that occur as values of Delta on morphisms of C."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of the diagonal functor on morphisms): each of the 6 morphisms of C is sent to its diagonal pair, giving 6 values (m, m) in C x C. Step 2 (injectivity of the image): two diagonal pairs (m, m) and (n, n) are equal only when m = n, so distinct morphisms of C give distinct values, and all 6 values are distinct. The answer is 6."
          - problem: "In the product category C x C a morphism is a pair (u, v) of morphisms of C, and the image of the diagonal functor Delta: C -> C x C on morphisms is exactly the set of pairs (m, m) whose two entries are equal. The poset C with objects a, b, c has 6 morphisms. Compute the number of morphisms of C x C that are not in the image of Delta on morphisms."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (count the product): a morphism of C x C is a pair (u, v) with u and v chosen among the 6 morphisms of C, so C x C has 6 times 6 = 36 morphisms. Step 2 (subtract the image of Delta): the image of Delta on morphisms consists of the 6 diagonal pairs found by the definition of Delta, so the complement has 36 - 6 = 30 morphisms. The answer is 30."
          - problem: "Claim: the diagonal functor Delta: C -> C x C preserves composition, where C is the poset a < b < c. Step 1: Delta sends the arrow a <= b to the pair (a <= b, a <= b). Step 2: in C x C, the pair (b <= c, b <= c) composed with the pair (a <= b, a <= b) equals the pair (a <= c, a <= c). Step 3: Delta sends the arrow a <= c to the pair (a <= c, a <= b). Step 4: therefore Delta(b <= c) composed with Delta(a <= b) equals Delta(a <= c). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct by the definition of Delta on morphisms: every arrow is sent to its diagonal pair. Step 2 is correct: composition in C x C is coordinatewise, and in the poset the arrow b <= c composed after a <= b is a <= c, so both coordinates give a <= c. Step 3 is the first invalid step: the definition of Delta forces Delta(a <= c) = (a <= c, a <= c), so writing the second coordinate as a <= b is the error of copying the codomain of the first arrow into the second slot. Step 4 states the true composition law and becomes valid once Step 3 is corrected. The answer is Step 3."
          - problem: "To check that the constant functor Delta_1: C -> D preserves composition, one rewrites the value of Delta_1 on a composite of two morphisms of C as the identity of 1 composed with the identity of 1. Which property of Delta_1 justifies this rewrite? Select the fact."
            answer: "Delta_1 sends every morphism of C to the identity of the fixed object 1"
            answer_contract: {"kind": "label", "options": [["Delta_1 sends every morphism of C to the identity of the fixed object 1"], ["Delta_1 sends every morphism of C to the identity of its own target"], ["Delta_1 sends every object of C to the identity of the fixed object 1"], ["composition of any two morphisms of C is again an identity"]]}
            solution_sketch: "The definition of the constant functor on morphisms sends every morphism of C to the identity of the fixed object 1, so the value on any composite is id_1, which factors as id_1 composed with id_1. The option about the identity of its own target is the error of confusing Delta_1 with a target-respecting map; Delta_1 ignores the morphism completely. The option about every object going to the identity of 1 mixes up the action on objects, which gives the object 1 itself, with the action on morphisms. The option that a composite in C is an identity is a false property of C that the composition law never uses. The answer is: Delta_1 sends every morphism of C to the identity of the fixed object 1."
          - problem: "Write the full proof: the diagonal functor Delta: C -> C x C is a functor. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: define Delta on objects by Delta(C) = (C, C) for every object C of C. Step 2: define Delta on morphisms by Delta(f) = (f, f) for every morphism f from C to C-prime of C; the pair (f, f) is a morphism from (C, C) to (C-prime, C-prime) in the product category, since each coordinate is such a morphism. Step 3: identity law: Delta(1_C) = (1_C, 1_C), and the identity morphism of the object (C, C) in C x C is exactly the pair (1_C, 1_C), so Delta preserves identities. Step 4: composition law: for composable morphisms f from C to C-prime and g from C-prime to C-double-prime, Delta(g composed with f) = (g composed with f, g composed with f), while Delta(g) composed with Delta(f) = (g, g) composed with (f, f), which equals (g composed with f, g composed with f) by coordinatewise composition in the product category. The two sides agree. Step 5: both functor laws hold, so Delta: C -> C x C is a functor."
    diagnostic_exemplar:
      problem: "For a function $f\\colon X\\to Y$ define $f^*\\colon X^*\\to Y^*$ on the free monoids of finite words by $f^*(x_1\\cdots x_n)=f(x_1)\\cdots f(x_n)$ and $f^*(\\varepsilon)=\\varepsilon$. Show that $f^*$ is a monoid homomorphism and that $(-)^*$ is a functor $\\mathbf{Set}\\to\\mathbf{Mon}$."
      answer: "Homomorphism: $f^*$ sends the unit $\\varepsilon$ to $\\varepsilon$ and preserves concatenation, since applying $f$ letterwise to $uv$ gives $f^*(u)f^*(v)$. Functor laws: $1_X^*$ applies $1_X$ letterwise, so $1_X^*=1_{X^*}$; and $(g\\circ f)^*$ applies $g\\circ f$ letterwise, which is the same as applying $f$ letterwise then $g$ letterwise, so $(g\\circ f)^*=g^*\\circ f^*$. Hence $(-)^*$ is a functor."
      solution_sketch: "Everything reduces to the phrase: apply $f$ letterwise. That description makes $f^*$ fix $\\varepsilon$ and respect concatenation, and it makes applying $g\\circ f$ letterwise visibly the same as applying $f$ letterwise and then $g$ letterwise."
    anki_seeds:
      - front: "What does a forgetful functor do?"
        back: "drops structure, e.g. $\\mathbf{Grp}\\to\\mathbf{Set}$."
        type: basic
      - front: "What does a free functor do?"
        back: "builds the free structure on a set, e.g. $X\\mapsto X^*$ ($\\mathbf{Set}\\to\\mathbf{Mon}$)."
        type: basic
      - front: "The constant functor $\\Delta_D$ sends every morphism to..."
        back: "the identity $1_D$."
        type: basic

  - id: covariant-contravariant-functors
    name: Covariant and Contravariant Functors
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: functors
        weight: 0.5
        key: true
      - id: duality-opposite-categories
        weight: 0.4
        key: true
      - id: functor-examples
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Contravariant = functor on the opposite category
        key_prerequisites: [duality-opposite-categories]
        constraints: "State the reversed composition law $F(g\\circ f)=Ff\\circ Fg$ explicitly; instances are the preimage power-set or order-reversing poset maps."
        exemplars:
          - problem: "Let f map {1,2,3,4} to {a,b,c} by sending 1 and 3 to a, 2 to b, and 4 to c. The preimage power-set action, which satisfies the reversed composition law F(g o f) = Ff o Fg, sends a subset T of the codomain to f^-1[T]. In Step 2 of its verification, take T = {b, c}. How many elements are in f^-1[T]?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 2 of the verification applies the definition P^-1(f)(T) = f^-1[T] to the full function f: {1,2,3,4} -> {a,b,c} with f(1) = a, f(2) = b, f(3) = a, f(4) = c, and T = {b, c}. The elements sent into {b, c} are 2 and 4, so f^-1[T] = {2, 4}. This set has 2 elements. The answer is 2."
          - problem: "To show that an order-reversing map phi between posets is a contravariant functor, one proves it is a functor on the opposite category, obeying the reversed composition law F(g o f) = Ff o Fg. Step 1 of that proof counts the arrows of the opposite poset P^op. Let P be the poset 0 < 1 < 2. How many arrows does P^op have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 counts arrows: a poset category has one arrow for each pair x <= y plus one identity at each object. In P = {0 < 1 < 2} there are 3 identities and the 3 arrows 0 -> 1, 0 -> 2, 1 -> 2, so 6 arrows. The opposite category P^op has one arrow for each arrow of P, with its direction reversed, so it has the same number. The answer is 6."
          - problem: "The preimage power-set action satisfies the reversed composition law P^-1(g o f) = P^-1(f) o P^-1(g). Step 4 of its verification checks the identity law: P^-1(1_A) must fix every subset of A. Let A = {1, 2, 3}. How many subsets of A does P^-1(1_A) fix?"
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 4 checks the identity law on the full object A = {1, 2, 3}: since (1_A)^-1[T] = T for every subset T, the map P^-1(1_A) is the identity on P(A). The power set of a 3-element set has 2^3 = 8 subsets. So P^-1(1_A) fixes 8 subsets. The answer is 8."
          - problem: "Claim: the preimage power-set P^-1, given by P^-1(f)(T) = f^-1[T], satisfies the reversed law P^-1(g o f) = P^-1(f) o P^-1(g) for composable maps f: A -> B and g: B -> C. A proof offers: Step 1: for any subset T of C, an element x of A lies in (g o f)^-1[T] exactly when g(f(x)) lies in T. Step 2: g(f(x)) lies in T exactly when f(x) lies in g^-1[T]. Step 3: that holds exactly when f(x) lies in T, because g sends every element of B into T. Step 4: chaining the steps gives (g o f)^-1[T] = f^-1[g^-1[T]], which is the reversed law. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the correct unfolding of membership in a preimage. Step 2 is correct: T is a subset of C, so g(f(x)) lies in T exactly when f(x) lies in g^-1[T]. Step 3 is false: g need not send every element of B into T, and the correct next line is f(x) in g^-1[T], not f(x) in T. Step 4 fails only because it builds on the broken Step 3. The answer is Step 3."
          - problem: "In the proof that an order-reversing map phi from a poset P to a poset Q is a functor on the opposite category, obeying the reversed composition law, one line is missing: the line that starts from a comparison x before y in P and applies phi to it, producing an arrow of Q. Select the line that is correct and shows the reversal of the comparison."
            answer: "phi(y) <= phi(x)"
            answer_contract: {"kind": "label", "options": [["phi(y) <= phi(x)"], ["phi(x) <= phi(y)"], ["phi(y) < phi(x)"], ["y <= x"]]}
            solution_sketch: "The order-reversing definition turns a comparison x <= y in P into phi(y) <= phi(x) in Q, which is the arrow phi(y) -> phi(x). The option phi(x) <= phi(y) keeps the original order, the error of treating phi as order-preserving. The option phi(y) < phi(x) replaces the non-strict order with a strict one, losing the case x = y. The option y <= x restates the opposite comparison in P without applying phi. The answer is phi(y) <= phi(x)."
          - problem: "An order-reversing map phi between posets sends each comparison x <= y to phi(y) <= phi(x), and it is exactly a contravariant functor, that is, a functor on the opposite category obeying F(g o f) = Ff o Fg. As a final check, take P as the poset 0 < 1 < 2 < 3 and Q as the poset 0 < 1. How many order-reversing maps phi from P to Q are there?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Since hom-sets of a poset category have at most one element, the functor laws hold automatically, so order-reversing maps are just nonincreasing sequences of length 4 with values 0 and 1. The sequences are 1,1,1,1; 1,1,1,0; 1,1,0,0; 1,0,0,0; and 0,0,0,0, one for each drop position plus the two constant ones. That gives 5 maps. The answer is 5."
          - problem: "Write the full proof: the preimage power-set P^-1: Set^op -> Set, defined by P^-1(f)(T) = f^-1[T], is a contravariant functor. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: recall that a contravariant functor on a category C is a functor from C^op to D; on arrows it sends f: A -> B to Ff: FB -> FA and must obey the reversed composition law F(g o f) = Ff o Fg and the identity law F(1_A) = 1_{FA}. Step 2: for the preimage power-set, an arrow f: A -> B of Set is sent to P^-1(f): P(B) -> P(A), the map T -> f^-1[T]. Step 3: composition: for f: A -> B, g: B -> C and a subset T of C, an element x of A lies in (g o f)^-1[T] iff g(f(x)) lies in T, iff f(x) lies in g^-1[T], iff x lies in f^-1[g^-1[T]]; hence (g o f)^-1[T] = f^-1[g^-1[T]], which is exactly P^-1(g o f) = P^-1(f) o P^-1(g), the reversed law. Step 4: identity: (1_A)^-1[T] = T for every subset T of A, so P^-1(1_A) = 1_{P(A)}. Conclusion: both functor laws hold, so P^-1 is a functor Set^op -> Set, that is, a contravariant functor on Set."
      - id: kp2
        name: Composing variances
        key_prerequisites: [functors]
        constraints: "Prove the variance of a composite by expanding the composition law symbolically — the two orders of reversal must be tracked step by step, never asserted."
        exemplars:
          - problem: "Let $F$ and $G$ be contravariant functors. In the expansion of $(F\\circ G)(g\\circ f)$, after applying $G$ to $g\\circ f$, the composite becomes $Gf\\circ Gg$. How many order reversals have occurred at this intermediate step?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: apply $G$. Since $G$ is contravariant, $G(g\\circ f)=Gf\\circ Gg$; the order of $f$ and $g$ has reversed once. Step 2: count reversals up to this point. The original order is $g\\circ f$; the intermediate order is $Gf\\circ Gg$, so one reversal. The answer is 1."
          - problem: "Let $F$ preserve the order of composition and $G$ reverse it. Expand $(F\\circ G)(g\\circ f)$ and determine the variance of $F\\circ G$. Select the variance."
            answer: "contravariant"
            answer_contract: {"kind": "label", "options": [["covariant"], ["contravariant"], ["mixed"], ["undefined"]]}
            solution_sketch: "Step 1: apply $G$. Since $G$ reverses order, $G(g\\circ f)=Gf\\circ Gg$. Step 2: apply $F$. Since $F$ preserves order, $F(Gf\\circ Gg)=F(Gf)\\circ F(Gg)$, so $(F\\circ G)(g\\circ f)=FG(f)\\circ FG(g)$. The option covariant is the error of forgetting that the single reversal by $G$ still stands after $F$ preserves order. The option mixed is the error of thinking a composite can carry two variances at once. The option undefined is the error of thinking functors of mixed variance do not compose. Exactly one reversal remains, so the answer is contravariant."
          - problem: "Let $F$, $G$, and $H$ be contravariant functors. In the full expansion of $(F\\circ G\\circ H)(g\\circ f)$, how many order reversals occur in total?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: apply $H$. Since $H$ is contravariant, $H(g\\circ f)=Hf\\circ Hg$, one reversal. Step 2: apply $G$. Since $G$ is contravariant, $G(Hf\\circ Hg)=G(Hg)\\circ G(Hf)$, a second reversal. Step 3: apply $F$. Since $F$ is contravariant, $F(G(Hg)\\circ G(Hf))=F(G(Hf))\\circ F(G(Hg))$, a third reversal. The answer is 3."
          - problem: "Let $F$ be contravariant, $G$ covariant, and $H$ contravariant. In the expansion of $(F\\circ G\\circ H)(g\\circ f)$, how many order reversals occur in total?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: apply $H$. Since $H$ is contravariant, $H(g\\circ f)=Hf\\circ Hg$, one reversal. Step 2: apply $G$. Since $G$ is covariant, $G(Hf\\circ Hg)=G(Hf)\\circ G(Hg)$, no new reversal. Step 3: apply $F$. Since $F$ is contravariant, $F(G(Hf)\\circ G(Hg))=F(G(Hg))\\circ F(G(Hf))$, a second reversal. The answer is 2."
          - problem: "Let $F$, $G$, $H$, and $K$ be contravariant functors. In the full expansion of $(F\\circ G\\circ H\\circ K)(g\\circ f)$, how many order reversals occur in total?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: apply $K$. Since $K$ is contravariant, $K(g\\circ f)=Kf\\circ Kg$, one reversal. Step 2: apply $H$, giving a second reversal. Step 3: apply $G$, giving a third reversal. Step 4: apply $F$, giving a fourth reversal. The answer is 4."
          - problem: "Claim: the composite of two order-reversing functors is order-reversing. Step 1: Let $F$ and $G$ be order-reversing. Step 2: $G(g\\circ f)=Gf\\circ Gg$. Step 3: $F(Gf\\circ Gg)=F(Gf)\\circ F(Gg)$. Step 4: Therefore $(F\\circ G)(g\\circ f)=FG(f)\\circ FG(g)$, so $F\\circ G$ is order-reversing. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The option Step 1 is wrong because setting the hypotheses is valid. The option Step 2 is wrong because an order-reversing functor does send $g\\circ f$ to $Gf\\circ Gg$. Step 3 is false: since $F$ is order-reversing, $F(Gf\\circ Gg)=F(Gg)\\circ F(Gf)$, not $F(Gf)\\circ F(Gg)$. The option Step 4 would follow from the corrected Step 3, so it is not the first failure. The answer is Step 3."
          - problem: "Write the full proof: the composite of three contravariant functors is contravariant. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let $F$, $G$, and $H$ be contravariant functors. Step 1: expand the composite on a composable pair $f: A\\to B$ and $g: B\\to C$. Step 2: apply $H$ first. Since $H$ is contravariant, $H(g\\circ f)=Hf\\circ Hg$. Step 3: apply $G$. Since $G$ is contravariant, $G(Hf\\circ Hg)=G(Hg)\\circ G(Hf)$. Step 4: apply $F$. Since $F$ is contravariant, $F(G(Hg)\\circ G(Hf))=F(G(Hf))\\circ F(G(Hg))$. Step 5: rewrite this as $(F\\circ G\\circ H)(f)\\circ (F\\circ G\\circ H)(g)$. This reverses the order, so the composite is contravariant. Identities are preserved because each functor preserves identities. Therefore $F\\circ G\\circ H$ is contravariant."
      - id: kp3
        name: Reading off variance in examples
        key_prerequisites: [functors]
        constraints: "Decide variance from the direction of the morphism part AND the composition law; examples limited to duals of vector spaces, group inversion, preimage, and hom-functors."
        exemplars:
          - problem: "Let f: R -> R be f(x) = 3x and g: R -> R be g(y) = 2y, and let phi be the functional phi(y) = 5y on the target of f. The dual construction sends a map h to h* with h*(phi) = phi composed with h. To check the composition law of the dual functor, evaluate f*(g*(phi))(1). Give the value."
            answer: "30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the morphism parts, f(x) = 3x and g(y) = 2y, so g composed with f sends x to 6x. Step 2: apply the contravariant law (g composed with f)* = f* composed with g*. Step 3: compute g*(phi)(y) = phi(2y) = 10y, then f*(g*(phi))(x) = 10(3x) = 30x. Evaluating at x = 1 gives 30. The answer is 30."
          - problem: "View the residues 1, 2, 3, 4, 5, 6 under multiplication mod 7 as a one-object category, and let inversion send each residue to its multiplicative inverse. For g = 2 and h = 3, the composition law for inversion says the image of the product gh is h^(-1) times g^(-1). Give that residue."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: find inverses in the group mod 7: 2 times 4 = 8 = 1, so the inverse of 2 is 4, and 3 times 5 = 15 = 1, so the inverse of 3 is 5. Step 2: the law for inversion reverses the order: the image of gh is h^(-1) times g^(-1) = 5 times 4 = 20, which is 6 mod 7. Step 3: check directly: gh = 6 and the inverse of 6 is 6, so both readings agree, and the order-reversing law makes inversion contravariant. The answer is 6."
          - problem: "Let X = {0, 1}, A = {5, 6} and B = {7, 8, 9}. Let f: A -> B be given by f(5) = 7 and f(6) = 9, and let g: X -> A be given by g(0) = 6 and g(1) = 5. The hom-functor Hom(X, -) sends f to the map Hom(X, A) -> Hom(X, B) given by postcomposition with f. Give (Hom(X, f))(g)(1)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Hom(X, A) is the set of functions X -> A; here g sends 0 to 6 and 1 to 5. Step 2: the morphism part of Hom(X, -) is postcomposition, so (Hom(X, f))(g) = f composed with g. Step 3: evaluate at 1: f(g(1)) = f(5) = 7; the map goes from Hom(X, A) to Hom(X, B), the same direction as f, so this hom-functor is covariant. The answer is 7."
          - problem: "Let X = {0, 1}, A = {1, 2} and B = {3, 4, 5}. Let f: A -> B be given by f(1) = 3 and f(2) = 5, and let h: B -> X be given by h(3) = 1, h(4) = 0 and h(5) = 1. The hom-functor Hom(-, X) sends f to the map Hom(B, X) -> Hom(A, X) given by precomposition with f. Give (Hom(f, X))(h)(2)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Hom(B, X) is the set of functions B -> X; here h sends 3 to 1, 4 to 0 and 5 to 1. Step 2: the morphism part of Hom(-, X) is precomposition, so (Hom(f, X))(h) = h composed with f, a map from Hom(B, X) to Hom(A, X), opposite to the direction of f. Step 3: evaluate at 2: h(f(2)) = h(5) = 1. The answer is 1."
          - problem: "Let f: {1, 2, 3} -> {4, 5} be given by f(1) = 4, f(2) = 5 and f(3) = 4, and let g: {4, 5} -> {6} be the only possible function. For the subset S = {6} of {6}, consider the preimage functor, which sends a function to the map taking subsets of the codomain to their preimages. Give the number of elements of (g composed with f)^(-1)(S)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: g composed with f sends 1, 2, 3 all to 6, since f sends 1 and 3 to 4 and 2 to 5, and g sends both 4 and 5 to 6. Step 2: the preimage of S = {6} under g composed with f is the whole set {1, 2, 3}, which has 3 elements. Step 3: check the composition law: g^(-1)(S) = {4, 5} and f^(-1)({4, 5}) = {1, 2, 3}, so (g composed with f)^(-1) = f^(-1) composed with g^(-1), the contravariant law. The answer is 3."
          - problem: "Let S = {1, 2, 3}. Let a be the bijection of S with a(1) = 2, a(2) = 1 and a(3) = 3, and let b be the bijection of S with b(1) = 1, b(2) = 3 and b(3) = 2. Take the one-object category whose morphisms are the bijections of S, with composition of functions, and let inversion send each bijection to its inverse. Let c be the composite that sends each element x of S to b(a(x)). The composition law for inversion is that the inverse of a composite is the composite of the inverses in the reverse order, which is the contravariant law. Give the value at 1 of the inverse of c."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the single object is S = {1, 2, 3} and the morphisms are the bijections of S, composed as functions; the given bijections are a(1) = 2, a(2) = 1, a(3) = 3 and b(1) = 1, b(2) = 3, b(3) = 2. Step 2: the morphism part is inversion, which sends each bijection to its inverse, a bijection of the same set S, so the one object is preserved. Step 3: the composition law (b composed with a)^(-1) = a^(-1) composed with b^(-1) reverses the order, which is the contravariant law. Step 4: c sends 1 to b(a(1)) = b(2) = 3, so its inverse sends 1 to the element w with c(w) = 1; c(2) = b(a(2)) = b(1) = 1, so that element is 2. The answer is 2."
          - problem: "Write the full proof: for a fixed set X, the preimage construction is a contravariant functor. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects): fix a set X; the construction sends each set A to its power set P(A). Step 2 (morphism part): for f: A -> B, send f to the map f^(-1): P(B) -> P(A) with f^(-1)(S) = {a in A : f(a) in S}; it carries subsets of B to subsets of A, so the direction is reversed, which already signals contravariance. Step 3 (identities): for f = id_A, f^(-1)(S) = S for every subset S, so identities map to identities. Step 4 (composition law): for f: A -> B, g: B -> C and S a subset of C, (g composed with f)^(-1)(S) = {a : g(f(a)) in S} = {a : f(a) in g^(-1)(S)} = f^(-1)(g^(-1)(S)), so (g composed with f)^(-1) = f^(-1) composed with g^(-1), the contravariant law. Step 5 (conclusion): the direction reversal and the reversed composition both hold, so the preimage construction is a contravariant functor. See the solution."
    diagnostic_exemplar:
      problem: "Prove that the composite of two contravariant functors is covariant."
      answer: "Let $G\\colon\\mathcal C^{op}\\to\\mathcal D$ and $F\\colon\\mathcal D^{op}\\to\\mathcal E$ be contravariant, so $G(g\\circ f)=Gf\\circ Gg$ and $F$ likewise reverses order. Then $FG(g\\circ f)=F(Gf\\circ Gg)=F(Gg)\\circ F(Gf)=FG(g)\\circ FG(f)$ — the two reversals cancel, restoring the covariant composition law. Identities are preserved by both, so $F\\circ G$ is a covariant functor."
      solution_sketch: "Track the order of a composite through both functors: each contravariant step reverses it, and two reversals restore the original order. Identities survive both steps, so the composite obeys the covariant laws."
    anki_seeds:
      - front: "Contravariant functor composition law?"
        back: "$F(g\\circ f)=Ff\\circ Fg$ (order reversed); equivalently a functor $\\mathcal C^{op}\\to\\mathcal D$."
        type: basic
      - front: "contravariant $\\circ$ contravariant $=$ {{c1::covariant}}."
        back: "covariant"
        type: cloze

  - id: full-faithful-functors
    name: Full and Faithful Functors
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: functors
        weight: 0.5
        key: true
      - id: functions-injective-surjective
        weight: 0.3
        key: true
      - id: functor-examples
        weight: 0.2
      - id: isomorphism-vs-equality
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Definitions via the action on hom-sets
        key_prerequisites: [functors]
        constraints: "Phrase everything through the hom-set maps $F_{A,B}$; closure proofs (composites of faithful/full functors) factor $(GF)_{A,B}$ through the two hom-set maps."
        exemplars:
          - problem: "Let C be the finite category with objects A and B, with Hom_C(A,B) = {f1, f2, f3}, Hom_C(B,A) empty, and only the identity on each object. Let D be the finite category with objects X and Y, with Hom_D(X,Y) = {u, v}, Hom_D(Y,X) empty, and only the identities otherwise. The functor F sends A to X, B to Y, f1 to u, f2 to u, and f3 to v. Give the number of distinct morphisms in the image of the hom-set map F_{A,B}."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of the hom-set map): F_{A,B} sends f1, f2, f3 to u, u, v. Step 2 (counting distinct values): the only distinct values are u and v, so the image has 2 elements. Step 3 (definition of faithful): the distinct morphisms f1 and f2 share the image u, so F_{A,B} is not injective and F is not faithful. The image of F_{A,B} has 2 morphisms."
          - problem: "Let C be the finite category with objects A and B, Hom_C(A,B) = {f1, f2, f3, f4}, Hom_C(B,A) empty, and only the identities otherwise. Let D be the finite category with objects X and Y, Hom_D(X,Y) = {u1, u2, u3, u4}, Hom_D(Y,X) empty, and only the identities otherwise. Let E be the finite category with objects P and Q, Hom_E(P,Q) = {w1, w2, w3, w4}, Hom_E(Q,P) empty, and only the identities otherwise. The functor F sends A to X, B to Y, f1 to u1, f2 to u1, f3 to u2, f4 to u3. The functor G sends X to P, Y to Q, u1 to w1, u2 to w2, u3 to w3, u4 to w4. Give the number of distinct morphisms in the image of the composite hom-set map (GF)_{A,B}."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (factorization of the composite hom-set map): (GF)_{A,B} equals G_{FA,FB} after F_{A,B}, since (GF)f = G(Ff) for every morphism f. Step 2 (image of F_{A,B}): F sends f1, f2, f3, f4 to u1, u1, u2, u3, so the image is {u1, u2, u3}. Step 3 (apply the second factor): G sends u1, u2, u3 to w1, w2, w3, so the image of (GF)_{A,B} is {w1, w2, w3}. Step 4 (definition of faithful): f1 and f2 are distinct with the same image under (GF)_{A,B}, so this composite map is not injective. The image of (GF)_{A,B} has 3 morphisms."
          - problem: "Let C be the finite category with objects A and B, Hom_C(A,B) = {f1, f2}, Hom_C(B,A) empty, and only the identities otherwise. Let D be the finite category with objects X and Y, Hom_D(X,Y) = {u1, u2, u3, u4}, Hom_D(Y,X) empty, and only the identities otherwise. The functor F sends A to X, B to Y, f1 to u1, and f2 to u3. Give the number of morphisms of Hom_D(X,Y) that have no preimage under the hom-set map F_{A,B}."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of full): F is full exactly when each F_{A,B} is surjective, so every element of Hom_D(X,Y) must lie in the image of F_{A,B}. Step 2 (compute the image): F sends f1 to u1 and f2 to u3, so the image is {u1, u3}. Step 3 (count the gap): u2 and u4 have no preimage, so F_{A,B} is not surjective and F is not full. The number of morphisms with no preimage is 2."
          - problem: "Let C be the finite category with objects A and B, Hom_C(A,B) = {f1, f2, f3, f4}, Hom_C(B,A) empty, and only the identities otherwise. Let D be the finite category with objects X and Y, Hom_D(X,Y) = {u1, u2, u3}, Hom_D(Y,X) empty, and only the identities otherwise. The functor F sends A to X, B to Y, f1 to u1, f2 to u1, f3 to u1, and f4 to u2. In the proof that F is not faithful, one counts the unordered pairs of distinct morphisms of Hom_C(A,B) that have the same image under F_{A,B}. Give that number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of faithful): F is faithful exactly when each F_{A,B} is injective, so a failure of faithfulness is a pair of distinct morphisms with the same image. Step 2 (compute the values): F_{A,B} sends f1, f2, f3 all to u1, and f4 to u2. Step 3 (count the pairs): the unordered pairs with equal images are f1 with f2, f1 with f3, and f2 with f3. The number of such pairs is 3."
          - problem: "Claim: if F and G are full functors, then the composite GF is full. Argument. Step 1: Let k be a morphism from GFA to GFB in the target category. Step 2: Since G is full, there is a morphism h from FA to FB with Gh = k. Step 3: Since F is full, there is a morphism f from A to B with Gf = h. Step 4: Then (GF)f = G(Ff) = Gh = k. Step 5: Hence (GF)_{A,B} is surjective, so GF is full. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: k is a morphism from GFA to GFB, exactly the kind of morphism that surjectivity of (GF)_{A,B} must hit. Step 2 is valid: fullness of G gives h from FA to FB with Gh = k. Step 3 is the first invalid step: fullness of F gives f from A to B with Ff = h, not with Gf = h; the equation Gf = h confuses the two functors, since f lives in C where G is not defined. Step 4 would be valid once Step 3 is repaired, since G(Ff) = Gh = k. Step 5 is the correct conclusion after the repair. The answer is Step 3."
          - problem: "To prove that the composite GF of two functors is faithful, one shows that the hom-set map (GF)_{A,B} is injective by writing it as a composite of the two hom-set maps of F and G. Select the correct factorization of (GF)_{A,B}."
            answer: "G after F on the pair A,B"
            answer_contract: {"kind": "label", "options": [["G after F on the pair A,B"], ["F after G on the pair A,B"], ["G on A,B after F on A,B"], ["F on FA,FB after G on FA,FB"]]}
            solution_sketch: "Step 1 (computation of the composite): for a morphism f from A to B, (GF)f = G(Ff), so the map F_{A,B} is applied first and the map G_{FA,FB} second. Step 2 (the wrong options): F after G on the pair A,B reverses the order and cannot type-check; G on A,B after F on A,B applies G to a morphism of C, but G acts on the category D; F on FA,FB after G on FA,FB swaps the roles of F and G. Step 3 (conclusion): the correct factorization applies F on A,B first and G on FA,FB second. The correct factorization is G after F on the pair A,B."
          - problem: "Write the full proof: if F and G are fully faithful functors, then the composite GF is fully faithful. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): let F go from C to D and G from D to E be fully faithful, and let A, B be objects of C. Step 2 (factorization of the composite hom-set map): (GF)_{A,B} from Hom_C(A,B) to Hom_E(GFA,GFB) factors as G_{FA,FB} after F_{A,B}, because (GF)f = G(Ff) for every morphism f from A to B. Step 3 (injectivity): if (GF)f = (GF)g, then G(Ff) = G(Fg); since G_{FA,FB} is injective, Ff = Fg, and since F_{A,B} is injective, f = g. Hence (GF)_{A,B} is injective. Step 4 (surjectivity): let k be a morphism from GFA to GFB. Since G is full, there is h from FA to FB with Gh = k; since F is full, there is f from A to B with Ff = h. Then (GF)f = G(Ff) = Gh = k, so (GF)_{A,B} is surjective. Step 5 (conclusion): each hom-set map (GF)_{A,B} is injective and surjective, hence bijective, so GF is fully faithful. The proof is complete."
      - id: kp2
        name: Examples that separate the notions
        key_prerequisites: [functions-injective-surjective]
        constraints: "Each judgment needs a witness: a non-homomorphism function for 'not full', a collapsed pair of morphisms for 'not faithful'; standard sources are forgetful functors and functors into $\\mathbf 1$."
        exemplars:
          - problem: "Let U: Grp -> Set be the forgetful functor and consider the group Z/2 with elements 0 and 1. The hom-map of U sends each group homomorphism Z/2 -> Z/2 to its underlying function on the set {0,1}. There are four functions from {0,1} to {0,1}. How many of these four functions are group homomorphisms Z/2 -> Z/2?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity element of Z/2 is 0, and a group homomorphism must send 0 to 0. Test the four set functions one by one. The identity function and the constant-zero function send 0 to 0 and preserve addition, so they are homomorphisms. The swap function sends 0 to 1, and the constant-one function sends 0 to 1, so neither preserves the identity and both fail to be homomorphisms. Hence exactly two of the four set functions lie in the image of the hom-map of U. The hom-map is not surjective, so U is not full on this hom-set. The answer is 2."
          - problem: "Let C be the one-object category whose morphisms are the two elements of Z/2 under addition. Let F: C -> 1 be the unique functor to the terminal category. How many distinct morphisms of C does F send to the identity morphism of 1?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The category C has exactly two morphisms, the elements 0 and 1 of Z/2. The terminal category 1 has one object with only its identity morphism. The functor F must send every morphism of C to that identity. Therefore both distinct morphisms of C have the same image, so by the definition of a faithful functor F is not faithful. The answer is 2."
          - problem: "Let C be the category with objects A and B, two parallel morphisms f and g from A to B, and only the required identity morphisms. Let D be the category with objects A and B, one morphism h from A to B, and only the required identity morphisms. Define F by F(A)=A, F(B)=B, and F(f)=F(g)=h. Give the number of unordered pairs of distinct morphisms of C that have the same image under F."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The only distinct morphisms of C outside the identities are f and g, which are parallel arrows A to B. Both are sent by F to the single morphism h. No other pair of distinct morphisms has the same image. Thus there is exactly one such pair, so F is not faithful. The answer is 1."
          - problem: "Let C be the poset category with objects 0 and 1 and exactly one non-identity morphism 0 -> 1. Let D be the same poset category. Define F on objects by F(0)=0 and F(1)=0, and send the non-identity morphism of C to the identity at 0. How many morphisms are in Hom_D(F(1),F(0))?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In D the object 0 has only its identity morphism. Since F(1)=0 and F(0)=0, the hom-set Hom_D(F(1),F(0)) is Hom_D(0,0), which contains exactly the identity. Thus it has one morphism. The hom-set Hom_C(1,0) is empty, so the induced map on this hom-set is not surjective and F is not full. The answer is 1."
          - problem: "Let C be the one-object category whose morphisms are the three elements of Z/3 under addition. Let F: C -> 1 be the unique functor to the terminal category. Give the number of unordered pairs of distinct morphisms of C that have the same image under F."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The category C has three morphisms, the elements 0, 1, and 2 of Z/3. The terminal category 1 has a single identity morphism. The functor F sends all three morphisms to that identity. The number of unordered pairs of distinct morphisms is the number of 2-element subsets of a 3-element set, which is 3. The answer is 3."
          - problem: "Consider the functor F from the one-object category of Z/2 to the terminal category 1. A student argues: Step 1: C has exactly two morphisms. Step 2: F sends both morphisms to the identity of 1. Step 3: A functor is faithful when each hom-map is injective. Step 4: The hom-map sends two morphisms to one, so it is injective. Step 5: Therefore F is faithful. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is true because Z/2 has two elements. Step 2 is true because the terminal category has only its identity. Step 3 is the definition of a faithful functor. Step 5 is a correct conclusion only if Step 4 were true. Step 4 is false because a map that sends two distinct morphisms to one morphism is not injective. The answer is Step 4."
          - problem: "Write the full proof: the forgetful functor U: Grp -> Set is faithful but not full. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Let U send each group to its underlying set and each homomorphism to its underlying function. Faithful: for groups G and H, suppose U(phi) = U(psi) as functions. Then phi(g)=psi(g) for every g in G, so phi=psi as homomorphisms. Thus each hom-map of U is injective, which is the definition of faithful. Not full: take G=H=Z. The function f: Z -> Z with f(n)=n+1 is an ordinary set function, but it is not a group homomorphism because f(0)=1 and a homomorphism must send 0 to 0. Hence f lies in Hom_Set(UZ,UZ) but not in the image of U_{Z,Z}. Therefore U_{Z,Z} is not surjective, so U is not full. This proves U is faithful but not full."
      - id: kp3
        name: Fully faithful functors reflect isomorphisms
        key_prerequisites: [functors]
        constraints: "The proof pattern is fixed: lift via fullness, verify via faithfulness; each application of fullness or faithfulness must be named where used."
        exemplars:
          - problem: "Let F be the automorphism of the additive monoid Z/5 given by F(x) = 2x mod 5. In the proof that F reflects isomorphisms, suppose Ff is an isomorphism with inverse g. By fullness, g = Fh for some h. If f = 4, what is h?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Setup: F is the automorphism of the additive monoid Z/5 with F(x) = 2x mod 5. Compute Ff: with f = 4, Ff = 2*4 = 8 = 3 mod 5. The inverse of 3 is g = 2 in Z/5. Fullness gives h with Fh = g, so 2h = 2 mod 5. Solving gives h = 1. The answer is 1."
          - problem: "In the additive group Z/7, let the automorphism F be F(x) = 3x mod 7. In the reflection proof, Ff is an isomorphism with inverse g, and fullness gives g = Fh. If f = 5, give h."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Setup: F is the automorphism of Z/7 with F(x) = 3x mod 7. Compute Ff = 3*5 = 15 = 1 mod 7. The additive inverse of 1 in Z/7 is g = 6, since 1 + 6 = 0. Fullness gives h with Fh = g, so 3h = 6 mod 7, and h = 2 because 3*2 = 6. The answer is 2."
          - problem: "Work in the additive group Z/8, with the automorphism F given by F(x) = 3x mod 8. In the proof that F reflects isomorphisms, suppose f = 5 and fullness gives h with Fh = g, where g is the inverse of Ff. Give the additive order of h in Z/8."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Setup: F is the automorphism of Z/8 with F(x) = 3x mod 8. Compute Ff = 3*5 = 15 = 7 mod 8. The inverse of 7 is g = 1 because 7 + 1 = 0 mod 8. Fullness gives h with 3h = 1 mod 8, so h = 3 because 3*3 = 9 = 1. The additive multiples of 3 are 3, 6, 1, 4, 7, 2, 5, 0, which returns to 0 only after 8 steps. The answer is 8."
          - problem: "Claim: a fully faithful functor F reflects isomorphisms. Step 1: Suppose Ff is an isomorphism with inverse g. Step 2: By faithfulness, there is h with g = Fh. Step 3: Then F(h f) = Fh Ff = g Ff = 1. Step 4: By faithfulness, h f = 1. Step 5: Similarly F(f h) = 1, so f h = 1 and f is an isomorphism. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 assumes Ff is an isomorphism with inverse g, which is the hypothesis and is valid. Step 2 says faithfulness gives h with g = Fh; that is invalid because fullness gives existence, while faithfulness gives uniqueness. Step 3 computes F(h f) = 1 correctly. Step 4 correctly uses faithfulness to cancel F. Step 5 is the symmetric argument. The answer is Step 2."
          - problem: "In the reflection proof, Step 1 supposes Ff is an isomorphism with inverse g. Step 2 uses the fact that every morphism FB to FA of D equals Fh for some h: B to A, giving g = Fh. Step 3 computes F(h f) = Fh Ff = g Ff = 1 = F(1_A). Step 4 concludes h f = 1_A. Which property of F does Step 4 use to reach its conclusion?"
            answer: "faithfulness"
            answer_contract: {"kind": "label", "options": [["fullness"], ["faithfulness"], ["functoriality"], ["injectivity"], ["surjectivity"]]}
            solution_sketch: "Step 4 cancels F from both sides of F(h f) = F(1_A), which is exactly the injectivity on hom-sets that faithfulness states. Wrong option fullness: it is the existence property used in Step 2 to obtain h, not the cancellation in Step 4. Wrong option functoriality: it gives the composition rule F(h f) = Fh Ff of Step 3, not the conclusion of Step 4. Wrong option injectivity: it names a property of a plain function, not the stated hypothesis of the functor. Wrong option surjectivity: also a plain-function property, and it gives existence, not cancellation. The answer is faithfulness."
          - problem: "Let C be the one-object category of the additive monoid Z/4. Let F from C to Set have FA = {1,2} and F(n) the map sending x to x + n mod 2. Count how many functions from FA to FA are not equal to F(n) for any n. Give that count."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The set FA = {1,2} has two elements, so there are 2^2 = 4 functions from FA to FA. F(0) and F(2) send every x to x, the identity map. F(1) and F(3) send x to x + 1 mod 2, a swap. So the image of F contains 2 functions, which shows F is not full. The remaining 4 - 2 = 2 functions are not in the image. The answer is 2."
          - problem: "Write the full proof: if F from C to D is a fully faithful functor and f: A -> B is a morphism of C for which Ff is an isomorphism, then f is an isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Suppose F: C -> D is fully faithful and Ff: FA -> FB is an isomorphism with inverse g: FB -> FA. By fullness, since g is a morphism FB -> FA, there is h: B -> A with g = Fh. Consider F(h f) = Fh Ff = g Ff = 1_{FA}. Since F(1_A) = 1_{FA}, faithfulness gives h f = 1_A. Similarly, F(f h) = Ff Fh = Ff g = 1_{FB} = F(1_B), so faithfulness gives f h = 1_B. Therefore f is an isomorphism with inverse h."
    diagnostic_exemplar:
      problem: "Prove that a fully faithful functor $F$ reflects isomorphisms: if $Ff$ is an isomorphism, then $f$ is an isomorphism."
      answer: "Let $Ff\\colon FA\\to FB$ have inverse $g\\colon FB\\to FA$. By fullness $g=Fh$ for some $h\\colon B\\to A$. Then $F(h\\circ f)=Fh\\circ Ff=g\\circ Ff=1_{FA}=F(1_A)$, so faithfulness gives $h\\circ f=1_A$. Symmetrically $F(f\\circ h)=Ff\\circ Fh=1_{FB}=F(1_B)$ gives $f\\circ h=1_B$. Hence $h$ is a two-sided inverse and $f$ is an isomorphism."
      solution_sketch: "Fullness supplies the candidate and faithfulness proves it works: lift the inverse of $Ff$ to some $h\\colon B\\to A$, then descend the two identity equations from $\\mathcal D$ to $\\mathcal C$ by cancelling $F$."
    anki_seeds:
      - front: "A functor is faithful when each hom-set map $\\mathrm{Hom}(A,B)\\to\\mathrm{Hom}(FA,FB)$ is..."
        back: "injective."
        type: basic
      - front: "A functor is full when each hom-set map $\\mathrm{Hom}(A,B)\\to\\mathrm{Hom}(FA,FB)$ is..."
        back: "surjective."
        type: basic
      - front: "A fully faithful functor {{c1::reflects isomorphisms}} (if $Ff$ is iso then $f$ is iso)."
        back: "reflects isomorphisms"
        type: cloze

  - id: subcategories
    name: Subcategories
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: category-definition
        weight: 0.4
        key: true
      - id: full-faithful-functors
        weight: 0.4
        key: true
      - id: functors
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Subcategories and full subcategories
        key_prerequisites: [category-definition]
        constraints: "Verify closure under identities and composition explicitly; fullness judged by comparing hom-sets; instances drawn from $\\mathbf{Set}$ and its structured-set relatives."
        exemplars:
          - problem: "Let M be the monoid with elements e, a, where a * a = a and e is the identity. A subcategory of Set is judged full by comparing hom-sets, so a key step counts the structure-preserving self-maps of the underlying set {e, a}. Find the number of monoid homomorphisms M -> M."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: a monoid homomorphism must send the identity e to e, so it is determined by the image of a. Step 2: the image x of a must satisfy x * x = x, and both e and a are idempotent in M. Step 3: the two possible images give exactly two homomorphisms, a -> e and a -> a. Comparing with the 4 self-functions of the two-element underlying set shows the hom-set is proper, so the comparison of hom-sets decides fullness. The number of monoid homomorphisms M -> M is 2."
          - problem: "FinSet has all finite sets as objects and all functions between them as morphisms. To decide whether FinSet is a full subcategory of Set, compare Hom_FinSet(A, B) with Hom_Set(A, B) for sets A and B with 2 and 3 elements. Compute the number of functions from A to B."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Hom_Set(A, B) is the set of all functions from the 2-element set A to the 3-element set B. Step 2: each of the 2 elements of A has an independent image among the 3 elements of B, giving 3 * 3 = 9 functions. Step 3: FinSet keeps every Set-morphism between finite sets, so Hom_FinSet(A, B) = Hom_Set(A, B), and the hom-set comparison proves fullness. The number of functions from A to B is 9."
          - problem: "Let P be the poset with elements a, b, c and order a < b < c, viewed as a category that has exactly one morphism x -> y whenever x <= y, besides the identities. A proposed subcategory D keeps all three objects and, besides the identities, only the morphisms a -> b and b -> c. The identities are present, so only closure under composition can fail. How many non-identity morphisms must be added to D so that it is closed under composition?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the identities of a, b, c are in D, so the identity condition holds explicitly. Step 2: the composite of a -> b with b -> c must exist in D; in the poset P this composite is the unique morphism a -> c. Step 3: a -> c is not among the chosen morphisms, and it is the only missing composite, so exactly one morphism must be added. D must gain 1 non-identity morphism to be closed under composition."
          - problem: "Take the category with one object whose morphisms are the integers, where composition adds and the identity is 0. A proposed subcategory keeps the object and only the morphisms 0, 1, and -1. The identity is present, but composition may leave the chosen set. Find the smallest positive integer m such that the m-fold composite of 1 with itself is not one of the chosen morphisms."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: since composition adds, the m-fold composite of the morphism 1 with itself corresponds to the integer m. Step 2: for m = 1 the composite is 1, which is chosen; for m = 2 the composite is 2, which is not among 0, 1, -1, so closure under composition fails there. Step 3: no smaller positive m fails, so this is the smallest counterexample to closure. The smallest such m is 2."
          - problem: "Let C be the category coming from the order with objects a, b, c, d where a < b < d and a < c < d, and with one morphism x -> y exactly when x <= y. Its full subcategory on the objects a and d keeps every C-morphism between them. Compute how many morphisms this full subcategory has."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (hom-sets): for the full subcategory on a and d, list Hom on each ordered pair of chosen objects. Step 2 (count): Hom(a, a) has just the identity of a, Hom(a, d) has the single arrow a -> d, Hom(d, d) has just the identity of d, and Hom(d, a) is empty. Step 3 (closure): the identities are present, and composing the arrow a -> d with the identities stays inside the choice, so the choice is a subcategory. Step 4 (total): 1 + 1 + 1 + 0 = 3. The full subcategory has 3 morphisms."
          - problem: "Claim: for any subcategory D of a category C, the inclusion functor i: D -> C is faithful. A proof: Line 1: by definition of a subcategory, Hom_D(A, B) is a subset of Hom_C(A, B) for all objects A and B of D. Line 2: [missing]. Line 3: hence i is injective on each hom-set. Line 4: therefore i is faithful. Select the line that fills Line 2."
            answer: "i maps each morphism to itself, viewed as a morphism of C"
            answer_contract: {"kind": "label", "options": [["i maps each morphism to itself, viewed as a morphism of C"], ["i maps every morphism to an identity morphism"], ["i is full on every hom-set"], ["Hom_C(A, B) is a subset of Hom_D(A, B)"]]}
            solution_sketch: "Line 1 records the defining inclusion of hom-sets. The correct Line 2 says that i maps each morphism to itself viewed as a morphism of C, so i acts as the identity map on each hom-set, which is injective; this is what Line 3 uses. The option i maps every morphism to an identity morphism misdescribes the action of the inclusion. The option i is full on every hom-set confuses fullness with faithfulness. The option Hom_C(A, B) is a subset of Hom_D(A, B) reverses the defining inclusion and would suggest fullness instead. The answer is: i maps each morphism to itself, viewed as a morphism of C."
          - problem: "Write the full proof: the class of all groups, with group homomorphisms as morphisms, is a subcategory of Set. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects): send each group to its underlying set, so the chosen objects are objects of Set. Step 2 (morphisms): for groups G and H, take Hom(G, H) to be the set of group homomorphisms, which is a subset of Hom_Set(G, H), so every chosen morphism is a Set-morphism. Step 3 (identities): the identity function id_G satisfies id_G(xy) = id_G(x) id_G(y), so it is a group homomorphism, and every identity of a chosen object is present. Step 4 (composition): let f: G -> H and g: H -> K be group homomorphisms; then g(f(xy)) = g(f(x) f(y)) = g(f(x)) g(f(y)), so the composite g after f is again a group homomorphism, and the chosen morphisms are closed under composition. Step 5 (conclusion): the objects are Set-objects, the morphisms are subsets of the Set hom-sets, and identities and composites stay inside the choice, so the class of groups with group homomorphisms is a subcategory of Set. Moreover each hom-set is a subset on which the inclusion acts as the identity, so the inclusion is faithful."
      - id: kp2
        name: Full versus non-full examples
        key_prerequisites: [full-faithful-functors]
        constraints: "Fullness judgments among $\\mathbf{Ab}\\subseteq\\mathbf{Grp}$, $\\mathbf{Grp}\\subseteq\\mathbf{Mon}$, and morphism-restricted subcategories of $\\mathbf{Set}$; a 'full' verdict needs a preservation argument, a 'not full' verdict an omitted morphism."
        exemplars:
          - problem: "Regard Ab as a subcategory of Grp: its objects are the abelian groups and its morphisms are all group homomorphisms between them. A group homomorphism from Z3 to Z6 sends 1 to an element a of Z6 with 3a = 0. Give homs, the number of group homomorphisms from Z3 to Z6, and verdict, whether Ab is a full subcategory of Grp."
            answer: "homs = 3; verdict = full"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "homs"}, {"contract": {"kind": "label", "options": [["full"], ["nonfull"]]}, "name": "verdict"}]}
            solution_sketch: "The full object is the hom-set Hom_Grp(Z3, Z6), and the claim to judge is fullness of Ab in Grp. Step 1 (count homomorphisms): 3a = 0 in Z6 forces a in {0, 2, 4}, so the hom-set has 3 elements. Step 2 (fullness definition): a subcategory is full when each of its hom-sets equals the hom-set of the ambient category. Step 3 (preservation argument): Ab carries every group homomorphism between abelian groups, since abelianness is a property of the objects only, so Hom_Ab(Z3, Z6) = Hom_Grp(Z3, Z6) = 3 and no morphism is omitted; the option nonfull is the error of mistaking a smaller object class for smaller hom-sets. The answer is homs = 3; verdict = full."
          - problem: "Regard Grp as a subcategory of Mon: a monoid homomorphism preserves the identity and satisfies f(x + y) = f(x) + f(y). Write Z2 = {0, 1} and Z4 = {0, 1, 2, 3} with addition. Give homs, the number of monoid homomorphisms from Z2 to Z4, and verdict, whether Grp is a full subcategory of Mon."
            answer: "homs = 2; verdict = full"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "homs"}, {"contract": {"kind": "label", "options": [["full"], ["nonfull"]]}, "name": "verdict"}]}
            solution_sketch: "The full object is the hom-set Hom_Mon(Z2, Z4), and the claim to judge is fullness of Grp in Mon. Step 1 (count monoid homomorphisms): f(1) = a must satisfy f(1 + 1) = a + a = f(0) = 0 in Z4, so a in {0, 2}: two homomorphisms. Step 2 (preservation argument, written multiplicatively): for any monoid homomorphism f between groups, f(g) f(g^-1) = f(g g^-1) = f(e) = e and likewise f(g^-1) f(g) = e, so f(g^-1) is the inverse of f(g) and f preserves inverses. Step 3 (fullness definition): hence every monoid homomorphism between groups is a group homomorphism, Hom_Mon(G, H) = Hom_Grp(G, H), consistent with the count 2 for Z2 to Z4; the option nonfull is the error of thinking inverses can be lost. The answer is homs = 2; verdict = full."
          - problem: "Consider the subcategory of Set whose objects are all sets and whose morphisms are only the injective functions. How many morphisms does it have from the set {1, 2} to the set {1, 2, 3}?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the hom-set of the injective-functions subcategory from {1, 2} to {1, 2, 3}. Step 1 (count injections): the image of 1 has 3 choices and the image of 2 then has 2 choices, giving 3 x 2 = 6 morphisms. Step 2 (fullness test): Set has 9 functions between these sets, so the subcategory omits 3 non-injective maps, for example the constant map with value 1; the hom-sets differ, so the subcategory is not full. The answer is 6."
          - problem: "Let P be the category of the poset 1 < 2 < 3 < 4, which has one non-identity morphism from i to j for each pair i < j. Let S be the subcategory of P with the same objects and with non-identity morphisms only from 1 to 2 and from 3 to 4. How many morphisms of P are missing from S?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the pair of hom-sets of P and of S on the objects 1, 2, 3, 4. Step 1 (morphisms of P): each pair i < j gives one morphism, so P has 6 non-identity morphisms. Step 2 (closure of S): the two kept arrows cannot be composed with each other and all identities are present, so S is a subcategory. Step 3 (omitted morphisms): S keeps 2 non-identity morphisms, so 6 - 2 = 4 are missing, for example the morphism from 2 to 3; the hom-sets differ, so S is not full. The answer is 4."
          - problem: "In the subcategory of Set that keeps every set as an object but keeps only the bijective functions as morphisms, take the object {1, 2}. How many morphisms go from {1, 2} to itself in this subcategory?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the hom-set of the bijections-only subcategory from {1, 2} to itself. Step 1 (count bijections): a bijection of a two-element set is a permutation, the identity or the swap, so the hom-set has 2 morphisms. Step 2 (fullness test): Set has 4 functions from {1, 2} to itself, so the two constant maps are omitted morphisms and the subcategory is not full. The answer is 2."
          - problem: "A student argues that Grp is not a full subcategory of Mon. Step 1: the objects of Grp are the groups and the objects of Mon are the monoids. Step 2: a monoid homomorphism between two groups preserves the identity and the product. Step 3: such a homomorphism need not preserve inverses, so it need not be a group homomorphism. Step 4: hence the hom-sets differ and Grp is not full. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is true: every group is a monoid, so the objects of Grp are also objects of Mon. Step 2 is true: the product and the identity of a group are exactly the monoid structure it carries. Step 3 is the first invalid step: a monoid homomorphism between groups preserves the product and the identity, and then the image of an inverse is the two-sided inverse of the image, so inverses are preserved automatically; the claim that they need not be is the error. Step 4 inherits the error of Step 3, since the hom-sets agree and Grp is full in Mon. The answer is Step 3."
          - problem: "Write the full proof: Grp is a full subcategory of Mon, and the subcategory of Set with all sets as objects and only the surjective functions as morphisms is not full. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (fullness of Grp in Mon): let G and H be groups and f a monoid homomorphism, so f preserves the identity and the multiplication. Step 2 (preservation argument): for each g in G, f(g) f(g^-1) = f(g g^-1) = f(e) = e, and likewise f(g^-1) f(g) = e, so f(g^-1) is the two-sided inverse of f(g) in H and f preserves inverses. Step 3 (conclusion of Step 2): f is a group homomorphism, so Hom_Mon(G, H) = Hom_Grp(G, H) for all groups G and H, which is exactly the definition of a full subcategory. Step 4 (the Set subcategory): the surjective-functions subcategory has all sets as objects; identities are surjective and composites of surjections are surjective, so it is a subcategory. Step 5 (omitted morphism): the inclusion from {1, 2} to {1, 2, 3} is a function that is not surjective, so it lies in the hom-set of Set but not in the hom-set of the subcategory. Step 6 (verdict): since the hom-sets differ, the subcategory is not full. Hence Grp is a full subcategory of Mon and the surjective-functions subcategory of Set is not full."
      - id: kp3
        name: A full subcategory is determined by its objects
        key_prerequisites: [full-faithful-functors]
        constraints: "One direction is the fullness argument; the converse needs two explicit subcategories of $\\mathbf{Set}$ with the same objects but different hom-sets."
        exemplars:
          - problem: "Let C be the poset category with objects a, b, c, d and a unique arrow x to y whenever x = y or x < y holds in the order a < b < d and a < c < d. Let D be the full subcategory of C whose object set is {a, d}. Find the number of morphisms of D."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Fullness copies every hom-set of D wholesale from C, so D is determined by its object set {a, d}. In C the morphisms between a and d are id_a, the unique arrow a to d, and id_d; b and c contribute nothing since they are not objects of D. Hence D has exactly 3 morphisms. The answer is 3."
          - problem: "In Set, let F be the subcategory whose objects are all sets and whose morphisms are all functions, and let B be the subcategory with the same objects whose morphisms are only the bijections. Give the number of endomorphisms of X = {1, 2} in F and in B, naming the first value full and the second bijective."
            answer: "full = 4; bijective = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "full"}, {"contract": {"kind": "exact"}, "name": "bijective"}]}
            solution_sketch: "The full result is full = 4; bijective = 2. In F every function {1, 2} to {1, 2} is a morphism, and a function is a choice of image for each of the 2 elements, so there are 2^2 = 4 endomorphisms. In B only the bijections qualify, and the bijections of a 2-element set are its 2 permutations. The two subcategories share every object yet have different hom-sets, so objects alone do not determine a subcategory. The answer is full = 4; bijective = 2."
          - problem: "Let C be the diamond poset category with objects a, b, c, d, whose nonidentity arrows are exactly the order relations a < b, b < d, a < c, and c < d. Compute the number of full subcategories of C."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A full subcategory is fixed by its object set, because fullness forces each hom-set between chosen objects to be the hom-set of C. Conversely every set of objects of C spans a full subcategory. So full subcategories of C correspond exactly to subsets of the 4-object set {a, b, c, d}, and there are 2^4 = 16 of them. The answer is 16."
          - problem: "For a positive integer n, let F_n be the full subcategory of Set with the single object {1, 2, ..., n}, and let B_n be the subcategory of Set with the same object whose only morphisms are the bijections of that object. Determine the smallest n for which F_n and B_n have different numbers of morphisms."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Test the base case n = 1: a 1-element set has exactly 1 function to itself and 1 bijection, so F_1 and B_1 agree. For n = 2 there are 2^2 = 4 endomorphisms in F_2 but only 2 permutations in B_2, so the counts differ first here. The smallest such n is 2. The answer is 2."
          - problem: "A student claims that every subcategory of Set whose objects are all sets must be equal to Set. Step 1: let D be such a subcategory, so the objects of D are all sets. Step 2: for sets X and Y, the morphisms X to Y in Set are exactly the functions X to Y. Step 3: since D and Set have the same objects, they have the same morphisms. Step 4: therefore D = Set. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is a correct setup: a subcategory may well have all objects. Step 2 is the true description of the hom-sets of Set. Step 3 is the error: equal object classes do not force equal morphisms, as the bijections-only subcategory of Set shows, since it has the same objects but smaller hom-sets. Step 4 would follow if Step 3 held, but Step 3 fails. The answer is Step 3."
          - problem: "Let D and E be subcategories of a category C with Ob(D) = Ob(E), each satisfying one hypothesis H. Argument: Step 1: the objects of D and E agree. Step 2: for all objects X and Y of D, hom_D(X, Y) = hom_C(X, Y). Step 3: likewise hom_E(X, Y) = hom_C(X, Y). Step 4: hence D and E have the same objects and the same hom-sets, so D = E. Which hypothesis H does Step 2 use?"
            answer: "D is full"
            answer_contract: {"kind": "label", "options": [["D is full"], ["D is wide in C"], ["C has exactly one object"], ["D is a groupoid"]]}
            solution_sketch: "Step 2 claims hom_D(X, Y) equals hom_C(X, Y), and exactly this equality is supplied by the hypothesis that D is full, since a full subcategory copies each hom-set from C. The option wide in C is wrong: a wide subcategory contains all objects but may omit morphisms, so its hom-sets can be smaller than those of C. The option one object constrains C, not the hom-sets of D. The option groupoid restricts which morphisms D has but never forces equality with hom_C. The answer is D is full."
          - problem: "Write the full proof: two full subcategories of a category C with the same objects are equal, while a general subcategory is not determined by its objects, as two distinct subcategories of Set with the same objects show. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Direction one. Step 1 (objects): let D and E be full subcategories of C with the same objects. Step 2 (hom-sets): for objects X and Y common to D and E, fullness of D gives hom_D(X, Y) = hom_C(X, Y), and fullness of E gives hom_E(X, Y) = hom_C(X, Y). Step 3 (conclusion): hence hom_D(X, Y) = hom_E(X, Y) for all X, Y; together with the shared objects, identities and composition, this proves D = E. Direction two. Step 4 (two subcategories of Set): let F be Set itself and let B be the subcategory with all sets as objects and only the bijections as morphisms; identities are bijections and composites of bijections are bijections, so B is a subcategory. Step 5 (they differ): on X = {1, 2} the swap is a morphism of both, but the constant map is a morphism of F and not of B, so F and B are distinct subcategories with the same objects. Hence full subcategories are exactly the subcategories determined by their objects."
    diagnostic_exemplar:
      problem: "Is $\\mathbf{Grp}$ a full subcategory of $\\mathbf{Mon}$? Prove your answer."
      answer: "Yes. Every group is a monoid, and every monoid homomorphism $\\phi\\colon G\\to H$ between groups automatically preserves inverses: from $\\phi(g)\\phi(g^{-1})=\\phi(gg^{-1})=\\phi(e)=e$ and likewise $\\phi(g^{-1})\\phi(g)=e$, the element $\\phi(g^{-1})$ is a two-sided inverse of $\\phi(g)$, so $\\phi(g^{-1})=\\phi(g)^{-1}$ and $\\phi$ is a group homomorphism. Hence $\\mathrm{Hom}_{\\mathbf{Mon}}(G,H)=\\mathrm{Hom}_{\\mathbf{Grp}}(G,H)$ for all groups $G,H$: the subcategory is full."
      solution_sketch: "Fullness asks whether the two hom-sets coincide, so the real question is whether a monoid homomorphism between groups automatically preserves inverses. Show $\\phi(g^{-1})$ is a two-sided inverse of $\\phi(g)$ and invoke uniqueness of inverses."
    anki_seeds:
      - front: "Full subcategory definition?"
        back: "A subcategory containing all $\\mathcal C$-morphisms between its chosen objects; equivalently, determined by a class of objects."
        type: basic
      - front: "The inclusion of a subcategory is always {{c1::faithful}}."
        back: "faithful"
        type: cloze

  - id: product-categories
    name: Product Categories and Bifunctors
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: category-definition
        weight: 0.4
        key: true
      - id: functors
        weight: 0.4
        key: true
      - id: examples-of-categories
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The product category and its projections
        key_prerequisites: [category-definition]
        constraints: "Componentwise definitions with coordinatewise verification; the pairing functor's uniqueness must be forced by the two projection equations."
        exemplars:
          - problem: "Let C be the poset category with objects 0 < 1 and D the poset category with objects 0 < 1 < 2, with one morphism for each inequality. In the product category C × D, an object is a pair and a morphism is a pair of morphisms, one from C and one from D. How many morphisms does C × D have?"
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (morphisms of a poset category): the chain 0 < 1 has 3 morphisms (two identities and 0 ≤ 1), and the chain 0 < 1 < 2 has 6 morphisms. Step 2 (componentwise definition of the product category): a morphism of C × D is a pair of morphisms, one from C and one from D. Step 3 (count): 3 × 6 = 18. The product category C × D has 18 morphisms."
          - problem: "Let E be the poset category with objects 0 < 1, let C be the poset category with objects 0 < 1 < 2, and let D be the poset category with objects 0 < 1 < 2 < 3. Let F: E → C send 0 to 1 and 1 to 2, and let G: E → D send 0 to 1 and 1 to 3. The pairing functor ⟨F,G⟩: E → C × D sends an object X to (F(X), G(X)). Give the object ⟨F,G⟩(1) as (a,b)."
            answer: "(2,3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (pairing definition): ⟨F,G⟩ sends an object X of E to the pair (F(X), G(X)). Step 2 (evaluate the functors): F(1) = 2 and G(1) = 3. Step 3 (assemble the pair): ⟨F,G⟩(1) = (2,3). The answer is (2,3)."
          - problem: "Let f: {0,1} → {0,1,2} send 0 to 2 and 1 to 1, let f': {0,1,2} → {0,1} send 0 to 1, 1 to 1 and 2 to 0, and let g be the swap of {0,1} sending 0 to 1 and 1 to 0, with g' the identity of {0,1}. In the product category Set × Set, the composite (f',g') ∘ (f,g) is the pair (f' ∘ f, g' ∘ g). Give the image of (0,0) under this composite as (a,b)."
            answer: "(0,1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (componentwise composition): (f',g') ∘ (f,g) = (f' ∘ f, g' ∘ g) by the definition of composition in a product category. Step 2 (first coordinate): f(0) = 2 and f'(2) = 0, so the first coordinate at 0 is 0. Step 3 (second coordinate): g(0) = 1 and g'(1) = 1, so the second coordinate at 0 is 1. The image is (0,1), so the answer is (0,1)."
          - problem: "Let C and D each be the poset category with objects 0 < 1 < 2, one morphism for each inequality, and let 1 be the category with one object and one morphism. A functor K: 1 → C × D is the same as an object of C × D, and the equation π1 ∘ K = 2, where 2 is the functor picking the object 2 of C, fixes only the first coordinate of that object. How many functors K: 1 → C × D satisfy π1 ∘ K = 2?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (projection on objects): π1 sends an object (c,d) of C × D to c. Step 2 (solve the equation): π1(c,d) = 2 holds exactly for the objects (2,0), (2,1) and (2,2). Step 3 (uniqueness remark): the second projection equation π2 ∘ K = G then leaves exactly one of these three objects, which is how the two equations together force the pairing functor. The answer is 3."
          - problem: "A student argues that π2 ∘ ⟨F,G⟩ = F for functors F: E → C and G: E → D. Step 1: on objects, ⟨F,G⟩(X) = (FX, GX). Step 2: π2(FX, GX) = FX. Step 3: so on objects, (π2 ∘ ⟨F,G⟩)(X) = F(X). Step 4: the same argument on morphisms gives the identity π2 ∘ ⟨F,G⟩ = F. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the standard definition of ⟨F,G⟩ on objects, so it is valid. Step 2 is the error: π2 keeps the second coordinate, so π2(FX, GX) = GX, the value of G, not F. Step 3 would follow only if Step 2 were corrected to GX. Step 4 is the standard extension to morphisms and is valid given a corrected Step 3. The first invalid step is Step 2."
          - problem: "In a proof that the pairing functor ⟨F,G⟩ preserves composition, u: X → Y and v: Y → Z are morphisms of E and composition is written with *. The line ⟨F,G⟩(v*u) = ? is missing. Select the line that is true and that uses the functoriality of F and of G."
            answer: "(Fv*Fu, Gv*Gu)"
            answer_contract: {"kind": "label", "options": [["(Fv*Fu, Gv*Gu)"], ["(Fv*Gu, Gv*Fu)"], ["(Fv, Gv*Gu)"], ["(Fu*Fv, Gu*Gv)"]]}
            solution_sketch: "Step 1 (componentwise definition): ⟨F,G⟩ sends a morphism w to (F(w), G(w)). Step 2 (functoriality): F(v*u) = Fv*Fu and G(v*u) = Gv*Gu. Step 3 (assemble): ⟨F,G⟩(v*u) = (Fv*Fu, Gv*Gu). The wrong options are: (Fv*Gu, Gv*Fu) mixes the two coordinates of the functors, (Fv, Gv*Gu) drops the morphism u from the first coordinate, and (Fu*Fv, Gu*Gv) reverses the order of composition. The missing line is (Fv*Fu, Gv*Gu)."
          - problem: "Write the full proof: let C, D and E be categories and let F: E → C and G: E → D be functors. Prove that there is a unique functor ⟨F,G⟩: E → C × D with π1 ∘ ⟨F,G⟩ = F and π2 ∘ ⟨F,G⟩ = G. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (product category): the category C × D has objects (C,D), morphisms (f,g), componentwise composition (f',g') ∘ (f,g) = (f'∘f, g'∘g), and identities (1_C, 1_D); the axioms hold coordinatewise. Step 2 (existence, definition): define H on objects by X ↦ (FX, GX) and on morphisms by u ↦ (Fu, Gu). Step 3 (functoriality, coordinatewise): H(1_X) = (F1_X, G1_X) = (1_FX, 1_GX) = 1_(FX,GX), and H(v ∘ u) = (F(v∘u), G(v∘u)) = (Fv∘Fu, Gv∘Gu) = H(v) ∘ H(u), since F and G are functors; so H is a functor. Step 4 (projection equations): π1(H(X)) = FX and π1(H(u)) = Fu for every object X and morphism u, hence π1 ∘ H = F, and likewise π2 ∘ H = G. Step 5 (uniqueness from the two equations): let K be any functor with π1 ∘ K = F and π2 ∘ K = G. For each object X of E, the first coordinate of K(X) is π1(K(X)) = F(X) and the second is π2(K(X)) = G(X), so K(X) = (FX, GX) = H(X); for each morphism u, the coordinates of K(u) are Fu and Gu, so K(u) = (Fu, Gu) = H(u). Hence K = H as functors, so the pairing functor ⟨F,G⟩ with the two projection equations is unique."
      - id: kp2
        name: Functors out of a product are bifunctors
        key_prerequisites: [functors]
        constraints: "State the interchange law $F(f,g)=F(f,1)\\circ F(1,g)=F(1,g)\\circ F(f,1)$; the concrete instance is the cartesian product on $\\mathbf{Set}$, verified elementwise."
        exemplars:
          - problem: "State what it means for $F\\colon\\mathcal C\\times\\mathcal D\\to\\mathcal E$ to be a bifunctor and the interchange condition it satisfies."
            answer: "Separately functorial in each variable, with $F(f,g)=F(f,1)\\circ F(1,g)=F(1,g)\\circ F(f,1)$."
            solution_sketch: "Any morphism factors as $(f,g)=(f,1)\\circ(1,g)=(1,g)\\circ(f,1)$ in $\\mathcal C\\times\\mathcal D$. Applying $F$ gives $F(f,g)=F(f,1)\\circ F(1,g)=F(1,g)\\circ F(f,1)$: $F$ is functorial in each variable separately and the two partial actions commute (interchange). Conversely, separate functoriality plus interchange assembles a genuine functor on the product."
          - problem: "Verify that cartesian product $\\times\\colon\\mathbf{Set}\\times\\mathbf{Set}\\to\\mathbf{Set}$, $(X,Y)\\mapsto X\\times Y$ and $(f,g)\\mapsto f\\times g$, is a bifunctor."
            answer: "It preserves identities and composition componentwise, giving a functor on the product."
            solution_sketch: "On a morphism $(f,g)$ of $\\mathbf{Set}\\times\\mathbf{Set}$, $(f\\times g)(x,y)=(f(x),g(y))$. Then $1_X\\times 1_Y=1_{X\\times Y}$, and $(f'\\times g')\\circ(f\\times g)=(f'\\circ f)\\times(g'\\circ g)$ because composition acts in each coordinate. So $\\times$ preserves identities and composites of $\\mathbf{Set}\\times\\mathbf{Set}$ and is a functor out of the product, i.e. a bifunctor; interchange is the special case $f\\times g=(f\\times 1)\\circ(1\\times g)$."
    diagnostic_exemplar:
      problem: "Show that disjoint union $\\sqcup\\colon\\mathbf{Set}\\times\\mathbf{Set}\\to\\mathbf{Set}$, $(X,Y)\\mapsto X\\sqcup Y$ and $(f,g)\\mapsto f\\sqcup g$, is a functor on the product category, and verify the interchange identity $f\\sqcup g=(f\\sqcup 1_{Y'})\\circ(1_X\\sqcup g)=(1_{X'}\\sqcup g)\\circ(f\\sqcup 1_Y)$ for $f\\colon X\\to X'$ and $g\\colon Y\\to Y'$."
      answer: "Identities and composition in $\\mathbf{Set}\\times\\mathbf{Set}$ are componentwise. Identity law: $1_X\\sqcup 1_Y$ is the identity on each summand, so it equals $1_{X\\sqcup Y}$. Composition law: for $(f,g)\\colon(X,Y)\\to(X',Y')$ and $(f',g')\\colon(X',Y')\\to(X'',Y'')$, the map $(f'\\circ f)\\sqcup(g'\\circ g)$ applies $f'\\circ f$ on the left summand and $g'\\circ g$ on the right, which is exactly $(f'\\sqcup g')\\circ(f\\sqcup g)$. So $\\sqcup$ is a functor on the product category, i.e. a bifunctor. Interchange: in $\\mathbf{Set}\\times\\mathbf{Set}$ the componentwise factorisations $(f,g)=(f,1_{Y'})\\circ(1_X,g)=(1_{X'},g)\\circ(f,1_Y)$ hold, and applying the functor gives the stated identity. Elementwise, all three routes send a left-summand element $x$ to the left-summand element $f(x)$ and a right-summand element $y$ to the right-summand element $g(y)$."
      solution_sketch: "Composition and identities in a product category are componentwise, so both functor laws reduce to the fact that $\\sqcup$ acts on each summand separately. For interchange, factor $(f,g)$ in $\\mathbf{Set}\\times\\mathbf{Set}$ the two available ways and apply the functor; elementwise every route sends $x$ to $f(x)$ and $y$ to $g(y)$."
    anki_seeds:
      - front: "Composition in $\\mathcal C\\times\\mathcal D$?"
        back: "$(f',g')\\circ(f,g)=(f'\\circ f,\\ g'\\circ g)$, componentwise."
        type: basic
      - front: "A bifunctor is a functor whose domain is a {{c1::product category}}."
        back: "product category"
        type: cloze

  - id: hom-functors
    name: Hom-Functors
    core: true
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: functors
        weight: 0.5
        key: true
      - id: covariant-contravariant-functors
        weight: 0.4
        key: true
      - id: product-categories
        weight: 0.3
      - id: examples-of-categories
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The covariant hom-functor
        key_prerequisites: [functors]
        constraints: "Post-composition action $f_*=f\\circ(-)$; the law checks reduce to associativity and unit laws; concrete readings only in $\\mathbf{Set}$ with $A$ a singleton."
        exemplars:
          - problem: "Fix $A$ in a locally small category $\\mathcal C$. Show $\\mathrm{Hom}(A,-)\\colon\\mathcal C\\to\\mathbf{Set}$ is a functor."
            answer: "Post-composition $f_*=f\\circ(-)$; it preserves identities and composition."
            solution_sketch: "$\\mathrm{Hom}(A,-)$ sends $X$ to the set $\\mathrm{Hom}(A,X)$ and $f\\colon X\\to Y$ to $f_*\\colon\\mathrm{Hom}(A,X)\\to\\mathrm{Hom}(A,Y)$, $h\\mapsto f\\circ h$. Then $(1_X)_*(h)=h$ and $(g\\circ f)_*(h)=(g\\circ f)\\circ h=g\\circ(f\\circ h)=g_*(f_*(h))$ by associativity, so it is a covariant functor."
          - problem: "In $\\mathbf{Set}$, identify the covariant hom-functor $\\mathrm{Hom}(\\{*\\},-)$ and show it acts as the identity on functions under $\\mathrm{Hom}(\\{*\\},X)\\cong X$."
            answer: "$\\mathrm{Hom}(\\{*\\},X)\\cong X$ and $f_*$ corresponds to $f$."
            solution_sketch: "A function $\\{*\\}\\to X$ is determined by the image of $*$, giving a bijection $\\mathrm{Hom}(\\{*\\},X)\\cong X$, $h\\mapsto h(*)$. For $f\\colon X\\to Y$, $f_*(h)=f\\circ h$ satisfies $(f\\circ h)(*)=f(h(*))$, so under the bijection $f_*$ becomes $f$ itself. Thus post-composition makes $\\mathrm{Hom}(\\{*\\},-)$ behave as the identity functor on $\\mathbf{Set}$, confirming it is a covariant functor."
      - id: kp2
        name: The contravariant hom-functor
        key_prerequisites: [covariant-contravariant-functors]
        constraints: "Pre-composition action $f^*=(-)\\circ f$ with the reversed law derived, not asserted; the concrete reading is $\\mathrm{Hom}(-,\\{0,1\\})\\cong\\mathcal P$ via characteristic functions."
        exemplars:
          - problem: "Show $\\mathrm{Hom}(-,B)\\colon\\mathcal C^{op}\\to\\mathbf{Set}$ is a (contravariant) functor."
            answer: "Pre-composition $f^*=(-)\\circ f$ reverses arrows."
            solution_sketch: "$\\mathrm{Hom}(-,B)$ sends $X$ to $\\mathrm{Hom}(X,B)$ and $f\\colon X\\to Y$ to $f^*\\colon\\mathrm{Hom}(Y,B)\\to\\mathrm{Hom}(X,B)$, $h\\mapsto h\\circ f$. Then $(1_X)^*=\\mathrm{id}$ and $(g\\circ f)^*(h)=h\\circ(g\\circ f)=(h\\circ g)\\circ f=f^*(g^*(h))$, so $(g\\circ f)^*=f^*\\circ g^*$: contravariant."
          - problem: "In $\\mathbf{Set}$, show the contravariant hom-functor $\\mathrm{Hom}(-,\\{0,1\\})$ corresponds to the power-set functor: $\\mathrm{Hom}(X,\\{0,1\\})\\cong\\mathcal P(X)$ and $f^*$ becomes preimage."
            answer: "Characteristic functions give $\\mathrm{Hom}(X,\\{0,1\\})\\cong\\mathcal P(X)$; pre-composition $f^*$ is $S\\mapsto f^{-1}[S]$."
            solution_sketch: "Send $\\chi\\colon X\\to\\{0,1\\}$ to $\\chi^{-1}(1)\\subseteq X$; this is a bijection $\\mathrm{Hom}(X,\\{0,1\\})\\cong\\mathcal P(X)$. For $f\\colon X\\to Y$ and $\\chi\\colon Y\\to\\{0,1\\}$, $f^*(\\chi)=\\chi\\circ f$ has $(\\chi\\circ f)^{-1}(1)=f^{-1}[\\chi^{-1}(1)]$, so under the bijection $f^*$ is the preimage map $S\\mapsto f^{-1}[S]$. This reverses arrows, matching the contravariance of $\\mathrm{Hom}(-,B)$."
      - id: kp3
        name: The two-variable hom-bifunctor
        key_prerequisites: [product-categories]
        constraints: "The action is $h\\mapsto g\\circ h\\circ f$; state domain $\\mathcal C^{op}\\times\\mathcal C$ and the variance of each slot, and recover the one-variable hom-functors by fixing an argument."
        exemplars:
          - problem: "Describe the bifunctor $\\mathrm{Hom}(-,-)\\colon\\mathcal C^{op}\\times\\mathcal C\\to\\mathbf{Set}$ on a morphism $(f,g)$."
            answer: "$(f\\colon A'\\to A,\\ g\\colon B\\to B')\\mapsto\\big(h\\mapsto g\\circ h\\circ f\\big)$."
            solution_sketch: "On objects $(A,B)\\mapsto\\mathrm{Hom}(A,B)$. A morphism $(f,g)$ of $\\mathcal C^{op}\\times\\mathcal C$ has $f\\colon A'\\to A$ in $\\mathcal C$ and $g\\colon B\\to B'$; it acts by $h\\mapsto g\\circ h\\circ f\\colon A'\\to B'$. Identities act trivially, and interchange holds because pre- and post-composition commute by associativity, so this is a well-defined bifunctor (contravariant in the first slot, covariant in the second)."
          - problem: "Show that fixing one argument of $\\mathrm{Hom}(-,-)\\colon\\mathcal C^{op}\\times\\mathcal C\\to\\mathbf{Set}$ recovers the one-variable hom-functors, and state the variance in each slot."
            answer: "$\\mathrm{Hom}(A,-)$ is covariant, $\\mathrm{Hom}(-,B)$ contravariant: contravariant in slot 1, covariant in slot 2."
            solution_sketch: "Restricting to morphisms $(1_A,g)$ gives $\\mathrm{Hom}(A,-)$ acting by $g_*\\colon h\\mapsto g\\circ h$ (post-composition, covariant). Restricting to $(f,1_B)$ gives $\\mathrm{Hom}(-,B)$ acting by $f^*\\colon h\\mapsto h\\circ f$ (pre-composition, contravariant). Since the full action is $h\\mapsto g\\circ h\\circ f$, the bifunctor is contravariant in the first variable and covariant in the second, and these partial functors are exactly the two one-variable hom-functors."
    diagnostic_exemplar:
      problem: "For morphisms $f\\colon A'\\to A$ and $g\\colon B\\to B'$ of a locally small $\\mathcal C$, show that $h\\mapsto g\\circ h\\circ f$ defines a map $\\mathrm{Hom}(A,B)\\to\\mathrm{Hom}(A',B')$, and verify the composition law making $\\mathrm{Hom}(-,-)$ a functor $\\mathcal C^{op}\\times\\mathcal C\\to\\mathbf{Set}$."
      answer: "Typing: for $h\\colon A\\to B$, $g\\circ h\\circ f\\colon A'\\to B'$, as required. Identities: $(1_A,1_B)$ acts by $h\\mapsto 1_B\\circ h\\circ 1_A=h$. Composition: for $(f,g)\\colon(A,B)\\to(A',B')$ and $(f',g')\\colon(A',B')\\to(A'',B'')$ in $\\mathcal C^{op}\\times\\mathcal C$ (so $f\\colon A'\\to A$, $f'\\colon A''\\to A'$ in $\\mathcal C$), the composite acts by $h\\mapsto(g'\\circ g)\\circ h\\circ(f\\circ f')=g'\\circ\\big(g\\circ h\\circ f\\big)\\circ f'$, which is the action of $(f',g')$ after the action of $(f,g)$ — associativity makes the two agree. So $\\mathrm{Hom}(-,-)$ is a functor, contravariant in the first slot and covariant in the second."
      solution_sketch: "Type the assignment first, then observe that the composition law is pure associativity: one long string $g'\\circ g\\circ h\\circ f\\circ f'$ re-bracketed as the outer action applied after the inner one. Contravariance in the first slot is exactly what makes the pre-composed factors accumulate in the reversed order."
    anki_seeds:
      - front: "$\\mathrm{Hom}(A,-)$: variance and action on a morphism $f$?"
        back: "covariant; post-composition $f_*=f\\circ(-)$."
        type: basic
      - front: "$\\mathrm{Hom}(-,B)$: variance and action on a morphism $f$?"
        back: "contravariant; pre-composition $f^*=(-)\\circ f$."
        type: basic
      - front: "The two-variable hom-functor has domain..."
        back: "$\\mathcal C^{op}\\times\\mathcal C$ (contravariant in the source, covariant in the target)."
        type: basic

  - id: comma-categories
    name: Comma Categories
    core: false                # construction feeding only the terminal category-of-elements
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: slice-categories
        weight: 0.5
        key: true
      - id: functors
        weight: 0.5
        key: true
      - id: functor-composition-identity
        weight: 0.3
      - id: product-categories
        weight: 0.2
      - id: commutative-diagrams
        weight: 0.2
      - id: initial-terminal-objects
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The construction and its composition law
        key_prerequisites: [functors]
        constraints: "Always name the two functors and the common target category before writing an object."
        exemplars:
          - problem: "Given functors $F\\colon\\mathcal{A}\\to\\mathcal{C}$ and $G\\colon\\mathcal{B}\\to\\mathcal{C}$, define the comma category $(F\\downarrow G)$ and verify that composition is well defined."
            answer: "Objects $(A,B,h\\colon FA\\to GB)$; morphisms $(a,b)$ with $Gb\\circ h=h'\\circ Fa$; composition is componentwise."
            solution_sketch: "An object is a triple $(A,B,h)$ with $A$ in $\\mathcal{A}$, $B$ in $\\mathcal{B}$ and $h\\colon FA\\to GB$ in $\\mathcal{C}$. A morphism $(A,B,h)\\to(A',B',h')$ is a pair $a\\colon A\\to A'$, $b\\colon B\\to B'$ with $Gb\\circ h=h'\\circ Fa$. Given a further $(a',b')\\colon(A',B',h')\\to(A'',B'',h'')$, compute $h''\\circ F(a'\\circ a)=h''\\circ Fa'\\circ Fa=Gb'\\circ h'\\circ Fa=Gb'\\circ Gb\\circ h=G(b'\\circ b)\\circ h$, using functoriality of $F$ and $G$ and the two square conditions. So $(a',b')\\circ(a,b)=(a'\\circ a,b'\\circ b)$ is again a morphism; identities are $(1_A,1_B)$, and associativity and unit laws hold componentwise."
          - problem: "Describe the projection functors $(F\\downarrow G)\\to\\mathcal{A}$ and $(F\\downarrow G)\\to\\mathcal{B}$ and check they are functors."
            answer: "$(A,B,h)\\mapsto A$, $(a,b)\\mapsto a$, and likewise on the second coordinate."
            solution_sketch: "Define $\\pi_{\\mathcal{A}}(A,B,h)=A$ and $\\pi_{\\mathcal{A}}(a,b)=a$. Identities go to identities since $1_{(A,B,h)}=(1_A,1_B)$, and composition is componentwise, so $\\pi_{\\mathcal{A}}((a',b')\\circ(a,b))=a'\\circ a=\\pi_{\\mathcal{A}}(a',b')\\circ\\pi_{\\mathcal{A}}(a,b)$. Hence $\\pi_{\\mathcal{A}}$ is a functor, and symmetrically so is $\\pi_{\\mathcal{B}}$."
      - id: kp2
        name: Slices, coslices, and arrow categories as comma categories
        key_prerequisites: [slice-categories]
        constraints: "Identify the two functors explicitly, including which is a constant functor out of $\\mathbf{1}$."
        exemplars:
          - problem: "Realize the slice $\\mathcal{C}/C$ and the coslice $C/\\mathcal{C}$ as comma categories."
            answer: "$\\mathcal{C}/C=(1_{\\mathcal{C}}\\downarrow C)$ and $C/\\mathcal{C}=(C\\downarrow 1_{\\mathcal{C}})$, where $C$ denotes the functor $\\mathbf{1}\\to\\mathcal{C}$ picking $C$."
            solution_sketch: "Write $C$ also for the functor $\\mathbf{1}\\to\\mathcal{C}$ from the terminal category selecting the object $C$. An object of $(1_{\\mathcal{C}}\\downarrow C)$ is a triple $(X,*,h\\colon X\\to C)$, i.e. an arrow into $C$; a morphism is $(a,1_*)$ with $1_C\\circ h=h'\\circ a$, i.e. $h=h'\\circ a$ — exactly a morphism of the slice $\\mathcal{C}/C$. Dually, an object of $(C\\downarrow 1_{\\mathcal{C}})$ is an arrow $C\\to X$ and a morphism is $b$ with $b\\circ h=h'$, exactly the coslice $C/\\mathcal{C}$."
          - problem: "Show the arrow category $\\mathcal{C}^{\\to}$ is the comma category $(1_{\\mathcal{C}}\\downarrow 1_{\\mathcal{C}})$."
            answer: "Objects are arrows of $\\mathcal{C}$ and morphisms are commuting squares — the comma condition with $F=G=1_{\\mathcal{C}}$."
            solution_sketch: "Taking $F=G=1_{\\mathcal{C}}$, an object of $(1_{\\mathcal{C}}\\downarrow 1_{\\mathcal{C}})$ is a triple $(A,B,h\\colon A\\to B)$, i.e. an arrow of $\\mathcal{C}$. A morphism $(A,B,h)\\to(A',B',h')$ is a pair $(a,b)$ with $1(b)\\circ h=h'\\circ 1(a)$, i.e. $b\\circ h=h'\\circ a$: a commuting square. That is precisely the arrow category $\\mathcal{C}^{\\to}$."
      - id: kp3
        name: Universal arrows as initial objects of a comma category
        key_prerequisites: [initial-terminal-objects]
        constraints: "State the existence and uniqueness clauses separately and match them to initiality."
        exemplars:
          - problem: "For an object $C$ of $\\mathcal{C}$ and a functor $G\\colon\\mathcal{D}\\to\\mathcal{C}$, describe $(C\\downarrow G)$ and prove that an initial object of it is exactly a universal arrow from $C$ to $G$."
            answer: "Objects are pairs $(D,f\\colon C\\to GD)$; an initial $(D_0,f_0)$ means every $f$ factors as $Gd\\circ f_0$ for a unique $d$."
            solution_sketch: "Here $C$ denotes the functor $\\mathbf{1}\\to\\mathcal{C}$ at $C$, so an object of $(C\\downarrow G)$ is a pair $(D,f\\colon C\\to GD)$ and a morphism $(D,f)\\to(D',f')$ is $d\\colon D\\to D'$ with $Gd\\circ f=f'$. An object $(D_0,f_0)$ is initial iff for every $(D,f)$ there is exactly one $d\\colon D_0\\to D$ with $Gd\\circ f_0=f$ — the existence and uniqueness clauses of a universal arrow from $C$ to $G$. So universal arrows are exactly initial objects of $(C\\downarrow G)$, and are therefore unique up to a unique isomorphism."
          - problem: "Identify the initial object of $(X\\downarrow U)$ for the forgetful functor $U\\colon\\mathbf{Mon}\\to\\mathbf{Set}$ and a set $X$."
            answer: "$(X^*,\\eta_X)$, the free monoid on $X$ with the insertion of letters."
            solution_sketch: "An object of $(X\\downarrow U)$ is a monoid $M$ together with a function $f\\colon X\\to UM$. Take $D_0=X^*$, the monoid of finite words, and $\\eta_X\\colon X\\to U(X^*)$ sending a letter to the one-letter word. Given any $(M,f)$, a monoid homomorphism $\\bar f\\colon X^*\\to M$ with $U\\bar f\\circ\\eta_X=f$ must satisfy $\\bar f(x_1\\cdots x_n)=f(x_1)\\cdots f(x_n)$ and $\\bar f(\\varepsilon)=e$, so it exists and is unique. Hence $(X^*,\\eta_X)$ is initial: the free monoid is the universal arrow from $X$ to $U$."
    diagnostic_exemplar:
      problem: "In the comma category $(F\\downarrow G)$, a morphism $(A,B,h)\\to(A',B',h')$ is a pair $(a,b)$ with $Gb\\circ h=h'\\circ Fa$. Prove that the componentwise composite of two such morphisms is again a morphism of $(F\\downarrow G)$."
      answer: "Let $(a,b)\\colon(A,B,h)\\to(A',B',h')$ and $(a',b')\\colon(A',B',h')\\to(A'',B'',h'')$. Then $G(b'\\circ b)\\circ h=Gb'\\circ Gb\\circ h=Gb'\\circ h'\\circ Fa=h''\\circ Fa'\\circ Fa=h''\\circ F(a'\\circ a)$, using functoriality of $G$ and $F$ and the two given squares in turn. So $(a'\\circ a,\\,b'\\circ b)$ satisfies the comma square condition and is a morphism $(A,B,h)\\to(A'',B'',h'')$."
      solution_sketch: "The same paste-two-squares move as for the arrow category: expand $G(b'\\circ b)$ by functoriality of $G$, push it across the two comma squares in turn, and reassemble the right-hand side with functoriality of $F$."
