          - problem: "Construct the identity image in this contravariant assignment, checking every hom-set element. Let H=Hom(-,C) on Set, with A={0,...,2}, B={0,...,2}, C={0,...,1}. Let f:A->B have values [0, 1, 2]. Construct the induced map H(f) with its direction determined by typing. Enumerate Hom(B,C) and Hom(A,C) lexicographically from index 0. Give, for each function in Hom(B,C), the index of its image in Hom(A,C)."
