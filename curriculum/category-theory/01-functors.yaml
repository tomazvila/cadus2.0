    knowledge_points:
      - id: kp1
        name: The data and the typing discipline
        key_prerequisites: [category-definition]
        constraints: "Always write the domain and codomain of $Ff$ before checking any law."
        exemplars:
          - problem: "A functor F: C -> D between poset categories has objects 0, 1, 2 in C with 0 < 1 < 2, and F(0) = 2, F(1) = 4, F(2) = 5. For the morphism f: 0 -> 1, give the domain and codomain of Ff as (x, y)."
            answer: "(2, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: identify the source and target of f: A = 0 and B = 1. Step 2: apply the object part, giving F0 = 2 and F1 = 4. Step 3: the morphism part must have type Ff: F0 -> F1, so the domain and codomain are 2 and 4. The answer is (2, 4)."
          - problem: "A functor F: C -> D between poset categories has objects 0, 1, 2 in C with 0 < 1 < 2, and F(0) = 3, F(1) = 6, F(2) = 7. For f: 0 -> 1 and g: 1 -> 2, give the domain and codomain of F(g∘f) as (x, y)."
            answer: "(3, 7)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: the composite g∘f is a morphism 0 -> 2. Step 2: the object part gives F0 = 3 and F2 = 7. Step 3: the typing rule requires F(g∘f): F0 -> F2, and this also matches Fg∘Ff. The answer is (3, 7)."
          - problem: "A functor F: C -> Set assigns F(0) a set with 3 elements and F(1) a set with 7 elements. For the morphism f: 0 -> 1, give the number of elements in the domain of Ff."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the morphism f: 0 -> 1 has domain object 0. Step 2: the object part gives F0 a set with 3 elements. Step 3: the typing rule says Ff: F0 -> F1, so the domain of Ff is F0. The answer is 3."
          - problem: "An assignment F has F(0) = 1, F(1) = 2, and for f: 0 -> 1 it sets F(f) = 2 -> 1. Step 1: each object is assigned an object. Step 2: f: 0 -> 1 requires Ff: F0 -> F1. Step 3: F0 = 1 and F1 = 2, so F(f) = 2 -> 1 is allowed. Step 4: the object part is complete. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: the object part assigns objects. Step 2 is valid: the typing rule requires Ff: F0 -> F1. Step 3 is invalid because F0 = 1 and F1 = 2, so Ff must run 1 -> 2, not 2 -> 1; choosing Step 1 or Step 2 mistakes a valid line for a failure, and choosing Step 4 overlooks the earlier reversal. The answer is Step 3."
          - problem: "A functor F: C -> D between poset categories satisfies F(0) = 4, F(1) = 6, F(2) = 9. The morphisms f: 0 -> 1 and g: 1 -> 2 have composite g∘f: 0 -> 2. State the codomain object of F(g∘f)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the composite g∘f has domain 0 and codomain 2. Step 2: the typing rule forces F(g∘f): F0 -> F2, and the object part gives F0 = 4 and F2 = 9. Step 3: the codomain of F(g∘f) is the image of the codomain object 2. The answer is 9."
          - problem: "A proposed functor F on poset category C has F(0) = 1, F(1) = 3, F(2) = 4 and sends f: 0 -> 1 to 1 -> 3. Determine whether the typing of Ff is valid and give the codomain object of Ff."
            answer: "verdict = correct; cod = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["correct"], ["incorrect"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "cod"}]}
            solution_sketch: "Step 1: f: 0 -> 1 has F0 = 1 and F1 = 3. Step 2: the typing rule requires Ff: F0 -> F1, which is 1 -> 3. Step 3: the proposed F(f) = 1 -> 3 has that type, so the typing is correct. The answer is verdict = correct; cod = 3."
          - problem: "Write the full proof: For a functor F and morphisms f: A -> B, g: B -> C, the morphism F(g∘f) has domain FA and codomain FC, and F(g∘f) and Fg∘Ff have the same type. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (typing of f): f: A -> B, so the morphism part of F gives Ff: FA -> FB. Step 2 (typing of g): g: B -> C, so Fg: FB -> FC. Step 3 (composite): the codomain of Ff is FB and the domain of Fg is FB, so Fg∘Ff is defined and Fg∘Ff: FA -> FC. Step 4 (functor on composite): g∘f: A -> C, so F(g∘f): FA -> FC. Step 5 (comparison): F(g∘f) and Fg∘Ff both have domain FA and codomain FC, so they are the same type. The answer is F(g∘f): FA -> FC, matching Fg∘Ff: FA -> FC."
      - id: kp2
        name: The two laws and how to verify them
        key_prerequisites: [composition-associativity-identity]
        constraints: "Require the two laws and how to verify them. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "A category C has objects A,B,C and generators f:A->B,g:B->C, with h=g after f. A proposed Set-valued functor assigns F(f)=[1,0], F(g)=[2,0] on zero-based sets of sizes 2,2,3. Construct the forced values of F(h) and F(id_B), then verify the composition and identity equations. Give the two complete value lists consecutively."
            answer: "0, 2, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The functor laws determine the missing arrow images, including the full identity function rather than a selected evaluation. The resulting answer is 0, 2, 0, 1."
          - problem: "Construct the direct-image powerset functor on f:{0,1}->{0,1}, f=[1,0], including the image of the identity. Index subsets by bit masks 0,1,2,3. Give the induced map P(f) on all four masks, followed by P(id) on all four masks, and check the identity law."
            answer: "0, 2, 1, 3, 0, 1, 2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Constructing the arrow map from subset images determines P(f); the induced identity fixes each subset, as the functor law requires. The resulting answer is 0, 2, 1, 3, 0, 1, 2, 3."
          - problem: "For the direct-image power-set construction P, prove the composition law on an arbitrary S subset of A by auditing two inclusions. Write1or0 for each valid implication: y in P(gf)(S) implies some x in S satisfies g(f(x))=y; that witness implies y in P(g)(P(f)(S)); y in P(g)(P(f)(S)) implies a witness z in B with z in P(f)(S) and g(z)=y; such z must itself lie in S. Give the four bits."
            answer: "1, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Unpack direct-image membership into existential witnesses in both directions. The intermediate witness belongs to f[S], not necessarily to S; this distinction is essential to the functor composition law. The resulting answer is 1, 1, 1, 0."
          - problem: "Let U be the forgetful functor from Mon to Set. Take the monoid M = ({0,1,2}, + mod 3, 0). Use the identity law to compute U(1_M)(2)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: U(1_M) is the underlying function of the identity homomorphism on M. Step 1 (identity law): U(1_M) = 1_{UM}, so it fixes every element of the underlying set. Step 2: the element 2 is fixed, so U(1_M)(2) = 2. The answer is 2."
          - problem: "Let C be the category with objects A, B, C and arrows f: A -> B, g: B -> C, h = g∘f: A -> C, plus identities. Let F: C -> Set have F(A)={1,2}, F(B)={3,4}, F(C)={5,6}, F(f)(1)=3, F(f)(2)=4, F(g)(3)=5, F(g)(4)=6. Use the composition law to compute F(h)(1)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: F(h) must equal F(g∘f). Step 1 (composition law): F(g∘f) = F(g)∘F(f), so F(h)(1) = F(g)(F(f)(1)). Step 2: F(f)(1)=3 and F(g)(3)=5. Thus F(h)(1)=5. The answer is 5."
          - problem: "Let C be the category with objects A, B, C and arrows f: A -> B, g: B -> C, h = g∘f: A -> C, plus identities. Let F: C -> Set have F(A)={1,2}, F(B)={3,4}, F(C)={5,6}, F(f)(1)=3, F(f)(2)=4, F(g)(3)=5, F(g)(4)=6. Use the identity law to compute F(1_A)(1)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: F(1_A) is the image of the identity arrow on A. Step 1 (identity law): F(1_A) = 1_{F(A)}, so it fixes every element of F(A). Step 2: the element 1 is in F(A), so F(1_A)(1)=1. The answer is 1."
          - problem: "Write the full proof: the forgetful functor U from Mon to Set satisfies both functor laws. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Full object: U sends a monoid (M, ·, e) to its underlying set M and a monoid homomorphism to its underlying function. Identity law step: the underlying function of the identity homomorphism 1_M is the identity function on M, so U(1_M) = 1_{UM}; this verifies the identity law. Composition law step: for homomorphisms f: A -> B and g: B -> C, the underlying function of g∘f sends x to (g∘f)(x) = g(f(x)), which is exactly (Ug∘Uf)(x). Hence U(g∘f) = Ug∘Uf, because the underlying map of a composite homomorphism is the composite of the underlying maps. Both laws hold separately, so U is a functor."
      - id: kp3
        name: Recognizing assignments that are not functors
        key_prerequisites: [examples-of-categories, abelian-groups]
        constraints: "Require the learner to use recognizing assignments that are not functors. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Claim: the preimage assignment is a functor from Set to Set. Step 1: for a set A, set F(A) to be the power set of A. Step 2: for a function f from A to B, set F(f) to be the preimage map that sends a subset of B to its preimage in A. Step 3: since F(A) and F(B) are the relevant power sets, F(f) is a map from the power set of A to the power set of B. Step 4: F preserves every identity map and every composite. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the correct object part: each set goes to its power set. Step 2 is a correct description of the preimage map, which does send subsets of B to subsets of A. Step 3 is false: a functor from Set to Set must send a function from A to B to a map from the power set of A to the power set of B, but the preimage map runs the other way, from the power set of B to the power set of A. Step 4 is not reached, because the typing already fails. The answer is Step 3."
          - problem: "The center assignment sends each group to its center and each homomorphism to the same map limited to centers. Let phi be the homomorphism from Z/2 to S3 that takes the element 1 to the transposition (1 2). Give the count of elements of Z/2 whose image under phi does not lie in the center of S3."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the group Z/2 is abelian, so all of its elements are central; the two candidate elements are 0 and 1. Step 2: phi(0) is the identity, which lies in the center of every group. Step 3: phi(1) = (1 2), and this transposition does not belong to the center of S3, since (1 2) followed by (1 3) differs from (1 3) followed by (1 2). Step 4: exactly one element, namely 1, has an image outside the center of S3, so on this homomorphism the morphism part of the center assignment is not even a valid map into the target center. The answer is 1."
          - problem: "On the chain category 0<1<2, a proposed endofunctor has object values [2,1,0]. Find the lexicographically least source arrow x->y whose required image arrow F(x)->F(y) is absent. Give x,y,F(x),F(y)."
            answer: "0, 1, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A functor must supply an arrow of the required type for every source arrow. The displayed source arrow witnesses the typing obstruction. The resulting answer is 0, 1, 2, 1."
          - problem: "The one-object category B(Z/4) uses addition mod 4 for composition. A proposed functor has arrow map F(n)=n^2 mod 4. Construct the lexicographically least composable pair (a,b) witnessing failure of the composition law; give a,b,F(a+b),F(a)+F(b), all residues mod 4."
            answer: "1, 1, 0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two images of a composite must agree. Testing pairs yields a specific functor-law counterexample. The resulting answer is 1, 1, 0, 2."
          - problem: "The one-object category B(Z/3) uses addition mod 3. A proposed functor sends arrows by F=[1,2,0]. Audit its identity law and composition law separately. Give the two truth values (1/0), then the least arrow that the identity law forces F to fix."
            answer: "0, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The identity arrow is 0, and every composite must be preserved. Both laws fail for the shifted assignment. The resulting answer is 0, 0, 0."
          - problem: "View the elements of S3 as the morphisms of a one-object category, with composition as usual. An assignment on morphisms is defined by F(s) = s^(-1). Write s for the 3-cycle (1 2 3) and t for the transposition (2 3). State whether the assignment preserves composition on this pair, and give the value F(t)(F(s)(1))."
            answer: "verdict = breaks; value = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["breaks"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Step 1: the inverse assignment sends a composite to the reversed composite, so the inverse of t after s is the inverse of s after the inverse of t. Step 2: the composite of t after s is the transposition (1 3), and its inverse, also (1 3), sends 1 to 3. Step 3: on the other side, the inverse of s sends 1 to 3, and then the inverse of t, which is (2 3), sends 3 to 2. Step 4: the two values 3 and 2 differ, so the assignment breaks composition on this pair; the option holds would claim that the two values agree, which is the error. The answer is verdict = breaks; value = 2."
          - problem: "Write the full proof: the assignment sending each group to its center, and each homomorphism to its restriction, is not a functor from Grp to Grp. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (object part): the assignment sends a group G to its center, the subgroup of elements that commute with every element of G. Step 2 (morphism part): it would send a homomorphism phi from G to H to the restriction of phi to the center of G, landing in the center of H. Step 3 (requirement): this is well defined only if phi carries the center of G into the center of H for every homomorphism phi. Step 4 (counterexample): take G equal to Z/2, which is abelian, so its center is all of G, and take H equal to S3, whose center is trivial. Step 5: let phi send the generator of Z/2 to the transposition (1 2). Then the identity goes to the identity, which is central, but (1 2) goes to a permutation that does not commute with (1 3), so (1 2) is not in the center of S3. Step 6: the restriction is therefore not a well-defined morphism, and the center assignment is not a functor from Grp to Grp."
    diagnostic_exemplar:
      problem: "Define $F\\colon\\mathbf{Set}\\to\\mathbf{Set}$ by $F(A)=A\\times\\{0,1\\}$ and $F(f)=f\\times 1_{\\{0,1\\}}$. Give the domain and codomain of $F(f)$ for $f\\colon A\\to B$, and verify both functor laws."
      answer: "$F(f)\\colon A\\times\\{0,1\\}\\to B\\times\\{0,1\\}$, $(a,i)\\mapsto(f(a),i)$. Identity law: $F(1_A)(a,i)=(a,i)$, so $F(1_A)=1_{FA}$. Composition law: $F(g\\circ f)(a,i)=(g(f(a)),i)=F(g)(f(a),i)=F(g)(F(f)(a,i))$, so $F(g\\circ f)=Fg\\circ Ff$. Both laws hold, so $F$ is a functor."
      solution_sketch: "Type $F(f)$ first — it must run $A\\times\\{0,1\\}\\to B\\times\\{0,1\\}$ — then check both laws elementwise on a pair $(a,i)$. The tag $i$ is carried untouched, so each law collapses to the corresponding fact about $f$ alone."
    anki_seeds:
      - front: "On morphisms, a functor $F$ sends each $f\\colon A\\to B$ to..."
        back: "a morphism $Ff\\colon FA\\to FB$."
        type: basic
      - front: "How does a functor act on an identity: $F(1_A)=$?"
        back: "$F(1_A)=1_{FA}$."
        type: basic
      - front: "How does a functor act on a composite: $F(g\\circ f)=$?"
        back: "$F(g\\circ f)=Fg\\circ Ff$."
        type: basic

  - id: functors
    name: Functors
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: functor-definition-laws
        weight: 0.6
        key: true
      - id: category-definition
        weight: 0.4
        key: true
      - id: examples-of-categories
        weight: 0.3
      - id: poset-monoid-categories
        weight: 0.3
      - id: function-composition-inverse
        weight: 0.2
      - id: monoids
        weight: 0.2
      - id: homomorphisms-intro
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Functors between one-object categories
        key_prerequisites: [monoids]
        constraints: "Require functors between one-object categories. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Extend a generator assignment to a functor. The source and target are one-object categories with arrow monoids (Z/3,+,0) and (Z/6,+,0). A functor must send arrow 1 to 2. Construct its entire morphism map from the functor laws and verify that it respects the source relation. Give F(0),...,F(2)."
            answer: "0, 2, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Identity preservation fixes the image of 0; composition determines successive generator powers. The defining cyclic relation must also be preserved. The resulting answer is 0, 2, 4."
          - problem: "Determine every arrow image, checking the relation at the fourth power. The source and target are one-object categories with arrow monoids (Z/4,+,0) and (Z/4,+,0). A functor must send arrow 1 to 3. Construct its entire morphism map from the functor laws and verify that it respects the source relation. Give F(0),...,F(3)."
            answer: "0, 3, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Identity preservation fixes the image of 0; composition determines successive generator powers. The defining cyclic relation must also be preserved. The resulting answer is 0, 3, 2, 1."
          - problem: "Construct a functor between these one-object categories from minimal arrow data. The source and target are one-object categories with arrow monoids (Z/3,+,0) and (Z/3,+,0). A functor must send arrow 1 to 2. Construct its entire morphism map from the functor laws and verify that it respects the source relation. Give F(0),...,F(2)."
            answer: "0, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Identity preservation fixes the image of 0; composition determines successive generator powers. The defining cyclic relation must also be preserved. The resulting answer is 0, 2, 1."
          - problem: "Use identity and composition preservation to recover the complete morphism assignment. The source and target are one-object categories with arrow monoids (Z/4,+,0) and (Z/4,+,0). A functor must send arrow 1 to 2. Construct its entire morphism map from the functor laws and verify that it respects the source relation. Give F(0),...,F(3)."
            answer: "0, 2, 0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Identity preservation fixes the image of 0; composition determines successive generator powers. The defining cyclic relation must also be preserved. The resulting answer is 0, 2, 0, 2."
          - problem: "Claim: every function f from a monoid M to a monoid N with f(1) = 1 gives a functor B(M) -> B(N). Step 1: send the single object of B(M) to the single object of B(N). Step 2: on morphisms, apply the function f. Step 3: F preserves composition, because f(mn) = f(m)f(n) holds for every such function f. Step 4: F preserves identities, because f(1) = 1, so F is a functor. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: a one-object category has a single object, so its image is forced. Step 2 is valid: a functor gives a function on morphisms. Step 3 is invalid: preservation of composition is exactly the law f(mn) = f(m)f(n), and an arbitrary function with f(1) = 1 need not satisfy it, so it cannot be asserted for every such f; choosing Step 1, Step 2 or Step 4 is the error of overlooking this unproven claim. Step 4 is a correct identity argument, but it rests on the failed Step 3. The answer is Step 3."
          - problem: "Let B(M) and B(N) be the one-object categories of the additive group of integers modulo 3, and let f be the function with f(0) = 0, f(1) = 1 and f(2) = 0. Derive the identity and composition requirements from the one-object category structure. Does f give a functor B(M) -> B(N)? State the verdict and give the value of f(2) that the functor composition law requires."
            answer: "verdict = no; value = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Functor law: composition preservation unpacks to f(a + b) = f(a) + f(b) for all a and b in Z/3. Taking a = b = 1, the law requires f(2) = f(1) + f(1) = 1 + 1 = 2. The given function has f(2) = 0, so the composition law fails and f yields no functor. The verdict yes is the error of ignoring the mismatch between the required value 2 and the given value 0. The answer is verdict = no; value = 2."
          - problem: "Write the full proof: for groups G and H, a functor B(G) -> B(H) between the one-object categories is exactly a group homomorphism G -> H. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: the group G as a one-object category B(G) has a single object and one morphism for each element of G, with composition given by the product and the identity morphism given by the unit e. Step 2: a functor F: B(G) -> B(H) sends the single object of B(G) to the single object of B(H), so all of its data is the function f: G -> H on morphisms. Step 3: the functor identity law gives f(e) = e, and the functor composition law gives f(ab) = f(a)f(b) for all a and b in G; these are exactly the axioms of a group homomorphism. Step 4: conversely, a group homomorphism f: G -> H defines F on the object in the only possible way and on morphisms by f(a); the identity and composition laws hold by the homomorphism axioms, so F is a functor. Step 5: the two constructions undo each other, so functors B(G) -> B(H) are exactly group homomorphisms G -> H. See the solution."
      - id: kp2
        name: Functoriality of parametrized constructions
        key_prerequisites: [function-composition-inverse]
        constraints: "Require functoriality of parametrized constructions. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "For a fixed set A, construct the arrow action of P(X)=X x A. It must preserve the A-coordinate and make the first projection compatible with any f:X->Y. Then prove the composition law for arbitrary f:X->Y,g:Y->Z. Encode x=1,a=2,f(x)=3,g(x)=4,g(f(x))=5,f(g(x))=6. Give the coordinate codes for P(f)(x,a), followed by those for P(g)(P(f)(x,a)). Neither an arrow-action formula nor a particular input value is supplied."
            answer: "3, 2, 5, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two projection conditions force P(f)(x,a)=(f(x),a). Applying the constructed action to g yields(g(f(x)),a), which is also the action of gf; the same construction sends identities to identities. The resulting answer is 3, 2, 5, 2."
          - problem: "Construct the arrow part of the square functor F(X)=X x X from the requirement that both projections form commuting squares with f:X->Y. Take f=[2,0]:{0,1}->{0,1,2}. Give the full value list of F(f), encoding (u,v) in Y x Y as 3u+v and ordering X x X lexicographically."
            answer: "8, 6, 2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two projection equations force both coordinates of the induced map. Those equations also establish the functor laws by uniqueness. The resulting answer is 8, 6, 2, 0."
