          - problem: "Construct the action on arrows of H=Hom(A,-):Set->Set from the hom-functor definition. Take A={0,1},B={0,1},C={0,1,2}, and f:B->C with values[2,0]. Enumerate both hom-sets by lexicographic function value lists from0. Give the image index of each member of Hom(A,B)under H(f), in order, and append the index of H(id_B)([1,0])."
            answer: "8, 6, 2, 0, 2"
