          - problem: "Let C and D be small categories with only identity morphisms, where C has the objects 0, 1, 2 and D has the objects 0, 1, 2, 3, 4. Let F:C→D send 0 to 0, 1 to 1 and 2 to 2. How many functors G from D to C satisfy G(F(x)) = x for every object x of C?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: by the definition of composite functor, the equality G(F(x)) = x for every object x of C forces G(0) = 0, G(1) = 1 and G(2) = 2, since F fixes the objects of C. Step 2: with only identity morphisms, every function on objects is a functor, so G is free exactly on the objects 3 and 4 of D. Step 3: by the multiplication principle, each of G(3) and G(4) has 3 choices, giving 3 times 3 = 9 functors. No such G also satisfies F(G(y)) = y for every object y of D, because D has more objects than C; a two-sided inverse is the stronger requirement of an isomorphism of categories. Therefore the number of such functors G is 9."
