            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The inverse equations force a bijection on objects; unique hom-sets force the arrow action, and hence both functor laws and strict inverse equations. The resulting answer is 2, 0, 3, 1, 2, 0."
          - problem: "Write the full proof: small categories and functors form a category Cat, verifying associativity and unit laws for functor composition. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: the objects of Cat are small categories and the morphisms are functors; composition of functors is a functor by the definition of functor composition. Step 2: associativity. For functors F:C→D, G:D→E, H:E→B and any object A, ((H∘G)∘F)(A) = (H∘G)(F(A)) = H(G(F(A))) = H((G∘F)(A)) = (H∘(G∘F))(A). The same calculation with a morphism f gives ((H∘G)∘F)(f) = H(G(F(f))) = (H∘(G∘F))(f). Step 3: unit laws. The identity functor 1_D satisfies (1_D∘F)(A)=1_D(F(A))=F(A) and similarly on morphisms, so 1_D∘F=F. The equality F∘1_C=F is the same. Step 4: all category axioms therefore hold, so small categories and functors form the category Cat. In Cat, an isomorphism is a functor with a two-sided inverse functor, which is the on-the-nose notion of isomorphism of categories."
