            solution_sketch: "Maps into T precompose with f, whereas maps out of T postcompose with f; these operations determine opposite directions. An inverse image turns a subset of B into the subset of A whose f-images lie in it, so its direction also reverses. The resulting answer is 1, 0, 0, 1, 1, 0, 0, 1, 0."
          - problem: "The direct-image subset construction assigns each set X its powerset. Derive the direction and composition order of its arrow action on f=[1,0]:{0,1}->{0,1} and g=[0,0]:{0,1}->{0,1}. Encode subsets by bit masks. Give the image of masks 1,2,3 under the induced composite, followed by 1 for covariant or 0 for contravariant."
            answer: "1, 1, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
