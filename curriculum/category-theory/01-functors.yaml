      - id: kp1
        name: Functors between one-object categories
        key_prerequisites: [monoids]
        try_first:
          problem: 'A functor $F$ from $B(\mathbb{Z}/10)$ to itself sends the morphism $1$ to the morphism $3$. Composition in $B(\mathbb{Z}/10)$ is addition modulo $10$. What does $F$ send the morphism $4$ to?'
          answer_contract: {"kind": "exact"}
          answer: '2'
          reveal: 'The morphism $4$ is $1$ composed with itself four times, so $F(4)=4\cdot F(1)=12$, which is $2$ modulo $10$. In a one-object category the value on a generator decides the whole functor.'
        step_check:
          step: 'Writing $e_P$ and $e_Q$ for the monoid units, this reads $F(e_P) = e_Q$'
          question: 'Why must a functor $BP\to BQ$ send the unit $e_P$ to the unit $e_Q$?'
          options:
            - 'The identity law says a functor sends each identity morphism to an identity morphism'
            - 'The composition law already forces it, because $e_P e_P=e_P$ makes $F(e_P)$ the unit'
            - 'Any function between two monoids sends the unit of the first to the unit of the second'
          answer: 'The identity law says a functor sends each identity morphism to an identity morphism'
          why: 'In $BP$ the identity morphism of the single object is $e_P$, and the identity law requires its image to be the identity morphism $e_Q$ of $BQ$.'
        constraints: 'Functors between one-object categories whose arrows form a small cyclic group or monoid. Items compute images from the two laws, count the functors, or decide whether a given map is a functor. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'A functor $F\colon B(\mathbb{Z}/3)\to B(\mathbb{Z}/6)$ between one-object categories, in which composition is addition modulo the stated number, sends the morphism $1$ to the morphism $2$. What does $F$ send the morphism $2$ to?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The morphism $2$ is $1$ followed by $1$, so the composition law gives $F(2)=F(1)+F(1)=2+2=4$. This is a valid morphism of $B(\mathbb{Z}/6)$. So $F(2)=4$.'
          - problem: 'A functor $F\colon B(\mathbb{Z}/5)\to B(\mathbb{Z}/5)$, in which composition is addition modulo $5$, sends the morphism $1$ to the morphism $2$. What does $F$ send the morphism $4$ to?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The morphism $4$ is $1$ composed with itself $4$ times, so $F(4)=4\cdot F(1)=8$. Modulo $5$ this is $3$. So $F(4)=3$.'
          - problem: 'How many functors are there from $B(\mathbb{Z}/6)$ to $B(\mathbb{Z}/6)$, where composition in each category is addition modulo $6$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor is decided by the image $k$ of the morphism $1$, and it must satisfy $6k=0$ modulo $6$ so that the cycle closes up. This holds for every $k$ in $\{0,1,2,3,4,5\}$. So there are $6$ functors.'
          - problem: 'Let $f\colon\mathbb{Z}/3\to\mathbb{Z}/3$ be the function with $f(0)=0$, $f(1)=1$ and $f(2)=0$. Is $f$ the morphism part of a functor $B(\mathbb{Z}/3)\to B(\mathbb{Z}/3)$, where composition is addition modulo $3$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is a functor", "functor"], ["no", "it is not", "false", "not a functor", "not"]]}
            solution_sketch: 'The composition law needs $f(1+1)=f(1)+f(1)$, so $f(2)$ must equal $1+1=2$. The function has $f(2)=0$, so the composition law fails. Hence $f$ is not a functor.'
          - problem: 'A 12-hour clock records the hours advanced as an element of $\mathbb{Z}/12$, and composition is addition modulo $12$. A gear train gives a functor $F\colon B(\mathbb{Z}/12)\to B(\mathbb{Z}/12)$ in which advancing the input dial by $1$ hour advances the output dial by $5$ hours. By how many hours, as a clock reading, does the output dial advance when the input dial advances by $7$ hours?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Advancing by $7$ hours is advancing by $1$ hour seven times, so the output advances $7\cdot 5=35$ hours. On a 12-hour clock $35=24+11$, so the reading is $11$.'
          - problem: 'A functor $F\colon B(\mathbb{Z}/4)\to B(\mathbb{Z}/6)$ is decided by the image of the morphism $1$. Sam says that $F(1)$ can be any of the $6$ morphisms of $B(\mathbb{Z}/6)$, so there are $6$ functors. What is the correct number of functors?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Going around the cycle in $B(\mathbb{Z}/4)$ four times gives the identity, so $4\cdot F(1)$ must be $0$ modulo $6$. This holds only for $F(1)=0$ and $F(1)=3$. So there are $2$ functors, not $6$.'
          - problem: 'A drum machine repeats its pattern every $6$ beats, so its beats form $\mathbb{Z}/6$. A light cycle repeats every $9$ steps, so its steps form $\mathbb{Z}/9$. A translation from beats to steps is a functor $B(\mathbb{Z}/6)\to B(\mathbb{Z}/9)$, so that $n$ beats followed by $m$ beats match $n+m$ beats. How many translations are there?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A translation is decided by the number of steps $k$ for one beat, and $6$ beats must give back the start, so $6k$ must be $0$ modulo $9$. This holds for $k=0$, $3$ and $6$. So there are $3$ translations.'
          - problem: 'A functor $B(\mathbb{Z}/2)\to B(S_3)$ sends the morphism $1$ of $\mathbb{Z}/2$ to a permutation $p$ of the set $\{1,2,3\}$. How many functors are there, where composition in $B(S_3)$ is composition of permutations?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composition law forces $F(1)\circ F(1)=F(1+1)=F(0)$, which is the identity. So $p$ must satisfy $p\circ p=\mathrm{id}$. The identity and the three transpositions do this, and the $3$-cycles do not, so there are $4$ functors.'
          - problem: 'Let $g\colon\mathbb{Z}/4\to\mathbb{Z}/4$ be the function $g(n)=3n$ modulo $4$. Is $g$ the morphism part of a functor $B(\mathbb{Z}/4)\to B(\mathbb{Z}/4)$, where composition is addition modulo $4$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "not"]]}
            solution_sketch: 'The identity law holds because $g(0)=0$. The composition law needs $g(a+b)=g(a)+g(b)$, and $3(a+b)=3a+3b$ modulo $4$ for all $a,b$. So both laws hold and $g$ gives a functor.'
          - problem: 'Write the full proof that, for groups $G$ and $H$, a functor $B(G)\to B(H)$ between the one-object categories is the same thing as a group homomorphism $G\to H$.'
            answer: 'Functors B(G)->B(H) are homomorphisms'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Each category has one object, so a functor $F$ is decided by its function $f\colon G\to H$ on morphisms. The identity law gives $f(e)=e$, and the composition law gives $f(ab)=f(a)f(b)$ for all $a,b$ in $G$. These are exactly the axioms of a group homomorphism. Conversely, a homomorphism $f$ defines $F$ on the single object in the only possible way and on morphisms by $f$, and the two laws hold by the homomorphism axioms. The two constructions undo each other, so functors and homomorphisms correspond.'
      - id: kp2
        name: Functoriality of parametrized constructions
        key_prerequisites: [function-composition-inverse]
        step_check:
          step: 'Since this holds for every element, $A\times 1_X=1_{A\times X}$'
          question: 'Why does checking an arbitrary pair $(a,x)$ prove that $A\times 1_X$ equals $1_{A\times X}$?'
          options:
            - 'A product of two identities is an identity, by the definition of the product of sets'
            - 'The pair $(a,x)$ is fixed by $1_X$, and a function with one fixed point is the identity'
            - 'Two functions on the same set are equal when they give the same value at every element'
          answer: 'Two functions on the same set are equal when they give the same value at every element'
          why: 'Because $(a,x)$ was arbitrary, $A\times 1_X$ and $1_{A\times X}$ agree at every element of $A\times X$, so they are the same function.'
        constraints: 'Constructions are given by an explicit rule on objects and on functions between small finite sets. Items compute with the arrow part, count, or decide whether a proposed rule is a functor. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'Fix $A=\{0,1\}$ and let $F(X)=A\times X$ and $F(f)(a,x)=(a,f(x))$ for a function $f\colon X\to Y$. Let $f\colon\{1,2,3\}\to\{4,5\}$ have $f(1)=4$, $f(2)=5$, $f(3)=4$, and let $g\colon\{4,5\}\to\{6,7\}$ have $g(4)=7$, $g(5)=6$. What is $F(g\circ f)(1,3)$?'
            answer: '(1, 7)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The rule keeps the first coordinate and applies the function to the second. Here $(g\circ f)(3)=g(f(3))=g(4)=7$. So $F(g\circ f)(1,3)=(1,7)$, which also equals $F(g)(F(f)(1,3))=F(g)(1,4)=(1,7)$.'
          - problem: 'On $\mathbf{Set}$, let $F(X)=X\times X$ and $F(f)(x,y)=(f(x),f(y))$. Let $f\colon\{1,2,3\}\to\{a,b\}$ have $f(1)=a$, $f(2)=a$, $f(3)=b$. How many elements of $\{a,b\}\times\{a,b\}$ have the form $F(f)(x,y)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The function $f$ takes both values $a$ and $b$. So $F(f)$ reaches every pair of values: $(a,a)$ from $(1,1)$, $(a,b)$ from $(1,3)$, $(b,a)$ from $(3,1)$ and $(b,b)$ from $(3,3)$. All $4$ pairs are reached.'
          - problem: 'For a function $f\colon X\to Y$ let $F(X)=\mathcal{P}(X)$, the set of subsets of $X$, and let $F(f)(S)=Y\setminus f(S)$, the complement in $Y$ of the image of $S$. Is $F$ a functor $\mathbf{Set}\to\mathbf{Set}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is a functor", "functor"], ["no", "it is not", "false", "not a functor", "not"]]}
            solution_sketch: 'For $X=\{1,2\}$ and $S=\{1\}$, we get $F(1_X)(S)=X\setminus S=\{2\}$, not $S$. So the identity law fails and $F$ is not a functor.'
          - problem: 'A school keeps a table of every pair (club, room) for $3$ clubs and the rooms $101$, $102$, $103$. The rooms are renumbered by $f$, with $f(101)=201$, $f(102)=201$ and $f(103)=202$, and each pair $(c,r)$ becomes $(c,f(r))$. How many different pairs are in the new table?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The renumbering uses the rule $F(f)(c,r)=(c,f(r))$ of the functor $\mathrm{Clubs}\times(-)$. The new rooms are only $201$ and $202$, since $101$ and $102$ merge. So the new table has $3\cdot 2=6$ pairs.'
          - problem: 'A tournament table has one row for every pair (team, round). The table has $45$ rows and the tournament has $9$ rounds. How many teams play?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rows are the elements of $\text{Teams}\times\text{Rounds}$, which has $\lvert\text{Teams}\rvert\cdot 9$ elements. So $\lvert\text{Teams}\rvert\cdot 9=45$. Dividing gives $45/9=5$ teams.'
          - problem: 'On $\mathbf{Set}$, let $F(X)=X\times X$ and $F(f)(x,y)=(f(x),f(y))$. Take $f(1)=3$, $f(2)=4$, $g(3)=5$, $g(4)=6$. Sam checks composition with the formula $F(g\circ f)(x,y)=(g(f(x)),f(y))$ and gets $(5,4)$ at $(1,2)$. What is the correct value of $F(g\circ f)(1,2)$?'
            answer: '(5, 6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The function $F(g\circ f)$ applies $g\circ f$ to both coordinates. The second coordinate is $(g\circ f)(2)=g(4)=6$, not $f(2)=4$. So the correct value is $(5,6)$.'
          - problem: 'Let $f\colon\{1,2,3,4\}\to\{a,b\}$ have $f(1)=a$, $f(2)=a$, $f(3)=b$, $f(4)=b$, and let $\mathcal{P}(f)$ send a subset $S$ to its image $f(S)$. How many of the $16$ subsets of $\{1,2,3,4\}$ are sent to the whole set $\{a,b\}$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A subset is sent onto $\{a,b\}$ exactly when it has at least one of $1,2$ and at least one of $3,4$. There are $3$ non-empty choices from $\{1,2\}$ and $3$ from $\{3,4\}$. So there are $3\cdot 3=9$ such subsets.'
          - problem: 'For a set $X$ let $F(X)$ be $X$ together with one new element $*$, and for a function $f\colon X\to Y$ let $F(f)$ send each $x$ to $f(x)$ and send $*$ to $*$. Is $F$ a functor $\mathbf{Set}\to\mathbf{Set}$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "not"]]}
            solution_sketch: 'The function $F(1_X)$ sends each $x$ to $x$ and $*$ to $*$, so it is the identity of $F(X)$. The functions $F(g\circ f)$ and $F(g)\circ F(f)$ both send $x$ to $g(f(x))$ and $*$ to $*$. So both laws hold and $F$ is a functor.'
          - problem: 'Write the full proof that, for a fixed set $A$, sending $X$ to $X\times A$ and a function $f\colon X\to Y$ to $(x,a)\mapsto(f(x),a)$ is an endofunctor of $\mathbf{Set}$.'
            answer: 'X -> X x A is an endofunctor of Set'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Define $F(X)=X\times A$ and $F(f)(x,a)=(f(x),a)$, which is a function from $X\times A$ to $Y\times A$. Identity law: $F(1_X)(x,a)=(1_X(x),a)=(x,a)$ for every element, so $F(1_X)$ is the identity on $X\times A$. Composition law: for $f\colon X\to Y$ and $g\colon Y\to Z$, $F(g\circ f)(x,a)=(g(f(x)),a)$ and $(F(g)\circ F(f))(x,a)=F(g)(f(x),a)=(g(f(x)),a)$. The two functions agree at every element, so $F$ is an endofunctor of $\mathbf{Set}$.'
      - id: kp3
        name: Functors preserve isomorphisms and commuting diagrams
        key_prerequisites: [functor-definition-laws]
        step_check:
          step: 'By the composition law $F(g\circ f)=Fg\circ Ff$, and by the identity law $F(1_A)=1_{FA}$'
          question: 'Why does applying $F$ to the equation $g\circ f=1_A$ give $Fg\circ Ff=1_{FA}$?'
          options:
            - '$F$ is injective on morphisms, so the two sides of the equation stay equal'
            - '$F$ turns a composite into a composite of images and an identity into an identity'
            - '$F$ sends the inverse $g$ of $f$ to the inverse of $Ff$ by the definition of a functor'
          answer: '$F$ turns a composite into a composite of images and an identity into an identity'
          why: 'The composition law rewrites $F(g\circ f)$ as $Fg\circ Ff$, and the identity law rewrites $F(1_A)$ as $1_{FA}$; no injectivity is used.'
        constraints: 'Isomorphisms and commuting diagrams are given fully in text with explicit images on small categories, one-object categories and sets. Items compute what the two laws force, count functors, or decide a verdict with the deciding fact. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'In $B(\mathbb{Z}/7)$ composition is addition modulo $7$, so the morphism $4$ is the inverse of the morphism $3$. A functor $F\colon B(\mathbb{Z}/7)\to B(\mathbb{Z}/7)$ sends $3$ to $2$. What does $F$ send $4$ to?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor sends an isomorphism to an isomorphism, and it sends the inverse to the inverse. The inverse of $2$ in $B(\mathbb{Z}/7)$ is $5$, because $2+5=7=0$. So $F(4)=5$.'
          - problem: 'A category has objects $A$, $B$, $C$, $D$, morphisms $f\colon A\to B$, $g\colon B\to D$, $h\colon A\to C$, $k\colon C\to D$ and the identities, and $k\circ h=g\circ f$. A functor $F$ sends every object to the single object of $B(\mathbb{Z}/7)$, where composition is addition modulo $7$, with $F(f)=5$, $F(g)=6$, $F(h)=2$. Sam writes $F(k)=6+5+2=13=6$. What is the correct value of $F(k)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Applying $F$ to $k\circ h=g\circ f$ gives $F(k)+F(h)=F(g)+F(f)$ modulo $7$. So $F(k)+2=6+5=11=4$ modulo $7$. Subtracting, $F(k)=4-2=2$, not $13$.'
          - problem: 'A category has objects $0$, $1$, $2$, morphisms $f\colon 0\to 1$, $g\colon 1\to 2$, $h\colon 0\to 2$ and the identities, and $h=g\circ f$. A functor $F$ to $\mathbf{Set}$ has $F(0)=\{1,2,3\}$, $F(1)=\{4,5\}$, $F(2)=\{6\}$. The function $F(f)$ sends $1$ to $4$, $2$ to $5$, $3$ to $4$, and $F(g)$ sends $4$ to $6$ and $5$ to $6$. What is $F(h)(3)$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equation $h=g\circ f$ gives $F(h)=F(g)\circ F(f)$, so the commuting triangle goes to a commuting triangle. $F(f)$ sends $3$ to $4$, and $F(g)$ sends $4$ to $6$. So $F(h)(3)=6$.'
          - problem: 'Let $\Delta$ be the constant functor from the poset category $0<1$ to $\mathbf{Set}$ with value $\{7\}$. It sends the morphism $0\to 1$ to the identity of $\{7\}$, which is an isomorphism. Is the morphism $0\to 1$ an isomorphism in the poset category $0<1$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is a functor", "functor"], ["no", "it is not", "false", "not a functor", "not"]]}
            solution_sketch: 'An isomorphism $0\to 1$ would need a morphism $1\to 0$ going back, and the poset $0<1$ has none. So $0\to 1$ is not an isomorphism, although $\Delta$ sends it to one. A functor preserves isomorphisms but need not reflect them.'
          - problem: 'A functor $F$ to $\mathbf{Set}$ sends an isomorphism $f\colon A\to B$ and its inverse $g\colon B\to A$ to functions. Here $F(A)=\{1,2,3,4,5\}$, $F(B)=\{2,4,6,8,10\}$ and $F(f)(n)=2n$. What is $F(g)(8)$?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because $g\circ f=1_A$ and $f\circ g=1_B$, the functor laws make $F(g)$ the inverse function of $F(f)$. The function $F(f)$ doubles, so its inverse halves. So $F(g)(8)=4$.'
          - problem: 'A category has objects $A$, $B$, $C$, $D$, morphisms $f\colon A\to B$, $g\colon B\to D$, $h\colon A\to C$, $k\colon C\to D$ and the identities, and the square commutes: $k\circ h=g\circ f$. How many functors are there from this category to $B(\mathbb{Z}/3)$, where composition is addition modulo $3$?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor chooses $F(f)$, $F(g)$, $F(h)$, $F(k)$ in $\mathbb{Z}/3$ with $F(k)+F(h)=F(g)+F(f)$. The first three can be chosen freely in $3^3=27$ ways, and then $F(k)$ is forced. So there are $27$ functors.'
          - problem: 'A price change is a factor by which a price is multiplied, and a functor $F$ assigns to each price change its factor. The change $f$ raises a price by $25$ percent, so $F(f)=1.25$, and $g$ is the change that undoes $f$, so $g\circ f$ is the identity change. What is $F(g)$?'
            answer: '0.8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity law gives $F(g)\cdot F(f)=F(g\circ f)=1$. So $F(g)=1/1.25=0.8$. A functor sends the inverse of $f$ to the inverse of $F(f)$.'
          - problem: 'A price change $f$ has factor $F(f)=1.2$ and a price change $g$ has factor $F(g)=0.75$. A shop applies $f$ first and then $g$. What is $F(g\circ f)$?'
            answer: '0.9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'By the composition law, $F(g\circ f)=F(g)\cdot F(f)=0.75\cdot 1.2$. This equals $0.9$, so the two changes together lower a price by $10$ percent.'
          - problem: 'A category has objects $A$ and $B$ and morphisms $f\colon A\to B$ and $g\colon B\to A$ with $g\circ f=1_A$ and $f\circ g=1_B$. A functor $F$ to $\mathbf{Set}$ sends $A$ to a set $FA$ and $B$ to a set $FB$. Must the function $F(f)$ be injective?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "not"]]}
            solution_sketch: 'Applying $F$ to $g\circ f=1_A$ gives $Fg\circ Ff=1_{FA}$ by the two laws. A function that has a left inverse is injective. So $F(f)$ is injective, for every such functor.'
          - problem: 'Write the full proof that every functor $F$ sends an isomorphism $f$ to an isomorphism with inverse $F(f^{-1})$, and sends commuting diagrams to commuting diagrams.'
            answer: 'F preserves isos and commuting diagrams'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $g$ be the inverse of $f\colon A\to B$, so $g\circ f=1_A$ and $f\circ g=1_B$. Applying $F$ and using both laws gives $Fg\circ Ff=F(g\circ f)=F(1_A)=1_{FA}$, and likewise $Ff\circ Fg=1_{FB}$. So $Fg$ is a two-sided inverse of $Ff$, and no injectivity of $F$ is used. A diagram commutes when composites are equal, and for each equation $h=g\circ f$ the composition law gives $Fh=Fg\circ Ff$. So the image diagram commutes.'
    diagnostic_exemplar:
      problem: "Prove that every functor $F$ carries isomorphisms to isomorphisms, and that $(Ff)^{-1}=F(f^{-1})$."
      answer: "Let $f\\colon A\\to B$ have inverse $f^{-1}$. Applying $F$ to $f^{-1}\\circ f=1_A$ and using both functor laws: $F(f^{-1})\\circ Ff=F(f^{-1}\\circ f)=F(1_A)=1_{FA}$. Symmetrically, applying $F$ to $f\\circ f^{-1}=1_B$ gives $Ff\\circ F(f^{-1})=1_{FB}$. So $F(f^{-1})$ is a two-sided inverse of $Ff$; hence $Ff$ is an isomorphism and, inverses being unique, $(Ff)^{-1}=F(f^{-1})$."
      solution_sketch: "Apply $F$ to the two equations defining $f^{-1}$ and push $F$ through each composite with the composition law; $F(1)=1$ turns both into identities, exhibiting $F(f^{-1})$ as a two-sided inverse of $Ff$. Uniqueness of inverses then gives the naming claim."
    anki_seeds:
      - front: "A functor between one-object categories $BM\\to BN$ is exactly a {{c1::monoid homomorphism}}."
        back: "monoid homomorphism"
        type: cloze
      - front: "If $f$ is an isomorphism and $F$ a functor, what is $(Ff)^{-1}$?"
        back: "$F(f^{-1})$; functors preserve isomorphisms."
        type: basic
      - front: "Does a functor send commuting diagrams to commuting diagrams?"
        back: "Yes — $F$ turns every composite into the composite of the images, so equations of composites are preserved."
        type: basic

  - id: functor-composition-identity
