    knowledge_points:
      - id: kp1
        name: The covariant hom-functor
        key_prerequisites: [functors]
        constraints: "Post-composition action $f_*=f\\circ(-)$; the law checks reduce to associativity and unit laws; concrete readings only in $\\mathbf{Set}$ with $A$ a singleton."
        exemplars:
          - problem: "Work in Set with A = {9}. Let X = {2, 5} and Y = {3, 7, 11}. Take h: A -> X with h(9) = 5, and take f: X -> Y with f(2) = 7 and f(5) = 3. The covariant hom-functor Hom(A,-) sends f to the post-composition map f_*: Hom(A,X) -> Hom(A,Y). Find the value of f_*(h) at 9."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Post-composition action: by definition of the covariant hom-functor, f_* acts by f_*(h) = f o h. Compute the composite: (f o h)(9) = f(h(9)) = f(5) = 3. So the value of f_*(h) at 9 is 3."
          - problem: "Work in Set. Let A = {0} and let X = {4, 8, 15, 16, 23, 42}. The covariant hom-functor Hom(A,-) sends the object X to the set Hom(A,X) of all functions from A to X. How many elements does this set Hom(A,X) have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A function from the singleton A = {0} to X is completely determined by the image of 0, which gives a bijection Hom(A,X) with X itself. Count the elements: X = {4, 8, 15, 16, 23, 42} has six elements, so Hom(A,X) has six elements. The answer is 6."
          - problem: "View divisibility on the set {1, 2, 3, 4, 6, 12} as a category: there is exactly one arrow a -> b when a divides b, and no arrow otherwise. Fix A = 2 and apply the covariant hom-functor Hom(A,-). How many objects X of this category give a nonempty set Hom(A,X)?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In this poset category, Hom(A,X) is nonempty exactly when the arrow A -> X exists, that is, when 2 divides X. Test each object with A = 2: 2 divides 2, 4, 6 and 12, but it does not divide 1 or 3. So four objects give a nonempty hom-set, and the answer is 4."
          - problem: "In the poset category on {1, 2, 4, 8} ordered by divisibility, let h be the unique arrow 1 -> 4 and let f be the unique arrow 4 -> 8. The hom-functor Hom(1,-) sends f to the post-composition map f_* on hom-sets. Give the codomain object of the arrow f_*(h)."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Post-composition action: the functor Hom(1,-) sends f to f_* with f_*(h) = f o h. Here h is the arrow 1 -> 4 and f is the arrow 4 -> 8, so f o h is the arrow 1 -> 8, which exists because 1 divides 8. The codomain object of the arrow f_*(h) is 8."
          - problem: "Claim: for a fixed object A of a locally small category, Hom(A,-) is a covariant functor to Set. Step 1: on objects, Hom(A,-) sends each object X to the set Hom(A,X). Step 2: on arrows, it sends f: X -> Y to the post-composition map f_* given by f_*(h) = f o h. Step 3: identity law, (1_X)_*(h) = 1_X o h = h for every h in Hom(A,X). Step 4: composition law, (g o f)_*(h) = f_*(g_*(h)). Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 states the correct object part of the functor. Step 2 states the correct post-composition arrow part. Step 3 is valid: it uses the unit law 1_X o h = h of the category. Step 4 is not valid: associativity gives (g o f)_*(h) = (g o f) o h = g o (f o h) = g_*(f_*(h)), so the written order f_*(g_*(h)) reverses the composite. The answer is Step 4."
          - problem: "Work in Set with A = {0}. Let X = {1, 2}, Y = {3, 4} and Z = {5, 6, 7}. Take h: A -> X with h(0) = 1, f: X -> Y with f(1) = 4 and f(2) = 3, and g: Y -> Z with g(3) = 7 and g(4) = 5. Using the composition law of the covariant hom-functor, find the value of g_*(f_*(h)) at 0."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The composition law of the covariant hom-functor says g_* o f_* = (g o f)_*, which follows from associativity of composition. First apply the post-composition action for f: f_*(h)(0) = f(h(0)) = f(1) = 4. Then apply the action for g: g_*(f_*(h))(0) = g(4) = 5. The value of g_*(f_*(h)) at 0 is 5."
          - problem: "Write the full proof: fix an object A of a locally small category C and show that Hom(A,-) : C -> Set, with arrow action given by post-composition f_*(h) = f o h, is a covariant functor. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Definition: for each object X set Hom(A,-)(X) = Hom(A,X), a set since C is locally small; for each arrow f: X -> Y define f_*: Hom(A,X) -> Hom(A,Y) by f_*(h) = f o h, the post-composition action. Identity law: for every h in Hom(A,X), (1_X)_*(h) = 1_X o h = h by the unit law of C, so Hom(A,-)(1_X) = 1_{Hom(A,X)}. Composition law: for f: X -> Y and g: Y -> Z, (g o f)_*(h) = (g o f) o h = g o (f o h) = g_*(f_*(h)) by associativity in C, so Hom(A,-)(g o f) = g_* o f_*. Conclusion: both functor laws hold, the object part lands in Set, so Hom(A,-) is a covariant functor from C to Set."
      - id: kp2
        name: The contravariant hom-functor
        key_prerequisites: [covariant-contravariant-functors]
        constraints: "Pre-composition action $f^*=(-)\\circ f$ with the reversed law derived, not asserted; the concrete reading is $\\mathrm{Hom}(-,\\{0,1\\})\\cong\\mathcal P$ via characteristic functions."
        exemplars:
          - problem: "In $\\mathbf{Set}$, let $f:\\{1,2\\}\\to\\{1,2,3\\}$ send $1\\mapsto 2$ and $2\\mapsto 3$; let $g:\\{1,2,3\\}\\to\\{1,2\\}$ send $1\\mapsto 1$, $2\\mapsto 2$, $3\\mapsto 1$; let $h:\\{1,2\\}\\to\\{0,1\\}$ send $1\\mapsto 1$ and $2\\mapsto 0$. The contravariant hom-functor acts by pre-composition, $f^*(u)=u\\circ f$. Compute the values of $(g\\circ f)^*(h)$ at $x=1$ and $x=2$, in that order."
            answer: "0, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object: $(g\\circ f)^*(h) = h\\circ(g\\circ f)$, the function $\\{1,2\\}\\to\\{0,1\\}$ sending $x\\mapsto h(g(f(x)))$. Step 1 (pre-composition): apply the definition with $g\\circ f$ in place of $f$. Step 2 (evaluate at $x=1$): $f(1)=2$, then $g(2)=2$, then $h(2)=0$. Step 3 (evaluate at $x=2$): $f(2)=3$, then $g(3)=1$, then $h(1)=1$. Note the reversed law is derived, not asserted: $h\\circ(g\\circ f)=(h\\circ g)\\circ f=f^*(g^*(h))$, so $(g\\circ f)^*=f^*\\circ g^*$. The answer is 0, 1."
          - problem: "In $\\mathbf{Set}$, let $X=\\{1,2,3,4\\}$ and $Y=\\{a,b\\}$, and let $f:X\\to Y$ send $1\\mapsto a$, $2\\mapsto b$, $3\\mapsto a$, $4\\mapsto b$. The characteristic function $\\chi:Y\\to\\{0,1\\}$ with $\\chi(a)=1$ and $\\chi(b)=0$ corresponds to the subset $\\{a\\}$ of $Y$. Under the bijection $\\mathrm{Hom}(X,\\{0,1\\})\\cong\\mathcal P(X)$, the function $f^*(\\chi)=\\chi\\circ f$ corresponds to a subset of $X$. Give the elements of that subset in increasing order."
            answer: "1, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object: $f^*(\\chi)=\\chi\\circ f$ is the function $X\\to\\{0,1\\}$ with $x\\mapsto\\chi(f(x))$, and under the bijection it corresponds to the set of points sent to $1$. Step 1 (pre-composition): $f^*(\\chi)(x)=\\chi(f(x))$. Step 2 (evaluate): $f(1)=a$ gives $\\chi(a)=1$; $f(2)=b$ gives $0$; $f(3)=a$ gives $1$; $f(4)=b$ gives $0$. Step 3 (read the subset): the support is $\\{1,3\\}$, which is exactly the preimage $f^{-1}[\\{a\\}]$. The answer is 1, 3."
          - problem: "Regard a poset as a category: there is one morphism from $x$ to $y$ exactly when $x\\le y$, and no other morphisms. Take the poset with elements $a,b,c,d$ and relations $a\\le b\\le d$ and $a\\le c\\le d$, plus the reflexive pairs. The contravariant hom-functor $\\mathrm{Hom}(-,d)$ assigns to each object its set of morphisms into $d$. How many of the four sets $\\mathrm{Hom}(b,c)$, $\\mathrm{Hom}(a,d)$, $\\mathrm{Hom}(d,a)$, $\\mathrm{Hom}(b,d)$ are empty?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object: the four hom-sets are read from the order relation, closed under transitivity. Step 1 (read the order): $b\\le c$ never holds, so $\\mathrm{Hom}(b,c)$ is empty. Step 2 (transitivity): $a\\le b\\le d$ gives $a\\le d$, so $\\mathrm{Hom}(a,d)$ has one morphism and is not empty. Step 3 (reverse direction): $d\\le a$ fails, so $\\mathrm{Hom}(d,a)$ is empty. Step 4: $b\\le d$ holds, so $\\mathrm{Hom}(b,d)$ has one morphism. Two of the four sets are empty. The answer is 2."
          - problem: "A student checks that $\\mathrm{Hom}(-,B)$ is a contravariant functor. Step 1: on objects, send $X$ to the set $\\mathrm{Hom}(X,B)$. Step 2: on a morphism $f:X\\to Y$, define $f^*:\\mathrm{Hom}(Y,B)\\to\\mathrm{Hom}(X,B)$ by $f^*(h)=f\\circ h$. Step 3: check $(1_X)^*(h)=h\\circ 1_X=h$, so $(1_X)^*$ is the identity. Step 4: for $f:X\\to Y$ and $g:Y\\to Z$, compute $(g\\circ f)^*(h)=h\\circ(g\\circ f)=(h\\circ g)\\circ f=f^*(g^*(h))$. Step 5: conclude $(g\\circ f)^*=f^*\\circ g^*$, the reversed law. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: it correctly gives the object part of the functor. Step 2 is not valid: with $h:Y\\to B$ and $f:X\\to Y$, the composite $f\\circ h$ is not defined because the codomain of $h$ is $B$, not $X$; the action must be $f^*(h)=h\\circ f$. Step 3 is a correct identity check once the action is fixed. Step 4 correctly derives the reversed law from associativity of composition. Step 5 correctly states the conclusion, so it is not the first failure. The first step that is not valid is Step 2."
          - problem: "In $\\mathbf{Set}$, let $X=\\{1,2,3,4,5\\}$ and $Y=\\{a,b\\}$, and let $f:X\\to Y$ send $1,2,3$ to $a$ and $4,5$ to $b$. Via characteristic functions, $\\mathrm{Hom}(-,\\{0,1\\})$ matches the power-set construction, and $f^*$ sends a subset $S$ of $Y$ to its preimage under $f$, a subset of $X$. How many subsets $S$ of $Y$ satisfy $f^*[S]=X$?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object: $f^*[S]$ is the preimage $\\{x\\in X: f(x)\\in S\\}$, and it equals $X$ exactly when every element of $X$ maps into $S$. Step 1 (use the values of $f$): $1$ maps to $a$, so $a$ must lie in $S$. Step 2: $4$ maps to $b$, so $b$ must lie in $S$. Step 3 (count): the only subset of $Y$ containing both $a$ and $b$ is $Y$ itself, so exactly one subset works. The answer is 1."
          - problem: "In $\\mathbf{Set}$, let $X=\\{1,2,3\\}$, $Y=\\{a,b,c\\}$, $Z=\\{p,q\\}$; let $f:X\\to Y$ send $1\\mapsto a$, $2\\mapsto b$, $3\\mapsto b$, and let $g:Y\\to Z$ send $a\\mapsto p$, $b\\mapsto q$, $c\\mapsto q$. Under the correspondence $\\mathrm{Hom}(-,\\{0,1\\})\\cong\\mathcal P$, the action of $f^*$ and $g^*$ on subsets is preimage, and the subset $S=\\{q\\}$ of $Z$ gives $(g\\circ f)^*[S]$ as a subset of $X$. Give the elements of $(g\\circ f)^*[S]$ in increasing order."
            answer: "2, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The full object: $(g\\circ f)^*[S]$ is the preimage of $S$ under $g\\circ f$, a subset of $X$. Step 1 (reversed law, derived): for any $h$ after $g\\circ f$, pre-composition satisfies $(g\\circ f)^*=f^*\\circ g^*$, so $(g\\circ f)^*[S]=f^*[g^*[S]]$. Step 2 (apply $g^*$): $g^*[\\{q\\}]=\\{y\\in Y: g(y)=q\\}=\\{b,c\\}$. Step 3 (apply $f^*$): $f^*[\\{b,c\\}]=\\{x\\in X: f(x)\\in\\{b,c\\}\\}=\\{2,3\\}$. The answer is 2, 3."
          - problem: "Write the full proof: for a locally small category $\\mathcal C$ and a fixed object $B$, the assignment $X\\mapsto\\mathrm{Hom}(X,B)$ on objects and $f\\mapsto f^*$ with $f^*(h)=h\\circ f$ on morphisms $f:X\\to Y$ defines a contravariant functor $\\mathrm{Hom}(-,B)\\colon\\mathcal C^{op}\\to\\mathbf{Set}$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (object part): since $\\mathcal C$ is locally small, $\\mathrm{Hom}(X,B)$ is a set for every object $X$. Step 2 (action on arrows): for $f:X\\to Y$, define $f^*:\\mathrm{Hom}(Y,B)\\to\\mathrm{Hom}(X,B)$ by $f^*(h)=h\\circ f$; this is well defined because $h:Y\\to B$ and $f:X\\to Y$ give $h\\circ f:X\\to B$. Step 3 (identity law): $(1_X)^*(h)=h\\circ 1_X=h$ for every $h$, so $(1_X)^*$ is the identity on $\\mathrm{Hom}(X,B)$. Step 4 (composition law, derived not asserted): for $f:X\\to Y$, $g:Y\\to Z$ and $h\\in\\mathrm{Hom}(Z,B)$, associativity gives $((g\\circ f)^*)(h)=h\\circ(g\\circ f)=(h\\circ g)\\circ f=f^*(h\\circ g)=f^*(g^*(h))=(f^*\\circ g^*)(h)$, hence $(g\\circ f)^*=f^*\\circ g^*$, the reversed law. Step 5 (conclusion): the assignment preserves identities and reverses composition, so $\\mathrm{Hom}(-,B)\\colon\\mathcal C^{op}\\to\\mathbf{Set}$ is a functor, contravariant on $\\mathcal C$."
      - id: kp3
        name: The two-variable hom-bifunctor
        key_prerequisites: [product-categories]
        constraints: "The action is $h\\mapsto g\\circ h\\circ f$; state domain $\\mathcal C^{op}\\times\\mathcal C$ and the variance of each slot, and recover the one-variable hom-functors by fixing an argument."
        exemplars:
          - problem: "Work in the category of sets. Take A' = {1,2}, A = {1,2,3}, B = {1,2} and B' = {1,2,3}. Let f: A' → A be given by f(1) = 2 and f(2) = 3; let h: A → B be given by h(1) = 1, h(2) = 2 and h(3) = 1; let g: B → B' be given by g(1) = 2 and g(2) = 3. The hom-bifunctor with domain C^op × C sends the morphism (f, g) from (A, B) to (A', B') to the map sending each function h to g ∘ h ∘ f. Give the values of g ∘ h ∘ f at 1 and at 2, in that order."
            answer: "3, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Rule of the hom-bifunctor: the morphism (f, g) acts by h ↦ g ∘ h ∘ f, a function from Hom(A, B) to Hom(A', B'). Compose at 1: f(1) = 2, then h(2) = 2, then g(2) = 3. Compose at 2: f(2) = 3, then h(3) = 1, then g(1) = 2. The composite takes 1 to 3 and 2 to 2, so the ordered values are 3, 2."
          - problem: "Work in the category of sets. Fixing the first slot of the hom-bifunctor at A = {1,2} gives the one-variable hom-functor Hom(A, -), which takes a function g: B → B' to the post-composition map h ↦ g ∘ h. Take B = {1,2}, B' = {1,2,3}, g(1) = 1, g(2) = 3, and h: A → B with h(1) = 2 and h(2) = 1. Give the values of g ∘ h at 1 and at 2, in that order."
            answer: "3, 1"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Rule for the fixed first slot: Hom(A, -) acts by post-composition, so the full object is the function g ∘ h from A to B'. Evaluate at 1: h(1) = 2, then g(2) = 3. Evaluate at 2: h(2) = 1, then g(1) = 1. The composite takes 1 to 3 and 2 to 1, so the ordered values are 3, 1."
          - problem: "Work in the category of sets. Fix the second slot of the hom-bifunctor at B = {1,2,3}; the one-variable hom-functor Hom(-, B) sends a function f: A' → A to the pre-composition map h ↦ h ∘ f from Hom(A, B) to Hom(A', B). Take A = {1,2,3}, A' = {1} and f(1) = 2, so Hom(A, B) has 27 functions. How many of these 27 functions does the map send to the function from A' to B that takes 1 to 3?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule for the fixed second slot: Hom(-, B) acts by pre-composition, the map h ↦ h ∘ f from Hom(A, B) to Hom(A', B). The target function takes 1 to 3, and (h ∘ f)(1) = h(f(1)) = h(2), so the condition is h(2) = 3. Counting rule: the values h(1) and h(3) are then free, with 3 choices each, so 3 x 3 = 9 functions work. The number of functions sent to that target is 9."
          - problem: "Work in the category of sets. Let A = {1,2}, B = {1,2}, A' = {1} and B' = {1,2,3}. The hom-bifunctor Hom has domain C^op × C, is contravariant in its first entry and covariant in its second, and acts by h ↦ g ∘ h ∘ f. How many morphisms are there in C^op × C from the pair (A, B) to the pair (A', B')?"
            answer: "18"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule of the domain: a morphism of C^op × C from (A, B) to (A', B') is a pair (f, g) with f: A' → A and g: B → B', the first entry being reversed. Count the first components: A' = {1} and A = {1,2}, so f(1) has 2 choices. Count the second components: each of the 2 elements of B has 3 possible images in B', so there are 3 x 3 = 9 choices for g. Multiply: 2 x 9 = 18, so there are 18 such morphisms."
          - problem: "Claim: for a locally small category C, the assignment (A, B) ↦ Hom(A, B) with action h ↦ g ∘ h ∘ f is a functor C^op × C → Set. Step 1: a morphism from (A, B) to (A', B') in C^op × C is a pair of morphisms of C of the form f: A' → A and g: B → B'. Step 2: for h in Hom(A, B), the composite g ∘ h ∘ f lies in Hom(A', B'), so the pair acts by the function h ↦ g ∘ h ∘ f. Step 3: the identity of (A, B) is (1_A, 1_B), and it acts by h ↦ 1_B ∘ h ∘ 1_A = h. Step 4: if (f, g) is followed by (f', g') with f': A'' → A' and g': B' → B'', then the two actions in order send h to g' ∘ g ∘ h ∘ f ∘ f'. Step 5: the composite of (f, g) and (f', g') in C^op × C is (f' ∘ f, g ∘ g'), whose action is the same map, so the composition law holds. Which step is the first step that is not valid?"
            answer: "Step 5"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: a morphism of C^op × C from (A, B) to (A', B') is indeed a pair f: A' → A and g: B → B' of morphisms of C, since the first factor is opposite. Step 2 is valid: g ∘ h ∘ f has source A' and target B', so it lies in Hom(A', B'). Step 3 is valid: 1_B ∘ h ∘ 1_A = h, so identities are preserved. Step 4 is valid: by associativity, g' ∘ (g ∘ h ∘ f) ∘ f' = g' ∘ g ∘ h ∘ f ∘ f'. Step 5 is the first invalid step: the composite in C^op × C is (f ∘ f', g' ∘ g), because the first components compose as morphisms A'' → A' → A in C; the pair (f' ∘ f, g ∘ g') is not composable at all. The answer is Step 5."
          - problem: "Work in the category of sets. Holding the second entry of the hom-bifunctor fixed at B = {1,2} gives the one-variable hom-functor Hom(-, B), which takes each function f: A' → A to the map h ↦ h ∘ f from Hom(A, B) to Hom(A', B). Take A = {1,2,3}, A' = {1,2}, f(1) = 3 and f(2) = 3. Determine whether this hom-functor runs in the same direction as f or in the opposite direction, and give the number of functions h from A to B that the map sends to the function taking both 1 and 2 to 2."
            answer: "variance = contravariant; count = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["covariant"], ["contravariant"]]}, "name": "variance"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Rule for the fixed entry: Hom(-, B) takes f: A' → A to the map h ↦ h ∘ f from Hom(A, B) to Hom(A', B); f points from A' to A while the map goes from the hom-set of A to that of A', so the direction is opposite, which is the contravariant case. Counting rule: the target function takes both 1 and 2 to 2, and (h ∘ f)(1) = (h ∘ f)(2) = h(3), so the condition is h(3) = 2. The values h(1) and h(2) are then free, with 2 choices each, so 2 x 2 = 4 functions work. The answer is variance = contravariant; count = 4."
          - problem: "Write the full proof: for a locally small category C, the assignment sending each pair of objects (A, B) to the set Hom(A, B) and each morphism (f, g) to the function h ↦ g ∘ h ∘ f is a functor C^op × C → Set. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects): send each pair (A, B) of C^op × C to the set Hom(A, B); this is a set because C is locally small. Step 2 (action on morphisms): a morphism (A, B) → (A', B') of C^op × C is a pair f: A' → A and g: B → B' of morphisms of C; send it to the function Hom(A, B) → Hom(A', B') given by h ↦ g ∘ h ∘ f, and g ∘ h ∘ f has source A' and target B', so the function is well defined. Step 3 (identities): the identity of (A, B) is (1_A, 1_B), and it acts by h ↦ 1_B ∘ h ∘ 1_A = h, the identity function. Step 4 (composition): for (f, g): (A, B) → (A', B') followed by (f', g'): (A', B') → (A'', B''), the composite in C^op × C is (f ∘ f', g' ∘ g), and the two assigned functions applied in order send h to g' ∘ (g ∘ h ∘ f) ∘ f' = (g' ∘ g) ∘ h ∘ (f ∘ f') by associativity, which is exactly the function assigned to the composite. Conclusion: both functor axioms hold, so Hom is a functor C^op × C → Set, contravariant in the first slot and covariant in the second; fixing the first slot gives Hom(A, -) and fixing the second gives Hom(-, B), the one-variable hom-functors."
    diagnostic_exemplar:
      problem: "For morphisms $f\\colon A'\\to A$ and $g\\colon B\\to B'$ of a locally small $\\mathcal C$, show that $h\\mapsto g\\circ h\\circ f$ defines a map $\\mathrm{Hom}(A,B)\\to\\mathrm{Hom}(A',B')$, and verify the composition law making $\\mathrm{Hom}(-,-)$ a functor $\\mathcal C^{op}\\times\\mathcal C\\to\\mathbf{Set}$."
      answer: "Typing: for $h\\colon A\\to B$, $g\\circ h\\circ f\\colon A'\\to B'$, as required. Identities: $(1_A,1_B)$ acts by $h\\mapsto 1_B\\circ h\\circ 1_A=h$. Composition: for $(f,g)\\colon(A,B)\\to(A',B')$ and $(f',g')\\colon(A',B')\\to(A'',B'')$ in $\\mathcal C^{op}\\times\\mathcal C$ (so $f\\colon A'\\to A$, $f'\\colon A''\\to A'$ in $\\mathcal C$), the composite acts by $h\\mapsto(g'\\circ g)\\circ h\\circ(f\\circ f')=g'\\circ\\big(g\\circ h\\circ f\\big)\\circ f'$, which is the action of $(f',g')$ after the action of $(f,g)$ — associativity makes the two agree. So $\\mathrm{Hom}(-,-)$ is a functor, contravariant in the first slot and covariant in the second."
      solution_sketch: "Type the assignment first, then observe that the composition law is pure associativity: one long string $g'\\circ g\\circ h\\circ f\\circ f'$ re-bracketed as the outer action applied after the inner one. Contravariance in the first slot is exactly what makes the pre-composed factors accumulate in the reversed order."
    anki_seeds:
      - front: "$\\mathrm{Hom}(A,-)$: variance and action on a morphism $f$?"
        back: "covariant; post-composition $f_*=f\\circ(-)$."
        type: basic
      - front: "$\\mathrm{Hom}(-,B)$: variance and action on a morphism $f$?"
        back: "contravariant; pre-composition $f^*=(-)\\circ f$."
        type: basic
      - front: "The two-variable hom-functor has domain..."
        back: "$\\mathcal C^{op}\\times\\mathcal C$ (contravariant in the source, covariant in the target)."
        type: basic

  - id: comma-categories
    name: Comma Categories
    core: false                # construction feeding only the terminal category-of-elements
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 240
    prerequisites:
      - id: slice-categories
        weight: 0.5
        key: true
      - id: functors
        weight: 0.5
        key: true
      - id: functor-composition-identity
        weight: 0.3
      - id: product-categories
        weight: 0.2
      - id: commutative-diagrams
        weight: 0.2
      - id: initial-terminal-objects
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: The construction and its composition law
        key_prerequisites: [functors]
        constraints: "Always name the two functors and the common target category before writing an object."
        exemplars:
          - problem: "Regard each poset as a category: there is exactly one arrow $p \\to q$ when $p \\le q$. Let $F\\colon\\mathcal{A}\\to\\mathcal{C}$ and $G\\colon\\mathcal{B}\\to\\mathcal{C}$ be functors with common target $\\mathcal{C}$, the chain $0 \\le 1$. Here $\\mathcal{A}$ is the chain $x \\le y$ with $F(x) = 0$, $F(y) = 1$, and $\\mathcal{B}$ is the discrete category with objects $u, v$ with $G(u) = 0$, $G(v) = 1$. An object of the comma category $(F \\downarrow G)$ is a triple $(P, Q, h)$ with $P$ in $\\mathcal{A}$, $Q$ in $\\mathcal{B}$ and an arrow $h\\colon F(P) \\to G(Q)$ in $\\mathcal{C}$. How many objects does $(F \\downarrow G)$ have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the comma category construction, an object is a triple $(P, Q, h)$ with an arrow $h\\colon F(P) \\to G(Q)$ in $\\mathcal{C}$; since $\\mathcal{C}$ is the chain $0 \\le 1$, each pair $(P, Q)$ with $F(P) \\le G(Q)$ gives exactly one object. Check the four pairs by the order rule of the chain: $(x, u)$ gives $0 \\le 0$, present; $(x, v)$ gives $0 \\le 1$, present; $(y, u)$ would need $1 \\le 0$, impossible; $(y, v)$ gives $1 \\le 1$, present. Three pairs work. The answer is 3."
          - problem: "Treat each poset as a category, with one arrow $p \\to q$ exactly when $p \\le q$. Let $F\\colon\\mathcal{A}\\to\\mathcal{C}$ and $G\\colon\\mathcal{B}\\to\\mathcal{C}$ be functors with common target $\\mathcal{C}$, the chain $0 \\le 1 \\le 2$. Here $\\mathcal{A}$ is the discrete category with objects $p, q$ and $F(p) = 0$, $F(q) = 2$, while $\\mathcal{B}$ is the discrete category with objects $u, v$ and $G(u) = 1$, $G(v) = 2$. The projection functor from the comma category $(F \\downarrow G)$ to $\\mathcal{A}$ sends each object $(P, Q, h)$ to its first component $P$. How many objects of $(F \\downarrow G)$ does this projection send to $q$?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the comma category construction, an object is a triple $(P, Q, h)$ with an arrow $h\\colon F(P) \\to G(Q)$ in the chain $\\mathcal{C}$, so a pair $(P, Q)$ works exactly when $F(P) \\le G(Q)$. The pairs: $(p, u)$ gives $0 \\le 1$, $(p, v)$ gives $0 \\le 2$, $(q, u)$ would need $2 \\le 1$, impossible, and $(q, v)$ gives $2 \\le 2$. So the objects are $(p, u, h)$, $(p, v, h)$ and $(q, v, h)$. The projection functor to $\\mathcal{A}$ sends $(P, Q, h)$ to $P$, and only $(q, v, h)$ has first component $q$. The answer is 1."
          - problem: "Let $F\\colon\\mathcal{A}\\to\\mathcal{C}$ and $G\\colon\\mathcal{B}\\to\\mathcal{C}$ be functors with common target $\\mathcal{C}$, the category with objects $0, 1$ and arrows $\\mathrm{id}_0, \\mathrm{id}_1, f\\colon 0 \\to 1, g\\colon 0 \\to 1$. Let $\\mathcal{A}$ be the category with one object $x$ and only the identity arrow, with $F(x) = 0$. Let $\\mathcal{B}$ be the category with objects $u, v$ and one non-identity arrow $c\\colon u \\to v$, with $G(u) = 0$, $G(v) = 1$, $G(c) = f$. In the comma category $(F \\downarrow G)$, a morphism $(P, Q, h) \\to (P', Q', h')$ is a pair $(a, b)$ with $G(b) \\circ h = h' \\circ F(a)$. How many morphisms does $(F \\downarrow G)$ have in total, identities included?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the comma category construction, the objects are the triples $(P, Q, h\\colon F(P) \\to G(Q))$; here they are $(x, u, \\mathrm{id}_0)$, $(x, v, f)$ and $(x, v, g)$. The morphism law requires $G(b) \\circ h = h' \\circ F(a)$, and since $\\mathcal{A}$ has only the identity, $a = 1_x$ and the law reads $G(b) \\circ h = h'$. The three identities satisfy it; from $(x, u, \\mathrm{id}_0)$ to $(x, v, f)$ the arrow $c$ gives $G(c) \\circ \\mathrm{id}_0 = f$, one morphism; to $(x, v, g)$ it gives $f$ instead of $g$, none; between $(x, v, f)$ and $(x, v, g)$ no $b$ works; no arrow of $\\mathcal{B}$ goes back to $u$. In total $3 + 1 = 4$. The answer is 4."
          - problem: "Let $F\\colon\\mathcal{A}\\to\\mathcal{C}$ and $G\\colon\\mathcal{B}\\to\\mathcal{C}$ be functors with common target $\\mathcal{C}$, the category of sets and functions. Let $\\mathcal{A}$ be the category with objects $p, q$ and one non-identity arrow $t\\colon p \\to q$, with $F(p) = \\{1\\}$, $F(q) = \\{1, 2\\}$ and $F(t)$ the inclusion of $\\{1\\}$ into $\\{1, 2\\}$ sending $1$ to $1$. Let $\\mathcal{B}$ be the category with one object $w$ and only the identity arrow, with $G(w) = \\{1, 2\\}$. In the comma category $(F \\downarrow G)$, a morphism $(P, Q, h) \\to (P', Q', h')$ is a pair $(a, b)$ with $G(b) \\circ h = h' \\circ F(a)$. How many morphisms does $(F \\downarrow G)$ contain, counting the identities?"
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the comma category construction, an object is a triple $(P, w, h)$ with a function $h\\colon F(P) \\to \\{1, 2\\}$. With $P = p$ there are $2$ functions from $\\{1\\}$ and with $P = q$ there are $4$ functions from $\\{1, 2\\}$, so $6$ objects. The morphism law requires $G(b) \\circ h = h' \\circ F(a)$. Between two $p$-objects or two $q$-objects, $a$ and $b$ are identities and the law forces $h = h'$, giving $2 + 4$ identities; from a $p$-object to a $q$-object, $a = t$ and the law reads $h = h' \\circ F(t)$, that is $h(1) = h'(1)$, one object for each of the $4$ functions $h'$, giving $4$ morphisms; from $q$ to $p$ there is no arrow. Total $2 + 4 + 4 = 10$. The answer is 10."
          - problem: "Let $F\\colon\\mathcal{A}\\to\\mathcal{C}$ and $G\\colon\\mathcal{B}\\to\\mathcal{C}$ be functors with common target category $\\mathcal{C}$, and let $(F \\downarrow G)$ be their comma category. A student checks that the projection $\\pi_{\\mathcal{A}}\\colon (F \\downarrow G) \\to \\mathcal{A}$ is a functor. Step 1: on objects, $\\pi_{\\mathcal{A}}$ sends $(P, Q, h)$ to $P$. Step 2: on morphisms, $\\pi_{\\mathcal{A}}$ sends a pair $(a, b)$ to $b$. Step 3: the identity morphism of $(P, Q, h)$ is $(1_P, 1_Q)$, so its first component is $1_P$. Step 4: composition in $(F \\downarrow G)$ is componentwise, so $\\pi_{\\mathcal{A}}$ sends a composite to the composite of the images. Step 5: $\\pi_{\\mathcal{A}}$ preserves identities and composition, so it is a functor. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid: it states the correct object map of the projection. Step 2 is not valid: it sends a pair $(a, b)$ to the second component $b$, which is an arrow of $\\mathcal{B}$, not of $\\mathcal{A}$, so the map does not even land in $\\mathcal{A}$; the projection to $\\mathcal{A}$ must send $(a, b)$ to $a$. Step 3 is a correct statement on its own: the identity of $(P, Q, h)$ in $(F \\downarrow G)$ is indeed the pair $(1_P, 1_Q)$. Step 4 is correct: composition in $(F \\downarrow G)$ is componentwise, so the first components compose in $\\mathcal{A}$. Step 5 correctly concludes. The answer is Step 2."
          - problem: "Let $F\\colon\\mathcal{A}\\to\\mathcal{C}$ and $G\\colon\\mathcal{B}\\to\\mathcal{C}$ be functors with common target category $\\mathcal{C}$. In the comma category $(F \\downarrow G)$, take morphisms $(a, b)\\colon (A, B, h) \\to (A', B', h')$ and $(a', b')\\colon (A', B', h') \\to (A'', B'', h'')$, so $G(b) \\circ h = h' \\circ F(a)$ and $G(b') \\circ h' = h'' \\circ F(a')$. Step 1: the candidate composite is $(a' \\circ a, b' \\circ b)$. Step 2: compute $h'' \\circ F(a' \\circ a) = h'' \\circ F(a') \\circ F(a)$. Step 3: rewrite this as $G(b') \\circ h' \\circ F(a)$. Step 4: rewrite this as $G(b') \\circ G(b) \\circ h = G(b' \\circ b) \\circ h$. Step 5: this is exactly the condition needed for $(a' \\circ a, b' \\circ b)$ to be a morphism of $(F \\downarrow G)$. Which hypothesis does Step 2 use?"
            answer: "functoriality of F"
            answer_contract: {"kind": "label", "options": [["functoriality of F"], ["functoriality of G"], ["the defining equation of (a, b)"], ["the defining equation of (a', b')"]]}
            solution_sketch: "Step 2 replaces $F(a' \\circ a)$ by $F(a') \\circ F(a)$, which is exactly functoriality of $F$. The wrong option functoriality of $G$ is the error of confusing which functor is applied to the first arrow: functoriality of $G$ is used only later, in Step 4, to combine $G(b') \\circ G(b)$ into $G(b' \\circ b)$. The wrong option the defining equation of (a, b) is the error of placing that equation, $G(b) \\circ h = h' \\circ F(a)$, too early: it first enters in Step 4. The wrong option the defining equation of (a', b') is the error of attributing to Step 2 the rewrite that happens in Step 3, where $h'' \\circ F(a')$ becomes $G(b') \\circ h'$. The answer is functoriality of F."
          - problem: "Write the full proof: given functors $F\\colon\\mathcal{A}\\to\\mathcal{C}$ and $G\\colon\\mathcal{B}\\to\\mathcal{C}$ with common target category $\\mathcal{C}$, define the comma category $(F \\downarrow G)$ and prove that it is a category. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects): an object is a triple $(A, B, h)$ with $A$ in $\\mathcal{A}$, $B$ in $\\mathcal{B}$ and an arrow $h\\colon F(A) \\to G(B)$ in $\\mathcal{C}$. Step 2 (morphisms): a morphism $(A, B, h) \\to (A', B', h')$ is a pair $(a\\colon A \\to A', b\\colon B \\to B')$ with $G(b) \\circ h = h' \\circ F(a)$. Step 3 (identities): $(1_A, 1_B)$ is a morphism because $G(1_B) \\circ h = h = h \\circ F(1_A)$, and it acts as an identity by componentwise computation. Step 4 (composition): given $(a, b)$ and then $(a', b')$, define the composite as $(a' \\circ a, b' \\circ b)$; then $h'' \\circ F(a' \\circ a) = h'' \\circ F(a') \\circ F(a) = G(b') \\circ h' \\circ F(a) = G(b') \\circ G(b) \\circ h = G(b' \\circ b) \\circ h$, using functoriality of $F$ and of $G$ and the two defining equations, so the composite is a morphism and composition is well defined. Step 5 (laws): associativity and the unit laws hold componentwise because they hold in $\\mathcal{A}$ and in $\\mathcal{B}$. Hence $(F \\downarrow G)$ is a category."
      - id: kp2
        name: Slices, coslices, and arrow categories as comma categories
        key_prerequisites: [slice-categories]
        constraints: "Identify the two functors explicitly, including which is a constant functor out of $\\mathbf{1}$."
        exemplars:
          - problem: "The slice category $\\mathcal{C}/c$ can be written as a comma category $(F \\downarrow G)$ of two functors into $\\mathcal{C}$. Write $1_{\\mathcal{C}}$ for the identity functor on $\\mathcal{C}$, and write $c$ also for the constant functor from the one-object category $\\mathbf{1}$ that selects the object $c$. Select the ordered pair $(F, G)$, with $F$ named first, whose comma category is exactly the slice $\\mathcal{C}/c$."
            answer: "(1_C, c)"
            answer_contract: {"kind": "label", "options": [["(1_C, c)"], ["(c, 1_C)"], ["(1_C, 1_C)"], ["(c, c)"]]}
            solution_sketch: "Definition step: an object of $(F \\downarrow G)$ is a triple $(A, B, h: F(A) \\to G(B))$. Match with the slice: an object of $\\mathcal{C}/c$ is an arrow with target $c$, so the source functor is $1_{\\mathcal{C}}$ and the target functor is the constant functor $c: \\mathbf{1} \\to \\mathcal{C}$, giving objects $(X, *, h: X \\to c)$. The option $(c, 1_C)$ swaps the two functors and produces arrows out of $c$, the coslice $c/\\mathcal{C}$. The option $(1_C, 1_C)$ drops the constant functor and produces the arrow category of $\\mathcal{C}$. The option $(c, c)$ pins both sides to $c$ and keeps only the endoarrows $c \\to c$. The answer is (1_C, c)."
          - problem: "The arrow category of a category $\\mathcal{K}$ equals the comma category $(1_{\\mathcal{K}} \\downarrow 1_{\\mathcal{K}})$, where $1_{\\mathcal{K}}$ is the identity functor on $\\mathcal{K}$. A small category $\\mathcal{K}$ has two objects $A$ and $B$; its arrows are the two identity arrows and two parallel arrows $f, g: A \\to B$, and nothing else. How many objects does the comma category $(1_{\\mathcal{K}} \\downarrow 1_{\\mathcal{K}})$ have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By the comma-category definition with both functors the identity, an object of $(1_{\\mathcal{K}} \\downarrow 1_{\\mathcal{K}})$ is a triple $(X, Y, h: X \\to Y)$, one object for each arrow $h$ of $\\mathcal{K}$. List the arrows of $\\mathcal{K}$: the identity on $A$, the identity on $B$, $f$, and $g$, so four arrows in total. Each arrow gives exactly one object of the comma category. The answer is 4."
          - problem: "Let $\\mathcal{P}$ be the poset category of divisibility on the set $\\{1, 2, 3, 6\\}$: there is one arrow $x \\to y$ exactly when $x$ divides $y$. The slice $\\mathcal{P}/6$ is the comma category $(1_{\\mathcal{P}} \\downarrow 6)$, where $6$ denotes the constant functor from the one-object category $\\mathbf{1}$ selecting the object $6$. How many objects does the slice $\\mathcal{P}/6$ have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An object of the slice $\\mathcal{P}/6$ is a triple $(x, *, h: x \\to 6)$ in the comma category, i.e. an arrow of $\\mathcal{P}$ with target $6$. By the poset arrow rule, an arrow $x \\to 6$ exists exactly when $x$ divides $6$. List the divisors of $6$ inside the set: $1, 2, 3, 6$, so four elements. The answer is 4."
          - problem: "Let $\\mathcal{Q}$ be the poset category of divisibility on the set $\\{1, 2, 4, 8\\}$: there is one arrow $x \\to y$ exactly when $x$ divides $y$. The coslice $2/\\mathcal{Q}$ is the comma category $(2 \\downarrow 1_{\\mathcal{Q}})$, where $2$ denotes the constant functor from the one-object category $\\mathbf{1}$ selecting the object $2$. How many objects does the coslice $2/\\mathcal{Q}$ have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An object of the coslice $2/\\mathcal{Q}$ is a triple $(*, X, h: 2 \\to X)$ in the comma category, i.e. an arrow of $\\mathcal{Q}$ with source $2$. By the poset arrow rule, an arrow $2 \\to X$ exists exactly when $2$ divides $X$. List the elements of the set divisible by $2$: $2, 4, 8$, so three elements. The answer is 3."
          - problem: "Let $\\mathcal{P}$ be the poset category of divisibility on the set $\\{1, 2, 3, 6\\}$: there is one arrow $x \\to y$ exactly when $x$ divides $y$. In the slice $\\mathcal{P}/6 = (1_{\\mathcal{P}} \\downarrow 6)$, a morphism from $(x, h: x \\to 6)$ to $(y, k: y \\to 6)$ is an arrow $a: x \\to y$ with $k$ after $a$ equal to $h$. How many morphisms does the slice $\\mathcal{P}/6$ have?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a poset category there is at most one arrow between two objects, so the condition on $a$ holds automatically whenever $a$ exists; the morphisms are exactly the arrows $a: x \\to y$ with $x$ and $y$ both dividing $6$. By the poset arrow rule, $a$ exists exactly when $x$ divides $y$. Count the pairs $(x, y)$ with $x$ dividing $y$ among $1, 2, 3, 6$: $(1,1)$, $(1,2)$, $(1,3)$, $(1,6)$, $(2,2)$, $(2,6)$, $(3,3)$, $(3,6)$, $(6,6)$, so nine pairs. The answer is 9."
          - problem: "Claim: the slice $\\mathcal{Q}/8$ of the divisibility poset on $\\{1, 2, 4, 8\\}$ equals the comma category $(8 \\downarrow 1_{\\mathcal{Q}})$, where $8$ is the constant functor from the one-object category $\\mathbf{1}$. Step 1: an object of $(F \\downarrow G)$ is a triple $(A, B, h: F(A) \\to G(B))$. Step 2: with $F$ the constant functor at $8$ and $G = 1_{\\mathcal{Q}}$, an object is a triple $(*, X, h: 8 \\to X)$. Step 3: the arrows $8 \\to X$ are exactly the objects of the slice $\\mathcal{Q}/8$. Step 4: therefore the slice $\\mathcal{Q}/8$ equals $(8 \\downarrow 1_{\\mathcal{Q}})$. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 states the comma-category definition of an object correctly. Step 2 substitutes the two functors into that definition correctly, keeping the direction $F(A) \\to G(B)$. Step 3 is not valid: arrows $8 \\to X$ have source $8$, so they are the objects of the coslice $8/\\mathcal{Q}$; the slice needs arrows into $8$ and arises from $(1_{\\mathcal{Q}} \\downarrow 8)$. Step 4 rests on the false Step 3, so it is not the first failure. The answer is Step 3."
          - problem: "Write the full proof: the slice $\\mathcal{C}/c$ is the comma category $(1_{\\mathcal{C}} \\downarrow c)$, where $c$ denotes the constant functor from the one-object category $\\mathbf{1}$ selecting the object $c$, and the coslice $c/\\mathcal{C}$ is the comma category $(c \\downarrow 1_{\\mathcal{C}})$. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects of the slice realization): an object of $(1_{\\mathcal{C}} \\downarrow c)$ is a triple $(X, *, h: X \\to c)$, since $1_{\\mathcal{C}}(X) = X$ and $c(*) = c$; this is exactly an arrow of $\\mathcal{C}$ with target $c$, i.e. an object of the slice $\\mathcal{C}/c$. Step 2 (morphisms): a morphism $(X, *, h) \\to (Y, *, k)$ is a pair $(a, 1_*)$ with $c(1_*) \\circ h = k \\circ 1_{\\mathcal{C}}(a)$, that is $1_c \\circ h = k \\circ a$, i.e. $h = k \\circ a$; this is exactly the morphism condition of the slice. Step 3 (conclusion): objects and morphisms coincide, so $\\mathcal{C}/c = (1_{\\mathcal{C}} \\downarrow c)$. Step 4 (the coslice, dually): an object of $(c \\downarrow 1_{\\mathcal{C}})$ is a triple $(*, X, h: c \\to X)$, an arrow with source $c$, and a morphism is a pair $(1_*, b)$ with $1_{\\mathcal{C}}(b) \\circ h = k \\circ c(1_*)$, that is $b \\circ h = k$; these are exactly the objects and morphisms of the coslice $c/\\mathcal{C}$, so $c/\\mathcal{C} = (c \\downarrow 1_{\\mathcal{C}})$, which completes the proof."
      - id: kp3
        name: Universal arrows as initial objects of a comma category
        key_prerequisites: [initial-terminal-objects]
        constraints: "State the existence and uniqueness clauses separately and match them to initiality."
        exemplars:
          - problem: "Let C be the category with a single object $\\star$ and only the identity arrow, let D be the chain $0 \\le 1 \\le 2$ viewed as a poset category, and let $G\\colon D \\to C$ be the unique functor. The comma category $(\\star \\downarrow G)$ has one object, written as a pair, for each element of the chain. Give the verdict on whether the pair built on the element $0$ is initial in $(\\star \\downarrow G)$, and the number of morphisms from that pair to the pair built on the element $2$."
            answer: "verdict = yes; morphisms = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "morphisms"}]}
            solution_sketch: "Unpack the comma category: an object is a pair $(d, f)$ with $d$ an element of the chain and $f$ the unique arrow from $\\star$ to $G(d)$. A morphism from the pair on $0$ to the pair on $2$ is an arrow $d$ from $0$ to $2$ in D with $G(d)$ after $f_0$ equal to $f_2$; the chain has exactly one such arrow, and the condition holds since C has only the identity. So exactly one morphism exists: the existence clause and the uniqueness clause both hold, which is precisely initiality, so the pair on $0$ is a universal arrow from $\\star$ to $G$. The answer is verdict = yes; morphisms = 1."
          - problem: "Let $U\\colon \\mathbf{Mon} \\to \\mathbf{Set}$ be the forgetful functor and let $X$ be the set of letters a, b, c. In the comma category $(X \\downarrow U)$ the initial object is the free monoid $X^*$ of finite words together with the insertion $\\eta$ of one-letter words; it is the universal arrow from $X$ to $U$. Take the object $(\\mathbb{N}, +)$ of $(X \\downarrow U)$, where $\\mathbb{N}$ is the additive monoid of natural numbers and $f\\colon X \\to \\mathbb{N}$ has $f(a) = 2$, $f(b) = 3$, $f(c) = 7$. Initiality gives a unique monoid homomorphism $h\\colon X^* \\to \\mathbb{N}$ with $U(h) \\circ \\eta = f$. Evaluate $h$ on the word abca."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The unique morphism from the initial object $(X^*, \\eta)$ to $(\\mathbb{N}, +)$ is the monoid homomorphism $h$ with $h$ of a word equal to the sum of the images of its letters, because $U(h) \\circ \\eta = f$ forces $h$ on one-letter words and a homomorphism is then determined on all words. Compute: $h(\\mathrm{abca}) = f(a) + f(b) + f(c) + f(a) = 2 + 3 + 7 + 2$. The answer is 14."
          - problem: "Let C be the category with a single object $\\star$ and only the identity arrow, and let D be the discrete category with objects x, y, z and no arrows other than identities. Let $G\\colon D \\to C$ be the unique functor, so the comma category $(\\star \\downarrow G)$ has one pair for each of x, y, z. Which pair of $(\\star \\downarrow G)$ is initial?"
