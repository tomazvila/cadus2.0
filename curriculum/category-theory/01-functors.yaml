        constraints: 'Functors between small posets and one-object categories, given by explicit tables of images. Items compute composites and identity functors on objects and morphisms, count functors, or decide whether a composite is an identity functor. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'Let $P$ be the poset $0<1<2$ viewed as a category. Functors $F\colon P\to P$ and $G\colon P\to P$ are given by $F(0)=1$, $F(1)=2$, $F(2)=2$ and $G(0)=0$, $G(1)=1$, $G(2)=1$. What is $(G\circ F)(0)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The object part of a composite is the composite of the object parts. First $F(0)=1$, then $G(1)=1$. So $(G\circ F)(0)=1$.'
          - problem: 'With $P$, $F$ and $G$ as in the poset $0<1<2$ with $F(0)=1$, $F(1)=2$, $F(2)=2$ and $G(0)=0$, $G(1)=1$, $G(2)=1$, the composite $G\circ F$ sends the morphism $0\to 1$ to a morphism of $P$. What are its domain and codomain?'
            answer: '(1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The composite $G\circ F$ sends the morphism $0\to 1$ to a morphism from $(G\circ F)(0)$ to $(G\circ F)(1)$. Here $(G\circ F)(0)=G(1)=1$ and $(G\circ F)(1)=G(2)=1$. So the morphism is the identity of $1$, from $1$ to $1$.'
          - problem: 'Let $P$ be the poset $0<1<2$ viewed as a category. How many functors are there from $P$ to $P$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor from $P$ to $P$ is a choice of $F(0)\le F(1)\le F(2)$ in $\{0,1,2\}$. These choices correspond to the ways of choosing $3$ values with repetition in increasing order. There are $\binom{5}{3}=10$ of them.'
          - problem: 'Let $P$ be the poset $0<1<2$ viewed as a category. For how many functors $F\colon P\to P$ does $F\circ F$ equal $F$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The condition $F\circ F=F$ means $F(F(x))=F(x)$ for $x=0,1,2$, so $F$ fixes every value it takes. Going through the $10$ functors, exactly $8$ satisfy this.'
          - problem: 'Let $F\colon B(\mathbb{Z}/3)\to B(\mathbb{Z}/3)$ and $G\colon B(\mathbb{Z}/3)\to B(\mathbb{Z}/3)$ be the functors that send the morphism $1$ to $2$, where composition is addition modulo $3$. Is $G\circ F$ the identity functor?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is a functor", "functor"], ["no", "it is not", "false", "not a functor", "not"]]}
            solution_sketch: 'A functor on $B(\mathbb{Z}/3)$ is decided by the image of $1$. The composite sends $1$ to $G(F(1))=G(2)=2+2=4=1$. So $G\circ F$ sends $1$ to $1$, and hence every morphism to itself, so it is the identity functor.'
          - problem: 'Let $P$ be the poset $0<1<2$, let $F$ have $F(0)=1$, $F(1)=2$, $F(2)=2$, and let $I$ be the identity functor on $P$. Sam says $(I\circ F)(x)=x$ because $I$ is the identity. What is the correct value of $(I\circ F)(0)$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite applies $F$ first and then $I$, so $(I\circ F)(0)=I(F(0))=I(1)=1$. The functor $I$ fixes the value $F(0)$, not the input $0$. So $I\circ F=F$ and the value is $1$.'
          - problem: 'A project has three phases $0<1<2$, and phase $a$ comes before phase $b$ when $a\le b$. A reorganisation $F$ moves phase $0$ to phase $0$, phase $1$ to phase $0$ and phase $2$ to phase $2$. A second reorganisation $G$ moves phase $0$ to phase $1$, phase $1$ to phase $2$ and phase $2$ to phase $2$. If $G$ is carried out first and then $F$, to which phase does phase $1$ go?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Doing $G$ first and then $F$ is the composite $F\circ G$. First $G(1)=2$, then $F(2)=2$. So phase $1$ goes to phase $2$, while $G\circ F$ would send it to phase $1$.'
          - problem: 'Two gear trains turn clock dials, and angles are measured in hours modulo $12$. In the first, advancing the input dial by $1$ hour advances the middle dial by $5$ hours. In the second, advancing the middle dial by $1$ hour advances the output dial by $7$ hours. Both are functors on $B(\mathbb{Z}/12)$. By how many hours, as a clock reading, does the output dial advance when the input dial advances by $1$ hour?'
            answer: '11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The input advance of $1$ hour moves the middle dial by $5$ hours. The second train turns $5$ hours into $5\cdot 7=35$ hours. On a 12-hour clock $35=24+11$, so the output dial reads $11$.'
          - problem: 'Let $P$ be the poset $0<1<2$ viewed as a category, with $F(0)=1$, $F(1)=2$, $F(2)=2$ and $G(0)=0$, $G(1)=1$, $G(2)=1$ functors $P\to P$. Is $G\circ F$ equal to $F\circ G$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "equal", "they are equal", "same"], ["no", "not equal", "they differ", "different"]]}
            solution_sketch: 'The composite $G\circ F$ sends $1$ to $G(2)=1$. The composite $F\circ G$ sends $1$ to $F(1)=2$. The two composites differ at the object $1$, so they are not equal.'
          - problem: 'Write the full proof that, for functors $F\colon\mathcal{B}\to\mathcal{C}$ and $G\colon\mathcal{C}\to\mathcal{D}$, the composite $G\circ F$ is a functor and the identity functor is a two-sided unit for composition.'
            answer: 'G∘F is a functor; identity is a unit'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Types: for $f\colon A\to B$, $Ff\colon FA\to FB$ and so $G(Ff)\colon GFA\to GFB$. Identities: $(G\circ F)(1_A)=G(1_{FA})=1_{GFA}$. Composites: $(G\circ F)(g\circ f)=G(Fg\circ Ff)=G(Fg)\circ G(Ff)$, which is $(G\circ F)g\circ(G\circ F)f$. Units: the identity functor fixes every object and morphism, so $1_{\mathcal{D}}\circ F=F$ and $F\circ 1_{\mathcal{B}}=F$, because functors are equal when their object parts and morphism parts agree.'
      - id: kp2
        name: The category Cat and isomorphisms of categories
        key_prerequisites: [category-definition]
        step_check:
          step: 'equality on the nose, not just a natural isomorphism'
          question: 'Why must $RS$ equal $1_{\mathcal{A}}$ exactly, rather than only up to a natural isomorphism, for $S$ to be an isomorphism in $\mathbf{Cat}$?'
          options:
            - 'Natural isomorphism is only defined for functors between categories that have finite sets of objects'
            - 'The identities of $\mathbf{Cat}$ are the identity functors, so inverse composites must equal them'
            - 'Equality is easier to check than a natural isomorphism, so mathematicians choose it by convention'
          answer: 'The identities of $\mathbf{Cat}$ are the identity functors, so inverse composites must equal them'
          why: 'In $\mathbf{Cat}$ the morphisms are functors, so an inverse must compose to the identity morphism of $\mathbf{Cat}$, which is the identity functor.'
        constraints: 'Small categories are given in text: discrete and indiscrete categories on a few objects, one-object categories, and posets. Items compute inverse functors, count functors or isomorphisms, or decide whether a functor is an isomorphism of categories. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'Let $\mathbf{C}$ and $\mathbf{D}$ be the indiscrete categories on the objects $0,1,2$, with exactly one morphism between any two objects. The functor $F\colon\mathbf{C}\to\mathbf{D}$ sends the objects $0,1,2$ to $1,2,0$. It is an isomorphism of categories. What does its inverse functor $G\colon\mathbf{D}\to\mathbf{C}$ send the object $0$ to?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse functor must satisfy $F(G(0))=0$ on objects. Since $F$ sends $2$ to $0$, the inverse sends $0$ to $2$. The action on morphisms is then forced, because each hom-set has exactly one element.'
          - problem: 'An airline has $4$ airports, and between any two airports (including an airport and itself) there is exactly one route in the category. Renaming the airports by a bijection gives an isomorphism of this category with itself. How many isomorphisms of categories are there from this category to itself?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each hom-set has exactly one element, so a functor is decided by its action on objects, and it is an isomorphism exactly when this action is a bijection. The number of bijections of $4$ airports is $4!=24$.'
          - problem: 'Let $\mathbf{C}$ be the discrete category on the objects $0,1,2$ and $\mathbf{D}$ the discrete category on the objects $0,1,2,3,4$, each with only identity morphisms. Let $F\colon\mathbf{C}\to\mathbf{D}$ send $0,1,2$ to $0,1,2$. How many functors $G\colon\mathbf{D}\to\mathbf{C}$ satisfy $G(F(x))=x$ for every object $x$ of $\mathbf{C}$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The equations force $G(0)=0$, $G(1)=1$ and $G(2)=2$. In a discrete category every function on objects is a functor, so $G(3)$ and $G(4)$ are free, with $3$ choices each. So there are $3\cdot 3=9$ functors.'
          - problem: 'Let $\mathbf{C}$ be the discrete category on the objects $0,1$, and let $\mathbf{D}$ be the poset category $0<1$. The functor $F\colon\mathbf{C}\to\mathbf{D}$ sends each object to itself. Is $F$ an isomorphism of categories?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "it is a functor", "functor"], ["no", "it is not", "false", "not a functor", "not"]]}
            solution_sketch: 'The functor $F$ is a bijection on objects, but $\mathbf{D}$ has a morphism $0\to 1$ and $\mathbf{C}$ has none. An inverse functor would have to send $0\to 1$ to a morphism $0\to 1$ in $\mathbf{C}$. No such morphism exists, so $F$ is not an isomorphism.'
          - problem: 'Let $\mathbf{C}$ and $\mathbf{D}$ be the indiscrete categories on the objects $0,1,2$. The functor $F\colon\mathbf{C}\to\mathbf{D}$ sends the objects $0,1,2$ to $2,0,1$. Sam says that its inverse $G$ is the same assignment $2,0,1$, because the inverse of a cycle is itself. What does the correct inverse functor send $0$ to?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse $G$ must satisfy $F(G(0))=0$. Since $F(1)=0$, the inverse sends $0$ to $1$, not to $2$. In fact $G$ sends $0,1,2$ to $1,2,0$, which is not the same assignment as $F$.'
          - problem: 'A gear train is a functor $F\colon B(\mathbb{Z}/12)\to B(\mathbb{Z}/12)$ on clock dials, in which advancing the input dial by $1$ hour advances the output dial by $5$ hours. It is an isomorphism of categories. By how many hours does its inverse functor advance the input dial when the output dial advances by $1$ hour?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse functor $G$ must satisfy $G(F(1))=1$, so $G(5)=1$. Since $G(5)=5\cdot G(1)$, we need $5\cdot G(1)\equiv 1$ modulo $12$. We have $5\cdot 5=25=24+1$, so $G(1)=5$.'
          - problem: 'How many functors are there from the poset category $0<1$ to itself?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor sends $0$ and $1$ to $a\le b$ in $\{0,1\}$. The choices are $(0,0)$, $(0,1)$ and $(1,1)$. Only $(0,1)$ is an isomorphism of categories, so $3$ functors exist in all.'
          - problem: 'Let $\mathbf{C}$ be the indiscrete category on the objects $0,1,2$, with exactly one morphism between any two objects. How many functors are there from $\mathbf{C}$ to itself?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each hom-set has exactly one element, so a functor is decided by its action on objects, and every action works. A function from $3$ objects to $3$ objects can be chosen in $3^3=27$ ways. So there are $27$ functors.'
          - problem: 'Let $\mathbf{C}$ be the discrete category on the objects $0,1,2$, with only identity morphisms, and let $F\colon\mathbf{C}\to\mathbf{C}$ send the objects $0,1,2$ to $2,0,1$. Is $F$ an isomorphism of categories?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "true", "yes it is"], ["no", "it is not", "false", "not"]]}
            solution_sketch: 'In a discrete category every function on objects is a functor. The function $0,1,2\mapsto 2,0,1$ is a bijection, and its inverse sends $0,1,2$ to $1,2,0$. Both composites are identity functors, so $F$ is an isomorphism.'
          - problem: 'Write the full proof that small categories and functors form a category $\mathbf{Cat}$, by checking associativity and the unit laws for composition of functors.'
            answer: 'Cat is a category'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Composition of functors is a functor, and the identity functor is a functor. Associativity: for functors $F$, $G$, $H$ and an object $A$, $((H\circ G)\circ F)(A)=H(G(F(A)))=(H\circ(G\circ F))(A)$, and the same computation works on a morphism. Units: $(1\circ F)(A)=F(A)$ and $(F\circ 1)(A)=F(A)$, and the same holds on morphisms. Functors with equal object and morphism parts are equal, so all category axioms hold.'
      - id: kp3
        name: Endofunctors and their iterates
        key_prerequisites: [composition-associativity-identity]
        step_check:
          step: 'since $L$ is an endofunctor, so is $L^2$'
          question: 'Why is $L^2=L\circ L$ again an endofunctor?'
          options:
            - 'A composite of two functors is a functor, and $L^2$ is $L$ composed with $L$'
            - '$L^2$ has the same object part as $L$, so it inherits the two laws from $L$ unchanged'
            - 'Applying $L$ twice doubles every list, and doubling keeps both laws true'
          answer: 'A composite of two functors is a functor, and $L^2$ is $L$ composed with $L$'
          why: 'The composite of functors preserves identities and composition, because each law passes through the inner functor and then the outer one.'
        constraints: 'Endofunctors of Set, of small posets and of one-object categories are given by explicit rules. Items compute iterates on elements and sizes, solve for the exponent or the starting size, or decide whether two composites agree. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'Let $T$ be an endofunctor of a category $\mathbf{C}$, with $T^0$ the identity functor and $T^{j+1}=T\circ T^j$. The composite $T^3\circ T^0\circ T^5$ equals $T^k$ for exactly one exponent $k$. What is $k$?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The functor $T^0$ is the identity functor, which is a unit for composition, so $T^3\circ T^0\circ T^5=T^3\circ T^5$. Composing $3$ copies of $T$ with $5$ copies of $T$ gives $3+5=8$ copies. So $k=8$.'
          - problem: 'Let $T\colon\mathbf{Set}\to\mathbf{Set}$ be the functor with $T(X)=X\times X$ and $T(f)=f\times f$. How many elements does $T^3(\{0,1\})$ have?'
            answer: '256'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each application of $T$ squares the number of elements. So $T(\{0,1\})$ has $4$ elements, $T^2(\{0,1\})$ has $16$ and $T^3(\{0,1\})$ has $16^2=256$.'
          - problem: 'Let $P$ be the power-set functor on $\mathbf{Set}$, so $P^2=P\circ P$, and $P(f)$ sends a subset $U$ to its direct image $f[U]$. Let $f\colon\{0,1,2\}\to\{0,1,2\}$ have $f(0)=1$, $f(1)=1$, $f(2)=0$, and let $S=\{\{0,2\},\{2\},\{0,1\}\}$. How many elements does $P^2(f)(S)$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The map $P^2(f)$ takes the direct image of each member of $S$. We get $f[\{0,2\}]=\{0,1\}$, $f[\{2\}]=\{0\}$ and $f[\{0,1\}]=\{1\}$. These $3$ sets are different, so $P^2(f)(S)$ has $3$ elements.'
          - problem: 'Let $T\colon\mathbf{Set}\to\mathbf{Set}$ have $T(X)=X\times X$. Sam claims that $T^n(\{0,1\})$ has $4^n$ elements for every $n\ge 1$. What is the smallest $n\ge 1$ for which the claim is false?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each application of $T$ squares the size, so $T^n(\{0,1\})$ has $2^{2^n}$ elements. For $n=1$ and $n=2$ this equals $4$ and $16$, which match $4^n$. For $n=3$ it is $256$, but $4^3=64$, so the smallest $n$ is $3$.'
          - problem: 'Let $T$ be the functor on the poset category $0<1<2$ with $T(0)=1$, $T(1)=2$ and $T(2)=2$. What is the smallest $n\ge 1$ for which $T^n$ sends every object to the same object?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The functor $T$ itself sends $0,1,2$ to $1,2,2$, which are not all equal. Then $T^2$ sends $0$ to $T(1)=2$, $1$ to $T(2)=2$ and $2$ to $2$. So $T^2$ sends every object to $2$, and $n=2$.'
          - problem: 'A machine $T$ turns a set of labels into the set of all ordered pairs of labels. Starting with $3$ labels, the machine is run twice, each time on the output of the previous run. How many items are there at the end?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first run gives $3\cdot 3=9$ items, and the second run pairs these up, giving $9\cdot 9=81$ items. So there are $81$ items at the end. Each run squares the size.'
          - problem: 'A machine $T$ turns a set of labels into the set of all ordered pairs of labels. The machine is run twice, each time on the output of the previous run, and it ends with $625$ items. How many labels were there at the start?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If $n$ labels go in, the first run gives $n^2$ items and the second run gives $(n^2)^2=n^4$ items. So $n^4=625$. Since $5^4=625$, there were $5$ labels at the start.'
          - problem: 'Let $S$ be the functor on the poset category $0<1$ that sends both objects to $1$, and let $T$ be the functor that sends both objects to $0$. Is $S\circ T$ equal to $T\circ S$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["no", "not equal", "they differ", "different"], ["yes", "equal", "they are equal", "same"]]}
            solution_sketch: 'The composite $S\circ T$ sends $0$ to $S(T(0))=S(0)=1$. The composite $T\circ S$ sends $0$ to $T(S(0))=T(1)=0$. These differ, so the composites are different functors.'
          - problem: 'Let $P$ be the power-set functor on $\mathbf{Set}$, with $P(f)$ sending a subset to its direct image. How many elements does $P^2(\{0,1\})$ have?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The set $P(\{0,1\})$ has $2^2=4$ elements, the subsets of $\{0,1\}$. Then $P^2(\{0,1\})$ is the set of subsets of this $4$-element set. It has $2^4=16$ elements.'
          - problem: 'Let $S$ be the functor on the poset category $0<1$ that sends both objects to $1$. Is $S\circ S$ equal to $S$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "equal", "they are equal", "same"], ["no", "not equal", "they differ", "different"]]}
            solution_sketch: 'The composite $S\circ S$ sends each object $x$ to $S(S(x))=S(1)=1$, and $S$ sends $x$ to $1$. Every morphism goes to the identity of $1$ under both functors. So the two functors agree and $S\circ S=S$.'
          - problem: 'Write the full proof that the endofunctors of a fixed category $\mathbf{C}$ form a monoid under composition, with unit the identity functor.'
            answer: 'Endofunctors of C form a monoid'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Closure: the composite of two endofunctors of $\mathbf{C}$ is a functor $\mathbf{C}\to\mathbf{C}$. Unit: $(1_{\mathbf{C}}\circ T)(A)=T(A)$ and $(1_{\mathbf{C}}\circ T)(f)=T(f)$, so $1_{\mathbf{C}}\circ T=T$, and likewise $T\circ 1_{\mathbf{C}}=T$. Associativity: $((R\circ S)\circ T)(A)=R(S(T(A)))=(R\circ(S\circ T))(A)$, and the same on morphisms. A set with an associative product and a two-sided unit is a monoid.'
    diagnostic_exemplar:
      problem: "Given functors $F\\colon\\mathcal{B}\\to\\mathcal{C}$ and $G\\colon\\mathcal{C}\\to\\mathcal{D}$, define $GF$ by $(GF)A=G(FA)$ and $(GF)f=G(Ff)$, and prove that $GF$ satisfies both functor laws."
      answer: "Typing: for $f\\colon A\\to B$, $Ff\\colon FA\\to FB$, so $G(Ff)\\colon GFA\\to GFB$. Identities: $(GF)(1_A)=G(F1_A)=G(1_{FA})=1_{GFA}$, using the identity law of $F$ then of $G$. Composites: $(GF)(g\\circ f)=G(F(g\\circ f))=G(Fg\\circ Ff)=G(Fg)\\circ G(Ff)=(GF)g\\circ(GF)f$, using the composition law of $F$ then of $G$. Hence $GF$ is a functor."
      solution_sketch: "Check the typing of $G(Ff)$, then apply each law twice, inner functor first: $G(F1_A)=G(1_{FA})=1_{GFA}$, and $G(F(g\\circ f))$ splits by the law for $F$ and then by the law for $G$."
    anki_seeds:
