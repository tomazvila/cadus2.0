    knowledge_points:
      - id: kp1
        name: The data and axioms, read off in Set
        key_prerequisites: [composition-associativity-identity]
        constraints: "Stay in $\\mathbf{Set}$: state the four pieces of data and the two axioms, then instantiate each piece concretely; no verification beyond citing associativity and unit laws of function composition."
        exemplars:
          - problem: "In Set take objects A = {1, 2} and B = {3, 4, 5}. The hom-set Hom(A, B) is the set of all functions from A to B. How many morphisms are in Hom(A, B)?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In Set the objects are sets, so the hom-set Hom(A, B) is the set of all functions from A to B; this instantiates the hom-set piece of the category data. Each of the 2 elements of A has 3 possible images in B, so the count is 3^2 = 9 by the counting rule. The number of morphisms in Hom(A, B) is 9."
          - problem: "In Set let f, g be morphisms of integers with f(x) = 2x + 1 and g(x) = x^2. The composite morphism is g after f, defined by (g after f)(x) = g(f(x)). Compute (g after f)(2)."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Composition in Set is ordinary function composition, the third piece of data. Apply the inner function first: f(2) = 2*2 + 1 = 5. Then apply g to that value: g(5) = 5^2 = 25. The value of (g after f)(2) is 25."
          - problem: "In Set let f be the function on the integers given by f(x) = 4x - 3, and let 1_B be the identity function on the codomain, given by 1_B(y) = y. The left unit law says 1_B after f = f. Compute (1_B after f)(2)."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity morphism 1_B is the function sending each input to itself, so the composite (1_B after f)(x) = 1_B(f(x)) = f(x); this instantiates the unit law of the category. Evaluate f(2) = 4*2 - 3 = 5. The value of (1_B after f)(2) is 5."
          - problem: "In Set take functions on the integers f(x) = x^2, g(x) = x + 3, and h(x) = 2x. Associativity of composition gives h after (g after f) = (h after g) after f. Compute (h after (g after f))(2)."
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Compute the inner composite first: (g after f)(2) = g(2^2) = g(4) = 4 + 3 = 7. Then apply the outer function: h(7) = 2*7 = 14. By associativity of function composition this equals ((h after g) after f)(2). The value is 14."
          - problem: "In Set take objects A = {1, 2, 3} and B = {4, 5}. The four pieces of data of the category give four hom-sets: Hom(A, A), Hom(A, B), Hom(B, A), Hom(B, B). How many morphisms do these four hom-sets contain in total?"
            answer: "48"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Count each hom-set by the function-counting rule: Hom(X, Y) has |Y|^|X| functions. Hom(A, A) has 3^3 = 27 functions, Hom(A, B) has 2^3 = 8, Hom(B, A) has 3^2 = 9, and Hom(B, B) has 2^2 = 4. Summing all four pieces of data gives 27 + 8 + 9 + 4 = 48. The total number of morphisms is 48."
          - problem: "In Set let f(x) = x + 1, g(x) = 3x, and h(x) = x^2 be functions on the integers. The difference (h after (g after f))(2) - ((h after g) after f)(2) instantiates the associativity axiom for these three morphisms. What is the value of this difference?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Both brackets send 2 to h(g(f(2))). Compute inside out: f(2) = 2 + 1 = 3, then g(3) = 3*3 = 9, then h(9) = 9^2 = 81, so the first bracket gives 81. The other bracket also gives h(g(f(2))) = 81, since function composition is associative by the associativity law. The difference is 81 - 81 = 0."
          - problem: "Write the full proof: Set, with objects all sets, hom-sets the function sets, identities the identity functions, and composition the function composition, satisfies the two axioms of a category. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (data): the objects are all sets; for sets A and B the hom-set Hom(A, B) is the set of all functions from A to B; the identity on A is the function 1_A with 1_A(x) = x; composition is function composition, (g after f)(x) = g(f(x)). Step 2 (associativity axiom): for composable f, g, h, both h after (g after f) and (h after g) after f send each x to h(g(f(x))); this holds by the associativity law of function composition, so the two composites are equal as functions. Step 3 (unit): for f from A to B, the unit law demands 1_B after f = f and f after 1_A = f; both sides send each x to f(x), since 1_B(y) = y and 1_A(x) = x, so both unit laws hold by the unit laws of function composition. Conclusion: all four pieces of data are specified and both axioms hold, so Set is a category. This completes the full proof."
      - id: kp2
        name: A monoid as a one-object category
        key_prerequisites: [monoids]
        constraints: "An abstract monoid $M$ (or a named concrete one); construct $BM$ and check each category axiom by matching it against the corresponding monoid axiom."
        exemplars:
          - problem: "Let M be the monoid of all functions from the set {0, 1, 2} to itself under composition, where a function f is written as the triple (f(0), f(1), f(2)). Let BM be the one-object category of M: one object, one arrow for each function, and composition of arrows equal to the monoid product, here function composition. Take the arrow f = (2, 0, 1) and the arrow g = (1, 1, 0). Compute the composite of the arrow f followed by the arrow g, that is g after f. Give the answer as (a, b, c)."
            answer: "(0,1,1)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (composition axiom of BM): composition of arrows is the monoid product, here function composition, so the composite of f followed by g is g after f, with (g after f)(x) = g(f(x)). Step 2 (evaluate the inner arrow): f(0) = 2, f(1) = 0, f(2) = 1. Step 3 (apply the outer arrow): g(2) = 0, g(0) = 1, g(1) = 1, so the composite sends 0 to 0, 1 to 1, and 2 to 1. The answer is (0,1,1)."
          - problem: "Let M be the monoid of all functions from the set {0, 1, 2} to itself under composition, written as triples (f(0), f(1), f(2)), and let BM be its one-object category, so composition of arrows is function composition. Take the arrows f = (1, 0, 2), g = (2, 1, 0), and h = (0, 0, 2). The associativity axiom of BM says that the composite of f followed by g followed by h is the same arrow under either grouping. Compute this composite and give the answer as (a, b, c)."
            answer: "(0,2,0)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1 (composition axiom of BM): composition of arrows is function composition, so the composite applies f first, then g, then h. Step 2 (track each element): 0 goes to 1 by f, then to 1 by g, then to 0 by h; 1 goes to 0 by f, then to 2 by g, then to 2 by h; 2 goes to 2 by f, then to 0 by g, then to 0 by h. Step 3 (associativity axiom): grouping as h after (g after f) gives (1, 2, 0) after the first two arrows and then (0, 2, 0), and grouping as (h after g) after f gives (2, 0, 0) after the first grouping and then (0, 2, 0), the same triple, because function composition is associative. The answer is (0,2,0)."
          - problem: "Let M be the monoid of nonzero integers modulo 11 under multiplication, and let BM be its one-object category: one object, one arrow for each element of M, composition of arrows equal to the monoid product, and the identity arrow equal to the monoid unit 1. Find the order of the arrow 2, that is, the smallest number k with k at least 1 such that the composite of the arrow 2 with itself k times equals the identity arrow. Give the answer as a number."
            answer: "10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (identity axiom of BM): the identity arrow is the monoid unit 1, so we need the smallest k with 2^k equal to 1 modulo 11. Step 2 (repeated composition is the monoid power): compute 2^1 = 2, 2^2 = 4, 2^3 = 8, 2^4 = 5, 2^5 = 10, 2^6 = 9, 2^7 = 7, 2^8 = 3, 2^9 = 6, and 2^10 = 1 modulo 11. Step 3 (minimality): no earlier power equals 1, so the first time the composite reaches the identity arrow is after 10 compositions. The answer is 10."
          - problem: "Let M be the monoid of nonzero integers modulo 19 under multiplication, and let BM be its one-object category, so composition of arrows is multiplication modulo 19 and the identity arrow is the monoid unit 1. Find the arrow x such that the composite of the arrow 7 followed by the arrow x is the identity arrow. Give the answer as a number."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (identity axiom of BM): the identity arrow is the unit 1, so we need the arrow x with the composite 7 x equal to 1 modulo 19. Step 2 (extended Euclidean algorithm): 19 = 2 times 7 plus 5, then 7 = 1 times 5 plus 2, then 5 = 2 times 2 plus 1, and back-substituting gives 1 = 3 times 19 minus 8 times 7. Step 3 (reduce modulo 19): so the composite 7 times (-8) equals 1 modulo 19, and x = -8 = 11 modulo 19; check that 7 times 11 = 77 = 1 modulo 19. The answer is 11."
          - problem: "A student argues that in the one-object category BM built from a monoid M, every arrow has an inverse. Step 1: let m be any arrow of BM, so m is an element of M. Step 2: choose the arrow n to be the unit e of M. Step 3: by the unit axiom of M, the composite n m equals m and the composite m n equals m. Step 4: therefore n is an inverse of m, so every arrow of BM has an inverse. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: the arrows of BM are exactly the elements of M. Step 2 is a legitimate choice of an arrow. Step 3 correctly applies the unit axiom of M. Step 4 is the first invalid step: an inverse of m must compose with m to give the identity arrow e, but here the composite n m equals m, which is not e in general; the student confused the unit arrow with an inverse arrow, and a monoid need not have inverses. The answer is Step 4."
          - problem: "Let BM be the one-object category built from a monoid M, and write the monoid product of s and t as s t. For arrows m, n, p of BM, the composite of m followed by n is n m, so the composite (p n) m applies m first, then n, then p. In the verification of the associativity axiom of BM, the line that says what the composite (p n) m equals is missing. Select the line that holds for every monoid M and completes the verification."
            answer: "(p n) m = p (n m)"
            answer_contract: {"kind": "label", "options": [["(p n) m = p (n m)"], ["(p n) m = n (p m)"], ["(p n) m = (m n) p"], ["(p n) m = p (m n)"]]}
            solution_sketch: "The correct line is (p n) m = p (n m): this is exactly the associativity axiom of the monoid M, which is what the associativity axiom of BM requires, since composition in BM is the monoid product. The option (p n) m = n (p m) wrongly assumes the product is commutative, which is not a monoid axiom. The option (p n) m = (m n) p reverses the order of the factors. The option (p n) m = p (m n) swaps n and m inside the second product. The answer is (p n) m = p (n m)."
          - problem: "Write the full proof: Let M be a monoid. Construct the one-object category BM and verify each category axiom by matching it to the corresponding monoid axiom. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (construction): let M be a monoid with unit e. Define BM to have exactly one object, written star. Define the hom-set of BM by Hom(star, star) = M, so the arrows are the elements of M. Step 2 (composition): for arrows m and n, define the composite of m followed by n to be the monoid product n m. This is well defined because M is closed under its product, and composition is total because there is only one hom-set. Step 3 (associativity axiom): for arrows m, n, p, the composite (p after n) after m is the product (p n) m, and p after (n after m) is the product p (n m); these are equal by the associativity axiom of M, so composition in BM is associative. Step 4 (identity axiom): set the identity arrow of star to be the monoid unit e. Then e m = m and m e = m for every arrow m, by the unit axiom of M, which is exactly the requirement that composing with the identity arrow changes nothing. Step 5 (conclusion): each category axiom for BM is a restatement of a monoid axiom of M, so BM is a category with one object. Conversely, any one-object category yields a monoid: take the endomorphisms of the unique object as elements, composition as the product, and the identity arrow as the unit. The proof is complete."
      - id: kp3
        name: Recognizing non-examples (composition must be total)
        key_prerequisites: [relations-equivalence]
        constraints: "Non-example must fail exactly one axiom; name which axiom fails."
        exemplars:
          - problem: "Objects are the points of the plane, with a single arrow p -> q whenever the distance from p to q is at most 1, and there are no other arrows. Each point has a loop to itself, and exactly one axiom fails. Which axiom fails?"
            answer: "composition total"
            answer_contract: {"kind": "label", "options": [["composition total"], ["associativity"], ["identity arrows"], ["identity laws"]]}
            solution_sketch: "Step 1 (identity check): for any point p, the distance from p to p is 0, so the loop p -> p exists. Step 2 (composition check): take p = (0,0), q = (1,0), and r = (2,0); the arrows p -> q and q -> r exist, but the distance from p to r is 2, so the composite p -> r does not exist. Step 3 (remaining axioms): with at most one arrow between any two points, every defined composite is unique, so the unit laws and associativity hold for all composites that exist. Step 4 (wrong options): associativity is wrong because defined composites are unique and associate; identity arrows is wrong because every loop exists; identity laws is wrong because unique composites satisfy the unit laws. The answer is composition total."
          - problem: "Objects are 1, 2, 4. There is a single arrow a -> b whenever a divides b, except that the arrow 1 -> 4 is removed, and there are no other arrows. The loops give the identities, and exactly one axiom fails. What fraction of the composable pairs of arrows have no composite? Give the answer as a fraction."
            answer: "1/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (list the arrows): the arrows are 1 -> 1, 2 -> 2, 4 -> 4, 1 -> 2, and 2 -> 4; the loops give the identities. Step 2 (count composable pairs): a composable pair is two arrows f: a -> b and g: b -> c with the same middle object b; counting by middle object gives 2 + 4 + 2 = 8 pairs. Step 3 (find the failure): the pair 1 -> 2 then 2 -> 4 needs the composite 1 -> 4, which was removed; every other pair has its composite. Step 4 (fraction): 1 of the 8 composable pairs has no composite, and 1/8 is already in lowest terms. The answer is 1/8."
          - problem: "Objects are 0, 1, 2, 3, 4, 5, with a single arrow a -> b whenever |a - b| <= 2, and there are no other arrows. A composable pair means two arrows a -> b and b -> c with the same middle object b. The loops give the identities, and exactly one axiom fails. How many composable pairs of arrows have no composite?"
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (structure): the arrows join objects at distance at most 2, so a composable pair a -> b, b -> c has endpoints at distance at most 4, and the composite a -> c exists exactly when that distance is at most 2. Step 2 (missing endpoints): a composite is missing exactly for endpoint pairs at distance 3 or 4. Step 3 (count distance 3): the ordered endpoint pairs at distance 3 are (0,3), (3,0), (1,4), (4,1), (2,5), (5,2), and each has 2 middle objects, giving 6 * 2 = 12. Step 4 (count distance 4): the ordered endpoint pairs at distance 4 are (0,4), (4,0), (1,5), (5,1), and each has 1 middle object, giving 4. Step 5 (total): 12 + 4 = 16 composable pairs have no composite. The answer is 16."
          - problem: "Objects are 0, 1, 2, 3, 4, with a single arrow a -> b whenever a is at most b + 1, and there are no other arrows. Each object has a loop to itself, and exactly one axiom fails. How many composable pairs of arrows have no composite?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The structure has objects 0, 1, 2, 3, 4 and one arrow a -> b exactly when a is at most b + 1. First, the identity check: a is at most a + 1, so every loop a -> a exists. Second, the composition check: for a middle object b the arrows into b are counted by the objects a with a at most b + 1, and the arrows out of b are counted by the objects c with c at least b - 1; counting composable pairs by middle object gives 10 + 15 + 16 + 15 + 10 = 66 pairs. Third, the failure rule: the composite of a -> b and b -> c exists exactly when a is at most c + 1, so a failure needs a at least c + 2; with a at most b + 1 and b at most c + 1 this forces a = c + 2 and b = c + 1, giving the triples (2, 1, 0), (3, 2, 1), and (4, 3, 2). Fourth, the other axioms hold because there is at most one arrow between any two objects, so every defined composite is unique and the unit laws and associativity hold. The answer is 3."
          - problem: "Objects are 0, 1, 2, 3, 4, with a single arrow a -> b whenever |a - b| <= 1, and there are no other arrows. Determine whether this is a category, and give the number of composable pairs of arrows that have no composite."
            answer: "verdict = no; missing = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "missing"}]}
            solution_sketch: "Step 1 (identities): each of 0, 1, 2, 3, 4 has a loop to itself, so identity arrows exist. Step 2 (composition): for a composable pair a -> b then b -> c, the composite a -> c exists exactly when |a - c| <= 1, so a composite is missing exactly when the endpoints are at distance 2. Step 3 (count): the ordered endpoint pairs at distance 2 are (0,2), (2,0), (1,3), (3,1), (2,4), (4,2), and each has the single middle object between them, giving 6 composable pairs with no composite. Step 4 (verdict): composition is not total, so the structure is not a category; the option yes is wrong because it ignores the missing composites. The answer is verdict = no; missing = 6."
          - problem: "Objects are 0, 1, 2, with a single arrow a -> b whenever |a - b| <= 1, and there are no other arrows. Exactly one axiom fails. Arrows may be added, one at a time, until the structure is a category. How many arrows must be added?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (list the arrows): the arrows are 0 -> 0, 1 -> 1, 2 -> 2, 0 -> 1, 1 -> 0, 1 -> 2, and 2 -> 1. Step 2 (find the gaps): the composable pair 0 -> 1 then 1 -> 2 needs 0 -> 2, and the pair 2 -> 1 then 1 -> 0 needs 2 -> 0; both are absent, and these are the only failures. Step 3 (repair and check): adding the two arrows 0 -> 2 and 2 -> 0 joins every pair of objects, and then any composable pair has endpoints at distance at most 2, so its composite exists. The answer is 2."
          - problem: "Write the full proof: Let the objects be 0, 1, 2, 3, with a single arrow a -> b whenever |a - b| <= 1 and no other arrows. Show that exactly one axiom fails, and name that axiom. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (identity arrows): for each object a in {0, 1, 2, 3}, the distance from a to a is 0, which is at most 1, so the loop a -> a exists and identities are present. Step 2 (identity laws): whenever a composite of arrows is defined, it is the unique arrow between its endpoints, so composing with an identity loop returns the same arrow, and both unit laws hold. Step 3 (associativity): with at most one arrow between any two objects, any two defined composites with the same endpoints are equal, so associativity holds for every triple for which both sides are defined. Step 4 (composition totality): the arrows 0 -> 1 and 1 -> 2 are composable, and their composite would have to be 0 -> 2; but the distance from 0 to 2 is 2, which is greater than 1, so 0 -> 2 is not an arrow and the composite does not exist. Conclusion: exactly one axiom, the requirement that composition be total, fails, so the structure is not a category."
      - id: kp4
        name: A preorder as a thin category
        key_prerequisites: [partial-orders]
        constraints: "Preorders/posets only; abstract proofs must invoke at-most-one-arrow hom-sets for automatic commutativity; concrete instances use divisibility or subset order on sets of at most 6 elements."
        exemplars:
          - problem: "Regard the divisibility preorder on the objects 2, 4, 8, 16, 24 as a category: an arrow a -> b exists exactly when a divides b, that is when gcd(a, b) = a. How many morphisms does this category have in total?"
            answer: "14"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the full object set is 2, 4, 8, 16, 24, and the arrow rule is that an arrow a -> b exists exactly when gcd(a, b) = a. Step 2: count out-arrows with the gcd rule: from 2 there are 5, from 4 there are 4, from 8 there are 3, from 16 there is 1, from 24 there is 1. Step 3: add the counts: 5 + 4 + 3 + 1 + 1 = 14. The total number of morphisms is 14."
          - problem: "In the divisibility category on the objects 3, 8, 12, 24, an arrow x -> y exists exactly when x divides y, that is when gcd(x, y) = x. Decide whether an arrow 12 -> 8 exists, and count the arrows that start at 8. Give the verdict and the count."
            answer: "verdict = absent; count = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["present"], ["absent"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Step 1: the objects are 3, 8, 12, 24, and the arrow rule is that an arrow x -> y exists exactly when gcd(x, y) = x. Step 2: compute gcd(12, 8) = 4, which does not equal 12, so no arrow 12 -> 8 exists; the option present is the error of confusing a common factor with divisibility, and the verdict is absent. Step 3: count arrows from 8 with the same rule: gcd(8, 3) = 1, gcd(8, 8) = 8, gcd(8, 12) = 4, gcd(8, 24) = 8, so arrows go from 8 to 8 and from 8 to 24, a count of 2. The answer is verdict = absent; count = 2."
          - problem: "Take the subset order on the three-element set 1, 2, 3: objects are all subsets, and an arrow A -> B exists exactly when A is a subset of B. How many morphisms does this category have?"
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: list the eight subsets of 1, 2, 3. Step 2: for each subset B, the number of A with A a subset of B is 2 to the power of the size of B. Step 3: sum over the sizes: 1 + 3 times 2 + 3 times 4 + 8 = 27. The number of morphisms is 27."
          - problem: "The objects of a divisibility category are the divisors of 20, and an arrow a -> b exists exactly when gcd(a, b) = a. Identity arrows come from reflexivity, and each hom-set has at most one arrow. How many identity arrows does this category have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the objects are the divisors of 20, namely 1, 2, 4, 5, 10, 20, and the arrow rule is that an arrow a -> b exists exactly when gcd(a, b) = a. Step 2: identities come from reflexivity: the arrow a -> a exists because gcd(a, a) = a, and each object has exactly one identity arrow because the category is thin. Step 3: run the gcd test over the object list: it holds for all 6 objects, one identity each. The number of identity arrows is 6."
          - problem: "In the subset-order category on all subsets of the set 1, 2, 3, an arrow A -> B exists exactly when A is a subset of B. How many arrows start at the subset that contains only the element 1?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the objects are the eight subsets of the set 1, 2, 3, and the arrow rule is that an arrow A -> B exists exactly when A is a subset of B. Step 2: arrows from the subset containing only 1 go exactly to the supersets that contain 1. Step 3: enumerate those supersets: the subset with 1 alone, the subsets with 1 and 2, with 1 and 3, and with 1, 2 and 3, so 4 arrows. The number of arrows that start at this subset is 4."
          - problem: "In the divisibility category on the divisors of 12, an arrow a -> b exists exactly when gcd(a, b) = a. How many arrows arrive at the object 4?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the objects are the divisors of 12, namely 1, 2, 3, 4, 6, 12, and the arrow rule is that an arrow a -> b exists exactly when gcd(a, b) = a. Step 2: test each object a against the target 4 with the gcd rule: gcd(1, 4) = 1, gcd(2, 4) = 2, gcd(3, 4) = 1, gcd(4, 4) = 4, gcd(6, 4) = 2, gcd(12, 4) = 4. Step 3: the gcd equals a only for a = 1, a = 2 and a = 4, so 3 arrows arrive. The number of arrows that arrive at the object 4 is 3."
          - problem: "Write the full proof: for any preorder (P, <=), regard it as a thin category with one arrow x -> y exactly when x <= y. Prove that composition is associative and that identity arrows satisfy the unit laws, and explain why every diagram in this category commutes. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: define the category. Objects are elements of P. For each x, y in P, put exactly one arrow x -> y when x <= y, and no arrow otherwise. Step 2: identities exist because x <= x by reflexivity, giving 1_x: x -> x. Step 3: composites exist because if x <= y and y <= z, then x <= z by transitivity, giving g composed with f: x -> z. Step 4: associativity holds. Any hom-set Hom(x,y) has at most one element by construction, so the two parallel composites (h composed with g) composed with f and h composed with (g composed with f) from x to w are equal. Step 5: unit laws hold. The arrows 1_y composed with f, f, and f composed with 1_x all lie in Hom(x,y), which has at most one element, so they are equal. Step 6: every diagram commutes for the same reason: any two parallel paths in a thin category have the same source and target, hence lie in one hom-set with at most one arrow, so the composites are equal. This proves that every preorder is a thin category and all its diagrams commute."
    diagnostic_exemplar:
      problem: "Take as objects all integers, with a single arrow $m\\to n$ whenever $|n-m|\\le 1$ (and no other arrows). Is this a category? Check the axioms and name the one that fails, if any."
      answer: "Not a category. Identities exist since $|m-m|=0\\le 1$, but composition is not total: there are arrows $0\\to 1$ and $1\\to 2$, yet no arrow $0\\to 2$ since $|2-0|=2>1$, so the composite of two arrows need not exist."
      solution_sketch: "Identities are fine, since $|m-m|=0\\le 1$, so hunt for an axiom that can fail: look for a composable pair whose composite arrow is missing. The pair $0\\to 1$ and $1\\to 2$ with no arrow $0\\to 2$ breaks totality of composition."
    anki_seeds:
      - front: "In a category, each ordered pair of objects $(A,B)$ has a set of what?"
        back: "morphisms (arrows) $A\\to B$."
        type: basic
      - front: "In a category, what distinguished morphism does every object $A$ carry?"
        back: "an identity $1_A\\colon A\\to A$."
        type: basic
      - front: "What operation combines $f\\colon A\\to B$ and $g\\colon B\\to C$ into a morphism $A\\to C$?"
        back: "composition, giving $g\\circ f$."
        type: basic
      - front: "State the associativity axiom for composition in a category."
        back: "$(h\\circ g)\\circ f = h\\circ(g\\circ f)$."
        type: basic
      - front: "State the unit law for composition with identities (for $f\\colon A\\to B$)."
        back: "$1_B\\circ f = f = f\\circ 1_A$."
        type: basic
      - front: "A monoid is exactly a category with {{c1::one object}}."
        back: "one object"
        type: cloze

  - id: poset-monoid-categories
    name: Categories from Posets and Monoids
    core: true
    difficulty: 0.58
    drill: false
