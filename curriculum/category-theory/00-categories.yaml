        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Concrete categories of structured sets
        key_prerequisites: [category-definition]
        step_check:
          step: 'So $\mathrm{id}_X$ is continuous, hence a legal morphism'
          question: 'Why is the identity map $\mathrm{id}_X$ a legal morphism of $\mathbf{Top}$?'
          options:
            - 'Every bijection is continuous, and $\mathrm{id}_X$ is a bijection'
            - 'Each open $U$ has preimage $U$ itself, which is open in $X$'
            - 'The space $X$ has only finitely many open sets to test'
            - 'It sends every point to a different point of $X$'
          answer: 'Each open $U$ has preimage $U$ itself, which is open in $X$'
          why: 'A morphism of Top must have open preimages of open sets; for the identity the preimage of $U$ is $U$, so the test always passes. A bijection can fail continuity.'
        constraints: 'Concrete categories of structured sets (Mon, Grp, Poset, Top, Vect, Set) with small finite objects or explicit rules; each item tests that a function preserves the structure, or counts or evaluates morphisms of the category. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'Let $\mathbb{Z}/4$ be the integers modulo $4$ under addition. In $\mathbf{Mon}$ a morphism is a function $f$ with $f(0)=0$ and $f(a+b)=f(a)+f(b)$ for all $a$ and $b$. Three functions from $\mathbb{Z}/4$ to itself, numbered $1$, $2$ and $3$, have values $(f(0),f(1),f(2),f(3))$ equal to $(0,2,0,2)$, $(0,1,1,3)$ and $(0,3,2,1)$ in turn. Which of them are morphisms of $\mathbf{Mon}$?'
            answer: '1, 3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Function 2 fails because f(1+1)=f(2)=1 but f(1)+f(1)=2, so it does not preserve the sum. Functions 1 and 3 keep f(0)=0 and satisfy f(a+b)=f(a)+f(b) for all sums, as a check of every pair shows. So the morphisms are the functions numbered 1 and 3.'
          - problem: 'In $\mathbf{Grp}$ the objects are groups and the morphisms are group homomorphisms. How many morphisms are there from $\mathbb{Z}/12$ to $\mathbb{Z}/8$, both under addition?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A homomorphism from Z/12 is fixed by the image a of 1, and it exists exactly when 12a is 0 modulo 8. This holds for a=0, 2, 4, 6, so a count of these choices gives 4 morphisms.'
          - problem: 'In $\mathbf{Poset}$ the morphisms are monotone maps: if $x\le y$ then $h(x)\le h(y)$. The diamond $D$ has elements $0,1,2,3$ with $0<1<3$ and $0<2<3$. A morphism $h$ from $D$ to the chain $0<1<2$ has $h(0)=0$, $h(1)=2$ and $h(2)=1$. What is $h(3)$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Because 1 is below 3 and 2 is below 3, monotonicity needs h(3) to be at least h(1)=2 and at least h(2)=1. The chain has no element above 2, so h(3)=2 is forced.'
          - problem: 'In $\mathbf{Poset}$ the morphisms are monotone maps. The diamond $D$ has elements $0,1,2,3$ with $0<1<3$ and $0<2<3$. How many morphisms are there from $D$ to the chain $0<1$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'List the values (h(0), h(1), h(2), h(3)) that never decrease along the order. With h(0)=0 there are 5 choices and with h(0)=1 only the constant map remains, which gives 6 morphisms.'
          - problem: 'Let $X=\{0,1\}$ carry the discrete topology, where every subset is open, and let $Y=\{0,1\}$ carry the indiscrete topology, where only $\varnothing$ and $Y$ are open. Is the identity function from $Y$ to $X$ a morphism of $\mathbf{Top}$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it is", "yes it is", "it is a morphism", "continuous"], ["no", "it is not", "no it is not", "not a morphism", "not continuous"]]}
            solution_sketch: 'A morphism of Top must pull open sets back to open sets. The set {0} is open in X, but its preimage under the identity is {0}, which is not open in Y, so the identity is not continuous from Y to X.'
          - problem: 'In $\mathbf{Vect}_{\mathbb{Q}}$ the morphisms are linear maps. A morphism $T\colon\mathbb{Q}^2\to\mathbb{Q}^2$ has $T(1,0)=(1,2)$ and $T(0,1)=(3,4)$. Find $T(2,1)$.'
            answer: '(5, 8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A linear map satisfies T(2,1)=2T(1,0)+T(0,1), because it preserves sums and scalar multiples. This equals 2(1,2)+(3,4), which is (5,8).'
          - problem: 'Sam says that $f(n)=n+1$ defines a morphism of $\mathbf{Mon}$ from $(\mathbb{Z},+)$ to $(\mathbb{Z},+)$, because $f$ adds the same amount to every input. For $a=2$ and $b=3$, what is $f(a+b)-\big(f(a)+f(b)\big)$?'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here f(5)=6 while f(2)+f(3)=3+4=7, so the difference is -1. A morphism of Mon needs this difference to be 0, so f is not a morphism; it also fails f(0)=0.'
          - problem: 'Three students each join exactly one of two clubs. Each way of choosing is a function from the set of students to the set of clubs, that is, a morphism of $\mathbf{Set}$. How many different ways are there?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the 3 students has 2 choices, and the choices are independent. So there are 2 times 2 times 2, which is 8 morphisms.'
          - problem: 'Two clubs each take over exactly one of three rooms. Each way of choosing is a function from the set of clubs to the set of rooms, that is, a morphism of $\mathbf{Set}$. How many different ways are there?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the 2 clubs has 3 choices of room, and the choices are independent. So there are 3 times 3, which is 9 morphisms; the exponent is the size of the source, not of the target.'
          - problem: 'Write the full proof that in $\mathbf{Mon}$ the identity map of any monoid is a morphism, and that the composite of two morphisms of $\mathbf{Mon}$ is a morphism.'
            answer: 'Identities and composites are in Mon'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The identity map id_M sends x to x, so id_M(xy)=xy=id_M(x)id_M(y) and id_M(e)=e. For morphisms f and g, (g after f)(xy)=g(f(x)f(y))=g(f(x))g(f(y)) and (g after f)(e)=g(e)=e. So the identity and every composite keep the product and the unit, and are morphisms of Mon.'
      - id: kp2
        name: Small categories from data (monoids, groups, posets)
        key_prerequisites: [groups-intro]
        step_check:
          step: 'Composition: $v \circ u = w$'
          question: 'Why is $w$ the only possible value of $v\circ u$ in this category?'
          options:
            - 'Composition always returns the identity of the middle object'
            - 'The composite always picks the largest arrow in the whole poset'
            - 'A poset has one arrow $0\to 2$ at most, and $w$ is that arrow'
            - 'The arrows $u$ and $v$ must be equal before they can compose'
          answer: 'A poset has one arrow $0\to 2$ at most, and $w$ is that arrow'
          why: 'In a poset category the composite of $0\to 1$ and $1\to 2$ is an arrow $0\to 2$, and there is exactly one such arrow, so no other value is possible.'
        constraints: 'Small categories presented by explicit data: a group or monoid as a one-object category, a poset or divisibility order with at most 8 objects, or a finite category given by a list of morphisms and a few composition rules; every claim is checked directly against the category axioms. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'Let $G=\mathbb{Z}/3$ be the integers modulo $3$ under addition, viewed as the category $BG$ with one object whose morphisms are the elements of $G$. How many morphisms does $BG$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The category BG has one object and one morphism for each element of G. The group Z/3 has the elements 0, 1, 2, so BG has 3 morphisms.'
          - problem: 'The divisibility order on $\{1,2,3,6\}$ is viewed as a category with one morphism from $a$ to $b$ exactly when $a$ divides $b$. How many morphisms does this category have?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each object divides itself, which gives 4 identity morphisms. The pairs 1 to 2, 1 to 3, 1 to 6, 2 to 6 and 3 to 6 give 5 more, and there are no other divisibilities, so the total is 9.'
          - problem: 'On a clock face with $12$ hours, a move such as "advance $k$ hours" is a morphism of a one-object category, and composing two moves means doing one after the other. The move "advance $9$ hours" is followed by "advance $7$ hours". By how many hours does the composite move advance?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Composition in this category is addition modulo 12. Doing 9 hours and then 7 hours gives 16 hours, and 16 is 4 modulo 12, so the composite advances by 4 hours.'
          - problem: 'A category has objects $A$ and $B$ and five morphisms: $1_A\colon A\to A$, $1_B\colon B\to B$, $f\colon A\to B$, $g\colon A\to B$ and $e\colon B\to B$. Apart from the identity laws, composition satisfies $e\circ f=g$, $e\circ g=g$ and $e\circ e=e$. Which morphism is $e\circ(e\circ f)$?'
            answer: 'g'
            answer_contract: {"kind": "label", "options": [["f"], ["g"], ["e"], ["1_B", "1B"]]}
            solution_sketch: 'First e after f is g, by the first rule. Then e after g is g again, by the second rule, so the composite e after (e after f) is g; it goes from A to B, so e and 1_B are impossible.'
          - problem: 'The subsets of $\{x,y,z\}$ form a poset under inclusion, and the poset is viewed as a category with one morphism from $S$ to $T$ exactly when $S\subseteq T$. How many morphisms does this category have?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each element of the 3-element set is in none of the pair S, T, in T only, or in both, so it has 3 independent states. That gives 3 times 3 times 3, which is 27 pairs S contained in T and so 27 morphisms.'
          - problem: 'One object $*$ has three morphisms $e$, $a$, $b$, where $e$ is the identity. The other composites are $a\circ a=e$, $a\circ b=a$, $b\circ a=b$ and $b\circ b=a$. Sam checks that every composite is again $e$, $a$ or $b$ and concludes that this is a category. Is Sam right?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "Sam is right", "right", "correct", "it is a category"], ["no", "Sam is not right", "not right", "wrong", "Sam is wrong", "it is not a category", "not a category"]]}
            solution_sketch: 'Closure is not enough, because composition must also be associative. Here (b after b) after a is a after a, which is e, but b after (b after a) is b after b, which is a, so associativity fails.'
          - problem: 'Let $M=\{0,1,2,3,4,5\}$ with multiplication modulo $6$, viewed as a category with one object whose morphisms are the elements of $M$, composition being the product and the identity being $1$. How many of its morphisms are isomorphisms?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism x is an isomorphism when some y has xy equal to 1 modulo 6. This holds for 1 and 5, because 5 times 5 is 25, which is 1 modulo 6, and it fails for 0, 2, 3, 4, so there are 2.'
          - problem: 'Let $M$ be the integers modulo $6$ under addition, viewed as a category $BM$ with one object. The morphism $2$ is followed by the morphism $4$. Which morphism is the composite?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In BM composition is addition modulo 6. So 2 followed by 4 gives 6, which is 0 modulo 6, and the composite is the identity morphism 0.'
          - problem: 'Write the full proof that every monoid $M$ gives a category $BM$ with one object, whose morphisms are the elements of $M$ and whose composition is the product of $M$.'
            answer: 'Each monoid M gives a category BM'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Take one object, let Hom be M, let the identity be the unit e and let composition be the product of M. The identity laws of the category are the identity laws em=m=me of the monoid. Associativity of composition is associativity (pn)m=p(nm) of the product, so all category axioms hold.'
      - id: kp3
        name: Categories built from other categories
        key_prerequisites: [category-definition]
        step_check:
          step: '$f\circ 1_A = f = 1_B\circ f$'
          question: 'Why is the pair $(1_A,1_B)$ a morphism from $f$ to $f$ in the arrow category?'
          options:
            - 'Both routes equal $f$, by the identity laws of $\mathcal{C}$'
            - 'Its two components are the same arrow, so the square collapses'
            - 'Every pair of morphisms of $\mathcal{C}$ gives a commuting square'
            - 'The arrow $f$ is itself an identity morphism of $\mathcal{C}$'
          answer: 'Both routes equal $f$, by the identity laws of $\mathcal{C}$'
          why: 'A morphism of the arrow category must make the square commute; for the pair of identities the two routes are $f\circ 1_A$ and $1_B\circ f$, and both equal $f$.'
        constraints: 'Categories built from other categories (product, arrow category) where the factors are small posets, a divisibility order, or explicit maps in Set; every question is settled by the componentwise definition or the commuting-square condition. Preserve exactly one full-proof exemplar.'
        exemplars:
          - problem: 'Let $\mathbf{2}$ be the poset category with objects $0$ and $1$ and exactly one morphism $0\to1$ besides the two identities, so it has $3$ morphisms. The product category $\mathbf{2}\times\mathbf{2}$ has the pairs of objects as objects and the pairs of morphisms as morphisms. How many morphisms does $\mathbf{2}\times\mathbf{2}$ have?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism of the product is a pair of morphisms, one from each factor. There are 3 choices for the first and 3 for the second, so 3 times 3 gives 9 morphisms.'
          - problem: 'A machine has a dial with positions $0,1,2$ and a switch that is off or on. A state is a pair (dial position, switch). A change from one state to another is allowed when it keeps or raises the dial and keeps or raises the switch (off to on). The states are the objects of a category with one morphism for each allowed change. How many morphisms does it have?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The category is the product of the chain on the 3 dial positions, which has 6 morphisms, and the chain off to on, which has 3. The count of morphisms multiplies, so 6 times 3 gives 18.'
          - problem: 'Let $D$ be the divisibility order on $\{1,2,3,6\}$ and let $C$ be the chain $0<1$, both viewed as categories with one morphism $a\to b$ when $a$ is below $b$. In the product category $D\times C$, is there a morphism from $(3,1)$ to $(6,0)$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "there is", "yes there is", "a morphism exists"], ["no", "there is not", "no there is not", "none", "no morphism"]]}
            solution_sketch: 'A morphism of the product needs a morphism in each coordinate. In D there is one from 3 to 6, because 3 divides 6, but in C there is none from 1 to 0, so there is no morphism.'
          - problem: 'Two finite categories $P$ and $Q$ have a product category $P\times Q$ with $18$ morphisms, namely the pairs $(m,n)$ with $m$ in $P$ and $n$ in $Q$. The category $P$ has $6$ morphisms. How many morphisms does $Q$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The number of pairs is the number of morphisms of P times the number of morphisms of Q, so 6 times the unknown count is 18. Dividing 18 by 6 gives 3 morphisms of Q.'
          - problem: 'In the arrow category of $\mathbf{Set}$ let $f\colon X\to Z$ and $m\colon Y\to Z$ be objects, with $X=\{0,1,2\}$, $Y=\{0,1\}$, $Z=\{0,1\}$, $f(0)=1$, $f(1)=0$, $f(2)=1$, $m(0)=1$ and $m(1)=0$. A morphism from $f$ to $m$ is a pair $(u,v)$ with $u\colon X\to Y$, $v\colon Z\to Z$ and $m\circ u=v\circ f$. Suppose $v$ is the identity of $Z$. Find $u(0)$, $u(1)$ and $u(2)$.'
            answer: '0, 1, 0'
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: 'With v the identity, the square condition says m(u(x)) = f(x) for every x. Since m(0)=1 and m(1)=0, we need u(0)=0 because f(0)=1, u(1)=1 because f(1)=0, and u(2)=0 because f(2)=1.'
          - problem: 'Let $P$ be the poset category of the chain $a\le b\le c$, with one arrow from $x$ to $y$ whenever $x\le y$. In the arrow category of $P$, a morphism from the object $f\colon x\to y$ to the object $f''\colon x''\to y''$ is a pair of arrows $u\colon x\to x''$ and $v\colon y\to y''$ making the square commute. How many morphisms does the arrow category of $P$ have?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The objects are the 6 arrows of P, and in a poset every square commutes when u and v exist. Counting targets from each object gives 6, 5, 3, 3, 2 and 1, and these add up to 20 morphisms.'
          - problem: 'Sam says the arrow category of the chain $a\le b\le c$ has $3$ objects, one for each element of the chain. How many objects does it have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An object of the arrow category is an arrow of the chain, not an element. The chain has the arrows aa, ab, ac, bb, bc and cc, so there are 6 objects.'
          - problem: 'Write the full proof that for every category $\mathcal{C}$ the arrow category $\mathcal{C}^{\to}$ is a category. Its objects are the arrows of $\mathcal{C}$, its morphisms are the commuting squares, and composition and identities are taken componentwise.'
            answer: 'The arrow category is a category'
            answer_contract: {"kind": "none"}
            solution_sketch: 'A morphism from f to f'' is a pair (a,b) with b f = f'' a. The pair (1_A,1_B) is an identity because f 1_A = f = 1_B f. The composite of two pairs is the pair of composites, and its square commutes by pasting; associativity and the identity laws hold in each component because they hold in C.'
    diagnostic_exemplar:
      problem: "In the arrow category $\\mathcal{C}^{\\to}$, a morphism from $f\\colon A\\to B$ to $f'\\colon A'\\to B'$ is a pair $(a\\colon A\\to A',\\,b\\colon B\\to B')$ with $f'\\circ a=b\\circ f$. Prove that the componentwise composite of two such morphisms is again a morphism of $\\mathcal{C}^{\\to}$."
      answer: "Given $(a,b)\\colon f\\to f'$ and $(a',b')\\colon f'\\to f''$, compute $f''\\circ(a'\\circ a)=(f''\\circ a')\\circ a=(b'\\circ f')\\circ a=b'\\circ(f'\\circ a)=b'\\circ(b\\circ f)=(b'\\circ b)\\circ f$, using associativity and the two given squares. So $(a'\\circ a,\\,b'\\circ b)$ makes the outer square commute and is a morphism $f\\to f''$."
      solution_sketch: "Paste the two commuting squares: start from $f''\\circ(a'\\circ a)$ and push $f''$ across the second square, then across the first, until it emerges as $(b'\\circ b)\\circ f$. Only associativity and the two given squares are used."
