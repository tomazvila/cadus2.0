          - problem: "Recover the preorder relation from the generated thin category. Objects are [0, 1, 2]; initially specified arrows are [(0, 1), (1, 2)]. Add only what identities and composition force, keeping at most one arrow between each ordered pair. For the ordered pairs [(2, 2), (0, 2), (2, 1)], give 1 if the completed thin category has that arrow and 0 otherwise."
