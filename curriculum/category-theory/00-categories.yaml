          - problem: "Write the full proof: In Set, a map m: A -> B is a monomorphism if and only if m is injective. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: state the definition. A map m: A -> B is left-cancellable if for all maps f,g: C -> A, m∘f=m∘g implies f=g. Step 2: assume m is injective. Let f,g: C -> A satisfy m∘f=m∘g. For every c in C, m(f(c))=m(g(c)), so injectivity gives f(c)=g(c); hence f=g. Step 3: assume m is left-cancellable. Take a,a' in A with m(a)=m(a'). Let f,g: {*} -> A be f(*)=a and g(*)=a'. Then m∘f=m∘g, so cancellation gives f=g and therefore a=a'. Thus m is injective. Therefore in Set, monomorphisms are exactly the injective maps."
      - id: kp2
        name: Epimorphisms as right-cancellable maps
        key_prerequisites: [functions-injective-surjective]
        constraints: "Require epimorphisms as right-cancellable maps. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Exhibit the right-cancellation failure of this proposed epi. Take s:{0,...,3}->{0,...,3} with values [0, 0, 1, 1]. Among distinct maps u,v:{0,...,3}->{0,1} satisfying u after s=v after s, choose the lexicographically least concatenation of the value lists of u and v. Give that concatenation."
            answer: "0, 0, 0, 0, 0, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Two distinct arrows become equal after precomposition with s. Their values differ outside the image, proving failure of the epi condition. The resulting answer is 0, 0, 0, 0, 0, 0, 0, 1."
          - problem: "Construct a pair of arrows that the given map fails to right-cancel. Take s:{0,...,2}->{0,...,3} with values [1, 2, 1]. Among distinct maps u,v:{0,...,3}->{0,1} satisfying u after s=v after s, choose the lexicographically least concatenation of the value lists of u and v. Give that concatenation."
            answer: "0, 0, 0, 0, 0, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Two distinct arrows become equal after precomposition with s. Their values differ outside the image, proving failure of the epi condition. The resulting answer is 0, 0, 0, 0, 0, 0, 0, 1."
          - problem: "In Set, which function s from {1,2,3} to {a,b,c} is an epimorphism?"
            answer: "s(1)=a, s(2)=b, s(3)=c"
            answer_contract: {"kind": "label", "options": [["s(1)=a, s(2)=b, s(3)=c"], ["s(1)=a, s(2)=a, s(3)=c"], ["s(1)=a, s(2)=b, s(3)=b"], ["s(1)=c, s(2)=c, s(3)=c"]]}
            solution_sketch: "In Set, a function is an epimorphism exactly when it is surjective. The option s(1)=a, s(2)=b, s(3)=c hits all of a, b, and c, so it is surjective and hence epi. The option s(1)=a, s(2)=a, s(3)=c misses b. The option s(1)=a, s(2)=b, s(3)=b misses c. The option s(1)=c, s(2)=c, s(3)=c misses a and b. The answer is s(1)=a, s(2)=b, s(3)=c."
          - problem: "First decide why e:A->B with values[0, 1, 1, 2], B={0,1,2}, is right-cancellable. Compare with eprime:A->{0,1,2,3} having values[1, 2, 2, 3]. Construct the lexicographically least pair of distinct binary-valued maps d,h on the larger codomain such that deprime=heprime. Return the concatenation of their value lists. The witness must exhibit the right-cancellation failure."
            answer: "0, 0, 0, 0, 1, 0, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The original e reaches every codomain element. The new map leaves an element unhit, permitting distinct arrows that become equal after precomposition; the witness pinpoints failure of epicity. The resulting answer is 0, 0, 0, 0, 1, 0, 0, 0."
          - problem: "Let e:A->B and f:B->C both be epimorphisms. Prove their composite is epic by starting with d f e=h f e for arbitrary d,h:C->D. Cancel one epic arrow at a time. Encode d=1,h=2,f=3,e=4; give both sides after the first cancellation, then both sides after the second, as one list of arrow codes in conventional composition order. No cancellation equation is supplied."
            answer: "1, 3, 2, 3, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Epicity of e cancels the common right factor and gives df=hf. Epicity of f then gives d=h, which is exactly the right-cancellation condition for fe. The resulting answer is 1, 3, 2, 3, 1, 2."
          - problem: "First decide why e:A->B with values[1, 0, 2, 1], B={0,1,2}, is right-cancellable. Compare with eprime:A->{0,1,2,3} having values[2, 0, 3, 2]. Construct the lexicographically least pair of distinct binary-valued maps d,h on the larger codomain such that deprime=heprime. Return the concatenation of their value lists. The witness must exhibit the right-cancellation failure."
            answer: "0, 0, 0, 0, 0, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The original e reaches every codomain element. The new map leaves an element unhit, permitting distinct arrows that become equal after precomposition; the witness pinpoints failure of epicity. The resulting answer is 0, 0, 0, 0, 0, 1, 0, 0."
          - problem: "Write the full proof: in Ring, the inclusion of Z into Q is an epimorphism but not surjective. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Let i: Z -> Q be the inclusion. To show i is an epimorphism, let f,g: Q -> R be ring maps with f composed with i equal to g composed with i. Step 2: Then f(n)=g(n) for every integer n, so f and g agree on the image of i. Step 3: For any m/n in Q with n nonzero, f(m/n)=f(m)f(n)^(-1). Since f(m)=g(m) and f(n)=g(n), this equals g(m)g(n)^(-1)=g(m/n). Step 4: Thus f=g, so i is right-cancellable and hence epi. Step 5: The map i is not surjective because 1/2 is not an integer. Therefore the inclusion Z -> Q is an epimorphism but not a surjection, so epi does not imply surjective in Ring."
