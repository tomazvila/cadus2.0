topics:
  - id: composition-associativity-identity
    name: Composition, Associativity, and Identities
    core: true
    difficulty: 0.52
    drill: false
    answer_kind: proof
    expected_time_secs: 120
    prerequisites:
      - id: function-composition-inverse
        weight: 0.5
        key: true
      - id: computing-compositions
        weight: 0.3
      - id: function-composition
        weight: 0.3
      - id: binary-operations
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: When composites are defined; computing them
        key_prerequisites: [computing-compositions]
        step_check:
          step: 'Apply $g$ to the result: $g(3x - 2) = (3x - 2)^3$'
          question: 'Why is $3x-2$ put into $g$ when we compute $(g \circ f)(x)$?'
          options:
            - 'The composite always writes the left function inside the right function, whatever acts first'
            - 'In $g \circ f$ the function $f$ acts first, so its output is the input of $g$'
            - 'In $g \circ f$ the function $g$ acts first, so its output is the input of $f$, giving $f(g(x))$'
            - 'The input $x$ is replaced by $g(x)$ before $f$ is applied to the result, giving $f(g(x))$'
          answer: 'In $g \circ f$ the function $f$ acts first, so its output is the input of $g$'
          why: '$(g \circ f)(x)$ means $g(f(x))$, so $f$ acts on $x$ first and its value $3x-2$ is the input of $g$, which gives $(3x-2)^3$.'
        exemplars:
          - problem: 'Let $f(x)=2x+1$ and $g(x)=x^2$ on $\mathbb Z$. Find $(g \circ f)(x)$.'
            answer: '4x^2+4x+1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $g \circ f$ applies $f$ first and then $g$. So $(g \circ f)(x)=g(2x+1)=(2x+1)^2=4x^2+4x+1$.'
          - problem: 'Let $f\colon \{1,2,3\}\to\{4,5\}$ and $g\colon \{4,5\}\to\{6,7\}$ be the functions with $f(1)=4$, $f(2)=5$, $f(3)=4$ and $g(4)=6$, $g(5)=7$. Find $(g \circ f)(3)$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The codomain of $f$ is the domain of $g$, so $g \circ f$ is defined. Then $(g \circ f)(3)=g(f(3))=g(4)=6$.'
          - problem: 'Let $f\colon X\to Y$ and $g\colon Y\to Z$ be functions, where $X$, $Y$ and $Z$ are three different sets. Which of the composites $g \circ f$ and $f \circ g$ is defined?'
            answer: 'g∘f'
            answer_contract: {"kind": "label", "options": [["g∘f", "gf", "g f", "g after f", "g composed with f", "g o f", "g◦f"], ["f∘g", "fg", "f g", "f after g", "f composed with g", "f o g", "f◦g"], ["both", "both are defined"], ["neither", "neither is defined", "none"]]}
            solution_sketch: 'A composite $v \circ u$ needs the codomain of $u$ to equal the domain of $v$. The codomain of $f$ is $Y$, which is the domain of $g$, so $g \circ f$ is defined. The codomain of $g$ is $Z$, which differs from the domain $X$ of $f$, so $f \circ g$ is not defined.'
          - problem: 'A pump delivers $f(t)=60t$ litres of water in $t$ minutes. A bucket holds $15$ litres, so $g(v)=v/15$ is the number of buckets that $v$ litres fill. Write the number of buckets filled after $t$ minutes as a function of $t$.'
            answer: '4t'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The volume is $f(t)=60t$ litres, and the number of buckets is that volume divided by $15$. So $(g \circ f)(t)=60t/15=4t$ buckets.'
          - problem: 'A taxi charges $g(k)=2.5k+3$ dollars for a trip of $k$ kilometres. A trip of $m$ miles is $f(m)=1.6m$ kilometres. Write the fare for a trip of $m$ miles as a function of $m$.'
            answer: '4m+3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First convert miles to kilometres with $f$, then price the kilometres with $g$. So the fare is $g(1.6m)=2.5(1.6m)+3=4m+3$ dollars.'
          - problem: 'Sam computes $(f \circ g)(4)$ for $f(x)=x+5$ and $g(x)=2x$ by applying $f$ first, and gets $18$. What is the correct value?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $f \circ g$ the function $g$ acts first, so $g(4)=8$. Then $f(8)=13$, while Sam found $g(f(4))=g(9)=18$, which is $(g \circ f)(4)$.'
          - problem: 'Let $f(x)=x^2$ and $g(x)=2x-1$ on $\mathbb Z$. Find $(g \circ f)(-3)$.'
            answer: '17'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Apply $f$ first: $f(-3)=9$. Then apply $g$: $g(9)=17$.'
          - problem: 'Let $f(x)=3x-2$ and $g(x)=x^3$ on $\mathbb Z$. Expand $(g \circ f)(x)$.'
            answer: '27x^3 - 54x^2 + 36x - 8'
            answer_contract: {"kind": "required_form", "form": "expanded_polynomial"}
            solution_sketch: 'We have $(g \circ f)(x)=g(3x-2)=(3x-2)^3$. Multiplying out gives $27x^3-54x^2+36x-8$.'
          - problem: 'Let $f(x)=1-x$ and $g(x)=x^2$ on $\mathbb Z$. Find the smallest integer $n \ge 1$ for which $(g \circ f)(n)$ and $(f \circ g)(n)$ are different.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $n=1$ both composites are $0$, so they agree. At $n=2$ we get $(g \circ f)(2)=(1-2)^2=1$ and $(f \circ g)(2)=1-4=-3$, so the first difference is at $n=2$.'
          - problem: 'Write the full proof that for functions $f\colon A\to B$ and $g\colon B\to C$ the composite $g \circ f\colon A\to C$ is a well-defined function.'
            answer: 'The composite g after f is a function A to C'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Take any $a$ in $A$. Then $f(a)$ is one element of $B$, and $g$ is defined on all of $B$, so $g(f(a))$ is one element of $C$. The rule $a \mapsto g(f(a))$ therefore gives exactly one value in $C$ for each $a$ in $A$, so it is a function from $A$ to $C$.'
        constraints: 'Composites are built from explicit rules or tables: affine, quadratic or cubic functions on the integers, small finite sets, and measured quantities passed through two conversions. The order of application and the composability condition (codomain of f equals domain of g) are tested, with contexts that need a division as well as a product.'
      - id: kp2
        name: Associativity of composition
        key_prerequisites: [function-composition]
        step_check:
          step: 'Both $(h \circ g) \circ f$ and $h \circ (g \circ f)$ yield the same result, $2x + 2$'
          question: 'Why do the two bracketings give the same function?'
          options:
            - 'Composition of functions is commutative, so the order of $f$, $g$, $h$ does not matter'
            - 'Both bracketings use the same three functions, so the formulas must agree by definition'
            - 'Both apply $f$, then $g$, then $h$ to each $x$; the brackets only group the work'
            - 'Brackets decide which function is applied first, and either choice gives $2x+2$ by luck'
          answer: 'Both apply $f$, then $g$, then $h$ to each $x$; the brackets only group the work'
          why: 'Both bracketings apply $f$, then $g$, then $h$ to each $x$, so each gives $h(g(f(x)))=2x+2$; the brackets only group the work, while swapping the order of the functions would give a different function.'
        exemplars:
          - problem: 'Let $f(x)=2x$, $g(x)=x-1$ and $h(x)=x+3$ on $\mathbb Z$. Find $(h \circ g) \circ f$ as a function of $x$.'
            answer: '2x+2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $(h \circ g)(x)=h(x-1)=x+2$. Then $((h \circ g) \circ f)(x)=(h \circ g)(2x)=2x+2$, and the other bracketing gives the same function.'
          - problem: 'Let $f\colon\{1,2,3\}\to\{x,y\}$ with $f(1)=x$, $f(2)=y$, $f(3)=x$, let $g\colon\{x,y\}\to\{p,q,r\}$ with $g(x)=q$, $g(y)=r$, and let $h\colon\{p,q,r\}\to\{3,5,7\}$ with $h(p)=3$, $h(q)=5$, $h(r)=7$. Find $((h \circ g) \circ f)(2)$.'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $f(2)=y$, then $g(y)=r$, then $h(r)=7$. By associativity the bracketing does not matter, so $((h \circ g) \circ f)(2)=7$.'
          - problem: 'A bakery bakes $f(t)=48t$ rolls in $t$ hours. The rolls are packed in bags of $6$, so $g(r)=r/6$ is the number of bags for $r$ rolls. Each bag sells for $4$ dollars, so $h(b)=4b$ is the income from $b$ bags. Find the income after $t$ hours as a function of $t$.'
            answer: '32t'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The income is $h(g(f(t)))$. First $f(t)=48t$ rolls, then $48t/6=8t$ bags, then $4 \cdot 8t=32t$ dollars. Any bracketing of $h \circ g \circ f$ gives the same function, $32t$.'
          - problem: 'A one-object category has arrows $0$, $1$, $2$ and the composition $m \circ n=(2m+n) \bmod 3$. Is this composition associative?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is associative", "it is associative", "associative"], ["no", "no, it is not associative", "it is not associative", "not associative"]]}
            solution_sketch: 'Test $(1 \circ 1) \circ 1$ against $1 \circ (1 \circ 1)$. We get $1 \circ 1=0$, so $(1 \circ 1) \circ 1=0 \circ 1=1$, but $1 \circ (1 \circ 1)=1 \circ 0=2$. The two bracketings differ, so the composition is not associative.'
          - problem: 'In the same one-object category, with arrows $0,1,2$ and $m \circ n=(2m+n) \bmod 3$, find $1 \circ (1 \circ 1)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $1 \circ 1=(2+1) \bmod 3=0$. Then $1 \circ 0=(2+0) \bmod 3=2$. The other bracketing gives $1$, so associativity fails.'
          - problem: 'Mia computes $h \circ (g \circ f)$ for $f(x)=x+2$, $g(x)=3x$ and $h(x)=x-1$ as $h(f(g(x)))$ and gets $3x+1$. What is the correct function?'
            answer: '3x+5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $g \circ f$ the function $f$ acts first, so $(g \circ f)(x)=3(x+2)=3x+6$. Then $h(3x+6)=3x+5$. Mia applied $g$ before $f$, which is a different composite.'
          - problem: 'A shopper changes $d$ dollars to euros at $f(d)=0.9d$, then euros to yen at $g(e)=150e$, then converts yen to thousands of yen with $h(y)=y/1000$. Find the amount in thousands of yen as a function of $d$.'
            answer: '0.135d'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The amount is $h(g(f(d)))$. First $0.9d$ euros, then $150 \cdot 0.9d=135d$ yen, then $135d/1000=0.135d$ thousand yen.'
          - problem: 'Let $f(x)=2x$, $g(x)=x+5$ and $h(x)=3x$ on $\mathbb Z$. Both bracketings of $h \circ g \circ f$ are the linear function $ax+b$. Find $a+b$.'
            answer: '21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $(g \circ f)(x)=2x+5$, so $h \circ (g \circ f)$ is $x \mapsto 3(2x+5)=6x+15$. Hence $a=6$ and $b=15$, and $a+b=21$.'
          - problem: 'Write the full proof that composition of functions is associative: $(h \circ g) \circ f = h \circ (g \circ f)$ for functions $f\colon A\to B$, $g\colon B\to C$, $h\colon C\to D$.'
            answer: 'Composition of functions is associative'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Both sides are functions from $A$ to $D$, so it is enough to compare their values at an arbitrary $x$ in $A$. We have $((h \circ g) \circ f)(x)=(h \circ g)(f(x))=h(g(f(x)))$ and $(h \circ (g \circ f))(x)=h((g \circ f)(x))=h(g(f(x)))$. The values agree at every $x$, so the two functions are equal.'
        constraints: 'Associativity is used to compute composites of three maps from explicit rules or tables, to fix the bracketing in contexts of three stages (including divisions), and to test a proposed composition rule that fails the law. Each item has a gradable value, expression or verdict.'
      - id: kp3
        name: Identities as two-sided units
        key_prerequisites: [function-composition-inverse]
        step_check:
          step: '$1_Y(g(x)) = g(x)$ since $1_Y$ is the identity function on $Y$'
          question: 'Why does the left unit law use $1_Y$ and not $1_X$ for $g\colon X \to Y$?'
          options:
            - 'The identity must be written on the left, whatever its object is'
            - 'The arrow $1_X$ acts on elements of $X$, so it cannot be applied to $g(x)$ in $Y$'
            - 'Both $1_X$ and $1_Y$ are identities, so either one gives the same composite'
            - '$g(x)$ lies in $Y$, so the arrow applied after $g$ must have domain $Y$'
          answer: '$g(x)$ lies in $Y$, so the arrow applied after $g$ must have domain $Y$'
          why: 'The composite $1_Y \circ g$ applies $g$ first, so the value $g(x)$ in $Y$ is the input of the next arrow, which must start at $Y$; this is why the identity on $Y$ stands on the left and the identity on $X$ stands on the right.'
        exemplars:
          - problem: 'In a category, $A$, $B$ and $C$ are three different objects and $f\colon A\to B$ is an arrow. Which of the identity arrows $1_A$, $1_B$, $1_C$ satisfies $f \circ e=f$ when $e$ is that identity?'
            answer: '1_A'
            answer_contract: {"kind": "label", "options": [["1_A", "1A", "id_A", "the identity on A", "identity on A", "A"], ["1_B", "1B", "id_B", "the identity on B", "identity on B", "B"], ["1_C", "1C", "id_C", "the identity on C", "identity on C", "C"]]}
            solution_sketch: 'The composite $f \circ e$ is defined only if the codomain of $e$ is the domain $A$ of $f$, and then $e\colon A \to A$ is $1_A$. The unit law says $f \circ 1_A=f$.'
          - problem: 'In Set, let $A=\{0,1,2\}$ and $B=\{0,1,2,3\}$, and let $f\colon A\to B$ be given by $f(0)=3$, $f(1)=1$, $f(2)=2$. Find $(f \circ 1_A)(0)$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity $1_A$ fixes every element of $A$, so $(f \circ 1_A)(0)=f(1_A(0))=f(0)=3$. In fact $f \circ 1_A=f$, as the right unit law says.'
          - problem: 'The one-object category $B\mathbb Z_5$ has arrows $0,1,2,3,4$, and the composite of $m$ and $n$ is $(m+n) \bmod 5$. Which arrow is the identity?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity $e$ must satisfy $e \circ n=n=n \circ e$ for every arrow $n$. For $e=0$ we get $(0+n) \bmod 5=n$, and no other $e$ works for $n=0$, so the identity is $0$.'
          - problem: 'The one-object category with arrows $0,1,\dots,7$ has the composite $m \circ n=(m \cdot n) \bmod 8$. Find every arrow $e$ with $e \circ n=n \circ e=n$ for all arrows $n$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Taking $n=1$ gives $e \cdot 1 \equiv 1 \pmod 8$, so $e=1$. This $e=1$ satisfies $1 \cdot n=n$ for every $n$, so $1$ is the only two-sided identity.'
          - problem: 'A one-object category has arrows $0$ and $1$, and the composite is $x \circ y=x$. How many arrows $e$ satisfy $y \circ e=y$ for every arrow $y$?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $y \circ e=y$ holds for both choices $e=0$ and $e=1$. So there are $2$ arrows that act as a right unit, but a two-sided identity also needs $e \circ y=y$, which is a stronger demand.'
          - problem: 'Ana writes $1_A \circ f=f$ for an arrow $f\colon A\to B$ with $A \neq B$. Which identity arrow should stand on the left of $f$?'
            answer: '1_B'
            answer_contract: {"kind": "label", "options": [["1_B", "1B", "id_B", "the identity on B", "identity on B", "B"], ["1_A", "1A", "id_A", "the identity on A", "identity on A", "A"]]}
            solution_sketch: 'The arrow applied after $f$ must start at the codomain $B$ of $f$, so it is $1_B$. The composite $1_A \circ f$ is not defined when $A \neq B$, so the correct law is $1_B \circ f=f$.'
          - problem: 'On a $12$-hour clock, the arrow $n$ means advance by $n$ hours, for $n=0,1,\dots,11$, and composition adds the hours and reduces modulo $12$. Which arrow $e$ has the property that $e$ followed by advance $7$ is advance $7$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We need $(7+e) \bmod 12=7$. This holds exactly for $e=0$, the arrow that advances by no hours. It is the identity of this one-object category.'
          - problem: 'The one-object category with arrows $0,1$ and the composite $x \circ y=x$ is given. How many arrows $e$ satisfy $e \circ y=y$ for every arrow $y$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For $y=1$ the equation $e \circ 1=1$ gives $e=1$, and for $y=0$ it gives $e=0$, which is a contradiction. So $0$ arrows satisfy the left unit law, and this category has no identity.'
          - problem: 'A currency exchange multiplies amounts by a rate. Composing the rate $0.9$ (dollars to euros) after the rate $e$ (dollars to dollars) gives the rate $0.9$. Find $e$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Composing multiplies the rates, so $0.9 \cdot e=0.9$. Dividing both sides by $0.9$ gives $e=1$, the identity rate.'
          - problem: 'Write the full proof that in a category, if $e_1$ and $e_2$ are two-sided units at an object $A$, then $e_1=e_2$.'
            answer: 'Two-sided units at one object are equal'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Since $e_2$ is a right unit, applying its law to the arrow $e_1\colon A\to A$ gives $e_1 \circ e_2=e_1$. Since $e_1$ is a left unit, applying its law to the arrow $e_2$ gives $e_1 \circ e_2=e_2$. Both expressions equal the same composite, so $e_1=e_2$.'
        constraints: 'Both unit laws are used with correctly typed identity arrows: which identity belongs on which side of an arrow, identities in Set, in one-object categories given by a rule or table, and in contexts of conversion rates and clock hours. Verdict items name their options in the question.'
    diagnostic_exemplar:
      problem: "For $f(x)=x+2$, $g(x)=3x$, and $h(x)=x-1$ on $\\mathbb Z$, compute $(h\\circ g)\\circ f$ and $h\\circ(g\\circ f)$ explicitly, and state which axiom guarantees the results agree."
      answer: "$(g\\circ f)(x)=3x+6$, so $h\\circ(g\\circ f)$ sends $x\\mapsto 3x+5$; $(h\\circ g)(x)=3x-1$, so $(h\\circ g)\\circ f$ sends $x\\mapsto 3(x+2)-1=3x+5$. Both bracketings give $x\\mapsto 3x+5$, as the associativity axiom guarantees."
      solution_sketch: "Build the two inner composites $g\\circ f$ and $h\\circ g$ first, then bracket each way; both routes land on $x\\mapsto 3x+5$. Associativity is the axiom that makes the agreement automatic rather than a coincidence of these three particular formulas."
    anki_seeds:
      - front: "State the associativity axiom for composition in a category."
        back: "$(h\\circ g)\\circ f = h\\circ(g\\circ f)$."
        type: basic
      - front: "State the unit law for composition with identities (for $f\\colon A\\to B$)."
        back: "$1_B\\circ f = f = f\\circ 1_A$."
        type: basic
      - front: "When is the composite $g\\circ f$ of $f\\colon A\\to B$, $g\\colon C\\to D$ defined?"
        back: "exactly when $B=C$; then $g\\circ f\\colon A\\to D$."
        type: basic

  - id: category-definition
    name: The Definition of a Category
    core: true
    difficulty: 0.55
    drill: false
