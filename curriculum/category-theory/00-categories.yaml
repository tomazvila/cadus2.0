          - problem: "Construct a diagonal in this Set square: e:A->X has values [0, 1, 0]; u:A->Y has values [2, 1, 2]; m:Y->Z has values [0, 3, 9]; v:X->Z has values [9, 3]. All domains are zero-based sets of the displayed sizes. Find d:X->Y making both triangles commute, and verify its uniqueness by epi/mono cancellation. Give its complete value list."
            answer: "2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Surjectivity of e gives potential values from u; injectivity of m makes the values independent of the chosen preimage. Both triangle equations hold, and either cancellation proves uniqueness. The resulting answer is 2, 1."
          - problem: "Claim: In Set, if e is surjective, m is injective, and v(e(a)) = m(u(a)) for all a, then d(x)=u(a) for any a with e(a)=x is well defined. Step 1: Given x in X, choose a in A with e(a)=x using that e is epi. Step 2: Set d(x)=u(a). Step 3: If e(a)=e(a')=x, then m(u(a))=v(e(a))=v(e(a'))=m(u(a')), so u(a)=u(a') because m is epi. Step 4: Therefore d is well defined. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: e epi gives a representative a with e(a)=x. Step 2 is valid as the definition of d(x). Step 4 would follow once Step 3 is corrected. Step 3 is invalid: it uses m as if m were epi, but the hypothesis is that m is mono. From m(u(a))=m(u(a')) and m mono, left-cancellation gives u(a)=u(a'). The answer is Step 3."
          - problem: "In Set consider a commutative square with e:A->X surjective, m:Y->Z injective, u:A->Y, v:X->Z and mu=ve. Derive the unique diagonal d:X->Y without a supplied formula. For the concrete maps e=[0,1,0,2], u=[2,0,2,1], m=[5,8,3], v=[3,5,8], with zero-based domains, give the complete value list of d, then bits for de=u and md=v. Prove well-definedness using m and uniqueness using e."
            answer: "2, 0, 1, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Choose a preimage a of x under e and set d(x)=u(a); the square and injectivity of m make this independent of the choice. Surjectivity of e makes any competing diagonal agree on every x, and the displayed map satisfies both triangles. The resulting answer is 2, 0, 1, 1, 1."
          - problem: "Write the full proof: in Set, let e: A -> X be surjective, let m: Y -> B be injective, and suppose v(e(a)) = m(u(a)) for all a. Prove that the rule d(x)=u(a) for any a with e(a)=x gives a well-defined function d: X -> Y. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Proof. Given x in X, the epi property of e (surjectivity) gives at least one a in A with e(a)=x, so the rule can choose a value. Define d(x)=u(a) for such an a. To show well defined, suppose e(a)=e(a')=x. Then v(e(a))=v(e(a')) by equal arguments, and the square identity gives m(u(a))=v(e(a))=v(e(a'))=m(u(a')). Since m is mono (injective), left-cancellation yields u(a)=u(a'). Thus the value d(x) does not depend on the chosen a. The rule defines a function d: X -> Y, and the independence step uses the mono property of m."
      - id: kp3
        name: Subobjects as isomorphism classes of monomorphisms
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "Require subobjects as isomorphism classes of monomorphisms. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Let $m: \\{1,2\\} \\to \\{1,2,3,4\\}$ send $1$ to $1$ and $2$ to $2$, and let $m': \\{3,4\\} \\to \\{1,2,3,4\\}$ send $3$ to $1$ and $4$ to $2$; both are monomorphisms. In the step of the proof that mutual factorization forces an isomorphism, one counts the pairs $(t, t')$ with $m = m' \\circ t$ and $m' = m \\circ t'$. Give the number of such pairs."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the first equation elementwise: $m' \\circ t$ must send $1$ to $1$ and $2$ to $2$, so the values of $m'$ force $t(1)=3$ and $t(2)=4$; this fixes $t$, and it is unique because $m'$ is monic. Symmetrically, $m \\circ t'$ must send $3$ to $1$ and $4$ to $2$, so $t'(3)=1$ and $t'(4)=2$, again uniquely, and the two maps are mutually inverse by the uniqueness of comparison maps. The number of pairs $(t, t')$ is 1."
          - problem: "Two monomorphisms f:X->Z and m:Y->Z have value lists[5, 7]and[7, 2, 5]; X,Y are zero-based domains. Determine the order of their subobject classes. If [f]<=[m], construct its comparison X->Y from the subobject definition. Give its values; then append1 if these representatives define the same subobject and0otherwise."
            answer: "2, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Subobject order requires a factorization through the other monomorphism. A comparison is an isomorphism exactly when the two images coincide. The resulting answer is 2, 0, 0."
          - problem: "In Set/{0,1,2}, compare the subobjects represented by inclusions A={0,1},B={1,2},C={0,1,2}. Determine1/0 for [A]<=[B], [B]<=[C], [C]<=[A], and[A]=[B]. Establish each decision using existence or impossibility of the structure-preserving comparison map."
            answer: "0, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "An inclusion comparison must fix every element as seen in the common codomain. Such a map exists exactly for the two subsets in containment order. The resulting answer is 0, 1, 0, 0."
          - problem: "Two monomorphisms f:X->Z and m:Y->Z have value lists[9, 6]and[4, 6, 8, 9]; X,Y are zero-based domains. Determine the order of their subobject classes. If [f]<=[m], construct its comparison X->Y from the subobject definition. Give its values; then append1 if these representatives define the same subobject and0otherwise."
            answer: "3, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Subobject order requires a factorization through the other monomorphism. A comparison is an isomorphism exactly when the two images coincide. The resulting answer is 3, 1, 0."
          - problem: "Let m:{0,1}->{0,1,2} have values[2,0], and n:{a,b}->{0,1,2} have n(a)=0,n(b)=2. Construct the isomorphism of these subobject representatives. Encode a=0,b=1. Give the comparison from the domain of m to the domain of n, followed by its inverse. No other representative domains are being counted."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Equality of subobjects requires an isomorphism commuting with the two embeddings. Matching images determines the comparison and its inverse uniquely. The resulting answer is 1, 0, 1, 0."
          - problem: "Two monomorphisms f:X->Z and m:Y->Z have value lists[1, 8, 3]and[8, 3, 1]; X,Y are zero-based domains. Determine the order of their subobject classes. If [f]<=[m], construct its comparison X->Y from the subobject definition. Give its values; then append1 if these representatives define the same subobject and0otherwise."
            answer: "2, 0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Subobject order requires a factorization through the other monomorphism. A comparison is an isomorphism exactly when the two images coincide. The resulting answer is 2, 0, 1, 1."
          - problem: "Write the full proof: for monomorphisms $m: S \\to B$ and $m': S' \\to B$, the relation $m \\le m'$ defined by $m = m' \\circ t$ for some $t$ is reflexive and transitive, every comparison map is unique when it exists, and $m \\le m'$ together with $m' \\le m$ forces the comparison map $t$ to be an isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (reflexivity): for any monomorphism $m: S \\to B$, the identity $1_S$ satisfies $m = m \\circ 1_S$, so $m \\le m$. Step 2 (transitivity): if $m = m' \\circ t$ and $m' = m'' \\circ s$, then associativity gives $m = m'' \\circ (s \\circ t)$, so $m \\le m''$. Step 3 (uniqueness of comparison maps): if $m = m' \\circ t = m' \\circ \\tilde t$, then $m'$ is monic, so $t = \\tilde t$; hence each comparison map, when it exists, is unique. Step 4 (antisymmetry up to isomorphism): suppose $m = m' \\circ t$ and $m' = m \\circ t'$. Substituting the second equation into the first gives $m = m \\circ (t' \\circ t)$, and since $m$ is monic, $t' \\circ t = 1_S$. Symmetrically, $m' = m' \\circ (t \\circ t')$ gives $t \\circ t' = 1_{S'}$. Therefore $t$ is an isomorphism with inverse $t'$, and by Step 3 it is the unique map commuting with $m$ and $m'$. Conclusion: the factorization order is a preorder, and mutually factoring monomorphisms are isomorphic, which justifies defining a subobject of $B$ as an isomorphism class of monomorphisms into $B$, ordered by the induced partial order."
    diagnostic_exemplar:
      problem: "In $\\mathbf{Set}$, suppose $v\\circ e=m\\circ u$ with $e\\colon A\\to X$ surjective and $m\\colon Y\\to B$ injective. Construct a diagonal $d\\colon X\\to Y$ with $d\\circ e=u$ and $m\\circ d=v$, and prove it is the only one."
      answer: "For $x\\in X$ pick $a\\in A$ with $e(a)=x$ (possible: $e$ is surjective) and set $d(x)=u(a)$. Well defined: if $e(a)=e(a')$ then $m(u(a))=v(e(a))=v(e(a'))=m(u(a'))$, and $m$ injective gives $u(a)=u(a')$. By construction $d\\circ e=u$, and $m(d(x))=m(u(a))=v(e(a))=v(x)$, so $m\\circ d=v$. Uniqueness: if $m\\circ d=v=m\\circ d'$ then injectivity of $m$ forces $d=d'$."
      solution_sketch: "Define $d$ by choosing a preimage under the surjection $e$; the real work is showing the choice does not matter, and that is where injectivity of $m$ is spent. Uniqueness of $d$ then follows from injectivity of $m$ again."
    anki_seeds:
      - front: "Every function factors as which two kinds of map, in which order?"
        back: "a surjection onto its image, followed by an injection into the codomain."
        type: basic
      - front: "Why is a diagonal fill-in $d$ (with $d\\circ e=u$, $m\\circ d=v$) unique when it exists?"
        back: "because $m$ is a monomorphism, so $m\\circ d=m\\circ d'$ forces $d=d'$."
        type: basic
      - front: "A subobject of $B$ is..."
        back: "an isomorphism class of monomorphisms into $B$; in $\\mathbf{Set}$ these are the subsets of $B$."
        type: basic

