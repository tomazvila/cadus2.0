          - problem: "Write the full proof: every isomorphism is both a monomorphism and an epimorphism, and the inclusion of Z into Q in Ring is mono and epi but not iso. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1. Let f: A -> B be an isomorphism with inverse g: B -> A. By definition of isomorphism, g composed with f is id_A and f composed with g is id_B. Step 2. To prove f is a monomorphism, suppose f composed with a equals f composed with b for arrows a,b: C -> A. Compose with g on the left: g composed with (f composed with a) equals g composed with (f composed with b). Associativity gives (g composed with f) composed with a equals (g composed with f) composed with b. Since g composed with f is id_A, the identity law gives a = b. Thus f is mono. Step 3. To prove f is an epimorphism, suppose c composed with f equals d composed with f for arrows c,d: B -> D. Compose with g on the right: (c composed with f) composed with g equals (d composed with f) composed with g. Associativity gives c composed with (f composed with g) equals d composed with (f composed with g). Since f composed with g is id_B, the identity law gives c = d. Thus f is epi. Step 4. In Ring, let i: Z -> Q be the inclusion. It is mono because if two ring maps agree after i, they agree on every integer. It is epi: if c composed with i equals d composed with i, then c(n)=d(n) for all integers n, and for m/n in Q we have c(m/n)=c(m)c(n)^{-1}=d(m)d(n)^{-1}=d(m/n), so c=d. Step 5. It is not an isomorphism because an inverse ring map Q -> Z would send 1/2 to an integer k with 2k=1, which is impossible. Therefore i is mono and epi but not iso. This completes the proof."
    diagnostic_exemplar:
      problem: "In $\\mathbf{Set}$, show that the inclusion $m\\colon\\{1,2\\}\\hookrightarrow\\{1,2,3\\}$ is a monomorphism but not an epimorphism."
      answer: "Mono: if $m\\circ f=m\\circ g$ for $f,g\\colon X\\to\\{1,2\\}$, then $f(x)=m(f(x))=m(g(x))=g(x)$ for every $x$, so $f=g$. Not epi: define $f,g\\colon\\{1,2,3\\}\\to\\{0,1\\}$ by $f\\equiv 0$ and $g(1)=g(2)=0$, $g(3)=1$; then $f\\circ m=g\\circ m$ (both vanish on $1,2$) but $f\\ne g$, so $m$ is not right-cancellable."
      solution_sketch: "Mono is injectivity of $m$ applied pointwise to $f$ and $g$. Failure of epi has to be produced: exhibit two maps out of $\\{1,2,3\\}$ that agree on $\\{1,2\\}$ but differ at $3$ — all the freedom lives at the element $m$ misses."
    anki_seeds:
      - front: "Define a monomorphism (mono)."
        back: "a map $m$ with $m\\circ f=m\\circ g\\Rightarrow f=g$ (left-cancellable)."
        type: basic
      - front: "Define an epimorphism (epi)."
        back: "a map $e$ with $f\\circ e=g\\circ e\\Rightarrow f=g$ (right-cancellable)."
        type: basic
      - front: "In $\\mathbf{Set}$: monos are {{c1::injections}}, epis are {{c2::surjections}}."
        back: "injections; surjections"
        type: cloze
      - front: "Does mono + epi imply iso?"
        back: "Not in general (e.g. $\\mathbb{Z}\\hookrightarrow\\mathbb{Q}$ in $\\mathbf{Ring}$); yes in $\\mathbf{Set}$."
        type: basic

  - id: groupoids
    name: Groupoids
    core: false                # example class; terminal
    difficulty: 0.63
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: isomorphism-vs-equality
        weight: 0.5
        key: true
      - id: poset-monoid-categories
        weight: 0.4
        key: true
      - id: discrete-indiscrete-categories
        weight: 0.3
      - id: examples-of-categories
        weight: 0.2
      - id: relations-equivalence
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Definition and first examples
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "Require definition and first examples. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Let C be the full subcategory of Set on A={0,1}and B={b}. Its arrows are coded as follows:1:A->A,[0,0];2:A->A,[0,1];3:A->A,[1,0];4:A->A,[1,1];5:A->B,the unique map;6:id_B;7:B->A,b maps to0;8:B->A,b maps to1. Construct the largest subcategory with these same objects that is a groupoid. Give all retained arrow codes increasingly, verifying two-sided inverses within the retained arrows."
            answer: "2, 3, 6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A retained arrow needs an inverse with reversed source and target and both composites equal to the appropriate identities. Only the identity and swap on A and the identity on B have such partners; their composites remain in this collection. The resulting answer is 2, 3, 6."
          - problem: "Decide which of these categories are groupoids: finite sets with bijections; finite sets with injections; finite sets with surjections; finite sets with all functions. Give four1/0bits in that order. For each negative case, test a map between a one-element and a two-element set and determine whether a two-sided inverse exists in the category."
            answer: "1, 0, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Bijections are closed under inverses. A point inclusion and a collapse onto a point respectively belong to the injection and surjection categories but cannot have two-sided inverses; both also occur in the category of all finite functions. The resulting answer is 1, 0, 0, 0."
          - problem: "Construct the groupoid consisting of the isomorphisms of a category C. For f:A->B,g:B->C with inverses fprime,gprime, derive an inverse of gf. Encode f=1,g=2,fprime=3,gprime=4,id_A=5,id_C=6. Give the two-arrow inverse word. Then, in each of its two inverse-law checks, cancel the inner inverse pair and give the remaining two-arrow word; give the check with domain A first. Append the two resulting identity codes. Use conventional composition order."
            answer: "3, 4, 3, 1, 2, 4, 5, 6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The inverse candidate is fprime gprime. Cancelling gprime g in the first check leaves fprime f, which is id_A; cancelling f fprime in the second leaves g gprime, which is id_C. These two laws establish closure under composition for the groupoid. The resulting answer is 3, 4, 3, 1, 2, 4, 5, 6."
          - problem: "A category has objects A,B and arrows id_A,id_B,u:A->B, with no arrow B->A. Audit the assertion that invertibility of every endomorphism makes a category a groupoid. Give1/0 for: every endomorphism here is invertible; every morphism here is invertible; the category is a groupoid. Check the non-endomorphism against the full groupoid definition."
            answer: "1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Its only endomorphisms are identities, but the arrow u has no possible reverse. A groupoid requires every morphism, including arrows between distinct objects, to be invertible. The resulting answer is 1, 0, 0."
          - problem: "Claim: the category with one object and two morphisms, 1 and e, with composition e composed with e equal to e, is a groupoid. Step 1: A groupoid is a category in which every morphism has a two-sided inverse. Step 2: The category has morphisms 1 and e, and e composed with e is e. Step 3: Since e composed with e is e, multiplying both sides by an inverse of e gives e equal to 1. Step 4: Therefore e equals 1, so every morphism has a two-sided inverse. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Rule R15: Step 1 is the correct definition of a groupoid. Step 2 correctly lists the two morphisms and the rule e composed with e equal to e. Step 3 is not valid: it uses an inverse of e before proving that e has an inverse, which is the point at issue. Step 4 is false: the conclusion e equal to 1 does not follow, and e is not invertible. The first invalid step is Step 3."
          - problem: "A category C has objects 0,1 and arrows (x,a), where x is 0 or 1 and a is a residue modulo 4. The source of (x,a) is x and its target is x+a modulo 2. Composition is (x+a modulo 2,b) after (x,a)=(x,a+b modulo 4), and id_x=(x,0). Decide from the groupoid definition whether C is a groupoid. For each arrow in the order (0,0),(0,1),(0,2),(0,3),(1,0),(1,1),(1,2),(1,3), construct a two-sided inverse, encoded as 4*source+label, or give -1 if none exists. Append the groupoid-validity bit. Both identity composites must hold; no inverse formula is supplied."
            answer: "0, 7, 2, 5, 4, 3, 6, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "For (x,a), the reverse arrow must start at x+a modulo 2, and its label must add to a to give 0 modulo 4. The resulting arrow ends at x and satisfies both identity equations. Every arrow has this two-sided inverse, so the category is a groupoid. The resulting answer is 0, 7, 2, 5, 4, 3, 6, 1, 1."
          - problem: "Write the full proof: in any groupoid, every morphism has exactly one two-sided inverse. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Let C be a groupoid and let f be a morphism from A to B. By the definition of a groupoid, f has at least one two-sided inverse g from B to A, so g composed with f is the identity at A and f composed with g is the identity at B. Step 2: Suppose h from B to A is another two-sided inverse of f. Then h composed with f is the identity at A and f composed with h is the identity at B. Step 3: Compute h equal to h composed with the identity at B, which equals h composed with f composed with g, which equals h composed with f composed with g, which equals the identity at A composed with g, which equals g, using associativity and the identity laws. Step 4: Thus any two inverses of f are equal, so f has exactly one two-sided inverse. Since f was arbitrary, every morphism in the groupoid has exactly one two-sided inverse."
      - id: kp2
        name: Automorphism groups and hom-set sizes
        key_prerequisites: [poset-monoid-categories]
        constraints: "Require the learner to use automorphism groups and hom-set sizes. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "In the groupoid of finite sets and bijections, take x=y={0,1,2}, u:x->y with values [1,2,0], and h:x->y with values [2,1,0]. Construct the automorphism a of x for which u after a=h. Give its value list."
            answer: "1, 0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Composition with u identifies Aut(x) with Hom(x,y); solve the commuting equation by composing with u inverse. The resulting answer is 1, 0, 2."
          - problem: "Let x and y be objects of a groupoid with a chosen isomorphism u: x -> y. Suppose Aut(x) is isomorphic to Z/3. How many elements does Hom(x,y) have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a groupoid, fix an isomorphism u: x -> y. The map h -> u^(-1) h is a bijection from Hom(x,y) to Aut(x). Therefore Hom(x,y) has the same size as Aut(x). Aut(x) is isomorphic to Z/3, so it has 3 elements. Thus Hom(x,y) has 3 elements."
          - problem: "Let u:x->y be the bijection [2,0,1] on zero-based three-element sets. An automorphism a of x has values [1,0,2]. Transport a to an automorphism b of y satisfying b after u=u after a. Construct b and give its value list."
            answer: "2, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Transport of automorphisms along the chosen isomorphism is conjugation; the commuting equation determines b. The resulting answer is 2, 1, 0."
          - problem: "A groupoid has objects x, y, and z. Aut(x) is isomorphic to Z/2. Hom(x,y) and Hom(y,z) are nonempty. What is the size of Hom(x,z)?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a groupoid, if Hom(x,y) is nonempty, then Hom(x,y) is in bijection with Aut(x), so they have the same size. Since Hom(x,y) is nonempty, x and y are isomorphic; likewise y and z are isomorphic. Thus x and z are isomorphic, so Hom(x,z) is nonempty. Therefore Hom(x,z) is in bijection with Aut(x). Aut(x) is isomorphic to Z/2, so it has 2 elements. Hence Hom(x,z) has 2 elements."
          - problem: "Claim: In a groupoid, fix objects x,y and an isomorphism u: x -> y. The map h -> u^(-1) h is a bijection Hom(x,y) -> Aut(x). Step 1: Fix u: x -> y. Step 2: For h: x -> y, u^(-1) h is an arrow x -> x. Step 3: The map a -> u^(-1) a is its inverse. Step 4: Therefore Hom(x,y) and Aut(x) have the same size. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it fixes the isomorphism u. Step 2 is valid: u^(-1) h is an arrow x -> x. Step 3 is not valid: the inverse map should be a -> u a, not a -> u^(-1) a, because u^(-1)(u^(-1) h) = u^(-2) h, which is not h in general. Step 4 is valid only if Step 3 were correct; since Step 3 is the first invalid step, the answer is Step 3."
          - problem: "A groupoid has exactly two objects x and y. Both Aut(x) and Aut(y) are isomorphic to Z/4. Hom(x,y) is nonempty. How many morphisms does the groupoid have in total?"
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A groupoid with two objects x and y has morphisms partitioned into Aut(x), Aut(y), Hom(x,y), and Hom(y,x). Since Hom(x,y) is nonempty, the groupoid is connected, so Hom(x,y) is in bijection with Aut(x), and Hom(y,x) is in bijection with Aut(y). Thus the size of Hom(x,y) is 4 and the size of Hom(y,x) is 4. The total number of morphisms is 4 + 4 + 4 + 4 = 16."
          - problem: "Write the full proof: In a groupoid, if u: x -> y is an isomorphism, then the map h -> u^(-1) h is a bijection from Hom(x,y) to Aut(x). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Fix an isomorphism u: x -> y. Step 2: Define the map Phi(h) = u^(-1) h for h: x -> y. Since u^(-1): y -> x and h: x -> y, the composite is an arrow x -> x, so Phi(h) belongs to Aut(x). Step 3: Define the map Psi(a) = u a for a: x -> x. Then Psi(a): x -> y, so it is in Hom(x,y). Step 4: Check Psi(Phi(h)) = u (u^(-1) h) = (u u^(-1)) h = 1_y h = h by associativity and the inverse law. Step 5: Check Phi(Psi(a)) = u^(-1) (u a) = (u^(-1) u) a = 1_x a = a. Thus Phi and Psi are mutually inverse bijections. Therefore Hom(x,y) and Aut(x) are in bijection."
      - id: kp3
        name: Thin groupoids are equivalence relations
        key_prerequisites: [relations-equivalence]
        constraints: "Require thin groupoids are equivalence relations. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "In a thin groupoid, an arrow x -> y and an arrow y -> z compose to an arrow x -> z. Which property of the induced relation on objects does this composition give? Select one."
            answer: "transitivity"
            answer_contract: {"kind": "label", "options": [["reflexivity"], ["symmetry"], ["transitivity"], ["associativity"]]}
            solution_sketch: "Step 1: in the induced relation, x ~ y holds when there is an arrow x -> y. Step 2: composition sends arrows x -> y and y -> z to an arrow x -> z, so x ~ y and y ~ z imply x ~ z; this is exactly transitivity. The option reflexivity is the error of confusing the source of the property: reflexivity of the relation comes from identity arrows, not from composition. The option symmetry is the error of forgetting that the reverse arrow comes from inverses, not from composing two arrows. The option associativity is the error of citing a category axiom that holds in every category but is not a property of the induced relation. The answer is transitivity."
          - problem: "A groupoid has objects 0, 1, 2, 3, 4. The only non-identity isomorphisms are generated by arrows 0 -> 1 and 2 -> 3. How many connected components does the groupoid have? Give a number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: connected components are the isomorphism classes of objects, and isomorphism is an equivalence relation, so its classes partition the objects. Step 2: the arrow 0 -> 1 links 0 and 1, and its inverse links 1 and 0. Step 3: the arrow 2 -> 3 links 2 and 3, and its inverse links 3 and 2. Step 4: the object 4 is isomorphic only to itself, so it forms a class alone. The classes are {0,1}, {2,3}, {4}. The answer is 3."
          - problem: "Starting with arrows0->1and2->1 on objects0,1,2,3, construct the equivalence relation corresponding to the smallest thin groupoid containing them. Test (0,2),(2,0),(3,3),(1,3)in that order and give 1/0 bits. Neither an initial arrow list nor transitive closure alone suffices."
            answer: "1, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Inverses impose symmetry and composition imposes transitivity. These connect0,1,2while the identity at3creates its singleton class. The resulting answer is 1, 1, 1, 0."
          - problem: "A groupoid has objects 1, 2, 3, 4, 5. Suppose 1 is isomorphic to 2, and 2 is isomorphic to 4. No other isomorphisms hold except those forced. Give the largest object in the isomorphism class of 1."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: isomorphism of objects in a groupoid is an equivalence relation, so its classes partition the objects. Step 2: symmetry gives 2 ~ 1 and 4 ~ 2. Step 3: transitivity gives 1 ~ 4. Step 4: object 3 and object 5 are isomorphic only to themselves, so they lie outside the class of 1. The class of 1 is {1,2,4}, and its largest object is 4. The answer is 4."
          - problem: "Generate the smallest thin groupoid on {0,1,2,3} containing arrows 0->1 and 1->2. For the pairs (2,0),(0,2),(3,0),(3,3), give 1 when an arrow is forced and 0 otherwise."
            answer: "1, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Groupoid inverses impose symmetry and composition imposes transitivity, producing the equivalence relation generated by the given arrows. The resulting answer is 1, 1, 0, 1."
          - problem: "In the dictionary proof, reflexivity of the relation corresponds to which category axiom? Select one."
            answer: "identities"
            answer_contract: {"kind": "label", "options": [["identities"], ["inverses"], ["composition"], ["associativity"]]}
            solution_sketch: "Step 1: the relation is x ~ y when an arrow x -> y exists. Step 2: reflexivity needs x ~ x for every object, and the arrow x -> x is exactly the identity arrow 1x. Step 3: so reflexivity corresponds to identities. The option inverses is the error of matching symmetry to the wrong property: inverses give the reverse arrow y -> x, not the loop x -> x. The option composition is the error of matching transitivity to the wrong property: composition builds x -> z from x -> y and y -> z, not the loop x -> x. The option associativity is the error of citing an axiom of every category that produces no arrow at all. The answer is identities."
          - problem: "Write the full proof: a groupoid in which every hom-set has at most one element is the same thing as an equivalence relation on its objects. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (definition): call a groupoid thin when each hom-set has at most one arrow. Step 2 (relation): define x ~ y iff there is an arrow x -> y. Step 3 (reflexivity): the identity arrow 1x gives x ~ x. Step 4 (symmetry): every arrow x -> y in a groupoid has an inverse y -> x, so x ~ y gives y ~ x. Step 5 (transitivity): arrows x -> y and y -> z compose to x -> z, so x ~ y and y ~ z give x ~ z. Thus ~ is an equivalence relation. Step 6 (converse): given an equivalence relation ~ on a set, form the thin category with one arrow x -> y exactly when x ~ y. Step 7: identities come from reflexivity, inverses from symmetry, and composition from transitivity; hence this category is a groupoid. The two constructions are mutually inverse, so a thin groupoid is exactly an equivalence relation on its objects."
    diagnostic_exemplar:
      problem: "Let $x$ be an object of a groupoid $\\mathcal G$. Prove that $\\mathrm{Aut}(x)=\\mathrm{Hom}(x,x)$ is a group under composition."
      answer: "Any two arrows $x\\to x$ are composable, so composition is a binary operation on $\\mathrm{Hom}(x,x)$; it is associative and has $1_x$ as a two-sided unit by the category axioms. By the groupoid axiom every $a\\colon x\\to x$ has a two-sided inverse $a^{-1}$, which is again an arrow $x\\to x$. Hence every element is invertible and $\\mathrm{Aut}(x)$ is a group."
      solution_sketch: "Check the group axioms one at a time against the category axioms: closure because any two arrows $x\\to x$ are composable, associativity and the unit $1_x$ from the category axioms, and inverses from the groupoid hypothesis."
    anki_seeds:
      - front: "Define a groupoid."
        back: "a category in which every morphism is an isomorphism."
        type: basic
      - front: "A one-object groupoid is the same thing as a {{c1::group}}."
        back: "group"
        type: cloze
      - front: "What is the core of a category $\\mathcal C$?"
        back: "the subgroupoid with all objects of $\\mathcal C$ and only its isomorphisms."
        type: basic

  - id: sections-retractions
    name: Sections and Retractions
    core: false
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: mono-epi-iso
        weight: 0.5
        key: true
      - id: isomorphism-vs-equality
        weight: 0.3
      - id: category-definition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Split monos and split epis
        key_prerequisites: [mono-epi-iso]
        constraints: "Require split monos and split epis. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "For f:{1,2,3}->{a,b} with values(a,b,a), construct a section in Set from the definition of a split epimorphism. Among all sections choose the lexicographically largest list(s(a),s(b)). Give that list. The defining composite equation must be determined as part of the construction."
            answer: "3, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A section s must compose with f to the identity on{a,b}. It therefore chooses one preimage of each codomain element, and the lexicographically largest choice selects3over1 for a. The resulting answer is 3, 2."
          - problem: "Construct a retraction that exhibits the given arrow as a split monomorphism. In Set take A={0,...,1}, B={0,...,2}, and f:A->B with value list [1, 2]. Construct g:B->A satisfying g after f = id_A. If several work, use the lexicographically least value list. Give g(0),...,g(2)."
            answer: "0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Check the stated composite equations on every element; the selected value list satisfies the required unit equations. The resulting answer is 0, 0, 1."
          - problem: "Construct all sections in Set of f:{1,2,3,4}->{a,b,c}, where f has values(a,b,c,a). List each section by its values on a,b,c, sort those lists lexicographically, and concatenate them. Verify that every listed arrow witnesses the required splitting."
            answer: "1, 2, 3, 4, 2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A section must choose a preimage of every codomain element. Only a has a choice, and each of the two complete lists composes with f to the codomain identity. The resulting answer is 1, 2, 3, 4, 2, 3."
          - problem: "In the category with objects A,B and arrows id_A,id_B,f:A->B, classify f: split mono; split epi; mono; epi. Give four1/0bits in that order. Derive the splitting requirements and check the relevant hom-sets; do not infer that an arrow splits merely because it is cancellable."
            answer: "0, 0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Both kinds of splitting would require an arrow B->A, which the category lacks. Monicity and epicity nevertheless hold because each relevant parallel hom-set has at most one member. The resulting answer is 0, 0, 1, 1."
          - problem: "Let m:{2,3}->{x,y,z} satisfy m(2)=y,m(3)=z. Construct every retraction of m in Set. Record each retraction by its values on x,y,z, order these three-entry lists lexicographically, and concatenate them. Determine the required splitting equation rather than use a supplied characterization."
            answer: "2, 2, 3, 3, 2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A retraction r must satisfy rm=id on{2,3}. This forces the values at y,z while allowing either target value at x; the answer exhibits both complete witnesses. The resulting answer is 2, 2, 3, 3, 2, 3."
          - problem: "Let r:A->B admit a section s:B->A with rs=id_B. Prove r epic: for arbitrary f,g:B->Z with fr=gr, derive a chain from f to g using the splitting and that assumed equality. Encode f=1,g=2,r=3,s=4. Give the two three-arrow words between f and g, in conventional composition order, as six codes. Then give 1 if this proof requires sr=id_A and 0 otherwise."
            answer: "1, 3, 4, 2, 3, 4, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Insert rs on the right of f to obtain frs, replace fr by gr, and collapse rs to reach g. This establishes right cancellation for r using only the given split-epimorphism equation. The resulting answer is 1, 3, 4, 2, 3, 4, 0."
          - problem: "Write the full proof: in a category, a morphism with a retraction is a monomorphism, and a morphism with a section is an epimorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: let m: A -> B and let r: B -> A satisfy r o m = 1_A. Suppose m o f = m o g for parallel maps f,g: C -> A. Step 2: compose on the left with r. By associativity, (r o m) o f = (r o m) o g. Step 3: replace r o m by 1_A, so 1_A o f = 1_A o g. By the identity law, f = g. Thus m is monic. Step 4: let e: A -> B and let s: B -> A satisfy e o s = 1_B. Suppose f o e = g o e for parallel maps f,g: B -> C. Step 5: compose on the right with s. By associativity, f o (e o s) = g o (e o s). Step 6: replace e o s by 1_B, so f o 1_B = g o 1_B. By the identity law, f = g. Thus e is epic. The proof shows a split mono is monic and a split epi is epic."
      - id: kp2
        name: When splitting plus cancellation gives an isomorphism
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "Require when splitting plus cancellation gives an isomorphism. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Assume rm=id_A for m:A->B,r:B->A. Prove mr=id_B when m is epic by forming an equality with common right factor m. Give the fully simplified arrow obtained from (mr)m, then the one obtained from id_B m. Encode m=1,r=2,id_A=3,id_B=4. Finally give1if the proof uses left cancellation and2if it uses right cancellation. Return three integers."
            answer: "1, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The splitting simplifies both composites to m. Right cancellation by the epic arrow m then proves the missing inverse equation. The resulting answer is 1, 1, 2."
          - problem: "Assume rm=id_A for m:A->B,r:B->A. Develop two proofs of mr=id_B: one under the extra hypothesis m epic, the other under r monic. In each proof construct a three-factor equality whose left side contains the missing composite mr and whose right side simplifies to a single arrow. Encode m=1,r=2. Give the three-factor word and its simplified arrow for the epic proof, then for the monic proof, in conventional composition order. Append the two cancellation codes, using left=1,right=2."
            answer: "1, 2, 1, 1, 2, 1, 2, 2, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "For epic m, the equality(mr)m=m permits right cancellation. For monic r, r(mr)=r permits left cancellation. Both simplifications use rm=id_A, but their final cancellation hypotheses differ. The resulting answer is 1, 2, 1, 1, 2, 1, 2, 2, 2, 1."
          - problem: "Claim: if r∘m=1_A then m∘r=1_B. Step 1: (m∘r)∘m = m∘(r∘m) by associativity. Step 2: m∘(r∘m) = m∘1_A = m by the hypothesis. Step 3: so m∘r = 1_B by cancellation. Step 4: thus m is an isomorphism. Which step is the first invalid step?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid by associativity. Step 2 is valid by the hypothesis r∘m=1_A. Step 3 is invalid: from (m∘r)∘m = 1_B∘m one may cancel m only if m is an epimorphism. Step 4 relies on Step 3. The answer is Step 3."
          - problem: "In the proof that a split mono m with r∘m=1_A and epi m is an isomorphism, the line after (m∘r)∘m = m∘(r∘m) = m∘1_A = m is missing. Select the line that completes the right-cancellation step."
            answer: "m o r = 1_B"
            answer_contract: {"kind": "label", "options": [["m o r = 1_B"], ["m o r = m"], ["r o m = 1_B"], ["m o r = 1_A"]]}
            solution_sketch: "The line before shows (m∘r)∘m = 1_B∘m. Since m is epi, right-cancel m to get m o r = 1_B. Option m o r = m confuses the identity on B. Option r o m = 1_B swaps the order. Option m o r = 1_A uses the wrong object. The answer is m o r = 1_B."
          - problem: "Assume e:B->A and s:A->B satisfy es=id_A. Consider adding just one of these hypotheses: e epic; s monic; e monic; s epic. In each case decide whether se=id_B follows in every category. Give four1/0bits in that order. Derive each valid case by the appropriate cancellation, and use a split surjection onto a singleton to test the others."
            answer: "0, 0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Monic e cancels from e(se)=e, while epic s cancels from(se)s=s. The split surjection from two points to one has epic e and monic s but its reverse composite is constant, refuting the other assumptions. The resulting answer is 0, 0, 1, 1."
          - problem: "For m:A->B with rm=id_A, assess the following proposed extra assumptions for concluding mr=id_B: m epic; r epic; m monic; r monic. Give four1/0 bits in that order, proving the valid implications by cancellation and refuting the others with a split inclusion of a singleton into a two-element set."
            answer: "1, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Epic m cancels on the right of (mr)m=m; monic r cancels on the left of r(mr)=r. The split point inclusion has monic m and epic r but is not invertible. The resulting answer is 1, 0, 0, 1."
          - problem: "Write the full proof: if m: A->B is a split epimorphism and a monomorphism, then m is an isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (hypothesis): m is a split epi, so there is s: B->A with m∘s=1_B. Step 2 (hypothesis): m is a monomorphism, so m is left-cancellable. Step 3 (associativity and identity): compute m∘(s∘m) = (m∘s)∘m = 1_B∘m = m. Also m = m∘1_A. So m∘(s∘m) = m∘1_A. Step 4 (cancellation): since m is mono, cancel m on the left to get s∘m=1_A. Step 5 (conclusion): m∘s=1_B and s∘m=1_A, so s is a two-sided inverse and m is an isomorphism."
    diagnostic_exemplar:
      problem: "Let $m\\colon A\\to B$ be a split monomorphism (some $r\\colon B\\to A$ satisfies $r\\circ m=1_A$) which is also an epimorphism. Prove that $m$ is an isomorphism."
      answer: "$(m\\circ r)\\circ m=m\\circ(r\\circ m)=m\\circ 1_A=m=1_B\\circ m$. Since $m$ is an epimorphism, right-cancel it to get $m\\circ r=1_B$. Together with $r\\circ m=1_A$, $r$ is a two-sided inverse, so $m$ is an isomorphism."
      solution_sketch: "You have $r\\circ m=1_A$ and want $m\\circ r=1_B$. Manufacture an equation with $m$ on the right — $(m\\circ r)\\circ m=m=1_B\\circ m$ — and then right-cancel $m$ using the epi hypothesis."
    anki_seeds:
      - front: "If $r\\circ s=1$: which map is the section, which the retraction?"
        back: "$s$ is the section (right inverse); $r$ is the retraction (left inverse)."
        type: basic
      - front: "A morphism with a section (right inverse) is called a...?"
        back: "a split epimorphism."
        type: basic
      - front: "A morphism with a retraction (left inverse) is called a...?"
        back: "a split monomorphism."
        type: basic
      - front: "Split mono $+$ split epi $\\Rightarrow$ ?"
        back: "isomorphism (the one-sided inverses coincide)."
        type: basic

