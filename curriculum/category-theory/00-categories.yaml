      - id: kp1
        name: The opposite category
        key_prerequisites: [category-definition]
        constraints: "Require the opposite category. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Construct opposite-category composition with all arrow directions checked. In Set^op, f:A->B and g:B->C correspond to Set functions f:B->A with values [1, 0, 1], g:C->B with values [2, 0, 1]. Construct g after f in Set^op as an underlying Set function. Give its complete value list."
            answer: "1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Reversing arrows reverses the order of composition: the underlying function is f after g. The resulting answer is 1, 1, 0."
          - problem: "Let C have objects 0,1,2 and exactly the arrows of the chain 0<1<2. Construct C^op. For the arrow types 2->0,0->2,1->1,2->1 give 1 if present and 0 if absent."
            answer: "1, 0, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The opposite has the same objects and reversed hom-sets, with unchanged identities. The resulting answer is 1, 0, 1, 1."
          - problem: "In a free category take f:A->B, g:B->C, h:C->D. Number f^op=1,g^op=2,h^op=3. Translate (h after g after f)^op into a composite in C^op. Give its arrow numbers in traversal order, and then the traversal order after taking the opposite once more."
            answer: "3, 2, 1, 1, 2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Each application of opposite reverses the path, so double opposite restores the original composite. The resulting answer is 3, 2, 1, 1, 2, 3."
          - problem: "Translate the opposite composite back to a function and construct that function. In Set^op, f:A->B and g:B->C correspond to Set functions f:B->A with values [2, 0, 1], g:C->B with values [1, 0]. Construct g after f in Set^op as an underlying Set function. Give its complete value list."
            answer: "0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Reversing arrows reverses the order of composition: the underlying function is f after g. The resulting answer is 0, 2."
          - problem: "Consider this verification that (C^op)^op = C. Step 1: (C^op)^op has the same objects as C^op, and these are the objects of C. Step 2: a morphism from A to B in (C^op)^op is a morphism from A to B in C^op, and hence a morphism from B to A in C. Step 3: composition in (C^op)^op sends composable h after g to the composite h ∘ g of C. Step 4: the hom-sets and the composition agree with those of C, so (C^op)^op = C. Which step is the first that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: taking an opposite never changes the objects. Step 2 is the first invalid step: a morphism from A to B in X^op is a morphism from B to A in X, so with X = C^op it is a morphism from B to A in C^op, that is, a morphism from A to B in C; the step wrongly keeps the direction of C^op instead of reversing it a second time. Step 3 is a true statement, since composition in a double opposite coincides with the composition of C. Step 4 is the correct conclusion once Step 2 is repaired. The answer is Step 2."
          - problem: "A free category C is generated by f:A->B, g:B->C, h:C->D. Construct the arrow (h after g after f)^op in C^op without an opposite-composition formula being supplied. Encode A=0,B=1,C=2,D=3 and f^op=4,g^op=5,h^op=6. Give its source, target, then the three arrow codes in traversal order. Finally give the source and target after taking the opposite again."
            answer: "3, 0, 6, 5, 4, 0, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The opposite reverses every generating arrow, so the path must traverse h opposite, then g opposite, then f opposite. Reversing again restores the original endpoints and composition direction. The resulting answer is 3, 0, 6, 5, 4, 0, 3."
          - problem: "Write the full proof: for every category C, the opposite category C^op, with the same objects, hom-sets Hom_{C^op}(A, B) = Hom_C(B, A) and composition g ∘^op f = f ∘ g, is a category, and (C^op)^op = C. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects and hom-sets): C^op has the same objects as C, and for objects A and B we set Hom_{C^op}(A, B) = Hom_C(B, A), so an arrow from A to B in C^op is an arrow from B to A in C. Step 2 (identities): the identity 1_A of C is an arrow from A to A in C, hence an arrow from A to A in C^op. Step 3 (composition): for f from A to B and g from B to C in C^op, the arrows f from B to A and g from C to B in C are composable, and we set g ∘^op f = f ∘ g, an arrow from C to A in C, hence an arrow from A to C in C^op. Step 4 (unit laws): f ∘^op 1_A = 1_A ∘ f = f and 1_B ∘^op f = f ∘ 1_B = f, by the two unit laws of C. Step 5 (associativity): (h ∘^op g) ∘^op f = f ∘ (g ∘ h) = (f ∘ g) ∘ h, which equals h ∘^op (g ∘^op f), so composition in C^op is associative by associativity in C. Step 6 (involution): reversing the arrows twice returns the original hom-sets and the original composition, so (C^op)^op = C. Every axiom is verified, so C^op is a category."
      - id: kp2
        name: The duality principle
        key_prerequisites: [category-definition]
        constraints: "Require the duality principle. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "In any category, a monomorphism is a morphism f such that f g = f h implies g = h for all composites where these make sense. Reverse every arrow and every side in this definition. Which notion is dual to a monomorphism?"
            answer: "epimorphism"
            answer_contract: {"kind": "label", "options": [["epimorphism"], ["isomorphism"], ["section"], ["retraction"]]}
            solution_sketch: "Step 1 (definition): a monomorphism is left-cancellable, since f g = f h forces g = h. Step 2 (reversal): reversing every arrow turns f g = f h into g f = h f, so the dual property is right-cancellation. Step 3 (identification): a right-cancellable morphism is an epimorphism. The answer is epimorphism. Wrong options: isomorphism wrongly adds a two-sided inverse, which the cancellation definition never asserts; section wrongly reads the dual as a split condition with a left inverse, which is strictly stronger than cancellation; retraction wrongly uses a right inverse, also a stronger split condition and not the arrow-reversed cancellation property."
          - problem: "Duality reverses every arrow in a definition. An initial object has exactly one morphism from itself to each object. Which notion is the dual of an initial object?"
            answer: "terminal object"
            answer_contract: {"kind": "label", "options": [["terminal object"], ["product"], ["coproduct"], ["zero object"]]}
            solution_sketch: "Step 1 (definition): an initial object I has exactly one morphism I -> X for every object X. Step 2 (reversal): reversing all arrows gives exactly one morphism X -> I for every object X. Step 3 (identification): an object that receives a unique morphism from every object is a terminal object. The answer is terminal object. Wrong options: product wrongly dualizes a limit notion of a diagram instead of reversing the single arrow 'unique arrow out'; coproduct is the dual of product, not the dual of initial; zero object is both initial and terminal, so its own dual is again a zero object, and it does not name the dual of initial alone."
          - problem: "Let C be the category given by the poset 1 < 2 < 3 < 4, so there is exactly one morphism a -> b whenever a <= b. In the opposite category C^op, how many morphisms have source 3?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (reversal): a morphism with source 3 in C^op is exactly a morphism with target 3 in C, since C^op shares the objects of C and reverses each arrow. Step 2 (count): in the poset C, the morphisms with target 3 are the unique arrows 1 -> 3, 2 -> 3, and 3 -> 3. Step 3 (total): there are three such morphisms. The answer is 3."
          - problem: "A category C has objects A, B, C and exactly these non-identity morphisms: f: A -> B, g: B -> C, and their composite g f: A -> C, plus all identities. In the opposite category C^op, how many morphisms have source B?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (reversal): a morphism with source B in C^op is a morphism with target B in C, because opposite categories keep the same objects and reverse every arrow. Step 2 (count): the morphisms of C with target B are id_B and f: A -> B. Step 3 (total): the count is two. The answer is 2."
          - problem: "Dualize a product cone: p:P->A, q:P->B, with the unique comparison u:X->P for every pair a:X->A,b:X->B. Encode the objects A=1,B=2,P=3,X=4. Give the source,target pairs of p^op,q^op,u^op in the dual universal diagram."
            answer: "1, 3, 2, 3, 3, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Arrow reversal turns the product cone into a coproduct cocone; the universal comparison reverses with its structure maps. The resulting answer is 1, 3, 2, 3, 3, 4."
          - problem: "In C let f:A->B and g:B->A satisfy gf=id_A. Translate the entire splitting equation into C^op. Encode f^op=1,g^op=2,id_A=3,id_B=4. Give the two arrow codes on the left of the dual equation in conventional composition order, then its identity code. Append 1 if the dual equation exhibits f^op as a split epimorphism, and 1 if it necessarily makes f^op an isomorphism, using 0 otherwise. Justify the final verdict by dualizing a proper split inclusion in Set."
            answer: "1, 2, 3, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Opposite composition reverses the factors, giving f opposite after g opposite equal to id_A. That supplies a right inverse for f opposite, while the dual of a proper split inclusion shows the other inverse equation need not hold. The resulting answer is 1, 2, 3, 1, 0."
          - problem: "Write the full proof: the duality principle, namely that if a statement holds in every category, then its arrow-reversed dual statement also holds in every category. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): let S be a statement about categories, arrows, and composites that holds in every category. Step 2 (dual statement): define S^op to be the statement obtained from S by reversing the source and target of every arrow and the order in every composite, while keeping the object and morphism quantifiers. Step 3 (opposite is a category): for any category C, the opposite category C^op has the same objects, an arrow f^op: Y -> X for each arrow f: X -> Y of C, and composition defined by f^op g^op = (g f)^op; associativity and the identities of C make C^op a category. Step 4 (apply S to C^op): since S holds in every category, S holds in C^op. Step 5 (translate back): reading the arrows of C^op as reversed arrows of C, the statement S holds in C^op exactly when the arrow-reversed statement S^op holds in C; this translation is bijective on statements, since (f^op)^op = f. Step 6 (conclusion): therefore S^op holds in every category C, which proves the duality principle. As a sample use: the dual of the definition of a monomorphism, left-cancellation, is right-cancellation, so 'epi' is dual to 'mono', and every theorem about monos yields a mirror theorem about epis."
      - id: kp3
        name: Using duality to halve the work
        key_prerequisites: [initial-terminal-objects]
        constraints: "Require using duality to halve the work. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "You may use the theorem that any two initial objects are uniquely isomorphic. To apply it in C^op and deduce a theorem about an object T of C, determine which individual assumptions on T suffice: every Hom_C(T,X)is a singleton; every Hom_C(X,T)is a singleton; every Hom_C(X,T)is merely nonempty; Hom_C(T,T)is a singleton. Give four1/0 bits. Your proof must translate initiality through the opposite-category hom-sets."
            answer: "0, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Initiality in C^op says every reversed outgoing hom-set Hom_C(X,T) is a singleton. This is terminality in C, and the three weaker or differently directed assumptions do not suffice. The resulting answer is 0, 1, 0, 0."
          - problem: "Let f: A -> B and g: B -> C be epimorphisms of a category C, so that f^op: B -> A and g^op: C -> B are monomorphisms of C^op. The known theorem that a composite of two monomorphisms is a monomorphism, applied in C^op, shows that the composite g^op then f^op, read as first g^op and then f^op, is a monomorphism of C^op. Select the statement about C that this translation gives."
            answer: "f then g is an epimorphism"
            answer_contract: {"kind": "label", "options": [["f then g is an epimorphism"], ["g then f is an epimorphism"], ["f then g is a monomorphism"], ["g then f is an isomorphism"]]}
            solution_sketch: "Step 1 (duality dictionary): f^op: B to A and g^op: C to B are monomorphisms of C^op because f and g are epimorphisms of C. Step 2 (known theorem applied in C^op): the composite g^op then f^op is the opposite of the composite of f and g, and it is a monomorphism of C^op. Step 3 (translate back): a monomorphism of C^op is exactly an epimorphism of C, and the opposite of that composite is the composite of f and g in C, read as first f then g. The wrong option 'g then f is an epimorphism' reverses the order and is not even composable in C; the wrong option 'f then g is a monomorphism' keeps the right order but forgets that monomorphisms of C^op read back as epimorphisms of C; the wrong option 'g then f is an isomorphism' makes both errors. The answer is f then g is an epimorphism."
          - problem: "A known theorem says split epimorphisms are epic. Apply it in C^op to a splitting r m=id_A in C, with m:A->B and r:B->A. Encode m=1,r=2. Give the traversal order of the splitting equation in C^op, followed by 1 if the translated conclusion is that m is monic or 2 if it says m is epic."
            answer: "2, 1, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The splitting becomes a split epimorphism m^op. Its epicity in C^op translates to monicity of m in C. The resulting answer is 2, 1, 1."
          - problem: "Use the theorem that composites of monomorphisms are monomorphisms inside C^op. In C take epic f:A->B and g:B->C, numbered f=1,g=2. Give the traversal order of the opposite arrows to which the theorem applies and then the traversal order of the resulting epic composite in C."
            answer: "2, 1, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The reversed arrows are monic and compose in reverse traversal order. Translating the theorem back gives epicity of g after f. The resulting answer is 2, 1, 1, 2."
          - problem: "A student proves, using only duality, that a composite of two epimorphisms is an epimorphism. Step 1: let f: A -> B and g: B -> C be epimorphisms of C. Step 2: in C^op, f^op: B -> A and g^op: C -> B are monomorphisms. Step 3: the known theorem on composites of monomorphisms shows that f^op: B -> A followed by g^op: C -> B is a monomorphism of C^op. Step 4: reading back into C, the composite of f and g is an epimorphism. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 (set-up check): Step 1 only names two epimorphisms with matching arrows, so it is valid. Step 2 (duality dictionary): epimorphisms of C become monomorphisms of C^op with reversed arrows, so Step 2 is valid. Step 3 (composability check): f^op: B to A followed by g^op: C to B is not a composite at all, since f^op ends at A while g^op starts at C; the composable order is g^op followed by f^op, so Step 3 is the first invalid step. Step 4 (why the last step is not the answer): once the composable order is restored, Step 4 correctly reads the monomorphism back as an epimorphism of C. The answer is Step 3."
          - problem: "A duality proof that a composite of two epimorphisms is an epimorphism has four lines. Line 1: f: A -> B and g: B -> C are epimorphisms of C. Line 2: in C^op, f^op: B -> A and g^op: C -> B are monomorphisms. Line 3 is missing. Line 4: reading back into C, the composite of f and g is an epimorphism. Select the line that completes Line 3, reading u then v always as first u, then v."
            answer: "the composite g^op then f^op is a monomorphism"
            answer_contract: {"kind": "label", "options": [["the composite g^op then f^op is a monomorphism"], ["the composite f^op then g^op is a monomorphism"], ["the composite g^op then f^op is an epimorphism"], ["the composite f^op then g^op is an isomorphism"]]}
            solution_sketch: "Step 1 (what Line 3 must do): it must apply the known theorem that a composite of two monomorphisms is a monomorphism to the composable pair inside C^op. Step 2 (find the composable pair): g^op: C to B then f^op: B to A is composable and is exactly the opposite of the composite of f and g. Step 3 (name the errors): the option 'the composite f^op then g^op is a monomorphism' pairs arrows that are not composable, since f^op ends at A while g^op starts at C; the option 'the composite g^op then f^op is an epimorphism' appeals to the dual theorem about epimorphisms, which is the very statement still to be proved; the option 'the composite f^op then g^op is an isomorphism' has both the wrong order and the wrong class. The answer is the composite g^op then f^op is a monomorphism."
          - problem: "Write the full proof: in any category, terminal objects are unique up to a unique isomorphism, using only the known result on initial objects and translation along duality. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (translate the objects): let C be any category; a terminal object t of C is exactly an initial object of C^op, because morphisms from t to x in C^op are morphisms from x to t in C, and terminality of t in C provides exactly one of those for every object x. Step 2 (apply the known theorem): the theorem that initial objects are unique up to a unique isomorphism holds in every category, hence in particular in C^op, so any two initial objects of C^op are related by exactly one isomorphism. Step 3 (translate back): the terminal objects of C are precisely the initial objects of C^op, and an isomorphism in C^op is exactly an isomorphism of C with reversed direction, since taking opposites reverses composites and inverses stay inverses. Step 4 (conclusion): therefore any two terminal objects of C are isomorphic through exactly one isomorphism, which proves that terminal objects are unique up to a unique isomorphism. Step 5 (check the constraint): the argument only applied a known theorem inside C^op and translated the statement back, with no fresh diagram chase or cancellation argument."
    diagnostic_exemplar:
      problem: "You know that a composite of two monomorphisms is a monomorphism. Using duality — not a fresh cancellation argument — prove that a composite of two epimorphisms is an epimorphism."
      answer: "A morphism is epi in $\\mathcal C$ iff it is mono in $\\mathcal C^{op}$ (reversing arrows turns right-cancellation into left-cancellation), and the composite $g\\circ f$ in $\\mathcal C$ is the composite $f\\circ^{op}g$ in $\\mathcal C^{op}$. Let $f,g$ be epis in $\\mathcal C$; they are monos in $\\mathcal C^{op}$, and the mono theorem, valid in every category, applies to $\\mathcal C^{op}$: their composite is mono there. Translating back, $g\\circ f$ is epi in $\\mathcal C$."
      solution_sketch: "Do not re-run the cancellation argument. Translate instead: epi in $\\mathcal C$ is mono in $\\mathcal C^{op}$ and composition order reverses, so apply the mono theorem inside $\\mathcal C^{op}$, where it holds because it holds in every category, and translate the conclusion back."
    anki_seeds:
      - front: "The opposite category $\\mathcal{C}^{op}$ has..."
        back: "the same objects, morphisms $A\\to B$ = $\\mathcal{C}$-morphisms $B\\to A$, and reversed composition."
        type: basic
      - front: "By duality: the dual of a monomorphism is an {{c1::epimorphism}}, of an initial object a {{c2::terminal object}}, of a product a {{c3::coproduct}}."
        back: "epimorphism; terminal object; coproduct"
        type: cloze

  - id: slice-categories
    name: Slice and Coslice Categories
    core: true  # ancestor of core universal-properties (PEDAGOGY §1 invariant)
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: category-definition
        weight: 0.5
        key: true
      - id: commutative-diagrams
        weight: 0.3
      - id: initial-terminal-objects
        weight: 0.3
      - id: duality-opposite-categories
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Objects and morphisms of a slice
        key_prerequisites: [commutative-diagrams]
        constraints: "Require objects and morphisms of a slice. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "In the slice C/C, let f:X->C, g:Y->C and p:Z->C be objects. Let h:f->g and k:g->p be morphisms. Which equation must the composite k h satisfy to be a morphism from f to p?"
            answer: "p k h = f"
            answer_contract: {"kind": "label", "options": [["p k h = f"], ["f k h = p"], ["p h k = f"], ["g k h = f"]]}
            solution_sketch: "A morphism h:f->g satisfies g h = f, and k:g->p satisfies p k = g. The composite k h goes from X to Z, so it is a morphism f->p exactly when p (k h) = f. By associativity, p (k h) = (p k) h = g h = f. The option f k h = p swaps the source and target. The option p h k = f composes in the wrong order. The option g k h = f uses g where p is needed. The answer is p k h = f."
          - problem: "In Set/{0,1}, let f:X->{0,1} with X={a,b,c}, f(a)=0, f(b)=0 and f(c)=1. Let g:Y->{0,1} with Y={u,v,w}, g(u)=0, g(v)=1 and g(w)=1. How many morphisms from f to g are there in Set/{0,1}?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An object is a function to {0,1}, and a morphism h from f to g must satisfy g h = f. Thus h sends the fiber f^{-1}(0)={a,b} into g^{-1}(0)={u}, so h(a)=h(b)=u. It sends f^{-1}(1)={c} into g^{-1}(1)={v,w}, so h(c) is v or w. There are 2 choices. The answer is 2."
          - problem: "In Set/{0,1}, let f:X->{0,1} with X={a,b}, f(a)=0 and f(b)=0. How many morphisms from f to f are there in Set/{0,1}?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A morphism h from f to f must satisfy f h = f, so it preserves each fiber. The fiber f^{-1}(0) is all of X={a,b}, so h(a) and h(b) may each be a or b. That gives 2 times 2 = 4 functions. Every such function is a morphism over {0,1}. The answer is 4."
          - problem: "In Set/{0,1}, the objects f:X->{0,1}, g:Y->{0,1} have zero-based domains X={0,1,2},Y={0,1}, and values f=[1,0,1],g=[0,1]. Construct the slice morphism h:f->g from its commuting triangle. Give all values of h."
            answer: "1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "A slice morphism must satisfy g h=f; the two distinct g-fibers force the entire map. The resulting answer is 1, 0, 1."
          - problem: "In the slice Set/B, let B={0,1}, and use objects f:X->B, g:Y->B, p:Z->B with X=Y=Z={0,1}, f=[1,0], g=[0,1], p=[1,0]. Construct the slice morphisms h:f->g and k:g->p from their defining triangles, and then their slice composite f->p. Give the three underlying value lists in that order. The triangle equations must be derived from the slice definition."
            answer: "1, 0, 1, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The slice condition for h is gh=f and for k is pk=g, which determine the two maps. Their ordinary composite satisfies pkh=f and is therefore the slice composite with the required source and target. The resulting answer is 1, 0, 1, 0, 0, 1."
          - problem: "In Set/{0,1}, let f:X->{0,1} with X={a,b,c}, f(a)=0, f(b)=0 and f(c)=1. Let g:Y->{0,1} with Y={u,v,w}, g(u)=0, g(v)=0 and g(w)=1. How many morphisms from f to g are there?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A morphism h from f to g must satisfy g h = f, so it maps each fiber of f into the matching fiber of g. The fiber f^{-1}(0)={a,b} maps into g^{-1}(0)={u,v}, giving 2 choices for h(a) and 2 choices for h(b). The fiber f^{-1}(1)={c} maps into g^{-1}(1)={w}, giving 1 choice for h(c). Multiply: 2 times 2 times 1 = 4. The answer is 4."
          - problem: "Write the full proof: fix an object C of C. Define the slice category C/C and verify that composition is well defined. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: an object of C/C is a morphism f:X->C. Step 2: a morphism from f:X->C to g:Y->C is an arrow h:X->Y with g h = f, so the triangle over C commutes. Step 3: for composable morphisms h:f->g and k:g->p, we have g h = f and p k = g. Associativity gives p (k h) = (p k) h = g h = f, so k h is an arrow X->Z with the required triangle. Thus the composite k h is a morphism f->p. Step 4: the identity 1_X satisfies f 1_X = f, so it is the identity on f. Composition is associative and unital because it is inherited from C. Therefore C/C is a category and composition is well defined."
      - id: kp2
        name: Terminal objects in slices; coslices by duality
        key_prerequisites: [initial-terminal-objects]
        constraints: "Require the learner to use terminal objects in slices; coslices by duality. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "In the slice category over a set C = {1,2,3,4}, the terminal object is the identity 1_C. Let f: {1,2} -> C satisfy f(1)=1 and f(2)=3. For the unique morphism h from f to 1_C, find h(2)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The slice object is f: {1,2} -> C with f(1)=1 and f(2)=3. A morphism to the terminal object 1_C: C -> C is a function h: {1,2} -> C with 1_C after h = f. The identity law forces h = f, so h(2) = f(2) = 3. The answer is 3."
          - problem: "In the coslice category under a set C = {1,2,3}, the initial object is 1_C. Let g: C -> {1,2,3,4} satisfy g(1)=4, g(2)=2, g(3)=1. For the unique morphism k from 1_C to g, find k(1)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The coslice object is g: C -> {1,2,3,4} with g(1)=4, g(2)=2, g(3)=1. By duality, the initial object is 1_C: C -> C. A morphism from 1_C to g is k: C -> {1,2,3,4} with k after 1_C = g. The identity law forces k = g, so k(1) = g(1) = 4. The answer is 4."
          - problem: "In Set/C let C={0,1,2}, and let f:{0,1}->C have values [2,0]. Construct the unique arrow from f to the terminal object id_C by writing and solving its commuting triangle. Give its value list, followed by the value list of the only endomorphism of id_C in the slice."
            answer: "2, 0, 0, 1, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two slice equations id h=f and id u=id force h=f and u=id, exhibiting terminality and its uniqueness. The resulting answer is 2, 0, 0, 1, 2."
          - problem: "Claim: in a slice category C/C, the identity 1_C is the initial object. Step 1: an object of C/C is an arrow f: X -> C. Step 2: a morphism from f to 1_C is h: X -> C with 1_C after h = f. Step 3: this equation forces h = f, so 1_C is terminal. Step 4: therefore 1_C is initial. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly defines an object of C/C. Step 2 correctly states the morphism condition 1_C after h = f. Step 3 correctly forces h = f and derives that 1_C is terminal. Step 4 is invalid because terminal does not imply initial; the correct dual statement would reverse the arrows. The answer is Step 4."
          - problem: "In the proof that 1_C is terminal in C/C, the forcing step uses the morphism condition to conclude the only candidate for h. Which equation does that step yield?"
            answer: "h = f"
            answer_contract: {"kind": "label", "options": [["h = f"], ["h = 1_C"], ["f = 1_C"], ["h = g"]]}
            solution_sketch: "A morphism h from f to 1_C must satisfy 1_C after h = f by the definition of slice morphism. The wrong option h = 1_C wrongly equates the mediating arrow with the terminal object itself. The wrong option f = 1_C wrongly identifies the object arrow f with the identity. The wrong option h = g brings in an unrelated map g that plays no role. Only h = f follows from the identity law. The answer is h = f."
          - problem: "In the proof that 1_C is terminal in C/C, the line 'a morphism h from f to 1_C must satisfy ?' is missing. Select the condition that makes the diagram commute."
            answer: "1_C after h = f"
            answer_contract: {"kind": "label", "options": [["1_C after h = f"], ["h after 1_C = f"], ["f after h = 1_C"], ["h after f = 1_C"]]}
            solution_sketch: "For f: X -> C and the terminal object 1_C: C -> C, a morphism h: X -> C must make the triangle commute. The wrong option h after 1_C = f composes in the wrong order, since h has domain X so 1_C cannot precede h. The wrong option f after h = 1_C reverses the direction and would make h a morphism out of 1_C. The wrong option h after f = 1_C confuses the slice object f with the mediating arrow and composes in the wrong direction. Only 1_C after h = f states the commuting condition. The answer is 1_C after h = f."
          - problem: "Write the full proof: the identity 1_C is terminal in the slice category C/C, and dually it is initial in the coslice category C\\C. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: an object of C/C is an arrow f: X -> C. Step 2: a morphism from f to 1_C is an arrow h: X -> C with 1_C after h = f. Step 3: the identity law simplifies this to h = f, so the only candidate is f itself. Step 4: hence every object has exactly one morphism to 1_C, and 1_C is terminal in C/C. Step 5: by duality, reverse all arrows; in the coslice C/C the objects are arrows C -> X. Step 6: the same forcing argument shows 1_C is initial in C/C. The full proof is complete."
    diagnostic_exemplar:
      problem: "Prove that the identity $1_C\\colon C\\to C$ is a terminal object of the slice category $\\mathcal{C}/C$."
      answer: "Let $f\\colon X\\to C$ be any object of $\\mathcal{C}/C$. A morphism $f\\to 1_C$ is a map $h\\colon X\\to C$ with $1_C\\circ h=f$, i.e. $h=f$. So exactly one morphism $f\\to 1_C$ exists (namely $f$ itself), which is the definition of $1_C$ being terminal."
      solution_sketch: "Unfold what a morphism $f\\to 1_C$ in $\\mathcal C/C$ is: a map $h$ with $1_C\\circ h=f$, i.e. $h=f$. The triangle condition pins $h$ down completely, so that hom-set is a singleton for every object $f$."
    anki_seeds:
      - front: "Objects of the slice category $\\mathcal{C}/C$?"
        back: "the morphisms $f\\colon X\\to C$ (arrows into $C$)."
        type: basic
      - front: "A morphism $f\\to g$ in the slice $\\mathcal{C}/C$ is..."
        back: "a map $h$ with $g\\circ h=f$ (the triangle over $C$ commutes)."
        type: basic
      - front: "Terminal object of $\\mathcal{C}/C$?"
        back: "$1_C\\colon C\\to C$."
        type: basic
