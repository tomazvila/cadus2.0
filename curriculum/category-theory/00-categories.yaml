        weight: 0.0
    knowledge_points:
      - id: kp1
        name: The data and axioms, read off in Set
        key_prerequisites: [composition-associativity-identity]
        step_check:
          step: 'the unit laws say $1_B\circ f=f=f\circ 1_A$'
          question: 'Why does the unit law put $1_B$ on the left of $f$ and $1_A$ on the right?'
          options:
            - 'The identity of the larger set goes on the left and the identity of the smaller set goes on the right'
            - 'Left and right are interchangeable, because $1_A$ and $1_B$ are both identity functions'
            - 'The identity on the codomain can follow $f$, and the identity on the domain can precede $f$'
            - 'Whichever identity is written first is the one that is composed first, whatever its set'
          answer: 'The identity on the codomain can follow $f$, and the identity on the domain can precede $f$'
          why: 'For $f\colon A\to B$ the composite $1_B \circ f$ applies $f$ first and then $1_B$ on $B$, while $f \circ 1_A$ applies $1_A$ on $A$ first; the other placements would not even be composable when $A \neq B$.'
        exemplars:
          - problem: 'In $\mathbf{Set}$, let $A=\{0,1\}$, $B=\{0,1,2\}$, $C=\{0,1\}$, and let $f\colon A\to B$ and $g\colon B\to C$ be given by $f(0)=2$, $f(1)=0$ and $g(0)=1$, $g(1)=0$, $g(2)=0$. Find $(g \circ f)(1)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $g \circ f$ goes from $A$ to $C$, because the codomain of $f$ is the domain of $g$. We have $(g \circ f)(1)=g(f(1))=g(0)=1$.'
          - problem: 'In $\mathbf{Set}$, let $A=\{0,1\}$ and $B=\{0,1,2\}$, and let $f\colon A\to B$ have $f(0)=2$ and $f(1)=0$. Find $(1_B \circ f)(0)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity $1_B$ fixes every element of $B$. So $(1_B \circ f)(0)=1_B(f(0))=1_B(2)=2$, which is just $f(0)$.'
          - problem: 'In $\mathbf{Set}$, a set $A$ has $2$ elements and a set $B$ has $3$ elements. How many morphisms are there from $A$ to $B$?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A morphism $A\to B$ is a function, and each of the $2$ elements of $A$ can go to any of the $3$ elements of $B$. So there are $3 \cdot 3=3^2=9$ morphisms.'
          - problem: 'Each of $3$ students joins exactly one of $2$ clubs. In $\mathbf{Set}$ these assignments are the morphisms from the set of students to the set of clubs. How many different assignments are there?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each student has $2$ choices, and the choices are independent. So there are $2 \cdot 2 \cdot 2=2^3=8$ assignments, which is the number of functions from a $3$-element set to a $2$-element set.'
          - problem: 'In a category, $f\colon A\to B$, $g\colon B\to C$ and $h\colon C\to A$ are arrows, and $A$, $B$, $C$ are different objects. For how many ordered pairs $(u,v)$ of different arrows among $f$, $g$, $h$ is the composite $v \circ u$ defined?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $v \circ u$ is defined when the codomain of $u$ is the domain of $v$. This happens for $(f,g)$, $(g,h)$ and $(h,f)$, which is $3$ pairs, and it fails for the other three.'
          - problem: 'A transport card works in three steps. The map $f$ sends each stop in $\{A,B,C,D\}$ to its zone in $\{1,2,3\}$ with $f(A)=f(B)=1$, $f(C)=2$, $f(D)=3$. The map $g$ sends a zone to a fare in dollars: $g(1)=2$, $g(2)=3$, $g(3)=5$. The map $h$ sends a fare in $\{2,3,5\}$ to the price after discount: $h(2)=1$, $h(3)=2$, $h(5)=4$. Find $((h \circ g) \circ f)(D)$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Stop $D$ is in zone $f(D)=3$. The fare is $g(3)=5$ and the discounted price is $h(5)=4$. By associativity the bracketing does not change the result, so the price is $4$.'
          - problem: 'In $\mathbf{Set}$, let $A=\{0\}$ and $B=\{0,1\}$, let $f\colon A\to B$ have $f(0)=1$, and let $g\colon B\to A$ be the only function from $B$ to $A$. Find $(f \circ g)(0)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $f \circ g$ is an arrow $B\to B$, and it is not an identity. We have $g(0)=0$, so $(f \circ g)(0)=f(0)=1$, and likewise $(f \circ g)(1)=1$, so it is the constant map to $1$.'
          - problem: 'Consider the objects $X=\{0\}$ and $Y=\{0,1,2\}$ of $\mathbf{Set}$ and all the functions between them (from $X$ to $X$, $X$ to $Y$, $Y$ to $X$ and $Y$ to $Y$). How many morphisms are there in total?'
            answer: '32'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Count each hom-set. There is $1$ function $X\to X$, there are $3$ functions $X\to Y$, there is $1$ function $Y\to X$ and there are $3^3=27$ functions $Y\to Y$. The total is $1+3+1+27=32$.'
          - problem: 'Write the full proof that $\mathbf{Set}$, with sets as objects, functions as morphisms, identity functions as identities and composition of functions as composition, satisfies the two axioms of a category.'
            answer: 'Set satisfies the unit and associativity laws'
            answer_contract: {"kind": "none"}
            solution_sketch: 'For composable $f$, $g$, $h$ both bracketings send each $x$ to $h(g(f(x)))$, so associativity holds. For $f\colon A\to B$ we have $(1_B \circ f)(x)=f(x)=(f \circ 1_A)(x)$ for every $x$, since an identity function fixes each element. So both unit laws hold, and composition is defined exactly when the codomain of one function is the domain of the next.'
        constraints: 'All items live in Set with small explicit sets and functions: composites, identities, hom-set sizes, composable pairs, a three-stage pipeline, and counts of morphisms. Hom-set counts mix the operations (a power, not a product); one item asks for a full proof.'
      - id: kp2
        name: A monoid as a one-object category
        key_prerequisites: [monoids]
        step_check:
          step: 'Let the identity morphism $1_*$ be the unit element $e$ of $M$'
          question: 'Why must the identity morphism of $BM$ be the unit element $e$ of $M$?'
          options:
            - 'The element $e$ is the first element of $M$, and the first arrow is always the identity morphism'
            - 'Composing with $e$ leaves every element unchanged, which is what an identity morphism does'
            - 'The unit $e$ is the only element whose composite with itself is defined in $BM$, so it is chosen'
            - 'An identity morphism must be an inverse of every element, and $e$ is that inverse for all of $M$'
          answer: 'Composing with $e$ leaves every element unchanged, which is what an identity morphism does'
          why: 'The unit law of a category says $1_* \circ m=m=m \circ 1_*$, and in $BM$ this reads $1_* \cdot m=m=m \cdot 1_*$, which is exactly the property of the unit $e$ of $M$; the monoid needs no inverses.'
        exemplars:
          - problem: 'The additive monoid $\mathbb Z_6$ is regarded as a one-object category $B\mathbb Z_6$ whose arrows are $0,1,\dots,5$ and whose composite of arrows $m$ and $n$ is $(m+n) \bmod 6$. Find $5 \circ 4$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $B\mathbb Z_6$ the composite is the monoid sum. We get $5+4=9$, and $9 \bmod 6=3$, so $5 \circ 4=3$.'
          - problem: 'A category has one object and two arrows $0$ and $1$. The composites are $0 \circ 0=0$, $0 \circ 1=1$, $1 \circ 0=1$ and $1 \circ 1=0$. Is this a category?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is a category", "it is a category", "a category"], ["no", "no, it is not a category", "it is not a category", "not a category"]]}
            solution_sketch: 'The arrow $0$ is the identity, because $0 \circ n=n=n \circ 0$ for both arrows. The composition is addition modulo $2$, which is associative. So the identity and associativity axioms hold, and the structure is a category, namely $B\mathbb Z_2$.'
          - problem: 'A category has one object and three arrows $0$, $1$, $2$. The composite is $x \circ y=x$ for all arrows $x$ and $y$. Is this a category?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is a category", "it is a category", "a category"], ["no", "no, it is not a category", "it is not a category", "not a category"]]}
            solution_sketch: 'An identity arrow $e$ would need $e \circ y=y$ for every $y$. But $e \circ y=e$, so $y=e$ for all $y$, which is false for the three arrows $0$, $1$, $2$. So there is no identity and the structure is not a category.'
          - problem: 'The arrows of a one-object category are all four functions from $\{0,1\}$ to $\{0,1\}$, and composition is composition of functions. Let $a(0)=1$, $a(1)=0$ and $b(0)=b(1)=0$. Find $(a \circ b)(1)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Apply $b$ first: $b(1)=0$. Then apply $a$: $a(0)=1$. So $(a \circ b)(1)=1$, while $(b \circ a)(1)=b(0)=0$, so the two composites differ.'
          - problem: 'The arrows of a one-object category are $1,2,3,6$, and the composite of $m$ and $n$ is $\operatorname{lcm}(m,n)$. Find $2 \circ 3$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite is the least common multiple of $2$ and $3$, which is $6$. The identity arrow of this category is $1$, because $\operatorname{lcm}(1,n)=n$.'
          - problem: 'In a photo editor, the arrows of a one-object category are the scale factors $k>0$ (rational numbers), and composing two arrows multiplies their factors. Which arrow $g$ satisfies $g \circ (\text{scale by }4)=\text{identity}$?'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity arrow is the scale factor $1$, and composing multiplies factors. So we need $g \cdot 4=1$, and dividing by $4$ gives $g=1/4$.'
          - problem: 'A traffic light has $3$ states in a cycle. The arrows of a one-object category are $0,1,2$, where $k$ means advance by $k$ states, and composition adds the advances modulo $3$. Which arrow is the composite of advance $2$ with advance $2$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Composing adds the advances: $2+2=4$. Reducing modulo $3$ gives $4 \bmod 3=1$, so advancing by $2$ twice is advancing by $1$.'
          - problem: 'Ben says that in the one-object category of the monoid $(\mathbb N,+)$ the composite of the arrows $3$ and $4$ is $12$, because composition multiplies. What is the correct composite?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In this category the composite is the monoid operation, which is addition. So the composite of $3$ and $4$ is $3+4=7$, and the identity arrow is $0$.'
          - problem: 'Write the full proof that for every monoid $M$ the one-object category $BM$, with arrows the elements of $M$ and composition the product of $M$, satisfies the axioms of a category.'
            answer: 'BM is a category for every monoid M'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Any two arrows have the single object as source and target, so every pair is composable and the product lies in $M$. Associativity of composition is the associativity of the product in $M$. The unit $e$ of $M$ satisfies $e m=m=m e$, so $e$ is the identity arrow of the object.'
        constraints: 'A monoid is turned into a one-object category: composites computed from a rule or table, the identity arrow found, verdicts on a given composition table with the deciding fact, and contexts of clock-like actions and scale factors. The convention for the composite is stated whenever the monoid is not commutative.'
      - id: kp3
        name: Recognizing non-examples (composition must be total)
        key_prerequisites: [relations-equivalence]
        step_check:
          step: 'the identity morphism $n \to n$ exists since $n$ divides itself'
          question: 'Why does the identity arrow exist at every object $n$ in the divisibility structure?'
          options:
            - 'The identity arrow exists because composition is total in this structure, so all composites exist'
            - 'The identity arrow at $n$ exists because $n$ divides $1$, the identity number, in every case'
            - 'Identity arrows are added to every structure, whatever the rule for arrows is, so none can fail'
            - 'Every positive number divides itself, so the arrow $n \to n$ is there for each $n$'
          answer: 'Every positive number divides itself, so the arrow $n \to n$ is there for each $n$'
          why: 'The arrows of this structure are given by the rule that $n$ divides $m$, and $n$ divides $n$ for every $n$, so each object has the loop $n \to n$ that serves as its identity.'
        exemplars:
          - problem: 'The objects are $0,1,2,3,4$, and there is exactly one arrow $a \to b$ whenever $|a-b| \le 1$, and no other arrows. Is this a category?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is a category", "it is a category", "a category"], ["no", "no, it is not a category", "it is not a category", "not a category"]]}
            solution_sketch: 'Each object has a loop, so identities exist. But the arrows $0 \to 1$ and $1 \to 2$ would need a composite $0 \to 2$, and $|0-2|=2>1$, so there is none. Composition is not total, so this is not a category.'
          - problem: 'The objects are $0,1,2,3,4$, and there is exactly one arrow $a \to b$ whenever $|a-b| \le 1$. How many pairs of composable arrows $a \to b$, $b \to c$ have no composite arrow $a \to c$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A composite $a \to c$ is missing exactly when $|a-c|=2$. The ordered pairs $(a,c)$ at distance $2$ are $(0,2)$, $(2,0)$, $(1,3)$, $(3,1)$, $(2,4)$, $(4,2)$, and each has one middle object. So there are $6$ such pairs.'
          - problem: 'The objects are $0,1,2,3,4,5$, and there is exactly one arrow $a \to b$ whenever $|a-b| \le 2$. How many pairs of composable arrows $a \to b$, $b \to c$ have no composite arrow $a \to c$?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $a \to c$ is missing exactly when $|a-c|$ is $3$ or $4$. Distance $3$ has $6$ ordered endpoint pairs, each with $2$ middle objects, giving $12$. Distance $4$ has $4$ ordered endpoint pairs, each with $1$ middle object, giving $4$. The total is $12+4=16$.'
          - problem: 'The objects are $0,1,2,3,4$, and there is exactly one arrow $a \to b$ whenever $a \le b+1$. How many pairs of composable arrows $a \to b$, $b \to c$ have no composite arrow $a \to c$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $a \to c$ exists exactly when $a \le c+1$. A pair $a \to b$, $b \to c$ without composite needs $a \ge c+2$, and $a \le b+1$ with $b \le c+1$ forces $a=c+2$ and $b=c+1$. This gives the triples $(2,1,0)$, $(3,2,1)$, $(4,3,2)$, so $3$ pairs.'
          - problem: 'The objects are $1$, $2$, $4$, with one arrow $a \to b$ whenever $a$ divides $b$, except that the arrow $1 \to 4$ is removed. What fraction of the composable pairs of arrows have no composite?'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The arrows are the loops at $1$, $2$, $4$ and the arrows $1 \to 2$ and $2 \to 4$, which makes $5$ arrows. Counting composable pairs by middle object gives $2+4+2=8$ pairs. Only the pair $1 \to 2$, $2 \to 4$ has no composite, so the fraction is $1/8$.'
          - problem: 'The objects are $0,1,2$, and there is exactly one arrow $a \to b$ whenever $|a-b| \le 1$. How many arrows must be added so that the structure becomes a category?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $0 \to 2$ of $0 \to 1$ and $1 \to 2$ is missing, and so is the composite $2 \to 0$. Adding the two arrows $0 \to 2$ and $2 \to 0$ makes every pair of objects joined, so all composites exist. So $2$ arrows are added.'
          - problem: 'The cities $A,B,C,D$ are objects, and there is an arrow from one city to another when there is a direct flight: $A \to B$, $B \to C$, $C \to D$ and $A \to C$, plus a loop at each city. How many pairs of composable arrows have no composite arrow, that is, no direct flight for the whole trip?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pair $B \to C$, $C \to D$ needs a flight $B \to D$, and the pair $A \to C$, $C \to D$ needs a flight $A \to D$; neither exists. The pair $A \to B$, $B \to C$ has the composite $A \to C$. So $2$ pairs have no composite.'
          - problem: 'The objects are $1,2,\dots,16$. There is a loop at each object, and one arrow $a \to 2a$ whenever $2a \le 16$, and no other arrows. How many pairs of composable arrows have no composite arrow?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composable pairs of non-identity arrows are $a \to 2a$, $2a \to 4a$, and the composite would be an arrow $a \to 4a$, which is not allowed. We need $4a \le 16$, so $a=1,2,3,4$. That gives $4$ pairs.'
          - problem: 'A structure has one object and four arrows $0,1,2,3$, with composite $m \circ n=|m-n|$. Exactly one axiom fails. Which one: closure (the composite is always an arrow), associativity, or the identity law?'
            answer: 'associativity'
            answer_contract: {"kind": "label", "options": [["associativity", "the associativity", "associative", "it is not associative", "the associativity law", "associativity fails"], ["closure", "closure of composition", "composition is not total", "totality"], ["identity law", "the identity law", "identities", "the identity"]]}
            solution_sketch: 'The composite $|m-n|$ is always one of $0,1,2,3$, so closure holds, and $0$ is an identity because $|0-n|=n=|n-0|$. But $(3 \circ 1) \circ 2=|2-2|=0$, while $3 \circ (1 \circ 2)=|3-1|=2$. So associativity fails.'
          - problem: 'The objects are $0,1,2,3$, and there is exactly one arrow $a \to b$ whenever $a \le b$. How many pairs of composable arrows $a \to b$, $b \to c$ have no composite arrow $a \to c$?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite $a \to c$ exists exactly when $a \le c$. For composable arrows we have $a \le b$ and $b \le c$, so $a \le c$ and the composite always exists. So $0$ pairs have no composite, and this structure is a category.'
          - problem: 'Write the full proof that the structure with objects $0,1,2,3$ and exactly one arrow $a \to b$ whenever $|a-b|\le 1$ is not a category, and name the axiom that fails.'
            answer: 'Composition is not total, so no category'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Every object has a loop since $|a-a|=0\le 1$, so identities exist. The arrows $0 \to 1$ and $1 \to 2$ are composable, but a composite $0 \to 2$ would be an arrow with $|0-2|=2>1$, and there is none. So the axiom that every composable pair has a composite fails.'
        constraints: 'Each non-example is given in full by a rule on the objects (or by a list of arrows) and fails exactly one axiom. The learner decides category or not, counts composable pairs with no composite, repairs the structure, or names the failing axiom among options listed in the question.'
      - id: kp4
        name: A preorder as a thin category
        key_prerequisites: [partial-orders]
        step_check:
          step: 'Any two parallel paths in the category are equal because each hom-set has at most one element'
          question: 'Why are any two parallel paths in a thin category equal?'
          options:
            - 'Parallel paths have the same objects, and the only arrow between two objects is unique'
            - 'Parallel paths always pass through the same intermediate objects, so they use the same arrows'
            - 'Composition in a thin category is commutative, so the order of arrows does not matter at all'
            - 'Every path equals the identity arrow, because a thin category has so few arrows in it overall'
          answer: 'Parallel paths have the same objects, and the only arrow between two objects is unique'
          why: 'Two parallel paths start at the same object and end at the same object, so both composites lie in one hom-set; that hom-set has at most one arrow, so the composites are the same arrow.'
        exemplars:
          - problem: 'Regard the divisibility order on $\{1,2,3,6\}$ as a category, with one arrow $a \to b$ whenever $a$ divides $b$. How many morphisms does it have?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Count the arrows out of each object. From $1$ there are $4$ arrows, from $2$ there are $2$ (to $2$ and $6$), from $3$ there are $2$ (to $3$ and $6$), and from $6$ there is $1$. The total is $4+2+2+1=9$.'
          - problem: 'A category has objects $0,1,2,3$ and is thin, which means at most one arrow between any two objects. It is generated by the arrows $0 \to 1$, $1 \to 2$, $2 \to 3$, so it has these arrows, the identities, and all the composites. How many morphisms does it have?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Composites give an arrow $i \to j$ for every $i \le j$, and the identities are the cases $i=j$. There are $4+3+2+1=10$ pairs with $i \le j$, so there are $10$ morphisms.'
          - problem: 'A thin category has objects $1,2,3$ and exactly these arrows: the three identities, an arrow $1 \to 2$ and an arrow $2 \to 1$. How many morphisms does it have?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The arrows are $1 \to 1$, $2 \to 2$, $3 \to 3$, $1 \to 2$ and $2 \to 1$. That is $3+2=5$ arrows, and the composites $1 \to 2 \to 1$ and $2 \to 1 \to 2$ are the identities.'
          - problem: 'In the thin category with objects $1,2,3$ whose arrows are the three identities, an arrow $1 \to 2$ and an arrow $2 \to 1$, is the arrow $1 \to 2$ an isomorphism?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is an isomorphism", "it is an isomorphism", "an isomorphism"], ["no", "no, it is not an isomorphism", "it is not an isomorphism", "not an isomorphism"]]}
            solution_sketch: 'The arrow $2 \to 1$ goes back. The composite $2 \to 1 \to 2$ is an arrow $2 \to 2$, and the only arrow $2 \to 2$ is the identity, and the same holds for $1 \to 2 \to 1$. So the arrow $1 \to 2$ has an inverse and is an isomorphism.'
          - problem: 'Tokens are numbered $1$ to $30$. A token $a$ can be traded for a token $b$ when $a$ divides $b$, and a token can be traded for itself. These trades are the arrows of a category. How many trades start from token $5$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The arrows out of $5$ go to the multiples of $5$ up to $30$, which are $5,10,15,20,25,30$. Counting them is the division $30 \div 5=6$, so there are $6$ trades.'
          - problem: 'In the divisibility category on $\{1,2,\dots,12\}$ the arrows $3 \to 6$ and $6 \to 12$ are composed. The composite is an arrow from which object to which object?'
            answer: '(3, 12)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The composite $6 \to 12$ after $3 \to 6$ starts where the first arrow starts and ends where the second arrow ends. So it is an arrow from $3$ to $12$, which exists because $3$ divides $12$.'
          - problem: 'A pizza has $3$ optional toppings. Each selection of toppings is an object, and there is one arrow $S \to T$ whenever every topping of $S$ is also in $T$. How many arrows are there in this category?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'For each topping there are $3$ possibilities for the pair $(S,T)$: in neither, in $T$ only, or in both. The choices for the $3$ toppings are independent, so the number of arrows is $3^3=27$.'
          - problem: 'A thin category has objects $0,1,2$ and the arrows $0 \to 0$, $1 \to 1$, $2 \to 2$, $0 \to 1$ and $1 \to 2$. It is not yet a category. Which arrow must be added, given as source and target?'
            answer: '(0, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The arrows $0 \to 1$ and $1 \to 2$ are composable, so a composite from $0$ to $2$ is required. All other composites involve identities and exist. So the arrow to add is $0 \to 2$.'
          - problem: 'Lena counts the arrows of the divisibility category on $\{1,2,3,5\}$ by listing the pairs $a \to b$ with $a<b$ and $a$ dividing $b$, and gets $3$. What is the correct number of arrows?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Lena counted only the arrows between different objects, which are $1 \to 2$, $1 \to 3$, $1 \to 5$. Every object also has an identity arrow, which adds $4$ more. The correct number is $3+4=7$.'
          - problem: 'Write the full proof that every preorder $(P,\le)$ is a category with one arrow $x \to y$ exactly when $x \le y$, and explain why every diagram in it commutes.'
            answer: 'A preorder gives a category with commuting diagrams'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Reflexivity $x \le x$ gives the identity arrows, and transitivity gives a composite arrow $x \to z$ for arrows $x \to y$ and $y \to z$. Each hom-set has at most one arrow, so associativity and the unit laws hold because both sides lie in one hom-set. For the same reason two parallel paths are equal, so every diagram commutes.'
        constraints: 'A preorder is read as a thin category: arrows counted from a relation or from generating arrows (closure under identities and composites), arrows out of an object in divisibility, composites of named arrows, the missing arrow of a relation, and arrows both ways between two objects. Antisymmetry is not required.'
    diagnostic_exemplar:
      problem: "Take as objects all integers, with a single arrow $m\\to n$ whenever $|n-m|\\le 1$ (and no other arrows). Is this a category? Check the axioms and name the one that fails, if any."
      answer: "Not a category. Identities exist since $|m-m|=0\\le 1$, but composition is not total: there are arrows $0\\to 1$ and $1\\to 2$, yet no arrow $0\\to 2$ since $|2-0|=2>1$, so the composite of two arrows need not exist."
      solution_sketch: "Identities are fine, since $|m-m|=0\\le 1$, so hunt for an axiom that can fail: look for a composable pair whose composite arrow is missing. The pair $0\\to 1$ and $1\\to 2$ with no arrow $0\\to 2$ breaks totality of composition."
    anki_seeds:
      - front: "In a category, each ordered pair of objects $(A,B)$ has a set of what?"
        back: "morphisms (arrows) $A\\to B$."
        type: basic
      - front: "In a category, what distinguished morphism does every object $A$ carry?"
        back: "an identity $1_A\\colon A\\to A$."
        type: basic
      - front: "What operation combines $f\\colon A\\to B$ and $g\\colon B\\to C$ into a morphism $A\\to C$?"
        back: "composition, giving $g\\circ f$."
        type: basic
      - front: "State the associativity axiom for composition in a category."
        back: "$(h\\circ g)\\circ f = h\\circ(g\\circ f)$."
        type: basic
      - front: "State the unit law for composition with identities (for $f\\colon A\\to B$)."
        back: "$1_B\\circ f = f = f\\circ 1_A$."
        type: basic
      - front: "A monoid is exactly a category with {{c1::one object}}."
        back: "one object"
        type: cloze

