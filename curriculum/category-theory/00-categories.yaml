            answer: "unique arrow out to every object"
            answer_contract: {"kind": "label", "options": [["unique arrow out to every object"], ["unique arrow in from every object"], ["an arrow out to every object"], ["no arrow out to any object"]]}
            solution_sketch: "An initial object I has exactly one morphism from I to every object X. The option 'unique arrow in from every object' describes a terminal object instead. The option 'an arrow out to every object' forgets that the arrow must be unique. The option 'no arrow out to any object' fails because an initial object must have an arrow to every object. The answer is unique arrow out to every object."
          - problem: "In the poset category on the numbers 2, 3, and 6 ordered by divisibility, how many initial objects are there?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a poset category, a unique arrow x to y exists exactly when x <= y. An initial object would need x <= y for every y, so it must be a least element. In the divisibility poset on 2, 3, and 6, 2 does not divide 3 and 3 does not divide 2, and 6 does not divide 2 or 3. No least element exists. The answer is 0."
          - problem: "In the category Set, which object is initial? Select the correct description."
            answer: "empty set"
            answer_contract: {"kind": "label", "options": [["empty set"], ["one-element set"], ["two-element set"], ["every set"]]}
            solution_sketch: "An initial object I has exactly one morphism from I to every set X. The empty set has exactly one map to any set: the empty function. The option 'one-element set' fails because a one-element set has two maps to a two-element set. The option 'two-element set' fails because it has more than one map to a three-element set. The option 'every set' fails because not every set has a unique map to every other set. The answer is empty set."
          - problem: "In the discrete category with three objects, how many terminal objects are there?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A terminal object T needs exactly one arrow X to T for every object X. In the discrete category on three objects, the only arrows are identities. No arrow goes from one object to a different object. Thus no object can receive an arrow from the other two objects, so no terminal object exists. The answer is 0."
          - problem: "In the poset category on the numbers 1, 2, 4, and 8 ordered by divisibility, give the terminal object as a number."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a poset category, a unique arrow x to y exists exactly when x <= y. A terminal object T must satisfy y <= T for every y, so T is a greatest element. Under divisibility on 1, 2, 4, and 8, every listed number divides 8, and the only arrow to 8 from each is unique. Thus 8 is the terminal object. The answer is 8."
          - problem: "In the category with objects A and B and one arrow from A to B besides the identity arrows, how many initial objects are there?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The objects are A and B, with identity arrows and one arrow from A to B. An initial object must have exactly one arrow to every object. A has the identity A to A and the given arrow A to B, so A is initial. B has no arrow to A, so B is not initial. Exactly one object is initial. The answer is 1."
          - problem: "Write the full proof: in Set the empty set is initial and any one-element set is terminal. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Recall that an object I is initial if for every object X there is exactly one morphism I to X. An object T is terminal if for every object X there is exactly one morphism X to T. Step 2: Show the empty set is initial. For any set X, the empty function from the empty set to X assigns no elements and so exists. Any two such functions have the same empty graph, so the function is unique. Step 3: Show a singleton is terminal. Let T = {t}. For any set X, the constant function f(x) = t is a map X to T. If g is any map X to T, then g(x) must be t because t is the only element of T, so g = f. Thus there is exactly one map. Step 4: Therefore the empty set is initial and every one-element set is terminal in Set."
      - id: kp2
        name: Uniqueness up to unique isomorphism
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "Require uniqueness up to unique isomorphism. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Suppose T,S are terminal. For each inference give 1 if valid and0otherwise: (i) vu=id_T because T is terminal; (ii) uv=id_S because S is terminal; (iii) T=S because the two comparison arrows are inverse; (iv) any w:T->S equals u because S is terminal. This is an audit of the uniqueness-of-universal-objects proof."
            answer: "1, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
