    knowledge_points:
      - id: kp1
        name: The discrete category on a set
        key_prerequisites: [category-definition]
        step_check:
          step: 'Since there is exactly one identity morphism for each object, the total number of morphisms is $|S| = 3$'
          question: 'Why does the number of morphisms of $\mathrm{disc}(S)$ equal the number of objects?'
          options:
            - 'Each object has one morphism to every object, so the count is the number of objects'
            - 'Each pair of different objects has no morphism, so the identities are not counted'
            - 'Every morphism is an identity, and each object has exactly one identity'
            - 'The morphisms are the objects themselves, so the count cannot be anything else'
          answer: 'Every morphism is an identity, and each object has exactly one identity'
          why: 'Between different objects there are no morphisms, and an object has only its identity as an endomorphism, so morphisms and objects match one to one and there are $|S|=3$ morphisms.'
        exemplars:
          - problem: 'The discrete category on $S=\{x,y,z\}$ has the elements of $S$ as objects and only identity arrows. How many morphisms does it have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The only morphisms are the identities $1_x$, $1_y$, $1_z$, one for each object. So there are $3$ morphisms.'
          - problem: 'Let $\mathbf 3$ be the discrete category on $\{a,b,c\}$ and let $\mathbf C$ be the poset category of $0<1<2<3$. A functor $F\colon \mathbf 3 \to \mathbf C$ sends objects to objects and identities to identities. How many such functors are there?'
            answer: '64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A discrete category has no arrows besides identities, so a functor is fixed by where the $3$ objects go. Each of the $3$ objects can go to any of the $4$ objects of $\mathbf C$, independently. So there are $4^3=64$ functors.'
          - problem: 'Let $\mathbf 2$ be the discrete category on $\{a,b\}$ and let $\mathbf C$ be the one-object category of the additive monoid $\mathbb Z_3$. How many functors $\mathbf 2 \to \mathbf C$ are there?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Both objects must go to the only object of $\mathbf C$. The only arrows of $\mathbf 2$ are identities, and they must go to the identity $0$. So there is exactly $1$ functor.'
          - problem: 'Let $\mathbf C$ be the poset category $0<1<2$ and let $\mathbf D$ be the discrete category on $5$ objects. How many functors $\mathbf C \to \mathbf D$ are there?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The arrows $0 \to 1$ and $1 \to 2$ must go to arrows of $\mathbf D$, which are only identities. So $F(0)=F(1)=F(2)$, and the functor is fixed by this one object. There are $5$ choices, so $5$ functors.'
          - problem: 'A category has objects $0,1,2$ and exactly these arrows: the three identities and one arrow $0 \to 1$. Is it a discrete category?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is discrete", "it is discrete", "discrete"], ["no", "no, it is not discrete", "it is not discrete", "not discrete"]]}
            solution_sketch: 'A discrete category has only identity arrows. This category also has the arrow $0 \to 1$ between two different objects, so it is not discrete.'
          - problem: 'Seven villages are the objects of a category. Each village has one arrow to itself, which is staying put, and there are no roads, so there are no arrows between different villages. How many arrows are there?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With no roads, the only arrows are the stays, one for each village. So there are $7$ arrows, and this is the discrete category on $7$ objects.'
          - problem: 'Let $\mathbf A$ be the discrete category on $\{0,1\}$ and $\mathbf B$ the discrete category on $\{a,b,c\}$. The product category $\mathbf A \times \mathbf B$ has as objects the pairs $(i,j)$ and as arrows the pairs of arrows. How many morphisms does it have?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The objects are the pairs $(i,j)$, and there are $2 \cdot 3=6$ of them. An arrow is a pair of identities, so there is one arrow at each object. So there are $6$ morphisms.'
          - problem: 'Ravi says the discrete category on a set of $4$ elements has $16$ morphisms, one for each ordered pair of objects. What is the correct number of morphisms?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A discrete category has an arrow only from an object to itself, and that arrow is the identity. So the morphisms are $4$ identities. Ravi counted the ordered pairs, which is the count for an indiscrete category.'
          - problem: 'Each of $3$ lamps is given one of $5$ colours. Think of the lamps as the objects of a discrete category and the colours as the objects of a discrete category $\mathbf D$. A functor from the first to $\mathbf D$ sends each lamp to a colour. How many functors are there?'
            answer: '125'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the $3$ lamps independently goes to one of the $5$ colours. So the number of functors is $5 \cdot 5 \cdot 5=5^3=125$.'
          - problem: 'The objects are $4$, $6$ and $9$, and there is one arrow $a \to b$ whenever $a$ divides $b$. Is this a discrete category?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is discrete", "it is discrete", "discrete"], ["no", "no, it is not discrete", "it is not discrete", "not discrete"]]}
            solution_sketch: 'No two of $4$, $6$, $9$ divide each other, so the only arrows are the loops $a \to a$. A category with only identity arrows is discrete, so the answer is yes.'
          - problem: 'Write the full proof that for every set $S$ the discrete category $\mathrm{disc}(S)$, with objects the elements of $S$ and only identity arrows, is a category with exactly $|S|$ morphisms.'
            answer: 'disc(S) is a category with |S| morphisms'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The composite of two identities is an identity, so composition is defined on the only composable pairs $(1_x,1_x)$. Associativity and the unit laws then reduce to $1_x \circ 1_x=1_x$. There is exactly one identity for each element of $S$ and no other arrow, so the number of morphisms is $|S|$.'
        constraints: 'The discrete category is given by its objects only: morphisms and composable pairs counted, product with another discrete category, functors out of and into discrete categories counted by their object assignments, a verdict that a given category is discrete, and contexts of separated places. A discrete category has only identity arrows.'
      - id: kp2
        name: The indiscrete category
        key_prerequisites: [poset-monoid-categories]
        try_first:
          problem: 'Six towns are joined so that for every ordered pair of towns, including a town and itself, there is exactly one road. How many roads are there?'
          answer_contract: {"kind": "exact"}
          answer: '36'
          reveal: 'Each of the $6$ towns has one road to each of the $6$ towns, so there are $6 \cdot 6=36$ roads. A category with exactly one arrow between every ordered pair of objects is called indiscrete.'
        step_check:
          step: 'Since $\mathrm{Hom}(x,z)=\{*\}$ has exactly one element, there is only one possible value'
          question: 'Why is the composite $g\circ f$ forced in $\mathrm{indisc}(S)$?'
          options:
            - 'The composite is an arrow from $x$ to $z$, and there is only one such arrow'
            - 'The composite of two arrows is always the identity arrow of the source object $x$'
            - 'Composition is defined as the arrow $f$ followed by the arrow $g$ as a pair'
            - 'The composite is the arrow $y \to z$, since the first arrow can be dropped'
          answer: 'The composite is an arrow from $x$ to $z$, and there is only one such arrow'
          why: 'The composite $g \circ f$ must lie in $\mathrm{Hom}(x,z)$, and that set has a single element, so there is no choice; the same fact gives associativity and the unit laws.'
        exemplars:
          - problem: 'The indiscrete category on $S=\{0,1,2\}$ has exactly one arrow from each object to each object. How many morphisms does it have?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There is one arrow for each ordered pair of objects. There are $3 \cdot 3=9$ ordered pairs, so there are $9$ morphisms.'
          - problem: 'The indiscrete category on a set $S$ with $6$ elements has exactly one arrow from each object to each object. How many morphisms start at one given object $x$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'From $x$ there is one arrow to each of the $6$ objects, including $x$ itself. So $6$ morphisms start at $x$.'
          - problem: 'In the indiscrete category on $\{0,1,2\}$ the unique arrow $0 \to 1$ is composed with the unique arrow $1 \to 2$. The composite is an arrow from which object to which object?'
            answer: '(0, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The composite starts at $0$ and ends at $2$. Since there is only one arrow from $0$ to $2$, the composite is that arrow.'
          - problem: 'The indiscrete category $\mathbf D$ has objects $a,b,c$, and $F\colon \mathbf D \to \mathbf{Set}$ is a functor with $F(a)$ a set of $2$ elements. How many elements does $F(b)$ have?'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The unique arrow $a \to b$ has an inverse in $\mathbf D$, so $F$ sends it to a bijection from $F(a)$ to $F(b)$. Hence $F(b)$ has $2$ elements.'
          - problem: 'The indiscrete category on a set $S$ with $5$ elements has exactly one arrow between every ordered pair of objects. How many of its morphisms are isomorphisms?'
            answer: '25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Take the arrow $u\colon x \to y$ and the arrow $v\colon y \to x$. The composite $v \circ u$ is an arrow $x \to x$, so it is $1_x$, and likewise $u \circ v=1_y$. So every arrow is an isomorphism, and there are $5 \cdot 5=25$ of them.'
          - problem: 'Seven cities are joined so that between any two cities there is exactly one direct road in each direction, and each city also has one road to itself. Take the cities as objects and the roads as arrows. How many arrows are there?'
            answer: '49'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There is one road for each ordered pair of cities, including a city with itself. So there are $7 \cdot 7=49$ roads.'
          - problem: 'A network has exactly one arrow between every ordered pair of its places, including a place and itself, and it has $81$ arrows in all. How many places does it have?'
            answer: '9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'If there are $n$ places, there are $n^2$ arrows. So $n^2=81$, and taking the square root gives $n=9$ places.'
          - problem: 'Mia says the indiscrete category on $4$ objects has $4 \cdot 3=12$ morphisms, because an arrow needs two different objects. What is the correct number of morphisms?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The indiscrete category has one arrow for every ordered pair, including pairs of equal objects, because each object needs at least its identity. So there are $4 \cdot 4=16$ morphisms, which is $12$ arrows between different objects and $4$ loops.'
          - problem: 'The indiscrete category $\mathbf D$ has objects $a,b,c$. A functor $F\colon \mathbf D \to \mathbf{Set}$ has $F(a)=F(b)=\{0,1\}$ and sends the arrow $a \to b$ to the swap $0\mapsto1$, $1\mapsto0$. What is $F(g)(0)$ for the arrow $g\colon b \to a$?'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'In $\mathbf D$ the composite of $a \to b$ and $g\colon b \to a$ is an arrow $a \to a$, so it is $1_a$ because there is only one arrow $a \to a$. Hence $F(g)$ undoes the swap, so $F(g)$ is the swap and $F(g)(0)=1$.'
          - problem: 'Write the full proof that in the indiscrete category on a set $S$ the composite of the arrow $x \to y$ with the arrow $y \to z$ is the arrow $x \to z$, and that every morphism is an isomorphism.'
            answer: 'Composites are forced and all arrows are isos'
            answer_contract: {"kind": "none"}
            solution_sketch: 'The composite of $x \to y$ and $y \to z$ lies in $\mathrm{Hom}(x,z)$, which has exactly one element, so it is that arrow. For the arrow $u\colon x \to y$ and the arrow $v\colon y \to x$, the composite $v \circ u$ lies in $\mathrm{Hom}(x,x)$, so it is $1_x$, and likewise $u \circ v=1_y$. So every arrow has an inverse.'
        constraints: 'The indiscrete category has exactly one arrow between every ordered pair of objects: morphisms counted (a square, and its inverse operation), forced composites as endpoints, isomorphisms, a functor to Set decided by the sizes of the images, and contexts of fully connected networks. An indiscrete category is a groupoid.'
      - id: kp3
        name: Shape categories for diagrams
        key_prerequisites: [commutative-diagrams]
        step_check:
          step: 'no non-identity arrow ends at $1$, so there are no composable pairs of non-identity arrows'
          question: 'Why are there no composable pairs of non-identity arrows in the span $0\leftarrow 1\to 2$?'
          options:
            - 'The span has only two arrows, and two arrows can never be composed'
            - 'Both non-identity arrows start at $1$, so no arrow ends where another one starts'
            - 'Arrows that start at the same object are composed as a pair, not one after the other'
            - 'The identities absorb every non-identity arrow when they are composed'
          answer: 'Both non-identity arrows start at $1$, so no arrow ends where another one starts'
          why: 'A composite $v \circ u$ needs the target of $u$ to be the source of $v$. Here $u$ and $v$ both start at $1$ and end at $0$ and $2$, which have no outgoing non-identity arrow, so there is nothing to compose.'
        exemplars:
          - problem: 'The arrow shape $\mathbf 2$ has two objects $0$, $1$ and one non-identity arrow $0 \to 1$. How many functors $\mathbf 2 \to \mathbf C$ are there when $\mathbf C$ is the poset category $0<1<2<3$?'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor $\mathbf 2 \to \mathbf C$ is the same as a choice of one arrow of $\mathbf C$, the image of $0 \to 1$. The arrows of $\mathbf C$ are the pairs $i \le j$, and there are $4+3+2+1=10$ of them. So there are $10$ functors.'
          - problem: 'The parallel-pair shape has objects $0$, $1$ and two different arrows $0 \to 1$. A diagram of this shape in $\mathbf{Set}$ assigns to $0$ the set $\{0,1\}$ and to $1$ the set $\{0,1,2\}$, and to each of the two arrows a function from $\{0,1\}$ to $\{0,1,2\}$. How many such diagrams are there?'
            answer: '81'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'There are $3^2=9$ functions from $\{0,1\}$ to $\{0,1,2\}$. The two arrows are assigned independently, since no equation relates them. So there are $9 \cdot 9=81$ diagrams.'
          - problem: 'A diagram of the chain shape $a \to b \to c$ in $\mathbf{Set}$ assigns to $a \to b$ the function $f=[1,0]$ from $\{0,1\}$ to $\{0,1\}$, meaning $f(0)=1$, $f(1)=0$, and to $b \to c$ the function $g=[2,0]$ from $\{0,1\}$ to $\{0,1,2\}$, meaning $g(0)=2$, $g(1)=0$. The long arrow $a \to c$ goes to the composite function. Find its value at $1$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The long arrow is the composite of $a \to b$ and $b \to c$, so it goes to $g \circ f$. We get $(g \circ f)(1)=g(f(1))=g(0)=2$.'
          - problem: 'Let $\mathbf J$ be the discrete shape on two objects and let $\mathbf I$ be the indiscrete category on $\{0,1\}$. How many functors $\mathbf J \to \mathbf I$ are there?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The shape has no non-identity arrows, so a functor is fixed by the images of its $2$ objects. Each object goes to $0$ or $1$ independently, so there are $2 \cdot 2=4$ functors.'
          - problem: 'The span shape $0 \leftarrow 1 \to 2$ has arrows $u\colon 1 \to 0$ and $v\colon 1 \to 2$. A diagram of this shape in $\mathbf{Set}$ has $F(1)=\{0,1\}$, $F(0)=\{0,1,2\}$ and $F(2)=\{0,1\}$. How many such diagrams are there?'
            answer: '36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The arrow $u$ goes to a function from $\{0,1\}$ to $\{0,1,2\}$, and there are $3^2=9$ of them. The arrow $v$ goes to a function from $\{0,1\}$ to $\{0,1\}$, and there are $2^2=4$ of them. The choices are independent, so there are $9 \cdot 4=36$ diagrams.'
          - problem: 'Let $\mathbf C$ have two objects $A$, $B$ and exactly one non-identity arrow $u\colon A \to B$. Is the assignment that sends both objects $0$ and $1$ of the arrow shape $\mathbf 2$ to $A$, and the arrow $0 \to 1$ to $u$, a functor $\mathbf 2 \to \mathbf C$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is a functor", "it is a functor", "a functor"], ["no", "no, it is not a functor", "it is not a functor", "not a functor"]]}
            solution_sketch: 'A functor sends the arrow $0 \to 1$ to an arrow from $F(0)$ to $F(1)$. Here $F(0)=F(1)=A$, but $u$ goes from $A$ to $B$, so the types do not match. So this is not a functor.'
          - problem: 'The commutative square shape is the poset category on $\{0,1,2,3\}$ with $0<1$, $0<2$, $1<3$, $2<3$ (and $0<3$). How many functors from it to the poset category $0<1$ are there?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A functor to the poset $0<1$ is an order-preserving map. The set of objects sent to $1$ must be closed upwards: it can be empty, $\{3\}$, $\{1,3\}$, $\{2,3\}$, $\{1,2,3\}$ or all four. So there are $6$ functors.'
          - problem: 'A diagram of the chain shape $a \to b \to c$ in $\mathbf{Set}$ has $F(a)$, $F(b)$, $F(c)$ all equal to the set of integers. The arrow $a \to b$ goes to $x \mapsto 2x$ and $b \to c$ goes to $x \mapsto x+3$. The long arrow $a \to c$ goes to the composite function. What is its value at $5$?'
            answer: '13'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The long arrow goes to the composite of the two functions, with $2x$ applied first. So the value at $5$ is $2 \cdot 5=10$ and then $10+3=13$.'
          - problem: 'On a production line, a diagram of the chain shape $a \to b \to c$ uses rational numbers throughout. The arrow $a \to b$ goes to $n \mapsto 30n$ (eggs from cartons of $30$) and the arrow $b \to c$ goes to $e \mapsto e/6$ (boxes holding $6$ eggs). The long arrow $a \to c$ goes to the composite function. What is its value at $4$ cartons?'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $30 \cdot 4=120$ eggs. Then dividing by the $6$ eggs in a box gives $120/6=20$ boxes. So the long arrow has value $20$ at $4$.'
          - problem: 'Zoe counts the functors from the parallel-pair shape (objects $0$, $1$ and two different arrows $0 \to 1$) to the category $\mathbf C$ with objects $A$, $B$ and exactly one non-identity arrow $u\colon A \to B$, and gets $4$, because each of the two arrows can go to $u$ or to an identity. What is the correct number?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Choose the images $(F0,F1)$ first. For $(A,A)$ both arrows go to $1_A$, giving $1$ functor, and for $(B,B)$ both go to $1_B$, giving $1$. For $(A,B)$ both go to $u$, giving $1$, and $(B,A)$ gives $0$ because there is no arrow $B \to A$. The total is $1+1+1+0=3$.'
          - problem: 'A diagram of the chain shape $a \to b \to c$ uses rational numbers throughout. The arrow $a \to b$ goes to $e \mapsto e/12$ (dozens from eggs) and the arrow $b \to c$ goes to $d \mapsto 3d$ (a dozen costs $3$ dollars). The long arrow $a \to c$ goes to the composite function. What is its value at $60$ eggs?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'First $60/12=5$ dozens. Then $3 \cdot 5=15$ dollars. So the long arrow has value $15$ at $60$.'
          - problem: 'Let $\mathbf C$ have objects $A$, $B$ and exactly two non-identity arrows $u,v\colon A \to B$. How many functors are there from the parallel-pair shape (objects $0$, $1$ and two different arrows $0 \to 1$) to $\mathbf C$?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Choose the images of $0$ and $1$ first. For $(A,A)$ and for $(B,B)$ both arrows go to the identity, giving $1$ functor each. For $(A,B)$ each of the two arrows goes to $u$ or $v$ independently, giving $2 \cdot 2=4$ functors, and $(B,A)$ gives none. The total is $1+1+4=6$.'
          - problem: 'Let $\mathbf C$ have two objects $A$, $B$ and exactly one non-identity arrow $u\colon A \to B$. Is the assignment that sends the object $0$ of the parallel-pair shape to $A$, the object $1$ to $B$, and both arrows $0 \to 1$ to $u$, a functor?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is a functor", "it is a functor", "a functor"], ["no", "no, it is not a functor", "it is not a functor", "not a functor"]]}
            solution_sketch: 'Both arrows go from $F(0)=A$ to $F(1)=B$, so the types match. The shape has no composable pairs besides identities, so no equation constrains the two images, and they may be equal. So this is a functor.'
          - problem: 'Write the full proof that for every category $\mathbf C$ the functors from the arrow shape $\mathbf 2=(0 \to 1)$ to $\mathbf C$ correspond one to one with the morphisms of $\mathbf C$.'
            answer: 'Functors from 2 to C match morphisms of C'
            answer_contract: {"kind": "none"}
            solution_sketch: 'A functor $F$ sends the arrow $0 \to 1$ to a morphism $F(0) \to F(1)$ of $\mathbf C$, and sends the identities to identities. Conversely a morphism $m\colon A \to B$ defines $F$ by $0 \mapsto A$, $1 \mapsto B$, $0 \to 1 \mapsto m$ and identities to identities, and no composites need checking. The two assignments are inverse to each other.'
        constraints: 'Shape categories are small and given in full (the arrow, parallel-pair, chain, span and square shapes). Functors out of a shape are counted from their object and arrow assignments, diagrams in Set are counted or evaluated on the composite arrow of a chain, and an assignment is tested against the typing of arrows. Contexts use production chains and conversions.'
    diagnostic_exemplar:
      problem: "In the indiscrete category $\\mathrm{indisc}(S)$ (exactly one arrow between each ordered pair of objects of $S$), prove that every morphism is an isomorphism."
      answer: "Let $u\\colon x\\to y$ be the unique arrow and $v\\colon y\\to x$ the unique arrow back. Then $v\\circ u$ is an arrow $x\\to x$; since $\\mathrm{Hom}(x,x)$ has exactly one element, which must be $1_x$, we get $v\\circ u=1_x$. Likewise $u\\circ v=1_y$. So $u$ has a two-sided inverse and is an isomorphism."
      solution_sketch: "The whole argument is a counting step: $\\mathrm{Hom}(x,x)$ has exactly one element and $1_x$ lies in it, so any arrow $x\\to x$ — in particular each round trip $v\\circ u$ and $u\\circ v$ — must be an identity."
    anki_seeds:
      - front: "The discrete category on a set $S$ has which morphisms?"
        back: "only the identities $1_x$ — one for each $x\\in S$."
        type: basic
      - front: "The indiscrete category on $S$ has how many morphisms $x\\to y$?"
        back: "exactly one for every ordered pair (so $|S|^2$ in total); it is a groupoid."
        type: basic
      - front: "A functor $\\mathbf{2}=(0\\to 1)\\to\\mathcal{C}$ is the same thing as {{c1::a morphism of $\\mathcal{C}$}}."
        back: "a morphism of $\\mathcal{C}$"
        type: cloze

  - id: examples-of-categories
    name: A Menagerie of Categories
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: category-definition
        weight: 0.6
        key: true
      - id: poset-monoid-categories
        weight: 0.3
      - id: monoids
        weight: 0.2
      - id: groups-intro
        weight: 0.2
      - id: partial-orders
        weight: 0.2
