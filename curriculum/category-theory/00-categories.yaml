  - id: diagram-chasing
    name: Diagram Chasing
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: commutative-diagrams
        weight: 0.6
        key: true
      - id: category-definition
        weight: 0.3
      - id: direct-proof
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Proving equalities by chasing composites
        key_prerequisites: [commutative-diagrams]
        constraints: "Require the learner to use proving equalities by chasing composites. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "Let f,p:A->B and g,q:B->D, h,r:D->E satisfy q after f = g after p and r after g = h after q. The values of f,p,g,h are respectively [1, 0], [0, 1], [2, 3], [5, 7, 9, 11], on zero-based input sets. The maps q and r are not supplied. Chase the two commuting relations to construct the value list of r after g after f."
            answer: "9, 11"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Replace r g f by h q f and then by h g p. The target composite is determined without knowing either missing map. The resulting answer is 9, 11."
          - problem: "Let A = {0,1}, B = {0,1}, D = {0,1}. Let g: B -> D be the monomorphism of sets with g(0) = 0 and g(1) = 1. Let f: A -> B be the function with f(0) = 1 and f(1) = 0. Let f': A -> B be a function with g∘f = g∘f'. Use the monomorphism property of g to find f'(0)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Type the composites: g∘f and g∘f' are morphisms A -> D. The monomorphism g cancels on the left: g∘f = g∘f' implies f = f'. Therefore f'(0) = f(0). From the definition of f, f(0) = 1. The answer is 1."
          - problem: "Let e:A->B be an epimorphism, with e=[0,1,0] on A={0,1,2}, B={0,1}. Arrows f,g:B->Z satisfy f after e = g after e, and f=[5,8]. Chase this equality to construct g. Give g(0),g(1)."
            answer: "5, 8"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The equality has the epi on the right, so right cancellation forces the whole arrow g=f. The resulting answer is 5, 8."
          - problem: "Claim: if q∘f = g∘p and r∘g = h∘q, then r∘g∘f = h∘g∘p. Step 1: q∘f = g∘p by the first hypothesis. Step 2: compose with r on the left to get r∘q∘f = r∘g∘p. Step 3: since r∘g = h∘q, cancel g on the right to get r∘q = h∘q. Step 4: therefore r∘g∘f = h∘g∘p. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the first hypothesis, so it is valid. Step 2 composes that equation with r on the left, which keeps both sides typed as morphisms A -> E. Step 3 is not valid: r∘g = h∘q does not let you cancel g on the right, because g need not be an epimorphism. Step 4 is also invalid, but it comes after the first invalid step. The answer is Step 3."
          - problem: "Let f,p:A->B and g,q:B->D, h,r:D->E satisfy q after f = g after p and r after g = h after q. The values of f,p,g,h are respectively [2, 0, 1], [1, 2, 0], [1, 3, 0], [4, 6, 8, 10], on zero-based input sets. The maps q and r are not supplied. Chase the two commuting relations to construct the value list of r after g after f."
            answer: "10, 4, 6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Replace r g f by h q f and then by h g p. The target composite is determined without knowing either missing map. The resulting answer is 10, 4, 6."
          - problem: "Let f,p:A->B and g,q:B->D, h,r:D->E satisfy q after f = g after p and r after g = h after q. The values of f,p,g,h are respectively [0, 2, 1], [2, 1, 0], [2, 0, 1], [3, 5, 7], on zero-based input sets. The maps q and r are not supplied. Chase the two commuting relations to construct the value list of r after g after f."
            answer: "5, 3, 7"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Replace r g f by h q f and then by h g p. The target composite is determined without knowing either missing map. The resulting answer is 5, 3, 7."
          - problem: "Write the full proof: Let f,p: A -> B, q,g: B -> D, r,h: D -> E satisfy q∘f = g∘p and r∘g = h∘q. Prove r∘g∘f = h∘g∘p. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): the morphisms f,p: A -> B, q,g: B -> D, r,h: D -> E make every composite below a morphism A -> E, so the typing stays valid. Step 2 (hypotheses): we are given q∘f = g∘p and r∘g = h∘q. Step 3 (compose second on right with f): from r∘g = h∘q, compose on the right with f to get r∘g∘f = h∘q∘f, using associativity. Step 4 (substitute first): replace q∘f by g∘p to get h∘q∘f = h∘(q∘f) = h∘(g∘p) = h∘g∘p. Step 5 (conclusion): therefore r∘g∘f = h∘g∘p, since each rewrite replaces a composite by an equal one. This completes the chase."
      - id: kp2
        name: Uniqueness arguments via commuting constraints
        key_prerequisites: [commutative-diagrams]
        constraints: "Require uniqueness arguments via commuting constraints. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "In a commuting triangle mu=f, a proof of uniqueness compares a second factor v with u. Which assumptions suffice, independently of f: (i) m is monic; (ii) m is epic; (iii) u is monic; (iv) the only arrows into the domain of m are unique whenever they exist? Give four1/0 bits. To decide, use categorical cancellation and counterexamples, rather than the values of a particular factor. Here the order of cases is 1: i,ii,iii,iv."
            answer: "1, 0, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two factors have equal composites with m. Monicity cancels m; uniqueness of all relevant incoming arrows also suffices. A constant surjection with two distinct point inclusions disproves the other claims. The resulting answer is 1, 0, 0, 1."
          - problem: "In a commuting triangle mu=f, a proof of uniqueness compares a second factor v with u. Which assumptions suffice, independently of f: (i) m is monic; (ii) m is epic; (iii) u is monic; (iv) the only arrows into the domain of m are unique whenever they exist? Give four1/0 bits. To decide, use categorical cancellation and counterexamples, rather than the values of a particular factor. Here the order of cases is 2: ii,i,iv,iii."
            answer: "0, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two factors have equal composites with m. Monicity cancels m; uniqueness of all relevant incoming arrows also suffices. A constant surjection with two distinct point inclusions disproves the other claims. The resulting answer is 0, 1, 1, 0."
          - problem: "In a commuting triangle mu=f, a proof of uniqueness compares a second factor v with u. Which assumptions suffice, independently of f: (i) m is monic; (ii) m is epic; (iii) u is monic; (iv) the only arrows into the domain of m are unique whenever they exist? Give four1/0 bits. To decide, use categorical cancellation and counterexamples, rather than the values of a particular factor. Here the order of cases is 3: iii,iv,ii,i."
            answer: "0, 1, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two factors have equal composites with m. Monicity cancels m; uniqueness of all relevant incoming arrows also suffices. A constant surjection with two distinct point inclusions disproves the other claims. The resulting answer is 0, 1, 0, 1."
          - problem: "In a commuting triangle mu=f, a proof of uniqueness compares a second factor v with u. Which assumptions suffice, independently of f: (i) m is monic; (ii) m is epic; (iii) u is monic; (iv) the only arrows into the domain of m are unique whenever they exist? Give four1/0 bits. To decide, use categorical cancellation and counterexamples, rather than the values of a particular factor. Here the order of cases is 4: iv,iii,i,ii."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two factors have equal composites with m. Monicity cancels m; uniqueness of all relevant incoming arrows also suffices. A constant surjection with two distinct point inclusions disproves the other claims. The resulting answer is 1, 0, 1, 0."
          - problem: "Claim: if m u = m v then u = v. Step 1: m u = m v. Step 2: Cancel m to get u = v. Step 3: Therefore u = v. If m is not a monomorphism, which step is the first that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["No invalid step"]]}
            solution_sketch: "Step 1 is the given equation, so it is valid. Step 2 is invalid because cancellation of m requires m to be a monomorphism. Step 3 is only valid if Step 2 is valid. The option 'No invalid step' is wrong because Step 2 is invalid. The first invalid step is Step 2."
          - problem: "In the category of sets, a function m: {1,2,3} -> {1,2,3} is defined by m(1)=1, m(2)=2, m(3)=2. This m is not a monomorphism. Find the smallest n such that there exist two different morphisms u,v: {1,...,n} -> {1,2,3} with m u = m v."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Since m(2) = 2 and m(3) = 2, m is not injective. Step 2: Take n = 1. Let u(1) = 2 and v(1) = 3. Then m u = m v = 2 but u ≠ v. No smaller positive n exists. The smallest n is 1."
          - problem: "Write the full proof: Let P be a product of A and B with projections p and q. Let u, v: X -> P be two morphisms such that p u = p v and q u = q v. Prove that u = v. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: The universal property of the product P says that for any object X and morphisms f: X -> A and g: X -> B, there exists a unique morphism w: X -> P with p w = f and q w = g. Step 2: Apply this to f = p u and g = q u. Then u itself satisfies p u = f and q u = g, so by uniqueness u is the unique such morphism. Step 3: Similarly, v satisfies p v = f and q v = g, so v is the same unique morphism. Step 4: Therefore u = v. This is a uniqueness-from-a-universal-property argument."
    diagnostic_exemplar:
      problem: "Let $m\\colon P\\to A$ be a monomorphism and $f\\colon X\\to A$ any morphism. Prove that $f$ factors through $m$ in at most one way: there is at most one $u\\colon X\\to P$ with $m\\circ u=f$."
      answer: "Suppose $m\\circ u=f=m\\circ u'$ for $u,u'\\colon X\\to P$. Then $m\\circ u=m\\circ u'$, and since $m$ is a monomorphism (left-cancellable) this forces $u=u'$. Hence a factorization through $m$, if it exists, is unique."
      solution_sketch: "Uniqueness of a factorization is left-cancellation in disguise: two factorizations give $m\\circ u=m\\circ u'$, and $m$ mono forces $u=u'$. Nothing more is needed, since the claim is only at most one, so existence is not at issue."
    anki_seeds:
      - front: "To prove two maps into a universally-defined object are equal, use..."
        back: "the uniqueness clause of the object's universal property."
        type: basic
      - front: "$g$ mono and $g\\circ f = g\\circ f'$ implies..."
        back: "$f = f'$."
        type: basic

