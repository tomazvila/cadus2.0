          - problem: "Write the full proof: for any preorder (P, <=), regard it as a thin category with one arrow x -> y exactly when x <= y. Prove that composition is associative and that identity arrows satisfy the unit laws, and explain why every diagram in this category commutes. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: define the category. Objects are elements of P. For each x, y in P, put exactly one arrow x -> y when x <= y, and no arrow otherwise. Step 2: identities exist because x <= x by reflexivity, giving 1_x: x -> x. Step 3: composites exist because if x <= y and y <= z, then x <= z by transitivity, giving g composed with f: x -> z. Step 4: associativity holds. Any hom-set Hom(x,y) has at most one element by construction, so the two parallel composites (h composed with g) composed with f and h composed with (g composed with f) from x to w are equal. Step 5: unit laws hold. The arrows 1_y composed with f, f, and f composed with 1_x all lie in Hom(x,y), which has at most one element, so they are equal. Step 6: every diagram commutes for the same reason: any two parallel paths in a thin category have the same source and target, hence lie in one hom-set with at most one arrow, so the composites are equal. This proves that every preorder is a thin category and all its diagrams commute."
    diagnostic_exemplar:
      problem: "Take as objects all integers, with a single arrow $m\\to n$ whenever $|n-m|\\le 1$ (and no other arrows). Is this a category? Check the axioms and name the one that fails, if any."
      answer: "Not a category. Identities exist since $|m-m|=0\\le 1$, but composition is not total: there are arrows $0\\to 1$ and $1\\to 2$, yet no arrow $0\\to 2$ since $|2-0|=2>1$, so the composite of two arrows need not exist."
      solution_sketch: "Identities are fine, since $|m-m|=0\\le 1$, so hunt for an axiom that can fail: look for a composable pair whose composite arrow is missing. The pair $0\\to 1$ and $1\\to 2$ with no arrow $0\\to 2$ breaks totality of composition."
