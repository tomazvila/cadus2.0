    knowledge_points:
      - id: kp1
        name: The discrete category on a set
        key_prerequisites: [category-definition]
        constraints: "Work with an arbitrary set $S$ and give morphism counts as a formula in $|S|$ (identities included); any concrete instance uses a set of size at most 4."
        exemplars:
          - problem: "Let S be a set with n elements. In the discrete category disc(S), every morphism is an identity. Give the total number of morphisms of disc(S) as a formula in n."
            answer: "n"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "The discrete category disc(S) has object set S and, for each object x, exactly one morphism 1_x from x to x; for x not equal to y there is no morphism from x to y. The identity morphisms give one morphism for each of the n elements of S, so the total number of morphisms is n."
          - problem: "Let S be a set and C a category. For a functor F from disc(S) to C and an object x of S, what is F(1_x) forced to be by functoriality?"
            answer: "the identity arrow of F x"
            answer_contract: {"kind": "label", "options": [["the identity arrow of F x"], ["an arbitrary endomorphism of F x"], ["an arrow with source F y"], ["there is no such arrow"]]}
            solution_sketch: "A functor sends identities to identities, so F(1_x) must be the identity arrow of F x. The option 'an arbitrary endomorphism of F x' forgets that functoriality fixes it to the identity. The option 'an arrow with source F y' has the wrong object: 1_x lives over x, so its image must live over F x. The option 'there is no such arrow' forgets that every object has an identity morphism. The answer is the identity arrow of F x."
          - problem: "Let S be a set with 4 elements. How many morphisms does the discrete category disc(S) have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The objects of disc(S) are the four elements of S. In a discrete category the only morphisms are the identities, one for each object. Thus the total number of morphisms is 4."
          - problem: "Let S be a set with 3 elements. In disc(S), how many composable pairs (f, g) of morphisms are there, where the composite f after g is defined?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The only morphisms in disc(S) are the identities 1_x for the three objects x. A composable pair (f, g) has source of f equal to target of g; this happens exactly for the pairs (1_x, 1_x). There are 3 such pairs, so the answer is 3."
          - problem: "Let S be a set with 4 elements. In the discrete category disc(S), how many morphisms are not identities?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "By definition, disc(S) has only the identity morphism 1_x at each object x. With 4 objects there are 4 morphisms in total, all of them identities. Therefore the number of non-identity morphisms is 0."
          - problem: "Let S be a set with 2 elements. In disc(S), how many morphisms have the same source and target?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The discrete category disc(S) has one identity morphism at each of its two objects. Every identity has the same source and target, and there are no other morphisms. Hence the number of such morphisms is 2."
          - problem: "Write the full proof: for an arbitrary set S, the discrete category disc(S) is a category, and its number of morphisms is |S|. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Define disc(S) to have object set S; for each x in S put Hom(x,x) = {1_x}, and for x not equal to y put Hom(x,y) empty. Step 2: Composition is defined only on pairs (1_x, 1_x), and we set 1_x after 1_x = 1_x. This operation is total on composable pairs. Step 3: Associativity holds because every composable triple is (1_x, 1_x, 1_x) and both ways of composing give 1_x. Step 4: Each 1_x is an identity: for any morphism f, the only cases are f = 1_x, and 1_x after 1_x = 1_x. Step 5: Thus disc(S) satisfies the axioms of a category. Step 6: Its morphisms are exactly the identities 1_x for x in S, so there are exactly |S| morphisms. This proves the claim."
      - id: kp2
        name: The indiscrete category
        key_prerequisites: [poset-monoid-categories]
        constraints: "Work with an arbitrary set $S$, giving counts as a formula in $|S|$; justify uniqueness of each arrow before composing, and any concrete instance uses a set of size at most 4."
        exemplars:
          - problem: "Let S be a set with |S| = n. In the indiscrete category indisc(S) there is exactly one morphism between each ordered pair of objects, and this uniqueness is fixed before composing. Give the total number of morphisms as a formula in n."
            answer: "n*n"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "Step 1 (definition): the objects of indisc(S) are the elements of S, and for each ordered pair of objects the definition gives exactly one morphism; this uniqueness is established before any composition. Step 2 (counting): choose the source in n ways and the target in n ways, so the number of ordered pairs is n times n. Step 3 (answer): the total number of morphisms is n*n."
          - problem: "Let S be a set with |S| = n. In indisc(S) every arrow between distinct objects is a non-identity isomorphism, its inverse being the unique arrow in the other direction. Give the number of arrows x -> y with x and y distinct as a formula in n."
            answer: "n*(n-1)"
            answer_contract: {"kind": "function", "vars": ["n"]}
            solution_sketch: "Step 1 (uniqueness first): for each ordered pair x, y of distinct objects there is exactly one arrow, so counting pairs counts arrows. Step 2 (counting): pick the source x in n ways, then the target y in n-1 ways since y must differ from x. Step 3 (answer): the number of such arrows is n*(n-1)."
          - problem: "Let S = {1, 2, 3}. In indisc(S) exactly one morphism connects each ordered pair of objects, and each such morphism is fixed before composing. Give the total number of morphisms."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition): indisc({1, 2, 3}) has 3 objects and one morphism per ordered pair, with uniqueness fixed first. Step 2 (counting): the ordered pairs are 3 times 3 = 9 in number. Step 3 (answer): the total number of morphisms is 9."
          - problem: "Let S = {1, 2, 3, 4}. In indisc(S) there is exactly one arrow from the object 2 to each object of S, and uniqueness holds before composing. Give the number of arrows with source 2."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (uniqueness): the arrow 2 -> y exists and is unique for every target y in S. Step 2 (counting): the possible targets are 1, 2, 3, 4, giving 4 arrows with source 2. Step 3 (answer): the number of arrows with source 2 is 4."
          - problem: "Take the indiscrete category whose objects are 1, 2 and 3, in which each ordered pair of objects has exactly one arrow from the first object to the second. Give the number of ordered pairs of arrows f then g for which g starts at the object where f ends."
            answer: "27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The indiscrete category on the objects 1, 2 and 3 has exactly one arrow for each ordered pair of objects, and this uniqueness is fixed before any composition. A composable ordered pair is determined by the three objects x, y, z: the unique arrow from x to y followed by the unique arrow from y to z. Counting all triples gives 3 times 3 times 3. The number of composable ordered pairs of arrows is 27."
          - problem: "To prove that indisc(S) is a groupoid, let u be the unique arrow x -> y and v the unique arrow y -> x. One line is missing from the argument that u is an isomorphism. Select the missing line."
            answer: "v after u is 1_x and u after v is 1_y"
            answer_contract: {"kind": "label", "options": [["v after u is 1_x and u after v is 1_y"], ["v after u is an arrow x to y"], ["u and v are the same arrow"], ["v after u equals v"]]}
            solution_sketch: "The missing line must check both unit laws using uniqueness: the composite v after u is an arrow x -> x, and since the arrow x -> x is unique it must be 1_x; likewise u after v is 1_y. The option claiming v after u is an arrow x to y confuses the direction of the composite. The option saying u and v are the same arrow wrongly assumes x equals y. The option v after u equals v wrongly treats u as an identity. The answer is v after u is 1_x and u after v is 1_y."
          - problem: "Write the full proof: in indisc(S), the composite of the unique arrow x -> y with the unique arrow y -> z is the unique arrow x -> z, and every morphism is an isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (uniqueness): let S be any set and write u_{x,y} for the unique arrow x -> y of indisc(S); this uniqueness is fixed before composing. Step 2 (composition): given u: x -> y and v: y -> z, the composite is an arrow x -> z, and since u_{x,z} is the only arrow x -> z, the composite equals u_{x,z}. Step 3 (units): u_{x,x} is the only arrow x -> x, so the unit laws force u_{x,x} = 1_x, and identities exist for every object. Step 4 (associativity): both bracketings of three composable arrows are arrows x -> w, and there is only one such arrow, so they agree; hence indisc(S) is a category. Step 5 (invertibility): for u: x -> y take the unique v: y -> x; then v after u is an arrow x -> x, so it equals the unique arrow 1_x, and u after v is an arrow y -> y, so it equals 1_y. Step 6 (conclusion): every morphism is an isomorphism, so indisc(S) is a groupoid, and it has |S|^2 morphisms since each ordered pair of objects contributes exactly one arrow."
      - id: kp3
        name: Shape categories for diagrams
        key_prerequisites: [commutative-diagrams]
        constraints: "Shape categories with at most three objects; state the functor's data explicitly."
        exemplars:
          - problem: "Let D be the discrete category on the set {0,1}. A functor from the arrow shape 2=(0->1) to D consists of objects F0,F1 of D and a morphism F(0->1): F0->F1. How many such functors are there? Give the answer as an integer."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Functor data: F sends object 0 to F0 and object 1 to F1 in the discrete category D, and sends the arrow 0->1 to a morphism F0->F1. Step 1 (shape data): the only non-identity arrow must be assigned a morphism between the chosen objects. Step 2 (discrete category): the only morphisms of D are identities, so F0->F1 must be an identity and therefore F0=F1. Step 3 (count): F0=F1 can be 0 or 1, giving two functors. The answer is 2."
          - problem: "Let C be the category with objects A,B and exactly two non-identity morphisms f,g: A->B. A functor from the parallel-pair shape (objects 0,1 and two non-identity arrows 0->1) to C is determined by objects F0,F1 and two morphisms F0->F1. How many such functors are there? Give the answer as an integer."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Functor data: F chooses F0,F1 in {A,B} and sends the two parallel arrows to morphisms F0->F1. Step 1 (object choices): the pairs are (A,A), (A,B), (B,A), (B,B). Step 2 (hom sets): Hom(A,A) has only id_A, Hom(B,B) only id_B, Hom(A,B) has f,g, and Hom(B,A) is empty. Step 3 (count): (A,A) gives 1, (B,B) gives 1, (A,B) gives 2^2=4 choices for the two arrows, and (B,A) gives 0. The total is 1+1+4+0=6. The answer is 6."
          - problem: "Let I be the indiscrete category on the two-element set {0,1}; between every ordered pair of objects there is exactly one morphism. Let J be the discrete shape on two objects (only identity arrows). How many functors J->I are there? Give the answer as an integer."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Functor data: J has objects 0,1 and only identities, so a functor J->I is determined by the images F0 and F1 in I. Step 1 (shape data): there are no non-identity arrows in J to assign. Step 2 (count): each of F0 and F1 can be 0 or 1 independently, so there are 2*2=4 choices. Step 3 (functoriality): identities and composites are preserved automatically. The answer is 4."
          - problem: "Let I be the indiscrete category on the two-element set {0,1}; between every ordered pair of objects there is exactly one morphism. A functor from the arrow shape 2=(0->1) to I consists of objects F0,F1 and a morphism F0->F1. How many such functors are there? Give the answer as an integer."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Functor data: F chooses F0,F1 in {0,1} and sends the arrow 0->1 to the unique morphism F0->F1 in I. Step 1 (object choices): there are 2 choices for F0 and 2 choices for F1. Step 2 (arrow forced): for each ordered pair (F0,F1) the indiscrete category has exactly one morphism, so the arrow image is forced. Step 3 (count): the number of functors equals 2*2=4. The answer is 4."
          - problem: "Claim: There is no functor from the parallel-pair shape to the category C with objects A,B and exactly one non-identity morphism u: A->B. Step 1: The parallel-pair shape has two distinct non-identity arrows 0->1. Step 2: A functor must send those two arrows to two distinct morphisms F0->F1. Step 3: In C, the only morphism A->B is u, so two distinct morphisms cannot both be sent there. Step 4: Therefore no such functor exists. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "A functor is not required to be injective on morphisms. Step 1 correctly counts the two shape arrows. Step 2 is false: both shape arrows may be sent to the same morphism u. Step 3 is true only after accepting the false Step 2. Step 4 does not follow. The answer is Step 2."
          - problem: "Let C be the category with objects A,B and exactly one non-identity morphism u: A->B. How many functors from the parallel-pair shape (objects 0,1 and two non-identity arrows 0->1) to C are there? Give the answer as an integer."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Functor data: F chooses F0,F1 in {A,B} and sends the two parallel arrows to morphisms F0->F1. Step 1 (object choices): the pairs are (A,A), (A,B), (B,A), (B,B). Step 2 (hom sets): Hom(A,A) has only id_A, Hom(B,B) only id_B, Hom(A,B) has only u, and Hom(B,A) is empty. Step 3 (count): (A,A) gives 1, (B,B) gives 1, (A,B) forces both arrows to u and gives 1, and (B,A) gives 0. The total is 1+1+1+0=3. The answer is 3."
          - problem: "Write the full proof: for any category C, functors from the arrow shape 2=(0->1) to C are in bijection with morphisms of C. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Statement: A functor F: 2 -> C consists of objects F0, F1 and a morphism F(0->1): F0 -> F1, with identities forced. Step 1 (construction from a functor): given F, record the morphism F(0->1): F0 -> F1 in C. Step 2 (construction from a morphism): given a morphism f: A -> B in C, define F0=A, F1=B, and send the non-identity arrow 0->1 to f; identities are sent to identities. Step 3 (functoriality): the shape 2 has no composable non-identity arrows, so the only composition conditions are identity laws, which hold. Step 4 (inverse): these two constructions are inverse. The first sends F to F(0->1) and the second sends f to the functor with that arrow. Step 5 (conclusion): the bijection is natural and the proof is complete."
    diagnostic_exemplar:
      problem: "In the indiscrete category $\\mathrm{indisc}(S)$ (exactly one arrow between each ordered pair of objects of $S$), prove that every morphism is an isomorphism."
      answer: "Let $u\\colon x\\to y$ be the unique arrow and $v\\colon y\\to x$ the unique arrow back. Then $v\\circ u$ is an arrow $x\\to x$; since $\\mathrm{Hom}(x,x)$ has exactly one element, which must be $1_x$, we get $v\\circ u=1_x$. Likewise $u\\circ v=1_y$. So $u$ has a two-sided inverse and is an isomorphism."
      solution_sketch: "The whole argument is a counting step: $\\mathrm{Hom}(x,x)$ has exactly one element and $1_x$ lies in it, so any arrow $x\\to x$ — in particular each round trip $v\\circ u$ and $u\\circ v$ — must be an identity."
    anki_seeds:
      - front: "The discrete category on a set $S$ has which morphisms?"
        back: "only the identities $1_x$ — one for each $x\\in S$."
        type: basic
      - front: "The indiscrete category on $S$ has how many morphisms $x\\to y$?"
        back: "exactly one for every ordered pair (so $|S|^2$ in total); it is a groupoid."
        type: basic
      - front: "A functor $\\mathbf{2}=(0\\to 1)\\to\\mathcal{C}$ is the same thing as {{c1::a morphism of $\\mathcal{C}$}}."
        back: "a morphism of $\\mathcal{C}$"
        type: cloze

  - id: examples-of-categories
    name: A Menagerie of Categories
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: category-definition
        weight: 0.6
        key: true
      - id: poset-monoid-categories
        weight: 0.3
      - id: monoids
        weight: 0.2
      - id: groups-intro
        weight: 0.2
      - id: partial-orders
        weight: 0.2
      - id: homomorphisms-intro
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Concrete categories of structured sets
        key_prerequisites: [category-definition]
        constraints: "Categories of structured sets only ($\\mathbf{Mon}$, $\\mathbf{Grp}$, $\\mathbf{Poset}$, $\\mathbf{Top}$); verification means checking identity maps qualify and composites preserve the structure; no size/foundational issues raised."
        exemplars:
          - problem: "Describe the objects and morphisms of $\\mathbf{Mon}$ (monoids) and check identities and composites are legal."
            answer: "Objects are monoids, morphisms are monoid homomorphisms; identity maps and composites of homomorphisms are homomorphisms."
            solution_sketch: "Objects are monoids $(M,\\cdot,e)$; a morphism $M\\to N$ is a function $f$ with $f(xy)=f(x)f(y)$ and $f(e_M)=e_N$. The identity function is a homomorphism, and if $f,g$ are homomorphisms so is $g\\circ f$: $g(f(xy))=g(f(x)f(y))=g(f(x))g(f(y))$ and $g(f(e))=e$. Associativity and units are inherited from $\\mathbf{Set}$, so $\\mathbf{Mon}$ is a category."
          - problem: "State what the objects and morphisms are in $\\mathbf{Grp}$ and in $\\mathbf{Poset}$."
            answer: "$\\mathbf{Grp}$: groups and group homomorphisms; $\\mathbf{Poset}$: posets and monotone (order-preserving) maps."
            solution_sketch: "In each case identity maps qualify and composites of structure-preserving maps preserve the structure, so the category axioms hold as in $\\mathbf{Set}$."
      - id: kp2
        name: Small categories from data (monoids, groups, posets)
        key_prerequisites: [groups-intro]
        constraints: "Small categories presented by explicit data: a group or monoid as a one-object category, or a poset with at most 3 objects; every claim is checked directly against the category axioms."
        exemplars:
          - problem: "Let G be the group of integers modulo 3 under addition, viewed as the one-object category BG. Give the number of morphisms of BG."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The category BG has one object * and Hom(*,*) = G, so each group element is one morphism. The group of integers modulo 3 has elements 0, 1, 2, hence three morphisms. Each morphism has an inverse by the group axiom. The number of morphisms of BG is 3."
          - problem: "Let C be the poset category with objects 0 and 1 and exactly one arrow 0 -> 1. Give the total number of morphisms of C."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The objects are 0 and 1. The identity axioms give identity arrows id0: 0 -> 0 and id1: 1 -> 1, and the order relation 0 <= 1 gives one arrow 0 -> 1. No other arrows exist, so the total is 2 plus 1 equals 3. The total number of morphisms is 3."
          - problem: "Let M be the monoid of integers modulo 6 under addition, viewed as a one-object category BM. Compose the arrow 2 with the arrow 4. Give the resulting arrow."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The one-object category BM has Hom(*,*) = M, and composition is the monoid operation. The operation is addition modulo 6, so the composite is 2 plus 4 modulo 6. This equals 0 modulo 6. The resulting arrow is 0."
          - problem: "Let C be the poset category on objects 0, 1, 2 with the order 0 <= 1 <= 2. Give the total number of morphisms of C."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity arrows are id0, id1, id2, three morphisms. The non-identity order relations are 0 <= 1, 0 <= 2, and 1 <= 2, giving one arrow for each comparable pair. There are no other comparable pairs. Thus the total is 3 plus 3 equals 6. The total number of morphisms is 6."
          - problem: "Let C be the poset category on objects 0, 1, 2 with exactly the order relation 0 <= 2, besides reflexivity. Give the total number of morphisms of C."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The identity arrows are id0, id1, id2, three morphisms. The only non-identity order relation is 0 <= 2, giving one arrow 0 -> 2. Reflexivity adds no non-identity arrows. Hence the total is 3 plus 1 equals 4. The total number of morphisms is 4."
          - problem: "Consider one object * with morphisms e, a, b. The composition is given by e∘a=a, a∘e=a, e∘b=b, b∘e=b, a∘a=e, a∘b=a, b∘a=b, b∘b=a. A student argues: Step 1: e is a two-sided identity by the first four equations. Step 2: Composition is closed because every product is one of e, a, b. Step 3: Composition is associative because the table is symmetric. Step 4: Therefore this data is a category. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct: the equations e∘a=a, a∘e=a, e∘b=b, b∘e=b make e a two-sided identity. Step 2 is correct: every listed product is e, a, or b, so composition is closed. Step 3 is false: compute (b∘b)∘a = a∘a = e, but b∘(b∘a) = b∘b = a, so associativity fails. Step 4 is not reached because the data is not a category. The first invalid step is Step 3."
          - problem: "Write the full proof: every monoid M gives a one-object category BM with Hom(*,*)=M and composition the monoid product. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Objects. The proposed data BM has exactly one object, written *. Step 2: Morphisms. For the single pair of objects (*,*), set Hom(*,*)=M, so each element of M is a morphism from * to *. Step 3: Identities. Let e be the identity element of M. For the object *, define id_* = e. For any m in M, the monoid identity laws give e m = m and m e = m, so id_* is a two-sided identity. Step 4: Composition. For m and n in M, define the composite n after m to be the product n m in M, which is again a morphism from * to *. Step 5: Associativity. For m, n, p in M, (p after n) after m = (p n) m and p after (n after m) = p (n m). These are equal by associativity of M. Therefore BM satisfies all category axioms and is a one-object category."
      - id: kp3
        name: Categories built from other categories
        key_prerequisites: [category-definition]
        constraints: "Constructions limited to the arrow category $\\mathcal{C}^{\\to}$ and the binary product $\\mathcal{C}\\times\\mathcal{D}$; state objects, morphisms, composition, and identities explicitly; verification via componentwise or square-pasting arguments."
        exemplars:
          - problem: "Describe the arrow category $\\mathcal{C}^{\\to}$: what is an object and what is a morphism?"
            answer: "Objects are morphisms $f\\colon A\\to B$ of $\\mathcal{C}$; a morphism $f\\to f'$ is a commuting square."
            solution_sketch: "An object is an arrow $f\\colon A\\to B$ in $\\mathcal{C}$. A morphism from $f\\colon A\\to B$ to $f'\\colon A'\\to B'$ is a pair $(a\\colon A\\to A',\\, b\\colon B\\to B')$ with $f'\\circ a = b\\circ f$ (the square commutes). Componentwise identities and composition inherit the category axioms from $\\mathcal{C}$, and pasting commuting squares gives a commuting square, so $\\mathcal{C}^{\\to}$ is a category."
          - problem: "Given categories $\\mathcal{C},\\mathcal{D}$, describe the product category $\\mathcal{C}\\times\\mathcal{D}$."
            answer: "Objects are pairs $(C,D)$; morphisms are pairs $(f,g)$; composition and identities are componentwise."
            solution_sketch: "$\\mathrm{Hom}((C,D),(C',D'))=\\mathrm{Hom}(C,C')\\times\\mathrm{Hom}(D,D')$ with $(f',g')\\circ(f,g)=(f'\\circ f, g'\\circ g)$ and $1_{(C,D)}=(1_C,1_D)$; the axioms hold in each coordinate."
    diagnostic_exemplar:
      problem: "In the arrow category $\\mathcal{C}^{\\to}$, a morphism from $f\\colon A\\to B$ to $f'\\colon A'\\to B'$ is a pair $(a\\colon A\\to A',\\,b\\colon B\\to B')$ with $f'\\circ a=b\\circ f$. Prove that the componentwise composite of two such morphisms is again a morphism of $\\mathcal{C}^{\\to}$."
      answer: "Given $(a,b)\\colon f\\to f'$ and $(a',b')\\colon f'\\to f''$, compute $f''\\circ(a'\\circ a)=(f''\\circ a')\\circ a=(b'\\circ f')\\circ a=b'\\circ(f'\\circ a)=b'\\circ(b\\circ f)=(b'\\circ b)\\circ f$, using associativity and the two given squares. So $(a'\\circ a,\\,b'\\circ b)$ makes the outer square commute and is a morphism $f\\to f''$."
      solution_sketch: "Paste the two commuting squares: start from $f''\\circ(a'\\circ a)$ and push $f''$ across the second square, then across the first, until it emerges as $(b'\\circ b)\\circ f$. Only associativity and the two given squares are used."
    anki_seeds:
      - front: "$\\mathbf{Set}$: objects and morphisms?"
        back: "sets; functions."
        type: basic
      - front: "$\\mathbf{Mon}$: objects and morphisms?"
        back: "monoids; monoid homomorphisms."
        type: basic
      - front: "$\\mathbf{Grp}$: objects and morphisms?"
        back: "groups; group homomorphisms."
        type: basic
      - front: "$\\mathbf{Top}$: objects and morphisms?"
        back: "topological spaces; continuous maps."
        type: basic
      - front: "A group $G$ as a one-object category is a category in which..."
        back: "every morphism is invertible (a one-object groupoid)."
        type: basic

  - id: isomorphism-vs-equality
    name: Isomorphism versus Equality
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: category-definition
        weight: 0.5
        key: true
      - id: function-composition-inverse
        weight: 0.3
      - id: relations-equivalence
        weight: 0.2
      - id: functions-injective-surjective
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Definition of isomorphism via a two-sided inverse
        key_prerequisites: [category-definition]
        constraints: "Proofs use only the two inverse equations plus associativity, citing each; $\\mathbf{Set}$ arguments must address both directions (bijection implies iso and iso implies bijection)."
        exemplars:
          - problem: "Consider the one-object category whose morphisms are the numbers 0, 1, 2, 3, with composition given by addition mod 4 and with identity 0. Find the two-sided inverse of the morphism 1. Give the inverse as a number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The morphisms are 0, 1, 2, 3, the composite of two of them is their sum mod 4, and the identity is 0. Rule of the definition: the morphism f is an isomorphism exactly when some g satisfies the two inverse equations g circ f = 0 and f circ g = 0. Test g = 3 for f = 1: the composites are 3 + 1 = 0 and 1 + 3 = 0 mod 4, so both equations hold. Hence the inverse of the morphism 1 is 3."
          - problem: "In Set, let f: {1,2,3,4} to {1,2,3,4} be given by f(1) = 4, f(2) = 2, f(3) = 1, f(4) = 3. In Set a function is an isomorphism exactly when it is a bijection, and then its two-sided inverse sends each b back to the unique a with f(a) = b. Find the value of the two-sided inverse at 4. Give the value as a number."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function f is the table f(1) = 4, f(2) = 2, f(3) = 1, f(4) = 3, a bijection of the four-element set. Rule: in Set a function is an isomorphism exactly when it is a bijection, and its inverse g then satisfies the two inverse equations g circ f = 1 and f circ g = 1. From the table entry f(1) = 4, the equation g(f(1)) = 1 gives g(4) = 1, and f(g(4)) = f(1) = 4 confirms the second equation. Hence the inverse value at 4 is 1."
          - problem: "Consider the one-object category with object X = {1,2,3} whose morphisms are all functions from X to X, composed as functions. How many isomorphisms does this category have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The morphisms are the nine functions from X to X, and composition is ordinary function composition. Rule: a morphism f is an isomorphism exactly when some g satisfies the two inverse equations g circ f = 1 and f circ g = 1. A function on a finite set has such a two-sided inverse exactly when it is a bijection, and the bijections of a three-element set number 3! = 6. Hence the number of isomorphisms is 6."
          - problem: "A category has objects A and B and exactly four morphisms: 1_A: A to A, 1_B: B to B, f: A to B, and h: B to B, with h circ h = 1_B and h circ f = f. How many isomorphisms does this category have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The category has objects A and B and the four morphisms 1_A, 1_B, f: A to B and h: B to B, with h circ h = 1_B and h circ f = f. Rule: a morphism u is an isomorphism exactly when some g satisfies the two inverse equations g circ u = 1 and u circ g = 1. The identities 1_A and 1_B are their own inverses, and h is its own inverse because h circ h = 1_B holds in both orders. No morphism from B to A exists for the equation f circ g = 1_A, so f is not an isomorphism. Hence the number of isomorphisms is 3."
          - problem: "In Set, let f: Z to Z be the function f(n) = n + 3. Find the value at 10 of the two-sided inverse of f. Give the value as a number."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The function adds 3 to each integer, so f(n) = n + 3 for every integer n. Rule: in Set a function is an isomorphism exactly when it is a bijection, and its inverse g satisfies g circ f = 1 and f circ g = 1, the two inverse equations. Subtract 3 to undo the shift: g(m) = m - 3 gives g(f(n)) = n and f(g(m)) = m for all n and m. Evaluate at 10: g(10) = 10 - 3 = 7. Hence the inverse value is 7."
          - problem: "Claim: if g and g' are both two-sided inverses of f: A to B, then g = g'. Step 1: assume g circ f = 1_A, f circ g = 1_B, g' circ f = 1_A and f circ g' = 1_B. Step 2: g' = g' circ 1_B. Step 3: g' circ 1_B = g' circ (f circ g). Step 4: g' circ (f circ g) = (g' circ f) circ g. Step 5: (g' circ f) circ g = 1_B circ g = g. Which step is the first step that is not valid?"
            answer: "Step 5"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 lists both hypotheses and both pairs of inverse equations, and it is correct. Step 2 applies the identity law g' = g' circ 1_B, which is valid. Step 3 substitutes the true equation f circ g = 1_B, which is valid. Step 4 applies associativity, which is valid. Step 5 is the first invalid step: it substitutes g' circ f = 1_B, but the hypothesis gives g' circ f = 1_A, so the line should read (g' circ f) circ g = 1_A circ g = g. Hence the first invalid step is Step 5."
          - problem: "Write the full proof: let f: A to B be an isomorphism with inverse g: B to A; prove that g is an isomorphism with inverse f. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: by hypothesis f: A to B is an isomorphism with inverse g: B to A, so by the definition the two inverse equations hold, g circ f = 1_A and f circ g = 1_B. Step 2: to show that g is an isomorphism with inverse f we must exhibit a morphism h with h circ g = 1_B and g circ h = 1_A, and the candidate is h = f. Step 3: the required equation f circ g = 1_B is exactly the second equation cited in Step 1, and the required equation g circ f = 1_A is exactly the first equation cited in Step 1. Step 4: both inverse equations for g hold, so g is an isomorphism and f is its inverse, which also shows that isomorphism is a symmetric relation. The argument used only the definition of isomorphism and the two inverse equations, so the inverse of g is f."
      - id: kp2
        name: Isomorphism is coarser than equality
        key_prerequisites: [relations-equivalence]
        constraints: "Short equational proofs from two-sided inverses (equivalence-relation properties, inverse of a composite); concrete examples use sets of at most 3 elements."
        exemplars:
          - problem: "In Set, let A = {0,1} and B = {a,b}. How many isomorphisms are there from A to B?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition): in Set an isomorphism is exactly a bijection, so each isomorphism from A to B is a bijection. Step 2 (count bijections): send 0 to a or b, and then 1 must go to the remaining element, giving two bijections. The objects are not equal because their elements differ, but they are isomorphic. The answer is 2."
          - problem: "Let f: A -> B and g: B -> C be isomorphisms in a category. Which expression is the inverse of the composite map from A to C? Select the correct expression."
            answer: "f^-1 after g^-1"
            answer_contract: {"kind": "label", "options": [["f^-1 after g^-1"], ["g^-1 after f^-1"], ["f after g"], ["g after f"]]}
            solution_sketch: "Step 1 (definition): the inverse of a composite reverses the order. Step 2 (check): (g after f) after (f^-1 after g^-1) cancels f then g and gives the identity on C, and the other order gives the identity on A. Option g^-1 after f^-1 keeps the original order; option f after g uses the maps instead of inverses; option g after f is the original composite. The answer is f^-1 after g^-1."
          - problem: "In Set, let A = {0,1,2} and B = {a,b,c}. How many isomorphisms are there from A to B?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition): isomorphisms in Set are bijections. Step 2 (count): there are 3 choices for the image of 0, 2 remaining choices for the image of 1, and 1 choice for the image of 2, so 3 times 2 times 1 bijections. The answer is 6."
          - problem: "In Set, the relation 'is isomorphic to' is an equivalence relation on objects. The set A = {0,1} is isomorphic to how many of the following sets: {0,1}, {a,b}, {a,b,c}, {0,1,2}?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition): two sets in Set are isomorphic exactly when a bijection exists, which happens exactly when they have the same number of elements. Step 2 (compare): A has two elements, so it is isomorphic to the two-element sets {0,1} and {a,b}, and not to the three-element sets. The answer is 2."
          - problem: "Claim: if f: A -> B and g: B -> C are isomorphisms, then g after f has inverse f^-1 after g^-1. Step 1: f^-1 exists because f is an isomorphism. Step 2: g^-1 exists because g is an isomorphism. Step 3: (g after f) after (f^-1 after g^-1) = g after (f after f^-1) after g^-1 = g after 1_B after g^-1 = 1_C. Step 4: (f^-1 after g^-1) after (g after f) = 1_A by the same cancellation. Step 5: therefore the inverse is g^-1 after f^-1. Which step is the first step that is not valid?"
            answer: "Step 5"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"], ["Step 5"]]}
            solution_sketch: "Step 1 is valid by the definition of isomorphism. Step 2 is valid for the same reason. Step 3 uses associativity and the inverse law for f, then for g, and is valid. Step 4 is the symmetric cancellation and is valid. Step 5 reverses the order: the correct inverse is f^-1 after g^-1. The answer is Step 5."
          - problem: "Compare the relation 'is isomorphic to' with equality on objects in Set. Give the verdict and the number of isomorphisms from {0,1} to {a,b}."
            answer: "verdict = coarser; count = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["coarser"], ["finer"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Step 1 (definition): equality implies isomorphism because the identity is an isomorphism, but isomorphism does not imply equality, for example {0,1} and {a,b} are isomorphic and not equal. Step 2 (count): a bijection from {0,1} to {a,b} is determined by the image of 0, so there are 2 isomorphisms. The relation is therefore coarser than equality. The answer is verdict = coarser; count = 2."
          - problem: "Write the full proof: in any category, the relation 'is isomorphic to' on objects is an equivalence relation. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (reflexivity): for every object A, the identity morphism 1_A: A -> A satisfies 1_A after 1_A = 1_A, so it is a two-sided inverse of itself and A is isomorphic to A. Step 2 (symmetry): if f: A -> B is an isomorphism, then by definition there is g: B -> A with g after f = 1_A and f after g = 1_B; the same equations show that g is an isomorphism from B to A, so B is isomorphic to A. Step 3 (transitivity): if f: A -> B and h: B -> C are isomorphisms, with inverses f^-1 and h^-1, then the composite h after f: A -> C has inverse f^-1 after h^-1, because the two composites cancel in either order by associativity and the inverse laws. Thus A is isomorphic to C. The three properties show that 'is isomorphic to' is reflexive, symmetric, and transitive, hence an equivalence relation on objects."
      - id: kp3
        name: Universal properties determine objects up to unique isomorphism
        key_prerequisites: [category-definition]
        constraints: "Conceptual contrast questions; any example uses two-element sets or terminal objects, and the phrase 'unique isomorphism' must be justified by counting the connecting arrows, not merely asserted."
        exemplars:
          - problem: "In Set, let T = {*} and T' = {#} be one-element sets, so both are terminal objects. How many functions are there from T to T'?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (terminal property): T' is terminal, so every object has exactly one arrow into T'. Step 2 (apply to T): the object T has exactly one arrow to T', the function sending * to #. Step 3 (count): the single element * has only one possible image, so no other function exists. The answer is 1."
          - problem: "In Set, let A = {0,1} and B = {a,b}. These two-element sets are isomorphic, but not uniquely. How many isomorphisms are there from A to B?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (isomorphisms in Set): a function between these sets is an isomorphism exactly when it is a bijection. Step 2 (enumerate): 0 may map to a while 1 maps to b, or 0 may map to b while 1 maps to a, and each choice is a bijection with an inverse. Step 3 (count): both choices are isomorphisms, so isomorphic objects can be connected in more than one way. The answer is 2."
          - problem: "In Set, let T = {*} be a terminal object and let A = {0,1} be a two-element set. The terminal property controls arrows into T, not arrows out of T. How many functions are there from T to A?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of function): a function from T = {*} to A picks one element of A as the image of *. Step 2 (enumerate): the choices are * maps to 0 and * maps to 1, so exactly 2 functions exist. Step 3 (contrast): uniqueness holds for arrows into a terminal object, while arrows out of it can be many and need not be bijections. The answer is 2."
          - problem: "View the poset with elements 0, 1, 2, 3 and order relations 0 < 1 < 3 and 0 < 2 < 3, where 1 and 2 are incomparable, as a category. How many terminal objects does this poset have?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (poset as category): there is exactly one morphism x to y exactly when x is at most y. Step 2 (terminal test): an object t is terminal when every object x satisfies x at most t; only 3 passes, since 1 and 2 are incomparable and 0 lies below 3. Step 3 (count): the greatest element 3 is the single terminal object, and two terminal objects of a poset would need a unique arrow each way. The answer is 1."
          - problem: "Claim: if T and T' are terminal objects of a category, then T = T'. Step 1: T' is terminal, so there is exactly one arrow T to T'. Step 2: T is terminal, so there is exactly one arrow T' to T. Step 3: since each direction has exactly one arrow, the objects T and T' are equal. Step 4: hence terminal objects are equal and not merely isomorphic. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 (base use of the terminal property): T' is terminal, so the arrow T to T' is unique; option Step 1 makes no error. Step 2 (symmetry): T is terminal, so the arrow T' to T is unique; option Step 2 makes no error. Step 3 (first invalid step): unique arrows each way give an isomorphism, not an equality of objects, so option Step 3 holds the error. Step 4 (inherited error): it merely repeats the equality claim of Step 3, so option Step 4 fails too. The answer is Step 3."
          - problem: "Regard the two-element set {0,1} with the order 0 < 1 as a small category, with one arrow for each ordered pair that is ordered. Objects 0 and 1 are not isomorphic. How many isomorphisms are there from 0 to 1?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (arrows in a poset category): the arrow from 0 to 1 exists because 0 is at most 1, and it is unique. Step 2 (isomorphism test): an isomorphism needs an arrow from 1 back to 0, but 1 is not at most 0, so no inverse arrow exists. Step 3 (count): with no inverse there is no isomorphism, so the count is zero. The answer is 0."
          - problem: "Write the full proof: if T and T' are terminal objects in a category, then there is a unique isomorphism from T to T'. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (existence): since T' is terminal, every object has exactly one arrow into T', so there is exactly one arrow f from T to T'. Step 2 (existence, reverse): since T is terminal, there is exactly one arrow g from T' to T. Step 3 (identity on T): the composite of g after f is an arrow from T to T, and because T is terminal the only such arrow is the identity, so that composite equals id_T. Step 4 (identity on T'): symmetrically the composite of f after g is an arrow from T' to T', and since T' is terminal it must equal id of T', so f is an isomorphism with inverse g. Step 5 (uniqueness): any isomorphism from T to T' is in particular an arrow from T to T', and the terminal property of T' leaves exactly one such arrow, so the isomorphism is unique. Counting the connecting arrows, one each way and one endo-arrow on each object, justifies the phrase unique isomorphism: terminal objects are determined up to a unique isomorphism, never up to equality."
    diagnostic_exemplar:
      problem: "Let $f\\colon A\\to B$ and $g\\colon B\\to C$ be isomorphisms in a category. Prove that $g\\circ f$ is an isomorphism and identify its inverse."
      answer: "$(f^{-1}\\circ g^{-1})\\circ(g\\circ f)=f^{-1}\\circ(g^{-1}\\circ g)\\circ f=f^{-1}\\circ 1_B\\circ f=1_A$, and $(g\\circ f)\\circ(f^{-1}\\circ g^{-1})=g\\circ(f\\circ f^{-1})\\circ g^{-1}=g\\circ 1_B\\circ g^{-1}=1_C$. So $g\\circ f$ has the two-sided inverse $f^{-1}\\circ g^{-1}$ (note the reversed order) and is an isomorphism."
      solution_sketch: "Guess the inverse in reversed order, $f^{-1}\\circ g^{-1}$, then verify both composites by cancelling the inner pair with the identity law. The reversal is forced by the typing, not chosen."
    anki_seeds:
      - front: "An isomorphism in a category is a morphism $f$ such that..."
        back: "there exists $g$ with $g\\circ f=1_A$ and $f\\circ g=1_B$ (a two-sided inverse)."
        type: basic
      - front: "$(g\\circ f)^{-1} = $ ?"
        back: "$f^{-1}\\circ g^{-1}$ (order reverses)."
        type: basic

  - id: commutative-diagrams
    name: Commutative Diagrams
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: proof
    expected_time_secs: 150
    prerequisites:
      - id: category-definition
        weight: 0.5
        key: true
      - id: function-composition
        weight: 0.3
      - id: propositional-logic
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Reading a commuting triangle or square
        key_prerequisites: [category-definition]
        constraints: "Triangles and squares only, with all arrows named in the stem; the answer is a single composition equation in the given labels."
        exemplars:
          - problem: "A commuting triangle has f: A -> B, g: B -> C, h: A -> C. On elements f(x) = x + 1 and g(y) = 3y. Find h(x)."
            answer: "3x+3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The triangle has arrows f: A -> B, g: B -> C, h: A -> C. Step 1 (R3): commutativity gives h(x) = g(f(x)). Step 2 (R3): substitute f and g to get g(f(x)) = 3(x+1). Step 3 (R3): simplify to h(x) = 3x+3. The answer is 3x+3."
          - problem: "A commuting square has f: A -> B, g: A -> C, h: B -> D, k: C -> D. On elements, f(x) = x + 3, g(x) = 2x, and h(u) = 4u. Find k(t) as a function of t, where t is an element of C."
            answer: "2t+12"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "The square has arrows f: A -> B, g: A -> C, h: B -> D, k: C -> D. Step 1 (R3): commutativity of the square gives h(f(x)) = k(g(x)) for every x in A. Step 2 (R3): substitute the given formulas: h(f(x)) = 4(x + 3) = 4x + 12, and g(x) = 2x, so k(2x) = 4x + 12. Step 3 (R3): write t = 2x, so x = t/2, and k(t) = 4(t/2) + 12 = 2t + 12. The answer is 2t+12."
          - problem: "A commuting triangle has f: A -> B, g: B -> C, h: A -> C. At an element a, f(a) = 4 and g(4) = 7. Find h(a)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The triangle has arrows f: A -> B, g: B -> C, h: A -> C. Step 1 (R1): commutativity gives h(a) = g(f(a)). Step 2 (R1): f(a) = 4, so h(a) = g(4) = 7. The answer is 7."
          - problem: "A square has f: A -> B, g: A -> C, h: B -> D, k: C -> D. For x in A, which line states that the square commutes?"
            answer: "h(f(x)) = k(g(x))"
            answer_contract: {"kind": "label", "options": [["h(f(x)) = k(g(x))"], ["h(g(x)) = k(f(x))"], ["f(h(x)) = g(k(x))"], ["f(k(x)) = g(h(x))"]]}
            solution_sketch: "The square has arrows f: A -> B, g: A -> C, h: B -> D, k: C -> D. Step 1 (R15): a square commutes when the two paths from A to D agree. Step 2 (R15): the path through B is h after f, and the path through C is k after g, so the line is h(f(x)) = k(g(x)). The option h(g(x)) = k(f(x)) pairs the wrong arrows. The option f(h(x)) = g(k(x)) reverses the order and mismatches domains. The option f(k(x)) = g(h(x)) reverses both paths. The answer is h(f(x)) = k(g(x))."
          - problem: "Claim: if a triangle f: A -> B, g: B -> C, h: A -> C commutes, then f(g(x)) = h(x). Step 1: assume the triangle commutes. Step 2: then h(x) = g(f(x)). Step 3: rearrange to f(g(x)) = h(x). Step 4: so the triangle also gives f(g(x)) = h(x). Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "The triangle has arrows f: A -> B, g: B -> C, h: A -> C. Step 1 (R15): the hypothesis is that the triangle commutes. Step 2 (R15): this correctly gives h(x) = g(f(x)). Step 3 (R15) is not valid because f(g(x)) is not defined: the codomain of g is C, not the domain A of f, and composition does not commute. Step 4 follows only from the invalid Step 3. The answer is Step 3."
          - problem: "A triangle has f: A -> B, g: B -> C, h: A -> C. Which equation states that the triangle commutes?"
            answer: "h(x) = g(f(x))"
            answer_contract: {"kind": "label", "options": [["h(x) = g(f(x))"], ["h(x) = f(g(x))"], ["g(x) = h(f(x))"], ["f(x) = h(g(x))"]]}
            solution_sketch: "The triangle has arrows f: A -> B, g: B -> C, h: A -> C. Step 1 (R15): commutativity means the two paths from A to C agree. Step 2 (R15): the direct path is h, and the path through B is g after f, so the equation is h(x) = g(f(x)). The option h(x) = f(g(x)) reverses the order of f and g. The option g(x) = h(f(x)) uses g as an A-to-C arrow, but g is B-to-C. The option f(x) = h(g(x)) uses f as a C-to-A arrow and reverses the order. The answer is h(x) = g(f(x))."
          - problem: "Write the full proof: a triangle with arrows f: A -> B, g: B -> C, h: A -> C commutes if and only if h(x) = g(f(x)) for every x in A. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "A diagram is a directed graph of objects and arrows. A path is a finite sequence of composable arrows; its composite is read right to left. Step 1: The triangle has two paths from A to C: the direct path h, and the path through B, whose composite is g after f. Step 2: By definition, the triangle commutes exactly when every pair of paths with the same source and target has the same composite. Step 3: The only nontrivial pair here is h and g after f, so commutativity is equivalent to h(x) = g(f(x)) for every x in A. Step 4: Conversely, if h(x) = g(f(x)) for every x, then the two A-to-C paths agree, so the triangle commutes. This proves the equivalence."
      - id: kp2
        name: Pasting diagrams
        key_prerequisites: [function-composition]
        constraints: "At most two cells pasted; every step of the derivation cites either associativity or one cell's commuting equation."
        exemplars:
          - problem: "Two squares share the edge s. The left square commutes: s∘f = t∘g. The right square commutes: v∘s = u∘p. The values are f(1) = 2, g(1) = 3, t(3) = 7, p(2) = 6, u(6) = 9. Find (v∘t∘g)(1)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: evaluate the inner part of the route: g(1) = 3 and t(3) = 7, so t∘g sends 1 to 7. Step 2: the left square's commuting equation s∘f = t∘g gives s(f(1)) = s(2) = t(g(1)) = 7. Step 3: the right square's commuting equation v∘s = u∘p gives v(s(2)) = u(p(2)) = u(6) = 9. Hence (v∘t∘g)(1) = v(7) = 9."
          - problem: "A triangle commutes: m∘n = l, where n goes from X to Y, m goes from Y to Z, and l goes from X to Z. A further arrow r goes from Z to W. The values are n(2) = 3, m(3) = 5, r(5) = 11. Find (r∘l)(2)."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the triangle's commuting equation m∘n = l rewrites the direct arrow at the input: l(2) = m(n(2)). Step 2: evaluate n(2) = 3 and m(3) = 5, so l(2) = 5; this step cites the triangle's commuting equation. Step 3: apply the further arrow r to get r(l(2)) = r(5) = 11. The value of (r∘l)(2) is 11."
          - problem: "A left square commutes: s∘f = t∘g, but the right square v∘s = u∘p does not. The functions are: f sends 1 to 1, 2 to 2, 3 to 2; g sends 1 to 1, 2 to 2, 3 to 2; s sends 1 to 1, 2 to 2; t sends 1 to 1, 2 to 2; p sends 1 to 1, 2 to 2, 3 to 1; u sends 1 to 1, 2 to 2; v sends 1 to 1, 2 to 3. A student claims the outer routes (v∘t∘g)(x) and (u∘p∘f)(x) agree for every x. Give the smallest x where the claim fails."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: check the left square's commuting equation s∘f = t∘g on all inputs; it holds, since both composites send 1, 2, 3 to 1, 2, 2. Step 2: compute the route v∘t∘g: the values at x = 1, 2, 3 are 1, 3, 3, because v sends 2 to 3. Step 3: compute the route u∘p∘f: the values are 1, 2, 2, because u sends 2 to 2. Step 4: the routes first disagree at x = 2, since v(2) = 3 but u(2) = 2. The smallest counterexample is x = 2."
          - problem: "One square commutes: w∘c = d∘b, where b goes from A to B, c goes from A to C, d goes from B to D, and w goes from C to D. A further arrow a goes from X to A. The values are a(0) = 1, b(1) = 3, c(1) = 2, w(2) = 4. Find (d∘b∘a)(0)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: evaluate the C-route: a(0) = 1, c(1) = 2, w(2) = 4, so (w∘c∘a)(0) = 4. Step 2: by associativity the commuting equation w∘c = d∘b can be composed with a, giving (d∘b)∘a = (w∘c)∘a; this step cites the square's commuting equation and associativity. Step 3: therefore (d∘b∘a)(0) = d(b(a(0))) = d(b(1)) = d(3) = 4. The value of (d∘b∘a)(0) is 4."
          - problem: "Two squares share the edge s: the left square commutes by s∘f = t∘g and the right square commutes by v∘s = u∘p. The values are f(1) = 1, g(1) = 2, t(2) = 5, p(1) = 3, u(3) = 7. Find v(5)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the left square's commuting equation s∘f = t∘g at input 1 gives s(1) = t(g(1)) = t(2) = 5. Step 2: the right square's commuting equation v∘s = u∘p at input 1 gives v(s(1)) = u(p(1)) = u(3) = 7. Step 3: substitute s(1) = 5 from step 1; associativity keeps the three-arrow composite v∘s∘f associated so the equation applies. The value is v(5) = 7."
          - problem: "A triangle commutes: m∘n = l, with n from A to B, m from B to C, and l from A to C. A square commutes: r∘l = q∘k, with r from C to E and k from A to D; the two cells share the edge l. The values are n(1) = 2, m(2) = 4, r(4) = 9, k(1) = 3. Find q(3)."
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the triangle's commuting equation m∘n = l gives l(1) = m(n(1)) = m(2) = 4. Step 2: the square's commuting equation r∘l = q∘k gives q(k(1)) = r(l(1)); by associativity the pasted composite r∘m∘n is associated so the equation applies. Step 3: r(l(1)) = r(4) = 9, and k(1) = 3, so q(3) = 9. The value of q(3) is 9."
          - problem: "Write the full proof: pasting two commuting squares that share an edge gives a commuting outer rectangle. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: let the left square have edges f from A to B, g from A to D, and the shared edge s from B to C, with commuting equation s∘f = t∘g where t goes from D to C. Step 2: let the right square have the shared edge s from B to C, an edge p from B to E, and an edge u from E to F, with commuting equation v∘s = u∘p where v goes from C to F. Step 3: the two outer routes from A to F are v∘t∘g and u∘p∘f. Step 4: by associativity, u∘p∘f = u∘(p∘f) is the right square's commuting equation v∘s = u∘p composed with f, so u∘p∘f = v∘s∘f. Step 5: by the left square's commuting equation s∘f = t∘g, we get v∘s∘f = v∘(s∘f) = v∘t∘g. Step 6: hence u∘p∘f = v∘t∘g, so the outer rectangle commutes; every step cited associativity or one cell's commuting equation, and at most two cells were pasted."
    diagnostic_exemplar:
      problem: "A triangle $f\\colon A\\to B$, $g\\colon B\\to C$, $h\\colon A\\to C$ commutes, and $k\\colon C\\to D$ is a further arrow. Write the equation saying the two routes $A\\to D$ agree, and justify it."
      answer: "$k\\circ g\\circ f = k\\circ h$, by post-composing the triangle's equation $g\\circ f = h$ with $k$."
      solution_sketch: "The triangle gives $g\\circ f = h$; post-composing with $k$ preserves equality, and associativity lets the composite be written unbracketed, so $k\\circ(g\\circ f) = k\\circ h$."
    anki_seeds:
      - front: "A diagram 'commutes' means..."
        back: "any two directed paths with the same source and target compose to the same morphism."
        type: basic
      - front: "Commuting square $A\\to B\\to D$ and $A\\to C\\to D$ gives which equation?"
        back: "$h\\circ f = k\\circ g$."
        type: basic

  - id: diagram-chasing
    name: Diagram Chasing
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: commutative-diagrams
        weight: 0.6
        key: true
      - id: category-definition
        weight: 0.3
      - id: direct-proof
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Proving equalities by chasing composites
        key_prerequisites: [commutative-diagrams]
        constraints: "Chases of at most three composable steps; each rewrite cites a hypothesis equation or mono/epi cancellation, and the typing of every composite must stay valid."
        exemplars:
          - problem: "Let A = {0}, B = {0,1}, D = {0,1,2}, E = {0,1,2}. Define f: A -> B by f(0) = 0 and p: A -> B by p(0) = 1. Define q: B -> D by q(0) = 2, q(1) = 0 and g: B -> D by g(0) = 1, g(1) = 2. Define r: D -> E by r(0) = 0, r(1) = 2, r(2) = 1 and h: D -> E by h(0) = 1, h(1) = 0, h(2) = 2. These functions satisfy q∘f = g∘p and r∘g = h∘q. Chase the diagram to find (r∘g∘f)(0)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Type the composite: f: A -> B, g: B -> D, r: D -> E, so r∘g∘f is a morphism A -> E. Use the second hypothesis r∘g = h∘q and compose on the right with f to get r∘g∘f = h∘q∘f. Use the first hypothesis q∘f = g∘p to replace q∘f by g∘p, giving r∘g∘f = h∘g∘p. Evaluate at 0: f(0) = 0, then g(0) = 1, then r(1) = 2. The answer is 2."
          - problem: "Let A = {0,1}, B = {0,1}, D = {0,1}. Let g: B -> D be the monomorphism of sets with g(0) = 0 and g(1) = 1. Let f: A -> B be the function with f(0) = 1 and f(1) = 0. Let f': A -> B be a function with g∘f = g∘f'. Use the monomorphism property of g to find f'(0)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Type the composites: g∘f and g∘f' are morphisms A -> D. The monomorphism g cancels on the left: g∘f = g∘f' implies f = f'. Therefore f'(0) = f(0). From the definition of f, f(0) = 1. The answer is 1."
          - problem: "Let A = {0,1}, B = {0,1}, D = {0,1}. Let q: B -> D be the epimorphism of sets with q(0) = 1 and q(1) = 0. Let f: A -> B satisfy f(0) = 0 and f(1) = 1. Let f': A -> B be a function with q∘f = q∘f'. Use the epimorphism property of q to find f'(0)."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Type the composites: q∘f and q∘f' are morphisms A -> D. The epimorphism q cancels on the right: q∘f = q∘f' implies f = f'. Hence f'(0) = f(0). The given f has f(0) = 0. The answer is 0."
          - problem: "Claim: if q∘f = g∘p and r∘g = h∘q, then r∘g∘f = h∘g∘p. Step 1: q∘f = g∘p by the first hypothesis. Step 2: compose with r on the left to get r∘q∘f = r∘g∘p. Step 3: since r∘g = h∘q, cancel g on the right to get r∘q = h∘q. Step 4: therefore r∘g∘f = h∘g∘p. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the first hypothesis, so it is valid. Step 2 composes that equation with r on the left, which keeps both sides typed as morphisms A -> E. Step 3 is not valid: r∘g = h∘q does not let you cancel g on the right, because g need not be an epimorphism. Step 4 is also invalid, but it comes after the first invalid step. The answer is Step 3."
          - problem: "Let A = {0}, B = {0,1,2}, D = {0,1,2,3}, E = {0,1,2,3,4}. Define f: A -> B by f(0) = 0 and p: A -> B by p(0) = 1. Define g: B -> D by g(0) = 0, g(1) = 2, g(2) = 3 and q: B -> D by q(0) = 2, q(1) = 1, q(2) = 0. Define r: D -> E by r(0) = 4, r(1) = 0, r(2) = 0, r(3) = 1 and h: D -> E by h(0) = 1, h(1) = 0, h(2) = 4, h(3) = 0. These functions satisfy q∘f = g∘p and r∘g = h∘q. Chase the diagram to find (r∘g∘f)(0)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Type the chase: f: A -> B, g: B -> D, r: D -> E, so r∘g∘f: A -> E. Compose r∘g = h∘q with f on the right: r∘g∘f = h∘q∘f. Substitute q∘f = g∘p: h∘q∘f = h∘g∘p. Evaluate at 0: f(0) = 0, then g(0) = 0, then r(0) = 4. The answer is 4."
          - problem: "Let A = {0,1}, B = {0,1,2}, D = {0,1,2,3}, E = {0,1,2,3}. Define f: A -> B by f(0) = 1, f(1) = 2 and p: A -> B by p(0) = 0, p(1) = 1. Define q: B -> D by q(0) = 0, q(1) = 1, q(2) = 2 and g: B -> D by g(0) = 1, g(1) = 2, g(2) = 0. Define r: D -> E by r(0) = 3, r(1) = 1, r(2) = 2, r(3) = 0 and h: D -> E by h(0) = 1, h(1) = 2, h(2) = 3, h(3) = 0. These functions satisfy q∘f = g∘p and r∘g = h∘q. Chase the diagram to find (r∘g∘f)(1)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Type the chase: f: A -> B, g: B -> D, r: D -> E, so r∘g∘f: A -> E. Compose r∘g = h∘q with f on the right: r∘g∘f = h∘q∘f. Substitute q∘f = g∘p: h∘q∘f = h∘g∘p. Evaluate at 1: f(1) = 2, then g(2) = 0, then r(0) = 3. The answer is 3."
          - problem: "Write the full proof: Let f,p: A -> B, q,g: B -> D, r,h: D -> E satisfy q∘f = g∘p and r∘g = h∘q. Prove r∘g∘f = h∘g∘p. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): the morphisms f,p: A -> B, q,g: B -> D, r,h: D -> E make every composite below a morphism A -> E, so the typing stays valid. Step 2 (hypotheses): we are given q∘f = g∘p and r∘g = h∘q. Step 3 (compose second on right with f): from r∘g = h∘q, compose on the right with f to get r∘g∘f = h∘q∘f, using associativity. Step 4 (substitute first): replace q∘f by g∘p to get h∘q∘f = h∘(q∘f) = h∘(g∘p) = h∘g∘p. Step 5 (conclusion): therefore r∘g∘f = h∘g∘p, since each rewrite replaces a composite by an equal one. This completes the chase."
      - id: kp2
        name: Uniqueness arguments via commuting constraints
        key_prerequisites: [commutative-diagrams]
        constraints: "Uniqueness arguments only: conclude two candidate morphisms are equal, either from a universal property's uniqueness clause or by cancelling a monomorphism; name which mechanism is used."
        exemplars:
          - problem: "In the category of finite sets, let X = {1,2}, A = {1,2}, B = {3,4}. Define f: X -> A by f(1)=1, f(2)=2, and g: X -> B by g(1)=3, g(2)=4. The product A x B has projections p and q. By the universal property, there is a unique morphism u: X -> A x B with p u = f and q u = g. Give the answer as (x, y)."
            answer: "(1,3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: The universal property of the product A x B gives a unique morphism u: X -> A x B with p u = f and q u = g. Step 2: Evaluate at 1: p(u(1)) = f(1) = 1, so the first coordinate is 1. Step 3: q(u(1)) = g(1) = 3, so the second coordinate is 3. Thus u(1) = (1,3)."
          - problem: "Let P = {1,2}, A = {1,2,3}. Let m: P -> A be the inclusion m(1)=1, m(2)=2. Let X = {1,2} and f: X -> A be f(1)=2, f(2)=1. It is known that f factors through m in at most one way. Find the value u(1) of the unique morphism u: X -> P with m u = f."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The factorization condition is m(u(1)) = f(1) = 2. Step 2: Since m is a monomorphism, hence injective for sets, the only preimage of 2 under m is 2 itself. Thus u(1) = 2."
          - problem: "In the category of finite sets, let X = {1,2}, A = {1,2}, B = {3,4}, C = {5,6}. Define f: X -> A by f(1)=1, f(2)=2, g: X -> B by g(1)=3, g(2)=4, and h: X -> C by h(1)=5, h(2)=6. The triple product A x B x C has projections p, q, r. By the universal property, there is a unique morphism u: X -> A x B x C with p u = f, q u = g, r u = h. Give the answer as (x, y, z)."
            answer: "(1,3,5)"
            answer_contract: {"arity": 3, "kind": "coordinates"}
            solution_sketch: "Step 1: The universal property of the triple product gives a unique u: X -> A x B x C with the three projections matching f, g, h. Step 2: At 1, p(u(1)) = f(1) = 1, q(u(1)) = g(1) = 3, r(u(1)) = h(1) = 5. Thus u(1) = (1,3,5)."
          - problem: "Let P = {1,2,3}, A = {1,2,3,4,5}. Let m: P -> A be the inclusion m(1)=1, m(2)=2, m(3)=3. Let X = {1,2} and f: X -> A be f(1)=3, f(2)=1. It is known that f factors through m in at most one way. Find the value u(1) of the unique morphism u: X -> P with m u = f."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: The condition is m(u(1)) = f(1) = 3. Step 2: Since m is the inclusion of {1,2,3} into {1,2,3,4,5}, the only element mapping to 3 is 3. Thus u(1) = 3."
          - problem: "Claim: if m u = m v then u = v. Step 1: m u = m v. Step 2: Cancel m to get u = v. Step 3: Therefore u = v. If m is not a monomorphism, which step is the first that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["No invalid step"]]}
            solution_sketch: "Step 1 is the given equation, so it is valid. Step 2 is invalid because cancellation of m requires m to be a monomorphism. Step 3 is only valid if Step 2 is valid. The option 'No invalid step' is wrong because Step 2 is invalid. The first invalid step is Step 2."
          - problem: "In the category of sets, a function m: {1,2,3} -> {1,2,3} is defined by m(1)=1, m(2)=2, m(3)=2. This m is not a monomorphism. Find the smallest n such that there exist two different morphisms u,v: {1,...,n} -> {1,2,3} with m u = m v."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Since m(2) = 2 and m(3) = 2, m is not injective. Step 2: Take n = 1. Let u(1) = 2 and v(1) = 3. Then m u = m v = 2 but u ≠ v. No smaller positive n exists. The smallest n is 1."
          - problem: "Write the full proof: Let P be a product of A and B with projections p and q. Let u, v: X -> P be two morphisms such that p u = p v and q u = q v. Prove that u = v. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: The universal property of the product P says that for any object X and morphisms f: X -> A and g: X -> B, there exists a unique morphism w: X -> P with p w = f and q w = g. Step 2: Apply this to f = p u and g = q u. Then u itself satisfies p u = f and q u = g, so by uniqueness u is the unique such morphism. Step 3: Similarly, v satisfies p v = f and q v = g, so v is the same unique morphism. Step 4: Therefore u = v. This is a uniqueness-from-a-universal-property argument."
    diagnostic_exemplar:
      problem: "Let $m\\colon P\\to A$ be a monomorphism and $f\\colon X\\to A$ any morphism. Prove that $f$ factors through $m$ in at most one way: there is at most one $u\\colon X\\to P$ with $m\\circ u=f$."
      answer: "Suppose $m\\circ u=f=m\\circ u'$ for $u,u'\\colon X\\to P$. Then $m\\circ u=m\\circ u'$, and since $m$ is a monomorphism (left-cancellable) this forces $u=u'$. Hence a factorization through $m$, if it exists, is unique."
      solution_sketch: "Uniqueness of a factorization is left-cancellation in disguise: two factorizations give $m\\circ u=m\\circ u'$, and $m$ mono forces $u=u'$. Nothing more is needed, since the claim is only at most one, so existence is not at issue."
    anki_seeds:
      - front: "To prove two maps into a universally-defined object are equal, use..."
        back: "the uniqueness clause of the object's universal property."
        type: basic
      - front: "$g$ mono and $g\\circ f = g\\circ f'$ implies..."
        back: "$f = f'$."
        type: basic

  - id: mono-epi-iso
    name: Monomorphisms, Epimorphisms, Isomorphisms
    core: true
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: category-definition
        weight: 0.5
        key: true
      - id: isomorphism-vs-equality
        weight: 0.4
        key: true
      - id: functions-injective-surjective
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Monomorphisms as left-cancellable maps
        key_prerequisites: [category-definition]
        constraints: "State the left-cancellation definition, then either a $\\mathbf{Set}$ proof (monos = injections, both directions, using maps from a singleton) or a composite/cancellation argument of at most three lines."
        exemplars:
          - problem: "In Set, let m: {1,2,3} -> {a,b,c} be the map with m(1)=a, m(2)=b, m(3)=b. To show that m is not left-cancellable, find two distinct domain elements that m sends to the same value. Give the two elements as a list."
            answer: "2, 3"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Full object: the map m sends 1 to a, 2 to b, and 3 to b. Step 1: a left-cancellable map must send distinct inputs to distinct outputs, so equal outputs force equal inputs. Step 2: compare the outputs m(2)=b and m(3)=b; the inputs 2 and 3 are distinct. The answer is 2, 3."
          - problem: "Let m: {1,2} -> {3,4} be m(1)=3, m(2)=4, and let n: {3,4} -> {5,6} be n(3)=5, n(4)=6. Both m and n are left-cancellable. Suppose maps f,g: {*} -> {1,2} satisfy (n∘m)∘f = (n∘m)∘g. If f(*)=1, give g(*)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: m sends 1 to 3 and 2 to 4, while n sends 3 to 5 and 4 to 6. Step 1: the composite n∘m sends 1 to 5 and 2 to 6, so it is left-cancellable as a composite of left-cancellable maps. Step 2: from (n∘m)∘f=(n∘m)∘g and f(*)=1, cancellation gives g(*)=f(*)=1. The answer is 1."
          - problem: "In Set, a map m: {1,2} -> {1,2,3} is left-cancellable when m∘f = m∘g implies f = g for all maps f, g: {*} -> {1,2}, and this holds exactly when the two inputs get two distinct outputs. How many such left-cancellable maps are there?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: a left-cancellable map m: {1,2} -> {1,2,3} must send 1 and 2 to two distinct elements of {1,2,3}. Step 1: pick the image of 1, three choices. Step 2: pick the image of 2, any element different from the first image, two choices. Step 3: multiply the independent choices, 3 times 2. The answer is 6."
          - problem: "In Set, let m: {1,2,3} -> {4,5,6,7} be m(1)=4, m(2)=6, m(3)=5. The map m is left-cancellable. If f: {*} -> {1,2,3} satisfies m(f(*))=6, give f(*)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the map m sends 1 to 4, 2 to 6, and 3 to 5. Step 1: left-cancellable in Set means injective, so each output has at most one input. Step 2: the output 6 comes only from the input 2, so m(f(*))=6 forces f(*)=2. The answer is 2."
          - problem: "In Set, let m: {1,2,3} -> {4,5,6} be m(1)=4, m(2)=5, m(3)=6. Suppose maps f,g: {*} -> {1,2,3} satisfy m∘f=m∘g. If f(*)=3, give g(*)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: the map m sends 1 to 4, 2 to 5, and 3 to 6. Step 1: m is left-cancellable, so m∘f=m∘g implies f=g. Step 2: with f(*)=3, the equality f=g gives g(*)=3. The answer is 3."
          - problem: "Claim: In Set, the map m: {1,2} -> {3} with m(1)=m(2)=3 is a monomorphism. Step 1: A map m is mono if m∘f=m∘g implies f=g for all f,g. Step 2: Take f,g: {*} -> {1,2} with f(*)=1 and g(*)=2. Step 3: Then m(f(*))=3=m(g(*)), so m∘f=m∘g. Step 4: Since m is mono, f=g, hence 1=2. Which step is the first step that is not valid?"
            answer: "Step 4"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 correctly states the definition of a monomorphism. Step 2 correctly chooses f(*)=1 and g(*)=2. Step 3 correctly computes that both composites give the sole value 3, so m∘f=m∘g. Step 4 is the first invalid step: it applies the mono property to m even though m is not injective and the claim that m is mono is false. The answer is Step 4."
          - problem: "Write the full proof: In Set, a map m: A -> B is a monomorphism if and only if m is injective. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: state the definition. A map m: A -> B is left-cancellable if for all maps f,g: C -> A, m∘f=m∘g implies f=g. Step 2: assume m is injective. Let f,g: C -> A satisfy m∘f=m∘g. For every c in C, m(f(c))=m(g(c)), so injectivity gives f(c)=g(c); hence f=g. Step 3: assume m is left-cancellable. Take a,a' in A with m(a)=m(a'). Let f,g: {*} -> A be f(*)=a and g(*)=a'. Then m∘f=m∘g, so cancellation gives f=g and therefore a=a'. Thus m is injective. Therefore in Set, monomorphisms are exactly the injective maps."
      - id: kp2
        name: Epimorphisms as right-cancellable maps
        key_prerequisites: [functions-injective-surjective]
        constraints: "Work in $\\mathbf{Set}$ or $\\mathbf{Ring}$ only; a non-surjective epi must be the inclusion $\\mathbb{Z}\\hookrightarrow\\mathbb{Q}$ (or an analogous determination argument), justified by showing maps out of the larger object are determined on the smaller."
        exemplars:
          - problem: "In Set, let s from {1,2,3,4} to {a,b,c,d} be s(1)=a, s(2)=a, s(3)=b, s(4)=b. How many elements of the codomain are not in the image of s?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The image of s is {a,b}, since s(1)=a, s(2)=a, s(3)=b, s(4)=b. The codomain is {a,b,c,d}, so the elements not in the image are c and d. That gives 2 missing elements. The answer is 2."
          - problem: "In Ring, the inclusion of Z into Q is an epimorphism. If f and g are ring maps from Q to R that agree on every integer, then f(3/4) is determined. For f(1)=1, find f(3/4)."
            answer: "3/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A ring map preserves addition and multiplication, so f(m/n)=f(m)f(n)^(-1) for n nonzero. Since f and g agree on Z, f(3)=3 and f(4)=4 when f(1)=1. Thus f(3/4)=3 times the inverse of 4, which is 3/4. The answer is 3/4."
          - problem: "In Set, which function s from {1,2,3} to {a,b,c} is an epimorphism?"
            answer: "s(1)=a, s(2)=b, s(3)=c"
            answer_contract: {"kind": "label", "options": [["s(1)=a, s(2)=b, s(3)=c"], ["s(1)=a, s(2)=a, s(3)=c"], ["s(1)=a, s(2)=b, s(3)=b"], ["s(1)=c, s(2)=c, s(3)=c"]]}
            solution_sketch: "In Set, a function is an epimorphism exactly when it is surjective. The option s(1)=a, s(2)=b, s(3)=c hits all of a, b, and c, so it is surjective and hence epi. The option s(1)=a, s(2)=a, s(3)=c misses b. The option s(1)=a, s(2)=b, s(3)=b misses c. The option s(1)=c, s(2)=c, s(3)=c misses a and b. The answer is s(1)=a, s(2)=b, s(3)=c."
          - problem: "In Set, let s from {1,2,3,4} to {a,b,c} be s(1)=a, s(2)=b, s(3)=b, s(4)=c. How many elements of the codomain have exactly one preimage?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The image of s is {a,b,c}. The preimage of a is {1}, the preimage of b is {2,3}, and the preimage of c is {4}. The elements with exactly one preimage are a and c, so the count is 2. The answer is 2."
          - problem: "Claim: the inclusion of Z into Q is an epimorphism in Ring. Step 1: Let f and g be ring maps from Q to R with f composed with i equal to g composed with i. Step 2: Then f(n)=g(n) for every integer n. Step 3: For m/n in Q, f(m/n)=f(m)+f(n) because f is additive. Step 4: Thus f(m/n)=g(m/n), so f=g. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is the correct set-up for right cancellation. Step 2 correctly restricts agreement to the integers. Step 3 is invalid because a ring map satisfies f(m/n)=f(m)f(n)^(-1), not f(m)+f(n). Step 4 would follow from the corrected formula, so the first invalid step is Step 3. The answer is Step 3."
          - problem: "In Set, let s from {1,2,3,4} to {a,b,c} be s(1)=a, s(2)=b, s(3)=b, s(4)=c. How many elements of the codomain are in the image of s?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The values of s are a, b, b, c, so the image is {a,b,c}. The codomain is {a,b,c}, so all 3 elements are in the image. The answer is 3."
          - problem: "Write the full proof: in Ring, the inclusion of Z into Q is an epimorphism but not surjective. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Let i: Z -> Q be the inclusion. To show i is an epimorphism, let f,g: Q -> R be ring maps with f composed with i equal to g composed with i. Step 2: Then f(n)=g(n) for every integer n, so f and g agree on the image of i. Step 3: For any m/n in Q with n nonzero, f(m/n)=f(m)f(n)^(-1). Since f(m)=g(m) and f(n)=g(n), this equals g(m)g(n)^(-1)=g(m/n). Step 4: Thus f=g, so i is right-cancellable and hence epi. Step 5: The map i is not surjective because 1/2 is not an integer. Therefore the inclusion Z -> Q is an epimorphism but not a surjection, so epi does not imply surjective in Ring."
      - id: kp3
        name: Iso implies mono and epi; the converse can fail
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "The positive direction is a two-line cancellation with the two-sided inverse; the counterexample is $\\mathbb{Z}\\hookrightarrow\\mathbb{Q}$ in $\\mathbf{Ring}$ or a non-identity arrow of a poset category — always name the ambient category."
        exemplars:
          - problem: "In Set, let f: {1,2} -> {1,2} swap 1 and 2, and let g be its inverse. Let a: {1} -> {1,2} send 1 to 1. Compute g(f(a(1)))."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The map a sends 1 to 1, so f(a(1)) = f(1) = 2. The map g is the inverse of f, so g(2) = 1. Thus g(f(a(1))) = 1. The answer is 1."
          - problem: "In the category Ring, the inclusion i: Z -> Q is a monomorphism and an epimorphism. Give one rational number that is not in the image of i, as a fraction."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The image of i is the set of integers inside Q. A rational number is outside the image when its denominator is not 1. The number 1/2 has denominator 2, so it is not an integer. The answer is 1/2."
          - problem: "In the poset category on the set {0,1,2} with the usual order, how many isomorphisms are there? Give the answer as a whole number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a poset category, an arrow x->y is an isomorphism only when x=y. The only such arrows are the three identities 0->0, 1->1, and 2->2. No arrow between distinct objects has an inverse because the reverse inequality fails. The answer is 3."
          - problem: "In the poset category on the set {0,1,2,3} with the usual order, how many non-identity morphisms are both monomorphisms and epimorphisms but not isomorphisms? Give the answer as a whole number."
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a poset category every arrow is a monomorphism and an epimorphism because each hom-set has at most one arrow. An arrow between distinct objects is not an isomorphism since the reverse arrow does not exist. The number of non-identity arrows among four objects is the number of pairs 0<=x<y<=3, which is 6. The answer is 6."
          - problem: "In Set, let f: {1,2,3} -> {1,2,3,4,5} be the inclusion map. How many elements of the codomain lie outside the image of f? Give the answer as a whole number."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The image of the inclusion is the subset {1,2,3}. The codomain is {1,2,3,4,5}. The elements outside the image are 4 and 5. There are two such elements, so the answer is 2."
          - problem: "In the poset category on the set {0,1,2} with the usual order, which of the following arrows is an isomorphism?"
            answer: "0->0"
            answer_contract: {"kind": "label", "options": [["0->0"], ["0->1"], ["1->2"], ["2->1"]]}
            solution_sketch: "An arrow in a poset category is an isomorphism only when its source and target are equal. The arrow 0->1 has no inverse 1->0. The arrow 1->2 has no inverse 2->1. The pair 2->1 is not a morphism because 2 is not less than or equal to 1. Thus only 0->0 is an isomorphism. The answer is 0->0."
          - problem: "Write the full proof: every isomorphism is both a monomorphism and an epimorphism, and the inclusion of Z into Q in Ring is mono and epi but not iso. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1. Let f: A -> B be an isomorphism with inverse g: B -> A. By definition of isomorphism, g composed with f is id_A and f composed with g is id_B. Step 2. To prove f is a monomorphism, suppose f composed with a equals f composed with b for arrows a,b: C -> A. Compose with g on the left: g composed with (f composed with a) equals g composed with (f composed with b). Associativity gives (g composed with f) composed with a equals (g composed with f) composed with b. Since g composed with f is id_A, the identity law gives a = b. Thus f is mono. Step 3. To prove f is an epimorphism, suppose c composed with f equals d composed with f for arrows c,d: B -> D. Compose with g on the right: (c composed with f) composed with g equals (d composed with f) composed with g. Associativity gives c composed with (f composed with g) equals d composed with (f composed with g). Since f composed with g is id_B, the identity law gives c = d. Thus f is epi. Step 4. In Ring, let i: Z -> Q be the inclusion. It is mono because if two ring maps agree after i, they agree on every integer. It is epi: if c composed with i equals d composed with i, then c(n)=d(n) for all integers n, and for m/n in Q we have c(m/n)=c(m)c(n)^{-1}=d(m)d(n)^{-1}=d(m/n), so c=d. Step 5. It is not an isomorphism because an inverse ring map Q -> Z would send 1/2 to an integer k with 2k=1, which is impossible. Therefore i is mono and epi but not iso. This completes the proof."
    diagnostic_exemplar:
      problem: "In $\\mathbf{Set}$, show that the inclusion $m\\colon\\{1,2\\}\\hookrightarrow\\{1,2,3\\}$ is a monomorphism but not an epimorphism."
      answer: "Mono: if $m\\circ f=m\\circ g$ for $f,g\\colon X\\to\\{1,2\\}$, then $f(x)=m(f(x))=m(g(x))=g(x)$ for every $x$, so $f=g$. Not epi: define $f,g\\colon\\{1,2,3\\}\\to\\{0,1\\}$ by $f\\equiv 0$ and $g(1)=g(2)=0$, $g(3)=1$; then $f\\circ m=g\\circ m$ (both vanish on $1,2$) but $f\\ne g$, so $m$ is not right-cancellable."
      solution_sketch: "Mono is injectivity of $m$ applied pointwise to $f$ and $g$. Failure of epi has to be produced: exhibit two maps out of $\\{1,2,3\\}$ that agree on $\\{1,2\\}$ but differ at $3$ — all the freedom lives at the element $m$ misses."
    anki_seeds:
      - front: "Define a monomorphism (mono)."
        back: "a map $m$ with $m\\circ f=m\\circ g\\Rightarrow f=g$ (left-cancellable)."
        type: basic
      - front: "Define an epimorphism (epi)."
        back: "a map $e$ with $f\\circ e=g\\circ e\\Rightarrow f=g$ (right-cancellable)."
        type: basic
      - front: "In $\\mathbf{Set}$: monos are {{c1::injections}}, epis are {{c2::surjections}}."
        back: "injections; surjections"
        type: cloze
      - front: "Does mono + epi imply iso?"
        back: "Not in general (e.g. $\\mathbb{Z}\\hookrightarrow\\mathbb{Q}$ in $\\mathbf{Ring}$); yes in $\\mathbf{Set}$."
        type: basic

  - id: groupoids
    name: Groupoids
    core: false                # example class; terminal
    difficulty: 0.63
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: isomorphism-vs-equality
        weight: 0.5
        key: true
      - id: poset-monoid-categories
        weight: 0.4
        key: true
      - id: discrete-indiscrete-categories
        weight: 0.3
      - id: examples-of-categories
        weight: 0.2
      - id: relations-equivalence
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Definition and first examples
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "Examples must be checked against the definition: exhibit a two-sided inverse for each morphism."
        exemplars:
          - problem: "Let G be the integers modulo 5 under addition, viewed as the one-object groupoid BG. The morphisms of BG are the elements of G and composition is addition. The morphism 2 from the single object to itself has a two-sided inverse. Give the inverse."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule R1: In BG the morphisms are the elements of G and composition is addition. The inverse of an element g is the element h with g plus h equal to 0. For g equal to 2 modulo 5, h is 3 because 2 plus 3 is 0 and 3 plus 2 is 0. The inverse is 3."
          - problem: "A finite category C has exactly 7 isomorphisms. Its core is the subcategory with all objects of C and only the isomorphisms of C. How many morphisms does the core have?"
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule R1: The core keeps all objects of C and exactly the isomorphisms of C. It has no other morphisms, because the core is the subcategory of isomorphisms. Since C has exactly 7 isomorphisms, the core has 7 morphisms. The number of morphisms in the core is 7."
          - problem: "Let S be a set with 6 elements and consider the discrete category on S. Every morphism is an identity and is its own two-sided inverse. How many morphisms does this category have?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule R1: In the discrete category on S, the only morphism with source x is the identity at x. A set with 6 elements gives one identity for each element, so there are 6 morphisms. Each identity is its own two-sided inverse, so the category is a groupoid. The number of morphisms is 6."
          - problem: "Let S be a set with 3 elements and consider the indiscrete category on S. There is exactly one morphism from x to y for each ordered pair of elements x and y. How many morphisms does this category have?"
            answer: "9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule R1: In the indiscrete category on S, there is exactly one morphism from x to y for each ordered pair (x,y). A set with 3 elements has 3 times 3 equal to 9 ordered pairs, so there are 9 morphisms. The unique morphism from x to y has as two-sided inverse the unique morphism from y to x. The number of morphisms is 9."
          - problem: "Claim: the category with one object and two morphisms, 1 and e, with composition e composed with e equal to e, is a groupoid. Step 1: A groupoid is a category in which every morphism has a two-sided inverse. Step 2: The category has morphisms 1 and e, and e composed with e is e. Step 3: Since e composed with e is e, multiplying both sides by an inverse of e gives e equal to 1. Step 4: Therefore e equals 1, so every morphism has a two-sided inverse. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Rule R15: Step 1 is the correct definition of a groupoid. Step 2 correctly lists the two morphisms and the rule e composed with e equal to e. Step 3 is not valid: it uses an inverse of e before proving that e has an inverse, which is the point at issue. Step 4 is false: the conclusion e equal to 1 does not follow, and e is not invertible. The first invalid step is Step 3."
          - problem: "A category has objects A and B and exactly three morphisms: the identity at A, the identity at B, and f from A to B. It is not a groupoid because f has no two-sided inverse. What is the smallest number of additional morphisms needed to make it a groupoid?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Rule R1: A groupoid must contain a two-sided inverse for every morphism. The morphism f from A to B currently has no morphism from B to A. Adding one morphism g from B to A gives g composed with f equal to the identity at A and f composed with g equal to the identity at B, because those are the only possible endomorphisms. No further morphism is needed, so the minimum is 1."
          - problem: "Write the full proof: in any groupoid, every morphism has exactly one two-sided inverse. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Let C be a groupoid and let f be a morphism from A to B. By the definition of a groupoid, f has at least one two-sided inverse g from B to A, so g composed with f is the identity at A and f composed with g is the identity at B. Step 2: Suppose h from B to A is another two-sided inverse of f. Then h composed with f is the identity at A and f composed with h is the identity at B. Step 3: Compute h equal to h composed with the identity at B, which equals h composed with f composed with g, which equals h composed with f composed with g, which equals the identity at A composed with g, which equals g, using associativity and the identity laws. Step 4: Thus any two inverses of f are equal, so f has exactly one two-sided inverse. Since f was arbitrary, every morphism in the groupoid has exactly one two-sided inverse."
      - id: kp2
        name: Automorphism groups and hom-set sizes
        key_prerequisites: [poset-monoid-categories]
        constraints: "Work with a fixed object and a fixed chosen isomorphism; state the bijection explicitly."
        exemplars:
          - problem: "In the groupoid with one object x, suppose Aut(x) is isomorphic to Z/4. How many elements does Aut(x) have?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Aut(x) is the group of isomorphisms x -> x. It is given to be isomorphic to Z/4, so it has the same size as Z/4. Z/4 = {0,1,2,3} has 4 elements. Therefore Aut(x) has 4 elements."
          - problem: "Let x and y be objects of a groupoid with a chosen isomorphism u: x -> y. Suppose Aut(x) is isomorphic to Z/3. How many elements does Hom(x,y) have?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a groupoid, fix an isomorphism u: x -> y. The map h -> u^(-1) h is a bijection from Hom(x,y) to Aut(x). Therefore Hom(x,y) has the same size as Aut(x). Aut(x) is isomorphic to Z/3, so it has 3 elements. Thus Hom(x,y) has 3 elements."
          - problem: "In a groupoid with one object x, let Aut(x) contain an element a such that a^6 = 1_x and no smaller positive power of a equals 1_x. What is the order of a?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a groupoid with one object x, Aut(x) is the group of isomorphisms x -> x. If Aut(x) contains an element a with a^6 = 1_x and no smaller positive power equal to 1_x, then a has order 6. The set {1, a, a^2, a^3, a^4, a^5} already has six distinct elements. Therefore the order of a is 6."
          - problem: "A groupoid has objects x, y, and z. Aut(x) is isomorphic to Z/2. Hom(x,y) and Hom(y,z) are nonempty. What is the size of Hom(x,z)?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a groupoid, if Hom(x,y) is nonempty, then Hom(x,y) is in bijection with Aut(x), so they have the same size. Since Hom(x,y) is nonempty, x and y are isomorphic; likewise y and z are isomorphic. Thus x and z are isomorphic, so Hom(x,z) is nonempty. Therefore Hom(x,z) is in bijection with Aut(x). Aut(x) is isomorphic to Z/2, so it has 2 elements. Hence Hom(x,z) has 2 elements."
          - problem: "Claim: In a groupoid, fix objects x,y and an isomorphism u: x -> y. The map h -> u^(-1) h is a bijection Hom(x,y) -> Aut(x). Step 1: Fix u: x -> y. Step 2: For h: x -> y, u^(-1) h is an arrow x -> x. Step 3: The map a -> u^(-1) a is its inverse. Step 4: Therefore Hom(x,y) and Aut(x) have the same size. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: it fixes the isomorphism u. Step 2 is valid: u^(-1) h is an arrow x -> x. Step 3 is not valid: the inverse map should be a -> u a, not a -> u^(-1) a, because u^(-1)(u^(-1) h) = u^(-2) h, which is not h in general. Step 4 is valid only if Step 3 were correct; since Step 3 is the first invalid step, the answer is Step 3."
          - problem: "A groupoid has exactly two objects x and y. Both Aut(x) and Aut(y) are isomorphic to Z/4. Hom(x,y) is nonempty. How many morphisms does the groupoid have in total?"
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A groupoid with two objects x and y has morphisms partitioned into Aut(x), Aut(y), Hom(x,y), and Hom(y,x). Since Hom(x,y) is nonempty, the groupoid is connected, so Hom(x,y) is in bijection with Aut(x), and Hom(y,x) is in bijection with Aut(y). Thus the size of Hom(x,y) is 4 and the size of Hom(y,x) is 4. The total number of morphisms is 4 + 4 + 4 + 4 = 16."
          - problem: "Write the full proof: In a groupoid, if u: x -> y is an isomorphism, then the map h -> u^(-1) h is a bijection from Hom(x,y) to Aut(x). Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Fix an isomorphism u: x -> y. Step 2: Define the map Phi(h) = u^(-1) h for h: x -> y. Since u^(-1): y -> x and h: x -> y, the composite is an arrow x -> x, so Phi(h) belongs to Aut(x). Step 3: Define the map Psi(a) = u a for a: x -> x. Then Psi(a): x -> y, so it is in Hom(x,y). Step 4: Check Psi(Phi(h)) = u (u^(-1) h) = (u u^(-1)) h = 1_y h = h by associativity and the inverse law. Step 5: Check Phi(Psi(a)) = u^(-1) (u a) = (u^(-1) u) a = 1_x a = a. Thus Phi and Psi are mutually inverse bijections. Therefore Hom(x,y) and Aut(x) are in bijection."
      - id: kp3
        name: Thin groupoids are equivalence relations
        key_prerequisites: [relations-equivalence]
        constraints: "Two shapes: (i) the dictionary proof relating each of reflexivity, symmetry, transitivity to a specific category axiom (identities, inverses, composition); (ii) partition arguments showing isomorphism classes (connected components) partition the objects of a groupoid."
        exemplars:
          - problem: "In a thin groupoid, an arrow x -> y and an arrow y -> z compose to an arrow x -> z. Which property of the induced relation on objects does this composition give? Select one."
            answer: "transitivity"
            answer_contract: {"kind": "label", "options": [["reflexivity"], ["symmetry"], ["transitivity"], ["associativity"]]}
            solution_sketch: "Step 1: in the induced relation, x ~ y holds when there is an arrow x -> y. Step 2: composition sends arrows x -> y and y -> z to an arrow x -> z, so x ~ y and y ~ z imply x ~ z; this is exactly transitivity. The option reflexivity is the error of confusing the source of the property: reflexivity of the relation comes from identity arrows, not from composition. The option symmetry is the error of forgetting that the reverse arrow comes from inverses, not from composing two arrows. The option associativity is the error of citing a category axiom that holds in every category but is not a property of the induced relation. The answer is transitivity."
          - problem: "A groupoid has objects 0, 1, 2, 3, 4. The only non-identity isomorphisms are generated by arrows 0 -> 1 and 2 -> 3. How many connected components does the groupoid have? Give a number."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: connected components are the isomorphism classes of objects, and isomorphism is an equivalence relation, so its classes partition the objects. Step 2: the arrow 0 -> 1 links 0 and 1, and its inverse links 1 and 0. Step 3: the arrow 2 -> 3 links 2 and 3, and its inverse links 3 and 2. Step 4: the object 4 is isomorphic only to itself, so it forms a class alone. The classes are {0,1}, {2,3}, {4}. The answer is 3."
          - problem: "In a groupoid, every arrow f from x to y has a reverse arrow from y to x. Which category axiom guarantees that reverse arrow? Select one."
            answer: "inverses"
            answer_contract: {"kind": "label", "options": [["identities"], ["inverses"], ["composition"], ["associativity"]]}
            solution_sketch: "Step 1: an arrow f: x -> y in a groupoid has, by the groupoid axiom, an inverse g: y -> x with gf = 1x and fg = 1y. Step 2: this inverse g is the reverse arrow, so symmetry of the induced relation corresponds to inverses. The option identities is the error of confusing reflexivity with symmetry: identities give arrows x -> x, not a reverse arrow x -> y. The option composition is the error of confusing transitivity with symmetry: composition gives an arrow x -> z from arrows x -> y and y -> z, not the reverse arrow y -> x. The option associativity is the error of citing an axiom that holds in every category and does not produce any arrow. The answer is inverses."
          - problem: "A groupoid has objects 1, 2, 3, 4, 5. Suppose 1 is isomorphic to 2, and 2 is isomorphic to 4. No other isomorphisms hold except those forced. Give the largest object in the isomorphism class of 1."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: isomorphism of objects in a groupoid is an equivalence relation, so its classes partition the objects. Step 2: symmetry gives 2 ~ 1 and 4 ~ 2. Step 3: transitivity gives 1 ~ 4. Step 4: object 3 and object 5 are isomorphic only to themselves, so they lie outside the class of 1. The class of 1 is {1,2,4}, and its largest object is 4. The answer is 4."
          - problem: "A thin category on objects 1, 2, 3 is missing exactly one identity arrow. It has identity arrows on 2 and 3. Which object lacks its identity arrow? Give the smallest such object."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: a thin groupoid corresponds to an equivalence relation, and reflexivity of that relation needs x ~ x for every object x. Step 2: x ~ x comes from the identity arrow 1x, so an identity arrow must exist on each object. Step 3: objects 2 and 3 have their identity arrows, so the missing identity arrow is on object 1. The answer is 1."
          - problem: "In the dictionary proof, reflexivity of the relation corresponds to which category axiom? Select one."
            answer: "identities"
            answer_contract: {"kind": "label", "options": [["identities"], ["inverses"], ["composition"], ["associativity"]]}
            solution_sketch: "Step 1: the relation is x ~ y when an arrow x -> y exists. Step 2: reflexivity needs x ~ x for every object, and the arrow x -> x is exactly the identity arrow 1x. Step 3: so reflexivity corresponds to identities. The option inverses is the error of matching symmetry to the wrong property: inverses give the reverse arrow y -> x, not the loop x -> x. The option composition is the error of matching transitivity to the wrong property: composition builds x -> z from x -> y and y -> z, not the loop x -> x. The option associativity is the error of citing an axiom of every category that produces no arrow at all. The answer is identities."
          - problem: "Write the full proof: a groupoid in which every hom-set has at most one element is the same thing as an equivalence relation on its objects. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (definition): call a groupoid thin when each hom-set has at most one arrow. Step 2 (relation): define x ~ y iff there is an arrow x -> y. Step 3 (reflexivity): the identity arrow 1x gives x ~ x. Step 4 (symmetry): every arrow x -> y in a groupoid has an inverse y -> x, so x ~ y gives y ~ x. Step 5 (transitivity): arrows x -> y and y -> z compose to x -> z, so x ~ y and y ~ z give x ~ z. Thus ~ is an equivalence relation. Step 6 (converse): given an equivalence relation ~ on a set, form the thin category with one arrow x -> y exactly when x ~ y. Step 7: identities come from reflexivity, inverses from symmetry, and composition from transitivity; hence this category is a groupoid. The two constructions are mutually inverse, so a thin groupoid is exactly an equivalence relation on its objects."
    diagnostic_exemplar:
      problem: "Let $x$ be an object of a groupoid $\\mathcal G$. Prove that $\\mathrm{Aut}(x)=\\mathrm{Hom}(x,x)$ is a group under composition."
      answer: "Any two arrows $x\\to x$ are composable, so composition is a binary operation on $\\mathrm{Hom}(x,x)$; it is associative and has $1_x$ as a two-sided unit by the category axioms. By the groupoid axiom every $a\\colon x\\to x$ has a two-sided inverse $a^{-1}$, which is again an arrow $x\\to x$. Hence every element is invertible and $\\mathrm{Aut}(x)$ is a group."
      solution_sketch: "Check the group axioms one at a time against the category axioms: closure because any two arrows $x\\to x$ are composable, associativity and the unit $1_x$ from the category axioms, and inverses from the groupoid hypothesis."
    anki_seeds:
      - front: "Define a groupoid."
        back: "a category in which every morphism is an isomorphism."
        type: basic
      - front: "A one-object groupoid is the same thing as a {{c1::group}}."
        back: "group"
        type: cloze
      - front: "What is the core of a category $\\mathcal C$?"
        back: "the subgroupoid with all objects of $\\mathcal C$ and only its isomorphisms."
        type: basic

  - id: sections-retractions
    name: Sections and Retractions
    core: false
    difficulty: 0.65
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: mono-epi-iso
        weight: 0.5
        key: true
      - id: isomorphism-vs-equality
        weight: 0.3
      - id: category-definition
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Split monos and split epis
        key_prerequisites: [mono-epi-iso]
        constraints: "State the defining equation ($r\\circ s=1$) before cancelling with it; $\\mathbf{Set}$ constructions may invoke choice for sections and a basepoint for retractions; concrete sets of size at most 4."
        exemplars:
          - problem: "Let f: {1,2,3} -> {a,b} be the map f(1)=a, f(2)=b, f(3)=a. A section s satisfies f o s = 1_{a,b}. Find s(b)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The defining equation is f o s = 1_{a,b}. Apply both sides to b: f(s(b)) = b. The only element sent to b is 2 because f(1)=a, f(2)=b, and f(3)=a. Thus s(b) = 2. The answer is 2."
          - problem: "Let m: {1,2} -> {a,b,c} be the map m(1)=b, m(2)=c. A retraction r satisfies r o m = 1_{1,2}. With basepoint a sent to 1, find r(a)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The defining equation is r o m = 1_{1,2}. Apply both sides to 2: r(m(2)) = 2. Since m(2)=c, r(c)=2. The basepoint a is not in the image of m and is sent to 1, so r(a)=1. The answer is 1."
          - problem: "Let f: {1,2,3,4} -> {a,b,c} be the map f(1)=a, f(2)=b, f(3)=c, f(4)=a. A section s satisfies f o s = 1_{a,b,c}. How many sections does f have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The defining equation is f o s = 1_{a,b,c}. For each output, a section must choose a preimage. The element a has preimages 1 and 4, b has preimage 2, and c has preimage 3. Thus there are 2 choices for s(a) and no choice for the others, so 2 sections. The answer is 2."
          - problem: "In the category with objects A and B and only the morphisms 1_A, 1_B, and f: A -> B, a section s of f satisfies f o s = 1_B. How many sections does f have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The defining equation is f o s = 1_B. A section s would be a morphism from B to A. The given category has only 1_A, 1_B, and f: A -> B. There is no morphism from B to A, so no section exists. The answer is 0."
          - problem: "Let m: {2,3} -> {x,y,z} be the map m(2)=y, m(3)=z. A retraction r satisfies r o m = 1_{2,3}. How many retractions does m have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (defining equation): a retraction r of m satisfies r o m = 1_{2,3}. Step 2 (apply the equation): applying both sides to 2 gives r(m(2)) = r(y) = 2, and applying both sides to 3 gives r(z) = 3. Step 3 (free choice): the element x is not in the image of m, so r(x) may be 2 or 3 independently, giving 2 retractions. The answer is 2."
          - problem: "In the proof that a split epi is epi, suppose r o s = 1_B. The line f = ? is missing. Select the line that follows from f o 1_B = f."
            answer: "f = f o (r o s)"
            answer_contract: {"kind": "label", "options": [["f = f o (r o s)"], ["f = f o (s o r)"], ["f = (f o s) o r"], ["f = g o (r o s)"]]}
            solution_sketch: "Start with f = f o 1_B by the identity law. Replace 1_B by r o s using the defining equation r o s = 1_B. Associativity gives f = f o (r o s). The wrong option f o (s o r) reverses the composition order. The wrong option (f o s) o r has the wrong type. The wrong option g o (r o s) uses g before the hypothesis f o r = g o r. The answer is f = f o (r o s)."
          - problem: "Write the full proof: in a category, a morphism with a retraction is a monomorphism, and a morphism with a section is an epimorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: let m: A -> B and let r: B -> A satisfy r o m = 1_A. Suppose m o f = m o g for parallel maps f,g: C -> A. Step 2: compose on the left with r. By associativity, (r o m) o f = (r o m) o g. Step 3: replace r o m by 1_A, so 1_A o f = 1_A o g. By the identity law, f = g. Thus m is monic. Step 4: let e: A -> B and let s: B -> A satisfy e o s = 1_B. Suppose f o e = g o e for parallel maps f,g: B -> C. Step 5: compose on the right with s. By associativity, f o (e o s) = g o (e o s). Step 6: replace e o s by 1_B, so f o 1_B = g o 1_B. By the identity law, f = g. Thus e is epic. The proof shows a split mono is monic and a split epi is epic."
      - id: kp2
        name: When splitting plus cancellation gives an isomorphism
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "Purely equational proofs from $r\\circ m=1$ and/or $m\\circ s=1$ plus at most one mono/epi cancellation; each step cites the hypothesis or axiom used."
        exemplars:
          - problem: "In the category Set, let A={1,2} and B={1,2}. Let m: A->B be m(1)=2, m(2)=1. Suppose r: B->A satisfies r∘m=id_A and s: B->A satisfies m∘s=id_B. Compute r(1)."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "First, note that r∘m=1_A and m∘s=1_B. By associativity, r = r∘1_B = r∘(m∘s) = (r∘m)∘s = 1_A∘s = s. Thus the left inverse r and the right inverse s coincide. Since m(1)=2, we have m(2)=1, so the inverse sends 1 to 2. The answer is 2."
          - problem: "In Set, let A={1,2,3} and B={1,2,3}. Let m: A->B be m(1)=3, m(2)=1, m(3)=2. Suppose r: B->A satisfies r∘m=id_A and m is an epimorphism. Compute r(2)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "We have r∘m=1_A. Then (m∘r)∘m = m∘(r∘m) = m∘1_A = m = 1_B∘m by associativity, identity, and the hypothesis. Since m is epi, right-cancel m to get m∘r=1_B. So r is a two-sided inverse. Since m(3)=2, the inverse sends 2 to 3. The answer is 3."
          - problem: "Claim: if r∘m=1_A then m∘r=1_B. Step 1: (m∘r)∘m = m∘(r∘m) by associativity. Step 2: m∘(r∘m) = m∘1_A = m by the hypothesis. Step 3: so m∘r = 1_B by cancellation. Step 4: thus m is an isomorphism. Which step is the first invalid step?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid by associativity. Step 2 is valid by the hypothesis r∘m=1_A. Step 3 is invalid: from (m∘r)∘m = 1_B∘m one may cancel m only if m is an epimorphism. Step 4 relies on Step 3. The answer is Step 3."
          - problem: "In the proof that a split mono m with r∘m=1_A and epi m is an isomorphism, the line after (m∘r)∘m = m∘(r∘m) = m∘1_A = m is missing. Select the line that completes the right-cancellation step."
            answer: "m o r = 1_B"
            answer_contract: {"kind": "label", "options": [["m o r = 1_B"], ["m o r = m"], ["r o m = 1_B"], ["m o r = 1_A"]]}
            solution_sketch: "The line before shows (m∘r)∘m = 1_B∘m. Since m is epi, right-cancel m to get m o r = 1_B. Option m o r = m confuses the identity on B. Option r o m = 1_B swaps the order. Option m o r = 1_A uses the wrong object. The answer is m o r = 1_B."
          - problem: "In the proof that a split mono plus epi is an isomorphism, the step (m∘r)∘m = m∘(r∘m) uses which axiom?"
            answer: "associativity"
            answer_contract: {"kind": "label", "options": [["associativity"], ["identity"], ["hypothesis"], ["epimorphism"]]}
            solution_sketch: "The step (m∘r)∘m = m∘(r∘m) regroups a composition of three morphisms, so the axiom used is associativity. Option identity is the error of citing the law that removes m∘1_A, which is not a regrouping. Option hypothesis is the error of citing r∘m=1_A, which the rewrite does not use. Option epimorphism is the error of citing a cancellation property, which no rewrite of the two sides needs. The answer is associativity."
          - problem: "In Set, let A={1,2,3,4} and B={1,2,3,4}. Let m: A->B be m(1)=2, m(2)=4, m(3)=1, m(4)=3. Suppose r: B->A satisfies r∘m=id_A and m is an epimorphism. Compute r(1)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "We have r∘m=1_A and m is epi. Then (m∘r)∘m = m∘(r∘m) = m = 1_B∘m. Right-cancel m to get m∘r=1_B, so r is a two-sided inverse. Since m(3)=1, the inverse sends 1 to 3. The answer is 3."
          - problem: "Write the full proof: if m: A->B is a split epimorphism and a monomorphism, then m is an isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (hypothesis): m is a split epi, so there is s: B->A with m∘s=1_B. Step 2 (hypothesis): m is a monomorphism, so m is left-cancellable. Step 3 (associativity and identity): compute m∘(s∘m) = (m∘s)∘m = 1_B∘m = m. Also m = m∘1_A. So m∘(s∘m) = m∘1_A. Step 4 (cancellation): since m is mono, cancel m on the left to get s∘m=1_A. Step 5 (conclusion): m∘s=1_B and s∘m=1_A, so s is a two-sided inverse and m is an isomorphism."
    diagnostic_exemplar:
      problem: "Let $m\\colon A\\to B$ be a split monomorphism (some $r\\colon B\\to A$ satisfies $r\\circ m=1_A$) which is also an epimorphism. Prove that $m$ is an isomorphism."
      answer: "$(m\\circ r)\\circ m=m\\circ(r\\circ m)=m\\circ 1_A=m=1_B\\circ m$. Since $m$ is an epimorphism, right-cancel it to get $m\\circ r=1_B$. Together with $r\\circ m=1_A$, $r$ is a two-sided inverse, so $m$ is an isomorphism."
      solution_sketch: "You have $r\\circ m=1_A$ and want $m\\circ r=1_B$. Manufacture an equation with $m$ on the right — $(m\\circ r)\\circ m=m=1_B\\circ m$ — and then right-cancel $m$ using the epi hypothesis."
    anki_seeds:
      - front: "If $r\\circ s=1$: which map is the section, which the retraction?"
        back: "$s$ is the section (right inverse); $r$ is the retraction (left inverse)."
        type: basic
      - front: "A morphism with a section (right inverse) is called a...?"
        back: "a split epimorphism."
        type: basic
      - front: "A morphism with a retraction (left inverse) is called a...?"
        back: "a split monomorphism."
        type: basic
      - front: "Split mono $+$ split epi $\\Rightarrow$ ?"
        back: "isomorphism (the one-sided inverses coincide)."
        type: basic

  - id: epi-mono-factorizations
    name: Image Factorizations and Subobjects
    core: false                # terminal enrichment on mono/epi
    difficulty: 0.68
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: mono-epi-iso
        weight: 0.6
        key: true
      - id: isomorphism-vs-equality
        weight: 0.3
        key: true
      - id: commutative-diagrams
        weight: 0.2
      - id: diagram-chasing
        weight: 0.2
      - id: functions-injective-surjective
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: The image factorization in Set
        key_prerequisites: [mono-epi-iso]
        constraints: "Finite sets of size at most 5 for concrete instances; always name the image explicitly."
        exemplars:
          - problem: "Show every function $f\\colon A\\to B$ factors as a surjection followed by an injection, and prove the factorization is unique up to a unique isomorphism."
            answer: "$f=m\\circ e$ with $e\\colon A\\twoheadrightarrow f[A]$ and $m\\colon f[A]\\hookrightarrow B$; any other such factorization differs by a unique bijection."
            solution_sketch: "Let $I=f[A]$, let $e(a)=f(a)$ (surjective onto $I$) and let $m$ be the inclusion $I\\hookrightarrow B$; then $m\\circ e=f$. Suppose also $f=m'\\circ e'$ with $e'\\colon A\\twoheadrightarrow I'$ surjective and $m'\\colon I'\\hookrightarrow B$ injective. Then $m'[I']=m'[e'[A]]=f[A]=I$, so $m'$ corestricts to a bijection $\\varphi\\colon I'\\to I$ with $m\\circ\\varphi=m'$. Also $m\\circ\\varphi\\circ e'=m'\\circ e'=f=m\\circ e$, and $m$ is injective, so $\\varphi\\circ e'=e$. Finally $\\varphi$ is unique: any $\\psi$ with $m\\circ\\psi=m'$ satisfies $\\psi=\\varphi$ because $m$ is monic."
          - problem: "Compute the image factorization of $f\\colon\\{1,2,3,4\\}\\to\\{a,b,c\\}$ given by $f(1)=a$, $f(2)=a$, $f(3)=c$, $f(4)=c$."
            answer: "$A\\twoheadrightarrow\\{a,c\\}\\hookrightarrow\\{a,b,c\\}$; the image is $\\{a,c\\}$ and $b$ is not hit."
            solution_sketch: "The image is $f[A]=\\{a,c\\}$. The surjective part $e\\colon\\{1,2,3,4\\}\\to\\{a,c\\}$ sends $1,2\\mapsto a$ and $3,4\\mapsto c$; the injective part is the inclusion $\\{a,c\\}\\hookrightarrow\\{a,b,c\\}$. Their composite is $f$, and $e$ is surjective while the inclusion is injective, as required."
      - id: kp2
        name: The diagonal fill-in
        key_prerequisites: [diagram-chasing]
        constraints: "State which of 'epi' and 'mono' is used at each step; uniqueness must come from the mono."
        exemplars:
          - problem: "In Set, let e: A -> X be surjective and m: Y -> B be injective, and suppose v(e(a)) = m(u(a)) for all a. Take A = {1,2,3}, X = {1,2}, with e(1)=e(2)=1 and e(3)=2. Take Y = {10,20}, B = {10,20,30}, with m(10)=10 and m(20)=20. Take u(1)=u(2)=10 and u(3)=20, and v(1)=10, v(2)=20. A diagonal d satisfies d(e(a)) = u(a) and m(d(x)) = v(x). Give d(2)."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use the epi property of e to pick a representative for x=2; e(3)=2, so d(2)=u(3)=20 from d(e(a))=u(a). Step 2: For uniqueness use the mono property of m; if another d' had d'(2)=y then m(y)=v(2)=20, and m injective gives y=20. The answer is 20."
          - problem: "In Set, let e: A -> X be surjective and m: Y -> B be injective, with v(e(a)) = m(u(a)) for all a. Take A = {1,2,3,4}, X = {1,2,3}, where e(1)=1, e(2)=2, e(3)=2, e(4)=3. Take Y = {0,1,2}, B = {0,1,2,3,4}, with m(0)=0, m(1)=2, m(2)=4. Take u(1)=0, u(2)=1, u(3)=1, u(4)=2, and v(1)=0, v(2)=2, v(3)=4. A diagonal d satisfies d(e(a)) = u(a) and m(d(x)) = v(x). Give d(2)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use the epi property of e to choose a with e(a)=2; both a=2 and a=3 work. Step 2: Apply d(e(a))=u(a) to a=2: d(2)=u(2)=1. Step 3: For well-definedness use the mono property of m; if another choice gave y with m(y)=v(2)=2, then m injective gives y=1. The answer is 1."
          - problem: "In Set, let m: Y -> B be injective with m(y)=2y. Suppose a diagonal d satisfies m(d(x)) = v(x) and v(2)=6. Find d(2)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Apply m(d(x))=v(x) at x=2: m(d(2))=6. Step 2: Use the mono property of m to cancel; solve m(y)=6. Since m(y)=2y, 2d(2)=6, so d(2)=3. The answer is 3."
          - problem: "In Set, let e: A -> X be surjective with e(1)=e(2)=3. A diagonal d satisfies d(e(a)) = u(a) and d(3)=7. Find u(2)."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Use d(e(a))=u(a) with a=2; e(2)=3, so d(3)=u(2). Step 2: The value d(3)=7 is given, so u(2)=7. The epi property of e guarantees that a representative exists, but the value is forced by a=2. The answer is 7."
          - problem: "Claim: In Set, if e is surjective, m is injective, and v(e(a)) = m(u(a)) for all a, then d(x)=u(a) for any a with e(a)=x is well defined. Step 1: Given x in X, choose a in A with e(a)=x using that e is epi. Step 2: Set d(x)=u(a). Step 3: If e(a)=e(a')=x, then m(u(a))=v(e(a))=v(e(a'))=m(u(a')), so u(a)=u(a') because m is epi. Step 4: Therefore d is well defined. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: e epi gives a representative a with e(a)=x. Step 2 is valid as the definition of d(x). Step 4 would follow once Step 3 is corrected. Step 3 is invalid: it uses m as if m were epi, but the hypothesis is that m is mono. From m(u(a))=m(u(a')) and m mono, left-cancellation gives u(a)=u(a'). The answer is Step 3."
          - problem: "In the well-definedness proof for d(x)=u(a), the line after m(u(a))=v(e(a))=v(e(a'))=m(u(a')) is missing. Select the line that completes the proof using the correct property of m."
            answer: "u(a)=u(a')"
            answer_contract: {"kind": "label", "options": [["u(a)=u(a')"], ["m(a)=m(a')"], ["v(a)=v(a')"], ["e(a)=e(a')"]]}
            solution_sketch: "The missing line must apply the mono property of m. From m(u(a))=m(u(a')) and m monic, left-cancellation gives u(a)=u(a'). The option m(a)=m(a') misapplies m to the object a instead of its image u(a). The option v(a)=v(a') applies v to the wrong object. The option e(a)=e(a') is the chosen equality of x and does not use m. The answer is u(a)=u(a')."
          - problem: "Write the full proof: in Set, let e: A -> X be surjective, let m: Y -> B be injective, and suppose v(e(a)) = m(u(a)) for all a. Prove that the rule d(x)=u(a) for any a with e(a)=x gives a well-defined function d: X -> Y. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Proof. Given x in X, the epi property of e (surjectivity) gives at least one a in A with e(a)=x, so the rule can choose a value. Define d(x)=u(a) for such an a. To show well defined, suppose e(a)=e(a')=x. Then v(e(a))=v(e(a')) by equal arguments, and the square identity gives m(u(a))=v(e(a))=v(e(a'))=m(u(a')). Since m is mono (injective), left-cancellation yields u(a)=u(a'). Thus the value d(x) does not depend on the chosen a. The rule defines a function d: X -> Y, and the independence step uses the mono property of m."
      - id: kp3
        name: Subobjects as isomorphism classes of monomorphisms
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "Order monos by factorization; every comparison map must be justified as unique."
        exemplars:
          - problem: "For monomorphisms $m\\colon S\\to B$ and $m'\\colon S'\\to B$, define $m\\le m'$ to mean $m=m'\\circ t$ for some $t$. Prove $\\le$ is a preorder and that $m\\le m'\\le m$ forces $t$ to be an isomorphism."
            answer: "Reflexive via $1$, transitive by composing the comparison maps; mutual factorization gives mutually inverse $t,t'$."
            solution_sketch: "Reflexivity: $m=m\\circ 1_S$. Transitivity: if $m=m'\\circ t$ and $m'=m''\\circ s$ then $m=m''\\circ(s\\circ t)$. The factoring map is unique, since $m'\\circ t=m'\\circ \\tilde t$ and $m'$ monic give $t=\\tilde t$. Now suppose $m=m'\\circ t$ and $m'=m\\circ t'$. Then $m=m\\circ t'\\circ t$, and $m$ monic gives $t'\\circ t=1_S$; symmetrically $t\\circ t'=1_{S'}$. So $t$ is an isomorphism, and it is the unique one commuting with $m,m'$."
          - problem: "Define a subobject of $B$ and identify the subobjects of a set $B$ in $\\mathbf{Set}$."
            answer: "An equivalence class of monos into $B$ under the above isomorphism; in $\\mathbf{Set}$, $\\mathrm{Sub}(B)\\cong\\mathcal{P}(B)$ as posets."
            solution_sketch: "A subobject of $B$ is an isomorphism class of monomorphisms into $B$, where $m\\sim m'$ iff $m\\le m'$ and $m'\\le m$; the preorder $\\le$ descends to a partial order $\\mathrm{Sub}(B)$ on the classes. In $\\mathbf{Set}$ a mono is an injection $m\\colon S\\to B$, and $m\\sim m'$ exactly when they have the same image, so each class is determined by the subset $m[S]\\subseteq B$. The order $\\le$ becomes inclusion, so $\\mathrm{Sub}(B)\\cong(\\mathcal{P}(B),\\subseteq)$."
    diagnostic_exemplar:
      problem: "In $\\mathbf{Set}$, suppose $v\\circ e=m\\circ u$ with $e\\colon A\\to X$ surjective and $m\\colon Y\\to B$ injective. Construct a diagonal $d\\colon X\\to Y$ with $d\\circ e=u$ and $m\\circ d=v$, and prove it is the only one."
      answer: "For $x\\in X$ pick $a\\in A$ with $e(a)=x$ (possible: $e$ is surjective) and set $d(x)=u(a)$. Well defined: if $e(a)=e(a')$ then $m(u(a))=v(e(a))=v(e(a'))=m(u(a'))$, and $m$ injective gives $u(a)=u(a')$. By construction $d\\circ e=u$, and $m(d(x))=m(u(a))=v(e(a))=v(x)$, so $m\\circ d=v$. Uniqueness: if $m\\circ d=v=m\\circ d'$ then injectivity of $m$ forces $d=d'$."
      solution_sketch: "Define $d$ by choosing a preimage under the surjection $e$; the real work is showing the choice does not matter, and that is where injectivity of $m$ is spent. Uniqueness of $d$ then follows from injectivity of $m$ again."
    anki_seeds:
      - front: "Every function factors as which two kinds of map, in which order?"
        back: "a surjection onto its image, followed by an injection into the codomain."
        type: basic
      - front: "Why is a diagonal fill-in $d$ (with $d\\circ e=u$, $m\\circ d=v$) unique when it exists?"
        back: "because $m$ is a monomorphism, so $m\\circ d=m\\circ d'$ forces $d=d'$."
        type: basic
      - front: "A subobject of $B$ is..."
        back: "an isomorphism class of monomorphisms into $B$; in $\\mathbf{Set}$ these are the subsets of $B$."
        type: basic

  - id: initial-terminal-objects
    name: Initial and Terminal Objects
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: category-definition
        weight: 0.5
        key: true
      - id: isomorphism-vs-equality
        weight: 0.4
        key: true
      - id: examples-of-categories
        weight: 0.2
    knowledge_points:
      - id: kp1
        name: Definitions and first examples
        key_prerequisites: [category-definition]
        constraints: "Definitions plus identification in $\\mathbf{Set}$ or in a poset category; uniqueness of the connecting arrow must be argued, not assumed; poset instances may lack the extremum."
        exemplars:
          - problem: "Which condition defines an initial object in a category? Select the correct description."
            answer: "unique arrow out to every object"
            answer_contract: {"kind": "label", "options": [["unique arrow out to every object"], ["unique arrow in from every object"], ["an arrow out to every object"], ["no arrow out to any object"]]}
            solution_sketch: "An initial object I has exactly one morphism from I to every object X. The option 'unique arrow in from every object' describes a terminal object instead. The option 'an arrow out to every object' forgets that the arrow must be unique. The option 'no arrow out to any object' fails because an initial object must have an arrow to every object. The answer is unique arrow out to every object."
          - problem: "In the poset category on the numbers 2, 3, and 6 ordered by divisibility, how many initial objects are there?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a poset category, a unique arrow x to y exists exactly when x <= y. An initial object would need x <= y for every y, so it must be a least element. In the divisibility poset on 2, 3, and 6, 2 does not divide 3 and 3 does not divide 2, and 6 does not divide 2 or 3. No least element exists. The answer is 0."
          - problem: "In the category Set, which object is initial? Select the correct description."
            answer: "empty set"
            answer_contract: {"kind": "label", "options": [["empty set"], ["one-element set"], ["two-element set"], ["every set"]]}
            solution_sketch: "An initial object I has exactly one morphism from I to every set X. The empty set has exactly one map to any set: the empty function. The option 'one-element set' fails because a one-element set has two maps to a two-element set. The option 'two-element set' fails because it has more than one map to a three-element set. The option 'every set' fails because not every set has a unique map to every other set. The answer is empty set."
          - problem: "In the discrete category with three objects, how many terminal objects are there?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A terminal object T needs exactly one arrow X to T for every object X. In the discrete category on three objects, the only arrows are identities. No arrow goes from one object to a different object. Thus no object can receive an arrow from the other two objects, so no terminal object exists. The answer is 0."
          - problem: "In the poset category on the numbers 1, 2, 4, and 8 ordered by divisibility, give the terminal object as a number."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In a poset category, a unique arrow x to y exists exactly when x <= y. A terminal object T must satisfy y <= T for every y, so T is a greatest element. Under divisibility on 1, 2, 4, and 8, every listed number divides 8, and the only arrow to 8 from each is unique. Thus 8 is the terminal object. The answer is 8."
          - problem: "In the category with objects A and B and one arrow from A to B besides the identity arrows, how many initial objects are there?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The objects are A and B, with identity arrows and one arrow from A to B. An initial object must have exactly one arrow to every object. A has the identity A to A and the given arrow A to B, so A is initial. B has no arrow to A, so B is not initial. Exactly one object is initial. The answer is 1."
          - problem: "Write the full proof: in Set the empty set is initial and any one-element set is terminal. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Recall that an object I is initial if for every object X there is exactly one morphism I to X. An object T is terminal if for every object X there is exactly one morphism X to T. Step 2: Show the empty set is initial. For any set X, the empty function from the empty set to X assigns no elements and so exists. Any two such functions have the same empty graph, so the function is unique. Step 3: Show a singleton is terminal. Let T = {t}. For any set X, the constant function f(x) = t is a map X to T. If g is any map X to T, then g(x) must be t because t is the only element of T, so g = f. Thus there is exactly one map. Step 4: Therefore the empty set is initial and every one-element set is terminal in Set."
      - id: kp2
        name: Uniqueness up to unique isomorphism
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "The two-object cross-map argument; every arrow used must be justified as the unique one supplied by initiality/terminality, and the dual statement obtained by reversing arrows."
        exemplars:
          - problem: "Let I and J be initial objects of a category. By initiality of I, how many morphisms are there from I to J?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (initiality of I): since I is initial, there is exactly one morphism from I to every object of the category. Step 2 (apply to J): J is an object, so the set of morphisms I to J has exactly one element. The answer is 1."
          - problem: "Let T and T' be terminal objects of a category. By terminality of T', how many morphisms are there from T to T'?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (terminality of T'): since T' is terminal, there is exactly one morphism from every object to T'. Step 2 (apply to T): T is an object, so the set of morphisms T to T' has exactly one element. The answer is 1."
          - problem: "Consider the category with objects I, J, K and non-identity morphisms u: I -> J, v: J -> I, f: I -> K, and g: J -> K, where v after u is 1_I, u after v is 1_J, g after u is f, and f after v is g. How many initial objects does this category have?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (check I): from I there is the identity I -> I, u: I -> J, and f: I -> K, and these are the only morphisms out of I, so I is initial. Step 2 (check J): from J there is the identity J -> J, v: J -> I, and g: J -> K, and these are the only morphisms out of J, so J is initial. Step 3 (check K): there is no morphism K -> I, so K is not initial. Step 4 (count): both I and J are initial, so the number is 2. The answer is 2."
          - problem: "Let I and J be initial objects, with unique u: I -> J and v: J -> I. The composite v after u is a morphism I -> I. Which morphism must it be?"
            answer: "1_I"
            answer_contract: {"kind": "label", "options": [["1_I"], ["1_J"], ["u"], ["v"]]}
            solution_sketch: "Step 1 (initiality of I): the only morphism I -> I is the identity 1_I. Step 2 (composite): v after u is a morphism I -> I, so it must equal 1_I. Step 3 (wrong options): 1_J is the identity on J, u goes I -> J, and v goes J -> I, so none can be a morphism I -> I equal to the composite. The answer is 1_I."
          - problem: "Let T and T' be terminal objects, with unique u: T -> T' and unique v: T' -> T. The composite u after v is a morphism T' -> T'. Which morphism must it be?"
            answer: "id on T'"
            answer_contract: {"kind": "label", "options": [["id on T'"], ["id on T"], ["the map u"], ["the map v"]]}
            solution_sketch: "Step 1 (terminality of T'): the only morphism T' -> T' is the identity, called id on T'. Step 2 (composite): u after v is a morphism T' -> T', so it must equal id on T'. Step 3 (wrong options): id on T is the identity on the wrong object T, and the map u and the map v are the individual cross-maps, neither of which is a morphism T' -> T'. The answer is id on T'."
          - problem: "In the discrete category with two objects A and B, the only morphisms are identities. How many initial objects does this category have?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (list morphisms): the discrete category has only the identities 1_A: A -> A and 1_B: B -> B. Step 2 (test A): there is no morphism A -> B, so A is not initial. Step 3 (test B): there is no morphism B -> A, so B is not initial. Step 4 (count): no object is initial, so the number is 0. The answer is 0."
          - problem: "Write the full proof: any two initial objects of a category are uniquely isomorphic. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): let I and J be initial objects of a category. Step 2 (cross-maps): by initiality of I there is a unique morphism u: I -> J, and by initiality of J there is a unique morphism v: J -> I. Step 3 (composite on I): the composite v after u: I -> I is a morphism from I to I; since I is initial, there is exactly one morphism I -> I, namely the identity 1_I, so v after u is 1_I. Step 4 (composite on J): similarly, u after v: J -> J is a morphism from J to J; since J is initial, there is exactly one morphism J -> J, namely 1_J, so u after v is 1_J. Step 5 (isomorphism): therefore u and v are mutually inverse, so u is an isomorphism I -> J. Step 6 (uniqueness): any isomorphism I -> J is a morphism I -> J, and by initiality of I there is only one such morphism, so u is the unique isomorphism from I to J. Thus any two initial objects are uniquely isomorphic."
      - id: kp3
        name: Zero objects
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "Zero objects in $\\mathbf{Grp}$ (or note the failure in $\\mathbf{Set}$); zero-morphism computations use only uniqueness of arrows into/out of $0$."
        exemplars:
          - problem: "In the category of groups, which object is both initial and terminal?"
            answer: "trivial group"
            answer_contract: {"kind": "label", "options": [["trivial group"], ["group of integers"], ["cyclic group of order 2"], ["free group on one generator"]]}
            solution_sketch: "A zero object is an object that is both initial and terminal. In Grp the trivial group is terminal: every group has exactly one homomorphism to it, the constant map. It is initial: from it to any group there is exactly one homomorphism, sending the identity to the identity. The option group of integers is the error of confusing a generator object with a zero object: there are many homomorphisms from the integers to a two-element group, so it is not initial. The option cyclic group of order 2 is not initial because there is no homomorphism from it to a group of order 3. The option free group on one generator is the group of integers, so it fails the same way. The correct object is trivial group."
          - problem: "In a category with zero object 0, let z: A to B be the composite A to 0 to B, and let g: B to C. Decide whether g composed with z is always the zero morphism A to C. Give the verdict and the number of arrows from 0 to C that uniqueness forces."
            answer: "verdict = holds; count = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Step 1: Recall the definition. The zero morphism z: A to B is the composite A to 0 to B. Step 2: Use terminality. Since 0 is terminal, there is exactly one arrow A to 0. Step 3: Use initiality. Since 0 is initial, there is exactly one arrow 0 to C. Step 4: Compose. The arrow g composed with the arrow 0 to B is an arrow 0 to C, so uniqueness forces it to equal the unique arrow 0 to C. Therefore g composed with z equals the zero morphism A to C. So verdict = holds; count = 1."
          - problem: "In the category of sets, how many zero objects are there?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In Set the empty set is initial: there is exactly one function from it to any set. A singleton is terminal: there is exactly one function from any set to it. No set is both initial and terminal, since the empty set has no element and a singleton has one. Therefore the number of zero objects in Set is 0."
          - problem: "In a category with a zero object 0, how many morphisms are there from 0 to 0?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let 0 be a zero object. Since 0 is initial, there is exactly one morphism from 0 to any object, so there is exactly one morphism from 0 to 0. The identity arrow 0 to 0 is one such morphism. Hence the number is exactly 1."
          - problem: "In the category of sets, which statement about zero objects is correct?"
            answer: "no zero object"
            answer_contract: {"kind": "label", "options": [["no zero object"], ["empty set is zero"], ["singleton is zero"], ["every set is zero"]]}
            solution_sketch: "Step 1: Recall the definition. A zero object is an object that is both initial and terminal at once. Step 2: Examine the option empty set is zero. The empty set is initial, but it is not terminal because there is no function from a nonempty set to it, so this option fails. Step 3: Examine the option singleton is zero. A singleton is terminal, but it is not initial because there is no function from a singleton to the empty set, so this option fails. Step 4: Examine the option every set is zero. A two-element set is neither initial nor terminal, so this option fails. Step 5: Conclude that Set has no zero object. The answer is no zero object."
          - problem: "Let C be the category with objects 0 and A and morphisms: the two identities, one arrow u from 0 to A, one arrow v from A to 0, and the composite e from A to A obtained by following v and then u. Composition satisfies: v followed by u is the identity on 0, and e followed by e is e. How many morphisms are in C?"
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The category has objects 0 and A. The identity arrows give id0 and idA. The arrow u goes from 0 to A and v goes from A to 0. The composite e from A to A obtained by following v then u is a fifth morphism. The equation v followed by u equals id0 makes 0 both initial and terminal, so 0 is a zero object. Counting id0, idA, u, v, and e gives 5."
          - problem: "Write the full proof: In the category of groups, the trivial group is a zero object. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Define the candidate. Let 1 denote the trivial group containing only the identity e. Step 2: Show terminal. For any group G, a homomorphism f: G to 1 must send every element to e, since 1 has only e; this constant map is a homomorphism, so there is exactly one homomorphism G to 1. Thus 1 is terminal. Step 3: Show initial. For any group G, a homomorphism h: 1 to G is determined by the image of e; the identity of G is the only choice that preserves the identity, so h(e) equals the identity of G is the unique homomorphism 1 to G. Thus 1 is initial. Step 4: Conclude. Since 1 is both initial and terminal, it is a zero object in Grp. Step 5: Contrast with Set. The empty set is initial and singletons are terminal, but no set is both, so Set has no zero object. Therefore the trivial group is a zero object in Grp."
    diagnostic_exemplar:
      problem: "Prove that any two terminal objects of a category are isomorphic by a unique isomorphism."
      answer: "Let $1,1'$ be terminal. Terminality of $1'$ gives a unique $u\\colon 1\\to 1'$, and terminality of $1$ a unique $v\\colon 1'\\to 1$. Both $v\\circ u$ and $1_1$ are arrows $1\\to 1$, and terminality of $1$ says there is only one, so $v\\circ u=1_1$; symmetrically $u\\circ v=1_{1'}$. Hence $u$ is an isomorphism, and it is the unique morphism $1\\to 1'$ at all, so the isomorphism is unique."
      solution_sketch: "Terminality gives an arrow each way; then note that each round trip is an arrow from a terminal object to itself, competing with the identity, and terminality says there is only one such arrow. Uniqueness of the isomorphism is free, since the hom-set between the two terminal objects is already a singleton."
    anki_seeds:
      - front: "Define an initial object of a category."
        back: "an object with exactly one morphism to every object."
        type: basic
      - front: "Define a terminal object of a category."
        back: "an object with exactly one morphism from every object."
        type: basic
      - front: "Initial/terminal objects are unique up to..."
        back: "a unique isomorphism."
        type: basic
      - front: "In $\\mathbf{Set}$ the initial object is {{c1::$\\varnothing$}} and a terminal object is {{c2::any singleton}}."
        back: "$\\varnothing$; any singleton"
        type: cloze

  - id: duality-opposite-categories
    name: Duality and Opposite Categories
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: category-definition
        weight: 0.5
        key: true
      - id: mono-epi-iso
        weight: 0.3
      - id: initial-terminal-objects
        weight: 0.2
      - id: propositional-logic
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: The opposite category
        key_prerequisites: [category-definition]
        constraints: "Define $\\mathcal{C}^{op}$ precisely (hom-sets, reversed composition, identities) and verify the axioms; concrete readings only in $\\mathbf{Set}$."
        exemplars:
          - problem: "A proof that composition in Set^op is well defined fixes arrows f from A to B and g from B to C in Set^op and computes the composite g ∘^op f as a function from C to A, using (g ∘^op f)(x) = f(g(x)). Take A = {1, 2}, B = {3, 4} and C = {5, 6, 7}; f is the function from B to A with f(3) = 1 and f(4) = 2, and g is the function from C to B with g(5) = 3, g(6) = 4 and g(7) = 3. Find the value that this step produces at x = 6."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (reversed composition): by the definition of the opposite category, g ∘^op f is the Set function f ∘ g, so the value at x = 6 is f(g(6)). Step 2 (evaluate the functions): g(6) = 4 and f(4) = 2, so (g ∘^op f)(6) = 2. The answer is 2."
          - problem: "A step of the proof that Set^op has hom-sets verifies that a morphism from A to B in Set^op is exactly a function from B to A in Set. Let A = {1, 2, 3, 4} and B = {5, 6}; the size of Hom_{Set^op}(A, B) is the number of functions from B to A. Compute the number of morphisms from A to B in Set^op that this step counts."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (hom-sets reverse): by the definition of the opposite category, a morphism from A to B in Set^op is a function from B to A in Set. Step 2 (count the functions): B has 2 elements and A has 4 elements, so there are 2^4 = 16 functions from B to A. The answer is 16."
          - problem: "The one-object category C has as its morphisms all functions from {1, 2, 3} to itself with the usual composition, and in C^op composition is reversed, so f ∘^op f = f ∘ f. Let f be the function with f(1) = 2, f(2) = 3 and f(3) = 1; as part of checking that the identity of C is the identity of C^op, one examines the powers of f. Determine the order of f in C^op, that is, the smallest n with f composed with itself n times equal to the identity function."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (reversed composition): in C^op we have f ∘^op f = f ∘ f, so the powers of f in C^op are the usual powers of the function f. Step 2 (compute the powers): f sends 1 to 2, 2 to 3 and 3 to 1; f ∘ f sends 1 to 3, and f ∘ f ∘ f fixes every element, so no smaller positive power is the identity. The order of f in C^op is 3."
          - problem: "A step of the proof that the identities of C survive in C^op checks the unit law f ∘^op 1_A = f for each arrow f. Work in Set^op with A = {1, 2} and B = {3, 4, 5}; the arrow f from A to B in Set^op is the function f from B to A with f(3) = 1, f(4) = 2 and f(5) = 1, and 1_A is the function from A to itself fixing both elements. Evaluate (f ∘^op 1_A)(5)."
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (definition of composition in C^op): f ∘^op 1_A is the Set composite 1_A ∘ f. Step 2 (evaluate): f(5) = 1 and 1_A fixes 1, so (f ∘^op 1_A)(5) = 1, which equals f(5), as the unit law requires. The answer is 1."
          - problem: "Consider this verification that (C^op)^op = C. Step 1: (C^op)^op has the same objects as C^op, and these are the objects of C. Step 2: a morphism from A to B in (C^op)^op is a morphism from A to B in C^op, and hence a morphism from B to A in C. Step 3: composition in (C^op)^op sends composable h after g to the composite h ∘ g of C. Step 4: the hom-sets and the composition agree with those of C, so (C^op)^op = C. Which step is the first that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: taking an opposite never changes the objects. Step 2 is the first invalid step: a morphism from A to B in X^op is a morphism from B to A in X, so with X = C^op it is a morphism from B to A in C^op, that is, a morphism from A to B in C; the step wrongly keeps the direction of C^op instead of reversing it a second time. Step 3 is a true statement, since composition in a double opposite coincides with the composition of C. Step 4 is the correct conclusion once Step 2 is repaired. The answer is Step 2."
          - problem: "In Set^op take an arrow f from A to B and an arrow g from B to C; in Set these are functions f from B to A and g from C to B, so the composite g ∘^op f is a function from C to A. The proof that this composition is well defined is missing its final line, which must give the value of the composite at an element x of C. Select the line that is true and completes the step."
            answer: "f(g(x))"
            answer_contract: {"kind": "label", "options": [["f(g(x))"], ["g(f(x))"], ["f(f(x))"], ["g(g(x))"]]}
            solution_sketch: "Step 1 (definition of composition in the opposite category): g ∘^op f is the Set function f ∘ g, so at an element x of C the value is f(g(x)). The option g(f(x)) applies the two functions in the unreversed order of C. The option f(f(x)) composes f with itself instead of following g by f. The option g(g(x)) composes g with itself. The answer is f(g(x))."
          - problem: "Write the full proof: for every category C, the opposite category C^op, with the same objects, hom-sets Hom_{C^op}(A, B) = Hom_C(B, A) and composition g ∘^op f = f ∘ g, is a category, and (C^op)^op = C. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects and hom-sets): C^op has the same objects as C, and for objects A and B we set Hom_{C^op}(A, B) = Hom_C(B, A), so an arrow from A to B in C^op is an arrow from B to A in C. Step 2 (identities): the identity 1_A of C is an arrow from A to A in C, hence an arrow from A to A in C^op. Step 3 (composition): for f from A to B and g from B to C in C^op, the arrows f from B to A and g from C to B in C are composable, and we set g ∘^op f = f ∘ g, an arrow from C to A in C, hence an arrow from A to C in C^op. Step 4 (unit laws): f ∘^op 1_A = 1_A ∘ f = f and 1_B ∘^op f = f ∘ 1_B = f, by the two unit laws of C. Step 5 (associativity): (h ∘^op g) ∘^op f = f ∘ (g ∘ h) = (f ∘ g) ∘ h, which equals h ∘^op (g ∘^op f), so composition in C^op is associative by associativity in C. Step 6 (involution): reversing the arrows twice returns the original hom-sets and the original composition, so (C^op)^op = C. Every axiom is verified, so C^op is a category."
      - id: kp2
        name: The duality principle
        key_prerequisites: [category-definition]
        constraints: "Produce the dual of a given notion by systematically reversing arrows and justify the translation; dual pairs limited to mono/epi, initial/terminal, product/coproduct, section/retraction."
        exemplars:
          - problem: "In any category, a monomorphism is a morphism f such that f g = f h implies g = h for all composites where these make sense. Reverse every arrow and every side in this definition. Which notion is dual to a monomorphism?"
            answer: "epimorphism"
            answer_contract: {"kind": "label", "options": [["epimorphism"], ["isomorphism"], ["section"], ["retraction"]]}
            solution_sketch: "Step 1 (definition): a monomorphism is left-cancellable, since f g = f h forces g = h. Step 2 (reversal): reversing every arrow turns f g = f h into g f = h f, so the dual property is right-cancellation. Step 3 (identification): a right-cancellable morphism is an epimorphism. The answer is epimorphism. Wrong options: isomorphism wrongly adds a two-sided inverse, which the cancellation definition never asserts; section wrongly reads the dual as a split condition with a left inverse, which is strictly stronger than cancellation; retraction wrongly uses a right inverse, also a stronger split condition and not the arrow-reversed cancellation property."
          - problem: "Duality reverses every arrow in a definition. An initial object has exactly one morphism from itself to each object. Which notion is the dual of an initial object?"
            answer: "terminal object"
            answer_contract: {"kind": "label", "options": [["terminal object"], ["product"], ["coproduct"], ["zero object"]]}
            solution_sketch: "Step 1 (definition): an initial object I has exactly one morphism I -> X for every object X. Step 2 (reversal): reversing all arrows gives exactly one morphism X -> I for every object X. Step 3 (identification): an object that receives a unique morphism from every object is a terminal object. The answer is terminal object. Wrong options: product wrongly dualizes a limit notion of a diagram instead of reversing the single arrow 'unique arrow out'; coproduct is the dual of product, not the dual of initial; zero object is both initial and terminal, so its own dual is again a zero object, and it does not name the dual of initial alone."
          - problem: "Let C be the category given by the poset 1 < 2 < 3 < 4, so there is exactly one morphism a -> b whenever a <= b. In the opposite category C^op, how many morphisms have source 3?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (reversal): a morphism with source 3 in C^op is exactly a morphism with target 3 in C, since C^op shares the objects of C and reverses each arrow. Step 2 (count): in the poset C, the morphisms with target 3 are the unique arrows 1 -> 3, 2 -> 3, and 3 -> 3. Step 3 (total): there are three such morphisms. The answer is 3."
          - problem: "A category C has objects A, B, C and exactly these non-identity morphisms: f: A -> B, g: B -> C, and their composite g f: A -> C, plus all identities. In the opposite category C^op, how many morphisms have source B?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (reversal): a morphism with source B in C^op is a morphism with target B in C, because opposite categories keep the same objects and reverse every arrow. Step 2 (count): the morphisms of C with target B are id_B and f: A -> B. Step 3 (total): the count is two. The answer is 2."
          - problem: "In the category given by the poset 1 < 2 < 3, reversing all arrows turns the product of two elements into their coproduct. Compute the coproduct of the elements 2 and 3 in this poset, that is, their least upper bound."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (duality): the dual of the product, a cone with a unique map in, is the coproduct, a cocone with a unique map out; in a poset a product is a greatest lower bound and its dual is a least upper bound. Step 2 (bound): the least upper bound of 2 and 3 in the chain 1 < 2 < 3 is 3, since 2 <= 3. Step 3 (value): the coproduct of 2 and 3 is 3. The answer is 3."
          - problem: "A morphism f: A -> B has a morphism g: B -> A with g f = id_A. Reverse every arrow and every side of this equation, working in the opposite category. What is f^op called?"
            answer: "retraction"
            answer_contract: {"kind": "label", "options": [["retraction"], ["isomorphism"], ["epimorphism"], ["monomorphism"]]}
            solution_sketch: "Step 1 (reversal): reverse each arrow to get f^op: B -> A and g^op: A -> B, and the equation g f = id_A in C becomes f^op g^op = id_A in C^op. Step 2 (identification): f^op has the right inverse g^op, and a morphism with a right inverse is a retraction. The answer is retraction. Wrong options: isomorphism wrongly demands that the opposite composite g^op f^op also be an identity, which the single equation does not give; epimorphism wrongly replaces the inverse equation by right-cancellation, a weaker property; monomorphism is the dual of an epimorphism and does not describe a morphism with a right inverse."
          - problem: "Write the full proof: the duality principle, namely that if a statement holds in every category, then its arrow-reversed dual statement also holds in every category. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): let S be a statement about categories, arrows, and composites that holds in every category. Step 2 (dual statement): define S^op to be the statement obtained from S by reversing the source and target of every arrow and the order in every composite, while keeping the object and morphism quantifiers. Step 3 (opposite is a category): for any category C, the opposite category C^op has the same objects, an arrow f^op: Y -> X for each arrow f: X -> Y of C, and composition defined by f^op g^op = (g f)^op; associativity and the identities of C make C^op a category. Step 4 (apply S to C^op): since S holds in every category, S holds in C^op. Step 5 (translate back): reading the arrows of C^op as reversed arrows of C, the statement S holds in C^op exactly when the arrow-reversed statement S^op holds in C; this translation is bijective on statements, since (f^op)^op = f. Step 6 (conclusion): therefore S^op holds in every category C, which proves the duality principle. As a sample use: the dual of the definition of a monomorphism, left-cancellation, is right-cancellation, so 'epi' is dual to 'mono', and every theorem about monos yields a mirror theorem about epis."
      - id: kp3
        name: Using duality to halve the work
        key_prerequisites: [initial-terminal-objects]
        constraints: "The proof must consist of applying a known theorem in $\\mathcal{C}^{op}$ and translating back — no fresh diagram chase or cancellation argument allowed."
        exemplars:
          - problem: "You proved initial objects are unique up to unique iso. Explain, using duality, why no separate proof is needed for terminal objects."
            answer: "Terminal in $\\mathcal{C}$ = initial in $\\mathcal{C}^{op}$, so the theorem transfers."
            solution_sketch: "A terminal object of $\\mathcal{C}$ is precisely an initial object of $\\mathcal{C}^{op}$. The statement 'initial objects are unique up to unique isomorphism' holds in every category, in particular in $\\mathcal{C}^{op}$; translating back, terminal objects of $\\mathcal{C}$ are unique up to unique isomorphism. Duality gives the theorem for free."
          - problem: "Earlier you proved that a composite of two monomorphisms is a monomorphism. Use duality to obtain the corresponding fact for epimorphisms with no new computation."
            answer: "Applying the mono result in $\\mathcal{C}^{op}$ gives: a composite of two epimorphisms is an epimorphism."
            solution_sketch: "Epimorphisms in $\\mathcal{C}$ are exactly monomorphisms in $\\mathcal{C}^{op}$, and a composite $g\\circ f$ in $\\mathcal{C}$ is the composite $f\\circ^{op} g$ in $\\mathcal{C}^{op}$. The theorem 'a composite of two monos is a mono' holds in every category, in particular $\\mathcal{C}^{op}$; read back in $\\mathcal{C}$ it says a composite of two epis is an epi. No fresh cancellation argument is needed."
    diagnostic_exemplar:
      problem: "You know that a composite of two monomorphisms is a monomorphism. Using duality — not a fresh cancellation argument — prove that a composite of two epimorphisms is an epimorphism."
      answer: "A morphism is epi in $\\mathcal C$ iff it is mono in $\\mathcal C^{op}$ (reversing arrows turns right-cancellation into left-cancellation), and the composite $g\\circ f$ in $\\mathcal C$ is the composite $f\\circ^{op}g$ in $\\mathcal C^{op}$. Let $f,g$ be epis in $\\mathcal C$; they are monos in $\\mathcal C^{op}$, and the mono theorem, valid in every category, applies to $\\mathcal C^{op}$: their composite is mono there. Translating back, $g\\circ f$ is epi in $\\mathcal C$."
      solution_sketch: "Do not re-run the cancellation argument. Translate instead: epi in $\\mathcal C$ is mono in $\\mathcal C^{op}$ and composition order reverses, so apply the mono theorem inside $\\mathcal C^{op}$, where it holds because it holds in every category, and translate the conclusion back."
    anki_seeds:
      - front: "The opposite category $\\mathcal{C}^{op}$ has..."
        back: "the same objects, morphisms $A\\to B$ = $\\mathcal{C}$-morphisms $B\\to A$, and reversed composition."
        type: basic
      - front: "By duality: the dual of a monomorphism is an {{c1::epimorphism}}, of an initial object a {{c2::terminal object}}, of a product a {{c3::coproduct}}."
        back: "epimorphism; terminal object; coproduct"
        type: cloze

  - id: slice-categories
    name: Slice and Coslice Categories
    core: true  # ancestor of core universal-properties (PEDAGOGY §1 invariant)
    difficulty: 0.7
    drill: false
    answer_kind: proof
    expected_time_secs: 210
    prerequisites:
      - id: category-definition
        weight: 0.5
        key: true
      - id: commutative-diagrams
        weight: 0.3
      - id: initial-terminal-objects
        weight: 0.3
      - id: duality-opposite-categories
        weight: 0.0
    knowledge_points:
      - id: kp1
        name: Objects and morphisms of a slice
        key_prerequisites: [commutative-diagrams]
        constraints: "Define $\\mathcal{C}/C$ and verify closure of composition via pasted commuting triangles; concrete slices only in $\\mathbf{Set}$ over a set of at most 2 elements."
        exemplars:
          - problem: "In the slice C/C, let f:X->C, g:Y->C and p:Z->C be objects. Let h:f->g and k:g->p be morphisms. Which equation must the composite k h satisfy to be a morphism from f to p?"
            answer: "p k h = f"
            answer_contract: {"kind": "label", "options": [["p k h = f"], ["f k h = p"], ["p h k = f"], ["g k h = f"]]}
            solution_sketch: "A morphism h:f->g satisfies g h = f, and k:g->p satisfies p k = g. The composite k h goes from X to Z, so it is a morphism f->p exactly when p (k h) = f. By associativity, p (k h) = (p k) h = g h = f. The option f k h = p swaps the source and target. The option p h k = f composes in the wrong order. The option g k h = f uses g where p is needed. The answer is p k h = f."
          - problem: "In Set/{0,1}, let f:X->{0,1} with X={a,b,c}, f(a)=0, f(b)=0 and f(c)=1. Let g:Y->{0,1} with Y={u,v,w}, g(u)=0, g(v)=1 and g(w)=1. How many morphisms from f to g are there in Set/{0,1}?"
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An object is a function to {0,1}, and a morphism h from f to g must satisfy g h = f. Thus h sends the fiber f^{-1}(0)={a,b} into g^{-1}(0)={u}, so h(a)=h(b)=u. It sends f^{-1}(1)={c} into g^{-1}(1)={v,w}, so h(c) is v or w. There are 2 choices. The answer is 2."
          - problem: "In Set/{0,1}, let f:X->{0,1} with X={a,b}, f(a)=0 and f(b)=0. How many morphisms from f to f are there in Set/{0,1}?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A morphism h from f to f must satisfy f h = f, so it preserves each fiber. The fiber f^{-1}(0) is all of X={a,b}, so h(a) and h(b) may each be a or b. That gives 2 times 2 = 4 functions. Every such function is a morphism over {0,1}. The answer is 4."
          - problem: "In Set/{0,1}, let X={a,b,c}. How many objects f:X->{0,1} are there for which both fibers f^{-1}(0) and f^{-1}(1) are nonempty?"
            answer: "6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "An object is a function f from X to {0,1}. There are 2 choices for each of the 3 elements, so 2^3 = 8 functions in all. The two constant functions, all 0 and all 1, have an empty fiber, so they are excluded. That leaves 8 - 2 = 6 functions. The answer is 6."
          - problem: "Claim: if h is a morphism f->g in C/C and k is a morphism g->p, then k h is a morphism f->p. Step 1: h satisfies g h = f and k satisfies p k = g. Step 2: the composite k h is an arrow Z->X. Step 3: p (k h) = (p k) h = g h = f. Step 4: hence k h is a morphism f->p. Which step is the first step that is not valid?"
            answer: "Step 2"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is correct: these are the two commuting triangles that define h and k. Step 2 is false: h goes X->Y and k goes Y->Z, so the composite k h goes X->Z, not Z->X. Step 3 is correct: associativity gives p (k h) = (p k) h = g h = f. Step 4 correctly concludes from the corrected Step 2 and Step 3. The answer is Step 2."
          - problem: "In Set/{0,1}, let f:X->{0,1} with X={a,b,c}, f(a)=0, f(b)=0 and f(c)=1. Let g:Y->{0,1} with Y={u,v,w}, g(u)=0, g(v)=0 and g(w)=1. How many morphisms from f to g are there?"
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "A morphism h from f to g must satisfy g h = f, so it maps each fiber of f into the matching fiber of g. The fiber f^{-1}(0)={a,b} maps into g^{-1}(0)={u,v}, giving 2 choices for h(a) and 2 choices for h(b). The fiber f^{-1}(1)={c} maps into g^{-1}(1)={w}, giving 1 choice for h(c). Multiply: 2 times 2 times 1 = 4. The answer is 4."
          - problem: "Write the full proof: fix an object C of C. Define the slice category C/C and verify that composition is well defined. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: an object of C/C is a morphism f:X->C. Step 2: a morphism from f:X->C to g:Y->C is an arrow h:X->Y with g h = f, so the triangle over C commutes. Step 3: for composable morphisms h:f->g and k:g->p, we have g h = f and p k = g. Associativity gives p (k h) = (p k) h = g h = f, so k h is an arrow X->Z with the required triangle. Thus the composite k h is a morphism f->p. Step 4: the identity 1_X satisfies f 1_X = f, so it is the identity on f. Composition is associative and unital because it is inherited from C. Therefore C/C is a category and composition is well defined."
      - id: kp2
        name: Terminal objects in slices; coslices by duality
        key_prerequisites: [initial-terminal-objects]
        constraints: "Identify the terminal object of a slice (or, dually, the initial object of a coslice); the forcing argument '$h=f$ is the only candidate' must be given explicitly."
        exemplars:
          - problem: "In the slice category over a set C = {1,2,3,4}, the terminal object is the identity 1_C. Let f: {1,2} -> C satisfy f(1)=1 and f(2)=3. For the unique morphism h from f to 1_C, find h(2)."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The slice object is f: {1,2} -> C with f(1)=1 and f(2)=3. A morphism to the terminal object 1_C: C -> C is a function h: {1,2} -> C with 1_C after h = f. The identity law forces h = f, so h(2) = f(2) = 3. The answer is 3."
          - problem: "In the coslice category under a set C = {1,2,3}, the initial object is 1_C. Let g: C -> {1,2,3,4} satisfy g(1)=4, g(2)=2, g(3)=1. For the unique morphism k from 1_C to g, find k(1)."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The coslice object is g: C -> {1,2,3,4} with g(1)=4, g(2)=2, g(3)=1. By duality, the initial object is 1_C: C -> C. A morphism from 1_C to g is k: C -> {1,2,3,4} with k after 1_C = g. The identity law forces k = g, so k(1) = g(1) = 4. The answer is 4."
          - problem: "In any slice category C/C, for a fixed object f: X -> C, how many morphisms are there from f to the terminal object 1_C?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The slice object is f: X -> C. A morphism from f to the terminal object 1_C: C -> C is h: X -> C with 1_C after h = f. The identity law forces h = f, so exactly one candidate exists and it is a morphism. The answer is 1."
          - problem: "Claim: in a slice category C/C, the identity 1_C is the initial object. Step 1: an object of C/C is an arrow f: X -> C. Step 2: a morphism from f to 1_C is h: X -> C with 1_C after h = f. Step 3: this equation forces h = f, so 1_C is terminal. Step 4: therefore 1_C is initial. Which step is the first step that is not valid?"
