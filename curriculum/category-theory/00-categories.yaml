        exemplars:
          - problem: "Construct the category generated by a divisibility diagram. Objects are [1, 2, 3, 6]; initially specified arrows are [(1, 2), (2, 6), (1, 3), (3, 6)]. Add only what identities and composition force, keeping at most one arrow between each ordered pair. For the ordered pairs [(1, 6), (2, 3), (6, 6)], give 1 if the completed thin category has that arrow and 0 otherwise."
