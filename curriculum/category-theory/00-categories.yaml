          - problem: "Construct a diagonal in this Set square: e:A->X has values [1, 0, 2]; u:A->Y has values [0, 2, 1]; m:Y->Z has values [4, 6, 8]; v:X->Z has values [8, 4, 6]. All domains are zero-based sets of the displayed sizes. Find d:X->Y making both triangles commute, and verify its uniqueness by epi/mono cancellation. Give its complete value list."
            answer: "2, 0, 1"
