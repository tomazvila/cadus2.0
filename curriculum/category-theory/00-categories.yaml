      - id: kp1
        name: The image factorization in Set
        key_prerequisites: [mono-epi-iso]
        constraints: "Require the image factorization in set. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "The map f has values [3, 3, 5, 1] on inputs 0,...,3. Construct a factorization f=m e in Set with e epic and m monic. Use a middle set I={0,...,k-1} and require m to be strictly increasing to fix its labels. Neither k nor I is supplied. Return all values of e followed by all values of m."
            answer: "1, 1, 2, 0, 1, 3, 5"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The intermediate labels identify fibers of f. Surjectivity of e and injectivity of m give the two factorization properties. The resulting answer is 1, 1, 2, 0, 1, 3, 5."
          - problem: "Let f: {1,2,3,4} -> {1,2,3} be given by f(1)=2, f(2)=2, f(3)=1, f(4)=1. In the image factorization A -> I -> B, give the middle set I as an increasing list of its elements."
            answer: "1, 2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "The image f[A] is obtained by evaluating f on A. The values are f(1)=2, f(2)=2, f(3)=1, f(4)=1, so the distinct values are 1 and 2. In the image factorization A -> I -> B the middle set is I = f[A]. The middle set I as an increasing list is 1, 2."
          - problem: "Find the smallest possible intermediate cardinality in an epi-mono factorization of this map, then construct both arrows. The map f has values [2, 2, 3, 2, 3] on inputs 0,...,4. Construct a factorization f=m e in Set with e epic and m monic. Use a middle set I={0,...,k-1} and require m to be strictly increasing to fix its labels. Neither k nor I is supplied. Return all values of e followed by all values of m."
            answer: "0, 0, 1, 0, 1, 2, 3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The intermediate labels identify fibers of f. Surjectivity of e and injectivity of m give the two factorization properties. The resulting answer is 0, 0, 1, 0, 1, 2, 3."
          - problem: "Recover the quotient by equal-output fibers as a factorization through a monomorphism. The map f has values [4, 1, 4, 2, 4] on inputs 0,...,4. Construct a factorization f=m e in Set with e epic and m monic. Use a middle set I={0,...,k-1} and require m to be strictly increasing to fix its labels. Neither k nor I is supplied. Return all values of e followed by all values of m."
            answer: "2, 0, 2, 1, 2, 1, 2, 4"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The intermediate labels identify fibers of f. Surjectivity of e and injectivity of m give the two factorization properties. The resulting answer is 2, 0, 2, 1, 2, 1, 2, 4."
          - problem: "A proposed image factorization uses the whole codomain as its middle object, although some elements are not hit. Repair it to make the first arrow epic while keeping the second monic. The map f has values [1, 2, 4, 4, 5] on inputs 0,...,4. Construct a factorization f=m e in Set with e epic and m monic. Use a middle set I={0,...,k-1} and require m to be strictly increasing to fix its labels. Neither k nor I is supplied. Return all values of e followed by all values of m."
            answer: "0, 1, 2, 2, 3, 1, 2, 4, 5"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The intermediate labels identify fibers of f. Surjectivity of e and injectivity of m give the two factorization properties. The resulting answer is 0, 1, 2, 2, 3, 1, 2, 4, 5."
          - problem: "Let f:{0,1,2,3}->{0,...,7} have values [5,2,5,7]. Construct its image factorization f=m e in Set, with e epic and m monic. Label the middle set {0,...,k-1} and require m to be strictly increasing. Give k, then the four values of e, then all values of m. Establish both categorical properties from your construction."
            answer: "3, 1, 0, 1, 2, 2, 5, 7"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The image consists of the values reached by f and supplies the middle object. Relabelling these increasingly makes e surjective and m injective, and their composite recovers every value of f. The resulting answer is 3, 1, 0, 1, 2, 2, 5, 7."
          - problem: "Write the full proof: For every function f: A -> B in Set, the image factorization f = m o e with e: A -> f[A] surjective and m: f[A] -> B the inclusion injective exists and is unique up to a unique isomorphism. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Existence: Let I = f[A] = {f(a) : a in A}. Define e: A -> I by e(a) = f(a). Then e is surjective by definition of I, and the inclusion m: I -> B with m(i)=i is injective. For every a, m(e(a)) = m(f(a)) = f(a), so f = m o e. Uniqueness: Suppose f = m' o e' with e': A -> I' surjective and m': I' -> B injective. Then m'[I'] = m'[e'[A]] = f[A] = I. Since m' is injective, it restricts to a bijection phi: I' -> I with m o phi = m'. Also m o phi o e' = m' o e' = f = m o e, and m is injective, so phi o e' = e. If psi: I' -> I also satisfies m o psi = m', then m o psi = m o phi; since m is injective, psi = phi. Thus the comparison isomorphism is unique."
      - id: kp2
        name: The diagonal fill-in
        key_prerequisites: [diagram-chasing]
