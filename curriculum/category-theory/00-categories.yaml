          - problem: "Audit these proposed arguments independently. Argument A: In a category, A, B, C are distinct objects and f:A->B. A proposed use of identities is: Step 1: 1_A, 1_B, 1_C are identity arrows on their indicated objects. Step 2: 1_B after f is defined and equals f. Step 3: f after 1_A is defined and equals f. Argument B: In a category, A, B, C are distinct objects and f:A->B. A proposed use of identities is: Step 1: 1_A, 1_B, 1_C are identity arrows on their indicated objects. Step 2: 1_B after f is defined and equals f. Step 3: f after 1_B is defined and equals f. Argument C: In a category, A, B, C are distinct objects and f:A->B. A proposed use of identities is: Step 1: 1_A, 1_B, 1_C are identity arrows on their indicated objects. Step 2: 1_B after f is defined and equals f. Step 3: f after 1_C is defined and equals f. For each argument, check whether its numbered assertions follow from the stated data and previous justified assertions, supplying any needed algebra or logical deductions. Give an ordered list of the first assertion that does not follow in each argument; use 0 if all its assertions follow."
