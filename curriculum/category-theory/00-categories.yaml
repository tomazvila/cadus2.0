          - problem: "A triangle gives mn=l and an adjacent square gives rl=qk, with n:A->B,m:B->C,l:A->C,r:C->E,k:A->D,q:D->E. Paste them to prove rmn=qk. Starting with rmn, give the word after the triangle substitution and then the word after the square substitution. Encode n=1,m=2,l=3,r=4,k=5,q=6, using conventional composition order."
            answer: "4, 3, 6, 5"
