            solution_sketch: "Identity arrows impose reflexivity and composites impose transitive closure; uniqueness of parallel arrows supplies associativity. The resulting answer is 1, 0, 0, 1."
          - problem: "In the category associated to the divisibility order on {1,2,3,6}, encode an arrow x->y by the pair (x,y). Construct the identity of 3 and the composite (1,2) followed by (2,6). Give the four endpoints in that order."
            answer: "3, 3, 1, 6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Identities correspond to reflexivity; the composite is the arrow forced by transitivity with the original endpoints. The resulting answer is 3, 3, 1, 6."
          - problem: "A one-object category has arrows the self-functions of {0,1}. Let a=[1,0] and b=[0,0]. Recover the monoid multiplication from categorical composition. Give the complete value lists of a after b and b after a, in that order."
            answer: "1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The one-object dictionary identifies multiplication with ordered composition; the two products differ. The resulting answer is 1, 1, 0, 0."
          - problem: "A student proposes a thin category on 0,1,2 with arrows (0,0),(1,1),(2,2),(0,1),(1,2). Construct the missing composite and give its source,target. Use the category axiom responsible for requiring that arrow."
            answer: "0, 2"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The two specified nonidentity arrows are composable; totality requires their composite from 0 to 2. The resulting answer is 0, 2."
          - problem: "Write the full proof: the category associated to a poset, with one morphism from x to y exactly when x <= y, satisfies the axioms of a category. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (objects and morphisms): the objects are the elements of the poset P; for each pair x, y with x <= y there is exactly one morphism from x to y, and there is no morphism from x to y when x <= y fails. Step 2 (identities): reflexivity of a partial order gives x <= x for every x, so each object x has a morphism from x to x, and since each hom-set has at most one element this is the unique identity morphism on x. Step 3 (composition): if x <= y and y <= z, transitivity gives x <= z, so there is exactly one morphism from x to z; define the composite of the morphisms x -> y and y -> z to be that unique morphism. Step 4 (unit laws): for a morphism from x to y, both the composite after the identity of y and the composite before the identity of x are morphisms from x to y, and the hom-set has only one element, so both composites equal the original morphism. Step 5 (associativity): for three composable morphisms x -> y, y -> z, z -> w, both possible composites are morphisms from x to w, and since there is exactly one such morphism they are equal. Conclusion: identity, composition, unit laws and associativity all hold, so every poset yields a category, which is exactly the construction used in the divisibility and subset examples."
      - id: kp2
        name: Isomorphisms in these categories
        key_prerequisites: [category-definition]
        constraints: "Require isomorphisms in these categories. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Compare two categories built from the same ordered set P={0,1,2}: C is the poset category for0<1<2; D is the one-object category of the monoid(P,max), whose unit is0. For each, determine which named data are isomorphisms: in C the arrows0->0,0->1,2->2; in D the morphisms0,1,2. Give the six truth values in that order. The distinction between objects and monoid elements is essential."
            answer: "1, 0, 1, 1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "In the poset category an inverse requires a reverse inequality, hence an identity arrow. In the one-object max category, every element is an arrow, and only0can compose with another element to the unit0. The resulting answer is 1, 0, 1, 1, 0, 0."
          - problem: "Let Q be the thin category of the preorder on{1,2,3}with1<=2,2<=1 and reflexive pairs. Let P be the poset category1<2<3. For Q test whether1->2 is an isomorphism and whether objects1and2are equal. Then test the same two claims in P. Give four1/0bits. Establish the inverse equations using the endomorphism hom-sets, rather than counting arrows."
            answer: "1, 0, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Q has arrows both ways, whose composites are the unique endomorphisms and therefore identities; its objects remain distinct. Antisymmetry of the poset prevents such an isomorphism between distinct objects in P. The resulting answer is 1, 0, 0, 0."
          - problem: "Name the category before deciding invertibility of the symbol2. Category C is the one-object category of addition modulo6; category D is the one-object category of multiplication modulo6. For each category give its code(C=1,D=2), then1if morphism2is an isomorphism or0otherwise, then its inverse residue or-1if none exists. Return both triples. Derive the two-sided identity equations using each category own composition."
            answer: "1, 1, 4, 2, 0, -1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "An inverse must compose to the identity of the named category in both orders. The additive category has unit0 and gives inverse4; the multiplicative category has unit1, unreachable by a product with2. The resulting answer is 1, 1, 4, 2, 0, -1."
          - problem: "Work in the one-object category BM of a monoid M. Arrows a,b satisfy ba=1, and ab=1has not been proved. Give1/0 for the claims: the sole object is isomorphic to itself; a must already be an isomorphism; a is an isomorphism exactly when ab=1also holds; every arrow is an isomorphism because there is only one object. For unsupported claims, use the endomorphism monoid of the natural numbers with a(n)=n+1,b(n)=max(n-1,0)."
            answer: "1, 0, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The identity always makes the object isomorphic to itself, but arrow invertibility is a separate assertion. The shift has a left inverse but not a right inverse; if a were invertible, uniqueness of a left inverse would force b to be that inverse, so ab=1is exactly the missing condition. The resulting answer is 1, 0, 1, 0."
          - problem: "An argument claims that in the category of any poset $(P, \\le)$, two distinct objects are never isomorphic. Step 1: if $x$ is isomorphic to $y$, there are arrows $x \\to y$ and $y \\to x$. Step 2: an arrow $x \\to y$ in a poset category means $x \\le y$. Step 3: in a poset, $x \\le y$ implies $x = y$. Step 4: hence $x = y$, so two distinct objects are never isomorphic. Which step is the first step that is not valid?"
            answer: "Step 3"
            answer_contract: {"kind": "label", "options": [["Step 1"], ["Step 2"], ["Step 3"], ["Step 4"]]}
            solution_sketch: "Step 1 is valid: an isomorphism in any category gives arrows in both directions. Step 2 is valid: the arrows of a poset category are exactly the instances of the order relation. Step 3 is the first invalid step, and its error is dropping the second inequality: $x \\le y$ alone does not force $x = y$ in a poset; only $x \\le y$ together with $y \\le x$ does. Step 4 follows once Step 3 is corrected to use both inequalities. The answer is Step 3."
          - problem: "In the one-object category $BM$ of a monoid $M$, one proves that a morphism $m$ is an isomorphism only if $m$ is a unit of $M$. The proof reads: assume $m$ is an isomorphism; then there is a morphism $n$ with $mn = e$ and $nm = e$; [missing line]; hence $m$ is a unit of $M$. Select the missing line."
            answer: "mn = e and nm = e make n a two-sided inverse of m in M"
            answer_contract: {"kind": "label", "options": [["mn = e and nm = e make n a two-sided inverse of m in M"], ["mn = e alone makes n a two-sided inverse of m in M"], ["the equations say that m is the identity morphism of BM"], ["mn = e gives a left inverse, which is enough in a monoid"]]}
            solution_sketch: "Step 1 uses the definition of isomorphism: $m$ has a morphism $n$ with $mn = e$ and $nm = e$ in $BM$. Step 2 uses the dictionary between composition and multiplication: composition in $BM$ is the monoid product, so the two equations say exactly that $n$ is a two-sided inverse of $m$ in $M$. The option using only $mn = e$ commits the one-sided-inverse error, since a left inverse in a monoid need not be two-sided. The option saying $m$ is the identity morphism confuses being invertible with being the identity element. The option calling a left inverse sufficient repeats the one-sided error. The answer is mn = e and nm = e make n a two-sided inverse of m in M."
          - problem: "Write the full proof: in the category of a poset $(P, \\le)$, the only isomorphisms are the identity arrows. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (the category of a poset). The objects are the elements of $P$, there is one arrow $x \\to y$ exactly when $x \\le y$, identities are $1_x$, and composition is forced because each hom-set has at most one element. Step 2 (isomorphism gives two arrows). Let $f: x \\to y$ be an isomorphism with inverse $g: y \\to x$; then $x \\le y$ and $y \\le x$. Step 3 (antisymmetry). Since $\\le$ is antisymmetric, $x \\le y$ and $y \\le x$ imply $x = y$. Step 4 (arrows to self). In a thin category the endomorphism set of $x$ has at most one element, so the arrow $x \\to x$ must be $1_x$; hence $f = 1_x$. Step 5 (conclusion). Every isomorphism of the poset category is an identity arrow, and conversely each identity arrow is an isomorphism, so the isomorphisms are exactly the identities; in particular, if the order is only a preorder, the isomorphisms are the pairs with $x \\le y$ and $y \\le x$, and antisymmetry collapses these to the identities."
      - id: kp3
        name: The two dictionaries, read in both directions
        key_prerequisites: [category-definition]
        constraints: "Require the two dictionaries, read in both directions. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
