            solution_sketch: "Identity arrows impose reflexivity and composites impose transitive closure; uniqueness of parallel arrows supplies associativity. The resulting answer is 1, 0, 1."
          - problem: "Construct the one-object category of the monoid {1,2,3,6} under least common multiple. Give the identity arrow followed by the composites 2 after 3 and 6 after 2."
            answer: "1, 6, 6"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The monoid unit becomes the identity and the operation becomes categorical composition. The resulting answer is 1, 6, 6."
          - problem: "The objects encode the subsets empty, {a}, {b}, {a,b}. Recover all arrows forced by the cover diagram. Objects are [0, 1, 2, 3]; initially specified arrows are [(0, 1), (0, 2), (1, 3), (2, 3)]. Add only what identities and composition force, keeping at most one arrow between each ordered pair. For the ordered pairs [(0, 3), (1, 2), (3, 0), (2, 2)], give 1 if the completed thin category has that arrow and 0 otherwise."
            answer: "1, 0, 0, 1"
