            - 'The number of arrows from $x$ to $y$ is the number of elements in $y \setminus x$ plus one'
          answer: 'There is one arrow $x \to y$ exactly when $x \le y$, and $x \le x$ gives the identity'
          why: 'By the definition of the category of a poset, each relation $x \le y$ is exactly one arrow, and reflexivity $x \le x$ makes the identity at each object one of the counted pairs.'
        exemplars:
          - problem: 'Regard the divisibility order on the divisors $\{1,2,3,4,6,12\}$ of $12$ as a category, with one arrow $a \to b$ whenever $a$ divides $b$. How many morphisms does it have?'
            answer: '18'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Count the arrows out of each object. From $1$ there are $6$, from $2$ there are $4$ (to $2,4,6,12$), from $3$ there are $3$ (to $3,6,12$), from $4$ there are $2$, from $6$ there are $2$, and from $12$ there is $1$. The total is $6+4+3+2+2+1=18$.'
          - problem: 'The arrows of the one-object category $B\mathbb Z_{12}$ are $0,1,\dots,11$, and the composite of $m$ and $n$ is $(m+n) \bmod 12$. Find $8 \circ 7$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite is the sum modulo $12$. We have $8+7=15$, and $15-12=3$, so $8 \circ 7=3$.'
          - problem: 'A thin category has objects $1,2,3,6$ and is generated by the arrows $1 \to 2$, $2 \to 6$, $1 \to 3$, $3 \to 6$, which means it has these arrows, identities, and the composites they force. Is there an arrow $1 \to 6$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, there is", "there is an arrow", "there is"], ["no", "no, there is not", "there is no arrow", "there is not"]]}
            solution_sketch: 'The arrows $1 \to 2$ and $2 \to 6$ are composable, so a composite $1 \to 6$ must exist. Since the category is thin, it is the only arrow from $1$ to $6$.'
          - problem: 'The same thin category has objects $1,2,3,6$ and is generated by $1 \to 2$, $2 \to 6$, $1 \to 3$, $3 \to 6$. Is there an arrow $2 \to 3$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, there is", "there is an arrow", "there is"], ["no", "no, there is not", "there is no arrow", "there is not"]]}
            solution_sketch: 'No generating arrow leaves $2$ except $2 \to 6$, and no arrow leaves $6$ except its identity. So the only arrows out of $2$ are $2 \to 2$ and $2 \to 6$, and there is no arrow $2 \to 3$.'
          - problem: 'The one-object category $B(D,\gcd)$ has as arrows the divisors $D=\{1,2,3,4,6,12\}$ of $12$, and the composite of $m$ and $n$ is $\gcd(m,n)$. Which arrow is the identity?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity $e$ needs $\gcd(e,n)=n$ for every divisor $n$ of $12$. This holds for $e=12$, because every $n$ divides $12$, and for no smaller divisor. So the identity is $12$.'
          - problem: 'A project has five tasks. Task $A$ must be done before $B$ and before $C$, tasks $B$ and $C$ must both be done before $D$, and $D$ must be done before $E$. Let there be an arrow $X \to Y$ whenever $X$ must be done before $Y$, directly or through other tasks, and also an arrow $X \to X$ for each task. How many arrows does this category have?'
            answer: '14'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Count the arrows out of each task. Task $A$ reaches $A,B,C,D,E$, which is $5$ arrows. Tasks $B$ and $C$ each reach themselves, $D$ and $E$, which is $3$ arrows each. Task $D$ has $2$ and task $E$ has $1$. The total is $5+3+3+2+1=14$.'
          - problem: 'The arrows of a one-object category are functions from $\{0,1,2\}$ to itself, with composition of functions. Let $a$ have values $a(0)=1$, $a(1)=2$, $a(2)=0$, and let $b$ have values $b(0)=0$, $b(1)=0$, $b(2)=2$. Find $(b \circ a)(1)$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Apply $a$ first: $a(1)=2$. Then apply $b$: $b(2)=2$. So $(b \circ a)(1)=2$.'
          - problem: 'Tokens are numbered $1$ to $50$. In the divisibility category on these numbers there is one arrow $a \to b$ whenever $a$ divides $b$. How many arrows start at the object $7$?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The arrows from $7$ end at the multiples of $7$ that are at most $50$. These are $7,14,21,28,35,42,49$, and counting them is the division $50 \div 7$ rounded down, which is $7$.'
          - problem: 'In the divisibility category on $\{1,2,3,6\}$ the arrows $1 \to 2$ and $2 \to 6$ are composed. The composite is an arrow from which object to which object?'
            answer: '(1, 6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The composite starts where the first arrow starts and ends where the second arrow ends. So it is an arrow from $1$ to $6$.'
          - problem: 'Write the full proof that the category of a poset $(P,\le)$, with one morphism from $x$ to $y$ exactly when $x \le y$, satisfies the axioms of a category.'
            answer: 'The poset category satisfies the axioms'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Reflexivity $x \le x$ gives the identity $1_x$, and transitivity gives the composite of $x \le y$ and $y \le z$ as the arrow $x \le z$. Any two arrows with the same source and target are equal, because each hom-set has at most one element. So associativity and the unit laws hold, since both sides of each law lie in one hom-set.'
        constraints: 'Concrete posets and monoids are read as categories and counted: morphisms of a divisibility or task order, arrows forced by composition from generating arrows, the composite of two named arrows as a pair of endpoints, identities and composites in a one-object category, and contexts that need a division or a closure. One item asks for a full proof.'
      - id: kp2
        name: Isomorphisms in these categories
        key_prerequisites: [category-definition]
        step_check:
          step: 'Since $f$ and $g$ are functions, $g \circ f = 1_n$ implies that $f$ is injective'
          question: 'Why does $g \circ f = 1_n$ force $f$ to be injective?'
          options:
            - 'Because $g \circ f$ is an identity, so $f$ must also be an identity function'
            - 'Because $g \circ f$ is a bijection, so both $f$ and $g$ are bijections'
            - 'Because $g$ is surjective, so every value of $f$ is hit by some input'
            - 'Because $g$ undoes $f$, so two inputs with equal $f$-values would be equal'
          answer: 'Because $g$ undoes $f$, so two inputs with equal $f$-values would be equal'
          why: 'If $f(x)=f(y)$ then $x=g(f(x))=g(f(y))=y$, so $f$ is injective; the identity $1_n$ does not make $f$ an identity, and $g \circ f=1_n$ alone gives only injectivity of $f$.'
        exemplars:
          - problem: 'In the category of the poset $0<1<2$ there is one arrow $x \to y$ whenever $x \le y$. Is the arrow $0 \to 1$ an isomorphism?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is an isomorphism", "it is an isomorphism", "an isomorphism"], ["no", "no, it is not an isomorphism", "it is not an isomorphism", "not an isomorphism"]]}
            solution_sketch: 'An inverse of $0 \to 1$ would be an arrow $1 \to 0$, which needs $1 \le 0$. There is no such arrow, so $0 \to 1$ is not an isomorphism.'
          - problem: 'In the one-object category $B\mathbb Z_6$ the arrows are $0,1,\dots,5$ and the composite of $m$ and $n$ is $(m+n) \bmod 6$. Find the inverse of the arrow $2$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identity is $0$, so the inverse $n$ of $2$ satisfies $(2+n) \bmod 6=0$. Hence $n=4$, since $2+4=6$.'
          - problem: 'A dial machine multiplies the stored number by $m$ and reduces it modulo $12$, for $m=0,1,\dots,11$. These actions are the arrows of a one-object category, with the composite of $m$ and $n$ equal to $mn \bmod 12$. For which $m$ can the action be undone by another action?'
            answer: '1, 5, 7, 11'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An action $m$ can be undone exactly when $mk \equiv 1 \pmod{12}$ for some $k$, that is, when $m$ is invertible modulo $12$. This holds for $m=1,5,7,11$, which are the numbers coprime to $12$. For example $5 \cdot 5=25 \equiv 1$.'
          - problem: 'In $B(\mathbb Z_6,\cdot)$, the one-object category with arrows $0,\dots,5$ and composite $mn \bmod 6$, is the arrow $5$ an isomorphism?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is an isomorphism", "it is an isomorphism", "an isomorphism"], ["no", "no, it is not an isomorphism", "it is not an isomorphism", "not an isomorphism"]]}
            solution_sketch: 'The identity is $1$, so an inverse $k$ of $5$ needs $5k \equiv 1 \pmod 6$. Since $5 \cdot 5=25=4 \cdot 6+1$, the arrow $5$ is its own inverse. So $5$ is an isomorphism, although $2$ is not.'
          - problem: 'A thin category has objects $1,2,3$ and exactly these arrows: the three identities, an arrow $1 \to 2$ and an arrow $2 \to 1$. How many of its arrows are isomorphisms?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Every identity is an isomorphism. The arrows $1 \to 2$ and $2 \to 1$ are inverse to each other, since both composites are endomorphisms and the only endomorphisms are identities. So all $5$ arrows are isomorphisms.'
          - problem: 'The arrows of a one-object category are the functions $\mathbb N \to \mathbb N$, with composition of functions. Let $a(n)=n+1$ and $b(n)=\max(n-1,0)$, so that $b \circ a$ is the identity. Find $(a \circ b)(0)$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'We have $b(0)=\max(-1,0)=0$, and then $a(0)=1$. So $(a \circ b)(0)=1 \ne 0$, and $a \circ b$ is not the identity. Thus $a$ has a left inverse $b$ but no two-sided inverse, so $a$ is not an isomorphism.'
          - problem: 'In the category whose objects are the sets $\{1,\dots,n\}$ and whose morphisms are all functions, four guests are placed one to a chair on four chairs. A seating of guests on chairs is an isomorphism from the guest set to the chair set. How many such isomorphisms are there?'
            answer: '24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An isomorphism of finite sets is a bijection. The first guest has $4$ chairs to choose from, the next has $3$, then $2$, then $1$. So there are $4 \cdot 3 \cdot 2 \cdot 1=24$ isomorphisms.'
          - problem: 'Tom says the inverse of the arrow $3$ in $B(\mathbb Z_7,\cdot)$ is $1/3$. Which arrow among $0,1,\dots,6$ is the inverse of $3$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inverse $k$ of $3$ satisfies $3k \equiv 1 \pmod 7$. Since $3 \cdot 5=15=2 \cdot 7+1$, we get $k=5$. The fraction $1/3$ is not an arrow of this category.'
          - problem: 'Write the full proof that in the category of a poset $(P,\le)$ the only isomorphisms are the identity arrows.'
            answer: 'Only identities are isomorphisms in a poset'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Let $x \to y$ be an isomorphism with inverse $y \to x$. Then $x \le y$ and $y \le x$, so $x=y$ by antisymmetry. The arrow $x \to x$ is the only arrow in its hom-set, so it is the identity.'
        constraints: 'Isomorphisms are decided in posets, preorders, and one-object categories of monoids: whether a named arrow is invertible, its inverse as an element, the set of all invertible arrows, and counts of isomorphisms. Verdicts are paired with the deciding fact (a missing reverse arrow or a one-sided inverse).'
      - id: kp3
        name: The two dictionaries, read in both directions
        key_prerequisites: [category-definition]
        step_check:
          step: 'Any two morphisms $g,h\in G$ have the same source and target $*$, so $g\circ h$ is defined and again lies in $G$'
          question: 'Why is composition a binary operation on all of $G=\mathrm{Hom}(*,*)$?'
          options:
            - 'Composition is defined by the group product, so it is a binary operation by definition'
            - 'The identity $1_*$ can be composed with every pair of arrows in $G$'
            - 'Every arrow starts and ends at the single object $*$, so every pair is composable'
            - 'The hom-set $G$ is closed under inverses, so any two arrows can be composed'
          answer: 'Every arrow starts and ends at the single object $*$, so every pair is composable'
          why: 'A composite $g \circ h$ needs the target of $h$ to be the source of $g$, and with one object this always holds, so any two arrows of $G$ compose to an arrow of $G$.'
        exemplars:
          - problem: 'Let $M=(\mathbb Z_{10},+)$ and let $BM$ be the one-object category with arrows $0,1,\dots,9$, where the composite of the arrows $m$ and $n$ is the monoid product. Find the composite of $7$ and $8$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite in $BM$ is the monoid operation, which here is addition modulo $10$. We get $7+8=15$, and $15 \bmod 10=5$.'
          - problem: 'A thin category has objects $0,1,2$ and is generated by the arrows $0 \to 1$, $1 \to 0$, $1 \to 2$: it has these arrows, the identities, and the composites they force. How many morphisms does it have?'
            answer: '7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The identities give $3$ arrows. The generating arrows give $3$ more, and the composite of $0 \to 1$ with $1 \to 2$ gives $0 \to 2$. No arrow leaves $2$ except its identity, so there are $3+3+1=7$ arrows.'
          - problem: 'A thin category has objects $0,1,2$ and the arrows $0 \to 0$, $1 \to 1$, $2 \to 2$, $0 \to 1$ and $1 \to 0$. Its preorder is the relation $x \le y$ when there is an arrow $x \to y$. Is this relation antisymmetric, so that it is a partial order?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is a partial order", "it is antisymmetric", "antisymmetric"], ["no", "no, it is not a partial order", "it is not antisymmetric", "not antisymmetric", "not a partial order"]]}
            solution_sketch: 'The relation has $0 \le 1$ and $1 \le 0$, but $0 \ne 1$. So it is not antisymmetric, and it is only a preorder.'
          - problem: 'Let $M$ be the monoid of all functions from $\{0,1,2\}$ to itself under composition, and let $BM$ be the one-object category with arrows the elements of $M$. How many arrows does $BM$ have?'
            answer: '27'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Each of the $3$ inputs can go to any of the $3$ outputs, independently. So there are $3 \cdot 3 \cdot 3=3^3=27$ functions, which is $27$ arrows.'
          - problem: 'In the same category $BM$ (all functions from $\{0,1,2\}$ to itself, composed as functions), how many arrows are isomorphisms?'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An arrow is an isomorphism when the function has an inverse function, that is, when it is a bijection. The bijections of a $3$-element set number $3 \cdot 2 \cdot 1=6$.'
          - problem: 'In the one-object category $B(\mathbb Z_5,\cdot)$ the arrows are $0,1,\dots,4$ and the composite of $m$ and $n$ is $mn \bmod 5$. Find the composite of the arrows $3$ and $4$.'
            answer: '2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite is the monoid product modulo $5$. We have $3 \cdot 4=12$ and $12=2 \cdot 5+2$, so the composite is $2$.'
          - problem: 'A thermostat can change the temperature by any whole number of degrees. These changes are the arrows of the one-object category $B\mathbb Z$, where the composite adds the changes. What single arrow is the composite of raising by $5$ and lowering by $8$?'
            answer: '-3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Raising by $5$ is the arrow $5$ and lowering by $8$ is the arrow $-8$. The composite adds them: $5+(-8)=-3$, which is lowering by $3$.'
          - problem: 'The arrows of a one-object category are the scale factors $k>0$ (rational numbers), and composing two arrows multiplies their factors. What arrow is the composite of scaling by $3$ and scaling by $2/9$?'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The composite multiplies the factors: $3 \cdot 2/9=6/9$. Dividing numerator and denominator by $3$ gives $2/3$, so the composite is scaling by $2/3$.'
          - problem: 'Kim says every arrow of $B(\mathbb N,+)$ is an isomorphism, because there is only one object. Which arrows are actually isomorphisms?'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An arrow $m$ is an isomorphism when some $n$ satisfies $m+n=0$ in $\mathbb N$. For $m>0$ no natural number $n$ does this. So only $0$ is an isomorphism.'
          - problem: 'Is the one-object category $B(\mathbb Z_5,+)$ a groupoid, that is, is every one of its arrows an isomorphism?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "yes, it is a groupoid", "it is a groupoid", "a groupoid"], ["no", "no, it is not a groupoid", "it is not a groupoid", "not a groupoid"]]}
            solution_sketch: 'Every residue $m$ modulo $5$ has the inverse $(5-m) \bmod 5$, because $m+(5-m)=5 \equiv 0$. So every arrow is an isomorphism, which is the dictionary statement that $\mathbb Z_5$ is a group.'
          - problem: 'Write the full proof that a category with exactly one object is the same thing as a monoid, in both directions.'
            answer: 'One-object categories are the monoids'
            answer_contract: {"kind": "none"}
            solution_sketch: 'Given a monoid $M$, the one-object category $BM$ has arrows the elements of $M$, composition the product and identity the unit. Conversely, in a category with one object $*$ every pair of arrows composes, composition is associative, and $1_*$ is a unit, so $\mathrm{Hom}(*,*)$ is a monoid. The two constructions undo each other.'
        constraints: 'The two dictionaries are used in both directions with explicit data: composites in BM computed from the monoid rule, the preorder read off a thin category (and its antisymmetry), a monoid read off a one-object category (size, units), and groupoid or isomorphism questions. Contexts with changes and scale factors fix the convention for the composite.'
    diagnostic_exemplar:
      problem: "Let $M$ be a monoid, viewed as the one-object category $BM$. Prove that the isomorphisms of $BM$ are exactly the units of $M$, and deduce that $BM$ is a groupoid iff $M$ is a group."
      answer: "A morphism of $BM$ is an element $m\\in M$ with composition the monoid product, so a two-sided categorical inverse for $m$ is exactly $n$ with $nm=e=mn$ — a two-sided inverse in $M$. Hence the isomorphisms are the units of $M$; every morphism is invertible iff every element of $M$ is a unit, i.e. iff $M$ is a group, which is exactly when $BM$ is a groupoid."
      solution_sketch: "Unwind the dictionary rather than proving anything new: a morphism of $BM$ is an element of $M$ and composition is the monoid product, so a two-sided categorical inverse and a two-sided inverse in $M$ are literally the same condition. The groupoid claim then reads off as: every element is a unit."
    anki_seeds:
      - front: "A category with exactly one object is the same thing as..."
        back: "a monoid (its morphisms under composition, with $1_*$ the unit)."
        type: basic
      - front: "A category with at most one morphism between any two objects (thin) is the same thing as..."
        back: "a preorder on its objects ($x\\le y$ iff there is an arrow $x\\to y$)."
        type: basic
      - front: "In $BM$ (a monoid as a one-object category), which morphisms are isomorphisms?"
        back: "exactly the units (invertible elements) of $M$."
        type: basic

  - id: discrete-indiscrete-categories
    name: Discrete, Indiscrete, and Shape Categories
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: proof
    expected_time_secs: 180
    prerequisites:
      - id: category-definition
        weight: 0.5
        key: true
      - id: poset-monoid-categories
        weight: 0.4
        key: true
      - id: commutative-diagrams
        weight: 0.2
