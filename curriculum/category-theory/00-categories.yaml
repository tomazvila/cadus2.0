            answer: "1, 2, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The first composite lies in Hom(I,I), the second in Hom(J,J), and the final comparison in Hom(I,J). Initiality of each source identifies its arrows, proving both inverse laws and uniqueness of the isomorphism. The resulting answer is 1, 2, 1."
          - problem: "Audit this proof of uniqueness of initial objects. Step1: choose u:I->J and v:J->I using their initial properties. Step2: vu=id_I because I is initial. Step3: uv=id_J because I is initial. Step4: hence u,v are inverse. Give the number of the first step whose cited reason does not establish its conclusion. At each step use only its named uniqueness hypothesis, even if another hypothesis could repair the proof."
            answer: "3"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The first two steps use the stated universal properties correctly. Step3needs uniqueness of arrows out of J, not I; that distinction is essential when proving the two comparison composites are identities. The resulting answer is 3."
          - problem: "Let I,J be initial objects and let u:I->J,v:J->I be their unique comparison arrows. A proof uses initiality of I for one inverse equation and initiality of J for the other. Now suppose only I is initial and u,v still exist. Give 1/0 for the conclusions vu=id_I, uv=id_J, and u=v^{-1}. For unsupported conclusions, a counterexample in pointed sets may be useful."
            answer: "1, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Initiality of I makes its endomorphism unique, proving vu=id_I. In pointed sets the point object is initial, while a two-point pointed set supplies maps both ways with uv constant, so the remaining claims fail. The resulting answer is 1, 0, 0."
          - problem: "Let I,J be initial, let v:J->I be their comparison, and let h:I->J be any arrow. Decide which conclusions the universal-property argument proves: hv=id_J; vh=id_I; h equals the canonical comparison I->J; I=J as objects. Give four1/0bits. The proof must establish the first two identities and uniqueness for an arbitrary h, without using an element description."
            answer: "1, 1, 1, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Initiality makes each endomorphism hom-set a singleton containing its identity. It also makes Hom(I,J) a singleton, so every h is the same isomorphism; distinct objects may still satisfy these properties. The resulting answer is 1, 1, 1, 0."
          - problem: "Write the full proof: any two initial objects of a category are uniquely isomorphic. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1 (setup): let I and J be initial objects of a category. Step 2 (cross-maps): by initiality of I there is a unique morphism u: I -> J, and by initiality of J there is a unique morphism v: J -> I. Step 3 (composite on I): the composite v after u: I -> I is a morphism from I to I; since I is initial, there is exactly one morphism I -> I, namely the identity 1_I, so v after u is 1_I. Step 4 (composite on J): similarly, u after v: J -> J is a morphism from J to J; since J is initial, there is exactly one morphism J -> J, namely 1_J, so u after v is 1_J. Step 5 (isomorphism): therefore u and v are mutually inverse, so u is an isomorphism I -> J. Step 6 (uniqueness): any isomorphism I -> J is a morphism I -> J, and by initiality of I there is only one such morphism, so u is the unique isomorphism from I to J. Thus any two initial objects are uniquely isomorphic."
      - id: kp3
        name: Zero objects
        key_prerequisites: [isomorphism-vs-equality]
        constraints: "Require the learner to use zero objects. Closed items must construct the relevant maps, test categorical laws, or supply the essential proof steps. A supplied characterization followed only by counting or evaluation is insufficient. Preserve one full-proof exemplar."
        exemplars:
          - problem: "In the category of groups, which object is both initial and terminal?"
            answer: "trivial group"
            answer_contract: {"kind": "label", "options": [["trivial group"], ["group of integers"], ["cyclic group of order 2"], ["free group on one generator"]]}
            solution_sketch: "A zero object is an object that is both initial and terminal. In Grp the trivial group is terminal: every group has exactly one homomorphism to it, the constant map. It is initial: from it to any group there is exactly one homomorphism, sending the identity to the identity. The option group of integers is the error of confusing a generator object with a zero object: there are many homomorphisms from the integers to a two-element group, so it is not initial. The option cyclic group of order 2 is not initial because there is no homomorphism from it to a group of order 3. The option free group on one generator is the group of integers, so it fails the same way. The correct object is trivial group."
          - problem: "In a category with zero object 0, let z: A to B be the composite A to 0 to B, and let g: B to C. Decide whether g composed with z is always the zero morphism A to C. Give the verdict and the number of arrows from 0 to C that uniqueness forces."
            answer: "verdict = holds; count = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["holds"], ["fails"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "count"}]}
            solution_sketch: "Step 1: Recall the definition. The zero morphism z: A to B is the composite A to 0 to B. Step 2: Use terminality. Since 0 is terminal, there is exactly one arrow A to 0. Step 3: Use initiality. Since 0 is initial, there is exactly one arrow 0 to C. Step 4: Compose. The arrow g composed with the arrow 0 to B is an arrow 0 to C, so uniqueness forces it to equal the unique arrow 0 to C. Therefore g composed with z equals the zero morphism A to C. So verdict = holds; count = 1."
          - problem: "In the category of sets, how many zero objects are there?"
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "In Set the empty set is initial: there is exactly one function from it to any set. A singleton is terminal: there is exactly one function from any set to it. No set is both initial and terminal, since the empty set has no element and a singleton has one. Therefore the number of zero objects in Set is 0."
          - problem: "In a category with a zero object 0, how many morphisms are there from 0 to 0?"
            answer: "1"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Let 0 be a zero object. Since 0 is initial, there is exactly one morphism from 0 to any object, so there is exactly one morphism from 0 to 0. The identity arrow 0 to 0 is one such morphism. Hence the number is exactly 1."
          - problem: "In the category of sets, which statement about zero objects is correct?"
            answer: "no zero object"
            answer_contract: {"kind": "label", "options": [["no zero object"], ["empty set is zero"], ["singleton is zero"], ["every set is zero"]]}
            solution_sketch: "Step 1: Recall the definition. A zero object is an object that is both initial and terminal at once. Step 2: Examine the option empty set is zero. The empty set is initial, but it is not terminal because there is no function from a nonempty set to it, so this option fails. Step 3: Examine the option singleton is zero. A singleton is terminal, but it is not initial because there is no function from a singleton to the empty set, so this option fails. Step 4: Examine the option every set is zero. A two-element set is neither initial nor terminal, so this option fails. Step 5: Conclude that Set has no zero object. The answer is no zero object."
          - problem: "In pointed Set, use the zero object {*} to construct the zero morphism from A={0,1,2} with basepoint 2 to B={0,1,2,3} with basepoint 1. Then compose with the basepoint-preserving map g:B->C={0,1,2} with values [2,0,1,2], where C has basepoint 0. Give the value lists of the zero morphism and its composite with g."
            answer: "1, 1, 1, 0, 0, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The unique map to the one-point object followed by the unique pointed map out produces the zero arrow. Its composite factors through the same zero object. The resulting answer is 1, 1, 1, 0, 0, 0."
          - problem: "Write the full proof: In the category of groups, the trivial group is a zero object. Then compare with the solution."
            answer: "See the solution."
            answer_contract: {"kind": "none"}
            solution_sketch: "Step 1: Define the candidate. Let 1 denote the trivial group containing only the identity e. Step 2: Show terminal. For any group G, a homomorphism f: G to 1 must send every element to e, since 1 has only e; this constant map is a homomorphism, so there is exactly one homomorphism G to 1. Thus 1 is terminal. Step 3: Show initial. For any group G, a homomorphism h: 1 to G is determined by the image of e; the identity of G is the only choice that preserves the identity, so h(e) equals the identity of G is the unique homomorphism 1 to G. Thus 1 is initial. Step 4: Conclude. Since 1 is both initial and terminal, it is a zero object in Grp. Step 5: Contrast with Set. The empty set is initial and singletons are terminal, but no set is both, so Set has no zero object. Therefore the trivial group is a zero object in Grp."
    diagnostic_exemplar:
      problem: "Prove that any two terminal objects of a category are isomorphic by a unique isomorphism."
      answer: "Let $1,1'$ be terminal. Terminality of $1'$ gives a unique $u\\colon 1\\to 1'$, and terminality of $1$ a unique $v\\colon 1'\\to 1$. Both $v\\circ u$ and $1_1$ are arrows $1\\to 1$, and terminality of $1$ says there is only one, so $v\\circ u=1_1$; symmetrically $u\\circ v=1_{1'}$. Hence $u$ is an isomorphism, and it is the unique morphism $1\\to 1'$ at all, so the isomorphism is unique."
      solution_sketch: "Terminality gives an arrow each way; then note that each round trip is an arrow from a terminal object to itself, competing with the identity, and terminality says there is only one such arrow. Uniqueness of the isomorphism is free, since the hom-set between the two terminal objects is already a singleton."
    anki_seeds:
      - front: "Define an initial object of a category."
        back: "an object with exactly one morphism to every object."
        type: basic
      - front: "Define a terminal object of a category."
        back: "an object with exactly one morphism from every object."
        type: basic
      - front: "Initial/terminal objects are unique up to..."
        back: "a unique isomorphism."
        type: basic
      - front: "In $\\mathbf{Set}$ the initial object is {{c1::$\\varnothing$}} and a terminal object is {{c2::any singleton}}."
        back: "$\\varnothing$; any singleton"
        type: cloze

