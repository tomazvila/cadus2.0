        key_prerequisites: [composition-associativity-identity]
        constraints: "Require the data and axioms, read off in set. The closed answer must encode the categorical construction, essential proof equations, or a countermodel to an invalid argument. Preserve exactly one full-proof exemplar."
        exemplars:
          - problem: "Read the composition data of Set for A={0,1},B={0,1,2},C={0,1}. Let f:A->B have values[2,0]and g:B->C have values[1,0,0]. Construct the categorical composite gf, including its type. Code A=1,B=2,C=3. Give its domain code,codomain code,and all values in input order. Check that each output lies in the declared codomain."
            answer: "1, 3, 0, 1"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "The common middle object is B, so composition in Set gives an arrow A->C. Applying g to each f-value constructs the whole composite and verifies its codomain. The resulting answer is 1, 3, 0, 1."
          - problem: "Construct the identity arrows required by Set on A={0,1}and B={0,1,2}. Then for f:A->B with values[2,0], verify both unit composites from the constructed identities. Give the values of id_A,id_B,id_B f,and f id_A consecutively, each in its domain order."
            answer: "0, 1, 0, 1, 2, 2, 0, 2, 0"
            answer_contract: {"kind": "list", "ordered": true, "member": {"kind": "exact"}}
            solution_sketch: "Set requires an identity for each object, not a single global identity arrow. The functions that fix each element give the two identities, and their composites with f verify both unit laws with the correct object types. The resulting answer is 0, 1, 0, 1, 2, 2, 0, 2, 0."
          - problem: "Verify the associativity axiom for Set using arbitrary maps f:A->B,g:B->C,h:C->D and x in A. Repeatedly unfold function composition for(hg)f and h(gf). Encode applying f by1,g by2,h by3. Give the application sequence from the innermost value x outward for each parenthesization. The proof must apply to arbitrary x, not just a chosen numerical input."
