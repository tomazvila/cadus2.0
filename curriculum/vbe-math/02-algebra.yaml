        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Terms and sums of arithmetic and geometric progressions with the middle term'
        key_prerequisites: [progression-middle-term, arithmetic-series]
        exemplars:
          - problem: 'An arithmetic progression has $a_1=5$ and $d=3$. (a) Find $a_{10}$. (b) Find $S_{10}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a10","contract":{"kind":"exact"}},{"name":"S10","contract":{"kind":"exact"}}]}
            answer: 'a10 = 32; S10 = 185'
            solution_sketch: 'We have $a_{10}=5+3\cdot9=32$. Then $S_{10}=\frac{5+32}{2}\cdot10=185$.'
          - problem: 'A geometric progression has $b_1=2$ and $q=3$. (a) Find $b_5$. (b) Find $S_5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b5","contract":{"kind":"exact"}},{"name":"S5","contract":{"kind":"exact"}}]}
            answer: 'b5 = 162; S5 = 242'
            solution_sketch: 'We have $b_5=2\cdot3^4=162$. Then $S_5=2\cdot\frac{3^5-1}{3-1}=242$.'
          - problem: 'An arithmetic progression has $a_3=11$ and $a_7=23$. (a) Find $d$. (b) Find $a_1$. (c) Find $S_8$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"exact"}},{"name":"a1","contract":{"kind":"exact"}},{"name":"S8","contract":{"kind":"exact"}}]}
            answer: 'd = 3; a1 = 5; S8 = 124'
            solution_sketch: 'From $a_7-a_3=4d=12$ we get $d=3$. Then $a_1=11-6=5$. Also $a_8=26$, so $S_8=\frac{5+26}{2}\cdot8=124$.'
          - problem: '(a) The numbers $3$, $x$, $13$ are consecutive terms of an arithmetic progression. Find $x$. (b) The positive numbers $4$, $y$, $36$ are consecutive terms of a geometric progression. Find $y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}}]}
            answer: 'x = 8; y = 12'
            solution_sketch: 'In (a), the middle term is the mean of its neighbors: $x=(3+13)/2=8$. In (b), $y^2=4\cdot36=144$ and $y>0$, so $y=12$.'
          - problem: 'A geometric progression has $b_2=6$ and $b_5=162$. (a) Find $q$. (b) Find $b_1$. (c) Find $S_6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"q","contract":{"kind":"exact"}},{"name":"b1","contract":{"kind":"exact"}},{"name":"S6","contract":{"kind":"exact"}}]}
            answer: 'q = 3; b1 = 2; S6 = 728'
            solution_sketch: 'We have $b_5/b_2=q^3=27$, so $q=3$. Then $b_1=6/3=2$. Last, $S_6=2\cdot\frac{3^6-1}{2}=728$.'
          - problem: 'Three numbers form an arithmetic progression. Their sum is $18$ and their product is $120$. (a) Find the middle number. (b) Find $d$ when $d>0$. (c) Find the sum of the squares of the three numbers.'
            answer_contract: {"kind":"multipart","parts":[{"name":"mid","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"squares","contract":{"kind":"exact"}}]}
            answer: 'mid = 6; d = 4; squares = 140'
            solution_sketch: 'Write the numbers as $6-d$, $6$, $6+d$, because the sum is $18$. The product gives $6(36-d^2)=120$, so $d^2=16$. With $d=4$ the numbers are $2$, $6$, $10$. The sum of squares is $4+36+100=140$.'
        constraints: 'arithmetic and geometric progressions with integer data; the parts ask for a term, a ratio or difference, and a sum'
      - id: kp2
        name: 'Infinite decreasing geometric progression and periodic decimals'
        key_prerequisites: [geometric-series-convergence, geometric-series-finite-infinite]
        exemplars:
          - problem: 'A geometric progression has $b_1=6$ and $q=\tfrac13$. (a) Find the sum $S$ of all its terms. (b) Find $b_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"S","contract":{"kind":"exact"}},{"name":"b3","contract":{"kind":"exact"}}]}
            answer: 'S = 9; b3 = 2/3'
            solution_sketch: 'Use $S=b_1/(1-q)=6/(2/3)=9$. Also $b_3=6\cdot\frac19=\frac23$.'
          - problem: '(a) Find the sum $12+4+\tfrac43+\dots$ of the infinite progression. (b) An infinite decreasing geometric progression has $b_1=10$ and sum $25$. Find $q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"S","contract":{"kind":"exact"}},{"name":"q","contract":{"kind":"exact"}}]}
            answer: 'S = 18; q = 3/5'
            solution_sketch: 'In (a), $q=\frac13$ and $S=12/(1-\frac13)=18$. In (b), $10/(1-q)=25$ gives $1-q=\frac25$. So $q=\frac35$.'
          - problem: 'Write each repeating decimal as a fraction. (a) $0.(6)$. (b) $0.(27)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = 2/3; p2 = 3/11'
            solution_sketch: 'In (a), the sum is $0.6/(1-0.1)=2/3$. In (b), the sum is $0.27/(1-0.01)=27/99=3/11$.'
          - problem: 'Write each repeating decimal as a fraction. (a) $0.2(3)$. (b) $1.(45)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = 7/30; p2 = 16/11'
            solution_sketch: 'In (a), $0.2(3)=\frac15+0.0(3)=\frac15+\frac1{30}=\frac7{30}$. In (b), $1.(45)=1+\frac{45}{99}=1+\frac5{11}=\frac{16}{11}$.'
          - problem: 'An infinite decreasing geometric progression has sum $8$ and $b_2=2$. (a) Find $q$. (b) Find $b_1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"q","contract":{"kind":"exact"}},{"name":"b1","contract":{"kind":"exact"}}]}
            answer: 'q = 1/2; b1 = 4'
            solution_sketch: 'We have $b_1q=2$ and $b_1=8(1-q)$. So $8q(1-q)=2$, which gives $(2q-1)^2=0$. Then $q=\frac12$ and $b_1=4$.'
          - problem: '(a) Find $x$ when $1+x+x^2+\dots=\tfrac53$. (b) Find all $x$ for which the sum $1+x+x^2+\dots$ exists. (c) Find the sum $1-\tfrac12+\tfrac14-\tfrac18+\dots$'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"dom","contract":{"kind":"inequality_union"}},{"name":"S","contract":{"kind":"exact"}}]}
            answer: 'x = 2/5; dom = -1 < x < 1; S = 2/3'
            solution_sketch: 'In (a), $1/(1-x)=5/3$, so $x=2/5$. In (b), the ratio $x$ must have $|x|<1$. In (c), $q=-\frac12$ and $S=1/(1+\frac12)=\frac23$.'
        constraints: 'infinite decreasing geometric progressions with |q|<1 and repeating decimals; keys are fractions'
      - id: kp3
        name: 'Multi-part word problem with a progression'
        key_prerequisites: [progression-word-problems, arithmetic-sequences]
        exemplars:
          - problem: 'A machine makes $50$ parts on day $1$. Each day it makes $4$ parts more than on the day before. (a) How many parts does it make on day $12$? (b) How many parts does it make in the first $12$ days?'
            answer_contract: {"kind":"multipart","parts":[{"name":"day12","contract":{"kind":"exact"}},{"name":"total","contract":{"kind":"exact"}}]}
            answer: 'day12 = 94; total = 864'
            solution_sketch: 'The numbers form an arithmetic progression with $a_1=50$ and $d=4$. So $a_{12}=50+44=94$. Then $S_{12}=\frac{50+94}{2}\cdot12=864$.'
          - problem: 'A culture has $500$ bacteria. The number doubles every hour. (a) How many bacteria are there after $6$ hours? (b) After how many whole hours is the number first more than $100000$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"count","contract":{"kind":"exact"}},{"name":"hours","contract":{"kind":"exact"}}]}
            answer: 'count = 32000; hours = 8'
            solution_sketch: 'The numbers form a geometric progression with $q=2$. After $6$ hours there are $500\cdot2^6=32000$. We need $2^n>200$. Since $2^7=128$ and $2^8=256$, the answer is $8$.'
          - problem: 'A hall has $20$ seats in row $1$. Each next row has $2$ seats more than the row before. (a) How many seats are in row $15$? (b) How many seats are in the first $15$ rows together? (c) What is the number of the first row with more than $60$ seats?'
            answer_contract: {"kind":"multipart","parts":[{"name":"row15","contract":{"kind":"exact"}},{"name":"total","contract":{"kind":"exact"}},{"name":"row","contract":{"kind":"exact"}}]}
            answer: 'row15 = 48; total = 510; row = 22'
            solution_sketch: 'We have $a_{15}=20+2\cdot14=48$. Then $S_{15}=\frac{20+48}{2}\cdot15=510$. In (c), $20+2(n-1)>60$ gives $n>21$. So $n=22$.'
          - problem: 'A ball falls from $16$ m. After each hit it rebounds to $\tfrac34$ of the last height. (a) Find the height of the third rebound in meters. (b) Find the total distance the ball moves until it stops, in meters.'
            answer_contract: {"kind":"multipart","parts":[{"name":"h3","contract":{"kind":"exact"}},{"name":"dist","contract":{"kind":"exact"}}]}
            answer: 'h3 = 27/4; dist = 112'
            solution_sketch: 'The rebound heights are $12$, $9$, $\frac{27}4$, and so on. The total distance is $16$ plus twice the sum of the rebound heights. That sum is $12/(1-\frac34)=48$. So the distance is $16+96=112$.'
          - problem: 'A person saves $100$ in month $1$. Each month the saving is $20$ more than in the month before. (a) Find the saving in month $10$. (b) Find the total saving in the first $10$ months. (c) Find the number of the month in which the total first is more than $5000$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"m10","contract":{"kind":"exact"}},{"name":"total","contract":{"kind":"exact"}},{"name":"month","contract":{"kind":"exact"}}]}
            answer: 'm10 = 280; total = 1900; month = 19'
            solution_sketch: 'We have $a_{10}=100+20\cdot9=280$. Then $S_{10}=\frac{100+280}{2}\cdot10=1900$. In (c), $S_n=n(90+10n)>5000$ gives $n^2+9n>500$. Since $18^2+162=486$ and $19^2+171=532$, the answer is $19$.'
          - problem: 'A rope of $255$ cm is cut into $8$ pieces. The lengths form a geometric progression with $q=2$. (a) Find the length of the shortest piece in cm. (b) Find the length of the longest piece in cm. (c) Find the total length of the three longest pieces in cm.'
            answer_contract: {"kind":"multipart","parts":[{"name":"short","contract":{"kind":"exact"}},{"name":"long","contract":{"kind":"exact"}},{"name":"three","contract":{"kind":"exact"}}]}
            answer: 'short = 1; long = 128; three = 224'
            solution_sketch: 'We have $b_1(2^8-1)=255$, so $b_1=1$. Then $b_8=2^7=128$. The three longest pieces are $32$, $64$ and $128$, with sum $224$.'
        constraints: 'a short word problem with a progression; two or three parts; every value is a whole number or a simple fraction'
    diagnostic_exemplar:
      problem: 'Find the sum of the first four terms of the arithmetic progression $2,5,8,\dots$'
      answer_contract: {"kind":"exact"}
      answer: '26'
      solution_sketch: 'The terms are $2$, $5$, $8$, $11$. Their sum is $26$.'
  - id: vbe-cp08-function-concept
    name: 'Functions: parity, composition, transformations'
    lt_term: 'Funkcijos: samprata ir transformacijos'
    area: models
    program_items: [66, 67, 68, 69, 70]
    core: false
    difficulty: 0.55
    drill: false
    answer_kind: multi-step
    expected_time_secs: 300
    prerequisites:
      - id: trig-function-properties-graphical
        weight: 0.6
        key: true
      - id: graph-transformations-horizontal-modulus
        weight: 0.4
        key: false
      - id: graphical-solving-equations-inequalities
        weight: 0.4
        key: false
      - id: even-odd-functions
        weight: 0.4
        key: false
      - id: function-composition
        weight: 0.4
        key: false
      - id: function-transformations-shifts
        weight: 0.4
        key: false
      - id: function-stretches-reflections
        weight: 0.4
        key: false
      - id: graphing-systems
        weight: 0.4
        key: false
      - id: graphing-linear-inequalities
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Composite, even, odd and periodic functions'
        key_prerequisites: [even-odd-functions, function-composition]
        exemplars:
          - problem: 'Let $f(x)=2x+1$ and $g(x)=x^2$. (a) Compute $f(g(3))$. (b) Write $g(f(x))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"val","contract":{"kind":"exact"}},{"name":"comp","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'val = 19; comp = (2*x+1)^2'
            solution_sketch: 'We have $g(3)=9$ and $f(9)=19$. In (b), put $f(x)$ into $g$: $(2x+1)^2$.'
          - problem: 'Let $f(x)=x-3$ and $g(x)=3x$. (a) Write $f(g(x))$. (b) Solve $f(g(x))=12$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"comp","contract":{"kind":"function","vars":["x"]}},{"name":"x","contract":{"kind":"exact"}}]}
            answer: 'comp = 3*x-3; x = 5'
            solution_sketch: 'Put $g(x)$ into $f$: $3x-3$. Then $3x-3=12$ gives $x=5$.'
          - problem: 'Look at the functions $x^2$, $x^3$, $|x|$, $x+1$, $\cos x$, $x\sin x$. (a) How many are even? (b) How many are odd? (c) How many are neither even nor odd?'
            answer_contract: {"kind":"multipart","parts":[{"name":"even","contract":{"kind":"exact"}},{"name":"odd","contract":{"kind":"exact"}},{"name":"neither","contract":{"kind":"exact"}}]}
            answer: 'even = 4; odd = 1; neither = 1'
            solution_sketch: 'The even functions are $x^2$, $|x|$, $\cos x$ and $x\sin x$. The odd function is $x^3$. The function $x+1$ is neither.'
          - problem: 'The function $f$ is odd with $f(2)=5$ and $f(-1)=-3$. The function $g$ is even with $g(3)=7$. (a) Find $f(-2)$. (b) Find $f(1)$. (c) Find $f(2)+f(-2)+g(-3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = -5; p2 = 3; p3 = 7'
            solution_sketch: 'For an odd function, $f(-x)=-f(x)$. So $f(-2)=-5$ and $f(1)=3$. For an even function, $g(-3)=g(3)=7$. The sum is $5-5+7=7$.'
          - problem: 'The function $f$ has period $4$ with $f(1)=3$ and $f(2)=-1$. (a) Find $f(6)$. (b) Find $f(-3)$. (c) Find $f(1001)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = -1; p2 = 3; p3 = 3'
            solution_sketch: 'A period of $4$ means $f(x+4)=f(x)$. So $f(6)=f(2)=-1$ and $f(-3)=f(1)=3$. Also $1001=1+4\cdot250$, so $f(1001)=f(1)=3$.'
          - problem: '(a) Let $f(x)=x^2+1$ and $g(x)=\sqrt x$. Solve $f(g(x))=g(f(x))$. (b) Find the smallest positive period of $\sin3x$. (c) Let $h(x)=ax^3+bx+2$ with $h(1)=5$. Find $h(-1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sol","contract":{"kind":"set"}},{"name":"period","contract":{"kind":"exact"}},{"name":"h","contract":{"kind":"exact"}}]}
            answer: 'sol = {0}; period = 2*pi/3; h = -1'
            solution_sketch: 'In (a), $f(g(x))=x+1$ for $x\ge0$ and $g(f(x))=\sqrt{x^2+1}$. Squaring $x+1=\sqrt{x^2+1}$ gives $2x=0$. In (b), the period is $2\pi/3$. In (c), $a+b=3$, and $h(-1)=-(a+b)+2=-1$.'
        constraints: 'composition of simple functions, parity of named functions and periodic values; the last item joins two ideas'
      - id: kp2
        name: 'Graph transformations and graphical solving'
        key_prerequisites: [graph-transformations-horizontal-modulus, graphical-solving-equations-inequalities]
        exemplars:
          - problem: 'The point $(2,3)$ is on the graph of $y=f(x)$. Find the matching point of the new graph. (a) For $y=f(x)+4$. (b) For $y=f(x-1)$. (c) For $y=-f(x)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"coordinates","arity":2}},{"name":"p2","contract":{"kind":"coordinates","arity":2}},{"name":"p3","contract":{"kind":"coordinates","arity":2}}]}
            answer: 'p1 = (2,7); p2 = (3,3); p3 = (2,-3)'
            solution_sketch: 'The graph of $f(x)+4$ moves up by $4$. The graph of $f(x-1)$ moves right by $1$. The graph of $-f(x)$ reflects in the $x$-axis.'
          - problem: 'The point $(4,-2)$ is on the graph of $y=f(x)$. Find the matching point of the new graph. (a) For $y=2f(x)$. (b) For $y=f(2x)$. (c) For $y=f(-x)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"coordinates","arity":2}},{"name":"p2","contract":{"kind":"coordinates","arity":2}},{"name":"p3","contract":{"kind":"coordinates","arity":2}}]}
            answer: 'p1 = (4,-4); p2 = (2,-2); p3 = (-4,-2)'
            solution_sketch: 'In (a), the ordinate doubles. In (b), $2x=4$ gives $x=2$. In (c), $-x=4$ gives $x=-4$.'
          - problem: 'The point $(4,-2)$ is on the graph of $y=f(x)$. (a) Find the matching point of the graph of $y=|f(x)|$. (b) Solve $|x-1|=3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"pt","contract":{"kind":"coordinates","arity":2}},{"name":"sol","contract":{"kind":"set"}}]}
            answer: 'pt = (4,2); sol = {-2, 4}'
            solution_sketch: 'The modulus reflects the negative ordinate up: $(4,2)$. In (b), $x-1=3$ or $x-1=-3$.'
          - problem: 'The graph of $y=x^2$ moves $3$ units to the right and $2$ units down. (a) Write the equation of the new graph. (b) Find the vertex of the new graph.'
            answer_contract: {"kind":"multipart","parts":[{"name":"eq","contract":{"kind":"function","vars":["x"]}},{"name":"vertex","contract":{"kind":"coordinates","arity":2}}]}
            answer: 'eq = (x-3)^2-2; vertex = (3,-2)'
            solution_sketch: 'Moving right by $3$ gives $(x-3)^2$. Moving down by $2$ gives $(x-3)^2-2$. The vertex moves from $(0,0)$ to $(3,-2)$.'
          - problem: '(a) Solve $|x|=x+2$. (b) Solve $|x-2|<3$. (c) The graphs of $y=x^2$ and $y=x+2$ meet at two points. Find the sum of their $x$-coordinates.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"set"}},{"name":"p2","contract":{"kind":"inequality_union"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = {-1}; p2 = -1 < x < 5; p3 = 1'
            solution_sketch: 'In (a), $x\ge0$ gives $x=x+2$, which has no root. For $x<0$ we get $-x=x+2$, so $x=-1$. In (b), $-3<x-2<3$ gives $-1<x<5$. In (c), $x^2=x+2$ has roots $2$ and $-1$, with sum $1$.'
          - problem: 'The point $(1,2)$ is on the graph of $y=f(x)$. (a) Find the matching point of the graph of $y=2f(x-3)+1$. (b) Find the matching point of the graph of $y=3-f(-x)$. (c) How many solutions does $|x^2-4|=3$ have?'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"coordinates","arity":2}},{"name":"p2","contract":{"kind":"coordinates","arity":2}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'p1 = (4,5); p2 = (-1,1); count = 4'
            solution_sketch: 'In (a), $x-3=1$ gives $x=4$, and $y=2\cdot2+1=5$. In (b), $-x=1$ gives $x=-1$, and $y=3-2=1$. In (c), $x^2-4=3$ gives $x^2=7$. Also $x^2-4=-3$ gives $x^2=1$. This is four roots.'
        constraints: 'a point of a graph moves under f(x)+a, f(x+a), -f(x), a*f(x), f(-x), f(ax) and |f(x)|; equations with a modulus'
    diagnostic_exemplar:
      problem: 'Let $f(x)=x+5$ and $g(x)=3x$. Find $f(g(2))$.'
      answer_contract: {"kind":"exact"}
      answer: '11'
      solution_sketch: 'We have $g(2)=6$ and $f(6)=11$.'
