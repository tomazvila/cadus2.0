        exemplars:
          - problem: 'A power function $f(x)=x^n$ with natural $n$ has a graph through the point $(2,32)$. (a) Find $n$. (b) Find $f(-1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"val","contract":{"kind":"exact"}}]}
            answer: 'n = 5; val = -1'
            solution_sketch: 'From $2^n=32$ we get $n=5$. The exponent is odd, so $f(-1)=(-1)^5=-1$.'
          - problem: 'The graph of $y=a x^{-2}$ passes through the point $(3,2)$. (a) Find $a$. (b) Find the value of $y$ at $x=-1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}}]}
            answer: 'a = 18; y = 18'
            solution_sketch: 'Put $x=3$: $a/9=2$, so $a=18$. At $x=-1$ we have $y=18/1=18$.'
          - problem: 'The graph of $y=a\sqrt{x}$ passes through the point $(16,12)$. (a) Find $a$. (b) Find the value of $x$ where $y=15$. (c) Find the domain of the function. Write it as an inequality in $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"x","contract":{"kind":"exact"}},{"name":"dom","contract":{"kind":"inequality_union"}}]}
            answer: 'a = 3; x = 25; dom = x >= 0'
            solution_sketch: 'Put $x=16$: $4a=12$, so $a=3$. Then $3\sqrt{x}=15$ gives $\sqrt{x}=5$ and $x=25$. A square root needs $x\ge 0$.'
          - problem: 'The graph of $y=a\cdot 2^x$ passes through the point $(3,40)$. (a) Find $a$. (b) Find the value of $y$ at $x=-1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}}]}
            answer: 'a = 5; y = 5/2'
            solution_sketch: 'Put $x=3$: $8a=40$, so $a=5$. At $x=-1$ we have $y=5\cdot\frac12=\frac52$.'
          - problem: 'The graph of $y=\log_b x$ with $b>1$ passes through the point $(81,4)$. (a) Find $b$. (b) Find the value of $x$ where $y=-2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}},{"name":"x","contract":{"kind":"exact"}}]}
            answer: 'b = 3; x = 1/9'
            solution_sketch: 'From $b^4=81$ and $b>1$ we get $b=3$. Then $\log_3 x=-2$ gives $x=3^{-2}=\frac19$.'
          - problem: 'The graph of $f(x)=a\cdot b^x$ with $b>0$ passes through the points $(1,6)$ and $(3,54)$. (a) Find $b$. (b) Find $a$. (c) Find the value of $x$ where $f(x)=162$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}},{"name":"a","contract":{"kind":"exact"}},{"name":"x","contract":{"kind":"exact"}}]}
            answer: 'b = 3; a = 2; x = 4'
            solution_sketch: 'Divide the two equations: $b^2=9$, so $b=3$. Then $3a=6$ gives $a=2$. Solve $2\cdot3^x=162$: $3^x=81$, so $x=4$.'
        constraints: 'two- or three-part items; one formula type per item (power, root, exponential or logarithmic); one graph point gives the parameter; the last part reads a value or a domain'
      - id: kp2
        name: 'Model a situation and meet point of two graphs'
        key_prerequisites: [exponential-growth-decay, graphical-solving-equations-inequalities]
        exemplars:
          - problem: 'The graphs of $y=x^2$ and $y=3x-2$ meet at two points. (a) Find the $x$-coordinates of the meet points. (b) Find the meet point with the greater $x$-coordinate.'
            answer_contract: {"kind":"multipart","parts":[{"name":"xs","contract":{"kind":"set"}},{"name":"pt","contract":{"kind":"coordinates","arity":2}}]}
            answer: 'xs = {1, 2}; pt = (2,4)'
            solution_sketch: 'Solve $x^2=3x-2$. This gives $x^2-3x+2=0$, so $x=1$ or $x=2$. For $x=2$ we have $y=4$.'
          - problem: 'The graphs of $y=\sqrt{x}$ and $y=x-2$ meet at one point. (a) Find the $x$-coordinate of the point. (b) Find the $y$-coordinate of the point.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}}]}
            answer: 'x = 4; y = 2'
            solution_sketch: 'Square $\sqrt{x}=x-2$ to get $x^2-5x+4=0$, so $x=1$ or $x=4$. For $x=1$ the right side is $-1$, so reject it. For $x=4$ both sides equal $2$.'
          - problem: 'A culture of bacteria follows $N(t)=N_0\cdot 2^{t}$, where $t$ is in hours. At $t=0$ there are $500$ bacteria. (a) Find $N(3)$. (b) Find the time $t$ when there are $8000$ bacteria.'
            answer_contract: {"kind":"multipart","parts":[{"name":"N3","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}}]}
            answer: 'N3 = 4000; t = 4'
            solution_sketch: 'We have $N_0=500$. Then $N(3)=500\cdot 8=4000$. Solve $500\cdot2^t=8000$: $2^t=16$, so $t=4$.'
          - problem: 'A tank holds $V(t)=200\cdot\left(\tfrac12\right)^{t/3}$ liters of water at time $t$ hours. (a) Find $V(6)$. (b) Find the time $t$ when $V(t)=25$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V6","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}}]}
            answer: 'V6 = 50; t = 9'
            solution_sketch: 'At $t=6$ the power is $(1/2)^2=1/4$, so $V=50$. Solve $200\cdot(1/2)^{t/3}=25$: $(1/2)^{t/3}=1/8=(1/2)^3$. So $t/3=3$ and $t=9$.'
          - problem: 'The graphs of $y=2^x$ and $y=\dfrac{8}{2^x}$ meet at one point. (a) Find the $x$-coordinate of the point. (b) Find the $y$-coordinate of the point.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}}]}
            answer: 'x = 3/2; y = 2*sqrt(2)'
            solution_sketch: 'Solve $2^x=8\cdot2^{-x}$. This gives $2^{2x}=8=2^3$, so $x=3/2$. Then $y=2^{3/2}=2\sqrt{2}$.'
          - problem: 'A population follows $P(t)=P_0\,b^t$ with $b>0$ and $t$ in years. We know $P(0)=400$ and $P(2)=900$. (a) Find $b$. (b) Find $P(3)$. (c) Find the time $t$ when $P(t)=2025$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}},{"name":"P3","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}}]}
            answer: 'b = 3/2; P3 = 1350; t = 4'
            solution_sketch: 'We have $400b^2=900$, so $b^2=9/4$ and $b=3/2$. Then $P(3)=400\cdot\frac{27}{8}=1350$. Solve $(3/2)^t=2025/400=81/16=(3/2)^4$. So $t=4$.'
        constraints: 'two- or three-part items; either two graphs meet, or a growth model has a given start value; the numbers give exact results'
    diagnostic_exemplar:
      problem: 'The power function $y=x^3$ passes through the point $(a,8)$. Find $a$.'
      answer_contract: {"kind":"exact"}
      answer: '2'
      solution_sketch: 'We have $a^3=8$, so $a=2$.'
  - id: vbe-cp10-trig-functions
    name: Trigonometric functions
    lt_term: 'Trigonometrinės funkcijos'
    area: models
    program_items: [80, 81, 82, 83, 84]
    core: false
    difficulty: 0.6
    drill: false
    answer_kind: multi-step
    expected_time_secs: 330
    prerequisites:
      - id: trig-function-properties-graphical
        weight: 0.6
        key: true
      - id: sine-cosine-parent-graphs
        weight: 0.4
        key: false
      - id: trig-graphs-basic
        weight: 0.4
        key: false
      - id: tangent-reciprocal-graphs
        weight: 0.4
        key: false
      - id: trig-graphs-midline
        weight: 0.4
        key: false
      - id: sinusoid-phase-shift
        weight: 0.4
        key: false
      - id: basic-trig-equations
        weight: 0.4
        key: false
      - id: graphing-systems
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Properties and graph of y=a*f(kx+b)+c'
        key_prerequisites: [trig-function-properties-graphical, trig-graphs-midline, sinusoid-phase-shift]
        exemplars:
          - problem: 'Consider $y=2\sin x+1$. (a) Find the greatest value of $y$. (b) Find the least value of $y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"max","contract":{"kind":"exact"}},{"name":"min","contract":{"kind":"exact"}}]}
            answer: 'max = 3; min = -1'
            solution_sketch: 'The sine takes values from $-1$ to $1$. So $y$ runs from $-2+1=-1$ to $2+1=3$.'
          - problem: 'Consider $y=3\cos 2x$. (a) Find the least positive period of $y$. (b) Find the greatest value of $y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"T","contract":{"kind":"exact"}},{"name":"max","contract":{"kind":"exact"}}]}
            answer: 'T = pi; max = 3'
            solution_sketch: 'The period of $\cos kx$ is $2\pi/k$. Here $k=2$, so $T=\pi$. The greatest value is $3\cdot1=3$.'
          - problem: 'Let $f(x)=\cos\left(x-\dfrac{\pi}{3}\right)$. (a) Find $f\left(\dfrac{\pi}{3}\right)$. (b) Find $f\left(\dfrac{5\pi}{6}\right)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = 0'
            solution_sketch: 'At $x=\pi/3$ the argument is $0$, and $\cos 0=1$. At $x=5\pi/6$ the argument is $\pi/2$, and $\cos(\pi/2)=0$.'
          - problem: 'Consider $y=-2\cos\dfrac{x}{2}+1$. (a) Find the least positive period of $y$. (b) Find the greatest value of $y$. (c) Find the least value of $y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"T","contract":{"kind":"exact"}},{"name":"max","contract":{"kind":"exact"}},{"name":"min","contract":{"kind":"exact"}}]}
            answer: 'T = 4*pi; max = 3; min = -1'
            solution_sketch: 'Here $k=1/2$, so $T=2\pi/(1/2)=4\pi$. The cosine runs from $-1$ to $1$. So $-2\cos(x/2)$ runs from $-2$ to $2$, and $y$ runs from $-1$ to $3$.'
          - problem: 'Consider $y=\tan 2x$. (a) Find the least positive period of $y$. (b) Find the zeros of $y$ in the interval $[0,\pi)$. (c) Find the $x$-values in $(0,\pi)$ where $y$ is not defined.'
            answer_contract: {"kind":"multipart","parts":[{"name":"T","contract":{"kind":"exact"}},{"name":"zeros","contract":{"kind":"set"}},{"name":"asym","contract":{"kind":"set"}}]}
            answer: 'T = pi/2; zeros = {0, pi/2}; asym = {pi/4, 3*pi/4}'
            solution_sketch: 'The period of $\tan kx$ is $\pi/k$, so $T=\pi/2$. We have $\tan 2x=0$ when $2x=0,\pi$, so $x=0,\pi/2$. The tangent is not defined when $2x=\pi/2,3\pi/2$, so $x=\pi/4,3\pi/4$.'
          - problem: 'Let $f(x)=4\sin(3x-\pi)+2$. (a) Find the least positive period of $f$. (b) Find the greatest value of $f$. (c) Find the least positive $x$ where $f$ takes its greatest value.'
            answer_contract: {"kind":"multipart","parts":[{"name":"T","contract":{"kind":"exact"}},{"name":"max","contract":{"kind":"exact"}},{"name":"x","contract":{"kind":"exact"}}]}
            answer: 'T = 2*pi/3; max = 6; x = pi/2'
            solution_sketch: 'The period is $2\pi/3$. The greatest value is $4+2=6$. It needs $3x-\pi=\pi/2+2\pi k$, so $x=\pi/2+2\pi k/3$. The least positive value is $x=\pi/2$, because $k=-1$ gives a negative $x$.'
        constraints: 'two- or three-part items; y=a*f(kx+b)+c with f sine, cosine or tangent; asked: period, extreme values, zeros, values at given points'
      - id: kp2
        name: 'Graphical solving of trigonometric equations'
        key_prerequisites: [basic-trig-equations, trig-function-properties-graphical]
        exemplars:
          - problem: '(a) Solve $2\sin x=1$ on $[0,2\pi]$. (b) How many solutions has $\sin x=-1$ on $[0,4\pi]$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"sols","contract":{"kind":"set"}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'sols = {pi/6, 5*pi/6}; count = 2'
            solution_sketch: 'We have $\sin x=1/2$, so $x=\pi/6$ or $x=5\pi/6$. The sine equals $-1$ at $x=3\pi/2$ and at $x=7\pi/2$ on $[0,4\pi]$. That gives $2$ solutions.'
          - problem: '(a) Solve $\cos x=\dfrac12$ on $[-\pi,\pi]$. (b) Solve $\cos x>\dfrac12$ on $[-\pi,\pi]$. Write the answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sols","contract":{"kind":"set"}},{"name":"ineq","contract":{"kind":"inequality_union"}}]}
            answer: 'sols = {-pi/3, pi/3}; ineq = -pi/3 < x < pi/3'
            solution_sketch: 'The cosine equals $1/2$ at $x=\pm\pi/3$. On $[-\pi,\pi]$ the graph of the cosine is above $1/2$ between these two points.'
          - problem: '(a) Solve $\sin x=-\dfrac{\sqrt3}{2}$ on $[0,2\pi]$. (b) Solve $\sin x\le-\dfrac{\sqrt3}{2}$ on $[0,2\pi]$. Write the answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sols","contract":{"kind":"set"}},{"name":"ineq","contract":{"kind":"inequality_union"}}]}
            answer: 'sols = {4*pi/3, 5*pi/3}; ineq = 4*pi/3 <= x <= 5*pi/3'
            solution_sketch: 'The sine equals $-\sqrt3/2$ at $x=4\pi/3$ and $x=5\pi/3$. Between these points the sine is at most $-\sqrt3/2$.'
          - problem: '(a) Solve $\tan x=1$ on $[0,2\pi]$. (b) Solve $\tan x>1$ on $\left(0,\dfrac{\pi}{2}\right)$. Write the answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sols","contract":{"kind":"set"}},{"name":"ineq","contract":{"kind":"inequality_union"}}]}
            answer: 'sols = {pi/4, 5*pi/4}; ineq = pi/4 < x < pi/2'
            solution_sketch: 'The tangent equals $1$ at $x=\pi/4$ and $x=5\pi/4$. On $(0,\pi/2)$ the tangent grows, so $\tan x>1$ for $x>\pi/4$.'
          - problem: '(a) Solve $2\sin 2x=\sqrt2$ on $[0,\pi]$. (b) Solve $2\sin 2x>\sqrt2$ on $[0,\pi]$. Write the answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sols","contract":{"kind":"set"}},{"name":"ineq","contract":{"kind":"inequality_union"}}]}
            answer: 'sols = {pi/8, 3*pi/8}; ineq = pi/8 < x < 3*pi/8'
            solution_sketch: 'We have $\sin 2x=\sqrt2/2$, so $2x=\pi/4$ or $2x=3\pi/4$. Then $x=\pi/8$ or $x=3\pi/8$. The sine is above $\sqrt2/2$ between these two points.'
          - problem: 'Let $f(x)=2\cos x-1$ on $[0,2\pi]$. (a) Find the zeros of $f$. (b) Solve $f(x)<0$. Write the answer as an inequality. (c) Find the greatest value of $f$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"zeros","contract":{"kind":"set"}},{"name":"neg","contract":{"kind":"inequality_union"}},{"name":"max","contract":{"kind":"exact"}}]}
            answer: 'zeros = {pi/3, 5*pi/3}; neg = pi/3 < x < 5*pi/3; max = 1'
            solution_sketch: 'The zeros need $\cos x=1/2$, so $x=\pi/3$ or $5\pi/3$. We have $f(x)<0$ when $\cos x<1/2$, which holds between the zeros. The greatest value is $2\cdot1-1=1$.'
        constraints: 'two- or three-part items; a trigonometric equation on a stated interval, then the matching inequality; standard angles only'
    diagnostic_exemplar:
      problem: 'Find the greatest value of $y=3\sin x-1$.'
      answer_contract: {"kind":"exact"}
      answer: '2'
      solution_sketch: 'The greatest sine is $1$. So $3\cdot1-1=2$.'
