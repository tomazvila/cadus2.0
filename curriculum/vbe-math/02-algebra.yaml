      - id: basic-absolute-value-inequalities
        weight: 0.4
        key: false
      - id: absolute-value-equations
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Rational and modulus inequalities with the interval method'
        key_prerequisites: [rational-inequalities, polynomial-inequalities, modulus-equations-inequalities]
        exemplars:
          - problem: '(a) Solve $(x-1)(x+3)<0$. (b) Solve $(x-1)(x+3)\ge0$. Write each answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = -3 < x < 1; b = x <= -3 or x >= 1'
            solution_sketch: 'The zeros are $-3$ and $1$. The product is negative between them and not negative outside them.'
          - problem: '(a) Solve $\dfrac{x-2}{x+1}>0$. (b) Solve $\dfrac{x-2}{x+1}\le0$. Write each answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = x < -1 or x > 2; b = -1 < x <= 2'
            solution_sketch: 'The fraction changes sign at $x=2$ and $x=-1$. It is positive outside $[-1,2]$. At $x=2$ it is zero, and $x=-1$ is not allowed.'
          - problem: '(a) Solve $\dfrac{2x-1}{x-3}\ge1$. Write the answer as an inequality. (b) How many integers $x$ satisfy $\dfrac{x+2}{x-3}<0$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'a = x <= -2 or x > 3; count = 4'
            solution_sketch: '(a) Move $1$ to the left: $\frac{x+2}{x-3}\ge0$. This holds for $x\le-2$ or $x>3$. (b) The fraction is negative for $-2<x<3$. The integers are $-1,0,1,2$.'
          - problem: '(a) Solve $|x-2|<3$. (b) Solve $|2x+1|\ge5$. Write each answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = -1 < x < 5; b = x <= -3 or x >= 2'
            solution_sketch: '(a) We have $-3<x-2<3$, so $-1<x<5$. (b) Either $2x+1\ge5$, so $x\ge2$, or $2x+1\le-5$, so $x\le-3$.'
          - problem: '(a) Solve $x(x-2)(x+3)>0$. (b) Solve $x(x-2)(x+3)\le0$. Write each answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = -3 < x < 0 or x > 2; b = x <= -3 or 0 <= x <= 2'
            solution_sketch: 'The zeros are $-3$, $0$ and $2$. The product is positive for $x>2$, negative on $(0,2)$, positive on $(-3,0)$ and negative for $x<-3$.'
          - problem: '(a) Solve $\dfrac{2}{x-1}\ge\dfrac{1}{x+2}$. (b) Solve $|x^2-1|<15$. (c) How many integers satisfy both of the first two inequalities? Write the answers to the first two parts as inequalities.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'a = -5 <= x < -2 or x > 1; b = -4 < x < 4; count = 3'
            solution_sketch: '(a) Move to one side: $\frac{x+5}{(x-1)(x+2)}\ge0$. The zeros and the poles are $-5,-2,1$. (b) We have $x^2<16$, so $-4<x<4$. (c) Both hold for $-4<x<-2$ or $1<x<4$. The integers are $-3$, $2$ and $3$.'
        constraints: 'two- or three-part items; the interval method on a product or a fraction, or a modulus; the answer is an inequality'
      - id: kp2
        name: 'Logarithmic and exponential inequalities with the domain'
        key_prerequisites: [exponential-inequalities, logarithmic-inequalities]
        exemplars:
          - problem: '(a) Solve $2^x<16$. (b) Solve $\left(\tfrac12\right)^x>4$. Write each answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = x < 4; b = x < -2'
            solution_sketch: '(a) We have $2^x<2^4$, so $x<4$. (b) We have $2^{-x}>2^2$, so $-x>2$ and $x<-2$.'
          - problem: '(a) Solve $3^{2x-1}\ge27$. (b) Solve $5^x\le\dfrac1{25}$. Write each answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = x >= 2; b = x <= -2'
            solution_sketch: '(a) We have $2x-1\ge3$, so $x\ge2$. (b) We have $5^x\le5^{-2}$, so $x\le-2$.'
          - problem: '(a) Solve $\log_2(x-1)<3$. (b) Solve $\log_2(x-1)\ge3$. Write each answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = 1 < x < 9; b = x >= 9'
            solution_sketch: 'The domain is $x>1$. The base is greater than $1$, so $x-1<8$ in (a) and $x-1\ge8$ in (b). This gives $1<x<9$ and $x\ge9$.'
          - problem: '(a) Solve $\log_3(2x-4)>2$. (b) Solve $\log_{1/2}(x+1)>-2$. Write each answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = x > 13/2; b = -1 < x < 3'
            solution_sketch: '(a) We have $2x-4>9$, so $x>13/2$. The domain $x>2$ holds. (b) The base is less than $1$, so $x+1<(1/2)^{-2}=4$. With the domain $x>-1$ this gives $-1<x<3$.'
          - problem: '(a) Solve $\log_2 x+\log_2(x-2)<3$. (b) Solve $\log_{1/3}x\ge-1$. Write each answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = 2 < x < 4; b = 0 < x <= 3'
            solution_sketch: '(a) The domain is $x>2$. The inequality becomes $x(x-2)<8$, so $-2<x<4$. With the domain, $2<x<4$. (b) The base is less than $1$, so $x\le(1/3)^{-1}=3$. With the domain $x>0$ this gives $0<x\le3$.'
          - problem: '(a) Solve $4^x-5\cdot2^x+4<0$. (b) Solve $\log_{1/2}(x^2-4)\ge-5$. (c) How many integers satisfy the second inequality? Write the answers to the first two parts as inequalities.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'a = 0 < x < 2; b = -6 <= x < -2 or 2 < x <= 6; count = 8'
            solution_sketch: '(a) Put $t=2^x$: $t^2-5t+4<0$, so $1<t<4$ and $0<x<2$. (b) The domain is $x^2>4$. The base is less than $1$, so $x^2-4\le32$ and $x^2\le36$. This gives the two intervals. (c) The integers are $-6,-5,-4,-3$ and $3,4,5,6$.'
        constraints: 'two- or three-part items; base above or below 1; the domain of the logarithm limits the answer'
      - id: kp3
        name: 'Systems of inequalities and mixed systems'
        key_prerequisites: [rational-inequality-systems-mixed, systems-of-linear-inequalities]
        exemplars:
          - problem: '(a) Find all $x$ with $x^2-x-6<0$ and $x>0$. (b) Find all $x$ with $2x-1>3$ and $x-5\le0$. Write each answer as an inequality.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = 0 < x < 3; b = 2 < x <= 5'
            solution_sketch: '(a) The first inequality gives $-2<x<3$. With $x>0$ the answer is $0<x<3$. (b) The first gives $x>2$ and the second gives $x\le5$.'
          - problem: '(a) Find all $x$ with $x^2-5x+6\ge0$ and $x<4$. Write the answer as an inequality. (b) How many integers satisfy both $x^2-9<0$ and $x>-1$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'a = x <= 2 or 3 <= x < 4; count = 3'
            solution_sketch: '(a) The first gives $x\le2$ or $x\ge3$. Together with $x<4$ we get $x\le2$ or $3\le x<4$. (b) Both conditions give $-1<x<3$. The integers are $0,1,2$.'
