        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Irrational equation with the root check'
        key_prerequisites: [irrational-equations-extended, radical-equations-basic]
        exemplars:
          - problem: 'Consider the equation $\sqrt{x+6}=x$. (a) Square both sides and solve the new equation. (b) Find the solution of the original equation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"squared","contract":{"kind":"set"}},{"name":"orig","contract":{"kind":"exact"}}]}
            answer: 'squared = {-2, 3}; orig = 3'
            solution_sketch: 'Squaring gives $x+6=x^2$, so $x^2-x-6=0$ and $x=-2$ or $x=3$. For $x=-2$ the left side is $2$ and the right side is $-2$, so reject it. For $x=3$ both sides equal $3$.'
          - problem: 'Consider the equation $\sqrt{2x+3}=x$. (a) Square both sides and solve the new equation. (b) Find the solution of the original equation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"squared","contract":{"kind":"set"}},{"name":"orig","contract":{"kind":"exact"}}]}
            answer: 'squared = {-1, 3}; orig = 3'
            solution_sketch: 'Squaring gives $x^2-2x-3=0$, so $x=-1$ or $x=3$. For $x=-1$ the left side is $1$ and the right side is $-1$, so reject it. For $x=3$ both sides equal $3$.'
          - problem: 'Consider the equation $\sqrt{3x+1}=x-1$. (a) Square both sides and solve the new equation. (b) Find the solution of the original equation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"squared","contract":{"kind":"set"}},{"name":"orig","contract":{"kind":"exact"}}]}
            answer: 'squared = {0, 5}; orig = 5'
            solution_sketch: 'Squaring gives $3x+1=x^2-2x+1$, so $x^2-5x=0$ and $x=0$ or $x=5$. For $x=0$ the left side is $1$ and the right side is $-1$, so reject it. For $x=5$ both sides equal $4$.'
          - problem: 'Consider the equation $\sqrt{x+5}=x-1$. (a) Find the domain of the left side. Write it as an inequality in $x$. (b) Find the solution of the equation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"dom","contract":{"kind":"inequality_union"}},{"name":"sol","contract":{"kind":"exact"}}]}
            answer: 'dom = x >= -5; sol = 4'
            solution_sketch: 'The root needs $x+5\ge0$, so $x\ge-5$. Squaring gives $x^2-3x-4=0$, so $x=4$ or $x=-1$. For $x=-1$ the right side is $-2$, so reject it. For $x=4$ both sides equal $3$.'
          - problem: 'Consider the equation $\sqrt{x+7}-\sqrt{x}=1$. (a) Find the solution $x$. (b) Find the value of $\sqrt{x+7}\cdot\sqrt{x}$ at this solution.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"prod","contract":{"kind":"exact"}}]}
            answer: 'x = 9; prod = 12'
            solution_sketch: 'Write $\sqrt{x+7}=\sqrt{x}+1$ and square: $x+7=x+2\sqrt{x}+1$. So $\sqrt{x}=3$ and $x=9$. Then $\sqrt{16}\cdot\sqrt{9}=4\cdot3=12$.'
          - problem: '(a) Solve $\sqrt[3]{5x-2}=-3$. (b) Solve $\sqrt[4]{x+1}=2$. (c) Solve $\sqrt{x+3}=x-3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -5; b = 15; c = 6'
            solution_sketch: '(a) Cube both sides: $5x-2=-27$, so $x=-5$. (b) Raise to the fourth power: $x+1=16$, so $x=15$. (c) Squaring gives $x^2-7x+6=0$, so $x=1$ or $x=6$. For $x=1$ the right side is $-2$, so reject it. The solution is $6$.'
        constraints: 'two- or three-part items; a root equation solved by squaring; the first part shows the squared roots, the last part removes the extraneous root'
      - id: kp2
        name: 'Exponential and logarithmic equations by substitution'
        key_prerequisites: [exp-log-equations-new-unknown-base, exponential-equations-same-base, logarithmic-equations]
        exemplars:
          - problem: '(a) Solve $2^{x+1}=32$. (b) Solve $9^x=27$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 4; b = 3/2'
            solution_sketch: '(a) We have $2^{x+1}=2^5$, so $x=4$. (b) We have $3^{2x}=3^3$, so $2x=3$ and $x=3/2$.'
          - problem: 'Consider $4^x-6\cdot2^x+8=0$. (a) Put $t=2^x$ and find the values of $t$. (b) Find the values of $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"t","contract":{"kind":"set"}},{"name":"x","contract":{"kind":"set"}}]}
            answer: 't = {2, 4}; x = {1, 2}'
            solution_sketch: 'The equation becomes $t^2-6t+8=0$, so $t=2$ or $t=4$. Both are positive. From $2^x=2$ and $2^x=4$ we get $x=1$ and $x=2$.'
          - problem: '(a) Solve $\log_3(x+2)=\log_3(2x-1)$. (b) Solve $\log_2(x-1)=3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 9'
            solution_sketch: '(a) Set the arguments equal: $x+2=2x-1$, so $x=3$. Both arguments equal $5$. (b) We have $x-1=2^3=8$, so $x=9$.'
          - problem: 'Consider $2^{2x}-5\cdot2^x-24=0$. (a) Put $t=2^x$. Find the roots of the quadratic equation in $t$. (b) Find the solution $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"t","contract":{"kind":"set"}},{"name":"x","contract":{"kind":"exact"}}]}
            answer: 't = {-3, 8}; x = 3'
            solution_sketch: 'The equation becomes $t^2-5t-24=0$, so $t=8$ or $t=-3$. A power of $2$ is positive, so reject $t=-3$. From $2^x=8$ we get $x=3$.'
          - problem: 'Consider $(\log_2 x)^2-3\log_2 x+2=0$. (a) Put $u=\log_2 x$ and find the values of $u$. (b) Find the values of $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"u","contract":{"kind":"set"}},{"name":"x","contract":{"kind":"set"}}]}
            answer: 'u = {1, 2}; x = {2, 4}'
            solution_sketch: 'The equation becomes $u^2-3u+2=0$, so $u=1$ or $u=2$. Then $x=2^1=2$ or $x=2^2=4$.'
          - problem: '(a) Solve $\log_x 49=2$ with $x>0$ and $x\ne1$. (b) Write $\log_2 x+\log_2(x-2)=3$ as a quadratic equation in $x$. Give its roots. (c) Give the solution of the logarithmic equation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"quad","contract":{"kind":"set"}},{"name":"sol","contract":{"kind":"exact"}}]}
            answer: 'a = 7; quad = {-2, 4}; sol = 4'
            solution_sketch: '(a) We have $x^2=49$ and $x>0$, so $x=7$. (b) The equation gives $x(x-2)=8$, so $x^2-2x-8=0$ and $x=-2$ or $x=4$. The domain needs $x>2$, so only $x=4$ stays.'
        constraints: 'two- or three-part items; common base or a substitution t=a^x or u=log x; the domain removes a root'
      - id: kp3
        name: 'Higher-degree and biquadratic equations in a multi-part item'
        key_prerequisites: [biquadratic-equations, zero-product-property, rational-root-theorem]
        exemplars:
          - problem: 'Consider $(x-1)(x+2)(2x-3)=0$. (a) Find all solutions. (b) Find the sum of the solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sols","contract":{"kind":"set"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'sols = {-2, 1, 3/2}; sum = 1/2'
            solution_sketch: 'Set each factor to zero: $x=1$, $x=-2$ or $x=3/2$. The sum is $-2+1+\frac32=\frac12$.'
          - problem: '(a) Solve $x^3-4x=0$. (b) Solve $x^3-x^2-4x+4=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"set"}},{"name":"b","contract":{"kind":"set"}}]}
            answer: 'a = {-2, 0, 2}; b = {-2, 1, 2}'
            solution_sketch: '(a) We have $x(x-2)(x+2)=0$. (b) Group the terms: $x^2(x-1)-4(x-1)=(x-1)(x-2)(x+2)$.'
          - problem: 'Consider $x^4-5x^2+4=0$. (a) Put $t=x^2$ and find the values of $t$. (b) Find all real solutions $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"t","contract":{"kind":"set"}},{"name":"x","contract":{"kind":"set"}}]}
            answer: 't = {1, 4}; x = {-2, -1, 1, 2}'
            solution_sketch: 'The equation becomes $t^2-5t+4=0$, so $t=1$ or $t=4$. Then $x=\pm1$ or $x=\pm2$.'
          - problem: 'Consider $x^4+x^2-6=0$. (a) Put $t=x^2$. Find the roots of the quadratic equation in $t$. (b) Find all real solutions $x$. (c) Find the sum of the squares of the real solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"t","contract":{"kind":"set"}},{"name":"x","contract":{"kind":"set"}},{"name":"sq","contract":{"kind":"exact"}}]}
            answer: 't = {-3, 2}; x = {-sqrt(2), sqrt(2)}; sq = 4'
            solution_sketch: 'The equation becomes $t^2+t-6=0$, so $t=2$ or $t=-3$. A square is not negative, so only $t=2$ stays. Then $x=\pm\sqrt2$, and the squares add to $2+2=4$.'
          - problem: 'The number $2$ is a root of $P(x)=x^3-3x^2-4x+12$. (a) Find $P(2)$. (b) Find all real roots of $P$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"val","contract":{"kind":"exact"}},{"name":"roots","contract":{"kind":"set"}}]}
            answer: 'val = 0; roots = {-2, 2, 3}'
            solution_sketch: 'We have $P(2)=8-12-8+12=0$. Divide by $x-2$: $P(x)=(x-2)(x^2-x-6)=(x-2)(x-3)(x+2)$.'
          - problem: '(a) Find all real solutions of $x^4-10x^2+9=0$. (b) How many real solutions has $x^4+2x^2+5=0$? (c) Find the value of $k$ for which $x^4-5x^2+k=0$ has exactly three different real solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"set"}},{"name":"b","contract":{"kind":"exact"}},{"name":"k","contract":{"kind":"exact"}}]}
            answer: 'a = {-3, -1, 1, 3}; b = 0; k = 0'
            solution_sketch: '(a) Put $t=x^2$: $t^2-10t+9=0$, so $t=1$ or $t=9$ and $x=\pm1,\pm3$. (b) The left side is at least $5$, so there is no solution. (c) We need $t=0$ as one root, so $k=0$. Then $x^2(x^2-5)=0$ gives $x=0,\pm\sqrt5$.'
        constraints: 'two- or three-part items; factored form, grouping, a known root, or x^4 with t=x^2; integer or simple radical roots'
    diagnostic_exemplar:
      problem: 'Solve $\sqrt{x+2}=3$.'
      answer_contract: {"kind":"exact"}
      answer: '7'
      solution_sketch: 'Square both sides: $x+2=9$, so $x=7$.'
  - id: vbe-cp12-moduli-systems
    name: Equations with moduli and systems of equations
    lt_term: 'Lygtys su moduliais; lygčių sistemos'
    area: models
    program_items: [96, 97, 98, 99]
    core: false
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 360
    prerequisites:
      - id: modulus-equations-inequalities
        weight: 0.6
        key: true
      - id: multi-unknown-systems
        weight: 0.4
        key: false
      - id: absolute-value-equations
        weight: 0.4
        key: false
      - id: proof-by-cases
        weight: 0.4
        key: false
      - id: solutions-of-two-variable-equations
        weight: 0.4
        key: false
      - id: equations-of-circles
        weight: 0.4
        key: false
      - id: solution-sets-free-variables
        weight: 0.4
        key: false
      - id: row-reduction-echelon-forms
        weight: 0.4
        key: false
      - id: back-substitution-triangular-systems
        weight: 0.4
        key: false
      - id: linear-systems-applications
        weight: 0.4
        key: false
      - id: systems-word-problems
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Equation with a modulus and the case check'
        key_prerequisites: [modulus-equations-inequalities, absolute-value-equations]
        exemplars:
          - problem: '(a) Solve $|x-3|=5$. (b) Solve $|2x+1|=7$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"set"}},{"name":"b","contract":{"kind":"set"}}]}
            answer: 'a = {-2, 8}; b = {-4, 3}'
            solution_sketch: '(a) We have $x-3=5$ or $x-3=-5$, so $x=8$ or $x=-2$. (b) We have $2x+1=7$ or $2x+1=-7$, so $x=3$ or $x=-4$.'
          - problem: 'Consider $|x-1|=2x-5$. (a) Solve the equation for the case $x\ge1$ and the equation for the case $x<1$. Give both numbers you find. (b) Find the solution of the original equation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"cand","contract":{"kind":"set"}},{"name":"sol","contract":{"kind":"exact"}}]}
            answer: 'cand = {2, 4}; sol = 4'
            solution_sketch: 'For $x\ge1$ we have $x-1=2x-5$, so $x=4$. For $x<1$ we have $1-x=2x-5$, so $x=2$. The value $2$ is not less than $1$, and the right side is negative there, so reject it. The value $4$ gives $3=3$.'
          - problem: 'Consider $|2x-1|=x+4$. (a) Find all solutions. (b) Find the sum of the solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sols","contract":{"kind":"set"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'sols = {-1, 5}; sum = 4'
            solution_sketch: 'For $2x-1\ge0$ we have $2x-1=x+4$, so $x=5$. For $2x-1<0$ we have $1-2x=x+4$, so $x=-1$. Both values satisfy the case condition. The sum is $4$.'
          - problem: 'Consider $|x^2-4|=3$. (a) Find all solutions. (b) How many solutions are there?'
            answer_contract: {"kind":"multipart","parts":[{"name":"sols","contract":{"kind":"set"}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'sols = {-sqrt(7), -1, 1, sqrt(7)}; count = 4'
            solution_sketch: 'Either $x^2-4=3$ or $x^2-4=-3$. The first gives $x=\pm\sqrt7$. The second gives $x=\pm1$. That is $4$ solutions.'
          - problem: '(a) Solve $|x-1|+|x-4|=5$. (b) Find the least value of $|x-1|+|x-4|$. (c) How many solutions has $|x-1|+|x-4|=2$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"sols","contract":{"kind":"set"}},{"name":"min","contract":{"kind":"exact"}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'sols = {0, 5}; min = 3; count = 0'
            solution_sketch: 'For $x\le1$ the equation is $5-2x=5$, so $x=0$. For $1\le x\le4$ the left side is $3$, so there is no solution. For $x\ge4$ it is $2x-5=5$, so $x=5$. The sum of distances is at least $3$, so the value $2$ never occurs.'
          - problem: '(a) Solve $|x+1|=|2x-3|$. (b) Find the value of $a$ for which $|x-2|=a$ has exactly one solution. (c) Solve $\big||x|-2\big|=1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"s","contract":{"kind":"set"}},{"name":"val","contract":{"kind":"exact"}},{"name":"c3","contract":{"kind":"set"}}]}
            answer: 's = {2/3, 4}; val = 0; c3 = {-3, -1, 1, 3}'
            solution_sketch: '(a) Either $x+1=2x-3$, so $x=4$, or $x+1=-2x+3$, so $x=2/3$. (b) For $a>0$ there are two solutions, so $a=0$. (c) Then $|x|-2=\pm1$, so $|x|=3$ or $|x|=1$.'
        constraints: 'two- or three-part items; |f|=a, |f|=g or a sum of two moduli; the case check removes a candidate'
      - id: kp2
        name: 'System with three unknowns or a mixed system, and its word problem'
        key_prerequisites: [multi-unknown-systems, systems-word-problems]
        exemplars:
          - problem: 'Solve $x+y+z=6$, $x-y=-1$, $y-z=-1$ together. (a) Find $x$. (b) Find $y$. (c) Find $z$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}},{"name":"z","contract":{"kind":"exact"}}]}
            answer: 'x = 1; y = 2; z = 3'
            solution_sketch: 'The second and third equations give $x=y-1$ and $z=y+1$. Put these in the first equation: $3y=6$, so $y=2$. Then $x=1$ and $z=3$.'
          - problem: 'Solve $x+y+z=9$, $2x-y=1$, $y+z=7$ together. (a) Find $x$. (b) Find $y$. (c) Find $z$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}},{"name":"z","contract":{"kind":"exact"}}]}
            answer: 'x = 2; y = 3; z = 4'
            solution_sketch: 'Replace $y+z$ by $7$ in the first equation: $x=2$. Then $2\cdot2-y=1$ gives $y=3$. Then $z=7-3=4$.'
          - problem: 'Solve $x^2+y^2=25$ and $x+y=7$ together. (a) Find the value of $xy$. (b) Find the greater value of $x$ among the solutions. (c) Find the value of $y$ for this $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"x","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}}]}
            answer: 'p = 12; x = 4; y = 3'
            solution_sketch: 'We have $(x+y)^2=49$, so $2xy=49-25=24$ and $xy=12$. The numbers $x$ and $y$ are roots of $t^2-7t+12=0$, so they are $3$ and $4$. The greater $x$ is $4$, and then $y=3$.'
          - problem: 'The line $y=x+2$ meets the parabola $y=x^2$. (a) Find the $x$-coordinates of the meet points. (b) Find the meet point with the greater $x$-coordinate.'
            answer_contract: {"kind":"multipart","parts":[{"name":"xs","contract":{"kind":"set"}},{"name":"pt","contract":{"kind":"coordinates","arity":2}}]}
            answer: 'xs = {-1, 2}; pt = (2,4)'
            solution_sketch: 'Solve $x^2=x+2$. This gives $x^2-x-2=0$, so $x=-1$ or $x=2$. For $x=2$ we have $y=4$.'
          - problem: 'A shop sells pens, notebooks and folders. The price of $2$ pens, $1$ notebook and $1$ folder is $7$ euros. The price of $1$ pen, $2$ notebooks and $1$ folder is $8$ euros. The price of $1$ pen, $1$ notebook and $2$ folders is $9$ euros. (a) Find the price of a pen in euros. (b) Find the price of a notebook in euros. (c) Find the price of a folder in euros.'
            answer_contract: {"kind":"multipart","parts":[{"name":"pen","contract":{"kind":"exact"}},{"name":"note","contract":{"kind":"exact"}},{"name":"folder","contract":{"kind":"exact"}}]}
            answer: 'pen = 1; note = 2; folder = 3'
            solution_sketch: 'Add the three equations: $4(p+n+f)=24$, so $p+n+f=6$. The first equation minus this sum gives $p=1$. In the same way $n=8-6=2$ and $f=9-6=3$.'
          - problem: 'A rectangle has perimeter $34$ and diagonal $13$. All lengths are in centimeters. (a) Find the area of the rectangle as a number. (b) Find the length of the shorter side. (c) Find the length of the longer side.'
            answer_contract: {"kind":"multipart","parts":[{"name":"area","contract":{"kind":"exact"}},{"name":"short","contract":{"kind":"exact"}},{"name":"long","contract":{"kind":"exact"}}]}
            answer: 'area = 60; short = 5; long = 12'
            solution_sketch: 'We have $a+b=17$ and $a^2+b^2=169$. Then $2ab=289-169=120$, so $ab=60$. The numbers $a$ and $b$ are roots of $t^2-17t+60=0$, so they are $5$ and $12$.'
        constraints: 'three-part items; three unknowns with integer solutions, a line and a parabola, or a word problem that gives such a system'
    diagnostic_exemplar:
      problem: 'Find all $x$ with $|2x-3|=9$.'
      answer_contract: {"kind":"set"}
      answer: '{-3, 6}'
      solution_sketch: 'We have $2x-3=9$ or $2x-3=-9$. So $x=6$ or $x=-3$.'
  - id: vbe-cp13-inequalities
    name: Rational, exponential, logarithmic and modulus inequalities
    lt_term: 'Nelygybės'
