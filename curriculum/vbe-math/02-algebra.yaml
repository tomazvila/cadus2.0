    core: false
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 360
    prerequisites:
      - id: rational-inequality-systems-mixed
        weight: 0.6
        key: true
      - id: exponential-inequalities
        weight: 0.4
        key: false
      - id: logarithmic-inequalities
        weight: 0.4
        key: false
      - id: modulus-equations-inequalities
        weight: 0.4
        key: false
      - id: polynomial-inequalities
        weight: 0.4
