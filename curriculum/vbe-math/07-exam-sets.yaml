    knowledge_points:
      - id: kp1
        name: 'Short answers'
        key_prerequisites: [vbe-cp03-powers, vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp13-inequalities]
        exemplars:
          - problem: 'Find the exponent $k$ for which $8^{2/3} \cdot 2^{k} = 2^{7}$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'We have $8^{2/3} = (2^3)^{2/3} = 2^2$. So $2^{2+k} = 2^7$ and $k = 5$.'
            points: 1
          - problem: 'Simplify $\dfrac{10}{\sqrt{6}-1}$ so that the denominator has no root.'
            answer_contract: {"kind":"exact"}
            answer: '2*sqrt(6)+2'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{6}+1$. The bottom becomes $6-1=5$. The result is $2(\sqrt{6}+1)$.'
            points: 1
          - problem: 'Simplify $\tan(x+2\pi) - \tan(-x)$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '2*tan(x)'
            solution_sketch: 'The tangent has period $\pi$, so $\tan(x+2\pi) = \tan x$. The tangent is odd, so $\tan(-x) = -\tan x$. The difference is $2\tan x$.'
            points: 1
          - problem: 'Solve $\log_3(2x-1) < \log_3(x+4)$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '1/2 < x < 5'
            solution_sketch: 'The domain needs $2x-1>0$, so $x>\tfrac12$. The base is greater than $1$, so $2x-1<x+4$ and $x<5$. The solution is $\tfrac12<x<5$.'
            points: 1
          - problem: 'Find the intersection of the set $\{-\sqrt{9}, \sqrt{5}, 0.25, \pi, \tfrac23, \sqrt{16}, \sqrt{2}+1\}$ with the set of irrational numbers.'
            answer_contract: {"kind":"set"}
            answer: '{sqrt(5), pi, sqrt(2)+1}'
            solution_sketch: 'We have $\sqrt{9}=3$ and $\sqrt{16}=4$, so these are rational. The numbers $0.25$ and $\tfrac23$ are rational. The other three are irrational.'
            points: 1
          - problem: 'A point $P$ of the unit circle lies in the third quadrant. Its abscissa is $-\tfrac35$. The radius to $P$ makes the angle $\alpha$ with the positive $Ox$ axis. Find $\sin\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '-4/5'
            solution_sketch: 'The ordinate $y$ satisfies $y^2 = 1 - \tfrac{9}{25} = \tfrac{16}{25}$. The third quadrant gives a negative ordinate. So $\sin\alpha = -\tfrac45$.'
            points: 1
          - problem: 'In a parallelogram $ABCD$ we have $|AB| = 4$, $|AD| = 5$ and the angle $BAD$ equals $60^\circ$. Find the scalar product $\vec{AB} \cdot \vec{AD}$.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'The scalar product is $4 \cdot 5 \cdot \cos 60^\circ$. The cosine equals $\tfrac12$. The product is $10$.'
            points: 1
          - problem: 'A random variable $X$ takes the values $1$, $3$ and $7$ with the probabilities $\tfrac12$, $\tfrac13$ and $\tfrac16$. Find the expected value of $X$.'
            answer_contract: {"kind":"exact"}
            answer: '8/3'
            solution_sketch: 'The expected value is $1 \cdot \tfrac12 + 3 \cdot \tfrac13 + 7 \cdot \tfrac16$. The sum equals $\tfrac{3+6+7}{6} = \tfrac83$.'
            points: 1
          - problem: 'A coach picks $3$ players from $5$ guards and $4$ forwards. The team has $1$ guard and $2$ forwards. How many teams are possible?'
            answer_contract: {"kind":"exact"}
            answer: '30'
            solution_sketch: 'The coach picks the guard in $5$ ways. The coach picks the two forwards in $\binom42 = 6$ ways. The count is $5 \cdot 6 = 30$.'
            points: 1
          - problem: 'The derivative of a function $f$ is $f''(x) = (x+2)(x-3)$. Solve $f''(x) < 0$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-2 < x < 3'
            solution_sketch: 'Solve $f''(x) < 0$. The product is negative between the roots $-2$ and $3$. The solution is $-2<x<3$.'
            points: 1
        constraints: 'Ten short items of one point. Each item tests one skill and has a short answer. The areas follow the first ten tasks of the paper.'
      - id: kp2
        name: 'Structured open items'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp10-trig-functions, vbe-cp17-limits-derivative-concept, vbe-cp20-integral, vbe-cp23-solids]
        exemplars:
          - problem: 'In an arithmetic progression $a_3 = 11$ and the difference is $d = 4$. (a) Find $a_1$. (b) Find $a_6$. (c) Find the sum $S_8$ of the first eight terms.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a1","contract":{"kind":"exact"}},{"name":"a6","contract":{"kind":"exact"}},{"name":"S8","contract":{"kind":"exact"}}]}
            answer: 'a1 = 3; a6 = 23; S8 = 136'
            solution_sketch: 'We have $a_1 = 11 - 2 \cdot 4 = 3$. Then $a_6 = 3 + 5 \cdot 4 = 23$. Also $a_8 = 31$, so $S_8 = 8 \cdot (3+31)/2 = 136$.'
            points: 4
          - problem: 'A cone has the base radius $5$ cm and the generatrix $13$ cm. (a) Find the height of the cone. (b) Find the area of the axial section. (c) Find the cosine of the angle between the generatrix and the base plane.'
            answer_contract: {"kind":"multipart","parts":[{"name":"h","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}},{"name":"S","contract":{"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}},{"name":"cos","contract":{"kind":"exact"}}]}
            answer: 'h = 12 cm; S = 60 cm^2; cos = 5/13'
            solution_sketch: 'The height is $\sqrt{13^2 - 5^2} = 12$. The axial section is a triangle with the base $10$ and the height $12$, so its area is $60$. The cosine is $5/13$.'
            points: 3
          - problem: 'The graphs of $y = x^2$ and $y = 2x + 3$ bound a region. (a) Find the abscissas of the common points of the graphs. (b) Find the area of the region. (c) Find the slope of the tangent to $y = x^2$ at the right common point.'
            answer_contract: {"kind":"multipart","parts":[{"name":"xs","contract":{"kind":"set"}},{"name":"area","contract":{"kind":"exact"}},{"name":"slope","contract":{"kind":"exact"}}]}
            answer: 'xs = {-1, 3}; area = 32/3; slope = 6'
            solution_sketch: 'The equation $x^2 = 2x+3$ gives $x=-1$ or $x=3$. The area is $\int_{-1}^{3} (2x+3-x^2)\,dx = 9 - (-\tfrac53) = \tfrac{32}{3}$. The slope at $x=3$ is $2 \cdot 3 = 6$.'
            points: 5
          - problem: 'The line $y = 4x - 1$ touches the graph of $f(x) = x^2 + bx + c$ at the point with the abscissa $1$. (a) Find $b$. (b) Find $c$. (c) Find the abscissa of the vertex of the graph of $f$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"xv","contract":{"kind":"exact"}}]}
            answer: 'b = 2; c = 0; xv = -1'
            solution_sketch: 'The point of tangency is $(1, 3)$ on the line. The slopes agree: $f''(1) = 2 + b = 4$, so $b = 2$. Then $f(1) = 1 + 2 + c = 3$, so $c = 0$. The vertex is at $x = -b/2 = -1$.'
            points: 4
          - problem: 'A cyclist rides $60$ km at the speed $v$ km/h. On the way back the speed is $5$ km/h greater, and the ride takes $1$ hour less. (a) Find $v$. (b) Find the time of the way back in hours. (c) Find the total time of both rides in hours.'
            answer_contract: {"kind":"multipart","parts":[{"name":"v","contract":{"kind":"exact"}},{"name":"back","contract":{"kind":"exact"}},{"name":"total","contract":{"kind":"exact"}}]}
            answer: 'v = 15; back = 3; total = 7'
            solution_sketch: 'The times satisfy $\tfrac{60}{v} - \tfrac{60}{v+5} = 1$. This gives $v^2 + 5v - 300 = 0$ and $v = 15$, because the speed is positive. The way back takes $60/20 = 3$ hours. The first ride takes $4$ hours, so the total is $7$ hours.'
            points: 5
          - problem: 'Let $\lg 2 = a$. (a) Express $\lg 5$ through $a$. (b) Express $\log_2 5$ through $a$. (c) Express $\lg 40$ through $a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"lg5","contract":{"kind":"function","vars":["a"]}},{"name":"log25","contract":{"kind":"function","vars":["a"]}},{"name":"lg40","contract":{"kind":"function","vars":["a"]}}]}
            answer: 'lg5 = 1-a; log25 = (1-a)/a; lg40 = 2*a+1'
            solution_sketch: 'We have $\lg 5 = \lg 10 - \lg 2 = 1 - a$. The change of base gives $\log_2 5 = \lg 5 / \lg 2$. Also $\lg 40 = \lg 4 + \lg 10 = 2a + 1$.'
            points: 3
        constraints: 'Five items of the form plus one spare. Each item has two to four parts. The points run from three to five.'
      - id: kp3
        name: 'Long open items'
        key_prerequisites: [vbe-cp11-equations, vbe-cp19-function-study, vbe-cp23-solids, vbe-cp25-probability-models, vbe-cp26-random-variables]
        exemplars:
          - problem: '(a) Solve $\sqrt{x+6} = x$. (b) Solve $2\sin^2 x = \sin x$ for $0 \le x \le \pi$. (c) How many solutions does the second equation have for $0 \le x \le 2\pi$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"roots","contract":{"kind":"set"}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'x = 3; roots = {0, pi/6, 5*pi/6, pi}; count = 5'
            solution_sketch: 'Squaring gives $x^2 = x + 6$, so $x = 3$ or $x = -2$. The root $-2$ fails the check, because $\sqrt{4} = 2$. Next, $\sin x (2\sin x - 1) = 0$ gives $\sin x = 0$ or $\sin x = \tfrac12$. On $[0, 2\pi]$ the first case has $3$ roots and the second case has $2$ roots.'
            points: 7
          - problem: 'A bag holds $2$ red and $4$ green cubes. (a) Two cubes leave the bag in turn without return. Find the probability that both are red. (b) A cube leaves the bag $4$ times, and it returns each time. Find the probability of at least $3$ red cubes. (c) Find the expected number of red cubes in these $4$ draws.'
            answer_contract: {"kind":"multipart","parts":[{"name":"both","contract":{"kind":"exact"}},{"name":"atleast3","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}}]}
            answer: 'both = 1/15; atleast3 = 1/9; mean = 4/3'
            solution_sketch: 'In part (a) the probability is $\tfrac26 \cdot \tfrac15 = \tfrac1{15}$. In part (b) the red probability is $\tfrac13$. We get $4 \cdot \tfrac1{27} \cdot \tfrac23 + \tfrac1{81} = \tfrac{9}{81} = \tfrac19$. In part (c) the mean is $4 \cdot \tfrac13 = \tfrac43$.'
            points: 7
          - problem: 'A regular square pyramid has the lateral edge $6$ and the height $h$ with $0 < h < 6$. (a) Write the volume $V$ as a function of $h$. (b) Find the height for which $V$ is greatest. (c) Find the greatest volume. (d) For the height that gives the greatest volume, find the cosine of the angle between a lateral edge and the base plane.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["h"]}},{"name":"hmax","contract":{"kind":"exact"}},{"name":"Vmax","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}}]}
            answer: 'V = 2*(36*h-h^3)/3; hmax = 2*sqrt(3); Vmax = 32*sqrt(3); cos = sqrt(6)/3'
            solution_sketch: 'Let $r$ be the half of the base diagonal. Then $r^2 = 36 - h^2$ and the base area is $2r^2$. So $V = \tfrac13 \cdot 2(36-h^2) h$. The derivative $V'' = \tfrac23 (36 - 3h^2)$ is zero at $h = 2\sqrt{3}$, and $V$ is greatest there. Then $V = 32\sqrt{3}$ and $r = \sqrt{24}$, so the cosine is $r/6 = \sqrt{6}/3$.'
            points: 10
          - problem: 'An open box comes from a square sheet with the side $12$ dm. The maker cuts a square with the side $x$ dm from each corner and folds up the sides. (a) Write the volume $V$ as a function of $x$. (b) Write the values of $x$ for which the box has positive volume, as an inequality. (c) Find the value of $x$ that gives the greatest volume. (d) Find the greatest volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["x"]}},{"name":"dom","contract":{"kind":"inequality_union"}},{"name":"xmax","contract":{"kind":"exact"}},{"name":"Vmax","contract":{"kind":"exact"}}]}
            answer: 'V = x*(12-2*x)^2; dom = 0 < x < 6; xmax = 2; Vmax = 128'
            solution_sketch: 'The base of the box is a square with the side $12 - 2x$ and the height is $x$. So $V = x(12-2x)^2$ and $0 < x < 6$. The derivative is $V'' = (12-2x)(12-6x)$, which is zero at $x = 2$ in the domain. Then $V = 2 \cdot 8^2 = 128$.'
            points: 8
          - problem: 'A random variable $X$ takes the values $-1$, $0$ and $2$ with the probabilities $a$, $2a$ and $\tfrac12$. (a) Find $a$. (b) Find the expected value of $X$. (c) Find the variance of $X$. (d) Find the probability $P(X \ge 0)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}},{"name":"var","contract":{"kind":"exact"}},{"name":"p","contract":{"kind":"exact"}}]}
            answer: 'a = 1/6; mean = 5/6; var = 53/36; p = 5/6'
            solution_sketch: 'The probabilities sum to $1$, so $3a + \tfrac12 = 1$ and $a = \tfrac16$. The mean is $-\tfrac16 + 1 = \tfrac56$. Next, $E(X^2) = \tfrac16 + 2 = \tfrac{13}{6}$, so the variance is $\tfrac{13}{6} - \tfrac{25}{36} = \tfrac{53}{36}$. Also $P(X \ge 0) = 1 - \tfrac16 = \tfrac56$.'
            points: 8
          - problem: 'A cube $ABCDA_1B_1C_1D_1$ has the edge $4$. (a) Find the length of the space diagonal $AC_1$. (b) Find the cosine of the angle between $AC_1$ and the base plane $ABCD$. (c) Find the distance from $A$ to the plane $A_1BD$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"diag","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}},{"name":"dist","contract":{"kind":"exact"}}]}
            answer: 'diag = 4*sqrt(3); cos = sqrt(6)/3; dist = 4*sqrt(3)/3'
            solution_sketch: 'The diagonal is $4\sqrt{3}$. The projection of $AC_1$ on the base is $AC = 4\sqrt{2}$, so the cosine is $\sqrt{2}/\sqrt{3} = \sqrt{6}/3$. The diagonal $AC_1$ is perpendicular to the plane $A_1BD$ and meets it at one third of its length. So the distance is $4\sqrt{3}/3$.'
            points: 9
        constraints: 'Three items of the form plus three spares. Each item sets up a model, solves it and reads the result. The points run from seven to ten.'
      - id: kp4
        name: 'Show that items'
        key_prerequisites: [vbe-cp05-logarithms, vbe-cp14-plane-vectors, vbe-cp15-trig-expressions, vbe-cp18-derivative-rules]
        exemplars:
          - problem: 'The vectors $\vec a$ and $\vec b$ have the lengths $|\vec a| = 7$ and $|\vec b| = 4$. (a) Find $(\vec a + \vec b) \cdot (\vec a - \vec b)$. (b) Find $|\vec a + \vec b|^2 + |\vec a - \vec b|^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"dot","contract":{"kind":"exact"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'dot = 33; sum = 130'
            solution_sketch: 'Expanding gives $(\vec a + \vec b) \cdot (\vec a - \vec b) = |\vec a|^2 - |\vec b|^2 = 49 - 16 = 33$. Also the two squared lengths add to $2(|\vec a|^2 + |\vec b|^2) = 130$.'
            points: 2
          - problem: '(a) Simplify $\log_5 20 + \log_5 \tfrac54$. (b) Find $\log_2 3 \cdot \log_3 8$. (c) Find $\dfrac{1}{\log_3 6} + \dfrac{1}{\log_2 6}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 2; b = 3; c = 1'
            solution_sketch: 'In part (a) the product rule gives $\log_5 25 = 2$. In part (b) the change of base gives $\log_2 3 \cdot \log_3 8 = \log_2 8 = 3$. In part (c) the sum is $\log_6 3 + \log_6 2 = \log_6 6 = 1$.'
            points: 3
          - problem: 'Take $f(x) = x^3 - 3x$. (a) Find $f''(x)$. (b) Find the value of $f''$ at $x = 1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}}]}
            answer: 'd = 3*x^2-3; v = 0'
            solution_sketch: 'The power rule gives $f''(x) = 3x^2 - 3$. At $x = 1$ we get $3 - 3 = 0$.'
            points: 2
          - problem: '(a) Find the exact value of $\sin 75^\circ$. (b) Find $\cos 2\alpha$ when $\cos\alpha = \tfrac35$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"s","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 's = (sqrt(6)+sqrt(2))/4; c = -7/25'
            solution_sketch: 'Write $75^\circ = 45^\circ + 30^\circ$. The sum formula gives $\sin 75^\circ = \tfrac{\sqrt6 + \sqrt2}{4}$. Next, $\cos 2\alpha = 2\cos^2\alpha - 1 = \tfrac{18}{25} - 1 = -\tfrac{7}{25}$.'
            points: 3
          - problem: 'A regular pyramid has a square base with the side $6$ and the height $4$. (a) Find the length of the base diagonal. (b) Find the distance from the foot of the height to a base side. (c) Find the height of a lateral face.'
            answer_contract: {"kind":"multipart","parts":[{"name":"diag","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"ap","contract":{"kind":"exact"}}]}
            answer: 'diag = 6*sqrt(2); d = 3; ap = 5'
            solution_sketch: 'The diagonal of a square with the side $6$ is $6\sqrt{2}$. The foot of the height is the center of the base, so its distance to a side is $3$. The face height is $\sqrt{4^2 + 3^2} = 5$.'
            points: 3
          - problem: '(a) Find the number of $2$-element subsets of a set with $8$ elements. (b) A random variable $Y$ counts the successes in $8$ independent trials with the success probability $\tfrac12$. Find $P(Y = 2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"p","contract":{"kind":"exact"}}]}
            answer: 'n = 28; p = 7/64'
            solution_sketch: 'The number of subsets is $\binom82 = 28$. Then $P(Y=2) = 28 \cdot (\tfrac12)^8 = \tfrac{28}{256} = \tfrac{7}{64}$.'
            points: 3
          - problem: 'Prove that the function $f(x) = x^3 + x$ increases on the set of all real numbers.'
            answer_contract: {"kind":"written"}
            answer: 'The derivative is $f''(x) = 3x^2 + 1$. A square is not negative, so $3x^2 + 1 \ge 1 > 0$ for every real $x$. A function with a positive derivative on an interval increases on it. So $f$ increases on all real numbers.'
            solution_sketch: 'Take the derivative. Show that it is positive. Use the sign rule.'
            points: 3
          - problem: 'Prove with vectors that the diagonals of a rhombus are perpendicular.'
            answer_contract: {"kind":"written"}
            answer: 'Let the rhombus be $ABCD$ with $\vec{AB} = \vec u$ and $\vec{AD} = \vec v$. The sides are equal, so $|\vec u| = |\vec v|$. The diagonals are $\vec{AC} = \vec u + \vec v$ and $\vec{DB} = \vec u - \vec v$. Their scalar product is $|\vec u|^2 - |\vec v|^2 = 0$. So the diagonals are perpendicular.'
            solution_sketch: 'Write the diagonals with the side vectors. Multiply them. Use the equal side lengths.'
            points: 2
          - problem: 'Prove that $\log_2 3$ is an irrational number.'
            answer_contract: {"kind":"written"}
            answer: 'Assume that $\log_2 3 = p/q$ with positive integers $p$ and $q$. Then $2^{p/q} = 3$, so $2^p = 3^q$. The left side is even and the right side is odd. This is a contradiction. So $\log_2 3$ is irrational.'
            solution_sketch: 'Assume a fraction. Raise $2$ to the power. Compare the parity of both sides.'
            points: 4
        constraints: 'Two items of the form plus four spares ask for the value that one step of a proof produces. The last three items ask for a full proof.'
    diagnostic_exemplar:
      problem: 'Find $\log_2 32$.'
      answer_contract: {"kind":"exact"}
      answer: '5'
      solution_sketch: 'We have $32 = 2^5$. So the logarithm equals $5$.'
