            answer_contract: {"kind":"inequality_union"}
            answer: '-4 <= x < 1 or 3 < x <= 6'
            solution_sketch: 'The two intervals do not overlap. The union keeps both pieces. It is $-4 \le x < 1$ or $3 < x \le 6$.'
            points: 1
          - problem: 'Simplify $\dfrac{8}{\sqrt{7}-\sqrt{3}}$ so that the denominator has no root.'
            answer_contract: {"kind":"exact"}
            answer: '2*sqrt(7)+2*sqrt(3)'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{7}+\sqrt{3}$. The bottom becomes $7-3=4$. The result is $2\sqrt{7}+2\sqrt{3}$.'
            points: 1
          - problem: 'A random variable $X$ takes the values $-2$, $1$ and $5$ with the probabilities $\tfrac14$, $\tfrac12$ and $\tfrac14$. Find the expected value of $X$.'
            answer_contract: {"kind":"exact"}
            answer: '5/4'
            solution_sketch: 'The expected value is $-2 \cdot \tfrac14 + 1 \cdot \tfrac12 + 5 \cdot \tfrac14$. The sum is $-\tfrac12 + \tfrac12 + \tfrac54 = \tfrac54$.'
            points: 1
          - problem: 'Find the coordinates of the common point of the graphs of $y = 4^{x}$ and $y = 8 \cdot 2^{-x}$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(1, 4)'
            solution_sketch: 'Write $4^x = 2^{2x}$ and $8 \cdot 2^{-x} = 2^{3-x}$. Then $2x = 3 - x$, so $x = 1$. The ordinate is $4^1 = 4$.'
            points: 1
          - problem: 'A code has $3$ digits. Each digit is any of $0, 1, \dots, 9$ and digits may repeat. Find the probability that all three digits of a code are different.'
            answer_contract: {"kind":"exact"}
            answer: '18/25'
            solution_sketch: 'There are $10^3 = 1000$ codes. Codes with different digits number $10 \cdot 9 \cdot 8 = 720$. The probability is $\tfrac{720}{1000} = \tfrac{18}{25}$.'
            points: 1
          - problem: 'A tangent to the graph of a function $f$ at the point $(2, 5)$ passes through the point $(4, 11)$. Find $f''(2)$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'The derivative at $2$ equals the slope of the tangent. The slope is $\tfrac{11-5}{4-2} = 3$.'
            points: 1
          - problem: 'Let $\sin\alpha + \cos\alpha = \tfrac12$. Find $\sin 2\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '-3/4'
            solution_sketch: 'Square both sides: $1 + 2\sin\alpha\cos\alpha = \tfrac14$. The double angle formula gives $1 + \sin 2\alpha = \tfrac14$. So $\sin 2\alpha = -\tfrac34$.'
            points: 1
          - problem: 'A vector $\vec b$ has the opposite direction to $\vec a = (5, 12)$ and the length $26$. Find the coordinates of $\vec b$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-10, -24)'
            solution_sketch: 'The length of $\vec a$ is $\sqrt{25+144} = 13$. The vector $\vec b$ equals $-2\vec a$, because $26 = 2 \cdot 13$. So $\vec b = (-10, -24)$.'
            points: 1
          - problem: 'The speed of a body is $v(t) = 3t^2 + 2t + 1$ meters per second. Find the distance in meters that the body covers from $t = 1$ to $t = 3$.'
            answer_contract: {"kind":"exact"}
            answer: '36'
            solution_sketch: 'The distance is $\int_1^3 (3t^2 + 2t + 1)\,dt$. The antiderivative is $t^3 + t^2 + t$. The value is $39 - 3 = 36$.'
            points: 1
          - problem: 'Let $2^a = 5$ and $5^b = 8$. Find the product $ab$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'We have $a = \log_2 5$ and $b = \log_5 8$. The change of base gives $ab = \log_2 8 = 3$.'
            points: 1
        constraints: 'Ten short items of one point. Each item tests one skill and has a short answer. The areas follow the first ten tasks of the paper.'
      - id: kp2
        name: 'Structured open items'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp14-plane-vectors, vbe-cp19-function-study, vbe-cp23-solids, vbe-cp25-probability-models]
        exemplars:
          - problem: 'The area of a weed patch is $5$ square meters in year $1$. Each year the area is twice the area of the year before. (a) Find the area in year $7$ in square meters. (b) Find the sum of the areas of the first $8$ years in square meters.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a7","contract":{"kind":"exact"}},{"name":"S8","contract":{"kind":"exact"}}]}
            answer: 'a7 = 320; S8 = 1275'
            solution_sketch: 'The areas form a geometric progression with $b_1 = 5$ and $q = 2$. Then $b_7 = 5 \cdot 2^6 = 320$. Also $S_8 = 5(2^8 - 1)/(2-1) = 1275$.'
            points: 3
          - problem: 'The first row of a hall has $12$ seats. Each next row has $2$ seats more than the row before. (a) Find the number of seats in row $15$. (b) Find the number of rows that hold $350$ seats in total.'
            answer_contract: {"kind":"multipart","parts":[{"name":"seats","contract":{"kind":"exact"}},{"name":"rows","contract":{"kind":"exact"}}]}
            answer: 'seats = 40; rows = 14'
            solution_sketch: 'The rows form an arithmetic progression with $a_1 = 12$ and $d = 2$. Then $a_{15} = 12 + 28 = 40$. Also $S_n = n(n+11) = 350$ gives $n^2 + 11n - 350 = 0$, so $n = 14$, because $n$ is positive.'
            points: 3
          - problem: 'In a parallelogram $ABCD$ we have $|AB| = 3$, $|AD| = 4$ and the angle $BAD$ equals $60^\circ$. The point $M$ is the midpoint of the side $BC$. Write $\vec{AM} = x\vec{AB} + y\vec{AD}$. (a) Find $x$. (b) Find $y$. (c) Find the scalar product $\vec{AM} \cdot \vec{BD}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}},{"name":"dot","contract":{"kind":"exact"}}]}
            answer: 'x = 1; y = 1/2; dot = 2'
            solution_sketch: 'We have $\vec{AM} = \vec{AB} + \vec{BM} = \vec{AB} + \tfrac12\vec{AD}$, so $x = 1$ and $y = \tfrac12$. Also $\vec{BD} = \vec{AD} - \vec{AB}$ and $\vec{AB} \cdot \vec{AD} = 3 \cdot 4 \cdot \tfrac12 = 6$. The product is $\tfrac12 \cdot 6 - 9 + \tfrac12 \cdot 16 = 2$.'
            points: 5
          - problem: 'A box holds $12$ tokens: $5$ red, $4$ blue and $3$ green. Two visitors draw one token each in turn, without return. (a) Find the probability that the first token is red. (b) Find the probability that the second token is red when the first token is red. (c) Find the probability that both tokens have the same color.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"same","contract":{"kind":"exact"}}]}
            answer: 'p1 = 5/12; p2 = 4/11; same = 19/66'
            solution_sketch: 'The first probability is $\tfrac{5}{12}$. After a red token, $4$ red tokens remain among $11$, so the second probability is $\tfrac{4}{11}$. The same color has the probability $\tfrac{20+12+6}{12 \cdot 11} = \tfrac{38}{132} = \tfrac{19}{66}$.'
            points: 6
          - problem: 'The sums of the ages of every group of four of five people are $61$, $67$, $70$, $73$ and $77$ years. (a) Find the sum of the ages of all five people. (b) Find the age of the oldest person. (c) Find the age of the youngest person.'
            answer_contract: {"kind":"multipart","parts":[{"name":"total","contract":{"kind":"exact"}},{"name":"oldest","contract":{"kind":"exact"}},{"name":"youngest","contract":{"kind":"exact"}}]}
            answer: 'total = 87; oldest = 26; youngest = 10'
            solution_sketch: 'Each person is left out once, so the five sums add to $4$ times the total. The total is $348 : 4 = 87$. The oldest person is left out in the least sum: $87 - 61 = 26$. The youngest person is left out in the greatest sum: $87 - 77 = 10$.'
            points: 4
          - problem: 'A cylinder has the base radius $3$ cm and the height $8$ cm. (a) Find the area of the lateral surface. (b) Find the volume. (c) Find the length of the diagonal of the axial section.'
            answer_contract: {"kind":"multipart","parts":[{"name":"lat","contract":{"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}},{"name":"V","contract":{"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}},{"name":"diag","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}}]}
            answer: 'lat = 48*pi cm^2; V = 72*pi cm^3; diag = 10 cm'
            solution_sketch: 'The lateral area is $2\pi \cdot 3 \cdot 8 = 48\pi$. The volume is $\pi \cdot 9 \cdot 8 = 72\pi$. The axial section is a rectangle $6$ by $8$, so its diagonal is $\sqrt{36+64} = 10$.'
            points: 4
        constraints: 'Five items of the form plus one spare. Each item has two or three parts. The points run from three to six.'
      - id: kp3
        name: 'Long open items'
        key_prerequisites: [vbe-cp10-trig-functions, vbe-cp13-inequalities, vbe-cp16-trig-equations, vbe-cp19-function-study, vbe-cp22-space-angles, vbe-cp23-solids, vbe-cp24-combinatorics]
        exemplars:
          - problem: '(a) Solve $\dfrac{2x-3}{x+1} \le 1$. (b) Solve $\log_2(x-1) < 3$. (c) Solve $2\cos x > \sqrt{3}$ for $-\pi \le x \le \pi$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"rat","contract":{"kind":"inequality_union"}},{"name":"log","contract":{"kind":"inequality_union"}},{"name":"cos","contract":{"kind":"inequality_union"}}]}
            answer: 'rat = -1 < x <= 4; log = 1 < x < 9; cos = -pi/6 < x < pi/6'
            solution_sketch: 'In the first item, move $1$ to the left: $\tfrac{x-4}{x+1} \le 0$. The sign changes at $-1$ and $4$, and $x \ne -1$, so $-1 < x \le 4$. In the second item, the domain gives $x > 1$ and the base is greater than $1$, so $x - 1 < 8$ and $x < 9$. In the third item, $\cos x > \tfrac{\sqrt3}{2}$ gives $-\tfrac{\pi}{6} < x < \tfrac{\pi}{6}$.'
            points: 8
          - problem: 'A closed cylinder has the total surface area $6\pi$ cm$^2$ and the base radius $r$ cm, with $0 < r < \sqrt{3}$. (a) Write the volume $V$ as a function of $r$. (b) Find the derivative $V''$ as a function of $r$. (c) Find the radius for which $V$ is greatest. (d) Find the greatest volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["r"]}},{"name":"dV","contract":{"kind":"function","vars":["r"]}},{"name":"rmax","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}},{"name":"Vmax","contract":{"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}}]}
            answer: 'V = pi*(3*r-r^3); dV = pi*(3-3*r^2); rmax = 1 cm; Vmax = 2*pi cm^3'
            solution_sketch: 'The total area is $2\pi r^2 + 2\pi r h = 6\pi$, so $h = (3 - r^2)/r$. Then $V = \pi r^2 h = \pi(3r - r^3)$ and $V'' = \pi(3 - 3r^2)$. The derivative is zero at $r = 1$ in the domain. It changes from plus to minus there, so $V$ is greatest. Then $V = \pi(3 - 1) = 2\pi$.'
            points: 9
          - problem: '(a) A regular quadrilateral pyramid has the base side $4$ cm and the lateral edge $6$ cm. Find its height. (b) Find the angle between a lateral face and the base, in degrees, to one decimal place. (c) A cube has the edge $6$ cm. Find the distance between a diagonal of one face and a diagonal of an adjacent face, when the two diagonals are skew.'
            answer_contract: {"kind":"multipart","parts":[{"name":"h","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}},{"name":"angle","contract":{"kind":"approx","decimals":1}},{"name":"dist","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}}]}
            answer: 'h = 2*sqrt(7) cm; angle = 69.3; dist = 2*sqrt(3) cm'
            solution_sketch: 'Half of the base diagonal is $2\sqrt{2}$, so $h = \sqrt{36 - 8} = 2\sqrt{7}$. The face angle has $\tan\varphi = h/2 = \sqrt{7}$, so $\varphi \approx 69.3^\circ$. For the cube with the edge $a$, the distance between such diagonals is $a/\sqrt{3}$. With $a = 6$ the distance is $2\sqrt{3}$.'
            points: 7
          - problem: '(a) Solve $4^x - 5 \cdot 2^x + 4 = 0$. (b) Solve $\log_2 x + \log_2 (x-2) = 3$. (c) Solve $|x - 3| = 2x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"set"}},{"name":"b","contract":{"kind":"set"}},{"name":"c","contract":{"kind":"set"}}]}
            answer: 'a = {0, 2}; b = {4}; c = {1}'
            solution_sketch: 'In the first equation set $t = 2^x$. Then $t^2 - 5t + 4 = 0$ gives $t = 1$ or $t = 4$, so $x = 0$ or $x = 2$. In the second equation, $x(x-2) = 8$ gives $x = 4$ or $x = -2$, and the domain keeps only $4$. In the third equation, $x - 3 = 2x$ gives $x = -3$, which fails because $2x < 0$. Also $3 - x = 2x$ gives $x = 1$, which fits.'
            points: 7
          - problem: 'A shooter hits a target with the probability $\tfrac13$ in each shot. The shots are independent. (a) Find the probability of exactly $2$ hits in $5$ shots. (b) Find the probability of at least $1$ hit in $5$ shots. (c) Find the expected number of hits in $5$ shots. (d) Find the least number $n$ of shots for which the probability of at least $1$ hit is greater than $0.8$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"two","contract":{"kind":"exact"}},{"name":"atleast1","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}},{"name":"n","contract":{"kind":"exact"}}]}
            answer: 'two = 80/243; atleast1 = 211/243; mean = 5/3; n = 4'
            solution_sketch: 'The probability of exactly $2$ hits is $\binom52 (\tfrac13)^2 (\tfrac23)^3 = \tfrac{80}{243}$. The probability of no hit is $(\tfrac23)^5 = \tfrac{32}{243}$, so at least one hit has $\tfrac{211}{243}$. The mean is $5 \cdot \tfrac13 = \tfrac53$. The condition $1 - (\tfrac23)^n > 0.8$ gives $(\tfrac23)^n < 0.2$. For $n = 3$ the value is $\tfrac{8}{27} > 0.2$, and for $n = 4$ it is $\tfrac{16}{81} < 0.2$.'
            points: 8
          - problem: 'Take $f(x) = x^3 - 6x^2 + 9x$. (a) Find $f''(x)$. (b) Find the abscissas of the points where $f''(x) = 0$. (c) Find the greatest value of $f$ on the interval $[0, 2]$. (d) Find the equation of the tangent to the graph at $x = 0$, written as $y$ in terms of $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"crit","contract":{"kind":"set"}},{"name":"max","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'd = 3*x^2-12*x+9; crit = {1, 3}; max = 4; tan = 9*x'
            solution_sketch: 'The power rule gives $f''(x) = 3x^2 - 12x + 9 = 3(x-1)(x-3)$, so the zeros are $1$ and $3$. On $[0,2]$ the candidates are $f(0) = 0$, $f(1) = 4$ and $f(2) = 2$, so the greatest value is $4$. At $x = 0$ we have $f(0) = 0$ and $f''(0) = 9$, so the tangent is $y = 9x$.'
            points: 9
        constraints: 'Three items of the form plus three spares. Each item has three or four parts and ends with a harder part. The points run from seven to nine.'
      - id: kp4
        name: 'Show that items'
        key_prerequisites: [vbe-cp05-logarithms, vbe-cp14-plane-vectors, vbe-cp15-trig-expressions, vbe-cp18-derivative-rules]
        exemplars:
          - problem: 'Simplify $\sin\left(\tfrac{3\pi}{2} + x\right) + \cos(\pi - x)$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '-2*cos(x)'
            solution_sketch: 'The reduction formula gives $\sin(\tfrac{3\pi}{2} + x) = -\cos x$. Also $\cos(\pi - x) = -\cos x$. The sum is $-2\cos x$.'
            points: 2
          - problem: 'Let $\log_2 7 = a$. (a) Express $\log_2 14$ through $a$. (b) Express $\log_{14} 28$ through $a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"l14","contract":{"kind":"function","vars":["a"]}},{"name":"l1428","contract":{"kind":"function","vars":["a"]}}]}
            answer: 'l14 = 1+a; l1428 = (a+2)/(a+1)'
            solution_sketch: 'The product rule gives $\log_2 14 = \log_2 2 + \log_2 7 = 1 + a$. Also $\log_2 28 = 2 + a$. The change of base gives $\log_{14} 28 = \tfrac{a+2}{a+1}$.'
            points: 3
          - problem: 'The vectors $\vec a$ and $\vec b$ have the lengths $3$ and $2$, and the angle between them is $120^\circ$. (a) Find $\vec a \cdot \vec b$. (b) Find $|\vec a + \vec b|^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"dot","contract":{"kind":"exact"}},{"name":"sq","contract":{"kind":"exact"}}]}
            answer: 'dot = -3; sq = 7'
            solution_sketch: 'The scalar product is $3 \cdot 2 \cdot \cos 120^\circ = -3$. Expanding gives $|\vec a + \vec b|^2 = 9 + 2 \cdot (-3) + 4 = 7$.'
            points: 2
          - problem: 'Take $f(x) = x \sin x$. (a) Find $f''(x)$. (b) Find $f''(\pi)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}}]}
            answer: 'd = sin(x)+x*cos(x); v = -pi'
            solution_sketch: 'The product rule gives $f''(x) = \sin x + x\cos x$. At $x = \pi$ we get $0 + \pi \cdot (-1) = -\pi$.'
            points: 3
          - problem: '(a) Compute $\binom52 + \binom53$. (b) Compute $\binom63$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sum","contract":{"kind":"exact"}},{"name":"c63","contract":{"kind":"exact"}}]}
            answer: 'sum = 20; c63 = 20'
            solution_sketch: 'We have $\binom52 = 10$ and $\binom53 = 10$, so the sum is $20$. Also $\binom63 = \tfrac{6 \cdot 5 \cdot 4}{6} = 20$.'
            points: 2
          - problem: 'A cube has the edge $1$. (a) Find the length of a face diagonal. (b) Find the length of a space diagonal. (c) Find the cosine of the angle between a space diagonal and a face diagonal that starts at the same vertex.'
            answer_contract: {"kind":"multipart","parts":[{"name":"face","contract":{"kind":"exact"}},{"name":"space","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}}]}
            answer: 'face = sqrt(2); space = sqrt(3); cos = sqrt(6)/3'
            solution_sketch: 'A face diagonal is $\sqrt{1+1} = \sqrt{2}$. A space diagonal is $\sqrt{1+1+1} = \sqrt{3}$. The face diagonal is the projection of the space diagonal on the face, so the cosine is $\sqrt{2}/\sqrt{3} = \sqrt{6}/3$.'
            points: 3
          - problem: 'Prove that $\cos^4 x - \sin^4 x = \cos 2x$ for every real $x$.'
            answer_contract: {"kind":"written"}
            answer: 'Factor the difference of squares: $\cos^4 x - \sin^4 x = (\cos^2 x - \sin^2 x)(\cos^2 x + \sin^2 x)$. The second factor equals $1$. The first factor equals $\cos 2x$ by the double angle formula. So the difference equals $\cos 2x$.'
            solution_sketch: 'Factor the difference of squares. Use the basic identity. Use the double angle formula.'
            points: 3
          - problem: 'Prove that the sum of the first $n$ odd positive integers equals $n^2$.'
            answer_contract: {"kind":"written"}
            answer: 'The odd numbers $1, 3, 5, \dots$ form an arithmetic progression with $a_1 = 1$ and $d = 2$. The $n$-th term is $a_n = 2n - 1$. The sum is $S_n = \tfrac{(1 + 2n - 1)}{2} \cdot n = n^2$.'
            solution_sketch: 'Name the progression. Write the last term. Use the sum formula.'
            points: 3
          - problem: 'Prove with vectors that the diagonals of a parallelogram bisect each other.'
            answer_contract: {"kind":"written"}
            answer: 'Let $ABCD$ be a parallelogram with $\vec{AB} = \vec u$ and $\vec{AD} = \vec v$. Then $\vec{AC} = \vec u + \vec v$, so the midpoint of $AC$ is the end of $\tfrac12(\vec u + \vec v)$. Also $\vec{AB} + \tfrac12\vec{BD} = \vec u + \tfrac12(\vec v - \vec u) = \tfrac12(\vec u + \vec v)$. The two midpoints agree, so the diagonals bisect each other.'
            solution_sketch: 'Write both diagonals with the side vectors. Find the midpoint of each. Compare the two midpoints.'
            points: 3
        constraints: 'Two items of the form plus four spares ask for the value that one step of a proof produces. The last three items ask for a full proof.'
    diagnostic_exemplar:
      problem: 'Solve $2x - 6 = 10$.'
      answer_contract: {"kind":"exact"}
      answer: '8'
      solution_sketch: 'Add $6$ to both sides to get $2x = 16$. Divide by $2$. So $x = 8$.'
