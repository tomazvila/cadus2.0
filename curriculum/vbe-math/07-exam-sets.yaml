            solution_sketch: 'The elements $2$, $4$ and $6$ are in $B$, so remove them from $A$. The rest is $1$, $3$, $5$ and $7$.'
            points: 1
          - problem: 'Find the domain of the function $f(x) = \lg(7 - 2x)$.'
            answer_contract: {"kind":"inequality_union"}
            answer: 'x < 7/2'
            solution_sketch: 'The argument of the logarithm is positive. So $7 - 2x > 0$ and $x < \tfrac72$.'
            points: 1
          - problem: 'Simplify $\dfrac{6}{\sqrt{7} - \sqrt{3}}$ so that the denominator has no root.'
            answer_contract: {"kind":"exact"}
            answer: '3*(sqrt(7)+sqrt(3))/2'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{7} + \sqrt{3}$. The bottom becomes $7 - 3 = 4$. The result is $\tfrac{6(\sqrt7+\sqrt3)}{4} = \tfrac{3(\sqrt7+\sqrt3)}{2}$.'
            points: 1
          - problem: 'How many three-digit numbers have the same first digit and last digit?'
            answer_contract: {"kind":"exact"}
            answer: '90'
            solution_sketch: 'The first digit has $9$ values, because it is not $0$. The last digit equals the first digit. The middle digit has $10$ values. The count is $9 \cdot 10 = 90$.'
            points: 1
          - problem: 'The point $P\left(-\tfrac{5}{13}, \tfrac{12}{13}\right)$ lies on the unit circle. The radius $OP$ makes the angle $\alpha$ with the positive $Ox$ axis. Find $\tan\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '-12/5'
            solution_sketch: 'The tangent equals the ordinate divided by the abscissa. So $\tan\alpha = \tfrac{12/13}{-5/13} = -\tfrac{12}{5}$.'
            points: 1
          - problem: 'The radius of a cylinder grows by $20$ percent and the height stays the same. How many times does the volume grow?'
            answer_contract: {"kind":"exact"}
            answer: '36/25'
            solution_sketch: 'The volume is $V = \pi R^2 H$. The new radius is $1.2R$, so the volume grows $1.2^2 = 1.44$ times. That is $\tfrac{36}{25}$.'
            points: 1
          - problem: 'A number $N > 1$ satisfies $\dfrac{1}{\log_2 N} + \dfrac{1}{\log_3 N} = 4$. Find $\log_6 N$.'
            answer_contract: {"kind":"exact"}
            answer: '1/4'
            solution_sketch: 'We have $\tfrac{1}{\log_2 N} = \log_N 2$ and $\tfrac{1}{\log_3 N} = \log_N 3$. The sum is $\log_N 6 = 4$. So $\log_6 N = \tfrac14$.'
            points: 1
          - problem: 'We have $\sin\alpha = -\tfrac{8}{17}$ and $\tan\alpha > 0$. Find $\cos\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '-15/17'
            solution_sketch: 'The sine is negative and the tangent is positive, so the cosine is negative. Then $\cos^2\alpha = 1 - \tfrac{64}{289} = \tfrac{225}{289}$. So $\cos\alpha = -\tfrac{15}{17}$.'
            points: 1
          - problem: 'Find the coefficient of $x^3$ in the expansion of $(2x + 1)^5$.'
            answer_contract: {"kind":"exact"}
            answer: '80'
            solution_sketch: 'The term with $x^3$ is $\binom53 (2x)^3 \cdot 1^2$. We get $10 \cdot 8 x^3 = 80x^3$.'
            points: 1
          - problem: 'Find the value of $9^{\log_3 5 - 1}$.'
            answer_contract: {"kind":"exact"}
            answer: '25/9'
            solution_sketch: 'Write $9 = 3^2$. Then $9^{\log_3 5 - 1} = 3^{2\log_3 5 - 2} = \tfrac{25}{9}$.'
            points: 1
        constraints: 'Ten short items of one point. Each item tests one skill and has a short answer. The areas follow the first ten tasks of the paper.'
      - id: kp2
        name: 'Structured open items'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp11-equations, vbe-cp14-plane-vectors, vbe-cp16-trig-equations, vbe-cp20-integral]
        exemplars:
          - problem: '(a) Solve $9^x - 4 \cdot 3^x + 3 = 0$. (b) Solve $\cos 2x + 3\sin x = 2$ for $0 \le x \le 2\pi$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"set"}},{"name":"roots","contract":{"kind":"set"}}]}
            answer: 'x = {0, 1}; roots = {pi/6, pi/2, 5*pi/6}'
            solution_sketch: 'In the first equation put $t = 3^x$. Then $t^2 - 4t + 3 = 0$, so $t = 1$ or $t = 3$ and $x = 0$ or $x = 1$. In the second equation use $\cos 2x = 1 - 2\sin^2 x$. We get $2\sin^2 x - 3\sin x + 1 = 0$, so $\sin x = 1$ or $\sin x = \tfrac12$. The roots are $\tfrac\pi6$, $\tfrac\pi2$ and $\tfrac{5\pi}{6}$.'
            points: 6
          - problem: 'In a right trapezoid $ABCD$ the sides $AB$ and $DC$ are parallel and point the same way. The side $AD$ is perpendicular to both. We have $|AB| = 6$, $|DC| = 3$ and $|AD| = 4$. (a) Find the number $k$ with $\vec{AB} + \vec{CD} = k\,\vec{DC}$. (b) Find $\vec{AC} \cdot \vec{BD}$. (c) Find the cosine of the angle between $\vec{AC}$ and $\vec{BD}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"k","contract":{"kind":"exact"}},{"name":"dot","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}}]}
            answer: 'k = 1; dot = -2; cos = -sqrt(13)/65'
            solution_sketch: 'Put $A = (0,0)$, $B = (6,0)$, $D = (0,4)$ and $C = (3,4)$. Then $\vec{AB} = 2\vec{DC}$ and $\vec{CD} = -\vec{DC}$, so $k = 1$. Next $\vec{AC} = (3,4)$ and $\vec{BD} = (-6,4)$, so the product is $-18 + 16 = -2$. The lengths are $5$ and $2\sqrt{13}$, so the cosine is $\tfrac{-2}{10\sqrt{13}} = -\tfrac{\sqrt{13}}{65}$.'
            points: 5
          - problem: 'A function $f$ has the derivative $f''(x) = 6x^2 + b$. The tangent to its graph at $x = 1$ has the slope $5$. The graph passes through the point $(1, 4)$. (a) Find $b$. (b) Find $f(0)$. (c) Find $\int_0^2 f(x)\,dx$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}},{"name":"f0","contract":{"kind":"exact"}},{"name":"I","contract":{"kind":"exact"}}]}
            answer: 'b = -1; f0 = 3; I = 12'
            solution_sketch: 'The slope gives $f''(1) = 6 + b = 5$, so $b = -1$. Then $f(x) = 2x^3 - x + c$ and $f(1) = 1 + c = 4$, so $c = 3$ and $f(0) = 3$. The integral is $\left[\tfrac{x^4}{2} - \tfrac{x^2}{2} + 3x\right]_0^2 = 8 - 2 + 6 = 12$.'
            points: 4
          - problem: 'A tower holds cubes. The first cube has the edge $8$ cm. Each next cube has the edge $\tfrac34$ of the edge of the cube below it. (a) Find the edge of the fourth cube. (b) Find the height of the tower of infinitely many cubes.'
            answer_contract: {"kind":"multipart","parts":[{"name":"e4","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}},{"name":"H","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}}]}
            answer: 'e4 = 27/8 cm; H = 32 cm'
            solution_sketch: 'The edges form a geometric progression with $b_1 = 8$ and $q = \tfrac34$. So $b_4 = 8 \cdot \tfrac{27}{64} = \tfrac{27}{8}$. The height is the sum $S = \tfrac{8}{1 - 3/4} = 32$.'
            points: 3
          - problem: 'Take $f(x) = x^3 + ax^2 + 3x$. (a) Write the discriminant $D$ of the equation $f''(x) = 0$ as a function of $a$. (b) Find all values of $a$ for which $f$ has exactly one critical point.'
            answer_contract: {"kind":"multipart","parts":[{"name":"D","contract":{"kind":"function","vars":["a"]}},{"name":"a","contract":{"kind":"set"}}]}
            answer: 'D = 4*a^2-36; a = {-3, 3}'
            solution_sketch: 'We have $f''(x) = 3x^2 + 2ax + 3$. Its discriminant is $4a^2 - 36$. One critical point needs $D = 0$, so $a^2 = 9$ and $a = \pm 3$.'
            points: 3
          - problem: 'A random variable $X$ takes the values $-1$, $1$ and $3$. We have $P(X=-1) = a$, $P(X=1) = 2a$ and $P(X=3) = \tfrac12$. (a) Find $a$. (b) Find the expected value of $X$. (c) Find the variance of $X$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}},{"name":"var","contract":{"kind":"exact"}}]}
            answer: 'a = 1/6; mean = 5/3; var = 20/9'
            solution_sketch: 'The probabilities sum to $1$, so $3a + \tfrac12 = 1$ and $a = \tfrac16$. The mean is $-\tfrac16 + \tfrac13 + \tfrac32 = \tfrac53$. Next $E(X^2) = \tfrac16 + \tfrac13 + \tfrac92 = 5$, so the variance is $5 - \tfrac{25}{9} = \tfrac{20}{9}$.'
            points: 5
        constraints: 'Five items of the form plus one spare. Each item has two to three parts. The points run from three to six.'
      - id: kp3
        name: 'Long open items'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp20-integral, vbe-cp23-solids, vbe-cp25-probability-models, vbe-cp26-random-variables]
        exemplars:
          - problem: 'The function $y = 3^{-x}$ is given for $x \ge 0$. For each natural $n$ the rectangle $R_n$ has its base on the $Ox$ axis from $x = n-1$ to $x = n$. Its upper right vertex lies on the curve. (a) Find the area of $R_1$. (b) Find the ratio of the areas of $R_2$ and $R_1$. (c) Find the sum of the areas of all rectangles $R_n$. (d) A curvilinear trapezoid lies under $y = \sqrt{x} + 1$ for $0 \le x \le 4$. Find the volume of the solid that it forms when it turns about the $Ox$ axis.'
            answer_contract: {"kind":"multipart","parts":[{"name":"A1","contract":{"kind":"exact"}},{"name":"q","contract":{"kind":"exact"}},{"name":"S","contract":{"kind":"exact"}},{"name":"V","contract":{"kind":"exact"}}]}
            answer: 'A1 = 1/3; q = 1/3; S = 1/2; V = 68*pi/3'
            solution_sketch: 'The base of $R_1$ is $1$ and its height is $3^{-1}$, so the area is $\tfrac13$. The area of $R_n$ is $3^{-n}$, so the ratio is $\tfrac13$. The sum is $\tfrac{1/3}{1 - 1/3} = \tfrac12$. The volume is $\pi\int_0^4 (x + 2\sqrt{x} + 1)\,dx = \pi\left(8 + \tfrac{32}{3} + 4\right) = \tfrac{68\pi}{3}$.'
            points: 8
          - problem: 'An urn holds $5$ balls with the numbers $1, 1, 2, 2, 3$. Two balls leave the urn at the same time. The random variable $X$ is the product of the two numbers. (a) Find $P(X = 2)$. (b) Find the probability that $X$ is even. (c) Find the expected value of $X$. (d) Find the variance of $X$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p2","contract":{"kind":"exact"}},{"name":"even","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}},{"name":"var","contract":{"kind":"exact"}}]}
            answer: 'p2 = 2/5; even = 7/10; mean = 31/10; var = 269/100'
            solution_sketch: 'There are $\binom52 = 10$ pairs. The product $1$ occurs once, $2$ four times, $3$ twice, $4$ once and $6$ twice. So $P(X=2) = \tfrac{4}{10}$ and $P(X \text{ even}) = \tfrac{4+1+2}{10}$. The mean is $\tfrac{1+8+6+4+12}{10} = \tfrac{31}{10}$. Also $E(X^2) = \tfrac{123}{10}$, so the variance is $\tfrac{123}{10} - \tfrac{961}{100} = \tfrac{269}{100}$.'
            points: 7
          - problem: 'A cylinder stands inside a sphere of radius $3$. All points of both bases of the cylinder lie on the sphere. The height of the cylinder is $h$ with $0 < h < 6$. (a) Write the square of the base radius as a function of $h$. (b) Write $W(h) = V/\pi$ as a function of $h$, where $V$ is the volume of the cylinder. (c) Find $W''(h)$. (d) Find the height $h$ for which $V$ is greatest. (e) Find the greatest volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"r2","contract":{"kind":"function","vars":["h"]}},{"name":"W","contract":{"kind":"function","vars":["h"]}},{"name":"dW","contract":{"kind":"function","vars":["h"]}},{"name":"h","contract":{"kind":"exact"}},{"name":"Vmax","contract":{"kind":"exact"}}]}
            answer: 'r2 = 9-h^2/4; W = 9*h-h^3/4; dW = 9-3*h^2/4; h = 2*sqrt(3); Vmax = 12*sqrt(3)*pi'
            solution_sketch: 'The base radius $r$ satisfies $r^2 + \tfrac{h^2}{4} = 9$. So $r^2 = 9 - \tfrac{h^2}{4}$ and $W = h r^2 = 9h - \tfrac{h^3}{4}$. The derivative is $9 - \tfrac{3h^2}{4}$, and it is zero at $h^2 = 12$, so $h = 2\sqrt{3}$. Then $r^2 = 6$ and $V = \pi \cdot 6 \cdot 2\sqrt{3} = 12\sqrt{3}\pi$.'
            points: 8
          - problem: 'A pyramid $SABCD$ has a square base $ABCD$ with the side $4$. The edge $SA$ is perpendicular to the base and $|SA| = 2$. (a) Find $|SC|$. (b) Find the cosine of the angle between $SC$ and the base plane. (c) Find the volume of the pyramid. (d) Find the distance from $A$ to the plane $SBC$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"SC","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}},{"name":"V","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'SC = 6; cos = 2*sqrt(2)/3; V = 32/3; d = 4*sqrt(5)/5'
            solution_sketch: 'We have $|AC| = 4\sqrt{2}$, so $|SC| = \sqrt{4 + 32} = 6$. The cosine is $|AC|/|SC| = \tfrac{2\sqrt{2}}{3}$. The volume is $\tfrac13 \cdot 16 \cdot 2 = \tfrac{32}{3}$. The line $BC$ is perpendicular to the plane $SAB$, so the distance is the height of the right triangle $SAB$ from $A$: $\tfrac{2 \cdot 4}{\sqrt{20}} = \tfrac{4\sqrt5}{5}$.'
            points: 9
          - problem: 'An open box has a square base with the side $x$ and the volume $32$. (a) Write the height of the box as a function of $x$. (b) Write the outer surface area $S$ as a function of $x$. (c) Find $x$ for which $S$ is least. (d) Find the least value of $S$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"h","contract":{"kind":"function","vars":["x"]}},{"name":"S","contract":{"kind":"function","vars":["x"]}},{"name":"x","contract":{"kind":"exact"}},{"name":"Smin","contract":{"kind":"exact"}}]}
            answer: 'h = 32/x^2; S = x^2+128/x; x = 4; Smin = 48'
            solution_sketch: 'The volume gives $x^2 h = 32$, so $h = \tfrac{32}{x^2}$. The surface is the base plus four sides: $S = x^2 + 4x \cdot \tfrac{32}{x^2} = x^2 + \tfrac{128}{x}$. Then $S'' = 2x - \tfrac{128}{x^2} = 0$ gives $x^3 = 64$, so $x = 4$. The least value is $16 + 32 = 48$.'
            points: 9
          - problem: '(a) Solve $\log_2(x+1) + \log_2(x-1) = 3$. (b) Solve $2^{x+1} - 2^x > 8$. (c) Find the exact value of $\sqrt{7 + 4\sqrt{3}} - \sqrt{7 - 4\sqrt{3}}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"ineq","contract":{"kind":"inequality_union"}},{"name":"v","contract":{"kind":"exact"}}]}
            answer: 'x = 3; ineq = x > 3; v = 2*sqrt(3)'
            solution_sketch: 'The first equation gives $x^2 - 1 = 8$, so $x = 3$ or $x = -3$. The domain needs $x > 1$, so $x = 3$. In the second one, $2^{x+1} - 2^x = 2^x$, so $2^x > 8$ and $x > 3$. Last, $7 \pm 4\sqrt{3} = (2 \pm \sqrt{3})^2$, so the difference is $(2+\sqrt3) - (2-\sqrt3) = 2\sqrt{3}$.'
            points: 7
        constraints: 'Three items of the form plus three spares. Each item sets up a model, solves it and reads the result. The points run from seven to nine.'
      - id: kp4
        name: 'Show that items'
        key_prerequisites: [vbe-cp04-roots, vbe-cp15-trig-expressions, vbe-cp18-derivative-rules, vbe-cp22-space-angles]
        exemplars:
          - problem: 'Squares $ABCD$ and $ABEF$ have the common side $AB$ and the side length $2$. The angle $DAF$ equals $120^\circ$. (a) Find $\vec{AC} \cdot \vec{AE}$. (b) Find the cosine of the angle between $AC$ and $AE$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"dot","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}}]}
            answer: 'dot = 2; cos = 1/4'
            solution_sketch: 'We have $\vec{AC} = \vec{AB} + \vec{AD}$ and $\vec{AE} = \vec{AB} + \vec{AF}$. The vector $\vec{AB}$ is perpendicular to $\vec{AD}$ and $\vec{AF}$. So the product is $4 + 4\cos 120^\circ = 2$. Both diagonals have the length $2\sqrt{2}$, so the cosine is $\tfrac{2}{8} = \tfrac14$.'
            points: 3
          - problem: '(a) Find the exact value of $\cos 75^\circ$. (b) Find the exact value of $\tan 15^\circ$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"c","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}}]}
            answer: 'c = (sqrt(6)-sqrt(2))/4; t = 2-sqrt(3)'
            solution_sketch: 'Write $75^\circ = 45^\circ + 30^\circ$. The sum formula gives $\cos 75^\circ = \tfrac{\sqrt2}{2}\cdot\tfrac{\sqrt3}{2} - \tfrac{\sqrt2}{2}\cdot\tfrac12 = \tfrac{\sqrt6 - \sqrt2}{4}$. Next $\tan 15^\circ = \tan(45^\circ - 30^\circ) = \tfrac{1 - \sqrt3/3}{1 + \sqrt3/3} = 2 - \sqrt{3}$.'
            points: 3
          - problem: 'Take $f(x) = x^2 \sin x$. (a) Find $f''(x)$. (b) Find $f''(\pi)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}}]}
            answer: 'd = 2*x*sin(x)+x^2*cos(x); v = -pi^2'
            solution_sketch: 'The product rule gives $f''(x) = 2x\sin x + x^2\cos x$. At $x = \pi$ we get $0 + \pi^2 \cdot (-1) = -\pi^2$.'
            points: 2
          - problem: '(a) Expand $(\sqrt{5} + \sqrt{2})^3$. (b) Find $(\sqrt{5} + \sqrt{2})(7 - \sqrt{10})$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 11*sqrt(5)+17*sqrt(2); b = 5*sqrt(5)+2*sqrt(2)'
            solution_sketch: 'The cube formula gives $5\sqrt5 + 3 \cdot 5 \cdot \sqrt2 + 3 \cdot \sqrt5 \cdot 2 + 2\sqrt2 = 11\sqrt5 + 17\sqrt2$. For the second product, multiply term by term: $7\sqrt5 - 5\sqrt2 + 7\sqrt2 - 2\sqrt5 = 5\sqrt5 + 2\sqrt2$.'
            points: 3
          - problem: '(a) Find the coefficient of $x^2$ in the expansion of $(1 + x)^6$. (b) Find the sum of all coefficients of $(1 + x)^6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"c","contract":{"kind":"exact"}},{"name":"s","contract":{"kind":"exact"}}]}
            answer: 'c = 15; s = 64'
            solution_sketch: 'The coefficient is $\binom62 = 15$. The sum of the coefficients is the value at $x = 1$, which is $2^6 = 64$.'
            points: 2
          - problem: '(a) Find the antiderivative $F$ of $f(x) = 3x^2 + 1$ with $F(0) = 0$. (b) Find $F(2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"F","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}}]}
            answer: 'F = x^3+x; v = 10'
            solution_sketch: 'The power rule gives $F(x) = x^3 + x + C$ and $F(0) = 0$ gives $C = 0$. Then $F(2) = 8 + 2 = 10$.'
            points: 2
          - problem: 'Prove that $\sqrt{2} + \sqrt{3}$ is an irrational number.'
            answer_contract: {"kind":"written"}
            answer: 'Assume that $r = \sqrt{2} + \sqrt{3}$ is rational. We have $(\sqrt{3} + \sqrt{2})(\sqrt{3} - \sqrt{2}) = 1$, so $\sqrt{3} - \sqrt{2} = 1/r$ is rational. Then $\sqrt{3} = \tfrac12 (r + 1/r)$ is rational. This is a contradiction, because $\sqrt{3}$ is irrational. So $r$ is irrational.'
            solution_sketch: 'Assume that the sum is rational. Use the product of the sum and the difference. Find that $\sqrt{3}$ is rational.'
            points: 3
          - problem: 'Prove with vectors that a parallelogram with equal diagonals is a rectangle.'
            answer_contract: {"kind":"written"}
            answer: 'Let the parallelogram be $ABCD$ with $\vec{AB} = \vec u$ and $\vec{AD} = \vec v$. The diagonals are $\vec{AC} = \vec u + \vec v$ and $\vec{DB} = \vec u - \vec v$. Equal lengths give $|\vec u + \vec v|^2 = |\vec u - \vec v|^2$. Expand both sides to get $4\,\vec u \cdot \vec v = 0$. So $\vec u \perp \vec v$ and the angle at $A$ equals $90^\circ$.'
            solution_sketch: 'Write the diagonals with the side vectors. Square their lengths. Compare the two squares.'
            points: 3
          - problem: 'Prove that the function $f(x) = x^3 - 3x^2 + 3x$ has no extremum.'
            answer_contract: {"kind":"written"}
            answer: 'The derivative is $f''(x) = 3x^2 - 6x + 3 = 3(x-1)^2$. It is not negative for every real $x$ and it is zero only at $x = 1$. The derivative does not change its sign at $x = 1$. So $f$ increases on all real numbers and has no extremum.'
            solution_sketch: 'Take the derivative. Write it as a square. Check the sign on both sides of the zero.'
            points: 4
        constraints: 'Two items of the form plus four spares ask for the value that one step of a proof produces. The last three items ask for a full proof.'
    diagnostic_exemplar:
      problem: 'Find $\log_3 81$.'
      answer_contract: {"kind":"exact"}
      answer: '4'
      solution_sketch: 'We have $81 = 3^4$. So the logarithm equals $4$.'
