            answer_contract: {"kind":"exact"}
            answer: '2/5'
            solution_sketch: 'The probabilities sum to $1$. The known probabilities sum to $\tfrac{2}{10} + \tfrac{3}{10} + \tfrac{1}{10} = \tfrac{6}{10}$. So $p = \tfrac{4}{10} = \tfrac25$.'
            points: 1
          - problem: 'Simplify $\dfrac{8}{3-\sqrt{5}}$ so that the denominator has no root.'
            answer_contract: {"kind":"exact"}
            answer: '6+2*sqrt(5)'
            solution_sketch: 'Multiply the top and the bottom by $3+\sqrt{5}$. The bottom becomes $9-5=4$. The result is $\dfrac{8(3+\sqrt{5})}{4} = 6+2\sqrt{5}$.'
            points: 1
          - problem: 'A code has $4$ digits. Each digit is one of $1, 2, 3, 4, 5, 6, 7$, and all digits of the code are different. How many such codes exist?'
            answer_contract: {"kind":"exact"}
            answer: '840'
            solution_sketch: 'The first digit has $7$ values. The second digit has $6$ values, the third has $5$ and the fourth has $4$. The count is $7 \cdot 6 \cdot 5 \cdot 4 = 840$.'
            points: 1
          - problem: 'The tangent line $x = 1$ to the unit circle at the point $(1, 0)$ meets the ray from the origin at the angle $\alpha$ at the point $(1, \tfrac34)$. The angle $\alpha$ lies between $0$ and $\tfrac{\pi}{2}$. Find $\cos\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '4/5'
            solution_sketch: 'The tangent equals the ordinate of the meeting point, so $\tan\alpha = \tfrac34$. Then $\cos^2\alpha = \dfrac{1}{1+\tan^2\alpha} = \tfrac{16}{25}$. The cosine is positive in the first quadrant, so $\cos\alpha = \tfrac45$.'
            points: 1
          - problem: 'The lateral surface of a cylinder unrolls into a square with the area $64\pi^2$ cm$^2$. Find the area of the base of the cylinder.'
            answer_contract: {"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}
            answer: '16*pi cm^2'
            solution_sketch: 'The side of the square is $8\pi$. It equals the circumference of the base, so $2\pi R = 8\pi$ and $R = 4$. The base area is $\pi R^2 = 16\pi$ cm$^2$.'
            points: 1
          - problem: 'Write $\log_9 18$ in the form $m + n\log_3 2$ with rational numbers $m$ and $n$. Find $m + n$.'
            answer_contract: {"kind":"exact"}
            answer: '3/2'
            solution_sketch: 'We have $\log_9 18 = \dfrac{\log_3 18}{\log_3 9} = \dfrac{\log_3 2 + 2}{2}$. So $m = 1$ and $n = \tfrac12$. The sum is $\tfrac32$.'
            points: 1
          - problem: 'The graph of an antiderivative $F$ of $f(x) = 6x^2 - 2x$ passes through the point $(1, 5)$. Find $F(2)$.'
            answer_contract: {"kind":"exact"}
            answer: '16'
            solution_sketch: 'We have $F(x) = 2x^3 - x^2 + C$. The point $(1, 5)$ gives $1 + C = 5$, so $C = 4$. Then $F(2) = 16 - 4 + 4 = 16$.'
            points: 1
          - problem: 'Solve $\arccos(2x - 1) = \dfrac{\pi}{3}$.'
            answer_contract: {"kind":"exact"}
            answer: '3/4'
            solution_sketch: 'The cosine of $\tfrac{\pi}{3}$ equals $\tfrac12$. So $2x - 1 = \tfrac12$. The solution is $x = \tfrac34$.'
            points: 1
        constraints: 'Ten short items of one point. Each item tests one skill and has a short answer. The areas follow the first ten tasks of the paper.'
      - id: kp2
        name: 'Structured open items'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp11-equations, vbe-cp13-inequalities, vbe-cp14-plane-vectors, vbe-cp22-space-angles, vbe-cp23-solids, vbe-cp25-probability-models]
        exemplars:
          - problem: '(a) Solve $|3x - 2| < 7$. (b) Solve $\log_2\big((x+1)^3\big) < 6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"mod","contract":{"kind":"inequality_union"}},{"name":"log","contract":{"kind":"inequality_union"}}]}
            answer: 'mod = -5/3 < x < 3; log = -1 < x < 3'
            solution_sketch: 'The first inequality means $-7 < 3x - 2 < 7$, so $-\tfrac53 < x < 3$. In the second inequality the domain needs $(x+1)^3 > 0$, so $x > -1$. The base is greater than $1$, so $(x+1)^3 < 64$ and $x + 1 < 4$. So $-1 < x < 3$.'
            points: 6
          - problem: 'A colony has $5$ cells at the start of day $0$. The number of cells triples at the end of each day. (a) Find the number of cells at the end of day $4$. (b) Find the first whole day at the end of which the number of cells is greater than $1000$. (c) Find the sum of the numbers of cells at the end of days $1$, $2$, $3$ and $4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n4","contract":{"kind":"exact"}},{"name":"day","contract":{"kind":"exact"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'n4 = 405; day = 5; sum = 600'
            solution_sketch: 'The numbers form a geometric progression with $b_1 = 5$ and $q = 3$. At the end of day $4$ the number is $5 \cdot 3^4 = 405$. We need $5 \cdot 3^n > 1000$, so $3^n > 200$. Because $3^4 = 81$ and $3^5 = 243$, the day is $5$. The sum is $\dfrac{15(3^4 - 1)}{3 - 1} = 600$.'
            points: 5
          - problem: 'In the triangle $ABC$ the point $M$ is the midpoint of the side $BC$. Let $\vec u = \vec{AB}$ and $\vec v = \vec{AC}$. Then $\vec{AM} = k(\vec u + \vec v)$. Also $|\vec u| = 4$, $|\vec v| = 6$ and the angle $BAC$ equals $60^\circ$. (a) Find $k$. (b) Find the scalar product $\vec{AM} \cdot \vec{BC}$. (c) Find the length $|\vec{AM}|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"k","contract":{"kind":"exact"}},{"name":"dot","contract":{"kind":"exact"}},{"name":"len","contract":{"kind":"exact"}}]}
            answer: 'k = 1/2; dot = 10; len = sqrt(19)'
            solution_sketch: 'The midpoint gives $\vec{AM} = \tfrac12(\vec u + \vec v)$, so $k = \tfrac12$. Also $\vec{BC} = \vec v - \vec u$, so $\vec{AM} \cdot \vec{BC} = \tfrac12(|\vec v|^2 - |\vec u|^2) = \tfrac12(36 - 16) = 10$. Next, $\vec u \cdot \vec v = 4 \cdot 6 \cdot \tfrac12 = 12$. So $|\vec u + \vec v|^2 = 16 + 36 + 24 = 76$ and $|\vec{AM}|^2 = 19$.'
            points: 5
          - problem: 'All edges of a regular triangular pyramid have the length $8$. (a) Find the height of a lateral face. (b) Find the distance between two opposite edges.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ap","contract":{"kind":"exact"}},{"name":"dist","contract":{"kind":"exact"}}]}
            answer: 'ap = 4*sqrt(3); dist = 4*sqrt(2)'
            solution_sketch: 'A lateral face is an equilateral triangle with the side $8$. Its height is $8 \cdot \tfrac{\sqrt{3}}{2} = 4\sqrt{3}$. The pyramid is a regular tetrahedron, so it fits into a cube with the edge $\tfrac{8}{\sqrt{2}} = 4\sqrt{2}$. Two opposite edges are diagonals of two opposite faces of this cube. Their distance equals the cube edge, $4\sqrt{2}$.'
            points: 4
          - problem: 'An urn holds $6$ yellow balls and $b$ blue balls. Two balls leave the urn one after the other without return. The probability that both are yellow equals $\tfrac13$. (a) Find $b$. (b) Find the probability that the two balls have different colors.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}},{"name":"diff","contract":{"kind":"exact"}}]}
            answer: 'b = 4; diff = 8/15'
            solution_sketch: 'The probability is $\dfrac{6}{6+b} \cdot \dfrac{5}{5+b} = \tfrac13$. This gives $b^2 + 11b - 60 = 0$, so $b = 4$ because $b > 0$. Then the urn holds $10$ balls. The probability of different colors is $2 \cdot \tfrac{6}{10} \cdot \tfrac{4}{9} = \tfrac{8}{15}$.'
            points: 3
          - problem: '(a) Solve $\sqrt{2x+3} = x$. (b) Solve $3^x + 3^{x+1} = 36$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x1","contract":{"kind":"exact"}},{"name":"x2","contract":{"kind":"exact"}}]}
            answer: 'x1 = 3; x2 = 2'
            solution_sketch: 'Squaring gives $2x + 3 = x^2$, so $x = 3$ or $x = -1$. The root $-1$ fails the check, because $\sqrt{1} = 1$ is not $-1$. In the second equation $3^x(1 + 3) = 36$, so $3^x = 9$ and $x = 2$.'
            points: 4
        constraints: 'Five items of the form plus one spare. Each item has two or three parts. The points run from three to six.'
      - id: kp3
        name: 'Long open items'
        key_prerequisites: [vbe-cp15-trig-expressions, vbe-cp17-limits-derivative-concept, vbe-cp18-derivative-rules, vbe-cp19-function-study, vbe-cp20-integral, vbe-cp23-solids, vbe-cp25-probability-models, vbe-cp26-random-variables]
        exemplars:
          - problem: 'The curve $y = 2\sqrt{x}$ and the line $y = x + 1$ have exactly one common point. (a) Find the abscissa of the common point. (b) Find the slope of the curve at the common point. (c) The part of the curve over the segment $0 \le x \le 4$ turns about the $Ox$ axis. Find the volume of the solid.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x0","contract":{"kind":"exact"}},{"name":"slope","contract":{"kind":"exact"}},{"name":"vol","contract":{"kind":"exact"}}]}
            answer: 'x0 = 1; slope = 1; vol = 32*pi'
            solution_sketch: 'The equation $4x = (x+1)^2$ gives $(x-1)^2 = 0$, so $x = 1$. The derivative is $y'' = 1/\sqrt{x}$, which equals $1$ at $x = 1$. The slope equals the slope of the line, so the line touches the curve. The volume is $\pi \int_0^4 4x\,dx = \pi \cdot 2x^2 \big|_0^4 = 32\pi$.'
            points: 7
          - problem: 'A cone has the generatrix $3$. The angle between the generatrix and the axis of the cone is $t$ with $0 < t < \tfrac{\pi}{2}$. (a) Write the volume $V$ as a function of $t$. (b) Find the derivative $V''(t)$. (c) Find the value of $\cos t$ for which $V$ is greatest. (d) Find the greatest volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["t"]}},{"name":"dV","contract":{"kind":"function","vars":["t"]}},{"name":"cos","contract":{"kind":"exact"}},{"name":"Vmax","contract":{"kind":"exact"}}]}
            answer: 'V = 9*pi*sin(t)^2*cos(t); dV = 9*pi*(2*sin(t)*cos(t)^2-sin(t)^3); cos = sqrt(3)/3; Vmax = 2*sqrt(3)*pi'
            solution_sketch: 'The radius is $3\sin t$ and the height is $3\cos t$. So $V = \tfrac13\pi \cdot 9\sin^2 t \cdot 3\cos t = 9\pi\sin^2 t\cos t$. The product rule gives $V'' = 9\pi(2\sin t\cos^2 t - \sin^3 t)$. Then $V'' = 0$ gives $2\cos^2 t = \sin^2 t = 1 - \cos^2 t$, so $\cos t = \tfrac{\sqrt{3}}{3}$. Here $\sin^2 t = \tfrac23$, so $V = 9\pi \cdot \tfrac23 \cdot \tfrac{\sqrt{3}}{3} = 2\sqrt{3}\pi$.'
            points: 7
          - problem: 'A box holds $3$ white discs, $5$ green discs and $4$ black discs. (a) Two discs leave the box together. Find the probability that both are green. (b) Two discs leave the box one after the other, and each disc returns before the next draw. Find the probability that both discs have the same color. (c) Three discs leave the box one after the other, and each disc returns before the next draw. Find the probability that at least one disc is white. (d) The maker adds $n$ white discs to the original box. After that, the probability of one white disc in one draw equals $\tfrac12$. Find $n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"green","contract":{"kind":"exact"}},{"name":"same","contract":{"kind":"exact"}},{"name":"white","contract":{"kind":"exact"}},{"name":"n","contract":{"kind":"exact"}}]}
            answer: 'green = 5/33; same = 25/72; white = 37/64; n = 6'
            solution_sketch: 'In part (a) the probability is $\dfrac{\binom52}{\binom{12}{2}} = \dfrac{10}{66} = \tfrac{5}{33}$. In part (b) the probability is $\tfrac{9 + 25 + 16}{144} = \tfrac{25}{72}$. In part (c) the probability is $1 - (\tfrac34)^3 = \tfrac{37}{64}$. In part (d) we solve $\tfrac{3+n}{12+n} = \tfrac12$, so $n = 6$.'
            points: 9
          - problem: 'A cone has the base radius $6$ and the height $8$. (a) Find the generatrix. (b) Find the lateral surface area. (c) Find the volume. (d) Find the radius of the sphere that touches the base and the lateral surface of the cone from inside.'
            answer_contract: {"kind":"multipart","parts":[{"name":"l","contract":{"kind":"exact"}},{"name":"lat","contract":{"kind":"exact"}},{"name":"vol","contract":{"kind":"exact"}},{"name":"r","contract":{"kind":"exact"}}]}
            answer: 'l = 10; lat = 60*pi; vol = 96*pi; r = 3'
            solution_sketch: 'The generatrix is $\sqrt{36 + 64} = 10$. The lateral area is $\pi \cdot 6 \cdot 10 = 60\pi$. The volume is $\tfrac13\pi \cdot 36 \cdot 8 = 96\pi$. The sphere has the radius of the circle inscribed in the axial section. This section has the area $48$ and the half-perimeter $16$, so $r = 48/16 = 3$.'
            points: 8
          - problem: '(a) Find the exact value of $\cos 15^\circ$. (b) Solve $\cos 2x = \cos x$ for $0 \le x \le 2\pi$. (c) Find the number of solutions of the equation of the second part on this segment.'
            answer_contract: {"kind":"multipart","parts":[{"name":"c15","contract":{"kind":"exact"}},{"name":"roots","contract":{"kind":"set"}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'c15 = (sqrt(6)+sqrt(2))/4; roots = {0, 2*pi/3, 4*pi/3, 2*pi}; count = 4'
            solution_sketch: 'Write $15^\circ = 45^\circ - 30^\circ$. The difference formula gives $\cos 15^\circ = \tfrac{\sqrt{2}}{2}\cdot\tfrac{\sqrt{3}}{2} + \tfrac{\sqrt{2}}{2}\cdot\tfrac12 = \tfrac{\sqrt{6}+\sqrt{2}}{4}$. Next, $2\cos^2 x - \cos x - 1 = 0$ gives $\cos x = 1$ or $\cos x = -\tfrac12$. On the segment the first case gives $0$ and $2\pi$. The second case gives $\tfrac{2\pi}{3}$ and $\tfrac{4\pi}{3}$.'
            points: 8
          - problem: 'A trial succeeds with the probability $\tfrac23$. Four independent trials take place. Let $X$ be the number of successes. (a) Find $P(X = 3)$. (b) Find $P(X \ge 3)$. (c) Find the expected value of $X$. (d) Find the variance of $X$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p3","contract":{"kind":"exact"}},{"name":"p34","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}},{"name":"var","contract":{"kind":"exact"}}]}
            answer: 'p3 = 32/81; p34 = 16/27; mean = 8/3; var = 8/9'
            solution_sketch: 'The formula gives $P(X=3) = 4 \cdot (\tfrac23)^3 \cdot \tfrac13 = \tfrac{32}{81}$. Also $P(X=4) = \tfrac{16}{81}$, so $P(X \ge 3) = \tfrac{48}{81} = \tfrac{16}{27}$. The mean is $np = \tfrac83$. The variance is $npq = 4 \cdot \tfrac23 \cdot \tfrac13 = \tfrac89$.'
            points: 8
        constraints: 'Three items of the form plus three spares. Each item sets up a model, solves it and reads the result. The points run from seven to nine.'
      - id: kp4
        name: 'Show that items'
        key_prerequisites: [vbe-cp03-powers, vbe-cp14-plane-vectors, vbe-cp17-limits-derivative-concept, vbe-cp18-derivative-rules, vbe-cp24-combinatorics]
        exemplars:
          - problem: 'The positive numbers $a$, $b$ and $c$ satisfy $a^3 b^2 c = 27$ and $a b^2 c^3 = 3$. Find $abc$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'Multiply the two equalities. The product is $a^4 b^4 c^4 = 81$. So $(abc)^4 = 81$, and $abc = 3$ because $abc > 0$.'
            points: 2
          - problem: 'A point moves along a line. At the time $t$ seconds its distance from the start is $s(t) = t^3 - 6t^2 + 9t$ meters. (a) Find the speed at $t = 4$. (b) Find the two moments when the speed equals $0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"v","contract":{"kind":"exact"}},{"name":"stops","contract":{"kind":"set"}}]}
            answer: 'v = 9; stops = {1, 3}'
            solution_sketch: 'The speed is $s''(t) = 3t^2 - 12t + 9$. At $t = 4$ it equals $48 - 48 + 9 = 9$. Also $s''(t) = 3(t-1)(t-3)$, which is zero at $t = 1$ and $t = 3$.'
            points: 2
          - problem: 'The vectors $\vec u$ and $\vec v$ have the lengths $|\vec u| = 3$ and $|\vec v| = 5$, and $\vec u \cdot \vec v = 6$. (a) Find $|\vec u + \vec v|^2$. (b) Find $|\vec u - \vec v|^2$. (c) Find $(\vec u + \vec v) \cdot (\vec u - \vec v)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sum","contract":{"kind":"exact"}},{"name":"diff","contract":{"kind":"exact"}},{"name":"dot","contract":{"kind":"exact"}}]}
            answer: 'sum = 46; diff = 22; dot = -16'
            solution_sketch: 'Expand the squares. We get $|\vec u + \vec v|^2 = 9 + 25 + 12 = 46$ and $|\vec u - \vec v|^2 = 9 + 25 - 12 = 22$. The product equals $|\vec u|^2 - |\vec v|^2 = 9 - 25 = -16$.'
            points: 3
          - problem: '(a) Simplify $(\sqrt{7} - 2)(\sqrt{7} + 2)$. (b) Expand $(\sqrt{5} + 1)^2$. (c) Expand $(1 + \sqrt{2})^3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 6+2*sqrt(5); c = 7+5*sqrt(2)'
            solution_sketch: 'In part (a) the product equals $7 - 4 = 3$. In part (b) we get $5 + 2\sqrt{5} + 1 = 6 + 2\sqrt{5}$. In part (c) the cube formula gives $1 + 3\sqrt{2} + 3 \cdot 2 + 2\sqrt{2} = 7 + 5\sqrt{2}$.'
            points: 3
          - problem: 'Take $h(x) = \dfrac{x}{x^2+1}$. (a) Find $h''(x)$. (b) Find the two values of $x$ for which $h''(x) = 0$. (c) Find the greater value of $h$ at these two points.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"zeros","contract":{"kind":"set"}},{"name":"top","contract":{"kind":"exact"}}]}
            answer: 'd = (1-x^2)/(x^2+1)^2; zeros = {-1, 1}; top = 1/2'
            solution_sketch: 'The quotient rule gives $h''(x) = \dfrac{(x^2+1) - 2x^2}{(x^2+1)^2} = \dfrac{1-x^2}{(x^2+1)^2}$. The numerator is zero at $x = -1$ and $x = 1$. Also $h(1) = \tfrac12$ and $h(-1) = -\tfrac12$.'
            points: 4
          - problem: '(a) Find $C_7^3$. (b) Find $A_7^3$. (c) Find the coefficient of $x^3$ in the expansion of $(x+2)^5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"c","contract":{"kind":"exact"}},{"name":"a","contract":{"kind":"exact"}},{"name":"coef","contract":{"kind":"exact"}}]}
            answer: 'c = 35; a = 210; coef = 40'
            solution_sketch: 'We have $C_7^3 = \dfrac{7!}{3!\,4!} = 35$ and $A_7^3 = 7 \cdot 6 \cdot 5 = 210$. The term with $x^3$ in $(x+2)^5$ is $C_5^3 x^3 \cdot 2^2$. The coefficient is $10 \cdot 4 = 40$.'
            points: 3
          - problem: 'Prove that the equation $x^3 - 3x + 3 = 0$ has no root in the interval $(0, 1)$.'
            answer_contract: {"kind":"written"}
            answer: 'Let $f(x) = x^3 - 3x + 3$. The derivative is $f''(x) = 3x^2 - 3 = 3(x-1)(x+1)$. It is negative on $(0, 1)$, so $f$ decreases there. We have $f(0) = 3$ and $f(1) = 1$. So $f(x) > f(1) = 1 > 0$ for every $x$ in $(0, 1)$, and $f$ has no root there.'
            solution_sketch: 'Take the derivative. Find its sign on the interval. Compare the values at the ends.'
            points: 4
          - problem: 'Prove with vectors that the opposite edges $AB$ and $CD$ of a regular tetrahedron $ABCD$ are perpendicular.'
            answer_contract: {"kind":"written"}
            answer: 'Let $\vec{AB} = \vec p$, $\vec{AC} = \vec q$ and $\vec{AD} = \vec r$. Each of these vectors has the length $a$, the edge length. Each angle between two of them is $60^\circ$, so $\vec p \cdot \vec q = \vec p \cdot \vec r = \tfrac{a^2}{2}$. Then $\vec{CD} = \vec r - \vec q$. So $\vec{AB} \cdot \vec{CD} = \vec p \cdot \vec r - \vec p \cdot \vec q = 0$, and the edges are perpendicular.'
            solution_sketch: 'Write the edges as vectors from one vertex. Find their scalar products. Multiply the two opposite edges.'
            points: 3
          - problem: 'Prove that $\cos 3\alpha = 4\cos^3\alpha - 3\cos\alpha$ for every angle $\alpha$.'
            answer_contract: {"kind":"written"}
            answer: 'Write $\cos 3\alpha = \cos(2\alpha + \alpha) = \cos 2\alpha\cos\alpha - \sin 2\alpha\sin\alpha$. Use $\cos 2\alpha = 2\cos^2\alpha - 1$ and $\sin 2\alpha = 2\sin\alpha\cos\alpha$. Then the difference is $2\cos^3\alpha - \cos\alpha - 2\sin^2\alpha\cos\alpha$. Put $\sin^2\alpha = 1 - \cos^2\alpha$. The difference becomes $2\cos^3\alpha - \cos\alpha - 2\cos\alpha + 2\cos^3\alpha = 4\cos^3\alpha - 3\cos\alpha$.'
            solution_sketch: 'Split the angle as $2\alpha + \alpha$. Use the sum and double-angle formulas. Replace the sine square.'
            points: 4
        constraints: 'Two items of the form plus four spares ask for the value that one step of a proof produces. The last three items ask for a full proof.'
    diagnostic_exemplar:
      problem: 'Find $\log_5 125 - \log_5 5$.'
      answer_contract: {"kind":"exact"}
      answer: '2'
      solution_sketch: 'We have $\log_5 125 = 3$ and $\log_5 5 = 1$. The difference equals $2$.'
