    knowledge_points:
      - id: kp1
        name: 'Short answers'
        key_prerequisites: [vbe-cp01-number-sets, vbe-cp02-modulus, vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp20-integral, vbe-cp24-combinatorics]
        exemplars:
          - problem: 'Find the intersection of the intervals $(-3; 5]$ and $[1; 9)$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '1 <= x <= 5'
            solution_sketch: 'A number belongs to both intervals if $x > -3$, $x \le 5$, $x \ge 1$ and $x < 9$. The tight bounds are $1$ and $5$. The intersection is $[1; 5]$.'
            points: 1
          - problem: 'Find the value of $\sqrt{(3-\sqrt{13})^2}$.'
            answer_contract: {"kind":"exact"}
            answer: 'sqrt(13)-3'
            solution_sketch: 'The root of a square equals the modulus of the base. We have $3 - \sqrt{13} < 0$. So the value is $\sqrt{13} - 3$.'
            points: 1
          - problem: 'Find the base $a$ for which $\log_a \tfrac18 = -3$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'The definition gives $a^{-3} = \tfrac18$. So $a^3 = 8$ and $a = 2$.'
            points: 1
          - problem: 'Simplify $\dfrac{14}{\sqrt{8}}$ so that the denominator has no root.'
            answer_contract: {"kind":"exact"}
            answer: '7*sqrt(2)/2'
            solution_sketch: 'We have $\sqrt 8 = 2\sqrt 2$. So the fraction equals $\tfrac{7}{\sqrt 2}$. Multiply the top and the bottom by $\sqrt 2$ to get $\tfrac{7\sqrt2}{2}$.'
            points: 1
          - problem: 'A code has $5$ digits from $0$ to $9$. The digits repeat freely. The first digit is odd and the last digit is even. How many such codes exist?'
            answer_contract: {"kind":"exact"}
            answer: '25000'
            solution_sketch: 'The first digit has $5$ choices and the last digit has $5$ choices. Each of the three middle digits has $10$ choices. The count is $5 \cdot 10^3 \cdot 5 = 25000$.'
            points: 1
          - problem: 'An arithmetic progression starts with the terms $11, 8, 5, \dots$. Write the formula for $a_n$ in terms of $n$.'
            answer_contract: {"kind":"function","vars":["n"]}
            answer: '14-3*n'
            solution_sketch: 'The difference is $d = 8 - 11 = -3$. So $a_n = 11 - 3(n-1)$. This simplifies to $14 - 3n$.'
            points: 1
          - problem: 'Rotate the point $(1; 0)$ about the origin through the angle $-120^\circ$. Find the ordinate of the new point.'
            answer_contract: {"kind":"exact"}
            answer: '-sqrt(3)/2'
            solution_sketch: 'The ordinate of the new point is $\sin(-120^\circ)$. The sine is odd, so this equals $-\sin 120^\circ$. We have $\sin 120^\circ = \tfrac{\sqrt3}{2}$.'
            points: 1
          - problem: 'Find the antiderivative $F$ of $f(x) = \cos x$ whose graph passes through the point $(\tfrac{\pi}{2}; 3)$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: 'sin(x)+2'
            solution_sketch: 'All antiderivatives are $F(x) = \sin x + C$. The condition gives $\sin\tfrac{\pi}{2} + C = 3$, so $C = 2$.'
            points: 1
          - problem: 'The independent events $A$ and $B$ have $P(A) = \tfrac34$ and $P(B) = \tfrac25$. Find the probability that $A$ occurs and $B$ does not occur.'
            answer_contract: {"kind":"exact"}
            answer: '9/20'
            solution_sketch: 'The probability that $B$ does not occur is $1 - \tfrac25 = \tfrac35$. The events are independent, so we multiply: $\tfrac34 \cdot \tfrac35 = \tfrac{9}{20}$.'
            points: 1
          - problem: 'Let $f(x) = x^3 - 12x$. Find the interval where $f''(x) < 0$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-2 < x < 2'
            solution_sketch: 'We have $f''(x) = 3x^2 - 12 = 3(x-2)(x+2)$. The product is negative between the roots. The interval is $-2 < x < 2$.'
            points: 1
        constraints: 'Ten short items of one point. Each item tests one skill and has a short answer. The areas follow the first ten tasks of the paper.'
      - id: kp2
        name: 'Structured open items'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp13-inequalities, vbe-cp14-plane-vectors, vbe-cp18-derivative-rules, vbe-cp19-function-study, vbe-cp20-integral]
        exemplars:
          - problem: 'In an equilateral triangle $ABC$ the side is $6$. The point $K$ lies on the side $BC$ with $|BK| : |KC| = 1 : 2$. Write $\vec{AK} = p\,\vec{AB} + q\,\vec{AC}$. (a) Find $p$. (b) Find $q$. (c) Find the scalar product $\vec{AB} \cdot \vec{AC}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"q","contract":{"kind":"exact"}},{"name":"dot","contract":{"kind":"exact"}}]}
            answer: 'p = 2/3; q = 1/3; dot = 18'
            solution_sketch: 'We have $\vec{AK} = \vec{AB} + \tfrac13 \vec{BC} = \vec{AB} + \tfrac13(\vec{AC} - \vec{AB})$. So $p = \tfrac23$ and $q = \tfrac13$. The angle at $A$ is $60^\circ$, so the scalar product is $6 \cdot 6 \cdot \tfrac12 = 18$.'
            points: 4
          - problem: '(a) Solve $\dfrac{x+1}{x-3} \le 2$. (b) Solve $\tan x \ge \sqrt{3}$ for $-\tfrac{\pi}{2} < x < \tfrac{\pi}{2}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"rat","contract":{"kind":"inequality_union"}},{"name":"tan","contract":{"kind":"inequality_union"}}]}
            answer: 'rat = x < 3 or x >= 7; tan = pi/3 <= x < pi/2'
            solution_sketch: 'Move $2$ to the left: $\tfrac{7-x}{x-3} \le 0$. The sign changes at $3$ and $7$. So $x < 3$ or $x \ge 7$. The tangent increases on the interval and $\tan\tfrac{\pi}{3} = \sqrt3$. So $\tfrac{\pi}{3} \le x < \tfrac{\pi}{2}$.'
            points: 5
          - problem: 'Let $f(x) = x^2 - 8\ln x$ for $x > 0$. (a) Find $f''(x)$. (b) Find the critical point of $f$. (c) Find the value of $f$ at the critical point.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"xc","contract":{"kind":"exact"}},{"name":"fc","contract":{"kind":"exact"}}]}
            answer: 'd = 2*x-8/x; xc = 2; fc = 4-8*ln(2)'
            solution_sketch: 'We have $f''(x) = 2x - \tfrac{8}{x}$. The equation $f''(x) = 0$ gives $x^2 = 4$. Only $x = 2$ is positive. Then $f(2) = 4 - 8\ln 2$.'
            points: 3
          - problem: 'An infinite geometric progression has $b_1 = 6$ and $b_2 = \log_3 a$ with $a > 0$. The sum of all its terms is $9$. (a) Find the ratio $q$. (b) Find $a$. (c) Find $b_3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"q","contract":{"kind":"exact"}},{"name":"a","contract":{"kind":"exact"}},{"name":"b3","contract":{"kind":"exact"}}]}
            answer: 'q = 1/3; a = 9; b3 = 2/3'
            solution_sketch: 'The sum is $\tfrac{6}{1-q} = 9$, so $q = \tfrac13$. Then $b_2 = 2$, so $\log_3 a = 2$ and $a = 9$. Also $b_3 = 2 \cdot \tfrac13 = \tfrac23$.'
            points: 4
          - problem: 'Nine robots clean a hall. The robots join one after another at equal time intervals. All robots stop at the same moment. The first robot works $5$ times as long as the last robot. The work times of all robots sum to $108$ hours. (a) Find the work time of the last robot in hours. (b) Find the work time of the first robot in hours. (c) Find the time between two joins in hours.'
            answer_contract: {"kind":"multipart","parts":[{"name":"last","contract":{"kind":"exact"}},{"name":"first","contract":{"kind":"exact"}},{"name":"gap","contract":{"kind":"exact"}}]}
            answer: 'last = 4; first = 20; gap = 2'
            solution_sketch: 'The work times form an arithmetic progression with $a_1 = 5a_9$. The sum is $\tfrac{9(a_1 + a_9)}{2} = 27a_9 = 108$, so $a_9 = 4$ and $a_1 = 20$. The difference is $\tfrac{4-20}{8} = -2$, so the gap is $2$ hours.'
            points: 5
          - problem: 'A cylinder has the radius $3$ cm and the height $10$ cm. (a) Find the lateral area of the cylinder. (b) Find the volume of the cylinder. (c) Find the area of the axial section.'
            answer_contract: {"kind":"multipart","parts":[{"name":"lat","contract":{"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}},{"name":"vol","contract":{"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}},{"name":"sec","contract":{"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}}]}
            answer: 'lat = 60*pi cm^2; vol = 90*pi cm^3; sec = 60 cm^2'
            solution_sketch: 'The lateral area is $2\pi RH = 60\pi$. The volume is $\pi R^2 H = 90\pi$. The axial section is a rectangle with the sides $6$ and $10$, so its area is $60$.'
            points: 3
        constraints: 'Five items of the form plus one spare. Each item has two to four parts. The points run from three to five.'
      - id: kp3
        name: 'Long open items'
        key_prerequisites: [vbe-cp09-elementary-functions, vbe-cp16-trig-equations, vbe-cp20-integral, vbe-cp23-solids, vbe-cp25-probability-models, vbe-cp26-random-variables]
        exemplars:
          - problem: 'The graph of $f(x) = 3 - e^{x}$ meets the $Oy$ axis at the point $P$. (a) Find the ordinate of $P$. (b) Write the equation of the tangent to the graph at $P$ in the form $y = \dots$. (c) Find the abscissa of the common point of the graph and the $Ox$ axis. (d) Find the area of the region bounded by the graph, the tangent and the $Ox$ axis.'
            answer_contract: {"kind":"multipart","parts":[{"name":"yP","contract":{"kind":"exact"}},{"name":"tangent","contract":{"kind":"function","vars":["x"]}},{"name":"x0","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'yP = 2; tangent = 2-x; x0 = ln(3); area = 4-3*ln(3)'
            solution_sketch: 'We have $f(0) = 2$. Then $f''(x) = -e^x$ and $f''(0) = -1$, so the tangent is $y = 2 - x$. The equation $e^x = 3$ gives $x = \ln 3$. The tangent is above the graph. The area is $\int_0^2 (2-x)\,dx - \int_0^{\ln 3} (3 - e^x)\,dx = 2 - (3\ln 3 - 2) = 4 - 3\ln 3$.'
            points: 9
          - problem: 'Two players play single games. Each game ends with a win of one player, each with the probability $\tfrac12$. The games are independent. (a) Find the probability that the first player wins exactly three of the first four games. (b) A match ends when one player has $3$ wins. Find the probability that the match lasts exactly $4$ games. (c) The number $N$ of games in a match takes the values $3$, $4$ and $5$ with the probabilities $2k$, $3k$ and $3k$. Find $k$. (d) Find the expected value of $N$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p3of4","contract":{"kind":"exact"}},{"name":"p4","contract":{"kind":"exact"}},{"name":"k","contract":{"kind":"exact"}},{"name":"EN","contract":{"kind":"exact"}}]}
            answer: 'p3of4 = 1/4; p4 = 3/8; k = 1/8; EN = 33/8'
            solution_sketch: 'The probability in (a) is $\binom43 \cdot \tfrac1{16} = \tfrac14$. For (b), one player wins the fourth game and has exactly two wins in the first three games: $2 \cdot \tfrac{3}{16} = \tfrac38$. The probabilities sum to $1$, so $8k = 1$. Then $EN = 3 \cdot \tfrac14 + 4 \cdot \tfrac38 + 5 \cdot \tfrac38 = \tfrac{33}{8}$.'
            points: 7
          - problem: 'A cone has the generatrix $6$ and the base radius $r$ with $0 < r < 6$. (a) Write the volume $V$ as a function of $r$. (b) Find the radius for which $V$ is greatest. (c) Find the greatest volume. (d) For this radius, find the cosine of the angle between the generatrix and the base plane. (e) For this radius, find the area of the axial section.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["r"]}},{"name":"rmax","contract":{"kind":"exact"}},{"name":"Vmax","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}},{"name":"sec","contract":{"kind":"exact"}}]}
            answer: 'V = pi*r^2*sqrt(36-r^2)/3; rmax = 2*sqrt(6); Vmax = 16*sqrt(3)*pi; cos = sqrt(6)/3; sec = 12*sqrt(2)'
            solution_sketch: 'The height is $\sqrt{36 - r^2}$, so $V = \tfrac13 \pi r^2 \sqrt{36 - r^2}$. The square of $V$ is proportional to $u^2(36-u)$ with $u = r^2$. Its derivative $72u - 3u^2$ is zero at $u = 24$, so $r = 2\sqrt6$. Then $h = \sqrt{12} = 2\sqrt3$ and $V = \tfrac13 \pi \cdot 24 \cdot 2\sqrt3 = 16\sqrt3\pi$. The cosine is $r/6 = \sqrt6/3$. The axial section has the area $r h = 12\sqrt2$.'
            points: 9
          - problem: '(a) Solve $2\cos^2 x - \cos x - 1 = 0$ for $0 \le x \le 2\pi$. (b) How many solutions does the equation have in this interval? (c) Find the sum of these solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"roots","contract":{"kind":"set"}},{"name":"count","contract":{"kind":"exact"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'roots = {0, 2*pi/3, 4*pi/3, 2*pi}; count = 4; sum = 4*pi'
            solution_sketch: 'Let $t = \cos x$. Then $2t^2 - t - 1 = 0$ gives $t = 1$ or $t = -\tfrac12$. On $[0, 2\pi]$ the first value gives $0$ and $2\pi$. The second value gives $\tfrac{2\pi}{3}$ and $\tfrac{4\pi}{3}$. The sum is $4\pi$.'
            points: 7
          - problem: 'A regular triangular pyramid has all edges equal to $6$. (a) Find its height. (b) Find its volume. (c) Find the cosine of the angle between a lateral edge and the base plane. (d) Find the cosine of the angle between a lateral face and the base plane.'
            answer_contract: {"kind":"multipart","parts":[{"name":"h","contract":{"kind":"exact"}},{"name":"V","contract":{"kind":"exact"}},{"name":"cosedge","contract":{"kind":"exact"}},{"name":"cosface","contract":{"kind":"exact"}}]}
            answer: 'h = 2*sqrt(6); V = 18*sqrt(2); cosedge = sqrt(3)/3; cosface = 1/3'
            solution_sketch: 'The foot of the height is the center of the base. Its distance to a vertex is $2\sqrt3$, so $h = \sqrt{36 - 12} = 2\sqrt6$. The base area is $9\sqrt3$, so $V = \tfrac13 \cdot 9\sqrt3 \cdot 2\sqrt6 = 18\sqrt2$. The edge cosine is $2\sqrt3/6 = \sqrt3/3$. The distance from the center to a side is $\sqrt3$ and the face height is $3\sqrt3$, so the face cosine is $\tfrac13$.'
            points: 9
          - problem: 'A box holds $4$ white balls and $6$ black balls. Three balls leave the box without return. Let $X$ be the number of white balls among them. (a) Find $P(X = 0)$. (b) Find $P(X = 1)$. (c) Find $P(X = 2)$. (d) Find the expected value of $X$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p0","contract":{"kind":"exact"}},{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"EX","contract":{"kind":"exact"}}]}
            answer: 'p0 = 1/6; p1 = 1/2; p2 = 3/10; EX = 6/5'
            solution_sketch: 'There are $\binom{10}{3} = 120$ ways. We have $P(X=0) = \tfrac{20}{120} = \tfrac16$ and $P(X=1) = \tfrac{4 \cdot 15}{120} = \tfrac12$ and $P(X=2) = \tfrac{6 \cdot 6}{120} = \tfrac3{10}$. Also $P(X=3) = \tfrac1{30}$. The mean is $\tfrac{60 + 72 + 12}{120} = \tfrac65$.'
            points: 8
        constraints: 'Three items of the form plus three spares. Each item sets up a model, solves it and reads the result. The points run from seven to nine.'
      - id: kp4
        name: 'Show that items'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp14-plane-vectors, vbe-cp15-trig-expressions, vbe-cp18-derivative-rules]
        exemplars:
          - problem: 'Simplify $\cos^4 x - \sin^4 x + 2\sin^2 x$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'Factor the difference of squares: $\cos^4 x - \sin^4 x = (\cos^2 x - \sin^2 x)(\cos^2 x + \sin^2 x) = \cos^2 x - \sin^2 x$. Add $2\sin^2 x$ to get $\cos^2 x + \sin^2 x = 1$.'
            points: 2
          - problem: 'The base of a pyramid $SABCD$ is a square with the side $8$. The point $M$ is the midpoint of $SA$ and the point $N$ is the midpoint of $SC$. Find the length of the segment $MN$.'
            answer_contract: {"kind":"exact"}
            answer: '4*sqrt(2)'
            solution_sketch: 'The segment $MN$ is a midline of the triangle $SAC$. So $|MN| = \tfrac12 |AC|$. The diagonal is $|AC| = 8\sqrt2$, so $|MN| = 4\sqrt2$.'
            points: 2
          - problem: 'Take $f(x) = x^3 - 3x^2$. (a) Find $f''(x)$. (b) Find the roots of the equation $f''(x) = 0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"roots","contract":{"kind":"set"}}]}
            answer: 'd = 3*x^2-6*x; roots = {0, 2}'
            solution_sketch: 'The power rule gives $f''(x) = 3x^2 - 6x$. We have $3x(x-2) = 0$, so $x = 0$ or $x = 2$.'
            points: 2
          - problem: '(a) Find the value of $\sin 15^\circ \cos 15^\circ$. (b) Find the value of $\cos^2 15^\circ - \sin^2 15^\circ$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 1/4; b = sqrt(3)/2'
            solution_sketch: 'The double-angle formula gives $\sin 15^\circ \cos 15^\circ = \tfrac12 \sin 30^\circ = \tfrac14$. Also $\cos^2 15^\circ - \sin^2 15^\circ = \cos 30^\circ = \tfrac{\sqrt3}{2}$.'
            points: 3
          - problem: 'An arithmetic progression has $a_1 = 1$ and the difference $d = 2$. (a) Write $a_n$ in terms of $n$. (b) Write the sum $S_n$ of the first $n$ terms in terms of $n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"an","contract":{"kind":"function","vars":["n"]}},{"name":"Sn","contract":{"kind":"function","vars":["n"]}}]}
            answer: 'an = 2*n-1; Sn = n^2'
            solution_sketch: 'We have $a_n = 1 + 2(n-1) = 2n - 1$. Then $S_n = \tfrac{(1 + 2n - 1)}{2} \cdot n = n^2$.'
            points: 3
          - problem: 'The vectors $\vec a$ and $\vec b$ have $|\vec a| = 3$ and $|\vec b| = 5$. The angle between them is $60^\circ$. (a) Find $\vec a \cdot \vec b$. (b) Find $|\vec a + \vec b|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"dot","contract":{"kind":"exact"}},{"name":"len","contract":{"kind":"exact"}}]}
            answer: 'dot = 15/2; len = 7'
            solution_sketch: 'The scalar product is $3 \cdot 5 \cdot \tfrac12 = \tfrac{15}{2}$. Then $|\vec a + \vec b|^2 = 9 + 25 + 2 \cdot \tfrac{15}{2} = 49$, so the length is $7$.'
            points: 3
          - problem: 'Prove that the function $f(x) = 2x^3 + 6x$ has no extremum point.'
            answer_contract: {"kind":"written"}
            answer: 'The derivative is $f''(x) = 6x^2 + 6$. A square is not negative, so $f''(x) \ge 6 > 0$ for every real $x$. An extremum point needs $f''(x) = 0$. The equation $f''(x) = 0$ has no solution. So $f$ has no extremum point.'
            solution_sketch: 'Take the derivative. Show that it is never zero. Use the condition for an extremum.'
            points: 3
          - problem: 'Prove that $\sqrt{7}$ is an irrational number.'
            answer_contract: {"kind":"written"}
            answer: 'Assume that $\sqrt7 = p/q$ with positive integers $p$ and $q$ that have no common divisor. Then $p^2 = 7q^2$, so $7$ divides $p^2$ and $7$ divides $p$. Write $p = 7m$. Then $q^2 = 7m^2$, so $7$ divides $q$. This contradicts the choice of $p$ and $q$. So $\sqrt7$ is irrational.'
            solution_sketch: 'Assume a fraction in lowest terms. Show that $7$ divides both integers. State the contradiction.'
            points: 3
          - problem: 'Prove that all lateral edges of a regular pyramid make equal angles with the base plane.'
            answer_contract: {"kind":"written"}
            answer: 'The foot $O$ of the height is the center of the circle around the base. So the distances from $O$ to all base vertices are equal to the radius $R$. A lateral edge, its projection of length $R$ and the height form a right triangle. The height is the same for all edges, and so is $R$. So all these triangles are equal and all the angles are equal.'
            solution_sketch: 'Locate the foot of the height. Compare the right triangles. Use the equal legs.'
            points: 3
        constraints: 'Two items of the form plus four spares ask for the value that one step of a proof produces. The last three items ask for a full proof.'
    diagnostic_exemplar:
      problem: 'Find $\log_3 81$.'
      answer_contract: {"kind":"exact"}
      answer: '4'
      solution_sketch: 'We have $81 = 3^4$. So the logarithm equals $4$.'
