          - problem: 'Find the union of the intervals $(-4; 2)$ and $[1; 6)$. Write it as an inequality for $x$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-4 < x < 6'
            solution_sketch: 'The intervals overlap on $[1; 2)$. So the union starts at $-4$ and ends at $6$, and the end $6$ stays open.'
            points: 1
          - problem: 'Solve $0.5^{2x-1} = 8$.'
            answer_contract: {"kind":"exact"}
            answer: '-1'
            solution_sketch: 'We have $0.5^{2x-1} = 2^{1-2x}$ and $8 = 2^3$. So $1 - 2x = 3$ and $x = -1$.'
            points: 1
          - problem: 'The angle $\alpha$ lies in the fourth quadrant and $\cos\alpha = \tfrac{8}{17}$. Find $\sin\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '-15/17'
            solution_sketch: 'We have $\sin^2\alpha = 1 - \tfrac{64}{289} = \tfrac{225}{289}$. The sine is negative in the fourth quadrant. So $\sin\alpha = -\tfrac{15}{17}$.'
            points: 1
          - problem: 'Solve $(x^2 - 9)\sqrt{x+2} = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{-2, 3}'
            solution_sketch: 'The domain needs $x \ge -2$. A factor is zero when $x = \pm 3$ or $x = -2$. The root $x = -3$ is outside the domain. The solutions are $-2$ and $3$.'
            points: 1
          - problem: 'Simplify $\cos(x + 4\pi) + \cos(-x)$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '2*cos(x)'
            solution_sketch: 'The cosine has period $2\pi$, so $\cos(x + 4\pi) = \cos x$. The cosine is even, so $\cos(-x) = \cos x$. The sum is $2\cos x$.'
            points: 1
          - problem: 'The vectors $\vec a = (3; k)$ and $\vec b = (4; -2)$ have the scalar product $2$. Find $k$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'The scalar product is $3 \cdot 4 + k \cdot (-2) = 12 - 2k$. Then $12 - 2k = 2$ and $k = 5$.'
            points: 1
          - problem: 'Write $\sqrt[4]{x^{3}\sqrt[3]{x}}$ as $x^{r}$ for $x > 0$. Find $r$.'
            answer_contract: {"kind":"exact"}
            answer: '5/6'
            solution_sketch: 'The inner part is $x^3 \cdot x^{1/3} = x^{10/3}$. The fourth root gives the exponent $\tfrac{10}{3} \cdot \tfrac14 = \tfrac56$.'
            points: 1
          - problem: 'Simplify $\sqrt{(x-6)^2} - 2x$ for $x > 6$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '-x-6'
            solution_sketch: 'For $x > 6$ we have $\sqrt{(x-6)^2} = |x-6| = x - 6$. So the expression equals $x - 6 - 2x = -x - 6$.'
            points: 1
          - problem: 'In an arithmetic progression $a_3 = 9$ and $a_7 = 25$. Find $a_5$.'
            answer_contract: {"kind":"exact"}
            answer: '17'
            solution_sketch: 'The term $a_5$ is the mean of $a_3$ and $a_7$. So $a_5 = (9 + 25)/2 = 17$.'
            points: 1
          - problem: 'A random variable takes the values $0$, $1$, $2$ and $3$ with the probabilities $\tfrac16$, $p$, $\tfrac13$ and $\tfrac14$. Find $p$.'
            answer_contract: {"kind":"exact"}
            answer: '1/4'
            solution_sketch: 'The probabilities sum to $1$. So $p = 1 - \tfrac{2+4+3}{12} = \tfrac14$.'
            points: 1
        constraints: 'Ten short items of one point. Each item tests one skill and has a short answer. The areas follow the first ten tasks of the paper.'
      - id: kp2
        name: 'Structured open items'
        key_prerequisites: [vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp13-inequalities, vbe-cp23-solids, vbe-cp24-combinatorics, vbe-cp25-probability-models]
        exemplars:
          - problem: 'The digits $1, 2, 3, 4, 6, 8$ build four-digit numbers. Each number has four different digits. (a) How many numbers are greater than $5000$? (b) How many numbers are there in all? (c) One of these numbers is picked at random. Find the probability that it is not greater than $5000$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"above","contract":{"kind":"exact"}},{"name":"all","contract":{"kind":"exact"}},{"name":"p","contract":{"kind":"exact"}}]}
            answer: 'above = 120; all = 360; p = 2/3'
            solution_sketch: 'A number above $5000$ starts with $6$ or $8$. This gives $2 \cdot 5 \cdot 4 \cdot 3 = 120$ numbers. In all there are $6 \cdot 5 \cdot 4 \cdot 3 = 360$ numbers. The other $240$ numbers are not above $5000$, so $p = 240/360 = 2/3$.'
            points: 4
          - problem: 'A bag holds $3$ red balls and some green balls. Two balls leave the bag together at random. The probability that both are red equals $\tfrac15$. (a) Find the number of green balls. (b) Find the probability that the two balls have different colors. (c) Find the expected number of red balls among the two.'
            answer_contract: {"kind":"multipart","parts":[{"name":"green","contract":{"kind":"exact"}},{"name":"diff","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}}]}
            answer: 'green = 3; diff = 3/5; mean = 1'
            solution_sketch: 'Let the bag hold $N$ balls. Then $3/\binom{N}{2} = \tfrac15$, so $N(N-1) = 30$ and $N = 6$. The bag holds $3$ green balls. Different colors: $3 \cdot 3/\binom62 = 9/15 = 3/5$. The mean is $2 \cdot \tfrac36 = 1$.'
            points: 4
          - problem: 'A cylinder has the base radius $3$ cm and the height $6$ cm. (a) Find its lateral surface area. (b) A cone has the same base radius. The axial section of the cone has the same area as the axial section of the cylinder. Find the height of the cone. (c) Find the lateral surface area of the cone.'
            answer_contract: {"kind":"multipart","parts":[{"name":"lat","contract":{"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}},{"name":"H","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}},{"name":"cone","contract":{"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}}]}
            answer: 'lat = 36*pi cm^2; H = 12 cm; cone = 9*sqrt(17)*pi cm^2'
            solution_sketch: 'The lateral area of the cylinder is $2\pi \cdot 3 \cdot 6 = 36\pi$. Its axial section has the area $6 \cdot 6 = 36$. The cone section has the area $\tfrac12 \cdot 6 \cdot H = 36$, so $H = 12$. The generatrix is $\sqrt{9 + 144} = 3\sqrt{17}$, so the lateral area is $\pi \cdot 3 \cdot 3\sqrt{17}$.'
            points: 4
          - problem: '(a) Solve $\dfrac{x-2}{x+4} < 0$. (b) Find the values of $x$ for which $\log_{1/2} x + \log_{1/2}(x-2)$ is defined. (c) Solve $\log_{1/2} x + \log_{1/2}(x-2) > -3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"dom","contract":{"kind":"inequality_union"}},{"name":"c","contract":{"kind":"inequality_union"}}]}
            answer: 'a = -4 < x < 2; dom = x > 2; c = 2 < x < 4'
            solution_sketch: 'The fraction is negative between the zeros of the numerator and the denominator: $-4 < x < 2$. The logarithms need $x > 0$ and $x - 2 > 0$, so $x > 2$. The sum equals $\log_{1/2}(x(x-2))$. The base is below $1$, so $x(x-2) < 8$, and then $-2 < x < 4$. With the domain, $2 < x < 4$.'
            points: 4
          - problem: '(a) Simplify $\sqrt{75} - \sqrt{12}$. (b) Solve $\sqrt{2x+3} = x$. (c) Solve $9^x - 4 \cdot 3^x + 3 = 0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"set"}}]}
            answer: 'a = 3*sqrt(3); b = 3; c = {0, 1}'
            solution_sketch: 'We have $\sqrt{75} = 5\sqrt{3}$ and $\sqrt{12} = 2\sqrt{3}$. Squaring the equation gives $x^2 = 2x + 3$, so $x = 3$ or $x = -1$. The root $-1$ fails, because a root is not negative. Put $t = 3^x$: then $t^2 - 4t + 3 = 0$, so $t = 1$ or $t = 3$ and $x = 0$ or $x = 1$.'
            points: 4
          - problem: 'A regular triangular prism has the base side $6$ cm and the lateral edge $5$ cm. (a) Find the area of the base. (b) Find the lateral surface area. (c) Find the volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"base","contract":{"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}},{"name":"lat","contract":{"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}},{"name":"V","contract":{"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}}]}
            answer: 'base = 9*sqrt(3) cm^2; lat = 90 cm^2; V = 45*sqrt(3) cm^3'
            solution_sketch: 'The base is an equilateral triangle with the area $\tfrac{\sqrt3}{4} \cdot 36 = 9\sqrt{3}$. The lateral surface has three rectangles: $3 \cdot 6 \cdot 5 = 90$. The volume is $9\sqrt{3} \cdot 5 = 45\sqrt{3}$.'
            points: 5
        constraints: 'Five items of the form plus one spare. Each item has three parts. The points run from four to five.'
      - id: kp3
        name: 'Long open items'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp10-trig-functions, vbe-cp16-trig-equations, vbe-cp18-derivative-rules, vbe-cp20-integral, vbe-cp22-space-angles, vbe-cp26-random-variables]
        exemplars:
          - problem: 'Take $f(x) = x^3 - 3x^2 - 9x + 5$. (a) Find $f''(2)$. (b) Find the interval where $f$ decreases. (c) Write the equation of the tangent line at the point with the abscissa $0$ as $y = \ldots$ in terms of $x$. (d) Find the area of the region between the $x$ axis and the curve $y = f''(x) + 12$ for $0 \le x \le 3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"v","contract":{"kind":"exact"}},{"name":"dec","contract":{"kind":"inequality_union"}},{"name":"tan","contract":{"kind":"function","vars":["x"]}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'v = -9; dec = -1 < x < 3; tan = -9*x+5; area = 9'
            solution_sketch: 'The derivative is $f''(x) = 3x^2 - 6x - 9$, so $f''(2) = -9$. We have $f''(x) = 3(x-3)(x+1)$, which is negative for $-1 < x < 3$. At $x = 0$ the value is $f(0) = 5$ and the slope is $f''(0) = -9$, so $y = -9x + 5$. Also $f''(x) + 12 = 3(x-1)^2$, and its integral from $0$ to $3$ is $[(x-1)^3]_0^3 = 8 + 1 = 9$.'
            points: 9
          - problem: '(a) Find the value of $\cos\tfrac{2\pi}{3} + \tan\tfrac{\pi}{3} \cdot \sin\tfrac{\pi}{6}$. (b) Solve $2\sin x = \sqrt{3}$ for $0 \le x \le 2\pi$. (c) Solve $2\cos^2 x + \cos x - 1 = 0$ for $0 \le x \le 2\pi$. (d) Take $f(x) = x + 2\cos x$. Solve $f''(x) > 0$ for $-\tfrac{\pi}{2} < x < \tfrac{\pi}{2}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"val","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"set"}},{"name":"c","contract":{"kind":"set"}},{"name":"d","contract":{"kind":"inequality_union"}}]}
            answer: 'val = (sqrt(3)-1)/2; b = {pi/3, 2*pi/3}; c = {pi/3, pi, 5*pi/3}; d = -pi/2 < x < pi/6'
            solution_sketch: 'The table gives $-\tfrac12 + \sqrt{3} \cdot \tfrac12 = \tfrac{\sqrt3 - 1}{2}$. Next, $\sin x = \tfrac{\sqrt3}{2}$ gives $x = \tfrac\pi3$ or $x = \tfrac{2\pi}{3}$. The third equation factors as $(2\cos x - 1)(\cos x + 1) = 0$, so $\cos x = \tfrac12$ or $\cos x = -1$. The derivative is $1 - 2\sin x$, which is positive when $\sin x < \tfrac12$, so $x < \tfrac\pi6$.'
            points: 8
          - problem: 'A rectangular box $ABCDA_1B_1C_1D_1$ has $|AB| = 3$ cm, $|AD| = 4$ cm and $|AA_1| = 12$ cm. (a) Find the length of the space diagonal $AC_1$. (b) Find the sine of the angle between $AC_1$ and the base plane $ABCD$. (c) Find the area of the section $ACC_1A_1$. (d) Find the distance from $B$ to the plane of this section.'
            answer_contract: {"kind":"multipart","parts":[{"name":"diag","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}},{"name":"sin","contract":{"kind":"exact"}},{"name":"sec","contract":{"kind":"unit","quantity":"area","unit":"cm^2","allow_omitted":true}},{"name":"dist","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}}]}
            answer: 'diag = 13 cm; sin = 12/13; sec = 60 cm^2; dist = 12/5 cm'
            solution_sketch: 'The diagonal is $\sqrt{9 + 16 + 144} = 13$. The height $12$ is opposite the angle, so the sine is $12/13$. The base diagonal is $AC = 5$, so the section is a rectangle with the area $5 \cdot 12 = 60$. The plane of the section is vertical, so the distance from $B$ equals the distance from $B$ to the line $AC$ in the base. This is $3 \cdot 4/5 = 12/5$.'
            points: 7
          - problem: 'A fair die rolls $3$ times. Let $X$ be the number of sixes. (a) Find $P(X = 0)$. (b) Find $P(X = 2)$. (c) Find the expected value of $X$. (d) Find the probability of at least one six.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p0","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}},{"name":"atleast1","contract":{"kind":"exact"}}]}
            answer: 'p0 = 125/216; p2 = 5/72; mean = 1/2; atleast1 = 91/216'
            solution_sketch: 'No six in three rolls: $(5/6)^3 = 125/216$. Two sixes: $3 \cdot (1/6)^2 \cdot (5/6) = 15/216 = 5/72$. The mean is $3 \cdot \tfrac16 = \tfrac12$. At least one six: $1 - 125/216 = 91/216$.'
            points: 8
          - problem: 'A geometric progression has $b_2 = 6$ and $b_5 = 162$. (a) Find the ratio $q$. (b) Find $b_1$. (c) Find the sum $S_6$ of the first six terms. (d) Find the least number $n$ for which $S_n > 1000$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"q","contract":{"kind":"exact"}},{"name":"b1","contract":{"kind":"exact"}},{"name":"S6","contract":{"kind":"exact"}},{"name":"n","contract":{"kind":"exact"}}]}
            answer: 'q = 3; b1 = 2; S6 = 728; n = 7'
            solution_sketch: 'We have $q^3 = 162/6 = 27$, so $q = 3$. Then $b_1 = 6/3 = 2$. The sum is $S_n = 2(3^n - 1)/2 = 3^n - 1$, so $S_6 = 728$. We need $3^n > 1001$. Since $3^6 = 729$ and $3^7 = 2187$, the least $n$ is $7$.'
            points: 8
          - problem: '(a) Solve $\log_2(x+3) = 4$. (b) Solve $4^x - 3 \cdot 2^x - 4 = 0$. (c) Solve $\log_2(x+1) + \log_2(x-1) = 3$. (d) Solve $\log_{1/2}(2x-1) > -2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"inequality_union"}}]}
            answer: 'a = 13; b = 2; c = 3; d = 1/2 < x < 5/2'
            solution_sketch: 'In the first equation $x + 3 = 16$. In the second equation put $t = 2^x$: $t^2 - 3t - 4 = 0$ gives $t = 4$ or $t = -1$. Only $t = 4$ is possible, so $x = 2$. In the third equation $x^2 - 1 = 8$ gives $x = 3$, because $x > 1$. In the last inequality the base is below $1$, so $0 < 2x - 1 < 4$.'
            points: 7
        constraints: 'Three items of the form plus three spares. Each item sets up a task, solves it and reads the result. The points run from seven to nine.'
      - id: kp4
        name: 'Show that items'
        key_prerequisites: [vbe-cp05-logarithms, vbe-cp14-plane-vectors, vbe-cp15-trig-expressions, vbe-cp20-integral]
        exemplars:
          - problem: 'Let $\log_3 5 = a$. (a) Express $\log_9 25$ through $a$. (b) Express $\log_{25} 3$ through $a$. (c) Express $\log_3 75$ through $a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"function","vars":["a"]}},{"name":"b","contract":{"kind":"function","vars":["a"]}},{"name":"c","contract":{"kind":"function","vars":["a"]}}]}
            answer: 'a = a; b = 1/(2*a); c = 2*a+1'
            solution_sketch: 'We have $\log_9 25 = \log_3 5 = a$. Also $\log_{25} 3 = 1/\log_3 25 = 1/(2a)$. Last, $\log_3 75 = \log_3 3 + \log_3 25 = 1 + 2a$.'
            points: 3
          - problem: '(a) Find $\displaystyle\int_0^2 \frac{1}{x+1}\,dx$. (b) The region under the curve $y = \dfrac{1}{\sqrt{x+1}}$ for $0 \le x \le 2$ turns around the $x$ axis. Find the volume of the solid.'
            answer_contract: {"kind":"multipart","parts":[{"name":"int","contract":{"kind":"exact"}},{"name":"V","contract":{"kind":"exact"}}]}
            answer: 'int = ln(3); V = pi*ln(3)'
            solution_sketch: 'An antiderivative of $\tfrac{1}{x+1}$ is $\ln(x+1)$. So the integral equals $\ln 3 - \ln 1 = \ln 3$. The volume is $\pi \int_0^2 \tfrac{1}{x+1}\,dx = \pi \ln 3$.'
            points: 3
          - problem: 'In a triangle $ABC$ we have $|AB| = 7$, $|AC| = 5$ and the angle $A$ equals $60^\circ$. (a) Find $|BC|^2$. (b) Find the area of the triangle.'
            answer_contract: {"kind":"multipart","parts":[{"name":"bc2","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'bc2 = 39; area = 35*sqrt(3)/4'
            solution_sketch: 'The cosine rule gives $|BC|^2 = 49 + 25 - 2 \cdot 7 \cdot 5 \cdot \tfrac12 = 39$. The area is $\tfrac12 \cdot 7 \cdot 5 \cdot \sin 60^\circ = \tfrac{35\sqrt3}{4}$.'
            points: 3
          - problem: 'Take $g(x) = (x^2 + 1)^3$. (a) Find $g''(x)$. (b) Find $g''(1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}}]}
            answer: 'd = 6*x*(x^2+1)^2; v = 24'
            solution_sketch: 'The chain rule gives $g''(x) = 3(x^2+1)^2 \cdot 2x = 6x(x^2+1)^2$. At $x = 1$ we get $6 \cdot 4 = 24$.'
            points: 2
          - problem: '(a) Find the exact value of $\cos 15^\circ$. (b) The angle $\alpha$ lies in the second quadrant and $\sin\alpha = \tfrac35$. Find $\sin 2\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"c","contract":{"kind":"exact"}},{"name":"s","contract":{"kind":"exact"}}]}
            answer: 'c = (sqrt(6)+sqrt(2))/4; s = -24/25'
            solution_sketch: 'Write $15^\circ = 45^\circ - 30^\circ$. The difference formula gives $\cos 15^\circ = \tfrac{\sqrt2}{2}\cdot\tfrac{\sqrt3}{2} + \tfrac{\sqrt2}{2}\cdot\tfrac12 = \tfrac{\sqrt6 + \sqrt2}{4}$. The cosine is $-\tfrac45$ in the second quadrant. So $\sin 2\alpha = 2 \cdot \tfrac35 \cdot (-\tfrac45) = -\tfrac{24}{25}$.'
            points: 3
          - problem: '(a) How many different arrangements of the letters of the word LEVEL exist? (b) A random variable $X$ takes the values $1$, $2$ and $3$ with the probabilities $p$, $2p$ and $3p$. Find the expected value of $X$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}}]}
            answer: 'n = 30; mean = 7/3'
            solution_sketch: 'The letters L and E occur twice each, so the count is $5!/(2! \cdot 2!) = 30$. The probabilities sum to $6p = 1$, so $p = \tfrac16$. Then the mean is $\tfrac{1 + 4 + 9}{6} = \tfrac73$.'
            points: 3
          - problem: 'Prove that the function $g(x) = 2x - \cos x$ increases on the set of all real numbers.'
            answer_contract: {"kind":"written"}
            answer: 'The derivative is $g''(x) = 2 + \sin x$. The sine is at least $-1$, so $g''(x) \ge 1 > 0$ for every real $x$. A function with a positive derivative on an interval increases on it. So $g$ increases on all real numbers.'
            solution_sketch: 'Take the derivative. Bound the sine. Use the sign rule.'
            points: 3
          - problem: 'Prove with vectors that the sum of the squares of the diagonals of a parallelogram equals the sum of the squares of its four sides.'
            answer_contract: {"kind":"written"}
            answer: 'Let the sides be $\vec u$ and $\vec v$. The diagonals are $\vec u + \vec v$ and $\vec u - \vec v$. Then $|\vec u + \vec v|^2 + |\vec u - \vec v|^2 = 2|\vec u|^2 + 2|\vec v|^2$, because the products $2\vec u \cdot \vec v$ cancel. The right side is the sum of the squares of the four sides.'
            solution_sketch: 'Write the diagonals with the side vectors. Expand both squares. Cancel the mixed products.'
            points: 3
          - problem: 'Prove that $\sqrt{2} + \sqrt{3}$ is an irrational number.'
            answer_contract: {"kind":"written"}
            answer: 'Assume that $r = \sqrt{2} + \sqrt{3}$ is rational. Then $\sqrt{3} = r - \sqrt{2}$, so $3 = r^2 - 2r\sqrt{2} + 2$. This gives $\sqrt{2} = (r^2 - 1)/(2r)$, a rational number. But $\sqrt{2}$ is irrational. This is a contradiction, so $r$ is irrational.'
            solution_sketch: 'Assume that the sum is rational. Square the difference. Solve for $\sqrt{2}$.'
            points: 4
        constraints: 'Two items of the form plus four spares ask for the value that one step of a proof produces. The last three items ask for a full proof.'
    diagnostic_exemplar:
      problem: 'Find $\log_5 125$.'
      answer_contract: {"kind":"exact"}
      answer: '3'
      solution_sketch: 'We have $125 = 5^3$. So the logarithm equals $3$.'
