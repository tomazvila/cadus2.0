    knowledge_points:
      - id: kp1
        name: 'Draws with and without return, at least one, two stages'
        key_prerequisites: [classical-nonclassical-trials, conditional-probability]
        exemplars:
          - problem: 'A bag holds $4$ red and $6$ blue balls. Two balls are drawn in turn, and each ball goes back into the bag before the next draw. (a) Find the probability that both balls are red. (b) Find the probability that one ball is red and the other is blue.'
            answer_contract: {"kind":"multipart","parts":[{"name":"rr","contract":{"kind":"exact"}},{"name":"mix","contract":{"kind":"exact"}}]}
            answer: 'rr = 4/25; mix = 12/25'
            solution_sketch: 'Each draw gives red with probability $2/5$. So $(2/5)^2=4/25$. One red and one blue in either order: $2\cdot\tfrac25\cdot\tfrac35=12/25$.'
          - problem: 'A bag holds $4$ red and $6$ blue balls. Two balls are drawn in turn, and the first ball does not go back. (a) Find the probability that both balls are red. (b) Find the probability that both balls are blue.'
            answer_contract: {"kind":"multipart","parts":[{"name":"rr","contract":{"kind":"exact"}},{"name":"bb","contract":{"kind":"exact"}}]}
            answer: 'rr = 2/15; bb = 1/3'
            solution_sketch: 'Both red: $\tfrac4{10}\cdot\tfrac39=\tfrac2{15}$. Both blue: $\tfrac6{10}\cdot\tfrac59=\tfrac13$.'
          - problem: 'A box holds $5$ white and $3$ black balls. Three balls are taken at the same time. (a) In how many ways are three balls taken? (b) Find the probability that no ball is black. (c) Find the probability that at least one ball is black.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ways","contract":{"kind":"exact"}},{"name":"none","contract":{"kind":"exact"}},{"name":"some","contract":{"kind":"exact"}}]}
            answer: 'ways = 56; none = 5/28; some = 23/28'
            solution_sketch: 'All triples: $C_8^3=56$. Triples with no black ball: $C_5^3=10$, so $10/56=5/28$. At least one black ball is the opposite event, $1-5/28=23/28$.'
          - problem: 'A bag holds $2$ green and $3$ yellow balls. A ball is drawn and put back, $3$ times. (a) Find the probability that no ball is green. (b) Find the probability that at least one ball is green.'
            answer_contract: {"kind":"multipart","parts":[{"name":"none","contract":{"kind":"exact"}},{"name":"some","contract":{"kind":"exact"}}]}
            answer: 'none = 27/125; some = 98/125'
            solution_sketch: 'No green ball: $(3/5)^3=27/125$. At least one green ball: $1-27/125=98/125$.'
          - problem: 'Box A holds $3$ red and $2$ blue balls. Box B holds $1$ red and $4$ blue balls. One ball is drawn from each box. Find the probability that (a) both balls are red, (b) the two balls have the same color, (c) the two balls have different colors.'
            answer_contract: {"kind":"multipart","parts":[{"name":"both","contract":{"kind":"exact"}},{"name":"same","contract":{"kind":"exact"}},{"name":"diff","contract":{"kind":"exact"}}]}
            answer: 'both = 3/25; same = 11/25; diff = 14/25'
            solution_sketch: 'Both red: $\tfrac35\cdot\tfrac15=\tfrac3{25}$. Both blue: $\tfrac25\cdot\tfrac45=\tfrac8{25}$. The same color is $11/25$ and the opposite event gives $14/25$.'
          - problem: 'A box holds $4$ yellow balls and $n$ blue balls. Two balls are drawn in turn without return. The probability that both are yellow is $\frac16$. (a) Find $n$. (b) Find the probability that exactly one of the two balls is yellow.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"one","contract":{"kind":"exact"}}]}
            answer: 'n = 5; one = 5/9'
            solution_sketch: 'The probability is $\tfrac{4}{n+4}\cdot\tfrac{3}{n+3}=\tfrac16$, so $(n+4)(n+3)=72$. This gives $n^2+7n-60=0$ and $n=5$. Then $P=2\cdot\tfrac49\cdot\tfrac58=\tfrac5{9}$.'
        constraints: 'bags and boxes with at most 10 balls; draws with and without return; the hardest item solves for an unknown count'
      - id: kp2
        name: 'Independent, incompatible and compatible events'
        key_prerequisites: [independent-events, mutually-exclusive-events]
        exemplars:
          - problem: 'The events $A$ and $B$ are independent, with $P(A)=\frac14$ and $P(B)=\frac13$. (a) Find $P(A\text{ and }B)$. (b) Find $P(A\text{ or }B)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"and","contract":{"kind":"exact"}},{"name":"or","contract":{"kind":"exact"}}]}
            answer: 'and = 1/12; or = 1/2'
            solution_sketch: 'For independent events $P(AB)=\tfrac14\cdot\tfrac13=\tfrac1{12}$. Then $P(A\cup B)=\tfrac14+\tfrac13-\tfrac1{12}=\tfrac12$.'
          - problem: 'The events $A$ and $B$ are incompatible, with $P(A)=\frac15$ and $P(B)=\frac7{20}$. (a) Find $P(A\text{ or }B)$. (b) Find the probability that neither event happens.'
            answer_contract: {"kind":"multipart","parts":[{"name":"or","contract":{"kind":"exact"}},{"name":"none","contract":{"kind":"exact"}}]}
            answer: 'or = 11/20; none = 9/20'
            solution_sketch: 'For incompatible events the probabilities add: $\tfrac4{20}+\tfrac7{20}=\tfrac{11}{20}$. The opposite event has probability $1-\tfrac{11}{20}=\tfrac9{20}$.'
          - problem: 'For the events $A$ and $B$ we have $P(A)=\frac35$, $P(B)=\frac12$ and $P(A\text{ or }B)=\frac7{10}$. (a) Find $P(A\text{ and }B)$. (b) Find the probability that exactly one of the events happens.'
            answer_contract: {"kind":"multipart","parts":[{"name":"both","contract":{"kind":"exact"}},{"name":"one","contract":{"kind":"exact"}}]}
            answer: 'both = 2/5; one = 3/10'
            solution_sketch: 'From $P(A\cup B)=P(A)+P(B)-P(AB)$ we get $P(AB)=\tfrac35+\tfrac12-\tfrac7{10}=\tfrac25$. Only $A$: $\tfrac35-\tfrac25=\tfrac15$. Only $B$: $\tfrac12-\tfrac25=\tfrac1{10}$. The sum is $\tfrac3{10}$.'
          - problem: 'Two archers shoot once each, independently. The first hits with probability $\frac45$ and the second with probability $\frac7{10}$. Find the probability that (a) both hit, (b) at least one hits, (c) exactly one hits.'
            answer_contract: {"kind":"multipart","parts":[{"name":"both","contract":{"kind":"exact"}},{"name":"atleast","contract":{"kind":"exact"}},{"name":"one","contract":{"kind":"exact"}}]}
            answer: 'both = 14/25; atleast = 47/50; one = 19/50'
            solution_sketch: 'Both: $\tfrac45\cdot\tfrac7{10}=\tfrac{14}{25}$. Neither: $\tfrac15\cdot\tfrac3{10}=\tfrac3{50}$, so at least one is $\tfrac{47}{50}$. Exactly one: $\tfrac45\cdot\tfrac3{10}+\tfrac15\cdot\tfrac7{10}=\tfrac{19}{50}$.'
          - problem: 'The events $A$ and $B$ are independent, with $P(A)=\frac25$ and $P(A\text{ or }B)=\frac7{10}$. (a) Find $P(B)$. (b) Find $P(A\text{ and }B)$. (c) Find the probability that neither event happens.'
            answer_contract: {"kind":"multipart","parts":[{"name":"pb","contract":{"kind":"exact"}},{"name":"both","contract":{"kind":"exact"}},{"name":"none","contract":{"kind":"exact"}}]}
            answer: 'pb = 1/2; both = 1/5; none = 3/10'
            solution_sketch: 'Independence gives $\tfrac25+p-\tfrac25p=\tfrac7{10}$, so $\tfrac35p=\tfrac3{10}$ and $p=\tfrac12$. Then $P(AB)=\tfrac25\cdot\tfrac12=\tfrac15$. The opposite of the union has probability $1-\tfrac7{10}=\tfrac3{10}$.'
          - problem: 'A fair die is rolled once. The event $A$ is an even number. The event $B$ is a number of at least $4$. The event $C$ is a number less than $3$. Find (a) $P(A\text{ and }B)$, (b) $P(A\text{ or }B)$, (c) $P(B\text{ or }C)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ab","contract":{"kind":"exact"}},{"name":"aorb","contract":{"kind":"exact"}},{"name":"borc","contract":{"kind":"exact"}}]}
            answer: 'ab = 1/3; aorb = 2/3; borc = 5/6'
            solution_sketch: 'The event $A$ is $\{2,4,6\}$, $B$ is $\{4,5,6\}$, $C$ is $\{1,2\}$. Both $A$ and $B$: $\{4,6\}$, so $\tfrac13$. $A$ or $B$: $\{2,4,5,6\}$, so $\tfrac23$. $B$ or $C$ are incompatible, so $\tfrac36+\tfrac26=\tfrac56$.'
        constraints: 'two or three events with given probabilities; and, or and exactly one'
      - id: kp3
        name: 'Bernoulli series: exactly k in n'
        key_prerequisites: [binomial-probability]
        exemplars:
          - problem: 'A fair coin is tossed $5$ times. (a) Find $C_5^2$. (b) Find the probability of exactly $2$ heads.'
            answer_contract: {"kind":"multipart","parts":[{"name":"c","contract":{"kind":"exact"}},{"name":"p","contract":{"kind":"exact"}}]}
            answer: 'c = 10; p = 5/16'
            solution_sketch: 'We have $C_5^2=10$. Each sequence has probability $(1/2)^5=1/32$. So $P=10/32=5/16$.'
          - problem: 'An archer hits a target with probability $\frac13$ in each of $4$ independent shots. (a) Find the probability of no hit. (b) Find the probability of exactly one hit.'
            answer_contract: {"kind":"multipart","parts":[{"name":"none","contract":{"kind":"exact"}},{"name":"one","contract":{"kind":"exact"}}]}
            answer: 'none = 16/81; one = 32/81'
            solution_sketch: 'No hit: $(2/3)^4=16/81$. Exactly one hit: $C_4^1\cdot\tfrac13\cdot(\tfrac23)^3=4\cdot\tfrac8{81}=\tfrac{32}{81}$.'
          - problem: 'A fair die is rolled $3$ times. Find the probability that a six appears (a) exactly once, (b) exactly twice.'
            answer_contract: {"kind":"multipart","parts":[{"name":"one","contract":{"kind":"exact"}},{"name":"two","contract":{"kind":"exact"}}]}
            answer: 'one = 25/72; two = 5/72'
            solution_sketch: 'Exactly once: $C_3^1\cdot\tfrac16\cdot(\tfrac56)^2=\tfrac{75}{216}=\tfrac{25}{72}$. Exactly twice: $C_3^2\cdot(\tfrac16)^2\cdot\tfrac56=\tfrac{15}{216}=\tfrac5{72}$.'
          - problem: 'A ball is drawn $3$ times from a bag, and it goes back after each draw. A red ball has probability $\frac25$ each time. Find the probability of (a) exactly $2$ red balls, (b) at least $2$ red balls.'
            answer_contract: {"kind":"multipart","parts":[{"name":"two","contract":{"kind":"exact"}},{"name":"atleast","contract":{"kind":"exact"}}]}
            answer: 'two = 36/125; atleast = 44/125'
            solution_sketch: 'Exactly two: $C_3^2(\tfrac25)^2\cdot\tfrac35=\tfrac{36}{125}$. Three red: $(\tfrac25)^3=\tfrac8{125}$. At least two: $\tfrac{36+8}{125}=\tfrac{44}{125}$.'
          - problem: 'A fair coin is tossed $5$ times. Find the probability of (a) exactly $3$ heads, (b) at least $4$ heads, (c) at most $1$ head.'
            answer_contract: {"kind":"multipart","parts":[{"name":"three","contract":{"kind":"exact"}},{"name":"ge4","contract":{"kind":"exact"}},{"name":"le1","contract":{"kind":"exact"}}]}
            answer: 'three = 5/16; ge4 = 3/16; le1 = 3/16'
            solution_sketch: 'Exactly $3$: $C_5^3/32=10/32=5/16$. At least $4$: $(C_5^4+C_5^5)/32=6/32=3/16$. At most $1$: $(C_5^0+C_5^1)/32=6/32=3/16$.'
          - problem: 'A trial succeeds with probability $\frac13$. It is repeated $4$ times, independently. (a) Find the probability of exactly $3$ successes. (b) Find the probability of at least $3$ successes. (c) A fair coin is tossed $n$ times. The probability of exactly one head is $\frac5{32}$. Find $n$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"three","contract":{"kind":"exact"}},{"name":"atleast","contract":{"kind":"exact"}},{"name":"n","contract":{"kind":"exact"}}]}
            answer: 'three = 8/81; atleast = 1/9; n = 5'
            solution_sketch: 'Exactly three: $C_4^3(\tfrac13)^3\tfrac23=\tfrac8{81}$. Four successes: $\tfrac1{81}$. At least three: $\tfrac9{81}=\tfrac19$. For the coin, $n/2^n=5/32$. The value $n/2^n$ falls for $n\ge2$, and $n=5$ gives $5/32$.'
        constraints: 'Bernoulli series with n from 3 to 5; exactly k, at least k'
    diagnostic_exemplar:
      problem: 'A fair die is rolled once. Find the probability of an even number.'
      answer_contract: {"kind":"exact"}
      answer: '1/2'
      solution_sketch: 'Three of the six numbers are even, so $3/6=1/2$.'
