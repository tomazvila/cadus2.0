    knowledge_points:
      - id: kp1
        name: 'Distribution table, unknown probability and expected value'
        key_prerequisites: [discrete-probability-distributions, discrete-random-variables]
        exemplars:
          - problem: 'A random variable $X$ takes the values $0,1,2,3$ with the probabilities $\frac1{10}$, $\frac25$, $p$, $\frac15$. (a) Find $p$. (b) Find the expected value $\mathbf EX$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"ex","contract":{"kind":"exact"}}]}
            answer: 'p = 3/10; ex = 8/5'
            solution_sketch: 'The probabilities add to $1$: $\tfrac1{10}+\tfrac4{10}+p+\tfrac2{10}=1$, so $p=\tfrac3{10}$. Then $\mathbf EX=0+\tfrac4{10}+\tfrac6{10}+\tfrac6{10}=\tfrac85$.'
          - problem: 'A random variable $X$ takes the values $-1,0,2,5$ with the probabilities $\frac15$, $\frac15$, $\frac25$, $p$. (a) Find $p$. (b) Find $\mathbf EX$. (c) Find $P(X>0)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"ex","contract":{"kind":"exact"}},{"name":"pos","contract":{"kind":"exact"}}]}
            answer: 'p = 1/5; ex = 8/5; pos = 3/5'
            solution_sketch: 'The sum of the probabilities is $1$, so $p=1-\tfrac45=\tfrac15$. Then $\mathbf EX=-\tfrac15+0+\tfrac45+1=\tfrac85$. The values $2$ and $5$ give $\tfrac25+\tfrac15=\tfrac35$.'
          - problem: 'A random variable $X$ takes the values $1,2,3$ with the probabilities $a$, $2a$, $3a$. (a) Find $a$. (b) Find $\mathbf EX$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"ex","contract":{"kind":"exact"}}]}
            answer: 'a = 1/6; ex = 7/3'
            solution_sketch: 'We have $6a=1$, so $a=\tfrac16$. Then $\mathbf EX=\tfrac16+\tfrac46+\tfrac96=\tfrac{14}6=\tfrac73$.'
          - problem: 'A random variable $X$ takes the values $1,2,4$ with the probabilities $\frac12$, $p$, $q$. Its expected value is $\frac94$. Find (a) $p$ and (b) $q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"q","contract":{"kind":"exact"}}]}
            answer: 'p = 1/8; q = 3/8'
            solution_sketch: 'The probabilities give $p+q=\tfrac12$. The expected value gives $\tfrac12+2p+4q=\tfrac94$, so $p+2q=\tfrac78$. Subtract: $q=\tfrac38$, and then $p=\tfrac18$.'
          - problem: 'A fair die is rolled once. The payoff $X$ is $0$ for the numbers $1,2,3$, it is $3$ for the numbers $4,5$, and it is $9$ for the number $6$. (a) Find $P(X=3)$. (b) Find $\mathbf EX$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p3","contract":{"kind":"exact"}},{"name":"ex","contract":{"kind":"exact"}}]}
            answer: 'p3 = 1/3; ex = 5/2'
            solution_sketch: 'The numbers $4$ and $5$ give $P(X=3)=\tfrac26=\tfrac13$. Then $\mathbf EX=0\cdot\tfrac12+3\cdot\tfrac13+9\cdot\tfrac16=1+\tfrac32=\tfrac52$.'
          - problem: 'A random variable $X$ takes the values $1,2,3$ with the probabilities $p$, $\frac12$, $\frac12-p$. Its expected value is $2$. (a) Find $p$. (b) Find $P(X\ge2)$. (c) Find $\mathbf E(2X+1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"ge2","contract":{"kind":"exact"}},{"name":"e2x1","contract":{"kind":"exact"}}]}
            answer: 'p = 1/4; ge2 = 3/4; e2x1 = 5'
            solution_sketch: 'We have $\mathbf EX=p+1+3(\tfrac12-p)=\tfrac52-2p=2$, so $p=\tfrac14$. Then $P(X\ge2)=1-p=\tfrac34$. Also $\mathbf E(2X+1)=2\cdot2+1=5$.'
        constraints: '3 or 4 values with fractional probabilities; one unknown probability, then the expected value'
      - id: kp2
        name: 'Variance, standard deviation and the normal curve'
        key_prerequisites: [variance-random-variables, normal-distribution, empirical-rule]
        exemplars:
          - problem: 'A random variable $X$ takes the values $0,1,2$ with the probabilities $\frac14$, $\frac12$, $\frac14$. Find (a) $\mathbf EX$, (b) the variance $\mathbf DX$, (c) the standard deviation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ex","contract":{"kind":"exact"}},{"name":"var","contract":{"kind":"exact"}},{"name":"sd","contract":{"kind":"exact"}}]}
            answer: 'ex = 1; var = 1/2; sd = sqrt(2)/2'
            solution_sketch: 'We have $\mathbf EX=\tfrac12+\tfrac12=1$. Then $\mathbf DX=1\cdot\tfrac14+0+1\cdot\tfrac14=\tfrac12$. The standard deviation is $\sqrt{1/2}=\sqrt2/2$.'
          - problem: 'A random variable $X$ takes the values $1,3,5,7$, each with probability $\frac14$. Find (a) $\mathbf EX$, (b) $\mathbf DX$, (c) the standard deviation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ex","contract":{"kind":"exact"}},{"name":"var","contract":{"kind":"exact"}},{"name":"sd","contract":{"kind":"exact"}}]}
            answer: 'ex = 4; var = 5; sd = sqrt(5)'
            solution_sketch: 'We have $\mathbf EX=\tfrac{16}{4}=4$. The squared distances are $9,1,1,9$, with mean $\tfrac{20}4=5$. The standard deviation is $\sqrt5$.'
          - problem: 'A random variable $X$ takes the values $0,3,6$ with the probabilities $\frac12$, $\frac13$, $\frac16$. Find (a) $\mathbf EX$ and (b) $\mathbf DX$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ex","contract":{"kind":"exact"}},{"name":"var","contract":{"kind":"exact"}}]}
            answer: 'ex = 2; var = 5'
            solution_sketch: 'We have $\mathbf EX=0+1+1=2$. Then $\mathbf DX=4\cdot\tfrac12+1\cdot\tfrac13+16\cdot\tfrac16=2+\tfrac13+\tfrac83=5$.'
          - problem: 'The heights of a group of adults follow a normal distribution with mean $170$ cm and standard deviation $8$ cm. (a) The curve is symmetric about the line $x=m$. Find $m$. (b) Find the percent of the heights between $154$ and $186$. (c) Find the percent of the heights above $178$. Use the 68-95-99.7 rule.'
            answer_contract: {"kind":"multipart","parts":[{"name":"m","contract":{"kind":"exact"}},{"name":"mid","contract":{"kind":"exact"}},{"name":"above","contract":{"kind":"exact"}}]}
            answer: 'm = 170; mid = 95; above = 16'
            solution_sketch: 'The axis of symmetry passes through the mean, so $m=170$. The interval $154$ to $186$ is the mean plus or minus two standard deviations, which holds $95\%$. The interval $162$ to $178$ holds $68\%$, so the rest is $32\%$ and half of it, $16\%$, is above $178$.'
          - problem: 'A quantity follows a normal distribution with mean $50$ and standard deviation $5$. (a) Find the value that is two standard deviations above the mean. (b) Find the percent of the values between $40$ and $60$. (c) Find the percent of the values below $55$. Use the 68-95-99.7 rule.'
            answer_contract: {"kind":"multipart","parts":[{"name":"val","contract":{"kind":"exact"}},{"name":"mid","contract":{"kind":"exact"}},{"name":"below","contract":{"kind":"exact"}}]}
            answer: 'val = 60; mid = 95; below = 84'
            solution_sketch: 'The value is $50+2\cdot5=60$. The interval $40$ to $60$ holds $95\%$. The interval $45$ to $55$ holds $68\%$, and half of the remaining $32\%$ is below $45$. So below $55$ is $68\%+16\%=84\%$.'
          - problem: 'A quantity follows a normal distribution. $95\%$ of its values are between $28$ and $52$. (a) Find the mean. (b) Find the standard deviation. (c) Find the percent of the values above $46$. Use the 68-95-99.7 rule.'
            answer_contract: {"kind":"multipart","parts":[{"name":"mean","contract":{"kind":"exact"}},{"name":"sd","contract":{"kind":"exact"}},{"name":"above","contract":{"kind":"exact"}}]}
            answer: 'mean = 40; sd = 6; above = 16'
            solution_sketch: 'The interval is symmetric about the mean, so the mean is $40$. Its half-width $12$ is two standard deviations, so the standard deviation is $6$. The value $46$ is one standard deviation above the mean, so $16\%$ of the values are above it.'
        constraints: 'variance and standard deviation of a small distribution; normal curves with the 68, 95 rule'
      - id: kp3
        name: 'Table of a derived variable (product, sum) with a parameter'
        key_prerequisites: [discrete-random-variables, discrete-probability-distributions]
        exemplars:
          - problem: 'A random variable $X$ takes the values $1,2,3$ with the probabilities $\frac12$, $\frac13$, $\frac16$. Let $Y=2X+1$. (a) Find $P(Y=5)$. (b) Find $\mathbf EY$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p5","contract":{"kind":"exact"}},{"name":"ey","contract":{"kind":"exact"}}]}
            answer: 'p5 = 1/3; ey = 13/3'
            solution_sketch: 'The value $Y=5$ comes from $X=2$, so the probability is $\tfrac13$. We have $\mathbf EX=\tfrac12+\tfrac23+\tfrac12=\tfrac53$. So $\mathbf EY=2\cdot\tfrac53+1=\tfrac{13}3$.'
          - problem: 'A random variable $X$ takes the values $-1,0,1,2$, each with probability $\frac14$. Let $Y=X^2$. (a) Find $P(Y=1)$. (b) Find $\mathbf EY$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"ey","contract":{"kind":"exact"}}]}
            answer: 'p1 = 1/2; ey = 3/2'
            solution_sketch: 'The values $X=-1$ and $X=1$ both give $Y=1$, so $P(Y=1)=\tfrac12$. The values of $Y$ are $1,0,1,4$ and $\mathbf EY=\tfrac64=\tfrac32$.'
          - problem: 'Two fair four-sided dice with faces $1,2,3,4$ are rolled. Let $S$ be the sum of the two numbers. (a) Find $P(S=5)$. (b) Find $\mathbf ES$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p5","contract":{"kind":"exact"}},{"name":"es","contract":{"kind":"exact"}}]}
            answer: 'p5 = 1/4; es = 5'
            solution_sketch: 'There are $16$ equal outcomes. The sum $5$ comes from $4$ of them, so $P=\tfrac4{16}=\tfrac14$. Each die has mean $\tfrac52$, so $\mathbf ES=5$.'
          - problem: 'Three cards carry the numbers $1$, $2$ and $a$, with $a>2$. Two cards are drawn at the same time. Let $S$ be the sum of the two numbers. The expected value of $S$ is $6$. (a) Find $a$. (b) Find $P(S>5)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"p","contract":{"kind":"exact"}}]}
            answer: 'a = 6; p = 2/3'
            solution_sketch: 'The sums are $3$, $1+a$, $2+a$, each with probability $\tfrac13$. So $\mathbf ES=\tfrac{6+2a}3=6$ and $a=6$. The sums are $3,7,8$, so $P(S>5)=\tfrac23$.'
          - problem: 'A random variable $X$ takes the values $0,1,2$ with the probabilities $\frac12$, $\frac13$, $\frac16$. Let $Y=(X-1)^2$. Find (a) $P(Y=1)$, (b) $\mathbf EY$, (c) $\mathbf DY$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"ey","contract":{"kind":"exact"}},{"name":"dy","contract":{"kind":"exact"}}]}
            answer: 'p1 = 2/3; ey = 2/3; dy = 2/9'
            solution_sketch: 'The values $X=0$ and $X=2$ give $Y=1$, so $P(Y=1)=\tfrac12+\tfrac16=\tfrac23$. Then $Y$ takes $1$ with $\tfrac23$ and $0$ with $\tfrac13$, so $\mathbf EY=\tfrac23$. Here $Y^2=Y$, so $\mathbf DY=\tfrac23-\tfrac49=\tfrac29$.'
          - problem: 'The random variable $X$ takes the values $1,2$ with probability $\frac12$ each. The independent variable $Y$ takes the values $0,1,3$ with the probabilities $\frac14$, $\frac12$, $\frac14$. Let $Z=XY$. Find (a) $P(Z=0)$, (b) $\mathbf EZ$, (c) $P(Z\ge2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p0","contract":{"kind":"exact"}},{"name":"ez","contract":{"kind":"exact"}},{"name":"pge2","contract":{"kind":"exact"}}]}
            answer: 'p0 = 1/4; ez = 15/8; pge2 = 1/2'
            solution_sketch: 'We have $Z=0$ only when $Y=0$, so $P=\tfrac14$. The values of $Z$ are $0,1,2,3,6$ with the probabilities $\tfrac14,\tfrac14,\tfrac14,\tfrac18,\tfrac18$. So $\mathbf EZ=\tfrac14+\tfrac12+\tfrac38+\tfrac34=\tfrac{15}8$. The values $2,3,6$ give $\tfrac14+\tfrac18+\tfrac18=\tfrac12$.'
        constraints: 'a derived variable such as 2X+1, X squared, a sum or a product; one item has a parameter'
    diagnostic_exemplar:
      problem: 'A random variable takes the values $0$ and $1$ with the probabilities $p$ and $\frac23$. Find $p$.'
      answer_contract: {"kind":"exact"}
      answer: '1/3'
      solution_sketch: 'The probabilities add to $1$, so $p=1-\tfrac23=\tfrac13$.'
