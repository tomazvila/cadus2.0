    knowledge_points:
      - id: kp1
        name: 'Count codes and numbers with restrictions'
        key_prerequisites: [multiplication-principle, permutations]
        exemplars:
          - problem: 'Use the digits $0,1,2,\dots,9$. (a) How many three-digit codes have three different digits? A code may start with $0$. (b) How many three-digit numbers have three different digits? A number does not start with $0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"codes","contract":{"kind":"exact"}},{"name":"nums","contract":{"kind":"exact"}}]}
            answer: 'codes = 720; nums = 648'
            solution_sketch: 'For codes we have $10\cdot9\cdot8=720$. For numbers the first digit has $9$ choices, then $9$ and $8$ choices. So $9\cdot9\cdot8=648$.'
          - problem: 'Use the digits $1,2,3,4,5,6$, each at most once in a number. (a) How many four-digit numbers are there? (b) How many of them are even? (c) How many of them are greater than $5000$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"all","contract":{"kind":"exact"}},{"name":"even","contract":{"kind":"exact"}},{"name":"big","contract":{"kind":"exact"}}]}
            answer: 'all = 360; even = 180; big = 120'
            solution_sketch: 'We have $6\cdot5\cdot4\cdot3=360$. For even numbers the last digit has $3$ choices, then $5\cdot4\cdot3$ choices for the rest, so $180$. A number above $5000$ starts with $5$ or $6$, so $2\cdot5\cdot4\cdot3=120$.'
          - problem: 'A code has five digits from $0,1,\dots,9$. (a) How many codes have an odd first digit and an even last digit? Digits may repeat. (b) How many codes have five different digits and an odd first digit?'
            answer_contract: {"kind":"multipart","parts":[{"name":"rep","contract":{"kind":"exact"}},{"name":"diff","contract":{"kind":"exact"}}]}
            answer: 'rep = 25000; diff = 15120'
            solution_sketch: 'With repeats: $5\cdot10\cdot10\cdot10\cdot5=25000$. With different digits: $5$ choices for the first digit, then $9$, $8$, $7$, $6$ choices. So $5\cdot9\cdot8\cdot7\cdot6=15120$.'
          - problem: 'Use the digits $0,1,2,3,4,5$, each at most once in a number. (a) How many four-digit numbers are there? (b) How many of them are divisible by $5$? (c) How many of them are greater than $3000$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"all","contract":{"kind":"exact"}},{"name":"div5","contract":{"kind":"exact"}},{"name":"big","contract":{"kind":"exact"}}]}
            answer: 'all = 300; div5 = 108; big = 180'
            solution_sketch: 'The first digit is not $0$, so $5\cdot5\cdot4\cdot3=300$. If the last digit is $0$, we have $5\cdot4\cdot3=60$ numbers. If the last digit is $5$, we have $4\cdot4\cdot3=48$ numbers, so $108$ in all. A number above $3000$ starts with $3$, $4$ or $5$, so $3\cdot5\cdot4\cdot3=180$.'
          - problem: 'Arrange all five letters of the word MATHS, each used once. (a) How many arrangements are there? (b) How many start with the vowel A? (c) How many have the letters M and A next to each other?'
            answer_contract: {"kind":"multipart","parts":[{"name":"all","contract":{"kind":"exact"}},{"name":"vowel","contract":{"kind":"exact"}},{"name":"next","contract":{"kind":"exact"}}]}
            answer: 'all = 120; vowel = 24; next = 48'
            solution_sketch: 'There are $5!=120$ arrangements. If A is first, the other four letters give $4!=24$. Treat M and A as one block: $4!$ orders of the block with three letters, and $2$ orders inside the block. So $48$.'
          - problem: 'A code has four digits from $0,1,\dots,9$. (a) How many codes do not contain the digit $7$? (b) How many codes contain the digit $7$ at least once? (c) How many codes have four different digits and contain the digit $7$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"no7","contract":{"kind":"exact"}},{"name":"with7","contract":{"kind":"exact"}},{"name":"diff7","contract":{"kind":"exact"}}]}
            answer: 'no7 = 6561; with7 = 3439; diff7 = 2016'
            solution_sketch: 'Without $7$ we have $9^4=6561$ codes. All codes number $10^4=10000$, so $10000-6561=3439$ contain a $7$. Codes with different digits number $10\cdot9\cdot8\cdot7=5040$, and without $7$ they number $9\cdot8\cdot7\cdot6=3024$. So $5040-3024=2016$.'
        constraints: 'codes, numbers and words with a restriction on a digit or a position; digits from a small set or from 0 to 9'
      - id: kp2
        name: 'Pick from two groups and the binomial term'
        key_prerequisites: [combinations, binomial-expansion]
        exemplars:
          - problem: 'A class has $7$ boys and $5$ girls. A team of $4$ students is chosen. (a) In how many ways is the team chosen? (b) In how many ways is the team chosen with exactly $2$ boys and $2$ girls?'
            answer_contract: {"kind":"multipart","parts":[{"name":"all","contract":{"kind":"exact"}},{"name":"mixed","contract":{"kind":"exact"}}]}
            answer: 'all = 495; mixed = 210'
            solution_sketch: 'The count of all teams is $C_{12}^4=495$. Two boys give $C_7^2=21$ ways and two girls give $C_5^2=10$ ways. So $21\cdot10=210$.'
          - problem: 'A committee of $3$ people is chosen from $6$ men and $4$ women. (a) How many committees are there? (b) How many committees have at least one woman?'
            answer_contract: {"kind":"multipart","parts":[{"name":"all","contract":{"kind":"exact"}},{"name":"woman","contract":{"kind":"exact"}}]}
            answer: 'all = 120; woman = 100'
            solution_sketch: 'All committees: $C_{10}^3=120$. Committees with no woman: $C_6^3=20$. So $120-20=100$ have a woman.'
          - problem: 'Find the coefficient of $x^3$ in the expansion of $(x+2)^5$. First (a) find $C_5^3$, then (b) find the coefficient.'
            answer_contract: {"kind":"multipart","parts":[{"name":"c","contract":{"kind":"exact"}},{"name":"coef","contract":{"kind":"exact"}}]}
            answer: 'c = 10; coef = 40'
            solution_sketch: 'The term with $x^3$ is $C_5^3x^3\cdot2^2$. The number $C_5^3$ is $10$. The coefficient is $10\cdot4=40$.'
          - problem: 'Expand $(2x-1)^6$. Find (a) the coefficient of $x^2$, (b) the constant term, (c) the coefficient of $x^5$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"c2","contract":{"kind":"exact"}},{"name":"c0","contract":{"kind":"exact"}},{"name":"c5","contract":{"kind":"exact"}}]}
            answer: 'c2 = 60; c0 = 1; c5 = -192'
            solution_sketch: 'The general term is $C_6^k(2x)^k(-1)^{6-k}$. For $k=2$: $15\cdot4\cdot1=60$. For $k=0$: $(-1)^6=1$. For $k=5$: $6\cdot32\cdot(-1)=-192$.'
          - problem: 'Expand $(\sqrt3+1)^6$ in descending powers of $\sqrt3$. (a) Find the third term as a natural number. (b) Find the fourth term.'
            answer_contract: {"kind":"multipart","parts":[{"name":"t3","contract":{"kind":"exact"}},{"name":"t4","contract":{"kind":"exact"}}]}
            answer: 't3 = 135; t4 = 60*sqrt(3)'
            solution_sketch: 'The third term is $C_6^2(\sqrt3)^4=15\cdot9=135$. The fourth term is $C_6^3(\sqrt3)^3=20\cdot3\sqrt3=60\sqrt3$.'
          - problem: 'A team of $5$ is chosen from $5$ boys and $4$ girls. (a) In how many ways is the team chosen with exactly $3$ girls? (b) In how many ways is the team chosen with more girls than boys?'
            answer_contract: {"kind":"multipart","parts":[{"name":"three","contract":{"kind":"exact"}},{"name":"more","contract":{"kind":"exact"}}]}
            answer: 'three = 40; more = 45'
            solution_sketch: 'Three girls and two boys: $C_4^3\cdot C_5^2=4\cdot10=40$. Four girls and one boy: $C_4^4\cdot C_5^1=5$. More girls than boys means $40+5=45$.'
        constraints: 'teams from two groups, and terms of a binomial expansion with small exponents'
    diagnostic_exemplar:
      problem: 'In how many ways are $2$ pupils chosen from $6$ pupils?'
      answer_contract: {"kind":"exact"}
      answer: '15'
      solution_sketch: 'The count is $C_6^2=15$.'
