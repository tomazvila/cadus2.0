    knowledge_points:
      - id: kp1
        name: 'Axial section, apothem, generatrix and net'
        key_prerequisites: [polyhedra-terms-sections, solids-of-revolution-sections]
        exemplars:
          - problem: 'A cone has base radius $6$ and height $8$. (a) Find the generatrix of the cone. (b) Find the area of the axial section.'
            answer_contract: {"kind":"multipart","parts":[{"name":"gen","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'gen = 10; area = 48'
            solution_sketch: 'The generatrix is $\sqrt{36+64}=10$. The axial section is a triangle with base $12$ and height $8$. Its area is $\tfrac12\cdot12\cdot8=48$.'
          - problem: 'The axial section of a cylinder is a square with side $10$. (a) Find the base radius. (b) Find the lateral surface area. (c) Find the volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"r","contract":{"kind":"exact"}},{"name":"lat","contract":{"kind":"exact"}},{"name":"vol","contract":{"kind":"exact"}}]}
            answer: 'r = 5; lat = 100*pi; vol = 250*pi'
            solution_sketch: 'The diameter and the height are both $10$, so $r=5$. The lateral area is $2\pi\cdot5\cdot10=100\pi$. The volume is $\pi\cdot25\cdot10=250\pi$.'
          - problem: 'A regular pyramid has a square base with side $10$ and height $12$. (a) Find the apothem. (b) Find the lateral surface area.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ap","contract":{"kind":"exact"}},{"name":"lat","contract":{"kind":"exact"}}]}
            answer: 'ap = 13; lat = 260'
            solution_sketch: 'The apothem is the hypotenuse of a right triangle with legs $12$ and $5$, so it is $13$. The four lateral faces have total area $4\cdot\tfrac12\cdot10\cdot13=260$.'
          - problem: 'A cone has base radius $4$ and generatrix $12$. Its lateral surface is unrolled into a plane sector. (a) Find the lateral surface area of the cone. (b) Find the central angle of the sector in degrees.'
            answer_contract: {"kind":"multipart","parts":[{"name":"lat","contract":{"kind":"exact"}},{"name":"ang","contract":{"kind":"exact"}}]}
            answer: 'lat = 48*pi; ang = 120'
            solution_sketch: 'The lateral area is $\pi\cdot4\cdot12=48\pi$. The arc of the sector has length $2\pi\cdot4=8\pi$ and the radius of the sector is $12$. The angle is $8\pi/12=2\pi/3$, which is $120^\circ$.'
          - problem: 'A regular triangular pyramid has a base side $6$ and height $3$. (a) Find the apothem. (b) Find the lateral surface area.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ap","contract":{"kind":"exact"}},{"name":"lat","contract":{"kind":"exact"}}]}
            answer: 'ap = 2*sqrt(3); lat = 18*sqrt(3)'
            solution_sketch: 'The inscribed circle of the base has radius $6/(2\sqrt3)=\sqrt3$. The apothem is $\sqrt{9+3}=2\sqrt3$. The lateral area is $\tfrac12\cdot18\cdot2\sqrt3=18\sqrt3$.'
          - problem: 'A frustum of a cone has base radii $3$ and $7$ and height $3$. (a) Find the generatrix. (b) Find the lateral surface area. (c) Find the volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"gen","contract":{"kind":"exact"}},{"name":"lat","contract":{"kind":"exact"}},{"name":"vol","contract":{"kind":"exact"}}]}
            answer: 'gen = 5; lat = 50*pi; vol = 79*pi'
            solution_sketch: 'The generatrix is $\sqrt{(7-3)^2+3^2}=5$. The lateral area is $\pi(3+7)\cdot5=50\pi$. The volume is $\tfrac13\pi\cdot3\cdot(9+21+49)=79\pi$.'
        constraints: 'cones, cylinders and pyramids with integer data; axial section, apothem, generatrix, sector angle of a net'
      - id: kp2
        name: 'Volume or area from an angle, and a section'
        key_prerequisites: [solid-measures-model]
        exemplars:
          - problem: 'The generatrix of a cone is $6\sqrt2$ and it makes an angle of $45^\circ$ with the base. (a) Find the base radius. (b) Find the volume of the cone.'
            answer_contract: {"kind":"multipart","parts":[{"name":"r","contract":{"kind":"exact"}},{"name":"vol","contract":{"kind":"exact"}}]}
            answer: 'r = 6; vol = 72*pi'
            solution_sketch: 'The radius is $6\sqrt2\cos45^\circ=6$ and the height is also $6$. The volume is $\tfrac13\pi\cdot36\cdot6=72\pi$.'
          - problem: 'A regular pyramid has a square base with side $8$. Each lateral face makes an angle of $45^\circ$ with the base. (a) Find the height of the pyramid. (b) Find the volume of the pyramid.'
            answer_contract: {"kind":"multipart","parts":[{"name":"h","contract":{"kind":"exact"}},{"name":"vol","contract":{"kind":"exact"}}]}
            answer: 'h = 4; vol = 256/3'
            solution_sketch: 'The foot of the height is $4$ from each base side. The tangent of $45^\circ$ is $1$, so $h=4$. The volume is $\tfrac13\cdot64\cdot4=256/3$.'
          - problem: 'A cylinder has radius $5$ and height $10$. A plane is parallel to the axis and at distance $3$ from it. (a) Find the width of the rectangular section. (b) Find the area of the section.'
            answer_contract: {"kind":"multipart","parts":[{"name":"w","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'w = 8; area = 80'
            solution_sketch: 'The section cuts a chord of the base circle. Half of the chord is $\sqrt{25-9}=4$, so the width is $8$. The area is $8\cdot10=80$.'
          - problem: 'A cone has base radius $9$ and height $12$. A plane parallel to the base is at distance $4$ from the apex. (a) Find the radius of the section. (b) Find the area of the section. (c) Find the volume of the small cone between the apex and the plane.'
            answer_contract: {"kind":"multipart","parts":[{"name":"r","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}},{"name":"vol","contract":{"kind":"exact"}}]}
            answer: 'r = 3; area = 9*pi; vol = 12*pi'
            solution_sketch: 'The small cone is similar to the big cone with ratio $4/12=1/3$, so the radius is $3$. The area is $\pi\cdot9=9\pi$. The volume is $\tfrac13\pi\cdot9\cdot4=12\pi$.'
          - problem: 'A sphere has radius $5$. A plane is at distance $3$ from the center. (a) Find the radius of the circular section. (b) Find the area of the section. (c) Find the volume of the smaller spherical segment cut off by the plane.'
            answer_contract: {"kind":"multipart","parts":[{"name":"r","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}},{"name":"vol","contract":{"kind":"exact"}}]}
            answer: 'r = 4; area = 16*pi; vol = 52*pi/3'
            solution_sketch: 'The section radius is $\sqrt{25-9}=4$, so the area is $16\pi$. The smaller segment has height $H=5-3=2$. Its volume is $\tfrac13\pi\cdot4\cdot(15-2)=52\pi/3$.'
          - problem: 'A regular pyramid $SABCD$ has a square base with side $8$ and lateral edge $9$. A plane passes through $S$, $A$ and $C$. (a) Find the height of the pyramid. (b) Find the area of the section. (c) Find the volume of the pyramid.'
            answer_contract: {"kind":"multipart","parts":[{"name":"h","contract":{"kind":"exact"}},{"name":"sec","contract":{"kind":"exact"}},{"name":"vol","contract":{"kind":"exact"}}]}
            answer: 'h = 7; sec = 28*sqrt(2); vol = 448/3'
            solution_sketch: 'Half the diagonal is $4\sqrt2$, so $h=\sqrt{81-32}=7$. The section is the triangle $SAC$ with base $8\sqrt2$ and height $7$, so its area is $28\sqrt2$. The volume is $\tfrac13\cdot64\cdot7=448/3$.'
        constraints: 'volume or area from an angle, a distance or a plane section; answers with pi or a root'
      - id: kp3
        name: 'Volume as a function of one variable'
        key_prerequisites: [solid-measures-model]
        exemplars:
          - problem: 'A box has a square base with side $x$ and height $10$. (a) Write the volume $V$ as a function of $x$. (b) Find $V$ for $x=3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["x"]}},{"name":"v3","contract":{"kind":"exact"}}]}
            answer: 'V = 10*x^2; v3 = 90'
            solution_sketch: 'The volume is base area times height, $x^2\cdot10$. For $x=3$ it is $10\cdot9=90$.'
          - problem: 'A cylinder has height $8$ and base radius $x$. (a) Write the volume $V$ as a function of $x$. (b) Find the positive value of $x$ for which $V=72\pi$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["x"]}},{"name":"x","contract":{"kind":"exact"}}]}
            answer: 'V = 8*pi*x^2; x = 3'
            solution_sketch: 'The volume is $\pi x^2\cdot8$. The equation $8\pi x^2=72\pi$ gives $x^2=9$, so $x=3$.'
          - problem: 'A regular pyramid has a square base with side $x+2$ and height $x$. (a) Write the volume $V$ as a function of $x$. (b) Find $V$ for $x=4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["x"]}},{"name":"v4","contract":{"kind":"exact"}}]}
            answer: 'V = x*(x+2)^2/3; v4 = 48'
            solution_sketch: 'The volume is $\tfrac13(x+2)^2x$. For $x=4$ we get $\tfrac13\cdot36\cdot4=48$.'
          - problem: 'A cone has generatrix $10$ and base radius $x$, with $0<x<10$. (a) Write the volume $V$ as a function of $x$. (b) Find $V$ for $x=6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["x"]}},{"name":"v6","contract":{"kind":"exact"}}]}
            answer: 'V = pi*x^2*sqrt(100-x^2)/3; v6 = 96*pi'
            solution_sketch: 'The height is $\sqrt{100-x^2}$, so $V=\tfrac13\pi x^2\sqrt{100-x^2}$. For $x=6$ the height is $8$ and $V=\tfrac13\pi\cdot36\cdot8=96\pi$.'
          - problem: 'A square sheet has side $12$. A square with side $x$ is cut from each corner. The sides are folded up to make an open box. (a) Write the volume $V$ of the box as a function of $x$. (b) Find $V$ for $x=2$. (c) Find $V$ for $x=3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["x"]}},{"name":"v2","contract":{"kind":"exact"}},{"name":"v3","contract":{"kind":"exact"}}]}
            answer: 'V = x*(12-2*x)^2; v2 = 128; v3 = 108'
            solution_sketch: 'The base is a square with side $12-2x$ and the height is $x$. For $x=2$ we get $2\cdot64=128$. For $x=3$ we get $3\cdot36=108$.'
          - problem: 'A cylinder has base radius $r$ and height $h$ with $r+h=9$. (a) Write the volume $V$ as a function of $r$. (b) Find the value of $r$ with $0<r<9$ for which $V$ is the greatest. (c) Find the greatest value of $V$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["r"]}},{"name":"r","contract":{"kind":"exact"}},{"name":"Vmax","contract":{"kind":"exact"}}]}
            answer: 'V = pi*r^2*(9-r); r = 6; Vmax = 108*pi'
            solution_sketch: 'Here $h=9-r$, so $V=\pi r^2(9-r)$. The derivative is $V''=\pi(18r-3r^2)=3\pi r(6-r)$. It is positive for $r<6$ and negative for $r>6$, so the greatest value is at $r=6$, and $V=\pi\cdot36\cdot3=108\pi$.'
        constraints: 'volume written as a function of one variable; the last item finds the greatest volume'
    diagnostic_exemplar:
      problem: 'A cone has base radius $3$ and height $4$. Find its generatrix.'
      answer_contract: {"kind":"exact"}
      answer: '5'
      solution_sketch: 'The generatrix is $\sqrt{9+16}=5$.'
