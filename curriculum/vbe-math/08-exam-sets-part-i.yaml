            points: 1
          - problem: 'Compute $\log_2 48 - \log_2 3 + 5^{\log_5 7}$.'
            answer_contract: {"kind":"exact"}
            answer: '11'
            solution_sketch: 'We have $\log_2 48 - \log_2 3 = \log_2 16 = 4$. Also $5^{\log_5 7} = 7$. The sum is $11$.'
            points: 1
          - problem: 'Compute $\sqrt[3]{16}\cdot\sqrt[3]{4} + \sqrt{(3-\sqrt{10})^2}$.'
            answer_contract: {"kind":"exact"}
            answer: 'sqrt(10)+1'
            solution_sketch: 'We have $\sqrt[3]{16 \cdot 4} = \sqrt[3]{64} = 4$. Also $\sqrt{(3-\sqrt{10})^2} = |3-\sqrt{10}| = \sqrt{10}-3$. The sum is $4 + \sqrt{10} - 3 = \sqrt{10} + 1$.'
            points: 1
          - problem: 'An arithmetic progression has $a_1 = 7$ and $d = -2$. Find $a_9$.'
