          - problem: 'Find $x$ when $\log_5 x = 3$.'
            answer_contract: {"kind":"exact"}
            answer: '125'
            solution_sketch: 'By the definition of the logarithm, $x = 5^3 = 125$.'
            points: 1
          - problem: 'A geometric progression has $b_1 = 5$ and $q = 2$. Find the sum $S_4$ of the first four terms.'
            answer_contract: {"kind":"exact"}
