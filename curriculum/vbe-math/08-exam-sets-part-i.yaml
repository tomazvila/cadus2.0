            answer_contract: {"kind":"set"}
            answer: '{-3, 0, 3}'
            solution_sketch: 'Factor to get $x(x-3)(x+3) = 0$. The roots are $-3$, $0$ and $3$.'
            points: 1
          - problem: 'Write the formula of the graph of $y = \sqrt{x}$ after a shift of $4$ units to the left and $1$ unit up.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: 'sqrt(x+4)+1'
            solution_sketch: 'A shift to the left by $4$ replaces $x$ with $x + 4$. A shift up by $1$ adds $1$. The formula is $y = \sqrt{x+4} + 1$.'
            points: 1
          - problem: 'Solve $\dfrac{x-5}{x+1} < 0$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-1 < x < 5'
            solution_sketch: 'The fraction changes sign at $x = 5$ and at $x = -1$. It is negative between these points. Both end points are not in the solution.'
            points: 1
          - problem: 'Solve $4^x - 6\cdot 2^x - 16 = 0$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'Put $t = 2^x$ with $t > 0$. Then $t^2 - 6t - 16 = 0$, so $t = 8$ or $t = -2$. Only $t = 8$ is possible, so $x = 3$.'
            points: 1
          - problem: 'Solve $|x+1| = 3x-5$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'If $x \ge -1$, then $x + 1 = 3x - 5$ gives $x = 3$, and the check is true. If $x < -1$, then $-x - 1 = 3x - 5$ gives $x = 1$, which is not in the case.'
            points: 1
          - problem: 'Solve $x^4 - 10x^2 + 9 = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{-3, -1, 1, 3}'
            solution_sketch: 'Put $t = x^2$. Then $t^2 - 10t + 9 = 0$, so $t = 1$ or $t = 9$. So $x = \pm 1$ or $x = \pm 3$.'
            points: 1
          - problem: 'The points $(2, 20)$ and $(4, 80)$ are on the graph of $y = c \cdot a^x$ with $a > 0$. Find the value of $y$ for $x = 5$.'
            answer_contract: {"kind":"exact"}
            answer: '160'
            solution_sketch: 'The two points give $ca^2 = 20$ and $ca^4 = 80$. Divide to get $a^2 = 4$, so $a = 2$ and $c = 5$. Then $y = 5 \cdot 2^5 = 160$.'
            points: 1
          - problem: 'The points are $A(-1, 3)$ and $B(5, 11)$. Find the length of the vector $\overrightarrow{AB}$.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'We have $\overrightarrow{AB} = (6, 8)$. Its length is $\sqrt{36 + 64} = 10$.'
            points: 1
          - problem: 'The vectors are $\vec a = (3, t)$ and $\vec b = (6, 10)$. Find $t$ for which they are collinear.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'Collinear vectors have proportional coordinates. So $3 \cdot 10 - 6t = 0$ and $t = 5$.'
            points: 1
          - problem: 'Find the exact value of $\arccos\dfrac{\sqrt{2}}{2}$.'
            answer_contract: {"kind":"exact"}
            answer: 'pi/4'
            solution_sketch: 'The arccosine is the angle in $[0, \pi]$ with the cosine $\sqrt{2}/2$. This angle is $\pi/4$.'
            points: 1
          - problem: 'Find the scalar product of the vectors $(4, -2)$ and $(1, 5)$.'
            answer_contract: {"kind":"exact"}
            answer: '-6'
            solution_sketch: 'The scalar product is $4 \cdot 1 + (-2) \cdot 5 = -6$.'
