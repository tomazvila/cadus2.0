    knowledge_points:
      - id: kp1
        name: 'One-point items'
        key_prerequisites: [vbe-cp01-number-sets, vbe-cp02-modulus, vbe-cp03-powers, vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp11-equations, vbe-cp12-moduli-systems, vbe-cp13-inequalities]
        exemplars:
          - problem: 'Compute $\log_5 125 - \log_2 \dfrac18$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'We have $\log_5 125 = 3$ and $\log_2 \dfrac18 = -3$. The difference is $3 - (-3) = 6$.'
            points: 1
          - problem: 'Simplify $\sqrt{75} - \sqrt{12}$.'
            answer_contract: {"kind":"exact"}
            answer: '3*sqrt(3)'
            solution_sketch: 'We have $\sqrt{75} = 5\sqrt{3}$ and $\sqrt{12} = 2\sqrt{3}$. The difference is $3\sqrt{3}$.'
            points: 1
          - problem: 'Evaluate $|2-9| - 3\cdot|-4|$.'
            answer_contract: {"kind":"exact"}
            answer: '-5'
            solution_sketch: 'We have $|2-9| = 7$ and $|-4| = 4$. So the value is $7 - 3 \cdot 4 = -5$.'
            points: 1
          - problem: 'Compute $81^{3/4}$.'
            answer_contract: {"kind":"exact"}
            answer: '27'
            solution_sketch: 'We have $81 = 3^4$. So $81^{3/4} = 3^3 = 27$.'
            points: 1
          - problem: 'Find the exact value of $\cos\dfrac{2\pi}{3}$.'
            answer_contract: {"kind":"exact"}
            answer: '-1/2'
            solution_sketch: 'The angle $\dfrac{2\pi}{3}$ is in the second quarter. Its reference angle is $\dfrac{\pi}{3}$. The cosine is negative there, so the value is $-\dfrac12$.'
            points: 1
          - problem: 'Write the set $A \setminus B$ for $A = \{1, 3, 5, 7, 9\}$ and $B = \{3, 6, 9, 12\}$.'
            answer_contract: {"kind":"set"}
            answer: '{1, 5, 7}'
            solution_sketch: 'The set $A \setminus B$ holds the numbers of $A$ that are not in $B$. The numbers $3$ and $9$ are in $B$. The rest are $1$, $5$ and $7$.'
            points: 1
          - problem: 'Write $\dfrac{10}{\sqrt{6}+1}$ with no root in the denominator.'
            answer_contract: {"kind":"exact"}
            answer: '2*sqrt(6)-2'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{6}-1$. The bottom becomes $6-1 = 5$. The result is $2(\sqrt{6}-1) = 2\sqrt{6}-2$.'
            points: 1
          - problem: 'It is given that $\log_3 5 = a$. Express $\log_3 45$ through $a$.'
            answer_contract: {"kind":"function","vars":["a"]}
            answer: 'a+2'
            solution_sketch: 'We have $45 = 9 \cdot 5$. So $\log_3 45 = \log_3 9 + \log_3 5 = 2 + a$.'
            points: 1
          - problem: 'Compute $\log_6 9 + \log_6 4 + 5^{\log_5 7}$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'We have $\log_6 9 + \log_6 4 = \log_6 36 = 2$. Also $5^{\log_5 7} = 7$. The sum is $9$.'
            points: 1
          - problem: 'Simplify $\sqrt{7-4\sqrt{3}}$.'
            answer_contract: {"kind":"exact"}
            answer: '2-sqrt(3)'
            solution_sketch: 'Try $(2-\sqrt{3})^2 = 4 + 3 - 4\sqrt{3} = 7 - 4\sqrt{3}$. The number $2-\sqrt{3}$ is positive. So the root is $2-\sqrt{3}$.'
            points: 1
          - problem: 'An arithmetic progression has $a_1 = 5$ and $d = -2$. Find $a_{12}$.'
            answer_contract: {"kind":"exact"}
            answer: '-17'
            solution_sketch: 'We have $a_{12} = a_1 + 11d = 5 - 22 = -17$.'
            points: 1
          - problem: 'Solve $3^{x-1} = 81$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'We have $81 = 3^4$. So $x - 1 = 4$ and $x = 5$.'
            points: 1
          - problem: 'Solve $\sqrt{3x-2} = 4$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'Square both sides to get $3x - 2 = 16$. So $x = 6$. The check $\sqrt{16} = 4$ is true.'
            points: 1
          - problem: 'Solve $\log_7 x = -2$.'
            answer_contract: {"kind":"exact"}
            answer: '1/49'
            solution_sketch: 'By the definition of the logarithm, $x = 7^{-2} = \dfrac1{49}$.'
            points: 1
          - problem: 'A geometric progression has $b_1 = 5$ and $q = 2$. Find the sum $S_4$ of the first four terms.'
            answer_contract: {"kind":"exact"}
            answer: '75'
            solution_sketch: 'We have $S_4 = b_1 (q^4 - 1)/(q - 1) = 5 \cdot 15 / 1 = 75$.'
            points: 1
          - problem: 'Find all roots of $x^3 - 9x = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{-3, 0, 3}'
            solution_sketch: 'Factor to get $x(x-3)(x+3) = 0$. The roots are $-3$, $0$ and $3$.'
            points: 1
          - problem: 'Write the formula of the graph of $y = \sqrt{x}$ after a shift of $4$ units to the left and $1$ unit up.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: 'sqrt(x+4)+1'
            solution_sketch: 'A shift to the left by $4$ replaces $x$ with $x + 4$. A shift up by $1$ adds $1$. The formula is $y = \sqrt{x+4} + 1$.'
            points: 1
          - problem: 'Solve $\dfrac{2x-1}{x+3} \le 0$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-3 < x <= 1/2'
            solution_sketch: 'The fraction changes sign at $x = \dfrac12$ and at $x = -3$. It is negative between these points. At $x = \dfrac12$ it is zero, and $x = -3$ is not allowed.'
            points: 1
          - problem: 'Solve $25^x - 6\cdot 5^x + 5 = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{0, 1}'
            solution_sketch: 'Put $t = 5^x$ with $t > 0$. Then $t^2 - 6t + 5 = 0$, so $t = 1$ or $t = 5$. Both values are positive, so $x = 0$ or $x = 1$.'
            points: 1
          - problem: 'Solve $|x+1| = 3-x$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'If $x \ge -1$, then $x + 1 = 3 - x$ gives $x = 1$, which is in the case. If $x < -1$, then $-x - 1 = 3 - x$ gives $-1 = 3$, which is false. The only root is $1$.'
            points: 1
          - problem: 'Solve $x^4 - 10x^2 + 9 = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{-3, -1, 1, 3}'
            solution_sketch: 'Put $t = x^2$. Then $t^2 - 10t + 9 = 0$, so $t = 1$ or $t = 9$. So $x = \pm 1$ or $x = \pm 3$.'
            points: 1
          - problem: 'The points $(1, 6)$ and $(4, 162)$ are on the graph of $y = c \cdot a^x$ with $a > 0$. Find $a$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'The two points give $ca = 6$ and $ca^4 = 162$. Divide to get $a^3 = 27$. So $a = 3$.'
            points: 1
          - problem: 'The points are $A(-2, 1)$ and $B(4, 9)$. Find the length of the vector $\overrightarrow{AB}$.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'We have $\overrightarrow{AB} = (6, 8)$. Its length is $\sqrt{36 + 64} = 10$.'
            points: 1
          - problem: 'The vectors are $\vec a = (t, 4)$ and $\vec b = (3, -2)$. Find $t$ for which they are collinear.'
            answer_contract: {"kind":"exact"}
            answer: '-6'
            solution_sketch: 'Collinear vectors have proportional coordinates. So $\dfrac{t}{3} = \dfrac{4}{-2}$ and $t = -6$.'
            points: 1
          - problem: 'Find the exact value of $\arccos\dfrac12$.'
            answer_contract: {"kind":"exact"}
            answer: 'pi/3'
            solution_sketch: 'The arccosine is the angle in $[0, \pi]$ with the cosine $\dfrac12$. This angle is $\dfrac{\pi}{3}$.'
            points: 1
          - problem: 'Find the scalar product of the vectors $(4, -3)$ and $(2, 5)$.'
            answer_contract: {"kind":"exact"}
            answer: '-7'
            solution_sketch: 'The scalar product is $4 \cdot 2 + (-3) \cdot 5 = 8 - 15 = -7$.'
            points: 1
        constraints: 'Each item is worth 1 point and has one typed value. The items vary the topic of grade 11; the form takes the first 24.'
      - id: kp2
        name: 'Two-point items'
        key_prerequisites: [vbe-cp01-number-sets, vbe-cp02-modulus, vbe-cp03-powers, vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp07-progressions, vbe-cp08-function-concept, vbe-cp09-elementary-functions, vbe-cp10-trig-functions, vbe-cp11-equations, vbe-cp12-moduli-systems, vbe-cp13-inequalities, vbe-cp14-plane-vectors]
        exemplars:
          - problem: 'It is given that $\log_2 3 = p$ and $\log_2 5 = q$. Express $\log_2 \dfrac{45}{4}$ through $p$ and $q$.'
            answer_contract: {"kind":"function","vars":["p","q"]}
            answer: '2*p+q-2'
            solution_sketch: 'We have $45 = 3^2 \cdot 5$ and $4 = 2^2$. So $\log_2 \dfrac{45}{4} = 2p + q - 2$.'
            points: 2
          - problem: 'The vectors are $\vec a = (5, -2)$ and $\vec b = (1, 3)$. (a) Find the coordinates of $2\vec a - \vec b$. (b) Find the scalar product of $\vec a$ and $\vec b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"diff","contract":{"kind":"coordinates","arity":2}},{"name":"dot","contract":{"kind":"exact"}}]}
            answer: 'diff = (9,-7); dot = -1'
            solution_sketch: 'We have $2\vec a = (10, -4)$, so $2\vec a - \vec b = (9, -7)$. The scalar product is $5 \cdot 1 + (-2) \cdot 3 = -1$.'
            points: 2
          - problem: 'Find the period of the function $y = \tan(3x)$.'
            answer_contract: {"kind":"exact"}
            answer: 'pi/3'
            solution_sketch: 'The function $\tan x$ has the period $\pi$. The factor $3$ divides the period by $3$. The period is $\dfrac{\pi}{3}$.'
            points: 2
          - problem: 'An arithmetic progression has $a_3 = 11$ and $a_7 = 27$. (a) Find the difference $d$. (b) Find the sum $S_{10}$ of the first ten terms.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"exact"}},{"name":"S10","contract":{"kind":"exact"}}]}
            answer: 'd = 4; S10 = 210'
            solution_sketch: 'We have $a_7 - a_3 = 4d = 16$, so $d = 4$. Then $a_1 = 11 - 8 = 3$ and $a_{10} = 39$. So $S_{10} = (3 + 39)/2 \cdot 10 = 210$.'
            points: 2
          - problem: 'Solve $\log_5(x^2) = \log_5(2x+3)$.'
            answer_contract: {"kind":"set"}
            answer: '{-1, 3}'
            solution_sketch: 'The domain needs $x^2 > 0$ and $2x + 3 > 0$. The equation gives $x^2 = 2x + 3$, so $x = -1$ or $x = 3$. Both values are in the domain.'
            points: 2
          - problem: 'Solve $\sqrt{x+7} = x-5$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'Square both sides to get $x + 7 = x^2 - 10x + 25$, so $x^2 - 11x + 18 = 0$. The roots are $2$ and $9$. The check keeps $x = 9$, because $x - 5$ is not negative.'
            points: 2
          - problem: 'The function $y = a\cos(bx) + c$ has $a > 0$ and $b > 0$. Its largest value is $6$, its smallest value is $-2$ and its period is $\dfrac{2\pi}{3}$. (a) Find $b$. (b) Find the value of the function at $x = \dfrac{\pi}{9}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}},{"name":"v","contract":{"kind":"exact"}}]}
            answer: 'b = 3; v = 4'
            solution_sketch: 'The period is $2\pi / b = 2\pi/3$, so $b = 3$. The range has the length $8 = 2a$, so $a = 4$ and $c = 2$. At $x = \pi/9$ we get $4\cos(\pi/3) + 2 = 4$.'
            points: 2
          - problem: 'Solve $\log_2(x-1) + \log_2(x-3) < 3$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '3 < x < 5'
            solution_sketch: 'The domain is $x > 3$. The sum becomes $\log_2((x-1)(x-3)) < 3$, so $x^2 - 4x + 3 < 8$. This gives $-1 < x < 5$. With the domain, $3 < x < 5$.'
            points: 2
          - problem: 'The functions are $f(x) = 3x - 1$ and $g(x) = x^2 + 1$. (a) Find $f(g(2))$. (b) Find $g(f(2))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"fg","contract":{"kind":"exact"}},{"name":"gf","contract":{"kind":"exact"}}]}
            answer: 'fg = 14; gf = 26'
            solution_sketch: 'We have $g(2) = 5$, so $f(g(2)) = 14$. Also $f(2) = 5$, so $g(f(2)) = 26$.'
            points: 2
          - problem: 'The vectors $\vec a$ and $\vec b$ have the lengths $2$ and $5$. The angle between them is $120^\circ$. Find the scalar product of $\vec a$ and $\vec b$.'
            answer_contract: {"kind":"exact"}
            answer: '-5'
            solution_sketch: 'The scalar product is $2 \cdot 5 \cdot \cos 120^\circ = 10 \cdot (-\dfrac12) = -5$.'
            points: 2
        constraints: 'Each item is worth 2 points and has one typed value or two typed parts. The items vary the topic of grade 11; the form takes the first 8.'
