        key_prerequisites: [vbe-cp01-number-sets, vbe-cp02-modulus, vbe-cp03-powers, vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp11-equations, vbe-cp12-moduli-systems, vbe-cp13-inequalities]
        exemplars:
          - problem: 'Compute $\log_2 \dfrac{1}{16} + \log_9 81$.'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            solution_sketch: 'We have $\log_2 \dfrac{1}{16} = -4$ and $\log_9 81 = 2$. The sum is $-2$.'
            points: 1
          - problem: 'Simplify $\sqrt{45} + \sqrt{20}$.'
            answer_contract: {"kind":"exact"}
            answer: '5*sqrt(5)'
            solution_sketch: 'We have $\sqrt{45} = 3\sqrt{5}$ and $\sqrt{20} = 2\sqrt{5}$. The sum is $5\sqrt{5}$.'
            points: 1
          - problem: 'Evaluate $|-7| - 3\cdot|2-5|$.'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            solution_sketch: 'We have $|-7| = 7$ and $|2-5| = 3$. So the value is $7 - 9 = -2$.'
            points: 1
          - problem: 'Compute $32^{-2/5}$.'
            answer_contract: {"kind":"exact"}
            answer: '1/4'
            solution_sketch: 'We have $32 = 2^5$. So $32^{-2/5} = 2^{-2} = \dfrac14$.'
            points: 1
          - problem: 'Find the exact value of $\cos\dfrac{2\pi}{3}$.'
            answer_contract: {"kind":"exact"}
            answer: '-1/2'
            solution_sketch: 'The angle $\dfrac{2\pi}{3}$ is in the second quarter. Its reference angle is $\dfrac{\pi}{3}$. The cosine is negative there, so the value is $-\dfrac12$.'
            points: 1
          - problem: 'Write the set $A \setminus B$ for $A = \{1, 3, 5, 7, 9\}$ and $B = \{3, 6, 9, 12\}$.'
            answer_contract: {"kind":"set"}
            answer: '{1, 5, 7}'
            solution_sketch: 'The set $A \setminus B$ holds the numbers of $A$ that are not in $B$. These numbers are $1$, $5$ and $7$.'
            points: 1
          - problem: 'Write $\dfrac{10}{\sqrt{6}+1}$ with no root in the denominator.'
            answer_contract: {"kind":"exact"}
            answer: '2*sqrt(6)-2'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{6}-1$. The bottom becomes $6-1 = 5$. The result is $2(\sqrt{6}-1) = 2\sqrt{6}-2$.'
            points: 1
          - problem: 'It is given that $\log_5 2 = m$. Express $\log_5 40$ through $m$.'
            answer_contract: {"kind":"function","vars":["m"]}
            answer: '3*m+1'
            solution_sketch: 'We have $40 = 8 \cdot 5$. So $\log_5 40 = 3\log_5 2 + \log_5 5 = 3m + 1$.'
            points: 1
          - problem: 'Compute $\log_2 12 - \log_2 3 + 5^{\log_5 7}$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'We have $\log_2 12 - \log_2 3 = \log_2 4 = 2$. Also $5^{\log_5 7} = 7$. The sum is $9$.'
            points: 1
          - problem: 'Compute $\sqrt{(2-\sqrt{7})^2} + \sqrt[4]{(2-\sqrt{7})^4}$.'
            answer_contract: {"kind":"exact"}
            answer: '2*sqrt(7)-4'
            solution_sketch: 'An even root of an even power gives the modulus. Both terms equal $|2-\sqrt{7}| = \sqrt{7}-2$. The sum is $2\sqrt{7}-4$.'
            points: 1
          - problem: 'An arithmetic progression has $a_1 = -5$ and $d = 4$. Find $a_{12}$.'
            answer_contract: {"kind":"exact"}
            answer: '39'
            solution_sketch: 'We have $a_{12} = a_1 + 11d = -5 + 44 = 39$.'
            points: 1
          - problem: 'Solve $5^{x-3} = 625$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'We have $625 = 5^4$. So $x - 3 = 4$ and $x = 7$.'
            points: 1
          - problem: 'Solve $\sqrt{x+7} = 4$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'Square both sides to get $x + 7 = 16$. So $x = 9$. The check $\sqrt{16} = 4$ is true.'
            points: 1
          - problem: 'Solve $\log_2(x-1) = 5$.'
            answer_contract: {"kind":"exact"}
            answer: '33'
            solution_sketch: 'By the definition of the logarithm, $x - 1 = 2^5 = 32$. So $x = 33$.'
            points: 1
          - problem: 'A geometric progression has $b_1 = 4$ and $q = 2$. Find the sum $S_6$ of the first six terms.'
            answer_contract: {"kind":"exact"}
            answer: '252'
            solution_sketch: 'We have $S_6 = b_1 (q^6 - 1)/(q - 1) = 4 \cdot 63 / 1 = 252$.'
            points: 1
          - problem: 'Find all roots of $x^3 - 3x^2 - 4x = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{-1, 0, 4}'
            solution_sketch: 'Factor to get $x(x-4)(x+1) = 0$. The roots are $-1$, $0$ and $4$.'
            points: 1
          - problem: 'Write the formula of the graph of $y = \sqrt{x}$ after a shift of $4$ units to the left and $1$ unit up.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: 'sqrt(x+4)+1'
            solution_sketch: 'A shift to the left by $4$ replaces $x$ with $x + 4$. A shift up by $1$ adds $1$. The formula is $y = \sqrt{x+4} + 1$.'
            points: 1
          - problem: 'Solve $\dfrac{2x-1}{x+3} < 0$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-3 < x < 1/2'
            solution_sketch: 'The fraction changes sign at $x = \dfrac12$ and at $x = -3$. It is negative between these points. Both end points are not in the answer.'
            points: 1
          - problem: 'Solve $9^x - 4\cdot 3^x - 45 = 0$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'Put $t = 3^x$ with $t > 0$. Then $t^2 - 4t - 45 = 0$, so $t = 9$ or $t = -5$. Only $t = 9$ is possible, so $x = 2$.'
            points: 1
          - problem: 'Solve $|x+1| = 3x-5$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'If $x \ge -1$, then $x + 1 = 3x - 5$ gives $x = 3$, and the check is true. If $x < -1$, then $-x - 1 = 3x - 5$ gives $x = 1$, which is not in the case.'
            points: 1
          - problem: 'Solve $x^4 - 10x^2 + 9 = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{-3, -1, 1, 3}'
            solution_sketch: 'Put $t = x^2$. Then $t^2 - 10t + 9 = 0$, so $t = 1$ or $t = 9$. So $x = \pm 1$ or $x = \pm 3$.'
            points: 1
          - problem: 'The points $(2, 12)$ and $(4, 48)$ are on the graph of $y = c \cdot a^x$ with $a > 0$. Find $c$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'The two points give $ca^2 = 12$ and $ca^4 = 48$. Divide to get $a^2 = 4$, so $a = 2$. Then $4c = 12$ and $c = 3$.'
            points: 1
          - problem: 'The points are $A(-1, 3)$ and $B(4, -9)$. Find the length of the vector $\overrightarrow{AB}$.'
            answer_contract: {"kind":"exact"}
            answer: '13'
            solution_sketch: 'We have $\overrightarrow{AB} = (5, -12)$. Its length is $\sqrt{25 + 144} = 13$.'
            points: 1
          - problem: 'The vectors are $\vec a = (t, 3)$ and $\vec b = (4, -6)$. Find $t$ for which they are collinear.'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            solution_sketch: 'Collinear vectors have proportional coordinates. So $\dfrac{t}{4} = \dfrac{3}{-6}$ and $t = -2$.'
            points: 1
          - problem: 'Find the exact value of $\arccos\left(-\dfrac12\right)$.'
            answer_contract: {"kind":"exact"}
            answer: '2*pi/3'
            solution_sketch: 'The arccosine is the angle in $[0, \pi]$ with the cosine $-\dfrac12$. This angle is $\dfrac{2\pi}{3}$.'
            points: 1
          - problem: 'Find the scalar product of the vectors $(4, -2)$ and $(1, 6)$.'
            answer_contract: {"kind":"exact"}
            answer: '-8'
            solution_sketch: 'The scalar product is $4 \cdot 1 + (-2) \cdot 6 = -8$.'
            points: 1
        constraints: 'Each item is worth 1 point and has one typed value. The items vary the topic of grade 11; the form takes the first 24.'
      - id: kp2
        name: 'Two-point items'
        key_prerequisites: [vbe-cp01-number-sets, vbe-cp02-modulus, vbe-cp03-powers, vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp07-progressions, vbe-cp08-function-concept, vbe-cp09-elementary-functions, vbe-cp10-trig-functions, vbe-cp11-equations, vbe-cp12-moduli-systems, vbe-cp13-inequalities, vbe-cp14-plane-vectors]
        exemplars:
          - problem: 'It is given that $\log_2 3 = p$ and $\log_2 7 = q$. Express $\log_2 \dfrac{63}{4}$ through $p$ and $q$.'
            answer_contract: {"kind":"function","vars":["p","q"]}
            answer: '2*p+q-2'
            solution_sketch: 'We have $63 = 3^2 \cdot 7$ and $4 = 2^2$. So $\log_2 \dfrac{63}{4} = 2p + q - 2$.'
            points: 2
          - problem: 'The vectors are $\vec a = (6, -2)$ and $\vec b = (-2, 4)$. (a) Find the coordinates of $2\vec a - \vec b$. (b) Find the length of $\vec a - \vec b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"w","contract":{"kind":"coordinates","arity":2}},{"name":"len","contract":{"kind":"exact"}}]}
            answer: 'w = (14,-8); len = 10'
            solution_sketch: 'We have $2\vec a = (12, -4)$, so $2\vec a - \vec b = (14, -8)$. Also $\vec a - \vec b = (8, -6)$. Its length is $\sqrt{64 + 36} = 10$.'
            points: 2
          - problem: '(a) Find the period of the function $y = \tan(3x)$. (b) Find the period of the function $y = \sin(4x)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = pi/3; b = pi/2'
            solution_sketch: 'The function $\tan x$ has the period $\pi$. The factor $3$ divides it by $3$, so the period is $\dfrac{\pi}{3}$. The function $\sin x$ has the period $2\pi$. The factor $4$ divides it by $4$, so the period is $\dfrac{\pi}{2}$.'
            points: 2
          - problem: 'An arithmetic progression has $a_3 = 11$ and $a_7 = 27$. (a) Find the difference $d$. (b) Find the sum $S_{10}$ of the first ten terms.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"exact"}},{"name":"S10","contract":{"kind":"exact"}}]}
            answer: 'd = 4; S10 = 210'
            solution_sketch: 'We have $a_7 - a_3 = 4d = 16$, so $d = 4$. Then $a_1 = 11 - 8 = 3$. So $S_{10} = (2 \cdot 3 + 9 \cdot 4)/2 \cdot 10 = 210$.'
            points: 2
          - problem: 'Solve $\log_3(x+2) + \log_3(x-4) = 3$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'The domain is $x > 4$. The sum becomes $\log_3(x^2 - 2x - 8) = 3$, so $x^2 - 2x - 35 = 0$ and $x = 7$ or $x = -5$. Only $x = 7$ is in the domain.'
            points: 2
          - problem: 'Solve $x + 1 = \sqrt{7x + 15}$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'Square both sides to get $x^2 + 2x + 1 = 7x + 15$, so $x^2 - 5x - 14 = 0$. The roots are $-2$ and $7$. The check keeps $x = 7$, because $x + 1$ is not negative.'
            points: 2
          - problem: 'The function $y = a\cos(bx) + c$ has $a > 0$ and $b > 0$. Its largest value is $4$, its smallest value is $-2$ and its period is $\dfrac{2\pi}{3}$. (a) Find $b$. (b) Find $c$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'b = 3; c = 1'
            solution_sketch: 'The period is $2\pi / b = 2\pi/3$, so $b = 3$. The number $c$ is the middle of the largest and the smallest value. So $c = (4 + (-2))/2 = 1$.'
            points: 2
          - problem: 'Solve $\log_{1/2}(2x-3) > -2$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '3/2 < x < 7/2'
            solution_sketch: 'The domain is $2x - 3 > 0$, so $x > \dfrac32$. The base is less than $1$, so the sign turns: $2x - 3 < (1/2)^{-2} = 4$. So $x < \dfrac72$.'
            points: 2
          - problem: 'The functions are $f(x) = 3x + 1$ and $g(x) = x^2 - 2$. (a) Find $f(g(2))$. (b) Find $g(f(1))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"fg","contract":{"kind":"exact"}},{"name":"gf","contract":{"kind":"exact"}}]}
            answer: 'fg = 7; gf = 14'
            solution_sketch: 'We have $g(2) = 2$, so $f(g(2)) = 7$. Also $f(1) = 4$, so $g(f(1)) = 14$.'
            points: 2
          - problem: 'The vectors $\vec a$ and $\vec b$ have the lengths $5$ and $2$. The angle between them is $120^\circ$. Find the scalar product of $\vec a$ and $\vec b$.'
            answer_contract: {"kind":"exact"}
            answer: '-5'
            solution_sketch: 'The scalar product is $5 \cdot 2 \cdot \cos 120^\circ = 10 \cdot \left(-\dfrac12\right) = -5$.'
            points: 2
        constraints: 'Each item is worth 2 points and has one typed value or two typed parts. The items vary the topic of grade 11; the form takes the first 8.'
    diagnostic_exemplar:
      problem: 'Compute $\log_3 27 + 3^2$.'
      answer_contract: {"kind":"exact"}
      answer: '11'
      solution_sketch: 'We have $\log_3 27 = 3$ and $3^2 = 9$. The sum is $12$.'
