        exemplars:
          - problem: 'Compute $\log_4 64 + \log_{10} 0.01$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'We have $\log_4 64 = 3$ and $\log_{10} 0.01 = -2$. The sum is $1$.'
            points: 1
          - problem: 'Simplify $\sqrt{75} - \sqrt{27}$.'
            answer_contract: {"kind":"exact"}
            answer: '2*sqrt(3)'
            solution_sketch: 'We have $\sqrt{75} = 5\sqrt{3}$ and $\sqrt{27} = 3\sqrt{3}$. The difference is $2\sqrt{3}$.'
            points: 1
          - problem: 'Evaluate $|-6| - 2\cdot|4-10|$.'
            answer_contract: {"kind":"exact"}
            answer: '-6'
            solution_sketch: 'We have $|-6| = 6$ and $|4-10| = 6$. So the value is $6 - 2 \cdot 6 = -6$.'
            points: 1
          - problem: 'Compute $16^{3/4}$.'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'We have $16 = 2^4$. So $16^{3/4} = 2^3 = 8$.'
            points: 1
          - problem: 'Find the exact value of $\cos\dfrac{2\pi}{3}$.'
            answer_contract: {"kind":"exact"}
            answer: '-1/2'
            solution_sketch: 'The angle $\dfrac{2\pi}{3}$ is in the second quarter. It has the reference angle $\dfrac{\pi}{3}$. The cosine is negative there, so the value is $-\dfrac12$.'
            points: 1
          - problem: 'Write the set $A \setminus B$ for $A = \{1, 3, 5, 7, 9\}$ and $B = \{3, 6, 9, 12\}$.'
            answer_contract: {"kind":"set"}
            answer: '{1, 5, 7}'
            solution_sketch: 'The set $A \setminus B$ holds the numbers of $A$ that are not in $B$. These numbers are $1$, $5$ and $7$.'
            points: 1
          - problem: 'Write $\dfrac{10}{\sqrt{6}+1}$ with no root in the denominator.'
            answer_contract: {"kind":"exact"}
            answer: '2*sqrt(6)-2'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{6}-1$. The bottom becomes $6-1 = 5$. The result is $2(\sqrt{6}-1) = 2\sqrt{6}-2$.'
            points: 1
          - problem: 'It is given that $\log_5 2 = m$. Express $\log_5 20$ through $m$.'
            answer_contract: {"kind":"function","vars":["m"]}
            answer: '2*m+1'
            solution_sketch: 'We have $20 = 4 \cdot 5$. So $\log_5 20 = 2\log_5 2 + \log_5 5 = 2m + 1$.'
            points: 1
          - problem: 'Compute $\log_6 4 + \log_6 9 + 5^{\log_5 7}$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'We have $\log_6 4 + \log_6 9 = \log_6 36 = 2$. Also $5^{\log_5 7} = 7$. The sum is $9$.'
            points: 1
          - problem: 'Compute $\sqrt{(3-\pi)^2} + \sqrt[4]{(3-\pi)^4}$.'
            answer_contract: {"kind":"exact"}
            answer: '2*pi-6'
            solution_sketch: 'An even root of an even power gives the modulus. So each term is $|3-\pi| = \pi - 3$. The sum is $2\pi - 6$.'
            points: 1
          - problem: 'An arithmetic progression has $a_1 = -5$ and $d = 4$. Find $a_{12}$.'
            answer_contract: {"kind":"exact"}
            answer: '39'
            solution_sketch: 'We have $a_{12} = a_1 + 11d = -5 + 44 = 39$.'
            points: 1
          - problem: 'Solve $3^{2x-1} = 81$.'
            answer_contract: {"kind":"exact"}
            answer: '5/2'
            solution_sketch: 'We have $81 = 3^4$. So $2x - 1 = 4$ and $x = \dfrac52$.'
            points: 1
          - problem: 'Solve $\sqrt{x+7} = 4$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'Square both sides to get $x + 7 = 16$. So $x = 9$. The check $\sqrt{16} = 4$ is true.'
            points: 1
          - problem: 'Solve $\log_5 (x-1) = 2$.'
            answer_contract: {"kind":"exact"}
            answer: '26'
            solution_sketch: 'By the definition of the logarithm, $x - 1 = 5^2 = 25$. So $x = 26$.'
            points: 1
          - problem: 'A geometric progression has $b_1 = 81$ and $q = \dfrac13$. Find $b_5$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'We have $b_5 = b_1 q^4 = 81 \cdot \dfrac{1}{81} = 1$.'
            points: 1
          - problem: 'Find all roots of $x^3 - 3x^2 - 4x = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{-1, 0, 4}'
            solution_sketch: 'Factor to get $x(x-4)(x+1) = 0$. The roots are $-1$, $0$ and $4$.'
            points: 1
          - problem: 'Write the formula of the graph of $y = \sqrt{x}$ after a shift of $4$ units to the left and a reflection in the $x$-axis.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '-sqrt(x+4)'
            solution_sketch: 'A shift to the left by $4$ replaces $x$ with $x + 4$. The reflection in the $x$-axis changes the sign of the function. The formula is $y = -\sqrt{x+4}$.'
            points: 1
          - problem: 'Solve $\dfrac{6}{x-1} \ge 2$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '1 < x <= 4'
            solution_sketch: 'Move $2$ to the left: $\dfrac{8-2x}{x-1} \ge 0$. The fraction changes sign at $x = 4$ and at $x = 1$. It is not negative for $1 < x \le 4$, and $x = 1$ is not allowed.'
            points: 1
          - problem: 'Solve $4^x - 5\cdot 2^x + 4 = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{0, 2}'
            solution_sketch: 'Put $t = 2^x$ with $t > 0$. Then $t^2 - 5t + 4 = 0$, so $t = 1$ or $t = 4$. So $x = 0$ or $x = 2$.'
            points: 1
          - problem: 'Solve $|2x-3| = x+3$.'
            answer_contract: {"kind":"set"}
            answer: '{0, 6}'
            solution_sketch: 'If $x \ge \dfrac32$, then $2x - 3 = x + 3$ gives $x = 6$, which is in the case. If $x < \dfrac32$, then $3 - 2x = x + 3$ gives $x = 0$, which is in the case.'
            points: 1
          - problem: 'The numbers $x$ and $y$ satisfy $x + y = 7$ and $x^2 - y^2 = 21$. Find $x$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'We have $x^2 - y^2 = (x-y)(x+y)$. So $7(x-y) = 21$ and $x - y = 3$. Add this to $x + y = 7$ to get $2x = 10$, so $x = 5$.'
            points: 1
          - problem: 'The graph of $y = \log_a x + b$ with $a > 0$ and $a \ne 1$ passes through $(2, 3)$ and $(8, 5)$. Find $b$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'Subtract the two equations: $\log_a 8 - \log_a 2 = \log_a 4 = 2$. So $a^2 = 4$ and $a = 2$. Then $3 = \log_2 2 + b$ gives $b = 2$.'
            points: 1
          - problem: 'The points are $A(-2, 1)$ and $B(4, 9)$. Find the length of the vector $\overrightarrow{AB}$.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'We have $\overrightarrow{AB} = (6, 8)$. Its length is $\sqrt{36 + 64} = 10$.'
            points: 1
          - problem: 'The vectors are $\vec a = (t, 3)$ and $\vec b = (t-1, -2)$. Find all values of $t$ for which they are perpendicular.'
            answer_contract: {"kind":"set"}
            answer: '{-2, 3}'
            solution_sketch: 'Perpendicular vectors have the scalar product $0$. So $t(t-1) - 6 = 0$, that is $t^2 - t - 6 = 0$. The roots are $t = -2$ and $t = 3$.'
            points: 1
          - problem: 'Find the exact value of $\arccos\left(-\dfrac12\right)$.'
            answer_contract: {"kind":"exact"}
            answer: '2*pi/3'
            solution_sketch: 'The arccosine is the angle in $[0, \pi]$ with the cosine $-\dfrac12$. This angle is $\dfrac{2\pi}{3}$.'
            points: 1
          - problem: 'Find the scalar product of the vectors $(4, -3)$ and $(2, 5)$.'
            answer_contract: {"kind":"exact"}
            answer: '-7'
            solution_sketch: 'The scalar product is $4 \cdot 2 + (-3) \cdot 5 = -7$.'
            points: 1
        constraints: 'Each item is worth 1 point and has one typed value. The items vary the topic of grade 11; the form takes the first 24.'
      - id: kp2
        name: 'Two-point items'
        key_prerequisites: [vbe-cp01-number-sets, vbe-cp02-modulus, vbe-cp03-powers, vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp07-progressions, vbe-cp08-function-concept, vbe-cp09-elementary-functions, vbe-cp10-trig-functions, vbe-cp11-equations, vbe-cp12-moduli-systems, vbe-cp13-inequalities, vbe-cp14-plane-vectors]
        exemplars:
          - problem: 'It is given that $\log_2 3 = a$ and $\log_2 7 = b$. Express $\log_4 63$ through $a$ and $b$.'
            answer_contract: {"kind":"function","vars":["a","b"]}
            answer: 'a+b/2'
            solution_sketch: 'We have $63 = 9 \cdot 7$, so $\log_2 63 = 2a + b$. Also $\log_4 63 = \dfrac{\log_2 63}{2}$. So $\log_4 63 = a + \dfrac{b}{2}$.'
            points: 2
          - problem: 'The vectors are $\vec a = (5, -2)$ and $\vec b = (1, 3)$. (a) Find the coordinates of $2\vec a - \vec b$. (b) Find the length of $\vec a + \vec b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"diff","contract":{"kind":"coordinates","arity":2}},{"name":"len","contract":{"kind":"exact"}}]}
            answer: 'diff = (9,-7); len = sqrt(37)'
            solution_sketch: 'We have $2\vec a = (10, -4)$, so $2\vec a - \vec b = (9, -7)$. Also $\vec a + \vec b = (6, 1)$. Its length is $\sqrt{36 + 1} = \sqrt{37}$.'
            points: 2
          - problem: 'An arithmetic progression has $a_1 = -4$ and $d = 3$. Find the sum of its first $10$ terms.'
            answer_contract: {"kind":"exact"}
            answer: '95'
            solution_sketch: 'Use the sum formula $S_n = \frac{n(2a_1 + (n-1)d)}{2}$. Here $S_{10} = 5\cdot(-8 + 27)$. So $S_{10} = 95$.'
            points: 2
          - problem: 'An arithmetic progression has $a_3 = 11$ and $a_8 = 36$. (a) Find the difference $d$. (b) Find the first term $a_1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"exact"}},{"name":"a1","contract":{"kind":"exact"}}]}
            answer: 'd = 5; a1 = 1'
            solution_sketch: 'We have $a_8 - a_3 = 5d = 25$, so $d = 5$. Then $a_1 = a_3 - 2d = 11 - 10 = 1$.'
            points: 2
          - problem: 'Solve $\log_3(x+2) + \log_3(x-4) = 3$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'The domain is $x > 4$. The sum becomes $\log_3\big((x+2)(x-4)\big) = 3$, so $x^2 - 2x - 8 = 27$. Then $x^2 - 2x - 35 = 0$ and $x = 7$ or $x = -5$. Only $x = 7$ is in the domain.'
            points: 2
          - problem: 'Solve $\sqrt{x+8} = x-4$.'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'Square both sides to get $x + 8 = x^2 - 8x + 16$, so $x^2 - 9x + 8 = 0$. The roots are $1$ and $8$. The check keeps $x = 8$, because $x = 1$ gives $x - 4 = -3$.'
            points: 2
          - problem: 'The graph of $y = x^2 + px + 9$ with $p > 0$ touches the $x$-axis. (a) Find $p$. (b) Find the $x$-coordinate of the touching point.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"x0","contract":{"kind":"exact"}}]}
            answer: 'p = 6; x0 = -3'
            solution_sketch: 'The graph touches the $x$-axis when the discriminant is $0$: $p^2 - 36 = 0$. With $p > 0$ we get $p = 6$. Then $x^2 + 6x + 9 = (x+3)^2$, so the touching point has $x = -3$.'
            points: 2
          - problem: 'Solve $\log_2(x-1) + \log_2(x+1) \le 3$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '1 < x <= 3'
            solution_sketch: 'The domain is $x > 1$. The sum becomes $\log_2(x^2 - 1) \le 3$, so $x^2 - 1 \le 8$ and $x^2 \le 9$. With $x > 1$ we get $1 < x \le 3$.'
            points: 2
          - problem: 'The functions are $f(x) = 3x + 1$ and $g(x) = x^2 - 2$. (a) Find $f(g(2))$. (b) Find $g(f(2))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"fg","contract":{"kind":"exact"}},{"name":"gf","contract":{"kind":"exact"}}]}
            answer: 'fg = 7; gf = 47'
            solution_sketch: 'We have $g(2) = 2$, so $f(g(2)) = 7$. Also $f(2) = 7$, so $g(f(2)) = 47$.'
            points: 2
