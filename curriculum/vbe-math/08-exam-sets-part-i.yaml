            answer_contract: {"kind":"function","vars":["p","q"]}
            answer: '2*p+q-4'
            solution_sketch: 'We have $63 = 3^2 \cdot 7$ and $16 = 2^4$. So $\log_2 \dfrac{63}{16} = 2p + q - 4$.'
            points: 2
          - problem: 'The vectors are $\vec a = (2, 5)$ and $\vec b = (-1, 3)$. (a) Find the coordinates of $3\vec a - \vec b$. (b) Find the scalar product of $\vec a$ and $\vec b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"diff","contract":{"kind":"coordinates","arity":2}},{"name":"dot","contract":{"kind":"exact"}}]}
            answer: 'diff = (7,12); dot = 13'
            solution_sketch: 'We have $3\vec a = (6, 15)$, so $3\vec a - \vec b = (7, 12)$. The scalar product is $2 \cdot (-1) + 5 \cdot 3 = 13$.'
            points: 2
          - problem: 'Find the period of the function $y = \tan(3x)$.'
            answer_contract: {"kind":"exact"}
            answer: 'pi/3'
            solution_sketch: 'The function $\tan x$ has the period $\pi$. The factor $3$ divides the period by $3$. The period is $\dfrac{\pi}{3}$.'
            points: 2
          - problem: 'An arithmetic progression has $a_3 = 11$ and $a_7 = 27$. (a) Find the difference $d$. (b) Find the first term $a_1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"exact"}},{"name":"a1","contract":{"kind":"exact"}}]}
            answer: 'd = 4; a1 = 3'
            solution_sketch: 'We have $a_7 - a_3 = 4d = 16$, so $d = 4$. Then $a_1 = a_3 - 2d = 3$.'
            points: 2
          - problem: 'Solve $\log_3(x+2) + \log_3(x-4) = 3$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'The domain is $x > 4$. The sum becomes $\log_3((x+2)(x-4)) = 3$, so $x^2 - 2x - 8 = 27$. Then $x^2 - 2x - 35 = 0$ and $x = 7$ or $x = -5$. Only $x = 7$ is in the domain.'
            points: 2
          - problem: 'Solve $x + 1 = \sqrt{5x + 11}$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'Square both sides to get $x^2 + 2x + 1 = 5x + 11$, so $x^2 - 3x - 10 = 0$. The roots are $5$ and $-2$. The check keeps $x = 5$, because $x + 1$ is not negative.'
            points: 2
          - problem: 'The function $y = a\cos(bx) + c$ has $a > 0$ and $b > 0$. Its largest value is $6$, its smallest value is $-2$ and its period is $\dfrac{2\pi}{3}$. (a) Find $b$. (b) Find $c$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'b = 3; c = 2'
            solution_sketch: 'The period is $2\pi / b = 2\pi / 3$, so $b = 3$. The value $c$ is the middle of the range, so $c = (6 + (-2))/2 = 2$.'
            points: 2
          - problem: 'Solve $4^x - 5\cdot 2^x + 4 < 0$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '0 < x < 2'
            solution_sketch: 'Put $t = 2^x$. Then $t^2 - 5t + 4 < 0$, so $1 < t < 4$. So $0 < x < 2$.'
            points: 2
          - problem: 'The functions are $f(x) = 3x + 1$ and $g(x) = x^2 - 2$. (a) Find $f(g(2))$. (b) Find $g(f(1))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"fg","contract":{"kind":"exact"}},{"name":"gf","contract":{"kind":"exact"}}]}
            answer: 'fg = 7; gf = 14'
            solution_sketch: 'We have $g(2) = 2$, so $f(g(2)) = 7$. Also $f(1) = 4$, so $g(f(1)) = 14$.'
            points: 2
          - problem: 'The vectors $\vec a$ and $\vec b$ have the lengths $5$ and $2$. The angle between them is $120^\circ$. Find the scalar product of $\vec a$ and $\vec b$.'
            answer_contract: {"kind":"exact"}
            answer: '-5'
            solution_sketch: 'The scalar product is $5 \cdot 2 \cdot \cos 120^\circ = 10 \cdot \left(-\dfrac12\right) = -5$.'
            points: 2
