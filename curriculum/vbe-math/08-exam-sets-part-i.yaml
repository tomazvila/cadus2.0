    knowledge_points:
      - id: kp1
        name: 'One-point items'
        key_prerequisites: [vbe-cp01-number-sets, vbe-cp02-modulus, vbe-cp03-powers, vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp11-equations, vbe-cp12-moduli-systems, vbe-cp13-inequalities]
        exemplars:
          - problem: 'Compute $\log_2 32 - \log_3 9$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'We have $\log_2 32 = 5$ and $\log_3 9 = 2$. The difference is $3$.'
            points: 1
          - problem: 'Simplify $\sqrt{72} - \sqrt{8}$.'
            answer_contract: {"kind":"exact"}
            answer: '4*sqrt(2)'
            solution_sketch: 'We have $\sqrt{72} = 6\sqrt{2}$ and $\sqrt{8} = 2\sqrt{2}$. The difference is $4\sqrt{2}$.'
            points: 1
          - problem: 'Evaluate $|3-8| + 4\cdot|-2|$.'
            answer_contract: {"kind":"exact"}
            answer: '13'
            solution_sketch: 'We have $|3-8| = 5$ and $|-2| = 2$. So the value is $5 + 4 \cdot 2 = 13$.'
            points: 1
          - problem: 'Compute $27^{2/3}$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'We have $27 = 3^3$. So $27^{2/3} = 3^2 = 9$.'
            points: 1
          - problem: 'Find the exact value of $\sin\dfrac{5\pi}{6}$.'
            answer_contract: {"kind":"exact"}
            answer: '1/2'
            solution_sketch: 'The angle $\dfrac{5\pi}{6}$ is in the second quarter. It has the reference angle $\dfrac{\pi}{6}$. The sine is positive there, so the value is $\dfrac12$.'
            points: 1
          - problem: 'Write the set $A \cap B$ for $A = \{1, 2, 3, 4, 6\}$ and $B = \{2, 4, 5, 6, 8\}$.'
            answer_contract: {"kind":"set"}
            answer: '{2, 4, 6}'
            solution_sketch: 'The set $A \cap B$ holds the numbers that are in both sets. These numbers are $2$, $4$ and $6$.'
            points: 1
          - problem: 'Write $\dfrac{6}{\sqrt{7}-2}$ with no root in the denominator.'
            answer_contract: {"kind":"exact"}
            answer: '2*sqrt(7)+4'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{7}+2$. The bottom becomes $7-4 = 3$. The result is $2(\sqrt{7}+2) = 2\sqrt{7}+4$.'
            points: 1
          - problem: 'It is given that $\log_2 3 = a$. Express $\log_2 24$ through $a$.'
            answer_contract: {"kind":"function","vars":["a"]}
            answer: 'a+3'
            solution_sketch: 'We have $24 = 8 \cdot 3$. So $\log_2 24 = \log_2 8 + \log_2 3 = 3 + a$.'
            points: 1
          - problem: 'Compute $\log_5 50 - \log_5 2 + 3^{\log_3 4}$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'We have $\log_5 50 - \log_5 2 = \log_5 25 = 2$. Also $3^{\log_3 4} = 4$. The sum is $6$.'
            points: 1
          - problem: 'Compute $\sqrt[3]{54}\cdot\sqrt[3]{4} - \sqrt{(2-\sqrt{5})^2}$.'
            answer_contract: {"kind":"exact"}
            answer: '8-sqrt(5)'
            solution_sketch: 'We have $\sqrt[3]{54 \cdot 4} = \sqrt[3]{216} = 6$. Also $\sqrt{(2-\sqrt{5})^2} = |2-\sqrt{5}| = \sqrt{5}-2$. The difference is $6 - (\sqrt{5}-2) = 8 - \sqrt{5}$.'
            points: 1
          - problem: 'An arithmetic progression has $a_1 = 4$ and $d = 3$. Find $a_{10}$.'
            answer_contract: {"kind":"exact"}
            answer: '31'
            solution_sketch: 'We have $a_{10} = a_1 + 9d = 4 + 27 = 31$.'
            points: 1
          - problem: 'Solve $2^{x+1} = 32$.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'We have $32 = 2^5$. So $x + 1 = 5$ and $x = 4$.'
            points: 1
          - problem: 'Solve $\sqrt{2x+1} = 5$.'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'Square both sides to get $2x + 1 = 25$. So $x = 12$. The check $\sqrt{25} = 5$ is true.'
            points: 1
          - problem: 'Solve $\log_3 x = 4$.'
            answer_contract: {"kind":"exact"}
            answer: '81'
            solution_sketch: 'By the definition of the logarithm, $x = 3^4 = 81$.'
            points: 1
          - problem: 'A geometric progression has $b_1 = 2$ and $q = 3$. Find the sum $S_5$ of the first five terms.'
            answer_contract: {"kind":"exact"}
            answer: '242'
            solution_sketch: 'We have $S_5 = b_1 (q^5 - 1)/(q - 1) = 2 \cdot 242 / 2 = 242$.'
            points: 1
          - problem: 'Find all roots of $x^3 - 4x = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{-2, 0, 2}'
            solution_sketch: 'Factor to get $x(x-2)(x+2) = 0$. The roots are $-2$, $0$ and $2$.'
            points: 1
          - problem: 'Write the formula of the graph of $y = x^2$ after a shift of $3$ units to the right and $2$ units down.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '(x-3)^2-2'
            solution_sketch: 'A shift to the right by $3$ replaces $x$ with $x - 3$. A shift down by $2$ subtracts $2$. The formula is $y = (x-3)^2 - 2$.'
            points: 1
          - problem: 'Solve $\dfrac{x-1}{x+3} \le 0$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-3 < x <= 1'
            solution_sketch: 'The fraction changes sign at $x = 1$ and at $x = -3$. It is negative between these points. At $x = 1$ it is zero, and $x = -3$ is not allowed.'
            points: 1
          - problem: 'Solve $4^x - 3\cdot 2^x - 4 = 0$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'Put $t = 2^x$ with $t > 0$. Then $t^2 - 3t - 4 = 0$, so $t = 4$ or $t = -1$. Only $t = 4$ is possible, so $x = 2$.'
            points: 1
          - problem: 'Solve $|x-2| = 2x-1$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'If $x \ge 2$, then $x - 2 = 2x - 1$ gives $x = -1$, which is not in the case. If $x < 2$, then $2 - x = 2x - 1$ gives $x = 1$, and the check is true.'
            points: 1
          - problem: 'Solve $x^4 - 5x^2 + 4 = 0$.'
            answer_contract: {"kind":"set"}
            answer: '{-2, -1, 1, 2}'
            solution_sketch: 'Put $t = x^2$. Then $t^2 - 5t + 4 = 0$, so $t = 1$ or $t = 4$. So $x = \pm 1$ or $x = \pm 2$.'
            points: 1
          - problem: 'The points $(1, 6)$ and $(3, 54)$ are on the graph of $y = c \cdot a^x$ with $a > 0$. Find $a$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'The two points give $ca = 6$ and $ca^3 = 54$. Divide to get $a^2 = 9$. So $a = 3$.'
            points: 1
          - problem: 'The points are $A(1, -2)$ and $B(4, 2)$. Find the length of the vector $\overrightarrow{AB}$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'We have $\overrightarrow{AB} = (3, 4)$. Its length is $\sqrt{9 + 16} = 5$.'
            points: 1
          - problem: 'The vectors are $\vec a = (2, t)$ and $\vec b = (6, -3)$. Find $t$ for which they are perpendicular.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'Perpendicular vectors have the scalar product $0$. So $12 - 3t = 0$ and $t = 4$.'
            points: 1
          - problem: 'Find the exact value of $\arcsin\dfrac{\sqrt{3}}{2}$.'
            answer_contract: {"kind":"exact"}
            answer: 'pi/3'
            solution_sketch: 'The arcsine is the angle in $[-\pi/2, \pi/2]$ with the sine $\sqrt{3}/2$. This angle is $\pi/3$.'
            points: 1
          - problem: 'Find the scalar product of the vectors $(2, -1)$ and $(3, 5)$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'The scalar product is $2 \cdot 3 + (-1) \cdot 5 = 1$.'
            points: 1
        constraints: 'Each item is worth 1 point and has one typed value. The items vary the topic of grade 11; the form takes the first 24.'
      - id: kp2
        name: 'Two-point items'
        key_prerequisites: [vbe-cp01-number-sets, vbe-cp02-modulus, vbe-cp03-powers, vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp07-progressions, vbe-cp08-function-concept, vbe-cp09-elementary-functions, vbe-cp10-trig-functions, vbe-cp11-equations, vbe-cp12-moduli-systems, vbe-cp13-inequalities, vbe-cp14-plane-vectors]
        exemplars:
          - problem: 'It is given that $\log_3 2 = p$ and $\log_3 5 = q$. Express $\log_3 \dfrac{50}{9}$ through $p$ and $q$.'
            answer_contract: {"kind":"function","vars":["p","q"]}
            answer: 'p+2*q-2'
            solution_sketch: 'We have $50 = 2 \cdot 5^2$ and $9 = 3^2$. So $\log_3 \dfrac{50}{9} = p + 2q - 2$.'
            points: 2
          - problem: 'The vectors are $\vec a = (3, -1)$ and $\vec b = (2, 4)$. (a) Find the coordinates of $\vec a + 2\vec b$. (b) Find the scalar product of $\vec a$ and $\vec b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sum","contract":{"kind":"coordinates","arity":2}},{"name":"dot","contract":{"kind":"exact"}}]}
            answer: 'sum = (7,7); dot = 2'
            solution_sketch: 'We have $2\vec b = (4, 8)$, so $\vec a + 2\vec b = (7, 7)$. The scalar product is $3 \cdot 2 + (-1) \cdot 4 = 2$.'
            points: 2
          - problem: 'Find the period of the function $y = \sin(4x)$.'
            answer_contract: {"kind":"exact"}
            answer: 'pi/2'
            solution_sketch: 'The function $\sin x$ has the period $2\pi$. The factor $4$ divides the period by $4$. The period is $\dfrac{\pi}{2}$.'
            points: 2
          - problem: 'A geometric progression has $b_2 = 6$ and $b_5 = 162$. (a) Find the ratio $q$. (b) Find the first term $b_1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"q","contract":{"kind":"exact"}},{"name":"b1","contract":{"kind":"exact"}}]}
            answer: 'q = 3; b1 = 2'
            solution_sketch: 'We have $b_5 / b_2 = q^3 = 27$, so $q = 3$. Then $b_1 = b_2 / q = 2$.'
            points: 2
          - problem: 'Solve $\log_2(x+3) + \log_2(x-3) = 4$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'The domain is $x > 3$. The sum becomes $\log_2(x^2 - 9) = 4$, so $x^2 - 9 = 16$ and $x = \pm 5$. Only $x = 5$ is in the domain.'
            points: 2
          - problem: 'Solve $x - 2 = \sqrt{3x - 2}$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'Square both sides to get $x^2 - 4x + 4 = 3x - 2$, so $x^2 - 7x + 6 = 0$. The roots are $1$ and $6$. The check keeps $x = 6$, because $x - 2$ is not negative.'
            points: 2
          - problem: 'The function $y = a\sin(bx) + c$ has $a > 0$ and $b > 0$. Its largest value is $5$, its smallest value is $-1$ and its period is $\pi$. (a) Find $b$. (b) Find $a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b","contract":{"kind":"exact"}},{"name":"a","contract":{"kind":"exact"}}]}
            answer: 'b = 2; a = 3'
            solution_sketch: 'The period is $2\pi / b = \pi$, so $b = 2$. The range has the length $5 - (-1) = 6$, which is $2a$. So $a = 3$.'
            points: 2
          - problem: 'Solve $9^x - 4\cdot 3^x + 3 < 0$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '0 < x < 1'
            solution_sketch: 'Put $t = 3^x$. Then $t^2 - 4t + 3 < 0$, so $1 < t < 3$. So $0 < x < 1$.'
            points: 2
          - problem: 'The functions are $f(x) = 2x - 3$ and $g(x) = x^2$. (a) Find $f(g(3))$. (b) Find $g(f(3))$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"fg","contract":{"kind":"exact"}},{"name":"gf","contract":{"kind":"exact"}}]}
            answer: 'fg = 15; gf = 9'
            solution_sketch: 'We have $g(3) = 9$, so $f(g(3)) = 15$. Also $f(3) = 3$, so $g(f(3)) = 9$.'
            points: 2
          - problem: 'The vectors $\vec a$ and $\vec b$ have the lengths $3$ and $4$. The angle between them is $60^\circ$. Find the scalar product of $\vec a$ and $\vec b$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'The scalar product is $3 \cdot 4 \cdot \cos 60^\circ = 12 \cdot \dfrac12 = 6$.'
            points: 2
        constraints: 'Each item is worth 2 points and has one typed value or two typed parts. The items vary the topic of grade 11; the form takes the first 8.'
    diagnostic_exemplar:
      problem: 'Compute $\log_2 8 + 2^3$.'
      answer_contract: {"kind":"exact"}
      answer: '11'
      solution_sketch: 'We have $\log_2 8 = 3$ and $2^3 = 8$. The sum is $11$.'
