    knowledge_points:
      - id: kp1
        name: 'Limits and continuity at a point'
        key_prerequisites: [limits-graphical-numerical, limit-laws, factoring-limits, continuity-at-a-point, limits-at-infinity-rational, limits-algebraic]
        exemplars:
          - problem: 'Find (a) $\lim_{x\to2}(x^2+3x-1)$ and (b) $\lim_{x\to2}\dfrac{x+1}{x-1}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 9; b = 3'
            solution_sketch: 'Both functions are continuous at $x=2$, so substitute $x=2$. The first limit is $4+6-1=9$. The second limit is $\tfrac{3}{1}=3$.'
          - problem: 'Find (a) $\lim_{x\to3}\dfrac{x^2-9}{x-3}$ and (b) $\lim_{x\to-2}\dfrac{x^2+x-2}{x+2}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 6; b = -3'
            solution_sketch: 'Factor: $\tfrac{x^2-9}{x-3}=x+3$ for $x\ne3$, so the limit is $6$. Also $x^2+x-2=(x+2)(x-1)$, so the quotient is $x-1$ and the limit is $-3$.'
          - problem: 'Find (a) $\lim_{x\to\infty}\dfrac{3x^2+x}{x^2-5}$, (b) $\lim_{x\to\infty}\dfrac{4x+1}{x^2+2}$, (c) $\lim_{x\to-\infty}\dfrac{2-5x}{x+1}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 3; b = 0; c = -5'
            solution_sketch: 'Divide the numerator and the denominator by the highest power of $x$. In (a) the ratio of the leading coefficients is $3$. In (b) the degree of the denominator is larger, so the limit is $0$. In (c) the ratio of the leading coefficients is $\tfrac{-5}{1}=-5$.'
          - problem: 'Let $f(x)=2x+k$ for $x<1$ and $f(x)=x^2+3$ for $x\ge1$. (a) Find $f(1)$. (b) Find the value of $k$ for which $f$ is continuous at $x=1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"f1","contract":{"kind":"exact"}},{"name":"k","contract":{"kind":"exact"}}]}
            answer: 'f1 = 4; k = 2'
            solution_sketch: 'For $x=1$ the second formula applies, so $f(1)=4$. The left limit is $2+k$. Continuity needs $2+k=4$, so $k=2$.'
          - problem: 'Find (a) $\lim_{x\to0}\dfrac{\sqrt{x+4}-2}{x}$ and (b) $\lim_{x\to9}\dfrac{x-9}{\sqrt x-3}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 1/4; b = 6'
            solution_sketch: 'For (a), multiply by $\sqrt{x+4}+2$. The numerator becomes $x$, so the quotient is $\tfrac{1}{\sqrt{x+4}+2}$ and the limit is $\tfrac14$. For (b), write $x-9=(\sqrt x-3)(\sqrt x+3)$. The quotient is $\sqrt x+3$ and the limit is $6$.'
          - problem: 'The limit $\lim_{x\to1}\dfrac{x^2-ax+2}{x-1}$ is a finite number. (a) Find $a$. (b) Find the limit.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"L","contract":{"kind":"exact"}}]}
            answer: 'a = 3; L = -1'
            solution_sketch: 'The denominator tends to $0$, so the numerator must tend to $0$. This gives $1-a+2=0$ and $a=3$. Then $x^2-3x+2=(x-1)(x-2)$, so the quotient is $x-2$ and the limit is $-1$.'
        constraints: 'The items vary the function and the point. The limit rules stay fixed.'
      - id: kp2
        name: 'Tangent equation, parameter of a tangent and physical meaning'
        key_prerequisites: [tangent-line-equation, derivative-at-a-point, motion-along-a-line, difference-quotients]
        exemplars:
          - problem: 'Let $f(x)=x^2-3x$. (a) Simplify $\dfrac{f(2+h)-f(2)}{h}$ for $h\ne0$. (b) Find $f''(2)$. (c) Write the equation of the tangent at $x=2$ as $y=\dots$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"q","contract":{"kind":"function","vars":["h"]}},{"name":"d","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'q = 1+h; d = 1; tan = x-4'
            solution_sketch: 'We have $f(2)=-2$ and $f(2+h)=-2+h+h^2$. The quotient is $1+h$. As $h\to0$ it tends to $1$, so $f''(2)=1$. The tangent is $y=1\cdot(x-2)-2=x-4$.'
          - problem: 'Let $f(x)=x^3+x$. (a) Find the slope of the tangent at $x=1$. (b) Write the equation of this tangent as $y=\dots$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"k","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'k = 4; tan = 4*x-2'
            solution_sketch: 'We have $f''(x)=3x^2+1$, so the slope is $f''(1)=4$. Also $f(1)=2$. The tangent is $y=4(x-1)+2=4x-2$.'
          - problem: 'A body moves on a line with the distance $s(t)=t^2+4t$ meters after $t$ seconds. Find (a) the speed at $t=3$, (b) the acceleration, (c) the time at which the speed is $16$ meters per second.'
            answer_contract: {"kind":"multipart","parts":[{"name":"v","contract":{"kind":"exact"}},{"name":"a","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}}]}
            answer: 'v = 10; a = 2; t = 6'
            solution_sketch: 'The speed is $s''(t)=2t+4$, so $s''(3)=10$. The acceleration is the derivative of the speed, $2$. Solve $2t+4=16$ to get $t=6$.'
          - problem: 'The tangent to the graph of $f(x)=x^2+px$ at the point with abscissa $1$ has slope $4$. (a) Find $p$. (b) Write the equation of this tangent as $y=\dots$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'p = 2; tan = 4*x-1'
            solution_sketch: 'We have $f''(x)=2x+p$, so $f''(1)=2+p=4$ and $p=2$. Then $f(1)=3$. The tangent is $y=4(x-1)+3=4x-1$.'
          - problem: 'Let $f(x)=\sqrt x$. Find (a) $f''(4)$, (b) the equation of the tangent at $x=4$ as $y=\dots$, (c) the abscissa of the point where this tangent meets the $Ox$ axis.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"function","vars":["x"]}},{"name":"zero","contract":{"kind":"exact"}}]}
            answer: 'd = 1/4; tan = x/4+1; zero = -4'
            solution_sketch: 'We have $f''(x)=\tfrac1{2\sqrt x}$, so $f''(4)=\tfrac14$. Also $f(4)=2$, so the tangent is $y=\tfrac14(x-4)+2=\tfrac x4+1$. Put $y=0$ to get $x=-4$.'
          - problem: 'Let $f(x)=x^2+1$. Tangents to the graph of $f$ pass through the origin. (a) Find the abscissas of the points of tangency. (b) Find the slope of the tangent at the point with positive abscissa. (c) Write the equation of this tangent as $y=\dots$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"pts","contract":{"kind":"set"}},{"name":"k","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'pts = {-1, 1}; k = 2; tan = 2*x'
            solution_sketch: 'The tangent at $x=a$ is $y=2a(x-a)+a^2+1$. It passes through $(0,0)$, so $-2a^2+a^2+1=0$ and $a=\pm1$. For $a=1$ the slope is $2$ and the line is $y=2x$.'
        constraints: 'The items vary the function and the point. The meaning of the derivative as a slope and as a speed stays fixed.'
    diagnostic_exemplar:
      problem: 'Find (a) $\lim_{x\to4}\dfrac{x^2-16}{x-4}$ and (b) the slope of the tangent to $y=x^2$ at $x=3$.'
      answer_contract: {"kind":"multipart","parts":[{"name":"L","contract":{"kind":"exact"}},{"name":"k","contract":{"kind":"exact"}}]}
      answer: 'L = 8; k = 6'
      solution_sketch: 'Factor: the quotient is $x+4$, so the limit is $8$. The slope is $2\cdot3=6$.'
