    knowledge_points:
      - id: kp1
        name: 'Derivative of a product, quotient and composite function'
        key_prerequisites: [product-rule, quotient-rule, chain-rule]
        exemplars:
          - problem: 'Let $f(x)=x^2(3x-1)$. (a) Find $f''(x)$. (b) Find $f''(1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}}]}
            answer: 'd = 9*x^2-2*x; v = 7'
            solution_sketch: 'By the product rule, $f''(x)=2x(3x-1)+3x^2=9x^2-2x$. Then $f''(1)=9-2=7$.'
          - problem: 'Let $f(x)=\dfrac{x^2+1}{x-1}$. (a) Find $f''(x)$. (b) Find $f''(3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}}]}
            answer: 'd = (x^2-2*x-1)/(x-1)^2; v = 1/2'
            solution_sketch: 'By the quotient rule, $f''(x)=\tfrac{2x(x-1)-(x^2+1)}{(x-1)^2}=\tfrac{x^2-2x-1}{(x-1)^2}$. Then $f''(3)=\tfrac{9-6-1}{4}=\tfrac12$.'
          - problem: 'Find (a) the derivative of $f(x)=(2x+1)^5$, (b) $f''(0)$, (c) $g''(4)$ for $g(x)=\sqrt{x^2+9}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}},{"name":"g","contract":{"kind":"exact"}}]}
            answer: 'd = 10*(2*x+1)^4; v = 10; g = 4/5'
            solution_sketch: 'By the chain rule, $f''(x)=5(2x+1)^4\cdot2=10(2x+1)^4$, so $f''(0)=10$. Also $g''(x)=\tfrac{2x}{2\sqrt{x^2+9}}=\tfrac{x}{\sqrt{x^2+9}}$. Then $g''(4)=\tfrac45$.'
          - problem: 'Let $f(x)=x^2\ln x$ for $x>0$. (a) Find $f''(x)$. (b) Find $f''(1)$. (c) Find the number $x_0>0$ with $f''(x_0)=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}},{"name":"x0","contract":{"kind":"exact"}}]}
            answer: 'd = 2*x*ln(x)+x; v = 1; x0 = exp(-1/2)'
            solution_sketch: 'By the product rule, $f''(x)=2x\ln x+x^2\cdot\tfrac1x=2x\ln x+x$. Then $f''(1)=0+1=1$. Solve $x(2\ln x+1)=0$ with $x>0$: $\ln x=-\tfrac12$, so $x_0=e^{-1/2}$.'
          - problem: 'Let $f(x)=\sin^2x\cos x$. Find (a) $f''\!\left(\tfrac\pi2\right)$, (b) $f''\!\left(\tfrac\pi4\right)$, (c) $f''\!\left(\tfrac\pi6\right)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -1; b = sqrt(2)/4; c = 5/8'
            solution_sketch: 'By the product rule and the chain rule, $f''(x)=2\sin x\cos^2x-\sin^3x$. At $\tfrac\pi2$ this is $0-1=-1$. At $\tfrac\pi4$ it is $2\cdot\tfrac{\sqrt2}{2}\cdot\tfrac12-\tfrac{\sqrt2}{4}=\tfrac{\sqrt2}{4}$. At $\tfrac\pi6$ it is $2\cdot\tfrac12\cdot\tfrac34-\tfrac18=\tfrac58$.'
          - problem: 'Find (a) $f''(1)$ for $f(x)=\dfrac{\ln(x^2+1)}{x}$. Let $g(x)=x^2e^{-x}$. Find (b) all $x$ with $g''(x)=0$ and (c) the value of $e\cdot g''(1)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"zeros","contract":{"kind":"set"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1-ln(2); zeros = {0, 2}; c = 1'
            solution_sketch: 'By the quotient rule and the chain rule, $f''(x)=\tfrac{\frac{2x}{x^2+1}\cdot x-\ln(x^2+1)}{x^2}$, so $f''(1)=1-\ln2$. For $g$, $g''(x)=(2x-x^2)e^{-x}$, which is zero at $x=0$ and $x=2$. Also $g''(1)=e^{-1}$, so $e\cdot g''(1)=1$.'
        constraints: 'The items vary the function and the rule. The rules of differentiation stay fixed.'
      - id: kp2
        name: 'Derivative value in a multi-step item'
        key_prerequisites: [derivatives-of-polynomials, combining-differentiation-rules]
        exemplars:
          - problem: 'Let $f(x)=x^3-6x^2+9x+1$. Find (a) $f''(x)$, (b) $f''(2)$, (c) all $x$ with $f''(x)=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}},{"name":"zeros","contract":{"kind":"set"}}]}
            answer: 'd = 3*x^2-12*x+9; v = -3; zeros = {1, 3}'
            solution_sketch: 'We have $f''(x)=3x^2-12x+9$. Then $f''(2)=12-24+9=-3$. Also $3(x-1)(x-3)=0$ gives $x=1$ or $x=3$.'
          - problem: 'A cylinder has radius $r$ and height $9-2r$ with $0<r<4.5$. Its volume is $V(r)=\pi r^2(9-2r)$. Find (a) $V''(r)$, (b) $V''(2)$, (c) the value $r>0$ with $V''(r)=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["r"]}},{"name":"v","contract":{"kind":"exact"}},{"name":"r0","contract":{"kind":"exact"}}]}
            answer: 'd = 18*pi*r-6*pi*r^2; v = 12*pi; r0 = 3'
            solution_sketch: 'We have $V(r)=9\pi r^2-2\pi r^3$, so $V''(r)=18\pi r-6\pi r^2$. Then $V''(2)=36\pi-24\pi=12\pi$. Solve $6\pi r(3-r)=0$ to get $r=3$.'
          - problem: 'A pyramid has a square base with side $x$ and height $12-x$ with $0<x<12$. Its volume is $V(x)=\tfrac13x^2(12-x)$. Find (a) $V''(x)$, (b) $V''(3)$, (c) the value $x>0$ with $V''(x)=0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"d","contract":{"kind":"function","vars":["x"]}},{"name":"v","contract":{"kind":"exact"}},{"name":"x0","contract":{"kind":"exact"}}]}
            answer: 'd = 8*x-x^2; v = 15; x0 = 8'
            solution_sketch: 'We have $V(x)=4x^2-\tfrac13x^3$, so $V''(x)=8x-x^2$. Then $V''(3)=24-9=15$. Solve $x(8-x)=0$ with $x>0$ to get $x=8$.'
          - problem: 'Let $f(x)=(2x+1)^3$. Find (a) $f''(1)$ and (b) all $x$ with $f''(x)=6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"v","contract":{"kind":"exact"}},{"name":"xs","contract":{"kind":"set"}}]}
            answer: 'v = 54; xs = {-1, 0}'
            solution_sketch: 'We have $f''(x)=6(2x+1)^2$, so $f''(1)=54$. Solve $6(2x+1)^2=6$: $(2x+1)^2=1$, so $2x+1=\pm1$ and $x=0$ or $x=-1$.'
          - problem: 'Let $f(x)=\dfrac{x}{x^2+1}$. Find (a) $f''(2)$, (b) all $x$ with $f''(x)=0$, (c) $f''(0)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"zeros","contract":{"kind":"set"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = -3/25; zeros = {-1, 1}; c = 1'
            solution_sketch: 'By the quotient rule, $f''(x)=\tfrac{(x^2+1)-2x^2}{(x^2+1)^2}=\tfrac{1-x^2}{(x^2+1)^2}$. Then $f''(2)=\tfrac{-3}{25}$ and $f''(0)=1$. The numerator is zero at $x=\pm1$.'
          - problem: 'Let $f(x)=ax^3+bx$ with $f(1)=-2$ and $f''(1)=0$. Find (a) $a$, (b) $b$, (c) $f''(2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'a = 1; b = -3; d = 9'
            solution_sketch: 'We have $f''(x)=3ax^2+b$. The conditions give $3a+b=0$ and $a+b=-2$. Subtract to get $2a=2$, so $a=1$ and $b=-3$. Then $f''(2)=12-3=9$.'
        constraints: 'The items vary the model function and the unknown. The derivative value is the base of every part.'
    diagnostic_exemplar:
      problem: 'Find (a) $f''(0)$ for $f(x)=(x+1)^4$ and (b) $g''(1)$ for $g(x)=x^2(x+1)$.'
      answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"q","contract":{"kind":"exact"}}]}
      answer: 'p = 4; q = 5'
      solution_sketch: 'By the chain rule, $f''(x)=4(x+1)^3$ and $f''(0)=4$. By the product rule, $g''(x)=2x(x+1)+x^2$ and $g''(1)=5$.'
  - id: vbe-cp19-function-study
    name: Function study and optimization
    lt_term: 'Funkcijos tyrimas ir optimizavimas'
    area: models
    program_items: [148, 149, 150, 151]
    core: false
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 420
    prerequisites:
      - id: critical-points-extrema
        weight: 0.6
        key: true
      - id: closed-interval-method
        weight: 0.4
        key: false
      - id: curve-analysis-derivatives
        weight: 0.4
        key: false
      - id: optimization
        weight: 0.4
        key: false
      - id: basic-optimization
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Critical points, intervals and sign of the derivative from a graph'
        key_prerequisites: [critical-points-extrema, curve-analysis-derivatives]
        exemplars:
          - problem: 'Let $f(x)=x^3-3x$. Find (a) the critical points of $f$, (b) the local maximum value of $f$, (c) the set where $f''(x)>0$, written as an inequality in $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"crit","contract":{"kind":"set"}},{"name":"max","contract":{"kind":"exact"}},{"name":"inc","contract":{"kind":"inequality_union"}}]}
            answer: 'crit = {-1, 1}; max = 2; inc = x < -1 or x > 1'
            solution_sketch: 'We have $f''(x)=3x^2-3=3(x-1)(x+1)$, so the critical points are $-1$ and $1$. The derivative is positive for $x<-1$ and $x>1$, so $f$ increases there. The local maximum is at $x=-1$, with value $f(-1)=2$.'
          - problem: 'Let $f''(x)=(x-1)(x+3)$. Find (a) the critical points of $f$, (b) the set where $f''(x)<0$, written as an inequality in $x$, (c) the $x$ of the local minimum.'
            answer_contract: {"kind":"multipart","parts":[{"name":"crit","contract":{"kind":"set"}},{"name":"dec","contract":{"kind":"inequality_union"}},{"name":"min","contract":{"kind":"exact"}}]}
            answer: 'crit = {-3, 1}; dec = -3 < x < 1; min = 1'
            solution_sketch: 'The derivative is zero at $x=1$ and $x=-3$. It is negative between them, so $f$ decreases for $-3<x<1$. The derivative changes from negative to positive at $x=1$, so the local minimum is at $x=1$.'
          - problem: 'Let $f''(x)=x(x-2)^2$. Find (a) the critical points of $f$, (b) the number of local extrema of $f$, (c) the set where $f''(x)>0$, written as an inequality in $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"crit","contract":{"kind":"set"}},{"name":"n","contract":{"kind":"exact"}},{"name":"inc","contract":{"kind":"inequality_union"}}]}
            answer: 'crit = {0, 2}; n = 1; inc = 0 < x < 2 or x > 2'
            solution_sketch: 'The derivative is zero at $x=0$ and $x=2$. It is negative for $x<0$ and positive on both sides of $2$. So the sign changes only at $x=0$, which gives one extremum. The derivative is positive for $0<x<2$ and for $x>2$.'
          - problem: 'Let $f(x)=x^4-8x^2$. Find (a) the critical points of $f$, (b) the set where $f''(x)<0$, written as an inequality in $x$, (c) the least value of $f$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"crit","contract":{"kind":"set"}},{"name":"dec","contract":{"kind":"inequality_union"}},{"name":"min","contract":{"kind":"exact"}}]}
            answer: 'crit = {-2, 0, 2}; dec = x < -2 or 0 < x < 2; min = -16'
            solution_sketch: 'We have $f''(x)=4x^3-16x=4x(x-2)(x+2)$. The derivative is negative for $x<-2$ and for $0<x<2$. The least value is at $x=\pm2$, with $f(\pm2)=16-32=-16$.'
          - problem: 'Let $f(x)=x^2-8\ln x$. Find (a) the domain of $f$, written as an inequality in $x$, (b) the critical point of $f$, (c) the set where $f''(x)<0$, written as an inequality in $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"dom","contract":{"kind":"inequality_union"}},{"name":"crit","contract":{"kind":"exact"}},{"name":"dec","contract":{"kind":"inequality_union"}}]}
            answer: 'dom = x > 0; crit = 2; dec = 0 < x < 2'
            solution_sketch: 'The logarithm needs $x>0$. We have $f''(x)=2x-\tfrac8x=\tfrac{2(x^2-4)}{x}$, which is zero at $x=2$ in the domain. The derivative is negative for $0<x<2$.'
          - problem: 'Let $f(x)=x^3+3x^2+ax$. The derivative $f''$ is a quadratic. Find (a) the discriminant of $f''$ in terms of $a$, (b) the value of $a$ for which $f$ has exactly one critical point, (c) this critical point.'
            answer_contract: {"kind":"multipart","parts":[{"name":"disc","contract":{"kind":"function","vars":["a"]}},{"name":"a","contract":{"kind":"exact"}},{"name":"crit","contract":{"kind":"exact"}}]}
            answer: 'disc = 36-12*a; a = 3; crit = -1'
            solution_sketch: 'We have $f''(x)=3x^2+6x+a$ with discriminant $36-12a$. One critical point needs discriminant $0$, so $a=3$. Then $3(x+1)^2=0$ gives $x=-1$.'
        constraints: 'The items vary the function and the data of the derivative. The sign test of the derivative stays fixed.'
      - id: kp2
        name: 'Greatest and least value on an interval'
        key_prerequisites: [closed-interval-method]
        exemplars:
          - problem: 'Find (a) the greatest value and (b) the least value of $f(x)=x^2-4x+1$ on $[0,3]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"max","contract":{"kind":"exact"}},{"name":"min","contract":{"kind":"exact"}}]}
            answer: 'max = 1; min = -3'
            solution_sketch: 'The vertex is at $x=2$, with $f(2)=-3$. The endpoint values are $f(0)=1$ and $f(3)=-2$. The greatest is $1$ and the least is $-3$.'
          - problem: 'Find (a) the greatest value and (b) the least value of $f(x)=x^3-3x$ on $[0,2]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"max","contract":{"kind":"exact"}},{"name":"min","contract":{"kind":"exact"}}]}
            answer: 'max = 2; min = -2'
            solution_sketch: 'We have $f''(x)=3x^2-3$, which is zero at $x=1$ in the interval. The values are $f(0)=0$, $f(1)=-2$ and $f(2)=2$. The greatest is $2$ and the least is $-2$.'
          - problem: 'Let $f(x)=x^3-3x^2-9x+5$ on $[-2,4]$. Find (a) the critical points in $[-2,4]$, (b) the greatest value, (c) the least value.'
            answer_contract: {"kind":"multipart","parts":[{"name":"crit","contract":{"kind":"set"}},{"name":"max","contract":{"kind":"exact"}},{"name":"min","contract":{"kind":"exact"}}]}
            answer: 'crit = {-1, 3}; max = 10; min = -22'
            solution_sketch: 'We have $f''(x)=3(x-3)(x+1)$. The values are $f(-2)=3$, $f(-1)=10$, $f(3)=-22$ and $f(4)=-15$. The greatest is $10$ and the least is $-22$.'
          - problem: 'Let $f(x)=x+\dfrac4x$ on $[1,4]$. Find (a) the point where $f''(x)=0$, (b) the least value, (c) the greatest value.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x0","contract":{"kind":"exact"}},{"name":"min","contract":{"kind":"exact"}},{"name":"max","contract":{"kind":"exact"}}]}
            answer: 'x0 = 2; min = 4; max = 5'
            solution_sketch: 'We have $f''(x)=1-\tfrac4{x^2}$, which is zero at $x=2$. The values are $f(1)=5$, $f(2)=4$ and $f(4)=5$. The least is $4$ and the greatest is $5$.'
          - problem: 'Let $f(x)=x^4-2x^2$ on $[-2,2]$. Find (a) the number of critical points in $[-2,2]$, (b) the greatest value, (c) the least value.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"max","contract":{"kind":"exact"}},{"name":"min","contract":{"kind":"exact"}}]}
            answer: 'n = 3; max = 8; min = -1'
            solution_sketch: 'We have $f''(x)=4x(x-1)(x+1)$, so the critical points are $-1$, $0$ and $1$. The values are $f(\pm2)=8$, $f(\pm1)=-1$ and $f(0)=0$. The greatest is $8$ and the least is $-1$.'
          - problem: 'Let $f(x)=2x^3-9x^2+12x$ on $[0,3]$. Find (a) the critical points, (b) the greatest value, (c) the least value.'
            answer_contract: {"kind":"multipart","parts":[{"name":"crit","contract":{"kind":"set"}},{"name":"max","contract":{"kind":"exact"}},{"name":"min","contract":{"kind":"exact"}}]}
            answer: 'crit = {1, 2}; max = 9; min = 0'
            solution_sketch: 'We have $f''(x)=6(x-1)(x-2)$. The values are $f(0)=0$, $f(1)=5$, $f(2)=4$ and $f(3)=9$. The greatest is $9$ and the least is $0$.'
        constraints: 'The items vary the function and the interval. The method of critical points and endpoints stays fixed.'
      - id: kp3
        name: 'Optimization with a set-up of the function (volume, area)'
        key_prerequisites: [optimization, basic-optimization]
        exemplars:
          - problem: 'A rectangle has perimeter $40$ cm. One side has length $x$ cm. Find (a) the area $A(x)$ as a function of $x$, (b) the value of $x$ with the greatest area, (c) the greatest area in $\mathrm{cm}^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"A","contract":{"kind":"function","vars":["x"]}},{"name":"x0","contract":{"kind":"exact"}},{"name":"max","contract":{"kind":"exact"}}]}
            answer: 'A = 20*x-x^2; x0 = 10; max = 100'
            solution_sketch: 'The other side is $20-x$, so $A(x)=20x-x^2$. We have $A''(x)=20-2x=0$ at $x=10$. Then $A(10)=100$.'
          - problem: 'An open box is made from a square sheet with side $12$ cm. A square with side $x$ cm is cut from each corner and the sides are folded up. Find (a) the volume $V(x)$ as a function of $x$, (b) the value of $x$ with the greatest volume, (c) the greatest volume in $\mathrm{cm}^3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"V","contract":{"kind":"function","vars":["x"]}},{"name":"x0","contract":{"kind":"exact"}},{"name":"max","contract":{"kind":"exact"}}]}
            answer: 'V = x*(12-2*x)^2; x0 = 2; max = 128'
            solution_sketch: 'The base has side $12-2x$ and the height is $x$, so $V(x)=x(12-2x)^2=4x^3-48x^2+144x$. Then $V''(x)=12(x-2)(x-6)$. In $0<x<6$ the zero is $x=2$, and $V(2)=2\cdot64=128$.'
          - problem: 'A cylinder has radius $r$ and height $h$ with $r+h=12$. Find (a) $h$ in terms of $r$, (b) the value of $r$ with the greatest volume, (c) the greatest volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"h","contract":{"kind":"function","vars":["r"]}},{"name":"r0","contract":{"kind":"exact"}},{"name":"max","contract":{"kind":"exact"}}]}
            answer: 'h = 12-r; r0 = 8; max = 256*pi'
            solution_sketch: 'We have $h=12-r$ and $V(r)=\pi r^2(12-r)$. Then $V''(r)=24\pi r-3\pi r^2=3\pi r(8-r)$, which is zero at $r=8$. The volume is $\pi\cdot64\cdot4=256\pi$.'
          - problem: 'A farmer has $60$ m of fence. The fence covers three sides of a rectangular field, and a wall is the fourth side. The two sides at right angles to the wall have length $x$ m. Find (a) the area $A(x)$ as a function of $x$, (b) the value of $x$ with the greatest area, (c) the greatest area in $\mathrm{m}^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"A","contract":{"kind":"function","vars":["x"]}},{"name":"x0","contract":{"kind":"exact"}},{"name":"max","contract":{"kind":"exact"}}]}
            answer: 'A = x*(60-2*x); x0 = 15; max = 450'
            solution_sketch: 'The side along the wall is $60-2x$, so $A(x)=x(60-2x)$. We have $A''(x)=60-4x=0$ at $x=15$. Then $A(15)=15\cdot30=450$.'
          - problem: 'An open box has a square base with side $x$ m and volume $32\ \mathrm{m}^3$. Find (a) the height in terms of $x$, (b) the value of $x$ with the least surface area, (c) the least surface area in $\mathrm{m}^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"h","contract":{"kind":"function","vars":["x"]}},{"name":"x0","contract":{"kind":"exact"}},{"name":"min","contract":{"kind":"exact"}}]}
            answer: 'h = 32/x^2; x0 = 4; min = 48'
            solution_sketch: 'The height is $\tfrac{32}{x^2}$. The surface area is $S(x)=x^2+4x\cdot\tfrac{32}{x^2}=x^2+\tfrac{128}{x}$. Then $S''(x)=2x-\tfrac{128}{x^2}=0$ gives $x^3=64$, so $x=4$. Then $S(4)=16+32=48$.'
          - problem: 'A rectangle has two vertices on the $Ox$ axis at $(-x,0)$ and $(x,0)$ with $x>0$. The other two vertices lie on the parabola $y=12-x^2$ and $y\ge0$. Find (a) the area $A(x)$ as a function of $x$, (b) the value of $x$ with the greatest area, (c) the greatest area.'
            answer_contract: {"kind":"multipart","parts":[{"name":"A","contract":{"kind":"function","vars":["x"]}},{"name":"x0","contract":{"kind":"exact"}},{"name":"max","contract":{"kind":"exact"}}]}
            answer: 'A = 24*x-2*x^3; x0 = 2; max = 32'
            solution_sketch: 'The width is $2x$ and the height is $12-x^2$, so $A(x)=24x-2x^3$. Then $A''(x)=24-6x^2=0$ gives $x=2$. The area is $A(2)=48-16=32$.'
        constraints: 'The items vary the solid or the figure. The steps of set-up, derivative and check of the domain stay fixed.'
    diagnostic_exemplar:
      problem: 'Let $f(x)=x^2-6x+5$. Find (a) the critical point of $f$ and (b) the least value of $f$ on $[0,5]$.'
      answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"m","contract":{"kind":"exact"}}]}
      answer: 'x = 3; m = -4'
      solution_sketch: 'We have $f''(x)=2x-6=0$ at $x=3$. Then $f(3)=-4$, and the endpoint values are $5$ and $0$.'
  - id: vbe-cp20-integral
