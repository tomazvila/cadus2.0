    knowledge_points:
      - id: kp1
        name: 'Antiderivative through a point and properties'
        key_prerequisites: [antiderivatives, reverse-power-rule]
        exemplars:
          - problem: 'Let $F$ be an antiderivative of $f(x)=6x^2-2x$ with $F(1)=3$. Find (a) the constant term $C$ in $F(x)=2x^3-x^2+C$ and (b) $F(2)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"C","contract":{"kind":"exact"}},{"name":"F2","contract":{"kind":"exact"}}]}
            answer: 'C = 2; F2 = 14'
            solution_sketch: 'From $F(1)=2-1+C=3$ we get $C=2$. Then $F(2)=16-4+2=14$.'
          - problem: 'Let $F$ be the antiderivative of $f(x)=(3x-2)^2$ with $F(1)=0$. Find (a) $F(2)$ and (b) $F(0)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"F2","contract":{"kind":"exact"}},{"name":"F0","contract":{"kind":"exact"}}]}
            answer: 'F2 = 7; F0 = -1'
            solution_sketch: 'An antiderivative of $(3x-2)^2$ is $\tfrac{(3x-2)^3}{9}$. So $F(x)=\tfrac{(3x-2)^3}{9}+C$ and $F(1)=\tfrac19+C=0$, which gives $C=-\tfrac19$. Then $F(2)=\tfrac{64}9-\tfrac19=7$ and $F(0)=-\tfrac89-\tfrac19=-1$.'
          - problem: 'The graph of an antiderivative $F$ of $f(x)=2\cos x$ passes through the point $\left(\tfrac\pi2,5\right)$. Find (a) the constant $C$ in $F(x)=2\sin x+C$ and (b) $F\!\left(\tfrac\pi6\right)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"C","contract":{"kind":"exact"}},{"name":"F","contract":{"kind":"exact"}}]}
            answer: 'C = 3; F = 4'
            solution_sketch: 'From $F(\tfrac\pi2)=2+C=5$ we get $C=3$. Then $F(\tfrac\pi6)=2\cdot\tfrac12+3=4$.'
          - problem: 'The graph of an antiderivative $F$ of $f(x)=3\sqrt x$ passes through $(1,2)$. Find (a) the constant $C$ in $F(x)=2x\sqrt x+C$, (b) $F(4)$, (c) $F(9)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"C","contract":{"kind":"exact"}},{"name":"F4","contract":{"kind":"exact"}},{"name":"F9","contract":{"kind":"exact"}}]}
            answer: 'C = 0; F4 = 16; F9 = 54'
            solution_sketch: 'The formula $\int x^{1/2}dx=\tfrac23x^{3/2}$ gives $F(x)=2x^{3/2}+C$. From $F(1)=2+C=2$ we get $C=0$. Then $F(4)=2\cdot8=16$ and $F(9)=2\cdot27=54$.'
          - problem: 'Let $F$ be the antiderivative of $f(x)=\dfrac1{\cos^2x}$ with $F\!\left(\tfrac\pi4\right)=3$. Find (a) the constant $C$ in $F(x)=\tan x+C$ and (b) $F\!\left(\tfrac\pi3\right)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"C","contract":{"kind":"exact"}},{"name":"F","contract":{"kind":"exact"}}]}
            answer: 'C = 2; F = 2+sqrt(3)'
            solution_sketch: 'From $F(\tfrac\pi4)=1+C=3$ we get $C=2$. Then $F(\tfrac\pi3)=\sqrt3+2$.'
          - problem: 'Let $F$ be an antiderivative of $f(x)=ax+2$ with $F(0)=1$ and $F(2)=9$. Find (a) the constant term $C$ of $F$, (b) $a$, (c) $F(3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"C","contract":{"kind":"exact"}},{"name":"a","contract":{"kind":"exact"}},{"name":"F3","contract":{"kind":"exact"}}]}
            answer: 'C = 1; a = 2; F3 = 16'
            solution_sketch: 'We have $F(x)=\tfrac a2x^2+2x+C$. From $F(0)=C=1$. Then $F(2)=2a+4+1=9$, so $a=2$. Then $F(3)=9+6+1=16$.'
        constraints: 'The items vary the function and the given point. The rules of antiderivatives stay fixed.'
      - id: kp2
        name: 'Area under a graph and between graphs'
        key_prerequisites: [definite-integrals-ftc, area-between-curves]
        exemplars:
          - problem: 'Compute (a) $\int_0^2(3x^2+1)\,dx$, (b) $\int_2^0(3x^2+1)\,dx$, (c) $\int_0^3(3x^2+1)\,dx$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 10; b = -10; c = 30'
            solution_sketch: 'An antiderivative is $x^3+x$. At $2$ it is $10$ and at $0$ it is $0$, so (a) is $10$. Swapped limits change the sign, so (b) is $-10$. At $3$ the antiderivative is $30$, so (c) is $30$.'
          - problem: 'Find the area of the region between the $Ox$ axis and the graph of $y=4-x^2$ on $[-2,2]$, and the area of the region between the $Ox$ axis and the same graph on $[0,1]$. Give (a) the first area and (b) the second area.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 32/3; b = 11/3'
            solution_sketch: 'An antiderivative is $4x-\tfrac{x^3}3$. On $[-2,2]$ it gives $\tfrac{16}3-(-\tfrac{16}3)=\tfrac{32}3$. On $[0,1]$ it gives $4-\tfrac13=\tfrac{11}3$.'
          - problem: 'The graphs of $y=x^2$ and $y=2x$ bound a region. Find (a) the abscissas of the common points and (b) the area of the region.'
            answer_contract: {"kind":"multipart","parts":[{"name":"pts","contract":{"kind":"set"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'pts = {0, 2}; area = 4/3'
            solution_sketch: 'Solve $x^2=2x$ to get $x=0$ and $x=2$. On $[0,2]$ the line is above the parabola. The area is $\int_0^2(2x-x^2)dx=4-\tfrac83=\tfrac43$.'
          - problem: 'The graphs of $y=x^2+1$ and $y=3-x$ bound a region. Find (a) the abscissas of the common points and (b) the area of the region.'
            answer_contract: {"kind":"multipart","parts":[{"name":"pts","contract":{"kind":"set"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'pts = {-2, 1}; area = 9/2'
            solution_sketch: 'Solve $x^2+1=3-x$ to get $x^2+x-2=0$, so $x=-2$ or $x=1$. The line is above the parabola between them. The area is $\int_{-2}^{1}(2-x-x^2)dx=\tfrac76+\tfrac{10}3=\tfrac92$.'
          - problem: 'Compute (a) $\int_1^4\dfrac{dx}{x}$, (b) $\int_0^{\pi}\sin x\,dx$, (c) $\int_0^{\pi/6}\cos x\,dx$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = ln(4); b = 2; c = 1/2'
            solution_sketch: 'An antiderivative of $\tfrac1x$ is $\ln x$, so (a) is $\ln4-\ln1=\ln4$. An antiderivative of $\sin x$ is $-\cos x$, so (b) is $1+1=2$. An antiderivative of $\cos x$ is $\sin x$, so (c) is $\sin\tfrac\pi6=\tfrac12$.'
          - problem: 'A region is bounded by the parabola $y=x^2$, the line $y=2-x$ and the $Ox$ axis in the first quadrant. Find (a) the abscissa of the common point of the parabola and the line, (b) the area under the parabola on $[0,1]$, (c) the area of the region.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x0","contract":{"kind":"exact"}},{"name":"a1","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'x0 = 1; a1 = 1/3; area = 5/6'
            solution_sketch: 'Solve $x^2=2-x$ for $x>0$ to get $x=1$. The area under the parabola on $[0,1]$ is $\tfrac13$. The line $y=2-x$ with the $Ox$ axis on $[1,2]$ is a triangle with area $\tfrac12$. The total is $\tfrac13+\tfrac12=\tfrac56$.'
        constraints: 'The items vary the curves and the limits. The Newton-Leibniz formula stays fixed.'
      - id: kp3
        name: 'Volume of a solid of revolution and a distance from a speed'
        key_prerequisites: [volumes-disks, net-change-total-distance]
        exemplars:
          - problem: 'The region under $y=x$ on $[0,3]$ turns about the $Ox$ axis. The region under $y=\sqrt x$ on $[0,4]$ turns about the $Ox$ axis. Find (a) the first volume and (b) the second volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 9*pi; b = 8*pi'
            solution_sketch: 'Use $V=\pi\int f^2dx$. The first volume is $\pi\int_0^3x^2dx=9\pi$. The second volume is $\pi\int_0^4x\,dx=8\pi$.'
          - problem: 'The region under $y=x^2$ on $[0,1]$ turns about the $Ox$ axis. The region under $y=x+1$ on $[0,2]$ turns about the $Ox$ axis. Find (a) the first volume and (b) the second volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = pi/5; b = 26*pi/3'
            solution_sketch: 'The first volume is $\pi\int_0^1x^4dx=\tfrac\pi5$. The second volume is $\pi\int_0^2(x+1)^2dx=\pi\cdot\tfrac{27-1}3=\tfrac{26\pi}3$.'
          - problem: 'The region under $y=\dfrac1x$ on $[1,3]$ turns about the $Ox$ axis. The region under $y=\dfrac1{\sqrt x}$ on $[1,3]$ turns about the $Ox$ axis. Find (a) the first volume and (b) the second volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'a = 2*pi/3; b = pi*ln(3)'
            solution_sketch: 'The first volume is $\pi\int_1^3x^{-2}dx=\pi(1-\tfrac13)=\tfrac{2\pi}3$. The second volume is $\pi\int_1^3\tfrac1x\,dx=\pi\ln3$.'
          - problem: 'A body moves on a line with the speed $v(t)=6t+2$ meters per second. Find (a) the distance in the first $4$ seconds, (b) the time $t$ at which the speed is $14$ meters per second, (c) the distance from $t=2$ to $t=4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"s","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}},{"name":"s2","contract":{"kind":"exact"}}]}
            answer: 's = 56; t = 2; s2 = 40'
            solution_sketch: 'The distance is $\int_0^4(6t+2)dt=3t^2+2t$ from $0$ to $4$, which is $56$. Solve $6t+2=14$ to get $t=2$. At $t=2$ the antiderivative is $16$, so the distance from $2$ to $4$ is $56-16=40$.'
          - problem: 'A body moves on a line with the speed $v(t)=12-2t$ meters per second for $0\le t\le6$. Find (a) the distance in the first $6$ seconds, (b) the time at which the body stops, (c) the distance from $t=4$ to $t=6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"s","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}},{"name":"s2","contract":{"kind":"exact"}}]}
            answer: 's = 36; t = 6; s2 = 4'
            solution_sketch: 'An antiderivative of $v$ is $12t-t^2$. At $6$ it is $36$ and at $0$ it is $0$, so the distance is $36$. The speed is zero at $t=6$. At $4$ the antiderivative is $32$, so the distance from $4$ to $6$ is $36-32=4$.'
          - problem: 'The region under $y=\sqrt{x^2+1}$ on $[0,3]$ turns about the $Ox$ axis. Find (a) the volume. Next, the region under $y=\sqrt x$ on $[0,b]$ with $b>0$ turns about the $Ox$ axis and the volume is $18\pi$. Find (b) $b$. The region under $y=2\sqrt x$ on $[0,3]$ turns about the $Ox$ axis. Find (c) the volume.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 12*pi; b = 6; c = 18*pi'
            solution_sketch: 'For (a), $V=\pi\int_0^3(x^2+1)dx=\pi(9+3)=12\pi$. For (b), $V=\pi\int_0^bx\,dx=\tfrac{\pi b^2}2=18\pi$, so $b=6$. For (c), $V=\pi\int_0^34x\,dx=18\pi$.'
