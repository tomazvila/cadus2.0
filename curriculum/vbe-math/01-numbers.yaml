      - id: log-power-rule
        weight: 0.4
        key: false
      - id: change-of-base-formula
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Express one logarithm through given logarithms'
        key_prerequisites: [log-product-quotient-rules, change-of-base-formula]
        exemplars:
          - problem: 'Let $a=\log_2 3$. (a) Express $\log_2 12$ through $a$. (b) Express $\log_2\dfrac92$ through $a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"function","vars":["a"]}},{"name":"p2","contract":{"kind":"function","vars":["a"]}}]}
            answer: 'p1 = a+2; p2 = 2*a-1'
            solution_sketch: 'We have $\log_2 12=\log_2 3+\log_2 4=a+2$. Also $\log_2(9/2)=2\log_2 3-\log_2 2=2a-1$.'
          - problem: 'Let $a=\lg 2$ and $b=\lg 3$. (a) Express $\lg 6$ through $a$ and $b$. (b) Express $\lg 5$ through $a$. (c) Express $\lg 0.18$ through $a$ and $b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"function","vars":["a","b"]}},{"name":"p2","contract":{"kind":"function","vars":["a"]}},{"name":"p3","contract":{"kind":"function","vars":["a","b"]}}]}
            answer: 'p1 = a+b; p2 = 1-a; p3 = a+2*b-2'
            solution_sketch: 'We have $\lg6=\lg2+\lg3$. Also $\lg5=\lg10-\lg2=1-a$. Last, $0.18=18/100$ and $\lg18=\lg2+2\lg3$. So $\lg0.18=a+2b-2$.'
          - problem: 'Let $a=\log_3 2$. (a) Express $\log_3 18$ through $a$. (b) Express $\log_9 8$ through $a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"function","vars":["a"]}},{"name":"p2","contract":{"kind":"function","vars":["a"]}}]}
            answer: 'p1 = a+2; p2 = 3*a/2'
            solution_sketch: 'We have $\log_3 18=\log_3 9+\log_3 2=2+a$. Also $\log_9 8=\frac12\log_3 8=\frac32 a$.'
          - problem: 'Let $a=\lg 2$. (a) Express $\log_5 2$ through $a$. (b) Express $\log_2 50$ through $a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"function","vars":["a"]}},{"name":"p2","contract":{"kind":"function","vars":["a"]}}]}
            answer: 'p1 = a/(1-a); p2 = (2-a)/a'
            solution_sketch: 'Use the change of base to base $10$. In (a), $\log_5 2=\lg2/\lg5=a/(1-a)$. In (b), $\lg50=2-\lg2$. So $\log_2 50=(2-a)/a$.'
          - problem: 'Let $a=\log_2 3$ and $b=\log_2 5$. (a) Express $\log_2 45$ through $a$ and $b$. (b) Express $\log_{15} 6$ through $a$ and $b$. (c) Express $\log_3 20$ through $a$ and $b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"function","vars":["a","b"]}},{"name":"p2","contract":{"kind":"function","vars":["a","b"]}},{"name":"p3","contract":{"kind":"function","vars":["a","b"]}}]}
            answer: 'p1 = 2*a+b; p2 = (1+a)/(a+b); p3 = (2+b)/a'
            solution_sketch: 'We have $\log_2 45=2a+b$. For (b), $\log_{15}6=\log_2 6/\log_2 15=(1+a)/(a+b)$. For (c), $\log_3 20=\log_2 20/\log_2 3=(2+b)/a$.'
          - problem: 'Let $p=\ln 2$ and $q=\ln 3$. (a) Express $\log_4 18$ through $p$ and $q$. (b) Express $\log_{0.5}72$ through $p$ and $q$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"function","vars":["p","q"]}},{"name":"p2","contract":{"kind":"function","vars":["p","q"]}}]}
            answer: 'p1 = (p+2*q)/(2*p); p2 = -(3*p+2*q)/p'
            solution_sketch: 'Change to natural logarithms. In (a), $\ln18=p+2q$ and $\ln4=2p$. In (b), $\ln72=3p+2q$ and $\ln0.5=-p$. So $\log_{0.5}72=-(3p+2q)/p$.'
        constraints: 'two or three parts; the given logarithms are named a and b; the key is an expression in a and b'
      - id: kp2
        name: 'Domain, identity and number set of a logarithm'
        key_prerequisites: [number-sets-structure, logarithm-basics]
        exemplars:
          - problem: 'Find all $x$ for which the expression has a meaning. (a) $\lg(2x-8)$. (b) $\log_{0.2}(6-x)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"inequality_union"}},{"name":"p2","contract":{"kind":"inequality_union"}}]}
            answer: 'p1 = x > 4; p2 = x < 6'
            solution_sketch: 'The argument of a logarithm must be positive. In (a), $2x-8>0$ gives $x>4$. In (b), $6-x>0$ gives $x<6$.'
          - problem: 'Find all $x$ for which the expression has a meaning. (a) $\ln(x^2-4)$. (b) $\lg(x+1)+\lg(5-x)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"inequality_union"}},{"name":"p2","contract":{"kind":"inequality_union"}}]}
            answer: 'p1 = x < -2 or x > 2; p2 = -1 < x < 5'
            solution_sketch: 'In (a), $x^2>4$ gives $x<-2$ or $x>2$. In (b), both $x+1>0$ and $5-x>0$ must hold. So $-1<x<5$.'
          - problem: 'Look at the numbers $\log_2 8$, $\log_3 5$, $\lg 1000$, $\log_2\tfrac14$, $\log_2 3$. (a) How many of them are integers? (b) How many of them are irrational? (c) How many of them are negative?'
            answer_contract: {"kind":"multipart","parts":[{"name":"integers","contract":{"kind":"exact"}},{"name":"irrational","contract":{"kind":"exact"}},{"name":"negative","contract":{"kind":"exact"}}]}
            answer: 'integers = 3; irrational = 2; negative = 1'
            solution_sketch: 'We have $\log_2 8=3$, $\lg1000=3$ and $\log_2\frac14=-2$. These are integers. The numbers $\log_3 5$ and $\log_2 3$ are irrational. Only $-2$ is negative.'
          - problem: '(a) Compute $5^{\log_5 7}$. (b) Compute $9^{\log_3 4}$. (c) Compute $2^{3+\log_2 5}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = 7; p2 = 16; p3 = 40'
            solution_sketch: 'Use $a^{\log_a b}=b$. In (b), $9^{\log_3 4}=3^{2\log_3 4}=4^2=16$. In (c), $2^{3+\log_2 5}=8\cdot5=40$.'
          - problem: '(a) Compute $e^{2\ln 3}$. (b) Compute $\left(\tfrac12\right)^{\log_2 5}$. (c) Compute $10^{1-\lg 2}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = 9; p2 = 1/5; p3 = 5'
            solution_sketch: 'We have $e^{2\ln3}=(e^{\ln3})^2=9$. Also $(1/2)^{\log_2 5}=2^{-\log_2 5}=1/5$. Last, $10^{1-\lg2}=10/2=5$.'
          - problem: '(a) Find the integer $n$ with $n<\log_2 20<n+1$. (b) Find the integer $m$ with $m<\lg 5000<m+1$. (c) Find all $x$ for which $\log_{x-1}10$ has a meaning.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"m","contract":{"kind":"exact"}},{"name":"dom","contract":{"kind":"inequality_union"}}]}
            answer: 'n = 4; m = 3; dom = 1 < x < 2 or x > 2'
            solution_sketch: 'In (a), $16<20<32$ gives $n=4$. In (b), $1000<5000<10000$ gives $m=3$. In (c), the base must be positive and not equal to $1$. So $x-1>0$ and $x-1\ne1$.'
        constraints: 'two or three parts; domains with linear and quadratic arguments, number sets of log values, and the identity a^(log_a b)=b'
      - id: kp3
        name: 'Value of an expression with logarithms and powers'
        key_prerequisites: [log-identity-base-rules, log-power-rule]
        exemplars:
          - problem: '(a) Compute $\log_2 12-\log_2 3$. (b) Compute $\lg 4+\lg 25$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = 2; p2 = 2'
            solution_sketch: 'In (a), $\log_2(12/3)=\log_2 4=2$. In (b), $\lg(4\cdot25)=\lg100=2$.'
          - problem: '(a) Compute $\log_3\frac1{27}$. (b) Compute $\log_{25}5$. (c) Compute $\log_8 4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = -3; p2 = 1/2; p3 = 2/3'
            solution_sketch: 'In (a), $3^{-3}=1/27$. In (b), $25^{1/2}=5$. In (c), $8^{x}=4$ means $2^{3x}=2^2$, so $x=2/3$.'
          - problem: '(a) Compute $2\log_5 10-\log_5 4$. (b) Compute $\log_2\sqrt8$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = 2; p2 = 3/2'
            solution_sketch: 'In (a), the sum is $\log_5(100/4)=\log_5 25=2$. In (b), $\sqrt8=2^{3/2}$, so the logarithm is $3/2$.'
          - problem: '(a) Compute $\dfrac{\log_2 27}{\log_2 9}$. (b) Compute $\log_4 8\cdot\log_8 16$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = 3/2; p2 = 2'
            solution_sketch: 'In (a), the change of base gives $\log_9 27=3/2$. In (b), $\log_4 8=3/2$ and $\log_8 16=4/3$. The product is $2$.'
          - problem: '(a) Compute $25^{\log_5 3}$. (b) Compute $2^{\log_2 6-1}$. (c) Compute $\log_6 4+\log_6 9$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = 9; p2 = 3; p3 = 2'
            solution_sketch: 'In (a), $25^{\log_5 3}=5^{2\log_5 3}=9$. In (b), the value is $6/2=3$. In (c), $\log_6 36=2$.'
          - problem: '(a) The number $x>1$ has $\log_2 x=3$. Find $\log_x 2$. (b) Solve $\log_2 x+\log_2(x-2)=3$. (c) The numbers $x$ and $y$ have $5^{x}=7$ and $7^{y}=25$. Find $xy$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"inv","contract":{"kind":"exact"}},{"name":"sol","contract":{"kind":"set"}},{"name":"prod","contract":{"kind":"exact"}}]}
            answer: 'inv = 1/3; sol = {4}; prod = 2'
            solution_sketch: 'In (a), $\log_x 2=1/\log_2 x=1/3$. In (b), $x(x-2)=8$ gives $x=4$ or $x=-2$. Only $x=4$ keeps both arguments positive. In (c), $5^{xy}=7^{y}=25$, so $xy=2$.'
        constraints: 'two or three parts; bases 2, 3, 5, 10 and 25; every value is exact'
    diagnostic_exemplar:
      problem: 'Compute $\log_2 32$.'
      answer_contract: {"kind":"exact"}
      answer: '5'
      solution_sketch: 'We have $2^5=32$, so the logarithm is $5$.'
