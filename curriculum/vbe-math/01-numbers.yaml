          - problem: 'The terminal side of a turn angle $\alpha$ meets the unit circle at $P\left(\tfrac35,\tfrac45\right)$. (a) Find $\sin\alpha$. (b) Find $\cos\alpha$. (c) Find $\tan\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sin","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"exact"}}]}
            answer: 'sin = 4/5; cos = 3/5; tan = 4/3'
            solution_sketch: 'The sine is the ordinate of $P$ and the cosine is the abscissa. The tangent is the ratio $\sin\alpha/\cos\alpha=(4/5)/(3/5)=4/3$.'
          - problem: 'The terminal side of a turn angle $\alpha$ meets the unit circle at $P\left(-\tfrac5{13},\tfrac{12}{13}\right)$. (a) Find $\sin\alpha$. (b) Find $\tan\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sin","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"exact"}}]}
            answer: 'sin = 12/13; tan = -12/5'
            solution_sketch: 'The sine is the ordinate, $12/13$. The tangent is $(12/13)/(-5/13)=-12/5$.'
          - problem: 'The terminal side of a turn angle $\alpha$ meets the unit circle at $P(x,-\tfrac12)$ with $x>0$. (a) Find $x$. (b) Find $\tan\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"exact"}}]}
            answer: 'x = sqrt(3)/2; tan = -sqrt(3)/3'
            solution_sketch: 'A point of the unit circle has $x^2+y^2=1$. So $x^2=3/4$, and $x>0$ gives $x=\sqrt3/2$. Then $\tan\alpha=(-1/2)/(\sqrt3/2)=-1/\sqrt3=-\sqrt3/3$.'
          - problem: 'The terminal side of an angle $\alpha$ with $0<\alpha<90^\circ$ meets the tangent line $x=1$ of the unit circle at the point $(1,2)$. (a) Find $\tan\alpha$. (b) Find $\cos\alpha$. (c) Find $\sin\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"tan","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}},{"name":"sin","contract":{"kind":"exact"}}]}
            answer: 'tan = 2; cos = sqrt(5)/5; sin = 2*sqrt(5)/5'
            solution_sketch: 'The ordinate on the line $x=1$ is $\tan\alpha=2$. From $\sin\alpha=2\cos\alpha$ and $\sin^2\alpha+\cos^2\alpha=1$ we get $5\cos^2\alpha=1$. So $\cos\alpha=\sqrt5/5$ and $\sin\alpha=2\sqrt5/5$.'
          - problem: 'The terminal side of a turn angle $\alpha$ meets the unit circle at a point $P$ below the $x$-axis. The abscissa of $P$ is $-\tfrac45$. (a) Find $\sin\alpha$. (b) Find $\tan\alpha$. (c) Find $\sin(\alpha+180^\circ)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sin","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"exact"}},{"name":"sin180","contract":{"kind":"exact"}}]}
            answer: 'sin = -3/5; tan = 3/4; sin180 = 3/5'
            solution_sketch: 'We have $y^2=1-16/25=9/25$ and $y<0$, so $\sin\alpha=-3/5$. Then $\tan\alpha=(-3/5)/(-4/5)=3/4$. A turn by $180^\circ$ changes the sign of the ordinate, so the result is $3/5$.'
          - problem: 'A turn angle $\alpha$ has $\cos\alpha=-\tfrac13$, and its terminal side lies in the third quadrant. (a) Find $\sin\alpha$. (b) Find $\tan\alpha$. (c) Find $\sin2\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sin","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"exact"}},{"name":"sin2","contract":{"kind":"exact"}}]}
            answer: 'sin = -2*sqrt(2)/3; tan = 2*sqrt(2); sin2 = 4*sqrt(2)/9'
            solution_sketch: 'We have $\sin^2\alpha=1-1/9=8/9$, and the sine is negative. So $\sin\alpha=-2\sqrt2/3$. Then $\tan\alpha=(-2\sqrt2/3)/(-1/3)=2\sqrt2$. Last, $\sin2\alpha=2\sin\alpha\cos\alpha=4\sqrt2/9$.'
        constraints: 'a point of the unit circle or of the line x=1 is given in words; the parts ask for sine, cosine and tangent'
      - id: kp2
        name: 'Exact values, parity and period formulas in one expression'
        key_prerequisites: [trig-parity-period-formulas, unit-circle-special-angles]
        exemplars:
          - problem: '(a) Compute $\sin150^\circ$. (b) Compute $\cos225^\circ$. (c) Compute $\tan120^\circ$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sin","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"exact"}}]}
            answer: 'sin = 1/2; cos = -sqrt(2)/2; tan = -sqrt(3)'
            solution_sketch: 'The reference angles are $30^\circ$, $45^\circ$ and $60^\circ$. The signs follow the quadrants. The sine is positive in the second quadrant. The cosine is negative in the third quadrant. The tangent is negative in the second quadrant.'
          - problem: '(a) Compute $\sin\left(-\tfrac{\pi}{6}\right)$. (b) Compute $\cos\tfrac{7\pi}{3}$. (c) Compute $\tan\tfrac{5\pi}{4}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sin","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"exact"}}]}
            answer: 'sin = -1/2; cos = 1/2; tan = 1'
            solution_sketch: 'The sine is odd, so $\sin(-\pi/6)=-1/2$. Also $7\pi/3=2\pi+\pi/3$, so the cosine is $1/2$. Last, $\tan(5\pi/4)=\tan(\pi/4)=1$.'
          - problem: '(a) Compute $\sin\tfrac{\pi}{3}\cos\tfrac{\pi}{6}-\cos\tfrac{\pi}{3}\sin\tfrac{\pi}{6}$. (b) Compute $\tan60^\circ\cdot\cos30^\circ$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = 1/2; p2 = 3/2'
            solution_sketch: 'In (a), the value is $\frac{\sqrt3}{2}\cdot\frac{\sqrt3}{2}-\frac12\cdot\frac12=\frac34-\frac14=\frac12$. In (b), it is $\sqrt3\cdot\frac{\sqrt3}{2}=\frac32$.'
          - problem: '(a) Compute $\sin(-420^\circ)$. (b) Compute $\cos\left(-\tfrac{11\pi}{3}\right)$. (c) Compute $\tan\tfrac{13\pi}{4}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sin","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}},{"name":"tan","contract":{"kind":"exact"}}]}
            answer: 'sin = -sqrt(3)/2; cos = 1/2; tan = 1'
            solution_sketch: 'We have $\sin(-420^\circ)=-\sin60^\circ=-\sqrt3/2$. The cosine is even and has period $2\pi$. So $\cos(11\pi/3)=\cos(-\pi/3)=1/2$. The tangent has period $\pi$, so $\tan(13\pi/4)=\tan(\pi/4)=1$.'
          - problem: '(a) Compute $\sin\left(-\tfrac{\pi}{4}\right)\cos\tfrac{9\pi}{4}$. (b) Compute $\dfrac{\sin390^\circ+\cos(-60^\circ)}{\tan225^\circ}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = -1/2; p2 = 1'
            solution_sketch: 'In (a), the product is $\left(-\frac{\sqrt2}{2}\right)\cdot\frac{\sqrt2}{2}=-\frac12$. In (b), $\sin390^\circ=\sin30^\circ=\frac12$ and $\cos(-60^\circ)=\frac12$. Also $\tan225^\circ=1$. So the value is $1$.'
          - problem: '(a) Compute $\sin\tfrac{7\pi}{6}+\cos\tfrac{5\pi}{3}+\tan\tfrac{3\pi}{4}$. (b) The number $x$ has $\sin x=\tfrac13$. Find $\sin(-x)+\sin(x+2\pi)+\sin(x-2\pi)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = -1; p2 = 1/3'
            solution_sketch: 'In (a), the terms are $-\frac12$, $\frac12$ and $-1$. Their sum is $-1$. In (b), the sine is odd, so the first term is $-\frac13$. The other two terms equal $\frac13$ each. The sum is $\frac13$.'
        constraints: 'table angles in degrees or radians; parity and period move the angle to a table angle; keys are exact'
      - id: kp3
        name: 'Arcsine, arccosine and arctangent in a short equation'
        key_prerequisites: [inverse-trig-functions, unit-circle-special-angles]
        exemplars:
          - problem: '(a) Compute $\arcsin\tfrac12$. (b) Compute $\arccos\left(-\tfrac12\right)$. (c) Compute $\arctan1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = pi/6; p2 = 2*pi/3; p3 = pi/4'
            solution_sketch: 'The arcsine is in $[-\pi/2,\pi/2]$, so $\arcsin\frac12=\pi/6$. The arccosine is in $[0,\pi]$, so $\arccos(-\frac12)=2\pi/3$. Also $\tan(\pi/4)=1$.'
          - problem: '(a) Compute $\arccos0$. (b) Compute $\arcsin(-1)$. (c) Compute $\arctan(-\sqrt3)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = pi/2; p2 = -pi/2; p3 = -pi/3'
            solution_sketch: 'We have $\cos(\pi/2)=0$ and $\sin(-\pi/2)=-1$. The arctangent is in $(-\pi/2,\pi/2)$ and $\tan(-\pi/3)=-\sqrt3$.'
          - problem: '(a) Solve $\arccos(2x-1)=\tfrac{\pi}{3}$. (b) Solve $\arcsin(3x)=-\tfrac{\pi}{6}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = 3/4; p2 = -1/6'
            solution_sketch: 'In (a), $2x-1=\cos(\pi/3)=1/2$, so $x=3/4$. In (b), $3x=\sin(-\pi/6)=-1/2$, so $x=-1/6$.'
          - problem: '(a) Compute $\cos\left(\arcsin\tfrac35\right)$. (b) Compute $\tan\left(\arccos\tfrac5{13}\right)$. (c) Compute $\sin\left(2\arcsin\tfrac35\right)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = 4/5; p2 = 12/5; p3 = 24/25'
            solution_sketch: 'The angle $\arcsin\frac35$ is in the first quadrant, so its cosine is $\frac45$. For (b), the sine is $\frac{12}{13}$, so the tangent is $\frac{12}{5}$. For (c), $\sin2t=2\cdot\frac35\cdot\frac45=\frac{24}{25}$.'
          - problem: '(a) Solve $\arctan(x+1)=\tfrac{\pi}{4}$. (b) Solve $3\arcsin x=\tfrac{\pi}{2}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = 0; p2 = 1/2'
            solution_sketch: 'In (a), $x+1=\tan(\pi/4)=1$, so $x=0$. In (b), $\arcsin x=\pi/6$, so $x=\sin(\pi/6)=1/2$.'
          - problem: '(a) Solve $\arcsin x=\arccos x$. (b) Compute $\arcsin\tfrac12+\arccos\tfrac12$. (c) Find all integers $a$ for which $\arccos(a-2)$ exists.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"set"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"set"}}]}
            answer: 'p1 = {sqrt(2)/2}; p2 = pi/2; p3 = {1, 2, 3}'
            solution_sketch: 'In (a), the sine and the cosine of the angle are equal, so the angle is $\pi/4$ and $x=\sqrt2/2$. In (b), the sum is $\pi/6+\pi/3=\pi/2$. In (c), the argument must be in $[-1,1]$. So $1\le a\le3$.'
        constraints: 'arcsin, arccos and arctan of table values; short equations with one arc function'
