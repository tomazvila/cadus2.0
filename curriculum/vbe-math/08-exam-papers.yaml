        exemplars:
          # source: VBE 2024 main task 1
          - problem: 'The graph of the function $y = 3^x$ meets the Oy axis at one point. For $x \to -\infty$ the graph comes close to a horizontal line $y = c$. (a) Find the ordinate of the point where the graph meets the Oy axis. (b) Find the number $c$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"yaxis","contract":{"kind":"exact"}},{"name":"asymptote","contract":{"kind":"exact"}}]}
            answer: 'yaxis = 1; asymptote = 0'
            solution_sketch: '(a) We have $3^0 = 1$, so the graph meets the Oy axis at $(0; 1)$. (b) For $x \to -\infty$ the value $3^x$ comes close to $0$, and stays above $0$. So $c = 0$.'
            points: 1
          # source: VBE 2024 main task 2
          - problem: 'A class took a survey about the time each student spent on preparing a school event in one week. The results: 10 students spent 8 hours, 9 students spent 10 hours, 6 students spent 16 hours, 4 students spent 18 hours and 1 student spent 22 hours. Find the mean number of hours per week that a student of this class spent on preparing the event.'
            answer_contract: {"kind":"exact"}
            answer: '12'
            solution_sketch: 'The total is $10 \cdot 8 + 9 \cdot 10 + 6 \cdot 16 + 4 \cdot 18 + 22 = 360$ hours. The class has $30$ students. The mean is $360 / 30 = 12$ hours.'
            points: 1
          # source: VBE 2024 main task 3
          - problem: 'The password of a reader account has four symbols. The first symbol is one of the five signs &, *, #, % and the dollar sign. The other three symbols are three different digits (for example *012 or %931). Find how many different passwords exist.'
            answer_contract: {"kind":"exact"}
            answer: '3600'
            solution_sketch: 'The first symbol has $5$ choices. The digits have $10 \cdot 9 \cdot 8 = 720$ choices. The product is $5 \cdot 720 = 3600$.'
            points: 1
          # source: VBE 2024 main task 4
          - problem: 'Augustė will take driving courses for three months. In the first month she pays 400.00 euros. Each next month she pays 10 % less than in the month before. Find how many euros the three months of the courses cost in total.'
            answer_contract: {"kind":"exact"}
            answer: '1084'
            solution_sketch: 'The payments are $400$, $360$ and $324$ euros. The sum is $1084$ euros.'
            points: 1
          # source: VBE 2024 main task 7
          - problem: 'The graph of the function $y = a + \sin x$ is a sine curve. The smallest value of the function is $1$ and the largest value is $3$. Find the number $a$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'The sine takes all values from $-1$ to $1$. So $a - 1 = 1$ and $a + 1 = 3$. Then $a = 2$.'
            points: 1
          # source: VBE 2024 main task 8
          - problem: 'The quadrilateral $ABCD$ is an isosceles trapezoid. Its vertices go in the order $A$, $B$, $C$, $D$, and its bases are $AD$ and $BC$. The legs are equal, $AB = CD$, and $AD : BC = 3 : 1$. Find the number $k$ for which $\overrightarrow{AD} = k \cdot \overrightarrow{BC}$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'The bases are parallel and point the same way. The length of $AD$ is $3$ times the length of $BC$. So $k = 3$.'
            points: 1
          # source: VBE 2024 main task 9
          - problem: 'A vase has the shape of a cone. The altitude of the cone has the length $h$ and is perpendicular to the horizontal table. The vase holds water, and the water surface lies at the distance $\frac{2}{3}h$ from the apex of the cone. The capacity of the vase is 1350 ml. Find how many milliliters of water the vase holds.'
            answer_contract: {"kind":"exact"}
            answer: '400'
            solution_sketch: 'The water fills a cone similar to the vase with ratio $\frac23$. The volume ratio is $(\frac23)^3 = \frac{8}{27}$. So the volume is $1350 \cdot \frac{8}{27} = 400$ ml.'
            points: 1
          # source: VBE 2024 main task 10
          - problem: 'The common difference $d$ of an arithmetic progression $a_1, a_2, a_3, \dots$ is a prime number greater than $2$. Two terms $a_k$ and $a_m$ of this progression are picked. It is known that $a_m - a_k = 28$. Find the difference $m - k$.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'We have $a_m - a_k = (m - k)d = 28$. So $d$ divides $28$. The only prime divisor of $28$ greater than $2$ is $7$. Then $m - k = 28 / 7 = 4$.'
            points: 1
          # source: VBE 2024 main task 11
          - problem: 'Two sets of numbers are given: $A = \{1; 5; 8; 9; 14; 19; 20\}$ and $B = \{1; 5; 7; 9; 12; 20\}$. Find how many elements the intersection $A \cap B$ has.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'The common elements are $1$, $5$, $9$ and $20$. So the intersection has $4$ elements.'
            points: 1
          # source: VBE 2024 main task 12
          - problem: 'In the triangle $ABC$ we have $AB = 2$, $BC = 3$ and $\cos\angle ABC = \frac16$. Find the length of the side $AC$.'
            answer_contract: {"kind":"exact"}
            answer: 'sqrt(11)'
            solution_sketch: 'Use the law of cosines. We get $AC^2 = 4 + 9 - 2 \cdot 2 \cdot 3 \cdot \frac16 = 11$. So $AC = \sqrt{11}$.'
            points: 1
          # source: VBE 2024 main task 16
          - problem: 'The vectors $\vec{a} = (4; 3)$ and $\vec{b} = (5; -12)$ are given. Let $\alpha$ be the angle between $\vec{a}$ and $\vec{b}$. Find $\cos\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '-16/65'
            solution_sketch: 'The scalar product is $4 \cdot 5 + 3 \cdot (-12) = -16$. The lengths are $|\vec{a}| = 5$ and $|\vec{b}| = 13$. So $\cos\alpha = -\frac{16}{65}$.'
            points: 1
          # source: VBE 2024 main task 18
          - problem: 'It is known that $\cos\frac{\pi}{18} = k$. Express the number $\sin\frac{\pi}{36}$ with $k$.'
            answer_contract: {"kind":"function","vars":["k"]}
            answer: 'sqrt((1-k)/2)'
            solution_sketch: 'Use $\cos 2\beta = 1 - 2\sin^2\beta$ with $\beta = \frac{\pi}{36}$. We get $\sin^2\frac{\pi}{36} = \frac{1 - k}{2}$. The sine is positive, so $\sin\frac{\pi}{36} = \sqrt{\frac{1 - k}{2}}$.'
            points: 1
        constraints: 'The 1-point tasks of the official 2024 main paper in paper order; the choice tasks 1, 2, 3, 4, 7, 8, 9 and 10 are typed answers with the same mathematics; task 5 is the diagnostic exemplar; the figure task 6 stands in figures_open.tsv.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp11-equations, vbe-cp13-inequalities, vbe-cp16-trig-equations, vbe-cp18-derivative-rules, vbe-cp19-function-study, vbe-cp20-integral, vbe-cp25-probability-models, vbe-cp26-random-variables]
        exemplars:
          # source: VBE 2024 main task 13
          - problem: 'The $n$-th term of a geometric progression is $b_n = \frac12 \cdot 5^{n-1}$, where $n$ is a natural number. (a) Find $b_3$. (b) Find the sum of the first six terms of this progression.'
            answer_contract: {"kind":"multipart","parts":[{"name":"b3","contract":{"kind":"exact"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'b3 = 25/2; sum = 1953'
            solution_sketch: 'We get $b_3 = \frac12 \cdot 25 = \frac{25}{2}$. The ratio is $q = 5$ and $b_1 = \frac12$. So $S_6 = \frac{\frac12 (5^6 - 1)}{5 - 1} = \frac{15624}{8} = 1953$.'
            points: 2
          # source: VBE 2024 main task 14
          - problem: 'The chords $AD$ and $EB$ of a circle with center $O$ meet at the point $C$. The chords are perpendicular. It is known that $\angle ADE = 60^\circ$. (a) Find the angle $BAD$ in degrees. (b) Join the points $A$ and $E$ to get the triangle $ADE$. The radius of the circle is $6$. Find the length of the side $AE$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"angle","contract":{"kind":"exact"}},{"name":"length","contract":{"kind":"exact"}}]}
            answer: 'angle = 30; length = 6*sqrt(3)'
            solution_sketch: 'In the right triangle $CDE$ the angle at $D$ is $60^\circ$, so $\angle CED = 30^\circ$. The angles $BAD$ and $BED$ rest on the same arc, so $\angle BAD = 30^\circ$. By the law of sines $AE = 2R\sin 60^\circ = 12 \cdot \frac{\sqrt3}{2} = 6\sqrt{3}$.'
            points: 2
          # source: VBE 2024 main task 15
          - problem: 'A box holds balls of the same size. Some balls are red and the other balls are black. One ball is drawn from the box at random. The probability that it is red is $\frac35$. (a) Find how many black balls the box holds, if it holds 35 balls in total. (b) One ball is drawn from the box at random and a coin is tossed once. The event $A$ is: the drawn ball is red and the coin lands on the coat of arms. Find the probability of the event $A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"black","contract":{"kind":"exact"}},{"name":"prob","contract":{"kind":"exact"}}]}
            answer: 'black = 14; prob = 3/10'
            solution_sketch: 'The box holds $\frac35 \cdot 35 = 21$ red balls. So it holds $35 - 21 = 14$ black balls. The coat of arms has the probability $\frac12$, so $P(A) = \frac35 \cdot \frac12 = \frac{3}{10}$.'
            points: 2
          # source: VBE 2024 main task 17
          - problem: 'The function $y = f(x)$ and its derivative $y = f''(x)$ are defined for all real $x$. The graph of the derivative $y = f''(x)$ is a line. The line meets the $x$-axis at the point $(-3; 0)$ and the $y$-axis at the point $(0; -2)$. (a) Find all values of $x$ for which the function $f$ decreases. (b) A tangent to the graph of $f$ touches the graph at the point with abscissa $0$. This tangent meets the $x$-axis at the point $(5; 0)$. Write the equation of the tangent in the form $y = kx + m$, and give the expression $kx + m$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"decrease","contract":{"kind":"inequality_union"}},{"name":"tangent","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'decrease = x > -3; tangent = -2*x+10'
            solution_sketch: 'The line through $(-3; 0)$ and $(0; -2)$ has the slope $-\frac23$, so $f''(x) = -\frac23 x - 2$. We have $f''(x) < 0$ when $x > -3$. The slope of the tangent is $f''(0) = -2$. The tangent passes through $(5; 0)$, so $y = -2(x - 5) = -2x + 10$.'
            points: 2
          # source: VBE 2024 main task 19
          - problem: '(a) Solve the equation $4^{2-3x} = 64$. (b) Solve the equation $\frac{x^2 - 2x}{x - 2} = 0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"exact"}},{"name":"second","contract":{"kind":"exact"}}]}
            answer: 'first = -1/3; second = 0'
            solution_sketch: '(a) Write $64 = 4^3$. Then $2 - 3x = 3$ and $x = -\frac13$. (b) The numerator is $x(x - 2)$, so $x = 0$ or $x = 2$. The denominator is zero at $x = 2$, so only $x = 0$ remains.'
            points: 4
          # source: VBE 2024 main task 20
          - problem: 'Ignas will build a water well. The price of the well depends on its depth in meters. A company offers this price: the 1st meter costs 11.00 euros, and each next meter costs 1.25 euros more than the meter before. (a) Find the price of the 5th meter in euros. (b) The depth of the well will be at least 100 meters. So the company offers a discount: the price grows as before from the 1st to the 81st meter, and from the 82nd meter the price of each meter does not change and equals the price of the 81st meter. Find how many euros a well of 100 meters costs with this offer.'
            answer_contract: {"kind":"multipart","parts":[{"name":"fifth","contract":{"kind":"exact"}},{"name":"total","contract":{"kind":"exact"}}]}
            answer: 'fifth = 16; total = 7050'
            solution_sketch: 'The price of the 5th meter is $11 + 4 \cdot 1.25 = 16$ euros. The first 80 meters cost $S_{80} = \frac{2 \cdot 11 + 79 \cdot 1.25}{2} \cdot 80 = 4830$ euros. The 81st meter costs $11 + 80 \cdot 1.25 = 111$ euros. The last 20 meters cost $20 \cdot 111 = 2220$ euros. The total is $4830 + 2220 = 7050$ euros.'
            points: 5
          # source: VBE 2024 main task 21(b,c)
          - problem: 'The graph of the function $f(x) = (x - 4)^2$ is a parabola. The rectangle $OABC$ has the vertex $O$ at the origin, the vertex $A$ on the $y$-axis, the vertex $B$ on the parabola and the vertex $C$ on the $x$-axis. Let $OC = a$, where $a \in (0; 4)$. The area of the rectangle is $S(a) = a^3 - 8a^2 + 16a$. (a) Find the value of $a$ for which the area $S(a)$ is the largest. (b) The point $D$ is the vertex of the parabola. Let $OC = 1$. Find the area of the region $OABD$ that is bounded by the segment $OA$, the segment $AB$, the arc $BD$ of the parabola and the segment $DO$ on the $x$-axis.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'a = 4/3; area = 18'
            solution_sketch: 'We get $S''(a) = 3a^2 - 16a + 16$. Its zeros are $a = \frac43$ and $a = 4$, and only $\frac43$ is in $(0; 4)$. The derivative changes from plus to minus there, so this is the maximum. For (b) the rectangle has the area $1 \cdot 9 = 9$. Add $\int_1^4 (x - 4)^2\,dx = 9$. The total is $18$.'
            points: 7
          # source: VBE 2024 main task 22(c,d)
          - problem: 'In the triangle $ABC$ the altitudes $AD$ and $BE$ meet at the point $M$. The sides are $AB = 13$, $BC = 14$ and $AC = 15$. The triangles $AME$ and $BMD$ are similar, with $A$ matching $B$, $M$ matching $M$ and $E$ matching $D$. (a) Find the similarity ratio $k$ for which each side of the triangle $AME$ equals $k$ times the matching side of the triangle $BMD$. (b) Let $\vec{a} = \overrightarrow{AB}$ and $\vec{b} = \overrightarrow{BC}$. Express the vector $\overrightarrow{AD}$ with $\vec{a}$ and $\vec{b}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ratio","contract":{"kind":"exact"}},{"name":"vector","contract":{"kind":"function","vars":["a","b"]}}]}
            answer: 'ratio = 33/25; vector = a+5/14*b'
            solution_sketch: 'The area of the triangle is $84$. So $BE = \frac{2 \cdot 84}{15} = 11.2$ and $AD = 12$. Then $AE = \sqrt{169 - 125.44} = 6.6$ and $BD = \sqrt{169 - 144} = 5$. The ratio is $k = \frac{AE}{BD} = \frac{6.6}{5} = \frac{33}{25}$. Also $\overrightarrow{AD} = \overrightarrow{AB} + \overrightarrow{BD} = \vec{a} + \frac{5}{14}\vec{b}$.'
            points: 4
          # source: VBE 2024 main task 23
          - problem: 'A non-standard six-sided die has 1, 2, 3, 4, 5 and 6 dots on its faces, and the faces have different probabilities. The random variable $X$ is the number of dots on the top face after one toss. The probabilities are $P(X = 1) = \frac13$, $P(X = 2) = \frac{1}{12}$, $P(X = 3) = \frac16$, $P(X = 4) = \frac14$, $P(X = 5) = a$ and $P(X = 6) = \frac{1}{18}$. (a) Find the value of $a$. (b) Find the expected value of $X$. (c) The die is tossed two times. Find the probability that the sum of the dots of the two tosses is $4$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}},{"name":"prob","contract":{"kind":"exact"}}]}
            answer: 'a = 1/9; mean = 26/9; prob = 17/144'
            solution_sketch: 'The probabilities sum to $1$, so $a = 1 - \frac{32}{36} = \frac19$. The expected value is $\frac13 + \frac16 + \frac12 + 1 + \frac59 + \frac13 = \frac{26}{9}$. The sum $4$ comes from $1 + 3$, $3 + 1$ or $2 + 2$. So the probability is $2 \cdot \frac13 \cdot \frac16 + \frac{1}{12} \cdot \frac{1}{12} = \frac{17}{144}$.'
            points: 4
          # source: VBE 2024 main task 24
          - problem: '(a) Solve the inequality $\cos x < \frac{\sqrt2}{2}$ for $x \in [0; 2\pi]$. (b) Solve the inequality $\ln(\ln x) \le 0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"inequality_union"}},{"name":"second","contract":{"kind":"inequality_union"}}]}
            answer: 'first = pi/4 < x < 7*pi/4; second = 1 < x <= e'
            solution_sketch: '(a) The equation $\cos x = \frac{\sqrt2}{2}$ has the roots $\frac{\pi}{4}$ and $\frac{7\pi}{4}$ on $[0; 2\pi]$. The cosine is smaller between them. (b) We need $\ln x > 0$, so $x > 1$. Also $\ln x \le 1$, so $x \le e$. The answer is $1 < x \le e$.'
            points: 5
          # source: VBE 2024 main task 21(a)
          - problem: 'The graph of the function $f(x) = (x - 4)^2$ is a parabola. The rectangle $OABC$ has the vertex $O$ at the origin, the vertex $A$ on the $y$-axis, the vertex $B$ on the parabola and the vertex $C$ on the $x$-axis. Let $OC = a$, where $a \in (0; 4)$. Show that the area of the rectangle $OABC$ equals $S(a) = a^3 - 8a^2 + 16a$.'
            answer_contract: {"kind":"written"}
            answer: 'The side $BC$ equals $f(a) = (a - 4)^2$. So $S(a) = a(a - 4)^2 = a^3 - 8a^2 + 16a$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the length $BC = f(a) = (a - 4)^2$, or the right method. 1 point: the correct derivation of the formula $S(a) = a^3 - 8a^2 + 16a$.'
            points: 2
          # source: VBE 2024 main task 22(a)
          - problem: 'In the triangle $ABC$ the altitudes $AD$ and $BE$ meet at the point $M$. Prove that the triangles $AME$ and $BMD$ are similar.'
            answer_contract: {"kind":"written"}
            answer: 'The angles $AME$ and $BMD$ are vertical angles, so they are equal. The angles $AEM$ and $BDM$ are right angles. So the triangles are similar by two equal angles.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the reason why the angles $AME$ and $BMD$ are equal (vertical angles). 1 point: the correct proof of the similarity by two equal angles, with $\angle AEM = \angle BDM = 90^\circ$.'
            points: 2
          # source: VBE 2024 main task 22(b)
          - problem: 'The sides of the triangle $ABC$ are $AB = 13$, $BC = 14$ and $AC = 15$. Show that the area of the triangle $ABC$ equals $84$.'
            answer_contract: {"kind":"written"}
            answer: 'The half-perimeter is $p = 21$. Heron''s formula gives $S = \sqrt{21 \cdot 8 \cdot 7 \cdot 6} = \sqrt{7056} = 84$.'
            solution_sketch: 'Official scheme, 1 point. 1 point: the correct demonstration that the area equals $84$, with the half-perimeter $21$ and Heron''s formula. Other correct methods also get the point.'
            points: 1
          # source: VBE 2024 main task 25(a)
          - problem: 'The function $f(x) = 2024^x - \frac{1}{2024^x}$ is defined for all real $x$. Show that $f$ is an odd function.'
            answer_contract: {"kind":"written"}
            answer: 'We have $f(-x) = 2024^{-x} - 2024^{x} = -f(x)$ for every $x$. So the function is odd.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the correct method, the expression of $f(-x)$. 1 point: the justification that $f(-x) = -f(x)$, so $f$ is odd.'
            points: 2
          # source: VBE 2024 main task 25(b)
          - problem: 'The function $f(x) = 2024^x - \frac{1}{2024^x}$ is defined for all real $x$. Prove that $f$ has no critical points.'
            answer_contract: {"kind":"written"}
            answer: 'The derivative is $f''(x) = \ln 2024 \cdot (2024^x + 2024^{-x})$. Both terms are positive for all $x$, and $\ln 2024 > 0$. So $f''(x) > 0$ and it is never zero.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the correct derivative $f''(x) = \ln 2024 \cdot (2024^x + 2024^{-x})$. 1 point: the correct argument that the derivative is never zero (it is positive for all real $x$).'
            points: 2
        constraints: 'The other tasks of the official paper (13 to 17 and 19 to 25); decidable items in paper order, then the written items; task 24(a) asks for the solution on the interval from 0 to 2 pi.'
    diagnostic_exemplar:
      # source: VBE 2024 main task 5
      problem: 'Find the domain of the expression $\sqrt{x(x - 4)}$. Write the answer as an inequality.'
      answer_contract: {"kind":"inequality_union"}
      answer: 'x <= 0 or x >= 4'
      solution_sketch: 'The expression under the root must not be negative. So $x(x - 4) \ge 0$, and the answer is $x \le 0$ or $x \ge 4$.'
