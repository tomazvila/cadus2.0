      problem: 'A door code has three symbols. The first symbol is one of the three letters A, B or C. The other two symbols are any digits. Find the number of different codes.'
      answer_contract: {"kind":"exact"}
      answer: '300'
      solution_sketch: 'The first symbol has 3 choices. Each digit has 10 choices. The product is $3 \cdot 10 \cdot 10 = 300$.'
