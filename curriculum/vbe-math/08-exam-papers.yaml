      - id: kp1
        name: 'Short-answer tasks'
        key_prerequisites: [vbe-cp01-number-sets, vbe-cp03-powers, vbe-cp04-roots, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp07-progressions, vbe-cp20-integral, vbe-cp25-probability-models]
        exemplars:
          # source: VBE 2025 repeat A II task 1
          - problem: 'The sets $A = (-5; 4)$ and $B = [-4; 5]$ are given. Find the intersection $A \cap B$ of these sets.'
            answer_contract: {"kind":"inequality_union"}
            answer: 'x >= -4 and x < 4'
            solution_sketch: 'The set $A$ holds the numbers above $-5$ and below $4$. The set $B$ holds the numbers from $-4$ to $5$. The common numbers are $-4 \le x < 4$, so $A \cap B = [-4; 4)$.'
            points: 1
          # source: VBE 2025 repeat A II task 2
          - problem: 'Find the value of the expression $\sqrt{(2 - \pi)^2}$.'
            answer_contract: {"kind":"exact"}
            answer: 'pi-2'
            solution_sketch: 'The root of a square equals the modulus: $\sqrt{(2 - \pi)^2} = |2 - \pi|$. The number $2 - \pi$ is negative. So the value is $\pi - 2$.'
            points: 1
          # source: VBE 2025 repeat A II task 3
          - problem: 'Find the value of $x$ for which the equality $\log_x 5 = 3$ is true.'
            answer_contract: {"kind":"exact"}
            answer: '5^(1/3)'
            solution_sketch: 'By the definition of the logarithm, $x^3 = 5$. So $x = \sqrt[3]{5}$.'
            points: 1
          # source: VBE 2025 repeat A II task 4
          - problem: 'Rationalize the denominator of the fraction $\frac{5}{\sqrt[3]{2}}$. Write the value as one fraction with a whole number in the denominator.'
            answer_contract: {"kind":"exact"}
            answer: '5*4^(1/3)/2'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt[3]{4}$. The bottom becomes $\sqrt[3]{2} \cdot \sqrt[3]{4} = 2$. The top becomes $5\sqrt[3]{4}$.'
            points: 1
          # source: VBE 2025 repeat A II task 6
          - problem: 'The terms of an arithmetic progression are $9; 5; 1; -3; \dots$. Write the formula of the $n$-th term $a_n$.'
            answer_contract: {"kind":"function","vars":["n"]}
            answer: '-4*n+13'
            solution_sketch: 'The first term is $a_1 = 9$ and the difference is $d = -4$. So $a_n = 9 + (n - 1)(-4) = -4n + 13$.'
            points: 1
          # source: VBE 2025 repeat A II task 7
          - problem: 'A unit circle has its center at the point $O(0; 0)$. The radius $OA$ turns from the positive direction of the $x$-axis by the rotation angle $\alpha = -60^\circ$. Find the ordinate $y_A$ of the point $A$.'
            answer_contract: {"kind":"exact"}
            answer: '-sqrt(3)/2'
            solution_sketch: 'The ordinate of the point on the unit circle is $\sin\alpha$. So $y_A = \sin(-60^\circ) = -\frac{\sqrt{3}}{2}$.'
            points: 1
          # source: VBE 2025 repeat A II task 8
          - problem: 'Find the antiderivative $F(x)$ of the function $f(x) = \sin x$, if $F\left(\frac{\pi}{3}\right) = 1.5$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '-cos(x)+2'
            solution_sketch: 'We have $F(x) = -\cos x + C$. The condition gives $-\frac12 + C = 1.5$, so $C = 2$. Then $F(x) = -\cos x + 2$.'
            points: 1
          # source: VBE 2025 repeat A II task 9
          - problem: 'Two students take an exam. The probability that the first student passes the exam is $0.85$. The probability that the second student passes the exam is $0.75$. Find the probability that the first student passes the exam and the second student does not pass it.'
            answer_contract: {"kind":"exact"}
            answer: '17/80'
            solution_sketch: 'The second student fails with probability $1 - 0.75 = 0.25$. The events are independent. So the probability is $0.85 \cdot 0.25 = 0.2125 = \frac{17}{80}$.'
            points: 1
          # source: VBE 2025 repeat A II task 10
          - problem: 'The function $y = f(x)$ and its derivative $y = f''(x)$ are defined for $x \in (-7; 12)$. The graph of $y = f(x)$ crosses the $x$-axis at the points with abscissas $x_1 = -6$, $x_2 = 3$ and $x_3 = 11$. The maximum point of the function is $x_{\max} = -2$. The minimum point is $x_{\min} = 8$. Find the interval of $x$ values on which the derivative satisfies $f''(x) < 0$.'
            answer_contract: {"kind":"inequality_union"}
            answer: 'x > -2 and x < 8'
            solution_sketch: 'The derivative is negative where the function decreases. The function decreases from the maximum point $-2$ to the minimum point $8$. So $x \in (-2; 8)$.'
            points: 1
        constraints: 'Nine 1-point tasks of the official paper in paper order; task 5 is the diagnostic exemplar; the choice of the figures of tasks 7 and 10 is replaced by the givens in words.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp13-inequalities, vbe-cp14-plane-vectors, vbe-cp17-limits-derivative-concept, vbe-cp18-derivative-rules, vbe-cp19-function-study, vbe-cp22-space-angles, vbe-cp23-solids, vbe-cp25-probability-models, vbe-cp26-random-variables, vbe-cp05-logarithms, vbe-cp07-progressions, vbe-cp15-trig-expressions]
        exemplars:
          # source: VBE 2025 repeat A II task 12
          - problem: 'The triangle $ABC$ is equilateral. The vector $\vec{AB} = \vec{a}$ and the vector $\vec{BC} = \vec{b}$. (a) The point $K$ is the midpoint of the side $AB$. Express the vector $\vec{CK}$ with the vectors $\vec{a}$ and $\vec{b}$. (b) The side of the triangle $ABC$ equals $8$. Find the scalar product $\vec{a} \cdot \vec{b}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ck","contract":{"kind":"function","vars":["a","b"]}},{"name":"product","contract":{"kind":"exact"}}]}
            answer: 'ck = -b-1/2*a; product = -32'
            solution_sketch: 'For (a), $\vec{CK} = \vec{CB} + \vec{BK} = -\vec{b} - \frac12\vec{a}$. For (b), the angle between $\vec{a}$ and $\vec{b}$ is $120^\circ$. So $\vec{a} \cdot \vec{b} = 8 \cdot 8 \cdot \cos 120^\circ = -32$.'
            points: 4
          # source: VBE 2025 repeat A II task 13
          - problem: 'Solve the inequalities. (a) $\frac{5}{x} \le 3$. (b) $\tan x \le 1$, where you give only the solutions in the interval $\left(-\frac{\pi}{2}; \frac{\pi}{2}\right)$. The full solution repeats with the period $\pi$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"inequality_union"}},{"name":"second","contract":{"kind":"inequality_union"}}]}
            answer: 'first = x < 0 or x >= 5/3; second = x > -pi/2 and x <= pi/4'
            solution_sketch: 'For (a), write $\frac{5 - 3x}{x} \le 0$. The solution is $x < 0$ or $x \ge \frac53$. For (b), the equation $\tan x = 1$ gives $x = \frac{\pi}{4}$ on the interval. The tangent grows, so $-\frac{\pi}{2} < x \le \frac{\pi}{4}$.'
            points: 5
          # source: VBE 2025 repeat A II task 14(a,d)
          - problem: 'The graph of the function $y = f(x) = 5 - e^x$ crosses the $x$-axis at the point $A$ and the $y$-axis at the point $B$. The tangent to this graph at the point $B$ crosses the $x$-axis at the point $C$. (a) Find the ordinate $y_B$ of the point $B$. The region $ABC$ is bounded by the graph of $y = f(x)$, the tangent $BC$ and the $x$-axis. Its area equals $a - \ln b$, where $a$ and $b$ are natural numbers. (b) Find the number $a$. (c) Find the number $b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ordinate","contract":{"kind":"exact"}},{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}}]}
            answer: 'ordinate = 4; a = 12; b = 3125'
            solution_sketch: 'We have $y_B = f(0) = 4$ and $f''(0) = -1$, so the tangent is $y = -x + 4$ and $C = (4; 0)$. Also $A = (\ln 5; 0)$. The area of the triangle $BOC$ is $8$. The area under the graph from $0$ to $\ln 5$ is $5\ln 5 - 4$. The difference is $12 - 5\ln 5 = 12 - \ln 3125$.'
            points: 6
          # source: VBE 2025 repeat A II task 15
          - problem: 'Find the critical points of the function $f(x) = 0.3x - \frac{x^2}{20} + \ln x$. Give the value of $x$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'The domain is $x > 0$. The derivative is $f''(x) = 0.3 - \frac{x}{10} + \frac1x$. The equation $f''(x) = 0$ gives $x^2 - 3x - 10 = 0$, so $x = -2$ or $x = 5$. Only $x = 5$ is in the domain.'
            points: 3
          # source: VBE 2025 repeat A II task 16(a,c)
          - problem: 'Two teams, $A$ and $B$, meet in a basketball championship final. The team that wins $4$ games wins the championship. The winner is known after $4$ games at the earliest and after $7$ games at the latest. The probability that the team $B$ wins one game against the team $A$ is $0.8$. (a) Find the probability that the team $B$ wins exactly $2$ games out of the first $3$ games. (b) The random variable $X$ is the number of games that the final holds. The distribution of $X$ is given: $\mathrm{P}(X = 4) = \frac{1285}{3125}$, $\mathrm{P}(X = 5) = p$, $\mathrm{P}(X = 6) = \frac{544}{3125}$ and $\mathrm{P}(X = 7) = \frac{256}{3125}$. Find the expected value $\mathrm{E}X$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"prob","contract":{"kind":"exact"}},{"name":"expected","contract":{"kind":"exact"}}]}
            answer: 'prob = 48/125; expected = 15396/3125'
            solution_sketch: 'For (a), $\binom32 \cdot 0.8^2 \cdot 0.2 = \frac{48}{125}$. For (b), the probabilities sum to $1$, so $p = \frac{208}{625}$. Then $\mathrm{E}X = 4 \cdot \frac{1285}{3125} + 5 \cdot \frac{208}{625} + 6 \cdot \frac{544}{3125} + 7 \cdot \frac{256}{3125} = \frac{15396}{3125}$.'
            points: 4
          # source: VBE 2025 repeat A II task 17(b,c)
          - problem: 'A regular quadrilateral pyramid $SABCD$ has the lateral edge $5$. Let $x$ be the side of the base $ABCD$, where $x \in (0; 5\sqrt{2})$. The volume of the pyramid is $V(x) = \frac13 \cdot x^2 \cdot \sqrt{25 - \frac{x^2}{2}}$. (a) Find the value of $x$ for which the volume is the largest. (b) Now the side of the base equals $4$. The angle between the lateral edge and the plane of the base equals $\alpha$. Find $\cos\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}}]}
            answer: 'x = 10*sqrt(3)/3; cos = 2*sqrt(2)/5'
            solution_sketch: 'For (a), write $V = \frac13\sqrt{25x^4 - \frac{x^6}{2}}$. The derivative is zero when $100x^3 - 3x^5 = 0$, so $x = \frac{10\sqrt{3}}{3}$. For (b), half of the diagonal of the base is $OC = 2\sqrt{2}$. Then $\cos\alpha = \frac{OC}{SC} = \frac{2\sqrt{2}}{5}$.'
            points: 5
          # source: VBE 2025 repeat A II task 18
          - problem: 'Find the sum of the infinite decreasing geometric progression $\frac{1}{\log_{\sqrt{a}} b}$; $\frac{1}{\log_{\sqrt[8]{a}} b}$; $\frac{1}{\log_{\sqrt[32]{a}} b}$; $\dots$, where $a > 0$, $a \ne 1$, $b > 0$, $b \ne 1$ and $\log_b a = 2025$.'
            answer_contract: {"kind":"exact"}
            answer: '1350'
            solution_sketch: 'Change the bases: the terms are $\frac12\log_b a$, $\frac18\log_b a$, $\frac1{32}\log_b a$ and so on. The ratio is $q = \frac14$. The sum is $\log_b a \cdot \frac{1/2}{1 - 1/4} = 2025 \cdot \frac23 = 1350$.'
            points: 4
          # source: VBE 2025 repeat A II task 19
          - problem: 'Robots of the same kind clean a city square after a concert. If all the robots started at the same time and each robot worked without a break, they would clean the square in $12$ hours. But the robots did not start at the same time. The first robot started first. Then the other robots joined it one by one at equal time intervals. All robots worked without a break until the whole square was clean. The first robot worked $5$ times longer than the last robot. Find in hours how long the cleaning of the square took.'
            answer_contract: {"kind":"exact"}
            answer: '20'
            solution_sketch: 'Let $n$ be the number of robots and $x$ the time of one robot for the whole square. Then $\frac{12n}{x} = 1$. The working times form an arithmetic progression with the sum $\frac{t_1 + t_n}{2} \cdot n = 3t_n n$, and it equals $x = 12n$. So $t_n = 4$ and $t_1 = 5 \cdot 4 = 20$ hours.'
            points: 5
          # source: VBE 2025 repeat A II task 11
          - problem: 'Show that the value of the expression $\cos^2(\beta) - \sin^2(\beta) - \cos(-2\beta)$ is an integer for every value of the angle $\beta$.'
            answer_contract: {"kind":"written"}
            answer: 'Apply the double angle formula and the parity of the cosine. The expression equals $\cos 2\beta - \cos 2\beta = 0$, and $0$ is an integer.'
            solution_sketch: 'Official scheme, 2 points. 1 point: a correct use of the double angle formula or of the formula $\cos(-x) = \cos x$. 1 point: a correct conclusion that the value is $0 \in \mathbb{Z}$.'
            points: 2
          # source: VBE 2025 repeat A II task 14(b)
          - problem: 'The graph of the function $y = f(x) = 5 - e^x$ crosses the $y$-axis at the point $B$. Show that the tangent to this graph at the point $B$ has the equation $y = -x + 4$.'
            answer_contract: {"kind":"written"}
            answer: 'The slope is $f''(0) = -e^0 = -1$ and $B = (0; 4)$. So the tangent is $y = -x + 4$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the correct slope $k = f''(0) = -1$. 1 point: a correct reason that the constant term is $4$, with the point $B(0; 4)$.'
            points: 2
          # source: VBE 2025 repeat A II task 14(c)
          - problem: 'The graph of the function $y = f(x) = 5 - e^x$ crosses the $x$-axis at the point $A$. Show that the abscissa of the point $A$ equals $x = \ln 5$.'
            answer_contract: {"kind":"written"}
            answer: 'Solve $5 - e^x = 0$ to get $e^x = 5$ and $x = \ln 5$. Or check that $f(\ln 5) = 5 - 5 = 0$.'
            solution_sketch: 'Official scheme, 1 point. 1 point: a correct reason, by the equation $5 - e^x = 0$ or by the check $f(\ln 5) = 0$.'
            points: 1
          # source: VBE 2025 repeat A II task 16(b)
          - problem: 'Two teams, $A$ and $B$, meet in a basketball championship final. The team that wins $4$ games wins the championship. The winner is known after $4$ games at the earliest and after $7$ games at the latest. The probability that the team $B$ wins one game against the team $A$ is $0.8$. The random variable $X$ is the number of games that the final holds. Show that $\mathrm{P}(X = 6) = \frac{544}{3125}$.'
            answer_contract: {"kind":"written"}
            answer: 'The final lasts $6$ games when the winner wins exactly $4$ of the first $6$ games, and wins the sixth game. Add the cases for $B$ and for $A$: $\binom52 \cdot 0.2^2 \cdot 0.8^4 + \binom52 \cdot 0.8^2 \cdot 0.2^4 = \frac{512}{3125} + \frac{32}{3125} = \frac{544}{3125}$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the count $\binom52$ of the orders of the wins, or the product $0.2^2 \cdot 0.8^4$. 2 points: the probabilities $\mathrm{P}(D) = \frac{512}{3125}$ and $\mathrm{P}(E) = \frac{32}{3125}$, one for each case. Then 1 point: the correct sum $\frac{544}{3125}$.'
            points: 3
          # source: VBE 2025 repeat A II task 17(a)
          - problem: 'A regular quadrilateral pyramid $SABCD$ has the lateral edge $5$. Let $x$ be the side of the base $ABCD$, where $x \in (0; 5\sqrt{2})$. Show that the volume of the pyramid is $V(x) = \frac13 \cdot x^2 \cdot \sqrt{25 - \frac{x^2}{2}}$.'
            answer_contract: {"kind":"written"}
            answer: 'The half diagonal of the base is $OC = \frac{x\sqrt{2}}{2}$. The height is $SO = \sqrt{25 - \frac{x^2}{2}}$. So $V = \frac13 x^2 \cdot SO$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the half diagonal of the base through the side $x$. 1 point: the height of the pyramid through $x$. 1 point: the volume $V(x) = \frac13 x^2\sqrt{25 - \frac{x^2}{2}}$, which equals $\frac13\sqrt{25x^4 - \frac{x^6}{2}}$.'
            points: 3
          # source: VBE 2025 repeat A II task 17(d)
          - problem: 'A regular quadrilateral pyramid $SABCD$ has the lateral edge $5$ and the side of the base $4$. The point $O$ is the center of the base, where the diagonals meet. The point $E$ is the midpoint of the edge $SC$. (a) Prove that $BD \perp OE$. (b) Prove that $OE$ is a midline of the triangle $ASC$. (c) Find the tangent of the angle between the skew lines $AS$ and $ED$.'
            answer_contract: {"kind":"written"}
            answer: '(a) The triangle $BED$ is isosceles and $OE$ is its median, so $OE \perp BD$. (b) $O$ and $E$ are the midpoints of $AC$ and $SC$. (c) $OE \parallel AS$ and $OE = 2.5$. So $\tan\angle OED = \frac{OD}{OE} = \frac{2\sqrt{2}}{2.5} = \frac{4\sqrt{2}}{5}$.'
            solution_sketch: 'Official scheme, 3 points, 1 point for each of (a), (b) and (c). (a): the triangle $BED$ is isosceles, or the theorem of three perpendiculars. (b): $O$ and $E$ are midpoints of two sides. (c): $\tan\angle OED = \frac{4\sqrt{2}}{5}$.'
            points: 3
        constraints: 'The open tasks 11 to 19 of the official paper; decidable items in paper order, then the written items; task 13(b) asks for the solutions in the interval from -pi/2 to pi/2 only; the figures are described in words.'
    diagnostic_exemplar:
      # source: VBE 2025 repeat A II task 5
      problem: 'A code has five digits. The first digit is odd and the last digit equals $2$. Find how many different codes exist. Digits may repeat.'
      answer_contract: {"kind":"exact"}
      answer: '5000'
      solution_sketch: 'The first digit has 5 choices. Each of the 3 middle digits has 10 choices. The last digit has 1 choice. The product is $5 \cdot 10^3 = 5000$.'
