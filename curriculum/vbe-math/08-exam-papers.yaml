          # source: VBE 2024 repeat task 23
          - problem: 'Four finalists take part in a talent contest. Five judges give places independently of each other. Each judge gives the places I, II, III and IV to the four finalists, a different place to each finalist, at random. The event $L$ is: every finalist gets the same place from all five judges. Find the probability of the event $L$.'
            answer_contract: {"kind":"exact"}
            answer: '1/331776'
            solution_sketch: 'One judge has $4! = 24$ ways to give the places. The five judges have $n = 24^5$ ways together. The event $L$ happens if the five judges give the same order, in $m = 24$ ways. So $\mathrm{P}(L) = \frac{24}{24^5} = \frac{1}{24^4} = \frac{1}{331776}$.'
