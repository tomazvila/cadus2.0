        exemplars:
          # source: VBE 2023 main task 12
          - problem: 'The triangle $ABC$ is equilateral. The points $A$, $B$ and $C$ lie on a circle with the center $O$. (a) Find the angle $AOB$, in degrees. (b) The radius of the circle equals $2\sqrt{3}$. Find the side length of the triangle $ABC$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"angle","contract":{"kind":"exact"}},{"name":"side","contract":{"kind":"exact"}}]}
            answer: 'angle = 120; side = 6'
            solution_sketch: 'The central angle on a side of the equilateral triangle is $360 / 3 = 120$ degrees. The side equals $R\sqrt{3} = 2\sqrt{3} \cdot \sqrt{3} = 6$.'
            points: 2
          # source: VBE 2023 main task 13
          - problem: 'The $n$-th term of an arithmetic progression is $a_n = 21 - 3n$. (a) Find the first term of this progression. (b) It is known that $a_k = -36$. Find the value of $k$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"exact"}},{"name":"k","contract":{"kind":"exact"}}]}
            answer: 'first = 18; k = 19'
            solution_sketch: 'We get $a_1 = 21 - 3 = 18$. From $21 - 3k = -36$ we get $3k = 57$, so $k = 19$.'
            points: 2
          # source: VBE 2023 main task 14
          - problem: 'Solve the equations. (a) $3^{1 - x} = 27$. (b) $\tan(3x) = 1$. Write the answer with an integer $k$. (c) $e^{x^2} = 2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"exact"}},{"name":"second","contract":{"kind":"function","vars":["k"]}},{"name":"third","contract":{"kind":"set"}}]}
            answer: 'first = -2; second = pi/12+pi*k/3; third = {-sqrt(ln(2)), sqrt(ln(2))}'
            solution_sketch: '(a) We get $1 - x = 3$, so $x = -2$. (b) We get $3x = \frac{\pi}{4} + \pi k$, so $x = \frac{\pi}{12} + \frac{\pi k}{3}$. (c) We get $x^2 = \ln 2$, so $x = \pm\sqrt{\ln 2}$.'
            points: 3
          # source: VBE 2023 main task 19
          - problem: 'A new phone costs 640 euros in a shop. The value of the phone (in euros) falls by 30 % after one year. Then each year the value falls by 15 % of the value of the last year. Find the value of the phone in euros after three years.'
            answer_contract: {"kind":"exact"}
            answer: '323.68'
            solution_sketch: 'The value after three years is $640 \cdot 0.7 \cdot 0.85 \cdot 0.85$. This equals $323.68$.'
            points: 2
          # source: VBE 2023 main task 20
          - problem: 'Given is the expression $\log_{0.3}(2 - 3x) - \log_{0.3}(x + 4)$. (a) Find the domain of this expression. (b) Solve the inequality $\log_{0.3}(2 - 3x) \ge \log_{0.3}(x + 4)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"domain","contract":{"kind":"inequality_union"}},{"name":"solution","contract":{"kind":"inequality_union"}}]}
            answer: 'domain = -4 < x < 2/3; solution = -1/2 <= x < 2/3'
            solution_sketch: '(a) We need $2 - 3x > 0$ and $x + 4 > 0$. So $-4 < x < \frac23$. (b) The base $0.3$ is less than $1$, so the sign turns: $2 - 3x \le x + 4$. Then $x \ge -\frac12$. With the domain we get $-\frac12 \le x < \frac23$.'
            points: 5
          # source: VBE 2023 main task 21
          - problem: 'Given is the function $f(x) = -x^3 + 3x^2 + 9x + 4$. (a) Find the derivative $f''(x)$. (b) Find the values of $x$ for which the function $f$ decreases. (c) Consider the part of the graph of $f$ for $x \ge 0$ and the tangent line to the graph at the point with abscissa $3$. Find the area of the region that the graph, this tangent line and the $y$-axis bound.'
            answer_contract: {"kind":"multipart","parts":[{"name":"derivative","contract":{"kind":"function","vars":["x"]}},{"name":"decrease","contract":{"kind":"inequality_union"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'derivative = -3*x^2+6*x+9; decrease = x < -1 or x > 3; area = 135/4'
            solution_sketch: '(a) We get $f''(x) = -3x^2 + 6x + 9$. (b) The equation $f''(x) = 0$ has the roots $-1$ and $3$, and $f'' < 0$ for $x < -1$ or $x > 3$. (c) We have $f''(3) = 0$ and $f(3) = 31$, so the tangent line is $y = 31$. The area is $\int_0^3 (31 - f(x))\,dx = \frac{135}{4}$.'
            points: 8
          # source: VBE 2023 main task 22(b)
          - problem: 'The right trapezoid $ABCD$ has $AB \parallel CD$ and $\angle BCD = 90^\circ$. It is known that $AB = 25$, $BC = 12$, $CD = 16$ and $DA = 15$. Find the scalar product of the vectors $\vec{AB}$ and $\vec{AD}$.'
            answer_contract: {"kind":"exact"}
            answer: '225'
            solution_sketch: 'Drop the height $DH$ from $D$ to $AB$. Then $AH = \sqrt{15^2 - 12^2} = 9$ and $\cos \angle DAB = \frac{9}{15} = \frac35$. The scalar product is $25 \cdot 15 \cdot \frac35 = 225$.'
            points: 3
          # source: VBE 2023 main task 23(b)
          - problem: 'A right prism has a base that is an equilateral triangle with the side $x$, and its volume equals $54$. Its total surface area is $S(x) = \frac{\sqrt{3}}{2}x^2 + \frac{216\sqrt{3}}{x}$, where $x > 0$. Solve the equation $S''(x) = 0$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'We get $S''(x) = \sqrt{3}x - \frac{216\sqrt{3}}{x^2}$. The equation $S''(x) = 0$ gives $x^3 = 216$. So $x = 6$.'
            points: 2
          # source: VBE 2023 main task 24(b)
          - problem: 'Three friends take a driving exam. The random variable $X$ is the number of friends who pass the exam. It takes the values $0$, $1$, $2$ and $3$, with $\mathrm{P}(X = 0) = \frac{1}{60}$, $\mathrm{P}(X = 1) = p$, $\mathrm{P}(X = 2) = \frac{13}{30}$ and $\mathrm{P}(X = 3) = \frac25$. Find the expected value $\mathrm{E}(X)$.'
            answer_contract: {"kind":"exact"}
            answer: '133/60'
            solution_sketch: 'The probabilities sum to $1$, so $p = 1 - \frac{1}{60} - \frac{13}{30} - \frac25 = \frac{3}{20}$. Then $\mathrm{E}(X) = \frac{3}{20} + 2 \cdot \frac{13}{30} + 3 \cdot \frac25$. This equals $\frac{133}{60}$.'
            points: 2
          # source: VBE 2023 main task 25
          - problem: 'The triangle $ABC$ is obtuse. It is known that $\angle BAC - \angle ABC = 90^\circ$ and $AC : BC = 3 : 4$. Find $\tan \angle BAC$.'
            answer_contract: {"kind":"exact"}
            answer: '-4/3'
            solution_sketch: 'Let $AC = 3x$ and $BC = 4x$. The law of sines gives $\frac{4x}{\sin A} = \frac{3x}{\sin B}$. Since $B = A - 90^\circ$, we have $\sin B = -\cos A$. So $4(-\cos A) = 3 \sin A$ and $\tan A = -\frac43$.'
            points: 3
          # source: VBE 2023 main task 26
          - problem: 'The first three terms of an increasing geometric progression are natural numbers. The third term equals $90\,\%$ of the sum of the first two terms. The difference of the third term and the first term is at most $19$. Find the greatest possible value of the third term.'
            answer_contract: {"kind":"exact"}
            answer: '27'
            solution_sketch: 'Let the first term be $b_1$ and the ratio be $q$. The condition gives $q^2 = 0.9 + 0.9q$, so $q = 1.5$. Then $b_1 \cdot 1.25 \le 19$ gives $b_1 \le 15.2$. The terms are natural for $b_1$ a multiple of $4$, so $b_1 = 12$ is the greatest. The third term is $12 \cdot 2.25 = 27$.'
            points: 4
          # source: VBE 2023 main task 22(a)
          - problem: 'The right trapezoid $ABCD$ has $AB \parallel CD$ and $\angle BCD = 90^\circ$. It is known that $AB = 25$, $BC = 12$, $CD = 16$ and $DA = 15$. Find the length of the diagonal $BD$. Then show that the triangles $ABD$ and $BDC$ are similar.'
            answer_contract: {"kind":"written"}
            answer: 'By the Pythagorean theorem, $BD = 20$. The sides satisfy $\frac{AB}{BD} = \frac{BD}{DC} = \frac{AD}{BC} = \frac54$, so the triangles are similar.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the length $BD = \sqrt{16^2 + 12^2} = 20$. 1 point: a correct proof of the similarity. The three sides, or two sides with the angle between them, or two angles all give the proof.'
            points: 2
          # source: VBE 2023 main task 23(a)
          - problem: 'A right prism has a base that is an equilateral triangle with the side $x$. The height of the prism is $h$ and its volume equals $54$. Express $h$ with $x$. Then show that the total surface area of the prism is $S(x) = \frac{\sqrt{3}}{2}x^2 + \frac{216\sqrt{3}}{x}$, where $x > 0$.'
            answer_contract: {"kind":"written"}
            answer: 'From $\frac{\sqrt{3}}{4}x^2 h = 54$ we get $h = \frac{216}{\sqrt{3}x^2}$. Then $S = 2 \cdot \frac{\sqrt{3}}{4}x^2 + 3xh = \frac{\sqrt{3}}{2}x^2 + \frac{216\sqrt{3}}{x}$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: $h$ expressed with $x$. 1 point: the correct expression for the total surface area, the two bases and the lateral surface. 1 point: a correct step to the stated formula.'
            points: 3
          # source: VBE 2023 main task 23(c)
          - problem: 'The total surface area of a right prism with an equilateral triangle base is $S(x) = \frac{\sqrt{3}}{2}x^2 + \frac{216\sqrt{3}}{x}$, where $x > 0$ is the side of the base. Show that $S(x) \ge 54\sqrt{3}$ for every $x > 0$.'
            answer_contract: {"kind":"written"}
            answer: 'The derivative is zero only at $x = 6$. It is negative before $6$ and positive after $6$, so $S(6) = 54\sqrt{3}$ is the least value.'
            solution_sketch: 'Official scheme, 2 points. 1 point: a correct proof that $x = 6$ is the minimum point. 1 point: the least value $S(6) = 18\sqrt{3} + 36\sqrt{3} = 54\sqrt{3}$ and the conclusion $S(x) \ge 54\sqrt{3}$.'
            points: 2
          # source: VBE 2023 main task 24(a)
          - problem: 'Three friends take a driving exam. The independent events are $G$ (the first friend passes), $T$ (the second friend passes) and $M$ (the third friend passes), with $\mathrm{P}(G) = \frac34$, $\mathrm{P}(T) = \frac45$ and $\mathrm{P}(M) = \frac23$. The random variable $X$ is the number of friends who pass. Show that $\mathrm{P}(X = 2) = \frac{13}{30}$.'
            answer_contract: {"kind":"written"}
            answer: 'Exactly two friends pass in three cases: $G \cap T \cap \overline{M}$, $G \cap \overline{T} \cap M$ and $\overline{G} \cap T \cap M$. The events are independent, so $\mathrm{P}(X = 2) = \frac34 \cdot \frac45 \cdot \frac13 + \frac34 \cdot \frac15 \cdot \frac23 + \frac14 \cdot \frac45 \cdot \frac23 = \frac{13}{30}$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the three outcomes for $X = 2$, or the probability of at least one outcome. 1 point: a correct proof, with the independence of the events and the sum $\frac{13}{30}$.'
            points: 2
        constraints: 'The open tasks 12 to 14 and 19 to 26 of the official paper; decidable items in paper order, then the written items; the figures of tasks 12, 21, 22, 23 and 25 stand in the words of the problems.'
    diagnostic_exemplar:
