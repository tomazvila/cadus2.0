        exemplars:
          # source: VBE 2022 repeat task 1
          - problem: 'The graph of the function $y = (x + 3)^3$ has one point where the tangent line is horizontal. Find the coordinates of this point.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-3, 0)'
            solution_sketch: 'The derivative is $y'' = 3(x + 3)^2$. It equals $0$ only for $x = -3$. Then $y = 0$. The point is $(-3; 0)$.'
            points: 1
          # source: VBE 2022 repeat task 2
          - problem: 'The first term of an arithmetic progression is $a_1 = 10$. Its common difference is $d = -3$. Find the fifth term of this progression.'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            solution_sketch: 'We have $a_5 = a_1 + 4d = 10 - 12 = -2$.'
            points: 1
          # source: VBE 2022 repeat task 3
          - problem: 'It is known that $\log_2 a = 4$. Find the value of $\log_2(8a)$.'
            answer_contract: {"kind":"exact"}
            answer: '7'
            solution_sketch: 'We have $\log_2(8a) = \log_2 8 + \log_2 a = 3 + 4 = 7$.'
            points: 1
          # source: VBE 2022 repeat task 4
          - problem: 'Find the largest of the numbers $2^{600}$, $3^{400}$, $4^{200}$ and $25^{100}$. Write it as a power with the same base and exponent as in the list.'
            answer_contract: {"kind":"exact"}
            answer: '3^400'
            solution_sketch: 'Write each number as a power with exponent $100$. We get $64^{100}$, $81^{100}$, $16^{100}$ and $25^{100}$. The largest base is $81$, so the largest number is $3^{400}$.'
            points: 1
          # source: VBE 2022 repeat task 5
          - problem: 'A circle is inscribed in the quadrilateral $ABCD$. The sides have the lengths $AB = 12$, $BC = x + 1$, $CD = 11$ and $DA = 2x - 5$. Find the value of $x$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'In a quadrilateral with an inscribed circle, the sums of the opposite sides are equal. So $AB + CD = BC + DA$, and $12 + 11 = x + 1 + 2x - 5$. Then $3x = 27$ and $x = 9$.'
            points: 1
          # source: VBE 2022 repeat task 6
          - problem: 'Some students of a class attended mathematics consultations and the other students did not. The mean grade of the students who attended is $8.2$. The mean grade of the students who did not attend is $7$. The ratio of the number of students who attended to the number of students who did not attend is $1 : 4$. Find the mean grade of all students of this class.'
            answer_contract: {"kind":"exact"}
            answer: '7.24'
            solution_sketch: 'Take $1$ part and $4$ parts. The mean is $\frac{8.2 \cdot 1 + 7 \cdot 4}{5} = \frac{36.2}{5} = 7.24$.'
            points: 1
          # source: VBE 2022 repeat task 7
          - problem: 'The events $A$ and $B$ are independent. It is known that $\mathrm{P}(A) = 0.7$ and $\mathrm{P}(B) = 0.8$. Find the probability that at least one of the events $A$ and $B$ happens.'
            answer_contract: {"kind":"exact"}
            answer: '0.94'
            solution_sketch: 'The probability that neither event happens is $0.3 \cdot 0.2 = 0.06$. So the answer is $1 - 0.06 = 0.94$.'
            points: 1
          # source: VBE 2022 repeat task 8
          - problem: 'Find the derivative $f''(x)$ of the function $f(x) = \cos^2 x$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '-sin(2*x)'
            solution_sketch: 'Use the chain rule. We get $f''(x) = 2\cos x \cdot (-\sin x) = -\sin 2x$.'
            points: 1
          # source: VBE 2022 repeat task 9
          - problem: '$ABCDA_1B_1C_1D_1$ is a rectangular cuboid with $AD = 16$, $CD = 5$ and $CC_1 = 12$. Find the cosine of the angle between the lines $A_1D$ and $B_1C_1$.'
            answer_contract: {"kind":"exact"}
            answer: '4/5'
            solution_sketch: 'The line $B_1C_1$ is parallel to $A_1D_1$. So the angle is $\angle DA_1D_1$ in the right triangle $A_1D_1D$, where $A_1D_1 = 16$ and $DD_1 = 12$. Then $A_1D = 20$ and the cosine is $\frac{16}{20} = \frac45$.'
            points: 1
          # source: VBE 2022 repeat task 10
          - problem: 'The function $f(x)$ and its derivative $f''(x)$ are defined for all real $x$. It is known that $f''(x) > 0$ for $x \in (-\infty; -2)$ and for $x \in (3; +\infty)$. Also $f''(x) < 0$ for $x \in (-2; 3)$. The points $x = -2$ and $x = 3$ are extremum points of $f(x)$. Find how many of the four inequalities $f(-2) > f(-4)$, $f(-2) > f(3)$, $f(-1) > f(1)$ and $f(3) > f(4)$ are true.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'The function grows on $(-\infty; -2)$, falls on $(-2; 3)$ and grows on $(3; +\infty)$. So the first three inequalities are true. The fourth is false, because $f(3) < f(4)$. Three are true.'
            points: 1
          # source: VBE 2022 repeat task 12
          - problem: 'Solve the inequality $\frac{x - 2}{x + 3} \le 0$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-3 < x <= 2'
            solution_sketch: 'The fraction changes sign at $x = 2$ and at $x = -3$. It is negative or zero between them, and the value $x = -3$ is excluded. So $-3 < x \le 2$.'
            points: 1
          # source: VBE 2022 repeat task 13
          - problem: 'A sample has a frequency table. The values of the sample are $a$, $b$ and $c$ with $0 < a < b < c$. Their frequencies are $d$, $2$ and $e$, where $d \ne 0$ and $e \ne 0$. The sample has exactly two modes, $3$ and $5$. The median of the sample is $4$. The sample has fewer than $10$ data. Find the number of data in the sample.'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'The modes are $a = 3$ and $c = 5$ with $d = e = k$. The frequency $2$ is smaller than $k$, so $k \ge 3$. The number of data is $2k + 2 < 10$, so $k = 3$. The sample has $8$ data.'
            points: 1
          # source: VBE 2022 repeat task 15
          - problem: 'A sample has the values $1$, $2$, $3$, $4$ and $5$. Their relative frequencies are $\frac13$, $\frac14$, $\frac15$, $\frac16$ and $\frac1{20}$. Find the smallest possible number of data in this sample.'
            answer_contract: {"kind":"exact"}
            answer: '60'
            solution_sketch: 'The number of data is a multiple of $3$, $4$, $5$, $6$ and $20$. The least common multiple is $60$. The sum of the frequencies is $1$, so $60$ is possible.'
            points: 1
          # source: VBE 2022 repeat task 17
          - problem: 'A random variable $X$ takes the values $-1$ and $1$. The probability $\mathrm{P}(X = -1)$ equals $p$ and the probability $\mathrm{P}(X = 1)$ equals $q$. The expected value is $\mathrm{E}(X) = 0.8$. Find $\mathrm{P}(X = 1)$.'
            answer_contract: {"kind":"exact"}
            answer: '9/10'
            solution_sketch: 'We have $p + q = 1$ and $-p + q = 0.8$. Add the equations. We get $2q = 1.8$, so $q = 0.9$.'
            points: 1
          # source: VBE 2022 repeat task 18
          - problem: 'Simplify the expression $3|x - y| - 2|y - x|$ for $0 < x < y$.'
            answer_contract: {"kind":"function","vars":["x","y"]}
            answer: 'y-x'
            solution_sketch: 'Here $x - y < 0$, so $|x - y| = y - x$. Also $|y - x| = y - x$. We get $3(y - x) - 2(y - x) = y - x$.'
            points: 1
          # source: VBE 2022 repeat task 19
          - problem: 'It is known that $\tan x = 4$. Find the value of $\frac{\sin x - 3\cos x}{2\sin x + \cos x}$.'
            answer_contract: {"kind":"exact"}
            answer: '1/9'
            solution_sketch: 'Divide the top and the bottom by $\cos x$. We get $\frac{\tan x - 3}{2\tan x + 1} = \frac{4 - 3}{8 + 1} = \frac19$.'
            points: 1
          # source: VBE 2022 repeat task 20
          - problem: 'The function $f(x) = ax^3 + bx^2 + ax$ has $a \ne 0$. It is an odd function and $b - a = 1$. Find $f(1)$.'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            solution_sketch: 'An odd function has $b = 0$. So $a = -1$. Then $f(1) = 2a = -2$.'
            points: 1
        constraints: 'Fifteen 1-point tasks of the official paper in paper order (tasks 1 to 20 without 11); task 11 is the diagnostic exemplar; the choice tasks of part I became typed answers with the same mathematics; the figure of task 5 stands in words.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp14-plane-vectors, vbe-cp11-equations, vbe-cp09-elementary-functions, vbe-cp18-derivative-rules, vbe-cp19-function-study, vbe-cp20-integral, vbe-cp16-trig-equations, vbe-cp25-probability-models, vbe-cp24-combinatorics, vbe-cp05-logarithms]
        exemplars:
          # source: VBE 2022 repeat task 14
          - problem: 'The point $O$ is the center of a circle. The points $A$, $B$ and $C$ are on the circle, and $C$ is on the shorter arc $AB$. The lines $DA$ and $DB$ are tangents to the circle. The angle $AOB$ that opens on the side of $O$ away from the point $C$ equals 280°. (a) Find the measure of the angle $ACB$. (b) Find the measure of the angle $ADB$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"acb","contract":{"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}},{"name":"adb","contract":{"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}}]}
            answer: 'acb = 140°; adb = 100°'
            solution_sketch: 'The other angle $AOB$ is $360^\circ - 280^\circ = 80^\circ$. (a) The inscribed angle $ACB$ rests on the arc of $280^\circ$, so it equals $140^\circ$. (b) The radii $OA$ and $OB$ are perpendicular to the tangents. So $\angle ADB = 360^\circ - 90^\circ - 90^\circ - 80^\circ = 100^\circ$.'
            points: 2
          # source: VBE 2022 repeat task 16
          - problem: 'Two vectors are given: $\vec{a} = (2; -3; 6)$ and $\vec{b} = (-3; 2; m)$. (a) Find the length $|\vec{a}|$. (b) Find the value of $m$ for which the vectors $\vec{a}$ and $\vec{b}$ are perpendicular.'
            answer_contract: {"kind":"multipart","parts":[{"name":"length","contract":{"kind":"exact"}},{"name":"m","contract":{"kind":"exact"}}]}
            answer: 'length = 7; m = 2'
            solution_sketch: 'We have $|\vec{a}| = \sqrt{4 + 9 + 36} = 7$. The scalar product is $-6 - 6 + 6m = 0$, so $m = 2$.'
            points: 2
          # source: VBE 2022 repeat task 21
          - problem: 'Peter borrowed a sum of money from a bank. After three years he must return the borrowed sum and the interest. The annual interest rate of the loan is $4\%$, and the interest is computed every year. Peter must return $16872.96$ euros in all after three years. Find the sum of money that Peter borrowed, in euros.'
            answer_contract: {"kind":"exact"}
            answer: '15000'
            solution_sketch: 'Let $S$ be the borrowed sum. Then $S \cdot 1.04^3 = 16872.96$. So $S = \frac{16872.96}{1.124864} = 15000$.'
            points: 2
          # source: VBE 2022 repeat task 22
          - problem: 'The lateral surface of a cone, laid flat, is a circular sector with radius $10$. The base of the cone is a circle with radius $6$. (a) Find the total surface area of the cone. Give the answer with $\pi$. (b) Find the volume of the cone. Give the answer with $\pi$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"surface","contract":{"kind":"exact"}},{"name":"volume","contract":{"kind":"exact"}}]}
            answer: 'surface = 96*pi; volume = 96*pi'
            solution_sketch: '(a) The radius of the sector is the slant height $l = 10$. The lateral area is $\pi \cdot 6 \cdot 10 = 60\pi$. The base area is $36\pi$. The total is $96\pi$. (b) The height is $\sqrt{10^2 - 6^2} = 8$. The volume is $\frac13 \cdot 36\pi \cdot 8 = 96\pi$.'
            points: 4
          # source: VBE 2022 repeat task 23
          - problem: 'The function $f(x) = 2^{1 - 3x^2}$ and the function $g(x) = \log_2 x$ are given. (a) Find $f(-1)$. (b) Find $f''(1)$. (c) Find the range of the function $g(f(x))$. Write the range as an inequality for $y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"value","contract":{"kind":"exact"}},{"name":"slope","contract":{"kind":"exact"}},{"name":"range","contract":{"kind":"inequality_union"}}]}
            answer: 'value = 1/4; slope = -3*ln(2)/2; range = y <= 1'
            solution_sketch: '(a) We get $f(-1) = 2^{-2} = \frac14$. (b) We have $f''(x) = 2^{1 - 3x^2} \cdot \ln 2 \cdot (-6x)$, so $f''(1) = \frac14 \cdot \ln 2 \cdot (-6) = -\frac32 \ln 2$. (c) We have $g(f(x)) = 1 - 3x^2 \le 1$, and every value up to $1$ occurs.'
            points: 5
          # source: VBE 2022 repeat task 24(a,d)
          - problem: 'The function $f(x) = -x^2 + 2x + 3$ is given. (a) The graph of $y = f(x)$ meets the $x$-axis at the points $C$ and $D$. Find the abscissas of $C$ and $D$. (b) The line $y = -2x + 7$ meets the coordinate axes at the points $A$ and $B$. Find the area of the triangle $ABO$, where $O$ is the origin.'
            answer_contract: {"kind":"multipart","parts":[{"name":"abscissas","contract":{"kind":"set"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'abscissas = {-1, 3}; area = 49/4'
            solution_sketch: '(a) Solve $-x^2 + 2x + 3 = 0$ to get $x = -1$ and $x = 3$. (b) The line meets the axes at $A(0; 7)$ and $B(3.5; 0)$. The area is $\frac12 \cdot 7 \cdot 3.5 = \frac{49}{4}$.'
            points: 3
          # source: VBE 2022 repeat task 25
          - problem: 'Solve the equations. (a) $\log_2(2 - 3x) = 4$. (b) $4\cos^2 x - 8\cos x + 3 = 0$. For the second equation, give only the solutions in the interval $[0; 2\pi]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"angles","contract":{"kind":"set"}}]}
            answer: 'x = -14/3; angles = {pi/3, 5*pi/3}'
            solution_sketch: '(a) We get $2 - 3x = 16$, so $x = -\frac{14}{3}$. (b) Put $m = \cos x$. Then $4m^2 - 8m + 3 = 0$ and $m = \frac12$ or $m = \frac32$. The value $\frac32$ gives no solution. So $\cos x = \frac12$ and $x = \frac{\pi}{3}$ or $x = \frac{5\pi}{3}$.'
            points: 5
          # source: VBE 2022 repeat task 26(b)
          - problem: 'The triangle $ABC$ has sides $BC = a$, $CA = b$ and $AB = c$. The angle $B$ equals $120^\circ$. The sides satisfy $b^2 = 2a^2 + c^2$. Find the scalar product $\vec{AB} \cdot \vec{CA}$ for $a = 3$.'
            answer_contract: {"kind":"exact"}
            answer: '-27/2'
            solution_sketch: 'The cosine rule gives $b^2 = a^2 + c^2 + ac$. So $ac = a^2$ and $c = a = 3$. Then $b^2 = 27$ and $b = 3\sqrt{3}$. The angle $A$ is $30^\circ$, so the vectors form $150^\circ$. The product is $3 \cdot 3\sqrt{3} \cdot \cos 150^\circ = -\frac{27}{2}$.'
            points: 2
          # source: VBE 2022 repeat task 27
          - problem: 'Three standard six-sided dice of different colors are thrown: a yellow die, a green die and a red die. The event $A$ is: all three dice show the same number of spots. The event $B$ is: two of the three dice show the same number of spots and the remaining die shows a different number. (a) Find the number of outcomes that favor the event $A$. (b) Find the probability of the event $A$. (c) Find the probability of the event $B$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"count","contract":{"kind":"exact"}},{"name":"pa","contract":{"kind":"exact"}},{"name":"pb","contract":{"kind":"exact"}}]}
            answer: 'count = 6; pa = 1/36; pb = 5/12'
            solution_sketch: '(a) The favorable outcomes are $111, 222, \ldots, 666$. There are $6$. (b) The number of all outcomes is $216$, so $\mathrm{P}(A) = \frac{6}{216} = \frac1{36}$. (c) Pick the pair of dice in $3$ ways, the common number in $6$ ways and the other number in $5$ ways. So $\mathrm{P}(B) = \frac{90}{216} = \frac5{12}$.'
            points: 4
          # source: VBE 2022 repeat task 28
          - problem: 'Two cyclists leave the places $A$ and $B$ at the same time and ride toward each other. They meet after $t$ minutes. Each cyclist rides at a constant speed (in km/min). If the speed of the first cyclist were twice as large and the speed of the second cyclist stayed the same, they would meet $5$ minutes earlier. If the speed of the second cyclist were twice as large and the speed of the first cyclist stayed the same, they would meet $8$ minutes earlier. Find the value of $t$.'
            answer_contract: {"kind":"exact"}
            answer: '20'
            solution_sketch: 'Let $v_1$ and $v_2$ be the speeds. Then $(2v_1 + v_2)(t - 5) = (v_1 + v_2)t$ and $(v_1 + 2v_2)(t - 8) = (v_1 + v_2)t$. So $\frac{v_2}{v_1} = \frac{t - 10}{5}$ and $\frac{v_2}{v_1} = \frac{8}{t - 16}$. Then $t^2 - 26t + 120 = 0$. The root $t = 6$ is too small because $t > 8$, so $t = 20$.'
            points: 4
          # source: VBE 2022 repeat task 24(b)
          - problem: 'The function $f(x) = -x^2 + 2x + 3$ is given. Show that $f''(2) = -2$.'
            answer_contract: {"kind":"written"}
            answer: 'The derivative is $f''(x) = -2x + 2$. So $f''(2) = -4 + 2 = -2$.'
            solution_sketch: 'Official scheme, 1 point. 1 point: the correct derivative $f''(x) = -2x + 2$ and the value $f''(2) = -2$.'
            points: 1
          # source: VBE 2022 repeat task 24(c)
          - problem: 'The function $f(x) = -x^2 + 2x + 3$ is given. A tangent is drawn to the graph of $y = f(x)$ at the point $E$ with the abscissa $x_0 = 2$. Show that the equation of this tangent is $y = -2x + 7$.'
            answer_contract: {"kind":"written"}
            answer: 'We have $f(2) = 3$ and $f''(2) = -2$. The tangent is $y = -2(x - 2) + 3 = -2x + 7$.'
            solution_sketch: 'Official scheme, 1 point. 1 point: the value $f(2) = 3$ and the tangent equation $y = -2(x - 2) + 3 = -2x + 7$.'
            points: 1
          # source: VBE 2022 repeat task 24(e)
          - problem: 'The function $f(x) = -x^2 + 2x + 3$ is given. Let $S_1$ be the area of the region that the graph of $y = f(x)$ and the coordinate axes bound for $x \ge 0$. The line $y = -2x + 7$ and the coordinate axes bound the triangle $ABO$ with the area $S_{ABO}$. Show that the ratio $\frac{S_{ABO}}{S_1}$ is the square of a rational number.'
            answer_contract: {"kind":"written"}
            answer: 'We have $S_1 = \int_0^3 (-x^2 + 2x + 3)\,dx = 9$ and $S_{ABO} = \frac{49}{4}$. The ratio is $\frac{49}{36} = \left(\frac76\right)^2$.'
            solution_sketch: 'Official scheme, 4 points. 1 point: the integral expression for $S_1$. 1 point: the correct antiderivative. 1 point: the area $S_1 = 9$. 1 point: the ratio $\frac{49}{36} = \left(\frac76\right)^2$.'
            points: 4
          # source: VBE 2022 repeat task 26(a)
          - problem: 'The triangle $ABC$ has sides $BC = a$, $CA = b$ and $AB = c$. The angle $B$ equals $120^\circ$. The sides satisfy $b^2 = 2a^2 + c^2$. Prove that the triangle $ABC$ is isosceles.'
            answer_contract: {"kind":"written"}
            answer: 'The cosine rule gives $b^2 = a^2 + c^2 + ac$. So $a^2 + c^2 + ac = 2a^2 + c^2$ and $ac = a^2$. Then $a(c - a) = 0$ and $a \ne 0$, so $c = a$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the cosine rule for the triangle $ABC$. 1 point: the equality $ac = a^2$. 1 point: the argument $a(c - a) = 0$, $a \ne 0$, so $c = a$.'
            points: 3
        constraints: 'The open tasks 16 to 28 of the official paper; the figures of tasks 14 and 22 stand in words; decidable items in paper order, then the written items; task 25 second equation asks for the solutions in [0; 2*pi] instead of the general solution.'
    diagnostic_exemplar:
      # source: VBE 2022 repeat task 11
      problem: 'The sets $A = \{2, 3, 5, 7, 9, 11\}$ and $B = \{1, 3, 5, 7, 9, 10\}$ are given. Find the number of elements of the union $A \cup B$.'
      answer_contract: {"kind":"exact"}
      answer: '8'
      solution_sketch: 'The common elements are $3, 5, 7, 9$. So the union has $6 + 6 - 4 = 8$ elements.'
