          # source: VBE 2024 repeat task 22
          - problem: 'A region is bounded by the parabola $y = 9 - (x - 1)^2$ and by the axes $Ox$ and $Oy$, where $x \ge 0$. A line passes through the point where the parabola meets the $Ox$ axis for $x \ge 0$. This line divides the region into two regions with equal areas $S_1$ and $S_2$. Find the ordinate $y_0$ of the point where this line meets the $Oy$ axis.'
            answer_contract: {"kind":"exact"}
            answer: '20/3'
            solution_sketch: 'The parabola meets the $Ox$ axis at $x = 4$. The area of the figure is $S = \int_0^4 (8 + 2x - x^2)\,dx = \frac{80}{3}$. The line cuts off a triangle with legs $4$ and $y_0$, with area $2y_0$. So $2y_0 = \frac{S}{2} = \frac{40}{3}$ and $y_0 = \frac{20}{3}$.'
