        exemplars:
          # source: VBE 2023 main task 1
          - problem: 'Two sets are given: $A = \{-5, -1, 0, 2, 3, 5, 7\}$ and $B = \{-5, -2, 0, 1, 7, 9\}$. Find the number of elements of the union $A \cup B$.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'The set $A$ has 7 elements and the set $B$ has 6 elements. The common elements are $-5$, $0$ and $7$. The union has $7 + 6 - 3 = 10$ elements.'
            points: 1
          # source: VBE 2023 main task 2
          - problem: 'The graph of the function $y = 2^x$ meets the Oy axis at one point. For $x \to -\infty$ the graph comes close to a horizontal line $y = c$. (a) Find the ordinate of the point where the graph meets the Oy axis. (b) Find the number $c$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"yaxis","contract":{"kind":"exact"}},{"name":"asymptote","contract":{"kind":"exact"}}]}
            answer: 'yaxis = 1; asymptote = 0'
            solution_sketch: '(a) We have $2^0 = 1$, so the graph meets the Oy axis at $(0; 1)$. (b) For $x \to -\infty$ the value $2^x$ comes close to $0$, and stays above $0$. So $c = 0$.'
            points: 1
          # source: VBE 2023 main task 3
          - problem: 'Students of one class told how many hours per week they do sport. The results: 9 students do sport 2 hours, 5 students do sport 5 hours, 3 students do sport 7 hours and 1 student does sport 8 hours. Find the median of the sample of these times, in hours.'
            answer_contract: {"kind":"exact"}
            answer: '7/2'
            solution_sketch: 'There are 18 students. The median is the mean of the 9th and the 10th value in order. The 9th value is $2$ and the 10th value is $5$. So the median is $\frac{2 + 5}{2} = \frac72$.'
            points: 1
          # source: VBE 2023 main task 5
          - problem: 'The unit circle has its center at $O$. The point $M$ is on the circle. The angle from the positive Ox axis to the ray $OM$, measured counterclockwise, equals 150°. Find the coordinates of the point $M$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-sqrt(3)/2, 1/2)'
            visual: 0
            solution_sketch: 'We have $M = (\cos 150^\circ; \sin 150^\circ)$. Here $\cos 150^\circ = -\frac{\sqrt3}{2}$ and $\sin 150^\circ = \frac12$.'
            points: 1
          # source: VBE 2023 main task 6
          - problem: 'A game wheel is divided into three equal sectors. The sectors are marked with the numbers $1$, $2$ and $3$. The pointer of the wheel spins two times. Each time, the pointer stops at random in one sector, and we write the number of this sector. Find the probability that the sum of the two written numbers equals $5$.'
            answer_contract: {"kind":"exact"}
            answer: '2/9'
            solution_sketch: 'There are $3 \cdot 3 = 9$ equally likely pairs. The sum is $5$ for the pairs $(2, 3)$ and $(3, 2)$. So the probability is $\frac29$.'
            points: 1
          # source: VBE 2023 main task 7
          - problem: 'The functions are $f(x) = 2^x$, $g(x) = |x|$, $h(x) = x^3$ and $k(x) = \frac{1}{x^2 + 1}$. List the names of all even functions among them.'
            answer_contract: {"kind":"set"}
            answer: '{g, k}'
            solution_sketch: 'A function is even if $f(-x) = f(x)$ for all $x$. The functions $g$ and $k$ have this property. The function $h$ is odd, and $f(-1) \ne f(1)$.'
            points: 1
          # source: VBE 2023 main task 8
          - problem: 'The cube $ABCDA_1B_1C_1D_1$ has the edge length $1$. Find the angle between the line $D_1A$ and the line $AB$, in degrees.'
            answer_contract: {"kind":"exact"}
            answer: '90'
            solution_sketch: 'The line $AB$ is perpendicular to the plane $ADD_1A_1$. The line $D_1A$ lies in this plane. So the angle equals $90$ degrees.'
            points: 1
          # source: VBE 2023 main task 9
          - problem: 'The quadratic equation $x^2 - (p - 6)x + q = 0$ has two different real solutions $x = p$ and $x = q$. Both solutions are not zero. Find the value of $p + q$.'
            answer_contract: {"kind":"exact"}
            answer: '-5'
            solution_sketch: 'By Vieta''s formulas, $p + q = p - 6$, so $q = -6$. Also $pq = q$ and $q \ne 0$, so $p = 1$. Then $p + q = 1 - 6 = -5$.'
            points: 1
          # source: VBE 2023 main task 10
          - problem: 'The functions $f$ and $f''$ are defined for all real $x$. The graph of $y = f''(x)$ is a parabola. It meets the Ox axis at the points $(-1; 0)$ and $(4; 0)$, and it meets the Oy axis at the point $(0; -4)$. Find the number $x_0$ among $-1$, $0$, $2$ and $4$ for which the function $f$ takes its smallest value.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            visual: 1
            solution_sketch: 'The derivative is negative for $-1 < x < 4$, so $f$ decreases on this interval. The derivative is positive for $x > 4$. So $f(-1) > f(0) > f(2) > f(4)$, and the smallest value is $f(4)$.'
            points: 1
          # source: VBE 2023 main task 11
          - problem: 'In the triangle $ABC$ we know that $AC = 6$, $BC = 8$ and $\sin \angle ACB = \frac34$. Find the area of the triangle $ABC$.'
            answer_contract: {"kind":"exact"}
            answer: '18'
            solution_sketch: 'Use the area formula with two sides and the sine of the angle between them. The area is $\frac12 \cdot 6 \cdot 8 \cdot \frac34 = 18$.'
            points: 1
          # source: VBE 2023 main task 15
          - problem: 'A box holds red and white balls of the same size. One ball is drawn from the box at random. The probability that this ball is red equals $\frac25$. Find how many times the initial number of white balls is greater than the initial number of red balls.'
            answer_contract: {"kind":"exact"}
            answer: '3/2'
            solution_sketch: 'The probability of a white ball is $1 - \frac25 = \frac35$. The numbers of balls are in the ratio $3 : 2$. So the white balls are $\frac32$ times more.'
            points: 1
          # source: VBE 2023 main task 16
          - problem: 'The sound intensity level $D$ in decibels (dB) follows the formula $D = 10 \cdot \lg(I \cdot 10^{12})$, where $I$ is the sound intensity in W/m$^2$. A person hears the sound of an alarm clock at the level $70$ dB. Find the sound intensity $I$ of this alarm clock, in W/m$^2$.'
            answer_contract: {"kind":"exact"}
            answer: '1/100000'
            solution_sketch: 'We get $\lg(I \cdot 10^{12}) = 7$. So $I \cdot 10^{12} = 10^7$. Then $I = 10^{-5}$.'
            points: 1
          # source: VBE 2023 main task 17
          - problem: 'The Friday timetable of Inga must have six lessons: two mathematics lessons, and one lesson each of biology, history, ethics and English. Find the number of different timetables if the two mathematics lessons must follow one another.'
            answer_contract: {"kind":"exact"}
            answer: '120'
            solution_sketch: 'Treat the two mathematics lessons as one block. Then there are 5 objects to arrange. The number of arrangements is $5! = 120$.'
            points: 1
          # source: VBE 2023 main task 18
          - problem: 'Find the range of the function $f(x) = 1 - \sin^2 x \cdot \cos^2 x$. Write the answer as an inequality for $y$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '3/4 <= y <= 1'
            solution_sketch: 'We have $\sin^2 x \cos^2 x = \frac14 \sin^2 2x$, and this value is in $[0; \frac14]$. So $f(x)$ is in $[\frac34; 1]$.'
            points: 1
        constraints: 'The 1-point tasks of the official paper in paper order; task 4 is the diagnostic exemplar; the choice tasks 1, 2, 3, 5, 7, 8, 9 and 10 become typed answers with the same mathematics; the tasks 5 and 10 have a visual.'
