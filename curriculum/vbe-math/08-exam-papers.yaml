        exemplars:
          # source: VBE 2023 repeat task 12
          - problem: 'The graph of the function $y = f(x)$ is an arc of a parabola. The arc starts at the point $(0; 0)$ and ends at the point $(5; -5)$. Both end points belong to the graph. The highest point of the arc is $(2; 4)$, and the arc crosses the Ox axis again at $(4; 0)$. (a) Find the domain of the function $f$. Write the answer as an inequality in $x$. (b) Find the smallest value of the function $f$. (c) Find the range of the function $g(x) = f(x) + 2$. Write the answer as an inequality for $y$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"domain","contract":{"kind":"inequality_union"}},{"name":"smallest","contract":{"kind":"exact"}},{"name":"range","contract":{"kind":"inequality_union"}}]}
            answer: 'domain = 0 <= x <= 5; smallest = -5; range = -3 <= y <= 6'
            visual: 0
            solution_sketch: '(a) The arc runs from $x = 0$ to $x = 5$. (b) The values of $f$ go from $-5$ at the right end to $4$ at the top. So the smallest value is $-5$. (c) Adding $2$ moves the range from $[-5; 4]$ to $[-3; 6]$.'
            points: 3
          # source: VBE 2023 repeat task 14
          - problem: 'A box holds white, black and red balls of the same size. One ball is drawn from the box at random. The probability to draw a white ball is $0.35$. The probability to draw a black ball is $0.4$. (a) Find the probability that the drawn ball is red. (b) One ball is drawn from the box at random and a standard six-sided die is rolled once. The event $A$ is: the ball is black and the number of dots on the die is divisible by three. Find the probability of the event $A$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"red","contract":{"kind":"exact"}},{"name":"event","contract":{"kind":"exact"}}]}
            answer: 'red = 1/4; event = 2/15'
            solution_sketch: '(a) The three probabilities sum to $1$. So $1 - 0.35 - 0.4 = 0.25$. (b) The die shows $3$ or $6$ with probability $\frac26 = \frac13$. The events are independent, so $0.4 \cdot \frac13 = \frac{2}{15}$.'
            points: 2
          # source: VBE 2023 repeat task 15
          - problem: 'The side $BC$ of the triangle $ABC$ is a diameter of the circle around this triangle. The center of the circle is the point $O$. It is known that $\angle ACB = 15^\circ$ and $OC = 10$. (a) Find the size of the angle $ABC$ in degrees. (b) Find the area of the triangle $AOC$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"angle","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'angle = 75; area = 25'
            solution_sketch: '(a) The angle $BAC$ rests on a diameter, so it is $90^\circ$. Then $\angle ABC = 180^\circ - 90^\circ - 15^\circ = 75^\circ$. (b) We have $OA = OC = 10$, so $\angle AOC = 180^\circ - 2 \cdot 15^\circ = 150^\circ$. The area is $\frac12 \cdot 10 \cdot 10 \cdot \sin 150^\circ = 25$.'
            points: 2
          # source: VBE 2023 repeat task 19
          - problem: 'In a biology lab work, scientists study the size of a population of fruit flies. The size $m(t)$ is the number of flies after $t$ hours. It is given by the formula $m(t) = 20 \cdot 3^{0.25t}$, where $t \ge 0$. (a) Find the number of flies after $4$ hours. (b) Find after how many hours the number of flies equals $4860$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"flies","contract":{"kind":"exact"}},{"name":"hours","contract":{"kind":"exact"}}]}
            answer: 'flies = 60; hours = 20'
            solution_sketch: '(a) We get $m(4) = 20 \cdot 3^1 = 60$. (b) The equation $20 \cdot 3^{0.25t} = 4860$ gives $3^{0.25t} = 243 = 3^5$. So $0.25t = 5$ and $t = 20$.'
            points: 3
          # source: VBE 2023 repeat task 20(a,b)
          - problem: 'In a concert hall the first row has $25$ seats. Each next row has $2$ seats more than the row before. (a) Find the number of seats in the first three rows together. (b) Find the number of rows in the hall if the last row has $101$ seats.'
            answer_contract: {"kind":"multipart","parts":[{"name":"seats","contract":{"kind":"exact"}},{"name":"rows","contract":{"kind":"exact"}}]}
            answer: 'seats = 81; rows = 39'
            solution_sketch: '(a) The first three rows have $25$, $27$ and $29$ seats. The sum is $81$. (b) The row numbers form an arithmetic progression. The equation $25 + 2(n - 1) = 101$ gives $n = 39$.'
            points: 3
          # source: VBE 2023 repeat task 21
          - problem: 'Solve the equations. (a) $\log_2(x^2 - 1) = 3$. (b) $\sqrt{x + 3} + 2x = 0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"set"}},{"name":"second","contract":{"kind":"set"}}]}
            answer: 'first = {-3, 3}; second = {-3/4}'
            solution_sketch: '(a) The definition of the logarithm gives $x^2 - 1 = 8$. So $x^2 = 9$ and $x = \pm 3$. (b) Write $\sqrt{x + 3} = -2x$ and square it. We get $4x^2 - x - 3 = 0$, so $x = -\frac34$ or $x = 1$. Only $x = -\frac34$ fits the first equation.'
            points: 5
          # source: VBE 2023 repeat task 22
          - problem: 'A fair coin is tossed three times. Each time the coin lands on the coat of arms ($H$) or on the number ($S$). The random variable $X$ is the number of tosses on which the coin lands on the coat of arms. (a) Find the probability that the coin lands on the same side three times. (b) Find the number of outcomes that favor the event $X = 2$. (c) Find $\mathrm{P}(X = 2)$. (d) Find the expected value of $X$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"same","contract":{"kind":"exact"}},{"name":"favorable","contract":{"kind":"exact"}},{"name":"prob","contract":{"kind":"exact"}},{"name":"mean","contract":{"kind":"exact"}}]}
            answer: 'same = 1/4; favorable = 3; prob = 3/8; mean = 3/2'
            solution_sketch: '(a) There are $8$ outcomes. Only $SSS$ and $HHH$ fit, so the probability is $\frac14$. (b) The outcomes $SHH$, $HSH$ and $HHS$ fit, so there are $3$. (c) We get $\mathrm{P}(X = 2) = \frac38$. (d) The distribution is $\frac18, \frac38, \frac38, \frac18$ for $X = 0, 1, 2, 3$. So $\mathrm{E}(X) = \frac{3 + 6 + 3}{8} = \frac32$.'
            points: 6
          # source: VBE 2023 repeat task 23(b)
          - problem: 'The point $M$ lies on the side $AD$ of the parallelogram $ABCD$. The segment $BM$ meets the diagonal $AC$ at the point $N$. It is known that $AM = \frac16 BC$ and $BN = \frac67 BM$. Let $\vec{AB} = \vec{a}$ and $\vec{AD} = \vec{b}$. Express the vector $\vec{BN}$ with the vectors $\vec{a}$ and $\vec{b}$.'
            answer_contract: {"kind":"function","vars":["a","b"]}
            answer: '-6/7*a+1/7*b'
            solution_sketch: 'We have $\vec{BM} = \vec{BA} + \vec{AM} = -\vec{a} + \frac16\vec{b}$. Then $\vec{BN} = \frac67\vec{BM} = -\frac67\vec{a} + \frac17\vec{b}$.'
            points: 2
          # source: VBE 2023 repeat task 24
          - problem: 'The graph of the function $y = kx^3$ (where $k > 0$), the line $y = k$ and the $y$-axis bound a figure. Find the value of $k$ for which the area of this figure equals $6$.'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'The graph and the line meet at $x = 1$. The area is $\int_0^1 (k - kx^3)\,dx = k - \frac{k}{4} = \frac{3k}{4}$. The equation $\frac{3k}{4} = 6$ gives $k = 8$.'
            points: 4
          # source: VBE 2023 repeat task 25(c)
          - problem: 'A cone has the lateral surface area $16\pi\sqrt{3}$. The base radius of the cone is $r$, where $1 \le r \le 5$. The volume of the cone is $V(r) = \frac{\pi}{3}\, r\sqrt{768 - r^4}$. The derivative is $V''(r) = \frac{\pi\,(768 - 3r^4)}{3\sqrt{768 - r^4}}$. Find the value of $r$ for which the volume of the cone is the largest.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'Solve $V''(r) = 0$. We get $768 - 3r^4 = 0$, so $r^4 = 256$ and $r = 4$. The derivative changes sign from plus to minus at $r = 4$, so the volume is the largest there.'
            points: 2
          # source: VBE 2023 repeat task 20(c)
          - problem: 'In a concert hall the first row has $25$ seats. Each next row has $2$ seats more than the row before. Show that, if the number of rows is divisible by $9$, then the number of all seats in the hall is divisible by $27$.'
            answer_contract: {"kind":"written"}
            answer: 'The sum of the first $n$ terms is $S_n = n(n + 24)$. Put $n = 9k$. Then $S_n = 27k(3k + 8)$, which is divisible by $27$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the sum formula $S_n = \frac{2 \cdot 25 + 2(n - 1)}{2}\, n = n(n + 24)$. 1 point: the proof method, $n = 9k$ with $k$ natural. 1 point: the reason that $27k(3k + 8)$ is divisible by $27$.'
            points: 3
          # source: VBE 2023 repeat task 23(a)
          - problem: 'The point $M$ lies on the side $AD$ of the parallelogram $ABCD$. The segment $BM$ meets the diagonal $AC$ at the point $N$. It is known that $AM = \frac16 BC$. Show that $BN = \frac67 BM$.'
            answer_contract: {"kind":"written"}
            answer: 'The triangles $AMN$ and $CBN$ are similar, so $\frac{MN}{BN} = \frac{AM}{CB} = \frac16$. Then $BM = BN + MN = \frac76 BN$, so $BN = \frac67 BM$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the reason that the triangles $AMN$ and $CBN$ are similar (equal vertical angles, equal alternate angles because $AD \parallel BC$). 1 point: the proportion $MN = \frac16 BN$ and the result $BN = \frac67 BM$.'
            points: 2
          # source: VBE 2023 repeat task 25(a)
          - problem: 'A cone has the lateral surface area $16\pi\sqrt{3}$. The base radius of the cone is $r$ and its height is $h$, where $1 \le r \le 5$. Express $h$ with $r$. Then show that the volume of the cone is $V(r) = \frac{\pi}{3}\, r\sqrt{768 - r^4}$.'
            answer_contract: {"kind":"written"}
            answer: 'The slant height is $l = \frac{16\sqrt{3}}{r}$ from $\pi r l = 16\pi\sqrt{3}$. Then $h = \sqrt{l^2 - r^2} = \frac{\sqrt{768 - r^4}}{r}$. So $V = \frac13 \pi r^2 h = \frac{\pi}{3}\, r\sqrt{768 - r^4}$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: a correct method, $\pi r l = 16\pi\sqrt{3}$ for the slant height $l$. 1 point: the height $h = \sqrt{\frac{768}{r^2} - r^2}$ expressed with $r$. 1 point: the correct reason that the volume equals $\frac{\pi}{3}\, r\sqrt{768 - r^4}$.'
            points: 3
          # source: VBE 2023 repeat task 25(b)
          - problem: 'The volume of a cone is $V(r) = \frac{\pi}{3}\, r\sqrt{768 - r^4}$, where $1 \le r \le 5$. Show that $V''(r) = \frac{\pi\,(768 - 3r^4)}{3\sqrt{768 - r^4}}$.'
            answer_contract: {"kind":"written"}
            answer: 'Use the product rule and the chain rule. We get $V''(r) = \frac{\pi}{3}\left(\sqrt{768 - r^4} - \frac{2r^4}{\sqrt{768 - r^4}}\right)$. Bring the terms to one fraction.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the derivative of the composite function, $\left(\sqrt{768 - r^4}\right)'' = \frac{-4r^3}{2\sqrt{768 - r^4}}$. 1 point: the correct derivative $\frac{\pi\,(768 - 3r^4)}{3\sqrt{768 - r^4}}$.'
            points: 2
          # source: VBE 2023 repeat task 26
          - problem: 'In the triangle $ABC$ the side $BC$ has length $a$ and the side $AC$ has length $b$. The angle $ACB$ equals $2\varphi$. The segment $CD$ is the bisector of this angle, with $D$ on the side $AB$. Show that $CD = \frac{2ab\cos\varphi}{a + b}$.'
            answer_contract: {"kind":"written"}
            answer: 'Let $CD = k$. The areas of the triangles $ADC$ and $BDC$ sum to the area of $ABC$. So $\frac12 bk\sin\varphi + \frac12 ak\sin\varphi = \frac12 ab\sin 2\varphi$. Use $\sin 2\varphi = 2\sin\varphi\cos\varphi$ and divide by $\sin\varphi$. Then $k = \frac{2ab\cos\varphi}{a + b}$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: a correct method, the area of $ABC$ as the sum of the areas of $ADC$ and $BDC$, with the area formula. 1 point: the double-angle formula for the sine. 1 point: the correct proof. The law of cosines or the law of sines gives two more official methods.'
            points: 3
        constraints: 'All other tasks of the official paper, 6 excepted (it stands in figures_open.tsv). Decidable items come first in paper order, then the written items in paper order.'
    diagnostic_exemplar:
      # source: VBE 2023 repeat task 5
      problem: 'A sample has the data $1; 2; x; y; 10; 11$, written in increasing order. The median of the sample is $4.5$. Find the mean of the sample data.'
      answer_contract: {"kind":"exact"}
      answer: '11/2'
      solution_sketch: 'The median is $\frac{x + y}{2} = 4.5$, so $x + y = 9$. The sum of all data is $1 + 2 + 9 + 10 + 11 = 33$. The mean is $\frac{33}{6} = 5.5$.'
