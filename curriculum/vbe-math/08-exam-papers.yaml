        exemplars:
          # source: VBE 2022 main task 1
          - problem: 'Digits $0, 1, 2, 3, 4, 5$ are given. Find how many different two-digit natural numbers have digits from this list, if the digits in a number do not repeat.'
            answer_contract: {"kind":"exact"}
            answer: '25'
            solution_sketch: 'The first digit has $5$ choices, because it is not $0$. The second digit has $5$ choices, because it differs from the first digit. The product is $5 \cdot 5 = 25$.'
            points: 1
          # source: VBE 2022 main task 3
          - problem: 'The area of the axial section of a cylinder is $18$. The height of the cylinder is $3$. Find the area of the base of the cylinder. Give the answer with $\pi$.'
            answer_contract: {"kind":"exact"}
            answer: '9*pi'
            solution_sketch: 'The axial section is a rectangle with sides $2r$ and $3$. So $2r \cdot 3 = 18$ and $r = 3$. The area of the base is $\pi r^2 = 9\pi$.'
            points: 1
          # source: VBE 2022 main task 4
          - problem: 'It is known that $\sin\alpha = 0.6$ and $90^\circ < \alpha < 180^\circ$. Find $\cos\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '-4/5'
            solution_sketch: 'We have $\cos^2\alpha = 1 - 0.36 = 0.64$. In the second quadrant the cosine is negative. So $\cos\alpha = -0.8$.'
            points: 1
          # source: VBE 2022 main task 5
          - problem: 'A vessel holds $2$ liters of sugar solution with $30\%$ concentration. Then $x$ liters of sugar solution with $10\%$ concentration are added to it. Write the concentration $C$ (in $\%$) of the new solution as a function of $x$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '(60+10*x)/(2+x)'
            solution_sketch: 'The mass of sugar is $0.3 \cdot 2 + 0.1x = 0.6 + 0.1x$. The volume of the new solution is $2 + x$. So $C = 100 \cdot \frac{0.6 + 0.1x}{2 + x} = \frac{60 + 10x}{2 + x}$.'
            points: 1
          # source: VBE 2022 main task 6
          - problem: 'In the triangle $ABC$ the side $BC$ has length $\sqrt{3}$ and the angle $A$ is $60^\circ$. Find the radius of the circle that is circumscribed about this triangle.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'By the law of sines $2R = \frac{BC}{\sin 60^\circ} = \frac{\sqrt{3}}{\sqrt{3}/2} = 2$. So $R = 1$.'
            points: 1
          # source: VBE 2022 main task 7
          - problem: 'The function $f(x) = \cos x$ is given. Find $f''\left(-\frac{\pi}{6}\right)$.'
            answer_contract: {"kind":"exact"}
            answer: '1/2'
            solution_sketch: 'We have $f''(x) = -\sin x$. So $f''\left(-\frac{\pi}{6}\right) = -\sin\left(-\frac{\pi}{6}\right) = \frac12$.'
            points: 1
          # source: VBE 2022 main task 8
          - problem: 'Simplify the expression $\frac{\sqrt{a} - \sqrt{b}}{\sqrt[4]{a} - \sqrt[4]{b}}$, if $a > 0$, $b > 0$ and $a \ne b$. Write fourth roots as sqrt(sqrt(...)).'
            answer_contract: {"kind":"function","vars":["a","b"]}
            answer: 'sqrt(sqrt(a))+sqrt(sqrt(b))'
            solution_sketch: 'Write $\sqrt{a} - \sqrt{b} = (\sqrt[4]{a} - \sqrt[4]{b})(\sqrt[4]{a} + \sqrt[4]{b})$. Cancel the common factor. The result is $\sqrt[4]{a} + \sqrt[4]{b}$.'
            points: 1
          # source: VBE 2022 main task 9
          - problem: 'A tangent touches the graph of the function $y = f(x)$ at the point with abscissa $x_0$. The tangent meets the coordinate axes at the points $(0; 6)$ and $(3; 0)$. Find $f''(x_0)$.'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            solution_sketch: 'The derivative $f''(x_0)$ is the slope of the tangent. The slope is $\frac{0 - 6}{3 - 0} = -2$.'
            points: 1
          # source: VBE 2022 main task 10
          - problem: 'Let $f(x) = \cos x$ and $g(x) = \sin x$. Exactly one of the four functions $f(f(x))$, $f(g(x))$, $g(f(x))$ and $g(g(x))$ is odd. Write that function as a formula in $x$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: 'sin(sin(x))'
            solution_sketch: 'The functions $\cos(\cos x)$, $\cos(\sin x)$ and $\sin(\cos x)$ are even, because $\cos x$ is even and $\cos$ is even. The function $\sin(\sin(-x)) = -\sin(\sin x)$ is odd.'
            points: 1
          # source: VBE 2022 main task 11
          - problem: 'Two sets are given: $A = \{-3, -2, -1, 0, 1, 3, 4\}$ and $B = \{-5, -3, -1, 3, 5\}$. Find how many elements the intersection $A \cap B$ has.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'The common elements are $-3$, $-1$ and $3$. So the intersection has $3$ elements.'
            points: 1
          # source: VBE 2022 main task 12
          - problem: 'The function $y = f(x)$ is defined on the interval $[-1; 6)$. Its graph is a continuous curve. It starts at the point $(-1; 2)$, which belongs to the graph. The curve goes down to its lowest point $(2; -2)$. Then it goes up to the point $(6; 5)$, which does not belong to the graph. Find the range of the function. Write the answer as an inequality for $y$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-2 <= y < 5'
            solution_sketch: 'The lowest value is $-2$ at $x = 2$. The curve rises to $5$ at $x = 6$, but the point $(6; 5)$ is not on the graph. The left end has the value $2$, which is less than $5$. So the values fill $[-2; 5)$.'
            points: 1
          # source: VBE 2022 main task 13
          - problem: 'In the triangle $ABC$ we have $AB = 5$, $AC = 3$ and $\cos A = -\frac{1}{15}$. Find the length of the side $BC$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'By the law of cosines $BC^2 = 25 + 9 - 2 \cdot 5 \cdot 3 \cdot \left(-\frac{1}{15}\right) = 36$. So $BC = 6$.'
            points: 1
          # source: VBE 2022 main task 15
          - problem: 'The distribution of a random variable $X$ is given by a table. The variable takes the value $-1$ with probability $0.8$. It takes the value $1$ with probability $p$. Find the expected value of $X$.'
            answer_contract: {"kind":"exact"}
            answer: '-3/5'
            solution_sketch: 'The probabilities sum to $1$, so $p = 0.2$. The expected value is $-1 \cdot 0.8 + 1 \cdot 0.2 = -0.6$.'
            points: 1
          # source: VBE 2022 main task 16
          - problem: 'Students did a study from March 1 to March 12. At noon of each day they measured the air temperature. Each day the temperature was $0.5\,^\circ$C higher than on the day before. The mean temperature of these twelve days was $4.75\,^\circ$C. Find the temperature at noon on March 1, in $^\circ$C.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'The temperatures form an arithmetic progression with difference $0.5$. The mean is $t_1 + 0.5 \cdot \frac{11}{2} = t_1 + 2.75$. So $t_1 + 2.75 = 4.75$ and $t_1 = 2$.'
            points: 1
          # source: VBE 2022 main task 18
          - problem: 'A circle is inscribed in the triangle $ABC$ with the right angle at the vertex $C$. The center of the circle is the point $O$. Find the angle $AOB$.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '135°'
            solution_sketch: 'The segments $AO$ and $BO$ bisect the angles $A$ and $B$. The sum of the angles $A$ and $B$ is $90^\circ$. So $\angle AOB = 180^\circ - 45^\circ = 135^\circ$.'
            points: 1
        constraints: 'Fourteen 1-point tasks of the official paper in paper order. Task 2 is the diagnostic exemplar. The choice tasks 1 to 10 become typed answers with the same mathematics.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp11-equations, vbe-cp16-trig-equations, vbe-cp07-progressions, vbe-cp14-plane-vectors, vbe-cp18-derivative-rules, vbe-cp19-function-study, vbe-cp20-integral, vbe-cp23-solids, vbe-cp22-space-angles, vbe-cp25-probability-models, vbe-cp24-combinatorics]
        visuals: [{"kind":"curve","x_min":"-4","x_max":"2","y_min":"-5","y_max":"6","x_tick":"1","y_tick":"1","curve":{"family":"polynomial","coefficients":["-3","2","1"]},"key_points":[{"x":"-3","y":"0","label":null},{"x":"1","y":"0","label":null},{"x":"-1","y":"-4","label":null},{"x":"0","y":"-3","label":null},{"x":"2","y":"5","label":null},{"x":"-4","y":"5","label":null}],"asymptotes":[],"caption":"The graph of the derivative f' for x from -4 to 2; for x from 2 to 8 it is the line y = 5"}]
        exemplars:
          # source: VBE 2022 main task 14
          - problem: '(a) Solve the equation $\sqrt{x^2 - 16} = 3$. (b) Solve the equation $\cos x = -\frac{1}{2}$ on the interval $[0; 2\pi)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"set"}},{"name":"second","contract":{"kind":"set"}}]}
            answer: 'first = {-5, 5}; second = {2*pi/3, 4*pi/3}'
            solution_sketch: '(a) Square both sides to get $x^2 - 16 = 9$, so $x = \pm 5$. Both values satisfy the equation. (b) The general solution is $x = \pm\frac{2\pi}{3} + 2\pi k$. On the interval $[0; 2\pi)$ the solutions are $\frac{2\pi}{3}$ and $\frac{4\pi}{3}$.'
            points: 2
          # source: VBE 2022 main task 17
          - problem: 'Two vectors are given: $\vec{a} = (-m; 1)$ and $\vec{b} = (2; 1 - m)$. (a) Find all values of $m$ for which the vectors $\vec{a}$ and $\vec{b}$ are perpendicular. (b) Find all values of $m$ for which the vectors $\vec{a}$ and $\vec{b}$ have the same direction.'
            answer_contract: {"kind":"multipart","parts":[{"name":"perpendicular","contract":{"kind":"set"}},{"name":"same_direction","contract":{"kind":"set"}}]}
            answer: 'perpendicular = {1/3}; same_direction = {-1}'
            solution_sketch: '(a) The scalar product is $-2m + 1 - m = 1 - 3m$. It is zero for $m = \frac13$. (b) The vectors are parallel when $-m(1 - m) - 2 = 0$, so $m = 2$ or $m = -1$. For $m = 2$ the vectors point in opposite directions. For $m = -1$ we get $(1; 1)$ and $(2; 2)$, which have the same direction.'
            points: 2
          # source: VBE 2022 main task 19
          - problem: 'The function $f(x)$ and its derivative $f''(x)$ are defined on the interval $(-4; 8)$. The graph of $y = f''(x)$ meets the Ox axis at the points $(-3; 0)$ and $(1; 0)$. For $x$ from $-4$ to $2$ the graph is a parabola with the lowest point $(-1; -4)$ that passes through the point $(2; 5)$. For $x$ from $2$ to $8$ the graph is the horizontal line $y = 5$. (a) Find all $x$ for which the values of $f(x)$ decrease. Write the answer as an inequality. (b) Find $f(5)$, if $f(6) = 6$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"decrease","contract":{"kind":"inequality_union"}},{"name":"value","contract":{"kind":"exact"}}]}
            answer: 'decrease = -3 < x < 1; value = 1'
            visual: 0
            solution_sketch: '(a) The function $f$ decreases where $f'' < 0$. This is the case for $-3 < x < 1$. (b) On the interval from $2$ to $8$ the derivative equals $5$, so $f$ is a line with slope $5$ there. Then $f(6) - f(5) = 5$, and $f(5) = 6 - 5 = 1$.'
            points: 2
          # source: VBE 2022 main task 20
          - problem: 'Each term of a sequence, from the second term on, is $20\%$ less than the term before it. The sixth term of the sequence equals $1024$. (a) Find the seventh term of the sequence. (b) This sequence is an infinite decreasing geometric progression. Find the sum of all terms of the sequence. (c) The terms of the sequence with odd indexes form a new infinite decreasing geometric progression. Find the sum of all terms of the new progression.'
            answer_contract: {"kind":"multipart","parts":[{"name":"seventh","contract":{"kind":"exact"}},{"name":"sum","contract":{"kind":"exact"}},{"name":"odd_sum","contract":{"kind":"exact"}}]}
            answer: 'seventh = 4096/5; sum = 15625; odd_sum = 78125/9'
            solution_sketch: 'The ratio is $q = 0.8$. (a) $b_7 = 1024 \cdot 0.8 = 819.2 = \frac{4096}{5}$. (b) $b_1 = \frac{1024}{0.8^5} = 3125$ and $S = \frac{3125}{1 - 0.8} = 15625$. (c) The new ratio is $0.64$, so the sum is $\frac{3125}{1 - 0.64} = \frac{78125}{9}$, about $8680.56$.'
            points: 4
          # source: VBE 2022 main task 21
          - problem: 'Solve the equation $\log_3(4 - x) + \log_3(22 - x) = 5$.'
            answer_contract: {"kind":"exact"}
            answer: '-5'
            solution_sketch: 'Both logarithms exist when $x < 4$. Combine them to get $(4 - x)(22 - x) = 3^5 = 243$. This gives $x^2 - 26x - 155 = 0$, so $x = -5$ or $x = 31$. Only $x = -5$ satisfies $x < 4$.'
            points: 4
          # source: VBE 2022 main task 22(b,c)
          - problem: 'In the triangle $ABC$ the point $D$ lies on the side $AC$ so that $AD : DC = 1 : 3$. The side $AB$ has length $10$. The angles $ABD$ and $ACB$ are equal. (a) Find the length of the side $AC$. (b) Put $\vec{a} = \vec{AB}$ and $\vec{b} = \vec{BC}$. Express the vector $\vec{BD}$ with the vectors $\vec{a}$ and $\vec{b}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ac","contract":{"kind":"exact"}},{"name":"bd","contract":{"kind":"function","vars":["a","b"]}}]}
            answer: 'ac = 20; bd = 1/4*b-3/4*a'
            solution_sketch: '(a) The triangles $ABC$ and $ADB$ are similar by two equal angles. So $AC \cdot AD = AB^2$. With $AD = \frac14 AC$ we get $AC^2 = 400$ and $AC = 20$. (b) We have $\vec{AC} = \vec{a} + \vec{b}$ and $\vec{AD} = \frac14(\vec{a} + \vec{b})$. So $\vec{BD} = -\vec{a} + \vec{AD} = \frac14\vec{b} - \frac34\vec{a}$.'
            points: 4
          # source: VBE 2022 main task 23(c,d)
          - problem: 'The graph of the function $f(x) = 6x - x^2$ is a parabola. It meets the $x$-axis at the points $O(0; 0)$ and $E(6; 0)$. A rectangle $ABCD$ has the vertices $A$ and $D$ on the segment $OE$ and the vertices $B$ and $C$ on the graph of $f$. Put $OA = a$, where $a \in (0; 3)$. The area of the rectangle is $S(a) = 2a^3 - 18a^2 + 36a$. (a) Find the value of $a$ for which the area $S(a)$ is the greatest. (b) The region is bounded by the graph of $f$, the $x$-axis, the line $x = 2$ and the line $x = 5$. Find the area of this region.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a_max","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'a_max = 3-sqrt(3); area = 24'
            solution_sketch: '(a) We have $S''(a) = 6a^2 - 36a + 36$. It is zero for $a = 3 \pm \sqrt{3}$. Only $3 - \sqrt{3}$ is in $(0; 3)$, and $S''$ changes sign from plus to minus there. (b) The area is $\int_2^5 (6x - x^2)\,dx = \left[3x^2 - \frac{x^3}{3}\right]_2^5 = 24$.'
            points: 5
          # source: VBE 2022 main task 24
          - problem: 'A regular quadrilateral pyramid $SABCD$ and a cube $ABCDA_1B_1C_1D_1$ have equal volumes. Each volume equals $216$. The pyramid and the cube have the common face $ABCD$. The pyramid is on the side of this face that is away from the cube. The point $O$ is the center of the square $ABCD$. The point $O_1$ is the center of the square $A_1B_1C_1D_1$. (a) Find the length of the segment $SO_1$. (b) Find the distance from the point $S$ to the line $AA_1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"so1","contract":{"kind":"exact"}},{"name":"dist","contract":{"kind":"exact"}}]}
            answer: 'so1 = 24; dist = 3*sqrt(2)'
            solution_sketch: 'The edge of the cube is $6$. The height $H$ of the pyramid satisfies $\frac13 \cdot 6^2 \cdot H = 216$, so $H = 18$. (a) $SO_1 = 18 + 6 = 24$. (b) The line $SO$ is parallel to $AA_1$. So the distance equals $OA = \frac12 \cdot 6\sqrt{2} = 3\sqrt{2}$.'
            points: 4
          # source: VBE 2022 main task 25
          - problem: 'Solve the equation $f''(x) = f(x)$, where $f(x) = e^x - e^{-x} + 4$.'
            answer_contract: {"kind":"exact"}
            answer: '-ln(2)'
            solution_sketch: 'We have $f''(x) = e^x + e^{-x}$. The equation becomes $e^x + e^{-x} = e^x - e^{-x} + 4$. So $e^{-x} = 2$ and $x = -\ln 2$.'
            points: 3
          # source: VBE 2022 main task 26
          - problem: 'A street has twelve lamps. Six of them stand in one row on the left side of the street. The other six stand in one row on the right side. (a) Two lamps on the left side are picked at random. Find the probability that the two picked lamps are next to each other. (b) To save energy, five lamps on both sides together are switched off. No two switched-off lamps on the same side are next to each other. Find the number of ways to pick these five lamps.'
            answer_contract: {"kind":"multipart","parts":[{"name":"prob","contract":{"kind":"exact"}},{"name":"ways","contract":{"kind":"exact"}}]}
            answer: 'prob = 1/3; ways = 80'
            solution_sketch: '(a) There are $5$ pairs of neighbors among $\binom{6}{2} = 15$ pairs. The probability is $\frac13$. (b) The split is three lamps on one side and two on the other. Three lamps with no neighbors on a side of six: $4$ ways. Two lamps with no neighbors: $10$ ways. The side with three lamps is the left or the right side, so the total is $2 \cdot 4 \cdot 10 = 80$.'
            points: 6
          # source: VBE 2022 main task 27
          - problem: 'A company has lasers of a new type and lasers of an old type. A new laser cuts a whole number of parts in one hour, and this number is greater than $8$. An old laser cuts $4$ parts per hour fewer than a new laser. The company gets an order. One new laser does the order in a whole number of hours. Three old lasers do the same order $2$ hours faster. Find the greatest possible number of parts in the order.'
            answer_contract: {"kind":"exact"}
            answer: '48'
            solution_sketch: 'Let a new laser cut $x$ parts per hour and do the order in $t$ hours. Then $xt = 3(x - 4)(t - 2)$, which gives $(x - 6)(t - 3) = 6$. With integer $x > 8$ the pairs are $(x; t) = (9; 5)$ and $(12; 4)$. The orders have $45$ and $48$ parts. The greatest is $48$.'
            points: 4
          # source: VBE 2022 main task 22(a)
          - problem: 'In the triangle $ABC$ the point $D$ lies on the side $AC$ so that $AD : DC = 1 : 3$. The side $AB$ has length $10$. The angles $ABD$ and $ACB$ are equal. Prove that the triangles $ABC$ and $ADB$ are similar.'
            answer_contract: {"kind":"written"}
            answer: 'The angles $ABD$ and $ACB$ are equal, and the angle $A$ is common. So the triangles are similar by two angles.'
            solution_sketch: 'Official scheme, 1 point. 1 point: a correct proof, with the equal angles $ABD = ACB$ (given) and the common angle $A$, so the triangles are similar by two angles.'
            points: 1
          # source: VBE 2022 main task 23(a)
          - problem: 'The graph of the function $y = f(x)$ is a parabola with the vertex $V(3; 9)$. The parabola meets the $x$-axis at the points $O(0; 0)$ and $E(6; 0)$. Show that $f(x) = 6x - x^2$.'
            answer_contract: {"kind":"written"}
            answer: 'Write $f(x) = a(x - 3)^2 + 9$. The point $O$ gives $0 = 9a + 9$, so $a = -1$. Then $f(x) = -(x - 3)^2 + 9 = 6x - x^2$.'
            solution_sketch: 'Official scheme, 1 point. 1 point: a correct proof by one of three methods. Method 1: the vertex form with the point $O$. Method 2: the form $a(x - 0)(x - 6)$ with the vertex. Method 3: the form $ax^2 + bx + c$ with three conditions.'
            points: 1
          # source: VBE 2022 main task 23(b)
          - problem: 'The graph of the function $f(x) = 6x - x^2$ is a parabola. It meets the $x$-axis at the points $O(0; 0)$ and $E(6; 0)$. A rectangle $ABCD$ has the vertices $A$ and $D$ on the segment $OE$ and the vertices $B$ and $C$ on the graph of $f$. Put $OA = a$, where $a \in (0; 3)$. Show that the area of the rectangle is $S(a) = 2a^3 - 18a^2 + 36a$.'
            answer_contract: {"kind":"written"}
            answer: 'The side $AD$ is $6 - 2a$, because the figure is symmetric about the line $x = 3$. The side $AB$ is $f(a) = 6a - a^2$. So $S = (6 - 2a)(6a - a^2) = 2a^3 - 18a^2 + 36a$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: a correct expression of $AD$ with $a$, which is $6 - 2a$. 1 point: a correct justification that $S(a) = AB \cdot AD$ equals $2a^3 - 18a^2 + 36a$.'
            points: 2
        constraints: 'The open tasks 14 and 17 to 27 of the official paper. The decidable items come first in paper order, then the written items. Task 14(b) adds the interval [0; 2pi) to the official equation so that the answer has a typed form. Task 19 has a curve visual of the derivative.'
    diagnostic_exemplar:
      # source: VBE 2022 main task 2
      problem: 'A sample has ten numbers: $7, 1, 4, 3, 6, 6, 3, 3, 8, 7$. Find the median of this sample.'
      answer_contract: {"kind":"exact"}
      answer: '5'
      solution_sketch: 'Sort the numbers: $1, 3, 3, 3, 4, 6, 6, 7, 7, 8$. The median is the mean of the fifth and sixth numbers. It equals $\frac{4 + 6}{2} = 5$.'
