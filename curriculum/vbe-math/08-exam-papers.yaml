        visuals: [{"kind":"coordinate","x_min":"-1","x_max":"6","y_min":"-1","y_max":"11","x_tick":"1","y_tick":"1","points":[{"x":"3","y":"4","label":"A"}],"segments":[{"from":{"x":"0","y":"10","label":null},"to":{"x":"5","y":"0","label":null}}],"caption":"The tangent line through the point A(3; 4); it meets the axes at (0; 10) and (5; 0)"}]
        exemplars:
          # source: VBE 2026 pilot A II task 1
          - problem: 'Sets $A = [-5; 3)$ and $B = [0; 2]$ are given. Find the union of $A$ and $B$. Write the answer as an inequality in $x$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-5 <= x < 3'
            solution_sketch: 'The set $B = [0; 2]$ lies inside $A = [-5; 3)$. So the union equals $A$.'
            points: 1
          # source: VBE 2026 pilot A II task 2
          - problem: 'Rationalize the denominator of the fraction $\frac{m}{\sqrt{5} - 2}$.'
            answer_contract: {"kind":"function","vars":["m"]}
            answer: 'm*(sqrt(5)+2)'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{5} + 2$. The bottom becomes $5 - 4 = 1$. The result is $m(\sqrt{5} + 2)$.'
            points: 1
          # source: VBE 2026 pilot A II task 3
          - problem: 'A random variable $X$ takes the values $-4$, $1$, $6$ and $2$. The probabilities are $\mathrm{P}(X = -4) = \frac{1}{5}$, $\mathrm{P}(X = 1) = \frac{32}{125}$, $\mathrm{P}(X = 6) = \frac{8}{25}$ and $\mathrm{P}(X = 2) = \frac{28}{125}$. Find the expected value $\mathrm{E}X$.'
            answer_contract: {"kind":"exact"}
            answer: '228/125'
            solution_sketch: 'Use the common denominator $125$. We get $\mathrm{E}X = \frac{-100 + 32 + 240 + 56}{125} = \frac{228}{125}$.'
            points: 1
          # source: VBE 2026 pilot A II task 4
          - problem: 'Find the coordinates of the intersection point of the graphs of the functions $y = \left(\frac{1}{5}\right)^x$ and $y = 5^{x+2}$.'
            answer_contract: {"kind":"coordinates","arity":2}
            answer: '(-1, 5)'
            solution_sketch: 'Write $\left(\frac15\right)^x = 5^{-x}$. Then $-x = x + 2$, so $x = -1$. Also $y = 5^{1} = 5$.'
            points: 1
          # source: VBE 2026 pilot A II task 6
          - problem: 'A tangent line to the graph of the function $y = f(x)$ is drawn through the point $A(3; 4)$ of the graph. The tangent meets the Oy axis at the point $(0; 10)$ and the Ox axis at the point $(5; 0)$. Find the value of the derivative $f''(3)$.'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            visual: 0
            solution_sketch: 'The value $f''(3)$ is the slope of the tangent at $A$. The tangent passes through $(0; 10)$ and $(5; 0)$. So the slope is $\frac{0 - 10}{5 - 0} = -2$. The point $A(3; 4)$ is on this line, because $10 - 2 \cdot 3 = 4$.'
            points: 1
          # source: VBE 2026 pilot A II task 7
          - problem: 'It is known that $\sin\alpha + \cos\alpha = 0.8$. Find the value of $\sin(2\alpha)$.'
            answer_contract: {"kind":"exact"}
            answer: '-9/25'
            solution_sketch: 'Square both sides. We get $1 + \sin(2\alpha) = 0.64$. So $\sin(2\alpha) = -0.36 = -\frac{9}{25}$.'
            points: 1
          # source: VBE 2026 pilot A II task 8
          - problem: 'The vectors $\vec{a} = -3\vec{i} + 2\vec{j}$ and $\vec{b} = (x; y)$ have opposite directions. The length of the vector $\vec{b}$ equals $2\sqrt{13}$. (a) Find the coordinate $x$ of the vector $\vec{b}$. (b) Find the coordinate $y$ of the vector $\vec{b}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"y","contract":{"kind":"exact"}}]}
            answer: 'x = 6; y = -4'
            solution_sketch: 'We have $|\vec{a}| = \sqrt{13}$. So $\vec{b} = -2\vec{a} = (6; -4)$.'
            points: 1
          # source: VBE 2026 pilot A II task 9
          - problem: 'The speed of a body in meters per second is the function $v(t) = 2t$ of the time $t$ in seconds. Find the distance in meters that the body travels in the first 5 seconds of the motion.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '25 m'
            solution_sketch: 'The distance is $\int_0^5 2t\,dt = t^2$ from $0$ to $5$. The value is $25$.'
            points: 1
          # source: VBE 2026 pilot A II task 10
          - problem: 'It is known that $2^x = 15$ and $15^y = 32$. Find the value of the product $x \cdot y$.'
            answer_contract: {"kind":"exact"}
            answer: '5'
            solution_sketch: 'We get $2^{xy} = 15^y = 32 = 2^5$. So $xy = 5$.'
            points: 1
        constraints: 'The 1-point tasks of the official paper in paper order; task 5 is the diagnostic exemplar; the tangent task 6 has a coordinate visual and its facts in words; the tasks keep the official numbers and givens.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp05-logarithms, vbe-cp07-progressions, vbe-cp13-inequalities, vbe-cp14-plane-vectors, vbe-cp16-trig-equations, vbe-cp18-derivative-rules, vbe-cp22-space-angles, vbe-cp23-solids, vbe-cp25-probability-models]
        exemplars:
          # source: VBE 2026 pilot A II task 11
          - problem: 'Solve the inequalities. (a) $\frac{1}{x - 3} \le 1$. (b) $\log_2(x + 3) > 3$. (c) $\cos x < -\frac{1}{2}$. Give only the solution that lies in $[0; 2\pi]$. The full solution adds $2\pi k$ to both ends.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"inequality_union"}},{"name":"second","contract":{"kind":"inequality_union"}},{"name":"third","contract":{"kind":"inequality_union"}}]}
            answer: 'first = x < 3 or x >= 4; second = x > 5; third = 2*pi/3 < x < 4*pi/3'
            solution_sketch: '(a) Move $1$ to the left: $\frac{4 - x}{x - 3} \le 0$. So $x < 3$ or $x \ge 4$. (b) We need $x + 3 > 8$, so $x > 5$. (c) The equation $\cos x = -\frac12$ has the roots $\frac{2\pi}{3}$ and $\frac{4\pi}{3}$. The cosine is below $-\frac12$ between them. The official answer adds $2\pi k$ to both ends.'
            points: 8
          # source: VBE 2026 pilot A II task 12
          - problem: 'Simplify the expression $\sin(\alpha + 3\pi) + \cos(\alpha - 3\pi)$.'
            answer_contract: {"kind":"function","vars":["alpha"]}
            answer: '-sin(alpha)-cos(alpha)'
            solution_sketch: 'Remove $2\pi$ from each angle. We get $\sin(\alpha + \pi) + \cos(\alpha - \pi) = -\sin\alpha - \cos\alpha$.'
            points: 2
          # source: VBE 2026 pilot A II task 13
          - problem: 'A company plans to clear a forest area of 2000 hectares. In the first year the company cleared 12 hectares. In each next year the company plans to clear an area 1.5 times greater than in the year before. (a) Find how many hectares the company plans to clear in the 7th year. Round the answer to the nearest hectare. (b) Find how many hectares the company plans to clear in the first 8 years in total. Round the answer to the nearest ten hectares. (c) Find the smallest whole number of years in which the company plans to clear the whole area of 2000 hectares.'
            answer_contract: {"kind":"multipart","parts":[{"name":"seventh","contract":{"kind":"exact"}},{"name":"total8","contract":{"kind":"exact"}},{"name":"years","contract":{"kind":"exact"}}]}
            answer: 'seventh = 137; total8 = 590; years = 11'
            solution_sketch: 'The areas form a geometric progression with $b_1 = 12$ and $q = 1.5$. (a) $b_7 = 12 \cdot 1.5^6 \approx 136.7$, so $137$. (b) $S_8 = 24(1.5^8 - 1) \approx 591.1$, so $590$. (c) $24(1.5^n - 1) = 2000$ gives $n \approx 10.94$, so $11$ years.'
            points: 6
          # source: VBE 2026 pilot A II task 14
          - problem: 'ABCD is a parallelogram with $AB = 3$, $AD = 4$ and $\angle A = 60^\circ$. The point $E$ lies on the side $AB$ and the point $F$ lies on the side $DC$. They satisfy $AE : EB = CF : FD = 2 : 1$. Let $\vec{AB} = \vec{a}$ and $\vec{AD} = \vec{b}$. (a) Express the vector $\vec{EF}$ with the vectors $\vec{a}$ and $\vec{b}$. (b) Find the scalar product of the vectors $\vec{EF}$ and $\vec{CF}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ef","contract":{"kind":"function","vars":["a","b"]}},{"name":"product","contract":{"kind":"exact"}}]}
            answer: 'ef = b - 1/3*a; product = -2'
            solution_sketch: '(a) We have $\vec{EF} = \vec{EB} + \vec{BC} + \vec{CF} = \frac13\vec{a} + \vec{b} - \frac23\vec{a} = \vec{b} - \frac13\vec{a}$. (b) Also $\vec{CF} = -\frac23\vec{a}$ and $\vec{a}\cdot\vec{b} = 3 \cdot 4 \cdot \cos 60^\circ = 6$. The product is $-\frac23 \cdot 6 + \frac29 \cdot 9 = -2$.'
            points: 5
          # source: VBE 2026 pilot A II task 15(b,c)
          - problem: 'A closed cylinder has the total surface area $50\ \mathrm{cm}^2$. The radius of its base is $r$ cm. Its volume in $\mathrm{cm}^3$ is the function $V(r) = 25r - \pi r^3$. (a) Find the derivative $V''(r)$. (b) Find the greatest possible volume of this cylinder in $\mathrm{cm}^3$. In the calculation use $3$ in place of $\pi$. Round the answer to the nearest whole number.'
            answer_contract: {"kind":"multipart","parts":[{"name":"dV","contract":{"kind":"function","vars":["r"]}},{"name":"Vmax","contract":{"kind":"unit","quantity":"cubic_volume","unit":"cm^3","allow_omitted":true}}]}
            answer: 'dV = 25 - 3*pi*r^2; Vmax = 28 cm^3'
            solution_sketch: '(a) $V''(r) = 25 - 3\pi r^2$. (b) With $\pi = 3$ the root of $V''(r) = 0$ is $r = \frac53$. The derivative changes from plus to minus there. So $V_{max} = 25 \cdot \frac53 - 3 \cdot \frac{125}{27} = \frac{250}{9} \approx 28$.'
            points: 6
          # source: VBE 2026 pilot A II task 16
          - problem: 'A regular quadrilateral pyramid $EABCD$ has the square base $ABCD$ with the center $O$. The segment $EO$ is the altitude of the pyramid. The point $K$ is the midpoint of the side $BC$, so $EK$ is the altitude of the lateral face $EBC$. The base edge $AB$ equals 8 cm. The lateral edge $EB$ equals 10 cm. (a) Find the length of the altitude $EO$. (b) Find the angle between the lateral face $EBC$ and the base $ABCD$ in degrees. Round the answer to tenths.'
            answer_contract: {"kind":"multipart","parts":[{"name":"EO","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}},{"name":"angle","contract":{"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}}]}
            answer: 'EO = 2*sqrt(17) cm; angle = 64.1°'
            solution_sketch: '(a) In the right triangle $EKB$: $EK = \sqrt{100 - 16} = \sqrt{84}$. In the right triangle $EOK$ with $OK = 4$: $EO = \sqrt{84 - 16} = 2\sqrt{17}$. (b) The angle is $\angle EKO$. We get $\cos\angle EKO = \frac{4}{\sqrt{84}}$, so the angle is about $64.1^\circ$.'
            points: 4
          # source: VBE 2026 pilot A II task 17
          - problem: 'A cafe runs a promotion. Each visitor who buys a cup of coffee draws one sticker at random from a box. The sticker shows a discount for the next visit. The box holds 10 stickers with a 5 % discount, 6 stickers with a 10 % discount and 4 stickers that show a free bun. (a) Find the probability that the first visitor draws a sticker with a 10 % discount. (b) The first visitor drew a sticker with a 5 % discount. The stickers do not go back into the box. Find the probability that the second visitor draws a free bun sticker. (c) Two friends buy a cup of coffee at the same time. Each friend draws one sticker from the box. The stickers do not go back into the box. Find the probability that both stickers show the same discount: both 5 %, or both 10 %, or both a free bun.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"exact"}},{"name":"second","contract":{"kind":"exact"}},{"name":"friends","contract":{"kind":"exact"}}]}
            answer: 'first = 3/10; second = 4/19; friends = 33/95'
            solution_sketch: '(a) We get $\frac{6}{20} = \frac{3}{10}$. (b) After the draw 19 stickers remain and 4 of them show a free bun, so $\frac{4}{19}$. (c) The sum is $\frac{10 \cdot 9 + 6 \cdot 5 + 4 \cdot 3}{20 \cdot 19} = \frac{132}{380} = \frac{33}{95}$.'
            points: 6
          # source: VBE 2026 pilot A II task 19
          - problem: 'A company has 5 employees: Lina, Ignas, Vilija, Martynas and Ona. For each group of four of them, the sum of their ages in years is found. The five sums are 132, 138, 113, 131 and 126. Find the age in years of the oldest employee.'
            answer_contract: {"kind":"exact"}
            answer: '47'
            solution_sketch: 'Each employee is left out of exactly one group. So the five sums add up to $4$ times the total age. The total is $\frac{640}{4} = 160$. The oldest employee is left out of the least sum, so the age is $160 - 113 = 47$.'
            points: 4
          # source: VBE 2026 pilot A II task 20
          - problem: 'A cube $ABCDEFGH$ has the edge length $a$. The segments $AF$ and $BG$ are diagonals of two adjacent faces of the cube. The lines $AF$ and $BG$ are skew. Find the distance between the lines $AF$ and $BG$.'
            answer_contract: {"kind":"function","vars":["a"]}
            answer: 'sqrt(3)/3*a'
            solution_sketch: 'The line $AF$ is parallel to a plane through $BG$ and a vertex of the cube. The distance between the lines equals the distance from $F$ to this plane. A volume equation gives $\frac{\sqrt3}{6}a^2 h = \frac{a^3}{6}$. So $h = \frac{\sqrt3}{3}a$.'
            points: 3
          # source: VBE 2026 pilot A II task 15(a)
          - problem: 'A closed cylinder has the total surface area $50\ \mathrm{cm}^2$. The radius of its base is $r$ cm. Show that the volume $V$ in $\mathrm{cm}^3$ of this cylinder is the function $V(r) = 25r - \pi r^3$.'
            answer_contract: {"kind":"written"}
            answer: 'The total area gives $2\pi r^2 + 2\pi r H = 50$, so $H = \frac{25 - \pi r^2}{\pi r}$. Then $V = \pi r^2 H = 25r - \pi r^3$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the equation $2\pi r^2 + 2\pi r H = 50$. 1 point: the height $H = \frac{25 - \pi r^2}{\pi r}$. 1 point: the volume function $V(r) = 25r - \pi r^3$.'
            points: 3
          # source: VBE 2026 pilot A II task 18
          - problem: 'It is known that $a = \log_2 m$ and $b = \log_m 7$, where $m > 0$ and $m \ne 1$. Show that $\log_{14} m = \frac{a}{1 + ab}$.'
            answer_contract: {"kind":"written"}
            answer: 'Change the base to $2$: $\log_{14} m = \frac{a}{1 + \log_2 7}$. The product $ab$ equals $\log_2 7$, so the fraction equals $\frac{a}{1 + ab}$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the change of the logarithm, $\log_{14} m = \frac{\log_2 m}{\log_2 14} = \frac{a}{1 + \log_2 7}$. 1 point: the product $ab = \log_2 7$. 1 point: the complete proof.'
            points: 3
        constraints: 'The open tasks 11 to 20 of the official paper; decidable items in paper order, then the written items; the figure tasks 14, 16 and 20 are described in words.'
    diagnostic_exemplar:
      # source: VBE 2026 pilot A II task 5
      problem: 'Agnė thinks of a three-digit natural number. Find the probability that all three digits of the number are different.'
      answer_contract: {"kind":"exact"}
      answer: '18/25'
      solution_sketch: 'There are $900$ three-digit numbers. Of them $9 \cdot 9 \cdot 8 = 648$ have three different digits. The probability is $\frac{648}{900} = \frac{18}{25}$.'
