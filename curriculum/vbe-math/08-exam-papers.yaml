          - problem: 'The sides of a triangle have the lengths $a$, $b$ and $c$. The radius of the inscribed circle is $r$. The radius of the circumscribed circle is $R$. Prove that $\frac{1}{2Rr} = \frac{1}{ab} + \frac{1}{bc} + \frac{1}{ca}$.'
            answer_contract: {"kind":"written"}
            answer: 'The area is $S = pr = \frac{r(a + b + c)}{2}$ and $S = \frac{abc}{4R}$. So $r = \frac{2S}{a + b + c}$ and $R = \frac{abc}{4S}$. Then $2Rr = \frac{abc}{a + b + c}$, and $\frac{1}{2Rr} = \frac{a + b + c}{abc} = \frac{1}{bc} + \frac{1}{ac} + \frac{1}{ab}$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: $r$ expressed with $S$ and the sides. 1 point: $R$ expressed with $S$ and the sides. 1 point: the correct transformation and the proof of the equality.'
