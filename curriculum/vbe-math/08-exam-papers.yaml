            solution_sketch: 'The argument of the logarithm must be positive. So $1 - 4x > 0$ and $x < \frac14$.'
            points: 1
          # source: VBE 2026 repeat A II task 3
          - problem: 'Rationalize the denominator of the fraction $\frac{m}{\sqrt{m} - \sqrt{3}}$.'
            answer_contract: {"kind":"function","vars":["m"]}
            answer: '(m*sqrt(m)+m*sqrt(3))/(m-3)'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{m} + \sqrt{3}$. The bottom becomes $m - 3$. The top becomes $m(\sqrt{m} + \sqrt{3})$.'
            points: 1
          # source: VBE 2026 repeat A II task 5
          - problem: 'The unit circle has its center at $O(0; 0)$. The point $A$ is on the circle in the first quadrant, with abscissa $0.6$ and ordinate $0.8$. The line $OA$ meets the line $x = 1$ at the point $B$, and the ordinate of $B$ is $\frac{4}{3}$. The angle $\alpha$ is the rotation angle from the positive Ox axis to the ray $OA$. Find the value of $\tan\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '4/3'
            visual: 0
            solution_sketch: 'The value $\tan\alpha$ is the slope of the line $OA$. The line passes through $O(0; 0)$ and $B\left(1; \frac43\right)$. So $\tan\alpha = \frac43$. The point $A$ gives the same value: $\frac{0.8}{0.6} = \frac43$.'
            points: 1
          # source: VBE 2026 repeat A II task 6
          - problem: 'The radius of the base of a cylinder grows by $50\%$. The height stays the same. Find how many times the volume of the cylinder grows.'
            answer_contract: {"kind":"exact"}
            answer: '9/4'
            solution_sketch: 'The new radius is $1.5r$. The volume has the factor $r^2$. So the volume grows $1.5^2 = \frac94$ times.'
            points: 1
          # source: VBE 2026 repeat A II task 7
          - problem: 'It is known that $\log_a b + \log_b a = 9$. Find the value of the expression $\log_a(b^2) + \log_b(a^2)$.'
            answer_contract: {"kind":"exact"}
            answer: '18'
            solution_sketch: 'Move each exponent in front of the logarithm. The expression equals $2(\log_a b + \log_b a) = 2 \cdot 9 = 18$.'
            points: 1
          # source: VBE 2026 repeat A II task 8
          - problem: 'It is known that $\sin\alpha = \frac35$ and $\tan\alpha < 0$. Find the value of $\cos\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '-4/5'
            solution_sketch: 'The tangent is negative and the sine is positive. So $\alpha$ is in the second quarter and the cosine is negative. We get $\cos\alpha = -\sqrt{1 - \frac{9}{25}} = -\frac45$.'
            points: 1
          # source: VBE 2026 repeat A II task 9
          - problem: 'Find the 4th term of the expansion of $\left(\frac{4x}{5} + \frac{5}{2x}\right)^6$, written by the binomial formula. Give the answer as a natural number.'
            answer_contract: {"kind":"exact"}
            answer: '160'
            solution_sketch: 'The 4th term is $\binom{6}{3}\left(\frac{4x}{5}\right)^3\left(\frac{5}{2x}\right)^3$. The powers of $x$ cancel. We get $20 \cdot \frac{64}{125} \cdot \frac{125}{8} = 160$.'
            points: 1
          # source: VBE 2026 repeat A II task 10
          - problem: 'It is known that $a^{\log_3 7} = 27$. Find the natural number that equals $a^{(\log_3 7)^2}$.'
            answer_contract: {"kind":"exact"}
            answer: '343'
            solution_sketch: 'Let $t = \log_3 7$. Then $a^{t^2} = (a^t)^t = 27^t = 3^{3t}$. Also $3^t = 7$. So the value is $7^3 = 343$.'
            points: 1
        constraints: 'The 1-point tasks of the official paper in paper order; task 4 is the diagnostic exemplar; task 1 gives its Venn diagram in words; the unit-circle task 5 has a coordinate visual and its facts in words; the tasks keep the official numbers and givens.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp11-equations, vbe-cp16-trig-equations, vbe-cp07-progressions, vbe-cp18-derivative-rules, vbe-cp20-integral, vbe-cp14-plane-vectors, vbe-cp22-space-angles, vbe-cp23-solids, vbe-cp25-probability-models, vbe-cp26-random-variables, vbe-cp19-function-study]
        exemplars:
          # source: VBE 2026 repeat A II task 11
          - problem: 'Solve the equations. (a) $\left(\frac13\right)^{5 - x} = 9 \cdot 9^x$. (b) $\sin(2x) + \sin(x) = 0$. Give only the solutions of this second equation in the interval $[0; 2\pi)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"exact"}},{"name":"second","contract":{"kind":"set"}}]}
            answer: 'first = -7; second = {0, 2*pi/3, pi, 4*pi/3}'
            solution_sketch: 'For (a), write both sides with base $3$: $3^{x - 5} = 3^{2x + 2}$. So $x - 5 = 2x + 2$ and $x = -7$. For (b), $\sin x (2\cos x + 1) = 0$. Then $\sin x = 0$ or $\cos x = -\frac12$. In $[0; 2\pi)$ the solutions are $0$, $\frac{2\pi}{3}$, $\pi$ and $\frac{4\pi}{3}$.'
            points: 6
          # source: VBE 2026 repeat A II task 12
          - problem: 'A tower stands on a base. It is built when one cube is put on another cube. Each floor of the tower holds one cube. The edge of the bottom cube is $1$ long. The edge of each next cube is $2$ times shorter than the edge of the cube put before it. Find the height of such a tower that is built from infinitely many cubes.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'The edges form an infinite geometric progression with $b_1 = 1$ and $q = \frac12$. The height is the sum $\frac{b_1}{1 - q} = \frac{1}{1 - \frac12} = 2$.'
            points: 3
          # source: VBE 2026 repeat A II task 13
          - problem: 'The function $f(x) = x^3 + x^2 + mx + 1$ is given for $x \in \mathbb{R}$. Find the real value of $m$ for which this function has exactly one critical point.'
            answer_contract: {"kind":"exact"}
            answer: '1/3'
            solution_sketch: 'We have $f''(x) = 3x^2 + 2x + m$. It exists for all $x$. So the critical points are the roots of $3x^2 + 2x + m = 0$. One root means $D = 4 - 12m = 0$, so $m = \frac13$.'
            points: 3
          # source: VBE 2026 repeat A II task 14(b,c)
          - problem: 'The curve $y = f(x) = 2^x$, the $x$-axis and the lines $x = -2$ and $x = 2$ bound a curvilinear trapezoid. Eight rectangles of equal width stand under the curve in this trapezoid. Their bases lie on the $x$-axis between $x = -2$ and $x = 2$. The upper left corner of each rectangle lies on the curve. The areas of the rectangles are $A_1, A_2, \ldots, A_8$. The rectangle of area $A_1$ is the highest one. It is known that these eight areas form a geometric progression. (a) Find the sum of all terms of this progression. (b) The trapezoid turns about the $x$-axis and forms a solid of revolution. Find the volume of this solid. Give the answer with $\pi$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sum","contract":{"kind":"exact"}},{"name":"volume","contract":{"kind":"exact"}}]}
            answer: 'sum = 15*(sqrt(2)+1)/8; volume = 255*pi/(16*ln(4))'
            solution_sketch: 'The width is $\frac{4}{8} = \frac12$. We get $A_1 = \frac12 \cdot 2^{1.5} = \sqrt2$ and $A_2 = \frac12 \cdot 2 = 1$. So $q = \frac{1}{\sqrt2}$ and $S_8 = \frac{\sqrt2 (1 - q^8)}{1 - q} = \frac{15(\sqrt2 + 1)}{8}$. The volume is $\pi \int_{-2}^{2} 4^x\,dx = \pi \cdot \frac{16 - \frac{1}{16}}{\ln 4} = \frac{255\pi}{16 \ln 4}$.'
            points: 6
          # source: VBE 2026 repeat A II task 15
          - problem: 'The right trapezoid $ABCD$ has $CD \perp BC$ and $CD \perp AD$. The angle $B$ equals $120^\circ$, $BC = 10$ and $AD = 12$. It is known that $\vec{BC} = \vec{a}$. (a) Express the sum $\vec{AB} + \vec{CD}$ with the vector $\vec{a}$. (b) Find the scalar product of the vectors $\vec{AB}$ and $\vec{CD}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sum","contract":{"kind":"function","vars":["a"]}},{"name":"product","contract":{"kind":"exact"}}]}
            answer: 'sum = 1/5*a; product = -12'
            solution_sketch: 'Let $E$ be the point on $AD$ with $BE \parallel CD$. Then $\vec{CD} = \vec{BE}$, so $\vec{AB} + \vec{CD} = \vec{AE}$. We have $AE = 12 - 10 = 2$ and $\vec{AE} = \frac{1}{5}\vec{a}$. In triangle $ABE$ the angle $ABE$ is $30^\circ$, so $AB = 4$ and $CD = BE = 2\sqrt3$. The angle between $\vec{AB}$ and $\vec{CD}$ is $150^\circ$. So the product is $4 \cdot 2\sqrt3 \cdot \cos 150^\circ = -12$.'
            points: 5
          # source: VBE 2026 repeat A II task 17(b,c,d)
          - problem: 'A cylinder is inscribed in a ball of radius $5$. The circles of both bases of the cylinder lie on the surface of the ball. The height of the cylinder is $h$, where $h \in (0; 10)$. The volume of the cylinder is $V(h) = \frac14\pi h(100 - h^2)$. (a) Find the derivative $V''(h)$. (b) Find the value of $h$ for which the volume $V(h)$ is largest. (c) Find the volume of the cylinder for $h = 4$. Give the answer with $\pi$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"derivative","contract":{"kind":"function","vars":["h"]}},{"name":"height","contract":{"kind":"exact"}},{"name":"volume","contract":{"kind":"exact"}}]}
            answer: 'derivative = 1/4*pi*(100-3*h^2); height = 10*sqrt(3)/3; volume = 84*pi'
            solution_sketch: 'We have $V(h) = 25\pi h - \frac14\pi h^3$. So $V''(h) = 25\pi - \frac34\pi h^2$. The equation $V''(h) = 0$ gives $h^2 = \frac{100}{3}$ and $h = \frac{10\sqrt3}{3}$. The derivative changes sign from plus to minus at this point, so it is the maximum. Also $V(4) = \frac14\pi \cdot 4 \cdot 84 = 84\pi$.'
            points: 6
          # source: VBE 2026 repeat A II task 18
          - problem: 'Two equal squares $ABCD$ and $AB_1C_1D$ lie in space and have the common side $AD$. The planes of these squares form an angle of $60^\circ$. Find the cosine of the angle between the diagonals $BD$ and $B_1D$ of these squares.'
            answer_contract: {"kind":"exact"}
            answer: '3/4'
            solution_sketch: 'Let the side be $a$. Then $BD = B_1D = \sqrt2 a$. Triangle $ABB_1$ has $AB = AB_1 = a$ and the angle $60^\circ$ at $A$, so $BB_1 = a$. The cosine theorem in triangle $DBB_1$ gives $a^2 = 4a^2 - 4a^2\cos\varphi$. So $\cos\varphi = \frac34$.'
            points: 3
          # source: VBE 2026 repeat A II task 20
          - problem: 'The derivative of a function $y = f(x)$ is $f''(x) = ax + b + e^x$, where $x \in \mathbb{R}$. The graph of $f$ contains the point $(0; 1)$. The slope of the tangent to this graph at the point $(1; f(1))$ equals $2$. The curvilinear trapezoid bound by the graph of $y = f''(x)$, the coordinate axes and the line $x = 1$ has area $3$. Here $f''(x) > 0$ for $x \in [0; 1]$. Find $a$ and $b$, and write the function $f(x)$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '-2*x^2+(6-e)*x+e^x'
            solution_sketch: 'We have $f(x) = \frac{ax^2}{2} + bx + e^x + C$ and $f(0) = 1$, so $C = 0$. The slope gives $a + b + e = 2$. The area gives $\frac{a}{2} + b + e - 1 = 3$. Subtract: $\frac a2 = -2$, so $a = -4$ and $b = 6 - e$. Then $f(x) = -2x^2 + (6 - e)x + e^x$.'
            points: 4
          # source: VBE 2026 repeat A II task 14(a)
          - problem: 'The curve $y = f(x) = 2^x$, the $x$-axis and the lines $x = -2$ and $x = 2$ bound a curvilinear trapezoid. Eight rectangles of equal width stand under the curve in this trapezoid. Their bases lie on the $x$-axis between $x = -2$ and $x = 2$. The upper left corner of each rectangle lies on the curve. The area of the highest rectangle is $A_1$. Show that $A_1 = \sqrt2$.'
            answer_contract: {"kind":"written"}
            answer: 'The width of each rectangle is $\frac{2 + 2}{8} = \frac12$. The highest rectangle has the height $f(1.5) = 2^{1.5} = 2\sqrt2$. So $A_1 = \frac12 \cdot 2\sqrt2 = \sqrt2$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: at least one correct dimension of the highest rectangle. 1 point: the correct area $A_1 = \frac12 \cdot 2\sqrt2 = \sqrt2$.'
            points: 2
          # source: VBE 2026 repeat A II task 16(a)
          - problem: 'A box holds seven balls of the same size: one red, two yellow and four green. A green ball carries the number $4$. A yellow ball carries the number $-5$. The red ball carries the number $n$, where $n \in (0; 4)$. Two balls are drawn from the box at random. Show that the probability of the event "one drawn ball is green and the other is red" equals $\frac{4}{21}$.'
            answer_contract: {"kind":"written"}
            answer: 'The number of all outcomes is $\binom72 = 21$. The favorable outcomes are $4 \cdot 1 = 4$. So the probability is $\frac{4}{21}$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: a correct method and at least one of the numbers $21$ and $4$. 1 point: the correct justification of the probability $\frac{4}{21}$. The product $\frac47 \cdot \frac26$ gives the same points.'
            points: 2
          # source: VBE 2026 repeat A II task 16(b)
          - problem: 'A box holds seven balls of the same size: one red, two yellow and four green. A green ball carries the number $4$. A yellow ball carries the number $-5$. The red ball carries the number $n$, where $n \in (0; 4)$. Two balls are drawn from the box at random. The random variable $X$ is the product of the two numbers on the drawn balls. Show that the possible values of $X$ are $-5n$, $4n$, $-20$, $16$ and $25$. Then find the probability of each value. Then find the value of $n$ for which the expected value $\mathrm{E}(X)$ equals $-1$.'
            answer_contract: {"kind":"written"}
            answer: 'List the products of all pairs of balls to get the five values. The probabilities of $-5n$, $4n$, $-20$, $16$ and $25$ are $\frac{2}{21}$, $\frac{4}{21}$, $\frac{8}{21}$, $\frac27$ and $\frac{1}{21}$. The equation $\mathrm{E}(X) = -1$ gives $6n = 18$, so $n = 3$.'
            solution_sketch: 'Official scheme, 5 points. 1 point: the justification of the five values. 2 points: the probabilities, with 1 point for at least one correct value and 1 point for the full table. 2 points: 1 point for the expression of $\mathrm{E}(X)$ and 1 point for the answer $n = 3$.'
            points: 5
          # source: VBE 2026 repeat A II task 17(a)
          - problem: 'A cylinder is inscribed in a ball of radius $5$ with the center $O$. The circles of both bases of the cylinder lie on the surface of the ball. The height of the cylinder is $h$. Show that the volume $V$ of the cylinder is $V(h) = \frac14\pi h(100 - h^2)$, where $h \in (0; 10)$.'
            answer_contract: {"kind":"written"}
            answer: 'The diameter of the base is $\sqrt{100 - h^2}$ by the right triangle with the hypotenuse $10$ and the leg $h$. So $r^2 = \frac{100 - h^2}{4}$. Then $V = \pi r^2 h = \frac14\pi h(100 - h^2)$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the correct radius or diameter of the base. 1 point: the correct justification of the volume function.'
            points: 2
          # source: VBE 2026 repeat A II task 19
          - problem: 'Show that $\sin\left(\frac{\pi}{12}\right) = \frac{\sqrt6 - \sqrt2}{4}$.'
            answer_contract: {"kind":"written"}
            answer: 'Write $\frac{\pi}{12} = \frac{\pi}{4} - \frac{\pi}{6}$. Use the sine of a difference: $\sin 45^\circ \cos 30^\circ - \cos 45^\circ \sin 30^\circ$. This equals $\frac{\sqrt2}{2} \cdot \frac{\sqrt3}{2} - \frac{\sqrt2}{2} \cdot \frac12 = \frac{\sqrt6 - \sqrt2}{4}$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the angle $\frac{\pi}{12}$ as a difference of two angles. 1 point: the correct use of the formula for the sine of a difference. 1 point: the correct justification of the given equality.'
            points: 3
        constraints: 'The open tasks 11 to 20 of the official paper; decidable items in paper order, then the written items. Task 11(b) asks for the solutions in the interval from 0 to 2 pi only, so that a typed answer is possible.'
    diagnostic_exemplar:
      # source: VBE 2026 repeat A II task 4
      problem: 'Find how many different four-digit natural numbers have the same first digit and the same last digit.'
      answer_contract: {"kind":"exact"}
      answer: '900'
      solution_sketch: 'The first digit has 9 choices. The two middle digits have 10 choices each. The last digit equals the first digit. The product is $9 \cdot 10 \cdot 10 = 900$.'
