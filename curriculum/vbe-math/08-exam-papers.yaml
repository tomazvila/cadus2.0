        exemplars:
          # source: VBE 2023 repeat task 1
          - problem: 'Find the intersection of the intervals $(-\infty; 1)$ and $(-2; 1]$. Write the answer as an inequality in $x$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-2 < x < 1'
            solution_sketch: 'The numbers of the intersection are less than $1$ and greater than $-2$. The number $1$ is not in the first interval. So the intersection is $(-2; 1)$.'
            points: 1
          # source: VBE 2023 repeat task 2
          - problem: 'A bank pays $4.3\%$ compound interest each year on a fixed-term deposit. The interest is added to the value of the deposit every year. The first value of the deposit is $770$ euros. Find the value of the deposit after four years. Round the answer to a whole number of euros.'
            answer_contract: {"kind":"exact"}
            answer: '911'
            solution_sketch: 'The value is $770 \cdot 1.043^4 \approx 911.2$. The rounded value is $911$.'
            points: 1
          # source: VBE 2023 repeat task 3
          - problem: 'A pump fills a cylindrical pool with height $1$ m and base radius $2$ m in $3$ hours. The pump works at the same rate. It fills equal volumes in equal times. A second cylindrical pool has height $2$ m and base radius $4$ m. Find how many hours the pump needs to fill the second pool.'
            answer_contract: {"kind":"exact"}
            answer: '24'
            solution_sketch: 'The first volume is $\pi \cdot 2^2 \cdot 1 = 4\pi$. The second volume is $\pi \cdot 4^2 \cdot 2 = 32\pi$. This is $8$ times more, so the time is $8 \cdot 3 = 24$ hours.'
            points: 1
          # source: VBE 2023 repeat task 4
          - problem: 'These four functions are given: $f(x) = \sqrt{x}$, $g(x) = \sin x$, $k(x) = 0.5^x$ and $h(x) = \log_2 x$. Exactly one of them is decreasing on its whole domain. Type the name of that function.'
            answer_contract: {"kind":"exact"}
            answer: 'k'
            solution_sketch: 'The functions $\sqrt{x}$ and $\log_2 x$ increase. The function $\sin x$ increases and decreases in turn. The base $0.5$ is less than $1$, so $0.5^x$ decreases.'
            points: 1
          # source: VBE 2023 repeat task 7
          - problem: 'Simplify the expression $2^n \cdot 4^n \cdot 8^n$ to the form $2^{kn}$. Find the number $k$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'Write $4 = 2^2$ and $8 = 2^3$. The product is $2^n \cdot 2^{2n} \cdot 2^{3n} = 2^{6n}$. So $k = 6$.'
            points: 1
          # source: VBE 2023 repeat task 8
          - problem: 'Find the number of points where the graphs of the functions $f(x) = \sin x$ and $g(x) = \frac{1}{3}$ meet, for $x \in [0; 5\pi]$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'The sine is positive on $(0; \pi)$, $(2\pi; 3\pi)$ and $(4\pi; 5\pi)$. On each interval the value $\frac13$ is taken two times. So there are $6$ points.'
            points: 1
          # source: VBE 2023 repeat task 9
          - problem: 'Find the antiderivative $y = F(x)$ of the function $f(x) = 1 - 3x^2$, if $F(2) = 0$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '-x^3+x+6'
            solution_sketch: 'We have $F(x) = x - x^3 + C$. The condition $F(2) = 0$ gives $2 - 8 + C = 0$, so $C = 6$. Then $F(x) = -x^3 + x + 6$.'
            points: 1
          # source: VBE 2023 repeat task 10
          - problem: 'The side of an equilateral triangle has length $a$. The circle inscribed in this triangle has radius $r$. Express $a$ with $r$.'
            answer_contract: {"kind":"function","vars":["r"]}
            answer: '2*sqrt(3)*r'
            solution_sketch: 'The radius of the inscribed circle is $r = \frac{a\sqrt{3}}{6}$. So $a = \frac{6r}{\sqrt{3}} = 2\sqrt{3}\,r$.'
            points: 1
          # source: VBE 2023 repeat task 11
          - problem: 'Find the derivative $f''(x)$ of the function $f(x) = 2x^3 - 15x^2 + 24x + 8$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '6*x^2-30*x+24'
            solution_sketch: 'Differentiate each term. We get $f''(x) = 6x^2 - 30x + 24$.'
            points: 1
          # source: VBE 2023 repeat task 13
          - problem: 'In the triangle $ABC$ the sides are $AB = 3$, $BC = 5$ and $AC = 7$. Find $\cos \angle ABC$.'
            answer_contract: {"kind":"exact"}
            answer: '-1/2'
            solution_sketch: 'The law of cosines gives $\cos \angle ABC = \frac{3^2 + 5^2 - 7^2}{2 \cdot 3 \cdot 5} = \frac{-15}{30} = -\frac12$.'
            points: 1
          # source: VBE 2023 repeat task 16
          - problem: 'The graph of a function $y = f(x)$ passes through the point $(2; -5)$. It is known that $f''(2) = 3$. Write the equation of the tangent to this graph at the point $(2; -5)$. Write $y$ in terms of $x$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '3*x-11'
            solution_sketch: 'The slope is $f''(2) = 3$. The tangent is $y = 3(x - 2) - 5$. So $y = 3x - 11$.'
            points: 1
          # source: VBE 2023 repeat task 17
          - problem: 'Simplify the expression $\frac{\sin \alpha - 2\sin^3 \alpha}{\cos 2\alpha}$.'
            answer_contract: {"kind":"function","vars":["alpha"]}
            answer: 'sin(alpha)'
            solution_sketch: 'The top is $\sin \alpha\,(1 - 2\sin^2 \alpha) = \sin \alpha \cos 2\alpha$. The factor $\cos 2\alpha$ cancels. The result is $\sin \alpha$.'
            points: 1
          # source: VBE 2023 repeat task 18
          - problem: 'The quadratic equation $x^2 + px + q = 0$ has two different real roots $x = a$ and $x = b$. Express $a^2 + b^2 + ab$ with $p$ and $q$.'
            answer_contract: {"kind":"function","vars":["p","q"]}
            answer: 'p^2-q'
            solution_sketch: 'Vieta''s formulas give $a + b = -p$ and $ab = q$. Then $a^2 + b^2 + ab = (a + b)^2 - ab = p^2 - q$.'
            points: 1
        constraints: 'The 1-point tasks of the official paper without sub-parts, in paper order. Task 5 is the diagnostic exemplar. Task 6 stands in figures_open.tsv. The old choice tasks become typed answers with the same mathematics.'
