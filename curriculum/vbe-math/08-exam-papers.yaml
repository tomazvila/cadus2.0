        exemplars:
          # source: VBE 2020 main task 1
          - problem: 'Simplify $\frac{25^{2020}}{5}$ to the form $5^k$. Find the exponent $k$.'
            answer_contract: {"kind":"exact"}
            answer: '4039'
            solution_sketch: 'We have $25^{2020} = 5^{4040}$. Divide by $5$ to get $5^{4039}$. So $k = 4039$.'
            points: 1
          # source: VBE 2020 main task 2
          - problem: 'In spring, the students of one school plan to tidy the 3 parks of their city. They give one day to each park. The three parks must be ready in the first five weekdays. Find the number of different schedules the students can make.'
            answer_contract: {"kind":"exact"}
            answer: '60'
            solution_sketch: 'The first park has 5 possible days, the second has 4 and the third has 3. The product is $5 \cdot 4 \cdot 3 = 60$.'
            points: 1
          # source: VBE 2020 main task 3
          - problem: 'For $x \neq -3$ and $x \neq 3$, simplify $\frac{x}{x-3} - \frac{x-1}{x+3}$ to one fraction.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '(7*x-3)/(x^2-9)'
            solution_sketch: 'The common denominator is $(x-3)(x+3) = x^2 - 9$. The numerator is $x(x+3) - (x-1)(x-3) = 7x - 3$.'
            points: 1
          # source: VBE 2020 main task 4
          - problem: 'A shop bought $a$ books at $b$ euros each and $b$ books at $a$ euros each. It is known that $a \neq b$. Find the average price of one book in euros. Write the answer with $a$ and $b$.'
            answer_contract: {"kind":"function","vars":["a","b"]}
            answer: '2*a*b/(a+b)'
            solution_sketch: 'The total cost is $ab + ba = 2ab$ euros. The number of books is $a + b$. The average price is $\frac{2ab}{a+b}$.'
            points: 1
          # source: VBE 2020 main task 5
          - problem: 'The points $A$ and $C$ are the ends of the diameter of a semicircle with center $O$. The point $B$ lies on the semicircle and $AB = AO$. Find the angle $BAC$ in degrees.'
            answer_contract: {"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}
            answer: '60'
            solution_sketch: 'We have $OB = OA$ because both are radii. Also $AB = AO$. So the triangle $AOB$ is equilateral and the angle $BAO$ is $60°$.'
            points: 1
          # source: VBE 2020 main task 6
          - problem: 'The function $f(x) = \frac{x+5}{2x+a}$ has the domain $(-\infty; 4) \cup (4; +\infty)$. Find the value of $a$.'
            answer_contract: {"kind":"exact"}
            answer: '-8'
            solution_sketch: 'The denominator is zero only at $x = 4$. So $2 \cdot 4 + a = 0$ and $a = -8$.'
            points: 1
          # source: VBE 2020 main task 7
          - problem: 'The graph of the function $y = f(x)$ is a parabola that opens upward. It meets the Ox axis at $x = 0$ and $x = 2$, and its vertex is below the Ox axis. The graph of $y = |f(x)|$ has a local maximum point between $x = 0$ and $x = 2$. Find the abscissa of this point.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'The part of the parabola below the Ox axis is reflected above the axis. The local maximum of $|f|$ is the reflected vertex. The vertex of $f$ is in the middle between the zeros $0$ and $2$, at $x = 1$.'
            points: 1
          # source: VBE 2020 main task 8
          - problem: 'The function is $f(x) = 3\sin(2x) + 2$. (a) Find the smallest value of $f$. (b) Find the largest value of $f$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"smallest","contract":{"kind":"exact"}},{"name":"largest","contract":{"kind":"exact"}}]}
            answer: 'smallest = -1; largest = 5'
            solution_sketch: 'The sine takes all values from $-1$ to $1$. So $3\sin(2x)$ takes all values from $-3$ to $3$. Add $2$ to get the range $[-1; 5]$.'
            points: 1
          # source: VBE 2020 main task 9
          - problem: 'Find the derivative of the function $f(x) = e^{x^2}$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '2*x*exp(x^2)'
            solution_sketch: 'Use the chain rule. The derivative of $x^2$ is $2x$. So $f''(x) = 2x \cdot e^{x^2}$.'
            points: 1
          # source: VBE 2020 main task 10
          - problem: 'Find the value of $\log_a 8 \cdot \log_2 a$, where $a > 0$ and $a \neq 1$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'We have $\log_a 8 = 3\log_a 2$. Also $\log_a 2 \cdot \log_2 a = 1$. So the product is $3$.'
            points: 1
          # source: VBE 2020 main task 12
          - problem: 'A triangle has the angles $45°$ and $30°$. The side of length $2$ lies opposite the angle $30°$. The side of length $x$ lies opposite the angle $45°$. Find the length $x$.'
            answer_contract: {"kind":"exact"}
            answer: '2*sqrt(2)'
            solution_sketch: 'Use the law of sines. We get $\frac{x}{\sin 45°} = \frac{2}{\sin 30°}$. So $x = 4 \cdot \frac{\sqrt{2}}{2} = 2\sqrt{2}$.'
            points: 1
          # source: VBE 2020 main task 16
          - problem: 'Real numbers $x$ and $y$ satisfy $2^x = 3$ and $3^y = 16$. Find the value of the product $xy$.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'We have $x = \log_2 3$ and $y = \log_3 16$. The product is $\log_2 3 \cdot \log_3 16 = \log_2 16 = 4$.'
            points: 1
        constraints: 'The 1-point tasks of the official paper in paper order; task 15 is the diagnostic exemplar; the tasks keep the official numbers and givens; the tasks 5, 7 and 12 give the figure in words.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp11-equations, vbe-cp14-plane-vectors, vbe-cp16-trig-equations, vbe-cp19-function-study, vbe-cp22-space-angles, vbe-cp23-solids, vbe-cp25-probability-models]
        visuals: [{"kind":"curve","x_min":"-6","x_max":"6","y_min":"-6","y_max":"6","x_tick":"1","y_tick":"1","curve":{"family":"polynomial","coefficients":["0","-25/12","0","1/12"]},"key_points":[{"x":"-5","y":"0","label":null},{"x":"0","y":"0","label":null},{"x":"5","y":"0","label":null},{"x":"1","y":"-2","label":null}],"asymptotes":[],"caption":"The graph of the derivative f' for x between -6 and 6"}]
        exemplars:
          # source: VBE 2020 main task 11
          - problem: 'Students of one class answered how many times they visited the theater in one year. 8 students visited once, 11 students visited twice, and 6 students visited $x$ times. (a) Find the value of $x$ if the mean number of visits per student is $2.4$. (b) Find the probability that a student of this class, chosen at random, visited the theater at most 2 times.'
            answer_contract: {"kind":"multipart","parts":[{"name":"visits","contract":{"kind":"exact"}},{"name":"probability","contract":{"kind":"exact"}}]}
            answer: 'visits = 5; probability = 19/25'
            solution_sketch: '(a) The class has 25 students. So $8 + 22 + 6x = 2.4 \cdot 25 = 60$ and $x = 5$. (b) $8 + 11 = 19$ students visited at most twice. The probability is $\frac{19}{25}$.'
            points: 2
          # source: VBE 2020 main task 13
          - problem: 'Denote $\sin 100° = k$. (a) Express $\cos^2 100°$ with $k$. (b) Express $\sin 260°$ as $c \cdot k$. Find the number $c$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"cosine","contract":{"kind":"function","vars":["k"]}},{"name":"factor","contract":{"kind":"exact"}}]}
            answer: 'cosine = 1-k^2; factor = -1'
            solution_sketch: '(a) We have $\cos^2 100° = 1 - \sin^2 100° = 1 - k^2$. (b) We have $\sin 260° = -\sin 80° = -\sin 100° = -k$.'
            points: 2
          # source: VBE 2020 main task 14
          - problem: 'A school office has two phones: a mobile phone and a fixed phone. The events that the mobile phone rings and that the fixed phone rings during one working hour are independent. Their probabilities are $0.8$ and $0.75$. (a) Find the probability that the fixed phone does not ring during one working hour. (b) Find the probability that at least one phone rings during one working hour.'
            answer_contract: {"kind":"multipart","parts":[{"name":"fixed","contract":{"kind":"exact"}},{"name":"atleast","contract":{"kind":"exact"}}]}
            answer: 'fixed = 1/4; atleast = 19/20'
            solution_sketch: '(a) The probability is $1 - 0.75 = 0.25$. (b) Neither phone rings with the probability $0.2 \cdot 0.25 = 0.05$. So at least one rings with the probability $0.95$.'
            points: 2
          # source: VBE 2020 main task 17
          - problem: 'The function $y = f(x)$ is defined on the interval $(-6; 6)$. The graph of its derivative $y = f''(x)$ crosses the Ox axis at the points $(-5; 0)$, $(0; 0)$ and $(5; 0)$. The derivative is negative for $x$ between $-6$ and $-5$, positive between $-5$ and $0$, negative between $0$ and $5$, and positive between $5$ and $6$. The graph of $f''$ passes through the point $(1; -2)$. The point $A(1; 2)$ belongs to the graph of $f$. (a) Find the intervals where the function $f$ decreases. Write the answer as an inequality. (b) Find the abscissa of the maximum point of the function $f$. (c) Write the equation of the tangent line to the graph of $f$ at the point $A$, in the form $y = kx + b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"decrease","contract":{"kind":"inequality_union"}},{"name":"maximum","contract":{"kind":"exact"}},{"name":"tangent","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'decrease = -6 < x < -5 or 0 < x < 5; maximum = 0; tangent = -2*x+4'
            visual: 0
            solution_sketch: '(a) The function $f$ decreases where $f'' < 0$. This is the case for $-6 < x < -5$ and for $0 < x < 5$. (b) The derivative changes from positive to negative at $x = 0$. So $0$ is the maximum point. (c) The slope is $f''(1) = -2$. The tangent is $y - 2 = -2(x - 1)$, so $y = -2x + 4$.'
            points: 3
          # source: VBE 2020 main task 18
          - problem: 'In a sports club, one workout costs 15 euros. The club has a promotion: every fifth workout gets a 60% discount. Simas has 250 euros for workouts. Find the largest number of workouts that he pays for with this money during the promotion.'
            answer_contract: {"kind":"exact"}
            answer: '18'
            solution_sketch: 'Five workouts cost $4 \cdot 15 + 0.4 \cdot 15 = 66$ euros. Three such groups cost $198$ euros and give 15 workouts. The 52 euros that remain pay for 3 more workouts at 15 euros each. The total is 18 workouts.'
            points: 2
          # source: VBE 2020 main task 19
          - problem: '(a) Solve the equation $\log_5(x - 7) = 0$. (b) Solve the equation $\sin x + \sin 2x = 0$. Give the solutions that lie in the interval $[0; 2\pi]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"exact"}},{"name":"second","contract":{"kind":"set"}}]}
            answer: 'first = 8; second = {0, 2*pi/3, pi, 4*pi/3, 2*pi}'
            solution_sketch: '(a) We have $x - 7 = 1$, so $x = 8$. (b) Write $\sin x (1 + 2\cos x) = 0$. Then $\sin x = 0$ or $\cos x = -\frac12$. On $[0; 2\pi]$ the solutions are $0$, $\frac{2\pi}{3}$, $\pi$, $\frac{4\pi}{3}$ and $2\pi$.'
            points: 4
          # source: VBE 2020 main task 20(b)
          - problem: 'Jurgita makes and sells bracelets. One bracelet costs 20 euros to make. She lowers the price of 38 euros by $x$ euros, where $0 \le x \le 18$. Then her monthly profit is $P(x) = -x^2 + 8x + 180$ euros. Find the value of $x$ for which the profit $P(x)$ is largest.'
            answer_contract: {"kind":"exact"}
            answer: '4'
            solution_sketch: 'The derivative is $P''(x) = -2x + 8$. It is zero at $x = 4$. The graph of $P$ is a parabola that opens downward, so $x = 4$ gives the largest profit.'
            points: 2
          # source: VBE 2020 main task 21(b)
          - problem: 'A triangular prism has bases that are equilateral triangles with side $6$. The lateral faces of the prism are squares with side $6$. A triangular pyramid has the same base area and the same volume as this prism. Find the height of the pyramid.'
            answer_contract: {"kind":"exact"}
            answer: '18'
            solution_sketch: 'The base area is $9\sqrt{3}$. The volume of the prism is $9\sqrt{3} \cdot 6 = 54\sqrt{3}$. For the pyramid, $\frac13 \cdot 9\sqrt{3} \cdot H = 54\sqrt{3}$. So $H = 18$.'
            points: 3
          # source: VBE 2020 main task 22(a,c)
          - problem: 'A natural number is a triangular number $T_n$ if it equals the sum of the first $n$ natural numbers: $T_1 = 1$, $T_2 = 1 + 2 = 3$, $T_3 = 1 + 2 + 3 = 6$, $T_4 = 1 + 2 + 3 + 4 = 10$, and so on. (a) Find the triangular number $T_{18}$. (b) Find the largest four-digit triangular number.'
            answer_contract: {"kind":"multipart","parts":[{"name":"t18","contract":{"kind":"exact"}},{"name":"largest","contract":{"kind":"exact"}}]}
            answer: 't18 = 171; largest = 9870'
            solution_sketch: '(a) We have $T_{18} = \frac{18 \cdot 19}{2} = 171$. (b) Solve $\frac{n(n+1)}{2} \le 9999$ to get $n \le 140$. So $T_{140} = \frac{140 \cdot 141}{2} = 9870$. Also $T_{141} = 10011$ has five digits.'
            points: 4
          # source: VBE 2020 main task 23
          - problem: 'The quadrilateral $ABCD$ is a parallelogram. The points $E$ and $F$ lie on the sides $AD$ and $BC$ so that $AE : ED = FC : BF = 1 : 2$. Denote $\vec{AB} = \vec{a}$ and $\vec{DA} = \vec{b}$. Express the vector $\vec{EF}$ with the vectors $\vec{a}$ and $\vec{b}$.'
            answer_contract: {"kind":"function","vars":["a","b"]}
            answer: 'a-b/3'
            solution_sketch: 'We have $\vec{EF} = \vec{EA} + \vec{AB} + \vec{BF}$. Here $\vec{EA} = \frac13\vec{b}$ and $\vec{BF} = -\frac23\vec{b}$. So $\vec{EF} = \vec{a} - \frac13\vec{b}$.'
            points: 2
          # source: VBE 2020 main task 24
          - problem: 'A company looks for students for summer work. 3 times more young men than young women answer the advertisement. The company chooses two of the students who answered at random. The probability that it chooses two young women is $\frac{1}{20}$. (a) Find the number of young women who answered. (b) Find the number of young men who answered.'
            answer_contract: {"kind":"multipart","parts":[{"name":"women","contract":{"kind":"exact"}},{"name":"men","contract":{"kind":"exact"}}]}
            answer: 'women = 4; men = 12'
            solution_sketch: 'Let $x$ be the number of young women. Then $3x$ young men answered and $4x$ students in all. The probability is $\frac{x}{4x} \cdot \frac{x-1}{4x-1} = \frac{1}{20}$. This gives $x = 4$, so there are 4 young women and 12 young men.'
            points: 3
          # source: VBE 2020 main task 26(c)
          - problem: 'The triangle $ABC$ is equilateral. The point $D$ lies on the side $BC$ and the point $E$ lies on the side $AC$. It is known that $BD : DC = CE : EA = 3 : 2$. The segments $BE$ and $AD$ meet at the point $F$. Find the ratio $AF : FD$.'
            answer_contract: {"kind":"exact"}
            answer: '10/9'
            solution_sketch: 'Let $AC = 5x$. The cosine rule in the triangle $ACD$ gives $AD^2 = 19x^2$. The similar triangles $ACD$ and $AFE$ give $AF = \frac{AE \cdot AC}{AD} = \frac{10x}{\sqrt{19}}$. Then $FD = AD - AF = \frac{9x}{\sqrt{19}}$. So $AF : FD = 10 : 9$.'
            points: 3
          # source: VBE 2020 main task 20(a)
          - problem: 'Jurgita makes and sells bracelets. One bracelet costs 20 euros to make. At first she sold bracelets at 38 euros each, and she sold 10 bracelets in a month on average. She saw that each price cut of $x$ euros raises the monthly sales by $x$ bracelets on average, where $0 \le x \le 18$. She cuts the price by $x$ euros. Show that her monthly profit equals $P(x) = -x^2 + 8x + 180$ euros.'
            answer_contract: {"kind":"written"}
            answer: 'The price is $38 - x$ and she sells $10 + x$ bracelets. The profit is $(38 - x)(10 + x) - 20(10 + x) = (18 - x)(10 + x) = -x^2 + 8x + 180$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: at least one correct expression, the income $(38 - x)(10 + x)$ or the cost $20(10 + x)$. 1 point: the correct profit formula.'
            points: 2
          # source: VBE 2020 main task 21(a)
          - problem: 'The net of a triangular prism holds three squares with side $6$ and two triangles. Show that the base area of this prism equals $9\sqrt{3}$.'
            answer_contract: {"kind":"written"}
            answer: 'Each side of the base triangle is a side of a square, so it equals $6$. The base is equilateral. Its area is $\frac12 \cdot 6 \cdot 6 \cdot \sin 60° = 9\sqrt{3}$.'
            solution_sketch: 'Official scheme, 1 point: a correct justification, the area formula $\frac12 \cdot 6 \cdot 6 \cdot \sin 60° = 9\sqrt{3}$.'
            points: 1
          # source: VBE 2020 main task 21(c)
          - problem: 'A triangular prism $ABCA_1B_1C_1$ has bases that are equilateral triangles with side $6$. The lateral faces are squares with side $6$. The vertex $C_1$ lies above $C$. A plane goes through the diagonals $AC_1$ and $BC_1$ of two lateral faces and through the base edge $AB$. The point $D$ is the midpoint of the edge $AB$. (a) Prove that $C_1D \perp AB$ and $CD \perp AB$. (b) Show that the tangent of the angle between the planes $ABC$ and $ABC_1$ equals $\frac{2\sqrt{3}}{3}$.'
            answer_contract: {"kind":"written"}
            answer: 'The segment $CD$ is a median of an equilateral triangle, so it is an altitude and $CD \perp AB$. The three perpendiculars theorem gives $C_1D \perp AB$. Here $CD = 3\sqrt{3}$, so the tangent equals $\frac{CC_1}{CD} = \frac{6}{3\sqrt{3}} = \frac{2\sqrt{3}}{3}$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the proof of the two perpendiculars. 1 point: the base altitude $CD = \sqrt{27} = 3\sqrt{3}$. 1 point: the tangent $\frac{2\sqrt{3}}{3}$.'
            points: 3
          # source: VBE 2020 main task 22(b)
          - problem: 'A natural number is a triangular number $T_n$ if it equals the sum of the first $n$ natural numbers: $T_1 = 1$, $T_2 = 3$, $T_3 = 6$, $T_4 = 10$, and so on. Prove that $7750$ is a triangular number.'
            answer_contract: {"kind":"written"}
            answer: 'Solve $\frac{n(n+1)}{2} = 7750$. The equation $n^2 + n - 15500 = 0$ has the discriminant $62001 = 249^2$. Its positive root is $n = 124$, a natural number. So $7750 = T_{124}$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the correct equation for $n$. 1 point: the answer yes, with the natural root $n = 124$.'
            points: 2
          # source: VBE 2020 main task 25
          - problem: 'The graph of $f(x) = x^5$ contains the point $A(a; a^5)$ with $a > 0$. A line goes through the origin $O$ and the point $A$. The points $B(0; a^5)$ and $C(a; 0)$ complete the rectangle $ABOC$. Prove that the area $S$ of the region bounded by the graph of $f$ and the line for $x \ge 0$ equals one third of the area of the rectangle $ABOC$.'
            answer_contract: {"kind":"written"}
            answer: 'The line is $y = a^4 x$. Then $S = \int_0^a (a^4 x - x^5)\,dx = \frac{a^6}{2} - \frac{a^6}{6} = \frac{a^6}{3}$. The rectangle has the area $a \cdot a^5 = a^6$. So $S$ is one third of it.'
            solution_sketch: 'Official scheme, 4 points. 1 point: the equation of the line. 1 point: the area $S$ as a definite integral. 1 point: the correct antiderivative with the limits. 1 point: the justification $S = \frac13 S_{ABOC}$.'
            points: 4
          # source: VBE 2020 main task 26(a)
          - problem: 'The triangle $ABC$ is equilateral. The point $D$ lies on the side $BC$ and the point $E$ lies on the side $AC$. It is known that $BD : DC = CE : EA = 3 : 2$. The segments $BE$ and $AD$ meet at the point $F$. Prove that $\angle AFE = 60°$.'
            answer_contract: {"kind":"written"}
            answer: 'The triangles $BEC$ and $ADB$ are congruent by two sides and the angle $60°$ between them. So $\angle BEC = \angle ADB = \alpha$. In the quadrilateral $CDFE$ the angles are $60°$, $180° - \alpha$, $\angle DFE$ and $\alpha$. The sum is $360°$, so $\angle DFE = 120°$ and $\angle AFE = 60°$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the proof that $\triangle BEC \cong \triangle ADB$, so the angles are equal. 1 point: the proof that $\angle AFE = 60°$.'
            points: 2
          # source: VBE 2020 main task 26(b)
          - problem: 'The triangle $ABC$ is equilateral. The point $D$ lies on the side $BC$ and the point $E$ lies on the side $AC$. The segments $BE$ and $AD$ meet at the point $F$. It is known that $\angle AFE = 60°$. Prove that the triangles $ACD$ and $AFE$ are similar.'
            answer_contract: {"kind":"written"}
            answer: 'The angle $CAD$ is common to both triangles. Also $\angle ACD = 60° = \angle AFE$. So the triangles are similar by two angles.'
            solution_sketch: 'Official scheme, 1 point: a correct justification with two equal angles.'
            points: 1
        constraints: 'The open tasks of the official paper; decidable items in paper order, then the written items; task 19(b) asks for the solutions in the interval from 0 to 2 pi; task 17 has a curve visual of the derivative.'
    diagnostic_exemplar:
      # source: VBE 2020 main task 15
      problem: 'Real numbers $a$, $b$, $c$ and $d$ satisfy $ac + ad + bc + bd = 68$ and $c + d = 4$. Find the value of $a + b$.'
      answer_contract: {"kind":"exact"}
      answer: '17'
      solution_sketch: 'Factor the left side: $ac + ad + bc + bd = (a + b)(c + d)$. So $(a + b) \cdot 4 = 68$ and $a + b = 17$.'
