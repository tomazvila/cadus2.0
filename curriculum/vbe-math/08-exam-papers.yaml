        exemplars:
          # source: VBE 2025 main A II task 1
          - problem: 'Find the value of $p$ for which the equality $x^3 \cdot \sqrt[4]{x} = x^p$ is true when $x > 0$.'
            answer_contract: {"kind":"exact"}
            answer: '13/4'
            solution_sketch: 'The fourth root of $x$ is $x^{1/4}$. Add the exponents: $p = 3 + \frac14 = \frac{13}{4}$.'
            points: 1
          # source: VBE 2025 main A II task 2
          - problem: 'Rationalize the denominator of the fraction $\frac{\pi}{\sqrt{2} - 1}$. Give the value of the new fraction without a root in the denominator.'
            answer_contract: {"kind":"exact"}
            answer: 'pi*(sqrt(2)+1)'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{2} + 1$. The bottom becomes $2 - 1 = 1$. The result is $\pi(\sqrt{2} + 1)$.'
            points: 1
          # source: VBE 2025 main A II task 3
          - problem: 'Simplify the expression $\tan(\alpha + 5\pi) - \tan(-\alpha)$.'
            answer_contract: {"kind":"function","vars":["alpha"]}
            answer: '2*tan(alpha)'
            solution_sketch: 'The period of the tangent is $\pi$, so $\tan(\alpha + 5\pi) = \tan\alpha$. The tangent is odd, so $\tan(-\alpha) = -\tan\alpha$. The difference is $2\tan\alpha$.'
            points: 1
          # source: VBE 2025 main A II task 4
          - problem: 'Solve the inequality $\log_2 x < \log_2 5$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '0 < x < 5'
            solution_sketch: 'The function $\log_2$ grows, and $x$ must be positive. So $0 < x < 5$.'
            points: 1
          # source: VBE 2025 main A II task 5
          - problem: 'The set $A = \{5.5;\ \frac{3}{7};\ \sqrt{5};\ 0;\ \pi;\ -12\frac{1}{7};\ 1.(3)\}$ is given. The digit 3 repeats in $1.(3)$. The set $I$ is the set of irrational numbers. Find the set $B = A \cap I$.'
            answer_contract: {"kind":"set"}
            answer: '{sqrt(5), pi}'
            solution_sketch: 'Rational numbers are fractions and decimals that end or repeat. So $5.5$, $\frac37$, $0$, $-12\frac17$ and $1.(3)$ are rational. Only $\sqrt{5}$ and $\pi$ are irrational.'
            points: 1
          # source: VBE 2025 main A II task 6
          - problem: 'The unit circle has its center at $O(0; 0)$. The point $M$ is on the circle, in the third quadrant: below the Ox axis and left of the Oy axis. The point $K$ is on the Ox axis, and the segment $MK$ is perpendicular to the segment $KO$. The length of $MK$ is $\frac{3}{4}$. The angle $\alpha$ is the rotation angle from the positive Ox axis, counterclockwise, to the ray $OM$. Find the value of $\sin\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '-3/4'
            solution_sketch: 'The value $\sin\alpha$ is the ordinate of the point $M$. The point $M$ is below the Ox axis, at the distance $MK = \frac34$ from it. So $\sin\alpha = -\frac34$.'
            points: 1
          # source: VBE 2025 main A II task 7
          - problem: 'The sides of the parallelogram $ABCD$ are $3$ and $8$, and $\angle ABC = 120^\circ$. Find the scalar product $\vec{BA} \cdot \vec{BC}$ of the vectors $\vec{BA}$ and $\vec{BC}$.'
            answer_contract: {"kind":"exact"}
            answer: '-12'
            solution_sketch: 'We have $|\vec{BA}| \cdot |\vec{BC}| \cdot \cos 120^\circ$. This equals $3 \cdot 8 \cdot (-\frac12) = -12$.'
            points: 1
          # source: VBE 2025 main A II task 8
          - problem: 'The distribution of a random variable $X$ is $\mathrm{P}(X = 0) = \frac{8}{125}$, $\mathrm{P}(X = 1) = \frac{16}{125}$, $\mathrm{P}(X = 2) = \frac{39}{125}$, $\mathrm{P}(X = 3) = \frac{54}{125}$ and $\mathrm{P}(X = 4) = \frac{8}{125}$. Find the expected value $\mathrm{E}X$ of this random variable.'
            answer_contract: {"kind":"exact"}
            answer: '288/125'
            solution_sketch: 'Multiply each value by its probability and add. We get $\frac{0 \cdot 8 + 1 \cdot 16 + 2 \cdot 39 + 3 \cdot 54 + 4 \cdot 8}{125} = \frac{288}{125}$.'
            points: 1
          # source: VBE 2025 main A II task 10
          - problem: 'The function $y = f(x)$ and its derivative $y = f''(x)$ are defined for all real $x$. The graph of the derivative $y = f''(x)$ is a parabola with the vertex $(1; -4)$. It meets the coordinate axes at the points $(-1; 0)$, $(3; 0)$ and $(0; -3)$. Use the graph of $f''$ to find the interval of $x$ in which the function $y = f(x)$ decreases.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-1 < x < 3'
            solution_sketch: 'The function decreases where $f''(x) < 0$. The parabola opens upward and lies below the $x$-axis between its zeros $-1$ and $3$. So $-1 < x < 3$.'
            points: 1
        constraints: 'The 1-point tasks of the official paper in paper order; task 9 is the diagnostic exemplar; the unit-circle task 6 gives its figure in words; the tasks keep the official numbers and givens.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp13-inequalities, vbe-cp07-progressions, vbe-cp18-derivative-rules, vbe-cp20-integral, vbe-cp19-function-study, vbe-cp23-solids, vbe-cp24-combinatorics, vbe-cp25-probability-models]
        exemplars:
          # source: VBE 2025 main A II task 11
          - problem: 'The fifth term of an arithmetic progression $(a_n)$ is $a_5 = 6$, and its common difference is $d = 3$. (a) Find $a_3 + a_9$. (b) Find the sum $S_{10}$ of the first ten terms of the progression $(a_n)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sum39","contract":{"kind":"exact"}},{"name":"s10","contract":{"kind":"exact"}}]}
            answer: 'sum39 = 18; s10 = 75'
            solution_sketch: '(a) We have $a_3 + a_9 = (a_5 - 2d) + (a_5 + 4d) = 2a_5 + 2d = 18$. (b) The first term is $a_1 = 6 - 4 \cdot 3 = -6$. So $S_{10} = \frac{2 \cdot (-6) + 3 \cdot 9}{2} \cdot 10 = 75$.'
            points: 4
          # source: VBE 2025 main A II task 12
          - problem: 'A cone has the base radius $\sqrt{5}$ and the slant height $\sqrt{15}$. (a) Find the area of the axial section of this cone. (b) Find the angle between the slant height of the cone and the plane of the base, in degrees. Round the answer to the nearest whole degree. Type the number of degrees only.'
            answer_contract: {"kind":"multipart","parts":[{"name":"section","contract":{"kind":"exact"}},{"name":"angle","contract":{"kind":"exact"}}]}
            answer: 'section = 5*sqrt(2); angle = 55'
            solution_sketch: '(a) The height is $h = \sqrt{15 - 5} = \sqrt{10}$. The axial section is a triangle with the base $2\sqrt{5}$ and the height $\sqrt{10}$. Its area is $\frac12 \cdot 2\sqrt{5} \cdot \sqrt{10} = 5\sqrt{2}$. (b) We have $\cos\alpha = \frac{\sqrt{5}}{\sqrt{15}}$, so $\alpha \approx 55^\circ$.'
            points: 3
          # source: VBE 2025 main A II task 13
          - problem: 'Solve the equations. (a) $\sqrt{2x - 3} = 3 - x$. (b) $2\sin(2x) = 5\cos x$. Write all solutions of the second equation as one expression in the integer $k$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"exact"}},{"name":"second","contract":{"kind":"function","vars":["k"]}}]}
            answer: 'first = 2; second = pi/2+pi*k'
            solution_sketch: '(a) Square both sides: $x^2 - 8x + 12 = 0$, so $x = 2$ or $x = 6$. The root $x = 6$ fails because $3 - x < 0$. (b) Write $\cos x\,(4\sin x - 5) = 0$. The equation $\sin x = \frac54$ has no solution. So $\cos x = 0$ and $x = \frac{\pi}{2} + \pi k$.'
            points: 7
          # source: VBE 2025 main A II task 14(b,c)
          - problem: 'The graphs of the functions $f(x) = -0.5(x + 1)^3 + 4$ and $g(x) = 1.5x + 3.5$ are drawn. The graph of $f$ meets the $x$-axis at the point $(1; 0)$. (a) The graphs of $f$ and $g$ meet at a point on the $y$-axis. Find the coordinates of this point. (b) The graph of $g$ meets the $x$-axis at the point $(-2\frac13; 0)$. Find the area of the region that the graph of $f$, the graph of $g$ and the $x$-axis bound. The region lies above the $x$-axis between $x = -2\frac13$ and $x = 1$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"point","contract":{"kind":"coordinates","arity":2}},{"name":"area","contract":{"kind":"exact"}}]}
            answer: 'point = (0, 7/2); area = 149/24'
            solution_sketch: '(a) We have $g(0) = 3.5$ and $f(0) = 3.5$. (b) The region is a triangle plus the area under $f$ from $0$ to $1$. The triangle has the area $\frac12 \cdot 3.5 \cdot \frac73 = \frac{49}{12}$. The integral is $\int_0^1 f(x)\,dx = \frac{17}{8}$. The total is $\frac{149}{24}$.'
            points: 4
          # source: VBE 2025 main A II task 15
          - problem: 'The vectors $\vec{a} = (2; -k)$ and $\vec{b} = (2 - k; 4)$ are given. Find all values of $k$ for which the vectors $\vec{a}$ and $\vec{b}$ are collinear.'
            answer_contract: {"kind":"set"}
            answer: '{-2, 4}'
            solution_sketch: 'Collinear vectors have proportional coordinates: $\frac{2}{2 - k} = \frac{-k}{4}$. This gives $k^2 - 2k - 8 = 0$. So $k = -2$ or $k = 4$.'
            points: 2
          # source: VBE 2025 main A II task 16
          - problem: 'It is known that $\lg 3 = a$ and $\lg 5 = b$. Express the number $\log_2 15$ with $a$ and $b$.'
            answer_contract: {"kind":"function","vars":["a","b"]}
            answer: '(a+b)/(1-b)'
            solution_sketch: 'Change the base: $\log_2 15 = \frac{\lg 15}{\lg 2}$. The top is $\lg 3 + \lg 5 = a + b$. The bottom is $\lg\frac{10}{5} = 1 - b$. The answer is $\frac{a + b}{1 - b}$.'
            points: 3
          # source: VBE 2025 main A II task 17(a,b)
          - problem: 'A box holds 16 cubes of the same size: 5 green, 4 red and 7 yellow. (a) In the first trial, a cube is drawn from the box at random and put on the table. Then a second cube is drawn at random and put next to the first. Find the probability that both drawn cubes are green. (b) In the second trial, this action is done 6 times: one cube is drawn from the box at random, its color is noted, and the cube goes back into the box. Find the probability that at least 3 of the 6 drawn cubes are red.'
            answer_contract: {"kind":"multipart","parts":[{"name":"green","contract":{"kind":"exact"}},{"name":"red","contract":{"kind":"exact"}}]}
            answer: 'green = 1/12; red = 347/2048'
            solution_sketch: '(a) We get $\frac{5}{16} \cdot \frac{4}{15} = \frac{1}{12}$. (b) The probability of red is $\frac14$ in each draw. Use the complement: $1 - \left[\left(\frac34\right)^6 + 6 \cdot \frac14 \cdot \left(\frac34\right)^5 + 15 \cdot \left(\frac14\right)^2 \cdot \left(\frac34\right)^4\right] = 1 - \frac{1701}{2048} = \frac{347}{2048}$.'
            points: 5
          # source: VBE 2025 main A II task 17(c)
          - problem: 'A box holds 16 cubes of equal size: 5 green, 4 red and 7 yellow. A game wheel is divided into three equal sectors with the numbers 10, 20 and 30. The arrow of the wheel stops in each sector with the same probability. In one experiment, one cube is drawn at random from the box. Then the arrow of the wheel is spun. Let $N$ be the number of the sector where the arrow stops. If the cube is green, the result is $2N$. If the cube is red, the result is $\frac{N}{2}$. If the cube is yellow, the result is $N$. Find the probability that the result is the number 20.'
            answer_contract: {"kind":"exact"}
            answer: '1/4'
            solution_sketch: 'The result 20 comes from a green cube with $N = 10$, or from a yellow cube with $N = 20$. A red cube needs $N = 40$, and no sector has this number. So $P = \frac{5}{16} \cdot \frac13 + \frac{7}{16} \cdot \frac13 = \frac{5}{48} + \frac{7}{48} = \frac14$.'
            points: 2
          # source: VBE 2025 main A II task 18(b,c)
          - problem: 'The regular triangular pyramid $SABC$ has the base $ABC$ and the lateral edge length $2$. The altitude $SO$ of the pyramid has the length $x$, where $x \in (0; 2)$. The volume of the pyramid is $V(x) = \frac{\sqrt{3}}{4}(4x - x^3)$. (a) Find the value of $x$ for which the volume of the pyramid is largest. (b) Now the base side of this pyramid equals $3$. The plane of a lateral face and the plane of the base form an angle with the size $\alpha$. Find $\cos\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"xmax","contract":{"kind":"exact"}},{"name":"cosalpha","contract":{"kind":"exact"}}]}
            answer: 'xmax = 2*sqrt(3)/3; cosalpha = sqrt(21)/7'
            solution_sketch: '(a) We have $V''(x) = \frac{\sqrt{3}}{4}(4 - 3x^2)$. It is zero at $x = \frac{2\sqrt{3}}{3}$, and the sign changes from plus to minus. (b) Let $D$ be the midpoint of $AB$. Then $\alpha = \angle SDO$. We get $OD = \frac{\sqrt{3}}{2}$ and $SD = \frac{\sqrt{7}}{2}$, so $\cos\alpha = \frac{\sqrt{21}}{7}$.'
            points: 6
          # source: VBE 2025 main A II task 19
          - problem: 'A line through the point $A(3; 0)$ touches the graph of the function $f(x) = e^{\frac{1 - x}{2}} + \ln(2 - x) + a$ at the point with the abscissa $1$. Find the value of the parameter $a$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'We have $f''(x) = -\frac12 e^{\frac{1 - x}{2}} - \frac{1}{2 - x}$, so $f''(1) = -\frac32$. Also $f(1) = 1 + a$. The tangent is $y = -\frac32(x - 1) + 1 + a$. The point $A(3; 0)$ gives $0 = -3 + 1 + a$, so $a = 2$.'
            points: 4
          # source: VBE 2025 main A II task 20
          - problem: 'A tortoise and a snail moved along a straight line toward each other. The tortoise went from a lettuce leaf to a cabbage. The snail went from the cabbage to the lettuce leaf. The tortoise started 6 hours later than the snail. When they met, the tortoise had gone 24 meters less than the snail. The tortoise reached the cabbage 8 hours after the meeting. The snail reached the lettuce leaf 9 hours after the meeting. Both animals moved at constant speeds for the whole trip. Find the speed of the snail in meters per hour. Type the number only.'
            answer_contract: {"kind":"exact"}
            answer: '8'
            solution_sketch: 'Let $x$ and $y$ be the speeds of the tortoise and the snail, and let $S$ be the path of the snail to the meeting. After the meeting: $8x = S$ and $9y = S - 24$. Before the meeting the times differ by $6$ hours: $\frac{S}{y} - \frac{S - 24}{x} = 6$. This gives $5y^2 - 32y - 64 = 0$, so $y = 8$.'
            points: 5
          # source: VBE 2025 main A II task 14(a)
          - problem: 'The graph of the function $f(x) = -0.5(x + 1)^3 + 4$ is drawn. Show that the point $(1; 0)$ belongs to the graph of $y = f(x)$.'
            answer_contract: {"kind":"written"}
            answer: 'Compute $f(1) = -0.5 \cdot 2^3 + 4 = 0$.'
            solution_sketch: 'Official scheme, 1 point. 1 point: a correct reason, for example $f(1) = -0.5 \cdot 8 + 4 = 0$, or the solution $x = 1$ of $f(x) = 0$.'
            points: 1
          # source: VBE 2025 main A II task 18(a)
          - problem: 'The regular triangular pyramid $SABC$ has the base $ABC$ and the lateral edge length $2$. The altitude $SO$ of the pyramid has the length $x$, where $x \in (0; 2)$. The base side has the length $y$. Express $y$ with $x$. Then show that the volume of the pyramid is $V(x) = \frac{\sqrt{3}}{4}(4x - x^3)$.'
            answer_contract: {"kind":"written"}
            answer: 'In the right triangle $SOC$ we have $CO = \frac{y\sqrt{3}}{3}$, so $x^2 + \frac{y^2}{3} = 4$ and $y = \sqrt{12 - 3x^2}$. Then $V = \frac13 \cdot \frac{\sqrt{3}}{4}y^2 \cdot x = \frac{\sqrt{3}}{4}(4x - x^3)$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: $CD$ and $CO$ in terms of the base side or the altitude. 1 point: $y = \sqrt{12 - 3x^2}$. 1 point: a correct proof of the volume formula $V = \frac13 S_{ABC} \cdot SO$.'
            points: 3
          # source: VBE 2025 main A II task 18(d)
          - problem: 'The regular triangular pyramid $SABC$ has the base $ABC$ and the altitude $SO$. Prove that $SC \perp AB$.'
            answer_contract: {"kind":"written"}
            answer: 'Let $D$ be the midpoint of $AB$. Then $AB \perp CD$ and $AB \perp SD$, so $AB \perp$ plane $SCD$. The line $SC$ lies in this plane, so $SC \perp AB$.'
            solution_sketch: 'Official scheme, 1 point. 1 point: a correct proof, by the theorem of three perpendiculars ($OC \perp AB$) or by $AB \perp$ plane $SCD$.'
            points: 1
        constraints: 'The open tasks 11 to 20 of the official paper; decidable items in paper order, then the written items; the wheel of sub-part 17(c) stands in the words of the problem.'
    diagnostic_exemplar:
      # source: VBE 2025 main A II task 9
      problem: 'A football team has 5 forwards and 7 midfielders. The coach picks 2 forwards and 4 midfielders for a match. Find the number of ways in which the coach picks them.'
      answer_contract: {"kind":"exact"}
      answer: '350'
      solution_sketch: 'Pick the forwards in $\binom52 = 10$ ways and the midfielders in $\binom74 = 35$ ways. The product is $350$.'
