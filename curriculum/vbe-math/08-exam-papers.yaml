        name: 'Short-answer tasks'
        key_prerequisites: [vbe-cp01-number-sets, vbe-cp03-powers, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp18-derivative-rules, vbe-cp11-equations]
        exemplars:
          # source: VBE 2024 sample A II task 1
          - problem: 'The set $D$ holds all divisors of $36$. The set $K$ holds the first three positive multiples of $6$. Find the sum of all elements of the set $A = D \setminus K$.'
            answer_contract: {"kind":"exact"}
            answer: '55'
            solution_sketch: 'We have $D = \{1, 2, 3, 4, 6, 9, 12, 18, 36\}$ and $K = \{6, 12, 18\}$. So $A = \{1, 2, 3, 4, 9, 36\}$. The sum is $55$.'
            points: 1
          # source: VBE 2024 sample A II task 2
          - problem: 'Find the value of the expression $\frac{\sqrt{1 - 2x + x^2}}{2|1 - x|}$ for $x = -2$.'
            answer_contract: {"kind":"exact"}
            answer: '1/2'
            solution_sketch: 'We have $\sqrt{1 - 2x + x^2} = |1 - x|$. So the fraction equals $\frac12$ for every $x \ne 1$.'
            points: 1
          # source: VBE 2024 sample A II task 3
          - problem: 'Find the derivative of the function $y = f(x) = (2x - 1)(1 - x)$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '-4*x+3'
            solution_sketch: 'Expand the product. We get $f(x) = -2x^2 + 3x - 1$. So $f''(x) = -4x + 3$.'
            points: 1
          # source: VBE 2024 sample A II task 4
          - problem: 'Solve the equation $(x^2 - 16)\sqrt{2 - x} = 0$. Give the set of all solutions.'
            answer_contract: {"kind":"set"}
            answer: '{-4, 2}'
            solution_sketch: 'The root needs $x \le 2$. A product is zero when one factor is zero. So $x = -4$ or $x = 2$. The value $x = 4$ is outside the domain.'
            points: 1
          # source: VBE 2024 sample A II task 6
          - problem: 'It is known that $\log_7(x) = 2$ and $\log_7(y) = 3$. Find the value of $\log_7\left(\frac{x^2}{y}\right)$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'We have $\log_7\left(\frac{x^2}{y}\right) = 2\log_7 x - \log_7 y = 4 - 3 = 1$.'
            points: 1
          # source: VBE 2024 sample A II task 7
          - problem: 'Find the value of $\cos(-\arctan(\tan 2))$.'
            answer_contract: {"kind":"exact"}
            answer: '-cos(2)'
            solution_sketch: 'The number $2$ is not in the interval $(-\frac{\pi}{2}; \frac{\pi}{2})$. So $\arctan(\tan 2) = 2 - \pi$. Then $\cos(2 - \pi) = -\cos 2$.'
            points: 1
          # source: VBE 2024 sample A II task 8
          - problem: 'It is known that $7^n - 5^n = K$ and $7^n + 5^n = L$. Express $7^{2n} - 5^{2n}$ with $K$ and $L$.'
            answer_contract: {"kind":"function","vars":["K","L"]}
            answer: 'K*L'
            solution_sketch: 'Use the difference of squares. We get $7^{2n} - 5^{2n} = (7^n - 5^n)(7^n + 5^n) = K \cdot L$.'
            points: 1
          # source: VBE 2024 sample A II task 9
          - problem: 'A ball is inscribed in a cube. Find the ratio $\frac{V_{\text{cube}}}{V_{\text{ball}}}$ of the volumes of the cube and the ball.'
            answer_contract: {"kind":"exact"}
            answer: '6/pi'
            solution_sketch: 'Let the edge of the cube be $a$. The radius of the ball is $\frac{a}{2}$. So the ratio is $\frac{a^3}{\frac43 \pi \frac{a^3}{8}} = \frac{6}{\pi}$.'
            points: 1
          # source: VBE 2024 sample A II task 10
          - problem: 'Find the value of the sum $\cos 0^\circ + \cos 2^\circ + \cos 4^\circ + \dots + \cos 356^\circ + \cos 358^\circ + \cos 360^\circ$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'The angles $0^\circ, 2^\circ, \dots, 358^\circ$ are 180 equal steps around the circle. Their cosines sum to $0$. The last term $\cos 360^\circ$ equals $1$. So the sum is $1$.'
            points: 1
        constraints: 'Nine 1-point tasks of the official sample paper in paper order; task 5 is the diagnostic exemplar; the tasks keep the official numbers and givens.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp13-inequalities, vbe-cp15-trig-expressions, vbe-cp18-derivative-rules, vbe-cp20-integral, vbe-cp14-plane-vectors, vbe-cp23-solids, vbe-cp24-combinatorics, vbe-cp25-probability-models, vbe-cp26-random-variables]
        exemplars:
          # source: VBE 2024 sample A II task 11
          - problem: 'Solve the inequalities. (a) $\frac{x^2 - 7x - 8}{x - 6} \ge 0$. (b) $|1 - x| > 2$. (c) $\cos(x) \le -\frac12$. Give only the solutions of the third inequality that lie in the interval $[0; 2\pi]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"inequality_union"}},{"name":"second","contract":{"kind":"inequality_union"}},{"name":"third","contract":{"kind":"inequality_union"}}]}
            answer: 'first = -1 <= x < 6 or x >= 8; second = x < -1 or x > 3; third = 2*pi/3 <= x <= 4*pi/3'
            solution_sketch: 'For (a), $x^2 - 7x - 8 = (x + 1)(x - 8)$. The sign chart gives $[-1; 6) \cup [8; +\infty)$. For (b), $1 - x > 2$ or $1 - x < -2$, so $x < -1$ or $x > 3$. For (c), $\cos x = -\frac12$ at $x = \frac{2\pi}{3}$ and $x = \frac{4\pi}{3}$. The solutions in $[0; 2\pi]$ stand between them.'
            points: 6
          # source: VBE 2024 sample A II task 12(a,b)
          - problem: 'A class has 10 students. Each student has one standard die. Jonas rolled his die first, and it showed four dots. Then each of the other students rolled one die once. (a) Find the probability that the dice of all the other students showed an even number of dots. (b) Find the probability that only the dice of Jonas and Petras showed four dots. Write the second answer as a quotient of powers.'
            answer_contract: {"kind":"multipart","parts":[{"name":"even","contract":{"kind":"exact"}},{"name":"four","contract":{"kind":"exact"}}]}
            answer: 'even = 1/512; four = 5^8/6^9'
            solution_sketch: 'Nine students roll after Jonas. For (a), each die is even with probability $\frac12$, so $\left(\frac12\right)^9 = \frac{1}{512}$. For (b), the die of Petras shows four in 1 way. Each of the other 8 dice has 5 ways. The probability is $\frac{5^8}{6^9}$.'
            points: 4
          # source: VBE 2024 sample A II task 13
          - problem: 'A regular triangular pyramid $ABCD$ is a regular tetrahedron. The segment $DO$ is the altitude of the tetrahedron, and $O$ lies in the plane $ABC$. The edge of the tetrahedron is $4$ cm long. (a) Find the distance from the point $D$ to the plane of the triangle $ABC$. (b) Find the angle between the altitude $DO$ and the edge $AB$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"dist","contract":{"kind":"unit","quantity":"length","unit":"cm","allow_omitted":true}},{"name":"angle","contract":{"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}}]}
            answer: 'dist = 4*sqrt(6)/3 cm; angle = 90°'
            solution_sketch: 'The distance is the length of $DO$. The point $O$ is the center of the triangle $ABC$, so $AO = \frac{4\sqrt{3}}{3}$. Then $DO^2 = 16 - \frac{16}{3} = \frac{32}{3}$ and $DO = \frac{4\sqrt{6}}{3}$. The altitude $DO$ is perpendicular to the plane $ABC$, so it is perpendicular to $AB$. The angle is $90^\circ$.'
            points: 6
          # source: VBE 2024 sample A II task 14
          - problem: 'A town has 1000 inhabitants. One hundred inhabitants got the disease X. A mathematician found that the number $P(t)$ of inhabitants who recovered from this disease in $t$ days is $P(t) = \frac{1000}{1 + 999 \cdot 10^{-0.17t}}$. (a) Use the formula to find how many sick inhabitants recover in 5 days. Round the answer to a whole number. (b) Find on which day the hundredth sick inhabitant of the town recovers.'
            answer_contract: {"kind":"multipart","parts":[{"name":"people","contract":{"kind":"exact"}},{"name":"day","contract":{"kind":"exact"}}]}
            answer: 'people = 7; day = 13'
            solution_sketch: 'For (a), $P(5) = \frac{1000}{1 + 999 \cdot 10^{-0.85}} \approx 7.04$, so 7 people. For (b), solve $P(t) = 100$. Then $999 \cdot 10^{-0.17t} = 9$ and $t = \frac{\lg 111}{0.17} \approx 12.03$. So the hundredth person recovers on day 13.'
            points: 5
          # source: VBE 2024 sample A II task 15
          - problem: 'Find how many composite numbers result from the product of any two different prime divisors of the number $2310$.'
            answer_contract: {"kind":"exact"}
            answer: '10'
            solution_sketch: 'We have $2310 = 2 \cdot 3 \cdot 5 \cdot 7 \cdot 11$. There are 5 prime divisors. Every pair gives a different product. So there are $\binom{5}{2} = 10$ numbers.'
            points: 2
          # source: VBE 2024 sample A II task 16
          - problem: 'The sine of an angle $x$ is $\sin(x) = \frac{2\sqrt{ab}}{a + b}$, where $0 < b < a$ and $\frac{\pi}{2} < x < \pi$. Find the tangent of the angle $x$ with $a$ and $b$.'
            answer_contract: {"kind":"function","vars":["a","b"]}
            answer: '2*sqrt(a*b)/(b-a)'
            solution_sketch: 'Use $\sin^2 x + \cos^2 x = 1$. In the second quadrant, $\cos x = -\sqrt{1 - \frac{4ab}{(a + b)^2}} = \frac{b - a}{a + b}$. So $\tan x = \frac{\sin x}{\cos x} = \frac{2\sqrt{ab}}{b - a}$. The value is negative, as the second quadrant needs.'
            points: 3
          # source: VBE 2024 sample A II task 17
          - problem: 'The graph of the function $y = f(x) = \frac1x$ for $x > 0$ is given. The region $S_1$ lies between the graph, the $x$-axis and the lines $x = 2$ and $x = 4$. The region $S_2$ lies between the graph, the $x$-axis and the lines $x = 5$ and $x = a$, where $a > 5$. The areas of $S_1$ and $S_2$ are equal. (a) Find the area $S_1$. (b) Find the value of $a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"S1","contract":{"kind":"exact"}},{"name":"a","contract":{"kind":"exact"}}]}
            answer: 'S1 = ln(2); a = 10'
            solution_sketch: 'For (a), $S_1 = \int_2^4 \frac{dx}{x} = \ln 4 - \ln 2 = \ln 2$. For (b), the equal areas give $\int_5^a \frac{dx}{x} = \ln 2$. Then $\ln a - \ln 5 = \ln 2$, so $\frac{a}{5} = 2$ and $a = 10$.'
            points: 7
          # source: VBE 2024 sample A II task 19(a)
          - problem: 'The quadrilateral $ABCD$ is a parallelogram. The point $E$ is the midpoint of the side $BC$. The point $F$ divides the segment $AE$ in the ratio $2 : 1$, counted from the vertex $A$. Let $\vec{AB} = \vec{m}$ and $\vec{AD} = \vec{n}$. (a) Express the vector $\vec{AF}$ with the vectors $\vec{m}$ and $\vec{n}$. (b) Express the vector $\vec{BF}$ with the vectors $\vec{m}$ and $\vec{n}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"AF","contract":{"kind":"function","vars":["m","n"]}},{"name":"BF","contract":{"kind":"function","vars":["m","n"]}}]}
            answer: 'AF = 2/3*m+1/3*n; BF = -1/3*m+1/3*n'
            solution_sketch: 'We have $\vec{AE} = \vec{m} + \frac12\vec{n}$. So $\vec{AF} = \frac23\vec{AE} = \frac23\vec{m} + \frac13\vec{n}$. Then $\vec{BF} = \vec{AF} - \vec{AB} = -\frac13\vec{m} + \frac13\vec{n}$.'
            points: 3
          # source: VBE 2024 sample A II task 20
          - problem: 'A fly sits at the vertex $M$ of a cube. A spider sits at the opposite vertex $V$ of the cube. The edge of the cube is $a$ long. Find the length of the shortest path on the surface of the cube that joins the fly and the spider.'
            answer_contract: {"kind":"function","vars":["a"]}
            answer: 'sqrt(5)*a'
            solution_sketch: 'Unfold two adjacent faces into a rectangle $a \times 2a$. The shortest path is a straight segment across the common edge. Let it cross the edge at the distance $x$ from the vertex. The length $\sqrt{a^2 + x^2} + \sqrt{a^2 + (a - x)^2}$ is least at $x = \frac{a}{2}$. The value is $\sqrt{5}\,a$.'
            points: 5
          # source: VBE 2024 sample A II task 12(c)
          - problem: 'Agne rolled her die 100 times. She found the sum of the dots of all 100 rolls. Show that the most likely sum is $350$.'
            answer_contract: {"kind":"written"}
            answer: 'One roll has the expected value $\frac{1 + 2 + 3 + 4 + 5 + 6}{6} = 3.5$. The expected sum of 100 rolls is $3.5 \cdot 100 = 350$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the distribution of the number of dots of one die, each value with probability $\frac16$. 1 point: the expected value $3.5$. 1 point: the conclusion that the most likely sum is $350$.'
            points: 3
          # source: VBE 2024 sample A II task 18
          - problem: 'The ratio of the sum $S_m$ of the first $m$ terms and the sum $S_n$ of the first $n$ terms of an arithmetic progression is $\frac{S_m}{S_n} = \frac{m^2}{n^2}$, where $m \ne n$. Prove that the ratio of the $m$-th term $a_m$ and the $n$-th term $a_n$ is $\frac{a_m}{a_n} = \frac{2m - 1}{2n - 1}$.'
            answer_contract: {"kind":"written"}
            answer: 'The sum formulas give $\frac{2a + (m - 1)d}{2a + (n - 1)d} = \frac{m}{n}$. This leads to $2a(n - m) = d(n - m)$, so $d = 2a$. Then $a_m = a(2m - 1)$ and $a_n = a(2n - 1)$.'
            solution_sketch: 'Official scheme, 4 points. 1 point: the ratio $\frac{m}{n}$ from the sum formulas. 1 point: the correct simplified equality $2an - 2am = dn - dm$. 1 point: the result $d = 2a$, with $n \ne m$. 1 point: the conclusion $\frac{a_m}{a_n} = \frac{2m - 1}{2n - 1}$.'
            points: 4
          # source: VBE 2024 sample A II task 19(b)
          - problem: 'The quadrilateral $ABCD$ is a parallelogram. The point $E$ is the midpoint of the side $BC$. The point $F$ divides the segment $AE$ in the ratio $2 : 1$, counted from the vertex $A$. Prove that the point $F$ lies on the diagonal $BD$ of the parallelogram.'
            answer_contract: {"kind":"written"}
            answer: 'Let $\vec{AB} = \vec{m}$ and $\vec{AD} = \vec{n}$. Then $\vec{BF} = \frac13(\vec{n} - \vec{m})$ and $\vec{BD} = \vec{n} - \vec{m}$. So $\vec{BF} = \frac13\vec{BD}$, and $F$ lies on $BD$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: a correct method and the expression of $\vec{BD}$ with $\vec{m}$ and $\vec{n}$. 1 point: the reason that $\vec{BF}$ and $\vec{BD}$ are collinear and start at the same point $B$.'
            points: 2
        constraints: 'The open tasks 11 to 20 of the official sample paper; decidable items in paper order, then the written items. In task 11(c) the answer holds only the solutions in [0; 2*pi]. The official key of task 16 prints a positive fraction; the item key is the exact value sin/cos, which is negative in the second quadrant. The figures of tasks 17 and 20 are given in words from the official grading text.'
    diagnostic_exemplar:
      # source: VBE 2024 sample A II task 5
      problem: 'Find the value of $m$ for which the function $f(x) = \begin{cases} 6x - 5, & x \le 3 \\ m, & x > 3 \end{cases}$ is continuous on the set of all real numbers.'
      answer_contract: {"kind":"exact"}
      answer: '13'
      solution_sketch: 'The left piece has the value $6 \cdot 3 - 5 = 13$ at $x = 3$. The function is continuous only if $m = 13$.'
