        key_prerequisites: [vbe-cp01-number-sets, vbe-cp03-powers, vbe-cp05-logarithms, vbe-cp06-trig-basics, vbe-cp08-function-concept, vbe-cp14-plane-vectors, vbe-cp24-combinatorics, vbe-cp25-probability-models]
        exemplars:
          # source: VBE 2021 main task 1
          - problem: 'Find the domain of the expression $x - 2 + \frac{1}{1 - x}$. Write the answer as an inequality in $x$.'
            answer_contract: {"kind":"inequality_union"}
            answer: 'x < 1 or x > 1'
            solution_sketch: 'The fraction needs $1 - x \ne 0$. So $x \ne 1$. The domain is $(-\infty; 1) \cup (1; +\infty)$.'
            points: 1
          # source: VBE 2021 main task 2
          - problem: 'The graph of the function $f(x) = \sqrt{x} + c$ starts at the point $(0; 2)$ and rises to the right. Find the number $c$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'At $x = 0$ we get $f(0) = \sqrt{0} + c = c$. The graph starts at the ordinate $2$, so $c = 2$.'
            points: 1
          # source: VBE 2021 main task 3
          - problem: 'The angle $\alpha$ satisfies $90^\circ \le \alpha < 180^\circ$. Write all values of $x = \sin\alpha$ as an inequality in $x$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '0 < x <= 1'
            solution_sketch: 'On this interval the sine falls from $1$ to values near $0$. It reaches $1$ at $90^\circ$. It never reaches $0$. So $0 < x \le 1$.'
            points: 1
          # source: VBE 2021 main task 4
          - problem: 'In a park, a tree of height 1 m casts a shadow of length 1.25 m. A second tree nearby casts a shadow of length 2 m at the same time. Find the height of the second tree.'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            answer: '1.6 m'
            solution_sketch: 'The ratio of height to shadow is the same for both trees. So $h : 2 = 1 : 1.25$ and $h = 1.6$ m.'
            points: 1
          # source: VBE 2021 main task 5
          - problem: 'Find all values of $x$ for which the function $f(x) = 2^x - 0.5$ takes negative values. Write the answer as an inequality in $x$.'
            answer_contract: {"kind":"inequality_union"}
            answer: 'x < -1'
            solution_sketch: 'We need $2^x < 0.5 = 2^{-1}$. The function $2^x$ grows, so $x < -1$.'
            points: 1
          # source: VBE 2021 main task 6
          - problem: 'Simplify $\sqrt{a} \cdot \sqrt[3]{a}$ for $a > 0$ to the form $a^k$. Find the exponent $k$.'
            answer_contract: {"kind":"exact"}
            answer: '5/6'
            solution_sketch: 'We have $\sqrt{a} = a^{1/2}$ and $\sqrt[3]{a} = a^{1/3}$. Add the exponents. We get $k = \frac12 + \frac13 = \frac56$.'
            points: 1
          # source: VBE 2021 main task 7
          - problem: 'A line $m$ passes through the point $(-2; 3)$ and is parallel to the line $y = -2x + 1$. Find the equation of the line $m$ in the form $y = kx + c$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '-2*x-1'
            solution_sketch: 'Parallel lines have equal slopes, so $k = -2$. The point $(-2; 3)$ gives $3 = 4 + c$. So $c = -1$ and $y = -2x - 1$.'
            points: 1
          # source: VBE 2021 main task 8
          - problem: 'Ten pupils attend a school music club. Six of them sing and four of them play an instrument. At an event, 5 members of the club must perform: 3 singers and 2 players. Find the number of different ways to pick these 5 participants.'
            answer_contract: {"kind":"exact"}
            answer: '120'
            solution_sketch: 'Pick 3 of the 6 singers in $\binom{6}{3} = 20$ ways. Pick 2 of the 4 players in $\binom{4}{2} = 6$ ways. The product is $20 \cdot 6 = 120$.'
            points: 1
          # source: VBE 2021 main task 9
          - problem: 'Find all values of $k$ for which the angle between the vectors $\vec{a} = (2k; 3)$ and $\vec{b} = (-1; 2)$ is acute. Write the answer as an inequality in $k$.'
            answer_contract: {"kind":"inequality_union"}
            answer: 'k < 3'
            solution_sketch: 'The angle is acute when the dot product is positive. We have $\vec{a} \cdot \vec{b} = -2k + 6 > 0$. So $k < 3$.'
            points: 1
          # source: VBE 2021 main task 10
          - problem: 'The graphs of the functions $y = f(x)$ and $y = g(x)$ meet at the point $(2; 3)$. The graph of $y = h(x)$ is a line. It meets the graph of $f$ at $(0; 0)$ and the graph of $g$ at $(4; 1)$. The region is bounded by the graphs of $f$, $g$ and $h$. It lies above the line $h$. For $x$ from $0$ to $2$ its upper side is the graph of $f$, and for $x$ from $2$ to $4$ its upper side is the graph of $g$. The area of the region equals $\int_0^2 f(x)\,dx + \int_2^4 g(x)\,dx - c$. Find the number $c$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'The area is $\int_0^2 (f - h)\,dx + \int_2^4 (g - h)\,dx = \int_0^2 f\,dx + \int_2^4 g\,dx - \int_0^4 h\,dx$. The line $h$ passes through $(0; 0)$ and $(4; 1)$. The integral $\int_0^4 h\,dx$ is the area of a triangle with base $4$ and height $1$. So $c = 2$.'
            points: 1
          # source: VBE 2021 main task 12
          - problem: 'One pump fills a pool with water in 9 hours. A second pump fills the same pool in 18 hours. Find the number of hours that both pumps need to fill the pool when they work together.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'In one hour the pumps fill $\frac19 + \frac1{18} = \frac16$ of the pool. So they need 6 hours.'
            points: 1
          # source: VBE 2021 main task 16
          - problem: 'A sample has four natural numbers. Its mode is 15, its median is 14 and its mean is 13. Find the smallest number of this sample.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'The sum of the four numbers is $52$. The mode 15 appears at least twice. For the median 14 the two middle numbers are $13$ and $15$, and the largest is $15$. So the smallest number is $52 - 13 - 15 - 15 = 9$.'
            points: 1
          # source: VBE 2021 main task 17
          - problem: 'The sound intensity level $D$ in decibels (dB) that a person hears is $D = 120 + 10 \lg I$, where $I$ is the sound strength in $\mathrm{W/m^2}$. Find by how many decibels $D$ grows when $I$ grows 1000 times.'
            answer_contract: {"kind":"exact"}
            answer: '30'
            solution_sketch: 'The new level is $120 + 10 \lg (1000 I) = 120 + 10 \lg I + 10 \cdot 3$. So $D$ grows by $30$ dB.'
            points: 1
          # source: VBE 2021 main task 18
          - problem: 'The function $f(x)$ is odd. A function $g$ has the rule $g(x) = f(x) + 2$, and $g(1) = 3$. Find $g(-1)$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'We get $f(1) = 3 - 2 = 1$. The function $f$ is odd, so $f(-1) = -1$. Then $g(-1) = -1 + 2 = 1$.'
            points: 1
        constraints: 'The 1-point tasks of the official paper in paper order; task 15 is the diagnostic exemplar; the tasks keep the official numbers and givens; the figures of tasks 2 and 10 stand in words.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp07-progressions, vbe-cp11-equations, vbe-cp13-inequalities, vbe-cp14-plane-vectors, vbe-cp16-trig-equations, vbe-cp17-limits-derivative-concept, vbe-cp18-derivative-rules, vbe-cp19-function-study, vbe-cp22-space-angles, vbe-cp23-solids, vbe-cp25-probability-models]
        exemplars:
          # source: VBE 2021 main task 11
          - problem: 'A cone has the apex $B$. The altitude $OB$ of the cone is $4$, and the radius $OC$ of its base is $3$, where $O$ is the center of the base. The points $A$ and $C$ are the ends of one diameter of the base, so the triangle $ABC$ is an axial section of the cone. (a) Find the area of the axial section $ABC$. (b) Find the area of the lateral surface of the cone. Give the answer with $\pi$. (c) The altitude of the cone grows 2 times and the radius grows 3 times. Find how many times the volume of the cone grows.'
            answer_contract: {"kind":"multipart","parts":[{"name":"section","contract":{"kind":"exact"}},{"name":"lateral","contract":{"kind":"exact"}},{"name":"factor","contract":{"kind":"exact"}}]}
            answer: 'section = 12; lateral = 15*pi; factor = 18'
            solution_sketch: '(a) The base $AC$ is $6$ and the height is $4$, so the area is $\frac12 \cdot 6 \cdot 4 = 12$. (b) The slant height is $\sqrt{3^2 + 4^2} = 5$, so the area is $\pi \cdot 3 \cdot 5 = 15\pi$. (c) The volume is $\frac13 \pi r^2 h$. It grows $3^2 \cdot 2 = 18$ times.'
            points: 3
          # source: VBE 2021 main task 13
          - problem: 'A circle has the center $O$ and the diameter $AC$. The point $B$ is on the circle, and $\angle BAC = 30^\circ$. (a) Find the size of the angle $BOC$. (b) Let $\vec{OA} = \vec{a}$ and $\vec{OB} = \vec{b}$. Express the vector $\vec{BC}$ with the vectors $\vec{a}$ and $\vec{b}$. Write the vectors as $a$ and $b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"angle","contract":{"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}},{"name":"vector","contract":{"kind":"function","vars":["a","b"]}}]}
            answer: 'angle = 60°; vector = -a-b'
            solution_sketch: '(a) The central angle $BOC$ is twice the inscribed angle $BAC$, so it is $60^\circ$. (b) The point $O$ is the midpoint of $AC$, so $\vec{OC} = -\vec{a}$. Then $\vec{BC} = \vec{OC} - \vec{OB} = -\vec{a} - \vec{b}$.'
            points: 2
          # source: VBE 2021 main task 14
          - problem: 'A person has several standard six-sided dice. (a) Two dice are thrown. Find the probability that the sum of the numbers of dots on the upper faces equals 12. (b) Four dice are thrown. Find the probability that the product of the numbers of dots on the upper faces is an even number.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sum","contract":{"kind":"exact"}},{"name":"even","contract":{"kind":"exact"}}]}
            answer: 'sum = 1/36; even = 15/16'
            solution_sketch: '(a) Only the pair $6, 6$ gives $12$. There are $36$ pairs, so the probability is $\frac1{36}$. (b) The product is odd only when all four numbers are odd. This has the probability $(\frac12)^4 = \frac1{16}$. So the answer is $1 - \frac1{16} = \frac{15}{16}$.'
            points: 2
          # source: VBE 2021 main task 19
          - problem: 'Rokas took a loan from a bank for a family trip. He pays it back with monthly payments. At the end of the first month he pays 120 euros. At the end of each next month he pays 5 % more than in the month before. (a) Find how many euros Rokas pays at the end of the second month. (b) Find how many euros in all Rokas has paid after three months. Round the answer to 2 decimals. (c) After $n$ months Rokas has paid $K(a^n - 1)$ euros in all, where $K$ is a natural number and $a$ is a positive real number. Find $K$. (d) Find $a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"second","contract":{"kind":"exact"}},{"name":"total","contract":{"kind":"approx","decimals":2}},{"name":"K","contract":{"kind":"exact"}},{"name":"a","contract":{"kind":"exact"}}]}
            answer: 'second = 126; total = 378.30; K = 2400; a = 21/20'
            solution_sketch: '(a) We get $120 \cdot 1.05 = 126$. (b) The third payment is $126 \cdot 1.05 = 132.30$. The sum is $120 + 126 + 132.30 = 378.30$. (c) The payments form a geometric progression with $b_1 = 120$ and $q = 1.05$. The sum is $120 \cdot \frac{1.05^n - 1}{0.05} = 2400 (1.05^n - 1)$. So $K = 2400$ and $a = 1.05$.'
            points: 4
          # source: VBE 2021 main task 20(a,b)
          - problem: 'The function $f$ has the rule $f(x) = 4x^3 - 9x^2 + 6x$. (a) Find the derivative $f''(x)$. (b) Find all values of $x$ for which the values of $f$ grow.'
            answer_contract: {"kind":"multipart","parts":[{"name":"derivative","contract":{"kind":"function","vars":["x"]}},{"name":"growth","contract":{"kind":"inequality_union"}}]}
            answer: 'derivative = 12*x^2-18*x+6; growth = x < 1/2 or x > 1'
            solution_sketch: '(a) We get $f''(x) = 12x^2 - 18x + 6$. (b) The values grow where $f''(x) > 0$. Then $2x^2 - 3x + 1 > 0$, with the roots $\frac12$ and $1$. So $x < \frac12$ or $x > 1$.'
            points: 3
          # source: VBE 2021 main task 20(d)
          - problem: 'The function $f$ has the rule $f(x) = 4x^3 - 9x^2 + 6x$. Find the value of $a$ for which the equality $\int_{-1}^{a} f(x)\,dx = -3a^3 - 7$ is true.'
            answer_contract: {"kind":"exact"}
            answer: '0'
            solution_sketch: 'An antiderivative is $F(x) = x^4 - 3x^3 + 3x^2$. Then $F(a) - F(-1) = a^4 - 3a^3 + 3a^2 - 7$. The equation gives $a^4 + 3a^2 = 0$, so $a^2(a^2 + 3) = 0$. The only solution is $a = 0$.'
            points: 3
          # source: VBE 2021 main task 21
          - problem: 'Solve the equations. (a) $\log_2 (9 - x^2) = 3$. (b) $2\sin x = 1$, where $x \in (90^\circ; 180^\circ)$. (c) $\sqrt{2 - x} = \sqrt{x} - 2$. Find the number of solutions of this equation.'
            answer_contract: {"kind":"multipart","parts":[{"name":"log","contract":{"kind":"set"}},{"name":"sine","contract":{"kind":"unit","quantity":"angle","unit":"°","allow_omitted":true}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'log = {-1, 1}; sine = 150°; count = 0'
            solution_sketch: '(a) We get $9 - x^2 = 8$, so $x = -1$ or $x = 1$. (b) We have $\sin x = \frac12$. In the interval $(90^\circ; 180^\circ)$ the solution is $x = 150^\circ$. (c) The equation needs $x \le 2$ and $\sqrt{x} \ge 2$, so $x \ge 4$. These conditions do not hold together. The equation has 0 solutions.'
            points: 7
          # source: VBE 2021 main task 22
          - problem: 'A box holds blue, green and red balls of the same size. The probability to draw a blue ball at random is $\frac15$. The probability to draw a green ball equals the probability to draw a red ball. (a) One ball is drawn at random. Find the probability that it is red. (b) One ball is drawn at random, its color is noted and it goes back into the box. Then a second ball is drawn at random and its color is noted. Find the probability that both balls are blue. (c) Use the same two draws. Find the probability that the two balls have different colors.'
            answer_contract: {"kind":"multipart","parts":[{"name":"red","contract":{"kind":"exact"}},{"name":"blue2","contract":{"kind":"exact"}},{"name":"different","contract":{"kind":"exact"}}]}
            answer: 'red = 2/5; blue2 = 1/25; different = 16/25'
            solution_sketch: '(a) The green and red balls share $\frac45$, so $P(\text{red}) = \frac25$. (b) The draws are independent, so the probability is $\frac15 \cdot \frac15 = \frac1{25}$. (c) The balls have one color with the probability $\frac1{25} + \frac4{25} + \frac4{25} = \frac9{25}$. So the answer is $1 - \frac9{25} = \frac{16}{25}$.'
            points: 4
          # source: VBE 2021 main task 23(a,b)
          - problem: 'All edges of the tetrahedron $ABCD$ have length 6. The points $E$ and $F$ are the midpoints of the edges $AB$ and $CD$. (a) Find the area of the whole surface of the tetrahedron. Give the answer with a root. (b) Find the cosine of the angle between the edge $CD$ and the plane $ABC$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"surface","contract":{"kind":"exact"}},{"name":"cosine","contract":{"kind":"exact"}}]}
            answer: 'surface = 36*sqrt(3); cosine = sqrt(3)/3'
            solution_sketch: '(a) Each face is an equilateral triangle with area $\frac{\sqrt{3}}{4} \cdot 36 = 9\sqrt{3}$. There are 4 faces, so the area is $36\sqrt{3}$. (b) Let $O$ be the center of the face $ABC$. Then $OC = \frac23 \cdot 3\sqrt{3} = 2\sqrt{3}$. The cosine is $\frac{OC}{DC} = \frac{2\sqrt{3}}{6} = \frac{\sqrt{3}}{3}$.'
            points: 3
          # source: VBE 2021 main task 26
          - problem: 'The numbers $a$, $b$ and $c$ are three consecutive terms of an arithmetic progression, and $a \ne b$. The numbers $b$, $c$ and $a$ are three consecutive terms of a geometric progression. Find the ratio of the geometric progression.'
            answer_contract: {"kind":"exact"}
            answer: '-2'
            solution_sketch: 'We have $2b = a + c$ and $c^2 = ab$. So $2c^2 = a(a + c)$, and $(a - c)(a + 2c) = 0$. Since $a \ne c$, we get $a = -2c$. The ratio is $q = \frac{a}{c} = -2$.'
            points: 4
          # source: VBE 2021 main task 20(c)
          - problem: 'The function $f$ has the rule $f(x) = 4x^3 - 9x^2 + 6x$. Show that the slope of a tangent to the graph of $y = f(x)$ cannot equal $-1$.'
            answer_contract: {"kind":"written"}
            answer: 'The equation $f''(x) = -1$ gives $12x^2 - 18x + 7 = 0$. Its discriminant is negative, so it has no root.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the correct quadratic equation $12x^2 - 18x + 7 = 0$. 1 point: the negative discriminant $D = -12$ and the conclusion that no such tangent exists.'
            points: 2
          # source: VBE 2021 main task 23(c)
          - problem: 'All edges of the tetrahedron $ABCD$ have length 6. The points $E$ and $F$ are the midpoints of the edges $AB$ and $CD$. Show that $EF \perp AB$.'
            answer_contract: {"kind":"written"}
            answer: 'The triangle $AFB$ is isosceles with $AF = BF$. The segment $EF$ is its median to the base, so it is also its altitude.'
            solution_sketch: 'Official scheme, 1 point. 1 point: a correct proof, for example with the isosceles triangle $AFB$ ($AF = BF$ as medians of equal equilateral triangles), or with the plane $DEC$ perpendicular to $AB$.'
            points: 1
          # source: VBE 2021 main task 23(d)
          - problem: 'All edges of the tetrahedron $ABCD$ have length 6. The points $E$ and $F$ are the midpoints of the edges $AB$ and $CD$. Show that the length of the segment $EF$ equals the distance between the skew lines $AB$ and $CD$. Do not find the length of $EF$.'
            answer_contract: {"kind":"written"}
            answer: 'In the same way, $EF$ is the median to the base of the isosceles triangle $CED$, so $EF \perp CD$. Also $EF \perp AB$. So $EF$ is the common perpendicular of the skew lines.'
            solution_sketch: 'Official scheme, 1 point. 1 point: a correct proof that $EF \perp CD$ and $EF \perp AB$, so the segment $EF$ is the common perpendicular of the two skew lines.'
            points: 1
          # source: VBE 2021 main task 24
          - problem: 'Find the value of $x$ for which the function $f(x) = \frac{\ln x}{x}$ takes its largest value in the interval $x \in \left[\frac1e; e^3\right]$. Show that your answer is right.'
            answer_contract: {"kind":"written"}
            answer: 'The largest value is at $x = e$. The derivative is $f''(x) = \frac{1 - \ln x}{x^2}$ and it is zero only at $x = e$. The derivative is positive before $e$ and negative after $e$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the derivative $f''(x) = \frac{1 - \ln x}{x^2}$. 1 point: the critical point $x = e$. 1 point: a correct proof that $x = e$ is the maximum point, with the sign of $f''$ or with the values of $f$ at the ends and at $e$.'
            points: 3
          # source: VBE 2021 main task 25
          - problem: 'In the triangle $ABC$, the angle $ACB$ equals $\alpha$ and the angle $BAC$ equals $2\alpha$, where $0 < \alpha < \frac{\pi}{3}$. The side $BC$ is $k$ times longer than the side $AB$. Show that $k = 2\cos\alpha$, and find all possible values of $k$.'
            answer_contract: {"kind":"written"}
            answer: 'The law of sines gives $k = \frac{\sin 2\alpha}{\sin\alpha} = 2\cos\alpha$. For $0 < \alpha < \frac{\pi}{3}$ we have $\frac12 < \cos\alpha < 1$. So $1 < k < 2$.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the law of sines for the triangle. 1 point: the double angle formula and the result $k = 2\cos\alpha$. 1 point: the values $1 < k < 2$.'
            points: 3
        constraints: 'The tasks 11, 13, 14, 19 to 26 of the official paper; decidable items in paper order, then the written items; the tetrahedron and the cone are described in words.'
    diagnostic_exemplar:
      # source: VBE 2021 main task 15
      problem: 'The set $A = \{3; 7; 8; 10; 13; 15; 93\}$ is given. The set $B$ is a subset of $A$ and holds only the prime numbers of $A$. Find the sum of the elements of $B$.'
      answer_contract: {"kind":"exact"}
      answer: '23'
      solution_sketch: 'The prime numbers of $A$ are $3$, $7$ and $13$. The sum is $3 + 7 + 13 = 23$.'
