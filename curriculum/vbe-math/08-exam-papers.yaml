          # source: VBE 2024 repeat task 21(a)
          - problem: 'A regular triangular pyramid $ABCS$ has all edges equal. Its total surface area equals $36\sqrt{3}$. The point $O$ is the center of the base $ABC$ and $SO$ is the altitude of the pyramid. Show that the length of $SO$ equals $2\sqrt{6}$.'
            answer_contract: {"kind":"written"}
            answer: 'The four faces are equilateral triangles with edge $a$, so $\sqrt{3}a^2 = 36\sqrt{3}$ and $a = 6$. Then $OC = \frac23 \cdot 3\sqrt{3} = 2\sqrt{3}$. In the right triangle $SOC$ we get $SO^2 = 36 - 12 = 24$, so $SO = 2\sqrt{6}$.'
            solution_sketch: 'Official scheme, 4 points. 1 point: a correct method, with the area of the four equilateral faces. 1 point: the edge length $6$. 1 point: the length $OC = 2\sqrt{3}$. 1 point: the Pythagorean theorem in the triangle $SOC$ and the result $SO = 2\sqrt{6}$.'
            points: 4
          # source: VBE 2024 repeat task 21(b)
          - problem: 'A regular triangular pyramid $ABCS$ has all edges equal. The points $D$, $E$ and $F$ are the midpoints of the edges $SA$, $SB$ and $SC$. Prove that the plane $DEF$ is parallel to the plane $ABC$.'
            answer_contract: {"kind":"written"}
            answer: 'The segments $DF$ and $DE$ are midlines of the triangles $ASC$ and $ASB$, so $DF \parallel AC$ and $DE \parallel AB$. Two intersecting lines of the plane $DEF$ are parallel to two intersecting lines of the plane $ABC$. So the planes are parallel.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the proof that $DF \parallel AC$ and $DE \parallel AB$, with the midlines. 1 point: the proof that the planes are parallel, from two intersecting parallel pairs of lines.'
