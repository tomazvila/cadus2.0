        visuals: [{"kind":"coordinate","x_min":"-2","x_max":"2","y_min":"-2","y_max":"2","x_tick":"1","y_tick":"1","points":[{"x":"0","y":"0","label":"O"},{"x":"-0.6","y":"0.8","label":"A"},{"x":"1","y":"-4/3","label":"B"}],"segments":[{"from":{"x":"-0.6","y":"0.8","label":null},"to":{"x":"1","y":"-4/3","label":null}},{"from":{"x":"1","y":"-2","label":null},"to":{"x":"1","y":"2","label":null}}],"caption":"The ray from O through A, extended to the line x = 1 at the point B"}]
        exemplars:
          # source: VBE 2026 main A II task 1
          - problem: 'Sets $A = \{2, 4, 6, 8\}$ and $B = \{2, 4, 5, 6, 7\}$ are given. Find the difference $A \setminus B$ of these sets.'
            answer_contract: {"kind":"set"}
            answer: '{8}'
            solution_sketch: 'The elements of $A$ that are not in $B$ remain. Only $8$ is such an element.'
            points: 1
          # source: VBE 2026 main A II task 2
          - problem: 'Simplify the expression $m^{\sqrt{2}} : m^{1-\sqrt{2}}$ to the form $m^k$. Find the exponent $k$.'
            answer_contract: {"kind":"exact"}
            answer: '2*sqrt(2)-1'
            solution_sketch: 'Subtract the exponents. We get $k = \sqrt{2} - (1 - \sqrt{2}) = 2\sqrt{2} - 1$.'
            points: 1
          # source: VBE 2026 main A II task 3
          - problem: 'A random variable $X$ takes the values $m = 1, 2, 3$. The probabilities are $\mathrm{P}(X = 1) = \frac{1}{a}$, $\mathrm{P}(X = 2) = \frac{2}{a}$ and $\mathrm{P}(X = 3) = \frac{3}{a}$. Find the value of $a$.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'The probabilities sum to $1$. So $\frac{1 + 2 + 3}{a} = 1$ and $a = 6$.'
            points: 1
          # source: VBE 2026 main A II task 4
          - problem: 'Rationalize the denominator of the fraction $\frac{2}{4 - \sqrt{a}}$.'
            answer_contract: {"kind":"function","vars":["a"]}
            answer: '(8+2*sqrt(a))/(16-a)'
            solution_sketch: 'Multiply the top and the bottom by $4 + \sqrt{a}$. The bottom becomes $16 - a$. The top becomes $8 + 2\sqrt{a}$.'
            points: 1
          # source: VBE 2026 main A II task 6
          - problem: 'The unit circle has its center at $O(0; 0)$. The point $A$ is on the circle in the second quadrant, and its abscissa is $-0.6$. The line $OA$ meets the line $x = 1$ at the point $B$, and the ordinate of $B$ is $-\frac{4}{3}$. The angle $\alpha$ is the rotation angle from the positive Ox axis to the ray $OA$. Find the value of $\tan\alpha$.'
            answer_contract: {"kind":"exact"}
            answer: '-4/3'
            visual: 0
            solution_sketch: 'The slope of the line $OA$ equals $\tan\alpha$. The line $OA$ passes through $O(0; 0)$ and $B\left(1; -\frac43\right)$. So $\tan\alpha = -\frac43$. The point $A(-0.6; 0.8)$ gives the same value: $\frac{0.8}{-0.6} = -\frac43$.'
            points: 1
          # source: VBE 2026 main A II task 7
          - problem: 'The net of the lateral surface of a cylinder is a square with area $36\pi^2$. Find the area of the base of this cylinder. Give the answer with $\pi$.'
            answer_contract: {"kind":"exact"}
            answer: '9*pi'
            solution_sketch: 'The side of the square is $6\pi$, and it equals the circumference $2\pi r$. So $r = 3$. The area of the base is $\pi r^2 = 9\pi$.'
            points: 1
          # source: VBE 2026 main A II task 8
          - problem: 'It is known that $a = \ln 2$, $b = \ln 3$ and $\log_4 18 = m + p \cdot \frac{b}{a}$, where $m$ and $p$ are rational numbers. Find the value of the sum $m + p$.'
            answer_contract: {"kind":"exact"}
            answer: '3/2'
            solution_sketch: 'We have $\log_4 18 = \frac{\ln 2 + 2\ln 3}{2\ln 2} = \frac12 + \frac{b}{a}$. So $m = \frac12$ and $p = 1$. The sum is $\frac32$.'
            points: 1
          # source: VBE 2026 main A II task 9
          - problem: 'Find the antiderivative $y = F(x)$ of the function $y = f(x) = 4x^3$, if the graph of this antiderivative contains the point $(0; 1)$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: 'x^4+1'
            solution_sketch: 'We have $F(x) = x^4 + C$. The point $(0; 1)$ gives $C = 1$. So $F(x) = x^4 + 1$.'
            points: 1
          # source: VBE 2026 main A II task 10
          - problem: 'Find the value of $x$ for which the equality $4 \cdot \arccos(x + 2) = 3\pi$ is true.'
            answer_contract: {"kind":"exact"}
            answer: '-sqrt(2)/2-2'
            solution_sketch: 'We get $\arccos(x + 2) = \frac{3\pi}{4}$. So $x + 2 = \cos\frac{3\pi}{4} = -\frac{\sqrt{2}}{2}$. Then $x = -\frac{\sqrt{2}}{2} - 2$.'
            points: 1
        constraints: 'The 1-point tasks of the official paper in paper order; task 5 is the diagnostic exemplar; the unit-circle task 6 has a coordinate visual and its facts in words; the tasks keep the official numbers and givens.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp13-inequalities, vbe-cp07-progressions, vbe-cp18-derivative-rules, vbe-cp14-plane-vectors, vbe-cp23-solids, vbe-cp24-combinatorics, vbe-cp25-probability-models, vbe-cp19-function-study]
        exemplars:
          # source: VBE 2026 main A II task 11
          - problem: 'Solve the inequalities. (a) $|x - 5| > 2$. (b) $10 \cdot \lg(100^x) - 1000 < 0$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"inequality_union"}},{"name":"second","contract":{"kind":"inequality_union"}}]}
            answer: 'first = x < 3 or x > 7; second = x < 50'
            solution_sketch: 'For (a), $x - 5 > 2$ or $x - 5 < -2$, so $x > 7$ or $x < 3$. For (b), $\lg(100^x) = 2x$. Then $20x - 1000 < 0$ and $x < 50$.'
            points: 6
          # source: VBE 2026 main A II task 12
          - problem: 'A student who prepares for the contest "It never happens" described a situation. "On June 1 at 8:00 a.m., a scientist put 10 bacteria into the first medium and $10^{100}$ bacteria into the second medium. The number of bacteria in the first medium grows 4 times every 24 hours. In the second medium, $\frac{9}{10}$ of all bacteria in that medium die every hour." (a) Use the situation of the student. Find the number of bacteria in the first medium on June 11 at 8:00 a.m. Write the answer in the form $a \cdot 2^b$, where $a$ and $b$ are natural numbers and $a$ is an odd number. (b) Use the same situation. Find after how many hours only 1 bacterium remains in the second medium.'
            answer_contract: {"kind":"multipart","parts":[{"name":"bacteria","contract":{"kind":"exact"}},{"name":"hours","contract":{"kind":"exact"}}]}
            answer: 'bacteria = 5*2^21; hours = 100'
            solution_sketch: 'The numbers in the first medium form a geometric progression with $b_1 = 10$ and $q = 4$. On June 11 we have $b_{11} = 10 \cdot 4^{10} = 5 \cdot 2^{21}$. In the second medium $\frac{1}{10}$ of the bacteria remain each hour. So $10^{100} \cdot (\frac{1}{10})^n = 1$ and $n = 100$.'
            points: 6
          # source: VBE 2026 main A II task 13
          - problem: 'The numbers $a$, $b$ and $c$ are positive. It is known that $a^2 \cdot b^3 \cdot c^4 = 5^{10}$ and $a^2 \cdot b = 5^6$. Find the value of the product $a \cdot b \cdot c$.'
            answer_contract: {"kind":"exact"}
            answer: '625'
            solution_sketch: 'Multiply the two equalities. We get $a^4 b^4 c^4 = 5^{16}$. So $(abc)^4 = 5^{16}$ and $abc = 5^4 = 625$.'
            points: 2
          # source: VBE 2026 main A II task 14
          - problem: 'A vehicle was tested with special equipment for 3 hours. During the test the speed of the vehicle grew steadily. The distance $s$ (km) that the vehicle traveled depends on the time $t$ (h) by the function $s(t) = 5t^2 + 40t$. Find the instantaneous speed $v$ (km/h) of the vehicle 2 hours after the start of the test ($t = 2$).'
            answer_contract: {"kind":"exact"}
            answer: '60'
            solution_sketch: 'The speed is the derivative $v(t) = s''(t) = 10t + 40$. So $v(2) = 10 \cdot 2 + 40 = 60$.'
            points: 2
          # source: VBE 2026 main A II task 15
          - problem: 'The point $D$ is the midpoint of the side $BC$ of the triangle $ABC$. The vectors $\vec{AB} = \vec{a}$ and $\vec{AC} = \vec{b}$ lie on the sides $AB$ and $AC$. (a) Express the vector $\vec{AD}$ with the vectors $\vec{a}$ and $\vec{b}$. (b) Find the scalar product of the vectors $\vec{AD}$ and $\vec{BC}$, if $AB = 5$ and $AC = 9$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ad","contract":{"kind":"function","vars":["a","b"]}},{"name":"product","contract":{"kind":"exact"}}]}
            answer: 'ad = 1/2*a+1/2*b; product = 28'
            solution_sketch: 'We have $\vec{AD} = \vec{a} + \frac12(\vec{b} - \vec{a}) = \frac12\vec{a} + \frac12\vec{b}$. Also $\vec{BC} = \vec{b} - \vec{a}$. The product is $\frac12(|\vec{b}|^2 - |\vec{a}|^2) = \frac12(81 - 25) = 28$.'
            points: 5
          # source: VBE 2026 main A II task 16(b)
          - problem: 'The curve $y = \sqrt{x + 1}$, the line $x = 3$ and the $x$-axis bound a curvilinear trapezoid. This trapezoid turns about the $x$-axis and forms a solid of revolution. Find the volume of this solid. Give the answer with $\pi$.'
            answer_contract: {"kind":"exact"}
            answer: '8*pi'
            solution_sketch: 'The curve meets the $x$-axis at $x = -1$. The volume is $\pi \int_{-1}^{3} (x + 1)\,dx = \pi \left[\frac{x^2}{2} + x\right]_{-1}^{3}$. The value is $\pi (\frac92 + 3 - \frac12 + 1) = 8\pi$.'
            points: 3
          # source: VBE 2026 main A II task 17(b)
          - problem: 'Find the derivative $V''(\alpha)$ of the function $V(\alpha) = 72\pi \cdot \sin^2(\alpha) \cdot \cos(\alpha)$.'
            answer_contract: {"kind":"function","vars":["alpha"]}
            answer: '72*pi*(2*sin(alpha)*cos(alpha)^2-sin(alpha)^3)'
            solution_sketch: 'Use the product rule. We get $72\pi (2\sin\alpha \cos\alpha \cdot \cos\alpha - \sin^2\alpha \cdot \sin\alpha)$. This equals $72\pi (2\sin\alpha \cos^2\alpha - \sin^3\alpha)$.'
            points: 2
          # source: VBE 2026 main A II task 18
          - problem: 'A library shelf holds books of three school subjects: four mathematics books, three physics books and one history book. (a) Agota took two books from this shelf at random, looked through them and put them back. Find the probability that both books Agota took were mathematics books. (b) Jokūbas took one book from this shelf at random, looked through it and put it back. Then Gabrielius also took one book from this shelf at random, looked through it and put it back. Find the probability that the books of the two young men were of the same subject. (c) Urtė took three books from this shelf at random. Find the probability that at least one of the books she took was a mathematics book.'
            answer_contract: {"kind":"multipart","parts":[{"name":"agota","contract":{"kind":"exact"}},{"name":"same","contract":{"kind":"exact"}},{"name":"urte","contract":{"kind":"exact"}}]}
            answer: 'agota = 3/14; same = 13/32; urte = 13/14'
            solution_sketch: '(a) We get $\binom{4}{2} / \binom{8}{2} = \frac{6}{28} = \frac{3}{14}$. (b) The books are the same subject in $4 \cdot 4 + 3 \cdot 3 + 1 \cdot 1 = 26$ of $64$ cases, so $\frac{13}{32}$. (c) The complement has no mathematics book, so $1 - \binom{4}{3} / \binom{8}{3} = 1 - \frac{4}{56} = \frac{13}{14}$.'
            points: 6
          # source: VBE 2026 main A II task 19
          - problem: 'All faces of the pyramid $SABC$ are equilateral triangles. The length of the edge of the pyramid is $a$. The point $H$ is the midpoint of the edge $AB$. (a) Find the length of the apothem $SH$. (b) Find the distance between the skew lines $AB$ and $SC$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"apothem","contract":{"kind":"function","vars":["a"]}},{"name":"distance","contract":{"kind":"function","vars":["a"]}}]}
            answer: 'apothem = sqrt(3)/2*a; distance = sqrt(2)/2*a'
            solution_sketch: 'In the right triangle $SAH$ we have $AS = a$ and $AH = \frac{a}{2}$. So $SH = \frac{\sqrt{3}}{2}a$. The perpendicular from $H$ to $SC$ is the common perpendicular of the skew lines. Its length is $\sqrt{SH^2 - (a/2)^2} = \frac{\sqrt{2}}{2}a$.'
            points: 4
          # source: VBE 2026 main A II task 20(b)
          - problem: 'A box holds $a$ yellow and $b$ blue balls of the same size, where $a$ and $b$ are natural numbers and $b \ge 2$. Two balls are drawn from the box at random. The probability that both drawn balls are yellow equals $\frac12$. This gives the equality $2a(a - 1) = (a + b)(a + b - 1)$. Assume that the number of blue balls in the box is even. Use this equality to find the smallest possible number of blue balls in the box.'
            answer_contract: {"kind":"exact"}
            answer: '6'
            solution_sketch: 'Write the equality as a quadratic equation in $a$. Its discriminant is $8b^2 + 1$. For $b = 2$ and $b = 4$ the discriminant is $33$ and $129$, not squares. For $b = 6$ it is $289 = 17^2$, and $a = 15$ is natural.'
            points: 3
          # source: VBE 2026 main A II task 16(a)
          - problem: 'Find the coordinates of the point $A(a; b)$ where the curve $y = \sqrt{x + 1}$ meets the line $y = 2$. Then show that the line $y = \frac14 x + \frac54$ is tangent to the curve $y = \sqrt{x + 1}$ at the point $A$.'
            answer_contract: {"kind":"written"}
            answer: 'Solve $\sqrt{x + 1} = 2$ to get $A(3; 2)$. The derivative $y'' = \frac{1}{2\sqrt{x + 1}}$ equals $\frac14$ at $x = 3$. The tangent at $A$ is $y = \frac14 (x - 3) + 2 = \frac14 x + \frac54$.'
            solution_sketch: 'Official scheme, 4 points. 1 point: the coordinates of $A$. 1 point: the derivative of $\sqrt{x + 1}$. 1 point: the slope $\frac14$ at $x = 3$. 1 point: the constant term $\frac54$, so the line is the tangent. The tangent formula $y = f''(a)(x - a) + f(a)$ gives the same points.'
            points: 4
          # source: VBE 2026 main A II task 17(a)
          - problem: 'A cone has the base center $O$ and the slant height $6$. The angle between the altitude of the cone and its slant height equals $\alpha$. Show that the volume $V$ of the cone depends on $\alpha$ by the function $V(\alpha) = 72\pi \cdot \sin^2(\alpha) \cdot \cos(\alpha)$, where $\alpha \in (0; \frac{\pi}{2})$.'
            answer_contract: {"kind":"written"}
            answer: 'The radius of the base is $6\sin\alpha$ and the height is $6\cos\alpha$. So $V = \frac13 \pi (6\sin\alpha)^2 \cdot 6\cos\alpha = 72\pi \sin^2\alpha \cos\alpha$.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the cone volume formula with at least one correct length, the radius $6\sin\alpha$ or the height $6\cos\alpha$. 1 point: the function $V(\alpha) = 72\pi \sin^2\alpha \cos\alpha$.'
            points: 2
          # source: VBE 2026 main A II task 17(c)
          - problem: 'The function $V(\alpha) = 72\pi \cdot \sin^2(\alpha) \cdot \cos(\alpha)$ gives the volume of a cone. Show that this volume is largest when $\alpha = \arccos\left(\frac{\sqrt{3}}{3}\right)$, where $\alpha \in (0; \frac{\pi}{2})$.'
            answer_contract: {"kind":"written"}
            answer: 'Solve $V''(\alpha) = 0$ to get $\sin\alpha (3\cos^2\alpha - 1) = 0$. The sine is not zero on the interval, so $\cos^2\alpha = \frac13$ and $\alpha = \arccos\frac{\sqrt{3}}{3}$. The derivative changes sign from plus to minus at this point, so it is the maximum.'
            solution_sketch: 'Official scheme, 3 points. 1 point: the equation $V''(\alpha) = 0$. 1 point: its correct solution on the interval. 1 point: the proof that the solution is a maximum point, with the sign change of $V''$ from plus to minus.'
            points: 3
          # source: VBE 2026 main A II task 20(a)
          - problem: 'A box holds $a$ yellow and $b$ blue balls of the same size. It is known that $b \ge 2$. Two balls are drawn from the box at random. The probability that both drawn balls are yellow equals $\frac12$. Show that $2a(a - 1) = (a + b)(a + b - 1)$.'
            answer_contract: {"kind":"written"}
            answer: 'The classical probability of two yellow balls is $\binom{a}{2} / \binom{a+b}{2} = \frac{a(a - 1)}{(a + b)(a + b - 1)}$. This equals $\frac12$. Multiply by $2(a + b)(a + b - 1)$ to get the equality.'
            solution_sketch: 'Official scheme, 2 points. 1 point: the classical probability formula for two yellow balls, or the product $\frac{a}{a + b} \cdot \frac{a - 1}{a + b - 1}$. 1 point: the stated equality.'
            points: 2
        constraints: 'The open tasks 11 to 20 of the official paper; decidable items in paper order, then the written items; the point H of task 19 is the midpoint of AB, as the official grading shows.'
    diagnostic_exemplar:
      # source: VBE 2026 main A II task 5
      problem: 'Goods in a shop are marked with three-digit codes from $100$ to $999$ inclusive. Find how many of these codes have three different digits.'
      answer_contract: {"kind":"exact"}
      answer: '648'
      solution_sketch: 'The first digit has 9 choices, the second digit has 9 choices and the third digit has 8 choices. The product is $9 \cdot 9 \cdot 8 = 648$.'
