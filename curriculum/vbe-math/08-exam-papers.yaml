    knowledge_points:
      - id: kp1
        name: 'Short-answer tasks'
        key_prerequisites: [vbe-cp01-number-sets, vbe-cp03-powers, vbe-cp07-progressions, vbe-cp06-trig-basics, vbe-cp11-equations, vbe-cp19-function-study, vbe-cp20-integral]
        exemplars:
          # source: VBE 2025 pilot A II task 1
          - problem: 'Sets $A = [1; 3]$ and $B = [2; 6)$ are given. Find the intersection $A \cap B$. Write it as an inequality for $x$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '2 <= x <= 3'
            solution_sketch: 'The intersection holds the numbers that are in both intervals. These are the numbers from $2$ to $3$, with both ends.'
            points: 1
          # source: VBE 2025 pilot A II task 2
          - problem: 'Rationalize the denominator of the fraction $\frac{1000}{\sqrt{2}}$.'
            answer_contract: {"kind":"exact"}
            answer: '500*sqrt(2)'
            solution_sketch: 'Multiply the top and the bottom by $\sqrt{2}$. We get $\frac{1000\sqrt{2}}{2} = 500\sqrt{2}$.'
            points: 1
          # source: VBE 2025 pilot A II task 4
          - problem: 'The graph of the function $y = \cos x$ is known. Find how many solutions the equation $\cos x = -1$ has in the interval $[-2\pi; 2\pi]$.'
            answer_contract: {"kind":"exact"}
            answer: '2'
            solution_sketch: 'The cosine equals $-1$ at $x = \pi + 2\pi k$. In the interval $[-2\pi; 2\pi]$ these are $x = -\pi$ and $x = \pi$. So there are $2$ solutions.'
            points: 1
          # source: VBE 2025 pilot A II task 5
          - problem: 'The formula of the general term of a geometric progression $(b_n)$ is $b_n = 3 \cdot 2^n$, where $n \in \mathbb{N}$. Find the position $n$ of the number $1536$ in this progression.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'We need $3 \cdot 2^n = 1536$. So $2^n = 512 = 2^9$ and $n = 9$.'
            points: 1
          # source: VBE 2025 pilot A II task 6
          - problem: 'Solve the equation $(x - 1)\sqrt{x - 3} = 0$.'
            answer_contract: {"kind":"exact"}
            answer: '3'
            solution_sketch: 'The root exists only for $x \ge 3$. The first factor is zero at $x = 1$, which is outside this domain. The second factor is zero at $x = 3$.'
            points: 1
          # source: VBE 2025 pilot A II task 7
          - problem: 'The table gives the sign of the derivative $f''(x)$ of a function $f(x)$. For $x \in (-\infty; -7)$ we have $f''(x) > 0$. At $x = -7$ we have $f''(x) = 0$. For $x \in (-7; 3)$ we have $f''(x) < 0$. At $x = 3$ we have $f''(x) = 0$. For $x \in (3; +\infty)$ we have $f''(x) > 0$. Write the interval where the function $f(x)$ decreases. Write it as an inequality for $x$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-7 < x < 3'
            solution_sketch: 'A function decreases where its derivative is negative. This is the interval $(-7; 3)$.'
            points: 1
          # source: VBE 2025 pilot A II task 8
          - problem: 'Find the antiderivative $F(x)$ of the function $f(x) = 2 + x^2$ whose graph passes through the origin $(0; 0)$.'
            answer_contract: {"kind":"function","vars":["x"]}
            answer: '2*x+x^3/3'
            solution_sketch: 'We have $F(x) = 2x + \frac{x^3}{3} + C$. The condition $F(0) = 0$ gives $C = 0$.'
            points: 1
          # source: VBE 2025 pilot A II task 9
          - problem: 'Find $\cos(2\alpha)$ if $\cos\alpha = 0.8$ and $\sin\alpha = 0.6$.'
            answer_contract: {"kind":"exact"}
            answer: '0.28'
            solution_sketch: 'Use $\cos(2\alpha) = \cos^2\alpha - \sin^2\alpha = 0.64 - 0.36 = 0.28$.'
            points: 1
          # source: VBE 2025 pilot A II task 10
          - problem: 'Find $\tan\left(\alpha - \frac{\pi}{4}\right)$ if $\tan\alpha = 5$.'
            answer_contract: {"kind":"exact"}
            answer: '2/3'
            solution_sketch: 'Use the difference formula. We get $\frac{5 - 1}{1 + 5 \cdot 1} = \frac{4}{6} = \frac23$.'
            points: 1
        constraints: 'Nine 1-point tasks of the official paper in paper order; task 3 is the diagnostic exemplar; the choice and figure details of the official tasks are written as text; the tasks keep the official numbers and givens.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp03-powers, vbe-cp05-logarithms, vbe-cp13-inequalities, vbe-cp15-trig-expressions, vbe-cp16-trig-equations, vbe-cp18-derivative-rules, vbe-cp19-function-study, vbe-cp20-integral, vbe-cp22-space-angles, vbe-cp23-solids, vbe-cp25-probability-models, vbe-cp26-random-variables]
        exemplars:
          # source: VBE 2025 pilot A II task 11
          - problem: 'Simplify the expressions. (a) $\frac{3^{2001.5} - 3^{2000.5}}{3^{2000.5}}$. (b) $\sqrt{(1 - x)^2} + |1 - x|$, if $x > 1$. (c) $\log_{a^5}\left(\sqrt{a}\right)$, where $a > 0$ and $a \ne 1$. (d) $\frac{\sin(x + 100\pi) - 2\sin(-x)}{\tan(x + 11\pi)}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"function","vars":["x"]}},{"name":"c","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'a = 2; b = 2*(x-1); c = 1/10; d = 3*cos(x)'
            solution_sketch: '(a) Take $3^{2000.5}$ out: $\frac{3^{2000.5}(3 - 1)}{3^{2000.5}} = 2$. (b) For $x > 1$ we have $\sqrt{(1-x)^2} = |1-x| = x - 1$, so the sum is $2(x - 1)$. (c) We get $\frac15 \log_a a^{1/2} = \frac{1}{10}$. (d) The period of the sine is $2\pi$ and the period of the tangent is $\pi$. We get $\frac{3\sin x}{\tan x} = 3\cos x$.'
            points: 7
          # source: VBE 2025 pilot A II task 12(c)
          - problem: 'The random variable $X$ is the sum in euros that a player wins in one game of the lottery "Latgalių LOTO". The variable $X$ takes the values $0$, $5$, $10$ and $50$ with the probabilities $0.7$, $0.25$, $p$ and $0.01$. Here $p = 0.04$. The random variable $Y$ is the sum in euros that a player wins in one game of the lottery "Jotvingių LOTO". The variable $Y$ takes the values $0$, $2$, $5$, $100$ and $500$ with the probabilities $0.65$, $0.32$, $0.02$, $0.009$ and $0.001$. Both lotteries have the same ticket price. The lottery with the larger expected win pays off more. (a) Find the expected value $\mathrm{E}Y$. (b) Find the difference $\mathrm{E}X - \mathrm{E}Y$. If the difference is positive, "Latgalių LOTO" pays off more.'
            answer_contract: {"kind":"multipart","parts":[{"name":"ey","contract":{"kind":"exact"}},{"name":"diff","contract":{"kind":"exact"}}]}
            answer: 'ey = 2.14; diff = 0.01'
            solution_sketch: 'We have $\mathrm{E}X = 2.15$. Also $\mathrm{E}Y = 0 \cdot 0.65 + 2 \cdot 0.32 + 5 \cdot 0.02 + 100 \cdot 0.009 + 500 \cdot 0.001 = 2.14$. The difference is $0.01 > 0$. So "Latgalių LOTO" pays off more.'
            points: 2
          # source: VBE 2025 pilot A II task 13
          - problem: 'The base of the pyramid $SABCD$ is the rectangle $ABCD$ with $AB = 15\sqrt{3}$ and $AD = 15$. The edge $SB$ is the altitude of the pyramid, and $SB = 15$. (a) Find the volume of the pyramid. (b) The lateral face $SAD$ is a right triangle. Find its area. (c) Find the angle in degrees between the plane of the face $SAD$ and the plane of the base $ABCD$. (d) The point $M$ lies on the diagonal $BD$ of the base. The length of the segment $AM$ equals the distance from the point $A$ to the plane $SBD$. Find the length of $AM$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"volume","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}},{"name":"angle","contract":{"kind":"exact"}},{"name":"am","contract":{"kind":"exact"}}]}
            answer: 'volume = 1125*sqrt(3); area = 225; angle = 30; am = 15*sqrt(3)/2'
            solution_sketch: '(a) $V = \frac13 \cdot 15\sqrt{3} \cdot 15 \cdot 15 = 1125\sqrt{3}$. (b) $SA = \sqrt{15^2 + (15\sqrt{3})^2} = 30$, and the right angle is at $A$. The area is $\frac12 \cdot 30 \cdot 15 = 225$. (c) The angle is $\angle SAB$ with $\tan\angle SAB = \frac{15}{15\sqrt{3}} = \frac{\sqrt{3}}{3}$, so it is $30$ degrees. (d) The plane $SBD$ is perpendicular to the base, so $AM \perp BD$. With $BD = 30$ we get $AM = \frac{15\sqrt{3} \cdot 15}{30} = \frac{15\sqrt{3}}{2}$.'
            points: 7
          # source: VBE 2025 pilot A II task 14(a,c,d)
          - problem: 'The function is $f(x) = 2.5x^2 - x^3$. The tangent to its graph at the point $A(2; 2)$ is the line $y = -2x + 6$. This line meets the $x$-axis at the point $B(3; 0)$. The graph of $f$ meets the $x$-axis at $(0; 0)$ and $(2.5; 0)$. (a) Find $f''(2)$. (b) Find the area of the region that the graph of $f$, the tangent $y = -2x + 6$ and the $x$-axis bound. The corners of the region are $A(2; 2)$, the point $(2.5; 0)$ and $B(3; 0)$. (c) A decorative vase has the shape of a solid of revolution. The solid forms when the curvilinear trapezoid turns about the $x$-axis. The trapezoid is bound by the graph of $g(x) = \frac15 f(x) = \frac15 (2.5x^2 - x^3)$ and by the lines $x = 1$, $x = 2$ and $y = 0$. The unit on each axis is 1 decimeter. Ignore the thickness of the walls. Find the volume of the vase in cubic decimeters. Give the answer with $\pi$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"slope","contract":{"kind":"exact"}},{"name":"area","contract":{"kind":"exact"}},{"name":"volume","contract":{"kind":"exact"}}]}
            answer: 'slope = -2; area = 79/192; volume = 123*pi/700'
            solution_sketch: '(a) We have $f''(x) = 5x - 3x^2$, so $f''(2) = -2$. (b) The triangle under the tangent from $x = 2$ to $x = 3$ has area $1$. The area under the graph from $x = 2$ to $x = 2.5$ is $\frac{113}{192}$. The figure has area $1 - \frac{113}{192} = \frac{79}{192}$. (c) $V = \frac{\pi}{25}\int_1^2 (6.25x^4 - 5x^5 + x^6)\,dx = \frac{123\pi}{700}$.'
            points: 7
          # source: VBE 2025 pilot A II task 15(a,c)
          - problem: 'A firm makes $x$ tons of a product in one month, where $x \in [0; 60]$. The production cost in euros is $I(x) = 200x^2 + 300x - \frac43 x^3$. The firm gets 9900 euros for each ton that it sells. The firm sells all the tons that it makes. The monthly profit in euros is $P(x) = \frac43 x^3 - 200x^2 + 9600x$. (a) Find the production cost in euros when the firm makes and sells 3 tons in one month. (b) Find how many tons the firm must make in one month to get the largest monthly profit.'
            answer_contract: {"kind":"multipart","parts":[{"name":"cost","contract":{"kind":"exact"}},{"name":"tons","contract":{"kind":"exact"}}]}
            answer: 'cost = 2664; tons = 40'
            solution_sketch: '(a) $I(3) = 200 \cdot 9 + 900 - \frac43 \cdot 27 = 2664$. (b) We have $P''(x) = 4x^2 - 400x + 9600$. The roots of $P''(x) = 0$ are $x = 40$ and $x = 60$. The derivative changes sign from plus to minus at $x = 40$, and $P(40) > P(60)$. So the answer is $40$ tons.'
            points: 4
          # source: VBE 2025 pilot A II task 16
          - problem: 'Solve the equation $\sin x = 5\sin\frac{x}{2}$. Write all solutions as one formula with the integer $k$.'
            answer_contract: {"kind":"function","vars":["k"]}
            answer: '2*pi*k'
            solution_sketch: 'Use $\sin x = 2\sin\frac{x}{2}\cos\frac{x}{2}$. Then $\sin\frac{x}{2}\left(2\cos\frac{x}{2} - 5\right) = 0$. The second factor has no root, because $\cos\frac{x}{2} = 2.5$ is impossible. From $\sin\frac{x}{2} = 0$ we get $x = 2\pi k$.'
            points: 3
          # source: VBE 2025 pilot A II task 17
          - problem: 'Solve the inequality $f''(x) < \frac14 \ln(0.5) \cdot f(-2)$, where $f(x) = \frac{0.5^{1 + 2x}}{2\ln(0.5)}$.'
            answer_contract: {"kind":"inequality_union"}
            answer: 'x > -1/2'
            solution_sketch: 'We have $f''(x) = 0.5^{1 + 2x}$. Also $f(-2) = \frac{8}{2\ln(0.5)}$, so the right side equals $1$. Then $0.5^{1 + 2x} < 0.5^0$. The base is less than $1$, so $1 + 2x > 0$ and $x > -0.5$.'
            points: 3
          # source: VBE 2025 pilot A II task 18
          - problem: 'The numbers $\log_3 17$, $\log_a 17$ and $\log_{27} 17$ are three consecutive terms of an arithmetic progression, where $a > 0$ and $a \ne 1$. Find the value of $a$.'
            answer_contract: {"kind":"exact"}
            answer: '3*sqrt(3)'
            solution_sketch: 'The middle term is the mean of the other two. So $2\log_a 17 = \log_3 17 + \frac13 \log_3 17 = \frac43 \log_3 17$. Change to base $17$: $\log_{17} a = \frac32 \log_{17} 3$. Then $a = 3^{3/2} = 3\sqrt{3}$.'
            points: 4
          # source: VBE 2025 pilot A II task 19
          - problem: 'A smith makes a metal part. The probability that a part is bad is twice the probability that a part is good. The smith makes 8 parts. Find the probability that at least 3 of the 8 parts are good.'
            answer_contract: {"kind":"exact"}
            answer: '1163/2187'
            solution_sketch: 'The probability of a good part is $p = \frac13$. The trials are binomial. The complement has 0, 1 or 2 good parts: $\frac{256 + 1024 + 1792}{6561} = \frac{3072}{6561}$. The answer is $1 - \frac{3072}{6561} = \frac{1163}{2187}$.'
            points: 4
          # source: VBE 2025 pilot A II task 20
          - problem: 'The segment $SO$ is the altitude of the regular triangular pyramid $SABC$, and $O$ is the center of the base $ABC$. The segment $SM$ is the altitude of the lateral face $SBC$, and $M$ is the midpoint of $BC$. The area of the section $SAM$ is 8 times the area of the section $A_1B_1C_1$. The plane of the section $A_1B_1C_1$ is parallel to the base $ABC$. The altitude $SO$ meets the plane $A_1B_1C_1$ at the point $O_1$. The lateral edge $SA$ makes an angle with the base plane, and the tangent of this angle is $\frac{\sqrt{3}}{2}$. Find the ratio $\frac{SO_1}{OO_1}$.'
            answer_contract: {"kind":"exact"}
            answer: '1/3'
            solution_sketch: 'We have $SO = \frac{\sqrt{3}}{2} AO$ and $AM = \frac32 AO$. The area of $SAM$ is $\frac{3\sqrt{3}}{8} AO^2$. The area of $A_1B_1C_1$ is $\frac{3\sqrt{3}}{4} A_1O_1^2$. The condition gives $\left(\frac{AO}{A_1O_1}\right)^2 = 16$, so $\frac{SO}{SO_1} = 4$. Then $\frac{OO_1}{SO_1} = 3$ and $\frac{SO_1}{OO_1} = \frac13$.'
            points: 5
          # source: VBE 2025 pilot A II task 12(a)
          - problem: 'The random variable $X$ is the sum in euros that a player wins in one game of the lottery "Latgalių LOTO". The variable $X$ takes the values $0$, $5$, $10$ and $50$ with the probabilities $0.7$, $0.25$, $p$ and $0.01$. Show that $p = 0.04$.'
            answer_contract: {"kind":"written"}
            answer: 'The probabilities sum to $1$. So $p = 1 - 0.7 - 0.25 - 0.01 = 0.04$.'
            solution_sketch: 'Official scheme, 1 point: the correct calculation $p = 1 - 0.7 - 0.25 - 0.01 = 0.04$.'
            points: 1
          # source: VBE 2025 pilot A II task 12(b)
          - problem: 'The random variable $X$ is the sum in euros that a player wins in one game of the lottery "Latgalių LOTO". The variable $X$ takes the values $0$, $5$, $10$ and $50$ with the probabilities $0.7$, $0.25$, $p$ and $0.01$. Here $p = 0.04$. Show that the expected value is $\mathrm{E}X = 2.15$.'
            answer_contract: {"kind":"written"}
            answer: 'Multiply each value by its probability and add. We get $0 \cdot 0.7 + 5 \cdot 0.25 + 10 \cdot 0.04 + 50 \cdot 0.01 = 2.15$.'
            solution_sketch: 'Official scheme, 1 point: the correct calculation of $\mathrm{E}X$ with the result $2.15$.'
            points: 1
          # source: VBE 2025 pilot A II task 14(b)
          - problem: 'The function is $f(x) = 2.5x^2 - x^3$. Show that the tangent to the graph of $f$ at the point $A(2; 2)$ has the equation $y = -2x + 6$.'
            answer_contract: {"kind":"written"}
            answer: 'We have $f''(x) = 5x - 3x^2$, so $f''(2) = -2$. Also $f(2) = 2$. The tangent is $y = -2(x - 2) + 2 = -2x + 6$.'
            solution_sketch: 'Official scheme, 1 point: the tangent formula $y = f''(2)(x - 2) + f(2)$ with $f''(2) = -2$ and $f(2) = 2$, and the result $y = -2x + 6$.'
            points: 1
          # source: VBE 2025 pilot A II task 15(b)
          - problem: 'A firm makes $x$ tons of a product in one month. The production cost in euros is $I(x) = 200x^2 + 300x - \frac43 x^3$. The firm gets 9900 euros for each ton that it sells. The firm sells all the tons that it makes. Show that the monthly profit in euros (profit = income - cost) is $P(x) = \frac43 x^3 - 200x^2 + 9600x$.'
            answer_contract: {"kind":"written"}
            answer: 'The income is $9900x$. So $P(x) = 9900x - \left(200x^2 + 300x - \frac43 x^3\right) = \frac43 x^3 - 200x^2 + 9600x$.'
            solution_sketch: 'Official scheme, 1 point: the correct expression for the profit, with the income $9900x$ and the result $P(x)$.'
            points: 1
        constraints: 'The open tasks 11 to 20 of the official paper; decidable items in paper order, then the written items; the sides of the base in task 13 are AB = 15*sqrt(3) and AD = 15, as the official grading shows.'
