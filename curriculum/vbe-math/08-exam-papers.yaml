        visuals: [{"kind":"curve","x_min":"-4","x_max":"1","y_min":"-7","y_max":"4","x_tick":"1","y_tick":"1","curve":{"family":"polynomial","coefficients":["2","-2","-1"]},"key_points":[{"x":"-4","y":"-6","label":null},{"x":"-1","y":"3","label":null},{"x":"1","y":"-1","label":null}],"asymptotes":[],"caption":"The graph of the function f on the interval from -4 to 1"}]
        exemplars:
          # source: VBE 2024 repeat task 1
          - problem: 'The sets $A = \{0, 1, 2, 3, 5, 7, 8, 9\}$ and $B = \{1, 2, 7, 8, 9, 10\}$ are given. Find the union $A \cup B$.'
            answer_contract: {"kind":"set"}
            answer: '{0, 1, 2, 3, 5, 7, 8, 9, 10}'
            solution_sketch: 'The union holds every element of $A$ and every element of $B$. The set $B$ adds only the element $10$ to $A$.'
            points: 1
          # source: VBE 2024 repeat task 2
          - problem: 'The graph of the function $y = \sqrt{x}$ starts at one point and rises more slowly as $x$ grows. (a) Find the abscissa of the starting point of the graph. (b) Find the ordinate of the point of the graph with abscissa $16$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"start","contract":{"kind":"exact"}},{"name":"value","contract":{"kind":"exact"}}]}
            answer: 'start = 0; value = 4'
            solution_sketch: '(a) The root $\sqrt{x}$ exists for $x \ge 0$, so the graph starts at $x = 0$. (b) We have $\sqrt{16} = 4$.'
            points: 1
          # source: VBE 2024 repeat task 3
          - problem: 'The numbers $1$; $3$; $x$; $27$ are the first four terms of a geometric progression. Find $x$.'
            answer_contract: {"kind":"exact"}
            answer: '9'
            solution_sketch: 'The ratio is $q = 3 : 1 = 3$. So $x = 3 \cdot 3 = 9$. Check: $9 \cdot 3 = 27$.'
            points: 1
          # source: VBE 2024 repeat task 4
          - problem: 'The function $y = f(x)$ is defined on the interval $[-4; 1]$. Its graph is a curve from the point $(-4; -6)$ up to the highest point $(-1; 3)$ and then down to the point $(1; -1)$. Find the range of the function. Write the answer as an inequality for $y$.'
            answer_contract: {"kind":"inequality_union"}
            answer: '-6 <= y <= 3'
            visual: 0
            solution_sketch: 'The lowest point of the curve is the left end $(-4; -6)$, because $-6 < -1$. The highest point is $(-1; 3)$. So the values fill the interval from $-6$ to $3$.'
            points: 1
          # source: VBE 2024 repeat task 6
          - problem: 'The axial section of a cone is a right triangle. The height of the cone is $h$ and the radius of its base is $r$. Find the ratio $h : r$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'The axial section is an isosceles triangle with the right angle at the apex. The height to the hypotenuse of such a triangle is half of the hypotenuse. The hypotenuse is the diameter, so $h = r$ and the ratio is $1$.'
            points: 1
          # source: VBE 2024 repeat task 7
          - problem: 'Two alarm systems work independently of each other. The first system works with probability $0.88$. The second system works with probability $0.95$. Find the probability that the first system works and the second system does not work.'
            answer_contract: {"kind":"exact"}
            answer: '0.044'
            solution_sketch: 'The second system fails with probability $1 - 0.95 = 0.05$. The events are independent, so we multiply. The product is $0.88 \cdot 0.05 = 0.044$.'
            points: 1
          # source: VBE 2024 repeat task 8
          - problem: 'For the function $f(x) = x \sin x$ the equality $f(-x) = c \cdot f(x)$ is true for every real $x$. Find the number $c$.'
            answer_contract: {"kind":"exact"}
            answer: '1'
            solution_sketch: 'We have $f(-x) = (-x) \sin(-x) = (-x)(-\sin x) = x \sin x$. So $f(-x) = f(x)$ and $c = 1$. The function is even.'
            points: 1
          # source: VBE 2024 repeat task 9
          - problem: 'A random variable $X$ takes the values $-1$ and $4$. The probabilities are $\mathrm{P}(X = -1) = p$ and $\mathrm{P}(X = 4) = 0.1$. Find the expected value $\mathrm{E}X$.'
            answer_contract: {"kind":"exact"}
            answer: '-1/2'
            solution_sketch: 'The probabilities sum to $1$, so $p = 0.9$. Then $\mathrm{E}X = -1 \cdot 0.9 + 4 \cdot 0.1 = -0.9 + 0.4 = -0.5$.'
            points: 1
          # source: VBE 2024 repeat task 10
          - problem: 'An infinite decreasing geometric progression has the first term $0.5$. The sum of all its terms is $0.625$. Find the ratio of this progression.'
            answer_contract: {"kind":"exact"}
            answer: '1/5'
            solution_sketch: 'The sum is $S = \frac{b_1}{1 - q}$. So $\frac{0.5}{1 - q} = 0.625$ and $1 - q = 0.8$. Then $q = 0.2$.'
            points: 1
          # source: VBE 2024 repeat task 12
          - problem: 'The points $A$, $B$ and $C$ lie on a circle with center $O$. The triangle $AOC$ is equilateral. The point $B$ lies on the larger arc $AC$. Find the angle $ABC$ in degrees.'
            answer_contract: {"kind":"exact"}
            answer: '30'
            solution_sketch: 'The central angle $AOC$ is $60^\circ$. The inscribed angle $ABC$ rests on the same arc. It is half of the central angle, so $ABC = 30^\circ$.'
            points: 1
          # source: VBE 2024 repeat task 15
          - problem: 'The line $y = 27x + b$ is tangent to the graph of the function $f(x) = \frac{4}{x^2}$. Find the abscissa of the point where this line touches the graph.'
            answer_contract: {"kind":"exact"}
            answer: '-2/3'
            solution_sketch: 'The slope of the tangent equals the derivative. We have $f''(x) = -\frac{8}{x^3}$. So $-\frac{8}{x^3} = 27$, then $x^3 = -\frac{8}{27}$ and $x = -\frac{2}{3}$.'
            points: 1
        constraints: 'The 1-point tasks of the official paper in paper order; task 5 is the diagnostic exemplar; each choice task is a typed question with the same mathematics; task 4 has a curve visual.'
      - id: kp2
        name: 'Open tasks'
        key_prerequisites: [vbe-cp05-logarithms, vbe-cp07-progressions, vbe-cp11-equations, vbe-cp12-moduli-systems, vbe-cp16-trig-equations, vbe-cp14-plane-vectors, vbe-cp18-derivative-rules, vbe-cp19-function-study, vbe-cp20-integral, vbe-cp21-space-lines-planes, vbe-cp22-space-angles, vbe-cp24-combinatorics, vbe-cp25-probability-models]
        exemplars:
          # source: VBE 2024 repeat task 11
          - problem: 'A frequency table shows how many talks each scientist of one institute gave at conferences in three years, where $x > 6$. The number of scientists who gave $2$, $3$, $4$, $6$ and $x$ talks is $4$, $9$, $5$, $2$ and $1$. (a) Find the mode of this sample. (b) The scientists of the institute gave on average $3\frac{2}{3}$ talks in three years. Find $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"mode","contract":{"kind":"exact"}},{"name":"xval","contract":{"kind":"exact"}}]}
            answer: 'mode = 3; xval = 10'
            solution_sketch: '(a) The value $3$ has the largest frequency, $9$. So the mode is $3$. (b) There are $21$ scientists. The sum of the talks is $8 + 27 + 20 + 12 + x = 67 + x$. From $\frac{67 + x}{21} = \frac{11}{3}$ we get $67 + x = 77$ and $x = 10$.'
            points: 2
          # source: VBE 2024 repeat task 13
          - problem: 'In the parallelogram $ABCD$ we have $AB = 6$, $AD = 9$ and $\angle BAD = 60^\circ$. Let $\vec{a} = \vec{AB}$ and $\vec{b} = \vec{AD}$. The point $K$ is the midpoint of the side $BC$. The point $L$ is the midpoint of the side $CD$. (a) Find the area of the parallelogram $ABCD$. (b) Find the scalar product $\vec{a} \cdot \vec{b}$. (c) Express the vector $\vec{KL}$ with the vectors $\vec{a}$ and $\vec{b}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"area","contract":{"kind":"exact"}},{"name":"dot","contract":{"kind":"exact"}},{"name":"kl","contract":{"kind":"function","vars":["a","b"]}}]}
            answer: 'area = 27*sqrt(3); dot = 27; kl = 1/2*b-1/2*a'
            solution_sketch: '(a) The area is $6 \cdot 9 \cdot \sin 60^\circ = 27\sqrt{3}$. (b) The product is $6 \cdot 9 \cdot \cos 60^\circ = 27$. (c) We have $\vec{KL} = \vec{KC} + \vec{CL} = \frac12 \vec{b} - \frac12 \vec{a}$.'
            points: 3
          # source: VBE 2024 repeat task 14
          - problem: 'Renata takes five exams in one week, from Monday to Friday: English, history, mathematics, Lithuanian and physics. She takes one exam each day. The schedule does not exist yet. (a) Find the number of different schedules. (b) Find the number of different schedules in which at least one day lies between the Lithuanian exam and the English exam. The two exams do not stand on consecutive days.'
            answer_contract: {"kind":"multipart","parts":[{"name":"all","contract":{"kind":"exact"}},{"name":"apart","contract":{"kind":"exact"}}]}
            answer: 'all = 120; apart = 72'
            solution_sketch: '(a) There are $5! = 120$ orders of the exams. (b) Count the schedules where the two exams stand on consecutive days. There are $4$ pairs of consecutive days, $2$ orders in a pair and $3!$ orders of the other exams. That is $4 \cdot 2 \cdot 6 = 48$, so the answer is $120 - 48 = 72$.'
            points: 2
          # source: VBE 2024 repeat task 16
          - problem: 'A water wheel turns counterclockwise. The height $h$ (in meters) of a bucket above the water level depends on the time $t$ (in seconds) by the formula $h(t) = 4 + 6\sin\left(\frac{\pi}{30} t\right)$, where $t \ge 0$. (a) Find the height of the bucket above the water level $5$ seconds after the start of the observation. (b) Find the greatest height above the water level that the bucket reaches. (c) Find the number of seconds in which the bucket makes one full turn.'
            answer_contract: {"kind":"multipart","parts":[{"name":"height","contract":{"kind":"exact"}},{"name":"greatest","contract":{"kind":"exact"}},{"name":"period","contract":{"kind":"exact"}}]}
            answer: 'height = 7; greatest = 10; period = 60'
            solution_sketch: '(a) We have $h(5) = 4 + 6\sin\frac{\pi}{6} = 4 + 3 = 7$. (b) The sine is at most $1$, so the greatest height is $4 + 6 = 10$. (c) One turn is the period $\frac{2\pi}{\pi/30} = 60$ seconds.'
            points: 3
          # source: VBE 2024 repeat task 17
          - problem: 'Rokas prepared for road cycling races. In the first training he rode $50$ km. In each next training he rode $4$ km more than in the training before it. (a) Find how many kilometers Rokas rode in the fifth training. (b) In the last training Rokas rode $142$ km. Find the number of his trainings.'
            answer_contract: {"kind":"multipart","parts":[{"name":"fifth","contract":{"kind":"exact"}},{"name":"count","contract":{"kind":"exact"}}]}
            answer: 'fifth = 66; count = 24'
            solution_sketch: 'The distances form an arithmetic progression with $a_1 = 50$ and $d = 4$. (a) We have $a_5 = 50 + 4 \cdot 4 = 66$. (b) From $50 + 4(n - 1) = 142$ we get $4n = 96$ and $n = 24$.'
            points: 3
          # source: VBE 2024 repeat task 18
          - problem: 'The function $f(x) = \log_3 x$ is given. (a) Write the domain of this function as an inequality for $x$. (b) Find all values of $x$ for which $f(x) + \log_3 2 \le \log_3 5$. (c) Find all values of $x$ for which $27^{f(x)} = x^3$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"domain","contract":{"kind":"inequality_union"}},{"name":"ineq","contract":{"kind":"inequality_union"}},{"name":"eq","contract":{"kind":"inequality_union"}}]}
            answer: 'domain = x > 0; ineq = 0 < x <= 5/2; eq = x > 0'
            solution_sketch: '(a) The logarithm exists only for $x > 0$. (b) We have $\log_3 x + \log_3 2 = \log_3(2x) \le \log_3 5$. So $2x \le 5$, and with $x > 0$ we get $0 < x \le \frac52$. (c) We have $27^{\log_3 x} = \left(3^{\log_3 x}\right)^3 = x^3$. The equality is true for every $x$ of the domain, so $x > 0$.'
            points: 7
          # source: VBE 2024 repeat task 19
          - problem: 'Solve the equations. (a) $|3x - 1| = 5$. (b) $2\sin^2 x = 2 - 3\cos x$. In the second equation give only the solutions that lie in the interval $[0; 2\pi]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"first","contract":{"kind":"set"}},{"name":"second","contract":{"kind":"set"}}]}
            answer: 'first = {-4/3, 2}; second = {pi/2, 3*pi/2}'
            solution_sketch: '(a) Either $3x - 1 = 5$ or $3x - 1 = -5$. So $x = 2$ or $x = -\frac43$. (b) Use $\sin^2 x = 1 - \cos^2 x$ to get $2\cos^2 x - 3\cos x = 0$, so $\cos x (2\cos x - 3) = 0$. The case $\cos x = \frac32$ has no solution. From $\cos x = 0$ we get $x = \frac{\pi}{2} + \pi k$, and the solutions in $[0; 2\pi]$ are $\frac{\pi}{2}$ and $\frac{3\pi}{2}$.'
            points: 6
          # source: VBE 2024 repeat task 20
          - problem: 'The function $f(x) = x^3 - x^2 - 5x - 1$ is given. (a) Find all values of $x$ for which the values of this function increase. (b) Write the equation of the tangent to the graph of this function at the point with abscissa $x = 1$. Write the tangent as $y = \ldots$ with the variable $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"increasing","contract":{"kind":"inequality_union"}},{"name":"tangent","contract":{"kind":"function","vars":["x"]}}]}
            answer: 'increasing = x < -1 or x > 5/3; tangent = -4*x-2'
            solution_sketch: '(a) We have $f''(x) = 3x^2 - 2x - 5$. The roots of $f''(x) = 0$ are $x = -1$ and $x = \frac53$. The derivative is positive for $x < -1$ and for $x > \frac53$. (b) We have $f(1) = -6$ and $f''(1) = -4$. The tangent is $y = -6 - 4(x - 1) = -4x - 2$.'
