    knowledge_points:
      - id: kp1
        name: 'Express a polygon vector and find a scalar product from side lengths'
        key_prerequisites: [vectors-polygon-scalar-product, vectors-geometric-rules]
        exemplars:
          - problem: 'In triangle $ABC$, the point $M$ is the midpoint of $BC$. Let $\vec a=\vec{AB}$ and $\vec b=\vec{AC}$. (a) Write $\vec{BC}$ in terms of $\vec a$ and $\vec b$. (b) Write $\vec{AM}$ in terms of $\vec a$ and $\vec b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"BC","contract":{"kind":"function","vars":["a","b"]}},{"name":"AM","contract":{"kind":"function","vars":["a","b"]}}]}
            answer: 'BC = b-a; AM = (a+b)/2'
            solution_sketch: 'By the triangle rule, $\vec{BC}=\vec{AC}-\vec{AB}=\vec b-\vec a$. Then $\vec{AM}=\vec{AB}+\tfrac12\vec{BC}=\vec a+\tfrac12(\vec b-\vec a)$. This equals $\tfrac12(\vec a+\vec b)$.'
          - problem: 'In parallelogram $ABCD$, let $\vec a=\vec{AB}$ and $\vec d=\vec{AD}$. The point $K$ lies on side $BC$ and $BK:KC=1:3$. (a) Write $\vec{AC}$ in terms of $\vec a$ and $\vec d$. (b) Write $\vec{BK}$ in terms of $\vec d$. (c) Write $\vec{AK}$ in terms of $\vec a$ and $\vec d$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"AC","contract":{"kind":"function","vars":["a","d"]}},{"name":"BK","contract":{"kind":"function","vars":["d"]}},{"name":"AK","contract":{"kind":"function","vars":["a","d"]}}]}
            answer: 'AC = a+d; BK = d/4; AK = a+d/4'
            solution_sketch: 'By the parallelogram rule, $\vec{AC}=\vec a+\vec d$. Also $\vec{BC}=\vec d$, and $BK$ is one quarter of $BC$, so $\vec{BK}=\tfrac14\vec d$. Then $\vec{AK}=\vec{AB}+\vec{BK}=\vec a+\tfrac14\vec d$.'
          - problem: 'Triangle $ABC$ is equilateral and its side is $6$. Find (a) $\vec{AB}\cdot\vec{AC}$, (b) $\vec{AB}\cdot\vec{BC}$, (c) $|\vec{AB}+\vec{AC}|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"len","contract":{"kind":"exact"}}]}
            answer: 'p1 = 18; p2 = -18; len = 6*sqrt(3)'
            solution_sketch: 'The angle between $\vec{AB}$ and $\vec{AC}$ is $60^\circ$, so $\vec{AB}\cdot\vec{AC}=36\cdot\tfrac12=18$. The angle between $\vec{AB}$ and $\vec{BC}$ is $120^\circ$, so the product is $36\cdot(-\tfrac12)=-18$. Also $|\vec{AB}+\vec{AC}|^2=36+36+2\cdot18=108$, so the length is $6\sqrt3$.'
          - problem: 'In parallelogram $ABCD$, $|AB|=4$, $|AD|=3$ and $\angle BAD=60^\circ$. Find (a) $\vec{AB}\cdot\vec{AD}$, (b) $\vec{AB}\cdot\vec{AC}$, (c) $|\vec{AC}|^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"sq","contract":{"kind":"exact"}}]}
            answer: 'p1 = 6; p2 = 22; sq = 37'
            solution_sketch: 'We have $\vec{AB}\cdot\vec{AD}=4\cdot3\cdot\tfrac12=6$. Since $\vec{AC}=\vec{AB}+\vec{AD}$, we get $\vec{AB}\cdot\vec{AC}=16+6=22$. Also $|\vec{AC}|^2=16+9+2\cdot6=37$.'
          - problem: 'In triangle $ABC$, $|AB|=4$, $|AC|=6$ and $\angle BAC=120^\circ$. The point $M$ is the midpoint of $BC$. Find (a) $\vec{AB}\cdot\vec{AC}$, (b) $\vec{AM}\cdot\vec{AB}$, (c) $|\vec{AM}|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}},{"name":"len","contract":{"kind":"exact"}}]}
            answer: 'p1 = -12; p2 = 2; len = sqrt(7)'
            solution_sketch: 'We have $\vec{AB}\cdot\vec{AC}=24\cdot(-\tfrac12)=-12$. Next, $\vec{AM}=\tfrac12(\vec{AB}+\vec{AC})$, so $\vec{AM}\cdot\vec{AB}=\tfrac12(16-12)=2$. Also $|\vec{AM}|^2=\tfrac14(16+36-24)=7$, so $|\vec{AM}|=\sqrt7$.'
          - problem: 'In the right trapezoid $ABCD$, the sides $AB$ and $DC$ are parallel and $\angle DAB=90^\circ$. Here $|AB|=8$, $|AD|=3$ and $|DC|=5$, and $\vec{DC}$ points the same way as $\vec{AB}$. Let $\vec a=\vec{AB}$. (a) Write $\vec{DC}$ in terms of $\vec a$. (b) Find $\vec{AC}\cdot\vec{AB}$. (c) Find $\vec{AC}\cdot\vec{BD}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"DC","contract":{"kind":"function","vars":["a"]}},{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'DC = 5/8*a; p1 = 40; p2 = -31'
            solution_sketch: 'The vector $\vec{DC}$ has the direction of $\vec a$ and the length $5$, so $\vec{DC}=\tfrac58\vec a$. Then $\vec{AC}=\vec{AD}+\tfrac58\vec a$ and $\vec{AD}\perp\vec a$, so $\vec{AC}\cdot\vec{AB}=\tfrac58\cdot64=40$. Also $\vec{BD}=\vec{AD}-\vec a$, so $\vec{AC}\cdot\vec{BD}=9-\tfrac58\cdot64=-31$.'
        constraints: 'The items vary the polygon and the side data. The rules for vectors stay fixed.'
      - id: kp2
        name: 'Coordinate vectors: length, collinear, perpendicular, parameter'
        key_prerequisites: [vector-norms-unit-vectors, vector-arithmetic, dot-product]
        exemplars:
          - problem: 'The points are $A(1,2)$ and $B(4,6)$. (a) Find the coordinates of $\vec{AB}$. (b) Find $|\vec{AB}|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"v","contract":{"kind":"coordinates","arity":2}},{"name":"len","contract":{"kind":"exact"}}]}
            answer: 'v = (3,4); len = 5'
            solution_sketch: 'The coordinates of $\vec{AB}$ are $(4-1,\,6-2)=(3,4)$. The length is $\sqrt{9+16}=5$.'
          - problem: 'Let $\vec a=(3,-2)$ and $\vec b=(1,4)$. Find (a) the coordinates of $2\vec a-\vec b$, (b) $\vec a\cdot\vec b$, (c) $|\vec a+\vec b|$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"v","contract":{"kind":"coordinates","arity":2}},{"name":"dot","contract":{"kind":"exact"}},{"name":"len","contract":{"kind":"exact"}}]}
            answer: 'v = (5,-8); dot = -5; len = 2*sqrt(5)'
            solution_sketch: 'We have $2\vec a-\vec b=(6-1,\,-4-4)=(5,-8)$. Also $\vec a\cdot\vec b=3-8=-5$. Next, $\vec a+\vec b=(4,2)$ and $|\vec a+\vec b|=\sqrt{20}=2\sqrt5$.'
          - problem: 'Let $\vec a=(4,-6)$ and $\vec b=(m,9)$, and let $\vec a$ and $\vec b$ be collinear. (a) Find $m$. (b) Find the number $\lambda$ with $\vec b=\lambda\vec a$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"m","contract":{"kind":"exact"}},{"name":"lam","contract":{"kind":"exact"}}]}
            answer: 'm = -6; lam = -3/2'
            solution_sketch: 'Collinear vectors have proportional coordinates, so $4\cdot9=-6m$ and $m=-6$. Then $\lambda=9/(-6)=-\tfrac32$. Check: $-\tfrac32\cdot4=-6$.'
          - problem: 'Let $\vec a=(3,4)$ and $\vec b=(n,-3)$, and let $\vec a\perp\vec b$. (a) Find $n$. (b) Find $|\vec b|$. (c) Find $\vec a\cdot(\vec a+\vec b)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"n","contract":{"kind":"exact"}},{"name":"len","contract":{"kind":"exact"}},{"name":"dot","contract":{"kind":"exact"}}]}
            answer: 'n = 4; len = 5; dot = 25'
            solution_sketch: 'Perpendicular vectors have scalar product $0$, so $3n-12=0$ and $n=4$. Then $|\vec b|=\sqrt{16+9}=5$. Also $\vec a+\vec b=(7,1)$, so $\vec a\cdot(\vec a+\vec b)=21+4=25$.'
          - problem: 'Let $\vec a=(5,-12)$. (a) Find $|\vec a|$. (b) Find the coordinates of the vector that has the opposite direction to $\vec a$ and the length $39$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"len","contract":{"kind":"exact"}},{"name":"v","contract":{"kind":"coordinates","arity":2}}]}
            answer: 'len = 13; v = (-15,36)'
            solution_sketch: 'We have $|\vec a|=\sqrt{25+144}=13$. The new vector has length $39=3\cdot13$ and the opposite direction, so it equals $-3\vec a$. This is $(-15,36)$.'
          - problem: 'Let $\vec a=(m,2)$ and $\vec b=(8,m)$. (a) Find all values of $m$ for which $\vec a$ and $\vec b$ are collinear. (b) Find the value of $m$ for which they are collinear and have the same direction. (c) Find the value of $m$ for which they are perpendicular.'
            answer_contract: {"kind":"multipart","parts":[{"name":"all","contract":{"kind":"set"}},{"name":"same","contract":{"kind":"exact"}},{"name":"perp","contract":{"kind":"exact"}}]}
            answer: 'all = {-4, 4}; same = 4; perp = 0'
            solution_sketch: 'Collinear vectors give $m\cdot m=2\cdot8$, so $m^2=16$ and $m=\pm4$. For $m=4$, $\vec b=2\vec a$, so the directions are the same. For $m=-4$, $\vec b=-2\vec a$. Perpendicular vectors give $8m+2m=0$, so $m=0$.'
        constraints: 'The items vary the coordinates and the unknown parameter. The coordinate rules stay fixed.'
      - id: kp3
        name: 'Written proof of a vector identity'
        key_prerequisites: [dot-product-properties, vectors-polygon-scalar-product]
        exemplars:
          - problem: 'Let $|\vec a|=3$, $|\vec b|=5$ and $\vec a\cdot\vec b=-6$. Find (a) $\vec a\cdot(\vec a+\vec b)$ and (b) $|\vec a+\vec b|^2$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"sq","contract":{"kind":"exact"}}]}
            answer: 'p1 = 3; sq = 22'
            solution_sketch: 'We have $\vec a\cdot(\vec a+\vec b)=|\vec a|^2+\vec a\cdot\vec b=9-6=3$. Also $|\vec a+\vec b|^2=9+25+2\cdot(-6)=22$.'
          - problem: 'Let $|\vec a|=4$, $|\vec b|=1$ and the angle between $\vec a$ and $\vec b$ be $60^\circ$. Find (a) $\vec a\cdot\vec b$ and (b) $(2\vec a+\vec b)\cdot\vec b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"p2","contract":{"kind":"exact"}}]}
            answer: 'p1 = 2; p2 = 5'
            solution_sketch: 'We have $\vec a\cdot\vec b=4\cdot1\cdot\tfrac12=2$. Then $(2\vec a+\vec b)\cdot\vec b=2\cdot2+1=5$.'
          - problem: 'Let $|\vec a|=2$, $|\vec b|=3$ and $\vec a\cdot\vec b=1$. Find (a) $(\vec a+\vec b)\cdot(\vec a-\vec b)$, (b) $|\vec a-\vec b|^2$, (c) $(2\vec a-\vec b)\cdot(\vec a+3\vec b)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p1","contract":{"kind":"exact"}},{"name":"sq","contract":{"kind":"exact"}},{"name":"p3","contract":{"kind":"exact"}}]}
            answer: 'p1 = -5; sq = 11; p3 = -14'
            solution_sketch: 'We have $(\vec a+\vec b)\cdot(\vec a-\vec b)=|\vec a|^2-|\vec b|^2=4-9=-5$. Also $|\vec a-\vec b|^2=4+9-2=11$. Expand the last product: $2\cdot4+6\cdot1-1-3\cdot9=-14$.'
          - problem: 'Let $|\vec a|=3$, $|\vec b|=4$ and $|\vec a+\vec b|=6$. Find (a) $\vec a\cdot\vec b$, (b) $|\vec a-\vec b|^2$, (c) the cosine of the angle between $\vec a$ and $\vec b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"dot","contract":{"kind":"exact"}},{"name":"sq","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}}]}
            answer: 'dot = 11/2; sq = 14; cos = 11/24'
            solution_sketch: 'From $|\vec a+\vec b|^2=9+16+2\,\vec a\cdot\vec b=36$ we get $\vec a\cdot\vec b=\tfrac{11}{2}$. Then $|\vec a-\vec b|^2=25-11=14$. The cosine is $\tfrac{11/2}{12}=\tfrac{11}{24}$.'
          - problem: 'Let $|\vec a|=5$ and let $\vec a+\vec b$ be perpendicular to $\vec a-\vec b$. (a) Find $|\vec b|$. (b) Let also $\vec a\cdot\vec b=15$. Find the cosine of the angle between $\vec a$ and $\vec b$. (c) Find $|\vec a+\vec b|$ for $\vec a\cdot\vec b=15$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"len","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'len = 5; cos = 3/5; sum = 4*sqrt(5)'
            solution_sketch: 'Perpendicular vectors give $(\vec a+\vec b)\cdot(\vec a-\vec b)=|\vec a|^2-|\vec b|^2=0$, so $|\vec b|=5$. The cosine is $\tfrac{15}{25}=\tfrac35$. Also $|\vec a+\vec b|^2=25+25+30=80$, so the length is $4\sqrt5$.'
          - problem: 'The sides of a parallelogram are $\vec a$ and $\vec b$ with $|\vec a|=3$ and $|\vec b|=5$. The diagonal $\vec a+\vec b$ has length $7$. Find (a) $\vec a\cdot\vec b$, (b) the length of the other diagonal $\vec a-\vec b$, (c) the cosine of the angle between $\vec a$ and $\vec b$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"dot","contract":{"kind":"exact"}},{"name":"diag","contract":{"kind":"exact"}},{"name":"cos","contract":{"kind":"exact"}}]}
            answer: 'dot = 15/2; diag = sqrt(19); cos = 1/2'
            solution_sketch: 'From $9+25+2\,\vec a\cdot\vec b=49$ we get $\vec a\cdot\vec b=\tfrac{15}{2}$. Then $|\vec a-\vec b|^2=34-15=19$, so the other diagonal has length $\sqrt{19}$. The cosine is $\tfrac{15/2}{15}=\tfrac12$.'
          - problem: 'Prove that for all plane vectors $\vec a$ and $\vec b$: $|\vec a+\vec b|^2+|\vec a-\vec b|^2=2|\vec a|^2+2|\vec b|^2$.'
            answer_contract: {"kind":"written"}
            answer: 'Use $|\vec v|^2=\vec v\cdot\vec v$. Then $|\vec a+\vec b|^2=|\vec a|^2+2\,\vec a\cdot\vec b+|\vec b|^2$. In the same way, $|\vec a-\vec b|^2=|\vec a|^2-2\,\vec a\cdot\vec b+|\vec b|^2$. Add the two lines. The terms with $\vec a\cdot\vec b$ cancel. The sum is $2|\vec a|^2+2|\vec b|^2$.'
            solution_sketch: 'Follow the reference proof step by step.'
          - problem: 'Prove that the diagonals of a rhombus $ABCD$ are perpendicular.'
            answer_contract: {"kind":"written"}
            answer: 'Let $\vec a=\vec{AB}$ and $\vec d=\vec{AD}$. All sides of a rhombus are equal, so $|\vec a|=|\vec d|$. The diagonals are $\vec{AC}=\vec a+\vec d$ and $\vec{BD}=\vec d-\vec a$. Then $\vec{AC}\cdot\vec{BD}=|\vec d|^2-|\vec a|^2=0$. A zero scalar product means the diagonals are perpendicular.'
            solution_sketch: 'Follow the reference proof step by step.'
          - problem: 'In triangle $ABC$, the point $M$ is the midpoint of $BC$. Prove that $\vec{AM}=\tfrac12(\vec{AB}+\vec{AC})$.'
            answer_contract: {"kind":"written"}
            answer: 'Since $M$ is the midpoint of $BC$, $\vec{BM}=\tfrac12\vec{BC}$. By the triangle rule, $\vec{BC}=\vec{AC}-\vec{AB}$. Then $\vec{AM}=\vec{AB}+\vec{BM}=\vec{AB}+\tfrac12(\vec{AC}-\vec{AB})$. This equals $\tfrac12\vec{AB}+\tfrac12\vec{AC}$.'
            solution_sketch: 'Follow the reference proof step by step.'
        constraints: 'The items vary the given lengths and products. The properties of the scalar product stay fixed.'
    diagnostic_exemplar:
      problem: 'Let $\vec a=(1,2)$ and $\vec b=(3,-1)$. Find (a) the coordinates of $\vec a+\vec b$ and (b) $\vec a\cdot\vec b$.'
      answer_contract: {"kind":"multipart","parts":[{"name":"s","contract":{"kind":"coordinates","arity":2}},{"name":"p","contract":{"kind":"exact"}}]}
      answer: 's = (4,1); p = 1'
      solution_sketch: 'Add the coordinates: $(4,1)$. Then $1\cdot3+2\cdot(-1)=1$.'
  - id: vbe-cp15-trig-expressions
