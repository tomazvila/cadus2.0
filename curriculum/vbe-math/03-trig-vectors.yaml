        weight: 0.4
        key: false
      - id: graphing-inequalities-number-line
        weight: 0.4
        key: false
    knowledge_points:
      - id: kp1
        name: 'Equation with a general solution and the roots in an interval'
        key_prerequisites: [trig-equations-general-solutions, basic-trig-equations]
        exemplars:
          - problem: 'Solve $2\sin x-1=0$. (a) Find all solutions in $[0,2\pi]$. (b) How many solutions are in $[0,4\pi]$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"sol","contract":{"kind":"set"}},{"name":"n","contract":{"kind":"exact"}}]}
            answer: 'sol = {pi/6, 5*pi/6}; n = 4'
            solution_sketch: 'The equation gives $\sin x=\tfrac12$, so $x=\tfrac\pi6$ or $x=\tfrac{5\pi}6$ in $[0,2\pi]$. The next period adds $2\pi$ to each, which gives two more solutions in $[2\pi,4\pi]$. The total is $4$.'
          - problem: 'Solve $\cos x=-\tfrac{\sqrt3}{2}$. (a) Find all solutions in $[0,2\pi]$. (b) Write the series of solutions that contains $\tfrac{5\pi}6$ in the form $x=\dots$ with an integer $k$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sol","contract":{"kind":"set"}},{"name":"series","contract":{"kind":"function","vars":["k"]}}]}
            answer: 'sol = {5*pi/6, 7*pi/6}; series = 5*pi/6+2*pi*k'
            solution_sketch: 'The angles with cosine $-\tfrac{\sqrt3}{2}$ are $\tfrac{5\pi}6$ and $\tfrac{7\pi}6$. The cosine has period $2\pi$. So the series with $\tfrac{5\pi}6$ is $\tfrac{5\pi}6+2\pi k$.'
          - problem: 'Solve $\tan x=\sqrt3$. (a) Write all solutions in the form $x=\dots$ with an integer $k$. (b) Find the sum of the solutions in $[0,2\pi]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"gen","contract":{"kind":"function","vars":["k"]}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'gen = pi/3+pi*k; sum = 5*pi/3'
            solution_sketch: 'The tangent has period $\pi$ and $\tan\tfrac\pi3=\sqrt3$, so $x=\tfrac\pi3+\pi k$. In $[0,2\pi]$ the solutions are $\tfrac\pi3$ and $\tfrac{4\pi}3$. Their sum is $\tfrac{5\pi}3$.'
          - problem: 'Solve $\sin2x=\tfrac{\sqrt3}{2}$. (a) Find all solutions in $[0,\pi]$. (b) Find the largest solution in $[0,2\pi]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sol","contract":{"kind":"set"}},{"name":"big","contract":{"kind":"exact"}}]}
            answer: 'sol = {pi/6, pi/3}; big = 4*pi/3'
            solution_sketch: 'Put $t=2x$. Then $\sin t=\tfrac{\sqrt3}{2}$, so $t=\tfrac\pi3$ or $t=\tfrac{2\pi}3$ in $[0,2\pi]$. This gives $x=\tfrac\pi6$ or $x=\tfrac\pi3$. In $[0,2\pi]$ the variable $t$ runs to $4\pi$. The largest $t$ is $\tfrac{8\pi}3$, so the largest $x$ is $\tfrac{4\pi}3$.'
          - problem: 'Solve $2\cos\left(x-\tfrac\pi3\right)=1$. (a) Find all solutions in $[0,2\pi]$. (b) Find the sum of these solutions. (c) How many solutions are in $[0,6\pi]$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"sol","contract":{"kind":"set"}},{"name":"sum","contract":{"kind":"exact"}},{"name":"n","contract":{"kind":"exact"}}]}
            answer: 'sol = {0, 2*pi/3, 2*pi}; sum = 8*pi/3; n = 7'
            solution_sketch: 'We have $\cos(x-\tfrac\pi3)=\tfrac12$, so $x-\tfrac\pi3=\pm\tfrac\pi3+2\pi k$. This gives $x=2\pi k$ or $x=\tfrac{2\pi}3+2\pi k$. In $[0,2\pi]$ the solutions are $0$, $\tfrac{2\pi}3$ and $2\pi$, with sum $\tfrac{8\pi}3$. In $[0,6\pi]$ the first series gives $0,2\pi,4\pi,6\pi$ and the second gives $\tfrac{2\pi}3,\tfrac{8\pi}3,\tfrac{14\pi}3$. The total is $7$.'
          - problem: 'Solve $\sin\left(2x+\tfrac\pi4\right)=-\tfrac{\sqrt2}{2}$. (a) Find all solutions in $[0,\pi]$. (b) How many solutions are in $[0,2\pi]$? (c) Find the sum of the solutions in $[0,2\pi]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sol","contract":{"kind":"set"}},{"name":"n","contract":{"kind":"exact"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'sol = {pi/2, 3*pi/4}; n = 4; sum = 9*pi/2'
            solution_sketch: 'We have $2x+\tfrac\pi4=-\tfrac\pi4+2\pi k$ or $2x+\tfrac\pi4=\tfrac{5\pi}4+2\pi k$. So $x=-\tfrac\pi4+\pi k$ or $x=\tfrac\pi2+\pi k$. In $[0,\pi]$ these are $\tfrac{3\pi}4$ and $\tfrac\pi2$. In $[0,2\pi]$ they are $\tfrac{3\pi}4,\tfrac{7\pi}4,\tfrac\pi2,\tfrac{3\pi}2$, which are $4$ numbers with sum $\tfrac{9\pi}2$.'
        constraints: 'The items vary the function, the argument and the interval. The solution formulas stay fixed.'
      - id: kp2
        name: 'Product and quadratic forms'
        key_prerequisites: [trig-equations-general-solutions, zero-product-property, trig-equations-identities]
        exemplars:
          - problem: 'Solve $(2\sin x-1)\cos x=0$. (a) Find all solutions in $[0,\pi]$. (b) How many solutions are in $[0,2\pi]$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"sol","contract":{"kind":"set"}},{"name":"n","contract":{"kind":"exact"}}]}
            answer: 'sol = {pi/6, pi/2, 5*pi/6}; n = 4'
            solution_sketch: 'A product is zero when a factor is zero. If $\sin x=\tfrac12$, then $x=\tfrac\pi6$ or $\tfrac{5\pi}6$. If $\cos x=0$, then $x=\tfrac\pi2$ in $[0,\pi]$. In $[0,2\pi]$ the cosine is also zero at $\tfrac{3\pi}2$, and the sine gives only two roots, so the total is $4$.'
          - problem: 'Solve $(2\cos x-1)(\tan x-1)=0$ in $[0,\pi]$. (a) Find all solutions. (b) Find the sum of the solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sol","contract":{"kind":"set"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'sol = {pi/4, pi/3}; sum = 7*pi/12'
            solution_sketch: 'The factor $2\cos x-1$ is zero at $x=\tfrac\pi3$. The factor $\tan x-1$ is zero at $x=\tfrac\pi4$. The sum is $\tfrac\pi3+\tfrac\pi4=\tfrac{7\pi}{12}$.'
          - problem: 'Solve $2\sin^2x-3\sin x+1=0$. (a) Find the values of $\sin x$. (b) Find all solutions in $[0,2\pi]$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"vals","contract":{"kind":"set"}},{"name":"sol","contract":{"kind":"set"}}]}
            answer: 'vals = {1/2, 1}; sol = {pi/6, pi/2, 5*pi/6}'
            solution_sketch: 'Put $s=\sin x$. Then $2s^2-3s+1=(2s-1)(s-1)=0$, so $s=\tfrac12$ or $s=1$. The value $\tfrac12$ gives $x=\tfrac\pi6$ and $\tfrac{5\pi}6$. The value $1$ gives $x=\tfrac\pi2$.'
          - problem: 'Solve $2\cos^2x+\cos x-1=0$. (a) Find the values of $\cos x$. (b) Find all solutions in $[0,2\pi]$. (c) Find the sum of these solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"vals","contract":{"kind":"set"}},{"name":"sol","contract":{"kind":"set"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'vals = {-1, 1/2}; sol = {pi/3, pi, 5*pi/3}; sum = 3*pi'
            solution_sketch: 'Put $c=\cos x$. Then $2c^2+c-1=(2c-1)(c+1)=0$, so $c=\tfrac12$ or $c=-1$. The value $\tfrac12$ gives $\tfrac\pi3$ and $\tfrac{5\pi}3$. The value $-1$ gives $\pi$. The sum is $\tfrac\pi3+\pi+\tfrac{5\pi}3=3\pi$.'
          - problem: 'Solve $2\cos^2x+3\sin x=0$. Replace $\cos^2x$ by $1-\sin^2x$. (a) Find the root of the new quadratic equation in $\sin x$ that lies in $[-1,1]$. (b) Find all solutions in $[0,2\pi]$. (c) How many solutions are in $[0,4\pi]$?'
            answer_contract: {"kind":"multipart","parts":[{"name":"s","contract":{"kind":"exact"}},{"name":"sol","contract":{"kind":"set"}},{"name":"n","contract":{"kind":"exact"}}]}
            answer: 's = -1/2; sol = {7*pi/6, 11*pi/6}; n = 4'
            solution_sketch: 'We get $2-2s^2+3s=0$, which is $2s^2-3s-2=0$ with roots $s=2$ and $s=-\tfrac12$. Only $-\tfrac12$ lies in $[-1,1]$. Then $x=\tfrac{7\pi}6$ or $x=\tfrac{11\pi}6$ in $[0,2\pi]$. The next period doubles the count, so there are $4$ solutions in $[0,4\pi]$.'
          - problem: 'Solve $\cos2x=\sin x$. Use $\cos2x=1-2\sin^2x$. (a) Find the values of $\sin x$. (b) Find all solutions in $[0,2\pi]$. (c) Find the sum of these solutions.'
            answer_contract: {"kind":"multipart","parts":[{"name":"vals","contract":{"kind":"set"}},{"name":"sol","contract":{"kind":"set"}},{"name":"sum","contract":{"kind":"exact"}}]}
            answer: 'vals = {-1, 1/2}; sol = {pi/6, 5*pi/6, 3*pi/2}; sum = 5*pi/2'
            solution_sketch: 'We get $1-2s^2=s$, so $2s^2+s-1=(2s-1)(s+1)=0$. Then $s=\tfrac12$ or $s=-1$. The value $\tfrac12$ gives $\tfrac\pi6$ and $\tfrac{5\pi}6$. The value $-1$ gives $\tfrac{3\pi}2$. The sum is $\tfrac{5\pi}2$.'
        constraints: 'The items vary the factors and the quadratic. The method of substitution stays fixed.'
      - id: kp3
        name: 'Trigonometric inequality'
        key_prerequisites: [trig-inequalities, graphing-inequalities-number-line]
        exemplars:
          - problem: 'Solve $\sin x>\tfrac12$ in $[0,2\pi]$. (a) Find the solution of $\sin x=\tfrac12$ in $[0,\tfrac\pi2]$. (b) Write the solution set of the inequality as an inequality in $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"x0","contract":{"kind":"exact"}},{"name":"sol","contract":{"kind":"inequality_union"}}]}
            answer: 'x0 = pi/6; sol = pi/6 < x < 5*pi/6'
            solution_sketch: 'The sine equals $\tfrac12$ at $\tfrac\pi6$ and $\tfrac{5\pi}6$. Between these two angles the sine is larger than $\tfrac12$. So $\tfrac\pi6<x<\tfrac{5\pi}6$.'
          - problem: 'Solve $\cos x\le0$ in $[0,2\pi]$. (a) Write the solution set as an inequality in $x$. (b) Find the length of the solution interval.'
            answer_contract: {"kind":"multipart","parts":[{"name":"sol","contract":{"kind":"inequality_union"}},{"name":"len","contract":{"kind":"exact"}}]}
            answer: 'sol = pi/2 <= x <= 3*pi/2; len = pi'
            solution_sketch: 'The cosine is zero at $\tfrac\pi2$ and $\tfrac{3\pi}2$ and negative between them. So $\tfrac\pi2\le x\le\tfrac{3\pi}2$. The length is $\pi$.'
          - problem: 'Solve $2\cos x-1>0$. (a) Write the solution set in $[-\pi,\pi]$ as an inequality in $x$. (b) Write the solution set in $[0,2\pi]$ as an inequality in $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = -pi/3 < x < pi/3; b = 0 <= x < pi/3 or 5*pi/3 < x <= 2*pi'
            solution_sketch: 'The inequality gives $\cos x>\tfrac12$. On $[-\pi,\pi]$ this holds for $-\tfrac\pi3<x<\tfrac\pi3$. On $[0,2\pi]$ the angles near $2\pi$ count too, and they are $\tfrac{5\pi}3<x\le2\pi$.'
          - problem: 'Solve the inequalities for $x\in\left(-\tfrac\pi2,\tfrac\pi2\right)$. (a) $\tan x\le-1$. (b) $\tan x>1$. Write each answer as an inequality in $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = -pi/2 < x <= -pi/4; b = pi/4 < x < pi/2'
            solution_sketch: 'The tangent increases on this interval. It equals $-1$ at $-\tfrac\pi4$ and $1$ at $\tfrac\pi4$. So $\tan x\le-1$ for $-\tfrac\pi2<x\le-\tfrac\pi4$, and $\tan x>1$ for $\tfrac\pi4<x<\tfrac\pi2$.'
          - problem: 'Solve $\sin x\le-\tfrac{\sqrt2}{2}$ in $[0,2\pi]$. (a) Write the solution set as an inequality in $x$. (b) Write the solution set of $\sin x>-\tfrac{\sqrt2}{2}$ in $[0,2\pi]$ as an inequality in $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = 5*pi/4 <= x <= 7*pi/4; b = 0 <= x < 5*pi/4 or 7*pi/4 < x <= 2*pi'
            solution_sketch: 'The sine equals $-\tfrac{\sqrt2}{2}$ at $\tfrac{5\pi}4$ and $\tfrac{7\pi}4$. It is at most that value between them. The rest of $[0,2\pi]$ gives the second answer.'
          - problem: 'Solve in $[0,2\pi]$. (a) Solve $\sin x>\tfrac{\sqrt3}{2}$. (b) Solve $\sin2x<\tfrac{\sqrt3}{2}$ in $[0,\pi]$. Write each answer as an inequality in $x$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"inequality_union"}},{"name":"b","contract":{"kind":"inequality_union"}}]}
            answer: 'a = pi/3 < x < 2*pi/3; b = 0 <= x < pi/6 or pi/3 < x <= pi'
            solution_sketch: 'The sine is larger than $\tfrac{\sqrt3}{2}$ between $\tfrac\pi3$ and $\tfrac{2\pi}3$. For (b), put $t=2x$ with $t\in[0,2\pi]$. Then $\sin t<\tfrac{\sqrt3}{2}$ for $0\le t<\tfrac\pi3$ or $\tfrac{2\pi}3<t\le2\pi$. Divide by $2$ to get the answer for $x$.'
        constraints: 'The items vary the function and the bound. The interval of the answer stays inside the given domain.'
    diagnostic_exemplar:
      problem: 'Solve $2\cos x=1$. Find (a) the smallest positive solution and (b) the number of solutions in $[0,2\pi]$.'
      answer_contract: {"kind":"multipart","parts":[{"name":"x","contract":{"kind":"exact"}},{"name":"n","contract":{"kind":"exact"}}]}
      answer: 'x = pi/3; n = 2'
      solution_sketch: 'The cosine equals $\tfrac12$ at $\tfrac\pi3$. The other root in $[0,2\pi]$ is $\tfrac{5\pi}3$, so there are $2$ solutions.'
