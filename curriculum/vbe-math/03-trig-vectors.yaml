    knowledge_points:
      - id: kp1
        name: 'Addition and double-angle formulas in a numeric value'
        key_prerequisites: [sum-difference-identities, double-half-angle-identities, tangent-formulas-proofs]
        exemplars:
          - problem: 'Let $\sin\alpha=\tfrac35$ and let $\alpha$ be an acute angle. Find (a) $\cos\alpha$, (b) $\sin2\alpha$, (c) $\cos2\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"c","contract":{"kind":"exact"}},{"name":"s2","contract":{"kind":"exact"}},{"name":"c2","contract":{"kind":"exact"}}]}
            answer: 'c = 4/5; s2 = 24/25; c2 = 7/25'
            solution_sketch: 'Since $\alpha$ is acute, $\cos\alpha=\sqrt{1-\tfrac9{25}}=\tfrac45$. Then $\sin2\alpha=2\cdot\tfrac35\cdot\tfrac45=\tfrac{24}{25}$. Also $\cos2\alpha=\tfrac{16}{25}-\tfrac9{25}=\tfrac7{25}$.'
          - problem: 'Use the angle sum. Find the exact values of (a) $\sin75^\circ$ and (b) $\cos75^\circ$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"s","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 's = (sqrt(6)+sqrt(2))/4; c = (sqrt(6)-sqrt(2))/4'
            solution_sketch: 'Write $75^\circ=45^\circ+30^\circ$. Then $\sin75^\circ=\tfrac{\sqrt2}{2}\cdot\tfrac{\sqrt3}{2}+\tfrac{\sqrt2}{2}\cdot\tfrac12=\tfrac{\sqrt6+\sqrt2}{4}$. Also $\cos75^\circ=\tfrac{\sqrt2}{2}\cdot\tfrac{\sqrt3}{2}-\tfrac{\sqrt2}{2}\cdot\tfrac12=\tfrac{\sqrt6-\sqrt2}{4}$.'
          - problem: 'Let $\tan\alpha=2$ and $\tan\beta=3$. Find (a) $\tan(\alpha+\beta)$, (b) $\tan2\alpha$, (c) $\tan(\beta-\alpha)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"t1","contract":{"kind":"exact"}},{"name":"t2","contract":{"kind":"exact"}},{"name":"t3","contract":{"kind":"exact"}}]}
            answer: 't1 = -1; t2 = -4/3; t3 = 1/7'
            solution_sketch: 'We have $\tan(\alpha+\beta)=\tfrac{2+3}{1-6}=-1$. Also $\tan2\alpha=\tfrac{4}{1-4}=-\tfrac43$. Last, $\tan(\beta-\alpha)=\tfrac{3-2}{1+6}=\tfrac17$.'
          - problem: 'Let $\cos\alpha=-\tfrac5{13}$ and let $\alpha$ be in the second quadrant. Find (a) $\sin\alpha$, (b) $\sin2\alpha$, (c) $\cos2\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"s","contract":{"kind":"exact"}},{"name":"s2","contract":{"kind":"exact"}},{"name":"c2","contract":{"kind":"exact"}}]}
            answer: 's = 12/13; s2 = -120/169; c2 = -119/169'
            solution_sketch: 'In the second quadrant $\sin\alpha>0$, so $\sin\alpha=\sqrt{1-\tfrac{25}{169}}=\tfrac{12}{13}$. Then $\sin2\alpha=2\cdot\tfrac{12}{13}\cdot(-\tfrac5{13})=-\tfrac{120}{169}$. Also $\cos2\alpha=\tfrac{25}{169}-\tfrac{144}{169}=-\tfrac{119}{169}$.'
          - problem: 'Let $\alpha$ and $\beta$ be acute angles with $\sin\alpha=\tfrac45$ and $\cos\beta=\tfrac5{13}$. Find (a) $\cos(\alpha+\beta)$, (b) $\sin(\alpha+\beta)$, (c) $\tan(\alpha+\beta)$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"c","contract":{"kind":"exact"}},{"name":"s","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}}]}
            answer: 'c = -33/65; s = 56/65; t = -56/33'
            solution_sketch: 'Acute angles give $\cos\alpha=\tfrac35$ and $\sin\beta=\tfrac{12}{13}$. Then $\cos(\alpha+\beta)=\tfrac35\cdot\tfrac5{13}-\tfrac45\cdot\tfrac{12}{13}=-\tfrac{33}{65}$. Also $\sin(\alpha+\beta)=\tfrac45\cdot\tfrac5{13}+\tfrac35\cdot\tfrac{12}{13}=\tfrac{56}{65}$. The tangent is the quotient, $-\tfrac{56}{33}$.'
          - problem: 'Let $\alpha$ be in the interval $(\tfrac\pi2,\pi)$ and let $\sin\alpha+\cos\alpha=\tfrac15$. Find (a) $\sin2\alpha$, (b) $\sin\alpha-\cos\alpha$, (c) $\sin\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"s2","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}},{"name":"s","contract":{"kind":"exact"}}]}
            answer: 's2 = -24/25; d = 7/5; s = 4/5'
            solution_sketch: 'Square the given equation: $1+\sin2\alpha=\tfrac1{25}$, so $\sin2\alpha=-\tfrac{24}{25}$. Then $(\sin\alpha-\cos\alpha)^2=1-\sin2\alpha=\tfrac{49}{25}$. In this interval $\sin\alpha>0>\cos\alpha$, so the difference is $\tfrac75$. Add the two equations: $2\sin\alpha=\tfrac85$, so $\sin\alpha=\tfrac45$.'
        constraints: 'The items vary the given ratio and the angle. The sum and double-angle formulas stay fixed.'
      - id: kp2
        name: 'Prove an identity (show that) and an exact value'
        key_prerequisites: [tangent-formulas-proofs, trig-identities-basic, product-to-sum-identities]
        exemplars:
          - problem: 'Find (a) $\sin\tfrac{\pi}{12}\cos\tfrac{\pi}{12}$ and (b) $\cos^2\tfrac{\pi}{12}-\sin^2\tfrac{\pi}{12}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"p","contract":{"kind":"exact"}},{"name":"d","contract":{"kind":"exact"}}]}
            answer: 'p = 1/4; d = sqrt(3)/2'
            solution_sketch: 'We have $\sin2\alpha=2\sin\alpha\cos\alpha$, so the product is $\tfrac12\sin\tfrac\pi6=\tfrac14$. The difference of squares is $\cos\tfrac\pi6=\tfrac{\sqrt3}{2}$.'
          - problem: 'Let $t=\tan\tfrac\pi8$ and $t>0$. (a) Use $\tan\tfrac\pi4=1$ and the formula for $\tan2\alpha$ to find $t$. (b) Find $\dfrac1t$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"t","contract":{"kind":"exact"}},{"name":"inv","contract":{"kind":"exact"}}]}
            answer: 't = sqrt(2)-1; inv = sqrt(2)+1'
            solution_sketch: 'Put $\alpha=\tfrac\pi8$: $1=\tfrac{2t}{1-t^2}$, so $t^2+2t-1=0$. The positive root is $t=\sqrt2-1$. Then $\tfrac1t=\tfrac1{\sqrt2-1}=\sqrt2+1$.'
          - problem: 'Find the value of (a) $\cos40^\circ\cos20^\circ-\sin40^\circ\sin20^\circ$, (b) $\sin70^\circ\cos20^\circ+\cos70^\circ\sin20^\circ$, (c) $\dfrac{2\tan15^\circ}{1-\tan^2 15^\circ}$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"c","contract":{"kind":"exact"}}]}
            answer: 'a = 1/2; b = 1; c = sqrt(3)/3'
            solution_sketch: 'The first sum equals $\cos(40^\circ+20^\circ)=\cos60^\circ=\tfrac12$. The second equals $\sin90^\circ=1$. The fraction equals $\tan30^\circ=\tfrac{\sqrt3}{3}$.'
          - problem: 'Let $\alpha$ be an acute angle with $\cos2\alpha=\tfrac7{25}$. Use $\cos2\alpha=1-2\sin^2\alpha$. Find (a) $\sin^2\alpha$, (b) $\sin\alpha$, (c) $\tan\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"s2","contract":{"kind":"exact"}},{"name":"s","contract":{"kind":"exact"}},{"name":"t","contract":{"kind":"exact"}}]}
            answer: 's2 = 9/25; s = 3/5; t = 3/4'
            solution_sketch: 'From $1-2\sin^2\alpha=\tfrac7{25}$ we get $\sin^2\alpha=\tfrac9{25}$. An acute angle has $\sin\alpha=\tfrac35$ and $\cos\alpha=\tfrac45$. So $\tan\alpha=\tfrac34$.'
          - problem: 'Find the value of (a) $\sin50^\circ\cos10^\circ+\cos50^\circ\sin10^\circ$, (b) $\cos^275^\circ-\sin^275^\circ$, (c) the product of the first two values.'
            answer_contract: {"kind":"multipart","parts":[{"name":"a","contract":{"kind":"exact"}},{"name":"b","contract":{"kind":"exact"}},{"name":"prod","contract":{"kind":"exact"}}]}
            answer: 'a = sqrt(3)/2; b = -sqrt(3)/2; prod = -3/4'
            solution_sketch: 'The first sum equals $\sin60^\circ=\tfrac{\sqrt3}{2}$. The second difference equals $\cos150^\circ=-\tfrac{\sqrt3}{2}$. The product is $-\tfrac34$.'
          - problem: 'Let $\tan(\alpha+\beta)=3$ and $\tan\alpha=\tfrac12$. Find (a) $\tan\beta$, (b) $\tan(\alpha-\beta)$, (c) $\tan2\alpha$.'
            answer_contract: {"kind":"multipart","parts":[{"name":"tb","contract":{"kind":"exact"}},{"name":"td","contract":{"kind":"exact"}},{"name":"t2","contract":{"kind":"exact"}}]}
            answer: 'tb = 1; td = -1/3; t2 = 4/3'
            solution_sketch: 'From $3=\tfrac{1/2+t}{1-t/2}$ we get $3-\tfrac32t=\tfrac12+t$, so $t=1$. Then $\tan(\alpha-\beta)=\tfrac{1/2-1}{1+1/2}=-\tfrac13$. Also $\tan2\alpha=\tfrac{1}{1-1/4}=\tfrac43$.'
          - problem: 'Prove that $\sin2\alpha=\dfrac{2\tan\alpha}{1+\tan^2\alpha}$ for every angle $\alpha$ with $\cos\alpha\ne0$.'
            answer_contract: {"kind":"written"}
            answer: 'Write $\sin2\alpha=2\sin\alpha\cos\alpha$. Divide and multiply by $\cos\alpha$: $2\sin\alpha\cos\alpha=2\tan\alpha\cos^2\alpha$. The identity $1+\tan^2\alpha=\tfrac1{\cos^2\alpha}$ gives $\cos^2\alpha=\tfrac1{1+\tan^2\alpha}$. Put this in the line above. The result is $\tfrac{2\tan\alpha}{1+\tan^2\alpha}$.'
            solution_sketch: 'Follow the reference proof step by step.'
          - problem: 'Prove that $\cos^4\alpha-\sin^4\alpha=\cos2\alpha$ for every angle $\alpha$.'
            answer_contract: {"kind":"written"}
            answer: 'Factor the left side as a difference of squares: $\cos^4\alpha-\sin^4\alpha=(\cos^2\alpha-\sin^2\alpha)(\cos^2\alpha+\sin^2\alpha)$. The second factor equals $1$. The first factor equals $\cos2\alpha$ by the double angle formula. So the left side equals $\cos2\alpha$.'
            solution_sketch: 'Follow the reference proof step by step.'
          - problem: 'Prove that $\sin3\alpha=3\sin\alpha-4\sin^3\alpha$ for every angle $\alpha$.'
            answer_contract: {"kind":"written"}
            answer: 'Write $\sin3\alpha=\sin(2\alpha+\alpha)=\sin2\alpha\cos\alpha+\cos2\alpha\sin\alpha$. Use $\sin2\alpha=2\sin\alpha\cos\alpha$ and $\cos2\alpha=1-2\sin^2\alpha$. Then $\sin3\alpha=2\sin\alpha(1-\sin^2\alpha)+(1-2\sin^2\alpha)\sin\alpha$. Expand: $2\sin\alpha-2\sin^3\alpha+\sin\alpha-2\sin^3\alpha$. This equals $3\sin\alpha-4\sin^3\alpha$.'
            solution_sketch: 'Follow the reference proof step by step.'
        constraints: 'The items vary the expression and the exact value. The identities stay fixed.'
    diagnostic_exemplar:
      problem: 'Let $\alpha$ be an acute angle with $\sin\alpha=\tfrac5{13}$. Find (a) $\cos\alpha$ and (b) $\sin2\alpha$.'
      answer_contract: {"kind":"multipart","parts":[{"name":"c","contract":{"kind":"exact"}},{"name":"s","contract":{"kind":"exact"}}]}
      answer: 'c = 12/13; s = 120/169'
      solution_sketch: 'An acute angle has $\cos\alpha=\tfrac{12}{13}$. Then $\sin2\alpha=2\cdot\tfrac5{13}\cdot\tfrac{12}{13}=\tfrac{120}{169}$.'
  - id: vbe-cp16-trig-equations
    name: Trigonometric equations and inequalities
    lt_term: 'Trigonometrinės lygtys ir nelygybės'
    area: models
    program_items: [121, 122, 123, 124, 125, 126, 127, 128]
    core: false
    difficulty: 0.65
    drill: false
    answer_kind: multi-step
    expected_time_secs: 420
    prerequisites:
      - id: trig-equations-general-solutions
        weight: 0.6
        key: true
      - id: trig-inequalities
        weight: 0.4
        key: false
      - id: basic-trig-equations
        weight: 0.4
        key: false
      - id: sinusoid-phase-shift
        weight: 0.4
        key: false
      - id: inverse-trig-functions
        weight: 0.4
        key: false
      - id: trig-equations-identities
        weight: 0.4
