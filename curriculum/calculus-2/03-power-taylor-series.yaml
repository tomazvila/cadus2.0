    knowledge_points:
      - id: kp1
        name: Expressing integrals as numerical series
        key_prerequisites: [taylor-maclaurin-series, differentiating-integrating-power-series]
        exemplars:
          - problem: "Use the Maclaurin series for sin(x)/x to express the integral of sin(x)/x from x = 0 to x = 1 as a numerical series sum a_n. Find a2 and a3."
            answer: "a2 = 1/600; a3 = -1/35280"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a2"}, {"contract": {"kind": "exact"}, "name": "a3"}]}
            solution_sketch: "Maclaurin series for sin(x)/x: the term with index n is (-1) to the n times x to the power 2n divided by (2n+1) factorial. Integrate term by term over [0, 1] using the power series integration rule. The integrated series has term a_n = (-1) to the n divided by the product (2n+1)! times (2n+1). For n=2, a2 = 1/(5! times 5) = 1/600. For n=3, a3 = -1/(7! times 7) = -1/35280. The answer is a2 = 1/600; a3 = -1/35280."
          - problem: "Use the Maclaurin series for exp(-x^2) to express the integral of exp(-x^2) from x = 0 to x = 1 as a numerical series sum a_n. Determine a2 and a3."
            answer: "a2 = 1/10; a3 = -1/42"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a2"}, {"contract": {"kind": "exact"}, "name": "a3"}]}
            solution_sketch: "Maclaurin series for exp(-x^2): the term with index n is (-1) to the n times x to the power 2n divided by n factorial. Integrate term by term over [0, 1] using the power series integration rule. The integrated series has term a_n = (-1) to the n divided by the product n! times (2n+1). For n=2, a2 = 1/(2! times 5) = 1/10. For n=3, a3 = -1/(3! times 7) = -1/42. The answer is a2 = 1/10; a3 = -1/42."
          - problem: "Use the Maclaurin series for cos(x^2) to express the integral of cos(x^2) from x = 0 to x = 1 as a numerical series sum a_n. Compute a2 and a3."
            answer: "a2 = 1/216; a3 = -1/9360"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a2"}, {"contract": {"kind": "exact"}, "name": "a3"}]}
            solution_sketch: "Maclaurin series for cos(x^2): the term with index n is (-1) to the n times x to the power 4n divided by (2n) factorial. Integrate term by term over [0, 1] using the power series integration rule. The integrated series has term a_n = (-1) to the n divided by the product (2n)! times (4n+1). For n=2, a2 = 1/(4! times 9) = 1/216. For n=3, a3 = -1/(6! times 13) = -1/9360. The answer is a2 = 1/216; a3 = -1/9360."
          - problem: "Use the Maclaurin series for exp(-x^2) to express the integral of exp(-x^2) from x = 0 to x = 2 as a numerical series sum a_n. Give a2 and a3."
            answer: "a2 = 16/5; a3 = -64/21"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a2"}, {"contract": {"kind": "exact"}, "name": "a3"}]}
            solution_sketch: "Maclaurin series for exp(-x^2): the term with index n is (-1) to the n times x to the power 2n divided by n factorial. Integrate term by term over [0, 2] using the power series integration rule. The integrated series has term a_n = (-1) to the n times 2 to the power 2n+1 divided by the product n! times (2n+1). For n=2, a2 = 2^5/(2! times 5) = 16/5. For n=3, a3 = -2^7/(3! times 7) = -64/21. The answer is a2 = 16/5; a3 = -64/21."
          - problem: "Use the Maclaurin series for sin(x^2) to express the integral of sin(x^2) from x = 0 to x = 2 as a numerical series sum a_n. State a2 and a3."
            answer: "a2 = 256/165; a3 = -2048/4725"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a2"}, {"contract": {"kind": "exact"}, "name": "a3"}]}
            solution_sketch: "Maclaurin series for sin(x^2): the term with index n is (-1) to the n times x to the power 4n+2 divided by (2n+1) factorial. Integrate term by term over [0, 2] using the power series integration rule. The integrated series has term a_n = (-1) to the n times 2 to the power 4n+3 divided by (2n+1)! times (4n+3). For n=2, a2 = 2^11/(5! times 11) = 256/165. For n=3, a3 = -2^15/(7! times 15) = -2048/4725. The answer is a2 = 256/165; a3 = -2048/4725."
          - problem: "Use the Maclaurin series for cos(x^2) to express the integral of cos(x^2) from x = 0 to x = 2 as a numerical series sum a_n. Evaluate a2 and a3."
            answer: "a2 = 64/27; a3 = -512/585"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a2"}, {"contract": {"kind": "exact"}, "name": "a3"}]}
            solution_sketch: "Maclaurin series for cos(x^2): the term with index n is (-1) to the n times x to the power 4n divided by (2n) factorial. Integrate term by term over [0, 2] using the power series integration rule. The integrated series has term a_n = (-1) to the n times 2 to the power 4n+1 divided by (2n)! times (4n+1). For n=2, a2 = 2^9/(4! times 9) = 64/27. For n=3, a3 = -2^13/(6! times 13) = -512/585. The answer is a2 = 64/27; a3 = -512/585."
        constraints: "integrands are sin/cos/exp of x or x^2 with no elementary antiderivative"
      - id: kp2
        name: Estimating to a target accuracy
        key_prerequisites: [taylor-polynomials-error, differentiating-integrating-power-series]
        exemplars:
          - problem: "Use the Maclaurin series for cos(x^2) to estimate the integral from 0 to 1 of cos(x^2) dx with error less than 1/100. Give the estimate as an exact fraction."
            answer: "9/10"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Maclaurin series is cos(x^2) = 1 - x^4/2 + x^8/24 - x^12/720 + .... Term-by-term integration of the power series from 0 to 1 gives 1 - 1/10 + 1/216 - 1/9360 + .... By the alternating series error bound, the error after k terms is at most the first omitted term. The term after two terms is 1/216, which is less than 1/100, while the second term 1/10 still exceeds 1/100, so two terms are needed. The estimate to this accuracy is 9/10."
          - problem: "Use the geometric series 1/(1+x^4) = 1 - x^4 + x^8 - x^12 + ... to estimate the integral from 0 to 1/2 of dx/(1+x^4) with error less than 1/1000. Give the estimate as an exact fraction."
            answer: "79/160"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The geometric series 1/(1+x^4) = 1 - x^4 + x^8 - x^12 + ... converges for absolute value of x less than 1, so term-by-term integration applies. Integrating from 0 to 1/2 gives 1/2 - (1/2)^5/5 + (1/2)^9/9 - ... = 1/2 - 1/160 + 1/4608 - .... By the alternating series error bound, the error after two terms is at most the first omitted term 1/4608, which is less than 1/1000, and the second term 1/160 exceeds 1/1000, so two terms are used. The estimate to this accuracy is 79/160."
          - problem: "Estimate the integral from 0 to 1 of e^(-x^2) dx with error less than 1/12 by integrating the Maclaurin series for e^(-x^2) term by term. Give the estimate as an exact fraction."
            answer: "23/30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Maclaurin series is e^(-x^2) = 1 - x^2 + x^4/2 - x^6/6 + .... Term-by-term integration from 0 to 1 gives the integrated series 1 - 1/3 + 1/10 - 1/42 + .... By the alternating series error bound, the error after three terms is at most the first omitted term 1/42, which is less than 1/12, while after two terms the bound 1/10 still exceeds 1/12, so three terms are required. The estimate is 1 - 1/3 + 1/10 = 23/30, so the answer is 23/30."
          - problem: "Use the Maclaurin series for cos(x^2) to build a series for the integral from 0 to 1 of cos(x^2) dx. Find how many terms of that integrated series are needed so that the error is less than 1/1000."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Integrating cos(x^2) = 1 - x^4/2 + x^8/24 - x^12/720 + ... term by term from 0 to 1 gives the series 1 - 1/10 + 1/216 - 1/9360 + .... By the alternating series error bound, the error after k terms is at most the (k+1)-th term. The term after two terms is 1/216, which is larger than 1/1000, while the term after three terms is 1/9360, which is less than 1/1000. So the number of terms needed is 3."
          - problem: "Multiply the Maclaurin series for cos(x^3) by x and integrate term by term to estimate the integral from 0 to 1 of x cos(x^3) dx with error less than 1/20. Give the estimate as an exact fraction."
            answer: "7/16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Maclaurin series cos(x^3) = 1 - x^6/2 + x^12/24 - ... multiplied by x gives x - x^7/2 + x^13/24 - .... Term-by-term integration from 0 to 1 gives the integrated series 1/2 - 1/16 + 1/336 - .... By the alternating series error bound, the error after two terms is at most the first omitted term 1/336, which is less than 1/20, while the second term 1/16 exceeds 1/20, so two terms are used. The estimate is 1/2 - 1/16 = 7/16, so the answer is 7/16."
          - problem: "Use the Maclaurin series for sin(x) with x replaced by x^3 to estimate the integral from 0 to 1 of sin(x^3) dx with error less than 1/100. Give the estimate as an exact fraction."
            answer: "7/30"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Substituting x^3 into the sine series gives sin(x^3) = x^3 - x^9/6 + x^15/120 - .... Term-by-term integration from 0 to 1 gives the integrated series 1/4 - 1/60 + 1/1920 - .... By the alternating series error bound, the error after two terms is at most the first omitted term 1/1920, which is less than 1/100, while after one term the bound 1/60 exceeds 1/100, so two terms are needed. The estimate is 1/4 - 1/60 = 7/30, so the answer is 7/30."
        constraints: "the target accuracy reached within three terms; error justified by the first omitted term"
      - id: kp3
        name: Recognizing famous numerical series
        key_prerequisites: [differentiating-integrating-power-series]
        exemplars:
          - problem: 'Evaluate $\sum_{n=0}^{\infty} \frac{(-1)^n}{2n+1}$ by recognizing a standard series at an endpoint.'
            answer: '$\pi/4$'
            solution_sketch: 'The $\arctan$ series at $x = 1$.'
          - problem: 'Evaluate $\sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$ by recognizing a standard series at an endpoint.'
            answer: '$\ln 2$'
            solution_sketch: 'The $\ln(1+x)$ series at $x = 1$.'
          - problem: "Evaluate the sum over n from 0 to infinity of (-1)^n divided by (3^n times (2n+1)) by recognizing the arctan series at a simple argument."
            answer: "pi sqrt(3)/6"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: recall arctan(x) = sum from n = 0 to infinity of (-1)^n x^(2n+1)/(2n+1). Step 2: put x = 1/sqrt(3). Then x^(2n+1) = 1/(sqrt(3) 3^n), so the given series equals sqrt(3) arctan(1/sqrt(3)) = sqrt(3) pi/6. The value of the series is pi sqrt(3)/6."
          - problem: "Evaluate the sum over n from 1 to infinity of (-1)^(n+1) divided by (n times 2^n) by recognizing the ln(1+x) series at a simple argument. Give the answer to 4 decimals."
            answer: "0.4055"
            answer_contract: {"decimals": 4, "kind": "approx"}
            solution_sketch: "Step 1: recall ln(1+x) = sum from n = 1 to infinity of (-1)^(n+1) x^n/n. Step 2: put x = 1/2, so the series becomes ln(3/2). Step 3: compute ln(3/2) = 0.405465... Rounded to 4 decimals, the answer is 0.4055."
          - problem: "Evaluate the sum over n from 0 to infinity of (-1)^n divided by n factorial by recognizing the exponential series at a simple argument."
            answer: "e^(-1)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: recall the exponential series e^x = sum from n = 0 to infinity of x^n divided by n factorial. Step 2: put x = -1, so each term becomes (-1)^n divided by n factorial, exactly the given series. The series converges to e^(-1). Evaluate the sum: the value is e^(-1)."
          - problem: "Evaluate the sum over n from 0 to infinity of 1 divided by (n factorial times 2^n) by recognizing the exponential series at a simple argument."
            answer: "sqrt(e)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: recall the exponential series e^x = sum from n = 0 to infinity of x^n divided by n factorial. Step 2: rewrite each term 1 divided by (n factorial times 2^n) as (1/2)^n divided by n factorial, so the series is the exponential series at x = 1/2. Evaluate the sum: it equals e^(1/2), which is sqrt(e). The value is sqrt(e)."
        constraints: "sums matching arctan, ln(1+x), or e^x at simple arguments"
