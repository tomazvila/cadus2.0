unit: power-taylor-series
course: calculus-2
module: "Power & Taylor Series"
topics:
  - id: radius-of-convergence
    name: Radius of Convergence
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: ratio-root-tests
        weight: 0.8
        key: true
      - id: sequences-convergence
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Radius via the ratio test
        key_prerequisites: [ratio-root-tests]
        exemplars:
          - problem: 'Find the radius of convergence of $\sum_{n=1}^{\infty} \frac{x^n}{n}$.'
            answer: '$R = 1$'
            solution_sketch: '$\left|\frac{a_{n+1}}{a_n}\right| = |x| \cdot \frac{n}{n+1} \to |x|$; converges for $|x| < 1$.'
          - problem: 'Find the radius of convergence of $\sum_{n=0}^{\infty} n! \, x^n$.'
            answer: '$R = 0$'
            solution_sketch: 'The ratio is $(n+1)|x| \to \infty$ for any $x \ne 0$; only $x = 0$ works.'
          - problem: "Find the radius of convergence of the series $\\sum_{n=0}^{\\infty} \\frac{x^n}{n!}$."
            answer: "infinity"
            answer_contract: {"kind": "label", "options": [["infinity", "inf", "oo"], ["0"], ["1"], ["2"]]}
            solution_sketch: "The series is sum x^n / n! with a_n = 1/n!. Apply the ratio test: |a_{n+1}/a_n| = |x|/(n+1). For any fixed x this tends to 0, which is less than 1, so the series converges for every x. Choosing 0 would be the error of assuming only x=0 converges. Choosing 1 would be the error of treating the series like 1/n. Choosing 2 would be the error of using the wrong coefficient. The radius of convergence is infinity."
          - problem: "Find the radius of convergence of the series $\\sum_{n=0}^{\\infty} \\frac{x^n}{2^n}$."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is sum x^n / 2^n with a_n = 1/2^n. Ratio test: |a_{n+1}/a_n| = |x|/2. The series converges when |x|/2 < 1, so |x| < 2. The radius of convergence is 2."
          - problem: "Find the radius of convergence of the series $\\sum_{n=1}^{\\infty} \\frac{n x^n}{3^n}$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is sum n x^n / 3^n with a_n = n/3^n. Ratio test: |a_{n+1}/a_n| = (n+1)/n * |x|/3, which tends to |x|/3. Convergence needs |x|/3 < 1, so |x| < 3. The radius of convergence is 3."
          - problem: "Find the radius of convergence of the series $\\sum_{n=0}^{\\infty} 2^n x^n$."
            answer: "1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is sum 2^n x^n = sum (2x)^n, a geometric series with ratio 2x. It converges when |2x| < 1, so |x| < 1/2. The radius of convergence is 1/2."
        constraints: "coefficients built from n, n!, c^n; include the degenerate R = 0 and R = infinity cases"
      - id: kp2
        name: Radius via the root test
        key_prerequisites: [ratio-root-tests]
        exemplars:
          - problem: "Find the radius of convergence of the series whose general term is 4^n x^n, using the root test, and give the answer as a fraction."
            answer: "1/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is sum 4^n x^n, so its coefficient is a_n = 4^n. The root test gives the nth root |a_n|^(1/n) |x| = 4|x|. Convergence needs 4|x| < 1, so |x| < 1/4. The radius of convergence is 1/4."
          - problem: 'Find the radius of convergence of $\sum_{n=0}^{\infty} 2^n x^n$.'
            answer: '$R = \frac{1}{2}$'
            solution_sketch: '$\sqrt[n]{|a_n|} = 2|x| < 1$ iff $|x| < \frac{1}{2}$.'
          - problem: "Find the radius of convergence of the series with general term x^n/3^n, using the root test."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is sum x^n/3^n, so its coefficient is a_n = 1/3^n. The root test gives |a_n|^(1/n) |x| = |x|/3. Convergence needs |x|/3 < 1, so |x| < 3. The radius of convergence is 3."
          - problem: "Find the radius of convergence of the series whose general term is 5^n x^n, using the root test, and give the answer as a fraction."
            answer: "1/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is sum 5^n x^n, so its coefficient is a_n = 5^n. The root test gives |a_n|^(1/n) |x| = 5|x|. Convergence needs 5|x| < 1, so |x| < 1/5. The radius of convergence is 1/5."
          - problem: "Find the radius of convergence of the series with general term (3/2)^n x^n, using the root test, and give the answer as a fraction."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is sum (3/2)^n x^n, so its coefficient is a_n = (3/2)^n. The root test gives |a_n|^(1/n) |x| = (3/2)|x|. Convergence needs (3/2)|x| < 1, so |x| < 2/3. The radius of convergence is 2/3."
          - problem: "Find the radius of convergence of the series whose general term is (n/2)^n x^n, using the root test."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is sum (n/2)^n x^n, so its coefficient is a_n = (n/2)^n. The root test gives |a_n|^(1/n) |x| = (n/2)|x|. For x not zero this limit is infinite, so the series converges only at x = 0. The radius of convergence is 0."
        constraints: "coefficients are explicit nth powers so the root test is immediate"
      - id: kp3
        name: Series centered away from zero
        key_prerequisites: [ratio-root-tests]
        exemplars:
          - problem: 'Find the center and radius of convergence of $\sum_{n=1}^{\infty} \frac{(x - 2)^n}{n \, 3^n}$.'
            answer: 'center $2$, $R = 3$'
            answer_contract: {kind: none}
            solution_sketch: 'The ratio test gives $\frac{|x - 2|}{3} < 1$.'
          - problem: 'Find the center and radius of convergence of $\sum_{n=1}^{\infty} \frac{n (x + 1)^n}{2^n}$.'
            answer: 'center $-1$, $R = 2$'
            answer_contract: {kind: none}
            solution_sketch: '$\left|\frac{a_{n+1}}{a_n}\right| = \frac{n+1}{n} \cdot \frac{|x+1|}{2} \to \frac{|x+1|}{2} < 1$.'
        constraints: "centers are small integers; coefficient bases are small integers"
    diagnostic_exemplar:
      problem: 'Find the center and radius of convergence of $\sum_{n=1}^{\infty} \frac{n(x - 3)^n}{4^n}$.'
      answer: 'center $3$, $R = 4$'
      answer_contract: {kind: none}
      solution_sketch: 'The ratio test gives $\lim \frac{n+1}{n}\cdot\frac{|x-3|}{4} = \frac{|x-3|}{4} < 1$.'
    anki_seeds:
      - front: "To find the radius of convergence of a power series, apply..."
        back: "the ratio (or root) test to the terms and solve L < 1 for |x - a|"
        type: basic
      - front: "The three possible shapes of the set where a power series converges?"
        back: "a single point (R = 0), a finite interval around the center (0 < R < infinity), or the whole line (R = infinity)"
        type: basic

  - id: geometric-power-series
    name: Geometric Power Series Representations
    core: true
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: geometric-series-convergence
        weight: 0.7
        key: true
      - id: rational-expressions
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Direct substitution into the geometric series
        key_prerequisites: [geometric-series-convergence]
        exemplars:
          - problem: 'Write $\frac{1}{1 - 2x}$ as a power series about $0$ and give its radius of convergence.'
            answer: '$\sum_{n=0}^{\infty} 2^n x^n$, $R = \frac{1}{2}$'
            answer_contract: {kind: none}
            solution_sketch: 'Geometric series with ratio $2x$; requires $|2x| < 1$.'
          - problem: 'Write $\frac{1}{1 + x^2}$ as a power series about $0$.'
            answer: '$\sum_{n=0}^{\infty} (-1)^n x^{2n}$ (for $|x| < 1$)'
            answer_contract: {kind: none}
            solution_sketch: 'Substitute $-x^2$ for the ratio in $\frac{1}{1 - r} = \sum r^n$.'
        constraints: "ratios of the form ax, -ax, x^2, -x^2; always state where the representation is valid"
      - id: kp2
        name: Multiplying by powers of x
        key_prerequisites: [geometric-series-convergence]
        exemplars:
          - problem: "The function f(x) = x/(1 - x) has a power series about 0. Give the smallest index n with a nonzero coefficient, and the coefficient of x^5."
            answer: "start = 1; a5 = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "start"}, {"contract": {"kind": "exact"}, "name": "a5"}]}
            solution_sketch: "The geometric series is 1/(1-x) = sum_{n=0}^\\infty x^n. Multiply by x: f(x) = x * sum_{n=0}^\\infty x^n = sum_{n=0}^\\infty x^{n+1} = sum_{n=1}^\\infty x^n. The first nonzero term is at index 1, so start = 1. The coefficient of x^5 is 1. So start = 1; a5 = 1."
          - problem: "The function g(x) = x^2/(1 + x) has a power series about 0. Give the smallest index n with a nonzero coefficient, and the coefficient of x^5."
            answer: "start = 2; a5 = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "start"}, {"contract": {"kind": "exact"}, "name": "a5"}]}
            solution_sketch: "Write 1/(1+x) as a geometric series: 1/(1+x) = sum_{n=0}^\\infty (-1)^n x^n. Multiply by x^2: g(x) = x^2 * sum_{n=0}^\\infty (-1)^n x^n = sum_{n=0}^\\infty (-1)^n x^{n+2}. The smallest index is n=2, so start = 2. The term with x^5 comes from n+2=5, so n=3, and its coefficient is (-1)^3 = -1. So start = 2; a5 = -1."
          - problem: "The function h(x) = x^4/(1 + x) has a power series about 0. Give the smallest index n with a nonzero coefficient, and the coefficient of x^7."
            answer: "start = 4; a7 = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "start"}, {"contract": {"kind": "exact"}, "name": "a7"}]}
            solution_sketch: "Start from the geometric series 1/(1+x) = sum_{n=0}^\\infty (-1)^n x^n. Multiply by x^4: h(x) = x^4 * sum_{n=0}^\\infty (-1)^n x^n = sum_{n=0}^\\infty (-1)^n x^{n+4}. The first nonzero term is at n=4, so start = 4. For x^7, set n+4=7, so n=3, and the coefficient is (-1)^3 = -1. So start = 4; a7 = -1."
          - problem: "The function f(x) = x^6/(1 - x) has a power series about 0. Give the coefficient of x^9 and the coefficient of x^10."
            answer: "a9 = 1; a10 = 1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a9"}, {"contract": {"kind": "exact"}, "name": "a10"}]}
            solution_sketch: "The geometric series 1/(1-x) = sum_{n=0}^\\infty x^n. Multiply by x^6: f(x) = x^6 * sum_{n=0}^\\infty x^n = sum_{n=0}^\\infty x^{n+6} = sum_{n=6}^\\infty x^n. Every coefficient from index 6 onward is 1. Hence the coefficient of x^9 is 1 and the coefficient of x^10 is 1. So a9 = 1; a10 = 1."
          - problem: "Find the coefficient of x^2 in the power series for x^4/(1 - x) about 0."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The geometric series 1/(1-x) = sum_{n=0}^\\infty x^n. Multiply by x^4: x^4/(1-x) = x^4 * sum_{n=0}^\\infty x^n = sum_{n=0}^\\infty x^{n+4} = sum_{n=4}^\\infty x^n. The series has no x^2 term because it starts at x^4. Therefore the coefficient of x^2 is 0. So the coefficient of x^2 is 0."
          - problem: "The function p(x) = x^3/(1 + x) has a power series about 0. Give the coefficient of x^5 and the coefficient of x^6."
            answer: "a5 = 1; a6 = -1"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a5"}, {"contract": {"kind": "exact"}, "name": "a6"}]}
            solution_sketch: "Write 1/(1+x) as a geometric series: 1/(1+x) = sum_{n=0}^\\infty (-1)^n x^n. Multiply by x^3: p(x) = x^3 * sum_{n=0}^\\infty (-1)^n x^n = sum_{n=0}^\\infty (-1)^n x^{n+3}. For x^5, set n+3=5, so n=2, and the coefficient is (-1)^2 = 1. For x^6, set n+3=6, so n=3, and the coefficient is (-1)^3 = -1. So a5 = 1; a6 = -1."
        constraints: "multiplication by x^k only; track the resulting starting index"
      - id: kp3
        name: Rewriting to reach geometric form
        key_prerequisites: [geometric-series-convergence, rational-expressions]
        exemplars:
          - problem: 'Write $\frac{1}{2 - x}$ as a power series about $0$ and give its radius of convergence.'
            answer: '$\sum_{n=0}^{\infty} \frac{x^n}{2^{n+1}}$, $R = 2$'
            answer_contract: {kind: none}
            solution_sketch: '$\frac{1}{2 - x} = \frac{1}{2} \cdot \frac{1}{1 - x/2}$; ratio $\frac{x}{2}$, valid for $|x| < 2$.'
          - problem: 'Write $\frac{1}{3 + x}$ as a power series about $0$ and give its radius of convergence.'
            answer: '$\sum_{n=0}^{\infty} \frac{(-1)^n x^n}{3^{n+1}}$, $R = 3$'
            answer_contract: {kind: none}
            solution_sketch: 'Factor out $3$: $\frac{1}{3} \cdot \frac{1}{1 + x/3}$ with ratio $-\frac{x}{3}$.'
        constraints: "denominators c ± x with small integer c; answers state R"
    diagnostic_exemplar:
      problem: 'Write $\frac{x}{2 + x}$ as a power series about $0$ and give its radius of convergence.'
      answer: '$\sum_{n=0}^{\infty} \frac{(-1)^n x^{n+1}}{2^{n+1}}$, $R = 2$'
      answer_contract: {kind: none}
      solution_sketch: '$\frac{1}{2+x} = \frac{1}{2}\cdot\frac{1}{1 - (-x/2)} = \sum \frac{(-1)^nx^n}{2^{n+1}}$ for $|x| < 2$; multiplying by $x$ shifts every exponent up by one.'
    anki_seeds:
      - front: 'Power series for $\frac{1}{1-x}$ (with validity)?'
        back: '$\sum_{n=0}^{\infty} x^n$ for $|x| < 1$'
        type: basic
      - front: 'To expand $\frac{1}{c - x}$ as a power series about $0$, first...'
        back: 'factor out $c$: $\frac{1}{c}\cdot\frac{1}{1 - x/c}$, giving ratio $x/c$ and $R = |c|$'
        type: basic

  - id: power-series
    name: Power Series and Interval of Convergence
    core: true
    difficulty: 0.72
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: radius-of-convergence
        weight: 0.8
        key: true
      - id: alternating-series
        weight: 0.5
        key: true
      - id: geometric-power-series
        weight: 0.4
      - id: interval-notation
        weight: 0.3            # notation support: interval-of-convergence answers are written in interval notation (re-audit R-01)
    knowledge_points:
      - id: kp1
        name: Endpoint checks
        key_prerequisites: [radius-of-convergence, alternating-series]
        exemplars:
          - problem: 'Find the interval of convergence of $\sum_{n=1}^{\infty} \frac{x^n}{n}$.'
            answer: '$[-1, 1)$'
            solution_sketch: '$R = 1$; at $x = 1$ the harmonic series diverges, at $x = -1$ the alternating harmonic series converges.'
          - problem: 'Find the interval of convergence of $\sum_{n=1}^{\infty} \frac{x^n}{n^2}$.'
            answer: '$[-1, 1]$'
            solution_sketch: '$R = 1$; both endpoints give (absolutely) convergent $p$-series behavior.'
          - problem: "Find the interval of convergence of the power series with terms x^n/(n 4^n) as an inequality in x."
            answer: "-4 <= x < 4"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is sum over n from 1 to infinity of x^n/(n 4^n). The ratio test gives radius R = 4. At x = 4 the series is sum 1/n, the harmonic series, which diverges by the p-series test with p = 1. At x = -4 the series is sum (-1)^n/n, the alternating harmonic series, which converges by the alternating series test. So the interval of convergence is -4 <= x < 4."
          - problem: "Find the interval of convergence of the power series with terms (x/5)^n as an inequality in x."
            answer: "-5 < x < 5"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is sum over n from 0 to infinity of (x/5)^n. It is geometric with ratio x/5, so it converges exactly when abs(x/5) < 1, giving radius R = 5. At x = 5 the series is sum 1, which diverges. At x = -5 the series is sum (-1)^n, which diverges. So the interval of convergence is -5 < x < 5."
          - problem: "Find the interval of convergence of the power series with terms x^n/(3^n sqrt(n)) as an inequality in x."
            answer: "-3 <= x < 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is sum over n from 1 to infinity of x^n/(3^n sqrt(n)). The ratio test gives radius R = 3. At x = 3 the series is sum 1/sqrt(n), a p-series with p = 1/2, which diverges. At x = -3 the series is sum (-1)^n/sqrt(n), which converges by the alternating series test. So the interval of convergence is -3 <= x < 3."
          - problem: "Find the interval of convergence of the power series with terms x^n/(2^n n^3) as an inequality in x."
            answer: "-2 <= x <= 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is sum over n from 1 to infinity of x^n/(2^n n^3). The ratio test gives radius R = 2. At x = 2 the series is sum 1/n^3, a p-series with p = 3, which converges. At x = -2 the series is sum (-1)^n/n^3, which converges absolutely. So the interval of convergence is -2 <= x <= 2."
        constraints: "endpoint series must reduce to p-series, alternating p-series, or geometric"
      - id: kp2
        name: Intervals for centered series
        key_prerequisites: [radius-of-convergence, alternating-series]
        exemplars:
          - problem: 'Find the interval of convergence of $\sum_{n=1}^{\infty} \frac{(x - 2)^n}{n \, 3^n}$.'
            answer: '$[-1, 5)$'
            solution_sketch: 'Ratio test gives $\frac{|x-2|}{3} < 1$, so $R = 3$ about center $2$. At $x = 5$: $\sum \frac{1}{n}$ diverges; at $x = -1$: $\sum \frac{(-1)^n}{n}$ converges.'
          - problem: 'Find the interval of convergence of $\sum_{n=1}^{\infty} \frac{(x + 1)^n}{\sqrt{n} \, 2^n}$.'
            answer: '$[-3, 1)$'
            solution_sketch: '$R = 2$ about center $-1$. At $x = 1$: $\sum \frac{1}{\sqrt{n}}$ diverges; at $x = -3$: $\sum \frac{(-1)^n}{\sqrt{n}}$ converges by the AST.'
          - problem: "Find the interval of convergence of $\\sum_{n=1}^{\\infty} \\frac{(x - 1)^n}{n \\, 2^n}$, and state the answer as an inequality in $x$."
            answer: "-1 <= x < 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} \\frac{(x - 1)^n}{n \\, 2^n}$. Ratio test: $\\frac{|x - 1|}{2} < 1$, so the center is $1$, the radius is $2$, and $-1 < x < 3$. At $x = 3$ the series is $\\sum \\frac{1}{n}$, a divergent p-series. At $x = -1$ it is $\\sum \\frac{(-1)^n}{n}$, which converges by the alternating series test. The interval of convergence is -1 <= x < 3."
          - problem: "Find the interval of convergence of $\\sum_{n=1}^{\\infty} \\frac{(x + 3)^n}{n^2 \\, 4^n}$, and state the answer as an inequality in $x$."
            answer: "-7 <= x <= 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} \\frac{(x + 3)^n}{n^2 \\, 4^n}$. Ratio test: $\\frac{|x + 3|}{4} < 1$, so the center is $-3$, the radius is $4$, and $-7 < x < 1$. At $x = 1$ the series is $\\sum \\frac{1}{n^2}$, a convergent p-series with $p = 2$. At $x = -7$ it is $\\sum \\frac{(-1)^n}{n^2}$, which converges absolutely. The interval of convergence is -7 <= x <= 1."
          - problem: "Find the interval of convergence of $\\sum_{n=1}^{\\infty} \\frac{(x - 4)^n}{2^n}$, and state the answer as an inequality in $x$."
            answer: "2 < x < 6"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} \\frac{(x - 4)^n}{2^n}$. Ratio test: $\\frac{|x - 4|}{2} < 1$, so the center is $4$, the radius is $2$, and $2 < x < 6$. At $x = 6$ the series is $\\sum 1$, which diverges. At $x = 2$ it is $\\sum (-1)^n$, which also diverges. The interval of convergence is 2 < x < 6."
          - problem: "Find the interval of convergence of $\\sum_{n=1}^{\\infty} \\frac{(x + 2)^n}{3^n \\sqrt{n}}$, and state the answer as an inequality in $x$."
            answer: "-5 <= x < 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is $\\sum_{n=1}^{\\infty} \\frac{(x + 2)^n}{3^n \\sqrt{n}}$. Ratio test: $\\frac{|x + 2|}{3} < 1$, so the center is $-2$, the radius is $3$, and $-5 < x < 1$. At $x = 1$ the series is $\\sum \\frac{1}{\\sqrt{n}}$, a divergent p-series with $p = 1/2$. At $x = -5$ it is $\\sum \\frac{(-1)^n}{\\sqrt{n}}$, which converges by the alternating series test. The interval of convergence is -5 <= x < 1."
        constraints: "centers are small integers; endpoint series must reduce to p-series, alternating p-series, or geometric"
      - id: kp3
        name: Degenerate and open cases
        key_prerequisites: [radius-of-convergence]
        exemplars:
          - problem: "Consider the series sum over n >= 0 of n factorial times (x - 1)^n. Find the radius of convergence R."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The series is sum over n >= 0 of n factorial times (x - 1)^n. Apply the ratio test: the ratio of successive term sizes is (n+1)|x-1|, which grows without bound for every x different from 1. The only point where the series converges is x = 1, so no open interval survives. The radius of convergence is 0."
          - problem: "Consider the series sum over n >= 0 of x^n divided by n factorial. Find the radius of convergence R."
            answer: "infinity"
            answer_contract: {"kind": "label", "options": [["infinity", "inf", "oo"], ["0"], ["DNE", "does not exist"], ["-infinity", "-inf", "-oo"]]}
            solution_sketch: "The series is sum over n >= 0 of x^n divided by n factorial. Apply the ratio test: the limit of the ratio of successive term sizes is |x|/(n+1), which tends to 0 for every x, so the series converges for all real x. The option 0 is the error of confusing this with a factorial-coefficient series that forces a single point. The option DNE is the error of thinking the ratio limit fails to exist, and -infinity is a sign error in the ratio. The radius of convergence is infinity."
          - problem: 'Find the interval of convergence of $\sum_{n=1}^{\infty} n x^n$.'
            answer: '$(-1, 1)$'
            solution_sketch: '$R = 1$; at $x = \pm 1$ the terms $\pm n$ do not tend to $0$, so both endpoints fail the term test.'
          - problem: "Consider the series sum over n >= 0 of (n+1)(x-2)^n. Find the interval of convergence, and give the answer as an inequality in x."
            answer: "1 < x < 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is sum over n >= 0 of (n+1)(x-2)^n. Apply the ratio test: the limit of the ratio of successive term sizes is |x-2|, so the radius is 1 and the open interval is 1 < x < 3. At x=1 the terms are (n+1)(-1)^n and at x=3 they are n+1; neither tends to 0, so both endpoints fail the term test. The interval of convergence is 1 < x < 3."
          - problem: "Consider the series sum over n >= 1 of (x-1)^n/n. Find the interval of convergence, and give the answer as an inequality in x."
            answer: "0 <= x < 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is sum over n >= 1 of (x-1)^n/n. Apply the ratio test: the limit of the ratio of successive term sizes is |x-1|, so the radius is 1 and the open interval is 0 < x < 2. At x=0 the series is the alternating harmonic series, which converges by the alternating series test; at x=2 it is the harmonic series, which diverges. The interval of convergence is 0 <= x < 2."
          - problem: "Consider the series sum over n >= 1 of n^2 (x+1)^n. Find the interval of convergence, and give the answer as an inequality in x."
            answer: "-2 < x < 0"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The series is sum over n >= 1 of n^2 (x+1)^n. Apply the ratio test: the limit of the ratio of successive term sizes is |x+1|, so the radius is 1 and the open interval is -2 < x < 0. At x=-2 the terms are n^2 (-1)^n and at x=0 they are n^2; neither tends to 0, so both endpoints fail the term test. The interval of convergence is -2 < x < 0."
        constraints: "include R = 0, R = infinity, and both-endpoints-diverge cases"
    diagnostic_exemplar:
      problem: 'Find the interval of convergence of $\sum_{n=1}^{\infty} \frac{x^n}{n \, 2^n}$.'
      answer: '$[-2, 2)$'
      solution_sketch: '$R = 2$; at $x = 2$ the harmonic series diverges, at $x = -2$ the alternating harmonic series converges.'
    anki_seeds:
      - front: "A power series converges how, relative to its center and radius R?"
        back: "absolutely for |x - a| < R, diverges for |x - a| > R; endpoints must be checked individually"
        type: basic
      - front: "After computing R for a power series, the remaining work is always..."
        back: "testing each endpoint x = a - R and x = a + R as its own numerical series"
        type: basic

  - id: differentiating-integrating-power-series
