        exemplars:
          - problem: 'Find the Maclaurin series of $(1 + x)^{1/2}$ through the $x^2$ term.'
            answer: '$1 + \frac{x}{2} - \frac{x^2}{8}$'
            solution_sketch: '$\binom{1/2}{1} = \frac{1}{2}$, $\binom{1/2}{2} = \frac{(1/2)(-1/2)}{2} = -\frac{1}{8}$.'
          - problem: "Find the Maclaurin series of (1 + x)^(-2) through the x^2 term."
            answer: "1 - 2x + 3x^2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The full object is the binomial series for (1 + x)^k. Use the binomial coefficient rule: C(-2,0)=1, C(-2,1)=-2, and C(-2,2)=(-2)(-3)/2=3. Substitute these coefficients into 1 + C(k,1)x + C(k,2)x^2. The series through x^2 is 1 - 2x + 3x^2."
          - problem: "Find the coefficient of x^2 in the Maclaurin series of (1 + x)^(-1/2)."
            answer: "3/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the binomial coefficient C(k,2) for k = -1/2. Use the binomial coefficient rule: C(-1/2,2) = (-1/2)(-3/2)/2. Compute the product: (3/4)/2 = 3/8. The coefficient of x^2 is 3/8."
          - problem: "Find the coefficient of x^2 in the Maclaurin series of (1 + x)^(1/3)."
            answer: "-1/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the binomial coefficient C(k,2) for k = 1/3. Use the binomial coefficient rule: C(1/3,2) = (1/3)(-2/3)/2. Compute the product: (-2/9)/2 = -1/9. The coefficient of x^2 is -1/9."
          - problem: "Find the sum of the first three coefficients (degrees 0, 1, 2) in the Maclaurin series of (1 + x)^(-1/2)."
            answer: "7/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the sum C(-1/2,0)+C(-1/2,1)+C(-1/2,2). Use the binomial coefficient rule: C(-1/2,0)=1, C(-1/2,1)=-1/2, and C(-1/2,2)=3/8. Add the three values: 1 - 1/2 + 3/8 = 7/8. The sum of the first three coefficients is 7/8."
          - problem: "Find the sum of the first three coefficients (degrees 0, 1, 2) in the Maclaurin series of (1 + x)^(1/3)."
            answer: "11/9"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The full object is the sum C(1/3,0)+C(1/3,1)+C(1/3,2). Use the binomial coefficient rule: C(1/3,0)=1, C(1/3,1)=1/3, and C(1/3,2)=-1/9. Add the three values: 1 + 1/3 - 1/9 = 11/9. The sum of the first three coefficients is 11/9."
        constraints: "exponents k in {1/2, -1/2, 1/3, -2}; truncate at degree 2 unless the pattern is closed-form"
      - id: kp2
        name: Substitution into the binomial series
        key_prerequisites: [taylor-maclaurin-series]
        exemplars:
          - problem: 'Find the Maclaurin series of $\frac{1}{\sqrt{1 - x^2}}$ through the $x^4$ term.'
            answer: '$1 + \frac{x^2}{2} + \frac{3x^4}{8}$'
            solution_sketch: 'Substitute $-x^2$ into $(1 + t)^{-1/2} = 1 - \frac{t}{2} + \frac{3t^2}{8} - \cdots$.'
          - problem: 'Find the Maclaurin series of $\sqrt[3]{1 + x}$ through the $x^2$ term.'
            answer: '$1 + \frac{x}{3} - \frac{x^2}{9}$'
            solution_sketch: '$\binom{1/3}{2} = \frac{(1/3)(-2/3)}{2} = -\frac{1}{9}$.'
          - problem: "In the binomial series $(1+t)^{1/2} = 1 + t/2 - t^2/8 + \\cdots$, take $t = 2x$. Find the Maclaurin series of $(1 + 2x)^{1/2}$ through the $x^2$ term."
            answer: "1 + x - x^2/2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1 uses the binomial series with exponent 1/2, written as (1 + t)^(1/2) = 1 + t/2 - t^2/8 + ... . Step 2 substitutes t = 2x into that expansion, which gives 1 + (2x)/2 - (2x)^2/8. Step 3 simplifies each term by algebra: 1 + x - x^2/2. So the Maclaurin series through the x^2 term is 1 + x - x^2/2."
          - problem: "In the binomial series $(1+t)^{-1/2} = 1 - t/2 + 3t^2/8 - \\cdots$, take $t = x^2$. Find the Maclaurin series of $(1 + x^2)^{-1/2}$ through the $x^4$ term."
            answer: "1 - x^2/2 + 3x^4/8"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1 uses the binomial series with exponent -1/2: (1 + t)^(-1/2) = 1 - t/2 + 3t^2/8 - ... . Step 2 substitutes t = x^2, which turns the terms into 1 - x^2/2 + 3x^4/8. Step 3 keeps every term through x^4 and drops the higher powers. So the Maclaurin series through the x^4 term is 1 - x^2/2 + 3x^4/8."
          - problem: "The substitution $t = -x^2$ in a binomial series with exponent $1/2$ produces a Maclaurin series whose $x^4$ term carries a coefficient. Find the coefficient of $x^4$ in the Maclaurin series of $(1 - x^2)^{1/2}$."
            answer: "-1/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 uses the binomial series with exponent 1/2: (1 + t)^(1/2) = 1 + t/2 - t^2/8 + ... . Step 2 substitutes t = -x^2, which gives 1 - x^2/2 - x^4/8 + ... . Step 3 reads the coefficient of x^4 from the third term of that expansion. The coefficient of x^4 is -1/8."
          - problem: "In the binomial series $(1+t)^{-1/2} = 1 - t/2 + 3t^2/8 - \\cdots$, take $t = -2x$. Find the Maclaurin series of $(1 - 2x)^{-1/2}$ through the $x^2$ term."
            answer: "1 + x + 3x^2/2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1 uses the binomial series with exponent -1/2: (1 + t)^(-1/2) = 1 - t/2 + 3t^2/8 - ... . Step 2 substitutes t = -2x, which gives 1 + x + 3(4x^2)/8. Step 3 simplifies the x^2 term: 3(4x^2)/8 = 3x^2/2. So the Maclaurin series through the x^2 term is 1 + x + 3x^2/2."
        constraints: "substitutions are ±x^2 or ax into a binomial series with fractional exponent"
      - id: kp3
        name: Applications of the binomial series
        key_prerequisites: [taylor-maclaurin-series]
        exemplars:
          - problem: "Use the first three terms of the binomial series for $(1+x)^{1/2}$ to approximate $\\sqrt{1.2}$. Give the answer as a fraction."
            answer: "219/200"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Binomial series: $(1+x)^{1/2} = 1 + x/2 - x^2/8 + \\cdots$. Substitute $x = 0.2 = 1/5$ into the three terms. Compute $1 + (1/5)/2 - (1/5)^2/8 = 1 + 1/10 - 1/200 = 219/200$. The approximation is 219/200."
          - problem: "Use the first three terms of the binomial series for $(1+x)^{1/3}$ to approximate the cube root of $1.1$. Give the answer as a fraction."
            answer: "929/900"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Binomial series: $(1+x)^{1/3} = 1 + x/3 - x^2/9 + \\cdots$. Substitute $x = 0.1 = 1/10$ into the three terms. Compute $1 + (1/10)/3 - (1/10)^2/9 = 1 + 1/30 - 1/900 = 929/900$. The approximation is 929/900."
          - problem: "Use the first three terms of the binomial series for $(1-x)^{-1/2}$ to approximate $1/\\sqrt{0.8}$. Give the answer as a fraction."
            answer: "223/200"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Binomial series: $(1-x)^{-1/2} = 1 + x/2 + 3x^2/8 + \\cdots$. Substitute $x = 0.2 = 1/5$ into the three terms. Compute $1 + (1/5)/2 + 3(1/5)^2/8 = 1 + 1/10 + 3/200 = 223/200$. The approximation is 223/200."
          - problem: 'Integrate the series for $\frac{1}{\sqrt{1 - x^2}}$ to find the Maclaurin series of $\arcsin x$ through the $x^5$ term.'
            answer: '$x + \frac{x^3}{6} + \frac{3x^5}{40}$'
            solution_sketch: 'Integrate $1 + \frac{x^2}{2} + \frac{3x^4}{8}$ term by term; the constant is $\arcsin 0 = 0$.'
          - problem: "Use the first three terms of the binomial series for $(1-x)^{1/2}$ to approximate $\\sqrt{0.98}$. Give the answer as a fraction."
            answer: "19799/20000"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Binomial series: $(1-x)^{1/2} = 1 - x/2 - x^2/8 + \\cdots$. Substitute $x = 0.02 = 1/50$ into the three terms. Compute $1 - (1/50)/2 - (1/50)^2/8 = 1 - 1/100 - 1/20000 = 19799/20000$. The approximation is 19799/20000."
          - problem: "Use the first three terms of the binomial series for $(1+x)^{-1/2}$ to approximate $\\int_0^{0.1} \\frac{1}{\\sqrt{1+x}}\\,dx$. Give the answer as a fraction."
            answer: "781/8000"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Binomial series: $(1+x)^{-1/2} = 1 - x/2 + 3x^2/8 + \\cdots$. Integrate the three terms from $0$ to $0.1 = 1/10$ to get $x - x^2/4 + x^3/8$. Evaluate at $x = 1/10$: $1/10 - 1/400 + 1/8000 = 781/8000$. The approximation is 781/8000."
        constraints: "numerical approximations at |x| <= 0.2 with exact fractional answers stated"
    diagnostic_exemplar:
      problem: 'Find the Maclaurin series of $\sqrt{1 + x^2}$ through the $x^4$ term, then use it to approximate $\sqrt{1.04}$ as an exact fraction.'
      answer: '$1 + \frac{x^2}{2} - \frac{x^4}{8}$; $\sqrt{1.04} \approx \frac{5099}{5000}$'
      answer_contract: {kind: none}
      solution_sketch: 'The binomial series for $(1+u)^{1/2}$ is $1 + \frac{u}{2} - \frac{u^2}{8} + \cdots$ with $u = x^2$; at $x = 0.2$ this gives $1 + \frac{1}{50} - \frac{1}{5000}$.'
    anki_seeds:
      - front: 'Binomial series: $(1 + x)^k = $ ? (validity)'
        back: '$\sum_{n=0}^{\infty} \binom{k}{n} x^n$ for $|x| < 1$, where $\binom{k}{n} = \frac{k(k-1)\cdots(k-n+1)}{n!}$'
        type: basic
      - front: 'First three terms of $(1+x)^{1/2}$?'
        back: '$1 + \frac{x}{2} - \frac{x^2}{8}$'
        type: basic

  - id: taylor-polynomials
    name: Taylor Polynomials
    core: true
    difficulty: 0.73
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: standard-maclaurin-series
        weight: 0.8
        key: true
      - id: higher-order-derivatives
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Maclaurin polynomials
        key_prerequisites: [standard-maclaurin-series]
        exemplars:
          - problem: 'Find $T_3(x)$ for $f(x) = \sin x$ at $a = 0$.'
            answer: '$T_3(x) = x - \frac{x^3}{6}$'
            answer_contract: {kind: none}
            solution_sketch: 'Truncate the Maclaurin series of $\sin x$ after the cubic term.'
          - problem: 'Find $T_2(x)$ for $f(x) = e^x$ at $a = 0$.'
            answer: '$T_2(x) = 1 + x + \frac{x^2}{2}$'
            answer_contract: {kind: none}
            solution_sketch: 'Truncate the exponential series at degree $2$.'
        constraints: "degree <= 3; obtained by truncating a memorized series"
      - id: kp2
        name: Taylor polynomials at general centers
        key_prerequisites: [standard-maclaurin-series, higher-order-derivatives]
        exemplars:
          - problem: 'Find the second-degree Taylor polynomial of $f(x) = \sqrt{x}$ at $a = 4$.'
            answer: '$T_2(x) = 2 + \frac{x - 4}{4} - \frac{(x - 4)^2}{64}$'
            answer_contract: {kind: none}
            solution_sketch: '$f(4) = 2$, $f''(4) = \frac{1}{4}$, $f''''(4) = -\frac{1}{32}$; divide the second derivative by $2!$.'
          - problem: 'Find $T_2(x)$ for $f(x) = \ln x$ at $a = 1$.'
            answer: '$T_2(x) = (x - 1) - \frac{(x - 1)^2}{2}$'
            answer_contract: {kind: none}
            solution_sketch: '$f(1) = 0$, $f''(1) = 1$, $f''''(1) = -1$.'
        constraints: "degree <= 3; centers where f and derivatives evaluate to clean rationals"
      - id: kp3
        name: Approximating values with Taylor polynomials
        key_prerequisites: [standard-maclaurin-series]
        exemplars:
          - problem: 'Use $T_2$ for $\sqrt{x}$ at $a = 4$ to approximate $\sqrt{4.2}$. Give an exact fraction.'
            answer: '$\frac{3279}{1600} = 2.049375$'
            answer_contract: {kind: none}
            solution_sketch: '$2 + \frac{0.2}{4} - \frac{0.04}{64} = 2 + \frac{1}{20} - \frac{1}{1600}$.'
          - problem: 'Use $T_2$ for $\ln x$ at $a = 1$ to approximate $\ln 1.2$. Give an exact fraction.'
            answer: '$\frac{9}{50} = 0.18$'
            answer_contract: {kind: none}
            solution_sketch: '$0.2 - \frac{(0.2)^2}{2} = 0.2 - 0.02$.'
        constraints: "evaluation points within 0.2 of the center; answers as exact fractions"
    diagnostic_exemplar:
      problem: 'Find $T_2(x)$ for $f(x) = \sqrt{x}$ at $a = 9$, and use it to approximate $\sqrt{9.6}$ as an exact fraction.'
      answer: '$T_2(x) = 3 + \frac{x - 9}{6} - \frac{(x - 9)^2}{216}$; $\sqrt{9.6} \approx \frac{1859}{600}$'
      answer_contract: {kind: none}
      solution_sketch: 'The derivatives at $9$ are $3$, $\frac16$, and $-\frac{1}{108}$; at $x = 9.6$ the polynomial gives $3 + \frac{1}{10} - \frac{1}{600}$.'
    anki_seeds:
      - front: 'The degree-n Taylor polynomial of f at a is $T_n(x) = $ ?'
        back: '$\sum_{k=0}^{n} \frac{f^{(k)}(a)}{k!}(x - a)^k$'
        type: basic
      - front: "T_n is the unique degree-<=n polynomial matching f in what way at a?"
        back: "same value and same first n derivatives at a"
        type: basic

  - id: taylor-polynomials-error
    name: Taylor Polynomials and Error Bounds
    core: false                # error-bound destination; taylor-polynomials stays core
    difficulty: 0.8
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: taylor-polynomials
        weight: 0.8
        key: true
      - id: alternating-series-estimation
        weight: 0.5
        key: true
      - id: taylor-maclaurin-series
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The Lagrange remainder
        key_prerequisites: [taylor-polynomials]
        exemplars:
          - problem: '$\sin x$ is approximated by $T_3(x) = x - \frac{x^3}{6}$ on $|x| \le \frac{1}{2}$. Bound the error with the Lagrange remainder.'
            answer: '$|R_3| \le \frac{(1/2)^4}{4!} = \frac{1}{384}$'
            answer_contract: {kind: none}
            solution_sketch: '$|f^{(4)}| = |\sin x| \le 1$, so $|R_3(x)| \le \frac{|x|^4}{4!}$.'
          - problem: '$e^x$ is approximated by $T_2(x)$ on $|x| \le 1$. Bound the error with the Lagrange remainder, using $M = 3$.'
            answer: '$|R_2| \le \frac{3 \cdot 1^3}{3!} = \frac{1}{2}$'
            answer_contract: {kind: none}
            solution_sketch: '$|f^{(3)}(x)| = e^x \le e < 3$ on $[-1, 1]$; apply $|R_2| \le \frac{M |x|^3}{3!}$.'
        constraints: "Lagrange bounds use M = 1 for sin/cos and M = 3 for e^x on [-1, 1]"
      - id: kp2
        name: The alternating error bound for series values
        key_prerequisites: [alternating-series-estimation, taylor-maclaurin-series]
        exemplars:
          - problem: '$\cos 1$ is approximated by $1 - \frac{1}{2} + \frac{1}{24}$. Bound the error using the alternating series bound.'
            answer: 'error $\le \frac{1}{720}$'
            answer_contract: {kind: none}
            solution_sketch: 'The series $\sum \frac{(-1)^n}{(2n)!}$ alternates with decreasing terms; the first omitted term is $\frac{1}{6!} = \frac{1}{720}$.'
          - problem: 'How far must the series $\frac{1}{e} = \sum_{n=0}^{\infty} \frac{(-1)^n}{n!}$ be summed to guarantee an error below $\frac{1}{1000}$?'
            answer: 'through $n = 6$ (first omitted term $\frac{1}{7!} = \frac{1}{5040} < \frac{1}{1000}$)'
            answer_contract: {kind: none}
            solution_sketch: 'Need $\frac{1}{(n+1)!} < 10^{-3}$: $7! = 5040$ is the first factorial past $1000$.'
        constraints: "alternating bounds cite the first omitted term; thresholds are powers of 10"
      - id: kp3
        name: Choosing the degree for a target accuracy
        key_prerequisites: [taylor-polynomials, alternating-series-estimation]
        exemplars:
          - problem: 'What degree $n$ guarantees $|\sin x - T_n(x)| \le \frac{1}{5040}$ for all $|x| \le 1$ (using $M = 1$)?'
            answer: '$n = 6$ ($|R_n| \le \frac{1}{(n+1)!}$ and $7! = 5040$)'
            answer_contract: {kind: none}
            solution_sketch: 'Need $\frac{1}{(n+1)!} \le \frac{1}{5040}$, i.e. $(n+1)! \ge 5040 = 7!$.'
          - problem: 'What degree $n$ guarantees $|e^x - T_n(x)| \le \frac{1}{100}$ for all $|x| \le 1$, using $M = 3$?'
            answer: '$n = 5$ ($\frac{3}{6!} = \frac{1}{240} \le \frac{1}{100}$, while $\frac{3}{5!} = \frac{1}{40}$ is too big)'
            answer_contract: {kind: none}
            solution_sketch: 'Need $\frac{3}{(n+1)!} \le \frac{1}{100}$, i.e. $(n+1)! \ge 300$: first satisfied by $6! = 720$.'
        constraints: "factorial thresholds solvable by listing factorials; state the deciding inequality"
    diagnostic_exemplar:
      problem: 'What degree $n$ guarantees $|\cos x - T_n(x)| \le \frac{1}{1000}$ for all $|x| \le 1$ (using $M = 1$)?'
      answer: '$n = 6$'
      solution_sketch: 'The Lagrange remainder gives $|R_n| \le \frac{1}{(n+1)!}$; $7! = 5040 \ge 1000$ while $6! = 720$ is too small.'
    anki_seeds:
      - front: "Lagrange remainder bound for T_n at center a?"
        back: '$|R_n(x)| \le \frac{M |x - a|^{n+1}}{(n+1)!}$ where $M$ bounds $|f^{(n+1)}|$ between $a$ and $x$'
        type: basic
      - front: "For sin and cos, the safe Lagrange constant M is always..."
        back: "1 (every derivative is ± sin or ± cos)"
        type: basic

  - id: approximating-integrals-with-series
    name: Approximating Integrals with Series
    core: false                # application of Taylor series; terminal
    difficulty: 0.8
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: taylor-polynomials-error
        weight: 0.7
        key: true
      - id: differentiating-integrating-power-series
        weight: 0.5
        key: true
      - id: taylor-maclaurin-series
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Expressing integrals as numerical series
        key_prerequisites: [taylor-maclaurin-series, differentiating-integrating-power-series]
        exemplars:
          - problem: 'Express $\int_0^1 \frac{\sin x}{x} \, dx$ as a numerical series.'
            answer: '$\sum_{n=0}^{\infty} \frac{(-1)^n}{(2n+1)(2n+1)!} = 1 - \frac{1}{18} + \frac{1}{600} - \cdots$'
            answer_contract: {kind: none}
            solution_sketch: '$\frac{\sin x}{x} = \sum \frac{(-1)^n x^{2n}}{(2n+1)!}$; integrate term by term over $[0, 1]$.'
          - problem: 'Express $\int_0^1 e^{-x^2} \, dx$ as a numerical series.'
            answer: '$\sum_{n=0}^{\infty} \frac{(-1)^n}{(2n+1) \, n!} = 1 - \frac{1}{3} + \frac{1}{10} - \cdots$'
            answer_contract: {kind: none}
            solution_sketch: '$e^{-x^2} = \sum \frac{(-1)^n x^{2n}}{n!}$; each term integrates to $\frac{1}{(2n+1) n!}$.'
        constraints: "integrands are sin/cos/exp of x or x^2 with no elementary antiderivative"
      - id: kp2
        name: Estimating to a target accuracy
        key_prerequisites: [taylor-polynomials-error, differentiating-integrating-power-series]
        exemplars:
          - problem: 'Estimate $\int_0^1 \cos(x^2) \, dx$ with error less than $\frac{1}{100}$.'
            answer: '$\frac{9}{10}$ (two terms: $1 - \frac{1}{10}$; the next term $\frac{1}{216}$ bounds the error)'
            answer_contract: {kind: none}
            solution_sketch: '$\int_0^1 \cos(x^2)\,dx = \sum \frac{(-1)^n}{(4n+1)(2n)!} = 1 - \frac{1}{10} + \frac{1}{216} - \cdots$; alternating bound.'
          - problem: 'Estimate $\int_0^{1/2} \frac{dx}{1 + x^4}$ with error less than $\frac{1}{1000}$.'
            answer: '$\frac{79}{160}$ (two terms: $\frac{1}{2} - \frac{1}{160}$; the next term $\frac{1}{4608}$ bounds the error)'
            answer_contract: {kind: none}
            solution_sketch: '$\frac{1}{1+x^4} = \sum (-1)^n x^{4n}$; integrating gives $\sum \frac{(-1)^n (1/2)^{4n+1}}{4n+1} = \frac{1}{2} - \frac{1}{160} + \frac{1}{4608} - \cdots$.'
        constraints: "the target accuracy reached within three terms; error justified by the first omitted term"
      - id: kp3
        name: Recognizing famous numerical series
        key_prerequisites: [differentiating-integrating-power-series]
        exemplars:
          - problem: 'Evaluate $\sum_{n=0}^{\infty} \frac{(-1)^n}{2n+1}$ by recognizing a standard series at an endpoint.'
            answer: '$\pi/4$'
            solution_sketch: 'The $\arctan$ series at $x = 1$.'
          - problem: 'Evaluate $\sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$ by recognizing a standard series at an endpoint.'
            answer: '$\ln 2$'
            solution_sketch: 'The $\ln(1+x)$ series at $x = 1$.'
        constraints: "sums matching arctan, ln(1+x), or e^x at simple arguments"
    diagnostic_exemplar:
      problem: 'Estimate $\int_0^1 \sin(x^2)\,dx$ with error less than $\frac{1}{100}$, giving the estimate as an exact fraction.'
      answer: '$\frac{13}{42}$'
      solution_sketch: 'Termwise integration gives $\frac13 - \frac{1}{42} + \frac{1}{1320} - \cdots$; two terms suffice since the next term $\frac{1}{1320} < \frac{1}{100}$ bounds the error.'
    anki_seeds:
      - front: "To integrate a function with no elementary antiderivative (like e^{-x^2}), the series method is..."
        back: "expand the integrand as a power series and integrate term by term inside the interval of convergence"
        type: basic
      - front: '$\sum_{n=0}^{\infty} \frac{(-1)^n}{2n+1} = $ ?'
        back: '$\pi/4$ (the arctangent series at $x = 1$)'
        type: basic
