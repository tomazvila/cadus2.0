  - id: approximating-integrals-with-series
    name: Approximating Integrals with Series
    core: false                # application of Taylor series; terminal
    difficulty: 0.8
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: taylor-polynomials-error
        weight: 0.7
        key: true
      - id: differentiating-integrating-power-series
        weight: 0.5
        key: true
      - id: taylor-maclaurin-series
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Expressing integrals as numerical series
        key_prerequisites: [taylor-maclaurin-series, differentiating-integrating-power-series]
        exemplars:
          - problem: 'The integral $\displaystyle\int_0^1 e^{-x^2}\,dx$ has no elementary antiderivative. Replace $e^{-x^2}$ by its Maclaurin series and integrate term by term to write the integral as $\displaystyle\sum_{n=0}^{\infty} a_n$. Find $a_2$.'
            answer: '1/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series is $e^{-x^2} = 1 - x^2 + \frac{x^4}{2} - \frac{x^6}{6} + \cdots$. The term $n = 2$ is $\frac{x^4}{2}$, and $\int_0^1 \frac{x^4}{2}\,dx = \frac{1}{2 \cdot 5}$. So $a_2 = \frac{1}{10}$.'
          - problem: 'Integrate the Maclaurin series of $\dfrac{\sin x}{x}$ term by term to write $\displaystyle\int_0^1 \dfrac{\sin x}{x}\,dx$ as $\displaystyle\sum_{n=0}^{\infty} a_n$. Find $a_2$.'
            answer: '1/600'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series is $\frac{\sin x}{x} = 1 - \frac{x^2}{6} + \frac{x^4}{120} - \cdots$. The term $n = 2$ is $\frac{x^4}{120}$, and $\int_0^1 \frac{x^4}{120}\,dx = \frac{1}{120 \cdot 5}$. So $a_2 = \frac{1}{600}$.'
          - problem: 'Integrate the Maclaurin series of $\cos(x^2)$ term by term to write $\displaystyle\int_0^1 \cos(x^2)\,dx$ as $\displaystyle\sum_{n=0}^{\infty} a_n$. Find $a_3$.'
            answer: '-1/9360'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series is $\cos(x^2) = 1 - \frac{x^4}{2} + \frac{x^8}{24} - \frac{x^{12}}{720} + \cdots$. The term $n = 3$ is $-\frac{x^{12}}{720}$, and its integral over $[0,1]$ is $-\frac{1}{720 \cdot 13}$. So $a_3 = -\frac{1}{9360}$.'
          - problem: 'Integrate the Maclaurin series of $e^{-x^2}$ term by term to write $\displaystyle\int_0^2 e^{-x^2}\,dx$ as $\displaystyle\sum_{n=0}^{\infty} a_n$. Find $a_3$.'
            answer: '-64/21'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The term $n = 3$ of the series of $e^{-x^2}$ is $-\frac{x^6}{6}$. Its integral over $[0,2]$ is $-\frac{2^7}{6 \cdot 7} = -\frac{128}{42}$. So $a_3 = -\frac{64}{21}$.'
          - problem: 'Integrate the Maclaurin series of $\sin(x^2)$ term by term to write $\displaystyle\int_0^1 \sin(x^2)\,dx$ as $\displaystyle\sum_{n=0}^{\infty} a_n$. Find $a_2$.'
            answer: '1/1320'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series is $\sin(x^2) = x^2 - \frac{x^6}{6} + \frac{x^{10}}{120} - \cdots$. The term $n = 2$ is $\frac{x^{10}}{120}$, and its integral over $[0,1]$ is $\frac{1}{120 \cdot 11}$. So $a_2 = \frac{1}{1320}$.'
          - problem: 'Integrate the Maclaurin series of $\dfrac{\arctan x}{x}$ term by term to write $\displaystyle\int_0^1 \dfrac{\arctan x}{x}\,dx$ as $\displaystyle\sum_{n=0}^{\infty} a_n$. Find $a_2$.'
            answer: '1/25'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series is $\frac{\arctan x}{x} = 1 - \frac{x^2}{3} + \frac{x^4}{5} - \cdots$. The term $n = 2$ is $\frac{x^4}{5}$, and $\int_0^1 \frac{x^4}{5}\,dx = \frac{1}{5 \cdot 5}$. So $a_2 = \frac{1}{25}$.'
          - problem: 'Integrate the Maclaurin series of $\dfrac{\ln(1+x)}{x}$ term by term to write $\displaystyle\int_0^{1/2} \dfrac{\ln(1+x)}{x}\,dx$ as $\displaystyle\sum_{n=0}^{\infty} a_n$. Find $a_2$.'
            answer: '1/72'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series is $\frac{\ln(1+x)}{x} = 1 - \frac{x}{2} + \frac{x^2}{3} - \cdots$. The term $n = 2$ is $\frac{x^2}{3}$, and $\int_0^{1/2} \frac{x^2}{3}\,dx = \frac{(1/2)^3}{9}$. So $a_2 = \frac{1}{72}$.'
          - problem: 'The area under the curve $y = e^{-x^2}$ between $x = 0$ and $x = 1$ cannot be found with an elementary antiderivative. Integrate the Maclaurin series of $e^{-x^2}$ term by term to write the area as $\displaystyle\sum_{n=0}^{\infty} a_n$. Find $a_3$.'
            answer: '-1/42'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The term $n = 3$ of the series of $e^{-x^2}$ is $-\frac{x^6}{6}$. Its integral over $[0,1]$ is $-\frac{1}{6 \cdot 7}$. So $a_3 = -\frac{1}{42}$.'
          - problem: 'In optics the sine integral $\displaystyle\int_0^1 \dfrac{\sin t}{t}\,dt$ measures the light reaching the center of a diffraction pattern. Integrate the series of $\dfrac{\sin t}{t}$ term by term and find the sum of the first three terms of the result.'
            answer: '1703/1800'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series is $\frac{\sin t}{t} = 1 - \frac{t^2}{6} + \frac{t^4}{120} - \cdots$. Integrating over $[0,1]$ gives $1 - \frac{1}{18} + \frac{1}{600} - \cdots$. The sum of the first three terms is $\frac{1800 - 100 + 3}{1800} = \frac{1703}{1800}$.'
        constraints: "integrands are sin/cos/exp/arctan/ln of x or x^2 with no elementary antiderivative; the question names the coefficient asked for"
      - id: kp2
        name: Estimating to a target accuracy
        key_prerequisites: [taylor-polynomials-error, differentiating-integrating-power-series]
        exemplars:
          - problem: 'Estimate $\displaystyle\int_0^1 \cos(x^2)\,dx$ with error less than $\dfrac{1}{100}$ by integrating the Maclaurin series of $\cos(x^2)$ term by term. Use the fewest terms for which the alternating series bound guarantees this.'
            answer: '9/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Integrating term by term gives $1 - \frac{1}{10} + \frac{1}{216} - \cdots$. The error after two terms is at most the first omitted term $\frac{1}{216}$, which is below $\frac{1}{100}$, while one term leaves an error up to $\frac{1}{10}$. The estimate is $1 - \frac{1}{10} = \frac{9}{10}$.'
          - problem: 'Use the series $\dfrac{1}{1+x^4} = 1 - x^4 + x^8 - x^{12} + \cdots$ to estimate $\displaystyle\int_0^{1/2} \dfrac{dx}{1+x^4}$ with error less than $\dfrac{1}{1000}$. Use the fewest terms for which the alternating series bound guarantees this.'
            answer: '79/160'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Integrating over $[0, \frac12]$ gives $\frac12 - \frac{1}{160} + \frac{1}{4608} - \cdots$. The first omitted term after two terms is $\frac{1}{4608}$, which is below $\frac{1}{1000}$, while $\frac{1}{160}$ is not. The estimate is $\frac12 - \frac{1}{160} = \frac{79}{160}$.'
          - problem: 'Integrate the Maclaurin series of $\cos(x^2)$ term by term to build a series for $\displaystyle\int_0^1 \cos(x^2)\,dx$. How many terms of that series must be added to make the error less than $\dfrac{1}{1000}$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series is $1 - \frac{1}{10} + \frac{1}{216} - \frac{1}{9360} + \cdots$. After two terms the error can be up to $\frac{1}{216}$, which is above $\frac{1}{1000}$. After three terms it is at most $\frac{1}{9360}$, which is below, so 3 terms are needed.'
          - problem: 'A cart moves with speed $e^{-t^2}$ metres per second. Estimate the distance it travels in the first second, with error less than $\dfrac{1}{12}$ metre, by integrating the Maclaurin series of $e^{-t^2}$ term by term. Use the fewest terms for which the alternating series bound guarantees this.'
            answer: '23/30'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The distance is $\int_0^1 e^{-t^2}\,dt = 1 - \frac13 + \frac{1}{10} - \frac{1}{42} + \cdots$. After two terms the error can be up to $\frac{1}{10}$, which is above $\frac{1}{12}$. After three terms it is at most $\frac{1}{42}$, so the estimate is $1 - \frac13 + \frac{1}{10} = \frac{23}{30}$ metre.'
          - problem: 'Multiply the Maclaurin series of $\cos(x^3)$ by $x$ and integrate term by term to estimate $\displaystyle\int_0^1 x\cos(x^3)\,dx$ with error less than $\dfrac{1}{20}$. Use the fewest terms for which the alternating series bound guarantees this.'
            answer: '7/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series $x\cos(x^3) = x - \frac{x^7}{2} + \frac{x^{13}}{24} - \cdots$ integrates to $\frac12 - \frac{1}{16} + \frac{1}{336} - \cdots$. The error after two terms is at most $\frac{1}{336}$, which is below $\frac{1}{20}$, while one term is not enough. The estimate is $\frac12 - \frac{1}{16} = \frac{7}{16}$.'
          - problem: 'A rod lies along $0 \le x \le \dfrac12$ metre and has density $\dfrac{1}{1+x^4}$ kilograms per metre at distance $x$ from one end. Estimate its average density with error less than $\dfrac{1}{500}$ by using the series $\dfrac{1}{1+x^4} = 1 - x^4 + x^8 - \cdots$. Use the fewest terms for which the alternating series bound guarantees this.'
            answer: '79/80'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The average density is $\frac{1}{1/2}\int_0^{1/2} \frac{dx}{1+x^4} = 2\left(\frac12 - \frac{1}{160} + \frac{1}{4608} - \cdots\right)$. Two terms leave an error of at most $2 \cdot \frac{1}{4608}$, which is below $\frac{1}{500}$, while one term leaves $2 \cdot \frac{1}{160} = \frac{1}{80}$, which is not. The estimate is $2\left(\frac{79}{160}\right) = \frac{79}{80}$.'
          - problem: 'The current in a coil is $\sin(t^3)$ amperes at time $t$ seconds. Estimate the charge that flows in the first second, with error less than $\dfrac{1}{100}$, by integrating the Maclaurin series of $\sin(t^3)$ term by term. Use the fewest terms for which the alternating series bound guarantees this.'
            answer: '7/30'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The charge is $\int_0^1 \sin(t^3)\,dt = \frac14 - \frac{1}{60} + \frac{1}{1920} - \cdots$. After one term the error can be up to $\frac{1}{60}$, which is above $\frac{1}{100}$. After two terms it is at most $\frac{1}{1920}$, so the estimate is $\frac14 - \frac{1}{60} = \frac{7}{30}$.'
          - problem: 'Integrate the Maclaurin series of $e^{-x^2}$ term by term to build a series for $\displaystyle\int_0^1 e^{-x^2}\,dx$. How many terms of that series must be added to make the error less than $\dfrac{1}{1000}$?'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series is $1 - \frac13 + \frac{1}{10} - \frac{1}{42} + \frac{1}{216} - \frac{1}{1320} + \cdots$. After four terms the error can be up to $\frac{1}{216}$, which is above $\frac{1}{1000}$. After five terms it is at most $\frac{1}{1320}$, which is below, so 5 terms are needed.'
        constraints: "the target accuracy is reached within five terms; the error is justified by the first omitted term"
      - id: kp3
        name: Recognizing famous numerical series
        key_prerequisites: [differentiating-integrating-power-series]
        exemplars:
          - problem: 'Find the sum of the series $\displaystyle\sum_{n=0}^{\infty} \dfrac{(-1)^n}{2n+1}$.'
            answer: 'pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'This is the series $\arctan x = x - \frac{x^3}{3} + \frac{x^5}{5} - \cdots$ at $x = 1$. The series converges at the endpoint $x = 1$. The sum is $\arctan 1 = \frac{\pi}{4}$.'
          - problem: 'Find the sum of the series $\displaystyle\sum_{n=1}^{\infty} \dfrac{(-1)^{n+1}}{n}$.'
            answer: 'ln(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'This is the series $\ln(1+x) = x - \frac{x^2}{2} + \frac{x^3}{3} - \cdots$ at $x = 1$. The series converges at the endpoint $x = 1$. The sum is $\ln 2$.'
          - problem: 'Find the sum of the series $\displaystyle\sum_{n=0}^{\infty} \dfrac{(-1)^n}{3^n(2n+1)}$.'
            answer: 'pi*sqrt(3)/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series of $\arctan x$ has terms $\frac{(-1)^n x^{2n+1}}{2n+1}$. Put $x = \frac{1}{\sqrt3}$, so $x^{2n+1} = \frac{1}{\sqrt3\,3^n}$. The given series is $\sqrt3 \arctan\frac{1}{\sqrt3} = \sqrt3 \cdot \frac{\pi}{6} = \frac{\pi\sqrt3}{6}$.'
          - problem: 'Find the sum of the series $\displaystyle\sum_{n=1}^{\infty} \dfrac{(-1)^{n+1}}{n\,2^n}$ to four decimal places.'
            answer: '0.4055'
            answer_contract: {"kind": "approx", "decimals": 4}
            solution_sketch: 'The series of $\ln(1+x)$ has terms $\frac{(-1)^{n+1}x^n}{n}$. Put $x = \frac12$ to get $\ln\frac32 = 0.405465\ldots$. To four decimal places the sum is 0.4055.'
          - problem: 'When $n$ letters are put at random into $n$ addressed envelopes, the chance that no letter reaches its own envelope tends, as $n$ grows, to $\displaystyle\sum_{k=0}^{\infty} \dfrac{(-1)^k}{k!}$. Find the value of this sum.'
            answer: 'e^(-1)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series $e^x = \sum \frac{x^k}{k!}$ with $x = -1$ has the terms $\frac{(-1)^k}{k!}$. So the sum is $e^{-1}$, about $0.37$.'
          - problem: 'Find the sum of the series $\displaystyle\sum_{n=0}^{\infty} \dfrac{1}{n!\,2^n}$.'
            answer: 'sqrt(e)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Write each term as $\frac{(1/2)^n}{n!}$. This is the series of $e^x$ at $x = \frac12$. The sum is $e^{1/2} = \sqrt{e}$.'
          - problem: 'Find the sum of the series $\displaystyle\sum_{n=0}^{\infty} \dfrac{2^n}{n!}$.'
            answer: 'e^2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'This is the series $e^x = \sum \frac{x^n}{n!}$ at $x = 2$. The series converges for every $x$. The sum is $e^2$.'
          - problem: 'Find the sum of the series $\displaystyle\sum_{n=0}^{\infty} \dfrac{(-1)^n \pi^{2n}}{(2n)!}$.'
            answer: '-1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The series of cosine is $\cos x = \sum \frac{(-1)^n x^{2n}}{(2n)!}$. Put $x = \pi$ to get the given series. The sum is $\cos \pi = -1$.'
          - problem: 'A rule for $\pi$ uses the sum $4 - \dfrac{4}{3} + \dfrac{4}{5} - \dfrac{4}{7} + \cdots$, where the denominators are the odd numbers. Find the exact value of this sum.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Factor out $4$ to get $4\left(1 - \frac13 + \frac15 - \frac17 + \cdots\right)$. The bracket is the arctangent series at $x = 1$, which equals $\frac{\pi}{4}$. So the sum is $4 \cdot \frac{\pi}{4} = \pi$.'
        constraints: "sums matching arctan, ln(1+x), cos or e^x at simple arguments"
    diagnostic_exemplar:
      problem: 'Estimate $\int_0^1 \sin(x^2)\,dx$ with error less than $\frac{1}{100}$.'
      answer: '$\frac{13}{42}$'
      solution_sketch: 'Termwise integration gives $\frac13 - \frac{1}{42} + \frac{1}{1320} - \cdots$; two terms suffice since the next term $\frac{1}{1320} < \frac{1}{100}$ bounds the error.'
