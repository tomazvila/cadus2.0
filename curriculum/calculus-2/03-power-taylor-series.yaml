  - id: taylor-polynomials
    name: Taylor Polynomials
    core: true
    difficulty: 0.73
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: standard-maclaurin-series
        weight: 0.8
        key: true
      - id: higher-order-derivatives
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Maclaurin polynomials
        key_prerequisites: [standard-maclaurin-series]
        exemplars:
          - problem: "Use the Maclaurin series of sin x. Find the Maclaurin polynomial T_3(x) for f(x) = sin x at a = 0."
            answer: "x - x^3/6"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The Maclaurin series of sin x is x - x^3/6 + x^5/120 - ... . Truncate the memorized series at degree 3. The Maclaurin polynomial is x - x^3/6."
          - problem: "Use the Maclaurin series of e^x. Find the Maclaurin polynomial T_2(x) for f(x) = e^x at a = 0."
            answer: "1 + x + x^2/2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The Maclaurin series of e^x is 1 + x + x^2/2 + x^3/6 + ... . Truncate the memorized series at degree 2. The Maclaurin polynomial is 1 + x + x^2/2."
          - problem: "Use the Maclaurin series of cos x. Find the Maclaurin polynomial T_3(x) for f(x) = cos x at a = 0."
            answer: "1 - x^2/2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The Maclaurin series of cos x is 1 - x^2/2 + x^4/24 - ... . Truncate the memorized series at degree 3, so the x^4 and higher terms drop. The Maclaurin polynomial is 1 - x^2/2."
          - problem: "Find the Maclaurin polynomial T_3(x) for f(x) = 1/(1 - x) at a = 0."
            answer: "1 + x + x^2 + x^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The Maclaurin series of 1/(1 - x) is 1 + x + x^2 + x^3 + ... . Truncate the memorized geometric series at degree 3. The Maclaurin polynomial is 1 + x + x^2 + x^3."
          - problem: "Find the Maclaurin polynomial T_2(x) for f(x) = ln(1 + x) at a = 0."
            answer: "x - x^2/2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The Maclaurin series of ln(1 + x) is x - x^2/2 + x^3/3 - ... . Truncate the memorized series at degree 2. The Maclaurin polynomial is x - x^2/2."
          - problem: "For f(x) = cos x, find the coefficient of x^2 in its Maclaurin polynomial T_3(x)."
            answer: "-1/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Maclaurin series of cos x is 1 - x^2/2 + x^4/24 - ... . The coefficient of x^2 in T_3(x) is the coefficient in the memorized series. The coefficient is -1/2."
        constraints: "degree <= 3; obtained by truncating a memorized series"
      - id: kp2
        name: Taylor polynomials at general centers
        key_prerequisites: [standard-maclaurin-series, higher-order-derivatives]
        exemplars:
          - problem: "Find the second-degree Taylor polynomial of f(x) = 1/x at a = 2 as a polynomial in x."
            answer: "1/2-(x-2)/4+(x-2)^2/8"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "The Taylor polynomial formula is T_2(x) = f(a) + f'(a)(x-a) + f''(a)(x-a)^2/2!. Compute f(2)=1/2, f'(2)=-1/4, and f''(2)=1/4. Substitute: T_2(x) = 1/2 - (x-2)/4 + (x-2)^2/8. The answer is 1/2-(x-2)/4+(x-2)^2/8."
          - problem: "Find the third-degree Taylor polynomial of f(x) = x^3 - 3x at a = 1 as a polynomial in x."
            answer: "-2+3(x-1)^2+(x-1)^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Use T_3(x) = f(1) + f'(1)(x-1) + f''(1)(x-1)^2/2! + f'''(1)(x-1)^3/3!. Compute f(1)=-2, f'(1)=0, f''(1)=6, and f'''(1)=6. The divided values are -2, 0, 3, and 1, so T_3(x) = -2+3(x-1)^2+(x-1)^3. The answer is -2+3(x-1)^2+(x-1)^3."
          - problem: "Find the second-degree Taylor polynomial of f(x) = sqrt(x) at a = 16 as a polynomial in x."
            answer: "4+(x-16)/8-(x-16)^2/512"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Use T_2(x) = f(16) + f'(16)(x-16) + f''(16)(x-16)^2/2!. Compute f(16)=4, f'(16)=1/8, and f''(16)=-1/256. Then f''(16)/2 = -1/512, so T_2(x) = 4 + (x-16)/8 - (x-16)^2/512. The answer is 4+(x-16)/8-(x-16)^2/512."
          - problem: "Find the second-degree Taylor polynomial of f(x) = 1/(x+2) at a = 1 as a polynomial in x."
            answer: "1/3-(x-1)/9+(x-1)^2/27"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Use T_2(x) = f(1) + f'(1)(x-1) + f''(1)(x-1)^2/2!. Compute f(1)=1/3, f'(1)=-1/9, and f''(1)=2/27. Divide f''(1) by 2 to get 1/27, so T_2(x) = 1/3 - (x-1)/9 + (x-1)^2/27. The answer is 1/3-(x-1)/9+(x-1)^2/27."
          - problem: "Find the third-degree Taylor polynomial of f(x) = x^4 at a = 1 as a polynomial in x."
            answer: "1+4(x-1)+6(x-1)^2+4(x-1)^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Use T_3(x) = f(1) + f'(1)(x-1) + f''(1)(x-1)^2/2! + f'''(1)(x-1)^3/3!. Compute f(1)=1, f'(1)=4, f''(1)=12, and f'''(1)=24. The divided values are 1, 4, 6, and 4, so T_3(x) = 1+4(x-1)+6(x-1)^2+4(x-1)^3. The answer is 1+4(x-1)+6(x-1)^2+4(x-1)^3."
          - problem: "Find the second-degree Taylor polynomial of f(x) = 1/sqrt(x) at a = 1 as a polynomial in x."
            answer: "1-(x-1)/2+3(x-1)^2/8"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Use T_2(x) = f(1) + f'(1)(x-1) + f''(1)(x-1)^2/2!. Compute f(1)=1, f'(1)=-1/2, and f''(1)=3/4. Divide f''(1) by 2 to get 3/8, so T_2(x) = 1 - (x-1)/2 + 3(x-1)^2/8. The answer is 1-(x-1)/2+3(x-1)^2/8."
        constraints: "degree <= 3; centers where f and derivatives evaluate to clean rationals"
      - id: kp3
        name: Approximating values with Taylor polynomials
        key_prerequisites: [standard-maclaurin-series]
        exemplars:
          - problem: "Use the Taylor polynomial T_2 for f(x) = sqrt(x) at a = 16 to approximate sqrt(16.2). Give an exact fraction."
            answer: "51519/12800"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Taylor polynomial formula: T_2(x) = f(16) + f'(16)(x - 16) + f''(16)(x - 16)^2/2. For f(x) = sqrt(x), f(16) = 4, f'(16) = 1/8, and f''(16) = -1/256. Substitute x - 16 = 1/5: 4 + (1/8)(1/5) - (1/512)(1/25) = 51519/12800. The approximation is 51519/12800."
          - problem: "Use the Taylor polynomial T_2 for f(x) = ln(x) at a = 1 to approximate ln(1.1). Give an exact fraction."
            answer: "19/200"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Taylor polynomial formula at a = 1: T_2(x) = f(1) + f'(1)(x - 1) + f''(1)(x - 1)^2/2. For f(x) = ln(x), f(1) = 0, f'(1) = 1, and f''(1) = -1. Substitute x - 1 = 1/10: 0 + 1/10 - (1/2)(1/100) = 19/200. The approximation is 19/200."
          - problem: "Use the Taylor polynomial T_2 for f(x) = e^x at a = 0 to approximate e^(0.1). Give an exact fraction."
            answer: "221/200"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Taylor polynomial formula at a = 0: T_2(x) = f(0) + f'(0)x + f''(0)x^2/2. For f(x) = e^x, f(0) = f'(0) = f''(0) = 1, so T_2(x) = 1 + x + x^2/2. Substitute x = 1/10: 1 + 1/10 + 1/200 = 221/200. The approximation is 221/200."
          - problem: "Use the Taylor polynomial T_2 for f(x) = cos(x) at a = 0 to approximate cos(0.2). Give an exact fraction."
            answer: "49/50"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Taylor polynomial formula at a = 0: T_2(x) = f(0) + f'(0)x + f''(0)x^2/2. For f(x) = cos(x), f(0) = 1, f'(0) = 0, and f''(0) = -1, so T_2(x) = 1 - x^2/2. Substitute x = 1/5: 1 - 1/50 = 49/50. The approximation is 49/50."
          - problem: "Use the Taylor polynomial T_3 for f(x) = sin(x) at a = 0 to approximate sin(0.2). Give an exact fraction."
            answer: "149/750"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Taylor polynomial formula at a = 0: T_3(x) = f(0) + f'(0)x + f''(0)x^2/2 + f'''(0)x^3/6. For f(x) = sin(x), f(0) = 0, f'(0) = 1, f''(0) = 0, and f'''(0) = -1, so T_3(x) = x - x^3/6. Substitute x = 1/5: 1/5 - 1/750 = 149/750. The approximation is 149/750."
          - problem: "Use the Taylor polynomial T_2 for f(x) = 1/(1 - x) at a = 0 to approximate 1/(1 - 0.1). Give an exact fraction."
            answer: "111/100"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Taylor polynomial formula at a = 0: T_2(x) = f(0) + f'(0)x + f''(0)x^2/2. For f(x) = 1/(1 - x), f(0) = 1, f'(0) = 1, and f''(0) = 2, so T_2(x) = 1 + x + x^2. Substitute x = 1/10: 1 + 1/10 + 1/100 = 111/100. The approximation is 111/100."
        constraints: "evaluation points within 0.2 of the center; answers as exact fractions"
    diagnostic_exemplar:
      problem: 'Find $T_2(x)$ for $f(x) = \sqrt{x}$ at $a = 9$, and use it to approximate $\sqrt{9.6}$ as an exact fraction.'
      answer: '$T_2(x) = 3 + \frac{x - 9}{6} - \frac{(x - 9)^2}{216}$; $\sqrt{9.6} \approx \frac{1859}{600}$'
      answer_contract: {kind: none}
      solution_sketch: 'The derivatives at $9$ are $3$, $\frac16$, and $-\frac{1}{108}$; at $x = 9.6$ the polynomial gives $3 + \frac{1}{10} - \frac{1}{600}$.'
    anki_seeds:
      - front: 'The degree-n Taylor polynomial of f at a is $T_n(x) = $ ?'
        back: '$\sum_{k=0}^{n} \frac{f^{(k)}(a)}{k!}(x - a)^k$'
        type: basic
      - front: "T_n is the unique degree-<=n polynomial matching f in what way at a?"
        back: "same value and same first n derivatives at a"
        type: basic

  - id: taylor-polynomials-error
    name: Taylor Polynomials and Error Bounds
    core: false                # error-bound destination; taylor-polynomials stays core
    difficulty: 0.8
    drill: false
    answer_kind: numeric
    expected_time_secs: 300
    prerequisites:
      - id: taylor-polynomials
        weight: 0.8
        key: true
      - id: alternating-series-estimation
        weight: 0.5
        key: true
      - id: taylor-maclaurin-series
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The Lagrange remainder
        key_prerequisites: [taylor-polynomials]
        exemplars:
          - problem: "Use T_3(x) = x - x^3/6 to approximate sin x for |x| <= 1/3. Bound the absolute error with the Lagrange remainder, using M = 1 on this interval. Give the bound as a fraction."
            answer: "1/1944"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The remainder after T_3 is R_3(x) = sin x - T_3(x). The Lagrange remainder rule gives |R_3(x)| <= M |x|^4 / 4!; with M = 1 and |x| <= 1/3 this becomes (1/3)^4 / 24. Compute (1/3)^4 = 1/81, and 81 times 24 is 1944. The bound is 1/1944."
          - problem: "e^x is approximated by T_2(x) = 1 + x + x^2/2 for |x| <= 1/2. Bound the absolute error with the Lagrange remainder, using M = 3 on this interval. Give the bound as a fraction."
            answer: "1/16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The remainder after T_2 is R_2(x) = e^x - T_2(x). The Lagrange remainder rule gives |R_2(x)| <= M |x|^3 / 3!; with M = 3 and |x| <= 1/2 this is 3(1/2)^3 / 6. Compute (1/2)^3 = 1/8, so 3/8 divided by 6 is 1/16. The bound is 1/16."
          - problem: "cos x is approximated by T_2(x) = 1 - x^2/2 for |x| <= 1/2. Use the Lagrange remainder with M = 1 to bound the absolute error. Give the bound as a fraction."
            answer: "1/48"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The remainder after T_2 is R_2(x) = cos x - T_2(x). The Lagrange remainder rule gives |R_2(x)| <= M |x|^3 / 3!; with M = 1 and |x| <= 1/2 this is (1/2)^3 / 6. Compute (1/2)^3 = 1/8, and 8 times 6 is 48. The bound is 1/48."
          - problem: "sin x is approximated by T_4(x) = x - x^3/6 + x^5/120 for |x| <= 1/3. Use the Lagrange remainder with M = 1 to bound the absolute error. Give the bound as a fraction."
            answer: "1/29160"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The remainder after T_4 is R_4(x) = sin x - T_4(x). The Lagrange remainder rule gives |R_4(x)| <= M |x|^5 / 5!; with M = 1 and |x| <= 1/3 this is (1/3)^5 / 120. Compute 3^5 = 243, and 243 times 120 is 29160. The bound is 1/29160."
          - problem: "e^x is approximated by T_3(x) = 1 + x + x^2/2 + x^3/6 for |x| <= 1/2. Use the Lagrange remainder with M = 3 to bound the absolute error. Give the bound as a fraction."
            answer: "1/128"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The remainder after T_3 is R_3(x) = e^x - T_3(x). The Lagrange remainder rule gives |R_3(x)| <= M |x|^4 / 4!; with M = 3 and |x| <= 1/2 this is 3(1/2)^4 / 24. Compute (1/2)^4 = 1/16, so 3/16 divided by 24 is 1/128. The bound is 1/128."
          - problem: "e^x is approximated by T_1(x) = 1 + x for |x| <= 1/2. Use the Lagrange remainder with M = 3 to bound the absolute error. Give the bound as a fraction."
            answer: "3/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The remainder after T_1 is R_1(x) = e^x - T_1(x). The Lagrange remainder rule gives |R_1(x)| <= M |x|^2 / 2!; with M = 3 and |x| <= 1/2 this is 3(1/2)^2 / 2. Compute (1/2)^2 = 1/4, so 3/4 divided by 2 is 3/8. The bound is 3/8."
        constraints: "Lagrange bounds use M = 1 for sin/cos and M = 3 for e^x on [-1, 1]"
      - id: kp2
        name: The alternating error bound for series values
        key_prerequisites: [alternating-series-estimation, taylor-maclaurin-series]
        exemplars:
          - problem: "The value cos(0.5) is approximated by 1 - (0.5)^2/2 + (0.5)^4/24. Find a bound on the error as a fraction using the alternating series bound."
            answer: "1/46080"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the series: cos(0.5) = 1 - (0.5)^2/2 + (0.5)^4/24 - (0.5)^6/720 + ... . The terms alternate and decrease in size, so the alternating series bound applies. The first omitted term is (0.5)^6/720 = 1/46080, so the error is at most 1/46080."
          - problem: "The alternating series 1/e = 1 - 1 + 1/2 - 1/6 + 1/24 - ... converges. Find the least index N such that summing through n = N guarantees an error below 1/10000."
            answer: "7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the series: 1/e = 1 - 1 + 1/2 - 1/6 + 1/24 - ... . The alternating series bound says the error after summing through n = N is at most the first omitted term 1/(N+1)!. Require 1/(N+1)! below 1/10000. Since 7! = 5040 is below 10000 and 8! = 40320 is above, the least N is 7. The answer is 7."
