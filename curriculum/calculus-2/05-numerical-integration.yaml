            solution_sketch: 'The bound is proportional to $\frac{1}{n^4}$. Doubling $n$ divides the bound by $2^4 = 16$, so the new bound is $\frac{0.0032}{16} = 0.0002$.'
          - problem: 'For $\int_0^1 e^{-x}\,dx$, $f^{(4)}(x) = e^{-x}$ has maximum $K = 1$ on $[0,1]$. Compute the Simpson error bound $\frac{K(b-a)^5}{180n^4}$ for $n = 4$.'
            answer: '1/46080'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $b - a = 1$ and $f^{(4)}(x) = e^{-x}$ is decreasing, so $K = e^0 = 1$. The bound is $\frac{1 \cdot 1}{180 \cdot 4^4} = \frac{1}{180 \cdot 256} = \frac{1}{46080}$.'
          - problem: 'For $\int_1^3 \frac{1}{x+2}\,dx$, $f^{(4)}(x) = \frac{24}{(x+2)^5}$ has maximum $K = \frac{8}{81}$ at $x = 1$. Compute the Simpson error bound $\frac{K(b-a)^5}{180n^4}$ for $n = 4$.'
            answer: '1/14580'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $b - a = 2$, so $(b-a)^5 = 32$. The bound is $\frac{\frac{8}{81} \cdot 32}{180 \cdot 256} = \frac{256}{81 \cdot 46080} = \frac{1}{14580}$.'
          - problem: 'Find the Simpson error bound $\frac{K(b-a)^5}{180n^4}$ for $\int_1^3 \frac{1}{x}\,dx$ with $n = 4$, where $K$ is the maximum of $|f^{(4)}(x)|$ on $[1,3]$.'
            answer: '1/60'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $f^{(4)}(x) = \frac{24}{x^5}$ is decreasing, so $K = 24$ at $x = 1$. With $b - a = 2$ the bound is $\frac{24 \cdot 32}{180 \cdot 256} = \frac{768}{46080} = \frac{1}{60}$.'
          - problem: 'For $f(x) = x^4$ on $[0,2]$, $f^{(4)}(x) = 24$ is constant, so $K = 24$. Compute the Simpson error bound $\frac{K(b-a)^5}{180n^4}$ for $n = 2$.'
            answer: '4/15'
