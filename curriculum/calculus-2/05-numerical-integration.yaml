            solution_sketch: 'Here $b - a = 2$, so the bound is $\frac{24 \cdot 32}{180 \cdot 16} = \frac{768}{2880} = \frac{4}{15}$.'
          - problem: 'Water flows into a tank at the rate $r(t) = t^4$ litres per minute for $0 \le t \le 3$. Simpson''s rule with $n = 6$ estimates the total volume. Find the error bound $\frac{K(b-a)^5}{180n^4}$ in litres.'
