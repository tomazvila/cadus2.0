            solution_sketch: 'The condition $\frac{24}{180n^4} \le 0.001$ gives $n^4 \ge 133.3$. Since $3^4 = 81$ falls short and $4^4 = 256$ works, and $4$ is even, $n = 4$.'
          - problem: 'For an integral on $[0, 3]$ with $K = \max|f''''| = 4$, the trapezoid error bound is $\frac{K(b-a)^3}{12n^2}$. Find the smallest integer $n$ so that the bound is at most $0.001$.'
            answer: '95'
