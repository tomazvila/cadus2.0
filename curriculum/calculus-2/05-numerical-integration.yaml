unit: numerical-integration
course: calculus-2
module: "Numerical Integration"
topics:
  # Phase C (gap I-2): Simpson's rule and numerical-integration error bounds had
  # 0 hits tree-wide, while the series side already teaches error bounds
  # (taylor-polynomials-error, alternating-series-estimation) — this closes the
  # asymmetry. Midpoint/trapezoid sums themselves are already taught in
  # calculus-1 (midpoint-trapezoid-sums) and are NOT re-taught here.
  # R-2 note: midpoint-trapezoid-sums is supplemental after W8 ("numerical
  # rules; feed only the estimation topic"). Both new topics stay core: false
  # rather than flipping that anchor: nothing downstream builds on numerical
  # integration, so the whole branch remains a terminal destination and the W8
  # rationale stands.

  - id: simpsons-rule
    name: Simpson's Rule
    core: false                # terminal numerical-methods branch (rule 1: sits on supplemental midpoint-trapezoid-sums)
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: midpoint-trapezoid-sums
        weight: 0.8
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
      - id: estimating-integrals-from-tables
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The basic parabolic estimate (n = 2)
        key_prerequisites: [midpoint-trapezoid-sums]
        exemplars:
          - problem: 'Approximate $\int_0^2 x^2\,dx$ with Simpson''s rule, $n = 2$: $\frac{\Delta x}{3}\left(f_0 + 4f_1 + f_2\right)$. Give the result as a fraction.'
            answer: "8/3"
            solution_sketch: '$\Delta x = 1$: $\frac{1}{3}(0 + 4 \cdot 1 + 4) = \frac{8}{3}$ — exactly the true value, because Simpson''s rule fits a parabola and the integrand IS a parabola.'
          - problem: 'Approximate $\int_1^3 \frac{1}{x}\,dx$ with Simpson''s rule, $n = 2$. Give the result as a fraction.'
            answer: "10/9"
            solution_sketch: '$\Delta x = 1$: $\frac{1}{3}\left(1 + 4 \cdot \frac{1}{2} + \frac{1}{3}\right) = \frac{10}{9} \approx 1.111$, against the true $\ln 3 \approx 1.099$.'
          - problem: 'Approximate $\int_0^2 x^3\,dx$ with Simpson''s rule, $n = 2$.'
            answer: "4"
            solution_sketch: '$\frac{1}{3}(0 + 4 \cdot 1 + 8) = 4 = \int_0^2 x^3\,dx$ exactly — a preview of Simpson''s exactness through degree 3.'
          - problem: "Use Simpson's rule with $n = 2$, $\\frac{\\Delta x}{3}\\left(f_0 + 4f_1 + f_2\\right)$, to approximate $\\int_0^4 x^2\\,dx$. Give the result as a fraction."
            answer: "64/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The interval is [0,4] with n=2, so $\\Delta x = 2$ and the nodes are 0, 2, 4. The function values are $f(0)=0$, $f(2)=4$, and $f(4)=16$. Simpson's rule gives $\\frac{2}{3}(0 + 4\\cdot 4 + 16) = \\frac{2}{3}(32) = \\frac{64}{3}$. The answer is 64/3."
          - problem: "Use Simpson's rule with $n = 2$, $\\frac{\\Delta x}{3}\\left(f_0 + 4f_1 + f_2\\right)$, to approximate $\\int_2^4 \\frac{1}{x}\\,dx$. Give the result as a fraction."
            answer: "25/36"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The interval is [2,4] with n=2, so $\\Delta x = 1$ and the nodes are 2, 3, 4. The reciprocal values are $f(2)=1/2$, $f(3)=1/3$, and $f(4)=1/4$. Simpson's rule gives $\\frac{1}{3}(1/2 + 4/3 + 1/4) = \\frac{1}{3}(25/12) = \\frac{25}{36}$. The answer is 25/36."
          - problem: "Use Simpson's rule with $n = 2$, $\\frac{\\Delta x}{3}\\left(f_0 + 4f_1 + f_2\\right)$, to approximate $\\int_0^2 x^4\\,dx$. Give the result as a fraction."
            answer: "20/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The interval is [0,2] with n=2, so $\\Delta x = 1$ and the nodes are 0, 1, 2. The function values are $f(0)=0$, $f(1)=1$, and $f(2)=16$. Simpson's rule gives $\\frac{1}{3}(0 + 4\\cdot 1 + 16) = \\frac{20}{3}$. The answer is 20/3."
        constraints: "n = 2 only; nodes give exact function values (integer powers or 1/x at integer nodes); answers as fractions or terminating decimals; always print the Δx/3 (f0 + 4f1 + f2) template in the stem until mastered"
      - id: kp2
        name: The 1-4-2-4-1 pattern (n = 4 and tables)
        key_prerequisites: [midpoint-trapezoid-sums, estimating-integrals-from-tables]
        exemplars:
          - problem: 'Approximate $\int_0^4 x^3\,dx$ with Simpson''s rule, $n = 4$, using the coefficient pattern $1, 4, 2, 4, 1$.'
            answer: "64"
            solution_sketch: '$\Delta x = 1$: $\frac{1}{3}(0 + 4 \cdot 1 + 2 \cdot 8 + 4 \cdot 27 + 64) = \frac{192}{3} = 64$, again exact.'
          - problem: 'A table gives $f(0) = 2$, $f(1) = 5$, $f(2) = 4$, $f(3) = 7$, $f(4) = 2$. Estimate $\int_0^4 f(x)\,dx$ with Simpson''s rule.'
            answer: "20"
            solution_sketch: '$\frac{1}{3}(2 + 4 \cdot 5 + 2 \cdot 4 + 4 \cdot 7 + 2) = \frac{60}{3} = 20$.'
          - problem: "A table gives f(0) = 1, f(1) = 3, f(2) = 5, f(3) = 3, f(4) = 1 at equally spaced nodes. Use Simpson's rule with n = 4 to estimate the integral of f from 0 to 4. Give the value of the estimate."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The nodes are evenly spaced, so Delta x = 1. Simpson's rule with n = 4 uses the weights 1, 4, 2, 4, 1. Compute (1/3)(1 + 4*3 + 2*5 + 4*3 + 1) = (1/3)(36) = 12. The value of the estimate is 12."
          - problem: "A table gives f(0) = 0, f(0.5) = 2, f(1) = 4, f(1.5) = 2, f(2) = 0 at equally spaced nodes. Use Simpson's rule with n = 4 to estimate the integral of f from 0 to 2. Give the value of the estimate."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Here Delta x = 0.5, so the factor in front is Delta x/3 = 1/6. Simpson's rule with n = 4 uses the weights 1, 4, 2, 4, 1. The weighted sum is 0 + 4*2 + 2*4 + 4*2 + 0 = 24, and (1/6)*24 = 4. The value of the estimate is 4."
          - problem: "A table gives f(0) = 1, f(1) = a, f(2) = 2, f(3) = a, f(4) = 1 at equally spaced nodes. Simpson's rule with n = 4 gives the estimate 10 for the integral of f from 0 to 4. Find the value of a."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Simpson's rule with n = 4 gives (1/3)(f(0) + 4f(1) + 2f(2) + 4f(3) + f(4)). Substituting the table values and a gives (1/3)(1 + 4a + 4 + 4a + 1) = (1/3)(6 + 8a). Set this equal to 10: 6 + 8a = 30, so 8a = 24 and a = 3. The value of a is 3."
          - problem: "The speed of a car at times t = 0, 1, 2, 3, 4 seconds is v = 0, 4, 8, 4, 0 meters per second. Estimate the distance traveled from t = 0 to t = 4 with Simpson's rule using n = 4. Give the distance in meters as an integer."
            answer: "16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Distance traveled is the integral of speed over time. The time step is Delta t = 1, and Simpson's rule with n = 4 uses the weights 1, 4, 2, 4, 1. The estimate is (1/3)(0 + 4*4 + 2*8 + 4*4 + 0) = (1/3)(48) = 16. The distance is 16 meters."
        constraints: "n = 4 with evenly spaced nodes; table values small integers; coefficient pattern 1,4,2,...,2,4,1 recalled, not supplied, once kp1 is mastered"
      - id: kp3
        name: Why Simpson beats the trapezoid
        key_prerequisites: [definite-integrals-ftc, midpoint-trapezoid-sums]
        exemplars:
          - problem: 'For $\int_0^2 x^2\,dx = \frac{8}{3}$, the $n = 4$ trapezoid estimate is $2.75$. Compute its error $\left|2.75 - \frac{8}{3}\right|$ as a fraction.'
            answer: "1/12"
            solution_sketch: '$\frac{11}{4} - \frac{8}{3} = \frac{33 - 32}{12} = \frac{1}{12}$; Simpson with only $n = 2$ already gives $\frac{8}{3}$ exactly.'
          - problem: 'Simpson''s rule integrates every polynomial exactly up to what degree?'
            answer: "3"
            solution_sketch: 'The parabola matching makes degrees 0-2 exact, and the symmetric placement of the nodes makes the cubic error cancel too — degree 3 for free.'
          - problem: "For $\\int_0^1 x^2\\,dx = \\frac{1}{3}$, the $n = 2$ trapezoid estimate is $\\frac{3}{8}$ and Simpson is exact. Compute the trapezoid error as a fraction."
            answer: "1/24"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The exact value from the Fundamental Theorem of Calculus is 1/3. The n = 2 trapezoid estimate is 3/8. Simpson is exact here, so the trapezoid error is 3/8 - 1/3 = 9/24 - 8/24 = 1/24. The error is 1/24."
          - problem: "For $\\int_0^1 x^4\\,dx = \\frac{1}{5}$, the $n = 2$ Simpson estimate is $\\frac{5}{24}$. Compute its error as a fraction."
            answer: "1/120"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Fundamental Theorem of Calculus gives the exact value 1/5. Simpson's rule with n = 2 gives the estimate 5/24. Subtract: 5/24 - 1/5 = 25/120 - 24/120 = 1/120. The error is 1/120."
          - problem: "For $\\int_0^1 x^3\\,dx = \\frac{1}{4}$, the $n = 2$ trapezoid estimate is $\\frac{5}{16}$ and Simpson is exact. Compute the trapezoid error as a fraction."
            answer: "1/16"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The Fundamental Theorem of Calculus gives the exact value 1/4. The n = 2 trapezoid estimate is 5/16. Simpson is exact here, so the trapezoid error is 5/16 - 1/4 = 5/16 - 4/16 = 1/16. The error is 1/16."
          - problem: "Simpson's rule with $n = 2$ matches a parabola through three points. Find the smallest degree of a polynomial that can give a nonzero error."
            answer: "4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Simpson's rule with n = 2 fits a parabola, so every polynomial of degree 0, 1, or 2 is integrated exactly. The symmetric placement of the three nodes also cancels the cubic term, so degree 3 has zero error. The first degree that can leave a nonzero error is 4. The smallest degree is 4."
        constraints: "errors as exact fractions against an FTC-computed true value; degree/parity facts asked as plain numerics"
    diagnostic_exemplar:
      problem: 'A table gives $f(0) = 3$, $f(1) = 6$, $f(2) = 5$, $f(3) = 8$, $f(4) = 3$. Estimate $\int_0^4 f(x)\,dx$ with Simpson''s rule.'
      answer: '24'
      solution_sketch: 'With $\Delta x = 1$ and the pattern $1, 4, 2, 4, 1$: $\frac{1}{3}(3 + 24 + 10 + 32 + 3) = 24$.'
    anki_seeds:
      - front: "Simpson's rule (n even): ∫ ≈ ?"
        back: "(Δx/3)(f₀ + 4f₁ + 2f₂ + 4f₃ + … + 4fₙ₋₁ + fₙ)"
        type: basic
      - front: "Simpson's rule coefficient pattern and parity requirement?"
        back: "1, 4, 2, 4, …, 2, 4, 1 — n must be even"
        type: basic
      - front: "Simpson's rule is exact for polynomials up to degree..."
        back: "3 (cubics), because the cubic error cancels by symmetry"
        type: basic

  - id: numerical-integration-error-bounds
    name: Numerical Integration Error Bounds
    core: false                # terminal: quantifies a supplemental branch; nothing downstream consumes it
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: simpsons-rule
        weight: 0.7
        key: true
      - id: midpoint-trapezoid-sums
        weight: 0.6
        key: true
      - id: higher-order-derivatives
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Trapezoid and midpoint error bounds
        key_prerequisites: [midpoint-trapezoid-sums, second-derivatives]
        exemplars:
          - problem: 'For $\int_0^2 x^3\,dx$ we have $f''''(x) = 6x$, so $K = \max_{[0,2]}|f''''| = 12$. Compute the trapezoid error bound $\frac{K(b-a)^3}{12n^2}$ for $n = 4$.'
            answer: "1/2"
            solution_sketch: '$\frac{12 \cdot 8}{12 \cdot 16} = \frac{1}{2}$ — the true error is smaller; the bound is a guarantee, not a prediction.'
          - problem: 'Same integral, same $K = 12$: compute the midpoint error bound $\frac{K(b-a)^3}{24n^2}$ for $n = 4$.'
            answer: "1/4"
            solution_sketch: '$\frac{12 \cdot 8}{24 \cdot 16} = \frac{1}{4}$ — half the trapezoid bound, matching the concavity picture from midpoint-trapezoid-sums.'
          - problem: 'Doubling $n$ divides the trapezoid error bound by what factor?'
            answer: "4"
            solution_sketch: 'The bound scales as $\frac{1}{n^2}$, so doubling $n$ divides it by $2^2 = 4$.'
          - problem: "For the integral of 1/x from 1 to 2 we have f''(x) = 2/x^3, which is decreasing on [1, 2], so K = max |f''| = 2 at x = 1. Compute the trapezoid error bound K(b-a)^3/(12n^2) for n = 5."
            answer: "1/150"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: f''(x) = 2/x^3 is decreasing on [1, 2], so K = max |f''| = 2 at x = 1. Step 2: the trapezoid error bound gives K(b-a)^3/(12n^2) = 2*1/(12*25). Step 3: simplify 2/300 to 1/150, so the trapezoid error bound is 1/150."
          - problem: "For the integral of x^4 from 0 to 1 we have f''(x) = 12x^2, so K = 12 at x = 1. Compute the midpoint error bound K(b-a)^3/(24n^2) for n = 2."
            answer: "1/8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the second derivative is f''(x) = 12x^2, so K = max |f''| = 12 on [0, 1]. Step 2: the midpoint error bound gives K(b-a)^3/(24n^2) = 12*1/(24*4). Step 3: simplify 12/96 to 1/8, so the midpoint error bound is 1/8."
          - problem: "Consider the integral of x^2 from 0 to 4, with f''(x) = 2. Compute the trapezoid error bound K(b-a)^3/(12n^2) for n = 4, using K = max |f''| on [0, 4]."
            answer: "2/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: the second derivative is f''(x) = 2, so K = max |f''| = 2 on [0, 4]. Step 2: the trapezoid error bound gives K(b-a)^3/(12n^2) = 2*64/(12*16). Step 3: simplify 128/192 to 2/3, so the trapezoid error bound is 2/3."
        constraints: "K supplied, or f'' monotone so its max sits at an endpoint; (b - a) and n chosen so bounds are simple fractions; formulas printed in the stem until the anki cards stick"
      - id: kp2
        name: The Simpson error bound
        key_prerequisites: [simpsons-rule, higher-order-derivatives]
        exemplars:
          - problem: 'For $\int_1^2 \frac{1}{x}\,dx$, $f^{(4)}(x) = \frac{24}{x^5}$ has maximum $K = 24$ at $x = 1$. Compute the Simpson error bound $\frac{K(b-a)^5}{180n^4}$ for $n = 4$.'
            answer: "1/1920"
            solution_sketch: '$\frac{24 \cdot 1}{180 \cdot 256} = \frac{24}{46080} = \frac{1}{1920}$ — with only 4 subintervals the estimate is already good to three decimals.'
          - problem: 'For $f(x) = x^3$, compute $K = \max |f^{(4)}(x)|$, the constant in the Simpson error bound.'
            answer: "0"
            solution_sketch: '$f^{(4)} = 0$ for any cubic — the bound is $0$, which is exactly the exactness-through-degree-3 fact.'
          - problem: 'The Simpson bound scales as $\frac{1}{n^4}$, the trapezoid bound as $\frac{1}{n^2}$. Doubling $n$ divides the Simpson bound by what factor?'
            answer: "16"
            solution_sketch: '$2^4 = 16$ — fourth-order convergence is why Simpson wins at the same cost in function evaluations.'
          - problem: "For the integral of e^(-x) from 0 to 1, f^(4)(x) = e^(-x) has maximum K = 1 on [0, 1]. Compute the Simpson error bound K(b-a)^5/(180 n^4) for n = 4."
            answer: "1/46080"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Simpson error bound formula: |E_S| <= K(b-a)^5/(180 n^4). Here b-a = 1 and f^(4)(x) = e^(-x) is decreasing, so K = e^0 = 1. Substitute: 1 * 1^5 / (180 * 4^4) = 1 / (180 * 256) = 1/46080. The bound is 1/46080."
          - problem: "For the integral of 1/(x+2) from 1 to 3, f^(4)(x) = 24/(x+2)^5 has maximum K = 8/81 at x = 1. Compute the Simpson error bound K(b-a)^5/(180 n^4) for n = 4."
            answer: "1/14580"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Simpson error bound formula: |E_S| <= K(b-a)^5/(180 n^4). Here b-a = 2 and f^(4)(x) = 24/(x+2)^5 is decreasing, so K = f^(4)(1) = 24/243 = 8/81. Substitute: (8/81) * 2^5 / (180 * 4^4) = (8/81)*32/(180*256) = 1/14580. The bound is 1/14580."
          - problem: "For f(x) = x^4 on [0, 2], f^(4)(x) = 24 is constant, so K = 24. Compute the Simpson error bound K(b-a)^5/(180 n^4) for n = 2."
            answer: "4/15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Simpson error bound formula: |E_S| <= K(b-a)^5/(180 n^4). For f(x)=x^4, f^(4)(x)=24, so K=24. Substitute: 24 * 2^5 / (180 * 2^4) = 24*32/(180*16) = 768/2880 = 4/15. The bound is 4/15."
        constraints: "f^(4) supplied or trivially maximized (monotone, max at an endpoint); n = 2 or 4 so 180n^4 stays a hand-sized denominator; answers exact fractions"
      - id: kp3
        name: Choosing n for a target accuracy
        key_prerequisites: [simpsons-rule, midpoint-trapezoid-sums]
        exemplars:
          - problem: 'For an integral on $[0, 1]$ with $K = \max|f''''| = 2$, find the smallest integer $n$ so the trapezoid bound $\frac{K(b-a)^3}{12n^2} = \frac{1}{6n^2}$ is at most $0.01$.'
            answer: "5"
            solution_sketch: '$\frac{1}{6n^2} \le \frac{1}{100} \iff n^2 \ge \frac{100}{6} \approx 16.7$, so $n = 5$ (since $4^2 = 16$ falls short).'
          - problem: 'For an integral on $[0, 1]$ with $K = \max|f^{(4)}| = 24$, find the smallest EVEN $n$ so the Simpson bound $\frac{24}{180n^4}$ is at most $0.001$.'
            answer: "4"
            solution_sketch: '$n^4 \ge \frac{24}{0.18} \approx 133$; $3^4 = 81$ fails, $4^4 = 256$ works — and $n$ must be even anyway.'
          - problem: "For an integral on [1, 4] with K = max|f''| = 2, the midpoint error bound is K(b-a)^3/(24n^2). Find the smallest integer n so the midpoint bound is at most 0.001."
            answer: "48"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the midpoint error bound, K(b-a)^3/(24n^2) = 2*27/(24n^2) = 9/(4n^2). Step 2: require 9/(4n^2) <= 0.001, which gives n^2 >= 2250. Step 3: n=47 gives 2209 and n=48 gives 2304, so the first integer that works is 48. The smallest integer n is 48."
          - problem: "For an integral on [0, 3] with K = max|f''| = 4, the trapezoid error bound is K(b-a)^3/(12n^2). Find the smallest integer n so the trapezoid bound is at most 0.001."
            answer: "95"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the trapezoid error bound, K(b-a)^3/(12n^2) = 4*27/(12n^2) = 9/n^2. Step 2: require 9/n^2 <= 0.001, which gives n^2 >= 9000. Step 3: n=94 gives 8836 and n=95 gives 9025, so the first integer that works is 95. The smallest integer n is 95."
          - problem: "For an integral on [1, 4] with K = 10, where K bounds the fourth derivative, the Simpson error bound is K(b-a)^5/(180n^4). Find the smallest even integer n so the Simpson bound is at most 0.001."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the Simpson error bound, K(b-a)^5/(180n^4) = 10*243/(180n^4) = 27/(2n^4). Step 2: require 27/(2n^4) <= 0.001, so n^4 >= 13500. Step 3: n=10 gives 10000 and n=11 gives 14641, but n must be even, so check n=12; it gives 20736 and works. The smallest even integer n is 12."
          - problem: "For an integral on [2, 5] with K = 20, where K bounds the fourth derivative, the Simpson error bound is K(b-a)^5/(180n^4). Find the smallest even integer n so the Simpson bound is at most 0.01."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: write the Simpson error bound, K(b-a)^5/(180n^4) = 20*243/(180n^4) = 27/n^4. Step 2: require 27/n^4 <= 0.01, so n^4 >= 2700. Step 3: n=7 gives 2401, which is too small, and n=8 gives 4096, which works; n=8 is even. The smallest even integer n is 8."
        constraints: "targets 10^-2 or 10^-3; K and (b - a) chosen so the threshold lands between consecutive (even, for Simpson) values of n; answer is the single integer n"
    diagnostic_exemplar:
      problem: 'For an integral over $[0, 2]$ with $K = \max|f^{(2)}| = 6$, find the smallest integer $n$ for which the trapezoid error bound $\frac{K(b-a)^3}{12n^2}$ is at most $0.01$.'
      answer: '20'
      solution_sketch: 'The bound is $\frac{6 \cdot 8}{12n^2} = \frac{4}{n^2}$; requiring $\frac{4}{n^2} \le 0.01$ gives $n^2 \ge 400$, so $n = 20$.'
    anki_seeds:
      - front: "Trapezoid rule error bound?"
        back: "|E_T| ≤ K(b−a)³/(12n²), where K ≥ max|f″| on [a, b] (midpoint: 24n² in the denominator)"
        type: basic
      - front: "Simpson's rule error bound?"
        back: "|E_S| ≤ K(b−a)⁵/(180n⁴), where K ≥ max|f⁽⁴⁾| on [a, b]"
        type: basic
      - front: "Doubling n divides the trapezoid bound by ___ and the Simpson bound by ___"
        back: "4 and 16 (1/n² vs 1/n⁴ convergence)"
        type: basic
