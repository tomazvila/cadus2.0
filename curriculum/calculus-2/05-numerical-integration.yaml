      - id: kp3
        name: Choosing n for a target accuracy
        key_prerequisites: [simpsons-rule, midpoint-trapezoid-sums]
        exemplars:
          - problem: 'For an integral on $[0, 1]$ with $K = \max|f''''| = 2$, find the smallest integer $n$ so that the trapezoid bound $\frac{K(b-a)^3}{12n^2}$ is at most $0.01$.'
            answer: '5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bound is $\frac{2}{12n^2} = \frac{1}{6n^2}$. Requiring $\frac{1}{6n^2} \le 0.01$ gives $n^2 \ge \frac{100}{6} \approx 16.7$, so $n = 5$, because $4^2 = 16$ falls short.'
          - problem: 'The volume of water that enters a tank in the first $2$ minutes is $\int_0^2 f(t)\,dt$ litres, where $|f''''(t)| \le 3$ on $[0,2]$. How many subintervals $n$ guarantee that the trapezoid rule is within $0.01$ litre of the true volume?'
            answer: '15'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bound is $\frac{3 \cdot 8}{12n^2} = \frac{2}{n^2}$. Requiring $\frac{2}{n^2} \le 0.01$ gives $n^2 \ge 200$. Since $14^2 = 196$ falls short and $15^2 = 225$ works, the smallest value is $n = 15$.'
          - problem: 'For an integral on $[1, 4]$ with $K = \max|f''''| = 2$, the midpoint error bound is $\frac{K(b-a)^3}{24n^2}$. Find the smallest integer $n$ so that the midpoint bound is at most $0.001$.'
            answer: '48'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bound is $\frac{2 \cdot 27}{24n^2} = \frac{9}{4n^2}$. Requiring $\frac{9}{4n^2} \le 0.001$ gives $n^2 \ge 2250$. Since $47^2 = 2209$ falls short and $48^2 = 2304$ works, $n = 48$.'
          - problem: 'How many subintervals does the trapezoid rule need so that its estimate of $\int_0^2 x^3\,dx$ is guaranteed to be within $0.001$ of the true value?'
            answer: '90'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $f''''(x) = 6x$, so $K = 12$ on $[0,2]$ and the bound is $\frac{12 \cdot 8}{12n^2} = \frac{8}{n^2}$. Requiring $\frac{8}{n^2} \le 0.001$ gives $n^2 \ge 8000$. Since $89^2 = 7921$ falls short and $90^2 = 8100$ works, $n = 90$.'
          - problem: 'For an integral on $[1, 4]$ with $K = 10$, where $K$ bounds the fourth derivative, find the smallest even $n$ so that the Simpson bound $\frac{K(b-a)^5}{180n^4}$ is at most $0.001$.'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bound is $\frac{10 \cdot 243}{180n^4} = \frac{27}{2n^4}$. Requiring $\frac{27}{2n^4} \le 0.001$ gives $n^4 \ge 13500$. Since $10^4 = 10000$ falls short and $11$ is odd, the smallest even value is $n = 12$, with $12^4 = 20736$.'
          - problem: 'Simpson''s rule must estimate $\int_1^3 \frac{1}{x}\,dx$ with an error of at most $0.0001$. Find the smallest even $n$ for which the Simpson error bound guarantees this.'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $f^{(4)}(x) = \frac{24}{x^5}$, so $K = 24$ and the bound is $\frac{24 \cdot 32}{180n^4} = \frac{64}{15n^4}$. Requiring $\frac{64}{15n^4} \le 0.0001$ gives $n^4 \ge 42667$. Since $14^4 = 38416$ falls short and $16^4 = 65536$ works, $n = 16$.'
          - problem: 'A surveyor integrates a depth profile over $[0, 2]$, where $|f^{(4)}(x)| \le 6$. Find the smallest even $n$ so that Simpson''s rule is guaranteed to be within $0.001$ of the true value.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bound is $\frac{6 \cdot 32}{180n^4} = \frac{16}{15n^4}$. Requiring $\frac{16}{15n^4} \le 0.001$ gives $n^4 \ge 1066.7$. Since $4^4 = 256$ falls short and $6^4 = 1296$ works, the smallest even value is $n = 6$.'
          - problem: 'For an integral on $[0, 1]$ with $K = \max|f^{(4)}| = 24$, find the smallest even $n$ so that the Simpson bound $\frac{24}{180n^4}$ is at most $0.001$.'
            answer: '4'
