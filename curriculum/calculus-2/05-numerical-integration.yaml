unit: numerical-integration
course: calculus-2
module: "Numerical Integration"
topics:
  # Phase C (gap I-2): Simpson's rule and numerical-integration error bounds had
  # 0 hits tree-wide, while the series side already teaches error bounds
  # (taylor-polynomials-error, alternating-series-estimation) — this closes the
  # asymmetry. Midpoint/trapezoid sums themselves are already taught in
  # calculus-1 (midpoint-trapezoid-sums) and are NOT re-taught here.
  # R-2 note: midpoint-trapezoid-sums is supplemental after W8 ("numerical
  # rules; feed only the estimation topic"). Both new topics stay core: false
  # rather than flipping that anchor: nothing downstream builds on numerical
  # integration, so the whole branch remains a terminal destination and the W8
  # rationale stands.

  - id: simpsons-rule
    name: Simpson's Rule
    core: false                # terminal numerical-methods branch (rule 1: sits on supplemental midpoint-trapezoid-sums)
    difficulty: 0.65
    drill: false
    answer_kind: numeric
    expected_time_secs: 210
    prerequisites:
      - id: midpoint-trapezoid-sums
        weight: 0.8
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
      - id: estimating-integrals-from-tables
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: The basic parabolic estimate (n = 2)
        key_prerequisites: [midpoint-trapezoid-sums]
        exemplars:
          - problem: 'Use Simpson''s rule with $n = 2$, $\frac{\Delta x}{3}\left(f_0 + 4f_1 + f_2\right)$, to approximate $\int_1^3 \frac{1}{x}\,dx$.'
            answer: '10/9'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $\Delta x = 1$ and the nodes are $1, 2, 3$ with values $1$, $\frac12$ and $\frac13$. The estimate is $\frac{1}{3}\left(1 + 4 \cdot \frac12 + \frac13\right) = \frac{10}{9}$. It is close to the true value $\ln 3 \approx 1.099$.'
          - problem: 'Use Simpson''s rule with $n = 2$ to approximate $\int_0^4 x^2\,dx$.'
            answer: '64/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interval $[0,4]$ with $n = 2$ gives $\Delta x = 2$ and the nodes $0, 2, 4$. The values are $0$, $4$ and $16$, so the estimate is $\frac{2}{3}(0 + 16 + 16) = \frac{64}{3}$. This is the exact value, because the integrand is itself a parabola.'
          - problem: 'Use Simpson''s rule with $n = 2$ to approximate $\int_2^4 \frac{1}{x}\,dx$.'
            answer: '25/36'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The interval $[2,4]$ with $n = 2$ gives $\Delta x = 1$ and the nodes $2, 3, 4$. The values are $\frac12$, $\frac13$ and $\frac14$. The estimate is $\frac{1}{3}\left(\frac12 + \frac43 + \frac14\right) = \frac13 \cdot \frac{25}{12} = \frac{25}{36}$.'
          - problem: 'Use Simpson''s rule with $n = 2$ to approximate $\int_0^{\pi} \sin x\,dx$.'
            answer: '2*pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $\Delta x = \frac{\pi}{2}$ and the nodes are $0, \frac{\pi}{2}, \pi$ with values $0, 1, 0$. The estimate is $\frac{\pi/2}{3}(0 + 4 + 0) = \frac{2\pi}{3}$, which is about $2.094$. The true value is $2$.'
          - problem: 'A runner''s speed is measured at $t = 0$, $2$ and $4$ seconds: it is $3$, $7$ and $5$ metres per second. Use Simpson''s rule with $n = 2$ to estimate the distance the runner covers in these $4$ seconds.'
            answer: '24'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The distance is the integral of the speed over the time. The time step is $\Delta t = 2$ seconds, so the estimate is $\frac{2}{3}(3 + 4 \cdot 7 + 5) = \frac{2}{3} \cdot 36 = 24$ metres.'
          - problem: 'A cyclist''s speed is $2$, $8$ and $5$ metres per second at $t = 0$, $3$ and $6$ seconds. Use Simpson''s rule with $n = 2$ to estimate the cyclist''s average speed over these $6$ seconds.'
            answer: '6.5'
            answer_contract: {"kind": "unit", "quantity": "speed", "unit": "m/s", "allow_omitted": true}
            solution_sketch: 'Simpson''s rule first estimates the distance: $\frac{3}{3}(2 + 4 \cdot 8 + 5) = 39$ metres. The average speed is this distance divided by the time, so $\frac{39}{6} = 6.5$ metres per second.'
          - problem: 'Sam estimates $\int_0^2 x^2\,dx$ with Simpson''s rule, $n = 2$, and writes $\frac{1}{3}\left(0 + 1 + 4\right) = \frac{5}{3}$. What is the correct Simpson estimate?'
            answer: '8/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam gave the middle value $f_1 = 1$ the weight $1$, but the middle value has the weight $4$. The correct estimate is $\frac{1}{3}(0 + 4 \cdot 1 + 4) = \frac{8}{3}$.'
          - problem: 'Water flows into a tank at $5$, $9$ and $7$ litres per minute at $t = 0$, $5$ and $10$ minutes. Use Simpson''s rule with $n = 2$ to estimate the volume that flows in during these $10$ minutes.'
            answer: '80'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'The volume is the integral of the flow rate over the time. The time step is $\Delta t = 5$ minutes, so the estimate is $\frac{5}{3}(5 + 4 \cdot 9 + 7) = \frac{5}{3} \cdot 48 = 80$ litres.'
          - problem: 'Use Simpson''s rule with $n = 2$ to approximate $\int_0^4 \sqrt{x}\,dx$ to three decimal places.'
            answer: '5.105'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Here $\Delta x = 2$ and the nodes $0, 2, 4$ give the values $0$, $\sqrt{2}$ and $2$. The estimate is $\frac{2}{3}(4\sqrt{2} + 2) \approx 5.105$. The true value is $\frac{16}{3} \approx 5.333$.'
        constraints: "n = 2 only; nodes give exact function values (integer powers, 1/x at integer nodes, sin at multiples of pi/2) or measured table values; the Δx/3 (f0 + 4f1 + f2) template is printed in the first stem until mastered"
      - id: kp2
        name: The 1-4-2-4-1 pattern (n = 4 and tables)
        key_prerequisites: [midpoint-trapezoid-sums, estimating-integrals-from-tables]
        exemplars:
          - problem: 'A table gives $f(0) = 2$, $f(1) = 5$, $f(2) = 4$, $f(3) = 7$, $f(4) = 2$. Use Simpson''s rule with $n = 4$ to estimate $\int_0^4 f(x)\,dx$.'
            answer: '20'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The nodes are $0, 1, 2, 3, 4$, so $\Delta x = 1$, and the weights are $1, 4, 2, 4, 1$. The estimate is $\frac{1}{3}(2 + 4 \cdot 5 + 2 \cdot 4 + 4 \cdot 7 + 2) = \frac{60}{3} = 20$.'
          - problem: 'Use Simpson''s rule with $n = 4$ to approximate $\int_0^4 x^3\,dx$.'
            answer: '64'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $\Delta x = 1$ and the values at $0, 1, 2, 3, 4$ are $0, 1, 8, 27, 64$. The estimate is $\frac{1}{3}(0 + 4 \cdot 1 + 2 \cdot 8 + 4 \cdot 27 + 64) = \frac{192}{3} = 64$. This equals the true value, because Simpson''s rule is exact for cubics.'
          - problem: 'A table gives $f(0) = 0$, $f(0.5) = 2$, $f(1) = 4$, $f(1.5) = 2$, $f(2) = 0$. Use Simpson''s rule with $n = 4$ to estimate $\int_0^2 f(x)\,dx$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The spacing is $\Delta x = 0.5$, so the factor in front is $\frac{\Delta x}{3} = \frac16$. The weighted sum is $0 + 4 \cdot 2 + 2 \cdot 4 + 4 \cdot 2 + 0 = 24$, and $\frac16 \cdot 24 = 4$.'
          - problem: 'Use Simpson''s rule with $n = 4$ to approximate $\int_0^2 x^4\,dx$ to three decimal places.'
            answer: '6.417'
            answer_contract: {"kind": "approx", "decimals": 3}
            solution_sketch: 'Here $\Delta x = 0.5$ and the values at $0, 0.5, 1, 1.5, 2$ are $0, 0.0625, 1, 5.0625, 16$. The estimate is $\frac{1}{6}(0 + 0.25 + 2 + 20.25 + 16) = \frac{38.5}{6} \approx 6.417$. The true value is $6.4$.'
          - problem: 'The speed of a car at $t = 0, 1, 2, 3, 4$ seconds is $0, 4, 8, 4, 0$ metres per second. Use Simpson''s rule with $n = 4$ to estimate the distance the car travels from $t = 0$ to $t = 4$.'
            answer: '16'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The distance is the integral of the speed. The time step is $\Delta t = 1$, so the estimate is $\frac{1}{3}(0 + 4 \cdot 4 + 2 \cdot 8 + 4 \cdot 4 + 0) = \frac{48}{3} = 16$ metres.'
          - problem: 'A thermometer reads $12$, $15$, $19$, $18$ and $14$ degrees Celsius at hourly intervals over a $4$-hour period. Use Simpson''s rule with $n = 4$ to estimate the average temperature over the period, to one decimal place.'
            answer: '16.3'
            answer_contract: {"kind": "approx", "decimals": 1}
            solution_sketch: 'The integral estimate is $\frac{1}{3}(12 + 4 \cdot 15 + 2 \cdot 19 + 4 \cdot 18 + 14) = \frac{196}{3}$. The average is this total divided by the length $4$ of the period, so $\frac{196}{12} \approx 16.3$ degrees.'
          - problem: 'A table gives $f(0) = 1$, $f(1) = a$, $f(2) = 2$, $f(3) = a$, $f(4) = 1$. Simpson''s rule with $n = 4$ gives the estimate $10$ for $\int_0^4 f(x)\,dx$. Find the value of $a$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Simpson''s rule gives $\frac{1}{3}(1 + 4a + 2 \cdot 2 + 4a + 1) = \frac{6 + 8a}{3}$. Setting this equal to $10$ gives $6 + 8a = 30$, so $8a = 24$ and $a = 3$.'
          - problem: 'Water flows into a reservoir at $6$, $9$, $12$, $10$ and $7$ litres per minute at $t = 0, 2, 4, 6, 8$ minutes. Use Simpson''s rule with $n = 4$ to estimate the volume that flows in during these $8$ minutes, to the nearest litre.'
            answer: '75'
            answer_contract: {"kind": "approx", "decimals": 0}
            solution_sketch: 'The time step is $\Delta t = 2$ minutes. The estimate is $\frac{2}{3}(6 + 4 \cdot 9 + 2 \cdot 12 + 4 \cdot 10 + 7) = \frac{2}{3} \cdot 113 \approx 75.3$, which is $75$ litres to the nearest litre.'
          - problem: 'Sam uses Simpson''s rule with $n = 4$ on the table $f(0) = 3$, $f(1) = 5$, $f(2) = 4$, $f(3) = 6$, $f(4) = 3$ and writes $\frac{1}{3}(3 + 4 \cdot 5 + 4 \cdot 4 + 4 \cdot 6 + 3) = 22$. What is the correct estimate of $\int_0^4 f(x)\,dx$?'
            answer: '58/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam gave the middle value $f(2) = 4$ the weight $4$, but the middle node has the weight $2$. The correct estimate is $\frac{1}{3}(3 + 20 + 2 \cdot 4 + 24 + 3) = \frac{58}{3}$.'
        constraints: "n = 4 with evenly spaced nodes; table values small numbers; coefficient pattern 1,4,2,4,1 recalled, not supplied, once kp1 is mastered"
      - id: kp3
        name: Why Simpson beats the trapezoid
        key_prerequisites: [definite-integrals-ftc, midpoint-trapezoid-sums]
        try_first:
          problem: 'Use Simpson''s rule with $n = 2$ to approximate $\int_0^2 x^3\,dx$.'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'The estimate is $\frac{1}{3}(0 + 4 \cdot 1 + 8) = 4$, and the exact value is $\int_0^2 x^3\,dx = 4$ too. Simpson''s rule fits a parabola, yet it is exact even for a cubic.'
        exemplars:
          - problem: 'The trapezoid rule with $n = 4$ gives $2.75$ for $\int_0^2 x^2\,dx = \frac{8}{3}$. What is the size of its error?'
            answer: '1/12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The error is $\frac{11}{4} - \frac{8}{3} = \frac{33 - 32}{12} = \frac{1}{12}$. Simpson''s rule with only $n = 2$ already gives $\frac{8}{3}$ exactly.'
          - problem: 'Simpson''s rule integrates every polynomial exactly up to what degree?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The parabola fit makes the degrees $0$, $1$ and $2$ exact. The symmetric placement of the nodes makes the cubic error cancel too, so the rule is exact up to degree $3$.'
          - problem: 'The trapezoid rule with $n = 2$ gives $\frac{3}{8}$ for $\int_0^1 x^2\,dx = \frac{1}{3}$. What is the size of its error?'
            answer: '1/24'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The exact value is $\frac13$ from the Fundamental Theorem of Calculus. The error is $\frac38 - \frac13 = \frac{9}{24} - \frac{8}{24} = \frac{1}{24}$.'
          - problem: 'Simpson''s rule with $n = 2$ gives $\frac{5}{24}$ for $\int_0^1 x^4\,dx = \frac{1}{5}$. What is the size of its error?'
            answer: '1/120'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The error is $\frac{5}{24} - \frac15 = \frac{25}{120} - \frac{24}{120} = \frac{1}{120}$. It is not zero, because $x^4$ has degree $4$.'
          - problem: 'The depth of a channel, in metres, at distance $x$ metres along a $3$ m stretch is $d(x) = 2x^3 - x^2 + 4$. Does Simpson''s rule with $n = 2$ give the exact value of the cross-sectional area $\int_0^3 d(x)\,dx$?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "exact", "it is exact", "it does give the exact value", "it gives the exact value"], ["no", "it does not", "not exact", "it is not exact", "it does not give the exact value", "not exactly"]]}
            solution_sketch: 'The function $d(x)$ is a cubic, and Simpson''s rule is exact for every polynomial up to degree 3. So the estimate equals the true area, which is $43.5$ square metres.'
          - problem: 'A beam has height $h(x) = x^4 + x$ metres at distance $x$ metres along a $1$ m span. Does Simpson''s rule with $n = 2$ give the exact value of the area $\int_0^1 h(x)\,dx$?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it does", "exact", "it is exact", "it does give the exact value", "it gives the exact value"], ["no", "it does not", "not exact", "it is not exact", "it does not give the exact value", "not exactly"]]}
            solution_sketch: 'The function $h(x)$ has degree $4$, so the exactness for cubics does not apply. Simpson''s rule gives $\frac{17}{24}$, while the true area is $\frac{7}{10}$, so the two values differ.'
          - problem: 'What is the smallest degree of a polynomial for which Simpson''s rule with $n = 2$ can give a nonzero error?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Simpson''s rule is exact for the degrees $0$, $1$, $2$ and $3$. The first degree that can leave a nonzero error is $4$.'
          - problem: 'The trapezoid rule with $n = 2$ gives $\frac{5}{16}$ for $\int_0^1 x^3\,dx = \frac{1}{4}$. What is the size of its error?'
            answer: '1/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The error is $\frac{5}{16} - \frac14 = \frac{5}{16} - \frac{4}{16} = \frac{1}{16}$. Simpson''s rule with $n = 2$ gives the exact value $\frac14$ for this cubic.'
          - problem: 'A vehicle has speed $v(t) = t^3$ metres per second for $0 \le t \le 2$ seconds, so it covers exactly $4$ metres. The trapezoid rule with $n = 4$ estimates the distance as $\frac{17}{4}$ metres. How far is this estimate from the exact distance, in metres?'
            answer: '1/4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The estimate minus the exact distance is $\frac{17}{4} - 4 = \frac{17}{4} - \frac{16}{4} = \frac{1}{4}$ metre. Simpson''s rule with $n = 2$ would give exactly $4$ metres.'
        constraints: "errors against an FTC-computed true value; exactness and degree facts asked as plain numerals or yes/no verdicts about a named polynomial profile"
    diagnostic_exemplar:
      problem: 'A table gives $f(0) = 3$, $f(1) = 6$, $f(2) = 5$, $f(3) = 8$, $f(4) = 3$. Estimate $\int_0^4 f(x)\,dx$ with Simpson''s rule.'
      answer: '24'
      solution_sketch: 'With $\Delta x = 1$ and the pattern $1, 4, 2, 4, 1$: $\frac{1}{3}(3 + 24 + 10 + 32 + 3) = 24$.'
    anki_seeds:
      - front: "Simpson's rule (n even): ∫ ≈ ?"
        back: "(Δx/3)(f₀ + 4f₁ + 2f₂ + 4f₃ + … + 4fₙ₋₁ + fₙ)"
        type: basic
      - front: "Simpson's rule coefficient pattern and parity requirement?"
        back: "1, 4, 2, 4, …, 2, 4, 1 — n must be even"
        type: basic
      - front: "Simpson's rule is exact for polynomials up to degree..."
        back: "3 (cubics), because the cubic error cancels by symmetry"
        type: basic

  - id: numerical-integration-error-bounds
    name: Numerical Integration Error Bounds
    core: false                # terminal: quantifies a supplemental branch; nothing downstream consumes it
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: simpsons-rule
        weight: 0.7
        key: true
      - id: midpoint-trapezoid-sums
        weight: 0.6
        key: true
      - id: higher-order-derivatives
        weight: 0.5
    knowledge_points:
      - id: kp1
        name: Trapezoid and midpoint error bounds
        key_prerequisites: [midpoint-trapezoid-sums, second-derivatives]
        try_first:
          problem: 'The trapezoid rule with $n = 1$ gives $\frac12$ for $\int_0^1 x^2\,dx$, whose exact value is $\frac13$. What is the size of the error?'
          answer_contract: {"kind": "exact"}
          answer: '1/6'
          reveal: 'The error is $\frac12 - \frac13 = \frac16$. The bound $\frac{K(b-a)^3}{12n^2}$ with $K = 2$, $b - a = 1$ and $n = 1$ is also $\frac{2}{12} = \frac16$, so for a parabola the bound is the error itself.'
        exemplars:
          - problem: 'For $\int_0^2 x^3\,dx$ we have $f''''(x) = 6x$, so $K = \max_{[0,2]}|f''''| = 12$. Compute the trapezoid error bound $\frac{K(b-a)^3}{12n^2}$ for $n = 4$.'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $b - a = 2$, so the bound is $\frac{12 \cdot 8}{12 \cdot 16} = \frac{1}{2}$. The true error is smaller, because the bound is a guarantee and not a prediction.'
          - problem: 'For the same integral $\int_0^2 x^3\,dx$ with $K = 12$, compute the midpoint error bound $\frac{K(b-a)^3}{24n^2}$ for $n = 4$.'
            answer: '1/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bound is $\frac{12 \cdot 8}{24 \cdot 16} = \frac{1}{4}$. This is half of the trapezoid bound, because the denominator has $24$ in place of $12$.'
          - problem: 'Doubling $n$ divides the trapezoid error bound by what factor?'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bound is proportional to $\frac{1}{n^2}$. Doubling $n$ divides it by $2^2 = 4$.'
          - problem: 'An engineer uses the trapezoid rule with $n = 10$, and the error bound for the estimate is $0.09$. What error bound does the same formula give for the same integral with $n = 30$?'
            answer: '0.01'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The bound is proportional to $\frac{1}{n^2}$. Tripling $n$ divides the bound by $3^2 = 9$, so the new bound is $\frac{0.09}{9} = 0.01$.'
          - problem: 'Find the trapezoid error bound $\frac{K(b-a)^3}{12n^2}$ for $\int_1^2 \frac{1}{x}\,dx$ with $n = 5$, where $K$ is the maximum of $|f''''(x)|$ on $[1,2]$.'
            answer: '1/150'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $f''''(x) = \frac{2}{x^3}$ is decreasing on $[1,2]$, so $K = 2$ at $x = 1$. The bound is $\frac{2 \cdot 1}{12 \cdot 25} = \frac{2}{300} = \frac{1}{150}$.'
          - problem: 'For $\int_0^1 x^4\,dx$ we have $f''''(x) = 12x^2$, so $K = 12$ on $[0,1]$. Compute the midpoint error bound $\frac{K(b-a)^3}{24n^2}$ for $n = 2$.'
            answer: '1/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $b - a = 1$, so the bound is $\frac{12 \cdot 1}{24 \cdot 4} = \frac{12}{96} = \frac{1}{8}$.'
          - problem: 'Water flows into a tank at the rate $r(t) = t^2$ litres per minute for $0 \le t \le 3$. The trapezoid rule with $n = 6$ estimates the total volume $\int_0^3 r(t)\,dt$. Find the error bound $\frac{K(b-a)^3}{12n^2}$ in litres.'
            answer: '0.125'
            answer_contract: {"kind": "unit", "quantity": "volume", "unit": "L", "allow_omitted": true}
            solution_sketch: 'Here $r''''(t) = 2$, so $K = 2$ and $b - a = 3$. The bound is $\frac{2 \cdot 27}{12 \cdot 36} = \frac{54}{432} = \frac{1}{8} = 0.125$ litre.'
          - problem: 'Consider $\int_0^4 x^2\,dx$, where $f''''(x) = 2$. Compute the trapezoid error bound $\frac{K(b-a)^3}{12n^2}$ for $n = 4$, with $K = \max|f''''|$ on $[0,4]$.'
            answer: '2/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $K = 2$ and $b - a = 4$. The bound is $\frac{2 \cdot 64}{12 \cdot 16} = \frac{128}{192} = \frac{2}{3}$.'
          - problem: 'A train''s speed is $v(t) = \frac{1}{t}$ metres per second for $1 \le t \le 3$ seconds. The midpoint rule with $n = 4$ estimates the distance the train travels. Find the error bound $\frac{K(b-a)^3}{24n^2}$ in metres, where $K$ is the maximum of $|v''''(t)|$ on $[1,3]$.'
            answer: '1/24'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Here $v''(t) = -\frac{1}{t^2}$ and $v''''(t) = \frac{2}{t^3}$, which is decreasing on $[1,3]$, so $K = 2$ at $t = 1$. With $b - a = 2$ the bound is $\frac{2 \cdot 8}{24 \cdot 16} = \frac{16}{384} = \frac{1}{24}$ metre.'
          - problem: 'Sam finds the midpoint error bound for $\int_0^3 x^2\,dx$ with $n = 6$, where $K = 2$, and writes $\frac{2 \cdot 27}{12 \cdot 36} = \frac18$. What is the correct midpoint error bound?'
            answer: '1/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Sam used the trapezoid denominator $12n^2$. The midpoint bound has $24n^2$, so it is $\frac{2 \cdot 27}{24 \cdot 36} = \frac{54}{864} = \frac{1}{16}$.'
        constraints: "K supplied, or f'''' monotone so its max sits at an endpoint; (b - a) and n chosen so bounds are simple fractions; formulas printed in the stem until the anki cards stick"
      - id: kp2
        name: The Simpson error bound
        key_prerequisites: [simpsons-rule, higher-order-derivatives]
        exemplars:
          - problem: 'For $\int_1^2 \frac{1}{x}\,dx$, $f^{(4)}(x) = \frac{24}{x^5}$ has maximum $K = 24$ at $x = 1$. Compute the Simpson error bound $\frac{K(b-a)^5}{180n^4}$ for $n = 4$.'
            answer: '1/1920'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $b - a = 1$, so the bound is $\frac{24 \cdot 1}{180 \cdot 256} = \frac{24}{46080} = \frac{1}{1920}$. With only $4$ subintervals the estimate is already good to three decimals.'
          - problem: 'For $f(x) = x^3$ on $[0,2]$, find $K = \max |f^{(4)}(x)|$, the constant in the Simpson error bound.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The fourth derivative of a cubic is $0$, so $K = 0$ and the Simpson error bound is $0$. This is the exactness of Simpson''s rule through degree $3$.'
          - problem: 'The Simpson error bound is proportional to $\frac{1}{n^4}$. Doubling $n$ divides the bound by what factor?'
            answer: '16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Doubling $n$ multiplies $n^4$ by $2^4 = 16$, so the bound is divided by $16$. This is why Simpson''s rule wins over the trapezoid rule at the same number of subintervals.'
          - problem: 'A Simpson estimate with $n = 4$ has the error bound $0.0032$. What error bound does the same formula give for the same integral with $n = 8$?'
            answer: '0.0002'
