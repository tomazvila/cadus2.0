          - problem: 'Sam needs the Simpson bound $\frac{24}{180n^4}$ for an integral on $[0,1]$ to be at most $0.0001$. He finds $n^4 \ge 1333.3$, so $n \ge 6.04$, and rounds to $n = 6$. What is the smallest even $n$ that works?'
            answer: '8'
