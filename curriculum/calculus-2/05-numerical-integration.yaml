          - problem: 'Sam finds the Simpson error bound for $\int_0^1 x^5\,dx$ with $n = 2$, where $f^{(4)}(x) = 120x$ and $K = 120$, and writes $\frac{120 \cdot 1}{180 \cdot 2} = \frac13$. What is the correct bound?'
