          - problem: 'A rod lies along $1 \le x \le 2$ metres and has the density $\rho(x) = \frac{1}{x}$ kilograms per metre. Simpson''s rule with $n = 2$ estimates its mass. Find the error bound $\frac{K(b-a)^5}{180n^4}$ in kilograms, where $K$ is the maximum of $|\rho^{(4)}(x)|$ on $[1,2]$.'
