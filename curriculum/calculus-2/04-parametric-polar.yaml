unit: parametric-polar
course: calculus-2
module: "Parametric & Polar Calculus"
topics:
  - id: parametric-curves-basics
    name: Parametric Curves and Eliminating the Parameter
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: function-notation
        weight: 0.6
        key: true
      - id: pythagorean-identity
        weight: 0.6
        key: true
      # kp3 asks the learner to NAME the eliminated curve ("an ellipse"), which
      # needs the standard form. Conceptual familiarity only - the topic never
      # works with foci or eccentricity - so weight 0 per Math Academy Way p.368.
      - id: ellipses
        weight: 0.0
        key: false
      - id: unit-circle
        weight: 0.5
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Evaluating and plotting parametric points
        key_prerequisites: [function-notation, coordinate-plane]
        exemplars:
          - problem: "For x = t^3 - 2t and y = t^2 + 3, find the point at t = -1 as (x, y)."
            answer: "(1, 4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: x = t^3 - 2t and y = t^2 + 3. Rule: substitute t = -1 into each coordinate. x = (-1)^3 - 2(-1) = -1 + 2 = 1. y = (-1)^2 + 3 = 1 + 3 = 4. The point is (1, 4)."
          - problem: "For x = 2t^3 - t and y = t^2 - 4t, give the point at t = 3 as (x, y)."
            answer: "(51, -3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Full object: x = 2t^3 - t and y = t^2 - 4t. Rule: substitute t = 3 into each coordinate. x = 2(3)^3 - 3 = 54 - 3 = 51. y = 3^2 - 4(3) = 9 - 12 = -3. The point is (51, -3)."
          - problem: 'For $x = t^2 - 1$, $y = t^3$, find the point at $t = 2$.'
            answer: '$(3, 8)$'
            solution_sketch: 'Plug in: $x = 4 - 1$, $y = 8$.'
          - problem: 'For $x = 2t$, $y = t^2 - 1$, list the points at $t = -1, 0, 1, 2$.'
            answer: '$(-2, 0), (0, -1), (2, 0), (4, 3)$'
            solution_sketch: 'Substitute each $t$ into both coordinates.'
          - problem: "For x = t^3 - 3t^2 + 1 and y = 2t - 5, find x at t = 2."
            answer: "-3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: x = t^3 - 3t^2 + 1. Rule: substitute t = 2 into the x-coordinate. x = 2^3 - 3(2)^2 + 1 = 8 - 12 + 1. This equals -3. The x-coordinate is -3."
          - problem: "For x = t^2 - 2 and y = 3t + 1, the point (7, 10) lies on the curve. What value of t gives the point (7, 10)?"
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Full object: x = t^2 - 2, y = 3t + 1, and point (7, 10). Rule: substitute the coordinates into the parametric equations. From y = 3t + 1 = 10, t = 3. Check: x = 3^2 - 2 = 7. The value is 3."
        constraints: "t-values are small integers; polynomial coordinate functions of degree <= 3"
      - id: kp2
        name: Eliminating the parameter
        key_prerequisites: [function-notation]
        exemplars:
          - problem: 'Eliminate the parameter: $x = t + 1$, $y = t^2$.'
            answer: '$y = (x - 1)^2$'
            solution_sketch: '$t = x - 1$; substitute into $y = t^2$.'
          - problem: "A curve is given by x = sqrt(t) and y = 4t - 5 for t >= 0, so x >= 0. Eliminate the parameter. Give y as a function of x."
            answer: "4x^2-5"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: solve x = sqrt(t) for t. Since t >= 0, squaring gives t = x^2 and x >= 0. Step 2: substitute t = x^2 into y = 4t - 5 to get y = 4x^2 - 5. The answer is 4x^2-5."
          - problem: 'Eliminate the parameter: $x = t - 2$, $y = 3t + 1$.'
            answer: '$y = 3x + 7$'
            solution_sketch: '$t = x + 2$; substitute: $y = 3(x + 2) + 1$.'
          - problem: "A curve is given by x = 2t + 1 and y = 5t - 3. Eliminate the parameter. Give y as a function of x."
            answer: "(5x-11)/2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: solve the linear equation x = 2t + 1 for t, giving t = (x - 1)/2. Step 2: substitute this into y = 5t - 3 to get y = 5((x - 1)/2) - 3 = (5x - 11)/2. The answer is (5x-11)/2."
          - problem: "A curve is given by x = t - 1 and y = t^3. Eliminate the parameter. Give y as a function of x."
            answer: "(x+1)^3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: solve x = t - 1 for t, giving t = x + 1. Step 2: substitute into y = t^3 to get y = (x + 1)^3. The answer is (x+1)^3."
          - problem: "A particle moves so that x = t + 3 and y = t^2 - 2t. Eliminate the parameter to find the path equation. Give y as a function of x."
            answer: "x^2-8x+15"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: solve x = t + 3 for t, giving t = x - 3. Step 2: substitute into y = t^2 - 2t to get y = (x - 3)^2 - 2(x - 3). Step 3: expand and simplify to y = x^2 - 6x + 9 - 2x + 6 = x^2 - 8x + 15. The answer is x^2-8x+15."
        constraints: "parameter eliminable by a direct solve; note domain restrictions from radicals"
      - id: kp3
        name: Trigonometric parametrizations
        key_prerequisites: [unit-circle, pythagorean-identity]
        exemplars:
          - problem: "Eliminate the parameter from $x = 5\\cos t$, $y = 5\\sin t$. The Cartesian equation is $x^2 + y^2 = R^2$ for a positive number $R$. Find $R^2$."
            answer: "25"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Square each coordinate: $x^2 = 25\\cos^2 t$ and $y^2 = 25\\sin^2 t$. Add them and use the Pythagorean identity $\\cos^2 t + \\sin^2 t = 1$ to get $x^2 + y^2 = 25$. Thus $R^2 = 25$."
          - problem: "Eliminate the parameter from $x = 5\\cos t$, $y = 3\\sin t$. The Cartesian equation has the form $x^2/A + y^2/B = 1$ with positive integers $A$ and $B$. Give $A$ and $B$."
            answer: "A = 25; B = 9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "A"}, {"contract": {"kind": "exact"}, "name": "B"}]}
            solution_sketch: "Divide by the coefficients first: $x/5 = \\cos t$ and $y/3 = \\sin t$. Square and add, then use the Pythagorean identity $\\cos^2 t + \\sin^2 t = 1$ to reach $x^2/25 + y^2/9 = 1$. Matching the form $x^2/A + y^2/B = 1$ gives A = 25; B = 9."
          - problem: "Eliminate the parameter from $x = 4\\cos t + 1$, $y = 4\\sin t - 3$. The resulting curve is a circle. Give its center as (h, k)."
            answer: "(1, -3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Write the shifted coordinates as $x - 1 = 4\\cos t$ and $y + 3 = 4\\sin t$. Square and add, then use the Pythagorean identity $\\cos^2 t + \\sin^2 t = 1$ to get $(x - 1)^2 + (y + 3)^2 = 16$. The circle has center (1, -3)."
          - problem: "Eliminate the parameter from $x = 2\\cos t$, $y = 7\\sin t$. The resulting ellipse has standard form $x^2/A + y^2/B = 1$ with $A < B$. Find $B$."
            answer: "49"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Divide by the coefficients first: $x/2 = \\cos t$ and $y/7 = \\sin t$. Squaring and adding with the Pythagorean identity gives $x^2/4 + y^2/49 = 1$. Since $A < B$, the larger denominator is $B = 49$."
          - problem: "Eliminate the parameter from $x = 6\\cos t$, $y = 6\\sin t$. Select the conic type and give its horizontal semi-axis."
            answer: "verdict = circle; R = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["circle"], ["ellipse"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "R"}]}
            solution_sketch: "Squaring and adding gives $x^2 + y^2 = 36(\\cos^2 t + \\sin^2 t)$. The Pythagorean identity makes the right side 1, so the conic is a circle of radius 6. The label circle is correct; choosing ellipse would ignore the equal coefficients of cos t and sin t. Thus verdict = circle; R = 6."
          - problem: "Eliminate the parameter from $x = 3\\cos t$, $y = 8\\sin t$. The resulting ellipse has semi-axes $a$ and $b$. Find the sum $a + b$."
            answer: "11"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Divide by the coefficients first: $x/3 = \\cos t$ and $y/8 = \\sin t$. Squaring and adding with the Pythagorean identity gives $x^2/9 + y^2/64 = 1$. The semi-axes are $a = 3$ and $b = 8$, so the sum is $a + b = 11$."
        constraints: "use the Pythagorean identity; radii and semi-axes are small integers"
    diagnostic_exemplar:
      problem: 'Eliminate the parameter: $x = 4\cos t$, $y = 3\sin t$. What curve is it, and what point corresponds to $t = \frac{\pi}{2}$?'
      answer: '$\frac{x^2}{16} + \frac{y^2}{9} = 1$, an ellipse; at $t = \frac{\pi}{2}$ the point is $(0, 3)$'
      answer_contract: {kind: none}
      solution_sketch: 'Use $\cos^2t + \sin^2t = 1$ with $\cos t = x/4$ and $\sin t = y/3$.'
    anki_seeds:
      - front: "Standard parametrization of a circle of radius a centered at the origin?"
        back: '$x = a\cos t$, $y = a\sin t$, $0 \le t \le 2\pi$'
        type: basic
      - front: "When eliminating a parameter with a square root (x = sqrt t), the resulting equation needs..."
        back: "a domain restriction (only part of the curve is traced)"
        type: basic

  - id: parametric-derivatives
    name: Derivatives of Parametric Curves
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: parametric-curves-basics
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Slopes of parametric curves
        key_prerequisites: [parametric-curves-basics, chain-rule, derivatives-trig]
        exemplars:
          - problem: 'For $x = t^2$, $y = t^3$, find $\frac{dy}{dx}$ at $t = 1$.'
            answer: '$3/2$'
            solution_sketch: '$\frac{dy}{dx} = \frac{dy/dt}{dx/dt} = \frac{3t^2}{2t} = \frac{3t}{2}$; at $t = 1$: $\frac{3}{2}$.'
          - problem: 'For $x = \cos t$, $y = \sin t$, find $\frac{dy}{dx}$ at $t = \frac{\pi}{4}$.'
            answer: '$-1$'
            solution_sketch: '$\frac{dy}{dx} = \frac{\cos t}{-\sin t} = -\cot t$; at $t = \frac{\pi}{4}$: $-1$.'
          - problem: "For $x = t^3$ and $y = t^2$, find $\\frac{dy}{dx}$ at $t = 2$."
            answer: "1/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The curve is x = t^3, y = t^2. First, dx/dt = 3t^2 and dy/dt = 2t by the power rule. Next, dy/dx = (dy/dt)/(dx/dt) = 2t/(3t^2) = 2/(3t) by the parametric slope rule. At t = 2, the slope is 2/(3*2) = 1/3. The slope is 1/3."
          - problem: "For $x = \\sin t$ and $y = \\cos t$, find $\\frac{dy}{dx}$ at $t = \\frac{\\pi}{3}$."
            answer: "-sqrt(3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The curve is x = sin t, y = cos t. First, dx/dt = cos t and dy/dt = -sin t by the trig derivative rule. Next, dy/dx = (dy/dt)/(dx/dt) = -sin t/cos t = -tan t by the parametric slope rule. At t = pi/3, the slope is -tan(pi/3) = -sqrt(3). The slope is -sqrt(3)."
          - problem: "For $x = t^2 + 3t$ and $y = t^3$, find $\\frac{dy}{dx}$ at $t = 1$."
            answer: "3/5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The curve is x = t^2 + 3t, y = t^3. First, dx/dt = 2t + 3 and dy/dt = 3t^2 by the power rule. Next, dy/dx = (dy/dt)/(dx/dt) = 3t^2/(2t + 3) by the parametric slope rule. At t = 1, the slope is 3*1^2/(2*1 + 3) = 3/5. The slope is 3/5."
          - problem: "A particle moves with $x = t^2$ and $y = t^5$. Find the slope $\\frac{dy}{dx}$ of its path at $t = -1$."
            answer: "-5/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The path is x = t^2, y = t^5. First, dx/dt = 2t and dy/dt = 5t^4 by the power rule. Next, dy/dx = (dy/dt)/(dx/dt) = 5t^4/(2t) = (5/2)t^3 by the parametric slope rule. At t = -1, the slope is (5/2)*(-1)^3 = -5/2. The slope is -5/2."
        constraints: "dy/dt and dx/dt polynomial or single trig; evaluation points are small integers or special angles"
      - id: kp2
        name: Tangent lines and horizontal tangents
        key_prerequisites: [parametric-curves-basics, chain-rule]
        exemplars:
          - problem: "For the parametric curve x = t^2 + 1, y = t^3 - 2, find the equation of the tangent line at t = 2 as a function of x."
            answer: "3x - 9"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: Use the parametric derivative rule and chain rule: dx/dt = 2t and dy/dt = 3t^2, so dy/dx = (3t^2)/(2t) = 3t/2. Step 2: At t = 2 the point is (5, 6) and the slope is 3. Step 3: Point-slope gives y = 3(x - 5) + 6, which simplifies to 3x - 9. The tangent line is 3x - 9."
          - problem: "For the parametric curve x = t^2 + 1, y = t^3 - 12t, find all points where the curve has a horizontal tangent. Give the two points as (x, y) pairs called P1 and P2, with the negative y-coordinate first."
            answer: "P1 = (5, -16); P2 = (5, 16)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "P1"}, {"contract": {"arity": 2, "kind": "coordinates"}, "name": "P2"}]}
            solution_sketch: "Step 1: A horizontal tangent requires dy/dt = 3t^2 - 12 = 3(t^2 - 4) = 0, so t = 2 or t = -2. Step 2: dx/dt = 2t is nonzero at both, so both give horizontal tangents. Step 3: At t = -2 the point is (5, -16); at t = 2 the point is (5, 16). The points are P1 = (5, -16) and P2 = (5, 16)."
          - problem: "For the parametric curve x = t^2, y = t^3 + 1, find the equation of the tangent line at t = -1 as a function of x."
            answer: "-3x/2 + 3/2"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: Use the parametric derivative rule and chain rule: dx/dt = 2t and dy/dt = 3t^2, so dy/dx = (3t^2)/(2t) = 3t/2. Step 2: At t = -1 the point is (1, 0) and the slope is -3/2. Step 3: Point-slope gives y = (-3/2)(x - 1), which simplifies to -3x/2 + 3/2. The tangent line is -3x/2 + 3/2."
          - problem: "For the parametric curve x = cos(t), y = sin(t), find the point with 0 < t < pi where the curve has a horizontal tangent. Give the answer as (x, y)."
            answer: "(0, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: A horizontal tangent requires dy/dt = 0 and dx/dt != 0. Step 2: Here dy/dt = cos(t), so t = pi/2 in the interval 0 < t < pi. Step 3: dx/dt = -sin(t) is nonzero there, and the point is (cos(pi/2), sin(pi/2)) = (0, 1). The point is (0, 1)."
          - problem: "For the parametric curve x = t^2, y = sin(t), find the point with 0 < t < pi where the curve has a horizontal tangent. Give the answer as (x, y)."
            answer: "(pi^2/4, 1)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1: A horizontal tangent requires dy/dt = cos(t) = 0 and dx/dt = 2t != 0. Step 2: In 0 < t < pi, cos(t) = 0 at t = pi/2. Step 3: Then x = (pi/2)^2 = pi^2/4 and y = sin(pi/2) = 1. The point is (pi^2/4, 1)."
          - problem: "For the parametric curve x = t^3, y = t^2 + 3t, find the equation of the tangent line at t = 1 as a function of x."
            answer: "5x/3 + 7/3"
            answer_contract: {"kind": "function", "vars": ["x"]}
            solution_sketch: "Step 1: Use the parametric derivative rule and chain rule: dx/dt = 3t^2 and dy/dt = 2t + 3, so dy/dx = (2t + 3)/(3t^2). Step 2: At t = 1 the point is (1, 4) and the slope is 5/3. Step 3: Point-slope gives y = (5/3)(x - 1) + 4, which simplifies to 5x/3 + 7/3. The tangent line is 5x/3 + 7/3."
        constraints: "horizontal tangents where dy/dt = 0 with dx/dt != 0; answers as points and line equations"
      - id: kp3
        name: Second derivatives and concavity
        key_prerequisites: [chain-rule]
        exemplars:
          - problem: 'For $x = t^2$, $y = t^3$, find $\frac{d^2y}{dx^2}$ as a function of $t$.'
            answer: '$\frac{3}{4t}$'
            solution_sketch: '$\frac{dy}{dx} = \frac{3t}{2}$; then $\frac{d^2y}{dx^2} = \frac{d(dy/dx)/dt}{dx/dt} = \frac{3/2}{2t} = \frac{3}{4t}$.'
          - problem: 'For $x = t^2$, $y = t^3$, on which $t$-interval is the curve concave up?'
            answer: '$t > 0$'
            solution_sketch: '$\frac{d^2y}{dx^2} = \frac{3}{4t} > 0$ exactly when $t > 0$.'
          - problem: "For x = t^3, y = t^4, find d^2y/dx^2 as a function of t."
            answer: "4/(9t^2)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Use x'(t) = 3t^2 and y'(t) = 4t^3. The first parametric derivative is dy/dx = (4t^3)/(3t^2) = 4t/3. Differentiate 4t/3 with respect to t to get 4/3, then divide by dx/dt = 3t^2. This gives d^2y/dx^2 = 4/(9t^2)."
          - problem: "For x = t^2, y = t^4 + t^3, find d^2y/dx^2 as a function of t."
            answer: "2+3/(4t)"
            answer_contract: {"kind": "function", "vars": ["t"]}
            solution_sketch: "Use x'(t) = 2t and y'(t) = 4t^3 + 3t^2. The first derivative is dy/dx = (4t^3 + 3t^2)/(2t) = 2t^2 + (3/2)t. Differentiate with respect to t to get 4t + 3/2. Divide by dx/dt = 2t, so d^2y/dx^2 = 2+3/(4t)."
          - problem: "For x = t^3, y = t^4, find the t-inequality for the intervals where the curve is concave up. Give the answer as an inequality in t."
            answer: "t < 0 or t > 0"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "Compute x'(t) = 3t^2 and y'(t) = 4t^3. The first parametric derivative is dy/dx = 4t/3. Differentiate and divide by dx/dt to get d^2y/dx^2 = 4/(9t^2). Since 4/(9t^2) is positive for every t except 0, the curve is concave up on both sides of the excluded point. The inequality is t < 0 or t > 0."
          - problem: "For x = t^3, y = t^2, find d^2y/dx^2 at t = 1 and state the concavity there. Give the verdict and the value."
            answer: "verdict = down; value = -2/9"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["up"], ["down"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "value"}]}
            solution_sketch: "Compute x'(t) = 3t^2 and y'(t) = 2t. The first derivative is dy/dx = 2/(3t). Differentiate 2/(3t) to get -2/(3t^2), then divide by dx/dt = 3t^2, so d^2y/dx^2 = -2/(9t^4). At t = 1 this value is -2/9. Because the second derivative is negative, the concavity is down; choosing up would ignore the sign of the second derivative. The result is verdict = down; value = -2/9."
        constraints: "second derivative via d(dy/dx)/dt divided by dx/dt; polynomial parametrizations only"
    diagnostic_exemplar:
      problem: 'For $x = t^2$, $y = t^3 - 3t$, find $\frac{d^2y}{dx^2}$ as a function of $t$, and say whether the curve is concave up at $t = 2$.'
      answer: '$\frac{d^2y}{dx^2} = \frac{3t^2 + 3}{4t^3}$, which is $\frac{15}{32}$ at $t = 2$; positive, so the curve is concave up there'
      answer_contract: {kind: none}
      solution_sketch: '$\frac{dy}{dx} = \frac{3t^2 - 3}{2t}$; differentiate that in $t$ and divide by $\frac{dx}{dt} = 2t$.'
    anki_seeds:
      - front: "Slope of a parametric curve (x(t), y(t))?"
        back: '$\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$ (where $dx/dt \neq 0$)'
        type: basic
      - front: "Second derivative of a parametric curve?"
        back: '$\frac{d^2y}{dx^2} = \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{dx/dt}$'
        type: basic

  - id: parametric-equations
    name: Parametric Equations and Their Calculus
    core: true
    difficulty: 0.63
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: parametric-derivatives
        weight: 0.8
        key: true
      - id: arc-length
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Parametric arc length
        key_prerequisites: [parametric-derivatives, arc-length]
        exemplars:
          - problem: 'Find the length of the curve $x = 3t^2$, $y = 2t^3$ for $0 \le t \le 1$.'
            answer: '$4\sqrt{2} - 2$'
            solution_sketch: '$\sqrt{(6t)^2 + (6t^2)^2} = 6t\sqrt{1 + t^2}$; $\int_0^1 6t\sqrt{1+t^2}\,dt = 2\left[(1+t^2)^{3/2}\right]_0^1 = 2(2\sqrt{2} - 1)$.'
          - problem: 'Verify by the parametric arc length formula that $x = \cos t$, $y = \sin t$, $0 \le t \le 2\pi$, has length $2\pi$.'
            answer: '$2\pi$'
            solution_sketch: '$\sqrt{\sin^2 t + \cos^2 t} = 1$; $\int_0^{2\pi} 1\,dt = 2\pi$.'
          - problem: "A particle moves along the parametric curve $x = 1 + 3t$, $y = 2 + 4t$ for $0 \\le t \\le 3$. Find the length of the curve."
            answer: "15"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Here $x'(t) = 3$ and $y'(t) = 4$. The speed is $\\sqrt{3^2 + 4^2} = 5$. By the parametric arc length formula, $L = \\int_0^3 5\\,dt = 15$. The length is 15."
          - problem: "The curve is given by $x = t^2$, $y = t^3$ for $0 \\le t \\le 1$. Find its length."
            answer: "(13sqrt(13)-8)/27"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Here $x'(t) = 2t$ and $y'(t) = 3t^2$. The speed is $\\sqrt{4t^2 + 9t^4} = t\\sqrt{4 + 9t^2}$ for $t \\ge 0$. By the parametric arc length formula, $L = \\int_0^1 t\\sqrt{4 + 9t^2}\\,dt$. Substitute $u = 4 + 9t^2$, $du = 18t\\,dt$, so $L = \\frac{1}{18}\\int_4^{13} u^{1/2}\\,du = \\frac{1}{27}(13\\sqrt{13} - 8)$. The length is (13sqrt(13)-8)/27."
          - problem: "A cycloid arch is $x = t - \\sin t$, $y = 1 - \\cos t$ for $0 \\le t \\le 2\\pi$. Find the length of one arch."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Here $x'(t) = 1 - \\cos t$ and $y'(t) = \\sin t$. The speed squared is $(1 - \\cos t)^2 + \\sin^2 t = 2 - 2\\cos t = 4\\sin^2(t/2)$, so the speed is $2\\sin(t/2)$ on $[0, 2\\pi]$. By the parametric arc length formula, $L = \\int_0^{2\\pi} 2\\sin(t/2)\\,dt$. With $u = t/2$, this is $4\\int_0^{\\pi} \\sin u\\,du = 8$. The length is 8."
          - problem: "The circle is parametrized by $x = 3\\cos t$, $y = 3\\sin t$ for $0 \\le t \\le 2\\pi$. Find the length of the curve."
            answer: "6pi"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Here $x'(t) = -3\\sin t$ and $y'(t) = 3\\cos t$. The speed is $\\sqrt{9\\sin^2 t + 9\\cos^2 t} = 3$. By the parametric arc length formula, $L = \\int_0^{2\\pi} 3\\,dt = 6\\pi$. The length is 6pi."
        constraints: "speed sqrt((dx/dt)^2 + (dy/dt)^2) must simplify to a perfect square or fall to one u-substitution"
      - id: kp2
        name: Speed along a curve
        key_prerequisites: [parametric-derivatives]
        exemplars:
          - problem: 'Find the speed of $x = t^2$, $y = t^3$ at $t = 1$.'
            answer: '$\sqrt{13}$'
            solution_sketch: '$\sqrt{(2t)^2 + (3t^2)^2}\big|_{t=1} = \sqrt{4 + 9}$.'
          - problem: "A particle moves along x = 3t, y = 4t. Find its speed."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For x = 3t and y = 4t, the derivatives are dx/dt = 3 and dy/dt = 4. The parametric speed formula gives sqrt(3^2 + 4^2) = sqrt(25) = 5. The speed is 5."
          - problem: "A particle moves along x = 3t^2, y = 4t^2. Find its speed at t = 2."
            answer: "20"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For x = 3t^2 and y = 4t^2, the power rule gives dx/dt = 6t and dy/dt = 8t. The parametric speed formula at t = 2 gives sqrt(12^2 + 16^2) = sqrt(400) = 20. The speed at t = 2 is 20."
          - problem: "A particle moves along x = 5t, y = 12t for 0 <= t <= 3. Find the distance traveled."
            answer: "39"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For x = 5t and y = 12t, the derivatives are dx/dt = 5 and dy/dt = 12. The speed formula gives sqrt(5^2 + 12^2) = 13, which is constant. The distance is speed times time, so 13 * 3 = 39, and the distance traveled is 39."
          - problem: "A particle moves along x = 2cos(t), y = 2sin(t). Find its speed at t = pi/4."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For x = 2cos(t) and y = 2sin(t), the derivatives are dx/dt = -2sin(t) and dy/dt = 2cos(t). The speed formula at t = pi/4 gives sqrt((-sqrt(2))^2 + (sqrt(2))^2) = sqrt(4) = 2. The speed is 2."
          - problem: "A particle moves along x = e^t, y = e^(-t). Find its speed at t = 0."
            answer: "sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For x = e^t and y = e^(-t), the derivatives are dx/dt = e^t and dy/dt = -e^(-t). The speed formula at t = 0 gives sqrt(1^2 + (-1)^2) = sqrt(2). The speed is sqrt(2)."
        constraints: "speed at a point or constant-speed distance; radicands are clean integers"
      - id: kp3
        name: "Capstone: length and area for parametric curves"
        key_prerequisites: [parametric-derivatives, arc-length, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the length of $x = e^t \cos t$, $y = e^t \sin t$ for $0 \le t \le \ln 2$.'
            answer: '$\sqrt{2}$'
            solution_sketch: '$\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2 = 2e^{2t}$, so the speed is $\sqrt{2}\,e^t$; $\int_0^{\ln 2} \sqrt{2}\,e^t\,dt = \sqrt{2}(2 - 1) = \sqrt{2}$.'
          - problem: 'Find the area under the curve $x = t^2$, $y = t$ for $0 \le t \le 2$ (i.e. $\int y\,dx$).'
            answer: '$16/3$'
            solution_sketch: '$\int y\,dx = \int_0^2 t \cdot 2t\,dt = \frac{2 \cdot 8}{3}$.'
          - problem: "Find the length of $x = e^{3t/4}\\cos t$, $y = e^{3t/4}\\sin t$ for $0 \\le t \\le \\frac{4}{3}\\ln 3$."
            answer: "10/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (parametric speed identity): for the curve x = e^(3t/4) cos t, y = e^(3t/4) sin t, differentiate to get dx/dt = e^(3t/4)((3/4)cos t - sin t) and dy/dt = e^(3t/4)((3/4)sin t + cos t). Then (dx/dt)^2 + (dy/dt)^2 = (9/16 + 1)e^(3t/2) = (25/16)e^(3t/2), so the speed is (5/4)e^(3t/4). Step 2 (arc length formula): L = integral from 0 to (4/3)ln 3 of (5/4)e^(3t/4) dt = (5/4)(4/3)(e^(ln 3) - 1) = (5/3)(3 - 1) = 10/3. The length is 10/3."
          - problem: "Find the area under the curve $x = t^3$, $y = t$ for $0 \\le t \\le 2$, using area = $\\int y\\,dx$."
            answer: "12"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (parametric area formula): A = integral of y dx = integral of y(t) x'(t) dt. For x = t^3 and y = t, the derivative is x'(t) = 3t^2, so the integrand is t * 3t^2 = 3t^3. Step 2 (FTC): A = integral from 0 to 2 of 3t^3 dt = 3t^4/4 evaluated from 0 to 2 = 3*16/4 = 12. The area is 12."
          - problem: "A curve is given by $x = 3t^2$, $y = t + 1$ for $0 \\le t \\le 2$. Find the area under the curve, using area = $\\int y\\,dx$."
            answer: "28"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (parametric area formula): A = integral of y(t) x'(t) dt. For x = 3t^2 and y = t + 1, the derivative is x'(t) = 6t, so the integrand is (t + 1)*6t = 6t^2 + 6t. Step 2 (FTC): A = integral from 0 to 2 of (6t^2 + 6t) dt = 2t^3 + 3t^2 evaluated from 0 to 2 = 16 + 12 = 28. The area is 28."
          - problem: "The area under the curve $x = t^2$, $y = kt$ for $0 \\le t \\le 3$, computed as $\\int y\\,dx$, equals $54$. Find the value of $k$."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (parametric area formula): A = integral of y(t) x'(t) dt. For x = t^2 and y = kt, the derivative is x'(t) = 2t, so A = integral from 0 to 3 of kt*2t dt = 2k * t^3/3 evaluated from 0 to 3 = 18k. Step 2 (solve the linear equation): set 18k = 54, so k = 54/18 = 3. The value of k is 3."
        constraints: "exponential-trig spirals with perfect-square speed; area via int y(t) x'(t) dt with polynomial integrand"
    diagnostic_exemplar:
      problem: 'Find the length of the curve $x = 3t^2$, $y = 2t^3$ for $0 \le t \le 2$, and the speed at $t = 2$.'
      answer: 'length $2(5\sqrt{5} - 1)$; speed at $t = 2$ is $12\sqrt{5}$'
      answer_contract: {kind: none}
      solution_sketch: 'The speed is $\sqrt{36t^2 + 36t^4} = 6t\sqrt{1+t^2}$, so the length is $\left[2(1+t^2)^{3/2}\right]_0^2 = 2(5\sqrt5 - 1)$.'
    anki_seeds:
      - front: "Parametric arc length formula on [a, b]?"
        back: '$L = \int_a^b \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \, dt$'
        type: basic
      - front: "Speed of a particle on (x(t), y(t))?"
        back: '$\sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2}$ (the integrand of arc length)'
        type: basic

  - id: parametric-motion
    name: Parametric Motion
    core: false                # application of the parametric representation
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: parametric-equations
        weight: 0.7
        key: true
      - id: motion-along-a-line
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Velocity components and speed
        key_prerequisites: [parametric-equations, motion-along-a-line]
        exemplars:
          - problem: "A particle moves along x = t^3 - 6t, y = t^2 + t. Find its velocity components as (vx, vy) and its speed at t = 2."
            answer: "v = (6, 5); speed = sqrt(61)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "v"}, {"contract": {"kind": "exact"}, "name": "speed"}]}
            solution_sketch: "Differentiate each component by the power rule: x'(t) = 3t^2 - 6 and y'(t) = 2t + 1. At t = 2, x'(2) = 6 and y'(2) = 5. The speed is sqrt(6^2 + 5^2) = sqrt(61). So v = (6, 5); speed = sqrt(61)."
          - problem: "A particle moves along x = t^3 - 3t^2 + 1, y = t^2 - 4t + 5. Find the time at which the particle is at rest."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Differentiate by the power rule: x'(t) = 3t^2 - 6t = 3t(t - 2), and y'(t) = 2t - 4 = 2(t - 2). At rest both components must be zero, so solve 3t(t - 2) = 0 and 2(t - 2) = 0. The common solution is t = 2. So 2."
          - problem: "A particle moves so that x = t^2 + 3t and y = 2t^3 - t. Give its velocity vector at t = 1 as (x', y')."
            answer: "(5, 5)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Differentiate each component by the power rule: x'(t) = 2t + 3, and y'(t) = 6t^2 - 1. At t = 1, x'(1) = 5 and y'(1) = 5. So (5, 5)."
          - problem: "A particle moves along x = t^3 - 2t, y = t^2 + 4. Find its speed at t = 0."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Differentiate by the power rule: x'(t) = 3t^2 - 2, and y'(t) = 2t. At t = 0, x'(0) = -2 and y'(0) = 0. The speed is sqrt((-2)^2 + 0^2) = 2. So 2."
          - problem: "A particle moves along x = 4t - t^3, y = t^2 + 3t. Find its velocity vector as (vx, vy) and its speed at t = 2."
            answer: "v = (-8, 7); speed = sqrt(113)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"arity": 2, "kind": "coordinates"}, "name": "v"}, {"contract": {"kind": "exact"}, "name": "speed"}]}
            solution_sketch: "Differentiate by the power rule: x'(t) = 4 - 3t^2, and y'(t) = 2t + 3. At t = 2, x'(2) = -8 and y'(2) = 7. The speed is sqrt((-8)^2 + 7^2) = sqrt(113). So v = (-8, 7); speed = sqrt(113)."
          - problem: "A particle moves along x = t^3 - 3t^2 - 9t, y = t^2 - 6t. Find the time at which the particle is at rest."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Differentiate by the power rule: x'(t) = 3t^2 - 6t - 9 = 3(t - 3)(t + 1), and y'(t) = 2t - 6 = 2(t - 3). At rest both components must be zero, so solve 3(t - 3)(t + 1) = 0 and 2(t - 3) = 0. The common solution is t = 3. So 3."
        constraints: "polynomial components of degree <= 3; rest requires both derivatives to vanish together"
      - id: kp2
        name: Direction of motion
        key_prerequisites: [parametric-equations]
        exemplars:
          - problem: 'For $x = t^2 - 4t$, $y = t^3 - 3t$, when is the particle moving left?'
            answer: '$t < 2$'
            solution_sketch: 'Moving left means $x''(t) = 2t - 4 < 0$.'
          - problem: "For x = t^2 - 4t and y = t^3 - 3t, determine when the particle is moving up, and give the answer as an inequality in t."
            answer: "t < -1 or t > 1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full object is x = t^2 - 4t and y = t^3 - 3t. Step 1, vertical velocity rule: upward motion means y'(t) > 0. Step 2, power rule: y'(t) = 3t^2 - 3 = 3(t - 1)(t + 1). Step 3, sign analysis: 3(t - 1)(t + 1) > 0 for t < -1 or t > 1. The particle moves up for t < -1 or t > 1."
          - problem: "A particle has coordinates x = t^2 - 6t and y = t^2 - 2t; determine when the particle is moving right and upward, and give the answer as an inequality in t."
            answer: "t > 3"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full motion is x = t^2 - 6t and y = t^2 - 2t. Step 1, velocity sign rule: right and upward means x'(t) > 0 and y'(t) > 0. Step 2, power rule: x'(t) = 2t - 6 and y'(t) = 2t - 2. Step 3, solve both: x'(t) > 0 gives t > 3, and y'(t) > 0 gives t > 1. Step 4, intersection: both hold for t > 3. The particle moves right and upward for t > 3."
          - problem: "A particle follows x = t^3 - 3t^2 and y = t^2 - 5t; find when the particle is moving left and downward, and give the answer as an inequality in t."
            answer: "0 < t < 2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full motion is x = t^3 - 3t^2 and y = t^2 - 5t. Step 1, velocity sign rule: left and downward means x'(t) < 0 and y'(t) < 0. Step 2, power rule: x'(t) = 3t^2 - 6t = 3t(t - 2) and y'(t) = 2t - 5. Step 3, sign analysis: x'(t) < 0 on 0 < t < 2, and y'(t) < 0 on t < 5/2. Step 4, intersection: both hold on 0 < t < 2. The particle moves left and downward for 0 < t < 2."
          - problem: "A particle has position x = t^2 - 2t and y = t^3 - 3t; determine when the particle is moving left and upward, and give the answer as an inequality in t."
            answer: "t < -1"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full motion is x = t^2 - 2t and y = t^3 - 3t. Step 1, velocity sign rule: left and upward means x'(t) < 0 and y'(t) > 0. Step 2, power rule: x'(t) = 2t - 2 and y'(t) = 3t^2 - 3 = 3(t - 1)(t + 1). Step 3, solve x'(t) < 0 gives t < 1; y'(t) > 0 gives t < -1 or t > 1. Step 4, intersection: both hold for t < -1. The particle moves left and upward for t < -1."
          - problem: "A particle traces x = t^3 - 12t and y = t^2 - 4t; find when the particle is moving right and downward, and give the answer as an inequality in t."
            answer: "t < -2"
            answer_contract: {"kind": "inequality_union"}
            solution_sketch: "The full motion is x = t^3 - 12t and y = t^2 - 4t. Step 1, velocity sign rule: right and downward means x'(t) > 0 and y'(t) < 0. Step 2, power rule: x'(t) = 3t^2 - 12 = 3(t - 2)(t + 2) and y'(t) = 2t - 4. Step 3, sign analysis: x'(t) > 0 for t < -2 or t > 2; y'(t) < 0 for t < 2. Step 4, intersection: both hold for t < -2. The particle moves right and downward for t < -2."
        constraints: "sign analysis of x'(t) and y'(t); answers as t-intervals"
      - id: kp3
        name: Distance traveled vs. displacement
        key_prerequisites: [parametric-equations]
        exemplars:
          - problem: 'Find the distance traveled along $x = t^2$, $y = \frac{2}{3}t^3$ for $0 \le t \le 1$.'
            answer: '$\frac{2}{3}(2\sqrt{2} - 1)$'
            solution_sketch: 'Speed $= \sqrt{4t^2 + 4t^4} = 2t\sqrt{1 + t^2}$; $\int_0^1 2t\sqrt{1+t^2}\,dt = \frac{2}{3}\left[(1+t^2)^{3/2}\right]_0^1$.'
          - problem: "A particle moves along x = cos(t), y = sin(t) for 0 <= t <= pi/2. Report the two results under the names distance and displacement. Find the distance traveled and the magnitude of the displacement."
            answer: "distance = pi/2; displacement = sqrt(2)"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "distance"}, {"contract": {"kind": "exact"}, "name": "displacement"}]}
            solution_sketch: "Step 1: Differentiate with the derivatives of sine and cosine: dx/dt = -sin(t) and dy/dt = cos(t), so the speed is sqrt(sin(t)^2 + cos(t)^2) = 1 by the Pythagorean identity. Step 2: The distance traveled is the speed integral from 0 to pi/2, which equals pi/2. Step 3: The particle goes from (1, 0) to (0, 1), so the displacement magnitude is sqrt(1 + 1) = sqrt(2) by the distance formula. The answer is distance = pi/2; displacement = sqrt(2)."
          - problem: "A particle moves along x = t, y = (2/3)t^(3/2) for 0 <= t <= 3. Find the distance traveled."
            answer: "14/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Differentiate with the power rule: dx/dt = 1 and dy/dt = sqrt(t), so the speed is sqrt(1 + t). Step 2: The distance traveled is the speed integral of sqrt(1 + t) from 0 to 3. Step 3: Use the substitution u = 1 + t: the integral is (2/3)(1 + t)^(3/2) from 0 to 3, which is (2/3)(8 - 1) = 14/3. The distance traveled is 14/3."
          - problem: "A particle moves along x = t^2, y = (2/3)t^3 for 0 <= t <= 2. Report the two results under the names distance and displacement. Find the distance traveled and the magnitude of the displacement."
            answer: "distance = (2/3)(5sqrt(5) - 1); displacement = 20/3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "distance"}, {"contract": {"kind": "exact"}, "name": "displacement"}]}
            solution_sketch: "Step 1: Differentiate with the power rule: dx/dt = 2t and dy/dt = 2t^2, so the speed is sqrt(4t^2 + 4t^4) = 2t sqrt(1 + t^2). Step 2: In the speed integral from 0 to 2 substitute u = 1 + t^2: the distance is (2/3)(1 + t^2)^(3/2) from 0 to 2, which is (2/3)(5sqrt(5) - 1). Step 3: The endpoints are (0, 0) and (4, 16/3), so the displacement magnitude is sqrt(16 + 256/9) = 20/3 by the distance formula. The answer is distance = (2/3)(5sqrt(5) - 1); displacement = 20/3."
          - problem: "A particle moves along x = 3t^2, y = t^3 for 0 <= t <= 1. Report the two results under the names verdict and distance. Determine whether the distance traveled equals the magnitude of the displacement, and find the distance traveled."
            answer: "verdict = no; distance = 5sqrt(5) - 8"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["yes"], ["no"]]}, "name": "verdict"}, {"contract": {"kind": "exact"}, "name": "distance"}]}
            solution_sketch: "Step 1: Differentiate with the power rule: dx/dt = 6t and dy/dt = 3t^2, so the speed is sqrt(36t^2 + 9t^4) = 3t sqrt(4 + t^2). Step 2: In the speed integral from 0 to 1 substitute u = 4 + t^2: the distance is (4 + t^2)^(3/2) from 0 to 1, which is 5sqrt(5) - 8. Step 3: The endpoints are (0, 0) and (3, 1), so the displacement magnitude is sqrt(10). Since 5sqrt(5) - 8 does not equal sqrt(10), the verdict is no; the option yes is wrong because distance equals displacement only for straight-line motion. The answer is verdict = no; distance = 5sqrt(5) - 8."
          - problem: "A particle moves along x = t^2, y = (2/3)(t^2 + 3)^(3/2) for 0 <= t <= 2. Find the distance traveled."
            answer: "(2/3)(16sqrt(2) - 8)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1: Differentiate with the chain rule: dx/dt = 2t and dy/dt = 2t sqrt(t^2 + 3), so the speed is sqrt(4t^2 + 4t^2(t^2 + 3)) = 2t sqrt(t^2 + 4). Step 2: In the speed integral from 0 to 2 substitute u = t^2 + 4: the distance is the integral of sqrt(u) from 4 to 8, which is (2/3)(8^(3/2) - 4^(3/2)). Step 3: Evaluate: (2/3)(16sqrt(2) - 8). The distance traveled is (2/3)(16sqrt(2) - 8)."
        constraints: "distance via the speed integral; displacement via endpoints; integrals fall to one u-substitution"
    diagnostic_exemplar:
      problem: 'A particle traces $x = t^2 - 4t$, $y = t^2$ for $0 \le t \le 4$. When is it moving left, and what is the magnitude of its displacement over the interval?'
      answer: 'It moves left for $t < 2$ (where $dx/dt = 2t - 4 < 0$); the displacement is $(0, 16)$, of magnitude $16$'
      answer_contract: {kind: none}
      solution_sketch: 'Horizontal motion is governed by the sign of $\frac{dx}{dt} = 2t - 4$; displacement compares only the endpoints $(0, 0)$ and $(0, 16)$.'
    anki_seeds:
      - front: "A parametric particle is at rest when..."
        back: "both dx/dt = 0 and dy/dt = 0 at the same time"
        type: basic
      - front: "Distance traveled vs. displacement for parametric motion?"
        back: "distance = integral of speed; displacement = straight-line distance between start and end points"
        type: basic

  - id: plotting-polar-points
    name: Polar Points and Coordinate Conversions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: unit-circle
        weight: 0.7
        key: true
      - id: pythagorean-theorem
        weight: 0.4
      - id: right-triangle-trig
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Plotting and multiple representations
        key_prerequisites: [unit-circle]
        exemplars:
          - problem: "The polar point (4, 2pi/3) is plotted. Find the quadrant number (1, 2, 3, or 4) of the ray on which it lies."
            answer: "2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The angle 2pi/3 is between pi/2 and pi, so its ray lies in quadrant II by the unit-circle angle rule. Since r = 4 is positive, the point is on that ray. The quadrant number is 2."
          - problem: 'Give a representation of the polar point $\left(2, \frac{\pi}{4}\right)$ with $r < 0$.'
            answer: '$(-2, 5\pi/4)$'
            solution_sketch: 'Negative $r$ points the opposite way: add $\pi$ to the angle and negate $r$.'
          - problem: "The polar point (3, 3pi/4) has r > 0. Find another representation with r < 0 as (r, theta), using 0 <= theta < 2pi."
            answer: "(-3, 7pi/4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Start with the given polar point (3, 3pi/4). By the negative-r representation rule, negate r and add pi to the angle: r = -3 and theta = 3pi/4 + pi = 7pi/4. The representation is (-3, 7pi/4)."
          - problem: "The polar point (5, pi/6) is plotted. Find an equivalent representation with r > 0 and -2pi <= theta < 0 as (r, theta)."
            answer: "(5, -11pi/6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Start with the given polar point (5, pi/6). By the coterminal-angle rule, subtract one full turn 2pi from the angle: pi/6 - 2pi = -11pi/6. Keep r = 5. The representation is (5, -11pi/6)."
          - problem: "The polar point (-3, pi/3) is plotted. Find the quadrant number (1, 2, 3, or 4) of the point."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "The angle pi/3 points into quadrant I by the unit-circle angle rule. A negative r reflects the point through the origin, so the point lies in the opposite quadrant, quadrant III. The quadrant number is 3."
          - problem: "A polar point with positive r lies on the ray opposite to the ray theta = pi/4. Find an angle theta in [0, 2pi) for the point's ray."
            answer: "5pi/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Start with the given ray theta = pi/4. The opposite-ray rule adds pi to the angle: pi/4 + pi = 5pi/4. The angle 5pi/4 lies in [0, 2pi). The angle is 5pi/4."
        constraints: "angles on the unit-circle special angles; include one negative-r representation"
      - id: kp2
        name: Polar to rectangular
        key_prerequisites: [unit-circle, right-triangle-trig]
        exemplars:
          - problem: 'Convert $(r, \theta) = \left(2, \frac{\pi}{3}\right)$ to rectangular coordinates.'
            answer: '$(1, \sqrt 3)$'
            solution_sketch: '$x = 2\cos\frac{\pi}{3} = 1$, $y = 2\sin\frac{\pi}{3} = \sqrt{3}$.'
          - problem: 'Convert $(r, \theta) = \left(4, \frac{3\pi}{2}\right)$ to rectangular coordinates.'
            answer: '$(0, -4)$'
            solution_sketch: '$\cos\frac{3\pi}{2} = 0$, $\sin\frac{3\pi}{2} = -1$.'
          - problem: "Convert the polar point (r, theta) = (2, pi/4) to rectangular coordinates. Give the rectangular coordinates as (x, y)."
            answer: "(sqrt(2), sqrt(2))"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The polar point is (r, theta) = (2, pi/4). Apply x = r cos(theta): x = 2 cos(pi/4) = 2 times sqrt(2)/2 = sqrt(2). Apply y = r sin(theta): y = 2 sin(pi/4) = 2 times sqrt(2)/2 = sqrt(2). The rectangular coordinates are (sqrt(2), sqrt(2))."
          - problem: "A point is given in polar form as (r, theta) = (6, 5pi/3). Find its rectangular coordinates as (x, y)."
            answer: "(3, -3sqrt(3))"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The polar point is (r, theta) = (6, 5pi/3). Compute x = r cos(theta): x = 6 cos(5pi/3) = 6 times 1/2 = 3. Compute y = r sin(theta): y = 6 sin(5pi/3) = 6 times (-sqrt(3)/2) = -3sqrt(3). The rectangular coordinates are (3, -3sqrt(3))."
          - problem: "The polar point (r, theta) = (4, pi) lies on an axis. Determine its rectangular coordinates as (x, y)."
            answer: "(-4, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The polar point is (r, theta) = (4, pi). Use x = r cos(theta): x = 4 cos(pi) = 4 times (-1) = -4. Use y = r sin(theta): y = 4 sin(pi) = 4 times 0 = 0. The rectangular coordinates are (-4, 0)."
          - problem: "A point in the plane has polar coordinates (r, theta) = (10, 3pi/4). What are its rectangular coordinates, given as (x, y)?"
            answer: "(-5sqrt(2), 5sqrt(2))"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The polar point is (r, theta) = (10, 3pi/4). Evaluate x = r cos(theta): x = 10 cos(3pi/4) = 10 times (-sqrt(2)/2) = -5sqrt(2). Evaluate y = r sin(theta): y = 10 sin(3pi/4) = 10 times sqrt(2)/2 = 5sqrt(2). The rectangular coordinates are (-5sqrt(2), 5sqrt(2))."
        constraints: "theta on the unit-circle special angles; exact radical answers"
      - id: kp3
        name: Rectangular to polar
        key_prerequisites: [unit-circle, pythagorean-theorem]
        exemplars:
          - problem: 'Convert $(1, 1)$ to polar coordinates with $r > 0$ and $0 \le \theta < 2\pi$.'
            answer: '$(\sqrt 2, \pi/4)$'
            solution_sketch: '$r = \sqrt{1 + 1}$, $\tan\theta = 1$ in quadrant I.'
          - problem: 'Convert $(-1, \sqrt{3})$ to polar coordinates with $r > 0$ and $0 \le \theta < 2\pi$.'
            answer: '$(2, 2\pi/3)$'
            solution_sketch: '$r = \sqrt{1 + 3} = 2$; the point is in quadrant II with reference angle $\frac{\pi}{3}$.'
          - problem: 'Convert $(-3, 0)$ to polar coordinates with $r > 0$ and $0 \le \theta < 2\pi$.'
            answer: '$(3, \pi)$'
            solution_sketch: 'The point lies on the negative $x$-axis at distance $3$.'
          - problem: "Give the polar coordinates of (0, -2) with r > 0 and 0 <= theta < 2pi as (r, theta)."
            answer: "(2, 3pi/2)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The point (0, -2) has x = 0 and y = -2. Use the Pythagorean theorem r = sqrt(x^2 + y^2): r = sqrt(0 + 4) = 2. The point lies on the negative y-axis, so the angle is theta = 3pi/2. The polar coordinates are (2, 3pi/2)."
          - problem: "Give the polar coordinates of (-2, -2) with r > 0 and 0 <= theta < 2pi as (r, theta)."
            answer: "(2sqrt(2), 5pi/4)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The point (-2, -2) lies in quadrant III because both coordinates are negative. Use r = sqrt(x^2 + y^2): r = sqrt(4 + 4) = sqrt(8) = 2sqrt(2). The reference angle has tan(theta_ref) = 1, so theta_ref = pi/4; the quadrant III angle is pi + pi/4 = 5pi/4. The polar coordinates are (2sqrt(2), 5pi/4)."
          - problem: "Give the polar coordinates of (1, -sqrt(3)) with r > 0 and 0 <= theta < 2pi as (r, theta)."
            answer: "(2, 5pi/3)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "The point (1, -sqrt(3)) has x = 1 and y = -sqrt(3). Use r = sqrt(x^2 + y^2): r = sqrt(1 + 3) = 2. The reference angle has tan(theta_ref) = sqrt(3), so theta_ref = pi/3; the quadrant IV angle is 2pi - pi/3 = 5pi/3. The polar coordinates are (2, 5pi/3)."
        constraints: "points landing on special angles; mind the quadrant when reading arctan"
    diagnostic_exemplar:
      problem: 'Convert $(-3, 3\sqrt{3})$ to polar coordinates with $r > 0$ and $0 \le \theta < 2\pi$.'
      answer: '$(6, 2\pi/3)$'
      solution_sketch: '$r = \sqrt{9 + 27} = 6$; the point is in quadrant II with reference angle $\frac{\pi}{3}$, so $\theta = \frac{2\pi}{3}$.'
    anki_seeds:
      - front: "Polar-to-rectangular conversion formulas?"
        back: '$x = r\cos\theta$, $y = r\sin\theta$'
        type: basic
      - front: "Rectangular-to-polar conversion formulas?"
        back: '$r^2 = x^2 + y^2$, $\tan\theta = y/x$ (choose $\theta$ by quadrant)'
        type: basic

  - id: polar-coordinates
    name: Polar Coordinates
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: plotting-polar-points
        weight: 0.8
        key: true
      - id: completing-the-square
        weight: 0.4
      - id: trig-identities-basic
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Polar equations to rectangular equations
        key_prerequisites: [plotting-polar-points, completing-the-square]
        exemplars:
          - problem: "Convert r = 8 cos(theta) to a rectangular equation. The result has the form x^2 + y^2 = a x and its graph is a circle with center (h, 0). Find a and h."
            answer: "a = 8; h = 4"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "h"}]}
            solution_sketch: "Multiply both sides by r to get r^2 = 8 r cos(theta). Use the identities r^2 = x^2 + y^2 and r cos(theta) = x, giving x^2 + y^2 = 8x. Complete the square to get (x - 4)^2 + y^2 = 16, so the center is (4, 0). The answer is a = 8; h = 4."
          - problem: "Convert r = 10 sin(theta) to a rectangular equation. The result has the form x^2 + y^2 = a y and its graph is a circle with center (0, k). Find a and k."
            answer: "a = 10; k = 5"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: "Multiply by r: r^2 = 10 r sin(theta). Use r^2 = x^2 + y^2 and r sin(theta) = y to write x^2 + y^2 = 10y. Complete the square: x^2 + (y - 5)^2 = 25, so the center is (0, 5). The answer is a = 10; k = 5."
          - problem: "Convert theta = pi/3 to a rectangular equation of the form y = m x. Find the slope m."
            answer: "sqrt(3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Constant theta gives the line y = x tan(theta). Here tan(pi/3) = sqrt(3). So the rectangular equation is y = sqrt(3) x. The answer is sqrt(3)."
          - problem: "Convert r = -6 cos(theta) to a rectangular equation. The graph is a circle with center (h, 0) and radius rad. Find h and rad."
            answer: "h = -3; rad = 3"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "h"}, {"contract": {"kind": "exact"}, "name": "rad"}]}
            solution_sketch: "Multiply by r: r^2 = -6 r cos(theta). Use r^2 = x^2 + y^2 and r cos(theta) = x to get x^2 + y^2 = -6x. Complete the square: (x + 3)^2 + y^2 = 9, so the center is (-3, 0) and the radius is 3. The answer is h = -3; rad = 3."
          - problem: "Convert r = 4 cos(theta) + 4 sin(theta) to a rectangular equation. The graph is a circle with center (h, k). Find h and k."
            answer: "h = 2; k = 2"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "h"}, {"contract": {"kind": "exact"}, "name": "k"}]}
            solution_sketch: "Multiply by r: r^2 = 4 r cos(theta) + 4 r sin(theta). Use r^2 = x^2 + y^2, r cos(theta) = x, and r sin(theta) = y to get x^2 + y^2 = 4x + 4y. Complete the square: (x - 2)^2 + (y - 2)^2 = 8, so the center is (2, 2). The answer is h = 2; k = 2."
          - problem: "Convert r = 12 sin(theta) to a rectangular equation. The result has the form x^2 + y^2 = a y and its graph is a circle with radius rad. Find a and rad."
            answer: "a = 12; rad = 6"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "exact"}, "name": "a"}, {"contract": {"kind": "exact"}, "name": "rad"}]}
            solution_sketch: "Multiply by r: r^2 = 12 r sin(theta). Use r^2 = x^2 + y^2 and r sin(theta) = y to write x^2 + y^2 = 12y. Complete the square: x^2 + (y - 6)^2 = 36, so the radius is 6. The answer is a = 12; rad = 6."
        constraints: "multiply through by r when needed; complete the square to identify circles"
      - id: kp2
        name: Rectangular equations to polar equations
        key_prerequisites: [plotting-polar-points]
        exemplars:
          - problem: 'Convert the line $x = 3$ to a polar equation.'
            answer: '$r = 3\sec\theta$'
            solution_sketch: '$r\cos\theta = 3$.'
          - problem: 'Convert the circle $x^2 + y^2 = 25$ to a polar equation.'
            answer: '$r = 5$'
            solution_sketch: '$r^2 = 25$ with $r > 0$.'
          - problem: 'Convert the parabola $y = x^2$ to a polar equation.'
            answer: '$r = \tan\theta \sec\theta$'
            solution_sketch: '$r\sin\theta = r^2\cos^2\theta$; divide by $r\cos^2\theta$.'
        constraints: "use r^2 = x^2 + y^2, x = r cos theta, y = r sin theta; simplify to r = f(theta)"
      - id: kp3
        name: Identifying curves from polar equations
        key_prerequisites: [plotting-polar-points, completing-the-square]
        exemplars:
          - problem: "The polar equation r = 10 cos theta describes a circle through the origin. Give the center of this circle as (x, y)."
            answer: "(5, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (multiply by r): r^2 = 10r cos theta. Step 2 (polar-rectangular conversion): use r^2 = x^2 + y^2 and r cos theta = x to get x^2 + y^2 = 10x. Step 3 (completing the square): (x - 5)^2 + y^2 = 25, a circle through the origin. The center is (5, 0)."
          - problem: "The polar equation r = -6 sin theta describes a circle through the origin. Find its radius."
            answer: "3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (multiply by r): r^2 = -6r sin theta, so x^2 + y^2 = -6y. Step 2 (completing the square): x^2 + (y + 3)^2 = 9. Step 3 (read off the radius): this is a circle of radius 3. The radius is 3."
          - problem: "The polar equation r = 7 describes a curve in the plane. Give the center of this curve as (x, y)."
            answer: "(0, 0)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (identify the form): a constant r means every point of the curve is 7 units from the origin. Step 2 (polar-rectangular conversion): r^2 = 49 gives x^2 + y^2 = 49, a circle centered at the origin. The center is (0, 0)."
          - problem: "The polar equation theta = 2pi/3 describes a line through the origin. Find the slope of this line."
            answer: "-sqrt(3)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (constant-theta line rule): a constant theta gives the line y = x tan(theta) through the origin. Step 2 (evaluate the trig function): tan(2pi/3) = -sqrt(3). The slope is -sqrt(3)."
          - problem: "The polar equation r = 12 sin theta describes a circle through the origin. Give the center of this circle as (x, y)."
            answer: "(0, 6)"
            answer_contract: {"arity": 2, "kind": "coordinates"}
            solution_sketch: "Step 1 (multiply by r): r^2 = 12r sin theta, so x^2 + y^2 = 12y. Step 2 (completing the square): x^2 + (y - 6)^2 = 36, a circle through the origin on the y-axis. The center is (0, 6)."
          - problem: "The line y = -x passes through the origin. Give its polar angle theta, taking 0 <= theta < pi."
            answer: "3pi/4"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1 (slope to angle): the line y = -x has slope -1, and a constant-theta line has slope tan(theta). Step 2 (solve tan(theta) = -1 on 0 <= theta < pi): tan(3pi/4) = -1. The angle is 3pi/4."
        constraints: "circles through the origin (r = 2a cos theta or 2a sin theta), constant-r circles, and lines only"
    diagnostic_exemplar:
      problem: 'Convert the circle $x^2 + y^2 = 6y$ to a polar equation, and identify the curve.'
      answer: '$r = 6\sin\theta$: a circle of radius $3$ centered at $(0, 3)$'
      answer_contract: {kind: none}
      solution_sketch: 'Substitute $x^2 + y^2 = r^2$ and $y = r\sin\theta$, then divide by $r$; completing the square gives $x^2 + (y-3)^2 = 9$.'
    anki_seeds:
      - front: 'The polar equation $r = 2a\cos\theta$ is always a...'
        back: 'circle of radius $|a|$ centered at $(a, 0)$ (through the origin)'
        type: basic
      - front: "The standard trick for converting r = a cos(theta) or r = a sin(theta) to rectangular form?"
        back: 'multiply both sides by $r$, then use $r^2 = x^2 + y^2$, $r\cos\theta = x$, $r\sin\theta = y$'
        type: basic

  - id: graphing-polar-curves
    name: Graphing Polar Curves
    core: true
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: polar-coordinates
        weight: 0.8
        key: true
      - id: trig-graphs-basic
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Circles, cardioids, and limacons
        key_prerequisites: [polar-coordinates, trig-graphs-basic]
        exemplars:
          - problem: 'Identify the graph of $r = 1 + \cos\theta$.'
            answer: 'a cardioid (heart-shaped limaçon, cusp at the origin, symmetric about the polar axis)'
            answer_contract: {kind: none}
            solution_sketch: '$r = a + a\cos\theta$ with equal coefficients is the cardioid family.'
          - problem: 'Identify the graph of $r = 3$.'
            answer: 'a circle of radius $3$ centered at the origin'
            answer_contract: {kind: none}
            solution_sketch: 'All points at distance $3$ from the pole.'
          - problem: 'Does the limaçon $r = 1 + 2\cos\theta$ have an inner loop? Why?'
            answer: 'yes; $r$ becomes negative (for $\frac{2\pi}{3} < \theta < \frac{4\pi}{3}$), which traces an inner loop'
            answer_contract: {kind: none}
            solution_sketch: 'In $r = a + b\cos\theta$, an inner loop appears exactly when $|b| > |a|$.'
        constraints: "families limited to circles, cardioids, and limacons; classify by comparing |a| and |b|"
      - id: kp2
        name: Rose curves and petal counts
        key_prerequisites: [polar-coordinates, trig-graphs-basic]
        exemplars:
          - problem: 'At which angles $\theta$ in $[0, 2\pi)$ do the petal tips of $r = 2\sin 3\theta$ occur?'
            answer: '$\theta = \frac{\pi}{6}, \frac{5\pi}{6}, \frac{3\pi}{2}$'
            solution_sketch: 'Tips where $\sin 3\theta = 1$: $3\theta = \frac{\pi}{2} + 2\pi k$.'
          - problem: "Two polar curves are r = 2 sin 3theta and r = cos 2theta. State the two petal counts in that order as a comma-separated list."
            answer: "3, 4"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1, the petal count rule for r = a sin(n theta) gives n petals when n is odd, so r = 2 sin 3theta has 3 petals. Step 2, the petal count rule for r = a cos(n theta) gives 2n petals when n is even, so r = cos 2theta has 4 petals. The two petal counts in that order are 3, 4."
          - problem: "A polar curve is given by r = 3 cos 5theta. Find the number of petals of its graph."
            answer: "5"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, apply the petal count rule for r = a cos(n theta) with n odd. Step 2, because n = 5 is odd, the number of petals is n = 5. The graph of r = 3 cos 5theta has 5 petals, so the answer is 5."
          - problem: "A polar curve is given by r = 5 sin 4theta. Find the number of petals of its graph."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Step 1, apply the petal count rule for r = a sin(n theta) with n even. Step 2, because n = 4 is even, the number of petals is 2n = 8. The graph of r = 5 sin 4theta has 8 petals, so the answer is 8."
          - problem: "A polar curve is given by r = 3 cos 2theta. Give the tip angles for theta in [0, 2pi) in increasing order as a comma-separated list."
            answer: "0, pi/2, pi, 3pi/2"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1, solve the tip-angle equation cos 2theta = 1 and cos 2theta = -1 for an even rose. Step 2, 2theta = k pi gives theta = k pi/2 for k = 0, 1, 2, 3. The tip angles in increasing order are 0, pi/2, pi, 3pi/2."
          - problem: "A polar curve is given by r = 4 sin 5theta. Give the tip angles for theta in [0, 2pi) in increasing order as a comma-separated list."
            answer: "pi/10, pi/2, 9pi/10, 13pi/10, 17pi/10"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Step 1, solve the tip-angle equation sin 5theta = 1 for an odd rose. Step 2, 5theta = pi/2 + 2pi k gives theta = pi/10 + 2pi k/5. Step 3, take k = 0, 1, 2, 3, 4 in [0, 2pi). The tip angles in increasing order are pi/10, pi/2, 9pi/10, 13pi/10, 17pi/10."
        constraints: "n in {2, 3, 4, 5}; ask for petal counts and tip angles"
      - id: kp3
        name: Symmetry and zeros of r
        key_prerequisites: [polar-coordinates]
        exemplars:
          - problem: "For $r = 1 + \\cos\\theta$, find the line of symmetry and the angle in $[0, 2\\pi)$ where $r = 0$. Give the symmetry line as one word and the zero angle as a multiple of $\\pi$."
            answer: "line = horizontal; theta = pi"
            answer_contract: {"kind": "multipart", "parts": [{"contract": {"kind": "label", "options": [["horizontal"], ["vertical"]]}, "name": "line"}, {"contract": {"kind": "exact"}, "name": "theta"}]}
            solution_sketch: "Because cosine is even, $r(-\\theta) = r(\\theta)$, so the graph is symmetric about the polar axis, the horizontal line. Set $r = 0$: $1 + \\cos\\theta = 0$ gives $\\cos\\theta = -1$, so $\\theta = \\pi$ on $[0, 2\\pi)$. The vertical option fails because replacing $\\theta$ by $\\pi - \\theta$ does not preserve $r$. Thus line = horizontal; theta = pi."
          - problem: 'Find all $\theta$ in $[0, 2\pi)$ with $r = 0$ for the rose $r = \sin 2\theta$.'
            answer: '$\theta = 0, \frac{\pi}{2}, \pi, \frac{3\pi}{2}$'
            solution_sketch: '$\sin 2\theta = 0$ at multiples of $\frac{\pi}{2}$; these angles bound the petals.'
          - problem: "Find all $\\theta$ in $[0, \\pi)$ at which $r = 0$ for the rose $r = \\cos 3\\theta$. Give the answer as a comma-separated list of increasing values."
            answer: "pi/6, pi/2, 5pi/6"
            answer_contract: {"kind": "list", "member": {"kind": "exact"}, "ordered": true}
            solution_sketch: "Set $r = 0$: $\\cos 3\\theta = 0$. Then $3\\theta = \\frac{\\pi}{2} + k\\pi$, so $\\theta = \\frac{\\pi}{6} + k\\frac{\\pi}{3}$. The values in $[0, \\pi)$ are $\\frac{\\pi}{6}$, $\\frac{\\pi}{2}$, and $\\frac{5\\pi}{6}$. The list is pi/6, pi/2, 5pi/6."
          - problem: "Determine the line of symmetry of the graph of $r = 2 + 2\\sin\\theta$. Select one."
            answer: "vertical"
            answer_contract: {"kind": "label", "options": [["vertical"], ["horizontal"], ["origin"], ["diagonal"]]}
            solution_sketch: "Because $\\sin(\\pi - \\theta) = \\sin\\theta$, $r$ is unchanged when $\\theta$ is replaced by $\\pi - \\theta$, so the symmetry line is vertical, $\\theta = \\frac{\\pi}{2}$. The horizontal option fails because replacing $\\theta$ by $-\\theta$ changes $r$. The origin option fails because adding $\\pi$ changes $r$. The diagonal option fails because no reflection across it preserves $r$. The symmetry line is vertical."
          - problem: "For the rose $r = 2\\cos 4\\theta$, how many values of $\\theta$ in $[0, 2\\pi)$ make $r = 0$? Give the count."
            answer: "8"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set $r = 0$: $2\\cos 4\\theta = 0$, so $\\cos 4\\theta = 0$. Then $4\\theta = \\frac{\\pi}{2} + k\\pi$, giving $\\theta = \\frac{\\pi}{8} + k\\frac{\\pi}{4}$. The values $k = 0, 1, \\dots, 7$ lie in $[0, 2\\pi)$, which is eight values. The count is 8."
          - problem: "At what angle $\\theta$ in $[0, 2\\pi)$ does $r = 3 - 3\\cos\\theta$ reach the pole? Give the angle as a multiple of $\\pi$."
            answer: "0"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Set $r = 0$: $3 - 3\\cos\\theta = 0$, so $\\cos\\theta = 1$. On $[0, 2\\pi)$, $\\theta = 0$ is the only solution. The angle is 0."
        constraints: "symmetry via even/odd trig; zeros of r locate petal boundaries and cusps"
    diagnostic_exemplar:
      problem: 'For $r = 4\cos 3\theta$, how many petals does the graph have, and at which $\theta$ in $[0, \pi)$ does the curve pass through the pole?'
      answer: '$3$ petals; it reaches the pole at $\theta = \frac{\pi}{6}, \frac{\pi}{2}, \frac{5\pi}{6}$'
      answer_contract: {kind: none}
      solution_sketch: 'For $r = a\cos(n\theta)$ with $n$ odd there are $n$ petals; $r = 0$ when $\cos 3\theta = 0$, i.e. $3\theta = \frac{\pi}{2} + k\pi$.'
    anki_seeds:
      - front: 'Petal count of $r = a\cos(n\theta)$?'
        back: '$n$ petals if $n$ is odd, $2n$ petals if $n$ is even'
        type: basic
      - front: 'The limaçon $r = a + b\cos\theta$ has an inner loop exactly when...'
        back: '$|b| > |a|$ (r takes negative values)'
        type: basic

  - id: polar-tangent-lines
    name: Tangents to Polar Curves
    core: false                # terminal polar application
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: polar-coordinates
        weight: 0.6
        key: true
      - id: parametric-derivatives
        weight: 0.6
        key: true
      - id: double-half-angle-identities
        weight: 0.5
      - id: derivatives-trig
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Slopes via the parametric form
        key_prerequisites: [polar-coordinates, parametric-derivatives, derivatives-trig]
        exemplars:
          - problem: 'Find the slope of the cardioid $r = 1 + \cos\theta$ at $\theta = \frac{\pi}{2}$.'
            answer: "1"
            solution_sketch: 'With $x = r\cos\theta$, $y = r\sin\theta$: $\frac{dy}{d\theta} = \cos\theta + \cos 2\theta = -1$ and $\frac{dx}{d\theta} = -\sin\theta - \sin 2\theta = -1$ at $\frac{\pi}{2}$; slope $= 1$.'
          - problem: 'Find the slope of the spiral $r = \theta$ at $\theta = \frac{\pi}{2}$.'
            answer: '$-\frac{2}{\pi}$'
            solution_sketch: '$x = \theta\cos\theta$, $y = \theta\sin\theta$: at $\frac{\pi}{2}$, $\frac{dy}{d\theta} = 1$ and $\frac{dx}{d\theta} = -\frac{\pi}{2}$.'
          - problem: "Find the slope of the polar curve $r = 4\\cos\\theta$ at $\\theta = \\frac{\\pi}{6}$ as a number."
            answer: "-sqrt(3)/3"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Treat theta as the parameter and write the full parametric form $x = r\\cos\\theta$, $y = r\\sin\\theta$ with $r = 4\\cos\\theta$, so $r' = -4\\sin\\theta$. The parametric derivative rule gives $\\frac{dy}{d\\theta} = r'\\sin\\theta + r\\cos\\theta$ and $\\frac{dx}{d\\theta} = r'\\cos\\theta - r\\sin\\theta$. At $\\theta = \\frac{\\pi}{6}$: $r = 2\\sqrt{3}$, $r' = -2$, $\\sin\\theta = \\frac{1}{2}$, $\\cos\\theta = \\frac{\\sqrt{3}}{2}$, so $\\frac{dy}{d\\theta} = (-2)\\cdot\\frac{1}{2} + 2\\sqrt{3}\\cdot\\frac{\\sqrt{3}}{2} = 2$ and $\\frac{dx}{d\\theta} = (-2)\\cdot\\frac{\\sqrt{3}}{2} - 2\\sqrt{3}\\cdot\\frac{1}{2} = -2\\sqrt{3}$. Dividing, the slope is $\\frac{2}{-2\\sqrt{3}} = -\\frac{1}{\\sqrt{3}}$, which is -sqrt(3)/3."
          - problem: "Find the slope of the polar curve $r = 1 + \\sin\\theta$ at $\\theta = \\frac{\\pi}{4}$ as a number."
            answer: "-1-sqrt(2)"
            answer_contract: {"kind": "exact"}
            solution_sketch: "Write the full parametric form $x = (1+\\sin\\theta)\\cos\\theta$, $y = (1+\\sin\\theta)\\sin\\theta$, with $r' = \\cos\\theta$. The parametric derivative rule gives $\\frac{dy}{d\\theta} = r'\\sin\\theta + r\\cos\\theta$ and $\\frac{dx}{d\\theta} = r'\\cos\\theta - r\\sin\\theta$. At $\\theta = \\frac{\\pi}{4}$: $r = 1 + \\frac{\\sqrt{2}}{2}$, $r' = \\frac{\\sqrt{2}}{2}$, $\\sin\\theta = \\cos\\theta = \\frac{\\sqrt{2}}{2}$. Then $\\frac{dy}{d\\theta} = \\frac{1}{2} + \\left(1+\\frac{\\sqrt{2}}{2}\\right)\\frac{\\sqrt{2}}{2} = 1 + \\frac{\\sqrt{2}}{2}$ and $\\frac{dx}{d\\theta} = \\frac{1}{2} - \\left(1+\\frac{\\sqrt{2}}{2}\\right)\\frac{\\sqrt{2}}{2} = -\\frac{\\sqrt{2}}{2}$. The slope is $-\\left(1+\\frac{\\sqrt{2}}{2}\\right)\\Big/\\frac{\\sqrt{2}}{2} = -(\\sqrt{2}+1)$, that is -1-sqrt(2)."
          - problem: "Find the slope of the polar curve $r = 3 + 2\\sin\\theta$ at $\\theta = \\pi$ as a number."
            answer: "-3/2"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the limacon $r = 3 + 2\\sin\\theta$ the derivative is $r' = 2\\cos\\theta$. Write the full parametric form $x = r\\cos\\theta$, $y = r\\sin\\theta$; the parametric derivative rule gives $\\frac{dy}{d\\theta} = r'\\sin\\theta + r\\cos\\theta$ and $\\frac{dx}{d\\theta} = r'\\cos\\theta - r\\sin\\theta$. At $\\theta = \\pi$: $r = 3$, $r' = -2$, $\\sin\\theta = 0$, $\\cos\\theta = -1$. Hence $\\frac{dy}{d\\theta} = 0 + 3(-1) = -3$ and $\\frac{dx}{d\\theta} = (-2)(-1) - 0 = 2$. The slope is $\\frac{-3}{2}$, so the answer is -3/2."
          - problem: "Find the slope of the polar curve $r = 2\\cos(2\\theta)$ at $\\theta = \\frac{\\pi}{6}$ as a number."
            answer: "sqrt(3)/7"
            answer_contract: {"kind": "exact"}
            solution_sketch: "For the rose $r = 2\\cos(2\\theta)$, the chain rule on the trig derivative gives $r' = -4\\sin(2\\theta)$. With $x = r\\cos\\theta$, $y = r\\sin\\theta$, the parametric derivative rule gives the slope $\\frac{r'\\sin\\theta + r\\cos\\theta}{r'\\cos\\theta - r\\sin\\theta}$. At $\\theta = \\frac{\\pi}{6}$: $r = 2\\cos\\frac{\\pi}{3} = 1$, $r' = -4\\sin\\frac{\\pi}{3} = -2\\sqrt{3}$, $\\sin\\theta = \\frac{1}{2}$, $\\cos\\theta = \\frac{\\sqrt{3}}{2}$. Then $\\frac{dy}{d\\theta} = (-2\\sqrt{3})\\cdot\\frac{1}{2} + 1\\cdot\\frac{\\sqrt{3}}{2} = -\\frac{\\sqrt{3}}{2}$ and $\\frac{dx}{d\\theta} = (-2\\sqrt{3})\\cdot\\frac{\\sqrt{3}}{2} - 1\\cdot\\frac{1}{2} = -\\frac{7}{2}$. The slope is $\\left(-\\frac{\\sqrt{3}}{2}\\right)\\Big/\\left(-\\frac{7}{2}\\right) = \\frac{\\sqrt{3}}{7}$, which is sqrt(3)/7."
        constraints: "treat theta as the parameter in x = r cos theta, y = r sin theta; evaluation at special angles"
      - id: kp2
        name: Horizontal and vertical tangents
        key_prerequisites: [parametric-derivatives, derivatives-trig]
        exemplars:
          - problem: 'Find the points where the circle $r = 2\cos\theta$ has a horizontal tangent.'
            answer: '$(1, 1)$ and $(1, -1)$ (rectangular), at $\theta = \pm\frac{\pi}{4}$'
            answer_contract: {kind: none}
            solution_sketch: '$y = 2\cos\theta\sin\theta = \sin 2\theta$; $\frac{dy}{d\theta} = 2\cos 2\theta = 0$ at $\theta = \pm\frac{\pi}{4}$.'
          - problem: 'Find the points where the circle $r = 2\cos\theta$ has a vertical tangent.'
            answer: '$(2, 0)$ and the pole $(0, 0)$, at $\theta = 0$ and $\theta = \frac{\pi}{2}$'
            answer_contract: {kind: none}
            solution_sketch: '$x = 1 + \cos 2\theta$; $\frac{dx}{d\theta} = -2\sin 2\theta = 0$ at $\theta = 0, \frac{\pi}{2}$.'
        constraints: "dy/d theta = 0 for horizontal, dx/d theta = 0 for vertical; report rectangular points"
      - id: kp3
        name: Tangent lines at the pole
        key_prerequisites: [polar-coordinates]
        exemplars:
          - problem: 'Find the tangent lines to $r = \sin 2\theta$ at the pole (for $0 \le \theta < \pi$).'
            answer: 'the lines $\theta = 0$ and $\theta = \frac{\pi}{2}$'
            answer_contract: {kind: none}
            solution_sketch: 'At the pole, the tangent lines are the rays where $r = 0$: $\sin 2\theta = 0$.'
          - problem: 'Find the tangent line to the cardioid $r = 1 + \cos\theta$ at the pole.'
            answer: 'the line $\theta = \pi$ (the negative $x$-axis)'
            answer_contract: {kind: none}
            solution_sketch: '$r = 0$ only at $\theta = \pi$.'
        constraints: "pole tangents read off from the zeros of r"
    diagnostic_exemplar:
      problem: 'Find the points where the circle $r = 2\sin\theta$ has a horizontal tangent, and give the tangent line to the curve at the pole.'
      answer: 'Horizontal tangents at the pole ($\theta = 0$) and at $(0, 2)$ ($\theta = \frac{\pi}{2}$); the tangent line at the pole is $\theta = 0$, the $x$-axis'
      answer_contract: {kind: none}
      solution_sketch: 'With $x = \sin 2\theta$ and $y = 1 - \cos 2\theta$, $\frac{dy}{d\theta} = 2\sin 2\theta$ vanishes at $\theta = 0, \frac{\pi}{2}$ while $\frac{dx}{d\theta} \ne 0$ there; the pole is reached at $\theta = 0$, which gives the tangent line there.'
    anki_seeds:
      - front: "Slope of a polar curve r = f(theta)?"
        back: '$\frac{dy}{dx} = \frac{\frac{dr}{d\theta}\sin\theta + r\cos\theta}{\frac{dr}{d\theta}\cos\theta - r\sin\theta}$ (parametrize $x = r\cos\theta$, $y = r\sin\theta$)'
        type: basic
      - front: "Tangent lines to a polar curve at the pole?"
        back: 'the rays $\theta = \theta_0$ at the angles where $r(\theta_0) = 0$'
        type: basic

  - id: polar-area
    name: Area in Polar Coordinates
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: graphing-polar-curves
        weight: 0.6
        key: true
      - id: trigonometric-integrals
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The polar area formula
        key_prerequisites: [graphing-polar-curves, definite-integrals-ftc]
        exemplars:
          - problem: 'Use the polar area formula to find the area enclosed by $r = 3$.'
            answer: '$9\pi$'
            solution_sketch: '$\frac{1}{2}\int_0^{2\pi} 9\,d\theta = 9\pi$, matching $\pi r^2$.'
          - problem: 'Find the area of the sector of $r = 2$ with $0 \le \theta \le \frac{\pi}{3}$.'
            answer: '$\frac{2\pi}{3}$'
            solution_sketch: '$\frac{1}{2}\int_0^{\pi/3} 4\,d\theta = \frac{1}{2} \cdot 4 \cdot \frac{\pi}{3}$.'
        constraints: "constant r; results checkable against circle/sector formulas"
      - id: kp2
        name: Area inside cardioids and circles
        key_prerequisites: [trigonometric-integrals, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the area enclosed by the circle $r = 2\cos\theta$.'
            answer: '$\pi$'
            solution_sketch: 'Traced for $-\frac{\pi}{2} \le \theta \le \frac{\pi}{2}$: $\frac{1}{2}\int_{-\pi/2}^{\pi/2} 4\cos^2\theta\,d\theta = \pi$ — a circle of radius $1$.'
          - problem: 'Find the area enclosed by the cardioid $r = 1 + \cos\theta$.'
            answer: '$3\pi/2$'
            solution_sketch: '$\frac{1}{2}\int_0^{2\pi} (1 + \cos\theta)^2\,d\theta = \frac{1}{2}\left(2\pi + 0 + \pi\right) = \frac{3\pi}{2}$ using $\int_0^{2\pi}\cos^2 = \pi$.'
        constraints: "integrands expand to constants, cos theta, and cos^2 theta terms handled by half-angle identities; mind the tracing interval"
      - id: kp3
        name: Petal areas
        key_prerequisites: [graphing-polar-curves, trigonometric-integrals]
        exemplars:
          - problem: 'Find the area of one petal of $r = \sin 2\theta$.'
            answer: '$\pi/8$'
            solution_sketch: 'One petal spans $0 \le \theta \le \frac{\pi}{2}$: $\frac{1}{2}\int_0^{\pi/2} \sin^2 2\theta\,d\theta = \frac{1}{2} \cdot \frac{\pi}{4} = \frac{\pi}{8}$.'
          - problem: 'Find the area of one petal of $r = 3\cos 3\theta$.'
            answer: '$3\pi/4$'
            solution_sketch: 'One petal spans $-\frac{\pi}{6} \le \theta \le \frac{\pi}{6}$: $\frac{1}{2}\int_{-\pi/6}^{\pi/6} 9\cos^2 3\theta\,d\theta = \frac{9}{2} \cdot \frac{\pi}{6} = \frac{3\pi}{4}$.'
        constraints: "petal limits from consecutive zeros of r; half-angle identity does the integral"
    diagnostic_exemplar:
      problem: 'Find the area of one petal of $r = 2\cos 2\theta$.'
      answer: '$\pi/2$'
      solution_sketch: 'One petal spans $-\frac{\pi}{4} \le \theta \le \frac{\pi}{4}$: $\frac{1}{2}\int_{-\pi/4}^{\pi/4} 4\cos^2 2\theta\,d\theta = 2 \cdot \frac{\pi}{4} = \frac{\pi}{2}$.'
    anki_seeds:
      - front: "Area formula in polar coordinates?"
        back: '$A = \frac{1}{2}\int_{\alpha}^{\beta} r^2 \, d\theta$'
        type: basic
      - front: "To find the theta-limits for one petal of a rose, use..."
        back: "two consecutive zeros of r"
        type: basic

  - id: polar-graphs-area
    name: Polar Graphs and Area
    core: false                # decorative/terminal polar application
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: polar-area
        weight: 0.8
        key: true
      - id: graphing-polar-curves
        weight: 0.4
      - id: trigonometric-integrals
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Intersections of polar curves
        key_prerequisites: [graphing-polar-curves, polar-area]
        exemplars:
          - problem: 'Find the intersection points of $r = 1$ and $r = 2\cos\theta$ for $0 \le \theta < 2\pi$.'
            answer: '$\left(1, \frac{\pi}{3}\right)$ and $\left(1, -\frac{\pi}{3}\right)$ (i.e. $\frac{5\pi}{3}$)'
            answer_contract: {kind: none}
            solution_sketch: '$2\cos\theta = 1$ gives $\cos\theta = \frac{1}{2}$.'
          - problem: 'Find all intersections of $r = \sin\theta$ and $r = \cos\theta$, including the pole.'
            answer: '$\left(\frac{\sqrt{2}}{2}, \frac{\pi}{4}\right)$ and the pole'
            answer_contract: {kind: none}
            solution_sketch: '$\tan\theta = 1$ gives $\theta = \frac{\pi}{4}$; both circles also pass through the origin (at different $\theta$), so the pole is an intersection too.'
        constraints: "intersections at special angles; always check the pole separately"
      - id: kp2
        name: Area between polar curves
        key_prerequisites: [polar-area, trigonometric-integrals]
        exemplars:
          - problem: 'Find the area inside the cardioid $r = 1 + \cos\theta$ and outside the circle $r = 1$.'
            answer: '$2 + \frac{\pi}{4}$'
            solution_sketch: 'Curves meet at $\theta = \pm\frac{\pi}{2}$: $\frac{1}{2}\int_{-\pi/2}^{\pi/2}\left[(1+\cos\theta)^2 - 1\right]d\theta = \frac{1}{2}\int_{-\pi/2}^{\pi/2}(2\cos\theta + \cos^2\theta)\,d\theta = \frac{1}{2}\left(4 + \frac{\pi}{2}\right) = 2 + \frac{\pi}{4}$.'
          - problem: 'Find the area inside the circle $r = 2\cos\theta$ and outside the circle $r = 1$.'
            answer: '$\frac{\pi}{3} + \frac{\sqrt{3}}{2}$'
            solution_sketch: 'Curves meet at $\theta = \pm\frac{\pi}{3}$: $\frac{1}{2}\int_{-\pi/3}^{\pi/3}\left(4\cos^2\theta - 1\right)d\theta = \frac{1}{2}\left[\theta + \sin 2\theta\right]_{-\pi/3}^{\pi/3}$.'
        constraints: "area differences of the form (outer)^2 - (inner)^2 over a symmetric interval; intersections at special angles"
      - id: kp3
        name: Composite regions
        key_prerequisites: [polar-area, trigonometric-integrals]
        exemplars:
          - problem: 'Find the area inside $r = 3\sin\theta$ and outside the cardioid $r = 1 + \sin\theta$.'
            answer: '$\pi$'
            solution_sketch: 'Curves meet where $\sin\theta = \frac{1}{2}$, i.e. $\theta = \frac{\pi}{6}, \frac{5\pi}{6}$: $\frac{1}{2}\int_{\pi/6}^{5\pi/6}\left[9\sin^2\theta - (1+\sin\theta)^2\right]d\theta = \pi$.'
          - problem: 'Find the area of the inner loop of the limaçon $r = 1 + 2\cos\theta$.'
            answer: '$\pi - \frac{3\sqrt{3}}{2}$'
            solution_sketch: 'The inner loop runs between the zeros $\theta = \frac{2\pi}{3}$ and $\frac{4\pi}{3}$: $\frac{1}{2}\int_{2\pi/3}^{4\pi/3}(1 + 2\cos\theta)^2\,d\theta = \pi - \frac{3\sqrt{3}}{2}$.'
        constraints: "limits from intersections or zeros of r; integrands expand to constants, cos, and cos^2 terms"
    diagnostic_exemplar:
      problem: 'Find the area inside both $r = 1$ and $r = 2\sin\theta$.'
      answer: '$\frac{2\pi}{3} - \frac{\sqrt{3}}{2}$'
      solution_sketch: 'Curves meet at $\theta = \frac{\pi}{6}, \frac{5\pi}{6}$; use $r = 2\sin\theta$ on $[0, \frac{\pi}{6}] \cup [\frac{5\pi}{6}, \pi]$ and $r = 1$ between: $2 \cdot \frac{1}{2}\int_0^{\pi/6} 4\sin^2\theta\,d\theta + \frac{1}{2}\cdot\frac{2\pi}{3} = \frac{2\pi}{3} - \frac{\sqrt{3}}{2}$.'
    anki_seeds:
      - front: "Why can polar intersections be missed by just solving f(theta) = g(theta)?"
        back: "curves can meet at the pole (r = 0) at different theta values, and points have multiple representations — check the pole separately"
        type: basic
      - front: "Area between two polar curves over [alpha, beta]?"
        back: '$\frac{1}{2}\int_{\alpha}^{\beta}\left(r_{\text{outer}}^2 - r_{\text{inner}}^2\right) d\theta$'
        type: basic
