unit: parametric-polar
course: calculus-2
module: "Parametric & Polar Calculus"
topics:
  - id: parametric-curves-basics
    name: Parametric Curves and Eliminating the Parameter
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: numeric
    expected_time_secs: 120
    prerequisites:
      - id: function-notation
        weight: 0.6
        key: true
      - id: pythagorean-identity
        weight: 0.6
        key: true
      # kp3 asks the learner to NAME the eliminated curve ("an ellipse"), which
      # needs the standard form. Conceptual familiarity only - the topic never
      # works with foci or eccentricity - so weight 0 per Math Academy Way p.368.
      - id: ellipses
        weight: 0.0
        key: false
      - id: unit-circle
        weight: 0.5
      - id: coordinate-plane
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Evaluating and plotting parametric points
        key_prerequisites: [function-notation, coordinate-plane]
        exemplars:
          - problem: 'A curve has parametric equations $x = t^3 - 2t$, $y = t^2 + 1$. Find the point on the curve at $t = -1$.'
            answer: '(1, 2)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Substitute $t = -1$ into both equations. This gives $x = (-1)^3 - 2(-1) = 1$ and $y = (-1)^2 + 1 = 2$. The point is $(1, 2)$.'
          - problem: 'For $x = 2t^3 - t$ and $y = t^2 - 4t$, find the point at $t = 3$.'
            answer: '(51, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Put $t = 3$ in each equation. Then $x = 2(27) - 3 = 51$ and $y = 9 - 12 = -3$. The point is $(51, -3)$.'
          - problem: 'A drone leaves its launch pad. After $t$ seconds it is $x = 4t$ metres east of the pad and $y = 20t - 5t^2$ metres high. Where is the drone 3 seconds after launch?'
            answer: '(12, 15)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Put $t = 3$ in both equations. The horizontal distance is $x = 4(3) = 12$ and the height is $y = 20(3) - 5(9) = 15$. So the drone is at $(12, 15)$, with both numbers in metres.'
          - problem: 'A curve has $x = t^2 - 2$ and $y = 3t + 1$. The point $(7, 10)$ lies on the curve. Find the value of $t$ that gives this point.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The $y$-equation is linear, so solve $3t + 1 = 10$ to get $t = 3$. Check with the $x$-equation: $3^2 - 2 = 7$, which matches. So $t = 3$.'
          - problem: 'A ball is thrown from a balcony. After $t$ seconds it is $x = 6t$ metres from the wall, measured horizontally, and $y = 15 + 10t - 5t^2$ metres above the ground. How far from the wall does the ball land?'
            answer: '18'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The ball lands when $y = 0$. Solving $15 + 10t - 5t^2 = 0$ gives $t^2 - 2t - 3 = 0$, so $t = 3$ (the root $t = -1$ is before the throw). Then $x = 6(3) = 18$, so the ball lands 18 metres from the wall.'
          - problem: 'Does the point $(7, 3)$ lie on the curve $x = t^2 + 3$, $y = 2t - 1$?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it does","it lies on the curve"],["no","it does not","it is not on the curve"]]}
            solution_sketch: 'The $x$-equation gives $t^2 + 3 = 7$, so $t = 2$ or $t = -2$. The $y$-equation gives $2t - 1 = 3$, so $t = 2$. One value of $t$ fits both equations, so the point lies on the curve.'
          - problem: 'A curve has $x = 2t$ and $y = t^2 - 1$. Find the value of $t$ at which the curve passes through $(-4, 3)$.'
            answer: '-2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'From $2t = -4$ we get $t = -2$. Check with the second equation: $(-2)^2 - 1 = 3$, which matches the $y$-coordinate. So $t = -2$.'
        constraints: "t-values are small integers; polynomial coordinate functions of degree <= 3"
      - id: kp2
        name: Eliminating the parameter
        key_prerequisites: [function-notation]
        exemplars:
          - problem: 'Eliminate the parameter from $x = t + 1$, $y = t^2$.'
            answer: 'y = (x - 1)^2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Solve $x = t + 1$ for $t$ to get $t = x - 1$. Substitute this into $y = t^2$. The curve is $y = (x - 1)^2$.'
          - problem: 'Eliminate the parameter from $x = t - 2$, $y = 3t + 1$.'
            answer: 'y = 3x + 7'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Solve $x = t - 2$ for $t$ to get $t = x + 2$. Substitute into $y = 3t + 1$: $y = 3(x + 2) + 1 = 3x + 7$. The curve is a line.'
          - problem: 'Eliminate the parameter from $x = \sqrt{t}$, $y = 4t - 5$ for $t \ge 0$.'
            answer: 'y = 4x^2 - 5'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Squaring $x = \sqrt{t}$ gives $t = x^2$. Substitute into $y = 4t - 5$ to get $y = 4x^2 - 5$. Because $x = \sqrt{t}$ is never negative, only the part with $x \ge 0$ is traced.'
          - problem: 'A robot crosses a floor. At time $t$ seconds it is $x = 2t + 1$ metres east and $y = 5t - 3$ metres north of a marker. Find the equation of its path.'
            answer: 'y = (5x - 11)/2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Solve $x = 2t + 1$ for $t$ to get $t = (x - 1)/2$. Then $y = 5(x - 1)/2 - 3 = (5x - 11)/2$. The path is a straight line.'
          - problem: 'A particle moves so that $x = t + 3$ and $y = t^2 - 2t$. Find the equation of its path.'
            answer: 'y = x^2 - 8x + 15'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Solve $x = t + 3$ for $t$ to get $t = x - 3$. Then $y = (x - 3)^2 - 2(x - 3) = x^2 - 8x + 15$. The path is a parabola.'
          - problem: 'A drone is $x = 4t$ metres from its pad, measured horizontally, and $y = 20t - 5t^2$ metres high after $t$ seconds. Find the equation that gives its height $y$ in terms of its horizontal distance $x$.'
            answer: 'y = 5x - 5x^2/16'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Divide $x = 4t$ by $4$ to get $t = x/4$. Substitute: $y = 20(x/4) - 5(x/4)^2 = 5x - 5x^2/16$. The path is a parabola.'
          - problem: 'Eliminate the parameter from $x = 2t$, $y = t^2$. What is the equation of the curve in $x$ and $y$?'
            answer: 'y = x^2/4'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Solving $x = 2t$ gives $t = x/2$, not $t = x$. Then $y = (x/2)^2 = x^2/4$.'
          - problem: 'Eliminate the parameter from $x = 1/t$, $y = t + 1$ for $t \ne 0$.'
            answer: 'y = 1/x + 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'From $x = 1/t$ we get $t = 1/x$. Then $y = 1/x + 1$. The value $x = 0$ is never reached.'
          - problem: 'The curve $x = \sqrt{t}$, $y = 4t - 5$ for $t \ge 0$ lies on the parabola $y = 4x^2 - 5$. Does the curve trace the whole parabola?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","only half","only part","it does not"],["yes","the whole parabola","it does"]]}
            solution_sketch: 'Since $x = \sqrt{t}$ is never negative, every point of the curve has $x \ge 0$. So only the right half of the parabola is traced, and the left half is missing.'
        constraints: "parameter eliminable by a direct solve; note domain restrictions from radicals"
      - id: kp3
        name: Trigonometric parametrizations
        key_prerequisites: [unit-circle, pythagorean-identity]
        try_first:
          problem: 'If $\cos t = \frac{3}{5}$ and $t$ is an angle in the first quadrant, what is $\sin t$?'
          answer_contract: {"kind":"exact"}
          answer: '4/5'
          reveal: 'Both $\cos t$ and $\sin t$ obey $\cos^2 t + \sin^2 t = 1$, so one of them fixes the other. The same identity removes $t$ from $x = a\cos t$, $y = b\sin t$.'
        exemplars:
          - problem: 'Eliminate the parameter from $x = 5\cos t$, $y = 3\sin t$.'
            answer: 'x^2/25 + y^2/9 = 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Divide to isolate $\cos t = x/5$ and $\sin t = y/3$. Substitute into $\cos^2 t + \sin^2 t = 1$ to get $x^2/25 + y^2/9 = 1$. The curve is an ellipse.'
          - problem: 'Eliminate the parameter from $x = 5\cos t$, $y = 5\sin t$.'
            answer: 'x^2 + y^2 = 25'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Square both equations: $x^2 = 25\cos^2 t$ and $y^2 = 25\sin^2 t$. Add them and use $\cos^2 t + \sin^2 t = 1$ to get $x^2 + y^2 = 25$. The curve is a circle.'
          - problem: 'The curve $x = 4\cos t + 1$, $y = 4\sin t - 3$ is a circle. Find its centre.'
            answer: '(1, -3)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'Write the equations as $x - 1 = 4\cos t$ and $y + 3 = 4\sin t$. Square and add to get $(x - 1)^2 + (y + 3)^2 = 16$. The circle has centre $(1, -3)$ and radius $4$.'
          - problem: 'What curve is traced by $x = 6\cos t$, $y = 6\sin t$ for $0 \le t \le 2\pi$?'
            answer: 'circle'
            answer_contract: {"kind":"label","options":[["circle","a circle"],["ellipse","an ellipse"]]}
            solution_sketch: 'Squaring and adding gives $x^2 + y^2 = 36$. The coefficients of $\cos t$ and $\sin t$ are equal, so the curve is a circle of radius $6$.'
          - problem: 'A Ferris wheel has radius 12 metres and its centre is 14 metres above the ground. A rider is at $x = 12\cos t$, $y = 14 + 12\sin t$, with $x$ and $y$ in metres. Find the equation of the circle on which the rider travels.'
            answer: 'x^2 + (y - 14)^2 = 144'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'Rewrite $y = 14 + 12\sin t$ as $y - 14 = 12\sin t$. Square both equations and add: $x^2 + (y - 14)^2 = 144(\cos^2 t + \sin^2 t) = 144$. The circle has radius $12$ metres and centre $14$ metres above the ground.'
          - problem: 'A running track is the ellipse $x = 60\cos t$, $y = 40\sin t$, with $x$ and $y$ in metres. How wide is the track, from its west edge to its east edge?'
            answer: '120'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Since $\cos t$ runs from $-1$ to $1$, $x$ runs from $-60$ to $60$. The width is $60 - (-60) = 120$ metres, which is twice the semi-axis $60$.'
          - problem: 'Eliminate $t$ from $x = 3\cos t$, $y = 2\sin t$. What is the equation of the curve in $x$ and $y$?'
            answer: 'x^2/9 + y^2/4 = 1'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'From $x = 3\cos t$ we get $\cos^2 t = x^2/9$, and from $y = 2\sin t$ we get $\sin^2 t = y^2/4$. So the equation is $x^2/9 + y^2/4 = 1$. The numbers $3$ and $2$ must be squared.'
          - problem: 'What curve is traced by $x = 3\cos t$, $y = 8\sin t$ for $0 \le t \le 2\pi$?'
            answer: 'ellipse'
            answer_contract: {"kind":"label","options":[["ellipse","an ellipse"],["circle","a circle"]]}
            solution_sketch: 'Divide to get $\cos t = x/3$ and $\sin t = y/8$. The identity gives $x^2/9 + y^2/64 = 1$. The denominators $9$ and $64$ differ, so the curve is an ellipse.'
        constraints: "use the Pythagorean identity; radii and semi-axes are small integers"
    diagnostic_exemplar:
      problem: 'Eliminate the parameter: $x = 4\cos t$, $y = 3\sin t$. What curve is it, and what point corresponds to $t = \frac{\pi}{2}$?'
      answer: '$\frac{x^2}{16} + \frac{y^2}{9} = 1$, an ellipse; at $t = \frac{\pi}{2}$ the point is $(0, 3)$'
      answer_contract: {kind: none}
      solution_sketch: 'Use $\cos^2t + \sin^2t = 1$ with $\cos t = x/4$ and $\sin t = y/3$.'
    anki_seeds:
      - front: "Standard parametrization of a circle of radius a centered at the origin?"
        back: '$x = a\cos t$, $y = a\sin t$, $0 \le t \le 2\pi$'
        type: basic
      - front: "When eliminating a parameter with a square root (x = sqrt t), the resulting equation needs..."
        back: "a domain restriction (only part of the curve is traced)"
        type: basic

  - id: parametric-derivatives
    name: Derivatives of Parametric Curves
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 180
    prerequisites:
      - id: parametric-curves-basics
        weight: 0.7
        key: true
      - id: chain-rule
        weight: 0.6
        key: true
      - id: derivatives-trig
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Slopes of parametric curves
        key_prerequisites: [parametric-curves-basics, chain-rule, derivatives-trig]
        exemplars:
          - problem: 'For $x = t^2$, $y = t^3$, find $\frac{dy}{dx}$ at $t = 1$.'
            answer: '3/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate: $\frac{dx}{dt} = 2t$ and $\frac{dy}{dt} = 3t^2$. Then $\frac{dy}{dx} = \frac{3t^2}{2t} = \frac{3t}{2}$. At $t = 1$ the slope is $\frac{3}{2}$.'
          - problem: 'For $x = \cos t$, $y = \sin t$, find $\frac{dy}{dx}$ at $t = \frac{\pi}{4}$.'
            answer: '-1'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\frac{dx}{dt} = -\sin t$ and $\frac{dy}{dt} = \cos t$, so $\frac{dy}{dx} = -\cot t$. At $t = \frac{\pi}{4}$ we have $\cot t = 1$, so the slope is $-1$.'
          - problem: 'For $x = t^3$ and $y = t^2$, find $\frac{dy}{dx}$ at $t = 2$.'
            answer: '1/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate: $\frac{dx}{dt} = 3t^2$ and $\frac{dy}{dt} = 2t$. Then $\frac{dy}{dx} = \frac{2t}{3t^2} = \frac{2}{3t}$. At $t = 2$ the slope is $\frac{2}{6} = \frac{1}{3}$.'
          - problem: 'A drone is $x = 4t$ metres across and $y = 20t - 5t^2$ metres high after $t$ seconds. What is the slope of its flight path at $t = 1$?'
            answer: '5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\frac{dx}{dt} = 4$ and $\frac{dy}{dt} = 20 - 10t$. The slope is the ratio $\frac{20 - 10t}{4}$, which at $t = 1$ is $\frac{10}{4} = \frac{5}{2}$.'
          - problem: 'For $x = t^2 + 3t$ and $y = t^3$, find $\frac{dy}{dx}$ at $t = 1$.'
            answer: '3/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate: $\frac{dx}{dt} = 2t + 3$ and $\frac{dy}{dt} = 3t^2$. Then $\frac{dy}{dx} = \frac{3t^2}{2t + 3}$. At $t = 1$ the slope is $\frac{3}{5}$.'
          - problem: 'For $x = \sin t$ and $y = \cos t$, find $\frac{dy}{dx}$ at $t = \frac{\pi}{3}$.'
            answer: '-sqrt(3)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\frac{dx}{dt} = \cos t$ and $\frac{dy}{dt} = -\sin t$, so $\frac{dy}{dx} = -\tan t$. At $t = \frac{\pi}{3}$ the slope is $-\tan\frac{\pi}{3} = -\sqrt{3}$.'
          - problem: 'A particle moves along $x = t^2$, $y = t^5$. What is the slope of its path at $t = -1$?'
            answer: '-5/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiate: $\frac{dx}{dt} = 2t$ and $\frac{dy}{dt} = 5t^4$. Then $\frac{dy}{dx} = \frac{5t^4}{2t} = \frac{5}{2}t^3$. At $t = -1$ the slope is $-\frac{5}{2}$.'
          - problem: 'What is the slope of $x = t^2 + 1$, $y = t^3$ at $t = 2$?'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The slope is $\frac{dy/dt}{dx/dt}$, a quotient, not a product. At $t = 2$ this is $\frac{3t^2}{2t} = \frac{12}{4} = 3$.'
        constraints: "dy/dt and dx/dt polynomial or single trig; evaluation points are small integers or special angles"
      - id: kp2
        name: Tangent lines and horizontal tangents
        key_prerequisites: [parametric-curves-basics, chain-rule]
        exemplars:
          - problem: 'Find an equation of the tangent line to the curve $x = t^2 + 1$, $y = t^3 - 2$ at $t = 2$.'
            answer: 'y = 3x - 9'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $t = 2$ the point is $(5, 6)$. The slope is $\frac{3t^2}{2t} = \frac{3t}{2} = 3$. Point-slope form gives $y - 6 = 3(x - 5)$, so $y = 3x - 9$.'
          - problem: 'Find all points on the curve $x = t^2 + 1$, $y = t^3 - 12t$ where the tangent line is horizontal.'
            answer: '(5, -16), (5, 16)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A horizontal tangent needs $\frac{dy}{dt} = 3t^2 - 12 = 0$ with $\frac{dx}{dt} = 2t \neq 0$. This gives $t = 2$ and $t = -2$, and $\frac{dx}{dt}$ is not zero at either. The points are $(5, -16)$ and $(5, 16)$.'
          - problem: 'Find an equation of the tangent line to the curve $x = t^2$, $y = t^3 + 1$ at $t = -1$.'
            answer: 'y = -3x/2 + 3/2'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $t = -1$ the point is $(1, 0)$. The slope is $\frac{3t^2}{2t} = \frac{3t}{2} = -\frac{3}{2}$. So $y = -\frac{3}{2}(x - 1)$, which is $y = -3x/2 + 3/2$.'
          - problem: 'At which point of the curve $x = \cos t$, $y = \sin t$ with $0 < t < \pi$ is the tangent line horizontal?'
            answer: '(0, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'A horizontal tangent needs $\frac{dy}{dt} = \cos t = 0$ with $\frac{dx}{dt} = -\sin t \neq 0$. In the interval this gives $t = \frac{\pi}{2}$. The point is $(\cos\frac{\pi}{2}, \sin\frac{\pi}{2}) = (0, 1)$.'
          - problem: 'A drone is $x = 4t$ metres across and $y = 20t - 5t^2$ metres high after $t$ seconds. How high is the drone when its path is horizontal?'
            answer: '20'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The path is horizontal when $\frac{dy}{dt} = 20 - 10t = 0$ and $\frac{dx}{dt} = 4 \neq 0$. This gives $t = 2$. Then $y = 20(2) - 5(4) = 20$ metres.'
          - problem: 'A roller-coaster car is at $x = 3t$ metres across and $y = t^3 - 6t^2 + 50$ metres high, $t$ seconds after it is released. At what time after release is the track horizontal?'
            answer: '4'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The track is horizontal when $\frac{dy}{dt} = 3t^2 - 12t = 3t(t - 4) = 0$ and $\frac{dx}{dt} = 3 \neq 0$. The root $t = 0$ is the release, so the track is horizontal again at $t = 4$ seconds.'
          - problem: 'Find an equation of the tangent line to the circle $x = 2\cos t$, $y = 2\sin t$ at $t = \frac{\pi}{4}$.'
            answer: 'y = -x + 2sqrt(2)'
            answer_contract: {"kind":"polynomial_relation"}
            solution_sketch: 'At $t = \frac{\pi}{4}$ the point is $(\sqrt{2}, \sqrt{2})$. The slope is $\frac{2\cos t}{-2\sin t} = -\cot t = -1$. So $y - \sqrt{2} = -(x - \sqrt{2})$, which is $y = -x + 2\sqrt{2}$.'
          - problem: 'Find all points on the curve $x = t^3 - 3t$, $y = t^2$ where the tangent line is vertical.'
            answer: '(-2, 1), (2, 1)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'A vertical tangent needs $\frac{dx}{dt} = 3t^2 - 3 = 0$ with $\frac{dy}{dt} = 2t \neq 0$. This gives $t = 1$ and $t = -1$, and $\frac{dy}{dt}$ is not zero at either. The points are $(1 - 3, 1) = (-2, 1)$ and $(-1 + 3, 1) = (2, 1)$.'
          - problem: 'Find the point on the curve $x = t^2$, $y = \sin t$ with $0 < t < \pi$ where the tangent line is horizontal.'
            answer: '(pi^2/4, 1)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'A horizontal tangent needs $\frac{dy}{dt} = \cos t = 0$ with $\frac{dx}{dt} = 2t \neq 0$. In the interval this gives $t = \frac{\pi}{2}$. Then $x = \frac{\pi^2}{4}$ and $y = 1$.'
        constraints: "horizontal tangents where dy/dt = 0 with dx/dt != 0; answers as points and line equations"
      - id: kp3
        name: Second derivatives and concavity
        key_prerequisites: [chain-rule]
        try_first:
          problem: 'For $x = 2t$, $y = 3t^2$, what is the derivative of $\frac{dy}{dx}$ with respect to $x$ at $t = 1$?'
          answer_contract: {"kind":"exact"}
          answer: '3/2'
          reveal: 'Here $\frac{dy}{dx} = 3t$. Differentiating gives $3$ per unit of $t$, but $x$ moves $2$ per unit of $t$, so we divide by $2$.'
        exemplars:
          - problem: 'For $x = t^2$, $y = t^3$, find $\frac{d^2y}{dx^2}$ in terms of $t$.'
            answer: '3/(4t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'First $\frac{dy}{dx} = \frac{3t^2}{2t} = \frac{3t}{2}$. Differentiate this with respect to $t$ to get $\frac{3}{2}$, then divide by $\frac{dx}{dt} = 2t$. So $\frac{d^2y}{dx^2} = \frac{3}{4t}$.'
          - problem: 'For $x = t^3$, $y = t^4$, find $\frac{d^2y}{dx^2}$ in terms of $t$.'
            answer: '4/(9t^2)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'First $\frac{dy}{dx} = \frac{4t^3}{3t^2} = \frac{4t}{3}$. Differentiate with respect to $t$ to get $\frac{4}{3}$, then divide by $\frac{dx}{dt} = 3t^2$. So $\frac{d^2y}{dx^2} = \frac{4}{9t^2}$.'
          - problem: 'For $x = t^2$, $y = t^4 + t^3$, find $\frac{d^2y}{dx^2}$ in terms of $t$.'
            answer: '2 + 3/(4t)'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'First $\frac{dy}{dx} = \frac{4t^3 + 3t^2}{2t} = 2t^2 + \frac{3}{2}t$. Differentiate with respect to $t$ to get $4t + \frac{3}{2}$, then divide by $2t$. So $\frac{d^2y}{dx^2} = 2 + \frac{3}{4t}$.'
          - problem: 'For $x = t^3$, $y = t^2$, is the curve concave up or concave down at $t = 1$?'
            answer: 'down'
            answer_contract: {"kind":"label","options":[["down","concave down"],["up","concave up"]]}
            solution_sketch: 'First $\frac{dy}{dx} = \frac{2}{3t}$. Differentiating gives $-\frac{2}{3t^2}$, and dividing by $\frac{dx}{dt} = 3t^2$ gives $\frac{d^2y}{dx^2} = -\frac{2}{9t^4}$. This is negative at $t = 1$, so the curve is concave down.'
          - problem: 'For $x = 2t + 1$, $y = t^3$, find $\frac{d^2y}{dx^2}$ at $t = 2$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $\frac{dy}{dx} = \frac{3t^2}{2}$. Differentiate with respect to $t$ to get $3t$, then divide by $\frac{dx}{dt} = 2$. This gives $\frac{d^2y}{dx^2} = \frac{3t}{2}$, which equals $3$ at $t = 2$.'
          - problem: 'A projectile is at $x = 4t$ metres across and $y = 20t - 5t^2$ metres high after $t$ seconds. Find $\frac{d^2y}{dx^2}$ for its path.'
            answer: '-5/8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'First $\frac{dy}{dx} = \frac{20 - 10t}{4} = 5 - \frac{5}{2}t$. Differentiate with respect to $t$ to get $-\frac{5}{2}$, then divide by $\frac{dx}{dt} = 4$. So $\frac{d^2y}{dx^2} = -\frac{5}{8}$ for every $t$.'
          - problem: 'A roller-coaster track is $x = 2t$, $y = t^3 - 6t^2 + 9t$, with lengths in metres and $t \ge 0$ in seconds. For which $t$ is the track concave up?'
            answer: 't > 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'First $\frac{dy}{dx} = \frac{3t^2 - 12t + 9}{2}$. Differentiate with respect to $t$ to get $3t - 6$, then divide by $\frac{dx}{dt} = 2$. So $\frac{d^2y}{dx^2} = \frac{3t - 6}{2}$, which is positive for $t > 2$.'
          - problem: 'What is $\frac{d^2y}{dx^2}$ for $x = t^2$, $y = t^5$, given $\frac{dy}{dx} = \frac{5}{2}t^3$?'
            answer: '15t/4'
            answer_contract: {"kind":"function","vars":["t"]}
            solution_sketch: 'The derivative of $\frac{dy}{dx}$ with respect to $t$ is $\frac{15}{2}t^2$, but the second derivative is with respect to $x$. Divide by $\frac{dx}{dt} = 2t$ to get $\frac{15}{4}t$.'
          - problem: 'For $x = t^2$, $y = t^3 - 3t$, for which $t$ is the curve concave up?'
            answer: 't > 0'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'First $\frac{dy}{dx} = \frac{3t^2 - 3}{2t}$. Then $\frac{d^2y}{dx^2} = \frac{3t^2 + 3}{4t^3}$. The numerator is always positive, so the sign is the sign of $t$, and the curve is concave up for $t > 0$.'
        constraints: "second derivative via d(dy/dx)/dt divided by dx/dt; polynomial parametrizations only"
    diagnostic_exemplar:
      problem: 'For $x = t^2$, $y = t^3 - 3t$, find $\frac{d^2y}{dx^2}$ as a function of $t$, and say whether the curve is concave up at $t = 2$.'
      answer: '$\frac{d^2y}{dx^2} = \frac{3t^2 + 3}{4t^3}$, which is $\frac{15}{32}$ at $t = 2$; positive, so the curve is concave up there'
      answer_contract: {kind: none}
      solution_sketch: '$\frac{dy}{dx} = \frac{3t^2 - 3}{2t}$; differentiate that in $t$ and divide by $\frac{dx}{dt} = 2t$.'
    anki_seeds:
      - front: "Slope of a parametric curve (x(t), y(t))?"
        back: '$\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$ (where $dx/dt \neq 0$)'
        type: basic
      - front: "Second derivative of a parametric curve?"
        back: '$\frac{d^2y}{dx^2} = \frac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{dx/dt}$'
        type: basic

  - id: parametric-equations
    name: Parametric Equations and Their Calculus
    core: true
    difficulty: 0.63
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: parametric-derivatives
        weight: 0.8
        key: true
      - id: arc-length
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Parametric arc length
        key_prerequisites: [parametric-derivatives, arc-length]
        exemplars:
          - problem: 'Find the length of the curve $x = 3t^2$, $y = 2t^3$ for $0 \le t \le 1$.'
            answer: '4sqrt(2) - 2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x'' = 6t$ and $y'' = 6t^2$, so the speed is $\sqrt{36t^2 + 36t^4} = 6t\sqrt{1 + t^2}$. With $u = 1 + t^2$ the integral $\int_0^1 6t\sqrt{1 + t^2}\,dt$ becomes $\int_1^2 3\sqrt{u}\,du = 2(2\sqrt{2} - 1)$. The length is $4\sqrt{2} - 2$.'
          - problem: 'Use the arc length formula to find the length of the circle $x = 3\cos t$, $y = 3\sin t$ for $0 \le t \le 2\pi$.'
            answer: '6pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x'' = -3\sin t$ and $y'' = 3\cos t$, so the speed is $\sqrt{9\sin^2 t + 9\cos^2 t} = 3$. The length is $\int_0^{2\pi} 3\,dt = 6\pi$. This agrees with the circumference $2\pi r = 6\pi$.'
          - problem: 'A robot moves along the line $x = 1 + 3t$, $y = 2 + 4t$, with $x$ and $y$ in metres and $t$ in seconds. How far does it travel from $t = 0$ to $t = 3$?'
            answer: '15'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Here $x'' = 3$ and $y'' = 4$, so the speed is $\sqrt{3^2 + 4^2} = 5$ metres per second. The distance is $\int_0^3 5\,dt = 15$. The robot travels 15 metres.'
          - problem: 'Find the length of the curve $x = t^2$, $y = t^3$ for $0 \le t \le 1$.'
            answer: '(13sqrt(13) - 8)/27'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x'' = 2t$ and $y'' = 3t^2$, so the speed is $t\sqrt{4 + 9t^2}$ for $t \ge 0$. With $u = 4 + 9t^2$ we get $du = 18t\,dt$, so $L = \frac{1}{18}\int_4^{13}\sqrt{u}\,du = \frac{1}{27}(13\sqrt{13} - 8)$.'
          - problem: 'Find the length of one arch of the cycloid $x = t - \sin t$, $y = 1 - \cos t$ for $0 \le t \le 2\pi$.'
            answer: '8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x'' = 1 - \cos t$ and $y'' = \sin t$, so the speed squared is $2 - 2\cos t = 4\sin^2(t/2)$. The speed is $2\sin(t/2)$ on $[0, 2\pi]$. Then $L = \int_0^{2\pi} 2\sin(t/2)\,dt = 8$.'
          - problem: 'A ramp has the shape $x = t^2$, $y = \frac{2}{3}t^3$ for $0 \le t \le 1$, with lengths in metres. How long is the ramp surface?'
            answer: '(2/3)(2sqrt(2) - 1)'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Here $x'' = 2t$ and $y'' = 2t^2$, so the speed is $2t\sqrt{1 + t^2}$. With $u = 1 + t^2$ the length is $\int_1^2 \sqrt{u}\,du = \frac{2}{3}(2\sqrt{2} - 1)$ metres.'
          - problem: 'What is the length of $x = 3t$, $y = 4t$ for $0 \le t \le 2$?'
            answer: '10'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The speed is $\sqrt{3^2 + 4^2} = 5$, not $3 + 4$. So the length is $\int_0^2 5\,dt = 10$.'
          - problem: 'A valve on the rim of a wheel of radius 2 metres traces $x = 2(t - \sin t)$, $y = 2(1 - \cos t)$ during one full turn, $0 \le t \le 2\pi$. How far does the valve travel along its path?'
            answer: '16'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Here $x'' = 2(1 - \cos t)$ and $y'' = 2\sin t$, so the speed is $2\sqrt{2 - 2\cos t} = 4\sin(t/2)$ on $[0, 2\pi]$. The length is $\int_0^{2\pi} 4\sin(t/2)\,dt = 16$. This is twice the cycloid length $8$ for radius $1$.'
        constraints: "speed sqrt((dx/dt)^2 + (dy/dt)^2) must simplify to a perfect square or fall to one u-substitution"
      - id: kp2
        name: Speed along a curve
        key_prerequisites: [parametric-derivatives]
        exemplars:
          - problem: 'Find the speed of a particle with $x = t^2$, $y = t^3$ at $t = 1$.'
            answer: 'sqrt(13)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\frac{dx}{dt} = 2t$ and $\frac{dy}{dt} = 3t^2$. At $t = 1$ these are $2$ and $3$. The speed is $\sqrt{2^2 + 3^2} = \sqrt{13}$.'
          - problem: 'A particle moves along $x = 3t$, $y = 4t$, with lengths in metres and $t$ in seconds. What is its speed?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'Here $\frac{dx}{dt} = 3$ and $\frac{dy}{dt} = 4$. The speed is $\sqrt{3^2 + 4^2} = \sqrt{25} = 5$ metres per second at every time.'
          - problem: 'A particle moves along $x = 3t^2$, $y = 4t^2$. Find its speed at $t = 2$.'
            answer: '20'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\frac{dx}{dt} = 6t$ and $\frac{dy}{dt} = 8t$, which are $12$ and $16$ at $t = 2$. The speed is $\sqrt{12^2 + 16^2} = \sqrt{400} = 20$.'
          - problem: 'A particle moves along $x = 5t$, $y = 12t$, with lengths in metres and $t$ in seconds. How far does it travel from $t = 0$ to $t = 3$?'
            answer: '39'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'Here $\frac{dx}{dt} = 5$ and $\frac{dy}{dt} = 12$, so the speed is $\sqrt{25 + 144} = 13$ metres per second at every time. The distance is the speed times the time, $13 \cdot 3 = 39$ metres.'
          - problem: 'A particle moves along $x = 2\cos t$, $y = 2\sin t$. Find its speed at $t = \frac{\pi}{4}$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\frac{dx}{dt} = -2\sin t$ and $\frac{dy}{dt} = 2\cos t$. The speed is $\sqrt{4\sin^2 t + 4\cos^2 t} = 2$. It equals $2$ at $t = \frac{\pi}{4}$ and at every other time.'
          - problem: 'A particle moves along $x = e^t$, $y = e^{-t}$. Find its speed at $t = 0$.'
            answer: 'sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $\frac{dx}{dt} = e^t$ and $\frac{dy}{dt} = -e^{-t}$. At $t = 0$ these are $1$ and $-1$. The speed is $\sqrt{1^2 + (-1)^2} = \sqrt{2}$.'
          - problem: 'A drone flies along $x = 3t$, $y = 4t$, with lengths in metres and $t$ in seconds. How long does it take to fly 45 metres?'
            answer: '9'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The speed is $\sqrt{3^2 + 4^2} = 5$ metres per second at every time. The time is the distance divided by the speed: $45 \div 5 = 9$ seconds.'
          - problem: 'A skater moves along $x = 6t$, $y = 8t$, with lengths in metres and $t$ in seconds. How far does she go in 2 minutes?'
            answer: '1200'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The speed is $\sqrt{6^2 + 8^2} = 10$ metres per second. Two minutes is $120$ seconds, so the distance is $10 \cdot 120 = 1200$ metres.'
          - problem: 'Does a particle that moves along $x = 3\cos t$, $y = 3\sin t$ have constant speed?'
            answer: 'yes'
            answer_contract: {"kind":"label","options":[["yes","it is constant","constant"],["no","it is not constant","it varies"]]}
            solution_sketch: 'Here $\frac{dx}{dt} = -3\sin t$ and $\frac{dy}{dt} = 3\cos t$. The speed is $\sqrt{9\sin^2 t + 9\cos^2 t} = 3$, which does not depend on $t$. So the speed is constant.'
        constraints: "speed at a point or constant-speed distance; radicands are clean integers"
      - id: kp3
        name: "Capstone: length and area for parametric curves"
        key_prerequisites: [parametric-derivatives, arc-length, definite-integrals-ftc]
        try_first:
          problem: 'The curve $x = 2t$, $y = 5$ for $0 \le t \le 3$ is a horizontal segment. What is the area between it and the $x$-axis?'
          answer_contract: {"kind":"exact"}
          answer: '30'
          reveal: 'The segment runs from $x = 0$ to $x = 6$ at height $5$, so the area is $6 \cdot 5 = 30$. The formula $\int y(t)\,x''(t)\,dt = \int_0^3 5 \cdot 2\,dt$ gives the same value.'
        exemplars:
          - problem: 'Find the length of the curve $x = e^t\cos t$, $y = e^t\sin t$ for $0 \le t \le \ln 2$.'
            answer: 'sqrt(2)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $(x'')^2 + (y'')^2 = 2e^{2t}$, so the speed is $\sqrt{2}\,e^t$. The length is $\int_0^{\ln 2} \sqrt{2}\,e^t\,dt = \sqrt{2}(2 - 1) = \sqrt{2}$.'
          - problem: 'Find the area between the curve $x = t^2$, $y = t$ for $0 \le t \le 2$ and the $x$-axis.'
            answer: '16/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $\int y\,dx = \int_0^2 y(t)\,x''(t)\,dt = \int_0^2 t \cdot 2t\,dt$. This equals $\frac{2t^3}{3}$ evaluated from $0$ to $2$, which is $\frac{16}{3}$.'
          - problem: 'Find the length of the curve $x = e^{3t/4}\cos t$, $y = e^{3t/4}\sin t$ for $0 \le t \le \frac{4}{3}\ln 3$.'
            answer: '10/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Differentiating gives $(x'')^2 + (y'')^2 = \left(\frac{9}{16} + 1\right)e^{3t/2} = \frac{25}{16}e^{3t/2}$, so the speed is $\frac{5}{4}e^{3t/4}$. The length is $\frac{5}{4}\cdot\frac{4}{3}(e^{\ln 3} - 1) = \frac{5}{3}(3 - 1) = \frac{10}{3}$.'
          - problem: 'Find the area between the curve $x = t^3$, $y = t$ for $0 \le t \le 2$ and the $x$-axis.'
            answer: '12'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x'' = 3t^2$, so the area is $\int_0^2 t \cdot 3t^2\,dt = \int_0^2 3t^3\,dt$. This equals $\frac{3t^4}{4}$ evaluated from $0$ to $2$, which is $12$.'
          - problem: 'A curve is given by $x = 3t^2$, $y = t + 1$ for $0 \le t \le 2$. Find the area between the curve and the $x$-axis.'
            answer: '28'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x'' = 6t$, so the area is $\int_0^2 (t + 1)\cdot 6t\,dt = \int_0^2 (6t^2 + 6t)\,dt$. This equals $2t^3 + 3t^2$ evaluated from $0$ to $2$, which is $16 + 12 = 28$.'
          - problem: 'The cross-section of a tunnel is the region between the $x$-axis and the curve $x = 2t$, $y = 9 - t^2$ for $0 \le t \le 3$, with lengths in metres. How long is a tunnel with this cross-section that has volume 180 cubic metres?'
            answer: '5'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The cross-section area is $\int_0^3 (9 - t^2)\cdot 2\,dt = 2(27 - 9) = 36$ square metres. The volume is area times length, so the length is $180 \div 36 = 5$ metres.'
          - problem: 'A spiral handrail follows $x = e^t\cos t$, $y = e^t\sin t$ for $0 \le t \le \ln 3$, with lengths in metres. How long is the handrail?'
            answer: '2sqrt(2)'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The speed is $\sqrt{2e^{2t}} = \sqrt{2}\,e^t$. The length is $\int_0^{\ln 3} \sqrt{2}\,e^t\,dt = \sqrt{2}(3 - 1) = 2\sqrt{2}$ metres.'
          - problem: 'What is the area under $x = t^2$, $y = t^3$ for $0 \le t \le 2$?'
            answer: '64/5'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $\int y\,dx$, and $dx = x''(t)\,dt = 2t\,dt$. So the area is $\int_0^2 t^3 \cdot 2t\,dt = \frac{2t^5}{5}$ evaluated from $0$ to $2$, which is $\frac{64}{5}$.'
          - problem: 'The area between the curve $x = t^2$, $y = kt$ for $0 \le t \le 3$ and the $x$-axis equals $54$. Find $k$.'
            answer: '3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The area is $\int_0^3 kt \cdot 2t\,dt = \frac{2kt^3}{3}$ evaluated from $0$ to $3$, which is $18k$. Setting $18k = 54$ gives $k = 3$.'
        constraints: "exponential-trig spirals with perfect-square speed; area via int y(t) x'(t) dt with polynomial integrand"
    diagnostic_exemplar:
      problem: 'Find the length of the curve $x = 3t^2$, $y = 2t^3$ for $0 \le t \le 2$, and the speed at $t = 2$.'
      answer: 'length $2(5\sqrt{5} - 1)$; speed at $t = 2$ is $12\sqrt{5}$'
      answer_contract: {kind: none}
      solution_sketch: 'The speed is $\sqrt{36t^2 + 36t^4} = 6t\sqrt{1+t^2}$, so the length is $\left[2(1+t^2)^{3/2}\right]_0^2 = 2(5\sqrt5 - 1)$.'
    anki_seeds:
      - front: "Parametric arc length formula on [a, b]?"
        back: '$L = \int_a^b \sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2} \, dt$'
        type: basic
      - front: "Speed of a particle on (x(t), y(t))?"
        back: '$\sqrt{\left(\frac{dx}{dt}\right)^2 + \left(\frac{dy}{dt}\right)^2}$ (the integrand of arc length)'
        type: basic

  - id: parametric-motion
    name: Parametric Motion
    core: false                # application of the parametric representation
    difficulty: 0.66
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: parametric-equations
        weight: 0.7
        key: true
      - id: motion-along-a-line
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Velocity components and speed
        key_prerequisites: [parametric-equations, motion-along-a-line]
        exemplars:
          - problem: 'A particle moves along $x = t^3 - 6t$, $y = t^2 + t$. Find its velocity vector at $t = 2$.'
            answer: '(6, 5)'
            answer_contract: {"kind":"coordinates","arity":2}
            solution_sketch: 'The velocity components are the derivatives $x''(t) = 3t^2 - 6$ and $y''(t) = 2t + 1$. At $t = 2$ these are $6$ and $5$. The velocity vector is $(6, 5)$.'
          - problem: 'A particle moves along $x = t^3 - 2t$, $y = t^2 + 4$. Find its speed at $t = 0$.'
            answer: '2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivatives are $x''(t) = 3t^2 - 2$ and $y''(t) = 2t$. At $t = 0$ they are $-2$ and $0$. The speed is $\sqrt{(-2)^2 + 0^2} = 2$.'
          - problem: 'A particle moves along $x = t^3 - 3t^2 - 9t$, $y = t^2 - 6t$. At what time is the particle at rest?'
            answer: '3'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The particle is at rest when both $x''(t) = 3t^2 - 6t - 9 = 3(t - 3)(t + 1)$ and $y''(t) = 2t - 6 = 2(t - 3)$ are zero. The first is zero at $t = 3$ or $t = -1$, the second only at $t = 3$. So the particle rests at $t = 3$.'
          - problem: 'A drone is at $x = 4t$ metres across and $y = 20t - 5t^2$ metres high after $t$ seconds. How fast is it moving at $t = 1$?'
            answer: '2sqrt(29)'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The velocity components are $x''(t) = 4$ and $y''(t) = 20 - 10t$, which are $4$ and $10$ at $t = 1$. The speed is $\sqrt{4^2 + 10^2} = \sqrt{116} = 2\sqrt{29}$ metres per second.'
          - problem: 'A ball is thrown from a balcony. After $t$ seconds it is $x = 6t$ metres from the wall, measured horizontally, and $y = 15 + 10t - 5t^2$ metres above the ground. How fast is the ball moving when it hits the ground?'
            answer: '2sqrt(109)'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The ball hits the ground when $y = 0$, which gives $t^2 - 2t - 3 = 0$ and so $t = 3$. The velocity components are $x''(t) = 6$ and $y''(t) = 10 - 10t = -20$ at $t = 3$. The speed is $\sqrt{6^2 + 20^2} = \sqrt{436} = 2\sqrt{109}$ metres per second.'
          - problem: 'A particle moves along $x = 4t - t^3$, $y = t^2 + 3t$. Find its speed at $t = 2$.'
            answer: 'sqrt(113)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The derivatives are $x''(t) = 4 - 3t^2$ and $y''(t) = 2t + 3$. At $t = 2$ they are $-8$ and $7$. The speed is $\sqrt{(-8)^2 + 7^2} = \sqrt{113}$.'
          - problem: 'A particle moves along $x = t^3 - 3t^2 + 1$, $y = t^2 - 4t + 5$. At what time is the particle at rest?'
            answer: '2'
            answer_contract: {"kind":"unit","quantity":"time","unit":"s","allow_omitted":true}
            solution_sketch: 'The particle is at rest when $x''(t) = 3t^2 - 6t = 3t(t - 2)$ and $y''(t) = 2t - 4 = 2(t - 2)$ are both zero. The first is zero at $t = 0$ or $t = 2$, the second only at $t = 2$. So the particle rests at $t = 2$.'
          - problem: 'What is the speed of $x = 2t^3 - 3t$, $y = t^2 + 5$ at $t = 1$?'
            answer: 'sqrt(13)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The components at $t = 1$ are $x''(1) = 6 - 3 = 3$ and $y''(1) = 2$. The speed is the length of the velocity vector, $\sqrt{3^2 + 2^2} = \sqrt{13}$.'
        constraints: "polynomial components of degree <= 3; rest requires both derivatives to vanish together"
      - id: kp2
        name: Direction of motion
        key_prerequisites: [parametric-equations]
        exemplars:
          - problem: 'For $x = t^2 - 4t$, $y = t^3 - 3t$, when is the particle moving left?'
            answer: 't < 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Moving left means $x''(t) < 0$. Here $x''(t) = 2t - 4$, which is negative exactly when $t < 2$.'
          - problem: 'For $x = t^2 - 4t$, $y = t^3 - 3t$, when is the particle moving up?'
            answer: 't < -1 or t > 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Moving up means $y''(t) > 0$. Here $y''(t) = 3t^2 - 3 = 3(t - 1)(t + 1)$, which is positive when $t < -1$ or $t > 1$.'
          - problem: 'A particle has $x = t^2 - 6t$ and $y = t^2 - 2t$. When is it moving right and upward?'
            answer: 't > 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Right and upward means $x''(t) = 2t - 6 > 0$ and $y''(t) = 2t - 2 > 0$. The first holds for $t > 3$ and the second for $t > 1$. Both hold when $t > 3$.'
          - problem: 'A ball is thrown from a balcony. After $t \ge 0$ seconds it is $x = 6t$ metres from the wall and $y = 15 + 10t - 5t^2$ metres above the ground. When is the ball moving downward?'
            answer: 't > 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Moving downward means $y''(t) < 0$. Here $y''(t) = 10 - 10t$, which is negative exactly when $t > 1$. So the ball falls after $1$ second.'
          - problem: 'A particle follows $x = t^3 - 3t^2$ and $y = t^2 - 5t$. When is it moving left and downward?'
            answer: '0 < t < 2'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Left and downward means $x''(t) = 3t(t - 2) < 0$ and $y''(t) = 2t - 5 < 0$. The first holds for $0 < t < 2$ and the second for $t < \frac{5}{2}$. Both hold for $0 < t < 2$.'
          - problem: 'A hiker walks so that, $t > 0$ hours after leaving camp, she is $x = 12t - t^3$ kilometres east and $y = t^2 - 2t$ kilometres north of the camp. When is she heading east and south?'
            answer: '0 < t < 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'East and south means $x''(t) = 12 - 3t^2 > 0$ and $y''(t) = 2t - 2 < 0$. For $t > 0$ the first holds when $t < 2$ and the second when $t < 1$. Both hold for $0 < t < 1$.'
          - problem: 'For which values of $t$ is the particle with $x = t^2 - 6t$ moving left?'
            answer: 't < 3'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Moving left means the velocity $x''(t) = 2t - 6$ is negative, not the position $x$. This holds exactly when $t < 3$.'
          - problem: 'For $x = t^3 - 3t$ and $y = t^2 - 4t$, when is the particle moving left?'
            answer: '-1 < t < 1'
            answer_contract: {"kind":"inequality_union"}
            solution_sketch: 'Moving left means $x''(t) = 3t^2 - 3 < 0$. Since $3t^2 - 3 = 3(t - 1)(t + 1)$, this holds exactly when $-1 < t < 1$.'
        constraints: "sign analysis of x'(t) and y'(t); answers as t-intervals"
      - id: kp3
        name: Distance traveled vs. displacement
        key_prerequisites: [parametric-equations]
        exemplars:
          - problem: 'Find the distance traveled by a particle with $x = t^2$, $y = \frac{2}{3}t^3$ for $0 \le t \le 1$.'
            answer: '(2/3)(2sqrt(2) - 1)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The speed is $\sqrt{4t^2 + 4t^4} = 2t\sqrt{1 + t^2}$. With $u = 1 + t^2$, the distance is $\int_1^2 \sqrt{u}\,du = \frac{2}{3}(2\sqrt{2} - 1)$.'
          - problem: 'A particle moves along $x = \cos t$, $y = \sin t$ for $0 \le t \le \frac{\pi}{2}$. How far does it travel?'
            answer: 'pi/2'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The speed is $\sqrt{\sin^2 t + \cos^2 t} = 1$. The distance is $\int_0^{\pi/2} 1\,dt = \frac{\pi}{2}$, which is a quarter of the unit circle.'
          - problem: 'A particle moves along $x = t$, $y = \frac{2}{3}t^{3/2}$ for $0 \le t \le 3$. Find the distance traveled.'
            answer: '14/3'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x''(t) = 1$ and $y''(t) = \sqrt{t}$, so the speed is $\sqrt{1 + t}$. The distance is $\int_0^3 \sqrt{1 + t}\,dt = \frac{2}{3}(8 - 1) = \frac{14}{3}$.'
          - problem: 'A particle moves along $x = t^2$, $y = \frac{2}{3}t^3$ for $0 \le t \le 2$, with lengths in metres. How far is it from its starting point at $t = 2$?'
            answer: '20/3'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'At $t = 0$ the particle is at $(0, 0)$ and at $t = 2$ it is at $(4, \frac{16}{3})$. The straight-line distance is $\sqrt{16 + \frac{256}{9}} = \sqrt{\frac{400}{9}} = \frac{20}{3}$ metres.'
          - problem: 'A particle moves along $x = 3t^2$, $y = t^3$ for $0 \le t \le 1$. Is the distance it travels equal to the straight-line distance from its start to its end?'
            answer: 'no'
            answer_contract: {"kind":"label","options":[["no","not equal","it is not equal"],["yes","equal","it is equal"]]}
            solution_sketch: 'The straight-line distance from $(0, 0)$ to $(3, 1)$ is $\sqrt{10} \approx 3.162$. The distance along the path is $5\sqrt{5} - 8 \approx 3.180$. The path is curved, so the two are not equal.'
          - problem: 'A particle moves along $x = 3t^2$, $y = t^3$ for $0 \le t \le 1$. Find the distance it travels.'
            answer: '5sqrt(5) - 8'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The speed is $\sqrt{36t^2 + 9t^4} = 3t\sqrt{4 + t^2}$. With $u = 4 + t^2$, the distance is $\int_4^5 \frac{3}{2}\sqrt{u}\,du = 5^{3/2} - 4^{3/2} = 5\sqrt{5} - 8$.'
          - problem: 'A particle moves along $x = t^2$, $y = \frac{2}{3}t^3$, with lengths in metres and $t$ in seconds. What is its average speed from $t = 0$ to $t = 2$?'
            answer: '(5sqrt(5) - 1)/3'
            answer_contract: {"kind":"unit","quantity":"speed","unit":"m/s","allow_omitted":true}
            solution_sketch: 'The speed is $2t\sqrt{1 + t^2}$, so the distance is $\int_0^2 2t\sqrt{1 + t^2}\,dt = \frac{2}{3}(5\sqrt{5} - 1)$ metres. The average speed is the distance divided by the time: $\frac{2}{3}(5\sqrt{5} - 1) \div 2 = \frac{5\sqrt{5} - 1}{3}$ metres per second.'
          - problem: 'A valve on the rim of a bicycle wheel of radius 1 metre traces $x = t - \sin t$, $y = 1 - \cos t$ during one full turn, $0 \le t \le 2\pi$. How much farther has the valve traveled along its path than the straight-line distance from its start to its end?'
            answer: '8 - 2pi'
            answer_contract: {"kind":"unit","quantity":"length","unit":"m","allow_omitted":true}
            solution_sketch: 'The path length is $\int_0^{2\pi} 2\sin(t/2)\,dt = 8$ metres. At $t = 2\pi$ the valve is at $(2\pi, 0)$, so the straight-line distance from $(0, 0)$ is $2\pi$. The difference is $8 - 2\pi$ metres.'
          - problem: 'What is the distance traveled along $x = \cos t$, $y = \sin t$ for $0 \le t \le \pi$?'
            answer: 'pi'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'The straight-line distance from $(1, 0)$ to $(-1, 0)$ is the displacement, not the distance traveled. The particle goes around a half circle at speed $1$, so the distance is $\int_0^\pi 1\,dt = \pi$.'
          - problem: 'A particle moves along $x = t^2$, $y = \frac{2}{3}(t^2 + 3)^{3/2}$ for $0 \le t \le 2$. Find the distance traveled.'
            answer: '(2/3)(16sqrt(2) - 8)'
            answer_contract: {"kind":"exact"}
            solution_sketch: 'Here $x''(t) = 2t$ and $y''(t) = 2t\sqrt{t^2 + 3}$, so the speed is $2t\sqrt{t^2 + 4}$. With $u = t^2 + 4$ the distance is $\int_4^8 \sqrt{u}\,du = \frac{2}{3}(16\sqrt{2} - 8)$.'
        constraints: "distance via the speed integral; displacement via endpoints; integrals fall to one u-substitution"
    diagnostic_exemplar:
      problem: 'A particle traces $x = t^2 - 4t$, $y = t^2$ for $0 \le t \le 4$. When is it moving left, and what is the magnitude of its displacement over the interval?'
      answer: 'It moves left for $t < 2$ (where $dx/dt = 2t - 4 < 0$); the displacement is $(0, 16)$, of magnitude $16$'
      answer_contract: {kind: none}
      solution_sketch: 'Horizontal motion is governed by the sign of $\frac{dx}{dt} = 2t - 4$; displacement compares only the endpoints $(0, 0)$ and $(0, 16)$.'
    anki_seeds:
      - front: "A parametric particle is at rest when..."
        back: "both dx/dt = 0 and dy/dt = 0 at the same time"
        type: basic
      - front: "Distance traveled vs. displacement for parametric motion?"
        back: "distance = integral of speed; displacement = straight-line distance between start and end points"
        type: basic

  - id: plotting-polar-points
    name: Polar Points and Coordinate Conversions
    core: true
    difficulty: 0.55
    drill: false
    answer_kind: expression
    expected_time_secs: 120
    prerequisites:
      - id: unit-circle
        weight: 0.7
        key: true
      - id: pythagorean-theorem
        weight: 0.4
      - id: right-triangle-trig
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Plotting and multiple representations
        key_prerequisites: [unit-circle]
        try_first:
          problem: 'The polar point $\left(-2,\frac{\pi}{2}\right)$ has a negative radius. What is its $y$-coordinate?'
          answer_contract: {"kind": "exact"}
          answer: '-2'
          reveal: 'The ray at angle $\frac{\pi}{2}$ points straight up, and a negative $r$ moves the point $2$ units the other way, so it sits at $(0,-2)$. A negative radius reverses the direction of the ray.'
        exemplars:
          - problem: 'Give another representation of the polar point $\left(3,\frac{3\pi}{4}\right)$ with $r<0$ and $0\le\theta<2\pi$.'
            answer: '(-3, 7pi/4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'A negative radius sends the point along the opposite ray, so negate $r$ and add $\pi$ to the angle. This gives $r=-3$ and $\theta=\frac{3\pi}{4}+\pi=\frac{7\pi}{4}$, which lies in $[0,2\pi)$. The representation is $\left(-3,\frac{7\pi}{4}\right)$.'
          - problem: 'The polar point $\left(-3,\frac{\pi}{3}\right)$ is plotted. In which quadrant does it lie?'
            answer: 'quadrant III'
            answer_contract: {"kind": "label", "options": [["quadrant I", "I", "1", "first quadrant", "the first quadrant", "quadrant 1"], ["quadrant II", "II", "2", "second quadrant", "the second quadrant", "quadrant 2"], ["quadrant III", "III", "3", "third quadrant", "the third quadrant", "quadrant 3"], ["quadrant IV", "IV", "4", "fourth quadrant", "the fourth quadrant", "quadrant 4"]]}
            solution_sketch: 'The ray at angle $\frac{\pi}{3}$ points into quadrant I. Since $r=-3$ is negative, the point lies $3$ units along the opposite ray, at angle $\frac{4\pi}{3}$, which is in quadrant III. Check: $x=-3\cos\frac{\pi}{3}=-\frac{3}{2}$ and $y=-3\sin\frac{\pi}{3}<0$.'
          - problem: 'A radar station reports an aircraft at the polar position $\left(12,\frac{7\pi}{6}\right)$ (distance in km, $\theta$ measured from east). A second station reports the same aircraft as $(-12,\theta)$. What is $\theta$ if $0\le\theta<2\pi$?'
            answer: 'pi/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A negative radius means the point lies on the opposite ray, so the second angle differs from the first by $\pi$. Subtract $\pi$: $\frac{7\pi}{6}-\pi=\frac{\pi}{6}$, which lies in $[0,2\pi)$. The second station reports $\theta=\frac{\pi}{6}$.'
          - problem: 'The polar point $\left(5,\frac{\pi}{6}\right)$ is plotted. Find an equivalent representation $(r,\theta)$ with $r>0$ and $-2\pi\le\theta<0$.'
            answer: '(5, -11pi/6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Angles that differ by a full turn name the same ray, so subtract $2\pi$ from the angle. This gives $\frac{\pi}{6}-2\pi=-\frac{11\pi}{6}$, which lies in $[-2\pi,0)$. Keep $r=5$. The representation is $\left(5,-\frac{11\pi}{6}\right)$.'
          - problem: 'Do the polar points $\left(-2,\frac{5\pi}{4}\right)$ and $\left(2,\frac{\pi}{4}\right)$ name the same point?'
            answer: 'yes'
            answer_contract: {"kind": "label", "options": [["yes", "the same point", "same point", "they are the same"], ["no", "different points", "not the same point", "they are different"]]}
            solution_sketch: 'Negate the radius of the first point and add $\pi$ to its angle: $-2$ becomes $2$ and $\frac{5\pi}{4}$ turns into $\frac{5\pi}{4}+\pi$, which is $\frac{9\pi}{4}$. That angle differs from $\frac{\pi}{4}$ by $2\pi$, so the points are the same.'
          - problem: 'A ship is at the polar position $\left(8,\frac{\pi}{4}\right)$ relative to a lighthouse (distance in km, $\theta$ measured from east). A second ship is the same distance from the lighthouse in exactly the opposite direction. Give its polar coordinates $(r,\theta)$ with $r>0$ and $0\le\theta<2\pi$.'
            answer: '(8, 5pi/4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The opposite direction is a turn of $\pi$, so the angle becomes $\frac{\pi}{4}+\pi=\frac{5\pi}{4}$. The distance stays $8$ km, so $r=8$. The second ship is at $\left(8,\frac{5\pi}{4}\right)$.'
          - problem: 'Give polar coordinates $(r,\theta)$ with $r>0$ and $0\le\theta<2\pi$ for the point $\left(-4,-\frac{\pi}{6}\right)$.'
            answer: '(4, 5pi/6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Negate the negative radius to get $r=4$ and add $\pi$ to the angle: $-\frac{\pi}{6}+\pi=\frac{5\pi}{6}$. This angle lies in $[0,2\pi)$. The coordinates are $\left(4,\frac{5\pi}{6}\right)$.'
          - problem: 'A surveyor records a point as $\left(6,\frac{13\pi}{6}\right)$. Give polar coordinates $(r,\theta)$ of the same point with $0\le\theta<2\pi$.'
            answer: '(6, pi/6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The angle $\frac{13\pi}{6}$ is larger than a full turn. Subtract $2\pi=\frac{12\pi}{6}$ to get $\frac{\pi}{6}$, and keep $r=6$. The coordinates are $\left(6,\frac{\pi}{6}\right)$.'
        constraints: 'angles on the unit-circle special angles; include one negative-r representation'
      - id: kp2
        name: Polar to rectangular
        key_prerequisites: [unit-circle, right-triangle-trig]
        exemplars:
          - problem: 'Convert the polar point $(r,\theta)=\left(2,\frac{\pi}{3}\right)$ to rectangular coordinates.'
            answer: '(1, sqrt(3))'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Use $x=r\cos\theta$ and $y=r\sin\theta$. Then $x=2\cos\frac{\pi}{3}=2\cdot\frac{1}{2}=1$ and $y=2\sin\frac{\pi}{3}=2\cdot\frac{\sqrt{3}}{2}=\sqrt{3}$. The rectangular coordinates are $(1,\sqrt{3})$.'
          - problem: 'Convert the polar point $\left(4,\frac{3\pi}{2}\right)$ to rectangular coordinates.'
            answer: '(0, -4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $\cos\frac{3\pi}{2}=0$ and $\sin\frac{3\pi}{2}=-1$. So $x=4\cdot0=0$ and $y=4\cdot(-1)=-4$. The rectangular coordinates are $(0,-4)$, on the negative $y$-axis.'
          - problem: 'A polar point has $r=10$ and $\theta=\frac{3\pi}{4}$. What are its rectangular coordinates?'
            answer: '(-5sqrt(2), 5sqrt(2))'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The angle $\frac{3\pi}{4}$ lies in quadrant II, so $\cos\frac{3\pi}{4}=-\frac{\sqrt{2}}{2}$ and $\sin\frac{3\pi}{4}=\frac{\sqrt{2}}{2}$. Then $x=10\cdot\left(-\frac{\sqrt{2}}{2}\right)=-5\sqrt{2}$ and $y=5\sqrt{2}$. The point is $(-5\sqrt{2},5\sqrt{2})$.'
          - problem: 'A drone is $40$ m from its pilot, in the direction $\frac{\pi}{6}$ above due east. How far north of the pilot is the drone?'
            answer: '20'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The northward distance is the $y$-coordinate, $y=r\sin\theta$. With $r=40$ and $\theta=\frac{\pi}{6}$ this is $40\cdot\frac{1}{2}=20$. The drone is $20$ m north of the pilot.'
          - problem: 'A robot arm of length $3$ m is pivoted at the origin of a coordinate grid marked in metres and makes an angle of $\frac{2\pi}{3}$ with the positive $x$-axis. Find the coordinates of its tip.'
            answer: '(-3/2, 3sqrt(3)/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The tip has polar coordinates $r=3$ and $\theta=\frac{2\pi}{3}$. Then $x=3\cos\frac{2\pi}{3}=3\cdot\left(-\frac{1}{2}\right)=-\frac{3}{2}$ and $y=3\sin\frac{2\pi}{3}=\frac{3\sqrt{3}}{2}$. The tip is at $\left(-\frac{3}{2},\frac{3\sqrt{3}}{2}\right)$.'
          - problem: 'A kite string is straight and makes an angle of $\frac{\pi}{3}$ with the ground. The kite is $5$ m horizontally from the person holding the string. How long is the string?'
            answer: '10'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The string length is $r$ and the horizontal distance is $x=r\cos\theta$. So $5=r\cos\frac{\pi}{3}=\frac{r}{2}$, and dividing by $\frac{1}{2}$ gives $r=10$. The string is $10$ m long.'
          - problem: 'Convert the polar point $\left(-2,\frac{\pi}{6}\right)$ to rectangular coordinates.'
            answer: '(-sqrt(3), -1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The formulas hold for a negative $r$ too. Then $x=-2\cos\frac{\pi}{6}=-2\cdot\frac{\sqrt{3}}{2}=-\sqrt{3}$ and $y=-2\sin\frac{\pi}{6}=-2\cdot\frac{1}{2}=-1$. The point is $(-\sqrt{3},-1)$.'
          - problem: 'Convert the polar point $\left(8,\frac{\pi}{6}\right)$ to rectangular coordinates.'
            answer: '(4sqrt(3), 4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The $x$-coordinate is $r\cos\theta=8\cdot\frac{\sqrt{3}}{2}=4\sqrt{3}$ and the $y$-coordinate is $r\sin\theta=8\cdot\frac{1}{2}=4$. The coordinates are $(4\sqrt{3},4)$.'
          - problem: 'A point in the plane has polar coordinates $(r,\theta)=\left(6,\frac{5\pi}{3}\right)$. What are its rectangular coordinates?'
            answer: '(3, -3sqrt(3))'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The angle $\frac{5\pi}{3}$ lies in quadrant IV, where $\cos\frac{5\pi}{3}=\frac{1}{2}$ and $\sin\frac{5\pi}{3}=-\frac{\sqrt{3}}{2}$. Then $x=6\cdot\frac{1}{2}=3$ and $y=6\cdot\left(-\frac{\sqrt{3}}{2}\right)=-3\sqrt{3}$. The point is $(3,-3\sqrt{3})$.'
        constraints: 'theta on the unit-circle special angles; exact radical answers'
      - id: kp3
        name: Rectangular to polar
        key_prerequisites: [unit-circle, pythagorean-theorem]
        exemplars:
          - problem: 'Convert the rectangular point $(1,1)$ to polar coordinates $(r,\theta)$ with $r>0$ and $0\le\theta<2\pi$.'
            answer: '(sqrt(2), pi/4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The distance from the origin is $r=\sqrt{1^2+1^2}=\sqrt{2}$. The point is in quadrant I and $\tan\theta=1$, so $\theta=\frac{\pi}{4}$. The polar coordinates are $\left(\sqrt{2},\frac{\pi}{4}\right)$.'
          - problem: 'Convert the rectangular point $(-1,\sqrt{3})$ to polar coordinates $(r,\theta)$ with $r>0$ and $0\le\theta<2\pi$.'
            answer: '(2, 2pi/3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The distance is $r=\sqrt{1+3}=2$. The point is in quadrant II with reference angle $\frac{\pi}{3}$, because $\tan\theta_{\text{ref}}=\sqrt{3}$. So $\theta=\pi-\frac{\pi}{3}=\frac{2\pi}{3}$. The polar coordinates are $\left(2,\frac{2\pi}{3}\right)$.'
          - problem: 'Find polar coordinates $(r,\theta)$ with $r>0$ and $0\le\theta<2\pi$ for the point $(-3,0)$.'
            answer: '(3, pi)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The point lies on the negative $x$-axis, $3$ units from the origin. So $r=3$, and the direction of the negative $x$-axis is $\theta=\pi$. The polar coordinates are $(3,\pi)$.'
          - problem: 'A hiker stands $3$ km west and $3$ km north of camp. Give the hiker''s position as $(r,\theta)$, where $r$ is the distance from camp and $\theta$ is the direction measured counterclockwise from east, with $0\le\theta<2\pi$.'
            answer: '(3sqrt(2), 3pi/4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Taking east as the positive $x$-axis, the hiker is at $(-3,3)$. The distance is $r=\sqrt{9+9}=3\sqrt{2}$. The point is in quadrant II with reference angle $\frac{\pi}{4}$, so $\theta=\frac{3\pi}{4}$. The position is $\left(3\sqrt{2},\frac{3\pi}{4}\right)$.'
          - problem: 'Convert $(-1,-1)$ to polar form with $r>0$ and $0\le\theta<2\pi$.'
            answer: '(sqrt(2), 5pi/4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The radius $\sqrt{2}$ is right, but $\tan^{-1}$ only returns angles in quadrants I and IV. The point $(-1,-1)$ is in quadrant III, so $\theta=\pi+\frac{\pi}{4}=\frac{5\pi}{4}$. The coordinates are $\left(\sqrt{2},\frac{5\pi}{4}\right)$.'
          - problem: 'A rover is $5$ m west and $12$ m north of its base. How far is the rover from the base?'
            answer: '13'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The distance is the radius $r=\sqrt{x^2+y^2}$. With $x=-5$ and $y=12$ this is $\sqrt{25+144}=\sqrt{169}=13$. The rover is $13$ m from its base.'
          - problem: 'Find polar coordinates $(r,\theta)$ with $r>0$ and $0\le\theta<2\pi$ for the point $(-2,-2)$.'
            answer: '(2sqrt(2), 5pi/4)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Both coordinates are negative, so the point is in quadrant III. The distance is $r=\sqrt{4+4}=2\sqrt{2}$. The reference angle satisfies $\tan\theta_{\text{ref}}=1$, so it is $\frac{\pi}{4}$, and $\theta=\pi+\frac{\pi}{4}=\frac{5\pi}{4}$. The polar coordinates are $\left(2\sqrt{2},\frac{5\pi}{4}\right)$.'
          - problem: 'Find polar coordinates $(r,\theta)$ with $r>0$ and $0\le\theta<2\pi$ for the point $(1,-\sqrt{3})$.'
            answer: '(2, 5pi/3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The distance is $r=\sqrt{1+3}=2$. The point is in quadrant IV with reference angle $\frac{\pi}{3}$, since $\tan\theta_{\text{ref}}=\sqrt{3}$. So $\theta=2\pi-\frac{\pi}{3}=\frac{5\pi}{3}$. The polar coordinates are $\left(2,\frac{5\pi}{3}\right)$.'
          - problem: 'Convert the rectangular point $(\sqrt{3},-1)$ to polar coordinates $(r,\theta)$ with $r>0$ and $0\le\theta<2\pi$.'
            answer: '(2, 11pi/6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The distance is $r=\sqrt{3+1}=2$. The point is in quadrant IV with $\tan\theta_{\text{ref}}=\frac{1}{\sqrt{3}}$, so the reference angle is $\frac{\pi}{6}$. Then $\theta=2\pi-\frac{\pi}{6}=\frac{11\pi}{6}$. The polar coordinates are $\left(2,\frac{11\pi}{6}\right)$.'
        constraints: 'points landing on special angles; mind the quadrant when reading arctan'
    diagnostic_exemplar:
      problem: 'Convert $(-3, 3\sqrt{3})$ to polar coordinates with $r > 0$ and $0 \le \theta < 2\pi$.'
      answer: '$(6, 2\pi/3)$'
      solution_sketch: '$r = \sqrt{9 + 27} = 6$; the point is in quadrant II with reference angle $\frac{\pi}{3}$, so $\theta = \frac{2\pi}{3}$.'
    anki_seeds:
      - front: "Polar-to-rectangular conversion formulas?"
        back: '$x = r\cos\theta$, $y = r\sin\theta$'
        type: basic
      - front: "Rectangular-to-polar conversion formulas?"
        back: '$r^2 = x^2 + y^2$, $\tan\theta = y/x$ (choose $\theta$ by quadrant)'
        type: basic

  - id: polar-coordinates
    name: Polar Coordinates
    core: true
    difficulty: 0.6
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: plotting-polar-points
        weight: 0.8
        key: true
      - id: completing-the-square
        weight: 0.4
      - id: trig-identities-basic
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Polar equations to rectangular equations
        key_prerequisites: [plotting-polar-points, completing-the-square]
        try_first:
          problem: 'The circle $r=12\cos\theta$ passes through the pole. What is the largest $x$-coordinate of a point on this circle?'
          answer_contract: {"kind": "exact"}
          answer: '12'
          reveal: 'At $\theta=0$ the equation gives $r=12$, the point $(12,0)$. After multiplying by $r$ the equation becomes $x^2+y^2=12x$, which is the circle $(x-6)^2+y^2=36$, and it reaches $x=12$.'
        exemplars:
          - problem: 'Convert $r=8\cos\theta$ to a rectangular equation.'
            answer: 'x^2 + y^2 = 8x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Multiply both sides by $r$ to get $r^2=8r\cos\theta$. Replace $r^2$ by $x^2+y^2$ and $r\cos\theta$ by $x$. The rectangular equation is $x^2+y^2=8x$, a circle with center $(4,0)$ and radius $4$.'
          - problem: 'Convert $r=10\sin\theta$ to a rectangular equation.'
            answer: 'x^2 + y^2 = 10y'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Multiply both sides by $r$ to get $r^2=10r\sin\theta$. Replace $r^2$ by $x^2+y^2$ and $r\sin\theta$ by $y$. The rectangular equation is $x^2+y^2=10y$, a circle with center $(0,5)$.'
          - problem: 'Convert $\theta=\frac{\pi}{3}$ to a rectangular equation.'
            answer: 'y = sqrt(3)x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'A constant angle gives a line through the origin with $\frac{y}{x}=\tan\theta$. Here $\tan\frac{\pi}{3}=\sqrt{3}$. The rectangular equation is $y=\sqrt{3}\,x$.'
          - problem: 'Convert $r=-6\cos\theta$ to a rectangular equation.'
            answer: 'x^2 + y^2 = -6x'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Multiply both sides by $r$ to get $r^2=-6r\cos\theta$. Replace $r^2$ by $x^2+y^2$ and $r\cos\theta$ by $x$. The rectangular equation is $x^2+y^2=-6x$, a circle with center $(-3,0)$ and radius $3$.'
          - problem: 'Convert $r=4\cos\theta+4\sin\theta$ to a rectangular equation.'
            answer: 'x^2 + y^2 = 4x + 4y'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Multiply both sides by $r$ to get $r^2=4r\cos\theta+4r\sin\theta$. Replace $r^2$ by $x^2+y^2$, $r\cos\theta$ by $x$ and $r\sin\theta$ by $y$. The equation is $x^2+y^2=4x+4y$.'
          - problem: 'The graph of $r=4\cos\theta+4\sin\theta$ is a circle. Find its center.'
            answer: '(2, 2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'In rectangular form the equation is $x^2+y^2=4x+4y$. Complete the square: $(x-2)^2+(y-2)^2=8$. The center is $(2,2)$ and the radius is $2\sqrt{2}$.'
          - problem: 'Convert $r=6\sin\theta$ to a rectangular equation.'
            answer: 'x^2 + y^2 = 6y'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'The term $6\sin\theta$ has no factor $r$, so it cannot be replaced by $y$ yet. Multiply both sides by $r$ first: $r^2=6r\sin\theta$. Then $x^2+y^2=6y$.'
          - problem: 'A sprinkler at the origin waters the circular region bounded by $r=6\sin\theta$, with $r$ in metres. What is the radius of the watered region?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Multiply by $r$ to get $x^2+y^2=6y$. Complete the square: $x^2+(y-3)^2=9$. The region is a circle of radius $3$, so the sprinkler waters a circle of radius $3$ m.'
          - problem: 'The boundary of a circular pond is $r=a\sin\theta$ metres, with $a>0$. The path around the pond is $20\pi$ m long. Find $a$.'
            answer: '20'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Multiplying by $r$ and completing the square gives a circle of radius $\frac{a}{2}$. The path length is the circumference $2\pi\cdot\frac{a}{2}=\pi a$. So $\pi a=20\pi$, and $a=20$.'
          - problem: 'Convert $r=5$ to a rectangular equation.'
            answer: 'x^2 + y^2 = 25'
            answer_contract: {"kind": "polynomial_relation"}
            solution_sketch: 'Square both sides to get $r^2=25$. Replace $r^2$ by $x^2+y^2$. The rectangular equation is $x^2+y^2=25$, a circle of radius $5$ centered at the origin.'
        constraints: 'multiply through by r when needed; complete the square to identify circles'
      - id: kp2
        name: Rectangular equations to polar equations
        key_prerequisites: [plotting-polar-points]
        exemplars:
          - problem: 'Convert the circle $x^2+y^2=25$ to a polar equation.'
            answer: 'r = 5'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Replace $x^2+y^2$ by $r^2$ to get $r^2=25$. Taking the positive root gives $r=5$, a circle of radius $5$ centered at the pole.'
          - problem: 'Convert $x^2+y^2=6y$ to a polar equation.'
            answer: 'r = 6sin(theta)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'Replace $x^2+y^2$ by $r^2$ and $y$ by $r\sin\theta$ to get $r^2=6r\sin\theta$. Divide both sides by $r$ to isolate it. The polar equation is $r=6\sin\theta$.'
          - problem: 'Convert $x^2+y^2=-4x$ to a polar equation.'
            answer: 'r = -4cos(theta)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'Replace $x^2+y^2$ by $r^2$ and $x$ by $r\cos\theta$ to get $r^2=-4r\cos\theta$. Divide both sides by $r$. The polar equation is $r=-4\cos\theta$.'
          - problem: 'Write the line $y=x$ as a polar equation, using an angle $\theta$ with $0\le\theta<\pi$.'
            answer: 'theta = pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the line, $\frac{y}{x}=\tan\theta=1$. The angle in $[0,\pi)$ with tangent $1$ is $\frac{\pi}{4}$. The polar equation is $\theta=\frac{\pi}{4}$.'
          - problem: 'Convert $x^2+y^2=2x+2y$ to a polar equation.'
            answer: 'r = 2cos(theta) + 2sin(theta)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'Replace $x^2+y^2$ by $r^2$, $x$ by $r\cos\theta$ and $y$ by $r\sin\theta$ to get $r^2=2r\cos\theta+2r\sin\theta$. Divide both sides by $r$. The polar equation is $r=2\cos\theta+2\sin\theta$.'
          - problem: 'A circular fountain has the boundary $(x-3)^2+y^2=9$, with the entrance at the origin and lengths in metres. Write its boundary as a polar equation.'
            answer: 'r = 6cos(theta)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'Expand the equation to $x^2-6x+y^2=0$, so $x^2+y^2=6x$. Replace $x^2+y^2$ by $r^2$ and $x$ by $r\cos\theta$, then divide by $r$. The boundary is $r=6\cos\theta$.'
          - problem: 'A radar covers every point with $x^2+y^2\le49$, where $x$ and $y$ are in kilometres. Write the boundary of the covered region as a polar equation.'
            answer: 'r = 7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the boundary, $x^2+y^2=49$. Replace $x^2+y^2$ by $r^2$ to get $r^2=49$. The boundary is the circle $r=7$, so the radar reaches $7$ km in every direction.'
          - problem: 'Write the line $y=-\sqrt{3}\,x$ as a polar equation, using an angle $\theta$ with $0\le\theta<\pi$.'
            answer: 'theta = 2pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'On the line, $\tan\theta=\frac{y}{x}=-\sqrt{3}$. The angle in $[0,\pi)$ with tangent $-\sqrt{3}$ is $\frac{2\pi}{3}$. The polar equation is $\theta=\frac{2\pi}{3}$.'
          - problem: 'Convert $x^2+y^2=10x$ to polar form.'
            answer: 'r = 10cos(theta)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'A polar equation may only use $r$ and $\theta$. Replace $x$ by $r\cos\theta$: $r^2=10r\cos\theta$. Divide by $r$ to get $r=10\cos\theta$.'
          - problem: 'Convert $x^2+(y+4)^2=16$ to a polar equation.'
            answer: 'r = -8sin(theta)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'Expand to $x^2+y^2+8y=0$, so $x^2+y^2=-8y$. Replace $x^2+y^2$ by $r^2$ and $y$ by $r\sin\theta$, then divide by $r$. The polar equation is $r=-8\sin\theta$.'
          - problem: 'Convert the line $x=3$ to a polar equation.'
            answer: 'r = 3sec(theta)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'Replace $x$ by $r\cos\theta$ to get $r\cos\theta=3$. Divide both sides by $\cos\theta$ to isolate $r$. The polar equation is $r=\frac{3}{\cos\theta}=3\sec\theta$.'
          - problem: 'Convert the parabola $y=x^2$ to a polar equation.'
            answer: 'r = tan(theta)sec(theta)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'Replace $y$ by $r\sin\theta$ and $x$ by $r\cos\theta$ to get $r\sin\theta=r^2\cos^2\theta$. Divide both sides by $r\cos^2\theta$. The polar equation is $r=\frac{\sin\theta}{\cos^2\theta}=\tan\theta\sec\theta$.'
        constraints: 'use r^2 = x^2 + y^2, x = r cos theta, y = r sin theta; simplify to r = f(theta)'
      - id: kp3
        name: Identifying curves from polar equations
        key_prerequisites: [plotting-polar-points, completing-the-square]
        exemplars:
          - problem: 'The graph of $r=10\cos\theta$ is a circle through the origin. Find its center.'
            answer: '(5, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Multiply by $r$ to get $r^2=10r\cos\theta$, so $x^2+y^2=10x$. Complete the square: $(x-5)^2+y^2=25$. The center is $(5,0)$ and the radius is $5$.'
          - problem: 'Find the radius of the circle $r=-6\sin\theta$.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply by $r$ to get $x^2+y^2=-6y$. Complete the square: $x^2+(y+3)^2=9$. The circle has radius $3$ and center $(0,-3)$.'
          - problem: 'What kind of curve is $r=7$: a circle centered at the origin, a circle through the origin, or a line through the origin?'
            answer: 'circle centered at the origin'
            answer_contract: {"kind": "label", "options": [["circle centered at the origin", "a circle centered at the origin", "circle about the origin", "circle centered at the pole", "centered circle"], ["circle through the origin", "a circle through the origin", "circle through the pole"], ["line through the origin", "a line through the origin", "line", "straight line"]]}
            solution_sketch: 'A constant $r$ means every point is $7$ units from the origin. Squaring gives $x^2+y^2=49$. So the curve is a circle centered at the origin.'
          - problem: 'Find the slope of the line $\theta=\frac{2\pi}{3}$.'
            answer: '-sqrt(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'A constant angle gives a line through the origin with slope $\tan\theta$. Here $\tan\frac{2\pi}{3}=-\sqrt{3}$. The slope is $-\sqrt{3}$.'
          - problem: 'The graph of $r=12\sin\theta$ is a circle through the origin. Find its center.'
            answer: '(0, 6)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Multiply by $r$ to get $x^2+y^2=12y$. Complete the square: $x^2+(y-6)^2=36$. The center is $(0,6)$ and the radius is $6$.'
          - problem: 'The line $y=-x$ passes through the origin. Find its polar angle $\theta$ with $0\le\theta<\pi$.'
            answer: '3pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope of the line is $-1$, and a line of constant angle has slope $\tan\theta$. In $[0,\pi)$ the angle with $\tan\theta=-1$ is $\frac{3\pi}{4}$. The angle is $\frac{3\pi}{4}$.'
          - problem: 'A circular lawn has the boundary $r=14\cos\theta$, with $r$ in metres and the origin at an entrance on the boundary. What is the radius of the lawn?'
            answer: '7'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Multiply by $r$ to get $x^2+y^2=14x$. Complete the square: $(x-7)^2+y^2=49$. The radius is $7$ m, which is half the largest distance $14$ m from the entrance.'
          - problem: 'A laser leaves the origin along the ray $\theta=\frac{\pi}{4}$ on a grid measured in metres. When the beam is $6$ m east of the origin, how far has it travelled from the origin?'
            answer: '6*sqrt(2)'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'On the ray, $x=r\cos\theta$, so $6=r\cos\frac{\pi}{4}=\frac{r\sqrt{2}}{2}$. Dividing by $\frac{\sqrt{2}}{2}$ gives $r=\frac{12}{\sqrt{2}}=6\sqrt{2}$. The beam has travelled $6\sqrt{2}$ m.'
          - problem: 'The graph of $r=4\cos\theta+6\sin\theta$ is a circle. Find its center.'
            answer: '(2, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Multiply by $r$ to get $x^2+y^2=4x+6y$. Complete the square: $(x-2)^2+(y-3)^2=13$. The center is $(2,3)$.'
          - problem: 'What is the radius of the circle $r=6\cos\theta$?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Multiply by $r$ to get $x^2+y^2=6x$. Complete the square: $(x-3)^2+y^2=9$. The radius is $3$, which is half of the coefficient $6$.'
        constraints: 'circles through the origin (r = 2a cos theta or 2a sin theta), constant-r circles, and lines only'
    diagnostic_exemplar:
      problem: 'Convert the circle $x^2 + y^2 = 6y$ to a polar equation, and identify the curve.'
      answer: '$r = 6\sin\theta$: a circle of radius $3$ centered at $(0, 3)$'
      answer_contract: {kind: none}
      solution_sketch: 'Substitute $x^2 + y^2 = r^2$ and $y = r\sin\theta$, then divide by $r$; completing the square gives $x^2 + (y-3)^2 = 9$.'
    anki_seeds:
      - front: 'The polar equation $r = 2a\cos\theta$ is always a...'
        back: 'circle of radius $|a|$ centered at $(a, 0)$ (through the origin)'
        type: basic
      - front: "The standard trick for converting r = a cos(theta) or r = a sin(theta) to rectangular form?"
        back: 'multiply both sides by $r$, then use $r^2 = x^2 + y^2$, $r\cos\theta = x$, $r\sin\theta = y$'
        type: basic

  - id: graphing-polar-curves
    name: Graphing Polar Curves
    core: true
    difficulty: 0.64
    drill: false
    answer_kind: numeric
    expected_time_secs: 150
    prerequisites:
      - id: polar-coordinates
        weight: 0.8
