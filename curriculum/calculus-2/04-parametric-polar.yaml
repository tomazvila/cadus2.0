        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Circles, cardioids, and limacons
        key_prerequisites: [polar-coordinates, trig-graphs-basic]
        exemplars:
          - problem: 'Identify the graph of $r=1+2\cos\theta$.'
            answer: 'looped limaçon'
            answer_contract: {"kind": "label", "options": [["circle", "a circle"], ["cardioid", "a cardioid", "heart-shaped curve", "heart shape"], ["looped limaçon", "limaçon with an inner loop", "a limaçon with an inner loop", "limacon with an inner loop", "a limacon with an inner loop", "limaçon with a loop", "a limaçon with a loop", "inner loop limaçon"], ["plain limaçon", "limaçon without an inner loop", "a limaçon without an inner loop", "limacon without an inner loop", "a limacon without an inner loop", "limaçon with no inner loop", "a limaçon with no inner loop", "dimpled limaçon"]]}
            solution_sketch: 'Here $a=1$ and $b=2$, so $|b|>|a|$. The curve is a limaçon, and the loop appears where $r$ becomes negative. The graph is a limaçon with an inner loop.'
          - problem: 'Identify the graph of $r=3-3\sin\theta$.'
            answer: 'cardioid'
            answer_contract: {"kind": "label", "options": [["circle", "a circle"], ["cardioid", "a cardioid", "heart-shaped curve", "heart shape"], ["looped limaçon", "limaçon with an inner loop", "a limaçon with an inner loop", "limacon with an inner loop", "a limacon with an inner loop", "limaçon with a loop", "a limaçon with a loop", "inner loop limaçon"], ["plain limaçon", "limaçon without an inner loop", "a limaçon without an inner loop", "limacon without an inner loop", "a limacon without an inner loop", "limaçon with no inner loop", "a limaçon with no inner loop", "dimpled limaçon"]]}
            solution_sketch: 'Here $a=3$ and $b=-3$, so $|a|=|b|$. A limaçon with equal magnitudes is a cardioid, the heart-shaped curve with a cusp at the pole. The graph is a cardioid.'
          - problem: 'A cam has the edge $r=3+2\cos\theta$, with $r$ in centimetres and the axle at the pole. What is the greatest distance from the axle to the edge?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The distance $r$ is largest when $\cos\theta=1$, because $2\cos\theta$ is then as large as possible. So $r=3+2=5$. The greatest distance is $5$ cm.'
          - problem: 'The same cam has the edge $r=3+2\cos\theta$ in centimetres. How much farther from the axle is the edge at its farthest point than at its nearest point?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'The distance is largest when $\cos\theta=1$, giving $3+2=5$ cm, and smallest when $\cos\theta=-1$, giving $3-2=1$ cm. The difference is $5-1=4$ cm.'
          - problem: 'At which angles $\theta$ in $[0,2\pi)$ does the limaçon $r=1+2\cos\theta$ pass through the pole?'
            answer: '2pi/3, 4pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve passes through the pole where $r=0$, so $1+2\cos\theta=0$ and $\cos\theta=-\frac{1}{2}$. In $[0,2\pi)$ this happens at $\theta=\frac{2\pi}{3}$ and $\theta=\frac{4\pi}{3}$. The inner loop lies between these two angles.'
          - problem: 'A microphone has sensitivity $r=2+2\cos\theta$ in the direction $\theta$, where $\theta=0$ is straight ahead. In which direction $\theta$ with $0\le\theta<2\pi$ is it completely insensitive?'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The sensitivity is zero where $2+2\cos\theta=0$, so $\cos\theta=-1$. In $[0,2\pi)$ this gives $\theta=\pi$. The microphone is insensitive directly behind it.'
          - problem: 'Find the positive value of $b$ for which $r=3+b\cos\theta$ is a cardioid.'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve $r=a+b\cos\theta$ is a cardioid exactly when $|a|=|b|$. Here $a=3$, so the positive value is $b=3$. Then $r=3+3\cos\theta$ is a cardioid.'
          - problem: 'A circular track is the graph of $r=250$, with $r$ in metres and the origin at its center. A runner crosses the track along a straight line through the center. How far does the runner run?'
            answer: '500'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'A constant $r$ is a circle centered at the origin, so the radius is $250$ m. The runner covers a diameter, which is twice the radius. The distance is $2\cdot250=500$ m.'
        constraints: 'families limited to circles, cardioids, and limacons; classify by comparing |a| and |b|'
      - id: kp2
        name: Rose curves and petal counts
        key_prerequisites: [polar-coordinates, trig-graphs-basic]
        try_first:
          problem: 'How many petals does the rose $r=4\sin 2\theta$ have?'
          answer_contract: {"kind": "exact"}
          answer: '4'
          reveal: 'The factor $2$ in $2\theta$ suggests two petals, but the curve has four. When $n$ is even, the points with negative $r$ add new petals, so the count is $2n=4$.'
        exemplars:
          - problem: 'How many petals does the rose $r=2\sin 3\theta$ have?'
            answer: '3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rose $r=a\sin n\theta$ has $n$ petals when $n$ is odd. Here $n=3$ is odd, so the rose has $3$ petals.'
          - problem: 'How many petals does the rose $r=5\sin 4\theta$ have?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The rose $r=a\sin n\theta$ has $2n$ petals when $n$ is even. Here $n=4$ is even, so the rose has $2\cdot4=8$ petals.'
          - problem: 'At which angles $\theta$ in $[0,2\pi)$ does $r=3\cos2\theta$ reach its largest value?'
            answer: '0, pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The value $r=3$ is the largest, and it occurs where $\cos2\theta=1$. Then $2\theta=2\pi k$, so $\theta=\pi k$. In $[0,2\pi)$ the angles are $0$ and $\pi$.'
          - problem: 'The rose $r=3\cos2\theta$ has four petals. At which angles $\theta$ in $[0,2\pi)$ is a point of the curve as far from the pole as possible?'
            answer: '0, pi/2, pi, 3pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The distance from the pole is $|r|=3|\cos2\theta|$, which is largest when $\cos2\theta=\pm1$. Then $2\theta=k\pi$, so $\theta=\frac{k\pi}{2}$, and $r$ is $3$ at $0$ and $\pi$ but $-3$ at $\frac{\pi}{2}$ and $\frac{3\pi}{2}$. The four angles $0$, $\frac{\pi}{2}$, $\pi$, $\frac{3\pi}{2}$ give the four petal tips.'
          - problem: 'At which angles $\theta$ in $[0,2\pi)$ does $r=4\sin5\theta$ reach its largest value?'
            answer: 'pi/10, pi/2, 9pi/10, 13pi/10, 17pi/10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The largest value $r=4$ occurs where $\sin5\theta=1$. Then $5\theta=\frac{\pi}{2}+2\pi k$, so $\theta=\frac{\pi}{10}+\frac{2\pi k}{5}$. For $k=0,1,2,3,4$ the angles are $\frac{\pi}{10},\frac{\pi}{2},\frac{9\pi}{10},\frac{13\pi}{10},\frac{17\pi}{10}$.'
          - problem: 'A window is designed as the rose $r=2\sin6\theta$, with $r$ in metres. How many petals does the window have?'
            answer: '12'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Since $n=6$ is even, the rose has $2n$ petals. That is $2\cdot6=12$ petals.'
          - problem: 'A rose $r=2\cos n\theta$, where $n$ is a positive integer, has $12$ petals. Find $n$.'
            answer: '6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'An odd $n$ gives only $n$ petals, so $12$ petals needs an even $n$, which gives $2n$ petals. Then $2n=12$, and dividing by $2$ gives $n=6$, which is even as required.'
          - problem: 'A rose $r=a\cos n\theta$, with $a>0$ and $n$ a positive integer, has $8$ petals that are each $2$ units long. Write its polar equation.'
            answer: 'r = 2cos(4theta)'
            answer_contract: {"kind": "function", "vars": ["theta"]}
            solution_sketch: 'The petal length is $a$, so $a=2$. Eight petals means $n$ is even and $2n=8$, so $n=4$. The equation is $r=2\cos4\theta$.'
          - problem: 'A rose-shaped tile is cut along $r=5\cos3\theta$, with $r$ in centimetres and the pole at the center. What is the length of each petal, from the pole to its tip?'
            answer: '5'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "cm", "allow_omitted": true}
            solution_sketch: 'A petal tip is where $|\cos3\theta|=1$, and there $|r|=5$. So each petal reaches $5$ cm from the pole. The rose has $3$ petals, each $5$ cm long.'
          - problem: 'Can a rose $r=a\sin n\theta$, with $n$ a positive integer, have exactly $10$ petals?'
            answer: 'no'
            answer_contract: {"kind": "label", "options": [["yes", "it can", "can", "possible"], ["no", "it cannot", "cannot", "not possible", "impossible"]]}
            solution_sketch: 'An odd $n$ gives $n$ petals, and $n=10$ is not odd. An even $n$ gives $2n$ petals, so $2n=10$ needs $n=5$, which is odd. Neither case works, so there are never $10$ petals.'
        constraints: 'n in {2, 3, 4, 5, 6}; ask for petal counts, petal lengths and the angles of the largest value of r'
      - id: kp3
        name: Symmetry and zeros of r
        key_prerequisites: [polar-coordinates]
        exemplars:
          - problem: 'At what angle $\theta$ in $[0,2\pi)$ does $r=1+\cos\theta$ reach the pole?'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve reaches the pole where $r=0$, so $1+\cos\theta=0$ and $\cos\theta=-1$. In $[0,2\pi)$ the only solution is $\theta=\pi$.'
          - problem: 'Is the graph of $r=2+2\sin\theta$ symmetric about the polar axis, the vertical line $\theta=\frac{\pi}{2}$, or the pole?'
            answer: 'vertical line'
            answer_contract: {"kind": "label", "options": [["polar axis", "the polar axis", "horizontal line", "the x-axis", "x-axis", "horizontal"], ["vertical line", "the vertical line", "the line theta = pi/2", "θ = π/2", "the line θ = π/2", "the y-axis", "y-axis", "vertical"], ["the pole", "pole", "the origin", "origin"]]}
            solution_sketch: 'Replace $\theta$ by $\pi-\theta$: since $\sin(\pi-\theta)=\sin\theta$, the value of $r$ is unchanged, so the graph is symmetric about the vertical line $\theta=\frac{\pi}{2}$. Replacing $\theta$ by $-\theta$ or by $\theta+\pi$ changes $r$, so the other two symmetries fail.'
          - problem: 'Find all $\theta$ in $[0,\pi)$ at which $r=\cos3\theta$ is zero.'
            answer: 'pi/6, pi/2, 5pi/6'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $\cos3\theta=0$, so $3\theta=\frac{\pi}{2}+k\pi$ and $\theta=\frac{\pi}{6}+\frac{k\pi}{3}$. The values in $[0,\pi)$ are $\frac{\pi}{6}$, $\frac{\pi}{2}$ and $\frac{5\pi}{6}$.'
          - problem: 'Find all $\theta$ in $[0,2\pi)$ at which $r=\sin2\theta$ is zero.'
            answer: '0, pi/2, pi, 3pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $\sin2\theta=0$, so $2\theta=k\pi$ and $\theta=\frac{k\pi}{2}$. The values in $[0,2\pi)$ are $0$, $\frac{\pi}{2}$, $\pi$ and $\frac{3\pi}{2}$. These angles separate the four petals.'
          - problem: 'For how many angles $\theta$ in $[0,2\pi)$ is $r=2\cos4\theta$ equal to zero?'
            answer: '8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $\cos4\theta=0$, so $4\theta=\frac{\pi}{2}+k\pi$ and $\theta=\frac{\pi}{8}+\frac{k\pi}{4}$. The values $k=0,1,\dots,7$ lie in $[0,2\pi)$, which gives $8$ angles.'
          - problem: 'A radar antenna covers the region $r\le5+5\sin\theta$, with $r$ in kilometres and $\theta$ measured from east. In which direction $\theta$ in $[0,2\pi)$ is its range zero?'
            answer: '3pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The range is zero where $5+5\sin\theta=0$, so $\sin\theta=-1$. In $[0,2\pi)$ the only solution is $\theta=\frac{3\pi}{2}$, which points due south.'
          - problem: 'A garden path follows the rose $r=10\cos2\theta$, with $r$ in metres, and it passes through the fountain at the pole. At which angles $\theta$ in $[0,\pi)$ does the path pass through the pole?'
            answer: 'pi/4, 3pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The path is at the pole where $10\cos2\theta=0$, so $\cos2\theta=0$. Then $2\theta=\frac{\pi}{2}+k\pi$ and $\theta=\frac{\pi}{4}+\frac{k\pi}{2}$. The values in $[0,\pi)$ are $\frac{\pi}{4}$ and $\frac{3\pi}{4}$.'
          - problem: 'Is the graph of $r=3+\cos\theta$ symmetric about the polar axis, the vertical line $\theta=\frac{\pi}{2}$, or the pole?'
            answer: 'polar axis'
            answer_contract: {"kind": "label", "options": [["polar axis", "the polar axis", "horizontal line", "the x-axis", "x-axis", "horizontal"], ["vertical line", "the vertical line", "the line theta = pi/2", "θ = π/2", "the line θ = π/2", "the y-axis", "y-axis", "vertical"], ["the pole", "pole", "the origin", "origin"]]}
            solution_sketch: 'Cosine is even, so replacing $\theta$ by $-\theta$ leaves $r=3+\cos\theta$ unchanged, and the graph is symmetric about the polar axis. Replacing $\theta$ by $\pi-\theta$ gives $3-\cos\theta$, so the vertical line fails.'
          - problem: 'Find the angle $\theta$ in $[0,2\pi)$ at which the cardioid $r=3-3\cos\theta$ reaches the pole.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Set $3-3\cos\theta=0$, so $\cos\theta=1$. In $[0,2\pi)$ the only solution is $\theta=0$. The cusp of the cardioid is at the pole when $\theta=0$.'
        constraints: 'symmetry via even/odd trig; zeros of r locate petal boundaries and cusps'
    diagnostic_exemplar:
      problem: 'For $r = 4\cos 3\theta$, how many petals does the graph have, and at which $\theta$ in $[0, \pi)$ does the curve pass through the pole?'
      answer: '$3$ petals; it reaches the pole at $\theta = \frac{\pi}{6}, \frac{\pi}{2}, \frac{5\pi}{6}$'
      answer_contract: {kind: none}
      solution_sketch: 'For $r = a\cos(n\theta)$ with $n$ odd there are $n$ petals; $r = 0$ when $\cos 3\theta = 0$, i.e. $3\theta = \frac{\pi}{2} + k\pi$.'
    anki_seeds:
      - front: 'Petal count of $r = a\cos(n\theta)$?'
        back: '$n$ petals if $n$ is odd, $2n$ petals if $n$ is even'
        type: basic
      - front: 'The limaçon $r = a + b\cos\theta$ has an inner loop exactly when...'
        back: '$|b| > |a|$ (r takes negative values)'
        type: basic

  - id: polar-tangent-lines
    name: Tangents to Polar Curves
    core: false                # terminal polar application
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: polar-coordinates
        weight: 0.6
        key: true
      - id: parametric-derivatives
        weight: 0.6
        key: true
      - id: double-half-angle-identities
        weight: 0.5
      - id: derivatives-trig
        weight: 0.3
    knowledge_points:
      - id: kp1
        name: Slopes via the parametric form
        key_prerequisites: [polar-coordinates, parametric-derivatives, derivatives-trig]
        try_first:
          problem: 'The circle $r=2$ has centre at the origin. What is the slope of its tangent line at the point where $\theta=\frac{\pi}{4}$?'
          answer_contract: {"kind": "exact"}
          answer: '-1'
          reveal: 'The radius to that point has slope $1$ and a tangent is perpendicular to the radius, so the slope is $-1$. The slope of a polar curve is $\frac{dy/d\theta}{dx/d\theta}$, and it is not $\frac{dr}{d\theta}$, which is $0$ here.'
        exemplars:
          - problem: 'Find the slope of the tangent line to the cardioid $r=1+\cos\theta$ at $\theta=\frac{\pi}{2}$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'With $x=r\cos\theta$ and $y=r\sin\theta$ we get $\frac{dy}{d\theta}=\cos\theta+\cos 2\theta$, which equals $-1$ at $\theta=\frac{\pi}{2}$. Also $\frac{dx}{d\theta}=-\sin\theta-\sin 2\theta$, which equals $-1$ there. The slope is $\frac{-1}{-1}=1$.'
          - problem: 'Find the slope of the tangent line to the spiral $r=\theta$ at $\theta=\frac{\pi}{2}$.'
            answer: '-2/pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $x=\theta\cos\theta$ and $y=\theta\sin\theta$, so $\frac{dy}{d\theta}=\sin\theta+\theta\cos\theta=1$ at $\theta=\frac{\pi}{2}$. Also $\frac{dx}{d\theta}=\cos\theta-\theta\sin\theta=-\frac{\pi}{2}$ there. The slope is $\frac{1}{-\pi/2}=-\frac{2}{\pi}$.'
          - problem: 'Find the slope of the tangent line to the circle $r=4\cos\theta$ at $\theta=\frac{\pi}{6}$.'
            answer: '-sqrt(3)/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $\theta=\frac{\pi}{6}$ we have $r=2\sqrt{3}$ and $\frac{dr}{d\theta}=-4\sin\theta=-2$. Then $\frac{dy}{d\theta}=r^{\prime}\sin\theta+r\cos\theta=-1+3=2$ and $\frac{dx}{d\theta}=r^{\prime}\cos\theta-r\sin\theta=-\sqrt{3}-\sqrt{3}=-2\sqrt{3}$. The slope is $\frac{2}{-2\sqrt{3}}=-\frac{\sqrt{3}}{3}$.'
          - problem: 'Find the slope of the tangent line to the curve $r=1+\sin\theta$ at $\theta=\frac{\pi}{4}$.'
            answer: '-1-sqrt(2)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $\theta=\frac{\pi}{4}$ we have $r=1+\frac{\sqrt{2}}{2}$ and $\frac{dr}{d\theta}=\cos\theta=\frac{\sqrt{2}}{2}$. Then $\frac{dy}{d\theta}=r^{\prime}\sin\theta+r\cos\theta=1+\frac{\sqrt{2}}{2}$ and $\frac{dx}{d\theta}=r^{\prime}\cos\theta-r\sin\theta=-\frac{\sqrt{2}}{2}$. The slope is $-(\sqrt{2}+1)=-1-\sqrt{2}$.'
          - problem: 'A walking path around a pond follows the curve $r=3+2\sin\theta$, in kilometres, with the origin at the centre of the pond, $x$ pointing east and $y$ pointing north. A walker is due west of the centre, where $\theta=\pi$. What is the slope of the path there?'
            answer: '-3/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $\theta=\pi$ we have $r=3$ and $\frac{dr}{d\theta}=2\cos\theta=-2$. Then $\frac{dy}{d\theta}=r^{\prime}\sin\theta+r\cos\theta=0-3=-3$ and $\frac{dx}{d\theta}=r^{\prime}\cos\theta-r\sin\theta=2-0=2$. The slope of the path is $-\frac{3}{2}$.'
          - problem: 'Find the slope of the tangent line to the rose $r=2\cos 2\theta$ at $\theta=\frac{\pi}{6}$.'
            answer: 'sqrt(3)/7'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $\theta=\frac{\pi}{6}$ we have $r=1$ and $\frac{dr}{d\theta}=-4\sin 2\theta=-2\sqrt{3}$. Then $\frac{dy}{d\theta}=-\sqrt{3}+\frac{\sqrt{3}}{2}=-\frac{\sqrt{3}}{2}$ and $\frac{dx}{d\theta}=-3-\frac{1}{2}=-\frac{7}{2}$. The slope is $\frac{-\sqrt{3}/2}{-7/2}=\frac{\sqrt{3}}{7}$.'
          - problem: 'A cyclist rides around a plaza along the curve $r=4+2\cos\theta$, in metres, measured from the centre with $x$ pointing east and $y$ pointing north. At the point due north of the centre, where $\theta=\frac{\pi}{2}$, what is the slope of her path?'
            answer: '1/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $\theta=\frac{\pi}{2}$ we have $r=4$ and $\frac{dr}{d\theta}=-2\sin\theta=-2$. Then $\frac{dy}{d\theta}=r^{\prime}\sin\theta+r\cos\theta=-2$ and $\frac{dx}{d\theta}=r^{\prime}\cos\theta-r\sin\theta=-4$. The slope of the path is $\frac{-2}{-4}=\frac{1}{2}$.'
          - problem: 'What is the slope of the tangent line to the spiral $r=2\theta$ at $\theta=\pi$?'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The slope of a polar curve is $\frac{dy/d\theta}{dx/d\theta}$, not $\frac{dr}{d\theta}$. For $r=2\theta$ at $\theta=\pi$ we get $\frac{dy}{d\theta}=2\sin\theta+2\theta\cos\theta=-2\pi$ and $\frac{dx}{d\theta}=2\cos\theta-2\theta\sin\theta=-2$. The slope is $\frac{-2\pi}{-2}=\pi$.'
        constraints: 'treat theta as the parameter in x = r cos theta, y = r sin theta; evaluation at special angles; plain curves, paths in context and one error-analysis item'
      - id: kp2
        name: Horizontal and vertical tangents
        key_prerequisites: [parametric-derivatives, derivatives-trig]
        exemplars:
          - problem: 'The circle $r=6\cos\theta$ has two horizontal tangent lines. At what point does the upper one touch the circle?'
            answer: '(3, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $y=r\sin\theta=6\cos\theta\sin\theta=3\sin 2\theta$, so $\frac{dy}{d\theta}=6\cos 2\theta$, which is zero at $\theta=\frac{\pi}{4}$ and $\theta=\frac{3\pi}{4}$. At $\theta=\frac{\pi}{4}$ we have $r=3\sqrt{2}$, which gives $(x,y)=(3,3)$. This is the point with positive $y$.'
          - problem: 'The circle $r=6\cos\theta$ has a vertical tangent line at the pole and at one other point. Find that other point.'
            answer: '(6, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $x=r\cos\theta=6\cos^2\theta=3+3\cos 2\theta$, so $\frac{dx}{d\theta}=-6\sin 2\theta$, which is zero at $\theta=0$ and $\theta=\frac{\pi}{2}$. At $\theta=\frac{\pi}{2}$ the curve is at the pole. At $\theta=0$ we have $r=6$, which gives $(6,0)$.'
          - problem: 'The limaçon $r=1+2\sin\theta$ has several horizontal tangent lines. Find the point of tangency with the greatest $y$-coordinate.'
            answer: '(0, 3)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $y=\sin\theta+2\sin^2\theta$, so $\frac{dy}{d\theta}=\cos\theta(1+4\sin\theta)$, which is zero where $\cos\theta=0$ or $\sin\theta=-\frac{1}{4}$. At $\theta=\frac{\pi}{2}$ we have $r=3$, giving $(0,3)$. At $\theta=\frac{3\pi}{2}$ we have $y=1$, and at $\sin\theta=-\frac{1}{4}$ we have $y=-\frac{1}{8}$, so the greatest $y$ is $3$.'
          - problem: 'The limaçon $r=1+2\cos\theta$ has several vertical tangent lines. Find the point of tangency with the greatest $x$-coordinate.'
            answer: '(3, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $x=\cos\theta+2\cos^2\theta$, so $\frac{dx}{d\theta}=-\sin\theta(1+4\cos\theta)$, which is zero where $\sin\theta=0$ or $\cos\theta=-\frac{1}{4}$. At $\theta=0$ we have $r=3$, giving $(3,0)$. At $\theta=\pi$ we have $x=1$, and at $\cos\theta=-\frac{1}{4}$ we have $x=-\frac{1}{8}$, so the greatest $x$ is $3$.'
          - problem: 'The cardioid $r=1+\cos\theta$ has several vertical tangent lines. Find the point of tangency with the greatest $x$-coordinate.'
            answer: '(2, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $x=\cos\theta+\cos^2\theta$, so $\frac{dx}{d\theta}=-\sin\theta(1+2\cos\theta)$, which is zero where $\sin\theta=0$ or $\cos\theta=-\frac{1}{2}$. At $\theta=0$ we have $r=2$, giving $(2,0)$. At $\theta=\pi$ the curve is at the pole, and at $\cos\theta=-\frac{1}{2}$ we have $x=-\frac{1}{4}$, so the greatest $x$ is $2$.'
          - problem: 'The limaçon $r=2+3\sin\theta$ has several horizontal tangent lines. Find the point of tangency with the greatest $y$-coordinate.'
            answer: '(0, 5)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $y=2\sin\theta+3\sin^2\theta$, so $\frac{dy}{d\theta}=2\cos\theta(1+3\sin\theta)$, which is zero where $\cos\theta=0$ or $\sin\theta=-\frac{1}{3}$. At $\theta=\frac{\pi}{2}$ we have $r=5$, giving $(0,5)$. At $\theta=\frac{3\pi}{2}$ we have $y=1$, and at $\sin\theta=-\frac{1}{3}$ we have $y=-\frac{1}{3}$, so the greatest $y$ is $5$.'
          - problem: 'The circle $r=10\cos\theta$ has two horizontal tangent lines. Find the two points where they touch the circle.'
            answer: '(5, 5), (5, -5)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Here $y=r\sin\theta=10\cos\theta\sin\theta=5\sin 2\theta$, so $\frac{dy}{d\theta}=10\cos 2\theta$, which is zero at $\theta=\frac{\pi}{4}$ and $\theta=\frac{3\pi}{4}$. At $\theta=\frac{\pi}{4}$ we have $r=5\sqrt{2}$, which gives $(5,5)$. At $\theta=\frac{3\pi}{4}$ we have $r=-5\sqrt{2}$, which gives $(5,-5)$.'
          - problem: 'A pond is bounded by the circle $r=8\sin\theta$, in metres, with the origin at the pump, $x$ pointing east and $y$ pointing north. A straight fence running from east to west touches the pond on its north side. At which point does the fence touch the pond?'
            answer: '(0, 8)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Here $y=8\sin^2\theta$, so $\frac{dy}{d\theta}=8\sin 2\theta$, which is zero at $\theta=0$, $\frac{\pi}{2}$ and $\pi$. At $\theta=\frac{\pi}{2}$ we have $r=8$, giving $(0,8)$, the northernmost point. The other two angles give the pole.'
          - problem: 'A flower bed is bounded by the cardioid $r=2+2\cos\theta$, in metres, with the origin at the fountain and $x$ pointing east. A straight wall running from north to south just touches the bed on its east side. How far east of the fountain is the wall?'
            answer: '4'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Here $x=2\cos\theta+2\cos^2\theta$, so $\frac{dx}{d\theta}=-2\sin\theta(1+2\cos\theta)$, which is zero at $\theta=0$, $\theta=\pi$ and where $\cos\theta=-\frac{1}{2}$. The values of $x$ there are $4$, $0$ and $-\frac{1}{2}$. The wall touches the bed at $x=4$, so it is $4$ m east of the fountain.'
        constraints: 'dy/d theta = 0 for horizontal, dx/d theta = 0 for vertical; report rectangular points; includes pond, flower bed contexts'
      - id: kp3
        name: Tangent lines at the pole
        key_prerequisites: [polar-coordinates]
        exemplars:
          - problem: 'The four-petal rose $r=\cos 2\theta$ passes through the pole. Find the angles $\theta$ with $0\le\theta<\pi$ of its tangent lines at the pole.'
            answer: 'pi/4, 3pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve is at the pole when $\cos 2\theta=0$, so $2\theta=\frac{\pi}{2}+k\pi$ and $\theta=\frac{\pi}{4}+\frac{k\pi}{2}$. The values $\frac{\pi}{4}$ and $\frac{3\pi}{4}$ lie in $[0,\pi)$. The other zeros, $\frac{5\pi}{4}$ and $\frac{7\pi}{4}$, give the same two lines.'
          - problem: 'The cardioid $r=1-\sin\theta$ reaches the pole once. Find the angle $\theta$ with $0\le\theta<\pi$ of its tangent line at the pole.'
            answer: 'pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve is at the pole when $1-\sin\theta=0$, so $\sin\theta=1$ and $\theta=\frac{\pi}{2}$. This is the only zero of $r$ in one turn. The tangent line at the pole is the line $\theta=\frac{\pi}{2}$.'
          - problem: 'The three-petal rose $r=\sin 3\theta$ passes through the pole. Find the angles $\theta$ with $0\le\theta<\pi$ of its tangent lines at the pole.'
            answer: '0, pi/3, 2pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve is at the pole when $\sin 3\theta=0$, so $3\theta=k\pi$ and $\theta=\frac{k\pi}{3}$. In $[0,\pi)$ this gives $\theta=0$, $\frac{\pi}{3}$ and $\frac{2\pi}{3}$. Each angle is a different line through the pole.'
          - problem: 'The circle $r=\sin\theta+\cos\theta$ passes through the pole. Find the angle $\theta$ with $0\le\theta<\pi$ of its tangent line at the pole.'
            answer: '3pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve is at the pole when $\sin\theta+\cos\theta=0$, so $\tan\theta=-1$. In $[0,\pi)$ the only solution is $\theta=\frac{3\pi}{4}$. The tangent line at the pole is the line $\theta=\frac{3\pi}{4}$.'
          - problem: 'The limaçon $r=1+2\cos\theta$ passes through the pole twice. Find the angles $\theta$ with $0\le\theta<\pi$ of its two tangent lines at the pole.'
            answer: 'pi/3, 2pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curve is at the pole when $\cos\theta=-\frac{1}{2}$, so $\theta=\frac{2\pi}{3}$ or $\theta=\frac{4\pi}{3}$. The line $\theta=\frac{4\pi}{3}$ is the same as the line $\theta=\frac{\pi}{3}$, because a line repeats every $\pi$. So the two tangent lines are at $\frac{\pi}{3}$ and $\frac{2\pi}{3}$.'
          - problem: 'The pickup pattern of a microphone at the origin is the cardioid $r=2+2\cos\theta$. The pattern reaches the microphone along exactly one straight line. Find the angle $\theta$ with $0\le\theta<\pi$ of that line.'
            answer: '0'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pattern is at the microphone when $2+2\cos\theta=0$, so $\cos\theta=-1$ and $\theta=\pi$. The line $\theta=\pi$ is the $x$-axis, which is the same line as $\theta=0$. In $[0,\pi)$ the angle of the line is $0$.'
          - problem: 'The radiation pattern of an antenna at the origin is the rose $r=5\sin 2\theta$, in kilometres. The pattern shrinks to the antenna along straight lines. Find the angles $\theta$ with $0\le\theta<\pi$ of these lines.'
            answer: '0, pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The pattern reaches the antenna when $5\sin 2\theta=0$, so $2\theta=k\pi$ and $\theta=\frac{k\pi}{2}$. In $[0,\pi)$ this gives $\theta=0$ and $\theta=\frac{\pi}{2}$. These are the two axes, so the lines are the $x$-axis and the $y$-axis.'
          - problem: 'What is the angle $\theta$ with $0\le\theta<\pi$ of the tangent line to the circle $r=2\cos\theta$ at the pole?'
            answer: 'pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At $\theta=0$ we have $r=2$, so that point is far from the pole. The curve is at the pole when $2\cos\theta=0$, so $\theta=\frac{\pi}{2}$. The tangent line at the pole is the line $\theta=\frac{\pi}{2}$, the $y$-axis.'
        constraints: 'pole tangents read off from the zeros of r; angles of lines taken in [0, pi)'
    diagnostic_exemplar:
      problem: 'Find the points where the circle $r = 2\sin\theta$ has a horizontal tangent, and give the tangent line to the curve at the pole.'
      answer: 'Horizontal tangents at the pole ($\theta = 0$) and at $(0, 2)$ ($\theta = \frac{\pi}{2}$); the tangent line at the pole is $\theta = 0$, the $x$-axis'
      answer_contract: {kind: none}
      solution_sketch: 'With $x = \sin 2\theta$ and $y = 1 - \cos 2\theta$, $\frac{dy}{d\theta} = 2\sin 2\theta$ vanishes at $\theta = 0, \frac{\pi}{2}$ while $\frac{dx}{d\theta} \ne 0$ there; the pole is reached at $\theta = 0$, which gives the tangent line there.'
    anki_seeds:
      - front: "Slope of a polar curve r = f(theta)?"
        back: '$\frac{dy}{dx} = \frac{\frac{dr}{d\theta}\sin\theta + r\cos\theta}{\frac{dr}{d\theta}\cos\theta - r\sin\theta}$ (parametrize $x = r\cos\theta$, $y = r\sin\theta$)'
        type: basic
      - front: "Tangent lines to a polar curve at the pole?"
        back: 'the rays $\theta = \theta_0$ at the angles where $r(\theta_0) = 0$'
        type: basic

  - id: polar-area
    name: Area in Polar Coordinates
    core: true
    difficulty: 0.68
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: graphing-polar-curves
        weight: 0.6
        key: true
      - id: trigonometric-integrals
        weight: 0.6
        key: true
      - id: definite-integrals-ftc
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: The polar area formula
        key_prerequisites: [graphing-polar-curves, definite-integrals-ftc]
        try_first:
          problem: 'A sector of a circle of radius $2$ has central angle $\frac{\pi}{2}$. What is its area?'
          answer_contract: {"kind": "exact"}
          answer: 'pi'
          reveal: 'The sector is one quarter of the circle, so its area is $\frac{1}{4}\pi\cdot 2^2=\pi$. The formula $\frac{1}{2}r^2\theta=\frac{1}{2}\cdot 4\cdot\frac{\pi}{2}$ gives the same value, and it also works when $r$ changes with $\theta$.'
        exemplars:
          - problem: 'Use the polar area formula to find the area enclosed by the circle $r=3$.'
            answer: '9pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $A=\frac{1}{2}\int_0^{2\pi}3^2\,d\theta=\frac{1}{2}\cdot 9\cdot 2\pi=9\pi$. This agrees with $\pi r^2$ for a circle of radius $3$.'
          - problem: 'Find the area of the sector of $r=2$ with $0\le\theta\le\frac{\pi}{3}$.'
            answer: '2pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $A=\frac{1}{2}\int_0^{\pi/3}2^2\,d\theta=\frac{1}{2}\cdot 4\cdot\frac{\pi}{3}=\frac{2\pi}{3}$. The result is the fraction $\frac{1}{6}$ of the circle $4\pi$.'
          - problem: 'Find the area of the sector of $r=5$ swept from $\theta=0$ to $\theta=\frac{\pi}{4}$.'
            answer: '25pi/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $A=\frac{1}{2}\int_0^{\pi/4}5^2\,d\theta=\frac{1}{2}\cdot 25\cdot\frac{\pi}{4}=\frac{25\pi}{8}$. The angle $\frac{\pi}{4}$ is one eighth of a full turn, so this is one eighth of the circle area $25\pi$.'
          - problem: 'Find the area swept by $r=3$ as $\theta$ runs from $\frac{\pi}{6}$ to $\frac{\pi}{2}$.'
            answer: '3pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The angle width is $\frac{\pi}{2}-\frac{\pi}{6}=\frac{\pi}{3}$. The area is $A=\frac{1}{2}\cdot 3^2\cdot\frac{\pi}{3}=\frac{3\pi}{2}$.'
          - problem: 'A sector of the circle $r=R$ with $0\le\theta\le\frac{\pi}{2}$ has area $25\pi$. Find $R$.'
            answer: '10'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area of the sector is $\frac{1}{2}R^2\cdot\frac{\pi}{2}=\frac{\pi R^2}{4}$. Setting $\frac{\pi R^2}{4}=25\pi$ gives $R^2=100$, so $R=10$.'
          - problem: 'A lawn sprinkler at the origin throws water up to $8$ m and sweeps from $\theta=\frac{\pi}{4}$ to $\theta=\frac{3\pi}{4}$. What area of lawn does it water?'
            answer: '16pi'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The sprinkler waters a sector of radius $8$ m. The angle width is $\frac{3\pi}{4}-\frac{\pi}{4}=\frac{\pi}{2}$, so $A=\frac{1}{2}\cdot 8^2\cdot\frac{\pi}{2}=16\pi$ square metres.'
          - problem: 'A pizza is the circle $r=15$ cm. One slice is a sector of area $75\pi$ cm$^2$. Through what angle, in radians, does the slice extend?'
            answer: '2pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area of a sector of angle $\alpha$ is $\frac{1}{2}\cdot 15^2\alpha=\frac{225}{2}\alpha$. Setting $\frac{225}{2}\alpha=75\pi$ gives $\alpha=\frac{150\pi}{225}=\frac{2\pi}{3}$.'
          - problem: 'A circular garden bounded by $r=12$ m is divided by rays from its centre into $8$ equal sectors. What is the area of one sector?'
            answer: '18pi'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'Each sector has angle $\frac{2\pi}{8}=\frac{\pi}{4}$. Its area is $\frac{1}{2}\cdot 12^2\cdot\frac{\pi}{4}=18\pi$ square metres, which is one eighth of $144\pi$.'
          - problem: 'What is the area of the sector of $r=6$ with $0\le\theta\le\frac{\pi}{2}$?'
            answer: '9pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $\frac{1}{2}\cdot 6^2\cdot\frac{\pi}{2}=9\pi$.'
        constraints: 'constant r; results checkable against circle/sector formulas; sectors in context, including division'
      - id: kp2
        name: Area inside cardioids and circles
        key_prerequisites: [trigonometric-integrals, definite-integrals-ftc]
        exemplars:
          - problem: 'Find the area enclosed by the circle $r=2\cos\theta$.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The circle is traced once for $-\frac{\pi}{2}\le\theta\le\frac{\pi}{2}$, so $A=\frac{1}{2}\int_{-\pi/2}^{\pi/2}4\cos^2\theta\,d\theta=\int_{-\pi/2}^{\pi/2}(1+\cos 2\theta)\,d\theta=\pi$. This is a circle of radius $1$.'
          - problem: 'Find the area enclosed by the cardioid $r=1+\cos\theta$.'
            answer: '3pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cardioid is traced once for $0\le\theta\le 2\pi$. So $A=\frac{1}{2}\int_0^{2\pi}(1+2\cos\theta+\cos^2\theta)\,d\theta=\frac{1}{2}(2\pi+0+\pi)=\frac{3\pi}{2}$.'
          - problem: 'Find the area enclosed by the circle $r=6\sin\theta$.'
            answer: '9pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The circle is traced once for $0\le\theta\le\pi$. So $A=\frac{1}{2}\int_0^{\pi}36\sin^2\theta\,d\theta=9\int_0^{\pi}(1-\cos 2\theta)\,d\theta=9\pi$. This is a circle of radius $3$.'
          - problem: 'Find the area enclosed by the cardioid $r=2+2\cos\theta$.'
            answer: '6pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $A=\frac{1}{2}\int_0^{2\pi}4(1+\cos\theta)^2\,d\theta=2(2\pi+0+\pi)=6\pi$, using $\int_0^{2\pi}\cos^2\theta\,d\theta=\pi$. The cardioid is traced once as $\theta$ runs from $0$ to $2\pi$, and the cross term $2\cos\theta$ integrates to $0$ over that turn.'
          - problem: 'Find the area enclosed by the limaçon $r=2+\cos\theta$.'
            answer: '9pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $A=\frac{1}{2}\int_0^{2\pi}(4+4\cos\theta+\cos^2\theta)\,d\theta=\frac{1}{2}(8\pi+0+\pi)=\frac{9\pi}{2}$. The limaçon is traced once for $0\le\theta\le 2\pi$, and the cross term $4\cos\theta$ integrates to $0$ over that turn.'
          - problem: 'Find the area enclosed by the cardioid $r=3-3\sin\theta$.'
            answer: '27pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The area is $A=\frac{1}{2}\int_0^{2\pi}9(1-2\sin\theta+\sin^2\theta)\,d\theta=\frac{9}{2}(2\pi+0+\pi)=\frac{27\pi}{2}$. The cardioid is traced once for $0\le\theta\le 2\pi$, and the cross term $-2\sin\theta$ integrates to $0$ over that turn.'
          - problem: 'A pond is bounded by the cardioid $r=5+5\cos\theta$, in metres. Find its area.'
            answer: '75pi/2'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The area is $A=\frac{1}{2}\int_0^{2\pi}25(1+\cos\theta)^2\,d\theta=\frac{25}{2}(2\pi+0+\pi)=\frac{75\pi}{2}$ square metres. The cardioid is traced once for $0\le\theta\le 2\pi$, and the cross term $2\cos\theta$ integrates to $0$ over that turn.'
          - problem: 'A circular basin is bounded by $r=a\sin\theta$, in metres, with the origin on its edge. The basin has area $16\pi$ m$^2$. Find $a$.'
            answer: '8'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The area is $A=\frac{1}{2}\int_0^{\pi}a^2\sin^2\theta\,d\theta=\frac{\pi a^2}{4}$. Setting $\frac{\pi a^2}{4}=16\pi$ gives $a^2=64$, so $a=8$.'
          - problem: 'What is the area of the circle $r=2\cos\theta$?'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Over $0\le\theta\le 2\pi$ the curve $r=2\cos\theta$ traces the circle twice, so integrating over that range counts it twice. One trace is $-\frac{\pi}{2}\le\theta\le\frac{\pi}{2}$, which gives the area $\pi$.'
        constraints: 'integrands expand to constants, cos theta, and cos^2 theta terms handled by half-angle identities; mind the tracing interval'
      - id: kp3
        name: Petal areas
        key_prerequisites: [graphing-polar-curves, trigonometric-integrals]
        exemplars:
          - problem: 'Find the area of one petal of the rose $r=\sin 2\theta$.'
            answer: 'pi/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One petal runs between consecutive zeros of $r$, $0\le\theta\le\frac{\pi}{2}$. Then $A=\frac{1}{2}\int_0^{\pi/2}\sin^2 2\theta\,d\theta=\frac{1}{2}\cdot\frac{\pi}{4}=\frac{\pi}{8}$.'
          - problem: 'Find the area of one petal of the rose $r=3\cos 3\theta$.'
            answer: '3pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One petal runs between consecutive zeros of $r$, $-\frac{\pi}{6}\le\theta\le\frac{\pi}{6}$. Then $A=\frac{1}{2}\int_{-\pi/6}^{\pi/6}9\cos^2 3\theta\,d\theta=\frac{9}{2}\cdot\frac{\pi}{6}=\frac{3\pi}{4}$.'
          - problem: 'Find the area of one petal of the rose $r=4\sin 3\theta$.'
            answer: '4pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One petal runs between the zeros $\theta=0$ and $\theta=\frac{\pi}{3}$. Then $A=\frac{1}{2}\int_0^{\pi/3}16\sin^2 3\theta\,d\theta=8\int_0^{\pi/3}\frac{1-\cos 6\theta}{2}\,d\theta=4\cdot\frac{\pi}{3}=\frac{4\pi}{3}$.'
          - problem: 'Find the area of one petal of the rose $r=5\cos 5\theta$.'
            answer: '5pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One petal runs between the zeros $\theta=-\frac{\pi}{10}$ and $\theta=\frac{\pi}{10}$. Then $A=\frac{1}{2}\int_{-\pi/10}^{\pi/10}25\cos^2 5\theta\,d\theta=\frac{25}{2}\cdot\frac{\pi}{10}=\frac{5\pi}{4}$.'
          - problem: 'Find the area of one petal of the rose $r=10\cos 2\theta$.'
            answer: '25pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One petal runs between the zeros $\theta=-\frac{\pi}{4}$ and $\theta=\frac{\pi}{4}$. Then $A=\frac{1}{2}\int_{-\pi/4}^{\pi/4}100\cos^2 2\theta\,d\theta=50\cdot\frac{\pi}{4}=\frac{25\pi}{2}$.'
          - problem: 'Find the area of one petal of the rose $r=7\sin 4\theta$.'
            answer: '49pi/16'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One petal runs between the zeros $\theta=0$ and $\theta=\frac{\pi}{4}$. Then $A=\frac{1}{2}\int_0^{\pi/4}49\sin^2 4\theta\,d\theta=\frac{49}{2}\cdot\frac{\pi}{8}=\frac{49\pi}{16}$.'
          - problem: 'A decorative window has the shape of the four-petal rose $r=8\sin 2\theta$, in centimetres. Find the area of one petal.'
            answer: '8pi'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "cm^2", "allow_omitted": true}
            solution_sketch: 'One petal runs between the zeros $\theta=0$ and $\theta=\frac{\pi}{2}$. Then $A=\frac{1}{2}\int_0^{\pi/2}64\sin^2 2\theta\,d\theta=32\cdot\frac{\pi}{4}=8\pi$ square centimetres.'
          - problem: 'Each petal of the three-petal rose $r=a\sin 3\theta$ has area $3\pi$ m$^2$, with $a$ in metres. Find $a$.'
            answer: '6'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'One petal has area $\frac{1}{2}\int_0^{\pi/3}a^2\sin^2 3\theta\,d\theta=\frac{\pi a^2}{12}$. Setting $\frac{\pi a^2}{12}=3\pi$ gives $a^2=36$, so $a=6$.'
          - problem: 'Find the total area enclosed by the three-petal rose $r=2\cos 3\theta$.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One petal has area $\frac{1}{2}\int_{-\pi/6}^{\pi/6}4\cos^2 3\theta\,d\theta=2\cdot\frac{\pi}{6}=\frac{\pi}{3}$. The rose has $3$ equal petals, so the total area is $3\cdot\frac{\pi}{3}=\pi$.'
          - problem: 'Find the total area enclosed by the four-petal rose $r=3\sin 2\theta$.'
            answer: '9pi/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'One petal has area $\frac{1}{2}\int_0^{\pi/2}9\sin^2 2\theta\,d\theta=\frac{9}{2}\cdot\frac{\pi}{4}=\frac{9\pi}{8}$. The rose has $4$ equal petals, so the total area is $4\cdot\frac{9\pi}{8}=\frac{9\pi}{2}$.'
        constraints: 'petal limits from consecutive zeros of r; half-angle identity does the integral; whole roses and unknown amplitudes appear as extras'
    diagnostic_exemplar:
      problem: 'Find the area of one petal of $r = 2\cos 2\theta$.'
      answer: '$\pi/2$'
      solution_sketch: 'One petal spans $-\frac{\pi}{4} \le \theta \le \frac{\pi}{4}$: $\frac{1}{2}\int_{-\pi/4}^{\pi/4} 4\cos^2 2\theta\,d\theta = 2 \cdot \frac{\pi}{4} = \frac{\pi}{2}$.'
    anki_seeds:
      - front: "Area formula in polar coordinates?"
        back: '$A = \frac{1}{2}\int_{\alpha}^{\beta} r^2 \, d\theta$'
        type: basic
      - front: "To find the theta-limits for one petal of a rose, use..."
        back: "two consecutive zeros of r"
        type: basic

  - id: polar-graphs-area
    name: Polar Graphs and Area
    core: false                # decorative/terminal polar application
    difficulty: 0.7
    drill: false
    answer_kind: numeric
    expected_time_secs: 240
    prerequisites:
      - id: polar-area
        weight: 0.8
        key: true
      - id: graphing-polar-curves
        weight: 0.4
      - id: trigonometric-integrals
        weight: 0.4
    knowledge_points:
      - id: kp1
        name: Intersections of polar curves
        key_prerequisites: [graphing-polar-curves, polar-area]
        exemplars:
          - problem: 'Find the angles $\theta$ with $0\le\theta<2\pi$ at which the curves $r=3$ and $r=6\cos\theta$ meet.'
            answer: 'pi/3, 5pi/3'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'Equating the radii gives $3=6\cos\theta$, so $\cos\theta=\frac{1}{2}$ and $\theta=\frac{\pi}{3}$ or $\theta=\frac{5\pi}{3}$. The circle $r=3$ never reaches the pole, so the pole is not a shared point.'
          - problem: 'The circles $r=2\sin\theta$ and $r=2\cos\theta$ meet at the pole and at one other point. Find the other point.'
            answer: '(1, 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Equating the radii gives $\tan\theta=1$, so $\theta=\frac{\pi}{4}$ and $r=\sqrt{2}$. Then $x=\sqrt{2}\cos\frac{\pi}{4}=1$ and $y=\sqrt{2}\sin\frac{\pi}{4}=1$. The other point is $(1,1)$.'
          - problem: 'The circles $r=2$ and $r=4\sin\theta$ meet at two points. Find the one with positive $x$-coordinate.'
            answer: '(sqrt(3), 1)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Equating the radii gives $4\sin\theta=2$, so $\sin\theta=\frac{1}{2}$ and $\theta=\frac{\pi}{6}$ or $\frac{5\pi}{6}$. For $\theta=\frac{\pi}{6}$, $x=2\cos\frac{\pi}{6}=\sqrt{3}$ and $y=2\sin\frac{\pi}{6}=1$. The point is $(\sqrt{3},1)$.'
          - problem: 'The circles $r=2$ and $r=4\cos\theta$ meet at two points. Find the one with positive $y$-coordinate.'
            answer: '(1, sqrt(3))'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Equating the radii gives $4\cos\theta=2$, so $\cos\theta=\frac{1}{2}$ and $\theta=\frac{\pi}{3}$ or $\frac{5\pi}{3}$. For $\theta=\frac{\pi}{3}$, $x=2\cos\frac{\pi}{3}=1$ and $y=2\sin\frac{\pi}{3}=\sqrt{3}$. The point is $(1,\sqrt{3})$.'
          - problem: 'The circle $r=2\cos\theta$ touches the circle $r=2$ at exactly one point. Find that point.'
            answer: '(2, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Equating the radii gives $2\cos\theta=2$, so $\cos\theta=1$ and $\theta=0$. Then $r=2$, so $x=2$ and $y=0$. The two circles touch only at $(2,0)$.'
          - problem: 'The circles $r=1$ and $r=2\cos\theta$ meet at two points. Find the one below the $x$-axis.'
            answer: '(1/2, -sqrt(3)/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Equating the radii gives $2\cos\theta=1$, so $\cos\theta=\frac{1}{2}$ and $\theta=\frac{\pi}{3}$ or $\frac{5\pi}{3}$. For $\theta=\frac{5\pi}{3}$, $x=\cos\frac{5\pi}{3}=\frac{1}{2}$ and $y=\sin\frac{5\pi}{3}=-\frac{\sqrt{3}}{2}$.'
          - problem: 'Two paths in a park, measured from the fountain at the origin with $x$ pointing east, are $r=6\cos\theta$ and $r=6\sin\theta$, in metres. They cross at the fountain and at one other place. How far east of the fountain is the other crossing?'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'Equating the radii gives $\tan\theta=1$, so $\theta=\frac{\pi}{4}$ and $r=3\sqrt{2}$. Then $x=3\sqrt{2}\cos\frac{\pi}{4}=3$. The other crossing is $3$ m east of the fountain.'
          - problem: 'A radar at the origin covers the disc $r\le 5$ km, and a second station covers the disc $r\le 10\sin\theta$ km. The boundaries cross at two points. Find the eastern one.'
            answer: '(5*sqrt(3)/2, 5/2)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'Equating the radii gives $10\sin\theta=5$, so $\sin\theta=\frac{1}{2}$ and $\theta=\frac{\pi}{6}$ or $\frac{5\pi}{6}$. The eastern point has $\theta=\frac{\pi}{6}$, so $x=5\cos\frac{\pi}{6}=\frac{5\sqrt{3}}{2}$ and $y=5\sin\frac{\pi}{6}=\frac{5}{2}$.'
          - problem: 'Setting $1+\cos\theta=1-\cos\theta$ to find where the cardioids $r=1+\cos\theta$ and $r=1-\cos\theta$ meet gives two points, $(0,1)$ and $(0,-1)$. The cardioids also meet at a third point. Find it.'
            answer: '(0, 0)'
            answer_contract: {"kind": "coordinates", "arity": 2}
            solution_sketch: 'The first cardioid reaches the pole at $\theta=\pi$ and the second at $\theta=0$. The two radii are never both $0$ at the same angle, so solving $r_1=r_2$ misses the pole. The third point is the pole, $(0,0)$.'
        constraints: 'intersections at special angles; always check the pole separately; points are reported in rectangular form unless angles are asked'
      - id: kp2
        name: Area between polar curves
        key_prerequisites: [polar-area, trigonometric-integrals]
        try_first:
          problem: 'The area inside $r=3$ is $9\pi$ and the area inside $r=1$ is $\pi$. What is the area of the ring between the two circles?'
          answer_contract: {"kind": "exact"}
          answer: '8pi'
          reveal: 'The ring is the larger area minus the smaller one, $9\pi-\pi=8\pi$. In the formula this is $\frac{1}{2}\int_0^{2\pi}(3^2-1^2)\,d\theta$, so the squares of the radii are subtracted, not the radii.'
        exemplars:
          - problem: 'Find the area inside the cardioid $r=1+\cos\theta$ and outside the circle $r=1$.'
            answer: '2 + pi/4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curves meet at $\theta=\pm\frac{\pi}{2}$, so $A=\frac{1}{2}\int_{-\pi/2}^{\pi/2}\left[(1+\cos\theta)^2-1\right]d\theta=\frac{1}{2}\int_{-\pi/2}^{\pi/2}(2\cos\theta+\cos^2\theta)\,d\theta=\frac{1}{2}\left(4+\frac{\pi}{2}\right)=2+\frac{\pi}{4}$. The cardioid lies outside the circle exactly where $\cos\theta\ge 0$, which is why the limits are $\pm\frac{\pi}{2}$.'
          - problem: 'Find the area inside the circle $r=2\cos\theta$ and outside the circle $r=1$.'
            answer: 'pi/3 + sqrt(3)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curves meet at $\theta=\pm\frac{\pi}{3}$, so $A=\frac{1}{2}\int_{-\pi/3}^{\pi/3}(4\cos^2\theta-1)\,d\theta=\frac{1}{2}\int_{-\pi/3}^{\pi/3}(1+2\cos 2\theta)\,d\theta=\frac{1}{2}\left(\frac{2\pi}{3}+\sqrt{3}\right)=\frac{\pi}{3}+\frac{\sqrt{3}}{2}$. The circle $r=2\cos\theta$ lies outside $r=1$ exactly where $\cos\theta\ge\frac{1}{2}$, which is why the limits are $\pm\frac{\pi}{3}$.'
          - problem: 'Find the area inside the cardioid $r=2+2\sin\theta$ and outside the circle $r=2$.'
            answer: '8 + pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cardioid is outside the circle for $0\le\theta\le\pi$. So $A=\frac{1}{2}\int_0^{\pi}\left[(2+2\sin\theta)^2-4\right]d\theta=\frac{1}{2}\int_0^{\pi}(8\sin\theta+4\sin^2\theta)\,d\theta=\frac{1}{2}(16+2\pi)=8+\pi$.'
          - problem: 'Find the area inside the circle $r=6\sin\theta$ and outside the circle $r=3$.'
            answer: '3pi + 9sqrt(3)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curves meet where $\sin\theta=\frac{1}{2}$, so $\theta=\frac{\pi}{6}$ and $\frac{5\pi}{6}$. Then $A=\frac{1}{2}\int_{\pi/6}^{5\pi/6}(36\sin^2\theta-9)\,d\theta=\frac{1}{2}\int_{\pi/6}^{5\pi/6}(9-18\cos 2\theta)\,d\theta=\frac{1}{2}(6\pi+9\sqrt{3})=3\pi+\frac{9\sqrt{3}}{2}$.'
          - problem: 'Find the area inside the circle $r=2\cos\theta$ and outside the circle $r=\sqrt{2}$.'
            answer: '1'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curves meet where $2\cos\theta=\sqrt{2}$, so $\theta=\pm\frac{\pi}{4}$. Then $A=\frac{1}{2}\int_{-\pi/4}^{\pi/4}(4\cos^2\theta-2)\,d\theta=\frac{1}{2}\int_{-\pi/4}^{\pi/4}2\cos 2\theta\,d\theta=\frac{1}{2}\cdot 2=1$.'
          - problem: 'Find the area inside the cardioid $r=1+\cos\theta$ and outside the cardioid $r=1-\cos\theta$.'
            answer: '4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The first cardioid is the larger one for $-\frac{\pi}{2}\le\theta\le\frac{\pi}{2}$. Then $A=\frac{1}{2}\int_{-\pi/2}^{\pi/2}\left[(1+\cos\theta)^2-(1-\cos\theta)^2\right]d\theta=\frac{1}{2}\int_{-\pi/2}^{\pi/2}4\cos\theta\,d\theta=2\cdot 2=4$.'
          - problem: 'Find the area inside the circle $r=3\cos\theta$ and outside the cardioid $r=1+\cos\theta$.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curves meet where $3\cos\theta=1+\cos\theta$, so $\cos\theta=\frac{1}{2}$ and $\theta=\pm\frac{\pi}{3}$. Then $A=\frac{1}{2}\int_{-\pi/3}^{\pi/3}\left[9\cos^2\theta-(1+\cos\theta)^2\right]d\theta=\frac{1}{2}\int_{-\pi/3}^{\pi/3}(3+4\cos 2\theta-2\cos\theta)\,d\theta=\frac{1}{2}\cdot 2\pi=\pi$.'
          - problem: 'A garden is the region inside the circle $r=8\cos\theta$ and outside the circle $r=4$, with lengths in metres. What is its area?'
            answer: '16pi/3 + 8sqrt(3)'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The circles meet where $8\cos\theta=4$, so $\theta=\pm\frac{\pi}{3}$. Then $A=\frac{1}{2}\int_{-\pi/3}^{\pi/3}(64\cos^2\theta-16)\,d\theta=\frac{1}{2}\int_{-\pi/3}^{\pi/3}(16+32\cos 2\theta)\,d\theta=\frac{1}{2}\left(\frac{32\pi}{3}+16\sqrt{3}\right)=\frac{16\pi}{3}+8\sqrt{3}$ square metres.'
          - problem: 'The detection zone of a sensor at the origin is bounded by the cardioid $r=4+4\cos\theta$, with lengths in kilometres. A no-fly circle $r=4$ is centred at the sensor. What is the area, in square kilometres, of the part of the zone outside the circle?'
            answer: '32 + 4pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The cardioid is outside the circle for $-\frac{\pi}{2}\le\theta\le\frac{\pi}{2}$. So $A=\frac{1}{2}\int_{-\pi/2}^{\pi/2}\left[16(1+\cos\theta)^2-16\right]d\theta=8\int_{-\pi/2}^{\pi/2}(2\cos\theta+\cos^2\theta)\,d\theta=8\left(4+\frac{\pi}{2}\right)=32+4\pi$.'
          - problem: 'The region inside the cardioid $r=a(1+\cos\theta)$ and outside the circle $r=a$ has area $18+\frac{9\pi}{4}$ m$^2$, with $a$ in metres. Find $a$.'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'For $r=a(1+\cos\theta)$ and $r=a$ the area is $a^2\left(2+\frac{\pi}{4}\right)$, because scaling both radii by $a$ scales the area by $a^2$. Setting $a^2\left(2+\frac{\pi}{4}\right)=9\left(2+\frac{\pi}{4}\right)$ gives $a^2=9$, so $a=3$.'
          - problem: 'What is the area inside the circle $r=3\cos\theta$ and outside the circle $r=\frac{3}{2}$?'
            answer: '3pi/4 + 9sqrt(3)/8'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The radii must be squared before they are subtracted. The integrand is $\frac{1}{2}\left[(3\cos\theta)^2-\left(\frac{3}{2}\right)^2\right]$, which gives $\frac{1}{2}\int_{-\pi/3}^{\pi/3}\left(\frac{9}{4}+\frac{9}{2}\cos 2\theta\right)d\theta=\frac{1}{2}\left(\frac{3\pi}{2}+\frac{9\sqrt{3}}{4}\right)=\frac{3\pi}{4}+\frac{9\sqrt{3}}{8}$.'
        constraints: 'area differences of the form (outer)^2 - (inner)^2 over a symmetric interval; intersections at special angles; includes garden, sensor and find-the-scale items'
      - id: kp3
        name: Composite regions
        key_prerequisites: [polar-area, trigonometric-integrals]
        exemplars:
          - problem: 'Find the area inside the circle $r=3\sin\theta$ and outside the cardioid $r=1+\sin\theta$.'
            answer: 'pi'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The curves meet where $\sin\theta=\frac{1}{2}$, so $\theta=\frac{\pi}{6}$ and $\frac{5\pi}{6}$. Then $A=\frac{1}{2}\int_{\pi/6}^{5\pi/6}\left[9\sin^2\theta-(1+\sin\theta)^2\right]d\theta=\frac{1}{2}\int_{\pi/6}^{5\pi/6}(3-4\cos 2\theta-2\sin\theta)\,d\theta=\frac{1}{2}\cdot 2\pi=\pi$.'
          - problem: 'Find the area of the inner loop of the limaçon $r=1+2\cos\theta$.'
            answer: 'pi - 3sqrt(3)/2'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The inner loop is traced between the zeros of $r$, $\theta=\frac{2\pi}{3}$ and $\theta=\frac{4\pi}{3}$. Then $A=\frac{1}{2}\int_{2\pi/3}^{4\pi/3}(1+2\cos\theta)^2\,d\theta=\frac{1}{2}\int_{2\pi/3}^{4\pi/3}(3+4\cos\theta+2\cos 2\theta)\,d\theta=\frac{1}{2}(2\pi-3\sqrt{3})=\pi-\frac{3\sqrt{3}}{2}$.'
          - problem: 'Two circular lawns have radius $3$ m. The centre of the first is at the origin. The centre of the second is $3$ m east of the origin, so its boundary is $r=6\cos\theta$. What is the area of the overlap of the two lawns?'
            answer: '6pi - 9sqrt(3)/2'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The boundaries meet where $6\cos\theta=3$, so $\theta=\pm\frac{\pi}{3}$. For $|\theta|\le\frac{\pi}{3}$ the overlap is bounded by $r=3$, and for $\frac{\pi}{3}\le\theta\le\frac{\pi}{2}$ by $r=6\cos\theta$. So $A=\frac{1}{2}\cdot 9\cdot\frac{2\pi}{3}+2\cdot\frac{1}{2}\int_{\pi/3}^{\pi/2}36\cos^2\theta\,d\theta=3\pi+\left(3\pi-\frac{9\sqrt{3}}{2}\right)=6\pi-\frac{9\sqrt{3}}{2}$ square metres.'
          - problem: 'Find the area of the region inside the outer loop of the limaçon $r=1+2\cos\theta$ but outside its inner loop.'
            answer: 'pi + 3sqrt(3)'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'The outer loop is traced for $-\frac{2\pi}{3}\le\theta\le\frac{2\pi}{3}$ and has area $\frac{1}{2}\int_{-2\pi/3}^{2\pi/3}(1+2\cos\theta)^2\,d\theta=2\pi+\frac{3\sqrt{3}}{2}$. The inner loop lies inside it and has area $\pi-\frac{3\sqrt{3}}{2}$. The difference is $\pi+3\sqrt{3}$.'
          - problem: 'Find the area inside both cardioids $r=1+\cos\theta$ and $r=1-\cos\theta$.'
            answer: '3pi/2 - 4'
            answer_contract: {"kind": "exact"}
            solution_sketch: 'At each angle the smaller radius is $1-|\cos\theta|$. So $A=\frac{1}{2}\int_0^{2\pi}(1-|\cos\theta|)^2\,d\theta=\frac{1}{2}\left(2\pi-8+\pi\right)=\frac{3\pi}{2}-4$, using $\int_0^{2\pi}|\cos\theta|\,d\theta=4$.'
          - problem: 'A garden bed has the shape of the inner loop of the limaçon $r=2+4\cos\theta$, with lengths in metres. What is its area?'
            answer: '4pi - 6sqrt(3)'
            answer_contract: {"kind": "unit", "quantity": "area", "unit": "m^2", "allow_omitted": true}
            solution_sketch: 'The inner loop is traced between the zeros $\theta=\frac{2\pi}{3}$ and $\theta=\frac{4\pi}{3}$. Then $A=\frac{1}{2}\int_{2\pi/3}^{4\pi/3}4(1+2\cos\theta)^2\,d\theta=4\left(\pi-\frac{3\sqrt{3}}{2}\right)=4\pi-6\sqrt{3}$ square metres.'
          - problem: 'The inner loop of the limaçon $r=a(1+2\cos\theta)$ has area $9\pi-\frac{27\sqrt{3}}{2}$ m$^2$, with $a$ in metres. Find $a$.'
            answer: '3'
            answer_contract: {"kind": "unit", "quantity": "length", "unit": "m", "allow_omitted": true}
            solution_sketch: 'The inner loop has area $a^2\left(\pi-\frac{3\sqrt{3}}{2}\right)$. Setting $a^2\left(\pi-\frac{3\sqrt{3}}{2}\right)=9\left(\pi-\frac{3\sqrt{3}}{2}\right)$ gives $a^2=9$, so $a=3$.'
        constraints: 'limits from intersections or zeros of r; integrands expand to constants, cos, and cos^2 terms; lens, loop and scaling items in context'
    diagnostic_exemplar:
      problem: 'Find the area inside both $r = 1$ and $r = 2\sin\theta$.'
      answer: '$\frac{2\pi}{3} - \frac{\sqrt{3}}{2}$'
      solution_sketch: 'Curves meet at $\theta = \frac{\pi}{6}, \frac{5\pi}{6}$; use $r = 2\sin\theta$ on $[0, \frac{\pi}{6}] \cup [\frac{5\pi}{6}, \pi]$ and $r = 1$ between: $2 \cdot \frac{1}{2}\int_0^{\pi/6} 4\sin^2\theta\,d\theta + \frac{1}{2}\cdot\frac{2\pi}{3} = \frac{2\pi}{3} - \frac{\sqrt{3}}{2}$.'
    anki_seeds:
      - front: "Why can polar intersections be missed by just solving f(theta) = g(theta)?"
        back: "curves can meet at the pole (r = 0) at different theta values, and points have multiple representations — check the pole separately"
        type: basic
      - front: "Area between two polar curves over [alpha, beta]?"
        back: '$\frac{1}{2}\int_{\alpha}^{\beta}\left(r_{\text{outer}}^2 - r_{\text{inner}}^2\right) d\theta$'
        type: basic
